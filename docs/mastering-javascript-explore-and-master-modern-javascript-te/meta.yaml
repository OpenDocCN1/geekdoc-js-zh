    # Automatic semicolon insertion


    Although JavaScript is based on the C style syntax, it does not enforce the use
    of semicolons in the source code.


    However, JavaScript is not a semicolon-less language. A JavaScript language parser
    needs the semicolons in order to understand the source code. Therefore, the JavaScript
    parser automatically inserts them whenever it encounters a parse error due to
    a missing semicolon. It is important to note that automatic semicolon insertion
    (ASI) will only take effect in the presence of a newline (also known as a break).
    Semicolons are not inserted in the middle of a line.


    Basically, the JavaScript parser parses a line where a parser error would occur
    (a missing expected :) and it can insert it, only so. What are the criteria to
    insert a semicolon? Only if there''s nothing but white space and/or comments between
    the end of some statement and that line''s newline / line break.


    There have been raging debates on ASI – a feature justifiable to be a very bad
    design choice. There have been epic discussions on the Internet, such as https://github.com/twbs/bootstrap/issues/3057
    and https://breandeich.com/2012/04/the-internal-semicolon/'
