  md: "The (function foo() {}) statement as an expression means that the identifier\
    \ foo is found only in the scope of the foo() function, not in the outer scope.\
    \ Hiding the name foo in itself means that it does not pollute the enclosing scope\
    \ unnecessarily. This is so useful and far better. We add () after the function\
    \ expression to execute it immediately. The complete pattern looks as follows:\n\
    \n```\nfunction foo(){ /* code */ }();\n```\n\nThis pattern is so common that\
    \ it has a name: IIFE, which stands for Immediately Invoked Function Expression.\
    \ Several programmers omit the function name when they use IIFE. As the primary\
    \ use of IIFE is to introduce function-level scope, naming the function is not\
    \ really required. You can write the earlier example as follows:\n\n```\nvar a\
    \ = 1;\nfunction() {\n  var a = 2;\n  console.log( a ); // 2\n}();\nconsole.log(\
    \ a ); // 1\n```\n\nHere we are creating an anonymous function as IIFE. While\
    \ this is identical to the earlier named IIFE, there are a few drawbacks of anonymous\
    \ IIFEs:\n\n+   * As you can't see the function name in the stack traces, debugging\
    \ such code is very difficult\n* You cannot use recursion on anonymous functions\
    \ (as we discussed earlier)\n* Overusing anonymous IIFEs results in unreadable\
    \ code\n\nDouglas Crockford and a few other experts recommend a slight variation\
    \ of IIFE:\n\n```\n(function() { /* code */ }());\n```\n\nBoth IIFE forms are\
    \ popular and you will see a lot of code using these these variations.\n\nYou\
    \ can pass parameters to IIFEs. The following example shows how to pass parameters\
    \ to IIFEs:\n\n```\nfunction foo(b) {\n  var a = 2;\n  console.log( a + b);\n\
    }(3); // prints 5\n```"
