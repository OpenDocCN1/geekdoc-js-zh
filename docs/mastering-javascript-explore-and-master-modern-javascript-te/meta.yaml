  md: '# Testing and Debugging


    As you write JavaScript applications, you will soon realize that having a sound
    testing strategy is indispensable. In fact, not writing enough tests is almost
    always a bad idea. It is essential to cover all the non-trivial functionality
    of your code to make sure of the following points:


    +   - The existing code behaves as per the specifications

    - Any new code does not break the behavior defined by the specifications


    Both these points are very more important. Many engineers consider only the first
    point the sole reason to cover your code with enough tests. The most obvious advantage
    of test coverage is to really make sure that the code being pushed to the production
    system is mostly error-free. Writing test cases to smartly cover the maximum functional
    areas of the code gives you a good indication about the overall quality of the
    code. There should be no arguments or compromises around this point. It is unfortunate
    though that many production systems are still bere of adequate code coverage.
    It is very important to build an engineering culture where developers think about
    writing tests as much as they think about writing code.


    The second point is even more important. Legacy systems are usually very difficult
    to manage. When you are working on code written either by someone or a large distributed
    team, it is easy to introduce bugs and break things. Even the best engineers make
    mistakes. When you are working on a large code base that you are unfamiliar with
    and if there is no sound test coverage to help you, you will introduce bugs. As
    you won''t have the confidence in the changes that you are making (because there
    are no test cases to confirm your changes), your code releases will be shaky,
    slow, and obviously full of hidden bugs.'
