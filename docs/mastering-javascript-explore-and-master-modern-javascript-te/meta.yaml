  md: "Methods are properties of an object that can hold function values as follows:\n\
    \n```\nvar meetingRoom = {};\nmeetingRoom.book = function(roomId) {\n  console.log(\"\
    booked meeting room \"+roomIdId);\n}\nmeetingRoom.book(\"VL\");\n```\n\n# # Prototypes\n\
    \nApart from the properties that we add to an object, there is one default property\
    \ for almost all objects, called a prototype. When an object does not have a requested\
    \ property, JavaScript will go to its prototype to look for it. The getPrototypeOf\
    \ returns the prototype of an object.\n\nMany programmers consider prototypes\
    \ related to objects' inheritance—they are a way of defining object types—but\
    \ fundamentally, they are closely associated with functions.\n\nPrototypes are\
    \ used as a way to define properties and functions that will be applied to instances\
    \ of objects. The prototype's properties eventually become properties of the instantiated\
    \ objects. Prototypes can be seen as blueprints for object creation. They can\
    \ be seen as analogous to classes in object-oriented languages. Prototypes in\
    \ JavaScript are used to write a classical style object-oriented code and mimic\
    \ classical inheritance. Let's revisit our earlier example:\n\n```\nvar author\
    \ = {};\nauthor.firstname = 'Douglas';\nauthor.lastname = 'Crockford';\",\n```\n\
    \nIn the preceding snippet, we are creating an object and assigning individual\
