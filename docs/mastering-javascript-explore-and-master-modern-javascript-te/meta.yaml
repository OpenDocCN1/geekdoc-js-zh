  md: "Chapter 1\n\n# # How to use this book\n\nThis book is not going to help if\
    \ you are going to get things done quickly. This book is going to focus on the\
    \ correct ways to code in JavaScript. We are going to spend a lot of time understanding\
    \ how to avoid the bad parts of the language and build reliable and readable code\
    \ in JavaScript. We will skirt away from sloppy features of the language just\
    \ to make sure you are not getting used to—if you have already learned to code\
    \ using these habits, this book will try to nudge you away from this. There will\
    \ be a lot of focus on the correct style and tools to make your code better.\n\
    \nMost of the concepts in this book are going to be examples and patterns from\
    \ real-world problems. I will insist that you code each of the snippets to make\
    \ sure that your understanding of the concept is getting programmed into your\
    \ muscle memory. Trust me on this, there is no better way to learn programming\
    \ than writing a lot of code.\n\nTypically, you will need to encode an HTML page\
    \ to run an embedded JavaScript code as:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <script type=\"text/javascript\" src=\"script.js\"></script>\n  <script type=\"\
    text/javascript\">\n    var x = \"Hello World\";\n    console.log(x);\n  </script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\nThis sample code shows two ways in which\
    \ JavaScript is embedded into the HTML page. First, the <script> tag in <head>\
    \ imports JavaScript, while the second <script> tag is used to embed inline JavaScript.\n\
    \n> Downloading the example codenYou can download the example code files from\
    \ your account at http://www.packtpub.com for all Packt Publishing books you have\
    \ purchased. If you purchased this book elsewhere, you can visit http://www.packtpub.com/support\
    \ and register to have the e-mailed directly to you.\n\n[3]"
