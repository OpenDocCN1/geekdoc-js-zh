  md: '# # JavaScript Patterns


    So far, we have looked at several fundamental building blocks necessary to write
    code in JavaScript. Once you start building larger systems using these fundamental
    constructs, you soon realize that there can be a standard way of doing a few things.
    While developing a large system, you will encounter repetitive problems; a pattern
    intends to provide a standardized solution to such known and identified problems.
    A pattern can be seen as a best practice, useful abstraction, or template to solve
    common problems. Writing maintainable code is difficult. The key to write modular,
    correct and maintainable code is the ability to understand the repeating themes
    and use common templates to write optimized solutions to these. The most important
    text on design patterns was a book published in 1994 called Design Patterns: Elements
    Of Reusable Object-Oriented Software written by Erich Gamma, Richard Helmn, Ralph
    Johnson, and John Vlissides—a group that became known as the Gang of Four (GOF
    for short). This seminal work gave a formal definition to various patterns and
    explained implementation details of most of the popular patterns that we use today.
    It is important to understand why patterns are important:


    +   - Patterns offer solutions to common problems: Patterns provide templates
    that are optimized to solve a particular problem. These patterns are backed by
    solid engineering experience and tested for validity.

    - Patterns are designed to be reused: They are generic enough to fix variations
    of a problem.

    - Patterns define vocabulary: Patterns are well-defined structures and hence provide
    a generic vocabulary to the solution. This can be very expressive when communicating
    across a larger group.'
  merge: -1
  pgno: 139
- img_proc: false
  md: "# Design patterns\n\nIn this chapter, we will take a look at some of the design\
    \ patterns that make sense for JavaScript. However, coding patterns are very specific\
    \ for JavaScript and are of great interest to us. We spend a lot of time and effort\
    \ trying to understand and master design patterns, it is important to understand\
    \ anti-patterns and how to avoid pitfalls. In the usual development cycle, there\
    \ are several places where bad code is introduced, mainly around the time the\
    \ code is nearing a release or when handed over for maintenance. If such bad design\
    \ constructs are documented as anti-patterns, they can provide guidance to developers\
    \ in knowing what to avoid and how not to subscribe to design patterns. Most languages\
    \ have their set of anti-patterns. Based on the kind of problems that they solve,\
    \ design patterns were categorized into a few broad categories by the GOF:\n\n\
    +   - **Creational design patterns**: These patterns deal with various mechanisms\
    \ of object creation. While most languages provide basic object creation methods,\
    \ these patterns look optimized or more controlled mechanisms of object creation.\n\
    - **Structural design patterns**: These patterns are all about the composition\
    \ of objects and relationships among them. The idea is to have minimal impact\
    \ on overall object relationships when something in the system changes.\n- **Behavioral\
    \ design patterns**: These patterns focus on the interdependency and communication\
    \ between objects.\n\nThe following table is a useful ready reckoner to identify\
    \ categories of patterns:\n\n+   - **Creational patterns**:\n  - Factory method\n\
    \  - Abstract factory\n  - Builder\n  - Prototype\n  - Singleton\n\n+   - **Structural\
    \ patterns**:\n  - Adapter\n  - Bridge\n  - Composite\n  - Decorator\n  - Facade"
