  md: 'These shortcuts are valuable in writing concise RegEx. Consider this example:


    ```

    var strMatch = ''123-456-7890'';

    var re = /[0-9] [0-9]-[0-9] [0-9]/;

    var arrMatches = strMatch.match(re);

    console.log(arrMatches);

    //[''123-456]

    ```


    This expression definitely looks a bit strange. We can replace [0-9] with \d and
    make this a bit more readable:


    ```

    var strMatch = ''123-456-7890'';

    var re = /\d\d-\d\d\d\d/;

    var arrMatches = strMatch.match(re);

    console.log(arrMatches);

    //[''123-456]

    ```


    However, you will see that there are even better ways to do something like this:


    # Repeated occurrences


    So far, we saw how we can fix characters or numeric patterns. Most often, you
    want to handle certain repetitive natures of patterns also. For example, if I
    want to match 4 as, /aaaa/, but what if I want to specify a pattern that can match
    any number of as?


    Regular expressions provide you with a wide variety of repetition quantifiers.
    Repetition quantifiers let us specify how many times a particular pattern can
    occur. We can specify fixed values (characters should appear n times) and variable
    values (characters can appear at least n times until they appear m times). The
    following table lists the repetition quantifiers:


    +   * ?: Either 0 or 1 occurrence (marks the occurrence as optional)

    * *: 0 or more occurrences

    * ''+'': 1 or more occurrences

    * {n}: Exactly n occurrences

    * {n,m}: Occurrences between n and m

    * {n,}: At least an n occurrence

    * {,n}: 0 to n occurs'
