  md: 'Often, you want to match a sequence of letters or numbers on their own and
    not just as a substring. This is a fairly common use case when you are matching
    words that are not just part of any other words. We can specify the word boundaries
    by using the \b boundary. The word boundary by \b matches the position where one
    side is a word character (letter, digit, or underscore) and the other side is
    not. Consider the following examples.


    The following is a simple literal match. This match will also be successful if
    cat is part of a substring:


    ```

    console.log(/cat/).test(''a black cat'')); //true

    ```


    However, in the following example, we define a word boundary by indicating \b
    before the word cat—this means we want to match only if cat is a word and not
    a substring. The boundary is established before cat, and hence a match is found
    on the text, a black cat:


    ```

    console.log(/\bcat/).test(''a black cat'')); //true

    ```


    When we use the same boundary with the word tomcat, we get a failed match because
    there is no word boundary before cat in the word tomcat:


    ```

    console.log(/\bcat/).test(''tomcat'')); //false

    ```


    There is a word boundary after the string cat in the word tomcat, hence the following
    is a successful match:


    ```

    console.log(/cat\b/).test(''tomcat'')); //true

    ```


    In the following example, we define the word boundary before and after the word
    cat to indicate that we want cat to be a standalone word with boundaries before
    and after:


    ```

    console.log(/\bcat\b/).test(''a black cat'')); //true

    ```


    Based on the same logic, the following match fails because there are no boundaries
    before and after cat in the word concatenate:


    ```

    console.log(/\bcat\b/).test("concatenate")); //false

    ```'
