  md: "# JavaScript Patterns\n\nWe are creating all this in the global scope. This\
    \ is an anti-pattern, and this is never a good idea. We can, however, refactor\
    \ this code and create a single global object make all the functions and objects\
    \ part of this global object as follows:\n\n```\n// Single global object\nvar\
    \ CARFACTORY = CARFACTORY || {};\nCARFACTORY.Car = function () {};\nCARFACTORY.BMW\
    \ = function () {};\nCARFACTORY.engines = 1;\nCARFACTORY.features = {\n  seats:\
    \ 6,\n  airbags: 6\n};\n```\n\nBy convention, the global namespace object is generally\
    \ written in all caps. This pattern adds namespace to the application and prevents\
    \ naming collisions in your code between your code and external library that you\
    \ use. Many projects use a distinct name after their company or project to create\
    \ a unique name for their namespace.\n\nThough this seems like an ideal to restrict\
    \ your globals and add a namespace to your code, it is a bit verbose; you need\
    \ to fix every variable and function with the namespace. You need to type more\
    \ and the code becomes unnecessarily verbose. Additionally, a single global instance\
    \ would mean that any part of the code can modify the global instance and the\
    \ rest of the functionality gets updated state—this can cause very nasty side-effects.\
    \ A curious thing to observe in the earlier example is var CARFACTORY = CARFACTORY\
    \ || {}; When you are working on a large code base, you can't assume that you\
    \ are creating this namespace (or assigning a property to it) for the first time.\
    \ It is possible that the namespace may pre-exist. To make sure that you create\
    \ the namespace only if it is not already created, it is safe to always rely on\
    \ the quick defaulting via a short-circuit || operator.\n\n# The module pattern\n\
    \nAs you build large applications, you will realize that it becomes increasingly\
    \ difficult to keep the code base organized and modular. The module patterns help\
    \ in keeping the code cleanly separated and organized.\n\nModule separates bigger\
    \ programs into smaller pieces and gives them a namespace. This is very important\
    \ because you separate code into modules, these modules can be be reused in several\
    \ places. Carefully designing interfaces for the modules will make your code very\
    \ easy to reuse and extend.\n\n[ 124 ]"
