  md: "# Chapter 4\n\nWhen you run this example, you will see that Instance method\
    \ says - he is hired is printed. The isAvailable() function defined in the Player()\
    \ function is called an instance of Player. This means that after attaching properties\
    \ via the prototype, you can use this keyword to initialize properties in constructor.\
