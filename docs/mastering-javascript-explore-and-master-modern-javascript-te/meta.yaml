  md: "# Object-Oriented JavaScript\n\n```\nfunction Child() {\n  Child.prototype\
    \ = new Person();\n  var aChild = new Child();\n  console.log(aChild instanceof\
    \ Child); //true\n  console.log(aChild instanceof Person); //true\n  console.log(aChild\
    \ instanceof Object); //true\n```\n\nThe changed line uses an instance of Person\
    \ as the prototype of Child. This is an important distinction from the earlier\
    \ method. Here we are declaring that child IS-A person.\n\nWe discussed how JavaScript\
    \ looks for a property up the prototype chain till it reaches Object.prototype.\
    \ Let's discuss the concept of prototype chains in detail and try to design the\
    \ following employee hierarchy:\n\n![](bbox=[0.31, 0.368, 0.69, 0.7])\n\nThis\
    \ is a typical pattern of inheritance. A manager IS-A(n) employee. Manager has\
    \ common properties inherited from Employee. It can have an array of reportees.\
    \ An Individual Contributor is also based on an employee but he does not have\
    \ any reportees. A Team Lead is derived from a Manager with a few functions that\
    \ are different from a Manager. What we are doing essentially is that each child\
    \ is deriving properties from its parent (Manager being the parent and Team Lead\
    \ being the child)."
