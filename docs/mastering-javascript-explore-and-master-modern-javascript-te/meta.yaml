  md: "# Object-Oriented JavaScript\n\n```\n{\n  \"firstname\": \"Douglas\",\n  \"\
    lastname\": \"Crockford\"\n}\n```\n\nA property's name can be any string or an\
    \ empty string. You can omit quotes around the property name if it is a legal\
    \ JavaScript name. So quotes are required around first-name but are optional around\
    \ firstname. Commas are used to separate the pairs. You can nest objects such\
    \ as:\n\n```\nvar author = {\n  firstname : \"Douglas\",\n  lastname : \"Crockford\"\
    ,\n  book : {\n    title: \"JavaScript- The Good Parts\",\n    pages: \"172\"\n\
    \  }\n};\n```\n\nProperties of an object can be accessed by two notations: the\
    \ array-like notation and dot notation. According to the array-like notation,\
    \ you can retrieve the value from an object by wrapping a string in []. If the\
    \ expression is a valid JavaScript name, you can use the dot notation using .\
    \ instead. Using . is a preferred method of retrieving values from an object:\n\
    \n```\nconsole.log(author['firstname']); //Douglas\nconsole.log(author.lastname);\
    \ //Crockford\nconsole.log(author.book.title); //JavaScript- The Good Parts\n\
    ```\n\nYou will get an undefined error if you attempt to retrieve a non-existent\
    \ value. The following would return undefined:\n\n```\nconsole.log(author.age);\n\
    ```\n\nA useful trick is to use the || operator to fill in default values in this\
    \ case:\n\n```\nconsole.log(author.age || \"No Age Found\");\n```\n\nYou can update\
    \ values of an object by assigning a new value to the property:\n\n```\nauthor.book.pages\
    \ = 190;\nconsole.log(author.book.pages); //190\n```\n\nIf you observe closely,\
    \ you will realize that the object literal syntax that you see is very similar\
    \ to the JSON format."
