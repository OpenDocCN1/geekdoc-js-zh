  md: "As we discussed, the arguments parameter is not really an array; it is possible\
    \ to convert it to an array as follows:\n\n```\nvar args = Array.prototype.slice.call(arguments);\n\
    ```\n\nOnce converted to an array, you can manipulate the list as you wish.\n\n\
    # The this parameter\n\nWhenever a function is invoked, in addition to the parameters\
    \ that represent the explicit arguments that were provided on the function call,\
    \ an implicit parameter named is also passed to the function. It refers to an\
    \ object's implicitly associated with the function invocation, termed as a function\
    \ context. If you have coded in Java, this will be familiar to you; like Java,\
    \ this points to an instance of the class in which this knowledge is defined.\n\
    \nEquipped with an invocation, let's talk about invocation methods.\n\n# Invocation\
    \ as a function\n\nIf a function is invoked as a method, constructor, or via apply()\
    \ or call(), it's simply invoked as a function:\n\n```\nfunction add() {\n  add();\n\
    \  var subtract = function() {\n    subtract();\n  }\n```\n\nWhen a function is\
    \ invoked with this pattern, this is bound to the global object. Many experts\
    \ believe to this is a bad design choice. It is natural to assume that this would\
    \ bound to the parameter context. When you are in a situation such as this, you\
    \ can capture the value of this in another variable. We will focus on this pattern\
    \ later.\n\n# Invocation as a method\n\nA method is function tied to a property\
    \ on an object. For methods, this is bound to the object on invocation:\n\n```\n\
    var person = {\n  name: 'Albert Einstein',\n  age: 66,\n  greet: function () {\n\
    ```"
