- img_proc: false
  md: "JavaScript Patterns\n\n# Models\n\nModels constructs that represent data in\
    \ the applications. They are agnostic of the user interface or routing logic.\
    \ Changes to models are typically notified to the view layer by the observer design\
    \ pattern. Models may also contain code to validate, create, or delete data. The\
    \ ability to automatically notify the views to react when the data is changed\
    \ makes frameworks like Backbone.js, Amber.js, and others very useful in building\
    \ MV applications. The following example shows you a typical Backbone model:\n\
    \n```\nvar EmployeeModel = Backbone.Model.extend({\n  url: '/employee/1',\n  defaults:\
    \ {\n    id: 1,\n    name: 'John Doe',\n    occupation: null\n  },\n  initialize:\
    \ function() {\n}\n});\nvar JohnDoe = new EmployeeModel();\n```\n\nThis model\
    \ structure may vary between different frameworks but they usually have commonalities\
    \ in them. In real-world applications, you would want your model to be persisted\
    \ in an in-memory store or database.\n\n# Views\n\nViews are the visual representations\
    \ of your model. Usually, the state of the model is processed, filtered, or masked\
    \ before it is presented to the view layer. In JavaScript, views are responsible\
    \ for rendering and manipulating DOM elements. Views observe models and get notified\
    \ when there is a change in the model. When the user interacts with the view,\
    \ certain attributes of the model are changed via the view layer (usually via\
    \ controllers). In JavaScript frameworks such as Backbone, the views are created\
    \ using template engines such as Handlebars.js (http://handlebars.com/) or mustache.js\
    \ (https://mustache.github.io/). These templates themselves are not views. Views\
    \ observe models and keep the view updated based on these changes. Let's see an\
    \ example defined in Handlebars:\n\n```\n<li class=\"employee_photo\">\n  <h2>{{title}}</h2>\n\
    \  <img class=\"emp_headshot_small\" src=\"{{src}}\">\n  <div class=\"employee_details\"\
    >\n    {{employee_details}}\n  </div>\n</li></li>\n```"
  merge: -1
  pgno: 158
- img_proc: false
  md: "Views such as the preceding example contain markup tags containing template\
    \ variables. These variables are delimited via a custom syntax. For example, template\
    \ variables are delimited using {{ }} in Handlebar.js. Frameworks typically transmit\
    \ data in JSON format. How the view is populated from the model is handled transparently\
    \ by the framework.\n\n# Controllers\n\nControllers act as a layer between models\
    \ and views and are responsible for updating the model when the user changes the\
    \ view attributes. Most JavaScript frameworks deviate from the classical definition\
    \ of a controller. For example, Backbone does not have a concept called controller;\
    \ they have something a router that is responsible for handling routing logic.\
    \ You can think of a combination of the view and router as a controller because\
    \ logic to synchronize models and views is done within the view itself. A particular\
    \ router would look like follows:\n\n```\nvar EmployeeRouter = Backbone.Router.extend({\n\
    routes: { \"employee/:id\": \"route\" },\nroute: function (id) {\n  ...view render\
    \ logic...\n}\n});\n```\n\n# The Model-View-Presenter pattern\n\nModel-View-Presenter\
    \ is a variation of the original MVC pattern that we discussed previously. Both\
    \ MVC and MVP target the separation of concerns but they are different on many\
    \ fundamental aspects. The presenter in MVP has the necessary logic for the view.\
    \ Any invocation from the view gets delegated to the presenter. The presenter\
    \ also observes the model and updates the views when the model updates. Many authors\
    \ take the view that the presenter binds the model with views, and it also performs\
    \ the role of a traditional controller. There are various implementations of MVP\
    \ and there are no frameworks that offer classical MVP out of the box. In implementations\
    \ of MVP, the following are the primary differences that separate MVP from MVC:\n\
    \n+   - The view has no reference to the model\n- The presenter has a reference\
    \ to the model and is responsible for updating the view when the model changes"
  merge: -1
  pgno: 159
- img_proc: false
  md: 'MVP is generally implemented in two flavors:


    +   - Passive view: The view is as naïve as possible and all the business logic
    is within the presenter. For example, a plain Handlebars template can be seen
    as a passive view.


    +   - Supervising controller: Views mostly contain declarative logic. A presenter
    takes over when the simple declarative logic in the view is insufficient.


    The following figure depicts MVP architecture:


    ![](bbox=[0.263, 0.296, 0.736, 0.584])


    # Model-View-ViewModel


    MVVM was originally coined by Microsoft for use with Windows Presentation Foundation
    (WPF) and Silverlight. MVVM is a variation of MVC and MVP and further tries to
    separate the user interface (view) from the business model and application behavior.
    MVVM creates a new model layer in addition to the domain model that was discussed
    in MVC and MVP. This model layer adds properties as an interface for the view.
    Let''s say that we have a checkbox on the UI. The state of the checkbox is captured
    in an IsChecked property. In MVVM, the view will have this property and the presenter
    will set it. However, in MVVM, the presenter will have the IsChecked property
    and the view is responsible for syncing with it. Now that the presenter is not
    really doing the job of a classical presenter, it''s renamed as ViewModel:'
