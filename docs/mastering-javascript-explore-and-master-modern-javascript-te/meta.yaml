  md: '# Data Structures and Manipulation


    One critical variation of this pattern is a range of values. If we want to match
    against a sequential range of characters or numbers, we can use the following
    pattern:


    ```

    var pattern = /[0-5]/; //nconsole.log(pattern.test(3)); //true

    console.log(pattern.test(12345)); //true

    console.log(pattern.test(9)); //false

    console.log(pattern.test(6789)); //false

    console.log(/0123456789)/.test("This is year 2015")); //true

    ```


    Special characters as $ and period (.) either represent matches to something other
    than operators that qualify the preceding term. In fact, we''ve already seen how
    {}, -, and " characters are used to representing something other than their literals.


    How do we want to match a literal { or * or some other special character? With
    a Regex, the backslash character escapes whatever character follows, making it
    a literal match term. So \ specifies a literal match to the [ character rather
    than the opening of a character class expression. A double backslash (\\) matches
    a single backslash.


    In the preceding examples, we saw the test ( ) method that returns true or false
    based on the pattern matched. There are times when you want to access occurrences
    of a particular pattern. The exec ( ) method handles in such situations.


    The exec() method takes a string as an argument and returns an array containing
    all matches. Consider the following example:


    ```

    var strToMatch = ''A Toyota! Race fast, safe car! A Toyota!'';

    var regEXAT = /Toyota/;

    var arrMatches = regEXAT.exec(strToMatch);

    console.log(arrMatches);

    ```


    The output of this snippet will be [''Toyota!]; if you want all the instances
    of the pattern Toy, you can use the g (global) flag as follows:


    ```

    var strToMatch = ''A Toyota! Race fast, safe car! A Toyota!'';

    var regExAT = /Toyota/g;

    var arrMatches = regExAT.exec(strToMatch);

    console.log(arrMatches);

    ```


