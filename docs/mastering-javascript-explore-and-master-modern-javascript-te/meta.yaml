- img_proc: false
  md: "Let's see how we can create this hierarchy in JavaScript. Let's define our\
    \ Employee type:\n\n```\nfunction Employee() {\n  this.name = '';\n  this.dept\
    \ = 'None';\n  this.salary = 0.00;\n}\n```\n\nThere is nothing special about these\
    \ definitions. The Employee object contains three properties—name, salary, and\
    \ department. Next, we define Manager. This definition shows you how to specify\
    \ the next object in the inheritance chain:\n\n```\nfunction Manager() {\n  Employee.call(this);\n\
    \  this.reports = [];\n}\n```\n\n```\nManager.prototype = Object.create(Employee.prototype);\n\
    ```\n\nIn JavaScript, you can add a prototypical instance as the value of the\
    \ prototype property of the constructor function. You can do so at any time after\
    \ you define the constructor. In this example, there are two ways that we have\
    \ not explored. First, we are calling Employee.call(this). If you come from a\
    \ Java background, this is analogous to the super() method call in the constructor.\
    \ The call() method calls a function with a specific object as its context (in\
    \ this case, it is given the value), and in other words, allows to specify which\
    \ object will be referred by the this keyword when the function will be executed.\
    \ Like super() in Java, calling parentObject.call(this) is necessary to correctly\
    \ initialize the object being created.\n\nThe other thing we see is Object.create()\
    \ instead of calling new. Object.create() creates an object with a specified prototype.\
    \ When we do new Parent(), the constructor logic of the parent is called. In most\
    \ cases, what we want for Child prototype to be an object that is linked via its\
    \ prototype to Parent.prototype. The parent constructor contains additional logic\
    \ specific to the parent, we don't want to run this while creating the child object.\
    \ This can cause very difficult-to-find bugs. Object.create() creates the same\
    \ prototyp link between the child and parent as the new operator without calling\
    \ the parent constructor."
  merge: -1
  pgno: 131
