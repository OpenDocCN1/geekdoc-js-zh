  md: "# Anonymous functions as a parameter to another function\n\nThis is one of\
    \ the most popular patterns and you will find such code in most professional libraries:\n\
    \n```\n// function statement\nfunction EventHandler(event) {\n  event();\n}\n\n\
    eHandler(function() {\n  // do a lot of event related things\n  console.log(\"\
    Event fired\");\n}\n```\n\nYou are passing the anonymous function to another function.\
    \ In the receiving function, you are executing the function passed as a parameter.\
    \ This can be very convenient if you are creating single-use functions such as\
    \ methods or event handlers. The anonymous function syntax is more concise than\
    \ declaring a function and then doing something with it as two separate steps.\n\
    \n# Anonymous functions in conditional logic\n\nYou can use anonymous function\
    \ expressions to conditionally change behavior. The following example shows this\
    \ pattern:\n\n```\nvar shape;\nif(shape_name === \"SQUARE\") {\n  shape = function()\
    \ {\n    return \"drawing square\";\n  }\n} else {\n  shape = function() {\n \
    \   return \"drawing square\";\n  }\n}\nalert(shape());\n```\n\nHere, based on\
    \ (shape) we are assigning a different implementation to the shape variable. This\
    \ pattern can be very useful if used with care. Overusing this can result in unreachable\
    \ and difficult-to-debug code."
