  md: "# DOM Manipulation and Events\n\n# jQuery works on CSS selectors.\n\n> As CSS\
    \ selectors are not in the scope of this book, I would suggest that you go to:\
    \ http://www.w3.org/TR/CSS2/selector.html to get a fair idea of the concept.\n\
    \nWe also assume that you are familiar with HTML tags and syntax. The following\
    \ example covers the fundamental idea of how jQuery selectors work:\n\n```\n<html>\n\
    <head>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js\"\
    ></script>\n  <script>\n    $(function() {\n      $('h1').html(function (index,\
    \ oldHTML) {\n        return oldHTML + \"Finally?\";\n      });\n      $('h1').addClass('highlight-blue');\n\
    \      $('#header > h1 .').css('background-color', 'cyan');\n      $('ul li:not(.highlight-blue)').addClass('highlight-green');\n\
    \      $('tr:nth-child(odd)').addClass('zebra');\n    });\n  </script>\n  <style>\n\
    \    .highlight-blue {\n      color: blue;\n    }\n    .highlight-green{\n   \
    \   color: green;\n    }\n    .zebra{\n      background-color: #666666;\n    \
    \  color: white;\n    }\n  </style>\n</head>\n<body>\n```"
