  md: "Functions, Closures, and Modules\n\nThe declaration of the foo() function is\
    \ hoisted such that we are able to execute the function before defining it. One\
    \ important aspect of hoisting is that it works per scope. Within the foo() function,\
    \ declaration of the variable will be hoisted to the top of the foo() function,\
    \ and not to the top of the program. The actual execution of the foo() function\
    \ with hoisting will be something as follows:\n\n```\nfunction foo() {\n  var\
    \ a;\n  console.log(a); // undefined\n  a = 1;\n}\n```\n\nWe saw that function\
    \ declarations are hoisted but function expressions are not. The next section\
    \ explains this.\n\n# Function declarations versus function expressions\n\nWe\
    \ saw two ways by which functions are defined. Though they serve identical purposes,\
    \ there is a difference between these two types of declarations. Check the following\
    \ example:\n\n```\n//Function expression\nfunctionOne();\n//Error\n//\"TypeError:\
    \ functionOne is not a function\n\nvar functionOne = function() {\n  console.log(\"\
    functionOne\");\n}\n//Function declaration\nfunctionTwo();\n//No error\n//Prints\
    \ - functionTwo\n\nfunction functionTwo() {\n  console.log(\"functionTwo\");\n\
    }\n```\n\n[ 58 ]"
