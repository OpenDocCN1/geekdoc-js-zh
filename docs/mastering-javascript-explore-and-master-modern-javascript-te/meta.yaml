  md: "# Object-Oriented JavaScript\n\nThe following example shows you how getters\
    \ and setters are created using the object literal syntax in ECMAScript 5:\n\n\
    ```\nvar person = {\n  firstname: \"Albert\",\n  lastname: \"Einstein\",\n  get\
    \ fullname() {\n    return this.firstname + \" \"+this.lastname;\n  },\n  set\
    \ fullname(_name) {\n    var words = _name.toString().split(' ');\n    this.firstname\
    \ = words[0];\n    this.lastname = words[1];\n  }\n};\n\nperson.fullname = \"\
    Issac Newton\";\nconsole.log(person.firstName); //\"Issac\"\nconsole.log(person.lastname);\
    \ //\"Newton\"\nconsole.log(person.fullname); //\"Issac Newton\"\n```\n\nAnother\
    \ way of declaring getters and setters is using the Object.defineProperty method:\n\
    \n```\nvar person = {\n  firstname: \"Albert\",\n  lastname: \"Einstein\",\n};\n\
    Object.defineProperty(person, 'fullname', {\n  get: function() {\n    return this.firstname\
    \ + ' ' + this.lastname;\n  },\n  set: function(name) {\n    var words = name.split('\
    \ ');\n    this.firstname = words[0];\n    this.lastname = words[1];\n  }\n});\n\
    \nperson.fullname = \"Issac Newton\";\nconsole.log(person.firstName); //\"Issac\"\
    \nconsole.log(person.lastname); //\"Newton\"\nconsole.log(person.fullname); //\"\
    Issac Newton\"\n```\n\nIn this method, you can call Object.defineProperty() even\
    \ after the object is created."
