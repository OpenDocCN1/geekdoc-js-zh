  md: '# Weak equality ==


    Nothing should tempt you to use this form of equality. Seriously, stay away from
    this form. There are many bad things with this form of equality primarily due
    to the weak typing in JavaScript. The equality operator, == first tries to coerce
    the type before a comparison. The following examples show you how this works:


    | Condition | Output |

    |--- |--- |

    | "" == "0" | false |

    | 0 == "" | true |

    | 0 == "0" | true |

    | false == "false" | false |

    | false == "0" | true |

    | false == undefined | false |

    | null == null | false |

    | null == undefined | true |


    From these examples, it''s evident that weak equality can result in unexpected
    outcomes. Also, implicit type coercion is costly in terms of performance. So,
    in general, stay away from weak equality in JavaScript.


    # JavaScript types


    We briefly discussed that JavaScript is a dynamic language. If you have a previous
    experience of strongly typed languages such as Java, you may feel a bit uncomfortable
    about the complete lack of type checks that you are used to. Purists argue that
    JavaScript should claim to have tags or perhaps subtypes, but not types. Though
    JavaScript does not the traditional definition of types, it is absolutely essential
    to understand how JavaScript handles types and coercion internally. Every nontrivial
    JavaScript program will need to handle value coercion in some form, so it is important
    that you understand the concept well.


    Explicit coercion happens when you modify the type yourself. In the following
    example, you will convert a number to a String using the toString() method and
    extract the character out of:


    ```

    var fortyTwo = 42;

    console.log(fortyTwo.toString() [1]); //prints *2*

    ```


    This is an example of explicit type conversion. Again, we are using the word loosely
    because type was not enforced anywhere when you declared the fortyTwo variable.'
