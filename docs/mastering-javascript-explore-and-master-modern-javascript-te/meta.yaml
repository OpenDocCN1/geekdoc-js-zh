  md: "# Functions, Closures, and Modules\n\nOnce defined, a function can be called\
    \ in other JavaScript functions. After the function body is executed, the caller\
    \ code (that executed the function) continues to execute. You can also pass a\
    \ function (val) as a parameter to another function:\n\n```\nfunction change(val)\
    \ {\n  return val.toUpperCase();\n}\nfunction demofunc(a, passfunction) {\n  console.log(passfunction(a));\n\
    }\ndefofunc(\"smallcase\", change);\n```\n\nIn the preceding example, we are calling\
    \ the demofunc() function with two parameters. The first parameter is the string\
    \ that we want to convert to uppercase and the second one is the function reference\
    \ to the change() function. In demofunc(), we call the change() function via its\
    \ reference passed to the passfunctionargument. Here we are passing a function\
    \ reference as an argument to another function. This powerful concept will be\
    \ discussed in detail later in the book when we discuss callbacks.\n\nA function\
    \ may or not return a value. In the previous examples, we saw that the add function\
    \ returned a value to the caller code. Apart from returning a value at the end\
    \ of the function, calling return explicitly allows you to conditionally return\
    \ from a function:\n\n```\nvar looper = function(x) {\n  if (x%5==0) {\n    return;\n\
    \  }\n  console.log(x);\n}\nfor (var i=1;i<10;i++) {\n  looper(i);\n}\n```\n\n\
    This code snippet prints 1, 2, 3, 4, 6, 7, 8, and 9, and not 5. When the if (x%5==0)\
    \ condition is evaluated to true, the code simply returns from the function and\
    \ the rest of the code is not executed."
