  md: 'The following example illustrates the various flags and how they affect the
    pattern match:


    ```

    var pattern = /orange/

    console.log(pattern.test("orange")); // true

    ```


    ```

    var patternIgnoreCase = /orange/i;

    console.log(patternIgnoreCase.test("Orange")); // true

    ```


    ```

    var patternGlobal = /orange/ig;

    console.log(patternGlobal.test("Orange Juice")); // true

    ```


    It isn''t very exciting if we can just test whether the pattern matches a string.
    Let''s see how we can express more complex patterns.


    # Exact match


    Any sequence of characters that''s not a special RegExp character or operator
    represents a character literal:


    ```

    var pattern = /orange/;

    ```


    We mean o followed by r followed by a followed by n followed by ... — you get
    the point. We rarely use exact match when using RegExp because it is the same
    as comparing two strings. Exact match patterns are sometimes called simple patterns.


    # Match from a class of characters


    If you want to match against a set of characters, you can place the set inside
    []. For example, [abc] would mean any character, a, b, or c:


    ```

    var pattern = /[abc]/;

    console.log(pattern.test(''a'')); //true

    console.log(pattern.test(''d'')); //false

    ```


    You can specify that you want to match anything but the pattern by adding a ^
    (caret sign) at the beginning of the pattern:


    ```

    var pattern = /[^abc]/;;

    console.log(pattern.test(''a'')); //false

    console.log(pattern.test(''d'')); //true

    ```'
