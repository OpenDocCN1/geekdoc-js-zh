  md: "# ECMAScript 6\n\nA variation of JavaScript Maps is a WeakMap—a WeakMap does\
    \ not prevent keys from being garbage-collected. Keys for a WeakMap must be objects\
    \ and the values can be arbitrary values. While a WeakMap behaves in the same\
    \ way as a normal Map, you cannot iterate through it and you cannot clear it.\
    \ There are reasons behind these restrictions. The reason that the state of the\
    \ Map is not guaranteed to remain static (keys may get garbage-collected), you\
    \ cannot ensure correct iteration.\n\nThere are not many cases where you might\
    \ want to use WeakMap. Most of us are written using normal Maps.\n\nWhile Maps\
    \ allow you to store arbitrary values, Sets are a collection of unique values.\
    \ Sets have similar methods as Maps; however, set() is replaced with add(), and\
    \ the get() method does not exist. The reason that the get() method is not this\
    \ is because a Set contains a value or not. Consider the following example:\n\n\
    ```\nlet x = {\n  'first': 'Albert'\n};\nlet s = new Set([1,2,'Sunday',x]);\n\
    console.log(s.has(x)); // true\ns.add(300);\nconsole.log(s); // [1,2,\"Sunday\"\
    ,{\"first\":\"Albert\"},300]\n\nfor (let a of s.entries()) {\n  console.log(a);\n\
    }\n//[1,1]\n//[2,2]\n//[\"Sunday\",\"Sunday\"]\n//[\"first\":\"Albert\",{\"first\"\
    :\"Albert\"}]\n//[300,300]\nfor (let a of s.keys()) {\n  console.log(a);\n}\n\
    //1\n//2\n//Sunday\n//{\"first\":\"Albert\"}\n//300\nfor (let a of s.values())\
    \ {\n  console.log(a);\n}\n//1\n//2\n//Sunday\n//{\"first\":\"Albert\"}\n//300\n\
    ```"
  merge: -1
  pgno: 192
