    console.log(a.toUpperCase());

    ```


    If you are keenly following and typing all these snippets, you would have realized
    something strange in the previous snippet. How are we calling properties and methods
    on primitives? How do primitives have objects such as properties and methods?
    They don''t?


    As discussed earlier, JavaScript kindly wraps these primitives in their wrappers
    by default making it possible for us to directly access the wrapper''s methods
    and properties as if they were of the primitives themselves.


    When any non-number value needs to be coerced into a number, JavaScript uses the
    Number() method internally: true becomes 1, undefined becomes NaN, false becomes
    0, and null becomes 0. The Number() method on strings works with literal conversion
    and if this fails, the method returns NaN.


