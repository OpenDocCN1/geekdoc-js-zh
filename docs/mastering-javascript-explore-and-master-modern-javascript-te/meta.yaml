  md: "By default, range() populates the array with integers, but with a little trick,\
    \ you can populate other data types also:\n\n```\nconsole.log(_.range(3).map(()\
    \ => { return 'a' }));\n['a', 'a', 'a']\n```\n\nThis is a fast and convenient\
    \ way to create and initialize an array with values. We frequently do this by\
    \ traditional loops.\n\nThe map() function produces a new array of values by mapping\
    \ each value in the list through a transformation function. Consider the following\
    \ example:\n\n```\nvar _ = require('underscore');\nconsole.log(_.map([1, 2, 3],\
    \ function(num) { return num * 3; }));\n//[3,6,9]\n```\n\nThe reduce() function\
    \ reduces a list of values to a single value. The initial state is passed through\
    \ the iterate function and each successive step is returned by the iteratee. The\
    \ following example shows its usage:\n\n```\nvar _ = require('underscore');\n\
    var sum = _.reduce([1, 2, 3], function(memo, num) {\n  console.log(memo, num);\
    \ return memo + num;\n}, 0);\nconsole.log(sum);\n```\n\nIn this example, the line,\
    \ console.log(memo, num);, is just to make the idea clear. The output will be:\n\
    \n+   0 1\n1 2\n3 3\n6\n\nThe final output is a sum of 1+2+3=6. As you can see,\
    \ two values are passed to the iterate function. the iterate function with two\
    \ values. On the first iteration, (0,1)—the value of the memo is defaulted in\
    \ the call to the reduce() function and 1 is the first element of the list. In\
    \ the function, we sum memo and num and return the intermediate sum, which will\
    \ be used by the iterate() function as a memo parameter—eventually, the memo will\
    \ have the accumulated sum. This concept is important to understand how the intermediate\
    \ states are used to calculate eventual results."
