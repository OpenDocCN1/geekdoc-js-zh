  md: "# Functions, Closures, and Modules\n\nShould the inner variable be undefined?\
    \ However, the output of the preceding code snippet is as follows:\n\n```\n\"\
    Outer\"\n\"Inner\"\n```\n\nWhat phenomenon allows the inner variable to still\
    \ be available when we execute the inner function, long after the scope in which\
    \ it was created has gone away? When we declared innerFn() in outerFn(), not only\
    \ the function declaration, but a closure was also created that encompasses not\
    \ only the function declaration, but all the variables that are in scope at the\
    \ point of the declaration. When innerFn() executes, even if it's executed after\
    \ the scope in which it was declared goes away, it has access to the original\
    \ scope in which it was declared through its closure.\n\nLet's continue to expand\
    \ this example to understand how far you can go with closures:\n\n```\nvar outer='outer';\n\
    var copy;\nfunction outerFn() {\n  var inner='inner';\n  function innerFn(param)\
    \ {\n    console.log(outer);\n    console.log(inner);\n    console.log(param);\n\
    \    console.log(magic);\n  }\n}\ncopy=innerFn;\nconsole.log(magic); //ERROR:\
    \ magic not defined\nvar magic='Magic';\noutnerFn();\ncopy(*copy);\n```\n\nIn\
    \ the preceding example, we have added a few more things. First, we added a parameter\
    \ to innerFn() — to illustrate that parameters are also part of the closure. There\
    \ are two important points that we want to highlight.\n\nAll variables in an outer\
    \ scope are included even if they are declared after the function is declared.\
    \ This makes it possible for the line, console.log(magic), in innerFn(), to work.\n\
    \nHowever, the same line, console.log(magic), in the global scope will fail because\
    \ even within the same scope, variables not yet defined cannot be referenced."
