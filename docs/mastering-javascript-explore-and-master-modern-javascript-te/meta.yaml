  md: "# Local scope\n\nUnlike most programming languages, JavaScript does not have\
    \ block-level scope (variables scoped to surrounding curly brackets); instead,\
    \ JavaScript has function-level scope. Variables declared within a function are\
    \ local variables and are only accessible within that function or by functions\
    \ that function:\n\n```\nvar scope_name = \"Global\";nfunction showScopeName()\
    \ {\n    // local variable: only accessible in this function\n    var scope_name\
    \ = \"Local\";\n    console.log(scope_name); // Local\n}\nconsole.log(scope_name);\
    \ // prints - Global\nshowScopeName(); // prints - Local\n```\n\n# Function-level\
    \ scope versus block-level scope\n\nJavaScript variables are scoped at the function\
    \ level. You can think of this as a small bubble getting created that prevents\
    \ the variable to be visible from outside this bubble. A function creates such\
    \ a bubble for variables declared inside the function. You can visualize the bubbles\
    \ as follows:\n\n```\n-GLOBAL SCOPE-\nvar g = 0;\nfunction foo(a) {\n    var b\
    \ = 1;\n    //code\n    function bar() {\n        // ... | ScopeBar ScopeFoo\n\
    \    }\n    // code\n    var c = 2;\n}\nfoo(); //WORKS\nbar(); //FAILS\n```"
  merge: -1
  pgno: 70
- img_proc: false
  md: "# Chapter 2\n\nJavaScript uses scope chains to establish the scope for a given\
    \ function. There is typically one global scope, and each function defined has\
    \ its own scope. Any function defined within another function has a local scope\
    \ that is linked to the outer function. It is always the position in the source\
    \ that defines the scope. When resolving a variable, JavaScript starts at the\
    \ innermost scope and searches outwards. With this, let's look at scoping rules\
    \ in JavaScript.\n\nIn the preceding roughly drawn visual, you can see that the\
    \ foo() function is defined in the global scope. The foo() function has its local\
    \ scope and access to the g variable because it's in the global scope. The a,\
    \ b, and c variables are in the local scope because they are defined within the\
    \ function scope. The bar() function is defined within the function scope and\
    \ is available within the foo() function. However, once outside the foo(), the\
    \ bar() function is not available. You cannot see or call the bar() function —\
    \ a scope bubble.\n\nNow that the bar() function also has its own scope (bubble),\
    \ what is available here? The bar() function has access to the foo() function\
    \ and all the variables created in the parent scope of the foo() function — a,\
    \ b, and c. The bar() function also has access to the global scope variable, g.\n\
    \nThis is a powerful idea. Take a moment to think about it. We just discussed\
    \ how rampant and uncontrolled global scope get in JavaScript. How about we take\
    \ an arbitrary piece of code and wrap it around with a function? We will be able\
    \ to hide and create a scope bubble around this piece of code. Creating the correct\
    \ scope using function wrapping will help us create correct code and prevent difficult-to-detect\
    \ bugs.\n\nAnother advantage of the function scope and hiding variables and functions\
    \ within this scope is that you can avoid collisions between two identifiers.\
    \ The following example shows such bad case:\n\n```\nfunction foo() {\n  function\
    \ bar(a) {\n    i = 2; // changing the 'i' in the enclosing scope's for-loop\n\
    \    console.log(a);\n  }\n  for (var i=0; i<10; i++) {\n    bar(i); // infinite\
    \ loop\n  }\n}\nfoo();\n```\n\n[ 53 ]"
  merge: -1
