  md: "# Server-Side JavaScript\n\nIf you want to inspect what's happening internally,\
    \ you can issue a curl command\nas follows:\n\n+   - curl -v http://localhost:3000\n\
    * Rebuilt URL to: http://localhost:3000/\n* Trying: :1...\n* Connected to localhost\
    \ (::1) port 3000 (#0)\n> GET / HTTP/1.1\n> Host: localhost:3000\n> User-Agent:\
    \ curl/7.43.0\n> Accept: *//*\n\n< HTTP/1.1 200 OK\n< Content-Type: text/plain\n\
    < Date: Thu, 12 Nov 2015 05:31:44 GMT\n< Connection: keep-alive\n< Transfer-Encoding:\
    \ chunked\n\nHello Node\n* Connection #0 to host localhost left intact\n\nCurl\
    \ shows a nice request (>) and response (-) dialog including the request and\n\
    response headers.\n\n# Callbacks\n\nCallbacks in JavaScript usually take some\
    \ time getting used to. If you are coming\n some other non-asynchronous programming\
    \ background, you will need\nto understand carefully how callbacks work; you may\
    \ feel like you're learning\nprogramming for the first time. As everything is\
    \ asynchronous in Node, you will be\nusing callbacks for everything without trying\
    \ to carefully structure them. The most\nimportant part of the Node.js project\
    \ is sometimes the code organization and module\nmanagement.\n\nCallbacks are\
    \ functions that are executed asynchronously at a later time. Instead of\nt code\
    \ reading top to bottom procedurally, asynchronous programs may execute\ndifferent\
    \ functions at different times based on the order and speed that earlier\nfunctions\
    \ such as HTTP requests or filesystem reads happen."
