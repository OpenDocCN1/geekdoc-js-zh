  md: "```\nreturn {\n  getSecret: getSecret,\n  getPassCode: getPassCode\n}\n}();\n\
    superModule.getSecret();\nsuperModule.getPassCode();\n```\n\nThis example satisfies\
    \ both the conditions. Firstly, we create an IIFE or a named function to act as\
    \ an outer closure. The variables defined remain private because they are scoped\
    \ in the function. We return the public functions to make sure that we have a\
    \ closure over the private scope. Using IIFE in the module pattern will actually\
    \ result in a singleton instance of this function. If you want to create multiple\
    \ instances, you can create function expressions as part of the module as well.\n\
    \nWe will keep exploring various facets of functional aspects of JavaScript closures\
    \ in particular. There can be a lot of imaginative uses of such elegant constructs.\
    \ An effective way to understand various patterns is to study the code of popular\
    \ libraries and practice these patterns in your code.\n\n# Stylistic considerations\n\
    \nAs in the previous chapter, we will conclude this discussion with certain stylistic\
    \ considerations. Again, these are generally accepted guidelines and not rules—feel\
    \ to deviate from them if you have reason to believe otherwise:\n\n+   - Use function\
    \ declarations instead of function expressions:\n  // bad\n  const foo = function\
    \ () {\n  };\n\n  // good\n  function foo() {\n  }\n\n+   - Declare a closure\
    \ in a non-function block (if, while, and so on). Assign the function to a variable\
    \ instead. Browsers allow you to do it, but they all interpret it differently.\n\
    \n+   - Never name a parameter arguments. This will take precedence over the arguments\
