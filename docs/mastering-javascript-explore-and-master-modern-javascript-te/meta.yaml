  md: "# Global scope\n\nAny variable that you declare is by default in global scope.\
    \ This is one of the most annoying language design decisions in JavaScript. As\
    \ a global variable is visible in all other scopes, a global variable can be modified\
    \ by any scope. Global variables make it harder to run loosely coupled subprograms\
    \ in the same program/module. If the subprograms happen to have global variables\
    \ that share the same names, then they will interfere with each other and likely\
    \ fail, usually in difficult-to-diagnose ways. This is sometimes known as namespace\
    \ clash. We discussed global scope in the previous chapter but let's revisit it\
    \ briefly to understand how to avoid\n\nYou can create a global variable in two\
    \ ways:\n\n+   - The first way is to place a variable statement outside any function.\
    \ Essentially, any variable declared outside a function is defined in the global\
    \ scope.\n- The second way is to omit the var statement while declaring a variable\
    \ (also called implied). I think this was designed as a convenience for new programmers\
    \ but turned out to be a nightmare. When you omit the var statement while declaring\
    \ a variable, it's created by default in the global scope. This is nasty. You\
    \ should always run your program against ESLint or JSHInt to let them flag such\
    \ violations. The following example shows how global scope behaves:\n\n```\n//Global\
    \ Scope\nvar a = 1;\nfunction scopeTest() {\n  console.log(a);\n}\nscopeTest();//prints\
    \ 1\n```\n\nHere we are declaring a variable outside the function and in the global\
    \ scope. This variable is available in the scopeTest() function. If you assign\
    \ a new value to a global scope within a function scope (local), the original\
    \ value in the global scope is overwritten:\n\n```\n//Global Scope\nvar a = 1;\n\
    function scopeTest() {\n  a = 2; //Overwrites global variable 2, you omit 'var'\n\
    \  console.log(a);\n}\nconsole.log(a); //prints 1\nscopeTest(); //prints 2\nconsole.log(a);\
    \ //prints 2 (global value is overwritten)\n```"
  merge: -1
  pgno: 69
