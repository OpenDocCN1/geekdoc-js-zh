  md: "# ES6 modules\n\nTwo separate systems and different module loaders can be a\
    \ bit intimidating. ES6 tries to solve this. ES6 has a proposed module specification\
    \ that tries to keep the good aspects of both CommonJS and AMD module patterns.\
    \ The syntax of ES6 modules is similar to CommonJS and the ES6 modules support\
    \ asynchronous loading and configurable module loading:\n\n```\n//json-processor.js\n\
    function processJSON(url) {\n  ...\n} export function getSiteContent(url) {\n\
    \  return processJSON(url);\n}\n\n//main.js\nimport { getSiteContent } from \"\
    json-processor.js\";\ncontent=getSiteContent(\"http://google.com/\");\n```\n\n\
    ES6 lets you export a function or variable in a similar way to CommonJS In the\
    \ code where you want to use this imported function, you use the import keyword\
    \ to specify from you the dependency to be imported. Once the dependency is imported,\
    \ it can be used as a member of the program. We will discuss in later chapters\
    \ how you can use ES6 in environments where ES6 is not supported.\n\n# The factory\
    \ pattern\n\nThe factory pattern is another popular object creation pattern. It\
    \ does not require the usage of constructors. This pattern provides an interface\
    \ to create objects. Based on the type passed to the factory, that particular\
    \ type of object is created by the factory. A common implementation of this pattern\
    \ is usually using a class or static method of a class. The purposes of such a\
    \ class or method are as follows:\n\n+   - It abstracts repetitive operations\
    \ when creating similar objects\n- It allows the consumers of the factory to create\
    \ objects without knowing the internals of the object creation"
