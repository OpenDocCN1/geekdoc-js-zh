  md: "You switch on the strict mode by typing the following line first in your JavaScript\
    \ file\nor in your <script> element:\n\n```\n'use strict';\n```\n\nNote that JavaScript\
    \ engines that do not support ECMAScript 5 will simply ignore the\npreceding statement\
    \ and continue as non-strict mode.\n\nIf you want to switch on the strict mode\
    \ per function, you can do it as follows:\n\n```\nfunction foo() {\n  'use strict';\n\
    }\n```\n\nThis is handy when you are working with a legacy code base where switching\
    \ on the\nstrict mode everywhere may break things.\n\nIf you are working on an\
    \ existing legacy code, be careful because the strict\nmode can break things.\
    \ There are some caveats on this:\n\n# Enabling the strict mode for an existing\
    \ code can break it\n\nThe code may run on a feature that is not available anymore\
    \ or on behavior that\nis different in a sloppy mode than in a strict mode. Don't\
    \ forget that you have the\\option to add strict mode functions to files that\
    \ are in the sloppy mode.\n\n# Package with care\n\nWhen you concatenate and/or\
    \ minify files, you have to be careful that the strict\nmode isn't switched off\
    \ where it should be switched on or vice versa. Both can\nbreak code.\n\nThe following\
    \ sections explain the strict mode features in more detail. You normally\ndon't\
    \ need to know them as you will mostly get warnings for things that you\nshouldn't\
    \ do anyway.\n\n# Variables must be declared in strict mode\n\nAll variables must\
    \ be explicitly declared in strict mode. This helps to prevent typos.\nin the\
    \ sloppy mode, assigning to an undeclared variable creates a global variable:\n\
    \n```\nfunction sloppyFunc() {\n  sloppyVar = 123;\n} sloppyFunc(); // creates\
    \ global variable \"sloppyVar\"\nconsole.log(sloppyVar); // 123\n```"
