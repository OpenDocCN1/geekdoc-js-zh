  md: "We pass the i variable and copy it to the j variable local to the IIFE. The\
    \ introduction of an IIFE inside each iteration creates a new scope for each iteration\
    \ and hence updates the local copy with the correct value.\n\n# Modules\n\nModules\
    \ are used to mimic classes and focus on public and private access to variables\
    \ and functions. Modules help in reducing the global scope pollution. Effective\
    \ use of modules can reduce name collisions across a large code base. A typical\
    \ format that this pattern takes as follows:\n\n```\nvar moduleName=function()\
    \ {\n  //private state\n  //private functions\n  return {\n    //public state\n\
    \    //public variables\n  }\n}\n```\n\nThere are two requirements to implement\
    \ this pattern in the preceding format:\n\n+   - There must be an outer enclosing\
    \ function that needs to be executed at once.\n- This enclosing function must\
    \ return at least one inner function. This is necessary to create a closure over\
    \ the private state– without this, you can't access the private state at all.\n\
    \nCheck the following example of a module:\n\n```\nvar superModule = (function()\
    \ {\n  var secret = 'supersecretkey';\n  var passcode = 'nuke';\n\nfunction getSecret()\
    \ {\n    console.log( secret );\n  }\n\nfunction getPassCode() {\n    console.log(\
    \ passcode );\n  }\n}\n```"
  merge: -1
