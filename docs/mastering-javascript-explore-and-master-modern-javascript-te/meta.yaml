  md: "# Functions as data\n\nJavaScript, functions can be assigned to variables,\
    \ and variables are data. You will shortly see that this is a powerful concept.\
    \ Let's see the following example:\n\n```\nvar say = console.log;\nsay(\"I can\
    \ also say things\");\n```\n\nIn the preceding example, we assigned the familiar\
    \ console.log() function to the say variable. Any function can be assigned to\
    \ a variable as shown in the preceding example. Using parentheses to the variable\
    \ will invoke it. Moreover, you can pass functions in other functions as parameters.\
    \ Study the following example carefully and type it out in JS:\n\n```\nvar validateDataForAge\
    \ = function() {\n  person = data();\n  console.log(person);\n  if (person.age\
    \ < 1 || person.age > 99) {\n    return true;\n  } else {\n    return false;\n\
    \  }\n}\n```\n\n```\nvar errorHandlerForAge = function(error) {\n  console.log(\"\
    Error while processing age\");\n}\n```\n\n```\nfunction parseRequest(data, validateData,\
    \ errorHandler) {\n  var error = validateData(data);\n  if (error) {\n    console.log(\"\
    no errors\");\n  } else {\n    errorHandler();\n  }\n}\n```\n\n```\nvar generateDataForScientist\
    \ = function() {\n  return {\n    name: \"Albert Einstein\",\n    age : Math.floor(Math.random()\
    \ * (100 - 1)) + 1,\n  };\n}\n```"
