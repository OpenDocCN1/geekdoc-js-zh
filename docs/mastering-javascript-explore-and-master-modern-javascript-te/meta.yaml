    window.onload = function() {

    var doc = document.documentElement;

    var body = doc.body;

    var _head = doc.firstChild;

    var _body = doc.lastChild;

    var _head = doc.childNodes[0];

    var title = _head.firstChild;

    alert(_head.parentNode === doc);//true

    }

    </script>

    </head>

    <body>

    <p>Hello World!</p>

    </body>

    </html>

    ```


    The anonymous function is executed when the browser loads the page. In the function,
    we are getting the nodes of the DOM programmatically. The entire HTML document
    can be accessed using the `document.documentElement` function. We store the document
    in a variable. Once the document is accessed, we traverse the nodes using several
    helper properties of the document. We are accessing the `<body>` element using
    `doc.body`. You can traverse through the children of an element using the `childNodes`
    array. The first and last children of a node can be accessed using appropriate
    properties—`firstChild` and `lastChild`.


    > It is not recommended to use render-blocking JavaScript in the `<head>` tag.
    This slows down the page rendering dramatically. Modern browsers support the `async`
    and `defer` attributes to indicate to the browsers that the rendering can continue
    while the script is being downloaded. You can use these tags in the `<head>` tag
    without worrying about performance degradation. You can get more information at
    http://stackoverflow.com/questions/43641/where-is-the-best-place-to-put-tags-in-html-markup.


    # Accessing specific nodes


    The DOM defines the `getElementsByTagName()` method to return NodeList of all
    the element objects whose `tagName` property is equal to a specific value. The
    following line contains a list of all the `<p>` elements in a document:


    ```

    var paragraphs = document.getElementsByTagName(''p'');

    ```'
