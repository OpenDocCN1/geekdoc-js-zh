  md: "# Object-Oriented JavaScript\n\nTo have a side effect-free and accurate inheritance\
    \ mechanism, we have to make sure that we perform the following:\n\n+   - Setting\
    \ the prototype to an instance of the parent initializes the prototype chain (inheritance);\
    \ this is done only once (as the prototype object is shared)\n- Calling the parent's\
    \ constructor initializes the object itself; this is done with every instantiation\
    \ (you can pass different parameters each time you construct it)\n\nWith this\
    \ understanding in place, let's define the rest of the objects:\n\n```\nfunction\
    \ IndividualContributor() {\n  Employee.call(this);\n  this.active_projects =\
    \ [];\n}\nIndividualContributor.prototype = Object.create(Employee.prototype);\n\
    ```\n\n```\nfunction TeamLead() {\n  Manager.call(this);\n  this.dept = \"Software\"\
    ;\n  this.salary = 100000\n}\nTeamLead.prototype = Object.create(Manager.prototype);\n\
    ```\n\n```\nfunction Engineer() {\n  TeamLead.call(this);\n  this.dept = \"JavaScript\"\
    ;\n  this.desktop_id = \"8822\";\n  this.salary = 80000\n}\nEngineer.prototype\
    \ = Object.create(TeamLead.prototype);\n```\n\nBased on this hierarchy, we can\
    \ instantiate these objects:\nvar genericEmployee = new Employee();\nconsole.log(genericEmployee);\n\
    \nYou can see the following output for the preceding code snippet:\n\n```\n[object\
    \ Object] {\n  dept: \"None\",\n  name: \"\"\n  salary: 0\n}\n```"
