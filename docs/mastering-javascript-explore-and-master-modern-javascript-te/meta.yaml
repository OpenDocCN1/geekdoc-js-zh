  md: "# Template literals\n\nI am sure you have done things as the following:\n\n\
    ```\nfunction SuperLogger(level, clazz, msg) {\n  console.log(level+\":\": Exception\
    \ happened in class:\"+clazz+\" - \n  Exception :\"\"+msg);\n}\n```\n\nThis is\
    \ a very common way of replacing variable values to form a string literal. ES6\
    \ provides you with a new type of string literal using the backtick (``) delimiter.\
    \ You can use string interpolation to put placeholders in a template string literal.\
    \ The placeholders will be parsed and evaluated.\n\nThe preceding example can\
    \ be rewritten as follows:\n\n```\nfunction SuperLogger(level, clazz, msg) {\n\
    \  console.log(`{level}: Exception happened in class: ${clazz}` - \n  Exception\
    \ : `${msg}\\`);\n}\n```\n\nWe are using ` `` around a string literal. With this\
    \ literal, any expression of the `${...}` form is parsed immediately. This is\
    \ called interpolation. While parsing, the variable's value replaces the placeholder\
    \ within ${}. The resulting string is just a normal string replaced with actual\
    \ variable values.\n\nWith string interpolation, you can split a string into multiple\
    \ lines also, as as shown in the following code (very similar to Python):\n\n\
    ```\nvar quote = ``Good night, good night!\nParting is such sweet sorrow,\nThat\
    \ I shall say good night\ntill it be tomorrow.\\`;\nconsole.log( quote );\n```\n\
    \nYou can use function calls or valid JavaScript expressions as part of the string\
    \ interpolation:\n\n```\nfunction sum(a,b) {\n  console.log(`The sum seems to\
    \ be ${a + b}`);\n}\n```\n\n```\nsum(1,2); //The sum seems to be 3\n```"
  merge: -1
  pgno: 189
- img_proc: false
  md: "# ECMAScript 6\n\nThe final variation of the template strings is called tagged\
    \ template string. The idea is to modify the template string using a function.\
    \ Consider the following example:\n\n```\nfunction emmy(key, ...values) {\n  console.log(key);\n\
    \  console.log(values);\n}\nlet category=\"Best Movie\"\nlet movie=\"Adventures\
    \ in ES6\";\nemmy(\\`The award for ${category} goes to ${movie}\\`);\n\n//[\\\
    [\"The award for *\" goes to *\",\"]\n//[\"Best Movie\",*Adventures in ES6\"]\n\
    ```\n\nThe strangest part is when we call the emmy function with the template\
    \ literal. It's not a traditional function syntax. We are not writing emmy();\
    \ we are just tagging the literal with the function. When this function is called,\
    \ the first argument is an array of all the plain strings (the string between\
    \ interpolated expressions). The second argument is the array where the interpolated\
    \ expressions are evaluated and stored.\n\nNow what this means is that the tag\
    \ function can actually change the result template:\n\n```\nfunction priceFilter(s,\
    \ ...v) {\n  //Bump up discount\n  return s[0] + (v[0] + 5);\n}\nlet default_discount\
    \ = 20;\nlet greeting = priceFilter(`Your purchase has a discount of ${default_discount}%`);\n\
    console.log(greeting); //Your purchase has a discount of 25\n```\n\nAs you can\
    \ see, we modified the value of the discount in the tag function and returned\
    \ the modified values.\n\n# Maps and Sets\n\nES6 introduces four new data structures:\
    \ Map, WeakMap, Set, and WeakSet. We discussed earlier that objects are the usual\
    \ way of creating key-value pairs in JavaScript. The disadvantage of objects is\
    \ that you cannot use non-string values as keys. The following snippets demonstrate\
    \ how Maps are created in ES6:"
  merge: -1
  pgno: 190
- img_proc: false
  md: "let m = new Map();\nlet s = { 'seq' : 101 };\n\n```\nm.set('1', 'Albert');\n\
    m.set('MAX', 99);\nm.set(s, 'Einstein');\n\nconsole.log(m.has('1')); //true\n\
    console.log(s);       //Einstein\nconsole.log(m.size);  //3\nm.delete(s);\nm.clear();\n\
    ```\n\nYou can initialize the map while declaring it:\n\n```\nlet m = new Map([\n\
    \  [ 1, 'Albert' ],\n  [ 2, 'Douglas' ],\n  [ 3, 'Clive' ]\n]);\n```\n\nIf you\
    \ want to iterate over the entries in the Map, you can use the entries() function\
    \ that will return an iterator. You can iterate through all the keys using the\
    \ keys() function and you can iterate through the values of the Map using the\
    \ values() function:\n\n```\nlet m2 = new Map([\n  [ 1, 'Albert' ],\n  [ 2, 'Douglas'\
    \ ],\n  [ 3, 'Clive' ]\n]);\n\nfor (let a of m2.entries()){\n  console.log(a);\n\
    }\n//[1,\"Albert\"] [2,\"Douglas\"] [3,\"Clive\"]\nfor (let a of m2.keys()){\n\
    \  console.log(a);\n}\n//1 2 3\nfor (let a of m2.values()){\n  console.log(a);\n\
    }\n//Albert Douglas Clive\n```"
