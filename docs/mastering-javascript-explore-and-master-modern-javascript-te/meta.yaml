  md: "# Chapter 2\n\nNext, we define an object with a testObj variable with a property\
    \ named\ntestObjFunc that receives a reference to testF() — don't fret if you\
    \ are not really\naware of object creation yet. When we do this, we created a\
    \ testObjMethod() method.\nNow, when we invoke this method, we expect the function\
    \ context to be displayed\nwhen we display the value of this.\n\n# Invocation\
    \ as a constructor\n\nConstructor functions are declared just like any other functions\
    \ and there's nothing\nspecial about a function that's going to be used as a constructor.\
    \ However, the way in\nwhich we are invoked is very different.\n\nTo invoke the\
    \ function as a constructor, we precede the function invocation with the\nnew\
    \ keyword. In this case, this is bound to the new object.\n\nBefore we discuss\
    \ more, let's take a quick introduction to object orientation in\nJavaScript.\
    \ We will, of course, discuss the topic in great detail in the next chapter.\n\
    JavaScript is a prototypal inheritance language. This means that objects can inherit\n\
    properties directly from other objects. The language is class-free. Functions\
    \ that\ndesigned to be called with the new prefix are called constructors. Usually,\
    \ they\nare named using PascalCase as opposed to CamelCase for easier distinction.\
    \ In\nthe example, notice that the greet function uses this to access the name\n\
    property. The parameter is bound to Person:\n\n```\nvar Person = function (name)\
    \ {\n  this.name = name;\n}\nPerson.prototype.greet = function () {\n  return\
    \ this.name;\n}\nvar albert = new Person('Albert Einstein');\nconsole.log(albert.greet());\n\
    ```\n\nWe will discuss this particular invocation method when we study objects\
    \ in the next\nchapter.\n\n# Invocation using apply() and call() methods\n\nWe\
    \ said earlier that JavaScript functions are objects. Like other objects, they\
    \ also\nhave certain methods. To invoke a function using its apply() method, we\
    \ pass two\nparameters to apply(): the object to be used as the function context\
    \ and an array\nof values to be used as the invocation arguments. The call() method\
    \ is used in a\nsimilar manner, except that the arguments are passed directly\
    \ in the argument list\nrather than as an array.\n\n[ 63 ]"
