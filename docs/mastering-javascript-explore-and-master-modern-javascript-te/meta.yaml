  md: "# Functions, Closures, and Modules\n\nIn the preceding example, we are creating\
    \ a function that we intend to call as a constructor. In this privateTest() function,\
    \ we are creating a var points=0 variable as a function-scoped variable. This\
    \ variable is available only in privateTest(). Additionally, we create an accessor\
    \ function (also called a getter)–getPoints() allows us to read the value of only\
    \ the points variable from outside privateTest(), making this private variable\
    \ to the function. However, another method, score(), allows us to modify the value\
    \ of the private point variable without directly accessing it from outside. This\
    \ makes it possible for us to write code where a private variable is updated in\
    \ a controlled fashion. This pattern can be very useful when you are writing libraries\
    \ where you want to control how variables are accessed based on a contract and\
    \ pre-established interface.\n\n# Loops and closures\n\nConsider the following\
    \ example of using functions inside:\n\n```\nfor (var i=1; i<=5; i++) {\n  setTimeout(function\
    \ delay() {\n    console.log( i);\n  }, i*100);\n}\n```\n\nThis snippet prints\
    \ 1, 2, 3, 4, and 5 on the console at an interval of 100 ms, right? Instead, it\
    \ prints 6, 6, 6, 6, and 6 at an interval of 100 ms. Why is this happening? Here,\
    \ we encounter a common issue with closures and looping. The i variable is being\
    \ updated after the function is bound. This means that every bound function handler\
    \ will always print the last value stored in i. In fact, the timeout function\
    \ callbacks are running after the completion of the loop. This is a common problem\
    \ that JSLint will warn you if you try to use functions inside a loop.\n\nHow\
    \ can we fix this behavior? We can introduce a function scope and local copy of\
    \ the i variable in that scope. The following snippet shows how we can do this:\n\
    \n```\nfor (var i=1; i<=5; i++) {\n  (function(j{\n    setTimeout(function delay(){\n\
    \      console.log( j );\n    }, j*100);\n  })(i);\n}\n```"
  merge: -1
