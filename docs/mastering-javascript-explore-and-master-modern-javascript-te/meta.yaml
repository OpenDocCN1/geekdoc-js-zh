  md: "# Accessing DOM elements\n\nMost of the time, you will be interested in accessing\
    \ DOM elements to inspect their values or processing these values for some business\
    \ logic. We will take a detailed look at this particular use case. Let's create\
    \ a sample HTML file with the following content:\n\n```\n<html>\n<head>\n  <title>DOM</title>\n\
    </head>\n<body>\n  <p>Hello World!</p>\n</body>\n</html>\n```\n\nYou can save\
    \ this file as sample_dom.html; when you open this in the Google browser, you\
    \ will see the web page displayed with the **Hello World** text displayed. Now,\
    \ open Chrome Developer Tools by navigating to options | **More Tools | Developer\
    \ Tools** (this route may differ on your operating system and browser version).\
    \ You will see the DOM structure:\n\n| Elements | Network | Sources |\n|---|---|---|\n\
    | <html> ▼ <head> ▼ <title>DOM</title> </head> ▼ <body> <p>Hello World!</p> </body>\
    \ </html> | |\n\nWe will insert some JavaScript into this HTML page. We will invoke\
    \ the JavaScript function when the web page is loaded. To do this, we will call\
    \ a function on window.onload. You can place your script in the <script> tag located\
    \ under the <head> tag. Your page should look as follows:\n\n```\n<html>\n<head>\n\
    \  <title>DOM</title>\n<script>\n```"
  merge: -1
