  md: "test.js: line 200, col 39, Expected '')' and instead saw '{'.\ntest.js: line\
    \ 200, col 40, Missing semicolon.\n\n# # Using strict\n\nWe briefly discussed\
    \ the strict mode in earlier chapters. The strict mode in JavaScript flags eliminates\
    \ some of the JavaScript silent errors. Rather than silently failing, the strict\
    \ mode makes these failures throw errors instead. The strict mode also helps in\
    \ converting mistakes to actual errors. There are two ways of enforcing the strict\
    \ mode. If you use the strict mode for the entire script, you can just add the\
    \ use strict statement as the first line of your JavaScript program. If you want\
    \ a specific function to conform with the strict mode, you can add the directive\
    \ as the first line of a function:\n\n```\nfunction strictFn() {\n  // This line\
    \ makes EVERYTHING under this strict mode\n  'use strict';\n\n  function nestedStrictFn()\
    \ {\n    //Everything in this function is also nested\n  }\n}\n```\n\n# # Runtime\
    \ exceptions\n\nThese errors appear when you execute the code and try to refer\
    \ to an undefined variable or process a null. When a runtime exception occurs,\
    \ any code after that particular line (which caused the exception) does not get\
    \ executed. It is essential to handle such scenarios correctly in the code. While\
    \ exception handling can prevent crashes, they also help in debugging. You can\
    \ run the code that may encounter a runtime exception in a try {} block. When\
    \ any code in this block generates a runtime exception, a corresponding handler\
    \ captures it. The handler is defined by a catch (exception) {} block. Let's clarify\
    \ this using an example:\n\n```\ntry {\n  var a = doesNotExist(); // throws a\
    \ runtime exception\n} catch (e) {\n  console.log(e.message); // handle the exception\n\
    \  // prints - \"doesNotExist is not defined\"\n}\n```"
  merge: -1
  pgno: 173
- img_proc: false
  md: "# Testing and Debugging\n\nIn this example, the var a = doesnotexist line tries\
    \ to assign an undefined variable, doesNotExist, to another variable. This causes\
    \ a runtime exception. When we wrap this problematic code in the try{ catch()\
    \ {} block and when the exception occurs (or is thrown), the execution stops in\
    \ the try{} block and goes directly to the catch() handler. The catch() handler\
    \ is responsible for handling the exceptional scenario. In this case, we are displaying\
    \ the error message on the console for debugging purposes. You can throw an exception\
    \ to trigger an unhandled scenario in code. Consider the following example:\n\n\
    ```\nfunction engageGear(gear) {\n  if(gear===\"R\") console.log(\"Reversing\"\
    );\n  if(gear===\"D\") console.log(\"Driving\");\n  if(gear===\"N\") console.log(\"\
    Neutral/Parking\");\n  throw new Error(\"Invalid Gear State\");\n}\ntry {\n  engageGear(\"\
    R\"); //Reversing\n  engageGear(\"P\"); //Invalid Gear State\n} catch(e) {\n \
    \ console.log(e.message);\n}\n```\n\nIn this example, we are handling valid states\
    \ of a gear shift (R, N, and D), but when we receive an invalid state, we are\
    \ explicitly throwing an exception clearly stating the reason. When we call the\
    \ function that we think we may throw an exception, we wrap the code in the try{}\
    \ block and attach a catch() {} handler with it. When the exception is caught\
    \ by the catch() block, we handle the exceptional condition properly.\n\n# Console.log\
    \ and asserts\n\nDisplaying the state of execution on the console can be very\
    \ useful while debugging. However, modern developer tools allow you to put breakpoints\
    \ and halt execution to inspect a particular value during runtime. You can quickly\
    \ detect small issues by logging some variable state on the console.\n\nWith these\
    \ concepts, let's see how we can use Chrome Developer Tools to debug JavaScript\
    \ code."
  merge: -1
  pgno: 174
