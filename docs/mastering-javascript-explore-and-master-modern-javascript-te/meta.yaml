  md: "# Default parameters\n\nDefaulting is very common. You always set default value\
    \ to parameters passed to a function or variables that you initialize. You may\
    \ have seen code similar to the following:\n\n```\nfunction sum(a,b) {\n  a =\
    \ a || 0;\n  b = b || 0;\n  return (a+b);\n}\nconsole.log(sum(9,9)); //18\nconsole.log(sum(9));\
    \ //9\n```\n\nHere, we are using || (the OR operator) to default variables a and\
    \ b to 0 if no value was supplied when this function was invoked. ES6, you have\
    \ a standard way of defaulting function arguments. The preceding example can be\
    \ rewritten as follows:\n\n```\nfunction sum(a=0, b=0) {\n  return (a+b);\n}\n\
    console.log(sum(9,9)); //18\nconsole.log(sum(9)); //9\n```\n\nYou can pass any\
    \ valid expression or function call as part of the default parameter list.\n\n\
    # Spread and rest\n\nES6 has a new operator, ... Based on how it is used, it is\
    \ called either spread or rest. Let's look at a trivial example:\n\n```\nfunction\
    \ print (a, b) {\n  console.log(a,b);\n}\nprint(...[1,2]); //1,2\n```\n\nWhat's\
    \ happening here is that when you add ...before an array (or an iterable) it spreads\
    \ the element of the array in individual variables in the function parameters.\
    \ The a and b parameters were assigned two values from the array when it was spread\
    \ out. Extra parameters are ignored while spreading an array:\n\n```\nprint(...[1,2,3]);\
    \ //1,2\n```"
