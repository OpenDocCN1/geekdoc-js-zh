    # # Summary


    While building large applications, we see certain problem patterns repeating over
    and over. These patterns have well-defined solutions that can be reused to build
    a robust solution. In this chapter, we discussed some of the important patterns
    and ideas around these patterns. Most modern JavaScript applications use these
    patterns. It is rare to build a large-scale system built without implementing
    modules, decorators, factories, or MV* patterns. These are foundational ideas
    that we discussed in this chapter. We will discuss various testing and debugging
    techniques in the next chapter.'
