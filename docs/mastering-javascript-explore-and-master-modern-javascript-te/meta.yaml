  md: '# Server-Side JavaScript


    We have been focusing so far on the versatility of JavaScript as the language
    of the browser. It speaks volumes about the brilliance of the language given that
    JavaScript has gained significant popularity as a language to program scalable
    server systems. In this chapter, we will look at Node.js. Node.js is one of the
    most popular JavaScript frameworks used for server-side programming. Node.js is
    also one of the most watched project on GitHub and has superb community support.


    Node uses V8, the virtual machine that powers Google Chrome, for server-side programming.
    V8 gives a huge performance benefit to Node because it directly compiles the JavaScript
    into native machine code over executing bytecode or using an interpreter as a
    middleware.


    The versatility of V8 and JavaScript is a wonderful combination—the performance,
    reach, and overall popularity of JavaScript made Node an overnight success. In
    this chapter, we will cover the following topics:


    +   * An asynchronous event-model in a browser and Node.js

    * Callbacks

    * Timers

    * Eventmitters

    * Modules and npm'
  merge: -1
  pgno: 219
- img_proc: false
  md: '# An asynchronous evented-model in a browser


    Before we try to understand Node, let''s try to understand JavaScript in a browser.


    Node relies on event-driven and asynchronous platforms for server-side JavaScript.
    This is very similar to how browsers handle JavaScript. Both the browser and Node
    are event-driven and non-blocking when they use I/O.


    To dive deeper into the event-driven and asynchronous nature of Node.js, let''s
    first do a comparison of the various kinds of operations and costs associated
    with them:


    | L1 cache read | 0.5 nanoseconds |

    | L2 cache read | 7 nanoseconds |

    | RAM | 100 nanoseconds |

    | Read 4 KB randomly from SSD | 150,00 ns |

    | Read 1 MB sequentially from SSD | 1,000,000 ns |

    | Read 1 MB sequentially from disk | 20,000,000 ns |


    These numbers are from https://gist.com/jboner/2841832 and show how costly Input/Output
    (I/O) can get. The longest operations taken by a computer program are the I/O
    operations and these operations slow down the overall program execution if the
    program keeps waiting on these I/O operations to finish. Let''s see an example
    of such an:


    ```

    console.log("1");

    var log = filesystemReader.read("./verybigfile.txt");

    console.log("2");

    ```


    When you call filesystem.read(*), you are reading a file from the filesystem.
    As we just saw, I/O is the bottleneck here and can take quite a while before the
    operation is complete. Depending on the kind of hardware, filesystem, OS, and
    so, this operation will block the overall program execution quite a bit. The preceding
    code does some I/O that will be a blocking operation—the process will be blocked
    until I/O finishes and the data comes back. This is the traditional I/O model
    and most of us are familiar with. However, this is costly and can cause terribly
    latency. Every process has associated memory and state—both these will be blocked
    until I/O is complete.'
