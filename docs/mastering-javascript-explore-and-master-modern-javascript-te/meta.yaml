    For beginners, JavaScript scoping is slightly confusing. These concepts may seem\
    \ straightforward; however, they are not. Some important subtleties exist that\
    \ must be understood in order to master the concept. So what is Scope? In JavaScript,\
    \ scope refers to the context of code.\n\nA variable's scope is the context in\
    \ which the variable exists. The scope specifies from where you can access a variable\
    \ and whether you have access to the variable in that context. Scopes can be globally\
    \ or locally defined."
