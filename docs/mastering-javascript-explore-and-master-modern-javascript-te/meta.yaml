  md: '# JavaScript Primer


    +   - Use the Boolean() function; this is an ordinary function that returns a
    primitive Boolean:


    ```

    var fBooleanTrue = Boolean(true);

    var fBooleanFalse = Boolean(false);

    ```


    Both these methods return truthy or falsy values. However, if you create a Boolean
    object using the new operator, things can go really wrong.


    Essentially, when you use the new operator and the Boolean(value) constructor,
    you don''t get a primitive true or false in return, you get an object instead—and
    unfortunately, JavaScript considers an object as truthy:


    ```

    var oBooleanTrue = Boolean(true);

    var oBooleanFalse = Boolean(false);

    console.log(oBooleanTrue); //true

    console.log(typeof oBooleanTrue); //object

    if(oBooleanFalse){

