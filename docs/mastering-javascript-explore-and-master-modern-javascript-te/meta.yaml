  md: "# Working with browser events\n\nWhen you are developing for browsers, you\
    \ will have to deal with user interactions and events associated to them, for\
    \ example, text typed in the textbox, scrolling of the page, mouse button press,\
    \ and others. When the user does something on the page, an event takes place.\
    \ Some events are not triggered by user interaction, for example, load event does\
    \ not require a user input.\n\nWhen you are dealing with mouse or keyboard events\
    \ in the browser, you can predict when and in which order these events will occur.\
    \ You will have to constantly look for a key press or move event to happen. It's\
    \ like running an endless background loop listening to some key or mouse event\
    \ to happen. In traditional programming, this was known as polling. There are\
    \ many variations of these where the waiting thread could be optimized using queues;\
    \ however, polling is still not a great idea in detail.\n\nBrowsers provide a\
    \ much better alternative to polling. Browsers provide you with programmatic means\
    \ to react when event occurs. These hooks are generally called listeners. You\
    \ can register a listener that reacts to a particular event and executes an associated\
    \ callback function when the event is triggered. Consider this example:\n\n```\n\
    <script>\naddEventListener(\"click\", function() {\n  ...\n});\n</script>\n```\n\
    \nThe add function registers its second argument as a callback function. This\
    \ callback is executed when the event specified in the first argument is triggered.\n\
    \nWhat we just saw now is a generic listener for the click event. Similarly, every\
    \ DOM element has its own阵 method, which allows you to listen specifically on\
    \ this element:\n\n```\n<button>Submit</button>\n<p>No handler here.</p>\n<script>\n\
    var button = document.getElementById(\"#Bigbutton\");\nbutton.addEventListener(\"\
    click\", function() {\n  console.log(\"Button clicked.\");\n});\n</script>\n```"
