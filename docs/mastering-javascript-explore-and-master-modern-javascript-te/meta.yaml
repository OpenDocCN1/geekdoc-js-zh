  md: '# About the Reviewer


    Ivano Malavolta is a postdoctoral researcher at the Gran Sasso Science Institute
    (L''Aquila, Italy), and he holds a PhD in computer science from the University
    of L''Aquila. His research is positioned in three main fields: software architecture,
    Model-Driven Engineering (MDE), and mobile-enabled systems. He is especially interested
    in investigating how MDE techniques can be exploited for architecting complex
    and mobile-enabled software systems at the right level of abstraction. He is the
    author of more than 40 papers in international journals and peer-reviewed international
    conferences'' proceedings; among them, he has coauthored two articles in the IEEE
    Transactions on Software Engineering (TSE), which is considered the leading journal
    in the field of software engineering. He is a reviewer for four international
    journals, a program committee member of 10 international conferences, a reviewer
    for 13 international conferences, and a guest editor of international journal.


    He is an instructor of three courses on software engineering, mobile computing,
    and mobile application development via web technologies; these courses are held
    at the University of L''Aquila and Gran Sasso Science Institute, Italy.


    He has previously reviewed other books about web technologies for Packt Publishing,
    such as Backbone.js Cookbook by Vadim Mirorod and Backbone.js Blueprints by Andrew
    Burgess.'
