    \ method that will be called by the Subject.notify() method. Now we can actually\
    \ add these observers to the Subject via Twitter's new:\n\n```\nvar tweetApp =\
    \ new Twitter();\ntweetApp.addObserver(TweetUpdater);\ntweetApp.addObserver(TweetFollower);\n\
    tweetApp.fetchTweets();\ntweetApp.removeObserver(TweetUpdater);\ntweetApp.removeObserver(TweetFollower);\n\
    ```\n\nThis will result in the following output: \n\n+   - Added observer\n- Added\
    \ observer\n- Updated Tweet - { '0': [{ tweet: This is one nice observer' }] }\
    \ \"Following this tweet - { '0': [{ tweet: This is one nice observer' }] }\n\
    - Removed Observer\n- Removed Observer\n\nThis is a basic implementation to illustrate\
    \ the idea of the observer pattern.\n\n# JavaScript Model-View-* patterns\n\n\
    Model-View-Controller (MVC), Model-View-Presenter (MVP), and Model-View-Model\
    \ (MVVM) have been popular with server applications, in recent years JavaScript\
    \ applications are also using these patterns to structure and manage large projects.\
    \ Many JavaScript frameworks have emerged that support MV* patterns. We will discuss\
    \ a few examples using Backbone.js.\n\n# Model-View-Controller\n\nMVC is a popular\
    \ structural pattern where the idea is to divide an application into three parts\
    \ to separate the internal representations of information from the presentation\
    \ layer. MVC consists of components. The model is the application object, view\
    \ is the presentation of the underlying model object, and controller handles the\
    \ way in which the user interface behaves, depending on the user interactions."
