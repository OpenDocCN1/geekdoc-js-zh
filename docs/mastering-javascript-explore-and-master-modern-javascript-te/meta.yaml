  md: "# Inline function expressions\n\nThere is another popular usage of inline function\
    \ expressions where the functions are passed as parameters to other functions:\n\
    \n```\nfunction setActiveTab(activeTabHandler, tab) {\n  // active tab\n  // call\
    \ handler\n  activeTabHandler();\n}\nsetActiveTab(function () {\n  console.log(\"\
    Setting active tab\");\n}, 1 );\nprints(\"Setting active tab\")\n```\n\nAgain,\
    \ you can name this inline function expression to make sure that you get a correct\
    \ stack trace while you are debugging the code.\n\n# Block scopes\n\nAs we discussed,\
    \ JavaScript does not have the concept of block scopes. Programmers from other\
    \ languages such as Java or C find this very uncomfortable. ECMAScript 6 (ES6)\
    \ introduces the let keyword to introduce traditional block scope. This is so\
    \ incredibly convenient if you are sure your environment is going to support ES6,\
    \ you should always use the let keyword. See the following:\n\n```\nvar foo =\
    \ true;\nif (foo) {\n  let bar = 42; //variable bar is local in this block { }\n\
    \  console.log(bar);\n}\nconsole.log(bar); // ReferenceError\n```\n\nHowever,\
    \ as things stand today, ES6 is not supported by default in most popular browsers.\n\
    \nThis chapter so far should have given you a fair understanding of how scoping\
    \ works in JavaScript. If you are still unclear, I would suggest that you stop\
    \ here and revisit the earlier sections of this chapter. Research your doubts\
    \ on the Internet or put your questions on Stack Overflow. In short, make sure\
    \ that you have no doubts related to the scoping rules."
