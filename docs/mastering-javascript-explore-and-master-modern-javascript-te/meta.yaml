  md: "# DOM Manipulation and Events\n\nYou can add multiple event handlers for multiple\
    \ events as follows:\n\n```\n$(\"#heading\").on(\n  mouseenter: function() {\n\
    \    console.log(\"mouse entered on heading\");\n  },\n  mouseleave: function()\
    \ {\n    console.log(\"mouse left heading\");\n  },\n  click: function() {\n \
    \   console.log(\"clicked on heading\");\n  }\n});\n```\n\nAs of jQuery 1.7, all\
    \ events are bound via the on() method, even if you call helper methods such as\
    \ click(). Internally, jQuery maps these calls to the on() method. Due to this,\
    \ it is generally recommended to use the on() method for faster execution.\n\n\
    # Event delegation\n\nEvent delegation allows us to attach a single event listener\
    \ to a parent element. This event will fire for all the descendants matching a\
    \ selector even if these descendants will be created in the future (after the\
    \ listener was bound to the element).\n\nWe discussed event bubbling earlier.\
    \ Event delegation in jQuery works primarily due to event bubbling. Whenever an\
    \ event occurs on a page, it bubbles up from the element that it originated from,\
    \ up to its parent, up to the parent's parent, and so on, until it reaches the\
    \ root element (window). Consider the following example:\n\n```\n<html>\n<body>\n\
    \  <div id=\"container\">\n    <ul id=\"list\">\n      <li><a href=\"http://google.com\"\
    >Google</a></li>\n      <li><a href=\"http://myntra.com\">Myntra</a></li>\n  \
    \    <li><a href=\"http://bing.com\">Bing</a></li>\n    </ul>\n  </div>\n</body>\n\
    </html>\n```"
