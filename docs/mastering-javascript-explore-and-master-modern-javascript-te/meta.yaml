    # ++ and -- operators


    The ++ operator is a shorthand version of adding 1 to a value and -- is a shorthand
    to subtract 1 from a value. Java and C have equivalent operators and most will
    be familiar with them. How about this?


    ```

    var a = 1;

    var b = a++;

    console.log(a); //2

    console.log(b); //1

    ```


    Err, what happened here? The b variable have the value 2? ++ and -- operators
    are unary operators that can be used prefix or postfix. The order in which they
    are used matters. When ++ is used in the prefix position as ++a, it increments
    the value before it is returned from the expression rather than after as a++.
    Let''s see the following code:


    ```

    var a = 1;

    var b = +=;

    console.log(a); //2

    console.log(b); //2

    ```


    Many programmers used the chain assignments to assign a single value to multiple
    variables as follows:


    ```

    var a, b, c;

    a = b = c = 0;

    ```'
