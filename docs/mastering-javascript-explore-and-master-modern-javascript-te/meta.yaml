  md: "# EventEmitters\n\nWe discussed earlier that callbacks are great for the execution\
    \ of one-off logic. **EventEmitters** are useful in responding to repeating events.\
    \ EventEmitters fire events and have the ability to handle these events when triggered.\
    \ Several important Node APIs are built on EventEmitters.\n\nEvents raised are\
    \ handled by listeners. A listener is a callback function associated with an event—when\
    \ the event fires, its associated listener is triggered as well. The event `Emitter`\
    \ is a class that is used to provide a consistent interface to emit (trigger)\
    \ and bind callbacks to events.\n\nAs a common style convention, event names are\
    \ represented by a camel-cased string; however, any valid string can be used as\
    \ an event name.\n\nUse `require('events')` to access the EventEmitter class:\n\
    \n```\nvar EventEmitter = require('events');\n```\n\nWhen an EventEmitter instance\
    \ encounters an error, it emits an error event. Error events are treated as a\
    \ special case in Node.js. If you don't handle these, the program exits with an\
    \ exception stack.\n\nAll EventEmitters emit the `addListener` event when new\
    \ listeners are added and `removeListener` when a listener is removed.\n\nTo understand\
    \ the usage of EventEmitters, we will build a simplistic telnet server where different\
    \ clients can log in and enter certain commands. Based on these commands, our\
    \ server will respond accordingly:\n\n```\nvar _net = require('net');\nvar _events\
    \ = require('events');\nvar _emitter = new EventEmitter();\n_emitter.on('join',\
    \ function(id, caller) {\n  console.log(id+\" - joined\");\n});\n_emitter.on('quit',\
    \ function(id, caller) {\n  console.log(id+\" - left\");\n});\n```"
  merge: -1
  pgno: 229
- img_proc: false
  md: "# Server-Side JavaScript\n\n```\nvar _server = _net.createServer(function(caller)\
    \ {\n  var process_id = caller.remoteAddress + ':' + caller.remotePort;\n  emitter.emit('join',id,caller);\n\
    \  caller.on('end', function() {\n    console.log('disconnected');\n    emitter.emit('quit',id,caller);\n\
    \  });\n});\n_server.listen(8124);\",\n```\n\nIn this snippet, we are using the\
    \ net module from Node. The idea here is to create a server and let the client\
    \ connect to it via a standard telnet command. When a client connects, the server\
    \ displays the client address and port, and when the client quits, the server\
    \ logs this too.\n\nWhen a client connects, we are emitting a join event, and\
    \ when the client disconnects, we are emitting a quit event. We have listeners\
    \ for both these events and they log appropriate messages on the server.\n\nYou\
    \ start your program and connect to our server using telnet as follows:\n\n```\n\
    telnet 127.0.0.1 8124\n```\n\nOn the server console, you will see the server logging\
    \ which client joined the server:\n\n```\n> node app.js\n::ffff:127.0.0.1:51000\
    \ - joined\n::ffff:127.0.0.1:51001 - joined\n```\n\nIf any client quits the session,\
    \ an appropriate message will appear as well.\n\n# Modules\n\nWhen you are writing\
    \ a lot of code, you soon reach a point where you have to start thinking about\
    \ how you want to organize the code. Node modules are CommonJS modules that we\
    \ discussed earlier when we discussed module patterns. Node modules can be published\
    \ to the Node Package Manager (npm) repository. The npm repository is an online\
    \ collection of Node modules."
  merge: -1
  pgno: 230
- img_proc: false
  md: "# Creating modules\n\nNode modules can be either single files or directories\
    \ containing one or more files. It's usually a good idea to create a separate\
    \ module directory. The file in the module directory that will be evaluated is\
    \ normally named index.js. A module directory can look as follows:\n\n```\nnode_project/src/nav\n\
    \  -- index.js\n```\n\nIn your project, the module directory contains the module\
    \ code. Conventionally, the module code needs to reside in the index.js file—you\
    \ can change this to another file if you want. Consider this trivial module geo.js:\n\
    \n```\nexports.area = function (r) {\n  return 3.14 * r * r;\n}\nexports.circumference\
    \ = function (r) {\n  return 3.14 * 3.14 * r;\n}\n```\n\nYou are exporting functions\
    \ via exports. You can use the module using the require function. This function\
    \ takes the name of the module or system path to the module's code. You can use\
    \ the module that we created as follows:\n\n```\nvar geo = require('./geo.js');\n\
    console.log(geo.area(2));\n```\n\nAs we are exporting only functions to the outside\
    \ world, everything else remains private. If you recollect, we discussed the module\
    \ pattern in detail–Node uses CommonJS modules. There is an alternative syntax\
    \ to create modules as well. You can use modules.exports to export your modules.\
    \ Indeed, exports is a helper created for modules.exports. When you use exports,\
    \ it attaches the properties of a module to modules.exports. However, if modules.exports\
    \ already has some properties attached to it, properties attached by exports are\
    \ ignored."
  merge: -1
  pgno: 231
- img_proc: false
  md: "# Server-Side JavaScript\n\nThe Geo module created earlier in this section\
    \ can be rewritten in order to return a single Geo constructor function rather\
    \ than an object containing functions. We can rewrite the geo module and its usage\
    \ as follows:\n\n```\nvar Geo = function (PI) {\n  this.PI = PI;\n}\nGeo.prototype.area\
    \ = function (r) {\n  return this.PI * r * r;\n}\nGeo.prototype.circumference\
    \ = function (r) {\n  return this.PI * this.PI * r;\n}\nmodule.exports = Geo;\n\
    ```\n\nConsider a config.js module:\n\n```\nvar db_config = {\n  server: \"0.0.0.0\"\
    ,\n  port: \"3306\",\n  user: \"mysql\"\n  password: \"mysql\"\n}\nmodule.exports\
    \ = db_config;\n```\n\nIf you want to access db.config from outside this module,\
    \ you can use require() to include the module and refer to the object as follows:\n\
    \n```\nvar config = require('./config.js');\nconsole.log(config.user);\n```\n\n\
    There are three ways to organize modules:\n\n+   * Using a relative path, for\
    \ example, config = require('./lib/config.js')\n* Using an absolute path, for\
    \ example, config = require('/nodeproject/lib/config.js')\n* Using a module search,\
    \ for example, config = require('config')\n\nThe first two are self-explanatory–they\
    \ allow Node to look for a module in a particular location in the filesystem."
  merge: -1
  pgno: 232
- img_proc: false
  md: "When you use the third option, you are asking Node to locate the module using\
    \ the standard look method. To locate the module, Node starts at the current directory\
    \ and appends `./node_modules/` to it. Node then attempts to load the module from\
    \ this location. If the module is not found, then the search starts from the parent\
    \ directory until the root of the filesystem is reached.\n\nFor example, if `require('config')`\
    \ is called in `/projects/node/`, the locations will be searched until a match\
    \ is found:\n\n+   - /projects/node /node_modules/config.js\n- /projects/node/node_modules/config.js\n\
    - /node_modules/config.js\n\nFor modules downloaded from npm, using this method\
    \ is relatively simple. As we discussed earlier, you can organize your modules\
    \ as long as you provide a point of entry for Node.\n\nThe easiest way to do this\
    \ is create the `.node_modules/supermodule/` directory, and insert an `index.js`\
    \ file in this directory. The `index.js` file will be loaded by default. Alternatively,\
    \ you can put a `package.json` file in the `mymodename` folder, specifying the\
    \ name and main file of the module:\n\n```\n{\n  \"name\": \"supermodule\",\n\
    \  \"main\": \\./lib/config.js\"\n}\n```\n\nYou have to understand that Node caches\
    \ modules as objects. If you have two (or more) files requiring a specific module,\
    \ the first `require` will cache the module in memory so that the second `require`\
    \ will not have to reload the module source code. However, the second `require`\
    \ can alter the module functionality if it wishes to. This is commonly called\
    \ `monkey patching` and is used to modify a module behavior without really modifying\
    \ or versioning the original module.\n\n# npm\n\nThe npm is the package manager\
    \ used by Node to distribute modules. The npm can be used to install, update,\
    \ and manage modules. Package managers are popular in other languages like Python.\
    \ The npm automatically resolves and updates dependencies for a package and hence\
    \ makes your life easy."
  merge: -1
  pgno: 233
- img_proc: false
  md: "# Installing packages\n\nThere are two ways to install npm packages: locally\
    \ or globally. If you want to use the module's functionality only for a specific\
    \ Node project, you can install it locally relative to the project, which is default\
    \ behavior of npm install. Alternatively, there are several modules that you can\
    \ use as a command-line tool; in this case, you can install them globally:\n\n\
    ```\nnpm install request\n```\n\nThe install directive with npm install will install\
    \ a particular module—request in this case. To confirm that npm install worked\
    \ correctly, check to see whether node modules directory exists and verify that\
    \ it contains a directory for the package(s) that you installed.\n\nAs you start\
    \ adding modules to your project, it becomes difficult to manage the version/dependency\
    \ of each module. The best way to manage locally installed packages is to create\
    \ a package.json file in your project.\n\nA package.json file can help you in\
    \ the following ways:\n\n+   - Defining versions of each module that you want\
    \ to install. There are times your project depends on a specific version of a\
    \ module. In this case, your package.json helps you download and maintain the\
    \ correct version dependency.\n- Serving as a documentation of all the modules\
    \ that your project needs.\n- Deploying and packaging your application without\
    \ worrying about managing dependencies every time you deploy the code.\n\nYou\
    \ can create package.json by issuing the following command:\n\n```\nnpm init\n\
    ```\n\nAfter answering basic questions about your project, a blank package.json\
    \ is created with content similar to the following:\n\n```\n{\n  \"name\": \"\
    chapter9\",\n  \"version\": \"1.0.0\",\n  \"description\": \"chapter9 sample project\"\
    ,\n  \"main\": \"app.js\",\n  \"dependencies\": {\n    \"request\": \"*2.65.0\"\
    \n  }\n}\n```"
  merge: -1
  pgno: 234
- img_proc: false
  md: ''
  merge: -1
  pgno: 235
- img_proc: false
  md: "# Server-Side JavaScript\n\nThere is a cool trick that I love to use. While\
    \ installing modules from the command line, we can add the --save flag to add\
    \ that module's dependency to the package.json file automatically:\n\n```\nnpm\
    \ install async --save\nnpm WARN package.json chapter9@1.0.0 No repository field.\n\
    npm WARN package.json chapter9@1.0.0 No README data\nasync@1.5.0 node_modules/async\n\
    ```\n\nIn the preceding command, we installed the async module with the normal\
    \ npm command with a --save flag. There is a corresponding entry automatically\
    \ created in package.json:\n\n```\n\"dependencies\": {\n  \"async\": \"1.5.0\"\
    ,\n  \"request\": \"2.65.0\"\n}\n```\n\n# JavaScript performance\n\nLike any other\
    \ language, writing JavaScript code at scale is an involved task. As the language\
    \ matures, several of the inherent problems are being taken care of. There are\
    \ several exceptional libraries that aid in writing good quality code. For most\
    \ serious systems, good code = high performance code. The demands of new-generation\
    \ software systems are high on performance. In this section, we will discuss a\
    \ few tools that you can use to analyze your JavaScript code and understand its\
    \ performance metrics.\n\nWe will discuss the following two ideas in this section:\n\
    \n+   - Profiling: Timing various functions and operations during script-profiling\
    \ identifying areas where you can optimize your code\n- Network performance: Examining\
    \ the loading of network resources such as images, stylesheets, and scripts\n\n\
    # JavaScript profiling\n\nJavaScript profiling is critical to understand performance\
    \ aspects of various parts of your code. You can observe timings of the functions\
    \ and operations which operation is taking more time. With this information, you\
    \ can optimize the performance of time-consuming functions and tune the overall\
    \ performance of your code. We will be focusing on the profiling options provided\
    \ by Chrome's Developer Tools. There are comprehensive analysis tools that you\
    \ can use to understand the performance metrics of your code."
  merge: -1
  pgno: 236
- img_proc: false
  md: '# The CPU profile


    The CPU profile shows the execution time spent by various parts of your code.
    We have to inform DevTools to record the CPU profile data. Let''s take the profiler
    for a spin.


    You can enable the CPU profiler in DevTools as follows:


    +   1. Open the Chrome DevTools Profiles panel.

    2. Verify that Collect JavaScript CPU Profile is selected:


    ![](bbox=[0.223, 0.305, 0.776, 0.532])


    For this chapter, we will be using Google''s open bench benchmark, http://octane-benchmark.googlecode.com/index.html
    We will use this because it contains sample functions where we can see various
    performance bottlenecks and benchmarks. To start recording the CPU profile, open
    DevTools in Chrome, and in the **Profiles** tab, click the **Start** button or
    press **Cmd/Ctrl + E**. Refresh the **V8 Benchmark Suite** page. When the page
    has completed reloading, a score for the benchmark tests is shown. Return to the
    **Profiles** panel and stop the recording by clicking on the **Stop** button or
    pressing **Cmd/Ctrl + E** again.'
  merge: -1
  pgno: 237
- img_proc: false
  md: '# Server-Side JavaScript


    The recorded CPU profile shows you a detailed view of the functions and the execution
    time taken by the bottom-up fashion, as shown in the following image:


    ![](bbox=[0.166, 0.206, 0.831, 0.335])


    # The Timeline


    The Chrome DevTools Timeline is the first place you can start looking at the overall
    performance of your code. It lets you record and analyze all the activity in your
    application as it runs.


    The Timeline provides you with a complete overview of where time is spent loading
    and using your site. A timeline includes a record for each event that occurred
    and is displayed in a waterfall graph:


    ![](bbox=[0.166, 0.503, 0.831, 0.755])'
  merge: -1
