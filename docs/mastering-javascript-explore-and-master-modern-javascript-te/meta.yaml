  md: "Consider the following example of asynchronous code execution in Node.js:\n\
    \n```\nvar fs = require('fs');\nconsole.log('1');\nfs.readFile('./1/response.json',\
    \ function (error, data) {\n  if(error) {\n    console.log(data);\n  }\n});\n\
    console.log('2');\n```\n\nIn this program, we read the response.json file from\
    \ the disk. When the disk I/O is finished, the callback is executed with parameters\
    \ containing the argument's error, if any error occurred, and data, which is the\
    \ file data. What you will see in the console is the output of console.log('1')\
    \ and console.log('2') immediately after another:\n\n![](bbox=[0.217, 0.403, 0.782,\
    \ 0.663])\n\nNode.js does not need any additional server component as it creates\
    \ its own server process. A Node application is essentially a server running on\
    \ a designated port. Node, the server and application are the same."
