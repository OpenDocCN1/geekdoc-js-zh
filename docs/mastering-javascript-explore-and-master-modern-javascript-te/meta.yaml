  md: "Functions, Closures, and Modules\n\nAs with any other object in JavaScript,\
    \ functions have the following capabilities:\n\n+   * They can be created via\
    \ literals\n* They can be assigned to variables, array entries, and properties\
    \ of other objects\n* They can be passed as arguments to functions\n* They can\
    \ be returned as values from functions\n* They can possess properties that can\
    \ be dynamically created and assigned\n\nWe will talk about each of these unique\
    \ abilities of a JavaScript function in this chapter and the rest of the book.\n\
    \n# A function literal\n\nOne of the most important concepts in JavaScript is\
    \ that the functions are the primary unit of execution. Functions are the pieces\
    \ where you wrap all your code, hence they will give your programs a structure.\n\
    \nJavaScript functions are declared using a function literal.\n\nFunction literals\
    \ are composed of the following four parts:\n\n+   * The function keyword.\n*\
    \ An optional name that, if specified, must be a valid JavaScript identifier.\n\
    * A list of parameter names enclosed in parentheses. If there are no parameters\
    \ to the function, you need to provide empty parentheses.\n* The body of the function\
    \ as a series of JavaScript statements enclosed in braces.\n\n# A function declaration\n\
    \nThe following is a very trivial example to demonstrate all the components of\
    \ a function declaration:\n\n```\nfunction add(a,b) {\n  return a+b;\n}\nc = add(1,2);\n\
    console.log(c);    //prints 3\n```"
  merge: -1
  pgno: 64
- img_proc: false
  md: "# Chapter 2\n\nThe declaration begins with a function keyword followed by the\
    \ function name. The function name is optional. If a function is not given a name,\
    \ it is said to be anonymous. We will see how anonymous functions are used. The\
    \ third part is the set of parameters of the function, wrapped in parentheses.\
    \ Within the parentheses is a set of zero or more parameter names separated by\
    \ commas. These names will be defined as variables in the function, and instead\
    \ of being initialized to undefined, they will be initialized to the arguments\
    \ when the function is invoked. The fourth part is a set of statements wrapped\
    \ in curly braces. These statements are the body of the function. They are executed\
    \ when the function is invoked.\n\nThis method of function declaration is also\
    \ known as function statement. When you declare functions like this, the content\
    \ of the function is compiled and an object with the same name as the function\
    \ is created.\n\nAnother way of function declaration is via function expressions:\n\
    \n```\nvar add = function(a,b){\n  return a+b;\n}\nc = add(1,2);\nconsole.log(c);\
    \ //prints 3\n```\n\nHere, we are creating an anonymous function and assigning\
    \ it to an add variable; this variable is used to invoke the function as in the\
    \ earlier example. One problem with this style of function declaration is that\
    \ we cannot have recursive calls to this kind of function. Recursion is an elegant\
    \ style of coding where the function calls itself. You can use named function\
    \ expressions to solve this limitation. As an example, refer to the following\
    \ function to compute the factorial of a given number, n:\n\n```\nvar facto =\
    \ function factorial(n) {\n  if (n <= 1) {\n    return 1;\n  }\n  return n * factorial(n\
    \ - 1);\n}\nconsole.log(facto(3)); //prints 6\n```\n\nHere, instead of creating\
    \ an anonymous function, we are creating a named function. Now, because the function\
    \ can call itself recursively.\n\nFinally, you can create self-invoking function\
    \ expressions (we will discuss them later):\n\n```\nfunction sayHello() {\n  console.log(\"\
    hello!\");\n}();\n```\n\n# [ 47 ]"
