  md: '# Data Structures and Manipulation


    We need to add a backslash before the comma because a comma is treated specially
    in RegEx and we need to escape it if we want to use it literally.


    Using simple character classes, you can match multiple patterns. For example,
    if you want to match cat, bat, and fat, and the following snippet shows you how
    to use simple character classes:


    ```

    var strMatch = ''wooden bat, smelly Cat, a fat cat'';

    var re = /BCfat/gi;

    var arrMatches = strMatch.match(re);

    console.log(arrMatches);

    //["bat", "fat", "cat"]

    ```


    In example, this variation enables us to write concise RegEx patterns.

    Take the following example:


    ```

    var strMatch = ''i11,i12,i13,i14,i15,i16,i17,i18,i19'';

    var re = /[i0-5]/gi;

    var arrMatches = strMatch.match(re);

    console.log(arrMatches);

    //["i11", "i12", "i13", "i14", "i15"]

    ```


    we are matching the numeric part of the matching string with a range [0-5], hence
    we get a match from i0 to i5. You can also use the negation class ^ to filter
    the rest of matches


    ```

    var strMatch = ''i11,i12,i13,i14,i15,i16,i17,i18,i19'';

    var re = /[^i0-5]/gi;

    var arrMatches = strMatch.match(re);

    console.log(arrMatches);

    //["i16", "i17", "i18", "i19"]

    ```


    Observe how we are getting only the range clause and not the entire.


    Several characters have shortcut notations. For example, the shortcut \d means
    the same thing as [0-9]


    | Notation | Meaning |

    | \d | Any digit character |

    | \w | An alphanumeric character (word character) |

    | \s | Any whitespace character (space, tab, newline, and similar) |

    | \D | A character that is not a digit |

    | \W | A non-alphanumeric character |

    | \S | A non-whitespace character |

    | . | Any character except newline |'
