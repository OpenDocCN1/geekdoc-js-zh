    \ the usage of eval():\n\n```\nconsole.log(typeof eval(\"1+1\"));    // \"object\"\
    \nconsole.log(eval(new String(\"1+1\")));     // 1\nconsole.log(eval(\"1+1\"));\
    \                   // 2\nconsole.log(typeof eval(\"1+1\"));          // returns\
    \ \"number\"\nvar expression = new String(\"1+1\");\nconsole.log(eval(expression.toString()));\
    \ // 2\n```\n\nI will refrain from showing other uses of eval() and make sure\
    \ you are discouraged to stay away from it.\n\n# The strict mode\n\nECMAScript\
    \ 5 has a strict mode that results in cleaner JavaScript, with fewer unsafe features,\
    \ more warnings, and more logical behavior. The normal (non-strict) mode is also\
    \ called sloppy mode. The strict mode can help you avoid a few sloppy programming\
