  md: '# JavaScript Primer


    You can save this HTML page locally and open it in a browser. On Firefox, you
    can open the Developer console (Firefox menu | Developer | Web Console) and you
    can see the "Hello World" text on the Console tab. Based on your OS and browser
    version, the screen may look different:


    ![](bbox=[0.28, 0.237, 0.719, 0.345])


    You can run the page using Chrome''s Developer Tool:


    ![](bbox=[0.199, 0.396, 0.815, 0.497])


    A interesting thing to notice here is that there is an error displayed on the
    console regarding the missing .js file that we are trying to import the following
    line of code:


    ```

    <script type="text/javascript" src="script.js"></script>

    ```


    Using browser console or an extension such as Firefox can be very useful in debugging
    error conditions in the code. We will discuss in detail the debugging techniques
    in later chapters.


    Creating HTML scaffolds can be tedious for every exercise in this. Instead, we
    want to use a Read-Eval-Print-Loop (REPL) for JavaScript. Unlike Python, JavaScript
    does not come packaged with an REPL. We use Node.js as an REPL. If you have Node.js
    installed on your machine, you can just type node on the command line and start
    experimenting with it. You will observe that Node REPL errors are not very elegantly
    displayed.'
