  md: "# Chapter 9\n\nWhat we changed was to wrap the asynchronous code in a getSiteStatus()\
    \ function, pass a function named callback() as a parameter to this function,\
    \ and execute this function on the last line of getStatusCode(). The showStatusCode\
    \ callback function simply wraps around console.log() that we called earlier.\
    \ The difference, is in how the asynchronous execution works. The most important\
    \ idea to understand while learning how to program with callbacks is that functions\
    \ are first-class objects that can be stored in variables and passed around with\
    \ different names. Giving simple and descriptive names to your variables is important\
    \ in making your code readable by others. Now that the callback function is called\
    \ once the HTTP call is completed, the value of the status_code variable will\
    \ have a correct value. There are genuine circumstances where you want an asynchronous\
    \ task executed only after another asynchronous task is completed. Consider this\
    \ scenario.\n\n```\nhttp.createServer(function (req, res) {\n  getUrl(url, function\
    \ (err, res) {\n    getUrl(res.data, function(err, res) {\n      ...\n    });\n\
    \  });\n});\n```\n\nAs you see, we are nesting one asynchronous function in another.\
    \ This kind of nesting can result in code that is difficult to read and manage.\
    \ This style of callback is sometimes known as callback hell. To avoid such a\
    \ scenario, if you have code that has to wait for some other asynchronous code\
    \ to finish, then you express your dependency by putting your code in functions\
    \ that get passed around as callbacks. Another important idea is to name the functions\
    \ instead of relying on anonymous functions as callbacks. We can reconstruct the\
    \ preceding example into a more readable one as follows:\n\n```\nvar urlContentProcessor\
    \ = function(data) {\n  ...\n}\nvar urlResponseProcessor = function(data) {\n\
    \  getUrl(data, urlContentProcessor);\n}\nvar createServer = function(req, res)\
    \ {\n  getUrl(url, urlResponseProcessor);\n}\nhttp.createServer(createServer);\n\
    ```"
