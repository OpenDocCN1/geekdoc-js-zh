  md: "# JavaScript Patterns\n\nYou can see that we need to call publicFnTw() via\
    \ modulePattern in publicFn(). Additionally, the public interface is returned\
    \ in an object literal. The improvement on the classic module pattern is what\
    \ is known as the RMP. The primary idea behind this pattern is to define all of\
    \ the members in the private scope and return an anonymous object with pointers\
    \ to the private functionality that needs to be revealed as public.\n\nLet's see\
    \ how we can convert our previous example to an RMP. This example is heavily inspired\
    \ from Christian's blog:\n\n```\nvar revealingExample = function() {\n  var privateOne\
    \ = 1;\n  function privateFn() {\n    console.log('privateFn called');\n  }\n\
    \  var publicTwo = 2;\n  function publicFn() {\n    publicFnTw();\n  }\n  function\
    \ publicFnTw() {\n    privateFn();\n  }\n  function getCurrentState() {\n    return\
    \ 2;\n  }\n  // reveal private variables by assigning public pointers\n  return\
    \ {\n    setup:publicFn,\n    count:publicTwo,\n    increaseCount:publicFnTwo,\n\
    \    current:getCurrentState()\n  };\n}();\nconsole.log(revealingExample.current);\
    \ // 2\nrevealingExample.setup(); //privateFn called\n```\n\nAn important distinction\
    \ is here that you define functions and variables in the private scope and return\
    \ an anonymous object with pointers to the private variables and functions that\
    \ you want to reveal as public. This is a much cleaner variation and should be\
    \ preferred over the classic module pattern."
