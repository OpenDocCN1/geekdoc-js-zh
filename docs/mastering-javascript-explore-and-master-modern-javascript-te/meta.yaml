  md: "JavaScript offers flexible functions and objects that make it easy to create\
    \ robust module systems. Function scopes help create namespaces that are internal\
    \ for the module, and objects can be used to store sets of exported values.\n\n\
    Before we start the pattern itself, let's quickly brush up on a few concepts that\
    \ we discussed earlier.\n\nWe discussed object literals in detail. Object literals\
    \ allow you to create name-value pairs as follows:\n\n```\nvar basicServerConfig\
    \ = {\n  environment: \"production\",\n  startupParams: {\n    cacheTimeout: 30,\n\
    \    locale: \"en_US\"\n  },\n  init: function () {\n    console.log(\"Initializing\
    \ the server\");\n  },\n  updateStartup: function (params) {\n    this.startupParams\
    \ = params;\n    console.log(this.startupParams.cacheTimeout);\n    console.log(this.startupParams.locale);\n\
    \  }\n};\nbasicServerConfig.init(); // \"Initializing the server\"\nbasicServerConfig.updateStartup({cacheTimeout:60,\n\
    locale:\"en_UK\"}); // 60, en_UK\n```\n\nIn this example, we are creating an object\
    \ literal and defining key-value pairs to create properties and functions.\n\n\
    In JavaScript, the module pattern is used well when mimicking the concept of classes.\
    \ Modules allow us to include public/private methods and variables of an object,\
    \ but most importantly, modules restrict these parts from the global scope. As\
    \ the variables and functions are contained in the module scope, they automatically\
    \ prevent naming conflict with other scripts using the same names.\n\nAnother\
    \ beautiful aspect of the module pattern is that we expose only a public API.\
    \ Everything else related to the internal implementation is held private within\
    \ the module's closure."
