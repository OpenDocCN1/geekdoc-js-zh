  md: "# Object-Oriented JavaScript\n\n+   - When there is no context: A function,\
    \ invoked without any object, does not get any context. By default, it is bound\
    \ to the global context. When you use this in such a function, it is also bound\
    \ to the global context.\n\n+   - When this is used in a constructor function:\
    \ As we saw earlier, when a function is called with a new keyword, it acts as\
    \ a constructor. In the case of a constructor, this points to the object being\
    \ constructed. In the following example, f() is used as a constructor (because\
    \ it's invoked with a new keyword) and hence, this is pointing to the new object\
    \ being created. So when we say this.member = \"f\", the new member is added to\
    \ the object being created, in this case, that object happens to be:\n\n```\n\
    var member = \"global\";\nfunction f() {\n    this.member = \"f\";\n}\\var o =\
    \ new f();\nconsole.log(o.member); // f\n```\n\nWe saw that instance properties\
    \ take precedence when the same property is defined as both an instance property\
    \ and prototype. It is easy to visualize that when a new object is created, the\
    \ properties of the constructor's prototype are copied over. However, this is\
    \ not a correct assumption. What actually happens is that the prototype is attached\
    \ to the object and referred when any property of this object is referred. Essentially,\
    \ when a property is referenced on an object, either of the following occur:\n\
    \n+   - The object is checked for the existence of the property. If it's found,\
    \ the property is returned.\n\n+   - The associated prototype is checked. If the\
    \ property is found, it is returned; otherwise, an undefined error is returned.\n\
    \nThis is an important understanding because, in JavaScript, the following code\
    \ works perfectly:\n\n```\nfunction Player() {\n    isAvailable=false;\n}\\var\
    \ crazyBob = new Player();\nPlayer.prototype.isAvailable = function() {\n    return\
    \ isAvailable;\n};\nconsole.log(crazyBob.isAvailable); //false\n```"
