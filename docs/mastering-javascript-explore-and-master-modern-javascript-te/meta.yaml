  md: "In production, however, you would want to use a more standardized approach\
    \ to create modules. Currently, there are two main approaches to create modules.\
    \ The first is known as CommonJS modules CommonJS modules are usually suited for\
    \ server-side JavaScript environments such as Node.js. A CommonJS module contains\
    \ a require() function that receives the name of the module and returns the module's\
    \ interface. The format was proposed by the volunteer group of CommonJS; their\
    \ aim was to design, prototype, and standardize JavaScript APIs. CommonJS modules\
    \ consist of two parts. Firstly, list of variables and functions the module needs\
    \ to expose; when you assign a variable or function to the module.exports variable,\
    \ it is exposed from the module. Secondly, a require function that modules can\
    \ use to import the exports of other modules:\n\n```\n// Add a dependency module\n\
    var crypto = require('crypto');\nfunction randomString(length, chars) {\n  var\
    \ randomBytes = crypto.randomBytes(length);\n}\n\n// Export this module to be\
    \ available for other modules\nmodule.exports=randomString;\n```\n\nCommonJS modules\
    \ are supported by Node.js on the server and curl.js in the browser.\n\nThe other\
    \ flavor of JavaScript modules is called Asynchronous Module Definition (AMD).\
    \ They are browser-first modules and opt for asynchronous behavior. AMD uses a\
    \ define function to define the modules. AMD names and a function. Once the modules\
    \ are loaded, the define function executes the function with their interface as\
    \ an argument. The AMD proposal is aimed at the asynchronous loading of both the\
    \ module and dependencies. The define function is used to define named or unnamed\
    \ modules based on the following signature:\n\n```\ndefine(\nmodule_id = /*optional*/;\n\
    [dependencies] /*optional*/;\ndefinition function /*function for instantiating\
    \ the module or\nobject*/\n);\n```"
