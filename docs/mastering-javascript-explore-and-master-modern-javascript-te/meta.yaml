  md: '> Martin Fowler advocates the test pyramid (http://martinfowler.com/bliki/TestPyramid.html)
    strategy to make sure that we have a high number of unit tests to ensure maximum
    code coverage. The test pyramid says that you should write many more low-level
    unit tests than higher level integration and UI tests.


    There are two important testing strategies that we will discuss in this chapter.


    # # Test-driven development


    Test-driven development (TDD) has gained a lot of prominence in the last few years.
    The concept was first proposed as part of the Extreme Programming methodology.
    The idea is to have short repetitive development cycles where the focus is on
    writing the test cases. The cycle looks as follows:


    +   1. Add a test case as the specifications for a specific unit of code.

    2. Running the suite of test cases to see if the new test case you wrote fails
    — it should (because there is no code for this unit yet). This ensures that the
    current test harnesses well.

    3. Write the code that serves mainly to confirm the test case. This code is not
    optimized or refactor or even entirely correct. However, this is fine at the moment.

    4. Rerun the tests and see if all the test cases pass. After this step, you will
    be confident that the new code is not breaking anything.

    5. Refactor the code to make sure that you are optimizing the unit and handling
    all corner cases.


    These steps are repeated for all the new code that you add. This is an elegant
    strategy that works well for the agile methodology. TDD will be successful only
    if the testable units of code are small and confirm only to the test case and
    nothing more. It is important to write small, modular, and precise code units
    that have input and output confirming the test case.


    # # Behavior-driven development


    A very common problem while following TDD is vocabulary and the definition of
    correctness. BDD tries to introduce a ubiquitous language while writing the test
    cases when you are following TDD. This language makes sure that both the business
    and engineering teams are talking about the same thing.'
