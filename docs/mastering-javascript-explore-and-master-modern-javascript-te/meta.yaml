  md: "# Functions, Closures, and Modules\n\n```\nconsole.log(this.name);\n}\n;\n\
    person.greet();\n```\n\nIn this example, this is bound to the person object invoking\
    \ greet because greet is a method of person. Let's see how this behaves in both\
    \ invocation patterns.\n\nLet's prepare this HTML and JavaScript harness:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>This\
    \ test/javascript</title>\n  <script type=\"text/javascript\">\n  function testF()\
    \ { return this; }\n  console.log(testF());\n  var testFCopy = testF;\n  console.log(testFCopy());\n\
    \  var testObj = {\n    testObjFunc: testF\n  };\n  console.log(testObj.testObjFunc());\n\
    \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nIn the Firebug console,\
    \ you can see the following output:\n\n![](bbox=[0.176, 0.626, 0.821, 0.737])\n\
    \nThe first two invocations were invocation as a function; hence, the this parameter\
    \ pointed to the global context (Window, in this case)."
