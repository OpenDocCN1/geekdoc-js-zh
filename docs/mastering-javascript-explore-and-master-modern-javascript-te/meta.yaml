    // ["2", "3"], first = "1"

    ```


    The unshift() method adds one or more elements to the front of an array and returns
    the length of the array:


    ```

    var myArray = new Array("1", "2", "3");

    myArray.unshift("4", "5");

    // myArray = ["4", "5", "1", "2", "3"]

    ```


    The reverse() method reverses the elements of an array – the array element becomes
    the last and the last the first:


    ```

    var myArray = new Array("1", "2", "3");

    myArray.reverse();

    // transposes the array so that myArray = ["3", "2", "1"]

