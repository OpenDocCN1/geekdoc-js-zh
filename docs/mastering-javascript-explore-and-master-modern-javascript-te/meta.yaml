  md: 'Chapter 4


    Instead of programming to an implementation, you can perform the following:


    ```java

    List<String> theList = new ArrayList<>();

    ```


    How does programming to an interface help? When you program to the List interface,
    you can call methods only available to the List interface and nothing specific
    to ArrayList can be called. Programming to an interface gives you the liberty
    to change your code and use any other specific child of the List interface. For
    example, I can change my implementation and use LinkedList instead of ArrayList.
    You can change your variable to LinkedList instead:


    ```java

    List<String> theList = new LinkedList<>();

    ```


    The beauty of this approach is that if you are using the List at 100 places in
    your program, you don''t have to worry about changing the implementation at all
    these places. As as you were programming to the interface and not to the implementation,
    you were able to write a loosely coupled code. This is an important principle
    when you are using classical inheritance.


    Classical inheritance also has a limitation that you can only enhance the child
    class within the limit of the classes. You can''t fundamentally differ from what
    you have got from the ancestors. This inhibits reuse. Classical inheritance has
    several other problems as follows:


    +   * Inheritance introduces tight coupling. Child classes have knowledge about
    their ancestors. This tightly couples a child class with its parent.

    * When you subclass from parent, you don''t have a choice to select what you want
    to inherit and what you don''t. Joe Armstrong (the inventor of Erlang) explains
    this situation very well—his famous quote:


    > "The problem with object-oriented languages is they''ve got all this implicit
    environment that they carry around with them. You want a banana but what you got
    was a gorilla holding the banana and the entire jungle."


    # Behavior of JavaScript objects


    With this background, let''s explore how JavaScript objects behave. In broad terms,
    an object contains properties, defined as a key-value pair. A property key (name)
    can be a string and the value can be any valid JavaScript value. You can create
    objects using object literals. The following snippet shows how object literals
    are created:


    ```

    var nothing = {};nvar author = {};

    ```


    [ 101 ]'
