  md: "# Chapter 6\n\nThis is very similar to what a test-driven development would\
    \ look like. You write test cases, then you fill in the necessary code to confirm\
    \ to the specifications, and rerun the test suite. Let's understand the structure\
    \ of the Jasmine tests.\n\nOur test specification looks as follows:\n\n```\ndescribe(\"\
    TestStringUtilities\", function() {\n  it(\"converts to capital\", function()\
    \ {\n    var str = \"alert\";\n    expect(capitalizeName(str)).toEqual(\"ALERT\"\
    );\n  });\n  it(\"can handle undefined\", function() {\n    expect(undefined).toEqual(undefined);\n\
    \  });\n});\n```\n\nThe describe(\"TestStringUtilities\") is a test suite. The\
    \ name of the test suite should describe the code that we are writing—this can\
    \ be a function or group of related functionality. In the specifications, you\
    \ call the Jasmine function in which you pass the specification and test function\
    \ used by the test case. This is the actual test case. You can catch one or more\
    \ assertions or the general expectations using the expect function. When all expectations\
    \ are true and it functions. The values that you verify as part of the expectations\
    \ are matched using a matcher. In our example, you can write any JavaScript code\
    \ in the describe and it functions. toEqual() is the matcher that matches two\
    \ values for equality. Jasmine contains a rich set of matches to support most\
    \ of the common cases. Some common matchers supported by Jasmine are as follows:\n\
    \n+   - toBe(): This matcher checks whether two objects being compared are equal.\
    \ This is the same as the == comparison, as shown in the following code:\nvar\
    \ a = { value: 1 };\nvar b = { value: 1 };\n\nexpect(a).toEqual(b); // success,\
    \ same as == comparison\nexpect(a).toBe(b); // failure, same as === comparison\n\
    expect(a).toBe(a); // success, same as === comparison\n\n+   - not: You can negate\
    \ a matcher with a not prefix. For example, expect(1).not.toEqual(2); will negate\
    \ the match made by toEqual().\n\n[ 151 ]"
