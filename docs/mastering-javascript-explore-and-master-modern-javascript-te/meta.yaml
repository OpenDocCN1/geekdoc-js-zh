  md: '# Variables


    Variables are symbolic names for values. The names of variables, or identifiers,
    must follow certain rules.


    A JavaScript variable name must start with a letter, underscore (_), or dollar
    sign ($); subsequent characters can be digits (0-9). As JavaScript is sensitive,
    letters include the characters A through Z (uppercase) and the characters a through
    z (lowercase).


    You can use ISO 8859-1 or Unicode letters in variable names.


    New variables in JavaScript should be defined with the var keyword. If you declare
    a variable without assigning a value to it, its type is undefined by default.
    One terrible thing is if you do not declare your variable with the var keyword,
    they become implicit globals. I will reiterate that implicit globals are a terrible
    thing—we will discuss in detail later in the book when we discuss scopes and closures,
    but it''s important to remember that you should always declare a variable with
    the var keyword unless you know what you are doing:


    ```

    var a; //declares a variable but its undefined

    var b = 0;

    console.log(b); //0

    console.log(a); //undefined

    console.log(a+b); //NaN

    ```


    The NaN is a special value that indicates that the entity is not a number.


    # Constants


    You can create a read-only named constant with the const keyword. The constant
    name must start with a letter, underscore, or dollar sign and can contain alphabetic,
    numeric, or underscore characters:


    ```

    const area_code = ''515'';

    ```


    A constant cannot change the value through assignment or redeclared, and it has
    to be initialized to a value.'
