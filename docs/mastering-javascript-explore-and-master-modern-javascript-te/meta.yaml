  md: "Chapter 2\n\nAll these examples were intended to convey a few concepts that\
    \ govern how closures work. Closures are a prominent feature in the JavaScript\
    \ language and you can see them in most libraries.\n\nLet's look at some popular\
    \ patterns around closures.\n\n# Timers and callbacks\n\nIn implementing timers\
    \ or callbacks, you need to call the handler asynchronously, mostly at a later\
    \ point in time. Due to the asynchronous calls, we need to access variables from\
    \ outside the scope in such functions. Consider the following example:\n\n```\n\
    function delay(message) {\n  setTimeout(function timerFn() {\n    console.log(message);\n\
    \  }, 1000);\n}\ndelay(\"Hello World\");\n```\n\nWe pass the inner timerFn() function\
    \ to the built-in library function, setTimeout(). However, timerFn() has a closure\
    \ over the scope of delay(), and hence it can reference the variable message.\n\
    \n# Private variables\n\nClosures are frequently used to encapsulate some information\
    \ as private variables. JavaScript does not allow such encapsulation in programming\
    \ languages as Java or C++, but by using closures, we can achieve similar encapsulation.\n\
    \n```\nfunction privateTest() {\n  var points=0;\n  this.getPoints=function()\
    \ {\n    return points;\n  };\n  this.score=function() {\n    points++;\n  };\n\
    }\n```\n\n```\nvar private = new privateTest();\nprivate.score();\nconsole.log(private.points);\
    \ // undefined\nconsole.log(private.getPoints());\n```\n\n[ 69 ]"
  merge: -1
