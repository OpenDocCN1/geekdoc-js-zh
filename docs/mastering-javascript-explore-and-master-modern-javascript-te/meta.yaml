  md: "# JavaScript Patterns\n\nLet's take a common example to understand the usage\
    \ of a factory. Let's say that we have the following:\n\n+   * A constructor,\
    \ CarFactory()\n* A static method in CarFactory called make() that knows how to\
    \ create objects of the car type\n* Specific types such as CarFactory.SUV, CarFactory.Sedan,\
    \ and so on\n\nWe use golf = CarFactory as follows:\n\n```\nvar golf = CarFactory.make('Compact');\n\
    var vento = CarFactory.make('Sedan');\nvar touareg = CarFactory.make('SUV');\n\
    ```\n\nHere is how you implement such a factory. The following implementation\
    \ is fairly standard. We are programmatically constructing the constructor function\
    \ that creates an object of the specified type-CarFactory[const].prototype = new\
    \ CarFactory();\n\nWe are mapping object types to the constructors. There can\
    \ be variations in how you can go about implementing this pattern:\n\n```\n//\
    \ Factory Constructor\nfunction CarFactory() {\nCarFactory.prototype.info = function\
    \ () {\nconsole.log(\"This car has \"+this.doors+\" doors and a \"+this.engine_capacity+\"\
    \ liter engine\");\n};\n// the static factory method\nCarFactory.make = function\
    \ (type) {\n    var constr = type;\n    var car;\nCarFactory[constr].prototype\
    \ = new CarFactory();\n    // create a new instance\n    car = new CarFactory[constr]();\n\
    \    return car;\n}\nCarFactory.Compact = function () {\n    this.doors = 4;\n\
    \    this.engine_capacity = 2;\n};\n```"
