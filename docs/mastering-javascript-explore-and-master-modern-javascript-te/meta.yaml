  md: '# # 8

    DOM Manipulation and Events


    The most important reason for JavaScript''s existence is the web. JavaScript is
    the language for the web and the browser is the raison d''être for JavaScript.
    JavaScript gives deep dynamism to otherwise static web pages. In this chapter,
    we will dive deep into this relationship between the browser and Language. We
    will understand the way in which JavaScript interacts with the components of the
    web page. We will look at the Document Object Model (DOM) and JavaScript event
    model.


    # DOM


    In this chapter, we will look at various aspects of JavaScript with regard to
    the browser and HTML. As I am sure you are, the markup language used to define
    web pages. Various forms of markup exist for different uses. The popular marks
    are Extensible Markup Language (XML) and Standard Generalized Markup Language
    (SGML). Apart from these generic markup languages, there are very specific markup
    languages for purposes such as text processing and image information. HyperText
    Markup Language (HTML) is the standard markup language that defines the presentation
    semantics of a web page. A web page is essentially a document. The DOM provides
    you with a representation of this document. The DOM also provides you with a means
    of storing and manipulating this document. The DOM is the programming interface
    of HTML and allows structural manipulation using scripting languages such as JavaScript.
    The DOM provides a structural representation of the document. The structure consists
    of nodes and objects. Nodes have properties and methods on which you can operate
    in order to manipulate the nodes themselves. The DOM is just a representation
    and not a model for DOM processing languages such as JavaScript.'
  merge: -1
  pgno: 199
