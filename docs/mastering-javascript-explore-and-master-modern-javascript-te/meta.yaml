  md: "# The observer pattern\n\nLet's first see the language-agnostic definition\
    \ of the observer pattern. The GOF book, Design Patterns: Elements of Reusable\
    \ Object-Oriented Software, defines the observer pattern as follows:\n\nOne or\
    \ more observers are interested in the state of a subject and register their interest\
    \ with the subject by attaching themselves. When something changes in our subject\
    \ the observer may be interested in, a notify message is sent which calls the\
    \ update method in each observer. When the observer is no longer interested in\
    \ the subject's state, they can simply detach themselves.\n\nIn the observer design\
    \ pattern, the subject keeps a list of objects depending on it changes. The subject\
    \ uses a broadcast to notify them of the state changes. Observers can remove themselves\
    \ from the list when they no longer wish to be notified. Based on this understanding,\
    \ we can define the participants in this pattern:\n\n+   - Subject: The subject\
    \ keeps the list of observers and has methods to add, remove, and update observers\n\
    - Observer: This provides an interface for objects that need to be notified when\
    \ the subject's state changes\n\nLet's create a subject that can add, remove,\
    \ and notify observers:\n\n```\nvar Subject = ( function() ) {\n  this.observer_list\
    \ = [];\n}\n\n// method will handle adding observers to the internal list\nSubject.prototype.add_observer\
    \ = function ( obj ) {\n  console.log('Added observer');\n  this.observer_list.push(obj);\n\
    };\n\nSubject.prototype.remove_observer = function ( obj ) {\n  for(var i = 0;\
    \ i < this.observer_list.length; i++) {\n    if(this.observer_list[ i ] === obj)\
    \ {\n      this.observer_list.splice(i, 1);\n      console.log('Removed Observer');\n\
