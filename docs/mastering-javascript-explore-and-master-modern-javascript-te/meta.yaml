    \ Similarly, we will not discuss patterns that do not fit into JavaScript or are\
    \ not in popular use.\n\n# # The namespace pattern\n\nExcessive use of the global\
    \ scope is a taboo in JavaScript. When you build larger programs, it is sometimes\
    \ difficult to control how much the global scope is polluted. Namespace can reduce\
    \ the number of globals created by the program and also helps in avoiding collisions\
    \ or excessive name prefixing. The idea of using namespaces is creating a global\
    \ object for your application or library and adding all these objects and functions\
    \ to that rather than polluting the global scope with objects. JavaScript doesn't\
    \ have an explicit syntax for namespaces, but they can be created. Let's consider\
    \ the following example:\n\n```\nfunction Car() {}\nfunction BMW() {\n  var engines\
    \ = 1;\n  var features = {\n    seats: 6,\n    airbags:6\n  }\n```"
