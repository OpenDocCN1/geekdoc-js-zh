  md: '# Object-Oriented JavaScript


    JavaScript''s most fundamental data type is the Object data type. JavaScript objects
    can be seen as mutable key-value-based collections. In JavaScript, arrays, functions,
    and RegExp are objects while numbers, strings, and Booleans are object-like constructs
    that are immutable but have methods. In this chapter, you will learn the following
    topics:


    +   * Understanding objects

    * Instance properties versus prototype properties

    * Inheritance

    * Getters and setters


    # Understanding objects


    Before we start looking at how JavaScript treats objects, we should spend some
    time on an object-oriented paradigm. Like most programming paradigms, object-oriented
    programming (OOP) also emerged from the need to manage complexity. The main idea
    is to divide the entire system into smaller pieces that are isolated from each
    other. If these small pieces hide as many implementation details as possible,
    they become easy to use. A classic car analogy will help you understand this very
    important point about OOP.'
  merge: -1
  pgno: 117
- img_proc: false
  md: '# Object-Oriented JavaScript


    When you drive a car, you operate on the interface - the steering, clutch, brake,
    and accelerator. Your view of seeing the car is limited by this interface, which
    makes it possible for you to drive the car. This interface is essentially hiding
    all the systems that drive the car, such as the internal functioning of its engine,
    its electronic system, and so on. A similar idea is the primary driver of OOP.
    An object hides the complexities of how to implement a particular functionality
    and exposes a limited interface to the outside world. All other systems can use
    this interface without worrying about the internal complexity that is hidden from
    view. Additionally, an object hides its internal state from other objects and
    prevents its direct modification. This is an important aspect of OOP.


    In a large system where a lot of objects call other objects'' interfaces, things
    can go bad if you allow them to modify the internal state of such objects. OOP
    operates on the idea that the state of an object is inherently hidden from the
    outside world and it can be changed only via interface operations.


    OOP was an important idea and a definitive step forward from the traditional structured
    programming. However, many feel that OOP is overdone. Most OOP systems define
    complex and unnecessary class and type hierarchies. Another drawback was in the
    pursuit of hiding the state, OOP considered the object state almost immaterial.
    Though hugely powerful, OOP was clearly flawed in many areas. Still, OOP did some
    very good ideas, especially hiding the complexity and exposing the interface to
    the outside world. JavaScript picked up a few good ideas and built its object
    model around them. Luckily, this makes JavaScript objects very versatile. In their
    seminal work, Design Patterns: Elements of Reusable Object-Oriented Software,
    the Gang of Four gave two fundamental principles of a better object-oriented design:


    +   * Program to an interface and not to an implementation

    * Composition over class inheritance


    These two ideas are really against how OOP operates. The classical style of inheritance
    operates on inheritance that exposes parents classes to all classes. Classical
    inheritance tightly couples children to parents. There are mechanisms in classical
    inheritance to solve this problem to a certain extent. If you are using classical
    inheritance in a language such as Java, it is generally advisable to program to
    an interface, not an implementation. In Java, you can write a decoupled code using
    interfaces:


    ```

    //programming to an interface ''List'' and not implementation

    ''ArrayList''

    List theList = new ArrayList();

    ```


    --- 100 ---'
