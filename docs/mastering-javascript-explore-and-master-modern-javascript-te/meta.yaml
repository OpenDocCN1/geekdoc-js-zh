  md: '# Inheritance


    Inheritance is an important concept of OOP. It is common to have a bunch of objects
    implementing the same methods. It is also common to have an almost similar object
    definition with differences in a few methods. Inheritance is very useful in promoting
    code reuse. We can look at the following classic example of inheritance relation:


    ![](bbox=[0.194, 0.269, 0.805, 0.513])


    Here, you can see that from the generic Animal class, we derive more specific
    classes such as Mammal and Bird based on specific characteristics. Both the Mammal
    and Bird classes have the same template of an Animal; however, they also define
    behaviors and attributes specific to them. Eventually, we derive a very specific
    mammal, Dog. A Dog has common attributes and behaviors from an Animal class and
    Mammal class, it adds specific attributes and behaviors of a Dog. This can go
    on to add complex inheritance relationships.


    Traditionally, inheritance is used to establish or describe an IS-A relationship.
    For example, a Dog IS-A mammal. This is what we know as classical inheritance.
    You would have such relationships in object-oriented languages as C++ and Java.
    JavaScript has a completely different mechanism to handle inheritance. Prototypal
    inheritance is very different in nature and needs through understanding. Classical
    and prototypal inheritance are very different in nature and need careful study.'
  merge: -1
  pgno: 128
- img_proc: false
  md: "In classical inheritance, instances inherit from a class blueprint and create\
    \ subclass relationships. You can't invoke instance methods on a class definition\
    \ yourself. You need to create an instance and then invoke methods on this instance.\
    \ In prototypal inheritance, on the other hand, instances inherit from other instances.\n\
    \nAs far as inheritance is concerned, JavaScript uses only objects. As we discussed\
    \ earlier, each object has a link to another object its prototype. This prototype\
    \ object, in turn, has a prototype of its own, and so on until an object is reached\
    \ with null as its prototype; null, by definition, has no prototype, and acts\
    \ as the final link in this prototype chain.\n\nTo understand prototype chains,\
    \ let's consider the following example:\n\n```\nfunction Person() {}\nPerson.prototype.cry\
    \ = function() {\n  console.log(\"Crying\");\n}\n\nfunction Child() {\nChild.prototype.cry\
    \ = Person.prototype.cry;\nvar child = new Child();\nconsole.log(instanceof Child);\
    \ //true\nconsole.log(instanceof Person); //false\nconsole.log(instanceof Object);\
    \ //true\n```\n\nHere, we define a Person and Child -a child IS-A person. We also\
    \ copy the cry property of Person to the cry property of Child. When we try to\
    \ see this relationship using instanceof, we soon realize that by copying a behavior,\
    \ we could not really make Child an instance of Person; Child instanceof Person\
    \ fails. This is just copying or masquerading, not inheritance. Even if we copy\
    \ all the properties of Person to Child, we won't be inheriting from Person. This\
    \ is usually a bad idea and is shown here for illustrative purposes. We want to\
    \ derive a prototype chain —an IS-A relationship, a real inheritance where we\
    \ can say that Child IS-A person. We want to create a child IS-A person IS-A mammal\
    \ IS-A animal. In JavaScript, this is done using an instance of an object as follows:\n\
    \n```\nSubClass.prototype = new SuperClass();\nChild.prototype = new Person();\n\
    ```\n\nLet's modify the earlier example:\n\n```\nfunction Person() {\nPerson.prototype.cry\
    \ = function() {\n  console.log(\"Crying\");\n}\n```"
