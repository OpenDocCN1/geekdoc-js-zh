- img_proc: false
  md: "The advantage of a CDN download is that Google's CDN automatically finds the\
    \ nearest download server for you and keeps an updated stable copy of the jQuery\
    \ library. If you wish to download and manually host jQuery along with your website,\
    \ you can add the script as follows:\n\n```\n<script src=\"./lib/jquery.js\"></script>\n\
    ```\n\nIn this example, the jQuery library is manually downloaded in the lib directory.\
    \ With the jQuery setup in the HTML page, let's explore the methods of manipulating\
    \ the DOM elements. Consider the following example:\n\n```\n<html>\n<head>\n \
    \ <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js\"\
    ></script>\n  $(document).ready(function() {\n    $('#greeting').html('Hello World\
    \ Martian');\n  });\n</head>\n<body>\n  <p id=\"greeting\">Hello World Earthling\
    \ ! </p>\n</body>\n</html>\n```\n\nAfter adding jQuery to the HTML page, we write\
    \ the custom JavaScript that selects the element with a greeting ID and changes\
    \ its value. The strange-looking code within $ () is the jQuery in action. If\
    \ you read the jQuery source code (and you should, it's brilliant) you will see\
    \ the final line:\n\n```\n// Export jQuery to the global object\nwindow.jQuery\
    \ = $ = jQuery;\n```\n\nThe $ is just a function. It is an alias for the function\
    \ called jQuery. The $ is syntactic sugar that makes the code concise. In fact,\
    \ you can use both $ and jQuery interchangeably. For example, both $('#greeting').html('Hello\
    \ World Martian'); and jQuery('#greeting').html('Hello World Martian'); are the\
    \ same."
