    # 11. 理解 NaN\n\n问题：解释 JavaScript 中 `NaN` 的概念和用法。\n\n解决方案：在 JavaScript 中，`NaN`\
    \ 代表“非数字”（Not-a-Number）。它是一个特殊值，用于表示无效或未定义的数学运算结果。\n\n在第一个示例中，尝试将 0 除以 0 会导致未定义的数学运算，产生\
    \ `NaN`。类似地，尝试对包含字符串（\"hello\"）进行数学运算也会产生 `NaN`。\n\n`NaN` 的独特行为：`NaN` 的特殊之处在于它不等于任何值，包括它自身。\n\
    \n```\nlet result = 0 / 0;\nconsole.log(result); // NaN\n\nlet stringResult =\
