    Solution: You can simulate private variables in JavaScript using closures. By
    defining variables within a function scope and returning an object with methods
    that operate on those variables, you can achieve a level of encapsulation.


    ```

    function createCounter() {

    let count = 0; // Private variable

    return {

    increment: function () {

