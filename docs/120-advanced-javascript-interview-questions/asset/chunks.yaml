    # 17. Power of 2 Checker


    Problem: Write a function in JavaScript that takes an integer as input and determines
    whether it is a power of 2. If the input number is a power of 2, return the number;
    otherwise, return -1.


    Solution: You can determine if a number is a power of 2 by checking if it is greater
    than 0 and has only a single bit set in its binary representation. You can use
    bitwise operations to achieve this. Here''s how you can implement the solution:


    ```

    function isPowerOf2(num) {

    if (num < 0) {

    return -1;

    }

    return (num & (num - 1)) === 0 ? num : -1;

    }

    console.log(isPowerOf2(8)); // 8

    console.log(isPowerOf2(16)); // 16

    console.log(isPowerOf2(6)); // -1

    ```


