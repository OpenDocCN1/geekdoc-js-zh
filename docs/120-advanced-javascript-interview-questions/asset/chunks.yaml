    # 09\. Callback Functions


    Problem: Elaborate on callback functions in JavaScript.


    Solution: In JavaScript, a callback function is a function that is passed as an
    argument to another function and is executed after the parent function completes
    its task. Callbacks play a key role in asynchronous programming, enabling the
    execution of code after asynchronous operations finish.


    Example of a Callback Function:


    function getData(callback) {


    let data = "data"; callback(data);


    }


    function recieveData(data) {


    console.log(data);


    }


    getData(recieveData); // ''data''


    In the above code, getData accepts a parameter named callback, which is a function.
    After retrieving data, getData invokes the callback function, passing the data
    as an argument. The receiveData function is a callback, passed as an argument
    to getData, and it logs the data.


    Common Usage: Callback functions are prevalent in JavaScript, employed in various
    APIs and libraries to manage asynchronous behavior. For instance, you can use
    a callback function with the fetch API for handling asynchronous HTTP requests:


    Here, the fetch function returns a promise. The then method takes callback functions
    to handle successful responses and errors.


    fetch(”https://api.example.com/data”)


    .then(response => response.json())


    .then(data => {


    console.log(data);


    })


    .catch(error => { console.error(error);


    })


    # 10. NEGATIVE_INFINITY


    Problem: Explain the concept of NEGATIVE_INFINITY in JavaScript.


    Solution: In JavaScript, NEGATIVE_INFINITY is a special constant representing
    the smallest possible numeric value. It is used to denote values that are infinitely
    small and represent a limit beyond which numeric values cannot be decreased.


    Example Usage: One common scenario where NEGATIVE_INFINITY arises is when a negative
    number is divided by zero:


    let result = -5 / 0;


    console.log(result); // -Infinity


    In this case, dividing a negative number by zero yields a value of negative infinity,
    as indicated by -Infinity.


    Note: Dividing a positive number by zero produces positive infinity (Infinity),
    and dividing zero by zero results in a special value called NaN (Not-a-Number).
    Common Applications:


    The concept of NEGATIVE_INFINITY is particularly relevant when dealing with mathematical
    or computational operations where values approach the theoretical limits of a
    numeric system.


    11\. Understanding NaN


    Problem: Explain the concept and usage of NaN in JavaScript.


    Solution: In JavaScript, NaN stands for "Not-a-Number." It''s a special value
    used to indicate the result of invalid or undefined mathematical operations.


    In the first example, attempting to divide 0 by 0 results in an undefined mathematical
    operation, yielding NaN. Similarly, attempting to perform a mathematical operation
    involving a string ("hello") also results in NaN.


    NaN''s Unique Behavior: NaN is distinct in that it''s not equal to any value,
    including itself.


    let result = 0 / 0;


    console.log(result); // NaN


    let stringResult = "hello" / 2;


    console.log(stringResult); // NaN


    Checking for NaN: To determine if a value is NaN, you can use the isNaN() function:


    let value = NaN;


    console.log(isNaN(value)); // true


    let anotherValue = "hello";


    console.log(isNaN(anotherValue)); // true


    Importance and Usage: Understanding NaN is essential for handling mathematical
    operations in JavaScript. Checking for NaN prevents unintended calculations resulting
    from invalid inputs and enhances the reliability of your code.


    # 12\. if-else Statements


    Problem: Elaborate on the usage of if-else statements in JavaScript.


    Solution: if-else statements provide a way to make decisions based on whether
    a specified condition is true or false. They allow executing different code blocks
    depending on the outcome of the condition.


    Example


    let num = 5;


    if (num > 10) {


    console.log("The number is greather than 10.");


    } else {


    console.log("The number is less than or equal to 10.");


    }


    // ''The number is less than or equal to 10.''


    In this scenario, the if statement checks whether num is greater than 10\. If
    true, the code within the first block executes; otherwise, the code within the
    else block executes.


    To handle multiple conditions, else if blocks are used:


    let num = 15;


    if (num < 5) {


    console.log("The number is less than 5.");


    } else if (num < 10) {


    console.log("The number is between 5 and 10.");


    } else {


    console.log("The number is greater than or equal to 10.");


    }


    // The number is greater than or equal to 10.


    Here, the first if block checks if num is less than 5\. If false, the else if
    block checks if it''s less than 10\. If both conditions are false, the else block''s
    code runs.


    # 13\. Try-Catch Statements


    Problem: Explain the purpose and use of try-catch statements in JavaScript.


    Solution: In JavaScript, try-catch statements offer a way to manage and handle
    errors that might occur during the execution of code. They enable developers to
    "try" a section of code and "catch" any errors that arise, preventing these errors
    from crashing the program.


    Example of Try-Catch Statement:


    try {


    let x = y;


    } catch (error) {


    console.error(error);


    }


    // ReferenceError: y is not defined


    In this scenario, the try block contains code that may lead to an error. If an
    error occurs, the catch block captures the error and executes the code within.
    In this example, a ReferenceError is thrown because y is not defined. The error
    object passed to the catch block contains information about the error, aiding
    in diagnosis.


    Use and Importance: The try-catch statement is valuable for controlled error handling.
    Instead of letting an error crash the entire program, developers can catch errors,
    gather information about them, and even provide meaningful error messages to users.
    This promotes a more user-friendly and stable application.


    # 14\. Type Conversion Functions


    Problem: Explain the purpose and usage of parseInt(), parseFloat(), Number(),
    and String() functions in JavaScript.


    Solution: In JavaScript, type conversion functions serve to convert values between
    different data types. These functions are essential for ensuring that data is
    appropriately transformed for various operations.


    Examples of Type Conversion Functions:


    parseInt(): This function parses a string argument and returns an integer of the
    specified radix (base).


    console.log(parseInt("123", 10)); // 123


    parseFloat(): Used for parsing a string argument and returning a floating-point
    number.


    console.log(parseFloat("3.14")); // 3.14


    parseInt(): This function parses a string argument and returns an integer of the
    specified radix (base).


    console.log(parseInt("123", 10)); // 123


    parseFloat(): Used for parsing a string argument and returning a floating-point
    number.


    console.log(parseFloat("3.14")); // 3.14


    Importance and Usage: Type conversion functions are crucial for explicitly managing
    data types and ensuring the desired outcomes. They prevent unintended type coercion,
    which can lead to unexpected results. By using these functions, developers gain
    control over type conversions, fostering code reliability and consistency.


    # 15\. Changing Style/Class of an Element in JavaScript


    Problem: Explain how to change the style or class of an element using JavaScript.


    Solution: To change the style or class of an element in JavaScript, you can use
    the style property to modify individual CSS properties or the className property
    to change the class of the element.


    Changing Style: You can use the style property to directly modify CSS properties
    of an element:


    const myText = document.getElementById("myText"); myText.style.fontSize = "20px";


    In this example, the font size of an element with the ID "myText" is changed to
    20 pixels.


