    \n# 40. `null` 和 `undefined` 的区别\n\n问题：解释 JavaScript 中 `null` 和 `undefined` 用法的区别，并提供每种情况适用的示例场景。\n\
    \n解决方案：在 JavaScript 中，`null` 和 `undefined` 都用于表示缺少值，但它们的使用场景略有不同。\n\n`null`：用于显式表示有意缺少任何对象值。例如，可以将其赋值给一个变量，以明确表示该变量没有值。\n\
    \n```\nlet myVar = null;\n// 显式赋值为 null\n```\n\n`undefined`：表示一个变量已被声明但尚未赋值。此外，它也是未提供参数的函数参数的默认值。\n\
    \n```\nlet myVar; // 已声明但未赋值（undefined）\n\nfunction myFunction(param) {\n  console.log(param);\n\
    \  // undefined（如果未提供参数）\n}\n```\n\n`null` 用于显式表示没有值，而 `undefined` 表示缺少赋值的值。\n\
    \n# 41. 闭包\n\n问题：解释 JavaScript 中闭包的概念，并提供一个实际示例说明其用法。\n\n解决方案：在 JavaScript 中，闭包是一个强大的概念，它允许函数记住并访问其词法作用域，即使在该作用域之外执行也是如此。闭包“封闭”了其包含函数中的变量，即使在该函数执行完毕后，仍保留对这些变量的访问权限。\n\
    \n```\nfunction outerFunction() {\n  const outerVariable = \"I am from outerFunction\"\
    ;\n\n  function innerFunction() {\n    console.log(outerVariable);\n    // 内部函数可以访问\
    \ outerVariable\n  }\n\n  return innerFunction;\n}\n\nconst clousureFunction =\
    \ outerFunction();\nclousureFunction(); // I am from outerFunction\n```\n\n在示例中，`innerFunction`\
    \ 是一个闭包，因为即使在 `outerFunction` 执行完毕后，它仍然保留对 `outerVariable` 的访问权限。当调用 `closureFunction`\
    \ 时，它仍然可以访问 `outerVariable` 并输出其值。\n\n闭包常用于 JavaScript 应用程序中的封装、数据隐私和状态维护。\n\n\
    # 42. JavaScript 中的防抖及其实际应用\n\n问题：解释 JavaScript 中防抖的概念，并提供一个应用防抖能带来好处的场景。\n\n\
    解决方案：防抖是一种用于控制基于重复事件执行函数频率的技术。它确保函数仅在自上次事件发生后经过一定时间后才执行。这在处理可能快速触发的事件（例如调整浏览器窗口大小或在输入字段中打字）时特别有用。\n\
    \n示例：想象一个搜索栏，当用户输入时会发送 API 请求。如果没有防抖，每次按键都可能触发 API 请求，可能会使服务器不堪重负。通过应用防抖，我们可以延迟\
    \ API 请求的执行，直到用户暂停输入，从而减少发送的请求数量。\n\n```\nfunction debounce(func, delay) {\n \
    \ let timer;\n  return function (...args) {\n    clearTimeout(timer);\n    timer\
    \ = setTimeout(() => {\n      func(...args);\n    }, delay);\n  };\n}\n\n// 将防抖应用于事件监听器\n\
    const searchInput = document.getElementById(\"search-input\");\nconst debouncedSearch\
    \ = debounce(doSearch, 300);\nsearchInput.addEventListener(\"input\", debouncedSearch);\n\
    \nfunction doSearch() {\n  // 在此处执行实际搜索或 API 请求\n  console.log('Searching...');\n\
    }\n```\n\n在此示例中，`doSearch` 函数通过 `debounce` 函数进行了防抖处理。`debounce` 返回的 `debouncedSearch`\
    \ 函数只会在自上次输入事件后经过 300 毫秒延迟后才执行 `doSearch` 函数。这可以防止用户在输入时发出过多的 API 请求。\n\n# 43.\
    \ JavaScript 中的提升及其对声明的影响\n\n问题：解释 JavaScript 中提升的概念，并讨论它对作用域内变量和函数声明顺序的影响。\n\n\
    解决方案：提升是 JavaScript 中的一种行为，在编译阶段，变量和函数声明会被移动到其各自作用域的顶部。这可能导致你可以在代码中正式声明变量和函数之前就使用它们或调用它们。\n\
    \n示例：\n\n```\nconsole.log(myVariable); // undefined\nvar myVariable = 10;\n\n\
    myFunction(); // Hello, World!\nfunction myFunction() {\n  console.log(\"Hello,\
    \ World!\");\n}\n```\n\n在示例中，变量声明 `var myVariable` 和函数声明 `function myFunction()`\
    \ 被提升到其作用域的顶部，使我们能够在它们实际声明之前使用它们。\n\n然而，只有声明被提升，初始化和赋值不会被提升。因此，虽然 `myVariable`\
    \ 是可访问的，但其值为 `undefined`，直到它被赋值为 `10`。\n\n理解提升对于编写清晰且可维护的代码至关重要，建议将变量和函数声明放在其各自作用域的开头，以提高清晰度。\n\
    \n# 44. 标签\n\n问题：什么是 JS 标签？\n\n"
- fmt: "\nSolution: The label statement allows us to name loops and blocks in JavaScript.\
    \ We can then use these labels to refer back to the code later. For example, the\
    \ below code with labels avoids printing the numbers when they are same,\n\nExample:\n\
    \n```\nvar i, j;\n\nloop1: for (i = 0; i < 3; i++) {\n  loop2: for (j = 0; j <\
    \ 3; j++) {\n    if (i === j) {\n      continue loop1;\n    }\n    console.log(\"\
    i = \" + i + \", j = \" + j);\n  }\n}\n\n// Output is:\n// \"i = 1, j = 0\"\n\
    // “i = 2, j = 0\"\n// \"i = 2, j = 1\"\n```\n\n# 45. Swapping Variables\n\nProblem:\
    \ Explain various techniques to swap the values of two variables in JavaScript\
    \ and discuss the pros and cons of each approach.\n\nSolution: Swapping variables\
    \ can be achieved using a temporary variable, arithmetic operations, or destructuring\
    \ assignment.\n\nExample 1: Using a Temporary Variable\n\n```\nlet a = 5;\nlet\
    \ b = 10;\nlet temp;\ntemp = a; // 5\na = b; // 10\nb = temp; // 5\n```\n\nExample\
    \ 2: Using Arithmetic Destructuring Operations\n\n```\nlet a = 5;\nlet b = 10;\n\
    a = a + b; // 15\nb = a - b; // 5\na = a - b; // 10\n```\n\nExample 3: Using Destructuring\
    \ Assignment\n\n```\nlet a = 5;\nlet b = 10;\n[a, b] = [b, a];\n```\n\n# 46. Using\
    \ Event Delegation\n\nProblem: Explain the concept of event delegation in JavaScript\
    \ and discuss its advantages in managing events within web development.\n\nSolution:\
    \ Event delegation involves attaching a single event listener to a common ancestor\
    \ element instead of multiple listeners on individual child elements. This approach\
    \ offers benefits in terms of performance and dynamically added elements.\n\n\
    Example: Consider a list of items where each item has a button. Instead of adding\
    \ an event listener to each button, you can add a single listener to the list\
    \ element and use event delegation to handle button clicks.\n\n```\ndocument.querySelector(\"\
    #list\").addEventListener(\"click\", function (event) {\n  if (event.target.tagName\
    \ === \"BUTTON\") {\n    // Handle button click\n  }\n});\n```\n\nEvent delegation\
    \ improves efficiency by reducing the number of event listeners, especially when\
    \ dealing with large or dynamically updated content.\n\n# 47. Using the `bind()`\
    \ Function\n\nProblem: Explain the concept and use cases of the `bind()` function\
    \ in JavaScript. Provide examples illustrating how `bind()` can be used to preserve\
    \ context and create new functions with preset arguments.\n\nSolution: The `bind()`\
    \ function in JavaScript is used to create a new function with a fixed context\
    \ (`this` value) and preset arguments. It's commonly used to maintain the original\
    \ context when passing methods as callbacks, to create new functions with partially\
    \ applied arguments, and to create specialized functions.\n\nExample: Preserving\
    \ Context\n\n```\nconst user = {\n  name: \"John\",\n  greet: function () {\n\
    \    console.log(`Hello, ${this.name}!`);\n  },\n};\n\nconst greetFunction = user.greet;\n\
    greetFunction(); // Hello, undefined!\n\nconst boundGreet = user.greet.bind(user);\n\
    boundGreet(); // Hello, John!\n```\n\nExample: Creating a New Function\n\n```\n\
    const sayHello = function(name) { console.log(`Hello, ${name}!`);\n};\n\nconst\
    \ sayHi = sayHello.bind(null, \"Alice\");\nsayHi(); // Hello, Alice!\n```\n\n\
    Example: Partial Function Application\n\n```\nfunction add(a, b) { return a +\
    \ b;\n}\n\nconst addFive = add.bind(null,\n5);\nconsole.log(addFive(3)); // 8\n\
    ```\n\n# 48. Generating Fibonacci Sequence with ES6 Generators\n\nProblem: Create\
    \ a generator function in JavaScript that generates the Fibonacci sequence. Implement\
    \ the generator to yield the Fibonacci numbers one by one. Print the first 10\
    \ Fibonacci numbers using the generator.\n\nSolution: You can use an ES6 generator\
    \ function to generate the Fibonacci sequence. The generator function maintains\
    \ the state of the previous two numbers and yields the current Fibonacci number.\n\
    \nHere's how you can implement and use the generator:\n\n```\nfunction* fibonacciGenerator()\
    \ {\n  let prev = 0;\n  1;\n  let current = 1;\n  1;\n  while (true) {\n    2;\n\
    \    yield current;\n    3;\n    const next = prev + current;\n    5;\n    prev\
    \ = current;\n    8;\n    current = next;\n    13;\n  }\n  21;\n}\n34;\n55;\n\n\
    const fibonacci = fibonacciGenerator();\nfor (let i = 0; i < 10; i++) {\n  console.log(fibonacci.next().value);\n\
    }\n```\n\n# 49. Recursive Binary Search\n\nProblem: Implement a recursive function\
    \ in JavaScript to perform a binary search on a sorted array.\n\nSolution: Binary\
    \ search is a divide-and-conquer algorithm that compares the target element with\
    \ the middle element of the array. Here's how you can implement the recursive\
    \ binary search function with a higher level of difficulty:\n\n```\nfunction binarySearchRecursive(arr,\
    \ target, left = 0, right = arr.length - 1) {\n  if (left <= right) {\n    const\
    \ middle = Math.floor((left + right) / 2);\n    if (arr[middle] === target) {\n\
    \      return middle; // Element found\n    } else if (arr[middle] > target) {\n\
    \      return binarySearchRecursive(arr, target, left, middle - 1); // Search\
    \ left half\n    } else {\n      return binarySearchRecursive(arr, target, middle\
    \ + 1, right); // Search right half\n    }\n  }\n  return -1; // Element not found\n\
    }\n\nconst sortedArray = [1, 3, 5, 7, 9, 11, 13, 15];\nconsole.log(binarySearchRecursive(sortedArray,\
    \ 7)); // Output: 3 (index of 7 in the array)\nconsole.log(binarySearchRecursive(sortedArray,\
    \ 8)); // Output: -1 (element not found)console.log(binarySearchRecursive(sortedArray,\
    \ 8)); // Output: -1 (element not found)\n```\n\n# 50. Calculating n-th Fibonacci\
    \ Number using Tail Recursion\n\nProblem: Write a tail-recursive function in JavaScript\
    \ to calculate the n-th Fibonacci number. The Fibonacci sequence is a series of\
    \ numbers where each number is the sum of the two preceding ones: 0, 1, 1, 2,\
    \ 3, 5, 8, ...\n\nSolution: Tail recursion is a technique where the recursive\
    \ function's final operation is the recursive call itself. Here's how you can\
    \ implement a tail-recursive function with a higher level of difficulty to calculate\
    \ the n-th Fibonacci number:\n\n```\nfunction fibonacciTailRecursive(n, a = 0,\
    \ b = 1) {\n  if (n === 0) {\n    return a;\n  } else if (n === 1) {\n    return\
    \ b;\n  }\n  return fibonacciTailRecursive(n - 1, b, a + b);\n}\n\nconsole.log(fibonacciTailRecursive(0));\
    \ // 0 console.log(fibonacciTailRecursive(1)); // 1 console.log(fibonacciTailRecursive(5));\
    \ // 5 console.log(fibonacciTailRecursive(10)); // 55\n```\n\nIn this implementation,\
    \ `a` and `b` are used to keep track of the previous two Fibonacci numbers. The\
    \ function calculates the next Fibonacci number using these values and tail-recursively\
    \ calls itself with updated values.\n\n# 51. Using the `reduce` Method\n\nProblem:\
    \ Explain the concept of the `reduce` method in JavaScript, its parameters, and\
    \ how it can be used to perform operations on arrays. Provide an example of finding\
    \ the sum of an array using the `reduce` method.\n\nSolution: The `reduce` method\
    \ is a higher-order function that is used to iteratively process elements of an\
    \ array and accumulate a single value. It takes two main arguments: a callback\
    \ function and an initial value (optional).\n\nThe callback function used in the\
    \ `reduce` method takes two parameters:\n\n*   accumulator (`acc`): The accumulated\
    \ value that is updated with each iteration.\n\n*   currentValue (`curr`): The\
    \ current value being processed in the array.\n\nHere's an example of using the\
    \ `reduce` method to find the sum of an array of numbers:\n\n```\nconst numbers\
    \ = [1, 2, 3, 4];\nconst sum = numbers.reduce((acc, curr) => acc + curr, 0); console.log(sum);\
    \ // 10\n```\n\nUsage of `reduce`: Calculating totals, averages, or any kind of\
    \ accumulation.\n\n*   Finding maximum or minimum values.\n\n*   Flattening nested\
    \ arrays.\n\n*   Grouping elements by a certain property.\n\nIn the example above,\
    \ the `reduce` method starts with an initial accumulator value of 0. The callback\
    \ function adds the current value (`curr`) to the accumulator (`acc`) in each\
    \ iteration. After all elements are processed, the final sum is returned.\n\n\
    # 52. Checking Isomorphic Strings\n\nProblem: Write a function to determine if\
    \ two given strings are isomorphic. Two strings are considered isomorphic if the\
    \ characters in one string can be replaced to get the other string, while preserving\
    \ the order of characters.\n\nSolution:\n\n```\nfunction areIsomorphic(str1, str2)\
    \ {\n  if (str1.length !== str2.length) {\n    return false;\n  }\n}\n```\n"
