    \ foo() { .. }`（函数）\n\n# 38. 理解 IIFE\n\n问题：解释 JavaScript 中 IIFE（立即调用函数表达式）的概念。提供一个如何创建和使用\
    \ IIFE 的示例，并讨论为什么它们在 JavaScript 中很常用。\n\n解决方案：IIFE，即立即调用函数表达式，是一种常见的 JavaScript\
    \ 设计模式。它们是在创建后立即定义并执行的函数。IIFE 具有以下语法：\n\n```\n(function IIFE() {\n  console.log(\"\
    Hello!\");\n})(); // Hello!\n```\n\n使用 IIFE 的原因有以下几个：\n\n*   **封装**：它们为变量创建了一个新的作用域，防止变量名与代码其他部分冲突。这有助于避免污染全局作用域。\n\
    *   **数据隐私**：在 IIFE 内部声明的变量无法从外部访问，提供了一定程度的数据隐私。这对于隐藏实现细节很有用。\n*   **初始化**：IIFE\
    \ 可用于初始化代码，例如设置配置、加载模块或在其余代码执行之前执行任何必要的设置。\n*   **避免污染**：它们通过限制变量和函数的暴露，有助于防止全局作用域污染。\n\
    *   **模块模式**：IIFE 常用于在 JavaScript 中实现模块模式，允许你创建具有私有和公共成员的封装模块。\n\n# 39. 何时在 ES6\
    \ 中使用箭头函数\n\n```\nconst add = (a, b) => {\n  return a + b;\n};\n\nconsole.log(add(5,\
    \ 3)); // 8\n```\n\n问题：在 ES6 及更高版本中使用函数的经验法则：\n\n在全局作用域和 `Object.prototype` 属性中使用\
    \ `function`。\n\n对于对象构造函数使用 `class`。\n\n在其他所有地方使用 `=>`（箭头函数）。\n\n解决方案：为什么几乎在所有地方都使用箭头函数？\n\
    \n*   **作用域安全**：箭头函数确保始终使用与根相同的 `this` 对象，避免作用域问题。\n*   **简洁性**：箭头函数更易读且更简洁。\n\
