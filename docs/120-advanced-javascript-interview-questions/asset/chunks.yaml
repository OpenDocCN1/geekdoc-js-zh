    object from a constructor function. It''s an essential part of object-oriented
    programming in JavaScript and is used to create objects with specific properties
    and methods defined by the constructor.


    When you use the `new` keyword with a constructor function, the following steps
    occur:


    1.  A new empty object is created.

    2.  The constructor function is called with the `this` context set to the newly
    created object.

    3.  Properties and methods are added to the object using the `this` keyword inside
    the constructor function.

    4.  The new object is returned from the constructor function unless the function
    explicitly returns another object.

