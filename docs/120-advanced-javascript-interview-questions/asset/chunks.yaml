    \ (y) {\n      return x + y;\n    };\n  }\n}\n\nconsole.log(sum(2, 3)); // 5\n\
    console.log(sum(2)(3)); // 5\n```\n\nMethod 2: Using the `arguments` Object\n\n\
    ```\nfunction sum(x) {\n  if (arguments.length === 2){\n    return arguments[0]\
