    # 118\. Event Loop and Non-blocking I/O in JavaScript.


    Problem: JavaScript, being single-threaded, can''t afford to block its execution
    for I/O operations as it would freeze the entire program. However, it still needs
    to handle I/O operations efficiently without blocking.


    Solution: The event loop is a critical concept in JavaScript for achieving non-blocking
    I/O. It''s a mechanism that allows JavaScript to perform asynchronous operations
    by handling events and callbacks. Instead of waiting for I/O operations to complete,
    JavaScript delegates them to the system and continues executing other tasks. Once
    the I/O operation is finished, the associated callback is placed in the message
    queue. The event loop continuously checks this queue and executes callbacks when
    it''s their turn.


    Example Code:


    function simulateAsyncAPI(text, timeout) {


    setTimeout(() => {


    console.log(text);


    }, timeout);


    }


    simulateAsyncAPI(''A'', 1000);


    simulateAsyncAPI(''B'', 500);


    simulateAsyncAPI(''C'', 100);


    // Expected output:


    // C


    // B


    // A


    In this code, three asynchronous operations are simulated using setTimeout. They
    don''t block the main thread; instead, they execute independently after their
    specified timeouts.


    Explanation: The event loop allows JavaScript to efficiently manage asynchronous
    operations like network requests, file I/O, and timers without blocking the main
    thread, ensuring smooth and responsive applications.


    # 119\. What is inline caching?


    Problem: Inline caching, often referred to as "IC," is a technique used in JavaScript
    engines to optimize property access and method calls on objects. The problem is
    that without optimization, these operations can be relatively slow, especially
    when they are performed in a loop or frequently accessed. Inline caching aims
    to improve the performance of these operations.


    Solution: The core idea behind inline caching is to remember the previously accessed
    properties or methods on an object and their corresponding memory locations. When
    a property or method is accessed again, instead of looking up the object''s structure
    each time, the engine can use this cached information to access the property or
    method directly, significantly improving performance.


    Here''s a simplified example of how inline caching works for property access:


    function getProperty(obj, key) {


    // Check if the object has been cached


    if (!obj.__cache__) {


    obj.__cache__ = {};


    }


    // Check if the property is cached


    if (!(key in obj.__cache__)) {


    // If not cached, perform the property lookup


    obj.__cache__[key] = obj[key];


    }


    return obj.__cache__[key];


    }


    const person = { name: "John", age: 30 };


