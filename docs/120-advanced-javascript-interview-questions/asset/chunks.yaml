    # 111\. ES6 Map vs. WeakMap


    Problem: Explain the differences between ES6 `Map` and `WeakMap` in JavaScript,
    focusing on their behavior when objects referenced by their keys/values are deleted.


    Solution: Both ES6 `Map` and `WeakMap` are data structures for storing key-value
    pairs, but they differ in how they handle memory management, especially when objects
    referenced by their keys/values are deleted.


    Consider the following example code:


    ```

    var map = new Map();


    var weakmap = new WeakMap();


    (function () {


    var a = {


    x: 12,


    };


    var b = {


    y: 12,


    };


    map.set(a, 1);


    weakmap.set(b, 2);


    })();

    ```


    `Map`: The garbage collector doesn''t remove a pointer from the `Map` and doesn''t
    remove `{x: 12}` from memory. Manually written `Map` objects maintain references
    to key objects, preventing them from being garbage collected.


    `WeakMap`: The garbage collector removes the key `b` pointer from the `WeakMap`
    and also removes `{y: 12}` from memory. `WeakMap`s hold references to key objects
    weakly, allowing them to be garbage collected if there are no other references
    to the object.


    Summary: `Map` objects keep references to keys, preventing their garbage collection,
    while `WeakMap` objects allow keys to be garbage collected if not referenced elsewhere.


