  trans: "\nCookie 存在局限性，例如大小限制、安全问题，以及它们会随每个请求发送，即使是静态资源也不例外。\n\n# 76. REST API\n\
    \n解决方案：REST API（表述性状态转移应用程序编程接口）是现代 Web 开发中的一个基本概念。它是一种架构风格，使用一组约束和 HTTP 方法来实现客户端与资源之间的交互。\n\
    \n以下是 REST API 相关关键组件和概念的详细说明：\n\n- 资源：资源是你可以通过 API 进行交互的数据实体。例如，在博客应用中，资源可以包括文章、评论和用户。\n\
    - HTTP 方法：REST API 使用标准的 HTTP 方法对资源执行操作：\n  - GET：从服务器检索数据。\n  - POST：在服务器上创建新资源。\n\
    \  - PUT：更新现有资源，如果不存在则创建。\n  - DELETE：从服务器删除资源。\n- 无状态性：RESTful API 是无状态的，这意味着从客户端到服务器的每个请求都必须包含理解和处理该请求所需的所有信息。服务器不会在请求之间存储任何关于客户端状态的信息。\n\
    - 响应格式：API 响应通常采用 JSON 格式，便于人类和机器阅读和理解数据。\n- 身份验证：为了保护敏感资源，REST API 通常需要身份验证。常见方法包括\
    \ API 密钥、OAuth 令牌或用户名/密码。\n- 状态码：HTTP 状态码用于指示 API 请求的结果。例如，200 状态码表示成功，而 404 状态码表示请求的资源未找到。\n\
    - 端点：端点是表示资源的特定 URL。例如，`/articles` 可以是检索文章列表的端点，而 `/articles/1` 可以表示 ID 为 1 的特定文章。\n\
    - 版本控制：API 版本有助于确保 API 演进时的向后兼容性。版本号通常包含在 URL 中（例如，`/v1/articles`）。\n\n要在 JavaScript\
    \ 中与 REST API 交互，你可以使用像 `fetch`、`Axios` 或 `jQuery.ajax` 这样的库来发送 HTTP 请求并处理响应。以下是使用\
    \ `fetch` API 从 RESTful 端点检索数据的示例。\n\n```\nfetch('https://api.example.com/articles'\
    \ )\n.then(response => response.json())\n.then(data => {\n//      Handle the JSON\
    \ response data here console.log(data);\n})\n.catch(error => {\n//      Handle\
    \ any errors during the request\nconsole.error(error);\n})\n```\n\n# 77. 本地存储\n\
    \n问题：探索 JavaScript 中的本地存储\n\n解决方案：本地存储是 Web 浏览器中的一种 Web 存储机制，允许网站在用户设备上本地存储键值对。与\
    \ Cookie 不同，本地存储可以存储更大量的数据（通常可达 5-10MB），并且不会随每个 HTTP 请求发送，因此对于需要跨会话持久化的数据来说，它是一种更高效的选择。\n\
    \n本地存储有多种用例，包括：\n\n* 持久化数据：本地存储可用于存储即使在用户关闭浏览器或离开网站后也需要保留的数据。\n* 用户偏好：网站可以将用户偏好和设置存储在本地存储中，以提供个性化体验。\n\
    * 离线数据：本地存储允许网站通过本地缓存数据并在设备在线时同步，从而提供离线功能。\n* 缓存：网站可以使用本地存储来缓存静态资源（如图片和样式表），以提高页面加载速度。\n\
    \n以下是在 JavaScript 中使用本地存储的示例：\n\n```\n//       Set data in Local Storage localStorage.setItem(\"\
    username\", \"John Doe\"); localStorage.setItem(\"theme\", \"dark\");\n\n//  \
    \     Retrieve data from Local Storage\n\nconst username = localStorage.getItem(\"\
    username\");\n\nconst theme = localStorage.getItem(\"theme\");\n\nconsole.log(\"\
    Username: \" + username);\n\n//       Username: John Doe console.log(\"Theme:\
    \ \" + theme);\n\n//       Theme: dark\n\n//       Remove data from Local Storage\
    \ localStorage.removeItem(\"theme\");\n```\n\n需要注意的是，本地存储是同步的，并且在同源策略下运行。这意味着存储在本地存储中的数据只能由同一设备上的同一网站访问。此外，用户可以通过浏览器设置手动清除某个网站的本地存储。\n\
    \n# 78. 输出是什么？\n\n```\nconst createMember = ({ email, address = {} }) => { const\
    \ validEmail = /.+\\@.+\\..+/.test(email); if(!validEmail) throw new Error(\"\
    Valid email pls\");\n\nreturn {\n\nemail,\n\naddress: address ? address : null,\n\
    \n};\n\n};\n\nconst member = createMember({ email: \"my@email.com\" }); console.log(member);\n\
    ```\n\n- A: `{ email: \"my@email.com\", address: null }`\n- B: `{ email: \"my@email.com\"\
    \ }`\n- C: `{ email: \"my@email.com\", address: {} }`\n- D: `{ email: \"my@email.com\"\
    , address: undefined }`\n\n答案：C\n\n`address` 的默认值是一个空对象 `{}`。当我们设置变量 `member`\
    \ 等于 `createMember` 函数返回的对象时，我们没有为 `address` 传递值，这意味着 `address` 的值是默认的空对象 `{}`。空对象是一个真值，这意味着\
    \ `address ? address : null` 条件的结果为真。因此 `address` 的值是空对象 `{}`。\n\n# 79. 在 JavaScript\
    \ 中发起 AJAX 请求：实用指南\n\n解决方案：AJAX（异步 JavaScript 和 XML）是一种强大的技术，用于在不重新加载整个网页的情况下从服务器发送和接收数据。它是现代\
    \ Web 开发的基础部分，常用于获取数据、提交表单以及动态更新内容等任务。\n\n以下是使用两种常见方法在 JavaScript 中发起 AJAX 请求的方式：\n\
    \n1. 使用 `XMLHttpRequest` (XHR)：\n\n```\n// Create a new XMLHttpRequest object\n\
    \nvar xhr = new XMLHttpRequest();\n\n// Configure the request (GET or POST, URL,\
    \ and async flag)\n\nxhr.open(\"GET\", \"https://example.com/api/data\", true);\n\
    \n// Define a callback function to handle the response\n\nxhr.onreadystatechange\
    \ = function () {\n\nif (xhr.readyState === 4 && xhr.state === 200) {\n\nvar responseData\
    \ = xhr.responseText;\n\nconsole.log(responseData);\n\n}\n\n};\n\n// Send the\
    \ request\n\nxhr.send();\n```\n\n2. 使用 Fetch API（现代方法）：\n\n```\n// Use the fetch\
    \ function to make a GET request\n\nfetch(\"https://example.com/api/data\")\n\n\
    .then(response => { if(!response.ok) {\n\nthrow new Error(\"Network response was\
    \ not ok\");\n\n}\n\nreturn response.text();\n\n​You can also use response.json()\
    \ for JSON data\n\n})\n\n.then(data => { console.log(data); })\n\n.catch(error\
    \ => { console.error(\"Fetch error:\", error);\n```\n\n# 80. 事件\n\n问题：理解 JavaScript\
    \ 事件\n\n解决方案：在 JavaScript 中，事件是浏览器中发生的动作或事件，例如用户点击按钮、按下按键或调整窗口大小。JavaScript 中的事件处理涉及通过执行特定代码或函数来响应这些事件。在\
    \ JavaScript 中，事件是浏览器中发生的动作或事件，例如用户点击按钮、按下按键或调整窗口大小。JavaScript 中的事件处理涉及通过执行特定代码或函数来响应这些事件。\n\
    \n以下是 JavaScript 中处理事件所涉及的步骤：\n\n1. 选择元素：首先，你需要选择要附加事件的 HTML 元素。这可以通过使用 `getElementById`、`querySelector`\
    \ 等方法，或通过 JavaScript 直接访问元素来完成。\n2. 添加事件监听器：一旦你有了元素，就可以为其添加事件监听器。事件监听器是一个函数，当元素上发生特定事件时会被执行。你可以使用\
    \ `addEventListener` 方法来附加事件监听器。\n\n"
- fmt: "\n3. Defining the Event Handler: The event listener function is also known\
    \ as the event handler. It contains the code that should run when the event occurs.\
    \ This code can include any desired action, such as updating the content, changing\
    \ styles, or triggering other functions.\n\nHere's an example of attaching a click\
    \ event handler to a button element:\n\n```\n// Select the button element\nconst\
    \ button = document.getElementById(\"myButton\");\n//     Add a click event listener\
    \ button.addEventListener(\"click\", function() {\nalert(\"Button clicked!\");\n\
    });\n```\n\nIn this example, when the button is clicked, the event handler function\
    \ displays an `alert` with the message \"Button clicked!\".\n\nEvent handling\
    \ is fundamental to creating interactive and dynamic web applications. It allows\
    \ developers to respond to user actions and provide a seamless user experience.\n\
    \n# 81. While loop\n\nProblem: Explain the use of the while loop in JavaScript.\n\
    \nSolution: The while loop in JavaScript is used to execute a block of code repeatedly\
    \ as long as a given condition is true.\n\nThe basic syntax of a while loop is\
    \ as follows:\n\n```\nwhite (condition) {\n// code block to be executed\n}\n```\n\
    \nFor example, consider the following code that prints the numbers from 1 to 5:\n\
    \n```\nlet i = 1;\nwhile(i <= 5) {\nconsole.log(i);\ni++;\n}\n//       1\n// \
    \      2\n//       5\n//       3\n//       4\n//       5\n```\n\nIn this example,\
    \ the condition `i <= 5` is checked on each iteration. If it evaluates to `true`,\
    \ the code block inside the while loop is executed. The value of `i` is incremented\
    \ by 1 on each iteration using the `i++` statement. When the condition `i <= 5`\
    \ evaluates to `false`, the loop stops, and the execution continues after the\
    \ loop.\n\n# 82. How to Access History in JavaScript\n\nProblem: Accessing the\
    \ browsing history in JavaScript is crucial for controlling user navigation. What\
    \ are the available options for accessing and manipulating the browser's history\
    \ using `window.history`?\n\nSolution: To access the browsing history in JavaScript,\
    \ the `window.history` object is used, which provides methods and properties for\
    \ interacting with the browser's session history.\n\nHere are some common options:\n\
    \n*   `window.history.back()`: This method simulates clicking the browser's \"\
    Back\" button and takes the user to the previous page in the history.\n\n*   `window.history.forward()`:\
    \ This method simulates clicking the browser's \"Forward\" button and takes the\
    \ user to the next page in the history if available.\n\n*   `window.history.go(n)`:\
    \ This method allows navigating to a specific page in the history. The parameter\
    \ `n` can be a positive or negative integer, where a positive value moves forward\
    \ in the history, and a negative value moves backward.\n\n*   `window.history.length`:\
    \ This property returns the number of entries in the browsing history, representing\
    \ the number of pages the user has visited.\n\nIt's important to note that due\
    \ to security and privacy restrictions, you can't access detailed information\
    \ about a user's browsing history, such as the URLs they've visited, for security\
    \ reasons. You can only navigate within the context of the current page's history.\n\
    \n# 83. Understanding JavaScript Error Types\n\nProblem: Explain the seven built-in\
    \ error types in JavaScript and provide examples of when each type of error might\
    \ occur.\n\nSolution: JavaScript has seven built-in error types, each serving\
    \ a specific purpose:\n\n`EvalError`: Occurs with issues related to the global\
    \ function `eval()`. For example:\n\n```\ntry {\n  eval(\"alert('Hello, world!')\"\
    );\n} catch (error) {\n  if (error instanceof EvalError) {\n    console.error(error.message);\n\
    \    // \"eval() has been disabled\"\n  }\n}\n```\n\n`InternalError`: Represents\
    \ internal errors within the JavaScript engine, like a stack overflow. These errors\
    \ are rare and usually indicate a severe issue with the engine itself.\n\n`RangeError`:\
    \ Happens when a numeric variable or parameter is outside of its valid range.\
    \ For example:\n\n```\nconst arr = new Array(Infinity);\n// RangeError: Invalid\
    \ array length\n```\n\n`SyntaxError`: Arises from a syntax mistake that prevents\
    \ code parsing, such as a missing parenthesis:\n\n```\nconst x = (3;\n// SyntaxError:\
    \ Unexpected token ';'\n```\n\n`ReferenceError`: Occurs when an invalid variable\
    \ reference is made, like trying to access an undeclared variable:\n\n```\nconsole.log(x);\n\
    // ReferenceError: x is not defined\n```\n\n`TypeError`: Happens when a parameter\
    \ or variable is not of the expected type or when an operation is performed on\
    \ an inappropriate type:\n\n```\nconst num = 42;\nnum();\n// TypeError: num is\
    \ not a function\n```\n\n`URIError`: Occurs when invalid parameters are passed\
    \ to functions like `decodeURI()` or `encodeURI()`:\n\n```\ndecodeURI(\"%\");\n\
    // URIError: URI malformed\n```\n\n# 84. Understanding the Prototype Chain\n\n\
    Problem: Explain how the prototype chain works in JavaScript's Object-Oriented\
    \ Programming (OOP) and its significance in inheritance.\n\nSolution: The prototype\
    \ chain in JavaScript OOPs refers to the mechanism by which an object can delegate\
    \ property lookups to another object. This is used for inheritance, where an object\
    \ can inherit properties and methods from a parent object.\n\nWhen an object is\
    \ created from a constructor, JavaScript automatically links the newly created\
    \ object to the constructor's prototype. This linking creates the prototype chain\
    \ and allows the new object to inherit properties and methods from the prototype\n\
    \n```\n// Define a constructor function\nfunction Animal(name) {\n  this.name\
    \ = name;\n}\n// Define a prototype property for the constructor\nAnimal.prototype.makeSound\
    \ = function() {\n  return \"I'm an animal and my name is \" + this.name;\n};\n\
    // Create an object from the constructor\nvar dog = new Animal(\"dog\");\n// Access\
    \ the object's properties and methods\nconsole.log(dog.makeSound()); // \"I'm\
    \ an animal and my name is dog\"\n```\n\n.\n\n# 85. What is the purpose of the\
    \ isFinite function\n\nProblem: You are a JavaScript developer working on a project\
    \ that requires validating whether a value is a finite number or not. You've heard\
    \ about the `isFinite` function in JavaScript but are not sure of its purpose\
    \ or how to use it correctly. You want to understand its function and how to apply\
    \ it in your project.\n\nSolution: The `isFinite` function is a built-in function\
    \ in JavaScript that is used to determine if a given value is a finite number.\
    \ It returns `true` if the value is a finite number and `false` if it's not.\n\
    \n```\n//       Example 1: Finite Number var num1 = 42;\nvar result1 = isFinite(num1);\
    \ console.log(result1); // Returns true\n//       Example 2: Non-numeric Value\
    \ (NaN) var num2 = NaN;\nvar result2 = isFinite(num2); console.log(result2); //\
    \ Returns false\n//       Example 3: Positive Infinite Value var num3 = Infinity;\n\
    var result3 = isFinite(num3); console.log(result3); // Returns false\n//     \
    \  Example 4: Negative Infinite Value var num4 = -Infinity;\nvar result4 = isFinite(num4);\
    \ console.log(result4); // Returns false\n//       Example 5: String that doesn't\
    \ represnet a number var str = \"Hello\";\nvar result5 = isFinite(str); console.log(result5);\
    \ // Returns false\n```\n\nIn this example, `isFinite` is used to check the finiteness\
    \ of different values, including finite numbers, `NaN`, and infinities. The function\
    \ is useful when you need to validate if a value is suitable for mathematical\
    \ calculations or to ensure it's not a special value like `NaN` or `Infinity`.\n\
    \nEnsuring you understand how `isFinite` works will allow you to perform proper\
    \ checks in your programs to handle various numeric value types.\n\n# 86. Understanding\
    \ the Nullish Coalescing Operator\n\nProblem: You want to handle default values\
    \ in JavaScript when dealing with variables that could be `null` or `undefined`,\
    \ while avoiding falsy values like empty strings or 0.\n\nSolution: The nullish\
    \ coalescing operator (`??`) provides an elegant solution to this problem. It\
    \ returns the right-hand operand (the default value) when the left-hand operand\
    \ is `null` or `undefined`. Otherwise, it returns the left-hand operand.\n\nExample:\n\
    \n```\nconst someValue = null;\nconst defaultValue = 'Hello, world!';\nconst result\
    \ = someValue ?? defaultValue;\n```\n"
