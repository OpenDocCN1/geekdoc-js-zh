    \n问题：详细说明 JavaScript 中的回调函数。\n\n解决方案：在 JavaScript 中，回调函数是作为参数传递给另一个函数，并在父函数完成任务后执行的函数。回调在异步编程中扮演关键角色，使得代码能够在异步操作完成后执行。\n\
    \n回调函数示例：\n\n```\nfunction getData(callback) {\n  let data = \"data\";\n  callback(data);\n\
