    # 92\. Implementing the Singleton Design Pattern


    Problem: Explain the Singleton Design Pattern and provide an example of its application.


    Solution: The Singleton Design Pattern ensures that a class has only one instance
    and provides a global point of access to that instance. It''s often used for managing
    resources that should be shared across the entire application, like database connections
    or configuration settings.


    | Here''s a simple example: |  |


    class Singleton {


    constructor() {


    if (Singleton.instance) {


    return Singleton.instance;


    }


    Singleton.instance = this;


    this.data = [];


    }


    addItem(item) {


    this.data.push(item);


    }


    getItems() {


    return this.data;


    }


    }


    const instance1 = new Singleton();


    instance1.addItem("apple");


    const instance2 = new Singleton();


    instance2.addItem("banana");


    console.log(instance1.getItems()); // [ ''apple'', ''banana'' ]


    console.log(instance2.getItems()); // [ ''apple'', ''banana'' ]


