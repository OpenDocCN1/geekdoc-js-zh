    # 68\. Procedure of Document Loading


    Problem: Understanding the process of loading a document in a browser and the
    role of JavaScript during this process.


    Solution: The document loading procedure involves parsing HTML, constructing the
    DOM, loading external resources, executing scripts, and event handling. JavaScript
    scripts within <script> tags are loaded and executed. They can modify the DOM
    and interact with user interactions.


    Example Code:


    <!DOCTYPE html>


    <html>


    <head>


    <title>Document Loading Example</title>


    </head>


    <body>


    <h1>Hello, World!</h1>


    <button id="myButton">Click Me</button>


    <script>


    var button = document.getElementById(''myButton''); button.addEventListener(''click'',
    function() {


    alert(''Button Clicked!'');


    });


    });


    </script>


    </body>


    </html>


    # 69\. Explain JavaScript Browser Object Model (BOM)


    Problem: Explain JavaScript Browser Object Model (BOM)


    Solution: The Browser Object Model (BOM) in JavaScript provides a way to interact
    with the browser''s features.


    Here''s a simple example that demonstrates the usage of the BOM''s alert method
    to display a pop-up dialog:


    //       Using BOM to display an alert alert("Hello, BOM!");


    In this example, the alert method is part of the BOM and is used to show a pop-up
    alert in the browser. The BOM encompasses various objects and properties that
    allow developers to control browser-specific functionalities.


    # 70\. What is Typecasting in JavaScript?


    Problem: Explain Typecasting in JavaScript


    Solution: Typecasting in JavaScript involves converting a value from one data
    type to another. Here are the three primary typecasting functions:


    Boolean(value): This function converts the input value to a Boolean data type.


    For example:


    var num = 10;


    var boolValue = Boolean(num); // boolValue will be true


    Number(value): This function converts the input value to a floating-point number
    or an integer.


    For example:


    var str = "123";


    var numValue = Number(str); // numValue will be 123


    String(value): This function converts the input value to a string.


    For example:


    var num = 456;


    var strValue = String(num); // strValue will be "456"


    Typecasting is a useful technique to ensure that variables are treated and used
    in the desired data type context.


    # 71\. Import all the exports of a file as an object.


    Problem: Import All Exports as an Object in JavaScript


    Solution: Importing All Exports Using Object


    To import all the exports of a file as an object in JavaScript, you can use the
    import * as syntax. This allows you to access all the exported members using the
    dot (.) operator on the imported object. Here''s an example:


    Suppose you have a file named utils.js with the following exports:


    // utils.js


    export const multiply = (a, b) => a * b;


    export const divide = (a, b) => a / b;


    export const add = (a, b) => a + b;


    You can import all the exports using the following code:


    import * as utils from "./utils.js";


    console.log(utils.multiply(5, 2)); // 10


    console.log(utils.divide(10, 2)); // 5


    console.log(utils.add(3, 7)); // 10


    # 72\. Different types of Popup boxes present in JavaScript


    Problem: Types of Popup Boxes in JavaScript


    Solution: Explanation of Popup Boxes


    JavaScript provides three types of popup boxes to interact with users: alert,
    confirm, and prompt.


    alert: Displays a simple message to the user as a popup box. It contains a single
    "OK" button for acknowledgment. It''s commonly used to show information or notifications
    to users.


    alert("This is an alert message.");


    prompt: Displays an input dialog box with a message, an input field, and two buttons:
    "OK" and "Cancel." It''s used when you want the user to input some value, and
    it returns the value entered by the user as a string.


    const inputValue = prompt("Please enter your name:"); if (inputValue) {


    console.log(`Hello, ${inputValue}!`);


    } else {


    console.log("No name entered.");


    }


    confirm: Displays a confirmation popup with a message and two buttons: "OK" and
    "Cancel." It''s used when you want the user to confirm an action, and it returns
    a boolean value indicating the user''s choice.


    const result = confirm("Do you want to proceed?"); if (result) {


    //        User clicked OK } else {


    //        User clicked Cancel


    }


    # 73\. What is the way to add/delete properties to object?


    Problem: Adding and Deleting Properties in JavaScript Objects


    Solution: Dynamic Manipulation of Object Properties


    In JavaScript, you can dynamically add and delete properties to/from an object
    using various techniques.


    Adding Properties: You can add properties to an object by directly assigning a
    value to a new property name.


    let user = {};


    user.name = "Anil";


    user.age = 25;


    console.log(user); // { name: ''Anil'', age: 25 }


    Deleting Properties:


    You can remove properties from an object using the delete keyword followed by
    the object and property name.


    delete user.age;


    console.log(user); // { name: ''Anil'' }


    Keep in mind that while these methods allow you to dynamically add and remove
    properties, it''s important to consider the implications on the structure and
    functionality of your objects as you modify them.


    # 74\. In what way can you decode or encode a URL?


    Problem: URL Encoding and Decoding in JavaScript


    Solution: Using encodeURI() and decodeURI()


    In JavaScript, you can encode and decode URLs using the encodeURI() and decodeURI()
    functions. These functions help in ensuring that URLs are properly formatted for
    various operations.


    Encoding a URL: The encodeURI() function is used to encode a URL, replacing special
    characters with their encoded counterparts.


    var uri = "myprofile.php?name=sammer&occupation=pantiNG"; var encoded_uri = encodeURI(uri);
    console.log(encoded_uri);


    Decoding a URL: The decodeURI() function is used to decode an encoded URL, converting
    encoded characters back to their original form.


    var encoded_uri = "my%20profile.php?name=sammer&occupation=pantiNG"; var decoded_uri
    = decodeURI(enconded_uri); console.log(encoded_uri);


    Additionally, if you need to encode or decode individual URL components (such
    as query parameters), you can use the encodeURIComponent() and decodeURIComponent()
    functions, respectively. These functions handle encoding and decoding specific
    parts of a URL to ensure they are correctly represented in the URL.


    # 75\. Explain JavaScript Cookies.


    Problem: Understanding JavaScript Cookies


    Solution: JavaScript Cookies


    Cookies are small pieces of data that websites store on a user''s computer. They
    are used to remember information between different web pages or visits to a website.
    Cookies are stored as text files in the user''s browser and are sent back to the
    server with each subsequent request.


    Cookies have various uses, including:


    *   Session Management: Cookies can be used to manage user sessions by storing
    a unique identifier on the user''s computer.


    *   Personalization: Websites can remember user preferences and settings using
    cookies.


    *   Tracking: Cookies are used for tracking user behavior, such as the pages they
    visit and the products they view, for analytics and marketing purposes.


    *   Authentication: Cookies can store authentication tokens to keep users logged
    in across different pages.


    Here''s an example of setting and retrieving a cookie in JavaScript:


    const setCookie = (name, value, expires, path) => document.cookie = `${name}=${value};
    expires=${expires.toUTCString()}; path=${path}`;


    const getCookie = (name) => (document.cookie.match(`(^|; )${name}= ([^;]*)`) ||
    [])[2] || "";


    setCookie("username", "John Doe", new Date("Thu, 18 Dec 2023 12:00:00 UTC"), "/");


    const username = getCookie("username");


    console.log("Username:", username); // Username: John Doe'
