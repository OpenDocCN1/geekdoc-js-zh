    # 115\. In JavaScript, why is the “this” operator inconsistent?


    Problem: The behavior of the "this" operator in JavaScript can be inconsistent,
    leading to confusion and unexpected results in different scenarios.


    Solution: Understanding the various contexts in which the "this" operator behaves
    differently is essential:


    *   Raw Function Call: "this" refers to the global object or "undefined" (strict
    mode).


    *   Method Invocation: "this" refers to the calling object.


    *   Call or Apply Invocation: "this" is explicitly provided as the first argument.


    *   Event Listener Invocation: "this" is the element triggering the event.


    *   Constructor Invocation: "this" refers to a new object with prototype set to
    the constructor.


    *   Function Produced by Bind: "this" is immutable, set to the first "bind" argument.


    Managing "this" correctly in each context is crucial to avoiding inconsistencies
    and unexpected behavior.


    # 116\. What is throttling and why it is used in JavaScript?


    Problem: Implement throttling in JavaScript to limit the rate at which a function
    can be executed.


    Solution: You can use the following throttle function to achieve throttling in
    JavaScript:


    function throttle(func, delay) {


    let isThrottled = false;


    let lastArgs, lastThis;


    return function() {


    if (!isThrottled) {


    func.apply(this, arguments);


    isThrottled = true;


    lastArgs = arguments;


    lastThis = this;


    setTimeout(() => {


    isThrottled = false;


    if (lastArgs) {


    func.apply(lastThis, lastArgs);


    lastArgs = lastThis = null;


    }


    }, delay);


    }


    };


    }


    // Example usage:


    function expensiveOperation() {


    console.log("Expensive operation executed.");


    }


    const throttledOperation = throttle(expensiveOperation, 1000); // Limit to once
    per second


    // Call the throttled function


    throttledOperation(); // Executes immediately


    throttledOperation(); // Ignored (throttled)


    setTimeout(() => throttledOperation(), 500); // Ignored (throttled)


    setTimeout(() => throttledOperation(), 1500); // Executes after 1 second


    # 117\. Memoization in JavaScript.


    Problem: When working with recursive or computationally expensive functions, such
    as repetitive calculations, performance can be a critical issue. In such cases,
    optimizing the function becomes essential.


    Solution: Memoization is an advanced technique used to enhance the performance
    of a function by caching the results of previous calls and reusing them if the
    same call is made again in the future. This eliminates the need to recalculate
    the same result, which can be costly in terms of time and resources.


    Example Code:


    function memoize(func) {


    const cache = new Map();


    return function (...args) {


    const key = JSON.stringify(args);


    if (cache.has(key)) {


    return cache.get(key);


    }


    const result = func(...args);


    cache.set(key, result);


    return result;


    };


    }


    function fibonacci(n) {


    if (n <= 1) {


    return n;


    }


    return fibonacci(n - 1) + fibonacci(n - 2);


    }


    const memoizedFibonacci = memoize(fibonacci);


    console.log(memoizedFibonacci(40));


    // Computes and caches the result


    console.log(memoizedFibonacci(40));


