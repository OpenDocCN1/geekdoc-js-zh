    # 85\. What is the purpose of the isFinite function


    Problem: You are a JavaScript developer working on a project that requires validating
    whether a value is a finite number or not. You''ve heard about the isFinite function
    in JavaScript but are not sure of its purpose or how to use it correctly. You
    want to understand its function and how to apply it in your project.


    Solution: The isFinite function is a built-in function in JavaScript that is used
    to determine if a given value is a finite number. It returns true if the value
    is a finite number and false if it''s not.


    //       Example 1: Finite Number var num1 = 42;


    var result1 = isFinite(num1); console.log(result1); // Returns true


    //       Example 2: Non-numeric Value (NaN) var num2 = NaN;


    var result2 = isFinite(num2); console.log(result2); // Returns false


    //       Example 3: Positive Infinite Value var num3 = Infinity;


    var result3 = isFinite(num3); console.log(result3); // Returns false


    //       Example 4: Negative Infinite Value var num4 = -Infinity;


    var result4 = isFinite(num4); console.log(result4); // Returns false


    //       Example 5: String that doesn''t represnet a number var str = "Hello";


    var result5 = isFinite(str); console.log(result5); // Returns false


    In this example, isFinite is used to check the finiteness of different values,
    including finite numbers, NaN, and infinities. The function is useful when you
    need to validate if a value is suitable for mathematical calculations or to ensure
    it''s not a special value like NaN or Infinity.


    Ensuring you understand how isFinite works will allow you to perform proper checks
    in your programs to handle various numeric value types.


    # 86\. Understanding the Nullish Coalescing Operator


    Problem: You want to handle default values in JavaScript when dealing with variables
    that could be null or undefined, while avoiding falsy values like empty strings
    or 0.


    Solution: The nullish coalescing operator (??) provides an elegant solution to
    this problem. It returns the right-hand operand (the default value) when the left-hand
    operand is null or undefined. Otherwise, it returns the left-hand operand.


    Example:


    const someValue = null;


    const defaultValue = ''Hello, world!'';


    const result = someValue ?? defaultValue;'
