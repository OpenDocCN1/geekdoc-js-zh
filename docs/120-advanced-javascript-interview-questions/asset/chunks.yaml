- fmt: "\nHere's an example of using the `new` keyword to create an instance of an\
    \ object:\n\n```\nfunction Person(name, age) {\n  this.name = name;\n  this.age\
    \ = age;\n}\n\nconst person1 = new Person(\"John\", 30);\nconsole.log(person1.name);\
    \ // \"John\"\nconsole.log(person1.age); // 30\n```\n\nExplanation: The `new`\
    \ keyword in JavaScript is used to create instances of objects based on constructor\
    \ functions, allowing you to define and initialize properties and methods for\
    \ those instances. In this example, the `Person` constructor function is used\
    \ with the `new` keyword to create an instance of a `Person` object. The `this`\
    \ keyword inside the constructor refers to the newly created object, and the properties\
    \ `name` and `age` are assigned to it.\n\n# 24. Cloning Objects\n\nProblem: Explain\
    \ how to clone an object in JavaScript, including potential pitfalls.\n\nSolution:\
    \ To clone an object in JavaScript, you can use the `Object.assign()` method.\
    \ This method creates a new object and copies the properties from the source object\
    \ to the new object. However, it's important to note that `Object.assign()` performs\
    \ a shallow copy, which means that nested objects are not deeply copied; they\
    \ still reference the same nested objects as the original. Here's an example:\n\
    \n```\nlet obj = {\n  a: 1,\n  b: 2,\n  c: {\n    age: 30,\n  },\n};\n\nlet objclone\
    \ = Object.assign({}, obj);\nconsole.log(\"objclone: \", objclone);\n// objclone:\
    \ { a: 1, b: 2, c: { age: 30 } }\n\nobj.c.age = 45;\nconsole.log(\"After Change\
    \ - obj: \", obj);\n// After Change - obj: { a: 1, b: 2, c: { age: 45 } }\nconsole.log(\"\
    After Change - objclone: \", objclone);\n// After Change - objclone: { a: 1, b:\
    \ 2, c: { age: 45 } }\n```\n\nExplanation: Cloning objects in JavaScript can be\
    \ achieved using the `Object.assign()` method, but keep in mind that it creates\
    \ a shallow copy. To achieve a deep copy of an object, you would need to implement\
    \ a custom deep cloning function. In this example, the `objclone` object is a\
    \ shallow copy of the `obj` object. When the nested object `obj.c` is modified,\
    \ both `obj` and `objclone` reflect the change.\n\n# 25. Adding Elements to the\
    \ Beginning and End of an Array\n\nProblem: Explain how to add an element at the\
    \ beginning and the end of an array using different methods.\n\nSolution: To add\
    \ an element to the beginning of an array, you can use the `unshift()` method\
    \ or the spread operator. To add an element to the end of an array, you can use\
    \ the `push()` method or the spread operator.\n\n```\n// Using unshift() and push\
    \ methods\nvar myArray = ['a', 'b', 'c', 'd'];\nmyArray.unshift(\"start\"); //\
    \ Adds 'start' at the beginning\nmyArray.push(\"end\"); // Adds 'end' at the end\n\
    console.log(myArray);\n// [\"start\", \"a\", \"b\", \"c\", \"d\", \"end\"]\n\n\
    // Using spread operator\nmyArray = [\"start\", ...myArray]; // Adds \"start\"\
    \ at the beginning\nmyArray = [...myArray, \"end\"]; // Adds \"end\" at the end\n\
    \n// Using spread operator in a single line\nmyArray = [\"start\", ...myArray,\
    \ \"end\"];\n```\n\nBoth methods achieve the same result of adding elements to\
    \ the array. The `unshift()` method adds an element to the beginning, the `push()`\
    \ method adds an element to the end, and the spread operator allows you to add\
    \ elements to any position in the array.\n\n# 26. Radix Sort Algorithm\n\nProblem:\
    \ Explain the working principle of the Radix Sort algorithm, a linear time sorting\
    \ algorithm used to sort integers or strings based on their digits or characters.\n\
    \nSolution: Radix Sort is a non-comparative sorting algorithm that works by distributing\
    \ elements into buckets based on their individual digits or characters. It sorts\
    \ the elements by considering each digit or character from the least significant\
    \ to the most significant.\n\nHere's how Radix Sort works:\n\n*   Choose a Base:\
    \ Radix Sort uses a base to represent digits or characters. For integers, the\
    \ base is usually 10 (decimal system), and for strings, the base is the number\
    \ of possible characters (e.g., 26 for lowercase English letters).\n*   Sorting\
    \ Iterations: The sorting process is divided into iterations, equal to the maximum\
    \ number of digits (for integers) or characters (for strings) present in the elements.\n\
    *   Bucket Distribution: In each iteration, distribute the elements into buckets\
    \ based on the digit or character at the current position. The elements are grouped\
    \ by their values in the current position.\n*   Collecting Buckets: After distributing\
    \ the elements, collect them back from the buckets in the order they were placed,\
    \ maintaining their order within each bucket.\n*   Repeat: Repeat the distribution\
    \ and collection process for each subsequent digit or character, moving from the\
    \ least significant to the most significant.\n*   Final Sorted Order: After all\
    \ iterations, the elements will be sorted based on each digit's or character's\
    \ value.\n\nRadix Sort is efficient for sorting large sets of data with a fixed\
    \ number of digits or characters. It has a time complexity of O(nk), where n is\
    \ the number of elements and k is the number of digits or characters.\n\n# 27.\
    \ Measuring the Performance of a JavaScript Function\n\nProblem: Explain how to\
    \ measure the performance of a JavaScript function using the `performance.now()`\
    \ method.\n\nSolution: To measure the performance of a JavaScript function, you\
    \ can use the `performance.now()` method, which provides high-resolution timestamps\
    \ in milliseconds.\n\nHere's how you can do it:\n\n```\nfunction myFunction()\
    \ {\n  result = 0;\n  for (let i = 0; i < 1000; i++) {\n    result += Math.sqrt(i);\n\
    \  }\n  console.log(\"Result:\", result);\n  //​Result: 21065.833110879048\n}\n\
    \nconst start = performance.now();\nmyFunction();\nconst end = performance.now();\n\
    const timeTaken = end - start;\nconsole.log(`Time taken: ${timeTaken} milliseconds`);\n\
    // Time taken: 0.10000000894069672 milliseconds\n```\n\nIn this example, `start`\
    \ captures the current timestamp before calling the function, and `end` captures\
    \ the timestamp after the function has completed its execution. The difference\
    \ between `end` and `start` gives you the time taken by the function to execute.\n\
    \n# 28. Differences Between call() and apply() in JavaScript\n\nProblem: Highlight\
    \ the Major Difference Between `call()` and `apply()` in JavaScript.\n\nSolution:\
    \ `call()` and `apply()` are both methods in JavaScript that are used to invoke\
    \ functions, but they differ in how they pass arguments to the function being\
    \ called.\n\n`call()`: The `call()` method is used to invoke a function with a\
    \ given `this` value and arguments provided individually (comma-separated).\n\n\
    ```\nfunction example(a, b) {\n  console.log(a + b);\n}\nexample.call(null, 1,\
    \ 2); // 3\n```\n\nIn this example, the first argument of `call()` sets the `this`\
    \ value within the `example` function. The subsequent arguments are passed as\
    \ separate values.\n\n`apply()`: The `apply()` method is similar to `call()`,\
    \ but it accepts arguments as an array or an array-like object.\n\n```\nfunction\
    \ example(a, b) {\n  console.log(a + b);\n}\nexample.apply(null, [1, 2]); // 3\n\
    ```\n\nHere, the `apply()` method takes the first argument as the `this` value\
    \ and the second argument as an array of arguments to be passed to the function.\n\
    \nExplanation: The major difference between `call()` and `apply()` lies in how\
    \ they pass arguments to the invoked function. `call()` expects individual arguments\
    \ separated by commas, while `apply()` takes an array or array-like object containing\
    \ the arguments. Both methods are used to set the `this` value within the function.\
    \ Understanding these differences helps you choose the appropriate method based\
    \ on your specific use case.\n\n# 29. Implementing a Sum Method with Flexible\
