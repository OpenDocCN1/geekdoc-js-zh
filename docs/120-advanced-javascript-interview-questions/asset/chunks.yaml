    .then(response => response.json())


    .then(data => {


    //      Handle the JSON response data here console.log(data);


    })


    .catch(error => {


    //      Handle any errors during the request


    console.error(error);


    })


    Response Format: API responses are typically in JSON format, making it easy for
    both humans and machines to read and understand the data.


    Authentication: To protect sensitive resources, REST APIs often require authentication.
    Common methods include API keys, OAuth tokens, or username/password.


    Status Codes: HTTP status codes are used to indicate the outcome of an API request.
    For example, a 200 status code indicates success, while a 404 status code means
    the requested resource was not found.


    Endpoints: Endpoints are specific URLs that represent resources. For example,
    /articles could be an endpoint to retrieve a list of articles, and /articles/1
    could represent a specific article with an ID of 1.


    Versioning: API versions help ensure backward compatibility as the API evolves.
    Version numbers are often included in the URL (e.g., /v1/articles).


    To interact with a REST API in JavaScript, you can use libraries like fetch, Axios,
    or jQuery.ajax to send HTTP requests and handle responses. Here''s an example
    using the fetch API to retrieve data from a RESTful endpoint.


    # 77\. Local Storage


    Problem: Exploring Local Storage in JavaScript


    Solution: Local Storage is a web storage mechanism in web browsers that allows
    websites to store key-value pairs locally on a user''s device. Unlike cookies,
    local storage can store larger amounts of data (usually up to 5-10MB) and is not
    sent with every HTTP request, making it a more efficient option for storing data
    that needs to persist across sessions.


    Local Storage has various use cases, including:


    *   Persistent Data: Local Storage can be used to store data that needs to be
    retained even after the user closes the browser or navigates away from the website.


    *   User Preferences: Websites can store user preferences and settings in Local
    Storage for a personalized experience.


    *   Offline Data: Local Storage allows websites to provide offline functionality
    by caching data locally and synchronizing it when the device is online.


    *   Caching: Websites can use Local Storage to cache static resources like images
    and stylesheets to improve page load times.


    Here''s an example of using Local Storage in JavaScript:


    //       Set data in Local Storage localStorage.setItem("username", "John Doe");
    localStorage.setItem("theme", "dark");


    //       Retrieve data from Local Storage


    const username = localStorage.getItem("username");


    const theme = localStorage.getItem("theme");


    console.log("Username: " + username);


    //       Username: John Doe console.log("Theme: " + theme);


    //       Theme: dark


    //       Remove data from Local Storage localStorage.removeItem("theme");


    It''s important to note that Local Storage is synchronous and operates within
    the same origin policy. This means that data stored in Local Storage is only accessible
    to the same website on the same device. Also, users can clear Local Storage for
    a website manually through browser settings.


