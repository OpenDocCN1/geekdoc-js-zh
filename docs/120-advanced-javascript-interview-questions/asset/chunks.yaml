    \ 10。如果两个条件都为假，则执行 `else` 块中的代码。\n\n# 13. Try-Catch 语句\n\n问题：解释 JavaScript 中 `try-catch`\
    \ 语句的目的和用法。\n\n解决方案：在 JavaScript 中，`try-catch` 语句提供了一种管理和处理代码执行过程中可能出现的错误的方法。它们允许开发者“尝试”一段代码并“捕获”任何出现的错误，从而防止这些错误导致程序崩溃。\n\
    \nTry-Catch 语句示例：\n\n```\ntry {\n  let x = y;\n} catch (error) {\n  console.error(error);\n\
    }\n// ReferenceError: y is not defined\n```\n\n在此场景中，`try` 块包含可能导致错误的代码。如果发生错误，`catch`\
    \ 块会捕获该错误并执行其中的代码。在此示例中，由于 `y` 未定义，抛出了一个 `ReferenceError`。传递给 `catch` 块的错误对象包含有关错误的信息，有助于诊断。\n\
    \n用途和重要性：`try-catch` 语句对于受控的错误处理非常有价值。开发者可以捕获错误、收集相关信息，甚至向用户提供有意义的错误消息，而不是让错误导致整个程序崩溃。这有助于构建更友好、更稳定的应用程序。\n\
