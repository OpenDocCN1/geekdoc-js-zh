    # 109\. What are compose and pipe functions?


    Problem: Compose and pipe functions are used in functional programming to create
    more maintainable and readable code by combining multiple functions together.
    The problem they solve is how to apply a sequence of functions to a value and
    pass the result of one function as the input to the next function while keeping
    the code clean and easy to understand.


    Solution:


    Compose Function: Compose is a higher-order function that takes multiple functions
    as arguments and returns a new function. This new function applies the functions
    from right to left, passing the result of one function as the argument to the
    next function.


    ```

    const compose =


    (...fns) =>


    (x) =>


    fns.reduceRight((v, fn) => fn(v), x);


    const addOne = (x) => x + 1;


    const double = (x) => x * 2;


    const square = (x) => x ** 2;


    const composeFn = compose(square, double, addOne);


    console.log(composeFn(3)); // 64

    ```


    Pipe Function: Pipe is similar to compose but applies the functions from left
    to right, passing the result of one function as the argument to the next function.


    ```

    const pipe = (...fns) => (x) => fns.reduce((v, fn) => fn(v), x);


    const addOne = (x) => x + 1;


    const double = (x) => x * 2;


    const square = (x) => x ** 2;


    const pipedFn = pipe(addOne, double, square);


