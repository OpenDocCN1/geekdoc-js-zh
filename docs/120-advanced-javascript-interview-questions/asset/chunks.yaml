    # 120\. Shallow Copy vs. Deep Copy


    Problem: Developers often struggle to grasp the differences between shallow copies
    and deep copies when working with objects and arrays in JavaScript. This confusion
    can lead to unexpected behavior in their code.


    Solution: When dealing with objects and arrays in JavaScript, it''s crucial to
    understand the differences between shallow copies and deep copies:


    Shallow Copy: A shallow copy of an object or array creates a new container (object
    or array) and copies references to the items from the original container. It does
    not create copies of nested objects or arrays.


    Shallow copies are fast and memory-efficient because they avoid duplicating complex
    data structures.


    Changes made to nested objects or arrays within the copy are reflected in the
    original and vice versa since they reference the same objects.


    Shallow copies can be created using methods like `Object.assign()`, the spread
    operator (`...`), or by iterating over the original and copying items.


    Shallow copies are suitable when you want to duplicate a container''s structure
    quickly without worrying about deeply nested objects or arrays. For instance,
    when copying the initial state of a Redux store.


    ```

    const shallowCopy = { ...originalObject };

    ```


    Deep Copy: A deep copy of an object or array creates a completely independent
    copy of both the container and all nested objects and arrays. Changes in the copy
    do not affect the original, and vice versa.


    Deep copies ensure isolation between the original and the copy, making them safer
    for scenarios where you want to modify one without affecting the other.


    Creating deep copies can be more complex, slower, and memory-intensive because
    it requires recursively copying all nested objects and arrays.


    Libraries like Lodash provide functions for deep copying objects and arrays.


    Deep copies are essential when you need to ensure complete independence between
    the original and the copy. Use them for scenarios like creating snapshots of an
    object''s state or cloning complex data structures.


    ```

    const deepCopy = JSON.parse(JSON.stringify(originalObject));

    ```


