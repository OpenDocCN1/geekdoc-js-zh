  trans: "\n解决方案：标签语句允许我们在 JavaScript 中为循环和代码块命名。之后我们可以使用这些标签来引用之前的代码。例如，下面的带标签代码在数字相同时避免打印它们。\n\
    \n示例：\n\n```\nvar i, j;\n\nloop1: for (i = 0; i < 3; i++) {\n  loop2: for (j =\
    \ 0; j < 3; j++) {\n    if (i === j) {\n      continue loop1;\n    }\n    console.log(\"\
    i = \" + i + \", j = \" + j);\n  }\n}\n\n// 输出为：\n// \"i = 1, j = 0\"\n// “i =\
    \ 2, j = 0\"\n// \"i = 2, j = 1\"\n```\n\n# 45. 交换变量\n\n问题：解释在 JavaScript 中交换两个变量值的各种技术，并讨论每种方法的优缺点。\n\
    \n解决方案：交换变量可以通过使用临时变量、算术运算或解构赋值来实现。\n\n示例 1：使用临时变量\n\n```\nlet a = 5;\nlet b =\
    \ 10;\nlet temp;\ntemp = a; // 5\na = b; // 10\nb = temp; // 5\n```\n\n示例 2：使用算术解构运算\n\
    \n```\nlet a = 5;\nlet b = 10;\na = a + b; // 15\nb = a - b; // 5\na = a - b;\
    \ // 10\n```\n\n示例 3：使用解构赋值\n\n```\nlet a = 5;\nlet b = 10;\n[a, b] = [b, a];\n\
    ```\n\n# 46. 使用事件委托\n\n问题：解释 JavaScript 中事件委托的概念，并讨论其在 Web 开发中管理事件的优势。\n\n解决方案：事件委托是将单个事件监听器附加到共同的祖先元素上，而不是为每个子元素添加多个监听器。这种方法在性能和动态添加的元素方面具有优势。\n\
    \n示例：考虑一个包含多个项目的列表，每个项目都有一个按钮。不必为每个按钮添加事件监听器，而是可以为列表元素添加一个监听器，并使用事件委托来处理按钮点击。\n\
    \n```\ndocument.querySelector(\"#list\").addEventListener(\"click\", function\
    \ (event) {\n  if (event.target.tagName === \"BUTTON\") {\n    // 处理按钮点击\n  }\n\
    });\n```\n\n事件委托通过减少事件监听器的数量来提高效率，尤其是在处理大量或动态更新的内容时。\n\n# 47. 使用 `bind()` 函数\n\
    \n问题：解释 JavaScript 中 `bind()` 函数的概念和用例。提供示例说明如何使用 `bind()` 来保留上下文以及创建带有预设参数的新函数。\n\
    \n解决方案：JavaScript 中的 `bind()` 函数用于创建一个具有固定上下文（`this` 值）和预设参数的新函数。它通常用于在将方法作为回调传递时保留原始上下文、创建具有部分应用参数的新函数以及创建专用函数。\n\
    \n示例：保留上下文\n\n```\nconst user = {\n  name: \"John\",\n  greet: function () {\n\
    \    console.log(`Hello, ${this.name}!`);\n  },\n};\n\nconst greetFunction = user.greet;\n\
    greetFunction(); // Hello, undefined!\n\nconst boundGreet = user.greet.bind(user);\n\
    boundGreet(); // Hello, John!\n```\n\n示例：创建新函数\n\n```\nconst sayHello = function(name)\
    \ { console.log(`Hello, ${name}!`);\n};\n\nconst sayHi = sayHello.bind(null, \"\
    Alice\");\nsayHi(); // Hello, Alice!\n```\n\n示例：部分函数应用\n\n```\nfunction add(a,\
    \ b) { return a + b;\n}\n\nconst addFive = add.bind(null,\n5);\nconsole.log(addFive(3));\
    \ // 8\n```\n\n# 48. 使用 ES6 生成器生成斐波那契数列\n\n问题：在 JavaScript 中创建一个生成器函数，用于生成斐波那契数列。实现该生成器以逐个生成斐波那契数。使用该生成器打印前\
    \ 10 个斐波那契数。\n\n解决方案：你可以使用 ES6 生成器函数来生成斐波那契数列。生成器函数维护前两个数的状态，并生成当前的斐波那契数。\n\n\
    以下是实现和使用该生成器的方法：\n\n```\nfunction* fibonacciGenerator() {\n  let prev = 0;\n \
    \ 1;\n  let current = 1;\n  1;\n  while (true) {\n    2;\n    yield current;\n\
    \    3;\n    const next = prev + current;\n    5;\n    prev = current;\n    8;\n\
    \    current = next;\n    13;\n  }\n  21;\n}\n34;\n55;\n\nconst fibonacci = fibonacciGenerator();\n\
    for (let i = 0; i < 10; i++) {\n  console.log(fibonacci.next().value);\n}\n```\n\
    \n# 49. 递归二分查找\n\n问题：在 JavaScript 中实现一个递归函数，对已排序数组执行二分查找。\n\n解决方案：二分查找是一种分治算法，它将目标元素与数组的中间元素进行比较。以下是如何实现具有较高难度的递归二分查找函数：\n\
    \n```\nfunction binarySearchRecursive(arr, target, left = 0, right = arr.length\
    \ - 1) {\n  if (left <= right) {\n    const middle = Math.floor((left + right)\
    \ / 2);\n    if (arr[middle] === target) {\n      return middle; // 找到元素\n   \
    \ } else if (arr[middle] > target) {\n      return binarySearchRecursive(arr,\
    \ target, left, middle - 1); // 搜索左半部分\n    } else {\n      return binarySearchRecursive(arr,\
    \ target, middle + 1, right); // 搜索右半部分\n    }\n  }\n  return -1; // 未找到元素\n}\n\
    \nconst sortedArray = [1, 3, 5, 7, 9, 11, 13, 15];\nconsole.log(binarySearchRecursive(sortedArray,\
    \ 7)); // 输出：3（7 在数组中的索引）\nconsole.log(binarySearchRecursive(sortedArray, 8));\
