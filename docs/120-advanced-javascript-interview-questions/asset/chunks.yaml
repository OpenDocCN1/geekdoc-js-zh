    \n```javascript\nvar argsArray = Array.prototype.slice.call(arguments);\n```\n\
    \n# 60. 匿名函数的典型使用场景\n\n问题：识别使用匿名函数的常见场景。\n\n解决方案：匿名函数通常用于……\n\n在 IIFE（立即调用函数表达式）中：将代码封装在局部作用域内，防止变量泄漏到全局作用域。\n\
    \n```javascript\n(function() {\n  // 此处编写一些代码。\n})();\n```\n\n用于函数式编程或像 Lodash\
