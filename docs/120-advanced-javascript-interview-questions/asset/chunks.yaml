    # 20. Generating all Permutations of a String


    Problem: Write a recursive function in JavaScript to generate all possible permutations
    (anagrams) of a given string.


    Solution: To generate all permutations of a string, you can follow these steps:


    *   Base Case: If the string length is 1 or less, return an array containing the
    string itself.

    *   Recursive Step: For each character in the string, generate permutations of
    the remaining characters using recursion.

    *   Combining: Combine each character with the permutations of the remaining characters.


    This generates all possible permutations of the input string `"abc"` using recursion:


    ```

    function generatePermutations(str) {

    if (str.length < 2) return [str];

    return str

    .split("")

    .flatMap((char, index) =>

    generatePermutations(str.slice(0, index) + str.slice(index + 1)).map(

    (permutation) => char + permutation

    )

    );

    }

    // Usage:

    const input = "abc";

    const result = generatePermutations(input);

    console.log(result);

    // [ ''abc'', ''acb'', ''bac'', ''bca'', ''cab'', ''cba'' ]

    ```


    # 21. Difference between await and yield keywords


    Problem: Explain the differences between the `await` keyword and the `yield` keyword
    in JavaScript.


    Solution: Both `await` and `yield` keywords are used in different contexts, and
    they serve distinct purposes:


    *   `await`: Pauses execution in an async function until the awaited promise is
    resolved or rejected. Used with asynchronous operations for a more synchronous-looking
    style.

    *   `yield`: Pauses execution in a generator function and yields a value to the
    iterator. Used for creating iterators that can be paused and resumed, often for
    lazy evaluation.


    ```

    // Example using await:

    const fetchData = async () => {

    const data = await (await fetch("https://api.example/data")).json();

    console.log(data);

    };

    // Example using yield:

    function* generateNumbers() {

    yield 1;

    yield 2;

    yield 3;

    }

    const iterator = generateNumbers();

    console.log(iterator.next().value); // 1

    console.log(iterator.next().value); // 2

    console.log(iterator.next().value); // 3

    ```


    # 22. Usage of import * as X from ''X''


    Problem: Explain when and why you would use the syntax `import * as X from ''X''`
    in JavaScript.


    Solution: The syntax `import * as X from ''X''` is used to import an entire module
    and assign it to an alias `X`. This allows you to access all the exports of the
    module using the alias `X`.


    You would use this syntax when you want to import and use multiple exports from
    a module without having to list each export separately. It''s especially useful
    when the module contains a collection of related functions, constants, or classes.


    Example: Let''s say you have a module named `mathUtils` with multiple functions:


    ```

    // mathUtils.js

    export function add(a, b) {

    return a + b;

    }

    export function subtract(a, b) {

    return a - b;

    }

    export function multiply(a, b) {

    return a * b;

    }

    ```


    Note: While using `import * as X from ''X''` can save you from listing individual
    exports, it''s also important to note that it might lead to unnecessary memory
    usage if the module contains a lot of exports. Use it when it makes sense in terms
    of code organization and maintainability.


    You can import all the functions using an alias:


    ```

    // main.js

    import * as mathFunctions from "./mathUtils";

    console.log(mathFunctions.add(5, 3)); // 8 console.log(mathFunctions.subtract(5,
    3)); // 6 console.log(mathFunctions.multiply(3, 7)); // 21

    ```


