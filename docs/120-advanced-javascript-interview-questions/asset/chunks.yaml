    # 87\. What are the primitive data types in JavaScript?


    Problem: Primitive Data Types in JavaScript


    Solution: In JavaScript, primitive data types are simple, immutable data values
    that represent single values. There are five primitive data types in JavaScript:
    boolean, undefined, null, number, and string. These data types are considered
    built-in and have certain characteristics that differentiate them from objects.


    *   boolean: Represents a binary value, either true or false.


    *   undefined: Represents a variable that has been declared but has not been assigned
    a value.


    *   null: Represents an intentional absence of any value or object.


    *   number: Represents both integer and floating-point numeric values.


    *   string: Represents a sequence of characters enclosed within single ('''')
    or double ("") quotes.


    It''s important to note that these primitive data types are passed by value, meaning
    their values are directly stored in memory. They are not objects and do not have
    properties or methods associated with them.


    Example:


    let isTrue = true; // boolean


    let age; // undefined


    let score = null; // null


    let count = 5; // number


    let name = "John"; // string


    Understanding primitive data types is fundamental to working effectively with
    JavaScript''s type system.


