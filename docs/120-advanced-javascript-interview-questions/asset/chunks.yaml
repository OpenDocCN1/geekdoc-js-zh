    # 34. What are computed properties


    Problem: Explain what computed properties are in JavaScript objects and provide
    examples of how they are defined.


    Solution: Computed properties in JavaScript objects allow dynamic definition of
    property names. They are defined using square brackets `[]` within an object literal.
    Computed properties are useful for creating object properties with names determined
    at runtime or based on variables.


    Here''s an example:


    ```

    const dynamicKey = "age";


    const person = {


    name: "John",


    [dynamicKey]: 30,


    [1 + 2]: "Three",


    };


    console.log(person.name); // John


    console.log(person.age); // 30


    console.log(person[3]); // Three

    ```


    In this example, the property name ''age'' is determined by the `dynamicKey` variable.
    Computed properties offer flexibility when property names depend on runtime conditions.


    Note: Computed properties are a feature of modern JavaScript (ES6+). They may
    not work in older browsers lacking ES6 support.


    # 35. What''s the output?


    ```

    class Counter {


    #number = 10;


    increment() {


    this.#number++;


    }


    getNum() {


    return this.#number;


    }


    }


    const counter = new Counter();


    counter.increment();


    console.log(counter.getNum()); // 11

    ```


    A:  10


    B:  11


    C:  `undefined`


    D:  `SyntaxError`


    Answer: D


    In ES2020, we can add private variables in classes by using the `#`. We cannot
    access these variables outside of the class. When we try to log `counter.#number`,
    a `SyntaxError` gets thrown: we cannot acccess it outside the `Counter` class!


    # 36. Escape Character


    Problem: Explain the concept of an escape character in JavaScript. Provide examples
    of commonly used escape sequences and their meanings.


    Solution: An escape character in JavaScript is a character that signals that the
    character following it has a special meaning and should not be interpreted in
    its usual context. It''s used to represent characters that are not easily typable
    on a keyboard or characters with special meanings within strings or regular expressions.


    Here are some commonly used escape sequences and their meanings:


    *   `\n`: Represents a newline character.


    *   `\t`: Represents a tab character.


    *   `\"`: Represents a double quote character.


    *   `\''`: Represents a single quote character.


    *   `\\`: Represents a literal backslash character.


    Example usage:


    ```

    console.log("This is a string with a newline:\nSecond line");


    // This is a string with a newline:


    // Second line


    console.log("This is a string with a tab:\tTabbed text"); // This is a string
    with a tab: Tabbed text


    console.log("This is a string with a double quote: \"Hello\"");


    // This is a string with a double quote: "Hello"


    console.log(''This is a string with a single quote: \''Hi\'''');


    // This is a string with a single quote: ''Hi''


    console.log("This is a string with a backslash: \\");

    ```

