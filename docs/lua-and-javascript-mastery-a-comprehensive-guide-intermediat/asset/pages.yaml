    \  end\n  return result\nend\n```\n\n-- Higher-order function to transform a list\
    \ using a transformation function\n\n-- Using the transform_list function to square\
    \ a list of numbers\nnumbers = { 2, 5, 8, 10 }\nsquared_numbers = transform_list(numbers,\
