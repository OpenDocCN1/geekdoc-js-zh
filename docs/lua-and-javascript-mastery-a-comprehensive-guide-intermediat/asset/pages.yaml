  md: 'Hoisting is a behavior in JavaScript where variable declarations (not the assignments)
    are moved to the top of their scope during the code execution. This means that
    you can use a variable before it''s declared without causing an error.


    ```

    ```javascript

    // Example 8: Hoisting


    console.log(name); // Output: undefined


    var name = ''John Doe'';


    console.log(name); // Output: John Doe

    ```

    ```


    In Example 8, the first `console.log` statement outputs `undefined` because the
    variable `name` is hoisted to the top of the scope, but its assignment `name =
    ''John Doe''` is not hoisted. Therefore, the variable exists but has no value
    until it''s assigned.


