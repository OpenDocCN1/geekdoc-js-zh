    \  // 检查用户是否已身份验证\n  if (req.isAuthenticated()) {\n    return next();\n  }\n \
    \ res.redirect('/login');\n};\n\napp.get('/profile', authenticateUser, (req, res)\
    \ => {\n  res.send('Welcome to your profile!');\n});\n...\n```\n\n在上面的示例中，我们定义了一个身份验证中间件，在允许访问\
    \ `/profile` 路由之前检查用户是否已身份验证。\n\n## 10. RESTful API 开发\n\nNode.js 非常适合构建 RESTful\
    \ API，允许前端客户端与后端通信，并对资源执行 CRUD（创建、读取、更新、删除）操作。\n\n```javascript\n// Example 7:\
    \ RESTful API for Managing Books\nconst books = [\n  { id: 1, title: 'Node.js\
    \ in Action' },\n  { id: 2, title: 'Eloquent JavaScript' }\n];\n\napp.get('/api/books',\
    \ (req, res) => {\n  res.json(books);\n});\n\napp.post('/api/books', (req, res)\
