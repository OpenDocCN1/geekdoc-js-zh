    \ we create three functions, each returning a promise. The `then()` method is\
    \ used to chain the promises together, and the result is passed from one step\
    \ to the next.\n\n## Using async/await: Simplifying Asynchronous Code\n\nES8 introduced\
    \ async/await, a syntacticical feature that simplifies writing asynchronous code\
    \ using promises.\n\n### Using async/await:\n\nWith async/await, we can write\
