    # ### a. Continuous Integration (CI)


    CI involves automatically merging code changes into a shared repository and running
    automated tests whenever new code is committed. This ensures that the application
    remains functional and free of regressions.


    # ### b. Continuous Deployment (CD)


    CD takes automation one step further by automatically deploying code to production
    after passing all the required tests. It streamlines the deployment process, reducing
    the time between writing code and making it available to users.


    # ## 4. Deployment Strategies


    # ### a. Blue-Green Deployment'
  - '[PAGE 388]


    Blue-Green deployment, two identical environments (blue and green) are maintained.
    The current pro-duction environment (blue) serves the live application, while
    the new version of the application is deployed to the green environment. Once
    the green environment is tested and verified, the traffic is switched from blue
    to green, making the new version live.


    # ### b. Canary Deployment


    Canary deployment involves deploying a new version of the application to a small
    subset of users (the canary group). This allows for testing the new version in
    production with limited impact. If the new ver-sion performs well, it can gradually
    be rolled out to a larger audience.


    # ### c. Rolling Deployment


    Rolling deployment, the new version of the application is deployed incrementally
    to a subset of servers or instances at a time. This allows for a smooth transition
    between versions, reducing downtime and min-izing the impact on users.'
