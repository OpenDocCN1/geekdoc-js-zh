    \ a greeting message.\n\n### c. State and Props\n\nState and props are two fundamental\
    \ concepts in React.\n\n- State: State represents the internal data of a component.\
    \ It can change over time and is managed by the component itself. To handle state,\
    \ we use the `useState` hook in functional components or the `setState` method\
    \ in class-based components.\n\n```jsx\n// Example 4: Using State in Functional\
