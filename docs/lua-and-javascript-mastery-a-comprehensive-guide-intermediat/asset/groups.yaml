    \n## 1. Arrow Functions\n\nArrow functions are a concise way to write function\
    \ expressions in JavaScript, making code more readable and reducing the need for\
    \ the `function` keyword.\n\n```javascript\n// Example 1: Using arrow functions\n\
    // Regular function\nfunction add(a, b) {\n  return a + b;\n}\n\n// Arrow function\n\
    const add = (a, b) => a + b;\n```\n\nIn the above example, we define a regular\
    \ function `add()` and rewrite it using an arrow function, which is more concise.\n\
    \n## 2. Block-Scoped Declarations: let and const\n\nES6 introduced two new keywords\
    \ for declaring variables: `let` and `const`. These block-scoped declarations\
    \ provide a clearer and safer way to manage variables.\n\n```javascript\n// Example\
    \ 2: Using let and const\nlet x = 10; // Variable that can be reassigned\nconst\
    \ y = 20; // Constant variable, cannot be reassigned\n\nfunction exampleFunction()\
    \ {\n  if (true) {\n    let x = 5; // Block-scoped variable\n    const y = 15;\
    \ // Block-scoped constant variable\n    console.log(x, y); // Output: 5 15\n\
    \  }\n  console.log(x, y); // Output: 10 20\n}\n\nexampleFunction();\n```\n\n\
    In the above example, we use `let` and `const` to declare variables within a block.\n\
    \n## 3. Destructuring Assignment\n\nDestructuring assignment allows us to extract\
    \ values from arrays or objects and assign them to variables in a more concise\
    \ way.\n\n```javascript\n// Example 3: Using destructuring assignment\n// Array\
    \ destructuring\nconst [a, b, c] = [1, 2, 3];\nconsole.log(a, b, c); // Output:\
    \ 1 2 3\n\n// Object destructuring\nconst person = { name: \"John\", age: 30 };\n\
    const { name, age } = person;\nconsole.log(name, age); // Output: John 30\n```\n\
    \nIn the above example, we use array and object destructuring to extract values\
    \ from arrays and objects.\n\n## 4. Spread Syntax\n\nThe spread syntax allows\
    \ us to spread elements of an iterable (e.g., an array) into individual elements,\
    \ making it useful for creating shallow copies and merging arrays and objects.\n\
    \n```javascript\n// Example 4: Using spread syntax\n// Array spreading\nconst\
    \ numbers = [1, 2, 3];\nconst copiedNumbers = [...numbers];\nconsole.log(copiedNumbers);\
    \ // Output: [1, 2, 3]\n\n// Merging arrays\nconst arr1 = [1, 2, 3];\nconst arr2\
    \ = [4, 5, 6];\nconst mergedArray = [...arr1, ...arr2];\nconsole.log(mergedArray);\
    \ // Output: [1, 2, 3, 4, 5, 6]\n\n// Object spreading\nconst person = { name:\
    \ \"John\", age: 30 };\nconst copiedPerson = { ...person };\nconsole.log(copiedPerson);\
    \ // Output: { name: \"John\", age: 30 }\n```\n\nIn the above example, we use\
    \ spread syntax for array spreading, merging arrays, and object spreading.\n\n\
    ## 5. Template Literals\n\nTemplate literals provide an elegant way to create\
    \ strings with embedded expressions, making string concatenation more readable\
    \ and efficient.\n\n```javascript\n// Example 5: Using template literals\nconst\
    \ name = \"John\";\nconst age = 30;\n\n// Without template literals\nconst message\
    \ = \"My name is \" + name + \" and I am \" + age + \" years old.\";\n\n// With\
    \ template literals\nconst message = `My name is ${name} and I am ${age} years\
    \ old.`;\n```\n\nIn the above example, we use template literals to create a more\
    \ readable and efficient string.\n\n## 6. Classes and Object-Oriented Programming\
    \ (OOP)\n"
