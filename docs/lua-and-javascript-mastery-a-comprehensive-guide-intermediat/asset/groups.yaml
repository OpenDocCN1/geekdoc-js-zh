    \ (Open Authorization) is a more secure and complex authentication protocol used\
    \ for accessing third-party APIs on behalf of a user.\n\n## 6. Working with Pagination\
    \ and Filtering\n\nAPIs often return large sets of data that need to be paginated\
    \ or filtered to retrieve specific information efficiently.\n\n### a. Pagination:\n\
    \nPagination allows you to retrieve data in chunks or pages, reducing the amount\
    \ of data transferred in each request.\n\n```javascript\n// Example 5: Using pagination\
    \ with Fetch API\nconst page = 2;\nconst pageSize = 10;\n\nfetch(`https://api.example.com/data?page=${page}&pageSize=${pageSize}`)\n\
    \  .then((response) => response.json())\n  .then((data) => console.log(data))\n\
    \  .catch((error) => console.log(\"Error:\", error));\n```\n\nIn the above example,\
    \ we use pagination to request the second page of data with a page size of 10.\n\
    \n### b. Filtering:\n\nFiltering allows you to specify criteria for retrieving\
    \ data that match certain conditions.\n\n```javascript\n// Example 6: Using filtering\
    \ with Fetch API\nconst category = \"electronics\";\nfetch(`https://api.example.com/data?category=${category}`)\n\
    \  .then((response) =>\n    response.json())\n  .then((data) => console.log(data))\n\
    \  .catch((error) => console.log(\"Error:\", error));\n```\n\nIn the above example,\
    \ we use filtering to request data related to the \"electronics\" category.\n\n\
    ## 7. CORS (Cross-Origin Resource Sharing)\n\nCORS is a security feature implemented\
    \ by web browsers that prevents web pages from making requests to a different\
    \ domain than the one that served the web page. APIs may need to support CORS\
    \ to allow requests from other domains.\n\n## 8. Error Handling with APIs\n\n\
    When working with APIs, it's essential to handle errors gracefully and provide\
    \ meaningful feedback to users.\n\n```javascript\n// Example 7: Handling errors\
    \ with Fetch API\nfetch(\"https://api.example.com/data\")\n.then((response) =>\
    \ {\n  if (!response.ok) {\n    throw new Error(\"Network response was not ok\"\
    );\n  }\n  return response.json();\n})\n.then((data) => console.log(data))\n.catch((error)\
    \ => console.log(\"Error:\", error));\n...\n```\n\nIn the above example, we handle\
    \ errors with Fetch API and throw an error if the network response is not OK.\n\
    \n## 9. API Best Practices\n\nWhen working with APIs, consider the following best\
    \ practices:\n\n- Always use secure HTTPS when making API requests to ensure data\
    \ privacy and security.\n- Implement proper error handling to provide meaningful\
    \ feedback to users.\n- Respect rate limits and usage quotas set by the API provider\
    \ to avoid being blocked.\n\nConclusion:\n\nIn this chapter, we explored various\
    \ methods to interact with APIs, including Fetch, XMLHttpRequest, and Axios. We\
    \ discussed API authentication like API keys and OAuth, pagination, and filtering.\
    \ We also touched upon CORS, error handling, and best practices. Mastering these\
    \ concepts will help you build robust and efficient web applications.\n"
  mdcn: "\n在上面的示例中，我们使用 Fetch API 向 API 端点发送了 GET 请求并记录了获取的数据。\n\n### b. XMLHttpRequest\n\
    \nXMLHttpRequest 是一个较旧的 API，提供了发送网络请求的能力，尽管不像 Fetch API 那么常用。\n\n```javascript\n\
    // Example 2: Using XMLHttpRequest\nconst xhr = new XMLHttpRequest();\n\nxhr.open(\"\
    GET\", \"https://api.example.com/data\", true);\n\nxhr.onload = function () {\n\
