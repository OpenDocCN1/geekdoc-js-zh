    \ () => {\n  console.log(`Server is running on http://localhost:${port}`);\n});\n\
    ```\n\n在上面的示例中，我们导入了 Express 模块，创建了 Express 应用程序的实例，并定义了一个路由，当访问根 URL 时响应 \"Hello,\
    \ World!\"。然后我们启动服务器并监听 3000 端口。\n\n## 5. 处理 HTTP 请求\n\nExpress 提供了一种简单且优雅的方式来处理不同类型的\
    \ HTTP 请求，例如 GET、POST、PUT、DELETE 等。\n\n```javascript\n// Example 2: Handling Different\
    \ HTTP Requests\napp.get('/users', (req, res) => {\n  // 代码用于获取并发送用户列表\n});\n\n\
    app.post('/users', (req, res) => {\n  // 代码用于创建新用户\n});\n\napp.put('/users/:id',\
    \ (req, res) => {\n  // 代码用于根据给定的 ID 更新用户\n});\n\napp.delete('/users/:id', (req,\
    \ res) => {\n  // 代码用于根据给定的 ID 删除用户\n});\n```\n\n在上面的示例中，我们定义了处理与用户相关的 GET、POST、PUT\
    \ 和 DELETE 请求的路由。\n\n## 6. 使用中间件 (Middleware)\n\n中间件函数是 Express 的重要部分，允许开发者在处理请求之前或之后添加自定义逻辑。\n\
    \n```javascript\n// Example 3: Using Middleware\napp.use((req, res, next) => {\n\
    \  console.log('Middleware executed');\n  next();\n});\n\napp.get('/', (req, res)\
    \ => {\n  res.send('Hello, World!');\n});\n...\n```\n\n在上面的示例中，我们定义了一个中间件函数，向控制台打印消息，然后调用\
    \ `next` 函数将控制权传递给下一个中间件或路由处理器。\n\n## 7. 连接数据库\n\n后端应用程序通常需要与数据库交互以存储和检索数据。Node.js\
    \ 为不同的数据库提供了许多库和驱动程序，例如 MongoDB、MySQL、PostgreSQL 等。\n\n```javascript\n// Example\
    \ 4: Connecting to MongoDB with Mongoose\nconst mongoose = require('mongoose');\n\
    mongoose.connect('mongodb://localhost/mydatabase', {\n  useNewUrlParser: true,\n\
    \  useUnifiedTopology: true,\n});\n\nconst db = mongoose.connection;\n\ndb.on('error',\
