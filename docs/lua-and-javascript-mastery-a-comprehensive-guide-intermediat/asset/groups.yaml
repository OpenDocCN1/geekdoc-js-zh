- md: "\n### else if Statement:\n\nThe `else if` statement can be used when multiple\
    \ conditions need to be checked sequentially. It provides an alternative set of\
    \ conditions to test if the previous `if` and `else` conditions are false.\n\n\
    ```javascript\n// Example 12: Using the else if statement\nlet time = 14;\n\n\
    if (time < 12) {\n  console.log(\"Good morning!\");\n} else if (time < 18) {\n\
    \  console.log(\"Good afternoon!\");\n} else {\n  console.log(\"Good evening!\"\
    );\n}\n```\n\nIn Example 12, the code checks the value of `time` and prints different\
    \ greetings based on the time of day.\n\n### Nested if Statements:\n\nYou can\
    \ nest conditional statements inside each other to create complex decision-making\
    \ logic.\n\n```javascript\n// Example 13: Using nested if statements\nlet age\
    \ = 25;\nlet isStudent = true;\n\nif (age >= 18) {\n  if (isStudent) {\n    console.log(\"\
    You are an adult student.\");\n  } else {\n    console.log(\"You are an adult.\"\
    );\n  }\n} else {\n  console.log(\"You are a minor.\");\n}\n```\n\nIn Example\
    \ 13, the code checks if the `age` is greater than or equal to 18 and then checks\
    \ if the person is a student or not.\n\n### The ternary Operator (?):\n\nThe ternary\
    \ operator provides a shorthand way to write simple if-else statements.\n\n```javascript\n\
    // Example 14: Using the ternary operator\nlet age = 25;\nlet message = age >=\
