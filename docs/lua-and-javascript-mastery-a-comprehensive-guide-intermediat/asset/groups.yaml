    \ Output: You are an adult.\n```\n\nIn Example 14, the ternary operator checks\
    \ if the `age` is greater than or equal to 18. If true, it assigns \"You are an\
    \ adult.\" to the `message` variable; otherwise, it assigns \"You are a minor.\"\
    .\n\n## Loops: Iterating with JavaScript\n\nLoops provide a way to execute a block\
    \ of code repeatedly until a specific condition is met. There are several types\
    \ of loops in JavaScript, but the most commonly used ones are the `for` loop and\
    \ the `while` loop.\n\n### for Loop:\n\nThe `for` loop is useful when you know\
    \ the exact number of iterations you want to perform.\n\n```javascript\n// Example\
    \ 15: Using the for loop\nfor (let i = 1; i <= 5; i++) {\n  console.log(\"Iteration:\
    \ \" + i);\n}\n```\n\nIn Example 15, the `for` loop executes the code inside the\
    \ curly braces five times, as `i` starts at 1 and increments by 1 in each iteration\
    \ until it reaches 5.\n\n### while Loop:\n\nThe `while` loop is used when you\
    \ want to repeat a block of code until a specific condition becomes false.\n\n\
    ```javascript\n// Example 16: Using the while loop\nlet count = 0;\nwhile (count\
    \ < 5) {\n  console.log(\"Count: \" + count);\n  count++;\n}\n```\n\nIn Example\
    \ 16, the `while` loop executes the code inside the curly braces until the `count`\
    \ becomes 5, as it increments by 1 in each iteration.\n\n### do...while Loop:\n\
    \nThe `do...while` loop is similar to the `while` loop, but it ensures that the\
    \ code inside the loop block is executed at least once before checking the condition.\n\
    \n```javascript\n// Example 17: Using the do...while loop\nlet i = 0;\ndo {\n\
    \  console.log(\"Value of i: \" + i);\n  i++;\n} while (i < 5);\n```\n\nIn Example\
    \ 17, the `do...while` loop executes the code inside the curly braces at least\
    \ once because the condition is checked after the first iteration.\n\n### break\
    \ and continue Statements:\n\nThe `break` statement allows you to exit a loop\
    \ prematurely if a certain condition is met. The `continue` statement allows you\
    \ to skip the rest of the current iteration and move to the next iteration.\n\n\
    ```javascript\n// Example 18: Using the break and continue statements\nfor (let\
    \ i = 1; i <= 10; i++) {\n  if (i === 5) {\n    break; // Exit the loop when i\
    \ is 5\n  }\n  if (i === 3) {\n    continue; // Skip the rest of the current iteration\
    \ when i is 3\n  }\n  console.log(\"Value of i: \" + i);\n}\n```\n\nIn Example\
    \ 18, the `break` statement is used to exit the loop when `i` is equal to 5, and\
    \ the `continue` statement is used to skip the rest of the code for the current\
    \ iteration when `i` is equal to 3.\n\n## Conclusion\n\nIn this chapter, we've\
    \ covered the basics of JavaScript, exploring its role in web development, setting\
    \ up the development environment, writing your first JavaScript program, working\
    \ with variables and data types, using operators and expressions, and implementing\
