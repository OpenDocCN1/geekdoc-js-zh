  mdcn: "\n\n为了理解 Angular，让我们探索它的核心概念：\n\n### a. 模块 (Modules)\n\n在 Angular 中，模块用于将应用程序组织成逻辑块。模块是相关组件、服务和其他应用程序功能的容器。每个\
    \ Angular 应用程序至少有一个根模块（root module），它是应用程序的入口。\n\n```typescript\n// Example 1:\
    \ Creating a Module\nimport { NgModule } from '@angular/core';\n\n@NgModule({\n\
    \  declarations: [/* Components and Directives */],\n  imports: [/* Other Modules\
    \ */],\n  providers: [/* Services */],\n  bootstrap: [/* Root Component */]\n\
    })\nexport class AppModule {\n```\n\n在上面的示例中，我们定义了一个带有元数据的 Angular 模块，其中包含了组件、指令、模块、服务以及用于启动应用程序的根组件。\n\
    \n### b. 组件 (Components)\n\n组件是 Angular 应用程序的构建块。每个组件负责用户界面的特定部分及其关联的行为。组件可以在整个应用程序中复用，并通过输入（inputs）和输出（outputs）与其他组件通信。\n\
    \n```typescript\n// Example 2: Creating a Component\nimport { Component } from\
    \ '@angular/core';\n\n@Component({\n  selector: 'app-greeting',\n  template: '<h1>Hello,\
