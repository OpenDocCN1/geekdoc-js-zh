    \n  return <h1>Hello, {props.name}!</h1>;\n}\n\nfunction App() {\n\n  return <Greeting\
    \ name=\"John\" />;\n}\n```\n\nIn the above examples, we use state and props to\
    \ manage internal data and pass data to child components.\n\n### d. Virtual DOM\n\
    \nReact uses a virtual DOM (Document Object Model) to optimize UI updates. The\
    \ virtual DOM is a light-weight copy of the actual DOM, and React compares it\
    \ with the real DOM to determine the minimum number of changes required for an\
    \ update, improving performance.\n\n## 3. Setting Up a React Project\n\nTo start\
    \ building a React application, we need to set up a project using tools like Create\
    \ React App or manually configure a build system with tools like Webpack and Babel.\n\
    \n### Create React App\n\nCreate React App is a popular tool for creating React\
    \ applications with a pre-configured build system.\n\n```bash\nnpx create-react-app\
    \ my-app\ncd my-app\nnpm start\n```\n\nIn the above example, we use Create React\
    \ App to set up a new React project named \"my-app\" and start the development\
    \ server.\n\n## 4. Working with React Components\n\nOnce the project is set up,\
    \ we can start building React components to create the user interface.\n\n###\
    \ a. Functional Components\n\nFunctional components are simple functions that\
    \ take props as input and return JSX elements as output.\n\n```jsx\n// Example\
    \ 6: Functional Component\nfunction Greeting(props) {\n  return <h1>Hello, {props.name}!</h1>\n\
    }\n```\n\n### b. Class-based Components\n\nClass-based components are ES6 classes\
    \ that extend `React.Component`. They have more features, such as state and lifecycle\
    \ methods.\n\n```jsx\n// Example 7: Class-based Component\nclass Greeting extends\
    \ React.Component {\n  render() {\n    return <h1>Hello, {this.props.name}</h1>;\n\
    \  }\n}\n...\n```\n\n### c. Component Composition\n\nReact encourages component\
    \ composition, where components can be nested within each other to create more\
    \ complex UIs.\n\n```jsx\n// Example 8: Component Composition\nfunction Greeting(props)\
    \ {\n  return <h1>Hello, {props.name}</h1>;\n}\n\nfunction App() {\n  return (\n\
    \    <div>\n      <Greeting name=\"John\" />\n      <Greeting name=\"Jane\" />\n\
    \    </div>\n  );\n}\n```\n\nIn the above example, we use component composition\
    \ to render two greetings in the `App` component.\n\n## 5. Handling Events in\
    \ React\n\nReact allows us to handle events, such as button clicks or form submissions,\
    \ using event handlers.\n\n```jsx\n// Example 9: Handling Events\nfunction Counter()\
    \ {\n  const [count, setCount] = useState(0);\n\n  const increment = () => {\n\
    \    setCount(count + 1);\n  };\n\n  return (\n    <div>\n      <p>Count: {count}</p>\n\
    \      <button onClick={increment}>Increment</button>\n    </div>\n  );\n}\n```\n\
    \nIn the above example, we use the `onClick` event handler to increment the count\
    \ when the button is clicked.\n\n## 6. Working with Forms in React\n\nReact provides\
    \ a straightforward way to handle form inputs and manage form state.\n\n```jsx\n\
    // Example 10: Working with Forms\nfunction LoginForm() {\nconst [username, setUsername]\
    \ = useState(\"\");\nconst [password, setPassword] = useState(\"\");\n\nconst\
    \ handleUsernameChange = (event) => {\n  setUsername(event.target.value);\n};\n\
    \nconst handlePasswordChange = (event) => {\n  setPassword(event.target.value);\n\
    };\n\nconst handleSubmit = (event) => {\n  event.preventDefault();\n\n  // Submit\
