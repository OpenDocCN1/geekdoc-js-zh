    }\n\ngreet(); // Output: Hello, Guest!\ngreet(\"John\"); // Output: Hello, John!\n\
    ```\n\nIn the above example, we use default parameters for the `greet()` function.\n\
    \n## Conclusion:\n\nIn this chapter, we explored ES6 and beyond, which brought\
