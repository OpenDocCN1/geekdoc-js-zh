    # # Chapter 7: DOM Manipulation and Events


    In Chapter 6, we explored arrays and array methods, which allowed us to work with
    collections of data effectively. Now, we will dive into DOM (Document Object Model)
    manipulation and events in JavaScript. The DOM is a programming interface for
    HTML and XML documents, representing the structure of a web page as a tree of
    objects. JavaScript enables us to manipulate the DOM, making web pages dynamic
    and interactive. Understanding DOM manipulation and handling events is crucial
    for building interactive and responsive web applications. Let''s dive in and explore
    the world of DOM manipulation and events!


    # ## The DOM: Document Object Model


    The Document Object Model (DOM) is a programming interface for HTML and XML documents,
    providing a structured representation of a web page. The DOM represents the elements
    on a web page as objects, allowing us to access, modify, and manipulate them using
    JavaScript.


    # ### Accessing DOM Elements:


    We can access DOM elements using various methods provided by JavaScript, such
    as `getElementById()`, `getElementsByClassName()`, `getElementsByTagName()`, and
    `querySelector()`.'
- md: "\n```html\n<!-- Example HTML -->\n<!DOCTYPE html>\n<html>\n<head>\n<title>DOM\
    \ Manipulation</title>\n</head>\n<body>\n<h1 id=\"title\">Welcome to DOM Manipulation!</h1>\n\
    <p class=\"content\">This is a paragraph.</p>\n<ul>\n<li>Item 1</li>\n<li>Item\
    \ 2</li>\n<li>Item 3</li>\n</ul>\n</body>\n</html>\n```\n\n```javascript\n// Example\
    \ JavaScript\nconst titleElement = document.getElementById(\"title\");\nconst\
    \ contentElements = document.getElementsByClassName(\"content\");\nconst liElements\
    \ = document.getElementsByTagName(\"li\");\nconst firstLiElement = document.querySelector(\"\
    li\");\n```\n\nIn the above examples, we access DOM elements with the IDs \"title,\"\
    \ the class name \"content,\" the tag name \"li,\" and the first \"li\" element\
    \ using different DOM methods.\n\n### Modifying DOM Elements:\n\nOnce we have\
    \ accessed DOM elements, we can modify their properties, attributes, and content\
    \ using JavaScript.\n\n```javascript\n// Example JavaScript\ntitleElement.innerHTML\
    \ = \"New Title\";\ncontentElements[0].style.color = \"red\";\nliElements[2].textContent\
    \ = \"Updated Item 3\";\nfirstLiElement.classList.add(\"active\");\n```\n\nIn\
    \ the above example, we modify the `innerHTML`, `style.color`, `textContent`,\
    \ and `classList` properties of various DOM elements.\n\n## Handling Events:\n\
    \nEvents are actions that occur on a web page, such as clicking a button, hovering\
    \ over an element, or submitting a form. JavaScript allows us to handle these\
    \ events and execute specific code when an event occurs.\n\n### Event Listeners:\n\
    \nWe can add event listeners to DOM elements to listen for specific events and\
    \ execute corresponding functions.\n\n```html\n<!-- Example HTML -->\n<button\
    \ id=\"btn\">Click Me</button>\n```\n\n```javascript\n// Example JavaScript\n\
    const buttonElement = document.getElementById(\"btn\");\n```\n\n```javascript\n\
    buttonElement.addEventListener(\"click\", function() {\n  console.log(\"Button\
    \ clicked!\");\n});\n```\n\nIn the above example, we add a click event listener\
    \ to the button element, and when the button is clicked, the specified function\
    \ is executed.\n\n### Common DOM Events:\n\nThere are many events available to\
    \ handle different interactions on a web page, including:\n\n- `click`: Occurs\
    \ when an element is clicked.\n- `mouseover`: Occurs when the mouse pointer is\
    \ over an element.\n- `mouseout`: Occurs when the mouse pointer leaves an element.\n\
    - `keyup`: Occurs when a key is released on the keyboard.\n- `submit`: Occurs\
    \ when a form is submitted.\n- `change`: Occurs when the value of an input element\
    \ is changed.\n\n```javascript\n// Example JavaScript\nconst inputElement = document.getElementById(\"\
    input\");\n\ninputElement.addEventListener(\"keyup\", function() {\n  console.log(\"\
    Input value changed!\");\n});\n```\n\nIn the above example, we add a `keyup` event\
    \ listener to an input element, and when a key is released in the input, the specified\
    \ function is executed.\n\n### Event Propagation: Bubbling and Capturing\n\nEvents\
    \ in the DOM follow a process called event propagation, which includes two phases:\
    \ capturing and bubbling. During the capturing phase, the event is triggered on\
    \ the ancestor elements before reaching the target element. During the bubbling\
    \ phase, the event is triggered on the target element and then propagated to its\
    \ ancestor elements.\n\n```html\n<!-- Example HTML -->\n<div id=\"outer\">\n \
    \ <div id=\"inner\">\n    Click Me\n  </div>\n</div>\n```\n\n```javascript\n//\
    \ Example JavaScript\nconst outerElement = document.getElementById(\"outer\");\n\
    const innerElement = document.getElementById(\"inner\");\n\nouterElement.addEventListener(\"\
    click\", function() {\n  console.log(\"Outer clicked!\");\n}, true);\n\ninnerElement.addEventListener(\"\
    click\", function() {\n  console.log(\"Inner clicked!\");\n});\n```\n\nIn the\
    \ above example, we have two nested `div` elements. We add a click event listener\
    \ to both elements, and the outer element listens during the capturing phase (`useCapture`\
    \ set to `true`). When we click on the inner element, the output will be:\n\n\
    Outer clicked!\n\nInner clicked!\n\n### Event Delegation:\n\nEvent delegation\
    \ is a technique where we add a single event listener to a parent element to handle\
    \ events for its child elements. It is useful when we have dynamically added elements\
    \ or a large number of elements.\n\n```html\n<!-- Example HTML -->\n<ul id=\"\
    list\">\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n```\n\
    \n```javascript\n// Example JavaScript\nconst listElement = document.getElementById(\"\
    list\");\n\nlistElement.addEventListener(\"click\", function(event) {\n  if (event.target.tagName\
    \ === \"LI\") {\n    console.log(\"Item clicked:\", event.target.textContent);\n\
    \  }\n});\n```\n\nIn the above example, we add a click event listener to the `ul`\
    \ element (parent). When we click on any of the `li` elements (children), the\
    \ output will be:\n\nItem clicked: Item 1\n\nItem clicked: Item 2\n\nItem clicked:\
    \ Item 3\n\n## Conclusion:\n\nIn this chapter, we explored DOM manipulation and\
    \ events in JavaScript. The DOM allows us to access, modify, and manipulate elements\
