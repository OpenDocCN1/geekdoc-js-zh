    # ## Ajax for Everyone


    Spry is a JavaScript-based framework that enables the rapid development of AJAX-powered
    web pages. Not a JavaScript guru? No problem. Spry was designed to feel like an
    extension of HTML and CSS, so with basic web-skills you can create next-generation
    web experiences by adding the power of Ajax to your projects.


    Spry can be used with any server-side technology (ColdFusion, PHP, ASP.Net etc.).
    By building the front-end of your web application with Spry you enable a more
    efficient workflow by keeping UI separated from back-end application logic.


    # ### Spry 1.6.1 - Ensuring Adobe AIR


    With Spry 1.6.1, the latest release of Spry, you''ll get features, samples and
    documentation that enable you to add Ajax to your pages without having to sacrifice
    adherence to web standards or best-practices. We have made changes to the framework
    to ensure that work well in the Adobe AIR space.


    *Figure 5.15 Adobe Spry''s framework is a mature AJAX library that is built into
    Adobe''s Dreamweaver web site*


    Adding Ajax, interaction controls such as validation, animation, and data control
    are very easy for nondevelopers. You can download the library at www.labs.adobe.com/technologies/spry/


    # ## YUI: Yahoo Interface Library


    Yahoo is well known for its Web services. They''re less well known for their work
    on Web standards and functionality. The YUI library is Yahoo''s set of Ajax tools
    you can use in your web site. You can find more information on the YUI tools at
    the Yahoo Developer Network at http://developer.yahoo.com/ (see Figure 5.16).


    # ## Controlling Forms with Wforms


    At some point you will want to control how users use forms in your web site. Form
    control controls elements as how users enter data into the forms, how fields are
    controlled by other elements on the page, and how to hide/show form elements depending
    on how your users enter data. These functions are all handled easily by Wforms
    (http://www.formassembly.com/wForms/). The library is small and well documented.'
