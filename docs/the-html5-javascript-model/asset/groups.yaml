- md: "\nelement on the screen, whether it is HTML, SVG, CSS, or CANVAS. This gives\
    \ you great control.\n\n## Taking JavaScript to the Next Level with Ajax\n\nThe\
    \ good news is that there is a lot of tools that break down the barrier to complex\
    \ development with JavaScript. You can download JavaScript libraries of code that\
    \ come prebuilt with functionality such as animation, form validation controls,\
    \ and data manipulation. These libraries are called Ajax libraries. Originally,\
    \ called AJAX (Asynchronous JavaScript and XML), the term has now been changed\
    \ to Ajax (note the lowercase letters) to allow support for a broader range of\
    \ technologies beyond just XML.\n\n## Using Ajax in Your Work\n\nAt the core,\
    \ Ajax is a set of well-written JavaScript programs that you can interact with.\
    \ Each Ajax library has slightly different ways in which you can use it. The following\
    \ example demonstrates how you can use the most popular Ajax library, jQuery,\
    \ in your web site.\n\nThere are hundreds of different Ajax libraries, but jQuery\
    \ is the one that is stepping above the crowd. The library itself is robust and\
    \ will work with all popular web browsers, including Microsoft's Internet Explorer.\
    \ The popularity of jQuery is so great that Microsoft is now supporting jQuery\
    \ as their default Ajax tool for ASP.NET. This means ASP.NET solution can integrate\
    \ with the jQuery Ajax library seamlessly.\n\nTo get jQuery you need to go to\
    \ www.jquery.com, as shown in Figure 5.13. You either download the latest jQuery\
    \ JavaScript library or simply connect it over the Internet. The following example\
    \ will connect jQuery from the Web. Start by creating an empty web page, as follows.\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\nIn the BODY section of the page, let's add some content.\n\n```html\n\
    <section id=\"container\">\n  <article class=\"article\">\n    <h1>A Christmas\
    \ Carol</h1>\n    <p class=\"thebody\">Marley was dead: to begin with. There is\
    \ no doubt whatever about that. The register of his burial was signed by the clergyman,\
    \ the clerk, the undertaker, and the chief mourner. Scrooge signed it. And Scrooge's\
    \ name was good upon 'Change', for anything he chose to put his hand to.</p>\n\
    \    <ul class=\"actions\">\n    </ul>\n  </article>\n  <article class=\"article\"\
    >\n    <h1>David Copperfield</h1>\n    <p class=\"thebody\">Whether I shall turn\
    \ out to be the hero of my own life, or whether that station will be held by anybody\
    \ else, these pages must show. I begin my life with the beginning of life, I record\
    \ that I was born (as I have been informed and believe) on a Friday, at twelve\
    \ o'clock at night. It was remarked that the clock began to strike, and I began\
    \ to cry, simultaneously.</p>\n    <ul class=\"actions\">\n    </ul>\n  </article>\n\
