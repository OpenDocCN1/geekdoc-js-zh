    \ By default, web browsers support the following objects:\n\n- String—this is\
    \ text\n- Date—allows you to use date and time\n- Array—allows you to build a\
    \ structured collection of data\n- Boolean—true or false\n- Math—allows you to\
    \ use mathematical operators\n- RegExp—allows you to use regular expressions to\
    \ define a pattern, such as social security number or phone number\n\nUsing these\
    \ objects enables you to create complex solutions. Do final solutions meet the\
    \ demands of desktop applications? Five years ago I would have said no; today,\
    \ it is extremely close and tomorrow's solutions will certainly outpace what you\
    \ can on the desktop.\n\n## Developing JavaScript for HTML5\n\nNew APIs in HTML5\
    \ can be programmatically interfaced with JavaScript. There are three APIs that\
    \ stand out:\n\n- Web Workers\n- LocalStorage\n- Geolocation-aware systems\n\n\
    Using JavaScript, you can interface with these new APIs to create new, Web-centric\
    \ solutions.\n\n## Using Web Workers\n\nJavaScript is a scripting solution that,\
    \ when runs, will execute the code by line. Many other development languages,\
    \ such as C# and Java, can have multiple processes running simultaneously. Web\
    \ Workers is a technology that can run JavaScript from sequential execution. You\
    \ can now run multiple scripts at once.\n\nThis is easily done in JavaScript.\
    \ In the following script you will declare a new variable, called myWebWorker,\
    \ as a new Web Workers file:\n\n```javascript\nvar myWebWorker = new Worker(\"\
    webWorker.js\");\n```\n\nThe example is loading a second script. In the JavaScript\
    \ JS file is a second script that triggers another, duplicate Web Workers to run.\
    \ The loop forces two programs to run at once. The JavaScript for webWorker.js\
    \ is as follows:\n\n```javascript\nvar results = [];\nfunction resultReceiver(event)\
    \ {\n  results.push(parseInt(event.data));\n  if (results.length == 2) {\n   \
    \ postMessage(results[0] + results[1]);\n  }\n}\n\nfunction errorReceiver(event)\
    \ {\n  throw event.data;\n}\n\nonmessage = function(event) {\n  var n = parseInt(event.data);\n\
    \  if (n == 0 || n == 1) {\n    postMessage(n);\n    return;\n  }\n\n  for (var\
    \ i = 1; i <= 2; i++) {\n    myWebWorker = new Worker(\"webWorker.js\");\n   \
    \ myWebWorker.onmessage = resultReceiver;\n    myWebWorker.onerror = errorReceiver;\n\
    \    myWebWorker.postMessage(n - i);\n  }\n}\n```\n\nThe \"for\" statement triggers\
    \ the same webWorker.js file to reload. The for script to run multiple times.\
    \ Your main HTML page you will add the following HTML and JavaScript to load the\
    \ Web Worker.\n\n```html\n<html>\n<title>Test threads fibonacci</title>\n<body>\n\
    <div id=\"result\"></div>\n<script language=\"javascript\">\nvar myWebWorker =\
    \ new Worker(\"webWorker.js\");\nmyWebWorker.onmessage = function(event) {\n \
    \ document.getElementById(\"result\").textContent = event.data;\n  dump(\"Got:\
    \ \" + event.data + \"\\n\");\n};\nmyWebWorker.onerror = function(event) {\n \
    \ dump(\"Web Worker error: \" + event.data + \"\\n\");\n  throw event.data;\n\
    }\n\nmyWebWorker.postMessage(\"Success, Web Workers are working\");\n</script>\n\
    </body>\n</html>\n```\n\nEnabling multiple JavaScripts to execute simultaneous\
    \ is essential for complex applications. There is a quick test you can take to\
    \ see massive numbers of JavaScript programs running. Go to www.Gmail.com and\
    \ log into Google's Web-based email service. The service will run a simple version\
