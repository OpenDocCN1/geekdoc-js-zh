    # # Taking JavaScript to the Next Level with Ajax


    The good news is that there is a lot of tools that break down the barrier to complex
    development with JavaScript. You can down-load JavaScript libraries of code that
    come prebuilt with functionality such as animation, form validation controls,
    and data manipulation. These libraries are called Ajax libraries. Originally,
    called AJAX (Asynchronous JavaScript and XML) the term has now been changed to
    Ajax (note the lowercase letters) to allow support for a broader range of technologies
    beyond just XML.


    # # Using Ajax in Your Work


    At the core, Ajax is a set of well-written JavaScript programs that you can interact
    with. Each Ajax library has slightly different ways in which you can use it. The
    following example demonstrates how you can use the most popular Ajax library,
    jQuery, in your web site.


    There are hundreds of different Ajax libraries, but jQuery is the one that is
    stepping above the crowd. The library itself is robust and will work with all
    popular web browsers, including Microsoft''s Internet Explorer. The popularity
    of jQuery is so great that Microsoft is now supporting jQuery as their default
    Ajax tool'
