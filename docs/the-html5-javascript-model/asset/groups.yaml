    \ 3.6 or Google's Chrome then you are presented with a jet-fueled alternative\
    \ loaded with JavaScript. The high-performance alternative requires that the browser\
    \ can support technologies such as Web Workers to process scripts simultaneously.\n\
    \n## Storing Data with LocalStorage\n\nKey to applications is the ability to store\
    \ data. In the past you have been able to do this using complex cookies or Ajax\
    \ commands that leverage the ability to send data to a database. The ability to\
    \ store data locally in your web browser is dramatically improved with the implementation\
    \ of LocalStorage.\n\nLocalStorage is essentially the ability to have an SQL-like\
    \ database running in your web browser. An example of LocalStorage being used\
    \ is Google's version of Gmail for the iPhone. Using LocalStorage, you can view\
    \ and send email without having a Web connection. The email is resynchronized\
    \ with the mail servers when a new network connection is established.\n\nYou access\
    \ LocalStorage in your JavaScript by using the GlobalStorage object. Figure 5.10\
    \ demonstrates LocalStorage used.\n\n![](img/1770128c4f0e28ca70b194a533659495_20_0.png)\n\
    \n> Figure 5.10 Data can be stored locally in web browsers using the LocalStorage\
    \ object.\n\nThe first step for the example in Figure 5.10 is to create an area\
    \ where you can type some text. You are going to use standard-form controls.\n\
    \n```html\n<textarea id=\"text\" class=\"freetext\">\n</textarea> Item name <input\
    \ id=\"item_name\" type=\"text\" value=\"new item\" />\n```\n\nAn event is going\
    \ to be added to the INPUT button to trigger the JavaScript to run:\n\n```html\n\
    <input onclick=\"writeLocal();\" type=\"button\" value=\"Save\"/>\n```\n\nThe\
    \ Local is going to post the data stored in the browser to the web page. An area\
    \ with the ID \"items\" is defined.\n\n```html\n<div id=\"items\"></div>\n```\n\
    \nThe first function run in your JavaScript is to define that the content on the\
    \ page is going to be associated with the web site your page is hosted on.\n\n\
    ```javascript\nfunction $(id) { return document.getElementById(id); }\nvar host\
    \ = location.hostname;\nvar myLocalStorage = globalStorage[host];\n```\n\nThe\
    \ second function allows you to store data using the LocalStorage API.\n\n```javascript\n\
    function writeLocal() {\nvar data = $('text').value;\nvar itemName = $('item_name').value;\n\
    myLocalStorage.setItem(itemName, data);\nupdateItemsList();\n}\n```\n\nAs any\
    \ SQL you will be able to delete entries. The following function allows you to\
    \ delete items using remove.\n\n```javascript\nfunction deleteLocal(itemName)\
    \ {\nmyLocalStorage.removeItem(itemName);\nupdateItemsList();\n}\n```\n\nThe following\
    \ sample shows you the whole program with some styling for presentation.\n\n```html\n\
    <html><head><title>HTML5 Web Storage</title></head>\n```\n\n```css\n<style>\n\
    .freetext {\n  width: 100%;overflow: hidden;\n  background: #FFE;font-family:\
