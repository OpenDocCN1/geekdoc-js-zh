    \ 34\n\n# HTML5 JavaScript 模型\n\nCSS、SVG 和视频都是 HTML5 的巨大改进。然而，HTML5 的作用不仅仅是添加一些视觉点缀，而是让开发者能够在网页浏览器中创建性能等同于桌面应用程序的程序。为了实现这一点，你需要一种能够赋予开发者创建复杂解决方案能力的开发语言。答案就是\
    \ JavaScript，世界上最流行的编程语言。\n\n目前的观点是 Web 应用程序并不像桌面应用程序那样强大。原因不在于 JavaScript，而是于你网页浏览器内部处理\
    \ JavaScript 的引擎。脚本处理得越快，你的应用程序就可以变得越复杂。\n\n在 2009 年，网页浏览器公司进行了一场跳跃式的游戏，试图重置速度基准。Firefox、Safari、Google\
    \ 和 Opera 同时进行。到年底，似乎唯一一家被留在黑暗中的公司是带有 Internet Explorer 8 器的微软。在 2009 年秋季 PDC\
    \ 上，微软展示了 IE 的早期开发者版本，它运行标准的 JavaScript 测试（例如 http://www2.webkit.org/perfs/sunspider-0.9/sunspider.html\
    \ 上的 SunSpider 测试），使其 JavaScript 引擎与竞争对手处于平级（见图 5.1）。\n\n本文的目标是回顾 JavaScript，包括它如何在\
    \ HTML5 中被使用、你如何通过 Ajax 在他人工作的基础上进行构建，以及如何将流行的 Ajax 库实现到你的工作中。\n\n![](img/1770128c4f0e28ca70b194a533659495_5_0.png)\n\
    \n## 理解 JavaScript\n\n本文的目标是向设计师展示如何将 JavaScript 配合 HTML5，为你的网页布局提供卓越的视觉控制。此外，HTML5\
    \ 正在扩展以支持应用程序编程接口 (API)，这些接口能够在你的网页内部实现复杂的系统集成。新的 API，如 Web Workers、地理位置和本地数据存储是复杂的，需要熟练使用\
    \ JavaScript 才能使其工作。\n\nJavaScript 不是一项新技术。JavaScript 的根源可以追溯到 1993 年，当时 Netscape\
    \ Communications 在其网页浏览器中包含了一种名为 LiveScript 的脚本技术。即使是能够在网页浏览器中实现交互的简单编程语言也变得极其流行。\n\
    \nJavaScript 的当前版本极大地完善了原始的 LiveScript 语言。与运行针对操作系统优化代码的桌面应用程序不同，JavaScript 必须在网页浏览器内部运行虚拟机翻译器中进行解释。这一过程本质上强制\
    \ JavaScript 解决方案的运行速度比桌面应用程序慢。为了补偿这一点，Google 使用了一种名为 V8 的技术极大改进了 JavaScript 代码的处理。竞争对手\
    \ Mozilla、Apple 和微软也有他们自己的 JavaScript 引擎来与 Google 的 V8 竞争。它们的引擎——Rhino (Firefox)\
    \ 和 SquirrelFish (Safari) 让应用程序非常接近桌面级。抱歉，微软没有为 JavaScript 引擎起一个酷的名字；他们只叫它 Chakra——不怎么性感。\n\
    \n今天的 JavaScript 允许你构建在网页浏览器中运行的类桌面应用程序。Google 的 Wave 解决方案是一个使用 JavaScript 的极其复杂的应用程序示例（图\
    \ 5.2）。\n\nJavaScript 是世界上最流行的语言，拥有数百万用户。这项技术学习起来并不复杂；如果你有任何 C#、Java 或 ActionScript\
    \ 的经验，可能会很快学会。\n\nJavaScript 如此流行，以至于它有自己的标准。Ecma International 是一家成立于 1961 年的行业协会，致力于信息和通信技术\
    \ (ICT) 以及消费电子 (EC) 的标准化。JavaScript 的标准化版本由 Ecma 管理。全称是 ECMA-262，但通常被称为 ECMAScript。ECMA-262\
    \ 是一个标准，并受到包括微软 Internet Explorer 在内的所有浏览的支持。\n\n![](img/1770128c4f0e28ca70b194a533659495_6_0.png)\n\
    \n图 5.2 复杂的 JavaScript 解决方案 Google 的 Wave。\n\n## 作为编程语言的 JavaScript\n\n幸运的是，作为编程语言，JavaScript\
    \ 学习起来并不复杂。当你读到本节结束时，你将理解编写基础程序需要什么。有两种方法可以将 JavaScript 插入到你的网页中：\n\n- 将你的 JavaScript\
    \ 直接插入到网页中两个 SCRIPT 元素之间。\n- 将你的 JavaScript 添加到文本文件中并将网页链接到该文本文件。\n\n为了开始，我们将在页面中使用\
    \ SCRIPT 元素来分离代码。稍后，你为为 创建单独的文件。以下是一个简单的 JavaScript 文件：\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\">\ndocument.write(\"Welcome to JavaScript\");\n\
    </script>\n</body>\n</html>\n```\n\n这是一个带有打开和关闭 HTML 元素的正常网页。在 BODY 元素中，你可以看到打开和关闭的\
    \ SCRIPT 元素。你将你的 JavaScript 代码放在 SCRIPT 元素中。\n\nSCRIPT 元素将默认使用 JavaScript 作为脚本语言。然而，不止一种脚本语言可以使用。JavaScript\
    \ 的替代方案是微软的 VBScript，它是脚本格式的 VB 语言。VBScript 由微软 Internet Explorer 原生支持。其他网页浏览器可以通过插件支持\
    \ JavaScript。\n\n这个示例 JavaScript 有一行代码：\n\n```javascript\ndocument.write(\"Welcome\
    \ to JavaScript\");\n```\n\n\"document\" 引用了一个对象。在这种情况下，document 对象是网页本身。\"write\"\
    \ 脚本是 document 对象的属性，允许你添加代码。图 5.3 显示了当你运行此脚本时你的页面看起来的样子。\n\nJavaScript 也可以放在页面的\
    \ HEAD 元素中，并由事件动作执行。事件动作由\n\n"
