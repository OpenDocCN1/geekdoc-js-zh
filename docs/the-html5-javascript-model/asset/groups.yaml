    # HTML5 JAVASCRIPT MODEL


    CSS, SVG, and Video are all great improvements to HTML5. The role for HTML5, however,
    is not to simply add eye-candy, but to enable developers to create applications
    in web browsers that are equal in performance to desktop applications. To accomplish
    this, you need a development language that gives developers the ability to create
    sophisticated solutions. The answer to this is JavaScript, the world''s most popular
    programming language.


    Currently, the belief is that web applications simply are not as powerful as desktop
    applications. The reason for this is not due to JavaScript, but the engines inside
    of your web browser that process JavaScript. The faster a script can be processed,
    the more sophisticated your applications can become.


    During 2009, web browser companies played a game of leap frog trying to reset
    speed benchmarks. Firefox, Safari, Google, and Opera played concurrently. Toward
    the end of the year it appeared that the only company that would be left in the
    dark was Microsoft with the Internet Explorer 8 browser. At the fall 2009 PDC
    Microsoft showed off an early developer version of IE running standard JavaScript
    tests (such as the SunSpider test at http://www2.webkit.org/perfs/sunspider-0.9/sunspider.html)
    that placed its JavaScript engine on par with its competitors (see Figure 5.1).


    The goal of this article is to review JavaScript, including how it is used in
    HTML5, how you can build upon the work of others through Ajax, and how to implement
    popular Ajax libraries into your work.


    ![](img/1770128c4f0e28ca70b194a533659495_5_0.png)


    ## Understanding JavaScript


    The goal of this article is to show how JavaScript can be used with HTML5 by a
    designer to give exceptional visual control to the layout of your web page. In
    addition, HTML5 is expanding to support application programming interfaces (APIs)
    that enable complex system integration inside your web pages. The new APIs, such
    as Web Workers, Geolocation, and local data storage, are complex and require sophisticated
    use of JavaScript to make them work.


    JavaScript is not a new technology. The roots of JavaScript go back to 1993 when
    Netscape Communications included a scripting technology called LiveScript in their
    web browser. Incorporating even a simple programming language that enables interactivity
    in the web browser became extremely popular.


    The current release of JavaScript has dramatically matured the original LiveScript
    language. Unlike desktop applications that run code optimized for an operating
    system, JavaScript must be interpreted within a virtual machine translator running
    inside of the web browser. This process inherently forces JavaScript solutions
    to run more slowly than desktop applications. To compensate for this, Google uses
    a technology called V8 that dramatically improves the processing of JavaScript
    code. Competitors Mozilla, Apple, and Microsoft also have their own JavaScript
    engines that compete with Google''s V8. Their engines—Rhino (Firefox) and SquirrelFish
    (Safari)—bring applications extremely close to desktop. Sorry, Microsoft does
    not have a cool name for the JavaScript engine; they just call it Chakra -not
    very sexy.


    Today''s JavaScript allows you to build desktop-like applications that run inside
    of your web browsers. Google''s Wave solution is an excellent example of a massively
    complex application that you are using JavaScript (Figure 5.2).


    JavaScript is the most popular language in the world, with millions of users.
    The technology is not too complex to learn; if you have any experience with C#,
    Java, or ActionScript, you will likely learn quickly.


    JavaScript is so popular that it has its own standard. Ecma International is an
    industry association founded in 1961 and dedicated to the standardization of information
    and communication technology (ICT) and consumer electronics (EC). The standardized
    version of JavaScript is managed by Ecma. The full name is ECMA-262, but is often
    referred to as ECMAScript. ECMA-262 is a standard and well supported by all browsers,
    including Microsoft''s Internet Explorer.


    ![](img/1770128c4f0e28ca70b194a533659495_6_0.png)


    Figure 5.2 Complex JavaScript solutions Google''s Wave.


    ## JavaScript as Programming Language


    Fortunately, as programming languages go, JavaScript is not too complicated to
    learn. By the time you get to the end of this section you will understand what
    is needed to write basic programs. There are two ways in which you can insert
    JavaScript into your web page:


    - Insert your JavaScript directly into your web page between two SCRIPT elements.

    - Add your JavaScript to a text file and link the web page to the text file.


    To get started, we will use SCRIPT elements on a page to separate the code. Later,
    you will create separate files for your JavaScript. Following is a simple JavaScript
    file:


    ```html

    <html>

    <body>

    <script type="text/javascript">

    document.write("Welcome to JavaScript");

    </script>

    </body>

    </html>

    ```


    This is a normal web page with opening and closing HTML elements. Within the BODY
    element you can see the opening and closing SCRIPT element. You place your JavaScript
    code within the SCRIPT element.


    The SCRIPT element will default to JavaScript as a scripting language. There is,
    however, more than one scripting language you can use. A alternative to JavaScript
    is Microsoft''s VBScript, a version of the VB language in script format. VBScript
    is natively supported by Microsoft''s Internet Explorer. Other web browsers can
    support JavaScript through a plug-in.


    This example JavaScript has one line of code:


    ```javascript

    document.write("Welcome to JavaScript");

    ```


    The "document" is referencing an object. In this case, the document object is
    the web page itself. The "write" script is property of the document object that
    allows you to add code. Figure 5.3 shows what your page will look like when you
    run this script.


    JavaScript can also be placed inside the HEAD element of a page and executed by
    an event action. Event actions are driven

