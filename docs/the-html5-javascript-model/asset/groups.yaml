    # Specific Objects You Can Use in JavaScript


    JavaScript can be extended further inside of the web browser through use of objects.
    JavaScript is an object-oriented programming (OOP) language in the same way that
    languages such as Java, C++, and C# are OOP. This means you can create and use
    objects. By default, web browsers support the following objects:


    +   * String—this is text

    * Date—allows you to use date and time

    * Array—allows you to build a structured collection of data

    * Boolean—true or false

    * Math—allows you to use mathematical operators

    * RegExp—allows you to use regular expressions to define a pattern, such as social
    security number or phone number


    Using these objects enables you to create complex solutions. Do final solutions
    meet the demands of desktop applications? Five years ago I would have said no;
    today, it is extremely close and tomorrow''s solutions will certainly outpace
    what you can on the desktop.


    # Developing JavaScript for HTML5


    New APIs in HTML5 can be programmatically interfaced with JavaScript. There are
    three APIs that stand out:


    +   * Web Workers

    * LocalStorage

    * Geolocation-aware systems


    Using JavaScript, you can interface with these new APIs to create new, Web-centric
    solutions.


