    >\ndocument.write(\"<p>My favorite color is \" + color + \"</p>\");\n</script>\n\
    ```\n\n名为 \"color\" 的变量被动态地添加到页面内容中。\n\n## 在脚本中使用数学运算\n\n变量也可以具有数学值（见图 5.7）。例如，以下两个变量可以用来创建第三个变量的值。\n\
    \n```html\n<html\n<head>\n<script type=\"text/javascript\" src=\"popup.js\"></script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"<h1>Welcome\
    \ to JavaScript</h1>\");\n</script>\n<a href=\"#\" onclick=\"popUpAlert()\">Click\
    \ me</a>\n</body>\n</html>\n```\n\n**图 5.6** 你可以将你的 JavaScript 添加到外部链接的文件。\n\n\
    ```javascript\n<script type=\"text/javascript\">\nvar myFirstNumber=4;\nvar mySecondNumber=3;\n\
    var myThirdNumber=myFirstNumber*mySecondNumber;\n</script>\n```\n\n![](img/1770128c4f0e28ca70b194a533659495_13_0.png)\n\
    \n你可以看到前两个变量相乘（`*` 是乘数值）以生成第三个变量。以下 JavaScript 在网页中展示了最终值：\n\n```javascript\n\
    document.write(\"<p>My favorite number is \" + myThirdNumber + \"</p>\");\n```\n\
    \nJavaScript 中有七种算术运算符可以使用：\n\n- + 加法\n- - 减法\n- * 乘法\n- / 除法\n- % 取模\n- ++ 递增\n\
    - -- 递减\n\n以下示例使用了所有七种运算符来演示你如何在代码中使用它们（另见图 5.8）。\n\n```html\n<html\n<head>\n\
    <script type=\"text/javascript\">\nvarNumber=7;\nvar varAddition=varNumber+3;\n\
    var varSubtraction=varNumber-3;\nvarMultiplication=varNumber*3;\n7+3=10\n7-3=4\n\
    7*3=21\n7/3=2.3333333333333335\n7%3=1\nIncrement 7=8\nDecrement 7=7\n```\n\n**图\
    \ 5.8** JavaScript 有七种不同的算术运算符，你可以它们来动态控制内容的值。\n\n```javascript\nvar varDivision=varNumber/3;\n\
    var varModulus=varNumber%3;\nvar varIncrement=++varNumber;\nvar varDecrement=--varNumber;\n\
    ```\n\n```html\n<script>\n</head>\n<body>\n<script type=\"text/javascript\">\n\
    document.write(\"<p>7+3=\"+varAddition+\"</p>\");\ndocument.write(\"<p>7-3=\"\
    +varSubtraction+\"</p>\");\ndocument.write(\"<p>7*3=\"+varMultiplication+\"</p>\"\
    );\ndocument.write(\"<p>7/3=\"+varDivision+\"</p>\");\ndocument.write(\"<p>7%3=\"\
    +varModulus+\"</p>\");\ndocument.write(\"<p>Increment 7=\"+varIncrement+\"</p>\"\
    );\ndocument.write(\"<p>Decrement 7=\"+varDecrement+\"</p>\");\n</script>\n</body>\n\
    </html>\n```\n\n## 使用运算符评估值\n\n除了算术运算符外，JavaScript 还有比较运算符，允许你取两个或多个值并比较它们的差异。有七种比较运算符：\n\
    \n- == 等于\n- === 严格相等\n- != 不等于\n- > 大于\n- < 小于\n- >= 大于等于\n- <= 小于等于\n\n比较运算符在你开始编写具有两个或多个结果的函数时非常有价值。\n\
    \n## 使用 If/Else 控制结果\n\n几乎所有编程语言通都会使用 `if/else` 语句。本质上，`if/else` 语句查找一个条件，并根据该值执行语句。例如，以下代码：\n\
    \n```html\n<script type=\"text/javascript\">\nvar myColor=\"red\"\nif (myColor==\"\
    red\")\n{\n  document.write(\"The correct color\");\n}\n</script>\n```\n\n名为 `myColor`\
    \ 的变量带有值为 \"red\" 的字符串。`if` 语句使用比较运算符 `==` 来查找值。如果精确相等，则在页面上打印 \"The correct color\"\
    。如果变量 `myColor` 变为 \"blue\"，则 `if` 语句将不会运行。如何使用 `else` 语句来显示第二种选择，如下：\n\n```html\n\
    <script type=\"text/javascript\">\nvar myColor=\"blue\"\nif (myColor==\"red\"\
    )\n{\n  document.write(\"The correct color\");\n}\nelse\n{\n  document.write(\"\
    This is not the color\");\n}\n</script>\n```\n\n`if/else` 语句可以有第三种条件。例如，允许你有两个正确答案（red\
    \ 和 blue），但当 `myColor` 的值变为任何其他值时，会打印第三个结果。\n\n```html\n<script type=\"text/javascript\"\
    >\nvar myColor=\"green\"\nif (myColor==\"red\")\n{\n  document.write(\"The correct\
    \ color\");\n}\nelse if (myColor==\"blue\")\n{\ndocument.write(\"This is a good\
    \ color\");\n}\nelse\n{\ndocument.write(\"The wrong color was chosen\");\n}\n\
    </script>\n```\n\n如果你有三个或更多有效选择，你将希望使用 `switch` 语句来匹配你的列表中的选择。让我们创建一个可以匹配不同选择的变量：\n\
    \n```javascript\nvar myColor=\"green\"\n```\n\n`switch` 语句现在可以查找 `myColor` 的条件并与可能的答案进行匹配。以下\
    \ `switch` 语句根据变量是 \"green\"、\"red\" 还是 \"blue\" 创建三种不同的答案。如果没有满足任何条件，将运行默认值。\n\
    \n```javascript\nswitch (myColor)\n{\ncase \"red\":\ndocument.write(\"You picked\
    \ red\");\nbreak;\ncase \"green\":\ndocument.write(\"You picked green\");\nbreak;\n\
    }\n```\n"
