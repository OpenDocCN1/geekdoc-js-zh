    # Storing Data with LocalStorage


    Key to applications is the ability to store data. In the past you have been able
    to do this using complex cookies or Ajax commands that leverage the ability to
    send data to a database. The ability to store data locally in your web browser
    is dramatically improved with the implementation of LocalStorage.


    LocalStorage is essentially the ability to have an SQL-like database running in
    your web browser. An example of LocalStorage being used is Google''s version of
    Gmail for the iPhone. Using LocalStorage, you can view and send email without
    having a Web connection. The email is resynchronized with the mail servers when
    a new network connection is established.


    You access LocalStorage in your JavaScript by using the GlobalStorage object.
    Figure 5.10 demonstrates LocalStorage used.


