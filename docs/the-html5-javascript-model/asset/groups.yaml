    with your web page. Coupling CSS, SVG, HTML, and all of the HTML5 family of tools
    together, you can create compelling web applications.


    # What You Have Learned


    Throughout this chapter you have learned how JavaScript, the programming language
    within HTML, is evolving to allow you to develop large, complex applications.
