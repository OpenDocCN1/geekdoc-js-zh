    # 你学到的知识


    在整个章节中，你学习了作为 HTML 内编程语言的 JavaScript 如何演进，以便你开发大型、复杂的应用程序。像 Google Gmail 这样的网站是
    Web 应用程序的极佳示例，它们的运行效率与桌面版本相当。你的下一步是下载一个 Ajax 库（例如 jQuery），并开始在 Web 上创建应用程序。


