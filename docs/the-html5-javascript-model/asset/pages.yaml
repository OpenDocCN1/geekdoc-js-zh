  md: "# Assessing Values Using Operators\n\nIn addition to mathematical operators,\
    \ JavaScript also has comparison operators that allow you to take two or more\
    \ values and compare the differences. There are seven comparison operators:\n\n\
    +   - == is equal to\n- === is exactly equal\n- != is not equal\n- > is greater\
    \ than\n- < is less than\n- >= is greater or equal to\n- <= is lesser or equal\
    \ to\n\nComparison operators become extremely valuable when you start to write\
    \ functions that have potentially two or more outcomes.\n\n# Controlling Outcomes\
    \ with If/Else and Switch Statements\n\nCommon to almost all programming languages\
    \ is the use of if/else statements. Essentially, the if/else statement looks for\
    \ a condition, and depending on the value, will execute a statement. Take for\
    \ instance the following code.\n\n```\n<script type=\"text/javascript\">\nvar\
    \ myColor=\"red\"\nif (myColor==\"red\")\n{\n  document.write(\"The correct color\"\
    );\n}\n</script>\n```\n\nA variable called myColor is created with a string value\
    \ of \"red\". The script uses an \"if\" statement to look for a value using the\
    \ comparison operator, ==. If the exact value is met then the text \"The correct\
    \ color\" is printed on the page.\\ If the variable myColor is changed to \"blue\"\
    , then the \"if\" statement will not run. To show how you can use an \"else\"\
    \ statement to show a second option, as follows.\n\n```\n<script type=\"text/javascript\"\
    >\nvar myColor=\"blue\"\nif (myColor==\"red\")\n{\n  document.write(\"The correct\
    \ color\");\n}\n</script>\n```"
