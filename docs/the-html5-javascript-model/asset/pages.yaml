  md: '# JavaScript as Programming Language


    Fortunately, as programming languages go, JavaScript is not too

    plicated to learn. By the time you get to the end of this sec-

    tion you will understand what is needed to write basic programs.

    There are two ways in which you can insert JavaScript into your

    web page:


    +   - Insert your JavaScript directly into your web page between

    two SCRIPT elements.

    - Add your JavaScript to a text file and link the web page to

    the text file.


    To get started, we will use SCRIPT elements on a page to

    separate the code. Later, you will create separate files for your

    JavaScript. Following is a simple JavaScript file:


    ```

    <html>

    <body>

    <script type="text/javascript">

    document.write("Welcome to JavaScript");

    </script>

    </body>

    </html>

    ```


    This is a normal web page with opening and closing HTML

    elements. Within the BODY element you can see the opening and

    closing SCRIPT element. You place your JavaScript code within

    the SCRIPT element.


    The SCRIPT element will default to JavaScript as a script-

    ing language. There is, however, more than one scripting

    language you can use. A alternative to JavaScript is

    Microsoft''s VBScript, a version of the VB language in script

    format. VBScript is natively supported by Microsoft''s Internet

    Explorer. Other web browsers can support JavaScript through a

    plug-in.


    This example JavaScript has one line of code:


    ```

    document.write("Welcome to JavaScript");

    ```


    The "document" is referencing an object. In this case, the

    document object is the web page itself. The "write" script is

    property of the document object that allows you to add code.

    Figure 5.3 shows what your page will look like when you run this

    script.


    JavaScript can also be placed inside the HEAD element of a

    page and executed by an event action. Event actions are driven'
