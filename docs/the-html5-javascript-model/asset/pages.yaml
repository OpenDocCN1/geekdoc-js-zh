    # # Understanding JavaScript


    The goal of this article is to show how JavaScript can be used with HTML5 by a
    designer to give exceptional visual control to the layout of your web page. In
    addition, HTML5 is expanding to support application programming interfaces (APIs)
    that enable complex system integration inside your web pages. The new APIs, such
    as Web Workers, Geolocation, and local data storage, are complex and require sophisticated
    use of JavaScript to make them work.


    JavaScript is not a new technology. The roots of JavaScript go back to 1993 when
    Netscape Communications included a scripting technology called LiveScript in their
    web browser. Incorporating even a simple programming language that enables interactivity
    in the web browser became extremely popular.


    The current release of JavaScript has dramatically matured the original LiveScript
    language. Unlike desktop applications that run code optimized for an operating
    system, JavaScript must be interpreted within a virtual machine translator running
    inside of the web browser. This process inherently forces'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'JavaScript solutions to run more slowly than desktop applications. To compensate
    for this, Google uses a technology called V8 that dramatically improves the processing
    of JavaScript code. Competitors Mozilla, Apple, and Microsoft also have their
    own JavaScript engines that compete with Google''s V8. Their engines—Rhino (Firefox)
    and SquirrelFish (Safari)—bring applications extremely close to desktop. Sorry,
    Microsoft does not have a cool name for the JavaScript engine; they just call
    it -not very sexy.


    Today''s JavaScript allows you to build desktop-like applications that run inside
    of your web browsers. Google''s Wave solution is an excellent example of a massively
    complex application that you are using JavaScript (Figure 5.2).


    JavaScript is the most popular language in the world, with millions of users.
    The technology is not too complex to learn; if you have any experience with C#,
    Java, or ActionScript, you will likely learn quickly.


    JavaScript is so popular that it has its own standard. Ecma International is an
    industry association founded in 1961 and dedicated to the standardization of information
    and communication technology (ICT) and consumer electronics (EC). The standardized
    version of JavaScript is managed by Ecma. The full name is ECMA-262, but is often
    referred to as ECMAScript ECMA-262 is a standard and well supported by all browsers,
    including Microsoft''s Internet Explorer.


    ![](img/1770128c4f0e28ca70b194a533659495_6_0.png)


    Figure 5.2 Complex JavaScript solutions Google''s Wave.'
