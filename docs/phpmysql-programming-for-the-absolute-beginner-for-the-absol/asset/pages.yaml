  md: '# Summary


    In this chapter you have learned some incredibly important concepts. You learned
    what variables are, and how to create them in PHP. You''ve learned how to connect
    a form to a PHP program with modifications to the form''s method and action attributes.
    You learned how to write normal links to send values to server-side scripts. You''ve
    built programs that respond to various kinds of input elements, including drop-down
    lists, radio buttons, and list boxes. You''ve gone through the process of of writing
    a program from beginning to end, including the critical planning stage, creating
    a form for user input, and using that input to generate interesting output.


    +   1. Write a Web page that asks the user for first and last name, then uses
    a PHP script to write a form letter to that person. Inform the he or she might
    be a millionaire.


    +   2. Write a custom Web page that uses the “embedded data” tricks described
    in this chapter to generate custom links for your favorite Web searches, local
    news and weather, and other elements of interest to you.


    +   3. Write your own story game. Find or write some text to modify, create an
    appropriate input form, and output the story with a PHP script.'
