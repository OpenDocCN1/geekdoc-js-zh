  md: '# IN THE REAL WORLD


    If all this “associative array” talk is making you dizzy, don’t panic. It’s actually
    just a new name for something you’re very familiar with. Think about the way HTML
    attributes work. Each tag has a number of attributes you can use in any order.
    For example, a standard button might look like this:


    ```

    <input type = "button"

    value = "Save the world.">

    ```


    This button has two attributes. Each attribute is made up of a name/value pair.
    The keywords “type” and “value” are names (or indices, or keys, depending on how
    you want to think of it) “button” and “Save the world.” are the values associated
    with those names. CSS uses a different syntax for exactly the same idea.

    The CSS element


    ```

    p (background-color:red;

    font-size:14pt)

    ```


    indicates a series of modifications to the paragraph tag. While the syntax is
    different, the same pattern applies. The critical part of a CSS definition is
    a list of name/value pairs.


    There’s one more place associative arrays naturally pop up. As information comes
    into your program from an HTML form, it comes in as an associative array. The
    name of each element becomes an index, and the value of that element is translated
    to the value of the array element. Later in this chapter you’ll see how you can
    take advantage of this.


    An associative array is simply a data structure used when the name/value-relationship
    is the easiest way to work with some kind of data.


    ```

    print "Alaska: \*"

    print \$stateCap["Alaska"];

    print "<br><br>"

    ```


    Once again, note that the index of the array is a quoted string. The associative
    form is terrific for data like the state capital information. In essence, it lets
    you “look up” the capital city if you know the state name.'
