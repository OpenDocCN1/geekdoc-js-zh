  md: "# Creating a Table\n\nTo create a table, you must indicate the name of the\
    \ table as well as each field in the table. For each field, you must list what\
    \ type of data is held in the field, and (at least for text data) how many characters\
    \ the field will be. As an example, the following code creates the phoneList table:\n\
    \n```\nCREATE TABLE phoneList (\n  id PRIMARY KEY,\n  firstName VARCHAR(15),\n\
    \  lastName VARCHAR(15),\n  email VARCHAR(20),\n  phone VARCHAR(15)\n);\n```\n\
    \nYou can think of fields as being much like variables, while PHP is easy-going\
    \ about what type of data is in a variable, SQL is very picky about the type of\
    \ data in fields. In order to create an efficient database, MySQL needs to know\
    \ exactly how many bytes of memory to set aside for every single field in the\
    \ database. The primary way it does this is to require the database designer to\
    \ specify the type and size of every field in each table. Table 7.2 lists a few\
    \ of the primary data types supported by MySQL.\n\n| Data type | Description |\n\
    |---|---|n| INT | Standard integer +/- 2 billion (roughly) |\n| BIGINT | Big integer\
    \ +/- 9 x 10^18 |\n| FLOAT | Floating point decimal number 308 digits |\n| DOUBLE\
    \ | Double precision floating point 308 digits |\n| CHAR(n) | text with n digits.\
    \ If actual value is less than n, field will be padded with trailing spaces |\n\
    | VARCHAR(n) | Text with n digits. Trailing spaces will automatically be culled\
    \ |\n| DATE | Date in YYYY-MM-DD format |\n| TIME | Time in HH:MM:SS format |\n\
    | YEAR | Year in YYYY format |"
  merge: -1
  pgno: 296
- img_proc: true
  md: '# TRICK


    ![](img/f7bb260ce17b9d585cf5f10f69134213_297_0.png)


    While the data types listed in Table 7.2 are by far the most commonly used, MySQL
    supports many other data types as well. Look in the online help that ships with
    MySQL if you need a more specific data type. Other databases will have a very
    similar list of data types.


    You might notice it that it is not necessary to specify the length of numeric
    types (although you can determine a maximum size for numeric types as well as
    the number of digits you want stored in float and double fields). The storage
    requirements for numeric variables are based on the type itself.


    # Working with String Data in MySQL


    Text values are usually stored in VARCHAR fields. These fields must include the
    number of characters allocated for the field. Both CHAR and VARCHAR fields have
    fixed lengths. The primary difference between them is what happens when the field
    contains a value shorter than the specified. If you declare a CHAR field to have
    a length of 10


    ```

    firstName VARCHAR(10);

    ```


    and then later store the value ''Andy'' into the field, the field will actually
    contain ''Andy'' (that is, Andy followed by six spaces). CHAR fields pad any remaining
    characters with spaces. The VARCHAR field type removes padded spaces. Usually
    you will use the VARCHAR field to store all your string data.


    # DETERMINING THE LENGTH OF A VARCHAR FIELD


    Data design is both a science and an art. Determining the appropriate length for
    your text fields is one of the oldest problems in data.


    If you don''t allocate enough room for your text data, you can cause a lot of
    problems for your users. I once taught a course called CLT SD WEB PRG that held
    the course names didn''t have enough room for the actual name of the course (Client-Side
    Web Programming). My students renamed it the "Buy a Vowel!" course.


    However, you can''t simply make every text field a thousand characters long, because
    this would be wasteful of system resources. If you have a field that will contain
    only five characters and you allocate one hundred characters, you will still require
    room on the drive for the extra 95 characters. If your database has thousands
    of entries, this can be a substantial cost in drive space. In a distributed environment,
    you''ll also have to wait for those unnecessary spaces to come across limited
    bandwidth. It takes experimentation and practice to determine the appropriate
    width for your string fields. You will need to test your application with real
    users before you can be sure you''ve made the right decision.'
  merge: -1
