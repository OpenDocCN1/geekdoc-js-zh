    # Creating Multi-Line Strings


    You''ll frequently find yourself wanting to print several lines of HTML code at
    once. It can be very tedious to use quote signs to indicate these strings (especially
    because HTML, also uses the quote symbol). PHP provides a special quoting mechanism,
    which is perfect for this type of situation. The line


    ```

    $verse = <<<HERE

    ```


    begins assigning a value to the $verse variable. The <<<HERE segment indicates
    this will be a special multi-line string that will end with the symbol "HERE."
    You can use'
  merge: -1
