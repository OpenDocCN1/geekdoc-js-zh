- img_proc: true
  md: 'mysql_connect() function returns an integer referring to the database connection.
    You can think of this identifier much like the file pointers you learned in Chapter
    6 "Working with Files." The data connection should be stored in a variable (I
    usually use something like $conn) because many of the other database functions
    will need to access the connection.


    # Choosing a Database


    A data connection can have a number of databases connected to it. The mysql_set_db()
    function lets you choose a database. It works just like the USE command in SQL.
    The mysql_set_db() function requires the name of a database and a data connection.
    This function returns the value FALSE if it was unable to connect to the specified
    database.


    # Creating a Query


    Creating a query is very easy. The relevant code from showHero.php is reproduced
    here:


    ```

    //create a query

    $sql = "SELECT * FROM hero";

    $result = mysql_query($sql, $conn);

    ```


    You begin by placing SQL code inside a variable.


    > TRAP When you entered SQL commands into the SQL console or SQLyog, the commands
    required a semicolon. When your PHP program sends a command to the DBMS, the semicolon
    will automatically be added, so you should not end your SQL commands with semicolons.
    Of course, you''ll be assigning these commands within a line of PHP code, which
    still has its own semicolon. (Sheesh!)


    The mysql_query() function allows you to pass an SQL command through a connection
    to a database. You can send any SQL command to the database with mysql_query(),
    including table creation statements, updates, and queries. It returns a special
    element called a result set. If the SQL command was a query, the result variable
    will hold a pointer to the data, which we''ll take apart in the next step. If
    it''s a data definition command (the commands used to create, and modify tables)
    the result object will usually contain the string related to the success or failure
    of the operation.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_328_0.png)'
