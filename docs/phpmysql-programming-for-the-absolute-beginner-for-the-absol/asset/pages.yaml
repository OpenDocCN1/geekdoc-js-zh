    ![](img/f7bb260ce17b9d585cf5f10f69134213_383_0.png)


    Proper SQL syntax is extremely important when you store SQL syntax inside an SQL
    database as I''m doing here. It''s especially important to keep track of single
    and double quotes. To include the single quotes that some queries require, you''ll
    need to precede the quote with a backslash character. For example, if I want to
    store the following query:


    ```

    SELECT * FROM agent WHERE agent.name = ''Bond''

    ```


    I would actually store this text instead:


    ```

    SELECT * FROM agent WHERE agent.name = ''\Bond\''

    ```


    This is necessary in order to store the single quote characters. Otherwise they
    will be interpreted incorrectly. I''ll show you how to remove the backslash characters
    at the appropriate time.


