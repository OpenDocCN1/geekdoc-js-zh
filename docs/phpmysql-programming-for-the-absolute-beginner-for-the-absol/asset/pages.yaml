  md: "Even though PHP is good-natured about letting you create an array on the fly,\
    \ you might get a warning about this behavior on some Web servers (those that\
    \ have error reporting set to E_ALL). If that's the case, you can create an empty\
    \ array with the array() function described in the following sections and then\
    \ add values to it.\n\n# Using a Loop to Examine an Array's Contents\n\nArrays\
    \ go naturally with loops. Very often when you have an array variable, you'll\
    \ want to step through all of its values and do something to each one. In this\
    \ example, I want to print out the index and the corresponding country's name.\
    \ Here's the for loop that performs this task:\n\n```\n// output array values\n\
    \nprint \"<h1>Top Camel Populations in the World</h1>\\n\";\n\nfor ($i = 1; $i\
    \ <= 5; $i++) {\n    print \"$i:$camelPop[$i]<br>\\n\";\n}\n// end loop\n```\n\
    \nBecause I know the index vary between 1 and 5 (inclusive), I set up my loop\
    \ so the value of $i will go from 1 to 5. Inside the loop, I simply print out\
    \ the index ($i) and the corresponding country ($camelPop[$i]). The first time\
    \ through the loop, $i will be 1, so $camelPop[$i] is \"Somalia.\" Each time through\
    \ the loop, the value of $i will be incremented, so eventually every element of\
    \ the array will be displayed.\n\nThe advantage of combining loops and arrays\
    \ is convenience. If you want to do something with each element of an array, you\
    \ only have to write the code one time, then put that code inside a loop. This\
    \ is especially powerful when you start to design programs that work with large\
    \ amounts of data. If, for example, I wanted to list the camel population of every\
    \ country in the UN database rather than simply the top five countries, all I\
    \ would have to make a bigger array and modify the for loop.\n\n# Using the array()\
    \ Function to Pre-Load an Array\n\nOften you'll start knowing exactly which values\
    \ you want to place in an array. PHP provides a shortcut for loading an array\
    \ with a set of values.\n\n```\n// use array function to load up array\n$binary\
    \ = array(\"000\", \"001\", \"010\", \"011\");\n```"
