  md: '# Examining the Results


    There are three distinct types of text on this page. First, the “Hello in PHP”
    line is ordinary HTML. I wrote it just like a regular HTML page, and it was displayed
    just like regular HTML. The “Hello world” line is a little different though, because
    it was written by the PHP program embedded in the page. The rest of the page is
    a bit mysterious. It contains a lot of information about the PHP engine being
    used. It also stretches on several pages. All that code was generated by the phpinfo()
    command. This command is used to display information about the PHP installation.
    It''s not important to understand all the information displayed by the phpinfo()
    command. It''s much more critical to appreciate that when the user requests hello.html
    Web page, the text of the page is first run through the PHP interpreter. This
    program scans for any PHP commands, executes the commands, and prints HTML code
    in place of the original commands. By the time a page gets to the user, all the
    PHP code is gone, because the server used the PHP to generate HTML code. From
    proof of this, your browser at hello.pnp and then view the source code. It will
    look something like this:


