  md: '# no experience required

    to Learn


    # PHP/MySQL

    Programming


    if you are new to programming with PHP and MySQL and are looking for a solid introduction,
    this is the book for you. Developed by computer science instructors, books in
    the for absolute beginner series teaches the principles of programming through
    simple game creation. You will acquire the skills that you need for more practical
    programming applications and will learn how these skills can be put to use in
    real-world scenarios. Best of all, by the time you finish this book you will be
    able to apply the basic principles you''ve learned to the next programming language
    you tackle.


    Create simple games while you learn to program with PHP and MySQL


    With the instructions in this book, you''ll learn to:


    +   - Use MySQL to create databases

    - Master variables and input

    - Connect to databases within PHP

    - Control your code with conditions and functions

    - Build a three-tiered data application


    Premier Press

    A division of Course Technology

    www.prepressbooks.com

    Category: Programming

    U.S. $29.99 Can. $46.95


    # What''s on the CD


    +   - PHP, MySQL, and Apache for Windows

    - PHPTriad installer

    - PHP Coder

    - Emacs for Windows

    - SQLYog graphical tool

    - The GIMP for Windows

    - IrfanView graphic viewer

    - Dia for Windows

    - All source code from the book


    Andy Harris: began teaching his career as a high school special education teacher.
    He began teaching at the university level in the late 1980s. In 1995, he became
    a full-time teacher at the Computer Science Department of Indiana University/Purdue
    University-Indianapolis. He manages the IUPUI Systems Lab and teaches classes
    in several programming languages.


