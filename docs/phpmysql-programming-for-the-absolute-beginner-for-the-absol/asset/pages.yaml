  md: '# About the Author


    Andy Harris began his teaching career as a high school special education teacher.
    During that time, he taught himself enough computing to do part-time computer
    consulting and database work. He began teaching computing at the university level
    in the late 1980s as a part-time job. Since 1995 he has been a full-time lecturer
    in the Computer Science Department of Indiana University/Purdue University—Indianapolis,
    where he manages the Streaming Media Lab and teaches classes in several programming
    languages. His primary interests are Java, Microsoft languages, Perl, JavaScript,
    PHP, Web Data, virtual reality, portable devices, and streaming media.'
