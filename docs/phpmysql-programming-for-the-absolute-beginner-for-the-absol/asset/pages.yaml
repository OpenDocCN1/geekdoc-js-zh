    Note that I showed only a small part of the code generated by the phpinfo() command,
    and that the details of the code might be different when you run the program on
    your own machine. The key point is that the PHP code to write "Hello World!" (print
    "Hello World!") is replaced with the actual text "Hello World!" More significantly,
    the very phpinfo() command is replaced by a huge amount of HTML code.


    A small amount of PHP code can efficiently generate large and complex HTML documents.
    This is one significant advantage of PHP. Also, by the time document gets to the
    Web browser, it''s plain vanilla HTML code, which can be read easily by any browser.
    These two features are important benefits of server-side programming in general,
    and of PHP programming in particular. As you progress through this book, you will
    learn about many more commands for producing interesting HTML, but the basic concept
    is always the same. Your PHP program is simply contains special PHP markup. The
    PHP code is examined by a special program on the server, and the results are embedded
    into the Web page before it is sent to the user.


