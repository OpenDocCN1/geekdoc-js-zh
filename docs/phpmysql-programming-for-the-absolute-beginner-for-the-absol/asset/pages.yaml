  md: "The master file is opened with read access. The first three lines are unimportant,\
    \ but I must still read them in to get to the quiz data.\n\n# Creating an Answer\
    \ Key\n\nI start by generating an answer key from the master file. I'll step through\
    \ each question in the file, and extract all the normal variables from it (although\
    \ I'm really interested in is the $correct variable). I store the value of $correct\
    \ into an array called $key. At the end of this loop, the $key array will hold\
    \ the correct answer for each question in the quiz.\n\n```\n//step through the\
    \ questions building an answer key\n$numCorrect = 0;\n$questionNumber = 1;\nwhile\
    \ (!eof($msf)){\n  $currentProblem = fgets($msf);\n\n  list($question, $answerA,\
    \ $answerB, $answerC, $answerD, $correct) = split(\":\", $currentProblem);\n \
    \ $key[$questionNumber] = $correct;\n\n  $questionNumber++;\n} // end while\n\
    fclose($msf);\n```\n\n# Checking the User's Response\n\nThe user's responses will\
    \ come from the HTML form as an array called $quest. The correct answers are in\
    \ an array called $key. To grade the test, I can simply step through both arrays\
    \ at the same time, comparing the user's response with the correct response. Each\
    \ time these values are the same, the user has gotten an answer correct. When\
    \ the values are not the same, the user was incorrect (or there was a problem\
    \ with the test itself-don't discount that as a possibility).\n\n```\n//Check\
    \ each answer from user\nfor ($questionNumber =1; $questionNumber <= count($quest);\
    \ $questionNumber++){\n  $guess = $quest[$questionNumber];\n  $correct = $key[$questionNumber];\n\
    \  $correct = rtrim($correct);\n```"
