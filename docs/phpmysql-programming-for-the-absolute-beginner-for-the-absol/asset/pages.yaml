- img_proc: true
  md: 'analyzing the results of quizzes. In each of these cases, the user will have
    a particular quiz in mind, so the control panel automatically provides a list
    of appropriate files in each segment. Also, each of these tasks requires a password,
    to provide at least some level of security.


    The main part of the `QuizMachine.php` program sets up the opening HTML and calls
    a series of functions, which will actually do all the real work.


    ```

