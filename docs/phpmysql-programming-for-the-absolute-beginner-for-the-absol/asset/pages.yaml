    # Clearing the Board


    The word search uses a crude but effective technique to generate legal game boards.
    It creates random boards repeatedly until it finds one that is legal. While this
    may seem like a wasteful approach, it is much easier to program than many more
    sophisticated attempts, and produces remarkably good results for simple problems
    such as the word search puzzle.


    # IN THE REAL WORLD


    Although this program use a "brute force" approach to find a good solution, you’ll
    see a number of ways the code is optimized to make a good solution more like.
    Example of what you’ve seen is already the game program stops if one of the words
    is too long to fit in the puzzle. This prevents a long processing time while the
    program tries to fit a word in the puzzle when it cannot be. As you go through
    the code, you’ll see a number of places where I do some work to steer the algorithm
    towards good solutions and away from pitfalls. Because of these efforts, you’ll
    find that the program is actually pretty good at finding search puzzles unless
    there are too many words or the game board is too small.


    The game board will often be re-created several times during one execution. I
    needed a function that could initialize the game board or clean it out easily.
    The game board is stored in a two-dimensional array called $board. The board is
    "empty," each cell will contain the period (.) character. I chose this convention
    because it would still give me something visible in each cell, and give a character
    that represents an empty cell. The clearBoard() function sets or resets the $board
    array that contains a period in every cell.


