- img_proc: true
  md: 'any phrase you wish, but I generally use the word HERE because I think of the
    three less than symbols as “up to.” In other words, you can think of


    ```

    $verse = <<<HERE

    ```


    as meaning “verse gets everything up HERE."


    You can also think of <<<HERE as a special quote sign, which is ended with the
    value HERE.


    You can write as much text as you wish between <<<HERE and HERE. You can put variables
    inside the special text, and PHP will replace the variable with its value, just
    like in ordinary (quoted) strings. The ending phrase (HERE) must be on a line
    by itself, and there must be no leading spaces in front of it.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_73_0.png)


    You might wonder why the $verse = <<<HERE line doesn’t have a semicolon after
    it. Although this is on one line in the editor, it begins a multi-line structure.
    Technically, everything from that line to the end of HERE; is part of the same
    line, even though the code takes up several lines in the editor. Everything <<<HERE
    and HERE is a string value. The semicolon doesn’t have any special meaning inside
    a string. If this doesn’t make sense to you, don’t worry about it now, as you’ll
    get some other characters to think about this concept later. As a minimum, you’ll
    know that a line beginning a multi-line quote doesn’t need a semicolon, but the
    line at the end of the quotes.


    Once the multi-line string is built, it is very easy to use. It’s actually harder
    to write the captions for the three verses than the verses themselves. The print
    statement simply places the value of the $verse variable in the appropriate spots
    of the output HTML.


    # Working with Numeric Variables


    Computers ultimately store information in on/off impulses. These very simple data
    values can be converted into a number of more convenient kinds of information.
    The PHP language makes most of this invisible to you, but it’s still important
    to know that string (text) is handled differently in memory than numeric values,
    and there are two main types of numeric values.


    # Making the ThreePlusFive Program


    As an example of how PHP works with numbers, consider the ThreePlusFive.php program
    illustrated in Figure 2.6.'
