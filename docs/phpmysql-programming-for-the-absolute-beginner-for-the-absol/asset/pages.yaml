    \ understanding of the functions in the library, where each function expects as\
    \ input, and what it will produce as output. Although there is a good amount of\
    \ code in this library (over 500 lines, fact), there is almost nothing in the\
    \ code you haven't seen before. It's worth it to look carefully at this code because\
    \ it can give you a good idea of how to create your own libraries. You'll also\
    \ find there's no better way to understand the library than to dig around the\
    \ hood.\n\n# Setting a CSS style\n\nSome of the simplest elements have profound\
    \ effects. One example of this maxim is the storage of a CSS style in the library\
    \ code. Each program in the system will operate using the style specified in the\
    \ library. This means you can easily change the look and feel of the entire system\
    \ by manipulating one <style></style> block.\n\n```\n<style type=\"text/css\"\
    >\nbody{\n  background-color: black;\n  color: white;\n  text-align:center;\n\
    }\n</style>\n```\n\n> Remember, when you include a file, it is interpreted as\
