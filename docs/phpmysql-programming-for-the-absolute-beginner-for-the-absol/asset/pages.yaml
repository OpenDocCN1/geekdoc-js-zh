- img_proc: true
  md: 'Each unique instruction is expected to end with a semicolon. You''ll end most
    lines of PHP code with a semicolon. If you forget to do this, you''ll get an error
    that looks like Figure 2.4.


    If you see this particular message, look back at your code to ensure you''ve remembered
    to add a semicolon at the end of the line.


    There will be times when an instruction is longer than a single line on the editor.
    The semicolon goes at the end of the instruction, which often (but not always)
    responds with the end of the line.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_70_0.png)


    ```

    http://127.0.0.1/phab/php/hijacobadd.php

    File Edit View Favorites Tools Help

    Go Back Refresh Search Favorites Media

    Address http://127.0.0.1/phab/php/hijacobadd.php Go URL


    Parse error: parse error, unexpected T_PRINT in cprogram files/apache group/apache/htdocs/phab/ph02

    hijacobadd.php on line 14


    Done Internet

    ```


    ![](img/f7bb260ce17b9d585cf5f10f69134213_70_1.png)


    This error will occur if you forget to add a semicolon to the end of every line.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_70_2.png)


    Don''t panic if you get an error message or two. They are a completely normal
    part of programming. Even experienced programmers expect to see many error messages
    while building and testing programs. Usually the resulting error code gives you
    important clues about what went wrong. Make sure you look carefully at whatever
    line of the error message reports. Although the error isn''t always on that line,
    you can often get a hint about what went wrong by examining that line closely.
    In many cases (particularly a missing semicolon), a syntax error will indicate
    an error on the line that actually follows the real problem. If you get a syntax
    error on line 14, and the problem is a missing semicolon, the problem line is
    actually line 13.'
