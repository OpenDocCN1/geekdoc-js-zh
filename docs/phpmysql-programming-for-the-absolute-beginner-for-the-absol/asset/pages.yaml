    # Editing a Test


    For simplicity''s sake I decided on a very simple test format. The first three
    lines of the test file will contain the test''s name, the instructor''s e-mail
    address, and a password for the test. The test data itself will follow. Each problem
    will take up one line (although it can wrap freely—a line is defined by a carriage
    return character). The problem will have a question followed by four possible
    answers and the correct answer. Each of these elements be separated by the colon
    (:) character.


    > If you think there are too many rules for how the questions are formatted, I
    agree. This is a limitation of the sequential access technique we are using to
    store the data in this chapter. In later chapters, you will learn other ways to
    work with data that aren''t quite so picky. However, this is a relatively easy
    way to store your data, so I wrote the program to assist the process as much as
    practical. In general, you''ll want to write your program so the user never has
    to know the underlying data structure.


    The editQuiz.php program is designed to assist the user in creating and editing
    quizzes. It''s a very simple program, because the real work will happen after
    the user is finished editing and presses the Submit button.


