  md: 'some questions, responds to these inputs, and continues interacting with the
    user until the Web somehow indicates an interest in leaving the program. Programs
    written on a Web server are different. The PHP programs you are writing have an
    incredibly short life span. When the user makes a request to your PHP program
    through a Web browser, the server runs the PHP interpreter (the program that converts
    your PHP code into the underlying machine language your server understands). The
    result of the program is a Web page that is sent back to the user’s browser. Once
    your program sends a page to a user, the PHP program shuts down because its work
    is done. Web servers do not maintain contact Each request is seen as an entirely
    new transaction. The poker dice program featured at the beginning of this chapter
    appears to interact with the user indefinitely. Actually, the same program is
    being called repeatedly. The program acts differently in different circumstances.
    How it needs to keep track of what state it''s currently in.


    # IN THE REAL WORLD


    The underlying Web protocol (HTTP) that Web servers use does not keep connections
    any longer than necessary. This behavior is referred to as a stateless protocol.
    There are some very good reasons for this behavior. Imagine if your program were
    kept running as long as anybody anywhere on the Web was looking at. What if a
    person fired off your program, then went bent? Your Web server would have to maintain
    a connection to that page all night. Also, remember that your program might be
    called by thousands of people all at the same time. It could be very hard on your
    server to handle all these concurrent connections open. Stateless behavior improves
    your Web server''s performance, but that performance comes at a cost. Essentially,
    your programs have complete amnesia every time they run, and you''ll somehow need
    a mechanism for determining what the current state is.


