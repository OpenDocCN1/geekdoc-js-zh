  md: 'Be very careful opening a file in write mode. If a file already exists and
    you open it for write access, PHP will create a new file, overwriting the old
    file and destroying its contents.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_244_0.png)


    Append mode allows you to write to a file without destroying the current contents.
    When you write to a file in append mode, all new data is added to the end of the
    file.


    Chapter 6 Working With Files


    > r+ and w+ modifiers are used for another form of file access, called random
    access which allows simultaneous reading and writing to the same file. While this
    is a very useful tool, I won''t spend a lot of time on it in this introductory
    book. The sequential access methods you''ll learn in this chapter are fine for
    simple file storage problems, and the relational database functions that you''ll
    learn in the remainder of this book aren''t any more difficult than the random
    access model, and provide far more power.


