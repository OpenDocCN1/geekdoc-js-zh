- img_proc: true
  md: 'the data design in this, I can be sure that the number 0 field in every table
    is the primary key. For that field, I simply printed the field name and value
    in an ordinary HTML table row. I added the key''s value in a hidden field so the
    next program will have access to it.


    # Recognizing Foreign Keys


    Unfortunately, there is no way (at least in MySQL) to determine if a field is
    a foreign key reference. I had to rely on a naming convention to make sure my
    program recognizes a field as a foreign key reference. I decided that all foreign
    keys in my database will have the foreign table''s name followed by the value
    ID. For example, a foreign key reference to the operation table will always be
    called operationID in my database. This is a smart convention to follow anyways,
    as it makes your fields easy to remember. It becomes critical in smartRefEdit()
    because it is the only way to tell whether a field is a foreign key. I used else
    to check the name of any field that is not the primary key (which was checked
    in the if clause). preg_match() function lets me use a powerful regular expression
    to determine the field''s name.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_411_0.png)


    Examining the Regular Expression: The statement I used to determine whether a
    field is a foreign key looks like:


    ```

    else if (preg_match("(.*)ID\$/, $col, $match))

    ```


    It uses a simple but powerful regular expression: /(.*)ID\$. This expression looks
    for any line that ends with ID. (recall that the $ indicates the end of a string).
    \* indicates any number of characters. The parentheses around .* tell PHP to store
    all the characters before ID into a special array, called $match. Since there''s
    only one pattern to match in this expression, all the characters before ID will
    contain the name of the table. So, this regular expression takes the name of a
    field and determines if it ends with ID. If so, the beginning part of the field
    name (everything but ID) is stored in $match[1]. If $col contains operationID,
    this line will return TRUE because operationID ends with ID- and the table name
    (operation) will be stored in $match[1].


    # Building the Foreign Key List Box


    If a field is a foreign key reference, it is necessary to build a list box containing
    some sort of meaningful value the user can read. Since I''ll need this capability
    in a couple of places (and smartRefEdit() is already pretty complex), I build
    a new function called fieldListList(). This function (explained in detail later
    in this chapter) builds a drop-down HTML list based on a table and field name.
