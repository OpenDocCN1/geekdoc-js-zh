- img_proc: true
  md: 'Once you start entering data into the table, you''ll see a few problems crop
    up. Look carefully at Figure 9.2 and you''ll see some potential issues.


    # Inconsistent Data Problems


    Gold Elbow''s record indicates that operation Dancing Elephant is about infiltrating
    a suspicious zoo. Falcon''s record indicates the same operation is about infiltrating
    a suspicious circus. For the purpose of this example, I''m expecting that an assignment
    has only one description, so one of these descriptions is wrong. There''s no way
    to know whether it''s a zoo or a circus by looking at the data in the table, so
    both records are suspect. Likewise, it''s hard to tell if operation enduring Angst
    takes place in Lower Vota or Lower Vtla, because the records that describe this
    mission have different spellings. The circus/zoo inconsistency and the Vota/Vtla
    problem share a common cause. In both cases the data entry (probably a low-ranking
    circus servant, because international spy masters are far too busy to do their
    own data) had to type the same data into the database multiple times. This kind
    of inconsistency causes all kinds of problems. If you require a data entry to
    enter the data repeatedly, you will see inconsistencies in the results. Different
    people will choose different abbreviations. You may see multiple spellings of
    the same term. Some people will simply not enter data if it''s too difficult.
    When this happens, you cannot rely on the data (is it a zoo or a circus?). You
    also can''t search the data with confidence. (If I look for all operatives in
    Lower Vtla, I''ll miss Blackford, because he'' If you look carefully, you''ll
    notice that I misspelled "sabatoge." It will be very difficult to find all places
    this word is misspelled and fix them all.)


    # Problem with the Operation Information


    There''s another problem with this database. If some reason Agent Rehab was dropped
    from the database (maybe she was a double agent all along), the information regarding
    Operation Raging Dandelion would be deleted along with her record, because the
    only place it stored is as a part of her record. The operation''s data somehow
    needs to be stored separately from the agent data.


    # Problems with Listed Fields


    The specialty field brings in its own troubles to the database. This field can
    contain more than one entity, because spies should be able to do more than one.
    (My favorite combination is explosives and flower arranging.) Fields with lists
    in them can be problematic. For one thing, it''s much harder to figure out what
    size to make'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'a field that may contain several entities. If your most talented spy has ten
    different skills, you would need enough room to store all ten skills in every
    spy''s record. It can be difficult to search on fields that contain lists of data.
    You might be tempted to use several different skill fields (maybe a skill1, skill2,
    and skill13 field, example) but this doesn''t completely solve the problem. It
    would be better to have a more flexible system that can accommodate any number
    of skills. The flat file system you''ve seen in this badSpy database is not capable
    of that versatility.


    # Designing a Better Data Structure


    The spy master database isn''t really that complicated, but the badSpy database
    shows you number of ways even a simple database can go wrong. This is a pretty
    important database, because it will be used to save the free world, so it deserves
    a little more thought. Fortunately, data developers come up with a number of ways
    to think about the structure of data. It is usually best to back away from the
    computer and think carefully about how data is used before you write a single
    line of code.


    # Defining Rules for a Good Data Design


    Data developers come up with a list of rules for creating well-behaved databases:


    +   - Break your data into multiple tables.

    - No field can have a list of entries.

    - Do not duplicate data.

    - Make each table describe only one entity.

    - Create a single primary key field for each table.


    A database that follows all these rules will avoid most of the problems evident
    in the badSpy database. Fortunately, there are some well-known procedures for
    improving a database so it can follow all these rules.


    # Normalizing Your Data


    Data programmers try to prevent the problems evident in the badSpy database through
    a process called data normalization. The basic concept of normalization is to
    break down a database into a series of tables. If each of these tables is designed
    correctly, the database will be less likely to have the sorts of problems described
    so far in this chapter. Entire books have been written about normalization, but
    the process breaks down into three major steps, called normal forms.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# First Normal Form: Eliminate Repetition


    The goal of the first normal form (sometimes abbreviated 1NF) is to eliminate
    repetition in the database. The primary culprit in the badSpy database is the
    specialty field. One solution would be to have two tables, one for agents, and
    other for specialties.


    > TRICK Data designers seem to play a one-string banjo. The solution to almost
    every design problem is to create another table. As you''ll see, there is still
    quite an art form to what should be used in that new table.


    The two tables would look somewhat like Tables 9.1 and 9.2.


    | TABLE 9.1 AGENT TABLE IN INF |

    | agentID | name | Assignment | Description | Location |

    |---|---|---|---|--|

    | 1 | Rahab | Raging Dandelion | Plant Crabgrass | Sudan |

    | 2 | Gold Elbow | Dancing Elephant | Infiltrate suspicious zoo | London |

    | 3 | Falcon | Dancing Elephant | Infiltrate suspicious circus | London |


    | TABLE 9.2 SPECIALTY TABLE IN INF |

    | specialtyID | name |

    |---|--|

    | 1 | electronics |

    | 2 | counterintelligence |

    | 3 | sabotage |


    I did not include all data in these example tables, just enough to give you a
    sense of how these tables would be organized. Also, there isn''t really a good
    way to connect these tables back together yet, but you''ll learn that later in
    this chapter.


    # Second Normal Form: Eliminate Redundancies


    Once all your tables are in the first normal form, the next step is to deal with
    all the potential redundancy issues. These mainly occur because data is entered
    more'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'than one time. To fix this, you need to (you guessed it) build new tables.
    The agent table could be further improved by moving all data about operations
    to another table. Figure 9.3 shows a special diagram called an Entity Relationship
    diagram, which illustrates the relationships between these tables:


    ![](img/f7bb260ce17b9d585cf5f10f69134213_356_0.png)


    An Entity Relationship diagram (ER diagram) is used to diagram the relationships
    between data elements. In this situation, I thought carefully about the data in
    the spy database. As I thought about the data, three distinct entities emerged.
    By separating the operation data from the agent data, I removed redundancy, because
    the user will only enter operational data one time. This will eliminate several
    of the problems in the original database. It will also fix the situation where
    an operation''s data was lost because a spy turned out to be a double agent. (I''m
    still bitter about that defection.)


    # ### Third Normal Form: Ensure Functional Dependency


    The third normal form concentrates on the elements associated with each entity.
    In order for a table to be in the third normal form, that table must have a single
    primary key, and every field in the table must relate only to that key. For example,
    the description field is a description of the operation, not the agent, so it
    belongs in the operation table. In the third form of normalization, you look through
    each piece of data in your table and ensure that it directly relates to the table
    it is placed in. If not, you need to either move it to a more appropriate table
    or build a new table for it.


    > IN THE REAL WORLD

    nYou might notice that my database falls into third normal form automatically
    when I put it in second normal form. This is not unusual for small databases,
    but rare with the large complex databases used to describe real-world enterprises.
    Even if your database seems to be in the third normal form already, go through
    each field to see if it relates directly to its table.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Defining Types of Relationships


    The easiest to normalize your databases is with a stylized view of them. ER diagrams
    are commonly used as a data design tool. Take another look at the ER diagram for
    the spy database in Figure 9.4.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_357_0.png)


    This diagram illustrates the three entities in the spy database (at least up to
    now) and the relationships between them. Each entity is enclosed in a rectangle,
    and the lines between the entities represent the relationships between the entities.
    Take a careful look at the relationship lines. They have crow''s-feet on them
    to indicate some special characteristics of the relationship. There are essentially
    three kinds of relationships (at least in this simplistic overview of data modeling).


    # Recognizing One-to-One Relationships


    One-to-one relationships happen when each instance of entity A has exactly one
    instance of entity B. A one-to-one entity is described as a simple line between
    two entities with no special symbols on either end.


    > One-to-one relationships are actually rare, because usually if the two entities
    are closely related, they can be combined into one table without any penalty.
    There are no one-to-one relationships in the spy ER diagram shown in Figure 9.4.


    # Describing Many-to-One Relationships


    One-to-many (and many-to-one) relationships happen when one entity can contain
    more than one instance of the other. For example, each operation can have many
    spies, but (for the sake of this example) each agent can be assigned to one mission
    at a time. Thus the agent-operation relationship is considered a many-to-one'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'relationship, because a spy can have only one operation, but one operation
    re-late to many agents. In this very simplistic version of ER notation, I''m using
    crow-s feet to indicate the many side of the relationship.


    # TRICK


    There are actually several different kinds of one-to-many relationships, each
    with a different use and symbol. For this overview, we''ll treat them all the
    same and use the generic crow''s-feet symbol, but once you start writing more
    involved databases, you''ll investigate data diagramming more closely by looking
    into books on data normalization and software engineering. Likewise, data normalization
    is a far more involved topic than the brief discussion in this introductory book.
    At some point you''ll want to study the topic more carefully.


    Chapter 9 Data Normalization


    # Recognizing Many-to-Many Relationships


    The final type of relationship shown in the spy ER diagram is a many-to-many relationship.
    This type of relationship occurs when each entity can have many instances of the
    other. Agents and skills have this type of relationship, because one agent can
    have any number of skills, and each skill can be used by any number of agents.
    A many-to-many relationship is usually shown by crow''s feet on each end of the
    connecting line.


    It''s important to generate an ER diagram of your data including the relationship
    types, because there are different strategies for creating each type of relationship.
    You''ll see these strategies as I build the SQL for the improved spy database.


    # IN THE REAL WORLD


    > Professional programmers often use expensive software tools to help build data
    diagrams, but you don''t need anything more than paper and pencil to draw ER figures.
    I do my best data design with a partner drawing on a white board. I like talk
    through designs out and look at them in a large format. I''ve got a sense of the
    design, I usually use a vector-based drawing program to produce a more formal
    version of the diagram. This type of drawing tool is useful because it allows
    you to connect elements together, already has the crow''s-feet lines available,
    and allows you to move elements around without disrupting the lines between them.
    Dia is an excellent open-source program for drawing all kinds of diagrams. I used
    it to produce all the ER figures in this chapter. A copy of Dia is on the CD that
    accompanies this book.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Building Your Data Tables


    Once you have designed the data according to the rules of normalization, you are
    ready to actually build sample data tables in SQL. It pays to build your tables
    carefully to avoid problems. I prefer to build all my tables in an SQL script
    so I can easily rebuild my database if (okay, when) my programs mess up the data
    structure. Be-sides, enemy agents are always lurking preparing to sabotage my
    operations.


    I also add plenty of sample data in the script. You don''t want to work with actual
    data early on, because you are guaranteed to mess up somewhere during the process.
    However, it is a good idea to work with sample data that is a copied subset of
    the actual data. Your sample data should anticipate some of the anomalies that
    might occur in actual data (for example, what if a person doesn''t have a middle
    name?). My entire script for the spy database is available on the CD-Rom as buildspy.sql.
    All SQL code fragments shown in the rest of this chapter come from that file.


