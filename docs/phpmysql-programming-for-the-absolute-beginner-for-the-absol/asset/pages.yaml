    The program will call `getFiles()` first. This function will examine a directory
    and get a list of the files in that directory. This list of filenames will be
    used in the other functions. The next three functions all generate HTML forms.
    Each of these forms contains a select list that is dynamically generated from
    the file list. The button corresponding to each form submits the form to the appropriate
    PHP page in the system.


    You might want to make another version of this main page for the people who will
    take your test. On that page, you wouldn''t even show the administrative options.
    It''s very easy to make such a page. Simply copy the `QuizBuilder.php` program
    to another file, and comment out the calls to the `showEdit()` and `showLog()`
    functions.'
