  md: '# CHAPTER


    # Exploring the PHP Environment


    Web pages are interesting, but on their own they are simply documents. You can
    use PHP to add code to your Web pages so they can do more. A scripting language
    like PHP can convert your Web site from static documents to an interactive application.
    In this chapter, you''ll learn how to add basic PHP functionality to your Web
    pages. Specifically, you''ll:


    +   - Review HTML commands.

    - Use Cascading Style Sheets to enhance your Web pages.

    - Build HTML forms.

    - Ensure PHP is on your system.

    - Run a basic diagnostic of your PHP installation.

    - Add PHP code to a Web page.'
