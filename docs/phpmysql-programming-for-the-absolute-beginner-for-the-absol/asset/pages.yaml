  md: '# Creating the Selection Elements


    It''s very easy to add text elements to your Web pages, but requiring users to
    enter text can interrupt the flow of the program. Whenever possible, experienced
    programmers like to give the user choices that do not involve typing. HTML forms
    have a number of simple elements for allowing the user to choose from a list of
    options using the mouse.


    Making the user''s life easy is a good reason to use some of these other input
    features, but there''s another reason. You never know what a user will enter into
    a text box. It can be very difficult to write code that anticipates all the possible
    wrong things a user might type. If you use the various selection elements described
    below, you may pre-determine all possible values your program will need to deal
    with (at least in most circumstances).


    Figure 1.10 shows a number of these selection-style elements on a Web page.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_51_0.png)


    Several HTML elements allow the user to enter information without having to type


    # Creating Checkboxes


    The first type of input to consider is the checkbox. Checkboxes usually look like,
    well, boxes that can be checked. Usually there is some kind of text near the checkbox.'
  merge: -1
  pgno: 51
