    The first job is to create two files. The quiz name can be the foundation of the
    filename, but many file systems choke at spaces within filenames, so I use str_replace()
    function to replace all spaces in $quizName to underscore characters (_). Then
    I create a filename for the master file ending in .mas and another filename for
    the actual quiz ending in .html. To create the HTML file, I open it for write
    output. Then I use theHTML() function (which will be described shortly) to build
    the HTML code, and I write that code to the html file and close the file.'
