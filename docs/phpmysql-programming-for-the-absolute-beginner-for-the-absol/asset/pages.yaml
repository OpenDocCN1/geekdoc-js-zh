  md: '# Introducing the Story Program


    By the end of this chapter, you''ll be able to write the program featured in Figures
    2.1 and 2.2.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_65_0.png)


    FIGURE 2.1


    The program begins by asking the user to enter some information.


    The program asks the user to enter some values into an HTML form, and then uses
    those values to build a custom version of a classic nursery rhyme. The story program
    works like most server-side programs. It has two distinctive parts. First, the
    user enters information into a plain HTML form and hits the submit button. The
    PHP program doesn''t execute until after the user has submitted a form. The PHP
    program takes the information from the form and does something to it. Usually
    the PHP program also returns an HTML page to the user.


    # Using Variables in Your Scripts


    The most important new idea in this chapter is the notion of a *variable*. A variable
    is a container for holding information in the computer''s memory. To make things
    easier for the programmer, every variable has a name. You can store information
    into a variable and get information out of a variable.'
  merge: -1
