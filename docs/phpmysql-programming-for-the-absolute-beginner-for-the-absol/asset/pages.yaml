    In regular HTML and JavaScript programming, you can use the "view source" command
    of the Web browser to examine the code for your programs. For server-side languages,
    this is not sufficient. There will be no PHP at all in the view source document.
    Remember that the actual program code never gets to your Web browser. Instead,
    the program is executed on the server, and the **results** of the program are
    sent to the server as ordinary HTML. Be sure to be looking at the actual PHP source
    code on the server when you are examining these programs. On a related note, you
    cannot simply use the File menu of your browser to load a PHP page. Instead, you
    will need to run it through a server.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_67_0.png)


    The `$userName` page is mainly HTML with a small patch of PHP code in it. That
    code does a lot of very important work.


    # Creating a String Variable


    The line `$userName = "Jacob"; does a number of things. First, it creates a variable
    named `$userName`. In PHP, all variables begin with a dollar sign to distinguish
    them from other program elements. The variable''s name is significant.'
