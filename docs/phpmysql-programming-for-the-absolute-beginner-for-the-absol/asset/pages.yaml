- img_proc: true
  md: 'feature, it can be dangerous, so some administrators turn it off. Even when
    register_globals is active, it can be useful to know other ways of accessing the
    information that comes from the form.


    All the fields sent to your program are automatically stored in a special associative
    array called $_REQUEST. Each field name on the original form becomes a key, and
    the value of that field becomes the value associated with that key. If you have
    a field with field userName, you can get the value of the field by calling $_REQUEST[''userName'']`


    The $_REQUEST array is also useful because you can use a foreach loop to quickly
    determine the names and values of all form elements known to the program. The
    source code of the formReader.php program illustrates how this is done.


    ```

    <!DOCTYPE html public "-//W3C//DTD HTML 4.0 //EN">

    <html>

    <head>

    <title>Form Reader</title>

    </head>

    <body>

    <h1>Form Reader</h1>

    <h3>Here are the fields I found on the form</h3>

    <?php

    print <<<HERE

    <table border = "1">

    <tr>

    <th>Field</th>

    <th>Value</th>

    </tr>

    HERE:


    foreach ($_REQUEST as $field => $value) {

    print <<<HERE

    <tr>

    <td>$field</td></td>

    <td>$value</td></td>

    </tr>

    ```'
