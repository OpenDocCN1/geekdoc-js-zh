- img_proc: true
  md: '# Introducing the Spy Master Program


    The Spy Master program is a suite of PHP programs that allows access to the spy
    database created in Chapter 9, “Data Normalization.” While the database created
    in that chapter is flexible and powerful, it is not easy to use unless you know
    SQL. Even if your users do understand SQL, you don''t want them to have direct
    control of a database, because so many things can go wrong. You need to build
    some sort of front-end application to the database. In essence, there are three
    levels to this system. The client computer handles communication with the user.
    The database server (MySQL) manages the actual data. The PHP program sits between
    the client and the database acting as an interpreter. PHP provides the bridge
    between the HTML language of the client and the SQL language of the database.
    This kind of arrangement is frequently called a three-tier-architecture. As you
    examine the Spy Master program throughout this chapter you will learn some the
    advantages of this particular approach.


    # Viewing the Main Screen


    Start by looking at the program from the user''s point of view as shown in Figure
    10.1.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_373_0.png)


    FIGURE 10.1

    The entry point to the Spy Master Database is clean and simple.'
