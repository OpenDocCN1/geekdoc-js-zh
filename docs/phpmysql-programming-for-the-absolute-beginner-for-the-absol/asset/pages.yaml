    # Summary


    You''ve already come a very long way. You''ve learned or reviewed all the main
    HTML objects. You''ve investigated cascading style sheets and how they are used
    to modify an HTML attribute. You experimented with the main form elements and
    learned how to add various kinds of text boxes and selection devices to your Web
