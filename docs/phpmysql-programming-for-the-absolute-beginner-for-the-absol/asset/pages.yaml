  md: 'This code upgrades Lightning Guardian''s power to the Super Electric Toe (which
    is presumably a lot better than the ordinary Electric Toe).


    Generally, you will want to update only once at a time. You can use a WHERE clause
    to select which record in the table will be updated.


    # Returning to the Adventure Game


    The adventure generator featured at the beginning of this chapter uses a combination
    of MySQL and PHP code. You''ll learn more about the PHP part in Chapter 8, "Connecting
    to Databases Within PHP." For now though, you have enough information to start
    building the data structure that forms the core of the game.


    # Designing the Data Structure


    The adventure game is entirely about data. It has an incredibly repetitive structure.
    The same code operates over and over, but it operates on different parts of the
    database. I started the program by sketching out the primary play screen and thinking
    about what data elements I would need for each of the game. I ended up building
    a table that looks like Table 7.3.


    As you examine the chart, you will see that I simplified the game so that possible
    choice in the game boils down to seven elements. Each node (or decision point)
    in the game consists of an id (or room number), a room name, and a description
    of the current circumstances. Each node also has pointers that describe what happens
    when the user chooses to go in various directions from that node. For example,
    if the user is in the warehouse (node 3) and chooses to go east, he will go to
    node 4, which represents the doorway. Going south from node three takes the user
    to node 5, which is the box. I carefully thought about the game so the data structure
    represents all the places the user can go in this game. I chose to think of winning
    and losing as nodes, so everything in the game can be encapsulated in the table.


    It''s critical to understand that creating the table on paper is the first step.
    Once you''ve decided what kind of data your program needs, you can think about
    how you will put that data together. As well, choosing a database gives me an
    incredible amount of control, and makes it pretty easy to work with the data.
    Perhaps the most amazing thing is this program can handle an entirely different
    game simply by changing the database. I don''t have to change a single line of
    code to make the game entirely different. All I have to do is point to a different
    database or change the database.'
