  md: '# Introducing the mailMerge.php Program


    To illustrate how text files can be used for basic data storage, I created a simple
    mail merge program. The results of this program are shown in Figure 6.9.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_257_0.png)


    You can see that the same letter was used repeatedly, but each time it used a
    different name and e-mail address. The name and e-mail information was pulled
    from a file.


    # Determining a Data Format


    The data file (shown in Figure 6.10) for this program is simply a file created
    in Notepad. Each line contains a name and an e-mail address, separated by a tab
    character.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_257_1.png)


    This particular format (one line per record, each field separated by tabs) is
    called a tab-delimited file, and it is extremely popular, because you can easily
    create it in a text editor, spreadsheet, or any other kind of program you wish.
    It is also quite easy to use another character as a separator. Spreadsheet programs
    often save in a comma-delimited format (CSV for comma-separated values) but string
    data does not work well in this format because it might already have commas embedded
    in it.'
