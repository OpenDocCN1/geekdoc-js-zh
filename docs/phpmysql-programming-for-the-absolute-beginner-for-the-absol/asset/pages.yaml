  md: 'unique index and value. The associative form of the foreach loop takes into
    this account by indicating two variables. The first variable holds the index.
    The second variable refers to the value associated with that index. Inside the
    loop, you can refer to the current index and value using whatever variable names
    you designated in the foreach structure. Each time the loop, you will be given
    a name/value pair. In this example, the name will be stored in the variable $country,
    because all the indices in this array are names of countries. Each time the loop,
    $country will have a different value. In each iteration, the value of the $capital
    variable contains the array value corresponding to the current value of $country.


    Unlike traditional arrays, you cannot rely on associative arrays to return in
    any particular order when you use a foreach loop to access elements of the array.
    You need elements to show up in a particular order, you''ll need to call them
    explicitly.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_192_0.png)


    # Using Built-In Associative Arrays


    Associative arrays are extremely handy because they reflect a kind of information
    storage that is very frequently used. In fact, you''ve been using associative
    arrays in disguise ever since Chapter 2 of this book. Whenever your PHP program
    receives data from a form, that data is actually stored in a number of associative
    arrays for you. A variable was automatically created for you by PHP for each element.
    However, you can''t always rely on that particular bit of magic. Increasing, server
    administrators have been turning “automatic variable creation” off for security
    reasons. In fact, the default setup for PHP is now to have this behavior (with
    the odd name render_globals turned off). It''s handy to know how PHP gets data
    from a good example of associative arrays. It''s also useful because you may find
    yourself needing how to get data without the variables created explicitly for
    you.


