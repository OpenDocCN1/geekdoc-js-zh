    The SOURCE command allows you to read in SQL instructions from a file.


    > TRAP

    In Windows I drag a file from a directory view into a command line program like
    MySQL Windows will copy the entire filename, but it will include double quotes,
    which will cause problems for the MySQL interpreter. If you drag a filename into
    MySQL, you will need to edit out the quote characters so that MySQL will read
    the file correctly.


    # Working with a Database in SQL


    It''s critical to understand the SQL language, but sometimes you may want a more
    visual way to build and view your databases. If you are running Windows, you can
    use an excellent free end called SQLyog. This freeware program makes it much easier
    for you to create, modify, and manipulate databases.'
