    able to determine the value of whichever radio button in your group was selected.


    # Building Drop-Down List Boxes


    Another common user interface trick is to use some kind of drop-down list. These
    devices allow the user to choose from a list of options, but the various options
    only appear when the user is choosing from the list. This is especially useful
    when real estate is an issue or you want to keep the interface clean. Drop-down
    lists are made with two different elements. The main object is the select object.
    It contains a series of select objects (This is analogous to the list objects
    that appear inside a url or object.) The code for building a drop-down list box
    will make it all clear.


    ```

    <select name = "selectColor">

    <option value = "red">red</option>

    <option value = "orange">orange</option>

    <option value = "yellow">yellow</option>

    <option value = "green">green</option>

    <option value = "blue">blue</option>

    <option value = "indigo">indigo</option>

    <option value = "violet">violet</option>

    </select>

    ```


    The select object has a name attribute. Each option has its own value attribute.
    Your program will use the value attribute of whichever element is returned. The
    value property of an option button doesn''t display anywhere. Place the text you
    want to have visible on the page between the <option> and </option> tags.'
