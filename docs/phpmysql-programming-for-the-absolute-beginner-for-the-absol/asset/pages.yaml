  md: "Once again, the basic structure is just like the basic loop program, but by\
    \ changing the parameters of the for structure I was able to alter the behavior\
    \ of the program. The code for this program shows how it is done.\n\n```\n<html>\n\
    \n<head>\n<title>\nCounting Backwards\n</title>\n</head>\n\n<body>\n<h1>Counting\
    \ Backwards</h1>\n\n<?\nfor ($i = 10; $i > 0; $i--) {\n    print \"$i<br>\\n\"\
    ;\n} // end for loop\n?>\n\n</body>\n</html>\n```\n\nIf you understand how for\
    \ loops work, the changes will all make sense. I'm counting backwards this time,\
    \ so $i begins with a large value (in this case 10.) The condition for continuing\
    \ the loop is now $i > 0, which means the loop will continue as long as $i is\
    \ greater than zero. As soon as $i is zero, the loop will end. Note that rather\
    \ than adding a value to $i, this time I decrement by each time through the loop.\
    \ If you're counting backwards, you must be very careful that the sentry variable\
    \ has a mechanism for getting smaller, or the loop will never end. Recall that\
    \ $i++ adds one to $i, $i-- subtracts one from $i."
