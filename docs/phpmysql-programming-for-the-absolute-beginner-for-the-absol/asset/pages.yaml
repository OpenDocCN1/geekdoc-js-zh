  md: '# Storing Data in the Text Box


    The program has two variables, $textBoxCounter and $hdnCounter. For now, concentrate
    on $textBoxCounter. This is the variable that is related to the text box. When
    the program begins, it grabs the value of $textBoxCounter (if it exists) and adds
    one to it. When the program prints the text box, it automatically places the $textBoxCounter
    value in the text box. Since the form has no action attribute defined, the program
    will automatically call itself when the user clicks on the Submit button. This
    time, there will be a value in $textBoxCounter (the value 1). When the program
    runs again, it will increment $textBoxCounter and store the new value (now 2)
    in the text box. Each time the program runs, it stores the value it will need
    on the next run in the text box.


    # Using a Hidden Field for Persistence


    The text box is convenient for this example because you can see, but there are
    serious problems with using a text box this way in real programs. Text boxes are
    editable by the user, which means the user could put any kind of information in
    them, and really mess up your day. Hidden fields are the unsung heroes of server-side
    programming. Look at $hdnCounter in the source code. This hidden field also has
    a counter, but since it is, the user never sees it. However, the value of the
    $hdnCounter variable will be sent to the PHP program indicated by the form''s
    action attribute. That program can do anything with it, including printing it
    out in the HTML code body.


    Often when you find yourself wanting to keep track of information pages, you''ll
    store the information in hidden fields on the user''s page.


    > IN THE REAL WORLD

    “hidden fields” technique shown works fine for storing small amounts of information,
    but it is very inefficient and insecure when you are working with serious forms
    of data. As you progress through this book, you''ll learn many other ways of making
    data persist, including the use of cookies, session variables, files, and databases.


