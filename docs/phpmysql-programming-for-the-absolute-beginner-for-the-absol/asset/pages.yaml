    I used the rand function to generate a random number between one and six (inclusive)
    and stored the resulting value in the $roll variable. The rand function expects
    two parameters. The first value is the lowest number you wish, and the second
    value represents the highest number. Since I want to replicate an ordinary six-sided
    die, I told the rand function to return a value between one and six. Since I knew
    that rand would return a value, I assigned that resulting value to the variable
    $roll. By the time the line


    ```

    $roll = rand(6);

    ```


    has finished executing, the $roll variable will have a random value in it. The
    lowest possible value will be one, the highest possible value will be six, and
    the value will not have a decimal part. (In other words, it will never be 1.5).


    ![](img/f7bb260ce17b9d585cf5f10f69134213_105_0.png)


    > If you''re coming from another programming language, you might be a little surprised
    at the way random numbers are generated in PHP. Most languages allow you to create
    a random floating point value between zero and one, and then require you to transform
    that value to whatever range you wish. PHP allows (in fact requires) to create
    random numbers within a range, which is usually what you want anyway.

    If you really want a value between zero and one, you can generate a random number
    between zero and 1000 and then divide that value by 1000.


    # Printing a Corresponding Image


    Notice the sneaky I used variable interpolation. I carefully named my first image
    die1.jpg, the second die2.jpg, and so on. When I was ready to print an image to
    the screen, I used an ordinary HTML image tag, but the source is to die$roll.jpg.
    If $roll is three, the image will show die3.jpg. You''ll see some other ways to
    let the computer respond to random numbers shortly, but variable interpolation
    can be a wonderful trick if you know how the file names are structured.'
