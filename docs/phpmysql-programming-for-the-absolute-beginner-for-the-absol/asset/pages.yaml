  md: "# Getting the Field Names\n\nI'll be printing the data out in an HTML table.\
    \ I could create the table headings by hand, because I know what all the fields\
    \ are, but it's better to get the field information directly from the query, because\
    \ you won't always know which fields are being returned by a particular query.\
    \ The next chunk of code manages this task.\n\n```\nprint \"<table border = 1\\\
    n>\";\n\n//get field names\nprint \"<tr>\\n\";\nwhile ($field = mysql_fetch_field($result))\
    \ {\n    print \"<td><$field->name></td>\\n\";\n} // end while\nprint \"</tr>\\\
    n\";\";\n```\n\nThe mysql_fetch_field() function expects a query result as its\
    \ parameter. It then fetches the field and stores it in the $field variable. If\
    \ there are no fields left in the result, the function returns the value FALSE.\
    \ This allows the field function to be used as a conditional statement.\n\nThe\
    \ $field variable is actually an object. You haven't used PHP objects yet, but\
    \ they're really not too difficult. The $field object in this case is much like\
    \ an associative array. It has a number of properties (which can be thought of\
    \ as the attributes of the field). The field object has a number of attributes,\
    \ listed in Table 8.1.\n\n| Property | Attribute |\n| --- | --- |\n| max_length\
    \ | How long the field is (Especially important in VARCHAR) |\n| name | The name\
    \ of the field |\n| primary_key | TRUE if the field is a primary key |\n| table\
    \ | Name of table field this belongs to |\n| type | Data type of this field |"
  merge: -1
  pgno: 329
- img_proc: true
  md: "By far the most common use of the field object is to determine the names of\
    \ all the fields in a query. The other attributes can be useful in certain situations.\
    \ You can see the complete list of attributes in the MySQL online help.\n\nYou\
    \ use a slightly new syntax to refer to the properties of an object. Notice that\
    \ I printed $field->name to the HTML table. This syntax simply refers to the property\
    \ of the field object. For now if you want to think of it as a fancy associative\
    \ array, that would be reasonably accurate.\n\n# Parsing the Result Set\n\nThe\
    \ rest of the code examines the result set. I'll reproduce it here so you can\
    \ refresh your memory.\n\n```\n//get row data as an associative array\nwhile ($row\
    \ = mysql_fetch_assoc($result)) {\n  print \"<tr>\\n\";\n  // look at each field\n\
    \  foreach ($row as $col=$val) {\n    print \" <td>$val</td>\\n\";\n  } // end\
    \ foreach\n  print \"</tr>\\n\";\n} // end while\n```\n\nThe mysql_fetch_assoc()\
    \ function fetches the next row from a result set. It requires a result pointer\
    \ as its parameter, and returns an associative array.\n\n> TRICK: There are a\
    \ number of related functions for pulling a row from a result set. mysql_fetch_object()\
    \ stores a row as an object like the mysql_fetch_fields() function does. The mysql_fetch_array()\
    \ function fetches an array that can be treated as a normal array, an associative\
    \ array, or both. I intend to use mysql_fetch_assoc() because I think it's the\
    \ most straightforward approach for those unfamiliar with object-oriented syntax.\
    \ Of course, you would feel free to investigate these other functions and use\
    \ them if they make more sense to you.\n\nIf there are no rows left in the result\
    \ set, mysql_fetch_assoc() will return FALSE. It is often used as a condition\
    \ in a while loop as I did here to fetch each row in a result set. Each row will\
    \ represent a row of the eventual HTML table, so I print the HTML code to start\
    \ a new row inside the while loop."
