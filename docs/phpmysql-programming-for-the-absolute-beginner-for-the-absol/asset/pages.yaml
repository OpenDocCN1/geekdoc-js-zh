  md: '# Running a Script with SOURCE


    You can create a SQL script with any text editor. It is common to save SQL scripts
    with the .sql extension. Inside MySQL, you can use the SOURCE command to load
    and execute an external script. Figure 7.9 shows MySQL after I ran the buildPhonelist.sql
    script.


    ```

    mysql -u root -p

    mysql> CREATE TABLE phonelist (

    ...);

    mysql> INSERT INTO phonelist VALUES (

    0, ''Andy'', Harris, ''harris@cs.iupui.edu'', 123-456);

