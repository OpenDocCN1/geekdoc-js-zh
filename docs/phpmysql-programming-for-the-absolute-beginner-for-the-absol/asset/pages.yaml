  md: "To make sure things were going well, I added a check to the end of the page\
    \ that prints the actual contents of the master file. The output of this program\
    \ lets the administrator check to see that the test is working correctly. The\
    \ administrator can actually take the test and submit it to the grading program\
    \ from this page. If there is a problem with the test, it's convenient to have\
    \ the actual contents of the .mas file visible on the page. Of course, the final\
    \ HTML page will not contain this data, because it holds the answers.\n\n# Building\
    \ the Master File\n\nThe master file routine is very straightforward.\n\n```\n\
    function buildMas() {\n// builds the master file\nglobal $quizName, $quizEmail,\
    \ $quizPwd, $quizData;\n$msData = $quizName . \"\\n\";\n$msData .= $quizEmail\
    \ . \"\\n\";\n$msData .= $quizPwd . \"\\n\";\n$msData .= $quizData;\nreturn $msData;\n\
    \ // end buildMas\n```\n\nThe critical part of this file is remembering the file\
    \ structure rules, any program that reads this file doesn't get confused. The\
    \ quiz name should go on the first line, followed by a newline character. The\
    \ $quizEmail and $quizPwd variables follow on their own lines, and finally all\
    \ $quizData (which will usually be several lines) should go to the end of the\
    \ file. Note that the function doesn't actually store the data to the file, but\
    \ returns it to the main program. This allows a little more flexibility, so I\
    \ can write the data to both the file and the page.\n\n# Building The HTML File\n\
    \nThe function that creates the HTML is a little more involved, but it still isn't\
    \ too hard. The basic strategy is: Build an HTML form containing all the questions.\
    \ For each line of the master file, build a radio group. Place the question and\
    \ all the possible answers in a set of nested <ol> elements. At the end of the\
    \ page, there should be one Submit button. When the user clicks on the Submit\
    \ button, the system will call the gradeQuiz.php page, which will evaluate the\
    \ user's responses."
