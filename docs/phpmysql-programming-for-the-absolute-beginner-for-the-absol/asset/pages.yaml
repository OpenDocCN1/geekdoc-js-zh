  md: "Usually when you create a variable in PHP, you'll also be assigning some value\
    \ to it.\nAssignment flows from right to left.\n\nThe username variable has been\
    \ assigned the value \"Jacob\". Computers are picky about\\what type of information\
    \ goes into a variable, but PHP automates this process for\nyou, it's important\
    \ to recognize that \"Jacob\" is a text value, because text is\nstored and processed\
    \ a bit differently in computer memory than numeric data.\n\n# TRICK\n\nComputer\
    \ programmers almost never refer to text as text. Instead, they prefer the\\more\
    \ esoteric term string. The word string actually has a somewhat poetic origin,\n\
    \ the underlying mechanism for storing text in a computer's memory reminded\n\
    early early programmers of making a chain of beads on a string.\n\n# Printing\
    \ the Value of a Variable\n\nThe next line of code prints a message to the screen.\
    \ You can print any text to the\nscreen you wish. Text (also called string data)\
    \ is usually encased in quotes. If you\nwish to print the value of a variable,\
    \ simply place the variable name in the text you\nwant printed. The line\n\n```\n\
    print \"HI, $username\";\n```\n\nactually produces the output\n\nHi, Jacob\n\n\
    because when the server encounters the variable $username, it replaces it with\
    \ the\nvalue of that variable, which is \"Jacob\". The output of the PHP program\
    \ will be sent\ndirectly to the Web browser, so you can even include HTML tags\
    \ in your output if\ny wish, simply by including them inside the quotes.\n\nThe\
    \ ability to print the value of a variable inside other text is called string\
    \ interpo-lation. That's not critical to know, but it could be useful information\
    \ on a trivia\nshow or something.\n\n# Using the Semicolon to End a Line\n\nIf\
    \ you look back at the complete code for the $hiJacob program, you can see that\
    \ it\nhas two lines of code inside the PHP block. Each line of PHP code ends with\
    \ a\\semicolon. PHP is a more formal language than HTML and, like most program-ming\
    \ languages, has some strict rules about the syntax used when writing a page."
