  md: '# IN THE REAL WORLD


    SQLyog is so cool that you''ll be tempted to use it all the time. That''s fine,
    but be sure you understand the underlying SQL code, because your PHP programs
    have to work with plain text SQL commands. It''s fine to use SQLyog while you
    are building and manipulating your data, but your users won''t be using this program.
    Your application will be the user''s interface to your database, so you need to
    be able to do all commands in plain text within PHP I use SQLyog, but I also make
    sure I always look at the code it produces, so I can write it myself.


    SQLyog basically adds the visual editing tools of a program like Microsoft Access
    to the MySQL environment. It also adds some wonderful tools for adding records,
    viewing your data, and exporting data to a number of useful formats.


    # Connecting to a Server


    MySQL is a client-server application. The MySQL server will usually be running
    on a Web server where your PHP programs reside. You can connect a MySQL client
    to any MySQL server. Figure 7.10 shows me connecting to my local MySQL server.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_304_0.png)


    This screen helps you connect to a data server.


    It''s important to recognize that you can connect to any data server you have
    permission to use. This data server doesn''t need to be on the same physical machine
    you are using. This would be useful if you wanted to use SQLyog to view data on
    a remote Web server you are maintaining, for example. However, many of these remote
    Web servers do not like this kind of access, so you should still know how to work
    with the plain MySQL console.'
