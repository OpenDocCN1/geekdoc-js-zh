  md: '# TABLE 8.2 SUMMARY OF BASIC REGULAR EXPRESSION OPERATORS


    | operator | description | sample pattern | matches | doesn''t match |

    |---|---|---|---|--|

    | . | any character but newline | | e | \n |

    | ^ | beginning of string | ^a | apple | banana |

    | $ | end of string | a$ | banana | apple |

    | [characters] | any characters in braces | [abcABC] | a | d |

    | [char range] | describe range of characters | [a-z-Z] | r | 9 |

    | \d | any digit | \d|\d|\d|\d | 123-4567 | the-thing |

    | \b | word boundary | \b\b | the | theater |

    | + | one or more occurrences of preceding character | \d+ | 1234 | text |

    | * | zero or more occurrences of preceding character | [a-zA-Z]\d* | | |

    | {digit} | repeat preceding character that many times | \d{3}-\d{4} | 123-4567
    | 999-99-9999 |

    | | | or operator | applebanana | apple, banana | peach |

    | {pattern segment} | store results in pattern memory returned with numeric code
    | (^\.).*/1 | gig, blab (any word that starts and ends w/ same letter) | any other
    word |'
