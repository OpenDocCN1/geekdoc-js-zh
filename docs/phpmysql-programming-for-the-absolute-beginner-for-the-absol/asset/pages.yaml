    a function, you might look at the online help (it comes with PHP, or you can get
    it at www.php.net) to see if that function already exists.


    The chorus() function is especially handy in this program because it can be re-used.
    It isn''t necessary to re-write the code for the chorus each time you can simply
    call a function instead.


    # Using Parameters and Function Values


    Functions are meant to be self-contained. This is good because the entire program
    is too complex to understand. If you break the complex program into smaller functions,
    each function can be set up to work independently. When you work inside a function,
    you don''t have to worry about anything outside the function. If you create a
    variable inside a function, that variable dies as soon as you leave the function.
    This prevents many errors that can otherwise creep into your code. The bad side
    of functions being self-contained is you often want them to work with data from
    the outside program. There are a couple of ways to do this. You can send a parameter
    to a function, which allows you to determine one or more values to the function
    as it starts. Each function can also have a return value. An example will make
    this more clear. The param program, shown in Figure 3.13 illustrates another form
    of This Old Man song. Although again the user might not be aware of it, there
    are some important differences between this more sophisticated program and the
    first Old Man program.


