  md: "# Grading the Quiz\n\nOne advantage of this kind of system is the potential\
    \ for instantaneous feedback\for the user. As soon as the user clicks the Submit\
    \ button, the quiz will be auto-\nmatically graded by the `gradeQuiz.php` program,\
    \ which also stores a log of the student’s\nresults for the administrator.\n\n\
    # Opening the Files\n\nThe `gradeQuiz` program, like all the programs in this\
    \ system, relies on files to do all\nits important work. In this case, the program\
    \ will use the master file to get the\nanswer key for the quiz, and will write\
    \ to a log file.\n\n```\n?\nprint <<HERE\n<html>\n<head>\n<title>Grade for $quizName,\
    \ $student</title>\n</head>\n<body>\n<h1>Grade for $quizName, $student</h1>\n\
    HERE:\n//open up the correct master file for reading\n$fileBase = str_replace(\"\
    *\",_\", $quizName);\n$masterFile = $fileBase . \".mas\";\n$msfp = fopen($masterFile,\
    \ \"r\");\n\n$logFile = $fileBase . \".log\";\n\n//the first three lines are name,\
    \ instructor's email, and password\n$quizName = fgets($msfp);\n$quizEmail = fgets($msfp);\n\
    $quizPwd = fgets($msfp);\n```"
