  md: '# Naming Variables


    As a programmer, you will frequently get to name things. Experienced programmers
    have learned some tricks about naming variables and other elements.


    +   - Make the name descriptive. It''s much easier to figure out what UserName
    means something like $Variable or $Str. When possible, make sure variable names
    describe the kind of information they contain.

    - Use an appropriate length. Your variable name should be long enough to be descriptive,
    but not so long that it becomes tedious to type.

    - Don''t use spaces. Most languages (including PHP) don''t allow spaces in variable
    names.

    - Don''t use punctuation. Most of the special characters such as #, *, and / already
    have meaning in programming languages, so they can''t be used in variable names.
    Of course, every variable in PHP begins with the $ character, but otherwise you
    should avoid using punctuation. One exception to this rule is the underscore (_)
    character, which is allowed in most languages, including PHP.


    +   -Be careful about case. PHP is a case-sensitive language, which means that
    it considers $UserName, $USERNAME, and $UserName to be three different variables.
    The convention in PHP is to use lowercase except when separating words (note the
    uppercase “N” in $userName). This is a good convention to follow, and it''s the
    one I use throughout this book.\Watch your spelling! Every time you refer to a
    variable, PHP checks to see if that variable already exists somewhere in your
    program. If so, it uses that variable. If not, it quietly makes a new variable
    for you. If you misspell a variable name, PHP will not catch it. Instead, it will
    make a whole new variable, and your program probably won''t work correctly.


    It isn''t necessary to explicitly create a variable. When you refer to a variable,
    it is automatically created by PHP.


    # Assigning a Value to a Variable


    The equals sign (=) is special in PHP. It does *not* mean “equals” (at least in
    the present context.) The equals sign is used for assignment. If you read the
    equals sign as the word “gets,” you’ll be closer to the meaning PHP uses for this
    symbol. For example, the line


    ```

    $userName = "Jacob";

    ```


    “The variable $userName gets the value "Jacob".'
