- img_proc: true
  md: '| Operator | Description |

    | --- | --- |

    | == | equal to |

    | < | less than |

    | > | greater than |

    | <= | less than or equal to |

    | >= | greater than or equal to |

    | != | not equal to |


    # # Creating an if Statement


    An if statement begins with the keyword if followed by a condition inside parentheses.
    After the parentheses is a left brace ({). You can put as many lines of code between
    the left brace and the right brace}) as you wish. Any code between the braces
    will only be executed if the condition is true. If the condition is false, program
    control flows to the next line after the right brace. It is not necessary to put
    a semicolon on a line ending with a brace. It is customary to indent all the code
    between the left brace and the right brace.


    > > CODE STYLE

    You might be aware that the PHP processor actually ignores the spaces and carriage
    returns in your PHP code, if you might wonder if it pays attention to how code
    is edited, indented, where the braces go, and so on. While the PHP processor doesn''t
    care how you format your code, human readers do. Programmers argue about how you
    should format your code. If you are writing code with a group (for instance in
    a large project or for a class), you will be given a style guide you are expected
    to follow. When you''re working on your own, the specific style you adopt is not
    as important as staying with it and being consistent in your coding. The particular
    stylistic conventions I have adopted for this book are reasonably common, relatively
    readable (especially for beginners), and easily adapted to a number of languages.
    If you don''t have your own programming style, the one presented in this book
    is a good starting place. However, if your team leader or teacher requires another
    style, you will need to adapt to it. Regardless of the specific style guidelines
    you use, it makes lots of sense to indent your code, place comments throughout
    your program, and use white space to make your programs easy to read and debug.'
