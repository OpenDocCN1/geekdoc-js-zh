  md: '# 364


    Once view.php connects to the library, it uses functions in the library to connect
    to the database and print out desired results. The qDebug() function does most
    of the actual work. It will take whatever query is passed to it and generate a
    table with add, delete, and edit buttons.


    # WHY DID I STORE QUERIES IN THE DATABASE?


    You might wonder why I chose this approach to queries. After all, I could have
    let the user type in a query directly or provided some sort of form that allows
    the user to search for values. Either of these approaches has advantages, but
    it is very dangerous to allow direct access to your data from a Web form. Malicious
    users can introduce Trojan horse commands that can sniff your data, change data,
    or even delete information from the database. I sometimes build a form that has
    enough information to create an SQL query and then build that query in a client-side
    form (sounds like a good end-of-chapter exercise). In this case, I stored queries
    in another table. People with administrative access have the ability to add new
    queries to the database, but ordinary users do not. I preloaded the storedQuery
    database with a number of useful queries, then added the capacity to add new queries
    whenever the situation demands. There are some drawbacks to this system (primarily
    that ordinary users cannot build custom queries), but it is far more secure than
    a system that uses query based on user input.


    The str_replace() function is necessary because SQL queries contain single quote
    ('''') characters. When I store a query as a VARCHAR type, the single quotes embedded
    in the query causes problems. The normal solution to this problem is to use a
    backslash, which indicates that the quote should not be immediately interpreted,
    but considered a part of the data. The problem with this is the backslash is still
    in the string when I try to execute the query. The str_replace() function replaces
    all instances of "\''" with a single quote ('''').


    Note that the qDebug() function doesn''t actually print to the screen. It does
    build a complex string of HTML code. The view.php program prints the code to the
    screen.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_389_0.png)


    If you are using a library, it''s best if the library code does not print directly
    to the screen. Instead, it should simply return a value to whatever program called
    it. This will allow multiple uses for the data. For example, if the qDebug() function
    printed to the screen, you could not use it to generate a file. Since the library
    code returns a value but doesn''t actually doing anything with that value, the
    code that calls the function has the freedom to use the results in multiple ways.


    PHP/MySQL Programming for the Absolute Beginner'
