  md: '# ADVANTAGES OF SQL


    Databases have been an important part of programming since the beginning, the
    advent of the process of working with data has gone through several evolutions.
    A common language that can be used in many applications was a very important step.
    SQL is a fourth-generation language. In general, these languages are designed
    to solve a particular type of problem. Some fourth generation languages (like
    SQL) are not full-blown programming languages, because they don''t support structures
    like branches and loops. Still, these languages can serve a very useful purpose.
    SQL is handy because it''s widely supported. The SQL commands you will learn in
    this chapter will apply to most modern database programs with little to no modification.
    You can take the script you''ll learn in MySQL and send the same code to an Oracle
    or MS SQL Server database (two other very common choices), and all three data
    programs will build the database. If you choose to upgrade to a more powerful
    data package, you can use your existing scripts to manipulate the data. Perhaps
    the most powerful reason to have a scripting language to control databases relates
    to programming in traditional languages. You can write a program in any language
    (like PHP, for example) that generates SQL code. You can then use that code to
    manipulate the database. This allows you to have flexibility, and your program
    act as the interface to your database.


    When this code is sent to a SQL-compliant database program (such as MySQL) it
    will create the database structure shown in Table 7.1.


    # Using a Database


    It is possible that you will have several database projects working in the same
    relational database system. In my case, each chapter of this book that SQL has
    its own database. Sometimes your system administrator will assign you a database.
    In any case, you will probably need to invoke that database with the USE command.


    > TRICK

    The syntax of SQL is not exactly that of PHP. SQL has a different culture, and
    it makes sense to respect the way SQL code has historically been written. SQL
    is generally not case-sensitive, but most SQL coders put all SQL commands in all
    uppercase. Also, when a bunch of SQL commands are placed in a file as this code
    will be, you usually end each line with a semicolon.


    > TRICK

    If you don''t already have a database to USE, you can create one with the CREATE
    command. For example, to create a database called "myStuff," use these commands:

    CREATE DATABASE myststuff:

    USE mystuff:'
