  md: 'The phone list shows a very typical simple data table. Database like to give
    special names to the parts of the database, I''ll use this simple phone list to
    illustrate. Each row of the table is called a record. Records describe discrete
    entities. The list of records is called a table. Each record in a table has the
    same elements, which are called fields, (or sometimes columns). Every record in
    the table has the same field definitions, but records can have different values
    in the fields. The fields of a table are defined in specific ways. Because of
    the database tables are stored in files, the computer must always know how much
    room to allocate for each field, the size and type of each field is important.
    This particular database is defined with five fields. The id field is an integer.
    All the other fields contain string data.


    # Creating a Table


    RDBMS programs use a special language called Structured Query Language(SQL) to
    create and manipulate databases. SQL is usually pretty easy to understand, compared
    to full-blown programming languages. You can usually guess what''s going on without
    a lot of knowledge. As an example, look at the following SQL code:


    USE chapter7;


    ```

    CREATE TABLE phoneList (

    id INT PRIMARY KEY,


    firstName VARCHAR(15),


    lastName VARCHAR(15),\mail VARCHAR(20),


    phone VARCHAR(15)

    );

    ```


    DESCRIBE phonelist;

    This is like a PHP program in the sense it is a set of instructions for the computer
    to follow. However, the PHP interpreter doesn''t directly interact with the SQL
    language. Instead, these commands are sent to another program. As a PHP programmer,
    you''ll also be able to write code that sends commands to a database language.
    Just as your PHP code often writes code in HTML format for the browser to interpret,
    you''ll be writing SQL code for the MySQL interpreter to use.'
  merge: -1
