- img_proc: true
  md: "# 338\n\nEach operation gets its own record in the operation table. All the\
    \ data corresponding to an operation is stored in the operation record. Each operation's\
    \ data is stored only one time. This has a number of positive effects:\n\n+  \
    \ - It's only necessary to enter operation data once per op, saving time on data\
    \ entry.\n- Since there's no repeated data, you won't have data inconsistency\
    \ problems (like the circus/zoo problem).\n- The new database will take less space,\
    \ because there's no repeated data.\n- The operation is not necessarily tied to\
    \ an agent, so you won't accidentally delete an operation assigned to that mission\
    \ (remember, this could happen with the original data design).\n- If you need\
    \ to update operation data, you don't need to go through every agent to figure\
    \ out which ones were assigned to that operation (again, you would have had to\
    \ do this with the old database design).\n\nThe SQL used to create the operation\
    \ table is much like that used for the agent table:\n\n```\nCREATE TABLE operation\
    \ (\n  operationID int(11) NOT NULL AUTO_INCREMENT,\n  name varchar(50) default\
    \ NULL,\n  description varchar(50) default NULL,\n  location varchar(50) default\
    \ NULL,\n  PRIMARY KEY ('OperationID')\n);\n\nINSERT INTO operation VALUES(\n\
    \  null, 'Dancing Elephant',\n  'Infiltrate suspicious zoo', 'London'\n);\n```\n\
    \nAs you can see, the operation table conforms to the rules of normalization,\
    \ and it is also much like the agent table. Notice that I'm being very careful\
    \ about how I name things. SQL is (theoretically) case-insensitive, but I found\
    \ that this is not always true (especially in MySQL, where the Windows versions\
    \ appear not concerned about case, but UNIX versions will treat operationID and\
    \ OperationID as different field names). I specified that all field names will\
    \ use 'camel-case' (just like you've been doing with your PHP variables). I have\
    \ also named the key field according to my own formula (table name followed by\
    \ \"ID\")."
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Using a Join to Connect Tables


    The only downside to disconnecting the data tables is the necessity to somehow
    rejoin the data when needed. The user rarely doesn''t care that the operation
    and the agent are in different tables, he or she still will want the data to be
    visible as if they were on the same table. The necessity of re-attaching tables
    is a tool called the inner join. Take a look at the following SELECT statement
    in SQL:


    ```

    SELECT agent.name AS agent, operation.name AS operation

    FROM agent, operation

    WHERE agent.operationID = operation.operationID

    ORDER BY agent.name;

    ```


    At first glance this looks like an ordinary query, but it is a little different
    because it joins up data from two different tables. Table 9.5 illustrates the
    results of this query.


    | agent | operation |

    |---|---|

    | Blackford | Enduring Angst |

    | Bond | Dancing Elephant |

    | Cardinal | Enduring Angst |

    | Falcon | Dancing Elephant |

    | Rahab | Furious Dandelion |


    # Creating Useful Joins


    An SQL query can pull data from more than one table. To do this, there a a couple
    of basic rules.


    First, you might need to specify the field names rather than simply name. Notice
    that the SELECT statement specifies name. This is necessary because both tables
    contain a field called name. Using the table syntax is much like using a person''s
    first and last name. It''s not necessary if there''s no chance of confusion, but
    in a larger environment the more complete naming scheme can avoid confusion.


    Also, note the use of the AS clause. This provides an alias for the column and
    provides a nicer output.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'The FROM clause up to now has specified only one table. In this example, it''s
    necessary to specify that data will be coming from two different tables.


    # Examining a Join Without a WHERE Clause


    The WHERE clause helps to clarify the relationship between the two tables. As
    an explanation, consider the following query:


    ```

    SELECT

    agent.name AS ''agent'',

    agent.operationID as ''agent opID'',

    operation.operationID as ''op opID'',

    operation.name AS ''operation''

    FROM agent, operation

    ```


    This query is much like the earlier query, except it includes the operationID
    field from each table and it omits the WHERE clause. You might be surprised by
    the results.


    # Adding a WHERE Clause to Make a Proper Join


    Without a WHERE clause, all possible combinations are returned. The only records
    we''re concerned with are those where the operationID fields in the agent table
    and in the operation table have the same value. The WHERE clause returns only
    these values joined by a common operation ID.


    The secret to making this work is the operationID fields in the two tables. You''ve
    already learned that each table should have a primary key. The primary key is
    used to uniquely identify each record in a database. In operations, operationID
    is the primary key. In the agents table, agentID is the primary key. You might
    note my unimaginative but very useful naming convention here I was able to take
    all data that refers to the operation out of the agent by replacing fields with
    a field that points to the primary key of the operations table. A field that references
    the primary key of another table is called a foreign key. Primary and foreign
    keys cement the relationships between tables. See Table 9.6.'
  merge: -1
  pgno: 365
- img_proc: true
