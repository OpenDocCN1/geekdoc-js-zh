  md: '# Using Basic Regular Expressions


    While it would be possible to use string manipulation functions to determine which
    files to copy to the new array, there are many situations where you might want
    the ability to work with string data in a more detailed way. In this particular
    situation, I wanted all the files with "gif" or "jpg" in them. There isn''t an
    easy way to compare two possible values with normal string manipulations. Also,
    I didn''t want any filename containing these values, but only those that end with
    "gif" or "jpg". Regular expressions are a special convention used to handle exactly
    this kind of situation, and much more. To illustrate, I''ll explain how the /gif$|gif$/
    expression works. Regular expressions are usually marked by slashes at the beginning
    and the end. The first and last characters of the expression are these slices.
    The pipe (|) character indicates or, so I''m looking for "jpg" or "gif". The dollar
    sign ($) indicates the end of a string in the context of regular expressions,
    so "jpg$" will only match the value "jpg" if it''s at the end of a string. So,
    the expression /jpg$|gif$\$/ will match on any string that ends with "jpg" or
    "gif".


    Regular expressions are extremely powerful if a bit cryptic. PHP supports a number
    of special functions that use regular expressions in addition to the online help
    under `Regular Expression Functions – Perl compatible` for a list of these functions
    as well as more details on how regular expressions work in PHP. If you find regular
    expressions baffling, you can usually find a string function or two that will
    do the same general job. (See Table 6.2 for a list of basic regular expressions.)


