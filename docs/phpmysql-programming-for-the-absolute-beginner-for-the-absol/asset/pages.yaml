  md: '# # CHAPTER 7

    Using MySQL to Create Databases


    When you began programming in PHP, you started with very simple variables. Soon
    you learned how to do more interesting things with arrays and associative arrays.
    You added the power of files to gain tremendous new skills. Now you''ll learn
    how relational databases can be used to manage data. In this chapter you''ll learn
    how to build a basic database and how to hook it up to your PHP programs. Specifically,
    you''ll learn:


    +   - How to start the MySQL executable.

    - How to build basic databases.

    - The essential data definition SQL statements.

    - How to return a basic SQL query.

    - How to use SQLyog to manage your databases.

    - How to incorporate databases into PHP programs.'
