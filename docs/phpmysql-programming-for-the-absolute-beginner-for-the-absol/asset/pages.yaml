    The last possibility is a field is neither a primary nor secondary key. In this
    case, I will print a simple text box so the user can input the value of the field.
    In all cases, the output will reflect the current value of the field.


    # Working with the Primary Key


    The primary key value is much more important to the program than it is to the
    user. I decided to display it, but not to make it editable in any way. Primary
    keys should not be edited. They should only be changed by adding or deleting records.


    I decided to rely upon some conventions to determine whether a field is a primary
    key or not. I assumed that the first field of the record (field number 0) is the
    primary key. This is a very common convention, but it is not universal. Since
    I created with'
  merge: -1
