    As you can see, the structure of the data is the most important element of the
    game. You already know some ways to work with data, but this chapter introduces
    the notion of relational database management systems (RDBMS). An RDBMS is a system
    that helps programmers work with data. The adventure generator program uses a
    database to store and manipulate all the data.


    # ## Using a Database Management System


    Data is such an important part of modern programming languages that are devoted
    to manipulating databases. The primary standard for database base languages is
    Structured Query Language (SQL). SQL is a standardized language for creating databases,
    storing information into databases and retrieving this information. Special applications
    and programming environments specialize in interpreting SQL data and acting on
    it.


    Often a programmer will begin by creating a data structure in SQL, then will write
    a program in some other language (such as PHP) to access to the data. The PHP
    program can then formulate requests or updates to the data, which are passed on
    the SQL interpreter. This approach has a couple of advantages. First, once you
    learn SQL, you can apply it easily to a new programming language. Also, you can
    easily add multiple interfaces to an existing data set because many programming
    languages have access to an SQL interpreter. Many relational database management
    systems are available, but the MySQL environment is well suited'
  merge: -1
