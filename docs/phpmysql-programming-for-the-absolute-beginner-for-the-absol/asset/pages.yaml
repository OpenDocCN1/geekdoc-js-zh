  md: '# Using a while Loop


    PHP, like most languages, provides looping structure that is even more flexible
    than the for loop. The while loop can be used when you know how many times something
    will happen, just like the for loop. Figure 4.6 shows how a while loop can work
    much like a for loop:


    ![](img/f7bb260ce17b9d585cf5f10f69134213_151_0.png)


    Although the output of this program looks a lot like the basic for loop, it uses
    a different construct to achieve the same result.


    # Repeating Code with a while Loop


    The code for the while.php program is much like the for loop demo, but you can
    see that the loop is a little bit simpler:


    ```

    ```html

    <html>

    <head>

    <title>

    A simple While Loop

    </title>

    ```

    ```'
