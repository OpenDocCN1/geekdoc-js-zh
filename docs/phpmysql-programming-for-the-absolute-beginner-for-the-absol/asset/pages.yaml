    In the `<table>` tag, you can use the border attribute to indicate how thick the
    border will be the table.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_37_1.png)


    > Note that browsers are not consistent in their default values. If you don''t
    specify the border width, some browsers will show a border, and some will show
    no border at all. It''s best to specify a border width every time. If you don''t
    want a border, set the width to 0.'
