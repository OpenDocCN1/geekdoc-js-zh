    All the elements that will allow user interaction are placed inside a <form></form>
    pair. The most common form element is the <input> element, which comes in several
    flavors, designated by the type attribute.


    # Creating a Text Box


    The most common input element of all is the humble text box. To make a plain vanilla
    text box, I used the following code:


    ```

    <input type = "text"

    name = "txtName"

    value = "your text here">

    ```


    The element is a basic input element. By setting the type to "text", I''m signifying
    how the element is to be displayed on the screen—as something that the user can
    type into. An input element using the text type is usually called a text box.
    Text boxes cannot include multiple lines of text, but you can specify the length
    of'
