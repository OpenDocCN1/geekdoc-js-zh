- img_proc: true
  md: '# Examining the "Petals Around the Rose" Game


    The Petals Around the Rose game, featured in Figure 3.1 illustrates all the new
    skills you will learn in this chapter.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_103_0.png)


    FIGURE 3.1


    This is a new twist on an old dice puzzle.


    The premise of the Petals game is very simple. The computer rolls a set of five
    dice and asks the user to guess the number of "petals around the rose." The user
    enters a number and presses the button. The computer then indicates whether this
    value was correct, and provides a new set of dice. Once the user understands the
    secret, it''s a very easy game, but it can take a long time to figure out how
    it works. When you look at the code towards the end of this chapter, you''ll learn
    the secret, but for now you should try the game yourself before you know how it''s
    done.


    # Creating a Random Number


    The dice game, like many other games, relies on random number generation to make
    things interesting. Most languages have at least one way to create random numbers
    with the `rand` function.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Viewing the "Roll ''em" Program


    The roll ''em program shown in Figure 3.2 demonstrates how the rand function can
    be used to generate virtual dice.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_104_0.png)


    The code for the rollEm program shows how easy random number generation is.


    ```

    <html>

    <head>

    <title>Roll Em!</title>

    </head>

    <body>

    <h1>Roll Em!</h1>

    <h3>Demonstrates rolling a die</h3>


    <?

    $roll = rand(1,6);

