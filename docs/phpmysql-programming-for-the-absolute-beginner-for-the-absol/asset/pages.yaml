    | Rahab | 3 | 2 Enduring Angst |

    | Rahab | 3 | 3 Furious Dandelion |


    # Adding a Condition to a Joined Query


    Of course, you can still use the WHERE clause to limit which records are shown.
    Use the AND structure to build compound conditions. For example, this code:


    ```

    SELECT

    agent.name AS ''agent'',

    operation.name AS operation

    FROM agent, operation

    WHERE agent.operationID = operation.operationID

    AND agent.name LIKE ''B%'';'';

    ```


    will return the code name and operation name of every agent whose code name begins
    with “B.”'
