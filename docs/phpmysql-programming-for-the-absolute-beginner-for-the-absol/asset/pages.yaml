  md: "```\nprint \"</ul\\n\";\n\n?>\n\n</body>\n</html>\n```\n\nAll the values that\
    \ will be in the list are created in the $list variable using the array function.\n\
    \nThe foreach loop works like a for loop, except it is a bit simpler. The first\
    \ parameter of the foreach construct is an array (in this case, $list). The keyword\
    \ as then indicates the name of a variable that will hold each value in turn.\
    \ In this case, the foreach loop will step through the $list array as many times\
    \ as necessary. Each time through the loop, the foreach will populate the $value\
    \ variable with the current member of the $list array. In essence, the foreach\
    \ loop:\n\n```\nforeach ($list as $value) {\n    print \"<li>$value</li>\\n\"\
    ;n\n} // end foreach\n```\n\nworks just like the following traditional for loop:\n\
    \n```\nfor ($i = 0; $i < length($list); $i++) {\n    $value = $list[$i];\n   \
    \ print \"<li>$value</li>\\n\";n\n} // end for loop\n```\n\n![](img/f7bb260ce17b9d585cf5f10f69134213_188_0.png)\n\
    \n> The main difference between a foreach loop and a for loop is the presence\
    \ of the index variable ($i in this example). If you're using a foreach loop and\
    \ you need to know the index of the current element, you can use the key() function.\n\
    \nThe foreach loop can be an extremely handy shortcut for stepping through each\
    \ value of an array. Since this is a common task, knowing how to use the foreach\
    \ loop is an important skill. As you learn some other kinds of arrays, you'll\
    \ see how to modify the foreach loop to handle these other array styles.\n\n#\
    \ Creating an Associative Array\n\nPHP is known for its extremely flexible arrays.\
