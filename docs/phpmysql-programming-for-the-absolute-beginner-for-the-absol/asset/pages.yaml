    # Using str() to Search for One String

    Inside Another


    The next task is to determine if the first character of the word is a vowel. There
    are a number of approaches to this problem, but the easiest is to use a searching
    function. I created a string with all the vowels ("aeiouAEIOU") and then I searched
    for the existence of the $firstLetter variable in the word. The str() function
    is perfect for this task. It takes two parameters. The first parameter is the
    string you are looking for (given the appropriate name "haystack" in the online
    documentation). The second parameter is the string you are searching in (called
    the "needle"). To search for the value of the $firstLetter variable in the string
    constant aeiouAEIOU, I used the following line:


    ```

    if (strpos("aeiouAEIOU", $firstLetter))

    ```


    The str function returns FALSE if the needle was not found in the haystack. If
    the needle was found, it returns the position of the needle in the haystack parameter.
    In this case, all I''m really concerned about whether $firstLetter is found in
    the list of variables. If so, it''s a vowel, which will change the way I modify
    the word.


