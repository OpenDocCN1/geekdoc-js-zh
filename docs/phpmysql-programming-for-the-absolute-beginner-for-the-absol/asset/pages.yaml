    # Trimming a String with rtrim()


    Sometimes you split a string into an array, each element of the array will still
    have the split character at the end. In the pig Latin game, there will be a space
    at the end of each word, which can cause some problems later. PHP provides a function
    called rtrim() which automatically removes spaces, tabs, newlines, and other white
    space from the end of a string. I used the rtrim() function to clean off any trailing
    spaces from the end of a string, using the split() operation, and returned the
    results back to $theWord.


    ```

    $theWord = rtrim($theWord);

    ```


    ![](img/f7bb260ce17b9d585cf5f10f69134213_210_0.png)


    > In addition to rtrim(), PHP has ltrim(), which trims excess white space from
    the beginning of a string, and trim(), which cleans up both ends of a string.
    Also, there''s a variation of the trim command that allows you to specify exactly
    which characters are removed.


    # Finding a Substring with substr()


    The behavior of the algorithm depends on the first character of each word. I''ll
    also need to know all of the rest without the first character. The substr() function
    is useful for getting part of a string. It requires three parameters. The first
    argument is the string you want to get a piece from. The second parameter is which
    character you want to begin with (starting with zero as usual), and the third
    parameter is how many characters you want to extract.


    I got the first letter of the word with this line:


    ```

    $firstLetter = substr($theWord, 0, 1);

    ```


    It gets one letter from $theWord starting at the beginning of the word (position
    0). I then stored that value in the $firstLetter variable.'
