    # Examining the assoc.php Program


    Imagine that you want to store a list of capital cities. You could certainly store
    the cities in an array. However, if your main interest is in the relationship
    between a state and its capital, it could be difficult to maintain the relationship
    using arrays. In this particular instance, it would be nice if you could use the
    name of the state as the array index rather than a number.


    # Building an Associative Array


    Here is the code from assoc.php that generates the array of state capitals:


    ```

    $stateCap["Alaska"] = "Juneau";

    $stateCap["Indiana"] = "Indianapolis";

    $stateCap["Michigan"] = "Lansing";

    ```


    The associative array is just like a normal array, except the index values are
    strings. Note that the indices must be inside quotes. Once you have created an
    associative array, it is used much like a normal array, as well.'
