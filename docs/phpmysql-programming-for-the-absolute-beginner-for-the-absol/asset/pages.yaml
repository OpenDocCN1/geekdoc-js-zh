  md: '# Setting the Action Attribute to a Script File


    The other attribute of the form tag is the action attribute. This is used to determine
    the URL of a program that will interpret the page. This attribute is used to connect
    a Web page to a program to read and respond with another page. The URL can be
    an absolute reference (which begins with http:// and contains the entire domain
    name of the response program), or they can be relative references (meaning the
    program will be in the same directory as the Original Web page).


    The Name.html page contains a form with its action attribute set to User.php.
    Whenever the user clicks on the submit button, the values of all the fields (there''s
    only one in this case) will be packed up and sent to a program called User.php,
    which is expected to be in the same directory as the original Name.html.


    # Writing a Script to Retrieve the Data


    The code for User.php is specially built. The form that called User.php code is
    expected to have an element userName. Take a look at the code for User.php and
    you''ll see what I mean.


    > IN THE REAL WORLD


    Some PHP servers have turned off the ability to automatically create a variable
    from a form. You might be able to convince your server administrator to turn register_globals
    on the PHP.INI file. If not, here''s a workaround: If your form has a field called
    userName, add this code to the beginning of the program that needs the value of
    that field:


    ```

    $userName = $_REQUEST["userName"];

    ```


    Repeat this code for every variable you''ll need to pull from the original form.


    For a complete explanation of this code, you''ll need to skip ahead to Chapter
    5, “Better Arrays and String Handling.\ In that chapter, you''ll also find a routine
    for automatically extracting all the fields of a form even if you don''t know
    the names of the fields.


    ```

    <html>

    <head>

    <title>Hi User</title>

    </head>

    <body>

    ```'
