  md: '# Creating and Modifying a Table


    SQLyog provides visual tools to help you create and modify your tables. The phone
    list is way too mundane for my tastes, I''ll build a new table to illustrate the
    features of SQLyog. This new table contains a number of randomly generated heroes.
    Figure 7.11 shows the dialog used to create a table or alter its structure.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_305_0.png)


    FIGURE 7.11

    It''s easy to create a table and modify its structure with SQLyog.


    With SQLyog you can choose variable types from a drop-down list, and many field
    properties are available as checkboxes. Most of these options are not important
    for now. Note that id is set up as the primary key. When you are finished creating
    or modifying the table, the proper SQL code to perform the transaction is automatically
    generated and executed for you.


    > Special thanks to Lee Seitz and his hisuper Super-Hero generator at http://home.hiwaay.net/~lkseitz/comics/herogen/.


    Check this site out sometime when you''re bored.


    # Editing Table Data


