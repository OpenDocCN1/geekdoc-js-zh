  md: "The box can be checked or not checked. Here's the code used to create the checkboxes\
    \ in the selectForm.html page:\n\n```\n<input type = \"checkbox\">\n  name = \"\
    chkburger\">cholesto-burger\n<input type = \"checkbox\">\n  name = \"chkFries\"\
    >fries\n<input type = \"checkbox\">\n  name = \"chkrink\">drink\n```\n\nA checkbox\
    \ is simply an input element of type checkbox. Although you can specify the value\
    \ attribute of a checkbox, it isn't usually necessary as it is with other input\
    \ elements. Note that the caption next to the checkbox is plain html text. Each\
    \ checkbox is a completely independent entity. Even though several checkboxes\
    \ appear in the HTML document, the value of one checkbox has no bearing on the\
    \ value of any other checkboxes.\n\nCheckboxes are appropriate when any combination\
    \ of the various elements is appropriate. For example, the user might want the\
    \ burger, fries, and a drink. The user might want none of these things, or any\
    \ combination. Checkboxes are not appropriate when the options are mutually exclusive.\
    \ For example, asking what size a drink should be, only one size should be allowed\
    \ per drink. That kind of situation is a perfect place to use another feature\
    \ called radio buttons.\n\n# Selecting with Radio Buttons\n\nYou can use radio\
    \ buttons (sometimes called option buttons) to let the user choose an item from\
    \ several options. Radio buttons get their name from the radios on cars (at least\
    \ when I was a kid) that had several buttons sticking out. To select a station,\
    \ you pressed the corresponding button in, which caused all the other buttons\
    \ to pop out. HTML radio buttons have similar behavior. Radio buttons are grouped\
    \ so that when you select one button, all the others in the group are automatically\
    \ deselected.\n\nLook at the code for the radio buttons, and see if you can spot\
    \ how the radio elements are grouped.\n\n```\n<input type = \"radio\">\n  name\
    \ = \"size\"\n  value = \"small\">small\n```"
