    > You might be noticing a trend here. Most of the file access functions begin
    with the letter f (fopen(), fclose(), fputs(), gets(), feof()). This is a convention
    inherited from the C language. It can sometimes help you remember that a particular
    function works with files. Of course, every statement in PHP begins with f isn''t
    necessarily a file function (foreach is a good example), but most of the function
    names in PHP that begin with f are file-handling commands.


    The fputs() function requires two parameters. The first is a file pointer. This
