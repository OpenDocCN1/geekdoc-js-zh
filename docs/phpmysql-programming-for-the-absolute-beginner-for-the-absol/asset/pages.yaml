    are given $100 dollars of virtual money. On each turn, you bet two dollars. The
    computer will roll five dice. You can elect to keep each die or roll it again.
    On the second roll, the computer checks for various combinations. You can earn
    money back for rolling pairs, triples, four of a kind, and straights (five numbers
    in a row) Figures 4.1 and 4.2 illustrate the game in action.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_143_0.png)


    FIGURE 4.1


    After the first roll, you can choose to keep some of the dice by selecting the
    checkboxes underneath each die.


    The basic concepts of this game are much like the ones you used in the earlier
    programs. Keeping track of all five dice can get very complicated, so this program
    uses arrays and loops to manage all the information.


    # Counting with the for-Loop


    Computers are good at repetitive behavior. There are many times you might want
    the computer to repeat some sort of action multiple times. For example, take a
    look at the simpleFor.php program shown in Figure 4.3.'
