  md: "# Building an Associative Array with the array() Function\n\nIf you know the\
    \ values you want to have in your array, you can use the array() function to build\
    \ an associative array. However, building associative arrays requires a slightly\
    \ different syntax than the garden varieties you encountered in the last chapter.\
    \ I build the $worldCap array using the array() syntax:\n\n```\n$worldCap = array(\n\
    \    \"Albania\"->\"Tirana\",\n    \"Japan\"->\"Tokyo\",\n    \"United States\"\
    ->\"Washington DC\"\n);\n```\n\nWhen you are building an ordinary array, the array()\
    \ function requires the data, but doesn't require you to specify the indices.\
    \ It automatically generates the index of each element by grabbing the next available\
    \ integer. In an associative array, you are responsible for providing both the\
    \ data and the index. The general format for this assignment uses a special kind\
    \ of assignment operator. The => operator an element holds some kind of value.\
    \ Generally read it as “holds,” so you can say “Japan holds Tokyo.” In other words,\
    \ “Japan” => “Tokyo” indicates that PHP should generate an array element with\
    \ the index “Japan” and store the value “Tokyo” in that element. You can access\
    \ the value of this array just like any other associative array.\n\n```\nprint\
    \ \"Japan\":\nprint $worldCap[\"Japan\"];\nprint \"br>\";\n```\n\n# foreach with\
    \ Associative Arrays\n\nThe foreach loop is just as useful with associative arrays\
    \ as it is with the vanilla kind. However, it uses a slightly different syntax.\
    \ Take a look at this code from assoc.php page:\n\n```\nforeach ($worldCap as\
    \ $country => $capital){\n    print \"$country: $capital<br>\\n\";\n} // end foreach\n\
    ```\n\nA foreach loop for a regular array uses only one variable because the index\
    \ can be easily calculated. In an associative array, each element in the array\
    \ will have a"
