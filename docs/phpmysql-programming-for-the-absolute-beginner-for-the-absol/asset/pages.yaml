    # Working with Basic Arrays


    Programming is about the combination of control structures (like loops) and data
    structures (like variables). Now it''s time to look at a data structure that works
    naturally with loops. Arrays are special variables made to hold lists of information.
    PHP makes it quite easy to work with arrays. Look at Figure 4.7. This program,
