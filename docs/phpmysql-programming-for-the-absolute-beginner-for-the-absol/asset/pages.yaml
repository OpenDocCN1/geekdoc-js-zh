  md: '# Working with Multiple Field Queries


    As one more practical example, the code for the National Weather Service link
    looks like this:


    ```

    <a href="http://www.crh.noaa.gov/data/forecasts/INZ039.php?warnounty=INCO57&city=Noblesville">

    National Weather Service Forecast/</a>

    ```


    for Noblesville, Indiana.


    While this link looks a little more complex, it didn''t require any special knowledge.
    I searched the National Weather Service Web site until I found the automatically
    generated page for my hometown. When I looked at the URL that resulted, I was
    pleased (but not surprised) to see that the page was generated by a PHP script.
    (Note the .php extension in the URL.) I copied the link from my browser and incorporated
    it into linkDemo.html. The weather page is automatically created by a PHP program
    based on two inputs (the county and city name). Any time I want to see the local
    weather, I can re-call the query even though the request doesn''t come directly
    from the National Weather Service. This is a really easy way to customize your
    Web page.


    In the last paragraph I mentioned that the PHP program requires two fields. I''ve
    never actually seen the program, but I know this because I looked carefully at
    the URL. The part that says county=INCO57 indicates the state and county (at least
    that''s a reasonable guess), and the city=Noblesville indicates which city within
    the county I''m interested in. When a form has two or more input elements, they
    are attached to each other with the ampersand (&) as you can see in the National
    Weather Service example.


    # Reading Input from Other Form Elements


    A PHP program can read the input from any type of HTML form element. In all cases,
    the name attribute of the HTML form object becomes a variable name in PHP. In
    general, the value of the PHP variable comes from the value property of the form
    object.


    # Introducing the borderMaker program


    To examine most of the various form elements, I built a simple page to demonstrate
    various attributes of Cascading Style Sheet borders. The HTML program is shown
    in Figure 2.13.'
