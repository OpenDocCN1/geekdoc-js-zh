- img_proc: true
  md: 'to working with PHP. However, the basic concepts of SQL remain the same not
    what type of database you are working on. Most of the SQL commands described in
    this chapter without modification in Microsoft Access, Microsoft SQL Server, and
    Oracle, as well as a number of other RDBMS packages.


    I''ll begin this chapter by explaining how to create a simple database in MySQL.
    There are a number of ways to work with this package, I''ll start showing you
    how to write a script that builds a database in a text file. I''ll use the SQL
    language, which is different in syntax and style from PHP. Then I will show you
    SQLyog, a wonderful front-end package for working with MySQL databases. In Chapter
    8, "Connecting to Database Within PHP," I''ll show you how to contact and manipulate
    your MySQL database from within PHP.


    # Working with MySQL


    There are a number of RDBMS packages available. These programs vary in power,
    flexibility, and price. They all work in essentially the same way. For this book,
    most examples will use the MySQL database. This program is very frequently paired
    with PHP for a number of reasons. First, MySQL is a very powerful program in its
    own right. It handles a large subset of the functionality of the most expensive
    and powerful database packages. It uses a standard form of the well-known SQL
    data language. MySQL is released under an open source license, and is available
    for free. It works on many operating systems, and with many languages. It works
    very quickly and works well even with large data sets. PHP ships with a number
    of functions designed to support MySQL databases.


    # Installing MySQL


    If you used PHP to install Apache and PHP, you probably installed MySQL as well.
    If you are working on a Web server that you do not control, you''ll need to check
    with your server administrator to see if MySQL is installed. If your server supports
    PHP, it''s very likely that it also supports MySQL, as these two programs are
    frequently installed together.


    # Using the MySQL Executable


    MySQL is actually a number of programs. It has a server component that is always
    running, as well as a number of utility programs. The MySQL command line console
    shown in Figure 7.5 is a basic program run from the command line. It isn''t a
    very pretty program, but it provides powerful access to the database engine.'
