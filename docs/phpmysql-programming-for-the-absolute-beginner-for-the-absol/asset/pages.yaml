    # Using CSS to Enhance Your Pages


    Basic HTML is easy to write, but it creates pages that are dull. Modern browsers
    supporting cascading style sheets (CSS) elements, which allow you to specify how
    to display a particular tag. Entire books have been written about CSS, but the
    basic ideas are reasonably simple. You can define a style, which is a set of formatting
    rules, and attach it to various elements in your pages. An example will help clear
    things up.


