  md: '# Ensuring That Your Server Supports PHP


    A page written in PHP can be identical to an HTML page. Both are written with
    a plain text editor, and stored on a Web server. A PHP program can have <script>
    elements embedded in the page. When the user requests a PHP page, the server first
    examines the page and executes any script elements before it sends the resulting
    HTML to the user. This will only work if the server has been configured to use
    the PHP language. You might need to check with your server administrator to see
    if this is supported. On a home computer, you can use the PHP Tripod software
    installed on the CD-ROM that accompanies this book to set up all the necessary
    components.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_57_0.png)


    To run all the programs in this book, your server needs to have three components
    installed. First, you will need a Web server such as Microsoft IIS or Apache.
    Secondly, you''ll need the PHP interpreter, which is a program that reads PHP
    files and converts them into HTML pages. Finally, you''ll need a database management
    program to handle data. PHP triad integrates all these features into one installation.
    It includes the Apache (free and very powerful) Web server, the PHP interpreter,
    and the MySQL database management system. This package is very typical of most
    servers that use PHP. If the Web host you are using does not yet support PHP,
    you can still install the programs and practice on your own machine (although
    nobody your computer will be able to get to your programs).


    # Adding PHP Commands to an HTML Page


    The easiest way to determine if PHP exists on your server is to write a simple
    PHP program and see if it works. Here''s a very simple PHP program.


    ```

    <html>

    <head>

    <title>Hello in PHP</title>

    </head>

    <body>

    <h1>Hello in PHP</h1>

    </body>

    <?php

    print "Hello, world!";

    ```'
