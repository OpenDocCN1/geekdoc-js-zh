  md: 'the text box with the size attribute. (If you set the size to 20, you are allowing
    for

    roughly 20 characters.) It is important to add a name attribute to your text boxes

    (and indeed to include all elements) because later you are going to be writing
    pro-

    grams that try to retrieve information from the form. These programs will use
    the

    various form element names to refer to what the user typed in.


    # TRICK


    Naming an input element is something of an art form. The name should be reason-ably
    descriptive (r or albert are usually not good input object names, because they
    don''t explain what kind of information is expected to be in the object) Object
    names should not have spaces in them, because this will cause confusion later.
    You''ll learn more about this in the next chapter when you begin working with
    variables, which have a very close relationship to form elements in PHP.


    The value attribute is used to set a default value for the text area. This is
    the value that will appear in the text area when the user first sees your form.
    It’s a good idea to put default values in forms when you can, because this gives
    you a chance to show the user what kind of information you''re expecting.


    # Creating a Text Area


    Text boxes are very handy, but sometimes you will want to let the user type in
    more than one line’s worth of information. For example, you might want to have
    a feedback page where the user can type in some comments to be e-mailed back to
    you. For this kind of situation, you will usually want to use an object called
    the text area. The code to create such an element looks like this:


    ```

    <textarea name = "txtInput"

    rows = 10

    cols = 40>

    ```


    This is the stuff inside the textarea

    </textarea>


    The text area is created using a pair of <textarea></textarea> tags. The text
    area has a name attribute, as well as attributes for determining the size of the
    text box in rows and columns. Text areas should also be named using the name attribute,
    but the textarea object does not have a value attribute. Instead, anything between
    the <textarea> and </textarea> tags is considered the contents of the text area.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Don''t forget to close the textarea with a </textarea> tag. If you don''t,
    everything in the page after the <textarea> tag will appear inside the text area
    if the page renders at all!


    # Building a Password Field


    Password fields are almost identical to text boxes. The code for creating a password
    is very much like the text field:


    ```

    <Input type = "password"

    name = "secret"

    value = "you can''t read this">

    ```


    The only real difference between the password field and the text box is that the
    value typed into a password field is shown as asterisks on the screen. Presumably
    this will keep the KGB from peering over the shoulders of your users while they
    type passwords into your pages.


    > It''s critical to note that the password field offers virtually no security.
    As you will learn in the next chapter, the information that is sent to the server
    via a password field is transmitted entirely in the clear, so it is only nominally
    secret.


    # Making a Hidden Field


    Believe it or not, the text box has an even more secretive cousin than the password
    field. The hidden field is much like the text box in code, but it doesn''t appear
    on the page at all. Here''s how the code looks:


    ```

    <Input type = "hidden"

    name = "mystery"

    value = "secret formula">

    ```


    The uses for a field that are hidden from the user might not be obvious now, but
    it does come in handy when you want your page to communicate with a server-side
    program but you don''t need the user to know all the details. (I''ll show you
    an example soon, I promise.)'
  merge: -1
