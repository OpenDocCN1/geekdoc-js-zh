    > IN THE REAL WORLD

    PHP provides some other variables related to $_REQUEST. The $_HTTP_POST_VARS array
    holds all the names and values sent through a POST request, and $_GET_VARS array
    holds names and values sent through a GET request. You can use this feature to
    make your code more secure. If you create variables only from the $_HTTP_POST_VARS
    array, all input sent via the GET method will be ignored. This will make it harder
    for users to forge data by putting field names in the browser''s address bar.
    Of course, a clever user can still write a form that contains bogus fields, so
    you always have to be a little suspicious whenever you get any data from the user.


