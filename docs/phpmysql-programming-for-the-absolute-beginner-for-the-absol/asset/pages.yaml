  md: '# CHAPTER

    Data Normalization


    In the last two chapters you learned how to create a basic database and connect
    it to a PHP program. PHP and MySQL are wonderful for working with basic databases.
    However, most real-world problems involve data that is too complex to fit in one
    table. Database designers have developed some standard techniques for handling
    complex data that reduce redundancy, improve efficiency, and provide flexibility.
    In this chapter you will learn how to use the relational model to build complex
    databases involving multiple entities. Specifically, you will learn:


    +   * How the relational model works.

    * How to build use-case models for predicting data usage.

    * How to construct entity-relationship diagrams to model your data.

    * How to build multi-table databases.

    * How joins are used to connect tables.

    * How to build a link table to model many-to-many relationships.

    * How to optimize your table design for later programming.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Introducing the Spy Database


    In this chapter you will build a database to manage your international spy ring.
    (You do have an international spy ring, don''t you?) Saving the world is a complicated
    task, so you''ll need a database to keep track of all your agents. Secret agents
    are assigned to various operations around the globe, and certain agents have certain
    skills. The examples in this chapter will take you through the construction of
    such a database. You''ll see how to construct the database in MySQL. In the final
    chapter, you''ll use this database to make a really powerful spymaster application
    in PHP.


    The spy database reflects a few facts about my spy organization (called the Pan-theon
    of Humanitarian Performance, or PHP):


    +   * Each agent has a code name.

    * Each agent can have any number of skills.

    * More than one agent can have the same skill.

    * Each agent is assigned to one operation at a time.

    * More than one agent can be assigned to one operation.

    * The location of a spy is determined by the operation.

    * Each operation has only one location.


    This list of rules helps to explain some characteristics of the data. In database
    parlance, they are called business rules. I''ll need to design the database so
    that these rules are enforced.


    | IN THE REAL WORLD |

    | set up this particular set of rules in a somewhat arbitrary way because they
    help make my database as simple as possible while illustrating most of the main
    problems you''ll encounter in data design. Usually you don''t get to make up business
    rules. Instead, you''ll need to learn them by talking to those who use the data
    every day. |


    # The badSpy Database


    As you learned in Chapter 7 “Using MySQL to Create Databases,” it isn''t difficult
    to build a data table, especially if you have a tool like SQLYog. Figure 9.1 illustrates
    the schema of my first pass at the spy database.'
