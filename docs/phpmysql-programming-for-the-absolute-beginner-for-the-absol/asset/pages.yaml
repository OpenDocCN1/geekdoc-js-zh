  md: 'It''s important to recognize that two different pages are involved in the transaction.
    In this section, you''ll learn how to link an HTML page to a particular script,
    and how to write a script that expects certain form information.


    # Building an HTML Page with a Form


    Forms are very useful when you want to get information from the user. To illustrate
    how this is done, look at the code for the whatsName.html file.


    ```

    <html>

    <head>

    <title>What''s your name?</title>

    </head>

    <body>

    <h1>What''s your name?</h1>

    <h3>Writing a form for user input</h3>

    <form method="post" action="hiUser.php">

    Please type your name:

    <input type="text" name="userName" value="">

    <br>

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    There is only one element of this page that may not be familiar to you. Take a
    careful look at the form tag. It contains two new attributes. The method attribute
    indicates how the data will be sent to the browser. There are two primary methods,
    get and post. The post method is the most powerful and interesting way, so it
    is the one I use most often in this book. However, you''ll see some interesting
    ways to use the get method later in this chapter in the section called “Sending
    Data without a Form.”'
