- img_proc: true
  md: '# Initializing a Sentry Variable


    for loops usually involve an integer variable. Sometimes the key variable in a
    loop is referred to as a sentry variable, because it acts like a gatekeeper to
    the loop. The first part of a loop definition is a line of code that identifies
    the sentry variable and initializes it to some starting value. In the simple loop
    demo, the initialization segment looks like this:


    ```

    $$ = 0;

    ```


    It specifies that the sentry variable will be called $$$, and its starting value
    will be zero.


    > IN THE REAL WORLD

    You might wonder why the sentry variable is called $$$. Like most variables, it''s
    really best if sentry variables have a name that suits their purpose. Sometimes,
    however, a for loop is simply an integer, and it doesn''t really have any other
    meaning. In those situations, an old programming tradition is often called into
    play. In the Fortran language (one of the earliest common programming languages)
    integer variables had to begin with the letters "i," "j," and a few other characters.
    Fortran programmers would commonly use "i" as the name of their generic sentry
    variables. Even though modern programmers have never written a line of Fortran
    code, the tradition remains. It''s amazing how much folklore exists in such a
    relatively new activity as computer programming.


    Computer programs frequently begin counting with zero, so I initialized $$ as
    well.


    > TRICK Although the $$ = 0; segment looks like (and is) a complete line of code,
    usually placed on the same line as the other parts of the for loop construct.


    # Setting a Condition to Finish the Loop


    Getting a computer to repeat behavior is actually the easy part. The harder task
    comes when you try to get the computer to stop correctly. The second part of the
    loop construct is a condition. When this condition is evaluated as true, the loop
    should continue. As soon as the condition is evaluated to false, the loop should
    exit. In this case, I set the condition as $$ < 10; This means that as long as
    the variable $$ has a value less than 10, the loop continues. As soon as the program
    detects that $$ has a value equal to or larger, the loop exits. Usually for a
    loop''s condition checks the sentry variable against some terminal value.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Changing the Sentry Variable


    The final critical element of a for loop is some mechanism for changing the value
    of the sentry variable. At some point the value of $i must become 10 or larger,
    or the loop will continue forever. In the basicLoop program, the part of for structure
    which makes this happens like $++. The notation ++ is just like saying ''add one
    to $i, or $i = $i+1. The ++ symbol is called an increment operator because it
    provides an easy way to increment (add one) to a variable.


    # Building the Loop


    Once you''ve set up the parts of the for statement all the loop itself is easy
    to use. Place braces {} around the loop code and indent all code that will be
    inside the loop. You can have as many lines of code as you wish inside it, including
    branching statements and other loops. The sentry variable will have special behavior
    inside the loop. It will begin with the initial value. Each time the loop repeats,
    it will be changed as specified in the for structure, and the interpreter will
    check the condition to ensure that''s still true. If so, the code in the loop
    will occur again. In the case of the basicArray program, $i begins as zero. The
    first print statement occurs, it prints zero, because that is the current value
    of $i. When the interpreter reaches the right brace that ends the loop, it increments
    $i by one and then (follow-ing the ++++ directive in the for structure) and checks
    the condition ($i < 10). Because 0 is less than 10, the condition is true, and
    the code inside the loop occurs again. Eventually, the value of $i becomes 10,
    so the condition ($i < 10) is no longer true. Program control then reverts to
    the next line of code after the end of the Loop, which ends the program.


    # Modifying the Loop


    Once you understand the basics of the for loop structure, you can modify it in
    a couple of interesting ways. You can build a loop that counts by fives, or one
    that counts backwards.


    # Counting by Fives


    The countByFive.php program shown in Figure 4.4 illustrates a program that counts
    by fives.'
