    Hyperlinks are the elements that allow your user to move around on the Web by
    clicking on specially designated text. The <a> tag is used to designate a hyperlink.
    The <a> tag almost always includes an href attribute, which indicates an address.
    The user will be redirected to wherever address is indicated in this address when
    he clicks on the link. The text (or other html) between the <a> and </a> tags
    will be designated as the hyperlink. That text will appear as a link (usually
