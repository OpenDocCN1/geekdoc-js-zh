- img_proc: true
  md: "# THE TRUTH ABOUT INNER JOINS\n\nYou should know that the syntax I provided\
    \ here is a convenient shortcut supported by most DBMS systems. The formal syntax\
    \ of the inner join looks like this:\n\n```\nSELECT agent.name, operation.name\n\
    FROM\n  agent INNER JOIN operation\nON agent.OperationID = operation.OperationID\n\
    ORDER BY agent.name;\n```\n\nMany data programmers prefer to think of the join\
    \ as part of the WHERE clause and use the WHERE syntax. A few SQL databases (notably\
    \ many offerings from Microsoft) do not allow the WHERE syntax for inner joins,\
    \ and require the INNER JOIN to be specified as part of the FROM clause. When\
    \ you use INNER JOIN syntax, the ON clause indicates how the tables will be joined.\n\
    \n# Building a Link Table for Many-Many Relationships\n\nOnce you've created an\
    \ ER diagram, you can create new tables to handle all the one-to-many relationships.\
    \ It's a little less obvious what to do with many-to-many relationships such as\
    \ the link between agents and skills. Recall that each agent can have many skills,\
    \ and several agents can use each skill. The best way to handle this kind of situation\
    \ is to build a special kind of table.\n\n# Enhancing the ER Diagram\n\nFigure\
    \ 9.5 shows a new version of the ER diagram that eliminates all many-many relationships.\n\
    \n![](img/f7bb260ce17b9d585cf5f10f69134213_367_0.png)"
  merge: -1
  pgno: 367
- img_proc: true
  md: 'The ER diagram featured in Figure 9.5 improves on the earlier version in a
    number of ways. First, I added (PK) to the end of every primary key. I also added
    (FK) to the end of every foreign key. The placements of the lines in the diagram
    are now much more important. I now draw a line between a foreign key reference
    and the corresponding primary key in the other table. Every relationship should
    go between a foreign key reference in one table and a primary key in the other.
    The other main improvement is the addition of the agent_specialty table. This
    table is interesting because it contains nothing but primary and foreign keys.
    Each entry in this table represents one link between the agent and specialty tables.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_368_0.png)


    Most tables in a relational database are about entities in the data set, but link
    tables are about relationships between entities.


    All the actual data referring to the agent or specialty are encoded in other tables.
    This arrangement provides a great deal of flexibility.


    # Creating the specialty Table


    The specialty table is actually extremely simple, as shown in Table 9.7.


    | Table 9.7 THE SPECIALTY TABLE |

    | specialtyID | name |

    | 0 | Electronics |

    | 1 | Counterintelligence |

    | 2 | Sabotage |

    | 3 | Doily Design |

    | 4 | Explosives |

    | 5 | Flower Arranging |


    As you can see, there is nothing in the specialty table that connects it directly
    with any particular agent. Likewise, you''ll find no references to specialties
    in the agent table. The complex relationship between these two tables is handled
    by the new agent_specialty table. This special kind of table is called a link
    table because it is used to manage the relationships between other tables. Table
    9.8 shows a sample of data in the agent_specialty table.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# TABLE 9.8 THE AGENT SPECIALTY TABLE


    | agent_specialty_ID | agentID | specialtyID |

    | 1 | 1 | 2 |

    | 2 | 1 | 3 |

    | 3 | 2 | 1 |

    | 4 | 2 | 6 |

    | 5 | 3 | 2 |

    | 6 | 4 | 4 |

    | 7 | 4 | 5 |


    # Interpreting the agent_specialty Table with a Query


    Of course, the agent_specialty table is not directly useful to the user, because
    it contains nothing but foreign key references. You can translate the data to
    something more meaningful with an SQL statement:


    ```

    SELECT agent_specialtyID,

    agent.name AS ''agent'',

    specialty.name AS ''specialty''

    FROM agent_specialty,

    agent,

    specialty

    WHERE agent.agentID = agent_specialty.agentID

    AND specialty.specialtyID = agent_specialty.specialtyID;

    ```


    It requires two comparisons to join the three tables. agent and agent_specialty
    by common agentID values. It''s also necessary to secure the bond between specialty
    and agent_specialty by comparing the specialtyID fields. The results of such a
    query show that the correct relationships have indeed been joined, as you can
    see in Table 9.9.


    The link table provides the linkage between tables that have many-to-many relationships.
    Each time you want a new relationship between an agent and a specialty, you add
    a new record to the agent_specialty table.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '| TABLE 9.9 QUERY INTERPRETATION OF AGENT SPECIALTY TABLE |

    | agent_specialtyID | agent | specialty |

    | --- | --- | --- |

    | 1 | Bond | Sabotage |

    | 2 | Bond | Doily Design |

    | 3 | Falcon | Counterintelligence |

    | 5 | Cardinal | Sabotage |

    | 6 | Blackford | Explosives |

    | 7 | Blackford | Flower Arranging |


    # # Creating Queries That Use Link Tables


    Whenever you want to know about the relationships between agents and specialties,
    the data is available in the `agent_specialty` table. For example, if you need
    to know which agents know flower arranging, you can use the following query:


    ```

    SELECT

    agent.name

    FROM

    agent,

    specialty,

    agent_specialty

    WHERE agent.agentID = agent_specialty.agentID

    AND agent_specialty.specialtyID = specialty.specialtyID

    AND specialty.name = ''Flower Arranging'';",

    ```


    This query looks a little scary, but it really isn''t as bad as it looks. This
    query requires data from three different tables. The output will need the `name`
    from the `agent` table. I don''t want to remember what specialty number is associated
    with "Flower Arranging," so I''ll let the query look up from the `specialty` table.
    Since I need to know which agent is associated with a particular specialty, I''ll
    use the `agent_specialty` table to link up the other two tables. The `WHERE` clause
    simply provides the phrase


    agents.agentID = agent_specialty.agentID

    cements the relationship between agents and agent_specialty. Likewise,

    agent_specialty.specialtyID = specialties.specialtyID'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'ensures the connection between specialties and agent_specialty. The last part
    of WHERE clause is the actual conditional part of the query that only returns
    records where the specialty is flower arranging. (You know, flower arrangement
    can be a deadly art in the hands of a skilled practitioner...)


    #  Summary


    In this chapter you have moved beyond programming to an understanding of data,
    the real fuel of modern applications. You learned how to take a poorly designed
    table and convert it into a series of well-organized tables that can avoid a lot
    of data problems. You''ve learned about three stages of normalization. You''ve
    learned how to build an Entity-Relationship diagram. You can recognize three kinds
    of relationships between entities. You can build normalized tables in SQL, including
    pointers for primary and foreign keys. You can connect normalized tables with
    INNER JOIN SQL statements. You know how to simulate a many-to-many relationship
    by building a link table. The civilized world is safer for your efforts.


    #  CHALLENGES


    +   1. See if you can locate ER diagrams for data you work with every day. (Check
    with your firm’s CIS department.) Examine these documents and see if you can make
    sense of them.

    2. Examine a database you use regularly. Determine if it follows the requirements
    stated in this chapter for a well-designed data structure. If not, explain what
    might be wrong with the data structure and how it could be corrected.

    3. Design an improved data structure for the database you examined in the last
    question. Create the required tables in SQL and populate them with sample data.

    4. Design a database for data you use every day. (Be warned, most data problems
    are a LOT more complex than they first appear.) Create a data diagram, then build
    the tables and populate with sample data.'
  merge: -1
