    # ACQUIRING IMAGES


    The dice games in this chapter demonstrate the power of graphical images to make
    your programs more interesting and fun. There are a number of ways to get graphics
    for your programs. The easiest is to find an existing image on the Web. Although
    this is technically very simple, many of the images on the Web are owned by somebody,
    so you should try to respect the intellectual property rights of the original
    owners. Try to get permission for any images you use.


    Another alternative is to create the graphics yourself. Even if you don''t have
    any artistic talent at all, modern software and technology can make it quite easy
    to generate passable graphics. You can do a lot with a digital camera and a freeware
    editor. If you hire a professional artist to do graphics for your program, you
    might still need to be able to sketch what you are looking for. We''ve added a
    couple of very powerful freeware image editing programs to the CD-Rom that accompanies
    this.


    # Using the if Statement to Control Program Flow


    One of the most interesting things computers do is appear to make decisions. The
    decision-making ability of the computer is really an illusion. The programmer
    stores very specific instructions inside a computer, and it acts only on those
    instructions. The simplest form of this behavior is a structure called the if
    statement.


    # Introducing the Ace Program


    I''ll slightly modify the “roll-em” program to illustrate how it can be improved
    with an if structure. Figure 3.3 shows the program when the program rolls any
    value except one.


    However, this program does something exciting (okay, moderately exciting) when
    it rolls a one, as you can see from Figure 3.4.'
