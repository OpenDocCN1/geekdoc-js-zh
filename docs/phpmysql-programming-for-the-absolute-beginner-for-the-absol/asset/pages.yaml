  md: '# Drive systems are much slower than computer memory, they take a long time
    to spool up to speed. For that reason, when a program encounters an fputs() command,
    it doesn''t always immediately save the data to a file on the disk. Instead, it
    adds the data to a special buffer and only writes the data when sufficient amount
    is on the buffer or the program encounters an fclose() command. This is why it
    is important to close your files. If the program ends without encountering an
    fclose() statement, PHP is supposed to automatically close the file for you, but
    what''s supposed to happen and what actually happens are often two very different
    things.


