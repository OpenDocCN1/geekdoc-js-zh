- img_proc: true
  md: 'SELECT *

    FROM hero

    WHERE weapon = ''Laser Pointer'';

    returns only the rows matching a specific condition.


    # Adding a Condition with a WHERE Clause


    You can add a WHERE statement to a query to specify which row rows you want to
    see. The database manager will check every record in the table. If the condition
    is true for that record, it will be included in the result set. The conditions
    in a WHERE clause are similar to those in PHP code, but they are not exactly the
    same. In SQL, the single equal sign (=) is used for equality. Text elements are
    encoded in single quotes. (''). You can also use <, >, <= or >= and ! conditions
    to limit your search.


    The usage of comparison operators is pretty easy to understand for numeric data,
    such as integers and real numbers. It''s not so obvious how a language will treat
    text comparisons. SQL has developed some standard rules, but each implementation
    might be something different. SQL generally works in a case-insensitive way, so
    ''Yak-Bot'' would match ''yak-bot'' or ''yAK-bOT''. Also, the < and > operators
    refer to alphabetical order,


    ![](img/f7bb260ce17b9d585cf5f10f69134213_313_0.png)


    ```

    SELECT *

    FROM hero

    WHERE name < ''D'';

    will select all the records where the hero''s name starts with "A", "B", or "C".

    ```


    # Using the LIKE Clause for Partial Matches


    Often you will not know the exact value of a field you are trying to match. The
    LIKE clause allows you to specify partial matches. For example, you might wish
    to know which heroes have some sort of super power. This query


    ```

    SELECT *

    FROM hero

    WHERE power LIKE ''Super%'';

    will return each hero whose power begins with the value "Super." The percent sign
    (%) can be used as a wild card to indicate any number of characters.

    ```'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'can use a variation of the LIKE clause to find information about all heroes
    with transportation scheme that starts with the letter “B.”


    ```

    SELECT name, transportation

    FROM hero

    WHERE transportation LIKE ''B%'';

    ```


    You can also use the underscore character (\_) to specify one character.


    > TRICK


    The simple wildcard character support in SQL is sufficient for many purposes.
    If you like regular expressions, you can use the REGEXP clause to specify whether
    a field matches a regular expression. This is a very powerful tool, but it is
    an extension to the SQL standard. It works fine in MySQL, but it is not supported
    in all SQL databases.


    # Generating Multiple Conditions


    You can combine conditions with AND, OR, and NOT keywords for more complex expressions.
    For example,


    ```

    SELECT *

    FROM hero

    WHERE transportation LIKE ''B%''

    AND power LIKE ''%super%''

    ```


    selects those heroes whose transportation starts with “B” and have a power with
    “super” in its name.


    This capability to create compound expressions will be very useful as you build
    more complex databases with multiple tables.


    # Using the ORDER BY Clause to Sort Results


    One more nifty feature of the SELECT statement is the ability to sort the results
    by any field. Figures 7.22 and 7.23 illustrate how the ORDER BY clause can determine
    how tables are sorted.


    The ORDER BY clause allows you to determine how the data is sorted. You can specify
    any field you wish as the sorting field. As you can see in Figure 7.23, the DESC
    clause specifies that data should be sorted in descending order.'
