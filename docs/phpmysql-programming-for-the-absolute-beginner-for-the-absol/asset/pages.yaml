    The three different types of buttons look the same but behave differently. When
    you set the type attribute of an input element to button, you are creating a generic
    button. These buttons are frequently used in client-side programming. To make
    something happen when the user clicks on a button, you''ll need to embed code
    in your Web page using a language such as JavaScript or VBScript. (Of course,
    there are exceptional books in the Absolute Beginners'' series describing exactly
    how to do this.) Server-side programming (which is the focus of this book) rarely
    involves the ordinary button object.


    The reset button is used to let the user reset the page to its default condition.
    This is a handy feature to add to a program, because it lets the user back if
    the page got messed up. It isn''t necessary to write any code for the reset button,
    because the browser automatically handles the resetting behavior.


    The Submit button style is by far the most important kind of button for server-side
    programming that we will do in this book. The Submit button provides the link
    between Web pages and your programs. Most interactions in server-side programming
    involve sending an HTML page with a user to use. When the user has finished making
    selections and typing values into the various form elements, he or she presses
    the Submit button, which essentially bundles all the data in the form elements
    and sends them to a program. In the next chapter, you''ll learn how to make this
    actually work, but now for it''s important to know how to add a Submit button
    to your forms, because many pages will use this type of element.


    # Adding PHP to Your Pages


    All this HTML is nice, but presumably you''re here to learn PHP, so it''s high
    time to add PHP code to a page. PHP can be used to add characteristics to your
    page that aren''t typically possible with normal HTML and CSS.'
