    \ library. If you want PHP code in your library file, you'll need to surround\
    \ your code with PHP tags (<? ?>) in the library file.\n\n# Setting System-Wide\
    \ Variables\n\nAnother huge advantage of a library file is the ability to set\
    \ and use variables that will have meaning throughout the entire system. Since\
