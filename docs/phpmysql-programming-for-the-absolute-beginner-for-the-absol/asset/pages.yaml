  md: 'The badWhile.php program has a subtle but deadly error. Look carefully at the
    source code and see if you can spot it. The code is just like the first while
    program, instead of incrementing $i$, I incremented $j. The variable $j has nothing
    to do with $i$, and $j$ never changes. The loop keeps going on forever, because
    it cannot end until $i is greater than or equal to ten, which will never happen.
    This program is an example of the classic "endless loop." Every programmer alive
    has written them accidentally, and you will too.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_154_0.png)


    Usually the culprit of an endless loop is a sloppy variable name, spelling, or
    capitalization. If you use a variable like $myCounter as the sentry variable,
    but then increment $myCounter, PHP will keep track of two entirely different variables,
    and your program won''t work correctly. This is another reason to be consistent
    on your variable naming and capitalization conventions.


    # Building a Well-Behaved Loop


    Fortunately, there are some guidelines for building a loop that behaves as you
    wish. Even better, you''ve learned most of the important ideas, because these
    fundamental concepts are built into the structure of the for loop. When you write
    a while loop, you are responsible for these three things:


    +   - Creating a sentry variable

    - Building a condition

    - Ensuring the loop can exit


    I''ll discuss each of these ideas in the following sections.


    # Create and Initialize a Sentry Variable


    If your loop will be based on the value of a variable (there are some other alternatives),
    make sure you identify that variable, make sure it has appropriate scope, and
    make sure it has a reasonable starting value. You might also check that value
    to ensure the loop runs at least one time (at least if that''s your intent). Creating
    a variable is much like the initialization stage of a for construct.


    # Build a Condition to Continue the Loop


    Your condition will usually compare a variable and a value. Make sure you have
    a condition that can be met, and can be broken. The hard part is not building
    the loop, but ensuring the program gets out of the loop at the correct time. This
    condition is much like the condition in the for loop.'
