  md: '# FIGURE 6.11


    ![](img/f7bb260ce17b9d585cf5f10f69134213_261_0.png)


    This diagram illustrates a user''s movement through the quiz machine system.


    The QuizMachine.php program is the entry point into the system for both the test
    administrator and the person who will be taking the quiz. It essentially consists
    of three forms that allow access to the other parts of the program. To ensure
    minimal security, all other programs in the system require some password. The
    QuizMachine primarily serves as a gateway to the other parts of the system. If
    the user has administrative access (determined by a password), he or she can select
    an editQuiz page. This page loads the actual master file of the quiz (if it already
    exists) or sets up a prototype quiz, and places the quiz data in a Web page as
    a simple editor. The editQuiz.php program calls the writeQuiz.php program, which
    takes the results of the editQuiz.php form, and writes it to a master test file
    as well as an HTML page.


    If the user wants to take a quiz, the system moves to the takeQuiz.php page, which
    checks the user''s password and presents the quiz if authorized. When the user
    indicates he or she is finished, the gradeQuiz.php program grades the quiz and
    stores the result in a test file.


    Finally, the administrator can examine the log files resulting from any of the
    quizzes by indicating a quiz from the QuizMachine.php page. The showLog.php program
    displays the appropriate log file.


    # Building the QuizMachine.php Control Panel


    The heart of the quiz system is the QuizMachine.php page. This is the only page
    that the user will enter directly. All the other parts of the system will be called
    from this page or from one of the pages it calls. The purpose of this page is
    to act as a control panel. It consists of three parts, corresponding to the three
    primary jobs that can be done with this system: Writing or editing quizzes, taking
    quizzes, and'
