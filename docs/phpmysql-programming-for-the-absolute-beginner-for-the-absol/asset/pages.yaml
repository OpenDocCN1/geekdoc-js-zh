  md: 'databases. If you look through the PHP documentation, you''ll see very similar
    functions for several other types of databases, including Oracle, Informix, mSQL,
    and ODBC. You''ll find the process for connecting to and using other databases
    are pretty much the same no matter which database you''re using.


    # Getting a Connection


    The first job is to get a connection between your PHP program and your MySQL server.
    You can connect to any server you have permission to use. The mysql_connect function
    arranges the communication link between MySQL and PHP. Here''s the connect statement
    in the showwhere program:


    ```

    $conn = mysql_connect("localhost", "", "");

    ```


    The mysql_connect function requires three parameters: server name, username, and
    password. The server is the name or URL of the MySQL server you wish to connect
    to (this will be localhost if your PHP and MySQL servers reside on the same machine,
    which is frequently the case). The username refers to the username in MySQL. Most
    database packages have user accounts.


    > You will probably have to change the username and password fields if you are
    running this code on a server somewhere. I used default values that work fine
    on an isolated test server, you''ll need to change to your username and password
    if you try this code on a production server.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_327_0.png)


    You can use the same username and password to log into MySQL, and your program
    will have all the same access you do. Of course, you may want more restricted
    access for your programs, so you may want to create a special account, which has
    only the appropriate permissions, for users of your program.


    IN THE REAL WORLD

    Database security is an important and challenging issue.


    There are a few easy things you can do to protect your data from many hackers.
    The first thing is to obscure your username and password information whenever
    you publish your code. I removed my username and password from the code shown
    here. In practice, you can leave these values blank, but you should ensure you
    don''t have wide open code that allows access to your data. If you need to post
    your code (for example in a class situation) be sure to change the password to
    something besides your real password.'
