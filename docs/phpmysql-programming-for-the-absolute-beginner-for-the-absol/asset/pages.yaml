- img_proc: true
  md: 'The line that prints “That’s an ace!” will not happen every time the program
    run. It will only happen if a certain condition is true. The if statement sets
    up a condition for evaluation. In this case, the condition is read “$roll is equal
    to one.” If that condition is true, all the code between the left brace {} and
    the right brace {} will evaluate. If the condition is not true, the code between
    the braces will be skipped altogether.


    A condition can be thought of as an expression that can be evaluated as true or
    false. Any expression that can return a true or false value can be used as a condition.
    Most conditions look like the one in the Ace program. This condition checks the
    variable $roll to see if it is equal to the value 1.


    Note that equality is indicated by two equals signs (==)


    This is important, because computer programs are not nearly as flexible as humans.
    We often use the same symbol for different purposes. While computer languages
    can do this, it often leads to problems. The single equals sign is reserved for
    assignment. You should read this line


    ```

    $x = 5;

    ```


    as x gets five, indicating that the value five is being assigned to the variable
    $x. The code fragment


    ```

    $x == 5;

    ```


    be read as x is equal to five, as it is testing equality. It is essentially asking
    whether x is equal to five. A condition such as $x == 5 does not stand on its
    own. Instead, it is used inside some sort of other structure, such as an if statement.


    # Exploring Comparison Operators


    Equality (==) is not the only type of comparison PHP allows. There are several
    other ways to compare a variable and a value or two variables. These comparison
    operators are described in table 3.1


    These comparison operators work on any type of data, although the results might
    be a little strange. For example, if you have a condition like


    "a" < "b"


    you would get the result true because alphabetically, the letter “a” is earlier
    than “b,” so it has a “smaller” value.'
