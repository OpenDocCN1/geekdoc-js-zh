  md: '# Introducing the “Tip of the Day” Program


    Your first program probably won''t win any Web awards, but it will take you beyond
    what you can do with regular HTML. Figure 1.1 illustrates the “Tip of the day”
    page, which offers friendly, helpful advice.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_27_0.png)


    FIGURE 1.1

    Tip of the day might look simple, but it is a technological marvel, because it
    features html, cascading sheets, and PHP code.


    Of course, you could write this kind of page without using a technology like PHP,
    but the program is a little more sophisticated than it might look on the surface.
    The tip isn’t actually embedded in the Web page at all, but it is stored in a
    completely separate file. The program integrates this separate file into the HTML
    page. The page owner can change the tip of the day very easily by editing the
    text file that contains the tips.


    You’ll start by reviewing your HTML skills. Soon enough, you’re going to be writing
    programs that relate Web pages, so you need to be secure with your HTML coding.
    If you usually write all your Web pages with a plain-text editor, you should be
    fine. If you tend to rely on high end tools like Microsoft FrontPage or Macromedia
    Dreamweaver, you should put those tools aside for a while and make sure you can
    write solid HTML by hand.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# IN THE REAL WORLD


    The Tip of the day page illustrates one of the hottest concepts in Web programming
    today— the content management system. This kind of structure allows programmers
    to design the general layout of a Web site, but isolates the contents from the
    page design. The page owners (who might or might not know how to modify a Web
    page directly) can easily change a text file without exposing the code that holds
    the site together. As you progress through this book, you''ll learn how to develop
    powerful content management systems, as well as a lot of cool things.


    # Programming on the Web Server


    The Internet is all about various computers communicating with each other. The
    prevailing model of the Internet is the notion of clients and servers. You can
    understand this better by imagining a drive-through restaurant. As you drive to
    the little speaker, a barely intelligible voice asks for your order. You ask for
    your "cheapest-burger supreme," the bored teenager pays for your food. You drive
    out, exchange money for the combo, and drive away. Meanwhile, the teenager waits
    for another customer to arrive. The Internet works much like this model. Large
    permanent computers called servers permanently host Web pages and other information.
    They are much like the drive-through restaurant. Users "drive up" to the server
    using a Web browser. The data is exchanged, and the user can read the information
    on the Web browser.


    What''s interesting about this model is the interaction doesn''t have to stop
    there. Since the (user''s) machine is a computer, it can be given instructions.
    Commonly, the JavaScript language is used to store special instructions in a Web
    page. These instructions (like the HTML code itself) don''t mean anything on the
    server. Once the page gets to the client machine, the browser interprets the HTML
    code and any other JavaScript instructions. While much of the work is passed to
    the client, there are some disadvantages to this client-side approach. Programs
    designed to work inside a Web browser are usually greatly restricted in the kinds
    of things they can do. A client-side program usually cannot access the user''s
    printer or disk drives. This limitation also prevents programs from doing much
    of the useful work of the Internet, such as database connectivity and user tracking.


    The server is also a computer, and it''s possible to write programs designed to
    operate on the server rather than the client. There are none of advantages to
    this arrangement:


    +   * Server-side programs run on powerful Web servers.

    * The server can freely work with files and databases.

    * The code returned to the user is plain HTML, which can be displayed on any Web
    browser.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Building Basic HTML Pages


    The basic unit of web development is the HTML page. This is simply a text document
    containing special tags to describe the data in the page. Although you might already
    be familiar with HTML, it makes sense to review these skills because PHP programming
    is closely tied to HTML.


    As you are beginning, I strongly urge you to use a plain text editor. You can
    use Notepad or one of the many free editors available. There are some exceptional
    free editors available on the CD-ROM that accompanies this book. Word processors
    usually do not save files in plain text format (which PHP and HTML require) and
    many of the fancy Web editors (such as FrontPage or Dreamweaver) tend to write
    clunky code in your way once you start to add programming functionality to it.


    # Creating the HTML “Hello” Page


    HTML is mainly text. The Web author adds special markups to a text document to
    indicate the meaning of various elements. When a user requests a Web page, the
    text document is pulled from the Web server, and the browser interprets the tags
    to determine how the document is displayed on the screen. Figure 1.2 illustrates
    a very simple Web page.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_29_0.png)


    Figure 1.2

    A very basic Web page.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'If you look at the code for this page, you will see that it''s pretty easy
    to understand, even if you aren''t terribly familiar with HTML code.


    ```

    <html>

    <head>

    <title>Hello, World!</title>

    </head>

    <body>

    <center>

    <h1>Hello, World!</h1>

    </center>

    </body>

    </html>

    ```


    This is my first HTML page


    As you can see, many words are encased in angle braces(<). These words are called
    tags, and they are meant to be interpreted as instructions for the Web browser.
    Most tags come in pairs. For example, the entire document begins with `<html>`
    and ends with `</html>`. The slash (/) indicates an ending tag.


    Each HTML document contains a head area surrounded by a `<head></head>` pair.
    The header area contains information about the document in general. It almost
    always contains a title, which is often displayed in the title bar of the Web
    browser. However, there are no guarantees. HTML tags describe the *meaning* of
    an element, not necessarily how it is to be displayed. It''s up to each browser
    to determine how something will be displayed.


    The bulk of the HTML document is contained in the body, indicated with the `<body></body>`
    tags.


    Within the body of the HTML document, you can use tags to define various characteristics
    of the page. Usually you can guess the meanings of most of the tags. For example,
    the `<center></center>` pair causes all the text between the tags to be centered
    (if the browser can support this feature).'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# It''s vital to understand that HTML tags are not commands to the browser
    as much as suggestions. This is because there are many different types of computers
    and Web browsers. It is possible that somebody might look at your Web Page on
    a palm-sized computer or a cell phone. These devices will not be able to display
    information in the same way as full-size computers. The Web browser will try to
    follow your instructions, but ultimately, the way the page looks to the end user
    is not under your direct control.


    The <h1>/ tags are designed to designate that the text contained between the tags
    is one-level (highest priority) heading. HTML supports six levels of heading,
    from <h1> to <h6>. You can''t be exactly how these headings will appear in a user''s
    browser, but any text in an <h1> pair will be strongly emphasized, and each descending
    head level causes the text designated by that code to have less and less emphasis.


    # Basic Tags


    There are a number of tags associated with HTML. Most of these tags are used to
    determine the meaning of a particular chunk of text. Table 1.1 illustrates some
    of these tags.


    Of course, there are many other HTML tags, but those featured in Table 1.1 are
    the most commonly used. Figure 1.3 illustrates several of the tags featured in
    Table 1.1.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_31_0.png)


    FIGURE 1.3


    An HTML page containing the most common HTML tags.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# TABLE 1.1 BASIC HTML TAGS


    | Tag | Meaning | Discussion |

    | --- | --- | --- |

    | <b></b> | Bold | Won''t work on all browsers. |

    | <i></i> | Italic | Won''t work on all browsers. |

    | <h1></h1> | Level 1 header | Strongest headline emphasis. |

    | <h6></h6> | Level 6 header | Weakest headline level (levels 2-5 also supported).
    |

    | <ul><li></li><li></li><li></li></ul> | Un-numbered list | Must contain list
    items (<li></li></li>). Add as many list items as you wish. |

    | <ol><li></li><li></li><li></li></ol> | Ordered list | Must contain list items
    (<li></li></li>). Used for numbered list. Add as many list items as you wish.
    |

    | <a href="anotherPage.html">go to another page</a> | Anchor (hyperlink) | Places
    a link on the page. Text between <a> and </a> will be visible on page as a link.
    When user clicks on link, browser will go to the specified address. |

    | <img src="imgName.gif"> | image | Adds the specified image to the page. Images
    should be in GIF, JPG, or PNG formats. |

    | <font color="red" size=5>this text is red</font> | Modify font | Will not work
    in all browsers. It''s possible to modify font color, size, and face (typeface),
    although typeface will often not transfer to client machine. |

    | <br> | Break | Causes a carriage return in the output. Does not have an ending
    tag. |

    | <hr> | Horizontal rule | Add a horizontal line to the page. Does not have an
    ending tag. |


    Chapter 1 Exploring the PHP Environment'
