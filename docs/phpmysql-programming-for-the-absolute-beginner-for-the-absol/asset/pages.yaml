  md: 'The file() command is so easy you might be tempted to use it all the time,
    but it loads the entire file into memory, so you should only use it for relatively
    small files. When you use the fgets() technique, you only need to have one line
    from the memory at a time, so the fgets() method can be effectively used on any
    size without affecting performance. Using file() on a very large file can be extremely
    slow.


    # Splitting a Line into an Array to Scalar Values


    You might recall the split() function from Chapter 5, "Better Arrays and String
    Handling." This function is used to separate elements of a string based on delimiter.
    This function uses the split() inside a foreach loop to break each line into its
    constituent values. However, I really didn''t want an array in this situation.
    Instead, I wanted the first value on the line to be read into the name variable,
    and the second value should be stored in email. The list() function allows you
    to take an array and distribute its contents into scalar (non-array) variables.
    In this particular situation, I never stored the results of the split() function
    in an array at all, but immediately listed the contents into the appropriate scalar
    variables. Once can be easily interpolated into a mail-merge message.


    > IN THE REAL WORLD

    The next obvious step for this program would be to automatically send each message
    as an e-mail. PHP provides a function called mail() which makes it quite easy
    to add this functionality. However, the function works is very dependent on how
    the server is set up, and it won''t work with equal reliability on any server.

    Also, there are good reasons to send e-mail through a program, and reasons that
    aren''t so good. It''s completely legitimate to send e-mails to people when they
    request it, or to have a program send you youmails when certain things happen.
    For example, my own more secure version of the tester program sends me an e-mail
    to alert when certain conditions might indicate cheating out. A program that sends
    unsolicited e-mail to people is rude, and will cause bad feelings over your site.


