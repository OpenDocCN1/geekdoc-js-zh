    # Reading the $ REQUEST Array


    The formReader program does its work by taking advantage of an associative array
    built into PHP. Until now, you simply relied on PHP to create a variable for you
    based on the input elements of whatever form calls your program. This automatic
    variable creation is called register_globals. While this is an extremely convenient'
  merge: -1
