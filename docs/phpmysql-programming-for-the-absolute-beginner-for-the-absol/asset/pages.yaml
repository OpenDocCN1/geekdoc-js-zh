    # Managing Variable Scope


    You have learned some ways to have your main program share variable information
    with your functions. In addition to parameter passing, you''ll want your functions
    to have access to variables created in the main program. This is especially true
    because all the variables automatically created by PHP (such as those coming from
    forms) will be generated at the main level. You must tell PHP when you want a
    function to use a variable that has been created at the main level.


    > If you''ve programmed in another language, you''re bound to get confused by
    the way PHP handles global variables. In most languages, any variable created
    at the main level is automatically available to every function. In PHP, you must
    explicitly request that variable be global inside a function. If you don''t do
    this, a new local variable with the same name (and no value) will be created at
    the function level.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_131_1.png)


