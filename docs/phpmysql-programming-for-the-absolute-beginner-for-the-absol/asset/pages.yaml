  md: '# Creating a File Handle


    When you create a file with the `fopen()` command, the function returns an integer
    called a `file handle` (sometimes also called a `file pointer`). This special
    number will be used to refer to the file in subsequent commands. You won''t usually
    be concerned about the actual value of this handle, but you will need to store
    it in a variable (I usually use `$fp`) so that your file access commands know
    which file to work with.


    # Examining File Access Modifiers


    The final parameter in the `fopen()` command is an access modifier. PHP supports
    a number of access modifiers that determine how your program will interact with
    the file. Files are usually opened for reading, writing, or appending. You can
    also use a file for simultaneous input and output, but such files are often not
    needed in PHP, because the relational database techniques you''ll learn in the
    next couple of chapters provide the same capability with more flexibility and
    a less work. However, the other forms of file access (read, write, and output)
    are extremely useful, because they provide easy access to the file information.
    (See Table 6.1 for a list of file access modifiers with descriptions.)


    Table 6.1 FILE ACCESS MODIFIERS

    | Modifier | Type | Description |

    | --- | --- | --- |

    | "r" | read-only | program can read from the file |

    | "w" | write | writes to the file, overwriting it if it already exists |

    | "a" | append | writes to the end of the file |

    | "r+","w+" | read and write |


    The file access modifiers determine what you can do with the file. Read mode opens
    a file for input, so your program can read information from the file. You cannot
    write data to a file that is opened in read mode. You''ll see an example of the
    read mode in action in the next section, "Loading a File from the Drive System."
    Write mode allows you to open a file for output access. If the file does not exist,
    PHP automatically creates it for you.'
  merge: -1
