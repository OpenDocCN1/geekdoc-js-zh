- img_proc: true
  md: 'The name of the select object will become the name of the variable. For example,
    borderMaker.html has two select objects, borderSize and borderStyle. The PHP program
    can expect to find two corresponding variables, $borderSize and $strokeStyle.
    Because there is no place for the user to type a value into a select object, the
    values it can return must be encoded into the structure of the form itself. The
    value of whichever option the user will be selected by the PHP program as the
    value of the corresponding variable. For example, if the user chose groove as
    the border style, the $strokeStyle variable will have the value in.


    # IN THE REAL WORLD


    Note that the value of the options doesnt necessarily have to be what the user
    sees on the form. This is handy if you want to show the user one thing, but send
    something else to the server. For example, you might want to let the user choose
    from several colors. In this case, you might want to create a list box that shows
    the user color names, but the value property corresponding to each of the option
    objects might have the actual values used to generate the color. Similar tricks
    are used in online shopping environments where you might let the user choose an
    item by its name, the value associated with that item be its catalog number, which
    is easier to work with in a database environment.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_90_0.png)


    You might recall that it is possible to have multiple selections enabled in a
    list box. In that case, the variable will contain a list of responses. While managing
    this list is not difficult, it is a topic for another chapter (To be specific,
    Chapter 4, “Loops and Arrays."). For now, concentrate on the singular style of
    list box.


    # Reading Radio Groups


    CSS allows the developer to indicate sizes with a variety of measurements. This
    is an ideal place for a group of radio buttons because only one unit of measure
    is appropriate at a time. Even though there are four different radio buttons on
    the borderDemo.html page with the name sizeType, the PHP program will only see
    one $sizeType variable. The value associated with whichever option is selected
    will become the value of the $sizeType variable. Note that it is possible for
    the value of a radio button to be different from the text displayed beside it.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# IN THE REAL WORLD


    How do you decide what type of form element to use?


    You might wonder if all these different form elements are necessary, since they
    all boil down to a name and value by the time they get to the PHP interpreter.
    The various kinds of user interface elements make a difference in a few ways:


    +   - First, it''s easier (for many users) to use a mouse to type. Whenever possible,
    it is nice to add lists, checks, and options so the user can navigate your forms
    more quickly. Typing is often much slower than the kinds of input afforded by
    the other elements.

    - Secondly, interface elements (especially the drop-down list box) are extremely
    efficient in terms of screen space. You can pack a lot of choices on a small screen
    by using drop-downs effectively. While you might not think this is an issue any
    more, take a look at how many people are surfing the Web with PDAs and cell phones.

    - Third, your life as a programmer is much easier if you can predict what the
    user will be sending. When users type things, they make spelling and grammar mistakes,
    use odd abbreviations, and are just unpredictable. If you limit the user''s choices
    whenever possible, you are less likely to frustrate your users because your program
    should be to anticipate all the choices.


    # Returning to the Story Program


    The story program introduced at the beginning of this chapter is an opportunity
    to bring together all the new elements you''ve learned. It doesn''t introduce
    anything new, but it helps you see a larger context.


    # Designing the Story


    Even though this is not an especially difficult program to write, you''ll run
    into problems if you simply open up your text editor and start blasting. It really
    pays to plan ahead. The most important thing happens before you write a single
    line of code.


    In this situation, start by thinking about your story. You can write your own
    story, or you can modify some existing text for humorous effect. I raided a nursery
    rhyme book for my story. Regardless of how you come up with a story, you need
    to have it in place before you start to write code. I wrote the original unmodified
    version of “Little Boy Blue” in my text editor first so I could admit its artistic
    genius—and mangle it beyond recognition. As you look over the original prose,
    look for'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'key words you can take out, and try to find a description that will hint at
    the original word without giving anything away. For example, I printed out my
    story, circled the word "blue" in the original poem, and wrote "color" on another
    piece of paper. Keep doing this until you''ve found several words you can take
    out of the original story. You should have a document with bunch of holes in it,
    and a list of hints. Mine looked like Figure 2.15.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_92_0.png)


    FIGURE 2.15


    My plan for the story game. I thought through the story and the word list before
    writing any code.


    # # IN THE REAL WORLD


    Figure 2.15 shows the plan written as this way (especially in a professional programming
    environment) although sometimes I *really* wrote the plan on paper. I reproduced
    it in a cleaner format because you don''t deserve to be sketched or dry erased
    by my handwriting. I usually plan my programs on paper, chalkboard, or dry board.
    I avoid planning programs on the computer, because it''s so tempting to start
    programming immediately. It''s really important to make your plan describe what
    you wish to do in *English* before you worry about how exactly you''ll implement
    the plan. Most beginners (and a lot of pros) start programming too early, and
    get stuck as a result. You''ll see throughout the rest of this chapter how this
    plan evolves into a working program.'
  merge: -1
