    # Including the spyLib Library


    The first thing to notice is the include() statement. This command allows you
    to import another file. PHP will read that file and interpret it as HTML. An included
    file can contain HTML, CSS, or PHP code. Most of the functionality for the spy
    data program is stored in the spyLib.php library program. All the other PHP programs
    in the system begin by including spyLib.php. Once this is done, every function
    in the library can be accessed as if it were a locally defined function. As you
    see, this provides tremendous power and flexibility to a programming system.


    # Connecting to the Spy Database


    The utility of the spyLib library becomes immediately apparent as I connect to
    the spy database. Rather than worrying about exactly what database I''m connecting
    to, I simply defer to the connectToSpy() function in spyLib(). In the current
    code I don''t need to worry about the details of connecting to the database. With
    a library I can write the connecting code one time and re-use that function as
    needed.'
