  md: '# Finishing up the CREATE TABLE Statement


    Once you understand field data types, the CREATE TABLE syntax makes a lot of sense.
    There are only a few more details to understand. Once you specify CREATE TABLE,
    use a pair of parentheses to indicate the field list. Each field has a name followed
    by its type (length, if it''s a CHAR or VARCHAR). The fields are separated by
    commas. You do not have to put each field on its own line or indent the field
    definitions, but I prefer to do so, because these practices make the code much
    easier to read and debug.


    # Creating a Primary Key


    You might be curious about the very first field in the phone list database. Just
    to refresh your memory, the line that defines that field looks like this:


    ```

    id INT PRIMARY KEY,

    ```


    Most database tables have some sort of field like this that holds a numeric value.
    This special field is called the primary key.


    > IN THE REAL WORLD

    A very simple database like the phone list could theoretically go without a primary
    key, but such fields are so important to more sophisticated databases that you
    might as well start putting them into your first table. It''s traditional to put
    a primary key in every table. In Chapter 9 “Data Normalization,” you''ll learn
    more about the relational data model. In that discussion you''ll learn how keys
    are used to build powerful databases, and you''ll learn more about creating proper
    primary keys. In fact, the adventure program you''ve already seen heavily relies
    on a key field even though there''s only one table in the database.


    The code presented so far can be entered directly into the MySQL program. You
    can see the code and its results in Figure 7.6.


    # Using the DESCRIBE Command to Check the Structure of a Table


    It can be useful to check the structure of a table, especially if somebody else
    created it or you don''t remember exactly what types or sizes of fields are in
    the table. The DESCRIBE command lets you view the structure of a table.'
