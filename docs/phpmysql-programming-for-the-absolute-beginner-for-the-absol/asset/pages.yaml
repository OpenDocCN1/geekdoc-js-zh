    # Checking for the End of the File with feof()


    When you are reading data from a file, your program doesn''t generally know how
    long the file will be. The gets() command that you will frequently use to get
    data from a file reads one line of the file at a time. Since you can''t be sure
    how many lines are in a file until you read it, PHP provides a special function
    called feof(), which stands for file end of file (apparently named by the department
    of redundancy department). This function returns the value FALSE if there are
    any more lines of data left in the file, and TRUE when the program is at the end
    of the data file. Most of the time when you read data from a file, you''ll use
    a while loop that continues as long as feof() is not true. The easiest way to
    set up this loop is with a statement like this:


    ```

    while (!feof($fp))

    ```


    The feof() function requires a file pointer as its sole parameter.


    # Reading Data from the File with gets()


    The gets() function gets one line of data from the file, returns that value as
    a string, and moves a special pointer to the next line of the file. Usually this
    is called inside a loop that continues until feof() is true.'
