    is to store a set of queries in the database and let appropriate users modify
    the queries. I called my new table the storedQuery table. can be manipulated in
    the system just like the other tables, so a user with password can access add,
    edit, and delete queries. Here is the additional code used to build the storedQuery
    table:


    ################################################


