- img_proc: true
  md: 'Because the plus sign and the equals sign are inside quotes, they are treated
    as ordinary text elements and PHP doesn''t do any calculation (such as addition
    or assignment) with them.


    The next line


    ```

    print $x + $y;

    ```


    does not contain any quotes. It calculates the value of $x + $y and prints the
    result of this calculation (8) to the Web page.


    Most of the math symbols you are familiar with also work with numeric variables.
    The plus sign (+) is used for addition, the minus sign (-) indicates subtraction,
    the asterisk (*) is used for multiplication, and the forward slash (/) is used
    for division. The remainder of the program illustrates how PHP does subtraction,
    multiplication, and division.


    > IN THE REAL WORLD

    Those numbers without any decimal point are integers and the numbers with decimal
    values (like 1.5, 0.333, and so on) are called real numbers. These two types of
    numbers are stored differently in computers, and this distinction sometimes leads
    to problems. PHP does its best to shield you from this type of issue. For example,
    since the values 3 and 5 are both integers, the results of the addition, subtraction,
    and multiplication problems are also guaranteed to be integers. However, the quotient
    of two integers is often a real number. Many languages would either refuse to
    solve this problem or not get a complete result. They might say that 3 / 5=0 rather
    than 0.6. PHP tries to convert things to the appropriate type whenever possible,
    and it usually does a pretty job. There are times, however, that you will need
    to control this behavior. The setType() function lets you force a particular variable
    into a particular type. You can look up the details in the online help for PHP
    (included in the CD-ROM that accompanies this book).


    # Creating a Form to Ask a Question


    It''s typical for PHP programs to be made of two or more separate documents. An
    ordinary HTML page contains a form, which the user fills out. When the user presses
    the submit button, the information in all the form elements is sent to a program
    specified by a special attribute of the form. This program processes the information
    from the form and returns a result, which looks to the user like an ordinary Web
    page. To illustrate, look at the whatsName.html page illustrated in Figure 2.7.'
