    # Generating a Basic Array


    Look at the lines that describe $camelPop:

    //simply assign values to array

    $camelPop[1] = "Somalia"

    $camelPop[2] = "Sudan"

    $camelPop[3] = "Mauritania"

    $camelPop[4] = "Pakistan"

    $camelPop[5] = "India":


    $camelPop is a variable meant to hold the five countries with the largest camel
    populations in the world. (If this array isn''t working for you, at least you''ve
    learned something in this chapter!) Since $camelPop is going to hold the names
    of five different countries, it makes sense that this is an array (computer feng)
    rather than an ordinary variable. The only thing different about $camelPop and
    all the other variables you''ve worked with so far is $camelPop can have multiple
    values. To tell these values apart, use an index in square brackets.


    > Appately the boxer George Foreman has several sons also named George. I''ve
    often wondered what Mrs. Foreman does when she wants somebody to take out the
    trash. I suspect she has assigned a number to each George, so there is no ambiguity.
    This is exactly how arrays work. Each element has the same name, but a different
    numerical index, so you can tell them apart.


    Many languages require you to explicitly create array variables, but PHP is easygoing
    in this regard. Simply assign a value to a variable with an index in square braces
    and you''ve created an array.'
