    # Opening a File with fopen()


    The fopen() command is used to open a file. Note that you can only create files
    on the Web server. You cannot directly create a file on the client machine, because
    you do not have access to that machine''s file system. (If you did, any server-side
    program would be able to create viruses with extreme ease.) However, as a server-side
    programmer, you already have the ability to create files on the server. The programs
    you are writing are themselves files. Your programs can write files as if they
    are.


    > TRICK Actually the ownership of files created by your PHP programs can be a
    little complicated, depending on your operating system, server, and PHP configurations.
    Generally, any file created by your program will be owned by a special user called
    PHP or by the account you were in when you wrote the program. This makes a big
    difference in an OS like UNIX where file ownership is a major part of the security
    mechanism. The best way to discover how this works is to write a program that
    creates a file and then look at that file''s properties.


    The first parameter of the fopen() function is the filename. This filename can
    include directory information, or it can be a relative reference.


    > TRAP You should always test your programs, especially if they use a relative
    reference for a filename. It''s possible that your current directory is not the
    default directory. Also, the filename is based on the actual file system of the
    server, rather than the URL of the file.


    You can create a file anywhere on the server that you have access to. Your files
    can be in the parts of your directory system open to the Web server (usually subdirectories
    of public_html or hdocs). Sometimes, you might not want your files to be accessible
    to users by using a URL. You can control access to these files by placing them
    outside the public html space and setting the permissions so they can be read
    by you (and programs you create) but not by anyone else.'
