    # Creating Comments in SQL


    SQL is actually a language. Although it isnt technically a programming language,
    it has many of the features. Like PHP and other languages, SQL supports several
    types of comment characters. The # sign is often used to signify a comment in
    SQL. Comments are especially important when you save a group of SQL commands in
    a file for later reuse. These comments can help you remember what type database
    you were trying to build. It''s critical to put basic comments in your scripts
    so you will understand what they do later.


    # Dropping a Table


    It may seem strange to talk about deleting a table from a database before youve
    built one, but often (in this case) a database is created using a script. Before
    you create a new table, you should check to see if it already exists, and if it
    does, delete it with the DROP command.


    ```

    DROP TABLE EXISTS phoneList;

    ```


    command does exactly that. If the phoneList table currently exists, it will be
    deleted, so there will be no confusion.'
