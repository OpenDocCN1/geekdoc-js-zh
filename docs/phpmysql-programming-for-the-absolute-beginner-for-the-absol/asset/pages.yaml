- img_proc: true
  md: "The only remaining in the agent table is the agent's name and a numerical field\
    \ for the operation. The operationID field is used as the glue that holds together\
    \ the agent and operation tables.\n\nI've added a few things to improve the SQL\
    \ code for creating the agent table to ensure that it behaves well.\n\n```\nCREATE\
    \ TABLE agent (\n  agentID int(11) NOT NULL AUTO_INCREMENT,\n  name varchar(50)\
    \ default NULL,\n  operationID int(11) default NULL,\n  PRIMARY KEY (agentID),\n\
    \  FOREIGN KEY (operationID) REFERENCES operation (operationID)\n);\n```\n\nRecall\
    \ that the first field in a table is usually called the primary key. Primary keys\
    \ must be unique and each record must have one. I have also chosen to name each\
    \ primary key according to a special convention. Primary key names will always\
    \ begin with the table name and with \"ID\". I added this convention because it\
    \ will make things easier later when I write programs to work with this data.\
    \ The NOT NULL modifier ensures that all records of this table have a primary\
    \ key. The AUTO_INCREMENT is a special tool that allows MySQL to pick a new value\
    \ for the field if no database is specified. This will ensure that all entries\
    \ are unique.\n\n![](img/f7bb260ce17b9d585cf5f10f69134213_361_0.png)\n\nNot all\
    \ databases use the AUTO_INCREMENT feature in the same way. You might need to\
    \ look up some other way to automatically generate key fields if you aren't using\
    \ MySQL.\n\nI've added an indicator at the end of the CREATE TABLE statement to\
    \ indicate that agentID is the primary key of the agent table.\n\n# Creating a\
    \ Reference to the operation Table\n\nTake a careful look at the operationID field.\
    \ This field contains an integer, which will be used to refer to a particular\
    \ operation. I also added an indicator specifying operationID as a foreign key\
    \ reference to the operation table. The operationID field in the agent table will\
    \ contain a reference to the primary key of the operation table. This type of\
    \ field is referred to as a foreign key."
  merge: -1
  pgno: 361
- img_proc: true
  md: 'Some DBMS systems require you to specify primary and foreign keys. MySQL currently
    does not require this, but it''s a good idea to do so for two reasons. First,
    it''s likely that future versions of MySQL will require these statements, because
    they are used to ensure the reliability of a database. Second, it''s very good
    to specify in the code when you wish to have a field a special purpose, even if
    the DBMS doesn''t do anything with that information.


    # Inserting a Value into the agent Table


    The INSERT statements for the agent table have one trick made possible by the
    AUTO_INCREMENT designation of the primary key.


    ```

    INSERT INTO agent VALUES(

    null, ''Bond'', 1);

    ```


    The primary key is initialized with the value null. This might be surprising because
    primary keys are explicitly designed to never contain a null value. Since the
    agentID field is set to AUTO_INCREMENT, the null value is automatically replaced
    with an unused integer. This trick ensures that each primary key value will be
    unique.


    # Building the operation Table


    The new operation table contains information referring to an operation. (See Table
    9.4 for descriptions of some operation IDs.)


    | operationID | name | description | location |

    |---|---|---||}{

    | 1 | Dancing Elephant | Infiltrate suspicious zoo | London |

    | 2 | Enduring Angst | Make bad guys feel really guilty | Lower Volta |

    | 3 | Furious Dandelion | Plant crabgrass in enemy lawns | East Java |'
