  md: '# Summary


    The details of the Spy Master system can be dizzying, but the overall effect is
    a flexible design that can be easily updated and modified. This system can accept
    modifications to the underlying database, and can be adapted to an entirely different
    data set with relatively little effort. Although you didn''t learn any new PHP
    syntax in this chapter, you now saw an example of coding for re-use and flexibility.
    You learned how to use files to simplify complex systems. You learned how to build
    a library file with utility routines. You learned how to write code that can be
    adapted to multiple data sets. You learned how to write code that prevents certain
    kinds of user errors by limiting choices to legal values. You learned how to build
    programs that help tie together relational data structures. The things you have
    learned in this chapter form the foundation of all data-enabled Web programming,
    which in turn form the backbone of e-commerce and content management systems.


    # CHALLENGES


    +   1. Add a module that lets the user interactively query the database. Begin
    with a page that allows the user to type in an agent''s name and returns data
    based on that agent.

    2. Once the basic functionality of an "agent search" program is done, add checkboxes
    that allow certain aspects of the agent to be displayed (operation and skills).

    3. Build programs that allow searching on other aspects of the data, including
    skills and operations.

    4. Modify the spy master database to support another data set.'
