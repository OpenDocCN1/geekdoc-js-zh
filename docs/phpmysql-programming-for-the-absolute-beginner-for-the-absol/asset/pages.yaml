- img_proc: true
  md: 'You can specify whether the resulting script generates the table structure
    alone or adds the data. You can also specify whether the resulting script contains
    code to select a database, drop the specified table if it already exists, and
    the filename of the resulting script.


    The ability to automatically generate SQL scripts is incredibly powerful. It can
    be a great time-saver and you can learn a lot by examining the scripts written
    with a feature. However, you are still the programmer, and you are responsible
    for your projects, even if you didn''t write it directly. You must still understand
    what the code being generated does. Most of the code you''ll see so far is stuff
    I''ve already described, but you may have to look up advanced features. As I''ve
    said before, you have to know how to do this stuff by hand.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_310_0.png)


    # Creating More Powerful Queries


    So far, the tables you''ve created haven''t really been any powerful than HTML
    tables, and they''re a lot more trouble. The excitement of databases comes when
    you use the information to solve problems. Ironically, the most important part
    of database work isn''t usually getting the data, but filtering the data in order
    to solve some sort of problem. You might want to get a listing of all heroes in
    your database who''s last name begins with an "E," or perhaps somebody parked
    a Yak Dirigible in your parking space and you need to know who the driver is.
    You may also want your list sorted by special power, or you may only want a list
    of vehicles. All these (admittedly contrived) examples involve grabbing a subset
    of the original data. The workhorse of SQL is the SELECT statement. You''ve seen
    the simplest form of this command used to get all the data in a table, like this:


    ```

    SELECT * FROM hero:

    ```


    Figure 7.19 shows this form of the SELECT statement operating on the hero table.


    SQLyog is a wonderful tool for experimenting with SELECT statements because you
    can write the actual SQL by hand, and then you can see the results immediately
    in a very clean format. To use SQLyog in this way, type SQL code in the SQL editor,
    and then press Shift+F5. If you don''t want to use SQLyog, you can do the same
    experiments directly in MySQL. It will still work, but the results will be formatted
    as text, not always as easy to see.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_310_1.png)'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 286


    PHP/MySQL programming for the Absolute Beginner


    ![](img/f7bb260ce17b9d585cf5f10f69134213_311_0.png)


    # FIGURE 19


    The SELECT query is in the top right section, and the results are underneath.


    SELECT statement is extremely powerful because it can be used to grab a subset
    of a data set that can return only the requested fields and records. This process
    of asking questions of the database is commonly called a query.


    # Limiting Columns


    There are many times when you might not want all of the fields (or columns) in
    a table. For example, you might just want a list of the name and weapon of everyone
    on your list. You can specify this by using the following SELECT statement (illustrated
    in Figure 7.20).


    ```

    SELECT name, weapon

    FROM hero:

    ```


    This may seem like a silly capability for such a simple database as the hero list,
    but you''ll run into extremely complicated tables with many fields, and you''ll
    need to filter only a few fields. For example, I use a database to track the students
    I advise. Each student''s information contains lots of data, but I might just
    want a list of names and e-mail addresses. The ability to isolate only the fields
    I need is one way to get useful information from a database.


    The results of a query look a lot like a new table. You can think of a query result
    as a temporary table.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'FIGURE 7.20


    This query returns only the names and weapons.


    # Limiting Rows with the WHERE Clause


    In addition to limiting the columns returned in a query, you are often interested
    in limiting the number of rows. For example, you might run across an evil villain
    who can only be defeated by a laser pointer. The query shown in Figure 7.21 illustrates
    a query that solves exactly this dilemma.


    FIGURE 7.21


    If you know how to set up the query, you can get specific results. In this case,
    the query selects only others with a laser pointer.'
