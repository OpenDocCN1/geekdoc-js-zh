  md: 'I decided to code the value "absolute" (from the name of this book series)
    as an administrative password. Each test will have its own password, and the administrative
    functions (like editing a quiz) have their own password. If the password field
    has any other value besides my chosen password, the program will indicate a problem
    and refuse to move forward.


    Use of an administrative password will keep casual snoops out of system, but it''s
    nowhere near bullet-proof security. This system is not appropriate for situations
    where you must be absolutely certain that the tests are secure.


    Once you know the user is authorized to edit tests, you will need to determine
    if it''s a new test or an existing quiz. If the quiz is new, I simply add some
    data to variables, which will be used for the upcoming form. If the user wants
    to see an existing test, I open the file for read access, and grab the first three
    lines, which will correspond to the $quizName, $quizEmail, and $quizPwd fields.


    I use a foreach loop to load the rest of the file into the $quizData variable.


    You might wonder why the quiz needs a password field if it already took a password
    to get this form. The quiz system has multiple levels of security. Anybody can
    get to the quizBuilder.php page. However, in order to move to one of the other
    pages, the user has to have the right kind of password. Only an administrator
    should go to the editPage and showLog programs, so these programs require special
    administrative password. Each quiz also has a password associated with it. The
    password is stored in the quiz master file so that you can associate a different
    password for each quiz. In this way, the users authorized to take one test aren''t
    taking other tests (and adding confusion to your log files).


