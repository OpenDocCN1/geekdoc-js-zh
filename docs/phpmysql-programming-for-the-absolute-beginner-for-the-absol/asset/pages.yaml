  md: "21\n\n```\np.cursive {\n  background-color: yellow;\n  font-family: cursive;\n\
    }\n```\n\nWhen you have the CSS rules stored in a separate file, you can use the\
    \ link tag to import the CSS rules. The advantage of this approach is you can\
    \ re-use one set of CSS rules for many pages.\n\n# IN THE REAL WORLD\n\nExternal\
    \ style sheets are very useful when you are working on a project that must be\
    \ consistent across many pages. Most sites go through several iterations, and\
    \ it could be a real pain to change the font color in 20 pages every time the\
    \ client wants to try some new variation. If all your style rules are stored in\
    \ one CSS document and all your pages refer to that document, you only have to\
    \ change the style rules one time, and you've automatically changed the appearance\
    \ of every page that uses that set of rules.\n\n# Using Form Elements\n\nHTML\
    \ pages often utilize form elements for user input. These elements include basic\
    \ tools for user input. These form elements are not useful in plain HTML-although\
    \ they are rather easy to put on a page, they don't do much unless there is some\
    \ kind of program attached. Much of what you do as a PHP author will involve getting\
    \ information from Web-based forms, so it's important to be familiar with the\
    \ most common form elements. You'll start to write programs that retrieve values\
    \ from forms in the very next chapter, so it'll be good to learn how they work.\n\
    \n# The Text-Based Elements\n\nMost of the form elements are really about getting\
    \ some sort of text information from the user to a program. The first set of such\
    \ elements are those that simply allow the user to enter some kind of text. There\
    \ are four elements, illustrated in Figure 1.9."
