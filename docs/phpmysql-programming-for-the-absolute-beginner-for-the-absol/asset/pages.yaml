    # ## USING DIV AND SPAN ELEMENTS IN CSS


    You can apply CSS styles to any HTML entity you wish. In practice, many authors
    prefer to use the span and div elements for custom CSS work. The span tag basically
    has no characteristics of its own. This makes it very predictable, because the
    CSS style will define essentially everything about the text within the span. The
    div element is similar. It is sometimes used in place of span as a “generic” element
    suitable for adding CSS. The div element acts like a paragraph in most instances,
    and the span element can work inside a paragraph.


