    # Using the switch Structure


    The switch structure is optimized for those situations where you have one variable
    that you want to compare against a number of possible values. To make it work,
    use the switch keyword followed by the name of the variable you wish to evaluate
    in parentheses. A set of braces indicates that the next block of code will be
    focused on evaluating the possible values of this variable.


    For each possible value, use the case statement, followed by the value, followed
    by a colon. End each case with a break statement, which indicates the program
    should stop thinking about this particular case, and get ready for the next one.


    ![](img/f7bb260ce17b9d585cf5f10f69134213_119_0.png)


    The use of the break statement is probably the trickiest part of the switch statement,
    especially if you are familiar with a language, such as Visual Basic, which does
    not require such a construct. It''s important to add the break statement to the
    end of each case, or the program flow will simply "fall through" to the next possible
    value, even if that value would not otherwise evaluate to true. As a beginner,
    you should always place the break statement at the end of each case.


    The last case is called default. This works just like the else clause of the multivalue
    if statement. It defines code to execute if none of the other cases is active.
    In multi-value if statements it''s smart to test for a default case even if you
    think it is impossible for the computer to get this default option. Crazy things
    happen, and it''s good to be prepared for them.


