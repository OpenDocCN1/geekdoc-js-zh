    这里有一个假设的场景，假设你想在 JavaScript 中模拟单个人，每个人都有“name”（名字）、“age”（年龄）和“city”（城市）。你有几种不同的方法可以实现这一点。你可以有三个不同的变量
    `name`、`age` 和 `city`，但让我们假设它们之间没有关联，它们是独立的。如果你想将它们连接起来，你可以像这里这样做使用类数组的方法 `var
    person = array`，其中第一个项目名为 "Cindy"，第二个项目是 "age 32"，最后一个项目是 "Missoula"，即城市名。


    这不是使用数组极佳方法，因为这些数据并不是一个列表。是的，你可以强迫它进入数组，但它并不符合数组的格式（即你通常具有逻辑顺序的列表），在这里从这个数组访问城市时并没有逻辑顺序可言。


    ![](img/image00665.jpeg)


    输入 `person[2]`，这要求我知道城市位于索引 2。


    ![](img/image00666.jpeg)


    如果你不小心反转了顺序并添加了索引 "0" 的 "Travis"，但然后你混淆了这些内容，在 "age" 的位置是 "city"(即 "Los Angeles"，索引为
    "1"），最后是 "age"(索引为 "2"），那么如果你尝试访问 `person2[2]`，你将得到 `age` 而不是城市。


    ![](img/image00667.jpeg)


    这仅仅说明数组并不是每种情况的完美解决方案。你可以使用一种更好的数据结构，即 JavaScript 对象。你可以看到下面的示例，展示了如何将带有名字、年龄和城市的个人数组转换为
    JavaScript 对象。


