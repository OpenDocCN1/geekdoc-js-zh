    "0" 小于 "5"，那是 "true"，你将执行 `console.log(str[count])`，这将是一个为 "0" 的字符串，给你 "h"。


    ![](img/image00484.jpeg)


    然后给 `count` 加 1，即 `count++`，得到 "0" 作为确认，因此调用 `count` 它由于自动递增而返回 "1"。


    ![](img/image00485.jpeg)


    重复此操作，`count` 小于字符串点长度比 "5" 少 1，是的，重新运行 `console.log(str[count])`，现在 `count` 是
    "1"，它反映了你 "hello" 中的字母 "e"。


    ![](img/image00486.jpeg)


    继续下去，直到打印出 "hello" 中的 "o"，你给 `count` 加 "1"，然后它就等于 "5"，而 "5" 并不小于 "5"，所以循环在到达字母
    "e" 时将结束。记住，长度始终比字符串的最高索引大 "1"。


    长度是五个字符，但最大索引是 "4"，因为你是从 0, 1, 2, 3 和 4 开始的，这是 "hello" 的最后一个索引。这就是你如何使用循环来打印字符串中的每个字符。


    ### 死循环


    关于“while 循环”的一个重要注意事项是，如果你不小心，可能会创建一个被称为无限循环的东西。当你提供的条件永远不为假时，就会发生无限循环。它会一直一直运行下去。它们是有问题的，因为它们会导致你的浏览器崩溃，并通过占用
    JavaScript 中的所有内存来影响你的系统硬盘。


    ![](img/image00487.jpeg)


    上面是这种情况的一个示例，你有一个 `count` 等于零，然后你说“当 count 小于 10 时” `console.log count`。


    `count` 永远小于 10，因为它是 0，而且你没有更改 `count`，所以它永远不会增加，永远不会超过 10，所以它将一直打印 0。不建议你这样做，但你可以将其复制并粘贴到你的控制台中，它会打印大量的
    0，而不是无限运行，大多数浏览器会停止它并提示你有有错误的代码或有无限循环正在运行。


    ![](img/image00488.jpeg)


    这只是为了与上面所示的循环进行对比，你必须增加 `count`，你必须在某处让条件变为假，如果不这样做，它将像无限循环一样一直运行。


    ### 自动循环


    在本节中，你将进行代码演示，它将说明使用 `while` 循环的另一种方法。你一直在使用 `while` 循环，你使用数字并有一个范围，你从 10 到 50
    打印数字，这是一个固定的范围。还有另一种使用 `while` 循环的方法，你并不确切知道会运行多少次，它不是预定的。


    这种自动循环也可以被称为“烦人的”（annoy-omatic）。这是一种烦人的方法，不断向你提一个特定的问题，直到你回答正确为止，否则它将一直请求正确的信息。


    创建一个 HTML 文件命名为 `annoy.html`，这是你要插入视觉 Studio Code 编辑器的代码。


    ![](img/image00489.jpeg)


    现在创建一个 JavaScript 文件命名为 `annoy.js`，放在同一目录下并保存。


    ![](img/image00490.jpeg)


    接下来，打开你的浏览器，你在页面上什么也看不到，但它会弹出一个框。


    ![](img/image00491.jpeg)


    你想做的第一件事是在 JavaScript 代码中询问“你在吗”。你将让一个变量 `response` 等于 `prompt("are you there?")`。


    ![](img/image00492.jpeg)


    下一步是检查用户是否说了是。你可以使用 `if` 语句，输入 `if (response == "yes")`，然后执行 `alert("yah, you
    made it")`，这很棒，你可以有一个 `else` 语句让你再次询问，如果你回答错了，同一个问题就会重复，直到输入正确的回答。


    ![](img/image00493.jpeg)


    刷新浏览器并在弹出框中输入“不是”，你的回答可以是任何内容，只要不是我们的实际答案“yes”。一旦你点击“确定”按钮，什么都不会显示。


    与其使用简单的条件判断，你将使用 `while` 循环，但它将使用你编写的相同代码，删除 `if` 语句和 `else` 语句。写一个 `while` 条件
    `response` 不等于 yes，只要用户没有说是，你就将再次提示他们。复制并粘贴你的 `var response = prompt("are you
    there?")`。


    ![](img/image00494.jpeg)


    最后，你可以最后设置一个 `alert` 提示“hy, you made it”，在 `while` 循环条件结束之前它不会运行。这意味着用户需要说“yes”才能看到“yah,
    you made it”告警。


    ![](img/image00495.jpeg)


    保存你的代码并尝试一下，回到浏览器并刷新页面，弹出一个框，只需输入实际答案以外的任何内容，输入“不是”并点击“确定”按钮。


