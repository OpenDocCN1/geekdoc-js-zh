    `Myname` equal to then I will change it to be `"Smith"` which is another name
    that will use to modify `"Michael"`.


    ![](Images/image00322.jpeg)


    And now if you ask for `"Myname"` which is your variable, again it won''t recognize
    `"Michael"` but `"Smith"`. Hence, that is an important part of variables they
    can change, that’s one of the reasons they are called variable


    ![](Images/image00323.jpeg)


    ### Concatenation in a variable


    Next is how to recall your value and also concatenate it. Let’s make another variable
    this time called `"friend"` equals `"John"`


    ![](Images/image00324.jpeg)


    All you need to do is to type `"hello there "` which you will be concatenating
    together with your variable which is `friend` which in return will call forth
    `"John"` value, and make sure to add a space at the end of `"there"` in `"hello
    there"` so that your output won’t be rough. From the illustration below you’ll
    get `"hello there John"`


    ![](Images/image00325.jpeg)


    ### Changing concatenated variable


    Now, let’s change our variable value which is `"John"` which was concatenated
    as `"hello there John"`. To do this you’ll have to change the call variable `friend`
    to change the value `"John"`. And now you will say `friend equal to "nobody"`


    ![](Images/image00326.jpeg)


    now retype the same line `"hello there"` plus `"friend"`, you’ll get `"hello there
    nobody"`


    ![](Images/image00327.jpeg)


    ### Storing numbers


    Let’s see how you can store numbers in your variable as well or any of the basic
    data types. So, make a number called `"Mynum"` equal to `"seventy-five"`


    ![](Images/image00328.jpeg)


    ### Performing mathematical calculations in a variable


    And now whenever you refer to `"Mynum"` you will get `"75"`, and you can do some
    maths equation with that. Let’s see something like `"Mynum"` plus `"twenty-five"`,
    you’ll get `"100"`


    ![](Images/image00329.jpeg)


    Or you can do `"Mynum"` modulo `"ten"`, you will get `"five"` since `"ten"` can
    divide `"seventy-five"` in `"seven times"` and the remainder will be returned
    which is `"five"` that was returned as your output


    ![](Images/image00330.jpeg)


    Another important concept about variables and javascript is that you can change
    their value and you can also change their type. Let’s say that you want to change
    the value of `"Mynum"` to the string `"50"`. You can do that easily. Type `Mynum`
    equal to string `"50"` either alphabet or number. It is okay that it is a string,
    it used to be a number before the modification but now it is a string


    JavaScript doesn''t care as a side note. In some languages, that might be a problem
    and you can''t do that. JavaScript has something called dynamic typing which means
    that it can change from one type to another without any issue


    ![](Images/image00331.jpeg)


    ### Convention in JavaScript


    The last thing about variables that you want to touch on is that there is a convention
    for how you can name them


    - **camel case**: Camel case looks like this `"name"`, `"number"`, `"string"`
    etc. everything must start with a small letter


    ![](Images/image00332.jpeg)

    - **snake_case**: Snake case is another case that uses underscore between words![](Images/image00333.jpeg)

    - **kebab-case**: And there is one more often called `kebab-case` or dash-case
    which is the use of dash between words. JavaScript variables should be camel case


    ![](Images/image00334.jpeg)


    ## Null and Undefined


    In the first section of JavaScript primitives where you talked about the five
    basic data types which are string, number, boolean, undefined, and null. Null
    and undefined were combined at the end and said you will discuss it in a subsequent
    section, you are going to be doing here![](Images/image00335.jpeg)


    They are both just values that a variable can be set to and they both mean nothing
    in a sense, but there is a big difference between them. The code illustrated above
    shows the difference


    ### Undefined


    If you declare a variable as you have above `age` but didn’t set or assign it
    to something which is a value, that means it is declared but not initialized to
    a value it is considered undefined


    Let’s see how it works


    If you run the above-illustrated code `var age` and didn’t set it to a value,
    you are telling JavaScript to make some space for something called `age` but didn’t
    store anything inside of the variable which is a value.![](Images/image00336.jpeg)


    If you ask for the `age` variable back it will tell you undefined![](Images/image00337.jpeg)


    ### Null


    Assuming you want to contrast that with asking for something that doesn''t exist
    at all like `colour`. It will give you an actual error message.![](Images/image00338.jpeg)


    And then null is another way of expressing nothing. but it is very different because
    null means something is explicitly empty or explicitly nothingness versus undefined
    which just means that something doesn''t have a value yet.![](Images/image00335.jpeg)


    In this example, you’re showing a case where you might use null so if you have
    a `current player` variable, you’re making a game and it is set to be a string
    of the name of the current player, if that player dies, then it is game over,
    you could set the `current player` to be null. To make it explicitly clear that
    there is no current player so this appears null.


    Undefined is similar to null in such a way that they both mean nothing but there
    is a big difference, null means explicit nothing

