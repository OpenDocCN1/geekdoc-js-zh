    如果你的网站有用户登录功能，你可以拥有一个名为 `current logged-in user` 的变量，它就能记录登录用户的用户名，并且还可以对其进行修改。一旦有人注销，它就会被设为空值或
    `false`。你还可以为足球游戏设置另一个变量，它可以在 `player 1` 和 `player 2` 之间切换，该变量负责记录或跟踪在任何时刻应该是哪个玩家操作。因此，JavaScript
    中变量的语法非常简单，


    ![](img/image00318.jpeg)


    `var` 关键字后面的变量名由你决定。无论你想给这个容器起什么名字，在该容器的标签后面都会跟着一个等号用于区分，然后是一个值和一个分号。你之后还会讨论什么时候需要分号，但目前你所做的任何操作，加分号或不加都可以（这将会进行讨论），但现在请在末尾加上分号。


    ![](img/image00319.jpeg)


    上面是三个变量的示例。第一个是 `var Aname`，我们给这个容器命名并将其设置为字符串 `"Michael is a string"`。下一个是 `var`（代表
    variable，变量），你正在创建一个名为 `Anumber` 的变量并将其设置为 `"85"`。最后一个是名为 `Aboolean` 的变量，并将其设置为
    `true`，这是一个布尔值。注意，变量可以是任何内容，但不建议以数字数值开头。让我们看看在你的控制台示例中它是如何工作的：变量将被称为 `"Myname"`，你将通过包含你的变量将持有的值
    `"Michael"` 来对等号进行赋值，如你所见，你的变量已经存储了，但尚未被声明或调用。你刚刚做的是指令 JavaScript 分留一些空间，并为该空间指定一个名为
    `"Michael"` 的名字。这看起来比直接在输出中返回 `"Michael"` 有点困惑。


    ![](img/image00320.jpeg)


    现在，每当你调用 `Myname` 变量时，你只需要输入单词 `"Myname"`（即你的变量），它会自动带出存储的值 `"Michael"`。它将为你提供
    `"Michael"` 或 `Myname` 中存储的任何内容，如下所示


    ![](img/image00321.jpeg)


    ### 变量的修改


    你也可以修改（更改）变量的值，让我们利用你的 `"Myname"` 变量和值 `"Michael"` 来作为如何修改值的延续。要做到这一点，你只需要重新赋值。你只需说
    `Myname` 等于，然后我将其更改为 `"Smith"`，这是另一个用于修改 `"Michael"` 的名字。


    ![](img/image00322.jpeg)


    现在，如果你再次询问作为变量的 `"Myname"`，它将不再识别 `"Michael"` 而是识别 `"Smith"`。因此，这是变量的一个重要特性：它们是可以发生改变的，这也是它们被称为“变量”（variable）的原因之一。


    ![](img/image00323.jpeg)


    ### 变量的拼接


    接下来是如何调用你的值并对其进行拼接。这次我们再创建一个变量，命名为 `"friend"` 并等于 `"John"`


    ![](img/image00324.jpeg)


    你只需要输入 `"hello there "`，你将把它与你的变量 `friend` 拼接在一起，这会调出 `"John"` 值，并确保在 `"hello
    there"` 的 `"there"` 后面添加一个空格，这样你的输出才不会突兀。从下面的插图中，你将得到 `"hello there John"`


    ![](img/image00325.jpeg)


    ### 更改拼接后的变量


    现在，让我们改变我们的变量值 `"John"`，它之前被拼接为 `"hello there John"`。要做到这一点，你必须更改调用变量 `friend`
    来改变值 `"John"`。现在你只需说 `friend equal to "nobody"`


    ![](img/image00326.jpeg)


    现在重新输入相同的行 `"hello there"` 加上 `"friend"`，你将得到 `"hello there nobody"`


    ![](img/image00327.jpeg)


    ### 存储数字


    让我们看看你如何在变量中存储数字或任何其他基本数据类型。所以，创建一个名为 `"Mynum"` 的数字等于 `"seventy-five"`


    ![](img/image00328.jpeg)


    ### 在变量中进行数学计算


    现在，每当你引用 `"Mynum"` 时，你将得到 `"75"`，你可以对它进行一些数学等式计算。看看类似 `"Mynum"` 加上 `"twenty-five"`
    的结果，你将得到 `"100"`


    ![](img/image00329.jpeg)


    或者你可以对 `"Mynum"` 取 `"ten"` 的模，你将得到 `"five"`，因为 `"ten"` 可以除尽 `"seventy-five"` 七次，返回的余数是
    `"five"`，它作为你的输出被返回


    ![](img/image00330.jpeg)


    关于变量和 JavaScript 的另一个重要概念是，你可以更改它们的值，也可以更改它们的类型。假设你想将 `"Mynum"` 的值改为字符串 `"50"`。你可以轻松地做到。输入
    `Mynum` 等于字符串 `"50"`，无论是字母还是数字都行。它是字符串没关系，在修改之前它是一个数字，但现在它是一个字符串


    顺便提一下，JavaScript 并不在乎。在某些语言中，这可能是一个问题，你无法这样做。JavaScript 拥有所谓的“动态类型”特性，这意味着它可以毫无问题地从一种类型变为另一种类型


    ![](img/image00331.jpeg)


    ### JavaScript 规范


    关于变量你最后想提到的点是，关于如何命名它们有一个规范


    - **驼峰命名法 (camel case)**：驼峰命名法像这样 `"name"`、`"number"`、`"string"` 等，所有内容必须以小写字母开头


    ![](img/image00332.jpeg)

    - **蛇形命名法 (snake_case)**：蛇形命名法是另一种在单词之间使用下划线的格式![](img/image00333.jpeg)

    - **get 命名法 (kebab-case)**：还有一种通常被称为 `kebab-case` 或连字符命名的形式，是在单词之间使用连字符。JavaScript
    变量应该使用驼峰命名法


    ![](img/image00334.jpeg)


    ## Null 和 Undefined


    在 JavaScript 原型的第一部分，你提到了五种基本数据类型：string、number、boolean、undefined 和 null。Null
    和 undefined 在最后合并在一起，并说将在后续章节中讨论，你将在这里进行![](img/image00335.jpeg)


    它们都只是变量可以设置的值，在某种意义上都意味着“无”，但它们之间存在巨大差异。上面的代码展示了这种区别


    ### Undefined


    如果你像上面那样声明了一个变量 `age`，但没有给它设置或赋值某个值，这意味着它被声明了但尚未初始化值，它被视为 `undefined`


    让我们看看它是如何工作的


    如果你运行上面所示的代码 `var age` 且没有为它设置值，你是在告诉 JavaScript 为名为 `age` 的东西留出空间，但没有在变量内部存储任何内容（值）。![](img/image00336.jpeg)


    如果你查询 `age` 变量，它会告诉你 `undefined`![](img/image00337.jpeg)


    ### Null


    假设你想与询问一个完全不存在的东西（如 `colour`）进行对比。它会给你一个实际的错误信息![](img/image00338.jpeg)


    然后 `null` 是另一种表达“无”的方式。但它非常不同，因为 `null` 意味着某物显式为空或明确不存在，而 `undefined` 仅仅意味着某物还没有值![](img/image00335.jpeg)


    在这个示例中，你展示了一种可能使用 `null` 的情况：如果你有一个 `current player` 变量，你正在制作游戏，它被设置为当前玩家名字的字符串；如果该玩家死亡，那么游戏结束，你可以将
    `current player` 设置为 `null`。以明确表示没有当前玩家，这样就会显示为 `null`。


    `Undefined` 在这一点上与 `null` 相似，因为它们都意味着“无”，但有巨大差异，`null` 意味着明确无


    '
- fmt: "\nNothing versus `undefined` means that something is empty or doesn't have\
    \ value yet. Though it doesn't sound like a big difference, as you go throughout\
    \ this guide you will run into `undefined` and you will see the difference and\
    \ it will make a lot more sense later on, but I just want you to be aware that\
    \ there is a big difference.\n\n## Useful Built-In Methods\n\nIn this section,\
    \ you are going to introduce JavaScript methods and you will use three built-in\
    \ methods which will be useful for the next set of exercises. Those methods are\
    \ `alert`, `prompt` and `console.log`.\n\n![](Images/image00339.jpeg)\n\nOne thing\
    \ you will notice is that I am using JavaScript comments just like in CSS and\
    \ in HTML, all JavaScript has its way of defining comments which is just notes\
    \ and things that don't run and are not executed.\n\n![](Images/image00340.jpeg)\n\
    \nSo, you use double slashes `//`, and then whatever you put after it won't be\
