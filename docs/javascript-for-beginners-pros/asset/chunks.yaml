    ![](Images/image00644.jpeg)


    Then the next one appears which is “orange”.


    ![](Images/image00645.jpeg)


    Next “yellow”.


    ![](Images/image00646.jpeg)


    And finally “green”.


    ![](Images/image00647.jpeg)


    Again, what you would actually do with something like comments that you do for
