    functions, it is not just about repeating code or singing the same "twinkle twinkle
    little star" over and over. It is about repeating code that you can also change
    a little bit that you have some variables in. So, argument empowers you to do
    that.


    ## The Return Keyword


    The last fundamental piece of JavaScript functions is the `return` keyword.


    ![](Images/image00550.jpeg)


    This section is going to focus on the `return` word. Functions are like a machine,
    when you write a function, it takes some inputs, and it does something with those
    inputs. It checks if a user logged in, it adds to a score, and then it returns
    something at the end. There is an output that it sends back. So far, functions
    have only taken inputs and they haven''t sent anything back, so I will show you
    what I mean if you have a function called `square` which you saw in our last section
    and `square` took an input. Call it `x`, `console.log x times x`.


