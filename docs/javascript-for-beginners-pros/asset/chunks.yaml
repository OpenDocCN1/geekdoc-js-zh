    然后，只要你输入单词“yes"（是），它就会告诉你“Yah，你做到了”。这不是一个运行“5”次或“10”次的预设循环。它可以发生变化，完全取决于用户的输入。


    ![](img/image00499.jpeg)


    还有一个要求是你也可以输入单词“yeah”或“yes”，其中任何一个都能完美运行。你只需要在你的 `while` 循环条件中，添加另一部分代码，在 `response`
    不等于 "yes" 旁边包含 `&&` 符号，并加上 `response` 不等于 "yeah"。


    ![](img/image00500.jpeg)


    一旦你刷新浏览器并输入了这两个答案之外的任何内容，它将继续显示弹出框。


    ![](img/image00501.jpeg)


    但一旦你输入了“yeah”，这与“yes”是同等或备选答案


    ![](img/image00502.jpeg)


    ![](img/image00503.jpeg)


    注意：结果可以通过不同的方式实现，不需要什么复杂的编码或简单的编码，只需用任何你觉得方便的方式即可。


    ### For 循环


    For 循环与 `while` 循环类似，它们都允许你重复代码，但在语法上略有不同。在本节中，你将理解 for 循环的作用、为什么要使用它、如何编写 for
    循环，并将 for 循环与 while 循环进行对比。


    ![](img/image00504.jpeg)


    上面是“for 循环”的方法。将单词 `for` 写为关键字，然后在括号中有三个部分，你将其中一部分写为“初始化、条件和步进”。下面是一个使用“for 循环”打印从
    1 到 5 的数字的示例：以 `for` 开始，创建一个变量并命名为 `count`，将其设置为 `"1"`，在同一行中，你将写上条件（当 `count`
    小于 6），以及你的增量方法（即给 `count` 加 1）。


    ![](img/image00505.jpeg)


    这个概念与“while 循环”相似，所以你可以看到下面“while 循环”的等效形式，它与“for 循环”中的代码相同。


    ![](img/image00506.jpeg)


    区别在于“for 循环”使用了更短的代码，另一个区别是变量 `variable count` 只存在于循环内部。“while 循环”的变量必须在外部初始化，以便你可以在
    `while` 循环条件内部使用。在“for 循环”中，你可以创建一个只在“for 循环”内部短暂存在的的变量。


    为了更好地理解，创建一个变量并命名为 `count`，让它在每次通过 for 循环时从 `"1"` 开始。给 `count` 加 `"1"`，只要 `count`
    小于六就继续进行。第一次运行 `count` 时让它为 `"1"` 然后打印出来。下一次，加 `"1"`，它仍然小于 `"6"`，再次打印出来并继续进行，直到
    `count` 为 `"6"`，此时它不再小于 `"6"`，代码将停止运行。


    将你的“for 循环”代码复制到 `console.log` 中查看效果。


    ![](img/image00507.jpeg)


    上面是 for 循环的代码和输出，结果为 1, 2, 3, 4, 5。


    下面是另一个示例，采用了你在“while 循环”中所做的操作，即在单独的一行打印字符串“hello”的每一个字符，但是用“for 循环”来实现的。再次你可以看到，你不需要像在“while
    循环”中那样在循环外部创建 `count` 变量。


    ![](img/image00508.jpeg)


    你可以创建一个临时变量，我使用了名为 `i` 的变量，原因是对于“for 循环”变量来说，使用非常短的单字母名称（如 `i`、`j`、`x` 等任何小写字母）是非常常见的做法，这是因为它们没有其他用途，只是为了存在于“for
    循环”内部。有些人人会认为，在之前的“for 循环”示例中，保持它们简短更好。创建一个变量 `i` 每次循环时都等于 `"0"`，你将加 `"1"`，只要
    `i` 小于字符串的长度就继续进行。逻辑与你在“for 循环”中的操作相同。下面是“while 循环”的插图。


    ![](img/image00509.jpeg)


    创建一个名为 `str` 的变量并添加值 `"hello"`，然后创建另一个变量进行计数（`count`），将其设置为 `"0"`，并在每次通过时加一，只要
    `count` 小于长度就继续。


    运行你的“for 循环”查看结果，你得到了结果，但在 Chrome 浏览器中它打印了 "hello" 中的第一个字母 l，但在它旁边有一个数字 `"2"`。Chrome
    不会重复 `console.log` 打印的字母，而是在旁边显示一个分数或标识。再次总结一下，在“for 循环”内部有三个部分：初始化（你在此处声明变量并将其设置为某个初始值，不非得
    `"0"`，取决于变量的值或你的用途），接下来的部分是条件，即循环何时保持运行。最后一部分是步进，即你在每次迭代结束时所做的操作（加 1）。


