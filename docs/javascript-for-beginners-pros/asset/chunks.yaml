    \    <h3>Header Three</h3>\n    <h4>Header Four</h4>\n    <h5>Header Five</h1>\n\
    \    <h6>Header Six</h1>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n\
    ```\n\n接下来，我们在同一目录下创建一个名为 `script.js` 的单独文件。在这个文件中，我们将添加一个简单的 alert 来测试连接性。\n\n\
