    a native, standards-based, non-extended `JavaScript`. There is no difference between
    `vanilla JavaScript`, and `JavaScript`, it is just there to emphasize the usage
    of plain `JavaScript` without the use of libraries and frameworks.


    ## What are libraries and frameworks?


    `JavaScript` libraries and frameworks both contain sets of prewritten, ready-to-use
    `JavaScript` code but they are not the same thing. You can think of a framework
    as your blueprint for building a website, it gives you a structure to work from
    and contains ready-made components and tools that helps you to build certain elements
    much quicker than if you were to code them from scratch. Some popular `JavaScript`
    frameworks include `Angular`, `React`, `Vue`, and `Node.js`. Frameworks also contain
    libraries. Libraries are smaller than frameworks and tend to be used for more
    specific cases.


