    "forEach" 是一个称为数组原型（array prototype）的部分，所有的 `push`、`pop`、`shift` 和 `unshift` 等方法都存在这里。如上图所示，它接受一个函数作为参数。编写数组的名称（如
    `colours`、`comments` 等）后跟一个点和 `forEach`，注意使用驼峰命名法，大写字母 "E"，然后传入该函数。它看起来不像 `somefunction`，通常你最常看到的是匿名函数，就像你上面那样的
    `colours.forEach(function(colour)){ }`。


    因此，你传递整个函数，然后该函数会在数组的每一个元素上被调用。例如，在你的控制台中，将插图中的代码复制到控制台中。


    ![](img/image00650.jpeg)


    你有一个 `colours` 数组，然后写下 `colours.forEach`，你传递的任何内容将在每个元素上被调用，然后你就有了“匿名函数”。所以，写下
    `colour.forEach` 然后是一个“空函数”，目前你将在 `forEach` 内部编写 `console.log`，然后按回车。


    ![](img/image00651.jpeg)


    Chrome 浏览器会将所有这些 `console.log` 结果压缩成一行，因为它们是重复的语句，数量会在结果开头汇总，这代表了你的变量重复的次数，对于数组中的每个项目“red,
    orange, yellow, green”，是一次。实际上，看到这一点更简单的方法是使用 alert。


    ![](img/image00652.jpeg)


    当你点击完关键词后的回车键，你会立即收到第一个 alert，点击 ok 按钮，你会收到第二个，直到第四个 alert。


    ![](img/image00653.jpeg)

    ![](img/image00654.jpeg)

    ![](img/image00655.jpeg)


    当你立即点击第四个 alert 的 ok 按钮时，执行停止，因为它正在对数组中的每个项目进行操作。


    ![](img/image00656.jpeg)


    "forEach" 不仅用于运行代码，还可以用于收集数据以便评论或将某些内容保存到数据库，也可以为每个项目增加分数，但它通常用于以某种方式交互或操作这些数据，而不是仅仅是地
    alert 或 `console.log`。


    你可以通过你的函数获取这些数据（无论是匿名函数、命名函数还是函数表达式，没关系，只要是那个函数，你拥有它，除了一个参数），所以让我们重写它，它可以被命名为任何你想要的，就像你定义的任何函数一样。所以，我将从一个像
    "I love pet" 的名字开始，除非在某些情况下有意义，否则你可能永远不会在代码中使用它。


    你可以考虑其中任何一个并取 pet 每次打印 "ilovepet"，因此在 `forEach` 内部使用 `console.log` 加上 "ilovepet"
    并按回车。你会看到你得到了所有项目的打印结果，因为当它们在同一行代码中全部打印时，它们是不相同的。


    ![](img/image00657.jpeg)


    恰恰发生的是，"ilovepet" 在你遍历数组或当 "forEach" 遍历数组时，持有着该数组中每个项目的值。所以，它为每个项目都调用了这个函数。而且它不仅是调用了它，还将我们的变量值
    "red, orange, yellow, and green" 传递给函数。


    让我们看看一种替代语法，这并不是替代语法，而是另一种定义函数并传递它的方式。它就像任何其他函数一样，称之为 `print colour`，它所做的一切就是接收一个名为
    `colour` 的参数，然后在大括号内部执行一个 `console.log`。在那处写一行星号开始并复制那一行。在下面，写下 `console.log colour`，然后再次粘贴你复制的星号。这样，你就定义了一个示例函数。


    ![](img/image00658.jpeg)


    你注意到点击回车后什么都没有发生，那那是因为你只定义了函数，但没有调用它 `printcolour`，让我们来一个 "blue"。作为返回，你会得到我们输入的参数，即星号、blue、星号。


    ![](img/image00659.jpeg)


    正如刚才回顾的，你会在结果的末尾也得到 `undefined`，因为你的函数没有返回任何内容，但它打印了三行代码。


    ![](img/image00660.jpeg)


    你可以使用 "forEach" 在数组的每个项目上运行这个 `print colour`，并处理数组中的每个项目。你需要做的只是输入 `colours`（即你的数组）并跟
    `forEach`，而不是在括号内输入一整个函数，你只需要传递 `printcolour`。这是一个非常重要的笔记，我没有在 `printcolour` 前面加括号，如果你在那里加了括号，你将立即调用该函数。


    记住，每当 JavaScript 看到函数后面跟着括号时，它就会自动执行，无论你是否是将其传递给 "forEach"，它仍然会在你想要它调用之前被调用。你想做的只是传递不带括号的
    `printcolour`，你是在告诉 "forEach" 这里就是函数。如你所看到的，你得到了 "red, orange, yellow and green"，背后发生的是
    "forEach" 正在获取 `print colour` 并运行打印从你的初始 `colours 变量` 中的每个项目。


