    ## Exercise 1


    #### • Question 1


    Evaluate the following statements


    1.  100 % 3


    2.  ("Michael " + "Smith") [10]


    3.  "hello".length % "hi\\".length


    ## Solution


    1.  “100 % 3” remember modulus or modulo is the remainder operator, divide “3”
    into “100” as many times as it can go in so that is going to be “33” times, and
    then you subtract “33” times three which is “99” from “100” and you get “1”. Divide
    “3” as many times as possible and then take the remainder so that should be “1”.
    If you want to run this in our console you can still go ahead and do so “100 %
    3” and you get “1”


    ![](Images/image00711.jpeg)


    2.  Next, you have the string "Michael" that is being added to another string
    "Smith" remember that is called concatenation, and because you have the parentheses
    around it that will happen first. That is the equivalent of running "Michael"
    plus "Smith" which will give you “Michael Smith” with a space which has been specified
    at the end of "Michael" which is the letter "l"


    ![](Images/image00712.jpeg)


    You might remove or include the parentheses it has nothing to do with the execution
    of the code as you can see above the implementation or declaration statement removed
    what is expected.


    Now, add the square brackets with the character which is "ten" to figure out which
    letter among the word is holding the number 10 character. So, that is going to
    be the tenth index which is the tenth character because it starts counting from
    zero only a length property verification counts at one, so you will end up with
    the letter “i”


    ![](Images/image00713.jpeg)


    Just in case you want to remove the parentheses make sure you are using the first
    result output to carry out your declaration as shown below


    ![](Images/image00714.jpeg)


    3.  And lastly, your last exercise is a bit trickier. It combines numbers and
    strings in one expression. Start from the left-hand side "hello".length that is
    going to be "index five" always remember that length counting start at "one".
    So, you ended up with "five" as the length property for "hello"


    ![](Images/image00715.jpeg)


    The next on the declaration is the modulus sign which has been discussed about
    its functionality then the next one is even trickier because it looks like it
    is four characters which are "hi\\" but in actuality when you run this string
    and click enter it comes back to us as just three characters, and that is because
    you are escaping the last backslash character which means 5 (“hello”) – 3 (“hi\\”)
    equals to 2 as shown from our illustrated output result. This illustrates that
    "three" goes into "five" one time with the remainder of two


    ![](Images/image00716.jpeg)


