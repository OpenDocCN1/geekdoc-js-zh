    ## Introduction to Objects


    There are two main objectives in this section. First understand what objects are,
    why you use them, how do they compare to an array. And then the second objectives
    are how to write some code using JavaScript objects.


    Here is a hypothetical situation, suppose that you want to model a single person
    in JavaScript each person has a "name", "age" and "city". There are different
    ways you can do that. You can have three different variables "name", "age" and
    "city" but then let’s assume that they are not related to one another they are
    separate. If you want to connect them, you can use an array-like you are doing
    here "var person is equal to array” where the first item is named "Cindy", the
    second item is "age 32", and the last item is "Missoula" which is the city name.


    This is not a great use of an array because this data is not a list. Yes, you
    can force it into an array but it doesn''t lend itself to the format of an array
    where you have lists that often have a logical order, there isn''t a logical order
    here to access the city out of this array.


    ![](Images/image00665.jpeg)


    Type person bracket two, and that requires me to know that the city is at index
    two.


    ![](Images/image00666.jpeg)


    If you accidentally reverse the order and add "Travis" which is index "0" but
    then you mix these up instead of "age" you have "city" known as "Los Angeles"
    which is index "1", and finally "age" which is index "2", then if you try to access
    "person2" bracket "2" You will get "age" instead of city


    ![](Images/image00667.jpeg)


    This is just to show that an array is not a perfect solution for every situation.
    There is a much better data structure you can use which is the JavaScript object.
    You can see an example below of how you would take the person array with name,
