    ## Conditionals


    In this section, you’ll cover one of the most important concepts in programming.
    Conditionals are important because they are used to add decisions to your code.
    It is how you add logic to your programming.


    For example, when you log in to a website and you type a password, in that form,
    there is code that checks that the password that you typed in if it is against
    the saved password in the database or not before access can be granted, and if
    they match, you log into the site you will be redirected to a full membership
    page and if they don''t match you will get an error message or a warning message.


    Another example would be when you buy something online and you type your credit
    card details. If the transaction goes through, you will get a confirmation email
    on your screen, and if there is some problem with your details or you don''t have
    enough funds in your account you are going to get an error message. Again, two
    different outcomes


    There are three keywords that you need to remember, they are: `if`, `if else`,
    `else`. These are the three JavaScript conditional keywords and yes, though `else
    if` is technically two English words but to JavaScript, it is just one keyword.


    ![](Images/image00406.jpeg)


    The example, you are going to use to illustrate the conditional statement is that
    of a bouncer at a concert venue. The idea is that you are going to have an `age`
    variable and if that person is younger than 18 unfortunately that person cannot
    get into the venue. If that person is older than 18 but they are not yet 21 that
    means they can enter but you have to draw an x in their arm, or their hand because
    they cannot drink. And then lastly anyone else if you are greater than 21 you
    can get in and drink. Those are the three things that you are going to try and
    write with code.


