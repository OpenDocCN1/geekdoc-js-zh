    You can also use the indices to update an array value, so if "Smith" wants to
    change his name to "David" all I have to do is to find "Smith" from the array
    with an index which is index "0" and `friends[0] = "David"` set it equal to another
    string "David" which is what will want to change it into another string called
    "David".


    ![](Images/image00579.jpeg)


