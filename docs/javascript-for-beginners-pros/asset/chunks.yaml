    To use the value to capture the output of `square`, the square of four if you
    want to use that somewhere else, you can call back this line that looks like the
    10 squared is the plus square of 10, and this is going to run, it is going to
    pass 10 in, and then multiple by `x` times `x` and returned `100`.


    ![](Images/image00556.jpeg)


    It is going to send it out of the function and put it right into your called declaration
    which is `"4 squared is: "` + `square(4)`. And you will get four squared is 100.
    You can also use the `return` keyword to save it in a variable, you can do something
    like this `var result square of 12`.


    ![](Images/image00557.jpeg)


    And now if you look at the result, you got 144.


    ![](Images/image00558.jpeg)


    The function call `"square of 12"` was evaluated and it “returned 114” which was
    then stored in the `result` variable. Note that will use the `return` keyword
    to output a value from a function.


    ## Function Declaration vs Function Expression


    There are two different syntaxes for declaring a function. The first one is called
    a "function declaration". Write a function and the name of the function, then
    pass in the arguments and rewrite your function body inside of the two curly brackets.


    ![](Images/image00559.jpeg)


    The other way of writing a function is called a "function expression". To do that,
    write a variable `capitalize` and set it equal to a function.


    ![](Images/image00560.jpeg)


    The difference between the two is that if you declare a function as an "expression"
    `var capitalize equal function`, and if you decide to change `capitalize` to be
    equal to the number 10 or the number 15 your function will be lost. To exemplify
    that, in your console type `var sayHi is equal to a function` and the function
    will say `console.log "hello world!"` then click your enter button to store it
    inside our browser console virtual storage.


    ![](Images/image00561.jpeg)


    Hence, you can say `sayHi()` and the same way as the function declarations that
    you’ve seen.


    ![](Images/image00562.jpeg)


    But I can also decide that `sayHi()` is now equal to 100 instead of "hello world".


    ![](Images/image00563.jpeg)


    And now if you refer to `sayHi()`, you can''t evaluate it again, you can''t run
    it as a function anymore.


    ![](Images/image00564.jpeg)


    As you progress in the subsequent sections, you will be using declarations and
    expressions and you will see why you would use one over the other.


    ## Higher-Order Functions


    Higher-order functions are functions that either take a function as an argument
    or return another function.


    ### Set interval


    `setInterval` takes a function and calls that function at a specific interval.
    It is a way to have something repeat every second or every half a second.


    With a loop, you can repeat things and it happens immediately, but with a `setInterval`,
    you can put a timer on it. Let’s go ahead and take a look at how “setInterval”
    works. Before that, you need to define a function that you will use to pass to
    `setInterval`.


    Write code to sing "twinkle twinkle little star" again. Abbreviate and schedule
    it to run using “setInterval” every second. First, you need to write the "twinkle
    twinkle" code. Type `function sing` and that is just going to come to `console.log
    "twinkle twinkle..."` and also `console.log “how I wonder…”`.


    ![](Images/image00565.jpeg)


    Leave it like that so you can call `sing` yourself and.


    ![](Images/image00566.jpeg)


    The next thing to do is to use `setInterval` to make `sing` or to call `sing`
    every 100 milliseconds or every second. To do that, define the pattern below to
    `setInterval` takes two arguments, it is just a function but it takes another
    function as its argument, the first one is say "anotherfunction" and the second
    one is the “interval” in milliseconds.


    ![](Images/image00567.jpeg)


    Fill this "setInterval", "another function", the function you want it to call
    is called "sing" and the interval is `"1000"` milliseconds or you can set it to
    half a second `"500"` milliseconds or `"1"` millisecond which would be insanely
    fast. Rather, do `"1000"` millisecond, this is going to call whatever is inside
    of `sing` these two lines of `console.log` will be repeated continuously in form
    of a transition way, and when you click enter you will see that it starts to happen.
    Also, before it disappears when you run `setInterval` it returns the "number one".


    ![](Images/image00568.jpeg)


    Furthermore, you might be wondering why you parentheses after `sing`, it is because
    you are not the one calling `sing`, `setInterval` is the one calling `sing` every
    `"1000"` seconds.


    You don''t want to execute it, you only have to allow `setInterval` to execute
    it. You are just passing the name `sing` and the code inside of it but you are
    not running it, leave that to `setInterval`.


    To stop `setInterval`, you need to use the return number which is number `"1"`
    (although it might vary) to `setInterval` and you can use that return number to
    stop it.


    There is another function called `clearInterval` just give it that return "number
    one" as the case may be at your end.


    ![](Images/image00569.jpeg)


    To sum this up `setInterval` is just one example of a higher-order function, and
    a higher-order function is one where you can pass another function to it as an
    argument, and you can return another function that you haven''t seen yet but most
    often you will be passing a function into another function.


    There is one other change you can make which is sometimes that you want to run
    some code every second. For instance, “setInterval” but you don''t want to define
    a separate function ahead of time. So, instead of "sing", you don''t have a function
    yet and I want to write it right inside the "setInterval” do that with something
    called an "anonymous function" and that looks like the illustration below. So,
    I write `function` but I don''t give it a name because I am never going to use
    it again. I am just giving it to `setInterval`.


    ![](Images/image00570.jpeg)


    Put function inside parentheses and then inside of the curly bracket, you will
    write our code and click enter key from your keyword. So inside of the curly brace,
    I put my `console.log "I am an anonymous"` function and `console.log "This is
    lovely"`. So, then I need to add my interval comma and let’s do this every two
    seconds. So, this is a little bit hectic looking, coming from our simple sing
