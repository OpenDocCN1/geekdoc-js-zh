    字符串是文本，重要点是它们位于引号内部，如上所示。你也可以看到你有两个例子，引号内有单词“hello this is a string”，这就是一个字符串，尽管它包含多个单词，它仍然是一个字符串；下一行也是如此，它是一个数字
    `75`，但它在引号内部。所以，对 JavaScript 来说，它被视为字符串。你可以在字符串中包含数字、文本或任何字符。它们也可以是引号内的数字字符，而这些引号可以是单引号或双引号。例如，输入
    `"hello, this is my first string!"` 并点击回车


    ![](img/image00301.jpeg)


    就像之前的数字值一样，它会返回（吐出）该值，你对单引号也可以同样的操作，输入 `hello, here is my single quotes` 并点击回车，它就会将其返回（吐出）给你。注意，它用双引号而不是单引号显示给你，这是因为它们对它们的处理方式是相同的


    ![](img/image00302.jpeg)


    还需要注意的另一点是，如果你对双引号做了操作，比如 `"hello world''`，并以单引号结束，它将无法计算，它们必须匹配


    ![](img/image00303.jpeg)


    关于单引号和双引号的另一点是，你可以有一个同时使用两者的字符串。所以，你可以有一个内部包含单引号的双引号字符串，而不会产生错误信息。例如，如果你想要一个显示为
    `"I can''t stop loving strings"` 的字符串。注意，在双引号内部有一个单引号，位于“can’t”中字母“n”和“t”之间，这是有效的，因为你在外层使用了双引号


    ![](img/image00304.jpeg)


    如果所有内容都使用单引号，它仍然无法工作，因为这会指示字符串不完整，缺少了一个。下方的插图显示存在一个不完整的意外标识符


    ![](img/image00305.jpeg)


    ### 字符串拼接 (Concatenation)


    你对字符串可以做的操作之一就是将它们相加，就像数字一样，或者你可以写 `"one" + "five"`。你可以做同样的事情，让一个字符串加上另一个字符串，发生的结果是
    JavaScript 将它们合并成一个字符串，这被称为拼接。所以，如果你这样做 `"hi" + "here I am"` 并点击回车，你会得到一个返回字符串


    ![](img/image00306.jpeg)


    如果你想在你最近的结果 `"hihere"` 中间添加一个空格，你只需要在 `"hi"` 的末尾添加空格（即 `"hi "`）或者在字母 "here" 的开头添加空格（即
    `" here"`）。现在你可以从我们下面的结果中看到，输出与上面的第一个输出得到了正确的修复。这被称为拼接


    ![](img/image00307.jpeg)


    ### 转义字符 (Escaping character)


    有时你可能想在双引号的字符串内部包含一个双引号，可能你有像 `"she said "goodbye!””` 这样的内容。你希望 goodbye 开头有双引号，且不希望它是单引号，或者你只想那样使用它，而不会因为违反字符串用法而产生错误信息。有一种方法可以做到，称为转义字符。


    JavaScript 转义字符都以反斜杠开头，这是一种跳出字符串并编写在字符串中可能无效的特殊字符的方法。所以，输入 `"she said \"goodbye!\"
    "` 点击回车，你会看到，它返回了你的输入而没有返回错误信息。反斜杠后跟一个双引号就是你告诉 JavaScript 你想在字符串中使用双引号的方法。在大多数浏览器版本中，反斜杠在输出结果中可能可见


    ![](img/image00308.jpeg)


    如果你不那样做，下面将是你立即获得的错误信息：“invalid or unexpected token”（无效或意外标记）


    ![](img/image00309.jpeg)


    ### 长度属性 (Length property)


    你创建的每个字符串都有一个 `length` 属性，`length` 指字符串中字符的数量。如果你创建一个仅为 `"hello"` 的字符串，并对其带上 `.length`，这将计算
    `"hello"` 语句中每个单词的数量。它会告诉你长度是五个字符


    ![](img/image00310.jpeg)


    如果你执行类似 `"my preferred number is 12345"` 的操作，你会得到 28 作为输出结果，那是 28 个字符。JavaScript
    也会将空格计算在内


    ![](img/image00311.jpeg)


    你可以使用 `length` 属性获取字符串的整个长度，也可以使用方括号符号获取单个字符，例如第一个字符或第五个字符。例如，写下 `"hello"` 后跟一个方括号，在方括号内添加你想调取的特定单词数字，该数字将对应于字符串中你想要的字符的位置，JavaScript
    将从“零”开始计数。要获取第一个字符，创建一个字符串 `"hello world"` 后跟方括号，如果你想要第一个字符就使用 `"zero"`，因为 JavaScript
    从“零”开始跟踪，这正是插图中的第一个字符。下面，结果是字母“h”，它是第一个字母，因为 JavaScript 从零开始计数，这适用于其他编程语言


    ![](img/image00312.jpeg)


    如果你想获取字母 `"w"`，你需要从“零”开始手动计数，如你所见，字母“w”是数字“六”。确保计数时包含行间距，否则你可能会得到不同的结果


    ![](img/image00313.jpeg)


    如果你还想获取最后一个字符，你仍然需要从“零”计数，如果计算得当，那是“十”


    ![](img/image00314.jpeg)


    你可以使用 `length` 属性知道 `"hello world"` 的长度是 `"eleven"`，这是因为 `length` 属性从一开始计数。它只是字符的数量，但位置是从“零”开始跟踪的，最后一个字符
    "d" 的索引总是比总长度少一


    ![](img/image00315.jpeg)


    ### 3. 布尔值 (Booleans)


    ![](img/image00316.jpeg)


    下一个数据类型是布尔值，布尔值只有两个选项，它们是真 (true) 或假 (false)，间接说是是或否。没有引号，没有数字，只有 true 或 false
    这两个词，如此。在随后的讨论中，这将变得更加清晰。


    #### 4. 空与未定义 (Null & Undefined)


    ![](img/image00317.jpeg)


    还有两个数据类型是 null 和 undefined，它们是值，而不是类别。没有像数字或字符串那样有多种类型的 null 或 undefined。只有一个
    null 只有一个 undefined，它们只是你随着时间推移将讨论的值。


    ### 变量 (Variables)


    变量是一个带有名称的容器，在容器内部，你可以存储数据。变量是存在于每编程语言中的概念，其基本概念总是相同的。基本的原始数据类型如字符串、数字、布尔值，变量只是容器或罐子中的一个地方，你可以把这些放入其中并给它们起一个名称供以后引用。然后，当然，变量名意味着你存储在容器中的数据是可以被修改的。


