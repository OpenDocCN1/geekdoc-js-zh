    i = 1`, and you are going to keep multiplying, while `i` is less than or equal
    to `num` then you are going to add 1 every time. And then all that you want to
    do is to multiply the `result` by `i`


    ![](Images/image00800.jpeg)


    Therefore, if you step through your code and you did it for 4 factorials of 4
    `result` starts as one right, and then you are creating `i` which also start at
    1, and you multiply the `result` by `i`, that is just 1 time 1 which you’ll notice
    is unnecessary.


    So, you might want to just start this at `2` so the first time through you multiply
    `i` times `result` which is `1` times `2`, next time through `i` is now `3` because
    you add one from our incremental so that is still less than the number which is
    factorial `4`.


    ![](Images/image00801.jpeg)


    And you multiply again `result = the current value result` which is `"1"` times
    `"2"` times `"3"` so then you have `"6"` and then the next time through `i` now
    is `4`. So `"4"` is less than or equal to `"4"` that is `"true"`


    So, when you multiply one last time by `"4"` and then it adds `"1"` to `i` in
    your loop and now you are done since you are using factorial 4 as an example which
    JavaScript won’t go again the set number because now you have `5` and it is not
    less than or equal to `4`.


    ![](Images/image00797.jpeg)


    There is one small change you could make. You don''t need to say `result = result
    * i`, you can shorten this by using `*=` which is just a shortcut for the same
    thing you just did


    ![](Images/image00802.jpeg)


    And then the last thing that you need to do is to return the `result`


    ![](Images/image00803.jpeg)


    Save it, and open your browser, refresh the page and you should have access to
    your `factorial` function. Let’s try factorial of five and you get twenty-four


    ![](Images/image00804.jpeg)


    And factorial of six, you’ll get seven hundred and twenty, likewise factorial
