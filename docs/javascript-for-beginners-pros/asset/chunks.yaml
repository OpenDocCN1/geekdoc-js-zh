    this container and set it equal to the string `"Michael is a string"`. The next
    is `var` which stands for variable, you’re creating a variable called `Anumber`
    and setting it to be `"85"`. And the last one is a variable called `Aboolean`
    and sets it to be `true` which is a boolean value. Note the variable could be
    anything but it is not advisable to start it with a number value. Let’s see how
    it works from your console example variable will be called `"Myname"` and you
    are going to set an equal to by including a value that your variable will hold
    which is `"Michael"`, and as you can see your variable has been stored but not
    yet declared or called upon. What you have just done now is to instruct JavaScript
    to make some space, and to also give that space a name called `"Michael"`. It
    is a little bit confusing instead of returning `"Michael"` in your output.


    ![](Images/image00320.jpeg)


    Now, whenever you ask for `Myname` variable, you will just type the word `"Myname"`
    which is your variable and it will automatically bring out `"Michael"` which is
    the stored value. It is going to give you `"Michael"` or whatever is stored in
    `Myname` as shown below


    ![](Images/image00321.jpeg)


