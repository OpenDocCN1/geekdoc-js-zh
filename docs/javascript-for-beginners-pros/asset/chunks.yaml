    # 原始类型与数学运算符


    你将从基础内置原始数据类型开始。每个编程语言的核心思想之一是区分不同类别数据的能力。例如，一种语言可以区分数字和单词，或者它可以区分整数和小数，或者正数和负数。这些都因语言而异。


    ## JavaScript 中的五种基础原始数据类型


    有五种底层基础数据类型，它们是：数字、字符串、布尔、null 和 undefined


    ### 1. 数字 (Numbers)


    ![](img/image00288.jpeg)


    这里有三个例子：整数、分数、小数 7.2 以及负数 -20。我选择这三个是因为我想向你展示 JavaScript 并不关心数字是整数、分数还是负数。它们都被视为数字，这是一个宽泛的类别。其他语言会区分，但
    JavaScript 不会，忘记数字只是整数、分数和负数的一个类别即可。为了理解数字如何工作，你将使用数学运算符来解释它们以便更好地理解


    ### 数学运算符


    为了更好地、更快速地吸收，你将使用 Chrome 控制台来获取快速结果以验证所解释的内容，进入你 Chrome 浏览器中的 `console.log`，你可以按
    `Ctrl + Shift + I` 进行检查。这让你轻松访问你的 `console.log` 接口。默认情况下，它会显示元素（element），点击 `console.log`
    然后就可以开始编码。


    从你的“console”中，当传递像 9 这样的数字并按回车时，它会自动返回。浮点数（小数点）和负数也是如此，这样就无需持有这些值。这只是基础知识；你还没有在编写任何有趣的应用程序。


    ![](img/image00289.jpeg)


    ### 加法运算符 (Addition Operator)


    你可以对这些数字做的第一件事是简单的数学运算，这些是你已经熟悉的、与计算机系统无关的基础数学。。诸如加法、乘法、减法和除法。只需编写简单的表达式，例如数字
    "four" 加 "fifty"，你可能会注意到我在加号两边使用了两个空格，这并不是强制要求的，只是为了代码整洁。如果你点击回车，你将自动获得五十四


    ![](img/image00290.jpeg)


    你也可以在不留空格的情况下 "four" 加 "fifty"，它仍然会正常工作。


    ![](img/image00291.jpeg)


    这些是简单的运算符。你还可以通过输入 "ten" + "thirty-five" + "fifty-five" 将它们链起来，你将得到 "one hundred"


    ![](img/image00292.jpeg)


    ### 除法运算符 (Division Operator)


    你也可以使用其他运算符如除法，例如，“ten”除以“five”，等于“二”


    ![](img/image00293.jpeg)


    你也可以做像 "one" 除以 "three"，如下所示，我们得到了零点三


    ![](img/image00294.jpeg)


    ### 减法运算符 (Subtraction Operator)


    你还有减法，假设是 "five" 减 "twenty"，如下所示，答案是“负十五”


    ![](img/image00295.jpeg)


    ### 乘法运算符 (Multiplication Operator)


    然后你还有乘法，所以 "ten" 乘以 "twenty"，等于 "一百"，这是精确的答案。你看 JavaScript 是多么逻辑且灵活


    ![](img/image00296.jpeg)


    ### 取模运算符 (Modulo Operator)


    另一个运算符叫做取模，对于很多没有做过编程的人来说，取模通常被称为余数运算符。在某些其他语言中，它也被称为 modulus。取模使用百分号，除法使用斜杠，乘法使用星号，而取模使用百分号


    输入一个简单的取模例子，如 "ten" 取模 "three"。它将取“three”并除以“ten”，看可以进去几次整数，那是“三次”，然后它将取余数。所以，余数，“三”进入“十”，三次是“九”，余数是“一”，这就是你的最终输出。


    ![](img/image00297.jpeg)


    为了更好地理解，让我们尝试另一个取模运算符的例子。“fifty”取模“five”，在这种情况下，“五”进入“五十”十次没有余数，所以你会得到“零”


    ![](img/image00298.jpeg)


    ## 运算顺序 (Order of Operation)


    另一个重要的概念是，JavaScript 遵循所有普通数学遵循的运算顺序。类似于 "ten" 减 "eight" 乘以 "twenty" 的将遵循运算顺序，括号表示
    "ten" 减 "eight" 需要先执行，然后乘以 "twenty "


    ![](img/image00299.jpeg)


    #### 2. 字符串 (Strings)


    ![](img/image00300.jpeg)


