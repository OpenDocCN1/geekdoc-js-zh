    你首先应该注意到的是，数组使用的是大括号 `{}` 而不是方括号 `[]`。下一个重要点是，此对象中的每一项都是键值对，所以你有一个名为 "name" 的属性，值为
    "Cindy"，另一个名为 "age" 的属性，值为 "32"，最后是名为 "city" 的属性，值为 "Missoula"。


    ![](img/image00668.jpeg)


    ### 另一个示例


    你有一个不同类型的人的对象 `var person`，它被赋值为大括号，在里面，你设置 "name" 为 "Travis"，"age" 为 "21"，"city"
    为 "LA"。


    ![](img/image00669.jpeg)


    下面，你有一个关于这种数据结构看起来 de 简单的图，与数组不同，对象没有顺序。你在这个对象中有三个不同的槽，非常重要的是，对象没有任何内置顺序，不像数组有第一个、第二个和第三个项。把对象项想象成只是漂浮在内部的，如果没有顺序的话，哪个属性先后后并不重要，无论你如何声明它们，或者以什么顺序声明，它们都被视为等同的。


    这张图按顺序显示了它们，但这仅仅是为了选出一个顺序，“Travis" 存储在键 "name" 下，“21" 存储在键 "age" 下，然后 "LA" 存储在键
    "city" 下。


    ![](img/image00670.jpeg)


    从对象中检索数据有两种选择。你可以使用对象的名称 `person` 加上方括号以及键的名称，在这种情况下，当你写 `person["name"]`（带引号）时，你正在从
    `person` 对象中获取 "Travis"，这与数组非常相似，唯一的区别是这里不是数字，而是一个字符串。


    另一个选项是使用点符号（dot notation）。点符号稍微短且更简单，你写 `person.name`，且名称必须与键的名称匹配，这也会带给你 "Travis"。


    ![](img/image00671.jpeg)


    继续在你的 `console.log()` 中演示一下吧，让我们创建一个名为 "pet" 的新对象，你的 "pet" 将有一个属性 name，一如一样是 "Smith"，它是最好的宠物，并且有一个
    "breed"，它是一只 "mutt"杂血犬），最后是 "age"，它是 "5"。


    ![](img/image00672.jpeg)


    这让你得到了你的对象 `pet`，如你在下面的插图所示，在左侧点击小箭头展开下方的输出，你将看到原型（prototype）是“object”。


    ![](img/image00673.jpeg)


    因此，如果你想从 `pet` 对象中访问它的年龄，你可以使用第一种语法 `pet["age"]`，然后在引号中写 `age`，得到 3。


    ![](img/image00674.jpeg)


    或者 `pet.age`，你也得到了 3，使用哪一个取决于你。你不需要使用引号；在两边都不需要双括号。你只需要点符号即可。


    ![](img/image00675.jpeg)


    ### 表示法之间的差异


    但与我们最初的插图相比有几处不同。


    ![](img/image00671.jpeg)


    两种表示法之间有几点差异：


    - 如果属性以数字开头，你就不能使用点符号，你可以看到某些 `object.1blah` 是无效的，但如果你有一个名为 `1blah` 的属性，你必须使用方括号并将其放在引号中，这就是
    JavaScript 的设置方式。


    ![](img/image00676.jpeg)


    - 另一部分是，如果你的属性名称有空格，你就不能使用点符号。如果你想在属性名中间有空格，点符号是不起作用的，你必须使用引号。


