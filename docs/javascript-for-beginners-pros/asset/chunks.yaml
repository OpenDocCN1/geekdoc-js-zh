    \n答案被插入在 `\"string\"`、`\"message\"` 和 `\"isfunny\"` 中。你会注意到你有 `\"str\"`、`\"OR\"\
    `、`\"msg\"`，以及 `\"AND\"` 和 `\"isfunny\"`。让我们先解决下面所示的第一个 `\"OR\"`。\n\n![](img/image00735.jpeg)\n\
    \n你有一个 `\"str\"`，它代表字符串，根据你的图题，它是一个空字符串，这是假的。\n\n![](img/image00736.jpeg)\n\n\
    因此，false 或者字符串 `\"msg\"`（该字符串包含一个名为 `\"haha!\"` 的值，它是真的），所以 false 或 true 在左侧的这一小部分给出了\
    \ `\"true\"`。\n\n![](img/image00737.jpeg)\n\n然后你有一个 `\"true\"`，接下来是 `\"AND\"`\
    \ `\"isfunny\"`，它是字符串 `\"false\"`，这有点棘手，但字符串 `false` 始终可以双检为真。\n\n![](img/image00738.jpeg)\n\
    \n这意味着逻辑运算符的两边都是真的，你最后需要做的是对整个结果进行取反操作 `\"!\"`，这将给你一个 false。\n\n![](img/image00739.jpeg)\n\
    \n为了验证这一点，你可以将这个答案复制到你的控制台中，以查看所解释的内容，即取反会使其变成假的，现在看到它是假的。\n\n![](img/image00740.jpeg)\n\
    \n在下一节中，你将看到如何使用刚刚讨论的这些布尔逻辑表达式在 JavaScript 中做出决策：如果某事为假如何运行代码，如果某事为“真”又如何运行其他代码。\n\
    \n### Question 4\n\n如果年龄为负数，打印错误信息。\n\n如果年龄为 21，打印 \"happy 21st birthday!\"。如果年龄是奇数，打印\
    \ \"your age is odd!\"。\n\n超级加分：如果年龄是完全数，打印 \"perfect square!\"。\n\n你的练习是使用给定的那个会场安检员的代码，并添加一些奇特的条件。如果年龄不是负数，它必须打印错误信息。\n\
    \n如果年龄恰好是 21，它应该打印 \"happy 21st birthday\" 并给他们一杯免费的酒。如果年龄是奇数，你应该打印 \"your age\
    \ is odd\"。所以，你在那里进行一些数学计算来判断它是否为奇数。\n\n最后一个是加分项，判断年龄是否为完全平方。如果你不记得什么是完全平方了，它是一个平方根（两个因子）是相同的数字。例如，4\
    \ * 4 = 16，所以 16 是完全平方；4 是完全平方，因为 2 * 2 也是 4。好了，这是一个超级加分项，尽情玩吧，你只有在尝试之后才允许查看练习答案包，这是你熟悉\
    \ JavaScript 的方法。\n\n### Solution\n\n为了完全理解下面的解决方案，将其复制并粘贴到你的 `console.log` 中，但你仍然可以通过创建\
    \ HTML 和 JavaScript 使用独立的页面。注意，前面讨论过的正斜杠只是注释符号，它不会运行，也与你的代码没有任何关系。\n\n```javascript\n\
    // 获取年龄并转换为数字（prompt 总是返回字符串）\nvar age = Number(prompt(\"What is your age?\"));\n\
    \n// 如果年龄为负数\nif(age < 0) {\n  console.log(\"Come back once you're out of the\
    \ womb\");\n}\n\n// 如果年龄为 21 \nif(age === 21) {\n  console.log(\"Happy 21st Birthday!\"\
    );\n}\n\n// 如果年龄是奇数\n//（不能被 2 整除）\nif(age % 2 !== 0) {\n  console.log(\"Your age\
    \ is odd!\");\n}\n\n// 如果年龄是完全平方\nif(age % Math.sqrt(age) === 0) {\n  console.log(\"\
    Your age is a perfect square!\");\n}\n```\n\n### Question 5: While loop\n\n这里有三个问题，不需要你写代码，已经给了你代码，你只需要做的就是评估打印出来。下面是第一个。\n\
    \n![](img/image00515.jpeg)\n\n如果需要，花点时间思考一下，但请不要直接把代码复制到控制台，除非你想检查自己想出来的答案。\n\n\
    ### Solution\n\n这个的答案是它打印了从“1 到 9”的奇数，它这样做是因为它从 `\"num\"` 等于 `\"1\"` 开始，当 `\"\
    num 小于或等于 10\"` 时打印该数字，所以你打印出了 1，然后加 `\"2\"`，然后你处理数字 `\"3\"`，它小于 `\"10\"`，打印出\
    \ \"3\"，然后你到 \"5\"，一直持续到 \"9\"。所以 `\"9\"` 加上 `\"2\"`，然后你就到了 \"11\"，它不再小于或等于 \"\
    10\"。\n\n![](img/image00515.jpeg)\n\n为了验证这一点，如果你打开 JavaScript 控制台并粘贴进去，你会得到 1,\
    \ 3, 5, 7, 9，这里有一个混淆，即它看起来打印出了 \"11\"。\n\n![](img/image00741.jpeg)\n\n为了验证，如果你打开\
    \ JavaScript 控制台并粘贴那个，你会得到 1, 3, 5, 7, 9，这里有一个混淆，即它看起来打印出了 \"11\"。\n\n但你会注意到它有点不同，在\
    \ \"11\" 发生的情况是控制台向你显示它没有打印出来。\n\n### Question 6: While loop\n\n![](img/image00516.jpeg)\n\
    \n停一下，花时间猜猜结果。\n\n### Solution\n\n这个将打印 “1” 到 “20”之间所有 4 的倍数。Num 从 “1” 开始，当 num\
    \ 小于或等于 “20”，你在循环内部有一个 `\"if statement\"`，这个 `\"if statement\"` 检查一个数字是否为 4 的倍数。如果一个数字模\
    \ \"4\" 等于 \"0\"，意味着 4 能整除它就打印。\n\n第一次遍历 \"1, 2, 3, 4\"，现在 \"4\" 模为 \"0\"，打印数字\
    \ 4，然后再次遍历 \"5\"，没有发生，“6”没有，“7”没有，“8”模 \"4\" 可除，现在你有另一个 \"0\"，这就是它一直循环直到达到最大值\
    \ \"20\"。\n\n为了验证这一点，打开你的浏览器控制台并放入你的代码，点击回车。\n\n![](img/image00742.jpeg)\n\n你可以看到得到\
    \ 4, 8, 12, 16 和 20，这显示 4 在 20 中整除 5 次，但由于递增，它必须一直增加。\n\n### Question 7: looping\n\
    \n注意：你不需要运行它，花点时间检查图示的代码。\n\n![](img/image00517.jpeg)\n\n### Solution\n\n这是一个无限循环；你会看到数字从\
    \ 100 开始，这段代码会在数字小于 150 时一直运行。所以，100 小于 150，然后你打印一个数字加一，但重要的行是每次减去一个。\n\n它从 100\
