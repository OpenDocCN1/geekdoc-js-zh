- fmt: '

    Strings are text, the important thing is that they are inside of quotes as illustrated
    above, you can also see that you have two examples, you have the word “hello this
    is a string” inside of quotes which is one string even though it is multiple words,
    it is still one string, and the same thing on the next line, it is a number `75`
    but it is inside of quotes. So, it is considered a string to javascript. You can
    have numbers or text or any characters inside a string. They can also be numbers
    characters inside of quotes, and those quotes can be single or double quotes.
    For example, type `"hello, this is my first string!"` and click enter


    ![](Images/image00301.jpeg)


    And just like the value of the number before it just bounces (spits) the value
    back, you can do the same thing with single quotes by typing `hello, here is my
    single quotes`, and click enter, and it bounces (spits) it back to you. Notice
    that it does show it to you in double-quotes instead of in single quotes, that
    is because it treats them the same way


    ![](Images/image00302.jpeg)


    One more thing to note is that if you did something with double quotes like `"hello
    world''`, and ended it with a single quote it will not compute, they need to match


    ![](Images/image00303.jpeg)


    Another thing about the single and the double quotes is that you can have a string
    that uses both. So, you can have a double quotes string with a single quote inside
    of it without an error message. For example, if you want to have a string that
    says `"I can''t stop loving strings"`. Note that it is a single quote within a
    double quote in-between the end of the letter “n” and “t” in “can’t” that is valid
    because you are using a double quote on the outside


    ![](Images/image00304.jpeg)


    If everything is to be a single quote, it won’t still work because it will indicate
    that the string is not complete, one is missing. The illustration below it shows
    that there is an unexpected identifier that is incomplete


    ![](Images/image00305.jpeg)


    ### Concatenation


    One of the things that you can do with strings is to add them together just like
    with numbers or you could write `"one" + "five"`. You can do the same thing, you
    can have a string plus another string, and what happens to them is that JavaScript
    will combine them into one string and that is called concatenation. So, if you
    do this `"hi" + "here I am"`, and click enter. You’ll get one string in return


    ![](Images/image00306.jpeg)


    If you want a space in-between `"hihere"` from your recent result, you would just
    need to either add a space at the end of `"hi"` which is `"i"` or at the beginning
    of the letter "here" which is `"h"`. Now you can see from our result below that
    the output has been properly fixed compared to the first output above. This is
    called concatenation


    ![](Images/image00307.jpeg)


    ### Escaping character


    Sometimes you might want to have a double quote inside of a double-quoted string,
    maybe you have something like `"she said "goodbye!””` like this. And you want
    the double quote at the beginning of goodbye and you don’t want it to be a single
    quote or you want to just use it that way without getting an error message for
    violating string usage. There is a way you can do that and it is called an escape
    character.


    JavaScript escape characters all start with a backslash and it is a way of escaping
    out of the string and writing special characters that might not be valid in the
    string. So, `"she said \"goodbye!\" "` click enter, you will see, it returns your
    input without sending back an error message. The backslash and then followed by
    a double quote is how you tell JavaScript that you want a double quote in the
    string. In most browser versions the backslash might not be visible in the output
    result


    ![](Images/image00308.jpeg)


    If you didn’t do it that way, below is the error message you are going to get
    instantly “invalid or unexpected token”


    ![](Images/image00309.jpeg)


    ### Length property


    Every string that you create has a `length` property and `length` refers to the
    number of characters in that string. If you create a string that is just `"hello"`
    then you include `.length` together with it, this will count the number per word
    in the `"hello"` statement. It will tell you that it is five characters long


    ![](Images/image00310.jpeg)


    And if you do something like `"my preferred number is 12345"`, you will get 28
    as your output result that is twenty-eight characters long. JavaScript will also
    count the spacing together with it


    ![](Images/image00311.jpeg)


    You can retrieve the entire length of a string using the `length` property, and
    you can also retrieve individual characters like the first character or the fifth
    character using the square bracket notation. E.g., write `"hello"` followed by
    a square bracket with a specific number of words you want to call forth by adding
    it inside the square bracket, and that number will correspond to the position
    in the string of the character that you want and JavaScript will start counting
    at “zero”. To get the first character, make a string `"hello world"` followed
    by the square bracket and if you want the first character use `"zero"` because
    JavaScript starts keeping track at "zero" which is the first character from the
    illustration. Below, the result is the letter “h” which is the first letter since
    JavaScript started counting at zero which is also applicable to other programming
    languages


    ![](Images/image00312.jpeg)


    If you want to get the letter `"w"` you would need to do personal counting from
    "zero", as you can see, the letter “w” is the number “six”. Make sure you count
    the line spacing with it else you might get a different result


    ![](Images/image00313.jpeg)


    And if you also want to get the last character you would still have to count from
    "zero" which is “ten” if properly counted


    ![](Images/image00314.jpeg)


    You could use the `length` property to know that the `"hello world"` length is
    `"eleven"` and that is because the `length` property starts counting down from
    one. It is just the number of characters but the positions are on track starting
    from “zero” the last character "d" is always the index is always "one" less than
    the total length


    ![](Images/image00315.jpeg)


    ### 3. Booleans


    ![](Images/image00316.jpeg)


    The next data type is the Booleans and Booleans only have two options, they are
    either true or false indirectly yes or no. There are no quotes, there are no numbers
    it is just the word true or the word false and that is it. In our subsequent discussion,
    it will become much clearer.


    #### 4. Null & Undefined


    ![](Images/image00317.jpeg)


    There are two more datatypes null and undefined and these are values, they are
    not a category. There are no multiple types of null or multiple types of undefined
    like there are for numbers of strings. There is only one null and there is also
    only one undefined they are just values that you are going to be discussing as
    time goes.


    ### Variables


    A variable is a container that has a name on it and inside of that container,
    you can store data. Variables are a concept that exists in every programming language
    out there, and the basic concept is always the same. The basic primitive data
    types such as strings, numbers, Booleans, variables are just a place in a container
    or a jar where you can put one of these in and give it a name that you can refer
    to later. And then, of course, the name variable means that the data that you
    store in that container can be modified. So, variables are really important they
    allow you to store data and recall them later.

