    Assuming you decide to start a business of your own, a bakery or a tailor shop
    for instance. You need a professional website to present your company to your
    customers and tell them where you are located. Maybe you will include a few photos
    and some information about your products. All you need are frontend technologies
    to build your website.


    ## What is frontend development?


    Now that you understand the different types of site rendering methods, it is easier
    to understand that front-end development is the art of creating the site, and
    web applications that render on the client-side.


    ## Technologies used for frontend development


    There are many different types of technologies and stacks, most frontend web developers
    use `HTML`, `CSS`, and `JavaScript`, the de facto building blocks of the web,
    and the client-side frameworks such as `Angular`, `React`, `Stencil` and `Vue`.
    Not everything happens on the front end, though, client-side rendered applications
    still rely on services and APIs that run on back-end remote servers or the cloud.


    ## Front-end jobs


    - **Web designer**: It is the designing of the website. The job title of the web
    designer is pretty broad to a web designer or just someone who designed the site
    in a program like `Photoshop` or fireworks and never touch the cord but in other
    instances, a web designer could do all the designs, do `Photoshop` and then be
    responsible for creating all the `HTML` and `CSS` even in `JavaScript` to go hand
    in hand.

    - **User interface (UI) designer**: This is a visual designer and it is generally
    focused on the designs. They are not usually involved in implementing the design,
    they might not know much about `HTML` and `CSS` but have the basics. So, they
    can communicate their ideas more effectively to front-end development.

    - **User experience (UX) designers**: The UX designers work with the frontend,
    they study and research how people use the site and then they make changes through
    a lot of testing.

    - **Front-end developer**: Front-end developers create a site without any backend
    development, the site they would create without a web developer or using the backend
    is mainly known as a static website. A static site is something like a restaurant''s
    site or a hair salon that does not require any information to be stored in a database.
    The page will always stay the same unless it is time for a redesigning of the
    front-end. Developers may be required to have a grip on the static pages by using
    `HTML`, `CSS`, and `JavaScript` to run a modification. This person may or may
    not have the experience with creating the design in a design program.


    A different version of this title is a front-end engineer. People who work with
    a specific front-end language like `JavaScript` are also considered front-end
    developers.


