    You can have a variable called `current logged-in user` if you have a website
    with user login and it would just know the user’s name of the person who was logged
    in, and it could also be modified. And then as soon as someone logs out, it will
    then be set to be empty or false. You can have another variable for a football
    game, and it would switch between `player 1` and `player 2`, and that variable
    is in charge of knowing or keeping track of which player is supposed to be going
    at any given point. So, the syntax for variables in JavaScript is very simple,


    ![](Images/image00318.jpeg)


    The `var` keyword space variable name is up to you. Whatever you want the name
    to be called, the label for that container is followed by an equal sign for demarcation
    and then a value and a semicolon. You will also discuss when you will be needing
    a semicolon but for now everything, you do, you can get away with a semicolon
    or not having a semicolon, it will be discussed, but for now, put a semicolon
    at the end.


    ![](Images/image00319.jpeg)


