    # 第五章


    # JavaScript 函数 (JAVASCRIPT FUNCTION)


    ## 函数简介 (Introduction to function)


    函数用于将部分代码封装成一个可重用的包。它们是 JavaScript 的构建模块之一。函数是代码行的变量，如果说普通变量存储的是像 "hello" 或 27
    这样的值，那么函数就可以存储 20 行代码，你可以调用该函数并让这 20 行代码再次运行。


    在函数中，你必须首先声明它们。定义一个代码块并给它一个名称，这构成了函数，然后你之后需要运行它。


    ![](img/image00528.jpeg)


    函数是一个两个步骤：第一步是“声明函数”，然后是调用它”，如上面的插图所示。这是声明函数的语法，`function` 是一个关键字，就像 `var`、`for`、`while`
    一样，所以上面插图中的任何内容都必须用 `function` 名称来声明。如上所示，插图中的函数名为“dosomething”，后面跟着括号和花括号。你可以在花括号内放置任意行的代码，并稍后通过在末尾加上括号引用其名称来调用该函数。


    在你的控制台中定义一个函数，输入 `function "sayhy"`，它所做的只是 `console.log "hello"`，同时在下一行也包含多行 `console.log`，比如
    `console.log "goodbye"`。当你按下回车键时，JavaScript 会显示你的函数声明，但它不会运行 `console.log`，你只是注册了一个名为
    "sayhy" 的函数，但它并没有执行代码。


    ![](img/image00529.jpeg)


    如果你想调用已经声明的函数，请引用它的名称 "sayhy" 并包含括号，然后按下键盘上的回车键。


    ![](img/image00530.jpeg)


    它就会运行“sayhy”内部的任何内容。你已经可以看到为什么这很有用了，尽管这是一个非常平凡的例子，你仍然在写两行 "console.log hello world"
    和 "console.log goodbye"，而为了这一点，你需要编写被调用的函数，它会调出你在声明时存储在函数中的整个代码，而那只是很短的一代码。


    当你打开控制台时，如果你输入不带括号的单词 "sayhy" 并按回车，你将获得所有的代码，包括声明。这是一个非常重要的区别。


    ![](img/image00531.jpeg)


    如果你输入单词 "sayhy"，它只会给你 "sayhy" 的当前值，但它不会运行代码。


    你需要那些括号来获取你声明的函数的值，然后它就会运行该函数。引用函数和执行函数之间一定存在区别。


    ## 使用 DRY 代码 (Using a dry code)


    下面的示例位于函数下方，这些函数可以帮助你精简代码（dry，减少重复）


    ![](img/image00532.jpeg)


    ![](img/image00533.jpeg)


    记住 DRY（Don''t Repeat Yourself，不要重复自己）。所以，如果你想打印“Twinkle little star”，你需要这些 `console.log`
    语句。


    ![](img/image00534.jpeg)


    ## 使用函数 (Using a function)


    为了使用函数，你可以写 `console.log` 一次，“singsong”并包含括号，然后它就会运行函数


    ![](img/image00535.jpeg)


    ![](img/image00536.jpeg)


    现在在 `console.log` 中这样做。不要忘记，在 JavaScript 中你不需要定义它，只需执行它。


    回到你的“singsong”，编写 `function` 关键字以及名称，再次使用 `singsong()`像变量名一样使用驼峰命名法。添加你的花括号，然后放入其中的任何内容将成为函数的一部分，所以在控制台中输入
    `singsong()` 并按回车，一旦输入了


    ![](img/image00537.jpeg)


    你现在已经告诉 JavaScript 一个名为 "singsong" 的函数，如果你不加括号，它只会告诉你代码，但如果你想运行这段歌曲，你必须写带括号的“singsong”，如果你想让它运行四次，这很简单，只需输入四次即可，而不是要写
    20 行 `console.log`。


    ## 参数 (Argument)


    参数用于编写接收输入的函数。函数还没有接收任何输入，但下面是一个名为 "square" 的函数的示例，它的作用是接收一个数字（任何数字），然后 `console.log`
    它的平方


    ![](img/image00539.jpeg)


    然后表示函数期望传入内容的语法是，即它期望一个参数，看起来像这样，而不是在 `square()` 中只有空的括号，当你放入参数名称时。在这种情况下，将其命名为
    `num`，它可以称为任何名称。它只是一个占位符，你可以在函数内部使用 `num`，在这种情况下，`console.log num times num`。它只需获取括号内传入任何数字并对其平方。


