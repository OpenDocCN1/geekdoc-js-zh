    ### 打印 10 到 20 之间所有的偶数


    因此，下一个挑战是打印 10 到 20 之间所有的偶数。所以你只需要复制我们的第一个解决方案代码并对其稍作修改。因此，我们的 `console.log` 应该带有打印
    10 到 20 之间所有的偶数。


    ![](img/image00750.jpeg)


    从 `counter` 等于 10 开始，当 `counter` 小于等于 20 时，你将通过声明内部的 `console.log` 来打印它，但仅当它是偶数时。你可以通过打印它但按“2”计数而不是普通的
    `counter++` 来实现，这将是 `counter+=2`，这意味着你从 10 开始，一旦打印了 10，会自动加 2，然后你就到了 12，这样它就会打印出
    12 然后再加 2（这是由于我们的增量方法实现的）。


    ![](img/image00751.jpeg)


    只需确保它正常工作，刷新，打开控制台，你可以看到“printing all even between 10 and 20”并且它运行良好。


    ![](img/image00752.jpeg)


    你也可以复制第一个代码并让它修改，你遍历每一个数字。所以，你不是按“2”计数，而是在修改的这第二个部分使用一个 `if` 语句来检查数字是否为偶数。它看起来像
    `if counter modulo "2" triple equal "0"`，这就是你判断数字是否为偶数的方法，如果它能被“2”整除，你就会打印它并加“1”。


    ![](img/image00753.jpeg)


    这种方法更短且效率更高，因为第一个循环的运行次数只有这个第一个代码的一半。毕竟，你是按“2”计数的，所以你不会为奇数运行第一个循环，而是运行第二个循环。如果你从“10”开始，如果
    `counter` 模 “2” 等于 “0”，它就是 `console.log counter`，即“10”，然后你加“1”。你现在将将其注释掉，并采用第一个代码，它是一个如之前所示打印
    10 到 20 之间偶数的简短版本。


    另一种编写它的方法是遍历每一个数字。不要按“2”计数，然后你将有一个 `if` 语句来检查数字是否为偶数，它看起来像 `if counter modulo
    "2" triple equal "0"`。


    这就是你判断一个数字是否为偶数或是否被“2”整除的方法，然后你遍历并加“1”。


    ![](img/image00754.jpeg)


    在这种情况下，第一种条件更短且效率更高，因为循环的运行次数是另一个的一半。毕竟，你是按“2”计数的。你还没有为奇数运行循环，相比你刚刚构建的那个。如果你从“10”开始，如果
    `counter` 模 “2”等于 “0”，它是 `console.log "10"`，你加“1”，现在你为“11”加。


    这段代码被评估为“11”不能被“2”整除，事实如此，所以你的 `console.log` 不会被打印，但循环中的代码仍然都会运行。所以这个带有 `if` 语句的
    `while` 循环有一个优势，即无论你从哪个数字开始，它总是会打印偶数，而与上面的 `for` 循环相比，如果你从 11 开始，它将始终在该基础数字上加，让你得到
    10, 12, 14, 16, 18, 20，这些都是偶数，但带有 `if` 语句的 `while` 循环是在检查它们是否为偶数。因此注释掉 `while`
    循环的 `if` 语句条件，因为第一个版本如上面所示打印 10 到 20 之间的偶数。


    ### 打印 300 到 333 之间所有的奇数


