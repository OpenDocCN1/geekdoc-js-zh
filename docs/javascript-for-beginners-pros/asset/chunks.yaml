    #### • 问题 10：for 循环 (For loop)


    ![](img/image00523.jpeg)


    ### 解决方案


    当你有一个初始值为 "1" 而不是 "0" 的 "for 循环"时，只要它小于某个字符串长度，你就会继续运行这个循环，并且每次都加 "2" 而不仅仅是 "1"。第一次循环时，你获取
    `i` 并重新打印字符串中索引为 `i` 的字符，此时 `i` 是 "1"。所以，你会打印出 "h"它是第二个字符但索引为 "1"），然后你给 `i` 加
    "2"，得到 "3"，这仍然小于字符串的长度，所以你会打印出字符串 "3" 对应的字符即 "e"。


    ![](img/image00762.jpeg)


    然后你将不断重复这个加 "2" 操作，这意味着你会打印出字母 "l"，然后是另一个字母 "l"，最后是 "o"。所以结果是你打印了每隔一个字符，而这恰好拼出了
    "hello"。


    #### • 问题 11：for 循环练习题 (For loop problem set)


    在这次练习中，你将完成与之前 "while 循环" 时做过的相同的题目，只不过你要用 "for 循环" 重写它们。让你做这个的目的不是因为你很难想到其他写循环的内容，而是因为能够在这两者之间进行转换非常重要。你将在整个指南中都会使用这两种循环，在很多情况下，你可以使用其中任何一种。因此，我希望你能够转换，所以对于这次练习，题目是相同的，只需使用
    "for 循环"。


    提醒一下具体的题目，你的输出中应该有四个不同的部分，并用 `console.log` 分隔，这四个部分对应四个题目。


    第一个打印负 5 到正 5 之间所有的数字，下一个打印 10 到 20 之间所有的偶数，然后是 300 到 333 之间所有的奇数，最后是 5 到 50 之间同时能被
    5 和 3 整除的所有数字。


    ### 解决方案


    创建一个命名为 `forloop.html` 的 HTML 文件，在其中输入 HTML 结构，并包含一个名为 `forloop.js` 的外部 JavaScript
    文件。


    ![](img/image00763.jpeg)


    现在创建一个名为 `forloop.js` 的 JavaScript 文件，与你的 HTML 文件名相同，区别在于扩展名。在 JavaScript 文件中输入
    `alert` 并加上括号，在里面包含“For Loop is Connected!”这主要是为了让你知道你的 JavaScript 已经连接。


    ![](img/image00764.jpeg)


    确保你的 `forloop.html` 文件和 `forloop.js` 文件都存在同一个文件夹或目录中。


    ![](img/image00765.jpeg)


    在浏览器中打开你的 `forloop.html` 页面，你应该会得到一个弹窗告诉我们“for loop is connected!”


    ![](img/image00766.jpeg)


    #### 打印 -5 到 5 之间所有的数字


    现在你的 HTML 和 JavaScript 已经连接，删除 alert 代码并开始你的主练习。第一个问题是打印负 5 到正 5 之间所有的数字。像通常一样，利用你的
    `console.log` 来说明你练习的区别，在 `console.log` 中输入“printing all numbers between -5 and
    5”。


    ![](img/image00767.jpeg)


    使用 for 循环，直接让 `var i` 等于 "-5"，只要 `i` 小于或等于 "5"，它就会持续运行，然后在每次循环中你给它加 "1"，执行 `console.log
    "i"` 即可。这种方法很简洁，你不需要创建一个单独的变量，也不需要单独的一行来递增变量，可以一次性完成。保存你的代码。


    ![](img/image00768.jpeg)


    回到浏览器并刷新，然后打开控制台，你可以看到从负 5 一直到正 5。


    ![](img/image00769.jpeg)


    #### 打印 10 到 20 之间所有的偶数


    列表下一个是“打印 10 到 20 之间所有的偶数”。


    ![](img/image00770.jpeg)


    有几种方法可以实现，你可以从输入 `for var i` 等于 10 开始，当 `i` 小于或等于 "20" 时，每次循环你可以加 "2"，即 `i +=
    "2"`，然后 `console.log "i"`。保存它。


    ![](img/image00771.jpeg)


    回到浏览器刷新页面，然后打开你的 `console.log`，如你所见，你有从 10 到 20 的所有偶数。


    ![](img/image00772.jpeg)


    再次，这个解决方案的问题在于，如果你想打印“11”到“20”之间的偶数，就会出现问题，这是因为无论起始值是多少，你只是在加 "2"，这意味着如果你把数字改为
    "13"，一切都会变成奇数。


    ![](img/image00773.jpeg)


    如你所见，你得到了从“13”到“20”范围内的所有数字作为奇数。


    ![](img/image00774.jpeg)


    如果你想重构它以匹配检查数字是否为偶数的逻辑，它需要看起来如下所示，每次加 "1"。然后你有一个“if 语句”并判断数字是否为偶数，如果 `i % 2 ==
    0`，那么你就执行 `console.log "i"`。


    ![](img/image00775.jpeg)


    但这是万无一失的方法，即使你把数字改为 "13" 关系。


    你 Images/image00776.jpeg)


    并且你 "00 你你..


    ImagesImages/image0077..jpeg)


    #### 打印 330 到 333 之间所有的数字


    下一个是打印 300 到 333 之间所有的奇数。


    ![](img/image00779.jpeg)


    所以，你想再写一个 for 循环，创建变量 `i` 等于 "300"，且 `i` 小于或等于 "333"，然后只需加上 `i++`，这会在每次条件检查时增加我们的值。然后你要做的不是检查数字是否为偶数，而是检查它是否为奇数，只需输入
    `i % 2 != 0` 意味着它不是。然后包含 `console.log "i"` 并保存。


    ![](img/image00780.jpeg)


    因此，让我们回到浏览器页面刷新，然后打开控制台，你会发现代码已生效，你得到了 300 到 333 之间所有的奇数。


    ![](img/image00781.jpeg)


    #### 打印 5 到 50 之间能被 5 和 3 整除的所有数字


    最后一个是打印 5 到 50 之间能被 5 和 3 整除的所有数字。


    ![](img/image00782.jpeg)


    另一个 for 循环，你让 `i` 等于 "5"，然后只要 `i` 小于或等于 "50"，它就会持续运行，并在每个循环结束时加 "1"。然后你要做的是设置一个
    if 语句进行检查。如果 `i` 能被 "5" 整除，并且你检查它是否也能被 "3" 整除，这样你就执行 `console.log "i"`。


    ![](img/image00783.jpeg)


    回到浏览器页面刷新，打开控制台，你会发现代码已生效，你得到了 5 到 50 之间所有能被 5 和 3 整除的数字，即 15、30 和 45。


