    ## Logical Operator


    In this section, you see how you can change simple boolean statements like the
    one you just saw into more complicated statements. You have multiple components,
    and they are still all going to be evaluated as true or false at the end of the
    day but there might be multiple pieces that individually evaluate to be true or
    false before the entire thing becomes true or false. There are three logical operators
    and as said earlier, this is a way to chain together boolean logic, so those three
    are called `AND`, `NOT`, and `OR`.


    ### AND, OR, and NOT


    Assuming `x = 5` and `y = 9`


    | Operator | Name | Example | Result |

    | :--- | :--- | :--- | :--- |

    | `&&` | AND | | False |

    | `!` | NOT | | True |

    | `||` | OR | | True |


    #### • AND


    The way that works, first of all, you write it with two ampersands sign `"&&"`,
    you can see from the above illustration it is being used in an example where `x`
    is equal to `5` and `y` is equal to `9`. `"AND"` takes two sides, there is a left
    side and a right side, and the ampersands symbol goes in the middle. You would
    read this as `"x less than 10 and x not equal to 5"` you will evaluate both sides
    `"x is less than 10"` which is `"true"` and next is `"x is not equal to 5"` which
    is false. You’ll end up with a `"true"` and a `"false"` statement. And the way
    that works is that it requires both sides to be true not only one side but all
    sides which are not true in this case only the left side is “true” which renders
    the declaration “false”.


    #### • NOT


    `"NOT"` works a little differently, it doesn''t take a left or right side, it
    just negates or flips the value of whatever you apply it to. If something was
    `"true"` and you put a not sign `"!"` in front of it, it then because “false”,
    then it becomes “true”`. In this case, the expression `"x triple equals y"` which
    is `"false"` five is not equal to nine, the inside is false but there is a bang
    or a not sign `"!"` in front of it which negates the whole thing and turns it
    to be `"true"`.


    #### • OR


    `“OR"` takes both sides but it only requires that one of them be `"true"` left
    or right be `"true"` for the whole thing to be `"true"`.


    Note: the character used for the OR is called pipe character which is located
    above most enter keys on your keyboard or return key and you usually need to click
    shift to make it work. This is a way of using complex statements `"OR"` with `"AND"`
    methods in JavaScript. The left side `"y is greater than 9"` is not true because
    `y` has `9` `"OR"` `x` is triple equal to `5` which is true because `"x and y
    are both 5”`. You’ll end up with `"false or true"` which evaluates to be `"true"`
    overall because `"OR"` only requires one side to be `"true"`.


