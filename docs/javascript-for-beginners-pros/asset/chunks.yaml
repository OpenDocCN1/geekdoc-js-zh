    继续编写你的函数来演示如何使用参数，让我们写一个名为 `sayHi()` 的函数。刚开始，它不接收任何参数。在函数内部输入 `console.log "hello
    there!"`。目前你的函数只需执行这些操作，然后按回车。


    ![](img/image00541.jpeg)


    现在你可以运行 `sayHi()` 了。


    ![](img/image00542.jpeg)


    接下来，定义一个名为 `sayHi()` 的函数，它接收一个名字。为了做到，你需要重新定义 `sayHi()`，这次它不再是空括号，你需要在方括号中放入一些内容，你可以将其命名为
    `name`、`person` 或 `user`。编写 `console.log "Hello there!"`，然后添加 `name` 并在最后添加一个感叹号，最后关闭括号。


    ![](img/image00543.jpeg)


    `name` 只是你放入其中值的值的占位符。在中间加上 `name` 输入 `console.log "hello there"`，然后加一个感叹号。例如，`sayHi("Robert")`，你会得到
    "hello there Robert!"。


    ![](img/image00544.jpeg)


    同样，你可以说 "hello smith" 或说 "hello mick"，你会看到变化。你的函数会适应你传递的任何值。


    ![](img/image00545.jpeg)


    参数的使用让你的函数变得强大。例如，在像 Facebook 这样的网站上，可能会有一个名为“制作主页”的函数，这个“制作主页”将接收有关登录用户的信息。这就像是创建一个小机器，它可以接收一个参数然后输出其他东西。此外，你不局限于一个参数，函数可以接受多个参数。


    ![](img/image00546.jpeg)


    ## 面积演示


    从上面的插图可以看出，`area` 函数计算矩形的面积，它接收长度和宽度，并把它们相乘 `console.log length times width`。要调用此函数，传入两个用逗号隔开的数字，第一个值对应长度，第二个对应宽度，这归结为排列的顺序。如果你调换位置并将
    3 放在第一个，它会自动变成长度，而 5 将变成宽度。


    ![](img/image00547.jpeg)


    ## 问候演示


    下一个例子是问候参数函数。假设你有三个参数 `person1`、`person2`、`person3`，并且用分开 `console.log` 向他们三个人说“hi”。


    ![](img/image00548.jpeg)


    调用它们的顺序决定了谁是 person 一、person 二和 person 三，你可以你可以看到这些值是占位符。你会得到“Hi Robert”、“Hi John”和“Hi
    Smith”。有趣的是，你可以写一个期望像 `greeting` 这样的参数的函数，但如果你在调用它时漏掉了参数，漏掉的那个将会被赋予一个名为 `undefined`
    的标题，这意味着它未被指定。


    ![](img/image00549.jpeg)


    在这种情况下，“Smith”没有被包含，导致遗漏的代码变为 `undefined`，这意味着它不会破坏代码，你也不会收到错误消息。但发生的是 `person3`
    仅留为“undefined”，在某些编程语言中，这会停止一切并留下错误信息，导致你的代码变得无效。但在 JavaScript 中，这完全没问题，它意味着你可能需要注意并检查某些内容是否为
    `undefined`。


    参数是让函数变得实用的重要部分之一，因为这不仅是为了缩短代码和每次重复相同的代码块（如“twinkle twinkle little star”）。它还为了让代码根据某些输入发生细微变化。


    上面的插图仅是关于如何在实际应用中使用参数的几个例子。假设你有一个自己的游戏，在那个游戏中，每个玩家都有一个分数，玩家可以做一些增加该分数或减少该分数的操作。


    那么，如果玩家做了一些疯狂的事，你可能会有一个名为 `addToScore` 的函数，如果你想给他们很多分，你会加上 100 分。如果用户死掉了，你可以减去
    100 分，如果你只想奖励几分，你可能会做像 `addToScore(5)` 这样的操作。


    ```

    addToScore(100)

    subtractScore(100)

    addToScore(5)

    ```

