    # Primitives Datatypes & Mathematical Operators


    You are going to start with the basic built-in primitive data types. One of the
    big ideas at the core of every programming language is the ability to differentiate
    between different categories of data. For instance, a language could differentiate
    between a number and a word or it could differentiate between a whole number and
    a fractional number or a positive number and a negative number. All these vary
    from language to language.


    ## The Five basic primitive data types in JavaScript


    There are five low-level basic types of data, they are: numbers, strings, booleans,
    null & undefined


    ### 1. Numbers


    ![](Images/image00288.jpeg)


    There are three examples here a whole number for a fractional, a decimal number
    7.2, and a negative number minus 20. I chose these three because You want to show
    you that JavaScript doesn''t care if a number is whole, fractional or even negative.
    They are all treated as numbers, it is a broad category. Other languages do differentiate
    but javascript doesn''t, don''t forget that numbers are just a category for whole
    numbers, fractional numbers, and negative numbers. To understand how numbers work
    you are going to be using mathematical operators to explain them for better understanding


    ### Mathematical Operators


    For better and quick assimilation, you will be using chrome console for quick
    results to validate what is being explained, go to your `console.log` in your
    chrome browser, you can press `Ctrl + Shift + I` which is for inspecting. This
    you easy access to your `console.log` interface. By default, it will display element,
    click on `console.log` then you can start coding


    From your “console” whenever a number like value 9 is passed and you click enter,
    it automatically bounces back. The same goes also for float number (decimal point)
    and a negative number, this is so there is no take holding those values. It is
    just basic stuff; you are not making any exciting applications yet.


    ![](Images/image00289.jpeg)


    ### Addition Operator


    The first thing that you can do with these numbers are simple mathematical operations,
    these are things that you are already familiar with like basic math that has nothing
    to do with the computer system. Things like addition, multiplication, subtraction,
    and division. Just write simple expression’s so for numbers like "four" plus "fifty",
    you may notice I used two spaces on either side of the plus sign, it is not mandatory
    just to achieve neat coding. If you click enter, you will get fifty-four automatically.


    ![](Images/image00290.jpeg)


    You can also do something like “four” plus “fifty” with no spacing and it will
    still work correctly.


    ![](Images/image00291.jpeg)


    Those are simple operators. You can also chain them together by typing “ten” +
    “thirty-five” + “fifty-five”, and you’ll get “one hundred”


    ![](Images/image00292.jpeg)


    ### Division Operator


    You can also use other operators too like division, for example, “ten” divided
    by “five”, and equals “two”


    ![](Images/image00293.jpeg)


    You can also do things like "one" divided by "three" and as you can see, I got
    "zero" point infinity "three"


    ![](Images/image00294.jpeg)


    ### Subtraction Operator


    You also have subtraction, let’s say "five" minus "twenty", and as you can see
    from the illustration below, the answer is “minus fifteen”


    ![](Images/image00295.jpeg)


    ### Multiplication Operator


    And then you also have multiplication, so "ten" times "twenty", equals "one hundred"
    which is the precise answer. You see how logical and flexible javascript is without
    any stress


    ![](Images/image00296.jpeg)


    ### Modulo Operator


    There is another operator called modulo, and modulo is usually unfamiliar to many
    who have not done any programming before, it is often called the remainder operator.
    In some other languages, it is also called modulus. Modulo uses a percentage sign,
    the division is a slash, multiplication is a star or asterisk sign while modulo
    is a percentage sign


    Type a simple modulus example like "ten" modulus "three". It will take “three”
    and divide it by “ten” as many times as it goes in as a whole number, and that
    would be "three times" and then it will take the remainder. So, the remainder,
    "three" goes into "ten", "three" times which is "nine" and the remainder is "one"
    which is your final output.


    ![](Images/image00297.jpeg)


    Let’s try another example with a modulus operator for better comprehension. Take
    "fifty" modulo "five", and in this case “five” goes into "fifty" ten times without
    a remainder, so you’ll get "zero"


    ![](Images/image00298.jpeg)


    ## Order of Operation


    Another important concept to note is that javascript follows the order of operations
    that all regular math follows as well. Something like "ten" minus "eight" times
    "twenty" is going to follow the order of operations where the parentheses which
    denote that "ten" minus "eight" needs to be done first, and then multiply by "twenty
    "


    ![](Images/image00299.jpeg)


    #### 2. Strings


