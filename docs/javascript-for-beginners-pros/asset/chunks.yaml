    \ URL 链接并按回车。网站立即加载，具有极其整洁的布局、结构良好的页面和令人印象深刻的视觉效果。\n\n前端和后端是计算机行业中最常用的两个术语，在某种程度上，它们已经变成了流行词。它们决定了你作为软件开发者所的工作类型、你使用的技术以及你的薪水。\n\
    \n### 这两个术语之间的区别\n\n它们存在的原因以及在开始前端和后端开发之前，你在软件开发职业中可以采取的不同路径。你只需要理解什么是网站渲染就可以开始这段旅程\n\
    \n# 理解网站渲染概念\n\n通俗来说，网站渲染意味着生成或渲染 `HTML` 输出。`HTML` 是 Web 开发者用于创建网页的标记语言。据说网站渲染可以发生在服务器端，也可以发生在客户端。需要注意的是，前端和客户端是同义词。后端和服务器端也是。\n\
    \n### 服务端渲染（后端）\n\n首先，你将谈论服务端渲染，即后端开发。随着时间的推移，服务端渲染或后端 Web 开发一直是创建网站和 Web 应用的默认方式。当你访问一个页面时，发送内容请求，服务器处理该请求并创建一个发送回浏览器的响应。\n\
    \n当网站进行服务端渲染时，创建你的网络浏览器可以理解的 `HTML` 页面的所有过程都是在托管网站或 Web 应用的远程服务器上处理的。这包括查询数据库信息以及处理你的\
    \ Web 应用所需的任何逻辑。当远程服务器忙于工作时，你的网络浏览器处于空闲状态，等待服务器完成请求处理并发送响应。当接收响应时，网络浏览器解释它并在屏幕上显示内容。\n\
    \n### 客户端渲染（前端）\n\n在更现代时期，出现了一种新的网站渲染形式，称为客户端渲染或前端开发。在客户端渲染中，网站内容的渲染发生在你的计算机上，而不是在远程\
    \ Web 服务器使用 Web 的默认语言 `JavaScript` 完成。\n\n在实际操作中，这意味着服务器只需要提供原始 Web 应用，而浏览器将负责将应用程序渲染成最终形式，这种形式主要在\
    \ `HTML` 语言端。这意味着创建网页涉及的一些逻辑，特别是负责处理如何在屏幕上向用户展示内容的逻辑（称为展示逻辑），是在客户端处理的。客户端渲染随着\
    \ `Angular`、`React` 和 `Vue` 等 `JavaScript` 库的出现而变得流行。\n\n"
