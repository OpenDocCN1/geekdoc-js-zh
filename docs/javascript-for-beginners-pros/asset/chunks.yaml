    ### Question 2


    ![](Images/image00728.jpeg)


    So, one more exercise this time is a little bit longer but it is the same basic
    components. So, resist the temptation just to type it into your `console.log`
    and make sure your plugin "5" for `x` and "15" for `y` and see if you can figure
    out if the whole expression is true or false.


    ### Solution


    Let’s start by identifying the overall pattern from the above illustration


    ![](Images/image00729.jpeg)


    You have a left side and right side with an "AND" in the middle. You need both
    of them to be true, let’s start with the left side. You have `x` is 5, and `y`
    is 15. This first line `x` which is 5 double equals to string "5" that is true
    because double equals "OR" and this is a small point here but technically if the
    left side of an "OR" statement is already true means the entire statement is "true"


    Note that javascript doesn''t even care what is over here on the illustration,
    it is called short-circuiting because you only need one out of two to be true
    from our left-hand side if you already get that on the left then you are done


    ![](Images/image00730.jpeg)


    But just to evaluate this for more practice `x` triple equals `y` is false because
    5 is not the same as 15 so the whole thing evaluates to be true according to our
    "OR" method which one must be true


    ![](Images/image00731.jpeg)


    However, there is also a bang `!` at the beginning of your code that negates the
    whole thing to be false, and just before before this circuits the entire expression
    because you have an "AND" in-between the left and right declaration which only
    accepts one answer once "AND" detect any false every other declaration will be
    false then it doesn''t matter what is over the right-hand side


