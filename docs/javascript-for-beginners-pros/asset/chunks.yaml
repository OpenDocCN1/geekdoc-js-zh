    # 使用控制台编码


    在我们的控制台中开始编写 JavaScript 代码之前，有几点关于控制台我想让你注意的。现在，让我们直接从 `console.log` 开始编码。对于这个控制台以及每种编程语言，第一个程序通常是显示我们通用的“Hello
    world”。


    在本节中，你将尝试在控制台中本身显示“Hello world”。在 JavaScript 中，每当你需要执行与控制台相关的操作时，都需要输入 `console`，因为你想在控制台上显示或记录特定消息，你会说
    `console.log` 然后包含一个括号，你可以在其中传递你的消息。例如，假设你想说 hello world，只需如如下所示传递在括号之间即可


    ![](img/image00283.jpeg)


    一旦你按下键盘上的回车键（通常位于你右侧的“enter key”），你将自动获得输出结果，如下所示，这意味着当你点击回车键时，控制台会立即执行你写的每一行代码。


    ![](img/image00284.jpeg)


    现在你可以在控制台中显示任何内容了。万一你想显示自己的名字，只需输入 `console.log` 并输入任何名字。当你执行时，它就会为你执行该代码


    ![](img/image00285.jpeg)


