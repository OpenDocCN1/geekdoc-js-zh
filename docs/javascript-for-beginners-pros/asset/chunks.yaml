    在这种情况下，你调用的是方法而不是属性。再次，方法只是对象内部的一个作为属性的函数。让我们通过再次输入在对象内部再创建一个函数，它接收两个数字 `x` 和
    `y`，它所做的只是返回 `"x"` 加 `"y"`。这里新奇之处在于你正在添加一个函数，无论该函数执行什么，任何函数在对象内部都可以正常工作，而你只是将其设置为该属性的值。


    ![](img/image00694.jpeg)


    让我们看看 `"obj"`，如你所示 `add` 是一个函数。


    ![](img/image00695.jpeg)


    如果你想调用 `add`，你不能再只写 `add` 了，你需要做的是写 `obj.add()`，在括号中传入 `10` 和 `20`，你就会得到 `“30”`，这是因为它已经被隐含地等待一个表达式。因此，在属性中调用你的函数的方法是一样的，你需要括号、参数，唯一的区别在于它不仅仅独立存在，因为它实际上是在
    `obj` 对象属性内部。


    ![](img/image00696.jpeg)


    这看起来可能和你使用过的某些东西有点熟悉，就是 `"console.log"`，相同的格式，事实 `"console"` 是一个对象，而 `"log"` 是该对象上的一个方法。所以它们的工作方式一样。


    ![](img/image00697.jpeg)


    你需要在 `obj` 对象内部添加函数，因为这有助于你保持代码整洁，你可以将事物在逻辑上组合在一起，以说明对象的一个优点：将你的函数作为对象的一个方法。


    ![](img/image00698.jpeg)


    ## 命名空间 (Namespacing)


    以狗作为宠物的示例，更改名称 `dog`，假设你想创建一个名为 `“speak” 的函数。`speak` 将返回 `"woof"`，这是给 `dog` 用的。


    ![](img/image00699.jpeg)


    你可以调用 `speak`。


    ![](img/image00700.jpeg)


    假设你也想让名为 `“speak” 的函数适用于 `"cat"` 并且应该返回 `"meow"`，只需输入 `function speak`，它就会返回 `"meow"`。


    ![](img/image00701.jpeg)


    但你没有办法访问返回 `"woof!"` 的原始 `speak`，发生的是所谓的“命名空间冲突 (namespace collision)”。换句话说，你有两个名字相同的东西。如果你将这些函数作为方法添加到对象中，你可以通过将它们放在不同的命名空间中拥有两个名为
    `speak` 的不同事物。


    这很简单；你可以创建一个名为 `var dog speak` 的东西，它只是一个空对象。


    ![](img/image00702.jpeg)


    对狗执行同样的操作，输入 `dog space dot speak` 作为一个函数，并返回 `"woof"`。


    ![](img/image00703.jpeg)


    你对 `var cat space` 执行同样的操作，`equals` 等于一个空大括号，你向其中添加你的方法。


    ![](img/image00704.jpeg)


    然后你可以说 `cat space dot speak equals function`，你所做的只是返回 `"meow"`。


    ![](img/image00705.jpeg)


    如果你想为狗调用 `speak`，`dog space dot speak()` 返回 `"woof"`。


    ![](img/image00706.jpeg)


    如果你想为猫调用 `speak`，`cat space dot speak()` 返回 `"meow"`。


    ![](img/image00707.jpeg)


    你需要在 `obj` 对象内部添加函数，因为这有助于你保持代码整洁，你可以将事物在逻辑上组合在一起，以说明对象的一个优点：将你的函数作为对象的一个方法。


    ![](img/image00698.jpeg)

