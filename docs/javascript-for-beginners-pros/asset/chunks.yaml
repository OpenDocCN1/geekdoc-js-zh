    # CHAPTER THREE: JAVASCRIPT BASICS CONTROL FLOW


    ## Boolean Logic


    This section will be covering a really important topic which is how to decide
    on your JavaScript code. And the first step is learning about something called
    Boolean logic. Booleans are very simple, it has only two possible options for
    a Boolean value which is "true" or "false".


    Boolean logic is simply writing a statement that evaluates to be true or false,
    and eventually, you will use these statements to run certain parts of your code
    if something is true, and some other parts of your code if something else is false.
    These statements can be like "A user is logged in" which is "true" or "false"
    but it could also be something as simple as if "subtotal" of an item is greater
    than $10,000, this can be evaluated to be "true" or "false" then you do something
    with them in your code.


    ## Operators


    The first thing you have to start with is comparison operators. Comparison operators
    are things that everyone uses all the time in their day-to-day life.


    ### Comparison Operators


    Assuming `x = 5`


    | Operator | Name | Example | Result |

    | :--- | :--- | :--- | :--- |

    | `>` | Greater than | `x > 10` | False |

    | `>=` | Greater than or equal to | `x >= 5` | True |

    | `<` | Less than | `x < -5` | False |

    | `<=` | Less than or equal to | `x <= 100` | True |

    | `==` | Equal to | `x == “5"` | True |

