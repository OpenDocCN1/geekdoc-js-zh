    ## Array Iteration: for each


    Array iteration refers to iterating over a list, iterating over an array. Looping
    through that array and doing something to each item or with each item. For example,
    in a blog, a post or comment has some comments, and those comments are stored
    in an array. To display all of those comments what happens is that some code loops
    through, it iterates over that array with 1,000 comments potentially and for each
    one, it makes Html content and make a little "li" or it makes a "paragraph" whatever
    the comments are that Html is generated in a loop when you iterate over an array.


    You will be doing something very similar with comments as well. Array iteration
    is really important, it is probably the most common thing that you do with arrays.


    There are three objectives in this section, the first one is how you can use a
    `for loop` to iterate over an array. To loop over an array using a `for loop`,
    you need to make use of the array''s `length` property. You have an array of `colours`
    that has four items for strings "red, orange, yellow, and green" if you want to
    print out each one if you didn''t discuss this, you didn''t do an array iteration.


    Copy `var colours = ["red", "orange", "yellow", "green"];` into your console to
    understand how "for each" works.


    ![](Images/image00639.jpeg)


    Next, type `console.log(colours[0])`, and then do the same thing for 1 and 2,
    and then finally for 3 which gives us "green" but that is nowhere near as bad
    as it could be you had ten thousand colours in this array or 10,000 comments on
    or read a post.


    That wouldn''t work for us, not to mention the fact that it is not a dry code.
    You are repeating yourself all the time, so you use a loop to help automate this
    process. You’re performing the same thing; the only difference is the change in
    number. Each time you add one you are starting at the beginning of the array and
    you are going all the way to the end so you can just do that with a `for loop`.


    ![](Images/image00640.jpeg)


    Using `for loop` the `i` variable will start at "0" because that is always the
    first index in the array, and then add one to it each time through the loop and
    keep going while `i` is less than the `length` of the `colours` array. Remember
    the `length` of this array is "4" while `i` is less than "4" which should never
    equal "4".


    ![](Images/image00641.jpeg)


    Because `colours 4` is not defined.


    ![](Images/image00642.jpeg)


    Let’s type it out below, for `var i = 0; i <= colours.length; i++` , and open
    up a bracket, what you will do inside the bracket instead of `console.log`, let’s
    insert `alert(colours[i])`.


    ![](Images/image00643.jpeg)


    Immediately you click your enter button, each colour will pop up, “red” comes
