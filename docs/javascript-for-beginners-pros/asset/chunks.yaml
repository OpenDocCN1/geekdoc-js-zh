    ## What is a Loop?


    A loop is a fundamental programming idea that is commonly used in writing programs
    such as `if`, `else if`, and `else` statement. Loops are the arrangement of instructions
    that is repeated constantly until certain conditions are meant.


    ### Dry code “don’t repeat yourself”


    If you want to print the number from 1 to 10 each one on a different line based
    on what you know so far. You will need 10 different `console.log` and that is
    already not the idea but if you wanted to do every number between 1 and 1,000
    or the first million numbers suddenly, you will have to write the codes yourself.


    ![](Images/image00473.jpeg)


    This is where the loop comes in. Even though you most likely wouldn''t print the
    numbers from 1 to 10,000 in a real production application. For example, on Facebook
    where a single photo or post can have 10,000 different comments on it. Behind
    the scenes, there is some sort of loop that is being used to print out all the
    comments on the page rather than for every comment there need to be a separate
    line of code.


    ![](Images/image00474.jpeg)


    Before you see the syntax for wild loops in JavaScript, I want to introduce this
    concept called dry code. Dry stands for "don''t repeat yourself". It is a concept
    that is thrown around a lot in all sorts of programming languages but it comes
    down to a said rule "you don''t want to repeat our code". If you take a look at
    or the first example which is `console.log(1);` to `console.log(10);`.


    This code is very repetitive, the only difference is the number that you are printing
    out but otherwise, every line is the same. This code is not what you will consider
    dry, some people would call it ret code which stands for "write everything twice"
    that is not common to hear though as dry code. What loops do is allow you to dry
    up your code, they are one of the tools at your disposal some of the others that
    you’ll discuss later are functions in arrays and objects but loops are the most
    fundamental one.


    ### While loop


    ![](Images/image00475.jpeg)


    There are multiple types of loops, the first one is the `while` loop. The `while`
    loop is very similar to an "if statement", except that it repeats a given code
    block instead of just running it once. It takes a condition like `x > 5` and then
    while that condition is true it will repeat code that will put in a set of curly
    braces. So, an "if statement" is very similar except it doesn''t repeat the code
    it just runs at once "while loop" will continue to run the code as long as the
    condition is true.


    ![](Images/image00476.jpeg)


    From the above is an example, this is how you can print the number from 1 to 5
    using a `while` loop. Start with a variable called `count` (this count could be
    named anything) but `count` started at "1" then you have your `while` loop with
    a condition that says count less than "6" (`count < 6`). The very first time this
    code runs, `count` is equal to "1" so "1 is less than 6" this is true which will
    keep running until the count is not more equal to 6 which makes your output stop
    at “5” since “6” is not less than “6” but equal to “6”.


    The above illustration is an example of using a `while` loop to print the numbers
    from 1 to 5 for better understanding start by initiating a variable called `count`
    which you started as "1" then you have your `while` loop and the syntax again
    is `while` and then a condition. In this case, the condition is "count less than
    6". So, the first time that this loop runs count is "1" so one less than "6" is
    true so then the code under it will be executed.


    ![](Images/image00477.jpeg)


    Therefore, that is going to print out count is "1" and then it will add "1" to
    count and then it goes again and it checks count which is now "2" is "2" less
    than "6" that is true and it again add "1" to your count and now it is "3" this
    is true again.

