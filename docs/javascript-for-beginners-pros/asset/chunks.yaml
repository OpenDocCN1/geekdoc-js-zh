    And the last way which you won''t see very often until much later in JavaScript
    is that you can use the "new object()" which is a function just like a new array
    that will make you a new object and return it to you as an empty object and then
    you can add person dot name, person dot age, and person dot city. So you will
    see the first and second syntax much more often subsequently than the last option
    which is a new object()


    ![](Images/image00690.jpeg)


    Another point you will like to make about objects is that just like arrays they
    can hold any sort of data, a data can be numbers, strings or Booleans, an array,
    even another object, as you can see below. Just like arrays you can mix and match
    as much as you would like 


    ![](Images/image00691.jpeg)


    ## Adding Methods to Objects


    This is your last section on JavaScript objects for the next few sections, and
    in this very section you are going to cover JavaScript methods, before you do
    that, have a simple Html file and all you have is a few notes below for you to
    follow


    ![](Images/image00692.jpeg)


    Output


    ![](Images/image00693.jpeg)


    You don''t need to type the codes if you want to follow along. You can just do
    this in the console or make your file but you don''t need this Html above.


    So, what You are going to do is start discussing what methods are. In JavaScript,
    you have seen that you can make an object which we can name "obj" as the variable,
    and you can put whatever type of data you want inside of that object i.e. a name
    that is a string "Dan", an age that is a "number",  “iscool” which is a "Boolean",
    friends which is "false", also have friends which is an "array" and friends can
    just be "Bob and Tina" but all you need to know is that in this section, you can
    add functions as properties to an object.'
