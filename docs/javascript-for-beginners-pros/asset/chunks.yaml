    ## Introduction to an Array


    In this chapter, you are going to be discussing your first main data structure
    which is called the "array". Your core objectives in this section centre on "understanding
    arrays conceptually" and “why you use them with” which in return you are going
    to be using them by "writing codes using JavaScript arrays".


    Let’s start by talking about what the point of an array is. Suppose you want to
    model a group of friends so every friend is a string with their name like "Smith",
    "John", "Robert", and “Mick”, so You can make `friends` variable each one is a
    separate variable and if You want to add another one You will need to save our
    `friend5` by creating an additional variable is equal to another name. And then
    I need to know for the next one I need to do `friend6` and then variable `friend7`
    and so on


    ![](Images/image00574.jpeg)


    This becomes problematic for a few reasons, the code is not what you would consider
    dry, there is a lot of repeated code above, also these friends are not related
    to one another, each is separated. It is not a group of friends, this is a perfect
    case of an array. An array let us group data in our list.


    ![](Images/image00575.jpeg)


    Rather than having 4 separate variables, you can write one variable, and inside
    of it, store 4 different names. So, let’s take a closer look at how the array
    works also note that array arrays are indexed starting at 0. Every slot has a
    corresponding number. For example, `var friends = []` that what tells JavaScript
    this is an array. These square brackets denote an array, you can see an open bracket
    and a close bracket. And inside you have your list of data to declare an array,
    it is separated by a comma list which carries your values such as "Smith", "John",
    "Robert", "Mick", and that results in an array of 4 items.


    ![](Images/image00576.jpeg)


    Another important piece of information about arrays is that they are indexed just
    like characters is to strings. Where there is a specific number that corresponds
    to every character starting at "0", arrays are also indexed starting at "0" every
    slot in this array above has a corresponding number. "Smith" stored with the number
    "0" as an index, "John" with index number "2" with "Robert" with the index number
    "3", and lastly "Mick" with the index number of "3". You use those array indices
    all the time to get data out of the array.


    ![](Images/image00577.jpeg)


    From the above illustration, you are initializing the same array, and if you want
    to get "Smith" out of the array, you need to know the index that corresponds to
    "Smith" which is "0" and then all you need do is to write `friends[0]`, the variable
    name (`friends`) bracket which is "0" just like you would for string if you wanted
    the first character, the only difference is that you are not dealing with a "string
    of characters", you are dealing with an "array of strings".


    And then with the friend being "0", it will give you "Smith" likewise if you did
    `friends[1]` which gives you "John" a greater than “3” is input inside a string
    just to illustrate the range in which you want to print out your list from which
    you are also going to be printing "Robert" but "Mick" will be excluded since you
    are calling number from "0" to less than "3" not equal to "3".


    ## Replace array index


