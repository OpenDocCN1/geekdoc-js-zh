    In that case, you are calling methods rather than properties. Again, a method
    is just a function that is a property inside of an object. Let’s make one more
    function inside an object by also typing and it takes two numbers `x` and `y`,
    and all that it does is return `"x"` plus `"y"`. The new thing here is that you
    are adding a function, it doesn''t matter what the function does, any function
    will work inside an object and you are just setting it as a value for the property.


    ![](Images/image00694.jpeg)


    Let’s look at `"obj"`, as you can see `add` is a function.


    ![](Images/image00695.jpeg)


    If you want to call `add`, you can''t just write `add` any more, what you need
    to do is write `obj.add()` pass in `10` and `20` into the parentheses and you’ll
    get `“30”`, this is because it has been implicated just waiting for an expression.
    So, calling your function in property works the same way, you need a parenthesis,
    arguments, the only difference is not just on its own because it is actually inside
    the `obj` object property.


    ![](Images/image00696.jpeg)


    This might look a little bit familiar from something you have been using which
    is `"console.log"` the same format, and it turns out that the `"console"` was
    an object, and `"log"` is a method on that object. So, they work the same way.


    ![](Images/image00697.jpeg)


    You need to add function inside of the `obj` object because it helps you to keep
    your code organized so you can group things logically together to illustrate one
    of the benefits of an object, your functions as a method on an object.


    ![](Images/image00698.jpeg)


    ## Namespacing


    Using the dog as the example of pets, change the name `dog`, and assume that you
    want to make a function called `“speak”`. `speak` is going to return `"woof"`,
    this is for `dog`.


    ![](Images/image00699.jpeg)


    And you can call `speak`.


    ![](Images/image00700.jpeg)


    Assuming that you also want a function called `“speak”` to work for the `"cat"`
    and it should return `"meow"`, simply type `function speak` and it will return
    `"meow"`.


    ![](Images/image00701.jpeg)


    But you have no way of accessing the original `speak` that returned `"woof!"`,
    what happened is something called a `"namespace collision"`. In other words, you
    have two different things that have the same name. If you add these functions
    as a method to an object, you can have two different things named `speak` by putting
    them in different namespaces.


    It is quite simple; you can make something called `var dog speak` and that is
    just an empty object.


    ![](Images/image00702.jpeg)


    Do the same to the dog by typing `dog space dot speak`, as a function and you
    return `"woof"`.


    ![](Images/image00703.jpeg)


    And you do the same thing for `var cat space equals an empty curly brace that
    you add your methods to.


    ![](Images/image00704.jpeg)


    Then you can say `cat space dot speak equals function` and all you do is to return
    `"meow"`.


    ![](Images/image00705.jpeg)


    If you want to call `speak` for the dog, `dog space dot speak()` returns `"woof"`.


    ![](Images/image00706.jpeg)


    If you want to call `speak` for the cat, `cat space dot speak()` returns `"meow"`.


    ![](Images/image00707.jpeg)


    You need to add function inside of the `obj` object because it helps you to keep
    your code organized so you can group things logically together to illustrate one
    of the benefits of an object, your functions as a method on an object.


    ![](Images/image00698.jpeg)


