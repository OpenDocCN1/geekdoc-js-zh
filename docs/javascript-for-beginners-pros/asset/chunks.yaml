    100 as your output.


    ![](Images/image00552.jpeg)


    It looks like you have an output, what you have is something being printed to
    the console with `console.log` but you don''t have something that is being returned,
    there is a big difference. If you use the `return` keyword it means that you can
    capture the value and that is coming back out of the information. Right now, you
    can''t capture it, so `console.log` just prints it to the console. Only a developer
    would ever see that anyways and you can''t use it in any other part of your code.


    If you want to do something where you have a line that was like "4 squared is
    " and you want to put whatever comes back from `square` 10 which is your initial
    declaration which you want to put together. "10 square is plus square of 10".
    Right now, if you do that, it will tell you 4 square is undefined.


    ![](Images/image00553.jpeg)


    And that is because nothing is being returned or missing the output though it
    prints something it doesn''t last it doesn''t send anything out. So, to do that
    you use the `return` keyword, it is a really simple change you are just going
    to go back, and instead of `console.log`, I am just going to write `return`.


    So, the `return` keyword is going to return one thing per function, you could
    theoretically have multiple return statements but only the first one is going
    to run unless you had some sort of "if statement" where instead of an "if statement"
    you returned one thing and inside of the "else statement" you returned something
    else but still only one of those is ever going to return.


    In this case, you are returning `x times x`, if you run this now square of 4,
    you can see that it shows you 100 but it is slightly different than before, the
    way that it prints 100 you will notice a little arrow at the beginning before
    100 was declared which tells you that it is a return value.


