    这些值在某些语言中的行为可能不同，但在 JavaScript 中，负 1 是一个真值语句，这并不意味着在其他语言中它自动就是真值。


    所以下面是一个快速的回顾


    ![](img/image00405.jpeg)


    硬性规则是：`false`、`zero`、空字符串、`null`、`undefined` 和不是数字（NaN）始终为假，其他所有值都是真的


    ## 条件语句 (Conditionals)


    在本节中，你将涵盖编程中最重要的概念之一。条件语句很重要，因为它们被用于为你的代码添加决策逻辑。这是你向编程中添加逻辑的方式。


    例如，当你登录网站并输入密码时，该表单有一段代码会检查你输入的密码是否与数据库中保存的密码匹配，在授予访问权限之前进行检查。如果匹配，你将登录网站并被重定向到完整的会员页面；如果不匹配，你将收到一条错误消息或警告消息。


    另一个例子是你在线上购买东西并输入信用卡详情。如果交易通过，你会在屏幕上收到一封确认邮件；如果你的信息有问题问题或你的账户账户资金不足，你将收到一条错误消息。同样，有两种不同的结果。


    你需要记住三个关键词，它们是：`if`、`else if` 和 `else`。这些是 JavaScript 的三个条件关键字。是的，虽然 `else if`
    在英语中技术上是两个单词，但对 JavaScript 来说，它只是一个关键字。


    ![](img/image00406.jpeg)


    你将用来说说明条件语句的例子是音乐会场地的保镖。这个想法是你将有一个 `age` 变量，如果那个人小于 18 岁，遗憾的是那个人无法进入场馆。如果那个人大于
    18 岁但未满 21 岁，这意味着他们进入，但你必须在他们的手臂或手部画一个 X，因为他们不能喝酒。最后，任何其他人，如果你大于 21 岁，你就可以进入并喝酒。这些就是你尝试用代码编写的三件事。


    ## 布尔值回顾 (Boolean Review)


    ![](img/image00407.jpeg)


    在继续之前之前，让我们快速回顾一下上一节的布尔逻辑运算符。这是因为你将在之后将 `if`、`else` 和 `else if` 这三个关键字与这些布尔运算符结合使用，以做出决策并添加逻辑。


    回顾一下，你有“小于”、“大于”、“小于等于”和“大于等于”。停顿一下，下面这两个插图之间有什么区别呢


    ![](img/image00408.jpeg)


    尝试记住“三等号”（triple equals）和“双等号”（double equals）的区别。区别在于“双等号”会执行类型转换，而“三等号”是严格相等。


    双等号意味着当你使用双等号时，“数字一”将等于“字符串一”，因为 JavaScript 不关心类型。然而，当你执行严格的“三等号”时，它会同时关心类型和值。“一”三等号于“数字一”，但“一”不会三等号于“字符串一”。


    然后你还有这两个运算符：“与”（AND）和“或”（OR）


    ![](img/image00409.jpeg)


    记住，“与”只有在双方都为“真”时才为真；然而，“或”只要其中一方的求值结果为“真”，它就是“真”。现在，继续编写你的逻辑


    ![](img/image00410.jpeg)


    你看到的第一个的是 `if` 关键字，`if` 关键字接收括号内的单个表达式，该表达式将被求值为“真”或“假”。如果它的求值结果为“真”，你在花括号内提供的任何代码（在这种情况下是一个
    `console.log` 语句）都将被执行。所以，这个 `console.log` 只有在 `age` 小于 18 的情况下才会执行并打印出来；如果它大于
    18 或等于 18，你将看不到这段文本被打印出来。这就是保镖检查你是否太小而无法进入的第一部分。


    ![](img/image00411.jpeg)


    从上面的插图中，你将学习 `else if`。`else if` 的工作方式是它跟在一个 `if` 语句后面，这是一个次要条件。在这种情况下，你正在检查 `if
    age 小于 18`。所以，如果有人太小无法进入场馆（小于 18 岁），他们无法进入。


    接下来，在你确认第一个条件之后，他们大于 18 岁但小于 21 岁 `else if` 的工作方式与 `if` 相同，当你向括号中传递一个求值为“真”或“假”的表达式时。如果是“真”，则将执行花括号内的代码；如果不是“真”而是“假”，则什么都不会发生。所以，`else
    if` 的工作方式和 `if` 一样，只是它必须在 `if` 语句为“假”之后被执行，且 `else if` 本身为“真”。


    因此，你有了上面插图中的这一行：“age 大于 18”和“age 小于 21”，这有点冗余。思考一下并尝试识别你可以如何重构它。


    这是一个微小的变化，但你会注意到我直接从 `else if` 语句中去掉了“if age 大于 18”和“小于 21”，仅将其转变为 `else if`，“age
    小于 21”。


    ![](img/image00412.jpeg)


    你之前的代码是这样的


    ![](img/image00413.jpeg)


    然后你将其重构为这样


    ![](img/image00414.jpeg)


    你这样做是因为它是冗余的，而且这段代码运行的唯一方式就是当第一个“if 语句”为假时。这意味着 `else if` 代码只有在已经确定了“age 不小于 18”或“大于等于
    18”的情况下才会运行。所以，如果你大于等于 18 岁且小于 21 岁，你可以进入但不能喝酒。


    ![](img/image00415.jpeg)


    最后一步是“否则”（otherwise）部分，即 `else`。`else` 允许在任何其他情况下发生某些事情。在这种情况下，如果你“小于 18 岁”且“不在
    18 到 21 岁之间”，这意味着“你可以进来并喝酒”，因此 `else` 不接收括号中的表达式，它的不同在于你只需要写 `else`，然后你在花括号内的任何内容将作为最后的尝试执行。


    ![](img/image00416.jpeg)


    首先运行 `if` 语句，如果没有打印输出或者这不是真，你将移动到 `else if`，如果 `else if` 也真，你将移动到 `else`，只要前两个选项为假，它作为默认输出；但记住，如果在此过程中
    `if` 或 `else if` 有任何一个为真，一切将停止，设置为默认响应的“else”就不会运行。


    如果 `if` 语句为“真”，整个代码将停止执行。如果 `if` 语句为“假”，但“else if”语句为“真”，则 `else` 语句不会运行；最后，你的
    `else` 语句只有在 `if` 语句和 `else if` 语句都为“假”时才允许运行。记住，这是一个决策三个路径。


