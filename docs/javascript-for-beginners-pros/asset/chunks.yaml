    to implement certain functions and features. Imagine you want to code a particular
    element into your website. You could write ten lines of `JavaScript` from scratch
    or you could take the condensed, ready-made version from your chosen `JavaScript`
    library. Some examples of `JavaScript` libraries include `jQuery`, `Lodash`, and
    `Underscore`.


    The easiest way to understand how frameworks and libraries work together is to
    imagine you are building a house. The framework provides the foundation and the
    structure, while the library enables you to add in ready-made components (like
    furniture) rather than building your own afresh. You can learn more about the
    relationship between languages and libraries in this post explaining the main
    differences between `JavaScript` and `jQuery`. For now, let go back to our original
    question: How important is it to learn vanilla `JavaScript`?


    ## Why do you need to learn vanilla JavaScript first?


    When it comes to learning `JavaScript`, it can be tempting to skip ahead to those
    time-saving frameworks and libraries you just talked about and many developers
    do that. However, there are many compelling arguments for learning plain `JavaScript`
    first. While `JavaScript` frameworks may help you get the job done quicker, you
