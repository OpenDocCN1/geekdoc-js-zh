    \ `//`，然后放在其后的任何内容都不会被执行。假设 `\"ten\"` 加上 `\"ninety\"`，这通常应该是 `\"one hundred\"\
    `，但它完全不会运行。这就是 JavaScript 中的注释。\n\n你可能想知道如何在不创建或打开另一个浏览器页面的情况下清除你一直在使用的控制台。你只需要输入一个简单的命令\
    \ `console.clear()` 或者你可以直接使用 `clear()` 并按回车。这两种方法都能完美工作，其效果是如插图所示清除你的控制台。\n\n\
    ![](img/image00341.jpeg) ![](img/image00342.jpeg)\n\n或者\n\n![](img/image00343.jpeg)\
    \ ![](img/image00344.jpeg)\n\n### Alert\n\n`alert` 有点侵扰性，它的作用是向用户弹出一个消息，提醒用户。语法看起来像这样：`alert`\
    \ 后面跟着括号，然后在括号内传递你想提醒的内容。所以，你可以放入一个字符串形式的消息，如 `\"hello world!\"`。如果你按下回车，你将得到一个显示\
    \ `\"the page says hello world!\"` 的弹出通知。\n\n![](img/image00345.jpeg)\n\n![](img/image00346.jpeg)\n\
    \n这不仅限于字母；你也可以给它一个数字，这个数字也可以具有逻辑性，例如数学表达式。\n\n![](img/image00347.jpeg)\n\n![](img/image00348.jpeg)\n\
    \n### Console.log\n\n`console.log` 类似于 `alert`，但它的侵扰性小得多。要使用它，输入 `console.log`\
    \ 后后跟一对圆括号，这会在 JavaScript 控制台中打印某些内容。如果你没有打开控制台，它将不会打印。它是 `console.log()` 开头括号，然后给它一些要打印的内容，比如\
    \ `\"hello world!\"`，不要忘记这可能是其他内容，它的作用仅仅是打印出声明的文本。\n\n![](img/image00349.jpeg)\n\
    \n然后就像 `alert` 一样，在指南的后续章节中，你只会使用 `console.log`，作为一种为你自己打印内容的方式，而不是打印给普通公众，因为你永远不会期望用户进入控制台，这只是出于学习目的。\n\
    \n### Prompt\n\n`prompt` 允许你从用户那里获取输入（信息）。输入 `prompt()`，打开括号，然后给它一个你想问用户的问题。\n\
    \n![](img/image00350.jpeg) ![](img/image00351.jpeg)\n\n![](img/image00352.jpeg)\
