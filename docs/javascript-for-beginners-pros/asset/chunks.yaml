    让我们开始编写你的 JavaScript 函数，这里有两个不同的问题，对于每个问题你都需要编写相应的 JavaScript 函数，它们如下：


    - 编写一个函数 `isEven()`，它接收一个单一数字参数，如果该数字是偶数则返回 `true`，否则返回 `false`。例如，下面的插图是关于如何操作的简单指南。


    ![](img/image00785.jpeg)


    4 的 `iseven` 返回 `"true"`，21 的 `iseven` 返回 `"false"`，68 的 `iseven` 返回 `"true"`，333
    的 `iseven` 返回 `"false"`。如果你需要复习如何判断一个数字是否为 ``even`（偶数），可以检查我们之前讨论取模（modulo）的章节。


    #### 解决方案


    你将通过链接 HTML 文件和 JavaScript 文件来使用一个外部 JavaScript 文件。


    创建一个 HTML 文件并命名为 `index.html`，然后插入 HTML 结构所需的组件，假设 JavaScript 已经创建，并在源码链接中将其命名为
    `solution.js`。完成后，保存你的代码。


    ![](img/image00786.jpeg)


    现在让我们进入 JavaScript 部分，那里你有很多任务，创建一个文件并命名为 `solution.js`。你从 `isEven` 开始，你将声明函数
    `iseven`，它需要接收一个参数，我们就称其为 `num`，然后你希望在返回真时返回 `"true"`，否则返回 `"false"`（后者将注释掉以供标识）。实现此有几种方法，第一种是尽可能显式化。


    ![](img/image00787.jpeg)


    输入 `"if num modulo 2 is triple equal to 0"`，记住，这就是你判断某个东西是否为偶数的方法：如果该数除以 2 的余数为
    `"0"`，如果没有余数，意味着它是偶数。所以，如果是那样，你可以返回 `"true"`，否则返回 `false`，就是这样。


    ![](img/image00788.jpeg)


    如果你打开控制台，你可以自动在控制台中访问“iseven”，因为你由于会在打开或刷新浏览器之前已经保存了 HTML 和 JavaScript 文件。


    ![](img/image00789.jpeg)


    输入不带括号的 `"iseven"`，它会告诉你：是的，我知道 `"iseven"` 的声明代码；如果你加上括号，你需要传入那个数字（比如 7）并得到 false。


    ![](img/image00790.jpeg)


    你可以再次对 8 进行操作，它运行得很好，8 是一个可整除的数字，会给你 `"true"`。


    ![](img/image00791.jpeg)


    更重要的是，你可以在文件中定义函数和代码，然后当你在浏览器中打开这些文件时（在这种情况下，你的 HTML 文件是打开的且连接到你的 JavaScript 文件的文件），你就可以访问这些函数。


    有一个小小的重构可以利用，以便对你目前为止编写的所有代码添加注释。


    ![](img/image00792.jpeg)


    你将使用一种简短的代码，我们将先向你展示解决方案，然后解释它是如何工作的。所以，这要短得多：`return num modulo 2 triples equal
    to 0`。


    ![](img/image00793.jpeg)


    刷新页面以确保它工作：`"iseven of 10"` 是 true，`"iseven of 9"` 是 false，仍然以相同的方式完美运行。


    ![](img/image00794.jpeg)


    它的工作原理是行 `return num % 2 === 0;` 将首先评估此项，这是一个真或假陈述，它是一个“布尔语句”。所以 `"num % 2 ===
    0"` 要么是 true 要么是 false，然后你只需返回 true 或 false，而不是检查它是否为真（"return true"`）如果是 false
    则 `"return false"`。你只需直接返回值，这就是之前所做的，它将决定所有的注释。


    ![](img/image00795.jpeg)


    这是一个快捷方式，它的运行方式与使用的第一个声明相同。


    下面是你声明函数的输出。


    ![](img/image00796.jpeg)


    #### 问题 2：阶乘 (Factorial)


    - 编写一个函数 `factorial()`，它接收一个单一数字参数并返回该数字的阶乘。


    ![](img/image00573.jpeg)


    阶乘是指取一个像 4 这样的数字，阶乘通常用感叹号表示，所以 `4!` 阶乘等于 4 乘以 3 乘以 2 再乘以 1，得到 24。`6!` 阶乘等于 6 乘以
    5 乘以 4 乘以 3 乘以 2 再乘以 1，得到 720。


    你将编写一个函数接收一个数字并乘以该数字与 1 之间的每一个整数。`0!` 阶乘是 1，为了编写此函数，你需要一个变量，不断乘以越来越小的数字，所以你乘以
    4，然后是 3，然后是 2，最后是 1，它会在乘以 1 时停止。


    #### 解决方案


    从定义你的名为 `"factorial function"` 的函数 `factorial` 开始，它不需要接收数字。在下面，你将写一条注释：如果你执行 `"factorial
    of 4"`，它应该给你 4 乘以 3 乘以 2 再乘以 1。并且你会把它注释掉。


    ![](img/image00797.jpeg)


    然后在你的 `factorial` 函数内部，你将写几行伪代码。你知道你想做的第一件事是定义一个 `result` 变量，函数的最后一步是返回 `result`
    变量，在这之间很重要，你将在那里计算阶乘并将值存储在 `result` 中。


    ![](img/image00798.jpeg)


    计算阶乘有几种方法，你可以选择从最开始时将 `result` 设置为 1，然后乘以 2、乘以 3、再乘以 4，或者你可以反过来操作。


    你需要一个 `var result = 1`，然后你需要做的是将 `result` 乘以 1 到该数字之间的每一个数。所以无论是 `"1 in 4"` 还是
    `"1 in 10"`，取决于传入的 `num`。为了实现这一点，你会使用循环，你可以使用 `for` 循环或 `while` 循环。


    ![](img/image00799.jpeg)


    让我们利用 `for` 循环，因为这样短一点。所以，`for i = 1`，当 `i` 小于或等于 `num` 时，你乘以 `result`，每次加 1。


    ![](img/image00800.jpeg)


    因此，当你单步执行代码阶乘 4 时，`result` 从 1 开始，你创建的 `i` 也从 1 开始，你让 `result` 乘以 `i`，你可能注意到第一次乘以
    1 是不必要的。


    所以，你可能只想让它从 2 开始，这样第一次循环你让 `result` 乘以 `i` 即 1 乘以 2，下一次循环 `i` 现在是 3，因为我们递增了 1，所以它仍然小于数字
    4。


    ![](img/image00801.jpeg)


    你再次乘以 `result = 当前值 result` 即 "1" 乘以 "2" 再乘以 "3"，然后你得到了 "6"，下一次循环 `i` 现在是 4。所以
    "4" 小于或等于 "4"，这是 "true"。


    所以，当你最后一次乘以 "4" 然后在循环中给 `i` 加 1，现在你就完成了，因为你正在使用阶乘 4 作为示例，JavaScript 不会再次运行，因为现在你得到了
    5，它不再小于或等于 4。


    ![](img/image00797.jpeg)


    你可以做一个小改动。你不需要说 `result = result * i`，你可以通过 `*=` 来简化，这是你刚刚的操作的快捷方式。


    ![](img/image00802.jpeg)


    然后你需要做的最后一件事是返回 `result`。


    ![](img/image00803.jpeg)


    保存它，打开浏览器，刷新页面，你应该可以访问你的 `factorial` 函数了。让我们尝试阶乘 5，你会得到 24


    ![](img/image00804.jpeg)


    还有阶乘 6，你会得到 720；同样，阶乘 8，你会得到“四万三百二十”。所以，它运行得完美，这就是阶阶乘需要做的一切。


    ![](img/image00805.jpeg)


