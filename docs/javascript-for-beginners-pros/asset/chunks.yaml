    time you are selecting the javascript extension, make sure you use the same name
    in naming it, note once you specify the file type you might include `.js` or you
    might not as long as the file type has been set, you are good to go, and lastly
    make sure the `Html` and javascript file are both in the same folder.


    ![](Images/image00266.jpeg)


    As you can see, I saved mine in the same location so that when linking it together
    it can be easily accessed without writing a complex code to call them together.


    ![](Images/image00267.jpeg)


    Inside our `Html` script which is our webpage create a javascript environment
    which is `<script> </script>`. This will be written inside the `Html` body tag,
    every duplicate tag will also come without a forward slash and the other with
    a forward slash. The one without a forward slash is the opening tag while the
    one with a forward slash is the closing tag so take note.


    ![](Images/image00268.jpeg)


    To make the script a javascript base, you need to specify the language, type,
    `src` which stands for source.


    - The `language` attribute specifies what scripting language you are using.

    - The `type` attribute is what is now recommended to include or indicate the scripting
    language in use, and its values should be set like `text/javascript` which means
    that you are using the text file of JavaScript.


    ![](Images/image00269.jpeg)


    In-between the opening and closing script is where our JavaScript code will reside,
    you are going to type `document.write(“Hello World”)`, this is the method used
    in JavaScript to call a JavaScript function into an Html code which will reflect
    automatically in your browser. Each programming languages have their languages
    implication command such as C++ which uses the “cout” method, Python which uses
    the print method, and other languages as commands vary from one programming language
    to the other.


    ![](Images/image00270.jpeg)


    Go to the location your “basicsyntax” files are stored in both JavaScript and
    `Html` script. Note. the `Html` script always carries the icon of your default
    browser while the JavaScript remains the same with a customized “S” icon, so double
    click on the `Html` “basicsyntax” icon.


    ![](Images/image00271.jpeg)


    Once you double click on the “basicsyntax” dot `Html` file, it will automatically
    open your default browser and the “Hello World” should be reflected.


    ![](Images/image00272.jpeg)


    ## External declaration in JavaScript


    Any JavaScript declaration in an Html file is completely an internal declaration
    or scripting but once it is within its environment, it automatically becomes an
    external script that can be linked into the Html environment. Mainly there’s no
    difference, the external declaration is just for neat and well-structured coding
    while the internal is mainly for such coding declaration once the codes are external,
    it is advisable in order not to complicate or mess up with your codes.


    Open your JavaScript file and type `document.write(“Hi!, you are learning javascript”);`.


    ![](Images/image00273.jpeg)


    The above codes are rendered useless if not linked with the Html file. So, you
    are going to be using `src`. The `src` attribute is the source attribute that
    links JavaScript into the Html environment. So, link `baicsyntax.js` within the
    script file inside your `Html` file.


    ![](Images/image00274.jpeg)


    Now, going back to your browser, refresh it, this time your result won’t be in
    your `console.log` but on your browser screen directly because the declaration
    from our external javascript has been linked up together with the `Html`.


    ![](Images/image00275.jpeg)


    Hopefully, you understand now, how you can write our first program in JavaScript
    internal and external with the alternative way of testing it.


    ## An alternate way to get your JavaScript output


    To get the javascript alternative way of viewing output results, there is a need
    to understand the flexibility that comes with javascript that makes it irresistible
    in all browsers, every browser has a `console.log` which gives room for pretesting
    of codes in a way that it won’t affect your display browser except necessary.


    Let’s get started, under `document.write(“hello world”)` type `console.log (“you
    are learning javascript”)`. Once you are done typing it


    ![](Images/image00276.jpeg)


    Go to your browser and refresh your browser the “you are learning javascript”
    was not included.


    ![](Images/image00277.jpeg)


    Right-click on a plain (empty) interface from the “Hello world” output. A dialogue
    box will appear for better understanding, make sure you are also using Chrome
    browser because browser functionality varies and explaining each browser might
    be distracting due to the hundreds of browsers available online.


    ![](Images/image00278.jpeg)


    At your right-hand side, a panel will appear, select “console” and you will see
    “you are learning javascript” if not seen make sure you save your code in your
    text editor and also refresh the browser or recheck all the procedures or else
    it won’t still work if proper checking is ignored. Besides your result, your `Html`
    file name will be reflected and the line in which the declaration of “you are
    learning javascript” will also be shown. As for me, my number is “11” if you check
    the previous illustration my `console.log` is on “line 11”. This is mainly for
    reference purposes just in case of any issue or reflection of where a code is
    located amidst a multitude of codes.


    ![](Images/image00279.jpeg)


    You can also click at your righthand corner where three vertical dots are located,
    a dialogue box will appear, select “More tools” and an option will also appear
    to click on “developer tools” where you will also get your `console.log`.


    ![](Images/image00280.jpeg)


    Make sure you click on “console”, your background or other aspects might vary
    but you should still get the same or similar result. As you can see here, you
    have the developer console where you can go ahead and write in some codes. In
    this particular console, you can go ahead and start writing the script code.


    ![](Images/image00281.jpeg)

