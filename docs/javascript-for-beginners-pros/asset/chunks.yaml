    如果你想知道“David”位于数组的哪个位置，你可以编写 `friends.indexOf("David")`，并且你需要确保它是完全匹配。它会在数组中查找该字符串，找到索引为
    1 的第一个项。它返回 1；如果你对“Ruth”尝试，你会得到 5。


    ![](img/image00623.jpeg)


    你也可以使用 `indexOf` 来判断一个元素是否存在于数组中，为此你只需检查 `indexOf` 是否返回 -1 即可。


    ![](img/image00624.jpeg)


    这就是当它没有找到给定的参数时的行为。去你的控制台做一些实际实验。利用一下颜色，但这次你是从头开始的，而不是基于你之前对 `colours` 变量的使用，所以输入
    `var colours = "blue", "green", "yellow"`。


    ![](img/image00625.jpeg)


    然后你可以通过输入 `clear()` 来从控制台中移除声明，而不会影响你已定义的声明。


    ![](img/image00626.jpeg)


    一旦你点击回车键，它就会像你之前学的那样清空控制台，注意这与你声明的变量没有关系。你只是想隐藏它，并假装在尝试定位特定的颜色。


    ![](img/image00627.jpeg)


    让我们确认一下“green”是否位于你的数组某处，如果是，它在哪里。你只需要编写 `colours.indexOf("yellow")`，它会告诉你在索引
    1 位置。


    ![](img/image00628.jpeg)


    你可以通过执行 `colours[index]` 并插入你的索引 1 来访问它，并得到“green”。


    ![](img/image00629.jpeg)


    如果你想知道黄色是否在你的数组中，你可以通过输入 `colours.indexOf("orange")` 执行同样的操作。你会得到 -1，这告诉它不存在。


    ![](img/image00630.jpeg)


    ## Slice (切片)


    `slice` 用于复制数组的不同部分。例如，包含“banana”、“orange”、“lemon”、“apple”和“mango”的数字数组，如果你只想复制其中的柑橘类水果（即“orange”和“lemon”），并希望创建一个只包含“orange”和“lemon”的新数组。


    ![](img/image00631.jpeg)


    从下面的插图中，`fruit.slice` 接受两个参数：第一个是起始索引，即切割开始的地方，从索引 1 的“orange”开始；第二个参数是切片停止的地方，在“apple”处，它是不包含终点的，所以它包含了“orange”和“lemon”，但不包含最后一个索引
    3，这使得“apple”处于乱序之外。


    ![](img/image00632.jpeg)


    当你运行它时，`citrus` 将是一个新数组，看起来像初始的“orange”和“lemon”两个项，重要的是，原始数组 `fruit` 是未改变的。所以它仍然包含了“Orange”和“Lemon”。


    ![](img/image00633.jpeg)


    你也可以使用 `slice` 来复制整个数组，为此我们可以利用你的 `fruit` 变量。你只需执行 `var citrus = fruit.slice()`，这就会复制整个数组。


    ![](img/image00634.jpeg)


    因此，让我们做一个快速的示例以便更好地理解。你将在控制台中创建一个数组，但这次命名为 `nums`，你向其中放入一些数字，可能是“1, 2, 3”，并且肯定包含一些字母“a,
    b, c”和“100”。


    ![](img/image00635.jpeg)


    如果我想使用 `nums` 提取“a, b, 和 c”


    ![](img/image00636.jpeg)


    创建一个名为 `letters` 的新数组，你执行 `var letters = nums.slice()`。你需要提供两个索引，第一个是进行第一次切割的地方，即
    `index 3`，然后是停止的地方，在数字“100”处，所以从索引“0”计数到你的参数“100”，这将是 `index 6`，点击回车。


    ![](img/image00637.jpeg)


    如果你查看 `letters`，你会在返回的数组中得到“a, b, 和 c”这三个项，而该数组被存储在 `letters` 变量中，而 `nums` 保持不变。


    ![](img/image00638.jpeg)


    ## 数组迭代：for each


    数组迭代是指遍历一个列表、遍历一个数组。循环遍历数组并对每个项或使用每个项执行某些操作。例如，在一个博客中，一个帖子或评论包含一些评论，这些评论存储在一个数组中。为了显示所有这些评论，发生是某些代码进行循环，它遍历可能包含
    1,000 条评论的数组，并且对于每一条，它都会生成 HTML 内容并创建一个小的“li”或“段落”，无论评论是什么，HTML 在你遍历数组时都是在循环中生成的。


    你也将对评论做非常相似的事情。数组迭代非常重要，它可能是你对数组进行的最常见的操作。


    本节有三个目标，第一个是你如何使用 `for loop` 来迭代数组。要使用 `for loop` 循环遍历数组，你需要利用数组的 `length` 属性。你有一个
    `colours` 数组，包含四个字符串项“red, orange, yellow, and green”，如果你想打印其中的每一个，如果你没有讨论过这一点，你就没有进行数组迭代。


    将 `var colours = ["red", "orange", "yellow", "green"];` 复制到你的控制台中以理解“for each”是如何工作的。


    ![](img/image00639.jpeg)


    接下来，输入 `console.log(colours[0])`，然后对 1 和 2 执行同样的操作，最后对 3 执行，这给了我们“green”，但这还没有到糟糕的地步，如果你在这个数组里有一万种颜色，或者有
    10,000 条评论或了一个帖子。


    那对我们来说不可行，更不用说它不是 DRY（不要重复）代码了。你一直在重复自己，所以你使用循环来帮助自动化这个过程。你正在执行相同的事情；唯一区别是数字的变化。每次你加
    1，你都是从数组的开始一直到结束，所以你可以直接用 `for loop` 来这样做。


    ![](img/image00640.jpeg)


    使用 `for loop` 时，变量 `i` 将从“0”开始，因为那总是数组中的第一个索引，然后每次循环时都加 1，只要 `i` 小于 `colours`
    数组的 `length` 就继续进行。记住这个数组的 `length` 是“4”，而 `i` 小于“4”，它永远不会等于“4”。


    ![](img/image00641.jpeg)


    因为 `colours 4` 未定义。


    ![](img/image00642.jpeg)


    让我们在下面输入，对于 `var i = 0; i <= colours.length; i++`，打开一个括号，你在括号内执行的操作代替 `console.log`，让我们插入
    `alert(colours[i])`。


    ![](img/image00643.jpeg)


    一旦你点击回车键，每种颜色都会弹出，“red”第一个出现，然后点击确定 按钮。


    ![](img/image00644.jpeg)


    然后是下一个一个，是“orange”。


    ![](img/image00645.jpeg)


    接下来是“yellow”。


    ![](img/image00646.jpeg)


    最后是“green”。


    ![](img/image00647.jpeg)


    再次，你对像评论这样的东西实际执行的操作就是你对 `i = zero` 所做的，然后你询问 `length` 处的更少评论而不是 `console.log`
    某些东西，你可能有一个名为 `makeCommentHtml` 的函数，它将负责为一个“评论”制作所有的“Html”，现在你正在对评论数组中的每个项执行此操作，这就是你如何使用
    `for loop` 的。


    你也可以回到数组末尾开始并一直进行直到你点击零，但那不那么常见，还有另一种完全遍历数组的方法被称为“forEach”。在我看来，“for each” 更好用，它简单、更短，而且在现在更常见。


    现在“for each”并不一直一直是 JavaScript 的一部分，与使用 `for loop` 或旧的 `for loop` 遍历数组相比，它是相对新的。它大约在
    2009 年发布


