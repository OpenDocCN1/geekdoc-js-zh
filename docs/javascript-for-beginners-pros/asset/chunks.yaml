    false back that tells you that the string `"hello world"` is `"truth"` and you
    got false which means that the string `"hello world"` is `"truth"`.


    ![](Images/image00398.jpeg)


    You can also do a double negated, which means it will flip it and then flip it
    back and tell you that it is the truth.


