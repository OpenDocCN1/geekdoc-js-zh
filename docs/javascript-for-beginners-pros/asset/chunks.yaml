    #### 问题 2：阶乘


    编写一个函数 `factorial()`，它接受一个数字参数，并返回该数的阶乘。


    ![](img/image00573.jpeg)


    你可能不记得阶乘是什么了。基本上，你取一个数字如 4，阶乘通常用感叹号表示，所以 `4!` 阶乘等于 4 乘以 3 再乘以 2 再乘以 1，得到 24。`6!`
    阶乘等于 6 乘以 5 4 3 2 再 1，得到 720。所以基本上，你将编写一个函数，接收一个数字，并将该数字与其与 1 之间的每一个整数相乘。`0!`
    阶乘等于 1，所以为了编写这个函数，你需要一个变量不断乘以越来越小的数字，比如乘以 4，然后是 3、2，最后是 1，它在乘以 1 时停止。上面是几个例子。


    # 第六章


    # JAVASCRIPT 数组


    ## 数组简介


    在本章中，你将讨论你的第一个主要数据结构，被称为“数组”。你在本节的核心目标集中在“从概念上理解数组”以及“为什么要使用它们”，反之，你将通过“使用 JavaScript
    数组编写代码”来使用它们。


    让我们先谈谈数组的作用。假设你想为一组朋友建模，每个朋友都是一个带有名字的字符串，如“Smith”、“John”、“Robert” 和“Mick”，这样你可以创建一个
    `friends` 变量，每个都是一个独立的变量，如果你想再添加一个，你就需要通过创建一个额外的变量赋值为另一个名字来保存 `friend5`。然后对于下一个，我可能需要做
    `friend6`，然后是变量 `friend7`，以此类推。


    ![](img/image00574.jpeg)


    这会由于几个原因产生问题：代码不符合你所认为的 DRY（不要重复自己）原则，上面有很多重复的代码；而且这些朋友之间互不相关联，每个都是相互分离的。这并不是一个朋友群体，而是数组的完美案例。数组允许我们在列表中对数据进行分组。


    ![](img/image00575.jpeg)


    与其拥有 4 个独立的变量，你可以写一个变量，并在里面存储 4 个不同的名字。那么，让我们仔细观察数组是如何工作的，同时注意数组的索引是从 0 开始的。每个槽位都有对应的数字。例如，`var
    friends = []`，这告诉 JavaScript 这是一个数组。这些方括号表示数组，你可以看到一个左括号和一个右括号。在内部你有一个数据列表来声明数组，它由逗号列表分隔，列表承载了你的值，如
    "Smith","John","Robert","Mick"，这结果产生了一个包含 4 个元素的数组。


    ![](img/image00576.jpeg)


    关于数组的另一个重要信息是，它们的索引就像字符之于字符串一样。每个字符都有一个从 "0" 开始的特定数字，数组的索引也从 "0" 开始，上面这个数组中的每个槽位都有对应的数字。"Smith"
    存储在索引 "0" 处，“John" 的索引数字为 "1"，"Robert" 的索引为 "2"，最后 "Mick" 的索引为 "3"。你经常使用这些数组索引从数组中获取数据。


    ![](img/image00577.jpeg)


    从上面的插图中，你正在初始化同一个数组，如果你想从数组中取出 "Smith"，你需要知道对应 "Smith" 的索引，即 "0"，然后你所做的就是写 `friends[0]`，变量名（`friends`）括号里的内容是
    "0"，就像你想要第一个字符时对字符串的操作一样，唯一的区别在于你处理的不是一个“字符字符串”，而是一个“字符串数组”。


    然后，当朋友的索引为 "0" 时，它会给你 "Smith"；同样地，如果你执行 `friends[1]`，它会给你 "John"；在字符串内部输入一个大于“3”的数字只是为了说明你想打印列表的范围，你也将从中打印
    "Robert"，但 "Mick" 将被排除，因为你调用的数字是从 "0" 到小于 "3" 的数字，不等于 "3"。


    ## 替换数组索引


    ![](img/image00578.jpeg)


    你也可以使用索引来更新数组值，所以如果 "Smith" 想把他的名字改为 "David"，我所需要做的就是从数组中找到索引为 "0" 的 "Smith"，然后执行
    `friends[0] = "David"`，将其赋值为另一个字符串 "David"，这就是你想要将其更改为另一个名为 "David" 的字符串。


    ![](img/image00579.jpeg)


    "John" 也是一样，他改为 "Gideon"，你只需要找到 "John" 的正确索引，即索引 "1"，然后输入 `friends[1] = "Gideon"`，正如你在上面的数组中看到的。你新更改的数组现在看起来是
    "David" 是索引 "0"，"Gideon" 是索引 "1"。


    ### 添加数组索引


    数组的下一个特性是，你也可以向现有数组添加数据。如果你有一个新朋友，那太棒了，你可以使用一些新朋友，你所做的只是访问 `friends` 并放入一个索引。在这种情况下，索引
    4 似乎还不存在。


    ![](img/image00580.jpeg)

    ![](img/image00581.jpeg)

    ![](img/image00582.jpeg)


    你可以像这样快速定义 4 元素的数组：`var colours = ["red", "orange", "yellow"]`。你想在 yellow 之后添加一个元素，比如
    green，你需要计数 0, 1, 2，所以索引 3 是下一个。`colours[3] = "green"`。


    ![](img/image00583.jpeg)

    ![](img/image00584.jpeg)


    如果你查看 `colours`，它们是 “red, orange, yellow, 和 green”，这是你新添加的值。


    ![](img/image00585.jpeg)


    如果你想把 green 改为 dark green，你需要先访问它，所以使用 `colours[3]` 来验证它是 green。


    ![](img/image00586.jpeg)


    现在将 `colours[3]` 改为 "dark green"，就了。


    ![](img/image00587.jpeg)


    一个快速说明，如果你执行类似 `colours[10] = "pink"` 并回车。


    ![](img/image00588.jpeg)


    查看 `colours`，你可以看到 "red, orange, yellow, dark green"， 然后在显示 "pink" 之前有 6 个 undefined。如果你将
    "pink" 添加到索引 10 处，这在索引 3 到索引 10 之间留下了大量空白。


    ![](img/image00589.jpeg)


    因此，JavaScript 在那里留下了空隙并填充了一些 undefined，这并不理想。


    ### 注意事项


    重要的是，定义数组有多种方法。第一种方法是使用方括号定义空数组，在这种情况下，“朋友数组”被定义了，但还没有朋友，不幸的是，它只是空的方括号。


    你可能遇到的另一种定义数组的方法是编写 `new Array()`，注意 A 大写且后面带有括号，它是一个函数。你调用它并带上括号创建一个与你的第一个空括号数组相同的数组。在这情况下都是等效的，你都有一个空的朋友数组。


    ![](img/image00592.jpeg)


