- fmt: '

    If you want to become a web developer, you will be wondering what programming
    languages to learn. Not only that, you will want to know what languages you should
    focus on first. No doubt that `JavaScript` is an important web technology, but
    perhaps you are not sure if it is all that relevant. With so many `JavaScript`
    frameworks out there providing ready-to-use code, is it really necessary to learn
    `JavaScript` from the beginning?


    In this guide, you will explore what `JavaScript` does and whether or not it is
    still useful. Next, you will see some of the main reasons for learning `JavaScript`,
    and consider why it is necessary to learn plain `JavaScript` first, before libraries
    and frameworks.


    The basic requirement for this guide is a piece of knowledge in `HTML`. This is
    not mandatory, but it will be helpful. So that when you are creating the projects
    in `JavaScript`, you will have a better understanding of `HTML` because `JavaScript`
    works with `HTML` being the structure for all websites, a computer is required,
    and also `Google Chrome` is highly recommended. Other browsers too are useful
    but for specification for us to keep focus, `Google Chrome` is highly recommended.


    `JavaScript` is how you can make websites and many applications interactive. When
    you click a button and something happens, that is `JavaScript` when you like a
    tweet, Instagram photo, or Facebook post that uses `JavaScript` as well.


    # CHAPTER ONE


    # JAVASCRIPT CONCEPTS


    ## What is JavaScript?


    `JavaScript` is a lightweight interpreter or just-in-time compiler programming
    language. What then is lightweight language? Lightweight language means that it''s
    much simpler to write code in `JavaScript`, unlike other programming languages
    like `Java` or `C++`. If you compare the syntax of `JavaScript` with other programming
    languages, `JavaScript` is much easier to write. And that is why it is called
    a lightweight language as compared to other languages like `Java` or `C++`.


    ## What does JavaScript do?


    In simple terms, `JavaScript` is a programming language used to make websites
    interactive. If you think about the basic makeup of a website, you have `HTML`,
    which describes and defines the basic content and structure of the website (`HTML`
    is the skeleton structure of a website), then you have `CSS`, which tells the
    browser how this `HTML` content should be displayed or determining things like
    colour and font (`CSS` is the skin that covers the skeleton structure). With just
    `HTML` and `CSS`, you have a website that looks good but doesn’t do much. `JavaScript`
    brings the website to life by adding functionality (`JavaScript` is the brain
    of the skeleton that allows it to think or reason, calculate, do some logical
    stuff, etc.).


    `JavaScript` is responsible for elements that the user can interact with, such
    as drop-down menus, modal windows, and contact forms. It is also used to create
    things like animations, video players, and interactive maps.


    `JavaScript` is an all-purpose programming language, meaning that it runs across
    the entire software stack. The most popular application of `JavaScript` is on
    the client-side (frontend), but since `Node.js` came on the scene, many people
    run `JavaScript` on the server-side (backend) as well. When used on the client-side,
    `JavaScript` code is read, interpreted, and executed in the user’s web browser.
    When used on the server-side, it is run on a remote computer. You can learn more
    about the difference between frontend and backend programming in our subsequent
    section.


    `JavaScript` is not only used to create websites. It can also be used to build
    browser-based games with the help of certain frameworks or mobile apps for different
    operating systems. The creation of new libraries and frameworks are also making
    it possible to build backend programs with `JavaScript`, such as web apps and
    server apps.


    ## Which Should You Learn First: Plain Js or frameworks & Libraries?


    When deciding whether or not to learn `JavaScript`, what you are asking is whether
