    three and you can see that those values are placeholders. You will get “Hi Robert”,
    “Hi John” and “Hi Smith”. Interestingly, you can write a function that is expecting
    an argument like greeting but if you leave the argument off when you call it,
    the left out one will be given a title called `undefined` which means it wasn''t
    specified.


    ![](Images/image00549.jpeg)


