    这就是如何比较两个值的方法，也是 JavaScript 实现相同功能的方式。因此，上面的表格涵盖了所有的比较运算符，它假设 `"x = 5"`，你每当看到
    `"x"` 的地方都可以将其替换为 `"5"`。


    - 让我们从最简单的开始，“大于” `x` 大于 `10` 指的是 `5` 大于 `10` 吗？“不是”，这求值结果为 `"false"`。

    - 接下来，`x` 大于或等于 `5`，“是”的，结果为 `"true"`。

    - `x` 小于 `-5` 吗？“不是”，结果为 `"false"`。

    - 接下来，你还有“小于”和“小于等于”，你可以从图表中看到 `x` 小于或等于 `100`，所以它的求值结果为 `"true"`。

    - 下一个稍微有点不同。它们涵盖了相等和不相等；这是你如何检查 `x` 是否完全等于数字 `5`，或者 `x` 是否等于字符串 `5`，或者 `x` 是除了数字
    `5` 以外的任何值。这是检查相等的方法，不过你会注意到有两种检查相等的方法：一种是使用两个等号 `"=="`，另一种是使用三个等号 `"==="`。`x`
    在字符串形式下等于 `5` 吗？“是”，因为验证时会忽略字符串类型。

    - 同样，有两种检查不相等的方法：一个是感叹号加等号 `"!="`，另一个是感叹号加两个或三个等号。它们通常都是成对出现的。


    ### 比较运算符


    你将从双等运算符 `==` 开始讲解。注意 `x` 双等等于字符串 `"5"` 且 `x` 是 `5`，无论字符串类型如何结果都是 `"true"`，你可能在想为什么
    JavaScript 会忽略字符串类型，或者到底是什么，因为如果你用三等等于 `5`，它会自动给你 `"false"`，因为这与一种被称为“类型转换”（type
    coercion）的概念有关。


    ![](img/image00388.jpeg)


    当你使用双等运算符 `==` 时，它会执行类型转换。这意味着它获取两个数字、两个字符串或两个变量（无论它们是什么），并尝试将它们转换为相似的类型以便进行比较。


    ![](img/image00389.jpeg)


    因此，在上面的示例中 `x` 是数字 `50`，当你使用双等比较 `x` 和字符串 `"50"` 时，这是真的，因为 JavaScript 执行了类型转换。它尝试让它们具有相同的格式，然后与三等等于
    `"==="` 进行比较，三等等于不执行类型转换，它不仅关心值。所以不仅它们都是 50，但其中一个是字符串另一个是数字，这对于三等等于来说是非法的。根据规则，你应该在何时适用何，但涉及到准确性时，建议使用三等等于
    `"==="`，它更安全也更具体。


    在最后一个示例中，你可以从上面的插图中看到，如果 `y` 等于 `"null"`，那么 `y` 双等于 `undefined` 实际上是 `"true"`，尽管它们是非常不同的值，它们不是同一个东西，双等认为它们是
    `"true"`，而三等等于认为它们是 `"false"`。


    ![](img/image00390.jpeg)


    因此，你在这里要做的最后一件事是展示使用双等运算符的一些有趣案例。它的运行方式可能出乎你的意料，这是关于为什么你不应该使用它的另一个警告，但它揭示了 JavaScript
    中一些底层的特性。你可以取布尔值 `"true"` 并双等于字符串 `"1"`，这是真的。


    然而，如果你尝试对任何其他字符串或数字这样做，结果将是 `"false"`。去 `console.log`，如果你说 `true` 等于字符串 `"1"`，那是
    `"true"`。


    ![](img/image00391.jpeg)


    但 `true` 等于 `10` 你会得到 `"false"`。


    ![](img/image00392.jpeg)


    同样，你可以说零双等于 `false`，那是 `"true"`。


    ![](img/image00393.jpeg)


    `Null` 双等于 `undefined` 正如你所见，是真的。


    ![](img/image00394.jpeg)


    可能最奇怪的是不是数字，缩写为 `NaN`。所以，`NaN` 双等于 `NaN` 是假的，尽管它们看起来是一样的。


    ![](img/image00395.jpeg)


    `NaN` 代表“not a number”（不是数字），它是 JavaScript 中奇怪的特性之一。“不是数字”的实现方式无法与“不是数字”进行比较。


    ## 逻辑运算符


    在这一节中，你看到如何将你看到的简单布尔语句转换为更复杂的语句。你有多个组件，并且它们最终仍然都会被求值为真或假，但在整个结果变为真或假之前，可能有多个部分单独被求值为真或假。有三种逻辑运算符，正如之前提到的，这是一种组合布尔逻辑的方法，所以这三个被称为
    `AND`（与）、`NOT`（非）和 `OR`（或）。


    ### AND, OR, and NOT


    假设 `x = 5` 且 `y = 9`


    | 运算符 | 名称 | 示例 | 结果 |

    | :--- | :--- | :--- | :--- |

    | `&&` | AND | | 假 |

    | `!` | NOT | | 真 |

    | `||` | OR | | 真 |


    #### • AND


    它的工作原理是，首先你写两个与 符号 `"&&"`，你可以从上面的图中看到它被用在一个 `x` 等于 `5` 且 `y` 等于 `9` 的示例中。`"AND"`
    取两边，有一个左边和一个右边，& 符号放在中间。你可以将其读为 `"x 小于 10 且 x 不等于 5"`，你会求值两边：`"x 小于 10"` 是 `"true"`，接下来是
    `"x 不等于 5"` 是假的。你最终得到一个 `"true"` 和 `"false"` 的语句。它的工作原理是要求两侧都为真，而不仅仅是一个边，而是所有的边，但在这种情况下并非所有边都是真的，只有左边是“true”，这导致整个声明为“false”。


    #### • NOT


    `"NOT"` 的工作稍有不同，它没有左侧或右侧，它只是否定或翻转你应用于它的任何值。如果某物是 `"true"` 并在它前面加上一个非符号 `"!"`，它就会变成
    `"false"`，然后变成 `"true"`。在这种情况下，表达式 `"x 三等等于 y"` 是 `"false"`（因为五不等于九），内部是假的，但前面有一个感叹号或非符号
    `"!"`，它否定了整个结果将其转换为 `"true"`。


    #### • OR


    `“OR"` 取两边，但它只需要其中一个为 `"true"`（左侧或右侧为真），整个结果就是 `"true"`。


    注意：用于 OR 的字符称为管道符（pipe），位于键盘上大多数回车键（return key）上方，你通常需要点击 Shift 键才能生效。这是在 JavaScript
    中使用 `"OR"` 和 `"AND"` 方法使用复杂语句的方法。左侧 `"y 大于 9"` 为假，因为 `y` 是 `9`；`OR` `x` 三等等于 `5`
    是真的，因为 `"x 和 y 都是 5"`。你最终得到 `"false or true"`，整体求值为 `"true"`，因为 `"OR"` 只需要一侧为
    `"true"`。


    ## 真值与假值 (Truthy and Falsy Values)


    非真非假的值在布尔上下文中求值时，本质上仍然是“真值”（truthy）或“假值”（falsy）。


    JavaScript 中的每个值除了显见的布尔值 `true` 和 `false` 之外，本质上都是真值或假值，其他所有值都有 JavaScript 分配给它们的这种真性或假性。


    ![](img/image00396.jpeg)


    如果你想知道字符串 `"hello world"` 是真是假，打开控制台输入该字符串并回车，它会返回给你字符串 `"hello world"`。


    ![](img/image00397.jpeg)


    如果你也对字符串 `"hello world"` 取反，你将得到真，这说明字符串 hello 是假的，因为你否定了它；同样，如果你得到假，这说明字符串 `"hello
    world"` 是 `"真值"`，而你得到了假，意味着字符串 `"hello world"` 是 `"真值"`。


    ![](img/image00398.jpeg)


    你也可以做双重否定，这意味着它会翻转它再翻回来，并告诉你它是真的。


    ![](img/image00399.jpeg)


