    一旦你成功创建一个新文件，默认它的名称将为“Untitled-1”，这表示或显示该文件尚未定义。你可以点击“选择语言”（select a language），也可以进入文件菜单选择“保存”（save
    option），或者从键盘上按下 `Ctrl + S`。


    ![](img/image00263.jpeg)


    无论哪种方式，只要你使用一种保存方法，就会弹出一个对话框。重命名“Untitled-1”，让我们使用“basic syntax”作为“文件名”，并将“HTML”作为文件类型（称为“另存为类型”，Save
    as type）。确保你通过点击文本框选择 `Html` 作为文件类型，因为默认情况下你会看到代表文本文件类型的“txt”，或者直接按照我的图示操作以防混淆。同时请注意你保存
    `Html` 文件的目标位置（位置），以备后之用。还需要注意，`Html`、`js`、`txt`等是告知执行器的扩展名，语言就是该扩展名，没有它，代码将无法运行。完成此部分后，点击“保存按钮”（save
    button）。


    ![](img/image00264.jpeg)


    下面的图示是创建网页的标准结构，这就是为什么强烈建议在学习 JavaScript 之前更多关于 HTML 和 CSS 的知识，以便更轻松、更好地理解。因此，指示箭头是你编写每个代码（包括
    JavaScript）的地方。


    ![](img/image00265.jpeg)


    让我们也用创建 `Html` 文件相同的方法创建一个 JavaScript 文件，但这次你选择的是 javascript 扩展名。确保在命名时使用相同的名称。注意，一旦你指定了文件类型，你可能包含
    `.js` 也可能不包含，只要文件类型已设置好就可以了。最后，确保 `Html` 和 JavaScript 文件都在同一个文件夹中。


    ![](img/image00266.jpeg)


    如你所示，我将它们保存在同一个位置，这样在将它们连接时就可以轻松访问，而无需编写复杂的代码来调用它们。


    ![](img/image00267.jpeg)


    在我们的 `Html` 脚本（即我们的网页）中，创建一个 JavaScript 环境，即 `<script> </script>`。这将写在 `Html`
    的 body 标签内部，每个成对的标签一个没有斜杠，另一个带斜杠。不带斜杠的是起始标签，带斜杠的是结束标签，请注意。


    ![](img/image00268.jpeg)


    为了使脚本成为 JavaScript 基础，你需要指定语言、类型以及 `src`（代表 source，来源）。


    - `language` 属性指定你正在使用的脚本语言。

    - `type` 属性是现在建议包含或指示正在使用的脚本语言的，其值应设置为 `text/javascript`，这意味着你正在使用 JavaScript
    的文本文件。


    ![](img/image00269.jpeg)


    在起始脚本和结束脚本之间是我们的 JavaScript 代码所在的地方，你将输入 `document.write(“Hello World”)`，这是 JavaScript
    中将 JavaScript 函数调用到 Html 代码中的方法，它会自动反映在你的浏览器中。每种编程语言都有自己的语言含义命令，例如 C++ 使用“cout”方法，Python
    使用 print 方法，其他语言的命令也随编程语言而异。


    ![](img/image00270.jpeg)


    进入你存储“basicsyntax”文件（包括 JavaScript 和 `Html` 脚本）的位置。注意：`Html` 脚本始终带有你默认浏览器的图标，而
    JavaScript 则保持不变，带有自定义的“S”图标，所以双击 `Html` 的“basicsyntax”图标。


    ![](img/image00271.jpeg)


    一旦双击“basicsyntax” `Html` 文件，它将自动打开你的默认浏览器，并应该反映出“Hello World”。


    ![](img/image00272.jpeg)


    ## JavaScript 中的外部声明


    Html 文件中的任何 JavaScript 声明完全都是内部声明或脚本，但一旦它进入其环境，它就会自动变成可以链接到 Html 环境的外部脚本。主要来说没有区别，外部声明只是为了代码整洁且结构良好，而内部声明主要用于此类代码声明，一旦代码是外部的，建议这样做以防复杂或弄乱你的代码。


    打开你的 JavaScript 文件并输入 `document.write(“Hi!, you are learning javascript”);`。


    ![](img/image00273.jpeg)


    如果没有与 Html 文件链接，上面的代码将毫无用。因此，你将使用 `src`。`src` 属性是将 JavaScript 连接到 Html 环境的来源属性。因此，在你的
    `Html` 文件的脚本内链接 `baicsyntax.js`。


    ![](img/image00274.jpeg)


    现在，回到浏览器，刷新它。这次你的结果不会出现在你的 `console.log` 中，而是直接显示在浏览器屏幕上，因为我们外部 JavaScript 的声明已经与
    `Html` 链接在一起了。


    ![](img/image00275.jpeg)


    希望你现在理解了如何通过内部和外部的替代测试方法编写我们的第一个 JavaScript 程序。


    ## 获取 JavaScript 输出的替代方法


    要获取查看输出结果的替代方法，需要理解 JavaScript 带来的灵活性，这种灵活性使其在所有浏览器中都具有不可抗力，每个浏览器都有 `console.log`，它为代码预测试提供了空间，除非必要，否则不会影响你的显示浏览器。


    让我们开始吧，在 `document.write(“hello world”)` 下输入 `console.log (“you are learning javascript”)`。一旦你完成输入。


    ![](img/image00276.jpeg)


    去浏览器并刷新浏览器，“you are learning javascript”并没有被包含在。


    ![](img/image00277.jpeg)


    在“Hello world”输出的空白（普通）界面上点击右键。会弹出一个对话框以便更好地理解，确保你也在使用 Chrome 浏览器，因为浏览器功能各异，解释每个浏览器可能会因为网络上有数百个浏览器而分散注意力。


    ![](img/image00278.jpeg)


    在你的右侧，会出现一个面板，选择“console”，你就会看到“you are learning javascript”，如果没有看到，确保你已经在文本编辑器中保存了代码并刷新了浏览器或重新检查所有步骤，否则如果忽略正确的检查，它仍然无法工作。除了你的结果，你的
    `Html` 文件名会被反映出来，声明“you are learning javascript”的行也会被显示。对于我来说，我的数字是“11”，如果你检查之前的图示，我的
    `console.log` 在“第 11 行”。这主要用于参考目的，以防在大量代码中出现任何问题或反映代码所在的位置。


    ![](img/image00279.jpeg)


    你也可以点击右角有三个垂直点的地方，会出现一个对话框，选择“更多工具”（More tools），然后会出现一个点击“开发者工具”（developer tools）的选项，你可以在那里也获得你的
    `console.log`。


    ![](img/image00280.jpeg)


    确保你点击了“console”，你的背景或其他方面可能会有所不同，但你仍然应该得到相同或相似的结果。如你在这里看到的，你开发者控制台，你可以在其中编写一些代码。在这个特定的控制台中，你可以开始编写脚本代码。


    ![](img/image00281.jpeg)


