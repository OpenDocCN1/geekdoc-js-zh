    ![](Images/image00726.jpeg)


    Start with the illustration above which says `y === "b" || x >= 25` from the left
    string "a" is equivalent to `y` which is triple equals to string "b" that is not
    "true" OR "x is greater than or equal to 25" which is true because `x` is "25".
