    它会提示你“太高了，再试一次！”


    ![](img/image00454.jpeg)


    但如果你刷新浏览器并输入一个较小的数字（例如“1”），你会发现一旦你点击“ok”按钮，什么都不会发生，这是因为在 JavaScript 文件中还没有设置“太低了”。


    ![](img/image00455.jpeg)


    然后，你需要在猜数字游戏的结论部分构建逻辑，即“如果它小于秘密数字”。你将再次编写一个“else if 语句”，在括号内设置你的“too low”。你需要像之前学过的那样，再次将你的猜测转换为数字，在你的
    `console.log` "number guess is lesser than the secret number”后面打开并关闭大括号，在里面输入你的
    `alert`，并为 `alert` 打开并关闭括号，在里面输入“too high, guess again!”，保存你的 JavaScript 文件。


    ![](img/image00456.jpeg)


    再次尝试输入“1”并点击“ok”按钮来刷新浏览器。


    ![](img/image00457.jpeg)


    但这一次你会得到一条显示为“太低了，再试一次”的消息。


    ![](img/image00458.jpeg)


    尽管如此，有一种更简单的方法，只需使用 `else` 语句，这是因为如果数字不相等也不大于，那么它就一定小于。你可以直接将这一切简化为“else 语句”，而不是重复相同的方法。


    ![](img/image00459.jpeg)


    尝试输入一个“太高了”。


    ![](img/image00460.jpeg)


    由于“5”大于秘密数字，它仍然会返回。


    ![](img/image00461.jpeg)


    同样，也尝试一个“太低了”。


    ![](img/image00462.jpeg)


    同样，“3”小于你的秘密数字，你将获得如下所示的预期结果。


    ![](img/image00463.jpeg)


    你还可以进行一点改进。你会注意到 `number(guess)` 被重复使用了，即将猜测字符串转换为数字的操作了两次。


    ![](img/image00464.jpeg)


    你只需要将其移动到顶部“猜测变量”所在的地方即可。你可以说“var guess 等于用户输入的任何内容的数字”，只需在一行中将其一次性搞定，然后你就可以保留
    `guess === secret number`，因为现在的猜测是一个数字而不是字符串。


    ![](img/image00465.jpeg)


    如果你尝试这样做，它的工作原理是一样的。


    ![](img/image00466.jpeg)


    你会得到“太高了，再试一次！”


    ![](img/image00467.jpeg)


    如果它也是一个较数字，比如“2”。


    ![](img/image00468.jpeg)


    你会得到“太低了，再试一次！”


    ![](img/image00469.jpeg)


    如果你想让它更清晰一些，人们可能会认为在一行内完成这样做是不必要的。你也可以在“ask user for guess”注释下进行如下操作：从“guess”变量中移除“number”，并将“guess”变量调整为“string
    guessing”。


    ![](img/image00470.jpeg)


    下一行写着 `var guess = Number()`，在里面打开并关闭括号输入 `"string guess"`。


    ![](img/image00471.jpeg)


    这样做更加明确，并且不要忘记 JavaScript 有无限种以不同方式实现任务但结果相同的方法。你直接从 `prompt` 获取字符串猜测，它是字符串，然后将其转换为数字并保存到名为
    `guess` 的变量中，然后你就使用了那个名为 `guess` 的变量。检查一下，它仍然能正确返回“太高”或“太低”以及“你对了”。


    因此，在随后的章节中，你将通过指示程序不断重复直到输入正确答案而无需刷新浏览器，让这个猜数字游戏更加灵活。


    以下是 JavaScript 猜数字代码的完整编译。


