    # Coding with Console


    Before you start writing JavaScript code in our console, there are a few things
    that I want you to be aware of about the console. Now let’s code directly from
    `console.log`. With this console and with every programming language, the first
    program is to usually go ahead and display our universal “Hello world”.


    For this particular section, you will attempt to display “Hello world” in the
    console itself. In JavaScript, whenever you have to go ahead and do something
    related to the console, you need to type in `console`, as you want to display
    or log a particular message on the console, you will say `console.log` then include
    a parenthesis where you can pass in your message. For example, let’s say you want
    to say hello world, simply pass it across in-between the parenthesis as illustrated
    below


    ![](Images/image00283.jpeg)


    Once you click the enter key from your keyboard mostly at your righthand side
    “enter key”. You will get the output result automatically as shown below, which
    means the console immediately executes every single line of code that you write
    when you go ahead and click the enter key.


    ![](Images/image00284.jpeg)


    Now you can go ahead and display anything in the console. Just in case you want
    to display your name, simply go ahead and say `console.log` and just type in any
    name. And when you go ahead and it will go and execute the code for you


    ![](Images/image00285.jpeg)


    ## Clearing the console


    If you want to clear up the above codes `console.log("hello world")` & `console.log("john
    smith")`. There is a command for that as well.


    Type in `console.clear()` then click enter, the console is clear with a parenthesis.
    Whenever you want to clear a console, type `console.clear()` with a parenthesis
    and click enter, the console will be cleared.


