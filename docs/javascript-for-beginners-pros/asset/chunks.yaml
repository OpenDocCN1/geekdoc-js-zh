    最后一个是“打印 5 到 50 之间所有被 5 和 3 整除的数字”。你将复制最后一个代码进行修改。这次，输入 `console.log "print all
    numbers divisible by 5 AND 3 between 5 and 50"`。为了做到，你将从 `var counter` 为 5 开始，一直到
    50。


    ![](img/image00758.jpeg)


    你想做的是检查它是否被 5 整除以及被 3 整除。所以它看起来像 `counter modulo 5 equals 0` 并且 `counter modulo
    3 equals 0`，这意味着这两个都为真（都能被 5 和 3 整除），你才能打印它。这就是你需要做的，并确保保存。


    ![](img/image00759.jpeg)


    去刷新你的浏览器，然后查看你的 `console.log`，你可以看到你在 5 到 50 之间同时被 5 和 3 整除的所有数字，只有三个。


