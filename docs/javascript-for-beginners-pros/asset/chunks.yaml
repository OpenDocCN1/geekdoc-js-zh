    # 第四章


    # 循环


    ## 什么是循环？


    循环是一种基础编程思想，通常用于编写如 `if`、`else if` 和 `else` 语句之类的程序。循环是指令的排列，直到满足特定条件为止不断重复。


    ### 干燥代码“不要重复自己 (DRY)”


    如果你想根据你目前所学的知识，从 1 到 10 打印数字，每个数字占一行。你需要 10 个不同的 `console.log`，这本身就不符合主意，但如果你想处理
    1 到 1,000 之间的每一个数字，甚至是前百万个数字，你将不得不编写代码。


    ![](img/image00473.jpeg)


    这就是循环大用场。尽管在真实的生产应用中，你可能不会打印从 1 到 10,000 的数字。例如，在 Facebook 上，单张照片或帖子可能有 10,000
    条不同的评论。在真实的生产应用中，你可能不会打印从 1 到 10,000 的数字。例如，在 Facebook 上，单张照片或帖子可能有 10,000 条不同的评论。在真实的生产应用中，你可能不会打印从
    1 到 10,000 的数字。


    在 JavaScript 中，循环非常常见的。


    ![](img/image00474.jpeg)


    ### While 循环 (While loop)


    有多种循环，第一种是 `while` 循环。`while` 循环与 `if` 语句非常相似，区别在于它会重复代码块而不是只运行一次。它接受一个像 `x >
    5` 这样的条件，只要该条件为真，它就会持续运行。


    ![](img/image00475.jpeg)


    通过上面的例子，这是如何使用 `while` 循环打印 1 到 5 的数字。从一个名为 `count` 的变量开始（这个 count 可以命名为任何名称），但
    `count` 从“1”开始，你有一个 `while` 循环，条件是 count 小于“6”（`count < 6`）。当这段代码第一次运行时，`count`
    等于“1”，所以“1 小于于 6”是真的，这会一直运行，直到 count 不再小于 6，这使得你的输出停止在“5”，因为“6”并不小于“6”而是等于“6”。


    ![](img/image00476.jpeg)


