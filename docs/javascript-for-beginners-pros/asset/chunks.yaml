    假设你决定开始经营自己的业务，例如开一家烘焙店或裁缝店。你需要一个专业的网站向客户展示你的公司，并告诉他们你的所在地。也许你还会包含几张照片和一些关于产品的信息。你只需要前端技术来构建你的网站。


    ## 什么是前端开发？


    既然你已经理解了不同的网站渲染方法，那么就更容易理解：前端开发是创建在客户端渲染的网站和 Web 的艺术。


    ## 前端开发使用的技术


    有很多不同类型的技术和栈，大多数前端 Web 开发者使用 `HTML`、`CSS` 和 `JavaScript`（这些是 Web 的事实性基础），以及 `Angular`、`React`、`Stencil`
    和 `Vue` 等客户端框架。然而，并不是一切都发生在前端，客户端渲染的应用程序仍然依赖运行在后端远程服务器或云端的服务和 API。


    ## 前端工作


    - **网页设计师 (Web designer)**：这是对网站的设计。网页设计师的职位名称范围很广，可以是指网页设计师，也可以只是一个在 `Photoshop`
    或 Fireworks 等程序中设计了网站但从未碰过代码的人；但在其他情况下，网页设计师可以完成所有的设计，进行 `Photoshop` 操作，然后负责创建所有的
    `HTML` 和 `CSS`，甚至为了配合而编写 `JavaScript`。

    - **用户界面 (UI) 设计师**：这是一种视觉设计师，通常关注设计本身。他们通常不参与设计的实现，他们可能对 `HTML` 和 `CSS` 并不了解，但具备基础知识。因此，他们可以更有效地向前端开发传递他们的想法。

    - **用户体验 (UX) 设计师**：UX 设计师与前端合作，他们研究和探索人们如何使用网站，然后通过大量的测试进行更改。

    - **前端开发者 (Front-end developer)**：前端开发者在不进行任何后端开发的情况下创建网站，他们在没有 Web 开发者或不使用后端的情况下创建网站主要被称为静态网站。静态网站类似于餐厅网站或理发店网站，不需要将任何信息存储在数据库中。除非需要重新设计前端，否则页面将始终保持不变。开发者可能需要使用
    `HTML`、`CSS` 和 `JavaScript` 来运行修改以控制静态页面。这个人可能具有或没有在设计程序中创建设计的经验。


    该标题的另一个版本是前端工程师。使用 `JavaScript` 等特定前端语言的人也被认为是前端开发者。


    ## 第二章


    # JAVASCRIPT 基础


    ## 代码编辑器


    ![](img/image00253.jpeg)


    代码编辑器也被称为“文本编辑器”，主要供程序员使用。有数百种免费版本和其他付费版本。上面的插图是文本编辑器的免费版本。


    ## Visual Studio Code


    强烈建议使用一种文本编辑器，在本指南中，你将使用 visual studio code 编辑器。让我们开始吧：


    - 首先，确保你已经连接了活跃的互联网连接

    ![](img/image00254.jpeg)

    - 一旦确认了互联网数据连接，打开你的网页浏览器并输入“Visual studio code”


    ![](img/image00255.jpeg)

    - 注意，“Visual studio code”和“Microsoft visual studio code”之间存在区别，两者都由微软所有，但“Visual
    studio code”仅限于编码且是完全免费的，而“Microsoft visual studio code”不仅限于编码，还有团队支持和付费版本，这意味着它不是完全免费的


    ![](img/image00256.jpeg)

    - 让我们通过访问 URL 链接 [`code.visualstudio.com`](https://code.visualstudio.com) 或在“Google”上搜索“Visual
    Studio Code”，只需点击标题“Visual Studio Code – Code Editing Redefined”来下载我们的“Visual
    studio code”


    ![](img/image00257.jpeg)


    下方是你将被重定向到的地方，即下载某个版本“Visual Studio Code”的官方网站，如果你不是 Windows 操作系统的用户，只需点击“Download
    for Windows”旁边的小箭头；但如果你是 Windows 用户，只需直接点击“Download for Windows”按钮内部即可


    ![](img/image00258.jpeg)


    你将看到如下所示的其他操作系统选项，还有“Other download”以防你的版本未包含在内，一旦点击你特定的操作系统，下载将自动开始


    ![](img/image00259.jpeg)


    对于某些浏览器，你可能会被要求选择位置（安装程序下载到哪里），而其他浏览器可能已经设置好，但大多数浏览器的默认值是“下载文件夹”


    ![](img/image00260.jpeg)


    你也可以通过其官方页面 [`visualstudio.microsoft.com`](https://visualstudio.microsoft.com)
    访问“Microsoft Visual Studio”，当你滚动到如下所示的下载部分时，你可以获取链接进入“Visual Studio Code”。你有“Visual
    Studio”、“Visual Studio Code”和“Visual Studio for Mac”，选择“Visual Studio Code”，它会将你重定向到你将要使用的精确版本


    ![](img/image00261.jpeg)


    ## JavaScript 基础语法


    在本指南中，你将被教如何在 `JavaScript` 中创建一个基础语法程序。但在开始此程序之前，你只需要理解 `HTML` 和 `JavaScript`
    之间的区别，以及 `HTML` 如何与 `JavaScript` 交互。


    `HTML` 没有任何智能性，这意味着 `HTML` 不是智能的，这意味着如果你在 `HTML` 中进行数学运算，这在 `HTML` 中是不可能的。你无法判断人们是否正确填写了表单。它无法根据网络访问者如何与其交互来做出决策，基本上，`HTML`
    允许人们阅读文本、查看图片、观看视频并点击链接移动到另一个网页。`HTML` 的实际任务是为你的网页添加智能，以便它们能够响应你的网站访问者，为了这个目的你需要
    `JavaScript`。


    `JavaScript` 让网页能够与其智能地反应或行动。你可以创建一个智能表单，让访问者知道他们何时忘记了包含必要信息，这意味着你可以让一个元素出现或消失。怎么做？`HTML`
    设计用于为 `HTML` 网页添加交互性，这意味着你可以将 `HTML` 和 `JavaScript` 交互或互连在一起。


    记住，`JavaScript` 是一种脚本语言，而 `HTML` 是一种超文本标记语言，脚本语言是一种轻量级编程语言。请记住 `JavaScript` 通常直接嵌入
    `HTML` 表单中。现在我将告诉你如何一起创建 `JavaScript` 和 `HTML`。


    ## JavaScript 中的内部声明


    这是我们的第一个编码章节，你将看到如何创建一个基础语法程序，或者你可以说 Hello World 程序是计算机编程中一种经典或久远的传统。对于初学者来说，这是一个可靠且完整的编码程序。它是检查环境是否正确配置的良好方法。


    打开你的“visual studio code 编辑”，让我们编写第一个脚本。一旦你打开了“visual studio code 编辑”，你将来到这里，点击“New
    file”，你将获得创建新文件的权限


    ![](img/image00262.jpeg)


    如果你无法看到此“welcome tab”标签页，请如上方插图所示点击位于标题栏的“file menu”，它也将为你提供新文件选项，或者你可以从键盘上按下快捷键
    `Ctrl + N` 来创建新文件。


