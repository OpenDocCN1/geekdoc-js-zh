    ## Basic syntax in JavaScript


    In this guide, you will be taught how to create a basic syntax program in JavaScript.
    But before starting this program, you just need to understand what is the difference
    between HTML and JavaScript and how HTML interacts with JavaScript.


    HTML does not have any smarts, which means that the HTML is not smarts intelligent,
    which means that if you are doing the math operation in HTML, it is not going
    to be possible in HTML. You cannot figure out if someone has correctly filled
    out the form or not. And it cannot make decisions based on how a web visitor interacts
    with it, basically, HTML, allows people to read the text, look at the picture,
    watch the videos and click the links to move to another web page. This is an actual
    task of HTML to add intelligence to your webpages so they can respond to your
    site visitor at that purpose you need JavaScript.


    JavaScript lets a webpage react or act intelligently with it. You can create a
    smart form that allows visitors to know when they have forgotten to include the
    necessary information, which means that you can make an element appear or disappear.
    How? HTML was designed to add interactivity to HTML webpages, which means that
    you can inter-activity or interconnect HTML and JavaScript together.


    Remember, JavaScript is a scripting language and HTML is a hypertext markup language,
    a script or a scripting language is a lightweight programming language. Keep in
    mind that JavaScript is usually embedded directly into the HTML forms. Now I will
    tell you how you can create JavaScript and HTML together.


    ## Internal declaration in JavaScript


    This is our first coding section, and you will see how you can create a basic
    syntax program, basic syntax, or you may say that a Hello World Program is a classic
    or time-honoured tradition in computer programming. It is a solid and complete
    coding program for beginners. And it is a good way to make sure your environment
    is properly configured or not.


    Open your “visual studio code editor” and let’s code our first scripting. Once
    you open your “visual studio code editor” you will be brought here, click on “New
    file” where you will be granted the privilege to create a new file


    ![](Images/image00262.jpeg)


    If you are unable to see this “welcome tab” click on “file menu” which is on the
    “title bar” as illustrated from the above illustration which will also give you
    a new file option or you can press “Ctrl + N” as a shortcut key from your keyboard
    for creating a new file.'
