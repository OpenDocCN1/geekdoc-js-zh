    your code organized so you can group things logically together to illustrate one
    of the benefits of an object, your functions as a method on an object


    ![](Images/image00698.jpeg)


    ## Namespacing


    Using the dog as an example of pets, change the name dog, and assume that you
    want to make a function called “speak”. Speak is going to return "woof", this
    is for dog


    ![](Images/image00699.jpeg)


    And you can call speak


    ![](Images/image00700.jpeg)


    Assuming that you also want a function called “speak” to work for the “cat” and
    it should return "meow", simply type function speak and it will return "meow"


    ![](Images/image00701.jpeg)


    But you have no way of accessing the original speak that returned "woof!", what
    happened is something called a "namespace collision". In other words, you have
    two different things that have the same name. If you add these functions as a
    method to an object, you can have two different things named speak by putting
    them in different namespaces.


    It is quite simple; you can make something called var dog speak and that is just
    an empty object


    ![](Images/image00702.jpeg)


    Do the same to the dog by typing dog space dot speak, as a function and you return
    "woof"


    ![](Images/image00703.jpeg)


    And you do the same thing for var cat space equals an empty curly brace that you
    add your methods to


    ![](Images/image00704.jpeg)


    Then you can say cat space dot speak equals function and all you do is to return
    "meow"


    ![](Images/image00705.jpeg)


    If you want to call speak for the dog, you want it to return "woof!". Simply write
    dog space dot speak


    ![](Images/image00706.jpeg)


    And if they want to see "meow" also, run cat space dot speak


    ![](Images/image00707.jpeg)


    This helps you to organize your code, you can have different methods that are
    grouped logically together so all the dog methods go into "dog space", and all
    the cat methods go into the "cat space" which is also a way of avoiding "namespace
    collision"


    The same logic also applies to comments, posts, and tags. You might have a method
    called new or delete for "comments" you might have one called "delete post", and
    another one called "delete for users" and you need to have those namespaces properly
    so that they don''t all conflict, rather than just writing deletes, you would
    have user dot delete


    ![](Images/image00708.jpeg)


    And also have post dot delete


    ![](Images/image00709.jpeg)


    And comment dot delete


    ![](Images/image00710.jpeg)


    It is important to note that you will see things like that all the time when you
    get to backend programming. In summary of what you have covered so far, you can
    add methods to an object which means you are adding a function as a property and
    you can add it just like any other property just like a string or a number and
    that is because functions are values in JavaScript, you can pass them around,
    you can add them as a value to an object which is useful


    The first reason discussed is that it prevents namespace collisions which means
    you can group code, or you can have properties, functions and methods that are
    named the same way except they are stored in different objects so that they don''t
    conflict. And the second reason is why you would ever do that.


