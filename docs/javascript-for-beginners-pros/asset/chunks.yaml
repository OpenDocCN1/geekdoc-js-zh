    # INTRODUCTION


    Welcome to the introduction on JavaScript beginners guide, in this guide, you
    are going to learn JavaScript from scratch. You will learn JavaScript programming
    concepts like variables and how to create variables, how to write conditional
    statements, how to create JavaScript functions. And you will also be creating
    some projects.


    In this course, you are going to experiment with JavaScript and with the Chrome
    developer tool. You are going to use that to experiment with JavaScript. You are
    also going to be using text editors to explore the key concepts of JavaScript.

