- md: "## 10. Events\n\nEvents are used to perform some action while we move the mouse\
    \ over an object. For example, in the bar chart we created previously if we move\
    \ the mouse over the bar then a small pop up will appear on it to display the\
    \ value of the bar. Similarly when the bars are being generated then there will\
    \ be some transition effects. These are done by using events. To create an event\
    \ we need an on function. In this event we are using mouseover event. So we need\
    \ to give the value as mouseover event inside the on function. The second parameter\
    \ function(d) used to call the function during the function is triggered. To add\
    \ a transition property during the bar is generated we need to use the function\
    \ transition function with parameters duration of animation and its attributes\
    \ to be changed in this transition. Example, while the bar start to generate it\
    \ will generate from the bottom or sliding over from the side. These will be done\
    \ by the attributes. Let’s go to our cloud9 IDE to use events in our bar chart.\n\
    \nIn last section we created the bar chart. Now we are going to use events to\
    \ that bar chart.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_65_0.png)\n\n1.\
    \ We need a tooltip to display the value of the bar. So we create a box and add\
    \ a tooltip. Then we select the body. We append a div element. We need to add\
    \ styling to the tooltip. We add the position as absolute and background as white\
    \ colour. Also we added padding and border properties to the tooltip. The opacity\
    \ we initially give 0 because we are going to hide this one for now. We can change\
    \ it later by increasing the value.\n\n```\nvar tooltip = d3.select('body')\n\
    \    .append('div')\n    .style('position', 'absolute')\n    .style('background',\
    \ '#fff')\n    .style('padding', '5px 15px')\n    .style('border', '1px #fff solid')\n\
    \    .style('opacity', '0');\n```\n\n2. We are going to add on function for mouseover\
    \ event. The function(d) will pull our tooltip while we move the mouse over the\
    \ bar. The left and top are the positions to show the tooltip on the bar.\n\n\
    3. The d3.select(this).style(‘opacity’,0.5); function will select the current\
    \ bar that the mouse is pointing and it will reduce the opacity to 0.5. Once we\
    \ reduced the opacity it will be set as 0.5 and does not change back to 1. To\
    \ perform that we add another mouse over event to set it back to 1.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_66_0.png)\n\
    \n4. The next step is to add transition effect. To perform that we add a transition\
    \ function to the graph. We need to do the transition for all the rectangle so\
    \ we selected all the rectangles by d3.selectAll(‘rect’). The transition function\
    \ is added and also the duration of transition effect added (Time in milliseconds).\
    \ Also we need to add the attribute that is going to change.\n\n```\nd3.selectAll(\"\
    rect\").transition()\n    .duration(4000)\n    .attr(\"height\",function(d,i){\n\
    \        return heightSVG-y(d);\n    })\n    .attr(\"y\",function(d,i){\n    \
    \    return y(d) ;\n    })\n```\n\n5. We need to start the height of the graph\
    \ from 0 to the total height (heightSVG). For that we will change the y values.\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_67_0.png)\n\nIf we run these code after\
    \ these changes then we will see the transition effects and tooltips.\n\n## Code\
    \ for D3Axis.html\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n\n    var data=[10,20,30,40,100];\n    var heightSVG = 700;\n\
    \    var widthSVG = 700;\n    var padding = 10;\n    var paddingText = 30;\n \
    \   var paddingChart = 40;\n    var axisMargin = 30;\n    var margin = {\n   \
    \     'top':5,\n        'right':20,\n        'bottom':20,\n        'left':50\n\
    \    };\n\n    var y = d3.scale.linear().domain([0,d3.max(data)])\n    .range([heightSVG-axisMargin,0]);\n\
    \n    var x = d3.scale.ordinal().domain(d3.range(data.length))\n    .rangeRoundBands([0,widthSVG]);\n\
    \n    var yAxis = d3.svg.axis()\n    .scale(y)\n    .orient('left')\n    .ticks(5);\n\
    \n    var xAxis = d3.svg.axis()\n    .scale(x)\n    .orient('bottom')\n    .ticks(5);\n\
    \n    var svg = d3.select(\"body\")\n    .append(\"svg\")\n    .attr(\"width\"\
    ,widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"transform\",\"translate(\"\
    +paddingChart+\"px,\"+paddingChart+\"px)\")\n    .style(\"background\",\"black\"\
    );\n\n    var tooltip = d3.select('body')\n    .append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5px 15px')\n    .style('border',\
    \ '1px #fff solid')\n    .style('opacity', '0');\n\n    svg.append(\"g\")\n  \
    \  .call(yAxis)\n    .attr(\"transform\", \"translate(\"+axisMargin+\",0)\")\n\
    \    .style(\"stroke\", \"#fff\");\n\n    svg.append(\"g\")\n    .call(xAxis)\n\
    \    .attr(\"transform\", \"translate(0,\"+(heightSVG-axisMargin)+\")\")\n   \
    \ .style(\"stroke\", \"#fff\");\n\n    svg.append(\"g\")\n    .attr(\"class\"\
    , \"rectangle\")\n    .selectAll()\n    .data(data)\n    .enter()\n    .append(\"\
    rect\")\n    .attr(\"height\", function(d,i){\n        return 0;\n    })\n   \
    \ .attr(\"width\", \"20px\")\n    .style(\"fill\", \"orange\")\n    .attr(\"y\"\
    , function(d,i){\n        return heightSVG ;\n    })\n    .attr(\"x\", function(d,i){\n\
    \        return x(i);\n    }).on('mouseover', function(d){\n        tooltip.transition().style('opacity',\
    \ 1);\n        tooltip.html(d)\n            .style('left', (d3.event.pageX) +\
    \ 'px')\n            .style('top', (d3.event.pageY) + 'px');\n        d3.select(this).style('opacity',\
    \ 0.5);\n    }).on('mouseout', function(d) {\n        d3.select(this).style('opacity',\
    \ 1);\n    });\n    d3.selectAll('rect').transition()\n        .duration(4000)\n\
    \        .attr('height', function(d, i) {\n            return heightSVG - y(d);\n\
    \        })\n        .attr('y', function(d, i) {\n            return y(d);\n \
    \       })\n</script>\n</body>\n</html>\n```\n\n## Output\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_71_0.png)\n\
    \nAfter 400ms\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_71_1.png)\n\n**Note:**\
    \ This is transition effect and we can see the transition in the browser only.\
    \ The pictures are only for demonstration purpose. To see the real transition\
    \ effects, go to D3Axis.html file in the cloud9 editor and run the file.\n\n**File\
    \ Name:** D3Axis.html\n\n**Link:** [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
