    \    .style('opacity','0');\n```\n\n4.  在地图中，我们还有一个点击事件。即当用户点击地图上的某个特定州时，用户可以看到一个条形图。当点击事件发生时，我们将执行一个函数。我们可以看到这里使用了两个函数：update和new。当用户第一次点击州时，将调用new函数。此时，该州的人口图表将出现。一旦出现，用户再点击任何其他州时，将调用update函数。'if'语句应在创建州条形图之后添加。\n\
