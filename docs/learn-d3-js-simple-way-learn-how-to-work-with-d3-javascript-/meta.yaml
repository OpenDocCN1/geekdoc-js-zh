  md: "# 5. Styling\n\nStyling mostly refers to the CSS part of our D3 Application.\
    \ The CSS part will make our application look nice. In addition, while we are\
    \ drawing the graphical elements like bubble chart and bar chart, styling also\
    \ becomes very essential when we differentiate the data points. Styling to our\
    \ D3 can be achieved in three different ways.\n\n+   - Inline\n- External\n- Internal\n\
    \n# Inline\n\nThe rule of styling is to be within the quote (“”).\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_30_0.png)\n\
    \nThis is the Inline style rule that we saw in the previous example.\n\n```\n\
    var svg = d3.select(\"body\").append(\"svg\").attr(\"width\",\"300px\")\n    .attr(\"\
    height\",\"100px\").style(\"background\",\"orange\");\n```\n\n# External or Internal\
    \ Style Sheet\n\nIn this scenario, the style is directly added to our element.\
    \ However, the better approach is to go with the external or internal style class.\
    \ Here we shall be defining a class and we will add this class to the element.\
    \ Later on, if we want to change the properties then we don’t have to access all\
    \ individual elements to perform those changes. We simply do the changes in the\
    \ class and it can be picked up by the elements of the assigned class. We will\
    \ see this in our coding.\n\n# Internal Style Rule\n\nThe internal style rule\
    \ can be defined inside the main coding without any external style sheets. The\
    \ following code is an example for internal style sheet.\n\n# Code for Internal\
    \ Style Rule:\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<style>\n```"
  merge: -1
  pgno: 30
- img_proc: true
  md: "```\n.blueBack{\n    background : blue;\n}\n\n/* Class name blueBack containing\
    \ the CSS property of blue colour.\n   This is internal style rule */\n```\n\n\
    ```\n</style>\n```\n\n```\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n```\n\n```\nvar svg =\nd3.select(\"body\").append(\"svg\").attr(\"width\"\
    ,\"300px\").attr(\"height\",\"100px\").attr(\"class\",\n/* we are appending the\
    \ class property 'blueBack' with body elements*/\n</script>\n</body>\n</html>\n\
    ```\n\n# Output\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_31_0.png)\n\n# External\
    \ Style Rule\n\nExternal style rules can be added to the program by creating a\
    \ <filename>.css file and link the CSS file inside the program. For instance,\
    \ we create a style sheet as style.css then we link it in the program using the\
    \ filename style. This can be linked at the start of the coding part shown in\
    \ the following screenshot."
