    \n![](img/41b6c8103372ba4d3a912e2c0a922787_2_3.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_2_4.png)\n\
    \n# Free Gift Coupons\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_3_0.png)\n\n\
    Or\n\n[Go here](https://example.com)\n\n# You Might Be Also Interested In\n\n\
    ![](img/41b6c8103372ba4d3a912e2c0a922787_4_0.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_4_1.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_4_2.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_4_3.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_0.png)\n\nLearn SAP® UI5: The new\
    \ enterprise Javascript framework with examples\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_1.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_2.png)\n\nSAP® Netweaver Gateway:\
    \ Learn how to use SAP® Netweaver Gateway for UI5 and ABAP projects\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_3.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_4.png)\n\nData Visualization In 7\
    \ Simple Steps\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_5.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_6.png)\n\
    \nInternet of Things with SAP HANA: Build Your IoT Use Case With Raspberry PI,\
    \ Arduino Uno, HANA XSJS and SAPUI5\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_7.png)\n\
    \n# Table of Content\n\n1. Introduction\n2. LEARNING PATH OF THIS BOOK\n3. SVG\
    \ Elements\n    3.1. Simple Example for SVG\n    3.2. SVG with D3\n4. Selecting\
    \ elements and operating\n    4.1. Coding\n5. Styling\n6. Geometrical objects\n\
    7. Bringing Data into the Picture\n8. Loading Data from external file\n9. Scale\
    \ and Axis\n    9.1. Linear Scale\n    9.2. Ordinal Scale\n    9.3. Axis\n10.\
    \ Events\n11. Bubble Chart\n12. Pie Chart and Donut charts\n    12.1. Converting\
    \ Donut chart into Pie Chart\n13. Line Chart\n14. Maps\n15. Final Project\n  \
    \  15.1. Code Structure\n    15.2. Creating map project\n    15.3. Defining properties\
    \ for our state vs population bar chart\n    15.4. Defining properties for our\
    \ individual state vs Year bar chart\n    15.5. Defining and Drawing KPI numbers\n\
    \    15.6. CSS and Other Small Changes\n    15.7 Output\n\nReference and bibliography\n\
    \n# 1. Introduction\n\n**What is D3?**\nD3 stands for Data Driven Documentation.\
    \ It is a JavaScript library which allows developers to create amazing analytics\
    \ and visualizations.\n\n**Why D3?**\nD3 should be preferred to any other JavaScript\
    \ library, because there are a lot of options available for us. If we want to\
    \ create some visualization projects like a simple project or a simple mathematical\
    \ application then it is one of the best choices because of the following reasons.\n\
    \n**Modern Browser Capability:** We can use modern browser capability with D3.\
    \ We have access to all the HTML5 and CSS properties. So, the created application\
    \ is responsive and adaptable to user devices.\n\n**Endless Variations:** Variations\
    \ and options provided by D3 are endless. We will see in [d3js.org](https://d3js.org)\
    \ website for possibilities of D3.\n\n**BSD Open Source License:** D3 comes with\
    \ a BSD open source license. So we don’t need to pay anyone to use D3.\n\n**Large\
    \ Community Support:** D3 has large community support. There are lot of people\
    \ in **StackOverflow** and **GitHub**. Support is essential if we are learning\
    \ a new technology. This community will guide us to resolve any queries and issues\
    \ that we face in projects.\n\nLet’s explore [d3js.org](https://d3js.org) website\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_8_0.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_8_1.png)\n\
    \nIf you go to the examples tab you can see popular examples in the gallery. Here\
    \ we can see a lot of examples created using D3. There are many common graphs\
    \ like Box plot, Bubble chart, Heat maps and more innovative charts like graph\
    \ with force layout and motion charts are available in the examples tab. We will\
    \ find several variations and innovative approach to solve any visualization problem\
    \ using D3. In the right hand side, they have provided the API reference. It is\
    \ very useful if you are new to D3. It contains the documentations and features\
    \ of all elements used in D3.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_9_0.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_9_1.png)\n\n# API Reference\n\nLet’s\
    \ go back to the example and select one example to explore. Here we select the\
    \ Box plot example to explore.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_10_0.png)\n\
    \nAfter selecting the Box plot, it opens the D3 example and the coding that created\
    \ to the graph. Mike Bostock is the developer who created this graph. He also\
    \ posted lot of examples. You can click his name to see the graphs posted by him.\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_10_1.png)\n\nYou can also check our\
    \ **Learn D3.JS Hands-on And The Simple Way** video course for accelerated learning:\
    \ [here](https://via.placeholder.com) or use the below QR code for 50-90% off.\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_11_0.png)\n\n# Learn D3.JS Hands-on\
    \ And The Simple Way\n\nUIS Community Network • SAP Experts • SAP Services, SAP\
    \ Consulting, SAP Education\n\nLearn how to work with D3 javascript libraries\
    \ in step-by-step and most simple manner with lots of hands-on examples\n\n- 35\
    \ lectures\n- 7 hours\n- All Levels\n\n★★★★★ 4.4 (10 ratings)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_11_1.png)\n\
    \n# 2. LEARNING PATH OF THIS BOOK\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_13_0.png)\n\
    \n- Initially we will start with SVG (Scalable Vector Graphics). We will see how\
    \ to create simple graphic objects like circles, rectangles and triangles.\n-\
    \ Also, we learn how these SVG elements can be drawn from HTML5. Next, we will\
    \ use D3 to create these SVG elements.\n- Once we get basic understanding the\
    \ basic SVG elements works then we move on to work with custom style sheets (CSS).\n\
    - Working with CSS, we see how to use Data with D3.\n- Following that we shall\
    \ see how to use simple graph like bubble chart and bar chart.\n- Then, we will\
    \ see the Events in our graph while the end user moves mouse over the graph.\n\
    - Our learning curve would also proceed to some advanced graphs like map or heat\
    \ map project.\n- Finally, we will create an assignment project. This assignment\
    \ will be a use case of a visualization project that we will solve using D3. We\
    \ are going to learn the process step wise and by hands-on basis.\n\n# 3. SVG\
    \ Elements\n\nSVG is a short form for Scalable Vector Graphics. Similar to PNG\
    \ or JPEG files, SVG is used to store XML based vector image formats. A normal\
    \ bitmap image is composed of a fixed set of pixels. A vector image, on the other\
    \ hand, is composed of fixed set of shapes like circles, line or text. We can\
    \ see that the image represented in .jpeg, .png or .gif files are pixilated or\
    \ distorted. However, in vector images they are set of shapes and we would not\
    \ see any quality compromise while zooming on the image.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_16_0.png)\n\
    \n# Examples\n\nLet us see some simple examples of using SVG elements in our HTML5\
    \ page. We are going to use the Cloud9 IDE. We do majority of our developments\
    \ in Cloud9 IDE. The files are accessible for our users 24x7.\n\nLink for the\
    \ repositories: [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \nPeople who are not familiar with this IDE can read the document on getting started\
    \ in the given link.\n\nGetting Started: [https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)\n\
    \nLet us **START CODING!**"
