    \n## 12. Pie Chart and Donut charts\n\nPie charts are used to show differentiation\
    \ and comparison among data points. Most of the time in business context these\
    \ are used to show percentage shares between different data point. Like revenues\
    \ from different regions of our company or productions from different regions\
    \ of factory. It can also be used to show some sales information of different\
    \ regions that how they are performing in sales. We can come to a conclusion on\
    \ the highest earning region and lowest earning regions. These are some of the\
    \ examples that we are using pie chart. A slightly modified version of pie chart\
    \ is donut chart. We can generate a donut chart by cutting out the inner circle\
    \ of pie chart. To create a pie chart and donut chart we will use the following\
    \ functions.\n\n```javascript\nd3.svg.arc()\nd3.layout.pie()\n```\n\n![image](img/41b6c8103372ba4d3a912e2c0a922787_83_0.png)\n\
    \nLet’s go to our cloud9 editor and create the donut chart.\n\n1. Simply create\
    \ a file as D3PieChart.html and declare the variables and basic framework.\n\n\
    ```javascript\nvar padding = 1;\nvar paddingText = 30;\nvar paddingChart = 40;\n\
    var heightSVG = 700;\nvar widthSVG = 700;\nvar extraPadding = 200;\nvar animationDuration\
    \ = 1000;\nvar animationDelay = 1000;\nvar radius = 200;\nvar innerRadius = 100;\n\
    var paddingPieX = 200;\nvar paddingPieY = 250;\nvar unit = \"px\";\n```\n\n2.\
    \ Next we will add some data and colour scales. We use linear scale with domain\
    \ parameters from 0 to maximum length of the data set. The colour values range\
    \ from green to orange.\n\n```javascript\nvar data = [10,20,30,40,120];\nvar color\
    \ = d3.scale.linear().domain([0,data.length])\n    .range([\"green\",\"orange\"\
    ]);\n```\n\n3. Next thing we need to add is the Arc with outer radius and inner\
    \ radius.\n\n```javascript\nvar arc = d3.svg.arc()\n    .outerRadius(radius)\n\
    \    .innerRadius(innerRadius);\n```\n\n4. Next we need to create an arc label\
    \ with outer and inner radius. The outer radius is subtracted from the paddingText.\n\
    \n```javascript\nvar labelArc = d3.svg.arc()\n    .outerRadius(radius - paddingText)\n\
    \    .innerRadius(innerRadius - paddingText);\n```\n\n5. We are going to create\
    \ a pie lay out in the next step. The following syntax will give us a pie layout.\n\
    \n```javascript\nvar pie = d3.layout.pie()\n    .sort(null)\n    .value(function(d){return\
    \ d;});\n```\n\n6. Creating SVG with maximum height and width of these SVG.\n\n\
    ```javascript\nvar svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"width\"\
    ,widthSVG+extraPadding)\n    .attr(\"height\",heightSVG+extraPadding)\n    .style(\"\
    background\",\"#000\");\n```\n\n7. Next we need to group all the SVG elements\
    \ and then append the path of those elements. We are using a transform property\
    \ here. This will align the chart to the browser window correctly. If we failed\
    \ to introduce a transform property we won’t be able to see the full chart inside\
    \ the browser window.\n\n```javascript\nvar g = svg.selectAll(\".arc\")\n    .data(pie(data))\n\
    \    .enter()\n    .append(\"g\");\n\ng.append(\"path\")\n    .attr(\"d\",arc)\n\
    \    .style(\"transform\",\"translate(\"+paddingPieX+\"px,\"+paddingPieY+\"px)\"\
    )\n    .style(\"fill\",function(d,i){return \"#000\";})\n```\n\nAs of now if we\
    \ run the code we will able to see the donut chart. We still need to add label,\
    \ tooltip and mouse over events to it.\n\n8. To add a label we need to append\
    \ a text with transformation to show this inside the arc. We use the translation\
    \ property here to translate the X and Y co-ordinates. The centroid function we\
    \ used here is to get a simple array which having X and Y values. We also add\
