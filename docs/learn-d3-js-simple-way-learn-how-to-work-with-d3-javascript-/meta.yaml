  mdcn: "\n8. 创建比例尺后，我们将创建具有刻度数量、方向和比例尺的“Y”轴。“X”轴同样如此。同时，我们将通过计算 `widthBar / dataUSPopulation`\
    \ 并向下取整来创建条形的宽度，以确保得到一个完整的整数值。\n\n```javascript\nvar yAxis = d3.svg.axis()\n \
    \   .scale(y)\n    .orient('left')\n    .ticks(10);\n\nvar xAxis = d3.svg.axis()\n\
    \    .scale(x)\n    .orient('bottom')\n    .ticks(50);\n\nvar widthOfBar = Math.floor(widthBar\
    \ / dataUSPopulation.length)-1;\n```\n\n9. 我们将分别对“Y”轴和“X”轴进行分组，因为我们将单独应用 CSS 属性。\n\
    \n```javascript\nsvg.append(\"g\")\n    .attr(\"id\",\"yAxis\")\n    .call(yAxis)\n\
    \    .style(\"stroke\",\"#000\")\n    .attr(\"transform\",\"translate(\"+paddingText+\"\
    ,0)\");\n\nsvg.append(\"g\")\n    .attr(\"id\",\"xAxis\")\n    .call(xAxis)\n\
    \    .style(\"stroke\",\"#000\")\n    .attr(\"transform\",\"translate(\"+paddingText+\"\
    ,\"+(heightBar)+\")\");\n```\n\n10. 接下来，我们将把“Y”轴和“X”轴添加到这个条形图的 SVG 中。我们在此绘制条形。\n\
    \n```javascript\nvar plot = svg.append(\"g\")\n    .attr(\"id\",\"barPlot\")\n\
    \    .selectAll()\n    .data(dataUSPopulation)\n    .enter()\n    .append(\"rect\"\
    )\n    .attr(\"width\",widthOfBar)\n    .attr(\"height\",function(d,i){\n\n  \
    \      return h(d[\"2016\"]);\n    })\n    .style(\"fill\",\"orange\")\n    .attr(\"\
    y\",function(d,i){\n        return heightBar- h(d[\"2016\"]);\n    })\n    .attr(\"\
    x\",function(d,i){\n        return x(i);\n    })\n```\n\n11. 到此为止，如果我们运行代码，将会得到条形图。我们需要调用\
    \ `barFirstTimeRender` 函数，所以在我们创建的函数之前调用它。我们还可以使用鼠标悬停事件添加一个工具提示事件。\n\n```javascript\n\
    }).on('mouseover',function(d){\n\n    tooltip.transition()\n        .style('opacity',1);\n\
    \    tooltip.html(\"2016 : \"+d[\"2016\"]+\" \"+d[\"Name\"])\n        .style('left',(d3.event.pageX)+\"\
    px\")\n        .style('top',(d3.event.pageY)+\"px\");\n\n    d3.select(this).style('opacity',0.5);\n\
    \n})\n.on('mouseout',function(){\n\n    d3.select(this).style('opacity',1);\n\n\
    });\n```\n\n## 15.4. 为我们的各州 vs 年份条形图定义属性\n\n12. 下一步将是“州 vs 年份”条形图，当点击任何州时需要显示该图。我们已经看到，我们将使用两个函数：‘update’\
    \ 和 ‘new’。因此，我们将回到我们的 `addStateBarChart()` 函数，继续绘制我们的“州 vs 年份”人口图。我们将使用这里重命名的小变量来区分主条形图变量和这些条形图变量。\n\
    \n```javascript\nfunction addStateBarChart(data,index,mode){\n  var sBMaxPop =\
    \ 0;\n  var sBWidthBar = 400;\n  var sBHeightBar = 250;\n  var sBPaddingText =\
    \ 10;\n  var sTtooltip = d3.select('body').append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5 15px')\n    .style('border','1px\
    \ #fff solid')\n    .style('border-radius','5px')\n    .style('opacity','0');\n\
    ```\n\n13. 这里我们使用 `sBData`。这里的`数据`是不同的。我们将选择一个特定的州并为其绘制条形图。每个独立的州都有一个不同的索引。这个索引将作为函数参数传入。我们还创建一个新的\
    \ `sBDataNew` 数组来存储年份值，以使处理过程更简单。\n\n```javascript\nvar sBData = dataUSPopulation[index];\n\
    var sBDataNew = [];\nvar sBNumYear = 0;\nvar sBState = dataUSPopulation[index][\"\
    Name\"];\n\nfor(k in sBData){\n  if(!Number.isNaN(parseInt(k))){\n    sBNumYear++;\n\
    \    sBDataNew.push({\n      \"year\":k,\n      \"popl\":sBData[k]\n    });\n\
    \    if(sBMaxPop < sBData[k]){\n      sBMaxPop = sBData[k];\n    }\n  }\n};\n\
    ```\n\n14. 接下来，我们将定义条形图的比例尺以及条形的宽度。\n\n```javascript\nvar sBH = d3.scale.linear().domain([0,sBMaxPop])\n\
    \               .range([0,sBHeightBar]);\n\nvar sBY = d3.scale.linear().domain([0,sBMaxPop])\n\
    \               .range([sBHeightBar,0]);\n\nvar sBX = d3.scale.ordinal().domain(d3.range(sBNumYear))\n\
    \               .rangeRoundBands([0,sBWidthBar]);\n\nvar sBWidthOfBar =  Math.floor(sBWidthBar\
    \ / sBNumYear)-1;\n```\n\n15. 如果条形图是新的，即我们第一次点击条形图时，它将开始渲染。`mode new` 是这个小条形图函数的第三个参数。我们将创建一个名为\
    \ `statePlot` 的全局变量，并在 `mode` 内部使用它。\n\n```javascript\nif(mode === \"new\"){\n\
    \n    statePlot.selectAll()\n    .data(sBDataNew)\n    .enter()\n    .append(\"\
    rect\")\n    .attr(\"width\",sBWidthOfBar)\n    .attr(\"height\",function(d,i){\n\
    \        return parseInt(sBH(d[\"pop1\"]));\n    })\n    .attr(\"y\",function(d,i){\n\
    \        return parseInt(sBY(d[\"pop1\"]));\n    })\n    .attr(\"x\",function(d,i){\n\
    \        return sBX(i);\n    })\n}\n```\n\n```javascript\n.style(\"fill\", \"\
    green\").on('mouseover', function(d) {\n    tooltip.transition()\n        .style('opacity',\
    \ 1);\n    tooltip.html(d[\"year\"] + \" : \" + d[\"popl\"])\n        .style('left',\
    \ (d3.event.pageX) + \"px\")\n        .style('top', (d3.event.pageY) + \"px\"\
    );\n    d3.select(this).style('opacity', 0.5);\n})\n.on('mouseout', function()\
    \ {\n    d3.select(this).style('opacity', 1);\n});\n```\n\n16. 在 `else if` 部分，我们编写代码来更新数据。这将产生过渡效果并显示当前州的图表。\n\
    \n```javascript\n} else if (mode === \"update\") {\n    statePlot.selectAll(\"\
    rect\")\n        .data(sBDataNew)\n        .transition()\n        .duration(1000)\n\
    \        .attr(\"width\", sBWidthOfBar)\n        .attr(\"height\", function(d,\
    \ i) {\n            return parseInt(sBH(d[\"popl\"]));\n        })\n        .attr(\"\
    y\", function(d, i) {\n            return parseInt(sBY(d[\"popl\"]));\n      \
    \  })\n        .attr(\"x\", function(d, i) {\n            return sBX(i);\n   \
    \     })\n        .style(\"fill\", \"green\");\n} else {\n    return;\n}\n```\n\
    \n## 15.5. 定义和绘制 KPI 数字\n\n17. 最后一部分是根据我们的用例定义 KPI 数字。这将显示特定州的数据。我们将在 `addBarChart()`\
    \ 函数内添加 KPI。\n\n```javascript\nsvg.selectAll(\"#kpi\")\n    .text(sBData[\"2016\"\
    ])\n    .transition()\n    .duration(1000);\n\nsvg.selectAll(\"#kpiDec\")\n  \
    \  .text(sBState)\n    .transition()\n    .duration(1000);\n```\n\n18. 我们还需要在\
    \ `barFirstTimeRender` 函数中添加 KPI 信息。\n\n```javascript\nsvg.append(\"text\")\n\
    \    .attr(\"id\",\"kpi\")\n    .text(\"State Population\")\n    .attr(\"class\"\
    ,\"KPIMain\")\n    .attr(\"x\",parseInt(widthBar/2 - 200))\n    .attr(\"y\",parseInt(heightBar/2\
    \ - 200));\n\nsvg.append(\"text\")\n    .attr(\"id\",\"kpiDec\")\n    .text(\"\
    State Name\")\n    .attr(\"class\",\"KPIDesc\")\n    .attr(\"x\",parseInt(widthBar/2\
    \ - 200))\n    .attr(\"y\",parseInt(heightBar/2 - 200));\n```\n\n## 15.6. CSS\
    \ 和其他小改动\n\n19. 没有 CSS，地图会看起来不美观。所有的地图和图表都将无法正确对齐。为了解决这个问题，我们需要添加 CSS 样式来修正元素。\n\
    \n没有 CSS 的情况\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_124_0.png)\n\n因此，我们需要改进\
    \ CSS。经过一些试验和错误之后，我们终于有了一个合适的 CSS 来正确显示我们的项目。\n\n```css\n<style type=\"text/css\"\
    >\n/* No style rules here yet */\n\ng#barPlot {\n    transform: translateX(70px)\
    \ !important;\n}\n\n.KPIMain{\n    transform:translate(814px,-82px);\n    font-size:72px;\n\
    \    fill:gray !important;\n    font-weight:bold;\n}\n.KPIDesc{\n    transform:translate(840px,-41px);\n\
    \    font-size:20px;\n    fill:gray !important;\n}\n.map{\n    transform:translate(400px,77px);\n\
    }\n</style>\n```\n\nD3FinalProject.html 的代码可在仓库 [https://c9.io/ajaytech/dataviz](https://c9.io/ajaytech/dataviz)\
    \ 中找到。\n它包含 15000 多行代码，无法在此分享。因此请前往仓库验证您的代码。\n\n## 15.7 输出\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_126_0.png)\n\
    \n您也可以查看我们的 **Learn D3.JS Hands-on And The Simple Way** 视频课程以加速学习：[点击这里](http://example.com)，或使用下方二维码享受\
