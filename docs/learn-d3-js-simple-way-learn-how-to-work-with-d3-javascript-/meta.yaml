  - "[PAGE 30]\n\n# 5. Styling\n\nStyling mostly refers to the CSS part of our D3\
    \ Application. The CSS part will make our application look nice. In addition,\
    \ while we are drawing the graphical elements like bubble chart and bar chart,\
    \ styling also becomes very essential when we differentiate the data points. Styling\
    \ to our D3 can be achieved in three different ways.\n\n+   - Inline\n- External\n\
    - Internal\n\n# Inline\n\nThe rule of styling is to be within the quote (“”).\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_30_0.png)\n\nThis is the Inline style\
    \ rule that we saw in the previous example.\n\n```\nvar svg = d3.select(\"body\"\
    ).append(\"svg\").attr(\"width\",\"300px\")\n    .attr(\"height\",\"100px\").style(\"\
    background\",\"orange\");\n```\n\n# External or Internal Style Sheet\n\nIn this\
    \ scenario, the style is directly added to our element. However, the better approach\
    \ is to go with the external or internal style class. Here we shall be defining\
    \ a class and we will add this class to the element. Later on, if we want to change\
    \ the properties then we don’t have to access all individual elements to perform\
    \ those changes. We simply do the changes in the class and it can be picked up\
    \ by the elements of the assigned class. We will see this in our coding.\n\n#\
    \ Internal Style Rule\n\nThe internal style rule can be defined inside the main\
    \ coding without any external style sheets. The following code is an example for\
    \ internal style sheet.\n\n# Code for Internal Style Rule:\n\n```\n<!DOCTYPE html>\n\
    <meta charset=\"utf-8\">\n<title>Adding attributes and selection to SVG element</title>\n\
    <style>\n```"
- md: "## 6. Geometrical objects\n\nWhile we are creating a graph or chart, the individual\
    \ elements of these graphs or charts are our geometrical objects. It can be a\
    \ rectangle or circle and it can be a line or an arc. Let's see the example to\
    \ make these geometrical objects using D3. In the previous section we saw how\
    \ to add style sheets to our D3. In the same example, we will add our geometrical\
    \ objects to it. In this example we are going to use the same SVG and append the\
    \ rectangle inside it.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_35_0.png)\n\
    \nThe code given below is to draw rectangle of size 100X50 pixels with padding\
    \ x and y as 100 and 20 respectively. The **padding** is used to denote the D3\
    \ to start drawing the object in x and y axis. We also filled the rectangle with\
    \ orange colour.\n\n```\nsvg.append(\"rect\")\n.attr(\"width\", \"100px\")\n.attr(\"\
    height\", \"50px\")\n.attr(\"x\", \"100px\")\n.attr(\"y\", \"20px\")\n.style(\"\
    fill\", \"orange\");\n```\n\nThe code to draw circle is given below. To draw a\
    \ circle we need radius so we defined radius of 100px. The x and y is for the\
    \ same purpose of padding in the rectangle. The colour inside the circle is given\
    \ green to differentiate it from rectangle.\n\n```\nsvg.append(\"circle\")\n.attr(\"\
    r\", \"20px\")\n.attr(\"cx\", \"100px\")\n.attr(\"cy\", \"20px\")\n.style(\"fill\"\
    , \"green\");\n```\n\n# Code for D3GeometricalShape.html\n\n```\n<!DOCTYPE html>\n\
    <meta charset=\"utf-8\">\n<title>Adding attributes and selection to SVG element</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">\n\n<body>\n<script\
    \ src=\"../D3/d3.v3.min.js\"></script>\n<script>\nvar svg = d3.select(\"body\"\
    ).append(\"svg\").attr(\"width\", \"300px\")\n.attr(\"height\", \"100px\").attr(\"\
    class\", \"blueBack\");\n\nsvg.append(\"rect\")\n.attr(\"width\", \"100px\")\n\
    .attr(\"height\", \"50px\")\n.attr(\"x\", \"100px\")\n.attr(\"y\", \"20px\")\n\
    .style(\"fill\", \"orange\");\n\nsvg.append(\"circle\")\n.attr(\"r\", \"20px\"\
    )\n.attr(\"cx\", \"100px\")\n.attr(\"cy\", \"20px\")\n.style(\"fill\", \"green\"\
    );\n</script>\n</body>\n</html>\n```\n\n# Output\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_37_0.png)\n\
    \nIn real projects we use variables instead of hard coding the attribute values\
    \ width, height. In the next section we will see bar chart using rectangles.\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](https://www.udemy.com/) or use the below QR\
    \ code for 50-90% off.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_37_1.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_37_2.png)\n\n## 7. Bringing Data into\
    \ the Picture\n\nWe are going to use data into our project. The data can be JavaScript\
    \ Array, JSON, XML or CSV Data. We can load the data to our D3 application externally.\
    \ In real projects data will be passed to the application using Asynchronous request.\
    \ We will be using some asynchronous services and via AJAX calls we will be getting\
    \ the data to our application. In the previous section we saw geometrical objects.\
    \ Using that we will create bar charts with some data to visualize in D3. There\
    \ will be some new functions that we will see in our application called:\n\n+\
    \   1. data()\n2. enter()\n\nWe will discuss it in our examples.\n\n**Coding**\n\
    \nWe will create a new file named as **D3DataHand.html** and copy the structure\
    \ from the previous examples and remove the other unwanted coding. Now, we are\
    \ going to add some data using a variable called data. After adding data we will\
    \ set the height and width of the total SVG. Also we are appending the SVG inside\
    \ the body. Here you can see as we told in the previous section, instead of hard\
    \ coded value we assigned the variables widthSVG and heightSVG. Also, we gave\
    \ the background style as black colour.\n\n```\nvar data = [10,20,30,40,100];\n\
    var heightSVG = 700;\nvar widthSVG = 700;\nvar svg = d3.select(\"body\")\n   \
    \ .append(\"svg\")\n    .attr(\"width\",widthSVG)\n    .attr(\"height\",heightSVG)\n\
    \    .style(\"background\",\"black\");\n```\n\nAfter initializing the data we\
    \ start adding data and draw our bar chart.\n\n```\nsvg.selectAll()\n.data(data)\n\
    .enter()\n.append(\"rect\")\n.attr(\"height\",function(d,i){\n    return d*100;\n\
    })\n.attr(\"width\",\"20px\")\n.style(\"fill\",\"orange\")\n.attr(\"y\",function(d,i){\n\
    \    return heightSVG -(d)*10 ;\n})\n.attr(\"x\",function(d,i){\n    return i*40;\n\
    });\n```\n\n-   We are adding the data to the program using .data(data).\n-  \
    \ After that, we use .enter() function. It is used to perform same actions to\
    \ all data after enter(). It is similar to loop.\n\nThen we will add rectangle.\
    \ This rectangle width is constant but the height is dependent upon the data input.\
    \ To make the height depend upon the data we add the function (d,i) where ‘d’\
    \ is the data and ‘i’ is the index. The width of the bar is constant because we\
    \ are using bar chart here. So we gave the constant 20px. For the y value the\
    \ function d and i are used to draw the rectangle according to the data. The returnheightSVG\
    \ – (d)*10; is used to return the height of SVG according to the data. The value\
    \ 10 is used for scaling purpose to enlarge or decrease the size of the rectangle.\n\
    \n# Code for D3DataHand.html\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\"\
    >\n<title>Adding attributes and selection to SVG element</title>\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\">\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\nvar data=[10,20,30,40,100];   //Data variable Array\nvar\
    \ heightSVG = 700;          //Maximum height of SVG\nvar widthSVG = 700;     \
    \      //Maximum width of SVG\nvar svg = d3.select(\"body\")\n    .append(\"svg\"\
    )\n    //As we told in previous example we removed the hard coded value and given\
    \ variables widthSVG and heightSVG\n    .attr(\"width\",widthSVG)\n    .attr(\"\
    height\",heightSVG)\n    .style(\"background\",\"black\");   //Black background\n\
    \nsvg.selectAll()\n.data(data) //Passing the data here\n.enter() //This will do\
    \ all the things after this code for all the data points\n.append(\"rect\") //Append\
    \ rectangle\n    .attr(\"height\",function(d,i){ //Adding height using function\
    \ depending upon the data.\n        return d*100;\n    })\n    .attr(\"width\"\
    ,\"20px\")//Fixed width because of bar chart\n    .style(\"fill\",\"orange\")\n\
    \    .attr(\"y\",function(d,i){\n        return heightSVG -(d)*10 ; //Subtracting\
    \ the data from total heightSVG. 10 will increase the scale of the bar\n    })\n\
    \    .attr(\"x\",function(d,i){\n        return i*40;\n    });\n</script>\n</body>\n\
    </html>\n```\n\n# Output\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_41_0.png)\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](https://www.udemy.com/) or use the below QR\
    \ code for 50-90% off."
  mdcn: "\n## 6. 几何对象\n\n在创建图表时，图表中的各个元素就是我们的几何对象。它可以是矩形或圆形，也可以是线段或弧线。让我们通过示例来看看如何使用D3来创建这些几何对象。在上一节中，我们了解了如何为D3添加样式表。在同一个示例中，我们将添加几何对象。在这个例子中，我们将使用同一个SVG并在其中附加一个矩形。\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_35_0.png)\n\n下面的代码用于绘制一个尺寸为100X50像素的矩形，x和y方向的**内边距**分别为100和20。**内边距**用于告知D3在x轴和y轴上从何处开始绘制对象。我们还用橙色填充了矩形。\n\
    \n```\nsvg.append(\"rect\")\n.attr(\"width\", \"100px\")\n.attr(\"height\", \"\
    50px\")\n.attr(\"x\", \"100px\")\n.attr(\"y\", \"20px\")\n.style(\"fill\", \"\
    orange\");\n```\n\n下面的代码用于绘制圆形。绘制圆形需要半径，因此我们定义了100px的半径。x和y与矩形中的内边距作用相同。圆形内部的颜色设为绿色，以与矩形区分。\n\
    \n```\nsvg.append(\"circle\")\n.attr(\"r\", \"20px\")\n.attr(\"cx\", \"100px\"\
    )\n.attr(\"cy\", \"20px\")\n.style(\"fill\", \"green\");\n```\n\n# D3GeometricalShape.html\
    \ 的代码\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes\
    \ and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"style.css\">\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\nvar svg = d3.select(\"body\").append(\"svg\").attr(\"width\", \"300px\"\
    )\n.attr(\"height\", \"100px\").attr(\"class\", \"blueBack\");\n\nsvg.append(\"\
    rect\")\n.attr(\"width\", \"100px\")\n.attr(\"height\", \"50px\")\n.attr(\"x\"\
    , \"100px\")\n.attr(\"y\", \"20px\")\n.style(\"fill\", \"orange\");\n\nsvg.append(\"\
    circle\")\n.attr(\"r\", \"20px\")\n.attr(\"cx\", \"100px\")\n.attr(\"cy\", \"\
    20px\")\n.style(\"fill\", \"green\");\n</script>\n</body>\n</html>\n```\n\n# 输出\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_37_0.png)\n\n在实际项目中，我们通常使用变量而不是硬编码属性值如宽度和高度。在下一节中，我们将看到使用矩形制作的条形图。\n\
    \n你也可以查看我们的**动手学习D3.JS的简单方法**视频课程以加速学习：[点击这里](https://www.udemy.com/)，或使用下面的二维码享受50-90%的折扣。\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_37_1.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_37_2.png)\n\
    \n## 7. 引入数据\n\n我们将在项目中引入数据。数据可以是JavaScript数组、JSON、XML或CSV数据。我们可以将数据外部加载到D3应用中。在实际项目中，数据会通过异步请求传递给应用。我们将使用一些异步服务，并通过AJAX调用将数据获取到我们的应用中。在上一节中，我们学习了几何对象。我们将使用这些对象，结合一些数据，在D3中创建条形图以进行可视化。我们将在应用中看到一些新的函数，称为：\n\
    \n+   1. data()\n2. enter()\n\n我们将在示例中讨论它们。\n\n**编码**\n\n我们将创建一个名为**D3DataHand.html**的新文件，并从之前的示例中复制结构，移除其他不需要的代码。现在，我们将使用一个名为data的变量添加一些数据。添加数据后，我们将设置整个SVG的高度和宽度。同时，我们将SVG附加到body内部。你可以看到，正如我们在上一节所说的，我们没有使用硬编码的值，而是赋给了变量widthSVG和heightSVG。另外，我们将背景样式设置为黑色。\n\
    \n```\nvar data = [10,20,30,40,100];\nvar heightSVG = 700;\nvar widthSVG = 700;\n\
    var svg = d3.select(\"body\")\n    .append(\"svg\")\n    .attr(\"width\",widthSVG)\n\
    \    .attr(\"height\",heightSVG)\n    .style(\"background\",\"black\");\n```\n\
    \n初始化数据后，我们开始添加数据并绘制条形图。\n\n```\nsvg.selectAll()\n.data(data)\n.enter()\n.append(\"\
    rect\")\n.attr(\"height\",function(d,i){\n    return d*100;\n})\n.attr(\"width\"\
    ,\"20px\")\n.style(\"fill\",\"orange\")\n.attr(\"y\",function(d,i){\n    return\
    \ heightSVG -(d)*10 ;\n})\n.attr(\"x\",function(d,i){\n    return i*40;\n});\n\
    ```\n\n-   我们使用.data(data)将数据添加到程序中。\n-   之后，我们使用.enter()函数。它用于对enter()之后的所有数据执行相同的操作。它类似于循环。\n\
    \n然后我们将添加矩形。这个矩形的宽度是固定的，但高度取决于输入数据。为了让高度依赖于数据，我们添加了函数(d,i)，其中‘d’是数据，‘i’是索引。条形的宽度是固定的，因为这里我们使用的是条形图。所以我们给了一个常量20px。对于y值，函数d和i用于根据数据绘制矩形。返回值heightSVG\
    \ – (d)*10; 用于根据数据返回SVG的高度。值10用于缩放目的，以扩大或缩小矩形的尺寸。\n\n# D3DataHand.html 的代码\n\n\
    ```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    >\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\nvar data=[10,20,30,40,100];\
    \   //数据变量 数组\nvar heightSVG = 700;          //SVG的最大高度\nvar widthSVG = 700; \
    \          //SVG的最大宽度\nvar svg = d3.select(\"body\")\n    .append(\"svg\")\n \
    \   //正如我们在上一个示例中所说，我们移除了硬编码的值，而是使用了变量widthSVG和heightSVG\n    .attr(\"width\"\
    ,widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"background\",\"black\"\
    );   //黑色背景\n\nsvg.selectAll()\n.data(data) //在此处传递数据\n.enter() //这将对之后的所有数据点执行此代码之后的所有操作\n\
    .append(\"rect\") //附加矩形\n    .attr(\"height\",function(d,i){ //使用函数根据数据添加高度。\n\
    \        return d*100;\n    })\n    .attr(\"width\",\"20px\")//由于是条形图，宽度固定\n \
    \   .style(\"fill\",\"orange\")\n    .attr(\"y\",function(d,i){\n        return\
    \ heightSVG -(d)*10 ; //从总高度heightSVG中减去数据值。10用于增加条形的缩放比例\n    })\n    .attr(\"\
    x\",function(d,i){\n        return i*40;\n    });\n</script>\n</body>\n</html>\n\
    ```\n\n# 输出\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_41_0.png)\n\n你也可以查看我们的**动手学习D3.JS的简单方法**视频课程以加速学习：[点击这里](https://www.udemy.com/)，或使用下面的二维码享受50-90%的折扣。\n"
