    # 3. SVG Elements


    SVG is a short form for Scalable Vector Graphics. Similar to PNG or JPEG files,
    SVG is used to store XML based vector image formats. A normal bitmap image is
    composed of a fixed set of pixels. A vector image, on the other hand, is composed
    of fixed set of shapes like circles, line or text. We can see that the image represented
    in .jpeg, .png or .gif files are pixilated or distorted. However, in vector images
    they are set of shapes and we would not see any quality compromise while zooming
    on the image.


    ![](img/41b6c8103372ba4d3a912e2c0a922787_16_0.png)


    # Examples


    Let us see some simple examples of using SVG elements in our HTML5 page. We are
    going to use the Cloud9 IDE. We do majority of our developments in Cloud9 IDE.
    The files are accessible for our users 24x7.


    Link for the repositories: [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)


    People who are not familiar with this IDE can read the document on getting started
    in the given link.


    Getting Started: [https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)


    Let us **START CODING!**'
- md: "## 3.1. Simple Example for SVG\n\nIn this example we are going to create a\
    \ bar using SVG elements. To create a SVG, we need a `<svg>` tag. In this tag,\
    \ we added the width, height and the background colours of the rectangle bar.\
    \ If we add the below code before the body tag and run the code we will get an\
    \ orange colored rectangle with width of 300px and height of 100px.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_18_0.png)\n\
    \n### Code for SVG.html\n\n```html\n<!DOCTYPE html>\n<title>Create a SVG element\
    \ with HTML and D3</title>\n<meta charset=\"utf-8\">\n<svg width=\"300px\" height=\"\
    100px\" style=\"background:orange\">\n</svg>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var svg = d3.select(\"body\").append(\"svg\").style(\"\
    background\",\"green\");\n</script>\n<body>\n</body>\n</html>\n```\n\n### Result:\n\
    \nThis is our **SVG** element. In future sections we are going to use it with\
    \ D3.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_18_1.png)\n\n## 3.2 SVG with\
    \ D3\n\nIn this example we are going to use SVG element with D3. To do that, we\
    \ need to use `d3.select(\"body\").append(\"svg\")`. The final hierarchy of our\
    \ webpage will have a HTML element and inside that we will have a body and this\
    \ body will contain the SVG element.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_20_0.png)\n\
    \nLet’s try this out in our Cloud9 IDE. We already created a simple SVG element\
    \ inside our HTML page. Now we are going to use D3 to perform the same activity.\
    \ To use D3 we need to add D3 libraries before the body tag. To do that we need\
    \ to add the link to that library inside the script tag.\n\n```html\n<script src=\"\
    ../D3/d3.v3.min.js\"></script>\n<script>\n```\n\nThe `\"../D3/d3.v3.min.js\"`\
    \ is the relative path for D3 library files. To verify this, run the file and\
    \ go to console by right click on the page and select inspect element. Then, enter\
    \ D3 and hit enter. If everything is perfect, then it does not show any errors\
    \ and our path is correct.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_20_1.png)\n\
    \nIf there is some error in defining the path, then it shows like this in the\
    \ console.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_21_0.png)\n\nWhen we are\
    \ working in a project we will always use the relative path or a path from a content\
    \ delivery network CDN. If we open the D3 library file then we will see a very\
    \ big file inside it. This is the library file that we are going to use in our\
    \ application. D3 is JavaScript based so we have a script tag and we write the\
    \ JavaScript code inside the Script tag. The first example we are going to create\
    \ is an SVG using D3.\n\n### Code for SVG with D3:\n\n```html\n<!DOCTYPE html>\n\
    <title>Create a SVG element with HTML and D3</title>\n<meta charset=\"utf-8\"\
    >\n<svg width=\"300px\" height=\"100px\" style=\"background:orange\">\n</svg>\n\
    \n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n  /*Creating a SVG inside\
    \ the body and added style as green to make the SVG visible*/\n  var svg = d3.select(\"\
    body\").append(\"svg\").style(\"background\", \"green\");\n</script>\n<body>\n\
    </body>\n</html>\n```\n\n### Output:\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_22_0.png)\n\
    \nThe first orange colored rectangle is without D3 and the second rectangle box\
    \ is rendered by D3 syntax. This is a simple example using SVG. We shall see a\
    \ few more examples of graphic elements and its variations in coming sections.\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](http://www.tutorialspoint.com) or use the below\
    \ QR code for 50-90% off.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_22_1.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_22_2.png)\n\n## 4. Selecting elements\
    \ and operating\n\nSimilar to JQuery, if we like to hold on an object to make\
    \ some changes or read some values we need to use select statement. D3 provides\
    \ two top level elements for selecting elements **`select`** and **`selectAll`**.\
    \ Let’s start with select. In this example, we are going to have a simple HTML\
    \ page that contains a body and this body will have a SVG element inside it. This\
    \ SVG element will be containing some attribute values like width or height. These\
    \ properties are actually called SVG properties.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_24_0.png)\n\
    \n### 4.1 Coding\n\nYou have access to the repositories of these examples. To\
    \ access it go to the link [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_25_0.png)\n\nWe see the select and\
    \ selectAll properties in this example. If we use the select property, it selects\
    \ the specific elements that are mentioned. The first orange colour rectangle\
    \ is the example for select property. The Dinosaurs, Elephant and Cat are used\
    \ with selectAll. Here you can see that Dinosaur and Elephant are of green colour\
    \ because in the div tag with id and class attributes we defined the background\
    \ colour as green.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_25_1.png)\n\n-\
    \   1. `d3.select(\"body\")` is a jQuery selector statement that selects the contents\
    \ inside body. The attributes are also defined here with style as orange background.\n\
    -   2. Div element with id demo and another div element with class as ‘demoClass’\
    \ are used to group the specified class or id.\n-   3. The ‘SelectAll’ will select\
    \ the entire SVG inside div and the ‘Select’ selects only the particular class\
    \ or id that is specified inside the function.\n\n### Code for D3SVG.html\n\n\
    ```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and\
    \ selection to SVG element</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"\
    width\", \"300px\")\n    .attr(\"height\", \"100px\").style(\"background\", \"\
    orange\");\n</script>\n<div id=\"demo\">Dinosaurs</div>\n<div class=\"demoClass\"\
    >Elephant</div>\n<div>Cat</div>\n<script>\nd3.selectAll(\"div\").style(\"background\"\
    , \"orange\");\nd3.select(\"#demo\").style(\"background\", \"green\");\nd3.select(\"\
    .demoClass\").style(\"background\", \"green\");\n</script>\n</body>\n</html>\n\
    ```\n\n### Output\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_26_0.png)\n\nIf\
    \ we remove the id and class for the Dinosaur and Elephant and the actual result\
    \ will appear as shown below.\n\n```html\n<title>Adding attributes and selection\
    \ to SVG</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\
    \    var svg = d3.select(\"body\").append(\"svg\")\n              .attr(\"height\"\
    , \"100px\").style(\"background\", \"grey\");\n</script>\n<div>Dinosaurs</div>\n\
    <div>Elephant</div>\n<div>Cat</div>\n<script>\n    d3.selectAll(\"div\").style(\"\
    background\", \"orange\");\n\n    d3.select(\"#demo\").style(\"background\", \"\
    green\");\n    d3.select(\".demoClass\").style(\"background\", \"blue\");\n</script>\n\
    ```\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_27_0.png)\n\nDinosaurs\nElephant\n\
    Cat\n\nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video\
    \ course for accelerated learning: [here](here) or use the below QR code for 50-90%\
    \ off.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_28_0.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_28_1.png)\n\
    \n## 5. Styling\n\nStyling mostly refers to the CSS part of our D3 Application.\
    \ The CSS part will make our application look nice. In addition, while we are\
    \ drawing the graphical elements like bubble chart and bar chart, styling also\
    \ becomes very essential when we differentiate the data points. Styling to our\
    \ D3 can be achieved in three different ways.\n\n-   Inline\n-   External\n- \
    \  Internal\n\n### Inline\n\nThe rule of styling is to be within the quote (“”).\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_30_0.png)\n\nThis is the Inline style\
    \ rule that we saw in the previous example.\n\n```javascript\nvar svg = d3.select(\"\
    body\").append(\"svg\").attr(\"width\",\"300px\")\n    .attr(\"height\",\"100px\"\
    ).style(\"background\",\"orange\");\n```\n\n### External or Internal Style Sheet\n\
    \nIn this scenario, the style is directly added to our element. However, the better\
    \ approach is to go with the external or internal style class. Here we shall be\
    \ defining a class and we will add this class to the element. Later on, if we\
    \ want to change the properties then we don’t have to access all individual elements\
    \ to perform those changes. We simply do the changes in the class and it can be\
    \ picked up by the elements of the assigned class. We will see this in our coding.\n\
    \n### Internal Style Rule\n\nThe internal style rule can be defined inside the\
    \ main coding without any external style sheets. The following code is an example\
    \ for internal style sheet.\n\n### Code for Internal Style Rule:\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<style>\n```"
  mdcn: "\n## 3.1. SVG 简单示例\n\n在这个示例中，我们将使用 SVG 元素创建一个条形。要创建一个 SVG，我们需要一个 `<svg>`\
