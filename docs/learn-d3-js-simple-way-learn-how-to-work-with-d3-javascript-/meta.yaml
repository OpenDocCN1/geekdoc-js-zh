  md: "# 10. Events\n\nEvents are used to perform some action while we move the mouse\
    \ over an object. For example, in the bar chart we created previously if we move\
    \ the mouse over the bar then a small pop up will appear on it to display the\
    \ value of the bar. Similarly when the bars are being generated then there will\
    \ be some transition effects. These are done by using events. To create an event\
    \ we need an on function. In this event we are using mouseover event. So we need\
    \ to give the value as mouseover event inside the on function. The second parameter\
    \ function(d) used to call the function during the function is triggered. To add\
    \ a transition property during the bar is generated we need to use the function\
    \ transition function with parameters duration of animation and its attributes\
    \ to be changed in this transition. Example, while the bar start to generate it\
    \ will generate from the bottom or sliding over from the side. These will be done\
    \ by the attributes. Let’s go to our cloud9 IDE to use events in our bar chart.\n\
    \nIn last section we created the bar chart. Now we are going to use events to\
    \ that bar chart.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_65_0.png)\n\n1.\
    \ We need a tooltip to display the value of the bar. So we create a box and add\
    \ a tooltip. Then we select the body. We append a div element. We need to add\
    \ styling to the tooltip. We add the position as absolute and background as white\
    \ colour. Also we added padding and border properties to the tooltip. The opacity\
    \ we initially give 0 because we are going to hide this one for now. We can change\
    \ it later by increasing the value.\n\n```\nvar tooltip = d3.select('body')\n\
    \    .append('div')\n    .style('position', 'absolute')\n    .style('background',\
    \ '#fff')\n    .style('padding', '5px 15px')\n    .style('border', '1px #fff solid')\n\
    \    .style('opacity', '0');\n```\n\n2. We are going to add on function for mouseover\
    \ event. The function(d) will pull our"
  merge: -1
