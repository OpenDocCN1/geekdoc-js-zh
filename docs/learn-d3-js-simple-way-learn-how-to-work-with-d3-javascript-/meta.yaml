    \n    var xAxis = d3.svg.axis()\n    .scale(x)\n    .orient('bottom')\n    .ticks(5);\n\
    \n    var svg = d3.select(\"body\")\n    .append(\"svg\")\n    .attr(\"width\"\
    ,widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"transform\",\"translate(\"\
    +paddingChart+\"px,\"+paddingChart+\"px)\")\n    .style(\"background\",\"black\"\
    );\n\n    var tooltip = d3.select('body')\n    .append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5px 15px')\n    .style('border',\
    \ '1px #fff solid')\n    .style('opacity', '0');\n\n    svg.append(\"g\")\n  \
    \  .call(yAxis)\n    .attr(\"transform\", \"translate(\"+axisMargin+\",0)\")\n\
    \    .style(\"stroke\", \"#fff\");\n\n    svg.append(\"g\")\n    .call(xAxis)\n\
    \    .attr(\"transform\", \"translate(0,\"+(heightSVG-axisMargin)+\")\")\n   \
    \ .style(\"stroke\", \"#fff\");\n\n    svg.append(\"g\")\n    .attr(\"class\"\
    , \"rectangle\")\n    .selectAll()\n    .data(data)\n    .enter()\n    .append(\"\
    rect\")\n    .attr(\"height\", function(d,i){\n        return 0;\n    })\n   \
    \ .attr(\"width\", \"20px\")\n    .style(\"fill\", \"orange\")\n    .attr(\"y\"\
    , function(d,i){\n        return heightSVG ;\n    })\n    .attr(\"x\", function(d,i){\n\
    \        return x(i);\n    }).on('mouseover', function(d){\n        tooltip.transition().style('opacity',\
    \ 1);\n        tooltip.html(d)\n            .style('left', (d3.event.pageX) +\
    \ 'px')\n            .style('top', (d3.event.pageY) + 'px');\n        d3.select(this).style('opacity',\
