  md: "# 7. Bringing Data into the Picture\n\nWe are going to use data into our project.\
    \ The data can be JavaScript Array, JSON, XML or CSV Data. We can load the data\
    \ to our D3 application externally. In real projects data will be passed to the\
    \ application using Asynchronous request. We will be using some asynchronous services\
    \ and via AJAX calls we will be getting the data to our application. In the previous\
    \ section we saw geometrical objects. Using that we will create bar charts with\
    \ some data to visualize in D3. There will be some new functions that we will\
    \ see in our application called:\n\n+   1. data()\n2. enter()\n\nWe will discuss\
    \ it in our examples.\n\n**Coding**\n\nWe will create a new file named as **D3DataHand.html**\
    \ and copy the structure from the previous examples and remove the other unwanted\
    \ coding. Now, we are going to add some data using a variable called data. After\
    \ adding data we will set the height and width of the total SVG. Also we are appending\
    \ the SVG inside the body. Here you can see as we told in the previous section,\
    \ instead of hard coded value we assigned the variables widthSVG and heightSVG.\
    \ Also, we gave the background style as black colour.\n\n```\nvar data = [10,20,30,40,100];\n\
    var heightSVG = 700;\nvar widthSVG = 700;\nvar svg = d3.select(\"body\")\n   \
    \ .append(\"svg\")\n    .attr(\"width\",widthSVG)\n    .attr(\"height\",heightSVG)\n\
    \    .style(\"background\",\"black\");\n```\n\nAfter initializing the data we\
    \ start adding data and draw our bar chart.\n\n```\nsvg.selectAll()\n.data(data)\n\
    .enter()\n.append(\"rect\")\n.attr(\"height\",function(d,i){\n    return d*100;\n\
    })\n.attr(\"width\",\"20px\")\n.style(\"fill\",\"orange\")\n.attr(\"y\",function(d,i){\n\
    \    return heightSVG -(d)*10 ;\n})\n.attr(\"x\",function(d,i){\n    return i*40;\n\
    });\n```\n\n+   - We are adding the data to the program using .data(data)."
