  md: "+   - After that, we use .enter() function. It is used to perform same actions\
    \ to all data after enter(). It is similar to loop.\n\nThen we will add rectangle.\
    \ This rectangle width is constant but the height is dependent upon the data input.\
    \ To make the height depend upon the data we add the function (d,i) where ‘d’\
    \ is the data and ‘i’ is the index. The width of the bar is constant because we\
    \ are using bar chart here. So we gave the constant 20px. For the y value the\
    \ function d and i are used to draw the rectangle according to the data. The returnheightSVG\
    \ – (d)*10; is used to return the height of SVG according to the data. The value\
    \ 10 is used for scaling purpose to enlarge or decrease the size of the rectangle.\n\
    \n# Code for D3DataHand.html\n\n```\n<!DOCTYPE html>\n<meta charset=“utf-8”>\n\
