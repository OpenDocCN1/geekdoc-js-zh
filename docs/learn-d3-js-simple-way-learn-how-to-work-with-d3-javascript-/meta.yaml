  md: "# # 3.1. Simple Example for SVG\n\nIn this example we are going to create a\
    \ bar using SVG elements. To create a SVG, we need a <svg> tag. In this tag, we\
    \ added the width, height and the background colours of the rectangle bar. If\
    \ we add the below code before the body tag and run the code we will get an orange\
    \ colored rectangle with width of 300px and height of 100px.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_18_0.png)\n\
    \n# ## Code for SVG.html\n\n```\n<!DOCTYPE html>\n<title>Create a SVG element\
    \ with HTML and D3</title>\n<meta charset=“utf-8 “>\n<svg width=“300px” height=“100px”\
    \ style=“background:orange”>\n</svg>\n<script src=“../D3/d3.v3.min.js”></script>\n\
    <script>\n    var svg = d3.select(“body”).append(“svg”).style(“background”,“green”);\n\
    </script>\n<body>\n</body>\n</html>\n```\n\n# ## Result:\n\nThis is our **SVG**\
    \ element. In future sections we are going to use it with D3.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_18_1.png)"
