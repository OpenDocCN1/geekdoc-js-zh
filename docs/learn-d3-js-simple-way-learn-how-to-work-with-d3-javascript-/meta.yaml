  md: '# 4. Selecting elements and operating


    Similar to JQuery, if we like to hold on an object to make some changes or read
    some values we need to use select statement. D3 provides two top level elements
    for selecting elements **`select`** and **`selectAll`**. Let’s start with select.
    In this example, we are going to have a simple HTML page that contains a body
    and this body will have a SVG element inside it. This SVG element will be containing
    some attribute values like width or height. These properties are actually called
    SVG properties.


    ![](img/41b6c8103372ba4d3a912e2c0a922787_24_0.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # 4.1 Coding


    You have access to the repositories of these examples. To access it go to the
    link [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)


    ![](img/41b6c8103372ba4d3a912e2c0a922787_25_0.png)


    We see the select and selectAll properties in this example. If we use the select
    property, it selects the specific elements that are mentioned. The first orange
    colour rectangle is the example for select property. The Dinosaurs, Elephant and
    Cat are used with selectAll. Here you can see that Dinosaur and Elephant are of
    green colour because in the div tag with id and class attributes we defined the
    background colour as green.


    ![](img/41b6c8103372ba4d3a912e2c0a922787_25_1.png)


    +   1. d3.select(“body”) is a jQuery selector statement that selects the contents
    inside body. The attributes are also defined here with style as orange background.

    2. Div element with id demo and another div element with class as ‘demoClass’
    are used to group the specified class or id.

    3. The ‘SelectAll’ will select the entire SVG inside div and the ‘Select’ selects
    only the particular class or id that is specified inside the function.


    **Code for D3SVG.html**


    ```

    <!DOCTYPE html>

    <meta charset=“utf-8”>

    <title>Adding attributes and selection to SVG element</title>

    ```'
