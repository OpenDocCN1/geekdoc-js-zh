- img_proc: true
  md: '# 15. Final Project


    In this section we are going to start working in our final project and we will
    see how we will use D3 in real project. In this we will work in a data visualization
    project and **visualizing data is one of the hot skill sets in the market place
    right now**. If you want to learn more about data visualization then we will highly
    recommend to check our ''**Learn Data Visualization in 7 simple steps**'' course
    in Udemy. This will provide a very firm basic understanding of how to work in
    a data visualization project. In the next section we are going to see the use
    case to work in D3.


    Before starting any data visualization project we should always have clear purpose
    statement/requirements. Let’s look into the purpose statement that we have here.


    ![](img/41b6c8103372ba4d3a912e2c0a922787_111_0.png)


    According to this purpose statement we have to build a dashboard that will be
    utilized by **people who monitors population growth** of different states of US,
    so they can **allocate resources to states** based upon **current population and
    population growth of these states**.


    Here we can see the three main parts


    +   - Who is the audience?

    - What is the scope?

    - Outcome


    **Audience**: People who monitors population. We are going to create visualization
    project for them using D3.


    **Scope and Outcome**: Using this visualization they will be allocating the resources
    to those states according to this.


    Once we are clear on what we are going to do in a data visualization project then
    we will go into the 7 steps of data visualization project. Initial stage we will
    acquire the data and times after we will spend time in parsing the data and preparing
    it for usage.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '![](img/41b6c8103372ba4d3a912e2c0a922787_112_0.png)


    This is the wireframe based upon our requirement that we already created in moqups
    website. We have skipped how to acquire data and how to work with data, filtering
    and creating this wireframe because, we covered these 7 steps in our other courses
    of data visualization. This course we are covering development oriented. In the
    above picture we can see that the bar chart with population of all the state and
    we also have a USA map. The KPI field shows the data of the population of current
    state.


    There is also a small bar chart above our map that will show the variation of
    population for that particular years will be mentioned. This is an interactive
    D3 map that if we press any state on the map and the KPI values and Small bar
    chart will change corresponding to the data.'
