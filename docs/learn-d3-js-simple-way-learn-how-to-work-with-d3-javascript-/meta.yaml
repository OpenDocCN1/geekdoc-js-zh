- md: "Learn D3.JS Hands-on And The Simple Way\n\nUIS Community Network · SAP Experts\
    \ · SAP Services · SAP Consulting, SAP Education\n\nLearn how to work with D3\
    \ Javascript libraries in step-by-step and most simple manner with lots of hands-on\
    \ examples\n\n⭐⭐⭐⭐⭐ 4.4 (10 ratings)\n\n35 lectures · 7 hours · All Levels\n\n\
    ## 8. Loading Data from external file\n\nLoading data from external file may be\
    \ in CSV, JSON or TSV formats. We are having a simple D3 function that will load\
    \ data from these external files. The function is:\n\n```\nd3.csv(“filePath”,function(data){\n\
    \    })\n```\n\nThe first parameter is path of the filename and second parameter\
    \ is the function that will be executed once the data is loaded from the file.\
    \ Let’s start coding for a better understanding this example. In previous example\
    \ we use data internally. We can use data externally by doing some simple changes\
    \ in the code.\n\nCreate a new file **D3DataLoad.html** and copy the code from\
    \ previous example. Remove the values we defined previously. In addition, we need\
    \ to create one more file called **data.csv**. It is used to store our external\
    \ data. We add some data into that as 10, 20, 30, 40, 20, 10, 100.\n\nLet’s create\
    \ some bar chart using these values. Now we are going to use the d3.csv(“data.csv”,function(d){})\
    \ function to add the csv file. We also add a function for error in case of any\
    \ issue in or file then it will clarify it in the browser console. These are changes\
    \ we did from previous example.\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\"\
    >\n<title>Adding attributes and selection to SVG element</title>\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\"></link>\n<body>\n<script src=\"\
    ../D3/d3.v3.min.js\"></script>\n<script>\n\nvar heightSVG = 700;\nvar widthSVG\
    \ = 700;\nd3.csv(\"data.csv\",function(d){\n    return d.value;\n},function(error,data){\n\
    \n    if(error)throw error;\n           d3.select(\"body\")\n          .append(\"\
    svg\")\n         .attr(\"width\",widthSVG)\n         .attr(\"height\",heightSVG)\n\
    \        .style(\"background\",\"black\");\n```\n\nNow save and run the file.\n\
    \nWhen we are not getting any output, it means our program has errors. You can\
    \ identify in the browser console checking any error of the program. Go to browser\
    \ console by right click on the browser page and hit ‘Inspect’. It opens a console\
    \ window. At the right hand corner it shows the errors. Here, you can identify\
    \ that it is showing svg is not defined. Following this input, we check the program\
    \ and add the missing SVG.\n\nFix the error and run the file.\n\n### Code for\
    \ data.csv\n\n```\n“value”\n10\n20\n30\n40\n20\n10\n```\n\n### Code for D3DataLoad.html\n\
    \n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and\
    \ selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n\n    var heightSVG = 700;\n    var widthSVG = 700;\n    d3.csv(\"data.csv\"\
    ,function(d){\n    return d.value;\n    },function(error,data){\n\n    if(error)throw\
    \ error;\n    var svg= d3.select(\"body\")\n    .append(\"svg\")\n    .attr(\"\
    width\",widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"background\"\
    ,\"black\");\n\n    svg.selectAll()\n    .data(data)\n    .enter()\n    .append(\"\
    rect\")\n    .attr(\"height\",function(d,i){\n    return d*100;\n})\n.attr(\"\
    width\", \"20px\")\n.style(\"fill\", \"orange\")\n.attr(\"y\", function(d, i)\
    \ {\n    return heightSVG - (d) * 10;\n})\n.attr(\"x\", function(d, i) {\n   \
    \ return i * 40;\n});\n});\n});\n```\n\n```\n</script>\n</body>\n</html>\n```\n\
    \n### Output for the program\n\nThe output shows the bar chart corresponding data.csv\
    \ file. In this output we can note that the final value is not fitting inside\
    \ our SVG. To fix that, we will use scales. You can see this example in next section.\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](https://www.google.com) or use the below QR\
    \ code for 50-90% off.\n\n## 9. Scale and Axis\n\nIn the previous example we saw\
    \ that our last rectangle bar is out of our SVG. To rectify this error we are\
    \ using scales in our D3.\n\nGenerally we have an input and we have to map that\
    \ input to the desired output. The output can be width of the canvas or the height\
    \ of the canvas. Input can be our data points or how many numbers of data points\
    \ we have to map. In D3 the input is called **domain** and the output is called\
    \ **range**. So, we have to map the domain into range. For example, let’s assume\
    \ we have three inputs 1, 2, 3 and we have to map these three inputs with six\
    \ alphabets namely a, b, c, d, e, f. One simple approach we will do here is we\
    \ can assign each input value to two alphabets. That is 1 is having a and b, 2\
    \ is having c and d, 3 is having e and f. This is the simple example for how the\
    \ mapping can be done. There can be multiple approaches like value based approach.\
    \ Example 1 will have a, 2 will have b and c, 3 will have d, e, f.\n\nIn D3 we\
    \ have two main types of scaling called **Linear** scaling and **Ordinal** Scaling.\n\
    \n**Linear Scaling** - It is for continuous input domains, such as numbers.\n\n\
    **Ordinal Scaling** - It is for discrete domain, such as a set of names or categories.\n\
