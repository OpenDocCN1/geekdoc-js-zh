    \  var sBMaxPop = 0;\n  var sBWidthBar = 400;\n  var sBHeightBar = 250;\n  var\
    \ sBPaddingText = 10;\n  var sTtooltip = d3.select('body').append('div')\n   \
    \ .style('position','absolute')\n    .style('background','#fff')\n    .style('padding','5\
