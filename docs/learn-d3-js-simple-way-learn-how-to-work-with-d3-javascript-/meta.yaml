  md: "# 9.1. Linear Scale\n\nThese scales are used for continuous input domains,\
    \ such as numbers. For example, if the input data set is [7, 10, 6], the entire\
    \ canvas height is 100. We need to plot the graph within this 100 value. To plot\
    \ the graph according to the canvas we need the output data set as 70, 100 and\
    \ 60 units respectively for our input data sets.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_52_0.png)\n\
    \n**Syntax**\n\n**Linear Scale**\n\n```\nvar y = d3.scale.linear().domain([0,d3.max(data)])\
    \   /* Min and Max value of data */\n    .range([0, heightSVG]);       /* Specify\
    \ the range to crate chart in specified area\n```"
  merge: -1
  pgno: 52
- img_proc: true
  md: "# 9.2. Ordinal Scale\n\n```\nvar x = d3.scale.ordinal().domain(d3.range(data.length))\
    \ /* Specify the no. of data points\n.rangeRoundBands([0,widthSVG]); /* Creates\
    \ range bands depending on widthSVG\n```\n\nWe will use this scaling in example\
    \ that we saw previously to resolve the issue of bar extending outside SVG. Create\
    \ a new file (D3Scale.html) and copy the code into it. The change we need to do\
    \ is adding a scale to it. For y axis we use the linear scale.\n\nTo use this\
    \ x scale we need to replace the return value as return x(i); Here we are passing\
    \ the index value that is going to be iterated through. It will return the corresponding\
    \ x location that the bar should be drawn. After these changes made we run the\
    \ application.\n\nCoding\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n\n    var data=[10,20,30,40,100];\n    var heightSVG = 700;\n\
    \    var widthSVG = 700;\n\n    var y = d3.scale.linear().domain([0,d3.max(data)])\n\
    \    .range([0, heightSVG]); /* Y scale */\n\n    var x = d3.scale.ordinal().domain(d3.range(data.length))\n\
    \    .rangeRoundBands([0,widthSVG]);  /* X Scale */\n\n    var svg = d3.select(\"\
    body\")\n    .append(\"svg\")\n```"
