  md: '# 2. LEARNING PATH OF THIS BOOK


    ![](img/41b6c8103372ba4d3a912e2c0a922787_13_0.png)


    +   - Initially we will start with SVG (Scalable Vector Graphics). We will see
    how to create simple graphic objects like circles, rectangles and triangles.

    - Also, we learn how these SVG elements can be drawn from HTML5. Next, we will
    use D3 to create these SVG elements.

    - Once we get basic understanding the basic SVG elements works then we move on
    to work with custom style sheets (CSS).

    - Working with CSS, we see how to use Data with D3.

    - Following that we shall see how to use simple graph like bubble chart and bar
    chart.

