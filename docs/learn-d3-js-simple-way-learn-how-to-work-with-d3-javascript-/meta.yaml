    \ then it return 70. This 70 is our height of the first data set. Similarly we\
    \ can check for y(100) then it will return 700. You can also check the x scale\
    \ (ordinal scale) if we enter x(0) then it will return the padding left for the\
    \ first rectangle because the bar starts without any padding. If we enter x(1)\
    \ then it will return 140.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_55_1.png)\n\
    \n## 9.3. Axis\n\nWe use axis when we want to use scale in our graph. It helps\
    \ user to understand the boundaries of data points and what is the value corresponds\
    \ to. Generally in a two dimensional graph we are having two axis namely X – Axis\
    \ and Y – Axis. To create an axis in D3 we use the function d3.svg.axis(). The\
    \ actual syntax we create an Axis is\n\n```\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient('left')\n    .ticks(5);\n```\n\nWe are using the function d3.svg.axis()\
    \ and passing the scale to it. The orientation we are passing will tell the bar\
    \ chart to be in left hand side. Ticks are used to have number of ticks we need\
    \ in the Y- Axis. Similarly the syntax for X – Axis is\n\n```\nvar xAxis = d3.svg.axis()\n\
    \    .scale(x)\n    .orient('bottom')\n    .ticks(10);\n```\n\nWe are passing\
    \ the scale here. The orientation is given as bottom because we need the x axis\
    \ comes under the bottom part of the bar chart. In our case we need more number\
    \ of ticks. So we had given 10 as our parameter in ticks in X – Axis. Depending\
    \ upon our requirements we can give more or less ticks. Generally in most cases\
    \ we need more number of ticks in the X – Axis. We will see an example using this\
    \ syntax in our cloud9 editor.\n\nIn the last example we created bar chart and\
    \ introduced the concept of scale. In this section we will add axis to the bar\
    \ chart. The first step we need to do is creating X - Axis and Y – Axis.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_56_0.png)\n\
    \n1. Adding Y – Axis with scale y, Orientation as left and ticks as 5.\n2. Adding\
    \ X – Axis with scale x, Orientation as bottom and ticks as 5.\n\n```\nvar svg\
    \ = d3.select(\"body\")\n  .append(\"svg\")\n  .attr(\"width\", widthSVG)\n  .attr(\"\
    height\", heightSVG)\n  .style(\"transform\", \"translate(\" + paddingChart +\
    \ \"px, \" + paddingChart + \"px)\")\n  .style(\"background\", \"black\");\n```\n\
    \n3. We are introducing two new axes. So we need some space display the axis.\
    \ To perform that we need to add transform property into our SVG. The paddingChart\
    \ variable is already defined initially as 40px.\n\n4. Next we need to call our\
    \ axis. To perform that we use the function .call(yAxis) similarly for X – Axis\
    \ .call(xAxis). Here the ‘g’ element represents to group our axis and stroke is\
    \ to add the colour of our axis as White.\n\n```\nsvg.append(\"g\")\n  .call(yAxis)\n\
    \  .style(\"stroke\", \"#fff\");\n\nsvg.append(\"g\")\n  .call(xAxis)\n  .style(\"\
    stroke\", \"#fff\");\n```\n\nAfter adding these if we run the code. We will see\
    \ the result look like this\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_57_0.png)\n\
    \nThis is not the exact result we want. The Y- Axis is not visible and X – Axis\
    \ at upper side.\n\n5. First we push the X – Axis to the bottom side and then\
    \ Y – Axis to little right hand side. To perform this we add the transform property\
    \ here with value as translate. We added a variable axisMargin to generalize the\
    \ axis margins. We need to declare the value as 30 in the declaration part.\n\n\
    ```\nsvg.append(\"g\")\n    .call(yAxis)\n    .attr(\"transform\",\"translate(\"\
    +axisMargin+\",0)\")\n    .style(\"stroke\", \"#fff\");\n\nsvg.append(\"g\")\n\
    \    .call(xAxis)\n    .attr(\"transform\",\"translate(0,\"+(heightSVG-axisMargin)+\"\
    )\")\n    .style(\"stroke\", \"#fff\");\n```\n\nWe fixed the axis now. However\
    \ still, we need to move the chart to little up and right hand side. As of now\
    \ if we run the code we will get the result as\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_58_0.png)\n\
    \nTo fix the issue that shown by the arrow in that picture we need to add a simple\
    \ CSS property.\n\n6. First we will group the rectangle together by using an append\
    \ function. Also we add the style function with class name as rectangle.\n\n```\n\
    svg.append(\"g\")\n    .attr(\"class\",\"rectangle\")\n    .selectAll()\n    .data(data)\n\
    \    .enter()\n    .append(\"rect\")\n    .attr(\"height\",function(d,i){\n  \
    \      return 0;\n    })\n```\n\n7. In the output we can see that the Y – Axis\
    \ values are reversed. To fix that we need to reverse the range in Y – Axis.\n\
    \n```\nvar y = d3.scale.linear().domain([0,d3.max(data)])\n    .range([heightSVG-axisMargin,0]);\n\
    \nvar x = d3.scale.ordinal().domain(d3.range(data.length))\n    .rangeRoundBands([0,widthSVG]);\n\
    ```\n\nIf we replace the values heightSVG; and y(d); vice versa we can see the\
    \ bar chart will get reversed. That is high to low and low to high.\n\n```\nsvg.append(\"\
    g\")\n    .attr(\"class\", \"rectangle\")\n    .selectAll()\n    .data(data)\n\
    \    .enter()\n    .append(\"rect\")\n    .attr(\"height\", function(d,i){\n \
    \       return heightSVG;\n    })\n    .attr(\"width\", \"20px\")\n    .style(\"\
    fill\", \"orange\")\n    .attr(\"y\", function(d,i){\n        return y(d);\n \
    \   })\n```\n\nThese are the changes we need to do for creating and aligning the\
    \ axis. We need to do lots of experiments to get our correct result.\n\n## Code\
    \ for D3Axis.html\n\n```\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n\nvar data=[10,20,30,40,100];\nvar heightSVG = 700;\nvar\
    \ widthSVG = 700;\nvar padding = 10;\nvar paddingText = 30;\nvar paddingChart\
    \ = 40;\nvar axisMargin = 30;\nvar margin = {\n\t'top':5,\n\t'right':20,\n\t'bottom':20,\n\
    \t'left':50\n};\n\nvar y = d3.scale.linear().domain([0,d3.max(data)])\n.range([heightSVG-axisMargin,0]);\n\
    \nvar x = d3.scale.ordinal().domain(d3.range(data.length))\n.rangeRoundBands([0,widthSVG]);\n\
    \nvar yAxis = d3.svg.axis()\n.scale(y)\n.orient('left')\n.ticks(5);\n\nvar xAxis\
    \ = d3.svg.axis()\n.scale(x)\n.orient('bottom')\n.ticks(5);\n\nvar svg = d3.select(\"\
    body\")\n.append(\"svg\")\n.attr(\"width\",widthSVG)\n.attr(\"height\",heightSVG)\n\
    .style(\"transform\",\"translate(\"+paddingChart+\"px,\"+paddingChart+\"px\")\n\
    .style(\"background\", \"black\");\n\nsvg.append(\"g\")\n.call(yAxis)\n.attr(\"\
    transform\",\"translate(\"+axisMargin+\",0)\")\n.style(\"stroke\",\"#fff\");\n\
    \nsvg.append(\"g\")\n.call(xAxis)\n.attr(\"transform\",\"translate(0,\"+(heightSVG-axisMargin)+\"\
    )\")\n.style(\"stroke\",\"#fff\");\n\nsvg.append(\"g\")\n.attr(\"class\",\"rectangle\"\
    )\n.selectAll()\n.data(data)\n.enter()\n.append(\"rect\")\n.attr(\"height\",function(d,i){\n\
    return heightSVG;\n})\n.attr(\"width\",\"20px\")\n.style(\"fill\",\"orange\")\n\
    .attr(\"y\",function(d,i){\nreturn  y(d);\n})\n</script>\n</body>\n</html>\n```\n\
