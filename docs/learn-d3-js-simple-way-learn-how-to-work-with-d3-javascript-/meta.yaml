    \n![](img/41b6c8103372ba4d3a912e2c0a922787_72_0.png)\n\n## Learn D3.JS Hands-on\
    \ And The Simple Way\n\nUJS Community Network • SAP Experts • SAP Services, SAP\
    \ Consulting, SAP Education\n\nLearn how to work with D3 Javascript libraries\
    \ in step-by-step and most simple manner with lots of hands-on examples\n\n⭐ 4.4\
    \ (10 ratings) | \U0001F3A5 35 lectures | ⏱ 7 hours | ⬆ All Levels\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_72_1.png)\n\
    \n## 11. Bubble Chart\n\nBubble charts are the pretty nice ways to show correlation\
    \ among the data points. For example consider the data points as shown below has\
    \ X and Y Co-ordinates. While representing these data points using the bubble\
    \ charts and there are some data points are grouped together. Those kinds of findings\
    \ are very easy to find in bubble chart.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_74_0.png)\n\
    \nWe may have extra dimension to our data like three dimensional data and we want\
    \ to represent that in our graph. Then we will consider the ‘d’ as size of the\
    \ circle. Depending upon the value of ‘d’ we can have bigger or smaller circles.\
    \ So we can differentiate the data points not only in terms of positions in X\
    \ and Y co-ordinates but also the size of the circle. Let’s go to our cloud9 editor\
    \ and start creating our bubble chart.\n\nPreviously we created bar chart with\
    \ some transition effects. We are going to do some changes in the code to create\
    \ a bar chart. To do that create a new file **D3Bubble.html** and copy the contents\
    \ of **D3Axis.html** to perform some changes for bubble chart. Change the title\
    \ name in the code to Bubble chart as we are coding for bubble chart.\n\n1. The\
    \ major change that we are going to change is from rectangle to circle.\n   1.\
    \ We need to change all the ‘rect’ class into ‘circle’.\n   2. We need radius\
    \ ‘r’ to create a circle replace the height into radius ‘r’ here.\n   3. Instead\
    \ of ‘y’ and ‘x’ we need to change it to ‘cy’ and ‘cx’."
  mdcn: "\n## 10. 事件\n\n事件用于在鼠标移过某个对象时执行某些操作。例如，在我们之前创建的柱状图中，如果我们将鼠标移到柱子上，一个小的弹出框会出现在它上面，以显示该柱子的值。同样，在柱子生成的过程中，也会有一些过渡效果。这些都是通过使用事件来完成的。要创建一个事件，我们需要一个\
    \ `on` 函数。在这个事件中，我们使用了 `mouseover` 事件。所以我们需要在 `on` 函数内提供 `mouseover` 事件的值。第二个参数\
    \ `function(d)` 用于在事件触发时调用函数。要在柱子生成期间添加过渡属性，我们需要使用 `transition` 函数，参数包括动画的持续时间及其在此次过渡中要更改的属性。例如，当柱子开始生成时，它会从底部生成或从侧面滑动。这些将由属性完成。让我们进入我们的\
    \ cloud9 IDE，在我们的柱状图中使用事件。\n\n在上一节中，我们创建了柱状图。现在，我们将对该柱状图使用事件。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_65_0.png)\n\
    \n1. 我们需要一个工具提示来显示柱子的值。所以我们创建一个框并添加工具提示。然后我们选择 `body`。我们附加一个 `div` 元素。我们需要为工具提示添加样式。我们将\
    \ `position` 设置为 `absolute`，`background` 设置为白色。我们还为工具提示添加了 `padding` 和 `border`\
    \ 属性。`opacity` 我们最初设置为 `0`，因为我们要暂时隐藏这个。稍后我们可以通过增加这个值来更改它。\n\n```\nvar tooltip\
    \ = d3.select('body')\n    .append('div')\n    .style('position', 'absolute')\n\
    \    .style('background', '#fff')\n    .style('padding', '5px 15px')\n    .style('border',\
    \ '1px #fff solid')\n    .style('opacity', '0');\n```\n\n2. 我们将为 `mouseover` 事件添加\
    \ `on` 函数。`function(d)` 将在我们将鼠标移到柱子上时拉出我们的工具提示。`left` 和 `top` 是显示工具提示在柱子上的位置。\n\
    \n3. `d3.select(this).style(‘opacity’,0.5);` 函数将选择鼠标指向的当前柱子，并将其透明度降低到 0.5。一旦我们降低了透明度，它将被设置为\
    \ 0.5，并且不会更改回 1。为了执行此操作，我们添加另一个 `mouseover` 事件以将其设置回 1。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_66_0.png)\n\
    \n4. 下一步是添加过渡效果。为此，我们向图表添加一个 `transition` 函数。我们需要对所有矩形执行过渡，因此我们通过 `d3.selectAll(‘rect’)`\
    \ 选择了所有矩形。添加了 `transition` 函数，并且还添加了过渡效果的持续时间（以毫秒为单位的时间）。我们还需要添加要更改的属性。\n\n```\n\
    d3.selectAll(\"rect\").transition()\n    .duration(4000)\n    .attr(\"height\"\
    ,function(d,i){\n        return heightSVG-y(d);\n    })\n    .attr(\"y\",function(d,i){\n\
    \        return y(d) ;\n    })\n```\n\n5. 我们需要从 0 开始设置图表的高度，直到达到总高度 (`heightSVG`)。为此，我们将更改\
    \ `y` 值。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_67_0.png)\n\n如果我们运行这些更改后的代码，我们将看到过渡效果和工具提示。\n\
    \n## D3Axis.html 的代码\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n\n    var data=[10,20,30,40,100];\n    var heightSVG = 700;\n\
