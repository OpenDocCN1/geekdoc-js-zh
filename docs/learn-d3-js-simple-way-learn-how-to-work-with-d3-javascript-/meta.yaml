- img_proc: true
  md: "+   1. Adding Y – Axis with scale y, Orientation as left and ticks as 5.\n\
    2. Adding X – Axis with scale x, Orientation as bottom and ticks as 5.\n\n```\n\
    var svg = d3.select(\"body\")\n  .append(\"svg\")\n  .attr(\"width\", widthSVG)\n\
    \  .attr(\"height\", heightSVG)\n  .style(\"transform\", \"translate(\" + paddingChart\
    \ + \"px, \" + paddingChart + \"px)\")\n  .style(\"background\", \"black\");\n\
    ```\n\n3. We are introducing two new axes. So we need some space display the axis.\
    \ To perform that we need to add transform property into our SVG. The paddingChart\
    \ variable is already defined initially as 40px.\n\n4. Next we need to call our\
    \ axis. To perform that we use the function .call(yAxis) similarly for X – Axis\
    \ .call(xAxis). Here the ‘g’ element represents to group our axis and stroke is\
    \ to add the colour of our axis as White.\n\n```\nsvg.append(\"g\")\n  .call(yAxis)\n\
    \  .style(\"stroke\", \"#fff\");\n\nsvg.append(\"g\")\n  .call(xAxis)\n  .style(\"\
    stroke\", \"#fff\");\n```\n\nAfter adding these if we run the code. We will see\
    \ the result look like this\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_57_0.png)\n\
    \nThis is not the exact result we want. The Y- Axis is not visible and X – Axis\
    \ at upper side.\n\n+   5. First we push the X – Axis to the bottom side and then\
    \ Y – Axis to little right hand side. To perform this we add the transform property\
    \ here with value as translate. We added a variable axisMargin to generalize the\
    \ axis margins. We need to declare the value as 30 in the declaration part."
