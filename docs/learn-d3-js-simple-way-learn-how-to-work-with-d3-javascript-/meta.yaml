    \ 中使用比例尺。\n\n通常，我们有一个输入，需要将该输入映射到所需的输出。输出可以是画布的宽度或画布的高度。输入可以是我们的数据点，或者我们需要映射的数据点数量。在\
    \ D3 中，输入称为**定义域**，输出称为**值域**。因此，我们必须将定义域映射到值域。例如，假设有三个输入 1、2、3，我们需要将这三个输入映射到六个字母\
