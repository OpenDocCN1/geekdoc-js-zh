    \n### 序数比例尺\n\n用于离散定义域，\n例如一组名称或类别。\n\n- 输入数据集 : [1, 2, 3]\n- f(1) → 2\n- f(2)\
    \ → 4\n- f(3) → 6\n- 输出数据集 : [2, 4, 6]\n\n### 9.1. 线性比例尺\n\n这些比例尺用于连续输入定义域，例如数字。例如，如果输入数据集是\
    \ [7, 10, 6]，整个画布高度是 100。我们需要在这个 100 值内绘制图形。为了根据画布绘制图形，我们需要输出数据集分别为我们输入数据集的 70、100\
    \ 和 60 个单位。\n\n**语法**\n\n**线性比例尺**\n\n```\nvar y = d3.scale.linear().domain([0,d3.max(data)])\
    \   /* 数据的最小值和最大值 */\n    .range([0, heightSVG]);       /* 指定在指定区域内创建图表的范围\n```\n\
    \n### 9.2. 序数比例尺\n\n```\nvar x = d3.scale.ordinal().domain(d3.range(data.length))\
    \ /* 指定数据点的数量\n.rangeRoundBands([0,widthSVG]); /* 根据 widthSVG 创建范围带\n```\n\n我们将在之前看到的示例中使用这种缩放，以解决柱子超出\
    \ SVG 的问题。创建一个新文件 (D3Scale.html) 并将代码复制到其中。我们需要做的修改是添加一个比例尺。对于 y 轴，我们使用线性比例尺。\n\
