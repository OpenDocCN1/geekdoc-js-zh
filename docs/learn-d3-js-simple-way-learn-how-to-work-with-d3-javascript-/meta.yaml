    \n![](img/41b6c8103372ba4d3a912e2c0a922787_21_0.png)\n\n在项目中，我们通常会使用相对路径或来自内容分发网络（CDN）的路径。如果我们打开\
    \ D3 库文件，我们会看到里面有一个很大的文件。这就是我们将在应用程序中使用的库文件。D3 基于 JavaScript，所以我们有一个 script 标签，并在其中编写\
    \ JavaScript 代码。我们要创建的第一个示例是使用 D3 创建一个 SVG。\n\n### 使用 D3 的 SVG 代码：\n\n```html\n\
    <!DOCTYPE html>\n<title>Create a SVG element with HTML and D3</title>\n<meta charset=\"\
