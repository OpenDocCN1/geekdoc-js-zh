  pgno: 98
- img_proc: true
  md: "3. We will add a mouseover event for transition of tooltip.\n\n```\n.on(\"\
    mouseover\",function(d,i){\n    tooltip.transition()\n        .style(\"opacity\"\
    ,1);\n```\n\n4. We need to add a tooltip for the mouse event. As we told that\
    \ it will be little tricky here. For that we are going to use a scale here. First\
    \ we define the scale and then add the tooltip. To define scale we used hoverVal\
    \ variable and defined the minimum and maximum range.\n\n```\nvar hoverVal = d3.scale.linear().domain([0,heightSVG])\n\
    \        .range([d3.max(data),0]);\n```\n\n5. Now we add the tooltip with the\
    \ parameter hoverVal and get the y position. Also we will add the position of\
    \ the tooltip to display on the line. So we define the tooltip style as left and\
    \ top. The value 50 added to the chartBottomPadding is used to equalize the exact\
    \ ‘y’ value to show in the tooltip.\n\n```\ntooltip.html(parseInt((hoverVal(d3.event.pageY-chartBottomPadding+50))))\n\
    \    .style('left',(d3.event.pageX+\"px\"))\n    .style('top',(d3.event.pageY)+\"\
    px\");\n\nd3.select(this).style(\"opacity\",0.5);\n```\n\n6. As we created mouseover\
    \ event we also need to create a mouseout event to change the event back to normal.\n\
    \n```\n}).on(\"mouseout\",function(){\n    d3.select(this).style(\"opacity\",1);\n\
    })\n```\n\nOnce we complete this we can run the program then we will get the line\
    \ chart. In real scenarios the line chart is not the only chart present in our\
    \ project. In those cases we have to do some calculations and adding some padding\
    \ to it. We need to do lot of trial and error to reach our final result.\n\n7.\
    \ Additionally we can add some text property to tell what is the axis is about\
    \ like amplitude, time, value and other variables. To do that we will append the\
    \ text"
