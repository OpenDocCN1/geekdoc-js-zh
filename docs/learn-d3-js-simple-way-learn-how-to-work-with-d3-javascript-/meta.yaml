    \n## 4. 选择元素和操作\n\n类似于 JQuery，如果我们想要获取一个对象以进行一些修改或读取一些值，我们需要使用 select 语句。D3 提供了两个顶级元素来选择元素：**`select`**\
    \ 和 **`selectAll`**。让我们从 select 开始。在这个示例中，我们将有一个简单的 HTML 页面，其中包含一个 body，这个 body\
    \ 内部将有一个 SVG 元素。这个 SVG 元素将包含一些属性值，如宽度或高度。这些属性实际上被称为 SVG 属性。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_24_0.png)\n\
    \n### 4.1 编码\n\n你可以访问这些示例的仓库。访问链接：[https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_25_0.png)\n\n在这个示例中，我们看到了 select 和\
    \ selectAll 属性。如果我们使用 select 属性，它会选择提到的特定元素。第一个橙色矩形是 select 属性的示例。恐龙、大象和猫使用了 selectAll。在这里你可以看到恐龙和大象是绿色的，因为在带有\
    \ id 和 class 属性的 div 标签中，我们将背景颜色定义为绿色。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_25_1.png)\n\
    \n-   1. `d3.select(\"body\")` 是一个 jQuery 选择器语句，用于选择 body 内的内容。属性也在这里定义，样式为橙色背景。\n\
    -   2. 带有 id 为 demo 的 div 元素和另一个 class 为 ‘demoClass’ 的 div 元素用于分组指定的类或 id。\n-\
    \   3. ‘SelectAll’ 将选择 div 内的整个 SVG，而 ‘Select’ 仅选择函数内指定的特定类或 id。\n\n### D3SVG.html\
    \ 的代码\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes\
    \ and selection to SVG element</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"\
    width\", \"300px\")\n    .attr(\"height\", \"100px\").style(\"background\", \"\
    orange\");\n</script>\n<div id=\"demo\">Dinosaurs</div>\n<div class=\"demoClass\"\
    >Elephant</div>\n<div>Cat</div>\n<script>\nd3.selectAll(\"div\").style(\"background\"\
    , \"orange\");\nd3.select(\"#demo\").style(\"background\", \"green\");\nd3.select(\"\
    .demoClass\").style(\"background\", \"green\");\n</script>\n</body>\n</html>\n\
    ```\n\n### 输出\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_26_0.png)\n\n如果我们移除恐龙和大象的\
    \ id 和 class，实际结果将显示如下。\n\n```html\n<title>Adding attributes and selection to\
    \ SVG</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\
    \    var svg = d3.select(\"body\").append(\"svg\")\n              .attr(\"height\"\
    , \"100px\").style(\"background\", \"grey\");\n</script>\n<div>Dinosaurs</div>\n\
    <div>Elephant</div>\n<div>Cat</div>\n<script>\n    d3.selectAll(\"div\").style(\"\
    background\", \"orange\");\n\n    d3.select(\"#demo\").style(\"background\", \"\
    green\");\n    d3.select(\".demoClass\").style(\"background\", \"blue\");\n</script>\n\
    ```\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_27_0.png)\n\n恐龙\n大象\n猫\n\n你也可以查看我们的\
    \ **《轻松上手 D3.JS》** 视频课程以加速学习：[点击此处](here)，或使用下方的二维码享受 50-90% 的折扣。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_28_0.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_28_1.png)\n\n## 5. 样式\n\n样式主要指的是 D3\
    \ 应用程序中的 CSS 部分。CSS 部分将使我们的应用程序看起来更美观。此外，在绘制气泡图和条形图等图形元素时，当我们需要区分数据点时，样式也变得至关重要。为\
    \ D3 添加样式可以通过三种不同的方式实现。\n\n-   内联样式\n-   外部样式表\n-   内部样式表\n\n### 内联样式\n\n样式的规则是在引号（“”）内定义。\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_30_0.png)\n\n这是我们在前面的示例中看到的内联样式规则。\n\
    \n```javascript\nvar svg = d3.select(\"body\").append(\"svg\").attr(\"width\"\
    ,\"300px\")\n    .attr(\"height\",\"100px\").style(\"background\",\"orange\");\n\
    ```\n\n### 外部或内部样式表\n\n在这种情况下，样式直接添加到我们的元素上。然而，更好的方法是采用外部或内部样式类。在这里，我们将定义一个类，并将这个类添加到元素上。之后，如果我们想更改属性，就不必访问所有单独的元素来执行这些更改。我们只需在类中进行更改，分配了该类的元素就会自动更新。我们将在编码中看到这一点。\n\
    \n### 内部样式规则\n\n内部样式规则可以在主编码内部定义，无需任何外部样式表。以下代码是内部样式表的示例。\n\n### 内部样式规则的代码：\n\n\
    ```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and\
    \ selection to SVG element</title>\n<style>\n```\n"
