- md: "## 15. Final Project\n\nIn this section we are going to start working in our\
    \ final project and we will see how we will use D3 in real project. In this we\
    \ will work in a data visualization project and **visualizing data is one of the\
    \ hot skill sets in the market place right now**. If you want to learn more about\
    \ data visualization then we will highly recommend to check our '**Learn Data\
    \ Visualization in 7 simple steps**' course in Udemy. This will provide a very\
    \ firm basic understanding of how to work in a data visualization project. In\
    \ the next section we are going to see the use case to work in D3.\n\nBefore starting\
    \ any data visualization project we should always have clear purpose statement/requirements.\
    \ Let’s look into the purpose statement that we have here.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_111_0.png)\n\
    \nAccording to this purpose statement we have to build a dashboard that will be\
    \ utilized by **people who monitors population growth** of different states of\
    \ US, so they can **allocate resources to states** based upon **current population\
    \ and population growth of these states**.\n\nHere we can see the three main parts\n\
    \n- Who is the audience?\n- What is the scope?\n- Outcome\n\n**Audience**: People\
    \ who monitors population. We are going to create visualization project for them\
    \ using D3.\n\n**Scope and Outcome**: Using this visualization they will be allocating\
    \ the resources to those states according to this.\n\nOnce we are clear on what\
    \ we are going to do in a data visualization project then we will go into the\
    \ 7 steps of data visualization project. Initial stage we will acquire the data\
    \ and times after we will spend time in parsing the data and preparing it for\
    \ usage.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_112_0.png)\n\nThis is the\
    \ wireframe based upon our requirement that we already created in moqups website.\
    \ We have skipped how to acquire data and how to work with data, filtering and\
    \ creating this wireframe because, we covered these 7 steps in our other courses\
    \ of data visualization. This course we are covering development oriented. In\
    \ the above picture we can see that the bar chart with population of all the state\
    \ and we also have a USA map. The KPI field shows the data of the population of\
    \ current state.\n\nThere is also a small bar chart above our map that will show\
    \ the variation of population for that particular years will be mentioned. This\
    \ is an interactive D3 map that if we press any state on the map and the KPI values\
    \ and Small bar chart will change corresponding to the data.\n\n### 15.1. Code\
    \ Structure\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_113_0.png)\n\n1. Let’s\
    \ see the code structure to solve the use case that we discussed. The first thing\
    \ is the GeoJSON data file for our USA map. The second thing is the data for US\
    \ population. These two are the JSON data that will be given to us before starting\
    \ the project.\n2. Next we need to create the bar chart for population vs graph\
    \ of all states of US.\n3. The third step is to add the interaction event. If\
    \ we press on any single state of the map then we should be able to see the bar\
    \ chart that represents the population of that state over years. We also update\
    \ the KPI field information based upon the state we have selected. Next we will\
    \ see these steps in our coding using cloud9 editor.\n\n### 15.2. Creating map\
    \ project\n\n1. Create a new file and name it as D3FinalProject.html and copy\
    \ the content of the map that we got from the github and paste it in the file.\
    \ We will see a very big geoJSON data and minimize/collapse it to see other codes\
    \ easily.\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_114_0.png)\n\n```javascript\n\
    var data = { };\n```\n\n2. Next we need the population data of US. We can see\
    \ the JSON data for population of US. It contains huge number of data and each\
    \ object is having a name key field and we have the data for the year 2010, 2012,\
    \ 2014 and 2016. These are even number of years that we are going to use. While\
    \ we are in real projects we are capturing the data from web services or reading\
    \ the data from some files. The purpose of this use case is simple here so we\
    \ can use the hard coded data inside our D3 program. We will copy the JSON data\
    \ and paste it inside var dataUSPopulation = [{<data to be pasted here>}];\n\n\
    ![](img/41b6c8103372ba4d3a912e2c0a922787_115_0.png)\n\n3. Other remaining things\
    \ are same for the map. We will increase the width and height and also we add\
    \ some padding to the graph.\n\n```javascript\n//Width and height\nvar w = 1600;\n\
    var h = 800;\nvar margin ={\n    left:32,\n    right:30,\n    bottom:30,\n   \
    \ top:30\n};\nvar numOfState = 50;\nvar scaleOfMap = 1000;\nvar tooltip = d3.select('body').append('div')\n\
    \    .style('position','absolute')\n    .style('background','#fff')\n    .style('padding','5\
    \ 15px')\n    .style('border','1px #fff solid')\n    .style('border-radius','5px')\n\
    \    .style('opacity','0');\n```\n\n4. In the map we also have a click event.\
    \ That is whenever a user click a particular state on the map the user can able\
    \ to see a bar chart. We will execute a function while the click event occurs.\
    \ We can see that we are using two functions that we are using here update and\
    \ new. The new function will call while the user clicks the state for first time.\
    \ On that time the state population graph will appear. Once it appears and user\
    \ clicks any other state the update function will be called. The 'if' statement\
    \ should be added after creating state bar chart.\n\n```javascript\n}).on(\"click\"\
    , function(d,i){\n    if(document.getElementById(\"stateBar\").childNodes.length>0)\n\
    \    {\n        addStateBarChart(d,i,\"update\");\n    }else{\n        addStateBarChart(d,i,\"\
    new\");\n    }\n}\n```\n\n### 15.3. Defining properties for our state vs population\
    \ bar chart\n\n5. Next we are going to define the state vs population bar chart\
    \ (Main bar chart). To do that we will create a function called barFirstTimeRender().\
    \ We will create the limit of bar chart and other boundaries and padding. Also\
    \ copy the tooltip of the map and use it here. The maxPop is used to fix the highest\
    \ population of all the states and use that for scaling.\n\n6. We use the ‘for\
    \ loop’ to find the maximum population value of the current year. `if(!Number.isNaN(parseInt(k)))`\
    \ - This is used to allow only year values inside the key condition. For that\
    \ we used ‘not a number(NaN)’ is used.\n\n```javascript\nfunction barFirstTimeRender(){\n\
    \    var maxPop = 0;\n    var widthBar = 750;\n    var heightBar = 700;\n    var\
    \ paddingText = 70;\n    var tooltip = d3.select('body').append('div')\n     \
    \   .style('position','absolute')\n        .style('background','#fff')\n     \
    \   .style('padding','5 15px')\n        .style('border','1px #fff solid')\n  \
    \      .style('border-radius','5px')\n        .style('opacity','0');\n}\n```\n\
    \n```javascript\nfor(var i=0;i<dataUSPopulation.length;i++){\n    for(k in dataUSPopulation[i]){\n\
    \        if(!Number.isNaN(parseInt(k))){\n            if(dataUSPopulation[i][k]>maxPop){\n\
    \                maxPop = dataUSPopulation[i][k];\n            }\n        }\n\
    \    }\n}\n```\n\n7. Once we have the maximum population that will be the upper\
    \ limit for the bar chart then we will create the scales.\n\n```javascript\nvar\
    \ h = d3.scale.linear()\n    .domain([0,maxPop])\n    .range([0,heightBar]);\n\
    \nvar y = d3.scale.linear()\n    .domain([0,maxPop])\n    .range([heightBar,0]);\n\
