    \ D3 语法渲染的。这是一个使用 SVG 的简单示例。我们将在接下来的章节中看到更多图形元素及其变化的示例。\n\n你也可以查看我们的 **《轻松上手 D3.JS》**\
    \ 视频课程以加速学习：[点击此处](http://www.tutorialspoint.com)，或使用下方的二维码享受 50-90% 的折扣。\n\n\
