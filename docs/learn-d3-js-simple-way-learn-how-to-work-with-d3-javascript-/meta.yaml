    \n![](img/41b6c8103372ba4d3a912e2c0a922787_2_3.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_2_4.png)\n\
    \n# 免费赠送优惠券\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_3_0.png)\n\n或\n\n[点击这里](https://example.com)\n\
    \n# 您可能还感兴趣的内容\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_4_0.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_4_1.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_4_2.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_4_3.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_0.png)\n\n学习 SAP® UI5：附带示例的新型企业级\
    \ JavaScript 框架\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_1.png)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_2.png)\n\
    \nSAP® Netweaver Gateway：学习如何将 SAP® Netweaver Gateway 用于 UI5 和 ABAP 项目\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_3.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_4.png)\n\n七步轻松实现数据可视化\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_5.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_5_6.png)\n\nSAP HANA 物联网：使用 Raspberry\
    \ PI、Arduino Uno、HANA XSJS 和 SAPUI5 构建您的物联网用例\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_5_7.png)\n\
    \n# 目录\n\n1. 介绍\n2. 本书学习路径\n3. SVG 元素\n    3.1. SVG 简单示例\n    3.2. 使用 D3 的 SVG\n\
    4. 选择元素与操作\n    4.1. 编码\n5. 样式\n6. 几何对象\n7. 数据融入场景\n8. 从外部文件加载数据\n9. 比例与坐标轴\n\
    \    9.1. 线性比例尺\n    9.2. 序数比例尺\n    9.3. 坐标轴\n10. 事件\n11. 气泡图\n12. 饼图和环形图\n \
    \   12.1. 将环形图转换为饼图\n13. 折线图\n14. 地图\n15. 最终项目\n    15.1. 代码结构\n    15.2. 创建地图项目\n\
    \    15.3. 定义我们各州与人口柱状图的属性\n    15.4. 定义我们各州逐年数据柱状图的属性\n    15.5. 定义和绘制 KPI 数字\n\
    \    15.6. CSS 及其他小修改\n    15.7 输出\n\n参考文献与书目\n\n# 1. 介绍\n\n**什么是 D3？**\nD3 代表数据驱动文档。它是一个\
    \ JavaScript 库，允许开发者创建惊人的数据分析和可视化效果。\n\n**为什么选择 D3？**\nD3 应优于任何其他 JavaScript 库，因为我们有很多可用的选项。如果我们想创建一些可视化项目，比如一个简单的项目或一个简单的数学应用，那么它就是最好的选择之一，原因如下。\n\
    \n**现代浏览器能力：** 我们可以利用 D3 使用现代浏览器的能力。我们可以访问所有的 HTML5 和 CSS 属性。因此，创建的应用是响应式的，并且能适应用户设备。\n\
    \n**无限的可能性：** D3 提供的变体和选项是无穷无尽的。我们可以在 [d3js.org](https://d3js.org) 网站上了解 D3 的可能性。\n\
    \n**BSD 开源许可证：** D3 附带 BSD 开源许可证。因此我们无需为使用 D3 支付任何费用。\n\n**庞大的社区支持：** D3 拥有庞大的社区支持。在\
    \ **StackOverflow** 和 **GitHub** 上有许多人。当我们学习一项新技术时，支持至关重要。这个社区将指导我们解决在项目中遇到的任何问题和疑问。\n\
    \n让我们探索 [d3js.org](https://d3js.org) 网站\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_8_0.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_8_1.png)\n\n如果您转到示例选项卡，您可以在图库中看到流行的示例。这里我们可以看到许多使用\
    \ D3 创建的示例。有许多常见的图形，如箱线图、气泡图、热力图，以及更具创新性的图表，如带有力导向布局和动态图表的图形，这些都在示例选项卡中可用。我们将找到多种变体和创新方法来使用\
    \ D3 解决任何可视化问题。在右侧，他们提供了 API 参考。如果您是 D3 新手，这非常有用。它包含了 D3 中使用的所有元素的文档和功能。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_9_0.png)\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_9_1.png)\n\n# API 参考\n\n让我们回到示例并选择一个示例来探索。这里我们选择箱线图示例来探索。\n\
    \n![](img/41b6c8103372ba4d3a912e2c0a922787_10_0.png)\n\n选择箱线图后，它会打开 D3 示例以及创建该图表的代码。Mike\
    \ Bostock 是创建此图表的开发者。他也发布了许多示例。您可以点击他的名字查看他发布的图表。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_10_1.png)\n\
    \n您也可以查看我们的 **通过实践和简单方式学习 D3.JS** 视频课程以加速学习：[点击这里](https://via.placeholder.com)\
    \ 或使用下方的二维码享受 50-90% 的折扣。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_11_0.png)\n\
    \n# 通过实践和简单方式学习 D3.JS\n\nUIS 社区网络 • SAP 专家 • SAP 服务、SAP 咨询、SAP 教育\n\n通过循序渐进且最简单的方式，结合大量实践示例，学习如何使用\
    \ D3 JavaScript 库\n\n- 35 节课\n- 7 小时\n- 所有级别\n\n★★★★★ 4.4 (10 个评分)\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_11_1.png)\n\
    \n# 2. 本书学习路径\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_13_0.png)\n\n- 首先我们将从\
    \ SVG（可缩放矢量图形）开始。我们将看到如何创建简单的图形对象，如圆形、矩形和三角形。\n- 同时，我们将学习如何从 HTML5 绘制这些 SVG 元素。接下来，我们将使用\
    \ D3 来创建这些 SVG 元素。\n- 一旦我们理解了基本 SVG 元素的工作原理，我们就会转向使用自定义样式表（CSS）。\n- 使用 CSS，我们将看到如何将数据与\
    \ D3 结合使用。\n- 之后，我们将看到如何使用简单的图表，如气泡图和柱状图。\n- 然后，我们将看到当最终用户将鼠标悬停在图表上时，图表中的事件。\n\
    - 我们的学习曲线还将继续深入到一些高级图表，如地图或热力图项目。\n- 最后，我们将创建一个作业项目。这个作业将是一个可视化的用例项目，我们将使用 D3\
    \ 来解决。我们将逐步、通过实践来学习整个过程。\n\n# 3. SVG 元素\n\nSVG 是可缩放矢量图形的缩写。类似于 PNG 或 JPEG 文件，SVG\
    \ 用于存储基于 XML 的矢量图像格式。普通的位图图像由固定的像素集组成。而矢量图像则由固定的形状集组成，如圆形、线条或文本。我们可以看到，.jpeg、.png\
    \ 或 .gif 文件中表示的图像可能会像素化或失真。然而，在矢量图像中，它们是一组形状，我们在缩放图像时不会看到任何质量损失。\n\n![](img/41b6c8103372ba4d3a912e2c0a922787_16_0.png)\n\
    \n# 示例\n\n让我们看一些在 HTML5 页面中使用 SVG 元素的简单示例。我们将使用 Cloud9 IDE。我们大部分开发都在 Cloud9 IDE\
    \ 中进行。文件全天候 24x7 对用户开放访问。\n\n代码仓库链接：[https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n不熟悉此 IDE 的人员可以在给定链接中阅读入门文档。\n\n入门指南：[https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)\n\
    \n让我们**开始编码吧！**\n"
