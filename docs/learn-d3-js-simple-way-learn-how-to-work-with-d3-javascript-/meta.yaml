  md: "# 15.3. Defining properties for our state vs population bar chart\n\n5. Next\
    \ we are going to define the state vs population bar chart (Main bar chart) .\
    \ To do that we will create a function called barFirstTimeRender(). We will create\
    \ the limit of bar chart and other boundaries and padding. Also copy the tooltip\
    \ of the map and use it here. The maxPop is used to fix the highest population\
    \ of all the states and use that for scaling.\n\n6. We use the ‘for loop’ to find\
    \ the maximum population value of the current year. If(!Number.isNaN(parseInt(k))){\
    \ - This is used to allow only year values inside the key condition. For that\
    \ we used ‘not a number(NaN)’ is used.\n\n```\nfunction barFirstTimeRender(){\n\
    \    var maxPop = 0;\n    var widthBar = 750;\n    var heightBar = 700;\n    var\
    \ paddingText = 70;\n    var tooltip = d3.select('body').append('div')\n     \
    \   .style('position','absolute')\n        .style('background','#fff')\n     \
    \   .style('padding','5 15px')\n        .style('border','1px #fff solid')\n  \
    \      .style('border-radius','5px')\n        .style('opacity','0');\n}\n```\n\
    \n```\nfor(var i=0;i<dataUSPopulation.length;i++){\n    for(k in dataUSPopulation[i]){\n\
    \        if(!Number.isNaN(parseInt(k))){\n            if(dataUSPopulation[i][k]>maxPop){\n\
    \                maxPop = dataUSPopulation[i][k];\n            }\n        }\n\
    \    }\n}\n```\n\n7. Once we have the maximum population that will be the upper\
    \ limit for the bar chart then we will create the scales.\n\n```\nvar h = d3.scale.linear()\n\
    \    .domain([0,maxPop])\n    .range([0,heightBar]);\n\nvar y = d3.scale.linear()\n\
    \    .domain([0,maxPop])\n    .range([heightBar,0]);\n\nvar x = d3.scale.ordinal()\n\
    \    .domain(d3.range(dataUSPopulation.length))\n    .rangeRoundBands([0,widthBar]);\n\
    ```"
  merge: -1
  pgno: 117
- img_proc: true
  md: "8. After creating scales we will create the ‘Y’ Axis with number of ticks,\
    \ orientation and scale. Similarly for ‘X’ axis also. Also we will create the\
    \ width of the bar by dividing widthBar / dataUSPopulation with floor value to\
    \ make sure a complete rounded value.\n\n```\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient('left')\n    .ticks(10);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n\
    \    .orient('bottom')\n    .ticks(50);\n\nvar widthOfBar = Math.floor(widthBar\
    \ / dataUSPopulation.length)-1;\n```\n\n9. We will group ‘Y’ axis and ‘X’ axis\
    \ separately because we will apply the CSS property separately.\n\n```\nsvg.append(\"\
