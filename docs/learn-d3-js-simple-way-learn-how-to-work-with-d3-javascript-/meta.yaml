    \n![image](img/41b6c8103372ba4d3a912e2c0a922787_81_2.png)\n\n## 12. 饼图和环形图\n\n\
    饼图用于展示数据点之间的差异和比较。在商业场景中，它通常用于显示不同数据点之间的占比份额，例如我们公司不同区域的收入，或工厂不同区域的产量。它也可以用来展示不同区域的某些销售信息，以及它们在销售方面的表现。我们可以据此得出哪些区域收入最高，哪些区域最低。这些是使用饼图的一些例子。饼图的一个轻微修改版本是环形图。我们可以通过挖去饼图的中心圆来生成环形图。要创建饼图和环形图，我们将使用以下函数。\n\
    \n```javascript\nd3.svg.arc()\nd3.layout.pie()\n```\n\n![image](img/41b6c8103372ba4d3a912e2c0a922787_83_0.png)\n\
    \n让我们转到 Cloud9 编辑器来创建环形图。\n\n1.  首先创建一个名为 D3PieChart.html 的文件，并声明变量和基本框架。\n\n\
    ```javascript\nvar padding = 1;\nvar paddingText = 30;\nvar paddingChart = 40;\n\
    var heightSVG = 700;\nvar widthSVG = 700;\nvar extraPadding = 200;\nvar animationDuration\
    \ = 1000;\nvar animationDelay = 1000;\nvar radius = 200;\nvar innerRadius = 100;\n\
    var paddingPieX = 200;\nvar paddingPieY = 250;\nvar unit = \"px\";\n```\n\n2.\
    \  接下来，我们将添加一些数据和颜色比例尺。我们使用线性比例尺，其定义域参数从0到数据集的最大长度。颜色值范围从绿色到橙色。\n\n```javascript\n\
    var data = [10,20,30,40,120];\nvar color = d3.scale.linear().domain([0,data.length])\n\
    \    .range([\"green\",\"orange\"]);\n```\n\n3.  我们需要添加的是具有外半径和内半径的弧。\n\n```javascript\n\
    var arc = d3.svg.arc()\n    .outerRadius(radius)\n    .innerRadius(innerRadius);\n\
    ```\n\n4.  接下来，我们需要创建一个具有外半径和内半径的弧标签。外半径需要减去 paddingText。\n\n```javascript\nvar\
    \ labelArc = d3.svg.arc()\n    .outerRadius(radius - paddingText)\n    .innerRadius(innerRadius\
    \ - paddingText);\n```\n\n5.  我们将在下一步创建一个饼图布局（pie lay out）。以下语法将给我们一个饼图布局。\n\n\
    ```javascript\nvar pie = d3.layout.pie()\n    .sort(null)\n    .value(function(d){return\
    \ d;});\n```\n\n6.  创建具有最大高度和宽度的 SVG。\n\n```javascript\nvar svg = d3.select(\"\
    body\").append(\"svg\")\n    .attr(\"width\",widthSVG+extraPadding)\n    .attr(\"\
    height\",heightSVG+extraPadding)\n    .style(\"background\",\"#000\");\n```\n\n\
    7.  接下来，我们需要将所有的 SVG 元素分组，然后追加这些元素的路径。我们在这里使用了 transform 属性。这将使图表正确地与浏览器窗口对齐。如果我们未能引入\
    \ transform 属性，我们将无法在浏览器窗口内看到完整的图表。\n\n```javascript\nvar g = svg.selectAll(\"\
    .arc\")\n    .data(pie(data))\n    .enter()\n    .append(\"g\");\n\ng.append(\"\
    path\")\n    .attr(\"d\",arc)\n    .style(\"transform\",\"translate(\"+paddingPieX+\"\
    px,\"+paddingPieY+\"px)\")\n    .style(\"fill\",function(d,i){return \"#000\"\
    ;})\n```\n\n到目前为止，如果我们运行代码，将能够看到环形图。我们仍然需要为其添加标签、工具提示和鼠标悬停事件。\n\n8.  要添加标签，我们需要追加一个带有转换的文本，以显示在弧内部。我们在这里使用\
    \ translation 属性来转换 X 和 Y 坐标。我们在这里使用的 centroid 函数是为了获得一个包含 X 和 Y 值的简单数组。我们还使用\
    \ `.attr(\"dy\",\".35em\")` 函数添加了一些额外的边距，并使用 `.text(function(d){return d.value;})`。\n\
    \n```javascript\ng.append(\"text\")\n    .attr(\"transform\",function(d){\n  \
    \      return \"translate(\"+(parseInt(labelArc.centroid(d)[0])+paddingPieX-10)+\"\
    ,\"+\"+(parseInt(labelArc.centroid(d)[1])+paddingPieY-10)+\")\";\n    })\n   \
    \ .attr(\"dy\",\".35em\")\n    .text(function(d){return d.value;});\n```\n\n9.\
    \  在下一步，我们将为环形图添加一些事件。为此，我们将使用 mouseover 事件，并从那里调用工具提示。mouseover 事件会将不透明度更改为 0.5，mouseout\
    \ 事件会将其设置回 1。\n"
