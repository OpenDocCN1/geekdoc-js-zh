    \n## 13. 折线图\n\n折线图是表示**随时间变化趋势**的绝佳方式。它就像是多个代表我们数据的小气泡。我们用直线将这些点连接起来。当我们在一段时间内拥有大量数据点时，使用折线图对于观察一些模式或随时间变化的趋势非常有益。要在\
    \ D3 中创建一个简单的折线图，我们需要使用函数\n\n```\nd3.svg.line()\n  .x(function(d,i) { return x(i)})\n\
    \  .y(function(d){return y(d) });\n```\n\n我们传入 x 和 y 值。`x` 值基于索引值 `i`。`y` 值基于数据点本身的值。为了创建折线图，我们取条形图的代码，移除了绘制条形的代码，只保留了坐标轴。我们使用了在条形图中使用过的线性比例尺和序数比例尺。因此，我们将添加折线图的代码，以便使用\
    \ D3 进行绘制。\n\n-   1. 我们将添加线的语法，并通过包含数据和索引的函数添加 x 值和 y 值。这里的 y 比例尺值可能不会返回整数值，因此我们需要添加\
    \ `parseInt` 来获取整数数据。\n\n```\nvar line = d3.svg.line()\n  .x(function(d,i){return\
    \ x(i);})\n  .y(function(d){return parseInt(y(d));});\n```\n\n-   2. 我们需要将路径追加到\
    \ svg。我们使用一个名为 `datum` 的新函数来指定数据。同时，我们将添加描边属性并将数据添加到线中。这将会在每个数据点上调用线函数。\n\n```\n\
    svg.append(\"path\")\n  .datum(data)\n  .attr(\"stroke\",\"orange\")\n  .attr(\"\
    d\",line)\n```\n\n添加这些代码后，如果我们尝试运行它，就会得到一条根据数据点连接的线。接下来，我们需要在鼠标悬停在线上时添加一个工具提示，它会显示相应的\
    \ `y` 值。在条形图和气泡图中，我们有离散值，但这种情况下我们将使用连续值，因此显示值会有些棘手。这是因为如果我们把鼠标放在线的任何部分上，它都必须显示相应的\
    \ `y` 值。所以我们需要为此找到一种方法。\n"
