    g\")\n    .attr(\"id\",\"xAxis\")\n    .call(xAxis)\n    .style(\"stroke\",\"\
    #000\")\n    .attr(\"transform\",\"translate(\"+paddingText+\",\"+(heightBar)+\"\
    )\");\n```\n\n10. Next we will append the ‘Y’ axis and ‘X’ Axis to our SVG for\
    \ this bar chart. We are plotting the bar here."
