  \ = canvas.getContext(\"2d\");\nctx.beginPath();\nctx.fill();\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n<!DOCTYPE html>\n  <head>\n  </head>\n    <canvas id=\"canvas\" width=\"\
