  \ `mkSequence` 并传递 `drumPattern` 对象中的一个字符串，这将创建一个由 `x` 和 `null` 组成的数组。该调用的结果传递给\
  \ `Tone.Sequence` 辅助函数，我们用它来……\n\n### 使用采样\n\n`Tone.Sampler` 的一个重要部分是它允许你使用音频文件而不是合成器。如果你以前用过采样器，你就知道可以将采样映射到不同的音符。`Tone.Sampler`\
  \ 通过允许你为音符提供一组 URL 使这变得更加简单，它将为你处理音高偏移。\n\n例如，如果你想使用真实鼓组的高质量录音，`Tone.Sampler` 是最佳选择。\n\
  \n让我们看看将这些采样加载到新的 `Tone.Sampler` 对象中。`Tone.js` 允许你从外部 URL 加载所有采样，例如我们的三个 S3 URL，我们在\
  \ [Listing 12-24] 中就是做的。将新的采样代码插入到 `script.js` 的末尾。\n\n```javascript\n--snip--\n\
  \  new Tone.Sequence(time => {\n    kick.triggerAttackRelease(50, \"16n\", time);\n\
  \  }, mkSequence(drumPattern.kick), \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n\
  \  // 来自 freesound.org 的采样：\n  // https://freesound.org/people/MTG/sounds/357432/\n\
  \  // https://freesound.org/people/MTG/sounds/357336/\n  // https://freesound.org/people/MTG/sounds/357546/\n\
  \  const sampler = new Tone.Sampler({\n    urls: {\n      \"C5\": \"trumpet-c5.mp3\"\
  ,\n      \"D5\": \"trumpet-d5.mp3\",\n      \"F5\": \"trumpet-f5.mp3\"\n    },\n\
  \    baseUrl: \"https://skilldrick-jscc.s3.us-west-2.amazonaws.com/\",\n    attack:\
  \ 0,\n    release: 1,\n    volume: -24,\n    onload: () => {\n      sampler.triggerAttackRelease([\"\
  C5\", \"E5\", \"G5\"], \"1n\", 0);\n    }\n  }).toDestination();\n\n  Tone.Transport.start();\n\
  });\n```\n\n\n\n\n\n# 列表 12-24：创建一个采样器\n\n我们通过向 `Tone.Sampler` 构造函数传递配置对象来创建采样器。在这个示例中，配置对象包含五个属性。第一个属性\
  \ `urls` 包含一个将音名映射到文件名的对象。例如，我们表示音名 `C5` 对应文件名 `trumpet-c5.mp3`。接下来，`baseUrl` 定义了所有\
  \ URL 的共享前缀，这避免了我们为每个样本编写完整的 URL。由于所有的 URL 都在同一个 S3 桶中，因此我们可以将其作为基础 URL，然后在 `urls`\
  \ 中仅提供文件名即可。\n\n采样器乐器在播放样本时不会应用完整的 ADSR 包络，但它确实允许你设置攻音（attack，淡入速度）和释放（release，淡出速度）。我们使用了瞬时攻音（因为样本本身已经有了攻音）以及长达一秒的释放。我们还将\
  \ `volume` 设置为 `-24 dB`，以确保采样器的声音不会太大。最后，`onload` 属性允许我们在所有样本下载完成后指定要执行的操作。在这个示例中，我们调用\
  \ `triggerAttackRelease` 来播放一个三音和弦。注意，`Tone.Sampler` 默认是多声的，因此它可以同时播放多个样本。\n\n当你运行这个示例时，你仍然会听到鼓声。一旦样本加载，你应该还能听到小号采样器播放的\
  \ C 大和弦。这里值得注意的一个点是，尽管我们为音符 `C5` 提供了样本，但没有为 `E5` 或 `G5`（C 大和弦中的其他音高）提供样本。当我们告诉采样器播放这些音时，它会选择最接近提供的样本，并通过改变播放速度来偏移其音高。例如，距离\
  \ `G5` 最近的样本音高是 `F5`，因此该样本将稍微加快速度以听起来像 `G5`。只要我们尝试播放的音符与提供的样本不是太远，它的听起来就是正常的。然而，如果我们推得太远，结果听起来就不那么真实了。例如，尝试通过将音符设置为\
  \ `C6`、`E6` 和 `G6` 将它们调高一个八度。它们现在听起来会有点滑稽。此外，由于样本是以两倍速度播放的，它们的持续时间减了一半，因此它们无法持续满整个应的小节（高音符会更早结束，因为它们播放得更快）。你也可以反过来操作，将音符设置为\
  \ `C4`、`E4` 和 `G4`。这次持续时间将不是问题，因为样本为了降低音高而播放得更慢，但音符听起来仍然不会那么真实。\n\n### 总结\n\n在这一章中，你学习了如何使用\
  \ Web Audio API 制作声音和音乐，并看到使用像 `Tone.js` 这样的库如何通过隐藏许多底层细节让你的生活变得简单得多。你还学习了许多使用 `Tone.js`\
  \ 库进行声音合成和采样的技巧。如果某些音乐细节让你没跟上，不要担心。这里最重要的是习惯使用新的 JavaScript API 和库进行工作。我们将在下一章中运用这些内容，届时我们将使用在本章创建的乐器来编写一首真正的歌曲！\n\
  \n## 13 编写歌曲\n\n![](img/opener.png)\n\n你现在已经学习了足够关于 `Tone.js` 基础和声音合成的知识，可以写一首简单的歌曲了。我们的歌曲将由几个乐器组成：我们在上一章中开发的鼓、小号采样器、两个不同的合成器贝斯部分，以及在另一个合成器上播放的一些和弦。\n\
  \n### 组织结构\n\n我们的歌曲将重用许多上一章的代码，但我们将对其进行重新组织，以便于理解歌曲是如何构建的。`index.html` 文件与第 12 章完全相同，但我们将从一个新的\
  \ `script.js` 文件开始，将其组织为四个逻辑部分：\n\n- **Instruments（乐器）**：用于实例化和设置乐器\n- **Sequencing（序列）**：用于创建播放的循环音符序列\n\
  - **Song（歌曲）**：用于安排每个序列的和结束\n- **Event Handling（事件处理）**：处理启动歌曲的点击事件的代码\n\n我们将为这四个部分中的每一个都设置一个多行注释，以便\
  \ `script.js` 文件更容易导航。列表 13-1 显示了这些注释的样子。你现在可以按照这个顺序将它们添加到文件中。\n\n```\n/////////////////\n\
  // Instruments //\n/////////////////\n\n////////////////\n// Sequencing //\n////////////////\n\
  \n//////////\n// Song //\n//////////\n\n////////////////////\n// Event Handling\
  \ //\n////////////////////\n```\n\n列表 13-1：划定 `script.js` 主要部分的注释\n\n在整个章节中，当我们构建构建歌曲时，我会告诉你将每段新代码添加到某个特定部分的末尾。这些注释将使你能够快速找到新代码应该所在的位置。\n\
  \n### 事件处理\n\n让我们从编写 `script.js` 的事件处理部分开始。这段代码与我们在上一章开头编写的代码几乎相同：它创建了一个点击事件监听器，当用户点击按钮时切换\
  \ Play 按钮和“Playing”段落的样式，并执行启动歌曲所需的 `Tone.js` 调用。将列表 13-2 的内容输入代码的事件处理部分。\n\n```\n\
  --snip--\n////////////////////\n// Event Handling //\n////////////////////\n\nlet\
  \ play = document.querySelector(\"#play\");\nlet playing = document.querySelector(\"\
  #playing\");\n\nplay.addEventListener(\"click\", () => {\n  // 隐藏此按钮\n  play.style\
  \ = \"display: none\";\n  playing.style = \" \";\n\n  Tone.start();\n\n  // 修改此以从歌曲的不同部分开始播放\n\
  \  Tone.Transport.position = \"0:0:0\";\n  Tone.Transport.start();\n});\n```\n\n\
  列表 13-2：事件处理代码\n\n这段代码与列表 12-2 相比的一个重要区别是，我们在调用 `Tone.Transport.start` 之前使用 `Tone.Transport.position`\
  \ 来设置传输器的起始位置。在这里我们将起始位置设置为 `\"0:0:0\"`，这是默认值，所以这个调用并不是严格必要的。然而，包含这行代码使得如果你不想在每次添加新元素时都听一整首歌，就可以轻松修改起始位置。例如，如果你想跳过前\
  \ 20 小节，可以将 `Tone.Transport.position` 的值改为 `\"20:0:0\"`。\n\n与上一章不同，创建乐器和序列的所有代码将位于事件处理程序之外。这些代码可以在用户按下\
  \ Play 之前执行。只有 `Tone.start` 调用必须在处理器内部，以确保歌曲正常运行。如果我们愿意，甚至可以将 `Tone.Transport` 的行移动到处理器之外，但让这些代码出现在\
  \ `Tone.start` 之后感觉更自然。\n\n### 创建鼓点\n\n现在让我们创建一个歌曲背景的鼓点。我们将使用上一章中创建的相同的镲片、军鼓和底鼓声。首先我们声明这些乐器，如列表\
  \ 13-3 所示。将此代码添加到 `script.js` 的 Instruments 部分。\n\n\n\n\n\n```\n/////////////////\n\
  // Instruments //\n/////////////////\n\n❶ function mkDrums() {\n  let reverb = new\
  \ Tone.Reverb({\n    decay: 1,\n    wet: 0.3\n  }).toDestination();\n\n  let hiHatFilter\
  \ = new Tone.Filter(15000, \"bandpass\").connect(reverb);\n\n  let hiHat = new Tone.NoiseSynth({\n\
  \    envelope: {\n      attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n\
  \    volume: -6\n  }).connect(hiHatFilter);\n\n  class Snare {\n    constructor()\
  \ {\n      this.noiseFilter = new Tone.Filter(5000, \"bandpass\").connect(reverb);\n\
  \      this.noiseSynth = new Tone.NoiseSynth({\n        envelope: {\n          attack:\
  \ 0.001, decay: 0.1, sustain: 0, release: 0\n        },\n        volume: -12\n \
  \     }).connect(this.noiseFilter);\n\n      this.synth = new Tone.Synth({\n   \
  \     envelope: {\n          attack: 0.0001, decay: 0.1, sustain: 0, release: 0\n\
  \        },\n        oscillator: {type: \"sine\"},\n        volume: -12\n      }).connect(reverb);\n\
  \    }\n\n    triggerAttackRelease(duration, when) {\n      this.noiseSynth.triggerAttackRelease(duration,\
  \ when);\n      this.synth.triggerAttackRelease(\"G3\", duration, when);\n    }\n\
  \  }\n\n  let snare = new Snare();\n\n  let kick = new Tone.MembraneSynth({\n  \
  \  pitchDecay: 0.02,\n    octaves: 6,\n    volume: -9\n  }).connect(reverb);\n\n\
  \  ❷ return {hiHat, snare, kick};\n}\n\nlet drums = mkDrums();\n--snip--\n```\n\n\
  <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 13-3: 声明鼓组</samp>\n\n这段代码与我们在上一章中编写代码完全相同，但为了保持代码整洁，我将所有的鼓设置代码（包括混响效果）都移动到了名为\
  \ `mkDrums`（意为“制作鼓”）的函数中 ❶。该函数返回一个包含三个鼓的对象 ❷。我们正在使用一种创建对象的对象的语法，称为**对象字面量简写语法**（object\
  \ literal shorthand syntax）。使用这种简写语法，我们不需要输入 `{hiHat: hiHat, snare: snare, kick:\
  \ kick}`，只需输入 `{hiHat, snare, kick}`。只有当属性名与变量名相同时，这种方法才有效。\n\n现在我们已经声明了鼓，将创建实际的鼓点模式。我们将使用上一章中开发的相同小节模式，即每个八分音符一个踩镕，底鼓和军鼓每四分音符交替出现。将列表\
  \ 13-4 添加到代码的序列（Sequencing）部分。\n\n```\n--snip--\n////////////////\n// Sequencing\
  \ //\n////////////////\n\n// 将字符串转换为音符或 null 的数组。\n// 字符串中的点将变为数组中的 null 且保持静音。\n\
  ❶ function mkSequence(pattern) {\n  return pattern.split(\" \").map(value => {\n\
  \    if (value == \".\") {\n      return null;\n    } else {\n      return value;\n\
  \    }\n  });\n}\n\n❷ let drumPattern = {\n  kick:  \"x…x…\",\n  snare: \"..x…x.\"\
  ,\n  hiHat: \"xxxxxxxx\",\n};\n\nlet hiHatSequence = new Tone.Sequence(time => {\n\
  \  drums.hiHat.triggerAttackRelease(\"16n\", time);\n}, mkSequence(drumPattern.hiHat),\
  \ \"8n\");\n\nlet snareSequence = new Tone.Sequence(time => {\n  drums.snare.triggerAttackRelease(\"\
  16n\", time);\n}, mkSequence(drumPattern.snare), \"8n\");\n\nlet kickSequence =\
  \ new Tone.Sequence(time => {\n    drums.kick.triggerAttackRelease(50, \"16n\",\
  \ time);\n}, mkSequence(drumPattern.kick), \"8n\");\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 13-4: 鼓点序列</samp>\n\n再次，这与我们在第 12 章中编写的代码完全相同。我们从一个辅助函数\
  \ `mkSequence` ❶ 开始，它接收一个由 x 和点组成的模式，并将其转换为 `Tone.Sequence` 可以使用的音符信息。然后，我们将所需的模式存储在\
  \ `drumPattern` 对象中 ❷，并使用 `Tone.Sequence` 为每个乐器生成序列。\n\n创建鼓点剩下的唯一工作就是安排序列在歌曲的大部分时长内循环播放，如列表\
  \ 13-5 所示。将此代码添加到 `script.js` 文件的歌曲（Song）部分。\n\n```\n--snip--\n//////////\n// Song\
  \ //\n//////////\n\nhiHatSequence.start(\"0:0:0\").stop(\"44:0:0\");\nsnareSequence.start(\"\
  0:0:0\").stop(\"44:0:0\");\nkickSequence.start(\"0:0:0\").stop(\"44:0:0\");\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 13-5: 安排鼓点序列</samp>\n\
  \n在这里我们告诉鼓组从歌曲开始播放并持续播放 44 小节。加载页面并点击**播放（Play）**，你应该能听到与之前相同的鼓声，但持续长得多。当你听腻了时，重新加载页面以停止鼓的播放。\n\
  \n## 添加贝斯线\n\n接下来，我们将添加两个贝斯合成器，并让它们演奏两条不同的贝斯线。首先，我们通过将列表 13-6 中的代码添加到乐器（Instruments）部分的末尾（紧接序列部分之前）来创建合成器。\n\
  \n```\n--snip--\nlet lowBass = new Tone.FMSynth({\n  oscillator: {\n  ❶ type: \"\
  triangle\"\n  },\n  envelope: {\n    attack: 0.0001, decay: 0.5, sustain: 0.3, release:\
  \ 0.1\n  },\n  volume: -3\n}).toDestination();\n\nlet highBass = new Tone.FMSynth({\n\
  \  oscillator: {\n  ❷ type: \"square\"\n  },\n  envelope: {\n    attack: 0.0001,\
  \ decay: 0.1, sustain: 0.3, release: 0.1\n  },\n  volume: -9\n}).toDestination();\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 13-6: 创建贝斯乐器</samp>\n\
  \n在这里声明了两个名为 `lowBass` 和 `highBass` 的贝斯乐器。它们都使用一种我们尚未过的合成器，`FMSynth`。`FM` 是 `frequency\
  \ modulation`（频率调制）的缩写，而 `FM synthesis`（频率合成）涉及使用一个振荡器来调制或修改另一个振荡器的频率。这种合成产生的声音比普通的振荡器更丰富，并且是一个很好的贝斯合成器。`FMSynth`\
  \ 中有很多可以修改的参数（例如，应用的调制量、两个振荡器频率之间的关系、两个振荡器的波形等），但我们主要将保留默认值。我们做的只是设置振荡器类型（`lowBass`\
  \ 使用 `triangle` ❶，`highBass` 使用 `square` ❷），以及包络和音量。\n\n为了生成贝斯序列，我们将使用一种与目前的 `mkSequence`\
  \ 辅助函数稍不同的技术。该辅助函数对于鼓等情况非常好用，因为你只需要一个字符来判断是否播放音符，但它并不适用于贝斯线，因为我们希望提供音符名称，这些名称至少有两个字符（如\
  \ `C3` 或 `F#4`）。我们可能在编写序列时选择的格式类似于：\n\n```\n\"C3|  |  |C3|  |  |G2|B2\"\n```\n\n\
  竖线字符 `|` 用作分隔符，每对竖线之间我们要我们要播放的音符，要么是空格，后者代表静音。（这里写出的序列是 Ben E. King 的《Stand by Me》中贝斯线的开头。）\n\
  \n列表 13-7 提供了 `mkPipeSequence` 的定义，我们将用它来为贝斯线制作序列。它接收一个类似于《Stand by Me》的字符串并将其转换为音符名称和\
  \ null 的数组。将此函数插入 `script.js` 的序列部分，紧接 `mkSequence` 的定义之后。\n\n```\n--snip--\n//\
  \ 将字符串转换为音符或 null 的数组。\n// 字符串中竖线之间的空格将变为数组中的 null 且保持静音。\nfunction mkPipeSequence(pattern)\
  \ {\n  return pattern.split(\"|\").map(value => {\n  ❶ if (value.trim() == \" \"\
  ) {\n      return null;\n    } else {\n      return value;\n    }\n  });\n}\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 13-7: mkPipeSequence\
  \ 函数</samp>\n\n\n\n\n此函数使用 `split(\"|\")` 通过竖线字符分割字符串。以“Stand by Me”为例，这将得到数组 `[\"\
  C3\", \" \", \" \", \"C3\", \" \", \" \", \"G2\", \"B2\"]`。然后我们对这些值中的每一个进行映射（map）处理。`trim`\
  \ 方法 ❶ 会移除字符串开头或结尾的任何空格，因此 `\" \".trim()` 的结果是 `\" \"`，一个空字符串。我们将返回数组中的任何空字符串替换为\
  \ `null`，并保持音名不变地传递，导致返回值为 `[\"C3\", null, null, \"C3\", null, null, \"G2\", \"\
  B2\"]`。\n\n接下来，我们想要为两条贝斯线创建实际的序列（在这里我们不会引用“Stand by Me”）。将 Listing 13-8 中的代码添加到“序列化（Sequencing）”节的末尾。\n\
  \n```\n--snip--\nlet lowBassSequence = new Tone.Sequence((time, note) => {\n  lowBass.triggerAttackRelease(note,\
  \ \"16n\", time, 0.6);\n}, mkPipeSequence(\"G2|  |  |G2|G2|  |  |  \"), \"8n\");\n\
  \nlet highBassSequence = new Tone.Sequence((time, note) => {\n  highBass.triggerAttackRelease(note,\
  \ \"16n\", time, 0.3);\n}, mkPipeSequence(\"G3|F3|E3|D3|G2|D3|G3|D3\"), \"8n\");\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 13-8:\
  \ 贝斯序列</samp>\n\n这里有两个贝斯部分：低音部分每小只播放三个八分音符，而高音部分则连续播放八分音符。\n\n最后，我们需要根据传输器（transport）调度这些序列，如\
  \ Listing 13-9 所示。此代码应添加到“歌曲（Song）”节的末尾。\n\n```\n--snip--\nlowBassSequence.start(\"\
  0:0:0\").stop(\"47:3:0\");\nhighBassSequence.start(\"4:0:0\").stop(\"47:3:0\");\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 13-9:\
  \ 调度贝斯序列</samp>\n\n低音序列从开始运行，高音序列在四个小节后开始。它们都会持续循环到第 48 小节的中途。这样一来，贝斯部分在鼓声停止后还会持续几个小节。\n\
  \n如果你现在刷新页面并点击播放，你将听到一首歌的开头！我们不仅有鼓点和贝斯，还具有非常基础的结构，第二条贝斯线在四个小节后进入，而鼓声在贝斯之前结束。结尾的那段贝斯独奏是目前歌曲中最戏剧性的部分。如果你只想听那部分内容，可以修改代码中“事件处理（Event\
  \ Handling）”部分中 `Tone.Transport.Position` 的值。如果你将其设置为 `\"40:0:0\"` 并重新加载，你将跳到歌曲的最后八小节。\n\
  \n### 添加和弦\n\n接下来，我们将用一些和弦填充歌曲。这首歌将有两个独立的和弦序列，我们将在歌曲不同的时间对它们进行调度，以使其提供更多的结构和多样性。\n\
  \n首先，我们需要创建一个播放和弦的乐器。该代码位于 Listing 13-10 中；将其插入“乐器（Instruments）”节的末尾。\n\n```\n--snip--\n\
  let chordSynth = new Tone.PolySynth(Tone.Synth, {\n  oscillator: {\n    type: \"\
  triangle\"\n  },\n  volume: -12\n}).toDestination();\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">Listing 13-10: 和弦合成器</samp>\n\n我们需要一个 `PolySynth`，因为乐器将同时播放多个音符（这就是和弦的定义）。`PolySynth`\
  \ 基于普通的 `Synth`，使用默认的振幅包和三角波振荡器。\n\n接下来，我们将为和弦创建序列化代码。我们不需要在每次要在序列中播放和弦时手动编写和弦，而是创建一些命名的和弦，然后使用这些和弦名称创建序列。将\
  \ Listing 13-11 中的代码添加到“序列化（Sequencing）”节的末尾。\n\n```\n--snip--\n❶ let chords = {\n\
  \  1: [\"D4\", \"G4\"],\n  2: [\"E4\", \"G4\"],\n  3: [\"C4\", \"E4\", \"G4\"],\n\
  \  4: [\"B3\", \"F4\", \"G4\"],\n};\n\n❷ function playChord(time, chordName) {\n\
  ❸ let notes = chords[chordName];\n  chordSynth.triggerAttackRelease(notes, \"16n\"\
  , time, 0.6);\n}\n\n❹ let chordSequence1 = new Tone.Sequence((time, chordName) =>\
  \ {\n  playChord(time, chordName);\n}, mkSequence(\"1…2…3..4…31…2…3..4.343\"), \"\
  8n\");\n\n❺ let chordSequence2 = new Tone.Sequence((time, chordName) => {\n  playChord(time,\
  \ chordName);\n}, mkSequence(\"3…2…4..1.213\"), \"8n\"); \n--snip--\n```\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 13-11: 和弦序列化</samp>\n\n我们做的第一件事是创建一个名为\
  \ `chords` 的对象，包含我们要序列化的四个和弦 ❶。我们可以给它们起任何名字，但简单起见，我使用数字 1、2、3 和 4 来表示这些和弦（请注意，由于这些是对象键，数字会被解释为字符串）。每个和弦数字对应一个音名数组，这是我们的\
  \ `PolySynth` 格式的格式。两个和弦序列将只是这四个和弦的不同排列组合。\n\n接下来是一个用于播放和弦的辅助函数 ❷。这个 `playChord`\
  \ 函数接收播放和弦的 `time` 和和弦名称作为名称。（*注：原文此处存在大量文本重复，在翻译时已根据逻辑去重*）\n\n\n\n\n\n```\n--snip--\n\
  // Samples from freesound.org:\n// https://freesound.org/people/MTG/sounds/357432/\n\
  // https://freesound.org/people/MTG/sounds/357336/\n// https://freesound.org/people/MTG/sounds/357546/\n\
  let sampler = new Tone.Sampler({\n  urls: {\n    \"C5\": \"trumpet-c5.mp3\", \n\
  \    \"D5\": \"trumpet-d5.mp3\", \n    \"F5\": \"trumpet-f5.mp3\" \n  },\n  baseUrl:\
  \ \"https://skilldrick-jscc.s3.us-west-2.amazonaws.com/\",\n  attack: 0,\n  release:\
  \ 1,\n  volume: -24\n}).toDestination();\n--snip--\n```\n\n列表 13-13：声明小号采样器\n\n\
  在这里，我们正在创建一个 `Tone.Sampler` 乐器，它使用了与上一章相同的三个样本。但注意，我们不再使用采样器的 `onload` 属性来告诉它在样本下载完成后执行什么。这有点像在投径，但我知道小号在歌曲开始时不会播放，我赌了一个事实，即当它们出现时，样本已经下载完成了。正确的做法是在样本下载完成之前隐藏播放按钮，但这会给项目增加额外的复杂性。\n\
  \n列表 13-14 显示了歌曲旋律音符编排的代码。将此代码添加到序列化（Sequencing）章节的末尾。\n\n```\n--snip--\nlet trumpetPart\
  \ = new Tone.Part((time, note) => {\n  sampler.triggerAttackRelease(note, \"1n\"\
  , time);\n}, [\n  [\"0:0:0\", \"G5\"],\n  [\"0:2:0\", \"C5\"],\n  [\"1:0:0\", \"\
  G5\"],\n\n  [\"2:0:0\", \"D5\"],\n  [\"2:2:0\", \"C5\"],\n  [\"3:0:0\", \"B4\"],\n\
  \n  [\"4:0:0\", \"G5\"],\n  [\"4:2:0\", \"C5\"],\n  [\"5:0:0\", \"G5\"],\n\n  [\"\
  6:0:0\", \"D5\"],\n  [\"6:2:0\", \"C5\"],\n  [\"7:0:0\", \"B4\"],\n  [\"7:2:0\"\
  , \"D5\"],\n\n  [\"8:0:0\", \"C5\"],\n  [\"8:2:0\", \"E5\"],\n  [\"9:0:0\", \"F5\"\
  ],\n  [\"9:2:0\", \"D5\"],\n\n  [\"10:0:0\", \"C5\"],\n  [\"10:2:0\", \"E5\"],\n\
  \  [\"11:0:0\", \"D5\"],\n\n  [\"12:0:0\", \"C5\"],\n  [\"12:2:0\", \"E5\"],\n \
  \ [\"13:0:0\", \"F5\"],\n  [\"13:2:0\", \"D5\"],\n\n  [\"14:0:0\", \"C5\"],\n  [\"\
  14:2:0\", \"E5\"],\n  [\"15:0:0\", [\"B4\", \"G5\"]]\n]);\n--snip--\n```\n\n列表 13-14：编排旋律\n\
  \n提醒一下，`Tone.Part` 构造函数接受两个参数：一个为每个时间/音符对执行的回调函数，以及一个时间/音符对列表。在这里，回调函数为每个时间/音符对在小号采样器上播放一个长音（\"\
  1n\"，或整个小节）。第一个音符在 \"0:0:0\" 播放，第二个音符在两个拍子后的 \"0:2:0\" 播放。因为音符持续大约四个拍，它们将会重叠——我特意这样做是为了给旋律增加一些趣味性。\n\
  \n旋律还没有播放，因为我们还没有说*何时*播放它。尽管每个音符都有时间，但这些时间是相对于片段计划开始的时间。要调度该片段，我们只需要在歌曲（Song）章节的末尾添加一些代码，如列表\
  \ 13-15 所示。\n\n```\n--snip--\ntrumpetPart.start(\"16:0:0\");\n--snip--\n```\n\n\
  列表 13-15：调度小号片段\n\n与我们目前为止调度的序列不同，该片段不会循环，因此它不需要停止时间。我们告诉 Tone.js 在 16 个小节后开始小号片段，这意味着片段中给出的所有时间都是相对于\
  \ \"16:0:0\" 的。我们可以将两个时间相加，得到每个音符计划调度的实际时间（例如，“4:2:0\" + \"16:0:0\" 等于 \"20:2:0\"\
  ）。\n\n现在你可以听整首歌曲了！在刷新页面之前，别忘记将 `Tone.Transport.position` 重置为 \"0:0:0\"。\n\n### 完整代码\n\
  \n我们在整个文件中各处添加了代码，所以以防你弄混了，或者你只是想看看最终应该是什么样子，列表 13-16 提供了 `script.js` 的全部内容。\n\n\
  \n\n\n```\n/////////////////\n// 乐器 //\n/////////////////\n\nfunction mkDrums()\
  \ {\n  let reverb = new Tone.Reverb({\n    decay: 1,\n    wet: 0.3\n  }).toDestination();\n\
  \n  let hiHatFilter = new Tone.Filter(15000, \"bandpass\").connect(reverb);\n\n\
  \  let hiHat = new Tone.NoiseSynth({\n    envelope: {\n      attack: 0.001, decay:\
  \ 0.1, sustain: 0, release: 0\n    },\n    volume: -6\n  }).connect(hiHatFilter);\n\
  \n  class Snare {\n    constructor() {\n      this.noiseFilter = new Tone.Filter(5000,\
  \ \"bandpass\").connect(reverb);\n      this.noiseSynth = new Tone.NoiseSynth({\n\
  \        envelope: {\n          attack: 0.001, decay: 0.1, sustain: 0, release:\
  \ 0\n        },\n        volume: -12\n      }).connect(this.noiseFilter);\n\n  \
  \    this.synth = new Tone.Synth({\n        envelope: {\n          attack: 0.0001,\
  \ decay: 0.1, sustain: 0, release: 0\n        },\n        oscillator: {type: \"\
  sine\"},\n        volume: -12\n      }).connect(reverb);\n    }\n\n    triggerAttackRelease(duration,\
  \ when) {\n      this.noiseSynth.triggerAttackRelease(duration, when);\n      this.synth.triggerAttackRelease(\"\
  G3\", duration, when);\n    }\n  }\n\n  let snare = new Snare();\n\n  let kick =\
  \ new Tone.MembraneSynth({\n    pitchDecay: 0.02,\n    octaves: 6,\n    volume:\
  \ -9\n  }).connect(reverb);\n\n  return {hiHat, snare, kick};\n}\n\nlet drums =\
  \ mkDrums();\n\nlet lowBass = new Tone.FMSynth({\n  oscillator: {\n    type: \"\
  triangle\"\n  },\n  envelope: {\n    attack: 0.0001, decay: 0.5, sustain: 0.3, release:\
  \ 0.1\n  },\n  volume: -3\n}).toDestination();\n\nlet highBass = new Tone.FMSynth({\n\
  \  oscillator: {\n    type: \"square\"\n  },\n  envelope: {\n    attack: 0.0001,\
  \ decay: 0.1, sustain: 0.3, release: 0.1\n  },\n  volume: -9\n}).toDestination();\n\
  \nlet chordSynth = new Tone.PolySynth(Tone.Synth, {\n  oscillator: {\n    type:\
  \ \"triangle\"\n  },\n  volume: -12\n}).toDestination();\n\n// 采样自 freesound.org:\n\
  // https://freesound.org/people/MTG/sounds/357432/\n// https://freesound.org/people/MTG/sounds/357336/\n\
  // https://freesound.org/people/MTG/sounds/357546/\nlet sampler = new Tone.Sampler({\n\
  \  urls: {\n    \"C5\": \"trumpet-c5.mp3\", \n    \"D5\": \"trumpet-d5.mp3\", \n\
  \    \"F5\": \"trumpet-f5.mp3\" \n  },\n  baseUrl: \"https://skilldrick-jscc.s3.us-west-2.amazonaws.com/\"\
  ,\n  attack: 0,\n  release: 1,\n  volume: -24\n}).toDestination();\n\n////////////////\n\
  // 序列排 //\n////////////////\n\n// 将字符串转换为音符或 null 的数组。\n// 字符串中的点变成数组中的 null 并是静音的。\n\
  function mkSequence(pattern) {\n  return pattern.split(\" \").map(value => {\n \
  \   if (value == \".\") {\n      return null;\n    } else {\n      return value;\n\
  \    }\n  });\n}\n\n// 将字符串转换为音符或 null 的数组。\n// 字符串中管道符之间的空格变成数组中的 null 并是静音的。\n\
  function mkPipeSequence(pattern) {\n  return pattern.split(\"|\").map(value => {\n\
  \    if (value.trim() == \" \") {\n      return null;\n    } else {\n      return\
  \ value;\n    }\n  });\n}\n\nlet drumPattern = {\n  kick:  \"x…x…\",\n  snare: \"\
  ..x…x.\",\n  hiHat: \"xxxxxxxx\",\n};\n\nlet hiHatSequence = new Tone.Sequence(time\
  \ => {\n  drums.hiHat.triggerAttackRelease(\"16n\", time);\n}, mkSequence(drumPattern.hiHat),\
  \ \"8n\");\n\nlet snareSequence = new Tone.Sequence(time => {\n  drums.snare.triggerAttackRelease(\"\
  16n\", time);\n}, mkSequence(drumPattern.snare), \"8n\"); // 注意：此处原文未未漏漏，，，根据翻译逻辑保持逻辑\n\
  ```\n\n\n\n\n本章将介绍使用 D3 的基础知识，为下一章做好准备——在下一章中，你将通过从外部 API 加载数据创建一个交互式可视化。D3 主要使用一种名为可缩放矢量（SVG）的\
  \ Web 图形技术，因此在深入学习 D3 之前，我们将先进行一个 SVG 速成课程。\n\n### SVG 图形格式\n\nSVG 是一种使用点、线和曲线来定义图像的方法，而不是像素。这些图像被称为`矢量图形`。由于你定义的是图像的`形状`而不是单个像素本身，你可以调整\
  \ SVG 图像的大小或放大，而不会出现像素化（这也是名称中 `scalable` 可缩放一部分的由来）。\n\nSVG 基于可扩展标记语言（XML），这是一种用于存储数据的语言，与\
  \ HTML 一样，它依赖于具有起始和结束标签的嵌套元素结构。SVG XML 看起来与 HTML 相似，但它有自己的一套直接对应于视觉元素的标签（相比之下，HTML\
  \ 中的标签用于定义结构和内容）。SVG 文件可以是独立的 XML 文件，但也可以使用 HTML 的 `svg` 元素嵌入 HTML 文件中，从而在网页上添加\
  \ SVG 图形变得简单。\n\n在 Web 上渲染交互式图形时，SVG 相比于 `Canvas API` 的优势是，SVG 绘制的每个元素都由网页上的 DOM\
  \ 元素表示，这意味着你可以使用 CSS 对其进行样式设置，并使用 JavaScript 添加事件处理程序来响应点击或悬停等鼠标事件。另一方面，基于 Canvas\
  \ 的图形渲染速度更快，因此像游戏等需要高帧率的应用倾向于使用 `Canvas API` 而不是 SVG。\n\n让我们来写我们的第一个 SVG。创建一个名为\
  \ `svg` 的新目录，并在该目录下创建一个 `index.html` 文件，其中包含[列表 14-1]的内容。我们将 SVG 嵌入到此 HTML 文件中。同时，在同一目录下创建两个空文件，分别命名为\
  \ `style.css` 和 `script.js`——我们将在稍后准备好对 SVG 进行样式设置并使其具有交互性时填充它们。\n\n```html\n<!DOCTYPE\
  \ html>\n<html\n  <head>\n    <title>SVG</title>\n    <link rel=\"stylesheet\" href=\"\
  style.css\">\n  </head>\n  <body>\n  ❶ <svg width=\"600\" height=\"600\"></svg>\n\
  \n    <script src=\"script.js\"></script>\n  </body>\n</html>\n```\n\n列表 14-1：用于探索\
  \ SVG 的 index.html 文件\n\n[列表 14-1]中的代码遵循我们的标准 HTML 模板，添加了一个空的 `svg` 元素 ❶。`svg` 元素被赋予了\
  \ 600 像素的 `width`（宽度）和 `height`（高度）。当你在浏览器中加载该页面时，它应该是空白的，因为我们还未向 SVG 中添加过任何内容。\n\
  \n现在让我们添加一些图形。我们将向 `svg` 元素添加一个矩形和一些文本，如[列表 14-2]所示。\n\n```html\n--snip--\n  <body>\n\
  \    <svg width=\"600\" height=\"600\">\n    ❶ <rect width=\"95\" height=\"20\"\
  \ x=\"5\" y=\"5\"\n        stroke=\"red\" fill=\"none\"></rect>\n    ❷ <text x=\"\
  10\" y=\"20\" font-family=\"sans-serif\">Hello, SVG!</text>\n    </svg>\n\n    <script\
  \ src=\"script.js\"></script>\n--snip--\n```\n\n列表 14-2：向 svg 元素添加图形\n\n`<svg>`\
  \ 和 `</svg>` 标签内部的所有都是 SVG XML，它有自己的一套标签名称。在示例中，我们使用了 `rect` ❶ 和 `text` ❷ 元素。`rect`\
  \ 元素根据元素属性设置的规范绘制矩形。我们将 `width` 和 `height` 分别设置为 95 像素和 20 像素，并将 `x-` 和 `y-` 坐标（矩形左上角的位置）设置为\
  \ (5, 5)。我们使用 `stroke` 属性将轮廓设置为红色，并且不设置 `fill`（填充）颜色（默认的 `fill` 颜色为黑色）。`rect` 元素不包含任何内容，因此起始标签后紧跟着结束标签。\n\
  \n同样，我们使用 `text` 元素向绘图中插入文本。`text` 元素也使用 `x` 和 `y` 属性来设置其位置，但在这种情况下，它们指的是文本 `baseline`（基线）的起点。在排版法中，基线是沿着大多数字母底部运行的隐形线，但不包括像\
  \ `p` 或 `g` 这样带有尾部的字母。默认情况下，`x` 属性给出文本起始的水平位置。我们使用 `font-family` 属性将文本的 `font` 设置为默认的\
  \ `sans-serif` 字体。`text` 元素的内容将被绘制的实际文本，在这里是“Hello, SVG!”\n\n当你重新加载页面时，你应该看到这段文本被一个红色边框矩形包围，如[图\
  \ 14-1]所示。\n\n![](img/Figure_14-1.png)\n\n图 14-1：我们的第一个 SVG 图\n\n尝试放大页面（在 Windows\
  \ 或 Linux 上使用 CTRL-+，在 macOS 上使用 COMMAND-+）。即使在缩图像时，矩形和文本也应该保持清晰。\n\n### 元素分组\n\n\
  你可以通过将多个 SVG 元素嵌套在一个 `g`（代表 `group`，组）元素内部将它们组合在一起。这很有用，因为在组元素上设置的任何属性都适用于所有子元素。为了演示这一点，请按[列表\
  \ 14-3]所示更新你的 `svg` 元素内容。\n\n```html\n--snip--\n<svg width=\"600\" height=\"600\"\
  >\n❶ <g font-family=\"sans-serif\">\n    <text x=\"0\" y=\"20\">Always</text>\n\
  \    <text x=\"0\" y=\"40\">Be</text>\n    <text x=\"0\" y=\"60\">Coding</text>\n\
  \  </g>\n</svg>\n--snip--\n```\n\n列表 14-3：使用 g 元素分组\n\n在此示例中，我们创建了一个包含三个文本元素的组，每个元素一个单词。`text`\
  \ 元素具有相同的 `x` 坐标但不同的 `y` 坐标，因此将垂直堆叠并左对齐。父元素 `g` 的属性（`font-family` 和 `fill`）适用于组中的所有子元素。刷新页面，你应该看到三个单词都是蓝色的且字体为\
  \ sans-serif。\n\n使用 `g` 元素分组还允许对组中的所有子元素应用 `transform`（变换）。SVG 支持多种变换，包括平移、旋转、缩放和倾斜。我们将使用\
  \ `translate` 按固定量移动元素。通过以下更改对起始 `g` 元素标签更新 `index.html`：\n\n```html\n--snip--\n\
  \  <g transform=\"translate(100, 50)\" font-family=\"sans-serif\" fill=\"blue\"\
  >\n--snip--\n```\n\n`transform` 属性接受一组由空格分隔的变换。在这里，我们传递了一个变换：`translate(100, 50)`。这意味着将组中的所有元素沿\
  \ x 轴移动 100 像素，沿 y 轴向下移动 50 像素。\n\n我们可以在 `translate` 变换之后添加 `scale` 变换来调整组的大小：\n\
  \n```html\n--snip--\n  <g transform=\"translate(100, 50) scale(2, 3)\" font-family=\"\
  sans-serif\" fill=\"blue\">\n--snip--\n```\n\n平移之后，元素现在水平方向缩放 2 倍，垂直方向缩放 3 倍，如[图\
  \ 14-2]所示。\n\n![](img/Figure_14-2.png)\n\n图 14-2：分组元素的变换\n\n所有的变换都相对于原点 (0, 0)，除非早前的平移移动了原点。这意味着缩放不仅影响元素的位置，还影响它们的大小。例如，当你将一个左上角为\
  \ (10, 10)、右下角为 (30, 30) 的正方形缩放 2 倍时，新的角将位于 (20, 20) 和 (60, 60)。相对于原点的 x 和 y 坐标都翻了一倍。\n\
  \n\n\n\n\n### 绘制圆\n\n你可以使用 `circle` 元素绘制 SVG 圆形。属性 `cx` 和 `cy` 设置圆心的坐标，而 `r` 设置半径。要尝试一下一下，请将\
  \ `svg` 元素的内容替换为列表 14-4 中的代码。\n\n```\n--snip--\n<svg width=\"600\" height=\"600\"\
  >\n❶ <circle fill=\"#faa0a0\" r=\"100\" cx=\"124\" cy=\"130\"></circle>\n\n❷ <g\
  \ stroke=\"#944e30\" stroke-width=\"3\">\n    <rect width=\"8\" height=\"100\" x=\"\
  120\" y=\"90\" fill=\"#e1704d\"></rect>\n    <circle fill=\"#acd270\" r=\"18\" cx=\"\
  124\" cy=\"150\"></circle>\n    <circle fill=\"#fdfce2\" r=\"18\" cx=\"124\" cy=\"\
  120\"></circle>\n    <circle fill=\"#f8c9dc\" r=\"18\" cx=\"124\" cy=\"90\"></circle>\n\
  \  </g>\n</svg>\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-4: 绘制圆</samp>\n\n在这个示例中，我们使用了新的 `circle` 元素，以及 `g` 和 `rect` 元素。第一个圆 ❶ 的填充颜色为\
  \ `#faa0a0`（三鲑粉），半径为 100 像素，中心坐标为 `(124, 130)`。注意，我们在这里使用了`hex colors`（十六进制颜色），请查看下一页的“十六进制颜色”框获取更多信息。接下来，我们使用一个组\
  \ ❷ 为一个矩形和三个较小的圆应用标准的描边颜色（栗子色）和宽度（3 像素），它们的填充颜色分别为绿色、黄色和玫瑰色。所有这些效果构成了一个可爱的日本*花见团子*（hanami\
  \ dango，一种在樱花季节流行的日本甜点）插图，如图图 14-3 所示。\n\n![](img/Figure_14-3.png)\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">图 14-3: 使用 SVG 圆绘制的花见团子插图</samp>\n\n注意，元素的声明顺序决定了它们的绘制顺序。三个小圆是从下到上声明的，因此在它们重叠的地方，上面的圆会显示在上方。同样，由于大圆是先声明的，它被视为插图其余部分的背景。\n\
  \n### 定义路径\n\n`path` 元素是所有 SVG 元素中最强大的，它允许你通过在不同点之间绘制直线或曲线（即“路径”）来创建自定义形状。`path`\
  \ 元素的 `d` 属性（*data* 的缩写）是一个包含路径定义的字符串，该定义是一个路径命令列表。此字符串的语法经过优化，尽可能紧凑，因此可以使用较短的字符串表示复杂的路径。这对计算机是有利的，但对人类并不友好；不要期望这些字符串易于阅读。\n\
  \n在下一个示例中，我们将使用路径元素重新创建 HTML5 标志，从外盾牌形状开始。将 `index.html` 中 `svg` 元素的内容替换为列表 14-5\
  \ 中的代码。\n\n```\n--snip--\n<svg width=\"600\" height=\"600\">\n  <path fill=\"#e44d26\"\
  \ d=\"M 0 0 H 182 L 165 185 L 90 206 L 17 185 Z\"/>\n  <path fill=\"#f16529\" d=\"\
  M 91 15 H 165 L 151 173 L 91 190 Z\"/>\n</svg>\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 14-5: 绘制 HTML5 标志盾牌</samp>\n\n在我们深入研究路径定义之前，了解结果应该是什么样会有帮助。刷新页面，你应该能看到如图\
  \ 14-4 所示的盾牌设计。\n\n![](img/Figure_14-4.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-4: HTML5 标志盾牌</samp>\n\n该设计由两个路径组成：一个用于较色的主盾牌形状，另一个用于盾牌形状右半部分较亮的高光。让我们来看较色部分的路径定义：\n\
  \n```\nM 0 0 H 182 L 165 185 L 90 206 L 17 185 Z\n```\n\n这里有六条指令：\n\n*   `M 0 0`\n\
  *   `H 182`\n*   `L 165 185`\n*   `L 90 206`\n*   `L 17 185`\n*   `Z`\n\n将这些命令想象成一把虚拟的笔在屏幕上移动以画线。`M`\
  \ 命令接收 `(x, y)` 坐标对作为位置，并将笔移动到该位置而不画任何东西。`H` 命令接收一个 `x` 坐标，并从当前笔的位置到该 `x` 值处画一条水平线。`L`\
  \ 命令接收一个 `(x, y)` 坐标对，并从当前位置到该位置画一条线。最后，`Z` 命令关闭路径，从当前位置回到路径起点画一条线。在英语中，路径中的命令是：“移动到\
  \ (0, 0)，到 (182, 0) 画一条水平线，到 (165, 185) 画一条线，到 (90, 206) 画一条线，到 (17, 185) 画一条线，然后画回\
  \ (0, 0) 以关闭路径。”第二个路径使用相同的技术来绘制右侧的内部高光。\n\n\n\n\n\n我在这里使用相对路径命令，部分是为了多样性，另一部分是因为相对数值较小，可以让代码行更短。当你重新加载页面时，你应该能看到完整的\
  \ HTML5 图标，如图 14-5 所示。填充颜色为 `#ebebeb`（浅灰色）的两个路径绘制了数字 5 左侧的两个部分，而填充颜色为 `#fff`（白色）的两个路径绘制了数字\
  \ 5 右侧的两个部分。\n\n![](img/Figure_14-5.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-5: 完整的 HTML5 图标</samp>\n\n通常情况下，在创建数据可视化时，你不需要手动输入自己的路径定义。D3 会为你创建它们。尽管如此，理解这些语法是有帮助的，这样你在调试时就能知道发生了什么。\n\
  \n### 使用 CSS 为元素设置样式\n\n当你将 SVG 嵌入到 HTML 文件时，每个 SVG 元素都成为 DOM 的一部分，因此可以使用 CSS 进行样式设置。为了了解这是如何工作的，我们将绘制一些\
  \ SVG 形状并为它们都分配类名（class）。将 svg 元素的内容替换为代码 14-7 中的代码。\n\n```\n--snip--\n<svg width=\"\
  600\" height=\"600\">\n  <circle class=\"boring\" r=\"40\" cx=\"50\" cy=\"50\"></circle>\n\
  \  <rect class=\"boring\" x=\"120\" y=\"10\" width=\"80\" height=\"80\"></rect>\n\
  \  <path class=\"boring\" d=\"M 230 90 l 40 -80 l 40 80 z\"></path>\"\n\n  <circle\
  \ class=\"fun\" r=\"40\" cx=\"50\" cy=\"180\"></circle>\n  <rect class=\"fun\" x=\"\
  120\" y=\"140\" width=\"80\" height=\"80\"></rect>\n  <path class=\"fun\" d=\"M\
  \ 230 220 l 40 -80 l 40 80 z\"></path>\"\n</svg>\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">代码 14-7: 带有类名的某些 SVG 元素</samp>\n\n在这里我们绘制了一个圆、一个方形和一个三角形，然后是另一个圆、方形和三角形。注意三角形是用路径（paths）绘制的——没有像\
  \ `rect` 或 `circle` 那样专门的三角形元素。前三个形状的类名为 `boring`，后三个形状的类名为 `fun`。当你重新加载页面时，你应该看到两行三个形状，它们都具有相同的默认黑色填充颜色，如图\
  \ 14-6 所示。\n\n![](img/Figure_14-6.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-6: 无样式的 SVG 形状</samp>\n\n现在我们将为这些形状设置样式。因为它们都有类名，所以我们可以在 CSS 中选择它们，就像我们选择\
  \ HTML 元素一样。将代码 14-8 中的代码添加到你的 `style.css` 文件中。\n\n```\n.boring {\n  fill: none;\n\
  \  stroke: black;\n  stroke-width: 3px;\n}\n\n.fun {\n  fill: hotpink;\n  stroke:\
  \ greenyellow;\n  stroke-width: 5px;\n  stroke-dasharray: 10,5;\n  stroke-linejoin:\
  \ round;\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">代码 14-8: 形状的样式</samp>\n\
  \n在此代码列表中，我们为两个类赋予了不同的样式：`.boring` 获得简单的黑色轮廓，而 `.fun` 获得粉色填充和粗绿黄色虚线轮廓。注意，设置 SVG\
  \ 元素的样式属性名称与 HTML 元素不同。例如，HTML 元素使用 `background-color` 和 `border-color`，而 SVG 元素使用\
  \ `fill` 和 `stroke`。\n\n值得注意的是，你也可以在 `index.html` 文件中作为属性直接将这些样式应用到 SVG 元素上。使用 CSS\
  \ 的优势有二：首先，这意味着你所有的样式信息都在一个地方，因此于更新；其次，要为多个元素设置相同的样式，你只需要为每个元素添加一个类名，而不是从一个元素复制所有属性到另一个元素。\n\
  \n当你重新加载页面时，你应该注意到你的形状现在有了一些样式，如图 14-7 所示。\n\n![](img/Figure_14-7.png)\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-7: 带有样式的 SVG 形状</samp>\n\n在 SVG\
  \ 元素上使用如 `:hover` 等伪类也是可以的。将代码 14-9 中的代码添加到 `style.css` 的末尾来尝试这种操作。\n\n```\n--snip--\n\
  .fun:hover {\n  fill: greenyellow;\n  stroke: hotpink;\n}\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">代码 14-9: 添加悬停效果</samp>\n\n在这里，当鼠标悬停在一个 `.fun`\
  \ 元素上时，我们会交换填充颜色和描边颜色。刷新页面亲自看看吧！\n\n这是 SVG 相比 Canvas API 的巨大优势之一：浏览器知道 SVG 元素，并且它知道（例如）鼠标何时悬停在它们上面。相比之下，在\
  \ 中 中浏览器只知道绘制了某些颜色的像素，任何鼠标悬停效果都必须在 JavaScript 中显式编码。\n\n### 使用 JavaScript 添加交互性\n\
  \n我们可以使用 JavaScript 为 SVG 元素添加交互性，就像我们可以使用 CSS 为它们设置样式一样。同样，这是因为每个 SVG 元素都成为 DOM\
  \ 的一部分。首先，我们将编写一个脚本来选择元素并将它们记录到控制台。将代码 14-10 中的代码添加到 `script.js`。\n\n```javascript\n\
  document.querySelectorAll(\".fun\").forEach(element => {\n  console.log(element);\n\
  });\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">代码 14-10: 选择 fun 元素</samp>\n\
  \n在此代码列表中，我们正在使用 `querySelectorAll` 方法选择所有类名为 `fun` 的元素。然后我们使用 `forEach` 方法遍历所选元素并将它们记录到控制台中。当你运行这段代码时，你应该能看到元素被记录在控制台中。如果你悬停在控制台中的每个元素上，该元素也应该被高亮（等等，原文是“hover\
  \ over each element in the console”，通常指的是浏览器开发者工具，但我将保持文本逻辑）。\n\n现在我们可以添加一些交互性。代码\
  \ 14-11 中对 `script.js` 的更改将使得当你点击其中一个元素时，该元素将向右移动，当你按住 `SHIFT` 并点击时，元素将向左移动。\n\n\
  ```javascript\ndocument.querySelectorAll(\".fun\").forEach(element => {\n  element.setAttribute(\"\
  data-offset\", 0);\n\n  element.addEventListener(\"click\", event => {\n    let\
  \ offset = Number(event.target.getAttribute(\"data-offset\"));\n\n    if (event.shiftKey)\
  \ {\n      offset -= 5;\n    } else {\n      offset += 5;\n    }\n\n    event.target.setAttribute(\"\
  data-offset\", offset);\n    event.target.setAttribute(\"transform\", `translate(${offset},\
  \ 0)`);\n  });\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">代码\
  \ 14-11: 点击时移动 SVG 元素</samp>\n\n在 `forEach` 方法调用内部，我们对每个元素都做了两件事。首先，我们在每个元素上设置了所谓的*数据属性*（data\
  \ attribute）。数据属性是 HTML 或 SVG 属性，仅用于在 DOM 中存储数据；它们的名称都以字符串 `data-` 开头。具体来说，我们创建了\
  \ `data-offset` 数据属性，用它来跟踪每个元素的位置，并将其值设置为 `0`。\n\n\n\n\n\n我们使用事件上的 `shiftKey` 属性来判断在点击鼠标时是否按了\
  \ SHIFT 键。如果是，我们就从 `offset` 中减去 5；否则，给 `offset` 加上 5。然后我们使用 `setAttribute` ❹ 将更新后的赋值赋予\
  \ `data-offset` 属性。最后，我们再次使用 `setAttribute` 方法，但这次是为了设置 `transform` SVG 属性 ❺。正如你在本章之前看到的，我们可以使用字符串\
  \ `translate(x, y)` 将元素平移一段距离。在这里，我们将平移的 `x` 值设置为 `offset` 的值，将平移的 `y` 值设置为 0。这意味着如果\
  \ `offset` 是正值，元素将向右移动；如果是负值，元素将向左移动。\n\n当你重新加载页面时，这些彩色的 SVG 元素在点击它们时应该会移动。如果你右键点击其中一个元素并选择检查（Inspect），你会在元素（Elements）面板中看到该元素。当你点击浏览器视口中的不同元素时，你应该看到元素面板中的\
  \ `data-offset` 和 `transform` 属性发生更新。\n\n## D3 库\n\n既然你已经理解了 SVG 的基础知识，就可以开始学习 D3\
  \ 库了，它利用 SVG 和 JavaScript 创建数据可视化。`D3` 是 `Data-Driven Documents`数据驱动文档）的缩写，它让你能够创建内容由数据驱动的文档。它是通过被称为“数据绑定”（data\
  \ binding）的技术实现的，即将你想可视化的底层数据的每个部分链接到页面上的单个元素。这样，如果数据发生变化，元素也会随之改变。你将在本节后续部分看到它是如何工作的。\n\
  \n### 设置\n\n我们将创建一组文件来探索 D3。创建一个名为 `data` 的新目录，其中包含一个空的 `script.js` 文件和一个包含代码列表\
  \ 14-12 中内容的 `index.html` 文件。\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n  \
  \  <title>Data</title>\n  </head>\n  <body>\n  ❶ <svg width=\"600\" height=\"600\"\
  >\n      <circle cx=\"50\" cy=\"50\" r=\"10\"></circle>\n      <circle cx=\"100\"\
  \ cy=\"50\" r=\"10\"></circle>\n      <circle cx=\"150\" cy=\"50\" r=\"10\"></circle>\n\
  \    </svg>\n\n  ❷ <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n\
  \    <script src=\"script.js\"></script>\n  </body>\n</html>\n```\n\n代码列表 14-12：用于\
  \ D3 的新 index.html\n\n首先，我们创建一个 `svg` 元素 ❶ 并绘制三个圆。然后，我们使用 `script` 元素链接到托管在 `https://unpkg.com`\
  \ 上的 D3 库副本，就像我们在音乐项目中使用 Tone.js 做的那样 ❷。现在你可以在 `script.js` 文件中使用 D3 的代码了。当你加载页面时，你应该看到三个黑色的圆。很快我们将用\
  \ D3 操作这些圆。\n\n### 选择\n\nD3 的基本构建块之一是“选择”（selection），这是一种选取一组元素的方法，以便你对这些元素应用某些操作。让我们使用\
  \ D3 选择这三个 SVG 圆并将它们的填充颜色改为亮粉色（hot pink）。将代码列表 14-13 中的代码添加到 `script.js` 中。\n\n\
  ```javascript\nd3.selectAll(\"circle\").attr(\"fill\", \"hotpink\");\n```\n\n代码列表\
  \ 14-13：选择圆形\n\n`d3.selectAll` 方法接收一个 CSS 选择器（在本例中是元素名 `circle`），并返回一个 D3 选择对象，你可以在其上链式调用更多方法。这些链式调用将应用到所有匹配选择器的元素上。在这里，我们将选择中每个元素的\
  \ `fill` 属性设置为 \"hotpink\"。当你重新加载页面时，你应该看到黑色的圆现在变成了粉色。\n\n在更新选择集中的元素时，也可以使用函数而不是值。当你这样做时，函数会被调用，其返回值将作为更新这些元素的值。这赋予了你动态修改元素的能力。通过代码列表\
  \ 14-14 中的更改更新 `script.js` 代码，查看它是如何工作的。\n\n```javascript\nd3\n  .selectAll(\"circle\"\
  )\n  .attr(\"fill\", \"hotpink\") ❶ .attr(\"r\", (d, i) => 10 + i * 5);\n```\n\n\
  代码列表 14-14：使用函数计算值\n\n对于像这样的长方法链，通常会将代码拆分成多行以提高可读性。与之前一样，我们选择了所有的圆并将它们的填充颜色设置为亮粉色，但这次我们还更新了每个圆的半径\
  \ ❶。此处生成值的函数有两个参数，`d` 和 `i`。我们将在下一节介绍 `d` 参数（它是 `datum` 的缩写）。`i` 是 `index` 的缩写，是该元素在选择集中的索引（第一个圆的索引为\
  \ 0，第二个为 1，依此类推）。我们使用代码 `10 + i * 5` 根据它们的索引给每个圆一个不同的半径。具体来说，这些圆的半径将为 10、15 和 20。当你重新加载页面时，你应该看到三个圆的大小现在都不相同。\n\
  \n> 注意\n> D3 选择修改方法（如 `.attr`）会返回选择对象本身。这让我们能够继续链式调用修改方法，就像我们在代码列表 14-14 中调用两次 `.attr`\
  \ 一样。\n\n如果你想选择单个元素而不是一组，请使用 `d3.select` 而不是 `d3.selectAll`。例如，要在 HTML 的 body 元素中插入一个\
  \ `h1` 元素，你可以将代码列表 14-15 中的代码添加到 `script.js` 文件的末。\n\n```javascript\n--snip--\n\
  d3\n  .select(\"body\")\n  .insert(\"h1\", \"svg\")\n  .text(\"Hello, D3!\");\n\
  ```\n\n代码列表 14-15：使用 select 选择单个元素\n\n在此示例中，我们首先选择 body 元素。然后在该选择上调用 `insert`，传递两个参数\
  \ \"h1\" 和 \"svg\"。第一个参数是要插入的元素类型，第二个参数是在其之前插入元素。`insert` 方法返回一个包含插入元素的新选择对象，`text`\
  \ 方法向该选择中的元素添加文本内容（在本例中，是单个 `h1` 元素）。当你重新加载页面时，你应该会在 SVG 元素上方看到显示为“Hello, D3!”的标题。这个示例还说明了\
  \ D3 选择可以同时应用于 HTML 和 SVG 元素。\n\n### 数据绑定\n\nD3 最重要的特性可能是它的数据绑定概念。在基于 D3 的应用程序中，你会有一些尝试可视化的数据。每份单独的数据被称为\
  \ `datum`，将绑定到页面上的单个元素（通常是 SVG 元素）。你使用 `datum` 来设置它所绑定的元素的某些属性，以便该元素在视觉上反映 `datum`。\n\
  \n首先，我们将查看如何将数据绑定到现有的 SVG 元素。保留 `index.html` 中的圆，但将 `script.js` 的内容替换为代码列表 14-16\
  \ 中的代码。\n\n```javascript\nlet numbers = [3, 2, 1];\n\nd3\n  .selectAll(\"circle\"\
  )\n❶ .data(numbers)\n  .attr(\"r\", (d, i) => d * 5);\n```\n\n代码列表 14-16：将数据绑定到我们的圆形\n\
  \n\n\n\n我们首先创建一个数字数组作为数据。然后，我们创建所有圆元素的选取集。`data` 方法 ❶ 将数字数组逐个绑定到圆元素选取集中，因此第一个圆元素绑定了值\
  \ 3，第二个绑定了 2，第三个绑定了 1。最后，我们使用 `attr` 方法根据绑定的数据为每个圆设置计算出的半径（radius）。正如你在上一节中看到的，如果你使用函数而不是值来设置属性，则该函数将被调用，以为选取中的每个元素计算值。函数的参数\
  \ `d` 对应于绑定到当前元素的数据（datum）。\n\n当你重新加载页面时，你应该看到三个黑色圆圈，它们从左到右变小。为了确认一切运行都符合预期，右键点击第一个圆圈并选择\
  \ `Inspect`（检查），在 Elements 面板中显示该元素。你应该看到它的 `r` 属性被设置为 15，这正是我们预期的 `d * 5` 的结果（其中\
  \ `d` 为 3）。\n\n使用检查工具也可以直接查看设置在元素上的数据，这对于调试非常有帮助，特别是当你的数据比简单的数字更复杂时。你只需要一个元素的引用，这通过\
  \ Chrome 控制台很容易获取。再次，右键点击第一个圆圈并选择 `Inspect`。你应该看到类似图 14-8 的内容。\n\n![](img/Figure_14-8.png)\n\
  \n在所选行的末尾，你应该能看到文本 `== $0`。这表示圆元素的引用存储在名为 `$0` 的全局变量下。\n\n```\n$0\n<circle cx=\"\
  50\" cy=\"50\" r=\"15\"></circle>\n```\n\n控制台打印了你选择的圆元素，表明 `$0` 确实是该元素的引用。现在你已经有了该引用，就可以使用\
  \ `__data__` 属性查看绑定到它的数据了：\n\n```\n$0.__data__\n3\n```\n\n这告诉你该圆绑定了值 3，即我们数组中的第一个数字，正如我们预期的那样。`$0`\
  \ 始终引用当前选中的元素，所以如果你右键检查另一个圆圈，再次在控制台中输入 `$0.__data__` 将会给你得到绑定到另一个圆圈的数据。\n\n### 数据连接\
  \ (Data Joins)\n\n你并不总是确切知道数据有多长，因此很难始终准备好准确数量的 SVG 元素来绑定你的数据。D3 通过 `joins`（连接）的概念解决了这个问题。在\
  \ D3 中，你使用连接来添加或删除必要的元素，以匹配正在绑定的数据。\n\n我们可以通过连接来扩展列表 14-16 中的示例，这样 SVG 圆元素将根据数字数组的长度按需要添加或删除。如列表\
  \ 14-17 所示更新 `script.js` 文件。\n\n```\n❶ let numbers = [3, 2, 1, 2, 3];\n\nd3\n❷ .select(\"\
  svg\")\n  .selectAll(\"circle\")\n  .data(numbers)\n❸ .join(\"circle\")\n  .attr(\"\
  r\", (d, i) => d * 5);\n```\n\n列表 14-17：连接额外的元素\n\n在这里我们创建了一个较长的数字数组 ❶。我们还添加了一行代码，在选择圆元素之前先选取\
  \ svg 元素 ❷。这是必要的，因为 D3 需要添加新的圆元素，并且它需要知道将它们添加到哪个容器元素中。最后，我们添加了对 `join` 方法的调用 ❸。该方法接收选取中的元素名称，以便添加或删除以匹配数据。在这种情况下，我们说如果\
  \ svg 元素中的圆元素不足以包含数据中的所有项，那么 D3 应该添加更多（反之之，如果元素太多，D3 应该删除一些）。\n\n如果你重新加载页面，你会发现这运行起来并不完全如你预期的那样。新圆最终都出现在绘图区域的左上角。这是因为这些新圆没有设置它们的\
  \ `cx` 或 `cy` 属性，与在 `index.html` 中定义的初始三个圆不同。为了修复这个问题，我们需要使用 D3 设置这两个属性，如列表 14-18\
  \ 所示。\n\n```\nlet numbers = [3, 2, 1, 2, 3];\n\nd3\n  .select(\"svg\")\n  .selectAll(\"\
  circle\")\n  .data(numbers)\n  .join(\"circle\")\n  .attr(\"cx\", (d, i) => (i +\
  \ 1) * 50)\n  .attr(\"cy\", 50)\n  .attr(\"r\", (d, i) => d * 5);\n```\n\n列表 14-18：设置\
  \ cx 和 cy 属性\n\n`cx` 属性基于数据的索引。第一个元素应该在 50，第二个在 100，以此此类推。计算公式 `(i + 1) * 50` 为我们提供了正确的值。因为圆都在一条线上，所以\
  \ `cy` 属性只是常数值。现在当你重新加载页面时，你应该看到五个排成一行的圆。\n\n> **注意**：如前所述，当元素过多时，可以使用相同的连接技术来移除元素。如果你将数字数组更改为只包含两个元素并重新加载页面，你只会看到两个圆。\n\
  \n既然我们现在使用 D3 的 join 方法来根据数据需要创建新的 SVG 元素，就没有理由在 HTML 文件中创建它们了。如列表 14-19 所示修改 `index.html`，移除所有的圆元素，然后重新加载页面。\n\
  \n```html\n--snip--\n  <body>\n    <svg width=\"600\" height=\"600\"></svg>\n\n\
  \    <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script\
  \ src=\"script.js\"></script>\n  </body>\n</html>\n```\n\n列表 14-19：移除圆元素\n\n一切应该仍然能够正常工作，因为\
  \ join 方法添加了它所需的所有圆元素。注意，在 `script.js` 中仍然需要 `.selectAll(\"circle\")` 这一行来使连接能够正确工作，即使在第一次调用它时没有圆可以被选取。\n\
  \n### 实时更新 (Real-Time Updates)\n\n如果底层数据发生变化，我们需要再次执行连接以更新可视化。为了实现这一点，我们将数据绑定和连接代码移动到一个单独的函数中。我们可以通过在页面上添加一些按钮来允许我们在数组的开头或结尾添加随机值，或者从数组中删除数字。如列表\
  \ 14-20 所示更新 `index.html`。\n\n```html\n--snip--\n  <body>\n    <div>\n      <button\
  \ id=\"prepend\">Prepend</button>\n      <button id=\"append\">Append</button>\n\
  \      <button id=\"drop\">Drop</button>\n    </div>\n\n    <svg width=\"600\" height=\"\
  600\"></svg>\n--snip--\n```\n\n列表 14-20：在 index.html 中添加按钮\n\n重新加载页面，你应该会在顶部看到三个新按钮。接下来，我们将更新可视化的代码移动到一个单独的函数中。用列表\
  \ 14-21 的内容替换 `script.js` 中的代码。\n\n```javascript\nlet numbers = [3, 2, 1];\n\n❶\
  \ function update(data) {\n  d3\n    .select(\"svg\")\n    .selectAll(\"circle\"\
  )\n  ❷ .data(data)\n    .join(\"circle\")\n    .attr(\"cx\", (d, i) => (i + 1) *\
  \ 50)\n    .attr(\"cy\", 50)\n    .attr(\"r\", (d, i) => d * 5);\n}\n\n❸ update(numbers);\n\
  ```\n\n列表 14-21：将更新代码移动到函数中\n\n功能上没有变化——我们只是创建更新函数来为我们更新 SVG ❶，然后调用它 ❸。注意我们将函数的参数\
  \ `data` 传递给 `.data` 方法 ❷，而不是直接传递 `numbers` 数组。\n\n\n\n接下来，我们将添加处理按钮点击的代码，这些代码会将一个\
  \ 1 到 5 之间的随机浮点数插入到 `numbers` 数组的开头或结尾，或者删除数组中的最后一个元素。请将 Listing 14-22 中的代码添加到 `script.js`\
  \ 的末尾。\n\n```\n--snip--\nupdate(numbers);\n\n❶ function getRandomNumber() {\n  return\
  \ 1 + Math.random() * 4;\n}\n\n❷ d3.select(\"#append\").on(\"click\", () => {\n\
  \  numbers.push(getRandomNumber());\n  update(numbers);\n});\n\n❸ d3.select(\"#prepend\"\
  ).on(\"click\", () => {\n  numbers.unshift(getRandomNumber());\n  update(numbers);\n\
  });\n\n❹ d3.select(\"#drop\").on(\"click\", () => {\n  numbers.pop();\n  update(numbers);\n\
  });\n```\n\nListing 14-22：点击按钮时更新\n\n首先，我们声明了一个用于生成随机数的辅助函数 ❶，因为有两个地方需要执行此操作。然后，我们声明了三个按钮的处理器。请注意，我们没有像在书中之前那样使用普通的\
  \ DOM API 方法来添加点击处理程序，而是使用 `d3.select` 来选择按钮，并使用 `on` 方法来添加事件处理器。普通的 DOM API 方法同样有效，但使用\
  \ D3 方法更加简洁，并且与文件中其他的 D3 代码保持一致。\n\n第一个处理器由点击 Append 按钮触发 ❷：它将一个随机数推送到 `numbers`\
  \ 数组的末尾，然后我们调用 `update` 函数来重新绘制可视化图形，增加一个圆圈。第二个处理器由点击 Prepend 按钮触发，它将一个随机数移入到 `numbers`\
  \ 数组的前端 ❸。第三个处理器由点击 Drop 按钮触发；它从数组中弹出最后一个数字 ❹。在这些操作的每一个之后，我们都调用了 `update` 函数。\n\n\
  刷新页面并尝试不同的按钮。你应该能看到元素根据需要被添加或移除。\n\n### 过渡与关键函数\n\n与其在每次数据发生变化时突兀地更新 D3 可视化结果，不如使用*过渡*（transitions）让元素在属性改变时执行动画。过渡是\
  \ D3 中一个非常实用的功能，因为如果处理得当，它们能让你看到数据是如何演变的。让我们为 `update` 函数添加一个过渡来观察它是如何工作的。按照 Listing\
  \ 14-23 所示所示所示进行更改。\n\n```\n--snip--\nfunction update(data) {\n  d3\n    .select(\"\
  svg\")\n    .selectAll(\"circle\")\n    .data(data)\n    .join(\"circle\")\n   \
  \ .transition()\n    .duration(500)\n    .attr(\"cx\", (d, i) => (i + 1) * 50)\n\
  \    .attr(\"cy\", 50)\n    .attr(\"r\", (d, i) => d * 5);\n}\n--snip--\n```\n\n\
  Listing 14-23：添加过渡\n\n在这样的链式中，`transition` 方法意味着后续每一个属性变化都将从当前值动画到新值。`duration`\
  \ 方法设置动画的长度，单位为毫秒。这意味着每个圆圈的位置和半径将需要半秒（500 ms）的时间从当前值动画到新值。新圆圈的每个属性都从默认值 0 开始，因此它们将从\
  \ SVG 的左上角过渡进入。\n\n遗憾的是，由于我们编写 `update` 函数的方式，动画效果可能不会像你预期的那样尽意。刷新页面并点击几次 **Prepend**。你应该看到一些奇怪的行为。你可能原以为现有的圆圈会向右移动，为在左侧添加的新圆圈留出空间。相反，现有的圆圈似乎都在原地调整大小，而一个新圆圈则从左上角飞入，并占据了现有圆圈右侧的位置。通过这种动画，实际上很难看出某个元素是在左侧被*插入*（prepended）的。相反，动画给人的感觉是元素是在右侧被*追加*（appended）的，并且所有元素都在调整大小。另一方面，点击\
  \ Append 按钮执行了正确的操作：一个新元素动画进入并出现在行末尾，而现有的元素没有变化。\n\n这里的问题在于，当 D3 使用新数据数组更新现有选择时，它使用了一种名为*按索引连接*（join-by-index）的默认模式。这意味着数组中的第一个项将与选择中的第一个元素（在本例中是最左侧的圆圈）连接，数组中的第二个项与选择中的第二个元素连接，依此类推。如果数组中的项比现有的\
  \ SVG 元素多，则新元素会被添加到末尾。因此，当你点击 Prepend 并向数据数组开头添加新数字时，行中的每个圆圈都会重新绑定到一个新的数据项。行中的第一个圆圈绑定了新添加到数组开头的数字，所以它看起来在调整大小。第二个圆圈绑定了原先数组中的第一个数字，所以它看起来也在调整大小，依此类推。最后，由于现在数据项比\
  \ SVG 元素多了一个，因此会创建一个新的圆圈并将其添加到行末尾。\n\n使动画更直观的解决方案是帮助 D3 理解数据数组中每个元素的*身份标识*（identity）。我们不再假设数组中的每个索引将总是映射到选择中的相同索引，而是提供了\
  \ D3 所称为的*键函数*（key function）。键函数允许我们指定关于每个数据项的某些信息来唯一标识它。这样，无论数据顺序如何，每个现有的数据项都保持绑定到同一个\
  \ SVG 元素上。\n\n键函数作为可选的第二个参数传递给 `data` 方法。Listing 14-24 显示了 `update` 函数所需的更改。\n\n\
  ```\n--snip--\n  .selectAll(\"circle\")\n  .data(data, d => d)\n  .join(\"circle\"\
  )\n--snip--\n```\n\nListing 14-24：添加键函数\n\n这里的键函数 `d => d` 表示给定一个数据项，该数据项本身就是唯一标识符。在这种情况下，我们只是使用原始数字，所以数字的值就是我们能得到的“唯一”标识符了。通常你会处理的是更复杂的数据，可以使用键函数来暴露一个真正的唯一标识。例如，如果每个数据项都是一个具有唯一\
  \ `employeeId` 属性的员工对象，那么你可以使用 `d => d.employeeId` 这样的键函数。\n\n刷新页面并点击 **Prepend**。现在你应该能看到所有的圆都向右滑动，以适应新插入的元素。这是因为\
  \ D3 现在知道当数组变化时，新数组中的项应该映射到选择中的哪个元素。\n\n### 高级连接（Advanced Joins）\n\nD3 的 `join`\
  \ 方法具有额外的选项，让你能更灵活地控制可视化结果对数据变化的响应。当 D3 将新数据连接到现有选择时，某些元素可能会更新，某些可能会被添加（针对没有现有元素的新数据项），某些元素可能会被移除。在我们案例中，我们已经看到点击\
  \ Prepend 如何在添加新元素的同时通过向右移动更新所有其他元素。与此同时，点击 Drop 会移除最后一个元素。在 D3 的术语中，添加新元素被称为*进入*（enter），移除现有元素被称为*退出*（exit），而修改现有元素被称为*更新*（update）。\n\
  \n\n\n\n你可以通过向 `join` 方法传递三个函数来对其进行自定义，这三个函数会在三种可能的元素变化发生时各调用一次。通过这种方式，你可以指定三种不同的行为：一个用于进入元素，一个用于正在更新的元素，另一个用于退出的元素。要测试此功能，请如列表\
  \ 14-25 所示修改你的更新函数。首先，这些更改产生的结果与我们在上一个列表中简单 `join` 方法的行为相同。\n\n```\n--snip--\n \
  \ .data(data, d => d)\n  .join(\n    enter => enter.append(\"circle\"),\n    update\
  \ => update,\n    exit => exit.remove()\n  )\n  .transition()\n--snip--\n```\n列表\
  \ 14-25: 带有 `enter`、`update` 和 `exit` 函数的 `join` 方法。\n\n`join` 方法的这个更高级的版本接受三个函数。第一个函数有一个名为\
  \ `enter` 的单一参数，它是每个进入元素的临时占位符的选择。为了获得与简单的 `.join(\"circle\")` 版本相同的行为，我们只需使用 `append`\
  \ 方法为每个 `enter` 占位符添加一个圆。注意，`enter` 占位符本身并不是 DOM 中的元素。它们只是 D3 的句柄，在你将新进入的元素添加到 DOM\
  \ 之前提供一个位置。例如，如果有五个新元素需要进入，那么 `enter.append(\"circle\")` 将创建五个新的圆元素并将它们放在 svg 元素内部。\n\
  \n第二个函数有一个名为 `update` 的单一参数，它是一个包含所有已绑定到数据的现有元素的选择。为了获得与之前相同的行为，我们只需返回未更改的选择即可。\n\
  \n第三个函数有一个名为 `exit` 的单一参数，它是一个包含所有不再有对应数据而应该移除的元素的选择。为了获得与之前相同的行为，我们在选择上调用 `remove`\
  \ 方法，这将从 DOM 中移除每个退出的元素。\n\n当你重新加载页面时，你应该能看到与之前相同的行为；到目前为止，这个更改没有任何功能上的影响。不过，既然我们已经让它运行了，就可以重构动画以增加一些技巧。目前更新选择中元素的向右移动动画是没问题的，但进入的元素目前是从左上角飞入的，退出的元素直接消失了。让我们改为进入的元素从它们正确的位置生长到到位，而退出的元素在当前位置收缩到消失。实现该行为的更改如列表\
  \ 14-26 所示。\n\n```\n--snip--\nfunction update(data) {\n  d3\n    .select(\"svg\"\
  )\n    .selectAll(\"circle\")\n    .data(data, d => d)\n    .join(\n      enter\
  \ => enter\n      ❶ .append(\"circle\")\n        .attr(\"cx\", (d, i) => (i + 1)\
  \ * 50)\n        .attr(\"cy\", 50)\n        .transition()\n        .duration(500)\n\
  \      ❷ .attr(\"r\", (d, i) => d * 5),\n      update => update\n        .transition()\n\
  \        .duration(500)\n      ❸ .attr(\"cx\", (d, i) => (i + 1) * 50),\n      exit\
  \ => exit\n        .transition()\n        .duration(500)\n      ❹ .attr(\"r\", 0)\n\
  \      ❺ .remove()\n    );\n}\n\nupdate(numbers); \n--snip--\n```\n列表 14-26: 润化动画。\n\
  \n在这些更新后的代码中，我们将所有过渡移动到了单独的 `enter`、`update` 和 `exit` 函数中，而不是为所有元素设置单个过渡调用。`enter`\
  \ 函数添加一个圆元素 ❶，然后立即设置它的位置（`cx` 和 `cy` 属性），但没有设置它的半径。一旦设置了位置，我们就使用 `transition` 方法将半径从零（默认值）动画到从数据计算出的值\
  \ ❷。这里的顺序非常重要：链中在调用 `transition` *之前*的任何内容都将立即发生，而在调用 `transition` *之后*的任何内容都将产生动画效果。这意味着任何新圆都将立即出现在正确的位置，而尺寸的变化（从零到期望的半径）将执行动画。这可能比之前的版本看起来更自然，因为在之前的版本中，三个属性都从零开始动画，导致圆从从角飞入。\n\
  \n`update` 函数必须只对圆的 `cx` 属性进行动画处理❸，将其滑动到更新后的位置。对于现有元素，所有其他属性应保持不变。最后，`exit` 函数在移除元素\
  \ ❺ 之前将圆的半径动画回零 ❹。如果在调用 `transition` 之后调用 `remove`（如此处所示），则实际的元素移除将在动画完成后才会发生。\n\
  \n当你重新加载页面时，你应该能看到新的且改进的动画：新元素在适当的位置展开，被移除的元素收缩消失。\n\n### 创建柱状图\n\n现在你已经学习了 D3 的基础知识，让我们把它们应用在一个小型项目中：创建一个可视化文本框中字符频率的柱状图。当向框中输入或粘贴新文本时，柱状图将随之更新。创建此可视化工具将让你练习数据连接（data\
  \ joins），教你一些新技巧（如绘制坐标轴为数据提供上下文），并为下一章中更重要的项目做准备。\n\n### 设置\n\n开始，创建一个名为 `frequency`\
  \ 的新目录，并添加空的 `script.js` 和 `style.css` 文件。然后创建一个 `index.html` 文件，并将列表 14-27 中的代码加入。\n\
  \n```html\n<!DOCTYPE html>\n<html\n  <head>\n    <title>Character Frequency</title>\n\
  \    <link rel=\"stylesheet\" href=\"style.css\">\n  </head>\n  <body>\n    <div>\n\
  \    ❶ <textarea rows=\"5\" cols=\"70\"></textarea>\n    </div>\n    <script src=\"\
  https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script src=\"script.js\"\
  ></script>\n  </body>\n</html>\n```\n列表 14-27: 字符频率分析项目的 `index.html` 文件。\n\n此 HTML\
  \ 文档遵循了我们在整本书中一直使用的模式。唯一的新增内容是 `textarea` 元素 ❶，它创建了一个多行输入。`rows` 和 `cols` 属性设置了文本区域的行数宽度（以等宽字符计算）。\n\
  \n注意，文档不包含 `svg` 元素。我们将使用 JavaScript 创建它。这是因为我们需要多次引用 svg 元素的宽度和高度来确定元素的放置位置，因此在\
  \ JavaScript 中定义这些参数比在 HTML 文件中定义更有意义。而且既然我们将在 JavaScript 中定义宽度和高度，我们可能也会在 JavaScript\
  \ 中创建 svg 元素本身。我们现在就这样做。将列表 14-28 中的代码添加到 `script.js`。\n\n```javascript\nconst width\
  \ = 600;\nconst height = 600;\n\n// 向页面添加一个 svg 元素\nlet svg = d3\n  .select(\"body\"\
  )\n  .append(\"svg\")\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\
  ```\n列表 14-28: 使用 JavaScript 创建 svg 元素。\n\n我们首先声明了 svg 元素的宽度和高度常量。然后我们使用 D3 选择 `body`\
  \ 元素并为其添加一个 `svg` 元素，在此过程中设置 `width` 和 `height` 属性。我们将创建元素的结果保存到变量 `svg` 中，因为我们之后会需要它。\n\
  \n### 计算字符频率\n\n\n\n\n接下来，我们将添加代码从文本区域读取文本并统计每个字符出现的次数。这为可视化生成了底层数据。每当文本发生变化时，我们都需要更新数据并重新绘制图表。不过，目前我们只需要读取文本、计算字符频率，并将输出日志到控制台。将\
  \ Listing 14-29 中的代码添加到 `script.js` 的末尾。\n\n```javascript\n--snip--\nd3.select(\"\
  textarea\").on(❶ \"input\", e => {\n❷ let frequencies = {};\n\n❸ e.target.value.split(\"\
  \ \").forEach(char => {\n    let currentCount = frequencies[char] || 0;\n    frequencies[char]\
  \ = currentCount + 1;\n  });\n\n  console.log(frequencies);\n});\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">Listing 14-29: 计算字符频率</samp>\n\n`input` 事件 ❶\
  \ 会在文本区域内容发生变化时随时触发，无论是通过输入、删除、粘贴还是其他操作。我们在事件处理函数中执行的第一件事是初始化一个新对象，用于跟踪字符频率 ❷。这个\
  \ `frequencies` 对象将使用字符作为键（key），并将该字符出现的次数作为值（value）。然后我们获取事件的目标（文本区域），获取其值（文本），并将其拆分为单个字符\
  \ ❸。对于每个字符，我们确定该字符的当前计数，如果尚未见过该字符则默认为 0。然后我们将计数加 1，并将新计数存回对象中。一旦完成了所有字符的计数，我们就将\
  \ `frequencies` 对象打印到控制台，以便检查所有运行情况是否符合预期。请注意，我们每当文本变化时都会重新计算 `frequencies` 对象，而不是仅仅尝试跟踪添加或删除的字符。这使得更容易处理一次性添加或删除多个字符的情况，例如当文本被粘贴到框中时。\n\
  \n加载页面，你应该能看到文本区域（`svg` 元素是不可见的，但如果你想检查它是否存在，可以在 Elements 面中看到它）。当你向文本区域输入文本时，你应该在每次击键时都看到控制台中打印了对象，每个对象都包含文本区域中字符的频率。例如，如果你输入单词\
  \ *hello*，在输入完最后一个 *o* 后，你会得到这个对象：\n\n```json\n{\"h\": 1, \"e\": 1, \"l\": 2, \"\
  o\": 1}\n```\n\n一个包含所有字符及其频率的单个对象对于打印到控制台效果很好，但我们使用 D3 进行渲染时需要一个对象数组，每个对象描述单个字符及其相关的频率。这样，数组中的每个条目都是绑定到我们柱状图中某个条形的数据。为了让图表更易读，数组应该按字符字母顺序排序。继续以单词\
  \ *hello* 为例，比起之前的对象，我们需要像这样的内容：\n\n```json\n[\n  {\"char\": \"e\", \"count\": 1},\n\
  \  {\"char\": \"h\", \"count\": 1},\n  {\"char\": \"l\", \"count\": 2},\n  {\"char\"\
  : \"o\", \"count\": 1}\n]\n```\n\n为了将数据放入这种数组格式，请按照 Listing 14-30 所示修改 `script.js`\
  \ 的末尾。\n\n```javascript\n--snip--\n    frequencies[char] = currentCount + 1;\n \
  \ });\n\n❶ let data = Object.entries(frequencies).map(pair => {\n    return {char:\
  \ pair[0], count: pair[1]};\n  });\n\n❷ data.sort((a, b) => d3.ascending(a.char,\
  \ b.char));\n\n  console.log(data);\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 14-30: 将数据转换为数组</samp>\n\n首先，我们使用 `Object.entries(frequencies).map(pair\
  \ => { return {char: pair[0], count: pair[1]}; })` 将 `frequencies` 对象转换为一个数组 ❶，其中键是\
  \ `char`，值为 `count`。接下来，我们使用 `data.sort((a, b) => d3.ascending(a.char, b.char))`\
  \ 根据 `char` 对数组进行排序 ❷。\n\n### 绘制条形\n\n现在我们有了数据，可以开始渲染它了。按照 Listing 14-31 所示对 `script.js`\
  \ 进行修改。\n\n```javascript\n--snip--\n// 添加一个元素\nlet svg = d3.select(\"body\")\n \
  \ .append(\"svg\")\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\n\
  function update(data) {\n  svg\n    .selectAll(\"rect\")\n    .data(data)\n    .join(\"\
  rect\")\n    .attr(\"width\", d => d.count * 5)\n    .attr(\"height\", 10)\n   \
  \ .attr(\"x\", 20)\n    .attr(\"y\", (d, i) => i * 20);\n}\n\nd3.select(\"textarea\"\
  ).on(\"input\", e => {\n--snip--\n  data.sort((a, b) => d3.ascending(a.char, b.char));\n\
  \n  update(data);\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 14-31: 定义更新函数</samp>\n\n在这里我们声明了一个 `update` 函数 ❶，它会在每次文本变化 ❸ 时被调用。该函数根据我们学习的将数据绑定到选择集（使用\
  \ `data` 方法）并使用 `join` 方法连接必要元素的相同模式，创建、更新或删除所需的 SVG 元素。我们恰当地设置了宽度、高度、x 和 y 属性以创建一个水平方向的图表。`width`\
  \ 属性设置为字符计数的 5 倍，因此每个新字符出现出现让条形宽 5 像素。`height` 属性为常量值 10（所有条形高度相同），`x` 属性为常量值 20（所有条形均距离\
  \ SVG 左侧 20 像素）。`y` 属性设置为数据索引的 20 倍，这意味着每隔 20 像素有一个条形，每个条形之间留有 10 像素的间隔。\n\n刷新页面并在文本区域中输入单词\
  \ *hello*。当你输入每个字母时，你应该能看到 SVG 元素中出现或更新条形，最后结果类似于 Figure 14-9。\n\n![](img/Figure_14-9.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Figure 14-9: 基础柱状图</samp>\n\n\
  目前为止良好，但我们还有很多路要走。这里有两个主要问题。首先，没有轴或标签，所以不知道每个条形代表哪个字符，也不知道条形的宽度对应什么。其次，条形的宽度和高度没有自动缩放，这意味着目前在条形放入\
  \ 600×600 像素的 SVG 元素之前，我们只能处理 30 个不同字符且每个字符计数 116 次。幸运的是，这两个问题使用 D3 都可以轻松解决。\n\n\
  ### 缩放条形\n\n\n\n\n\nD3 中的 `scale`（比例尺）是将某些数据值转换为视觉值的方法。例如，之前我们将字符频率图中条形的宽度设置为数据值的\
  \ 5 倍，这是一种简单的缩放形式。在这种情况下，我们手动设置了缩放因子，但 D3 也可以根据数据的最小值和最大值（称为 `domain`，域）以及显示的最小值和最大值（称为\
  \ `range`，范围）自动确定缩放。\n\n例如，假设你正在绘制一张人员年龄图。你的数据值范围从 0 到 105，而渲染这些值的空间范围从 SVG 左侧的\
  \ 30 到 330 像素不等。因此，你的 `domain` 是 [0, 105]，`range` 是 [30, 330]。数据域中的值 0 映射到视觉范围中的\
  \ 30，而值 105 映射到 330。请参见图 14-10 以此映射的视觉化表示。\n\n![](img/Figure_14-10.png)\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-10: 将值从 [0, 105] 域缩放到 [30, 330]\
  \ 范围</samp>\n\nD3 缩放的妙之处在于，缩放因子可以根据 `domain` 的变化动态改变。这样，即使最大数据值发生变化，当前的最大值也可以始终映射到整个视觉范围。为了为条形图实现这种动态缩放，我们需要跟踪所有数据中的最大计数，并将其作为\
  \ `domain` 的上限。结果是，如果最大计数增加，未达到最大计数的条形将按比例缩小，而达到最大计数的条形将继续占据整个水平范围。例如，假设条形的视觉范围是\
  \ [0, 500]，我们有以下数据：\n\n```\n[\n  {\"char\": \"a\", \"count\": 1},\n  {\"char\":\
  \ \"b\", \"count\": 1},\n  {\"char\": \"c\", \"count\": 2}\n]\n```\n\n我们数据的 `domain`\
  \ 将是 [0, 2]。\"c\" 条形宽为 500 个单位，而 \"a\" 和 \"b\" 条形每个宽 250 个单位。如果我们再添加两个 \"c\"，\"\
  c\" 条形仍然宽为 500 个单位，但现在 \"a\" 和 \"b\" 条形每个将宽 125 个单位。\n\n现在让我们来实现这种动态水平缩放。使用列表 14-32\
  \ 中所示的代码修改你的脚本。\n\n```\n--snip--\n// 在页面上添加 svg 元素\nlet svg = d3\n  .select(\"body\"\
  )\n  .append(\"svg\")\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\
  \nlet margin = {top: 20, right: 10, bottom: 20, left: 50};\n\nfunction update(data)\
  \ {\n❶ let xScale = d3.scaleLinear()\n    .domain([0, d3.max(data, d => d.count)])\n\
  \    .range([margin.left, width - margin.right]);\n\n  svg\n    .selectAll(\"rect\"\
  )\n    .data(data)\n    .join(\"rect\")\n  ❷ .attr(\"width\", (d, i) => xScale(d.count)\
  \ - xScale(0))\n    .attr(\"height\", 10)\n  ❸ .attr(\"x\", xScale(0))\n    .attr(\"\
  y\", (d, i) => i * 20);\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-32: 为条形宽度创建比例尺</samp>\n\n首先，在 `update` 函数定义之前，我们创建了一个描述条形图图表边距的对象。这些值表示图表的主体距离\
  \ SVG 元素边缘的距离。如图 14-11 所示，到那时，我们将使用这些边距来决定在哪里绘制条形和坐标轴。\n\n![](img/Figure_14-11.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-11: 如何使用边距在 SVG 元素中定位图表（虚线）</samp>\n\
  \n在 `update` 函数内部，我们使用 `d3.scaleLinear` 方法创建一个比例尺 ❶。这意味着输入值线性地映射到输出值（而不是对数映射，例如）。我们使用\
  \ `d3.max` 辅助函数将 `domain` 设置为零到最大计数。该辅助函数接收一个数据数组和一个从数据项中返回返回值的函数，并返回最大值。在这种情况下，它返回的是最大计数值。`range`\
  \ 设置为 `margin.left` 到 `width - margin.right`，为我们提供了最长条形右侧的位置。\n\n`scaleLinear` 辅助函数为我们提供了一个从数据\
  \ `domain` 映射到视觉 `range` 的函数，我们将其赋值给变量 `xScale`。（正如第 5 章所述，`scaleLinear` 辅助函数为我们提供了一个从数据\
  \ `domain` 映射到视觉 `range` 的函数，我们将其赋值给变量 `xScale`。）\n\n\n\n\n\n图 14-12：我们在两个维度上都缩放了柱状图\n\
  \n尝试输入不同的文本，感受柱条随数据变化而更新的情况。接下来，我们将添加带有标签的轴，它们将随缩放一起更新，显示数据的实际范围。这将使图表更容易理解。\n\n\
  ## 添加带标签的轴\n\nD3 轴辅助函数允许你沿着图表的侧边绘制轴。`D3` 中的轴包含一条水平或垂直线，以及垂直于该线绘制的小刻度线，以及每个刻度线对应的值，如图\
  \ 14-13 所示。轴允许你查看数据域中的值。\n\n![](img/Figure_14-13.png)\n\n图 14-13：显示数字 0 到 8 的轴\n\
  \n轴与比例尺（scales）紧密相关，事实上，你需要一个比例尺来创建轴。例如，图 14-13 中的轴宽度为 540 像素，包含从 0 到 8 的数字。该轴是使用域为\
  \ `[0, 8]` 范围为 `[0, 540]` 的比例尺创建的。\n\n要绘制轴，你首先必须定义一个包含轴元素的 `g` 元素。然后，使用其中一个 D3 轴辅助函数创建一个轴生成器对象，最后使用该生成器对象将轴元素绘制到\
  \ `g` 元素中。\n\n我们的图表将有两个轴：一个显示计数值的顶部轴，和一个显示字符值的左侧轴。首先，我们将添加 `g` 元素，如列表 14-34 所示。\n\
  \n```\n--snip--\nlet margin = {top: 20, right: 10, bottom: 20, left: 50};\n\n//\
  \ 轴容器\n❶ let topContainer = svg\n  .append(\"g\")\n  .attr(\"id\", \"top\")\n  .attr(\"\
  transform\", ❷ `translate(0, ${margin.top})`);\n\n// 左轴容器\n❸ let leftContainer =\
  \ svg\n  .append(\"g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", ❹ `translate(${margin.left},\
  \ 0)`);\n\nfunction update(data) {\n--snip--\n```\n\n列表 14-34：为包含顶部和左侧轴添加 g 元素\n\
  \n我们通过向 `svg` 元素添加一个 `g` 元素并赋予其 id `\"top\"` 来创建顶部轴容器 ❶。由于我们定义的 `xScale` 范围为 `[margin.left,\
  \ width - margin.right]`，这也会定义轴的视觉范围。然而，`xScale` 并不包含垂直位置的信息，这就是为什么我们必须将其向下平移 `margin.top`\
  \ ❷。我们将元素选择存储在名为 `topContainer` 的变量中，以便稍后将轴绘制到容器时能够引用它。左侧轴容器以类似的方式创建 ❸，但这次我们必须将它向右平移\
  \ `margin.left` ❹，因为 `yScale` 不包含水平位置的信息。\n\n现在我们有了容器，就可以绘制轴了。对列表 14-35 所示所示对 `update`\
  \ 函数进行修改。\n\n```\n--snip--\n  let yScale = d3.scaleBand()\n    .domain(data.map(d\
  \ => d.char))\n    .range([margin.top, height - margin.bottom])\n    .padding(0.5);\n\
  \n  let topAxis = d3.axisTop(xScale);\n\n  let leftAxis = d3.axisLeft(yScale);\n\
  \n  topContainer\n    .call(topAxis);\n\n  leftContainer\n    .call(leftAxis);\n\
  \n  svg\n    .selectAll(\"rect\")\n    .data(data)\n    .join(\"rect\")\n--snip--\n\
  ```\n\n列表 14-35：绘制轴\n\n在这里我们调用了 `d3.axisTop` 并传递 `xScale`，调用了 `d3.axisLeft` 并传递\
  \ `yScale`。这给了我们两个轴生成器：`topAxis` 和 `leftAxis`。轴生成器接收一个元素选择并在该元素中绘制轴。然而，我们并没有向轴生成器传递选择，而是将生成器本身传递给名为\
  \ `call` 的 D3 方法。当该方法链式调用到选择时（在此例中为 `topContainer` 或 `leftContainer`），它会在当前选择上调用提供的函数。因此，编写\
  \ `topContainer.call(topAxis);` 等同于编写 `topAxis(topContainer);`，这两种语句都会绘制柱状图的顶部轴。使用\
  \ `call` 被认为更符合惯用法，并且这便于在语句上链式调用其他方法。\n\n刷新页面并在文本区域输入一些文本。你将看到轴，如图 14-14 所示。\n\n\
  ![](img/Figure_14-14.png)\n\n图 14-14：我们带有轴的柱状图\n\n如果你在网页检查器中检查轴，你会发现它们由 `g`、`path`、`text`\
  \ 和 `line` 元素组成。`line` 元素类似于 `path`，但它仅通过 `x1`、`x2`、`y1` 和 `y2` 属性定义起点点。这些属性在 SVG\
  \ 规范中默认值为 0，这对于绘制这些轴通常已经足够，因此你会在检查器中注意到许多线条属性并没有被显式设置。\n\n目前顶部轴有两个地方不太对。首先，如图 14-14\
  \ 所示，标签包含了带有小数点的数字（例如 2.5），但我们只关心整数（你不可能有半个字符）。因此，我们需要找到一种只渲染整数（也称为 integers）的方法。其次，如果你输入\
  \ 15 个相同的字符（例如，*aaaaaaaaaaaaaaa*），标签将只显示从 0 到 14 的偶数，并且没有 15 的标签，如图 14-15 所示。随着最大计数增加，你将继续看到这个问题，特别是在超过\
  \ 30 之后，刻度会切换为 5 的倍数。\n\n![](img/Figure_14-15.png)\n\n图 14-15：最大计数为 15 时的顶部轴\n\n\
  我们在这里希望域能扩展到 16，以便让轴看起来更好看。幸运的是，第二个问题很容易修复。D3 比例尺有一个很棒的方法可以将它们的域扩展到下一个“整””数字，在这种情况下，这意味着下一个会绘制刻度线的数字。列表\
  \ 14-36 显示了如何结合这种方法。\n\n```\n--snip--\n  let xScale = d3.scaleLinear()\n    .domain([0,\
  \ d3.max(data, d => d.count)])\n    .range([margin.left, width - margin.right])\n\
  \    .nice();\n--snip--\n```\n\n列表 14-36：让我们的 x 比例尺“漂亮”\n\n当你刷新页面并再次输入 15 个相同的字符时，你会看到轴现在扩展到了\
  \ 16。只渲染整数需要更多的努力。这里的做法是获取刻度值，过滤出整数，然后将这些刻度值设置到轴。此外，我们希望更改数字渲染方式以排除小数点，以便渲染为 1 而不是\
  \ 1.0。这些更改在列表 14-37 所示。\n\n```\n--snip--\n  let yScale = d3.scaleBand()\n  .domain(data.map(d\
  \ => d.char))\n  .range([margin.top, height - margin.bottom])\n  .padding(0.5);\n\
  \n❶ let topAxisTicks = xScale.ticks()\n    .filter(tick => Number.isInteger(tick));\n\
  \n  let topAxis = d3.axisTop(xScale)\n  ❷ .tickValues(topAxisTicks)\n  ❸ .tickFormat(d3.format(\"\
  d\"));\n\n  let leftAxis = d3.axisLeft(yScale);\n--snip--\n```\n\n列表 14-37：在顶部轴渲染整数刻度\n\
  \n\n\n\n\n首先，我们需要获取刻度，这可以通过 `xScale` 生成器上的 `ticks` 方法获得 ❶。然后我们使用 `Number.isInteger`\
  \ 将刻度过滤为整数值。这会将类似 `[0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4]` 的数组转换为 `[0, 1, 2, 3, 4]`。接下来，我们使用\
  \ `tickValues` 方法在顶端轴上设置过滤后的刻度值 ❷。最后，我们使用 `tickFormat` 方法为数字设置渲染格式 ❸。该方法接受一个格式化函数，用于格式化每个刻度值。在这种情况下，`d3.format(\"\
  d\")` 返回一个格式化数字且不带小数点的函数。\n\n重新加载页面并再次输入一些文本；你应该看到渲染出的不带小数点的整数。\n\n## 使用 CSS 和正则表达式进行样式设置\n\
  \n接下来，我们将使用一些 CSS 样式来改进图表的外观。为了更好地区分不同类型的字符，我们将根据条形图是小写字母、大写字母、数字还是其他字符，为它们赋予不同的颜色。为了做到这一点，我们需要一个能够区分这些类型字符的函数。该函数将使用*正则表达式*，这是一种在文本字符串中指定模式，然后判断其他字符串是否匹配这些模式的方法。\n\
  \n> **注意**\n\n> JavaScript 的正则表达式功能非常强大，但我们将只考虑此项目需要的特性。要了解更多信息，请访问网站 [`www.regular-expressions.info`](https://www.regular-expressions.info)，或者在\
  \ MDN 中搜索“regular expressions”（正则表达式）。\n\nJavaScript 有一种正则表达式字面量语法，用正斜杠分隔。例如，`/hi/`\
  \ 是一个正则表达式字面量，它匹配任何包含字符序列 *hi* 的字符串。*hi* 可能会出现在字符串的任何位置。例如，正则表达式 `/hi/` 会匹配单词 *hither*、*Chicken*\
  \ 和 *sushi*。你可以通过添加特殊字符来更精确地定义正则表达式的模式。例如，表达式开头的脱字符位符号（`^`）表示字符序列应该出现在字符串的开头，因此\
  \ `/^hi/` 匹配任何以 *hi* 开头的字符串。同样，表达式末尾的美元符号（`$`）表示字符序列应该出现在字符串的结尾，因此 `/hi$/` 匹配任何以\
  \ *hi* 结尾的字符串。\n\n你可以使用正则表达式的 `test` 方法查看特定字符串是否匹配它。以下是 JavaScript 控制台中的一些示例：\n\n\
  ```\n/^hi/.test(\"hi there\");\ntrue\n/^hi/.test(\"Chicken\");\nfalse\n```\n\n字符串\
  \ \"hi there\" 通过了测试，因为 *hi* 出现在字符串的开头，而 \"Chicken\" 则失败了。\n\n你可以同时使用 `^` 和 `$`\
  \ 创建一个整个字符串必须匹配的正则表达式。例如，`/^hi$/` 将仅匹配字符串 \"hi\" 而不匹配任何其他内容，如下所示：\n\n```\n/^hi$/.test(\"\
  hi\");\ntrue\n/^hi$/.test(\"him\");\nfalse\n```\n\n要匹配字符范围而不是单个字符，请使用方括号和连字符来描述该范围。例如，`/[a-z]/`\
  \ 匹配从 *a* 到 *z* 的任何小写字符。正则表达式 `/^[A-Z][a-z]$/` 匹配包含一个大写字母后跟一个小写字母且没有其他字符的字符串。在你的控制台中尝试一下：\n\
  \n```\n/^[A-Z][a-z]$/.test(\"Hi\");\ntrue\n/^[A-Z][a-z]$/.test(\"iH\");\nfalse\n\
  /^[A-Z][a-z]$/.test(\"Hip\");\nfalse\n```\n\n对于此项目，我们需要三个正则表达式：`/^[a-z]$/`（匹配单个小写字母）、`/^[A-Z]$/`（匹配单个大写字母）和\
  \ `/^[0-9]$/`（匹配单个数字）。如果字符不匹配其中任何一个表达式，我们就知道它是其他类型的字符，比如空格或标点符号。参见列表 14-38 中新的 `getClass`\
  \ 函数，它使用这些正则表达式为给定字符的条形选择 CSS 类名。将此函数添加到 `update` 函数之前的之前的 `script.js` 中。\n\n```\n\
  --snip--\n// 左侧轴容器\nlet leftContainer = svg\n  .append(\"g\")\n  .attr(\"id\", \"\
