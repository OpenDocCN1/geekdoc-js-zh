  >列表 10-10: 定义挡板的边缘</samp>\n\n`leftPaddle` 和 `rightPaddle` 对象包含四个属性：`left`、`right`、`top`\
  \ 和 `bottom`，代表各自挡板的边缘。正如列表 10-8 所示，确定右挡板边缘需要更多的计算，因为我们需要考虑到画布的宽度、挡板的偏移以及挡板的宽度。\n\
  \n接下来我们需要一个函数，我们将其称为 `checkPaddleCollision`，它接收 `ball` 对象和其中一个挡板对象，如果球与该挡板交叉，则返回\
