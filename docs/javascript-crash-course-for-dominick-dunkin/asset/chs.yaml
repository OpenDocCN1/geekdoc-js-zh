  - **第 9 章：Canvas 元素**：教你如何使用 Canvas API 在浏览器中绘制图形和动画。\n最后，本书的第三部分让你通过一系列项目将第一部分和第二部分中学到的技能付诸实践。项目之间没有依赖，因此你可以按任何顺序处理它们，或者只研究你觉得最有趣的项目。我建议完成所有项目，因为它们都引入了一些通用的编程概念。每个项目跨越两章：\n\
