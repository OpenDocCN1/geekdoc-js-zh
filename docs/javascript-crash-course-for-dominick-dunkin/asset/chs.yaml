  - **第 4 章：条件和循环**：教你如何通过控制结构为程序添加逻辑，可以做出决策并重复代码段。\n- **第 6 章：类**：帮助你通过类和面向对象的编程原则为代码添加更多结构。\n\
  本书的第二部分讨论如何使用 JavaScript 与网络浏览器交互。这部分探索了创建交互式 Web 应用的重要技术：\n- **第 7 章：HTML、DOM 和\
