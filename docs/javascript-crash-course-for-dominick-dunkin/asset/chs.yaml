  \ 15-7: 绘制柱条\n\n\n\n\n\n## 改进可视化\n\n我们现在已经运行了一个基础的可视化，但它提供的信息并不多。在本节中，我们将实现一些改进，使可视化更有意义。我们将一种方法来查看有关每个仓库更多信息。我们还将对条形进行颜色编码，以显示每个仓库的许可证类型，并确保轴标签标记正确。\n\
  \n### 显示仓库信息\n\n目前的图表没有提供识别每个条形代表哪个仓库的方法。解决这个问题有多种方法（例如，垂直或倾斜的刻度标签，或者某种 `tooltip`，即鼠标悬停在条形上弹出的文本字段），但对于本项目，我们将添加一个永久的侧边栏，当你悬停在条形上时，它会显示该条形的更多信息。首先，将在\
  \ `index.html` 中添加侧边栏的 HTML，如 Listing 15-8 所示。\n\n```\n--snip--\n  <body>\n    <div\
  \ id=\"sidebar\">\n      <div id=\"info\" class=\"box\">\n        <p class=\"repo\"\
  >\n          <span class=\"label\">Repository</span>\n        ❶ <span class=\"value\"\
  ><a target=\"_blank\"></a></span></span>\n        </p>\n        <p class=\"license\"\
  >\n          <span class=\"label\">License</span>\n          <span class=\"value\"\
  ></span>\n        </p>\n        <p class=\"stars\">\n          <span class=\"label\"\
  >Stars</span>\n          <span class=\"value\"></span>\n        </p>\n      </div>\n\
  \    </div>\n\n    <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n\
  \    <script src=\"script.js\"></script>\n  </body>\n--snip--\n```\n\n**Listing\
  \ 15-8: 在 `index.html` 中添加侧边栏 HTML**\n\n在这里，我们设置了一个名为 `info` 的 div，其中包含了显示仓库信息所需的元素。它嵌套在另一个名为\
  \ `sidebar` 的 div 内部。这个外部 div 现在看起来是多余的，但稍后我们将向侧边栏添加另一个 div 元素，因此我们需要父级 div 元素来包含这两个侧边栏\
  \ div 元素。\n\n`info` div 将显示仓库名称、其许可证类型和星数。我们使用 `span` 元素来包裹文本的一部分。`span` 是一个类似于\
  \ `div` 的容器元素，但与创建新块的 `div` 元素不同，`span` 是行内元素，因此它可以包含文本的一部分而不产生新行。稍后，当你悬停在条形上时，我们将更新\
  \ `value` span 的内容，以显示与该条形相关的信息。\n\n`span` 元素之一包含一个 `a` 元素 ❶，它创建一个指向另一个页面或网站的超链接。链接的\
  \ URL 通过 `href` 属性指定，我们稍后将动态设置它。`target=\"_blank\"` 属性指示浏览器在新标签页或窗口中打开链接。\n\n侧边栏在现阶段看起来有点丑，所以让我们添加一些\
  \ CSS。将 Listing 15-9 中的代码添加到 `style.css` 中。\n\n```css\nbody {\n❶ display: flex;\n\
  \  align-items: flex-start;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\n\
  .box {\n  padding: 0px 15px 0px 15px;\n  border: 1px solid #888;\n  margin-bottom:\
  \ 15px;\n}\n\n#info .label {\n  font-weight: bold;\n  display: block;\n}\n\n#info\
  \ a {\n  text-decoration: none;\n}\n\n#info a:hover {\n  text-decoration: underline;\n\
  }\n```\n\n**Listing 15-9: 为侧边栏设置样式**\n\n对于本项目，我们使用一种名为 `flexbox` ❶ 的 CSS 技术，这是 CSS\
  \ 规范中较新添加的内容。Flexbox 使定义布局变得简单得多，特别是那些可以在各种屏幕和视口尺寸上灵活工作的布局。Flexbox 布局有两个主要组件：`flex\
  \ container`（弹性容器）和 `flex items`（弹性项目）。弹性 容器是一个父元素，定义了其子弹性项目（容器的直接子元素的大小以及它们的流向。在我们案例中，弹性容器是\
  \ `body` 元素，弹性项目是 `svg` 元素和 `#sidebar` 元素。默认情况下，项目从左到右排列（这意味着 `#sidebar` 元素将出现在屏幕的左侧，随后是右侧的\
  \ `svg` 元素）。`align-items: flex-start;` 声明意味着项目将对齐到父容器的顶部。\n\n> **注意**：如果你想了解更多关于\
  \ flexbox 的知识，请查看 [`css-tricks.com/snippets/css/a-guide-to-flexbox/`](https://css-tricks.com/snippets/css/a-guide-to-flexbox/)。\n\
  \n目前 `svg` 元素被附加 `body` 元素，这意味着它位于侧边栏之后，由于布局原因，我们希望它在之前。为了做到这一点，我们在创建 `svg` 元素需要从\
  \ `append` 方法切换到 `insert` 方法，因为后者允许我们指定插入在某个元素之前的元素。`script.js` 的相应更改见 Listing 15-10。\n\
  \n```javascript\n--snip--\nlet svg = d3\n  .select(\"body\")\n  .insert(\"svg\"\
  , \"#sidebar\")\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n--snip--\n\
  ```\n\n**Listing 15-10: 在侧边栏之前插入 svg 元素**\n\n现在侧边栏将出现在图表的右侧，因为 `svg` 元素现在出现在弹性容器中侧边栏之前。\n\
  \n在我们编写在侧边栏显示仓库详细信息的代码之前，我们需要一个获取许可证名称的函数。访问其他信息将很简单，但并非所有仓库都有许可证。15-11 显示了该新函数，将其插入到\
  \ update 函数中。\n\n```javascript\n--snip--\n// 左轴\nlet leftContainer = svg\n  .append(\"\
  g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left},\
  \ 0)`);\n\nfunction getLicense(d) {\n❶ let license = d.license?.name;\n\n❷ if (!license)\
  \ {\n    return \"No License\";\n  } else {\n    return license;\n  }\n}\n\nfunction\
  \ update(items) {\n--snip--\n```\n\n**Listing 15-11: getLicense 函数**\n\n如果仓库有许可证，则许可证名称将可以通过\
  \ `d.license.name` 获取，但如果它没有许可证，`d.license` 将为 `undefined`。我们使用 `?.` 运算符来测试这种情况，该运算符被称为\
  \ `可选链运算符` ❶。与普通的 `.` 运算符一样，`?.` 尝试获取运算符左侧的对象并访问运算符右侧指定的方法或属性。与普通的 `.` 运算符不同，如果左侧的对象为\
  \ `null` 或 `undefined`，`?.` 将返回 `undefined`。因此，如果 `d.license` 是 `undefined`（意味着仓库没有许可证），我们的\
  \ `license` 变量将被设置为 `undefined`，但如果 `d.license` 是对象（意味着仓库有许可证），则 `license` 将设置为\
  \ `d.license.name`。如果 `license` 最终为 `undefined` ❷，我们的 `getLicense` 函数返回字符串 \"No\
  \ License\"。否则，返回 `license` 的值。\n\n现在我们可以添加在悬停条形时更新侧边栏的代码。我们将通过在 `rect` 元素上添加 `mouseover`\
  \ 事件处理程序来实现。使用 Listing 15-12 中的代码更新 `script.js`。此代码位于 `update` 函数的末尾。\n\n```javascript\n\
  --snip--\n    .attr(\"width\", xScale.bandwidth())\n    .attr(\"height\", d => yScale(0)\
  \ - yScale(d.stargazers_count))\n    .on(\"mouseover\", (e, d) => {\n      let info\
  \ = d3.select(\"#info\");\n      info.select(\".repo .value a\").text(d.full_name).attr(\"\
  href\", d.html_url); 1\n      info.select(\".license .value\").text(getLicense(d));\n\
  \      info.select(\".stars .value\").text(d.stargazers_count);\n    });\n}\n\n\
  function getUrl() {\n--snip--\n```\n\n\n\n\n\n# 列表 15-12：在悬停时更新侧边栏\n\nD3 事件处理程序在调用时带有两个参数：事件对象\
  \ (`e`) 和绑定到触发事件的元素上的数据 (`d`)。我们在处理程序中执行的第一项工作是选择 `#info` 元素，因为我们想要修改的所有元素都是该元素的子元素。然后，我们更新\
  \ `.repo` 元素内部 `.value` 元素内的 `a` 元素 ❶（可以参考列表 15-8 或查看 `index.html` 以回想 HTML 结构）。我们正在同时设置该元素的文本内容和\
  \ `href` 属性。这样做的效果是创建一个指向仓库的链接，并将仓库的全名作为链接文本。类似地，我们认为 `.value .license` 元素的文本设置为\
  \ `getLicense` 为该数据返回的任何内容，并将 `.stars .value` 元素的文本设置为星数。\n\n重新加载页面并尝试将鼠标悬停在一些条形图上。你应该能看到类似图\
  \ 15-4 的效果。\n\n![](img/Figure_15-4.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 15-4：侧边栏显示其中一个仓库的详情</samp>\n\n对于你悬停的每个条形，该仓库的详情都应该出现在新的侧边栏中。如果你点击仓库名称，浏览器应该打开新标签页并带你进入仓库的\
  \ GitHub 页面。\n\n## 条形颜色编码\n\n为了视觉上传递一些额外信息，我们将根据许可证类型对条形进行颜色编码。D3 允许你创建尺度，其输入（域）是值，输出（范围）是颜色。你将在列表\
  \ 15-13 中看到如何操作。\n\n```\n--snip--\nfunction update(items) {\n❶ let licenses = new\
  \ Set(items.map(d => getLicense(d)));\n\n❷ let colorScale = d3.scaleOrdinal()\n\
  \    .domain(licenses)\n    .range(d3.schemeCategory10);\n\n  let xScale = d3.scaleBand()\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 15-13：为许可证创建颜色尺度</samp>\n\
  \n首先，我们需要收集所有唯一的许可证名称。为了做到这一点，我们对项目进行映射（map），并为每项项目调用我们的 `getLicense` 函数 ❶。这得到了一个许可证名称数组。在同一行中，我们将结果数组传递给\
  \ `Set` 构造函数。在编程术语中，*set*（集合）是唯一项目的集合，因此 `Set` 构造函数可以接收项目数组并过滤掉任何重复项。在 JavaScript\
  \ 中，集合像数组一样保持顺序。\n\n`d3.scaleOrdinal` 助手 ❷ 创建了一个具有离散输入和离散输出的尺度。在这里，输入是唯一的许可证名称，输出是颜色名称。对于尺范围范围，使用了\
  \ `d3.schemeCategory10`，这是一个包含 10 个十六进制颜色字符串的数组。你可以在控制台中查看它：\n\n```\nd3.schemeCategory10;\n\
  (10) ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', \n '#e377c2',\
  \ '#7f7f7f', '#bcbd22', '#17becf']\n```\n\n集合中的每个许可证将根据索引映射到这些颜色之一。如果许可证超过 10 个，颜色将循环回到开头（第\
  \ 11 和第 12 个许可证将使用与第一个和第二个相同的颜色）。\n\n接下来，我们必须根据许可证和颜色尺度设置条形的颜色。列表 15-14 显示了如何在 `update`\
  \ 函数末尾进行该更改。\n\n```\n--snip--\n  svg\n    .selectAll(\"rect\")\n    .data(items,\
  \ d => d.full_name)\n    .join(\"rect\")\n    .attr(\"x\", d => xScale(d.full_name))\n\
  \    .attr(\"y\", d => yScale(d.stargazers_count))\n    .attr(\"fill\", d => colorScale(getLicense(d)))\n\
  \    .attr(\"width\", xScale.bandwidth())\n    .attr(\"height\", d => yScale(0)\
  \ - yScale(d.stargazers_count))\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 15-14：设置 rect 的填充颜色</samp>\n\n在将许可证名称传递给 `colorScale` 之前，我们必须在 `d` 上调用 `getLicense`\
  \ 函数来获取许可证名称（因为可能是 \"No License\"）。这为设置 `rect` 的 `fill` 属性提供了颜色值。\n\n有了像这样的颜色编码，你确实需要一个图例让用户知道每个颜色的含义。我们将图例作为侧边栏中的另一个框，位于仓库信息框下方。它将包含与相应许可证名称并行的颜色块。首先，我们需要更多的\
  \ HTML。使用列表 15-15 中的更改更新 `index.html`。\n\n```\n--snip--\n        <p class=\"stars\"\
  >\n          <span class=\"label\">Stars</span>\n          <span class=\"value\"\
  ></</span>\n        </p>\n      </div>\n\n      <div id=\"key\" class=\"box\">\n\
  \        <h1>Key</h1>\n      </div>\n    </div>\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 15-15：为许可证图例添加 div 和标题</samp>\n\n在这里我们在侧边栏\
  \ `div` 内部创建了名为 `key` 的另一个 `div` 并给它设置了标题。我们将使用 JavaScript 创建图例的其他元素。\n\n接下来是用于为这些新元素以及我们将用\
  \ JavaScript 添加的子元素元素的 CSS。将列表 15-16 中的代码添加到 `style.css` 的末尾。\n\n```\n--snip--\n\
  #info a:hover {\n  text-decoration: underline;\n}\n\n#key h1 {\n  font-size: 1.5em;\n\
  }\n\n#key .color {\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n\
  \  margin: 0px 10px 0px 10px;\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 15-16：图例样式</samp>\n\n此处 `h1` 元素的字体大小设置为 `1.5em`，这意味着父元素字体大小的 1.5 倍。这确保了该标题将比其他文本大\
  \ 1.5 倍。`#key .color` 规则集用于设置作为图例一部分出现的颜色块。这些将是 `div` 元素，但 `display: inline-block`\
  \ 意味着它们的作用像行内元素（如 `span`）和块级元素（如 `div`）的混合：它们不会强制换行，但可以具有固定尺寸和间距。（行内元素无法具有宽度和高度，因为它们根据内容调整大小，而在这种情况下颜色块没有内容。）\n\
