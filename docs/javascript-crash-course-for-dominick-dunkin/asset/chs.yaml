  \ 提前设置字体。将 `text-anchor` 属性设置为中间 ❶ 会使文本围绕其计算的位置居中。我们还指定了两个变换 ❷：一个 `translate` 跟着一个\
  \ `rotate`。`translate` 将标签中心移动到正确位置，而 `rotate` 将其逆时针旋转 90 度（或顺针旋转 270 度）。\n\n###\
  \ 添加交互性\n\n我们的可视化已经具有一定的交互性，即悬停在条形上会在侧边栏显示有关该仓库的详细信息。如果能添加另一个交互元素允许用户过滤数据，将会很有趣。例如，既然我们现在有了一个列出不同许可证类型的键，可以使用它来选择性地显示或隐藏带有相应许可证的仓库。我们现在来实现这个交互功能，同时添加动画以使图表的变化平滑。\n\
