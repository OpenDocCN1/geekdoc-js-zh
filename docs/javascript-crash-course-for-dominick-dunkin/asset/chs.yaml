  \n  let leftAxis = d3\n    .axisLeft(yScale)\n  ❷ .tickFormat(d3.format(\"~s\"));\n\
  \n  bottomContainer.call(bottomAxis);\n  leftContainer.call(leftAxis);\n--snip--\n\
  ```\n\n列表 15-6: 清理比例尺\n\n对于底部坐标轴，我们将刻度值更新为空空列表❶，这有效地移除了刻度。对于左侧坐标轴，我们使用格式指定符 `~s`\
  \ 添加了刻度格式❷，例如，它会将数字 200,000 渲染为 200k，将 1,000,000 渲染为 1M。图 15-2 显示了更新后的坐标轴现在的样子。\n\
  \n![](img/Figure_15-2.png)\n\n图 15-2: 清理后的坐标轴\n\n左坐标轴中的数字现在更容易一目了，底部坐标轴不再是文本的堆砌。\n\
  \n### 绘制柱条\n\n现在坐标轴已经画好了，我们需要绘制柱条本身。将列表 15-7 中的代码添加到 `update` 函数的末尾。\n\n```javascript\n\
