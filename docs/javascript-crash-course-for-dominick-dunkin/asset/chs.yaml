  ```\n\n列表 15-23：添加动画\n\n为左轴添加动画非常简单：我们只需要在绘制轴之前在轴的容器上调用 `transition` ❶，这样左轴会在比例尺每次变化时进行过渡（这只有在最大的条形被隐藏或取消隐藏时才会发生，这会改变域的上限）。\n\
  \n要为条形添加动画，我们遵循了标准做法，切换到高级 join 技术，并为进入、更新和退出的元素添加过渡。进入元素开始时设置了所有属性且透明度为 0（意味着它们是\
  \ 100% 透明的）❷。然后我们调用 `transition` 并动画到 100% 不透明 ❸，这产生了进入元素淡入的效果。更新元素保持相同的颜色和不透明度，但它们的位置和尺寸可能会变化，因此我们对所有这些进行\
  \ ❹ 动画。这产生了拉伸和移动这些更新元素到它们新尺寸和位置的效果。退出元素的操作与进入元素相反，会淡出，我们通过将它们的透明度过渡回 0 ❺ 来实现。记住，在过渡完成后我们还必须对任何退出元素调用\
  \ `remove` ❻。\n\n重新加载并尝试隐藏和取消隐藏不同的许可证。图例中的第一个许可证始终对应于星数最多的仓库（因为仓库是按这种顺序排序的，我们按顺序从仓库提取许可证名称），所以如果你想看到左轴调整大小，你需要关闭该许可证。你应该看到带有该许可证的仓库淡出，其他仓库扩展以填充空间和重新计算的比例尺。图\
  \ 15-6(a) 显示了显示所有许可证的图表，而 图 15-6(b) 显示了隐藏 MIT 许可证（编写时，数据集中最流行的许可证）的图表。\n\n![](img/Figure_15-6.png)\n\
