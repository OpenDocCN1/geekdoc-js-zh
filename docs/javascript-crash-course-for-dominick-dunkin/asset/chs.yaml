  \n```css\n.lower {\n  fill: purple;\n}\n\n.upper {\n  fill: orangered;\n}\n\n.number\
  \ {\n  fill: green;\n}\n\n.other {\n  fill: #555;\n}\n```\n\n*列表 14-40: 为类定义样式*\n\
  \n现在当你重新加载页面并输入不同的字符时，你应该看到类似于图 14-16 的效果。\n\n![](img/Figure_14-16.png)\n\n*图 14-16:\
  \ 颜色编码条形*\n\n条形应该根据输入的字符类型分配不同的颜色。\n\n## 数据清洗\n\n通常在可视化数据集之前，需要通过修复其中包含的错误或不规则之处来进行清洗。例如，目前条图方法的问题是不同的空白字符显示为不同的条形，每个条形都有一个不可见的标签（因为标签文本只是空格）。这些空白字符包括空格、换行符、制表符以及通过不同键组合输入的各种其他空格（例如，在\
  \ macOS 上使用 OPTION-spacebar 或在 Windows 上使用 CTRL-SHIFT-spacebar 输入的不换行空格）。为了修复这个问题，我们在字符计数之前将所有空白字符转换为相同的\
  \ `\"<space>\"` 字符串，这样所有空白将由带有可读标签的单个条形可视化。如列表 14-41 所示更新你的 `script.js` 文件。这些更新位于文件末尾。\n\
  \n```\n--snip--\nfunction standardizeSpace(char) {\n❶ if (char.trim() == \" \")\
  \ {\n    return \"<space>\";\n  } else {\n    return char;\n  }\n}\n\nd3.select(\"\
  textarea\").on(\"input\", e => {\n  let frequencies = {};\n\n  e.target.value.split(\"\
  \ \").forEach(char => {\n❷ let standardized = standardizeSpace(char);\n    let currentCount\
  \ = frequencies[standardized] || 0;\n    frequencies[standardized] = currentCount\
  \ + 1;\n  });\n--snip--\n```\n\n*列表 14-41: 标准化空白字符*\n\n\n\n\n我们首先声明一个 `standardizeSpace`\
  \ 函数，它接收一个字符并对其调用 `trim` 方法 ❶。`trim` 方法会移除字符串开头或结尾的空白字符，因此如果它返回空字符串，我们就知道该字符是空白字符。在这种情况下，我们返回字符串\
  \ `\"<space>\"`。否则，我们原样返回该字符。然后，我们必须修改文本处理代码，在使用这些字符作为 `frequencies` 对象的键之前，调用我们的函数并对空白字符进行标准化\
  \ ❷。\n\n现在，当你在文本区域输入各种类型的空白字符时，你应该能看到一个标记为 `<space>` 的单个条形，而不是多个标签为空的条形。\n\n## 动画化更改\n\
  \n我们的最后一个任务是为轴和柱形图添加动画。这将有助于更容易地看到新元素的添加以及现有元素计数的变化。要为轴添加动画，我们只需要在 `update` 函数内部的\
  \ `topContainer` 和 `leftContainer` 选择器中添加对 `transition` 的调用，如列表 14-42 所示。\n\n```\n\
  --snip--\nlet leftAxis = d3.axisLeft(yScale);\n\ntopContainer\n  .transition()\n\
  \  .call(topAxis);\n\nleftContainer\n  .transition()\n  .call(leftAxis);\n--snip--\n\
  ```\n\n列表 14-42：为轴添加动画\n\n现在，当轴的范围（domains）更新以适应新数据时，现有的刻度（ticks）将动画到它们更新后的位置，新的刻度将淡入。\n\
  \n为柱形图添加过渡效果有两种选择：我们可以保留现有的 join 代码并仅添加单个 `transition` 调用，或者我们可以使用之前描述的高级 join 技术，这将允许我们根据元素是进入、更新还是退出来自定义过渡效果。正如你可能猜到的那样，我们将采用高级版本！你可以在列表\
  \ 14-43 中找到更新后的 update 代码。\n\n```\n--snip--\n  leftContainer\n    .transition()\n\
  \    .call(leftAxis);\n\n  svg\n    .selectAll(\"rect\")\n  ❶ .data(data, d => d.char)\n\
  \    .join(\n    ❷ enter => enter\n        .append(\"rect\")\n        .attr(\"x\"\
  , xScale(0))\n        .attr(\"y\", (d, i) => yScale(d.char))\n        .attr(\"class\"\
  , d => getClass(d.char))\n        .transition()\n        .attr(\"width\", d => xScale(d.count)\
  \ - xScale(0))\n        .attr(\"height\", yScale.bandwidth()),\n    ❸ update =>\
  \ update\n        .transition()\n        .attr(\"width\", d => xScale(d.count) -\
  \ xScale(0))\n        .attr(\"height\", yScale.bandwidth())\n        .attr(\"y\"\
  , (d, i) => yScale(d.char)),\n    ❹ exit => exit\n        .transition()\n      \
  \  .attr(\"width\", 0)\n        .attr(\"height\", 0)\n        .remove()\n    );\n\
  }\n--snip--\n```\n\n列表 14-43：为柱形图添加动画\n\n我们要做的第一件事是设置一个键函数 ❶，告诉 D3 使用数据的 `char`\
  \ 属性作为其标识符。接下来，我们切换到高级 join 技术，类似于列表 14-25。`enter` 函数 ❷ 先在调用 `transition` 之前添加 `rect`\
  \ 元素并设置它的 `x`、`y` 和 `class` 属性，这意味着这些属性不会被动画。`width` 和 `height` 属性在 `transition`\
  \ 调用之后，因此这些属性*会*被动画化。这样，新元素将从左轴原地生长。\n\n`update` 函数 ❸ 再次对 `width` 和 `height` 执行动画，同时也对\
  \ `y` 属性执行动画。这意味着当添加新元素时，现有元素将向上或向下滑动到它们的新位置。\n\n最后，`exit` 函数 ❹ 在元素删除之前将 `width`\
  \ 和 `height` 动画到 0，导致元素在之前的位置收缩消失。\n\n重新加载页面并尝试在文本区域中添加和删除字符。享受观察元素进入、退出或更新的动画效果。\n\
  \n### 总结\n\n在本章中，你学习了 SVG 的基础知识，以及如何使用 D3 根据数据集的实时变化来创建、更新和删除 SVG 元素。到目前，你应该对如何在\
  \ D3 中构建基于数据的应用程序有了相当好的理解。在下一章中，我们将把这些知识付诸实践，构建一个从 API 读取数据并将其渲染为交互式图表的应用程序。\n\n\
  ## 15 可视化来自 GitHub Search API 的数据\n\n在最后一个项目中，你将构建一个应用程序，从公共 API 读取数据并使用 D3 根据这些数据构建一个交互式柱形图。我们将从\
  \ GitHub Search API 读取数据。该 API 允许你搜索 GitHub 的数据，GitHub 是托管 Git 仓库的服务（Git 是一种用于跟踪软件项目源代码流行的版本控制系统）。该\
  \ API 使用 HTTPS 协议并根据你编码到 URL 中的搜索查询返回 JSON 格式的数据。\n\n如果你以前没有用过 GitHub，请访问 [`github.com`](https://github.com)\
  \ 查看它的样子。在页面顶部，你会看到一个搜索框，可以用它来搜索公共的开源仓库（即源代码供任何人阅读和使用的仓库）。与其手动使用该搜索框，GitHub Search\
  \ API 允许我们以程序的方式执行搜索——例如使用 JavaScript。该 API 可以搜索 GitHub 上的各种项目，如仓库、用户和问题（issues）。我们将使用仓库搜索功能查找顶部的\
  \ JavaScript 仓库。然后我们将绘制一个按流行程度排名仓库的 D3 柱形图。观众可以通过悬停在条形上了解更多关于每个仓库的信息。我们还将添加一些交互性，允许观众根据许可证（license）隐藏或显示仓库。\n\
  \n这个项目将让你获得处理来自 JSON API 的真实数据的经验。大量的编程工作可以归结为向第三方 API 发起请求并对返回的数据进行处理，正如你在这里练习的那样。\n\
  \n### 环境准备\n\n要开始之前，创建一个新目录 `github`，并添加空的 `style.css` 和 `script.js` 文件。然后创建一个 `index.html`\
  \ 文件，并在列表 15-1 中添加代码。\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>GitHub</title>\n\
  \    <link rel=\"stylesheet\" href=\"style.css\">\n  </head>\n  <body>\n    <script\
  \ src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script src=\"script.js\"\
  ></script>\n  </body>\n</html>\n```\n\n列表 15-1：用于我们 GitHub 可视化的 index.html 文件\n\n\
  这是我们在第 14 章 中使用的基础 HTML 文件。它通过链接到 [unpkg.com](https://unpkg.com) 上库副本的脚本元素来访问 D3。\n\
  \n### 获取数据\n\n现在让我们尝试从 GitHub Search API 获取数据。为了实现这一点，我们需要将请求格式化为 URL 的一部分。访问该 URL\
  \ 将检索数据。整个 URL（包括我们将使用的搜索查询）如下所示（注意为了适应页面，这里被分成了两行）：\n\n```\nhttps://api.github.com/search/repositories?q=language%3Ajavascript%20stars%3A%3E10000&per_page=20&sort=stars\n\
  ```\n\n\n\n然而，我们不会手动输入 URL，而是将使用 `JavaScript` 构建它，这将使其更容易理解和修改。\n\nURL 包含两个部分：基础\
  \ URL（用于我们访问 `API`）和查询字符串（我们在其中指定想要的数据）。这部分部分由一个问号（`?`）分隔。查询字符串包含键值对，用于向 `API` 发送有关我们正在进行的查询的信息。每个键和值之间用等号（`=`）连接，每个键值对之间用\
  \ ampersand（`&`）分隔。在这个 URL 中，键为 `q`（搜索查询）、`per_page`（每页结果数）和 `sort`（结果排序方式）。查询字符串中的键和值允许包含一组有限字符：a–z、A–Z、0–9、连字符（`-`）、点（`.`）、下划线（`_`）、波浪号（`~`）以及一组特定的特殊字符。所有其他字符必须使用\
  \ `URL encoding` 系统表示，这就是 URL 中所有百分号（`%`）的来源。例如，冒号（`:`）被编码为 `%3A`，空格被编码为 `%20`。\n\
  \n为了简化操作，我们将编写一个函数，它接收一个包含未编码查询字符串参数的对象，并将其转换为格式正确且编码过的 URL。将 Listing 15-2 中的代码添加到\
  \ `script.js`。\n\n```\nfunction getUrl() {\n❶ let baseUrl = \"https://api.github.com/search/repositories\"\
  ;\n\n❷ let params = {\n    q: \"language:javascript stars:>10000\",\n    per_page:\
  \ 20,\n    sort: \"stars\"\n  };\n\n❸ let queryString = Object.entries(params).map(pair\
  \ => {\n    return `${pair[0]}=${encodeURIComponent(pair[1])}`;\n  }).join(\"&\"\
  );\n\n❹ return `${baseUrl}?${queryString}`;\n}\n\nlet url = getUrl();\n\nconsole.log(url);\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 15-2: 创建 URL</samp>\n\
  \n创建 URL 的代码位于 `getUrl` 函数中。该函数首先设置基础 URL（查询字符串之前的 URL 部分）❶。然后，为了构建查询字符串，我们从开始创建一个\
  \ `params` 对象 ❷，其中使用 GitHub 的搜索查询格式设置搜索查询 `q`。具体来说，我们正在搜索语言为 `JavaScript` 且拥有超过\
  \ 10,000 个星数的仓库（GitHub 用户可以“星标”仓库以备后之用，因此星数是流行程度的粗略衡量标准）。如果你想，可以在 [`github.com`](https://github.com)\
  \ 上的搜索框中尝试此查询。\n\n接下来，我们对 `params` 中的键值对进行映射（map），为每对创建一个格式为“key=value”的字符串 ❸。键不需要进行“URL\
  \ 编码”——因为未加引号的对象键不包含任何特殊字符，因此它们在 URL 中已经是有效的了——但我们使用内置函数 `encodeURIComponent` 对值进行编码，该函数会将任何不允许的字符替换为它们的百分比编码版本。然后，我们将字符串连接在一起，用\
  \ `&` 字符分隔，通过组合基础 URL、`?` 字符和查询字符串来构建并返回最终的 URL ❹。我们通过调用 `getUrl` 函数并将结果打印到控制台来结束脚本。\n\
  \n当你加载页面并打开控制台时，你应该能看到之前打印的 URL。如果你复制该 URL 并将其粘贴到浏览器的地址栏中，你应该能看到大量的 `JSON` 数据。如果没有，请确保\
  \ URL 与上一个页面的 URL 匹配，如果不匹配请检查你的代码。如果 URL 看起来正确但你没有获取数据，或者收到了错误消息，可能是 GitHub 更改了其\
  \ `API` 的工作方式。请参见后续的“已验证与未验证的 API”框以获取在这种情况下的操作指导。\n\n要将 `JSON` 数据引入你的应用程序，你可以使用\
  \ D3 的 `json` 辅助方法，它可以从给定的 URL 获取 `JSON`。按照 Listing 15-3 所示所示更新 `script.js` 的末尾。\n\
  \n```\n--snip--\nlet url = getUrl();\n\nd3.json(url).then(data => {\n  console.log(data);\n\
  });\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 15-3: 获取 JSON\
  \ 数据</samp>\n\n从 `API` 获取大量数据可能需要一些时间，因此 `d3.json` 方法返回一个 `Promise`，这是一种代表未来可用内容的对象类型。`then`\
  \ 方法接收一个在数据准备绪后调用的函数。D3 将 `JSON` 响应字符串转换为 `JavaScript` 对象，因此 `data` 将是一个对象。在这里，我们只需将其打印到控制台。\n\
  \n当你刷新页面并在等待几秒钟后，你应该会在控制台中看到数据。花点时间检查它。你应该看到三个顶级属性：`incomplete_results`、`items`\
  \ 和 `total_count`。如果查询耗时过长且 `API` 只能返回部分结果，`incomplete_results` 属性将为 true；否则，它将为\
  \ false。`total_count` 属性给出此搜索查询的结果数（这是搜索找到的结果总数，其中仅返回了前 20 个）。`items` 数组包含当前调用的结果；它应该包含\
  \ 20 个项目。每个项目都是一个对象，包含有关特定仓库的信息，包括其名称、描述和各种其他细节。其中几个字段本身就是 GitHub `API` URL，可以调用以获取有关仓库的额外信息。例如，`languages_url`\
  \ 是一个 `API` URL，它告诉你仓库使用了哪些编程语言，按每种语言的代码行数分类。\n\n在这个项目中，我们将使用每个项目中的几个字段：`full_name`、`stargazers_count`、`html_url`\
  \ 和 `license`。`full_name` 字段持有仓库所有者的名称和正斜杠的仓库名称：例如：“facebook/react”。`stargazers_count`\
  \ 字段给出用户星标仓库的次数。`html_url` 字段持有仓库在 GitHub 上的 URL。最后，`license` 有关于仓库使用的软件许可证的数据。\n\
  \n> <samp class=\"SANS_Dogma_OT_Bold_21\">注意</samp>\n\n> 开源代码所有者使用软件许可证告诉用户他们对代码可以和不能做什么。例如，某些许可证非常严格，规定代码不能用于非开源应用程序。其他许可证则宽松得多，允许你对代码做任何事情。\n\
  \n### <samp class=\"SANS_Futura_Std_Bold_11\">基础可视化</samp>\n\n现在我们有了数据，将创建一个基础柱状图，显示数据集中每个仓库收到了多少星。为了实现这一点，我们将创建所需的\
  \ SVG 元素，绘制轴并绘制柱形。稍我们将改进这个基础图表，使其更具信息量、样式且具有交互性。\n\n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\"\
  >创建元素</samp>\n\n为了创建图表，我们首先要创建一个它的 `svg` 元素以及用于轴的两个 `g` 元素。情况下，轴位于底部和左侧。将 Listing\
  \ 15-4 中的代码添加到 `script.js` 的开头，位于 `getUrl` 函数之前。\n\n```\nconst width = 600;\nconst\
  \ height = 400;\n\nlet svg = d3\n  .select(\"body\")\n❶ .append(\"svg\")\n  .attr(\"\
  width\", width)\n  .attr(\"height\", height);\n\n❷ let margin = {top: 20, right:\
  \ 10, bottom: 20, left: 50};\n\n// 底部轴容器\nlet bottomContainer = svg\n❸ .append(\"\
  g\")\n  .attr(\"id\", \"bottom\")\n  .attr(\"transform\", `translate(0, ${height\
  \ - margin.bottom})`);\n\n// 左侧轴容器\nlet leftContainer = svg\n❹ .append(\"g\")\n\
  \  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left}, 0)`);\n\
  \nfunction getUrl() {\n--snip--\n```\n\n\n\n\n就像我们在第 14 章中为字符频率表做的那样，我们在页面上添加了一个\
  \ `svg` 元素❶ 并设置其宽度和高度。然后，我们创建一个 `margin` 对象❷，并添加包含底部❸ 和左侧 ❹ 轴的 `g` 元素，我们根据边距对它们进行定位。\n\
  \n### 绘制坐标轴\n\n创建好元素后，我们就可以开始编写 `update` 函数，它将负责绘制可视化图形。首先，我们将根据数据创建比例尺并绘制坐标轴。按照列表\
  \ 15-5 所示对 `script.js` 进行修改。\n\n```\n--snip--\n// Left axis container\nlet leftContainer\
  \ = svg\n  .append(\"g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left},\
  \ 0)`);\n\nfunction update(items) {\n❶ let xScale = d3.scaleBand()\n    .domain(items.map(d\
  \ => d.full_name))\n    .range([margin.left, width - margin.right])\n    .padding(0.3);\n\
  \n  let yScale = d3.scaleLinear()\n  ❷ .domain([0, d3.max(items, d => d.stargazers_count)])\n\
  \    .range([height - margin.bottom, margin.top])\n    .nice();\n\n❸ let bottomAxis\
  \ = d3.axisBottom(xScale);\n  let leftAxis = d3.axisLeft(yScale);\n\n❹ bottomContainer.call(bottomAxis);\n\
  \  leftContainer.call(leftAxis);\n}\n\nfunction getUrl() {\n--snip--\n\nd3.json(url).then(data\
  \ => {\n❺ update(data.items);\n});\n```\n\n列表 15-5: 绘制坐标轴\n\n`update` 函数接收来自 API\
  \ 响应的 `items` 数组。我们的柱状图为每个仓库准备了一个垂直条形，因此我们使用 `scaleBand` 辅助函数创建水平的 `xScale`，以便均匀地分布柱条❶。域（domain）是每个仓库的\
  \ `full_name`。由于每个仓库的全名都是唯一的，这将产生 20 个带（bands）。垂直的 `yScale` 用于可视化每个仓库拥有的星标数量，因此它的域从零到最大\
  \ `stargazers_count` ❷。我们在这里使用 `nice` 将比例尺的顶部四舍入到下一个刻度值。在创建完比例尺后，我们创建了坐标轴生成器❸，然后使用这些生成器将坐标轴绘制到容器中❹，就像我们在处理字符频率项目时做的那样。\n\
  \n这里最后的一件事是在 `d3.json` 回调函数内部调用我们的 `update` 函数，传递 `items` 数组❺。我们能够直接从获取数据跳转到调用 `update`，因为\
  \ GitHub Search API 方便地返回了我们渲染所需的数据格式。不需要像字符频率示例那样对数据进行处理（在那个例子中源数据只是一个字符串，我们需要一个描述每个字符及其计数的排序对象数组）。\n\
  \n当你重新加载 `index.html` 时，现在应该能看到坐标轴，如图 15-1 所示。稍后我们会修复底部坐标轴标签；它们现在是一团糟，因为 D3 正在尝试渲染每个仓库的全名。此外，你的左坐标轴刻度可能会比图中显示的\
  \ 200,000 高，取决于在你运行此代码时最流行的 JavaScript 项目有多少星标。在本文写作时，`facebook/react` 是 GitHub\
  \ 上星标最多的 JavaScript 项目，大约有 196,000 个。\n\n![](img/Figure_15-1.png)\n\n图 15-1: 坐标轴\n\
  \n考虑到我们在这里处理的是如此巨大的数字（而且每天都在增大），可以使用 SI 前缀（如代表 1,000 的 `k`）来提高可读性。在 D3 中通过正确的数字格式可以轻松实现。在进行此更改的同时，我们还将底部坐标轴的刻度。这些更改请参见列表\
  \ 15-6。\n\n```\n--snip--\n  let yScale = d3.scaleLinear()\n    .domain([0, d3.max(items,\
