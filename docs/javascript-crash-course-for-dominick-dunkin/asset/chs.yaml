  number\";\n  } else {\n    return \"other\";\n  }\n}\n\nfunction update(data) {\n\
  --snip--\n```\n\n*列表 14-38: getClass 函数*\n\n该函数根据提供的正则表达式对字符进行测试，并返回相应的类名：\"lower\"\
  、\"upper\"、number\" 或 \"other\"。接下来，我们将更新渲染代码，使用此函数为每个元素设置类名，如列表 14-39 所示。\n\n```\n\
