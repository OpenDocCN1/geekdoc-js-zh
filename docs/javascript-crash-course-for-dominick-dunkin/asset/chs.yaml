  \ CSS\n现代网页由三种语言制成：HTML、JavaScript 和 CSS。在基础层，HTML 定义了页面的 `content`（内容），JavaScript\
  \ 定义了页面的 `behavior`（行为），而 CSS（`Cascading Style Sheets`，级联样式表的缩写）则定义了页面的 `appearance`（外观）。正如我们所看到的，网页浏览器有显示各种\
  \ HTML 元素（如标题和段落）的默认方式。CSS 赋予了对这些元素外观更多的控制，允许我们覆盖元素的默认外观，例如尺寸、颜色和字体。\n由于这是一本 JavaScript\
  \ 教程，我们不会深入研究 CSS。然而，当我们开始制作动态网页时，了解 CSS 的基础将会有帮助。此外，我们将要用到的一些 DOM API 方法依赖于 CSS\
  \ 选择器语法，我们稍后会讨论它。理解该语法源于何处有助于你有效地使用这些方法。\n### link 元素\n在本节中，我们将创建一个 CSS 文件并包含在页面中，然后使用该文件来覆盖某些元素的样式。包含\
  \ CSS 文件与包含 JavaScript 文件类似，但你需要使用一个不同的 HTML 元素，称为 `link`。`link` 元素是在页面上包含外部资源的通用方法。要为我们即将编写的\
  \ CSS 文件创建链接，请在文本编辑器中打开 `index.html`，并添加列表 7-6 中高亮的行。\n```\n<html>\n    <title>Hello,\
  \ JavaScript!</title>\n    <link href=\"style.css\" rel=\"stylesheet\">\n  <body>\n\
  \  </body>\n```\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 7-6：使用 link\
  \ 元素添加 CSS 文件</samp>\n我们为 `link` 元素上设置了两个属性：`href`（`hypertext reference` 的缩写）和 `rel`（`relationship`\
  \ 的缩写）。`href` 属性的工作方式与 `script` 元素上的 `src` 属性相同：你将链接的文件作为属性的值。`rel` 属性指定了你所链接的文件类型以及它与文档的关系。在这里，我们提供了字符串\
  \ `\"stylesheet\"`，这意味着被链接的文件应该被解释为页面的样式表，其中包含关于元素应该如何显示的信息。\n注意，与我们目前为止看到的 HTML\
  \ 元素不同，`link` 元素不需要闭合标签 `</link>`。这是因为虽然其他元素可能包含内容，但 `link` 元素永远不会包含。因此，不需要闭合标签来标记内容的结束。\n\
  ### 规则集\nCSS 文件由一个或多个 `rulesets`（规则集）组成，这些规则集建立了文档中元素应该如何设置样式。我们现在编写一个基础规则集。在 `chapter7`\
  \ 目录下创建一个名为 `style.css` 的文件，并输入列表 7-7 中的内容。\n```\n  color: red;\n}\n<samp class=\"\
