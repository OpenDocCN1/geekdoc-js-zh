  <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 6-1：kiki 的原型链</samp>\n图中的每个框代表一个对象，以对象的名称作为标题。每个框的左列显示对象属性的名称，右列显示这些属性的值。例如，`kiki`\
  \ 对象的 `name` 属性值为 `\"Kiki\"`，而 `Cat.prototype` 对象的 `sayHello` 属性是一个函数，用 `f()` 表示（记住，方法只是作为对象属性的函数）。\n\
  某些属性值指向或引用了其他对象。例如，所有构造函数都有一个 `prototype` 字段，该字段指向将用作该构造函数创建的实例的原型的对象。因此，`Cat` 构造函数的\
  \ `prototype` 字段指向 `Cat.prototype`。同样，对象通过它们的 `[[Prototype]]` 属性链接到原型。例如，`kiki`\
  \ 的 `[[Prototype]]` 属性链接到 `Cat.prototype`，因为 `kiki` 是使用 `Cat` 构造函数创建的。所有的原型对象都有一个\
  \ `constructor` 字段，链接回它们所属的构造函数。如你所见，`Cat.prototype` 的 `constructor` 字段连接回 `Cat`，而\
  \ `Object.prototype` 的 `constructor` 字段连接到 `Object`。像 `kiki` 这样的实例本身没有直接定义 `constructor`\
  \ 字段。相反，通过遍历原型链在实例的原型上查找 `constructor`。\n正如我们在 `Dog` 示例中看到的，类在底层使用了相同的原型机制，因此这种遍历原型链的技术也是在类实例上查找属性和方法的方法。\n\
  #### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\">覆盖方法</samp>\n\
  理解 JavaScript 如何通过遍历原型链来定位对象的方法是非常重要的，因为这允许我们覆盖对象本会从其原型继承的方法定义。当我们希望一个对象从原型继承大部分行为，但又想赋予它一些独特行为时，这种技术就非常有用。当你调用一个方法时，JavaScript\
  \ 在遍历原型链时使用找到的该方法的第一个定义，因此，如果我们直接在对象上定义一个方法，且该方法的名称与对象原型上定义的方法同名，那么对象本身上的方法具有更高优先级。\n\
  例如，假设你想要一个新的 `Cat` 对象，其打招呼的方式与 `Cat.prototype` 上定义的方法不同。你可以直接在该新猫上设置一个单独的 `sayHello`\
  \ 方法，如下：\n```\nmoona.sayHello = function () {\n};\n❶ HELLO!!! I'M MOONA!\n❷ Miaow!\
  \ My name is Kiki.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n每一对标签都定义了一个 `element`（元素）。每个\
