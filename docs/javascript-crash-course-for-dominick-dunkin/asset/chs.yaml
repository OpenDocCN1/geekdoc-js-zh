  \ 元素中。\n## DOM API\nWeb 浏览器允许你使用 JavaScript 通过 `DOM API` 修改 DOM。正如在本章开头提到的，API 代表\
  \ `application programming interface`（应用程序编程接口），它是通过代码与系统或对象交互的一种。正如你在更新 `h1` 元素时看到的那样，修改\
  \ DOM 就会修改网页，你所做的任何更改通常会立即生效。这意味着 `DOM API` 为我们提供了一种编写代码的方法，可以为页面查看者提供即时的视觉反馈。\n\
  API 提供了一系列用于与 DOM 交互的方法和属性。许多这些方法和属性可以在 `document` 对象上找到，该对象由 `DOM API` 提供，代表当前文档（即网页）。例如，`document.title`\
  \ 允许你获取和设置当前标签页的标题。让我们现在试一下。在 `helloworld.html` 的 JavaScript 控制台中运行以下代码：\n```\n\
