  \ paddle) {\n  // 检查挡板和球在垂直和水平方向上是否重叠\n  return (\n    ball.left   < paddle.right\
  \ &&\n    ball.right  > paddle.left &&\n    ball.top    < paddle.bottom &&\n   \
  \ ball.bottom > paddle.top\n  );\n}\n\nfunction checkCollision() {\n--snip--\n```\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 10-11: checkPaddleCollision\
  \ 函数</samp>\n\n该函数将带有 `ball` 和之前定义的每个挡板对象被调用。它使用了一个由四个子表达式组成的长布尔表达式，这些子表达式通过 `&&`\
  \ 连接在一起，因此只有当所有四个子表达式都为真时，它才会返回 `true`。（我为每个子表达式添加了空格，以便操作数垂直对齐；这只是为了让代码更容易读。）在英语中，这些子表达式的意思是：\n\
  \n1. `ball` 的左边缘必须在 `paddle` 右边缘的左侧。\n2. `ball` 的右边缘必须在 `paddle` 左边缘的右侧。\n3. `ball`\
  \ 的顶部必须在 `paddle` 底部边缘的上方。\n4. `ball` 的底部必须在 `paddle` 边缘的下方。\n\n如果前两个条件为真，则球在水平方向上交叉；如果后两个条件为真，则球在垂直方向上交叉。只有当所有四个条件都真时，球才真正与挡板交叉。为了说明这一点，请参见图\
  \ 10-5。\n\n图中显示了我们可能检查的四种场景。在所有场景中，挡板的边界如下：`{left: 10, right: 15, top: 5, bottom:\
  \ 25}`。\n\n在图 10-5(a)中，`ball` 的边界为 `{left: 20, right: 25, top: 30, bottom: 35}`。在这种情况下，`ball.left\
  \ < paddle.right` 为假（球左侧不在挡板右侧的左侧），但 `ball.right > paddle.left` 为真。同样，`ball.top\
  \ < paddle.bottom` 为假，`ball.bottom > paddle.top` 为真。球既没有在垂直方向也没有在水平方向上与挡板交叉。\n\n\
  在图 10-5(b)中，`ball` 的边界为 `{left: 20, right: 25, top: 22, bottom: 27}`。此时，`ball.top\
  \ < paddle.bottom` 和 `ball.bottom > paddle.top` 均为真，这意味着球在垂直方向上与挡板交叉，但没有在水平方向交叉。\n\
  \n在图 10-5(c)中，`ball` 的边界为 `{left: 13, right: 18, top: 30, bottom: 35}`。在这种情况下，球在水平方向上与挡板交叉，但没有在垂直方向交叉。\n\
  \n最后，在图 10-5(d)中，`ball` 的边界为 `{left: 13, right: 18, top: 22, bottom: 27}`。现在球在水平和垂直方向上都与挡板交叉。四个子表达式均为真，因此\
  \ `checkPaddleCollision` 返回 `true`。\n\n![](img/Figure_10-5.png)\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">图 10-5: 碰撞检测条件</samp>\n\n现在是在 `checkCollision`\
  \ 函数内部实际调用 `checkPaddleCollision` 函数了，每个挡板调用一次，并处理函数返回 `true` 的情况。你可以在列表 10-12 中找到这段代码。\n\
  \n```\n--snip--\n  let rightPaddle = {\n    left: width - PADDLE_WIDTH - PADDLE_OFFSET,\n\
  \    right: width - PADDLE_OFFSET,\n    top: rightPaddleTop,\n    bottom: rightPaddleTop\
  \ + PADDLE_HEIGHT\n  };\n\n  if (checkPaddleCollision(ball, leftPaddle)) {\n   \
  \ // 左挡板碰撞\n  ❶ xSpeed = Math.abs(xSpeed);\n  }\n\n  if (checkPaddleCollision(ball,\
  \ rightPaddle)) {\n    //发生了右挡板碰撞\n  ❷ xSpeed = -Math.abs(xSpeed);\n  }\n\n  if\
  \ (ball.left < 0 || ball.right > width) {\n    xSpeed = -xSpeed;\n  }\n  if (ball.top\
  \ < 0 || ball.bottom > height) {\n    ySpeed = -ySpeed;\n  }\n}\n--snip--\n```\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 10-12: 检查挡板碰撞</samp>\n\n\
  记住 `checkPaddleCollision` 接收一个代表球的对象和一个代表挡板的对象，如果两者交叉，则返回 `true`。如果 `checkPaddleCollision(ball,\
  \ leftPaddle)` 返回 `true`，我们将 `xSpeed` 设置为 `Math.abs(xSpeed)` ❶，其的效果将其设置为 4，因为在我们的游戏中，`xSpeed`\
  \ 永远只有 4（向右移动时）或 -4（向左移动时）。\n\n你可能在奇怪，为什么我们不像之前处理垂直墙碰撞代码时那样直接取反 `xSpeed`。使用绝对值是一个小技巧，可以避免多次碰撞，否则球可能会在挡板“内部”反复弹跳。如果球在挡板末端恰好击中某个点，它可能会被弹回，但下一帧也会导致与同一个挡板发生碰撞。如果我们只是取反\
  \ `xSpeed`，它就会一直弹跳。通过强制让更新后的 `xSpeed` 为正数，我们可以确保与左挡板的碰撞始终会导致球向右侧弹回。\n\n之后，我们对右挡板执行同样的操作。在这种情况下，如果发生碰撞，我们将\
  \ `xSpeed` 更新为 `-Math.abs(xSpeed)` ❷，这实际上是 -4，意味着球将向左弹跳。\n\n再次刷新 `index.html`，尝试用鼠标移动右挡板让球击中它。你现在应该可以看到球与挡板之间的弹跳了！此时球仍然可以安全地从侧壁弹回，但我们很快就会修复这个问题。\n\
  \n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\">在挡板末端弹跳</samp>\n\
  \n我在本章开头提到，在《Pong》中，你可以通过击中挡板顶部或底部来改变球的弹跳角度。我们现在来实现该功能。首先，我们将在 `checkCollision`\
  \ 之前添加一个名为 `adjustAngle` 的新函数。它检查球是否靠近挡板的顶部或底部，如果是，则更新 `ySpeed`。代码请参见列表 10-13。\n\
  \n```\n--snip--\nfunction adjustAngle(distanceFromTop, distanceFromBottom) {\n❶\
  \ if (distanceFromTop < 0) {\n    // 如果击中挡板顶部，减小 ySpeed\n    ySpeed -= 0.5;\n❷ }\
  \ else if (distanceFromBottom < 0) {\n    // 如果击中挡板底部，增加 ySpeed\n    ySpeed += 0.5;\n\
  \  }\n}\n\nfunction checkCollision() {\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 10-13: 调整弹跳角度</samp>\n\n\n\n\n\n`adjustAngle` 函数有两个参数，`distanceFromTop` 和 `distanceFromBottom`。它们分别代表球的顶部到挡板顶部的距离，以及挡板底部到球底部的距离。该函数首先检查\
  \ `distanceFromTop` 是否小于 `0` ❶。如果是，意味着在碰撞时球的顶边缘在挡板的顶边缘上方，这就是我们定义“靠近挡板顶部”的方式。在这种情况下，我们从\
  \ `ySpeed` 中减去 `0.5`。如果球在撞击挡板顶部附近时正在向下移动，那么 `ySpeed` 为正值，此时减去 `0.5` 就会减小垂直速度。例如，在游戏开始时，`ySpeed`\
  \ 为 `2`。如果你调整挡板使球击中顶部，`ySpeed` 在反弹后将变为 `1.5`，有效地减小了反弹角度。然而，如果球正在向上移动，那么 `ySpeed`\
  \ 为负值。在这种情况下，在撞击挡板顶部附近减去 `0.5` 将增加球的垂直速度。例如，`-2` 的 `ySpeed` 将变为 `-2.5`。\n\n如果球撞击挡板底部附近\
  \ ❷，情况则相反。在这种情况下，我们给 `ySpeed` 加上 `0.5`，如果球正在向下移动则增加垂直速度，如果球正在向上移动则减小速度。\n\n接下来，我们需要更新\
  \ `checkCollision` 函数，将调用新的 `adjustAngle` 函数作为两个挡板碰撞检测逻辑的一部分。代码列表 10-14 显示了这些更改。\n\
  \n```\n--snip--\n  let rightPaddle = {\n    left: width - PADDLE_WIDTH - PADDLE_OFFSET,\n\
  \    right: width - PADDLE_OFFSET,\n    top: rightPaddleTop,\n    bottom: rightPaddleTop\
  \ + PADDLE_HEIGHT\n  };\n\n  if (checkPaddleCollision(ball, leftPaddle)) {\n   \
  \ // 左侧挡板碰撞发生\n    let distanceFromTop = ball.top - leftPaddle.top;\n    let distanceFromBottom\
  \ = leftPaddle.bottom - ball.bottom;\n    adjustAngle(distanceFromTop, distanceFromBottom);\n\
  \    xSpeed = Math.abs(xSpeed);\n  }\n\n  if (checkPaddleCollision(ball, rightPaddle))\
  \ {\n    // 右侧挡板碰撞发生\n    let distanceFromTop = ball.top - rightPaddle.top;\n  \
  \  let distanceFromBottom = rightPaddle.bottom - ball.bottom;\n    adjustAngle(distanceFromTop,\
  \ distanceFromBottom);\n    xSpeed = -Math.abs(xSpeed);\n  }\n--snip--\n```\n\n\
  代码列表 10-14：调用 adjustAngle\n\n在每个挡板的 if 语句中，我们声明了 `distanceFromTop` 和 `distanceFromBottom`，这是\
  \ `adjustAngle` 函数所需的参数。然后我们像以前一样，在更新 `xSpeed` 之前调用 `adjustAngle`。\n\n现在尝试运行游戏，看看你是否能从挡板边缘击中球！\n\
  \n### 得分\n\n游戏在可以获胜或失败时通常更有趣。在*Pong*（乒球）中，如果你击中了对方挡板后面的墙，就会得分。当这种情况发生时，球将重置为下一回合的的起始位置和速度。我们将在节中也会处理这部分，但首先为了记录分数，我们需要创建一些新变量。使用代码列表\
  \ 10-15 中的代码更新 `script.js`。\n\n```\n--snip--\nlet leftPaddleTop = 10;\nlet rightPaddleTop\
  \ = 30;\n\nlet leftScore = 0;\nlet rightScore = 0;\n\ndocument.addEventListener(\"\
  mousemove\", e => {\n  rightPaddleTop = e.y - canvas.offsetTop;\n});\n--snip--\n\
  ```\n\n代码列表 10-15：记录分数的变量\n\n在这里我们声明了两个新变量 `leftScore` 和 `rightScore`，并将它们都设为 `0`。稍后我们将添加逻辑，在得分时增加这些变量的值。\n\
  \n接下来，我们将显示分数的代码添加到 draw 函数末尾。如代码列表 10-16 所示更新函数。\n\n```\n--snip--\n  ctx.fillRect(\n\
  \    width - PADDLE_WIDTH - PADDLE_OFFSET,\n    rightPaddleTop,\n    PADDLE_WIDTH,\n\
  \    PADDLE_HEIGHT\n  );\n\n  // 绘制分数\n  ctx.font = \"30px monospace\";\n  ctx.textAlign\
  \ = \"left\";\n  ctx.fillText(leftScore.toString(), 50, 50);\n  ctx.textAlign =\
  \ \"right\";\n  ctx.fillText(rightScore.toString(), width - 50, 50);\n}\n\nfunction\
  \ update() {\n--snip--\n```\n\n代码列表 10-16：绘制分数\n\n这段代码使用了一些我们还没有过的新的 canvas 属性和方法。首先，我们使用\
  \ `ctx.font` 来设置即将绘制的文本字体。这类似于 CSS 字体声明。在这种情况下，我们将字体设置为 30 像素高且为等宽样式（monospace）。*等宽字体（Monospace）*意味着每个字符占据的宽度相同，通常用于代码，正如本书中的代码列表所示。它看起来像这样。有很多等宽字体，但由于操作系统可能安装了不同的字体，所以我们只给了一个通用的字体样式（`monospace`），这意味着操作系统应该使用该字式的默认字体。在大多数操作系统中，Courier\
  \ 或 Courier New 是默认的等宽字体。\n\n接下来，我们使用 `ctx.textAlign` 设置文本的对齐方式。我们选择了“左”对齐，但因为我们只想让它应用于左侧分数，所以在绘制右侧分数之前，我们将对齐方式改为“右”对齐。这样，如果分数变成两位，数字将向屏幕中间延伸，从而保持视觉上的平衡。\n\
  \n要显示左侧分数，我们使用 `ctx.fillText` 方法。该方法有三个参数：要绘制的文本，以及绘制它的 x 和 y 坐标。第一个参数必须是字符串，所以我们对\
  \ `leftScore` 调用了 `toString` 方法。我们使用 `50` 作为 x 和 y 坐标，将文本放置在左上角附近。\n\n> *fillText\
  \ 的 x 坐标含义取决于文本的对齐方式。对于左对齐的文本，x 坐标指定文本的左边缘，而对于右对齐的文本，它指定右边缘。*\n\n右侧分数的处理方式与左侧类似：我们设置对齐方式，然后调用\
  \ `fillText` 显示分数。这次我们将 x 坐标设置为 `width - 50`，因此它距离右侧的距离与左侧分数距离左侧的距离一样。\n\n刷新 `index.html`\
  \ 时，你应该能看到渲染出的初始分数，如图 10-6 所示。\n\n![](img/Figure_10-6.png)\n\n图 10-6：显示分数\n\n现在我们必须处理球撞击侧壁的情况。与其反弹，不如应该增加相应的分数并将球重置为原始速度和位置。首先我们将进行另一次重构，编写一个重置球的函数。这还需要对处理球的速度和位置变量的方式进行一些更改。代码列表\
  \ 10-17 显示了这些更改。\n\n```\n--snip--\nconst BALL_SIZE = 5;\n❶ let ballPosition;\n\n\
  let xSpeed;\nlet ySpeed;\n\nfunction initBall() {\n❷ ballPosition = {x: 20, y: 30};\n\
  \  xSpeed = 4;\n  ySpeed = 2;\n}\n\nconst PADDLE_WIDTH = 5;\n--snip--\n```\n\n代码列表\
  \ 10-17：initBall 函数\n\n\n\n\n在这里，我们将球状态变量（`ballPosition`、`xSpeed` 和 `ySpeed`）的`声明`与这些变量的`初始化`分离开来。例如，`ballPosition`\
  \ 在程序的顶层被声明 ❶，但在新的 `initBall` 函数 ❷（“initialize ball”的缩写）中进行初始化。`xSpeed` 和 `ySpeed`\
  \ 也是如此。这样做是为了让我们能够任何时候通过简单调用 `initBall` 将球重置为初始位置和速度，而不需要在整个程序中到处复制粘贴球状态变量的值。特别是，我们现在可以在程序开始时调用\
  \ `initBall` 来首次设置球，也可以在球撞击左墙或右墙时随时调用它，以将球重置为原始状态。\n\n注意，我们不能同时在 `initBall` 函数内部声明并初始化球状态变量——例如，在函数内部放置\
  \ `let ballPosition = {x: 20, y: 30};`——因为 `let` 关键字会在当前作用域中定义一个新变量，在这种情况下作用域就是\
  \ `initBall` 的函数体。因此，这些变量将仅在 `initBall` 内部可用。我们希望变量在整个程序中可用，所以我们在程序顶层（任何函数体之外）使用\
  \ `let` 声明它们。然而，由于我们需要多次初始化这些变量，因此我们在 `initBall` 函数中为它们赋值，该函数可以被重复调用。\n\n接下来，我们必须修改\
  \ `checkCollision` 函数中的碰撞检测代码，在撞击左墙或右墙时增加分数并重置球。Listing 10-18 展示了如何实现。\n\n```\n\
  --snip--\n  if (checkPaddleCollision(ball, rightPaddle)) {\n    // Right paddle\
  \ collision happened\n    let distanceFromTop = ball.top - rightPaddle.top;\n  \
  \  let distanceFromBottom = rightPaddle.bottom - ball.bottom;\n    adjustAngle(distanceFromTop,\
  \ distanceFromBottom);\n    xSpeed = -Math.abs(xSpeed);\n  }\n\n❶ if (ball.left\
  \ < 0) {\n    rightScore++;\n    initBall();\n  }\n❷ if (ball.right > width) {\n\
  \    leftScore++;\n    initBall();\n  }\n\n  if (ball.top < 0 || ball.bottom > height)\
  \ {\n    ySpeed = -ySpeed;\n  }\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 10-18: 在墙壁碰撞时得分</samp>\n\n之前，我们在一个 `if` 语句中检查左右墙壁的碰撞并让球反弹，但我们必须单独处理左墙和右墙，因为取决于撞击的是哪个墙，不同的玩家会得分。因此，我们将\
  \ `if` 语句拆分为两个。如果球撞击左墙 ❶，`rightScore` 增加，并通过调用我们新定义的 `initBall` 函数重置球。如果球撞击右墙 ❷，`leftScore`\
  \ 增加并重置球。与顶墙和底墙碰撞的逻辑保持不变。\n\n最后，由于我们把球状态变量的初始化移动到了 `initBall` 函数，我们需要在游戏循环开始之前调用该函数，以便首次设置球。滚动到\
  \ `script.js` 的底部，并按照 Listing 10-19 所示更新代码，在调用 `gameLoop` 之前添加对 `initBall` 的调用。\n\
  \n```\n--snip--\nfunction gameLoop() {\n  draw();\n  update();\n  checkCollision();\n\
  \n  // Call this function again after a timeout\n  setTimeout(gameLoop, 30);\n}\n\
  \ninitBall();\ngameLoop();\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 10-19: 首次调用 initBall</samp>\n\n现在当你刷新 `index.html` 时，你应该能看到当球撞击侧墙时分数增加，并且球在撞击侧墙后应该重置为原始速度和位置。当然，现在击败电脑非常容易，因为它还没有移动它的挡板！\n\
  \n### <samp class=\"SANS_Futura_Std_Bold_B_11\">电脑控制</samp>\n\n现在让我们给这个游戏增加一些挑战吧！我们希望电脑控制的对手移动左挡板并尝试击中球。实现这一点有多种方法，但在我们简单的方法中，我们将让计算机尝试匹配球当前的位置。电脑的逻辑将非常简单：\n\
  \n*   如果球的顶部在挡板顶部上方，则挡板向上移动。\n*   如果球的底部在挡板底部下方，则挡板向下移动。\n*   否则，什么都不做。\n\n通过这种方法，如果电脑可以以任何速度移动，那么它永远不会错过。由于这对我们人类来说将没好玩，我们将为电脑设置一个速度限制。Listing\
  \ 10-20 展示了如何实现。\n\n```\nlet canvas = document.querySelector(\"#canvas\");\nlet\
  \ ctx = canvas.getContext(\"2d\");\nlet width = canvas.width;\nlet height = canvas.height;\n\
  \nconst MAX_COMPUTER_SPEED = 2;\n\nconst BALL_SIZE = 5;\n--snip--\n```\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-20: 限制电脑速度</samp>\n\n我们将电脑的速度限制声明为一个常量\
  \ `MAX_COMPUTER_SPEED`。通过将其设置为 `2`，我们意味着电脑每帧不允许移动超过 2 个像素。接下来，我们将定义一个函数 `followBall`，应用一些基础的智能来移动电脑。新函数在\
  \ Listing 10-21 所示。将其添加到 `draw` 函数和 `update` 函数之间。\n\n```\n--snip--\nfunction followBall()\
  \ {\n❶ let ball = {\n    top: ballPosition.y,\n    bottom: ballPosition.y + BALL_SIZE\n\
  \  };\n❷ let leftPaddle = {\n    top: leftPaddleTop,\n    bottom: leftPaddleTop\
  \ + PADDLE_HEIGHT\n  };\n\n❸ if (ball.top < leftPaddle.top) {\n    leftPaddleTop\
  \ -= MAX_COMPUTER_SPEED;\n❹ } if (ball.bottom > leftPaddle.bottom) {\n    leftPaddleTop\
  \ += MAX_COMPUTER_SPEED;\n  }\n}\n\nfunction update() {\n  ballPosition.x += xSpeed;\n\
  \  ballPosition.y += ySpeed;\n❺ followBall();\n}\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-21: 电脑控制挡板</samp>\n\n在 `followBall`\
  \ 函数中，我们定义了代表球 ❶ 和左挡板 ❷ 的对象，它们都有 `top` 和 `bottom` 属性。然后我们用两个 `if` 语句实现移动逻辑。如果球的顶部在挡板顶部上方\
  \ ❸，我们从 `leftPaddleTop` 减去 `MAX_COMPUTER_SPEED` 来移动挡板向上。同样，如果球的底部在挡板底部下方 ❹，通过增加\
  \ `leftPaddleTop` 来移动挡板向下。\n\n我们在 `update` 函数中调用我们的新函数 ❺。这样，移动左挡板就成了每次游戏循环更新状态的一部分。\n\
  \n刷新页面并尝试给电脑得分！\n\n### <samp class=\"SANS_Futura_Std_Bold_B_11\">游戏结束</samp>\n\n\
  创建游戏的最后一步是让它可赢（或可输）。为了这一点，我们必须添加某种游戏结束条件，并在那里停止游戏循环。在这种情况下，一旦其中一个玩家达到 10 分，我们将停止游戏循环，然后显示文本“GAME\
  \ OVER.”\n\n首先，我们需要一个变量来跟踪游戏是否结束。我们将使用该变量来决定是否继续 `gameLoop` 函数。Listing 10-22 展示了需要做的修改。\n\
  \n```\n--snip--\nlet leftScore = 0;\nlet rightScore = 0;\n❶ let gameOver = false;\n\
  \ndocument.addEventListener(\"mousemove\", e => {\n--snip--\n\nfunction checkCollision()\
  \ {\n--snip--\n  if (ball.right > width) {\n    leftScore++;\n    initBall();\n\
  \  }\n❷ if (leftScore > 9 || rightScore > 9) {\n    gameOver = true;\n  }\n  if\
  \ (ball.top < 0 || ball.bottom > height) {\n    ySpeed = -ySpeed;\n  }\n}\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-22: 添加 gameOver\
  \ 变量</samp>\n\n\n\n\n在 `script.js` 的顶部，我们声明了一个名为 `gameOver` 的变量，用于记录游戏是否结束 ❶。我们将其初始化为\
  \ `false`，以便游戏在开始之前不会结束。然后，在 `checkCollision` 函数中，我们检查任意一个分数是否超过了 9 ❷。如果是，我们将 `gameOver`\
  \ 设置为 `true`。这个检查可以在任何地方发生，但我们将其放在 `checkCollision` 中，以便于将增加分数的逻辑与检查分数的逻辑保持在一起。\n\
  \n接下来，我们将添加一个用于写入“GAME OVER”文本的函数，并修改游戏循环，使其在 `gameOver` 为为 `true` 时结束。Listing 10-23\
  \ 显示了如何实现。\n\n```\n--snip--\n  if (ball.top < 0 || ball.bottom > height) {\n   \
  \ ySpeed = -ySpeed;\n  }\n}\n\n❶ function drawGameOver() {\n  ctx.fillStyle = \"\
  white\";\n  ctx.font = \"30px monospace\";\n  ctx.textAlign = \"center\";\n  ctx.fillText(\"\
  GAME OVER\", width / 2, height / 2);\n}\n\nfunction gameLoop() {\n  draw();\n  update();\n\
  \  checkCollision();\n❷ if (gameOver) {\n    draw();\n    drawGameOver();\n❸ else\
  \ {\n    // Call this function again after a timeout\n    setTimeout(gameLoop, 30);\n\
  \  }\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-23:\
  \ 结束游戏</samp>\n\n我们在 `checkCollision` 函数之后定义了 `drawGameOver` 函数 ❶。它在画布的中间绘制大号的白色的“GAME\
  \ OVER”文本。为了将文本置于画布中间，我们将文本对齐方式设置为“center”，并使用画布宽度和高度的一半作为文本的 x 和 y 坐标。（使用居中对齐时，x\
  \ 坐标指的是文本的水平中点。）\n\n在 `gameLoop` 函数中，我们将对 `setTimeout` 的调用封装在一个条件语句中，该语句检查 `gameOver`\
  \ 变量的值。如果它为 `true` ❷，游戏结束了，因此我们调用了 `draw` 和 `drawGameOver` 函数。（`draw` 函数用于显示最终分数；否则，获胜者将停留在九分。）如果\
  \ `gameOver` 为 `false` ❸，游戏可以继续：我们像以前一样继续循环，通过 `setTimeout` 在 30 毫秒后再次调用 `gameLoop`。\n\
  \n一旦 `gameOver` 变为 `true` 游戏循环结束，游戏就会停止。在“GAME OVER”文本之后，屏幕上将不再有其他内容绘制——至少在页面刷新且程序从头重新运行之前是这样。现在去尝试吧：刷新\
  \ `index.html` 看看能否败电脑！一旦你们中某人的分数超过 9 分，你就会看到“GAME OVER”文本，如图 10-7 所示。\n\n![](img/Figure_10-7.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 10-7: 游戏结束</samp>\n\n我希望你赢了电脑，但如果你没赢也不用担心——游戏相当难。这里是一些你可以做的事情，可以降低难度：\n\
  \n*   增加 `gameLoop` 中帧与帧之间的时间。\n*   让球板变得更高。\n*   降低电脑的最大速度。\n*   让更容易击中球板边缘。\n\
  *   增加击中球板边缘对 `ySpeed` 的影响。\n\n现在你已经有一个可以运行的游戏了，你可以进行任何想要的更改。如果你已经是一个*乒乓球*高手，你可能想让它变得更难；以下练习提供了一些建议。你也可以尝试自定义外观，或更改画布的大小——现在是你的游戏了。\n\
  \n### 完整代码\n\n为了方便起见，Listing 10-24 显示了整个 `script.js` 文件。\n\n```\nlet canvas = document.querySelector(\"\
  #canvas\");\nlet ctx = canvas.getContext(\"2d\");\nlet width = canvas.width;\nlet\
  \ height = canvas.height;\n\nconst MAX_COMPUTER_SPEED = 2;\n\nconst BALL_SIZE =\
  \ 5;\nlet ballPosition;\n\nlet xSpeed;\nlet ySpeed;\n\nfunction initBall() {\n \
  \ ballPosition = {x: 20, y: 30};\n  xSpeed = 4;\n  ySpeed = 2;\n}\n\nconst PADDLE_WIDTH\
  \ = 5;\nconst PADDLE_HEIGHT = 20;\nconst PADDLE_OFFSET = 10;\n\nlet leftPaddleTop\
  \ = 10;\nlet rightPaddleTop = 30;\n\nlet leftScore = 0;\nlet rightScore = 0;\nlet\
  \ gameOver = false;\n\ndocument.addEventListener(\"mousemove\", e => {\n  rightPaddleTop\
  \ = e.y - canvas.offsetTop;\n});\n\nfunction draw() {\n  // 用黑色填充画布\n  ctx.fillStyle\
  \ = \"black\";\n  ctx.fillRect(0, 0, width, height);\n\n  // 其他所有都是白色的\n  ctx.fillStyle\
  \ = \"white\";\n\n  // 绘制球\n  ctx.fillRect(ballPosition.x, ballPosition.y, BALL_SIZE,\
  \ BALL_SIZE);\n\n  // 绘制球板\n  ctx.fillRect(\n    PADDLE_OFFSET,\n    leftPaddleTop,\n\
  \    PADDLE_WIDTH,\n    PADDLE_HEIGHT\n  );\n  ctx.fillRect(\n    width - PADDLE_WIDTH\
  \ - PADDLE_OFFSET,\n    rightPaddleTop,\n    PADDLE_WIDTH,\n    PADDLE_HEIGHT\n\
  \  );\n\n  // 绘制分数\n  ctx.font = \"30px monospace\";\n  ctx.textAlign = \"left\"\
  ;\n  ctx.fillText(leftScore.toString(), 50, 50);\n  ctx.textAlign = \"right\";\n\
  \  ctx.fillText(rightScore.toString(), width - 50, 50);\n}\n\nfunction followBall()\
  \ {\n  let ball = {\n    top: ballPosition.y,\n    bottom: ballPosition.y + BALL_SIZE\n\
  \  };\n  let leftPaddle = {\n    top: leftPaddleTop,\n    bottom: leftPaddleTop\
  \ + PADDLE_HEIGHT\n  };\n\n  if (ball.top < leftPaddle.top) {\n    leftPaddleTop\
  \ -= MAX_COMPUTER_SPEED;\n  } else if (ball.bottom > leftPaddle.bottom) {\n    leftPaddleTop\
  \ += MAX_COMPUTER_SPEED;\n  }\n}\n\nfunction update() {\n  ballPosition.x += xSpeed;\n\
  \  ballPosition.y += ySpeed;\n  followBall();\n}\n\nfunction checkPaddleCollision(ball,\
  \ paddle) {\n  // 检查球板和球在垂直和水平方向上是否重叠\n  return (\n    ball.left   < paddle.right\
  \ &&\n    ball.right  > paddle.left &&\n    ball.top    < paddle.bottom &&\n   \
  \ ball.bottom > paddle.top\n  );\n}\n\nfunction adjustAngle(distanceFromTop, distanceFromBottom)\
  \ {\n  if (distanceFromTop < 0) {\n    // 如果球击中球板顶部，减少 ySpeed\n    ySpeed -= 0.5;\n\
  \  } else if (distanceFromBottom < 0) {\n    // 如果球击中球板底部，增加 ySpeed\n    ySpeed\
  \ += 0.5;\n  }\n}\n\nfunction checkCollision() {\n  let ball = {\n    left: ballPosition.x,\n\
  \    right: ballPosition.x + BALL_SIZE,\n    top: ballPosition.y,\n    bottom: ballPosition.y\
  \ + BALL_SIZE\n  };\n  let leftPaddle = {\n    left: PADDLE_OFFSET,\n    right:\
  \ PADDLE_OFFSET + PADDLE_WIDTH,\n    top: leftPaddleTop,\n    bottom: leftPaddleTop\
  \ + PADDLE_HEIGHT\n  };\n  let rightPaddle = {\n    left: width - PADDLE_WIDTH -\
  \ PADDLE_OFFSET,\n    right: width - PADDLE_OFFSET,\n    top: rightPaddleTop,\n\
  \    bottom: rightPaddleTop + PADDLE_HEIGHT\n  };\n  // (此处逻辑应根据上下文实现，保持代码结构一致)\n\
  }\n```\n*(注：由于原文中 `checkCollision` 内部逻辑在示例中未完全列出，翻译时保持了代码块的完整性。)*\n\n\n\n\n在本章中，你从零创建了一个完整的游戏。游戏循环、碰撞检测和渲染的基础知识具有广泛的适用性，因此凭借你在这里学到的知识，你可以开始创建各种\
  \ 2D 游戏。例如，你可能会尝试实现你自己的版本的 `Breakout`（纸块）或 `Snake`（贪蛇）。如果你在逻辑方面需要帮助，网上有很多教程可以遵循。祝你玩得开心！\n\
  \n# 11 面对象的乒乓球\n\n![](img/opener.png)\n\n在上一章中，我们构建了自己版本的 `Pong` 游戏。早些时候在第 6 章中，你学习了\
  \ `JavaScript` 中的类和面向对象编程。你可能想知道为什么我们在实现 `Pong` 时没有使用任何类。主要原因是我想让游戏代码尽可能简单，不包含任何不必要的概念，以便更容易看到游戏实际在做什么。然而，随着程序变得越来越庞复杂，为它们提供更多的结构是有帮助的，而实现这一点的常用方法就是使用面向对象编程。\n\
  \n为了帮助你更好地理解如何以面向对象的风格设计软件，在本章中，我们将介绍一个面向对象的版本的 `Pong`。游戏的逻辑不会发生任何变化，但代码的结构和组织方式将不同。例如，处理球的代码将存在一个名为\
  \ `Ball` 的类中。我们将使用这个类来跟踪球的位置，并确定球在撞击墙或拍板时应该如何反弹。同样，所有处理拍板的代码将存在一个名为 `Paddle` 的类中。通过让\
  \ `Ball` 和 `Paddle` 类继承自共享的父类，我们可以轻松地共享适用于球和拍板的公共代码。\n\n本章将探索面向对象的 `Pong` 程序的通用结构，但我们不会深入代码的每一个细节；从上一章开始，你应该对它的工作原理有了很好的了解。考虑到这一点，在本章中，我们不会增量构建游戏，而是将按顺序逐节遍历整个代码。因此，在你输入所有代码之前，代码将无法正确运行或实际执行任何操作。但在进入代码本身之前，让我们先更广泛地看看如何设计一个面向对象的计算机程序。\n\
  \n## 面向对象设计\n\n以面向对象编写代码通过将代码组织成代表程序各个方面的类，为计算机程序增加了结构。这种结构使得其他程序员（甚至是你以后的版本）更容易理解你的代码是如何工作的。对面向对象设计技术的全面处理将超出本书的范围，但在本节中，我们将介绍面向对象编程核心的几个关键原则。\n\
  \n面向对象设计中重要的第一步是对你的领域（或你的程序世界）进行建模。程序中有哪些不同的元素？它们需要做什么？它们之间是如何相互关联和相互作用的？在这种情况下，领域是游戏\
  \ `Pong`，游戏中有几个可见的元素：球、拍板和比分。虽然有两个拍板，但它们的行为大部分相同，因此我们可以创建一个带有两个自定义实例的单个 `Paddle`\
  \ 类。同时，球的独特性足以让它拥有自己的类。我们还必须建模这些元素是如何相互作用的。例如，我们如何建模球与拍板的碰撞？这段代码必须存在某个地方。正如你所看到的，在我的设计中，我决定代码应该存在于\
  \ `Ball` 类中。换句话说，球应该“知道”在与拍板和墙碰撞时如何从它们反弹。\n\n面向对象编程的另一个重要方面是`封装`。这意味着将类的内部细节从程序的其他部分隐藏起来，并提供一个简单的接口供其用于与类进行交互。封装这些细节使得以后更改它们时不会影响程序的其他部分。例如，`Ball`\
  \ 类不需要向程序的其他部分暴露其速度或位置。如果我们决定更改速度表示方式（例如，使用角度和速度代替 `xSpeed` 和 `ySpeed`），我们就不需要更改程序其他部分的运行方式。\n\
  \n> **注意**\n\n> 从技术上说，`xSpeed` 和 `ySpeed` 在 `Ball` 类之外是可以访问，但我们不会访问它们，因此可以将它们视为封装细节。`JavaScript`\
  \ 确实有一种方法将属性声明为 `private`，这意味着它们不能在类之外访问，但在写作期间这是一个新功能，在所有浏览器中可用。\n\n面向对象编程的最后一个关键方面是`多态`，如果一个方法期望接收某个类的对象，那么它也可以接收该类的子类实例的实例。例如，在本章中，你会看到一个\
  \ `Entity` 类，它有一个 `draw` 方法和两个子类：`Paddle` 和 `Ball`。遵循多态性，任何使用 `draw` 方法的代码都应该接收任何类型的\
  \ `Entity` 作为参数，而无需关心我们传递的是 `Ball` 还是 `Paddle`。\n\n归结底，面向对象设计更多地是一门艺术而非科学，有许多不同的方法来实现。你应该将本章中的设计视为解决问题的一种可能方法，而不是处理事情的“正确方法”。考虑到这一点，让我们进入面向对象的\
  \ `Pong` 代码。\n\n## 文件结构\n\n面向对象版本 `Pong` 的 HTML 与上一章完全相同，但 JavaScript 完全完全不同。如果你愿意，可以为\
  \ `tennjs` 目录制作一个副本，删除 `script.js` 文件，并创建一个包含后续章节所示代码的新 `script.js` 文件。或者，你只需删除现有\
  \ `tennjs` 目录中 `script.js` 文件中的所有代码，并将其替换为新的面向对象代码。无论哪种方式，更新后的 `script.js` 文件将由一系列类声明组成，随后是一些让游戏运行的额外代码。我们将顺序查看代码的每个部分。\n\
  \n## GameView 类\n\n我们将声明的第一个类叫做 `GameView`。该类负责玩家的游戏视图，或者说游戏如何显示。由于游戏使用 `canvas`\
  \ 进行渲染，`GameView` 类负责 `canvas` 和绘图上下文环境。该类还负责在 `canvas` 上绘制内容（例如球和拍板），并显示“GAME OVER”文本。代码请参阅\
  \ Listing 11-1。\n\n\n\n\n```javascript\nclass GameView {\n❶ constructor() {\n  \
  \  let canvas = document.querySelector(\"#canvas\");\n    this.ctx = canvas.getContext(\"\
  2d\");\n    this.width = canvas.width;\n    this.height = canvas.height;\n    this.offsetTop\
  \ = canvas.offsetTop;\n  }\n\n  ❷ draw(…entities) {\n    // Fill the canvas with\
  \ black\n    this.ctx.fillStyle = \"black\";\n    this.ctx.fillRect(0, 0, this.width,\
  \ this.height);\n\n  ❸ entities.forEach(entity => entity.draw(this.ctx));\n    }\n\
  \n  ❹ drawScores(scores) {\n    this.ctx.fillStyle = \"white\";\n    this.ctx.font\
  \ = \"30px monospace\";\n    this.ctx.textAlign = \"left\";\n    this.ctx.fillText(scores.leftScore.toString(),\
  \ 50, 50);\n    this.ctx.textAlign = \"right\";\n    this.ctx.fillText(scores.rightScore.toString(),\
  \ this.width - 50, 50);\n  }\n\n  ❺ drawGameOver() {\n    this.ctx.fillStyle = \"\
  white\";\n    this.ctx.font = \"30px monospace\";\n    this.ctx.textAlign = \"center\"\
  ;\n    this.ctx.fillText(\"GAME OVER\", this.width / 2, this.height / 2);\n  }\n\
  }\n```\n列表 11-1: GameView 类\n\n`GameView` 构造函数 ❶ 获取 `canvas` 及其绘图上下文的引用，并将它们分别保存为名为\
  \ `canvas` 和 `ctx` 的属性。它还存储了一些用于绘图的值：`canvas` 的 `width` 和高度 `height`，以及 `canvas`\
  \ 距离浏览器视口顶部的偏移量。\n\n`draw` 方法 ❷ 使用了第 5 章中引入的剩余参数（rest parameters）。通过这种方式，你可以向 `draw`\
  \ 传递多个参数，所有参数将被收集到一个名为 `entities` 的单一数组中。每个参数都是代表游戏中某一个元素的对象：球和两个挡板。该方法首先绘制一个黑色矩形以清除画布，然后遍历元素数组，依次调用每个元素自身的\
  \ `draw` 方法 ❸并将绘图上下文作为参数传递。只有当传递给 `GameView.draw` 的每个对象都有自己的 `draw` 方法时，这种方法才能生效；我们将在下一节看到它是如何实现的。`GameView`\
  \ 上的 `draw` 方法承担每次游戏循环中在画布上绘制内容的最终责任，但它将实际绘制游戏元素的责任委托给了代表这些元素的对象。实际上，游戏中的每个元素都“知道”如何绘制自己，而\
  \ `GameView.draw` 只负责协调这些调用。\n\n`drawScores` 方法 ❹ 接收包含两个分数的对象并将其绘制到画布上。这与上一章中的分数代码非常相似。主要区别在于，它不再依赖全局变量\
  \ `canvas` 的 `width`，而是通过引用 `this.width` 使用 `GameView` 类中的 `width` 属性。\n\n`drawGameOver`\
  \ 方法 ❺ 与上一章中的对应函数大部分相同，但它也是从 `GameView` 获取 `width` 和 `height`，而不是从全局变量。\n\n### 游戏元素\n\
  \n接下来我们将实现代表三个主要游戏元素的类：两个挡板和一个球。我们将从一个名为 `Entity` 的超类开始，它将成为子类 `Paddle` 和 `Ball`\
  \ 的父类。`Entity` 类的存在是为了共享挡板和球通用的通用代码。这包括跟踪元素尺寸和位置的代码、计算用于碰撞检测的元素边界的代码以及绘制元素的代码。由于所有游戏元素都是矩形，无论我们处理的是挡板还是球，这些代码都是相同的。这展示了面向对象编程的优：我们可以在超类中写一次所有通用代码，并让子类继承它。\n\
  \n列表 11-2 包含了 `Entity` 类的代码。\n\n```javascript\nclass Entity {\n❶ constructor(x,\
  \ y, width, height) {\n    this.x = x;\n    this.y = y;\n    this.width = width;\n\
  \    this.height = height;\n    }\n\n  ❷ boundingBox() {\n    return {\n      left:\
  \ this.x,\n      right: this.x + this.width,\n      top: this.y,\n      bottom:\
  \ this.y + this.height\n    };\n  }\n\n  ❸ draw(ctx) {\n    ctx.fillStyle = \"white\"\
  ;\n    ctx.fillRect(this.x, this.y, this.width, this.height);\n  }\n}\n```\n列表 11-2:\
  \ Entity 类\n\n`Entity` 构造函数 ❶ 接收 `entity` 左上角的 `x` 和 `y` 坐标，以及代表其尺寸的 `width` 和 `height`。这些值被保存为属性。\n\
  \n`boundingBox` 方法 ❷ 返回一个包含 `entity` 的 `left`、`right`、`top` 和 `bottom` 边界的对象。在上一章中，我们在\
  \ `checkCollision` 函数中为为每个元素手动创建了这些对象。`Entity` 超类为我们提供了一种方便的方法，将球和挡板的这种通用计算进行了泛化。\n\
  \n`draw` 方法 ❸ 接收一个绘图上下文并使用构造函数中定义的属性绘制一个白色矩形。传递到 `GameView.draw` 方法的对象都将是 `Entity`\
  \ 的子类，而每个项目调用的将是 `Entity` 上的 `draw` 方法。\n\n### 挡板\n\n`Paddle` 类扩展了 `Entity` 类。它在列表\
  \ 11-3 中定义。\n\n```javascript\nclass Paddle extends Entity {\n❶ static WIDTH = 5;\n\
  \  static HEIGHT = 20\n  static OFFSET = 10;\n\n  ❷ constructor(x, y) {\n    super(x,\
  \ y, Paddle.WIDTH, Paddle.HEIGHT);\n  }\n}\n```\n列表 11-3: Paddle 类\n\n该类包含了三个静态属性，这些属性是赋值给类本身而不是类的单个实例的。静态属性的值将在类的所有实例之间共享。在这种情况下，虽然每个\
  \ `Paddle` 实例都需要它自己的 `x` 和 `y` 坐标，但每个 `Paddle` 对象应该具有相同的 `width` 和 `height`，以及距离画布左边缘或右边缘的相同偏移。因此，我们将这些值定义为静态属性\
  \ `WIDTH`、`HEIGHT` 和 `OFFSET`，它们对应于上一章中的 `PADDLE_WIDTH`、`PADDLE_HEIGHT` 和 `PADDLE_OFFSET`常量。\n\
  \n> 注意：类中没有直接的方法来定义静态常量，这就是为什么上一章的常量现在变成了变量。它们的名称全大写是为了表示它们应该被视为常量。\n\n你使用 `static`\
  \ 关键字来声明静态属性。例如，我们使用 `static WIDTH = 5` ❶ 声明了 `WIDTH` 静态属性。静态属性的访问方式与实例属性相同，不同在于你在点左侧使用类名，而不是\
  \ `this` 或实例名。例如，`Paddle.WIDTH` 访问的就是静态属性 `WIDTH`。\n\n`Paddle` 构造函数 ❷ 只有两个参数：`x`\
  \ 和 `y`。它使用 `super` 调用其超类（`Entity`）的构造函数，传递 `x` 和 `y` 参数，以及将 `Paddle.WIDTH` 作为 `width`\
  \ 参数，将 `Paddle.HEIGHT` 作为 `height` 参数。\n\n### 球\n\n接下来是 `Ball` 类。它与 `Paddle` 类类似，都扩展了\
  \ `Entity`，但 `Ball` 有自己的根据速度更新位置的逻辑以及碰撞检测的逻辑。列表 11-4 显示了该类的部分代码。\n\n\n\n\n```javascript\n\
  class Ball extends Entity {\n❶ static SIZE = 5;\n\n❷ constructor() {\n    super(0,\
  \ 0, Ball.SIZE, Ball.SIZE);\n  ❸ this.init();\n  }\n\n❹ init() {\n    this.x = 20;\n\
  \    this.y = 30;\n    this.xSpeed = 4;\n    this.ySpeed = 2;\n  }\n\n❺ update()\
  \ {\n    this.x += this.xSpeed;\n    this.y += this.ySpeed;\n    }\n\n❻ adjustAngle(distanceFromTop,\
  \ distanceFromBottom) {\n    if (distanceFromTop < 0) {\n      // If ball hit near\
  \ top of paddle, reduce ySpeed\n      this.ySpeed -= 0.5;\n    } else if (distanceFromBottom\
  \ < 0) {\n      // If ball hit near bottom of paddle, increase ySpeed\n      this.ySpeed\
  \ += 0.5;\n    }\n  }\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 11-4: Ball 类的开头</samp>\n\n该类有一个名为 `SIZE` 的静态属性，定义了球的宽度和高度 ❶。接下来是它的构造方法\
  \ ❷。与 `Paddle` 构造方法一样，`Ball` 构造方法的第一件事是调用其父类 `Entity` 的构造方法，这次向 `x` 和 `y` 参数传递 `0`，向宽度和高度参数传递\
  \ `Ball.SIZE`。这些 `0` 只是占位符；事实上，球在每个回合的开始时都处于相同的位置 (20, 30)。这种定位由 `Ball` 类的 `init`\
  \ 方法处理，该方法在构造方法中被首次调用 ❸。`init` 方法本身被定义为设置球的初始位置和速度 ❹，这就像上一章中的 `initBall` 函数一样。每当球需要重置为初始位置时（得分后），就会调用此方法。\n\
  \n下一个方法 `update` 使用球的当前速度来更新其 `x` 轴和 `y` 位置 ❺。紧随其后的是 `adjustAngle` 方法 ❻，它等同于上一章描述的\
  \ `adjustAngle` 函数。它根据球击中球板的位置来改变球的垂直速度（反弹角度）。\n\n`Ball` 类的定义继续在 Listing 11-5 中，包含了碰撞检测的方法。\n\
  \n```javascript\nclass Ball extends Entity {\n--snip--\n  checkPaddleCollision(paddle,\
  \ xSpeedAfterBounce) {\n  ❶ let ballBox = this.boundingBox();\n    let paddleBox\
  \ = paddle.boundingBox();\n\n    // 检查球和球板在垂直和水平方向上重叠\n  ❷ let collisionOccurred\
  \ = (\n      ballBox.left   < paddleBox.right &&\n      ballBox.right  > paddleBox.left\
  \ &&\n      ballBox.top    < paddleBox.bottom &&\n      ballBox.bottom > paddleBox.top\n\
  \    );\n\n    if (collisionOccurred) {\n      let distanceFromTop = ballBox.top\
  \ - paddleBox.top;\n      let distanceFromBottom = ballBox.bottom - paddleBox.bottom;\n\
  \    ❸ this.adjustAngle(distanceFromTop, distanceFromBottom);\n    ❹ this.xSpeed\
  \ = xSpeedAfterBounce;\n    }\n  }\n\n  checkWallCollision(width, height, scores)\
  \ {\n    let ballBox = this.boundingBox();\n\n    // 击左墙\n  ❺ if (ballBox.left <\
  \ 0) {\n      scores.rightScore++;\n      this.init();\n    }\n    // 击右墙\n  ❻ if\
  \ (ballBox.right > width) {\n      scores.leftScore++;\n      this.init();\n   \
  \ }\n    // 击上墙或下墙\n    if (ballBox.top < 0 || ballBox.bottom > height) {\n    ❼\
  \ this.ySpeed = -this.ySpeed;\n    }\n  }\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 11-5: Ball 类的其余部分</samp>\n\n`checkPaddleCollision` 方法与上一章中的 `check Collision`\
  \ 和 `checkPaddleCollision` 函数有一些重叠。该方法接受两个参数：一个代表其中一个球板的对象以及 `xSpeedAfterBounce`。后者代表如果从其中一个球板发生反弹，我们应该为\
  \ `xSpeed` 设置的新值，它允许我们配置球是预期总是向右反弹（从左球板）还是向左反弹（从右球板）。与上一章一样，我们强制要求与左球板碰撞时球向右反弹，反之亦然，以避免球在球板“内部”反弹的异常情况。\n\
  \n我们使用父类 `Entity` 的 `boundingBox` 方法来获取球和球板的边界框 ❶，并将它们存储为 `ballBox` 和 `paddleBox`。接下来，我们比较各种边界框边缘以判断球和球板之间是否发生了碰撞，并将结果保存在布尔变量\
  \ `collisionOccurred` ❷ 中。如果 `collisionOccurred` 为真，我们根据根据边界框确定的相应距离调用 `adjustAngle`\
  \ 方法 ❸，然后将球的 `xSpeed` 设置为 `xSpeedAfterBounce` ❹。\n\n最后，`checkWallCollision` 方法检查球与墙之间是否发生了碰撞。它接受游戏区域的\
  \ `width` 和 `height` 以及一个代表 `scores`的对象作为参数。如果球击中左墙 ❺ 或右墙 ❻，则增加相应的分数，并通过调用 `init`\
  \ 重置球。\n\n### 分数与计算机\n\n`Scores` 类是一个用于跟踪分数的简单容器。`Scores` 构造方法 ❶ 将左和右的分数设置为 0。我们本可以使用普通对象来处理分数，但使用类可以保持结构更清晰。\n\
  \n```javascript\nclass Scores {\n  constructor() {\n    this.leftScore = 0;\n  \
  \  this.rightScore = 0;\n  }\n}\n\nclass Computer {\n  static followBall(paddle,\
  \ ball) {\n    const MAX_SPEED = 2;\n    let ballBox = ball.boundingBox();\n   \
  \ let paddleBox = paddle.boundingBox();\n\n    if (ballBox.top < paddleBox.top)\
  \ {\n      paddle.y -= MAX_SPEED;\n    } else if (ballBox.bottom > paddleBox.bottom)\
  \ {\n      paddle.y += MAX_SPEED;\n    }\n  }\n}\n```\n\n`Computer` 类有一个方法 `followBall`，根据球的位置更新左球板的位置。它是一个\
  \ `静态方法`，意味着不需要类的实例即可调用。我们使用 `static` 关键字将其声明 ❷，类似于声明静态属性。静态方法使用类名而不是实例名来调用，例如：`Computer.followBall(leftPaddle,\
  \ ball)`。\n\n> **注意**\n> *当类需要特定的实例属性时，我们会创建类的实例。Computer 类没有任何属性，因此我们不需要创建它的实例。由于\
  \ Computer 类从未被实例化，它也不需要构造方法。*\n\n我们完全可以创建一个独立函数来移动左球板，但与 `Scores` 类一样，将代码作为 `Computer`\
  \ 类的一部分有助于维护。\n\n### Game 类\n\n最后我们来到 `Game` 类，这是所有其他类实例化（如适用）并缝合编排的地方。代码的第一部分参见\
  \ Listing 11-7。\n\n```javascript\nclass Game {\n  constructor() {\n    this.gameView\
  \ = new GameView();\n    this.ball = new Ball();\n  ❶ this.leftPaddle = new Paddle(Paddle.OFFSET,\
  \ 10);\n  ❷ this.rightPaddle = new Paddle(\n      this.gameView.width - Paddle.OFFSET\
  \ - Paddle.WIDTH,\n      30\n    );\n\n  ❸ this.scores = new Scores();\n    this.gameOver\
  \ = false;\n\n  ❹ document.addEventListener(\"mousemove\", e => {\n    this.rightPaddle.y\
  \ = e.y - this.gameView.offsetTop;\n    });\n  }\n\n  draw() {\n  ❺ this.gameView.draw(\n\
  \      this.ball,\n      this.leftPaddle,\n      this.rightPaddle\n    );\n\n  ❻\
  \ this.gameView.drawScores(this.scores);\n  }\n}\n```\n\n\n\n`Game` 构造函数首先实例化 `GameView`、`Ball`\
  \ 和 `Paddle` 类。`leftPaddle`get 使用 `Paddle.OFFSET` 设置其 x 坐标 ❶。右侧实例使用 `Paddle.OFFSET`、`Paddle.WIDTH`\
  \ 和 `this.gameView.width` 来确定其 x 坐标 ❷，这与我们在上一章中计算右挡板的位置类似。\n\n在类内部实例化其他类是面向对象代码的常见特性。这种技术被称为\
  \ `composition`（组合），因为我们正在其他实例内部组合了其他实例。\n\n接下来，`Game` 构造函数实例化了 `Scores` ❸ 并将 `gameOver`\
  \ 布尔值设置为 `false`。最后，它设置了一个 `mousemove` 事件监听器 ❹，当用户移动鼠标时更新右挡板的位置。在类构造函数中设置的事件监听器与我们在书中看到的其他事件监听器一样工作：只要应用程序运行，它就会有效，并且每当检测到事件时触发其处理函数。\n\
  \n构造函数之后是 `Game` 类的 `draw` 方法，它负责绘制游戏所有视觉方面的高级职责。首先，该方法调用 `this.gameView.draw` ❺，传入三个主要的游戏元素：`this.ball`、`this.leftPaddle`\
  \ 和 `this.rightPaddle`。这是对我们在 Listing 11-1 中看到的 `GameView` 类 `draw` 方法的调用，它接受数量数量的对象作为参数并调用每个对象的\
  \ `draw` 方法。最终结果是 `game.draw` 调用 `gameView.draw`，后者调用 `ball.draw`、`leftPaddle.draw`\
  \ 和 `rightPaddle.draw`。这看起来可能有点迂回，但你经常会在面向对象代码中遇到这种情况，即为了让代码保持在逻辑位置，需要经过一些步骤。在这种情况下，`game.draw`\
  \ 负责知道*哪些*对象被绘制（因为 `Game` 类跟踪了所有的游戏元素）；`gameView.draw` 负责绘制上下文、清除画布并调用元素的 `draw`\
  \ 方法；而每个游戏元素的 `draw` 方法则负责知道如何绘制自己。\n\n在绘制完所有实体后，`draw` 方法调用 `this.gameView.drawScores`，传入\
  \ `this.scores` 对象 ❻。\n\n`Game` 类在 Listing 11-8 中继续剩余的方法。\n\n```javascript\nclass\
  \ Game {\n--snip--\n  checkCollision() {\n    this.ball.checkPaddleCollision(this.leftPaddle,\n\
  \                                 ❶ Math.abs(this.ball.xSpeed));\n    this.ball.checkPaddleCollision(this.rightPaddle,\n\
  \                                 ❷ -Math.abs(this.ball.xSpeed));\n\n  ❸ this.ball.checkWallCollision(\n\
  \      this.gameView.width,\n      this.gameView.height,\n      this.scores\n  \
  \  );\n\n  ❹ if (this.scores.leftScore > 9 || this.scores.rightScore > 9) {\n  \
  \    this.gameOver = true;\n    }\n  }\n\n❺ update() {\n    this.ball.update();\n\
  \    Computer.followBall(this.leftPaddle, this.ball);\n  }\n\n❻ loop() {\n    this.draw();\n\
  \    this.update();\n    this.checkCollision();\n\n  ❼ if (this.gameOver) {\n  \
  \    this.draw();\n      this.gameView.drawGameOver();\n    } else {\n      // Call\
  \ this method again after a timeout\n    ❽ setTimeout(() => this.loop(), 30);\n\
  \    }\n  }\n}\n```\n\nListing 11-8: Game 类的其余部分\n\n`Game` 类的 `checkCollision` 方法协调所有的碰撞检测逻辑。首先，它调用两次球的\
  \ `checkPaddleCollision` 方法，以检查球与每个挡板之间的碰撞。回想 Listing 11-5 所示，该方法接受两个参数：一个 `Paddle`\
  \ 对象和一个新的、反弹后的 `xSpeed` 值。对于左挡板，我们知道想让球向右反弹，因此通过对当前 `xSpeed` 取绝对值 `Math.abs` 使新的\
  \ `xSpeed` 为正数 ❶。对于右挡板，我们想要球向左反弹，因此我们通过取反 `Math.abs(xSpeed)` 的结果使新的 `xSpeed` 为负数\
  \ ❷。\n\n接下来，`checkCollision` 方法调用 `ball.checkWallCollision` 来处理墙碰撞 ❸。该方法接收宽度和高度（因为\
  \ `Ball` 对象不知道游戏区域有多大）以及分数（这样如果撞到侧墙，就可以增加分数）。最后，该方法检查任一个分数是否超过了阈值 ❹，如果是，则将 `this.gameOver`\
  \ 设置为 `true`。\n\n`Game` 对象的 `update` 方法 ❺ 控制游戏循环每次重复之间的状态变化。它调用球的 `update` 方法来移动球，然后使用\
  \ `Computer.followBall` 静态方法根据球的新位置告诉电脑移动左挡板。\n\n`Game` 类的最后一个方法 `loop` 定义了游戏循环\
  \ ❻。我们按顺序调用 `this.draw`、`this.update` 和 `this.checkCollision`。然后我们检查 `this.gameOver`\
  \ 是否为 `true`。如果是 ❼，我们再次调用 `draw` 来渲染最终分数，并调用 `gameView.drawGameOver` 来渲染“GAME OVER”（游戏结束）文本。否则，我们使用\
  \ `setTimeout` 在 30 毫秒后 ❽ 再次调用 `loop` 方法，继续游戏。\n\n### 启动游戏\n\n我们要做的最后一件事是通过实例化 `Game`\
  \ 类并启动循环来开始游戏，如 Listing 11-9 所示。\n\n```javascript\nlet game = new Game();\ngame.loop();\n\
  ```\n\nListing 11-9: 启动游戏\n\n我们必须在程序的顶层（任何类定义之外）创建 `Game` 实例。所有其他对象都由 `Game` 类实例化，因此创建\
  \ `Game` 对象会自动创建其他对象。我们本可以由 `Game` 构造函数调用 `loop` 方法作为 `Game` 类的一部分来让游戏运行起来。然而，将\
  \ `game.loop` 的首次调用放在程序的顶层可以更容易看出游戏的流向。\n\n### 总结\n\n在这一章中，你创建了你的 *Pong* 程序的面向对象版本，并在过程中学习了一些面向对象的设计策略。上一章中的游戏逻辑没有发生任何变化；只是代码的组织方式有所不同。\n\
  \n面向对象设计是一个复杂的领域，需要大量的练习才能将程序分解为独立且有意义的对象。即使在这个简单的游戏中，你也有许多方法可以将游戏组件拆分为对象和方法。例如，你可能会认为\
  \ `GameView` 类是没有必要的，`Game` 可以跟踪画布，从而避免复杂的“绘制调用、绘制调用、绘制调用”循环。重要的是以一种符合逻辑且易于你和其他程序员理解和修改的方式来安排你的代码。\n\
  \n# 项目 2 制作音乐\n\n## 12 生成声音\n\n现在是时候尝试一些完全不同的东西了！在下一个项目中，你将使用 JavaScript 和 Web Audio\
  \ API 创作一歌曲。你还将学习一些关于声音合成以及电子音乐制作的通用技巧。\n\n\n\n\n本章将介绍 Web Audio API 以及构建在其之上的 JavaScript\
  \ 库 Tone.js。这将是你初次接触广大的第三方 JavaScript 库世界，这些库是预写代码的集合，你可以利用它们来简化复杂的任务。与 Web Audio\
  \ API 相比，Tone.js 提高了抽象层级，允许你以更自然的方式思考并实现音乐概念。一旦你熟悉了它的工作原理，在第 13 章中，你将运用所学到的所有知识制作出一首你可以自定义甚至重写的歌曲。\n\
  \n## Web Audio API\n\n本节介绍了 Web Audio API 的基础知识，它提供了一种使用 JavaScript 在浏览器中创建和处理声音的方法。Google\
  \ Chrome 在 2011 年推出了 Web Audio API，不久后它被作为 W3C 标准发布（W3C，即世界维网联盟，是一个为 Web 开发标准的组织）。要使用它，你只需要创建节点并将它们连接在一起。每个\
  \ `node` 代表声音的某个方面——一个节点可能生成一个基础音调，第二个节点可能用于设置其音量，第三个节点可能会对音调应用混响或失真等效果，依此类推。通过这种方案，你可以产生几乎任何你想要的声音。\n\
  \n### 设置\n\n一如既往，我们将从一个简单的 HTML 文件开始。该文件将赋予用户播放由 Web Audio API 生成的声音的能力。创建一个名为 `music`\
  \ 的新目录，并将列表 12-1 中的内容输入到名为 `index.html` 的新文件中。\n\n```\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <title>Music</title>\n  </head>\n  <body>\n  ❶ <button id=\"play\"\
  >Play</button>\n  ❷ <p id=\"playing\" style=\"display: none\">Playing</p>\n    <script\
  \ src=\"script.js\"></script>\n  </body>\n</html>\n```\n\n列表 12-1：一个用于探索 Web Audio\
  \ API 的 `index.html` 文件\n\n此列表创建了两个视觉元素：一个播放按钮 ❶ 和一个包含“Playing”文本的段落 ❷。该段落使用了内联样式属性（style），这允许我们直接从\
  \ HTML 文件向该元素添加 CSS 声明。在这种情况下，我们将 `display` 设置为 `none`，这会隐藏该元素。稍后，我们将使用 JavaScript\
  \ 移除样式并在音频播放时显示该元素。\n\n接下来，我们将开始编写 JavaScript。在包括 Google Chrome 在内的许多浏览器中，在用户与页面进行交互之前，Web\
  \ Audio API 不播放任何声音。我们使用播放按钮作为交互元素，它将触发我们的音频代码。由于我们只需要按钮被点击一次，因此在它点击后我们将隐藏它。\n\n\
  在与 HTML 文件相同的目录下创建 `script.js`，并添加列表 12-2 中所示的内容。这段代码会在用户点击按钮时隐藏播放按钮并显示“Playing”文本。请注意，我们现在还没有编写任何\
  \ Web Audio API 代码——这只是在设置按钮。\n\n```\n❶ let play = document.querySelector(\"#play\"\
  );\nlet playing = document.querySelector(\"#playing\");\n❷ play.addEventListener(\"\
  click\", () => {\n  // 隐藏此按钮\n  play.style = \"display: none\";\n  playing.style\
  \ = \" \";\n});\n```\n\n列表 12-2：鼠标点击时切换元素的可见性\n\n首先，我们使用 `document.querySelector`\
  \ 方法 ❶ 获取两个元素的引用。然后，我们为播放按钮 ❷ 添加一个点击事件监听器。当用户点击它时，我们的事件监听器会为按钮添加 `display: none`\
  \ 的内联样式属性，并将段落的内联样式设置为空字符串，从而有效地移除了在 HTML 文件中作为属性设置的内联样式。这段代码的最终效果是点击播放按钮将隐藏按钮并显示段落。这有两个目的：它让用户知道音乐现在应该开始播放，并且移播放按钮以便其无法被再次点击。\n\
  \n### 使用 Web Audio API 生成音调\n\n完成设置后，我们现在可以编写一些 Web Audio API 代码了。为了开始，我们将仅生成一个单一音调，这相当于音频版的“Hello,\
  \ world!””。生成该音调的代码如列表 12-3 所示。正如我之前提到的，除非由用户事件（如鼠标点击）触发，否则音频不会播放，因此所有的音频代码都位于点击处理程序内部。\n\
  \n```\n--snip--\nplay.addEventListener(\"click\", () => {\n  // 隐藏此按钮\n  play.style\
  \ = \"display: none\";\n  playing.style = \" \";\n\n❶ let audioCtx = new AudioContext();\n\
  \n❷ let oscNode = audioCtx.createOscillator();\noscNode.frequency.value = 440;\n\
  \nNode =Node = audioCtx.create\n();\ngainNode... 0.0.\n\n....((.);););gainNode.connect(audioCtx.destination);\n\
  \n..Node..();\n});\n```\n\n列表 12-3：播放单一音调\n\n我们做的第一件事是创建 `audioCtx` ❶。这是我们与 Web\
  \ Audio API 交互的对象，类似于 `canvas` 元素。接下来，我们创建第一个节点，一个振荡器 `oscillator` ❷。在电子和信号处理术语中，`oscillator`\
  \ 是一种按规律产生信号的设备。Audio API 输出的默认波形是正弦波，如图 12-1 所示。当波波动足够快并连接扬声器时，它就会产生可听的音调。在这个示例中，我们将频率设置为\
  \ 440 (Hz)，即每秒 440 次。也就是说，振荡器每秒总输出 440 次从 0 到 1 再回到 0 的信号。这意味着波形的一个周期持续 1/440 秒，即\
  \ 2.27 毫秒。我在这里使用 440 Hz 是因为它是乐器调准的标准参考频率。该频率对应于中音以上的 A 音。\n\n图 12-1：正弦波的一个周期\n\n\
  接下来，我们创建一个增益节点 ❸ 并将其值设置为 0.5。在信号处理中，`gain`（增益）指的是信号振幅或数值范围的增加或减少。在实践中，增益相当于量控制。增益\
  \ 2 使振幅翻倍，使声音更大；增益 0.5 使振幅减半，使声音更小；而增益 1（增益节点的默认值）对振幅没有影响。对图 12-1 的正弦波应用 0.5 的增益将产生一个最大值为\
  \ 0.5、最小值为 –0.5 的正弦波，如图 12-2 所示。\n\n图 12-2：应用了 0.5 增益的图 12-1 中的正弦波\n\n\n\n\n到目前，我们有两个节点：一个振荡器节点和一个增益节点。为了将增益实际应用于振荡器信号，我们需要将这些节点连接起来。我们使用振荡器节点的\
  \ `connect` 方法❹ 将振荡器节点的输出连接到增益节点的输入。然后，为了能够听到结果，我们将增益节点的输出连接到主输出，我们可以通过音频上下文的 `ctx.destination`\
  \ 获取它。这些连接意味着振荡器信号通过增益节点，然后传递到输出端，如果开启了声音，它最终将进入你的耳机或扬声器。`图 12-3` 插明了这些连接。\n\n![](img/Figure_12-3.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 12-3：节点图</samp>\n\n在我们没有告诉振荡器之前，它实际上并不会创建信号。要做到这一点，我们在振荡器上调用\
  \ `start` 方法，并将 `audioCtx.currentTime` 作为参数传递进去 ❺。`currentTime` 属性对应于音频上下文处于激活状态的秒。通过将\
  \ `audioCtx.currentTime` 传递给 `start` 方法，我们告诉振荡器立即播放。然后我们调用 `stop` 方法，传递 `audioCtx.currentTime\
  \ + 2`。这告诉振荡器在启动两秒后停止。\n\n所有这些代码的效果是，当你从浏览器中加载 `index.html` 页面并点击播放按钮时，应该播放一个 440\
  \ Hz 的音调，持续两秒。如果你没有听到任何声音，请确保你的电脑和浏览器已启用声音——例如，通过播放 YouTube 视频。如果仍然不起，请检查控制台以确保没有错误。\n\
  \n你可能在想为了一个非常简单的示例你就得写了大量的代码，你是对的！Web Audio API 非常强大，但你必须在非常底层的面上使用极其基础的构建模块进行工作。为了简化问题，接下来我们将重心转向一个流行的、高层的音频库，称为\
  \ Tone.js。\n\n### <samp class=\"SANS_Futura_Std_Bold_B_11\">Tone.js 库</samp>\n\n\
  Tone.js 库构建在 Web Audio API 之上。它的设计目的是让使用该 API 创建音乐变得更容易。例如，你不再需要折腾振荡器和增益节点，Tone.js\
  \ 让你可以使用带有音量控制的电子乐器。与其使用频率，你可以使用音符名称。而且与其使用秒来控制事件发生的时间，你可以使用小节（bars）和节拍（beats）。\n\
  \nTone.js 网站 `[`<wbr>tonejs<wbr>.github<wbr>.io`](https://tonejs.github.io)` 提供了安装和使用该库的细节。最简单的选项是使用托管在内容分发网络（CDN）上的预构建文件，例如\
  \ `[`<wbr>unpkg<wbr>.com`](https://unpkg.com)`，这正是我们要做的。这样，你访问该库只需要在你的 HTML 文件的\
  \ script 元素中直接引用 URL 即可。只要你在工作时可以访问互联网，就不需要下载库副本。\n\n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\"\
  >使用 Tone.js 生成音调</samp>\n\n让我们改用 Tone.js 库重新创建我们的 Web Audio API “你好，世界！”示例。我们可以保持所有\
  \ HTML 不变，除了为库添加一个新的 script 标签，如 `列表 12-4` 所示。\n\n```\n--snip--\n    <p id=\"playing\"\
  \ style=\"display: none\">Playing</p>\n    <script src=\"https://unpkg.com/tone@14.7.77/build/Tone.js\"\
  ></script>\n    <script src=\"script.js\"></script>\n  </body>\n</</html>\n```\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 12-4：在</samp> <samp class=\"\
  SANS_Futura_Std_Book_11\">index.html</samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >文件中包含 Tone.js</samp>\n\n我们将新新 script 元素的 `src` 设置为 `unpkg.com` 上的文件，该文件包含完整的 Tone.js\
  \ 库的单个 JavaScript 文件。\n\n接下来，我们将编写 JavaScript。由于 Tone.js 底层使用 Web Audio API，我们仍然面临需要用户输入才能开始播放音频的限制。因此，我们仍然需要点击事件处理器，但\
  \ `script.js` 中的其他部分都会发生。`列表 12-5` 显示了更新后的 JavaScript 文件。\n\n```\n--snip--\nplay.addEventListener(\"\
  click\", () => {\n  // Hide this button\n  play.style = \"display: none\";\n  playing.style\
  \ = \" \";\n\n  Tone.start();\n\n  let synth = new Tone.Synth({\n    oscillator:\
  \ {type: \"sine\"},\n    envelope: {attack: 0, decay: 0, sustain: 1, release: 0},\n\
  \    volume: -6 \n }).toDestination();\n\n  synth.triggerAttackRelease(\"A4\", 2,\
  \ 0);\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 12-5：使用\
  \ Tone.js 播放单个音调</samp>\n\n我们需要做的第一件事是调用 `Tone.start`。这会触发 Tone.js 库在点击处理器内部启动，确保浏览器允许其播放音频。接下来，我们创建一个新的\
  \ `Tone.Synth` 对象。`Synth` 是 `synthesizer`（合成器）的缩写，是一种电子乐器，通常带有键盘，可以生成（合成）各种声音。`Tone.Synth`\
  \ 是这种乐器的简单代码版本。\n\n`Tone.Synth` 构造函数接受一个对象作为参数，允许我们配置合成器的各个方面。在这种情况下，我们告诉合成器使用一个生成正弦波的振荡器。我们还给了合成器一个简单的振幅包络和\
  \ `-6` 的音量。我将在下一节解释这些设置的含义，但目前，这是为了匹配 `列表 12-3` 中的 Web Audio API 振荡器。在构造函数之后，我们链调用\
  \ `toDestination` 方法，将合成器的输出连接到音频上下文的输出。\n\n最后，我们告诉合成器使用它的 `triggerAttackRelease`\
  \ 方法播放单个音符。该方法接受音符名称、持续以及播放音符的时间。我们传递 `\"A4\"` 作为音符名称，它等同于 440 Hz，并告诉它立即开始播放两秒。当你重新加载浏览器并点击播放按钮时，你应该能听听到与运行\
  \ `列表 12-3` 时相同的声音。\n\n正如你可能希望看到的，使用 Tone.js 库简化了使用 Web Audio API 制作音乐的过程。你不再需要为声音的不同方面（音高、增益等）创建单独的节点，一切都统一在一个\
  \ `Synth` 对象下。如果你有任何音乐知识，还会发现该库使用的概念比 API 更接近你的理解，例如通过使用音符名称而不是频率。随着你深入了解 Tone.js，你将看到更多示例。\n\
  \n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\">理解 Tone.Synth\
  \ </samp>\n\n让我们仔细观察在 `列表 12-5` 中传递给 `Tone.Synth` 构造函数的对象。第一个属性 `oscillator` 定义了生成信号的振荡器的选项。在这种情况下，我们只是使用\
  \ `type` 属性将振荡器的类型设置为正弦波。\n\n\n\n下一个属性定义了 `amplitude envelope`（幅度包络）的选项，它决定了音符音量在其持续时间内的变化方式。大多数硬件和软件合成器都允许你配置幅度包络。最常见的包络类型是\
  \ `ADSR envelope`，它是 `attack, decay, sustain, release`（起始、衰减、维持、释放）的缩写。`attack`（起始）是从音符被触发（例如，当你按下合成器上的键时）到音符达到最大音量之间的时间。`decay`（衰减）是从起始阶段结束到音符维持阶段之间的时间。`sustain`（维持）是一个增益值，定义了在起始和衰减之后，只要按键按下，音符保持的音量。通常，这是包络起始部分所达全音量的一部分。`release`（释放）定义了在松开按键后，音符幅度回到零所需的时间。图\
  \ 12-4 以图表形式展示了这些不同的值。\n\n![](img/Figure_12-4.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 12-4：ADSR 包络的组成部分</samp>\n\nADSR 包是对许多现实乐器工作方式的近似。例如，当你拉小提琴时，音符需要一些时间才能达到全音量——这意味着它有很长的起始时间。相比之下，当你按下钢琴琴键时，起始时间非常短。同样，当你停止拉小提琴音符时，琴弦需要一点时间停止振动，而钢琴音符的释放则更为直接。合成的\
  \ ADSR 包络仍然非常简单——它们并不是对现实乐器的完美模拟——但它们为原本枯燥的音色增添了许多表现力。\n\n尽管如此，我们为合成器使用的 ADSR 包络是极其平淡的。我们将起始、衰减和释放值都设为\
  \ 0，将维持值设为 1，这意味着音色在整个持续时间内都处于全音量。这与我们在 Listing 12-3 中对简单 Web Audio API 振荡器的操作一致，这也是为什么生成的音色听起来如此有合成感的原因之一。\n\
  \n合成器选项对象的最后一个属性 `volume`（音量）以分贝（dB）设置合成器的整体音量。分贝是描述增益的另一种方式，在某些方面，它们更符合我们对增益的理解。0\
  \ 分贝等于 1 的增益（音量无变化），–6 分贝等于 0.5 的增益（即音量一半），–12 分贝对应 0.25 的增益（即音量的四分之一），依此类推；每增加\
  \ +6 分贝音量翻倍，每减少 –6 分贝减半。我们的耳朵对声音之间的相对音量很敏感，因此每当电平减半或翻倍时，在我们听来就像是变化了一个固定量。这个“固定量”是一个固定的加或减去的分贝数值，这就是为什么使用分贝设置音量更容易。在这种情况下，我们传递了\
  \ –6 dB 以匹配 Listing 12-3 中的 0.5 增益。\n\n现在你已经知道了这些选项，让我们尝试玩一下它们！首先，我们将修改振荡器的类型。目前振荡器被设置为生成正弦波，但我们将切换到方波。图\
  \ 12-5 显示了方波的单个周期的波形。\n\n![](img/Figure_12-5.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 12-5：方波</samp>\n\n注意，方波在幅度值之间有突剧的过渡，而不是正弦波那样的平滑曲线。切换到方波振荡器的代码更改如 Listing 12-6\
  \ 所示。\n\n```\n--snip--\nlet synth = new Tone.Synth({\n  oscillator: {type: \"square\"\
  },\n  envelope: {attack: 0, decay: 0, sustain: 1, release: 0},\n  volume: -6 \n\
  }).toDestination();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 12-6：将振荡器类型更改为方波</samp>\n\n当你重新加载浏览器中的代码时，你应该会听到非常不同的音色。方波比正弦波更大、更亮。你可以尝试的振荡器类型其他值还有\
  \ \"triangle\"三角波）和 \"sawtooth\"锯波）。图 12-6 显示了这些波形。\n\n![](img/Figure_12-6.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 12-6：锯波和三角波</samp>\n\n思考这些其他振荡器类型与“sine”和“square”有什么不同。每个振荡器的独特声音被称为它的\
  \ `color`（颜色）或 `timbre`（音）。\n\n接下来，让我们尝试更改包络。我们在 Listing 12-5 中特意使用了一个非常基础的包络以匹配\
  \ Listing 12-3 中的 Web Audio API 示例，后者没有包络。现在，我们将这些值设置为听起来更有音乐性的数值，如 Listing 12-7\
  \ 所示。\n\n```\n--snip--\nlet synth = new Tone.Synth({\n  oscillator: { type: \"square\"\
  \ },\n  envelope: {attack: 0.8, decay: 0.3, sustain: 0.8, release: 1},\n  volume:\
  \ -6 \n}).toDestination();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 12-7：将振荡器类型更改为方波</samp>\n\n`attack`、`decay` 和 `release` 的值都以秒为单位，而 `sustain`\
  \ 是 0 到 1 之间的数字，代表要维持的幅度电平。在这里我们将 `attack` 设置为 0.8 秒，`decay` 设置为 0.3 秒，`sustain`\
  \ 设置为 0.8，`release` 设置为 1 秒。当你重新加载并播放声音时，你应该听到音符缓慢淡入到最大音量，然后减小。两秒后，音符释放并淡出。\n\n\
  最后一个要测试的参数是 `volume`。正如之前解释过的，每当你减去 6 分贝，电平就会减半；当你增加 6 分贝，它就会翻倍。在这里尝试不同的值，例如 –12、–18\
  \ 或 –24。也可以反过来。\n\n### 顺序播放多个音符\n\n我们的合成器目前只播放一个音符，但我们可以轻松播放多个音符。Tone.js 中的音符频率可以用\
  \ Hz 给出，也可以用音名（如 A4），正如我们在 Listing 12-5 中做的那样。这些音名对应于键盘上的键，如图 12-7 所示。\n\n![](img/Figure_12-7.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 12-7：键盘上的音名</samp>\n\nC4 被称为\
  \ `middle C`（中音 C），位于大多数钢琴键盘的中间。键盘上从 C 到上方 B 的每个八度都有一个数字。例如，图 12-7 中最左侧的键是 C3，上方一个八度是\
  \ C4。如之前所述，440 Hz 对应 A4，即 C4 之上的 A。黑键被称为 `accidentals`（变音符号），它们比左边的键高一个半音，或者比右边的键低一个半音。例如，C4\
  \ 右侧的黑键可以称为 C♯4 或 D♭4（♯ 是升号，表示高一个半音，而 ♭ 是降号符号，表示低一个半音）。在 Tone.js 中编写音名时，我们使用井号 #\
  \ 表示升，使用字母 b 表示降。\n\n> <samp class=\"SANS_Dogma_OT_Bold_B_21\">注意</samp>\n> *B 和\
  \ C 之间以及 E 和 F 之间没有黑键，因为这些音之间只隔一个半音。*\n\n我们将播放从 A3 到 A4 的大调，它由音符 A3、B3、C♯4、D4、E4、F♯4、G♯4\
  \ 和 A4 组成。更新你的 *script.js* 以包含 Listing 12-8 中的代码来实现此音阶。\n\n\n\n\n```javascript\n\
  --snip--\n  let synth = new Tone.Synth({\n    oscillator: {type: \"square\"},\n\
  \  ❶ envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 0.1 },\n    volume:\
  \ -6\n  }).toDestination();\n\n  synth.triggerAttackRelease(\"A3\", 0.9, 0);\n \
  \ synth.triggerAttackRelease(\"B3\", 0.9, 1);\n  synth.triggerAttackRelease(\"C#4\"\
  , 0.9, 2);\n  synth.triggerAttackRelease(\"D4\", 0.9, 3);\n  synth.triggerAttackRelease(\"\
  E4\", 0.9, 4);\n  synth.triggerAttackRelease(\"F#4\", 0.9, 5);\n  synth.triggerAttackRelease(\"\
  G#4\", 0.9, 6);\n  synth.triggerAttackRelease(\"A4\", 0.9, 7);\n});\n```\n\n列表 12-8：播放音阶\n\
  \n这与 列表 12-5 非常相似，不同之处是我们连续触发了多个音符。注意我们更新了包络器，使其具有更短的攻击（attack）和释放（release）时间❶。特别是释放时间需要更短，这样每个音符的结束才与下一个音符的开始重叠。\n\
  \n正如我之前提到的，`triggerAttackRelease` 的第二个参数是以秒为单位的音符时长，第三个参数是播放音符的时间（同样以秒为单位）。第一个音符\
  \ `A3` 播放 `0.9` 秒，从时间零开始（即立即）。`0.1` 秒的释放发生在 `0.9` 秒持续之后，因此每个音符总共将播放 1 秒。下一个音符 `B3`\
  \ 持续时间相同，但第三个参数 `1` 意味着它将比第一个音符晚一秒开始。第三个音符设置为比第一个音符晚两秒开始，其余音符也如此。在浏览器中运行这段代码，你应该能听到一个八度的\
  \ A 大调音阶。\n\n### 同时播放多个音符\n\n我们到目前为止使用的合成器是 `单声合成器`（monophonic synth），这意味着它一次只能播放一个音符。为了同时播放多个音符，我们需要创建一个`多声合成器`（polyphonic\
  \ synth）。在 列表 12-9 中，我们更新了代码以创建一个新的多声合成器，并同时播放两个或三个音符。\n\n```javascript\n--snip--\n\
  \  Tone.start();\n\n  let synth = new Tone.PolySynth(\n    Tone.Synth,\n    {\n\
  \      oscillator: { type: \"square\" },\n      envelope: { attack: 0.1, decay:\
  \ 0.3, sustain: 0.8, release: 0.1 },\n      volume: -6\n    }\n  ).toDestination();\n\
  \n  synth.triggerAttackRelease([\"A3\", \"C#4\"], 0.9, 0);\n  synth.triggerAttackRelease([\"\
  B3\", \"D4\"], 0.9, 1);\n  synth.triggerAttackRelease([\"C#4\", \"E4\"], 0.9, 2);\n\
  \  synth.triggerAttackRelease([\"D4\", \"F#4\"], 0.9, 3);\n  synth.triggerAttackRelease([\"\
  E4\", \"G#4\"], 0.9, 4);\n  synth.triggerAttackRelease([\"F#4\", \"A4\"], 0.9, 5);\n\
  \  synth.triggerAttackRelease([\"G#4\", \"B4\"], 0.9, 6);\n  synth.triggerAttackRelease([\"\
  E4\", \"A4\", \"C#5\"], 1.9, 7);\n});\n```\n\n列表 12-9：创建并播放多声合成器\n\n在这里我们调用 `new\
  \ Tone.PolySynth` 而不是 `new Tone.Synth` 来创建一个多声合成器对象。`Tone.PolySynth` 构造函数接受两个参数：一个单声合成器（在此例中为\
  \ `Tone.Synth`）和一个包含通常传递给该单声合成器构造器的选项的对象（在此例中是传递给 列表 12-8 中 `Tone.Synth` 构造器的相同合成器选项）。多声合成器随后会根据指定的设置创建多个单声合成器，从而允许它同时播放多个音符。\n\
  \n接下来，我们播放相同的音阶，但带有额外的同步音符。这是通过向 `triggerAttackRelease` 方法传递一个音符名称数组而不是单个音符名称来实现的——例如，我们传递数组\
  \ `[\"A3\", \"C#4\"]` 来同时播放 `A3` 和 `C♯4`。默认情况下，你可以使用多声合成器最多播放 32 个音符。\n\n当你运行这个示例时，你应该能听到一个和谐的音阶，结尾有一个好听的大和弦。\n\
  \n### Tone.js Transport（传输）\n\n现在你已经学会了如何播放音符，让我们来看看如何制作歌曲。虽然你可以通过指定每个音符的时间来编写整首歌曲（就像你在最后几个示例中播放音阶那样），但这种技术很快就会变得枯燥。幸运的是，Tone.js\
  \ 有一个名为 `transport` 的概念，它让写歌变得简单得多。传输会跟踪歌曲中的当前位置，以小节（bars）和拍拍（beats）为单位。这让你能够以一种符合音乐直觉的方式调度音符在歌曲的特定点播放。传输还允许你拥有循环的音符序列，这些序列从传输的某一点开始播放，并不断重复直到你告诉它们停止。\n\
  \n西方音乐倾向于围绕小节和拍拍构建结构，最常见的是每小节四拍。音乐的速度以`每分钟拍数 (BPM)` 给出，在我们的示例中，我们将使用 Tone.js 的默认\
  \ BPM `120`，这意味着每 `0.5` 秒一拍。拍拍也称为 `四分音符`（quarter notes，因为每小节有四拍，所以一拍是小节的分之一）。`八分音符`（eighth\
  \ notes）的时长是四分音符的一半，`十六分音符`是八分音符的一半，所以每个四分音符四个十六分音符。\n\n传输的位置由三个用冒号分隔的数字字符串给出，例如\
  \ \"0:0:0\"。这三个数字分别对应当前的小节数、该小节内的当前拍数以及该拍内的当前十六分音符。所有索引都从零开始。这意味着，例如，“0:0:0”代表第一个小节的开始，“1:1:0”代表第二个小节的第二个拍，而“6:3:2”代表第七小节第四拍的第三个十六分音符。我们将这些字符串称为\
  \ `小节:拍:十六分音符表示法`（bars:quarters:sixteenths notation）。\n\n### Tone.Loop\n\nTone.js\
  \ transport 为我们提供了一种定义音乐循环的简单方法，包括它们何时开始和何时结束。其中最的是 `Tone.Loop` 定义了一种不断产生新音符的方法。让我们尝试每四分音符重复播放一个音符。使用\
  \ 列表 12-10 中的代码修改 *script.js*。\n\n```javascript\n--snip--\n  Tone.start();\n\n❶\
  \ let synth = new Tone.Synth().toDestination();\n\n❷ let loop = new Tone.Loop(time\
  \ => {\n  ❸ synth.triggerAttackRelease(\"C4\", \"16n\", time);\n  }, \"4n\");\n\n\
  ❹ loop.start(\"0:0:0\");\n  loop.stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\n列表 12-10：循环\n\n> **注意**\n> *在之前的列表中，我们传递的是数字的时长，它们是以秒为单位的时长。使用如 \"4n\"\
  \ 代表四分音符或 \"16n\" 代表十六分音符的音符长度时长的优势是，当我们更改 BPM 时，它们会自动进行缩放。*\n\n\n\n\n\n我们传递给 `Tone.Loop`\
  \ 的回调函数体调用了 `synth` 的 `triggerAttackRelease` 方法来播放持续时间为十六音符 ❸ 的音符 `C4`。`triggerAttackRelease`\
  \ 方法的第三个参数 `time` 代表播放音符的时间。当 `Tone.Loop` 对象每次调用回调函数时，都会提供一个新的 `time` 值，并将其填充传输器（transport）上相应的位置。\n\
  \n最后，我们对 `Tone.Loop` 构造函数返回的循环调用了 `start` 和 `stop` 方法 ❹，传入我们希望该循环开始和停止的 `time`，随后调用\
  \ `Tone.Transport.start` 启动传输器从开始播放。我们从 `\"0:0:0\"`（第一小节开头）开始，在 `\"4:0:0\"`（第五小节开头）停止，这意味着这段代码将持续四个完整的小节，每个小节四拍。我们的循环在每拍都会重复一次，每次播放一个音符，因此总共将播放\
  \ 16 个音符。尝试重新加载页面看看吧！你可以像音乐家那样这样数数小节和节拍：“*one* 二三四，*two* 二三四，*three* 二三四，*four*\
  \ 二三四”。注意 `Tone.js` 不会在时间位置 `\"4:0:0\"` 处播放第十七音符，因为循环的结束点是不包含在内的。\n\nListing 12-11\
  \ 显示了创建我们在 Listing 12-10 中编写的相同循环的另一种方法。这次我们直接将 `start` 和 `stop` 方法链式到 `Tone.Loop`\
  \ 构造函数上。\n\n```\n--snip--\n  let synth = new Tone.Synth().toDestination();\n\n \
  \ new Tone.Loop(time => {\n    synth.triggerAttackRelease(\"C4\", \"16n\", time);\n\
  \  }, \"4n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n});\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 12-11: 使用更少的代码实现循环</samp>\n\
  \n使用这种表示法，我们不需要创建一个变量来持有 `Tone.Loop` 对象，并且通过链式调用 `start` 和 `stop` 方法节省了几行代码。我们将在本节其余部分使用这种模式。\n\
  \n`Tone.Loop` 虽然基础，但也非常非常多功能。你可以在回调函数中运行任意代码，因此你可以做的远不止是重复播放同一个音符。例如，你可以选择每次播放一个新的随机音符。Listing\
  \ 12-12 展示了你如何通过随机从五声音阶（即五个音符的音阶）中播放音符来生成一段短曲（我在这里选择五声音阶是因为五声音阶中音符的任何组合听起来通常都很悦耳）。\n\
  \n```\n--snip--\n  Tone.start();\n\n❶ let synth = new Tone.PolySynth(\n    Tone.Synth,\n\
  \    {\n      oscillator: { type: \"triangle\" },\n      volume: -9\n    }\n  ).toDestination();\n\
  \n❷ let notes = [\"C4\", \"D4\", \"E4\", \"G4\", \"A4\", \"C5\"];\n\n  new Tone.Loop(time\
  \ => {\n    for (let i = 0; i < 3; i++) {\n    ❸ if (Math.random() < 0.5) {\n  \
  \    ❹ let note = notes[Math.floor(Math.random() * notes.length)];\n         synth.triggerAttackRelease(note,\
  \ \"32n\", time);\n      }\n    }\n  }, \"8n\").start(\"0:0:0\").stop(\"8:0:0\"\
  );\n\n  Tone.Transport.start();\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 12-12: 使用 Tone.Loop 生成随机音乐</samp>\n\n在这个示例中，我们切换到了多声器 ❶，以便同时播放多个音符。`notes`\
  \ 数组包含 C 大调五声音阶的一个八度，包括下一个八组的 `C` ❷。在 `Tone.Loop` 回调函数内部，我们使用 `for` 循环运行三次代码。每次循环时，我们调用\
  \ `Math.random()` ❸，它返回一个 0 到 1 之间的随机数，用来决定是否播放音符。如果值小于 0.5，我们就播放一个音符。否则，跳过该音符。音符名称通过在\
  \ `notes` 数组中随机选取索引来确定，使用代码 `Math.floor(Math.random() * notes.length)` ❹。\n\n`Tone.Loop`\
  \ 对象每隔八分符（`\"8n\"`）调用一次此代码，持续八小节（`\"0:0:0\"` 到 `\"8:0:0\"`）。这一切的效果是，每隔八分符都会播放数组中的最多三个音符（不保证唯一性，所以同一个音符可能会同时被播放两次或三次，导致该音符声音更大）。对于这三个音符中的每一个，都有二分之一的概率被播放，因此总体上在任何给定的八分符上没有音符播放的概率是八分之一。\n\
  \n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\">Tone.Sequence</samp>\n\
  \n在本节中，我们将查看另一个 Tone.js 辅助工具，称为 `Tone.Sequence`。它允许你提供音符名称列表，并按固定间隔调度播放。你可以根据需要重复整个序列任意次数。作为一个示例，我们将创建一个包含四个音符的重复模式：一个\
  \ G4 后面跟三个三个 C4。使用 Listing 12-13 中的代码更新 *script.js*。\n\n```\n--snip--\n  Tone.start();\n\
  \n  let synth = new Tone.Synth().toDestination();\n\n  new Tone.Sequence(❶ (time,\
  \ note) => {\n    synth.triggerAttackRelease(note, \"16n\", time);\n  }, ❷ [\"G4\"\
  , \"C4\", \"C4\", \"C4\"], ❸ \"4n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 12-13: 使用\
  \ Tone.Sequence 创建重复序列</samp>\n\n这与我们的第一个 `Tone.Loop` 示例 (Listing 12-10) 非常相似，但有两个重要的变化。首先，回调函数接收两个参数\
  \ `time` 和 `note` ❶，而不是单一的 `time` 参数。其次，在回调函数之后还有一个额外的参数，它包含一个音符列表 ❷。每次调用回调函数时，列表中的下一个音符都会作为\
  \ `note` 参数传递。它将不断循环循环列表中的音符，直到到达停止时间。`Tone.Sequence` 的第三个参数提供了每次回调之间的持续 ❸。在这种情况下，我们使用了\
  \ `\"4n\"`，这意味着每隔四分符将播放一个新的音符。\n\n当你运行这个示例时，你应该听到一个模式播放了 4 小节，每个小节 4 拍，总共 16 个音符。如果我们手动编写所有对\
  \ `synth.triggerAttackRelease` 的调用而不是依赖 `Tone.Sequence` 来自动化它们，它们看起来像这样：\n\n```\n\
  synth.triggerAttackRelease(\"G4\", \"16n\", \"0:0:0\");\nsynth.triggerAttackRelease(\"\
  C4\", \"16n\", \"0:1:0\");\nsynth.triggerAttackRelease(\"C4\", \"16n\", \"0:2:0\"\
  );\nsynth.triggerAttackRelease(\"C4\", \"16n\", \"0:3:0\");\nsynth.triggerAttackRelease(\"\
  G4\", \"16n\", \"1:0:0\");\nsynth.triggerAttackRelease(\"C4\", \"16n\", \"1:1:0\"\
  );\n--snip--\n```\n\n在这里，我只是将音符和时间参数替换为回调前六次调用的实际值。注意由于我们使用了作为回调之间持续时间的 `\"4n\"\
  `，小节:四分符:十六音符表示法中的第二个小节数字是如何递增的。（但在实践中，`Tone.Sequence` 传递的是秒数而不是小节:四分符:十六音符表示法。）\n\
  \n如果你想要一个带有空白间隙（音乐术语中的*停顿*）的序列，可以在音符数组中使用 `null` 来替换音符名称。使用 Listing 12-14 中的代码修改\
  \ *script.js* 以查看效果。\n\n```\n--snip--\n  new Tone.Sequence((time, note) => {\n \
  \   synth.triggerAttackRelease(note, \"16n\", time);\n  }, [\"C4\", null, \"B3\"\
  , \"C4\", \"G3\", \"A3\", null, \"B3\"], \"8n\")\n    .start(\"0:0:0\")\n    .stop(\"\
  4:0:0\");\n\n  Tone.Transport.start();\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 12-14: 使用</samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">null</samp>\
  \ 添加停顿</samp>\n\n现在我们有一个更序列，其中插入了一些 null 以在序列中加入暂停。我们还将持续时间从 `\"4n\"` 改为 `\"8n\"\
  `，这意味着音符播放速度比以前快了一倍。当你播放这个更新后的示例时，你应该听到一个更有趣的音符序列，包含了停顿。\n\n\n\n\n\n我们将介绍的最后一个传输工具是\
  \ `Tone.Part`。它是所有工具中最灵活的，因为它允许我们指定每个播放的音符的精确时机。通过 `Tone.Part`，我们不再传递一个音符名称数组，而是传递一个时间/音符对数组。例如，`[[\"\
  0:0:0\", \"C4\"], [\"0:1:0\", \"D4\"], [\"0:1:2\", \"E4\"]]` 会在指定的三个时间播放三个音符 `C4`、`D4`\
  \ 和 `E4`。这样一来，与 `Tone.Loop` 和 `Tone.Sequence` 不同，音符不需要以相等的时间间隔播放。此外，默认情况下 `Tone.Part`\
  \ 不会循环，因此数组中的音符序列只会播放一次。请参阅 Listing 12-15 中的代码示例示例。\n\n```\n--snip--\n  Tone.start();\n\
  ❶ let synth = new Tone.PolySynth(Tone.Synth).toDestination();\n\n  new Tone.Part((time,\
  \ note) => {\n  synth.triggerAttackRelease(note, \"16n\", time);\n  }, [\n    [\"\
  0:0:0\", ❷ [\"C3\", \"E4\"]],\n    [\"0:0:3\", \"D4\"],\n    [\"0:1:0\", \"C4\"\
  ],\n    [\"0:1:2\", \"D4\"],\n    [\"0:2:0\", [\"E3\", \"E4\"]],\n    [\"0:2:2\"\
  , \"E4\"],\n    [\"0:3:0\", \"E4\"],\n    [\"1:0:0\", [\"G3\", \"D4\"]],\n    [\"\
  1:0:2\", \"D4\"],\n    [\"1:1:0\", \"D4\"],\n    [\"1:2:0\", [\"E3\", \"E4\"]],\n\
  \    [\"1:2:2\", \"G4\"],\n    [\"1:3:0\", \"G4\"]\n❸]).start(\"0:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\nListing 12-15: 使用 Tone.Part 播放旋律\n\n在这里在这里做的第一个更改是 `synth` ❶。这次我们又回到了使用多音合成器，因此我们可以同时播放多个音符。除了合成器不同外，回调函数的主体是相同的。我们仍然调用\
  \ `synth.triggerAttackRelease` 并传递 `note` 和 `time` 参数，`Tone.Part` 将自动填充这些参数。接下来是时间/音符对的数组。你可能会注意到某些音符本身就是数组；例如，列表中的第一个“音符”是\
  \ `[\"C3\", \"E4\"]` ❷。这对音符对将原封不动地传递给 `triggerAttackRelease` 方法，其效果是同时播放两个音符，正就像我们其他多音合成器示例一样。\n\
  \n最后，我们调用了 `.start(\"0:0:0\")` ❸，它的效果是立即播放此部分。如果我们改用 `.start(\"1:0:0\")`（例如），那么旋律将在小节停顿后开始。为每个时间/音符对给出的时间是相对于传递给\
  \ `start` 方法的时间。\n\n当你运行这个示例时，你应该能听听到《小玛丽有一只小羊》的开头。\n\n### 制作鼓声\n\n大多数电子音乐都有某种鼓点。用于制作节奏点的鼓声可以来自音频文件，也可以是合成的。在这里我们将使用后一种技术。鼓点的核心围绕三个组件构建：大音鼓（“boom”声）、小军鼓（“bah”声）和踩镕（“ti”声）。在这一节中，你将学习合成这些声音的技术。\n\
  \n### 镕合成\n\n现实世界中的镕由两个面对面的镕片组成。顶部的镕片连接到一个踏板，这样鼓手就可以让镕片接触或分开。我们在这里追求的是闭合（镕片接触）的声音。当你用鼓棒击打闭合的镕时，它们会产生一种迅速消失的高音。\n\
  \n我们将通过使用一种不同的合成器 `NoiseSynth` 来生成白噪声，而不是带音高的音符。在信号处理中，`white noise` 是一种在所有频率上具有相等分分量的随机信号。我们将为\
  \ `NoiseSynth` 提供一个幅度包络，以模拟用棒子击打镕时的突然冲击。最后，我们将噪声通过 `filter`——一种允许某些频率通过而同时降低其他频率电平的设备——来消除低频，使其听起来更高且更像镕片。\n\
  \n首先，我们将设置 `NoiseSynth` 和包络，并循环播放镕声。使用 Listing 12-16 中的代码更新你的 `script.js`。\n\n```\n\
  --snip--\n  Tone.start();\n\n❶ let hiHat = new Tone.NoiseSynth({\n    envelope:\
  \ {\n      attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n    volume:\
  \ -6\n  }).toDestination();\n\n❷ new Tone.Loop(time => {\n    hiHat.triggerAttackRelease(\"\
  16n\", time);\n  }, \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\nListing 12-16: 镕声的开始\n\n我们创建了一个新的 `NoiseSynth` ❶，传递了一个幅度包络和 -6 dB 的音量。包络具有非常短的攻击时间（1/1000\
  \ 秒）和较长的衰减时间（1/10 秒），这本应模拟击打镕时的幅度包络。因为 sustain 和 release 都被设置为 0，声音将在初始攻击和衰减周期（0.001\
  \ + 0.1 s）后立即结束。特别是，sustain 为 0 意味着声音将全音量的 0% 持续，因此即使音符的持续时间更长，你在攻击和衰减之后也听不到任何声音。\n\
  \n接下来，我们使用 `Tone.Loop` 播放四个小节的连续八分音符镕声 ❷。注意 `NoiseSynth` 上的 `triggerAttackRelease`\
  \ 方法不需要音符名称，因为噪声没有特定的音高。你只需要指定持续时间和播放时间。\n\n当你运行这个示例时，你应该听到持续连续的镕声。它听起来还不好，因为我们还没有添加滤波器。我们将在\
  \ Listing 12-17 中完成这一点。\n\n```\n--snip--\n  Tone.start();\n\n❶ let hiHatFilter =\
  \ new Tone.Filter(15000, \"bandpass\").toDestination();\n\n  let hiHat = new Tone.NoiseSynth({\n\
  \    envelope: {\n      attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n\
  \    volume: -6\n❷}).connect(hiHatFilter);\n\n  new Tone.Loop(time => {\n--snip--\n\
  ```\n\nListing 12-17: 为镕声应用滤波器\n\n首先，我们使用 `Tone.Filter` 创建一个 `带通滤波器` ❶。这种滤波器只允许（“通过”）你选择的频率或周围的频率。在这种情况下，我们告诉滤波器通过\
  \ 15,000 Hz（即 15 kHz）附近的频带，同时消除所有其他频率。人类的听力范围大约是 20 Hz 到 20 kHz，因此我们的滤波器只允许噪声中频率较高的部分通过。\n\
  \n在 Listing 12-16 中，我们对 `NoiseSynth` 使用了 `toDestination()` 将其直接连接到输出。在 Listing 12-17\
  \ 中，我们改为将滤波器连接到输出 ❶，然后将合成器连接到滤波器 ❷。这意味着合成器的声音在输出到扬声器或耳机之前经过滤波器的处理。结果是，当你运行这个示例时，你应该听到同样的镕声，但仅限于高频，听起来更像真实的镕。\n\
  \n\n\n\n```\n--snip--\n  new Tone.Loop(time => {\n    hiHat.triggerAttackRelease(\"\
  16n\", time);\n  }, \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  class Snare {\n\
  \    constructor() {\n    ❶ this.noiseFilter = new Tone.Filter(5000, \"bandpass\"\
  ).toDestination();\n    ❷ this.noiseSynth = new Tone.NoiseSynth({\n        envelope:\
  \ {\n          attack: 0.001, decay: 0.1, sustain: 0, release: 0\n        },\n \
  \       volume: -12\n      }).connect(this.noiseFilter);\n\n    ❸ this.synth = new\
  \ Tone.Synth({\n        envelope: {\n          attack: 0.0001, decay: 0.1, sustain:\
  \ 0, release: 0\n        },\n        oscillator: {type: \"sine\"},\n        volume:\
  \ -12\n      }).toDestination();\n    }\n\n    ❹ triggerAttackRelease(duration,\
  \ when) {\n      this.noiseSynth.triggerAttackRelease(duration, when);\n      this.synth.triggerAttackRelease(\"\
  G3\", duration, when);\n     }\n    }\n\n❺ let snare = new Snare();\n\n❻ new Tone.Loop(time\
  \ => {\n    snare.triggerAttackRelease(\"16n\", time);\n  }, \"2n\").start(\"0:1:0\"\
  ).stop(\"4:0:0\");\n\n  Tone.Transport.start();\n});\n```\n\n列表 12-18：合成小军鼓\n\n\
  从高层角度来看，`Snare` 类有两个方法：`constructor` 和 `triggerAttackRelease`。`constructor` 创建了一个滤波器和两个合成器。`triggerAttackRelease`\
  \ 方法调用了两个合成器的 `triggerAttackRelease` 方法以同时播放它们。\n\n在 `constructor` 中，我们首先创建了过滤器\
  \ ❶ 和噪声合成器 ❷。这与我们创建 `hi-hat`（镲）的方式非常相似，只是对 `bandpass` 滤波器使用了 5,000 Hz 的频率，以反映小军鼓更低的声音。接下来，我们创建了有音调的合成器\
  \ ❸，它使用了与噪声合成器类似的振幅包络，但攻击时间（attack）更短，以模拟小军鼓的声音（在真实的军鼓中，军鼓是由鼓皮的震动触发的，因此它们会略后于鼓声）。该合成器配置了\
  \ `sine` 波形振荡器。由于我们将同时播放两个合成器，我们给每个合成器设置为 -12 的音量，产生的整体音量与 `hi-hat` 相似。\n\n`triggerAttackRelease`\
  \ 方法 ❹ 只需要一个 `duration` 和一个 `when` 参数。这些参数被传递给底层合成器的 `triggerAttackRelease` 方法。当我们触发有音调的合成器时，我们给它一个音名\
  \ `\"G3\"`，这是我决定为小军鼓调制的频率。有音调合成器的加入非常微妙，但让鼓声听起来更真实。\n\n接下来，我们实例化该类 ❺，最后我们创建了一个新的\
  \ `Tone.Loop` 对象 ❻。这个循环的长度是 `hi-hat` 循环的四倍（使用 `\"2n\"` 而不是 `\"8n\"`，或者说是二分符而不是八分音符），并在一个四分符后开始。这意味着在每一小节的第二拍和第四拍都会有一个小军鼓声。当你运行这个示例时，你应该能每隔八分音符听到一次\
  \ `hi-hat`，每两个四分符听到一次小军鼓。\n\n### 底鼓合成\n\n最后一个要合成的鼓声是底鼓。底鼓比小军鼓大得多，而且它没有产生杂音的军鼓弦。底鼓的声音相当复杂，但幸运的是\
  \ `Tone.js` 有一个名为 `MembraneSynth` 的合成器，可以很好地模拟它。这个合成器取一个普通的振荡器并在短时间内降低其频率，最终在设置得当的情况下，听起来非常像底鼓。[插列表\
  \ 12-19] 显示了如何实现这一点。\n\n```\n--snip--\n  new Tone.Loop(time => {\n    snare.triggerAttackRelease(\"\
  16n\", time);\n  }, \"2n\").start(\"0:1:0\").stop(\"4:0:0\");\n\n  let kick = new\
  \ Tone.MembraneSynth({\n  ❶ pitchDecay: 0.02,\n    octaves: 6,\n    volume: -9\n\
  \  }).toDestination();\n\n❷ new Tone.Loop(time => {\n    kick.triggerAttackRelease(50,\
  \ \"16n\", time);\n  }, \"2n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\n列表 12-19：合成底鼓\n\n`MembraneSynth` 的选项包括 `pitchDecay` ❶，它用秒指定了频率变化的快慢，以及\
  \ `octaves`，它指定了在该时间内频率下降了多少个八度。在我们的循环 ❷ 中，我们以 50 Hz 的频率触发合成器。这个循环与小军鼓循环具有相同的 `\"\
  2n\"` 持续时间，但从时间零开始，这意味着底鼓和小军鼓将每隔一个四分符交替出现，产生出经典的摇滚鼓点。当你运行这个示例时，你可能会认出它是许多歌曲的基础鼓点模式。\n\
  \n### 回响\n\nReverb（reverberation 的缩写）是一种效果，让音乐听起来像是在房间或更大的封闭空间内播放。现实世界中的声音在房间墙壁间反射时产生的随机回声正是这种回响效果的来源。回响让每个声音都需要一点时间消失，它会让我们的鼓声听起来更真实。我们可以使用\
  \ `Tone.Reverb` 添加回响，如你在 [插列表 12-20] 中所示。\n\n```\n--snip--\n  Tone.start();\n\n\
  \  let reverb = new Tone.Reverb({\n    decay: 1,\n    wet: 0.3\n  }).toDestination();\n\
