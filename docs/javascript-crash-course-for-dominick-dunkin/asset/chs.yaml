  \n在最后一个项目中，你使用从 GitHub Search API 获取的实时数据创建了一个相当复杂的交互式图表。现在你已经拥有了使用 `D3` 创建自定义图表所需的所有工具。然而，我们只触及了该库提供的功能的一小部分；它支持许多不同类型的可视化，例如树图、地图以及其他更冷门的布局。每种可视化类型都基于\
  \ SVG、数据绑定、连接（joins）、比例尺（scales）和过渡，因此你在这里学到的知识将为你以后进一步探索 JavaScript 数据可视化打下良好的基础。D3\
  \ 网站 `https://d3js.org` 是进一步研究的极佳起点。\n\n# 后记\n\n![](img/opener.png)\n\n你已经学习了 JavaScript\
  \ 语言的核心，完成了书中的三个项目，现在你可能疑惑下一步该做什么。好消息（取决于你的乐观程度）是学习永无止境。你的职业发展有许多不同的方向。以下是关于可能的下一步和可以探索的工具的一些建议。\n\
  \n### 项目\n\n到目前，你应该已经对如何设置新项目有了相当好的理解，为什么不尝试构建一些新东西呢？一个选择是利用你在书中学的技巧制作自己的游戏。与 `Pong`\
  \ 类似的简单街机游戏包括贪蛇（`Snake`）、太空入侵者（`Space Invaders`）、俄罗斯方（Tetris）和炸砖块（Breakout）。你也可以尝试完全不同的东西，做一个文字游戏，比如\
  \ `Wordle` 或吊字猜（Hangman`）。\n\n你还可以尝试在书中其他项目的知识基础上进行扩展，创作你自己的音乐作品或数据可视化。在音乐方面，你可能想尝试鼓机，或者一个无限的音乐生成器。你也可以利用你的知识为其中一个游戏添加音效。在数据可视化方面，有无数其他\
  \ API 可以用来尝试从其他服务获取数据。正如第 15 章所述，许多 API 需要某种形式的身份验证，这在基于浏览器的应用程序中是不可行的；但通过 `Node.js`，你也可以尝试构建你自己的应用程序。\n\
  \n### Node.js\n\n本书仅解释了编写在浏览器中运行的 JavaScript，但通过 `Node.js`，你也可以在后端 Web 服务器上运行 JavaScript。请查看\
  \ `https://nodejs.dev/en/learn/`，这是一个开始学习 `Node.js` 的绝佳指南。一旦你的应用程序有了后端，你就可以做更多有趣的事情，例如代表用户存储数据、使用密钥密钥访问经过身份验证的第三方\
  \ HTTP API 以及等等。\n\n### 工具\n\n\n\n\n\n有很多各种工具可以在你继续编程之旅时为你提供帮助。本节介绍了其中一些工具，但远非涵盖全部内容。\n\
  \n### Git\n\nGit 是一个流行的版本控制系统，允许你跟踪代码的更改并返回到早期的版本。当我刚开始编程时，经常会发现自己在修改代码后弄坏了某些功能，却不知道自己是怎么弄坏的，也无法恢复之前的状态。为了避免这种情况，我开始对代码进行备份，以便能够回到早期的版本。Git\
  \ 是实现这一目标的好得多的方法。通过 Git，你可以进行 `commits`，存储代码在特定时间点的状态。每个 commit 都在之前的 commit 的基础上构建，同时跟踪已更改的内容。\n\
  \n有很多关于学习 Git 的在线资源。你可以在 [`git-scm.com/doc`](https://git-scm.com/doc) 找到很多它们。\n\n\
  ### GitHub\n\n一旦在计算机上安装了 Git，使用 GitHub（我们在第 15 章中获取数据的服务）将是一个很棒的下一步。GitHub 提供了一种上传和共享本地\
  \ Git 仓库的方法，以便在任何地方访问它们。\n\nGitHub 还让你能够访问数百万个开源仓库，你可以对其进行 `fork`（创建你自己的副本）并随心所欲地修改。例如，要查看我公共仓库，请访问\
  \ [`github.com/skilldrick`](https://github.com/skilldrick)。\n\n### CodePen\n\n为了与其他分享你的项目，你需要一种让它们通过网络访问的方法。你可以建立自己的\
  \ Web 托管，但更简单的选项是使用 CodePen [`codepen.io`](https://codepen.io)。这同样是用于托管本书配套资源的工具，地址为\
  \ [`codepen.io/collection/ZMjYLO`](https://codepen.io/collection/ZMjYLO)。\n\n通过\
  \ CodePen，你可以创建并共享使用 HTML、CSS 和 JavaScript 构建的项目。所有代码都可以在页面上的独立面板中查看。例如，图 A-1 显示了一个由我制作的示例\
  \ Pen，每当你点击文本时，它都会添加额外的感叹号。你可以在线访问 [`codepen.io/skilldrick/pen/abKaQpo`](https://codepen.io/skilldrick/pen/abKaQpo)\
  \ 查看该 Pen。\n\n![](img/Figure_A-1.png)\n\n图 A-1：CodePen 上的示例 Pen\n\n在 HTML 面板中，只需要\
  \ `body` 元素的内容。CodePen 会自动提供其余的 HTML 结构。你还可以通过设置对话框轻松引入外部 JavaScript 库。\n\n### Glitch\n\
  \n与 CodePen 类似，Glitch 是一个为你托管代码并让你与世界分享代码的服务。与 Glitch 的独特之处在于它能够运行前端*和*后端代码。Glitch\
  \ 不仅为 HTML、CSS 和 JavaScript 提供面板，还允许你定义包含所有所需文件的完整目录结构。你甚至可以添加 `SQLite` 数据库来存储数据。访问\
  \ [`glitch.com`](https://glitch.com) 了解更多，或查看 [`glitch.new`](https://glitch.new)\
  \ 从启动应用列表中选择。\n\n## Web 开发\n\n尽管本书的重点是 JavaScript，但在此过程中你也学习了一些通用的 Web 开发技能。如果这激发了你的兴趣，你可能想花更多时间学习\
  \ Web 开发的其他方面。\n\n### HTML 和 CSS\n\nHTML 是绝大多数网页编写使用的语言，因此对其精细之处有更深入的理解是有价值的。要了解更多，请查看\
  \ MDN 文档：[`developer.mozilla.org/HTML`](https://developer.mozilla.org/HTML)。CSS\
  \ 用于网页样式化，所以如果你希望你的页面看起来漂亮，那么理解它的工作原理至关重要。在 MDN 上通过 [`developer.mozilla.org/CSS`](https://developer.mozilla.org/CSS)\
  \ Learning 更多。\n\n### JavaScript 框架和库\n\n今天的 Web 开发非常复杂，Web 应用通常包含数千行的 HTML、CSS\
  \ 和 JavaScript。为了大幅减少编写全功能现代 Web 应用所需的代码量，许多开发者使用 JavaScript 框架和库。在本书期间，最流行的两个是\
  \ `React` 和 `Vue.js`。了解这些工具并非必须，但它们可以极大简化构建复杂网站和前端应用程序的过程。你可以在 CodePen 中尝试 `React`\
  \ 和 `Vue.js`：\n\n*   `React`: [`reactjs.org`](https://reactjs.org)\n*   `Vue.js`:\
  \ [`vuejs.org`](https://vuejs.org)\n*   CodePen 上的 `React`: [`codepen.io/topic/react/templates`](https://codepen.io/topic/react/templates)\n\
  *   CodePen 上的 `Vue.js`: [`codepen.io/topic/vue/templates`](https://codepen.io/topic/vue/templates)\n\
  \n## 测试\n\n对于程序员来说，一个本质工具是自动化测试框架。自动化测试旨在定期针对你的代码运行，以确认它符合你的预期。编写代码时的一个常见问题是添加新功能时，没有意识到该更改破坏了其他某些方面。通过编写良好的测试并定期运行它们，你可以识别出出现故障的时刻并修复它。\n\
  \nJavaScript 有大量的测试库和框架。在本书期间，最流行的之一是 `Jest`：可以在 [`jestjs.io`](https://jestjs.io)\
  \ 查看它。\n\n## 更多 JavaScript！\n\n如果你想深化你的 JavaScript 知识，有很多资源可供你使用。以下是一些获取途径的建议：\n\
  \n*   MDN JavaScript 门户：[`developer.mozilla.org/JavaScript`](https://developer.mozilla.org/JavaScript)\n\
  *   *Eloquent JavaScript* 第 3 版，Marijn Haverbeke 著（No Starch Press, 2018）\n*   *JavaScript:\
  \ The Definitive Guide* 第 7 版，David Flanagan 著（O’Reilly Media, 2020）\n\n## 其他语言\n\
  \n在此时，你可能决定拓宽你的编程知识，而不是深入研究 JavaScript。去尝试吧！你学习的每种语言都能让你对通用编程提供宝贵的见解，所以这实际上是提高 JavaScript\
  \ 水平的好方法。\n\n### TypeScript\n\n人们对 JavaScript 的问题之一是它的弱类型、动态类型，这允许值根据周围的代码被隐式转换为不同的数据类型。例如，如果另一个操作数是字符串，`+`\
  \ 运算符会将数字操作数转换为字符串；如果另一个操作数是数字，`-` 运算符会将字符串操作数转换为数字。\n\n\n\n\n\nTypeScript 语言正尝试为\
  \ JavaScript 添加静态类型。`Static typing`（静态类型）意味着某个特定类型的变量只能包含该类型的值，且类型之间的转换必须是显式的。TypeScript\
  \ 在语法上是 JavaScript 的超集，这意味着一个有效的 JavaScript 程序也是一个有效的 TypeScript 程序。可以使用 TypeScript\
  \ 编译器将 TypeScript 代码转换为 JavaScript。\n\n使用静态类型使得编写带有某些错误的代码变得不可能。例如，在 JavaScript\
  \ 中，你可能会从文本框中获取一个值，假设它是一个数字，并将其与另一个数字相加。遗憾的是，文本框中的任何值都会被视为字符串，因此另一个数字也会被隐式转换为字符串，最终你将得到两个字符串的拼接。TypeScript\
  \ 不允许这样做。它知道来自文本框的值是字符串，并强迫你决定是想将两个操作数都转换为字符串以便拼接，还是将两个操作数都转换为数字以便相加。\n\nTypeScript\
  \ 的缺点是，有时编写某些本应该可以运行的代码会变得困难。这有时被称为 `fighting the compiler`（与编译器作斗）。\n\n如果你想了解更多信息，这里有一些书籍和其他资源可以帮助你入门\
  \ TypeScript：\n\n*   TypeScript 手册：[`www.typescriptlang.org/docs/handbook/intro.html`](https://www.typescriptlang.org/docs/handbook/intro.html)\n\
  \n*   *Effective TypeScript*，Dan Vanderkam 著（O’Reilly Media, 2019）\n\n*   *Learning\
  \ TypeScript*，Josh Goldberg 著（O’Reilly Media, 2022）\n\n## Python\n\nPython 是一种脚本语言，类似于\
  \ JavaScript，但它有不同的设计哲学。该语言采用了“内置电池”（batteries included）的方法，这意味着它的标准库功能完备，包含了广泛的功能（相比之下，JavaScript\
  \ 的标准库非常有限）。与 JavaScript 一样，Python 是动态类型语言，因此同一个变量可以持有不同数据类型的值。但 JavaScript 是弱类型的，而\
  \ Python 是 `strongly typed`（强类型），这意味着它没有隐式强制转换。在语法上，Python 看起来非常不同，它使用缩进（这是强制的而非可选的）而不是大括号来定义嵌套的代码块。\n\
  \nPython 是 Web 服务器以及科学和数值编程的流行语言。如果你正在扩展自己的技能，它是一个很好的选择。以下书籍（与 *JavaScript Crash\
  \ Course* 为同一系列）是该语言的极佳介绍，它的项目突出了 Python 发挥优势的一些领域：\n\n*   *Python Crash Course*，第三版，Eric\
  \ Matthes 著（No Starch Press, 2023）\n\n## Rust\n\n我今天最兴奋的语言之一是 Rust。和 TypeScript\
  \ 一样，它是一种静态类型语言，但它比目前使用的大多数语言拥有更强大的类型系统。Rust 旨在取代旧语言 `C` 和 `C++` 来开发高性能代码。\n\n`C`\
  \ 和 `C++` 都是没有 `garbage collection` 的语言，垃圾回收是指告诉计算机哪些值和对象不再被使用以释放内存。相反，`C/C++` 程序员必须手动释放不再使用的数据——这个过程很容易出错并经常会导致错误。这些语言通常用于对性能敏感的环境，它们不使用垃圾回收，因为这会降低软件性能。Rust\
  \ 通过编译时 `borrow checker`（借用检查器）避免了这个问题，它会跟踪哪些对象正在被使用，以及被程序的哪些部分使用。\n\nRust 还被广泛用于编译\
  \ WebAssembly 的源语言，这是一项在浏览器中运行极其高效且高性能代码的激动新技术。这里是一些学习更多内容的资源：\n\n*   *The Rust\
  \ Programming Language*，第二版，Steve Klabnik 和 Carol Nichols 著（No Starch Press, 2023）\n\
  \n*   Rust and WebAssembly：[`rustwasm.github.io/docs/book/`](https://rustwasm.github.io/docs/book/)\n\
