  \ 更有趣</samp>\n在这个扩展的 HTML 中有两个新概念。首先，我们将部分文本包裹在 `strong` 元素中。该元素标记其内容为重要。默认情况下，浏览器会将\
  \ `strong` 元素的内容加粗。其次，我们为两个 `p` 元素添加了 `class` 属性。`class` 属性类似于 `id` 属性，但 ID 应该是唯一的，而你可以将相同的类名应用到多个元素。当我们想要以相同的方式处理一组元素时使用类——例如，高亮某些段落的文本。\n\
  > <samp class=\"SANS_Dogma_OT_Bold_B_21\">注意</samp>\n*strong 元素被称为内联元素，因为你可以将它应用于行的一部分，而不是由它定义单独的一行。*\n\
  刷新页面，你应该能看到新的文本。标题中的单词 *JavaScript* 看起来没有任何不同，因为 `h1` 元素默认已经是加粗样式了，但由于 `strong`\
  \ 元素的作用，三个 *paragraph* 单词都会加粗。\n\n\n\nh1 {\n  font-style: italic;\n\n  font-size:\
  \ 48px;\n\n  color: blue;\n\n  font-size: 24px;\n\n  background-color: yellow;\n\
  \n  background-color: orange;\n```\n`列表 7-9：在 style.css 中添加更多规则集`\n这段 CSS 代码使用了几种不同类型的选择器。第一个新选择器\
  \ `#main-heading` 是一个 ID 选择器。**ID 选择器**用于选取具有特定 `id` 属性的 HTML 元素。它使用哈希标记后跟你想要匹配的\
  \ ID，因此 `#main-heading` 匹配 `id=\"main-heading\"` 的元素。在这里，我们使用选择器让我们的主标题比 `h1` 元素的默认尺寸更大。注意，CSS\
  \ 中的数字尺寸需要一个单位；在这种情况下，我们使用的是 `px`，表示像素。\n带有 `strong` 选择器的规则集匹配任何 `strong` 元素并将其设置为蓝色。`p\
  \ strong` 选择器更有趣。它是一个**后代选择器**，只有当元素是某些 `p` 元素的后代时才会匹配。在我们的示例中，`p strong` 意味着“匹配任何作为\
  \ `p` 元素后代的 `strong` 元素”。该选择器会调整 `p` 元素内部 `strong` 文本的大小，但忽略 `p` 元素外的文本。如果你愿意，可以将多个后代选择器链联起来。例如\
  \ `html body strong` 是有效的后代选择器（尽管有点多余，因为所有页面内容都是 `html` 的后代），这将匹配任何作为 `body` 元素后代的\
  \ `strong` 元素。\n接下来是针对 `.highlight` 的规则集，它是一个**类选择器**。这种选择器匹配所有具有给定 `class` 属性的元素。类名在点之后，所以\
  \ `.highlight` 将匹配任何 `class=\"highlight\"` 的元素。在这里，我们使用类选择器设置黄色背景，创建高亮效果。最后，`.highlight\
  \ strong` 将类选择器与后代选择器相结合。它意味着“匹配任何作为带有 `highlight` 类的元素后代的 `strong` 元素”。\n任何当你有一个类选择器或\
  \ ID 选择器时，都可以在它前面包含一个元素名称，不需要空格。例如，`p.highlight` 意味着“选择任何具有 highlight 类的 p 元素”，而\
  \ `.highlight` 意味着“选择任何具有 highlight 类的元素”。同样，`h1#main-heading` 匹配 `id=\"main-heading\"\
  ` 的 `h1` 元素。在这种情况下，元素名称是多余的，因为 ID 是唯一的，但你可能想包含它来提醒读者 `#main-heading` 是一个 h1 元素。你还可以将\
  \ CSS 文件应用于两个单独的 HTML 文件，其中一个具有 `id=\"main-heading\"`，在这种情况下 `h1#main-heading` 只会匹配页面中的一个。\n\
  刷新浏览器中的页面，你应该看到一种杂乱的样式，类似于图 7-6。\n![](img/Figure_7-6.png)\n`图 7-6：我们的 CSS 实验结果`\n\
  这个页面不会获得设计奖，但它有助于我们了解各种 CSS 选择器是如何工作的。注意，例如，所有 `strong` 元素（使用 `strong` 选择）都变成了蓝色，但只有\
  \ `p` 元素内部的 `strong` 元素（使用 `p strong` 选择）尺寸设置为 24 像素。如果这种尺寸应用于*所有* `strong` 元素，顶部的\
  \ `JavaScript` 单词将会变小。同时，分配给 `highlight` 类的第一和第三段落具有黄色背景（使用 `.highlight` 选择），除了具有橙色背景的单词（使用\
  \ `.highlight strong`）。第二个段不是 highlight 类的一部分，没有额外的背景颜色。\n### 在 JavaScript 中使用 CSS\
  \ 选择器\n正如我之前提到的，某些 DOM API 方法依赖 CSS 选择器语法从 DOM 中选取元素进行操作。例如，`document.querySelectorAll`\
  \ 方法接收一个包含 CSS 选择器的字符串，并返回一个包含所有匹配该选择器的元素的数组对象。要获取网页中所有带有 `highlight` 类的元素，你会使用\
  \ `document.querySelectorAll(\".highlight\");`。\n在浏览器中打开 `index.html`，打开控制台并输入以下内容：\n\
  ```\nNodeList(2) [p.highlight, p.highlight]\n\n\n\n事件是浏览器告诉 JavaScript DOM 中发生了某些情况的方式。这就像是每当鼠标在窗口上移动或按下某个键时，浏览器都在大喊道：“嘿，鼠标移动了！按键被按下了！”这些大喊一直在发生，但只有当你显式地告诉\
