  \ `index.html`，你应该就能看到标题的样式。这样的规则集包含两个部分：一个 `selector`（选择器，在本例中为 h1）和一个 `declarations`（声明）。选择器告诉浏览器对哪些元素进行操作，声明则说明对它们要做什么。选择器\
  \ `match`（匹配）元素。也就是说，选择器是一种模式，浏览器会检查页面上的哪些元素匹配该模式。在这种情况下，h1 是匹配所有 h1 元素的选择器。每个声明由一个属性名后跟一个冒号、然后是属性值和一个分号组成。例如，color\
  \ 是一个属性名，而 `red` 是该属性的值。\n### 选择器\n我们在列表 7-7 中的选择器针对所有特定类型的元素，但 CSS 还允许你创建更具体的选择器。为了利用这些选择器，我们首先必须向\
