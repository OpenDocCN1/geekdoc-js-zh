  ### 使用路径绘制其他形状\n除了矩形外，所有其他形状都是以*路径*（paths）的形式在画布上绘制的。路径是一系列由直线或曲线连接而成的点，然后进行描边或填充。作为示例，我们将绘制一个红色三角形。用代码列表\
  \ 9-5 中的代码替换 `script.js` 的内容。\n```\nlet ctx = canvas.getContext(\"2d\");\nctx.beginPath();\n\
  ctx.lineTo(150, 15);\nctx.lineTo(100, 100);\n```\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >代码列表 9-5：使用路径方法绘制三角形</samp>\n绘制路径需要三个步骤。首先，你使用 `beginPath` 声明要开始绘制新路径。然后，使用各种方法定义路径的位置。最后，使用\
  \ `fill` 或 `stroke` 来填充或描边路径。\n在此例中，我们使用两个方法来定义路径：`moveTo` 和 `lineTo`。`moveTo` 方法将笔移动到画布上由\
  \ x 和 y 坐标指定的点，但不绘制线条。我们使用该方法定义路径的起点 `(100, 100)`，这将是三角形的左下角。`lineTo` 方法与 `moveTo`\
  \ 相同，但它会在移动的同时画出线条。因此，`lineTo(150, 15)` 从 `(100, 100)` 绘制到 `(150, 15)`。最后，我们使用 `fill`\
  \ 方法填充形状。当你刷新页面时，你应该看到一个红色三角形，如图图 9-4 所示。\n![](img/Figure_9-4.png)\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">图 9-4：绘制填充三角形</samp>\n绘制圆形遵循类似的模式，但使用 `arc`\
  \ 方法代替 `moveTo` 和 `lineTo`。`arc` 方法绘制圆弧，即圆周的一部分。你可以使用 `arc` 方法产生任何长度的弧，但在这里我们用它产生一个完整的圆。\n\
