  \ \"16n\", time);\n  }, \"2n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\n列表 12-20：添加回响\n\n（省略）\n\n现在我们已经设置好了鼓声，如果能有一个更简单的方法来触发它们就很好。理想情况下，我们希望通过编写类似下面的代码来创建一个鼓点：\n\
  \n\n\n\n\n```\nkick:  x…x…\nsnare: ..x…x.\nhiHat: xxxxxxxx\n```\n\n然后我们可以让 JavaScript\
  \ 来工作，将该记法转换为 `Tone.js` 可以理解的代码。在这里，每个 `x` 代表一个音符，每个 `.` 代表一个静音，每一列代表一个八分音符。例如，在第一个八分音符中，底鼓和\
  \ Hi 镕同时响；在第二个中只有 Hi 镕在响；在第三个中小军鼓和 Hi 镕同时响，以此此类推。这里显示的模式与我们在之前的章节中构建的鼓点节奏匹配。\n\n\
  为了实现这一点，我们将编写一个辅助函数，将由 `x` 和 `.` 组成的字符串转换为 `Tone.Sequence` 传输辅助函数可以使用的值数组。请记住 `Tone.Sequence`\
  \ 接收音符名称数组并按顺序重复播放它们，其中 `null` 用于休止。我们的函数应该将 `.` 转换为 `null`，而保持 `x` 不变。\n\n> **注意**\n\
  \n> *由于鼓的没有没有音符名称，任何字符串实际上对 `Tone.Sequence` 都可以代表一次击击（我们只是为了方便使用了 x）。关键在于它不是 `null`\
  \ 即可。*\n\n[Listing 12-21] 显示了该函数的定义。将其添加到你的 `script.js` 文件中，放在现有鼓代码之前。\n\n```javascript\n\
  --snip--\n  Tone.start();\n\n  // 将字符串转换为音符或 null 的数组。\n  // 字符串中的点变成数组中的 null 并且保持静音。\n\
  \  function mkSequence(pattern) {\n    return pattern.split(\" \").map(value =>\
  \ {\n      if (value == \".\") {\n        return null;\n      } else {\n       \
