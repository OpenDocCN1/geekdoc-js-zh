  ```\n\n**Listing 12-21：`mkSequence` 辅助函数**\n\n`mkSequence` 函数接收一个如 `\"x…x…\"` 这样的字符串，并将其转换为字符串和\
  \ `null` 组成的数组，例如 `[\"x\", null, null, null, \"x\", null, null, null]`，这是 `Tone.Sequence`\
  \ 需要的格式。它使用 `split` 方法将字符串拆分为单个字符数组，并使用数组的 `map` 方法通过为每个字符调用函数创建一个新数组。如果字符是 `\"\
  .\"`，则在在新数组中将其替换为 `null`。否则，它将原样传递该字符。\n\n接下来，我们将创建传递给此函数的字符串，如 [Listing 12-22]\
  \ 所示。将此代码添加到 `mkSequence` 函数定义之后。\n\n```javascript\n--snip--\n  }\n\n  let drumPattern\
