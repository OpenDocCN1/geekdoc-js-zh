  \ 和 `PADDLE_HEIGHT` 常量。\n\n右挡板的绘制稍微复杂一点：为了获取挡板左上角的 `x` 坐标，我们需要用画布宽度减去挡板宽度以及挡板相对于边缘的偏移量。（注：原文此处存在大量重复段落，翻译已按逻辑去重）。\n\
