    \n本书印刷于无酸纸上。\n\ndomestic 2 3 4 5 6 7 8 9 0 QPD/QPD 0 9 8 7 6 5 4 3\ninternational\
    \ 1 2 3 4 5 6 7 8 9 0 QPD/QPD 0 9 8 7 6 5 4 3 2\n\nISBN 0-07-255610-2\n\n出版人：George\
    \ Werthman\n赞助编辑：Dan Silverburg\n开发编辑：Sarah Wood\n市场营销与销售经理：Paul Murphy\n媒体技术高级制作人：David\
    \ Barrick\n高级项目经理：Christine A. Vaughan\n生产主管：Gina Hangos\n设计经理：Laurie J. Entringer\n\
    高级补充资料制作人：Rose M. Range\n高级数字内容专家：Brian Nacik\n封面插图：Asylum Studios\n内页设计：待定\n\
    字体：10/12 Times Roman\n排版：Shepherd Incorporated\n印刷：Quebecor World Dubuque Inc.\n\
    \n美国国会图书馆控制号：2002026555\n\nhttp://www.mhhe.com\n\n## 目录\n\n第 1 节：HTML 模板和 DOCTYPE\
    \ DTD 1\n\n第 2 节：HTML 元素 3\n\n第 3 节：样式属性和值 23\n\n第 4 节：CSS 伪类和伪元素 39\n\n第 5 节：常用字符集\
    \ 43\n\n第 6 节：XHTML 模块 51\n\n第 7 节：JavaScript 对象 55\n\n第 8 节：浏览器安全颜色\n\n# 第一节\n\
    \n## HTML 模板\n\n» 必需元素的 HTML 模板\n\n```\n</body>\n</html>\n```\n\n## DOCTYPE DTD\n\
    \n### HTML 4.01 数据类型定义\n\n- 严格型\n  `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
    \n  \"http://www.w3.org/TR/html4/strict.dtd\">`\n- 过渡型\n  `<!DOCTYPE HTML PUBLIC\
    \ \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n  \"http://www.w3.org/TR/html4/loose.dtd\"\
    >`\n- 框架集型\n  `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Frameset//EN\"\n\
    \  \"http://www.w3.org/TR/html4/frameset.dtd\">`\n\n### XHTML 1.0 数据类型定义\n\n-\
    \ 严格型\n  `<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >`\n- 过渡型\n  `<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
    \n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">`\n- 框架集型\n  `<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd\"\
    >`\n\n# 第二节\n\n## HTML 元素\n\n*键盘事件 = onkeydown、onkeypress 和 onkeyup\n**指针事件 =\
    \ onclick、ondblclick、onmousedown、onmousemove、onmouseout、onmouseover 和 onmouseup\n\
    \n| HTML 元素 | 描述 | 属性 | XML 要求 | 特别说明 | 参考资料 |\n| :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| <!-- --> | 注释 | | | 注释仅在 HTML 代码中显示，永远不会作为网页的一部分显示。 | 第 2 章第\
    \ 38 页及图 2.2 |\n| 示例：<!-- Author: T. Gottleber --> | | | | | |\n| <a></a> | 提供数据以链接图像、声音、页面内的另一个区域，或链接到另一个网页\
    \ | accesskey、charset、class、cords、dir、键盘事件*、href、hreftlang、lang、id、name、onblur、onfocus、指针事件**、rel\
    \ | | | 第 3 章第 59 页及图 3.3 |\n| 示例：<a href=\"http://site.com\">用作链接的文字</a> | |\
    \ | | | |\n\n| HTML 元素 | 描述 | 属性 | XML 要求 | 特别说明 | 参考资料 |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| <a></a> 续 | | rev、shape、style、tabindex、target、title、type\
    \ | | | |\n| <abbr></abbr> 示例：<abbr title=\"World Wide Web Consortium\"> W3C </abbr>\
    \ | 缩写，如 WWW 或 URL | class、dir、id、键盘事件*、lang、指针事件**、style、title | | W3C 建议使用 title\
    \ 属性来标识缩写的完整拼写。 | 第 5 章第 124 页及图 5.8 |\n| <acronym></acronym> 示例：<acronym title=\"\
    Beginners All-Purpose Symbolic Code\"> BASIC </acronym> | 首字母缩略词，如 NASA 或 FBI\
    \ | class、dir、id、键盘事件*、lang、指针事件**、style、title | | title 属性用于标识首字母缩略词的完整拼写。 |\
    \ 第 5 章第 124 页及图 5.8 |\n| <address></address> 示例：我们可以在 <address> 4606 Briarwood\
    \ </address> 找到 | 邮寄地址或电子邮件地址 | class、dir、id、键盘事件*、lang、指针事件**、style、title | |\
    \ 末尾自动添加换行 | 第 5 章第 123 页及图 5.8 |\n| <applet></applet> 示例：<applet code=\"clock.class\"\
    \ width=\"200\" height=\"400\"> | 启动 Java 小程序的执行 | align、alt、archive、class、code、codebase、height、hspace、id、name、object、style、title、vspace、width\
    \ | | 已弃用；请改用 <object></object>。 | 第 9 章第 243 页及图 9.2 |\n| <area /> 示例：<area shape=\"\
    poly\" coords=\"372,131,376,154, 380,156,380,153,380,139, 378,134\" alt=\"Map\"\
    \ href=\"doc1.htm\" /> | 定义客户端图像映射中一个区域的坐标和链接 | accesskey、alt、class、coords、href、id、键盘事件*\
    \ | 要求使用 <area /> 闭合标签 | coords 属性以及 href 或 nohref 属性之一是必需的。 | 第 14 章第 414 页及图\
    \ 14.1 |\n\n| HTML 元素 | 描述 | 属性 | XML 要求 | 特别说明 | 参考资料 |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| <area /> 续 | | lang、nohref、onblur、onfocus、指针事件**、shape、style、tabindex、target、title\
    \ | | | |\n| <b></b> | 较粗字体 | class、dir、id、键盘事件*、lang、指针事件**、style、title | | |\
    \ 第 5 章第 121 页及图 5.7 |\n| <base /> | 显式指定文档的基础 URL。相对路径引用则使用基础 URL 作为参考点。 | href、target\
    \ | 要求使用 <base /> 闭合标签 | 必须放置在 <head> 容器内 | 第 10 章第 285 页及图 10.14 |\n| <bdo></bdo>\
    \ | 建立浏览器双向算法如何显示和打印文本 | dir、lang | | dir 属性是必需的；主要用于 Unicode 格式化 | |\n| <big></big>\
    \ | 放大字形大小，默认等于 3。每次应用都会增加字形大小，直到相对大小等于 7。 | class、dir、id、键盘事件*、lang、指针事件**、style、title\
    \ | | 此标签可以嵌套在自身内部。例如，以下语法将相对大小增加两次：<big><big>text</big></big> | 第 5 章第 121 页及图\
    \ 5.7 |\n| <blockquote></blockquote> | 长引用，通常超过 40 个单词 | class、dir、id、键盘事件*、lang、指针事件**、style、title\
    \ | | 此元素会被缩进并被视为块级内容。建议使用 cite 和 datetime 属性来标识来源。 | 第 5 章第 125 页及图 5.9 |\n\n\
    | HTML 元素 | 描述 | 属性 | XML 要求 | 特别说明 | 参考资料 |\n| --- | --- | --- | --- | --- |\
    \ --- |\n| `<body></body>` 示例：`<body style=\"background-color: #CCCCCC;\">` |\
    \ 标识网页的内容 | alink、background、bgcolor、class、dir、id、键盘事件*、lang、link、onload、onunload、指针事件**、style、text、title、vlink\
    \ | | | 第 2 章第 34 页及图 2.2 |\n| `<br />` 示例：`<br style=\"clear: left;\">` | 创建换行\
    \ | class、clear、id、style、title | 要求使用 `<br />` 闭合标签 | | 第 2 章第 43 页及图 2.7 |\n\
    | `<button></button>` 示例：`<button name=\"reset\" type=\"reset\" value=\"Clear\"\
    >` | 表示所包含的数据应被格式化并作为按钮控件运行 | class、dir、disabled、id、键盘事件*、lang、name、onblur、onfocus、onreset、onsubmit、指针事件**、style、tabindex、title、type、value\
    \ | | | 第 11 章第 324 页及图 11.20 |\n| `<caption></caption>` `<table>` `<caption>`\
    \ 关于表格的信息 `</caption>` `<tr>` `<th>标题</th>` `<td>数据</td>` `</tr>` `</table>` |\
    \ 定义表格标题 | align、class、dir、id、键盘事件*、lang、指针事件**、style、title | | 仅允许紧跟在 `<table>`\
    \ 起始标签之后 | 第 7 章第 193 页及图 7.16 |\n"
