- md: "## Even More Excellent HTML Reference Guide\n\nTimothy T. Gottleber\nNorth\
    \ Lake College\nIrving, Texas\n\nTimothy N. Trainor\nMuskegon Community College\n\
    Muskegon, Michigan\n\nBoston Burr Ridge, IL Dubuque, IA Madison, WI New York San\
    \ Francisco St. Louis\nBangkok Bogotá Caracas Kuala Lumpur Lisbon London Madrid\
    \ Mexico City\nMilan Montreal New Delhi Santiago Seoul Singapore Sydney Taipei\
    \ Toronto\n\n## McGraw-Hill Higher Education\n\nA Division of The McGraw-Hill\
    \ Companies\n\n## EVEN MORE EXCELLENT HTML REFERENCE GUIDE\n\nPublished by McGraw-Hill/Irwin,\
    \ a business unit of The McGraw-Hill Companies, Inc., 1221 Avenue of the Americas,\
    \ New York, NY, 10020. Copyright © 2003, by The McGraw-Hill Companies, Inc. All\
    \ rights reserved. No part of this publication may be reproduced or distributed\
    \ in any form or by any means, or stored in a database or retrieval system, without\
    \ the prior written consent of The McGraw-Hill Companies, Inc., including, but\
    \ not limited to, in any network or other electronic storage or transmission,\
    \ or broadcast for distance learning. Some ancillaries, including electronic and\
    \ print components, may not be available to customers outside the United States.\n\
    \nThis book is printed on acid-free paper.\n\ndomestic 2 3 4 5 6 7 8 9 0 QPD/QPD\
    \ 0 9 8 7 6 5 4 3\ninternational 1 2 3 4 5 6 7 8 9 0 QPD/QPD 0 9 8 7 6 5 4 3 2\n\
    \nISBN 0-07-255610-2\n\nPublisher: George Werthman\nSponsoring editor: Dan Silverburg\n\
    Developmental editor: Sarah Wood\nManager, Marketing and Sales: Paul Murphy\n\
    Senior producer, Media technology: David Barrick\nSenior project manager: Christine\
    \ A. Vaughan\nProduction supervisor: Gina Hangos\nDesign manager: Laurie J. Entringer\n\
    Senior supplement producer: Rose M. Range\nSenior digital content specialist:\
    \ Brian Nacik\nCover illustration: Asylum Studios\nInterior design: tbd\nTypeface:\
    \ 10/12 Times New Roman\nCompositor: Shepherd Incorporated\nPrinter: Quebecor\
    \ World Dubuque Inc.\n\nLibrary of Congress Control Number: 2002026555\n\nhttp://www.mhhe.com\n\
    \n## Table of Contents\n\nSection 1: HTML Template and DOCTYPE DTDs 1\n\nSection\
    \ 2: HTML Elements 3\n\nSection 3: Style Properties and Values 23\n\nSection 4:\
    \ CSS Pseudo Classes and Elements 39\n\nSection 5: Common Character Sets 43\n\n\
    Section 6: XHTML Modules 51\n\nSection 7: JavaScript Objects 55\n\nSection 8:\
    \ Browser-Safe Colors\n\n# Section One\n\n## HTML Template\n\n» HTML TEMPLATE\
    \ OF REQUIRED ELEMENTS\n\n```\n</body>\n</html>\n```\n\n## DOCTYPE DTDs\n\n###\
    \ HTML 4.01 DATA TYPE DEFINITIONS\n\n- Strict\n  `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
    \ HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\">`\n- Transitional\n\
    \  `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n  \"http://www.w3.org/TR/html4/loose.dtd\"\
    >`\n- Frameset\n  `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Frameset//EN\"\
    \n  \"http://www.w3.org/TR/html4/frameset.dtd\">`\n\n### XHTML 1.0 DATA TYPE DEFINITIONS\n\
    \n- Strict\n  `<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n  \"\
    http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">`\n- Transitional\n  `<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >`\n- Frameset\n  `<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Frameset//EN\"\
    \n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd\">`\n\n# Section Two\n\
    \n## HTML Elements\n\n*Keyboard events = onkeydown, onkeypress, and onkeyup\n\
    **Pointer events = onclick, ondblclick, onmousedown, onmousemove, onmouseout,\
    \ onmouseover, and onmouseup\n\n| HTML Element | Description | Attributes | XML\
    \ Requirements | Special Notes | References |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| <!-- --> | Comment | | | Comments are only displayed within the\
    \ HTML code and are never shown as part of the Web page. | Chapter 2 page 38 and\
    \ Figure 2.2 |\n| Example: <!-- Author: T. Gottleber --> | | | | | |\n| <a></a>\
    \ | Provides data to link images, sounds, another area within the page, or to\
    \ another Web page | accesskey, charset, class, cords, dir, keyboard events*,\
    \ href, hreftlang, lang, id, name, onblur, onfocus, pointer events**, rel | |\
    \ | Chapter 3 page 59 and Figure 3.3 |\n| Example: <a href=\"http://site.com\"\
    >word(s) used for link</a> | | | | | |\n\n| HTML Element | Description | Attributes\
    \ | XML Requirements | Special Notes | References |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| <a></a> con't. | | rev, shape, style, tabindex, target, title,\
    \ type | | | |\n| <abbr></abbr> Example: <abbr title=\"World Wide Web Consortium\"\
    > W3C </abbr> | Abbreviation like WWW or URL | class, dir, id, keyboard events*,\
    \ lang, pointer events**, style, title | | The W3C recommends using the title\
    \ attribute to identify the complete spelling of the abbreviation. | Chapter 5\
    \ page 124 and Figure 5.8 |\n| <acronym></acronym> Example: <acronym title=\"\
    Beginners All-Purpose Symbolic Code\"> BASIC </acronym> | Acronym like NASA or\
    \ FBI | class, dir, id, keyboard events*, lang, pointer events**, style, title\
    \ | | The title attribute is used to identify the complete spelling of the acronym.\
    \ | Chapter 5 page 124 and Figure 5.8 |\n| <address></address> Example: We can\
    \ be found at <address> 4606 Briarwood </address> | Postal or email address |\
    \ class, dir, id, keyboard events*, lang, pointer events**, style, title | | Line\
    \ break automatically added to the end | Chapter 5 page 123 and Figure 5.8 |\n\
    | <applet></applet> Example: <applet code=\"clock.class\" width=\"200\" height=\"\
    400\"> | Initiates the execution of a Java applet | align, alt, archive, class,\
    \ code, codebase, height, hspace, id, name, object, style, title, vspace, width\
    \ | | Deprecated; use <object></object> instead. | Chapter 9 page 243 and Figure\
    \ 9.2 |\n| <area /> Example: <area shape=\"poly\" coords=\"372,131,376,154, 380,156,380,153,380,139,\
    \ 378,134\" alt=\"Map\" href=\"doc1.htm\" /> | Defines the coordinates and link\
    \ for one region of a client-side image map | accesskey, alt, class, coords, href,\
    \ id, keyboard events* | Requires closing tag using <area /> | The coords, and\
    \ either the href or nohref attribute, are required. | Chapter 14 page 414 and\
    \ Figure 14.1 |\n\n| HTML Element | Description | Attributes | XML Requirements\
    \ | Special Notes | References |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | <area /> con't. | | lang, nohref, onblur, onfocus, pointer events**, shape,\
    \ style, tabindex, target, title | | | |\n| <b></b> | Heavier typeface | class,\
    \ dir, id, keyboard events*, lang, pointer events**, style, title | | | Chapter\
    \ 5 page 121 and Figure 5.7 |\n| <base /> | Specifies a document's base URL explicitly.\
    \ Relative path references then use the base URL as a reference point. | href,\
    \ target | Requires closing tag using <base /> | Must be placed within the <head>\
    \ container | Chapter 10 page 285 and Figure 10.14 |\n| <bdo></bdo> | Establishes\
    \ how the browser's bidirectional algorithm displays and prints text | dir, lang\
    \ | | The dir attribute is required; used primarily with Unicode formatting |\
    \ |\n| <big></big> | Enlarges glyph size with the default equal to 3. Each application\
    \ increases glyph size until relative size is equal to 7. | class, dir, id, keyboard\
    \ events*, lang, pointer events**, style, title | | This tag can be nested inside\
    \ itself. For example, this syntax increases the relative size twice: <big><big>text</big></big>\
    \ | Chapter 5 page 121 and Figure 5.7 |\n| <blockquote></blockquote> | Long quote,\
    \ usually longer than 40 words | class, dir, id, keyboard events*, lang, pointer\
    \ events**, style, title | | This element is indented and considered block-level\
    \ content. It is recommended that the cite and datetime attributes be used to\
    \ identify source. | Chapter 5 page 125 and Figure 5.9 |\n\n| HTML Element | Description\
    \ | Attributes | XML Requirements | Special Notes | References |\n| --- | ---\
    \ | --- | --- | --- | --- |\n| `<body></body>` Example: `<body style=\"background-color:\
    \ #CCCCCC;\">` | Identifies the contents of the Web page | alink, background,\
    \ bgcolor, class, dir, id, keyboard events*, lang, link, onload, onunload, pointer\
    \ events**, style, text, title, vlink | | | Chapter 2 page 34 and Figure 2.2 |\n\
    | `<br />` Example: `<br style=\"clear: left;\">` | Creates a line break | class,\
    \ clear, id, style, title | Requires closing tag using `<br />` | | Chapter 2\
    \ page 43 and Figure 2.7 |\n| `<button></button>` Example: `<button name=\"reset\"\
    \ type=\"reset\" value=\"Clear\">` | Indicates that the contained data should\
    \ be formatted and function as a button control | class, dir, disabled, id, keyboard\
    \ events*, lang, name, onblur, onfocus, onreset, onsubmit, pointer events**, style,\
    \ tabindex, title, type, value | | | Chapter 11 page 324 and Figure 11.20 |\n\
    | `<caption></caption>` `<table>` `<caption>` Info about table `</caption>` `<tr>`\
    \ `<th>Header</th>` `<td>data</td>` `</tr>` `</table>` | Defines a table caption\
    \ | align, class, dir, id, keyboard events*, lang, pointer events**, style, title\
    \ | | Permitted only immediately after the `<table>` start tag | Chapter 7 page\
    \ 193 and Figure 7.16 |"
  mdcn: "\n## 更加出色的 HTML 参考指南\n\nTimothy T. Gottleber\nNorth Lake College\nIrving,\
    \ Texas\n\nTimothy N. Trainor\nMuskegon Community College\nMuskegon, Michigan\n\
    \nBoston Burr Ridge, IL Dubuque, IA Madison, WI New York San Francisco St. Louis\n\
