    ## 第五节


    ## 常用字符集


    下表列出了大多数浏览器都能识别的一组常用字符。屏幕上显示的字形列在“符号”一栏下。数值必须始终以 `&#` 开头，并以分号结尾。三位数字值及相关名称（如果可用）可以在
    HTML 文档中代替输入的字符。这些字符代表 Latin-1 字符集，也称为国际标准化组织代码 ISO 8859-1。此外，这是 HTML 4.0 规范中标识的
    Unicode 字符 (ISO 10646-1) 的基础字符集。HTML 的 Latin 1 或 Unicode 字符集中不使用数字值 128–159。


