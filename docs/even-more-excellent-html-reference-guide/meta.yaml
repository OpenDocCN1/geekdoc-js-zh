  md: '# Section Five


    # Common Character Set


    The following table presents a common set of characters that are recognized by
    most browsers. The glyph that appears on the screen is listed under Symbol. The
    numeric value must always be preceded by an &# and end with a semicolon. The three-digit
    numeric values and related names, when available, can appear in an HTML document
    instead of the typed character. These characters represent the Latin-1 character
    set that is also known as the International Standards Organization code ISO 8859-1.
    Furthermore, this is the base character set for the Unicode characters (ISO 10646-1)
    identified in the HTML 4.0 specifications. The numeric values 128–159 are not
    used in the Latin 1 or Unicode character sets of HTML.


    | LATIN 1 (ISO 8859-1) |  |  |  |

    | --- | --- | --- | --- |

    | Numeric Value | Symbol | Name | Description |

    | &#009; |  |  | Horizontal tab |

    | &#010; |  |  | Line feed |

    | &#013; |  |  | Carriage return |

    | &#032; |  |  | Space |

    | &#033; | ! |  | Exclamation point |

    | &#034; | " | &quot; | Quotation mark |

    | &#035; | # |  | Hash mark |

    | &#036; | $ |  | Dollar sign |'
