    ## CSS Pseudo Classes and Elements


    | Class or Element | Description | Special Notes | References |

    |---|---|---|---|

    | :active (class)<br>Example:<br>`a:active {font-weight: bold;}`<br>`<a href="demo.html">Demo</a>`
    | Applies when an element is being activated by the user | In the example, the
    active text is displayed in a bold font. | Chapter 12 page 367 and Figure 12.17
    |

    | :after (element)<br>Example:<br>`h1:after {content: url("logo.gif"); }`<br>`<h1>Store
    Name''s Web Site</h1>` | Inserts generated content after the assigned element''s
    content | In the example, the store''s logo is displayed after all level-1 headings.
    | Chapter 12 page 367 |

    | :before (element)<br>Example:<br>`h1:before {content: url("logo.gif"); }`<br>`<h1>Store
    Name''s Web Site</h1>` | Inserts generated content before the assigned element''s
    content | In the example, the store''s logo is displayed before all level-1 headings.
    | Chapter 12 page 368 and Figure 12.16 |

    | :first-child (class)<br><br>Example:<br>div > p:first-child { font-style: italic;
    }<br><br><div><br><p>first child applies</p><br><p>does not apply</p><br></div>
    | Applies to the assigned element''s first occurrence in an associated element
    | The > symbol is used to identify the assigned element. In the example, <div>
    is the associated element assigned to the <p> element. | Chapter 12 page 367 |

    | :first-line (element)<br><br>Example:<br>p:first-line {font-style: italic; }<br><br><p>Some
    of this is displayed in italics.</p> | Applies special styles to the first formatted
    line of the assigned element | The :first-line pseudo-element can be attached
    only to a block-level element. | Chapter 12 page 367 |

    | :first-letter (element)<br><br>Example:<br>p:first-letter {font-weight: bold;
    }<br><br><p>The first "T" is in bold.</p> | Used for "initial caps" and "drop
    caps" where the first glyph in a string of text is independently formatted | These
    properties apply to .first-letter - font properties, color properties, background
