- fmt: "\n### 3. The `options` object (see later).\n\nWe look at the `options` object\
    \ on the following page.\n\n```\n{\n  indexAxis: 'y',\n  scales: {\n    x: {\n\
    \      title: {\n        display: true,\n        text: 'Number of applications',\n\
    \        color: '#eee' ①\n      },\n      ticks: {\n        color: '#ccc' ②\n\
    \      },\n      grid: {\n        color: '#555' ③\n      }\n    },\n    y: {\n\
    \      ticks: {\n        color: '#ccc' ②\n      },\n      grid: {\n        color:\
    \ '#333' ③\n      }\n    }\n  },\n  plugins: {\n    title: {\n      text: 'Number\
    \ of planning applications (by technology) 1990-2022',\n      color: '#ccc' ④\n\
    \    }\n  }\n}\n```\nListing 21. `chartjs-various/main.js`\n\n1.  `①` Set the\
    \ x-axis title to light grey so it shows up against the dark background.\n2. \
    \ `②` Set the axis ticks to light grey so they show up against the dark background.\n\
    3.  `③` Set the grid lines to light grey so they show up against the dark background.\n\
    4.  `④` Set the chart title to light grey so it shows up against the dark background.\n\
    \n## 4.4. Chart 3 (Multi-line chart)\n\nChart 3 is a multi-line chart. For each\
    \ technology type a line shows the number of planning applications over time.\
    \ The x-axis represents year and the y-axis represents the number of applications.\n\
    \n![chartjs styled 3](images/chartjs-styled-3.png)\n\nFigure 22. Multi-line chart\n\
    \nThe function `drawChart3` draws this chart. The chart itself is similar to previous\
    \ ones. However the challenge is transforming the REPD data into an array of series.\n\
    \nWe use a helper function `getMultiSeriesChartData` (which is defined near the\
    \ top of `main.js`) that takes three arguments:\n\n1.  The REPD data array.\n\
    2.  The `data` property that defines the names of each series.\n3.  The `data`\
    \ property that defines the axis labels.\n\nFor this chart, where each series\
    \ is a technology and the x-axis represents year submitted we call:\n\n```\ngetMultiSeriesChartData(data,\
    \ 'technology', 'yearSubmitted');\n```\n\nThis returns an object that looks like:\n\
    \n```\n{\n  labels: [1990, 1991, 1992, ... 2020, 2021, 2022], ①\n  datasets: [\
    \ ②\n    {\n      label: \"Advanced Conversion Technologies\",\n      data: [0,\
    \ 0, 0, ... 0, 0, 0] ③\n    },\n    {\n      label: \"Anaerobic Digestion\",\n\
    \      data: [0, 0, 0, ... 10, 17, 22] ③\n    }\n    ,\n    ...\n  ]\n}\n```\n\
    \n1.  `①` Each value in `labels` represents a name along the main axis.\n2.  `②`\
    \ Each object in `datasets` represents a series for a particular technology type.\n\
    3.  `③` The values in the `data` array of a series are the number of planning\
    \ applications for the given technology type and corresponding year. For instance\
    \ for Anaerobic Digestion there are 10 planning applications from 2020, 17 from\
    \ 2021 and 22 from 2022. If the chart’s type is `line` this data results in a\
    \ multi-line chart where the years appear along the main axis and each technology\
    \ type is represented by a line.\n\nWe assign the output of `getMultiSeriesChartData`\
    \ to `chartData` and use it as the value of the `data` property in the Chart.js\
    \ configuration object:\n\n```\nfunction drawChart3(data) {\n  let chartData =\
    \ getMultiSeriesChartData(data, 'technology', 'yearSubmitted'); ①\n\n  ...\n\n\
    \  const myChart = new Chart('chart-3', {\n    type: 'line',\n    data: chartData,\
    \ ②\n    options: { ... }\n  });\n\n  ...\n}\n```\nListing 22. `chartjs-various/main.js`\n\
    \n1.  `①` Assign the return value of `getMultiSeriesChartData` to `chartData`.\n\
    2.  `②` Set the chart’s `data` property to `chartData`.\n\nFor the purposes of\
    \ this book you don’t need to understand `getMultiSeriesChartData` but if you’re\
    \ interested in seeing how it works visit 'getMultiSeriesChartData' in the Appendices\
    \ at the back of the book.\n\nLet’s look at `drawChart3` in its entirety:\n\n\
    ```\nfunction drawChart3(data) {\n  let chartData = getMultiSeriesChartData(data,\
    \ 'technology', 'yearSubmitted'); ①\n\n  // Add style to each series\n  chartData.datasets.forEach(series\
    \ => { ②\n    let color = technologyPalette[series.label] || '#aaa'; ③\n    series.borderColor\
    \ = color; ④\n    series.borderWidth = 1.5; ④\n    series.backgroundColor = color;\
    \ ⑤\n    series.radius = 2; ⑥\n  });\n\n  const myChart = new Chart('chart-3',\
    \ { ⑦\n    type: 'line', ⑧\n    data: chartData, ⑨\n    options: { ⑩\n      scales:\
    \ {\n        x: {\n          title: {\n            display: true,\n          \
    \  text: 'Year'\n          }\n        },\n        y: {\n          title: {\n \
    \           display: true,\n            text: 'Number of applications'\n     \
    \     }\n        }\n      },\n      plugins: {\n        title: {\n          text:\
    \ 'Number of planning applications (by technology) 1990-2022',\n        },\n \
    \       legend: {\n          display: true\n        }\n      }\n    }\n  });\n\
    }\n```\nListing 23. `chartjs-various/main.js`\n\n1.  `①` Call `getMultiSeriesChartData`\
    \ to construct the chart. The second argument defines which property is used for\
    \ series (`'technology'`) and the third argument defines the property for main\
    \ axis (`'yearSubmitted'`).\n2.  `②` Iterate through `chartData.datasets` and\
    \ add style so that each line in the chart is coloured by technology type.\n3.\
    \  `③` Use `technologyPalette` lookup to get the technology’s colour. Fall back\
    \ to grey if the colour isn’t defined.\n4.  `④` `borderColor` sets the line colour\
    \ and `borderWidth` sets the line width.\n5.  `⑤` `backgroundColor` sets the colour\
    \ of data point circles.\n6.  `⑥` `radius` sets the radius of data point circles.\n\
    7.  `⑦` Call `new Chart()` to construct the chart and pass in the id of `<canvas>`\
    \ element and the configuration object.\n8.  `⑧` In the configuration object set\
    \ type to `'line'`.\n9.  `⑨` Set the `data` property to the data object `chartData`.\
    \ This was created using `getMultiSeriesChartData`.\n10. `⑩` Finally set options\
    \ for the axis titles, the chart title and the legend.\n\n## 4.5. Chart 4 (Stacked\
    \ bar chart)\n\nChart 4 is a stacked bar chart which shows the number of planning\
    \ applications for each region. Each bar is subdivided by technology type. This\
    \ allows the reader to view the distribution of planning applications by technology\
    \ type for each region. For instance it’s immediately apparent that Scotland has\
    \ many more wind related applications than any other region.\n\n![chartjs styled\
    \ 4](images/chartjs-styled-4.png)\n\nFigure 24. Stacked bar chart\n\nThe function\
    \ `drawChart4` draws this chart and works in a similar way to `drawChart3` but\
    \ now each data series corresponds to a set of same-color horizontal slices through\
    \ the bars. For example the series representing Solar Photovoltaics is represented\
    \ by the yellow slices through each bar.\n\nAs with `drawChart3` it calls `getMultiSeriesChartData`\
    \ but this time the axis label property is `region`:\n\n```\nlet chartData = getMultiSeriesChartData(data,\
    \ 'technology', 'region');\n```\n"
