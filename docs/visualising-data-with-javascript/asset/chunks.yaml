  trans: "\n\n```javascript\nfunction drawChart3(data) {\n  let summary = tidy( ①\n\
    \    data,\n    filter(d => d.technology === 'Battery'),\n    count('status',\
    \ {sort: true})\n  );\n\n  const myChart = new Chart('chart-3', {\n    type: 'doughnut',\
    \ ②\n    data: { ③\n      labels: summary.map(d => d.status),\n      datasets:\
    \ [{\n        data: summary.map(d => d.n),\n        backgroundColor: summary.map(d\
    \ => statusPalette[d.status]) ④\n      }],\n    },\n    options: {\n      plugins:\
    \ {\n        title: {\n          text: 'Status of battery planning applications\
    \ in 2022',\n        },\n        legend: {\n          display: true\n        }\n\
    \      }\n    }\n  });\n}\n```\n列表 59. `data-story/main.js`\n\n1. `①` 使用 `tidy.js`\
    \ 按技术类型进行过滤（仅包含 Battery 类应用），然后统计每个状态代码的应用数量。\n\n2. `②` 将图表类型设置为 `'doughnut'`。\n\
    \n3. `③` 数据结构与柱状图相同。`Chart.js` 会自动计算饼图的百分比。\n\n4. `④` 使用 `statusPalette` 颜色对象来设置分区域颜色。\n\
    \n到目前，这个函数看起来应该已经非常熟悉了。我们使用 `tidy.js` 提取所需的数据，然后使用 `Chart.js` 创建图表。此图表的主要区别在于它的类型是\
    \ `'doughnut'`。`Chart.js` 的伟大之处之一在于，我们只需要更改图表的类型即可创建一个饼图。（`data` 配置对象保持不变。）\n\n\
    ***\n\n***\n\n### drawChart5\n\n最终的图表是一个柱状图，显示了按技术类型划分的授予规划申请的平均时间。\n\n![data\
    \ story chart 4](img/data-story-chart-4.png)\n\n图 56. 显示规划申请授予平均时间的柱状图\n\nREPD\
    \ 数据包含一个名为 `daysUntilGranted` 的属性，它是 `dateSubmitted` 日期和 `dateGranted` 日期之间的天数。（该属性是由将原始\
    \ REPD CSV 文件转换为 JSON 文件的脚本添加的。参见 `wrangling` 项目。）我们使用 `tidy.js` 计算每种技术类型的平均天数。\n\
    \n图表本身非常直观，主要区别在于它的深色主题，并且代表 Battery 技术的条被高亮了。\n\n***\n\n***\n\n这里是代码（省略了 options\
    \ 对象）：\n\n```javascript\nfunction drawChart4(data) {\n  let summary = tidy(\n\
    \    data,\n    filter(d => d.daysUntilGranted !== null), ①\n    groupBy('technology',\
    \ [ ②\n      summarize({\n        meanDaysUntilGranted: mean('daysUntilGranted')\n\
    \      })\n    ]),\n    sort('meanDaysUntilGranted') ③\n  );\n\n  const myChart\
    \ = new Chart('chart-4', ④\n    type: 'bar',\n    data: {\n      labels: summary.map(d\
    \ => d.technology),\n      datasets: [{\n        data: summary.map(d => d.meanDaysUntilGranted),\
    \ ⑤\n        backgroundColor: summary.map(d => d.technology === 'Battery' ? teal:\
    \ '#777') ⑥\n      }]\n    },\n    options: { ... }\n  });\n}\n```\n列表 60. `data-story/main.js`\n\
    \n1. `①` 使用 `tidy.js` 过滤掉 `daysUntilGranted` 为 `null` 的应用。（这些大部分是尚未授予的应用。）\n\n\
    2. `②` 使用 `tidy.js` 的 `groupBy` 函数按技术类型对过滤后的应用进行分组，并计算每个组的平均 `daysUntilGranted`。（我们在“使用\
    \ Chart.js 制作图表”章节中介绍过 `groupBy`。）\n\n3. `③` 按 `meanDaysUntilGranted` 对应用进行排序。\n\
    \n4. `④` 按照通常创建图表。\n\n5. `⑤` 数据值基于 `summary` 中的 `meanDaysUntilGranted` 属性。\n\n\
    6. `⑥` 除非技术类型是 Battery，否则将条形颜色设置为灰色。\n\n***\n\n***\n\n选项对象看起来如下：\n\n```json\n\
    {\n  scales: {\n    y: {\n      title: {\n        display: true,\n        text:\
    \ 'Days until application granted',\n        color: '#eee'\n      },\n      ticks:\
    \ {\n        color: '#ccc'\n      },\n      grid: {\n        color: '#555'\n \
    \     }\n    },\n    x: {\n      ticks: {\n        color: '#ccc'\n      },\n \
    \     grid: {\n        color: '#333'\n      }\n    }\n  },\n  plugins: {\n   \
    \ title: {\n      text: 'Average time to grant applications (by technology) 1990-2022',\n\
    \      color: '#eee'\n    }\n  }\n}\n```\n列表 61. `data-story/main.js`\n\n大部分选项是为了让坐标轴刻度和网格线在深色背景下呈现浅色。\n\
    \n***\n\n***\n\n`drawChart4` 中最大的区别是函数开始处的数据转换。它使用 `tidy.js` 过滤掉没有有效 `daysUntilGranted`\
    \ 值的应用，并按技术进行分组。然后对每个组计算平均的 `daysUntilGranted`，最后对组进行排序。\n\n转换后的输出如下：\n\n```json\n\
    [\n  {\n    \"technology\": \"Compressed Air Storage\"\n  },\n  {\n    \"technology\"\
    : \"Liquid Energy Storage\"\n  },\n  {\n    \"technology\": \"Biomass (co-firing)\"\
    \n  }\n]\n```\n\n## 7.2 发布数据故事\n\n本节展示了如何使用 [surge.sh](https://surge.sh/) 发布数据故事。这是一个将静态网站（一个生成文件的网站）复制到服务器的服务，以便任何人访问该\
    \ URL。\n\n发布数据故事有三个步骤：\n\n1. 如果未安装，则安装 `surge`。\n2. 构建生产版本。\n3. 使用 `surge` 部署数据故事。\n\
    \n安装 `surge` 使用：\n\n```bash\nnpm install --global surge\n```\n\n构建生产版本进入项目目录（`cd\
    \ data-story`）并输入：\n\n```bash\nnpm run build\n```\n\n这会创建一个 `dist` 目录并将生产版本其中。（生产版本是适用于上传到静态服务器的应用版本。）接下来进入\
    \ `dist` 目录并输入 `surge`：\n\n```bash\ncd dist\nsurge\n```\n\n`surge` 会提示几个问题。通常询问项目位置。它使用当前目录作为默认，所以在这里按回车即可。\n\
    \n然后会询问数据故事的 URL。它通常会为你提供一个（通常是一个奇怪的名字），但你可以将 `.surge.sh` 之前的部分重命名为任何你喜欢的。Surge\
    \ 然后将你的数据故事复制到它的服务器并给你 URL。点击该 URL（或复制并粘贴到浏览器中），你应该就能看到数据故事的发布版本。\n\n***\n\n***\n\
    \n如果你尝试发布自己的版本，可能会发现地图没有地图瓦片。\n\n![data story no map tiles](img/data-story-no-map-tiles.png)\n\
    \n图 57. 未注册的 Stadia 地图\n\n这是因为地图瓦片提供商 Stadia 要求注册使用其地图瓦片的任何站 URL。这样他们就可以跟踪服务的次数。如果超过了免费额度，他们将开始收费。\n\
    \n要在 Stadia 注册自己的 URL，请在 [`client.stadiamaps.com/signup/`](https://client.stadiamaps.com/signup/)\
    \ 创建账户，然后使用 `Create a Property` 按钮添加你的 URL。我发现必须将整个域名放在“Domain”部分，而不是将子域名和域名分开。我不知道为什么！\n\
    \n![stadia prop](img/stadia-prop.png)\n\n图 58. Stadia 仪表板属性\n\n## 7.3 总结\n\n"
- fmt: "\nThis chapter showed how to create a data story containing text, charts and\
    \ a map. The approach is deliberately simple so that you can create your own data\
    \ story with a reasonable understanding of `HTML`, `CSS` and `JavaScript`.\n\n\
    The chapter also showed how to deploy the data story to the web using `surge.sh`.\
    \ This means you’re able to create and publish a data story for free. (Although\
    \ bear in mind the map tiles might have a cost.)\n\n# Appendix A: Creating a project\
    \ with Vite\n\nCreating a project using `Vite` is relatively straightforward.\
    \ You do need to have `Node` installed on your computer. You can check this by\
    \ running the following on the command line:\n\n```\nnode -v\n```\n\nIt should\
    \ return the `Node` version that’s installed on your computer. `Vite` requires\
    \ `Node` version `14.18` or `16` upwards so ensure one of these is installed.\n\
    \nIn the command line navigate to a directory where you save your projects and\
    \ type:\n\n```\nnpm create vite@latest\n```\n\nIf you’re asked whether to install\
    \ `create-vite@latest` answer yes.\n\n`Vite` will ask a few questions about your\
    \ new project such as the project name.\n\nWhen it asks you to select a framework\
    \ answer `Vanilla` unless you’re wanting to use a framework such as `Vue` or `React`.\
    \ When it asks which variant, select `JavaScript`, unless you’re specifically\
    \ wanting to use `TypeScript`. (This book doesn’t use `TypeScript`.)\n\n`Vite`\
    \ creates a new project directory and gives you the instructions of how to navigate\
    \ to the new directory. For example:\n\n```\ncd my-project\n```\n\nOnce you’re\
    \ in your new project directory type `npm install` to download the project’s dependencies\
    \ then `npm run dev` to build the project and start the development server.\n\n\
    `Vite` will display a URL where you can visit your application. This is usually\
    \ `localhost:5173`. If you visit this URL in your web browser you should see:\n\
    \n![vite](images/vite.png)\n\nFigure 59. The `Vite` default project\n\nThe default\
    \ project is a simple counter application. When you click the button the counter\
    \ increments.\n\nThe project has the following file structure:\n\n```\nmy-project/\n\
    \  counter.js\n  index.html\n  javascript.svg\n  main.js\n  node_modules/\n  \
    \  ...\n  package-lock.json\n  package.json\n  public/\n    vite.svg\n  style.css\n\
    ```\n\nIt’s nice that `Vite` creates a working application for you but it does\
    \ mean there’s a few files that you probably don’t need when you start developing\
    \ your own application. These are:\n\n* `counter.js`\n* `javascript.svg`\n* `public/vite.svg`\n\
    \nGenerally I delete these files and any code that imports them (in `index.html`\
    \ and `main.js`). Most of `main.js` can also be removed.\n\nThe files that are\
    \ usually retained are:\n\n| Filename | Description |\n| --- | --- |\n| `index.html`\
    \ | The main `HTML` file. This contains static content and container elements\
    \ for `JavaScript` generated content. |\n| `main.js` | The `JavaScript` entry\
    \ point. This is the first file to run when the application loads. |\n| `style.css`\
    \ | The main `CSS` file. It can either be included in `index.html` using a `link`\
    \ tag or imported by a `JavaScript` file. (Importing `CSS` files from a `JavaScript`\
    \ file isn’t standard `JavaScript` but `Vite` supports this.) |\n| `public` |\
    \ A directory that acts as the root directory (`/`) on the web server. This enables\
    \ your own files to be included by `index.html` or files (such as a `CSV` or `JSON`\
    \ file) to be loaded using `JavaScript`. |\n| `package.json` | The main project\
    \ configuration file. One of the main things this file does is specify any third\
    \ party packages (such as `Chart.js` and `D3`) the the project depends on. |\n\
    \n`node_modules` is a standard directory that contains third party packages (such\
    \ as `Chart.js` or `D3`) that are listed as dependencies in `package.json`.\n\n\
    `package-lock.json` is a file that’s created by `npm` that lists exactly what’s\
    \ been installed in the project and is used to ensure anyone working on the project\
    \ has exactly the same package versions installed. You don’t need to think about\
    \ this file at all for the purposes of this book.\n\nUnfortunately `Vite` doesn’t\
    \ seem to let you create a barebones project. The closest is the `Vanilla` option\
    \ which creates the counter application. This means we need to strip away code\
    \ that we don’t need. For each of the projects in this book we:\n\n* remove `counter.js`\n\
    * in `main.js` just retain the first line (the `style.css` import)\n* remove `javascript.svg`\
    \ and `public\\vite.svg` files\n* remove the line containing `vite.svg` in `index.html`\n\
    * remove all the `CSS` in `style.css` except for `body` element rule\n\nThis leaves\
    \ us with a barebones application.\n\n# Appendix B: getMultiSeriesChartData\n\n\
    This section explains how the function `getMultiSeriesChartData` works. It’s used\
    \ in the `chartjs-various` and `data-story` projects.\n\nThe purpose of the function\
    \ is to create a `Chart.js` data object for a multi-series chart given an array\
    \ of data.\n\nIt takes three arguments:\n\n1. The `REPD` data array\n2. The `data`\
    \ property that defines the names of each series.\n3. The `data` property that\
    \ defines the axis labels.\n\nIf called with the following arguments:\n\n```\n\
    getMultiSeriesChartData(data, 'technology')\n```\n\nit returns an object that\
    \ looks like:\n\n```\n{\n  labels: [\"2020\", \"2021\", \"2022\"],\n  datasets:\
    \ [\n    {\n      label: \"Advanced Conversion\",\n      data: [10, 15, 13]\n\
    \    },\n    {\n      label: \"Anaerobic Digestion\",\n      data: [5, 8, 7]\n\
    \    }\n  ]\n}\n```\n\n* * *\n\nWe assign the output of `getMultiSeriesChartData`\
    \ to the `data` property in the `Chart.js` configuration object. For example:\n\
    \n```\nlet chartData = getMultiSeriesChartData(data, 'technology');\n\nconst myChart\
    \ = new Chart('my-chart', {\n  type: 'line',\n  data: chartData,\n  options: {\
    \ }\n});\n```\n\nHere’s the function:\n\n```javascript\nfunction getMultiSeriesChartData(data,\
    \ seriesProp, labelProp) {\n  let seriesNames = uniq(data.map(d => d[seriesProp]))\n\
    \    .filter(d => d !== '')\n    .sort();\n\n  let labelNames = uniq(data.map(d\
    \ => d[labelProp]))\n    .filter(d => d !== '')\n    .sort();\n\n  let chartData\
    \ = {\n    labels: labelNames,\n    datasets: seriesNames.map(series => {\n  \
    \    return {\n        label: series,\n        data: []\n      };\n    })\n  };\n\
    \n  // Add data to each series\n  chartData.datasets.forEach(series => {\n   \
    \ series.data = labelNames.map(label => {\n      let items = data.filter(d =>\
    \ {\n        return d[seriesProp] === series.label && d[labelProp] === label;\n\
    \      });\n      return items.length;\n    });\n  });\n\n  return chartData;\n\
    }\n```\n\n1. *①* `getMultiSeriesChartData` accepts three arguments: `data` (the\
    \ data array), `seriesProp` (the property e.g. `'technology'` from which we derive\
    \ the series names) and `labelProp` (the property e.g. `'yearSubmitted'` from\
    \ which we derive the labels along the main axis).\n2. *②* Create an array of\
    \ the series names. We use lodash’s `uniq` function that takes an array and outputs\
    \ a copy of the array with duplicates removed. We also filter the arrays to remove\
    \ blanks and sort the arrays in ascending order.\n3. *③* Create an array of the\
    \ label names in a similar manner to `seriesNames`.\n4. *④* Create and initialise\
    \ the chart data object.\n5. *⑤* Create the `datasets` array by calling the `map`\
    \ method on `seriesNames`. Each element of this array represents a data series.\n\
    6. *⑥* Iterate through each series.\n7. *⑦* For each series call the `map` method\
    \ on the `labelNames` array to create an array where each element is the number\
    \ of planning applications for this series and a particular label name.\n8. *⑧*\
    \ To count the number of items filter the data for items that match `series` and\
    \ `label` and return the array length.\n\n# Appendix C: Data Wrangling\n"
