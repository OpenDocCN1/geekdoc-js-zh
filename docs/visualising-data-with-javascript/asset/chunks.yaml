    \n1. ① Call `getMultiSeriesChartData` to construct the chart data object. The\
    \ second argument defines which property is used for series (`'technology'`) and\
    \ the third argument defines which property is used for the main axis labels (`'region'`).\n\
    2. ② Iterate through each series in `chartData.datasets` and add style properties\
    \ so that each bar slice is coloured according to the technology type. `backgroundColor`\
    \ sets the colour of a bar slice.\n3. ③ Construct the chart by calling `new Chart()`\
    \ and passing in the id of the `<canvas>` element and the configuration object.\n\
    4. ④ In the configuration object set the type to `'bar'`.\n5. ⑤ Set the `data`\
    \ property to the data object `chartData`. This is the object that was created\
    \ using `getMultiSeriesChartData`.\n6. ⑥ To create a stacked bar chart set the\
    \ `stacked` property of the `x` and `y` scales to `true`. If we leave these at\
    \ their default value of `false` we get a grouped bar chart.\n\n## 4.6 Wrapping\
    \ up\n\nThis chapter showed a few ways in which Chart.js charts can be styled.\
    \ We changed the colour scheme of a simple bar chart to give it a cleaner look\
    \ and showed how to achieve a dark themed chart.\n\nI also showed how to create\
    \ multi-line and stacked bar charts and walked through a helper function that\
    \ transforms an array of data into the multi-series structure required by Chart.js.\n\
    \nThis concludes the introduction to Chart.js. I haven’t covered everything there\
    \ is to know about Chart.js but enough to enable you to create useful and attractive\
    \ charts. We’ll use this knowledge later in the book when creating data stories.\n\
    \n# 5. Custom Charts with D3.js\n\nThis chapter introduces [D3.js](https://d3js.org)\
    \ which is a free and open-source JavaScript library. Rather than providing ready\
    \ made charts D3 provides building blocks for making custom data visualisations.\n\
    \n![d3 timeline](images/d3-timeline.png)\n\nFigure 25. A custom chart created\
    \ using D3.js. Each circle represents an REPD planning application.\n\nIn this\
    \ chapter I:\n\n* introduce D3\n* learn about D3’s philosophy\n* learn about D3\
    \ selections, joins and scale functions\n* learn about the Tippy.js tooltip module\n\
    * walk through a D3 example that visualises the REPD data\n\n## 5.1 Introduction\
    \ to D3\n\nD3 is a free, open-source JavaScript library that helps you create\
    \ custom data visualisations. Unlike Chart.js which provides a selection of ready\
    \ made charts, D3 provides a selection of functions that help you make any chart\
    \ you can imagine. In culinary terms Chart.js is like a ready meal (fast and convenient)\
    \ and D3 is like cooking from raw ingredients (which takes more time and skill\
    \ but with superior results).\n\nD3 does require more skill and usually requires\
    \ more coding. For instance to create a bar chart with Chart.js requires a few\
    \ lines of code but with D3 this could run into hundreds of lines (if you want\
    \ to cover all features and cases).\n\nI cover D3 in this book because it’s one\
    \ of the most popular JavaScript data visualisation libraries and is a very powerful\
    \ tool. However it’s beyond this book’s scope to cover D3 comprehensively but\
    \ I show enough to give you an idea of how D3 works and what it can do.\n\nIf\
    \ you’re interested in learning more I suggest reading [D3 Start to Finish](https://www.createwithdata.com/d3-start-to-finish-book/)\
    \ which takes you through a full example step by step.\n\nDon’t worry if this\
    \ chapter proves challenging. We don’t use D3 elsewhere in this book so you can\
    \ skip this chapter if you wish.\n\n## 5.2 Principles of D3\n\n### 5.2.1 The data\
    \ join\n\nOne of the key principles of D3 is the data join. This is where an array\
    \ of data is associated with a group of DOM elements. (A DOM element is the browser’s\
    \ internal representation of an HTML or SVG element.) This means that each data\
    \ item is associated with a DOM element. We then associate data variables (such\
    \ as `year`, technology type or capacity) with style and attributes of the DOM\
    \ elements (such as position, size and colour).\n\nFor instance we could represent\
    \ each REPD planning application with a circle. This results in 8000 or so circles.\
    \ Now let’s associate the submission year (`yearSubmitted`) with the circle’s\
    \ position along the x-axis. This results in a line of circles where the right-most\
    \ circles are the most recent applications:\n\n![d3 dot 1](images/d3-dot-1.png)\n\
    \nFigure 26. Dot plot where the x coordinate represents submission date.\n\nThis\
    \ isn’t the most useful (nor impressive) data visualisation. But rest assured,\
    \ each dot represents a planning application. If we make each circle transparent\
    \ (by lowering it’s `opacity` value) we can see more of a trend over time (the\
    \ darker the line, the more applications there were):\n\n![d3 dot 2](images/d3-dot-2.png)\n\
    \nFigure 27. Reducing the opacity of each circle reveals a trend\n\nNow let’s\
    \ position each circle along the y-axis according to its technology type:\n\n\
    ![d3 dot 3](images/d3-dot-3.png)\n\nFigure 28. Positioning each circle along the\
    \ y coordinate according to technology\n\nNow we can see patterns in the data.\
    \ We can see that some technologies have become more prevalent in later years\
    \ while one technology (the one just below the middle of the chart) was more prevalent\
    \ in earlier years but subsequently waned. The bottom row (which represents onshore\
    \ wind) has had a strong stream of applications across all years. (There’s no\
    \ labels to tell us which row belongs to technology. This is where D3 requires\
    \ more effort as we have to add them using more code!)\n\nNow let’s colour each\
    \ circle according to status:\n\n![d3 dot 4](images/d3-dot-4.png)\n\nFigure 29.\
    \ Coloring each circle according to status\n\nGreen means the site is operational,\
    \ yellow means the site is awaiting or under construction, purple means the planning\
    \ application is in progress and grey means the planning application has been\
    \ abandoned, withdrawn or refused. Now let’s size each circle according to the\
    \ power output (or capacity) of each proposed installation:\n\n![d3 dot 5](images/d3-dot-5.png)\n\
    \nFigure 30. Sizing each circle according to capacity\n\nThe bottom row represent\
    \ onshore wind and the one above offshore wind. Not surprisingly these have the\
    \ largest power outputs.\n\nThis example gives a flavour of how D3 works. We represent\
    \ data with shapes and modify each shape’s visual variables according to its data\
    \ values. (A shape’s visual variable is a quantity such as x coordinate, y coordinate,\
    \ length, width, radius and colour.)\n\nIn this chapter I show you how to create\
    \ the example we’ve just stepped through. We also add an x-axis that shows the\
    \ years and a y-axis that shows the technology types.\n\n![d3 timeline](images/d3-timeline.png)\n\
    \nFigure 31. REPD timeline (d3-dot project)\n\n### 5.2.2 Modules\n\nD3 consists\
    \ of a number of modules each of which contains functions that help you build\
    \ visualisations. (You can picture D3 as a toolkit for building visualisations.)\n\
    \nThe modules include:\n\n* `d3-selection` (functions to add, remove and modify\
    \ DOM elements and perform data joins)\n"
