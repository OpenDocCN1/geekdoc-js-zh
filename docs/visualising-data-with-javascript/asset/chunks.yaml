    ,\n    \"operator\": \"Orsted (formerly Dong Energy) / Peel Energy\",\n    \"\
    yearSubmitted\": 2010,\n    \"dateSubmitted\": \"2010-06-02T00:00:00.000Z\",\n\
    \    \"yearGranted\": null,\n    \"daysUntilGranted\": null\n  },\n  ...\n]\n\
    ```\n\n列表 5. JSON 文件中的前几项 (data/repd.json)\n\n* *\n\n现在来看 `makeList` 函数，它对数据进行过滤（使用\
