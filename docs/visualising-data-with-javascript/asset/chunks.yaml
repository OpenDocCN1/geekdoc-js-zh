    \ height to the full height of the browser window.\n4.  *④* Set the margin of\
    \ `<h4>` elements to zero. This is to reduce space around the tooltip’s heading.\n\
    \n***\n\n## 6.4. Wrapping up\n\nThis chapter introduced the Leaflet mapping library.\
    \ It showed how to create a map, how to add circles to the map and showed a complete\
    \ example of a data-driven map.\n\nLeaflet’s a fantastic library for creating\
    \ maps and one of the easiest libraries I know of for quickly making a map. It’s\
    \ more powerful than it appears at first glance. As well as circle markers you\
    \ can add other shapes including ones based on GeoJSON data. You can also programmatically\
    \ set the view point and zoom and even get the map to 'fly to' a particular location.\
    \ I recommend visiting the [official documentation](https://leafletjs.com/reference.html)\
    \ to explore what Leaflet has to offer.\n\n## 6.5. Ideas for further study\n\n\
    I recommend playing around with the project by exploring, modifying and adding\
