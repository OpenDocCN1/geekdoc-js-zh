    \ |\n| `public` | Directory that acts as the server root directory. You can put\
    \ static files (such as CSV files) here which the application can request. |\n\
    | `style.css` | The main CSS file. |\n\n`load-data` is a project that’s derived\
    \ from `Vite`’s default counter project (see Appendix A). Let’s examine the files\
    \ in more detail.\n\n* * *\n\n##### index.html\n\nThis is the main HTML file and\
    \ is the first file that’s loaded by the web browser when the site loads. Most\
