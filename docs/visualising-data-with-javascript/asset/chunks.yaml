    \ sort the result in descending order pass an object `{sort: true}` as the second\
    \ argument.\n\n```\nimport { tidy, count } from '@tidyjs/tidy';\n\n// Count the\
    \ number of applications of each technology\ntidy(\n  data,\n  count('technology',\
    \ {sort: true})\n)\n\n// returns:\n[\n  {\n    \"technology\": \"Solar Photovoltaics\"\
