  trans: "\n\n仅通过数字很难在数据中发现任何趋势。数据分析师可能会运行回归测试来查看是否存在趋势，但你也可以通过绘制折线图来将数据可视化：\n\n![simple\
    \ table of numbers as chart](img/simple-table-of-numbers-as-chart.png)\n\n图 7\
    \ 用折线图表示的销售数据\n\n我们可以立即看到存在上升趋势，并且在 8 月有一个峰值。这就是数据可视化的力量所在。它揭示了在数字表格中并不显见的模式。\n\
    \n### 2.1.1 为什么要可视化数据？\n\n有很多充分的理由可视化数据，例如：\n\n*   它是理解和交流数据的有效方法\n*   它可以提供更丰富的视觉多样性，有助于吸引读者的兴趣\n\
    *   它本身就可以成为极具视觉吸引力的作品（有利于内容、SEO 等）\n\n### 2.1.2 最佳实践\n\n有很多关于数据可视化最佳实践的书。我脑海中浮出了\
    \ Alberto Cairo 的[功能性艺术](https://www.oreilly.com/library/view/the-functional-art/9780133041187/)。书中有一个非常实用的章节，根据对人类感知的学术理解解释了哪些图表在传输数据方面最有效。简之，最好使用位置和长度来表示数据（而不是方向、面积和/或阴影），因为我们对位置和长度差异的感知优于其他编码。这就是柱状图、折线图和散点图流行的原因之一。这并不是说非标准图表就无效。只要使用位置和长度表示重要数量，自定义图表也可以有效地传达数据。\n\
    \n## 2.2 JavaScript\n\nJavaScript 是 Web 的编程语言，并在所有主流浏览器中实现。它的语法与 `C`、`C++`、`PHP`\
    \ 等 C 系编程语言相似，通常用于网站和应用程序添加交互性。它还用于修改网页内容。\n\n### 2.2.1 为什么要使用 JavaScript 进行数据可视化？\n\
    \nJavaScript 成为可视化领域领先（甚至唯一）语言之一有几个原因：\n\n*   它是唯一在主流浏览器中实现的语言\n*   它非常适合处理数据\n\
    *   它拥有大量的可视化库，包括 `Leaflet` 和 `D3.js`。\n\n### 2.2.2 JavaScript 与可视化的历史\n\nJavaScript\
    \ 图表库的存在时间几乎与 JavaScript 本身一样久（后者于 1995 年引入）。据我所知，最早仍在维护的有 [Google Charts](https://developers.google.com/chart)\
    \ 和 [Flot](https://flotcharts.org/)，它们都于 2007 年左右推出，支持柱状图、折线图和饼图等标准图表。\n\n![flot](img/flot.png)\n\
    \n图 8 用 Flot 创建的折线图\n\n2009 年[Highcharts](https://highcharts.com) 和 [Protovis](https://mbostock.github.io/protovis/)\
    \ 发布。Highcharts 仍然是领先的 JavaScript 库之一（非商业用途免费），并提供标准图表。Protovis 采取了不同的方法。它不是提供标准图表，而是提供图形元素（如条、线和点），你可以通过这些元素编码数据。你可以组合这些元素来创建自定义图表。Protovis\
    \ 由 Mike Bostock 和 Jeff Heer 领导，他们后来创建了 `D3.js`。\n\n![protovis](img/protovis.png)\n\
    \n图 9 用 Protovis 创建的自定义图表\n\n21 世纪 00 年中期，Adobe 的 Flash 是创建 Web 丰富交互应用程序的主导平台。随着\
    \ `SVG` 和 `Canvas` 等 Web 标准被主流浏览器支持，它的流行程度在 2000 年末开始下降。\n\n2011 年 `D3.js` 发布，它拥抱了对\
    \ `SVG` 标准日益增长的支持。与 Protovis 类似，它提供了制作图表的构建块，并成为创建可视化的主导 JavaScript 库。\n\n2014\
    \ 年[Chart.js](https://www.chartjs.org/) 发布，目前是领先的免费开源图表库之一。\n\n### 2.2.3 今天的 JavaScript\
    \ 与可视化\n\n目前 Github 上流行的数据可视化项目是 `D3.js`（105,000 星星）和 `Chart.js`（60,300 星星）。我个人认为\
    \ `D3.js` 和 `Chart.js` 能够涵盖大多数可视化场景。通常情况下，我建议使用 `Chart.js` 处理标准图表（柱状、折线、饼图和散点图），使用\
    \ `D3.js` 处理自定义可视化。\n\n## 2.3 使用 JavaScript 创建 Web 应用程序\n\n本节将展示如何创建一个 JavaScript\
    \ Web 应用程序。首先展示 Web 应用程序的基础组件，然后介绍工具 `Vite`，它可以帮助你将所有部分结合在一起。\n\n从根本上说，Web 应用程序由\
    \ `HTML`、`CSS` 和 `JavaScript` 组成。无论是简单的网站、全功能的电子商务商店或社交媒体平台都是如此。如果你还不 `HTML`、`CSS`\
    \ 或 `JavaScript`，我建议在 Web 上寻找教程，例如 [mozilla.org 上的教程](https://developer.mozilla.org/en-US/docs/Learn/Getting_started_with_the_web)\
    \ 或阅读我的书籍[数据可视化的 HTML、SVG、CSS 和 JavaScript 基础](https://leanpub.com/html-svg-css-js-for-data-visualisation)。\n\
    \n### 2.3.1 HTML\n\nHTML（超文本标记语言）描述应用程序的静态内容。通常情况下，它是网页上始终可见的内容。\n\n这里是示例 HTML：\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>...</head>\n<body>\n  <h1>My\
    \ app</h1> ①\n  <div id=\"menu\"></div>\n  <div class=\"content\">\n    <div id=\"\
    chart\"></div> ②\n  </div>\n</body>\n</html>\n```\n\n1. ① 静态内容\n2. ② 由 JavaScript\
    \ 生成的图表容器\n\n### 2.3.2 CSS\n\nCSS（层叠样式表）描述应用程序的布局和样式。例如：\n\n```css\nbody {\n \
    \ background-color: #eee;\n}\n\nh1 {\n  color: blue;\n}\n\n.content {\n  padding:\
    \ 1rem;\n}\n```\n\n### 2.3.3 JavaScript\n\nJavaScript 代码管理交互和动态内容。动态内容是在网页加载后生成的。它增强了主\
    \ HTML 文件的静态内容。\n\n这是一个基础示例，用于在 HTML 文件中的 `<div id=\"chart\">` 容器中填充 Chart.js\
    \ 图表（在此阶段不需要理解这段代码）：\n\n```javascript\nlet chart = new Chart('chart', {\n  type:\
    \ 'bar',\n  data: {\n    labels: ['A', 'B', 'C'],\n    datasets: [\n      {\n\
    \        data: [10, 20, 30]\n      }\n    ]\n  }\n});\n```\n\n这段代码会导致 Chart.js\
    \ 在 `<div id=\"chart\">` 元素中绘制一个柱状图。\n\n如果这些 `HTML`、`CSS` 或 `JavaScript` 代码对你来说完全陌生，我建议通过[数据可视化的\
    \ HTML、SVG、CSS 和 JavaScript 基础](https://leanpub.com/html-svg-css-js-for-data-visualisation)\
    \ 来上手。\n\n### 2.3.4 组合部分\n\n虽然可以在 HTML 文件中使用 `<link>` 和 `<script>` 标签链接每个项目的 CSS\
    \ 和 JavaScript 文件，但通常的方法（特别是对于中大型项目）是使用**打包器**（bundler）。打包器是一种将多个 JavaScript 文件合并成单个包的工具。\n\
    \n一个主要优势是你的 JavaScript 可以模块化，这意味着你可以将应用程序拆分为每个具有单一目的的小文件。这使得你的应用程序代码更容易理解和导航。\n\
    \n有很多打包器可用，如 [Webpack](https://webpack.js.org/)、[Rollup](https://rollupjs.org/)、[Parcel](https://parceljs.org/)\
    \ 和 [Vite](https://vitejs.dev/)。在本书中我们使用 Vite 是因为：\n\n*   你可以用极少的配置创建项目\n\n"
- fmt: "\n* it has a built-in web-server for when you’re developing your application\n\
    * it’s fast\n* its web-server serves static files (which is useful for loading\
    \ in CSV and JSON files)\n\nIn general I recommend using `Vite` for any size web\
    \ application.\n\nAll of the projects in this book are created using `Vite`. Creating\
    \ a project with `Vite` is relatively straightforward but there’s no need to do\
    \ this yourself for the purposes of this book. However if you’d like to know how\
    \ to create a project with `Vite` refer to Appendix A.\n\n* * *\n\n### 2.3.5.\
    \ Example web application\n\nOur first project loads the REPD data, filters it\
    \ then displays it as a list:\n\n![load data](images/load-data.png)\n\nTo run\
    \ the project, open your command line and navigate to `load-data` of the code\
    \ download. Type `npm install` to download the project dependencies then `npm\
    \ run dev` to start the project’s web server:\n\n```\ncd load-data\nnpm install\n\
    npm run dev\n```\n\nWhen `npm run dev` is run the command line will respond with\
    \ a message containing a URL to visit (usually [`http://localhost:5173/`](http://localhost:5173/)).\
