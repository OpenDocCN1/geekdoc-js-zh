    \n*   change the information displayed in the tooltip.\n\nVisit the Appendix for\
    \ solutions.\n\n# 6\\. Data-driven Maps with Leaflet\n\nThis chapter introduces\
    \ [Leaflet](https://leafletjs.com/) which is a free, open-source JavaScript library\
    \ for making maps. Leaflet creates tile-based maps meaning the maps are made up\
    \ of small images tiled together. (This is the same method that Google Maps uses.)\
    \ The user can zoom in and out and scroll around the map.\n\nYou can also draw\
    \ shapes on the map which means you can create data-driven maps.\n\nHere’s a map\
    \ generated using Leaflet that visualises the REPD data (we’ll step through this\
    \ project in this chapter):\n\n![leaflet](images/leaflet.png)\n\nFigure 39\\.\
    \ Leaflet map showing REPD planning applications\n\nIn this chapter I:\n\n*  \
    \ introduce Leaflet\n\n*   show how to use Leaflet\n\n*   walk through a Leaflet\
    \ example that visualises the REPD data.\n\n* * *\n\n## 6.1\\. Introduction to\
    \ Leaflet\n\nLeaflet is a free, open-source JavaScript library that draws tile-based\
    \ maps. It’s relatively easy to use, very configurable and you can draw shapes\
    \ such as circles on top of the map.\n\nA Leaflet map is made up of small JPG\
    \ or PNG images placed in a grid formation. When the map first loads, and when\
    \ the map is panned or zoomed, new tiles are loaded.\n\n![leaflet tiles](images/leaflet-tiles.png)\n\
    \nFigure 40\\. Map tiles\n\nLeaflet relies on a tile server to provide the map\
    \ tiles. There’s lots of options but few of them are free. In this book we use\
    \ [Stadia’s tiles](https://stadiamaps.com/products/map-tiles/) which are free\
    \ for non-commercial use but if you publish your map on the web you’ll need a\
    \ Stadia account. If you were really serious you could consider hosting your own\
    \ tile server but this isn’t something I’ve done myself.\n\nYou can browse a large\
    \ selection of tile sets [here](https://leaflet-extras.github.io/leaflet-providers/preview/).\
    \ Other options are Stamen, Thunderforest and Mapbox.\n\n* * *\n\n## 6.2\\. How\
    \ to use Leaflet\n\n### 6.2.1\\. Installation\n\nInstall Leaflet by navigating\
    \ to your project and calling `npm install leaflet`.\n\n### 6.2.2\\. Creating\
    \ a map\n\nThere are a few steps to creating a map with Leaflet:\n\n*   add a\
    \ `<div>` container for the map to `index.html`\n\n*   add a CSS rule to set the\
    \ height of the container\n\n*   make sure Leaflet’s CSS file is imported\n\n\
    *   in the relevant JavaScript files import Leaflet\n\n*   create a map using\
    \ Leaflet’s `map` method\n\n*   specify the tile server and set the map’s view\
    \ center.\n\nEach of these steps is important and missing one of them out can\
    \ result in no map (or a scrambled map!).\n\n#### Add a container\n\nA `<div>`\
    \ container for the map must be added to the HTML. For example:\n\n```\n<div id=\"\
    map\"></div>\n```\n\nI recommend adding an `id` attribute to the container as\
    \ this makes it easier to identify the container in your JavaScript.\n\n#### Set\
    \ the height of the container\n\nThe height of the container must be set. This\
    \ can be done using CSS. (I’ve often forgotten this step and wondered why my map\
    \ is invisible.)\n\n```\n#map {\n  height: 600px;\n}\n```\n\n#### Import Leaflet’s\
    \ stylesheet\n\nLeaflet has a CSS stylesheet that must be included in your project.\
    \ For a Vite project, this can be done by adding an `@import` statement in `style.css`.\
    \ (You can read more about this feature in [Vite’s documentation](https://vitejs.dev/guide/features.html#import-inlining-and-rebasing).)\n\
    \n```\n@import 'leaflet/dist/leaflet.css';\n```\n\nIf this step is omitted the\
    \ map may appear scrambled.\n\n#### Create a map\n\nIn the JavaScript code a map\
    \ is created by importing the Leaflet library, calling the `map` method, specifying\
    \ the tile server and setting the view center:\n\n```\nimport L from 'leaflet';\
    \ ①\n\nlet map = L.map('map'); ②\n\nL.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',\
    \ { ③\n  maxZoom: 20,\n  attribution: '&copy; <a href=\"https://stadiamaps.com/\"\
    >Stadia Maps</a>...',\n}).addTo(map); ④\n\nmap.setView([55, -2], 6); ⑤\n```\n\n\
    1.  *①* The first line of `main.js` imports the main Leaflet object. This object\
    \ is exported as an unnamed object, so we have to name it. The convention is to\
    \ name it `L`.\n\n2.  *②* Next a map object is created by calling `L.map` and\
    \ passing in the id of the `<div>` container. This creates a map object but doesn’t\
    \ draw the map yet. We still need to add a tile layer to the map.\n\n3.  *③* The\
    \ next step is to create a tile layer using `L.tileLayer`. Pass in two arguments,\
    \ the tile layer’s URL and a configuration object. Both arguments are usually\
    \ supplied by the tile server provider. If you browse the Leaflet providers gallery\
    \ ([https://leaflet-extras.github.io/leaflet-providers/preview/](https://leaflet-extras.github.io/leaflet-providers/preview/))\
    \ each tile set has this information.\n\n4.  *④* The tile layer is then added\
    \ to the map object using `addTo`. (`addTo` is a layer method that adds the layer\
    \ to an existing map object.)"
