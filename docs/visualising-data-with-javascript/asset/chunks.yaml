    \ drawMap(data) { ... } ⑤\nfunction drawChart3(data) { ... } ⑥\nfunction drawChart4(data)\
    \ { ... } ⑦\n\nfunction draw(data) { ⑧\n  drawChart1(data);\n  drawChart2(data);\n\
    \  drawMap(data);\n  drawChart3(data);\n  drawChart4(data);\n}\n\nfetch('./repd.json')\
    \ ⑨\n  .then(res => res.json())\n  .then(data => draw(data));\n```\n\nListing\
    \ 53\\. data-story/main.js\n\n1.  *①* `getMultiSeriesChartData` (copied from the\
