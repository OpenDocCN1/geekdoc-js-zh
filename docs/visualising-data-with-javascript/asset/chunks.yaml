    \ charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\" />\n    <title>REPD battery applications</title> ①\n  </head>\n\
    \  <body>\n    <div id=\"output\"></div> ②\n    <script type=\"module\" src=\"\
    /main.js\"></script> ③\n  </body>\n</html>\n```\n\nListing 3. index.html\n\n1.\
    \ ① The title that appears in the browser’s tab is set using a `<title>` tag.\n\
    2. ② The `<div>` element that acts as a container for the list. We populate this\
    \ element in `main.js`.\n3. ③ The main JavaScript file `main.js` is included using\
    \ a `<script>` tag. This line is generated by `Vite` and in general we don’t need\
    \ to touch it.\n\n* * *\n\n##### main.js\n\n`main.js` is the only JavaScript file\
