    : 2241\n  },\n  {\n    \"technology\": \"Battery\",\n    \"n\": 623\n  },\n  ...\n\
    ]\n```\n\nWe use `count` later to create a summary bar chart of the REPD data.\n\
    \n* * *\n\n#### groupBy\n\nThe `groupBy` function groups the data by a given property\
    \ and performs operations on the groups. This is useful for performing aggregation\
    \ operations such as sum, mean, median, min and max over the dataset.\n\nFor example,\
    \ you can compute the count and average (mean) capacity for each technology type:\n\
    \n```\nimport { tidy, groupBy, n, mean, desc } from '@tidyjs/tidy';\n\n// Group\
    \ by technology and count the number of applications and the mean capacity in\
    \ each group\ntidy(\n  data,\n  groupBy('technology', [\n    summarize({\n   \
    \   count: n(),\n      meanCapacity: mean('capacity')\n    })\n  ]),\n  sort(desc('meanCapacity'))\n\
    )\n\nreturns:\n[\n  {\n    \"technology\": \"Pumped Storage Hydroelectricity\"\
    ,\n    \"count\": 10,\n    \"meanCapacity\": 573.78\n  },\n  {\n    \"technology\"\
