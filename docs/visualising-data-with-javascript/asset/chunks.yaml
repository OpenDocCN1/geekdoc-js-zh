    \n本章讨论了 JavaScript 在数据可视化中的作用。它概述了 JavaScript 图表库，并将其分为两类：提供标准图表选择的库，以及那些提供更多灵活性但代价是学习曲线更陡峭的库。\n\
    \n我们还看了一个使用 Vite 构建的简单项目。该项目加载 REPD 数据并将其子集以列表形式呈现。这为本书后续的内容奠定了基础。\n\n## 2.5 进一步学习的建议\n\
    \n我建议通过探索、修改和添加代码来玩玩这个项目。以下是一些想法：\n\n* 显示不同的字段（例如运营商或状态）\n* 更改过滤器以显示不同的技术类型（或更改容量阈值）\n\
    * 尝试显示自己的数据（确保数据集不要过大，可能不要超过 10Mb）。\n\n访问附录以获取解决方案。\n\n# 3. 使用 Chart.js 创建图表\n\
    \n本章介绍了 JavaScript 图表库 [Chart.js](https://www.chartjs.org/)。这是最受欢迎的免费开源 JavaScript\
    \ 图表库之一。它可以让你轻松地在网页上添加条形图、折线图、饼图和其他图表。\n\n![chartjs basic](img/chartjs-basic.png)\n\
    \n图 10. 使用 Chart.js 创建的条形图\n\n虽然使用 Chart.js 创建图表相对简单，但 Chart.js 的功能远不止此。 Chart.js\
    \ 的一些优势包括：\n\n* 图表非常易于样式化。你可以设置单个元素的样式并调整元素之间的间距，这意味着你可以满足大多数样式需求。\n* 图表对设备宽度是响应式的，这意味着图表在大屏幕和移动设备上效果同样良好。\n\
    * 图表具有内置的工具提示（tooltip），可以显示鼠标悬停（或在移动设备上触摸）数据点上的信息。工具提示可以配置为精确显示你想显示的任何信息。\n* Chart.js\
    \ 的性能非常惊人。我运行过测试，它可以轻松处理数个、甚至数千个数据点（参见 [Chart.js 性能测试](https://codepen.io/createwithdata/pen/mvdQjg)）。\n\
    \n![chartjs tennis](img/chartjs-tennis.png)\n\n图 11. 样式化的 Chart.js 图表示例 ([`www.createwithdata.com/chartjs-and-csv/`](https://www.createwithdata.com/chartjs-and-csv/))\n\
    \n本章展示了如何使用 Chart.js 创建简单的条形图。我们加载 REPD 数据，进行一些基础数据分析，并创建一个条形图来显示结果。\n\n我们还使用了\
    \ [tidy.js](https://pbeshai.github.io/tidy/) JavaScript 库，它可以方便过滤、排序和聚合等常见的数据处理操作。我们使用\
    \ tidy.js 在可视化之前对 REPD 数据进行聚合。\n\n***\n\n## 3.1 引入 Chart.js\n\nChart.js 是一个免费开源\
    \ JavaScript 库，用于绘制条形图、折线图、散点图、饼图和雷达图。它能生成吸引图表，并且可靠、性能卓越、易于使用、文档齐全且支持良好。本书使用的是\
    \ Chart.js 的 4 版本。\n\n本节首先展示如何使用 Chart.js 创建图表。随后将一个使用 tidy.js 和 Chart.js 可视化\
    \ REPD 数据的示例。\n\n### 3.1.1 创建图表\n\n使用 Chart.js 创建图表有三个步骤：\n\n* 在项目中引入 Chart.js\n\
    * 创建一个 HTML 元素来包含你的图表\n* 使用 Chart.js 的构造函数创建一个新的 Chart\n\n#### 在项目中引入 Chart.js\n\
    \n如果你正在使用如 Webpack、Parcel 或 Vite 等打包器，可以使用以下命令安装 Chart.js：\n\n```\ncd your-project\n\
    npm install chart.js\n```\n\n#### 为图表创建容器\n\n每个图表都需要一个 `<canvas>` 元素（`<canvas>`\
    \ 元素是一个矩形区域，你可以在上面使用 JavaScript 绘制形状）：\n\n```\n<body>\n  ...\n  <canvas id=\"\
    chart\"></canvas> ①\n  ...\n</body>\n```\n\n1. ① `<canvas>` 元素需要一个 `id` 属性，以便你在\
    \ JavaScript 代码中引用它。\n\n***\n\n#### 创建图表\n\n每个使用 Chart.js 的 JavaScript 文件都需要在文件顶部导入库：\n\
    \n```\nimport Chart from 'chart.js/auto';\n\n...\n```\n\n使用 Chart.js 的构造函数创建一个图表，传入：\n\
    \n* <canvas> 元素的 id\n* 一个配置对象。\n\n```\nlet chart = new Chart('chart', ①\n  type:\
    \ 'bar', ②\n  data: { ③\n    labels: ['A', 'B', 'C'], ④\n    datasets: [⑤\n  \
    \    {\n        data: [10, 20, 30] ⑥\n      }\n    ]\n  }\n});\n```\n\n列表 7. 使用\
    \ Chart.js 创建条形图\n\n① `Chart` 构造函数绘制图表并返回一个表示图表的对象（赋值给变量 `chart`）。第一个参数是 `<canvas>`\
    \ 元素。② 配置对象必须包含 `type` 和 `data` 两个属性。`type` 属性定义图表类型（见后文）。③ `data` 属性描述图表的数据。对于条形图和折线图，需要\
    \ `labels` 和 `datasets` 两个属性。④ `labels` 定义每个条形的轴标签（或折线图中的每个点）。⑤ `datasets` 描述数据，它是一个数组。⑥\
    \ `datasets` 中的每个对象代表一个数据序列，并必须包含一个名为 `data` 的属性，其值是一个数字数组。这就是数据本身，并决定了每个条形的长度。\n\
    \n如果 `datasets` 包含单个序列（如示例所示），我们得到一个普通的条形图，每个标签对应一个条形。如果 `datasets` 包含多个序列，我们得到分组条形图，每个标签对应多个条形。\n\
    \n***\n\n### 3.1.2 图表配置\n\nChart.js 图表可以通过许多方式进行配置。我们不会涵盖所有的选项，但会涵盖一些实用的。\n\n\
    #### 图表类型\n\n配置对象的 `type` 属性可以是 `'bar'`、`'line'`、`'scatter'`、`'bubble'`、`'pie'`、`'doughnut'`、`'polarArea'`\
    \ 或 `'radar'`。\n\n`'bar'` 用于条形图，`'line'` 用于折线图，`'scatter'` 用于散点图。`'bubble'` 用于散点图，每个圆的半径用于表示另一个变量。`'pie'`\
    \ 用于饼图，`'doughnut'` 用于中间有孔饼图。`'polarArea'` 类似于条形图，但条形位于圆形内。`'radar'` 用于雷达图，它们类似于折线图但经过转换以适应圆形内部。\n\
    \n对于 `'bar'`、`'line'`、`'pie'`、`'doughnut'`、`'polarArea'` 和 `'radar'` 类型，`datasets`\
    \ 属性使用类似的结构。`datasets` 中的每个序列对象都有一个 `data` 属性，其值是一个数字数组。\n\n"
