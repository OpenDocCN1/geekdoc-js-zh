    \ 100.\n\n2. ② Initialise a variable named `list` and assign an empty string to\
    \ it.\n\n3. ③ Iterate through each element of `data`.\n\n4. ④ Append a `div` element\
    \ to `list` containing the name, region and capacity. (The `+=` operator is shorthand\
    \ for `list = list + '<div>' + …`.)\n\n5. ⑤ Select the `<div id=\"output\">` element\
    \ defined in `index.html` and set its content to `list`. The browser will parse\
    \ the string and create the necessary `div` elements to reflect the string `list`.\n\
    \n### style.css\n\n`style.css` contains typography settings that were retained\
    \ from Vite’s default `style.css` file. (`style.css` is imported at the top of\
    \ `main.js`.)\n\n```\nbody {\n  font-family: Inter, Avenir, Helvetica, Arial,\
    \ sans-serif;\n  font-size: 16px;\n  line-height: 24px;\n  font-weight: 400;\n\
    }\n```\n\n***\n\n## 2.4 Wrapping up\n\nThis chapter discussed the role of JavaScript\
    \ when visualising data. It presented an overview of JavaScript charting libraries\
    \ and divided them into two categories: those that provide a selection of standard\
    \ charts and those that provide more flexibility at the cost of a steeper learning\
    \ curve.\n\nWe also looked at a simple project built using Vite. The project loads\
    \ the REPD data and presents a subset of it as a list. This forms the foundation\
    \ for the remaining content in this book.\n\n## 2.5 Ideas for further study\n\n\
    I recommend playing around with the project by exploring, modifying and adding\
    \ code. Here are some ideas:\n\n* display different fields (for example operator\
    \ or status)\n* change the filter to display a different technology type (or change\
    \ the capacity threshold)\n* try displaying your own data (make sure the dataset\
    \ isn’t too large, perhaps don’t go over 10Mb).\n\nVisit the Appendix for solutions.\n\
    \n# 3. Make a Chart with Chart.js\n\nThis chapter introduces the JavaScript charting\
    \ library [Chart.js](https://www.chartjs.org/). This is one of the most popular\
    \ free and open source JavaScript charting libraries. It lets you add bar, line,\
    \ pie and other charts to a web page with relative ease.\n\n![chartjs basic](images/chartjs-basic.png)\n\
    \nFigure 10. Bar chart created with Chart.js\n\nAlthough it’s relatively easy\
    \ to create a chart using Chart.js there’s more to Chart.js than meets the eye.\
    \ Some of the benefits of Chart.js are:\n\n* the charts are very stylable. You\
    \ can set the style of individual elements and adjust the spacing between elements\
    \ which means you can satisfy most styling requirements.\n* the charts are responsive\
    \ to device width meaning that the charts work equally well on larger screens\
    \ and mobile devices.\n* the charts have a built-in tooltip that shows information\
    \ on data points that are hovered by the mouse (or touched on mobile devices).\
    \ The tooltip can be configured to show exactly the information that you’d like\
    \ to show.\n* Chart.js is surprisingly performant. I’ve ran tests where it handles\
    \ hundreds, if not thousands, of data points with ease (see [Chart.js performance\
    \ test](https://codepen.io/createwithdata/pen/mvdQjg)).\n\n![chartjs tennis](images/chartjs-tennis.png)\n\
    \nFigure 11. Example of a styled Chart.js chart ([https://www.createwithdata.com/chartjs-and-csv/](https://www.createwithdata.com/chartjs-and-csv/))\n\
    \nThis chapter shows how to create a simple bar chart using Chart.js. We load\
    \ the REPD data, perform some data basic analysis and create a bar chart to display\
    \ the result.\n\nWe also use the [tidy.js](https://pbeshai.github.io/tidy/) JavaScript\
    \ library which facilitates common data processing operations such as filtering,\
    \ sorting and aggregation. We use tidy.js to aggregate the REPD data before visualising\
    \ it.\n\n***\n\n## 3.1 Introducing Chart.js\n\nChart.js is a free, open-source\
    \ JavaScript library that draws bar, line, scatter, pie and radar charts. It produces\
    \ attractive charts and is reliable, performant, relatively easy to use, well\
    \ documented and well supported. This book uses version 4 of Chart.js.\n\nThis\
    \ section starts by showing how to make a chart with Chart.js. Following this\
    \ an example that uses tidy.js and Chart.js to visualise the REPD data is presented.\n\
    \n### 3.1.1 Making a chart\n\nThere are three steps to creating a chart with Chart.js:\n\
    \n* include Chart.js in your project\n* create an HTML element to contain your\
    \ chart\n* create a new Chart using Chart.js’s constructor function\n\n#### Including\
    \ Chart.js in your project\n\nIf you’re using a bundler such as Webpack, Parcel\
    \ or Vite, Chart.js is installed using:\n\n```\ncd your-project\nnpm install chart.js\n\
    ```\n\n#### Creating a container for a chart\n\nEach chart requires a `<canvas>`\
    \ element (a `<canvas>` element is a rectangular area on which you can draw shapes\
    \ using JavaScript):\n\n```\n<body>\n  ...\n  <canvas id=\"chart\"></canvas> ①\n\
    \  ...\n</body>\n```\n\n1. ① The `<canvas>` element needs an `id` attribute so\
    \ you can reference it in your JavaScript code.\n\n***\n\n#### Creating the chart\n\
    \nEach JavaScript file that uses Chart.js must import the library at the top of\
    \ the file:\n\n```\nimport Chart from 'chart.js/auto';\n\n...\n```\n\nChart.js\
    \ provides a constructor function named `Chart`. To create a chart call `Chart`\
    \ using the `new` operator and pass in:\n\n* the id of the Canvas element\n* a\
    \ chart configuration object.\n\n```\nlet chart = new Chart('chart', { ①\n  type:\
    \ 'bar', ②\n  data: { ③\n    labels: ['A', 'B', 'C'], ④\n    datasets: [ ⑤\n \
    \     {\n        data: [10, 20, 30] ⑥\n      }\n    ]\n  }\n});\n```\n\nListing\
    \ 7. Creating a bar chart with Chart.js\n\n1. ① The constructor function `Chart`\
    \ draws the chart and returns an object that represents the chart (which we assign\
    \ to the `chart` variable). The first argument is the id of the `<canvas>` element.\
    \ The second argument is an object that configures the chart.\n2. ② The configuration\
    \ object must include two properties `type` and `data`. The `type` property defines\
    \ the chart type (see later).\n3. ③ The `data` property describes the chart’s\
    \ data. For bar and line charts two properties `labels` and `datasets` are required.\n\
    4. ④ `labels` defines the axis labels of each bar (or each line point in the case\
    \ of line charts).\n5. ⑤ `datasets` describes the data and is an array of objects.\n\
    6. ⑥ Each object in `datasets` represents a data series and must contain a property\
    \ named `data` whose value is an array of numbers. This is the data itself and\
    \ determines the length of each bar.\n\n![chartjs single series](images/chartjs-single-series.png)\n\
    \nFigure 12. A bar chart created with Chart.js\n\nIf `datasets` contains a single\
    \ series (as in our example) we get a normal bar chart where each label corresponds\
    \ to a single bar. If `datasets` contains more than one series we get a grouped\
    \ bar chart where each label corresponds to multiple bars.\n\n***\n\n### 3.1.2\
    \ Chart configuration\n\nChart.js charts can be configured in many ways. We won’t\
    \ cover all the options but will cover some of the more useful ones.\n\n#### Chart\
    \ type\n\nThe configuration object’s `type` property can be `'bar'`, `'line'`,\
    \ `'scatter'`, `'bubble'`, `'pie'`, `'doughnut'`, `'polarArea'` or `'radar'`.\n\
    \n`'bar'` is used for bar charts, `'line'` for line charts and `'scatter'` for\
    \ scatter plots. `'bubble'` is for scatter plots where the radius of each circle\
    \ is used to represent an additional variable. `'pie'` is for pie charts and `'doughnut'`\
    \ is for pie charts with a hole in the center. `'polarArea'` is similar to a bar\
    \ chart except the bars fit inside a circle. `'radar'` is for radar charts which\
    \ are similar to line charts but transformed to fit inside a circle.\n\nFor `'bar'`,\
    \ `'line'`, `'pie'`, `'doughnut'`, `'polarArea'` and `'radar'` types the `datasets`\
    \ property uses a similar structure. Each series object in `datasets` has a `data`\
    \ property which is an array of numbers.\n"
