  trans: "\n\n本附录展示了如何将 REPD 数据从原始 CSV 下载转换为 `repd.json` JSON 文件。本节并不是为了提供数据清洗的完整教程，但你将学到许多有助于转换你自己数据的技巧。\n\
    \n`wrangling` 目录包含一个 Node.js 项目，用于将原始的 REPD CSV 文件转换为 JSON 文件。\n\n要运行该脚本，请进入 `wrangling`\
    \ 目录，安装 Node 模块并运行脚本：\n\n```\ncd wrangling\nnpm install\nnode index.js\n```\n\n\
    `wrangling` 目录中包含 `repd-january-2023.csv`，该文件是从 [www.gov.uk](https://www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract)\
    \ 下载的。\n\n脚本执行的步骤如下：\n\n1. 加载 CSV 文件。\n2. 使用 `D3` 将转换为 JavaScript 数组。\n3. 执行数据处理。\n\
    4. 将数据保存为 JSON 文件。\n\n***\n\n让我们来看前几行代码，脚本加载 CSV 文件并将其转换为 JavaScript 数组：\n\n```\n\
    const fs = require('fs'); ①\nconst d3 = require('d3'); ②\nconst OSPoint = require('ospoint');\
    \ ③\n\nlet f = fs.readFileSync('repd-january-2023.csv', 'utf8'); ④\nlet data =\
    \ d3.csvParse(f); ⑤\n```\n\n列表 62. `wrangling/index.js`\n\n1. *①* 导入 `fs` 模块。它包含用于读取文件的\
    \ `readFileSync` 方法和用于保存文件的 `writeFileSync` 方法。注意，与书中其他项目不同，我们使用 CommonJS 模块系统来导入模块，这意味着我们使用\
    \ `require` 而不是 `import`。\n2. *②* 导入 `D3.js` 以便使用它的 `csvParse` 方法。这会将 CSV 文本字符串转换为对象数组。\n\
    3. *③* 导入 [`ospoint`](https://www.npmjs.com/package/ospoint) 库，该库可以将英国测量局（Ordnance\
    \ Survey）网格点（北坐标和东坐标）转换为纬度和经度。REPD CSV 文件使用英国测量局东坐标和北坐标来指定每个规划申请的位置，该库帮助我们将其转换为经度和纬度。\n\
    4. *④* 使用 `readFileSync` 加载 REPD CSV 文件。该方法返回一个包含 CSV 的字符串并将其赋值给变量 `f`。\n5. *⑤*\
    \ 使用 `D3` 的 `csvParse` 方法将 CSV 字符串转换为 JavaScript 对象数组。`csvParse` 是一个实用的函数，接收 CSV\
    \ 字符串并将其转换为对象数组。CSV 文件中的每一列都映射每个对象中的一个属性。\n\n***\n\n数组 `data` 是对象数组，其中每个对象代表一个规划申请（或\
    \ CSV 文件中的单行）。每个对象都有属性，每个属性对应于 CSV 文件中的一列。`data` 看起来大致所示：\n\n```\n[\n  {\n   \
    \ 'Old Ref ID': 'N00053B',\n    'Ref ID': '1',\n    'Record Last Updated (dd/mm/yyyy)':\
    \ '07/07/2009',\n    'Operator (or Applicant)': 'RWE npower',\n    'Site Name':\
    \ 'Aberthaw Power Station Biomass',\n    'Technology Type': 'Biomass (co-firing)',\n\
    \    'Storage Type': '',\n    'Storage Co-location REPD Ref ID': '',\n    'Installed\
    \ Capacity (MWelec)': '35',\n    'CHP Enabled': 'No',\n    'RO Banding (ROC/MWh)':\
    \ '',\n    'FiT Tariff (p/kWh)': '',\n    'CfD Capacity (MW)': '',\n    ...\n\
    \  },\n {\n    'Old Ref ID': 'AA110',\n    'Ref ID': '2',\n    'Record Last Updated\
    \ (dd/mm/yyyy)': '20/11/2017',\n    'Operator (or Applicant)': 'Orsted (formerly\
    \ Dong Energy) / Peel Energy',\n    'Site Name': 'Hunterston - cofiring',\n  \
    \  'Technology Type': 'Biomass (co-firing)',\n    'Storage Type': '',\n    'Storage\
    \ Co-location REPD Ref ID': '',\n    'Installed Capacity (MWelec)': '170',\n \
    \   'CHP Enabled': 'No',\n    'RO Banding (ROC/MWh)': '',\n    'FiT Tariff (p/kWh)':\
    \ '',\n    'CfD Capacity (MW)': '',\n    ...\n  }\n  ...\n]\n```\n\n我们并没有使用所有这些属性，因此脚本将挑选出书中图表所需的属性。每个规划申请都有一个位置，但它是使用英国测量局的东坐标和北坐标指定的。使用经纬度更为常见（例如，`Leaflet`\
    \ 使用的就是这种方式），因此我们将每对东坐标/北坐标转换为纬度和经度。我们还重命名了属性以使用更短的名称，这使得我们的项目代码更清晰且更容易编写。\n\n\
    ***\n\n注意，数字是用字符串表示的。例如，查看上方代码段中的 `'Installed Capacity (MWelec)'` 属性，其值为 `'35'`\
    \ 和 `'170'`。因此，将有一个额外的步骤将这些字符串转换为数字。\n\n现在我们已经将 CSV 数据转换成了对象数组，并将对它进行遍历：\n\n```javascript\n\
    // 遍历数据的逻辑\n```\n\n列表 63. `wrangling/index.js`\n\n"
- fmt: "\n1. ① Create a date parser using D3’s `utcParse` method. We pass in the format\
    \ of dates in the CSV data (e.g. `28/10/2015`). `utcParse` returns a function\
    \ that accepts a date string in the specified format and returns a JavaScript\
    \ date object. We use `utcParse` instead of D3’s `timeParse` so that the parsing\
    \ is independent of daylight saving time. (The date doesn’t have a time, so 12am\
    \ is assumed.)\n\n2. ② Parse the application submission date and assign it to\
    \ the `dateSubmitted` variable.\n\n3. ③ If it’s a valid date, assign its year\
    \ to the `yearSubmitted` property.\n\n4. ④ If it’s a valid date, assign its ISO\
    \ representation to the `dateSubmitted` property.\n\n5. ⑤ Parse the application\
    \ granted date and assign it to the `dateGranted` variable.\n\n6. ⑥ If it’s a\
    \ valid date, assign its year to the `yearGranted` property.\n\n7. ⑦ Compute the\
    \ number of days between `'dateSubmitted'` and `'dateGranted'` and assign to the\
    \ `daysUntilGranted` property. We use D3’s `timeDay.count` method to compute the\
    \ number of days between two date objects. (There are cases where the granted\
    \ date is before the submission date. If this is the case we don’t do this computation.)\n\
    \n***\n\nSome applications don’t have a valid submission date. It’s not obvious\
    \ what to do in these cases and in order to keep things simple for teaching purposes\
    \ I exclude them:\n\n```javascript\n// Exclude applications w/out a submission\
    \ date\noutput = output.filter(d => d.dateSubmitted !== null); ①\n\n// Just keep\
    \ year submitted up to and including Dec 2022\noutput = output.filter(d => d.yearSubmitted\
    \ < 2023); ②\n\nfs.writeFileSync('./repd.json', JSON.stringify(output, null, 2));\
    \ ③\n```\n\nListing 67. wrangling/index.js\n\n1. ① Exclude applications without\
    \ a submission date.\n\n2. ② The visualisations only display data until until\
    \ the end of 2022 so exclude applications that were submitted after 2022.\n\n\
    3. ③ Use `JSON.stringify` to convert the array of data `output` into a JSON string\
    \ representation and save it to `repd.json` using the `writeFileSync` method.\
    \ `JSON.stringify` takes one argument plus two optional arguments. The first argument\
    \ is the array and the third argument is the number of indentation spaces. We\
    \ set the indentation to 2 to make the file human readable. Setting it to zero\
    \ (or omitting the optional arguments) eliminates whitespace in the JSON string\
    \ and results in a smaller file size. `writeFileSync` takes two arguments, a filename\
    \ and a string. It opens or creates the file and writes the string to it.\n\n\
    ***\n\nWhen the script is run using `node index.js` it processes the data and\
    \ writes to `repd.json`. `repd.json` looks like:\n\n```json\n[\n  {\n    \"id\"\
    : \"1\",\n    \"name\": \"Aberthaw Power Station Biomass\",\n    \"technology\"\
    : \"Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"lon\": -3.407,\n    \"\
    lat\": 51.387,\n    \"region\": \"Wales\",\n    \"status\": \"Operational\",\n\
    \    \"operator\": \"RWE npower\",\n    \"yearSubmitted\": 2004,\n    \"dateSubmitted\"\
    : \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\": 2004,\n    \"daysUntilGranted\"\
    : 140\n  },\n  {\n    \"id\": \"2\",\n    \"name\": \"Hunterston - cofiring\"\
    ,\n    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\": 170,\n    \"\
    lon\": -4.889,\n    \"lat\": 55.736,\n    \"region\": \"Scotland\",\n    \"status\"\
    : \"Application Withdrawn\",\n    \"operator\": \"Orsted (formerly Dong Energy)\
    \ / Peel Energy\",\n    \"yearSubmitted\": 2010,\n    \"dateSubmitted\": \"2010-06-02T00:00:00.000Z\"\
    ,\n    \"yearGranted\": null,\n    \"daysUntilGranted\": null\n  },\n  ...\n]\n\
    ```\n\nListing 68. wrangling/index.js\n\n# Appendix D: Exercise hints and solution\
    \ ideas\n\nThis appendix contains hints and solution ideas for the 'Ideas for\
    \ Further Study' sections.\n\n## D.1 JavaScript and Data Visualisation\n\n###\
    \ D.1.1 Display different fields (for example operator and/or status)\n\nTo add\
    \ the `operator` property to the table:\n\n```javascript\nlet list = '';\ndata.forEach(d\
    \ => {\n  list += '<div>' + d.name + ' (' + d.operator + ') ' + d.region + ' '\
    \ + d.capacity + 'MW</div>';\n});\n```\n\nListing 69. load-data/main.js\n\n###\
    \ D.1.2 Change the filter to display a different technology type and change the\
    \ capacity threshold\n\nTo show solar applications with a capacity over 50 MW:\n\
    \n```javascript\n// Filter\ndata = data.filter(d => d.technology === \"Solar Photovoltaics\"\
    \ && d.capacity > 50);\n```\n\nListing 70. load-data/main.js\n\n### D.1.3 Try\
    \ displaying your own data (make sure the dataset isn’t too large, perhaps don’t\
    \ go over 10Mb)\n\nMake sure your data is in long format and saved as JSON. Also\
    \ make sure numeric data are numbers (rather than strings with quote marks) in\
    \ the JSON. The Data Wrangling section in the Appendix shows how the REPD CSV\
    \ file was transformed into `repd.json` and it contains some handy tips on data\
    \ transformation.\n\n***\n\n## D.2 Make a Chart with Chart.js\n\n### D.2.1 Show\
    \ the number of applications per region (instead of technology) and sort the bars\
    \ alphabetically\n\nModify the tidy.js code to count regions instead of technology\
    \ types:\n\n```javascript\nimport { tidy, count, sort } from '@tidyjs/tidy';\n\
    \n  ...\n\n  let summary = tidy(\n    data,\n    count('region'), ①\n    sort('region')\
    \ ②\n  );\n\n  const myChart = new Chart('chart', {\n    type: 'bar',\n    data:\
    \ {\n      labels: summary.map(d => d.region), ③\n      datasets: [{\n       \
    \ data: summary.map(d => d.count),\n      }]\n    },\n    options: {\n  }\n});\n\
    ```\n\nListing 71. chart/main.js\n\n1. ① Change `technology` to `'region'`.\n\
    2. ② Add `sort` to sort alphabetically.\n3. ③ Use `region` for the labels.\n\n\
    ***\n\n### D.2.2 Change the bar colour to `steelblue`\n\n```javascript\ndata:\
    \ {\n    labels: summary.map(d => d.region),\n    datasets: [{\n      data: summary.map(d\
    \ => d.count),\n      backgroundColor: 'steelblue' ①\n    }]\n},\n```\n\nListing\
    \ 72. chart/main.js\n\n1. ① To set the bar colour use the `backgroundColor` option\
    \ in the series object.\n\n***\n\n## D.3 Custom Charts with D3.js\n\n### D.3.1\
    \ Show regions along the y-axis\n\nCreate an array `regionValues` of unique region\
    \ names and pass it into `yScale` as the domain:\n\n```javascript\n// y scale\n\
    let regionValues = tidy( ①\n  data,\n  count('region'), ②\n  sort('region') ③\n\
    ).map(d => d.region); ④\n\nlet yLength = height - topMargin - bottomMargin;\n\n\
    let yScale = scalePoint()\n    .domain(regionValues) ⑤\n    .range([0, yLength]);\n\
    ```\n\nListing 73. d3-dot/main.js\n\n1. ① Change `technologyValues` to `regionValues`.\n\
    2. ② Count regions instead of technologies.\n3. ③ Sort by region instead of technology.\n\
    4. ④ Extract the region name instead of technology.\n5. ⑤ Use `regionValues` for\
    \ the `yScale` domain.\n\nSet each circle’s `cy` attribute according to the `region`\
    \ property:\n\n```javascript\n.attr('cx', d => xScale(d.dateSubmitted))\n.attr('cy',\
    \ d => yScale(d.region)) ①\n.attr('r', d => rScale(d.capacity))\n```\n\nListing\
    \ 74. d3-dot/main.js\n\n1. ① Use region instead of technology to determine the\
    \ `cy` attribute.\n\n***\n\n### D.3.2 Change the colour scheme so that Battery\
    \ applications are coloured in purple and everything else in grey\n\nSet the circle\
    \ fill and stroke according to the technology property:\n\n```javascript\n.attr('r',\
    \ d => rScale(d.capacity))\n.style('fill', d => d.technology === 'Battery' ? 'purple'\
    \ : '#aaa') ①\n.style('stroke', d => d.technology === 'Battery' ? 'purple' : '#aaa')\
    \ ①\n```\n\nListing 75. d3-dot/main.js\n\n1. ① If technology is Battery, use purple\
    \ otherwise use grey.\n\n### D.3.3 Add more information to the tooltip\n\nAdd\
    \ the operator and region to the tooltip.\n"
