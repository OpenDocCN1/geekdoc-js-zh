  trans: "\n[content]\n\n### 3. `options` 对象（见后文）。\n\n我们将在下一页查看 `options` 对象。\n\n\
    ```\n{\n  indexAxis: 'y',\n  scales: {\n    x: {\n      title: {\n        display:\
    \ true,\n        text: 'Number of applications',\n        color: '#eee' ①\n  \
    \    },\n      ticks: {\n        color: '#ccc' ②\n      },\n      grid: {\n  \
    \      color: '#555' ③\n      }\n    },\n    y: {\n      ticks: {\n        color:\
    \ '#ccc' ②\n      },\n      grid: {\n        color: '#333' ③\n      }\n    }\n\
    \  },\n  plugins: {\n    title: {\n      text: 'Number of planning applications\
    \ (by technology) 1990-2022',\n      color: '#ccc' ④\n    }\n  }\n}\n```\n列表 21.\
    \ `chartjs-various/main.js`\n\n1.  `①` 将 x 轴标题设置为浅灰色，以便在深色背景上显示。\n2.  `②` 将坐标轴刻度设置为浅灰色，以便它们在深色背景上显示。\n\
    3.  `③` 将网格线设置为浅灰色，以便它们在深色背景上显示。\n4.  `④` 将图表标题设置为浅灰色，以便其在深色背景上显示。\n\n## 4.4.\
    \ 图表 3（多折线图）\n\n图 3 是一个多折线图。对于每种技术类型，线条显示了随时间变化的规划申请数量。x 轴代表年份，y 轴代表申请数量。\n\n\
    ![chartjs styled 3](img/chartjs-styled-3.png)\n\n图 22. 多折线图\n\n`drawChart3` 函数绘制此图表。图表本身与之前的类似。然而，挑战在于将\
    \ REPD 数据转换为系列数组。\n\n我们使用了一个辅助函数 `getMultiSeriesChartData`（定义在 `main.js` 顶部），它接受三个参数：\n\
    \n1.  REPD 数据数组。\n2.  定义每个系列名称的 `data` 属性。\n3.  定义坐标轴标签的 `data` 属性。\n\n对于此图表，每个系列是一种技术类型且\
    \ x 轴代表提交年份，我们调用：\n\n```\ngetMultiSeriesChartData(data, 'technology', 'yearSubmitted');\n\
    ```\n\n此返回一个如下所示的对象：\n\n```\n{\n  labels: [1990, 1991, 1992, ... 2020, 2021, 2022],\
    \ ①\n  datasets: [ ②\n    {\n      label: \"Advanced Conversion Technologies\"\
    ,\n      data: [0, 0, 0, ... 0, 0, 0] ③\n    },\n    {\n      label: \"Anaerobic\
    \ Digestion\",\n      data: [0, 0, 0, ... 10, 17, 22] ③\n    }\n    ,\n    ...\n\
    \  ]\n}\n```\n\n1.  `①` `labels` 中的每个值代表主轴上的一个名称。\n2.  `②` `datasets` 中的每个对象代表特定技术类型的系列。\n\
    3.  `③` 系列中 `data` 数组的值是给定技术类型和相应年份的规划申请数量。例如，厌氧消化（Anaerobic Digestion）2020 年有\
    \ 10 个规划申请，2021 年有 17 个，2022 年有 22 个。如果图表类型为 `line`，这些数据将生成一个多折线图，年份沿主轴显示，每种技术类型由线条表示。\n\
    \n我们将 `getMultiSeriesChartData` 的输出赋值给 `chartData`，并将其作为 Chart.js 配置对象中 `data`\
    \ 属性的值：\n\n```\nfunction drawChart3(data) {\n  let chartData = getMultiSeriesChartData(data,\
    \ 'technology', 'yearSubmitted'); ①\n\n  ...\n\n  const myChart = new Chart('chart-3',\
    \ {\n    type: 'line',\n    data: chartData, ②\n    options: { ... }\n  });\n\n\
    \  ...\n}\n```\n列表 22. `chartjs-various/main.js`\n\n1.  `①` 将 `getMultiSeriesChartData`\
    \ 的返回值赋值给 `chartData`。\n2.  `②` 将图表的 `data` 属性设置为 `chartData`。\n\n出于本书的考虑，你不需要理解\
    \ `getMultiSeriesChartData`，但如果你对它的工作原理感兴趣，请访问书末附录中的“getMultiSeriesChartData’。\n\
    \n让我们完整查看 `drawChart3`：\n\n```\nfunction drawChart3(data) {\n  let chartData =\
    \ getMultiSeriesChartData(data, 'technology', 'yearSubmitted'); ①\n\n  // 为每个系列添加样式\n\
    \  chartData.datasets.forEach(series => { ②\n    let color = technologyPalette[series.label]\
    \ || '#aaa'; ③\n    series.borderColor = color; ④\n    series.borderWidth = 1.5;\
    \ ④\n    series.backgroundColor = color; ⑤\n    series.radius = 2; ⑥\n  });\n\n\
    \  const myChart = new Chart('chart-3', { ⑦\n    type: 'line', ⑧\n    data: chartData,\
    \ ⑨\n    options: { ⑩\n      scales: {\n        x: {\n          title: {\n   \
    \         display: true,\n            text: 'Year'\n          }\n        },\n\
    \        y: {\n          title: {\n            display: true,\n            text:\
    \ 'Number of applications'\n          }\n        }\n      },\n      plugins: {\n\
    \        title: {\n          text: 'Number of planning applications (by technology)\
    \ 1990-2022',\n        },\n        legend: {\n          display: true\n      \
    \  }\n      }\n    }\n  });\n}\n```\n列表 23. `chartjs-various/main.js`\n\n1.  `①`\
    \ 调用 `getMultiSeriesChartData` 构建图表。第二个参数定义了用于系列的属性（'technology'），第三个参数定义了主轴属性（'yearSubmitted'）。\n\
    2.  `②` 遍历 `chartData.datasets` 并添加样式，使图中每条线条按技术类型着色。\n3.  `③` 使用 `technologyPalette`\
    \ 查找颜色。如果没有定义颜色则退到灰色。\n4.  `④` `borderColor` 设置线条颜色，`borderWidth` 设置线条宽度。\n5.\
    \  `⑤` `backgroundColor` 设置数据点的颜色。\n6.  `⑥` `radius` 设置数据点的半径。\n7.  `⑦` 调用 `new\
    \ Chart()` 构建图表并传入 `<canvas>` 元素的 id 和配置对象。\n8.  `⑧` 在配置对象中将 `type` 设置为 `'line'`\n\
    9.  `⑨` 将 `data` 属性设置为数据对象 `chartData`。它是通过 `getMultiSeriesChartData` 创建的。\n10.\
    \ `⑩` 最后设置坐标轴标题、图表标题和图例。\n\n## 4.5. 图表 4（堆叠柱状图）\n\n图 4 是一个堆叠柱状图，显示了每个地区的规划申请数量。每个柱子按技术类型细分。这允许读者查看每个地区不同技术类型的规划申请分布。例如，一眼就能看出苏格兰的风能相关申请比任何其他地区都多。\n\
    \n`drawChart4` 函数绘制此图表，工作原理与 `drawChart3` 类似，但现在每个数据系列对应一组相同颜色的水平切片。例如，代表太阳能光伏（Solar\
    \ Photovoltaics）的系列由通过每个柱子的黄色切片表示。\n\n与 `drawChart3` 一样，它调用了 `getMultiSeriesChartData`，但这次坐标轴标签属性是\
    \ `region`：\n\n```\nlet chartData = getMultiSeriesChartData(data, 'technology',\
    \ 'region');\n```\n"
