    \ This has a handy chapter that explains which charts are most effective at conveying\
    \ data based on academic understanding of human perception. In short it’s best\
    \ to use position and length to represent data (rather than direction, area and/or\
    \ shade) because we are able to perceive differences in position and length better\
    \ than other encodings. This is one of the reasons bar, line and scatter charts\
    \ are so prevalent.\n\nThat’s not to say non-standard charts are ineffective.\
    \ So long as the important quantities are represented using position and length\
    \ custom charts can also be effective at conveying data.\n\n## 2.2\\. JavaScript\n\
    \nJavaScript is the programming language of the web and is implemented in all\
