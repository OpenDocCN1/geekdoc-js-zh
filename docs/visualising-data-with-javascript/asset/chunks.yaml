  trans: "\n\n```json\n[\n  {\n    \"id\": \"1\",\n    \"name\": \"Aberthaw Power\
    \ Station Biomass\",\n    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\"\
    : 35,\n    \"lon\": -3.407,\n    \"lat\": 51.387,\n    \"region\": \"Wales\",\n\
    \    \"status\": \"Operational\",\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\"\
    : 2004,\n    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\"\
    : 2004,\n    \"daysUntilGranted\": 140\n  },\n  {\n    \"id\": \"2\",\n    \"\
    name\": \"Hunterston - cofiring\",\n    \"technology\": \"Biomass (co-firing)\"\
    ,\n    \"capacity\": 170,\n    \"lon\": -4.889,\n    \"lat\": 55.736,\n    \"\
    region\": \"Scotland\",\n    \"status\": \"Application Withdrawn\",\n    \"operator\"\
    : \"Orsted (formerly Dong Energy) / Peel Energy\",\n    \"yearSubmitted\": 2010,\n\
    \    \"dateSubmitted\": \"2010-06-02T00:00:00.000Z\",\n    \"yearGranted\": null,\n\
    \    \"daysUntilGranted\": null\n  },\n  ...\n]\n```\n\n非整洁（或称“宽格式”）数据的一个示例是数据表格的列标题包含年份（例如\
    \ 2000, 2001, 2002 等）：\n\n|st | 2020 | 2021 | 2022 |\n| --- | --- | --- | ---\
    \ |\n| 食品 | 1234 | 1343 | 1542 |\n| 服物 | 431 | 522 | 467 |\n\n2020、2021 和 2022\
    \ 并不是变量。它们实际上是变量 `year` 的值。此外，每行代表 3 个观测值，而不是单个观测值。\n\n该数据的整洁（或称“长格式”）版本是：\n\n\
    | 类别 | 年份 | 金额 |\n| --- | --- | --- |\n| 食品 | 2020 | 1234 |\n| 食品 | 2021 | 1343\
    \ |\n| 食品 | 2022 | 1542 |\n| 服物 | 2020 | 431 |\n| 服物 | 2021 | 522 |\n| 服物 | 2022\
    \ | 467 |\n\n现在每一列都是一个变量，每行都是一个观测值（例如，第一行是 2020 年食品类别的金额为 1234 的观测值）。\n\n***\n\
    \n### 3.2.3. 如何使用 tidy.js\n\n使用 tidy.js 处理数据时，调用 `tidy` 函数并将数据数组作为第一个参数传递。该数组需要是整洁格式，因此每个观测值由单个数组元素表示。\n\
    \n处理操作（如 `filter`、`sort`、`rename` 和 `count`）作为额外参数传递给 `tidy`。例如，让我们按状态过滤 REPD\
    \ 数据（`data`），然后统计每个技术的申请数量：\n\n```\nimport { tidy, filter, count } from '@tidyjs/tidy';\n\
    \nlet summary = tidy(\n  data,\n  filter(d => d.status === 'Operational'),\n \
    \ count('technology')\n);\n```\n\n`tidy` 函数返回一个新的数组。在这种情况下，它是一个摘要数组：\n\n```json\n\
    [\n  {\n    \"technology\": \"Biomass (co-firing)\",\n    \"n\": 3\n  },\n  {\n\
    \    \"technology\": \"EfW Incineration\",\n    \"n\": 56\n  },\n  {\n    \"technology\"\
    : \"Biomass (dedicated)\",\n    \"n\": 78\n  },\n  {\n    \"technology\": \"Advanced\
    \ Conversion Technologies\",\n    \"n\": 18\n  },\n  ...\n]\n```\n\n理解 `tidy`\
    \ 会创建一个新数组（它不会修改原始数组）是非常重要的。\n\n***\n\n### 3.2.4. 常见的 tidy.js 操作\n\ntidy.js 拥有大量执行各种数据处理或分析任务的函数。本书中使用的函数有：`filter`、`rename`、`mutate`、`sort`、`count`\
    \ 和 `groupBy`。\n\n#### filter\n\n`filter` 函数根据传入的函数过滤数据过滤。它类似于 JavaScript 的数组方法\
    \ `filter`。\n\n这里有几个例子：\n\n```\nimport { tidy, filter } from '@tidyjs/tidy';\n\
    \n// 获取所有正在运行的申请：\ntidy(\n  data,\n  filter(d => d.status === 'Operational')\n\
    )\n\n// 获取容量大于 100 的申请：\ntidy(\n  data,\n  filter(d => d.capacity > 100)\n)\n\
    ```\n\n***\n\n#### rename\n\n`rename` 重命名数组中每个项的属性。（在表格术语中，这等于重命名列。）你传递一个对象，其中每个属性的键是当前名称。\n\
    \n以下示例将 `status` 重命名为 `Application status`：\n\n```javascript\nimport { tidy, rename\
    \ } from '@tidyjs/tidy';\n\ntidy(\n  data,\n  rename({status: 'Application status'})\n\
    )\n```\n\n#### mutate\n\n`mutate` 函数为数组中的每个项创建一个新属性。它用于转换数据。\n\n这里有几个例子：\n\n```javascript\n\
    import { tidy, mutate } from '@tidyjs/tidy';\n\n// 添加新属性 isCapacity\ntidy(\n \
    \ data,\n  mutate({isCapacity: d => d.capacity > 1000})\n)\n\n// 转换 dateSubmitted\n\
    tidy(\n  data,\n  mutate({dateSubmitted: new Date()})\n)\n```\n\n#### sort\n\n\
    `sort` 函数根据给定的属性名称对数据进行排序。默认按升序排序。要降序排序，用 `desc` 包裹属性名称。\n\n这里有几个例子：\n\n```javascript\n\
    import { tidy, sort, desc } from '@tidyjs/tidy';\n\n// 按容量排序（升序）\ntidy(\n  data,\n\
    \  sort('capacity')\n)\n\n// 按容量排序（降序）\ntidy(\n  data,\n  desc('capacity')\n)\n\
    ```\n\n***\n\n#### count\n\n`count` 函数是一种聚合操作，根据属性对数据进行分组并计算每个组的大小。它返回一个对象数组，每个对象包含组名和一个用于计数的属性\
    \ `n`。\n\n要降序排序结果，请作为第二个参数传递对象 `{sort: true}`。\n\n```javascript\nimport { tidy,\
    \ count } from '@tidyjs/tidy';\n\n// 统计每种技术的申请数量\ntidy(\n  data,\n  count('technology',\
    \ {sort: true})\n)\n```\n\n***\n\n#### groupBy\n\n`groupBy` 函数根据给定属性对数据进行分组对其进行操作。这对于在数据集上执行聚合操作（如和、平均值、中位数、最小值和最大值）非常有用。\n\
    \n例如，你可以计算每种技术的计数和平均（mean）容量：\n\n```javascript\nimport { tidy, groupBy, n, mean,\
    \ desc } from '@tidyjs/tidy';\n\n// 按技术分组，并计算每个组的申请数量和平均容量\ntidy(\n  data,\n \
    \ groupBy('technology', [\n    summarize({\n      count: n(),\n      meanCapacity:\
    \ mean('capacity')\n    })\n  ]),\n  sort(desc('meanCapacity'))\n)\n```\n\n"
