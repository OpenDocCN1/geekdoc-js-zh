  trans: "\n\n* 它内置了一个 Web 服务器，方便你在开发应用程序时使用\n* 它运行速度快\n* 它的 Web 服务器可以提供静态文件（这对于加载\
    \ CSV 和 JSON 文件非常有用）\n\n通常情况下，我建议任何规模的 Web 应用都使用 `Vite`。\n\n书中的所有项目都是使用 `Vite`\
    \ 创建的。使用 `Vite` 创建项目相对简单，但为了本书的目的，你不需要自己动手操作。不过，如果你想知道如何使用 `Vite` 创建项目，请参阅附录 A。\n\
    \n* *\n\n### 2.3.5. 示例应用程序\n\n我们的第一个项目加载 REPD 数据，对其进行过滤，然后以列表的形式显示：\n\n![加载数据](img/load-data.png)\n\
    \n要运行该项目，打开命令行并导航到下载代码的 `load-data` 目录。输入 `npm install` 下载项目依赖，然后输入 `npm run dev`\
    \ 启动项目的 Web 服务器：\n\n```\ncd load-data\nnpm install\nnpm run dev\n```\n\n运行 `npm\
    \ run dev` 时，命令行将返回一个包含可访问 URL 的消息（通常是 [`http://localhost:5173/`](http://localhost:5173/)`）。复制该\
    \ URL 并粘贴到浏览器中，你应该就能看到来自 REPD 数据的电池规划应用列表（见前面的图）。\n\n#### 项目概述\n\n该项目具有以下文件结构：\n\
    \n```\nload-data/\n  index.html\n  main.js\n  node_modules/\n    ...\n  package-lock.json\n\
    \  package.json\n  public/\n    repd.json\n  style.css\n```\n\n列表 2. load-data\
    \ 项目文件\n\n主文件是 `index.html`、`main.js`、`style.css` 和 `repd.json`。这个项目与书中的其他项目有很多共同之处，因此值得深入了解这个项目。我建议在你喜欢的代码编辑器（例如\
    \ `VS Code`）中查看此项目。\n\n* *\n\n以下是文件的简要描述：\n\n| 文件 | 说明 |\n| --- | --- |\n| `index.html`\
    \ | 主 HTML 文件。它包含静态内容以及用于存放 JavaScript 生成内容的容器元素。 |\n| `main.js` | 主 JavaScript\
    \ 文件。它加载 REPD 数据，对其进行过滤并构建列表。 |\n| `node_modules` | 包含第三方模块（如 `Chart.js` 或 `D3`）的目录。这是由\
    \ `npm install` 创建的标准目录。你通常不需要关心这个目录，因此我们不会再关注它。 |\n| `package-lock.json` | 由\
    \ `npm install` 创建的文件，记录了安装的第三方模块的精确版本。你通常不需要关心这个文件，因此我们不会再关注它。 |\n| `package.json`\
    \ | 由 `npm init` 创建的文件，包含项目配置。例如，它列出了安装的第三方模块（如 `Chart.js` 和 `D3`）。你通常不需要关心这个文件，因此我们不会再关注它。\
    \ |\n| `public` | 作为服务器根目录的目录。你可以将静态文件放在这里（如 CSV 文件），应用程序可以请求这些文件。 |\n| `style.css`\
    \ | 主 CSS 文件。 |\n\n`load-data` 项目源自 `Vite` 的默认计数器项目（见附录 A）。让我们详细详细检查这些文件。\n\n\
    * *\n\n##### index.html\n\n这是主 HTML 文件，也是 Web 浏览器在加载网站时加载的第一个文件。该文件的大部分内容与 `Vite`\
    \ 的默认 HTML 文件相同。通常来说，我们在书中对 `index.html` 所的修改只有：\n\n* 更改 `<title>` 的内容\n* 在 `<body>`\
    \ 部分添加、删除或修改 HTML。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\" />\n    <title>REPD battery applications</title> ①\n  </head>\n\
    \  <body>\n    <div id=\"output\"></div> ②\n    <script type=\"module\" src=\"\
    /main.js\"></script> ③\n  </body>\n</html>\n```\n\n列表 3. index.html\n\n1. ① 显示在浏览器标签页中的标题是使用\
    \ `<title>` 标签设置的。\n2. ② 作为列表容器的 `<div>` 元素。我们在 `main.js` 中填充该元素的内容。\n3. ③ 使用\
    \ `<script>` 标签引入了主 JavaScript 文件 `main.js`。此行由 `Vite` 生成，通常我们不需要触碰它。\n\n* *\n\
    \n##### main.js\n\n`main.js` 是该项目中唯一的 JavaScript 文件。它加载数据并生成列表。为了加载数据，它使用了 JavaScript\
    \ Promise（承诺），这是一种相当高级的技术。如果你不熟悉 Promise，不用太担心，因为它们只用于加载数据，而且这段代码在整书中大部分都是保持的。\n\
    \n以下是 `main.js` 的概要：\n\n```javascript\nimport './style.css'; ①\n\nfunction makeList(data)\
    \ { ... }\n\nfetch('./repd.json') ②\n  .then(res => res.json()) ③\n  .then(data\
    \ => makeList(data)); ④\n```\n\n列表 4. main.js\n\n1. ① 导入 `./style.css`。\n2. `fetch('./repd.json')`\
