    \n### 5.3.4. Scale functions\n\nScale functions let you transform data variables\
    \ into visual variables such as position and colour. For example the REPD data\
    \ has years varying between 1990 and 2021. If you’d like to build a timeline that’s\
    \ 1000 pixels long you can create a scale function that accepts a year and outputs\
    \ a value between 0 and 1000.\n\nD3 has several scale types, the most common of\
    \ which are `scaleLinear`, `scaleSqrt`, `scaleTime` and `scalePoint`. For each\
    \ scale type D3 provides a constructor function. The typical usage pattern is:\n\
    \n* call the scale constructor. This returns a scale function.\n* set the scale’s\
    \ domain by calling the scale function’s `domain` method. The domain is the scale\
    \ function’s minimum and maximum input value.\n* set the scale’s range by calling\
    \ the scale function’s `range` method. The range is the scale function’s minimum\
    \ and maximum output value.\n\nHere’s an example where we create a linear scale:\n\
    \n```\nimport { scaleLinear } from 'd3-scale';\n\nlet myScale = scaleLinear()\
    \ ①\n  .domain([0, 100]) ②\n  .range([0, 500]); ③\n```\n\n1. ① Call a scale constructor\
    \ to create and return a scale function.\n2. ② Call the scale’s `domain` method\
    \ to set its domain (its minimum and maximum input).\n3. ③ Call the scale’s `range`\
    \ method to set its range (its minimum and maximum output).\n\n`myScale` is linear\
    \ scale function that accepts values between 0 and 100 and outputs values between\
    \ 0 and 500. It linearly maps between the domain and range. This means that an\
    \ input value that’s a proportion `u` along the domain is mapped to the value\
    \ that’s a proportion `u` along the range.\n\nFor example:\n\n```\nmyScale(0);\
    \ // returns 0\nmyScale(100); // returns 500\nmyScale(50); // returns 250\n```\n\
    \n`scaleTime` is similar to `scaleLinear` but its domain is an array of dates:\n\
    \n```\nimport { scaleTime } from 'd3-scale';\n\nlet timeScale = scaleTime()\n\
    \  .domain([new Date(2016, 0, 1), new Date(2017, 0, 1)])\n  .range([0, 700]);\n\
    \ntimeScale(new Date(2016, 0, 1));   // returns 0\ntimeScale(new Date(2016, 6,\
    \ 1));   // returns 348.00...\ntimeScale(new Date(2017, 0, 1));   // returns 700\n\
    ```\n\nWe use `scaleTime` in the REPD dot plot example to compute the x-coordinate\
    \ of each circle.\n\n`scalePoint` accepts an array of categorical values as its\
    \ domain and distributes the values across the range:\n\n```\nlet pointScale =\
    \ scalePoint()\n  .domain(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'])\n  .range([0, 500]);\n\
    \npointScale('Mon');  // returns 0\npointScale('Tue');  // returns 125\npointScale('Fri');\
    \  // returns 500\n```\n\nWe use `scalePoint` in the REPD dot plot example to\
    \ compute the y-coordinate of each circle.\n\n***\n\n`scaleSqrt` is useful when\
    \ sizing circles proportionally to a variable:\n\n```\nlet sqrtScale = scaleSqrt()\n\
    \  .domain([0, 100])\n  .range([0, 30]);\n\nsqrtScale(0);   // returns 0\nsqrtScale(50);\
    \  // returns 21.21...\nsqrtScale(100); // returns 30\n```\n\nWe use `scaleSqrt`\
    \ in the REPD dot plot example to compute the radius of each circle.\n\n### 5.3.5.\
    \ Axes\n\nThe `d3-axis` module helps you draw axes. To draw an axis:\n\n* create\
    \ an SVG `<g>` element to act as a container for the axis. You also need to position\
    \ it appropriately using a `transform` attribute\n* create an axis generator by\
    \ calling `axisLeft`, `axisRight`, `axisBottom` or `axisTop` and passing in a\
    \ scale function\n* select the axis container and use the selection’s `.call`\
    \ method to call the axis generator.\n\nThere are four types of axis depending\
    \ on which side of a chart it’s for. For example `axisLeft` is used for a y axis\
    \ on the left side of a chart.\n\nAs an example let’s make an x axis. First add\
    \ an SVG `<g>` element to act as a container for the axis. Notice we’ve translated\
    \ it so the axis isn’t clipped against the top and left boundaries of the viewport:\n\
    \n```\n<svg>\n  <g class=\"x-axis\" transform=\"translate(100,100)\"></g>\n</svg>\n\
    ```\n\n***\n\nIn JavaScript we create a scale function and pass it into `axisBottom`:\n\
    \n```\nimport { select } from 'd3-selection';\nimport { scaleLinear } from 'd3-scale';\n\
    \nlet scale = scaleLinear()\n  .domain([0, 100])\n  .range([0, 500]);\n\nlet axis\
    \ = axisBottom(scale);\n\nselect(\"svg\")\n  .append(\"g\")\n  .attr(\"class\"\
    , \"x-axis\")\n  .attr(\"transform\", \"translate(0,500)\")\n  .call(axis);\n\
    ```\n\nWait, the source text for the code above was a bit jumbled. Let me re-format\
