    \ { select } from 'd3-selection';\n\n// select the svg element\nselect('svg');\n\
    \n// select the first circle\nselect('circle');\n```\n\nYou can also create a\
    \ selection containing **multiple elements** using `selectAll`. This finds all\
    \ matching elements:\n\n```\nimport { selectAll } from 'd3-selection';\n\n// select\
    \ all the circles\nselectAll('circle');\n```\n\n* * *\n\nYou can select child\
    \ elements of a selection by **chaining** `select` or `selectAll`. Here’s an example\
    \ where we make a single selection of the `<svg>` element then select all the\
    \ `<circle>` elements within it:\n\n```\nimport { select } from 'd3-selection';\n\
    \n// select all circles that are children of the svg element\nselect('svg')\n\
    \  .selectAll('circle');\n```\n\nThis is known as a **nested selection** and is\
    \ important when joining data (see later).\n\nA selection is basically an array\
    \ of DOM elements but selections have a number of methods that let you modify\
    \ the selection’s elements. Two of the most common methods are `.style` and `.attr`\
    \ which let you modify the style and attributes of the elements:\n\n```\nimport\
    \ { select } from 'd3-selection';\n\nselect('svg') ①\n  .selectAll('circle') ②\n\
    \  .attr('cx', 200) ③\n  .attr('cy', 100) ④\n  .attr('r', 10) ⑤\n  .style('fill',\
    \ 'blue') ⑥\n  .style('stroke', '#aaa'); ⑦\n```\n\n1.  *①* Select the `<svg>`\
    \ element.\n\n2.  *②* Select all the `<circle>` elements within the `<svg>` element\
    \ of the prior selection.\n\n3.  *③* Add a `cx` attribute with value `200` to\
    \ each circle. This sets the x coordinate of each circle.\n\n4.  *④* Add a `cy`\
    \ attribute with value `100` to each circle. This sets the y coordinate of each\
    \ circle.\n\n5.  *⑤* Add a `r` attribute with value `10` to each circle. This\
    \ sets the radius of each circle.\n\n6.  *⑥* Sets the `fill` CSS property on each\
    \ circle to `'blue'`.\n\n7.  *⑦* Sets the `stroke` CSS property on each circle\
    \ to `'#aaa'`.\n\nYou can view this example on [Codepen](https://codepen.io/createwithdata/pen/KKrNzXy).\
    \ Note that the Codepen example imports the whole D3 library as `d3` so we use\
    \ `d3.select` rather than `select`. Also note that all three circles have the\
    \ same position and radius so you only see one circle.\n\n### 5.3.3\\. Data joins\n\
    \nYou can create a correspondence between an array of data and a selection using\
    \ a **join**. This lets you add, remove and modify DOM elements in a data-driven\
    \ fashion.\n\nLet’s start by looking at a simple example where we join a short\
    \ array of data to `<circle>` elements. Suppose we have the following HTML:\n\n\
    ```\n<svg></svg>\n```\n\nThe HTML consists of a single, empty `<svg>` element.\
    \ This element will act as the container of the `<circle>` elements. The container\
    \ element is usually empty (the data join will populate it).\n\nThe data join\
    \ consists of four steps:\n\n*   call `select` to select a single container element\n\
    \n*   call `selectAll` and pass in the type of element you wish to join\n\n* \
    \  call `data` and pass in the data array\n\n*   call `join` and pass in the type\
    \ of element you wish to join\n\n```\nlet data = [\n  { age: 20, height: 170 },\n\
    \  { age: 34, height: 165 },\n  { age: 26, height: 178 }\n];\n\nselect('svg')\
    \ ①\n  .selectAll('circle') ②\n  .data(data) ③\n  .join('circle'); ④\n```\n\n\
    1.  *①* The first step selects the element that act as a container.\n\n2.  *②*\
    \ The second step calls `selectAll` to make a selection of the elements you wish\
    \ to join. The container is usually empty, so this is usually an empty selection.\
    \ (This can be confusing because it can feel strange to select elements that don’t\
    \ exist!)\n\n3.  *③* The third step calls `data` to create an association between\
    \ the data array `data` and the selection. This allows us to modify each element’s\
    \ attributes and style according to its associated data (see later).\n\n4.  *④*\
    \ The fourth step calls `join` to add or remove DOM elements (`<circle>` elements\
    \ in this example) such that each array element has an associated DOM element.\n\
    \nThis data join code ensures that each array element has an associated `<circle>`\
    \ element.\n\nYou can modify the style and attributes of joined DOM elements based\
    \ on their joined data by passing **a function** into `.style` or `.attr`. The\
    \ DOM element’s associated array item (its **joined data**) is passed into the\
    \ function and the return value is used to set the style or attribute’s value.\
    \ In our case each array item is an object such as `{ age: 34, height: 165 }`.\n\
    \nLet’s add some `.style` and `.attr` calls to our example:\n\n```\nlet data =\
    \ [\n  { time: 50, value: 15 },\n  { time: 150, value: 40 },\n  { time: 250, value:\
    \ 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n  .data(data)\n  .join('circle')\n\
    \  .style('fill', 'orange') ①\n  .attr('cx', d => d.time) ②\n  .attr('cy', 100)\
    \ ③\n  .attr('r', d => d.value); ④\n```\n\n1.  *①* Each circle’s `fill` value\
    \ is set to `orange` using the approach covered in the [Selections](#_custom_charts_with_d3_js.xhtml__selections)\
    \ section.\n\n2.  *②* Each circle’s `cx` attribute is set in a data driven fashion\
    \ by passing in a function. The function returns the `time` property of the joined\
    \ data so the first circle’s `cx` value will be 50, the second circle’s `cx` will\
    \ be `150` and the last circle’s `cx` will be `250`.\n\n3.  *③* Each circle’s\
    \ `cy` attribute is set to 100.\n\n4.  *④* Each circle’s `r` attribute is set\
    \ in a data driven fashion by passing a function in. The function returns the\
    \ `value` property of the joined data so the first circle’s `r` value will be\
    \ `15` etc.\n\nThe result looks like:\n\n![d3 join circles](images/d3-join-circles.png)\n\
    \nFigure 32\\. Joining an array of data to circle elements\n\nEach array element\
    \ corresponds to a `<circle>` element. Each circle’s x coordinate and radius is\
    \ set according to the joined data."
