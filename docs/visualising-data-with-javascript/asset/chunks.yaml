    \ of the map to `50rem`.\n\n* * *\n\n### 7.1.4\\. main.js\n\n`main.js` loads the\
    \ data and draws the charts and map. It has a similar form to `main.js` in the\
    \ `chartjs-various` project.\n\nLet’s look at the first few lines:\n\n```\nimport\
