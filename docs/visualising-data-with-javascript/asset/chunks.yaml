    \ MW:\n\n```\n// Filter\ndata = data.filter(d => d.technology === \"Solar Photovoltaics\"\
    \ && d.capacity > 50);\n```\n\nListing 70\\. load-data/main.js\n\n### D.1.3\\\
    . Try displaying your own data (make sure the dataset isn’t too large, perhaps\
    \ don’t go over 10Mb)\n\nMake sure your data is in long format and saved as JSON.\
    \ Also make sure numeric data are numbers (rather than strings with quote marks)\
    \ in the JSON. The Data Wrangling section in the Appendix shows how the REPD CSV\
    \ file was transformed into `repd.json` and it contains some handy tips on data\
    \ transformation.\n\n* * *\n\n## D.2\\. Make a Chart with Chart.js\n\n### D.2.1\\\
    . Show the number of applications per region (instead of technology) and sort\
    \ the bars alphabetically\n\nModify the tidy.js code to count regions instead\
    \ of technology types:\n\n```\nimport { tidy, count, sort } from '@tidyjs/tidy';\n\
    \n  ...\n\n  let summary = tidy(\n    data,\n    count('region'), ①\n    sort('region')\
    \ ②\n  );\n\n  const myChart = new Chart('chart', {\n    type: 'bar',\n    data:\
    \ {\n      labels: summary.map(d => d.region), ③\n      datasets: [{ ... }]\n\
    \    },\n    options: { ... }\n  });\n```\n\nListing 71\\. chart-js/main.js\n\n\
    1.  *①* Change the property name to `'region'` and remove the sort option (which\
    \ sorts by value)\n\n2.  *②* Add a sort command and pass in `'region'` to sort\
    \ alphabetically by region. You also need to add `sort` to the `import` statement\
    \ at the top of the file.\n\n3.  *③* Use the `region` property for the labels.\n\
    \n* * *\n\n### D.2.2\\. Change the bar colour to `'steelblue'`\n\n```\ndata: {\n\
    \    labels: summary.map(d => d.region),\n    datasets: [{\n      data: summary.map(d\
    \ => d.n),\n      backgroundColor: 'steelblue' ①\n    }]\n},\n```\n\nListing 72\\\
    . chart-js/main.js\n\n1.  *①* To set the bar colour use the `backgroundColor`\
    \ option in the series object.\n\n* * *\n\n## D.3\\. Custom Charts with D3.js\n\
    \n### D.3.1\\. Show regions along the y-axis\n\nCreate an array `regionValues`\
    \ of unique region names and pass it into `yScale` as the domain:\n\n```\n// y\
    \ scale\nlet regionValues = tidy( ①\n  data,\n  count('region'), ②\n  sort('region')\
    \ ③\n).map(d => d.region); ④\n\nlet yLength = height - topMargin - bottomMargin;\n\
    \nlet yScale = scalePoint()\n    .domain(regionValues) ⑤\n    .range([0, yLength]);\n\
    ```\n\nListing 73\\. d3-dot/main.js\n\n1.  *①* Change `technologyValues` to `regionValues`.\n\
    \n2.  *②* Count regions instead of technologies.\n\n3.  *③* Sort by region instead\
    \ of technology.\n\n4.  *④* Extract the region name instead of technology.\n\n\
    5.  *⑤* Use `regionValues` for the `yScale` domain.\n\nSet each circle’s `cy`\
    \ attribute according to the `region` property:\n\n```\n.attr('cx', d => xScale(d.dateSubmitted))\n\
    .attr('cy', d => yScale(d.region)) ①\n.attr('r', d => rScale(d.capacity))\n```\n\
    \nListing 74\\. d3-dot/main.js\n\n1.  *①* Use region instead of technology to\
    \ determine the `cy` attribute.\n\n* * *\n\n### D.3.2\\. Change the colour scheme\
    \ so that Battery applications are coloured in purple and everything else in grey\n\
    \nSet the circle fill and stroke according to the technology property:\n\n```\n\
    .attr('r', d => rScale(d.capacity))\n.style('fill', d => d.technology === 'Battery'\
    \ ? 'purple' : '#aaa') ①\n.style('stroke', d => d.technology === 'Battery' ? 'purple'\
    \ : '#aaa') ①\n```\n\nListing 75\\. d3-dot/main.js\n\n1.  *①* If technology is\
    \ Battery, use purple otherwise use grey.\n\n### D.3.3\\. Add more information\
    \ to the toolip\n\nAdd the operator and region to the tooltip:"
