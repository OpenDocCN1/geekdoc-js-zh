    \ `max`, `mean`, `median` and `deviation`. Each summary function is called on\
    \ each group and the return value is written to the result array.\n\nThus in the\
    \ example above, the 'Pumped Storage Hydroelectricity' group has 10 members and\
    \ a mean capacity of 573.78.\n\n### 3.2.5\\. tidy.js examples\n\n`tidyjs-examples`\
