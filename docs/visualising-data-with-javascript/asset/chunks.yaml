    3.  *③* 将地图的高度设置为浏览器窗口的全高。\n4.  *④* 将 `<h4>` 元素的边距设为零。这是为了减少提示框标题周围的空间。\n\n***\n\
    \n## 6.4. 本章总结\n\n本章介绍了 Leaflet 地图库。它展示了如何创建地图、如何向地图上添加圆圈，并展示了一个数据驱动地图的完整示例。\n\
    \nLeaflet 是一个用于创建地图的优秀库，也是我知道的快速制作地图最简单的库之一。它比初看起来要强大得多。除了圆形标记外，你还可以添加其他形状，包括基于\
    \ GeoJSON 数据的形状。你还可以通过编程设置视图和缩放级别，甚至让地图“飞往”某个特定位置。我建议访问[官方文档](https://leafletjs.com/reference.html)\
    \ 来探索 Leaflet 提供的功能。\n\n## 6.5. 进一步学习的想法\n\n我建议通过探索、修改和添加代码来尝试这个项目。这里是一些想法：\n\n\
    *   根据状态而非技术类型为标记着（你可能想使用 `d3-dot` 中的色板）\n*   仅显示太阳光伏应用。\n\n访问附录获取解决方案。\n\n# 7.\
    \ 数据故事\n\n数据故事（Data story）是一种结合叙述和数据可视化来展示数据的文档。它旨在以一种令人记忆且引人胜的方式呈现发现和结论。\n\n\
    在本章中，我将展示如何使用 HTML、CSS、JavaScript、Chart.js 和 Leaflet 构建数据故事。这些技术也可以用于构建数据报告（报告更侧重于提供客观且详细的信息）。\n\
    \n我将逐步解析“电池储能向前前进”数据故事的代码，该故事探索了电池储能设施（存储来自风能和太阳能等间歇性电源的电力）的增长。\n\n你可以访问 [jsvis-data-story.surge.sh](http://jsvis-data-story.surge.sh)\
    \ 查看数据故事的在线版本。\n\n![data story](img/data-story.png)\n\n图 45. 电池储能数据故事\n\n数据故事展示了多个图表和一张显示电池设施位置的地图。每个图表都有说明文字，整个作品读起来像一个故事。数据故事使用了交替的背景颜色来增加视觉多样性。大部分内容都有左右边距，地图是全宽的。\n\
    \n这个数据故事的构建方式与 `chartjs-various` 项目类似，在单个 HTML 页面中添加了多个 Chart.js 图表。我们还添加了地图和说明文字，并对布局和样式额外额外关注。\n\
    \n在本章最后，我将展示如何使用 [surge.sh](https://surge.sh/) 免费将数据故事发布到网上。\n\n## 7.1. “电池储能向前前进”数据故事项目\n\
    \n数据故事项目使用 Vite 构建，结构与 `chartjs-various` 项目类似。数据故事由四个 Chart.js 图表（一个柱状图、一个折线图、一个环形图和另一个柱状图）和一个\
    \ Leaflet 地图组成。\n\n要运行项目，请导航到 `data-story` 项目目录并调用 `npm install`。调用 `npm run dev`\
    \ 启动应用程序服务器。这将给你一个可以访问的 URL（通常是 [`localhost:5173`](http://localhost:5173)）。访问该\
    \ URL 时，你应该看到数据故事。\n\n```bash\ncd data-story\n\nnpm install\n\nnpm run dev\n```\n\
    \n### 7.1.1. 文件结构\n\n项目目录具有以下结构：\n\n```\ndata-story/\n  index.html\n  main.js\n\
    \  node_modules/\n    ...\n  package-lock.json\n  package.json\n  public/\n  \
    \  repd.json\n  style.css\n```\n\n列表 42. data-story 项目文件\n\n项目使用 Vite 构建，因此具有标准的\
    \ Vite 文件结构。REPD 数据位于 `public` 目录中。所有的 JavaScript 代码都在 `main.js` 中。主要的项目文件是 `index.html`、`main.js`\
    \ 和 `style.css`。大部分内容在 `index.html` 中，包含了说明文字以及图表和地图的容器。JavaScript 文件 `main.js`\
    \ 的主要工作是创建四个图表和地图。\n\n### 7.1.2. index.html\n\n`index.html` 包含了说明文字以及图表和地图的容器。这是一个大文件，让我们先看大纲：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    UTF-8\" />\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"#\" />\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n   \
    \ <title>Battery Storage Charging Ahead</title>\n  </head>\n  <body ①\n    <div\
    \ id=\"content\">\n      <section> ②\n          ...\n      </section>\n      <section\
    \ class=\"dark\"> ③\n          ...\n      </section>\n      <section> ④\n    \
    \      ...\n      </section>\n      <section class=\"map\"> ⑤\n          ...\n\
    \      </section>\n      <section> ⑥\n          ...\n      </section>\n      <section\
    \ class=\"dark\"> ⑦\n          ...\n      </section>\n    </div>\n    <script\
    \ type=\"module\" src=\"/main.js\"></script>\n  </body>\n</html>\n```\n\n列表 43.\
    \ data-story/index.html\n\n1.  *①* `index.html` 的 `body` 标签包含多个节。每个节包含文字或地图。\n\
    2.  *②* 第一节包含文字和图表。\n3.  *③* 第二节包含文字和图表。它有一个 `dark` 类属性以为该节提供深色主题。\n4.  *④* 该节包含少量的文字。\n\
    5.  *⑤* 该节包含地图，其 `map` 类属性使其全宽。\n6.  *⑥* 该节包含文字和环形图。\n7.  *⑦* 最后一个节也使用了深色主题，并包含一个柱状图。\n\
    \n每个节都包含一个 `<div class=\"inner\">` 元素，它包裹了文字和图表内容：\n\n```html\n<section>\n  <div\
    \ class=\"inner\"> ①\n    <h1>Battery storage charging ahead</h1>\n    <p>The\
    \ need to switch to low-carbon energy production...</p>\n    ...\n    <div class=\"\
    chart-wrapper\">\n      <canvas id=\"chart-1\"></canvas>\n    </div>\n  </div>\n\
    </section>\n```\n\n1.  *①* 这个包装器元素允许我们设置节的文字和图表的宽度。\n\n让我们逐一查看每个节。\n\n***\n\n\
    #### 第一节（文字和柱状图）\n\n```html\n<section>\n  <div class=\"inner\">\n    <h1>Battery\
    \ storage charging ahead</h1>\n    <p>The need to switch to low carbon energy\
    \ production...</p>\n    <p>Typically electricity needs to be produced on demand...</p>\n\
    \    <p>This is where battery storage technology can help.</p>\n    <h3>Battery\
    \ storage technology</h3>\n    <p>If solar panel and wind turbine production exceeds\
    \ demand...</p>\n    <p>The UK's Renewable Energy Planning Database (REPD) records...</p>\n\
    \    <div class=\"chart-wrapper\">\n      <canvas id=\"chart-1\"></canvas>\n \
    \   </div>\n  </div>\n</section>\n```\n\n列表 44. data-story/index.html\n\n此节包含了主标题、介绍性文字和第一个柱状图。像往常一样，对于\
    \ Chart.js 图表，我们将 `<canvas>` 元素包装在 `<div>` 包装器中，以便固定其高度。\n\n"
