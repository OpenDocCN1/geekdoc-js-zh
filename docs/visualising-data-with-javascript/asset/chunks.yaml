  trans: "\n\n*   `d3-scale`（将数据值转换为视觉值（如位置和颜色）的函数）\n*   `d3-axis`（绘制 x 轴和 y 轴的函数）\n\
    *   `d3-hierarchy`（帮助构建层次结构（如矩树图和圆点布局）的函数）\n*   `d3-force`（基于物理的定位引擎）\n*   `d3-geo`（用于绘制地图）\n\
    *   `d3-array`（数组操作函数）\n\n每个模块包含了构建可视化的工具，从计算数组中最小值或最大值的简单函数，到帮助你构建交互式、可缩放树图的函数不等。使用\
    \ D3 的技巧在于如何将这些元素组合在一起。\n\n我在本书中介绍了几个核心模块，即 `d3-selection`、`d3-scale`、`d3-axes`\
    \ 和 `d3-array`。这种组合足以构建自定义的可视化。\n\n关于其他模块的更多信息，我建议访问[官方文档](https://d3js.org/api)\
    \ 或 [D3 in Depth](https://d3indepth.com)。\n\n## 5.3 使用 D3\n\n在这一节中，我们将查看 D3 的几个核心模块（`d3-selection`、`d3-scale`、`d3-axes`\
    \ 和 `d3-array`）。我使用 D3 构建的大多数可视化项目都使用了这些模块，我建议先熟悉它们。我们在稍后的 REPD 时间线示例中使用了所有四个模块。\n\
    \n### 5.3.1 安装\n\n你可以使用 `npm install d3` 安装整个 D3 库，也可以使用（例如）`npm install d3-selection`\
    \ 安装单个模块。在本章中，我们将安装单个 d3 模块。\n\n### 5.3.2 选择\n\n`d3-selection` 模块允许你添加、删除和修改 DOM\
    \ 元素。它还允许你执行数据连接（将数据数组与 DOM 元素关联）。\n\n`d3-selection` 中的一个核心概念是“选择”（selection），它基本上是\
    \ DOM 元素的数组。为了修改 DOM 元素并连接数据，你需要创建一个选择。\n\n假设你的 `index.html` 文件中有以下 HTML 代码段（它是一个包含三个圆形的\
    \ `<svg>` 元素）：\n\n```\n<svg>\n  <circle></circle>\n  <circle></circle>\n  <circle></circle>\n\
    </svg>\n```\n\n你可以使用 `select` 创建一个包含**单个元素**的选择。它接受一个包含 CSS 选择器字符串的单个参数：\n\n```javascript\n\
    import { select } from 'd3-selection';\n\n// 选择 svg 元素\nselect('svg');\n\n// 选择第一个圆\n\
    select('circle');\n```\n\n你也可以使用 `selectAll` 创建一个包含**多个元素**的选择。它会找到所有匹配的元素：\n\n\
    ```javascript\nimport { selectAll } from 'd3-selection';\n\n// 选择所有的圆\nselectAll('circle');\n\
    ```\n\n你可以通过**链式调用** `select` 或 `selectAll` 来选择选择元素的子元素。这里是一个示例，我们对 `<svg>` 元素进行单一选择，然后选择它内部所有的\
    \ `<circle>` 元素：\n\n```javascript\nimport { select } from 'd3-selection';\n\n\
    // 选择 svg 元素并选择其所有的圆元素\nselect('svg')\n  .selectAll('circle');\n```\n\n这被称为**嵌套选择**（nested\
    \ selection），在连接数据时非常重要。\n\n选择基本上是 DOM 元素的数组，但选择有很多方法可以修改元素的样式和属性。常用的方法是 `.style`\
    \ 和 `.attr`：\n\n```javascript\nimport { select } from 'd3-selection';\n\nselect('svg')\n\
    \  .selectAll('circle')\n  .attr('cx', 200)\n  .attr('cy', 100)\n  .attr('r',\
    \ 10)\n  .style('fill', 'blue')\n  .style('stroke', '#aaa');\n```\n\n1. ① 选择 `<svg>`\
    \ 元素。\n2. ② 选择 `<svg>` 元素内的所有 `<circle>` 元素。\n3. ③ 添加值为 `200` 的 `cx` 属性。这设置了 x\
    \ 坐标。\n4. ④ 添加值为 `100` 的 `cy` 属性。这设置了 y 坐标。\n5. ⑤ 添加值为 `10` 的 `r` 属性。这设置了半径。\n\
    6. ⑥ 将 `fill` CSS 属性设置为 `'blue'`。\n7. ⑦ 将 `stroke` CSS 属性设置为 `'#aaa'`。\n\n你可以在\
    \ [Codepen](https://codepen.io/pen/NzX) 上查看此示例。注意，Codepen 导入了整个 D3 库，所以我们使用 `d3.select`\
    \ 而不是 `select`。此外，三个圆的位置和半径相同，所以你只能看到。\n\n### 5.3.3 数据连接\n\n你可以使用 `join` 创建数据数组与选择之间的对应。这允许你以数据驱动的方式添加、删除和修改\
    \ DOM 元素。\n\n让我们从一个简单的示例开始：\n\n```javascript\nlet data = [\n  { time: 50, value:\
    \ 15 },\n  { time: 150, value: 40 },\n  { time: 250, value: 30 }\n];\n\nselect('svg')\n\
    \  .selectAll('circle')\n  .data(data)\n  .join('circle')\n  .style('fill', 'orange')\n\
    \  .attr('cx', d => d.time)\n  .attr('cy', 100)\n  .attr('r', d => d.value);\n\
    ```\n\n结果如下：\n\n![d3 连接圆](img/d3-join-circles.png)\n\n图 32. 将数据数组连接到圆形元素\n\n每个数组元素对应一个\
    \ `<circle>` 元素。每个圆的 x 坐标和半径根据连接的数据进行设置。\n\n"
