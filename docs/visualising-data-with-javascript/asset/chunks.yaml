    \n* * *\n\n### 7.1.3 `style.css`\n\n`style.css` 的大部分内容涉及每个章节的大小设置。让我们来看前几行：\n\n\
    ```css\n@import 'leaflet/dist/leaflet.css'; ①\n\nbody {\n  font-family: Inter,\
    \ Avenir, Helvetica, Arial, sans-serif;\n  background-color: #F9F7EB; ②\n  margin:\
    \ 0;\n}\n\nsection { ③\n  display: flex;\n  justify-content: center;\n}\n\nsection\
    \ div.inner {\n  width: 100%; ④\n  max-width: 1000px; ④\n  padding: 2rem 1rem;\
    \ ⑤\n  box-sizing: border-box; ⑤\n\n/* ... */ */```\n```\n\n列表 50. `data-story/style.css`\n\
    \n1. ① 导入 Leaflet CSS 文件（Vite 支持这种导入 CSS 文件的方式）。\n2. ② 设置整个文档的背景颜色。\n3. ③ 将每个章节的\
    \ `display` 设置为 `flex`并将`justify-content` 设置为 `center`，使章节内容水平居中。你可以在《数据可视化的 HTML、SVG、CSS\
    \ 和 JavaScript 基础》书中学习更多关于 CSS Flexbox 模型的知识。\n4. ④ 将每个章节的 `<div class=\"inner\"\
    >` 元素的宽度设置为 100%，以便章节内容填充整个页面宽度。最大宽度设置为 1000px，以免内容在更宽的屏幕上变得太宽。\n5. ⑤ 在章节内容周围添加一些内边距（padding），并将\
    \ `box-sizing` 设置为 `border-box`，以便将 padding 包含在宽度内。\n\n`style.css` 的剩余部分：\n\n\
    ```css\n/* ... */\n```\n\n"
- fmt: "\n# 9. Request the `REPD` data and when it arrives convert it into a JavaScript\
    \ object and call `draw`.\n\n## drawChart1\n\n`drawChart1` draws the first bar\
    \ chart which shows the number of planning applications by technology type:\n\n\
    ![data story chart 1](images/data-story-chart-1.png)\n\nFigure 52\\. Bar chart\
    \ (number of planning applications by technology)\n\nHere’s the function:\n\n\
    ```javascript\nfunction drawChart1(data) {\n  let summary = tidy( ①\n    data,\n\
    \    count('technology', {sort: true})\n  );\n\n  const myChart = new Chart('chart-1',\
    \ { ②\n    type: 'bar',\n    data: {\n      labels: summary.map(d => d.technology),\
    \ ③\n      datasets: [{\n        data: summary.map(d => d.n), ④\n        backgroundColor:\
    \ summary.map(d => d.technology === 'Battery' ? teal : '#999') ⑤\n      }]\n \
    \   },\n    options: {\n      indexAxis: 'y', ⑥\n      scales: {\n        x: {\n\
    \          title: {\n            display: true,\n            text: 'Number of\
    \ applications'\n          }\n        }\n      },\n      plugins: {\n        title:\
    \ {\n          text: 'Number of planning applications (by technology) 1990-2022',\n\
    \        }\n      }\n    }\n  });\n}\n```\n\nListing 54\\. data-story/main.js\n\
    \n1. *①* Create a count (by technology) summary of the `REPD` data.\n2. *②* Create\
    \ the chart, using the `<div>` element with id `chart-1` as the container.\n3.\
    \ *③* Use the `technology` property of the summary data as the chart labels (these\
    \ are the technology names).\n4. *④* Use the `n` property of the summary data\
    \ as the data values (these are the counts).\n5. *⑤* Set the bar colour to grey,\
    \ except for Battery technology for which we use `teal` (which is defined near\
    \ the top of the file).\n6. *⑥* Set `indexAxis` to `y` for a horizontal bar chart.\n\
    \n`drawChart1` is very similar to `drawChart1` in the `chartjs-various` project.\
    \ The main difference is that the bar colours are set to grey except for Battery\
    \ which is set to `teal` which we define near the top of the file. Using a variable\
    \ to represent a colour is a handy technique because it ensures colour consistency\
    \ and if we did want to change the colour we only need to change a single hex\
    \ code.\n\n## drawChart2\n\n`drawChart2` draws the multi-line chart which shows\
    \ the number of planning application submissions across time, broken down by technology\
    \ type.\n\n![data story chart 2](images/data-story-chart-2.png)\n\nFigure 53\\\
    . Multi-line chart (planning applications over time)\n\n`drawChart2` is similar\
    \ to `drawChart3` in the `chartjs-various` project. The main differences are the\
    \ style of the chart’s lines (which highlight Battery technology) and the axis\
    \ style (which adapts to the dark theme).\n\nHere’s `drawChart2` with the options\
    \ object truncated:\n\n```javascript\nfunction drawChart2(data) {\n  let chartData\
    \ = getMultiSeriesChartData(data, 'technology', 'yearSubmitted'); ①\n\n  // Add\
    \ style to each series\n  chartData.datasets.forEach(series => { ②\n    let color\
    \ = series.label === 'Battery' ? teal : '#999'; ③\n    series.backgroundColor\
    \ = color;\n    series.radius = 2;\n    series.borderColor = color;\n    series.borderWidth\
    \ = 1.5;\n    series.borderDash = series.label === 'Battery' ? [] : [1,1]; ④\n\
    \  });\n\n  const myChart = new Chart('chart-2', {\n    type: 'line',\n    data:\
    \ chartData, ⑤\n    options: { ... }\n  });\n}\n```\n\nListing 55\\. data-story/main.js\n\
    \n1. *①* Call `getMultiSeriesChartData` and pass in the data, `technology` as\
    \ the series property and `yearSubmitted` as the axis label property.\n2. *②*\
    \ This loop sets the style of each series.\n3. *③* Set the line colour to grey\
    \ unless the technology type is Battery.\n4. *④* `borderDash` defines whether\
    \ the line is solid, dotted or dashed. An empty array specifies a solid line.\
    \ Otherwise the array’s first value sets the length of the dots or dashes and\
    \ the second value sets the length of the gaps between the dots and dashes. If\
    \ the technology type is Battery draw a solid line otherwise draw a dotted line.\n\
    5. *⑤* Use the `chartData` object returned by `getMultiSeriesChartData` as the\
    \ `data` value of the chart’s configuration object.\n\nHere’s the options object\
    \ of `drawChart2`:\n\n```javascript\n{\n  scales: {\n    x: {\n      title: {\n\
    \        display: true,\n        text: 'Year',\n        color: '#eee'\n      },\n\
    \      ticks: {\n        color: '#ccc' ①\n      },\n      grid: {\n        color:\
    \ '#555' ①\n      }\n    },\n    y: {\n      title: {\n        display: true,\n\
    \        text: 'Number of applications',\n        color: '#eee' ①\n      },\n\
    \      ticks: {\n        color: '#ccc' ①\n      },\n      grid: {\n        color:\
    \ '#333' ①\n      }\n    }\n  },\n  plugins: {\n    title: {\n      text: 'Battery\
    \ applications compared with other renewables 1990-2022',\n      color: '#eee'\
    \ ①\n    },\n    legend: {\n      display: false\n    }\n  }\n}\n```\n\nListing\
    \ 56\\. data-story/main.js\n\n1. *①* This chart uses a dark theme so we need to\
    \ set the axis ticks and labels to lighter colours and grid lines to darker colours.\n\
    \n## drawMap\n\n`drawMap` draws the map. Circle markers are added to represent\
    \ each battery application.\n\n![data story map](images/data-story-map.png)\n\n\
    Figure 54\\. Map showing battery application locations\n\nHere’s the first few\
    \ lines of the function:\n\n```javascript\nfunction drawMap(data) {\n  let filteredData\
    \ = tidy( ①\n    data,\n    filter(d => d.technology === 'Battery')\n  );\n\n\
    \  let map = L.map('map', { ②\n    scrollZoom: false\n  });\n\n  L.tileLayer('https://stadiamaps.com/{z}/{x}/{y}.png',\
    \ {\n    attribution: '© OpenStreetMap contributors',\n  }).addTo(map);\n\n  map.setView([55,\
    \ -2], ⑤\n\n  let maxCapacity = max(filteredData, d => d.capacity); ⑥\n  let radiusScale\
    \ = scaleSqrt().domain([0, maxCapacity]).range([5, 30]); // ⑦\n```\n\nListing\
    \ 57\\. data-story/main.js\n\n1. *①* Start by filtering the data so only battery\
    \ applications are included.\n2. *②* Create a map by passing the id of the container.\n\
    3. *③* Disable the scroll wheel.\n4. *④* Add the tile layer and add it to the\
    \ map.\n5. *⑤* Set the map’s view.\n6. *⑥* Compute the maximum of the capacity\
    \ property within the filtered data.\n7. *⑦* Create a square root scale.\n\nNext\
    \ in `drawMap` we add the circle markers:\n\n```javascript\nfilteredData.forEach(d\
    \ => { ①\n  if (d.lat === null || d.lon === null) return; ②\n  let marker = L.circleMarker([d.lat,\
    \ d.lon]); ③\n  let radius = radiusScale(d.capacity || 0); ④\n  let color = statusPalette[d.status]\
    \ || '#aaa'; ⑤\n\n  marker.setStyle({ ⑥\n    radius: radius,\n    fillColor: color,\n\
    \    fillOpacity: 0.75,\n    weight: 1,\n    opacity: 1,\n    color: color\n \
    \ });\n\n  marker.bindTooltip(getMapTooltipContent(d)); ⑦\n  marker.addTo(map);\
    \ ⑧\n});\n```\n\nListing 58\\. data-story/main.js\n\n1. *①* Loop through the filtered\
    \ data.\n2. *②* If the current item doesn’t have a latitude or longitude return\
    \ early.\n3. *③* Create a circle marker.\n4. *④* Compute the radius of the circle\
    \ marker.\n5. *⑤* Compute the colour of the circle marker using `statusPalette`\
    \ defined near the top of the file.\n6. *⑥* Set the marker’s style.\n7. *⑦* Add\
    \ tooltip content to the marker.\n8. *⑧* Add the marker to the map.\n\nThis function\
    \ is similar to the `draw` function in the `leaflet-map` project. The main difference\
    \ is that the data is filtered to include only Battery planning applications.\n\
    \nThe `getMapTooltipContent` is similar to the one in the `leaflet-map` project.\
    \ Consult the 'Data-driven maps with Leaflet' chapter for a walk through of this\
    \ and the `draw` function.\n\n## drawChart3\n\n`drawChart3` draws a doughnut chart\
    \ that shows the number of battery planning applications broken down by status.\n\
    \n![data story chart 3](images/data-story-chart-3.png)\n\nFigure 55\\. Doughnut\
    \ chart showing battery applications by status\n\nThe function looks like:\n"
