    \  },\n  {\n    \"technology\": \"Flywheels\",\n    \"count\": 1,\n    \"meanCapacity\"\
    : 400\n  },\n  ...\n]\n```\n\nThe first argument of `groupBy` is the property\
    \ name you want to group by. The second argument is an array of tidy.js functions.\
    \ Usually this array just has a single call to tidy’s `summarize` function."
