    \ section explains how the function `getMultiSeriesChartData` works. It’s used\
    \ in the `chartjs-various` and `data-story` projects.\n\nThe purpose of the function\
    \ is to create a Chart.js data object for a multi-series chart given an array\
    \ of data.\n\nIt takes three arguments:\n\n1.  The REPD data array\n\n2.  The\
    \ data property that defines the names of each series.\n\n3.  The data property\
    \ that defines the axis labels.\n\nIf called with the following arguments:\n\n\
    ```\ngetMultiSeriesChartData(data, 'technology', 'yearSubmitted');\n```\n\nit\
    \ returns an object that looks like:\n\n```\n{\n  labels: [1990, 1991, 1992, ...\
    \ 2020, 2021, 2022],\n  datasets: [\n    {\n      label: \"Advanced Conversion\
    \ Technologies\",\n      data: [0, 0, 0, ... 0, 0, 0]\n    },\n    {\n      label:\
    \ \"Anaerobic Digestion\",\n      data: [0, 0, 0, ... 10, 17, 22]\n    }\n   \
    \ ,\n    ...\n  ]\n}\n```\n\n* * *\n\nWe assign the output of `getMultiSeriesChartData`\
    \ to the `data` property in the Chart.js configuration object. For example:\n\n\
    ```\nlet chartData = getMultiSeriesChartData(data, 'technology', 'yearSubmitted');\n\
    \nconst myChart = new Chart('my-chart', {\n  type: 'line',\n  data: chartData,\n\
    \  options: { ... }\n});\n```\n\nHere’s the function:\n\n```\nfunction getMultiSeriesChartData(data,\
    \ seriesProp, labelProp) { ①\n  let seriesNames = uniq(data.map(d => d[seriesProp]))\
    \ ②\n      .filter(d => d !== '')\n      .sort();\n\n  let labelNames = uniq(data.map(d\
    \ => d[labelProp])) ③\n      .filter(d => d !== '')\n      .sort();\n\n  let chartData\
    \ = { ④\n    labels: labelNames,\n    datasets: seriesNames.map(series => { ⑤\n\
    \      return {\n        label: series,\n        data: []\n      };\n    })\n\
    \  };\n\n  // Add data to each series\n  chartData.datasets.forEach(series =>\
    \ { ⑥\n    series.data = labelNames.map(label => { ⑦\n      let items = data.filter(d\
    \ => { ⑧\n        return d[seriesProp] === series.label && d[labelProp] === label;\n\
    \      });\n      return items.length;\n    });\n  });\n\n  return chartData;\n\
    }\n```\n\n1.  *①* `getMultiSeriesChartData` accepts three arguments: `data` (the\
    \ data array), `seriesProp` (the property e.g. `'technology'` from which we derive\
    \ the series names) and `labelProp` (the property e.g. `'yearSubmitted'` from\
    \ which we derive the labels along the main axis).\n\n2.  *②* Create an array\
    \ of the series names. We use lodash’s `uniq` function that takes an array and\
    \ outputs a copy of the array with duplicates removed. We also filter the arrays\
    \ to remove blanks and sort the arrays in ascending order.\n\n3.  *③* Create an\
    \ array of the label names in a similar manner to `seriesNames`.\n\n4.  *④* Create\
    \ and initialise the chart data object.\n\n5.  *⑤* Create the `datasets` array\
    \ by calling the `map` method on `seriesNames`. Each element of this array represents\
    \ a data series. Each series has two properties `label` (the series name) and\
    \ `data` (an array of numbers).\n\n6.  *⑥* Iterate through each series.\n\n7.\
    \  *⑦* For each series call the `map` method on the `labelNames` array to create\
    \ an array where each element is the number of planning applications for this\
    \ series and a particular label name.\n\n8.  *⑧* To count the number of items\
    \ filter the data for items that match `series` and `label` and return the array\
    \ length.\n\n# Appendix C: Data Wrangling"
