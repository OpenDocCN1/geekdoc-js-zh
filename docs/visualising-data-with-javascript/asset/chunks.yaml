    \n# 7. Data Stories\n\nA data story is a document that presents data using a mix\
    \ of narrative and data visualisation. It aims to present findings and conclusions\
    \ in a memorable and compelling manner.\n\nIn this chapter I show how to build\
    \ a data story using HTML, CSS, JavaScript, Chart.js and Leaflet. These techniques\
    \ can also be used to build data reports (which focus more on providing objective\
    \ and detailed information).\n\nI step through the code of a data story 'Battery\
    \ Storage Charging Ahead' which explores the growth of battery storage installations\
    \ (which store electricity from intermittent sources such as wind and solar).\n\
    \nYou can visit a live version of the data story at [http://jsvis-data-story.surge.sh](http://jsvis-data-story.surge.sh).\n\
    \n![data story](images/data-story.png)\n\nFigure 45. Battery Storage data story\n\
    \nThe data story shows a number of charts and a map showing the locations of the\
    \ battery installations. Each chart has explanatory text and the piece as a whole\
    \ reads like a story. The data story is styled using alternating background colours\
    \ to give the piece more visual variety. Most of the content has left and right\
    \ margins except for the map which is full width.\n\nThis data story is built\
    \ in a similar manner to the `chartjs-various` project where several Chart.js\
    \ charts were added to a single HTML page. We also add a map and explanatory text\
    \ and we pay additional attention to the layout and styling.\n\nAt the end of\
    \ this chapter I show how to publish the data story onto the web for free using\
    \ [surge.sh](https://surge.sh/).\n\n## 7.1. 'Battery Storage Charging Ahead' data\
    \ story project\n\nThe data story project is built using Vite and follows a similar\
    \ structure to the `chartjs-various` project. The data story consists of four\
    \ Chart.js charts (a bar chart, a multi-line chart, a doughnut chart and another\
    \ bar chart) and a Leaflet map.\n\nTo run the project navigate to the `data-story`\
    \ project directory and call `npm install`. Call `npm run dev` to start the application\
    \ server. This will give you a url (usually [http://localhost:5173](http://localhost:5173))\
    \ to visit. You should see the data story when you visit this URL.\n\n```bash\n\
    cd data-story\n\nnpm install\n\nnpm run dev\n```\n\n### 7.1.1. File structure\n\
    \nThe project directory has the following structure:\n\n```\ndata-story/\n  index.html\n\
    \  main.js\n  node_modules/\n    ...\n  package-lock.json\n  package.json\n  public/\n\
    \    repd.json\n  style.css\n```\n\nListing 42. data-story project files\n\nThe\
    \ project was built using Vite so has the standard Vite file structure. The REPD\
    \ data is in the `public` directory. All the JavaScript code is in `main.js`.\n\
    \nThe main project files are `index.html`, `main.js` and `style.css`. Most of\
    \ the content is in `index.html` which contains the explanatory text and containers\
    \ for the charts and map. The main job of the JavaScript file `main.js` is to\
    \ create the four charts and the map.\n\n### 7.1.2. index.html\n\n`index.html`\
    \ contains the explanatory text and containers for the charts and map. It’s a\
    \ big file so let’s start by looking at an outline:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <link rel=\"\
    icon\" type=\"image/svg+xml\" href=\"#\" />\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\" />\n    <title>Battery Storage Charging\
    \ Ahead</title>\n  </head>\n  <body ①\n    <div id=\"content\">\n      <section>\
    \ ②\n          ...\n      </section>\n      <section class=\"dark\"> ③\n     \
    \     ...\n      </section>\n      <section> ④\n          ...\n      </section>\n\
    \      <section class=\"map\"> ⑤\n          ...\n      </section>\n      <section>\
    \ ⑥\n          ...\n      </section>\n      <section class=\"dark\"> ⑦\n     \
    \     ...\n      </section>\n    </div>\n    <script type=\"module\" src=\"/main.js\"\
    ></script>\n  </body>\n</html>\n```\n\nListing 43. data-story/index.html\n\n1.\
    \  *①* The `body` tag of `index.html` contains multiple sections. Each section\
    \ contains text or map.\n2.  *②* The first section contains text and a chart.\n\
    3.  *③* The second section contains text and a chart. It has a class attribute\
    \ with `'dark'` to give this section a dark theme.\n4.  *④* This section contains\
    \ a small amount of text.\n5.  *⑤* This section contains the map and its class\
    \ attribute of `'map'` causes it to be full width.\n6.  *⑥* This section contains\
    \ text and the doughnut chart.\n7.  *⑦* The last section also uses a dark theme\
    \ and contains text and a bar chart.\n\nEach section contains a `<div class=\"\
    inner\">` element which wraps the text and chart content:\n\n```html\n<section>\n\
    \  <div class=\"inner\"> ①\n    <h1>Battery storage charging ahead</h1>\n    <p>The\
    \ need to switch to low-carbon energy production...</p>\n    ...\n    <div class=\"\
    chart-wrapper\">\n      <canvas id=\"chart-1\"></canvas>\n    </div>\n  </div>\n\
    </section>\n```\n\n1.  *①* This wrapper element lets us set the width of a section’s\
    \ text and charts.\n\nLet’s look at each section in turn.\n\n***\n\n#### Section\
