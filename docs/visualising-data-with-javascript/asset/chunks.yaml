- fmt: "\n![](images/jacket/front-cover.png)\n\n# Table of Contents\n\nVisualising\
    \ Data with JavaScript\n\nCopyright © 2025 Peter Cook. All rights reserved.\n\n\
    This version was published on 7th February 2025.\n\n# 1. Introduction\n\nVisualising\
    \ Data with Javascript teaches you how to make maps, charts and data stories with\
    \ JavaScript. You’ll learn about:\n\n*   JavaScript’s role in data visualisation\n\
    *   how to create charts and maps using JavaScript libraries such as `Chart.js`,\
    \ `D3.js` and `Leaflet`\n*   how to combine maps and charts to create and publish\
    \ data stories\n\nYou’ll learn how to make charts using `Chart.js` (Figure 1),\
    \ maps using `Leaflet` (Figure 2), custom data visualisations using `D3.js` (Figure\
    \ 3) and data stories using HTML, CSS, JavaScript, `Chart.js` and `Leaflet` (Figure\
    \ 4).\n\n![chartjs styled 1](images/chartjs-styled-1.png)\n\nFigure 1\\. Chart.js\
    \ bar chart\n\n![leaflet](images/leaflet.png)\n\nFigure 2\\. Leaflet map\n\n![d3\
    \ timeline](images/d3-timeline.png)\n\nFigure 3\\. D3.js timeline\n\n![data story](images/data-story.png)\n\
    \nFigure 4\\. Data story\n\n***\n\n## 1.1. Prerequisites\n\nTo get the most out\
    \ of this book you need:\n\n*   access to a computer with `Node.js` installed\
    \ and a code editor (such as `VS Code`)\n*   moderate experience with `HTML`,\
    \ `CSS` and `JavaScript`\n*   moderate experience with the command line, `Node.js`\
    \ and `npm`\n\nIf you’ve built (or worked on) a web application you should be\
    \ fine. Knowledge of JavaScript arrow functions, callback functions and promises\
    \ is useful for this book. If you need to get up to speed with `HTML`, `CSS`,\
    \ `SVG` and/or `JavaScript` I recommend reading [Fundamentals of HTML, SVG, CSS\
    \ and JavaScript for Data Visualisation](https://leanpub.com/html-svg-css-js-for-data-visualisation)\
    \ (also by myself). This contains all the necessary background knowledge for this\
    \ book.\n\n## 1.2. Setting expectations\n\nThis book aims to get you up and running\
    \ with `Chart.js`, `D3`, `Leaflet` and shows you how to make a data story.\n\n\
    It covers the fundamentals of making maps and charts as well as how to get started\
    \ using each of these libraries. It doesn’t go into great detail about the libraries\
    \ but seeks to motivate you to learn more about them and empower you to make your\
    \ own data visualisations.\n\n## 1.3. The code\n\nThis book covers several example\
    \ projects. Download a zip of the code from [app.createwithdata.com/downloads/visualising-data-with-js-book-code.zip](https://app.createwithdata.com/downloads/visualising-data-with-js-book-code.zip).\
    \ Unzip the file and move the directory to your usual development directory.\n\
    \nContact me at [help@createwithdata.com](mailto:help@createwithdata.com) if you\
    \ have any issues downloading the code.\n\n***\n\n## 1.4. The data\n\nThis book\
    \ uses a single dataset from the UK government’s Renewable Energy Planning Database\
    \ ([https://www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract](https://www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract)).\
    \ It tracks UK renewable energy projects through the planning system from 1990\
    \ onwards.\n\nWe use a snapshot of the dataset published in January 2023 that\
    \ contains just over 8000 rows. Each row represents a planning application and\
    \ has fields including name, `technology` (the type of technology such as solar\
    \ or wind), `capacity` (the output capacity in megawatts), `location` (latitude\
    \ and longitude), `region`, `status` (e.g. operational, refused, under construction)\
    \ and `year submitted`.\n\nWe use this data because:\n\n*   it’s real data that’s\
    \ published by a reputable source\n*   it has a mix of categorical and numeric\
    \ data\n*   it has a geographic element to it (the location of each project)\n\
    *   it’s a good size for educational purposes (it’s not tiny nor is it massive)\n\
    \nThe original data looks like:\n\n![repd data sheet](images/repd-data-sheet.png)\n\
    \nFigure 5\\. REPD data (some rows and columns omitted)\n\nFor the purposes of\
    \ this book I’ve transformed the data into a `JSON` file. A subset of the original\
    \ data’s columns are used and the columns are renamed. Some new properties `yearSubmitted`,\
    \ `yearGranted` and `daysUntilGranted` have also been added:\n\n***\n\n```\n[\n\
    \  {\n    \"id\": \"1\",\n    \"name\": \"Aberthaw Power Station Biomass\",\n\
    \    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"lon\"\
    : -3.407,\n    \"lat\": 51.387,\n    \"region\": \"Wales\",\n    \"status\": \"\
    Operational\",\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\": 2004,\n\
    \    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\": 2004,\n\
    \    \"daysUntilGranted\": 140\n  },\n  {\n    \"id\": \"2\",\n    \"name\": \"\
    Hunterston - cofiring\",\n    \"technology\": \"Biomass (co-firing)\",\n    \"\
    capacity\": 35,\n    \"lon\": -3.407,\n    \"lat\": 51.387,\n    \"region\": \"\
    Wales\",\n    \"status\": \"Operational\",\n    \"operator\": \"RWE npower\",\n\
    \    \"yearSubmitted\": 2004,\n    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\"\
    ,\n    \"yearGranted\": 2004,\n    \"daysUntilGranted\": 140\n  },\n  ...\n]\n\
    ```\n\nListing 1\\. First few items in the JSON file\n\nYou can inspect the data\
    \ for yourself in `load-data/public/repd.json`.\n\nFor more information about\
    \ converting the REPD CSV file into `repd.json` visit the Data Wrangling section\
    \ in the Appendix.\n\n***\n\n## 1.5. Book Structure\n\nThe book is organised into\
    \ the following chapters:\n\n*   JavaScript and Dataisation\n*   Make a Chart\
    \ with Chart.js\n*   Styling and Customising Chart.js\n*   Custom Charts with\
    \ D3.js\n*   Data-driven Maps with Leaflet\n*   Data Stories\n\n# 2. Data Visualisation\
    \ and JavaScript\n\nThis chapter gives an overview of JavaScript’s role in data\
    \ visualisation. It also shows how to create a web application using the build\
    \ tool Vite and walks through an example application that loads some data and\
    \ displays it as a table.\n\n## 2.1. Data Visualisation\n\nData visualisation\
    \ is the process of representing data using graphics (rather than numbers).\n\n\
    For example, suppose you have a table of sales data:\n\n![simple table of numbers](images/simple-table-of-numbers.png)\n\
    \nFigure 6\\. A table of sales data\n"
