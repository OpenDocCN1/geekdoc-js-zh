    \ into visual variables such as position and colour. For example the REPD data\
    \ has years varying between 1990 and 2021\\. If you’d like to build a timeline\
    \ that’s 1000 pixels long you can create a scale function that accepts a year\
    \ and outputs a value between 0 and 1000.\n\nD3 has several scale types, the most\
    \ common of which are `scaleLinear`, `scaleSqrt`, `scaleTime` and `scalePoint`.\
    \ For each scale type D3 provides a constructor function. The typical usage pattern\
    \ is:\n\n*   call the scale constructor. This returns a scale function.\n\n* \
    \  set the scale’s domain by calling the scale function’s `domain` method. The\
