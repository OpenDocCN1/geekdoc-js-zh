    3. `③` 设置标记的半径（单位为像素）。\n4. `④` 将标记添加到地图上。\n\n* *\n\n此示例在英国布莱顿（Brighton）上方放置了一个圆圈标记：\n\
    \n![leaflet circle marker](img/leaflet-circle-marker.png)\n\n图 42. Leaflet 圆圈标记\n\
    \n* * *\n\n## 6.3 Leaflet 应用程序\n\n在本节中，我们将查看一个加载 REPD 数据并使用 Leaflet 创建数据驱动地图的应用。该项目使用\
    \ Vite 构建，因此结构与 `load-data` 项目相似。\n\n地图将每个 REPD 规划申请显示为一个圆圈。每个圆圈通过数据中的纬经值进行定位，根据其输出容量调整大小，并根据技术类型着色。\n\
    \n![leaflet](img/leaflet.png)\n\n图 43. 显示 REPD 规划应用的 Leaflet 地图\n\n要运行该项目，请进入\
    \ `leaflet-map` 项目目录并运行 `npm install`。运行 `npm run dev` 启动应用程序服务器。这将给你一个访问的 URL（通常是\
    \ [`localhost:5173`](http://localhost:5173)）。访问此 URL 时，你应该看到一个布满圆圈的地图。\n\n```\n\
    cd leaflet-map\n\nnpm install (or npm i)\n\nnpm run dev\n```\n\n* * *\n\n### 6.3.1\
    \ 文件结构\n\n项目目录如下：\n\n```\nleaflet-map/\n  index.html\n  main.js\n  node_modules/\n\
    \    ...\n  package-lock.json\n  package.json\n  public/\n    repd.json\n  style.css\n\
    ```\n列表 35. leaflet-map 项目文件\n\n项目使用 Vite 构建，因此具有标准的 Vite 文件结构。REPD 数据位于 `public`\
    \ 目录下。所有的 JavaScript 代码都在 `main.js` 中。\n\n主项目文件为 `index.html`、`main.js` 和 `style.css`。\n\
    \n### 6.3.2 index.html\n\n这是主 HTML 文件 `index.html`：\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <link rel=\"\
    icon\" type=\"image/svg+xml\" href=\"/vite.svg\" />\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\" />\n    <title>REPD Planning\
    \ applications</title> // ①\n  </head>\n  <body>\n    <div id=\"map\"></div> //\
    \ ②\n    <script type=\"module\" src=\"/main.js\"></script>\n  </body>\n</html>\n\
    ```\n列表 36. leaflet-map/index.html\n\n1. `①` 像往常一样，我们获取了 Vite 生成的 `index.html`\
    \ 并对其进行了修改。在这里，`<title>` 元素的内容已更新。\n2. `②` body 内容只包含一个用于地图的 `<div>` 容器。\n\n###\
    \ 6.3.3 main.js\n\n`main.js` 加载数据然后调用 `draw` 来创建地图。以下是大纲：\n\n```\nimport L from\
    \ 'leaflet'; // ①\nimport { scaleSqrt } from 'd3-scale';\nimport { max } from\
    \ 'd3-array';\n\nimport './style.css'; // ②\n\nconst technologyColors = { // ③\n\
    \  'Advanced Conversion Technologies': '#FF9999',\n  'Anaerobic Digestion': 'C58882',\n\
    \  'Battery': '#B6A6CA',\n  ...\n};\n\nfunction getTooltipContent(d) { ... } //\
    \ ④\n\nfunction draw(data) { ... } // ⑤\n\nfetch('./repd.json') // ⑥\n  .then(res\
    \ => res.json())\n  .then(data => data);\n```\n列表 37. leaflet-map/main.js\n\n\
    1. `①` 在 `main.js` 顶部导入 `Leaflet`。\n2. `②` 导入 `style.css`。\n3. `③` 定义 `technologyColors`。\n\
    4. `④` 定义 `getTooltipContent`。\n5. `⑤` 定义 `draw`。\n6. `⑥` `fetch('./repd.json')`...（注：原文文本在此处有逻辑跳转，我将根据提供的结构进行格式化）。\n"
