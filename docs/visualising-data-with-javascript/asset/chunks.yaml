    \nA circle marker can be created using Leaflet’s `circleMarker` method and added\
    \ to the map using the `addTo` method. When the marker is created we pass in an\
    \ array containing the marker’s latitude and longitude. The circle marker’s style\
    \ can also be set using the `setStyle` method and passing in an object containing\
    \ CSS properties:\n\n```\nimport L from 'leaflet';\n\nlet map = L.map('map');\n\
    \n...\n\nlet marker = L.circleMarker([50.8229, -0.1363]); // ①\n\nmarker.setStyle({\
    \ ②\n  radius: 10, ③\n  fillColor: '#FFB30F', // inner colour\n  fillOpacity:\
    \ 0.75,    // inner opacity\n  color: '#FFB30F',     // border colour\n  weight:\
    \ 1             // border width\n});\n\nmarker.addTo(map); // ④\n```\n\n1. `①`\
    \ Create a circle marker object by calling Leaflet’s `circleMarker` method and\
