    \ 从数据构建列表\n  let list = ''; ②\n  data.forEach(d => { ③\n    list += '<div>' +\
    \ d.name + ' (' + d.region + ') ' + d.capacity + 'MW</div>'; ④\n  });\n\n  document.querySelector('#output').innerHTML\
    \ = list; ⑤\n}\n```\n\n列表 6. main.js\n"
