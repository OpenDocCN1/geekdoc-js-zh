  trans: "\n3. ③ 选择 y 轴容器并使用 `call` 方法运行生成器。y 轴从 `<g class=\"inner\">` 的原点开始并向下延伸。（`<g\
    \ class=\"inner\">` 的原点相对于 `<svg>` 元素 `(leftMargin, topMargin)`，并在图表布局图中用小圆表示。）默认情况下，`axisLeft`\
    \ 轴的标签显示在轴线的左侧。\n\n4. ④ 使用 `axisBottom` 为 x 轴创建一个轴生成器，并传入 `xScale`。\n\n5. ⑤ 将刻度线大小（tick\
    \ size）设置为 `yLength + 20`，这意味着刻度线跨越了整个图表的高度。这会将刻度标签一直推到图表的底部。这是一个创建网格线的巧妙技巧。\n\
    \n6. ⑥ 选择 x 轴容器并使用 `call` 方法运行生成器。x 轴从 `<g class=\"inner\">` 的原点开始并向右延伸。\n\n在\
    \ `style.css` 中还有几条 CSS 规则隐藏了 x 轴的主线，使得只刻刻度可见。\n\n### 5.5.4 style.css\n\n`style.css`\
    \ 主要包含了几条用于设置轴样式的 CSS 规则：\n\n```\nbody {\n  font-family: Inter, Avenir, Helvetica,\
    \ Arial, sans-serif; ①\n  background-color: #eee; ②\n}\n\ng.x-axis path, g.y-axis\
    \ path {\n  display: none; ③\n}\n\ng.x-axis line {\n  stroke-dasharray: 1 1; ④\n\
    \  stroke: #ccc; ④\n}\n\ng.x-axis text, g.y-axis text {\n  font-family: Inter,\
    \ Avenir, Helvetica, Arial, sans-serif; ⑤\n  font-size: 12px;\n}\n```\n\nListing\
    \ 34. d3-dot/style.css\n\n1. ① 设置整个页面的字体。此规则留自 Vite 的默认项目。\n\n2. ② 将页面背景颜色设置为浅白色。\n\
    \n3. ③ 轴的主线（连接刻度线的线）通过选择代表线的 `path` 元素并将其 `display` 设置为 `none` 来隐藏。（如何样式化 D3 生成的轴并不直观。我通常使用浏览器的检查元素工具检查轴，找到感兴趣的元素，并确定要使用什么选择器字符串。）\n\
    \n4. ④ 垂直网格线（由全高的 x 轴刻度组成）被赋予了细微的虚线样式。\n\n5. ⑤ 出于我不知道的原因，`body` 元素的字体族没有级联到轴，因此我为此添加了该规则。\n\
    \n## 5.6 结语\n\n本章介绍了 D3.js 并展示了如何使用它创建自定义图表。使用 D3 创建图表比使用 Chart.js 要复杂得多，但优势在于你可以完全自定义图表。\n\
    \n无论你认为自己未来是否会使用 D3，我都希望本章能帮助你更好地理解 D3。\n\n## 5.7 进一步学习的想法\n\n我建议通过探索、修改和添加代码来玩这个项目。以下是一些想法：\n\
    \n* 在 y 轴上显示区域（而不是技术）。\n* 更改颜色方案，使电池应用显示为紫色，其他所有显示为灰色。\n* 更改 tooltip 中显示的信息。\n\
    \n访问附录获取解决方案。\n\n# 6. 使用 Leaflet 构建数据驱动地图\n\n本章介绍了 [Leaflet](https://leafletjs.com/)，这是一个用于制作地图的免费开源\
    \ JavaScript 库。Leaflet 创建基于瓦片的地图，这意味着地图是由许多小图像平铺而成的。（这与谷歌地图使用的相同方法。）用户可以对地图进行放大、缩小和滚动。\n\
    \n你还可以在地图上绘制形状，这意味着你可以创建数据驱动的地图。\n\n这里有一个使用 Leaflet 生成的地图，它可视化了 REPD 数据（我们将在本章中介绍该项目）：\n\
    \n![leaflet](img/leaflet.png)\n\n图 39. 显示 REPD 规划申请的 Leaflet 地图\n\n在本章中我将：\n\n\
    * 介绍 Leaflet\n* 展示如何使用 Leaflet\n* 演示一个可视化 REPD 数据的 Leaflet 示例。\n\n* * *\n\n##\
    \ 6.1 Leaflet 简介\n\nLeaflet 是一个绘制基于瓦片地图的免费开源 JavaScript 库。它相对易用，配置性非常强，你还可以在地图上绘制圆形等形状。\n\
    \nLeaflet 地图由以网格形式排列的小 JPG 或 PNG 图像组成。当地图首次加载以及当地图平移或缩放时，会加载新的瓦片。\n\n![leaflet\
    \ tiles](img/leaflet-tiles.png)\n\n图 40. 地图瓦片\n\nLeaflet 依赖瓦片服务器来提供地图瓦片。有很多选项，但很少是免费的。在书中我们使用\
    \ [Stadia 的瓦片](https://stadiamaps.com/products/map-tiles/)，它对非商业用途免费，但如果你在网上发布地图，则你需要一个\
    \ Stadia 账户。如果你真的很认真，可以考虑托管自己的瓦片服务器，但我没有做过这件事。\n\n你可以浏览 [`stadiamaps.com/products/map-tiles/`](https://stadiamaps.com/products/map-tiles/)\
    \ 瓦片集。\n\n* *\n\n## 6.2 如何使用 Leaflet\n\n### 6.2.1 安装\n\n进入项目并运行 `npm install`\
    \ 安装 Leaflet。\n\n### 6.2.2 创建地图\n\n创建地图有几个步骤：\n\n#### 添加容器\n\n必须在 HTML 中添加地图的\
    \ `div` 容器。\n\n```html\n<div id=\"map\"></div>\n```\n\n#### 设置容器的高度\n\n必须设置容器的高度。可以使用\
    \ CSS 实现。\n\n```css\n#map {\n  height: 600px;\n}\n```\n\n#### 引入 Leaflet 样式表\n\
    \nLeaflet 有一个必须包含在项目中样式表。对于 Vite 项目，可以在 `style.css` 中添加 `@import` 语句。\n\n```css\n\
    @import 'leaflet/dist/leaflet.css';\n```\n\n#### 创建地图\n\n在 JavaScript 代码中通过导入\
    \ Leaflet 库、调用 `map` 方法、指定瓦片服务器并设置视图中心创建地图：\n\n```javascript\nimport L from 'leaflet';\
    \ ①\n\nlet map = L.map('map'); ②\n\nL.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',\
    \ ③\n  maxZoom: 20,\n  attribution: '&copy; <a href=\"https://stadiamaps.com/\"\
    >Stadia Maps</a>...',\n}).addTo(map); ④\n\nmap.setView([55, -2], 6); ⑤\n```\n\n\
    1. ① `main.js` 的第一行导入了 Leaflet 对象。该对象是以匿名对象导出的，因此我们必须给它命名。惯例是命名为 `L`。\n\n2. ②\
    \ 然后通过调用 `L.map` 并传入 `div` 容器的 ID 来创建一个地图对象。这创建了地图对象但还没有绘制地图。我们仍然需要向地图添加瓦片层。\n\
    \n3. 下一步是使用 `L.tileLayer` 创建瓦片层。传入两个参数：瓦片层的 URL 和配置对象。这两个参数通常由瓦片服务器供应商提供。\n\n\
    4. 然后使用 `addTo` 将瓦片层添加到地图对象中。（`addTo` 是图层方法，将图层添加到现有地图对象中。）\n\n5. ⑤ 最后一步设置地图的视图中心。\n"
