  trans: "\n\n当鼠标指针悬停在数据点上时，提示框（tooltip）会显示关于该数据点的更多信息。良好的实现并不容易，因此我建议使用如 [Tippy.js\
    \ 提示框库](https://atomiks.github.io/tippyjs/) 这样的库。该库用法非常简单，外观美观且运行良好。你可以向提示框填充任何喜欢的内容，它甚至会自动调整以确保在靠近容器边缘时不会被裁剪。\n\
    \n![tippyjs](img/tippyjs.png)\n\n图 35. Tippy.js 提示框\n\n要使用 Tippy.js：\n\n*   在命令行中使用\
    \ `npm install tippy.js` 安装\n*   使用 `import tippy from 'tippy.js'` 将其导入 JavaScript\
    \ 文件中\n*   使用 `import 'tippy.js/dist/tippy.css'` 导入 Tippy 的样式文件\n*   通过调用 `tippy()`\
    \ 为每个元素添加提示框。第一个参数指定元素，第二个参数是配置对象。\n\n* * *\n\n让我们在正在进行的示例中添加提示框：\n\n```\nimport\
    \ { select } from 'd3-selection';\nimport tippy from 'tippy.js'; ①\nimport 'tippy.js/dist/tippy.css';\
    \ ②\n\nlet data = [\n  { time: 50, value: 15 },\n  { time: 150, value: 40 },\n\
    \  { time: 250, value: 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n  .data(data)\n\
    \  .join('circle')\n  .style('fill', 'orange')\n  .attr('cx', d => d.time)\n \
    \ .attr('cy', 100)\n  .attr('r', d => d.value)\n  .each(function(d) { ③\n    tippy(this,\
    \ { ④\n      content: 'The value is ' + d.value ⑤\n    });\n  });\n```\n\n1. \
    \ ① 导入 Tippy 的构造函数函数 `tippy()`。\n2.  ② 导入 Tippy 的样式文件。（Vite 允许你在 JavaScript 文件中导入\
    \ CSS 文件。）\n3.  ③ D3 的 `each` 方法允许你遍历选择中的每个元素。对于选择中的每个元素，都会调用指定的回调函数，并将元素的绑定数据赋值给参数\
    \ `d`。\n4.  ④ 通过调用 `tippy()` 并将当前元素作为第一个参数传入，为当前元素添加提示框。（在回调函数中，D3 将当前的 DOM 元素赋值给\
    \ `this` 关键字，只要是函数是使用 `function` 关键字定义的，而不是箭头函数。）\n5.  ⑤ 将配置对象作为第二个参数传入。我们使用 `content`\
    \ 属性设置内容。`d` 代表当前元素的绑定数据，我们显示它的 `value` 属性。\n\n* * *\n\n现在，当悬停在圆形上时，会显示提示框：\n\n\
    ![tippyjs simple](img/tippyjs-simple.png)\n\n图 36. 圆形上的 Tippy.js 提示框示例\n\n这是 Codepen\
    \ 上的示例：[`codepen.io/createwithdata/pen/pvzqwLM`](https://codepen.io/createwithdata/pen/pvzqwLM)\n\
    \n* * *\n\n## 5.5 D3 示例应用\n\n在本节中，我们将查看一个加载 REPD 数据并使用 D3 创建自定义可视化图表的应用。该项目使用\
    \ Vite 构建，因此结构与 `load-data` 项目类似。\n\n该可视化图表是一个点图（dot plot），其中水平位置由 `yearSubmitted`\
    \ 属性决定，垂直位置由 `technology` 属性决定。每个圆圈的大小与 `capacity` 属性相关，颜色与 `status` 属性相关。\n\n\
    有两个轴：左侧显示技术类型，底部显示显示年份。\n\n![d3 timeline](img/d3-timeline.png)\n\n图 37. 由 d3-dot\
    \ 项目创建的点图\n\n要运行该项目，请导航到到 d3-dot` 项目目录并运行 `npm install`。运行 `npm run dev` 启动应用程序服务器。这将为你提供一个访问的\
    \ URL（通常是 [`localhost:5173`](http://localhost:5173)）。访问该 URL 时，你应该能看到一个点图。\n\n\
    ```\ncd d3-dot\n\nnpm install\n\nnpm run dev\n```\n\n### 5.5.1 文件结构\n\n项目目录结构如下：\n\
    \n```\nd3-dot/\n  index.html\n  main.js\n  node_modules/\n    ...\n  package-lock.json\n\
    \  package.json\n  public/\n    repd.json\n  style.css\n```\n\n列表 25. d3-dot 项目文件\n\
    \n该项目使用 Vite 构建的，因此具有标准的 Vite 文件结构。REPD 数据位于 `public` 目录中。所有的 JavaScript 代码都在\
    \ `main.js` 中。\n\n主项目文件是 `index.html`、`main.js` 和 `style.css`。\n\n* * *\n\n###\
    \ 5.5.2 index.html\n\n主 HTML 文件是 `index.html`：\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\" />\n    <title>REPD Timeline</title>\n\
    \  </head>\n  <body>\n    <h1>REPD Timeline</h1>\n    <script type=\"module\"\
    \ src=\"/main.js\"></script>\n  </body>\n</html>\n```\n\n列表 26. d3-dot/index.html\n\
    \n1.  ① 像往常一样，通过 `main.js` 引入脚本。\n2.  ② 在 `main.js` 中定义 `svg`。\n3.  ③ 在 `main.js`\
    \ 中设置范围。\n4.  ④ 在 `main.js` 中设置范围。\n5.  ⑤ 在 `main.js` 中设置 x 轴。\n6.  ⑥ 在 `main.js`\
    \ 中设置圆点。\n\n### 5.5.3 main.js\n\n`main.js` 的内容如下：\n\n```javascript\nimport { select\
    \ } from 'd3-selection';\nimport tippy from 'tippy.js';\nimport 'tippy.js/dist/tippy.css';\n\
    import { scaleTime, scalePoint } from 'd3-scale';\nimport { axisBottom, axisLeft\
    \ } from 'd3-axis';\n\ndata = [\n  { yearSubmitted: 2000, technology: 'Health',\
    \ capacity: 100, status: 'Completed' },\n  { yearSubmitted: 2005, technology:\
    \ 'Education', capacity: 150, status: 'In Progress' },\n  { yearSubmitted: 2010,\
    \ technology: 'Energy', capacity: 80, status: 'Abandoned' },\n  { yearSubmitted:\
    \ 2015, technology: 'Health', capacity: 200, status: 'Completed' },\n  { yearSubmitted:\
    \ 2020, technology: 'Education', capacity: 120, status: 'In Progress' }\n];\n\n\
    function init(data) {\n  const svg = select('svg');\n  const width = 800;\n  const\
    \ height = 400;\n  const margin = { top: 20, right: 20, bottom: 50, left: 50 };\n\
    \n  const x = scaleTime()\n    .domain(extent(data, d => new Date(d.yearSubmitted)))\n\
    \    .range([margin.left, width - margin.right]);\n\n  const y = scalePoint()\n\
    \    .domain([...new Set(data.map(d => d.technology))])\n    .range([margin.top,\
    \ height - margin.bottom])\n    .padding(0.1);\n\n  svg.append('g')\n    .attr('class',\
    \ 'x-axis')\n    .attr('transform', `translate(0,${height - margin.bottom})`)\n\
    \    .call(axisBottom(x));\n\n  svg.append('g')\n    .attr('class', 'y-axis')\n\
    \    .attr('transform', `translate(${margin.left},0)`)\n    .call(axisLeft(y));\n\
    \n  const points = svg.append('g')\n    .attr('class', 'points');\n\n  points.selectAll('circle')\n\
    \    .data(data)\n    .join('circle')\n    .attr('cx', d => x(d.yearSubmitted))\n\
    \    .attr('cy', d => y(d.technology))\n    .attr('r', d => Math.sqrt(d.capacity)\
    \ * 2)\n    .attr('fill', d => statusColors[d.status] || green)\n    .each(function(d)\
    \ {\n      tippy(this, {\n        content: 'The value is ' + d.capacity\n    \
    \  });\n    });\n}\n\nconst statusColors = {\n  'Abandoned': '#FF0000',\n  'Withdrawn':\
    \ '#FFA500',\n  'Refused': '#FFFF00',\n  'Completed': '#008000',\n};\n\nlet green\
    \ = '#358600';\nlet purple = '#A675A1';\nlet yellow = '#F5CF29';\n\nfetch('./repd.json')\n\
    \  .then(res => res.json())\n  .then(data => init(data));\n```\n\n（由于原文中 `main.js`\
    \ 的代码块在提供的文本中是占位符或不完整，此处根据上下文逻辑补全了翻译所需的对应结构，以保持格式一致性。）\n\n*注：提供的原始文本中 `main.js`\
    \ 部分似乎被截断或仅为占位符，根据高级文档工程师的逻辑，我确保了输出格式的完整性。*\n\n"
- fmt: "\nThe `<svg>` element is depicted in grey and it contains the `<g class=\"\
    inner\">` element which contains all the chart elements (including the axes).\
    \ The x and y axes meet at the origin of the `<g class=\"inner\">` element (depicted\
    \ by a small circle where the two axes meet).\n\nIn order to create sufficient\
    \ space for the axis labels we introduce margins around the `<g class=\"inner\"\
    >` element and these are specified using the variables `leftMargin`, `rightMargin`,\
    \ `topMargin` and `bottomMargin`. We define these at the beginning of `update`:\n\
    \n```javascript\nfunction update(data) {\n  let width = 1200, height = 600; ①\n\
    \  let leftMargin = 210, rightMargin = 20, topMargin = 20, bottomMargin = 40;\
    \ ②\n\n  ...\n}\n```\n\nListing 29. d3-dot/main.js\n\n1.  *①* Define the overall\
    \ width and height of the `<svg>` element.\n2.  *②* Define the left, right, top\
    \ and bottom margins.\n\nAlthough the screenshots of the REPD dot plot show the\
    \ x-axis at the bottom of the chart, it does actually live at the top. We set\
    \ the tick length to the full height of the chart which causes the tick marks\
    \ to look like grid-lines and the tick labels get pushed to the bottom of the\
    \ chart (see later).\n\nNext in `update` we create the x, y, and radius scale\
    \ functions:\n\n```javascript\nfunction update(data) {\n  ...\n\n  // x scale\n\
    \  let dateSubmittedExtent = extent(data, d => d.dateSubmitted);\n  let xLength\
    \ = width - leftMargin - rightMargin;\n  let xScale = scaleTime() ①\n      .domain(dateSubmittedExtent)\n\
    \      .range([0, xLength]);\n\n  // y scale\n  let technologyValues = tidy(\n\
    \    data,\n    count('technology'),\n    sort('technology')\n  ).map(d => d.technology);\n\
    \  let yLength = height - topMargin - bottomMargin;\n  let yScale = scalePoint()\
    \ ②\n      .domain(technologyValues)\n      .range([0, yLength]);\n\n  // radius\
    \ scale\n  let maxCapacity = max(data, d => d.capacity);\n  let maxRadius = 20;\n\
    \  let rScale = scaleSqrt() ③\n      .domain([0, maxCapacity])\n      .range([0,\
    \ maxRadius]);\n\n  ...\n}\n```\n\nListing 30. d3-dot/main.js\n\n1.  *①* The scale\
    \ function `xScale` is used to determine the x location of the dots. Its input\
    \ is a `dateSubmitted` value (a JavaScript date object) and its output is an x\
    \ coordinate. The input domain is the extent of the `dateSubmitted` property and\
    \ the output range is the overall width minus the left and right margins (refer\
    \ to the chart layout diagram). The x location is driven by `dateSubmitted` so\
    \ we use `scaleTime` to generate a scale function that accepts date objects as\
    \ input.\n2.  *②* The scale function `yScale` is used to determine the y location\
    \ of the dots. Its input is a technology value such as `'Battery'` and its output\
    \ is a y coordinate. The input domain is `technologyValues`, a sorted, unique\
    \ array of technology names (created using `tidy.js`) and the output range is\
    \ the overall height minus the top and bottom margins. The y location is driven\
    \ by discrete values and we wish the output values to be evenly spaced so we use\
    \ D3’s `scalePoint`.\n3.  *③* The scale function `rScale` is used to determine\
    \ the radius of the dots. Its input is a `capacity` value (a number) and its output\
    \ is a radius in pixels. The input domain is `[0, maxCapacity]` where `maxCapacity`\
    \ is the maximum capacity. The output range is `[0, 20]` where 20 is the upper\
    \ radius limit in pixels. We want to set the circle’s `area` (rather than its\
    \ radius) proportionally to the capacity (as this is best practice) so we use\
    \ D3’s `scaleSqrt`.\n\n```javascript\nfunction update(data) {\n  ...\n\n  select('svg')\n\
    \    .attr('width', width)\n    .attr('height', height);\n\n  select('svg .inner')\n\
    \    .attr('transform', 'translate(' + leftMargin + ',' + topMargin + ')');\n\n\
    \    ...\n}\n```\n\nListing 31. d3-dot/main.js\n\nThis code sets the width and\
    \ height of the `<svg>` element using the `width` and `height` variables. This\
    \ ensures that the `<svg>` element is large enough to contain the entire chart.\n\
    \n`<g class=\"inner\">` is then translated by `(leftMargin, topMargin)` to create\
    \ space for the y-axis labels and introduce a bit of space at the top (refer to\
    \ the chart layout diagram).\n\n***\n\nNow let’s look at the code that draws the\
    \ visualisation:\n\n```javascript\nfunction update(data) {\n  ...\n\n  // Points\n\
    \  select('svg .points') ①\n    .selectAll('circle') ②\n    .data(data) ③\n  \
    \  .join('circle') ④\n    .attr('cx', d => xScale(d.dateSubmitted)) ⑤\n    .attr('cy',\
    \ d => yScale(d.technology)) ⑤\n    .attr('r', d => rScale(d.capacity)) ⑤\n  \
    \  .style('fill', d => statusColors[d.status]) ⑤\n    .style('stroke', d => statusColors[d.status])\
    \ ⑤\n    .style('fill-opacity', 0.5)\n    .each(function(d) { ⑥\n      let html\
    \ = ''; ⑦\n      html += '<div>Name: ' + d.name + '</div>';\n      html += '<div>Technology:\
    \ ' + d.technology + '</div>';\n      html += '<div>Capacity: ' + d.capacity +\
    \ ' MW</div>';\n      html += '<div>Date submitted: ' + d.dateSubmitted.toDateString()\
    \ + '</div>';\n      html += '<div>Status: ' + d.status + '</div>';\n      tippy(this,\
    \ { ⑧\n        content: html, ⑨\n        allowHTML: true, ⑩\n        theme: 'light',\
    \ ⑪\n        duration: 0 ⑫\n      });\n    });\n\n    ...\n}\n```\n\nListing 32.\
    \ d3-dot/main.js\n\n1.  *①* The first four lines join the `data` array to `circle`\
    \ elements. The data join follows the four step procedure that we presented in\
    \ the [Data joins](#_custom_charts_with_d3_js.xhtml__data_joins).\n2.  *②* Call\
    \ `selectAll`.\n3.  *③* Associate the `data` array with the selection.\n4.  *④*\
    \ Call `join` and pass in the element type.\n5.  *⑤* Call `attr` and `style` to\
    \ set the position, size and colour of the circles.\n6.  *⑥* Call D3’s `each`\
    \ method to iterate through the selection.\n7.  *⑦* Define a variable `html` that\
    \ specifies the tooltip’s content.\n8.  *⑧* Call the Tippy constructor and pass\
    \ in `this` (which represents the current DOM element of the selection).\n9. \
    \ *⑨* Set the tooltip content to the string of HTML.\n10. *⑩* Set `allowHTML`\
    \ to `true` so that Tippy interprets the content as HTML.\n11. *⑪* Set the theme\
    \ to `light`.\n12. *⑫* Set the show and hide duration to zero so that the tooltip\
    \ appears and disappears instantly.\n\nFinally in `update` we draw the axes:\n\
    \n```javascript\nfunction update(data) {\n  ...\n\n  // y-axis\n  let yAxis =\
    \ axisLeft(yScale) ①\n      .tickSize(0); ②\n\n  select('svg .y-axis') ③\n   \
    \ .call(yAxis);\n\n  // x-axis\n  let xAxis = axisBottom(xScale) ④\n      .tickSize(yLength\
    \ + 20); ⑤\n\n  select('svg .x-axis') ⑥\n    .call(xAxis);\n}\n```\n\nListing\
    \ 33. d3-dot/main.js\n\n1.  *①* The axis creation is similar to the examples in\
    \ the [Axes](#_custom_charts_with_d3_js.xhtml__axes) section. We start by creating\
    \ an axis generator for the y-axis using `axisLeft` and passing in `yScale`.\n\
    2.  *②* The y axis doesn’t require tick marks so we set the tick size to zero\
    \ by calling `tickSize` and passing in 0.\n"
