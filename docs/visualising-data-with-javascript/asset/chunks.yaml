    \  .selectAll('circle')\n  .data(data)\n  .join('circle')\n  .style('fill', 'orange')\n\
    \  .attr('cx', d => d.time)\n  .attr('cy', 100)\n  .attr('r', d => d.value);\n\
    ```\n\nWait, the prompt's text for the \"Data joins\" section is very broken.\
