    \ 12 点。）\n\n2. ② 解析申请提交日期并将其赋值给 `dateSubmitted` 变量。\n\n3. ③ 如果是有效日期，将其年份赋值给 `yearSubmitted`\
    \ 属性。\n\n4. ④ 如果是有效日期，将其 ISO 表示形式赋值给 `dateSubmitted` 属性。\n\n5. ⑤ 解析申请批准日期并将其赋值给\
    \ `dateGranted` 变量。\n\n6. ⑥ 如果是有效日期，将其年份赋值给 `yearGranted` 属性。\n\n7. ⑦ 计算 `'dateSubmitted'`\
    \ 和 `'dateGranted'` 之间的天数并赋值给 `daysUntilGranted` 属性。我们使用 D3 的 `timeDay.count`\
    \ 方法来计算两个日期对象之间的天数。（存在批准日期在提交日期之前的情况。如果是这种情况，我们不进行此计算。）\n\n***\n\n有些申请没有有效的提交日期。在这些情况下如何处理并不显而易见，为了教学目的保持简单，我排除了它们：\n\
    \n```javascript\n// 排除没有提交日期的申请\noutput = output.filter(d => d.dateSubmitted !==\
    \ null); ①\n\n// 仅保留截至 2022 年 12 月及内的提交年份\noutput = output.filter(d => d.yearSubmitted\
    \ < 2023); ②\n\nfs.writeFileSync('./repd.json', JSON.stringify(output, null, 2));\
    \ ③\n```\n\n列表 67. wrangling/index.js\n\n1. ① 排除没有提交日期的申请。\n\n2. ② 可视化图只显示到 2022\
    \ 年底的数据，因此排除 2022 年之后提交的申请。\n\n3. ③ 使用 `JSON.stringify` 将数据数组 `output` 转换为 JSON\
    \ 字符串表示，并使用 `writeFileSync` 方法将其保存到 `repd.json`。`JSON.stringify` 接收一个参数加上两个可选参数。第一个参数是数组，第三个参数是缩进空格数。我们将缩进设置为\
    \ 2 以使文件具有人类可读性。将其设置为 0（或省略可选参数）将消除 JSON 字符串中的空白，并产生更小的文件。writeFileSync 接收两个参数：文件名和字符串。它会打开或创建文件并将字符串写入其中。\n\
    \n***\n\n当使用 `node index.js` 脚本时，它会处理数据并写入 `repd.json`。`repd.json` 如下：\n\n```json\n\
    [\n  {\n    \"id\": \"1\",\n    \"name\": \"Aberthaw Power Station Biomass\",\n\
    \    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"lon\"\
    : -3.407,\n    \"lat\": 51.387,\n    \"region\": \"Wales\",\n    \"status\": \"\
    Operational\",\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\": 2004,\n\
    \    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\": 2004,\n\
    \    \"daysUntilGranted\": 140\n  },\n  {\n    \"id\": \"2\",\n    \"name\": \"\
    Hunterston - cofiring\",\n    \"technology\": \"Biomass (co-firing)\",\n    \"\
    capacity\": 170,\n    \"lon\": -4.889,\n    \"lat\": 55.736,\n    \"region\":\
    \ \"Scotland\",\n    \"status\": \"Application Withdrawn\",\n    \"operator\"\
    : \"Orsted (formerly Dong Energy) / Peel Energy\",\n    \"yearSubmitted\": 2010,\n\
    \    \"dateSubmitted\": \"2010-06-02T00:00:00.000Z\",\n    \"yearGranted\": null,\n\
    \    \"daysUntilGranted\": null\n  },\n  ...\n]\n```\n\n列表 68. wrangling/index.js\n\
    \n# 附录 D：练习提示和解思路\n\n本附录包含了“进一步学习建议”部分的提示和解思路。\n\n## D.1 JavaScript 与数据可视化\n\n\
    ### D.1.1 显示不同的字段（例如运营商和/或状态）\n\n要向表格添加 `operator` 属性：\n\n```javascript\nlet list\
