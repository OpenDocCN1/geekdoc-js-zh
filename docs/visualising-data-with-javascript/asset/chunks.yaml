  trans: "\n\n`<svg>` 元素以灰色绘制，它包含一个 `<g class=\"inner\">` 元素，该元素包含了所有的图表元素（包括轴）。x\
    \ 轴和 y 轴交于 `<g class=\"inner\">` 元素的原点（用两条轴交汇处的一个小圆表示）。\n\n为了给轴标签留出足够的空间，我们在 `<g\
    \ class=\"inner\">` 元素周围引入了边距，这些边距通过变量 `leftMargin`、`rightMargin`、`topMargin`\
    \ 和 `bottomMargin` 指定。我们在 `update` 的开头定义了这些变量：\n\n```javascript\nfunction update(data)\
    \ {\n  let width = 1200, height = 600; ①\n  let leftMargin = 210, rightMargin\
    \ = 20, topMargin = 20, bottomMargin = 40; ②\n\n  ...\n}\n```\n\nListing 29. d3-dot/main.js\n\
    \n1. *①* 定义 `<svg>` 元素的整体宽度高度。\n2. *②* 定义左、右、上、下边距。\n\n尽管 REPD 散点图的截图显示 x 轴位于图表底部，但它实际上位于顶部。我们将刻度长度设置为图表的全的高度，这使得刻度线看起来像网格线，并且刻度标签被推到了图表的底部（见后文）。\n\
    \n接下来在 `update` 中，我们创建了 x、y 和半径比例尺函数：\n\n```javascript\nfunction update(data)\
    \ {\n  ...\n\n  // x scale\n  let dateSubmittedExtent = extent(data, d => d.dateSubmitted);\n\
    \  let xLength = width - leftMargin - rightMargin;\n  let xScale = scaleTime()\
    \ ①\n      .domain(dateSubmittedExtent)\n      .range([0, xLength]);\n\n  // y\
    \ scale\n  let technologyValues = tidy(\n    data,\n    count('technology'),\n\
    \    sort('technology')\n  ).map(d => d.technology);\n  let yLength = height -\
    \ topMargin - bottomMargin;\n  let yScale = scalePoint() ②\n      .domain(technologyValues)\n\
    \      .range([0, yLength]);\n\n  // radius scale\n  let maxCapacity = max(data,\
    \ d => d.capacity);\n  let maxRadius = 20;\n  let rScale = scaleSqrt() ③\n   \
    \   .domain([0, maxCapacity])\n      .range([0, maxRadius]);\n\n  ...\n}\n```\n\
    \nListing 30. d3-dot/main.js\n\n1. *①* 比例尺函数 `xScale` 用于确定点的 x 轴位置。它的输入是一个 `dateSubmitted`\
    \ 值（一个 JavaScript 日期对象），输出是一个 x 坐标。输入域是 `dateSubmitted` 属性的范围，输出范围是总宽度减去左、右边距（参图图表布局图）。x\
    \ 轴由 `dateSubmitted` 驱动，因此我们使用 `scaleTime` 来生成一个接受日期对象作为输入的比例尺函数。\n2. *②* 比例尺函数\
    \ `yScale` 用于确定点的 y 轴位置。它的输入是一个技术值（例如 `'Battery'`），输出是一个 y 坐标。输入域是 `technologyValues`，这是一个经过排序的唯一技术名称数组（使用\
    \ `tidy.js` 创建），输出范围是总高度减去上、下边距。y 轴由离散值驱动，我们希望输出值间距均匀，因此我们使用 D3 的 `scalePoint`。\n\
    3. *③* 比例尺函数 `rScale` 用于确定点的半径。它的输入是一个 `capacity` 值（数字），输出是以像素为单位的半径。输入域是 `[0,\
    \ maxCapacity]`，其中 `maxCapacity` 是最大容量。输出范围是 `[0, 20]`，其中 20 是像素为单位的半径上限。我们希望让圆的\
    \ `area`（而不是半径）与容量成比例设置（这是最佳实践），因此我们使用 D3 的 `scaleSqrt`。\n\n```javascript\nfunction\
    \ update(data) {\n  ...\n\n  select('svg')\n    .attr('width', width)\n    .attr('height',\
    \ height);\n\n  select('svg .inner')\n    .attr('transform', 'translate(' + leftMargin\
    \ + ',' + topMargin + ')');\n\n    ...\n}\n```\n\nListing 31. d3-dot/main.js\n\
    \n这段代码使用 `width` 和 `height` 变量设置 `<svg>` 元素的宽度和高度。这确保了 `<svg>` 元素足够大，以包含整个图表。\n\
    \n`<g class=\"inner\">` 通过 `(leftMargin, topMargin)` 进行平移，以为 y 轴标签留出空间并在顶部留出一点空间（参图表布局图）。\n\
    \n***\n\n现在让我们来看绘制可视化图形的代码：\n\n```javascript\nfunction update(data) {\n  ...\n\
    \n  // Points\n  select('svg .points') ①\n    .selectAll('circle') ②\n    .data(data)\
    \ ③\n    .join('circle') ④\n    .attr('cx', d => xScale(d.dateSubmitted)) ⑤\n\
    \    .attr('cy', d => yScale(d.technology)) ⑤\n    .attr('r', d => rScale(d.capacity))\
    \ ⑤\n    .style('fill', d => statusColors[d.status]) ⑤\n    .style('stroke', d\
    \ => statusColors[d.status]) ⑤\n    .style('fill-opacity', 0.5)\n    .each(function(d)\
    \ { ⑥\n      let html = ''; ⑦\n      html += '<div>Name: ' + d.name + '</div>';\n\
    \      html += '<div>Technology: ' + d.technology + '</div>';\n      html += '<div>Capacity:\
    \ ' + d.capacity + ' MW</div>';\n      html += '<div>Date submitted: ' + d.dateSubmitted.toDateString()\
    \ + '</div>';\n      html += '<div>Status: ' + d.status + '</div>';\n      tippy(this,\
    \ { ⑧\n        content: html, ⑨\n        allowHTML: true, ⑩\n        theme: 'light',\
    \ ⑪\n        duration: 0 ⑫\n      });\n    });\n\n    ...\n}\n```\n\nListing 32.\
    \ d3-dot/main.js\n\n1. *①* 前四行将 `data` 数组绑定到 `circle` 元素。数据绑定遵循我们在 Data joins\
    \ 中介绍的步骤。\n2. *②* 调用 `selectAll`。\n3. *③* 将 `data` 数组与关联。\n4. *④* 调用 `join` 并传入元素类型。\n\
    5. *⑤* 调用 `attr` 和 `style` 设置圆的位置、大小和颜色。\n6. *⑥* 调用 D3 的 `each` 方法来遍历集合。\n7. *⑦*\
    \ 定义变量 `html` 用来指定提示框的内容。\n8. *⑧* 调用 Tippy 构造函数并传入 `this`（代表集合当前的 DOM 元素）。\n9.\
    \ *⑨* 将提示框内容设置为 HTML 字符串。\n10. *⑩* 将 `allowHTML` 设置为 `true`，以便 Tippy 将内容解释为 HTML。\n\
    11. *⑪* 将主题设置为 `light`。\n12. *⑫* 将显示和隐藏持续时间设置为零，以便提示框立即出现并消失。\n\n最后在 `update`\
    \ 中我们绘制轴：\n\n```javascript\nfunction update(data) {\n  ...\n\n  // y-axis\n  let\
    \ yAxis = axisLeft(yScale) ①\n      .tickSize(0); ②\n\n  select('svg .y-axis')\
    \ ③\n    .call(yAxis);\n\n  // x-axis\n  let xAxis = axisBottom(xScale) ④\n  \
    \    .tickSize(yLength + 20); ⑤\n\n  select('svg .x-axis') ⑥\n    .call(xAxis);\n\
    }\n```\n\nListing 33. d3-dot/main.js\n\n1. *①* 轴的创建类似于 Axes 部分中的示例。我们首先使用 `axisLeft`\
    \ 并传入 `yScale` 为 y 轴创建一个生成器。\n2. *②* y 轴不需要刻度线，因此我们通过调用 `tickSize` 并传入 0 将刻度大小设置为\
    \ 0。\n"
- fmt: "\n3. ③ Select the y-axis container and use the `call` method to run the generator.\
    \ The y-axis starts at the origin of `<g class=\"inner\">` and proceeds downwards.\
    \ (The origin of `<g class=\"inner\">` is at `(leftMargin, topMargin)` relative\
    \ to the `<svg>` element and is depicted by the small circle in the chart layout\
    \ diagram.) By default the labels of an `axisLeft` axis appear to the left of\
    \ the axis line.\n\n4. ④ Create an axis generator for the x-axis using `axisBottom`\
    \ and pass in `xScale`.\n\n5. ⑤ Set the tick size to `yLength + 20` which means\
    \ the ticks span the entire height of the chart. This also pushes the tick labels\
    \ all the way to the bottom of the chart. This is a clever trick to create gridlines.\n\
    \n6. ⑥ Select the x-axis container and use the `call` method to run the generator.\
    \ The x-axis starts at the origin of `<g class=\"inner\">` and proceeds to the\
    \ right.\n\nThere’s also a few CSS rules in `style.css` that hide the the x-axis'\
    \ primary line so that only the ticks are visible.\n\n### 5.5.4 style.css\n\n\
    `style.css` mainly contains a few CSS rules to style the axes:\n\n```\nbody {\n\
    \  font-family: Inter, Avenir, Helvetica, Arial, sans-serif; ①\n  background-color:\
    \ #eee; ②\n}\n\ng.x-axis path, g.y-axis path {\n  display: none; ③\n}\n\ng.x-axis\
    \ line {\n  stroke-dasharray: 1 1; ④\n  stroke: #ccc; ④\n}\n\ng.x-axis text, g.y-axis\
    \ text {\n  font-family: Inter, Avenir, Helvetica, Arial, sans-serif; ⑤\n  font-size:\
    \ 12px;\n}\n```\n\nListing 34. d3-dot/style.css\n\n1. ① Set the font family for\
    \ the whole page. This rule remains from Vite’s default project.\n\n2. ② Set the\
    \ page background colour to off white.\n\n3. ③ The primary line of the axis (the\
    \ line that connects the tick marks) is hidden by selecting the `path` element\
    \ that represents the line and setting its `display` to `none`. (It’s not obvious\
    \ how to style an axis generated by D3. I usually inspect the axis using the browser’s\
    \ inspect element tool, find the element I’m interested in and figure out what\
    \ selector string to use.)\n\n4. ④ The vertical grid lines (made up of the full\
    \ height x-axis ticks) are given a feint, dotted style.\n\n5. ⑤ For reasons unknown\
    \ to me the font family of the `body` element doesn’t cascade to the axes so I’ve\
    \ added a rule for this.\n\n## 5.6 Wrapping up\n\nThis chapter introduced D3.js\
    \ and showed how to create a custom chart using it. Ceating a chart using D3 is\
    \ a lot more involved than with Chart.js but the advantage is you can fully customise\
    \ the chart.\n\nWhether or not you think you’ll use D3 in the future I hope this\
    \ chapter helps you understand D3 better.\n\n## 5.7 Ideas for further study\n\n\
    I recommend playing around with the project by exploring, modifying and adding\
    \ code. Here are some ideas:\n\n* show regions along the y-axis (instead of technology).\n\
    * change the colour scheme so that Battery applications are coloured in purple\
    \ and everything else in grey.\n* change the information displayed in the tooltip.\n\
    \nVisit the Appendix for solutions.\n\n# 6. Data-driven Maps with Leaflet\n\n\
    This chapter introduces [Leaflet](https://leafletjs.com/) which is a free, open-source\
    \ JavaScript library for making maps. Leaflet creates tile-based maps meaning\
    \ the maps are made up of small images tiled together. (This is the same method\
    \ that Google Maps uses.) The user can zoom in and out and scroll around the map.\n\
    \nYou can also draw shapes on the map which means you can create data-driven maps.\n\
    \nHere’s a map generated using Leaflet that visualises the REPD data (we’ll step\
    \ through this project in this chapter):\n\n![leaflet](images/leaflet.png)\n\n\
    Figure 39. Leaflet map showing REPD planning applications\n\nIn this chapter I:\n\
    \n* introduce Leaflet\n* show how to use Leaflet\n* walk through a Leaflet example\
    \ that visualises the REPD data.\n\n* * *\n\n## 6.1 Introduction to Leaflet\n\n\
    Leaflet is a free, open-source JavaScript library that draws tile-based maps.\
    \ It’s relatively easy to use, very configurable and you can draw shapes such\
    \ as circles on top of the map.\n\nA Leaflet map is made up of small JPG or PNG\
    \ images placed in a grid formation. When the map first loads, and when the map\
    \ is panned or zoomed, new tiles are loaded.\n\n![leaflet tiles](images/leaflet-tiles.png)\n\
    \nFigure 40. Map tiles\n\nLeaflet relies on a tile server to provide the map tiles.\
    \ There’s lots of options but few of them are free. In this book we use [Stadia’s\
    \ tiles](https://stadiamaps.com/products/map-tiles/) which are free for non-commercial\
    \ use but if you publish your map on the web you’ll need a Stadia account. If\
    \ you were really serious you could consider hosting your own tile server but\
    \ this isn’t something I’ve done myself.\n\nYou can browse the [https://stadiamaps.com/products/map-tiles/](https://stadiamaps.com/products/map-tiles/)\
    \ tile sets.\n\n* *\n\n## 6.2 How to use Leaflet\n\n### 6.2.1 Installation\n\n\
    Install Leaflet by navigating to your project and calling `npm install`.\n\n###\
    \ 6.2.2 Creating a map\n\nThere are a few steps to creating a map:\n\n#### Add\
    \ a container\n\nA `<div>` container for the map must be added to the HTML. \n\
    \n```html\n<div id=\"map\"></div>\n```\n\n#### Set the height of the container\n\
    \nThe height of the container must be set. This can be done using CSS.\n\n```css\n\
    #map {\n  height: 600px;\n}\n```\n\n#### Import Leaflet’s stylesheet\n\nLeaflet\
    \ has a stylesheet that must be included in your project. For a Vite project,\
    \ this can be done by adding an `@import` statement in `style.css`.\n\n```css\n\
    @import 'leaflet/dist/leaflet.css';\n```\n\n#### Create a map\n\nIn the JavaScript\
    \ code a map is created by importing the Leaflet library, calling the `map` method,\
    \ specifying the tile server and setting the view center:\n\n```javascript\nimport\
    \ L from 'leaflet'; ①\n\nlet map = L.map('map'); ②\n\nL.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',\
    \ ③\n  maxZoom: 20,\n  attribution: '&copy; <a href=\"https://stadiamaps.com/\"\
    >Stadia Maps</a>a>...',\n}).addTo(map); ④\n\nmap.setView([55, -2], 6); ⑤\n```\n\
    \n1. ① The first line of `main.js` imports the main Leaflet object. This object\
    \ is exported as an unnamed object, so we have to name it. The convention is to\
    \ name it `L`.\n\n2. ② Next a map object is created by calling `L.map` and passing\
    \ in the id of the `<div>` container. This creates a map object but doesn’t draw\
    \ the map yet. We still need to add a tile layer to the map.\n\n3. ③ The next\
    \ step is to create a tile layer using `L.tileLayer`. Pass in two arguments, the\
    \ tile layer’s URL and a configuration object. Both arguments are usually supplied\
    \ by the tile server provider.\n\n4. ④ The tile layer is then added to the map\
    \ object using `addTo`. (`addTo` is a layer method that adds the layer to an existing\
    \ map object.)\n\n5. ⑤ The final step sets the view center of the map.\n"
