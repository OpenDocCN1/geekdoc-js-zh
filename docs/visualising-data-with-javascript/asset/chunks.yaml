    \ Unlike Chart.js which provides a selection of ready made charts, D3 provides\
    \ a selection of functions that help you make any chart you can imagine. In culinary\
    \ terms Chart.js is like a ready meal (fast and convenient) and D3 is like cooking\
    \ from raw ingredients (which takes more time and skill but with superior results).\n\
    \nD3 does require more skill and usually requires more coding. For instance to\
    \ create a bar chart with Chart.js requires a few lines of code but with D3 this\
    \ could run into hundreds of lines (if you want to cover all features and cases).\n\
    \nI cover D3 in this book because it’s one of the most popular JavaScript data\
    \ visualisation libraries and is a very powerful tool. However it’s beyond this\
    \ book’s scope to cover D3 comprehensively but I show enough to give you an idea\
    \ of how D3 works and what it can do.\n\nIf you’re interested in learning more\
    \ I suggest reading [D3 Start to Finish](https://www.createwithdata.com/d3-start-to-finish-book/)\
    \ which takes you through a full example step by step.\n\nDon’t worry if this\
    \ chapter proves challenging. We don’t use D3 elsewhere in this book so you can\
    \ skip this chapter if you wish.\n\n* * *\n\n## 5.2\\. Principles of D3\n\n###\
    \ 5.2.1\\. The data join\n\nOne of the key principles of D3 is the data join.\
    \ This is where an array of data is associated with a group of DOM elements. (A\
    \ DOM element is the browser’s internal representation of an HTML or SVG element.)\
    \ This means that each data item is associated with a DOM element. We then associate\
    \ data variables (such as year, technology type or capacity) with style and attributes\
    \ of the DOM elements (such as position, size and colour).\n\nFor instance we\
    \ could represent each REPD planning application with a circle. This results in\
    \ 8000 or so circles. Now let’s associate the submission year (`yearSubmitted`)\
    \ with the circle’s position along the x-axis. This results in a line of circles\
    \ where the right-most circles are the most recent applications:\n\n![d3 dot 1](images/d3-dot-1.png)\n\
    \nFigure 26\\. Dot plot where the x coordinate represents submission date\n\n\
    This isn’t the most useful (nor impressive) data visualisation. But rest assured,\
    \ each dot represents a planning application. If we make each circle transparent\
    \ (by lowering it’s `opacity` value) we can see more of a trend over time (the\
    \ darker the line, the more applications there were):\n\n![d3 dot 2](images/d3-dot-2.png)\n\
    \nFigure 27\\. Reducing the opacity of each circle reveals a trend\n\nNow let’s\
    \ position each circle along the y-axis according to its technology type:\n\n\
    ![d3 dot 3](images/d3-dot-3.png)\n\nFigure 28\\. Positioning each circle along\
    \ the y coordinate according to technology\n\nNow we can see patterns in the data.\
    \ We can see that some technologies have become more prevalent in later years\
    \ while one technology (the one just below the middle of the chart) was more prevalent\
    \ in earlier years but subsequently waned. The bottom row (which represents onshore\
    \ wind) has had a strong stream of applications across all years. (There’s no\
    \ labels to tell us which row belongs to which technology. Unfortunately this\
    \ is where D3 requires more effort as we have to add them using more code!)\n\n\
    Now let’s colour each circle according to it’s application status:\n\n![d3 dot\
    \ 4](images/d3-dot-4.png)\n\nFigure 29\\. Colouring each circle according to its\
    \ status\n\nGreen means the site is operational, yellow means the site is awaiting\
    \ or under construction, purple means the planning application is in progress\
    \ and grey means the planning application has been abandoned, withdrawn or refused.\
    \ Now let’s size each circle according to the power output (or capacity) of each\
    \ proposed installation:\n\n![d3 dot 5](images/d3-dot-5.png)\n\nFigure 30\\. Sizing\
    \ each circle according to its capacity\n\nThe bottom row represent onshore wind\
    \ and the one above offshore wind. Not surprisingly these have the largest power\
    \ outputs.\n\nThis example gives a flavour of how D3 works. We represent data\
    \ with shapes and modify each shape’s 'visual variables' according to its data\
    \ values. (A shape’s visual variable is a quantity such as x coordinate, y coordinate,\
    \ length, width, radius and colour.)\n\nIn this chapter I show you how to create\
    \ the example we’ve just stepped through. We also add an x-axis that shows the\
    \ years and a y-axis that shows the technology types.\n\n![d3 timeline](images/d3-timeline.png)\n\
    \nFigure 31\\. REPD timeline (d3-dot project)\n\n### 5.2.2\\. Modules\n\nD3 consists\
    \ of a number of modules each of which contains functions that help you build\
    \ visualisations. (You can picture D3 as a toolkit for building visualisations.)\n\
    \nThe modules include:\n\n*   `d3-selection` (functions to add, remove and modify\
    \ DOM elements and perform data joins)"
