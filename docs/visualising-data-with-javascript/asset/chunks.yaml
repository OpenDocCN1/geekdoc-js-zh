    \ This is non-standard JavaScript (you can’t import CSS files in standard JavaScript)\
    \ but is supported by Vite.\n\n3.  *③* Set various Chart.js global default options\
    \ to save us having to set the same options on each chart. The first one `maintainAspectRatio`\
    \ lets the charts adapt to the width of the content area while keeping the height\
    \ fixed.\n\n4.  *④* Create a colour palette object `statusPalette` for the map\
    \ and doughnut colour scheme.\n\n* * *\n\nNow that the defaults and colour palette\
    \ have been defined we define the main functions:\n\n```\n...\n\nfunction getMultiSeriesChartData(data,\
    \ seriesProp, labelProp) { ... } ①\n\nfunction drawChart1(data) { ... } ②\nfunction\
