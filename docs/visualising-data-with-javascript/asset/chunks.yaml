- fmt: "\n```javascript\nfunction drawChart3(data) {\n  let summary = tidy( ①\n  \
    \  data,\n    filter(d => d.technology === 'Battery'),\n    count('status', {sort:\
    \ true})\n  );\n\n  const myChart = new Chart('chart-3', {\n    type: 'doughnut',\
    \ ②\n    data: { ③\n      labels: summary.map(d => d.status),\n      datasets:\
    \ [{\n        data: summary.map(d => d.n),\n        backgroundColor: summary.map(d\
    \ => statusPalette[d.status]) ④\n      }],\n    },\n    options: {\n      plugins:\
    \ {\n        title: {\n          text: 'Status of battery planning applications\
    \ in 2022',\n        },\n        legend: {\n          display: true\n        }\n\
    \      }\n    }\n  });\n}\n```\nListing 59. `data-story/main.js`\n\n1. `①` Use\
    \ `tidy.js` to filter by technology type (to include only Battery applications)\
    \ then count the number of applications for each status code.\n\n2. `②` Set the\
    \ chart type to `'doughnut'`.\n\n3. `③` The data structures are the same as for\
    \ bar charts. `Chart.js` automatically calculates the percentages for the doughnut\
    \ chart.\n\n4. `④` Use the `statusPalette` colour object to set the segment colours.\n\
    \nBy now this function should feel quite familiar. We use `tidy.js` to extract\
    \ the data we require then create a chart using `Chart.js`. The main difference\
    \ with this chart is its type is `'doughnut'`. One of the great things about `Chart.js`\
    \ is that we only needed to change the chart’s type to create a doughnut chart.\
    \ (The `data` configuration object remains the same.)\n\n***\n\n***\n\n### drawChart5\n\
    \nThe final chart is a bar chart that shows the average time to grant a planning\
    \ application, broken down by technology type.\n\n![data story chart 4](images/data-story-chart-4.png)\n\
    \nFigure 56. Bar chart showing average time to grant a planning application\n\n\
    The REPD data contains a property `daysUntilGranted` which is the number of days\
    \ between the `dateSubmitted` and `dateGranted` dates. (This property was added\
    \ by the script that converted the original REPD CSV file into a JSON file. See\
    \ the `wrangling` project.) We use `tidy.js` to compute the mean number of days\
    \ for each technology type.\n\nThe chart itself is straightforward, the main difference\
    \ being its dark theme and the bar representing Battery technology is highlighted.\n\
    \n***\n\n***\n\nHere’s the code (with the options object truncated):\n\n```javascript\n\
    function drawChart4(data) {\n  let summary = tidy(\n    data,\n    filter(d =>\
    \ d.daysUntilGranted !== null), ①\n    groupBy('technology', [ ②\n      summarize({\n\
    \        meanDaysUntilGranted: mean('daysUntilGranted')\n      })\n    ]),\n \
    \   sort('meanDaysUntilGranted') ③\n  );\n\n  const myChart = new Chart('chart-4',\
    \ ④\n    type: 'bar',\n    data: {\n      labels: summary.map(d => d.technology),\n\
    \      datasets: [{\n        data: summary.map(d => d.meanDaysUntilGranted), ⑤\n\
    \        backgroundColor: summary.map(d => d.technology === 'Battery' ? teal:\
    \ '#777') ⑥\n      }]\n    },\n    options: { ... }\n  });\n}\n```\nListing 60.\
    \ `data-story/main.js`\n\n1. `①` Use `tidy.js` to filter out applications whose\
    \ `daysUntilGranted` equals `null`. (These are mostly applications that haven’t\
    \ been granted yet.)\n\n2. `②` Use `tidy.js`’s `groupBy` function to group the\
    \ filtered applications by technology type and compute the mean `daysUntilGranted`\
    \ for each group. (We covered `groupBy` in the 'Make a Chart with Chart.js' chapter.)\n\
    \n3. `③` Sort the applications by `meanDaysUntilGranted`.\n\n4. `④` Create a chart\
    \ in the usual manner.\n\n5. `⑤` The data values are based on the `meanDaysUntilGranted`\
    \ property in `summary`.\n\n6. `⑥` Set the bar colour to grey, unless the technology\
    \ type is Battery.\n\n***\n\n***\n\nThe option objects looks like:\n\n```json\n\
    {\n  scales: {\n    y: {\n      title: {\n        display: true,\n        text:\
    \ 'Days until application granted',\n        color: '#eee'\n      },\n      ticks:\
    \ {\n        color: '#ccc'\n      },\n      grid: {\n        color: '#555'\n \
    \     }\n    },\n    x: {\n      ticks: {\n        color: '#ccc'\n      },\n \
    \     grid: {\n        color: '#333'\n      }\n    }\n  },\n  plugins: {\n   \
    \ title: {\n      text: 'Average time to grant applications (by technology) 1990-2022',\n\
    \      color: '#eee'\n    }\n  }\n}\n```\nListing 61. `data-story/main.js`\n\n\
    Most of the options are to make the axis ticks and gridlines light against the\
    \ dark background.\n\n***\n\n***\n\nThe biggest difference in `drawChart4` is\
    \ the data transformation at the beginning of the function. This uses `tidy.js`\
    \ to filter out applications without a valid `daysUntilGranted` value and to group\
    \ by technology. The mean `daysUntilGranted` is then computed on each group and\
    \ then the groups are sorted by `meanDaysUntilGranted`.\n\nThe output of this\
    \ transformation looks like:\n\n```json\n[\n  {\n    \"technology\": \"Compressed\
    \ Air Energy Storage\"\n  },\n  {\n    \"technology\": \"Liquid Energy Storage\"\
    \n  },\n  {\n    \"technology\": \"Biomass (co-firing)\"\n  }\n]\n```\nEach technology\
    \ is represented by an object that has a name. (I’ve published my version to [http://jsvis-data-story.surge.sh/](http://jsvis-data-story.surge.sh/))\n\
    \n***\n\n## 7.2 Publishing the Data Story\n\nThis section shows how the data story\
    \ can be published using [surge.sh](https://surge.sh/). This is a free service\
    \ that copies a static website (a website that doesn’t generate files) onto a\
    \ server so that anyone can visit the URL.\n\nThere’s three steps to publishing\
    \ the data story:\n\n1. Install `surge` if it isn’t installed.\n2. Build a production\
    \ version of the data story.\n3. Deploy the data story using `surge`.\n\nTo install\
    \ `surge` use:\n\n```bash\nnpm install --global surge\n```\n\nTo build a production\
    \ version of the application navigate to the project directory (`cd data-story`)\
    \ and type:\n\n```bash\nnpm run build\n```\n\nThis creates a new directory `dist`\
    \ and adds the production version to it. (The production version is an optimised\
    \ version of your application that’s suitable for uploading to a static server.)\n\
    \nNext navigate to the `dist` directory and type `surge`:\n\n```bash\ncd dist\n\
    surge\n```\n\n`surge` prompts you with a few questions. Usually it asks you for\
    \ the project’s location. It uses the current directory as the default, so just\
    \ press enter here.\n\nIt then asks for the URL of the data story. It usually\
    \ provides one for you (usually a funny name) but you can rename the part before\
    \ `.surge.sh` to whatever you like. Surgege then copies your data story to its\
    \ servers and gives you its URL. Click on the URL (or copy it and paste into a\
    \ web browser) and you should see the published version of the data story.\n\n\
    ***\n\n***\n\nIf you’ve tried to publish your own version you’ll probably find\
    \ the map doesn’t have map tiles.\n\n![data story no map tiles](images/data-story-no-map-tiles.png)\n\
    \nFigure 57. Unregistered Stadia map\n\nThis is because the map tile provider\
    \ Stadia requires you to register the URL of any site that’s using their map tiles.\
    \ This is so that they can keep track of how many times the tiles are being served.\
    \ If it exceeds the free-tier limits they’ll start charging.\n\nTo register your\
    \ own URL with Stadia create an account at [https://client.stadiamaps.com/signup/](https://client.stadiamaps.com/signup/)\
    \ then use the `Create a Property` button to add your URL. I found that I had\
    \ to put the full domain in the 'Domain' section rather than splitting the subdomain\
    \ and domain. I don’t know why!\n\n![stadia prop](images/stadia-prop.png)\n\n\
    Figure 58. Stadia dashboard property\n\n 7.3 Wrapping up\n"
