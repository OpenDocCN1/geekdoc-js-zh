    \ as is but with ticks.\n\n### 5.3.6. Events\n\nYou can attach event handlers\
    \ to a selection using the `.on` method. This accepts two arguments:\n\n* the\
    \ event type (e.g. `'click'`, `'mouseover'`, `'mouseout'`)\n* a function whose\
    \ first parameter `e` is the browser event and second parameter `d` is the bound\
    \ data.\n\nAs an example let’s add an event handler to a circle:\n\n```javascript\n\
