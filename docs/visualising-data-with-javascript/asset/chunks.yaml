  trans: "\n这是 Codepen 上的示例：[`codepen.io/createwithdata/pen/OJwpVbG`](https://codepen.io/createwithdata/pen/OJwpVbG)。\n\
    \n### 5.3.4. 比例尺函数 (Scale functions)\n\n尺度函数允许你将数据变量转换为视觉变量，例如位置和颜色。例如，REPD 数据中的年份在\
    \ 1990 年到 2021 年之间。如果你想构建一个长度为 1000 像素的时间轴，可以创建一个比例函数，接收年份并输出 0 到 1000 之间的值。\n\
    \nD3 有几种比例尺类型，最常见的是 `scaleLinear`、`scaleSqrt`、`scaleTime` 和 `scalePoint`。对于每种比例类型，D3\
    \ 都提供了一个构造函数。典型的用法模式是：\n\n* 调用比例尺构造函数。这会返回一个比例函数。\n* 通过调用比例函数的 `domain` 方法设置比例尺的域（domain）。域是比例函数的输入最小值和最大值值。\n\
    * 通过调用比例函数的 `range` 方法设置比例尺的范围（range）。范围是比例函数的输出最小值和最大值。\n\n这里有一个创建一个线性比例尺的示例：\n\
    \n```\nimport { scaleLinear } from 'd3-scale';\n\nlet myScale = scaleLinear()\
    \ ①\n  .domain([0, 100]) ②\n  .range([0, 500]); ③\n```\n\n1. ① 调用比例尺构造函数以创建并返回一个比例函数。\n\
    2. ② 调用比例尺的 `domain` 方法设置其域（其最小和最大输入）。\n3. ③ 调用比例尺的 `range` 方法设置其范围（其最小和最大输出）。\n\
    \n`myScale` 是一个线性比例函数，它接受 0 到 100 之间的值，并输出 0 到 500 之间的值。它在域和范围之间进行线性映射。这意味着沿域的比例为\
    \ `u` 的输入值将映射到沿范围的比例为 `u` 的值。\n\n例如：\n\n```\nmyScale(0); // 返回 0\nmyScale(100);\
    \ // 返回 500\nmyScale(50); // 返回 250\n```\n\n`scaleTime` 与 `scaleLinear` 类似，但它的域是一个日期数组：\n\
    \n```\nimport { scaleTime } from 'd3-scale';\n\nlet timeScale = scaleTime()\n\
    \  .domain([new Date(2016, 0, 1), new Date(2017, 0, 1)])\n  .range([0, 700]);\n\
    \ntimeScale(new Date(2016, 0, 1));   // 返回 0\ntimeScale(new Date(2016, 6, 1));\
    \   // 返回 348.00...\ntimeScale(new Date(2017, 0, 1));   // 返回 700\n```\n\n我们在\
    \ REPD 点图示例中使用 `scaleTime` 来计算每个圆的 x 坐标。\n\n`scalePoint` 接受分类值数组作为其域，并将值分布在范围内：\n\
    \n```\nlet pointScale = scalePoint()\n  .domain(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'])\n\
    \  .range([0, 500]);\n\npointScale('Mon');  // 返回 0\npointScale('Tue');  // 返回\
    \ 125\npointScale('Fri');  // 返回 500\n```\n\n我们在 REPD 点图示例中使用 `scalePoint` 来计算每个圆的\
    \ y 坐标。\n\n***\n\n`scaleSqrt` 在按变量比例调整圆的大小时非常有用：\n\n```\nlet sqrtScale = scaleSqrt()\n\
    \  .domain([0, 100])\n  .range([0, 30]);\n\nsqrtScale(0);   // 返回 0\nsqrtScale(50);\
    \  // 返回 21.21...\nsqrtScale(100); // 返回 30\n```\n\n我们在 REPD 点图示例中使用 `scaleSqrt`\
    \ 来计算每个圆的半径。\n\n### 5.3.5. 轴 (Axes)\n\n`d3-axis` 模块帮助你绘制轴。要绘制轴：\n\n* 创建一个 SVG\
    \ `<g>` 元素作为轴的容器。你还需要使用 `transform` 属性对其进行适当定位。\n* 通过调用 `axisLeft`、`axisRight`、`axisBottom`\
    \ 或 `axisTop` 并传入一个比例函数来创建一个轴生成器。\n* 选择轴容器并使用选择的 `.call` 方法调用轴生成器。\n\n轴有四类型，取决于它位于图表的哪侧。例如，`axisLeft`\
    \ 用于图表左侧的 y 轴。\n\n作为一个示例，我们来创建一个 x 轴。首先添加一个 SVG `<g>` 元素作为轴的容器。注意我们平移了它，使得轴不会被视口的顶部和左侧边界裁剪：\n\
    \n```\n<svg>\n  <g class=\"x-axis\" transform=\"translate(100,100)\"></g>\n</svg>\n\
    ```\n\n***\n\n在 JavaScript 中，我们创建一个比例函数并将其传入 `axisBottom`：\n\n```javascript\n\
    import { select } from 'd3-selection';\nimport { scaleLinear } from 'd3-scale';\n\
    \nlet scale = scaleLinear()\n  .domain([0, 100])\n  .range([0, 500]);\n\nlet axis\
    \ = axisBottom(scale);\n\nselect(\"svg\")\n  .append(\"g\")\n  .attr(\"class\"\
    , \"x-axis\")\n  .attr(\"transform\", \"translate(0,500)\")\n  .call(axis);\n\
    ```\n"
- fmt: "\nA tooltip reveals more information about a data point when it’s hovered\
    \ by the mouse pointer. They’re non-trivial to implement well so I recommend using\
    \ a library such as the [Tippy.js tooltip library](https://atomiks.github.io/tippyjs/).\
    \ This library is relatively straightforward to use, looks nice and works well.\
    \ You can populate the tooltip with whatever content you like and it even adapts\
    \ so that it doesn’t get clipped when it’s close to the edge of its container.\n\
    \n![tippyjs](images/tippyjs.png)\n\nFigure 35. Tippy.js tooltip\n\nTo use Tippy.js:\n\
    \n*   install using `npm install tippy.js` on the command line\n*   import into\
    \ a JavaScript file using `import tippy from 'tippy.js'`\n*   import Tippy’s style\
    \ file using `import 'tippy.js/dist/tippy.css'`\n*   add a tooltip to each element\
    \ by calling `tippy()`. The first argument specifies the element and the second\
    \ argument is a configuration object.\n\n* * *\n\nLet’s add tooltips to our ongoing\
    \ example:\n\n```\nimport { select } from 'd3-selection';\nimport tippy from 'tippy.js';\
    \ ①\nimport 'tippy.js/dist/tippy.css'; ②\n\nlet data = [\n  { time: 50, value:\
    \ 15 },\n  { time: 150, value: 40 },\n  { time: 250, value: 30 }\n];\n\nselect('svg')\n\
    \  .selectAll('circle')\n  .data(data)\n  .join('circle')\n  .style('fill', 'orange')\n\
    \  .attr('cx', d => d.time)\n  .attr('cy', 100)\n  .attr('r', d => d.value)\n\
    \  .each(function(d) { ③\n    tippy(this, { ④\n      content: 'The value is '\
    \ + d.value ⑤\n    });\n  });\n```\n\n1.  ① Import Tippy’s constructor function\
    \ `tippy()`.\n2.  ② Import Tippy’s style file. (Vite allows you to import CSS\
    \ files within a JavaScript file.)\n3.  ③ D3’s `each` method lets you iterate\
    \ through each element in a selection. For each element in the selection, the\
    \ specified callback function is called and the element’s joined data is assigned\
    \ to the `d` parameter.\n4.  ④ A tooltip is added to the current element by calling\
    \ `tippy()` and passing in the current element as the first argument. (In the\
    \ callback function D3 assigns the current DOM element to the `this` keyword,\
    \ so long as the function is defined using the `function` keyword, rather than\
    \ the arrow operator.)\n5.  ⑤ A configuration object is passed in as the second\
    \ argument. We set the content using the `content` property. `d` represents the\
    \ joined data of the current element and we display its value property.\n\n* *\
    \ *\n\nNow when a circle is hovered a toolip is displayed:\n\n![tippyjs simple](images/tippyjs-simple.png)\n\
    \nFigure 36. Tippy.js tooltip on circles example\n\nHere’s the example on Codepen:\
    \ [https://codepen.io/createwithdata/pen/pvzqwLM](https://codepen.io/createwithdata/pen/pvzqwLM)\n\
    \n* * *\n\n## 5.5 D3 example application\n\nIn this section we look at an application\
    \ that loads the REPD data and creates a custom visualisation using D3. This project\
    \ is built using Vite so follows a similar structure to the `load-data` project.\n\
    \nThe visualisation is a dot plot where the horizontal position is determined\
    \ by the `yearSubmitted` property and the vertical position by the `technology`\
    \ property. The size of each circle is related to the `capacity` property and\
    \ the colour to the `status` property.\n\nThere’s two axes: one on the left that\
    \ shows the technology types and one at the bottom that shows the year.\n\n![d3\
    \ timeline](images/d3-timeline.png)\n\nFigure 37. Dot plot created by d3-dot project\n\
    \nTo run the project navigate to the `d3-dot` project directory and call `npm\
    \ install`. Call `npm run dev` to start the application server. This will give\
    \ you a url (usually [http://localhost:5173](http://localhost:5173)) to visit.\
    \ You should see a dot plot when you visit this URL.\n\n```\ncd d3-dot\n\nnpm\
    \ install\n\nnpm run dev\n```\n\n### 5.5.1 File structure\n\nThe project directory\
    \ looks like:\n\n```\nd3-dot/\n  index.html\n  main.js\n  node_modules/\n    ...\n\
    \  package-lock.json\n  package.json\n  public/\n    repd.json\n  style.css\n\
    ```\n\nListing 25. d3-dot project files\n\nThe project was built using Vite so\
    \ has the standard Vite file structure. The REPD data is in the `public` directory.\
    \ All the JavaScript code is in `main.js`.\n\nThe main project files are `index.html`,\
    \ `main.js` and `style.css`.\n\n* * *\n\n### 5.5.2 index.html\n\nThe main HTML\
    \ file is `index.html`:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\" />\n    <title>REPD Timeline</title> ①\n  </head>\n  <body><body>\n\
    \    <h1>Timeline of REPD applications 1990-2022</h1> ②\n    <svg> ③\n      <g\
    \ class=\"inner\"> ④\n        <g class=\"x-axis\"></g> ⑤\n        <g class=\"\
    y-axis\"></g> ⑤\n        <g class=\"points\"></g> ⑥\n      </g>\n    </svg>\n\
    \    <script type=\"module\" src=\"/main.js\"></script>\n  </body>\n</html>\n\
    ```\n\nListing 26. d3-dot/index.html\n\n1.  ① As usual we’ve taken the `index.html`\
    \ generated by Vite and modified it. A minor change is to update the content of\
    \ the `<title>` element.\n2.  ② Add a heading for the chart.\n3.  ③ The body content\
    \ is more substantial than previous projects. An `<svg>` element is added for\
    \ the chart.\n4.  ④ We place a `<g class=\"inner\">` element inside the `<svg>`\
    \ element.\n5.  ⑤ Add container for the axes.\n6.  ⑥ Add a container for the dots.\n\
    \n* * *\n\n### 5.5.3 main.js\n\nHere’s an outline of `main.js`:\n\n```\nimport\
    \ { select } from 'd3-selection';\nimport tippy from 'tippy.js'; ①\nimport 'tippy.js/dist/tippy.css';\
    \ ②\n\nimport { axisBottom, axisLeft } from 'd3-axis';\nimport { max, extent }\
    \ from 'd3-array';\nimport { scaleTime, scalePoint, scaleSqrt } from 'd3-scale';\n\
    import { tidy, filter, mutate, sort, desc } from '@tidyjs/tidy';\n\nlet statusColors\
    \ = {\n  'Abandoned': '#aaa',\n  'Withdrawn': '#aaa',\n  'Refused': '#aaa',\n\
    \  'Submitted': '#358600',\n};\n\nlet green = '#aaa';\nlet purple = '#A675A1';\n\
    let yellow = '#F5CF29';\n\nfunction init(data) {\n  data = tidy(\n    data,\n\
    \    filter(d => d.dateSubmitted !== null), ①\n    mutate({\n      dateSubmitted:\
    \ d => new Date(d.dateSubmitted) ②\n    }),\n    sort(desc('capacity')) ③\n  );\n\
    \n  update(data); ④\n}\n\nfunction update(data) {\n  const svg = select('svg');\n\
    \  const width = 800;\n  const height = 400;\n  const margin = { top: 20, right:\
    \ 20, bottom: 50, left: 50 };\n\n  const x = scaleTime()\n    .domain(extent(data,\
    \ d => d.dateSubmitted))\n    .range([margin.left, width - margin.right]);\n\n\
    \  const y = scalePoint()\n    .domain([...new Set(data.map(d => d.technology))])\n\
    \    .range([margin.top, height - margin.bottom])\n    .padding(0.1);\n\n  svg.append('g')\n\
    \    .attr('class', 'x-axis')\n    .attr('transform', `translate(0,${height -\
    \ margin.bottom})`)\n    .call(axisBottom(x));\n\n  svg.append('g')\n    .attr('class',\
    \ 'y-axis')\n    .attr('transform', `translate(${margin.left},0)`)\n    .call(axisLeft(y));\n\
    \n  const points = svg.append('g')\n    .attr('class', 'points');\n\n  points.selectAll('circle')\n\
    \    .data(data)\n    .join('circle')\n    .attr('cx', d => x(d.dateSubmitted))\n\
    \    .attr('cy', d => y(d.technology))\n    .attr('r', d => Math.sqrt(d.capacity)\
    \ * 2)\n    .attr('fill', d => statusColors[d.status] || green)\n    .each(function(d)\
    \ {\n      tippy(this, {\n        content: 'The value is ' + d.value\n      });\n\
    \    });\n}\n\nfetch('./repd.json')\n  .then(res => res.json())\n  .then(data\
    \ => init(data));\n```\n\nListing 27. d3-dot/main.js\n\n1.  ① The structure of\
    \ `main.js` is fairly similar to previous projects. We import functions from D3,\
    \ tidy.js and tippy.js.\n2.  ② Define a lookup object `statusColors`. (We define\
    \ a few colours (`green`, `purple` and `yellow`) so we can reuse them in the `statusColors`\
    \ object).\n3.  ③ `init` carries out some processing then calls `update`.\n4.\
    \  ④ At the end of `init` call `update` which draws the chart.\n\n* * *\n\nBefore\
    \ looking at `update` lets look at the chart layout:\n\n![d3 dot layout](images/d3-dot-layout.png)\n\
    \nFigure 38. d3-dot chart layout\n"
  raw: "A tooltip reveals more information about a data point when it’s hovered by\
    \ the mouse pointer. They’re non-trivial to implement well so I recommend using\
    \ a library such as the [Tippy.js tooltip library](https://atomiks.github.io/tippyjs/).\
    \ This library is relatively straightforward to use, looks nice and works well.\
    \ You can populate the tooltip with whatever content you like and it even adapts\
    \ so that it doesn’t get clipped when it’s close to the edge of its container.\n\
    \n![tippyjs](images/tippyjs.png)\n\nFigure 35\\. Tippy.js tooltip\n\nTo use Tippy.js:\n\
    \n*   install using `npm install tippy.js` on the command line\n\n*   import into\
    \ a JavaScript file using `import tippy from 'tippy.js'`\n\n*   import Tippy’s\
    \ style file using `import 'tippy.js/dist/tippy.css'`\n\n*   add a tooltip to\
    \ each element by calling `tippy()`. The first argument specifies the element\
    \ and the second argument is a configuration object.\n\n* * *\n\nLet’s add tooltips\
    \ to our ongoing example:\n\n```\nimport { select } from 'd3-selection';\nimport\
    \ tippy from 'tippy.js'; ①\nimport 'tippy.js/dist/tippy.css'; ②\n\nlet data =\
    \ [\n  { time: 50, value: 15 },\n  { time: 150, value: 40 },\n  { time: 250, value:\
    \ 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n  .data(data)\n  .join('circle')\n\
    \  .style('fill', 'orange')\n  .attr('cx', d => d.time)\n  .attr('cy', 100)\n\
    \  .attr('r', d => d.value)\n  .each(function(d) { ③\n    tippy(this, { ④\n  \
    \    content: 'The value is ' + d.value ⑤\n    });\n  });\n```\n\n1.  *①* Import\
    \ Tippy’s constructor function `tippy`.\n\n2.  *②* Import Tippy’s style file.\
    \ (Vite allows you to import CSS files within a JavaScript file.)\n\n3.  *③* D3’s\
    \ `each` method lets you iterate through each element in a selection. For each\
    \ element in the selection, the specified callback function is called and the\
    \ element’s joined data is assigned to the `d` parameter.\n\n4.  *④* A tooltip\
    \ is added to the current element by calling `tippy` and passing in the current\
    \ element as the first argument. (In the callback function D3 assigns the current\
    \ DOM element to the `this` keyword, so long as the function is defined using\
    \ the `function` keyword, rather than the arrow operator.)\n\n5.  *⑤* A configuration\
    \ object is passed in as the second argument. We set the content using the `content`\
    \ property. `d` represents the joined data of the current element and we display\
    \ its value property.\n\n* * *\n\nNow when a circle is hovered a toolip is displayed:\n\
    \n![tippyjs simple](images/tippyjs-simple.png)\n\nFigure 36\\. Tippy.js tooltip\
    \ on circles example\n\nHere’s the example on Codepen: [https://codepen.io/createwithdata/pen/pvzqwLM](https://codepen.io/createwithdata/pen/pvzqwLM)\n\
    \n* * *\n\n## 5.5\\. D3 example application\n\nIn this section we look at an application\
    \ that loads the REPD data and creates a custom visualisation using D3\\. This\
    \ project is built using Vite so follows a similar structure to the `load-data`\
    \ project.\n\nThe visualisation is a dot plot where the horizontal position is\
    \ determined by the `yearSubmitted` property and the vertical position by the\
    \ `technology` property. The size of each circle is related to the `capacity`\
    \ property and the colour to the `status` property.\n\nThere’s two axes: one on\
    \ the left that shows the technology types and one at the bottom that shows the\
    \ year.\n\n![d3 timeline](images/d3-timeline.png)\n\nFigure 37\\. Dot plot created\
    \ by d3-dot project\n\nTo run the project navigate to the `d3-dot` project directory\
    \ and call `npm install`. Call `npm run dev` to start the application server.\
    \ This will give you a url (usually [http://localhost:5173](http://localhost:5173))\
    \ to visit. You should see a dot plot when you visit this URL.\n\n```\ncd d3-dot\n\
    \nnpm install\n\nnpm run dev\n```\n\n### 5.5.1\\. File structure\n\nThe project\
    \ directory looks like:\n\n```\nd3-dot/\n  index.html\n  main.js\n  node_modules/\n\
    \    ...\n  package-lock.json\n  package.json\n  public/\n    repd.json\n  style.css\n\
    ```\n\nListing 25\\. d3-dot project files\n\nThe project was built using Vite\
    \ so has the standard Vite file structure. The REPD data is in the `public` directory.\
    \ All the JavaScript code is in `main.js`.\n\nThe main project files are `index.html`,\
    \ `main.js` and `style.css`.\n\n* * *\n\n### 5.5.2\\. index.html\n\nThe main HTML\
    \ file is `index.html`:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\" />\n    <title>REPD Timeline</title> ①\n  </head>\n  <body>\n\
    \    <h1>Timeline of REPD applications 1990-2022</h1> ②\n    <svg> ③\n      <g\
    \ class=\"inner\"> ④\n        <g class=\"x-axis\"></g> ⑤\n        <g class=\"\
    y-axis\"></g> ⑤\n        <g class=\"points\"></g> ⑥\n      </g>\n    </svg>\n\
    \    <script type=\"module\" src=\"/main.js\"></script>\n  </body>\n</html>\n\
    ```\n\nListing 26\\. d3-dot/index.html\n\n1.  *①* As usual we’ve taken the `index.html`\
    \ generated by Vite and modified it. A minor change is to update the content of\
    \ the `<title>` element.\n\n2.  *②* Add a heading for the chart.\n\n3.  *③* The\
    \ body content is more substantial than previous projects. An `<svg>` element\
    \ is added for the chart.\n\n4.  *④* We place a `<g class=\"inner\">` element\
    \ inside the `<svg>` element so that we can position the chart within the `<svg>`\
    \ element.\n\n5.  *⑤* Add container elements for the axes.\n\n6.  *⑥* Add a container\
    \ for the dots.\n\n* * *\n\n### 5.5.3\\. main.js\n\nHere’s an outline of `main.js`:\n\
    \n```\nimport { select } from 'd3-selection'; ①\nimport { scaleTime, scalePoint,\
    \ scaleSqrt } from 'd3-scale';\nimport { max, extent } from 'd3-array';\nimport\
    \ { axisBottom, axisLeft } from 'd3-axis';\nimport { tidy, count, filter, mutate,\
    \ sort, desc } from '@tidyjs/tidy';\nimport tippy from 'tippy.js';\nimport 'tippy.js/dist/tippy.css';\n\
    import 'tippy.js/themes/light.css';\n\nimport './style.css';\n\nlet green = '#358600';\n\
    let grey = '#aaa';\nlet purple = '#A675A1';\nlet yellow = '#F5CF29';\n\nlet statusColors\
    \ = { ②\n  'Abandoned': grey,\n  'Appeal Withdrawn': grey,\n  'Application Refused':\
    \ grey,\n  'Application Submitted': purple,\n  ...\n};\n\nfunction update(data)\
    \ { ... }\n\nfunction init(data) { ③\n  ...\n\n  update(data);\n}\n\nfetch('./repd.json')\
    \ ④\n  .then(res => res.json())\n  .then(data => init(data));\n```\n\nListing\
    \ 27\\. d3-dot/main.js\n\n1.  *①* The structure of `main.js` is fairly similar\
    \ to previous projects. We import functions from D3, tidy.js and tippy.js.\n\n\
    2.  *②* Define a colour lookup object `statusColors`. (We define a few colours\
    \ (`green`, `grey`, `purple` and `yellow`) so we can reuse them in the `statusColors`\
    \ object).\n\n3.  *③* `init` carries out some data processing then calls `update`.\n\
    \n4.  *④* The data is requested using `fetch` at the bottom of the file. When\
    \ the data loads the `init` function is called.\n\n`init` does some data processing\
    \ then calls `update`:\n\n```\nfunction init(data) {\n  data = tidy(\n    data,\n\
    \    filter(d => d.dateSubmitted !== null), ①\n    mutate({\n      dateSubmitted:\
    \ d => new Date(d.dateSubmitted) ②\n    }),\n    sort(desc('capacity')) ③\n  );\n\
    \n  update(data); ④\n}\n```\n\nListing 28\\. d3-dot/main.js\n\n1.  *①* Filter\
    \ out planning applications with a `null` value (which indicates a missing value)\
    \ because there isn’t an obvious way of placing them along a timeline.\n\n2. \
    \ *②* Convert the `dateSubmitted` property from a string into a date object because\
    \ scale functions generated by D3’s `scaleTime` require date objects as input\
    \ rather than strings.\n\n3.  *③* Sort the items by `capacity` in descending order.\
    \ This means that the `<circle>` elements will be ordered within their parent\
    \ element from large to small. This means the largest circles are drawn first\
    \ so smaller circles aren’t hidden behind larger ones.\n\n4.  *④* At the end of\
    \ `init` call `update` which draws the chart.\n\n* * *\n\nBefore looking at `update`\
    \ lets look at the chart layout:\n\n![d3 dot layout](images/d3-dot-layout.png)\n\
    \nFigure 38\\. d3-dot chart layout"
