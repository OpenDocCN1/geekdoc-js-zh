    \n1.  ① `options.maintainAspectRatio` 决定图表的宽高比例是否固定（无论图表宽度如何变化）。它的默认值为 `true`，但我经常将其设置为\
    \ `false`，以便创建一个固定高度且宽度适应设备宽度的图表。\n2.  ② `options.indexAxis` 指定标签所在的轴。它的默认值为 `'x'`。如果设置为\
