    \ />\n    <title>Vite App</title>\n  </head>\n  <body>body\n    <div class=\"\
    chart-wrapper\"> ①\n      <canvas id=\"chart-1\"></canvas> ②\n    </div>\n   \
    \ <div class=\"chart-wrapper dark\"> ①\n      <canvas id=\"chart-2\"></canvas>\
    \ ③\n    </div>\n    <div class=\"chart-wrapper\"> ①\n      <canvas id=\"chart-3\"\
    ></canvas> ④\n    </div>\n    <div class=\"chart-wrapper\"> ①\n      <canvas id=\"\
    chart-4\"></canvas> ⑤\n    </div>\n    <script type=\"module\" src=\"/main.js\"\
    ></script>\n  </body>\n</html>\n```\n\n列表 16. chartjs-various/index.html\n\n1.\
    \ ① 每个 `<canvas>` 元素都放置在一个包装器内，以帮助调整图表大小。\n2. ② 用于样式化柱状图的 `<canvas>` 元素。\n3. ③\
    \ 用于深色主题图表的 `<canvas>` 元素。\n4. ④ 用于折线图的 `<canvas>` 元素。\n5. ⑤ 用于堆叠柱状图的 `<canvas>`\
    \ 元素。\n\n每个图表都有自己带有唯一 `id` 的 `<canvas>` 元素。\n\n要控制 Chart.js 图表的大小，推荐的方法是使用 `<div>`\
    \ 元素包裹图表的 `<canvas>` 元素，并调整该 `<div>` 元素的大小（[参见文档](https://www.chartjs.org/docs/latest/configuration/responsive.html#important-note)）。你还需要将图表的\
    \ `maintainAspectRatio` 选项设置为 `false`，以便图表能够适应包装器的宽度和高度。\n\n在这个项目中，我们为每个 `<div>`\
    \ 包装器添加了 `chart-wrapper` 类名，以便在 `style.css` 中对其进行样式化。\n\n### 4.1.3 style.css\n\
    \n`style.css` 主要包含用于样式化和调整图表包装元素大小的规则：\n\n```css\nbody {\n  margin: 0; ①\n}\n\n\
    .chart-wrapper {\n  height: 600px; ②\n  background-color: #F9F7EB; ③\n  padding:\
    \ 2rem; ④\n}\n\n.chart-wrapper.dark {\n  background-color: #222; ⑤\n}\n```\n\n\
    列表 17. chartjs-various/style.css\n\n1. ① 移除整个页面的默认边距。\n2. ② 将图表包装器的高度设置为 600px，以便图表具有固定高度。图表包装器的宽度（我们未设置）将是\
    \ 100%，这是 `<div>` 元素的默认宽度。这意味着每个图表将跨越整个宽度并且高度为 600px。（将 Chart.js 的 `maintainAspectRatio`\
    \ 选项设置为 `false` 非常重要，这样每个图表就可以垂直和水平方向上填充其包装器。）\n3. ③ 每个图表包装器的背景颜色设置为白色。\n4. ④\
    \ 我们在包装器边界和图表之间添加了一些内边距（padding）。\n5. ⑤ 如果包装器设置了 `dark` 类属性，则将背景设置为深灰色。\n\n###\
    \ 4.1.4 main.js\n\n`main.js` 比较长，让我们先从概要开始：\n\n```javascript\nimport { tidy, count,\
    \ filter } from '@tidyjs/tidy';\nimport Chart from 'chart.js/auto';\nimport uniq\
    \ from 'lodash-es/uniq';\n\nimport './style.css';\n\nChart.defaults.plugins.legend.display\
    \ = false; ④\nChart.defaults.scale.title.font = {size: 14};\nChart.defaults.plugins.title.display\
    \ = true;\nChart.defaults.plugins.title.font.size = 18;\nChart.defaults.maintainAspectRatio\
    \ = false;\n\nconst technologyPalette = { ⑤\n  'Advanced Conversion Technologies':\
    \ '#FF9999',\n  'Anaerobic Digestion': '#C58882',\n  'Battery': '#B6A6CA',\n \
    \ ...\n};\n\nfunction getMultiSeriesChartData(data, seriesProp, labelProp) { ...\
    \ } ③\n\nfunction drawChart1(data) { ... }\nfunction drawChart2(data) { ... }\n\
    function drawChart3(data) { ... }\nfunction drawChart4(data) { ... }\n\nfunction\
    \ draw(data) { ②\n  drawChart1(data);\n  drawChart2(data);\n  drawChart3(data);\n\
    \  drawChart4(data);\n}\n\nfetch('./repd.json') ①\n  .then(res => res.json())\n\
    \  .then(data => draw(data));\n```\n\n列表 18. chartjs-various/main.js\n\n1. ① `main.js`\
    \ 以与 `load-data` 相同的方式加载。当数据到达时调用 `draw`。\n2. ② `draw` 函数为四个图表调用绘制函数（如 `drawChart1`）。\n\
    3. ③ 图表 3 和 4 用于将数据转换为多个系列的辅助函数。\n4. ④ 设置适用于所有图表的 Chart.js 选项（稍后可见）。\n5. ⑤ `technologyPalette`\
