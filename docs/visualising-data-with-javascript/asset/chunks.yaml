    \ // returns 30\n```\n\nWe use `scaleSqrt` in the REPD dot plot example to compute\
    \ the radius of each circle.\n\n### 5.3.5\\. Axes\n\nThe `d3-axis` module helps\
    \ you draw axes. To draw an axis:\n\n*   create an SVG `<g>` element to act as\
    \ a container for the axis. You also need to position it appropriately using a\
    \ `transform` attribute\n\n*   create an **axis generator** by calling `axisLeft`,\
    \ `axisRight`, `axisBottom` or `axisTop` and passing in a scale function\n\n*\
    \   select the axis container and use the selection’s `.call` method to call the\
    \ axis generator.\n\nThere are four types of axis depending on which side of a\
    \ chart it’s for. For example `axisLeft` is used for a y axis on the left side\
    \ of a chart.\n\nAs an example let’s make an x axis. First add an SVG `<g>` element\
    \ to act as a container for the axis. Notice we’ve translated it so the axis isn’t\
    \ clipped against the top and left boundaries of the viewport:\n\n```\n<svg>\n\
    \  <g class=\"x-axis\" transform=\"translate(100,100)\"></g>\n</svg>\n```\n\n\
    * * *\n\nIn JavaScript we create a scale function and pass it into `axisBottom`:\n\
    \n```\nimport { select } from 'd3-selection';\nimport { scaleLinear } from 'd3-scale';\n\
    import { axisBottom } from 'd3-axis';\n\nlet scale = scaleLinear() ①\n  .domain([-100,\
    \ 100])\n  .range([0, 500]);\n\nlet axis = axisBottom(scale); ②\n\nselect('.x-axis')\
    \ ③\n  .call(axis); ④\n```\n\n1.  *①* Create a linear scale function\n\n2.  *②*\
    \ Create an axis generator and pass in the scale function.\n\n3.  *③* Select the\
    \ axis container.\n\n4.  *④* Call the selection’s `call` method and pass in the\
    \ axis generator.\n\nThe axis generator creates the appropriate lines, ticks and\
    \ labels within the container. The axis spans between the scale function’s range\
    \ values, so in this example its x coordinate spans between the 0 and 500.\n\n\
    ![d3 axis](images/d3-axis.png)\n\nFigure 33\\. Axis created using d3-axis\n\n\
    Here’s the example on Codepen: [https://codepen.io/createwithdata/pen/XWPXRqe](https://codepen.io/createwithdata/pen/XWPXRqe)\n\
    \n### 5.3.6\\. Events\n\nYou can attach event handlers to a selection using the\
    \ `.on` method. This method accepts two arguments:\n\n*   the event type (e.g.\
    \ `'click'`, `'mouseover'`, `'mouseout'`)\n\n*   a function whose first parameter\
    \ (typically named `e`) is the browser event object and whose second parameter\
    \ `d` is the joined value.\n\nAs an example let’s add an event handler to the\
    \ data join example that responds to click events. When a circle is clicked an\
    \ alert message appears containing the `value` property of the joined data:\n\n\
    ```\nlet data = [\n  { time: 50, value: 15 },\n  { time: 150, value: 40 },\n \
    \ { time: 250, value: 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n  .data(data)\n\
    \  .join('circle')\n  .style('fill', 'orange')\n  .attr('cx', d => d.time)\n \
    \ .attr('cy', 100)\n  .attr('r', d => d.value)\n  .on('click', (e, d) => { ①\n\
    \    alert('Value is: ' + d.value); ②\n  });\n```\n\n1.  *①* Add an event handler\
    \ to the selection that responds to click events.\n\n2.  *②* When a circle is\
    \ clicked an alert is activated that displays the `value` property of the joined\
    \ data.\n\nThe element’s joined data is passed into the callback function (as\
    \ the second argument). Thus if the second circle is clicked, the alert’s message\
    \ is 'Value is: 40'.\n\n![d3 event](images/d3-event.png)\n\nFigure 34\\. Alert\
    \ triggered by an event added using D3’s .on method\n\nHere’s the example on Codepen:\
    \ [https://codepen.io/createwithdata/pen/xxaZdaj](https://codepen.io/createwithdata/pen/xxaZdaj).\n\
    \nYou can add more than one event handler to a selection using additional calls\
    \ to the `on` method.\n\n* * *\n\n### 5.3.7\\. Array helpers\n\nD3’s `d3-array`\
    \ module provides a number of array utility functions. For example it has functions\
    \ for computing the minimum, maximum, sum and mean of an array. (See [https://github.com/d3/d3-array#api-reference](https://github.com/d3/d3-array#api-reference)\
    \ for a full guide.)\n\n`min` and `max` compute the minimum and maximum values\
    \ in an array. `extent` computes the min and max values and returns the result\
    \ as an array `[min, max]`.\n\nIf the data’s an array of objects you must also\
    \ pass in an accessor function to specify which property to use.\n\n```\nimport\
    \ { max, extent } from 'd3-array';\n\n// return the maximum value\nmax([10, 60,\
    \ 30, 20]);\n\nlet data = [\n  { time: 50, value: 15 },\n  { time: 150, value:\
    \ 40 },\n  { time: 250, value: 30 }\n];\n\n// return the maximum of the value\
    \ property in data (returns 40)\nmax(data, d => d.value); ①\n\n// return the extent\
    \ of the time property in data (returns [50, 250])\nextent(data, d => d.time);\n\
    ```\n\n1.  *①* The second argument of `max` is an accessor function whose input\
    \ is an array element (an object in this example) and the output is the value\
    \ we’re comparing.\n\n* * *\n\n## 5.4\\. Tippy.js tooltip"
