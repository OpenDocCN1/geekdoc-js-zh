    \ pick out the properties that we require for the charts in this book. Each planning\
    \ application has a location but it’s specified in Ordnance Survey eastings and\
    \ northings. It’s much more common to use latitude and longitude (for example,\
    \ that’s what Leaflet uses) so we’ll convert each easting/northing pair into latitude\
    \ and longitude. We also rename the properties to use shorter names as this makes\
    \ our project code a bit clearer and easier to write.\n\n* * *\n\nNote that numbers\
    \ are represented by strings. For example look at the `'Installed Capacity (MWelec)'`\
    \ property whose values are `'35'` and `'170'` in the above snippet. Therefore\
    \ there’ll be an additional step to convert these strings into numbers.\n\nNow\
    \ that we’ve converted the CSV data into an array of objects we’ll iterate through\
    \ it using JavaScript’s `map` method to create a new, transformed array of data.\
    \ Let’s look at the first few lines:\n\n```\nlet output = data.map((d, i) => {\
    \ ①\n  let ret = {}; ②\n\n  ret.id = d['Ref ID']; ③\n  ret.name = d['Site Name'];\
    \ ④\n  ret.technology = d['Technology Type']; ⑤\n  ret.capacity = parseFloat(d['Installed\
    \ Capacity (MWelec)']); ⑥\n\n  ...\n\n  return ret;\n});\n```\n\nListing 63\\\
    . wrangling/index.js\n\n1.  *①* Use JavaScript’s `map` method to create a new\
    \ array of data. For each iteration `d` is an object representing a single planning\
    \ application.\n\n2.  *②* Create an empty object. We’ll populate this object with\
    \ the properties we require in our charts and will return it at the end of this\
    \ function.\n\n3.  *③* Set the id. This is a good example why we’re renaming the\
    \ properties. It’s much easier to write `d.id` instead of `d['Ref ID']`.\n\n4.\
    \  *④* Set the name of the planning application.\n\n5.  *⑤* Set the technology\
    \ type.\n\n6.  *⑥* Set the capacity. Numbers are represented by strings so we\
    \ need to convert the capacity into a number using JavaScript’s built-in `parseFloat`.\n\
    \n* * *\n\nThe next step is to convert the location (represented by the `'Y-coordinate'`\
    \ and `'X-coordinate'` properties) into latitude and longitude:\n\n```\nlet output\
    \ = data.map((d, i) => {\n  ...\n\n  let point = new OSPoint(d['Y-coordinate'],\
    \ d['X-coordinate']); ①\n  let lonLat = point.toWGS84(); ②\n\n  ret.lon = parseFloat(lonLat.longitude.toFixed(3));\
    \ ③\n  ret.lat = parseFloat(lonLat.latitude.toFixed(3)); ④\n\n  ...\n});\n```\n\
    \nListing 64\\. wrangling/index.js\n\n1.  *①* Create a new OSPoint instance by\
    \ passing the northing (`d['Y-coordinate']`) and easting (`d['X-coordinate']`)\
    \ into the `OSPoint` constructor function.\n\n2.  *②* Convert the location into\
    \ a longitude/latitude object and assign to `lonLat`.\n\n3.  *③* The longitude\
    \ value is referenced by `lonLat.longitude`. To reduce the size of the JSON file,\
    \ we’ll just retain 3 decimal places using JavaScript’s built-in `toFixed` method.\
    \ This returns a string so we convert it back into a number using `parseFloat`.\n\
    \n4.  *④* Get the latitude value in a similar manner to longitude.\n\nWe then\
    \ create properties for region, status and operator:\n\n```\nlet output = data.map((d,\
    \ i) => {\n  ...\n\n  ret.region = d.Region;\n\n  ret.status = d['Development\
    \ Status (short)']; ①\n  ret.operator = d['Operator (or Applicant)']; ①\n\n  ...\n\
    });\n```\n\nListing 65\\. wrangling/index.js\n\n1.  *①* This property contains\
    \ spaces, so we use the square bracket syntax to access the property.\n\n* * *\n\
    \nNext we create the temporal (time-related) properties:\n\n```\nlet output =\
    \ data.map((d, i) => {\n  ...\n\n  let dateParser = d3.utcParse('%d/%m/%Y'); ①\n\
    \n  let dateSubmitted = dateParser(d['Planning Application Submitted']); ②\n \
    \ ret.yearSubmitted = dateSubmitted ? dateSubmitted.getFullYear() : null; ③\n\
    \  ret.dateSubmitted = dateSubmitted ? dateSubmitted.toISOString() : null; ④\n\
    \n  let dateGranted = dateParser(d['Planning Permission Granted']); ⑤\n  ret.yearGranted\
    \ = dateGranted ? dateGranted.getFullYear() : null; ⑥\n\n  ret.daysUntilGranted\
    \ = dateSubmitted && dateGranted && dateSubmitted < dateGranted ? d3.timeDay.count(dateSubmitted,\
    \ dateGranted) : null; ⑦\n\n  return ret;\n});\n```\n\nListing 66\\. wrangling/index.js"
