  trans: "\n本章展示了如何创建一个包含文本、图表和地图的数据故事。这种方法刻意保持简单，以便你可以在对 `HTML`、`CSS` 和 `JavaScript`\
    \ 有合理理解的情况下创建你自己的数据故事。\n\n本章还展示了如何使用 `surge.sh` 将数据故事部署到网络。这意味着你能够免费创建并发布数据故事。（尽管请记住，地图瓦片可能产生费用。）\n\
    \n# 附录 A：使用 Vite 创建项目\n\n使用 `Vite` 创建项目相对简单。你确实需要在计算机上安装 `Node`。你可以通过在命令行中运行以下命令来检查：\n\
    \n```\nnode -v\n```\n\n它应该返回你计算机上安装的 `Node` 版本。`Vite` 需要 `Node` 版本 `14.18` 或 `16`\
    \ 及以上，因此请确保安装了其中一个版本。\n\n在命令行中导航到你保存项目的目录，并输入：\n\n```\nnpm create vite@latest\n\
    ```\n\n如果系统询问你是否安装 `create-vite@latest`，请回答 `yes`。\n\n`Vite` 会询问你一些关于新项目的问题，例如项目名称。\n\
    \n当要求你选择框架时，回答 `Vanilla`，除非你想使用如 `Vue` 或 `React` 等框架。当它询问选择哪个变体（variant）时，选择 `JavaScript`，除非你明确想使用\
    \ `TypeScript`。（本书没有使用 `TypeScript`。）\n\n`Vite` 会创建一个新的项目目录，并给你如何导航到该新目录的指令。例如：\n\
    \n```\ncd my-project\n```\n\n一旦你进入了新项目目录，输入 `npm install` 下载项目的依赖项，然后输入 `npm run\
    \ dev` 构建项目并启动开发服务器。\n\n`Vite` 将显示一个你可以访问你的应用程序的 URL。这通常是 `localhost:5173`。如果你在网络浏览器中访问此\
    \ URL，你应该看到：\n\n![vite](img/vite.png)\n\n图 59. `Vite` 默认项目\n\n默认项目是一个简单的计数器应用程序。当你点击按钮时，计数器会增加。\n\
    \n该项目具有以下文件结构：\n\n```\nmy-project/\n  counter.js\n  index.html\n  javascript.svg\n\
    \  main.js\n  node_modules/\n    ...\n  package-lock.json\n  package.json\n  public/\n\
    \    vite.svg\n  style.css\n```\n\n`Vite` 为你创建一个可以运行的应用程序很不错，但这意味着当你开始开发自己的应用程序时，可能有几个文件是不需要的。这些是：\n\
    \n* `counter.js`\n* `javascript.svg`\n* `public/vite.svg`\n\n通常我会删除这些文件以及任何导入它们的代码（在\
    \ `index.html` 和 `main.js` 中）。`main.js` 的大部分内容也可以删除。\n\n通常保留的文件有：\n\n| 文件名 | 说明\
    \ |\n| --- | --- |\n| `index.html` | 主 `HTML` 文件。它包含静态内容和用于 `JavaScript` 生成内容的容器元素。\
    \ |\n| `main.js` | `JavaScript` 入口点。它是应用程序加载时第一个运行的文件。 |\n| `style.css` | 主 `CSS`\
    \ 文件。它既可以通过 `link` 标签包含在 `index.html` 中，也可以由 `JavaScript` 文件导入。（从 `JavaScript`\
    \ 文件导入 `CSS` 文件不是标准的 `JavaScript`，但 `Vite` 支持这种操作。） |\n| `public` | 在 Web 服务器上作为根目录\
    \ (`/`) 的目录。这允许 `index.html` 包含你自己的文件，或使用 `JavaScript` 加载文件（如 `CSV` 或 `JSON` 文件）。\
    \ |\n| `package.json` | 主项目配置文件。该文件的主要功能之一是指定项目所需的任何第三方包（如 `Chart.js` 和 `D3`）。\
    \ |\n\n`node_modules` 是一个标准目录，包含了在 `package.json` 中列为依赖项的第三方包（如 `Chart.js` 或 `D3`）。\n\
    \n`package-lock.json` 是由 `npm` 创建的文件，它列出了项目中所确安装的内容，并用于确保任何在该项目的人都安装了完全相同的包版本。对于本书来说，你完全不需要考虑这个文件。\n\
    \n遗憾的是，`Vite` 似乎不允许你创建一个空壳项目。最的是 `Vanilla` 选项，它会创建一个计数器应用程序。这意味着我们需要剥离不需要的代码。对于书中的每个项目，我们：\n\
    \n* 移除 `counter.js`\n* 在 `main.js` 中仅保留第一行（`style.css` 的导入）\n* 移除 `javascript.svg`\
    \ 和 `public\\vite.svg` 文件\n* 移除 `index.html` 中包含 `vite.svg` 的行\n* 移除 `style.css`\
    \ 中除 `body` 元素规则以外的所有 `CSS`\n\n这就留下了一个空应用程序。\n\n# 附录 B：getMultiSeriesChartData\n\
    \n本节解释了 `getMultiSeriesChartData` 函数是如何工作的。它被用于 `chartjs-various` 和 `data-story`\
    \ 项目中。\n\n该函数的目的是根据给定的数据数组为多系列图表创建一个 `Chart.js` 数据对象。\n\n它接受三个参数：\n\n1. `REPD`\
    \ 数据数组\n2. 定义每个系列名称的 `data` 属性。\n3. 定义轴标签的 `data` 属性。\n\n如果使用以下参数调用：\n\n```\n\
    getMultiSeriesChartData(data, 'technology')\n```\n\n它将返回一个如下所示的对象：\n\n```\n{\n\
    \  labels: [\"2020\", \"2021\", \"2022\"],\n  datasets: [\n    {\n      label:\
    \ \"Advanced Conversion\",\n      data: [10, 15, 13]\n    },\n    {\n      label:\
    \ \"Anaerobic Digestion\",\n      data: [5, 8, 7]\n    }\n  ]\n}\n```\n\n* * *\n\
    \n我们将 `getMultiSeriesChartData` 的输出赋值给 `Chart.js` 配置对象中的 `data` 属性。例如：\n\n```\n\
    let chartData = getMultiSeriesChartData(data, 'technology');\n\nconst myChart\
    \ = new Chart('my-chart', {\n  type: 'line',\n  data: chartData,\n  options: {\
    \ }\n});\n```\n\n这里是函数的实现：\n\n```javascript\nfunction getMultiSeriesChartData(data,\
    \ seriesProp, labelProp) {\n  let seriesNames = uniq(data.map(d => d[seriesProp]))\n\
    \    .filter(d => d !== '')\n    .sort();\n\n  let labelNames = uniq(data.map(d\
    \ => d[labelProp]))\n    .filter(d => d !== '')\n    .sort();\n\n  let chartData\
    \ = {\n    labels: labelNames,\n    datasets: seriesNames.map(series => {\n  \
    \    return {\n        label: series,\n        data: []\n      };\n    })\n  };\n\
    \n  // 为每个系列添加数据\n  chartData.datasets.forEach(series => {\n    series.data =\
    \ labelNames.map(label => {\n      let items = data.filter(d => {\n        return\
    \ d[seriesProp] === series.label && d[labelProp] === label;\n      });\n     \
    \ return items.length;\n    });\n  });\n\n  return chartData;\n}\n```\n\n1. *①*\
    \ `getMultiSeriesChartData` 接受三个参数：`data`（数据数组）、`seriesProp`（例如 `'technology'`，通过它推导出系列名称）和\
    \ `labelProp`（例如 `'yearSubmitted'`，通过它推导出主轴标签）。\n2. *②* 创建系列名称数组。我们使用 lodash 的\
    \ `uniq` 函数，它接收一个数组并输出一个去除了重复项的副本。我们还过滤了数组以移除空值并对数组进行升序。\n3. *③* 以类似于 `seriesNames`\
    \ 的方式创建标签数组。\n4. *④* 创建并初始化图表数据对象。\n5. *⑤* 通过对 `seriesNames` 调用 `map` 方法创建 `datasets`\
    \ 数组。该数组的每个元素代表一个数据系列。\n6. *⑥* 遍历每个系列。\n7. *⑦* 对于每个系列，对 `labelNames` 调用 `map`\
    \ 方法创建一个数组，该数组的每个元素都是该系列针对特定标签的规划申请数量。\n8. *⑧* 为了统计数量，过滤数据匹配 `series` 和 `label`\
    \ 的项并返回数组长度。\n\n# 附录 C：数据清洗\n\n"
- fmt: "\nThis appendix shows how the REPD data was converted from the original CSV\
    \ download into the `repd.json` JSON file. This section isn’t intended as a full\
    \ tutorial on data wrangling, but you’ll pick up plenty of tips that will help\
    \ you transform your own data.\n\nThe `wrangling` directory contains a Node.js\
    \ project that converts the original REPD CSV file into a JSON file.\n\nTo run\
    \ the script, navigate to the `wrangling` directory, install the Node modules\
    \ and run the script:\n\n```\ncd wrangling\nnpm install\nnode index.js\n```\n\n\
    The `wrangling` directory contains `repd-january-2023.csv` which was downloaded\
    \ from [www.gov.uk](https://www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract).\n\
    \nThe steps the script performs are:\n\n1. Loads the CSV file.\n2. Converts it\
    \ into a JavaScript array using `D3`.\n3. Carries out some data processing.\n\
    4. Saves the data as a JSON file.\n\n***\n\nLet’s look the first few lines where\
    \ the script loads the CSV file and turns it into a JavaScript array:\n\n```\n\
    const fs = require('fs'); ①\nconst d3 = require('d3'); ②\nconst OSPoint = require('ospoint');\
    \ ③\n\nlet f = fs.readFileSync('repd-january-2023.csv', 'utf8'); ④\nlet data =\
    \ d3.csvParse(f); ⑤\n```\n\nListing 62. `wrangling/index.js`\n\n1. *①* Import\
    \ the `fs` module. This contains the methods `readFileSync` for reading in files\
    \ and `writeFileSync` for saving files. Note that unlike the other projects in\
    \ this book we using the CommonJS module system to import modules which means\
    \ we use `require` instead of `import`.\n2. *②* Import `D3.js` so that we can\
    \ use its `csvParse` method. This converts a CSV text string into an array of\
    \ objects.\n3. *③* Import the [`ospoint`](https://www.npmjs.com/package/ospoint)\
    \ library which converts Ordnance Survey grid points (northings and eastings)\
    \ into latitude and longitude. The REPD CSV file specifies the location of each\
    \ planning application using Ordnance Survey eastings and northings and this library\
    \ helps us convert them into longitude and latitude.\n4. *④* Load the REPD CSV\
    \ file using `readFileSync`. This method returns a string containing the CSV and\
    \ it’s assigned to the variable `f`.\n5. *⑤* Use `D3`’s `csvParse` method to convert\
    \ the CSV string into a JavaScript array of objects. `csvParse` is a handy function\
    \ that takes a CSV string and converts it into an array of objects. Each column\
    \ in the CSV file maps to a property in each object.\n\n***\n\nThe array `data`\
    \ is an array of objects where each object represents a single planning application\
    \ (or a single row in the CSV file). Each object has properties, each of which\
    \ corresponds to a column in the CSV file. `data` looks something like:\n\n```\n\
    [\n  {\n    'Old Ref ID': 'N00053B',\n    'Ref ID': '1',\n    'Record Last Updated\
    \ (dd/mm/yyyy)': '07/07/2009',\n    'Operator (or Applicant)': 'RWE npower',\n\
    \    'Site Name': 'Aberthaw Power Station Biomass',\n    'Technology Type': 'Biomass\
    \ (co-firing)',\n    'Storage Type': '',\n    'Storage Co-location REPD Ref ID':\
    \ '',\n    'Installed Capacity (MWelec)': '35',\n    'CHP Enabled': 'No',\n  \
    \  'RO Banding (ROC/MWh)': '',\n    'FiT Tariff (p/kWh)': '',\n    'CfD Capacity\
    \ (MW)': '',\n    ...\n  },\n {\n    'Old Ref ID': 'AA110',\n    'Ref ID': '2',\n\
    \    'Record Last Updated (dd/mm/yyyy)': '20/11/2017',\n    'Operator (or Applicant)':\
    \ 'Orsted (formerly Dong Energy) / Peel Energy',\n    'Site Name': 'Hunterston\
    \ - cofiring',\n    'Technology Type': 'Biomass (co-firing)',\n    'Storage Type':\
    \ '',\n    'Storage Co-location REPD Ref ID': '',\n    'Installed Capacity (MWelec)':\
    \ '170',\n    'CHP Enabled': 'No',\n    'RO Banding (ROC/MWh)': '',\n    'FiT\
    \ Tariff (p/kWh)': '',\n    'CfD Capacity (MW)': '',\n    ...\n  }\n  ...\n]\n\
    ```\n\nWe don’t use all of these properties so the script will pick out the properties\
    \ that we require for the charts in this book. Each planning application has a\
    \ location but it’s specified in Ordnance Survey eastings and northings. It’s\
    \ much more common to use latitude and longitude (for example, that’s what `Leaflet`\
    \ uses) so we’ll convert each easting/northing pair into latitude and longitude.\
    \ We also rename the properties to use shorter names as this makes our project\
    \ code a bit clearer and easier to write.\n\n***\n\nNote that numbers are represented\
    \ by strings. For example look at the `'Installed Capacity (MWelec)'` property\
    \ whose values are `'35'` and `'170'` in the above snippet. Therefore there’ll\
    \ be an additional step to convert these strings into numbers.\n\nNow that we’ve\
    \ converted the CSV data into an array of objects we’ll iterate through it:\n\n\
    ```javascript\n// Logic for iterating through data\n```\n\nListing 63. `wrangling/index.js`\n\
    \n1. *①* Use the `map` method.\n2. *②* Create an empty object `ret`.\n3. *③* Set\
    \ the `id`.\n4. *④* Set the `name`.\n5. *⑤* Set the `technology`.\n6. *⑥* Convert\
    \ the `capacity` into a number using `parseFloat`.\n\n***\n\nListing 64. `wrangling/index.js`\n\
    \n1. *①* Create a new `OSPoint` instance by passing the northing (`d['Y-coordinate']`)\
    \ and easting (`d['X-coordinate']`) into the `OSPoint` constructor.\n2. *②* Convert\
    \ the location into a longitude/latitude object and assign to `lonLat`.\n3. *③*\
    \ The longitude value is referenced by `lonLat`.\n4. *④* Get the latitude in a\
    \ similar manner.\n\n***\n\nListing 65. `wrangling/index.js`\n\n1. *①* This property\
    \ contains spaces, so we use the square bracket syntax to access the property.\n\
    \n***\n\nListing 66. `wrangling/index.js`\n\n1. *①* Define the `dateParser` using\
    \ `d3.utcParse`.\n2. *②* Parse the `dateSubmitted`.\n3. *③* Set the `yearSubmitted`.\n\
    4. *④* Set the `dateSubmitted` string in ISO format.\n5. *⑤* Parse the `dateGranted`.\n\
    6. *⑥* Set the `yearGranted`.\n7. *⑦* Calculate `daysUntilGranted` using `d3.timeDay.count`.\n"
