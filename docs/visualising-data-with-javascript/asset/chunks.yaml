    . JavaScript and Data Visualisation today\n\nThe most popular data visualisation\
    \ projects on Github are currently D3.js (105,000 stars) and Chart.js (60,300\
    \ stars). My personal opinion is that D3.js and Chart.js are able to cover most\
    \ visualisation cases. In general I recommend using Chart.js for standard charts\
