    \n* * *\n\n## 3.2\\. tidy.js\n\n[tidy.js](https://pbeshai.github.io/tidy/) is\
    \ one of my favourite JavaScript libraries. It’s a JavaScript data transformation\
    \ library that lets you reshape your data with relative ease. (It’s inspired by\
    \ R’s dplyr library so it should feel familiar if you’re from the R community.)\
    \ It also lets you perform basic data analysis. It has a really well designed\
    \ API so is a pleasure to use.\n\nSome things that tidy.js can do are filtering,\
    \ sorting, renaming columns, deriving new columns, summarising data, joins and\
    \ pivoting. It can be used in a web application or in server-side code. We use\
    \ it later to summarise the REPD data prior to creating a bar chart.\n\n### 3.2.1\\\
    . Including tidy.js in your project\n\nIf you’re using a bundler such as Webpack,\
    \ Parcel or Vite install tidy.js using:\n\n```\nnpm install @tidyjs/tidy\n```\n\
    \nTo use any of tidy.js’s function’s within a JavaScript file use `import` to\
    \ import each function. Here we import `tidy`, `filter` and `count`:\n\n```\n\
    import { tidy, filter, count } from '@tidyjs/tidy';\n```\n\n### 3.2.2\\. Tidy\
    \ data\n\nA common convention used in the data community is 'tidy data'. This\
    \ is where a table of data is structured such that:\n\n*   every column is a variable\
    \ (e.g. name, technology, capacity)\n\n*   every row is an item (e.g. a planning\
    \ application)\n\nThis is also known as 'long format' (rather than 'wide format')\
    \ and is the format required by tidy.js.\n\nIn the JavaScript world, tidy data\
    \ is represented by an array of objects where each object represents a single\
    \ item (e.g. a planning application). Each object has properties representing\
    \ the variables (e.g. name, technology and capacity).\n\n* * *\n\nFor example:"
