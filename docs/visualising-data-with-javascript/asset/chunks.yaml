    \ ②\n    options: { ... }\n  });\n\n  ...\n}\n```\n\nListing 22\\. chartjs-various/main.js\n\
    \n1.  *①* Assign the return value of `getMultiSeriesChartData` to `chartData`.\n\
    \n2.  *②* Set the chart’s `data` property to `chartData`.\n\nFor the purposes\
    \ of this book you don’t need to understand `getMultiSeriesChartData` but if you’re\
    \ interested in seeing how it works visit 'getMultiSeriesChartData' in the Appendices\
    \ at the back of the book.\n\n* * *\n\nLet’s look at `drawChart3` in its entirety:\n\
    \n```\nfunction drawChart3(data) {\n  let chartData = getMultiSeriesChartData(data,\
    \ 'technology', 'yearSubmitted'); ①\n\n  // Add style to each series\n  chartData.datasets.forEach(series\
    \ => { ②\n    let color = technologyPalette[series.label] || '#aaa'; ③\n    series.borderColor\
    \ = color; ④\n    series.borderWidth = 1.5; ④\n    series.backgroundColor = color;\
    \ ⑤\n    series.radius = 2; ⑥\n  });\n\n  const myChart = new Chart('chart-3',\
    \ { ⑦\n    type: 'line', ⑧\n    data: chartData, ⑨\n    options: { ⑩\n      scales:\
    \ {\n        x: {\n          title: {\n            display: true,\n          \
    \  text: 'Year'\n          }\n        },\n        y: {\n          title: {\n \
    \           display: true,\n            text: 'Number of applications'\n     \
    \     }\n        }\n      },\n      plugins: {\n        title: {\n          text:\
    \ 'Number of applications (by technology) 1990-2022',\n        },\n        legend:\
    \ {\n          display: true\n        }\n      }\n    }\n  });\n}\n```\n\nListing\
    \ 23\\. chartjs-various/main.js\n\n1.  *①* Call `getMultiSeriesChartData` to construct\
    \ the chart data object. The second argument defines which property is used for\
    \ series (`'technology'`) and the third argument defines which property is used\
    \ for the main axis labels (`'yearSubmitted'`).\n\n2.  *②* Iterate through each\
    \ series in `chartData.datasets` and add style properties so that each line in\
    \ the chart is coloured according to the technology type.\n\n3.  *③* Use the `technologyPalette`\
    \ lookup to get the technology’s colour. Fall back to grey if the colour isn’t\
    \ defined.\n\n4.  *④* `borderColor` sets the line colour and `borderWidth` sets\
    \ the line width.\n\n5.  *⑤* `backgroundColor` sets the colour of the data point\
    \ circles.\n\n6.  *⑥* `radius` sets the radius of the data point circles.\n\n\
    7.  *⑦* Call `new Chart()` to construct the chart and pass in the id of the `<canvas>`\
    \ element and the configuration object.\n\n8.  *⑧* In the configuration object\
    \ set type to `'line'`.\n\n9.  *⑨* Set the `data` property to the data object\
    \ `chartData`. This is the object that was created using `getMultiSeriesChartData`.\n\
    \n10.  *⑩* Finally set options for the axis titles, the chart title and the legend.\n\
    \nEach series in `chartData.datasets` is represented by a line in the chart.\n\
    \n![chartjs styled 3](images/chartjs-styled-3.png)\n\nFigure 23\\. Multi-line\
    \ chart\n\n* * *\n\n## 4.5\\. Chart 4 (Stacked bar chart)\n\nChart 4 is a stacked\
    \ bar chart which shows the number of planning applications for each region. Each\
    \ bar is subdivided by technology type. This allows the reader to view the distribution\
    \ of planning applications by technology type for each region. For instance it’s\
    \ immediately apparent that Scotland has many more wind related applications than\
    \ any other region.\n\n![chartjs styled 4](images/chartjs-styled-4.png)\n\nFigure\
    \ 24\\. Stacked bar chart\n\nThe function `drawChart4` draws this chart and works\
    \ in a similar way to `drawChart3` but now each data series corresonds to a set\
    \ of same-color horizontal slices through the bars. For example the series representing\
    \ Solar Photovoltaics is represented by the yellow slices through each bar.\n\n\
    * * *\n\nAs with `drawChart3` it calls `getMultiSeriesChartData` but this time\
    \ the axis label property is `region`:\n\n```\nlet chartData = getMultiSeriesChartData(data,\
    \ 'technology', 'region');\n```\n\nThis returns the object:\n\n```\n{\n  labels:\
    \ [\"East Midlands\", \"Eastern\", \"London\", \"North East\", \"North West\"\
    , ... ],\n  datasets: [\n    {\n      label: \"Advanced Conversion Technologies\"\
    ,\n      data: [14, 6, 8, 8, 10, ...]\n    },\n    {\n      label: \"Anaerobic\
    \ Digestion\",\n      data: [31, 47, 11, 14, 25, ...]\n    }\n    ,\n    ...\n\
    \  ]\n}\n```\n\n* * *"
