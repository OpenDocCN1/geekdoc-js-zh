  trans: "\n\n![](img/front-cover.png)\n\n# 目录\n\n使用 JavaScript 进行数据可视化\n\nCopyright\
    \ © 2025 Peter Cook. 版权所有。\n\n此版本于 2025 年 2 月 7 日发布。\n\n# 1. 引言\n\n《使用 JavaScript\
    \ 进行数据可视化》教你如何使用 JavaScript 制作地图、图表和数据故事。你将学习：\n\n*   JavaScript 在数据可视化中的作用\n\
    *   如何使用 `Chart.js`、`D3.js` 和 `Leaflet` 等 JavaScript 库创建图表和地图\n*   如何结合地图和图表来创建并发布数据故事\n\
    \n你将学会如何使用 `Chart.js`制作图表（图 1）、使用 `Leaflet`制作地图（图 2）、使用 `D3.js`制作自定义数据可视化（图 3）以及使用\
    \ HTML、CSS、JavaScript、`Chart.js` 和 `Leaflet`制作数据故事（图 4）。\n\n![chartjs styled 1](img/chartjs-styled-1.png)\n\
    \n图 1\\. Chart.js 柱状图\n\n![leaflet](img/leaflet.png)\n\n图 2\\. Leaflet 地图\n\n\
    ![d3 timeline](img/d3-timeline.png)\n\n图 3\\. D3.js 时间线图\n\n![data story](img/data-story.png)\n\
    \n图 4\\. 数据故事\n\n***\n\n## 1.1. 前提条件\n\n为了充分利用本书的价值，你需要：\n\n*   一台安装了 `Node.js`\
    \ 的电脑以及一个代码编辑器（如 `VS Code`）\n*   具备一定的 `HTML`、`CSS` 和 `JavaScript` 经验\n*   具备一定的命令行、`Node.js`\
    \ 和 `npm` 经验\n\n如果你构建过（或参与过）Web 应用程序，那就没问题。了解 JavaScript 的箭头函数、回调函数和承诺（promises）对于本书非常有帮助。如果你需要快速掌握\
    \ `HTML`、`CSS`、`SVG` 和/或 `JavaScript`，我建议阅读[数据可视化的 HTML、SVG、CSS 和 JavaScript 基础](https://leanpub.com/html-svg-css-js-for-data-visualisation）（同样由我编写）。书中包含了本书所需的所有背景知识。\n\
    \n## 1.2. 预期目标\n\n本书旨在帮助你上手 `Chart.js`、`D3`、`Leaflet` 并向你展示如何制作数据故事。\n\n它涵盖了制作地图和图表的基础知识，以及如何开始使用这些库。它没有深入讲解这些库的细节，但旨在激励你学习更多知识，并赋予你制作自己的数据可视化的能力。\n\
    \n## 1.3. 代码\n\n本书涵盖了几个示例项目。你可以从 [app.createwithdata.com/downloads/visualising-data-with-js-book-code.zip](https://app.createwithdata.com/downloads/visualising-data-with-js-book-code.zip)\
    \ 下载代码包。解压文件并将目录移动到你常用的开发目录。\n\n如果在下载代码时遇到任何问题，请通过 help@createwithdata.com 联系我。\n\
    \n***\n\n## 1.4. 数据\n\n本书使用了来自英国政府可再生能源规划数据库（[`www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract`](https://www.gov.uk/government/publications/renewable-energy-planning-database-monthly-extract)）的单一数据集。它追踪了\
    \ 1990 年以来通过规划系统的英国可再生能源项目。\n\n我们使用了 2023 年 1 月发布的数据集快照，包含 8000 多行。每行代表一个规划申请，字段包括名称、`technology`（技术类型，如太阳能或风能）、`capacity`（兆瓦输出容量）、`location`（纬度和经度）、`region`（地区）、`status`（例如：运行中、拒绝、建设中）以及\
    \ `year submitted`（提交年份）。\n\n我们使用这些数据是因为：\n\n*   它是权威来源发布的真实数据\n*   它结合了分类数据和数值数据\n\
    *   它具有地理元素（每个项目的位置）\n*   它的规模对于教学来说非常合适（既不小也不庞大）\n\n原始数据如下：\n\n![repd data sheet](img/repd-data-sheet.png)\n\
    \n图 5\\. REPD 数据（省略了一些行和列）\n\n为了本书，我将数据转换成了一个 `JSON` 文件。使用了原始数据列的子集并重命名了列。还添加了一些新属性\
    \ `yearSubmitted`、`yearGranted` 和 `daysUntilGranted`：\n\n***\n\n```\n[\n  {\n\
    \    \"id\": \"1\",\n    \"name\": \"Aberthaw Power Station Biomass\",\n    \"\
    technology\": \"Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"lon\": -3.407,\n\
    \    \"lat\": 51.387,\n    \"region\": \"Wales\",\n    \"status\": \"Operational\"\
    ,\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\": 2004,\n    \"dateSubmitted\"\
    : \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\": 2004,\n    \"daysUntilGranted\"\
    : 140\n  },\n  {\n    \"id\": \"2\",\n    \"name\": \"Hunterston - cofiring\"\
    ,\n    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"\
    lon\": -3.407,\n    \"lat\": 51.387,\n    \"region\": \"Wales\",\n    \"status\"\
    : \"Operational\",\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\":\
    \ 2004,\n    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\"\
    : 2004,\n    \"daysUntilGranted\": 140\n  },\n  ...\n]\n```\n\n列表 1\\. JSON 文件中的前几项\n\
    \n你可以自己在 `load-data/public/repd.json` 中检查这些数据。\n\n关于如何将 REPD CSV 文件转换为 `repd.json`\
    \ 的更多信息，请参阅附录中的数据处理部分。\n\n***\n\n## 1.5. 书的结构\n\n本书由以下章节组成：\n\n*   JavaScript\
    \ 与数据可视化\n*   使用 Chart.js 制作图表\n*   Chart.js 的样式定制\n*   使用 D3.js 制作自定义图表\n*  \
    \ 使用 Leaflet 制作数据驱动地图\n*   数据故事\n\n# 2. 数据可视化与 JavaScript\n\n本章概述了 JavaScript\
    \ 在数据可视化中的作用。它还展示了如何使用构建工具 Vite 创建 Web 应用程序，并演示了一个加载数据并以表格形式显示的示例应用程序。\n\n## 2.1.\
    \ 数据可视化\n\n数据可视化是使用图形（而非数字）表示数据的过程。\n\n例如，假设你有一张销售数据表：\n\n![simple table of numbers](img/simple-table-of-numbers.png)\n\
    \n图 6\\. 一张销售数据表\n\n"
- fmt: "\nIt’s hard to spot any trends in the data just by looking at the numbers.\
    \ A data analyst might run a regression test to see if there’s a trend but you\
    \ can also visualise the data by plotting a line chart:\n\n![simple table of numbers\
    \ as chart](images/simple-table-of-numbers-as-chart.png)\n\nFigure 7\\. The sales\
    \ data represented with a line chart\n\nWe can immediately see there’s an upward\
    \ trend and that there was a peak in August. This is the power of data visualisation.\
    \ It reveals patterns that aren’t apparent in a table of numbers.\n\n### 2.1.1\
    \ Why visualise data?\n\nThere’s plenty of reasons to visualise data such as:\n\
    \n*   it’s an effective approach to understanding and communicating data\n*  \
    \ it can offer increased visual variety that helps engage the reader\n*   it can\
    \ be a visually appealing work in its own right (good for content, SEO etc.)\n\
    \n### 2.1.2 Best practice\n\nThere’s plenty of books about data visualisation\
    \ best practice. One that springs to mind is Alberto Cairo’s [The Functional Art](https://www.oreilly.com/library/view/the-functional-art/9780133041187/).\
    \ This has a handy chapter that explains which charts are most effective at conveying\
    \ data based on academic understanding of human perception. In short it’s best\
    \ to use position and length to represent data (rather than direction, area and/or\
    \ shade) because we are able to perceive differences in position and length better\
    \ than other encodings. This is one of the reasons bar, line and scatter charts\
    \ are prevalent. That’s not to say non-standard charts are ineffective. So long\
    \ as important quantities are represented using position and length custom charts\
    \ can also be effective at conveying data.\n\n## 2.2 JavaScript\n\nJavaScript\
    \ is the programming language of the web and is implemented in all major browsers.\
    \ It has a similar syntax to C-style programming languages as `C`, `C++`, `PHP`\
    \ and is commonly used to add interactivity to web sites and applications. It’s\
    \ also used to modify content within a web page.\n\n### 2.2.1 Why visualise data\
    \ using JavaScript?\n\nThere’s several reasons why JavaScript is one of the leading\
    \ (if not the leading) language for visualising:\n\n*   it’s the only language\
    \ implemented in major browsers\n*   it’s well suited to working with data\n*\
    \   it has plenty of visualisation libraries including `Leaflet` and `D3.js`.\n\
    \n### 2.2.2 History of JavaScript and Visualisation\n\nJavaScript charting libraries\
    \ have existed almost as long as JavaScript itself (which was introduced in 1995).\
    \ As far as I can tell the earliest ones that are still maintained are [Google\
    \ Charts](https://developers.google.com/chart) and [Flot](https://flotcharts.org/)\
    \ which were both introduced around 2007 and support standard charts such as bar\
    \ charts, line charts and pie charts.\n\n![flot](images/flot.png)\n\nFigure 8\\\
    . A line chart created with Flot\n\nIn 2009 [Highcharts](https://highcharts.com)\
    \ and [Protovis](https://mbostock.github.io/protovis/) were launched. Highcharts\
    \ is still one of the leading JavaScript libraries (and is free for non-commercial\
    \ use) and provides standard charts. Protovis took a different approach. Rather\
    \ than providing standard charts it provided graphical elements (such as bars,\
    \ lines and dots) with which you can encode your data. You can combine these elements\
    \ to create custom charts. Protovis was led by Mike Bostock and Jeff Heer who\
    \ went on to create `D3.js`.\n\n![protovis](images/protovis.png)\n\nFigure 9\\\
    . Custom chart created with Protovis\n\nIn the mid-2000s Adobe’s Flash was the\
    \ dominant platform for creating rich interactive applications for the web. Its\
    \ popularity declined towards the end of the 2000s as web standards such as `SVG`\
    \ and `Canvas` started to be supported by the major browsers.\n\n2011 saw the\
    \ launch of `D3.js` which embraced the growing support for the `SVG` standard.\
    \ Like Protovis it provides building blocks for making charts and became the dominant\
    \ JavaScript library for creating visualisations.\n\nIn 2014 [Chart.js](https://www.chartjs.org/)\
    \ launched and is currently one of the leading free and open-source charting libraries.\n\
    \n### 2.2.3 JavaScript and Visualisation today\n\nThe most popular data visualisation\
    \ projects on Github are currently `D3.js` (105,000 stars) and `Chart.js` (60,300\
    \ stars). My personal opinion is that `D3.js` and `Chart.js` are able to cover\
    \ most visualisation cases. In general I recommend using `Chart.js` for standard\
    \ charts (bar, line, pie and scatter) and `D3.js` for custom visualisations.\n\
    \n## 2.3 Creating a Web Application with JavaScript\n\nThis section shows how\
    \ to create a JavaScript web application. It starts by showing the fundamental\
    \ components of a web application then introduces the tool `Vite` which helps\
    \ you join all the pieces together.\n\nFundamentally a web application consists\
    \ of `HTML`, `CSS` and `JavaScript`. This is true whether the application is a\
    \ simple website or a fully featured e-commerce store or social media platform.\
    \ If you’re not with `HTML`, `CSS` or `JavaScript` I recommend finding a tutorial\
    \ on the web such as [this tutorial at mozilla.org](https://developer.mozilla.org/en-US/docs/Learn/Getting_started_with_the_web)\
    \ or reading my book [Fundamentals of HTML, SVG, CSS and JavaScript for Data Visualisation](https://leanpub.com/html-svg-css-js-for-data-visualisation).\n\
    \n### 2.3.1 HTML\n\nHTML (Hypertext Markup Language) describes the static content\
    \ of the application. Typically this is content that is always visible on the\
    \ webpage or container elements for JavaScript generated content (such as charts).\n\
    \nHere’s some sample HTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>...</head>\n\
    <body>\n  <h1>My app</h1> ①\n  <div id=\"menu\"></div>\n  <div class=\"content\"\
    >\n    <div id=\"chart\"></div> ②\n  </div>\n</body>\n</html>\n```\n\n1.  ① Some\
    \ static content\n2.  ② A container element for a chart that’ll be generated by\
    \ JavaScript\n\n### 2.3.2 CSS\n\nCSS (Cascading Style Sheets) describes the layout\
    \ and style of the app. For example:\n\n```css\nbody {\n  background-color: #eee;\n\
    }\n\nh1 {\n  color: blue;\n}\n\n.content {\n  padding: 1rem;\n}\n\n...\n```\n\n\
    ### 2.3.3 JavaScript\n\nJavaScript code manages interaction and dynamic content.\
    \ Dynamic content is content that’s generated after the web page has loaded. It\
    \ augments the static content in the main HTML file.\n\nHere’s a basic example\
    \ that populates the `<div id=\"chart\">` container element in the HTML file with\
    \ a Chart.js chart (there’s no need to understand this code at this stage):\n\n\
    ```javascript\nlet chart = new Chart('chart', {\n  type: 'bar',\n  data: {\n \
    \   labels: ['A', 'B', 'C'],\n    datasets: [\n      {\n        data: [10, 20,\
    \ 30]\n      }\n    ]\n  }\n});\n```\n\nThis code results in Chart.js drawing\
    \ a bar chart inside the `<div id=\"chart\">` element.\n\nIf these `HTML`, `CSS`\
    \ or `JavaScript` snippets look totally alien to you I recommend getting up to\
    \ speed using [Fundamentals of HTML, SVG, CSS and JavaScript for Data Visualisation](https://leanpub.com/html-svg-css-js-for-data-visualisation).\n\
    \n### 2.3.4 Joining the pieces\n\nIt’s possible to link to each a project’s CSS\
    \ and JavaScript files using `link` and `script` tags in the HTML file but the\
    \ usual approach (especially with medium and large projects) is to use a **bundler**.\
    \ A bundler is a tool that combines multiple JavaScript files into a single bundle.\n\
    \nOne of the main advantages is your JavaScript can be modularised meaning that\
    \ you can split your application into smaller files, each of which has a single\
    \ purpose. This makes your application code much easier to understand and navigate.\n\
    \nThere’s several bundlers available such as [Webpack](https://webpack.js.org/),\
    \ [Rollup](https://rollupjs.org/), [Parcel](https://parceljs.org/) and [Vite](https://vitejs.dev/).\
    \ In this book we use Vite because:\n\n*   you can create a project with minimal\
    \ configuration\n"
