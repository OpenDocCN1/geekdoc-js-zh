    \ a static website (a website that doesn’t rely on a web server to dynamically\
    \ generate files) onto a server so that anyone can visit the URL and see the data\
    \ story.\n\nThere’s three steps to publishing the data story:\n\n1.  Install surge\
    \ if it isn’t already installed.\n\n2.  Build a production version of the data\
    \ story.\n\n3.  Deploy the data story using surge.\n\nTo install surge use:\n\n\
    ```\nnpm install --global surge\n```\n\nTo build a production version of a Vite\
    \ application navigate to the project directory on the command line (`cd data-story`)\
    \ and type:\n\n```\nnpm run build\n```\n\nThis creates a new directory `dist`\
    \ and adds the production version of the application to it. (The production version\
    \ is an optimised version of your application that’s suitable for uploading to\
    \ a static web server.)\n\nNext navigate to the `dist` directory and type `surge`:\n\
    \n```\ncd dist\nsurge\n```\n\nSurge prompts you with a few questions. Usually\
    \ it asks you for the project’s location. It uses the current directory as the\
    \ default location, so just press enter here.\n\nIt then asks for the URL of the\
    \ data story. It usually provides one for you (usually a funny name) but you can\
    \ rename the part before `.surge.sh` to whatever you like. Surge then copies your\
    \ data story to its servers and gives you its URL. Click on the URL (or copy it\
    \ and paste into a web browser) and you should see the published version of the\
    \ data story. (I’ve published my version to [http://jsvis-data-story.surge.sh/](http://jsvis-data-story.surge.sh/))\n\
    \n* * *\n\nIf you’ve tried to publish your own version you’ll probably find the\
    \ map doesn’t have map tiles.\n\n![data story no map tiles](images/data-story-no-map-tiles.png)\n\
    \nFigure 57\\. Unregistered Stadia map\n\nThis is because the map tile provider\
    \ Stadia requires you to register the URL of any site that’s using their map tiles.\
    \ This is so that they can keep track of how many times the tiles are being served.\
    \ If it exceeds the free-tier limits they’ll start charging.\n\nTo register your\
    \ own URL with Stadia create an account at [https://client.stadiamaps.com/signup/](https://client.stadiamaps.com/signup/)\
    \ then use the `Create a Property` button to add your URL. I found that I had\
    \ to put the full domain in the 'Domain' section rather than splitting the subdomain\
    \ and domain. I don’t know why!\n\n![stadia prop](images/stadia-prop.png)\n\n\
    Figure 58\\. Stadia dashboard property\n\n## 7.3\\. Wrapping up"
