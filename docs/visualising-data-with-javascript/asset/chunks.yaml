    \ `title` 配置图表标题。\n10. ⑨ `legend` 配置图例。两个最实用的属性是 `display`（决定图例是否可见）和 `position`（决定图例位置，可以设置为\
    \ `'top'`、`'bottom'`、`'left'` 或 `'right'`）。\n\n例如：\n\n"
- fmt: "\n```json\n[\n  {\n    \"id\": \"1\",\n    \"name\": \"Aberthaw Power Station\
    \ Biomass\",\n    \"technology\": \"Biomass (co-firing)\",\n    \"capacity\":\
    \ 35,\n    \"lon\": -3.407,\n    \"lat\": 51.387,\n    \"region\": \"Wales\",\n\
    \    \"status\": \"Operational\",\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\"\
    : 2004,\n    \"dateSubmitted\": \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\"\
    : 2004,\n    \"daysUntilGranted\": 140\n  },\n  {\n    \"id\": \"2\",\n    \"\
    name\": \"Hunterston - cofiring\",\n    \"technology\": \"Biomass (co-firing)\"\
    ,\n    \"capacity\": 170,\n    \"lon\": -4.889,\n    \"lat\": 55.736,\n    \"\
    region\": \"Scotland\",\n    \"status\": \"Application Withdrawn\",\n    \"operator\"\
    : \"Orsted (formerly Dong Energy) / Peel Energy\",\n    \"yearSubmitted\": 2010,\n\
    \    \"dateSubmitted\": \"2010-06-02T00:00:00.000Z\",\n    \"yearGranted\": null,\n\
    \    \"daysUntilGranted\": null\n  },\n  ...\n]\n```\n\nAn example of non-tidy\
    \ (or 'wide format') data is where a data table has column headers containing\
    \ years (e.g. 2000, 2001, 2002 etc):):\n\n| Category | 2020 | 2021 | 2022 |\n\
    | --- | --- | --- | --- |\n| Food | 1234 | 1343 | 1542 |\n| Clothes | 431 | 522\
    \ | 467 |\n\n2020, 2021 and 2022 aren’t variables. They’re actually values of\
    \ the variable `year`. Furthermore each row represents 3 observations rather than\
    \ a single observation.\n\nA tidy (or 'long format') version of this data is:\n\
    \n| Category | Year | Amount |\n| --- | --- | --- |\n| Food | 2020 | 1234 |\n\
    | Food | 2021 | 1343 |\n| Food | 2022 | 1542 |\n| Clothes | 2020 | 431 |\n| Clothes\
    \ | 2021 | 522 |\n| Clothes | 2022 | 467 |\n\nNow each column is a variable and\
    \ each row is a single observation (for example the first row is an observation\
    \ that in 2020 the food category’s amount was 1234).\n\n***\n\n### 3.2.3. How\
    \ to use tidy.js\n\nTo process data using tidy.js call the function `tidy` and\
    \ pass in a data array as the first argument. The array needs to be in tidy format,\
    \ so each observation is represented by a single array element.\n\nThe processing\
    \ operations (such as `filter`, `sort`, `rename` and `count`) are passed to `tidy`\
    \ as additional arguments. For example let’s filter the REPD data (`data`) by\
    \ status then count the number of applications for each technology:\n\n```\nimport\
    \ { tidy, filter, count } from '@tidyjs/tidy';\n\nlet summary = tidy(\n  data,\n\
    \  filter(d => d.status === 'Operational'),\n  count('technology')\n);\n```\n\n\
    The `tidy` function returns a new array. In this case, it’s a summary array:\n\
    \n```json\n[\n  {\n    \"technology\": \"Biomass (co-firing)\",\n    \"n\": 3\n\
    \  },\n  {\n    \"technology\": \"EfW Incineration\",\n    \"n\": 56\n  },\n \
    \ {\n    \"technology\": \"Biomass (dedicated)\",\n    \"n\": 78\n  },\n  {\n\
    \    \"technology\": \"Advanced Conversion Technologies\",\n    \"n\": 18\n  },\n\
    \  ...\n]\n```\n\nIt’s important to understand that tidy creates a new array (it\
    \ doesn’t modify the original array).\n\n***\n\n### 3.2.4. Common tidy.js operations\n\
    \ntidy.js has a large number of functions that carry out various data processing\
    \ or analysis tasks. The ones used in this book are: `filter`, `rename`, `mutate`,\
    \ `sort`, `count` and `groupBy`.\n\n#### filter\n\nThe `filter` function filters\
    \ the data according to a function that’s passed in. It’s similar to JavaScript’s\
    \ array method `filter`.\n\nHere’s a couple of examples:\n\n```\nimport { tidy,\
    \ filter } from '@tidyjs/tidy';\n\n// Get all operational applications:\ntidy(\n\
    \  data,\n  filter(d => d.status === 'Operational')\n)\n\n// Get applications\
    \ with a capacity greater than 100:\ntidy(\n  data,\n  filter(d => d.capacity\
    \ > 100)\n)\n```\n\n***\n\n#### rename\n\n`rename` renames a property in each\
    \ item of the array. (In tabular terms this is equivalent to renaming a column.)\
    \ You pass in an object where each property’s key is the current name.\n\nThe\
    \ following example renames `status` to `Application status`:\n\n```javascript\n\
    import { tidy, rename } from '@tidyjs/tidy';\n\ntidy(\n  data,\n  rename({status:\
    \ 'Application status'})\n)\n```\n\n#### mutate\n\nThe `mutate` function creates\
    \ a new property for each item of the array. It is used to transform data.\n\n\
    Here’s a couple of examples:\n\n```javascript\nimport { tidy, mutate } from '@tidyjs/tidy';\n\
    \n// Add a new property isCapacity\ntidy(\n  data,\n  mutate({isCapacity: d =>\
    \ d.capacity > 1000})\n)\n\n// Convert dateSubmitted\ntidy(\n  data,\n  mutate({dateSubmitted:\
    \ new Date()})\n)\n```\n\n#### sort\n\nThe `sort` function sorts the data by a\
    \ given property name. By default it sorts in ascending order. To sort in descending\
    \ order wrap the property name with `desc`.\n\nHere’s a couple of examples:\n\n\
    ```javascript\nimport { tidy, sort, desc } from '@tidyjs/tidy';\n\n// Sort by\
    \ capacity (ascending)\ntidy(\n  data,\n  sort('capacity')\n)\n\n// Sort by capacity\
    \ (descending)\ntidy(\n  data,\n  sort(desc('capacity'))\n)\n```\n\n***\n\n####\
    \ count\n\nThe `count` function is an aggregation operation that groups the data\
    \ according to the property and computes the size of each group. It returns an\
    \ array of objects where each object has the group name and a property `n` for\
    \ the count.\n\nTo sort the result in descending order pass an object `{sort:\
    \ true}` as the second argument.\n\n```javascript\nimport { tidy, count } from\
    \ '@tidyjs/tidy';\n\n// Count the number of applications of each technology\n\
    tidy(\n  data,\n  count('technology', {sort: true})\n)\n```\n\n***\n\n#### groupBy\n\
    \nThe `groupBy` function groups the data by a given property and performs operations\
    \ on the groups. This is useful for performing aggregation operations such as\
    \ sum, mean, median, min and max over the dataset.\n\nFor example, you can compute\
    \ the count and average (mean) capacity for each technology type:\n\n```javascript\n\
    import { tidy, groupBy, n, mean, desc } from '@tidyjs/tidy';\n\n// Group by technology\
    \ and count the number of applications and the mean capacity in each group\ntidy(\n\
    \  data,\n  groupBy('technology', [\n    summarize({\n      count: n(),\n    \
    \  meanCapacity: mean('capacity')\n    })\n  ]),\n  sort(desc('meanCapacity'))\n\
    )\n```\n"
