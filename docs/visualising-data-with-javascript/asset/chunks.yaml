    \ were launched. Highcharts is still one of the leading JavaScript charting libraries\
    \ (and is free for non-commercial use) and provides standard charts. Protovis\
    \ took a different approach. Rather than providing standard charts it provided\
    \ graphical elements (such as bars, lines and dots) with which you can encode\
    \ your data. You can combine these elements to create custom charts. Protovis\
    \ was led by Mike Bostock and Jeff Heer who went on to create D3.js.\n\n![protovis](images/protovis.png)\n\
    \nFigure 9\\. Custom chart created with Protovis\n\n* * *\n\nIn the mid-2000s\
    \ Adobe’s Flash was the dominant platform for creating rich interactive applications\
    \ for the web. Its popularity declined towards the end of the 2000s as web standards\
    \ such as SVG and Canvas started to be supported by the major browsers.\n\n2011\
    \ saw the launch of [D3.js](https://d3js.org/) which embraced the growing support\
    \ for the SVG web standard. Like Protovis it provides building blocks for making\
