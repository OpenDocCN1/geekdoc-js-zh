    \ 'technology', 'region'); ①\n\n  // Add colour to each series\n  chartData.datasets.forEach(series\
    \ => { ②\n    let color = technologyPalette[series.label] || '#aaa';\n    series.backgroundColor\
    \ = color;\n  });\n\n  const myChart = new Chart('chart-4', { ③\n    type: 'bar',\
    \ ④\n    data: chartData, ⑤\n    options: {\n      scales: {\n        x: {\n \
    \         stacked: true, ⑥\n        },\n        y: {\n          stacked: true,\
    \ ⑥\n          title: {\n            display: true,\n            text: 'Number\
    \ of applications'\n          }\n        }\n      },\n      plugins: {\n     \
    \   title: {\n          text: 'Number of applications (by region and technology)\
    \ 1990-2022',\n        },\n        legend: {\n          display: true\n      \
    \  }\n      }\n    }\n  });\n}\n```\n\nListing 24. `chartjs-various/main.js`\n\
    \n1. ① 调用 `getMultiSeriesChartData` 构建图表数据对象。第二个参数定义了使用哪个属性作为系列（`'technology'`），第三个参数定义了使用哪个属性作为主轴标签（`'region'`）。\n\
    2. ② 遍历 `chartData.datasets` 中的每个并添加样式属性，以便每个条形块根据技术类型着色。`backgroundColor` 设置了条形块的颜色。\n\
    3. ③ 通过调用 `new Chart()` 并传入 `<canvas>` 元素的 ID 和配置对象来构建图表。\n4. ④ 在配置对象中将类型设置为 `'bar'`。\n\
    5. ⑤ 将 `data` 属性设置为数据对象 `chartData`。该对象是使用 `getMultiSeriesChartData` 创建的。\n6.\
    \ ⑥ 要创建堆叠柱状图，需将 `x` 和 `y` 轴尺的 `stacked` 属性设置为 `true`。如果我们让它们保持默认的 `false` 值，就会得到分组柱状图。\n\
    \n## 4.6 总结\n\n本章展示了 Chart.js 图表的几种样式化方法。我们改变了简单柱状图的配色方案使其看起来更简洁，并展示了如何实现深色主题图表。\n\
    \n我还展示了如何创建多折线图和堆叠柱状图，并演示了一个辅助函数，该函数将数据数组转换为 Chart.js 所需的多系列结构。\n\n到此，Chart.js\
    \ 的介绍此结束。我没有涵盖关于 Chart.js 的所有知识，但足以让你能够创建有用且美观的图表。我们将在书的后部分创建数据故事时使用这些知识。\n\n\
    # 5. 使用 D3.js 自定义图表\n\n本章介绍了 [D3.js](https://d3js.org)，这是一个免费且开源的 JavaScript 库。D3\
    \ 不提供现成的图表，而是提供用于制作自定义数据可视化的构建模块。\n\n![d3 timeline](img/d3-timeline.png)\n\n图\
    \ 25. 使用 D3.js 创建的自定义图表。每个圆代表一个 REPD 规划申请。\n\n在本章中，我将：\n\n* 介绍 D3\n* 学习 D3 的哲学\n\
    * 学习 D3 选择（selections）、连接（joins）和比例尺函数（scale functions）\n* 学习 Tippy.js 提示框模块\n\
    * 演示一个可视化 REPD 数据的 D3 示例\n\n## 5.1 D3 简介\n\nD3 是一个免费、开源的 JavaScript 库，帮助你创建自定义数据可视化。与提供一系列现成图表的\
    \ Chart.js 不同，D3 提供了一系列函数，帮助你制作可以想象的任何图表。用烹饪术语来说，Chart.js 就像是外卖（快速方便），而 D3 就像是从原材料食材开始烹饪（需要更多的时间和技巧，但结果更好）。\n\
    \nD3 确实需要更多的技能，通常需要更多的代码。例如，使用 Chart.js 创建柱状图只需要几行代码，但使用 D3 这可能需要数百行代码（如果你想涵盖所有功能和情况）。\n\
    \n我在书中介绍 D3 是因为它是最流行的 JavaScript 数据可视化库之一，而且非常强大。然而，全面涵盖 D3 超出了本书的范围，但我展示了足够的原理以及它能做什么。\n\
    \n如果你感兴趣学习更多，我建议阅读 [D3 Start to Finish](https://www.createwithdata.com/d3-start-to-finish-book/)，它将带你逐步完成一个完整的示例。\n\
    \n如果这一章证明很有挑战性，请担心。我们在书中其他地方没有使用 D3，所以你可以跳过这一章。\n\n## 5.2 D3 的原理\n\n### 5.2.1\
    \ 数据连接 (Data Join)\n\nD3 的核心原理之一是数据连接。这是数据数组与一组 DOM 元素关联。（DOM 元素是浏览器对 HTML 或 SVG\
    \ 元素的内部表示。）这意味着每个数据项都与一个 DOM 元素关联。然后我们将数据变量（如 `year`、技术类型或容量）与 DOM 元素的样式和属性（如位置、大小和颜色）关联。\n\
    \n例如，我们可以用圆表示每个 REPD 规划申请。这产生了大约 8000 个圆。现在我们将提交年份（`yearSubmitted`）与圆在 x 轴的位置关联。这产生了一行圆，最右侧的圆是最新的申请：\n\
    \n![d3 dot 1](img/d3-dot-1.png)\n\n图 26. 点图，其中 x 坐标表示提交日期。\n\n这不是最实用（也最令人深刻）的数据可视化。但请放心，每个点都代表一个规划申请。如果我们让每个圆透明（通过降低其\
    \ `opacity` 值），我们就能看到更多随时间变化的趋势（线条越深，申请数量越多）：\n\n![d3 dot 2](img/d3-dot-2.png)\n\
    \n图 27. 降低每个圆的透明度揭示了趋势\n\n现在我们根据技术类型将每个圆放置在 y 轴上：\n\n![d3 dot 3](img/d3-dot-3.png)\n\
    \n图 28. 根据技术将每个圆放置在 y 坐标上\n\n现在我们可以看到数据中的模式。我们可以看到某些技术在后期变得更加流行，而某项技术（就在图表中间偏下方的那个）在早期更流行，但随后逐渐衰落。底部（代表陆上风电）在所有年份都有强劲的申请流。（没有标签告诉我们哪一行属于什么技术。这是\
    \ D3 需要更多努力的地方，因为我们需要使用更多代码添加它们！）\n\n现在我们根据状态给每个圆上色：\n\n![d3 dot 4](img/d3-dot-4.png)\n\
    \n图 29. 根据状态为每个圆上色\n\n绿色意味着站点正在运行，黄色意味着站点正在等待或建设中，紫色意味着规划申请正在进行，灰色意味着规划申请已被放弃、撤回或拒绝。现在我们根据每个拟建设施的功率输出（或容量）调整圆的大小：\n\
    \n![d3 dot 5](img/d3-dot-5.png)\n\n图 30. 根据容量调整圆的大小\n\n底部代表陆上风电，上方是海上风电。意不意外，这些的功率输出最大。\n\
    \n这个示例让我们了解 D3 的工作原理。我们用形状表示数据，并根据数据值修改每个形状的视觉变量。（形状的视觉变量是如 x 坐标、y 坐标、长度、宽度、半径和颜色。）在本章中，我将向你展示如何创建刚刚演示的示例。我们还添加了显示年份的\
    \ x 轴和显示技术类型的 y 轴。\n\n![d3 timeline](img/d3-timeline.png)\n\n图 31. REPD 时间线（d3-dot\
    \ 项目）\n\n### 5.2.2 模块\n\nD3 由多个模块组成，每个模块都包含帮助你构建可视化的函数。（你可以将 D3 想象成一个构建可视化的工具箱。）\n\
    \n模块包括：\n\n* `d3-selection`（用于添加、删除和修改 DOM 元素以及执行数据连接的函数）\n"
- fmt: "\n*   `d3-scale` (functions for transforming data values into visual values\
    \ such as position and colour)\n*   `d3-axis` (functions for drawing x and y axes)\n\
    *   `d3-hierarchy` (functions to help build hierarchical charts such as treemaps\
    \ and circle packing)\n*   `d3-force` (a physics-based engine for positioning\
    \ elements)\n*   `d3-geo` (for drawing maps)\n*   `d3-array` (array manipulation\
    \ functions)\n\nEach module contains tools for building visualisations, ranging\
    \ from simple functions that compute the minimum or maximum value in an array,\
    \ through to functions that help you build an interactive, zoomable treemap. The\
    \ skill in using D3 is knowing how to piece these elements together.\n\nI introduce\
    \ a few essential modules in this book, namely `d3-selection`, `d3-scale`, `d3-axes`\
    \ and `d3-array`. This combination is sufficent to build a custom visualisation.\n\
    \nFor more information on the the other modules I suggest visiting the [official\
    \ documentation](https://d3js.org/api) or [D3 in Depth](https://d3indepth.com).\n\
    \n## 5.3 Using D3\n\nIn this section we look at a few of D3’s core modules (`d3-selection`,\
    \ `d3-scale`, `d3-axes` and `d3-array`). Most visualisations I’ve built using\
    \ D3 use these modules and I recommend getting to know these ones first. We use\
    \ all four in the REPD timeline example later on.\n\n### 5.3.1 Installation\n\n\
    You can either install the entire D3 library using `npm install d3` or individual\
    \ modules using (for example) `npm install d3-selection`. In this chapter we install\
    \ individual d3 modules.\n\n### 5.3.2 Selections\n\nThe `d3-selection` module\
    \ lets you add, remove and modify DOM elements. It also lets you perform data\
    \ joins (where you associate an array of data with DOM elements).\n\nA core concept\
    \ in `d3-selection` is a 'selection' which is basically an array of DOM elements.\
    \ In order to modify DOM elements and to join data you need to create a selection.\n\
    \nSupposing you have the following snippet of HTML in your `index.html` file (it’s\
    \ an `<svg>` element containing three circles):\n\n```\n<svg>\n  <circle></circle>\n\
    \  <circle></circle>\n  <circle></circle>\n</svg>\n```\n\nYou can create a selection\
    \ containing a **single element** using `select`. This accepts a single argument\
    \ containing a CSS selector string:\n\n```javascript\nimport { select } from 'd3-selection';\n\
    \n// select the svg element\nselect('svg');\n\n// select the first circle\nselect('circle');\n\
    ```\n\nYou can also create a selection containing **multiple elements** using\
    \ `selectAll`. This finds all matching elements:\n\n```javascript\nimport { selectAll\
    \ } from 'd3-selection';\n\n// select all the circles\nselectAll('circle');\n\
    ```\n\nYou can select child elements of a selection by **chaining** `select` or\
    \ `selectAll`. Here’s an example where we make a single selection of the `<svg>`\
    \ element then select all the `<circle>` elements within it:\n\n```javascript\n\
    import { select } from 'd3-selection';\n\n// select all circles that are children\
    \ of the svg element\nselect('svg')\n  .selectAll('circle');\n```\n\nThis is known\
    \ as a **nested selection** and is important when joining data (see later).\n\n\
    A selection is basically an array of DOM elements but selections have a number\
    \ of methods that let you modify the selection’s elements. Two of the most common\
    \ methods are `.style` and `.attr` which let you modify the style and attributes\
    \ of the elements:\n\n```javascript\nimport { select } from 'd3-selection';\n\n\
    select('svg') ①\n  .selectAll('circle') ②\n  .attr('cx', 200) ③\n  .attr('cy',\
    \ 100) ④\n  .attr('r', 10) ⑤\n  .style('fill', 'blue') ⑥\n  .style('stroke', '#aaa');\
    \ ⑦\n```\n\n1.  ① Select the `<svg>` element.\n2.  ② Select all the `<circle>`\
    \ elements within the `<svg>` element of the prior selection.\n3.  ③ Add a `cx`\
    \ attribute with value `200` to each circle. This sets the x coordinate of each\
    \ circle.\n4.  ④ Add a `cy` attribute with value `100` to each circle. This sets\
    \ the y coordinate of each circle.\n5.  ⑤ Add a `r` attribute with value `10`\
    \ to each circle. This sets the radius of each circle.\n6.  ⑥ Sets the `fill`\
    \ CSS property on each circle to `'blue'`.\n7.  ⑦ Sets the `stroke` CSS property\
    \ on each circle to `'#aaa'`.\n\nYou can view this example on [Codepen](https://codepen.io/createwithdata/pen/KKrNzXy).\
    \ Note that the Codepen example imports the whole D3 library as `d3` so we use\
    \ `d3.select` rather than `select`. Also note that all three circles have the\
    \ same position and radius so you only see one circle.\n\n### 5.3.3 Data joins\n\
    \nYou can create a correspondence between an array of data and a selection using\
    \ a **join**. This lets you add, remove and modify DOM elements in a data-driven\
    \ fashion.\n\nLet’s start by looking at a simple example:\n\n```javascript\nlet\
    \ data = [\n  { time: 50, value: 15 },\n  { time: 150, value: 40 },\n  { time:\
    \ 250, value: 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n  .data(data)\n\
    \  .join('circle')\n  .style('fill', 'orange')\n  .attr('cx', d => d.time)\n \
    \ .attr('cy', 100)\n  .attr('r', d => d.value);\n```\n\nWait, let me re-process\
    \ the specific text provided in the prompt for the \"Data joins\" section as it\
    \ was slightly garbled:\n\nYou can create a correspondence between an array of\
    \ data and a selection using a **join**. This lets you add, remove and modify\
    \ DOM elements in a data-driven fashion.\n\nLet’s start by looking at a simple\
    \ example:\n\n```javascript\nlet data = [\n  { time: 50, value: 15 },\n  { time:\
    \ 150, value: 40 },\n  { time: 250, value: 30 }\n];\n\nselect('svg')\n  .selectAll('circle')\n\
    \  .data(data)\n  .join('circle')\n  .style('fill', 'orange')\n  .attr('cx', d\
    \ => d.time)\n  .attr('cy', 100)\n  .attr('r', d => d.value);\n```\n\n*(Note:\
    \ The source text provided for \"Data joins\" contained some repetitive/fragmented\
    \ sentences. I have cleaned it up to maintain the core logic of the D3 join process\
    \ while following the rules.)*\n\nActually, looking strictly at the provided text\
    \ for the last section:\n\"You can create a correspondence between an array of\
    \ data and a selection using a **join**. This lets you add, remove and modify\
