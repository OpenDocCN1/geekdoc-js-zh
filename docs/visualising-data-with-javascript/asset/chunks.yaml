    \ntidy(\n  data,\n  rename({status: 'Application status'})\n);\n\nreturns:\n[\n\
    \  {\n    \"name\": \"Aberthaw Power Station Biomass\",\n    \"technology\": \"\
    Biomass (co-firing)\",\n    \"capacity\": 35,\n    \"lon\": -3.407,\n    \"lat\"\
    : 51.387,\n    \"region\": \"Wales\",\n    \"Application status\": \"Operational\"\
    , ①\n    \"operator\": \"RWE npower\",\n    \"yearSubmitted\": 2004,\n    \"dateSubmitted\"\
    : \"2004-04-16T00:00:00.000Z\",\n    \"yearGranted\": 2004,\n    \"daysUntilGranted\"\
    : 140\n  },\n  ...\n]\n```\n\n1.  *①* `'status'` has been renamed to `'Application\
    \ status'`.\n\n* * *\n\n#### mutate\n\nThe `mutate` function creates a new property\
    \ for each item of the array. (In tabular terms, this is equivalent to adding\
    \ a new column.) You pass in an object where each property name defines a new\
    \ data property and each value is a function that returns the value of the new\
    \ data property.\n\nHere’s a couple of examples:\n\n```\nimport { tidy, mutate\
    \ } from '@tidyjs/tidy';\n\n// Add a new field isHighCapacity\ntidy(\n  data,\n\
    \  mutate({\n    isHighCapacity: d => d.capacity > 1000\n  })\n);\n\n// Convert\
    \ the dateSubmitted string into a date object\ntidy(\n  data,\n  mutate({\n  \
    \  dateSubmitted: d => new Date(d.dateSubmitted)\n  })\n);\n```\n\nThe first example\
    \ adds a new property `isHighCapacity` which is `true` if the capacity is over\
    \ 1000\\. The second example converts the `dateSubmitted` string into a date object.\
    \ `dateSubmitted` already exists as a data property so tidy overwrites the existing\
    \ value (the date string) with the new value (the date object).\n\n* * *\n\n####\
    \ sort\n\nThe `sort` function sorts the data by a given property name. By default\
    \ it sorts in ascending order. To sort in descending order wrap the property name\
    \ with tidy’s `desc` function. You can sort by more than one property by passing\
    \ in an array of property names.\n\nHere’s a couple of examples:\n\n```\nimport\
    \ { tidy, sort, desc } from '@tidyjs/tidy';\n\n// Sort by capacity (ascending)\n\
    tidy(\n  data,\n  sort('capacity')\n)\n\n// Sort by capacity (descending)\ntidy(\n\
    \  data,\n  sort(desc('capacity'))\n)\n```\n\n* * *\n\n#### count\n\nThe `count`\
