    # HTML


    HTML, which stands for Hypertext Markup Language, is the document format for web
    pages. An HTML document contains text, as well as tags that give structure to
    the text, describing things such as links, paragraphs, and headings.


    A short HTML document might look like this:


    ```

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>My home page</title>

    </head>

    <body>

    <h1>My home page</h1>

    <p>Hello, I am Marijn and this is my home page.</p>

    <p>I also wrote a book! Read it


    <a href="http://eloquentjavascript.net">here</a></a></p>

    </body>

    </html>

    ```


    This is what such a document would look like in the browser:


    # My home page


    Hello, I am Marijn and this is my home page.


    I also wrote a book! Read it here.


    The tags, wrapped in angle brackets (< and >), the symbols for less than and greater
    than), provide information about the structure of the document. The other text
    is just plain text.


    The document starts with <!doctype html>, which tells the browser to interpret
    the page as modern'
