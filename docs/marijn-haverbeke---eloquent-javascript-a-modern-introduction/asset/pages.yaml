    \    }\n  }\n  for (let [from, to] of edges.map(r => r.split(\"-\")))) {\n   \
    \ addEdge(from, to);\n    addEdge(to, from);\n  }\n  return graph;\n}\n\nconst\
    \ roadGraph = buildGraph(roads);\n```\n\nGiven an array of edges, buildGraph creates\
