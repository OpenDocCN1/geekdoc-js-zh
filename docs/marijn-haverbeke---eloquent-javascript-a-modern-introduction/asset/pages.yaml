    # Bindings


    How does a program keep an internal state? How does it remember things? We have
    seen to produce new values from old values, but this does not change the old values,
    and the new value has to be immediately used or it will dissipate again. To catch
    and hold values, JavaScript provides a thing called *binding*, or variable:


    ```

    let caught = 5 * 5;

    ```


    That''s a second kind of statement. The special word (*keyword*) indicates that
    this sentence is going to define a binding. It is followed by the name of the
    binding and, if we want to immediately give it a value, by an *operator* and an
    expression.


    The previous statement creates a binding *caught* and uses it to grab hold of
    the number that is produced by multiplying 5 by 5.


    After a binding has been defined, its name can be used as an expression. The value
    of such an expression is the value the binding currently holds. Here''s an example:


    ```

    let ten = 10;

    console.log(ten * ten);

    // 100

    ```


    When a binding points at a value, that does not mean it is tied to that value
    forever. The = *operator* can be used at any time on existing bindings to disconnect
    them from their current value and have them point to a new one.


    ```

    let mood = "light";

    console.log(mood);

    // light

    mood = "dark";

    console.log(mood);

    // dark

    ```


    You should imagine bindings as tentacles, rather than boxes. They do not *contain*
    values; they *grasp*—two bindings can refer to the same value. A program can access
    only the values that it has a reference to. When you need to remember something,
    you grow a tentacle to hold on to or you reattach one of your existing tentacles
    to.


    Let''s look at another example. To remember the number of dollars that Luigi still
    owes you, when he pays back $35, you give this binding a new value.


    ```

    let luigisDebt = 140;

    luigisDebt = luigisDebt - 35;

    console.log(luigisDebt);

    // 105

    ```'
