  md: '# Group #1


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_154_0.png)


    If tries to match some long series of zeros and ones with no trailing b character,
    the matcher first goes through the inner loop until it runs out of digits. Then
    it notices there is no b, so it backtracks one position, goes through the outer
    loop once, and gives up again, trying to backtrack out of the inner loop once
    more. It will continue to try every possible route through these two loops. This
    means the amount of work doubles with each additional character. For even just
    a few dozen characters, the resulting match will take practically forever.


    # The replace Method


    String values have a replace method that can be used to replace part of the string
    with another string.


    ```

    console.log("papa".replace("p", "m"));

    // -> map

    ```


    The first argument can also be a regular expression, in which case the first match
    of the regular expression is replaced. When a g (for global) is added to the regular
    expression, all matches in the string will be replaced, not just the first.


    ```

    console.log("Borobudur".replace([/ou], "a"));

    // -> Barobudur

    console.log("Borobudur".replace([/ou]/g, "a"));

    // -> Barabadar

    ```


    It would have been sensible if the choice between replacing one match or all was
    made with an additional argument to replace or by providing a different method,
    replaceAll. But for some unfortunate reason, the choice relies on a property of
    the regular expression instead.


    The real power of using regular expressions with replace comes from the fact that
    we can refer to matched groups in the replacement string. For example, say we
    have a big string containing the names of people, one per line, in the format
    Lastname, Firstname. If we want to swap these names and remove the comma to get
    a Firstname Lastname format, we can use the following code:


    ```

    console.log("Liskov, Barbara\nMcCarthy, JohnWadler, Philip".replace(/(\w+), (\\w+)/g,
    "$2 $1"));

    // -> Barbara Liskov

    ```


    *'
