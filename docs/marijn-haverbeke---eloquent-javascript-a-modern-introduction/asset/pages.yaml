  md: 'When building a system requires communication between a JavaScript program
    running in the browser (client-side) and a program on a server (server-side),
    there are several different ways to model this communication.


    A commonly used model is that of remote procedure calls. In this model, communication
    follows the patterns of normal function calls, except that the function is actually
    running on another machine. Calling it involves making a request to the server
    that includes the function''s name and arguments. The response to request contains
    the returned value.


    When thinking in terms of remote procedure calls, HTTP is just a vehicle for communication,
    and you will most likely use an abstraction layer that hides it entirely.


    Another approach is to build your communication around the concept of resources
    and HTTP methods. Instead of a remote procedure called `adder`, you use a `PUT`
    request to `/users/Larry`. Instead of encoding that user''s properties in function
    arguments, you define a JSON document (or an existing format) that represents
    a user. The body of the `PUT` request to create a new resource is then such a
    document. A resource is fetched by a `GET` request to the resource''s URL (for
    example, `/users/Larry`), which again returns the document representing the resource.


    This second approach makes it easier to use some of the features HTTP provides,
    such as support for caching resources (keeping a copy on the client for fast access).
    The concepts used in HTTP, which are well designed, can provide a helpful set
    of principles to design your server interface around.


    # # Security and HTTPS


    Data traveling over the internet tends to follow a long, dangerous road. To get
    to its destination, it must hop anything from coffee shop Wi-Fi hotspots to networks
    controlled by various companies and states. At any point along its route it may
    be inspected or even modified.


    If it is important that something remains secret, such as the password to your
    email account, or that it arrive at its destination unmodified, as the account
    number you transfer money to via your bank''s website, plain HTTP is not enough.


    The secure HTTP protocol, used for URLs starting with `https://`, wraps HTTP traffic
    in a way that makes it harder to read and tamper. Before exchanging data, the
    client verifies that the server is who it claims to be asking to prove that it
    has a cryptographic certificate issued by a certificate authority that the browser
    recognizes. Next, all data going over the connection is encrypted in a way that
    should prevent eavesdropping and tampering.


    Thus, when it works right, HTTPS prevents other people fromatingating the website
    you are trying to talk to and from snooping on your communication. It is not perfect,
    and there have been various incidents where HTTPS failed because of forged or
    stolen certificates and software, but it is a lot safer than plain HTTP.


    # # Form Fields'
