  md: '# Master the Language of the Web


    JavaScript lies at the heart of almost every modern web application, from social
    apps like Twitter to browser-based game frameworks. Though simple for beginners
    to pick up and play with, JavaScript is a flexible, complex language that you
    can use to build full-scale applications. This third edition of Eloquent JavaScript
    dives deep into the JavaScript language to show you how to write beautiful, effective
    code. The updates include brand-new material on features like class notation,
    arrow functions, iterators, async functions, template strings, and block scope.


    Haverbek immerses you in code from the start and teaches through extensive examples,
    while exercises and full-chapter projects give you hands-on experience your own
    programs. First you''ll learn the basic structure of the JavaScript language as
    well as control structures, functions, and data structures. Then you''ll learn
    about error handling and bug fixing, modularity, and asynchronous programming
    before moving on to programming web browsers. As you build projects such as a
    browser game, a simple programming language, and a paint program, you''ll learn
    how to:


    +   * Understand the essential elements of programming, including syntax, control,
    and data

    * Organize and clarify your code with object-oriented and functional programming
    techniques

    * Script the browser and make basic web applications

    * Use the DOM effectively to interact with browsers

    * Harness Node.js to build servers and utilities Isn''t it you became fluent in
    the language of the web?


    # About the Author


    Marijn Haverbeke is a programming language enthusiast and polyglot. He''s worked
    on a wide range of software systems, from databases to compilers to editors. He
    runs a small business around his open source projects.


    ```

    All source code is available online in an interactive sandbox, where you can edit
    the code, run it, and see its output instantly.

    ```'
