  md: '![](img/97d87cd11217c72da8728e5e1ce1e6d1_342_0.png)


    The application will be set up to show a *live* view of the current proposed talks
    and their


    comments. Whenever someone, somewhere, submits a new talk or adds a comment, all
    people who


    have the page open in their browsers should immediately see the change. This poses
    a bit of a


    challenge—there is no way for a web server to open a connection to a client, nor
    is there a good way


    to know which clients are currently looking at a given website.


    A common solution to this problem is called *long polling*, which happens to be
    one of the


    motivations for Node’s design.


    **Long Polling**


    To be able to immediately notify a client that something changed, we need a connection
    to that


    client. Since web browsers do not traditionally accept connections and clients
    are often behind


    routers that would block such connections anyway, having the server initiate this
    connection is not


    practical.


    We can arrange for the client to open the connection and keep it around so that
    the server can


    use it to send information when it needs to do so.


    But an HTTP request allows only a simple flow of information: the client sends
    a request, the


    server comes back with a single response, and that is it. There is a technology
    called *WebSockets*,


    supported by modern browsers, that makes it possible to open connections for arbitrary
    data


    exchange. But using them properly is somewhat tricky.


    In this chapter, we use a simpler technique—long polling—where clients continuously
    ask the


    server for new information using regular HTTP requests, and the server stalls
    its answer when it has


    nothing new to report.'
