  md: "spring is defined by springStrength, which we'll multiply the length difference\
    \ to determine the resulting force.\n\n```\nconst springLength = 40;\nconst springStrength\
    \ = 0.1;\n```\n\nTo model the repulsion between nodes, we use another physical\
    \ formula—Coulomb's law—which says that the repulsion between two electrically\
    \ charged particles is inversely proportional to the square of the distance between\
    \ them. When two nodes are almost on top of each other, the squared distance is\
    \ tiny, and the resulting force is gigantic. As the nodes move further apart,\
    \ the squared distance grows rapidly so that the repelling force quickly weakens.\n\
    \nWe'll again multiply by an experimentally determined constant, repulsionStrength,\
    \ which controls the strength with which nodes repel each other.\n\n```\nconst\
    \ repulsionStrength = 1500;\n```\n\nThe force that acts on a given node is computed\
    \ by looping over all other nodes and applying the repelling force for each of\
    \ them. When another node shares an edge with the current node, the force caused\
    \ by the spring is also applied.\n\nBoth of these forces depend on the distance\
    \ between the two nodes. For each pair of nodes, we will compute a vector named\
    \ apart that represents the path from the current node to the other node. The\
    \ function then takes the length of the vector to find the actual distance. When\
    \ the distance is less than one, we set it to one by preventing dividing by zero\
    \ or by very small numbers because that will produce nan values or forces so gigantic\
    \ they catapult the node into outer space.\n\nUsing this distance, we can compute\
    \ the magnitude of the force that acts upon these two given nodes. To go from\
    \ a magnitude to a force, we must multiply the magnitude by a normalized version\
    \ of the apart vector. Normalizing a vector means creating a vector with the same\
    \ direction but a length of one. We can do that by dividing the vector by its\
    \ own length.\n\n```\nfunction forceDirected_simple(graph) {\n  for (let node\
    \ of graph) {\n    for (let other of graph) {\n      if (other == node.pos) continue;\n\
