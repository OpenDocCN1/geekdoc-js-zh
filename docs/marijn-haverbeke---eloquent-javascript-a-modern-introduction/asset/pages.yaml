    # # Code, and What to Do with It


    Code is the text that makes up programs. Most chapters in this book contain quite
    a lot of code. I believe reading code and writing code are indispensable parts
    of learning to program. Try not to just glance over the examples—read them attentively
    and understand them. This may be slow and confusing at first, but I promise that
    you''ll quickly get the hang of it. The same goes for the exercises. Don''t assume
    you understand them until you''ve actually written a solution.


    I recommend you try your solutions to exercises in an actual JavaScript interpreter.
    That way, you''ll get immediate feedback on whether you are doing is working,
    and I hope, you''ll be tempted to experiment and go beyond the exercises.


    The easiest way to run the code example in the book, and to experiment with it,
    is to look it up in the online version of the book at https://eloquentjavascript.net.
    There you can click any code example to edit and run it and see the output it
    produces. To work on the exercises, go to https://eloquentjavascript.net/code,
    which provides starting code for each coding exercise and allows you to look at
    the solutions.


    If you want to run the programs defined in this book outside of the book''s website,
    some care will be required. Many examples stand on their own and should work in
    any JavaScript environment. Code in later chapters is often written for a specific
    environment (the browser or Node.js) and can run only there. In addition, many
    chapters define bigger programs, and the pieces of code that appear in them depend
    on each other or on external files. The sandbox on the website provides links
    to Zip files containing all scripts and data files necessary to run the code for
    a given chapter.


    # # Overview of This Book


    This book contains three parts. The first 12 chapters discuss the JavaScript language.
    The next seven chapters are about web browsers and the way JavaScript is used
    to program them. Finally, two chapters are devoted to Node.js, another environment
    to program JavaScript in.


    Throughout the book, there are five project chapters, which describe larger example
    programs to give you a taste of actual programming. In order of appearance, we
    will work through building a delivery robot, a programming language, a platform
    game, a pixel paint program, and a dynamic website.


    The language part of the book starts with four chapters that introduce the basic
    structure of the JavaScript language. They introduce control structures (such
    as the while word you saw in this introduction), functions (writing your own building
    blocks), and data structures. After these, you will be able to write basic programs.
    Next, Chapters 5 and 6 introduce techniques to use functions and objects to write
    more abstract code and keep complexity under control.'
