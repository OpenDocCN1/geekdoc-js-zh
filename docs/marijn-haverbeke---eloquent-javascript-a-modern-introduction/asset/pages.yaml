- img_proc: true
  md: 'There are a lot more rules about the way request can include more information
    in the request and the way other side, which returns the resource, packages up
    it content. We''ll look at HTTP in a little more detail in Chapter 18.


    Most protocols are built on top of other protocols. HTTP treats the network as
    a streamline device which you can put bits and have arrive at the correct destination
    in the correct order. As we saw in Chapter 11, ensuring those things is already
    a rather difficult problem.


    The Transmission Control Protocol (TCP) is a protocol that addresses this problem.
    All internet-connected devices “speak” it, and most communication on the internet
    is built on top of it.


    A TCP connection works as follows: one computer can be waiting, or *listening*,
    for other computers to start talking to it. To be able to listen for different
    kinds of communication at the same time on a single machine, each listener has
    a number (called a *port*) associated with it. Most protocols specify which port
    should be used by default. For example, when we want to send an email using the
    SMTP protocol, the machine which we send it is expected to be listening on port
    25.


    Another computer can then establish a connection to the target machine using the
    correct port number. If the target machine can be reached and is listening on
    that port, the connection is successfully created. The listening computer is the
    *server*, and the connecting computer is called the *client*.


    Such a connection acts as a two-way pipe through which bits can flow—the machines
    on both ends put data into it. Once the bits are successfully transmitted, they
    can be read out again by the machine on the other side. This is a convenient model.
    You could say that TCP provides an abstraction of the network.


    # # The Web


    The World Wide *Web* (not to be confused with the internet as a whole) is a set
    of protocols and formats that allow us to visit web pages in a browser. The “Web”
    part in the name refers to the fact that such pages can easily link to each other,
    connecting into a huge mesh that users can move through.


    To become part of the web, all you need to do is connect a machine to the internet
    and have it listen on port 80 with the HTTP protocol so that other computers can
    ask it for documents.


    Each document on the web is named by a *Uniform Resource Locator* (URL), which
    looks something like this:


    ```

    http://javascript.net/13_browser.html

    | | |

    protocol | server | path

    ```


    The first part tells us that this URL uses the HTTP protocol (as opposed to, for
    example, encrypted HTTP, which would be https://). Then comes the part that identifies
    which server we are requesting the document. Last is a path string that identifies
    the specific document (or resource)'
