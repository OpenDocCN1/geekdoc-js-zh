    \ in the instance. Even properties that are accessed directly may hide a method\
    \ call. Such methods are getters, and they are defined by writing get in front\
    \ of the method name in an object expression or class declaration.\n\n```\nlet\
    \ varyingSize = {\n  get size() {\n    return Math.floor(Math.random() * 100);\n\
    \  }\n}\nconsole.log(varyingSize.size);\n// -> 73\nconsole.log(varyingSize.size);\n\
    // -> 49\n```\n\nWhenever someone reads from this object's size property, the\
