  md: 'by people who do not mean well is how you get your computer infected by viruses,
    and your accounts hacked.


    Yet the attraction of the web is that you can browse it without necessarily trusting
    all the pages you visit. This is why browsers severely limit the things a JavaScript
    program may do: it can''t look at the files on your computer or modify anything
    not related to the web it was embedded in.


    Isolating a programming environment in this way is called sandboxing, the idea
    that the program is harmless playing in a sandbox. But you should imagine this
    particular kind of sandbox as having a cage of thick steel bars over it so the
    programs playing in it can actually get out.


    The hard part of sandboxing is allowing the programs enough room to be useful
    yet the same time restricting them from doing anything dangerous. Lots of useful
    functionality, such as communicating with other servers or reading the content
    of the copy-paste clipboard, can also be used to do problematic, privacy-invading
    things.


    Every now and then, someone comes up with a new way to circumvent the limitations
    of a browser and do something harmful, ranging from leaking private information
    to taking over the whole machine that the browser runs on. The browser developers
    respond by fixing the hole, and all is well again—until the next problem is discovered,
    and hopefully publicized, rather than secretly exploited by some government agency
    or mafia.


    # Compatibility and the Browser Wars


    In the early stages of the web, a browser called Mosaic dominated the market.
    After a few years, the balance shifted to Netscape, which was then, in turn, largely
    supplanted by Microsoft''s Internet Explorer. At any point where a single browser
    was dominant, that browser''s vendor would feel entitled to unilaterally invent
    new features for the web. Since most users used the most popular browser, websites
    would simply start using those features—never the other browsers.


    This was the dark age of compatibility, often called the browser wars. Web developers
    were left with not one unified web but two or three incompatible platforms. To
    make things worse, the browsers in use around 2003 were all of bugs, and of course
    the bugs were different for each browser. Life was hard for people writing web
    pages.


    Mozilla Firefox, a non-for-profit offshoot of Netscape, challenged Internet Explorer''s
    position in the late 2000s. Because Microsoft was not particularly interested
    in staying competitive at the time, Firefox took a lot of market share away from
    it. Around the same time, Google introduced and Apple''s Safari browser gained
    popularity, leading to a situation where there were four major players, rather
    than one.


    The new players had a more serious attitude towards standards and better engineering
    practices, giving us less incompatibility and fewer bugs. Microsoft, seeing its
    market share crumble, came around and adopted these attitudes in its Edge browser,
    which replaces Internet Explorer. If you are starting to learn web development
    today, consider yourself lucky. The latest versions of the major browsers behave
    quite uniformly and have relatively few bugs.'
