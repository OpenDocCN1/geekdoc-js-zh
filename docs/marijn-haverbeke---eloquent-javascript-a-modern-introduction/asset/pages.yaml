    # # Exercises


    # # Game Over


    It''s traditional for platform games to have the player start with a limited number
    of lives and subtract one life each time they die. When the player is out of lives,
    the game restarts from the beginning.


    Adjust runGame to implement lives. Have the player start with three. Output the
    current number of lives (console.log) every time a level starts.


    # # Pausing the Game


    Make it possible to pause (suspend) and unpause the game by pressing the ESC key.


    This can be done by changing the runLevel function to use another keyboard event
    handler and interrupting or resuming the animation whenever the ESC key is pressed.


    The runAnimation interface may not look like it is suitable for this at first
    glance, but it is if you rearrange your runLevel calls it.


    When you have that working, there is something else you could try. The way we
    have been registering keyboard event handlers is somewhat problematic. The arrows
    object is currently a global binding, and its event handlers are kept around around
    even when no game is running. You could say they leak out of our system. Extend
    trackKeys to provide a way to unregister its handlers and then change runLevel
    to register its handlers when it starts and unregister them again when it is finished.


    # # A Monster


    It is traditional for platform games to have enemies that you can jump on top
    of to defeat. This exercise asks you to add such an actor to the game.


    We''ll call it a monster. Monsters move only horizontally. You can move them in
    the direction of the player, bounce back and like horizontal lava, or have any
    movement pattern you want. The class doesn''t have to handle falling, but it should
    make sure the monster doesn''t walk through walls.


    When a monster touches the player, the effect depends on whether the player is
    jumping on top of the monster or not. You can approximate this by checking whether
    the player''s bottom is near the monster''s top. If this is the case, the monster
    disappears. If not, the game is lost.'
