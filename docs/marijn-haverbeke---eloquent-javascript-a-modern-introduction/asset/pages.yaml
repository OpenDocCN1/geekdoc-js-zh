  pgno: 248
- img_proc: true
  md: 'Jumping is a specialty of this game character. It can reach several times its
    height and change direction in midair. This may not be entirely realistic, but
    it helps give the player the feeling of being in direct control of the on-screen
    avatar.


    The game consists of a static background, laid out like a grid, with the moving
    elements overlaid on that background. Each field on the grid is either empty,
    solid, or lava. The moving elements are the player, coins, and certain pieces
    of lava. The positions of these elements are not constrained to the grid—their
    coordinates may be fractional, allowing smooth motion.


    # The Technology


    We will use the browser DOM to display the game, and we''ll read user input by
    handling key events.


    Since the screen and keyboard-related code is only a small part of the work we
    need to build this game. Since everything looks like colored boxes, drawing is
    uncomplicated: we create DOM elements and use styling to give them a background
    color, size, and position.


    We can represent the background as a table since it is an unchanging grid of squares.
    The free-moving elements can be overlaid using absolutely positioned elements.


    In games and other programs that animate graphics and respond to user input without
    noticeable delay, efficiency is important. Although the DOM was not originally
    designed for high-performance graphics, it is actually better than this you would
    expect. (You saw some animations in Chapter 14.) On a modern machine, a simple
    game like this performs well, even if we don''t worry about optimization very
    much.


    In the next chapter, we will explore another browser technology, the <<canvas>
    tag, which provides a more traditional way to draw graphics, working in terms
    of shapes and pixels rather than DOM elements.


    # Levels


    We''ll want a human-readable, human-editable way to specify levels. Since it is
    okay for everything to start out on a grid, we could use big strings in which
    each character represents an element—either a part of the background grid or a
    moving element.


    The plan for a small level might look like this:


    ```

    let simpleLevelPlan = `

    .#.#.

    .#....=...#

    #.....O.0...#

    #.#O..#####.#

    #.#O..#####.#

    #..######..+#

    #..##########..+#

    ..

    `;

    ```'
