    When a form is submitted, a "submit" event is fired on it. A JavaScript handler
    can call preventDefault on that event to disable the browser''s default behavior.
    Form field elements may also occur outside of a form tag.


    When the user has selected a file from their local file system in a file picker,
    the FileReader interface can be used to access the content of this file from a
    JavaScript program.


    The localStorage and sessionStorage objects can be used to save information in
    a way that survives page reloads. The first object saves forever (or until the
    user decides to clear it), and the second one saves until the browser is closed.


