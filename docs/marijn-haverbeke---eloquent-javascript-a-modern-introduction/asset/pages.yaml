    # Summary


    Thanks to the enormous amount of money being poured into the web, as well as the
    rivalry between the different browsers, JavaScript compilers are good at what
    they do: making code run fast.


    But sometimes you have to help them a little and rewrite your inner loops to avoid
    more expensive JavaScript features. Creating fewer objects (arrays and strings)
    often helps.


    Before you start mangling your code to be faster, think about ways to make it
    do less work. The biggest opportunities for optimization are often found in that
