  md: "the number that we are currently looking at. The lines using compare are probably\
    \ the weirdest ones ever. The program wants to see whether count is equal to 11\
    \ to decide whether it can stop running. Because our hypothetical machine is primitive,\
    \ it can only test whether a number is zero and make a decision based on that.\
    \ So it uses the memory labeled compare to compute the value of count -11 and\
    \ makes a decision based on that value. The next two lines add the value of count\
    \ to the result and increment count by 1 every time the program has decided that\
    \ count is not 11 yet.\n\nHere is the same program in JavaScript:\n\n```\nlet\
    \ total = 0, count = 1;\nwhile (count <= 10) {\n  total += count;\n  count +=\
    \ 1;\n}\nconsole.log(total);\n// 55\n```\n\nThis version gives us a few more improvements.\
    \ Most important, there is no need to specify the way we program to jump back\
    \ and forth anymore. The while construct takes care of that. It continues executing\
    \ the block (wrapped in braces) below it as long as the condition it was given\
    \ holds. That condition is count <=10, which means \"count is less than or equal\
    \ to 10\". We no longer have to create a temporary value and compare to zero,\
    \ which was just an uninteresting detail. Part of the power of programming languages\
    \ is that they can take care of uninteresting details for us.\n\nAt the end of\
    \ the program, after the while construct finishes, the console.log operation is\
    \ used to write out our result.\n\nFinally, here is what the program could look\
    \ like if we happened to have the convenient operations range and sum available,\
    \ respectively create a collection of numbers within a range and compute the sum\
    \ of a collection of numbers:\n\n```\nconsole.log(sum(range(1, 10)));\n// → 55\n\
    ```\n\nThe moral of this story is that the same program can be expressed in long\
    \ and short, unreadable and readable ways. The first version of the program was\
