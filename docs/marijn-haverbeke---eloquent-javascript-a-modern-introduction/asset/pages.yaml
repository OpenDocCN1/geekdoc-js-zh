  md: '# Testing for Matches


    Regular expression objects have a number of methods. The simplest one is test.
    If you pass it a string, it will return a Boolean telling you whether the string
    contains a match of the pattern in the expression.


    ```

    console.log(/abc/..test("abcde"));

    // true

    console.log(/abc/..test("abxde"));

    // false

    ```


    A regular expression consisting of only nonspecial characters simply represents
    that sequence of characters. If *abc* occurs anywhere in the string we are testing
    against (not just at the start), test will

    return true.


    # Sets of Characters


    Finding out whether string contains *abc* could just as well be done with a call
    to indexOf. Regular expressions allow us to express more complicated patterns.


    +   - Say want to match any number. In a regular expression, putting a set of
    characters between square brackets makes that part of the expression match any
    of the characters between the brackets.

    - Both of the following expressions match all strings that contain a digit:


    ```

    console.log(/[0123456789]/.test("in 1992"));

    // true

    console.log(/[0-9]/.test("in 1992"));

    // true

    ```


    Within square brackets, a hyphen (-) between two characters can be used to indicate
    a range of characters, where the ordering is determined by the character''s Unicode
    number. Characters 0 to 9 sit right next to each other in this ordering (codes
    48 to 57), so [0-9] covers all of them and matches any digit.


    A common number of character groups have their own built-in shortcuts. Digits
    are one of them:

    \d means the same thing as [0-9].


    +   - \d Any digit character

    - \w An alphanumeric character ("word character")

    - \s Any whitespace character (space, tab, newline, and similar)

    - \D A character that is not a digit

    - \W A nonalphanumeric character

    - \S Any nonwhitespace character

    - Any character except for newline'
  merge: -1
