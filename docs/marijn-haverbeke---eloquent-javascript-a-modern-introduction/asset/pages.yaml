  md: "a page is closed or navigated away from (for example, by following a link),\
    \ a \"beforeunload event fires. The main use of this event is to prevent from\
    \ accidentally losing work by closing a document. Preventing the page from unloading\
    \ is not, as you might expect, done with the preventDefault method. Instead, it\
    \ is done by returning a non-null value from the handler. When you do that, the\
    \ browser will show the user a dialog asking if they are sure they want to leave\
    \ the page. This mechanism ensures that a user is always able to leave, even on\
    \ pages that would prefer to keep them forever and force them to look at dodgy\
    \ weight-loss ads.\n\n# # Events and the Event Loop\n\nIn the context of the event\
    \ loop, as discussed in Chapter 11, browser event handlers behave like other asynchronous\
    \ notifications. They are scheduled when the event occurs but must wait for other\
    \ scripts that are running to finish before they get a chance to run.\n\nThe fact\
    \ that events can be processed only when nothing is running means that if the\
    \ event loop is tied with other work, any interaction with the page (which happens\
    \ through events) will be delayed until there's time to process it. If you schedule\
    \ too much work, either with long-running event or lots of short-running ones,\
    \ the page will become slow and cumbersome to use.\n\nFor cases where you really\
    \ want to do some time-consuming thing in the background without freezing the\
    \ page, browsers provide something called web workers. A worker is a JavaScript\
    \ script that runs alongside the main script, on its own timeline.\n\nImagine\
    \ squaring a number is a heavy, long-running computation that we want to perform\
    \ in a separate thread. We could write a file code/squareworker.js that responds\
    \ to messages by computing a square and sending a message back.\n\n```\naddEventListener(\"\
    message\", event => {\n  postMessage(event.data * event.data);\n});\n```\n\nTo\
    \ avoid the problems of having multiple threads touching the same global scope\
    \ or any other data with the main script's environment, we have to communicate\
    \ with them by sending messages back and forth.\n\nThis code spawns a worker running\
    \ that script, sends it a few messages, and outputs the responses.\n\n```\nlet\
    \ worker = new Worker(\"code/squareworker.js\");\nworker.addEventListener(\"message\"\
    , event => {\n  console.log(\"The worker responded:\", event.data);\n});\nworker.postMessage(10);\n\
    worker.postMessage(24);\n```\n\nThe postMessage function sends a message, which\
    \ will cause a \"message\" event to fire in the receiver. The script that created\
    \ the worker sends and receives messages through the worker object, whereas"
