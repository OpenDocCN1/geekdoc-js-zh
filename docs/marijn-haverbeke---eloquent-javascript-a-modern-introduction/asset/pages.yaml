    # Moving Through the Tree


    DOM nodes contain a wealth of links to other nearby nodes. The following diagram
    illustrates these:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_218_0.png)


    Although the diagram shows only one link of each type, every node has a parentNode
    that points to the node it is part of, if any. Likewise, every element node (node
    type 1) has a children property that points to an array-like object holding its
    children.


    In theory, you could move anywhere in the tree using just these parent and child
    links. JavaScript also gives you access to a number of additional convenience
    links. The firstchild and lastchild properties point to the first and last child
    elements or have the value null for nodes without children. Similarly, previoussibling
    and nextsibling point to adjacent nodes, which are nodes with the same parent
    that appear immediately before or after the node itself. For a first child, previoussibling
    will be null, and for a last child, nextsibling will be null.


    There''s also the children property, which is like childNodes but contains only
    (type 1) children, not other types of child nodes. This can be useful when you
    aren''t interested in text nodes. *'
