  md: "A similar method, called json, returns a promise that resolves to the value\
    \ you get when parsing the body as JSON if it's not valid.\n\nBy default, fetch\
    \ uses the GET method to make its request and does not include a body request.\
    \ You can configure it by passing an object with extra options as a second argument.\
    \ For example, this request tries to delete example/data.txt.\n\n```\nfetch(\"\
    example/data.txt\",{method: \"DELETE\"}).then(resp => {\n  console.log(resp.status);\n\
    }); // → 405\n```\n\nThe 405 status code means “method not allowed,” an HTTP server’s\
    \ way of saying “I can’t do that.”\n\nTo add a request body, you can include a\
    \ body option. To set headers, there’s the headers option. For example, this includes\
    \ a Range header, which instructs the server to return only part of the response.\n\
    \n```\nfetch(\"example/data.txt\",{headers: {Range: \"bytes=8-19\"}})\n.then(resp\
    \ => resp.text())\n// → the content\n```\n\nThe browser will automatically add\
    \ some request headers, such as Host and those needed for the server to figure\
    \ out the size of the body. By adding your own headers is often useful to include\
    \ things such as authentication information or to tell the server which file format\
    \ you’d like to receive.\n\n# HTTP Sandboxing\n\nMaking HTTP requests in web pages\
    \ once again raises concerns about security. The person who controls the script\
    \ might not have the same interests as the person on whose computer it is running.\
    \ More specifically, if I visit themapia.org, I do not want its scripts to be\
    \ able to make a request to mybank.com, using identifying information from my\
    \ browser, with instructions to transfer all my money to some random account.\n\
    \nFor this reason, browsers protect us by disallowing scripts to make HTTP requests\
    \ to other domains (names such as themapia.org and mybank.com).\n\nThis can be\
    \ an annoying problem when building systems that want to access several domains\
    \ for legitimate reasons. Fortunately, servers can include a header like this\
    \ in their response to explicitly indicate to the browser that it is okay for\
    \ the request to come from another domain:\n\n```\nAccess-Control-Allow-Origin:\
    \ *\n```\n\n# Appreciating HTTP"
