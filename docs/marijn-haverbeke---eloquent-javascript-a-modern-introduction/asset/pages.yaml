  md: 'If you want to know the property you are interested in is called color, you
    may say value.color. Property names are strings. They can be any string, but the
    dot notation works only with names that look like valid names. So if you want
    to access a property named 2 or John Doe, you must use square brackets: value[2]
    or value["John Doe"].


    The elements in an array are stored as the array''s properties, using numbers
    as property names. Because you can''t use the dot notation with numbers and usually
    want to use a binding that holds the index anyway, you have to use the bracket
    notation to get at them.


    The length property of an array tells us how many elements it has. This property
    name is a valid binding, and we know it in advance, so to find the length of an
    array, you typically write array.length because that''s easier to write than array["length"].


    # Methods


    Both string and array objects contain, in addition to the length property, a number
    of properties that hold function values.


    ```

    let doh = "Doh";

    console.log(typeof doh.toUpperCase);

    // -> function

    console.log(doh.toUpperCase());

    // Doh

    ```


    Every string has a toUpperCase property. When called, it will return a copy of
    the string in which all letters have been converted to uppercase. There is alsoLowerCase,
    going the other way.


    Interestingly, even though the call toUpperCase does not pass any arguments, the
    function somehow has access to the string "Doh", the value we property. How this
    works is described in "Methods" on page 98.


    Properties that contain functions are generally called methods of the value they
    belong to, as "toUpperCase" is a method of a string.


    This example demonstrates two methods you can use to manipulate arrays:


    ```

    let sequence = [1, 2, 3];

    sequence.push(4);

    sequence.push(5);

    console.log(sequence);

    // -> [1, 2, 3, 4, 5]

    console.log(sequence.pop());

    // -> 5

    console.log(sequence);

    // -> [1, 2, 3, 4]

    ```


    The push method adds values to the end of an array, and the pop method does the
    opposite, removing the last value in the array and returning it.


    These somewhat silly names are the traditional terms for operations on a stack.
