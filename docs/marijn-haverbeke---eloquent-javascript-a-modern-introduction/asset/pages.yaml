  md: "```\nfunction parseINI(string) {\n  // Start with an object to hold the top-level\
    \ fields\n  let result = {};\n  let section = result;\n  string.split(/\\r?\\\
    n/).forEach(line => {\n    let match;\n    if (match = line.match(/^([^=\\s]+)=(.*)$/))\
    \ {\n      section[match[1]] = match[2];\n    } else if (match = line.match(/^\\\
    [(.*)\\]$/)) {\n      section = result[match[1]] = {};\n    } else if (!//^\\\
    s*(.*)?\\$/.test(line)) {\n      throw new Error(\"Line ' + line + \" ' is not\
    \ valid.\");\n    }\n  });\n  return result;\n}\n\nconsole.log(parseINI(`\name=Vasilis\n\
    [address]\ncity=Tessaloniki\n`)); // → {name: \"Vasilis\", address: {city: \"\
    Tessaloniki\"}})\n```\n\nThe code goes over the file's lines and builds up an\
    \ object. Properties at the top are stored directly into that object, whereas\
    \ properties are stored in a separate object. The section binding points at the\
    \ object for the current section.\n\\There are two kinds of significant lines—section\
    \ headers or property lines. When a line is a regular property, it is stored in\
    \ the current section. When it is a section header, a new section object is created,\
    \ and section is set to point at it.\nThe recurring use of `^` and `$` to make\
    \ sure the expression matches the whole line, not just part of it. Leaving out\
    \ results in code that mostly works but behaves strangely for some input, which\
    \ can be a difficult bug to track down.\nThe pattern that `if (match = string.match(...))`\
    \ is similar to the trick of using an assignment as the condition for while. You\
    \ often aren't sure that your call to match will succeed, so you can access the\
    \ resulting object only inside an if statement that tests for it. To not break\
    \ the pleasant chain of else forms, we assign the result of the match to a binding\
    \ and immediately use that assignment as the test for the if.\nIf a line is not\
    \ a section header or a property, the function checks whether it is a comment\
    \ or an empty line using `/^\\s*(.*)?\\$/`. Do you see how it works? The part\
    \ between the parentheses will match comments, and the `?` makes sure it also\
    \ matches lines containing only whitespace. When a line doesn't match any of the\
    \ expected forms, the function throws an exception."
