  md: 'In a typical program, most code is run a handful of times (or not at all).
    For these parts of the program, the cheap compilation strategy is sufficient—they
    won''t take much time anyway. functions that are called often or contain loops
    that do a lot of work to be treated differently. While running the program, the
    JavaScript engine observes how often each piece of code runs. When it looks like
    some code might consume a serious amount of time (this is often called *hot code*),
    it is recompiled with a more advanced but slower compiler. This compiler performs
    more optimizations to produce faster code. There may be more than two compilation
    strategies, with ever more expensive optimizations being applied to very hot code.


    Interleaving running and compiling code means that by the time the clever compiler
    starts with a piece of code, it has already been run multiple times. This makes
    it possible to observe the running code and gather information about it. Later
    in the chapter we''ll see how that can allow the compiler to create more efficient
    code.


    # Graph Layout


    Our example problem for this chapter concerns itself with graphs again. Pictures
    of graphs can be useful to describe road systems, networks, the way control flows
    through a computer program, and so on. The following picture shows a graph representing
    some countries in the Middle East, with edges between those that share land borders:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_358_0.png)


    Deriving a picture like this from the definition of a graph is called *graph layout*.
    It involves assigning a place to each node in such a way that connected nodes
    are near each other, the nodes don''t crowd into each other. A random layout of
    the same graph is a lot harder to interpret.'
