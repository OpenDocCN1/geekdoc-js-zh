  md: "<p>This page turns violet when you hold the V key.</p>\n\n```\n<script>\nwindow.addEventListener(\"\
    keydown\", event => {\n  if (event.key == \"v\") {\n    document.body.style.background\
    \ = \"violet\";\n  }\n});\nwindow.addEventListener(\"keyup\", event => {\n  if\
    \ (event.key == \"v\") {\n    document.body.style.background = \"\";\n  }\n});\n\
    </script>\n```\n\nDespite its name, \"keydown\" fires not only when the key is\
    \ physically pushed down. When a key is pressed and held, the event fires every\
    \ time the key repeats. Sometimes you have to be careful about this. For example,\
    \ if you add a button to the DOM when a key is pressed and remove it again when\
    \ the key is released, you might accidentally add hundreds of buttons when the\
    \ key is held down longer.\n\nThe example looked at the key property of the event\
    \ object to see which key event is about. This property holds a string that, for\
    \ most keys, corresponds to the thing that pressing a key would type. For special\
    \ keys it holds a string that the key (\"Enter\", in this case). If you hold SHIFT\
    \ while pressing a key, that might also influence the name of the key (\"v\" becomes\
    \ \"v\", and \"a\" may become \"!\", if that is what pressing SHIFT-1 produces\
    \ on your keyboard.\n\nModifier keys such as SHIFT, CTRL, ALT, and meta (COMMAND\
    \ on Mac) generate key events just like normal keys. But when looking for key\
    \ combinations, you can also find out these keys are held down by looking at the\
    \ shiftKey, ctrlKey, altKey, and metaKey properties of keyboard and mouse events.\n\
    \n<p>Control-Space to continue.</p>\n\n```\n<script>\nwindow.addEventListener(\"\
    keydown\", event => {\n  if (event.key == \" \" && event.ctrlKey) {\n    console.log(\"\
    Continuing!\");\n  }\n});\n</script>\n```\n\nThe DOM node where a key event originates\
    \ depends on the element that has focus when the key is pressed. Most nodes cannot\
    \ have focus unless you give them a tabindex attribute, but things like links,\
    \ buttons, and form fields can. We'll come back to form fields in Chapter 18.\
    \ When nothing in particular has focus, document.body acts as the target node\
    \ of key events.\n\nWhen the user is typing, using keys to figure out what is\
    \ being typed is problematic. Some, most notably the virtual keyboard on Android\
    \ phones, don't fire events. But even when you have an old-fashioned keyboard,\
    \ some types of text input don't match key presses in a straightforward way, such\
    \ as input method editor (IME) software used by people whose scripts don't fit\
    \ on a keyboard, where multiple key strokes are combined to create characters."
