  md: "as the client makes sure it constantly has a polling request, it will receive\
    \ information from the server quickly after it becomes available. For example,\
    \ if Fatma has our skill-sharing application in her browser, that browser will\
    \ have made a request for updates and she will be waiting for a response to that\
    \ request. When Iman submits a talk on Extreme Downhill Unicycling, the server\
    \ will notice that Fatma is waiting for updates and send a response containing\
    \ the new talk to Fatma's browser will receive the data and update the screen\
    \ to show the talk.\n\nTo prevent connections from timing out (being aborted because\
    \ of a lack of activity), long polling techniques usually set a maximum time for\
    \ each request, after which the server will respond anybody, even though it has\
    \ nothing to report, after the client will start a new request. Periodically restarting\
    \ the request also makes the technique more robust, allowing clients to recover\
    \ from temporary connection failures or server problems.\n\nA busy server that\
    \ is using long polling has thousands of waiting requests, and thus TCP connections,\
    \ open. Node, which makes it easy to manage many connections without creating\
    \ a separate thread of control for each, is a good fit for such a system.\n\n\
