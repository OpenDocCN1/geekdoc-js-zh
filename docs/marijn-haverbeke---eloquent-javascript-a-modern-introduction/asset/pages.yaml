  md: "# Inheritance\n\nSome matrices are known to be symmetric. If you mirror a symmetric\
    \ matrix around its top-left-to-bottom-right diagonal, it stays the same. In other\
    \ words, the value stored at x,y is always the same as that at y,x.\n\nImagine\
    \ we need a data structure like Matrix but one that enforces the fact that the\
    \ matrix is remains symmetrical. We could write it from scratch, but that would\
    \ involve repeating some code very much similar to what we already wrote.\n\n\
    JavaScript's prototype system makes it possible to create a new class, much like\
    \ the old class, with new definitions for each of its properties. The prototype\
    \ for the new class derives from the old prototype but adds a new definition for,\
    \ say, the set method.\n\nIn object-oriented programming terms, this is called\
    \ inheritance. The new class inherits properties and behavior from the old class.\n\
    \n```\nclass Symmetric extends Matrix {\n  constructor(size, element = (x, y)\
    \ => undefined) {\n    super(size, size, (x, y) => {\n      if (x < y) return\
    \ element(y, x);\n      else return element(x, y);\n    });\n  }\n\n  set(x, y,\
    \ value) {\n    super.set(x, y, value);\n    if (x != y) {\n      super.set(y,\
    \ x, value);\n    }\n  }\n}\n\nlet matrix = new Symmetric(5, (x, y) => `${x},${y}`);\n\
    console.log(matrix.get(2, 3));\n// → 3,2\n```\n\nThe use of extends indicates\
    \ that this class shouldn't be directly based on the default Object prototype\
    \ but on some other class. This is called the superclass. The derived class is\
    \ the subclass.\n\nTo initialize a Symmetricmatrix instance, the constructor calls\
    \ its super-class's constructor through the super keyword. This is necessary because\
    \ if this new object is to behave (roughly) like a Matrix, it is going to need\
    \ the instance properties that matrices have. To ensure the matrix is symmetrical,\
    \ the constructor wraps the content method to swap the coordinates for values\
    \ below the diagonal.\n\nThe set method uses super this time not to call the constructor\
    \ but to call a specific method from the superclass's set of methods. We are redefining\
    \ it but want to use the original behavior. Because this.set refers to the new\
    \ set method\n\nInheritance allows us to build slightly different data types from\
    \ existing data types with relatively little work. It is a fundamental part of\
    \ the object-oriented tradition, alongside encapsulation and polymorphism. But\
    \ while the latter are now generally regarded as wonderful ideas, inheritance\
    \ is"
