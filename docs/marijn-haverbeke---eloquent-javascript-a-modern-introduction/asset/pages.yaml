  md: 'JavaScript interface for such elements differs with the type of the element.

    Multiline text fields have their own tag, <textarea>, mostly because using an
    attribute to specify a multiline starting value would be awkward. The <textarea>
    tag requires a matching </textarea> closing tag and uses the text between these
    two, instead of the value attribute, as starting text.


    ```

    <textarea>

    one

    two

    three

    </textarea>

    ```


    Finally, the <select> tag is used to create a field that allows the user to select
    from a number of predefined options.


    ```

    <select>

    <option>Pancakes</option>

    <option>Pudding</option>

    <option>Ice cream</option>

    </select>

    ```


    Such a field looks like this:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_295_0.png)


    Whenever the value of a form field changes, it will fire a "change" event.


    # Focus


    Unlike most elements in HTML documents, form fields can get keyboard focus. When
    clicked or activated in some other way, they become the currently active element
    and the recipient of keyboard input.


    Thus, you can type into a text field only when it is focused. Other fields respond
    differently to keyboard events. For example, a <select> menu moves to the option
    that contains the text user typed and responds to the arrow keys by moving its
    selection up and down.


    We can focus from JavaScript with the focus and blur methods. The first moves
    focus to the DOM element it is called on, and the second removes focus. The value
    in document.activeElement corresponds to the currently focused element.


    ```

    <input type="text">

    <script>

    document.querySelector("input").focus();

    console.log(document.documentElement.tagName);

    // --> INPUT

    document.querySelector("input").blur();

    console.log(document.documentElement.tagName);

    // --> BODY

    ```'
