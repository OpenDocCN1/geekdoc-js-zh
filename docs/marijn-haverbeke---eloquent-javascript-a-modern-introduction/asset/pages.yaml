  md: 'SVG and HTML build up a data structure (DOM) that represents your picture.
    It makes it possible to modify elements after they are drawn. If you need to repeatedly
    change a small part of a big picture in response to what the user is drawing or
    as of an animation, doing it in a canvas can be needlessly expensive. The DOM
    also allows us to register event handlers on every element in the picture (even
    on shapes drawn with SVG). You can''t do that with canvas.


    But canvas''s pixel-oriented approach can be an advantage when drawing a huge
    number of elements. The fact that it does not build a data structure but only
    repeatedly draws onto the same pixel surface gives canvas a lower cost per shape.


    There are also effects, such as rendering a scene one pixel at a time (for example,
    using a ray tracer or postprocessing an image with JavaScript (blurring or distorting
    it), that can be realistically handled only by a pixel-based approach.


    In some cases, you may want to combine several of these techniques. For example,
    you might draw a graph with SVG or canvas but show textual information by positioning
    an HTML element on top of the picture.


    For nondemand applications, it really doesn''t matter which interface you choose.
    The display we built for our game in this chapter could have been implemented
    using any of these three graphics technologies since it does not need to draw
    text, handle mouse interaction, or work with extraordinarily large number of elements.


    # Summary


    In this chapter we discussed techniques for drawing graphics in the browser, focusing
    on the <canvas> element.


    A canvas node represents an area in a document that our program may draw on. This
    drawing is done through a drawing context object, created with the getContext.


    The 2D drawing interface allows us to fill and stroke various shapes. The context''s
    fill property determines how shapes are filled. The strokeStyle and lineWidth
    properties control the way lines are drawn.


    Rectangles and pieces of text can be drawn with a single method call. The fillRect
    and strokeRect methods draw rectangles, and the fillText and strokeText methods
    draw text. To create custom shapes, we must first build up a path.


    beginPath starts a new path. A number of other methods add lines and curves to
    the current path. For example, lineTo can draw a straight line. When a path is
    finished, it can be filled with fill or stroked with the stroke method.


    Moving pixels from an image to another canvas is done with the drawImage. By default,
    this method draws the whole source image, but by giving it more parameters, you
    can copy a specific area of the image. We used this for our game by copying individual
    poses of the character out of an image that contained many such poses.'
