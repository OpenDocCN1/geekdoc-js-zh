  md: '# 10

    MODULES


    The ideal program has a crystal-clear structure. The way it works is easy to explain,
    and each part plays a well-defined role.


    A typical program grows organically. New pieces of functionality are added as
    new needs come up. Structuring—and preserving structure—is additional work. It''s
    work that will pay off in the future, the *next* time someone works on the program.
    It is so tempting to neglect it and allow the parts of the program to become deeply
    entangled.


    This causes two practical issues. First, understanding such a system is hard.
    If everything can touch everything else, it is difficult to look at any given
    piece in isolation. You are forced to build up a holistic understanding of the
    entire thing. Second, if you want to use any of the functionality from such a
    program in another situation, rewriting it might be easier than trying to disentangle
    it from its context.


    The phrase “big ball of mud” is often used for such large, structureless programs.
    Everything sticks together, and when you try to pick out a piece, the whole thing
    comes apart, and your hands get dirty.


    # Modules as Building Blocks


    *Modules* are an attempt to solve these problems. A module is a piece of program
    that specifies what other pieces it relies on and functionality it provides for
    other modules to use (its *interface*).


    Module interfaces have a lot in common with object interfaces, as we saw in “Encapsulation”
    on page 97. They make part of the module available to the outside world and keep
    the rest private. By restricting the ways in which modules interact with each
    other, the system becomes like LEGO, where pieces interact through well-defined
    connectors, and less like mud, where everything mixes with everything.


    The relations between modules are called *dependencies*. When a module needs a
    piece from another module, it is said to depend on that module. When this fact
    is clearly specified in the module itself, it can be used to figure out which
    other modules need to be present to be able to use a given module and to automatically
    load dependencies.


    To separate modules in that, each needs its own scope.


    Just putting your JavaScript into different files does not satisfy these requirements.
    The files still share the same global namespace. They can, intentionally or accidentally,
    interfere with each other’s bindings. And the dependency structure remains unclear.
    To do better, we’ll see later in the chapter.


    Designing a fitting module structure for a program can be difficult. In the phase
    where you are'
