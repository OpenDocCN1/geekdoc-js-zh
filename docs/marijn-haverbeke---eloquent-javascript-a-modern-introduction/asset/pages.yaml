  md: 'To figure out which pixels to color, you can use the Pythagorean theorem. First
    figure out the


    distance between the current pointer position and the start position by taking
    the square root


    (`Math.sqrt`) of the sum of the square (`Math.pow(x, 2)`) of the difference in
    x-coordinates and the square of


    the difference in y-coordinates. Then loop over a square of pixels around the
    start position, whose


    sides are at least twice the radius, and color those that are within the circle’s
    radius, again using the


    Pythagorean formula to figure out their distance from the center.


    Make sure you don’t try to color pixels that are outside of the picture’s boundaries.


    ***Proper Lines***


    The thing about the problem of drawing a pixelated line is that it is really four
    similar but slightly


    different problems. Drawing a horizontal line from the left to the right is easy—you
    loop over the x-


    coordinates and color a pixel at every step. If the line has a slight slope (less
    than 45 degrees or


    ¼*π*radians), you can interpolate the y-coordinate along the slope. You still
    need one pixel per *x*


    position, with the *y* position of those pixels determined by the slope.


    But as soon as your slope goes across 45 degrees, you need to switch the way you
    treat the


    coordinates. You now need one pixel per *y* position since the line goes up more
    than it goes left.


    And then, when you cross 135 degrees, you have to go back to looping over the
    x-coordinates, but


    from right to left.


    You don’t actually have to write four loops. Since drawing a line from *A* to
    *B* is the same as


    drawing a line from *B* to *A*, you can swap the start and end positions for lines
    going from right to left


    and treat them as going left to right.


    So you need two different loops. The first thing your line drawing function should
    do is check


    whether the difference between the x-coordinates is larger than the difference
    between the y-


    coordinates. If it is, this is a horizontal-ish line, and if not, a vertical-ish
    one.


    Make sure you compare the *absolute* values of the *x* and *y* difference, which
    you can get with


    `Math.abs`.


    Once you know along which axis you will be looping, you can check whether the
    start point has a


    higher coordinate along that axis than the endpoint and swap them if necessary.
    A succinct way to


    swap the values of two bindings in JavaScript uses destructuring assignment like
    this:


    `[start, end] = [end, start];`


    Then you can compute the slope of the line, which determines the amount the coordinate
    on the


    other axis changes for each step you take along your main axis. With that, you
    can run a loop along


    the main axis while also tracking the corresponding position on the other axis,
    and you can draw


    pixels on every iteration. Make sure you round the non-main axis coordinates since
    they are likely to


    be fractional and the `draw` method doesn’t respond well to fractional coordinates.


