    \ RegExp constructor on. Here's an example:\n\n```\nlet name = \"harry\";nlet\
    \ text = \"Harry is a suspicious character.\";\nlet regex = new RegExp(\"\\\\\
    b\" + name + \"\\\\b\", \"g\");\nconsole.log(text.replace(regex, \"$1\"));\n//\
    \ -> Harry, is a suspicious character.\n```"
