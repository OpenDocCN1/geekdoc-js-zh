  md: 'Whereas encapsulation and polymorphism can be used to separate pieces of code
    from each other, reducing the tangleness of the overall program, inheritance fundamentally
    ties classes together, creating more tangle. When inheriting from a class, you
    usually have to know more about how it works when simply using it. Inheritance
    can be a useful tool, and I use it now and then in my own programs, but it shouldn''t
    be the first tool you reach, and you probably shouldn''t actively go looking for
    opportunities to construct class hierarchies (family trees of classes).


    # The instanceof Operator


    It is occasionally useful to know whether an object was derived from a specific
    class. For this, JavaScript provides a binary operator called instanceof.


    ```

    console.log(

    new SymmetricMatrix(2) instanceof SymmetricMatrix);

    // true

    console.log(new SymmetricMatrix(2) instanceof SymmetricMatrix);

    // true

    console.log(new Matrix(2, 2) instanceof SymmetricMatrix);

    // false

    console.log([1] instanceof Array);

    // true

    ```


    The operator will see through inherited types, so a SymmetricMatrix is an instance
    of Matrix. The operator can also be applied to standard constructors like Array.
    Almost every object is an instance of Object.


    # Summary


    So objects do more than just hold their own properties. They have prototypes,
    which are other objects. They''ll act as if they have properties they don''t have
    as long as their prototype has that property. Simple objects have Object.prototype
    as their prototype.


    Constructors, which are functions whose names usually start with a capital letter,
    can be used with the new operator to create new objects. The new object''s prototype
    will be the object found in the prototype property of the constructor. You can
    make good use of this by putting the properties that all values of a given type
    share into their prototype. There''s a class notation that provides a clear way
    to define a constructor and its prototype.


    You can define getters and setters to secretly call every time an object''s property
    is accessed. Static methods are methods stored in a class''s constructor, rather
    than in its prototype.

    The instanceof operator can, given an object and a constructor, tell you whether
    that object is an instance of that constructor.


    One useful thing to do with objects is to specify an interface for them and tell
    everybody that they are supposed to talk to your object only through that interface.
