    \n```\nlet day1 = {\n  squirrel: false,\n  events: [\"work\", \"touched tree\"\
    , \"pizza\", \"running\"]\n};\nconsole.log(day1.squirrel);\n// false\nconsole.log(day1.wolf);\n\
    // undefined\nday1.wolf = false;\nconsole.log(day1.wolf);\n// false\n```\n\nInside\
    \ the braces, there is a list of properties separated by commas. Each property\
    \ has a name followed by a colon and a value. When an object is written over multiple\
    \ lines, indenting it like in the example helps with readability. Properties whose\
    \ names aren't valid binding names or valid numbers have to be quoted.\n\n```\n\
    let descriptions = {\n  work: \"went to work\",\n  \"touched tree\": \"Touched\
    \ tree\"\n};\n```\n\nThis means that braces have *two* meanings in JavaScript.\
    \ At the start of a statement, they start a block of statements. In any other\
    \ position, they describe an object. Fortunately, it is rarely useful to start\
    \ a statement with an object in braces, the ambiguity between these two is not\
    \ much of a problem.\n\nReading a property that doesn't exist will give you the\
    \ value `undefined`.\n\nIt is possible to assign a value to a property expression\
    \ with the `=` operator. This will replace the property's value if it already\
    \ existed or create a new property on the object if it didn't.\n\nTo briefly return\
    \ to our tensile model of bindings—property bindings are similar. They *grasp*\
    \ values, but other bindings and properties might be holding onto those same values.\
    \ You may think of objects as octopuses with any number of tentacles, each of\
    \ which has a name tattooed on."
