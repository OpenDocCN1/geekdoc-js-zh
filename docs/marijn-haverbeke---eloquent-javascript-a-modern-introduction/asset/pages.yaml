  md: '# # Regexp Golf


    Code golf is a term used for the game of trying to express a particular program
    in few characters as possible. Similarly, regex golf is the practice of writing
    tiny regular expression as possible to match a pattern, *only* that pattern.


    For each of the following items, write a regular expression to test whether any
    of the given substrings in a string. The regular expression should match only
    strings containing one of the substrings described. Do not worry about word boundaries
    unless explicitly mentioned. When your expression works, see whether you can make
    it smaller.


    +   1. *car* and *cat*

    2. *pop* and *prop*

    3. *ferret*, *ferry*, and *ferr*

    4. Any word ending in *ious*

    5. A whitespace character followed by a period, comma, or semicolon

    6. A word longer than six letters

    7. A word without the *e* (or *E*)


    Refer to the table in the chapter summary for help. Test each solution with a
    few test strings.


    # # Quoting Style


    Imagine you have written a story and used single quotation marks throughout all
    pieces of dialogue. Now you want to replace all the dialogue quotes with double
    quotes, while keeping the single quotes used in contractions like *aren’t*.


    Think of a pattern that distinguishes these two kinds of quote usage and craft
    a call to the `replace` method that does the proper replacement.


    # # Numbers Again


    Write an expression that matches only JavaScript-style numbers. It must support
    an optional *or* plus sign in front of the number, the decimal dot, and exponent
    notation—5e-3 or 1e10—again with an optional sign in the exponent. Also note that
    it is not necessary for there to be digits in front of or after the dot, but the
    number cannot be a dot alone. That is, .5 and 5. are valid JavaScript numbers,
    but a lone dot *isn’t*.'
