    provides the autofocus attribute which produces the same effect while letting
    the browser know what we are trying to achieve. This gives the browser option
    to disable the behavior when it is not appropriate, such as when the user has
    put focus on something else.


    Browsers traditionally also allow the user to move the focus through the document
    by pressing the TAB key. We can influence the order in which elements receive
    with the tabindex attribute. The following example document will let the focus
    jump from the text input to the OK button, rather than going through the help
    link:


    ```

    <input type="text" tabindex="1"> <a href="#">help)</a>

    <button onclick="console.log(''ok'')" tabindex="2">OK</button>

    ```


    By default, most types of HTML elements cannot be focused. But you can add a tabindex
    attribute to any element that will make it focusable. A tabindex of -1 makes tapping
    skip over an element, even if it is normally focusable.


    # Disabled


    All fields can be disabled through their disabled attribute. It is an attribute
    that can be specified without value—the fact that it is present at all the elements.


    ```

    <button>I''m all right</button>

    <button disabled>I''m out</button>

    ```


    Disabled fields cannot be focused or changed, and browsers make them look gray
    and faded.


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_296_0.png)


    When a program is in the process of handling an action by some button or other
    control that might require communication with the server and thus take a while,
    it can be a good idea to disable the control until the action finishes. That way,
    when the user gets impatient and clicks it again, they don''t accidentally repeat
    their action.


