    To support long polling, GET requests to /talks may include extra headers that
    inform the server to delay the response if no new information is available. We''
    use a pair of headers intended to manage caching: ETag and If-None-Match.


    Servers may include an ETag ("entity tag") header in a response. Its value is
    a string that identifies the current version of the resource. When they request
    that resource again, they may make a conditional request by including an If-None-Match
    header whose value holds that same string. If the resource hasn''t changed, the
    server will respond with status code 304, which means "not modified," telling
    the client that its cached version is still current. When the tag does not match,
    the server responds as normal.


    We need something like this, where the client can tell the server version of the
    list of talks it has, and the server responds only when that list has changed.
    Instead of immediately returning a 304 response, the server should stall the response
    and return only when something new is available or a given amount of time has
    elapsed. To distinguish long polling requests from normal condition, we give them
    another header, Prefer: wait=90, which tells the server that the client is willing
    to wait up to 90 seconds for the response.


    The server will keep a version number that it updates every time the talks change
    and will use that as the ETag value. Clients can make requests like this to be
    notified when the change:


    ```

    GET /talks HTTP/1.1

    If-None-Match: "4"

    Prefer: wait=90

    ```


    ```

    (time passes)

    ```


    ```

    HTTP/1.1 200 OK

    Content-Type: application/json

    ETag: "5"

    Content-Length: 295

    ```


    [...


    The protocol described here does not do any access control. Everybody can comment,
