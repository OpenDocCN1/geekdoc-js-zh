  md: "# # Summary\n\nRegular expressions are objects that represent patterns in strings.\
    \ They use their own language to express these patterns.\n\n+   - /abc/ - A sequence\
    \ of characters\n- /[abc]/ - Any character from a set of characters\n- /^abc/\
    \ - Any character not in a set of characters\n- /[0-9]/ - Any character in a range\
    \ of characters\n- /x+/ - One or more occurrences of the pattern x\n- /x? - One\
    \ or more occurrences, nongreedy\n- /x*/ - Zero or more occurrences\n- /x/ - Zero\
    \ or one occurrence\n- /x{2,4}/ - Two to four occurrences\n- /(abc) - A group\n\
    - /[ab]c/ - Any one of several patterns\n- /\\d/ - Any digit character\n- /\\\
    w/ - An alphanumeric character (\"word character\")\n- /\\s/ - Any whitespace\
    \ character\n- /./ - Any character except newlines\n- /\b/ - A word boundary\n\
    - /\\$/ - End of input\n\nA regular expression has a method test to test whether\
    \ given string matches. It also has a method exec that, when a match is found,\
    \ returns an array containing all matched groups. Such an array has an index property\
    \ that indicates where the match started.\n\nStrings have a method match to match\
    \ against a regular expression and a search method to search for one, returning\
    \ only the starting position of the match. Their replace method can replace matches\
    \ of a pattern with a replacement string or function.\n\nRegular expressions can\
    \ have options, which are written after the closing slash. The i option makes\
    \ the match case insensitive. The g option makes the expression global, which\
    \ among others, causes the replace method to replace all instances instead of\
    \ just the first. The y option makes it sticky, which means it will not search\
    \ ahead and skip part of the string when looking for a match. The u option turns\
    \ on Unicode mode, which fixes a number of problems around the handling of characters\
    \ that take up code units.\n\nRegular expressions are a sharp tool with an awkward\
    \ handle. They simplify tremendously but can quickly become unmanageable when\
    \ applied to complex problems. Part of knowing how to use them is resisting the\
    \ urge to try to shoehorn things that they cannot cleanly express into them.\n\
    \n# # Exercises\n\nIt is unavoidable that, in the course of working on these exercises,\
    \ you will get confused and frustrated by some regular expression's inexplicable\
    \ behavior. Sometimes it helps to enter your expression into an online tool like\
    \ https://debugregex.com to see whether its visualization corresponds to what\
    \ you intended and experiment with how it responds to various input strings."
