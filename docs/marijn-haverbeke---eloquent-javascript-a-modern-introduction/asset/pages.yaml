  md: 'Find a way to make the syncState method of PictureCanvas faster by redrawing
    only the pixels that actually changed.


    Remember that drawPicture is also used by the save button, so if you change it,
    either make sure the changes don''t break the old use or create a new version
    with a different name.


    Also note that changing the size of a <canvas> element (by setting its width or
    height properties) clears it, making it entirely transparent again.


    # Circles


    Define a tool called circt that draws a filled circle when you drag. The center
    of the circle lies at the point where the draw or touch gesture starts, and its
    radius is determined by the distance dragged.


    # Proper Lines


    This is a more advanced exercise than the preceding two, and it will require you
    to design a solution to a nontrivial problem. Make sure you have plenty of time
    and patience before starting to work on this exercise, and do not get discouraged
    by initial failures.


    On most browsers, when you use the draw tool and quickly drag across the picture,
    you don''t get a closed line. Rather, you get dots with gaps between them because
    the "mousemove" or "touchmove" events did not fire quickly enough to hit every
    pixel.


    Improve the draw tool to make it a full line. This means you have to make the
    motion handler function remember the previous position and connect to the current
    one. To do this, since the pixels can be an arbitrary distance apart, you''ll
    have to write a general line drawing function.


    A line between two pixels is a connected chain of pixels that is as straight as
    possible. Diagonally adjacent pixels count as connected, so a slanted line should
    look like the picture on the left, not the picture on the right.


