  md: "Symbol.iterator symbol (a symbol value defined by the language, stored as a\
    \ property of the Symbol function).\n\nWhen called, method should return an object\
    \ that provides a second interface, iterator. It has a next method that returns\
    \ the next result. That result should be an object with a value property that\
    \ provides the next value, if there is one, and a done property, which should\
    \ be true when there are no more results and false otherwise.\n\nNote that the\
    \ next, value, and done property are plain strings, not symbols. Only Symbol.iterator,\
    \ which is likely to be added to a lot of different objects, is an actual symbol.\n\
    \nWe can directly use this interface ourselves.\n\n```\nlet okiterator = \"OK\"\
    [Symbol.iterator]();\nconsole.log(okiterator.next());\n// {value: \"O\", done:\
    \ false}\nconsole.log(okiterator.next());\n// {value: \"K\", done: false}\nconsole.log(okiterator.next());\n\
    // {value: undefined, done: true}\n```\n\nLet's implement an iterable data structure.\
    \ We'll build a matrix class, acting as a two-dimensional array.\n\n```\nclass\
    \ Matrix {\n  constructor(width, height, element = (x, y) => undefined) {\n  \
    \  this.width = width;\n    this.height = height;\n    this.content = [];\n\n\
    \    for (let y = 0; y < height; y++) {\n      for (let x = 0; x < width; x++)\
    \ {\n        this.content[y * width + x] = element(x, y);\n      }\n    }\n  }\n\
    \n  get(x, y) {\n    return this.content[y * this.width + x];\n  }\n\n  set(x,\
    \ y, value) {\n    this.content[y * this.width + x] = value;\n  }\n}\n```\n\n\
    The class stores its content in a single array of width x height elements. The\
    \ elements are stored row by row, so, for example, the third element in the fifth\
    \ row is (using zero-based indexing) stored at position 4 × width + 2.\n\nThe\
    \ constructor function takes a width, a height, and an optional content function\
    \ that will be used to fill the initial values. There are get and set methods\
    \ to retrieve and update elements in the matrix.\n\nWhen looping over a matrix,\
    \ you are usually interested in the position of the elements as well as the elements\
    \ themselves, so we'll have our iterator produce objects with x, y, and value\
    \ properties."
