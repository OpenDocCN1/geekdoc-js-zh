    # # Packages


    One of the advantages of building a program out of separate pieces, and being
    actually to run those pieces on their own, is that you might be able to use the
    same piece in different programs.


    But how do you set this up? Say I want to use the parseINI function from "Parsing
    an INI File" on page 160 in another program. If it is clear what the function
    depends on (in this case, nothing), I can just copy all the necessary code into
    my new project and use it. Then, if I find a mistake in code, I''ll properly fix
    it in whichever program I''m working with at the time and forget to fix it in
    the other program.


    Once you start duplicating code, you''ll quickly find yourself wasting time and
    moving copies around and keeping them up to date.


    That''s where packages come in. A package is a chunk of code that can be distributed
    (copied and installed). It may contain one or more modules and has information
    about which other packages it depends on. A package also usually comes with documentation
    explaining what it does so that people who didn''t write it might still be able
    to use it.


    When a problem is found in a package or a new feature is added, the package is
    updated. Now the programs that depend on it (which may also be packages) can upgrade
    to the new version.


    Working in this requires infrastructure. We need a place to store and find packages
    and a convenient way to install and upgrade them. In the JavaScript world, this
    infrastructure is provided by NPM (https://npmjs.org).


    NPM is two things: an online service where one can download (and upload) packages
    and a program (bundled with Node.js) that helps you install and manage them.


    At the time of writing, there are more than half million packages available on
    NPM. A large portion of them are rubbish, I should mention, but almost every useful,
    publicly available package can be found there. For example, an INI parser, similar
    to the one we built in Chapter 9, is available under the package name ini.


    Chapter 20 will show how to install packages locally using the npm command line
    program.


    Having quality packages available for download is extremely valuable. It means
    that we can avoid reinventing a package that 100 people have written before and
    get a solid, well-tested implementation at the press of a few keys.


    Software is cheap to copy, so once someone has written it, distributing it to
    other people is an efficient process. But writing it in the first place is work,
    and responding to people who have found problems in the code, or who want to propose
    new features, is even more work.


