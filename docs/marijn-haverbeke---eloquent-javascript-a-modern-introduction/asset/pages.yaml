    # The Pie Chart


    You will need to call fill and set the context''s textAlign andBaseline properties
    in such a way that the text ends up where you want it.


    A sensible way to position the labels would be to put the text on the line going
    from the center of the pie through the middle of the slice. You don''t want to
    put the text directly against the side of the pie but rather move the text out
    to the side of the pie by a given number of pixels.


    The angle of this line is currentAngle + 0.5 * sliceAngle. The following code
    finds a position on this line 120 pixels from the center:


    ```

    let middleAngle = currentAngle + 0.5 * sliceAngle;

    let text = Math.cos(middleAngle) * 120 + centerX;

    let centerY = Math.sin(middleAngle) * 120 + centerY;

    ```


    For baseline, the value "middle" is probably appropriate when using this approach.
    What to use for textAlign depends on which side of the circle we are. On the left,
    it should be "right", and on the right, it should be "left", so that the text
    is positioned away from the pie.


    If you are not sure how to find out which side of the circle a given angle is,
    look to the explanation of Math.cos in "Positioning and Animating" on page 240.
    The cosine of an angle tells us which x-coordinate corresponds to, which turn
    tells us exactly which side of the circle we are.


    # A Bouncing Ball


    A box is easy to draw with strokeRect. Define a binding that holds its size or
    define two bindings if your box''s width and height differ. To create a round
    ball, start a path and call arc(x, y, radius, 0, 7), which creates an arc from
    zero to more than a whole circle. Then fill the path.


    To model the ball''s position and speed, you can use the vec class "Actors" on
