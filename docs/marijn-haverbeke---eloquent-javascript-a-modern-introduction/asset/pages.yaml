  md: 'Forms were originally designed for the pre-JavaScript web to allow web-sites
    to send user-submitted information in an HTTP request. This design assumes that
    interaction with the server always happens by navigating to a new page.


    But their elements are part of the DOM like the rest of the page, and the DOM
    elements that represent fields support a number of properties that are not present
    on other elements. These make it possible to inspect and control such input fields
    with JavaScript programs and does things as adding new functionality to a form
    or using forms and fields as blocks in a JavaScript application.


    A web form consists of any number of input fields grouped in a &lt;form&gt;. HTML
    allows several different styles of fields, ranging from simple on/off checkboxes
    to drop-down menus and fields for text input. This book won''t try to comprehensively
    discuss all field types, but we''ll start with a rough overview.


    A lot of fields use the &lt;input&gt; tag. This tag''s type attribute is used
    to select the field''s style. These are some commonly used &lt;input&gt; types:


    +   text A single-line text field

    password Same as text but hides the text that is typed

    checkbox An on/off switch

    radio (Part of) a multiple-choice field

    file Allows the user to choose a file from their computer


    Form fields do not necessarily have to appear in a &lt;form&gt;. tag. You can
    put them anywhere in a page. Such form-less fields cannot be submitted (only a
    form as a whole), but when responding to input with JavaScript, we often don''t
    want to submit our fields normally anyway.


    ```

    <input type="text" value="abc" (text) />

    <input type="password" value="abc" (password) />

    <input type="checkbox" checked (checkbox) />

    <input type="radio" value="A" name="choice"/>

    <input type="radio" value="B" name="choice" checked<br/>

    <input type="radio" value="C" name="choice" (radio)/><br/>

    <input type="file" (file) />

    ```


    The fields created with this HTML code look like this:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_294_0.png)'
