  md: 'On the other hand, we just want to make sure the date starts and ends on a
    word boundary. A word boundary can be the start or end of the string or any point
    in the string that has a word character (as in \w) on one side and a nonword character
    on the other.


    ```

    console.log(/cat/.test("concatenate"));

    // -> true

    console.log(/bcatb/.test("concatenate"));

    // -> false

    ```


    Note that a boundary marker doesn''t match an actual character. It enforces the
    regular expression matches only when a certain condition holds at the place where
    it appears in the pattern.


    # Choice Patterns


    Say we know whether a piece of text contains not only a number but a number followed
    by one of the words pig, cow, or chicken, or any of their plural forms.


    We could write three regular expressions and test them in turn, but there is a
    nicer way. The pipe character (|) denotes a choice between the pattern to its
    left and the pattern to its right. So I can say this:


    ```

    let animalCount = /\b\d+(pig|cow|chicken)s?\b;

    console.log(animalCount.test("15 pigs"));

    // -> true

    console.log(animalCount.test("15 chickens"));

    // -> false

    ```


    Parentheses can be used to limit the part of the pattern that the pipe operator
    applies to, and you can put multiple such operators next to each other to express
    a choice between more than two alternatives.


    # The Mechanics of Matching


    Conceptually, when you use exec or test, the regular expression engine looks for
    a match in your string by trying to match the expression from the start of the
    string, from the second character, and so on, until it finds a match or reaches
    the end of the string. It''ll either return the first match that can be found
    or fail to find any match at all.


    To do the actual matching, the engine treats a regular expression something like
    a flow diagram. This is the diagram for the livestock expression in the previous
    example:'
