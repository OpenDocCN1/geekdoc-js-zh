  md: '# The Environment


    The scope accepted by evaluate is an object with properties whose names correspond
    to binding names and whose values correspond to the values bindings are bound
    to. Let''s define an object to represent the global scope.


    To be able to use the if construct we just defined, we must have access to Boolean
    values. Since there are only two Boolean values, we do not need special syntax
    for them. We simply bind two names to the values true and use them.


