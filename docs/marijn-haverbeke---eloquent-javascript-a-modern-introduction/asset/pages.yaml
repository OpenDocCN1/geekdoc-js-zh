  md: "![](img/97d87cd11217c72da8728e5e1ce1e6d1_359_0.png)\n\nFinding a nice-looking\
    \ layout for a given graph is a notoriously difficult problem. There is no known\
    \ solution that reliably does this for arbitrary graphs, and large, densely connected\
    \ graphs are especially hard. But for some types of graphs, for example, *planar*\
    \ ones (which can be drawn without edges crossing each other), effective approaches\
    \ exist.\n\nTo lay out a small graph (say, up to 200 nodes) that isn't too tangled,\
    \ we can apply an approach called *force-directed graph layout*. This runs a simplified\
    \ physics simulation on the nodes of the graph, treating edges as if they are\
    \ springs and having the nodes themselves repel each other as if is electrically\
    \ charged.\n\nIn this chapter we implement a force-directed graph layout system\
    \ and observe its performance. We can run such a simulation by repeatedly computing\
    \ the forces that act on each node and moving the nodes around in response to\
    \ those forces. Performance of such a program is important since it might take\
    \ a lot of iterations to reach a good-looking layout and each iteration computes\
    \ a lot of forces.\n\n# Defining a Graph\n\nWe can represent a graph layout as\
    \ an array of GraphNode objects, each of which carries its current position and\
    \ an array of the nodes to which it has edges. We randomize their starting positions.\n\
    \n```\nclass GraphNode {\n  constructor() {\n    this.pos = new Vec(Math.random()\
    \ * 1000,\nMath.random() * 1000);\n    this.edges = [];\n  }\n  connect(other)\
    \ {\n    this.edges.push(other);\n    other.edges.push(this);\n  }\n  hasEdge(other)\
    \ {\n    return this.edges.includes(other);\n  }\n}\n```"
