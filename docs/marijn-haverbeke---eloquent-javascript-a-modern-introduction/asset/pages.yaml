  md: "# Network Flooding\n\nThe fact that nests can talk only to their neighbors\
    \ greatly inhibits the usefulness of this network.\n\nFor broadcasting information\
    \ to the whole network, one solution is to set up a type of request that is automatically\
    \ forwarded to neighbors. These neighbors then in turn forward it to their neighbors,\
    \ until the whole network has received the message.\n\n```\nimport {every} from\
    \ \"./crow-tech\";\n\neverwhere(nest => {\n  nest.state.gossip = [];\n});\n\n\
    function nestGossip(nest, message, exceptFor = null) {\n  nest.state.gossip.push(message);\n\
    \  for (let neighbor of nest.neighbors) {\n    if (neighbor == exceptFor) continue;\n\
    \    request(nest, neighbor, \"gossip\", message);\n  }\n}\n\nrequesttype(\"gossip\"\
    , (nest, message, source) => {\n  if (nest.state.gossip.includes(message)) return;\n\
    \  console.log(`${nest.name} received 'gossip ${message}' from ${source}'`);\n\
    \  sendGossip(nest, message, source);\n});\n```\n\nTo avoid sending the same message\
    \ around the network forever, each nest keeps an array of gossip strings that\
    \ it has already seen. To define this array, we use the everywhere function—which\
    \ runs code on every nest—to add a property to the nest's state object, which\
    \ is where we'll keep nest-local state.\n\nWhen a nest receives a duplicate gossip\
    \ message, which is very likely to happen with everybody blindly resending them,\
    \ it ignores it. But when it receives a new message, it excitedly tells all its\
    \ neighbors except the one who sent the message.\n\nThis will cause a new piece\
    \ of gossip to spread through the network like an ink stain in water. Even when\
    \ some connections aren't working, if there is an alternative route to a given\
    \ nest, the gossip will reach it there.\n\nThis style of network communication\
    \ is called flooding—it floods the network with a piece of information until all\
    \ nodes have it.\n\n# Message Routing"
