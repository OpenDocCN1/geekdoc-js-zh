    Node is a nice, small system that lets us run JavaScript in a nonbrowser context.
    It was originally designed for network tasks to play the role of a node in a network.
    But it lends itself to all kinds of scripting tasks, and if writing JavaScript
    is something you enjoy, automating tasks with Node works well.


