  md: '# 21

    PROJECT: SKILL-SHARING WEBSITE


    A skill-sharing meeting is an event where people with a shared interest come together
    and give small, informal presentations about things they know. At a gardening
    skill-sharing meeting, someone might explain how to cultivate celery. Or in a
    programming skill-sharing group, you could drop by and tell people about Node.js.


    Such meetups—also often called users'' groups when they are about computers—are
    a great way to broaden their horizons, learn about new developments, or simply
    meet people with similar interests. Many larger cities have JavaScript meetups.
    They are typically free to attend, and I''ve found the ones I''ve visited to be
    friendly and welcoming.


    In this final project chapter, our goal is to set up a website for managing talks
    given at a skill-sharing meeting. Imagine a small group of people meeting up regularly
    in the office of one of the members to talk about unicycling. The previous organizer
    of the meetings moved to another town, and nobody stepped forward to take over
    this task. We need a system that will let the participants propose and discuss
    talks among themselves, without a central organizer.


    The full code for the project can be downloaded from the book''s web-site at https://elojavascript.net/code/skillssharing.zip.


    # Design


    There is a server part to this project, written for Node.js, and a client part,
    written for the browser. The server stores the system''s data and provides it
    to the client. It also serves the files that implement the client-side system.


    The server keeps the list of talks proposed for the next meeting, and the client
    shows this list. Each talk has a presenter name, a title, a summary, and an array
    of comments associated with it. The client allows users to propose new talks (adding
    them to the list), delete talks, and comment on existing talks. Whenever the user
    makes such a change, the client makes an HTTP request to tell the server about
    it.'
