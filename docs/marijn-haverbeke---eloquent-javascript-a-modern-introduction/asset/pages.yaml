    | 194.1 ms 17.9 % | 199.8 ms 18.5 % | includes |

    | 32.0 ms 3.0 % | 32.0 ms 3.0 % | Minor GC |

    | 2.1 ms 0.2 % | 1043.6 ms 96.4 % | run |


    This lists the functions (or other tasks) that took a serious amount of time.
    For each function, the report spent executing the function, in milliseconds and
    as a percentage of the total time taken. The first column shows only the time
