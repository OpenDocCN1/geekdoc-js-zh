  md: 'The delete operator cuts off a tentacle from such an octopus. This is a unary
    operator that, when applied to an object, will remove the named property from
    the object. This is not a common thing to do, but it is possible.


    ```

    let anObject = (left: 1, right: 2);

    console.log(anObject.left);

    // 1

    delete anObject.left;

    console.log(anObject.left);

    // undefined

    console.log(''left'' in anObject);

    // false

    console.log(''right'' in anObject);

    // true

    ```


    The binary operator, when applied to a string and an object, tells you whether
    object has a property with that name. The difference between setting a property
    to undefined and actually deleting it is, in the first case, the object still
    has the property (it just doesn''t have a very interesting value), whereas in
    the second case the property is no longer present and will return false.


    To find out properties an object has, you can use the Object.keys function. It
    gives you an object, and it returns an array of strings—the object''s property
    names.


    ```

    console.log(Object.keys({x: 0, y: 0, z: 2}));

    // -> ["x", "y", "z"]

    ```


    There''s an Object.assign function that copies all properties from one object
    into another.


    ```

    let objectA = {a: 1, b: 2};

    Object.assign(objectA, {b: 3, c: 4});

    console.log(objectA);

    // -> {a: 1, b: 3, c: 4}

    ```


    Arrays, then, are just a kind of object specialized for storing sequences of things.
    If you evaluate [], it produces "object". You can see that as long, flat octopuses
    have all their tentacles in a row, labeled with numbers.


    We will represent the journal Jacques keeps as an array of objects.


