  md: 'To keep the color field showing the correct color, that tool would have to
    know that the color exists and update it when it picks a new color. If you add
    another place that makes the color visible (maybe the mouse cursor could show
    it), you have to update your color-changing code to keep that synchronized.


    In effect, this creates a problem where each part of the interface needs to know
    about all other parts, which is not very modular. For small applications like
    the one in this chapter, that may not be a problem. For bigger projects, it can
    turn into a real nightmare.


    To avoid this on principle, we''re going to be strict about data flow. There is
    a state, and the interface is drawn on that state. An interface component may
    respond to user actions by updating the state, at which point the components get
    a chance to synchronize themselves with this new state.


    In practice, insofar each component is set up so that it is given a new state,
    it also notifies its children, setting this to be updated is a bit of a hassle.
    Making this more convenient is the main selling point of many browser programming
    libraries. But for a small application like this, we can do it without such infrastructure.


    Updates to the state are represented as objects, which we''ll call actions. Components
    may create such actions and dispatch them—give them to a central state management
    function. That function computes the next state, after the interface components
    update themselves to this new state.


    We''re taking the messy task of running a user interface and applying some structure
    to it. Though the DOM-related pieces are still full of side effects, they are
    held up by a conceptually backbone: the state update cycle. The state determines
    what the DOM looks like, and the only way DOM events can change the state is by
    dispatching actions to the state.


    There are many variants of this approach, each with its own benefits and problems,
    but their central idea is the same: state changes should go through a single well-defined
    channel, not happen all over the place.


    Our components will be classes conforming to an interface. Their constructor is
    given a state—which may be the whole application state or some smaller value if
    it doesn''t need access to everything—and uses that to build up a property. This
    is the DOM element that represents the component. Most constructors will also
    take some other value that won''t change over time, such as the function they
    can use to dispatch an action.


    Each component has a syncState method that is used to synchronize it to a new
    state value. The method takes one argument, the state, which is of the same type
    as the first argument to its constructor.


    # The State


    The application state will be an object with picture, tool, and color properties.
    The picture is an object that stores the width, height, and pixel content of the
    picture. The pixels are stored in an array, in the same way as the matrix class
    from Chapter 6—row by row, from top to bottom.'
