    # # HTML and JavaScript


    In the context of this book, the most important HTML tag is <script>. This tag
    allows us to include a piece of JavaScript in a document.


    ```

    <h1>Testing alert/h1

    <script>alert("hello!");</script>

    ```


    Such a page will run as soon as its <script> tag is encountered while the browser
    reads the HTML. This page will pop up a dialog when opened—the alert function
    resembles prompt, in that it pops up a window, but shows a message without asking
    for input.


    Including large programs directly in HTML documents is often impractical. The
    <script> tag can be given an src attribute to fetch a script file (a text file
    containing a JavaScript program) from a URL.


    ```

    <h1>Testing alert/h1

    <script src="code/hello.js"></script>

    ```


    The code/hello.js file included here contains the same program— alert("hello!").
    When HTML page references other URLs as part of itself—for example, an image file
    or a script—web browsers will retrieve them immediately and include them in the
    <script> page.


    A script tag must always be closed with </script>, even if it refers to a script
    file and doesn''t contain any code. If you forget this, the rest of the page will
    be interpreted as part of the script.


    You can load ES modules ("ECMAScript Modules on page 173) in the browser by giving
    your script tag a type="module" attribute. Such modules depend on other modules
    by using URLs relative to themselves as module names in import declarations.


    Some attributes can also contain a JavaScript program. The <button> tag shown
    next (which shows up as a button) has an onclick attribute. The attribute''s value
    will be run whenever the button is clicked.


    ```

    <button onclick=''alert(''Boom!'');">DO NOT PRESS</button>

    ```


    Note that I have used single quotes for the string in the onclick attribute because
    double quotes are already used to quote the whole attribute. I could also have
    used &quot;",


