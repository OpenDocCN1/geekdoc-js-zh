    This kind of loop is common in classical JavaScript—going over arrays one element
    at a time is something that comes up a lot, and to do that you''d run a counter
    over the length of the array and pick out each element in turn.


    There is a simpler way to write such loops in modern JavaScript.


    ```

    for (let entry of JOURNAL) {

    console.log(`${entry.events.length} events.`);

    }

    ```


    When a for loop looks like this, with the word of after a variable definition,
    it will loop over the elements of the value given after. This works not only for
    arrays but also for strings and some other data structures. We''ll discuss how
    it works in Chapter 6.


