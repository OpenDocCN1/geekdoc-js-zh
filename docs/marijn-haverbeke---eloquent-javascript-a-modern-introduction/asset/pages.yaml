  md: '# Paths


    A path is a sequence of lines. The 2D canvas interface takes a peculiar approach
    to describing such a path. It''s entirely through side effects. Paths are not
    values that can be stored and passed around. Instead, if you want to do something
    with a path, you make a sequence of method calls to describe its shape.


    ```

