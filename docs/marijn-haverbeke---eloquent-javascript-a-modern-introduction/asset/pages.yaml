  md: "measure time in seconds, so speeds are expressed in units per second.\n\nThings\
    \ is easy. The difficult part is dealing with the interactions between the elements.\
    \ When the player hits a wall or floor, they should not simply move through it.\
    \ The game must notice when a given motion causes an object to hit another object\
    \ and respond accordingly. For walls, the motion must be stopped. When hitting\
    \ a coin, the coin must be collected. When touching lava, the game should be lost.\n\
    \nSolving this for the general case is a big task. You can find libraries, usually\
    \ called physics engines, that simulate interaction between physical objects in\
    \ two or three dimensions. We'll take a most modest approach in this chapter,\
    \ handling only collisions between rectangular objects and handling them in a\
    \ rather simplistic way.\n\nBefore moving the player or a block of lava, we must\
    \ test whether the motion takes inside of a wall. If so, we simply cancel the\
    \ motion altogether. The response to such a collision depends on the type of actor—the\
    \ player will stop, whereas a lava block will bounce back.\n\nThis approach requires\
    \ our time steps to be small since it will cause motion to stop the objects almost\
    \ touch. If the time steps (and thus the motion steps) are too big, the player\
    \ would end up hovering a noticeable distance above the ground. Another approach,\
    \ arguably better but more complicated, would be to find the exact collision spot\
    \ and move there. We will take the simple approach and hide its problems by ensuring\
    \ the animation proceeds in small steps.\n\nThe method tells us whether a rectangle\
    \ (specified by a position and size) touches a grid element of the given type.\n\
    \n```\nLevel.prototype.touches = function(pos, size, type) {\nvar xStart = Math.floor(pos.x);\n\
    var xEnd = Math.ceil(pos.x + size.x);\nvar yStart = Math.floor(pos.y);\nvar yEnd\
    \ = Math.ceil(pos.y + size.y);\n\nfor (var y = yStart; y < yEnd; y++) {\n  for\
    \ (var x = xStart; x < xEnd; x++) {\n    let isOutside = x < 0 || x >= this.width\
    \ ||\n    y < 0 || y >= this.height;\n    let here = isOutside ? \"wall\" : this.rows[y][x];\n\
    \    if (here == type) return true;\n  }\n}\nreturn false;\n};\n```\n\nThe method\
