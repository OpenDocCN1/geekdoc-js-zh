  md: 'and the thin lines represent time spent waiting for the network. In the synchronous
    model, the time taken by the network is part of the timeline for a given thread
    of control. In the asynchronous model, starting a network action conceptually
    causes a split in the timeline. The program that initiated the action continues
    running, and the action happens alongside it, notifying the program when it is
    finished.


    synchronous, single thread of control


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_177_0.png)


    synchronous, two threads of control


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_177_1.png)


    asynchronous


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_177_2.png)


    Another way to describe the difference is that waiting for actions to finish is
    implicit in the synchronous model, while it is explicit, under our control, in
    the asynchronous one.


    Asynchronicity cuts both ways. It makes expressing programs that do not fit the
    straight-line model of control easier, but it can also make expressing programs
    that follow a straight line more awkward. We''ll see some ways to address this
    awkwardness later in the chapter.


    Both of the JavaScript programming platforms—browsers and Node.js—make operations
    that might take a while asynchronous, rather than relying on threads. Since programming
    with threads is notoriously hard (understanding what a program does is much more
    difficult when it''s doing multiple things at once), this is generally considered
    a good thing.


