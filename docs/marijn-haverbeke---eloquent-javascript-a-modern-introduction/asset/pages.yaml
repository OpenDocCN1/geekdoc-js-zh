- img_proc: true
  md: 'Object returned from exec has an index property that tells us where in the
    string the successful match begins. Unlike that, the object looks like (and in
    fact is) an array of strings, whose first element is the string that was matched.
    In the previous example, this is the sequence of digits that we were looking for.


    String values have a match method that behaves similarly.


    ```

    console.log("one two 100".match(/\d+/));

    // > ["100"]

    ```


    When the regular expression contains subexpressions grouped with parentheses,
    the text that those groups will also show up in the array. The whole match is
    always the first element. The next element is the part matched by the first group
    (the one whose opening parenthesis comes first in the expression), then the second
    group, and so on.


    ```

    let quotedText = ''/([^'']*)''/;

    console.log(quotedText.exec("she said ''hello''"));

    // > ["''hello''", "hello"]

    ```


    When a group does not end up being matched at all (for example, when followed
    by a question mark), its position in the output array will hold undefined. Similarly,
    when a group is matched multiple times, only the last match ends up in the array.


    ```

    console.log(/(badly)?/.exec("bad"));

    // > ["bad", undefined]

    console.log(/(\d+)/.exec("123"));

    // > ["123", "123"]

    ```


    Groups can be useful for extracting parts of a string. If we don''t want to verify
    whether a string contains a date but also extract it and construct an object that
    represents it, we can wrap parentheses around the digit patterns and directly
    pick the out of rest of exec.


    But first we''ll take a brief detour, in which we discuss the built-in way to
    represent date and time values in JavaScript.


    # The Date Class


    JavaScript has a standard class for representing dates—or, rather, points in time.
    It is called Date. If you simply create a date object using *new*, you get the
    current date and time.


    ```

    console.log(new Date());

    // → Sat Sep 01 2018 15:24:32 GMT+0200 (CEST)

    ```


    You can also create an object for a specific time.


    ```

    console.log(new Date(2009, 11, 9));

    // > Wed Dec 09 2009 00:00:00 GMT+0100 (CET)

    console.log(new Date(2009, 11, 9, 12, 59, 59, 999));

    // > Wed Dec 09 2009 12:59:59 GMT+0100 (CET)

    ```'
