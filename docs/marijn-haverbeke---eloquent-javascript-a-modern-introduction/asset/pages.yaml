  md: 'That is a program to add the numbers from 1 to 10 to together and print out
    the result: $1+2+\dots+10 = 55$. It could run on a simple, hypothetical machine.
    To program early computers, it was necessary to set large arrays of switches in
    the right position or punch holes in cardboard and feed them to the computer.
    You can probably imagine how tedious and error-prone this procedure was. Even
    writing simple programs required such cleverness and discipline. Complex ones
    were nearly inconceivable.


    Of course, manually entering these arcane patterns of bits (the ones and zeros)
    gave the programmer a profound sense of being a mighty wizard. And that has to
    be worth something in job satisfaction.


    Each line of the previous program contains a single instruction. It could be written
    in English like this:


    +   1. Store the number 0 in memory location 0.

    2. Store the number 1 in memory location 1.

    3. Store the value of memory location 1 in memory location 2.

    4. Subtract the number 11 from the value in memory location 2.

    5. If the value in memory location 2 is the number 0, continue with instruction
    9.

    6. Add the value of memory location 1 to memory location 0.

    7. Add the number 1 to the value of memory location 1.

    8. Continue with instruction 3.

    9. Output the value of memory location 0.


    Although that is already more readable than the soup of bits, it is still rather
    obscure. Using names instead of numbers for the instructions and memory locations
    helps.


    ```

    Set "total" to 0.

    Set "count" to 1.

    [loop]

    Set "compare" to "count".

    Subtract 11 from "compare".

    If "compare" is zero, continue at [end].

    Add "count" to "total".

    Add 1 to "count".

    Continue at [loop].

    [end]

    Output "total".

    ```


    Can you see how the program works at this point? The first two lines give you
    memory locations their starting values: total will be used to build up the result
    of the computation, and count will keep'
