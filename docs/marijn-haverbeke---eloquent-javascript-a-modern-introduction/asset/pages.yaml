    # Text


    A 2D canvas drawing context provides the methods fillText and strokeText. The
    latter can be useful for outlining letters, but usually fillText is what you need.
    It will fill the outline of the given text with the current fillStyle.


    ```

    <canvas></canvas>

    <script>

    let cx = document.querySelector("canvas").getContext("2d");

    ctx.font = "28px Georgia";

    ctx.fillStyle = "fuchsia";

    ctx.fillText("I can draw text, too!", 10, 50);

    </script>

    ```


    You can specify the size, style, and font of the text with the font property.
    This example gives a font size and name family. It is also possible to add italic
    or bold to the start of the string to select a style.


    The last two arguments to fillText and strokeText provide the position at the
    font is drawn. By default, they indicate the position of the start of the text’s
    alphabetical baseline, which is the line that letters “stand” on, not counting
    hanging parts in letters like j or p. You can change the horizontal position by
    setting the textAlign property to "end" or "center" and the vertical position
    by setting textBaseline to "top","middle", or "bottom".


    We’ll come back to our pie chart, and the problem of labeling the slices, in the
    exercises at the end of the chapter.


