  md: 'Say, for example, that we want to represent a chunk of digital data, we''ll
    first have to find a way to represent it in our machine''s memory.


    We could create with strings—after all, strings can have any length, so we can
    put a lot of data into them—and use "2 3 5 7 11" as our representation. But this
    is awkward. You''d have to extract the digits and convert them back to numbers
    to access them.


    Fortunately, JavaScript provides a data type specifically for storing sequences
    of values. It is called an array and is written as a list of values between square
    brackets, separated by commas.


    ```

    let listOfNumbers = [2, 3, 5, 7, 11];

    console.log(listOfNumbers[2]);

    // 5

    console.log(listOfNumbers[0]);

    // 2

    console.log(listOfNumbers[2 - 1]);

    // 3

    ```


    The notation for getting the elements inside an array also uses square brackets.
    A pair of square brackets immediately after an expression, with another expression
    inside of them, will look up the element in the left-hand expression that corresponds
    to the *index* given by the expression in the brackets.


    The first index of an array is zero, not one. So the first element is retrieved
    with `listOfNumbers[0]`. Zero-based counting has a long tradition in technology
    and in certain ways makes a lot of sense, but it takes some getting used to. Think
    of the index as the amount of items to skip, counting from the start of the array.


    # Properties


    We''ve seen a few suspicious-looking expressions like `myString.length` (to get
    the length of a string) and `Math.max` (the maximum function) in past chapters.
    These are expressions that access a *property* of some value. In the first case,
    we access the length value of `myString`. In the second, we access the property
    named `max` in the `Math` object (which is a collection of mathematics-related
    constants and functions).


    Almost all JavaScript values have properties. The exceptions are `null` and `undefined`.
    If you try to access a property of one of these nonvalues, you get an error.


    ```

    null.length;

    // // TypeError: null has no properties

    ```


    The two main ways to access properties in JavaScript are with a dot and square
    brackets. Both `value.x` and `value[x]` access a property on `value`—but not necessarily
    the same property. The difference is in how *x* is interpreted. When using a dot,
    the word after the dot is the literal name of the property. When using square
    brackets, the expression between the brackets is *evaluated* to get the property
    name. Whereas `value.x` fetches the property named “x”, `value[x]` tries to evaluate
    the expression `x` and uses the result, converted to a string, as the property
    name.'
