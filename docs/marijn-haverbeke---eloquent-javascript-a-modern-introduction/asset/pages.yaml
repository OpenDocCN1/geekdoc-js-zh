  md: 'A moderately complicated website can easily fetch anywhere from 10 to 200 resources.
    To be able to fetch those quickly, browsers will make several GET requests simultaneously,
    rather than waiting for the responses at one.


    HTML pages include forms, which allow the user to fill out information and send
    it to the server. This is an example of a form:


    ```

    <form method="GET" action="example/message.html">

    <p>Name: <input type="text" name="name\></p>

    <p>Message:<br><textarea name="message"></textarea></p>

    <p><button type="submit">Send</button></p>

    </form>

    ```


    This code describes a form with two fields: a small one for a name and a larger
    one to write a message. When you click the Send button, the form is submitted,
    meaning that the content of its form is packed into an HTTP request and the browser
    navigates to the result of that request:


    When the <form> method attribute is GET (or is omitted), the information in the
    form is added to the end of the action URL as a query string. The browser might
    make a request to this


    ```

    GET /example/message.html?name=Jean&message=Yes%3F_HTTP/1.1

    ```


    The question mark indicates the end of the path part of the URL and the start
    of the query. It is followed by pairs of names and values, corresponding to the
    name attribute on the form fields and the content of those elements, respectively.
    An ampersand character (&) is used to separate the pairs.


    The actual message encoded in the URL is Yes?, but the question mark is replaced
    by a strange character. Some characters in query strings must be escaped. The
    question mark, represented as %3F, is one of those. There seems to be an unwritten
    rule that every format owns its own way of escaping characters. This, called URL
    encoding, uses a percent sign followed by two hexadecimal (base 16) digits to
    encode the character code. In this case, 3F, which is 63 in decimal notation,
    is the code of a question mark. JavaScript provides encodeURIComponent and decodeURIComponent
    functions to encode and decode this.


    ```

    console.log(encodeURIComponent("Yes?"));

    // -> %3F

    console.log(decodeURIComponent("%3F"));

    // -> Yes?

    ```


    If we change the method attribute of the HTML form in the example we saw earlier
    to POST, the HTTP request made would submit the form using the POST method and
    put the query string in the body of the response, rather than adding it to the
    URL.


    ```

    POST /example/message.html HTTP/1.1

    Content-length: 24

    Content-type: application/x-www-form-urlencoded

    ```'
