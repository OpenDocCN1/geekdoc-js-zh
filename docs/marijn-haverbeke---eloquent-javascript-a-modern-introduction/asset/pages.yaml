  md: "This is the first part of the parser:\n\n```\nfunction parseExpression(program)\
    \ {\n  let skipSpace(program);\n  let match, expr;\n  if (match = /\\\"[^\\\"\
    ]+\\/.exec(program)) {\n    expr = {type: \"value\", value: match[1]};\n  } else\
    \ if (match = /\\d+\\b/.exec(program)) {\n    expr = {type: \"value\", value:\
    \ Number(match[0])};\n  } else if (match = /\\^(\\w+|##)/.exec(program)) {\n \
    \   expr = {type: \"word\", name: match[0]};\n  } else {\n    throw new SyntaxError(\"\
    Unexpected syntax: \" + program);\n  }\n\n  return parseApply(expr, program);\n\
    }\nfunction skipSpace(string) {\n  let first = string.search(/\\S/);\n  if (first\
    \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\nBecause Egg, like\
    \ JavaScript, allows any amount of whitespace between its elements, we have to\
    \ repeatedly call the skipSpace off the start of the program string. That is what\
    \ the skipSpace function helps with.\n\nAfter skipping any leading space, parseExpression\
    \ uses three regular expressions to spot the three atomic elements Egg supports:\
    \ strings, numbers, and words. The parser constructs a different kind of data\
    \ structure depending on which one matches. If the input does not match one of\
    \ the three, it is not a valid expression, and the parser throws SyntaxError instead\
    \ of Error as the exception constructor, which is another standard error type,\
    \ because it is a little more specific—it is also the error type thrown when an\
    \ attempt is made to run an invalid JavaScript program.\n\nWe then cut off the\
    \ part that was matched from the program string and pass that, along with the\
    \ object for the expression, to parseApply, which checks whether the expression\
    \ is an application. If so, it parses a parenthesized list of arguments.\n\n```\n\
    function parseApply(expr, program) {\n  skipSpace(program);\n  if (program[0]\
    \ != \"(\") {\n    return {type: \"apply\", operator: expr, args: []};\n  }\n\
    \  program = skipSpace(program.slice(1));\n  while (program[0] != \")\") {\n \
    \   let arg = parseExpression(program);\n    expr.args.push(arg.rest);\n    program\
    \ = skipSpace(program);\n  }\n```"
