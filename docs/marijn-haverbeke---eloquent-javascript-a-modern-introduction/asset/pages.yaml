    Moving in circles is done using the trigonometry functions Math.cos and Math.sin.
    For those who aren''t familiar with these, I''ll briefly introduce them since
    we will occasionally use them in this book.


    Math.cos and Math.sin are useful for finding points that lie on a circle around
    point (0,0) with a radius of one. Both functions interpret their argument as the
    position on this circle, with zero denoting the point on the far right of the
    circle, going clockwise until $2\pi$ (about 6.28) has taken us around the whole
    circle. Math.cos tells you the x-coordinate of the point that corresponds to the
    given position, and Math.sin yields the y-coordinate. Positions (or angles) greater
    than $2\pi$ or less than 0 are valid—the rotation repeats so that $a+2\pi$ refers
    to the same angle as $a$.


    This unit for measuring angles is called radians—a full circle is $2\pi$ radians,
    similar to how it is 360 degrees when measuring in degrees. The constant $\pi$
    is available as Math.PI in JavaScript.'
