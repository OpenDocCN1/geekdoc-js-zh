  md: '```

    let dateTime = /\d{2}-\d{2}-\d{4} \d{2}:\d{2}/;

    console.log(dateTime.test("01-30-2003 15:20"));

    // true

    console.log(dateTime.test("30-jan-2003 15:20"));

    // false

    ```


    That looks completely awful, doesn''t it? Half of it is backslashes, producing
    a background noise that makes it hard to spot the actual pattern expressed. We''ll
    see a slightly improved version of this expression in the next section.


    These backslash codes can also be used inside square brackets. For example, [.\d]
    means any digit or a period. But the period itself, between square brackets, loses
    its special meaning. The same goes for other special characters, such as +.


    To invert a set of characters—that is, to express that you want to match any character
    except the ones in the set—you can write a caret (^) character after the opening
    bracket.


    ```

    let notBinary = /[^0-1]/;

    console.log(notBinary.test("1100100010100110"));

    // false

    console.log(notBinary.test("1100100010200110"));

    // true

    // true

    ```


    # Repeating Parts of a Pattern


    We now know how to match a single digit. What if we want to match a whole number—a
    sequence of one or more digits?


    When you put a plus (+) after something in a regular expression, it indicates
    that the element can be repeated more than once. Thus, /\d+/ matches one or more
    digit characters.


    ```

    console.log(/\d+/.test("123"));

    // // true

    console.log(/\d+/.test(""));

    // // false

    console.log(/\d*/.test("123"));

    // // true

    console.log(/\d*/.test(""));

    // // true

    ```


    The star (*) has a similar meaning but also allows the pattern to match zero times.
    With a star it never prevents a pattern from matching—it''ll just match zero instances
    if it can''t find any suitable text to match.


    A question mark (?) makes a part of a pattern optional, it may occur zero times
    or one time. In the following example, the u is allowed to occur, but the pattern
    also matches when it is missing.


    ```

    let neighbor = /neighbour?r/;

    ```'
