    : `${this.version}`\n    }\n  };\n};\n```\n\nThe handler itself needs to look\
    \ at the request headers to see whether If-None-Match and Prefer headers are present.\
    \ Node stores headers, whose names are specified to be case insensitive, under\
    \ their lowercase name.\n\n```\nrouter.get(\"/talks/\\/d*$\", async (server, request)\
    \ => {\n  let tag = (/.**/).exec(request.headers[\"if-none-match\"]);\n  let wait\
    \ = await wait(/\\d+*/).exec(request.headers[\"prefer\"]);\n  if (!tag || tag[1]\
    \ != server.version) {\n    return server.talkResponse();\n  } else if (wait)\
