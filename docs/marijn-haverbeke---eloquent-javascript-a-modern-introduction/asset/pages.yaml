  md: "The part before the or operator matches two slash characters followed by any\
    \ number of non-newline characters. The part for multiline comments is more involved.\
    \ We use [^ (any character that is not in the empty set of characters) as a way\
    \ to match any character. We cannot just use a period here because block comments\
    \ can continue on a new line, and the period character does not match newline\
    \ characters.\n\nThe [^] part of the expression, as I described in the section\
    \ on backtracking, will first match as much as it can. If that causes the next\
    \ part of the pattern to fail, the matcher moves back one character and tries\
    \ again from there. In the example, the matcher first tries to match the whole\
    \ rest of the string and then moves back from there. It will find an occurrence\
    \ of /* after going back four characters and match that. This is not what we wanted—the\
    \ intention was to match a single comment, not to go all the way to the end of\
    \ the code and find the end of the last block comment.\n\nBut for the output the\
    \ last line appears to have gone wrong. Why?\n\nBecause of this behavior, we say\
    \ the repetition operators (*, ?, {}) are greedy, meaning they match as much as\
    \ they can and backtrack from there. If you put a question mark after them (+,\
    \ *, ?, {}), they become nongreedy and start by matching as little as possible,\
    \ matching only when the remaining pattern does not fit the smaller match.\n\n\
    And that is exactly what we want in this. By having the star the smallest stretch\
    \ of characters brings us up to /, we consume one block and nothing more.\n\n\
    ```\nfunction stripComments(code) {\n  return code.replace(/\\/\\*\\/|[^*]*?\\\
    \\*/g, \"\");\n}\nconsole.log(stripComments(\"1 /* * b */ 1\"));\n// -> 1 + 1\n\
    ```\n\nA lot of regular expression programs can be traced unintentionally with\
    \ a greedy operator where a nongreedy one would work better. When using a repetition\
    \ operator, consider the nongreedy variant first.\n\n# Dynamically Creating RegExp\
    \ Objects\n\nThere are cases where you might not know the exact pattern you need\
    \ to match when you are writing your code. Say you want to look the user's name\
    \ in a piece of text and enclose it in underscore characters to make it stand\
    \ out. Since you will know the name only once the program is actually running,\
