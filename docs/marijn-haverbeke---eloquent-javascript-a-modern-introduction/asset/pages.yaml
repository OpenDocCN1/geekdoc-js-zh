  md: '# Arithmetic


    The main thing to do with numbers is arithmetic. Arithmetic operations such as
    addition or multiplication take two number values and produce a new number from
    them. Here is what they look like in JavaScript:


    ```

    100 + 4 * 11

    ```


    The + and * symbols are called operators. The first stands for addition, and the
    second stands for multiplication. Putting an operator between two values will
    apply it to those values and produce a new value.


    But does the example mean “add 4 and 100, and multiply the result by 11,” or is
    the multiplication done before the adding? As you might have guessed, the multiplication
    happens first. But in mathematics, you can change this by wrapping the addition
    in parentheses.


    ```

    (100 + 4) * 11

    ```


    For subtraction, there is the - operator, and division can be done with the /
    operator.

    When operators appear together without parentheses, the order in which they are
    applied is determined by the precedence of operators. The example shows that multiplication
    comes before addition. The / operator has the same precedence as *. Likewise for
    + and -. When multiple operators with the same precedence appear next to each
    other, as in 1 - 2 + 1, they are applied from left to right:


    These rules of precedence are not something you should worry about. In doubt,
    just add parentheses.

    There one more arithmetic operator, which you might not immediately recognize.
    The % symbol is used to represent the remainder operator. x % y is the remainder
    of dividing x by y. For example, 314 % 100 produces 14, and 144 % 12 gives 0.
    The remainder operator''s precedence is the same as that of multiplication and
    division. You''ll also see this operator referred to as modulo.


    # Special Numbers


    There are three special values in JavaScript that are considered numbers but don''t
    behave like normal numbers.


    The first two are Infinity and -Infinity, which represent the positive and negative
    infinities.

    Infinity is still Infinity, and so on. Don''t put too much trust in infinity-based
    computation, though it isn''t mathematically sound, and it will quickly lead to
    the next special number: NaN.


    NaN stands for “not a number,” though it is a value of the number type. You''ll
    get this result when you, for example, try to calculate 0/0 (zero divided by zero),
    Infinity - Infinity, or any number of other numeric operations that don''t yield
    a meaningful result.'
