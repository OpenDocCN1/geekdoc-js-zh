  md: "GET requests should be used for requests that do not have side effects but\
    \ simply ask for information. Requests that change something on the server, for\
    \ example creating a new account or posting a message, should be expressed with\
    \ other methods, such as POST. Client-side software, such as a browser, knows\
    \ that it shouldn't blindly POST requests but will often implicitly make GET requests—for\
    \ example to prefetch a resource it believes the user will soon need.\n\nWe'll\
    \ come back to forms and how to interact with them from JavaScript in “Form Fields”\
    \ on page 317.\n\n# Fetch\n\nThe interface through which browser JavaScript can\
    \ make HTTP requests is called fetch. Since it is relatively new, it conveniently\
    \ uses promises (which is rare for browser interfaces).\n\n```\nfetch(\"example/data.txt\"\
    ).then(response => {\n  console.log(response.status);\n  // 200\n  console.log(response.headers.get(\"\
    Content-Type\"));\n  // -> text/plain\n});\n```\n\nCalling fetch returns a promise\
    \ that resolves to a Response object having information about the server’s response,\
    \ such as its status code and its headers. The headers are wrapped in a Map-like\
    \ object that treats its keys (the header names) as case insensitive because header\
    \ names are not supposed to be sensitive. This means headers.get(\"Content-Type\"\
    ) and headers.get(\"content-TYPE\") will return the same value.\n\nNote that the\
    \ promise returned by fetch resolves successfully even if the server responded\
    \ with an error code. It might be rejected if there is a network error or if the\
    \ server that the request is addressed to can't be found.\n\nThe first argument\
    \ to fetch is the URL that should be requested. When URL doesn't start with a\
    \ protocol name (such as http:), it is treated as relative, which means it is\
    \ relative to the current document. When it starts with a slash (/), it replaces\
    \ the current path, which is the part after the server name. When it does not,\
    \ the part of the current path up to and including its last slash character is\
    \ put in front of the relative URL.\n\nTo get at the actual content of a response,\
    \ you can use its text method. Because the initial promise is is resolved as soon\
    \ as the server’s headers have been received, and because reading the response\
    \ body might take a while, this again returns a promise.\n\n```\nfetch(\"example/data.txt\"\
    )\n.then(resp => resp.text())\n.then(text => console.log(text));\n// -> This is\
    \ the content of data.txt\n```"
