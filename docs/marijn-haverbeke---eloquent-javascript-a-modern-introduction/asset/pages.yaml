    **Garbage Collection**


    So why is the code that avoids creating objects faster? There are several reasons.
    The engine has to


    find a place to store the objects, it has to figure out when they are no longer
    used and reclaim them,


    and when you access their properties, it has to figure out where in memory those
    are stored.


    JavaScript engines are good at all these things but usually not so good that they
    become free.


    Imagine memory, again, as a long, long row of bits. When the program starts, it
    might receive an


    empty piece of memory and just start putting the objects it creates in there,
    one after the other. But


    at some point, the space is full, and some of the objects in it are no longer
    used. The JavaScript


    engine has to figure out which objects are used, and which are not, so that it
    can reuse the unused


    pieces of memory.


    Now the program’s memory space is a bit of a mess, containing living objects interspersed
    with


    free space. Creating a new object involves finding a piece of free space large
    enough for the object,


    which might require some searching. Alternatively, the engine could move all live
    objects to the start


    of the memory space, which makes creating new objects cheaper (they can just be
    put one after the


    other again) but requires more work when moving the old objects.


    In principle, figuring out which objects are still used requires tracing through
    all reachable


    objects, starting from the global scope and the currently active local scope.
    Any object referenced


    from those scopes, directly or indirectly, is still alive. If your program has
    a lot of data in memory,


    this is quite a lot of work.


    A technique called *generational garbage collection* can help reduce these costs.
    This approach


    exploits the fact that most objects have short lives. It splits the memory available
    to the JavaScript


    program into two or more *generations*. New objects are created in the space reserved
    for the young


    generation. When this space is full, the engine figures out which of the objects
    in it are still alive and


    moves those to the next generation. If only a small fraction of the objects in
    the young generation


    are still alive when this occurs, only a small amount of work has to be done to
    move them.


    Of course, figuring out which objects are alive does require knowing about all
    references to


    objects in the live generation. The garbage collector wants to avoid looking through
    all the objects


    in the older generations every time the young generation is collected. So when
    a reference is created


    from an old object to a new object, this reference must be recorded so that it
    can be taken into


    account during the next collection. This makes writing to old objects slightly
    more expensive, but


    that cost is more than compensated for by the time saved during garbage collection.


