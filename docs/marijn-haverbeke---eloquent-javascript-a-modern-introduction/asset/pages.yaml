  md: '# 16

    PROJECT: A PLATFORM GAME


    Much of my initial fascination with computers, like that of many nerdy kids, had
    to do with computer games. I was drawn into the tiny simulated worlds that I could
    manipulate and in which stories (sort of) unfolded—more, I suppose, because of
    the way I projected my imagination into them than because of the possibilities
    they actually offered.


    I don''t wish a career in game programming on anyone. Much like the music industry,
    the discrepancy between the number of eager young people wanting to work in it
    and the actual demand for such people creates a rather unhealthy environment.
    But writing games for fun is amusing.


    This chapter will walk through the implementation of a small platform game. Platform
    games (or “jump and run” games) are games that expect the player to move a figure
    through a world, which is usually two-dimensional and viewed from the side, while
    jumping over and onto things.


    # The Game


    Our game will be roughly based on Dark Blue (www.lessmilk.com/games/10) by Thomas
    Palef. I chose that game because it is both entertaining and mini-malist and because
    it can be built without too much code.


    It looks like this:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_248_0.png)


    The dark box represents the player, whose task is to collect the small boxes (coins)
    while avoiding

    the lava. A level is completed when all coins have been collected.

    The player can walk around with the left and right arrow keys and can jump with
    the up arrow.'
