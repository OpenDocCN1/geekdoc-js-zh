  md: "and, even delete. (Since the internet is full of hooligans, putting such a\
    \ system online without further protection probably wouldn’t end well)\n\n# The\
    \ Server\n\nLet’s start by building the server-side part of the program. The code\
    \ in this section runs on Node.js.\n\n# Routing\n\nOur server will use createServer\
    \ to start an HTTP server. In the function that handles a new request, we must\
    \ distinguish between the various kinds of requests (as determined by the method\
    \ and the path) that we support. This can be done with a long chain of if statements,\
    \ but there is a nicer way.\n\nA router is a component that helps dispatch a request\
    \ to the function that can handle it. You can tell the router, for example, that\
    \ put requests with a path that matches the regular expression `/^/talk\\/([^/]+)`\
    \ (followed by a talk title) can be handled by a given function. In addition,\
    \ it can help extract the meaningful parts of the path (in this case the talk\
    \ title), wrapped in parentheses in the regular expression, and pass them to the\
    \ handler function.\n\nThere are a number of good router packages on NPM, but\
    \ we’ll write one to ourselves to illustrate the principle.\n\nThis is router.js,\
    \ which we will later require from our server module:\n\n```\nconst {parse} =\
    \ require(\"url\");\n\nmodule.exports = class Router {\n  constructor() {\n  \
    \  this.routes = [];\n  }\n\n  add(method, url, handler) {\n    this.routes.push({method,\
    \ url, handler});\n  }\n\n  resolve(context, request) {\n    let path = parse(request.url).pathname;\n\
    \n    for (let {method, url, handler} of this.routes) {\n      let match = url.exec(path);\n\
    \      if (!match || request.method !== method) continue;\n      let urlParts\
    \ = match.slice(1).map(decodeURIComponent);\n      return handler(context, ...urlParts,\
    \ request);\n    }\n    return null;\n  }\n};\n```\n\nThe module exports the Router\
