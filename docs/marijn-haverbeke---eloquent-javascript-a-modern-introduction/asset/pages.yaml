  md: '# 18

    HTTP AND FORMS


    The Hypertext Transfer Protocol, already mentioned in Chapter 13, is the mechanism
    through which data is requested and provided on the World Wide Web. This chapter
    describes the protocol in more detail and explains the way browser JavaScript
    has access to it.


    # The Protocol


    If you type eloquentjavascript.net/18_http.html into your browser''s address bar,
    the browser first looks up the address of the server associated with eloquentjavascript.net
    and tries to open a TCP connection to it on 80, the default port for HTTP traffic.
    If the server exists and accepts the connection, the browser might see something
    like:


    ```

    GET /18_http.html HTTP/1.1

    Host: eloquentjavascript.net

    User-Agent: Your browser''s name

    ```


    Then the server responds, through that connection.


    ```

    HTTP/1.1 200 OK

    Content-Length: 65585

    Content-Type: text/html

    Last-Modified: Mon, 07 Jan 2019 10:29:45 GMT

    ```


    ```

    <doctype html>

    ... the rest of the document

    ```


    The browser takes the part of the response after the blank line, its *body* (not
    to be confused with the HTML *<body>* tag), and displays it as an HTML document.


    The information sent by the client is the *request*. It starts with this line:


    ```

    GET /18_http.html HTTP/1.1

    ```


    The first word is the *method* of the request. GET means that we want to *get*
    the specified resource. Other methods are DELETE to delete a resource, PUT to
    create or replace it, and POST to send information to it. Note that the server
    is not obliged to carry out every request it gets. If you walk up to a random
    website and tell it to *DELETE* its main page, it''ll probably refuse.


    The part after the method name is the path of the *resource* the request applies
    to. In the simplest case, a resource is simply a file on the server, but the protocol
    does not require it. a resource may be anything that can be transferred *as if*
    it is a file. Many servers generate the responses'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'produce on the fly. For example, if you open *https://github.com/marijnh*,
    the server looks in its


    database for a user named *marijnh*, and if it finds one, it will generate a profile
    page for that user.


    After the resource path, the first line of the request mentions `HTTP/1.1` to
    indicate the version of


    the HTTP protocol it is using.


    In practice, many sites use HTTP version 2, which supports the same concepts as
    version 1.1 but


    is a lot more complicated so that it can be faster. Browsers will automatically
    switch to the appropriate


    protocol version when talking to a given server, and the outcome of a request
    is the same regardless


    of which version is used. Because version 1.1 is more straightforward and easier
    to play around with,


    we’ll focus on that.


    The server’s response will start with a version as well, followed by the status
    of the response, first


    as a three-digit status code and then as a human-readable string.


    `HTTP/1.1 200 OK`


    Status codes starting with a 2 indicate that the request succeeded. Codes starting
    with 4 mean


    there was something wrong with the request. 404 is probably the most famous HTTP
    status code—


    it means that the resource could not be found. Codes that start with 5 mean an
    error happened on


    the server and the request is not to blame.


    The first line of a request or response may be followed by any number of *headers*.
    These are lines


    in the form `name: value` that specify extra information about the request or
    response. These headers


    were part of the example response:


    `Content-Length: 65585`


    `Content-Type: text/html`


    `Last-Modified: Thu, 04 Jan 2018 14:05:30 GMT`


    This tells us the size and type of the response document. In this case, it is
    an HTML document


    of 65,585 bytes. It also tells us when that document was last modified.


    For most headers, the client and server are free to decide whether to include
    them in a request or


    response. But a few are required. For example, the `Host` header, which specifies
    the hostname, should


    be included in a request because a server might be serving multiple hostnames
    on a single IP


    address, and without that header, the server won’t know which hostname the client
    is trying to talk


    to.


    After the headers, both requests and responses may include a blank line followed
    by a body,


    which contains the data being sent. `GET` and `DELETE` requests don’t send along
    any data, but `PUT` and `POST`


    requests do. Similarly, some response types, such as error responses, do not require
    a body.


    **Browsers and HTTP**


    As we saw in the example, a browser will make a request when we enter a URL in
    its address bar.


    When the resulting HTML page references other files, such as images and JavaScript
    files, those are


    also retrieved.'
