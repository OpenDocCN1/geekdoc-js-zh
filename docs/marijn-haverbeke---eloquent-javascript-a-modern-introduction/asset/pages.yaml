  md: 'At the same time, browser technology is ridiculous. You have to learn a large
    number of silly tricks and obscure factors to master it, and the default programming
    model it provides is so problematic that most programmers prefer to cover it in
    several layers of abstraction rather than deal with it directly.


    And though the situation is definitely improving, it mostly does so in the form
    of more elements being added to address shortcomings—creating even more complexity.
    A feature used by a million websites can''t really be replaced. Even if it could,
    it would be hard to decide what it should be replaced with.


    Technology never exists in a vacuum—we''re constrained by our tools and the social,
    economic, and historical factors that produced them. This can be annoying, but
    it is generally more productive to try to build a good understanding of how the
    existing technical reality works—and why it is we—than to rage against it or hold
    out for another reality.


    New abstractions can be helpful. The component model and data flow I used in this
    chapter is a crude form of that. As mentioned, there are libraries that to make
    user interface programming more pleasant. At the time of writing, React and Angular
    are popular choices, but there''s a whole cottage industry of such frameworks.
    If you''re interested in web applications, I recommend investigating a few of
    them to understand how they work and what benefits they provide.


    # Exercises


    There is still room for improvement in our program. Let''s add a few more features
    as exercises.


    # Keyboard Bindings


    Add keyboard shortcuts to the application. The first letter of a tool''s name
    selects the tool, and CTRL-Z or COMMAND-Z undoes.


    Do this by modifying the PixelEditor component. Add a tabindex property of 0 to
    the wrapping div element so it can receive keyboard focus. Note that the property
    corresponding to the tabindex attribute is called tabindex, with a capital I,
    and our element functions property names. Register key event handlers directly
    on that element. This means you have to click, touch, or tap to the application
    before you interact with it with the keyboard.


    Remember that keyboard events have ctrlKey and metaKey (for the COMMAND key on
    a Mac) properties that you can use to see whether those keys are held down.


    # Efficient Drawing


    During drawing, the majority of work that our application does happens in drawPicture.
    Creating a new state and updating the rest of the DOM isn''t very expensive, but
    repainting all the pixels on the canvas is a bit of work.'
