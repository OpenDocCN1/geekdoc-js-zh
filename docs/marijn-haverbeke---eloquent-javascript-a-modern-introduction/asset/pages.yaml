  md: "# HIGHER-ORDER FUNCTIONS\n\nA large program is a costly program, and not just\
    \ because of the time it takes to build. Size almost always involves complexity,\
    \ and complexity confuses programmers. Confused programmers, in turn, introduce\
    \ mistakes (bugs) into programs. A large program then provides a lot of space\
    \ for these bugs to hide, making them hard to find.\n\nLet's briefly go back to\
    \ the final example programs in the introduction. The first is self-contained\
    \ and six lines.\n\n```\nlet total = 0, count = 1;\nwhile (count <= 10) {\n  total\
    \ += count;\n}\nconsole.log(total);\n```\n\nThe second relies on two external\
    \ functions and is one line long.\n\n```\nconsole.log(sum(range(1, 10)));\n```\n\
    \nWhich one is more likely to contain a bug?\n\nIf we count the size of the definitions\
    \ of sum and range, the second program is also big—even than the first. But still,\
    \ I'd argue that it is more likely to be correct.\n\nIt is more likely to be correct\
    \ because the solution is expressed in a vocabulary that corresponds to the problem\
    \ being solved. Summing a range of numbers isn't about loops and counters. It\
    \ is about ranges and sums.\n\nThe definitions of this vocabulary (the functions\
    \ sum and range) will still involve loops, counters, and other incidental details.\
    \ But because they are expressing simpler concepts than the program as a whole,\
    \ they are easier to get right.\n\n# Abstraction\n\nIn the context of programming,\
    \ these kinds of vocabularies are usually called abstractions. Abstractions hide\
    \ details and give us the ability to talk about problems at a higher (or more\
    \ abstract) level.\n\nAs an analogy, compare these two recipes for pea soup. The\
    \ first one goes like this:\n\n+   * Put 1 cup of dried peas per person into a\
    \ container. Add water until the peas are well"
