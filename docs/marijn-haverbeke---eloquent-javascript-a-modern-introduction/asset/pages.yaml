  md: '# 22

    JAVASCRIPT AND PERFORMANCE


    Running a computer program on a machine requires bridging the gap between the
    programming language and the machine’s own instruction format. This can be done
    by writing a program that *interprets* other programs, as we did in Chapter 11,
    but it is usually done by *compiling* (translating) the program to machine code.


    Some languages, such as the C and Rust programming languages, are designed to
    express exactly those things that the machine is known to be good at. This makes
    them easy to compile efficiently. JavaScript is designed in a very different way,
    focusing on simplicity and ease of use instead. Almost none of its features correspond
    directly to features of the machine. That makes JavaScript a lot more difficult
    to compile.


    Yet somewhat modern JavaScript engines (the programs that compile and run JavaScript)
    do manage to run scripts at a surprising speed. It is possible to write JavaScript
    programs that are about 10 percent as fast as an equivalent C or Rust program.
    That might still sound like a huge gap, but older JavaScript engines (as well
    as contemporary implementations of languages with a similar design, such as Python
    and Ruby), tend to be closer to 1 percent the speed of C. Compared to these languages,
    modern JavaScript is strikingly fast—so you’ll rarely be forced to switch to another
    language because of performance problems.


    , you may occasionally need to rewrite your code to avoid the slower aspects of
    JavaScript. As an example of that process, this chapter works through a speed-hungry
    program and makes it faster. In the process we will discuss the way JavaScript
    engines compile your programs.


    # Staged Compilation


    First you must understand that JavaScript compilers do not simply compile a program
    once, as the classical compilers do. Instead, code is compiled and recompiled
    as needed, while the program is running.


    With most languages, compiling a big program takes a while. That is usually acceptable
    because programs are compiled ahead of time and distributed in compiled form.


    For JavaScript the situation is different. A website might include a large amount
    of code that is retrieved in text form and is compiled every time the website
    is opened. If that took five minutes, the user wouldn’t be happy. A JavaScript
    compiler must be able to start running a program—even a big program—almost instantaneously.


    To do this, JavaScript compilers have multiple compilation strategies. When a
    website is opened, the scripts are first compiled in a cheap, superficial way.
    This doesn’t result in very fast execution, but it allows the script to start
    quickly. Functions may not be compiled at all until the first time they'
