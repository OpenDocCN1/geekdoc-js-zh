  md: '**8**


    **BUGS AND ERRORS**


    Flaws in computer programs are usually called *bugs*. It makes programmers feel


    good to imagine them as little things that just happen to crawl into our work.
    In


    reality, of course, we put them there ourselves.


    If a program is crystallized thought, you can roughly categorize bugs into those
    caused by the


    thoughts being confused and those caused by mistakes introduced while converting
    a thought to


    code. The former type is generally harder to diagnose and fix than the latter.


    **Language**


    Many mistakes could be pointed out to us automatically by the computer, if it
    knew enough about


    what we’re trying to do. But here JavaScript’s looseness is a hindrance. Its concept
    of bindings and


    properties is vague enough that it will rarely catch typos before actually running
    the program. And


    even then, it allows you to do some clearly nonsensical things without complaint,
    such as computing


    `true * "monkey"`.


    There are some things that JavaScript does complain about. Writing a program that
    does not


    follow the language’s grammar will immediately make the computer complain. Other
    things, such as


    calling something that’s not a function or looking up a property on an undefined
    value, will cause an


    error to be reported when the program tries to perform the action.


    But often, your nonsense computation will merely produce `NaN` (not a number)
    or an undefined


    value, while the program happily continues, convinced that it’s doing something
    meaningful. The


    mistake will manifest itself only later, after the bogus value has traveled through
    several functions. It


    might not trigger an error at all but silently cause the program’s output to be
    wrong. Finding the


    source of such problems can be difficult.


    The process of finding mistakes—bugs—in programs is called *debugging*.


    **Strict Mode**


    JavaScript can be made a *little* stricter by enabling *strict mode*. This is
    done by putting the string `"use`


    `strict"` at the top of a file or a function body. Here’s an example:


    `function canYouSpotTheProblem() {`


    `"use strict";`


    `for (counter = 0; counter < 10; counter++) {`


    `console.log("Happy happy");`


    `}`


    `}`'
