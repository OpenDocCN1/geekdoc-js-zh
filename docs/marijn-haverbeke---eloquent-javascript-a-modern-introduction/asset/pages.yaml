  md: 'HTML documents, as opposed to various dialects have a head and a body. The
    head contains information *about* the document, and the body contains the document
    itself. In this case, the head declares that the title of the document is "My
    home page" and that it uses the UTF-8 encoding, which is a way to encode Unicode
    without any data. The document''s body containing a `<head>`, meaning "heading
    1"—`<h2>` to produce subheadings and two paragraphs `<p>`.


    Tags come in several forms. An element (like the body, a paragraph, or a link)
    is started by an opening tag `<p>` and ended by a closing tag `</p>`. Some opening
    tags, such as the one for the link `<a>`, contain extra information in the form
    of `name=value` pairs. These are called *attributes*. In this case, the destination
    of the link is indicated with `href="http://eloquentjavascript.net"`, where href
    stands for hypertext reference.


    Some kinds of tags do not enclose anything and thus needs to be declared. The
    metadata tag `<meta charset="utf-8">` is an example of this.


    To include angle brackets in the text of a document, even though they have a special
    meaning in HTML, a plain angle bracket is written as `&lt;` ("less than”), and
    a closing bracket is written as `&gt;` ("greater than"). In HTML, an ampersand
    `&` followed by a name or character and a semicolon (`;`) is an *entity* and will
    be replaced by the character it encodes.


    This is analogous to the backslashes in JavaScript strings. This mechanism gives
    ampersands a special meaning, too they need to be escaped as `&amp;`. Inside attribute
    values, which are wrapped in double quotes, `&quot;` can be inserted as an actual
    quote character.


    HTML is parsed in a remarkably error-tolerant way. When tags should be there are
    missing, the browser reconstructs them. The way in which this is done has been
    standardized, and you can rely on all modern browsers to do it in the same way.


    The following document will be treated just the one shown previously:


    ```

    <!doctype html>

    <meta charset="utf-8">

    <title>My home page</title>

    <h1>My home page</h1>

    <p>Hello, I am Martin and this is my home page.</p>

    <p>I also wrote a book! Read it <a href="http://eloquentjavascript.net">here</a>.

    ```


    The `<html>`, `<head>`, and `<body>` tags are gone completely. The browser knows
    that `<meta>` and `<title>` belong in the head and that `<h1>` means the body
    has started. Furthermore, I am no longer explicitly closing the paragraphs since
    opening a new paragraph or ending the document will close them implicitly. The
    quotes around the attribute values are also gone.


    This book will usually omit the `<html>`, `<head>`, and `<body>` tags from examples
    to keep them short and free of clutter. But I will close tags and include quotes
    about attributes.'
