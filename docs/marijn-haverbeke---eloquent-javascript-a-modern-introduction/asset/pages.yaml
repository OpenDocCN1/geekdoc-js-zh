    \ true;\n      }\n    }\n    return false;\n  } else if (node.nodeType == Node.TEXT_NODE)\
    \ {\n    return node.nodeValue.indexOf(string) > -1;\n  }\n}\n\nconsole.log(talksAbout(document.body,\
    \ \"book\\));\n// true\n```\n\nBecause childNodes is not a real array, we cannot\
    \ loop over it with for/of and have to run over the index range using a regular\
