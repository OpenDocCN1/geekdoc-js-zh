  md: "the worker talks to the script that created it by sending and listening directly\
    \ on its global scope. Only values that can be represented as JSON can be sent\
    \ as messages—the other side will receive a copy of them, rather than the value\
    \ itself.\n\n# Timers\n\nWe saw the setTimeout function in Chapter 11. It schedules\
    \ another function to be called later, after a given number of milliseconds.\n\
    \nSometimes you need to cancel a function you have scheduled. This is done by\
    \ storing the value returned by setTimeout and calling clearTimeout on it.\n\n\
    ```\nlet bombTimer = setTimeout(() => {\n  console.log(\"BOOM!\");\n}, 500);\n\
    \nif (Math.random() < 0.5) { // 50% chance\n  console.log(\"Defused.\");\n  clearTimeout(bombTimer);\n\
    }\n```\n\nThe cancelAnimationFrame function works in the same way as clearTimeout—calling\
    \ it on a value returned by requestAnimationFrame will cancel that frame (assuming\
    \ it hasn't already called).\n\nA similar set of functions, setInterval and clearInterval,\
    \ are used to set timers that repeat every X milliseconds.\n\n```\nlet ticks =\
    \ 0;\nlet clock = setInterval(() => {\n  console.log(\"tick\", ticks++);\n  if\
    \ (ticks == 10) {\n    clearInterval(clock);\n    console.log(\"stop.\");\n  }\n\
    }, 200);\n```\n\n# Debouncing\n\nSome types of events have the potential to fire\
    \ rapidly, many times in a row (the \"mousemove\" and \"scroll\" events, for example).\
    \ When handling such events, you must be careful not to do anything too time-consuming\
    \ or your handler will take up so much time that interaction with the document\
    \ starts to feel slow.\n\nIf you need to do something nontrivial in such a handler,\
    \ you can use setTimeout to make sure you are not doing it too often. This is\
    \ usually called debouncing the event. There are several slightly different approaches\
    \ to this.\n\nIn the first example, we want to react when the user has used something,\
    \ but not to do it immediately for every input event. When they are typing quickly,\
    \ we just want to wait until a"
