  md: '# Persistent Data


    Data structures that don''t change are called immutable or persistent. They have
    a lot like strings and numbers in that they are who they are and stay that way,
    rather than containing different things at different times.


    In JavaScript, just everything can be changed, so working with values that are
    supposed to be persistent requires some restraint. There is a function Object.freeze
    that changes an object so that writing to its properties is ignored. You could
    use that to make sure your objects aren''t changed, if you want to be careful.
    Freezing does require the computer to do some extra work, and having updated frozen
    is just about as likely to confuse someone as having them the wrong thing. So
    I usually prefer to just tell people that a given object shouldn''t be messed
    with and hope they remember.


    ```

    let object = Object.freeze({value: 5});

    object.value = 10;

    console.log(object.value);

    // → 5

    ```


    Why am I going out of my way to not change objects when the language is obviously
    expecting me to?


    Because it helps me understand my programs. This is about complexity management
    again. When the objects in my system are fixed, stable things, I can consider
    operations on them in isolation—moving to Alice''s house from a given state always
    produces the same new state. When objects change over time, that adds a whole
    new dimension of complexity to this kind of reasoning.


    For a small system like the one we are building in this chapter, we could handle
    that bit of extra complexity. But the most important limit on what kind of systems
    we can build is how much we can understand. Anything makes your code easier to
    understand makes it possible to build a more ambitious system.


    Unfortunately, although understanding a system built on persistent data structures
    is easier, designing one, especially when your programming language isn''t helping,
    can be a little harder. We''ll look for opportunities to use persistent data structures
    in this book, but we''ll also be using changeable ones.


