  md: '# Overriding Derived Properties


    When you add a property to an object, whether it is present in the prototype or
    not, the property is added to the object *itself*. If there was a property with
    the same name in the prototype, this property will no longer affect the object,
    as it is now hidden behind the object’s own property.


    ```

    Rabbit.prototype.teeth = "small"

    console.log(killerRabbit.teeth);

    // small

    killerRabbit.teeth = "long, sharp, and bloody";

    console.log(killerRabbit.teeth);

    // long, sharp, and bloody

    console.log(blackRabbit.teeth);

    // small

    console.log(Rabbit.prototype.teeth);

    // small

    ```


    The following diagram sketches the situation after this code has run. The Rabbit
    and Object prototypes lie behind killerRabbit as a kind of backdrop, where properties
    that are not found in the object itself can be looked up.


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_109_0.png)


    Overriding properties that exist in a prototype can be a useful thing to do. As
    the rabbit teeth example shows, overriding can be used to express exceptional
    properties in instances of a more generic class of objects, while letting the
    nonexceptional objects take a standard value from their prototype.


    Overriding is also used to give the standard function and array prototypes a different
    toString method than the basic object prototype.


    ```

    console.log(Array.prototype.toString ==

    Object.prototype.toString());

    // false

    console.log([1, 2].toString());

    // 1,2

    ```'
