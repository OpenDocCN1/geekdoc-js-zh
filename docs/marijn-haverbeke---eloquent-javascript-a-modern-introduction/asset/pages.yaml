    file.txt).\n\nWe'll build the program by piece, using an object called methods\
    \ to store the functions that handle the various HTTP methods. Method handlers\
    \ are async functions that get the request object as argument and return a response\
    \ that resolves to an object that describes the response.\n\n```\nconst createServer\
    \ = require(\"http\");\n\nconst methods = Object.create(null);\n\ncreateServer((request,\
    \ response) => {\n  let handler = methods[request.method] || notAllowed;\n  handler(request)\n\
    \    .catch(error => {\n      if (error.status != null) return error;\n      return\
    \ ({body: String(error), status: 500});\n    })\nn    .then(({body, status = 200,\
    \ type = \"text/plain\"}) => {\n      response.writeHead(status, {\"Content-Type\"\
    : type});\n      if (body && body.pipe) body.pipe(response);\n      else response.end(body);\n\
    \    });\n}).listen(8080);\n\nasync function notAllowed(request) {\n  return {\n\
    \    status: 405,\n    body: `Method ${request.method} not allowed.`\n  };\n}\n\
    ```\n\nThis starts a server that returns 405 error responses, which is the code\
    \ used to indicate that the server refuses to handle a given method.\n\nWhen a\
    \ request handler's promise is rejected, the catch call translates the error into\
    \ a response object, if it isn't one already, so that the server can send back\
    \ an error response to inform the client that it failed to handle the request.\n\
    \nThe status field of the response description can be omitted, in which case it\
    \ defaults to 200 (OK). The content type, in the type property, can also be left\
    \ off, in which case the response is assumed to be plain text.\n\nWhen the value\
    \ of body is a readable stream, it will have a pipe method that is used to forward\
