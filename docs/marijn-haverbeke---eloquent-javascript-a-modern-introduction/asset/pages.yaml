    \ transform style.\n\nBut we'll be using the DOM for something it wasn't originally\
    \ designed for. Some tasks, such as drawing a line between arbitrary points, are\
    \ extremely awkward to do with regular HTML elements.\n\nThere are two alternatives.\
    \ The first is DOM-based and utilizes Scalable Vector Graphics (SVG), rather than\
    \ HTML. Think of SVG as a document-markup dialect that focuses on shapes rather\
    \ than text. You can embed an SVG document directly in an HTML document or include\
    \ it with `<img>` tag.\n\nThe second alternative is called a *canvas*. A canvas\
    \ is a single DOM element that encapsulates a picture. It provides a programming\
    \ interface for drawing shapes onto the space taken up by the node. The main difference\
    \ between a canvas and an SVG picture is in SVG the original description of the\
    \ shapes is preserved so that they can be moved or resized at any time. A canvas,\
    \ on the other hand, converts the shapes to pixels (colored dots on a raster)\
    \ as soon as they are drawn and does not remember what these pixels represent.\
