  md: "# # 13\n JAVASCRIPT AND THE BROWSER\n\nThe next chapters of this book will\
    \ talk about web browsers. Without web browsers, there would be no JavaScript.\
    \ Or even if there were, no one would ever have paid any attention to it.\n\n\
    Web technology has been decentralized from the start, not just technically but\
    \ also in the way it evolved. Various browser vendors have added new functionality\
    \ in ad hoc and sometimes poorly thought-out ways, which then, sometimes, ended\
    \ up being adopted by others—and finally set down as standards.\n\nThis is both\
    \ a blessing and a curse. On the one hand, it is empowering to not have a central\
    \ party control system but could be improved by various parties working in loose\
    \ collaboration (or occasionally open hostility). On the other hand, the haphazard\
    \ way in which the web was developed means the resulting system is not a shining\
    \ example of internal consistency. Some parts of it are downright confusing and\
    \ poorly conceived.\n\n# ## Networks and the Internet\n\nComputer networks have\
    \ been around since the 1950s. If you put cables between two or more computers\
    \ and allow them to send data back and forth through these cables, you can do\
    \ all kinds of wonderful things.\n\nAnd if connecting two machines in the same\
    \ building allows us to do wonderful things, connecting machines all over the\
    \ planet should be de even better. The technology to start implementing this vision\
    \ was developed in the 1980s, and the resulting network is called the Internet.\
    \ It has lived up to its promise.\n\nA computer can use this network to shoot\
    \ bits at another computer. For any effective communication to arise out of this\
    \ bit-shooting, the computers on both ends must know what the bits are supposed\
    \ to represent. The meaning of any sequence of bits depends entirely on the kind\
    \ of thing that it is trying to express and on the encoding mechanism used.\n\n\
    A network protocol describes a style of communication over a network. There are\
    \ protocols for sending email, for fetching email, for sharing files, and for\
    \ controlling computers that have to be infected by malicious software.\n\nFor\
    \ example, the Hypertext Transfer Protocol (HTTP) is a protocol for retrieving\
    \ named resources (chunks of information, as web pages or pictures). It specifies\
    \ that the side making the request should start with a line like this, naming\
    \ the resource and the version of the protocol that it is trying to use:\n\n```\n\
    GET /index.html HTTP/1.1\n```"
