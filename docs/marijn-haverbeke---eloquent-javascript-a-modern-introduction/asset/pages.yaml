    # Profiling


    We were able to speed up the program quite a bit by reasoning about it. But when
    it comes micro-optimization—the process of doing things slightly differently to
    make them faster—it is usually hard to predict which will help and which won''t.
    We can no longer rely on reasoning—we have to observe.


    Our runLayout function measures the time the program currently takes. That''s
    a good start. To improve something, you must measure it. Without measuring, you
    have no way of knowing whether your changes are the effect you intended.


    The developer tools in modern browsers provide an better way to measure the speed
    of your program. This tool is called a profiler. It will, while a program is running,
    gather information about the time used by the various parts of the program.


    If your browser has a profiler, it will be available from the developer tool interface,
    probably on a tab called Performance. The profiler in Chrome spits out the following
    table when I record 4,000 iterations of our current program:


