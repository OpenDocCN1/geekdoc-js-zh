    # Maps


    We saw the word map used in “Transforming with Map” on page 88 for an operation
    that transforms a data structure by applying a function to its elements. Confusing
    as it is, in programming the same word is also used for a related but rather different
    thing.


    A map (noun) is a data structure that associates values (keys) with other values.
    For example, you might want to map names to ages. It is possible to use objects
    for this.


    ```

    let ages = {

    Boris: 39,

    Liang: 22,

    Julia: 62

    };


    console.log(`${ages["Julia"]}\`);

    // → Julia is 62

    console.log("Is Jack''s age known?", "Jack" in ages);

    // → Is Jack''s age known? false

    console.log("Is toString''s age known?", "toString" in ages);

    // → Is toString''s age known? true

    ```


    Here, the object property names are the people''s names, and the property values
    are their ages. But we certainly didn''t list anything named toString in our map.
    Yet, because plain objects derive from Object.prototype, it looks like the property
    is there.


    As such, using plain objects as maps is dangerous. There are several possible
    ways to avoid this problem. First, it is possible to create objects with no prototype.
    If you pass null to Object.create, the resulting object will not derive from Object.prototype
    and can safely be used as a map.


    ```

    console.log("toString" in Object.create(null));

    // → false

    ```


    Object property names must be strings. If you need a map whose keys can''t easily
    be converted to strings—such as objects—you cannot use an object as your map.


    Fortunately, JavaScript comes with a class called Map that is written for this
    exact purpose. It stores a mapping and allows any types of keys.


    ```

    let ages = new Map();

    ages.set("Boris", 39);\ages.set("Liang", 22);

    ```'
