- img_proc: true
  md: "pacurs. Instead of immediately performing an action in the event handler, we\
    \ set a timeout. so that when events occur close together (closer than our timeout\
    \ delay), the timeout from the previous event is canceled.\n\n```\n<textarea>Type\
    \ something here...</textarea>\n<script>\nlet textarea = document.querySelector(\"\
    textarea\");\nlet timeout;\ntextarea.addEventListener(\"input\", () => {\n  clearTimeout(timeout);\n\
    \  timeout = setTimeout(() => console.log(\"Typed!\"), 500);\n});\n</script>\n\
    ```\n\nGiving an undefined value to clearTimeout or calling it on a timeout that\
    \ has already fired has no effect. Then we don't have to be careful about when\
    \ to call it, and we simply do so for every event.\n\nWe can use a slightly different\
    \ pattern if we want to space responses so that they are separated by at least\
    \ a certain length of time but want to fire them *during* a series of events,\
    \ not just afterward. For example, we might want to respond to \"mousemove\" events\
    \ by showing the current coordinates of the mouse only every 250 milliseconds.\n\
    \n```\n<script>\nlet scheduled = null;\nwindow.addEventListener(\"mousemove\"\
    , event => {\n  if (!scheduled) {\n    setTimeout(() => {\n      document.body.textContent\
