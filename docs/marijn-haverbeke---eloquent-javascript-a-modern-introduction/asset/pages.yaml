  md: '# 11

    ASYNCHRONOUS PROGRAMMING


    The central part of a computer, the part that carries out the individual steps
    that make up our programs, is called the processor. The programs we have seen
    so far are things that will keep the processor busy until they have finished their
    work. The speed at which something like a loop that manipulates numbers can be
    executed pretty much entirely on the speed of the processor.


    But many programs interact with things outside of the processor. For example,
    they may communicate over a computer network or request data from the hard disk—which
    is a lot slower than getting it from memory.


    When such a thing is happening, it would be a shame to let the processor sit idle—there
    might be other work it could do in the meantime. In part, this is handled by your
    operating system, which will switch the processor between multiple running programs.
    But that doesn''t help when we want a single program to be able to make progress
    while it is waiting for a network request.


    # Asynchronicity


    In a synchronous programming model, things happen one at a time. When you call
    a function that performs a long-running action, it returns only when the action
    has finished and it can return the result for the time the action takes.


    An asynchronous model allows multiple things to happen at the same time. When
    you start an action, your program continues to run. When the action finishes,
    the program is informed and gets access to the result (for example, the data read
    from disk).


    We compare synchronous and asynchronous programming using a small example: a program
    that fetches two resources from the network and then combines results.


    In a synchronous environment, where the request function returns only after it
    has done its work, the easiest way to perform this task is to make the requests
    one after the other. This has the drawback that the second request will be started
    only when the first has finished. The total time taken will be at least the sum
    of the two response times.


    The solution to this problem, in a asynchronous system, is to start additional
    threads of control. A thread is another running program whose execution may be
    interleaved with other programs by the operating system—since most modern computers
    contain multiple processors, threads may even run at the same time, on different
    processors. A second thread could start the second request, and then both threads
    wait for their results to come back, after which resynchronize to combine their
    results.


    In the following diagram, the thick lines represent time the program running normally,'
