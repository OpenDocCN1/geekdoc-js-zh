  md: "A property like speak(line) in an object expression is a shorthand for defining\
    \ a method. It creates a property called speak and gives it a function as its\
    \ value.\n\nThe “proto” rabbit acts as a container for the properties that are\
    \ shared by all rabbits. An individual rabbit, like the killer rabbit, contains\
    \ properties that apply only to itself—in this case its type—and derives shared\
    \ properties from its prototype.\n\n# # Classes\n\nJavaScript’s prototype system\
    \ can be interpreted as a somewhat informal take on an object-oriented concept\
    \ called classes. A class defines the shape of a type of object—what methods and\
    \ properties it has. Such an object is called an instance of the class.\n\nPrototypes\
    \ are useful for defining properties for which all instances of a class share\
    \ the same value, such as methods. Properties that differ per instance, such as\
    \ our rabbits’ type property, need to be stored directly in the objects themselves.\n\
    \nSo to create an instance of a given class, you have to make an object that derives\
    \ from the proper prototype, and you also have to make sure itself, has the properties\
    \ that instances of this class are supposed to have. This is what a constructor\
    \ function does.\n\n```\nfunction makeRabbit(type) {\n  let rabbit = Object.create(protoRabbit);\n\
    \  rabbit.type = type;\n  return rabbit;\n}\n```\n\nJavaScript provides a way\
    \ to make defining this type of function easier. If you put the keyword new in\
    \ front of a function call, the function is treated as a constructor. This means\
    \ that an object with the right prototype is automatically created, bound to this\
    \ function, and returned at the end of the function.\n\nThe prototype object used\
    \ when constructing objects is found by taking the prototype property of the constructor\
    \ function.\n\n```\nfunction Rabbit(type) {\n  this.type = type;\n}\nRabbit.prototype.speak\
    \ = function(line) {\n  console.log(`${this.type} rabbit says '${line}'`);\n}\n\
    ```\n\n```\nlet weirdRabbit = new Rabbit('weird');\n```\n\nConstructors (all functions,\
    \ in fact) automatically get a property named prototype, which by default holds\
    \ a plain, empty object that derives from object.prototype. You can overwrite\
    \ it with a new object if you want. Or you can add properties to the existing\
    \ object, as the example does.\n\nBy convention, the names of constructors are\
    \ capitalized so that they can be easily distinguished from other functions."
