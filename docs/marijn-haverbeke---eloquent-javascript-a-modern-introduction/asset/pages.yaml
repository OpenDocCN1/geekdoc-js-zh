    # # A Space on the Web


    Since the file server serves any kind of file and even includes the right Content-Type
    header, you can use it to serve a website. Since it allows everybody to delete
    and replace files, it would be an interesting kind of website: one that can be
    modified, improved, and vandalized by everybody who takes the time to create the
