    PROJECT: A PIXEL ART EDITOR


    The material from the previous chapters gives you all the elements you need to
    build a basic web application. In this chapter, we will just do that.


    Our application will be a pixel-drawing program, where you can modify a picture
    pixel-by-pixel by manipulating a zoomed-in view of it, shown as a grid of colored
    squares. You can use the program to open image files, scribble on them with your
    mouse or other pointer device, and save them. This is what it will look like:


    ![](img/97d87cd11217c72da8728e5e1ce1e6d1_307_0.png)


    Painting on a computer is great. You don''t need to worry about materials, skill,
    or talent. You just start smearing.


    # Components


    The interface for the application shows a big <canvas> element on top, with a
    number of form fields below it. The user draws on the picture by selecting a tool
    from a <select> field and then clicking, touching, or dragging across the canvas.
    There are tools for drawing single pixels or rectangles, for filling an area,
    and for picking a color from the picture.


    We structure the editor interface as a number of components, objects that are
    responsible for a piece of the DOM and may contain other components inside them.


    The state of the application consists of the current picture, the selected tool,
    and the selected color. We''ll set things so that the state lives in a single
    value, and the interface components always base the way they look on the current
    state.


    To see why this is important, let''s consider the alternative—distributing pieces
    of state throughout the interface. Up to a certain point, this is easier to program.
    We can just put in a color field and read its value when we need to know the current
    color.


    But then we add the color picker—tool that lets you pick the picture to select
    the color of a'
