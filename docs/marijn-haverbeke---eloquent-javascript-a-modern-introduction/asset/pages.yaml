  md: "JavaScript uses a convention where month numbers start at zero (so December\
    \ is 11), yet day numbers start at one. This is confusing and silly. Be careful.\n\
    \nThe last four arguments (hours, minutes, seconds, and milliseconds) are optional\
    \ and taken to be zero when not given.\n\nTimestamps are stored as the number\
    \ of milliseconds since the start of 1970, in the UTC time zone. These follow\
    \ a convention set by “Unix time,” which was invented around that time. You can\
    \ use negative numbers for times before 1970. The getTime method on a date object\
    \ returns the number. It is big, as you can imagine.\n\n```\nconsole.log(new Date(2013,\
    \ 11, 19).getTime());\n// 1387047600000\nconsole.log(new Date(1387047600000));\n\
    // Thu Dec 19 2013 00:00:00 GMT+0100 (CET)\n```\n\nIf you give the Date constructor\
    \ a single argument, that argument is treated as a millisecond count. You can\
    \ get the current millisecond count by creating a new Date object and calling\
    \ getTime on it or by calling the Date.now function.\n\nDate objects provide methods\
    \ such as getFullYear, getMonth, getDate, getHours, getMinutes, and extract their\
    \ components. Besides getFullYear there’s also getYear, which gives you the year\
    \ minus 1900 (or 98 or 119) and is mostly useless.\n\nPutting parentheses around\
    \ the parts of the expression that we are interested in, we can now create a date\
    \ object from a string.\n\n```\nfunction getdate(string) {\n  let [, month, day,\
    \ year] = /(\\d+)-(\\d+)-(\\d+)/.exec(string);\n  return new Date(year, month\
    \ - 1, day);\n}\nconsole.log(getdate(\"1-30-2003\"));\n// Thu Jan 30 2003 00:00:00\
    \ GMT+0100 (CET)\n```\n\nThe _ (underscore) binding is ignored and used only to\
    \ skip the full match element returned by exec.\n\n# Word and String Boundaries\n\
    \nUnfortunately, getdate will also extract the nonsensical date 00-1-3000 from\
    \ the string \"100-1-30000\". A match may happen anywhere in the string, so in\
    \ this case, it’ll start at the second character and end at the second-to-last\
    \ character.\n\nIf we want to enforce that the match must span the whole string,\
    \ we can add the markers ^ and $. The caret matches the start of the input string,\
    \ whereas the dollar sign matches the end. So, /^^\\d+$/ matches a string consisting\
    \ entirely of one or more digits; /^\\!/ matches any string that starts with an\
    \ exclamation mark, and /\\x/ does not match any string (there cannot be an x\
    \ before the start of the string)."
