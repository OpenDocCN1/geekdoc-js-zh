    \ let via = findRoute(nest.name, target,\n      nest.state.connections);\n   \
    \ if (!via) throw Error(`No route to ${target}`);\n    return routeRequest(nest,\
    \ via, \"route\",\n      {target, type, content});\n  }\n}\n```\n\n```\nrequestType(\"\
    route\", nest, {target, type, content}) => {\n  return routeRequest(nest, target,\
