  md: "the robot's current location and the collection of undelivered parcels, each\
    \ of which has a current location and a destination address. That's it.\n\nAnd\
    \ while we are here, let's make it so that we don't change this state when the\
    \ robot moves but rather compute a new state for the situation after the move.\n\
    \n```\nclass VillageState {\n  constructor(place, parcels) {\n    this.place =\
    \ place;\n    this.parcels = parcels;\n  }\n\n  move(destination) {\n    if (!roadGraph[this.place].includes(destination))\
    \ {\n      return this;\n    } else {\n      let parcels = this.parcels.map(p\
    \ => {\n        if (p.place != this.place) return p;\n        return (place: destination,\
    \ address: p.address);\n      }).filter(p => p.place == p.address);\n      return\
    \ new VillageState(destination, parcels);\n    }\n  }\n}\n```\n\nThe move method\
    \ is where the action happens. It first checks whether there is a road going from\
    \ the current place to the destination, and if not, it returns the old state since\
    \ this is not a valid move.\n\nThen it creates a new state with the destination\
    \ as the robot's new place. It also needs to create a new set of parcels—parcels\
