    \ it should append itself and a level object.\n\n```\nclass DOMDisplay {\n  constructor(parent,\
    \ level) {\n    this.dom = elt('div', {class: \"game\"}, drawGrid(level));\n \
    \   this.actorLayer = null;\n    parent.append(this.dom);\n  }\n\n  clear() {\
