    We can use this functionality as a way to fall back on a default value. If you
    have a value that might be empty, you can put || it with a replacement value.
    If the initial value can be converted to false, you''ll get the replacement instead.
    The rules for converting strings and Boolean values state that 0, NaN, and the
    empty string ("") count as false, while all the other values count as true. So
    || -1 produces -1, and "" || "!?" yields ""


    The && operator works similarly but the other around. When the value to its left
    is something that converts to false, it returns that value, and otherwise it returns
    the value on its right.


    Another important property of these two operators is that the part to right is
    evaluated only when necessary. In the case of || x, no matter what x is—even if
    it''s a piece of program that does something terrible—the result will be true,
    and x is never evaluated. The same goes for false && x, which is false and will
    ignore x. This is called short-circuit evaluation.


    The conditional operator works in a similar way. Of the second and third values,
    only the one that is selected is evaluated.


    # Summary


