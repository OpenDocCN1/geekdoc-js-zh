  md: "# Indenting Code\n\nIn the examples, I've adding spaces—front of statements\
    \ that are part of some larger statement. These spaces are not required—the computer\
    \ will accept the program just fine without them. In fact, even the line breaks\
    \ in programs are optional. You could write a program as a single long line if\
    \ you felt like it.\n\nThe role of this indentation inside blocks is to make the\
    \ structure of the code stand out. In code where new blocks are opened inside\
    \ other blocks, it can become hard to see where one block ends and another begins.\
    \ With proper indentation, the visual shape of a program corresponds to the shape\
    \ of the blocks inside it. I like to use two spaces for every open block, but\
    \ tastes differ—some people use four spaces, and some people use tab characters.\
    \ The important thing is that each new block adds the same amount of space.\n\n\
    ```\nif (false != true) {\n  console.log(\"That makes sense.\");\n  if (1 < 2)\
    \ {\n    console.log(\"No surprise there.\");\n  }\n}\n```\n\nMost code editor\
    \ programs will help by automatically indenting new lines the proper amount.\n\
    \n# for Loops\n\nMany loops follow the pattern shown in the while examples. First\
    \ a “counter” binding is created to track the progress of the loop. Then comes\
    \ a while loop, usually with a test expression that checks whether the counter\
    \ has reached its end value. At the end of the loop body, the counter is updated\
    \ to track progress.\n\nBecause this pattern is so common, JavaScript and similar\
    \ languages provide a slightly shorter and more comprehensive form, for the loop.\n\
    \n```\nfor (let number = 0; number <= 12; number = number + 2) {\n  console.log(number);\n\
    }\n```\n\n```\n// --> 0\n// --> 2\n// ... etc\n```\n\nThis program is exactly\
    \ equivalent to the earlier even-number-printing example (page 30). The only change\
    \ is that all the statements that are related to the “state” of the loop are grouped\
    \ together after for.\n\nThe parentheses after a for keyword must contain two\
    \ semicolons. The first part before the semicolon initializes the loop, usually\
    \ by defining a binding. The second part is the expression that checks whether\
    \ the loop must continue. The final part updates the state of the loop after every\
    \ iteration. In most cases, this is shorter and clearer than a while construct."
