  md: 'are a way to deal with the fact that packages evolve separately, and code written
    to work with a


    package as it existed at one point may not work with a later, modified version
    of the package.


    NPM demands that its packages follow a schema called *semantic versioning*, which
    encodes some


    information about which versions are *compatible* (don’t break the old interface)
    in the version


    number. A semantic version consists of three numbers, separated by periods, such
    as `2.3.0`. Every


    time new functionality is added, the middle number has to be incremented.


    Every time compatibility is broken, so that existing code that uses the package
    might not work


    with the new version, the first number has to be incremented.


    A caret character (`^`) in front of the version number for a dependency in `package.json`
    indicates that


    any version compatible with the given number may be installed. So, for example,
    `"^2.3.0"` would


    mean that any version greater than or equal to 2.3.0 and less than 3.0.0 is allowed.


    The `npm` command is also used to publish new packages or new versions of packages.
    If you run `npm`


    `publish` in a directory that has a `package.json` file, it will publish a package
    with the name and version


    listed in the JSON file to the registry. Anyone can publish packages to NPM—though
    only under a


    package name that isn’t in use yet, since it would be somewhat scary if random
    people could update


    existing packages.


    Since the `npm` program is a piece of software that talks to an open system—the
    package registry—


    there is nothing unique about what it does. Another program, `yarn`, which can
    be installed from the


    NPM registry, fills the same role as `npm` using a somewhat different interface
    and installation strategy.


    This book won’t delve further into the details of NPM usage. Refer to *https://npmjs.org*
    for


    further documentation and a way to search for packages.


    **The File System Module**


    One of the most commonly used built-in modules in Node is the `fs` module, which
    stands for *file*


    *system*. It exports functions for working with files and directories.


    For example, the function called `readFile` reads a file and then calls a callback
    with the file’s


    contents.


    `let {readFile} = require("fs");`


    `readFile("file.txt", "utf8", (error, text) => {`


    `if (error) throw error;`


    `console.log("The file contains:", text);`


    `});`


    The second argument to `readFile` indicates the *character encoding* used to decode
    the file into a


    string. There are several ways in which text can be encoded to binary data, but
    most modern systems


    use UTF-8\. So unless you have reasons to believe another encoding is used, pass
    `"utf8"` when


    reading a text file. If you do not pass an encoding, Node will assume you are
    interested in the binary


    data and will give you a `Buffer` object instead of a string. This is an array-like
    object that contains


    numbers representing the bytes (8-bit chunks of data) in the files.'
