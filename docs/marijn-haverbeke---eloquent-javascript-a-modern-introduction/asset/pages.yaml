  md: "```\nwindow.addEventListener(\"touchmove\", update);\nwindow.addEventListener(\"\
    touchend\", update);\n</script>\n```\n\nYou'll want to call preventDefault in\
    \ touch event handlers to override the browser's default behavior (which may include\
    \ scrolling the page on swiping) and to prevent the mouse events from being fired,\
    \ for which you may also have a handler.\n\n# Scroll Events\n\nWhenever an element\
    \ is scrolled, a \"scroll\" event is fired on it. This has various uses, such\
    \ as knowing what the user is currently looking at (for disabling off-screen animations\
    \ or sending spy reports to your evil headquarters) or showing some indication\
    \ of progress (by highlighting part of a table of contents or showing a page number).\n\
    \nThe following example draws a progress bar above the document and updates it\
    \ to fill up as you scroll down:\n\n```\n<style>\n#progress {\n  border-bottom:\
    \ 2px solid blue;\n  width: 0;\n  position: fixed;\n  top: 0; left: 0;\n}\n</style>\n\
    <div id=\"progress\"></div>\n<script>\n// Create some content\ndocument.body.appendChild(document.createElement(\"\
    supercalifragilisticexpialidocious\".repeat(1000)));\nlet bar = document.querySelector(\"\
    #progress\");\nwindow.addEventListener(\"scroll\", () => {\n  let max = document.body.scrollHeight\
    \ - innerHeight;\n  bar.style.width = `${(pageYOffset / max) * 100}%`;\n});\n\
    </script>\n```\n\nGiving an element a position of fixed acts like an absolute\
    \ position but also prevents it from scrolling along the rest of the document.\
    \ The effect is to make our progress bar stay at the top. Its width is changed\
    \ to indicate the current progress. We use %,, rather than px, as a unit when\
    \ setting the width so that the element is sized relative to the page width.\n\
    \nThe global innerHeight gives us the height of the window, which we have to subtract\
    \ from the total scrollable height—you can't keep scrolling when you hit the bottom\
    \ of the document. There is also an innerWidth for the window width. By dividing\
    \ pageOffset, the current scroll position, by the maximum scroll position and\
    \ multiplying by 100, we get the percentage for the progress bar.\n\nCalling preventDefault\
    \ on a scroll event does not prevent the scrolling from happening. In fact, the\
    \ event handler is called only after the scrolling takes place."
