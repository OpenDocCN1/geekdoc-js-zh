    for example, want to


    show the square of the input only if the input is actually a number.


    `let theNumber = Number(prompt("Pick a number"));`


    `if (!Number.isNaN(theNumber)) {`


    `console.log("Your number is the square root of " +`


    `theNumber * theNumber);`


    `}`


    With this modification, if you enter “parrot,” no output is shown.


    The `if` keyword executes or skips a statement depending on the value of a Boolean
    expression.


    The deciding expression is written after the keyword, between parentheses, followed
    by the


    statement to execute.


    The `Number.isNaN` function is a standard JavaScript function that returns `true`
    only if the argument it


    is given is `NaN`. The `Number` function happens to return `NaN` when you give
    it a string that doesn’t


    represent a valid number. Thus, the condition translates to “unless `theNumber`
    is not-a-number, do


    this.”


    The statement after the `if` is wrapped in braces (`{` and `}`) in this example.
    The braces can be used


    to group any number of statements into a single statement, called a *block*. You
    could also have


    omitted them in this case, since they hold only a single statement, but to avoid
    having to think about


    whether they are needed, most JavaScript programmers use them in every wrapped
    statement like


    this. We’ll mostly follow that convention in this book, except for the occasional
    one-liner.


    `if (1 + 1 == 2) console.log("It''s true");`


    `//` → `It''s true`


    You often won’t just have code that executes when a condition holds true, but
    also code that


    handles the other case. This alternate path is represented by the second arrow
