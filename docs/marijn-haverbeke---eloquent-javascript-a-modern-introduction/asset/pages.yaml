    # Encapsulation as a Burden


    Most of the code in this chapter does not worry about encapsulation very much,
    for two reasons. First, encapsulation takes extra effort. It makes programs bigger
    and requires additional concepts and interfaces to be introduced. Since there
    is so much code you can throw at a reader before their eyes glaze over, I''ve
    made an effort to keep the program small.


    Second, the various elements in this game are so closely tied together that if
    the behavior of one of them changed, it is unlikely that any of the others would
    be able to stay the same. Interfaces between the elements would end up encoding
    a lot of assumptions about the way the game works. This makes them a lot less
    effective—whenever you change part of the system, you still have to worry about
    the way it impacts the other parts because their interfaces wouldn''t cover the
    new situation.


    Some cutting points in a system level lend themselves to separation through rigorous
    interfaces, but others dont. Trying to encapsulate something that isn''t a suitable
    boundary is a sure way to waste a lot of energy. When you are making this mistake,
    you''ll notice that your interfaces are getting awkwardly large and detailed that
    they need to be changed often as the program evolves.


    There is one thing that we will encapsulate, and that is the drawing subsystem.
    The reason for this is that we will display the same game in a different way in
    the next chapter. By putting the drawing behind an interface, we can load the
    same game program and plug in a new display module.


    # Drawing


    The encapsulation of the drawing code is done by defining a display object, which
    displays a level and state. The display type we define in this chapter is called
    display because it uses DOM elements to show the level.


    We''ll be using a style sheet to set the actual colors and other fixed properties
    of the elements that make up the game. It would also be possible to directly assign
    these to the elements'' style property when we create them, but that would produce
    more verbose programs.


    The following helper function provides a succinct way to create an element and
    give it some attributes and child nodes:'
