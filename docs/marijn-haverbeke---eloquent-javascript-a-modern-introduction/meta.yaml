  md: "To explicitly handle rejections, promises have a catch method that registers\
    \ a handler to be called when the promise is rejected, similar to how handlers\
    \ handle normal resolution. It's also very much like then that it returns a new\
    \ promise, which resolves to the original promise's value if it resolves normally\
    \ and the result of the catch handler otherwise. If a catch handler throws an\
    \ error, the new promise is also rejected.\n\nAs a shorthand, it also accepts\
    \ a rejection handler as a second argument, you can install both types of handlers\
    \ in a single method call.\n\nA function passed to the Promise constructor receives\
    \ a second argument, alongside the resolve function, which it can use to reject\
    \ the new promise.\n\nThe chains of promises created by calls to then can be seen\
    \ as a pipeline through which asynchronous values or failures move. Since such\
    \ chains are created by registering handlers, each link has a success handler\
    \ or a rejection handler (or both) associated with it. Handlers that don't match\
    \ the type of outcome (success or failure) are ignored. But those that do are\
    \ called, and their outcome determines which kind of value comes next—when it\
    \ returns a non-promise value, when it throws an exception, and the outcome of\
    \ a promise when it returns one of those.\n\n```\nnew Promise((, , reject) =>\
    \ reject(new Error(\"Fail\"))\n.then(value => console.log(\"Handler 1\"))\n.catch(reason\
    \ => {\n  console.log(\"Caught failure \" + reason);\n  return \"nothing\";\n\
    })\n.then(value => console.log(\"Handler 2\", value));\n// // Caught failure Error:\
    \ Fail\n// // Handler 2 nothing\n```\n\nMuch like an uncaught exception is handled\
    \ by the environment, JavaScript environments can detect when a promise rejection\
    \ isn't handled and will report this as an error.\n\n# Networks Are Hard\n\nOccasionally,\
    \ there isn't enough light for the crows' mirror systems to transmit a signal,\
    \ or something is blocking the path of the signal. It is possible for a signal\
    \ to be sent but never received.\n\nAs it is, that will just cause the callback\
    \ given to send to never be called, which will probably cause the program to stop\
    \ without even noticing there is a problem. It would be nice, after a period of\
    \ not getting a response, a request would time out and report failure.\n\nOften,\
    \ transmission failures are random accidents, like a car's headlight interfering\
    \ with the light signals, and simply retrying the request may cause it to succeed.\
    \ While we're at it, let's make our request function automatically retry the sending\
    \ of the request a few times before it gives up.\n\nAnd, since we've established\
    \ that promises are a good thing, we'll also make our request function return\
    \ a promise. In terms of what they can express, callbacks and promises are equivalent.\
    \ Callback-"
