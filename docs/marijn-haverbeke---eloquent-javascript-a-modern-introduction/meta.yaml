    \ the program and pass that, along with the object for the expression, to parseApply,\
    \ which checks whether the expression is an application. If so, it parses a parenthesized\
    \ list of arguments.\n\n```\nfunction parseApply(expr, program) {\n  program =\
    \ skipSpace(program);\n  if (program[0] != \"(\") {\n    return {expr: expr, rest:\
    \ program};\n  }\n\n  program = skipSpace(program.slice(1));\n  expr = {type:\
