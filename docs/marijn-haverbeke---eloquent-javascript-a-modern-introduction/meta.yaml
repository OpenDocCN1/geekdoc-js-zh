  md: "Types, provide a useful framework for talking about programs. A lot of mistakes\
    \ come from being confused about the kind of value that comes out or of functions.\
    \ If you have information written down, you're less likely to get confused.\n\n\
    You could add a comment like the following before the goalOrientedRobot function\
    \ from the previous chapter to describe its type:\n\n```\n// (villageState, Array)\
    \ (direction: string, memory: Array)\nfunction goalOrientedRobot(state, memory)\
    \ {\n  // ...\n}\n```\n\nThere are a number of different conventions for annotating\
    \ JavaScript programs with types. One thing about types is that they need to introduce\
    \ their own complexity to be able to describe enough code to be useful. What do\
    \ you think would be the type of the randomPick function that returns an element\
    \ from any array? You'd need to introduce a type variable, T, which can stand\
    \ in any type, so that you can give randomPick a type like ([T]) → τ (function\
    \ from an array of T's to T).\n\nWhen the types of a program are known, it's possible\
    \ for the computer to check for you, pointing out mistakes before the program\
    \ is run. There are several JavaScript dialects that add types to the language\
    \ and check them. The most popular one is called TypeScript. If you are interested\
    \ in adding more rigor to your programs, I recommend you giving it a try.\n\n\
    In this book, we'll continue using raw, dangerous, untyped JavaScript code.\n\n\
