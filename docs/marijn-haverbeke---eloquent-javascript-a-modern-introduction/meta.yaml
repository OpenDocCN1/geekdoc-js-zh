  md: "# # Testing for Matches\n\nRegular expression objects have a number of methods.\
    \ The simplest one is test. If you pass a string, it will return a Boolean telling\
    \ you whether the string contains a match of the pattern in the expression.\n\n\
    ```\nconsole.log(/abc/..test(\"abcde\\)); //\n // true\nconsole.log(/abc/..test(\"\
    abxde\\)); //\n // false\n```\n\nA regular expression consisting of only nonspecial\
    \ characters simply represents that sequence of characters. If *abc* occurs anywhere\
    \ in the string we are testing against (not just at start), test will return true.\n\
    \n# # Sets of Characters\n\nFinding out whether a string contains *abc* could\
    \ just as well be done with a call to indexOf. Regular expressions allow us to\
    \ express more complicated patterns.\n\nSay we want to match any number. In a\
    \ regular expression, putting a set of characters between square brackets makes\
    \ that part of the expression match any of the characters between the brackets.\n\
    \nBoth of the following expressions match all strings that contain a digit:\n\n\
    ```\nconsole.log(/[0123456789]/.test(\"in 1992\")); //\n // true\nconsole.log(/[0-9]/.test(\"\
    in 1992\")); //\n // true\n```\n\nWithin square brackets, a hyphen (-) between\
    \ two characters can be used to indicate a range of characters, where the ordering\
    \ is determined by the character's Unicode number. Characters 0 to 9 sit right\
    \ next to each other in this ordering (codes 48 to 57), so *[0-9]* covers all\
    \ of them and matches any digit.\n\nA number of character groups have their own\
    \ built-in shortcuts. Digits are one of them:\n\n+   - *\\d Any digit character\n\
    - *\\w An alphanumeric character (“word character”)\n- *\\s Any whitespace character\
    \ (space, tab, newline, and similar)\n- *\\D A character that is not a digit\n\
