    \nBut this implementation has one problem: in typical JavaScript implementations,\
    \ it's about three times slower than the looping version. Running through a simple\
    \ loop is generally cheaper than calling a function multiple times.\n\nThe dilemma\
    \ of speed versus elegance is an interesting one. You can see it as a kind of\
    \ continuum between human-friendliness and machine-friendliness. Almost any program\
    \ can be made faster by making it bigger and more convoluted. The programmer has\
    \ to decide on an appropriate balance.\n\nIn the case of the power function, the\
    \ inelegant (looping) version is still fairly simple and easy to read. It doesn't\
    \ make much sense to replace it with the recursive version. Often, though, a program\
    \ deals with such complex concepts that giving up some efficiency in order to\
    \ make the program more straightforward is helpful.\n\nWorrying about efficiency\
    \ can be a distraction. It's yet another factor that complicates design, and when\
    \ you're doing something that's already difficult, extra thing to worry about\
    \ can be paralyzing.\n\nTherefore, always start by writing something that's correct\
    \ and easy to understand. If you're worried that it's too slow—which usually isn't\
    \ since most code isn't executed enough to take any significant amount of time—you\
    \ can measure and improve it if necessary.\n\nRecursion is not just an inefficient\
    \ alternative to looping. Some problems are easier to solve with recursion than\
