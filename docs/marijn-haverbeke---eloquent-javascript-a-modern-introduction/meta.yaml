  md: "```\nconsole.log(\"Right button\");\n}\n));\n</script>\n```\n\nThe information\
    \ stored in an event object differs per type of event. We'll discuss different\
    \ types later in the chapter. The object's type property always holds a string\
    \ identifying the event (such as \"click\" or \"mousedown\").\n\n# # Propagation\n\
    \nFor most event types, handlers registered on nodes with children will also receive\
    \ events that happen in the children. If a button inside a paragraph is clicked,\
    \ event handlers on the paragraph will also see the click event.\n\nBut if both\
    \ the paragraph and the button have a handler, the more specific handler—the one\
    \ on the button—gets to first. The event is said to propagate outward, from the\
    \ node where it happened to be node's parent node and to the root of the document.\
    \ Finally, after all handlers registered on a specific node had their turn, handlers\
    \ registered on the whole window get a chance to respond to the event.\n\nAt any\
    \ point, an event handler can call the stopPropagation method on the event object\
    \ to prevent handlers further up receiving the event. This can be useful, for\
    \ example, when you have a button inside another clickable element and you don't\
    \ clicks on the button to activate the outer element's click behavior.\n\nThe\
    \ following example registers \"mousedown\" handlers on both a button and the\
    \ paragraph around it. When clicked with the right mouse button, the handler for\
    \ the button calls stopPropagation, which will prevent the handler on the paragraph\
    \ from running. When the button is clicked with another mouse button, both handlers\
    \ will run.\n\n```\n<p>A paragraph with a <button>button</button></p>\n<script>\n\
    let para = document.querySelector(\"p\");\nlet button = document.querySelector(\"\
    button\");\npara.addEventListener(\"mousedown\", () => {\n  console.log(\"Handler\
    \ for paragraph.\");\n});\n\nbutton.addEventListener(\"mousedown\", event => {\n\
    \  console.log(\"Handler for button.\");\n  if (event.button == 2) event.stopPropagation();\n\
    });\n</script>\n```\n\nMost event objects have a target property that refers to\
    \ the node where they originated. You can use this property to ensure you're not\
    \ accidentally handling something that propagated up from a node you don't want\
    \ to handle.\n\nIt is also possible to use the target property to catch a wide\
    \ net for a specific type of event. For example, if you have a node containing\
    \ a long list of buttons, it may be more convenient to register"
