    you must add the current scroll position, which you can find in the pageOffset
    and pageOffset bindings.


    Laying out a document can be a lot of work. In the interest of speed, browser
    engines do not immediately re-layout a document every time you change it but wait
    as long as they can. When a JavaScript program that changed the document finishes
