  md: "# Array Loops\n\nIn the tablefor, there's a loop like:\n\n```\nfor (let i =\
    \ 0; i < JOURNAL.length; i++) {\nlet entry = JOURNAL[i];\n// Do something with\
    \ entry\n}\n```\n\nThis kind of loop is common in classical JavaScript—going over\
    \ arrays one element at a time is something that comes up a lot, and to do that\
    \ you'd run a counter over the length of the array and pick out each element in\
    \ turn.\n\nThere is a simpler way to write such loops in modern JavaScript.\n\n\
    ```\nfor (let entry of JOURNAL) {\nconsole.log(`${entry.events.length} events.`);\n\
    }\n```\n\nWhen a for loop looks like this, with the word of after a variable definition,\
    \ it will loop over the elements of the value given after of. This works not only\
    \ for arrays but also for strings and some other data structures. We'll discuss\
    \ how it works in Chapter 6.\n\n# The Final Analysis\n\nWe need to compute a correlation\
    \ for every type of event that occurs in the data set. To do that, we first need\
    \ to find every type of event.\n\n```\nfunction journalEvents(journal) {\nlet\
    \ events = [];\nfor (let entry of journal) {\n  for (let event of entry.events)\
    \ {\n    if (!events.includes(event)) {\n      events.push(event);\n    }\n  }\n\
    }\nreturn events;\n}\n```\n\n```\nconsole.log(journalEvents(JOURNAL));\n// → ['carrot\"\
    , \"exercise\", \"weekend\", \"bread\", ...]\n```\n\nBy going over all the events\
    \ and adding those that aren't already there in the events array, the function\
    \ collects every type of event.\n\nUsing that, we can see all the correlations.\n\
    \n```\nfor (let event of journalEvents(JOURNAL)) {\nconsole.log(event + \":\"\
    , phi, tableFor(event, JOURNAL));\n}// → carrot: 0.0140978969\n```\n\n*"
