  md: "Even when a request and its response are successfully delivered, the response\
    \ may indicate failure—for example, if the request tries to use a request type\
    \ that hasn't been defined or the handler throws an error. To support this, send\
    \ and defineResponseType follow the convention mentioned before, where the first\
    \ argument passed to callbacks is the failure reason, and if the second is the\
    \ actual result.\n\nThese can also be translated to promise resolution and rejection\
    \ by our wrapper.\n\n```\nclass Timeout extends Error {}\n\nfunction request(nest,\
    \ target, type, content) {\n  return new Promise((resolve, reject) => {\n    let\
    \ done = false;\n    function attempt(n) {\n      nest.send(target, type, content,\
    \ (failed, value) => {\n        done = true;\n        if (failed) reject(failed);\n\
    \        else resolve(value);\n      });\n      setTimeout(() => {\n        if\
    \ (done) return;\n        else if (n < 3) attempt(n + 1);\n        else reject(new\
    \ Timeout(\"Timed out\"));\n      }, 250);\n    }\n    attempt(1);\n  });\n}\n\
    ```\n\nBecause promises can be resolved (or rejected) only once, this will work.\
    \ The first time resolve or reject called the outcome of the promise, and any\
    \ further calls, such as the timeout arriving after the request finishes or a\
    \ request coming back after another request finished, are ignored.\n\nTo build\
    \ an asynchronous loop for the retries, we need to use a recursive function—a\
    \ regular loop doesn't allow us to stop and wait for an asynchronous action. The\
    \ attempt function makes a single attempt to send a request. It also sets a timeout,\
    \ that if no response has come after 250 milliseconds, either starts the next\
    \ attempt or, if this was the fourth attempt, rejects the promise with an instance\
    \ of Timeout as the reason.\n\nRetrying every quarter-second and giving up when\
    \ no response has come in a second is somewhat arbitrary. It is even possible,\
    \ if the request did come through but the handler is taking a bit longer, for\
    \ requests to be delivered multiple times. We'll write our handlers with that\
    \ problem in mind—duplicate messages would be harmless.\n\nIn general, we will\
    \ not building a world-class, robust network today. But that's okay—crows don't\
    \ have very high expectations when it comes to computing.\n\nTo isolate ourselves\
    \ from callbacks altogether, we will go ahead and also define a wrapper for defineResponseType\
    \ that allows the handler function to return a promise or plain value and wires\
    \ that up to the callback for us."
