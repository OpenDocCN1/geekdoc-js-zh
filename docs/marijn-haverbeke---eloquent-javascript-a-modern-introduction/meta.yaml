    \ if it isn't already.\nNote that the handler had to be wrapped in a try block\
    \ to make sure any exception it raises\ndirectly is given to the callback. This\
    \ nicely illustrates the difficulty of properly handling errors with\nraw callbacks—it\
    \ is easy to forget to properly route exceptions like that, and if you don't do\
    \ it, fails\nnot get reported to the right callback. Promises make this mostly\
    \ automatic and thus less error-prone.\n\n# # Collections of Promises\n\nEach\
