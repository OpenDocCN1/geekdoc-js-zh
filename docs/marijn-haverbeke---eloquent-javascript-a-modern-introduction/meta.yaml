  md: '# Comparison


    Here is one way to produce Boolean values:


    ```

    console.log(3 > 2)

    // true

    console.log(3 < 2)

    // false

    ```


    The > and < signs are the traditional symbols for “is greater than” and “is less
    than,” respectively. They are binary operators. Applying them results in a Boolean
    value that indicates whether they hold true in this case.


    Strings can be compared in the same way.


    ```

    console.log("aardvart" < "Zoroaster")

    // true

    ```


    The way strings are ordered roughly alphabetic but not what you’d expect to see
    in a dictionary: uppercase letters are always “less” than lowercase ones, so "Z"
    < "a", and nonalphabetic characters (!, -, and so on) are also included in the
    ordering. When comparing strings, JavaScript goes over the characters from left
    to right, comparing the Unicode codes one by one.


    Other similar operators are >= (greater than or equal to), <= (less than or equal
    to), == (equal to), and != (not equal to).


    ```

    console.log("Itchy" != "Scratchy")

    // true

    console.log("Apple" == "Orange")

    // false

    ```


    There is only one value in JavaScript that is not equal to itself, and that is
    NaN (“not a number”).


    ```

    console.log(NaN == NaN)

    // false

    ```


    NaN is supposed to denote the result of a nonsensical computation, and, as such,
    it isn’t equal to the result of any nonsensical computations.


    # Logical Operators


    There are some operations that can be applied to Boolean values themselves. JavaScript
    supports three logical operators: and, or, and not. These can be used to “reason”
    about Booleans.


    The && operator represents logical and. It is a binary operator, and its result
    is true only if both the values given to it are true.


    ```

    console.log(true && false)

    // false

    console.log(true && true)

    // true

    ```'
