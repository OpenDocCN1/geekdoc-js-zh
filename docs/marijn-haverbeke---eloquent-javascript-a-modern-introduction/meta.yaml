    \ = /^[a-z_#]+/.exec(program)) {\n    expr = {type: \"word\", name: match[0]};\n\
    \  } else {\n    throw new SyntaxError(\"Unexpected syntax: \" + program);\n \
    \ }\n\n  return parseApply(expr, program);\n}\nfunctionfunction skipSpace(string)\
    \ {\n  let first = string.search(/\\S/);\n  if (first == -1) return \"\";\n  return\
    \ string.slice(first);\n}\n```\n\nBecause Egg, like JavaScript, allows any amount\
    \ of whitespace between its elements, we have to repeatedly call the skipSpace\
    \ at the start of the program string. That is what the skipSpace function helps\
    \ with.\n\nAfter skipping any leading space, parseExpression uses three regular\
    \ expressions to spot the three atomic Egg supports: strings, numbers, and words.\
    \ The parser constructs a different kind of data structure depending on which\
    \ one matches. If the input does not match one of them, it is not a valid expression,\
