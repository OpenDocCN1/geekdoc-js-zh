    Correlation is a measure of dependence on statistical variables. A statistical
    variable is not quite the same as a programming variable. In statistics you typically
    have a set of measurements, and each variable is measured for every measurement.
    Correlation between variables is usually expressed as a value that ranges from
    -1 to 1. Zero correlation means the variables are not related. A correlation of
    1 indicates that the two variables are perfectly related—if you know one, you
    also know the other. A correlation of -1 also means the variables are perfectly
    related but that they are opposites—if one is true, the other is false.


