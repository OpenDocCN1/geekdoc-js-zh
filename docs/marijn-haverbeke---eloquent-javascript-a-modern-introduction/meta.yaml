    \ brackets.\n\n```\nlet name) = (name: \"Faraji\", age: 23);\nconsole.log(name);\n\
    // -> Faraji\n```\n\nNote that if you try to destroy null or undefined, you get\
    \ an error, much as you would if\ndirectly try to access a property of those values.\n\
    \n# JSON\n\nBecause properties only grasp their value, rather than contain it,\
    \ objects and arrays are stored in\nt computer’s memory as sequences of bits holding\
    \ the addresses—the place in memory—of their\ncontents. So an array with another\
    \ array inside consists of (at least) one memory region for\ninner array, and\
    \ another for the outer array, containing (among other things) a binary number\
    \ that\nrepresents the position of the inner array.\n\nIf you want to save data\
    \ in a file for later or send it to another computer over the network,\nhow you\
    \ have to convert these tangles of memory addresses to a description that can\
    \ be stored or\nsent. You could send over your entire computer memory along with\
    \ the address of the value you’re\ninterested in, I suppose, but that doesn’t\
    \ seem like the best approach.\n\nWhat can we serialize the data. That means it\
    \ is converted into a flat description. A popular\nserialization format is called\
    \ JSON (pronounced \"Jason\\), which stands for JavaScript Object\nNotation. It\
    \ is widely used as a data storage and communication format on the web, even in\n\
    languages other than JavaScript.\n\nJSON looks similar to JavaScript’s way of\
    \ writing arrays and objects, with a few restrictions.\nAll property names have\
    \ to be surrounded by double quotes, and only simple data expressions are\nallowed—no\
    \ function calls, bindings, or anything that involves actual computation. Comments\
    \ are not\nalallowed in JSON.\n\nA journal entry might look like this when represented\
    \ as JSON data:\n\n```\n{\n  \"squirrel\": false,\n  \"events\": [\"work\", \"\
    touched tree\", \"pizza\", \"running\"]\n}\n```\n\nJavaScript gives us the functions\
    \ JSON.stringify and JSON.parse to convert data to and from format.\nThe first\
    \ takes a JavaScript value and returns a JSON-encoded string. The second takes\
    \ such a\nstring and encodes it to the value it encodes.\n\n```\nlet string =\
    \ JSON.stringify({squirrel: false,\n  events: [\"weekend\"]});\nconsole.log(string);\n\
    // -> {\"squirrel\":false,\"events\":[\"weekend\"]}\nconsole.log(JSON.parse(string).events);\n\
    ```"
