  md: "# Further Arrayology\n\nBefore finishing the chapter, I want to introduce you\
    \ to a few more object-related concepts. I will start by introducing some generally\
    \ useful array methods.\n\nWe saw push and pop, which add and remove elements\
    \ at the end of an array, in “Methods” on page 62. The corresponding methods for\
    \ adding and removing things at the start of an array are called unshift and shift.\n\
    \n```\nlet todoList = [];\nfunction remember(task) {\n  todolist.push(task);\n\
    }\nfunction getTask() {\n  return todolist.shift();\n}\nfunction rememberUrrgently(task)\
    \ {\n  todolist.unshift(task);\n}\n```\n\nThat program manages a queue of tasks.\
    \ You add tasks to the end of the queue by calling remember('groceries'), and\
    \ when you're ready to do something, you call getTask() to get (and remove) the\
    \ item from the queue. The rememberUrrgently function also adds a task but adds\
    \ it to the front instead of the back of the queue.\n\nTo search for a specific\
    \ value, arrays provide an indexOf method. The method searches through the array\
    \ to the end and returns the index at which the value was found—or if it wasn't\
    \ found. To search from the end instead of the start, there's a similar method\
    \ called lastIndexOf().\n\n```\nconsole.log([1, 2, 3, 2, 1].indexOf(2));\n// 1\n\
    console.log([1, 2, 3, 2, 1].lastIndexOf(2));\n// 3\n```\n\nBoth indexOf and lastIndexOf\
    \ take an optional second argument that indicates where to start searching.\n\n\
    Another fundamental array method is slice, which takes start and end indices and\
    \ returns an array that has only the elements between them. The start index is\
    \ inclusive, the end index declusive.\n\n```\nconsole.log([0, 1, 2, 3, 4].slice(2,\
    \ 4));\n// [2, 3]\nconsole.log([0, 1, 2, 3, 4].slice(2));\n// [2, 3, 4]\n```\n\
    \nWhen the index is not given, slice will take all of the elements after the start\
    \ index. You can also omit the start index to copy the entire array.\n\nThe concat\
    \ method can be used to glue arrays together to create a new array, similar to\
    \ what the + operator does for strings.\n\nThe following example shows both concat\
    \ and slice in action. It takes an array and an index, and it"
