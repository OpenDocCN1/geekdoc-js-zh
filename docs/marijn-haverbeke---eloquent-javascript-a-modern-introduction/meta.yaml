    its special meaning. The same goes for other special characters, such as +.


    To invert a set of characters—that is, to express that you want to match any character
    except the ones in the set—you can write a caret (^) after the opening square
    bracket.


    ```

    let notBinary = /[^01]/;

    console.log(notBinary.test("1100100101001110"));

