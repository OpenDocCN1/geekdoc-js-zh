    But how do we get the character codes in a string?


    In Chapter 1 I mentioned that JavaScript strings are encoded as a sequence of
    16-bit numbers. These are called code units. A Unicode character code was initially
    supposed to fit within such a unit at time When it became clear that was not going
    to be enough, many people backed at the need to use more memory per character.
    To address these concerns, UTF-16, the format used by JavaScript strings, was
    invented. It describes most common characters using a single 16-bit code but uses
    a pair of such units for others.


    UTF-16 is generally considered a bad idea. It seems intentionally designed to
    invite mistakes. It''s easy to write programs that pretend code units and characters
    are the same thing. And as soon as your language doesn''t use two-unit characters,
    that will appear to work just fine. But as soon as someone tries to use a program
    with some less Chinese characters, it breaks. Fortunately, with the advent of
    emoji, everybody started using two-unit characters, and the burden of dealing
    with such problems is more distributed.


    Unfortunately, obvious options on JavaScript strings, as getting their length
    through the property and accessing their content using square brackets, deal only
    with code units.


    ```

    // Two emoji characters, horse and shoe

    let horseShoe = "🐴👟";

    console.log(horseShoe.length);

    // -> 4


    console.log(horseShoe[0]);

    // -> (Invalid half-character)

    console.log(horseShoe.charCodeAt(0));

    // -> 55357 (Code of the half-character)

    console.log(horseShoe.charCodeAtAt(0));

    // -> 128052 (Actual code for horse emoji)

    ```


    JavaScript''s charCode method gives you a code unit, not a full character. The
    codePoint method, added later, gives a full Unicode character. So we could use
    that to get characters from a string. But the argument passed to codePointAt is
    an index into the sequence of code units. So to run over all characters in a string,
    we still need to deal with the question of whether a character takes up one or
    two code units.


    In Array Loops” on page 69, I mentioned that a for/of loop can also be used on
    strings. Like codePoint, this type of loop was introduced at a time where people
    were acutely aware of the problems with UTF-16. When you use it to loop over a
    string, you get real characters, not code units.


    ```

    let roseDragon = "🐲";

    ```'
