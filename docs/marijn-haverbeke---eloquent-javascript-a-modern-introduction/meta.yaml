  md: "The first helper function in the farm example, printZeroPadWithLabel, is called\
    \ for its side effect: it prints a line. The second version, zeroPad, is called\
    \ for its return value. It is no coincidence that the second is useful in more\
    \ situations than the first. Functions that create values are easier to combine\
    \ in new ways than functions that directly perform side effects.\n\nA pure function\
    \ is a specific kind of value-producing function that not only has no side effects\
    \ but also doesn't rely on side effects from other code—for example, it doesn't\
    \ read global bindings whose value might change. A pure function has the pleasant\
    \ property that, when called with the same arguments, it always produces the same\
    \ value (and doesn't do anything else). A call to such a function can be substituted\
    \ by its return value without changing the meaning of the code. When you are not\
    \ sure that a pure function is working correctly, you can test it by simply calling\
    \ it and know that it works in any context. Impure functions tend to require more\
    \ scaffolding to test.\n\nStill, there's no need to feel bad when writing functions\
    \ that are not pure or to wage a holy war to purge them from your code. Side effects\
    \ are often useful. There's no way to write a pure version of console.log, for\
    \ example, and console.log is good to have. Some operations are also easier to\
    \ express in an efficient way when we use side effects, so computing speed can\
    \ be a reason to avoid purity.\n\n# Summary\n\nThis chapter taught you how to\
    \ write your own functions. The function keyword, when used as an expression,\
    \ can create a function value. When used as a statement, it can be used to declare\
    \ a binding and Arrow functions are yet another way to create functions.\n\n```\n\
    // Define f to hold a function value\nconst f = function(a) {\n  console.log(a\
    \ + 2);\n}\n```\n\n```\n// Declare g to be a function\nfunction g(a, b) {\n  return\
    \ a * b * 3.5;\n}\n```\n\n```\n// A less verbose function value\nlet h = a =>\
    \ a % 3;\n```\n\nA key aspect in understanding functions is understanding scopes.\
    \ Each block creates a new scope. Parameters and bindings declared in a given\
    \ scope are local and not visible from the outside. Bindings declared with var\
    \ behave differently—they end up in the nearest function scope or the global scope.\n\
    \nSeparating the tasks your program performs into different functions is helpful.\
    \ You won't have to repeat yourself as much, and functions can help organize a\
    \ program by grouping code into pieces that do specific things."
