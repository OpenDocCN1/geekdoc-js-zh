    To indicate that a pattern should occur a precise number of times, use braces.
    Putting (4) after an element, for example, requires it to occur exactly four times.
    It is also possible to specify a range this way: (2,4) means the element must
    occur at least twice and at most four times.


    Here is another version of the date and time pattern that allows both single-
    and double-digit days, months, and hours. It is also slightly easier to decipher.


    ```

    let dateTime = /\d(1,2)-\d(1,2)-\d(4) \d(1,2):\d(2)/;

    console.log(dateTime.test("1-30-2003 8:45"));

    // true

    ```


    You can also specify open-ended ranges using braces by omitting the number after
    the comma. So, {5,} means five or more times.


    # Grouping Subexpressions


    To use an operator like * or + on more than one element at a time, you have to
    use parentheses. A part of a regular expression that is enclosed in parentheses
    counts as a single element as far as the operators يلي are concerned.


    ```

    let cartoonCrying = /boo+(hoo+)/i;

    console.log(cartoonCrying.test("Bohooohohohoo"));

    // true

    ```


    The first and second characters apply only to the second o in boo and boo, respectively.
    The third + applies to the whole group (hoo+), matching one or more sequences
    like that.

    The i at the end of the expression in the example makes this regular expression
    case insensitive, allowing it to match the uppercase B in the input string, even
    though the pattern is itself all lowercase.


    # Matches and Groups


    The test method is the absolute simplest way to match a regular expression. It
    tells you whether it matched and nothing else. Regular expressions also have an
    exec (execute) method that will return null if no match was found and return an
    object with information about the match otherwise.


    ```

    let match = /\d+/.exec("one two 100");

    console.log(match);

    // ["100"]

