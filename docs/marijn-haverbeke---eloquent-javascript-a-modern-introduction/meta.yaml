    # ECMAScript Modules


    CommonJS modules work quite well and, in combination with NPM, have allowed the
    JavaScript community to share code on a large scale.


    But they remain a bit of a duct-tape hack. The notation is slightly awkward—the
    things you to exports are not available in the local scope, for example. And because
    require is a normal function call taking any kind of argument, not just a string
    literal, it can be hard to determine the dependencies of a module without running
    its code.


    This is why the JavaScript standard from 2015 introduces its own, different module
    system. It is usually called ES modules, where ES stands for ECMAScript. The main
    concepts of dependencies and interfaces remain the same, but the details differ.
    For one thing, the notation is now integrated into the language. Instead of calling
    a function to access a dependency, you use a special import keyword.


    ```

    import ordinal from "ordinal";

    import (days, months) from "date-names";

    export function formatDate(date, format) { /* ... */ }

    ```


    Similarly, the export keyword is used to export things. It may appear in front
    of a function, class, or binding definition (let, const, or var).


    An ES module''s interface is not a single value but a set of named bindings. The
    preceding module binds formatDate to a function. When you import from another
    module, you import the binding, not the value, which means an exporting module
    may change the value of the binding at any time, and the modules that it import
    will see its new value.


    When there is a named default, it is treated as the module''s exported value.
    If you import a module like ordinal in the example, without braces around the
    binding, you get its default binding. Such modules can still export other bindings
    under different names alongside their default export.


    To create a default export, you write export default before an expression, a function
    declaration, or a class declaration.'
