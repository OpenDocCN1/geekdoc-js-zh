  md: "```\n<button>A</button>\n<button>B</button>\n<button>C</button>\n<script>\n\
    document.body.addEventListener(\"click\", event => {\n  if (event.target.nodeName\
    \ == \"BUTTON\") {\n    console.log(\"Clicked\", event.target.textContent);\n\
    \  }\n});\n</script>\n```\n\n# # Default Actions\n\nMany events have a default\
    \ action associated with them. If you click a link, you will be taken to the link's\
    \ target. If you press the down arrow, the browser will scroll the page down.\
    \ If you right-click, you'll get a context menu. And so on.\n\nFor most types\
    \ of events, the JavaScript event handlers are called before the default behavior\
    \ takes place. If the handler doesn't want this normal behavior to happen, typically\
    \ because it has already taken care of handling the event, it can call the preventDefault\
    \ on the event object.\n\nThis can be used to implement your own keyboard shortcuts\
    \ or context menu. It can also be used to obnoxiously interfere with the behavior\
    \ that users expect. For example, here is a link that cannot be followed:\n\n\
    ```\n<a href=\"https://developer.mozilla.org/\">MDN</a>\n<script>\nlet link =\
    \ document.querySelector(\"a\");\nlink.addEventListener(\"click\", event => {\n\
    \  console.log(\"Nope.\");\n  event.preventDefault();\n});\n</script>\n```\n\n\
    Try not to do such things unless you have a really good reason to. It'll be unpleasant\
    \ for people who use your page when expected behavior is broken.\n\nDepending\
    \ on the browser, some events can't be intercepted at all. On Chrome, for example,\
    \ the keyboard shortcut to close the current tab (CTRL-W or COMMAND-W) cannot\
    \ be handled by JavaScript.\n\n# # Key Events\n\nWhen a key on the keyboard is\
    \ pressed, your browser fires a \"keydown\" event. When it is released, you get\
    \ a \"keyup\" event."
