  md: '![](bbox=[0.153, 0.018, 0.846, 0.298])


    When matching this expression, it will often happen that the top (binary) branch
    is entered even though the input does not actually contain a binary number. When
    matching the string "103", for example, it becomes clear only at the 3 that we
    are in the wrong branch. The string *does* match the expression, not just the
    branch we are currently in.


    So matcher *backtracks*. When entering a branch, it remembers its current position
    (in this case, at the start of the string, it just passes the first boundary box
    in the diagram) so that it can go back and try another branch if the current one
    does not work. For the string "103", after encountering the 3 character, it will
    start trying the branch for hexadecimal numbers, which fails again because there
    is no *b* after the number. So it tries the decimal number branch. This fits,
    and a match is reported after all.


    The matcher stops as soon as it finds a full match. This means that if multiple
    branches could potentially match a string, only the first one (ordered by where
    the branches appear in the regular expression) is used.


    Backtracking also happens for repetition operators like + and *. If you match
    /x*/ against "abc", the *.* part will first try to consume the whole string. The
    engine will then realize that it needs an *x* to match the pattern. Since there
    is no *x* at the end of the string, the star operator tries to match one character
    less. But the matcher doesn''t find an *x* after *abc* either, so it backtracks
    again, matching the star operator to just *abc*. *Now* it finds an *x* where it
    needs and reports a successful match from positions 0 to 4.


    It is possible to write regular expressions that will do a *lot* of backtracking.
    This problem occurs when a pattern can match a piece of input in many different
    ways. For example, if we get confused while writing a binary-number regular expression,
    we might accidentally write something like /[0-9]+/b.'
