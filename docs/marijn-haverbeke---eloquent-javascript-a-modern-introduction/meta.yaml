  md: "The async => part shows that arrow functions can also be made async by putting\
    \ the word async in front of them.\n\nThe code doesn't immediately look suspicious...\
    \ it maps the async arrow function over the set of nests, creating an array of\
    \ promises, and then uses Promise.all to wait for all of these before returning\
    \ the list they build up.\n\nBut it is seriously broken. It'll always return only\
    \ a single line of output, listing the nest that was slowest to respond.\n\nCan\
    \ you work out why?\n\nThe problem lies in the += operator, which takes the current\
    \ value of list at the time where the statement starts executing and then, the\
    \ await finishes, sets the list binding to that value plus the added string.\n\
    \nBut between the time when the statement starts executing and the time it finishes\
    \ there's an asynchronous gap. The map expression runs before anything has been\
    \ added to the list, so each of the operators starts with an empty string and\
    \ ends up, when its storage retrieval finishes, setting list to a single-line\
    \ list--the result of adding its line to the empty string.\n\nThis could have\
    \ been easily avoided by returning the lines from the mapped promises and calling\
    \ on the result of Promise.all, instead of building the list by changing a binding.\
    \ computing new values is less error-prone than changing existing values.\n\n\
    ```\nasync function chicks(nest, year) {\n  let lines = network(nest).map(async\
    \ name => {\n    return name + \": \" + await anyStorage(name, `chicks in ${year}\\\
    `);\n  });\n  return (await Promise.all(lines)).join(\"\\n\");\n}\n```\n\nMistakes\
    \ like this are easy to make, especially when using await, and you should be aware\
    \ of where the gaps in your code occur. An advantage of JavaScript's asynchronicity\
    \ (through callbacks, promises, or await) is that spotting these gaps is relatively\
    \ easy.\n\n# Summary\n\nAsynchronous programming makes it possible to express\
    \ waiting for long-running actions without freezing the program during these actions.\
    \ JavaScript environments typically implement this style of programming using\
    \ callbacks, functions that are called when the action complete. An event loop\
    \ schedules such callbacks to be called when appropriate, one after the other,\
    \ so that their execution does not overlap.\n\nProgramming asynchronously is made\
    \ easier by promises, objects that represent actions that might complete in the\
    \ future, and async functions, which allow you to write an asynchronous program\
    \ as if it were synchronous."
