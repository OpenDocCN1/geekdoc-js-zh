  md: 'There are issues that are simply poor design. For example, there is no way
    to create a new node and immediately add children or attributes to it. Instead,
    you have to create it and then add the children and attributes one by one, using
    side effects. Code that interacts heavily with the DOM tends to get long, repetitive,
    and ugly.


    But these flaws are not fatal. Since JavaScript allows us to create our own abstractions,
    it is possible to design improved ways to express the operations you are performing.
    Many libraries intended for browser programming come with such tools.


    # Moving Through the Tree


    DOM nodes contain a wealth of links to other nearby nodes. The following diagram
    illustrates these:


    ![](bbox=[0.235, 0.335, 0.755, 0.735])


    Although the diagram shows only one link of each type, every node has a parentNode
    that points to the node it is part of, if any. Likewise, every element node (node
    type 1) has a childNodes property that points to an array-like object holding
    its children.


    In theory, you could move anywhere in the tree using just these parent and child
    links. JavaScript also gives you access to a number of additional convenience
    links. The firstChild and lastChild properties point to the first and last child
    elements or have the value null for nodes without children. Similarly, previousSibling
    and nextSibling point to adjacent nodes, which are nodes with the same parent
    that appear immediately before or after the node itself. For a first child, previousSibling
    will be null, and for a last child, nextSibling will be null.


    There''s also the children property, which is likeNodes but contains only (type
    1) children, not other types of child nodes. This can be useful when you aren''t
    interested in text nodes. *'
