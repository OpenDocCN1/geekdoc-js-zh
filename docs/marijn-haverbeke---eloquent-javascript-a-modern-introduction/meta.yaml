    way.


    To make positioning multiple objects easier, it is probably a good idea to switch
    positioning. This means that top and left are counted relative to the top left
    of the document. To avoid using negative coordinates, which would cause the image
    to move outside of the visible page, you can add a fixed number of pixels to the
