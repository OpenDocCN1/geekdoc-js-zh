  md: "way to reach a given node in the network. Instead of returning the whole route,\
    \ it just returns the next step. That nest, using its current information about\
    \ the network, we will decide where it sends the message.\n\n```\nfunction findRoute(from,\
    \ to, connections) {\n  let work = [[at: from, via: null]];\n  for (let i = 0;\
    \ i < work.length; i++) {\n    let (at, via) = work[i];\n    for (let next of\
    \ connections.get(at) || []) {\n      if (next == to) return via;\n      if (!work.some(w\
    \ => w.at == next)) {\n        work.push({at: next, via: via});\n      }\n   \
    \ }\n  }\n  return null;\n}\n```\n\nNow we can build a function that can send\
    \ long-distance messages. If the message is addressed to a direct neighbor, it\
    \ is delivered in an object and sent to a neighbor that is closer to the target,\
    \ using the \"route\" request type, which will cause that neighbor to repeat the\
    \ same behavior.\n\n```\nfunction routeRequest(nest, target, type, content) {\n\
    \  if (nest.neighbors.includes(target)) {\n    return requestRequest(nest, target,\
    \ type, content);\n  } else {\n    let via = findRoute(nest.name, target,\n  \
    \    nest.state.connections);\n    if (!via) throw new Error(`No route to ${target}`);\n\
    \    return requestRequest(nest, via, \"route\",\n      {target, type, content});\n\
    \  }\n}\n\nrequestType(\"route\", nest, {target, type, content}) => {\n  return\
    \ routeRequest(nest, target, type, content);\n}\n```\n\nWe've constructed several\
    \ layers of functionality on top of a primitive communication system to make it\
    \ convenient to use. This is a nice (though simplified) model of how real computer\
    \ networks work.\n\nA distinguishing property of computer networks is that they\
    \ are not reliable—abstractions built on top of them can help, but you can't abstract\
    \ away network failure. So network programming is typically very much about anticipating\
    \ and dealing with failures.\n\n# Async Functions\n\nTo store important information,\
    \ crows are known to duplicate it across nests. That way, when a hawk destroys\
    \ a nest, the information isn't lost."
