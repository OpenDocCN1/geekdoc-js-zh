  md: 'For any given document, browsers are able to compute a layout, which gives
    each element a size and position based on its type and content. This layout is
    then used to draw the document.


    The size and position of an element can be accessed from JavaScript. The offsetWidth
    offset properties give you the space the element takes up in pixels. A pixel is
    the basic unit of measurement in the browser. It traditionally corresponds to
    the smallest dot that you can draw, but on modern displays, you can draw very
    small dots that may no longer be the case, and a browser pixel may span multiple
    dots.


    Similarly, clientWidth and clientHeight give you the size of the space inside
    the element, ignoring border width.


