  md: 'HTML documents, as opposed to various dialects have a head and a body. The
    head contains information *about* the document, and the body contains the document
    itself. In this case, the head declares that the title of the document is "My
    home page" and it uses the UTF-8 encoding, which is a way to encode Unicode text
