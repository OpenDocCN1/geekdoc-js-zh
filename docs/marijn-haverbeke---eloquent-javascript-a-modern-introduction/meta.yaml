  md: "# Handling Events 253\n\n```\ndot.style.top = (event.pageY - 4) + \"px\";\n\
    document.body.appendChild(dot);\n</script>\n```\n\n# Mouse Motion\n\nEvery time\
    \ the mouse pointer moves, a `mousemove` event is fired. This event can be used\
    \ to track the position of the mouse. A common situation in which this is useful\
    \ when implementing some form of mouse-dragging functionality.\n\nAs an example,\
    \ the following program displays a bar and sets up event handlers so that dragging\
    \ to the left or right on this bar makes it narrower or wider:\n\n```\n<p>Drag\
    \ the bar to change its width:</p>\n<div style=\"background: orange; width: 60px;\
    \ height: 20px\"></div>\n<script>\n let lastX; // Tracks the last observed mouse\
    \ X position\n  let bar = document.querySelector(\"div\");\n  bar.addEventListener(\"\
    mousedown\", event => {\n    if (event.button == 0) {\n      lastX = event.clientX;\n\
    \      window.addEventListener(\"mousemove\", moved);\n      event.preventDefault();\
    \ // Prevent selection\n    }\n  });\n\nfunction moved(event) {\n  if (event.buttons\
    \ == 0) {\n    window.removeEventListener(\"mousemove\", moved);\n  } else {\n\
    \    let dist = event.clientX - lastX;\n    let newWidth = Math.max(10, bar.offsetWidth\
    \ + dist);\n    bar.style.width = newWidth + \"px\";\n    lastX = event.clientX;\n\
    \  }\n}\n</script>\n```\n\nThe resulting page looks like this:\n\nDrag the bar\
    \ to change its width:\n\n![](bbox=[0.015, 0.783, 0.985, 0.833])\n\nNote that\
    \ the `mousemove` handler is registered on the whole window. Even if the mouse\
    \ goes outside of the bar during resizing, as long as the button is held we still\
    \ want to update its size.\n\nWe must stop resizing the bar when the mouse button\
    \ is released. For that, we can use the buttons property (note the plural), which\
    \ tells us about the buttons are currently held down. When this is zero, no buttons\
    \ are down. When buttons are held, its value is the sum of the codes for those"
  merge: -1
  pgno: 238
- img_proc: false
  md: "buttons—the left button has code 1, the right button 2, and the middle one\
    \ 4. That, you can check whether a given button is pressed by taking the remainder\
    \ of buttons and its code.\n\nNote that the order of these codes is different\
    \ from the one used by button, where the middle button came before the right one.\
    \ As mentioned, consistency isn't really a strong point of the browser's programming\
    \ interface.\n\n# # Touch Events\n\nThe style of graphical browser that we used\
    \ was designed with mouse interfaces in mind, at a time where touchscreens were\
    \ rare. To make web \"work\" on early touchscreen phones, browsers for those devices\
    \ intended, to a certain extent, that touch events were mouse events. If you tap\
    \ your screen, you'll get \"mousedown, \"mouseup, and \"click\" events.\n\nBut\
    \ this illusion isn't very robust. A touchscreen works differently from a mouse:\
    \ it doesn't have multiple buttons, you can't track the finger when it isn't on\
    \ the screen (to simulate \"mousove\"), and it allows multiple fingers to be on\
    \ the screen at the same time.\n\nMouse events cover touch interaction only in\
    \ straightforward cases—if you add a \"click\" handler to a button, touch users\
    \ will still be able to use it. But something like the resizeable bar in the previous\
    \ example does not work on a touchscreen.\n\nThere are specific event types fired\
    \ by touch interaction. When a finger starts touching the screen, you get a \"\
    touchstart\" event. When it is moved while touching, \"touchmove\" events fires.\
    \ Finally, when it stops touching the screen, you will see a \"touchend\" event.\n\
    \nBecause many touchscreens can detect multiple fingers at the same time, these\
    \ events don't have a single set of coordinates associated with them. Rather,\
    \ their event objects have a touches property, which holds an array-like object\
    \ of points, each of which has its own clientX, clientY, pageX, and pageY.\n\n\
    You could do something like this to show red circles around every touching finger:\n\
    \n```\n<style>\ndot { position: absolute; display: block;\n  border: 2px solid\
    \ red; border-radius: 50px;\n  height: 100px; width: 100px; }\n</style>\n<p>Touch\
    \ this page</p>\n<script>\nfunction update(event) {\n  for (let dot; dot = document.querySelector(\"\
    dot\");) {\n    dot.remove();\n  }\n  for (let i = 0; i < event.touches.length;\
    \ i++) {\n    let (pageX, pageY) = event.touches[i];\n    let dot = document.createElement(\"\
    dot\");\n    dot.style.left = (pageX - 50) + \"px\";\n    dot.style.top = (pageY\
    \ - 50) + \"px\";\n    document.body.appendChild(dot);\n  }\n}\nwindow.addEventListener(\"\
    touchstart\", update);\n```\n\n![](bbox=[0.018, 0.982, 0.055, 0.995])"
  merge: -1
