    ```\nfunction parseExpression(program) {\n  program = skipSpace(program);\n  let\
    \ match, expr;\n  if (match = /\\\"([^\"]*)\"/.exec(program)) {\n    expr = {type:\
    \ \"value\", value: match[1]};\n  } else if (match = /\\d+\\b/.exec(program))\
