  md: "Though computers are deterministic machines—they always react the same way\
    \ if given the same input—it is possible to have them produce numbers that appear\
    \ random. To do that, the machine keeps some hidden value, and whenever you ask\
    \ for a new random number, it performs complicated computations on this hidden\
    \ value to create a new value. It stores a new value and returns some number derived\
    \ from it. That way, it can produce ever new, hard-to-predict numbers in a way\
    \ that seems random.\n\nIf we want a whole random number instead of a fractional\
    \ one, we can use Math.floor (which rounds down to the nearest whole number) on\
    \ the result of Math.random.\n\n```\nconsole.log(Math.floor(Math.random() * 10));\n\
    // 2\n```\n\nMultiplying the random number by 10 gives a number greater than or\
    \ equal to 0 and below. Since Math.floor rounds down, this expression will produce,\
    \ with equal chance, any number from 0 through 9.\n\nThere are also the functions\
    \ Math.ceil (for “ceiling,” which rounds up to a whole number), Math.round (to\
    \ the nearest whole number), and Math.abs, which takes the absolute value of a\
    \ number, meaning it negates negative values but leaves positive ones as they\
    \ are.\n\n# Destructuring\n\nLet's go back to the phi table for a moment.\n\n\
    ```\nfunction phi(table) {\n  return (table[3] * table[0] - table[2] * table[1])\
    \ /\\n  Math.sqrt((table[2] + table[1]) *\n  (table[0] + table[1]) *\n  (table[1]\
    \ + table[3]) *\n  (table[0] + table[2]));\n}\n```\n\nOne of the reasons this\
    \ function is awkward to read is that we have a binding pointing at our array,\
    \ but we'd prefer to have bindings for the elements of the array, that is, let\
    \ n0 = table[0] and so on. Fortunately, there is a succinct way to do this in\
    \ JavaScript.\n\n```\nfunction phi(n0, n1, n10, n11) {\n  return (n11 * n0 - n10\
    \ * n1) /\\n  Math.sqrt((n10 + n1) * (n0 + n01) *\n  (n01 + n11) * (n0 + n01));\n\
    }\n```\n\nThis also works for bindings created with let, var, or const. If you\
    \ know the value you are binding"
