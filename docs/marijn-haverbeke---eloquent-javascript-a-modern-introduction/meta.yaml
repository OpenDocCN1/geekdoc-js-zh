  md: "# # 8\n# BUGS AND ERRORS\n\nFlaws in computer programs are usually called *bugs*.\
    \ It makes programmers feel good to imagine them as little things that just happen\
    \ to crawl into our work. In reality, of course, we put them ourselves.\n\nIf\
    \ a program is crystallized thought, you can roughly categorize bugs into those\
    \ caused by the thoughts being confused and those caused by mistakes while converting\
    \ a thought to code. The former type is generally harder to diagnose and fix than\
    \ the latter.\n\n# Language\n\nMany mistakes could be pointed out to us automatically\
    \ by the computer, if it knew enough about what we're trying to do. But here JavaScript's\
    \ looseness is a hindrance. Its concept of properties is vague enough to rarely\
    \ catch types before actually running the program. And even then, it allows you\
    \ to do clearly nonsensical things without complaint, as computing true * \"monkey\"\
    .\n\nThere are some things JavaScript does complain about. Writing a program that\
    \ does not follow the language's grammar will immediately make the computer complain.\
    \ Other things, such as calling something that's not a function or looking up\
    \ a property on an undefined value, will cause an error to be reported when the\
    \ program tries to perform the action.\n\nBut often, your nonsense computation\
    \ will merely produce NaN (not a number) or an undefined value, while the program\
    \ happily continues, convinced that it's doing something meaningful. The mistake\
    \ will manifest itself later, after the bogus value has traveled through several\
    \ functions. It might not trigger an error at all but silently cause the program's\
    \ output to be wrong. Finding the source of such problems can be difficult.\n\n\
    The process of finding mistakes—bugs—in programs is called debugging.\n\n# Strict\
    \ Mode\n\nJavaScript can be made a little stricter by enabling *strict mode*..\
    \ This is done by putting the string \"use strict\" at the top of a file or a\
    \ function body. Here's an example:\n\n```\nfunction canYouSpotTheProblem() {\n\
    \  \"use strict\"\n  for (counter = 0; counter < 10; counter++) {\n    console.log(\"\
    Happy happy\");\n  }\n}\n```"
