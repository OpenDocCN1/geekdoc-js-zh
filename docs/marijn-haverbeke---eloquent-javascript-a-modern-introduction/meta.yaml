  md: '# 4 DATA STRUCTURES: OBJECTS AND ARRAYS


    Numbers, Booleans, and strings are the atoms that data structures are built from.
    Many types of information require more than one atom, though. Objects allow us
    to group values—including other objects—to build more complex structures.


    The programs we have built so far have been limited by the fact that they were
    operating only on simple data types. This chapter will introduce basic data structures.
    By the end of it, you''ll know enough to start writing useful programs.


    The chapter will work through a more or less realistic programming example, introducing
    concepts as they apply to the problem at hand. The example code will often build
    on functions and bindings that were introduced earlier in the text.


    The online coding sandbox for the book (https://eloquentjavascript.net/code) provides
    a way to run code in the context of a specific chapter. If you decide to work
    through the examples in another environment, be sure to first download the full
    code for this chapter from the sandbox page.


    # The Weresquirrel


    Every now and then, usually between 8 PM and 10 PM, Jacques finds himself transforming
    into a small furry rodent with a bushy tail.


    On one hand, Jacques is quite glad that he doesn''t have classic lycanthropy.
    Turning into a squirrel causes fewer problems than turning into a wolf. Instead
    of worrying about accidentally eating the neighbor (that would be awkward), he
    worries about being eaten by the neighbor''s cat. After two occasions he woke
    up on a precariously thin branch in the crown of an oak, dazed and disoriented,
    he has taken to locking the doors and windows of his room at night and putting
    a few walnuts on the floor to keep himself busy.


    That takes care of the cat and tree problems. But Jacques would prefer to get
    rid of his condition entirely. The irregular occurrences of the transformation
    make him suspect that they might be triggered by something. For a while, he believed
    that it happened only on days when he had been near oak trees. But avoiding oak
    trees did not stop the problem.


    Switching to a more scientific approach, Jacques has started keeping a daily log
    of everything he does on a given day and whether he changed form. With this data
    he hopes to narrow down the conditions that trigger the transformations.


    The first thing he needs is a data structure to store this information.


    # Data Sets'
