  md: "# Focus Events\n\nWhen an element gains focus, the browser fires a \"focus\"\
    \ event on it. When it loses focus, the element gets a \"blur\" event.\n\nUnlike\
    \ the events discussed earlier, these two events do not propagate. A handler on\
    \ a parent element is not notified when a child element gains or loses focus.\n\
    \nThe following example displays help text for the text field that currently has\
    \ focus:\n\n```\n<p>Name: <input type=\"text\" data-help=\"Your full name\">></p>\n\
    <p>Age: <input type=\"text\" data-help=\"Age in years\">></p>\n<p id=\"help\"\
    ></p>\n\n<script>\n  let help = document.querySelector(\"#help\");\n  let fields\
    \ = document.querySelectorAll(\"input\");\n  for (let field of Array.from(fields))\
    \ {\n    field.addEventListener(\"focus\", event => {\n      let text = event.target.getAttribute(\"\
    data-help\");\n      help.textContent = text;\n    });\n\n    field.addEventListener(\"\
    blur\", event => {\n      help.textContent = \"\";\n    });\n  }\n</script>\n\
    ```\n\nThis screenshot shows the help text for the age field.\n\n![](bbox=[0.012,\
    \ 0.538, 0.315, 0.612])\n\nAge in years\nThe window object will receive \"focus\"\
    \ and \"blur\" events when the user moves from or to the browser tab or window\
    \ in which the document is shown.\n\n# Load Event\n\nWhen a page finishes loading,\
    \ the \"load\" event fires on the window and the document body objects. This is\
    \ often used to schedule initialization actions that require the whole document\
    \ to have been built. Remember that the content of <script> tags is run immediately\
    \ when the tag is encountered. This may be too soon, for example when the script\
    \ needs to do something with parts of the document that appear after the <script>\
    \ tag.\n\nElements such as images and script tags that load an external file also\
    \ have a \"load\" event that indicates the files they reference were loaded. Like\
    \ the focus-related events, loading events do not propagate."
