  md: '# THE SECRET LIFE OF OBJECTS


    Chapter 4 introduced JavaScript’s objects. In programming culture, we have a thing
    called *object-oriented programming*, a set of techniques that use objects (and
    related concepts) as the central principle of program organization.


    Though no one really agrees on its precise definition, object-oriented programming
    has shaped the design of many programming languages, including JavaScript. This
    chapter will describe the way these ideas can be applied in JavaScript.


    # Encapsulation


    The core idea in object-oriented programming is to divide programs into smaller
    pieces and make each piece responsible for managing its own state. This way, some
    knowledge about the way a piece of the program works can be kept *local* to that
    piece. Someone working on the rest of the program does not have to remember or
    be aware of that knowledge. Whenever these local details change, only the code
    directly around it needs to be updated.


    Different pieces of such program interact with each other through *interfaces*,
    limited sets of functions or bindings that provide useful functionality at a more
    abstract level, hiding their private implementation.


    Such program pieces are modeled using objects. Their interface consists of a specific
    set of methods and properties. Properties that are part of the interface are called
    *public*. The others, which outside code should not be touching, are called *private*.


    Many languages provide a way to distinguish public and private properties and
    prevent outside code from accessing the private ones altogether. JavaScript, again
    taking the minimalist approach, does—not yet at least. There is work underway
    to add this to the language.


    Even though the language doesn’t have this distinction built in, JavaScript programmers
    are successfully using this idea. Typically, the available interface is described
    in documentation or comments. It is also common to put an underscore character
    (_) at the beginning of property names to indicate that those properties are private.


    Separating interface from implementation is a great idea. It is usually called
    *encapsulation*.


    # Methods


    Methods are nothing more than properties that hold function values. This is a
    simple method:


    ```

    let rabbit = {};

    ```'
