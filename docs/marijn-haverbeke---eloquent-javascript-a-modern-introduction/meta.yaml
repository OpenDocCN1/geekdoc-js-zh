  md: "To retrieve a given piece of information that it doesn't have in its own storage\
    \ bulb, a nest request might consult random others nests in the network until\
    \ it finds one that has.\n\n```\nrequestType(\"storage\", nest, name) => storage(nest,\
    \ name));\n\nfunction findInStorage(nest, name) {\n  return storage(nest, name).then(found\
    \ => {\n    if (found != null) return found;\n    else return findInRemoteStorage(nest,\
    \ name);\n  });\n}\n\nfunction network(nest) {\n  return Array.from(nest.state.keys());\n\
    }\n\nfunction findInRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
    \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n \
    \     return Promise.reject(new Error(\"Not found\"));\n    } else {\n      let\
    \ source = sources[Math.floor(Math.random()) * sources.length];\n      sources\
    \ = sources.filter(n => n != source);\n      return routeRequest(nest, source,\
    \ \"storage\", name)\n        .then(value => value != null ? value : next(),\n\
    \      next());\n    }\n  }\n  return next();\n}\n```\n\nBecause connections are\
    \ a Map, Object.keys doesn't work on it. It has a keys method, but that returns\
    \ an iterator rather than an array. An iterator (or iterable value) can be converted\
    \ to an array with Array.from function.\n\nEven with promises this is some rather\
    \ awkward code. Multiple asynchronous actions are chained in non-obvious ways.\
    \ We again need a recursive function (next) to model looping through the nests.\n\
    \nAnd the thing the code actually does is completely linear—it always waits for\
    \ the previous action to complete before starting the next one. In a synchronous\
    \ programming model, it'd be simpler to express.\n\nThe good news is that JavaScript\
    \ allows you to write pseudo-synchronous code to describe asynchronous computation.\
    \ An async function is a function that implicitly returns a promise and that can,\
    \ in its body, await other promises in a way that looks synchronous.\n\nWe can\
    \ rewrite findInStorage like this:\n\n```\nasync function findInStorage(nest,\
    \ name) {\n  let local = await storage(nest, name);\n  if (local == null) return\
    \ local;\n\nlet sources = network(nest).filter(n => n != nest.name);\n```"
