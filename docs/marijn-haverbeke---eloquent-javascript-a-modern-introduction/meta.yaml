    # ## Recursion


    We’ve seen that % (the remainder operator) can be used to test whether a number
    is even or odd by using % 2 to see whether it is divisible by two. Here’s another
    way to define whether a positive number is even or odd:


    +   * Zero is even.

    * One is odd.

    * For any other number $N$, its evenness is the same as $N-2$.


    Write a recursive function `isEven` corresponding to this description. The function
