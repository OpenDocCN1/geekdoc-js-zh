    \    </p>\n    <p>\n      I also wrote a book! Read it here\n    </p>\n  </body>\n\
    </html>\n```\n\nThe data structure the browser uses to represent the document\
    \ follows this shape. For each box, there is an object, which we can interact\
    \ with to find out such as what HTML tag represents and which boxes and text it\
    \ contains. This representation is called the Document Object Model, or DOM for\
