  md: "```\nlog.count(\" .animal inside\"); // Animal inside of <p>\n// 2\nlog.count(\"\
    \ .animal inside\"); // Direct child of <p>\n// 1\n<script>\n```\n\nUnlike methods\
    \ like getElementsByTagName, the object returned by querySelectorAll is not live.\
    \ It won't change when you change the document. It is not a real array, though,\
    \ so you still need to call Array.from if you want to treat it like one.\n\nThe\
    \ querySelector method (without the All part) works in a similar way. This one\
    \ is useful if you want a specific, single element. It will return only the first\
    \ matching element or null when none matches.\n\n# # Positioning and Animating\n\
    \nThe position style property influences layout in a powerful way. By default\
    \ it has a value of static, meaning the element sits in its normal place in the\
    \ document. When it is set to relative, the element still takes up space in the\
    \ document, but now the top and left style properties can be used to move it relative\
    \ to that normal place. When position is set to absolute, the element is removed\
    \ from the normal document flow—that, it no longer takes up space and may overlap\
    \ with other elements. Also, its top and left properties can be used to absolutely\
    \ position it relative to the top-left of the nearest enclosing element whose\
    \ position property isn't static, or relative to the document if no such enclosing\
    \ element exists.\n\nWe can use this to create an animation. The following document\
    \ displays a picture of a cat that moves around in an ellipse:\n\n```\n<p style=\"\
    text-align: center\">\n<img src=\"cat.png\" style=\"position: relative\">\n</p>\n\
    \n<script>\nlet cat = document.querySelector(\"img\");\nlet angle = Math.PI /\
    \ 2;\nfunction animate(time, lastTime) {\n  if (lastTime != null) {\n    angle\
    \ += (time - lastTime) * 0.001;\n  }\n  cat.style.top = Math.sin(angle) * 20 +\
    \ \"px\";\n  cat.style.left = Math.cos(angle) * 200 + \"px\";\n  requestAnimationFrame(newTime\
    \ => animate(newTime, time));\n}\nrequestAnimationFrame(animate);\n</script>\n\
    ```\n\nThe gray arrow shows the path along which the image moves."
