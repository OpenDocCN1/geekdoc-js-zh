    Strings written with single or double quotes behave very much the same—the only
    difference is in which type of quote you need to escape inside of. Backtick-quoted
    strings, usually called template literals, can do a few more tricks. Apart from
    being able to span lines, they can also embed other values.


    ```

    `half of 100 is ${100 / 2}`

