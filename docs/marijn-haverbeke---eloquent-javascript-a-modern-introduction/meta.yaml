  md: "# Growing Functions\n\nThere are two more or less natural ways for functions\
    \ to be introduced into programs.\n\nThe first is that you find yourself writing\
    \ similar code multiple times. You'd prefer not to do that for. Having more code\
    \ means more space for mistakes to hide and more material to read for people trying\
    \ to understand the program. So you take the repeated functionality, find a good\
    \ name for it, and put it into a function.\n\nThe second way is that you find\
    \ you need some functionality that you haven't written yet and sounds like it\
    \ deserves its own function. You'll start by naming the function, and then you'll\
    \ write its body. You might even start writing code that uses the function before\
    \ you define the function itself.\n\nHow difficult it is to find a good name for\
    \ a function is a good indication of how clear a concept it is you're trying to\
    \ wrap. Let's go through an example.\n\nWe want to write a program that prints\
    \ two numbers: the numbers of cows and chickens on a farm, with the words cows\
    \ chickens after them and zeros padded before both numbers so that they are always\
    \ three digits long.\n\n![](bbox=[0.023, 0.415, 0.976, 0.458])\n\nThis asks for\
    \ a function of two arguments—the number of cows and the number of chickens. Let's\
