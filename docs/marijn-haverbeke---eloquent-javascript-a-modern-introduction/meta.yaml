    \ closest approximation for that in a JavaScript number—is Math.PI. There is an\
    \ old tradition of writing the names of constant values in all caps.\n\n```\n\
    function randomPointOnCircle(radius) {\n  let angle = Math.random() * 2 * Math.PI;\n\
    \  return {x: radius * Math.cos(angle),\n         y: radius * Math.sin(angle)};\n\
