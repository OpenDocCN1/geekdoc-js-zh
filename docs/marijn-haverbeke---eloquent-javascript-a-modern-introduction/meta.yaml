    \ + table[3]) *\n  (table[0] + table[1]) *\n  (table[1] + table[3]) *\n  (table[0]\
    \ + table[2]);\n}\n\nconsole.log(phi([76, 9, 4, 1]));\n// 0.0685994934\n```\n\n\
    This is a direct translation of the $\\phi$ formula into JavaScript. Math.sqrt\
    \ is the square root function, provided by the `Math` object in a standard JavaScript\
    \ environment. We have to add two fields from the table to get fields like $n_i$\
    \ because the sums of rows or columns are not stored directly in our data structure.\n\
    \nJacques kept his journal for three months. The resulting data is available in\
    \ the coding sandbox for this chapter (https://eloquentjavascript.net/code#4),\
    \ where it is stored in the journal binding and in a downloadable file.\n\nTo\
    \ extract a two-by-two table for a specific event from the journal, we must loop\
    \ over all the entries and tally how many times the event occurs in relation to\
    \ squirrel transformations.\n\n```\nfunction tableFor(event, journal) {\n  let\
    \ table = [0, 0, 0, 0];\n  for (let i = 0; i < journal.length; i++) {\n    let\
    \ entry = journal[i], index = 0;\n    if (entry.events.includes(event)) index\
    \ += 1;\n    if (entry.squirrel) index += 2;\n    table[index] += 1;\n  }\n  return\
    \ table;\n}\n\nconsole.log(tableFor(\"pizza\", JOURNAL));\n// [76, 9, 4, 1]\n\
    ```\n\nArrays have an method that checks whether a given value exists in the array.\
    \ The function uses that to determine whether the event name it is interested\
    \ in is part of the event list for a given day.\n\nThe body of the loop in tableFor\
    \ figures out which box in the table each journal entry falls into by checking\
    \ whether the entry contains the specific event it's interested in and whether\
    \ it happens alongside squirrel incident. The loop then adds one to the correct\
    \ box in the table.\n\nWe now have the tools we need to compute individual correlations.\
    \ The only step remaining is to find a correlation for every type of event that\
    \ was recorded and see whether anything stands out."
