    HTML, which stands for Hypertext Markup Language, is the document format used
    for web pages. An HTML document contains text, as well as tags that give structure
    to the text, describing things such as links, paragraphs, and headings.


    A short HTML document might look like this:


    ```

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>My home page</title>

    </head>

    <body>

    <h1>My home page</h1>

