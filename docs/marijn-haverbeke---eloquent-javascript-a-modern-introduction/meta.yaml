  md: '![](bbox=[0.068, 0.015, 0.931, 0.148])


    Our expression matches if we can find a path from the left side of the diagram
    to the right side. We keep a current position in the string, and every time we
    move through a box, we verify that the part of the string after our current position
    matches box.


    So if we try to match "the 3 pigs" from position 4, our progress through the flow
    chart would look like this:


    +   - At position 4, there is a word boundary, so we can move past the first box.

    - At position 4, we find a digit, so we can also pass the second box.

    - At position 5, one path loops back to the second (digit) box, while the other
    moves forward through the box that holds a single space character. There is a
    space here, not a digit, so we must take the second path.

    - We are now at position 6 (the start of *pigs*) and at the three-way branch in
    the diagram. We do not see *cow* or *chicken* here, but we do see *pig*, so we
    take that branch.

    - At position 9, after the three-way branch, one path skips the *s* box and goes
    straight to the final word boundary, while the other path matches an *s*. There
    is an *s* character here, not a word boundary, so we go through the *s* box.

    - At position 10 (the end of the string) and can match only a word boundary. The
    end of a string counts as a word boundary, so we go through the last box and have
    successfully matched this string.


    # # Backtracking


    The regular expression `/\b([0-1]+b|[da-f]+b)\b/` matches either a binary number
    followed by a *b*, a hexadecimal number (that is, base 16, with the letters *a*
    to *f* standing for the digits 10 to 15) followed by an *b*, or a regular decimal
    number with no suffix character. This is the corresponding diagram:'
