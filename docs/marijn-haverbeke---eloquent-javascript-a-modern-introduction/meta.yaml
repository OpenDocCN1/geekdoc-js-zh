  md: 'Even if you see the problem already, pretend for a moment that you don''t.
    We know that our program is malfunctioning, and we want to find out why.


    This is where you must resist the urge to start making random changes to the code
    to see whether that makes it better. Instead, think. Analyze what is happening
    and come up with a theory of why it might be happening. Then, make additional
    observations to test this theory—or, if you don''t yet have a theory, make additional
    observations to help you come up with one.


    Putting a few strategic console.log calls into the program is a good way to get
    additional information about what the program is doing. In this case, we want
    n to take the values 13, 1, and then n. Let''s write out its value at the start
    of the loop.


    ```

    13

    1

    0.13

    0.013

    ...

    1.Se-323

    ```


    Right. Dividing 13 by 10 does not produce a whole number. Instead of n /= base,
    what we actually want is n = Math.floor(n / base) so that the number is properly
    "shifted" to the right.


    An alternative to using console.log to peek into the program''s behavior is to
    use the debugger capabilities of your browser. Browsers with the ability to set
    a breakpoint on a specific line of your code. When the execution of the program
    reaches a line with a breakpoint, it is paused, and you can inspect the values
    of bindings at that point. I won''t go into details, as debuggers differ from
    browser to browser, but look in your browser''s developer tools or search the
    web for more information.


    Another way to set a breakpoint is to include a debugger statement (consisting
    of simply that keyword) in your program. If the developer tools of your browser
    are active, the program will pause whenever it reaches such a statement.


    # Error Propagation


    Not all problems can be prevented by the programmer, unfortunately. If your program
    communicates with the outside world in any way, it is possible to get malformed
    input, to become overloaded with work, or to have the network fail.


    If you''re programming only for yourself, you can afford to ignore such problems
    until they occur. But if you build something that is going to be used by anybody
    else, you usually want the program to do better than just crash. Sometimes the
    right thing to do is to take the bad input in stride and continue running. In
    other cases, the program has to actively do something in response to the problem.


