  md: '# Strings


    The next basic data type is the string. Strings are used to represent text. They
    are written by enclosing their content in quotes.


    ![](bbox=[0.021, 0.101, 0.979, 0.163])


    You can use single quotes, double quotes, or backticks to mark strings, as long
    as the quotes at the start and the end of the string match.


    Almost anything can be put between quotes, and JavaScript will make a string value
    out of it. A few characters are more difficult. You can imagine putting quotes
    between quotes might be harder. Newlines (the characters you get when you press
    ENTER) can be included without escaping only when the string is quoted with backticks
    ('''').


    To make possible to include such characters in a string, the following notation
    is used: whenever a backslash (\ is found inside quoted text, it indicates that
    the character after it has a special meaning. This is called *escaping* the character.
    A quote that is preceded by a backslash will not end the string but be part of
    it. If an n character occurs after a backslash, it is interpreted as a newline.
    Similarly, a t after a backslash means a tab character. Take the following string:


    ```


    ```


    The actual text contained in this is:


    This is the first line

    And this is the second


    There are, of course, situations where you want a backslash in a string to be
    just a backslash, not a special code. If two backslashes follow each other, they
    will collapse, and only one will be left in the resulting string value. This is
    how the string "A newline character is written like \\n\" can be expressed:


    ```

    "A newline character is written \\n"

    ```


    Strings, too, have to be modeled as a series of bits to be able to exist inside
    the computer. The way JavaScript does this is based on the *Unicode* standard.
    This standard assigns a number to virtually every character you would ever need,
    including characters from Greek, Arabic, Japanese, Armenian, and so on. If we
    have a number for every character, a string can be described by a sequence of
    numbers.


    And that''s what JavaScript does. But there''s a complication: JavaScript''s representation
    uses 16 bits per string element, which can describe up to 2¹16 different characters.
    But Unicode defines more characters than that—about twice as many, at this point.
    So some characters, such as many emoji, take up two “character positions” in JavaScript'
