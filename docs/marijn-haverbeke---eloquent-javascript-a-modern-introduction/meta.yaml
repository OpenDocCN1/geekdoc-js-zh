    # # Compilation


    What we have built an interpreter. During evaluation, it acts directly on the
    representation of the program produced by the parser.


    *Compilation* is the process of adding another step between the parsing and the
    running of a program, which transforms the program into something that can be
    evaluated more efficiently by doing as much work as possible in advance. For example,
    in well-designed languages it is obvious, each use of a binding, binding is being
    referred to, without actually running the program. This can be used to avoid looking
    up the binding by name every time it is accessed, instead directly fetching it
    from some memory location.


    Traditionally, compilation involves converting the program to machine code, the
    raw format that a computer''s processor can execute. Any process that converts
    a program to a different representation can be thought of as compilation.


    It would be possible to write an alternative evaluation strategy for Egg, one
    that first converts the program to a JavaScript program, uses Function to invoke
    the JavaScript compiler on it, and then runs the result. When done, this would
    make Egg very fast while still being quite simple to implement.


    If you are interested in this topic and willing to spend some time on it, I encourage
    you to try to implement such a compiler as an exercise.


    # # Cheating


    When we defined if and while, you probably noticed that they were more or less
    trivial wrappers around JavaScript''s own if and while. Similarly, the values
    in Egg are just regular old JavaScript values.


    If you compare the implementation of Egg, built on top of JavaScript, with the
    amount of work and complexity to build a programming language directly on the
    raw functionality provided by a machine, the difference is huge. Regardless, this
    example gave you an impression of the way programming languages work.


    And when it comes to getting something done, cheating is more effective than doing
    everything yourself. Though the toy language in this chapter doesn''t do anything
    that couldn''t be better done in JavaScript, there are *situations* where writing
    small languages help get work done.'
