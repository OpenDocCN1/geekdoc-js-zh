  md: 'The language has since been adopted by all other graphical web browsers. It
    has made web applications possible—applications which you can interact directly
    without doing a page reload for every action. JavaScript is also used in more
    traditional websites to provide various forms of interactivity and cleverness.


    It is important to note that Javascript has almost nothing to do with the programming
    language Java. The similar name was introduced by marketing considerations rather
    than good judgment. When JavaScript was introduced, the Java language was heavily
    marketed and gaining popularity. Someone thought it was a good idea to ride along
    on this success. Now we are stuck with the name.


    After its adoption outside of Netscape, a standard document was written to describe
    the way the JavaScript language should work so that the various pieces of software
    that claimed JavaScript were actually talking about the same language. This is
    called the ECMAScript standard, after the ECMA International organization that
    did the standardization. In practice, the terms ECMAScript and JavaScript can
    be used interchangeably—they are two names for the same language.


    There are those who will say terrible things about JavaScript. Many of these things
    are true. When I was required to write something in JavaScript for the first time,
    I quickly came to despise it. It would accept almost I typed but interpret it
    in a way that was completely different from what I meant. I had a lot to do with
    the fact that I had no clue what I was doing, of course, but there is a real issue
    here: JavaScript is ridiculously liberal in what it allows. The idea behind this
    design was that it would make programming in JavaScript easier for beginners.
    In reality, it mostly makes finding problems in your programs harder because the
    system will not point them out to you.


    This flexibility also has its advantages, though. It leaves space for a lot of
    techniques that are impossible in more rigid languages, and as you will see (for
    example in Chapter 10), it can be used to overcome some of JavaScript''s shortcomings.
    After learning the language properly and working with it for a while, I have learned
    to act like JavaScript.


    There have been several versions of JavaScript. ECMAScript version 3 was the widely
    supported version in the time of JavaScript''s ascent to dominance, roughly between
    2000 and 2010. During this time, work was underway on an ambitious version 4,
    which planned a number of radical improvements and extensions to the language.
    Changing a living, widely used language in such a radical way turned out to be
    politically difficult, and work on version 4 was abandoned in 2008, leading to
    a much less ambitious version 5. Released in 2009, version 5 made only some uncontroversial
    improvements. Then in 2015 version 6 came out, a major update that included some
    of the ideas planned for version 4. Since then we''ve had new, small updates every
    year.


    The fact that the language is evolving means that browsers have to constantly
    keep up, and if you''re using an older browser, it may not support every feature.
    The language designers are careful not to make any changes that could break existing
    programs, so new browsers can still run old programs. In this book, I''m using
    the 2017 version of JavaScript.


    Web browsers are not the only platforms on which JavaScript is used. Some databases,
    such as'
