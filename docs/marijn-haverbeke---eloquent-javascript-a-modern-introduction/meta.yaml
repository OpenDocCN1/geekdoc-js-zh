  md: 'A typical tree has different kinds of nodes. The syntax tree for the Egg language
    has identifiers, values, and application nodes. Application nodes may have children,
    whereas identifiers and values are leaves, or nodes without children.


    The same goes for the DOM. Nodes for elements, which represent HTML tags, determine
    the structure of the document. These can have children. An example of such a node
    is document.body. Some of these children can be leaf nodes, as pieces of text
    or comment nodes.


    Each DOM object has a nodeType property, which contains a code (number) that identifies
    the type of node. Elements have code 1, which is also defined as the constant
    property Node.ELEMENT_NODE. Text nodes, representing a section of text in the
    document, get code 3 (Node.TEXT_NODE). Comments have code 8 (Node.COMMENT_NODE).


    Another way to visualize our document tree is as follows:


    ![](bbox=[0.275, 0.313, 0.825, 0.563])


    The leaves are text nodes, and the arrows indicate parent-child relationships
    between nodes.


    # The Standard


    Using cryptic numeric codes to represent node types is not a very JavaScript-like
    thing to do. Later in this chapter, we''ll see that other parts of the DOM interface
    also feel cumbersome and alien. The reason for this is that the DOM wasn''t designed
    for just JavaScript. Rather, it tries to be a language-neutral interface that
    can be used in other systems as well—not just for HTML but also for XML, which
    is a generic data format with an HTML-like syntax.


    This is unfortunate. Standards are often useful. But in this case, the advantage
    (cross-language consistency) isn''t all that compelling. Having an interface that
    is properly integrated with the language you are using will save you more time
    than having a familiar interface across languages.


    As an example of this poor integration, consider the childNodes property that
    elements in the DOM have array-like object, with a length property and properties
    labeled to access the child nodes. But it is an instance of the NodeList type,
    not a real array, so it does not have methods such as slice or map.'
