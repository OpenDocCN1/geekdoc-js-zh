  md: 'When a given node wants to talk to single other node, flooding is not a very
    efficient approach.


    An alternative approach is to set up a way for messages to hop from node to node
    until they reach their destination. The difficulty with that is it requires knowledge
    about the layout of the network. To send a request in the direction of a faraway
    nest, it is necessary to know which neighboring nest gets it closer to its destination.
    Sending it in the wrong direction will not do much good.


    Each nest knows only about its direct neighbors, it doesn''t have the information
    it needs to compute a route. We must somehow spread the information about these
    connections to all nests, in a way that allows it to change over time, when nests
    are abandoned or new nests are built.


    We can use flooding, but instead of checking whether a given message has already
    been received, we now check whether the set of neighbors for a given nest matches
    the current set we have for.


    ```

    requestType("connections", (nest, {name, neighbors}, source)) => {

    let connections = nest.state.connections;

    if (JSON.stringify(connections.get(name)) ==nJSON.stringify(neighbors)) return;

    connections.set(name, neighbors);

    broadcastConnections(nest, name, source);

    }


    function broadcastConnections(nest, name, exceptFor = null) {

    for (let neighbor of nest.neighbors) {

    if (neighbor == exceptFor) continue;

    request(nest, neighbor, "connections", {

    name,

    neighbors: nest.state.connections.get(name)

    });

    }

    }


    ewhere(nest) => {

    nest.state.connections = new Map;

    nest.state.connections.set(nest.name, nest.neighbors);

    broadcastConnections(nest, nest.name);

    });

    ```


    The comparison uses JSON.stringify because ==, on objects or arrays, will return
    true only when the two are the exact same value, which is not what we need here.
    Comparing the JSON strings is a crude but effective way to compare their content.


    The nodes immediately start broadcasting their connections, which should, unless
    some nests are completely unreachable, quickly give every nest a map of the current
    network graph.


    A thing you can do with graphs is find routes, as we saw in Chapter 7. If we have
    a route towards a message''s destination, we know which direction to send it.


    This findRoute function, which greatly resembles the findRoute function from Chapter
    7, searches'
