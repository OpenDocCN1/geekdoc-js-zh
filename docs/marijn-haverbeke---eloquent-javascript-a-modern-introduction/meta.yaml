    \ documentElement property refers to the object representing the `<html>` tag.\
    \ Since every HTML document has a head and a body, it also has head and body properties,\
    \ pointing at those elements.\n\n# Trees\n\nThink back for a moment to the syntax\
    \ trees from “Parsing” on page 203. Their structures are strikingly similar to\
    \ the structure of a browser’s document. Each node may refer to other nodes, *children*,\
    \ which in turn may have their own children. This shape is typical of nested structures\
    \ where elements can contain subelements that are similar to themselves.\n\nWe\
    \ call a data structure a tree when it has a branching structure, has no cycles\
    \ (a node may not contain itself, directly or indirectly), and has a single, well-defined\
    \ root. In the case of the DOM, document.documentElement serves as the root.\n\
    \nTrees come up in computer science. In addition to representing recursive structures\
    \ such as HTML documents or programs, they are often used to maintain sorted sets\
    \ of data because"
