  md: "do that, it has to be able to deliberately move toward a given parcel or toward\
    \ the location where a parcel has be delivered. Doing that, even when the goal\
    \ is more than one away, it will require some kind of route-finding function.\n\
    \nThe problem of finding a route through a graph is a typical search problem.\
    \ We can tell whether a given solution (a route) is a valid solution, but we can't\
    \ directly compute the solution we need for 2 + 2. Instead, we have to keep creating\
    \ potential solutions until we find one that works.\n\nThe number of possible\
    \ routes through a graph is infinite. But searching for a route from A to B, we\
    \ are interested in only the ones that start at A. We also don't care about routes\
    \ that visit the same place twice—those are definitely not the most efficient\
    \ route anywhere. That cuts down the number of routes that the finder has to consider.\n\
    \nIn fact, we are most interested in the shortest route. So we want to make sure\
    \ we look at routes before we look at longer ones. A good approach would be to\
    \ “grow” routes from the starting point, exploring every reachable place that\
    \ hasn't been visited, until a route reaches the goal. That way, we'll only explore\
    \ routes that are potentially interesting, and we'll find the shortest route (or\
    \ one of the shortest routes, if there are more than one) to the goal.\n\nHere\
    \ is a function that does this:\n\n```\nfunction findRoute(graph, from, to) {\n\
    let work = [[at: from, route: []]];\nfor (let i = 0; i < work.length; i++) {\n\
    \  let (at, route) = work[i];\n  for (let place of graph[at]) {\n    if (place\
    \ == to) return route.concat(place);\n    if (!work.some(w => w.at == place))\
    \ {\n      work.push(at: place, route: route.concat(place));\n    }\n  }\n}\n\
    }\n```\n\nThe exploring has to be done in the right order—the places that we reached\
    \ first have to be explored first. We can't immediately explore a place as soon\
    \ as we reach it because that would mean places reached from *there* would also\
    \ be explored immediately, and so on, even though there may be other, shorter\
    \ paths that haven't been explored.\n\nTherefore, the function keeps a work list.\
    \ This is an array of places that should be explored next, along with the route\
    \ got us there. It starts with just the start position and an empty route.\n\n\
    The search operates by taking the next item in the list and exploring that, which\
    \ means all roads from that place are looked at. If one of them is the goal, a\
    \ finished route can be returned. Otherwise, if we haven't looked at this place\
    \ before, a new item is added to the list. If we have looked at it before, because\
    \ we are looking at short routes first, we've found every longer route to place\
    \ or precisely as the existing one, and we don't need to explore it.\n\nYou can\
    \ visually imagine this as a web of known routes crawling out from the start location,\
    \ growing ever on all sides (but never tagging back into itself). As soon as the\
    \ first route reaches the goal location, that thread is traced back to the start,\
    \ giving us our route."
