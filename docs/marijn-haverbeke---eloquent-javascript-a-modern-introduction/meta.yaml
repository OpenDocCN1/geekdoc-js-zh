    1" to `<h2>` produce subheadings and two paragraphs `<p>`.


    Tags come in several forms. An element (such as the body


    Some kinds of tags do not enclose and nothing needs to be done. The metadata `meta
    charset="utf-8"` is an example of this.


    To include angle brackets in the text of a document, even though they have a special
    meaning in HTML, yet another form of special notation has to be introduced. A
    plain opening bracket is written as `&lt;` ("less than”), and a closing bracket
    is written as `&gt;` ("greater than”). In HTML, an ampersand `&` is followed by
    a name character or a semicolon (;) which becomes an *entity* and will be replaced
    by the backslashes it encodes.


    This is analogous to the way backslashes are used in JavaScript strings. This
    mechanism gives ampersands a special meaning, too; they need to be escaped as
    `&amp;`. Inside attribute values, which are wrapped in double quotes, `&quot;`
    can be used to insert an actual quote character.


