    \n```\nlet string = \"abc\";\nconsole.log(string.length);\n// 3\nconsole.log(string[1]);\n\
    // b\n```\n\n# Rest Parameters\n\nIt can be useful for a function to accept any\
    \ number of arguments. For example, Math.max computes the maximum of all the arguments\
    \ it is given.\n\nTo write such a function, you put three dots before the function's\
    \ last parameter, like this:\n\n```\nfunction max(...numbers) {\n  let result\
