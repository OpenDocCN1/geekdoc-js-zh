  md: "To notice when something was typed, elements that you can type into, such as\
    \ the <input> and <textarea> tags, fire \"input\" whenever the user changes their\
    \ content. To get the actual content that was typed, it is best to directly read\
    \ it from the focused field. \"Form Fields\" on page 317 will show.\n\n# Pointer\
    \ Events\n\nThere are currently two widely used ways to point at things on a screen:\
    \ mice (including devices that act like mice, such as touchpads and trackballs)\
    \ and touchscreens. These produce different kinds of events.\n\n# Mouse Clicks\n\
    \nPressing a mouse button causes a number of events to fire. The \"mousedown\"\
    \ and \"mouseup\" events are similar to \"keydown\" and \"keyup\" and fire when\
    \ the button is pressed and released. These happen on the DOM nodes that are immediately\
    \ below the mouse pointer when the event occurs.\n\nAfter the \"mouseup\" event,\
    \ a \"click\" event fires on the most specific node that contained both the press\
    \ and the release of the button. For example, if I press the mouse button on one\
    \ paragraph and then move the pointer to another paragraph and release the button,\
    \ the \"click\" event will happen on the element that contains both paragraphs.\n\
    \nIf two clicks close together, a \"dblclick\" (double-click) event also fires,\
    \ after the second click event.\n\nTo get precise information about the place\
    \ where a mouse event happened, you can look at clientX and clientY properties\
    \ which contain the event's coordinates (in pixels) relative to the top-left corner\
    \ of the window, or pageX and pageY, which are relative to the top-left corner\
    \ of the document (which may be different when the window has been scrolled).\n\
    \nThe following implements a primitive drawing program. Every time you click the\
    \ document, it adds a dot under your mouse pointer. See Chapter 19 for a less\
    \ primitive drawing program.\n\n```\n<style>\nbody {\n  height: 200px;\n  background:\
    \ beige;\n}\n.dot {\n  height: 8px; width: 8px; /* rounds corners */\n  border-radius:\
    \ 4px;\n  background: blue;\n  position: absolute;\n}\n</style>\n<script>\nwindow.addEventListener(\"\
    click\", event => {\n  let dot = document.createElement(\"div\");\n  dot.className\
    \ = \"dot\";\n  dot.style.left = (event.pageX - 4) + \"px\";\n```"
  merge: -1
