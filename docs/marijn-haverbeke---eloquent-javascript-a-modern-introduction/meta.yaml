  md: "JavaScript around your program, will run only one thing at a time. You can\
    \ think of this as it running a loop. When there's nothing to do, that loop is\
    \ stopped. But as events come in, they are added to a queue, and their code is\
    \ executed one after the other. Because no two things run at the same time, slow-running\
    \ code might delay the handling of other events.\n\nThis example sets a timeout\
    \ but then dallies until after the timeout's intended point of time, causing the\
    \ timeout to be late.\n\n```\nlet start = Date.now();\nsetTimeout(() => {\n  console.log(\"\
    Timeout ran at\", Date.now() - start);\n}, 20);\nwhile (Date.now() < start + 50)\
    \ {\n  console.log(\"Wasted time until\", Date.now() - start);\n}\n// --> Wasted\
    \ time until 50\n// Timeout ran at 55\n```\n\nPromises always resolve or reject\
    \ as a new event. Even if a promise is already resolved, waiting for it will cause\
    \ your callback to run after the current script finishes, rather than right away.\n\
    \n```\nPromise.resolve(\"Done\").then(console.log);\nconsole.log(\"Me first!\"\
    );\n// --> Me first!\n// --> Done\n```\n\nIn later chapters we'll see various\
    \ other types of events that run on the event loop.\n\n# Asynchronous Bugs\n\n\
    When your program runs synchronously, in a single go, there are no state changes\
    \ happening except those the program itself makes. For asynchronous programs this\
    \ is different—they may have gaps in their execution during which other code can\
    \ run.\n\nLet's look at an example. One of the hobbies of our crows is to count\
    \ the number of chicks that hatch through the village every year. Nests store\
    \ this count in their storage bubbles. The following code tries to enumerate the\
    \ counts from all the nests for a given year:\n\n```\nfunction anyStorage(nest,\
