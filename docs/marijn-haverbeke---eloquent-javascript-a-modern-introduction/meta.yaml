  md: "the event happens in the context of the object they are registered on.\n\n\
    ```\n<button>Click me</button>\n<p>No handler here.</p>\n<script>\nlet button\
    \ = document.querySelector(\"button\");\nbutton.addEventListener(\"click\", ()\
    \ => {\n  console.log(\"Button clicked.\");\n});\n</script>\n```\n\nThat example\
    \ attaching a handler to a button node.licks on the button causes that handler\
    \ to run, but on the rest of the document do not. Giving a node an onclick attribute\
    \ has a similar effect. This works for most types of events—you can attach a handler\
    \ through the attribute whose name is the event in front of it.\n\nBut a node\
    \ can have only one onclick attribute, so you can register only one handler per\
    \ that way. The addEventListener method allows you to add any number of handlers\
    \ so that it is safe to add handlers even if there is already another handler\
    \ on the element.\n\nThe removeEventListener method, called with arguments similar\
    \ to addEventListener, removes a handler.\n\n```\n<button>Act-once button</button>\n\
    <script>\nlet button = document.querySelector(\"button\");\nfunction once() {\n\
    \  console.log(\"Done.\");\n  button.removeEventListener(\"click\", once);\n}\n\
    button.addEventListener(\"click\", once);\n</script>\n```\n\nThe function given\
    \ to removeEventListener has to be the same function value that was given to addEventListener.\
    \ So, to unregister a handler, you'll want to give the function a name (once,\
    \ in the example) to be able to pass the same function value to both methods.\n\
    \n# Event Objects\n\nThough we have ignored it so far, event handler functions\
    \ are passed an argument: the event object. This object holds additional information\
    \ about the event. For example, if we want to know which mouse button was pressed,\
    \ we can look at the event object's button property.\n\n```\n<button>Click me\
    \ any way want</button>\n<script>\nlet button = document.querySelector(\"button\"\
    );\nbutton.addEventListener(\"mousedown\", event) => {\nif (event.button == 0)\
    \ {\n  console.log(\"Left button\");\n} else if (event.button == 1) {\n  console.log(\"\
    Middle button\");\n} else if (event.button == 2) {\n```"
