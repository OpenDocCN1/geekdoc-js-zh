    # # Module Design


    Structuring programs is one of the subtler aspects of programming. Any nontrivial
    piece of functionality can be modeled in various ways.


    Good design is subjective—there are trade-offs involved and matters of taste.
    The best way to learn the value of well-structured design is to read or work on
    a lot of programs and notice what works and doesn’t. Don’t assume that a painful
    mess is “just the way it is.” You can improve the structure of almost everything
    by putting more thought into it.


    One aspect of module design is ease of use. If you are designing something that
    is intended to be used by multiple people—or even by yourself, in three months
    when you no longer remember the specifics of what you did—it is helpful if your
    interface is simple and predictable.


    That may mean following these conventions. A good example is the ini package.
    This module imitates the standard json object by providing parse and stringify(to
    write an INI file) functions, and, like json-3500, converts between strings and
    plain objects. The interface is simple and familiar, and after you’ve worked with
    it, you’re likely to remember how to use it.


    Even if there’s no standard function or widely used package to imitate, you can
    keep your modules predictable by using simple data structures and doing a single,
    focused thing. Many of the INI-file parsing modules on NPM provide a function
    that directly reads a file from the hard disk and parses it, for example. This
    makes it impossible to use such modules in the browser, where we don’t have direct
    file system access, and adds complexity that would have been better addressed
    by composing the module with some file-reading function.


    This points to another helpful aspect of module design—the ease with which something
    can be composed with other code. Focused modules that compute values are applicable
    in a wider range of programs than bigger modules that perform complicated actions
    with side effects. An INI file reader that insists on reading the file from disk
    is useless in a scenario where the file’s content comes from some other source.


    Relately, stateful objects are sometimes useful or even necessary, but if something
    can be done with a function, several of the INI file readers on NPM provide an
    interface that requires you to first create an object, then load the file into
    your object, and finally use specialized methods to get the results. This type
    of thing is common in the object-oriented tradition and it’s terrible. Instead
    of making a single function call and moving on, you have to perform the ritual
    of moving your object through various states. And because the data is not wrapped
    in a specialized object type, all code that interacts with it has to know about
    that type, creating unnecessary interdependencies.


    Often defining new data structures can’t be avoided—only a few basic ones are
    provided by the language standard, and many types of data can be more complex
    than an array or a map. But*'
