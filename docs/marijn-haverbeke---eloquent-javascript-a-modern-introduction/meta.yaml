  md: "A promise creates a promise, you can use Promise as a constructor. It has a\
    \ somewhat odd interface—the constructor expects a function as argument, which\
    \ it immediately calls, passing it function that it can use to resolve the promise.\
    \ It works this way, instead of, for example, with a resolve method, so that only\
    \ the code that created the promise can resolve it.\n\nThis is how you create\
    \ a promise-based interface for the readStorage function:\n\n```\nfunction storage(nest,\
    \ name) {\n  return new Promise(resolve => {\n    nest.readStorage(name, result\
    \ => resolve(result));\n  });\n}\n\nstorage(bigOak, \"enemies\")\n.then(value\
    \ => console.log(\"Got\", value));\n```\n\nThis asynchronous function returns\
    \ a meaningful value. This is the main advantage of promises—they simplify the\
    \ use of asynchronous functions. Instead of having to pass around callbacks, promise-based\
    \ functions look similar to regular ones: they take input as arguments and return\
    \ their output. The only difference is that the output may not be available yet.\n\
    \n# Failure\n\nRegular JavaScript computations can fail by throwing an exception.\
    \ Asynchronous computations often need something like that. A network request\
    \ may fail, or some code that is part of the asynchronous computation may throw\
    \ an exception.\n\nOne of the most pressing problems with the callback style of\
    \ asynchronous programming is that it makes extremely difficult to make sure failures\
    \ are properly reported to the callbacks.\n\nA widely used convention is that\
    \ the first argument to the callback is used to indicate that the action failed,\
    \ and the second contains the value produced by the action when it was successful.\
    \ Such callback functions must always check whether they received an exception\
    \ and make sure any problems they cause, including exceptions thrown by functions\
    \ they call, are caught and given to the right function.\n\nPromises make this\
    \ easier. They can be either resolved (the action finished successfully) or rejected\
    \ (it failed). Resolve handlers (as registered with then) are only called when\
    \ the action is successful, and rejects are automatically propagated to the new\
    \ promise that is returned by them. And when a handler throws an exception, this\
    \ automatically causes the promise produced by its call to be rejected. So if\
    \ any element in a chain of asynchronous actions fails, the outcome of the whole\
    \ chain is marked as rejected, and no success handlers are called beyond the point\
    \ where it failed.\n\nMuch like resolving a promise provides a value, rejecting\
    \ one also provides one, usually called the reason. When an exception in a handler\
    \ function catches the rejection, the exception is used as the reason. Similarly,\
    \ when a handler returns a promise that is rejected, rejection flows into the\
    \ next promise. A Promise.reject function that creates a new, immediately rejected"
