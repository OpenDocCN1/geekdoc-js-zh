  md: "```\nlet source = sources[Math.floor(Math.random() * sources.length]);\nsources\
    \ = sources.filter(n => n != source);\n```\n\n```\ntry {\n  let found = await\
    \ routeRequest(nest, source, \"storage\",\n  name);\n  if (found != null) return\
    \ found;\n} catch (_) {\n  throw new Error(\"Not found\");\n}\n```\n\nAn async\
    \ function is marked by the async word before the function keyword. Methods can\
    \ also be made async by writing async before their name. When such a function\
    \ or method is called, it returns a promise. As soon as the body returns something,\
    \ the promise is resolved. If it throws an exception, the promise is rejected.\n\
    \nInside an async function, the word await can be put in front of an expression\
    \ to wait for a promise to resolve and then continue the execution of the function.\n\
    \nSuch a function no longer, like a regular JavaScript function, runs from start\
    \ to completion in one go. Instead, it can be frozen at any point that has an\
    \ await, and can be resumed at a later time.\n\nFor nontrivial asynchronous code,\
    \ this notation is usually more convenient than directly using promises. Even\
    \ if you need to do something that doesn't fit the synchronous model, such as\
    \ perform multiple actions at the same time, it is easy to combine await with\
    \ the direct use of promises.\n\n# Generators\n\nThis ability of functions to\
    \ be paused and resumed again is not exclusive to async functions. JavaScript\
    \ also has a feature generator functions. These are similar, but without the promises.\n\
    \nWhen you define a function with function* (placing an asterisk after the word\
    \ function), it becomes a generator. When you call a generator, it returns an\
    \ iterator, which we already saw in Chapter 6.\n\n```\nfunction* powers(n) {\n\
    \  for (let current = n; current *= n) {\n    yield current;\n  }\n}\n```\n\n\
    ```\nfor (let power of powers(3)) {\n  if (power > 50) break;\n  console.log(power);\n\
    }\n\n// 3\n// 9\n// 27\n```\n\nInitially, when you call powers, the function is\
    \ frozen at its start. Every time you call next on the iterator, the function\
    \ runs until it hits a yield expression, which pauses it and causes the yielded\
    \ value"
