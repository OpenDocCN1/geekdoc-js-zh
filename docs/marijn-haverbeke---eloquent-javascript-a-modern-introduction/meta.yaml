  md: "crow nest computers have a long-term data storage bulb, where pieces of information\
    \ are etched into twigs so that they can be retrieved. Etching, or finding a piece\
    \ of data, takes a moment, so the interface to long-term storage is asynchronous\
    \ and uses callback functions.\n\nStorage bulbs store pieces of JSON-encodable\
    \ data names. A crow might store information about the places where it's hidden\
    \ under the name \"food caches\", which could hold an array of names that point\
    \ at other pieces of data, describing the actual cache. To look up a food cache\
    \ in the storage bulbs of the Big Oak nest, a crow could run code like this:\n\
    \n```\nimport {bigOak} from \"./crow-tech\";\n\nbigOak.readStorage(\"food caches\"\
    , caches => {\n  let firstCache = caches[0];\n  bigOak.readStorage(firstCache,\
    \ info) => {\n    console.log(info);\n  });\n});\n```\n\n(All binding names and\
    \ strings have been translated from crow language to English.)\n\nThis style of\
    \ programming is workable, the indentation level increases with each asynchronous\
    \ action when you end up in another function. Doing more complicated things, such\
    \ as running multiple actions at the same time, can get a little awkward.\n\n\
    Crow nest computers are built to communicate using request-response pairs. That\
    \ means one nest sends a message to another nest, which then immediately sends\
    \ a message back, confirming receipt and possibly including a reply to a question\
    \ asked in the message.\n\nEach message is tagged with a *type*, which determines\
    \ how it is handled. Our code can define handlers for specific request types,\
    \ and when such a request comes in, the handler is called to produce a response.\n\
    \nThe interface exported by the \"./crow-tech\" module provides callback-based\
    \ functions for communication. Nests have a send method that sends off a request.\
    \ It expects the name of the target nest, the type of the request, and the content\
    \ of the request as its three arguments, and it expects a function to call when\
    \ a response comes in as its fourth and last argument.\n\n```\nbigOak.send(\"\
    Cow Pasture\", \"note\", \"Let's call loudly at 7PM\",\n  () => console.log(\"\
    Note delivered.\"));\"));\n```\n\nBut to make nests capable of receiving that\
    \ request, we first have to define a request type \"note\". The code that handles\
    \ the request has to run not just on this nest-computer but on all nests that\
    \ can receive messages of this type. We'll assume that a crow flies over and installs\
    \ our handler code on all the nests.\n\n```\nimport {defineRequestType} from \"\
    ./crow-tech\";\n\ndefRequestType(\"note\", (nest, content, source, done) => {\n\
    \  console.log(`\\${nest.name} received note: \\${content}`);\n  done();\n});\n\
    ```"
