    \ values aren't part of that array. As, in max, it is the only parameter, which\
    \ will hold all arguments.\n\nYou can use a similar three-dot notation to call\
    \ a function with an array of arguments.\n\n```\nlet numbers = [5, 1, 7];\nconsole.log(max(...numbers));\n\
    ```"
