  md: "# 14\nTHE DOCUMENT OBJECT MODEL\n\nWhen you open a web page in your browser,\
    \ the browser retrieves the page’s HTML text and parses it, much like the way\
    \ our parser from Chapter 12 parsed previous programs. The browser builds up a\
    \ model of the document’s structure and uses this model to draw the page on the\
    \ screen.\n\nThis representation of the document is one of the toys that a JavaScript\
    \ program has available in its sandbox. It is a data structure that you can read\
    \ or modify. It acts as a live data structure: when it’s modified, the page on\
    \ the screen is updated to reflect the changes.\n\n# Document Structure\n\nYou\
    \ can imagine an HTML document as a nested set of boxes. Tags such as <body> and\
    \ </body> enclose other tags, which in turn contain other tags or text. Here’s\
    \ the example document from the previous chapter:\n\n```\n<!doctype html>\n<html>\n\
    <head>\n  <title>My home page</title>\n</head>\n<body>\n  <h1>My home page</h1>\n\
    \  <p>Hello, I am Marijn and this is my home page.</p>\n  <p>I also wrote a book!\
    \ Read it</p>\n  <a href=\"http://eloquentjavascript.net\">here</a>.</p>\n</body>\n\
    </html>\n```\n\nThis page has the following structure:"
