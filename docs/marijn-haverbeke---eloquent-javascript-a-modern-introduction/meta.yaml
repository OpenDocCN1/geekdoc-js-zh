  md: 'When you define a binding without giving it a value, the tentacle has nothing
    to grasp, so it enters in thin air. If you ask for the value of an empty binding,
    you''ll get the value undefined.


    A single let statement can define multiple bindings. The definitions must be separated
    by commas.


    ```

    let one = 1, two = 2;

    console.log(one + two);

    // 3

    ```


    The words var and const can also be used to create bindings, in a way similar
    to the let.


    ```

    var name = "Ayda";

    const greeting = "Hello ";

    console.log(greeting + name);

    // Hello Ayda

    ```


    The first var (short for "variable"), is how the bindings were declared in pre-2015
    JavaScript. I will get back to the precise way it differs from let in the next
    chapter. For now, remember that it mostly does the same thing, but we''ll rarely
    use it in this book because it has some confusing properties.


    The word const stands for *constant*. It defines a binding, which points at the
    same value for as long as it lives. This is useful for bindings that give a name
    to a value so that you can easily refer to it later.


    # # Binding Names


    Binding names can be any word. Digits can be part of binding names—catch22 is
    a valid name, for example—but the name must not start with a digit. A binding
    name may include dollar signs ($) or underscores (_) but no other punctuation
    or special characters.


    Words with special meaning, such as let, are *keywords*, and they may not be used
    as binding names. There are also a number of words that are "reserved for use"
    in future versions of JavaScript, which also can''t be used as binding names.
    The full list of keywords and reserved words is rather long.


    ```

    break case catch class const debugger default

    delete do else export extends finally finally

    function if implements import in Instanceof let

    new package protected public static super

    switch this throw true type var void while with yielded

    ```


    Don''t worry about memorizing this list. When creating a binding produces an unexpected
    syntax error, see whether you''re trying to define a reserved word.


    # # The Environment


    The collection of bindings and their values that exist at a given time is called
    the *environment*. When'
