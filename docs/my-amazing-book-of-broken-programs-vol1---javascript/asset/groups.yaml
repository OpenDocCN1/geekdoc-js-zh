    - **JavaScript**: A type of file that allows a webpage to change information without
    reloading

    - **code**: The instructions that tell the computer what to do

    - **online**: On the internet

    - **comment**: Messages that a human can read but a computer can''t

    - **parameter**: A piece of information that you pass between elements of a program

    - **console**: The screen that shows feedback from the computer

    - **program**: A full set of code

    - **CSS (Cascading Style Sheets)**: A file written in a special language to tell
    the computer how elements should look

    - **programming**: Writing programs

    - **random**: Picked without a noticeable pattern

    - **royalty-free**: Something you can use without having to pay a creator for
    each use

    - **debugging**: Finding and fixing bugs

    - **string**: A group of characters that you want the computer to display in exactly
    the same way you wrote it

    - **function**: A chunk of code that can be called from other places in the program

    - **HTML (Hypertext Markup Language)**: A language used to create webpages

    - **tag**: A piece of code that defines an element on a webpage

    - **input**: Information that the user gives the computer

    - **variable**: A word or phrase that is used to symbolize a piece of information

    - **internet**: The connected system of wires and computers that carry information
    across the world

