    ## Dear Parents,


    Congratulations for making the choice to introduce your kiddosos to a subject
    that''s creative, fun, and useful!


    Programming can be very difficult, but this book has been thoughtfully written
    to introduce a specific language and important concepts in a way that is simple
    and easy to follow. If at any time your child gets stuck, please encourage them
    to explain what they know and have them try to describe the problem that they
    are having. This is the first step in helping your child to debug problems on
    their own!


    In the event that your child gets to a place where their struggle is no longer
    productive, I have provided QR codes to scan for helpful resources.


    Though tempting, please try your hardest not to swoop in and take over the mouse,
    keyboard, or navigation for your child. Frustration plays a crucial role in learning
    and this book expertly balances opportunities for frustration with opportunities
    for success. Neither is as meaningful without the other.


    Happy coding!

    Kiki


    ## Getting started


    ### Your new playground


    There are lots of ways to write JavaScript.

    In this book, we recommend https://repl.it. It allows you to create an account
    (with your parent''s permission) so you can save and share your code online!


    Scan to read more about JavaScript environments


    ![](img/7ba224f9964b228593c5b512598a5256_5_0.png)

    ![](img/7ba224f9964b228593c5b512598a5256_5_1.png)

    ![](img/7ba224f9964b228593c5b512598a5256_5_2.png)


    ```javascript

    console.log("Hello, World!");

    ```


    In the rest of this book, we''ll play with programs that have already been started.
    Click on the correct file in the file window, then edit the code in the program
    window.


    > Technology Changes Fast! Nothing lasts forever and websites are no exception!
    If the recommended site doesn''t work anymore, visit bit.ly/editJSOnline for other
    options!


    Now is a great time to figure out what the icons and buttons in your programming
    environment do. Can you figure out how you will run your code? Is there a way
    to share it? Download it? Are there any other settings to play with?


    ![](img/7ba224f9964b228593c5b512598a5256_6_0.png)


    Scan this with a QR Code reader to watch Kiki explain repl.it


    ### Your turn!


    ![](img/7ba224f9964b228593c5b512598a5256_6_1.png)


    When you play with programs, you should know that you are in complete control
    of the computer! You don''t always have to write exactly what this book tells
    you!


    Sometimes when you change something the program will stop working. No need to
    worry. Just put it back and try changing something else instead. Pretty soon,
    you''ll figure out what everything does. It''s a great way to learn on your own.


    Make sure you keep track of the edits you make along the way (in case you want
    to undo something.)


    5


    ## Hello, World!

    ### (My first program)


    It’s a tradition with coders to test out a new programming language by getting
    the computer to say “Hello, World!” It’s not the most exciting sentence, but you
    can change it to something else later if you want to.


    > Capitalization matters! Make sure to pay attention to the letter case.


    https://repl.it/@KIKlvsIT/vol1Intro


    ![](img/7ba224f9964b228593c5b512598a5256_7_0.png)


    > Let’s work in the script.js file.


    > You’ll see starter code here


    > Make it different!


    Using console.log in a program will write something to the console. What happens
    when you replace console.log with the word alert?


    Visit the purple URL above to get to the starter code for this program.


    - 1) What do you think this does?

    - 2) What will appear in your console?


    What can you change in this program? Try the "banana" test! Replace words from
    the program with the word banana (one at a time) and see which changes keep your
    program running, and which make your program break. Make sure to change the program
    back between tries!


    Can you guess what will work and what won’t?


    Scan this to see some fun changes that you can make to the "Hello, World!"


    ## Click me

    ### (Connecting JavaScript to HTML)


    In this book, we''ll divide our code into three parts:


    - 1) **The HTML file** - This will contain the code that tells the webpage what
    to load when you click "run".

    - 2) **The JavaScript file** - This is where we''ll spend most of our time.

    - 3) **The CSS file** - This is where the style rules are written.


    This is the main page of code. It calls the other two files. We''ll look in here
    a little, but only when we need to.


    The JavaScript code is kept in this file, so we''ll write most of our code here
    and only visit other files when we need to change something about the webpage.


    The CSS file holds the code that makes the webpage look nice. For most of our
    programs, this part will already be done for us.


    ![](img/7ba224f9964b228593c5b512598a5256_9_0.png)


    Visit https://repl.it/@KIKlvsIT/clickMe to see the code for the next program.
    When you click run, it should work. But what will it do?


    https://repl.it/@KIKlvsIT/clickMe


    ![](img/7ba224f9964b228593c5b512598a5256_10_0.png)


    ## Let’s break it down...


    ### function


    ### runProgram()


    This word tells the computer that we''re giving the following code name.


    This is the name of the chunk of code between the curly braces.


    { }


    ### alert()


    These are called curly braces, They''re like bookends that start and end chunks
    of code.


    This tells the computer to pop up an alert box with a message.


    Do you remember what these are for? ( " " )

