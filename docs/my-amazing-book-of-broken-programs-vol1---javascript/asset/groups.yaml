    # My Amazing Book of Broken Programs: Vol 1 - JavaScript was written to give young
    coders a simple way to start playing with the most common languages on the web.
    Readers will get experience with both JavaScript and HTML while learning how to
    be persistent in the face of coding issues.


    "This is a fun and inviting introduction to JavaScript – I can''t wait to share
    it with the aspiring young programmers I know!"


    -Jake Baskin, Executive Director of Computer Science Teachers Association


    "Kiki Sedgwick engages and encourages them to apply their learning by thinking
    about how to explain what they''ve created in their own words. This is a must-read
    for those who are looking to deepen their journey with JavaScript."


    -Angle Kalthoff, Curriculum and Instruction Product Manager at Capstone


    "Kiki Pottsman has provided a unique way to get kids started with a new programming
    language. Because many of the starter programs are intentionally broken, kids
    also get comfortable with bugs and learn to use error messages to get hints on
    how to fix the problems."


    -Vicky Sedgwick, Computer Science Teacher


    "This book takes such a smart approach to learning to code. Too often we expect
    beginners to start coding without guidance. When you think about how we teach
    students to read we don''t start by asking them to write paragraphs, we start
    by telling them stories. And who better than Kiki Pottsman to be our programming
    storyteller?"


