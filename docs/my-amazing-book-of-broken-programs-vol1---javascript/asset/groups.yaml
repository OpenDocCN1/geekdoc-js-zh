    \n![](img/7ba224f9964b228593c5b512598a5256_33_0.png)\n\n> We've added mouseout\
    \ to this program, which calls our new function whenever the mouse leaves the\
    \ graphic.\n\n> Now look at the new function in the JavaScript file to see what\
    \ happens mouseout.\n\n## Now for something different\n(Fill in the blanks)\n\n\
