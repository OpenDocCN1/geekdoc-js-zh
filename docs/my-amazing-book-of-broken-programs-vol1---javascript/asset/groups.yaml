    \n![](img/7ba224f9964b228593c5b512598a5256_35_0.png)\n\n```javascript\nvar myList\
    \ = [\n  \"Choose happiness\",\n  \"Shoot for the moon\",\n  \"Be kind\",\n  \"\
    Let the sun shine!\"\n];\n\nvar randomNumber = Math.floor(Math.random() * myList.length);\n\
    \nfunction getRandom() {\n  return myList[randomNumber];\n}\n```\n\n![](img/7ba224f9964b228593c5b512598a5256_35_1.png)\n\
    \n## Use your imagination\n(Make your program)\n\nThis can be a lot of fun! Take\
    \ what you've learned and mix it up. It's up to you!\n\n## Answers\n(Where’s the\
    \ bug?)\n\n### It doesn't work (Page 10)\nLine 2 of the pigProgram() function\
