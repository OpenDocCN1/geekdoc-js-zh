    \ onclick=\"buttonProgram()\">`.\n\n### Follow the ball (Page 26)\nLine 10 of\
    \ the JS file doesn’t give the right information. There is no element called “cup”.\
    \ Instead, the line should read:\n`document.getElementById(\"cup3\").src =`\n\n\
    ### Collect the coins (Page 30)\nNotice that the debugging console says that pigName\
    \ is not defined. That’s because the pigProgram() function isn’t asking for a\
    \ parameter in the JS file. If you change line 5 of the JS file from\n`function\
