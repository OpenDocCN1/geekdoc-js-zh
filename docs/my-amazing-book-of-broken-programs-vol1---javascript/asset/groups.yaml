    \n- Finish the else if for \"b5\"\n- Add 5 to the variable sumTotal\n- Reset sumTotal\
    \ to zero\n- Update the total on the page\n- Create a page alert\n\n![](img/7ba224f9964b228593c5b512598a5256_34_3.png)\n\
    \n## Mystic phrases\n(Our final broken program)\n\nHere's another twist on the\
