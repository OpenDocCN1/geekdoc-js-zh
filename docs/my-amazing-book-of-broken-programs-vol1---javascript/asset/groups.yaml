    \nAdd your name and click then the box will disappear.\n\n## You are who?\n\n\
    (Saving input in variables)\n\nTo benefit from the input in the prompt box, we\
    \ either need to use it right away or we need to save it to a **variable** to\
    \ use later.\n\nhttps://repl.it/@KIKIVsIT/uWho\n\n![](img/7ba224f9964b228593c5b512598a5256_15_0.png)\n\
    \n## Let's break it down...\n\nfunction theProgram() {\n\n> This line tells the\
    \ computer that we've named our function theProgram() and we're about to start\
    \ defining it.\n\nvar userName = prompt(\"What's your name?\");\n\n> This creates\
    \ a storage container called userName where we put the value entered by the user\
    \ when we ask their name.\n\nalert(\"Hi \" + userName);\n\n> This pops up an alert\
    \ box that says \"Hi\" and repeats the user's name.\n\n}\n\n> Lets the computer\
    \ know that the definition is done.\n\n![](img/7ba224f9964b228593c5b512598a5256_16_0.png)\n\
    \nVariables are SUPER helpful! They're like little jars that can hold whatever\
    \ information you need...even when you don't know what that is.\n\nYou might not\
    \ know what name a user will enter, but you need to be able to use that name later\
    \ in your program. Variables (like userName) let you hold a place in your code\
    \ for those values once you get them.\n\n```javascript\nfunction theProgram()\
    \ {\n  var userName = prompt(\"What's your name?\");\n  alert(\"Hi \" + userName);\n\
    }\n```\n\n> Name it yourself!\nYou can name your variables anything that you want\
