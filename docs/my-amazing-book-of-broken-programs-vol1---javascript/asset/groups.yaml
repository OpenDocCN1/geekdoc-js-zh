    \n```html\n<head>\n<body>\n<div id=\"theDoc\">\n<div id=\"Score\">Score = 0</div>\n\
    <br>\n<img src=\"http://www.kikivsit.com/images/pig.png\" id=\"pig1\" onclick=\"\
    pigProgram('pig1')\">\n```\n\n> Comments in HTML start with <!-- and end with\
    \ --> and can span multiple lines.\n\nCollect all the coins before you hit the\
    \ gum!\n\n> This type of comment in JS starts with // and needs no end symbol\
