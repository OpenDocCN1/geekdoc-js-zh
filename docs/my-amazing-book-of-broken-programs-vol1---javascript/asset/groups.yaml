    \ name to? How else would you change the program?\n\nMake some edits and run your\
    \ new program to see if it makes sense. You might have to play with it more than\
    \ once (maybe more than five times) to get it to work the way you want.\n\n15\n\
    \n## Variable soup\n(There's a bug in my variable!)\n\nVariables make programs\
    \ interesting, but they also introduce a lot of places for bugs to hide.\n\nYour\
    \ variable needs to be spelled exactly the same way everywhere you use it. It\
    \ can't have any spaces and it can't start with a number.\nAlso, capitalization\
