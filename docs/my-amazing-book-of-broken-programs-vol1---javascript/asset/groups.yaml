    var randomNumber = Math.floor(Math.random() * 6);\nvar coinScore = 0;\nfunction\
    \ pigProgram(pigName) {\n  if(pigName == \"pig\" + randomNumber){\n    document.getElementById(pigName).src\
    \ = \"http://www.kikivsit.com/images/gun.png\";\n    coinScore = 0; // Reset the\
    \ score to 0\n    document.getElementById(\"theScore\").innerHTML = Score;\n \
    \ }\n}\n```\n\nCollect all the coins before you hit the gum!\n\n## Unlimited piggies\n\
    (Refreshing clicked pigs)\n\nWe've added another function that gets called when\
