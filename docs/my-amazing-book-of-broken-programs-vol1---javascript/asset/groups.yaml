    \nThis program doesn't work right.\nCan you figure out what it should do?\n\n\
    > This program should:\n\n![](img/7ba224f9964b228593c5b512598a5256_17_1.png)\n\
    \nLook at the code carefully to figure out what’s wrong.\nIt’s like a mystery\
    \ that you need to hunt for clues to solve.\n\n```javascript\nfunction bugProgram()\
    \ {\n  var bugName = prompt(\"Give this\nbug a name:\");\n  alert(\"This bug is\
    \ now \" + bugName)\n}\n```\n\n![](img/7ba224f9964b228593c5b512598a5256_18_0.png)\n\
    \nThis might LOOK like two lines but it’s\nreally just one line that got too long\
    \ so it\nwrapped itself down below. The\ncomputer still thinks of it all as line\
    \ 2.\n\nWhat is the console\ntrying to tell you?\n\nUse this as scratch paper\
    \ to\nkeep track of ideas.\n\n## Making the connection\n(How HTML and JavaScript\
    \ connect)\n\nSo far, our programs have all started when we click something. It\
    \ is possible to make other interesting things happen but sometimes we'll need\
    \ to change both in the JavaScript file and the HTML file.\n\nThis next program\
    \ will show you how the two files connect.\n\nhttps://repl.it/@KIKlvsIT/theCurtain\n\
    \n![](img/7ba224f9964b228593c5b512598a5256_19_0.png)\n\nThe HTML files have two\
    \ main parts:\n\n![](img/7ba224f9964b228593c5b512598a5256_19_1.png)\n\n![](img/7ba224f9964b228593c5b512598a5256_19_2.png)\n\
    \n## Reading the console\n\nLet's take a closer look:\n\n```html\n<head>\n<meta\
    \ charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<title>Click Me</title>\n<link href=\"style.css\" rel=\"stylesheet\" type=\"\
    text/css\">\n<script src=\"script.js\"></script>\n</head>\n<body>\n<div id=\"\
    theDoc\">\n<br/><br/>\n<button onclick=\"catProgram()\"> </button>\n</div>\n</body>\n\
    ```\n\n![](img/7ba224f9964b228593c5b512598a5256_20_0.png)\n\n![](img/7ba224f9964b228593c5b512598a5256_20_1.png)\n\
    \n## Some <body> to play with:\n\nLet's play around with the code inside the <body>\
