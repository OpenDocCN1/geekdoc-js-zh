    ## My AMAZING Book of BROKEN Programs

    by kiki Protsman vol. 1 JavaScript


    A well-rounded guide for helping children learn to solve problems on their own
    using JavaScript.


    Illustrated by Maha Younus


    ![](img/7ba224f9964b228593c5b512598a5256_0_0.png)


    ![](img/7ba224f9964b228593c5b512598a5256_1_0.png)


    ## My AMAZING Book of BROKEN Programs


    by Kiki Protsman vol. 1

    Illustrated by Maha Younus JavaScript


    ## About the author:


    Kiki Protsman is an award-winning educational designer with a master’s degree
    in computer science and more than 200 full-service elementary school lessons beneath
    her.


    As the former Executive Director of Thinkersmith, Kiki made her name creating
    activities that introduce students to the concepts behind programming. After joining
    Code.org in 2013, Kiki began to develop online lessons for young programmers as
    well.


    Having oversight to dozens of exercises included in the annual Hour of Code® event,
    it is estimated that Kiki’s activities have reached more than 200 million learners
    across the globe. If you are ready to try programming for the first time, you
    really should use a guide with her name on it.


    ![](img/7ba224f9964b228593c5b512598a5256_3_0.png)


    ## Contents


    Written by Kiki Protsman

    Edited by Nicole Reit-Larsen

    Illustrated by Maha Younus


    Special thanks to James & Jackson Davis

    Terri, Parker, & Keagan Savage


    and major supporters

    Heather King, Bryan Adams, and

    Michael Barrow in support of Girl Power!


    First Edition, 2020

    Copyright©2020 Kiki Protsman

    All rights reserved.

    This book or any portion thereof may not be reproduced or used in any manner whatsoever
    without the written permission of the publisher except for the use of brief quotations
    in a book review.


    www.KIKIlv.com


