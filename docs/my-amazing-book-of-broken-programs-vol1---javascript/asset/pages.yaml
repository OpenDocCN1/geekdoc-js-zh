  md: '# # Use your imagination

    (Make a program of your own)


    It can be a lot of fun to change someone else''s code but it is really satisfying
    to make your own program from scratch! Take what you''ve learned here and mix
    it up into a program from your imagination. You can plan your program in advance
    or just start coding and see what happens. It''s up to you!


    Watch Kiki go through the process of starting a program


    ![](img/7ba224f9964b228593c5b512598a5256_36_0.png)


    Don''t limit yourself to the things that you have learned here. If you want to
    do something new and different, there are tutorials all over the internet that
    will show you how. Just do a quick online search and nothing will be out of reach.


    # I can do anything!


    # Some ideas you can try:


    +   - An answer to your questions

    Like the mystic phrases, but each phrase is just a form of "yes" or "no"


    +   - Guess my number

    Have the computer "think" of a random number that you guess by pressing one of
    three buttons.


    +   - Bird counter

    Look outside and check for birds. Click a button each time you see one and have
    the computer add to your variable. Can you add a reset?


    +   - 50/50 chance

    Put two buttons on the screen. Have one be a winner and one be a loser randomly
    each time.


    There are so many ways to make this happen. Would you have add/subtract buttons
    to change your guess? A submit button to share your guess? Or would you have a
    text box to enter your guess? You can use the internet to figure out how to add
    a text box to your page and to use the number inside later in your code?


    35'
