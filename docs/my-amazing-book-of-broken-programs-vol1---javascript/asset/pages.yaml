  md: '# Dear Parents,


    Congratulations for making the choice to introduce your kiddosos to a subject
    that''s creative, fun, and useful!


    Programming can be very difficult, but this book has been thoughtfully written
    to introduce a specific language and important concepts in a way that is simple
    and easy to follow. If at any time your child gets stuck, please encourage them
    to explain what they know and have them try to describe the problem that they
    are having. This is the first step in helping your child to debug problems on
    their own!


    In the event that your child gets to a place where their struggle is no longer
    productive, I have provided QR codes to scan for helpful resources.


    Though tempting, please try your hardest not to swoop in and take over the mouse,
    keyboard, or navigation for your child. Frustration plays a crucial role in learning
    and this book expertly balances opportunities for frustration with opportunities
    for success. Neither is as meaningful without the other.


    Happy coding!

    Kifi'
  merge: -1
