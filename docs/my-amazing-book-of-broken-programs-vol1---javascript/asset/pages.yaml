  md: '# Let''s take a closer look:


    ```

    <head><!--These groups of words inside angled brackets are called "tags". HTML
    uses them to section off the code.

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width">

    <!--These details are helpful to the computer, but not to us in this book. You
    don''t need to mess with these.>

    <title>Click Me</title><!--Between the <title> tag is the title of the webpage.
    You can change what''s in here, if you want.

    <link href="style.css" rel="stylesheet" type="text/css" />><!--This is the name
    of the file where the computer looks for the code to make the page look a certain
    way.>

    <script src="script.js"></script><!--This is how the page tells the computer where
    to find the JS code.>

    </head><!--This tag closes the head section

    ```


    ```

    <body><!--This tag starts the section of the code that creates the page that users
    can see.

    <div id="theDoc"><!--This is the name of the main container that holds the page.

    Click the cat <--Text you can edit!

    <br/><br/><--The tag <br/> adds a blank line (like pressing return.)

    <button onclick="catProgram()"></button><!--This is calls the JS function when
    you click the button.

    </div><!--Ends the main page container

    </body><!--Ends the body of the document.

    ```


