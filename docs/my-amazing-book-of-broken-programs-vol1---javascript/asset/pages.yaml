  md: '# # Bring it all in

    (We don''t need all those functions!)


    What if I told you that we don''t need all three functions to make this program
    work? Let''s take advantage of something called a parameter to fit all three cups
    into one function!


    https://repl.it/@KIKivsit/ball-1


    ![](img/7ba224f9964b228593c5b512598a5256_28_0.png)


    > If you want to give your function an extra piece of information, you can pass
    it in using a parameter.

    Then, the function can use that information from a different file.


    Whatever you pass through the parentheses in the HTML file will become the value
    of the cupName variable in the JavaScript.


    ![](img/7ba224f9964b228593c5b512598a5256_28_1.png)'
