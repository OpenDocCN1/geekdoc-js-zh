  md: "# # Accounting for differences\n(Using conditionals)\n\nDid you notice that\
    \ the ball went away when we combined three functions into one? That's because\
    \ the function didn't treat any of the images differently from the others. We\
    \ should fix that.\n\nWithout changing anything in the HTML file, we can modify\
    \ our JavaScript to look at the parameter and see if it says “cup3”. If so, we'll\
    \ set the image to the ball. Otherwise (else) we'll set the image to empty. That's\
    \ that simple!\n\nhttps://repl.it/@KIKivsIT/ball-2\n\n```\nfunction cupProgram(cupName)\
    \ {\n  if (cupName == \"cup3\") {\n    document.getElementById(cupName).src =\
    \ \n      \"http://www.kikivsit.com/images/ball.png\";\n  } else {\n    document.getElementById(cupName).src\
    \ = \n      \"http://www.kikivsit.com/images/empty.png\";\n  }\n}\n```\n\n![](img/7ba224f9964b228593c5b512598a5256_29_0.png)\n\
    \n![](img/7ba224f9964b228593c5b512598a5256_29_1.png)\n\n![](img/7ba224f9964b228593c5b512598a5256_29_2.png)"
  merge: -1
  pgno: 29
- img_proc: true
  md: "# # Let's have some fun!\n\n(Make it unpredictable)\n\nThat program was fun\
    \ the first time, but once you know where the ball is going to be, it's just not\
    \ fun anymore. To keep it spicy, let's add a random element. By randomly choosing\
    \ what cup will have the ball, we can play this over and over again.\n\nhttps://repl.it/~KiKivsIT/ball-3\n\
    \n![](img/7ba224f9964b228593c5b512598a5256_30_0.png)\n\nThis gives us a random\
    \ number between 1 & 3.\n\n```\njavascript\nvar randomNumber = Math.ceil(Math.random()\
    \ * 3);\n\nfunction cupProgram(cupName) {\n  if(cupName == \"cup\" + randomNumber)\
    \ {\n    document.getElementById(cupName).src = \n      \"http://kikivksit/images/ball.png\"\
    ;\n  } else {\n    document.getElementById(cupName).src = \n      \"http://kikivksit/images/empty.png\"\
    ;\n  }\n}\n```\n\n# ## Let's break it down...\n\nvar randomNumber =\n\nWe're creating\
    \ a variable and naming randomNumber.\n\nBecause the random number will be either\
    \ 1,2, or 3 and the cupName can be \"cup1\", \"cup2\", or \"cup3\", we can add\
    \ our random number onto the end of the word \"cup\" and make only that image\
    \ change to a ball.\n\nMath.ceil(Math.random() * 3);\n\nMath.ceil()\nWe want the\
    \ final number rounded up so that the lowest we see is a 1.\nMath.random()\nChooses\
    \ a random decimal between 0 & 1, not including 1.\n\n+   * 3 Multiplies the random\
    \ decimal by 3 to scale it up for our needs."
  merge: -1
  pgno: 30
