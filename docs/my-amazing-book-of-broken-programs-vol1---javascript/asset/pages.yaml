  md: "# # Click it\n(Using images instead of buttons)\n\nKiki goes into detail\n\
    about tags and attributes\n\nFor the next set of programs, we're still going to\
    \ be clicking on pictures instead of `<button>` we'll use the `<img>` tag. This\
    \ will make it a little easier to get creative.\n\nhttps://repl.it/@KIKlivsIT/clickit\n\
    \n```\nHTML\nFiles: index.html\n1 <!DOCTYPE TYPE>\n2 <html>\n3 <head>-\n13 </head>\n\
    14 <body>\n15 <div id=\"theDoc\">\n16   Click to buckle\n17   <br/>\n18   <img\
    \ src=\"http://www.kikivsit.com/images/seat\n       beltUnbuckled.png\" id=\"\
    myImage\"\n       onclick=\"buckleProgram()\">\n19 </div>\n</html>\n```\n\n![](img/7ba224f9964b228593c5b512598a5256_24_0.png)\n\
    \nThis looks like four lines, that's only because the computer reads it all as\
    \ a single line.\n\n# Let's break it down...\n\n```\n<img src=\"http://www.kikivsit.com/images/seatbeltUnbuckled.png\"\
    \ id=\"myImage\" onclick=\"buckleProgram()\">\n```\n\n**img** - Tells the computer\
    \ that the tag describes an image.\n**src** - Gives the URL of the picture you\
    \ need on the internet.\n**id** - Assigns this exact image a special name that\
    \ can be used to find this item if we want to use it later (we named it \"myImage\"\
    )\n**onclick** - This is our instruction to the computer of what it should do\
    \ when someone clicks on the image. We used this with the `<button>` too. Here,\
    \ we are telling it to call our `buckleProgram()` function."
