  md: '# # Who are you?

    (Getting input)


    Getting input from a user is really easy with JavaScript. We just need to use
    the prompt command. Clicking the button in this program will pop up an input box
    that asks the user''s name.


    https://repl.it/@KIKlvsIT/whoDIs


    ![](img/7ba224f9964b228593c5b512598a5256_14_0.png)


    > ### Let''s break it down...

    #### askProgram()


    This is the name of the chunk of code that runs when the button is clicked.


    #### prompt()

    Tells the computer to pop up an input box for the user.


    Do you remember what the other things do?


    Here’s what a prompt box looks like in repl.it.


    ![](img/7ba224f9964b228593c5b512598a5256_14_1.png)


    Add your name and click then the box will disappear.'
  merge: -1
