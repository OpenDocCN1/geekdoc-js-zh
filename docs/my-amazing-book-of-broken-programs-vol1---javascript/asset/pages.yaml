- img_proc: true
  md: '# # You are who?


    (Saving input in variables)


    To benefit from the input in the prompt box, we either need to use it right away
    or we need to save it to a **variable** to use later.


    https://repl.it/@KIKIVsIT/uWho


    ![](img/7ba224f9964b228593c5b512598a5256_15_0.png)


    # Let''s break it down...


    function theProgram() {


    > This line tells the computer that we''ve named our function theProgram() and
    we''re about to start defining it.


    var userName = prompt("What''s your name?");


    > This creates a storage container called userName where we put the value entered
    by the user when we ask their name.


    alert("Hi " + userName);


    > This pops up an alert box that says "Hi" and repeats the user''s name.


    }


    > Lets the computer know that the definition is done.'
  merge: -1
  pgno: 15
- img_proc: true
  md: "![](img/7ba224f9964b228593c5b512598a5256_16_0.png)\n\nVariables are SUPER helpful!\
    \ They're like little jars that can hold whatever information you need...even\
    \ when you don't know what that is.\n\nYou might not know what name a user will\
    \ enter, but you need to be able to use that name later in your program. Variables\
    \ (like userName) let you hold a place in your code for those values once you\
    \ get them.\n\n```\nfunction theProgram() {\n  var userName = prompt(\"What's\
    \ your name?\");\n  alert(\"Hi \" + userName);\n}\n```\n\n> Name it yourself!\n\
    You can name your variables anything that you want to.\nJust make sure that you\
    \ use that name everywhere you want your variable to be.\n\n# # Cha...cha...cha...changes!\n\
    \nWhat if we wanted to know someone's favorite animal instead of their name?\n\
    \nWhat would you change the variable name to? How else would you change the program?\n\
    \nMake some edits and run your new program to see if it makes sense. You might\
    \ have to play with it more than once (maybe more than five times) to get it to\
    \ work the way you want.\n\n15"
