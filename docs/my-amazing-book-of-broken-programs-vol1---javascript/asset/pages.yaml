  md: '# # Variable soup

    (There''s a bug in my variable!)


    Variables make programs interesting, but they also introduce a lot of places for
    bugs to hide.


    Your variable needs to be spelled exactly the same way everywhere you use it.
    It can''t have any spaces and it can''t start with a number.

    Also, capitalization matters!


    https://repl.it/@KiKlvsT/bugSoup


