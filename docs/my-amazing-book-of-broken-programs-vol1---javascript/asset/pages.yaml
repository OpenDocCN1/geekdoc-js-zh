  md: '# # Click me

    (Connecting JavaScript to HTML)


    In this book, we''ll divide our code into three parts:


    +   1) **The HTML file** - This will contain the code that tells the webpage what
    to load when you click "run".

    2) **The JavaScript file** - This is where we''ll spend most of our time.

    3) **The CSS file** - This is where the style rules are written.


    This is the main page of code. It calls the other two files. We''ll look in here
    a little, but only when we need to.


    The JavaScript code is kept in this file, so we''ll write most of our code here
    and only visit other files when we need to change something about the webpage
    itself.


    The CSS file holds the code that makes the webpage look nice. For most of our
    programs, this part will already be done for us.


    ![](img/7ba224f9964b228593c5b512598a5256_9_0.png)'
