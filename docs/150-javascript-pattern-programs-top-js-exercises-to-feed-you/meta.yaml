    - [Pattern 164](Pattern 164)\n- [Pattern 165](Pattern 165)\n\n# Introduction\n\
    \nDevelop your creativity by creating beautiful asterisk patterns with if statements\
    \ and loops using the JavaScript language. this awesome language will allow you\
    \ to feel more comfortable writing code because you will master the more essential\
    \ topics of programming by practicing these techniques.\n\nIf you are studying\
    \ computer science at university, this book is perfect for you. They will require\
    \ you to create these types of patterns that will be very useful to learn all\
    \ types of advanced techniques and quickly master this wonderful language.\n\n\
    # Pattern 1\n\n```\n// *****\n// *****\n// *****\n// *****\n// *****\n\nfor (let\
    \ i = 1; i <= 5; i++) {\n    let row = \"\";\n    for (let j = 1; j <= 5; j++)\
    \ {\n        row += '*';\n    }\n    console.log(row);\n}\n```\n\n# Pattern 2\n\
    \n```\n// *\n// **\n// ***\n// ****\n// *****\n\nfor (let i = 1; i <= 5; i++)\
    \ {\n    let row = '';\n    for (let j = 1; j <= i; j++) {\n        row += '*';\n\
    \    }\n    console.log(row);\n}\n```\n\n# Pattern 3\n\n```\n// *****\n// ****\n\
    // ***\n// **\n// *\n\nfor (let i = 1; i <= 5; i++) {\n    let row = \"\";\n \
    \   for (let j = 5; j >= i; j--) {\n        row += '*';\n    }\n    console.log(row);\n\
    }\n```\n\n# Pattern 4\n\n```\n//     *\n//    **\n//   ***\n//  ****\n// *****\n\
    \nconst n = 5;\n\nfor (let i = 1; i <= n; i++) {\n    let row = \"\";\n\n    for\
    \ (let j = n - 1; j >= i; j--) {\n        row += ' ';\n    }\n\n    for (let k\
    \ = 1; k <= i; k++) {\n        row += '*';\n    }\n\n    console.log(row);\n}\n\
    ```\n\n# Pattern 5\n\n```\n// *****\n//  ****\n//   ***\n//    **\n//     *\n\n\
    const n = 5;\n\nfor (let i = n; i >= 1; i--) {\n    let spaces = \"\";\n    for\
    \ (let j = n - 1; j >= i; j--) {\n        spaces += ' ';\n    }\n\n    let stars\
    \ = \"\";\n    for (let k = 1; k <= i; k++) {\n        stars += '*';\n    }\n\n\
    \    console.log(spaces + stars);\n}\n```\n\n# Pattern 6\n\n```\n//     *\n//\
    \    * *\n//   * * *\n//  * * * *\n\nconst p_height = 5;\n\nfor (let i = 1; i\
    \ < p_height; i++) {\n    let spaces = '';\n    for (let k = p_height - 1; k >=\
    \ i; k--) {\n        spaces += ' ';\n    }\n\n    let stars = '';\n    for (let\
    \ j = 1; j <= i; j++) {\n        stars += '* ';\n    }\n\n    console.log(spaces\
    \ + stars);\n}\n```\n\n# Pattern 7\n\n```\n// * * * * *\n//  * * * *\n//   * *\
    \ *\n//    * *\n//     *\n\nconst p_height = 5;\n\nfor (let i = p_height; i >=\
    \ 1; i--) {\n    let spaces = '';\n    for (let k = p_height - 1; k >= i; k--)\
    \ {\n        spaces += ' ';\n    }\n\n    let stars = '';\n    for (let j = i;\
    \ j >= 1; j--) {\n        stars += '* ';\n    }\n\n    console.log(spaces + stars);\n\
    }\n```\n\n# Pattern 8\n\n```\n//     *\n//    ***\n//   *****\n//  *******\n//\
    \ *********\n\nconst p_height = 5;\nlet min_stars = 1;\nlet p_space = p_height\
    \ - 1;\n\nfor (let i = 0; i < p_height; i++) {\n    let spaces = '';\n    for\
    \ (let j = p_space; j > i; j--) {\n        spaces += ' ';\n    }\n\n    let stars\
    \ = '';\n    for (let k = 0; k < min_stars; k++) {\n        stars += '*';\n  \
    \  }\n    min_stars += 2;\n\n    console.log(spaces + stars);\n}\n```"
