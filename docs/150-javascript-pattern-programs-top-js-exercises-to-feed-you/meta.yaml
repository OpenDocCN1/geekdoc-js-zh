    \ i++) {\n    let spaces = '';\n    for (let j = p_space; j > i; j--) {\n    \
    \    spaces += ' ';\n    }\n\n    let stars = '';\n    for (let k = 0; k < min_stars;\
    \ k++) {\n        stars += '*';\n    }\n    min_stars += 2;\n\n    console.log(spaces\
