    const p_height = 5;\n\nfor (let i = p_height; i >= 1; i--) {\n    let spaces =\
    \ '';\n    for (let k = p_height - 1; k >= i; k--) {\n        spaces += ' ';\n\
    \    }\n\n    let stars = '';\n    for (let j = i; j >= 1; j--) {\n        stars\
    \ += '* ';\n    }\n\n    console.log(spaces + stars);\n}\n```\n\n# 模式 8\n\n```\n\
    //     *\n//    ***\n//   *****\n//  *******\n// *********\n\nconst p_height =\
