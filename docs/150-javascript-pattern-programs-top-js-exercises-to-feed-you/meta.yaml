    \ j--) {\n        row += ' ';\n    }\n\n    for (let k = 1; k <= i; k++) {\n \
    \       row += '*';\n    }\n\n    console.log(row);\n}\n```\n\n# 模式 5\n\n```\n\
    // *****\n//  ****\n//   ***\n//    **\n//     *\n\nconst n = 5;\n\nfor (let i\
    \ = n; i >= 1; i--) {\n    let spaces = \"\";\n    for (let j = n - 1; j >= i;\
    \ j--) {\n        spaces += ' ';\n    }\n\n    let stars = \"\";\n    for (let\
    \ k = 1; k <= i; k++) {\n        stars += '*';\n    }\n\n    console.log(spaces\
    \ + stars);\n}\n```\n\n# 模式 6\n\n```\n//     *\n//    * *\n//   * * *\n//  * *\
