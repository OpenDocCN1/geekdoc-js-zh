  md: "# How Does it Work?\n\nDivs, in their natural state, are greedy. They take\
    \ up as much space as possible, unless specifically told what to do (through the\
    \ use of the \"width\" property).\n\nBy using the \"float\" property, we can force\
    \ our divs to take up only as much width as we wish them to – in this case, 70%\
    \ and 20%, respectively.\n\n# Three Columns\n\nNow, we'll take things a step further\
    \ and throw an additional column into the mix. Return to your structure and revise\
    \ the \"primary\" div, like so:\n\n```\n<div id=\"primary\">\n    <div id=\"col1\"\
    >\n         insert generic text here\n    </div>\n    <div id=\"col2\">\n    \
    \     insert generic text here.\n    </div>\n</div><!--end primary-->\n```\n\n\
    Rather than placing our content directly into the \"primary\" div, we'll insert\
    \ our text into its children divs. Now return to your stylesheet and add the following:\n\
    \n```\n#primary {\n    float: left;\n    background: orange;\n    width: 70%;\n\
    \    margin-right: 5%;\n}\n```"
