  md: "# # 15 Coding The HTML\n\nYou’ll find that most sites will have a similar structure.\
    \ Some might have a few more columns, but in general, you’ll always find these\
    \ three components.\n\n# ## Creating the Basic Shell\n\nNow that we’ve visualized\
    \ our design from a coder’s point of view, let’s create the basic HTML formatting.\n\
    \nWe begin by creating a “container” division. That way, if necessary, we can\
    \ position our entire website simply by altering one div.\n\n> ROCK* TIP\nThink\
    \ of a div as a box. Within this div, we can insert a bunch of stuff (elements).\
    \ Then, if we need to move all of that stuff around, we simply pick up our box\
    \ and reposition it!\n\n```\n<div id=\"container\">\n...stuff\n</div>\n```\n\n\
    Next, add a few more divisions. Ignoring the specifics and focusing solely on\
    \ the wrapping elements, let’s add our three components:\n\n```\n<div id=\"container\"\
    >\n\t<div id=\"header\">\n\t\theader content goes here\n\t</div>\n\t<div id=\"\
    main\">\n\t\tmain body goes here\n\t</div>\n\t<div id=\"footer\">\n\t\tfooter\
    \ info goes here\n\t</div>\n</div>\n```"
  merge: -1
