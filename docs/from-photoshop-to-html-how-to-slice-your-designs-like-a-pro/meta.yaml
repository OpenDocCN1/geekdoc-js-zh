    \ repeat-x\n    cursor: pointer; }\n\ninput[type=submit]:hover {\n        background:\
    \ #c8c0bd url(../images/submitButtonBG.jpg) repeat-x -100px 0; }\n```\n\n## Cufón\
    \ Font Replacement\n\nThere are literally dozens of ways to use unique fonts in\
    \ your projects. Having said that, they all share one thing in common: they're\
    \ not perfect. Some tools implement Flash .swf files to get the job done, others\
    \ use Canvas (HTML5 feature that allows for the rendering of bitmap images), and\
    \ some even render text that isn't selectable. The bottom line is that you need\
    \ to weigh your options and choose the easiest and best solution for the task\
    \ at hand.\n\nConsidering how we're working on a relatively simple site, I've\
    \ chosen to use Cufón (http://wiki.github.com/sorccu/cufon). If you've worked\
    \ with sIFR, or Scalable Inman Flash Replacement (http://www.mikeindustries.com/blog/sifr/)\
    \ before, you'll undoubtedly have found yourself thumping your skull at some point\
    \ or another. Luckily, with Cufón, it just works! Let's see how.\n\n- 1. Visit\
    \ Cufón's website ([cufon.shoqolate.com](http://cufon.shoqolate.com)) and right-click\
    \ on the \"Download\" button at the top. Choose \"Save-As\" and place it on your\
    \ desktop.\n\n![](img/f6333180f8a08f96823276b5f118aa35_118_0.png)\n\n- 2. In order\
    \ to function, we need to use the font converter utility on Cufón's website. Refer\
    \ to this page: [http://cufon.shoqolate.com/generate/](http://cufon.shoqolate.com/generate/).\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_118_1.png)\n\n## Coding the CSS\n\n\
    3. Find your desired font. In our case, it's located within *Final Project > Assets\
    \ > Fonts > duepuntozero.ttf*.\n\n![](img/f6333180f8a08f96823276b5f118aa35_119_0.png)\n\
    \n4. Include the uppercase, lowercase, numerals, and punctuation glyphs only.\
    \ The others aren't necessary and will only increase your file size.\n\n5. Cufón\
    \ allows you to designate a specific URL for your file, to increase security.\
    \ It's extremely important that you ensure that you have the proper privileges\
    \ to use a font. The font we're using is free. Type your site's URL into the \"\
    Security\" textbox.\n\nSince we're just getting started, you can leave the final\
    \ two sections at their default values. Accept the terms, and click \"Let's Do\
    \ This\". You'll then be presented with a download box asking you where to save\
    \ the generated script. Once again, save it to your desktop for easy retrieval.\n\
    \n## Coding the CSS\n\n- 6. Create a new folder in your project and name it \"\
    js\".\n\n7. Place the Cufon.yui.js and your newly created Duepuntozero_400.font.js\
    \ files.\n\n8. Within the head tag of each page, append the following code:\n\n\
    ```\n<script type=\"text/javascript\" src=\"js/cufon-yui.js\"></script>\n<script\
    \ type=\"text/javascript\" src=\"js/Duepuntozero_400.font.js\"></script>\n<script\
    \ type=\"text/javascript\">\n    Cufon.replace('h2');\n</script>\n```\n\nBelieve\
    \ it or not, that's it! By calling all \"h2\" tags within Cufon.replace, we're\
    \ telling the engine to find all heading two tags on the page and replace them\
    \ with our new font! The only downside is that the final rendered text is not\
    \ selectable.\n\nTruthfully, we could have used this same method for our subheadings,\
    \ like \"Web Development, Graphics\", etc, but I wanted to show you how to use\
    \ CSS sprites! Either method would work just fine. There are merits to both.\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_121_0.png)\n\n## Compensating for Older\
    \ Browsers\n\nThere will be a day when web designers can joyfully ignore ancient\
    \ browsers like Internet Explorer 6, and hopefully 7! Unfortunately, we're not\
    \ quite at that point yet. In fact, at the time of writing this, according to\
    \ [w3schools.com](http://www.w3schools.com/browsers/browsers_stats.asp), 13.6%\
    \ of all users are still browsing with this decade-old browser.\n\n| 2009 | IE7\
    \ | IE6 | IE8 | Firefox | Chrome | Safari | Opera |\n|------|-----|-----|-----|---------|--------|--------|-------|\n\
    | August | 15.1% | 13.6% | 10.6% | 47.4% | 7.0% | 3.3% | 2.1% |\n| July | 15.9%\
    \ | 14.4% | 9.1% | 47.9% | 6.5% | 3.3% | 2.1% |\n| June | 18.7% | 14.9% | 7.1%\
    \ | 47.3% | 6.0% | 3.1% | 2.1% |\n| May | 21.3% | 14.5% | 5.2% | 47.7% | 5.5%\
    \ | 3.0% | 2.2% |\n| April | 23.2% | 15.4% | 3.5% | 47.1% | 4.9% | 3.0% | 2.2%\
    \ |\n| March | 24.9% | 17.0% | 1.4% | 46.5% | 4.2% | 3.1% | 2.3% |\n\n### Cringe\
    \ Time\n\nViewing your website in Internet Explorer 7 and below for the first\
    \ time will make you cringe. You might get lucky, but most of the time, you'll\
    \ find numerous issues that need to be fixed.\n\nSo let's jump in and see how\
    \ much more work we'll have to perform.\n\n### Tools\n\nTo view your site in IE6\
    \ – IE8, you have a few options.\n\n- 1. On the PC, download IE Tester. This program\
    \ will allow you to view your site in every IE browser. http://www.my-debugbar.com/wiki/IETester/HomePage.\n\
    \n2. There are many online sites that will take snapshots of your site in dozens\
    \ of browsers. My personal favorite is http://www.browsershots.org. For these\
    \ to work, the site needs to be online – not on your development server.\n\nFor\
    \ this book, we'll be utilizing the first option. If, however, you're a Mac user\
    \ (such as myself), feel free to use browsershots.org, or set up a virtual machine\
    \ to run Windows. When testing in IE6 on the Mac, you'll find that your best option\
    \ is to either temporarily hi-jack a PC, or use a program such as Vmware Fusion\
    \ (http://www.vmware.com/products/fusion/).\n\n## Compensating for Older Browsers\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_124_0.png)\n\nYikes! Truth be told,\
    \ this isn't too bad when compared to some sites. Mostly, we need to fix some\
    \ spacing issues. Internet Explorer 6 is ten years old. The fact that we're compensating\
    \ for it at all is nice enough! No migraines necessary.\n\n## Compensating for\
    \ Older Browsers\n\nWhile these inconsistencies might be intimidating for beginners,\
    \ you'll quickly learn that a few extra properties can fix huge layout issues.\
    \ The majority of these issues can be fixed by giving an element \"layout.\"\n\
    \n> \"Layout\" is an IE/Win proprietary concept that determines how elements draw\
    \ and bound their content, interact with and relate to other elements, and react\
    \ on and transmit application/user events.\"\n\nOn Having Layout http://www.satzansatz.de/cssd/onhavinglayout.html.\n\
    \n### Why is \"Having Layout\" Necessary?\n\nIt's important because it forces\
    \ the element to have a rectangular shape. This means that the content of the\
    \ element cannot flow around other boxes, which will often cause major layout\
    \ issues with your website.\n\nWhen Microsoft's proprietary property \"hasLayout\"\
    \ is equal to true, the element \"has layout.\" Luckily, we can trigger this by\
    \ adding specific properties to our selectors. Personally, my favorite method\
    \ is to set the height of an element to 100%. Other possibilities include specifying\
    \ a width and height, creating a positioning context, and setting the \"zoom\"\
    \ property equal to 1."
  mdcn: "\n ## 编写 CSS\n\n```\nwidth: 100px;\n    padding: 12px;\n    text-transform:\
    \ uppercase;\n    float: right;\n    margin-top: -12px;\n    background: #d5ceca\
    \ url(../images/submitButtonBG.jpg)\nrepeat-x;\n    cursor: pointer; }\n\ninput[type=submit]:hover\
    \ {\n         background: #c8c0bd url(../images/\nsubmitButtonBG.jpg) repeat-x\
    \ -100px 0; }\n\n/*********** END FORMS ***********/\n```\n\n根据我对 \"contact.psd\"\
    \ 文件的测量,上面列出的数值似乎是准确的。你的可能会有细微不同,这完全没有问题。\n\n对于 input[type=text] 语法,你可能会有些困惑。除了通过\
    \ id 和 class 来定位元素外,我们还可以基于它们的 \"type\" 来定位某些元素。在这些例子中,我选择了所有 \"type\" 属性等于 \"\
    text\" 的 input,也就是所有标准文本框。这个选择器不会定位密码输入框或文本区域。\n\n请注意,这种高级语法在 Internet Explorer\
    \ 6 及以下版本中不起作用。不过,我们很快就会通过导入 Dean Edwards 创建的 JavaScript 文件来解决这个问题(http://dean.edwards.name)。\n\
    \n我们再次使用这种语法来定位我们的\"提交\"按钮,以及鼠标悬停时的状态。当然,我们仍然可以使用 id,但这更有趣!\n\n> **ROCK\\* 提示**\n\
    > \n> 永远不要让浏览器的缺陷阻碍你使用高级选择器。有很多 JavaScript 可以解决 IE6 的不足。\n\n```\ninput[type=submit]\
    \ {\n    border: 1px solid #aba199;\n    text-align: center;\n    color: #30241f;\n\
    \    font-size: 11px;\n    width: 100px;\n    padding: 12px;\n    text-transform:\
    \ uppercase;\n    float: right;\n    margin-top: -12px;\n    background: #d5ceca\
    \ url(../images/submitButtonBG.jpg) repeat-x\n    cursor: pointer; }\n\ninput[type=submit]:hover\
    \ {\n        background: #c8c0bd url(../images/submitButtonBG.jpg) repeat-x -100px\
    \ 0; }\n```\n\n## Cufón 字体替换\n\n实际上,有几十种方法可以在你的项目中使用独特的字体。话虽如此,它们都有一个共同点:它们并不完美。有些工具使用\
    \ Flash .swf 文件来完成工作,有些使用 Canvas(允许渲染位图图像的 HTML5 特性),有些甚至渲染无法选中的文本。底线是,你需要权衡你的选择,为手头的任务选择最简单和最佳的解决方案。\n\
    \n考虑到我们正在开发一个相对简单的网站,我选择使用 Cufón (http://wiki.github.com/sorccu/cufon)。如果你之前用过\
    \ sIFR,也就是可缩放的 Inman Flash 替换(http://www.mikeindustries.com/blog/sifr/),你无疑会在某个时刻捶胸顿足。幸运的是,使用\
    \ Cufón,它就能直接工作!让我们看看怎么做。\n\n- 1. 访问 Cufón 的网站([cufon.shoqolate.com](http://cufon.shoqolate.com)),右键点击顶部的\"\
    Download\"按钮。选择\"另存为\",并将其保存到你的桌面。\n\n![](img/f6333180f8a08f96823276b5f118aa35_118_0.png)\n\
    \n- 2. 为了使其工作,我们需要使用 Cufón 网站上的字体转换工具。参考此页面:[http://cufon.shoqolate.com/generate/](http://cufon.shoqolate.com/generate/)。\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_118_1.png)\n\n## 编写 CSS\n\n3. 找到你想要的字体。在我们的例子中,它位于\
    \ *Final Project > Assets > Fonts > duepuntozero.ttf*。\n\n![](img/f6333180f8a08f96823276b5f118aa35_119_0.png)\n\
    \n4. 仅包含大写字母、小写字母、数字和标点符号字形。其他字符不是必需的,只会增加你的文件大小。\n\n5. Cufón 允许你为你的文件指定特定的 URL,以提高安全性。确保你拥有使用字体的适当权限是极其重要的。我们使用的字体是免费的。将你网站的\
    \ URL 输入到\"Security\"文本框中。\n\n由于我们才刚刚开始,你可以将最后两部分保留为默认值。接受条款,然后点击\"Let's Do This\"\
    。随后会弹出一个下载框,询问你要将生成的脚本保存到哪里。再次将其保存到桌面,以便轻松获取。\n\n## 编写 CSS\n\n- 6. 在你的项目中创建一个新文件夹,命名为\
    \ \"js\"。\n\n7. 将 Cufon.yui.js 和你新创建的 Duepuntozero_400.font.js 文件放入其中。\n\n8. 在每个页面的\
    \ head 标签中,追加以下代码:\n\n```\n<script type=\"text/javascript\" src=\"js/cufon-yui.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"js/Duepuntozero_400.font.js\"\
    ></script>\n<script type=\"text/javascript\">\n    Cufon.replace('h2');\n</script>\n\
    ```\n\n信不信由你,就这么简单!通过在 Cufon.replace 中调用所有 \"h2\" 标签,我们告诉引擎找到页面上所有二级标题标签,并用我们的新字体替换它们!唯一的缺点是最终渲染的文本无法选中。\n\
    \n说实话,我们本可以对副标题使用同样的方法,比如\"Web Development, Graphics\"等,但我想向你展示如何使用 CSS 精灵!任一方法都能很好地工作。两者各有优点。\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_121_0.png)\n\n## 兼容旧版浏览器\n\n总有一天,网页设计师可以欢欣地忽略像\
    \ Internet Explorer 6 这样的古老浏览器,希望还有 7!不幸的是,我们还没有完全到那个地步。事实上,在撰写本文时,根据 [w3schools.com](http://www.w3schools.com/browsers/browsers_stats.asp)\
    \ 的数据,仍有 13.6% 的用户在使用这款十年前的浏览器。\n\n| 2009 | IE7 | IE6 | IE8 | Firefox | Chrome\
    \ | Safari | Opera |\n|------|-----|-----|-----|---------|--------|--------|-------|\n\
    | August | 15.1% | 13.6% | 10.6% | 47.4% | 7.0% | 3.3% | 2.1% |\n| July | 15.9%\
    \ | 14.4% | 9.1% | 47.9% | 6.5% | 3.3% | 2.1% |\n| June | 18.7% | 14.9% | 7.1%\
    \ | 47.3% | 6.0% | 3.1% | 2.1% |\n| May | 21.3% | 14.5% | 5.2% | 47.7% | 5.5%\
    \ | 3.0% | 2.2% |\n| April | 23.2% | 15.4% | 3.5% | 47.1% | 4.9% | 3.0% | 2.2%\
    \ |\n| March | 24.9% | 17.0% | 1.4% | 46.5% | 4.2% | 3.1% | 2.3% |\n\n### 令人皱眉的时刻\n\
    \n第一次在 Internet Explorer 7 及以下版本中查看你的网站会让你皱眉。你可能运气好,但大多数时候,你会发现需要修复的诸多问题。\n\n\
    那么让我们来看看我们还需要做多少工作。\n\n### 工具\n\n要在 IE6 – IE8 中查看你的网站,你有几个选择。\n\n- 1. 在 PC 上,下载\
    \ IE Tester。这个程序将允许你在每个 IE 浏览器中查看你的网站。http://www.my-debugbar.com/wiki/IETester/HomePage。\n\
    \n2. 有很多在线网站可以对你的网站在几十种浏览器中进行截图。我个人最喜欢的是 http://www.browsershots.org。要使用这些服务,网站需要已经上线——不能只在你的开发服务器上。\n\
    \n对于本书,我们将使用第一个选项。然而,如果你是 Mac 用户(比如我自己),可以随意使用 browsershots.org,或者设置虚拟机来运行 Windows。在\
    \ Mac 上测试 IE6 时,你会发现最好的选择么是临时借用一台 PC,要么是使用类似 Vmware Fusion 的程序(http://www.vmware.com/products/fusion/)。\n\
    \n## 兼容旧版浏览器\n\n![](img/f6333180f8a08f96823276b5f118aa35_124_0.png)\n\n哎呀!说实话,与某些网站相比,这还不算太糟。主要是,我们需要修复一些间距问题。Internet\
    \ Explorer 6 已经有十年历史了。我们在某种程度上还在兼容它已经够好了!不必头疼。\n\n## 兼容旧版浏览器\n\n虽然这些不一致性可能会让初学者望而生畏,但你会很快学会一些额外的属性就可以修复巨大的布局问题。大多数这些问题都可以通过给元素\"\
    layout\"来解决。\n\n> \"Layout\"是 IE/Win 专有的概念,它决定了元素如何绘制和界定其内容、如何与其他元素交互和关联,以及如何响应和传递应用程序/用户事件。\"\
    \n\n出自 On Having Layout http://www.satzansatz.de/cssd/onhavinglayout.html。\n\n\
    ### 为什么\"Having Layout\"是必要的?\n\n这很重要,因为它强制元素拥有矩形形状。这意味着元素的内容不能围绕其他框流动,这通常会导致网站的重大布局问题。\n\
    \n当微软的专有属性\"hasLayout\"等于 true 时,该元素就\"具有 layout\"了。幸运的是,我们可以通过向选择器添加特定属性来触发这一点。就我个人而言,我最喜欢的方法是将元素的高度设置为\
    \ 100%。其他可能性包括指定宽度和高度、创建定位上下文,以及将\"zoom\"属性设置为 1。\n"
