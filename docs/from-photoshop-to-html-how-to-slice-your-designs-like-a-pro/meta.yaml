  md: '# # 36


    # ## Slicing the PSD


    +   1. You’ll see that the logo is split into two layers. Click in the small square
    icon within the first layer. You’ll immediately see the marching ants.

    2. While still holding **Command/Ctrl**, press and hold the Shift key, and click
    inside of the square icon of the next layer.

    3. While still holding **Command/Ctrl** and **Shift**, press the letter “C” to
    copy the layers.

    4. Let go of **Shift**, and now press “N.” This will create a new document.

    5. A new document dialog will appear, with the width and height values specifically
    set to the dimensions of your selection. Press **Enter**, and finally **Command/Ctrl
    V**, to paste the contents into the new document. Ta da!


    ![](img/f6333180f8a08f96823276b5f118aa35_35_0.png)


    # ## The “Save for Web” Pattern


    If you’re somewhat new to Photoshop, all of these keyboard shortcuts might be
    a bit daunting. We could just as easily have utilized the toolbar locations for
    each command. However, this way is better, and is how the pros work!


    Now is the perfect time to take a moment and memorize this pattern. You will use
    it many times. From this page on, this series of commands will be referred to
    as “The Pattern”:'
