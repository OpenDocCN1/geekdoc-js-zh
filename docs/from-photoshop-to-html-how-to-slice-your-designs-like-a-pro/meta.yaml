    >rockablepress</a></p>\n    </div><!-- end footer -->\n</div><!-- end footerWrap-->\n\
    ```\n\n### CSS\n\n```\n/* Footer */\n\n/* The footer div must be wrapped with\
    \ this #footerWrap\ndiv in order to extend the brown background for the entire\n\
    width of the screen. */\n#footerWrap {\n    border-top: 1px solid white;\n   \
    \ background: #32251f;\n}\n\n#footer {\n    overflow: hidden;\n    color: #ab8a7d;\n\
    \    width: 1002px;\n    margin: auto;\n    text-align: left;\n    padding-top:\
    \ 35px;\n    font-size: 11px;\n    line-height: 17px;\n    text-transform: uppercase;\n\
    \    border-right: 1px solid #483b2d;\n    border-left: 1px solid #483b2d;\n}\n\
    \n#footer p {\n    color: #ab8a7d;\n    font-size: 11px;\n}\n\n#footer #footerLogo\
    \ {\n    float: left;\n    background: #291e18;\n    width: 348px;\n    text-align:\
    \ center;\n    padding-top: 2.5em;\n    padding-bottom: 3em;\n    margin-right:\
    \ 32px;\n    margin-top: -35px;\n    border-right: 1px solid #483b2d;\n}\n\n#footer\
    \ strong a, #footer p a {\n    color: white;\n    font-weight: bold;\n}\n\n#footer\
