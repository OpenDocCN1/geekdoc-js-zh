    # # Cringe Time


    Viewing your website in Internet Explorer 7 and below for the first time will
    make you cringe. You might get lucky, but most of the time, you''ll find numerous
    issues that need to be fixed.


    So let''s jump in and see how much more work we''ll have to perform.


    # # Tools


    To view your site in IE6 – IE8, you have a few options.


    +   1. On the PC, download IE Tester. This program will allow you to view your
    site in every IE browser. http://www.my-debugbar.com/wiki/IETester/HomePage.

    2. There are many online sites that will take snapshots of your site in dozens
    of browsers. My personal favorite is http://www.browsershots.org. For these to
    work, the site needs to be online – not on your development server.


    For this book, we''ll be utilizing the first option. If, however, you''re a Mac
    user (such as myself), feel free to use browsershots.org, or set up a virtual
    machine to run Windows. When testing in IE6 on the Mac, you''ll find that your
    best option is to either temporarily hi-jack a PC, or use a program such as Vmware
    Fusion (http://www.vmware.com/products/fusion/).'
