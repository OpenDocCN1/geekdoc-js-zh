- img_proc: true
  md: "# 76\n\nCoding the CSS\n\n# Fix 1: Clear:both\n\nReturn to your HTML structure.\
    \ Just before the closing “main” div, append the following empty div:\n\n```\n\
    <div style=\"clear: both;\" />\n</div><!--end main-->\n```\n\nBy applying the\
    \ “clear” property, we can force the “main” div to clear (or contain) its floated\
    \ children. This method definitely works, but there’s just one problem: we’ve\
    \ added a bit of unsemantic markup. Is there a way to accomplish this without\
    \ adding useless divs? Yep!\n\n# Fix 2: Clearfix Hack\n\nThis second fix uses\
    \ a bit of advanced CSS to clear any floats. Consider the following styles:\n\n\
    ```\n#main:after {\n    content: \".\";\n    display: block;\n    height: 0;\n\
    \    clear: both;\n    visibility: hidden;\n}\n```\n\nHere, we’re using the “after”\
    \ pseudo-class to append content after the element from which it was referenced,\
    \ in this case, the “main” div. Most importantly, take note of the “content” property.\
    \ It might look a bit complicated at first, but it’s actually quite simple. We’re\
    \ simply adding a period. Now of course, we don’t want this period to display\
    \ on the page. To compensate, we’ve set the “visibility” property to “hidden.”\
    \ Now that we’ve added a bit of content after our “main” div, we can simulate\
    \ the actions from Fix 1: set “clear”"
  merge: -1
  pgno: 75
- img_proc: true
  md: "to “both”, and “display” to “block”. However, note that pseudo classes, such\
    \ as “:after” will not be understood by Internet Explorer 6 and below.\n\nThat’s\
    \ all there is to it. This will work, but it’s still somewhat tedious. Luckily,\
    \ we can work around this entire issue simply by adding one style! It’s a wonder\
    \ how this final method was only popularized a couple of years ago.\n\n# Fix 3:\
    \ Overflow: Hidden\n\nRemove all of your code from Fixes 1 and 2 – we’ll no longer\
    \ need it. In their place, add one property to the “main” div.\n\n```\n#main {\n\
    \    ..other styles\n    overflow: hidden;\n}\n```\n\nBelieve it or not, this\
    \ one property solves our problem. If you’ll remember back to the first few pages\
    \ of this book, I referenced the fact that, sometimes, a solution makes little\
    \ sense, if any. This is absolutely true in this case. Nevertheless, it works.\n\
    \n> ROCK* TIP\n\n*If you float more than one element within a parent, add “overflow:\
    \ hidden;” to the parent’s styling. This will force the wrapping element to contain\
    \ the floated elements.*"
