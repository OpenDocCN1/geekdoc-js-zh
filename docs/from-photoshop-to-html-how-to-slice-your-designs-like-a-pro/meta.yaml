  md: '# 38


    # Slicing the PSD


    ![](img/f6333180f8a08f96823276b5f118aa35_37_0.png)


    In order to save an image with partial or full transparency, we have two options:
    GIF and PNG. Years ago, GIF was the standard option. However, in recent years,
    PNG has proven to be the smartest decision for a couple of reasons:


    +   - Compression is far more efficient than GIFs.


    +   - The PNG-24 format offers variable (alpha) transparency, rather than 100%
    transparent or opaque pixels.


    In this case, we want to make sure that the edges around our logo are perfect.
    PNG-24 is the correct choice. If, on the other hand, you don''t need to render
    transparency, PNG-8 would be the smarter (and lighter) choice.'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# Best Practices for Image Types\n\n![](img/f6333180f8a08f96823276b5f118aa35_38_0.png)\n\
    \n+   1. **JPEG** – Photos and images with gradients.\n2. **GIF** – Only needed\
    \ when image is animated.\n3. **PNG-8** – The best choice for graphics without\
    \ transparency.\n4. **PNG-24** – Larger file size, but renders transparency and\
    \ image quality perfectly. Transparency not supported in IE6 and below.\n\n> >\
    \ **ROCK* TIP**\n> \n> If an image requires a transparent background, always use\
    \ the PNG-24 format.\n\nName the image \"logo.png\", and save it to the \"images\"\
    \ folder of your project. Congratulations; one down!"
