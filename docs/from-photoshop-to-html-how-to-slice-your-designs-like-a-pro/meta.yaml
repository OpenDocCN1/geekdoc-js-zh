- md: '## Slicing the PSD


    ### The Plan


    As I see it, we’ll need the following items:


    1. Navigation icons

    2. Logo

    3. Light box image

    4. All of the headings and their respective icons

    5. “Recent Work” snapshot

    6. Smaller logo within the footer

    7. Background gradients


    Other than the seven items listed above, everything else can be recreated with
    simple CSS!


    ### Photoshop


    Let’s visit Photoshop and begin! When it comes to “slicing” PSDs, there are two
    acceptable practices:


    1. The first group believes that you should use Photoshop’s “slice” tool to get
    the job done. It was created specifically for this function, so why not use it?

    2. The second prefers to use a mixture of cropping, and copy/paste methods, because
    they feel that it makes for a quicker process.


    Both methods are perfectly valid. I recommend that you try both, and choose which
    ever proves to be fastest... for you. I typically use the second method. As such,
    that''s what you''ll be using in this book!


    > **ROCK\* TIP**

    > An easy way to target a specific layer is to turn on “Auto Select.”

    > a) Click on the Move Tool (V).

    > b) Make sure that the “Auto Select” checkbox is checked. It’ll be in the upper-left
    side of the screen.

    > c) Click on the logo. Notice how it immediately selected the appropriate layer?


    We''ll begin by grabbing the logo. Within the layers palette, open the "Lightbox"
    folder and search for the "Light" and "Box" layers.


    Okay, now make sure that you''re working along for this next part. It''s the only
    way that you''ll remember the following steps.


    1. You’ll see that the logo is split into two layers. Click in the small square
    icon within the first layer. You’ll immediately see the marching ants.

    2. While still holding **Command/Ctrl**, press and hold the Shift key, and click
    inside of the square icon of the next layer.

    3. While still holding **Command/Ctrl** and **Shift**, press the letter “C” to
    copy the layers.

    4. Let go of **Shift**, and now press “N.” This will create a new document.

    5. A new document dialog will appear, with the width and height values specifically
    set to the dimensions of your selection. Press **Enter**, and finally **Command/Ctrl
    V**, to paste the contents into the new document. Ta da!


    ### The “Save for Web” Pattern


    If you’re somewhat new to Photoshop, all of these keyboard shortcuts might be
    a bit daunting. We could just as easily have utilized the toolbar locations for
    each command. However, this way is better, and is how the pros work!


    Now is the perfect time to take a moment and memorize this pattern. You will use
    it many times. From this page on, this series of commands will be referred to
    as “The Pattern”:


    1. Find your desired layers.

    2. Press and hold **Control** or **Command**.

    3. Click inside of the square icon of the layer.

    4. If you need to copy multiple layers, hold **Shift** and click in the square
    icon of the next layer. Repeat as necessary.

    5. Press **Command/Ctrl + Shift + C** to copy the layer(s).

    6. Press **Command/Ctrl + N** to create a new document.

    7. Press **Command/Ctrl + V** to paste in the new layer.


    Practice this several times until the pattern has been committed to memory. Once
    you''ve done so, continue on.


    Returning to our project, you should now have a new document containing the logo
    on top of a white background.


    We obviously don''t want that ugly white background; so click on the eyeball next
    to the “background” layer to deselect it. To save this image, go to *File > Save
    for Web and Devices* – or be a pro and press *Control + Shift + Alt + S* (or *Command
    + Shift + Option + S* for Mac users).


    In order to save an image with partial or full transparency, we have two options:
    GIF and PNG. Years ago, GIF was the standard option. However, in recent years,
    PNG has proven to be the smartest decision for a couple of reasons:


    - Compression is far more efficient than GIFs.

    - The PNG-24 format offers variable (alpha) transparency, rather than 100% transparent
    or opaque pixels.


    In this case, we want to make sure that the edges around our logo are perfect.
    PNG-24 is the correct choice. If, on the other hand, you don''t need to render
    transparency, PNG-8 would be the smarter (and lighter) choice.


    ### Best Practices for Image Types


    1. **JPEG** – Photos and images with gradients.

    2. **GIF** – Only needed when image is animated.

    3. **PNG-8** – The best choice for graphics without transparency.

    4. **PNG-24** – Larger file size, but renders transparency and image quality perfectly.
    Transparency not supported in IE6 and below.


    > **ROCK\* TIP**

    > If an image requires a transparent background, always use the PNG-24 format.


    Name the image "logo.png", and save it to the "images" folder of your project.
    Congratulations; one down!


    Next, let''s grab all of our navigation icons.


    Once again, with **“Auto Select”** enabled, click on the tiny **“house”** icon,
    and then follow the exact same steps as listed in **“The Pattern”** (page 36).
    It’s as simple as that. Because you took a few moments to memorize these keyboard
    strokes, you’ll find yourself slicing and dicing in record time!


    Using this same technique, save the remaining navigation icons to your images
    folder.


    ### CSS Sprites


    Though not entirely necessary, it''s considered a best practice to use CSS “sprites”
    when possible. Don''t worry if you don''t know what these are just yet. While
    we''ll go through them in more detail later, here is a quick definition:


    > Sprites allow us to group multiple images into one. Then, when the browser loads
    the page, it only needs to load one large image, rather than several smaller ones.
    Fewer HTTP requests equal faster page loads!


    With a sprite image, we can use background positioning in conjunction with the
    width/height properties to “frame” only our desired piece of the image. Ultimately,
    this means that our page loads faster! Now, let’s move on to the “What We Do”
    section of the home page.


    ### What We Do


    1. Click on the “Web Development” heading. In this case, we need to grab both
    the title and the icon to the left. To do so, once again hold down Command / Control
    and click on the layer to select the text.

    2. Next, hold down the "Shift" key and click on the icon layer as well (just below
    the text layer). Now, both layers will be selected simultaneously.

    3. Repeat "The Pattern" (page 36) to create a new document and paste in the heading.

    4. Before you save, we need to add the other two headings as well. That''s what
    makes it a sprite.

    5. In the menu bar, go to *Image > Canvas Size*.

    6. Check "Relative" and change the unit of measurement to "Percent."

    7. Set the anchor to the top-middle.

    8. Within the "height" textbox, type 200. This will stretch our canvas so that
    it''s two times as large as its current form. This will allow us to conveniently
    place two more headings.

    9. Return to your original PSD tab, and perform the same steps for the “Graphics”
    heading and icon. However, this time, rather than creating a new document, simply
    copy them and then return to your sprites PSD and paste. Repeat this process one
    last time for the “Usability Design” heading and icon.


    When finished, you should end up with this:


    Don’t forget to position your headings appropriately so that each one is properly
    underneath the former. Use the arrow keys to position each image accordingly.
    When finished, save for the web and place it in your images folder. Well done
    – your first sprite!


    ### Footer


    Next, let’s grab the logo from the footer.'
  mdcn: '

    ## 切割PSD文件


    ### 计划安排


    在我看来，我们需要以下素材：


    1.  导航图标

    2.  标志（Logo）

    3.  灯箱图片

    4.  所有标题及其相应图标

    5.  “近期作品”快照

    6.  页脚中的小标志

    7.  背景渐变


    除了上面列出的七项，其他所有内容都可以用简单的CSS重新创建！


    ### Photoshop


    让我们打开Photoshop开始工作！在处理PSD“切割”时，有两种公认的做法：


    1.  第一种认为应该使用Photoshop的“切片”工具来完成任务。它就是为此功能设计的，为何不用呢？

    2.  第二种则倾向于结合使用裁剪和复制/粘贴方法，因为他们觉得这样速度更快。


    两种方法都完全可行。我建议你都尝试一下，然后选择对你来说最快的那种……我通常使用第二种方法。因此，在本书中你也将使用这种方法！


    > **ROCK\* 技巧**

    > 选定特定图层的一个简便方法是开启“自动选择”。

    > a) 点击移动工具（V）。

    > b) 确保勾选了“自动选择”复选框。它位于屏幕的左上侧。

    > c) 点击标志。注意它如何立即选中了相应的图层？


    我们将从获取标志开始。在图层面板中，打开“Lightbox”文件夹，找到“Light”和“Box”图层。


    好了，接下来请务必跟着操作。这是你记住后续步骤的唯一方法。


    1.  你会看到标志被分成了两个图层。点击第一个图层中的小方形图标。你会立即看到蚂蚁线。

    2.  在按住 **Command/Ctrl** 的同时，按住Shift键，然后点击下一个图层的方形图标内部。

    3.  在按住 **Command/Ctrl** 和 **Shift** 的同时，按字母“C”复制图层。

    4.  松开 **Shift**，然后按“N”。这将创建一个新文档。

    5.  一个新文档对话框将出现，其宽度和高度值已根据你的选区尺寸特别设定。按 **Enter**，最后按 **Command/Ctrl V**，将内容粘贴到新文档中。搞定！


    ### “存储为Web所用格式”模式


    如果你对Photoshop有些陌生，这些键盘快捷键可能会有点让人望而生畏。我们本可以同样轻松地使用工具栏上的每个命令位置。但是，这种方式更好，而且是专业人士的工作方式！


    现在是花点时间记住这个模式的绝佳时机。你将多次使用它。从这一页开始，这一系列命令将被称为“该模式”：


    1.  找到你想要的图层。

    2.  按住 **Control** 或 **Command**。

    3.  点击图层中的方形图标内部。

    4.  如果你需要复制多个图层，按住 **Shift** 并点击下一个图层的方形图标。根据需要重复。

    5.  按 **Command/Ctrl + Shift + C** 复制图层。

    6.  按 **Command/Ctrl + N** 创建新文档。

    7.  按 **Command/Ctrl + V** 粘贴新图层。


    练习几次，直到这个模式牢记于心。完成后，继续。


    回到我们的项目，你现在应该有一个包含标志置于白色背景之上的新文档。


    我们显然不想要那个难看的白色背景；所以点击“背景”图层旁边的眼睛图标取消其显示。要保存此图像，请转到 *文件 > 存储为Web和设备所用格式* ——或者像个专业人士一样，按
    *Control + Shift + Alt + S*（或Mac用户按 *Command + Shift + Option + S*）。


    为了保存具有部分或完全透明度的图像，我们有两个选择：GIF和PNG。多年前，GIF是标准选择。然而，近年来，PNG已被证明是最明智的决定，原因如下：


    -   压缩效率远高于GIF。

    -   PNG-24格式提供可变（Alpha）透明度，而不是100%透明或完全不透明的像素。


    在本例中，我们希望确保标志周围的边缘完美无缺。PNG-24是正确的选择。另一方面，如果你不需要渲染透明度，PNG-8将是更明智（且更轻量）的选择。


    ### 图像类型的最佳实践


    1.  **JPEG** – 照片和带有渐变的图像。

    2.  **GIF** – 仅当图像为动画时需要。

    3.  **PNG-8** – 无透明度图形的最佳选择。

    4.  **PNG-24** – 文件较大，但能完美渲染透明度和图像质量。IE6及以下版本不支持透明度。


    > **ROCK\* 技巧**

    > 如果图像需要透明背景，请始终使用PNG-24格式。


    将图像命名为“logo.png”，并将其保存到项目的“images”文件夹中。恭喜；完成一个！


    接下来，让我们获取所有导航图标。


    同样，在启用 **“自动选择”** 的情况下，点击微小的 **“房子”** 图标，然后完全按照 **“该模式”**（第36页）中列出的相同步骤操作。就是这么简单。因为你花了几分钟记住这些键盘操作，你会发现自己的切割速度创下新纪录！


    使用相同的技术，将剩余的导航图标保存到你的images文件夹。


    ### CSS精灵图


    虽然并非完全必要，但尽可能使用CSS“精灵图”被认为是最佳实践。如果你还不知道它们是什么，请不要担心。虽然我们稍后会更详细地介绍它们，但这里有一个快速定义：


    > 精灵图允许我们将多个图像组合成一个。然后，当浏览器加载页面时，它只需要加载一个大图像，而不是几个小图像。更少的HTTP请求意味着更快的页面加载速度！


    使用精灵图图像，我们可以结合背景定位和宽度/高度属性来“框出”我们想要的图像部分。最终，这意味着我们的页面加载更快！现在，让我们继续处理主页的“我们做什么”部分。


    ### 我们做什么


    1.  点击“Web Development”标题。在这个例子中，我们需要同时获取标题和其左侧的图标。为此，再次按住Command / Control并点击图层以选择文本。

    2.  接下来，按住“Shift”键并同时点击图标图层（就在文本图层下方）。现在，两个图层将同时被选中。

    3.  重复“该模式”（第36页）以创建一个新文档并粘贴标题。

    4.  在保存之前，我们还需要添加另外两个标题。这就是它成为精灵图的原因。

    5.  在菜单栏中，转到 *图像 > 画布大小*。

    6.  勾选“相对”，并将测量单位更改为“百分比”。

    7.  将锚点设置为上居中。

    8.  在“高度”文本框中，输入200。这将拉伸我们的画布，使其大小变为当前尺寸的两倍。这将使我们能够方便地放置另外两个标题。

    9.  返回到你原来的PSD选项卡，并对“Graphics”标题和图标执行相同的步骤。然而，这次不是创建一个新文档，而是简单地复制它们，然后返回到你的精灵图PSD并粘贴。对“Usability
    Design”标题和图标重复此过程最后一次。


    完成后，你应该得到这个：


    不要忘记适当地定位你的标题，确保每个标题都正确地位于前一个的下方。使用方向键相应地定位每个图像。完成后，存储为Web所用格式并将其放入你的images文件夹。做得好——你的第一个精灵图！


    ### 页脚


    接下来，让我们获取页脚中的标志。

    '
