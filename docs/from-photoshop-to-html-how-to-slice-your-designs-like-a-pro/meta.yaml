  md: '**16**


    Coding The HTML


    Referring back to our design, we could then begin inserting the correct elements:
    an image here, a blockquote there. If you''ve never converted a PSD before, you''re
    already on your way! **It''s as simple as visualizing the layout from a coder''s
    perspective, and creating the markup to match it.**


    # # The Markup


    Let''s now take the process a step further. Within our `#main` div, we''ll need
    to insert additional wrapping divs for the “What We Do” section as well as the
    sidebar.


    If we wanted to, we could simply name the two divs, “whatWeDo” and “right-sidebar.”
    However, this method could potentially cause problems. What if, down the road,
    we instead decide to display a list of recent products? In that case, we''d have
    to rename this div, and all of its references within the stylesheet. Obviously,
    “whatWeDo” wouldn''t make any sense!


    What if we decide to switch the sidebar to the left side? As a general guideline,
    remember to name your elements according to what they are, and avoid presentational
    specifics. This is referred to as “semantics.” For example, consider the `<i>`
    and `<em>` HTML tags. They essentially perform the exact same task: making text
    italic. With that said, their meanings are quite different. The `<i>` stands for
    “italic,” while `<em>` stands for “emphasis.” Notice the difference? One element
    refers to the styling (or presentation), while the other simply describes what
    text should be – emphasized.


    > ### ROCK* TIP


    *As a rule of thumb, if you have to edit both the HTML AND the CSS when adjusting
    the styling of your page, you''re doing it wrong.*


    *Always separate presentation from content.*'
  merge: -1
  pgno: 15
