  md: '# About The Author


    ![](img/f6333180f8a08f96823276b5f118aa35_141_0.png)


    Jeffrey Way is part of the [Envato](https://envato.com) team. He is the Editor
    of [Nettuts+](https://net.tutsplus.com), a web development tutorials blog with
    over 50,000 daily readers, and he''s also the manager of two marketplaces for
    web developers: [ThemeForest](https://themeforest.net) and [CodeCanyon](https://codecanyon.net).
    He has been in the web industry for over 5 years, with expertise in HTML, CSS,
    PHP, JavaScript, jQuery, CodeIgniter, Database Development and WordPress.


    Jeffrey lives in Tennessee, USA, with his fiancé Allie and their little dachshund.
    "I spend too much time in front of the computer" he says, "and I find myself telling
    my fiancé, "We''ll go in 5 minutes!" far too often. I just can''t go out to dinner
    while I''m still producing FireBug errors... it drives me crazy."


    In his free time, among other things – like writing this book – he writes articles
    for his own personal blog ([www.Jeffrey-way.com](http://www.Jeffrey-way.com)).'
