  md: "```\npadding-right: 45px;\nmargin-top: -17px;\n}\n```\n\nTo obtain a repeating\
    \ brown background at the bottom of our site, we can't place our footer with the\
    \ “container” div. If we did so, it would be cut off beyond 1004px (the width\
    \ of our website). However, we still want our footer to appear as if it's connected\
    \ to our website. The solution is to apply a wrap to our footer, called “footerWrap”\
    \ in the code. We'll set a background color and leave off the width. This is what\
