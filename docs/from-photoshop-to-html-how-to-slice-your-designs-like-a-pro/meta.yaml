  md: '# 126 Compensating for Older Browsers


    While these inconsistencies might be intimidating for beginners, you’ll quickly
    learn that a few extra properties can fix huge layout issues. The majority of
    these issues can be fixed by giving an element “layout.”


    > “Layout” is an IE/Win proprietary concept that determines how elements draw
    and bound their content, interact with and relate to other elements, and react
    on and transmit application/user events.”


    On Having Layout http://www.satzansatz.de/cssd/onhavinglayout.html.


    # Why is “Having Layout” Necessary?


    It’s important because it forces the element to have a rectangular shape. This
    means that the content of the element cannot flow around other boxes, which will
    often cause major layout issues with your website.


    When Microsoft’s proprietary property “hasLayout” is equal to true, the element
    “has layout.” Luckily, we can trigger this by adding specific properties to our
    selectors. Personally, my favorite method is to set the height of an element to
    100%. Other possibilities include specifying a width and height, creating a positioning
    context, and setting the “zoom” property equal to 1.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# 127 Compensating for Older Browsers


    # Targeting Specific Versions of Internet Explorer


    To target a specific version of IE, we use conditional statements within the head
    tags of our HTML document. Add the following code to each page:


    ```

    <!--[if lt IE 8]>


    <script src="http://ie7-js.googlecode.com/svn/version/2.0(beta3)/IE8.js" type="text/javascript"></script>


    <![endif]-->


    <!--[if lte IE 6]>


    <link rel="stylesheet" type="text/css" href="css/ie6.css" />

    <![endif]-->

    ```


    The first block states, “if the viewer is using anything less than Internet Explorer
    8, then import the following script, otherwise do nothing.” We’re linking to a
    popular script called IE8.js, created by Dean Edwards (http://code.google.com/p/ie7-js/).
    This script allows us to use many advanced selectors in our stylesheets without
    having to worry about IE6 not recognizing them. For more details, visit http://code.google.com/p/ie7-js/.


    The second block is specifically for IE6 users. Notice the first line: “if lte
    IE 6”. This means, “if the user is browsing with IE6 or lower, import the contained
    stylesheet.” Within these tags, we link to ie6.css. Go ahead and create that file
    now, and save it in your CSS folder. Now, we can rest assured that any code within
    this file will only run if the user is browsing with IE6 or lower.'
  merge: -1
