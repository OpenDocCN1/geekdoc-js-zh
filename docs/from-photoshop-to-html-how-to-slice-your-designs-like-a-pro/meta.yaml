  - "[PAGE 101]\n\n# The Body ID Trick\n\nA quick glance at the “body” selector in\
    \ our CSS file shows the following:\n\n```\nbody {\n    background: #f1eefe url(../images/bg.png)\
    \ repeat-x;\n    text-align: center;\n    font-family: helvetica, arial, sans-serif;\n\
    \    line-height: 25px;\n}\n```\n\nMost notably, we added a background image here.\
    \ So how can we set one background image on the home page, and a different one\
    \ on other pages? The most efficient method is to use the “body id” trick.\n\n\
    > **ROCK* TIP**\n\nBy applying a unique id to our body tag, we can then style\
    \ the element differently on a page-by-page basis.\n\nReturn to your default.css\
    \ file, and just under the “body” styling, append the following rule:\n\n```\n\
    body#subpage {\n    background: #f1eefe url(../images/bg_alt.jpg) repeat-x;\n\
    }\n```\n\nSave the file and then reload your about.html page. At the moment, the\
    \ background should be completely white. That’s because we need to slice out our\
    \ new image!"
