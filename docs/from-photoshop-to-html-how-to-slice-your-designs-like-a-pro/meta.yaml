    \n注意到\"primary\"和\"secondary\" `div`分别向左和向右浮动了吗？正是这个属性（\"float\"）被用来创建我们的栏。\n\n\
    ![](img/f6333180f8a08f96823276b5f118aa35_71_0.png)\n\n## 它是如何工作的？\n\n`div`在自然状态下是贪婪的。它们会占据尽可能多的空间，除非明确被告知要怎么做（通过使用\"\
    width\"属性）。\n\n通过使用\"float\"属性，我们可以强制我们的`div`只占据我们希望它们占据的宽度——在这种情况下，分别是70%和20%。\n\
    \n## 三栏\n\n现在，我们将更进一步，在组合中添加一个额外的栏。返回到你的结构并修改\"primary\" `div`，如下所示：\n\n```\n\
    <div id=\"primary\">\n    <div id=\"col1\">\n         在此处插入通用文本\n    </div>\n\
    \    <div id=\"col2\">\n         在此处插入通用文本。\n    </div>\n</div><!--end primary-->\n\
    ```\n\n我们不是将内容直接放入\"primary\" `div`，而是将文本插入其子`div`中。现在返回到你的样式表并添加以下内容：\n\n```\n\
    #primary {\n    float: left;\n    background: orange;\n    width: 70%;\n    margin-right:\
    \ 5%;\n}\n\n#col1 {\n    float: left;\n    background: gray;\n    width: 50%;\n\
    }\n\n#col2 {\n    float: right;\n    background: #e3e3e3;\n    width: 50%;\n}\n\
    ```\n\n刷新你的浏览器，你将看到三个并排的栏。\n\n![](img/f6333180f8a08f96823276b5f118aa35_73_0.png)\n\
    \n## 75 编写CSS\n\n如果你和我一样，在这种情况下，最初的本能反应可能只是简单地创建第三个`div`，或者`#primary`、`#secondary`、`#thirdly`\
    \ `div`。虽然这种方法确实有效，但你会发现要让它们完美对齐可能有点困难。这是因为浮动是非常棘手的东西。**即使是增加一个像素也可能破坏布局。** 考虑到这一点，在大多数情况下，上面演示的方法将是你的最佳选择。\n\
    \n## 关于浮动的要点\n\n现在你一定已经注意到，一旦开始浮动`div`，就发生了奇怪的事情。当我们浮动其子元素时，容器`div`的红色背景发生了什么？为什么红色在页眉下方突然结束了？既然容器是一个包裹器，我们难道不应该看到红色背景而不是白色吗？\n\
    \n其次，为什么页脚（黑色）占据了这么多空间，为什么它在错误的位置？黑色应该在主要内容下方吗？问题出在哪里？\n\n当你浮动一个元素时，你就把它从文档流中移除了。在我们的例子中，我们浮动了\"\
    main\" `div`内的两个元素。换句话说，它们基本上不占据任何空间。因此，红色背景过早结束，页脚跳到了顶部。\n\n## 修复方法\n\n多年来，针对这个问题已经有了许多修复方法，其中大多数至今仍在使用。让我们回顾一下三种最常见的方法：\n"
