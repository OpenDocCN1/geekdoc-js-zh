    \ targeting elements via ids and classes, we can also target some elements based\
    \ upon their \"type.\" In these instances, I've selected all inputs whose \"type\"\
    \ attribute are equal to \"text\", or all standard textboxes. This selector will\
    \ not target password inputs or text areas.\n\nNote that this advanced syntax\
