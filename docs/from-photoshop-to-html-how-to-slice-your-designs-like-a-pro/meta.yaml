    \    width: 50%;\n}\n```\n\nRefresh your browser, and you'll see three side-by-side\
    \ columns.\n\n![](img/f6333180f8a08f96823276b5f118aa35_73_0.png)\n\n## 75 Coding\
    \ the CSS\n\nIf you're like me, your initial instinct, in this scenario, would\
    \ have been to simply create a third div, or `#primary`, `#secondary`, `#thirdly`\
    \ `div`s. While this method does work, you'll find that it can be a bit difficult\
    \ to line them up perfectly. This is because floats are very tricky things. **The\
    \ addition of even a single pixel can potentially destroy a layout.** Considering\
    \ this, the method demonstrated above will be your best option in most situations.\n\
    \n## Here's The Thing about Floats\n\nNow you surely must have noticed something\
    \ strange occur once you began floating the divs. What happened to the container\
    \ div's red background when we floated its children? Why did the red abruptly\
    \ end right below the header? Since the container is a wrapper, shouldn't we see\
    \ a red background instead of white?\n\nSecondly, why is the footer (the black)\
    \ taking up so much space, and why is it in the wrong place? The black should\
    \ be BELOW the main content? What's the problem?\n\nWhen you float an element,\
    \ you're taking it out of the flow of the document. In our situation, we've floated\
    \ BOTH elements within our \"main\" div. In other words, they're essentially taking\
    \ up no space. As a result, the red background prematurely ends, and the footer\
    \ jumps to the top.\n\n## Fixes\n\nOver the years, there have been many fixes\
    \ for this problem, most of which are still in use today. Let's review the three\
    \ most common:"
