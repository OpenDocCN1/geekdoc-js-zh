  md: '# # Sticky Footers


    There''s one slight problem. If you''re viewing the site in Firefox, press Control
    or Command – (Minus) to zoom out a few clicks. Notice how the footer jumps up?


    It''s not a huge deal, but we should definitely fix it. **Footers that are "locked"
    to the bottom of the browser window are known as "sticky footers."**


    To achieve this effect, we''ll need to add just a few additional styles within
    our CSS file.


    ![](img/f6333180f8a08f96823276b5f118aa35_94_0.png)'
  merge: -1
  pgno: 94
- img_proc: true
  md: "Just before the beginning “body” selector, append the following code:\n\n```\n\
    html, body {\n    Height: 100%;\n}\n```\n\nThis instructs the browser to ensure\
    \ that the html and body elements take up the entire height of the user’s screen.\n\
    \nFind your “container” selector, and insert these new styles.\n\n```\n#container\
    \ {\n    ... other styles\n    min-height: 100%;\n    height: auto !important;\
    \ /* for IE 6 */\n    height: 100%;  /* for IE 6 */\n}\n```\n\nThat’s all there\
    \ is to it. Save the file, return to your browser, and reload the age. Voila!\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_95_0.png)"
