- img_proc: true
  md: '139


    A Splash of jQuery


    Get the wrapping div with a class of “image_display” and adjust its CSS to fix
    a weird IE6 quirk.


    Next, fade out the main image, change its source to the url of the anchor tag
    that was clicked, and then load this new image. Once it’s finished loading, fade
    the image back in over the course of a half-second. Finally, empty the current
    text from the description and replace it with whatever was in the “title” attribute
    of the anchor that was originally clicked on.


    Lastly, “return false” to disable the anchor tag’s default action.


    So that’s it folks! You’re done!'
  merge: -1
  pgno: 138
