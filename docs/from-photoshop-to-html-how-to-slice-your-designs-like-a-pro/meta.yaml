    \ 的间距。\n\n## 修改后\n\n![](img/f6333180f8a08f96823276b5f118aa35_89_0.png)\n\n###\
    \ 圆角\n\n虽然我们本可以使用背景图片来创建棕色的圆形背景，但我们将使用一个巧妙的浏览器样式技巧来实现这个效果。请注意，这只在 Firefox、Safari\
    \ 和 Chrome 中有效——在 Internet Explorer 中不行。在那个浏览器中，圆圈会变成方块，这是可以接受的变化。\n\n> **ROCK*\
    \ 提示**\n>\n> *你的网站在每个浏览器中看起来不 100% 相同也没关系。*\n\n## 编写 CSS\n\n![](img/f6333180f8a08f96823276b5f118aa35_90_0.png)\n\
    \n要创建圆角，我们使用 **-moz-border-radius** 和 **-webkit-border-radius** 属性来分别针对 Firefox\
