  - '[PAGE 128]


    # 129


    # Compensating for Older Browsers


    padding, don’t worry about it! Just compensate and move on. You could easily waste
    hours upon hours trying to understand IE6, but ultimately, you’ll be learning
    about a browser that is slowly fading from use. It’s better to concentrate on
    standards-based browsers.


    > ROCK* TIP


    You’ll learn to accept that, sometimes, seemingly random properties are required
    to make IE6 happy!


    # PNG-24 Transparency in IE6


    Notice that nasty gray background behind our Light Box? This is occurring because
    IE6 does not natively support the PNG-24 format. As a result, rather than displaying
    transparency, it instead renders an ugly gray background.


    ![](img/f6333180f8a08f96823276b5f118aa35_128_0.png)'
  - '[PAGE 129]


    # 130


    # Compensating for Older Browsers


    Luckily, there are a handful of solutions:


    # Unit PNG Fix


    +   - **Download**: [http://labs.unitinteractive.com/unitpngfix.php](http://labs.unitinteractive.com/unitpngfix.php).


    +   - **Issues**: It doesn''t correctly tile transparent background images. Instead,
    it''ll stretch your image. Not a huge issue, but beware. Other than that quirk,
    this method works perfectly. I find myself using it more than the others.


    # DD_BelatedPNG Fix


    +   - **Download**: [http://www.dillerdesign.com/experiment/DD_belatedPNG/](http://www.dillerdesign.com/experiment/DD_belatedPNG/).


    +   - **Issues**: Every fix has a few quirks, but this one works quite well, other
    than the fact that it can be a bit tricky to set up.


    # IE8.js Fix


    +   - **Download**: [http://code.google.com/p/ie7-js/](http://code.google.com/p/ie7-js/).


    +   - **Issues**: You''ll find that this file is larger than the others. That
    is because fixing the transparency issues is only part of what it does! It additionally
    brings many other IE6 deficiencies up to modern standards. Keep this in mind when
    choosing. If you only want to show transparency, this might not be the best choice.'
  - "[PAGE 130]\n\n# Compensating for Older Browsers\n\n# Twin Helix Fix (from Angus\
    \ Turnbull)\n\n+   - **Download:** [http://www.twinhelix.com/css/iepngfix/](http://www.twinhelix.com/css/iepngfix/).\n\
    - **Issues:** Angus has updated this file in the last six months – it now properly\
    \ implements background-repeat/position! Rather than referencing a Javascript\
    \ file, this fix requires the use of the “behavior” CSS property.\n\nWe’ll be\
    \ using that final option: “Twin Helix Fix.” It’s a simple matter of downloading\
    \ the “iepngfix.htc” file from the link above, and dragging it into your project.\
    \ Next, we reference the file by using the “behavior” property.\n\nWe need to\
    \ fix two images: the Light Box, and the logo within the footer.\n\n![](img/f6333180f8a08f96823276b5f118aa35_130_0.png)\n\
    \nAppend the following to your IE6 stylesheet:\n\n```\n#footer img, #slogan img\
    \ {\n\n    behavior: url(../iepngfix.htc);\n\n}\n```\n\nNow save the page, and\
    \ refresh your browser. Easy!"
