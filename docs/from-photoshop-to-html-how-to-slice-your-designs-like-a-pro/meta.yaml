- img_proc: true
  md: "# Coding the CSS\n\n3. What about that subtle spacing around the browser window?\
    \ Where does that come from? Shouldn't the text be right against the edge?\n\n\
    Each browser utilizes a bit of \"default CSS\" to automatically style your markup.\
    \ At first glance, you might think that this is extremely helpful. Many professionals\
    \ would argue this very thing, in fact. However, I, and many others, tend to feel\
    \ that these default stylings do more harm than good. If every browser implemented\
    \ them identically, this wouldn't be a problem. Sadly this is not the case.\n\n\
    How can we create a website that looks the same in all browsers if IE and Firefox\
    \ interpret list items differently?\n\n# What’s the Solution?\n\nTo work around\
    \ this issue, which is sure to bring you massive headaches when first getting\
    \ started, we’ll create our own “reset” stylesheet, which will even the playing\
    \ field for all browsers. That way, we have 100% control.\n\n> **ROCK\\* TIP**\n\
    \n*If a “reset” sounds complicated, don't worry. It's quite simple. Mostly, it\
    \ involves zeroing out the margins and padding.*\n\nCreate a new CSS file called\
    \ “reset.css” and save it in a new CSS folder within your project root. Inside\
    \ this file, begin by adding the bare essentials.\n\n```\nBody,h1,h2,h3,h4,h5,p,ul,ol,li,blockquote,form,input\
    \ {\n    margin: 0; padding: 0;\n}\n```\n\nSave your file, import it into your\
    \ test document, and reload your browser. Notice the difference? Now, no formatting\
    \ has been"
  merge: -1
  pgno: 50
- img_proc: true
  md: "# Coding the CSS\n\napplied. Experiment by viewing this page in every browser\
    \ on your computer – it looks the same, right? That's the idea!\n\n![](img/f6333180f8a08f96823276b5f118aa35_51_0.png)\n\
    \nWhile this will definitely help, we need to make our \"reset.css\" stylesheet\
    \ more robust. Erase what you currently have, and paste the following code in\
    \ its place:\n\n```\nhtml, body, div, span, object, iframe, h1, h2, h3, h4, h5,\n\
    h6, p, blockquote, pre, a, code, del, em, font, img, small,\nstrike, strong, dl,\
    \ dt, dd, ol, ul, li, fieldset, form,\nlabel, table, caption, tbody, tfoot, thead,\
    \ tr, th, td {\n    margin: 0;\n    padding: 0;\n    border: 0;\n    outline:\
    \ 0;\n    font-size: 100%:\n    vertical-align: baseline;\n    background: transparent;\n\
    }\n```"
  merge: -1
  pgno: 51
- img_proc: true
  md: "# 53 Coding the CSS\n\n```\nbody {\n    line-height: 1;\n}\n\nol, ul {\n  \
    \  list-style: none;\n}\n\nblockquote, q {\n    quotes: none;\n}\n\nblockquote:before,\
    \ blockquote:after, q:before, q:after {\n    content: '';\n    content: none;\n\
    }\n```\n\nYou don't need to worry about this too much. Just rest assured that\
    \ this code removes all browser styling. That way, you have 100% authority over\
    \ your code – as you should! In addition to zeroing out the margins and padding,\
    \ we also set the font-size of all elements to 100%, remove any outlines that\
    \ Firefox might add, remove the bullet points from our list items, and so on.\n\
    \nAs we'll be using this file in all of our projects, be sure to make a copy and\
    \ store it in a \"web dev folder\", or something similar for later use.\n\n![](img/f6333180f8a08f96823276b5f118aa35_52_0.png)"
  merge: -1
  pgno: 52
- img_proc: true
  md: "# # DEFAULT.CSS\n\nNow, we need to create our workhorse stylesheet. Create\
    \ a new file in your text editor and save it as “default.css” within your CSS\
    \ folder. Paste in the following:\n\n```\n/*\n\tTheme Name: Light Box\n\tDescription:\
    \ Training for Rockable Press.\n\tSlicer: Jeffrey Way\n\tDesigner: Collis Ta’eed\n\
    \n\n\n\tColors:\n\n\ttext:                #745459\n\tdark brown:      #251b17\n\
    \tlight brown:     #3b2c25\n\twhite:              #eldedb\n\n*/\n\n/* Generic\
    \ Styles */\n\nbody {\n\tbackground: #flefee url(images/bg.png) repeat-x;\n\t\
    text-align: center;\n\tfont-family: helvetica, arial, sans-serif;\n\tline-height:\
    \ 25px;\n}\n```\n\nWe should always include a brief overview of our theme. In\
    \ this case I’ve added four pieces: “Theme Name, Description, Designer, and Slicer”.\
    \ Technically, this section isn’t required, but it’s generally considered to be\
    \ good-practice to include it."
  merge: -1
