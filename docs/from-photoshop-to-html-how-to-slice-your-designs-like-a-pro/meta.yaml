  md: "# 138 A Splash of jQuery\n\n```\n#recentWork ol li.chosen a, .ourWorkol li.chosen\
    \ a {\n    background: #a37a7e;\n}\n```\n\n![](img/f6333180f8a08f96823276b5f118aa35_137_0.png)\n\
    \n```\n$this\n    .parents('ol')\n    .find('li.chosen')\n    .removeClass('chosen');\n\
    \n$this.parent('li').addClass('chosen');\n\n$('.image_display')\n    .css('height',\
    \ height)\n    .children('img')\n    .fadeOut(400, function() {\n        $(this).attr('src',\
    \ url).load(function() {\n            $(this).fadeIn(400);\n        });\n    });\n\
    \n$this.parents('#recentWork')\n    .find('p:last')\n    .empty()\n    .html('<p>'\
    \ + $this.attr('title') + '</p>');\n});\n```"
  merge: -1
