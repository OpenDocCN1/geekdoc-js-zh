    \ brown;\n    width: 20%;\n    margin-left: 5%;\n}\n\n#footer {\n    background:\
    \ black;\n}\n```\n\nBy applying background colors to each of our divs, we'll gain\
    \ an understanding of exactly how they line up. Some prefer to use borders; however,\
    \ this can potentially change your layout due to the extra pixels. Play it safe\
    \ and use background colors instead.\n\nNotice how the “primary” and “secondary”\
    \ divs were floated to the left and right, respectively? This one property (“float”)\
    \ is exactly what is used to create our columns.\n\n![](img/f6333180f8a08f96823276b5f118aa35_71_0.png)\n\
    \n## How Does it Work?\n\nDivs, in their natural state, are greedy. They take\
    \ up as much space as possible, unless specifically told what to do (through the\
    \ use of the \"width\" property).\n\nBy using the \"float\" property, we can force\
    \ our divs to take up only as much width as we wish them to – in this case, 70%\
    \ and 20%, respectively.\n\n## Three Columns\n\nNow, we'll take things a step\
