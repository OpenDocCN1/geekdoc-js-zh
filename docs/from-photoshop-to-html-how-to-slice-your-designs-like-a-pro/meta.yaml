- md: "## Slicing the PSD\n\nYou should be a pro at this by now. Just auto-select\
    \ the layer, and follow “The Pattern.” Simple!\n\n## Backgrounds\n\nNow that we’ve\
    \ gathered most of our images, we only need to grab our backgrounds, and we’ll\
    \ be finished.\n\n1. Select the marquee tool, or press “M”.\n2. With all the layers\
    \ turned on, go to Layer > Flatten Image.\n3. Select a long strip of the background.\
    \ It only needs to be a few pixels wide or so. We’ll use CSS to repeat this pattern\
    \ for the entire width of the window. Once you’ve done so, once again follow “The\
    \ Pattern” (page 36) to save for the web.\n4. The only other background we need\
    \ is the one from the “container” section. It may look like a solid color, but\
    \ it’s actually made up of subtle gradients. Remember – subtlety is key here!\
    \ As before, grab a thin and long strip and follow “The Pattern.”\n\n## That’s\
    \ It for Now\n\nBelieve it or not, we’ve just finished the bulk of our slicing.\
    \ Though we’ll need to return for a few loose ends, the rest of the job can be\
    \ done with CSS!\n\n## Revising our HTML\n\nNow that we have all of these images\
    \ at our disposal, we need to update our index.html document accordingly. Mostly,\
    \ we'll be using the \"background\" CSS property to place images, however we do\
    \ need to insert two image tags directly into our markup.\n\nFind the div with\
    \ an id of \"slogan\". This section needs to be updated in order to include the\
    \ image of the Light Box.\n\n```html\n<div id=\"slogan\">\n    <h1><a href=\"\
    index.html\">Light Box</a></h1>\n    <img src=\"images/box.png\" alt=\"Light Box\"\
    \ />\n    <p>Hi, we're LightBox, a completely made up design\n    agency that\
    \ specializes in fresh, clean web design and\n    graphics. <a href=\"about.html\"\
    >Find out more.</a></p>\n</div><!-- end slogan-->\n```\n\nNext, we must include\
    \ the \"Recent Work\" image. Append the \"image_display\" div with our newly sliced\
    \ image.\n\n```html\n<div class=\"image_display\"><!-- needed to apply a border\
    \ to\nboth the image and the edges around the padding-->\n    <img src=\"images/recentWork/recentWork1.jpg\"\
    \n    alt=\"Recent Work\" />\n</div>\n```\n\nLastly, we must add the source for\
    \ the logo within the footer.\n\n```html\n<div id=\"footerLogo\">\n    <a href=\"\
    \"><img src=\"images/footerLogo.png\" alt=\"Light\n    Box\" /></a>\n</div>\n\
    ```\n\nWith that done, we've completed the mark-up for our home page!\n\n## Slicing\
    \ the PSD\n\nView it in the browser, and you’ll see:\n\n![](img/f6333180f8a08f96823276b5f118aa35_46_0.png)\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_47_0.png)\n\n## Coding the CSS\n\n\
    Every developer has his or her own preferences when coding a website. For example,\
    \ many prefer to use a CSS reset stylesheet, while others find it to be a waste\
    \ of time. Yours truly personally prefers the former. As such, you’ll be doing\
    \ so as well – at least in this book.\n\n## CSS Resets\n\nCreate a new HTML document\
    \ and paste in any code you like. Add a few paragraphs, maybe a heading or two\
    \ – anything you want. Next, view this page in your browser. Here’s what I ended\
    \ up with:\n\n![](img/f6333180f8a08f96823276b5f118aa35_49_0.png)\n\nKnowing that\
    \ we haven’t added an ounce of CSS:\n\n1. Have you ever wondered how the heading\
    \ tags are bold?\n2. What about the slight margins around the paragraphs?\n3.\
    \ What about that subtle spacing around the browser window? Where does that come\
    \ from? Shouldn't the text be right against the edge?\n\nEach browser utilizes\
    \ a bit of \"default CSS\" to automatically style your markup. At first glance,\
    \ you might think that this is extremely helpful. Many professionals would argue\
    \ this very thing, in fact. However, I, and many others, tend to feel that these\
    \ default stylings do more harm than good. If every browser implemented them identically,\
    \ this wouldn't be a problem. Sadly this is not the case.\n\nHow can we create\
    \ a website that looks the same in all browsers if IE and Firefox interpret list\
    \ items differently?\n\n## What’s the Solution?\n\nTo work around this issue,\
    \ which is sure to bring you massive headaches when first getting started, we’ll\
    \ create our own “reset” stylesheet, which will even the playing field for all\
    \ browsers. That way, we have 100% control.\n\n> **ROCK\\* TIP**\n>\n> *If a “reset”\
    \ sounds complicated, don't worry. It's quite simple. Mostly, it involves zeroing\
    \ out the margins and padding.*\n\nCreate a new CSS file called “reset.css” and\
    \ save it in a new CSS folder within your project root. Inside this file, begin\
    \ by adding the bare essentials.\n\n```css\nbody, h1, h2, h3, h4, h5, p, ul, ol,\
    \ li, blockquote, form, input {\n    margin: 0; padding: 0;\n}\n```\n\nSave your\
    \ file, import it into your test document, and reload your browser. Notice the\
    \ difference? Now, no formatting has been applied. Experiment by viewing this\
    \ page in every browser on your computer – it looks the same, right? That's the\
    \ idea!\n\n![](img/f6333180f8a08f96823276b5f118aa35_51_0.png)\n\nWhile this will\
    \ definitely help, we need to make our \"reset.css\" stylesheet more robust. Erase\
    \ what you currently have, and paste the following code in its place:\n\n```css\n\
    html, body, div, span, object, iframe, h1, h2, h3, h4, h5,\nh6, p, blockquote,\
    \ pre, a, code, del, em, font, img, small,\nstrike, strong, dl, dt, dd, ol, ul,\
    \ li, fieldset, form,\nlabel, table, caption, tbody, tfoot, thead, tr, th, td\
    \ {\n    margin: 0;\n    padding: 0;\n    border: 0;\n    outline: 0;\n    font-size:\
    \ 100%;\n    vertical-align: baseline;\n    background: transparent;\n}\n\nbody\
    \ {\n    line-height: 1;\n}\n\nol, ul {\n    list-style: none;\n}\n\nblockquote,\
    \ q {\n    quotes: none;\n}\n\nblockquote:before, blockquote:after, q:before,\
    \ q:after {\n    content: '';\n    content: none;\n}\n```\n\nYou don't need to\
    \ worry about this too much. Just rest assured that this code removes all browser\
    \ styling. That way, you have 100% authority over your code – as you should! In\
    \ addition to zeroing out the margins and padding, we also set the font-size of\
    \ all elements to 100%, remove any outlines that Firefox might add, remove the\
    \ bullet points from our list items, and so on.\n\nAs we'll be using this file\
    \ in all of our projects, be sure to make a copy and store it in a \"web dev folder\"\
    , or something similar for later use.\n\n![](img/f6333180f8a08f96823276b5f118aa35_52_0.png)\n\
    \n## DEFAULT.CSS\n\nNow, we need to create our workhorse stylesheet. Create a\
    \ new file in your text editor and save it as “default.css” within your CSS folder.\
    \ Paste in the following:\n\n```css\n/*\n    Theme Name: Light Box\n    Description:\
    \ Training for Rockable Press.\n    Slicer: Jeffrey Way\n    Designer: Collis\
    \ Ta’eed\n\n\n\n    Colors:\n\n    text:                #745459\n    dark brown:\
    \      #251b17\n    light brown:     #3b2c25\n    white:              #eldedb\n\
    \n*/\n\n/* Generic Styles */\n\nbody {\n    background: #flefee url(images/bg.png)\
    \ repeat-x;\n    text-align: center;\n    font-family: helvetica, arial, sans-serif;\n\
    \    line-height: 25px;\n}\n```\n\nWe should always include a brief overview of\
    \ our theme. In this case I’ve added four pieces: “Theme Name, Description, Designer,\
    \ and Slicer”. Technically, this section isn’t required, but it’s generally considered\
    \ to be good-practice to include it.\n\n## Remember Your Colors\n\n![](img/f6333180f8a08f96823276b5f118aa35_54_0.png)\n\
    \nI've found it helpful to hard code my primary colors into my stylesheets as\
    \ a comment. That way, if I forget which hex value I need, I can scroll to the\
    \ top of my file to retrieve the appropriate value, rather than returning to Photoshop\
    \ and using the eyedropper tool.\n\n## Body\n\nTypically, the \"body\" tag will\
    \ be the first element you style.\n\n1. First, we set the background property\
    \ equal to the bg.png image that we sliced. Remember – if we don't also include\
    \ a background color, our website will look very strange once the image has ended.\
    \ To create a smooth transition, we set the background color equal to the color\
    \ of our bg.jpg image at the very bottom – in my case, #f1efee. Yours might differ\
    \ slightly.\n\n2. Next, we align the text to the center. This has become a habit\
    \ of mine that could truthfully be removed at this point. Originally, it was used\
    \ as a hack to center a website in Internet Explorer 5. By aligning the body to\
    \ the center, it will incorrectly center everything, rather than just the text\
    \ in this browser. It's not 100% necessary anymore, but I still typically include\
    \ it – if only out of habit.\n\n3. Finally, we designate our font as \"Helvetica\"\
    \ (as well as a few alternatives) and set a nice line-height, which will provide\
    \ our text with some breathing room. Why Helvetica? Because that's the font that\
    \ was used in our PSD, of course."
  mdcn: "\n## 切割 PSD\n\n你现在应该已经是这方面的行家了。只需自动选择图层，然后按照“通用模式”操作即可。非常简单！\n\n## 背景\n\n\
    既然我们已经收集了大部分图像，现在只需要获取背景部分，就大功告成了。\n\n1.  选择矩形选框工具，或按下“M”键。\n2.  开启所有图层，然后选择“图层\
    \ > 拼合图像”。\n3.  选择一个长条状的背景区域。它只需要几个像素的宽度即可。我们将使用 CSS 将这个图案重复铺满整个窗口宽度。完成操作后，再次按照“通用模式”（第\
    \ 36 页）保存为 Web 格式。\n4.  我们需要的另一个背景来自“容器”部分。它可能看起来像纯色，但实际上是由微妙的渐变组成的。记住——关键在于微妙！与之前一样，选取一个细长的条状区域，并按照“通用模式”操作。\n\
    \n## 暂告一段落\n\n信不信由你，我们已经完成了大部分的切割工作。虽然还需要回来处理一些收尾工作，但剩下的工作都可以用 CSS 完成！\n\n## 修订我们的\
    \ HTML\n\n现在我们已经掌握了所有这些图像，需要相应地更新我们的 index.html 文档。我们将主要使用 \"background\" CSS\
    \ 属性来放置图像，但确实需要直接在标记中插入两个图像标签。\n\n找到 id 为 \"slogan\" 的 div。此部分需要更新以包含 Light Box\
    \ 的图像。\n\n```html\n<div id=\"slogan\">\n    <h1><a href=\"index.html\">Light Box</a></h1>\n\
    \    <img src=\"images/box.png\" alt=\"Light Box\" />\n    <p>Hi, we're LightBox,\
    \ a completely made up design\n    agency that specializes in fresh, clean web\
    \ design and\n    graphics. <a href=\"about.html\">Find out more.</a></p>\n</div><!--\
    \ end slogan-->\n```\n\n接下来，我们必须包含“最近作品”图像。将新切割的图像添加到 \"image_display\" div 中。\n\
    \n```html\n<div class=\"image_display\"><!-- needed to apply a border to\nboth\
    \ the image and the edges around the padding-->\n    <img src=\"images/recentWork/recentWork1.jpg\"\
    \n    alt=\"Recent Work\" />\n</div>\n```\n\n最后，我们必须在页脚中添加 logo 的来源。\n\n```html\n\
    <div id=\"footerLogo\">\n    <a href=\"\"><img src=\"images/footerLogo.png\" alt=\"\
    Light\n    Box\" /></a>\n</div>\n```\n\n至此，我们完成了主页的标记工作！\n\n## 在浏览器中查看\n\n在浏览器中查看，你会看到：\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_46_0.png)\n\n![](img/f6333180f8a08f96823276b5f118aa35_47_0.png)\n\
    \n## 编写 CSS\n\n每个开发者在为网站编写代码时都有自己的偏好。例如，许多人倾向于使用 CSS 重置样式表，而另一些人则认为这是浪费时间。本人倾向于前者。因此，你也将这样做——至少在本书中如此。\n\
    \n## CSS 重置\n\n创建一个新的 HTML 文档并粘贴任何你喜欢的代码。添加几个段落，也许一两个标题——任何你想要的东西。然后，在浏览器中查看这个页面。以下是我最终得到的结果：\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_49_0.png)\n\n要知道，我们还没有添加一丁点 CSS：\n\n\
    1.  你是否想过为什么标题标签是粗体？\n2.  段落周围的微小边距是怎么回事？\n3.  浏览器窗口周围的细微间距从何而来？为什么会有这个？难道文本不应该紧贴边缘吗？\n\
    \n每个浏览器都使用一些“默认 CSS”来自动样式化你的标记。乍一看，你可能会认为这非常有帮助。事实上，许多专业人士都会这样认为。然而，我以及许多人倾向于认为这些默认样式弊大于利。如果每个浏览器都以完全相同的方式实现它们，这本不会是个问题。遗憾的是，事实并非如此。\n\
    \n如果 IE 和 Firefox 对列表项的解释不同，我们如何才能创建一个在所有浏览器中看起来都一样的网站？\n\n## 解决方案是什么？\n\n为了解决这个问题（在初学阶段肯定会给你带来巨大的头痛），我们将创建自己的“重置”样式表，为所有浏览器创造一个公平的竞争环境。这样，我们就能\
    \ 100% 地控制样式。\n\n> **Rock\\* 技巧**\n>\n> *如果“重置”听起来很复杂，别担心。它其实很简单。主要就是将边距和内边距归零。*\n\
    \n创建一个名为“reset.css”的新 CSS 文件，并将其保存在项目根目录下的新 CSS 文件夹中。在这个文件中，首先添加最基本的内容。\n\n```css\n\
    body, h1, h2, h3, h4, h5, p, ul, ol, li, blockquote, form, input {\n    margin:\
    \ 0; padding: 0;\n}\n```\n\n保存文件，将其导入你的测试文档，然后重新加载浏览器。注意到区别了吗？现在，没有应用任何格式。尝试在你计算机上的每个浏览器中查看此页面——它看起来一样，对吧？这就是目的！\n\
    \n![](img/f6333180f8a08f96823276b5f118aa35_51_0.png)\n\n虽然这肯定会有所帮助，但我们需要让我们的“reset.css”样式表更加强大。删除你当前的内容，并粘贴以下代码：\n\
    \n```css\nhtml, body, div, span, object, iframe, h1, h2, h3, h4, h5,\nh6, p, blockquote,\
    \ pre, a, code, del, em, font, img, small,\nstrike, strong, dl, dt, dd, ol, ul,\
    \ li, fieldset, form,\nlabel, table, caption, tbody, tfoot, thead, tr, th, td\
    \ {\n    margin: 0;\n    padding: 0;\n    border: 0;\n    outline: 0;\n    font-size:\
    \ 100%;\n    vertical-align: baseline;\n    background: transparent;\n}\n\nbody\
    \ {\n    line-height: 1;\n}\n\nol, ul {\n    list-style: none;\n}\n\nblockquote,\
    \ q {\n    quotes: none;\n}\n\nblockquote:before, blockquote:after, q:before,\
    \ q:after {\n    content: '';\n    content: none;\n}\n```\n\n你不需要太担心这个。只需相信这段代码能移除所有浏览器样式即可。这样，你就能\
    \ 100% 掌控你的代码——理应如此！除了将边距和内边距归零，我们还将所有元素的字体大小设置为 100%，移除 Firefox 可能添加的任何轮廓，移除列表项的项目符号，等等。\n\
    \n由于我们将在所有项目中使用此文件，请务必备份一份并将其存储在“web dev 文件夹”或类似的地方以备后用。\n\n![](img/f6333180f8a08f96823276b5f118aa35_52_0.png)\n\
    \n## DEFAULT.CSS\n\n现在，我们需要创建我们的主力样式表。在你的文本编辑器中创建一个新文件，并将其保存为 CSS 文件夹中的“default.css”。粘贴以下内容：\n\
    \n```css\n/*\n    Theme Name: Light Box\n    Description: Training for Rockable\
    \ Press.\n    Slicer: Jeffrey Way\n    Designer: Collis Ta’eed\n\n\n\n    Colors:\n\
    \n    text:                #745459\n    dark brown:      #251b17\n    light brown:\
    \     #3b2c25\n    white:              #eldedb\n\n*/\n\n/* Generic Styles */\n\
    \nbody {\n    background: #flefee url(images/bg.png) repeat-x;\n    text-align:\
    \ center;\n    font-family: helvetica, arial, sans-serif;\n    line-height: 25px;\n\
    }\n```\n\n我们应始终包含主题的简要概述。在本例中，我添加了四个部分：“主题名称、描述、设计师和切割者”。从技术上讲，此部分并非必需，但通常认为包含它是良好的实践。\n\
    \n## 记住你的颜色\n\n![](img/f6333180f8a08f96823276b5f118aa35_54_0.png)\n\n我发现将主要颜色以注释形式硬编码到样式表中很有帮助。这样，如果我忘记了所需的十六进制值，我可以滚动到文件顶部获取相应的值，而不是返回\
    \ Photoshop 使用吸管工具。\n\n## Body 标签\n\n通常，“body”标签将是你样式化的第一个元素。\n\n1.  首先，我们将背景属性设置为我们切割的\
    \ bg.png 图像。记住——如果我们不同时包含背景颜色，当图像结束时，我们的网站看起来会非常奇怪。为了创建平滑的过渡，我们将背景颜色设置为 bg.jpg\
    \ 图像最底部的颜色——在我的案例中，是 #f1efee。你的可能略有不同。\n\n2.  接下来，我们将文本居中对齐。这已经成为我的一个习惯，此时确实可以移除它。最初，它被用作在\
    \ Internet Explorer 5 中居中网站的技巧。通过对 body 居中，在该浏览器中，它会错误地将所有内容居中，而不仅仅是文本。现在它已经不是\
    \ 100% 必要了，但我仍然通常会包含它——至少出于习惯。\n\n3.  最后，我们将字体指定为“Helvetica”（以及一些备选方案），并设置合适的行高，这将为我们的文本提供一些呼吸空间。为什么是\
    \ Helvetica？因为这是我们的 PSD 中使用的字体，当然。\n"
