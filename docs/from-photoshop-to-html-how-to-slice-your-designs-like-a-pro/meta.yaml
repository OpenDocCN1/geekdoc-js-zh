- md: " net tuts+ presents\n\n## FROM PHOTOSHOP TO HTML\n\nHow to slice your designs\
    \ like a pro\n\nJeffrey Way\n\n---\n\nROCKABLE*\n\nRockablepress.com\n\nEnvato.com\n\
    \n© Rockable Press 2010\n\nAll rights reserved. No part of this publication may\
    \ be reproduced or redistributed in any form without the prior written permission\
    \ of the publishers.\n\n[www.wowebook.com](http://www.wowebook.com)\n\n---\n\n\
    ## 3\n\n- Foreword ... 5\n- An Introduction ... 6\n  - What This Book Includes\
    \ ... 7\n  - What This Book Assumes ... 7\n  - What This Book Does Not Assume\
    \ ... 8\n  - Tools of the Trade ... 8\n- Coding The HTML ... 12\n  - Coding The\
    \ HTML ... 13\n  - Creating the Basic Shell ... 15\n  - The Markup ... 16\n  -\
    \ Markup Complete! ... 27\n- Slicing the PSD ... 32\n  - The Plan ... 33\n  -\
    \ Photoshop ... 34\n  - The \"Save for Web\" Pattern ... 36\n  - Best Practices\
    \ for Image Types ... 39\n  - CSS Sprites ... 41\n  - Revising our HTML ... 46\n\
    - Coding the CSS ... 49\n  - CSS Resets ... 50\n  - What's the Solution? ... 51\n\
    \  - DEFAULT.CSS ... 54\n  - General Styles ... 56\n  - Container ... 58\n  -\
    \ Header ... 58\n  - Styling The Main Banner ... 62\n  - Fahrner's Image Replacement\
    \ Technique ... 64\n  - What's The Difference Between Absolute And Relative Positioning?\
    \ ... 65\n  - Main Content ... 68\n  - Working Example: Columns ... 69\n  - Here's\
    \ The Thing about Floats ... 75\n  - The Three Headings ... 78\n\n---\n\n## 4\n\
    \n- Blockquote 81\n- CSS Shapes 83\n- Recent Portfolio 85\n- Before 86\n- After\
    \ 90\n- About Page Header (subpage) 101\n- Home Page Header 101\n- The Body ID\
    \ Trick 102\n- Work Page 104\n- Contact Page 111\n- Cufón Font Replacement 118\n\
    \n## Compensating for Older Browsers 123\n\n- Cringe Time 124\n- Tools 124\n-\
    \ Why is \"Having Layout\" Necessary? 126\n- Targeting Specific Versions of Internet\
    \ Explorer 127\n\n## Bonus Chapter: A Splash of jQuery 134\n\n- The Script 135\n\
    - Decoding the Script 137\n\n## Conclusion 140\n\n## Appendix – Further Study\
    \ 142\n\n## About The Author 143\n\n---\n\n## Foreword\n\nI'm sure you've heard\
    \ it before. \"CSS is easy. Anyone can do it!\" Granted, it may not be rocket\
    \ science, but CSS is powerful enough to make you rip your hair out.\n\nOn a daily\
    \ basis – if you listen closely – screams can be heard around the world from coders\
    \ unsuccessfully attempting to force a design into position. It's not just a matter\
    \ of learning the language; memorization is an easy task. The scream inducing\
    \ points occur when you view your site in ten different browsers, all of which\
    \ render your site at different levels of consistency. When such things occur,\
    \ how do you fix them?\n\nThis is what separates the amateurs from the pros. By\
    \ the end of this book, you'll be a member of the latter.\n\nIt won't be an easy\
    \ task. As a matter of fact, I'm going to teach you to use techniques that seemingly\
    \ make zero sense. Aren't you glad you purchased this book? All kidding aside,\
    \ you're going to find that, just because it should work, doesn't mean it will.\
    \ Just because your design looks great in Firefox, doesn't mean it will in Internet\
    \ Explorer – in fact this is typically the case. To compensate, we'll be researching\
    \ the unique \"deficiencies\" in each browser that will undoubtedly prove to give\
    \ you trouble. When you finish the last page, you'll have the tools to battle\
    \ the forces of evil and wrangle browsers – even those that are a decade old –\
    \ to work for you, not against.\n\n> *Jeffrey Way*\n\n---\n\n## AN INTRODUCTION\n\
    \n## What This Book Includes\n\nPackaged with this book, you will find:\n\n1.\
    \ A **directory of example files** made available for your reference. These files\
    \ correspond to the example designs and HTML used in this book, and consists of:\
    \ **Photoshop files for the Light Box Design and HTML / CSS files for the Light\
    \ Box Theme**. These files and themes may be used freely in your projects, both\
    \ commercial and non-commercial. However, they may not be redistributed or resold\
    \ in any way. As you work through this book you may choose to either construct\
    \ your own set of files from scratch, or use the example files as a guide.\n\n\
    2. A series of **six screencasts** covering the whole project from beginning to\
    \ end.\n\n**To access these files, please use the links provided on the last page\
    \ of this book.**\n\n## What This Book Assumes\n\nYou should have at least an\
    \ elementary understanding of HTML and CSS. You should be familiar with HTML tags\
    \ and the most common CSS properties. For example, it will be assumed that you\
    \ understand the syntax, and the relationship between the following HTML and CSS\
    \ snippets:\n\n### HTML\n\n```\n<div id=\"myDiv\">\n…some text goes here\n</div>\n\
    ```\n\n### CSS\n\n```\n#myDiv {\n    width: 500px;\n    margin: auto;\n    background:\
    \ red;\n}\n```\n\nAdditionally, you should have a basic understanding of Photoshop.\n\
    \n## What This Book Does Not Assume\n\nNothing more will be assumed beyond a basic\
    \ understanding of the syntax for these two languages.\n\n## Tools of the Trade\n\
    \nWhen converting a PSD to HTML and CSS, you'll be most efficient if you have\
    \ the right tools at your disposal. Luckily, other than Photoshop, there are a\
    \ plethora of programs and extensions available to you, most of them free. In\
    \ this book, we'll be using the following:\n\n## Komodo Edit\n\nhttps://www.activestate.com/komodo_edit/downloads/\n\
    \nThere are a variety of free code editors for both the Mac and PC. A simple Google\
    \ search will return several options. One that will beautifully serve users of\
    \ both platforms is Komodo Edit.\n\n## Web Developer Extension for Firefox\n\n\
    https://addons.mozilla.org/en-US/firefox/addon/60\n\nThis nifty extension will\
    \ allow you to edit your CSS inside of the browser, disable JS, apply rulers,\
    \ validate the HTML and CSS, to name a few. It's an essential tool that nearly\
    \ all developers have installed. You should as well.\n\n## IE Tester\n\nhttp://www.my-debugbar.com/wiki/IETester/HomePage\n\
    \nUnfortunately, even after a decade, we must still compensate for older browsers\
    \ – namely Internet Explorer 6 – when converting designs. Most likely, you'll\
    \ have IE7 or IE8 installed though. In order to preview your designs in this browser,\
    \ one option – if on the PC – is IE Tester. It allows you to view any site in\
    \ IE5 – IE8.\n\n## BrowserShots.org\n\nhttp://browsershots.org/\n\nIf you work\
    \ on a Mac (or need to test in a larger variety of browsers), a second option\
    \ is to use a site called Browsershots, to take a snapshot of your design in all\
    \ of the browsers.\n\n## VMWare Fusion\n\nhttp://www.vmware.com/products/fusion/\n\
    \nEspecially in the design world, Mac users are quickly becoming the majority.\
    \ Though Browsershots is definitely helpful, sometimes the best option, when needing\
    \ to test in IE6, is to use a program like VMWare Fusion. As they put it, \"Windows\
    \ is even better on a Mac!\". Once loaded, you can then easily run IE Tester.\n\
    \n---\n\n## Coding The HTML\n\nWhile it might seem natural to immediately begin\
    \ working on the visuals of our website, this actually couldn't be further from\
    \ the truth. Instead, we must first build our base, or the mark-up, and only once\
    \ it's been completed can we move on to the visuals.\n\nIn this section, we'll\
    \ analyze the design, and then translate the structure to HTML mark-up.\n\n##\
    \ Coding The HTML\n\nConsider the following layout:\n\nWe will be converting this\
    \ exact design to a complete HTML / CSS website! When viewing such a design, we\
    \ must begin to mentally format our layout from an HTML point of view. After a\
    \ bit of observation, you might imagine the following layout:\n\n## Coding The\
    \ HTML\n\nYou should begin thinking this way when viewing every design. This layout\
    \ is essentially divided into three sections:\n\n1. Header\n2. Main Content\n\
    3. Footer\n\nYou'll find that most sites will have a similar structure. Some might\
    \ have a few more columns, but in general, you'll always find these three components.\n\
    \n## Creating the Basic Shell\n\nNow that we've visualized our design from a coder's\
    \ point of view, let's create the basic HTML formatting.\n\nWe begin by creating\
    \ a \"container\" division. That way, if necessary, we can position our entire\
    \ website simply by altering one div.\n\n> ROCK* TIP\n> Think of a div as a box.\
    \ Within this div, we can insert a bunch of stuff (elements). Then, if we need\
    \ to move all of that stuff around, we simply pick up our box and reposition it!\n\
    \n```\n<div id=\"container\">\n...stuff\n</div>\n```\n\nNext, add a few more divisions.\
    \ Ignoring the specifics and focusing solely on the wrapping elements, let's add\
    \ our three components:\n\n```\n<div id=\"container\">\n\t<div id=\"header\">\n\
    \t\theader content goes here\n\t</div>\n\t<div id=\"main\">\n\t\tmain body goes\
    \ here\n\t</div>\n\t<div id=\"footer\">\n\t\tfooter info goes here\n\t</div>\n\
    </div>\n```"
