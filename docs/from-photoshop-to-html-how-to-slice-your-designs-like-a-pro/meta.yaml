  md: "# Container\n\nWith our general styles out of the way, we now need to work\
    \ on our \"container\" div. This division will be the wrapper for our entire website.\n\
    \n```\n#container {\n    width: 1002px;\n    margin: 0px auto;\n    text-align:\
    \ left;\n    position: relative;\n    background: #f7f5f4 url(../images/containerBG.png)\n\
    repeat-x;\n}\n```\n\nIf you return to your PSD, grab the ruler tool, and measure\
    \ the width of our website, it will come to 1002px. To center this div on the\
    \ page, we set the margins to auto. This essentially means both the left and right\
    \ margins of this div MUST be the same value. The only way that this is possible\
    \ is if the div is perfectly centered in the browser window. Additionally, we\
    \ align the text back to the left, create a new positioning context, and add our\
    \ container background image.\n\n# Header\n\nLet's begin styling our header. Add\
    \ the following code:\n\n```\n#header {\n    border-left: 1px solid #5e4b3c;\n\
    \    border-right: 1px solid #5e4b3c;\n    overflow: hidden;\n}\n```"
