  - "[PAGE 50]\n\n# Coding the CSS\n\n3. What about that subtle spacing around the\
    \ browser window? Where does that come from? Shouldn't the text be right against\
    \ the edge?\n\nEach browser utilizes a bit of \"default CSS\" to automatically\
    \ style your markup. At first glance, you might think that this is extremely helpful.\
    \ Many professionals would argue this very thing, in fact. However, I, and many\
    \ others, tend to feel that these default stylings do more harm than good. If\
    \ every browser implemented them identically, this wouldn't be a problem. Sadly\
    \ this is not the case.\n\nHow can we create a website that looks the same in\
    \ all browsers if IE and Firefox interpret list items differently?\n\n# What’s\
    \ the Solution?\n\nTo work around this issue, which is sure to bring you massive\
    \ headaches when first getting started, we’ll create our own “reset” stylesheet,\
    \ which will even the playing field for all browsers. That way, we have 100% control.\n\
    \n> **ROCK\\* TIP**\n\n*If a “reset” sounds complicated, don't worry. It's quite\
    \ simple. Mostly, it involves zeroing out the margins and padding.*\n\nCreate\
    \ a new CSS file called “reset.css” and save it in a new CSS folder within your\
    \ project root. Inside this file, begin by adding the bare essentials.\n\n```\n\
    Body,h1,h2,h3,h4,h5,p,ul,ol,li,blockquote,form,input {\n    margin: 0; padding:\
    \ 0;\n}\n```\n\nSave your file, import it into your test document, and reload\
    \ your browser. Notice the difference? Now, no formatting has been"
