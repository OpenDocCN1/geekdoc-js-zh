  md: 'In Photoshop to HTML, Nettuts+ editor and author Jeffrey Way will take you
    through the entire process of converting a design from Photoshop into a complete
    HTML/CSS website!


    This book also comes with the completed demo site which you’re free to use as
    you wish in your own projects. But not only that, you also get an additional series
    of screencasts where Jeffrey Way covers the entire project from start to finish.
    So you have the choice of either reading or viewing!


    So what are you waiting for?! Start slicing!


