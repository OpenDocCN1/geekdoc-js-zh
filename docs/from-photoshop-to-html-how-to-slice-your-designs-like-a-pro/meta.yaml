    \ Work”，我们再次应用 Fahrner 的背景技巧（第 64 页），并将我们的图片设为背景。\n\n有序列表将用于容纳带编号的项目。当用户点击一个数字时，我们最终会使用\
    \ jQuery 来更换图片。为了将它们精确定位到我们想要的位置，我们再次使用“绝对”定位。值得庆幸的是，我们之前创建了一个新的定位上下文——否则，我们的\
