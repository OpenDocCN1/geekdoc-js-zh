    \ 用 100px，Safari 用 13px 应该就能达到效果。很棒，对吧？我们还添加了一些 padding 来给我们的数字一些呼吸空间。\n\n## 页脚\n\
    \n我们主页的最后一步是设置页脚的样式。\n\n![](img/f6333180f8a08f96823276b5f118aa35_90_1.png)\n\n\
    ### HTML\n\n```\n</div><!--end container-->\n<div id=\"footerWrap\"><!-- needed\
    \ to extend the brown\nbackground for the entire screen -->\n    <div id=\"footer\"\
    >\n        <div id=\"footerLogo\">\n            <a href=\"\"><img src=\"images/footerLogo.png\"\
    \ alt=\"Light Box\" /></a>\n        </div>\n        Font via <strong><a href=\"\
    http://www.dafont.com/duepuntozero.font\">dafont (Duepuntozero)</a></strong><br\
    \ />\n        ICONS by <strong><a href=\"http://iconeden.com/icon/bright-free-stock-iconset.html\"\
