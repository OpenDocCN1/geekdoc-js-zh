- img_proc: true
  md: "62\n\n# Coding the CSS\n\n> “The Web Developer extension adds a menu and a\
    \ toolbar to the browser with various web developer tools.” – http://chrispederick.com/work/web-developer/.\n\
    \nWith that extension installed, begin to experiment by removing a property to\
