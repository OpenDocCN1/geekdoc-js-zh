    - **Issues:** Angus has updated this file in the last six months – it now properly\
    \ implements background-repeat/position! Rather than referencing a Javascript\
    \ file, this fix requires the use of the “behavior” CSS property.\n\nWe’ll be\
    \ using that final option: “Twin Helix Fix.” It’s a simple matter of downloading\
    \ the “iepngfix.htc” file from the link above, and dragging it into your project.\
    \ Next, we reference the file by using the “behavior” property.\n\nWe need to\
