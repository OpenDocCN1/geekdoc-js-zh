  md: "# Decoding the Script\n\n```\n$('#recentWork li a').click(function() {\n```\n\
    \nFind the anchor tag within the recentWork div and listen for when the user clicks\
    \ it.\n\n```\n[replace with]\nvar $this = $(this);\nif ( !$this.parent('li').hasClass('chosen')\
    \ ) {\n    var url = this.href,\n        height = $('.image_display img').css('height');\n\
    \    $this\n        .parents('ol')\n        .find('li.chosen')\n        .removeClass('chosen');\n\
    }\n$this.parent('li').addClass('chosen');\n```\n\nCreate a new variable called\
    \ “$this”, and make it equal to the anchor tag that was clicked on. This will\
    \ “cache” the location of “this” so that it doesn’t have to search the DOM every\
    \ time it’s referenced.\n\nIf the anchor tag’s parent – the list item – does not\
    \ have a class of “chosen”, add one, and make sure that no other list item has\
    \ this same class. Adding this class will allow us to change the background color\
    \ of the selected item. All we need to do is return to our stylesheet and add\
    \ an additional style."
  merge: -1
  pgno: 136
