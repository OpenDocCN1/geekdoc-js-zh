  md: "# # Coding the CSS\n\n+   6. Create a new folder in your project and name it\
    \ “js”.\n7. Place the Cufon.yui.js and your newly created Duepuntozero_400.font.js\
    \ files.\n8. Within the head tag of each page, append the following code:\n\n\
    ```\n<script type=\"text/javascript\" src=\"js/cufon-yui.js\"></script>\n<script\
    \ type=\"text/javascript\" src=\"js/Duepuntozero_400.font.js\"></script>\n<script\
    \ type=\"text/javascript\">\n    Cufon.replace('h2');\n</script>\n```\n\nBelieve\
    \ it or not, that’s it! By calling all “h2” tags within Cufon.replace, we’re telling\
    \ the engine to find all heading two tags on the page and replace them with our\
    \ new font! The only downside is that the final rendered text is not selectable.\n\
    \nTruthfully, we could have used this same method for our subheadings, like “Web\
    \ Development, Graphics”, etc, but I wanted to show you how to use CSS sprites!\
    \ Either method would work just fine. There are merits to both."
