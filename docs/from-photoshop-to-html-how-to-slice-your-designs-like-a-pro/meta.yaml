    \ alt=\"Recent Work\" />\n    </div>\n    <p><strong>Web Design Week Layout:</strong>\
    \ A design layout I created for Psdtuts+</p>\n</div><!-- end recent work-->\n\
    ```\n\n## Before\n\n![](img/f6333180f8a08f96823276b5f118aa35_85_0.png)\n\nInsert\
    \ the following CSS:\n\n```\n#main div#recentWork {\n    clear: both;\n    position:\
    \ relative;\n    border-top: 1px solid #cec5c0;\n}\n```\n\n## Coding the CSS\n\
    \n```\n#subpage #container #recentWork {\n    border-top: none;\n}\n\n#subpage\
    \ #recentWork h3 {\n    font-size: 24px;\n    color: #2f231e;\n}\n\n#recentWork\
    \ h2 {\n    border: none;\n    margin-bottom: 0;\n    padding: 28px;\n    margin-top:\
    \ 11px;\n}\n\n#recentWork ol {\n    position: absolute;\n    right: 0;\n    top:\
    \ 45px;\n}\n\n#subpage #recentWork ol {\n    top: 0;\n}\n\n#recentWork ol li {\n\
    \    width: 16px;\n    height: 16px;\n    display: inline;\n}\n\n#recentWork ol\
    \ li a {\n    color: white;\n    background: #bc535a;\n    width: 100%;\n    height:\
    \ 100%;\n    padding: 5px 10px;\n    -moz-border-radius: 100px;\n    -webkit-border-radius:\
    \ 13px;\n}\n\n#recentWork ol li.chosen a, #recentWork ol li a:hover {\n    background:\
    \ #a37a7e;\n}\n\n#recentWork ol li a:hover {\n    text-decoration: none;\n}\n\n\
    #recentWork p {\n    text-align: right;\n    font-size: 13px;\n    font-style:\
    \ italic;\n    color: #4e4d4d;\n    margin-top: 10px;\n}\n\n#subpage #recentWork\
    \ p {\n    text-align: left;\n    line-height: 18px;\n}\n\ndiv.image_display {\n\
    \    padding: 11px;\n    border: 1px solid #dbcec9;\n    background: white;\n\
    }\n\n.image_display img {\n    border: 1px solid #dbcec9;\n}\n```\n\nWe begin\
    \ by styling our wrapping #recentWork div. Because the blockquote above was floated\
    \ to the right, we must be sure to clear the elements above first. Next, it's\
    \ generally a smart idea to create a new positioning context for your wrapping\
    \ divs. Finally, we set a 1px border-top – the color being taken from the PSD,\
    \ of course.\n\nContinuing on to our heading two tag \"Recent Work\", we once\
    \ again implement Fahrner's background technique (Page 64) and apply our image\
    \ as a background.\n\nThe ordered list will house our numbered items. When the\
    \ user clicks on a number, we'll ultimately use jQuery to change the image. To\
    \ position them exactly where we want, we once again use \"absolute\" positioning.\
    \ Thankfully, we created a new positioning context earlier – otherwise, our top,\
    \ right, bottom, and left values would be placed in reference to the #main div\
    \ instead. A quick use of the \"ruler tool\" shows that we need 45px of spacing\
    \ from the top border.\n\n## After\n\n![](img/f6333180f8a08f96823276b5f118aa35_89_0.png)\n\
    \n### Rounded Corners\n\nThough we could have used a background image to create\
    \ the brown circular backgrounds, we'll instead use a neat browser styling trick\
    \ to achieve this effect. Note that this will only work in Firefox, Safari, and\
    \ Chrome – not Internet Explorer. In that browser, the circles will become squares,\
    \ which is an acceptable change.\n\n> **ROCK* TIP**\n>\n> *It's okay if your website\
    \ doesn't look 100% the same in every browser.*\n\n## Coding the CSS\n\n![](img/f6333180f8a08f96823276b5f118aa35_90_0.png)\n\
    \nTo create our rounded edges, we use the **-moz-border-radius**, and **-webkit-border-radius**\
    \ properties to target Firefox and Safari / Chrome, respectively. These two values\
    \ are determined slightly differently. Typically, these properties are used to\
    \ apply a subtle curvature to elements. In our case, we wish to create a complete\
    \ circle. 100px for Firefox, and 13px for Safari should do the trick. Nifty, ay?\
    \ Let's also apply a bit of padding to give our numbers some breathing room.\n\
    \n## Footer\n\nThe final step for our home page is to style the footer.\n\n![](img/f6333180f8a08f96823276b5f118aa35_90_1.png)\n\
    \n### HTML\n\n```\n</div><!--end container-->\n<div id=\"footerWrap\"><!-- needed\
    \ to extend the brown\nbackground for the entire screen -->\n    <div id=\"footer\"\
    >\n        <div id=\"footerLogo\">\n            <a href=\"\"><img src=\"images/footerLogo.png\"\
    \ alt=\"Light Box\" /></a>\n        </div>\n        Font via <strong><a href=\"\
    http://www.dafont.com/duepuntozero.font\">dafont (Duepuntozero)</a></strong><br\
    \ />\n        ICONS by <strong><a href=\"http://iconeden.com/icon/bright-free-stock-iconset.html\"\
    >iconeden</a></strong>\n        <p id=\"footerInfo\">&copy; 2009  <a href=\"http://rockablepress.com/\"\
    >rockablepress</a></p>\n    </div><!-- end footer -->\n</div><!-- end footerWrap-->\n\
    ```\n\n### CSS\n\n```\n/* Footer */\n\n/* The footer div must be wrapped with\
    \ this #footerWrap\ndiv in order to extend the brown background for the entire\n\
    width of the screen. */\n#footerWrap {\n    border-top: 1px solid white;\n   \
    \ background: #32251f;\n}\n\n#footer {\n    overflow: hidden;\n    color: #ab8a7d;\n\
    \    width: 1002px;\n    margin: auto;\n    text-align: left;\n    padding-top:\
    \ 35px;\n    font-size: 11px;\n    line-height: 17px;\n    text-transform: uppercase;\n\
    \    border-right: 1px solid #483b2d;\n    border-left: 1px solid #483b2d;\n}\n\
    \n#footer p {\n    color: #ab8a7d;\n    font-size: 11px;\n}\n\n#footer #footerLogo\
    \ {\n    float: left;\n    background: #291e18;\n    width: 348px;\n    text-align:\
    \ center;\n    padding-top: 2.5em;\n    padding-bottom: 3em;\n    margin-right:\
    \ 32px;\n    margin-top: -35px;\n    border-right: 1px solid #483b2d;\n}\n\n#footer\
    \ strong a, #footer p a {\n    color: white;\n    font-weight: bold;\n}\n\n#footer\
    \ p#footerInfo {\n    float: right;\n    padding-right: 45px;\n    margin-top:\
    \ -17px;\n}\n```\n\nTo obtain a repeating brown background at the bottom of our\
    \ site, we can't place our footer with the \"container\" div. If we did so, it\
    \ would be cut off beyond 1004px (the width of our website). However, we still\
    \ want our footer to appear as if it's connected to our website. The solution\
    \ is to apply a wrap to our footer, called \"footerWrap\" in the code. We'll set\
    \ a background color and leave off the width. This is what allows the background\
    \ to repeat for the entire width of the window. Then, for the \"#footer\" child\
    \ div, we'll apply the exact same values as we did for our #container element.\n\
    \n```\n#footer {\n    overflow: hidden;\n    color: #ab8a7d;\n    width: 1002px;\n\
    \    margin: auto;\n    text-align: left;\n    padding-top: 35px;\n    font-size:\
    \ 11px;\n    line-height: 17px;\n    text-transform: uppercase;\n    border-right:\
    \ 1px solid #483b2d;\n    border-left: 1px solid #483b2d; }\n```\n\nThe remaining\
    \ properties are once again taken directly from our PSD. You should be a pro at\
    \ this by now.\n\n## Sticky Footers\n\nThere's one slight problem. If you're viewing\
    \ the site in Firefox, press Control or Command – (Minus) to zoom out a few clicks.\
    \ Notice how the footer jumps up?\n\nIt's not a huge deal, but we should definitely\
    \ fix it. **Footers that are \"locked\" to the bottom of the browser window are\
    \ known as \"sticky footers.\"**\n\nTo achieve this effect, we'll need to add\
    \ just a few additional styles within our CSS file.\n\n![](img/f6333180f8a08f96823276b5f118aa35_94_0.png)"
  mdcn: "\n它仍然是一个矩形，但当我们把蓝色和红色改成与页面背景色相同的米白色时，它们就仿佛消失了。要了解更多这个巧妙的技巧，我制作了一个深入的视频教程。如果你感兴趣，一定要看看。(http://net.tutsplus.com/videos/screencasts/fun-with-css-shapes/)\n\
