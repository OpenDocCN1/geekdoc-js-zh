  - "[PAGE 14]\n\n# # 15 Coding The HTML\n\nYou’ll find that most sites will have\
    \ a similar structure. Some might have a few more columns, but in general, you’ll\
    \ always find these three components.\n\n# ## Creating the Basic Shell\n\nNow\
    \ that we’ve visualized our design from a coder’s point of view, let’s create\
    \ the basic HTML formatting.\n\nWe begin by creating a “container” division. That\
    \ way, if necessary, we can position our entire website simply by altering one\
    \ div.\n\n> ROCK* TIP\nThink of a div as a box. Within this div, we can insert\
    \ a bunch of stuff (elements). Then, if we need to move all of that stuff around,\
    \ we simply pick up our box and reposition it!\n\n```\n<div id=\"container\">\n\
    ...stuff\n</div>\n```\n\nNext, add a few more divisions. Ignoring the specifics\
    \ and focusing solely on the wrapping elements, let’s add our three components:\n\
    \n```\n<div id=\"container\">\n\t<div id=\"header\">\n\t\theader content goes\
    \ here\n\t</div>\n\t<div id=\"main\">\n\t\tmain body goes here\n\t</div>\n\t<div\
    \ id=\"footer\">\n\t\tfooter info goes here\n\t</div>\n</div>\n```"
- md: "## Coding The HTML\n\nReferring back to our design, we could then begin inserting\
    \ the correct elements: an image here, a blockquote there. If you've never converted\
    \ a PSD before, you're already on your way! **It's as simple as visualizing the\
    \ layout from a coder's perspective, and creating the markup to match it.**\n\n\
    ## The Markup\n\nLet's now take the process a step further. Within our `#main`\
    \ div, we'll need to insert additional wrapping divs for the \"What We Do\" section\
    \ as well as the sidebar.\n\nIf we wanted to, we could simply name the two divs,\
    \ \"whatWeDo\" and \"right-sidebar.\" However, this method could potentially cause\
    \ problems. What if, down the road, we instead decide to display a list of recent\
    \ products? In that case, we'd have to rename this div, and all of its references\
    \ within the stylesheet. Obviously, \"whatWeDo\" wouldn't make any sense!\n\n\
    What if we decide to switch the sidebar to the left side? As a general guideline,\
    \ remember to name your elements according to what they are, and avoid presentational\
    \ specifics. This is referred to as \"semantics.\" For example, consider the `<i>`\
    \ and `<em>` HTML tags. They essentially perform the exact same task: making text\
    \ italic. With that said, their meanings are quite different. The `<i>` stands\
    \ for \"italic,\" while `<em>` stands for \"emphasis.\" Notice the difference?\
    \ One element refers to the styling (or presentation), while the other simply\
    \ describes what text should be – emphasized.\n\n> ### ROCK TIP\n>\n> *As a rule\
    \ of thumb, if you have to edit both the HTML AND the CSS when adjusting the styling\
    \ of your page, you're doing it wrong.*\n>\n> *Always separate presentation from\
    \ content.*\n\nReturning to our project, we'll simply use \"primaryContent\" and\
    \ \"secondaryContent.\"\n\n```\n<div id=\"container\">\n    <div id=\"header\"\
    ></div>\n    <div id=\"main\">\n        <div id=\"primaryContent\"></div>\n  \
    \      <div id=\"secondaryContent\"></div>\n    </div><!-- end main-->\n</div><!--end\
    \ continer-->\n<div id=\"footer\"></div>\n```\n\n![](img/f6333180f8a08f96823276b5f118aa35_16_0.png)\n\
    \nAlso, take note of how our footer div is a sibling of our container div, not\
    \ a child (an element that is nested inside of another). The reason is because\
    \ we want the brown background to extend for the entire width of the user's browser\
    \ window. This cannot be accomplished when nested inside a div with a stated width.\
    \ Don't worry if this is confusing; we'll discuss it more in later sections.\n\
    \n> **ROCK TIP**\n>\n> *Do not touch your CSS file until the markup has been completed.*\n\
    \n## Header\n\nNow that we have our basic structure, let's begin fleshing out\
    \ each section. We'll start with the header.\n\n![](img/f6333180f8a08f96823276b5f118aa35_17_0.png)\n\
    \nWe immediately notice a \"list\" of navigation links in the upper right portion\
    \ of the screen. Because it's a list, it seems appropriate to use an unordered\
    \ list!\n\n```\n<div id=\"container\">\n<div id=\"header\">\n<ul id=\"nav\">\n\
    <li id=\"li_home\"><a href=\"index.html\">Home</a></li>\n<li id=\"li_work\"><a\
    \ href=\"work.html\">Work</a></li>\n<li id=\"li_about\"><a href=\"about.html\"\
    >About</a></li>\n<li id=\"li_contact\"><a href=\"contact.htm\">Contact</a></li>\n\
    </ul>\n</div>\n```\n\n![](img/f6333180f8a08f96823276b5f118aa35_17_1.png)\n\nNotice\
    \ how each list item has been given a unique id? This is an unfortunate necessity,\
    \ due to the unique nature of our navigation. Return to the demo and hover over\
    \ each link; you'll notice that a warm glow appears around each icon when you\
    \ do so. To achieve this effect, we'll use background images. We need a way to\
    \ target each list item in order to apply its respective background image – hence\
    \ the unique ids.\n\nMoving along, we now come to the logo and the slogan. We\
    \ should wrap this section within its own div as well.\n\n![](img/f6333180f8a08f96823276b5f118aa35_18_0.png)\n\
    \n```\n<div id=\"header\">\n    <ul id=\"nav\">\n        <li id=\"li_home\" class=\"\
    selected\"><a href=\"index.html\">Home</a></li>\n        <li id=\"li_work\"><a\
    \ href=\"work.html\">Work</a></li>\n        <li id=\"li_about\"><a href=\"about.html\"\
    >About</a></li>\n        <li id=\"li_contact\"><a href=\"contact.html\">Contact</a></li>\n\
    \    </ul>\n\n    <div id=\"slogan\">\n        <h1><a href=\"index.html\">Light\
    \ Box</a></h1>\n        <img src=\"#\" alt=\"Light Box\" />\n        <p>Hi, we're\
    \ LightBox, a completely made up design agency that specializes in fresh, clean\
    \ web design\nand graphics.\n<a href=\"about.html\">Find out more.</a></p>\n</div><!--\
    \ end slogan-->\n</div><!-- end header-->\n```\n\nWe begin by placing the name\
    \ of our site within a heading level one tag. It's considered a best practice\
    \ for usability to make your logo link back to the home page. This can easily\
    \ be implemented by wrapping the text within an anchor tag.\n\nNext, we have that\
    \ large glowing box graphic, and finally our slogan, which is appropriately wrapped\
    \ in a paragraph tag. Don't worry about the actual image just yet, it will be\
    \ available to us once we've sliced our PSD. For the moment, we're ONLY focusing\
    \ on the markup.\n\n## Main Content\n\n![](img/f6333180f8a08f96823276b5f118aa35_19_0.png)\n\
    \n```\n<div id=\"primaryContent\">\n    <h2 id=\"whatWeDo\">What We Do</h2>\n\
    \    <ul>\n        <li id=\"first\">\n            <h3>Web Development</h3>\n \
    \           <p> ... generic text ... </p>\n        </li>\n        <li id=\"second\"\
    >\n            <h3>Graphics</h3>\n            <p> ... generic text ... </p>\n\
    \        </li>\n        <li id=\"third\">\n            <h3>Usability Design</h3>\n\
    \            <p> ... generic text ... </p>\n        </li>\n    </ul>\n</div><!--\
    \ end primaryContent-->\n```\n\nAt this stage we wrap the \"What We Do\" heading\
    \ within an h2 tag. Next, we have three different sections.\n\n1. Web Development\n\
    2. Graphics\n3. Usability Design\n\nA beginner might assume that three divs would\
    \ be appropriate here – however, that would be the incorrect choice.\n\n> **ROCK\
    \ TIP**\n>\n> *If someone asks you what this section is, you might respond by\
    \ saying that it's a \"list of services\" offered by our fictional company. The\
    \ keyword here is \"list\". As such, we should be using an unordered list.*\n\n\
    Each list item contains an H3 tag and the generic \"lorem\" dummy text (represented\
    \ by ... generic text ...). We'll use the background property in our CSS file\
    \ to add the icon and the unique font. This is the reasoning behind adding the\
    \ \"first\", \"second\", and \"third\" ids to the list items. We need a way to\
    \ latch on to each one individually from within our stylesheet.\n\n## SecondaryContent\n\
    \nImmediately after our primaryContent div, we need to add a blockquote element,\
    \ which will display a random testimonial.\n\n> Lightbox did an amazing job with\
    \ our website. From start to finish they were professional, fast and totally fictitious.\n\
    >\n> It was amazing how a company that doesn't even exist could put together such\
    \ an amazing site for us.\n>\n> Thank you Lightbox!\n>\n> — John Rushmore, MADEUPPEOPLE.COM\n\
    \n```\n<div id=\"secondaryContent\">\n    <blockquote>\n        <p>Lightbox did\
    \ an amazing job with our website.\nFrom start to finish they were professional,\
    \ fast and\ntotally fictitious. </p>\n        <p>It was amazing how a company\
    \ that doesn't\neven exist could put together such an amazing site for us.\nThank\
    \ you Lightbox!</p>\n    </blockquote>\n    <cite title=\"MadeUpPeople.com\">John\
    \ Rushmore\n<span>MADEUPPEOPLE.COM</span></cite>\n    <div class=\"arrow\"></div>\n\
    </div><!-- end secondaryContent-->\n```\n\nOne might think that we can simply\
    \ remove the div entirely and float the blockquote to the right. At all times,\
    \ we should be evaluating our code. Technically, that would be acceptable; however,\
    \ we must always consider the future. What if, a few months down the road, we\
    \ decide that the site needs a new page with a two-column layout? We'd unfortunately\
    \ have to return to the HTML file to revise the markup. To prevent this, we should\
    \ go ahead and create the second column. Then, we can use a \"body\" trick to\
    \ determine whether each new page should consist of one column or two. You'll\
    \ learn this trick soon!\n\nThere are two things worth noting in this block of\
    \ code:\n\n1. The cite tag might seem foreign to you. Luckily, it's quite simple.\
    \ Cite tags are used exactly how you would imagine – to indicate a citation. Yes,\
    \ we can get away with using something like a span tag, however, if a tag was\
    \ created specifically for such a purpose, it's more semantic to use it."
  mdcn: "\n## 编写 HTML 代码\n\n回顾一下我们的设计，我们可以开始插入正确的元素：这里放一张图片，那里放一个引用块。如果你之前从未进行过 PSD\
    \ 转 HTML，那么你已经上路了！**这很简单，只需从开发者的视角来可视化布局，并创建与之匹配的标记即可。**\n\n## 标记结构\n\n现在让我们进一步深入这个过程。在我们的\
    \ `#main` div 中，我们需要为\"我们的工作\"区域以及侧边栏插入额外的包裹 div。\n\n如果愿意的话，我们可以简单地将这两个 div 命名为\"\
    whatWeDo\"和\"right-sidebar\"。然而，这种方法可能会带来潜在的问题。如果在将来，我们决定改为展示一个最新产品的列表呢？在这种情况下，我们就必须重命名这个\
    \ div 以及样式表中所有引用它的部分。显然，\"whatWeDo\"就不再合适了！\n\n如果我们决定把侧边栏换到左侧呢？作为一般准则，请记住根据元素是什么来命名，避免使用呈现性的具体描述。这就是所谓的\"\
    语义化\"。例如，考虑 `<i>` 和 `<em>` HTML 标签。它们本质上执行完全相同的任务：使文字变为斜体。尽管如此，它们的含义却大不相同。`<i>`\
    \ 代表\"italic（斜体）\"，而 `<em>` 代表\"emphasis（强调）\"。注意到区别了吗？一个元素指的是样式（或呈现），而另一个仅仅描述了文字应该是什么——被强调的。\n\
    \n> ### 实用技巧\n>\n> *作为一条经验法则，如果你在调整页面样式时需要同时编辑 HTML 和 CSS，那就是做错了。*\n>\n> *始终将表现与内容分离开来。*\n\
    \n回到我们的项目，我们将简单地使用\"primaryContent\"和\"secondaryContent\"。\n\n```\n<div id=\"\
    container\">\n    <div id=\"header\"></div>\n    <div id=\"main\">\n        <div\
    \ id=\"primaryContent\"></div>\n        <div id=\"secondaryContent\"></div>\n\
    \    </div><!-- end main-->\n</div><!--end continer-->\n<div id=\"footer\"></div>\n\
    ```\n\n![](img/f6333180f8a08f96823276b5f118aa35_16_0.png)\n\n另外，请注意我们的 footer\
    \ div 是 container div 的兄弟元素，而不是子元素（嵌套在另一个元素内部的元素）。原因是我们要让棕色背景延伸到用户浏览器窗口的整个宽度。当它嵌套在具有设定宽度的\
    \ div 中时，这是无法实现的。如果这一点令人困惑，不用担心；我们将在后面的章节中更详细地讨论。\n\n> **实用技巧**\n>\n> *在完成标记之前，不要触碰你的\
    \ CSS 文件。*\n\n## 头部区域\n\n现在我们已经有了基本结构，让我们开始充实每个部分。我们从头部开始。\n\n![](img/f6333180f8a08f96823276b5f118aa35_17_0.png)\n\
    \n我们立刻注意到屏幕右上角有一个导航链接的\"列表\"。因为它是一个列表，使用无序列表似乎是合适的选择！\n\n```\n<div id=\"container\"\
    >\n<div id=\"header\">\n<ul id=\"nav\">\n<li id=\"li_home\"><a href=\"index.html\"\
    >Home</a></li>\n<li id=\"li_work\"><a href=\"work.html\">Work</a></li>\n<li id=\"\
    li_about\"><a href=\"about.html\">About</a></li>\n<li id=\"li_contact\"><a href=\"\
    contact.htm\">Contact</a></li>\n</ul>\n</div>\n```\n\n![](img/f6333180f8a08f96823276b5f118aa35_17_1.png)\n\
    \n注意到每个列表项都被赋予了唯一的 id 吗？这是一个不得已的必要措施，因为我们的导航具有独特性。返回演示页面并将鼠标悬停在每个链接上；你会注意到这样做时每个图标周围会出现温暖的发光效果。为了实现这个效果，我们将使用背景图片。我们需要一种方法来定位每个列表项，以便应用其相应的背景图片——因此有了唯一的\
    \ id。\n\n继续往下看，我们现在来到 logo 和标语部分。我们也应该将这一部分包裹在它自己的 div 中。\n\n![](img/f6333180f8a08f96823276b5f118aa35_18_0.png)\n\
    \n```\n<div id=\"header\">\n    <ul id=\"nav\">\n        <li id=\"li_home\" class=\"\
    selected\"><a href=\"index.html\">Home</a></li>\n        <li id=\"li_work\"><a\
    \ href=\"work.html\">Work</a></li>\n        <li id=\"li_about\"><a href=\"about.html\"\
    >About</a></li>\n        <li id=\"li_contact\"><a href=\"contact.html\">Contact</a></li>\n\
    \    </ul>\n\n    <div id=\"slogan\">\n        <h1><a href=\"index.html\">Light\
    \ Box</a></h1>\n        <img src=\"#\" alt=\"Light Box\" />\n        <p>Hi, we're\
    \ LightBox, a completely made up design agency that specializes in fresh, clean\
    \ web design\nand graphics.\n<a href=\"about.html\">Find out more.</a></p>\n</div><!--\
    \ end slogan-->\n</div><!-- end header-->\n```\n\n我们首先将网站名称放在一个一级标题标签中。为了提高可用性，让\
    \ logo 链接回首页被认为是最佳实践。这可以通过将文字包裹在锚点标签中来轻松实现。\n\n接下来，我们有那个大大的发光方块图形，最后是我们的标语，它被恰当地包裹在段落标签中。暂时不要担心实际的图片，一旦我们切割完\
    \ PSD，它就会可用。目前，我们**只**关注标记结构。\n\n## 主要内容区域\n\n![](img/f6333180f8a08f96823276b5f118aa35_19_0.png)\n\
    \n```\n<div id=\"primaryContent\">\n    <h2 id=\"whatWeDo\">What We Do</h2>\n\
    \    <ul>\n        <li id=\"first\">\n            <h3>Web Development</h3>\n \
    \           <p> ... generic text ... </p>\n        </li>\n        <li id=\"second\"\
    >\n            <h3>Graphics</h3>\n            <p> ... generic text ... </p>\n\
    \        </li>\n        <li id=\"third\">\n            <h3>Usability Design</h3>\n\
    \            <p> ... generic text ... </p>\n        </li>\n    </ul>\n</div><!--\
    \ end primaryContent-->\n```\n\n在这个阶段，我们将\"我们的工作\"标题包裹在 h2 标签中。接下来，我们有三个不同的部分。\n\
    \n1. Web Development\n2. Graphics\n3. Usability Design\n\n初学者可能会假设这里使用三个 div 是合适的——然而，那将是错误的选择。\n\
    \n> **实用技巧**\n>\n> *如果有人问你这部分是什么，你可能会回答说这是我们虚构公司提供的\"服务列表\"。这里的关键词是\"列表\"。因此，我们应该使用无序列表。*\n\
    \n每个列表项包含一个 H3 标签和通用的\"lorem\"虚拟文本（由 ... generic text ... 表示）。我们将在 CSS 文件中使用 background\
    \ 属性来添加图标和独特的字体。这就是给列表项添加\"first\"、\"second\"和\"third\" id 的原因。我们需要一种方法，能够从样式表中单独定位到每一个。\n\
    \n## 次要内容区域\n\n在我们的 primaryContent div 之后，我们需要添加一个 blockquote 元素，它将显示一条随机的客户评价。\n\
    \n> Lightbox did an amazing job with our website. From start to finish they were\
    \ professional, fast and totally fictitious.\n>\n> It was amazing how a company\
    \ that doesn't even exist could put together such an amazing site for us.\n>\n\
    > Thank you Lightbox!\n>\n> — John Rushmore, MADEUPPEOPLE.COM\n\n```\n<div id=\"\
    secondaryContent\">\n    <blockquote>\n        <p>Lightbox did an amazing job\
    \ with our website.\nFrom start to finish they were professional, fast and\ntotally\
    \ fictitious. </p>\n        <p>It was amazing how a company that doesn't\neven\
    \ exist could put together such an amazing site for us.\nThank you Lightbox!</p>\n\
    \    </blockquote>\n    <cite title=\"MadeUpPeople.com\">John Rushmore\n<span>MADEUPPEOPLE.COM</span></cite>\n\
    \    <div class=\"arrow\"></div>\n</div><!-- end secondaryContent-->\n```\n\n\
    有人可能会认为我们可以完全移除这个 div，然后将 blockquote 浮动到右侧。在任何时候，我们都应该评估我们的代码。从技术上讲，那样做是可以接受的；然而，我们必须始终考虑未来。如果几个月后，我们决定网站需要一个带有两栏布局的新页面呢？我们就不幸需要返回到\
    \ HTML 文件来修改标记。为了防止这种情况，我们应该先创建好第二栏。然后，我们可以使用一个\"body\"技巧来确定每个新页面应该由一栏还是两栏组成。你很快就会学到这个技巧！\n\
    \n这段代码中有两点值得注意：\n\n1. cite 标签可能对你来说比较陌生。幸运的是，它非常简单。cite 标签的用法完全如你所想——用来表示引用。是的，我们可以使用诸如\
