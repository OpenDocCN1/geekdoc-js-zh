  - '[PAGE 54]


    # Remember Your Colors


    ![](img/f6333180f8a08f96823276b5f118aa35_54_0.png)


    I''ve found it helpful to hard code my primary colors into my stylesheets as a
    comment. That way, if I forget which hex value I need, I can scroll to the top
    of my file to retrieve the appropriate value, rather than returning to Photoshop
    and using the eyedropper tool.


    # Body


    Typically, the "body" tag will be the first element you style.


    +   1. First, we set the background property equal to the bg.png image that we
    sliced. Remember – if we don''t also include a background color, our website will
    look very strange once the image has ended. To create a smooth transition, we
    set the background color equal to the color of our bg.jpg image at the very bottom
    – in my case, #f1efee. Yours might differ slightly.


    2. Next, we align the text to the center. This has become a habit of mine that
    could truthfully be removed at this point. Originally, it was used as a hack to
    center a website in Internet Explorer 5. By aligning the body to the center, it
    will incorrectly center everything, rather than just the text in this browser.
    It''s not 100% necessary anymore, but I still typically include it – if only out
    of habit.


    3. Finally, we designate our font as "Helvetica" (as well as a few alternatives)
    and set a nice line-height, which will provide our text with some breathing room.
    Why Helvetica? Because that''s the font that was used in our PSD, of course.'
- md: " ## General Styles\n\nBecause we've reset every element, we should set our\
    \ own values for a few common elements. By returning to Photoshop and checking\
    \ the text size, color, and line-height, we can then use those exact values in\
    \ our stylesheet. Simply go to *Window > Character* in Photoshop.\n\n![](img/f6333180f8a08f96823276b5f118aa35_55_0.png)\n\
    \n```\nh1, h2, h3, h4, h5 {\n    margin: 25px 0;\n}\n\nh2 {\n    font-size: 41px;\n\
    \    color: #2f231e;\n    padding-bottom: 25px;\n    margin-top: 45px;\n    border-bottom:\
    \ 1px solid #cec5c0;\n}\n\nh3 {\n    color: #745459;\n    font-size: 30px;\n \
    \   line-height: 33px;\n}\n\n.single h3 {\n    font-size: 24px;\n}\n\nh4 {\n \
    \   color: #2f231e;\n    line-height: 20px;\n    font-size: 16px;\n    text-transform:\
    \ uppercase;\n}\n\np {\n    color: #b45a5b;\n    font-size: 13px;\n    font-family:\
    \ arial;\n}\n\na {\n    text-decoration: none;\n    color: black;\n}\n\na:hover\
    \ {\n    text-decoration: underline;\n}\n```\n\nThese values were taken directly\
    \ from their counterparts within the PSD. To verify, with the Character window\
    \ open, click on a few headings and compare.\n\n## Coding the CSS\n\n## Container\n\
    \nWith our general styles out of the way, we now need to work on our \"container\"\
    \ div. This division will be the wrapper for our entire website.\n\n```\n#container\
    \ {\n    width: 1002px;\n    margin: 0px auto;\n    text-align: left;\n    position:\
    \ relative;\n    background: #f7f5f4 url(../images/containerBG.png) repeat-x;\n\
    }\n```\n\nIf you return to your PSD, grab the ruler tool, and measure the width\
    \ of our website, it will come to 1002px. To center this div on the page, we set\
    \ the margins to auto. This essentially means both the left and right margins\
    \ of this div MUST be the same value. The only way that this is possible is if\
    \ the div is perfectly centered in the browser window. Additionally, we align\
    \ the text back to the left, create a new positioning context, and add our container\
    \ background image.\n\n## Header\n\nLet's begin styling our header. Add the following\
    \ code:\n\n```\n#header {\n    border-left: 1px solid #5e4b3c;\n    border-right:\
    \ 1px solid #5e4b3c;\n    overflow: hidden;\n}\n```\n\n```\n/* Navigation */\n\
    \n#container ul#nav {\n    overflow: hidden;\n    float: right;\n    height: 111px;\n\
    \    margin: 0;\n    margin-top: -13px;\n}\n\n#nav li {\n    float: left;\n  \
    \  font-size: 11px;\n    font-family: arial;\n    text-align: center;\n    width:\
    \ 112px;\n    height: 111px;\n    margin-right: 20px;\n    list-style-type: none;\n\
    }\n\n#nav li a {\n    color: #c7b1cd;\n    height: 111px;\n    display: block;\n\
    \    padding-top: 8px;\n    text-transform: uppercase;\n    text-align: center;\n\
    \    padding-left: 10px;\n}\n\n/* The icons for the navigation */\n\n#nav li#li_home\
    \ {\n    background: url(../images/icons/home.png);\n}\n\n#nav li#li_work {\n\
    \    background: url(../images/icons/work.png);\n}\n\n#nav li#li_about {\n   \
    \ background: url(../images/icons/about.png);\n}\n\n#nav li#li_contact {\n   \
    \ background: url(../images/icons/contact.png);\n}\n```\n\nThough it might initially\
    \ seem confusing, mostly, we're grabbing the values from our PSD and pasting them\
    \ into our CSS file. For instance, in the PSD, the header has a light brown border\
    \ on the left and right.\n\nUsing the eyedropper tool, we grab that hex value,\
    \ and then use the \"border\" property to set it. There's nothing more to it than\
    \ that.\n\nTo show each of our navigation items as a line, we set the \"float\"\
    \ property to \"left\". Now, they'll sit side by side. Next, we set the font attributes,\
    \ add a bit of right-margin to provide some breathing room, and set the list-style\
    \ to none.\n\nNormally, we wouldn't hard-code a width and height value here. However,\
    \ because we're using those navigation icons, we need to return to the PSD and\
    \ measure the width and height of those images. I found them to be 112px wide\
    \ and 111px high.\n\nRemember when we applied a unique id to each list item?\n\
    \n```\n<ul id=\"nav\">\n    <li id=\"li_home\" class=\"selected\"><a href=\"index.html\"\
    >Home</a></li>\n    <li id=\"li_work\"><a href=\"work.html\">Work</a></li>\n \
    \   <li id=\"li_about\"><a href=\"about.html\">About</a></li>\n    <li id=\"li_contact\"\
    ><a href=\"contact.html\">Contact</a></li>\n</ul>\n```\n\nNow that will pay off.\
    \ To target each specific navigation item, we simply use its id, and apply the\
    \ appropriate background icon.\n\nNOTE: As you can imagine, it would be awfully\
    \ boring for you if I were to explain every single property. Instead, download\
    \ the \"Web Developer Extension\" for Firefox, created by Chris Pederick.\n\n\
    > \"The Web Developer extension adds a menu and a toolbar to the browser with\
    \ various web developer tools.\" – http://chrispederick.com/work/web-developer/.\n\
    \nWith that extension installed, begin to experiment by removing a property to\
    \ see how the site changes. For instance, what would happen if we remove the #nav\
    \ li width and height properties completely? This is how I learned, and I recommend\
    \ you do the same.\n\n## Styling The Main Banner\n\nLet's continue on to our main\
    \ banner, or slogan.\n\n```\n<div id=\"slogan\">\n    <h1><a href=\"index.html\"\
    >Light Box</a></h1>\n    <img src=\"images/box.png\" alt=\"Light Box\" />\n  \
    \  <p>Hi, we're LightBox, a completely made up design agency that specializes\
    \ in fresh, clean web design and graphics. <a href=\"about.html\">Find out more.</a></p>\n\
    </div><!-- end slogan-->\n```\n\nAppend the following code to your stylesheet:\n\
    \n```\n#slogan {\n    height: 168px; /* Not typically a good idea to set heights.\
    \ In this case, it's necessary. */\n    clear: both;\n}\n\n/* The Logo */\n\n\
    #slogan h1 {\n    background: url(../images/logo.png) no-repeat;\n    width: 124px;\n\
    \    height: 67px;\n    margin: 0 0 0 165px;\n    position: relative;\n    text-indent:\
    \ -9999px;\n    top: 50px;\n}\n\n#slogan h1 a {\n    display: block;\n    width:\
    \ 124px;\n    height: 67px;\n}\n\n/* The big light box */\n\n#slogan img {\n \
    \   position: absolute;\n    top: -87px;\n    left: -40px;\n}\n\n#slogan p {\n\
    \    margin: -27px 200px 0 319px;\n    padding-left: 27px;\n    padding-top: 5px;\n\
    \    padding-bottom: 5px;\n    font-size: 18px;\n    color: #ab8a7d;\n    border-left:\
    \ 1px solid #4f3b33;\n}\n\n#slogan a {\n    color: white;\n}\n```\n\nWe begin\
    \ by specifying a height for our slogan div. This is generally not desired, however,\
    \ in this case, it makes our job much easier. Next, we use the \"clear\" property\
    \ to ensure that our div clears (or begins below) any floated elements above.\
    \ To gain a better understanding, using the Web Developer Toolbar, remove this\
    \ property and review the difference.\n\nThe \"Light Box\" logo is contained within\
    \ an H1 tag. Rather than hard coding the image into our HTML, we can use a background\
    \ trick.\n\n## Fahrner's Image Replacement Technique\n\nThis technique is named\
    \ after Todd Fahrner (a user interface technology consultant). To achieve our\
    \ desired effect, we must perform the following:\n\n- 1. Measure the width and\
    \ height of the image, using the ruler tool in Photoshop – in this case, 124x67.\n\
    \n- 2. Set the background property to our image's URL.\n\n- 3. Set the width and\
    \ height values equal to what we just measured.\n\n- 4. Set \"text-indent\" equal\
    \ to an enormous negative number, or -9999px. This will shift any text within\
    \ the H1 tag off even the largest of screens, leaving only our image.\n\nYou'll\
    \ most often find this technique implemented to use specific fonts that aren't\
    \ available across all computers. By saving a heading as an image, we can then\
    \ set it as a background and shift our text off the screen.\n\nContinuing on to\
    \ our image of the Light Box, we use absolute positioning to place it in the exact\
    \ coordinates.\n\nBy taking it out of the flow of the document, we can then use\
    \ the left, top, right, and bottom properties to position our element without\
    \ affecting the layout.\n\n## What's The Difference Between Absolute And Relative\
    \ Positioning?\n\nMaybe more than anything else, positioning can prove to be an\
    \ unnecessarily confusing topic for beginning CSS designers. The best way to learn\
    \ is to first tackle absolute positioning. Let's assume that we have a blank html\
    \ and CSS document. If we were to then place an image absolutely on the page –\
    \ say 100px from"
  mdcn: "\n## 通用样式\n\n由于我们已经重置了所有元素，因此需要为一些常用元素设置自己的值。回到 Photoshop 中检查文字大小、颜色和行高，然后就可以在样式表中使用这些精确的值。在\
    \ Photoshop 中，只需转到*窗口 > 字符*。\n\n![](img/f6333180f8a08f96823276b5f118aa35_55_0.png)\n\
    \n```\nh1, h2, h3, h4, h5 {\n    margin: 25px 0;\n}\n\nh2 {\n    font-size: 41px;\n\
    \    color: #2f231e;\n    padding-bottom: 25px;\n    margin-top: 45px;\n    border-bottom:\
    \ 1px solid #cec5c0;\n}\n\nh3 {\n    color: #745459;\n    font-size: 30px;\n \
    \   line-height: 33px;\n}\n\n.single h3 {\n    font-size: 24px;\n}\n\nh4 {\n \
    \   color: #2f231e;\n    line-height: 20px;\n    font-size: 16px;\n    text-transform:\
    \ uppercase;\n}\n\np {\n    color: #b45a5b;\n    font-size: 13px;\n    font-family:\
    \ arial;\n}\n\na {\n    text-decoration: none;\n    color: black;\n}\n\na:hover\
    \ {\n    text-decoration: underline;\n}\n```\n\n这些值直接取自 PSD 中对应的元素。为了验证，打开字符窗口后，点击几个标题进行对比。\n\
    \n## 编写 CSS\n\n## 容器\n\n通用样式设置完成后，我们现在需要处理\"容器\" div。这个 div 将作为我们整个网站的包装器。\n\n\
    ```\n#container {\n    width: 1002px;\n    margin: 0px auto;\n    text-align:\
    \ left;\n    position: relative;\n    background: #f7f5f4 url(../images/containerBG.png)\
    \ repeat-x;\n}\n```\n\n如果你回到 PSD，使用标尺工具测量网站的宽度，会得到 1002px。要使这个 div 在页面居中，我们将外边距设置为\
    \ auto。这实质上意味着该 div 的左右外边距必须是相同的值。唯一可能的情况就是这个 div 在浏览器窗口中完美居中。此外，我们将文本重新左对齐，创建新的定位上下文，并添加容器背景图片。\n\
    \n## 页头\n\n让我们开始设置页头的样式。添加以下代码：\n\n```\n#header {\n    border-left: 1px solid\
    \ #5e4b3c;\n    border-right: 1px solid #5e4b3c;\n    overflow: hidden;\n}\n```\n\
    \n```\n/* 导航 */\n\n#container ul#nav {\n    overflow: hidden;\n    float: right;\n\
    \    height: 111px;\n    margin: 0;\n    margin-top: -13px;\n}\n\n#nav li {\n\
    \    float: left;\n    font-size: 11px;\n    font-family: arial;\n    text-align:\
    \ center;\n    width: 112px;\n    height: 111px;\n    margin-right: 20px;\n  \
    \  list-style-type: none;\n}\n\n#nav li a {\n    color: #c7b1cd;\n    height:\
    \ 111px;\n    display: block;\n    padding-top: 8px;\n    text-transform: uppercase;\n\
    \    text-align: center;\n    padding-left: 10px;\n}\n\n/* 导航图标 */\n\n#nav li#li_home\
    \ {\n    background: url(../images/icons/home.png);\n}\n\n#nav li#li_work {\n\
    \    background: url(../images/icons/work.png);\n}\n\n#nav li#li_about {\n   \
    \ background: url(../images/icons/about.png);\n}\n\n#nav li#li_contact {\n   \
    \ background: url(../images/icons/contact.png);\n}\n```\n\n虽然一开始看起来可能有些令人困惑，但大多数情况下，我们只是从\
    \ PSD 中获取值并粘贴到 CSS 文件中。例如，在 PSD 中，页头左右两侧有浅棕色的边框。\n\n使用吸管工具获取该十六进制值，然后使用\"border\"\
    属性进行设置。就这么简单。\n\n为了让每个导航项排成一行，我们将\"float\"属性设置为\"left\"。现在，它们会并排显示。接下来，我们设置字体属性，添加一些右边距以提供呼吸空间，并将列表样式设为\
    \ none。\n\n通常，我们不会在这里硬编码宽度和高度值。然而，由于我们使用了导航图标，需要回到 PSD 中测量这些图片的宽度和高度。我发现它们是 112px\
    \ 宽和 111px 高。\n\n还记得我们给每个列表项应用了唯一的 id 吗？\n\n```\n<ul id=\"nav\">\n    <li id=\"\
    li_home\" class=\"selected\"><a href=\"index.html\">Home</a></li>\n    <li id=\"\
    li_work\"><a href=\"work.html\">Work</a></li>\n    <li id=\"li_about\"><a href=\"\
    about.html\">About</a></li>\n    <li id=\"li_contact\"><a href=\"contact.html\"\
    >Contact</a></li>\n</ul>\n```\n\n现在这将会派上用场。要定位每个特定的导航项，我们只需使用其 id，并应用相应的背景图标。\n\
    \n注意：你可以想象，如果我逐一解释每个属性，那对你来说会相当乏味。相反，下载 Chris Pederick 为 Firefox 创建的 \"Web Developer\
    \ Extension\"。\n\n> \"Web Developer 扩展程序为浏览器添加了菜单和工具栏，包含各种 Web 开发工具。\" – http://chrispederick.com/work/web-developer/。\n\
    \n安装该扩展程序后，开始尝试移除某个属性以查看网站的变化。例如，如果我们完全移除 #nav li 的 width 和 height 属性会发生什么？我就是这么学习的，建议你也要这样做。\n\
    \n## 设置主横幅样式\n\n让我们继续处理主横幅，或者说标语。\n\n```\n<div id=\"slogan\">\n    <h1><a href=\"\
    index.html\">Light Box</a></h1>\n    <img src=\"images/box.png\" alt=\"Light Box\"\
    \ />\n    <p>Hi, we're LightBox, a completely made up design agency that specializes\
    \ in fresh, clean web design and graphics. <a href=\"about.html\">Find out more.</a></p>\n\
    </div><!-- end slogan-->\n```\n\n将以下代码追加到你的样式表中：\n\n```\n#slogan {\n    height:\
    \ 168px; /* 通常不建议设置高度。但在这种情况下，这是必要的。 */\n    clear: both;\n}\n\n/* 标志 */\n\n#slogan\
    \ h1 {\n    background: url(../images/logo.png) no-repeat;\n    width: 124px;\n\
    \    height: 67px;\n    margin: 0 0 0 165px;\n    position: relative;\n    text-indent:\
    \ -9999px;\n    top: 50px;\n}\n\n#slogan h1 a {\n    display: block;\n    width:\
    \ 124px;\n    height: 67px;\n}\n\n/* 大灯箱图片 */\n\n#slogan img {\n    position:\
    \ absolute;\n    top: -87px;\n    left: -40px;\n}\n\n#slogan p {\n    margin:\
    \ -27px 200px 0 319px;\n    padding-left: 27px;\n    padding-top: 5px;\n    padding-bottom:\
    \ 5px;\n    font-size: 18px;\n    color: #ab8a7d;\n    border-left: 1px solid\
    \ #4f3b33;\n}\n\n#slogan a {\n    color: white;\n}\n```\n\n我们首先为标语 div 指定高度。通常不希望这样做，但在这个例子中，它让我们的工作变得更加容易。接下来，我们使用\
    \ \"clear\" 属性确保我们的 div 清除（或在下方开始）上方任何浮动元素。为了更好地理解，使用 Web Developer 工具栏移除这个属性，观察差异。\n\
    \n\"Light Box\" 标志包含在 H1 标签中。我们不必在 HTML 中硬编码图片，可以使用一种背景技巧。\n\n## Fahrner 的图片替换技术\n\
    \n这种技术以 Todd Fahrner（用户界面技术顾问）命名。要实现我们想要的效果，必须执行以下步骤：\n\n- 1. 使用 Photoshop 中的标尺工具测量图片的宽度和高度——在本例中为\
    \ 124x67。\n\n- 2. 将 background 属性设置为我们图片的 URL。\n\n- 3. 将 width 和 height 值设置为我们刚刚测量的值。\n\
    \n- 4. 将 \"text-indent\" 设置为一个极大的负数，即 -9999px。这会将 H1 标签内的任何文本移出甚至最大的屏幕，只留下我们的图片。\n\
    \n你通常会发现这种技术用于使用并非所有计算机上都可用的特定字体。通过将标题保存为图片，我们可以将其设置为背景并将文本移出屏幕。\n\n继续处理我们的 Light\
    \ Box 图片，我们使用绝对定位将其放置在精确的坐标位置。\n\n通过将其从文档流中移出，我们可以使用 left、top、right 和 bottom 属性来定位我们的元素，而不会影响布局。\n\
    \n## 绝对定位和相对定位有什么区别？\n\n或许比其他任何主题都更甚，定位可能被证明是 CSS 初学者不必要地感到困惑的话题。最好的学习方法是先攻克绝对定位。假设我们有一个空白的\
    \ html 和 CSS 文档。如果我们要在页面上绝对放置一张图片——比如说距离\n"
