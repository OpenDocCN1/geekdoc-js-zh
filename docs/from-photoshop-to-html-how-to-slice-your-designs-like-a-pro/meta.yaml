    \ by importing a JavaScript file created by Dean Edwards (http://dean.edwards.name).\n\
    \nWe use this syntax again to target our \"Submit\" button, as well as when it's\
    \ hovered over with the mouse. Of course, we could still use an id instead, but\
    \ this is more fun!\n\n> **ROCK\\* TIP**\n> \n> Never allow browser deficiencies\
    \ to deter you from advanced selectors. There are plenty of JavaScripts available\
    \ that remedy IE6's shortcomings.\n\n```\ninput[type=submit] {\n    border: 1px\
