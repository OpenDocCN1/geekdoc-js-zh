    # 126 Compensating for Older Browsers


    While these inconsistencies might be intimidating for beginners, you’ll quickly
    learn that a few extra properties can fix huge layout issues. The majority of
    these issues can be fixed by giving an element “layout.”


    > “Layout” is an IE/Win proprietary concept that determines how elements draw
    and bound their content, interact with and relate to other elements, and react
    on and transmit application/user events.”


    On Having Layout http://www.satzansatz.de/cssd/onhavinglayout.html.


    # Why is “Having Layout” Necessary?


    It’s important because it forces the element to have a rectangular shape. This
    means that the content of the element cannot flow around other boxes, which will
    often cause major layout issues with your website.


    When Microsoft’s proprietary property “hasLayout” is equal to true, the element
    “has layout.” Luckily, we can trigger this by adding specific properties to our
    selectors. Personally, my favorite method is to set the height of an element to
    100%. Other possibilities include specifying a width and height, creating a positioning
    context, and setting the “zoom” property equal to 1.'
