    # CSS Sprites


    Though not entirely necessary, it''s considered a best practice to use CSS “sprites”
    when possible. Don''t worry if you don''t know what these are just yet. While
    we''ll go through them in more detail later, here is a quick definition:


    > Sprites allow us to group multiple images into one. Then, when the browser loads
    the page, it only needs to load one large image, rather than several smaller ones.
    Fewer HTTP requests equal faster page loads!'
