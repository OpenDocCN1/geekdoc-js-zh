  md: '# 129


    # Compensating for Older Browsers


    padding, don’t worry about it! Just compensate and move on. You could easily waste
    hours upon hours trying to understand IE6, but ultimately, you’ll be learning
    about a browser that is slowly fading from use. It’s better to concentrate on
    standards-based browsers.


    > ROCK* TIP


    You’ll learn to accept that, sometimes, seemingly random properties are required
    to make IE6 happy!


    # PNG-24 Transparency in IE6


    Notice that nasty gray background behind our Light Box? This is occurring because
    IE6 does not natively support the PNG-24 format. As a result, rather than displaying
    transparency, it instead renders an ugly gray background.


    ![](img/f6333180f8a08f96823276b5f118aa35_128_0.png)'
  merge: -1
