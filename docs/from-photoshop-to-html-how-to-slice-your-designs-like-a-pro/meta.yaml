  md: '# What This Book Includes


    Packaged with this book, you will find:


    +   1) A **directory of example files** made available for your reference. These
    files correspond to the example designs and HTML used in this book, and consists
    of: **Photoshop files for the Light Box Design and HTML / CSS files for the Light
    Box Theme**. These files and themes may be used freely in your projects, both
    commercial and non-commercial. However, they may not be redistributed or resold
    in any way. As you work through this book you may choose to either construct your
    own set of files from scratch, or use the example files as a guide.


    +   2) A series of **six screencasts** covering the whole project from beginning
    to end.


    **To access these files, please use the links provided on the last page of this
    book.**


    # What This Book Assumes


    You should have at least an elementary understanding of HTML and CSS. You should
