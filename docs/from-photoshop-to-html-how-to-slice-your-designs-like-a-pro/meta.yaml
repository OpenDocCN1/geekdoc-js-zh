    Pattern.” Simple!


    # Backgrounds


    Now that we’ve gathered most of our images, we only need to grab our backgrounds,
    and we’ll be finished.


    +   1. Select the marquee tool, or press “M”.

    2. With all the layers turned on, go to Layer > Flatten Image.

    3. Select a long strip of the background. It only needs to be a few pixels wide
    or so. We’ll use CSS to repeat this pattern for the entire width of the window.
    Once you’ve done so, once again follow “The Pattern” (page 36) to save for the
    web.

    4. The only other background we need is the one from the “container” section.
    It may look like a solid color, but it’s actually made up of subtle gradients.
    Remember – subtlety is key here! As before, grab a thin and long strip and follow
    “The Pattern.”


    # That’s It for Now


    Believe it or not, we’ve just finished the bulk of our slicing. Though we’ll need
    to return for a few loose ends, the rest of the job can be done with CSS!'
