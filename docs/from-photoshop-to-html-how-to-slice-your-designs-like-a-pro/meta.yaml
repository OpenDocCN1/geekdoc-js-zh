  md: '# # Foreword


    I''m sure you''ve heard it before. "CSS is easy. Anyone can do it!" Granted, it
    may not be rocket science, but CSS is powerful enough to make you rip your hair
    out.


    On a daily basis – if you listen closely – screams can be heard around the world
    from coders unsuccessfully attempting to force a design into position. It''s not
    just a matter of learning the language; memorization is an easy task. The scream
    inducing points occur when you view your site in ten different browsers, all of
    which render your site at different levels of consistency. When such things occur,
    how do you fix them?


    This is what separates the amateurs from the pros. By the end of this book, you''ll
    be a member of the latter.


    It won''t be an easy task. As a matter of fact, I''m going to teach you to use
    techniques that seemingly make zero sense. Aren''t you glad you purchased this
    book? All kidding aside, you''re going to find that, just because it should work,
    doesn''t mean it will. Just because your design looks great in Firefox, doesn''t
    mean it will in Internet Explorer – in fact this is typically the case. To compensate,
    we''ll be researching the unique "deficiencies" in each browser that will undoubtedly
    prove to give you trouble. When you finish the last page, you''ll have the tools
    to battle the forces of evil and wrangle browsers – even those that are a decade
    old – to work for you, not against.


    > *Jeffrey Way*'
