  md: '# Coding The HTML


    This “Recent Work” div requires a bit more work. It actually takes up the entire
    width of the main content. Considering this, it can’t be placed within either
    the primary or secondary content divs.


    +   1. Per usual, we start with our H2 tag.

    2. Next, we use an ordered list to create the circular buttons. Within this list,
    we add a nested anchor tag, which links to the next image.

    3. We insert our main image. At first glance, it might seem unnecessary to wrap
    the image within this “image\_display” div. It’s actually a necessity. If you’ll
    look at the image closely, you might notice how it has a 1px border, some padding,
    and then another 1px border around the padding. Unfortunately, we can’t achieve
    this effect without creating a wrapper div. It’s a shame, but sometimes sacrifices
    must be made for aesthetics.

    4. Finally, after the div, we add a simple paragraph tag that describes the image
    above.


