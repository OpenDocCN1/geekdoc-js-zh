  md: "Coding the CSS\n\n```\n.image_display img {\n    border: 1px solid #dbcec9;\n\
    }\n```\n\nWe begin by styling our wrapping #recentWork div. Because the blockquote\
    \ above was floated to the right, we must be sure to clear the elements above\
    \ first. Next, it’s generally a smart idea to create a new positioning context\
    \ for your wrapping divs. Finally, we set a 1px border-top – the color being taken\
    \ from the PSD, of course.\n\nContinuing on to our heading two tag “Recent Work”,\
    \ we once again implement Fahrner’s background technique (Page 64) and apply our\
    \ image as a background.\n\nThe ordered list will house our numbered items. When\
    \ the user clicks on a number, we’ll ultimately use jQuery to change the image.\
    \ To position them exactly where we want, we once again use “absolute” positioning.\
    \ Thankfully, we created a new positioning context earlier – otherwise, our top,\
    \ right, bottom, and left values would be placed in reference to the #main div\
    \ instead. A quick use of the “ruler tool” shows that we need 45px of spacing\
    \ from the top border."
