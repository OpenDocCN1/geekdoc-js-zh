  md: '# 91 Coding the CSS


    ![](img/f6333180f8a08f96823276b5f118aa35_90_0.png)


    To create our rounded edges, we use the **-moz-border-radius**, and **-webkit-border-radius**
    properties to target Firefox and Safari / Chrome, respectively. These two values
    are determined slightly differently. Typically, these properties are used to apply
    a subtle curvature to elements. In our case, we wish to create a complete circle.
    100px for Firefox, and 13px for Safari should do the trick. Nifty, ay? Let''s
    also apply a bit of padding to give our numbers some breathing room.


