    \ to use the padding property. Once again, return to your PSD and measure, with\
    \ the ruler tool, the spacing between the edges of the website on each side. By\
    \ my measurements, I found that there was 347px on the left side. By adding this\
    \ value to our padding-left property, we'll create a nice open space that compliments\
    \ our website well.\n\nFor our home page, we're using a simple two-column layout.\
    \ To achieve this effect, we float our \"primaryContent\" div to the left, and\
    \ the \"secondaryContent\" to the right. By specifying specific widths, taken\
    \ from our PSD, our columns will then line up next to each other appropriately.\n\
    \n## Working Example: Columns\n\nIn this quick example, we'll build an extremely\
    \ simple mock layout, consisting of a header, main section, and footer. Within\
    \ the main section, we'll nest two additional divs, which will serve as our two\
