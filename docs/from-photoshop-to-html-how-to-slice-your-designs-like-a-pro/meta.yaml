    \ 创建基本结构 ... 15\n  - 标记语言 ... 16\n  - 标记完成！ ... 27\n- 切割 PSD ... 32\n  - 计划 ...\
    \ 33\n  - Photoshop ... 34\n  - \"存储为 Web 所用格式\" 模式 ... 36\n  - 图片类型的最佳实践 ...\
    \ 39\n  - CSS 雪碧图 ... 41\n  - 修订我们的 HTML ... 46\n- 编写 CSS ... 49\n  - CSS 重置 ...\
    \ 50\n  - 什么是解决方案？ ... 51\n  - DEFAULT.CSS ... 54\n  - 通用样式 ... 56\n  - 容器 ...\
    \ 58\n  - 头部 ... 58\n  - 为横幅添加样式 ... 62\n  - Fahrner 的图片替换技术 ... 64\n  - 绝对定位与相对定位有什么区别？\
    \ ... 65\n  - 主要内容 ... 68\n  - 实用示例：列 ... 69\n  - 关于浮动，事情是这样的 ... 75\n  - 三个标题\
    \ ... 78\n\n---\n\n## 4\n\n- 引用块 81\n- CSS 形状 83\n- 近期作品集 85\n- 之前 86\n- 之后 90\n\
    - 关于页面头部（子页面）101\n- 首页头部 101\n- Body ID 技巧 102\n- 作品页面 104\n- 联系页面 111\n- Cufón\
    \ 字体替换 118\n\n## 适配旧版浏览器 123\n\n- 令人头疼的时刻 124\n- 工具 124\n- 为什么“具有布局”是必要的？ 126\n\
    - 针对特定版本的 Internet Explorer 127\n\n## 附加章节：一点 jQuery 134\n\n- 脚本 135\n- 解析脚本 137\n\
    \n## 结论 140\n\n## 附录 – 进一步学习 142\n\n## 关于作者 143\n\n---\n\n## 前言\n\n我相信你以前肯定听过。“CSS\
    \ 很简单。任何人都能学会！”诚然，它或许不是火箭科学，但 CSS 的强大足以让你抓狂。\n\n每天——如果你仔细倾听——全世界都能听到开发者们在无法成功将设计定位到位时发出的尖叫声。这不仅仅是学习这门语言的问题；死记硬背是件容易的事。真正让人抓狂的时刻，是你在十种不同的浏览器中查看你的网站，而每种浏览器对你的网站的渲染效果都不尽相同。当这种情况发生时，你该如何解决？\n\
    \n这正是业余爱好者与专业人士的区别所在。读完本书，你将成为后者中的一员。\n\n这将不是一项简单的任务。事实上，我将要教你使用一些看似毫无道理的技术。你不会后悔买了这本书吧？说正经的，你会发现问题：仅仅因为它“应该”奏效，并不意味着它就真的奏效。仅仅因为你的设计在\
    \ Firefox 中看起来很棒，并不意味着它在 Internet Explorer 中也一样——事实上，情况通常恰恰相反。为了补偿这一点，我们将研究每个浏览器中独特的“缺陷”，这些缺陷无疑会给你带来麻烦。当你读到最后一页时，你将拥有与这些邪恶势力战斗的工具，并能驾驭浏览器——即使是那些年代久远的——让它们为你所用，而不是与你作对。\n\
    \n> *Jeffrey Way*\n\n---\n\n## 简介\n\n## 本书包含的内容\n\n随书附带，你会发现：\n\n1. 一个供你参考的**示例文件目录**。这些文件对应本书中使用的设计示例和\
    \ HTML，包含：**Light Box 设计的 Photoshop 文件以及 Light Box 主题的 HTML/CSS 文件**。这些文件和主题可以在你的项目中自由使用，无论是商业还是非商业项目。但不得以任何形式重新分发或转售。在学习本书的过程中，你可以选择从头开始构建自己的一组文件，或者将示例文件作为指导。\n\
    \n2. 一系列**六个屏幕录制视频**，涵盖从头到尾的整个项目。\n\n**要访问这些文件，请使用本书最后一页提供的链接。**\n\n## 本书的预设前提\n\
    \n你应该至少具备 HTML 和 CSS 的基础知识。你应该熟悉 HTML 标签和最常见的 CSS 属性。例如，我们将预设你理解以下 HTML 和 CSS\
    \ 代码片段的语法及其关系：\n\n### HTML\n\n```\n<div id=\"myDiv\">\n…some text goes here\n\
    </div>\n```\n\n### CSS\n\n```\n#myDiv {\n    width: 500px;\n    margin: auto;\n\
    \    background: red;\n}\n```\n\n此外，你还应该对 Photoshop 有基本的了解。\n\n## 本书不预设的内容\n\n\
    除了对这两种语言语法的基础理解外，不预设其他任何知识。\n\n## 所需工具\n\n在将 PSD 转换为 HTML 和 CSS 时，拥有合适的工具将使你事半功倍。幸运的是，除了\
    \ Photoshop，还有大量可用的程序和扩展，其中大部分是免费的。在本书中，我们将使用以下工具：\n\n## Komodo Edit\n\nhttps://www.activestate.com/komodo_edit/downloads/\n\
    \n针对 Mac 和 PC 平台，有各种免费的代码编辑器。简单的 Google 搜索就能找到多种选择。Komodo Edit 是一个能很好地服务两个平台用户的工具。\n\
    \n## Firefox 的 Web Developer 扩展\n\nhttps://addons.mozilla.org/en-US/firefox/addon/60\n\
    \n这个巧妙的扩展允许你在浏览器内编辑 CSS、禁用 JS、应用标尺、验证 HTML 和 CSS 等等。几乎所有开发者都会安装这个必备工具。你也应该安装。\n\
    \n## IE Tester\n\nhttp://www.my-debugbar.com/wiki/IETester/HomePage\n\n不幸的是，即使过了十年，在转换设计时，我们仍然需要为旧版浏览器——主要是\
    \ Internet Explorer 6——做出补偿。不过，你很可能已经安装了 IE7 或 IE8。为了在这种浏览器中预览你的设计，PC 用户的一个选择是\
    \ IE Tester。它允许你在 IE5 到 IE8 中查看任何网站。\n\n## BrowserShots.org\n\nhttp://browsershots.org/\n\
    \n如果你使用 Mac 工作（或者需要在更多种类的浏览器中测试），第二个选择是使用一个名为 Browsershots 的网站，它可以在所有浏览器中为你的设计拍摄快照。\n\
    \n## VMWare Fusion\n\nhttp://www.vmware.com/products/fusion/\n\n尤其是在设计领域，Mac 用户正在迅速成为主流。尽管\
    \ Browsershots 确实很有帮助，但当需要在 IE6 中测试时，最好的选择有时是使用像 VMWare Fusion 这样的程序。正如他们所说，“在\
    \ Mac 上运行 Windows 甚至更好！”。一旦加载完成，你就可以轻松地运行 IE Tester。\n\n---\n\n## 编写 HTML\n\n\
    虽然立刻开始处理网站的视觉效果看起来很自然，但事实恰恰相反。相反，我们必须先构建我们的基础，即标记语言（mark-up），只有在完成之后，我们才能转向视觉设计。\n\
    \n在本节中，我们将分析设计，然后将结构转换为 HTML 标记语言。\n\n## 编写 HTML\n\n考虑以下布局：\n\n我们将把这个确切的设计转换成一个完整的\
    \ HTML/CSS 网站！在查看这样的设计时，我们必须从 HTML 的角度开始在脑海中构建布局。经过一些观察，你可能会想象出如下的布局：\n\n## 编写\
    \ HTML\n\n你在查看每个设计时都应该开始这样思考。这个布局本质上分为三个部分：\n\n1. 头部（Header）\n2. 主要内容（Main Content）\n\
    3. 页脚（Footer）\n\n你会发现大多数网站都有类似的结构。有些可能会多几列，但总的来说，你总会找到这三个组成部分。\n\n## 创建基本结构\n\n\
    现在我们已经从开发者的角度可视化了我们的设计，让我们创建基本的 HTML 格式。\n\n我们首先创建一个“容器”分区（division）。这样，如果需要，我们只需更改一个\
    \ div 就可以定位整个网站。\n\n> ROCK* 提示\n> 把一个 div 想象成一个盒子。在这个 div 内部，我们可以插入一堆东西（元素）。然后，如果我们需要移动所有这些东西，我们只需拿起我们的盒子并重新定位它！\n\
    \n```\n<div id=\"container\">\n...stuff\n</div>\n```\n\n接下来，添加更多的分区。暂时忽略具体内容，只关注包裹元素，让我们添加我们的三个组成部分：\n\
    \n```\n<div id=\"container\">\n\t<div id=\"header\">\n\t\theader content goes\
    \ here\n\t</div>\n\t<div id=\"main\">\n\t\tmain body goes here\n\t</div>\n\t<div\
    \ id=\"footer\">\n\t\tfooter info goes here\n\t</div>\n</div>\n```\n"
