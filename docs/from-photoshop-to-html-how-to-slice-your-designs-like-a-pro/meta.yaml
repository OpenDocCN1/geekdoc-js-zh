    simple CSS!


    # Photoshop


    Let’s visit Photoshop and begin! When it comes to “slicing” PSDs, there are two
    acceptable practices:


    +   1. The first group believes that you should use Photoshop’s “slice” tool to
    get the job done. It was created specifically for this function, so why not use
    it?

    2. The second prefers to use a mixture of cropping, and copy/paste methods, because
    they feel that it makes for a quicker process.


    Both methods are perfectly valid. I recommend that you try both, and choose which
    ever proves to be


    > ROCK* TIP

    An easy way to target a specific layer is to turn on “Auto Select.”

    a) Click on the Move Tool (V).

    b) Make sure that the “Auto Select” checkbox is checked. It’ll be in the upper-left
    side of the screen.

    c) Click on the logo. Notice how it immediately selected the appropriate layer?'
