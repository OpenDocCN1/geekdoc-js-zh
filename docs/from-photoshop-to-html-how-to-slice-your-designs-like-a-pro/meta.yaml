    # 75


    # Coding the CSS


    If you''re like me, your initial instinct, in this scenario, would have been to
    simply create a third div, or `#primary`, `#secondary`, `#thirdly` `div`s. While
    this method does work, you''ll find that it can be a bit difficult to line them
    up perfectly. This is because floats are very tricky things. **The addition of
    even a single pixel can potentially destroy a layout.** Considering this, the
    method demonstrated above will be your best option in most situations.


    # Here''s The Thing about Floats


    Now you surely must have noticed something strange occur once you began floating
    the divs. What happened to the container div''s red background when we floated
    its children? Why did the red abruptly end right below the header? Since the container
    is a wrapper, shouldn''t we see a red background instead of white?


    Secondly, why is the footer (the black) taking up so much space, and why is it
    in the wrong place? The black should be BELOW the main content? What''s the problem?


    When you float an element, you''re taking it out of the flow of the document.
    In our situation, we''ve floated BOTH elements within our "main" div. In other
    words, they''re essentially taking up no space. As a result, the red background
    prematurely ends, and the footer jumps to the top.


    # Fixes


    Over the years, there have been many fixes for this problem, most of which are
    still in use today. Let''s review the three most common:'
- md: " ## Coding the CSS\n\n## Fix 1: Clear:both\n\nReturn to your HTML structure.\
    \ Just before the closing \"main\" div, append the following empty div:\n\n```\n\
    <div style=\"clear: both;\" />\n</div><!--end main-->\n```\n\nBy applying the\
    \ \"clear\" property, we can force the \"main\" div to clear (or contain) its\
    \ floated children. This method definitely works, but there's just one problem:\
    \ we've added a bit of unsemantic markup. Is there a way to accomplish this without\
    \ adding useless divs? Yep!\n\n## Fix 2: Clearfix Hack\n\nThis second fix uses\
    \ a bit of advanced CSS to clear any floats. Consider the following styles:\n\n\
    ```\n#main:after {\n    content: \".\";\n    display: block;\n    height: 0;\n\
    \    clear: both;\n    visibility: hidden;\n}\n```\n\nHere, we're using the \"\
    after\" pseudo-class to append content after the element from which it was referenced,\
    \ in this case, the \"main\" div. Most importantly, take note of the \"content\"\
    \ property. It might look a bit complicated at first, but it's actually quite\
    \ simple. We're simply adding a period. Now of course, we don't want this period\
    \ to display on the page. To compensate, we've set the \"visibility\" property\
    \ to \"hidden.\" Now that we've added a bit of content after our \"main\" div,\
    \ we can simulate the actions from Fix 1: set \"clear\" to \"both\", and \"display\"\
    \ to \"block\". However, note that pseudo classes, such as \":after\" will not\
    \ be understood by Internet Explorer 6 and below.\n\nThat's all there is to it.\
    \ This will work, but it's still somewhat tedious. Luckily, we can work around\
    \ this entire issue simply by adding one style! It's a wonder how this final method\
    \ was only popularized a couple of years ago.\n\n## Fix 3: Overflow: Hidden\n\n\
    Remove all of your code from Fixes 1 and 2 – we'll no longer need it. In their\
    \ place, add one property to the \"main\" div.\n\n```\n#main {\n    ..other styles\n\
    \    overflow: hidden;\n}\n```\n\nBelieve it or not, this one property solves\
    \ our problem. If you'll remember back to the first few pages of this book, I\
    \ referenced the fact that, sometimes, a solution makes little sense, if any.\
    \ This is absolutely true in this case. Nevertheless, it works.\n\n> ROCK* TIP\n\
    > \n> *If you float more than one element within a parent, add \"overflow: hidden;\"\
    \ to the parent's styling. This will force the wrapping element to contain the\
    \ floated elements.*\n\n## The Three Headings\n\nIf you've come this far, you're\
    \ doing very well! This stuff is tricky! We must now style our three headings.\
    \ When we converted our PSD, we saved these as one large image. That will pay\
    \ off now when we use CSS sprites to display only our desired portion of the image.\n\
    \n## Coding the CSS\n\n```\n#primaryContent ul h3 {\n    text-indent: -9999px;\n\
    \    height: 34px;\n    margin-bottom: 13px;\n}\n\n/* Sprites are used here. The\
    \ same image contains all of\nthe headings. We use the background-position property\
    \ to\nshift the image upward. */\n\n/* What We Do */\n#primaryContent li#first\
    \ h3 {\n    background: url(../images/whatWeDoHeadings.png) no-repeat 0 0;\n}\n\
    \n/* Graphics */\n#primaryContent li#second h3 {\n    background: url(../images/whatWeDoHeadings.png)\
    \ no-repeat 0 -34px;\n}\n\n/* Usability Design */\n#primaryContent li#third h3\
    \ {\n    background: url(../images/whatWeDoHeadings.png) no-repeat 0 -68px\n}\n\
    ```\n\n```\n#first p, #second p, #third p {\n    padding-left: 50px;\n}\n```\n\
    \nWe'll be implementing the same background technique that we learned earlier.\
    \ Most importantly, take note of the fact that we set the height of our heading\
    \ three tag to \"34px\", or one-third of the entire height of our image. This\
    \ will, in effect, cut off the other headings. Additionally, we've set a margin-bottom\
    \ of 13px to add some breathing room.\n\nNext, we need to target each heading\
    \ individually. Because we created a unique id for these headings when we created\
    \ our markup, we have the ability to do so. Each heading will use the exact same\
    \ image as its background, but the browser will only need to load it once. This\
    \ is how we save bandwidth. The key here is that we're using background positioning\
    \ to shift the image. Notice how the graphic has been shifted upward -34px — or\
    \ the height of our h3 tags exactly. The \"Usability Design\" heading will have\
    \ that number doubled to 68px accordingly as well. It's as simple as that. If\
    \ your eyes are glossing over as you read this, I don't blame you! Use the web\
    \ developer extension, and just play around with the positioning to better understanding.\n\
    \nFinally, we need to add 50px worth of padding-left to our paragraphs in order\
    \ to shift them enough so that they're directly under the heading, rather than\
    \ under the icon.\n\n## Blockquote\n\nLet's now style our testimonials section.\
    \ This shouldn't be too difficult. Here's the HTML code:\n\n```\n<div id=\"secondaryContent\"\
    >\n    <blockquote>\n        <p>Lightbox did an amazing job with our website.\
    \ From start to finish they were professional, fast and totally fictitious. </p>\n\
    \        <p>It was amazing how a company that doesn't even exist could put together\
    \ such an amazing site for us. Thank you Lightbox!</p>\n    </blockquote>\n  \
    \  <cite title=\"MadeUpPeople.com\">John Rushmore\n<span>MADEUPPEOPLE.COM</span></cite>\n\
    <div class=\"arrow\"></div>\n</div><!-- end secondaryContent-->\n```\n\nNow paste\
    \ in the following CSS into your stylesheet.\n\n```\nblockquote {\n    background:\
    \ #e6e2df;\n    color: #7fb357;\n    padding: 23px;\n    font: italic 20px/27px\
    \ georgia;\n}\n\nblockquote p {\n    font-size: 20px;\n    margin-bottom: 1em;\n\
    \    color: #7fb357;\n    font-family: georgia;\n}\n\n#secondaryContent cite {\n\
    \    font: bold normal 15px arial;\n    color: #2f231e;\n    float: right;\n \
    \   padding-right: 20px;\n    padding-top: 35px;\n    font-weight: bold;\n}\n\n\
    #secondaryContent cite span {\n    font-size: 10px;\n    line-height: 10px;\n\
    \    display: block;\n    color: #89451f;\n}\n```\n\n## Coding the CSS\n\nHopefully,\
    \ you're beginning to learn that converting a design from a PSD to a working website\
    \ is partially a process of copy and paste. Take the blockquote, for example;\
    \ the background-color, text color, font-size, font-family, and padding are 100%\
    \ taken from the PSD. It's just a simple matter of using the eyedropper, ruler,\
    \ and text tool.\n\nWe must style the author's website URL separately. This is\
    \ why the address is wrapped within a span tag. We can easily target that specific\
    \ text and style it accordingly by using the following selector: #secondaryContent\
    \ cite span — or, find the span tag that is within a cite, which is within an\
    \ element with an id of \"secondaryContent\". Once again, these values were taken\
    \ directly from their counterparts in the PSD.\n\n## CSS Shapes\n\nDid you know\
    \ that the illusion of a shape can be created with 100% CSS? We're going to use\
    \ this technique to create the arrow at the bottom of our blockquote.\n\nThe key\
    \ is with the extra div that we added to our markup.\n\n```\n<div class=\"arrow\"\
    ></div>\n```\n\nReturn to your stylesheet, and just below the blockquote selectors,\
    \ add the following:\n\n## Coding the CSS\n\n```\n/* The CSS arrow! */\n\n.arrow\
    \ {\n    width: 0;\n    height: 0;\n    line-height: 0;\n    border-top: 30px\
    \ solid #e3e3e3;\n    border-left: 60px solid #f7f5f4;\n    border-right: 10px\
    \ solid #f7f5f4;\n    position: absolute;\n    right: 30px;\n}\n```\n\nReload\
    \ index.html in your browser, and you'll see your arrow! Actually, we're still\
    \ working with a square; nothing has changed. However, by setting the width and\
    \ height properties equal to zero, we can then create our triangle using the border\
    \ properties. If we set the color of our borders equal to the background color\
    \ of our page, those sections will appear to not exist, thus creating the illusion\
    \ of a shape.\n\nTo better understand, look what happens when we change the border\
    \ colors."
  mdcn: "\n## 编写 CSS 代码\n\n## 修复方法一：使用 Clear:both\n\n回到你的 HTML 结构。就在闭合的 \"main\" div\
    \ 之前，添加以下空 div：\n\n```\n<div style=\"clear: both;\" />\n</div><!--end main-->\n\
    ```\n\n通过应用 \"clear\" 属性，我们可以强制 \"main\" div 清除（或包含）其浮动的子元素。这个方法绝对有效，但有一个问题：我们添加了一些无语义的标记。有没有办法在不添加无用\
    \ div 的情况下实现这一点呢？当然有！\n\n## 修复方法二：Clearfix 技巧\n\n这第二种修复方法使用了一些高级的 CSS 来清除任何浮动。请看以下样式：\n\
    \n```\n#main:after {\n    content: \".\";\n    display: block;\n    height: 0;\n\
    \    clear: both;\n    visibility: hidden;\n}\n```\n\n这里，我们使用了 \"after\" 伪类，在它所引用的元素（本例中是\
    \ \"main\" div）之后追加内容。最重要的是，注意 \"content\" 属性。它起初可能看起来有点复杂，但实际上相当简单。我们只是添加了一个句点。当然，我们不希望这个句点显示在页面上。为此，我们将\
    \ \"visibility\" 属性设置为 \"hidden\"。现在我们在 \"main\" div 之后添加了一些内容，我们可以模拟修复方法一的操作：将\
    \ \"clear\" 设置为 \"both\"，将 \"display\" 设置为 \"block\"。然而，请注意，诸如 \":after\" 之类的伪类，Internet\
    \ Explorer 6 及更低版本将无法识别。\n\n这就是全部内容。这个方法有效，但它仍然有些繁琐。幸运的是，我们可以通过添加一个样式来完全解决整个问题！令人惊讶的是，这最后一种方法直到几年前才流行起来。\n\
    \n## 修复方法三：使用 Overflow: Hidden\n\n删除你在修复方法一和修复方法二中的所有代码——我们将不再需要它。在它们的位置，为 \"\
    main\" div 添加一个属性。\n\n```\n#main {\n    ..other styles\n    overflow: hidden;\n\
    }\n```\n\n信不信由你，这一个属性就解决了我们的问题。如果你还记得本书的前几页，我提到过，有时，一个解决方案可能没什么道理，甚至完全没道理。在这种情况下，这绝对是事实。尽管如此，它确实有效。\n\
    \n> ROCK* 小贴士\n> \n> *如果你在父元素内浮动了多个元素，请在父元素的样式中添加 \"overflow: hidden;\"。这将强制包裹元素包含浮动的元素。*\n\
    \n## 三个标题\n\n如果你已经读到了这里，你做得非常棒！这些东西很棘手！我们现在必须为三个标题设置样式。当我们转换 PSD 文件时，我们将它们保存为一张大图。现在，当我们使用\
    \ CSS 雪碧图只显示我们想要的图像部分时，这就会派上用场。\n\n## 编写 CSS 代码\n\n```\n#primaryContent ul h3\
    \ {\n    text-indent: -9999px;\n    height: 34px;\n    margin-bottom: 13px;\n\
    }\n\n/* 这里使用了雪碧图。同一张图像包含了所有标题。\n我们使用 background-position 属性将图像向上移动。 */\n\n/* What\
    \ We Do */\n#primaryContent li#first h3 {\n    background: url(../images/whatWeDoHeadings.png)\
    \ no-repeat 0 0;\n}\n\n/* Graphics */\n#primaryContent li#second h3 {\n    background:\
    \ url(../images/whatWeDoHeadings.png) no-repeat 0 -34px;\n}\n\n/* Usability Design\
    \ */\n#primaryContent li#third h3 {\n    background: url(../images/whatWeDoHeadings.png)\
    \ no-repeat 0 -68px\n}\n```\n\n```\n#first p, #second p, #third p {\n    padding-left:\
    \ 50px;\n}\n```\n\n我们将使用之前学到的相同背景技术。最重要的是，注意我们将 h3 标签的高度设置为 \"34px\"，即整个图像高度的三分之一。这实际上将切断其他标题。此外，我们设置了\
    \ 13px 的下边距来增加一些呼吸空间。\n\n接下来，我们需要单独针对每个标题。因为我们在创建标记时为这些标题创建了唯一的 id，所以我们能够做到这一点。每个标题都将使用完全相同的图像作为其背景，但浏览器只需要加载它一次。这就是我们节省带宽的方式。关键在于我们使用背景定位来移动图像。注意图形是如何向上移动了\
    \ -34px —— 或者说正好是我们的 h3 标签的高度。\"Usability Design\" 标题的相应数字将加倍到 68px。就这么简单。如果你读到这里眼睛都花了一点，我不怪你！使用\
    \ Web 开发者扩展，然后尝试调整定位以更好地理解。\n\n最后，我们需要为段落添加 50px 的左内边距，以便将它们移动足够远，使其直接位于标题下方，而不是在图标下方。\n\
    \n## 引用块\n\n现在让我们为推荐语部分设置样式。这应该不会太困难。这是 HTML 代码：\n\n```\n<div id=\"secondaryContent\"\
    >\n    <blockquote>\n        <p>Lightbox 为我们的网站做得非常出色。从开始到结束，他们都表现得专业、迅速，而且完全是虚构的。</p>\n\
    \        <p>令人惊讶的是，一家甚至不存在的公司竟然能为我们搭建如此出色的网站。谢谢 Lightbox！</p>\n    </blockquote>\n\
    \    <cite title=\"MadeUpPeople.com\">John Rushmore\n<span>MADEUPPEOPLE.COM</span></cite>\n\
    <div class=\"arrow\"></div>\n</div><!-- end secondaryContent-->\n```\n\n现在将以下\
    \ CSS 粘贴到你的样式表中。\n\n```\nblockquote {\n    background: #e6e2df;\n    color: #7fb357;\n\
    \    padding: 23px;\n    font: italic 20px/27px georgia;\n}\n\nblockquote p {\n\
    \    font-size: 20px;\n    margin-bottom: 1em;\n    color: #7fb357;\n    font-family:\
    \ georgia;\n}\n\n#secondaryContent cite {\n    font: bold normal 15px arial;\n\
    \    color: #2f231e;\n    float: right;\n    padding-right: 20px;\n    padding-top:\
    \ 35px;\n    font-weight: bold;\n}\n\n#secondaryContent cite span {\n    font-size:\
    \ 10px;\n    line-height: 10px;\n    display: block;\n    color: #89451f;\n}\n\
    ```\n\n## 编写 CSS 代码\n\n希望你开始明白，将设计从 PSD 转换为可工作的网站，部分是一个复制粘贴的过程。以引用块为例；背景色、文字颜色、字体大小、字体族和内边距都是\
    \ 100% 从 PSD 中获取的。这只是一个使用吸管工具、尺子和文本工具的简单事情。\n\n我们必须单独设置作者网站 URL 的样式。这就是为什么地址被包裹在\
    \ span 标签中。我们可以通过使用以下选择器轻松地定位到特定的文本并相应地设置样式：#secondaryContent cite span —— 或者，找到在\
    \ cite 内的 span 标签，而 cite 又在一个 id 为 \"secondaryContent\" 的元素内。再次强调，这些值都是直接从 PSD\
    \ 中对应的元素获取的。\n\n## CSS 形状\n\n你知道吗？可以使用 100% 的 CSS 来创建形状的错觉？我们将使用这种技术来创建引用块底部的箭头。\n\
    \n关键在于我们添加到标记中的那个额外的 div。\n\n```\n<div class=\"arrow\"></div>\n```\n\n回到你的样式表，就在引用块选择器下方，添加以下内容：\n\
    \n## 编写 CSS 代码\n\n```\n/* CSS 箭头！ */\n\n.arrow {\n    width: 0;\n    height: 0;\n\
    \    line-height: 0;\n    border-top: 30px solid #e3e3e3;\n    border-left: 60px\
    \ solid #f7f5f4;\n    border-right: 10px solid #f7f5f4;\n    position: absolute;\n\
    \    right: 30px;\n}\n```\n\n在浏览器中重新加载 index.html，你就会看到你的箭头了！实际上，我们仍然在处理一个正方形；什么都没变。然而，通过将\
    \ width 和 height 属性设置为零，我们就可以使用边框属性来创建三角形。如果我们把边框的颜色设置得和页面的背景色一样，这些部分就会看起来不存在，从而创造出形状的错觉。\n\
    \n为了更好地理解，看看当我们改变边框颜色时会发生什么。\n"
