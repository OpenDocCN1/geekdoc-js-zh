    # Coding the CSS


    Hopefully, you''re beginning to learn that converting a design from a PSD to a
    working website is partially a process of copy and paste. Take the blockquote,
    for example; the background-color, text color, font-size, font-family, and padding
    are 100% taken from the PSD. It''s just a simple matter of using the eyedropper,
    ruler, and text tool.


    We must style the author''s website URL separately. This is why the address is
    wrapped within a span tag. We can easily target that specific text and style it
    accordingly by using the following selector: #secondaryContent cite span – or,
    find the span tag that is within a cite, which is within an element with an id
    of "secondaryContent". Once again, these values were taken directly from their
    counterparts in the PSD.


    # CSS Shapes


