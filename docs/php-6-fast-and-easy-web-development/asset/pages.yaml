  md: '# Introduction


    In the two years since the first edition of PHP Fast & Easy Web Development was
    published, I''ve received a significant amount of positive feedback regarding
    the teaching style of this book. I was originally skeptical when, about a month
    after the release of my first book, PHP Essentials, my editors that a Fast & Easy
    version was warranted. The Fast & Easy style is a step-by-step, learn-by-example


    learning a new programming language—with pictures included! Unlike the long, text-filled
    chapters upon chapters of most programming books, the Fast & Easy style did indeed
    appeal to users who are new to PHP, and especially to programming in.


    This second edition takes into account some of the feedback from the first edition,
    holds true to the original structure and learning path. The first three chapters
    are dedicated to getting Apache, MySQL, and PHP up and running on your Windows
    or Linux machine. You may be surprised at how simple it is, and how quickly you''ll
    be up and running.


    A additional chapters have been added to provide additional projects for practicing
    your new skills; some appendices of additional database and programming information
    also round out this new edition. This book remains a solid introduction for the
    beginner user, who learns best by example. After completing this book, you will
    have a strong foundation in the basics before approaching advanced levels of application
    design.


    Before jumping into it all, take a moment to familiarize yourself with PHP and
    its history.


    # What Is PHP?


    Its official name is PHP: Hypertext Preprocessor, and it is a server-side scripting
    language. When your Web browser accesses a URL, it is making a request to a Web
    server. When you request a PHP page, something like http://www.yourcompany.com/home.php,
    the Web server wakes up the PHP parsing engine and says, "Hey! You''ve got to
    do something before I send a result back to person''s Web browser.


    Then, the PHP parsing engine runs through the PHP code in home.php, and returns
    the resulting output. This output is passed back to the Web server as part of
    the HTML code in the document, which in turn is passed on your browser, which
    displays it to.


    # A Brief History of PHP


    In 1994, an incredibly forward-thinking man named L Lorf developed a set of tools
    that used a parsing engine to interpret a few macros here and there. They were
    not extravagant: a guest book, a counter, and some other "home page" elements
    that were cool when the Web was in infancy. He eventually combined'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'these tools with a form interpretation (FI) package he had written, added some
    database support, and released what was known as PHP/FI.


    Then, in the spirit of Open Source software development, developers all over the
    world began contributing to PHP/FI. By 1997, more than 50,000 Web sites were using
    PHP/FI to accomplish different tasks—connecting to a database, displaying dynamic
    content, and so on.


    At that point, the development process really started becoming a team effort.
    With primary assistance from developers Zeev Suraski and Andi Gutmans, the version
    3.0 parser was created. The final release of PHP 3.0 occurred in June of 1998,
    when it was upgraded to include support for multiple platforms (it''s not for
    Linux anymore!) and Web servers, numerous databases, and SNMP (Simple Network
    Management Protocol) and IMAP (Internet Message Access Protocol).


    Then, the birth of PHP 4.0 occurred. No small version change, PHP 4.0 marked a
    rethinking of the PHP core and a rewrite of the scripting language itself. The
    PHP development team and Zend Technologies produced a remarkable product with
    nearly a 50-performance improvement over version 3.0, with a long list of new
    and useful features.


    So are we now?


    +   - Over 7 million Servers worldwide run the 4.x version of PHP.

    - PHP 4.x has been in for over two years, with the current version being 4.2.1.

    - PHP 4.x can work with just any combination of Web server, operating system,
    and database you can think up.

    - Companies such as Zend Technologies have released products to optimize and accelerate
    PHP, as well as "studio" environments for developing and testing PHP code.

    - PHP usage has exploded as an enterprise application development solution—it''s
    not just for home pages and small projects any more!


    # What Does PHP Do?


    PHP does anything you want, except sit on its head and spin. Actually, with a
    little on-the-fly image manipulation and Dynamic HTML, it could probably do that,
    too.


    According to the PHP manual, "The goal of the language is to allow Web developers
    to write dynamically generated pages quickly."


    Here are some common uses of PHP:


    +   - Perform system functions: create, open, read from, write to, and close files
    on your system; execute system commands; create directories; and modify permissions.

    - Gather data from forms: save the data to a file, send data via e-mail, return
    manipulated data to the user.'
  merge: -1
  pgno: 3
- img_proc: true
  md: '+   * Access databases and generate content on-the-fly, or create a Web interface
    for adding, deleting, and modifying elements within your database.

    * Set cookies and access cookie variables.

    * Start sessions and use session variables and objects.

    * Use PHP authentication to restrict access to sections of your Web site.

    * Create images-on-the-fly.

    * Encrypt data.


    These are everyday uses. PHP includes support for Java, Java Servlets, XML, and
    a myriad of other higher-level functions. The possibilities are


    # # Is PHP Right for Me?


    Only you can decide if PHP should be your language of choice, whether you''re
    developing sites for personal or commercial use on a small or large scale. I can
    only tell you that in the commercial realm, I''ve worked with all the popular
    server-side scripting languages—Active Server Pages (ASP), ColdFusion, Java Server
    Pages (JSP), Perl, and—on numerous platforms and Web servers, with varying degrees
    of success. PHP is the right choice for me: it''s flexible, fast, and simple in
    its requirements, powerful in its output.


    Before deciding whether to use PHP in a large-scale or commercial environment,
    consider your answers to these questions:


    +   * Can you say with absolute certainty that you will always use the same Web
    server hardware and software? If not, look for something cross-platform that is
    available for all types of servers: PHP.

    * Will you have the exact same development team comprised entirely of ASP (or
    ColdFusion) developers? Or will whoever is available, necessitating a language
    that is easy to learn and syntactically similar to C and Perl? If you have reason
    to believe that your ASP or ColdFusion developers might drop off the face of the
    earth, don''t use these tools—use PHP.

    * Are memory and server load issue? If so, don''t use bloated third-party software
    that leaks precious memory—use PHP.


    Here''s the bottom line: PHP is simple, just try it! If you like it, continue
    using it. It''s Open Source, so help it. Join a mailing list, and help others.
    If you don''t like it, you''re only out about 25 bucks for this book, and the
    software can be uninstalled without rendering your machine completely inoperable.


    # # More Stuff


    This book has its own site. That figures'
  merge: -1
