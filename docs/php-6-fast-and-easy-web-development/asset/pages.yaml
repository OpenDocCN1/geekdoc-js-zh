    # WeberDev (www.weberdev.com)


    A longtime favorite of PHP developers, this site contains development tricks and
    tips for many programming languages (just to be fair) as well as a content management
    system for everyone to add their code snippets, tutorials, and more! It has a
    great weekly newsletter and high traffic. Continue!


    # PHPBuilder (www.phpbuilder.com)


    This is a very good tutorial for intermediate and advanced PHP developers. It
    contains weekly How To Columns for real-world applications, as "Building Dynamic
    Pages With Search Engines in Mind," "Generating Pronounceable Pass," and tons
    more. Recommended!


    # DevShed (www.devshed.com)


    This site contains many user-submitted tutorials, news articles, interviews, and
    competitive analyses of server-side programming languages. Covers PHP as well
    as many other topics of interest to developers, such as servers and databases.


    # px.sklar.com


    This is a bare-bones code repository, but who needs graphics when all you''re
    looking for code snippets? Borrowing from the "take a penny, leave a penny" mentality,
    you grab a code snippet to start and then add your own when you feel confident
    in sharing.


    # PHP KnowledgeBase (php.faqs.com)


    The PHP Knowledge Base contains questions and answers posed on PHP mailing lists.
    Anyone can answer questions at the Web site or ask new ones.


    # Mailing Lists


    Several high-traffic mailing lists are available for PHP discussion in English
    as well as other languages. Please remember your netiquette when asking a question:
    be polite, offer as many examples as you can (if you''re describing a problem),
    provide your system information (if looking for a solution), and did I mention
    to say please and thank you?'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'You can find mailing list subscription information in the Support section at
    http://www.php.net/. The English PHP mailing lists are archived and available
    for searching at http://marc.theaimsgroup.com/. Just look for the PHP-related
    lists under the WWW heading.


    # User Groups


    Sometimes, knowing other developers in real life can prove helpful. You can find
    a list of PHP user groups at http://www.phpusergroups.org/.


    # MySQL Resources


    Many of the PHP-related Web sites listed earlier also contain information on development
    with MySQL, but the MySQL Web site http://www.mysql.com/ is the place to start
    for comprehensive MySQL information.


    The online MySQL manual is immense, but it''s so well-written and useful that
    its size should not scare you. You can find the manual at http://www.mysql.com/doc/.
    If you''re looking for a quick introduction to MySQL, I have written a book called
    *Teach Yourself MySQL in 24 Hours*, available in bookstores worldwide.


    As with PHP, several high-traffic mailing lists are available for MySQL discussion,
    in English as well as other languages. You can find mailing list subscription
    information at http://www.mysql.com/documentation/lists.html, and the MySQL mailing
    lists are archived and available for searching at http://marc.theaimsgroup.com/
    as well.


    # Apache Resources


    Start at the Apache Foundation Web site, http://www.apache.org/, for server documentation
    and a list of FAQs. Many of the developer-oriented Web sites offer Apache-specific
    tutorials—you just have to hunt them down.'
