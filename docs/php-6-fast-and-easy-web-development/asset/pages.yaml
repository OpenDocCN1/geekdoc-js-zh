  md: '# Installing PHP for Linux


    This section will show you how to install PHP on Linux as a dynamic module for
    Apache. By building a dynamic rather than a static module, you can upgrade or
    recompile PHP without having to recompile Apache as well. For example, all you''ll
    be doing in this section is configuring PHP for MySQL support. If you decide you
    want additional options later in the game, such as image creation functions or
    additional encryption functions, you''ll only have to change the configuration
    command for PHP, recompile the module, and restart Apache. No additional changes
    will be needed for the Apache installation, as just one PHP module file will be
    replacing another.


