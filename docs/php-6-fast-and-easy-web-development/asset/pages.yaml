  md: 'The [next section]() discusses a common error, with the hope that you''ll be
    able to avoid it.


    # The Importance of the Instruction Terminator


    The instruction terminator, also known as the semicolon (;), is absolutely required
    at the end of commands. The instruction terminator tells the PHP parser, "I''m
    done with this thing, try the next one."


    If you do not end commands with a semicolon, the PHP parser will become confused,
    and your code will display errors. These next steps show you how to get one of
    these errors and, more importantly, how to fix it.


    +   1. Open a new file in your text editor.

    2. Type the following HTML:

    3. <HTML>

    4. <HEAD>

    5. <TITLE>Making an Error</TITLE>

    6. </HEAD>

    7. <body>

    8. Type the following PHP code:

    9. <?

    10. echo "<P>I am trying to produce an error</P>"

    11. echo "<P>Was I successful?</P>";

    12. ?>

    13. Add some more HTML so that the document is valid:

    14. </body>

    15. </HTML>

    16. Save the file with the name errorscript.php.

    17. Place this file in the root directory of your Web server.

    18. Open your Web browser and type http://127.0.0.1/errorscript.php


    ![](img/bc248f3d24697d1afbacee37b9c4d229_41_0.png)


    ```

    echo "<P>I am trying to produce an error</P>"

    echo "<P>Was I successful?</P>";

    ```


    Line 8 does not have an instruction terminator, and line 9 starts a new command.
    The PHP parser doesn''t like this, and it tells you so by producing the parse
    error.


    This error is easy enough to fix:


    +   1. Open the errorscript.php file.

    2. On line 8, add the instruction terminator (;) to the end of the line:

    3. echo "<P>I am trying to produce an error</P>;";

    4. Save the file.'
