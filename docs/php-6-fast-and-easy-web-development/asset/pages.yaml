  md: '# Environment Variables


    When a Web browser makes a request of a Web server, it sends along with the request
    a list of extra variables called _environment variables_. They can be very useful
    for displaying dynamic content or authorizing users.


    By default, environment variables are available to PHP scripts as $VAR_NAME. However,
    to be absolutely sure that you''re reading the correct value, you can use the
    getenv() function to assign a value to a variable of choice. The following are
    some common environment variables.


    REMOTE_ADDR gets the IP address of the machine making the request. For example:


    ```

    $remote_address = getenv("REMOTE_ADDR")

    echo "Your IP address is $remote_address."

    ```


    HTTP_USER_AGENT gets the browser type, browser version, language encoding, and
    platform. For example:


    ```

    $browser_type = getenv("HTTP_USER_AGENT")

    echo "You are using $browser_type.".

    ```


    For a list of HTTP environment variables and their descriptions, visit

    http://hohoo.ncsa.uiuc.edu/cgi/env.html.


    # Arrays


    Simply put, arrays are sets of variables that are contained as a group. In the
    following example, $fave_colors is an array that contains strings representing
    array elements. In this case, the array elements (0 to 3) are names of colors.


    ```

    $fave_colors[0] = "red"

    $fave_colors[1] = "blue"

    $fave_colors[2] = "black"

    $fave_colors[3] = "white",

    ```


    Array elements are counted with 0 as the first position in the numerical index.


    # Operators


    An operator is a symbol that represents a specific action. For example, the +
    arithmetic operator adds two values, and the = assignment operator assigns a value
    to a variable.


    # Arithmetic Operators


    Arithmetic operators bear a striking resemblance to simple math, as shown in Table
    B.2.


    Table B.2: Arithmetic Operators'
