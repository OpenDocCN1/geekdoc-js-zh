    # The Structure of Functions


    Functions have a very specific structure, as you can see in the following code,
    where

    [function name] and [arguments] should be replaced with your own function name

    and any arguments you may want to use.


    ```

    function [function_name]{[arguments]} {

    //

    code

    }

    ```


    When you create a function, you precede the name of the function with the literal

    word function. After that and the name of your function comes the list of arguments

    inside a set of parentheses. The arguments—which are optional, as you don''t have
    to

    pass any arguments to a function if you don''t want to—are separated by commas,

    and hold values that your function needs in order to complete your task or tasks.


    After the arguments, you open a set of curly braces, type in all of your code
    and

    finally close the set of braces. For example, the function below (called multiplier)

    takes an argument called $num, and multiplies the value by 5.


    ```

    function multiplier($num) {

    $answer = $num * 5;

    }

    ```


    Say you have already determined that $num equals 8, and that''s what you''re passing

    to the multiplier function. Using your own math skills, you know that $answer
    will

    equal 40. To get that number back to your script, outside of the function, you
    must

    return the value.


    # Returning Values of Functions


    The basic method for returning values from your functions is to use the return

    statement. Usually, this statement comes at the end of the function, like so:


    ```

    function multiplier($num) {

    $answer = $num * 5;

    return $answer;

    }

    ```


    Note A return statement can be anywhere in a function, but when used it will end
    the

    execution of the function. This means the code that is executed is the line of

    your script from which the return statement was called.


