    # Appendix A: Additional Configuration Options


    The installation instructions at the beginning of this book detailed a simple
    configuration of PHP If feel like venturing out on your own by adding additional
    extensions (on Windows) or recompiling PHP (on Linux), this appendix gives you
    a brief rundown of some of yours. PHP can be as powerful or streamlined as you
    want it to, but a general rule of thumb is to only functionality that you really
    need. For example, if you have no place for connecting to an Oracle database,
    you do not need to enable support for the Oracle functions. But PHP is extendable,
    meaning you have the ability to add functionality whenever you want—like if your
    company decides to buy an Oracle license!


