    # Date and Time Functions


    The basic PHP date and time functions let you easily format format timestamps
    for use in database queries and calendar functions, as well as for simply printing
    the date on an order form receipt.


    # date()


    The date() function returns the current server timestamp, formatted according
    to a set of parameters. Its syntax is


    date(format, [timestamp]);


    If the timestamp parameter is not provided, the current timestamp is assumed.
    Table B.7 shows the available formats.


    Table B.7: date() Function Formats


    | Character | Meaning |

    | --- | --- |

    | a | Prints "am" or "pm" |

    | A | Prints "AM" or "PM" |

    | h | Hour in 12-hour format (01 to 12) |

    | H | Hour in 24-hour format (00 to 23) |

    | g | Hour in 12-hour format without a leading zero (1 to 12) |

    | G | Hour in 24-hour format without a leading zero (0 to 23) |

    | i | Minutes (00 to 59) |

