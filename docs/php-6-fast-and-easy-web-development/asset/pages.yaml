  md: "# What's a Variable?\n\nA variable is a representation of a particular value,\
    \ such as blue or 19349377. By assigning a value to a variable, you can reference\
    \ the variable in other places in your script, and that value will always remain\
    \ the same (unless you change it, which you'll learn about later).\n\nTo create\
    \ a variable, do the following:\n\n+   1. Think of a good name! For instance,\
    \ if I want to create a variable to hold a username, I name my variable:\n   -\
    \ username\n2. Put a dollar sign ($) in front of that:\n   - $username\n3. Use\
    \ the equal sign after the name (=) to assign a literal value to that variable.\n\
    \   Put the value in quotation marks:\n   - $username = \"joe\"\n4. Assigning\
    \ a value to a variable is an instruction, and as such should be terminated with\
    \ a semicolon:\n   - $username = \"joe\";\n\nThere you have it—a variable called\
    \ username with a value of joe. Later in this chapter, you'll do some exciting\
    \ things (such as math) with your variables!\n\n# Naming Your Variables\n\nAs\
    \ you've seen, variables begin with a dollar sign ($) and are followed by a meaningful\
    \ name. The variable name cannot begin with a numeric character, but it can contain\
    \ numbers and the underscore character (_). Additionally, variable names are case-sensitive,\
    \ meaning $YOURVAR and $youvar are two different variables.\n\nCreating meaningful\
    \ variable names is another way to avoid headaches when coding. If your script\
    \ deals with name and password values, don't create a variable called $n for the\
    \ name and $p for the password—those are not meaningful names. If you pick up\
    \ that script weeks later, you might think that $n is the variable for \"number\"\
    \ rather than \"name\" and that $p stands for \"page\" rather than \"password\"\
    .\n\n# PHP Variable and Value Types\n\nYou will create two main types of variables\
    \ in your PHP code: scalar and array. Scalar variables contain only one value\
    \ at a time, and arrays contain a list of values, or even another array.\n\nThe\
    \ example at the beginning of this chapter created a scalar variable, and the\
    \ code in this book deals primarily with scalar variables. You can find information\
    \ on arrays in Appendix B, \"Basic PHP Language Reference.\"\n\nWhen you assign\
    \ a value to a variable, you usually assign a value of one of the following types:"
