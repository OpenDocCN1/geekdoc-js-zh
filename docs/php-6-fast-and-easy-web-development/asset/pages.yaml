    2. The user browsers his hard drive for the file he wants to upload and then

    selects a file.

    3. The full file path and name appear in the text field.

    4. The user clicks on the Submit button.

    5. The selected file goes out, lands at the Web server, and sits around in a

    temporary directory.

    6. The PHP script used in the form action checks that a file was sent and

    executes a copy command on the temporary file to move it to a real directory

    on the Web server.

    7. The PHP script confirms the action for the user.


    > Note The PHP user (the user under PHP runs, as "nobody" or

    "jow") must have write permissions in the temporary directory

    as well as the target directory for the file.


