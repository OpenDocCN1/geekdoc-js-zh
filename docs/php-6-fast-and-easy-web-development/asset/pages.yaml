  md: '# Starting and Connecting to Apache


    To first start the Apache server, select Program Files, Apache HTTP Server, Start
    Apache In Console from the Windows Start menu. This will launch a console window.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_24_0.png)


    Keep this window open, or your Apache process will end! You can minimize the window—just
    not close it. Of course, you can close it if you want to shut down your server,
    but since the next step is to connect to the server via a Web browser, now would
    not be a good time to shut it down.


    If the window is open and it states that Apache is running, you can connect to
    the server via your Web browser of choice. The URL will be whatever you used as
    ServerName—an actual name or IP, or localhost or IP.


    Note Remember, you can only connect to your Web server using 127.0.0.1 or the
    name localhost. This book assumes that you''ll be using 127.0.0.1 as the ServerName,
    so if you are not, just substitute your machine name for 127.0.0.1 in the examples.


    > To finally test your installation, open your Web browser, type http://127.0.0.1/
    in the Address bar, and press Enter. You should see a default Web page.


    This default start page comes from the htdocs directory within your Apache installation
    directory. You can go into that directory and delete all the default files if
    you want to, or you can leave them. They''re not hurting anything, but you''ll
    eventually be filling the htdocs directory with your own files and subdirectories,
    so you might want to delete them for the sake of good housekeeping.


    Move ahead to the next chapter, where you''ll install PHP and make a few minor
    changes to your Apache configuration files before you''re ready for some action.'
