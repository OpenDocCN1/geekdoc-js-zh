    are shown in [Table B.4].


    | Operator Definition |

    |---|---|

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    # # Increment/Decrement Operators


    The increment/decrement operators do just what their name implies: add or subtract
    from a variable (see [Table B.5]).'
