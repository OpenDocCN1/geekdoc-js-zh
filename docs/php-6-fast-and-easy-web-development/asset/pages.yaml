    # Local and Global Variables


    Variables can be local or global, the difference having to do with their definition
    and usage by the programmer, and where they appear in the context of the scripts
    you are creating. The variables described in the previous section, and for the
    majority of this book, are local variables.


    When you write PHP scripts that use variables (likely they always), these variables
    can be used only by the script they live within. Scripts cannot magically reach
    inside other scripts and you can use the variables created and defined within
    them—unless you say so and purposefully link them together. When you do that,
    such as when you create your own functions (blocks of reusable code that perform
    a particular task), you will define the shared variables as global. That is, able
    to be accessed by other scripts and functions which need them.


    You can learn about creating your own functions, and using global as well as local
    variables, in Appendix C. "Writing Your Own Functions." For now, just understand
    that there are two different variable scopes—local and global—that will come into
    play as you write more advanced scripts.


    # Predefined Variables


    In all PHP scripts, a set of predefined variables are in of the phpinfo() function,
    if you scrolled and read through these variables in the output of the entire page.
    Some of these predefined variables are also called superglobals, essentially meaning
    that they are always present and available in your scripts.


    Please study the following list of superglobals, as they will be used exclusively
    throughout this book. Each of these superglobals are actually arrays of other'
