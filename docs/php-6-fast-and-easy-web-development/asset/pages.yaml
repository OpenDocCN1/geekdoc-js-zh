  md: '# Chapter 10: Uploading Files to Your Web Site


    # Overview


    If you need a quick interface for uploading files to your Web site from a remote
    location, you can create a two-step form and script interface with PHP. In this
    chapter, you''ll learn how to do the following:


    +   - Create an HTML form for file uploads

    - Create a PHP script to handle file uploads


    # Check Your php.ini File


    Before you uploading files, check a few values in your php.ini file. Look for
    this section of text:


    ```

    ; File Uploads ;

    ; Whether to allow HTTP file uploads.

    file_uploads = On


    ; Temporary directory for HTTP uploaded files (will use system

    default if not

    ; specified);

    upload_tmp_dir =


    ; Maximum allowed size for uploaded files.

    upload_max_filesize = 2M

    ```


    To ensure the upload process will work smoothly, make the following modifications:


    +   - Uncomment the upload_tmp_dir line by deleting the initial semicolon.

    - Enter a directory name after the = upload_tmp_dir.

    - If you want to allow larger uploads, change the number of bytes for upload_max_filesize.


    For example, on a Windows system, this section of the php.ini file may look like


    ```

    ; File Uploads ;

    ; Whether to allow HTTP file uploads.

    file_uploads = On


    ; Temporary directory for HTTP uploaded files (will use system

    default if not

    ; specified).

    ```'
