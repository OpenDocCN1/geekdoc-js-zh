- img_proc: true
  md: '# What''s a Cookie?


    Cookies are pieces of text that are sent to a user''s Web browser. Cookies can
    help you create shopping carts, user communities, and personalized sites. It''s
    not recommended that you store sensitive data in a cookie, but you can store a
    unique identification string that will match a user with data held securely in
    a database.


    Take the shopping example. Suppose you assign an identification variable to a
    user so that you can track what he does when he visits your site. First, the user
    logs in, and you send a cookie with variables designed to say, "This is Joe, and
    Joe is allowed to be white." While Joe is surfing around your site, you can say,
    "Hello, Joe" on each and every page. If Joe clicks through your catalog and chooses
    14 different items to buy, you can keep track of these items and display all in
    a bunch when Joe goes to the checkout area.


    # Setting Cookies


    Before you start setting cookies, determine how you will use them and at what
    point you set them. Whatever you decide to, remember that you absolutely set a
    cookie before sending any other content to the browser because a cookie is actually
    part of the header information.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_158_0.png)


    If you heed this warning, you''ll spend hours wondering why you''re getting "Cannot
    add header information" errors. This sample code does just that.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_158_1.png)


    Anytime you see this error, assume that you''ve sent something to the Web browser.
    This can include white space, a line break, or text you can actually see.


    The setcookie() function, used to set one cookie at a time, expects six arguments:


    +   - **Name.** Holds the name of the variable that will be kept in the global
    $COOKIE and will be accessible in subsequent scripts.

    - **Value.** The value of the variable passed in the name parameter.

    - **Expiration.** Sets a specific time at which the cookie value will no longer
    be accessible. Cookies without a specific expiration time will expire when the
    Web browser closes.

    - **Path.** Determines which directories the cookie is valid. If a single slash
    is in the path parameter, the cookie is valid for all files and directories on
    the Web'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'server. If a specific directory is named, this cookie is valid only for pages
    move into that directory.


    +   - Domain. Cookies are valid only for the host and domain that set them. If
    no domain is specified, the default value is the host of the server that generated
    the cookie. The domain parameter must have at least two periods in the string
    to be valid.

    - Security. If the security parameter is 1, the cookie will only be transmitted
    via HTTPS, which is to say, over a secure Web server.


    This next line is an example of a cookie valid with 55ds808992jsj2. This particular
    cookie will expire in four hours (the time plus 14400 seconds), and it is valid
    for any page below the document root on your domain.com.


    ```

    setcookie("55ds808992jsj2", time()+14400, "/","yourdomain.com",0);

    ```


    In the next section, I''ll give you a cheat sheet for common values of time. You''ll
    move into using cookie variables.


    # Counting Time


    If you want to set an expiration date or time, the easiest way to do that is to
    tell PHP to count for you, and place a value in the expiration slot within the
    setcookie() function. This value should be a UNIX integer (the number of seconds
    since January 1, 1970), which you can get using the time() function with additional
    seconds added to it.


    Setting an expiration date on your cookies builds in some extra assurances of
    the validity of your users. If you set your cookie without a time limit, it will
    automatically expire when the user closes their browser. This is helpful when
    users are sharing computers; you don''t want the next user to have all the access
    afforded by the previous user''s cookie. Similarly, you may want to set a cookie
    for only 15 minutes if you are building an online store that allows you to receive
    a discount on everything purchased in the first 15 minutes of your users'' visits.


    Table 16.1 shows some common uses of time() +n within the setcookie() function.


    | Table 16.1: Common Times |

