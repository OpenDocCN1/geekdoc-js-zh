    # Chapter 2: Installing Apache


    # Overview


    Since it''s the most popular Web server in use, you might think that Apache is
    a complicated piece of software, but it''s not difficult at all. In this chapter,
    you''ll learn how to do the following:


    +   * Install Apache on Windows or Linux

    * Connect to your new Web server


    # Installing Apache for Windows


    Installing Apache for Windows is a simple task, due in great part to the installation
    wizard distributed by the Apache Group. Whether you''re using Windows 95, 98,
    ME, 2000, XP, or NT, the installation process of the precompiled binaries is definitely
    the way to go, and the same installation file is used for all versions of Windows.


    Being able to use Apache on consumer-oriented operating systems as Windows 95/98/ME/XP
    doesn''t mean that you should, at least not in a production environment. Simply
    put, running any Web server on a Windows operating system is not as fast, stable,
    or secure as running a Web server on a Linux/UNIX machine. However, installing
    and configuring a Web server on Windows-based operating system is perfectly acceptable
    and most users get there.


    Note The Apache Group also distributes the source code for Apache on Windows,
    should you have a need to compile the code yourself. However, that process is
    well beyond the scope of this book!


    To download the Apache distribution for Windows, start at the Apache Server Web
    site (http://httpd.apache.org/) and follow the link to "Download". Once in the
    download'
