    # ## Chapter 1: Installing and Configuring MySQL


    # ### Overview


    MySQL is the database of choice for a vast majority of Web developers who use
    PHP because of its efficiency and ease of use. Plus, MySQL is free, runs on multiple
    platforms, and its documentation is superb. When using MySQL with PHP, it''s easiest
    to install MySQL first because, during the PHP installation and configuration
    process, you must tell the PHP configuration script where MySQL resides on your
    system in order activate the MySQL-specific functions. In this chapter, you''ll
    learn how to do the following:


    +   - Install MySQL on Windows or Linux

    - Create a sample database

    - Create a sample table


    # ### Various MySQL Distributions


    The most popular distribution of MySQL is the open source version from MySQL AB.
    However, there are also commercial versions of MySQL, as well as distributions
    of MySQL bundled with application server software. Some companies that offer these
    options are AriaSoft (http://www.abriasoft.com/) and NuSphere (http://www.nusphere.com/).
    No matter which option you choose, a solution will be available for all platforms—any
    UNIX-like operating system, as well as on Windows 95/98/NT/2000/XP.


    If you are using MySQL as part of a Web hosting package from an Internet service
    provider, you don''t have to worry about downloading and installing the application
    in this chapter. Instead, you''ll just need to work with your ISP to get your
    username and password. In almost all cases, your ISP is running the MySQL distribution
    from MySQL AB. There''s no harm in setting up MySQL on a development machine,
    if you have one available to you (your own workstations that bill), just to better
    understand the process. To that end, if you have a Linux workstation or server,
    MySQL was likely included in your OS distribution as an installation option, and
    perhaps you even installed it already. In this case, you should check the MySQL
    Web site to compare the version numbers and download a newer version if one is
    available.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'The installation instructions in this chapter are about the MySQL version 4.0,
    distributed by MySQL AB. Earlier versions such as MySQL 3.23.x follow the same
    steps, you should run into problems while installing MySQL 4.0. You will be able
    to use all of the database-related examples in this book, whether using MySQL
    3.23.x or MySQL 4.0.


    # Installing MySQL on Windows


    The MySQL installation process on Windows 95/98/NT/2000/XP is an executable setup
    program provided by MySQL AB. Once you download the zip file, all you have to
    extract its contents into a temporary directory and run the setup.exe application.
    After the setup.exe installs the MySQL server and client programs, you''re ready
    to start the MySQL server.


    +   - Visit the MySQL 4.0 download page, at http://www.mysql.com/downloads/mysql-4.0.html
    and find the Windows section on the page. You want to download the "Installation
    files (zip)" rather than "Cygwin downloads (tar.bz2)."

    - Clicking the Download link will take you to a page of mirror sites. Select the
    mirror site closest to you, and click on either the HTTP or FTP link to download
    the file. Using the HTTP method is usually quicker.

    - Once the Zip file is on your hard drive, extract its contents to a temporary
    directory.

    - From the temporary directory, find the setup.exe file and double-click it to
    start the installation. You will see the first screen of the installation wizard.
    Click Next to continue.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_6_0.png)


    The second screen in the installation process contains valuable information regarding
    the installation location. The default installation location is C:\mysql, but
    if you plan to install MySQL in a different location, this screen shows you a
    few changes that you will have to make on your own. This screen is also important
    for Windows NT users who wish to start MySQL as a service. Read the information
    and note anything relevant to your situation, then click Next to continue.'
  merge: -1
