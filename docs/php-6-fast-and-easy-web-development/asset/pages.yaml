  md: '# Chapter 17: Session Basics


    # Overview


    Sessions are like cookies on steroids. Using sessions, you can maintain user-specific
    information without setting multiple cookies or even using a database. In this
    chapter, you''ll learn how to do the following:


    +   * Start a session

    * Add a variable to the $_SESSION superglobal

    * Enable a per-user access count

    * Maintain user preferences throughout multiple pages


    # Before You Begin...Check php.ini


    Before you start with sessions, check a value in your php.ini file. Look for this
    section of text and read it carefully:


    ```

    ;Argument to saved_handler. In the case of files, this is

    the path

    ; where data files are stored. Note: Windows users have to

    this

    ; variable in use PHP''s session functions.

    session.save_path = /tmp

    ```


    To reiterate, you must modify the value of session.save_path so that the file
    can be written to a directory that exists. This change primarily affects Windows
    users, and the modification is simple: enter a directory name after the = for
    session.save_path.


    For example, my php.ini file on Windows contains this:


    ```

    session.save_path = c:\Windows\Temp

    ```


    After making the change, restart Apache so that the changes take effect. If you
    are using Linux/UNIX, /tmp is a standard directory, and you can leave this alone
    unless you want to change it for some compelling reason.


    # What''s a Session?


    In terms of time, a session is the amount of time during which a user visits a
    site. In the programming world, a session is kind of a big blob that can hold
    all sorts of variables and values.


    +   * This blob has an identification string, such as 940fb0b5a40d5119e030c9c7745aead9.

    * This identification string is AUTOMATIC sent to the user when a session is initiated,
    in a cookie called PHPSESSID.

    * On the server side, a matching temporary file is created with the same name
    (940f8b05a40d5119c030c9c7745aead9).'
  merge: -1
