- img_proc: true
  md: '1. Open a DOS prompt or a console window (depending on your Windows version,
    it may be called one or the other).


    ![](img/bc248f3d24697d1afbacee37b9c4d229_9_0.png)


    2. At the prompt, type cd c:\mysql\bin and press Enter.


    Note If you installed MySQL in a different directory, substitute directory name
    in the command in step 2.


    3. At the prompt, type mysqld-opt and press Enter.


    The MySQL process will now be running in the background. You can now connect to
    MySQL and create databases and tables.


    # Creating a Test Database


    Before going any further, you should know the following:


    +   * A database is a collection of tables.

    * A table contains a set of records, also referred to as rows.

    * All records have the same number of fields.

    * Each field categorizes a piece of data.


    In this section, you''ll conquer the first element and create a database. The
    utility to use the mysqladmin program, which allows you to administer MySQL from
    the command line.


    +   1. At the prompt, type mysqladmin create testDB and press Enter.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/bc248f3d24697d1afbacee37b9c4d229_10_0.png)


    Next, you''ll add a table to the testDB database.


    # Creating a Test Table


    In this section, you''ll create a table within the database you created in the
    preceding section. The utility to use is the mysql program, which allows you to
    work within the MySQL database system from the command line.


    +   1. At the prompt, type mysql and press Enter.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_10_1.png)


    When the MySQL Monitor starts, it provides its own prompt. At this prompt (mysql>)
    you will type commands used to create tables, explain tables, insert data, select
    data, and so on. Get used to ending your commands with a semicolon (;) because
    it''s a common instruction terminator that is used in PHP well.


    Now that you''ve connected to the MySQL Monitor, you need to tell it which database
    to use.


    +   2. At the prompt, type use testDB; and press Enter.'
