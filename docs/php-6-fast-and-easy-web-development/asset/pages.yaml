    # # Appendix E: Database Normalization


    The database tables used in this book were designed for simplicity''s sake to
    help you understand the basic interaction between PHP and MySQL. "normalized"
    databases. "Normalization" is a word you''ll hear a lot when you begin to create
    detailed database-driven applications, and it requires a different type of thought
    process—thinking in relational terms before seeing the relationships in front
    of you. In this appendix, you will learn the basics of database normalization.


    # ## Understanding Database Normalization


    Database normalization is essentially a set of rules that allows you to organize
    your database in such a way that your tables are related where appropriate and
    flexible for growth and relationships. The sets of rules used in normalization
    are called *normal forms*. If your database design follows the first set of rules,
    it''s considered in the first normal form. If the first three sets of normalization
    are followed, your database is said to be in the third normal form. We will go
    through the normal forms using the concept of students and courses in a school,
    and eventually normalize the *my_contacts* table used previously in the book.


    # ## Applying the Normal Forms


    Before explaining the first normal form, let''s start with something that needs
    to be normalized. In the case of a database, it is the *flat table*. A flat table
    is like a spreadsheet with many columns for data. There are no relationships between
    multiple tables, as all the data you could possibly want right there in single
    flat table. This scenario is not the most efficient design and will consume more
    physical space on your hard drive than a set of normalized database tables.


    Suppose you have a table that holds student and course information for a school.
    You might have the fields shown in Table E.1 in your flat table.'
