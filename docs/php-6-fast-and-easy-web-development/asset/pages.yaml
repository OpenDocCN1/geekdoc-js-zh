    +   4. To get a basic version of PHP working with Apache, you''ll need to make
    a few minor modifications to the Apache configuration file.


    # Configuring Apache to Use PHP


    You can install PHP as a CGI binary or as an Apache module. The current recommendation
    by the PHP Group is to use the module version, as it offers greater performance
    and some additional functionality. However, you may encounter some conflicts with
    advanced functionality when using the module, depending on your operating system.
    Additionally, using the CGI version instead of the module will allow you to create
    more secure virtual hosts, each with their own CGI executable, therefore allowing
    PHP to run as a named user instead of the default Apache process owner.'
