    | -= | $a -= 3; | Changes the value of a variable to the current value minus the
    value on the right side |

    | .= | $a .= "string"; | Concatenates (adds on to) the variable on the right side
    with the current value |


    # # Comparison Operators


    It should come as no surprise that comparison operators compare two values. A
