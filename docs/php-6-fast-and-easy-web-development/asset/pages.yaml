  md: '# Overview


    Everyone has secrets they don''t want to share with the entire world. But some
    secrets can be shared—with certain people. In this chapter, you''ll learn how
    to do the following:


    +   * Create a database table for authorized users

    * Create a login form and script that authenticates users before displaying any
    secrets


    # Why Authenticate Anyone?


    When initially developing a Web site, you might want to restrict access to certain
    members of your development team. If your corporate Web site contains sensitive
    financial data, you might want to restrict your financial statements to a particular
    list of investors. Or maybe you just don''t want people around in your personal
    things.


    A common type of user authentication is *database-driven*, where usernames and
    passwords are kept in a database table and accessed via a login form and script.
    In the next section, you will create this database table and add some users to
    it.


    # Creating the User Table


    In Chapter 12, "Creating a Database Table," you followed a two-step table-creation
    process. Now you''ll be able to use that same process to create the authorized
    users table.


    +   * Open your Web browser to **http://127.0.0.1/show_createtable.html**

    * In the Table Name field, type **auth_users**.

    * In the Number of Fields field, type **4**

    * Click on the Go to Step 2 button. You should see a form with four rows, corresponding
    to the fields which will be in the **auth_users** table.

    * In the first row, type **f_name** for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of **50**. This field will
    hold the user''s first name.

    * In the second row, type **l_name** for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of **50**. This field will
    hold the user''s last name.

    * In the third row, type **username** for the Field Name, select varchar from
    the Field Type drop-down menu, and specify a Field Length of **25**. This field
    will hold the user''s username.

    * In the fourth row, type **password** for the Field Name, select varchar from
    the Field Type drop-down menu, and specify a Field Length of **100**. This field
    will hold a hash of the password.'
