    # # Part VII: Additional Administration Scripts


    Chapter List


    +   - [Chapter 23: Managing a Simple Mailing List](#chapter23)

    - [Chapter 24: Creating Custom Lists and Reports](#chapter24)


    # # Chapter 23: Managing a Simple Mailing List


    Overview


    Eventually, your Web site will have users, and someday you might even want to
    send a newsletter to them. You can create a very simple subscription and publication
    mechanism using PHP and MySQL. In this chapter, you''ll learn how to do the following:


    +   - Create a subscribe/unsubscribe script

    - Create a front end to sending a newsletter

    - Create a script that mails your newsletter to all recipients in your database


    # ## A Brief Word about Mailing List Software


    Several very good mailing list applications are available to sell to mail to large
    numbers of e-mail addresses. The type of system you''ll build in this chapter
    should be used for only small lists less than a few hundred e-mail addresses.


    The system described in this chapter was born from my own laziness one day when
    I didn''t want to download and install any third-party software. I just made some
    simple files that performed a task.


    That''s the beauty of PHP: it''s such a simple language it''s easier to write
    a few scripts to download or install something. However, when your mailing list
    grows large enough, move to a more robust mailing list application that''s a bit
    easier on your outgoing mail server, and also on you, the administrator.'
