    # Escaping Your Code


    Right up with remembering to end your commands with semicolons; remembering to
    escape things such as quotation marks. When you use quotation marks inside other
    quotation marks, the inner pairs must be delineated from the outside pair using
    the escape (\) character (also known as a backslash).


    The following steps show what happens when your code isn''t escaped, and how to
    fix it.


    +   1. Open a new file in your text editor.

    2. Type the following HTML:

    3. `<HTML>

    4. `<HEAD>

    5. `<TITLE>Trying For Another Error</TITLE>

    6. `</HEAD>

    7. `<BODY>

    8. Type the following PHP code:

    9. `<?php

    10. echo "<P>this is really \cool!\</</P>";

    11. `?>

    12. Add some more HTML so that the document is valid:

    13. `<BODY>

    14. `</HTML>

    15. Save the file with the name errorscript2.php.

    16.Place this file in the document root of your Web server.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_42_1.png)


    7.'
