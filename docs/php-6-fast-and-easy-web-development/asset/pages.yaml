    # # Planning for Your Tables


    Creating a table is easy—it''s the planning that takes some brainpower. To create
    a simple table, you would only need to give it a name. But that would make for
    a boring table, since it wouldn''t contain any columns (fields) and couldn''t
    hold any data. So besides the name, you should know the number of fields and the
    types of fields you''d like to have in your table.


    # # Basic MySQL Data Types


    All fields in a table are given a particular data type definition. The data type
    defines the type of data that''s allowed in the field. With some data type definitions,
    you must also define the maximum length you wish to allow in the field, but others
    are assumed to have one specific length for their particular type.


    It''s very important to define fields appropriately. For example, if you have
    a field to hold the name of a recording, and it''s a 50-character varchar field,
    yet you try to stuff a 100-character string into your field, you will truncate
    at 50 characters.


    Not only is it important to define the fields correctly so that the data fits
    the fields, but if you define a field with an incorrect SQL syntax, the table
    won''t be created. For example, if you want to use the text data type for a field,
    you cannot specify a length: it''s automatically assumed to have a particular
    length.


    [Table 12.1] shows some of the common data types you will use. For a complete
    list, please read the MySQL manual.


    | Data Type | Definition |

    |---|---|

    | TININT | A small integer that can be signed or unsigned. If signed, the allowable
    range is from -128 to 127. If unsigned, the allowable range is from 0 to 255.
    |

    | SMALLINT | A small integer that can be signed or unsigned. If signed, the allowable
    range is from -32768 to 32767. If unsigned, the allowable range is from 0 to 65535.
    |

    | MEDIUMINT | A medium-sized integer that can be signed or unsigned. If signed,
    the allowable range is from -8388607 to 8388607. If unsigned, the allowable range
    is from 0 to 16777215. |

    | INT | A normal-sized integer that can be signed or unsigned. If signed, the
    allowable range is from -2147483648 to 2147483647. If unsigned, the allowable
    range is from 0 to 4294967295. |

    | BIGINT | A large integer that can be signed or unsigned. If signed, the allowable
    range is from -2147483648 to 2147483647. If unsigned, the allowable |'
