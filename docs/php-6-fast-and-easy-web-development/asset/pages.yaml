    21. Open your Web browser and type http://127.0.0.1/comments.php


    You should see absolutely nothing in your Web browser, because all you did was
    print an HTML comment (which is ignored). Since PHP comments are ignored by the
    PHP parser, the PHP block didn''t contain any actual commands. If you view the
    source of this document in your Web browser, you will notice that only the HTML
