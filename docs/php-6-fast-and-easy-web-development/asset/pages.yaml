    # ## What’s an Operator?


    In the previous section, you used an assignment operator (=) to assign values
    to variables. There are other types of assignment operators, as well as other
    types of operators in general. The basic function of an operator is to do something
    with the value of a variable. That "something" can be to assign a value, change
    a value, or compare two more values.


    Here are the main types of PHP operators:


    +   - Assignment operators. Assign a value to a variable. Can also add or subtract
    from a variable''s current value.

    - Arithmetic operators. You know all of these operators! Addition, subtraction,
    division, and multiplication occur when these operators are used.

    - Comparison operators. Compare two values and return true or false. You can then
    perform actions on the returned value.

    - Logical operators. Determine the status of conditions.


    The rest of this chapter is devoted to discussing the main operators used in PHP.
    You''ll be writing scripts for each, so hang on to your hat!


    # ## Assignment Operators


    You''ve already seen an assignment operator at work: the equal sign is the basic
    - assignment operator. Burn this into your brain: = does not mean "equal to"!
    Instead, == (two equal signs) means "equal to", and the single = means "assigned
    to". In fact, you''ve also seen the concatenation operator in this chapter, as
    it is used to put strings together.


    Take a look at the assignment operators in Table 5.1 and prepare to write a new
    script.


    | Table 5.1: Assignment Operators |'
