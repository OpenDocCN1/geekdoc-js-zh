    You might repeat CourseID, CourseDescription, and CourseInstructor columns many
    times to account for all the classes a student can take during their academic
    career. While redundant, this is the method used when creating a single flat table
    to store information. Eliminating this redundancy is the first step in normalization,
    so you''ll take this flat table to first normal form. If your table remained in
    this format, you would have a lot of unclaimed space and a lot of space being
    used unnecessarily—not an efficient table design!


    # # Taking a Table to First Normal Form


    The main rules for the first normal form are


    +   - Eliminate repeating information

    - Create separate tables for related data


    Looking at the flat design, with its many repeated sets of fields for students
    and courses, you can identify students and courses as two distinct domains. Taking
    your student and courses flat to the first normal form would mean that you create
    two tables: one for students (call it students) and one for students plus courses
    (call it students_courses). You can see the new table designs in Tables E.2 and
