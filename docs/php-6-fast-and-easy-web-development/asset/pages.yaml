  md: '# Chapter 11: Establishing a Connection


    # Overview


    During the process of installing and testing MySQL in Chapter 1, you should have
    created a sample database as well as a sample table, and inserted and selected
    some data. The next several chapters focus on making the same types of connections
    and queries using PHP scripts for the front end. In this chapter, you''ll learn
    how to do the following:


    +   - Connect to MySQL

    - List all databases on localhost

    - List all tables in a database

    - Create a database

    - Drop (delete) a database


    # Working with User Privileges in MySQL


    When you installed the MySQL database in Chapter 1, you were working as the anonymous
    or root user. Before you begin regularly with databases, you should create a real
    user with a password. To do this, you need to understand a bit the MySQL privilege
    system.


    > Note If you are accessing MySQL through an Internet service provider, you probably
    have only one user and one database available to you. By default, that one user
    has access to all tables in the database and is allowed to perform all commands.
    If this is the case, you can skip the information in this section and proceed
    to the script creation sections. In all instances where a username and password
    are used, use the one given to you by your ISP.


    # Creating a New User


    If you have proper permissions for adding a user, the simplest method for performing
    this task is the GRANT command. The basic syntax of the GRANT command follows,
    where [privilege list] is a placeholder for the privileges you want to give to
    the new user.


    ```

    GRANT [privilege list] ON database.tablename TO username@host IDENTIFIED BY "password";

    ```


    You can grant many types of privileges, and for more information, please visit
    the MySQL manual topic at http://www.mysql.com/doc/G/R/GRANT.html. For now, you
    will just grant privileges to your new user, on all tables in the database.


    Note The following commands are exactly the same for MySQL on Windows and Linux/UNIX
    platforms.'
