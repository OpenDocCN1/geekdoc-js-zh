    That''s a lot easier than wading through Apache access logs, but I wouldn''t recommend
    replacing your access logs with a database-driven system. That''s a bit too much
    database-connection overhead, even if MySQL is particularly nice on your system.
    Instead, target your page tracking to something particularly important to you.'
