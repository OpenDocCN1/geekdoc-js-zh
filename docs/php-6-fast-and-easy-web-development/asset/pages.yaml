    7. Open your Web browser and type http://127.0.0.1/errorscript2.php


    Now that the inner quotation marks are escaped, the PHP parser will skip over
    them, knowing that these characters should be printed and have no other meaning.
    In the next section, you''ll learn a good programming practice: commenting your
    code so people know what the heck is going on it.


    # Commenting Your Code


    Code commenting is a good habit to have. Entering comments in HTML documents helps
    you (and others who might have to edit your document later) keep track of areas
    of large documents. Commenting also allows you to write notes to yourself during
    the development process, or to comment out parts of code when you are testing
    your scripts.'
