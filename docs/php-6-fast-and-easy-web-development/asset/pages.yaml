    In the next section, you''ll work with the fopen() and fclose() functions to open
    and close specific files.


    # Working with fopen() and fclose()


    Before you jump headfirst into files, you need to learn a bit about the fopen()
    function, which is used to open files. This function requires a file name and
    mode, and returns a file pointer. A file pointer provides information about the
    file and is used as a reference.


    The file name is the full path to the file you want to create or open, and the
    mode can be any of the modes listed in Table 9.1.


    Table 9.1: Modes Used with fopen()


    | Mode | Usage |

    | --- | Opens an existing file and reads data from it. The file pointer is placed
    at the beginning of the file. |

    | r | Opens an existing file for reading or writing. The file pointer is placed
    at the beginning of the file. |

    | w | Opens a file for writing. If a file with name does not exist, the function
    creates a new file. If the file exists, the function deletes all existing content
    and places the file pointer at the beginning of the file. |

    | w+ | Opens a file for reading and writing. If a file with name does not exist,
    the function creates a new file. If the file exists, the function deletes all
    existing content and places the file pointer at the beginning of the file. |

    | a | Opens a file for writing. If a file with name does not exist, the function
    creates a new file. If the file exists, the function places the file pointer at
    the end of the file. |

    | a+ | Opens a file for reading and writing. If a file with name does not exist,
    the function attempts to create a new file. If the file exists, the function places
    the file pointer at the end of the file. |'
