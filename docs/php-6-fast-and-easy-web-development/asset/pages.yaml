  md: '# Understanding Session Variables


    Session variables (and their values) are stored in the temporary session file
    on the Web server. Since these values and variables are not kept in a database,
    no additional system resources are required to connect and extract information
    from database tables. You can access session variables through the $_SESSION superglobal.


    For example, a temporary session file might contain the following:


    ```

    count[7]:"76";nvalid[7]:"yes";

    ```


    In this example, count and value are the names of the session variables and 76
    and yes are their respective values. However, to out the variable in the session,
    you must first explicitly add it to the $_SESSION superglobal. Once it is added,
    you can extract the value (using $_SESSION[count] or $_SESSION[valid]; in this
    example).


    When you attempt to retrieve a session variable, the sequence goes something like
    this (this is your try to get the value of $_SESSION[count]):


    +   1. The PHP parser gets the value of PHPSESSID from the user cookie.

    2. The PHP parser finds a matching session file.

    3. Inside the session file, the PHP parser looks for count and finds its value
    (say, 76).

    4. $_SESSION[count] is equal to 76.


    Next, you''ll start your per-user counter script using a session.


    # Starting a Session


    Starting a session is a snap. You just call the session_start() function, and
    PHP takes care of rest—sending the cookie and creating the session file.


    +   1. Open a new file in your text editor and start a PHP block:

    2. <?php

    3. Call the session_start() function:

    4. session_start();

    5.

    6.


    > Note The session_start() function actually performs several important tasks.

    First, it checks to see if a session has started for the current user, and it
    starts one if necessary. It also alerts the PHP engine that variables and other
    session-related functions will be used within the specific script.


    Because of the dual purpose of session_start(), use it at the beginning of all
    session-related scripts.


    +   7. Create a string to hold a message:

    8. $msg = "started a session...";'
