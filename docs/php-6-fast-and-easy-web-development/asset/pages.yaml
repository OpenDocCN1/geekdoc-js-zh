    \ |\n|---|---||\n| ! | $$a | TRUE if $a is not true |\n| && | $$a && $$b | TRUE\
    \ if $a and $b are true |\n| || | $$a || $b | TRUE if either $a or $b is true\
    \ |\n\n# Control Structures\n\nPrograms are essentially a series of statements.\
    \ Control structures, as their name implies, control how those statements are\
    \ executed. Control structures are usually built around a series of conditions,\
    \ such as, \"If the sky is blue, go outside and play.\" In this example, the condition\
    \ is \"If the sky is blue\" and the statement is \"go outside and play.\"\n\n\
    Control structures utilize curly braces ({}) to separate the groups of statements\
    \ from the remainder of the program. Examples of common control structures follow;\
    \ memorizing these will make your life much easier.\n\n# if...else if...else\n\
    \nThe if...else if...else executes a statement based on the value of the expression\
    \ being tested. In the following sample, the expression being tested is \"$a is\
    \ equal to 10.\"\n\n```\nif ($a == \"10\") {\n  // execute some code\n}\n```\n\
    \nAfter $a is evaluated, it is found to have a value of 10 (that is, if the condition\
    \ is true), the code inside the curly braces will execute. If $a is found to be\
    \ something other than 10 (if the condition is false), the code will be ignored,\
