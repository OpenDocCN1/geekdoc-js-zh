  md: '# Integers


    Integers are positive or negative whole numbers, zero, or "numbers without decimal
    points." Each of the following variables is an integer:


    ```

    $a = 15;

    $b = -521;

    ```


    # Strings


    A series of characters grouped within double quotation marks is considered a string:


    ```

    $a = "I am a string";

    $b = "<p>This book is cool</p>";

    ```


    You can also reference other variables within your string, which will be replaced
    when your script is executed. For example:


    ```

    $num = 57; // an integer

    $my_string = "I read this book $num times!"; // a string

    ```


    When you run the script, $my_string will become "I read this book 57 times!"


    # Variables from HTML Forms


    Depending on the method of your HTML form (GET or POST), the variables will be
    part of the $_POST or $_GET superglobal associative array. The name of the input
    field will become the name of the variable. For example, when a form is sent using
    the POST method, the following input field produces the variable $_POST[first_name]:


    ```

    <input type="text" name="first_name" size="20">

    ```


    If the method of this form is GET, this variable would be $_GET[first_name].


    # Variables from Cookies


    Like variables from forms, variables from cookies are kept in a superglobal associative
    array called $_COOKIE. If you set a cookie called user with a value of Joe Smith,
    like so


    ```

    SetCookie("user", "Joe Smith", time(3600));

    ```


    a variable called user is placed in $_COOKIE, with a value of Joe Smith. You then
    refer to $_COOKIE[user] to get that value.'
  merge: -1
  pgno: 268
