    The next section is for the installation of MySQL on Linux, assuming you don''t
    have two machines, skip ahead to Chapter 2, "Installing Apache," to install the
    Apache Web server.


    # Installing MySQL for Linux


    This section will take you through the installation process of MySQL 4.0 on Linux,
    if you are using another flavor of Linux, download the appropriate files and follow
    the instructions included with the distribution.


    The recommended installation method for MySQL is with RPMs. There are several
    RPMs that make up a full distribution, but for a minimal installation you need


    +   - MySQL-VERSION.i386.rpm—The MySQL server.

    - MySQL-client-VERSION.i386.rpm—The standard MySQL client programs.


    To download these files, visit the MySQL 4.0 download page, at http://www.mysql.com/downloads/mysql-4.0.html
    and find the "Linux downloads" on the page. The RPMs are listed with "RedHat packages
    (rpm)." When you click on the Download link for one of the packages, you will
    be taken to a page of mirror sites. Select the mirror closest to you, and download
    the files.


    When the files are downloaded to your system, perform the minimal installation
    by following the typing at prompt#, replacing VERSION with the appropriate version
    number for your downloaded files:


    ```

    #prompt> rpm -i MySQL-VERSION.i386.rpm MySQL-client-VERSION.i386.rpm

    ```


    If the RPM method doesn''t work for you, you can install MySQL from a binary distribution,
    which requires gzip and tar to decompress and unpack the distribution and also
    requires the ability to create groups and users on the system.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'In the first series of commands, you will add a group and a user, then unpack
    the distribution, as follows:


    +   1. At the prompt, type groupadd mysql

    2. At the prompt, type useradd -g mysql

    3. At the prompt, type cd /usr/local


    Note You can install MySQL in any directory. If you do not use /usr/local/ as
    in the example above, be sure to modify subsequent commands appropriately.


    +   4. At the prompt, type gunzip < /path/to/mysql-VERSION-OS.tar.gz | tar xvf
    -

    5. To create a link with a shorter name, type ln -s mysql-VERSION-OS mysql

    6. Change directories by typing cd mysql


    Once the distribution is unpacked, the README and INSTALL files will walk you
    through the remainder of the installation process for the version of MySQL you''ve
    chosen. In general, next series of commands will be used:


    +   1. Type scripts/mysql_install_db to run the MySQL install script.

    2. Type chown -R root /usr/local/mysql to change ownership of the mysql directory.

    3. Type chown -R mysql /usr/local/mysql/data to change ownership of the mysql/data
    directory.

    4. Type chmod -R mysql /usr/local/mysql to change the group of the mysql directory.

    5. Type chown -R root /usr/local/mysql/bin to change ownership of the mysql/bin
    directory.


