    In the previous chapter, you learned to retrieve and print the HTTP_USER_AGENT
    environment variable to the screen. In this chapter, you''ll do a bit more interesting
    with the value of HTTP_USER_AGENT, and to print browser-specific HTML.


    However, having seen of the possible values of HTTP_USER_AGENT in the last chapter,
    you can imagine that there are hundreds of slightly different values. It''s time
    to learn some basic pattern matching.


    You''ll use the preg_match() function to perform this task. This needs two arguments:
    what you''re looking for, and where you''re looking:


    ```

    preg_match("what you''re looking for", "where you''re looking");

    ```


    This function will return a value of true or false, which you can use in an if...else
    block to do whatever you want. The goal of the first script is to determine if
    a Web browser is Microsoft Internet Explorer, Netscape or something else. This
    can be a little tricky, but not because of PHP.


    Within the value of HTTP_USER_AGENT, Netscape always uses the Mozilla to identify
    itself. Unfortunately, the value of HTTP_USER_AGENT for Microsoft Internet Explorer
    also uses Mozilla to show that it''s compatible. Luckily, it also uses the MSIE,
    so you can search for that. If the value of HTTP_USER_AGENT doesn''t contain either
    Mozilla or MSIE, chances are very good that it''s not one of those browsers.


