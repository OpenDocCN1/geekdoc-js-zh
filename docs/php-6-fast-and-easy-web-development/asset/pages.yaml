    # # Chapter 9: Using Your File System


    # ## Overview


    Using simple PHP scripts, you can do anything with your file system—it''s yours,
    after all! In this chapter, you''ll learn how to do the following:


    +   * Display the contents of a directory

    * Create a new file

    * Open an existing file and append data to it

    * Copy, rename, and delete files


    # ## File Paths and Permissions


    The scripts used in these chapters can be executed on Windows and Linux/UNIX operating
    systems. If you are using Windows, you can use both the forward slash (/) and
    the backslash (\) in paths, whereas other operating systems use only the forward
    slash. The scripts in this chapter use the forward slash method in all instances.
    Methods work even if you don''t specify a drive letter. For example:


    ```

    $path = /Program Files/Apache Group/Apache/htdocs;

    ```


    This path, on Windows, is assumed to be on the current drive (in my case, C:/).
    If you need to specify a drive letter, go for it:


    ```

    $path = "C:/Program Files/Apache Group/Apache/htdocs/";

    ```


    You''ll have to modify file paths to fit your directory structure, but you shouldn''t
    have to do anything more than that.


    For each directory specified in this chapter, you must have the proper permissions
    to create, modify, and delete files. This is an especially important note for
    Windows users, whose operating system is multi-user by nature. If you are unsure
    how to assign or modify permissions on your system, contact your system administrator.


