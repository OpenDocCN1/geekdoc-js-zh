- img_proc: true
  md: 'HTML comments are ignored by the browser and are contained within <!-- -->
    tags. For example, the following comment reminds you that the code following it
    contains your logo graphic:


    ```

    <!-- logo graphic goes here -->

    ```


    PHP uses comments, too, which are ignored by the PHP parser. PHP comments are
    usually preceded by double slashes, like this:


    ```

    // this is a comment in PHP code

    ```


    But you can use other types of comments, such as


    ```

    # This is a shell-style comment

    ```


    and


    ```

    /* This begins a C-style comment that runs

    to two lines */

    ```


    Create a script of comments so that you can see how they''re ignored. Yes, I''m
    telling you to write a script that does absolutely nothing!


    +   1. Open a new file in your text editor.

    2. Type the following HTML:

    3. <HTML>

    4. <HEAD>

    5. <TITLE>Code Comments</TITLE>

    6. </HEAD>

    7. <body>

    8. <!-- This is an HTML comment. -->

    9. Type the following PHP code:

    10. <?

    11. // This is a simple PHP comment.

    12. /* This is a C-style, multiline comment. You can make this as

    13. long as you''d like. // Use this kind of comment.

    14. # Used to shells?

    15. ?>

    16. Add some more HTML so that the document is valid:

    17. </body>

    18. </HTML>

    19. Save the file with the name comments.php.

    20. Place this file in the document root of your Web server.'
