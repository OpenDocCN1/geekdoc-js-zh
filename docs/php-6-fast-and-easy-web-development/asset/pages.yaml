    This looks rather cryptic, I know. You can set the format in your httpd.conf file
    like so:


    LogFormat "%h %l %u \%t \%s %b"


    In this case, the format maps to the descriptions listed in Table 24.1.


    Table 24.1: Apache Log File Settings

    | Symbol | Description |

    |--- | --- |

    | %h | Remote host of the machine making the request, or IP if |

    | %l | Remote log name (usually empty) |

    | %u | URL path requested by the user |

    | %t | Time of access |

    | "%r" | First line of request, inside quotation marks |

    | %s | Status of the request |

    | %b | Number of bytes sent, excluding headers |


    Note You can also log elements such as the user agent (Web browser) within the
    Apache access log.


