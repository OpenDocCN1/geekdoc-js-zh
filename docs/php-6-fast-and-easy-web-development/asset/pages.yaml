  md: '# Retrieving and Using REMOTE_ADDR


    By default, environment variables are available to PHP scripts as $VAR_NAME. For
    example, the REMOTE_ADDR environment variable is already contained as $REMOTE_ADDR.
    However, to be absolutely sure that you''re reading the correct value, use the
    getenv() function to assign a value to a variable of your choice.


    The REMOTE_ADDR environment variable contains the IP address of the machine making
    your request. Let''s get the value of the REMOTE_ADDR.


    +   1. Open a new file in your text editor.

    2. Open a PHP block, then use getenv() to place the value of REMOTE_ADDR in a
    variable called $address:

    3. <

    4. $address = getenv("REMOTE_ADDR");

    5. Print the value of $address to the screen, and close your PHP block:

    6. echo "Mozilla" IP address is $address.";

    7. ?>

    8. Save the file with the name remoteaddress.php, then place this file in the
    document of your web server.

    9. Open your Web browser and type http://127.0.0.1/remoteaddress.php


    ![](img/bc248f3d24697d1afbacee37b9c4d229_64_0.png)


    Note Your IP address will differ from that shown above.


    In the next section, you''ll get the value of another handy environment variable,
    HTTP_USER_AGENT (Web browser).


    # Retrieving and Using HTTP_USER_AGENT


    The HTTP_USER_AGENT variable contains the browser type, browser version, language
    encoding and platform. For example, the following value string refers to the Netscape(Mozilla)
    browser, version 4.61, in English, and on the Windows 98 platform:


    Mozilla/4.61 (Win98; I)


    Here are some other HTTP_USER_AGENT values, for my own browser library:


    Mozilla/4.0 (compatible; MSIE 5.5; Windows 98)


    This value refers to Microsoft Internet Explorer (MSIE) version 5.0 on Windows
    98. Sometimes you will see MSIE return an HTTP_USER_AGENT value that looks like
    a Netscape value, until you notice that the value says it''s"compatible" and is
    actually "MSIE 5.0"'
