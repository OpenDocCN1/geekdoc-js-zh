    # Selecting Data from Your Test Table


    The SELECT command is very powerful and will likely be the command you use most
    when working with PHP and MySQL. You can find more information about the SELECT
    command in Appendix D, "Basic MySQL Reference," but for now, let''s do some simple
    data selections.


    +   1. At the prompt, type **select * from test_table**; and press Enter.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_13_0.png)


    This command simply selects all fields from all rows (that''s what the * does)
    in the table called test_table and returns the data to the screen in a nicely
    formatted table. The MySQL Monitor tells you how many rows were returned and how
    long it took the query to run.


    Add a little order to the results. Try to get the results ordered by ID number—largest
    number first.


    +   2. At the prompt, type **select * from test_table order by test_id desc;**;
    and press Enter.'
