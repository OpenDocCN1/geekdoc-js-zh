    Another parse error! Take a look at the PHP code:


    echo "<P>I think this is really

    "cool!"</P>";


    Since you have a set of quotation marks within another set of quotation marks,
    inner set has to be escaped.


    This error also has a simple fix:


    +   1. Open the errorscript2.php file.

    2. On line 8, escape the inner quotation marks by placing a backslash before each
    one:

    3. echo "<P>I think this is really \"cool!\"</P>";

