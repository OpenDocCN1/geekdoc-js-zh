  md: 'SMTP server is sometimes referred to as an outgoing mail server, which brings
    me to the point—you need one in order to complete the exercises in this chapter.
    On Linux/UNIX, Sendmail and Paypal are popular packages. On Windows, the SMTP
    service in the Windows NT Service Pack, or the service built into the Windows
    2000 operating system, is typically used.


    If you have installed Apache, PHP, and MySQL as part of a development environment
    on your personal machine, you probably do not have SMTP running locally. If that''s
    the case, you can access an outgoing mail server that may already be available
    to you.


    Note If you skipped the first three chapters of this book and are using PHP as
    part of an Internet service provider''s virtual hosting package, the SMTP server
    should already be installed on that machine and PHP should be properly configured
    to access it.


    If you are connected to the Internet via a dial-up connection, DSL, cable, or
    other type of connection, you can use your Internet service provider''s outgoing
    mail server. For example, if your development machine is a Windows 98 box with
    56Kbps modem connected to the Internet via EarthLink, then you can use mail.earth.net
    as your SMTP server. Whatever you have configured within your mail client (Eudora,
    Outlook, Netscape Mail, and so on) as your outgoing mail server will function
    within your PHP code as your SMTP server. The trick is making PHP aware of this
    little fact, which you''ll learn about next.


    # SMTP-Related Changes in php.ini


    In the php.ini master configuration file, there are a few directives that need
    to be set so that the mail() function works properly. Open php.ini with a text
    editor and look for these lines:


    ```

    [function]

    ; For Win32 only.

    SMTP = localhost

    ; For Win32 only.

    sendmail_from = me@localhost.com

    ; For Unix. You may supply arguments as well as default:

    ;sendmail -t -

    ;sendmail_path =

    ```


    If you are using Windows, you''ll need to modify the first two directives, SMTP
    and sendmail_from. If you plan to use the outgoing mail server of your ISP (in
    this example, EarthLink), the entry in php.ini would look like this:


    ```

    SMTP = mail.earthlink.net

    ```


    The second configuration directive is sendmail_from, and this is the e-mail address
    used in the From header of the outgoing e-mail. It can be overwritten in the mail
    script itself but normally operates as the default value. For example


    ```

    sendmail_from = youraddress@yourdomain.com

    ```'
  merge: -1
