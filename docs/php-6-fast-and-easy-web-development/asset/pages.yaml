  md: '# Chapter 4: Mixing PHP and HTML


    # Overview


    Now you have a working development environment, with PHP, Apache, and MySQL happily
    running on your machine, it''s time to delve into the PHP language. In this chapter,
    you''ll learn how to do the following:


    +   - Recognize and use the different kinds of PHP start and end tags

    - Mingle PHP and HTML within your source code

    - Escape special characters in your scripts to produce valid output


    # How PHP Is Parsed


    So you have a file, and in that file you have some HTML and some PHP code. This
    is how it works, assuming a PHP document with extension of .php.


    +   1. The Web browser requests a document with a .php extension.

    2. The Web server sends, "Hey! Someone wants a PHP file. Something else needs
    to deal with it," and sends the request to the PHP parser.

    3. The PHP parser finds the requested file and scans it for PHP code.

    4. When the PHP parser finds code, it executes that code and places the resulting
    output (if any) into the place formerly occupied by the code.

    5. This new output file is sent back to the Web server.

    6. The Web server sends it along to the Web browser.

    7. The Web browser displays the output.


    Because the PHP code is parsed by the server, this method of code execution is
    called server-side. When code is executed by the browser, such as JavaScript,
    it is called client-side.


    To combine PHP code with HTML, the PHP parser recognizes the [next section](next-section),
    you''ll learn how this is done, using PHP start and end tags.


    # PHP Start and End Tags


    The PHP parser recognizes a few different types of PHP start and end tags. It
    will attempt to excuse anything between these tags, so it would be better valid
    code!


    Study [Table 4.1](#table-4-1) to learn the three main sets of start and end tags
    recognized by the PHP parser.


    | Table 4.1: Basic PHP Start and End Tags |

    | Opening Tag | Closing Tag |

    | <??php | ?> |

    | <?? | ?> |'
