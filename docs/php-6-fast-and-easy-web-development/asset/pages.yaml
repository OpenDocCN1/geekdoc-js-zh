    # HTTP Environment Variables


    When a Web browser makes a request of a Web server, it sends along with the request
    list of extra variables. These are called environment variables, and they can
    be very useful for displaying dynamic content or authorizing users.


    The phpinfo() function displays a wealth of information about your Web server
    software and the version of PHP you are running, in addition to the basic HTTP
    environment. Let''s see what you have.


    +   - Open a new file in your text editor.

    - Type the following line of PHP code:

    - <? phpinfo(); ?>

    - Save the file with the name phpinfo.php and place this file in the document
    root of your Web server.

    - Open with your browser and type http://127.0.0.1/phpinfo.php


    ![](img/bc248f3d24697d1afbacee37b9c4d229_63_1.png)


    You should see a very long page full of interesting information.


    Note Your information will differ, not only from machine to machine, but from
    platform to platform. These screenshot were taken on a Windows development machine.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_63_2.png)


    > As you scroll down, look for a section titled Apache Environment. In the next
    sections, you''ll learn how to use two environment variables, script and HTTP_USER_AGENT.
    For an explanation of some of the HTTP environment variables shown in the page
    output, visit http://hohoo.ncsa.nuc.edu/env.html.'
