    and is not visible to this user.


    HTML and PHP comments are used extensively throughout this book to explain blocks
    of code. Get used to reading comments, and to pick up the habit of using them.
    Writing clean, bug-free code, with comments and white space, will make you popular
    among your developer peers because they won''t have to work hard to figure out
    what your code is trying to do. In the next chapter, you''ll learn all about variables,
