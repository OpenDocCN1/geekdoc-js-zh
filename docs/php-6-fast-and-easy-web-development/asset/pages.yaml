  md: '8. The installation process will now take over, and install files in their
    proper locations. When the process is finished, you will see a confirmation of
    completion. Click Finish to complete the setup process.


    # 8.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_8_0.png)


    MySQL is now installed on your system. However, you won''t find any shortcuts
    installed for your Windows Start menu after an installation of MySQL from scratch,
    so now you must start the process yourself. If you navigate to the C:\mysql directory,
    you will find several applications ready for action. One of these applications
    is called Workbench, which is a great friend to Windows users who are just getting
    started with MySQL. If you double-click the MySQL server and place a Spotlight
    icon in your task, you can launch a graphical user interface to maintain and monitor
    your new server.


    WinMySQLAdmin will automatically interpret environment information, such as IP
    address, machine name, and so on. The tabs across the top allow you to view system
    information and also edit MySQL configuration options. To shut down the MySQL
    server/or the WinMySQLAdmin tool, right-click again on the Spotlight icon in your
    taskbar and select the appropriate choice. As long as the MySQL server is running,
    you can run additional applications through a console window, which is the MySQL
    monitor.


    In the next section, you''ll learn to manually start MySQL and perform a few actions
    to familiarize yourself with the system.


    # Testing Your MySQL Installation


    In this section, you will start and work with the MySQL utilities via the command
    line in a console window. When using MySQL with PHP, you''ll use the same types
    of commands, only within the context of the PHP code. And use the information
    in this section to familiarize yourself with the types of commands and responses
    you will be working with later in the book.


    # Starting MySQL


    To manually start MySQL, follow the steps below.'
  merge: -1
