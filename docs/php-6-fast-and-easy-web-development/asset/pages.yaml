    # Using Cookie Variables


    There''s an element to use cookies that most people forget about until they spend
    a few hours trying to debug something that isn''t even (I''ve done this). When
    a Web browser accepts a cookie, you can''t extract its value until the next HTTP
    request is made.


    In other words, if you set a cookie name with a value of Julie on page 1, you
    can''t extract that value until the user reaches page 2 (or page 28—just some
    other page that isn''t the page on which the cookie is initially set).


