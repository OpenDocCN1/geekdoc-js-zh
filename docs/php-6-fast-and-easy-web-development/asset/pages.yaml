    Note Use some thought to determine which variables you really want to become globally
    available Each time you declare something as global, you must employ additional
    programming constraints in order to maintain the integrity of the data. In other
    words, you have to be careful and watch what you do. If you have declared a variable
    as global, but use a variable of the same name in another part of your script,
    you will overwrite one or the other. A good rule of thumb is to keep a handle
