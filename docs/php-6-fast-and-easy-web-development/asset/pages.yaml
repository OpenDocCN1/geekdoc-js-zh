  pgno: 237
- img_proc: true
  md: '# Developing a Subscription Mechanism


    Before you can start sending mail to a mailing list, you need to build up that
    subscriber base. A simple subscribe/unsubscribe script will take care of that!
    All this script does is add or delete records in MySQL database table, called
    subscribers, which you''ll create in the next section.


    # Creating the subscribers Table


    My subscribers table has three fields, as shown in Table 23.1. You can have as
    many or as few fields as you''d like.


    | Table 23.1: Fields for Subscribers |

    | Field Name | Description |

    | id | A primary key that holds the subscriber''s auto-incrementing ID number
    |

    | email_addr | Holds the subscriber''s e-mail address |

    | date_added | The date the user subscribed |


    Next, you''ll actually create this table using the table-creation scripts you''re
    familiar with this point!


    +   1. Open your Web browser and type http://127.0.0.1/show-createtable.html

    2. In the Table Name field, type subscribers.

    3. In the Number of Fields field, type 3.


    ![](img/bc248f3d24697d1afbacee37b9c4d229_238_0.png)


    +   4. Click on the Go to Step 2 button. You should see the form in the figure.


