    # The Importance of Unique Fields


    Using ID numbers not only help you keep track of your data, but down the road,
    they help you to establish relationships between multiple tables. In my_music
    table, there will be an ID field (see Table 12.2). Using this field as the unique
    field, instead of the field will allow you to have two recordings in your table
    that have the same name. For example, if you own the album Strange Fire by Indigo,
    you have two entries in your table: for the version released in 1987 and one for
    the version released in 1989.


    | Table 12.2: Fields for my_music |

    | Field Name | Description |

    | id | Creates a unique ID number for the entry |

    | format | Is it a CD, cassette, or an LP? |

    | title | The title of the recording |

    | artist_fn | The artist''s first name |

    | artist_In | The artist''s last name or the name of the group |

    | rec_label | The record label |

    | my_notes | My own thoughts about the recording |

    | date_acq | Date acquired |


    Without a unique identifier, you wouldn''t be able to pick only one version to
    put in your table, and this simple example conveys the importance of having a
    unique identifier in every record of your table. The usage of the unique identifier
    will become more apparent throughout the remainder of this book as you create
    more database-driven elements.


    # A Two-Step Form Sequence


    A two-step form sequence for creating a database table might seem like overkill.
    After all, you saw a basic table-creation SQL statement in Chapter 1, when you
    created test_table:


    ```

    create table test_table (test_id int, test_note text);

    ```


    When using a PHP script to create a table, all you''re doing is sending the exact
    same query to MySQL. However, you can tie a pretty ribbon around the process (creating
    a form-based interface) and call it an administrative interface!'
