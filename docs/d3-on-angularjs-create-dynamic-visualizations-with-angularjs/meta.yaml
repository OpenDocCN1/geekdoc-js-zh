    # SVG edges


    Note that when we are using an SVG element positioned beyond the border of its
    parent `<svg>` element, it will be clipped. To be sure that our elements don’t
    get cut off, we’ll either have to ensure the `<svg>` element is large enough or
    by making sure our inner SVG elements never exceed the border of their root `<svg>`
    element.


    There are a number of SVG elements that we can use to draw visual elements inside
    of our `<svg>` element on the DOM as well as we have the opportunity to build
    our own. These include simple shapes, such as circles, ellipses, lines, rectangles,
    and rounded rectangles.'
