    \ ng-app=\"myApp\" ng-init=\"chart=[10, 20, 30]\">\n  <button ng-click=\"chart.push(50)\"\
    >add slice</button>\n  <button ng-click=\"chart.pop()\">remove slice</button>\n\
    \  <!-- ... -->\n</body>\n```\n\nWe also need some way to add the `<input>` range\
    \ sliders for each slice (or element) in the chart array. For this, we can use\
