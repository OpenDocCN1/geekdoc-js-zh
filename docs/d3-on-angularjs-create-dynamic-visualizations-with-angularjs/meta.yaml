    \n> Root DOM elements\n\nIf we do not include the first line of d3.select('body'),\
    \ D3 won't know where to place our elements, so it picks the topmost DOM element\
    \ (or the root element), which is the `<html>` element.\n\nWe need to specify\
    \ where we want to place our D3 chart. This does **not** need to be the `<body>`\
    \ element and can be any element in the DOM.\n\n## exit()\n\nexit() works similar\
    \ to enter() but unlike .enter() returns a new selector of data/element pairs\
    \ without elements.\n\nHere's a quick example of using exit() assuming the DOM\
    \ currently has three `<div class=\"bar\"></div>` tags.\n\n```\nd3.select('body').selectAll('.bar').data([8,\
    \ 3]).exit().remove();\n```\n\nLive version: [http://jsbin.com/UpIgiwah/1/edit](http://jsbin.com/UpIgiwah/1/edit)\n\
    \nIn this example we've also introduced the `remove()` selector method which,\
