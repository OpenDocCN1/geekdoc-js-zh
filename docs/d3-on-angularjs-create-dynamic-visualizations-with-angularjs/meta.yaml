    When talking about data binding within HTML, we usually mean changing the contents
    of some visible property of a DOM element based on some variable. This could mean
    updating the text within a DOM element or changing one of its style properties,
    like its opacity. Since this task is so common in data visualization, D3 uses
    a new way of performing data binding. Unlike with jQuery’s selections, D3 lets
    us easily associate data with DOM elements which makes modifying those elements
    a lot easier and, more importantly, take less code to write. The trade off is
    that we have to *really* understand how selections operate under the hood to get
    their benefit.


    Up until now, what we’ve described of D3 selections has been a bit of a white
    lie. Selections are slightly more than just collections of DOM elements. They
    are actually collections of data and DOM element pairs. Here’s what a selector
    looks like in jQuery. It’s just a collection of DOM elements.


    ![](img/82f49fe8a368850935eb7606dfa7579d_15_0.png)


    Here’s what a D3 selector looks like.


    ![](img/82f49fe8a368850935eb7606dfa7579d_15_1.png)


    The dashed blue lines represent empty data elements for each of the three `<div>`
    tags.


    If we were to then “bind” a new array of data to those data/element pairs, say
    `[18, 4, 7]`, we would now have a selector that looks like the following.


    ![](img/82f49fe8a368850935eb7606dfa7579d_15_2.png)


    And here’s the D3 code that would produce this selector


    ```

    var selector = d3.selectAll(''div'').data([18, 4, 7]);

    ```


    18 is now associated with the first `<div>` tag, 4 with the second, and 7 with
    the third.


    As you’ve just seen, the selector `data()` method takes an array of data and binds
    each data item in that array to each DOM element in selector. To demonstrate this,
    let’s build a simple bar chart. We’ll start off with this HTML.


    ```

    <body>

    <style>

    .bar{

