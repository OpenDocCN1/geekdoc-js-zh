  - "[PAGE 31]\n\nThe main reason is that we cannot (easily) include HTML into an\
    \ SVG the way we can include SVG into HTML. This is also to allow SVG images to\
    \ exist on their own, outside of a browser allowing SVG images to be edited in\
    \ image editors like Adobe Illustrator. We can set the location of a `<text>`\
    \ tag using its `x` and `y` attributes and set the text by editing its inner text\
    \ content.\n\nThat said, the `<text>` element inherits from it's CSS-specified\
    \ font styles unless it's directly set on the `<text>` element itself.\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n  <body>\n    <svg>\n      <text x=\"100\" y=\"100\"\
    \ fill=\"green\" font-family=\"arial\" font-size=\"16\">\n        Ceci n'est pas\
    \ une pipe.\n      </text>\n    </svg>\n  </body>\n</html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_31_0.png)\n\
    \nLive version: [http://jsbin.com/eralusAW/1/edit](http://jsbin.com/eralusAW/1/edit)"
- md: "## SVG group\n\nThe `<g>` tag is an easy way to group SVG elements. Any transformations\
    \ (positioning, scaling, rotating) that are applied to the group element will\
    \ also be applied to each of the child elements.\n\nUsing groups, we could, for\
    \ example, create a collection of SVG elements that draw a car using circles for\
    \ wheels, and rectangles for axles. If we then wanted to rotate the car, we could\
    \ simply apply the transformation to the `<g>` element containing all the components.\n\
    \n## SVG style\n\nStyling SVG elements is almost exactly the same as styling HTML\
    \ elements. We can still use CSS with `id` and `class` attributes to connect our\
    \ CSS with our SVG elements or simply apply the style directly using the `style`\
    \ attribute.\n\nThe only difference is that a large number of the styles differ\
    \ from what we expect from experience with HTML.\n\nTake for example the HTML\
    \ `background-color: orange;` style. The closest equivalent for an SVG element\
    \ is `fill: orange;`. Similarly, what we expect as of `border-color: blue` equivalent\
    \ in SVG is `stroke: blue;` or `border-width: 10px;` and `stroke-width: 10;`.\
    \ This is an important detail and a common gotcha when working with SVG coming\
    \ from an HTML background.\n\n```html\n<!DOCTYPE HTML>\n<html>\n  <head>\n   \
    \ <style>\n      svg path {\n        stroke: red;\n        stroke-width: 30px;\n\
    \        fill: white;\n      }\n      svg text {\n        font-size: 30px;\n \
    \       font-family: sans-serif;\n        fill:red;  /* not `color` or `font-color`\
    \ */\n      }\n    </style>\n  </head>\n  <body>\n    <svg>\n      <path d=\"\
    M 30 20 L 140 200 L 240 20 z\"></path>\n      <text x=\"95\" y=\"80\">YIELD</text>\n\
    \    </svg>\n  </body>\n</html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_33_0.png)\n\
    \nLive version: [http://jsbin.com/iXiglFe/1/edit](http://jsbin.com/iXiglFe/1/edit)\n\
    \nIt's possible to place these styles directly on the elements themselves. Using\
    \ CSS to do so is generally much easier and more recommended as it is easier to\
    \ maintain and read.\n\n> **Common gotcha:**\n> Keep in mind that for SVG elements,\
    \ transformations are applied using the `transform` attribute, unlike HTML elements,\
    \ which use a `transform` CSS property.\n\n## More on SVG\n\n### Transparency\n\
    \nSVG supports drawing with transparency, which we can do one of two ways. We\
    \ can either set the `opacity` attribute directly on an element or we can set\
    \ the `rgba` as a color, where the fourth argument is the transparency (also known\
    \ as the alpha value).\n\nWe can set the opacity of an SVG element just like we\
    \ set any other attribute:\n\n```javascript\nd3.select('body').append('svg')\n\
    \    .attr('width', '300px')\n    .attr('height', '200px')\n    .data([1,2,3])\n\
    \    .enter().append('circle')\n        .attr('fill', 'blue')\n        .attr('opacity',\
    \ '0.4');\n```\n\nLive version: [http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_34_0.png)\n\nAs we previously mentioned,\
    \ it's easy to combine the two attributes of `opacity` and `fill` using the `rgba()`\
    \ function, where we set both the color and the transparency in one go.\n\n```javascript\n\
    d3.select('body').append('svg')\n   .attr('width', '300px')\n   .attr('height',\
    \ '200px')\n   .data([1,2,3])\n   .enter().append('circle')\n      .attr('fill',\
    \ 'rgba(100, 200, 300, 0.4)');\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_1.png)\n\
    \nLive version: [http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)\n\
    \n### Strokes\n\nThere are more options at our disposal when it comes to the appearance\
    \ of shape strokes than just stroke thickness and color. There's also `stroke-linejoin`\
    \ which affects the corners of line segments, `stroke-linecap` which affects the\
    \ appearance of line ends in a similar way to `stroke-linejoin`, and also `stroke-dasharray`\
    \ which can be used to create a dashed line effect instead of the default solid\
    \ line.\n\n```html\n<svg>\n   <line x1=\"20\" y1=\"20\"\n         x2=\"200\" y2=\"\
    200\"\n         stroke=\"blue\"\n         stroke-linecap=\"round\"\n         stroke-dasharray=\"\
    4,30\"\n         stroke-width=\"20\">\n   </line>\n</svg>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_2.png)\n\
    \nLive version: [http://jsbin.com/EBuciXuZ/1/edit](http://jsbin.com/EBuciXuZ/1/edit)\n\
    \n### Layering\n\nYou may run into situations where you have overlapping SVG elements\
    \ where one element should be behind another instead of in front. This can happen\
    \ when the order in which you add your SVG elements is not the same as their visual\
    \ depth order, bottom to top. With HTML we can fix this using the `z-index` CSS\
    \ property but that doesn't work for SVG elements.\n\nInstead, we'll have to remove\
    \ and re-add any elements we'd like to be on the very top of their parent element.\
    \ Luckily, D3 selections come with a nice helper method called `sort` for just\
    \ this problem. We can pass it our sort function and D3 will resort our selection\
    \ and update the DOM elements accordingly.\n\n```javascript\nd3.selectAll('circles').sort(function(a,\
    \ b){\n   // assuming we've added our own `zIndex` data property\n   return a.zIndex\
    \ - b.zIndex;\n});\n```\n\n## SVG and D3\n\nSVG can be somewhat tedious to use\
    \ on its own but after the previous introduction, we’ll rarely, if ever, need\
    \ to write any SVG directly.\n\nInstead, we’ll use D3 to create these elements\
    \ and apply style for us.\n\nWe’ll still need to know how SVG works to master\
    \ D3, but we will let the library take care of the heavy lifting. Now that we’ve\
    \ covered some of the basics of SVG, we can begin to talk more about using it\
    \ in combination with D3.\n\n### From nothing to SVG\n\nWhen we first start up\
    \ the page, we’ll need a place to place our SVG elements. As stated above, we\
    \ can only place our elements inside of an `<svg>` tag. Sometimes it’s more convenient\
    \ (especially when we integrate with using directives) to not place this directly\
    \ on the page.\n\nWe can use d3 to make our svg, like so:\n\n```javascript\nvar\
    \ svg = d3.select(\"body\")\n        .append(\"svg\");\n```\n\nWith the svg variable,\
    \ we can now reference the `<svg>` element and interact with our D3 stage at any\
    \ time. It’s possible to use the same methods on the `<svg>` element that we’ll\
    \ use on the D3 elements to set attributes on it.\n\nFor instance, let’s set a\
    \ height and a width:\n\n```javascript\nd3.select('body').append('svg')\n  .attr('width',\
    \ 300)\n  .attr('height', 200);\n```\n\n### Generators\n\nOne of the nicest parts\
    \ of D3, is its focus on making SVG element creation manageable through D3’s generators.\n\
    \nGenerators play the part of both objects and functions. Generators are functions,\
    \ like any other function that has additional methods to allow us to change its\
    \ behavior. Just like any other D3 class, most generator methods return themselves\
    \ so we can chain methods on top of them.\n\nOnce we’ve configured our generators\
    \ for our needs, we’ll use them to *generate* the necessary SVG commands to create\
    \ our shape.\n\nLet’s look at a very simple example, the line generator:\n\nThe\
    \ `line` generator takes any data that we pass it and generates the necessary\
    \ SVG `<path>` d attribute commands. In order to use the path generator, we need\
    \ to tell it a little about the format of our data. We do this by defining `accessor`\
    \ functions for the x and y coordinates of the line across our data. This essentially\
    \ says \"hey line generator, when you create a line, use this for the x and this\
    \ for the y of each data point.\"\n\nIf our data was a set of points where a single\
    \ point was an array of the form `[x, y]` and the array of points looked like\
    \ this:\n\n```javascript\nvar data = [ [x1, y1], [x2, y2], [x3, y3], etc... ];\n\
    ```\n\nOur line generator would look like this:\n\n```javascript\nvar line = d3.svg.line()\n\
    \    .x(function(d) { return d[0]; })\n    .y(function(d) { return d[1]; });\n\
    ```\n\nLet's say our data instead was an array of coordinate objects of the form\
    \ `{ x: x1, y: y1 }` and the array of points looked like this:\n\n```javascript\n\
    var data = [ { x: x1, y: y1 }, { x: x2, y: y2 }, etc... ];\n```\n\nThen our line\
    \ generator x and y accessors would look like this:\n\n```javascript\nvar line\
    \ = d3.svg.line()\n    .x(function(d) { return d.x; })\n    .y(function(d) { return\
    \ d.y; })\n```\n\n### Here's a complete line generator example\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style>\n      body{ margin: 0; }\n      path { stroke:\
    \ black; stroke-width: 2px; fill: none;}\n    </style>\n  </head>\n  <body>\n\
    \    <script>\nvar lineGenerator = d3.svg.line()\n    .x(function(d) { return\
    \ d[0]; })\n    .y(function(d) { return d[1]; });\n\n// the line data\nvar lineData\
    \ = [[154, 14], [35, 172], [251, 127], [31, 58], [157, 205],\n    [154, 14]];\n\
    \n// create `<svg>` and inner `<path>` element\nd3.select('body').append('svg')\n\
    \    // use the generator and line data to create the `d` attribute for our path.\n\
    \    .append('path').datum(lineData).attr('d', lineGenerator);\n    </script>\n\
    \  </body>\n</html>\n```"
  mdcn: "\n## SVG 组\n\n`<g>` 标签是一种将 SVG 元素分组的简便方式。任何应用到组元素的变换（定位、缩放、旋转）也会应用到每个子元素上。\n\
    \n利用分组，例如，我们可以创建一组 SVG 元素来绘制一辆汽车——用圆形表示车轮，用矩形表示车轴。如果我们想要旋转这辆汽车，只需将变换应用到包含所有组件的\
    \ `<g>` 元素上即可。\n\n## SVG 样式\n\n为 SVG 元素设置样式与为 HTML 元素设置样式几乎完全相同。我们仍然可以使用 CSS，通过\
    \ `id` 和 `class` 属性将 CSS 与 SVG 元素关联起来，或者直接使用 `style` 属性应用样式。\n\n唯一的区别是，大量的样式与我们从\
    \ HTML 经验中预期的不同。\n\n例如，HTML 的 `background-color: orange;` 样式。在 SVG 元素中最接近的等价物是\
    \ `fill: orange;`。同样，我们预期的 `border-color: blue` 在 SVG 中的等价物是 `stroke: blue;` 或者\
    \ `border-width: 10px;` 和 `stroke-width: 10;`。这是一个重要的细节，也是从 HTML 背景转向 SVG 时常见的易错点。\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <style>\n      svg path {\n\
    \        stroke: red;\n        stroke-width: 30px;\n        fill: white;\n   \
    \   }\n      svg text {\n        font-size: 30px;\n        font-family: sans-serif;\n\
    \        fill:red;  /* 不是 `color` 或 `font-color` */\n      }\n    </style>\n \
    \ </head>\n  <body>\n    <svg>\n      <path d=\"M 30 20 L 140 200 L 240 20 z\"\
    ></path>\n      <text x=\"95\" y=\"80\">YIELD</text>\n    </svg>\n  </body>\n\
    </html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_33_0.png)\n\n在线版本：[http://jsbin.com/iXiglFe/1/edit](http://jsbin.com/iXiglFe/1/edit)\n\
    \n也可以将这些样式直接放在元素本身上。但使用 CSS 通常要容易得多，也更推荐这样做，因为更易于维护和阅读。\n\n> **常见易错点：**\n> 请记住，对于\
    \ SVG 元素，变换是通过 `transform` 属性应用的，而 HTML 元素则是使用 `transform` CSS 属性。\n\n## SVG 进阶\n\
    \n### 透明度\n\nSVG 支持使用透明度进行绘制，我们有两种方式可以实现。我们可以直接在元素上设置 `opacity` 属性，或者将 `Brightness`\
    \ 设置为颜色，其中第四个参数是透明度（也称为 alpha 值）。\n\n我们可以像设置任何其他属性一样设置 SVG 元素的不透明度：\n\n```javascript\n\
    d3.select('body').append('svg')\n    .attr('width', '300px')\n    .attr('height',\
    \ '200px')\n    .data([1,2,3])\n    .enter().append('circle')\n        .attr('fill',\
    \ 'blue')\n        .attr('opacity', '0.4');\n```\n\n在线版本：[http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_34_0.png)\n\n如前所述，使用 `rgba()` 函数可以轻松地将\
    \ `opacity` 和 `fill` 两个属性结合起来，一次性设置颜色和透明度。\n\n```javascript\nd3.select('body').append('svg')\n\
    \   .attr('width', '300px')\n   .attr('height', '200px')\n   .data([1,2,3])\n\
    \   .enter().append('circle')\n      .attr('fill', 'rgba(100, 200, 300, 0.4)');\n\
    ```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_1.png)\n\n在线版本：[http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)\n\
    \n### 描边\n\n除了描边粗细和颜色之外，还有更多选项可以控制形状描边的外观。还有 `stroke-linejoin`，它影响线段连接处的拐角；`stroke-linecap`，它与\
    \ `stroke-linejoin` 类似，影响线条端点的外观；以及 `stroke-dasharray`，可用于创建虚线效果，代替默认的实线。\n\n\
    ```html\n<svg>\n   <line x1=\"20\" y1=\"20\"\n         x2=\"200\" y2=\"200\"\n\
    \         stroke=\"blue\"\n         stroke-linecap=\"round\"\n         stroke-dasharray=\"\
    4,30\"\n         stroke-width=\"20\">\n   </line>\n</svg>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_2.png)\n\
    \n在线版本：[http://jsbin.com/EBuciXuZ/1/edit](http://jsbin.com/EBuciXuZ/1/edit)\n\n\
    ### 层级\n\n你可能会遇到这样的情况：有重叠的 SVG 元素，其中一个元素应该位于另一个元素后面，而不是前面。这可能发生在添加 SVG 元素的顺序与其视觉深度顺序（从下到上）不一致时。在HTML中，我们可以使用\
    \ `z-index` CSS 属性来解决这个问题，但这对于 SVG 元素不起作用。\n\n相反，我们必须移除并重新添加那些我们希望位于其父元素最顶层的任何元素。幸运的是，D3\
    \ 选择集提供了一个名为 `sort` 的便捷方法，正好用于解决这个问题。我们可以向它传递我们的排序函数，D3 将重新排序我们的选择集并相应地更新 DOM\
    \ 元素。\n\n```javascript\nd3.selectAll('circles').sort(function(a, b){\n   // 假设我们已经添加了自己的\
    \ `zIndex` 数据属性\n   return a.zIndex - b.zIndex;\n});\n```\n\n## SVG 与 D3\n\n单独使用\
    \ SVG 可能有些繁琐，但在前面的介绍之后，我们很少（如果有的话）需要直接编写任何 SVG。\n\n相反，我们将使用 D3 来创建这些元素并为我们应用样式。\n\
    \n我们仍然需要了解 SVG 的工作原理才能掌握 D3，但我们会让这个库来处理繁重的工作。既然我们已经介绍了 SVG 的一些基础知识，我们就可以开始更多地谈论如何将它与\
    \ D3 结合使用。\n\n### 从零开始创建 SVG\n\n当我们首次启动页面时，我们需要一个地方来放置我们的 SVG 元素。如上所述，我们只能将元素放在\
    \ `<svg>` 标签内部。有时更方便的做法（尤其是当我们集成使用指令时）是不直接将其放在页面上。\n\n我们可以使用 d3 来创建我们的 svg，如下所示：\n\
    \n```javascript\nvar svg = d3.select(\"body\")\n        .append(\"svg\");\n```\n\
    \n有了 svg 变量，我们现在可以随时引用 `<svg>` 元素并与我们的 D3 舞台进行交互。我们可以在 `<svg>` 元素上使用与 D3 元素相同的方法来设置其属性。\n\
    \n例如，让我们设置高度和宽度：\n\n```javascript\nd3.select('body').append('svg')\n  .attr('width',\
    \ 300)\n  .attr('height', 200);\n```\n\n### 生成器\n\nD3 最出色的部分之一，是它专注于通过 D3 的生成器使\
    \ SVG 元素的创建变得可管理。\n\n生成器兼具对象和函数的角色。生成器是函数，与其他函数一样，它们有额外的方法来允许我们更改其行为。就像任何其他 D3\
    \ 类一样，大多数生成器方法返回自身，因此我们可以对它们进行 chaining 方法调用。\n\n一旦我们根据需求配置好了生成器，我们将使用它们来 *生成*\
    \ 创建形状所需的 SVG 命令。\n\n让我们看一个非常简单的例子，线条生成器：\n\n`line` 生成器接收我们传递给它的任何数据，并生成必要的 SVG\
    \ `<path>` d 属性命令。为了使用路径生成器，我们需要告诉它一些关于我们数据格式的信息。我们通过为线条在我们数据中的 x 和 y 坐标定义 `accessor`（访问器）函数来做到这一点。这本质上是在说：\"\
    嘿，线条生成器，当你创建线条时，用这个作为每个数据点的 x，用这个作为 y。\"\n\n如果我们的数据是一组点，其中单个点是 `[x, y]` 形式的数组，而点数组如下所示：\n\
    \n```javascript\nvar data = [ [x1, y1], [x2, y2], [x3, y3], etc... ];\n```\n\n\
    我们的线条生成器将如下所示：\n\n```javascript\nvar line = d3.svg.line()\n    .x(function(d)\
    \ { return d[0]; })\n    .y(function(d) { return d[1]; });\n```\n\n假设我们的数据而是 `{\
    \ x: x1, y: y1 }` 形式的坐标对象数组，点数组如下所示：\n\n```javascript\nvar data = [ { x: x1, y:\
    \ y1 }, { x: x2, y: y2 }, etc... ];\n```\n\n那么我们的线条生成器 x 和 y 访问器将如下所示：\n\n```javascript\n\
    var line = d3.svg.line()\n    .x(function(d) { return d.x; })\n    .y(function(d)\
    \ { return d.y; })\n```\n\n### 这是一个完整的线条生成器示例\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
    \  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"\
    ></script>\n    <style>\n      body{ margin: 0; }\n      path { stroke: black;\
    \ stroke-width: 2px; fill: none;}\n    </style>\n  </head>\n  <body>\n    <script>\n\
    var lineGenerator = d3.svg.line()\n    .x(function(d) { return d[0]; })\n    .y(function(d)\
    \ { return d[1]; });\n\n// 线条数据\nvar lineData = [[154, 14], [35, 172], [251, 127],\
    \ [31, 58], [157, 205],\n    [154, 14]];\n\n// 创建 `<svg>` 和内部的 `<path>` 元素\nd3.select('body').append('svg')\n\
    \    // 使用生成器和线条数据来创建路径的 `d` 属性。\n    .append('path').datum(lineData).attr('d',\
    \ lineGenerator);\n    </script>\n  </body>\n</html>\n```\n"
