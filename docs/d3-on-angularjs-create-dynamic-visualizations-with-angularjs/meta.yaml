    \ d3.max(data)])\n  // 或者我们可以使用 d3.extent() 函数：\n  .domain(d3.extent(data));\n\
    ```\n\n## 设置输出范围\n\n我们可以使用 `.range([values])` 函数来设置输出*范围*：\n\n```\nvar scale =\
    \ d3.scale.linear()\n```\n"
