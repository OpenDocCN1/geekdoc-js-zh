  md: '# Model, View, Whatever


    Most web frameworks encourage developers to break up their code into ether “models”,
    “views”, or “controllers” or (MVC). We can think of them in the following way:


    Models: The information our application wants to show or allow to be modified.
    Views: The components responsible for showing or modifying that information or
    a “view” of the information. Controllers: the logic responsible for properly connecting
    the two.


    ![](img/82f49fe8a368850935eb7606dfa7579d_86_0.png)


    Remember to keep in mind that there’s a difference between this general, informal
    categorization of the parts of any application, and the types of components that
    actually exist in our application. Some frameworks might share some of these responsibilities
    across components or might call them something completely different. In Angular
    specifically, there is no formal “view” class or function. The “view” is just
    the DOM.


    In Angular, for the most part, our viewers and models are automatically connected.
    This automatic (or “two-way”) data binding is the default and occurs on what’s
    called the “scope”. Just by changing a variable on the scope (aka, the model),
    it’s change will automatically be sent to the DOM. Because this isn’t strictly
    MVC, the Angular community refers to this pattern as “Model, View, Whatever” because
    you can loose a lot of time contemplating exactly what pattern Angular falls into.


    ![](img/82f49fe8a368850935eb7606dfa7579d_86_1.png)'
