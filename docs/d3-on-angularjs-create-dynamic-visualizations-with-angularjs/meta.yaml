  md: 'We can draw text with many different fonts or paths that can be straight, curves
    filled in, outlined and more. We have the full color spectrum available for us
    to use to create gradients, patterns, visual effects on images, compositing, and
    alpha effects.


    SVG also allows us to define animation for different elements.


    Furthermore, many popular illustration programs export graphics to SVG, so it''s
    possible to draw paths using an external tool that we can draw the graphics from
    on the web.


    # ## Differences between SVG and HTML


    Even though SVG feels like HTML, it differs in a few, not-so-obvious ways. Simply
    because a property or style works in HTML doesn''t mean it will work for SVG elements.


    For example, `width` and `height` properties make no sense for a circle. The only
    three things that describe the geometry of a circle are precisely the three we
    mentioned, its x and y position from its center (`cx` and `cy`), and its radius
    (`r`). Notice also that these are properties and not styles. We **cannot effect
    position of SVG elements by using CSS styles like we can with HTML elements**.


    **Common Gotcha:**


    Just because a property or style works in HTML doesn''t mean it will work for
    SVG. Common pitfalls involve using attributes or styles such as `width` `height`,
