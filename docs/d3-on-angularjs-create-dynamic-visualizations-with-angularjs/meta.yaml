    \ function(d){ return d / (n-1) * 100 + '%' })\n  .style('height', 100 / n + '%');\n\
    ```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_21_0.png)\n\nLive version: [http://jsbin.com/UpIgiwah/2/edit](http://jsbin.com/UpIgiwah/2/edit)\n\
    \n## SVG basics\n\nThe first section of this chapter provides an introduction\
    \ to SVG, a powerful open web standard for creating vector graphics in the browser.\
    \ In the second half of this chapter, we'll highlight the D3 helper functions\
    \ that make working with SVG fun and manageable.\n\n## Scalable Vector Graphics\n\
    \nAlthough D3 can easily help us create and draw div elements, our visualizations\
    \ generally require much more horsepower. We'll use Scalable Vector Graphics (or\
    \ SVG for short) to give us a much more expressive interface for drawing in the\
    \ DOM.\n\nSVG is, like HTML, an XML-based markup language created specifically\
    \ for creating vector-based two-dimensional graphics that has support for interactivity\
    \ and animation.\n\nTraditional graphics systems, or raster graphics, rely on\
    \ manipulating pixels which often ends up being what's called a destructive process.\
    \ This means once we commit to modifying the pixel information in a particular\
    \ way, it's very hard and often impossible to alter or undo those changes.\n\n\
    With vector graphics, instead of simply recording all the pixels in the image,\
    \ just the necessary shapes and colors are recorded and recounted just before\
    \ the graphic is shown on the screen. This last step, of taking the geometry and\
    \ converting it to pixels on the screen, happens transparently and automatically\
    \ for us.\n\nThis process has the benefit of being easily scalable, as well as\
