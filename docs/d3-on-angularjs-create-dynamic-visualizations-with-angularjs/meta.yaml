    # General update pattern


    Let’s walk through a slightly more complicated example of using `enter()`, `exit()`,
    and regular `selectAll()` selections to create a dynamically updating bar chart.
    Assuming we’ve taken care of the styles, we’ll first need to create a selector
    for our future bars. This tells D3 where within the DOM to add new elements if
    we call `append()`.


    ```

    1 var bars = d3.select(''body'').selectAll(''.bar'');

    ```


    Next, we’ll create a function called `update()` that will be responsible for periodically
    updating our bar chart with new data.


    ```

    1 function update(){

    2   // our update code will go here!

    3 }

    4 setInterval(update, 800);

    ```


    Inside of it, we’ll use `d3.range(n)` again to create a new array of length `n`
    as our data. So we can demonstrate adding or removing bars, we’ll give `n` a random
    value between 0 and 100 each time `update()` is called.


    ```

    1 function update(){

    2   var n = Math.round(Math.random() * 100);

    3   var data = d3.range(n);

    4   bars = bars.data(data);

    5 }

    ```


