    \ originally had 3 `<div>` tags with the `.bar` class. Those elements are then\
    \ paired with an array with only two data items. Because the 3rd element is now\
    \ no longer paired with a data item, `exit()` will create a new selector with\
    \ just it. `remove()` then removes it.\n\n## General update pattern\n\nLet's walk\
    \ through a slightly more complicated example of using `enter()`, `exit()`, and\
    \ regular `selectAll()` selections to create a dynamically updating bar chart.\
    \ Assuming we've taken care of the styles, we'll first need to create a selector\
    \ for our future bars. This tells D3 where within the DOM to add new elements\
    \ if we call `append()`.\n\n```\nvar bars = d3.select('body').selectAll('.bar');\n\
    ```\n\nNext, we'll create a function called `update()` that will be responsible\
    \ for periodically updating our bar chart with new data.\n\n```\nfunction update(){\n\
    \  // our update code will go here!\n}\nsetInterval(update, 800);\n```\n\nInside\
    \ of it, we'll use `d3.range(n)` again to create a new array of length `n` as\
    \ our data. So we can demonstrate adding or removing bars, we'll give `n` a random\
    \ value between 0 and 100 each time `update()` is called.\n\n```\nfunction update(){\n\
    \  var n = Math.round(Math.random() * 100);\n  var data = d3.range(n);\n  bars\
