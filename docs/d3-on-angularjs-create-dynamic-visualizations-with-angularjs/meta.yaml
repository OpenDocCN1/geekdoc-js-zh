    Sets are very similar to maps, with the exception that they can only have a single
    value associated in the set.


    We can create a set by calling the `d3.set()` method. This method takes a single,
    optional argument of an array.


    If an array is passed in as an argument, every value in the array will be returned
    as a member of the set.


    ```

    1 var s = d3.set([1, 2, "foo", "bar"])

    2 // s = [1, 2, "foo", "bar"]

    ```


    # set.has()


    We can test if the set has the value set as an entry by using the `set.has()`
    method. This method takes a single argument of a value. The method will return
    true if and only if the set has an entry for the value string.


    ```

    1 var s = d3.set([1, 2, "foo", "bar"])

    2 s.has(1); // true

    3 s.has("donald_duck"); // false

    ```


    # set.add()


    We can add a value to the set by using the `set.add()` function. It takes a single
    argument of value, the value to append to the set.


    ```

    1 var s = d3.set([1, 2, "foo", "bar"])

    2 s.add(3);

    3 s.has(3); // true

    ```


    # set.remove()


    We can remove a value using the `set.remove()` method. This remove method takes
    a single argument of the value to remove from the set. If the value is in the
    set, it will remove the value (and return true). If the value is *not* in the
    array, then it will do nothing and return false.


    ```

    1 var s = d3.set([1, 2, "foo", "bar"])

    2 s.remove(1); // true

    3 s.remove("space"); // false

    4 s.has(1); // false

    ```


    # set.values()


    Just like in arrays, we can get all of the values in the set. This will return
    an array that includes all of the "unique" values in the set.


    ```

    1 d3.set([1, 2, 1, 3]).values(); // ["1", "2", "3"]

    ```


    # set.forEach()


    We can run a function for every single value in our set as well by using the `set.forEach()`
    function. The `set.forEach(fn)` method takes a single argument of the function
    to run for every element.'
