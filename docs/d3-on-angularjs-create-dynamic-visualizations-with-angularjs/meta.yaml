    \ % 2 is zero, include it in the resulting array.\"\n\n# array.sort()\n\nThe [array.sort](https://developer.mozilla.org/)\
    \ is another useful built in array method. It, as you might expect, sorts the\
    \ elements in an array. It does so in place, meaning, it does not return a *new*\
    \ array but instead returns the original.\n\n```\n1 var collection = ['Victor',\
    \ 'Ari', 'Ian', 'Lewis'];\n2 var sorted = collection.sort();\n3 sorted; // =>\
    \ [ 'Ari', 'Ian', 'Lewis', 'Victor' ]\n4 collection; // => [ 'Ari', 'Ian', 'Lewis',\
