    \ white;\n3 }\n```\n\nD3 的函数式、声明式风格允许我们编写更少的代码。更少的代码使我们能够更快地进行更改，并减轻记忆所有已写代码的认知负荷。当代码更短时，我们能更好地记住它，以后阅读速度也更快。\n\
    \n考虑以下示例，它将 `<svg>` 中的所有 `<circle>` 节点根据数据数组进行水平定位。\n\n> 如果现在觉得困惑，请不用担心。我们将在后面的章节中详细讲解其工作原理。此示例仅为了演示\
