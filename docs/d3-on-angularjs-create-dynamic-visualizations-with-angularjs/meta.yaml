    # # Animation and interaction


    We''ll cover the basics of animation and other interactive concepts in this chapter.
    These techniques lay the foundation for things like live updating, real-time data
    visualizations.


    # ## Transitions


    At the heart of almost all animated data visualizations built with D3 our transitions.
    Transitions make it effortless for us to apply a smooth, animated, transition
    over a collection of selected elements. It''s easier to show how this works so
    lets dive right in with a simple example. Reload the page if the animation wasn''t
    noticed the first time.


    ```

    1 <!DOCTYPE html>

    2 <html>

    3   <body>

    4     <script src="http://d3js.org/d3.v3.min.js" charset="utf-8"></script>

    5     <script>

    6 d3.select(''body'').append(''svg'')

    7   .append(''circle'').attr({r: 10, cx: 100, cy: 100})

    8   .transition().attr(''cx'', 300);

    9     </script>

    10  </body>

    11 </html>

    ```


    Wow, how cool is that? We took a `circle` and animated with the addition of only
    a single line of code! Let''s break down what''s happening here. Selectors have
    an additional method called `transition()` which will return *another selection*,
    specifically, a special "[transition](http://bost.ocks.org/mike/transition/) selection",
    that will gradually update all the DOM element attributes and styles in the first
    selection with their new values, in the second selection. This all occurs over
    a duration of 250 milliseconds (1/4 of a second), the default duration for a transition.


    ![](img/82f49fe8a368850935eb7606dfa7579d_75_0.png)


    As a reminder, the object returned from calling `transition()` on a selector,
    it itself a selector, so we can easily use this same technique for selectors with
    multiple elements. If a we don''t change a particular property or attribute on
    both selections, (the selector before the transition and the one after), that
    property will *not* be transitioned.


    We can adjust how long a transition takes by using the `.duration()` method that
    exists only on transition selectors. Working from the above example, we can adjust
    the animation to take 4 seconds (4000ms), instead of 250ms, by using `transition().duration(4000)`.


    ```

    1 d3.select(''body'').append(''svg'')

    2   .append(''circle'').attr({r: 10, cx: 100, cy: 100})

    3   .transition().duration(4000).attr(''cx'', 300);

    ```'
  - "[PAGE 76]\n\nAnother useful feature of transitions is the ability to specify\
    \ an easing type. Easing lets us fiddle with how the transition should accelerate.\
    \ For example, if we drop a feather 5 feet, it will fall at about a constant rate\
    \ (unless we're on the moon were there's no atmosphere to slow down the feather.)\
    \ This would be a \"linear\" easing type. If, instead, we drop a hammer, it will\
    \ accelerate down, going faster and faster. This would be an \"exp\" easing type.\
    \ By default, D3 uses \"cubic-in-out\" which is how most physical objects move\
    \ in the real world. Most objects don't instantaneously start moving at a constant\
    \ speed. They first speed up, then, when they approach their target, they slow\
    \ down, like a car speeding up after a stop sign and then slowing down as it approaches\
    \ a red light at an intersection. This is the same transition illustrated in the\
    \ above example. Here's an example of how we can specify a different easing type\
    \ with a duration of 4 seconds.\n\n```\nd3.select('body').append('svg')\n  .append('circle').attr({r:\
    \ 10, cx: 100, cy: 100})\n  .transition().duration(4000).ease('bounce').attr('cx',\
    \ 300);\n```\n\n[Here's a visualization](link) of other easing types.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_76_0.png)\n\
    \nNotice how all the transitions above gain speed accept for the last, \"cubic-in-out\"\
    . \"cubic-in-out\" is actually the same as \"cubic\" except it has its easing\
    \ applied equally to both ends (the in and out portions.) By default, all easing\
    \ types are in so just cubic is the same as cubic-in and we can fiddle with the\
    \ easing type by appending either -out or -in-out. Here's an example of the 3\
    \ different poly"
- md: " ## Events\n\nEvents allow our visualizations to be interactive. Using them,\
    \ we specify what should happen when a user performs an action, like clicking,\
    \ or moving the mouse, or pressing the keyboard. HTML on its own has a variety\
    \ of different interactive events we can opt to be notified of using callbacks.\
    \ D3 simply makes it easier to set them up using selections instead of having\
    \ to deal with individual DOM elements directly. We can do all this just using\
    \ the `on()` selection method, passing it the name of the event we want to listen\
    \ for and a callback function which should be called when that event occurs. Lets\
    \ have a look at a simple 'hello world' style event example that compares the\
    \ native HTML way of setting up an event listener and the D3 way.\n\n```\n1 <!DOCTYPE\
    \ html>\n2 <html>\n3     <body>\n4        <script src=\"http://d3js.org/d3.v3.min.js\"\
    \ charset=\"utf-8\"></script>\n5        <select>\n6          <option value=\"\
    hello\">hello</option>\n7          <option value=\"world\">world</option>\n8 \
    \       </select>\n9        <script>\n10 // // the non-D3 way\n11 document.getElementsByTagName('select')[0]\n\
    12    .addEventListener('change', function(){ alert(this.value); });\n13 // the\
    \ D3 way\n14 d3.select('select').on('change', function(){ alert(this.value); });\n\
    15      </script>\n16    </body>\n17 </html>\n```\n\nNotice how the callback gets\
    \ called with the `select` element as the `this` variable. Using `on` instead\
    \ of `addEventListener` might sound like a trivial change but there's more going\
    \ on here than just that. Different event listeners are being applied to all the\
    \ elements in the selection. Just like most other selection methods, our callback\
    \ will get called with the first two arguments set to the clicked elements datum\
    \ and index in the selection, respectively. Event listener will only be setup\
    \ once per element, even if we re-setup the listener. If we copied and pasted\
    \ the non-D3 version, we'd get two alerts.\n\n```\n1 document.getElementsByTagName('select')[0]\n\
    2   .addEventListener('change', function(){ alert(this.value); });\n3 document.getElementsByTagName('select')[0]\n\
    4   .addEventListener('change', function(){ alert(this.value); });\n5 // the second\
    \ event listener is added after the first\n```\n\nIf we did the same with the\
    \ D3 version, we'd get only one.\n\n```\n1 d3.select('select').on('change', function(){\
    \ alert(this.value); });\n2 d3.select('select').on('change', function(){ alert(this.value);\
    \ });\n3 // the second event listener overrides the first\n```\n\nThis is convenient\
    \ since most of the time, we'll want simply re-apply our event listeners for all\
    \ selected elements instead of having to explicitly remove our old listeners.\
    \ If, for some reason, we want to remove all the event listeners for a selection,\
    \ we can call `on()` with null as the second argument.\n\n```\nd3.select('select').on('change',\
    \ function(){ alert(this.value); });\nd3.select('select').on('change', null);\n\
    // nothing is alerted!\n```\n\nSome other common events we'll be interested in\
    \ are the mouse events `click`, `mousedown`, `mousemove`, and `mouseup`. A click\
    \ events are fired when a user presses and then releases the mouse button. It's\
    \ a combination of `mousedown` and `mouseup`. mouse move is fired everytime the\
    \ mouse moves.\n\nPutting together all our knowledge of transitions and events,\
    \ let's build a simple video game. The objective is to avoid moving asteroids\
    \ (`circles`) from colliding with our spaceship (mouse.) We'll start off by defining\
    \ our current level, and the width and height of our game, which will take up\
    \ the entire window.\n\n```\nvar level = 0, width = window.innerWidth, height\
    \ = window.innerHeight;\n```\n\nNow lets create the svg that will hold our game\
    \ objects.\n\n```\nvar svg = d3.select('body').append('svg');\n```\n\nLets add\
    \ some asteroids. 20 sounds like a good number. Lets make the pretty big, with\
    \ a radius of 20\n\n```\nvar circles = svg.selectAll('circle').data(d3.range(20)).enter().append('circle')\n\
    \    .attr('r', 50)\n```\n\nWe'll randomly position all the asteroids across the\
    \ screen at every level and transition all the asteroids as go between levels\
    \ so lets create an update method we can call periodically using `setInterval`.\n\
    \n```\nfunction update(){\n    circles.transition().duration(2000).attr({\n  \
    \      cx: function(){ return Math.random() * width },\n        cy: function(){\
    \ return Math.random() * height } });\n    level++;\n}\n```\n\nSo there's something\
    \ on the screen when the user first visits our game, lets call update() right\
    \ off the bat. Then we'll setup our interval to call `update()` every 2 seconds.\n\
    \n```\nupdate();\nsetInterval(update, 2000);\n```\n\nWhen an asteroid (circle)\
    \ collides with our spaceship (mouse), game over! Alert the user that they lost\
    \ and reset the level counter.\n\n```\ncircles.on('mouseover', function(){\n \
    \   alert('Nice! You made it to level ' + level);\n    level = 0;\n});\n```\n\n\
    And we're done! We just made a video game in 15 lines of JavaScript. Here's what\
    \ the final version looks like.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_79_0.png)\n\
    \n## Asteroids, D3 style\n\n```\n1 <!DOCTYPE html>\n2 <html>\n3   <body>\n4  \
    \   <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n\
    5     <script>\n6 var level = 0, width = window.innerWidth, height = window.innerHeight;\n\
    7 var svg = d3.select('body').append('svg');\n8 var circles = svg.selectAll('circle').data(d3.range(20)).enter()\n\
    9     .append('circle').attr('r', 50)\n10    .on('mouseover', function(){\n11\
    \      alert('Nice! You made it to level ' + level);\n12      level = 0;\n13 \
    \   });\n14 function update(){\n15    circles.transition().duration(2000).attr({\n\
    16      cx: function(){ return Math.random() * width },\n17      cy: function(){\
    \ return Math.random() * height } });\n18    level++;\n19 }\n20 update();\n21\
    \ setInterval(update, 2000);\n22     </script>\n23   </body>\n24 </html>\n```\n\
    \n# Data Parsing and Formatting\n\nThis chapter covers some of the common ways\
    \ to get and clean data for use with D3.\n\n## Getting data into the browser\n\
    \nAll the examples up until this point used hard-coded data values directly in\
    \ our code. This is fine when working with very small, unchanging, data sets but\
    \ quickly becomes unmanageable when the amount of data increases or our data changes\
    \ frequently. We don't want to have to keep copying and pasting data into our\
    \ code. This problem can be solved with a few D3 helper functions that allow us\
    \ to load data in different formats from a separate files, instead of being in\
    \ our code. Specifically, we can use `d3.json()` to load [JSON](JSON) formatted\
    \ data, or `d3.csv()` to load [CSV](CSV) data.\n\nAll we need to give each is\
    \ the name of the file to load, and a callback to be called once the file has\
    \ been loaded.\n\n### Loading CSV data\n\n**episodes.csv**\n\n```\n1 Title, Air\
    \ date, U.S. viewers (in millions)\n2 \"Winter Is Coming\", \"April 17, - 2011\"\
    , 2.22\n3 \"The Kingsroad\", \"April 24, - 2011\",  2.20\n4 \"Lord Snow\", \"\
    May 1, - 2011\", 2.44\n```\n\n[source: http://en.wikipedia.org/wiki/List_of_Game_of_Thrones_episodes](source:\
    \ http://en.wikipedia.org/wiki/List_of_Game_of_Thrones_episodes)\n\n```\n1 d3.csv('episodes.csv',\
    \ function(err, data){\n2   if(err) throw err;\n3   console.log(data[0].Title);\
    \ // => \"Winter is Coming\"\n4   console.log(data[1].Title); // => \"The kingsroad\"\
    \n5   // etc...\n6 });\n```\n\n### Loading JSON data\n\n**episodes.json**\n\n\
    ```\n 1 [\n 2   {\n 3     \"Title\": \"Winter Is Coming\",\n 4     \"Air date\"\
    : \"April 27, - 2011\",\n 5     \"U.S. viewers (in millions)\": 2.22\n 6   },{\n\
    \ 7     \"Title\": \"The Kingsroad\",\n 8     \"Air date\": \"April 24, - 2011\"\
    ,\n 9     \"U.S. viewers (in millions)\": 2.20\n10   },{\n11     \"Title\": \"\
    Lord Snow\",\n12     \"Air date\": \"May 1, - 2011\",\n13     \"U.S. viewers (in\
    \ millions)\": 2.44\n14   }\n15 ]\n```\n\n```\n1 d3.json('episodes.json', function(err,\
    \ data){\n2   if(err) throw err;\n3   console.log(data[0].Title); // => \"Winter\
    \ is Coming\"\n4   console.log(data[1].Title); // => \"The kingsroad\"\n5   //\
    \ etc...\n6 });\n```\n\n## Common Gotcha: Loading data from local file\n\nMost\
    \ modern browsers impose security restrictions that prevent HTML files loaded\
    \ from your computer from making requests for other local file resources. This\
    \ means that if you've just been clicking on HTML files and opening them in your\
    \ browser, those HTML pages won't be able to make requests for our locally stored\
    \ data files. This security restriction prevents normal browser users from mistakenly\
    \ opening a downloaded HTML file and having it snoop other files off of their\
    \ hard drive. To circumvent this restriction, the simplest solution is to run\
    \ a web server using `python -m SimpleHTTPServer` from the command line in the\
    \ directory from which you want to run your server. Then we can access our file.html\
    \ in that directory from localhost:8000/our-file.html in the browser.\n\n## Common\
    \ Gotcha: JSON is a subset of JavaScript\n\nJSON is a subset of JavaScript. This\
    \ means we could copy and paste JSON into a JavaScript program without problems,\
    \ but this does not mean we can copy and paste anything from JavaScript into JSON.\
    \ One key difference is that JSON object keys must be in double quotes. The same\
    \ is true for string values. i.e., { foo : 'bar' } is valid JavaScript but not\
    \ valid JSON. { \"foo\" : \"bar\" } is valid JSON and valid JavaScript. Valid\
    \ JSON cannot contain function or date objects.\n\n## Working with data\n\nOften\
    \ the hardest part of data visualization is just getting the data we want to visualize\
    \ into a meaningful format. Notice how in the above example the dates are formatted\
    \ as strings and contain a - ? We'll have a hard time using those dates in scales\
    \ or graphing them along a time line if we can't work with them as numbers. To\
    \ convert them over to numbers, we can use D3's time formatting helper method,\
    \ `d3.time.parse()`. With it, we can create a new date format object to parse\
    \ our funky dates.\n\n```\n1 var format = d3.time.format('%B %e, - %Y');\n2 format.parse(\"\
    April 27, - 2011\"); // => a new date object\n```\n\nThere's a ton of different\
    \ date formatting tokens you can use. Checkout the full list on the [D3 github\
    \ wiki page](https://github.com/d3/d3/wiki/Date-Formatting).\n\nTo reformat our\
    \ data set so that it contains actual date objects, we can call our formatter\
    \ on each \"Air date\" property of every element in our data array. In this step,\
    \ we'll also create a viewers property instead of viewers (in millions) since\
    \ it's best practice to keep our data in the most common and/or obvious units\
    \ by default.\n\n```\n1 var format = d3.time.format('%B %e, - %Y');\n2 data.forEach(function(datum){\n\
    3   datum['Air date'] = format.parse(datum['Air date']);\n4   // add another property,\
    \ viewers\n5   datum['U.S. Viewers'] = datum['U.S. viewers (in millions)'] * 1000000;\n\
    6   // remove the U.S. viewers (in millions) property\n7   delete datum['U.S.\
    \ viewers (in millions)'];\n8 });\n```"
  mdcn: "\n ## 事件\n\n事件让我们的可视化图表变得可交互。通过事件，我们可以指定当用户执行某个动作时应该发生什么，例如点击、移动鼠标或按下键盘。HTML\
    \ 本身就有多种不同的交互事件，我们可以选择通过回调函数来接收通知。D3 只是让设置这些事件变得更加容易，使用选择集而非直接处理单个 DOM 元素。我们只需使用\
    \ `on()` 选择集方法，传入想要监听的事件名称和事件发生时应该调用的回调函数即可。让我们来看一个简单的\"Hello World\"风格的事件示例，比较原生的\
    \ HTML 设置事件监听器的方式和 D3 的方式。\n\n```\n1 <!DOCTYPE html>\n2 <html>\n3     <body>\n\
    4        <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n\
    5        <select>\n6          <option value=\"hello\">hello</option>\n7      \
    \    <option value=\"world\">world</option>\n8        </select>\n9        <script>\n\
    10 // 非 D3 方式\n11 document.getElementsByTagName('select')[0]\n12    .addEventListener('change',\
    \ function(){ alert(this.value); });\n13 // D3 方式\n14 d3.select('select').on('change',\
    \ function(){ alert(this.value); });\n15      </script>\n16    </body>\n17 </html>\n\
    ```\n\n注意回调函数是如何以 `select` 元素作为 `this` 变量被调用的。使用 `on` 代替 `addEventListener` 听起来可能只是一个微不足道的改变，但这里发生的事情远不止于此。不同的事件监听器会被应用到选择集中的所有元素上。就像大多数其他选择集方法一样，我们的回调函数会以被点击元素的数据和在选择集中的索引作为前两个参数被调用。每个元素只会设置一次事件监听器，即使我们重新设置监听器也是如此。如果我们复制并粘贴非\
    \ D3 版本，我们会得到两个弹窗。\n\n```\n1 document.getElementsByTagName('select')[0]\n2   .addEventListener('change',\
    \ function(){ alert(this.value); });\n3 document.getElementsByTagName('select')[0]\n\
    4   .addEventListener('change', function(){ alert(this.value); });\n5 // 第二个事件监听器在第一个之后添加\n\
    ```\n\n如果我们用 D3 版本做同样的事情，我们只会得到一个弹窗。\n\n```\n1 d3.select('select').on('change',\
    \ function(){ alert(this.value); });\n2 d3.select('select').on('change', function(){\
    \ alert(this.value); });\n3 // 第二个事件监听器覆盖第一个\n```\n\n这很方便，因为大多数时候，我们只想简单地为所有选中的元素重新应用事件监听器，而不必显式地移除旧的监听器。如果出于某种原因，我们想要移除某个选择集的所有事件监听器，我们可以将\
    \ `on()` 的第二个参数设为 null 来调用。\n\n```\nd3.select('select').on('change', function(){\
    \ alert(this.value); });\nd3.select('select').on('change', null);\n// 没有任何弹窗！\n\
    ```\n\n我们还会感兴趣的其他一些常见事件是鼠标事件 `click`、`mousedown`、`mousemove` 和 `mouseup`。点击事件在用户按下然后释放鼠标按钮时触发。它是\
    \ `mousedown` 和 `mouseup` 的组合。鼠标移动事件在鼠标每次移动时都会触发。\n\n综合我们所学的关于过渡和事件的知识，让我们来构建一个简单的视频游戏。目标是避免移动的小行星（`圆形`）与我们的太空飞船（鼠标）相撞。我们首先定义当前关卡，以及游戏的宽度和高度，这将占据整个窗口。\n\
    \n```\nvar level = 0, width = window.innerWidth, height = window.innerHeight;\n\
