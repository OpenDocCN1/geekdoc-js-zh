- md: "With our generator, we can also set an interpolation mode that tells D3 how\
    \ to render the lines between each point.\n\nThere are quite a few interpolation\
    \ modes available to us.\n\nAnd don't forget, generators can be used more than\
    \ once, for multiple elements so if our data changes but still has the same general\
    \ format, we can just re-apply the generator.\n\n## d3.svg.arc\n\nWe can also\
    \ produce an arc or a circle using the `d3.svg.arc()` generator. The four parameters\
    \ that describe an arc are its inner and outer radii, as well as the start and\
    \ end angles (where an angle of zero points up and -ï€, left.)\n\nincreasing inner\
    \ radius. (outer radius fixed)\n\nincreasing outer radius (inner radius fixed)\n\
    \nincreasing start angle (end angle fixed)\n\nincreasing end angle (start angle\
    \ fixed)\n\nincreasing inner radius and end angle\n\nIf we wanted our arc generator\
    \ to always produce the same arc, we could fix each parameter to a constant value\
    \ by calling all of the arc generator accessors by passing each a single number\
    \ value. Our arc is also created at (0,0) so we'll also translate it left and\
    \ down by 200 pixels to we can see the entire arc.\n\n```javascript\nvar arc =\
    \ d3.svg.arc()\n    .innerRadius(100).outerRadius(150)\n    .startAngle(-Math.PI\
    \ / 2).endAngle(Math.PI / 2)\n\nd3.select('body').append('svg')\n        .append('path').attr('d',\
    \ arc).attr('transform', 'translate(200, 200)')\n```\n\nLive version: [http://jsbin.com/uPEfeMaj/3/edit](http://jsbin.com/uPEfeMaj/3/edit)\n\
    \nIn addition, the accessors can be passed functions, instead of number values,\
    \ which will be called for each element of the selectors data. For every data\
    \ item in the selector, D3 will call our accessor and use its result to set that\
    \ parameter for the current arc being generated. Let's create a rainbow to show\
    \ this off.\n\n```html\n<!DOCTYPE HTML>\n<html>\n  <body>\n    <script src=\"\
    http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n    <script>\n\nvar\
    \ rainbow = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];\n\
    var arc = d3.svg.arc()\n  .innerRadius(30)\n  // the outer radius of the rainbow\
    \ is set from the index in the rainbow array\n  .outerRadius(function(d, i){ return\
    \ (rainbow.length - i) * 20 + 30})\n  .startAngle(-Math.PI / 2).endAngle(Math.PI\
    \ / 2);\n\nd3.select('body').append('svg')\n    .selectAll('path').data(rainbow).enter().append('path')\n\
    \    .attr({\n      d: arc,\n      transform: 'translate(200, 200)',\n      fill:\
    \ function(d){ return d }\n    })\n    </script>\n  </body>\n</html>\n```\n\n\
    Live version: [http://jsbin.com/AbUGOZiX/1/edit](http://jsbin.com/AbUGOZiX/1/edit)\n\
    \nHere's an example of a donut chart that uses `d3.layout.pie` that handles converting\
    \ our data to a format we can pass directly to the pie generator. Say we had the\
    \ following data that we wanted to represent as a pie chart.\n\n```javascript\n\
    var data = [21, 32, 35, 64, 83];\n```\n\nWe could convert that to the necessary\
    \ array of start and end angles to be passed to your arc generator by calling\
    \ the `pie()` method on the pie layout.\n\n```javascript\nvar pie = d3.layout.pie();\n\
    var arcData = pie(data);\n```\n\nThen, we'll create an arc generator with fixed\
    \ inner and outer radius values.\n\n```javascript\nvar arc = d3.svg.arc().innerRadius(100).outerRadius(200);\n\
    ```\n\nWe don't need to specify the `startAngle` and `endAngle` accessors because\
    \ those, by default, access a property by the same name on their datum element\
    \ so there's no need to add this snippet.\n\n```javascript\n// default `startAngle`\
    \ accessor\narc.startAngle(function(d){\n    return d.startAngle;\n});\n// default\
    \ `endAngle` accessor\narc.endAngle(function(d){\n    return d.endAngle;\n});\n\
    ```\n\nNow, the last step is to bind our `arcData` to newly created path elements\
    \ in our selector.\n\n```javascript\nvar path = svg.append('path').data(arcData)\n\
    \  .enter().append('path').attr('d', pie);\n```\n\nWe’ll need to translate all\
    \ the paths a bit so they’re not all drawn at (0,0) in the upper left of the screen.\
    \ Then, after adding a some color using a color scale (which well see more of\
    \ in a later chapter), the result should look like the following:\n\nLive version:\
    \ http://jsbin.com/axICUjaH/1/edit\n\n## d3.svg.area\n\nThe area generator makes\
    \ it easy to create line plots where the area bellow the plot line is filled in.\
    \ We need to give the generator’s accessors either functions or number values\
    \ for y0, y1 and x. The y* accessors tell the generator how lower or how high\
    \ the area shape should extend. x should be the successive x values along the\
    \ plot just like with d3.svg.line().\n\n```html\n<!DOCTYPE HTML>\n<html>\n  <head>\n\
    \    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n\
    \    <style>\n      path { stroke: white; stroke-width: 2; fill: steelblue;}\n\
    \      .plot{ fill: none; stroke: #aec7e8; stroke-width: 2;}\n      circle{ fill:\
    \ steelblue; stroke: white;}\n    </style>\n  </head>\n  <body>\n    <script>\n\
    \nvar svg = d3.select('body').append('svg')\n// construct and configure the are\
    \ generator\nvar area = d3.svg.area()\n  .y0(100) // set the lower y bound of\
    \ the area shape\n  .y1(function(d){ return d.y })\n  .x(function(d, i){ return\
    \ d.x })\n\n// generator some random data\nvar data = d3.range(100).map(function(){\
    \ return Math.random() * 30 + 0 })\n  .map(function(d, i){ return { x: i * 10,\
    \ y: d }})\n\n// draw the area shape under the line of the plot\nsvg.append('path').datum(data).attr('d',\
    \ area)\n\n// give the area shape a border along its top edge\nvar line = d3.svg.line()\n\
    \  .x(function(d){ return d.x})\n  .y(function(d){ return d.y })\nsvg.append('path').datum(data).attr('d',\
    \ line).attr('class', 'plot')\n\n// the circles at all the points\nsvg.selectAll('circle').data(data).enter().append('circle')\n\
    \  .attr('cx', function(d){ return d.x })\n  .attr('cy', function(d){ return d.y\
    \ })\n  .attr('r', 3)\n\n    </script>\n  </body>\n</html>\n```\n\n## d3.svg.chord\n\
    \nThe svg chord generator helps in creating connected arc segments which is the\
    \ essential component in chord diagrams. Every other component in a chord diagram\
    \ can be created using other svg generators. Two arc segments make up one arc\
    \ connection. The first arc segment is called the source, the second, the target.\
    \ Each arc segment is described by a radius, a startAngle and an endAngle. Conveniently,\
    \ d3.layout.chord() can be used to take relational information in the form of\
    \ a matrix and produce the necessary default chord layout that d3.svg.chord expects.\
    \ For example, here's an arbitrary relational data set. Every cell describes the\
    \ relationship among of two items (in our example, since Betty might like Alex\
    \ more than Alex likes Betty, the connections have different magnitudes depending\
    \ on their direction.\n\n```javascript\n// each cell value represents a node->node\
    \ relationship (column->row)\n//      A               B               C      \
    \         D\nvar matrix = [\n    [ 0 , 1.3 , 2 , 1 ],\n    [ 1.9 , 0 , 1 , 2.1\
    \ ],\n    [ 2 , 2 , 3.2 , 1.8 ],\n    [ 2.7 , 0 , 1 , 0 ]\n]; // 'C' really likes\
    \ herself\n```\n\nPassing this data to `d3.layout.chord().matrix(matrix).chord()`\
    \ gives us back data that looks like this:\n\n```javascript\n[\n    {\n      \
    \  source:{ startAngle:1.2280, endAngle:1.7707, value:1.9 },\n        target:{\
    \ startAngle:0, endAngle:0.3712, value:1.3 }\n    },\n    {\n        source:{\
    \ startAngle:0.3712, endAngle:0.9424, value:2 },\n        target:{ startAngle:2.6560,\
    \ endAngle:3.2272, value: 2 }\n    },\n    // etc...\n]\n```\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style>\n        path { stroke: white; stroke-width: 2;\
    \ fill: steelblue; }\n        .plot { fill: none; stroke: #aec7e8; stroke-width:\
    \ 2; }\n        circle { fill: steelblue; stroke: white; }\n    </style>\n</head>\n\
    <body>\n    <script>\n        var width = window.innerWidth;\n        var height\
    \ = window.innerHeight;\n\n        var svg = d3.select('body').append('svg');\n\
    \        var matrix = [\n            // each cell value represents a single row-to-column\
    \ relationship\n            [ 0 , 1.3 , 2 , 1 ],\n            [ 1.9 , 0 , 1 ,\
    \ 2.1 ],\n            [ 2 , 2 , 3.2 , 1.8 ],\n            [ 2.7 , 0 , 1 , 0 ]\n\
    \        ];\n\n        var chord = d3.layout.chord().matrix(matrix);\n       \
    \ var innerRadius = Math.min(width, height) * .41;\n        var outerRadius =\
    \ innerRadius * 1.1;\n\n        var fill = d3.scale.ordinal(\n```"
  mdcn: "\n通过我们的生成器，我们还可以设置插值模式（interpolation mode），用以告知 D3 如何渲染各点之间的线条。\n\n我们有相当多可用的插值模式。\n\
    \n另外不要忘记，生成器可以被多次使用，用于多个元素。因此，如果我们的数据发生了变化但仍保持相同的通用格式，我们只需重新应用该生成器即可。\n\n## d3.svg.arc\n\
    \n我们还可以使用 `d3.svg.arc()` 生成器来创建弧线或圆。描述一条弧线的四个参数是：内半径、外半径，以及起始角度和结束角度（其中 0 度指向正上方，负值向左）。\n\
    \n增加内半径（外半径固定）\n\n增加外半径（内半径固定）\n\n增加起始角度（结束角度固定）\n\n增加结束角度（起始角度固定）\n\n同时增加内半径和结束角度\n\
    \n如果我们希望弧线生成器始终产生相同的弧线，可以通过为所有弧线生成器访问器（accessors）传递单个数值，将每个参数固定为常数。由于我们的弧线是在 (0,0)\
    \ 处创建的，因此我们需要将其向左和向下平移 200 像素，以便能看到完整的弧线。\n\n```javascript\nvar arc = d3.svg.arc()\n\
    \    .innerRadius(100).outerRadius(150)\n    .startAngle(-Math.PI / 2).endAngle(Math.PI\
    \ / 2)\n\nd3.select('body').append('svg')\n        .append('path').attr('d', arc).attr('transform',\
