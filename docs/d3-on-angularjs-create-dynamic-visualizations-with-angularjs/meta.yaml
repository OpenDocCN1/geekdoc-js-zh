    \n## 比例尺（Scales）\n\n当我们构建数据集并开始尝试将其应用到可视化画布时，我们需要设置比例尺，以便我们的数据能够很好地呈现在页面上。\n\n\
    我们处理的任何数据都不太可能直接对应到可视化中的像素坐标。我们需要对数据进行缩放，使我们的数据能够反映与像素数据之间的关系。\n\n为此，D3 提供了一个便捷的帮助对象，我们将使用它来创建数据与相对像素坐标之间的缩放关系。\n\
    \n当我们谈论比例尺时，我们指的是可以用作映射的相对数据点，将数据相对于其他点进行映射。\n\n## 为什么要用比例尺\n\n例如，如果我们想用柱状图绘制\
    \ AMC 电视剧《*行尸走肉*》（*The Walking Dead*）第三季每集的[观众人数](http://)呢？\n\n每个柱状图会延伸到*远远*超出可见屏幕空间的范围。我们根本没有\
    \ 1000 万个像素，每个像素代表一个观众！\n\n一种解决方案是逐步对每个数据点应用缩放因子，使最大点不超过图表的顶部。\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style> rect { stroke: red; stroke-width: 1; fill: black;\
    \ } </style>\n  </head>\n  <body>\n    <script>\n     // 每集观众人数\n     var data\
    \ = [ 10870000, 9550000, 10510000,\n                  9270000, 10370000, 9210000,\n\
    \                  10430000, 10480000, 12260000,\n                  11050000,\
    \ 11010000, 11300000,\n                  11460000, 10840000, 10990000,\n     \
    \             12420000 ];\n\n     // 缩放数据\n     var height = 200;\n     // 收视率最高的一集\n\
    \     var max = d3.max(data);\n     // 我们的缩放因子\n     var scale = height / max;\n\
    \     var scaled_data =\n       data.map(function(d){\n         return d * scale;\n\
    \       });\n\n     var svg = d3.select('body')\n                 .append('svg')\n\
    \                 .selectAll('rect')\n                 .data(scaled_data)\n  \
    \               // 添加所有 <rect> 标签\n       .enter().append('rect')\n       .attr({\n\
    \         width: 50,\n         height: function(d){ return d },\n         x: function(d,\
    \ i){ return i * 50 },\n         // y 像素向下计数\n         y: function(d){ return\
    \ height - d }\n       });\n   </script>\n  </body>\n</html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_65_0.png)\n\
    \n还不错，但我们必须考虑很多额外的手动工作。现在，我们不得不担心这个额外的数组 `scaled_data`。\n\n我们还用这个 `scaled_data`\
    \ 数组而不是原始数据来绑定数据，这使得为可视化添加功能变得困难，比如为每个柱状图添加工具提示。\n\n我们的数据也挤在顶部，所以不太容易看出差异。如果数据从最低集到最高集进行绘制，以强调这些差异，这些差异会更加明显。\n\
    \n```\n// 缩放数据\nvar height = 200;\nvar min = d3.min(data);\nvar range = d3.max(data)\
    \ - min;\nvar scale = height / range;\nvar scaled_data = data.map(function(d){\n\
    \   return (d - min) * scale;\n});\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_65_1.png)\n\
    \n看起来好多了，但代码比需要的多，而且有覆盖原始数据的副作用。\n\nD3 的线性比例尺生成器通过为我们提供一个可以随时调用的函数来消除这两个问题，该函数可以将输入范围（在我们的例子中是观众人数）转换为输出域（通常是像素）。比例尺本质上允许我们描述数据与像素之间的关系。\n\
    \n这使我们能够清晰地描述可能的输入数据值范围，并将可能的输出域限制为将数据转换为新域。\n\n## 创建比例尺\n\n我们可以使用 `d3.scale`\
    \ 对象提供的函数轻松创建不同类型的比例尺。要创建线性比例尺，我们将使用 `d3.scale.linear()` 函数：\n\n```\nvar scale\
    \ = d3.scale.linear();\n```\n\n这个比例尺虽然相对无用，但会以 1:1 的比例将输入值映射到输出值。也就是说，用 2 调用它，我们会得到输出\
    \ 2。\n\n我们实际上还没有在这个比例尺对象上应用任何域或范围，所以它只假设 1:1。\n\n## 设置输入域\n\n我们可以使用 `.domain()`\
    \ 函数来设置输入域。\n\n```\nvar scale = d3.scale.linear()\n  .domain([0, 100]);\n```\n\
    \n这将设置输入域从 0 开始到 100。这使我们的域的最小值为 0，最大值缩放到 100。\n\n> **注意：** 如果我们不传递数字到数组中，这些值将被强制转换为数字。例如，这发生在\
    \ Date 对象上（尽管 D3 确实有一个 `d3.time.scale` 对象，我们可以用于日期，这通常更方便）。\n\n通常，我们希望输入域与数据集匹配。与其手动设置域值，更常见的是，我们将使用数据集的最小值和最大值来设置这些值。\n\
    \n我们可以使用 `d3.min()` 和 `d3.max()` 函数，或者使用 `d3.extent()` 函数来实现这一点。\n\n```\nvar color\
