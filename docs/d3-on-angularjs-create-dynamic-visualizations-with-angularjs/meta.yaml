    # Development environment


    In order to write any applications using AngularJS or D3, we first need to have
    a comfortable development environment. Throughout this book, we’ll be spending
    most of our time in two places: our text editor and our browser. We recommend
    you download the Google Chrome browser, as it provides a great environment to
    develop in with its convenient and built-in developer tools suite. It’s also the
