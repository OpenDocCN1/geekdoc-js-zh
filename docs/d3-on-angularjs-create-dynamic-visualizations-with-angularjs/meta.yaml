  md: "# SVG group\n\nThe `<g>` tag is an easy way to group SVG elements. Any transformations\
    \ (positioning, scaling, rotating) that are applied to the group element will\
    \ also be applied to each of the child elements.\n\nUsing groups, we could, for\
    \ example, create a collection of SVG elements that draw a car using circles for\
    \ wheels, and rectangles for axles. If we then wanted to rotate the car, we could\
    \ simply apply the transformation to the `<g>` element containing all the components.\n\
    \n# SVG style\n\nStyling SVG elements is almost exactly the same as styling HTML\
    \ elements. We can still use CSS with `id` and `class` attributes to connect our\
    \ CSS with our SVG elements or simply apply the style directly using the `style`\
    \ attribute.\n\nThe only difference is that a large number of the styles differ\
    \ from what we except from experience with HTML.\n\nTake for example the HTML\
    \ `background-color: orange;` style. The closest equivalent for an SVG element\
    \ is `fill: orange;`. Similarly, what we expect as of `border-color: blue` equivalent\
    \ in SVG is `stroke: blue;` or `border-width: 10px;` and `stroke-width: 10;` This\
    \ is an important detail and a common gotcha when working with SVG coming from\
    \ an HTML background.\n\n```\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <style>\n\
    \      svg path {\n        stroke: red;\n        stroke-width: 30px;\n       \
    \ fill: white;\n      }\n      svg text {\n        font-size: 30px;\n        font-family:\
    \ sans-serif;\n        fill:red;  /* not `color` or `font-color` */\n      }\n\
    \    </style>\n  </head>\n  <body>\n    <svg>\n      <path d=\"M 30 20 L 140 200\
    \ L 240 20 z\"></path>\n      <text x=\"95\" y=\"80\">YIELD</text>\n    </svg>\n\
    \  </body>\n</html>\n```"
