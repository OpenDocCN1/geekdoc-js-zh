  - '[PAGE 6]


    # # Introducing D3. A simple example


    In this chapter, we''ll go over what D3 is and what makes it such a powerful tool
    for data visualization. We''ll also introduce a simple ''Hello World'' style example
    that shows how to get quickly get setup and running with D3.


    # ## What is it?


    D3 (or Data-Driven Documents) is a library written by [Mike Bostock](http://bost.ocks.org/mike/)
    for “manipulating documents based on data.” This means D3’s primary job is to
    take data and produce structured documents such as HTML or SVG with respect to
    data. Unlike most visualization libraries, D3 is not a ready-made collection of
    common graphs and widgets. It’s common to use D3 to make common graphs, like bar
    charts and pie charts, but the real power is in its flexibility and fine grain
    control over the final result.


    D3 works well with other established web technologies like CSS and SVG because
    it doesn''t attempt to abstract away the DOM, like many other graphing libraries.
    This also means D3 will continue to be useful as browsers incorporate new features.


    If we''re just looking for a particular graph type, say, a bar chart, and don''t
    care how exactly it ends up looking, D3 might not be the right library for the
    job. Several other ready-made libraries exist for creating simple, cookie-cutter
    charts, such as [HighCharts](http://www.highcharts.com/) or [Chart.js](http://www.chartjs.org/)
    or [Google Charts API](https://developers.google.com/chart/). If, on the other
    hand, we have strong requirements for how our visualization should look and function,
    D3 is a great choice.


    To quickly jump into a real world example of this, take the following interactive
    visualization produced by KQED''s the Lowdown blog. It doesn''t fall into a single,
    chart category and the different chart components need to communicate with each
    other, updating dynamically.'
- md: " ![Interactive visualization showing California reservoir data with a map,\
    \ timeline, and line chart showing Lake Shasta data from 2010-2014]\n\n[Live version\
    \ of the above interactive visualization](link)\n\nIt was created using a combination\
    \ of Angular and D3. ([source code is available here](link)).\n\nTo illustrate\
    \ this point, we'll also walk through a little thought experiment. Imagine we're\
    \ working with a ready-made visualization library. Typical visualization libraries\
    \ might have a `BarChart` class to create a new bar chart which works fine until\
    \ we want to do something the library didn't allow to be configured. For example,\
    \ say we wanted to change the background color of the legend in our bar chart.\
    \ We could take their code and try and modify it to add our needed feature, but\
    \ that can quickly get very messy and cumbersome. We might have to create a new\
    \ subclass of the `BarChart` or it could be that the original `BarChart` class\
    \ wasn't written in a way to be easily extensible. Alternatively, we can use D3\
    \ to quickly, and only in a few lines, create our own custom bar chart where we\
    \ can do whatever we'd like to our legend or any other component.\n\nAs another\
    \ example, say we wanted to create a new type of visualization that doesn't even\
    \ exist yet (or at least not yet in JavaScript.) This is a perfect example of\
    \ when we would want to use D3. In this sense, D3 is a sort of \"meta-library\"\
    ; the kind of library one would want to have if they were creating a library of\
    \ new data visualizations. It does this by using a new way of thinking about data\
    \ visualizations (but more on that, later.) In short, if we're going to be creating\
    \ data visualizations, we'll typically be writing an order of magnitude less code\
    \ if we use D3 than without.\n\nWhen it comes to configuring the look and feel\
    \ our visualization, we can very easily utilize our existing knowledge of CSS,\
    \ so long as we use classes when creating the components that make up our bar\
    \ chart. Continuing our thought experiment, something along these lines would\
    \ be enough to change the background color of our legend.\n\n```\n1 .graph .legend{\n\
    2   color: white;\n3 }\n```\n\nD3's functional, declarative style permits us to\
    \ write less code. Less code allows us to make changes faster and reduces the\
    \ cognitive load required to remember all the code we've written. When code is\
    \ shorter, we can remember it better and read it faster, later.\n\nConsider the\
    \ following example that changes all `<circle>` nodes in an `<svg>` to be positioned\
    \ horizontally according to the data array.\n\n> Don't worry if this is confusing\
    \ right now. We'll walk through how this works in later chapters. This sample\
    \ is only to demonstrate D3's brevity.\n\nUsing straight JavaScript, we'll need\
    \ to select the `<svg>` element and select all of the `<circle>` elements (assuming\
    \ they are on the DOM already) and modify their cx attribute, like so:\n\n```\n\
    1 var data = [ 10, 20, 30, 40];\n2 var svg = document\n3   .getElementsByTagName('svg')\n\
    4   .item(0);\n5 var circles = svg.getElementsByTagName('circle');\n6 for(var\
    \ i = 0; i < circles.length; i++){\n7   var circle = circles.item(i);\n8   circle.setAttribute('cx',\
    \ data[i]);\n9 }\n```\n\nUsing D3 allows us to accomplish the same using less\
    \ code:\n\n```\n1 d3.select('svg').selectAll('circle')\n2   .data([10, 20, 30,\
    \ 40])\n3   .attr('cx', function(d){ return d; });\n```\n\n## 'Hello World' D3\
    \ style\n\nTo dive right in, below is a simple 'Hello World' style D3 example\
    \ which simply appends an `<h1>` with the text Hello World! to the `<body>` using\
    \ D3.\n\n```\n1 <!DOCTYPE html>\n2 <html>\n3   <head>\n4     <script src=\"http://d3js.org/d3.v3.min.js\"\
    \ charset=\"utf-8\"></script>\n5   </head>\n6   <body>\n7-blog     <script>\n\
    8       d3.select('body')\n9           .append('h1')\n10          .text('Hello\
    \ World!');\n11    </script>\n12  </body>\n13 </html>\n```\n\nLive version:zione\
    \ http://jsbin.com/uhEmuJI/1/edit\n\n![](img/82f49fe8a368850935eb7606dfa7579d_9_0.png)\n\
    \nWe just created our first D3 app.\n\nAlthough this example does not do very\
    \ much, it highlights the structure we'll build with our D3 apps; the foundation\
    \ for most of the examples that follow.\n\nThe resulting HTML after our D3 code\
    \ has executed looks like this.\n\n```\n1 <html>\n2   <head>...</head>\n3   <body>\n\
    4     <script>...</script>\n5     <h1>Hello World!</h1>\n6   </body>\n7 </html>\n\
    ```\n\nWe can inspect the source of the resulting HTML using the fantastic Chrome\
    \ developer tools Elements tab. We'll use these tools throughout the book to deeply\
    \ inspect our running code.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_9_1.png)\n\
    \n## Common Gotcha\n\n![](img/82f49fe8a368850935eb7606dfa7579d_9_2.png)\n\nWhen\
    \ not using Angular or jQuery, make sure to put any code that depends on the <body>\
    \ inside the <body> and *not* before it (ie., in the <head>.) If the code executes\
    \ before the body element, then it will simply fail as the <body> will not have\
    \ been created yet.\n\n## Selections And Data Binding\n\nThis chapter covers D3's\
    \ \"selections\" and how they can be combined with data to expressively create\
    \ and manipulate HTML documents. We'll use selectors all throughout our D3 code\
    \ so the content in this chapter is fundamental to using D3.\n\n> Those readers\
    \ familiar with **jQuery** are strongly encouraged *not* to skip this chapter.\
    \ Even though D3's selectors are similar, they deviate in a few key areas.\n\n\
    ## Selections\n\nSelectors are objects that represent collections (or sets) of\
    \ DOM elements. This allows us to modify properties on the selector and have those\
    \ changes applied to all the DOM elements in it. This is an extremely powerful\
    \ idea! It's now no longer our job to be explicit in *how* the program should\
    \ go about changing all the elements. Instead, we only need to specify which elements\
    \ should change and their associated changes. Say we wanted to change the background\
    \ of a bunch of `<div>` tags. Instead of having an array of DOM elements and modifying\
    \ each one directly:\n\n```\n1 // `divs` is just an array of DOM elements\n2 for(var\
    \ i = 0; i < divs.length; i++){\n3     divs[i].style.backgroundColor = 'blue';\n\
    4 }\n```\n\nLive version [http://jsbin.com/UdiDiQu/2/edit](http://jsbin.com/UdiDiQu/2/edit)\n\
    \nWe can apply modifications to each `<div>` element using the selector.\n\n```\n\
    1 // `divs` is a selector object\n2 divs.style('background-color', 'blue');\n\
    ```\n\nLive version: [http://jsbin.com/ADeReRo/1/edit](http://jsbin.com/ADeReRo/1/edit)\n\
    \nThe last two example snippets perform exactly the same task. The latter example\
    \ also introduced our first selector method, `style`, which changes the background\
    \ color of all the divs in the selection to blue. We'll talk about this method\
    \ more below. For now, just understand that selectors give us a vocabulary for\
    \ talking about groups of DOM elements and that their methods apply to each containing\
    \ DOM element within the selector.\n\nSo how do we create new selectors? Fortunately,\
    \ selectors in D3 follow the same convention used in CSS. (This should also feel\
    \ very familiar if you have ever used jQuery.) In the same way a CSS rule applies\
    \ to a set of DOM elements,-animate we can collect DOM elements to put in our\
    \ selector using the same rules. Here's an example of a snippet of CSS which applies\
    \ to all `<div>` tags that have the class 'foo':\n\n```\ndiv.foo{\n  /* CSS applied\
    \ to all <div>'s of class \"foo\" */\n}\n```\n\nWith selectors, how we specify\
    \ which elements we want to select is exactly the same. We can still just use\
    \ div.foo by passing it to d3.selectAll. The result, is a new selector object.\n\
    \n```\nvar fooDivs = d3.selectAll('div.foo');\n```\n\nThe selector object fooDivs\
    \ now contains all the divs on the page that have class foo. It's helpful to think\
    \ about the d3.selectAll searching the entire DOM for all the elements that match\
    \ the selector \"div.foo\". As a refresher, here's a few CSS rules and their associated\
    \ meaning.\n\n| CSS rule | Meaning |\n|----------|---------|\n| .foo | select\
    \ every DOM element that has class foo |\n| #foo | select every DOM element that\
    \ has id foo |\n| div.foo | select all the <div> tags that have class foo |\n\
    | div#foo | select all the <div> tags that have id foo |\n| div .foo | select\
    \ every DOM element that has class foo that's inside a <div> tag |\n| div #foo\
    \ | select every DOM element that has id foo that's inside a <div> tag |\n| div\
    \ p .foo | select every DOM element that has class foo that's inside @import<p>\
    \ tag that's inside a <div> tag |\n\nUnlike CSS specified in stylesheets, a selector\
    \ object only contains the elements that matched the selection rule when the selection\
    \ was first created. In the example above, if new <div> tags were added to the\
    \ DOM with class foo they would not be automatically added to the selector.\n\n\
    ## Selector methods\n\nThe methods on selectors apply to all its containing DOM\
    \ elements, minus a few exceptions like the selector size() method which returns\
    \ the number of elements in the selector.\n\n### style\n\nTake a look at the following\
    \ example that changes the background color of every <div> on the page to blue\
    \ using the style() selector method:\n\n```\n// change all of the divs to have\
    \ a background color of blue\nd3.selectAll('div')\n  .style('background-color',\
    \ 'blue');\n```\n\nIf the code in our <body> tag was the following before running\
    \ the code.\n\n```\n<body>\n  <div>Hello</div>\n  <div>World</div>\n  <div>!</div>\n\
    </body>\n```"
  mdcn: "\n ![交互式可视化图表，展示加利福尼亚州水库数据，包含地图、时间轴以及 2010-2014 年 Lake Shasta 的折线图]\n\n[上述交互式可视化图表的实时版本](link)\n\
    \n它是使用 Angular 和 D3 结合创建的。（[源代码可以在这里找到](link)）。\n\n为了阐明这一点，我们来做一个简单的思想实验。想象一下我们正在使用一个现成的可视化库。典型的可视化库可能会有一个\
