    \ `BarChart` 的一个新子类，或者原有的 `BarChart` 类在编写时就不是为了易于扩展而设计的。或者，我们可以使用 D3，仅用几行代码快速创建我们自己的自定义柱状图，在那里我们可以对图例或任何其他组件进行任何我们想要的修改。\n\
