    \ If this is specified, then it can return a different type, such as a d3.map,\
    \ rather than a simple object.\n\n```\nvar data = d3.nest()\n    .key(function(d)\
    \ { return d.continent })\n    .sortKeys(d3.ascending)\n    .rollup(function(d)\
    \ {\n        return {\n            area: d3.sum(d, function(g) {\n           \
    \     return +g.areaInSqKm;\n            })\n        }\n    })\n    .map(raw_country_data);\n\
    \n// {\n//  AS: { area: 112680 },\n//  EU: { area: 29216 },\n//  NA: { area: 545\
    \ }\n// }\n```\n\n## nest.entries\n\nAs we've done in the above examples, we can\
    \ apply data to our nest using the `nest.entries(arr)` function. This simply takes\
    \ a single array as its input to pull data for the nest.\n\nThe `entries()` function\
    \ runs on all levels of the hierarchy.\n\n```\nvar data = d3.nest()\n    .key(function(d)\
    \ { return d.continent })\n    .sortKeys(d3.ascending)\n    .entries(raw_country_data);\n\
    ```\n\n## Applying our knowledge\n\nWe'll combine all we've learned so far to\
    \ recreate the iconic album cover of Unknown Pleasures by Joy Division using just\
    \ `d3.range`, `array.map` and the line generator `d3.svg.line()`.\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style>\n      /* make paths 2px wide and white, and give\
    \ them a black fill. */\n      path { stroke: white; stroke-width: 2; fill: black;\
    \ }\n      /* make the svg and body black */\n      body, svg { background-color:\
    \ black; }\n    </style>\n  </head>\n  <body>\n    <script>\nvar svg = d3.select('body').append('svg');\n\
    // generate random data that squiggles a lot in the middle\nvar data = d3.range(50,\
    \ 650, 10).map(function(y_offset){\n  // generate a line of the form [[6,7],[22,34],...]\n\
    \  return d3.range(100, 700, 10).map(function(d){\n    var y = d;\n    if(y <\
    \ 300 || y > 500) y = 50; else y = 500;\n    return [d, y_offset - Math.random()\
    \ * Math.random() * y / 10];\n  });\n});\n// create our line generator\nvar line\
    \ = d3.svg.line()\n  .x(function(d) { return d[0]; })\n  .y(function(d) { return\
    \ d[1]; })\n  .interpolate(\"basis\");\n// create several path elements using\
    \ our line generator and squiggle data\nsvg.selectAll('path').data(data).enter()\n\
    \  .append('path').attr('d', line);\n    </script>\n  </body>\n</html>\n```\n\n\
    ![](img/82f49fe8a368850935eb7606dfa7579d_63_0.png)\n\n## Scales\n\nAs we build\
    \ our datasets and start to try to apply them to our visual canvas, we’ll need\
    \ to set up scales so that our data can sit nicely on our page.\n\nIt’s very unlikely\
    \ that any of the data that we’ll work with will ever translate to our pixel coordinates\
    \ in our visualizations. We’ll want to scale our data so that our data reflects\
    \ the relationships we have to our pixel data.\n\nFor this purpose, D3 includes\
    \ a convenient helper object that we’ll use to create a scaled relationship between\
    \ our data and the relative pixel coordinates to represent that data.\n\nWhen\
    \ we talk about scales, we’re talking about relative data points that we can use\
    \ to map to data relative to other points.\n\n## Why scales\n\nFor instance, what\
    \ if wanted to plot [the number of viewers](http://) for each episode of the third\
    \ season of the AMC television show, *The Walking Dead* with a bar chart?\n\n\
    Each bar chart would not stop until it was *way* outside of the visible screen\
    \ space. We just don't have 10 million pixels, one to represent each viewer!\n\
    \nOne solution would be to step through and apply a scaling factor to each data\
    \ point so that the maximum point wouldn't go past the top of our chart.\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\"\
    \ charset=\"utf-8\"></script>\n    <style> rect { stroke: red; stroke-width: 1;\
    \ fill: black; } </style>\n  </head>\n  <body>\n    <script>\n     // viewers\
    \ for each episode\n     var data = [ 10870000, 9550000, 10510000,\n         \
    \         9270000, 10370000, 9210000,\n                  10430000, 10480000, 12260000,\n\
    \                  11050000, 11010000, 11300000,\n                  11460000,\
    \ 10840000, 10990000,\n                  12420000 ];\n\n     // scaling data\n\
    \     var height = 200;\n     // the episode with the most views\n     var max\
    \ = d3.max(data);\n     // Our scale factor\n     var scale = height / max;\n\
    \     var scaled_data =\n       data.map(function(d){\n         return d * scale;\n\
    \       });\n\n     var svg = d3.select('body')\n                 .append('svg')\n\
    \                 .selectAll('rect')\n                 .data(scaled_data)\n  \
    \               // add all the <rect> tags\n       .enter().append('rect')\n \
    \      .attr({\n         width: 50,\n         height: function(d){ return d },\n\
    \         x: function(d, i){ return i * 50 },\n         // y pixels count down\n\
    \         y: function(d){ return height - d }\n       });\n   </script>\n  </body>\n\
    </html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_65_0.png)\n\nNot bad,\
    \ but we have to take into account a lot of extra manual work. Now, we have to\
    \ worry about this extra array `scaled_data`.\n\nWe also joined our data with\
    \ this `scaled_data` array instead of the original, which makes it difficult to\
    \ add features to the visualization, like adding tool-tips to each bar chart.\n\
    \nOur data is also bunched up at the top so it's not easy to see the differences.\
    \ These differences would be more apparent if the data was plotted from the minimum\
    \ episode to the highest, to emphasize these differences.\n\n```\n// scaling data\n\
    var height = 200;\nvar min = d3.min(data);\nvar range = d3.max(data) - min;\n\
    var scale = height / range;\nvar scaled_data = data.map(function(d){\n   return\
    \ (d - min) * scale;\n});\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_65_1.png)\n\
    \nThat looks a lot better, but took more code than it needed and has the side\
    \ effect of overriding our original data.\n\nD3's linear scale generator eliminates\
    \ both these corners by giving us a function we can call anytime we want to convert\
    \ an input range (viewers in our case) to an output domain (most often, pixels.)\
    \ Scales, essentially allow us to describe the relationship between our data and\
    \ pixels.\n\nThis allows us to be expressive about the range of possible input\
    \ data values and limit the possible output domain to translate the data into\
    \ a new domain.\n\n## Creating a scale\n\nWe can easily create a scale of different\
    \ types by using functions given to us by the `d3.scale` object. To create a linear\
    \ scale, we'll use the `d3.scale.linear()` function:\n\n```\nvar scale = d3.scale.linear();\n\
    ```\n\nThis scale, although relatively useless will map input values to output\
    \ values at a 1:1 dimension. That is, calling it with 2, we'll get an output of\
    \ 2.\n\nWe have not actually applied any domains or ranges on this scale object,\
    \ so it only assumes 1:1.\n\n## Setting input domain\n\nWe can set an input domain\
    \ by using the `.domain()` function.\n\n```\nvar scale = d3.scale.linear()\n \
    \ .domain([0, 100]);\n```\n\nThis will set the input domain to start from 0 and\
    \ go to 100. This makes the minimum number of our domain be at 0 and our max to\
    \ scale to 100.\n\n> **Note:** If we don't pass numbers into the array, then the\
    \ values will be coerced into numbers. For instance, this happens with Date objects\
    \ (although D3 does have a `d3.time.scale` object we can use for dates which is\
    \ often more convenient).\n\nOften times, we'll want the input domain to match\
    \ our dataset. Rather than set the domain values manually, more often than not,\
    \ we'll set these using the min and max of our dataset.\n\nWe can do this using\
    \ the `d3.min()` and `d3.max()` functions or by using the `d3.extent()` function.\n\
    \n```\nvar color = d3.scale.linear()\n  // using straight-forward min and\n  //\
    \ max with two functions\n  .domain([d3.min(data), d3.max(data)])\n  // OR we\
    \ can use d3.extent() function:\n  .domain(d3.extent(data));\n```\n\n## Setting\
    \ output range\n\nWe can set the output *range* by using the `.range([values])`\
    \ function:\n\n```\nvar scale = d3.scale.linear()\n```"
