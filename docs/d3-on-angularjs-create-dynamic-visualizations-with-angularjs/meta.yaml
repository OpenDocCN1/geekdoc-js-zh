    # insane clown triangle


    The commands that are passed to the d are described using [turtle graphics](https://example.com)
    style commands. Think of these commands as how you would tell someone to draw
    a picture blindfolded, issuing commands such as lift pen off paper, put pen on
    paper, move down, move up and to the left, etc. the commands we pass to d are
    expressed in the same imperative way. The path d attribute versions are:


    +   - **M** for **move to**

    - **L** for line to

    - **z** which stands for close path


    Lets break down the commands in the previous example in more detail:


    ```

    1 M 100 50  - move to position (x=100, y=50),

    2           - without drawing a line

    3 L 300 50  - draw a line from the previous

    4           position (x=100, y=50) to

    5           (x=300, y=50)

    6 L 200 150 - draw a line from (x=300, y=50)

    7           to (x=200, y=150)

    8 z         - connect the start with the end by

    9           drawing a line from (x=200, y=150)

    10          to (x=100, y=50)

    ```


    The `<path>`''s d attribute can take a few other commands but we wont get into
    those here since the ones we just examined are the most frequently used.


    With that said, we can find further information and learn about the others commands
    by reading [MSDN''s extensive documentation on the SVG <path>](https://example.com).
    These include commands for creating smooth lines using Bezier curves.


