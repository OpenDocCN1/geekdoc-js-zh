    # ### d3.pairs()


    We also can associated adjacent pairs of elements in an array to return tuples
    of elements using the d3.pairs() method. This method takes a single argument of
    an array.


    ```

    d3.pairs([1, 2, 3, 4]);

    // [ [1,2], [2,3], [3,4 Essays], [3,4]]

    d3.pairs([1])

    // []

