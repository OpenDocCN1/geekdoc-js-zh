    \n此外，访问器可以传递函数而非数值，这些函数将针对选择器数据的每个元素被调用。对于选择器中的每一个数据项，D3 都会调用我们的访问器，并使用其结果来设置当前生成弧线的该参数。让我们创建一个彩虹来演示这一点。\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n  <body>\n    <script src=\"http://d3js.org/d3.v3.min.js\"\
