    \ element, it will take as much room as it possibly can take unless we specify\
    \ the dimensions.\n\nThis element won’t look like anything on the page quite yet\
    \ because we haven’t placed anything inside of it.\n\n## SVG edges\n\nNote that\
    \ when we are using an SVG element positioned beyond the border of its parent\
    \ `<svg>` element, it will be clipped. To be sure that our elements don’t get\
    \ cut off, we’ll either have to ensure the `<svg>` element is large enough or\
    \ by making sure our inner SVG elements never exceed the border of their root\
    \ `<svg>` element.\n\nThere are a number of SVG elements that we can use to draw\
    \ visual elements inside of our `<svg>` element on the DOM as well as we have\
    \ the opportunity to build our own. These include simple shapes, such as circles,\
    \ ellipses, lines, rectangles, and rounded rectangles.\n\nWe can draw text with\
    \ many different fonts or paths that can be straight, curves filled in, outlined\
    \ and more. We have the full color spectrum available for us to use to create\
    \ gradients, patterns, visual effects on images, compositing, and alpha effects.\n\
    \nSVG also allows us to define animation for different elements.\n\nFurthermore,\
    \ many popular illustration programs export graphics to SVG, so it's possible\
    \ to draw paths using an external tool that we can draw the graphics from on the\
    \ web.\n\n## Differences between SVG and HTML\n\nEven though SVG feels like HTML,\
    \ it differs in a few, not-so-obvious ways. Simply because a property or style\
    \ works in HTML doesn't mean it will work for SVG elements.\n\nFor example, `width`\
    \ and `height` properties make no sense for a circle. The only three things that\
    \ describe the geometry of a circle are precisely the three we mentioned, its\
    \ x and y position from its center (`cx` and `cy`), and its radius (`r`). Notice\
    \ also that these are properties and not styles. We **cannot effect position of\
    \ SVG elements by using CSS styles like we can with HTML elements**.\n\n**Common\
    \ Gotcha:**\n\nJust because a property or style works in HTML doesn't mean it\
    \ will work for SVG. Common pitfalls involve using attributes or styles such as\
    \ `width`, `height`, `position`, `left`, `top`, `right`, `bottom`, or `float`\
    \ on SVG elements which don't support them.\n\nWe will look at a few SVG types\
    \ now so as to highlight a few of the most commonly used SVG types.\n\n## SVG\
    \ coordinates\n\nComputer-based graphics have traditionally set their coordinate\
    \ system starting from the top left corner as defined as the base `0, 0` coordinate\
    \ system. Larger y values move the coordinate downward, while increasing x values\
    \ move it right. The SVG coordinate system is no different.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_25_0.png)\n\
    \n### Coordinate system\n\nWhen we place an element inside of our root `<svg>`\
    \ element, we'll need to respect the location based on these coordinates.\n\n\
    ## SVG circle\n\nThe first SVG element we just introduced is the `<circle>` which,\
    \ unsurprisingly creates a circle. Notice how we set the properties `cx` and `cy`\
    \ corresponding to the offset of the circle from the center along the x and y\
    \ axis and the `r`, the radius of the circle.\n\n> These are not HTML properties\
    \ we're using. They are properties specific to circles and not other SVG shapes\
    \ (like rectangles) or other HTML elements.\n\n```\n1 <circle cx=\"50\" cy=\"\
    50\" r=\"30\">\n2 </circle>\n```\n\n### Circle\n\nThis sets the center of the\
    \ circle to be placed at the coordinate (50, 50) with a radius of 30.\n\nLive\
    \ version: [http://jsbin.com/OruHiZA/1/edit](http://jsbin.com/OruHiZA/1/edit)\n\
    \n## SVG ellipse\n\nLike the circle, we can also draw an ellipse that has a different\
    \ expectation of a different radius for each dimension than the circle.\n\n```\n\
    1 <ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"20\">\n2 </ellipse>\n```\n\n[Live\
    \ version](http://jsbin.com/eHugeTar/1/edit)\n\n## SVG rect\n\nThe `<rect>` is\
    \ a straightforward SVG element that simply creates a rectangle. To specify the\
    \ geometry, we'll need to set the properties `x`, `y`, `width`, and `height`.\
    \ We'll set the `x` and `y` values to specify the coordinates of the top left\
    \ corner, while we use the width and the height to specify the rectangle's dimensions.\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n  <body>\n    <svg>\n      <rect x=\"100\" y=\"\
    15\" width=\"150\" height=\"150\"></rect>\n    </svg>\n  </body>\n</html>\n```\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_27_0.png)\n\n![](img/82f49fe8a368850935eb7606dfa7579d_28_0.png)\n\
    \nBlack Square on a White SVG, 2013\n\nLive version: [http://jsbin.com/etISEYuY/1/edit](http://jsbin.com/etISEYuY/1/edit)\n\
    \n## SVG lines\n\nSVG also supports drawing simple lines. Lines require four attributes,\
    \ the starting (x1 and y1) and ending (x2 and y2) coordinates of the line segment\
    \ that would pass through both points.\n\n```\n1 <line x1=\"10\" y1=\"10\"\n2\
    \     x2=\"100\" y2=\"100\"\n3     stroke=\"blue\"\n4     stroke-width=\"100\"\
    ></line>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_29_0.png)\n\n**Line**\n\
    \nLive version: [http://jsbin.com/onuSAbO/1/edit](http://jsbin.com/onuSAbO/1/edit)\n\
    \n## SVG path\n\nThe `<path>` is a deceptively cumbersome tag to work with because\
    \ we have to specify the entire geometry of the path in only a single attribute\
    \ named simply `d`.\n\nBut don't fret! As we'll learn later in this chapter, D3\
    \ comes with a wide collection of helper functions that make generating this `d`\
    \ attribute from our data effortless. It's helpful to know how to create paths\
    \ so we'll go over the different commands that constitute the path geometry in\
    \ the `d` attribute. Here's a simple example we'll dissect:\n\n```\n1 <!DOCTYPE\
    \ HTML>\n2 <html>\n3     <body>\n4         <svg>\n5             <path d=\"M 100\
    \ 50 L 300 50 L 200 150 z\"/>\n6         </svg>\n7     </body>\n8 </html>\n```\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_30_0.png)\n\n### Insane clown triangle\n\
    \nThe commands that are passed to the `d` are described using [turtle graphics](https://example.com)\
    \ style commands. Think of these commands as how you would tell someone to draw\
    \ a picture blindfolded, issuing commands such as lift pen off paper, put pen\
    \ on paper, move down, move up and to the left, etc. The commands we pass to `d`\
    \ are expressed in the same imperative way. The path `d` attribute versions are:\n\
    \n- **M** for **move to**\n- **L** for **line to**\n- **z** which stands for **close\
    \ path**\n\nLet's break down the commands in the previous example in more detail:\n\
    \n```\n1 M 100 50  - move to position (x=100, y=50),\n2           - without drawing\
    \ a line\n3 L 300 50  - draw a line from the previous\n4           position (x=100,\
    \ y=50) to\n5           (x=300, y=50)\n6 L 200 150 - draw a line from (x=300,\
    \ y=50)\n7           to (x=200, y=150)\n8 z         - connect the start with the\
    \ end by\n9           drawing a line from (x=200, y=150)\n10          to (x=100,\
    \ y=50)\n```\n\nThe `<path>`'s `d` attribute can take a few other commands but\
    \ we won't get into those here since the ones we just examined are the most frequently\
    \ used.\n\nWith that said, we can find further information and learn about the\
    \ other commands by reading [MSDN's extensive documentation on the SVG <path>](https://example.com).\
    \ These include commands for creating smooth lines using Bezier curves.\n\n##\
    \ SVG text\n\nThe `<text>` tag is a straightforward way of including text into\
    \ our SVG but we might question its existence.\n\nWhy couldn't we just use a simple\
    \ `<p>`, `<div>` or `<span>` tag? Why do we need a separate tag?\n\nThe main reason\
    \ is that we cannot (easily) include HTML into an SVG the way we can include SVG\
    \ into HTML. This is also to allow SVG images to exist on their own, outside of\
    \ a browser allowing SVG images to be edited in image editors like Adobe Illustrator.\
    \ We can set the location of a `<text>` tag using its `x` and `y` attributes and\
    \ set the text by editing its inner text content.\n\nThat said, the `<text>` element\
    \ inherits from its CSS-specified font styles unless it's directly set on the\
    \ `<text>` element itself.\n\n```\n<!DOCTYPE HTML>\n<html>\n  <body>\n    <svg>\n\
    \      <text x=\"100\" y=\"100\" fill=\"green\" font-family=\"arial\" font-size=\"\
    16\">\n        Ceci n'est pas une pipe.\n      </text>\n    </svg>\n  </body>\n\
    </html>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_31_0.png)\n\nLive version:\
    \ [http://jsbin.com/eralusAW/1/edit](http://jsbin.com/eralusAW/1/edit)\n```"
