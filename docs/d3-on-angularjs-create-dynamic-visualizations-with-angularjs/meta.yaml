- md: "## D3 on AngularJS\nCreate Dynamic Visualizations with AngularJS\n\nFULLSTACK.io\
    \ Ari Lerner | Victor Powell\n\nD3 on AngularJS\nCreate Dynamic Visualizations\
    \ with AngularJS\nAri Lerner and Victor Powell\n\nThis book is for sale at [http://leanpub.com/d3angularjs](http://leanpub.com/d3angularjs)\n\
    This version was published on 2014-04-15\n\n***\n\nThis is a [Leanpub](http://leanpub.com)\
    \ book. Leanpub empowers authors and publishers with the Lean Publishing process.\
    \ [Lean Publishing](http://leanpub.com/manifesto) is the act of publishing an\
    \ in-progress ebook using lightweight tools and many iterations to get reader\
    \ feedback, pivot until you have the right book and build traction once you do.\n\
    \n***\n\n© 2013 - 2014 Ari Lerner and Victor Powell\n\n## TABLE OF CONTENTS\n\n\
    - Introduction\n  - About the authors\n  - About this book\n  - Organization of\
    \ this book\n  - Additional resources\n  - Conventions used in this book\n  -\
    \ Development environment\n- Introducing D3. A simple example\n  - What is it?\n\
    \  - 'Hello World' D3 style\n- Selections And Data Binding\n  - Selections\n \
    \ - Selector methods\n  - Data binding\n  - .enter() method\n  - exit()\n  - General\
    \ update pattern\n- SVG basics\n  - Scalable Vector Graphics\n  - Getting started\n\
    \  - SVG coordinates\n  - SVG and D3\n- Array helpers\n  - Accessing and manipulating\
    \ simple arrays\n  - Associative array helpers\n  - Maps\n  - Sets\n  - Nests\n\
    \  - Applying our knowledge\n  - Scales\n  - Axes\n- Animation and interaction\n\
    - Data Parsing and Formatting\n- What next?\n- Intro to Angular\n  - About Angular\n\
    \  - Hello Angular!\n- Directives for reusable visualizations\n  - Understanding\
    \ directives\n  - Creating a directive\n  - A donut chart directive\n  - Isolate\
    \ scope\n- Dynamic visualizations\n  - Two way data binding\n  - Making visualizations\
    \ dynamic with $watch\n- Getting data into and out of directives\n  - The D3 way\n\
    \  - The Angular way\n  - Updating the scope from within a directive\n- Best practices\
    \ for creating reusable visualizations\n  - Accessor functions\n  - Responsive\
    \ directives\n  - Services\n  - Built in directives\n  - Using replace, template,\
    \ and transclude to modify the behavior of our visualizations\n\n## Introduction\n\
    \n### About the authors\n\nAri Lerner is a developer with more than 20 years of\
    \ experience, and co-founder of Fullstack.io. He co-runs ng-newsletter, speaks\
    \ at conferences, and recently released Riding Rails with AngularJS. He also teaches\
    \ in-person classes at Hack Reactor and online with airpair.\n\nVictor Powell\
    \ is a freelance data visualization developer. Prior to freelance, Victor built\
    \ data visualization tools with YinzCam, Inc. used by NFL, NHL, and NBA sports\
    \ teams. In his free time, Victor enjoys finding ways to explaining unintuitive\
    \ or complex mathematical concepts visually. Victor also guest instructs at Hack\
    \ Reactor.\n\n### About this book\n\n*The D3 on AngularJS* book is packed with\
    \ the solutions you need to be a [D3](https://d3js.org) and [AngularJS](https://angularjs.org)\
    \ expert. AngularJS is an advanced front-end framework released by the team at\
    \ [Google](https://www.google.com). It enables you to build a rich front-end experience,\
    \ quickly and easily and D3 is an advanced data visualization framework released\
    \ by Mike Bostock.\n\n*The D3 on AngularJS* gives you the cutting-edge tools you\
    \ need to get up and running on AngularJS and creating impressive web experiences\
    \ in no time. The goal of this book is not only to give you a deep understanding\
    \ of how D3 works, but how to integrate it properly into your own AngularJS apps.\n\
    \nWith these tools you can dive into making your own dynamic visualizations with\
    \ AngularJS while being confident in understanding the technology.\n\n### Audience\n\
    \nWe have written this book for those who have never used AngularJS to build a\
    \ web application and are curious about how to get started with an awesome JavaScript\
    \ framework. We assume that you have a working knowledge of HTML and CSS and a\
    \ familiarity with basic JavaScript (and possibly other JavaScript frameworks).\
    \ We also assume that you've never written in D3 before, but are interested in\
    \ learning.\n\n### Organization of this book\n\nThe first half of the book focuses\
    \ exclusively on the basics of D3 so we'll start off assuming you have not used\
    \ the Library before. In the second half of the book, we'll cover Angular and\
    \ how it can be used to make reusable data visualization components. We'll also\
    \ assume you have not used Angular but at the same time, we won't get into too\
    \ many details of the Library and only cover the concepts that specifically aid\
    \ in creating reusable and interactive data visualizations.\n\n### Additional\
    \ resources\n\nSince this book does not cover AngularJS in-depth, we urge you\
    \ to check out the Complete Book on AngularJS at [ng-book.com](https://ng-book.com).\n\
    \nWe suggest that you take a look at the [AngularJS API documentation](https://docs.angularjs.org/api),\
    \ as it gives you direct access to the recommended methods of writing Angular\
    \ applications. It also gives you the most up-to-date documentation available.\n\
    \n### Conventions used in this book\n\nThroughout this book, you will see the\
    \ following typographical conventions that indicate different types of information:\n\
    \nIn-line code references will look like: `<h1>Hello</h1>`.\n\nA block of code\
    \ looks like so:\n\n```javascript\n1 var app = angular.module('app', []);\n2\n\
    3 function FirstController($scope) {\n4     $scope.data = \"Hello\";\n5 }\n```\n\
    \nAny command at the command line will look like:\n\n```bash\n1 $ ls -la\n```\n\
    \nAny command in the developer console in Chrome (the browser with which we will\
    \ primarily be developing) will look like:\n\n```javascript\n1 > var obj = {message:\
    \ \"hello\"};\n```\n\n**Important words** will be shown in bold.\n\nFinally, tips\
    \ and tricks will be shown as:\n\n> Tip: This is a tip\n\n### Development environment\n\
    \nIn order to write any applications using AngularJS or D3, we first need to have\
    \ a comfortable development environment. Throughout this book, we’ll be spending\
    \ most of our time in two places: our text editor and our browser. We recommend\
    \ you download the Google Chrome browser, as it provides a great environment to\
    \ develop in with its convenient and built-in developer tools suite. It’s also\
    \ the browser we used to create the examples. In theory, there should be no differences\
    \ in the way the examples run on other standards compliant browsers but we can’t\
    \ ever be absolutely sure.\n\n## Introducing D3. A simple example\n\nIn this chapter,\
    \ we'll go over what D3 is and what makes it such a powerful tool for data visualization.\
    \ We'll also introduce a simple 'Hello World' style example that shows how to\
    \ get quickly get setup and running with D3.\n\n### What is it?\n\nD3 (or Data-Driven\
    \ Documents) is a library written by [Mike Bostock](http://bost.ocks.org/mike/)\
    \ for “manipulating documents based on data.” This means D3’s primary job is to\
    \ take data and produce structured documents such as HTML or SVG with respect\
    \ to data. Unlike most visualization libraries, D3 is not a ready-made collection\
    \ of common graphs and widgets. It’s common to use D3 to make common graphs, like\
    \ bar charts and pie charts, but the real power is in its flexibility and fine\
    \ grain control over the final result.\n\nD3 works well with other established\
    \ web technologies like CSS and SVG because it doesn't attempt to abstract away\
    \ the DOM, like many other graphing libraries. This also means D3 will continue\
    \ to be useful as browsers incorporate new features.\n\nIf we're just looking\
    \ for a particular graph type, say, a bar chart, and don't care how exactly it\
    \ ends up looking, D3 might not be the right library for the job. Several other\
    \ ready-made libraries exist for creating simple, cookie-cutter charts, such as\
    \ [HighCharts](http://www.highcharts.com/) or [Chart.js](http://www.chartjs.org/)\
    \ or [Google Charts API](https://developers.google.com/chart/). If, on the other\
    \ hand, we have strong requirements for how our visualization should look and\
    \ function, D3 is a great choice.\n\nTo quickly jump into a real world example\
    \ of this, take the following interactive visualization produced by KQED's the\
    \ Lowdown blog. It doesn't fall into a single, chart category and the different\
    \ chart components need to communicate with each other, updating dynamically."
  mdcn: "\n## D3 on AngularJS\n使用 AngularJS 创建动态可视化\n\nFULLSTACK.io Ari Lerner | Victor\
    \ Powell\n\nD3 on AngularJS\n使用 AngularJS 创建动态可视化\nAri Lerner 和 Victor Powell\n\
    \n本书在 [http://leanpub.com/d3angularjs](http://leanpub.com/d3angularjs) 出售\n本版本发布于\
    \ 2014-04-15\n\n***\n\n这是一本 [Leanpub](http://leanpub.com) 书籍。Leanpub 通过精益出版（Lean\
    \ Publishing）流程为作者和出版商提供支持。[精益出版](http://leanpub.com/manifesto) 是指使用轻量级工具并经过多次迭代，发布一本进行中的电子书，以获取读者反馈，在找到正确方向前不断调整，并在成功后建立影响力。\n\
    \n***\n\n© 2013 - 2014 Ari Lerner 和 Victor Powell\n\n## 目录\n\n- 引言\n  - 关于作者\n\
    \  - 关于本书\n  - 本书结构\n  - 补充资源\n  - 本书使用的约定\n  - 开发环境\n- D3 简介：一个简单的示例\n  - 什么是\
    \ D3？\n  - D3 风格的 “Hello World”\n- 选择与数据绑定\n  - 选择 (Selections)\n  - 选择器方法\n \
    \ - 数据绑定\n  - `.enter()` 方法\n  - `exit()`\n  - 通用更新模式 (General update pattern)\n\
    - SVG 基础\n  - 可缩放矢量图形 (Scalable Vector Graphics)\n  - 入门指南\n  - SVG 坐标系\n  - SVG\
    \ 与 D3\n- 数组辅助函数\n  - 访问和操作简单数组\n  - 关联数组辅助函数\n  - Map\n  - Set\n  - Nest\n  -\
    \ 知识实践\n  - 比例尺 (Scales)\n  - 坐标轴 (Axes)\n- 动画与交互\n- 数据解析与格式化\n- 后续步骤\n- Angular\
    \ 简介\n  - 关于 Angular\n  - Hello Angular!\n- 用于可复用可视化的指令 (Directives)\n  - 理解指令\n\
    \  - 创建指令\n  - 环形图指令\n  - 隔离作用域 (Isolate scope)\n- 动态可视化\n  - 双向数据绑定\n  - 使用 `$watch`\
    \ 实现动态可视化\n- 指令的数据输入与输出\n  - D3 方式\n  - Angular 方式\n  - 从指令内部更新作用域\n- 创建可复用可视化的最佳实践\n\
    \  - 访问器函数 (Accessor functions)\n  - 响应式指令\n  - 服务 (Services)\n  - 内置指令\n  - 使用\
    \ `replace`、`template` 和 `transclude` 修改可视化的行为\n\n## 引言\n\n### 关于作者\n\nAri Lerner\
    \ 是一位拥有 20 多年经验的开发人员，也是 Fullstack.io 的联合创始人。他共同运营 ng-newsletter，在会议上发表演讲，并于近期发布了《Riding\
    \ Rails with AngularJS》。他还在 Hack Reactor 提供线下课程，并在 airpair 提供在线教学。\n\nVictor Powell\
    \ 是一位自由职业的数据可视化开发人员。在从事自由职业之前，Victor 在 YinzCam, Inc. 构建了被 NFL、NHL 和 NBA 体育队伍使用的数据可视化工具。在业余时间，Victor\
    \ 喜欢寻找通过视觉方式解释不直观或复杂数学概念的方法。Victor 同时也担任 Hack Reactor 的客座讲师。\n\n### 关于本书\n\n*The\
    \ D3 on AngularJS* 一书包含了成为 [D3](https://d3js.org) 和 [AngularJS](https://angularjs.org)\
    \ 专家所需的解决方案。AngularJS 是由 [Google](https://www.google.com) 团队发布的一个高级前端框架。它能让你快速、轻松地构建丰富的前端体验；而\
    \ D3 是由 Mike Bostock 发布的一个高级数据可视化框架。\n\n*The D3 on AngularJS* 为你提供了尖端的工具，让你能够迅速在\
    \ AngularJS 上上手并创建令人印象深刻的 Web 体验。本书的目标不仅是让你深入理解 D3 的工作原理，而且是学习如何将其正确地集成到你自己的 AngularJS\
    \ 应用中。\n\n借助这些工具，你可以信心十足地地理解该技术，并投入到使用 AngularJS 制作自己的动态可视化中。\n\n### 目标读者\n\n\
    本书是为那些从未用 AngularJS 构建过 Web 应用，并对如何开始使用这个强大的 JavaScript 框架感到好奇的人编写的。我们假设你具备 HTML\
    \ 和 CSS 的实用知识，并熟悉基础的 JavaScript（以及可能的其他 JavaScript 框架）。我们也假设你之前从未写过 D3，但有兴趣学习。\n\
    \n### 本书结构\n\n本书的前半部分完全集中在 D3 的基础知识上，因此我们将假设你之前没有使用过该库。在本书的后半部分，我们将介绍 Angular\
    \ 以及如何使用它来创建可复用的数据可视化组件。我们同样假设你没有使用过 Angular，但与此同时，我们不会深入探讨该库的过多细节，而仅涵盖那些能具体帮助创建可复用和交互式数据可视化的概念。\n\
    \n### 补充资源\n\n由于本书没有深入讲解 AngularJS，我们强烈建议你阅读 [ng-book.com](https://ng-book.com)\
    \ 上的 AngularJS 完整指南。\n\n我们建议你查看 [AngularJS API 文档](https://docs.angularjs.org/api)，因为它能让你直接接触到推荐的\
    \ Angular 应用编写方法，并提供最及时的文档更新。\n\n### 本书使用的约定\n\n在本书中，你将看到以下排版约定，用于表示不同类型的信息：\n\
    \n内联代码引用如下所示：`<h1>Hello</h1>`。\n\n代码块如下所示：\n\n```javascript\n1 var app = angular.module('app',\
    \ []);\n2\n3 function FirstController($scope) {\n4     $scope.data = \"Hello\"\
    ;\n5 }\n```\n\n任何命令行命令如下所示：\n\n```bash\n1 $ ls -la\n```\n\n任何在 Chrome 开发者控制台（我们将主要使用该浏览器进行开发）中的命令如下所示：\n\
    \n```javascript\n1 > var obj = {message: \"hello\"};\n```\n\n**重要词汇**将以粗体显示。\n\
    \n最后，技巧和窍门将显示为：\n\n> Tip: 这是一个技巧\n\n### 开发环境\n\n为了编写使用 AngularJS 或 D3 的任何应用程序，我们首先需要一个舒适的开发环境。在本书中，我们将大部分时间花在两个地方：文本编辑器和浏览器。我们建议你下载\
    \ Google Chrome 浏览器，因为它内置了便捷的开发者工具套件，提供了极佳的开发环境。这也是我们创建示例时使用的浏览器。理论上，在其他符合标准的浏览器上运行示例没有区别，但我们无法绝对保证。\n\
    \n## D3 简介：一个简单的示例\n\n在本章中，我们将探讨什么是 D3，以及是什么让它成为如此强大的数据可视化工具。我们还将引入一个简单的 “Hello\
    \ World” 风格示例，展示如何快速配置并运行 D3。\n\n### 什么是 D3？\n\nD3（全称 Data-Driven Documents，数据驱动文档）是由\
    \ [Mike Bostock](http://bost.ocks.org/mike/) 编写的一个用于“基于数据操纵文档”的库。这意味着 D3 的主要工作是接收数据，并根据数据生成结构化文档，如\
    \ HTML 或 SVG。与大多数可视化库不同，D3 并不是一个预制的常见图表和组件集合。虽然通常可以使用 D3 来制作常见的图表（如柱状图和饼图），但其真正的威力在于其灵活性以及对最终结果的精细控制。\n\
    \nD3 与 CSS 和 SVG 等成熟的 Web 技术配合良好，因为它不像许多其他绘图库那样试图将 DOM 抽象化。这也意味着随着浏览器引入新功能，D3\
    \ 将继续发挥作用。\n\n如果我们只是在寻找某种特定的图表类型（例如柱状图），且不在乎它最终具体长什么样，那么 D3 可能不是最合适的库。目前有许多其他预制库可以创建简单的、模版化的图表，例如\
    \ [HighCharts](http://www.highcharts.com/)、[Chart.js](http://www.chartjs.org/)\
    \ 或 [Google Charts API](https://developers.google.com/chart/)。相反，如果我们对可视化的外观和功能有很强的要求，那么\
    \ D3 是一个绝佳的选择。\n\n为了快速进入一个真实世界的例子，请参考由 KQED 的 Lowdown 博客制作的以下交互式可视化。它不属于单一的图表类别，且不同的图表组件需要相互通信并动态更新。\n"
