- md: "## entries()\n\nSometimes we want the specific array to contain both the key\
    \ name and the value name. This is particularly useful when we're interested in\
    \ dynamic objects where we are interested in a single key by name.\n\n```javascript\n\
    d3.entries({x: 1, y: 2, z: 3})\n// => [\n//    {key: \"x\", value: 1},\n//   \
    \ {key: \"y\", value: 2},\n//    {key: \"z\", value: 3}\n// ]\n```\n\n## Maps\n\
    \nMaps are similar to objects in JavaScript, but when using any built-in object\
    \ behavior and/or built-in keys (such as `__proto__` or `hasOwnProperty`), the\
    \ object behavior will tend to act unexpectedly. For more, see [An Object is not\
    \ a Hash by Guillermo Rauch](http://...)\n\nIn D3, we can create a new map object\
    \ simply by calling the `d3.map()` function. It can also take an optional first\
    \ argument that contains an object of keys and values to initialize the map with.\n\
    \n```javascript\nvar m1 = d3.map(); // map object\nvar m2 = d3.map({x: 1}); //\
    \ map object with x as a key and 1 as the value\n```\n\n### map.has()\n\nWe can\
    \ test if a map includes a key or not using the `map.has()` method. It takes a\
    \ single argument of a *key* string.\n\n```javascript\nvar m = d3.map({x: 1})\n\
    m.has(\"x\"); // true\nm.has(\"y\"); // false\nvar key = \"x\";\nm.has(key); //\
    \ true\n```\n\n### map.get()\n\nWe can fetch the value of a key inside of our\
    \ map by using the `map.get()` function. It takes a single argument of a key string\
    \ to fetch.\n\n```javascript\nvar m = d3.map({x: 1})\nm.get(\"x\"); // 1\nm.get(\"\
    y\"); // undefined\n```\n\n### map.set()\n\nWe can set a value inside of our map\
    \ as well using the `map.set()` method. This takes two arguments, the key (string)\
    \ to set and the value to set it. If the map already *knows* about the key, it\
    \ will replace the old value with the new value.\n\n```javascript\nvar m = d3.map({x:\
    \ 1})\nm.set(\"y\", 2);\nm.set(\"x\", 2);\n// m => {x: 2, y: 2}\n```\n\n### map.remove()\n\
    \nWe can also delete a key that is in our map by using the `map.remove()` function.\
    \ This takes a single argument, the key (string) to remove out of the map.\n\n\
    ```javascript\nvar m = d3.map({x: 1})\nm.set(\"y\", 2);\nm.remove(\"x\");\n//\
    \ m => {y: 2}\n```\n\n### map.keys()\n\nWe can fetch an array of all the keys\
    \ in the map by using the `map.keys()` function.\n\n```javascript\nvar m = d3.map({x:\
    \ 1})\nm.set(\"y\", 2);\nm.keys(); // => [\"x\", \"y\"]\n```\n\n### map.values()\n\
    \nSimilarly, we can fetch an array of all the values in the map using the `map.values()`\
    \ function.\n\n```javascript\nvar m = d3.map({x: 1})\nm.set(\"y\", 2);\nm.values();\
    \ // => [1, 2]\n```\n\n### map.entries()\n\nWe can also return an array of key-value\
    \ based objects with two keys of key and value. This is useful for picking out\
    \ certain objects inside of a map.\n\n```javascript\nvar m = d3.map({x: 1})\n\
    m.set(\"y\", 2);\nm.entries();\n// [{key:\"x\", value:1}, {key:\"y\", value:2}]\n\
    ```\n\n### map.forEach()\n\nFinally, we can iterate over every entry in the map\
    \ by using the `map.forEach()` function. This takes a single argument of a function\
    \ that will be called for every single entry in the map. This function will be\
    \ called with two arguments, the key and the value like so:\n\n```javascript\n\
    var m = d3.map({x: 1})\nm.set(\"y\", 2);\nm.forEach(function(key, value) {\n \
    \ console.log(value);\n});\n// 1\n// 2\n```\n\n> The `this` context inside of\
    \ the function points to the map itself.\n\n## Sets\n\nSets are very similar to\
    \ maps, with the exception that they can only have a single value associated in\
    \ the set.\n\nWe can create a set by calling the `d3.set()` method. This method\
    \ takes a single, optional argument of an array.\n\nIf an array is passed in as\
    \ an argument, every value in the array will be returned as a member of the set.\n\
    \n```javascript\nvar s = d3.set([1, 2, \"foo\", \"bar\"])\n// s = [1, 2, \"foo\"\
    , \"bar\"]\n```\n\n### set.has()\n\nWe can test if the set has the value set as\
    \ an entry by using the `set.has()` method. This method takes a single argument\
    \ of a value. The method will return true if and only if the set has an entry\
    \ for the value string.\n\n```javascript\nvar s = d3.set([1, 2, \"foo\", \"bar\"\
    ])\ns.has(1); // true\ns.has(\"donald_duck\"); // false\n```\n\n### set.add()\n\
    \nWe can add a value to the set by using the `set.add()` function. It takes a\
    \ single argument of value, the value to append to the set.\n\n```javascript\n\
    var s = d3.set([1, 2, \"foo\", \"bar\"])\ns.add(3);\ns.has(3); // true\n```\n\n\
    ### set.remove()\n\nWe can remove a value using the `set.remove()` method. This\
    \ remove method takes a single argument of the value to remove from the set. If\
    \ the value is in the set, it will remove the value (and return true). If the\
    \ value is *not* in the array, then it will do nothing and return false.\n\n```javascript\n\
    var s = d3.set([1, 2, \"foo\", \"bar\"])\ns.remove(1); // true\ns.remove(\"space\"\
    ); // false\ns.has(1); // false\n```\n\n### set.values()\n\nJust like in arrays,\
    \ we can get all of the values in the set. This will return an array that includes\
    \ all of the \"unique\" values in the set.\n\n```javascript\nd3.set([1, 2, 1,\
    \ 3]).values(); // [\"1\", \"2\", \"3\"]\n```\n\n### set.forEach()\n\nWe can run\
    \ a function for every single value in our set as well by using the `set.forEach()`\
    \ function. The `set.forEach(fn)` method takes a single argument of the function\
    \ to run for every element.\n\nThe function will be run with a single argument\
    \ of the value in the set.\n\n```javascript\nvar s = d3.set([1, 2, \"foo\", \"\
    bar\"])\ns.forEach(function(val) {\n   console.log(\"Value: \" + val);\n});\n\
    // Value: 1\n// Value: 2\n// Value: foo\n// Value: bar\n```\n\n> The `this` context\
    \ inside the function points to the set itself.\n\n## Nests\n\nA nest allows elements\
    \ in an array to be grouped into a hierarchical tree structure. Nests allow us\
    \ to neatly format our data into meaningful grouping contexts.\n\nNests allow\
    \ us to format data in groupings that make sense for our use. For instance, if\
    \ we have the population of countries in the world, the continent they are on\
    \ and their population, it would be useful for us to be able to view the population\
    \ based upon continent.\n\nWe can set up our data in a nest and then populate\
    \ the nest data using a key of the data:\n\n```javascript\nvar raw_country_data\
    \ = [{\n    \"countryName\": \"Andorra\",\n    \"continent\": \"EU\",\n    \"\
    languages\": \"ca\",\n    \"areaInSqKm\": \"468.0\",\n    \"population\": \"84000\"\
    \n  },\n  {\n    \"countryName\": \"United Arab Emirates\",\n    \"continent\"\
    : \"AS\",\n    \"languages\": \"ar-AE,fa,en,hi,ur\",\n    \"areaInSqKm\": \"82880.0\"\
    ,\n    \"population\": \"4975593\"\n  },\n  {\n    \"countryName\": \"Antigua\
    \ and Barbuda\",\n    \"continent\": \"NA\",\n    \"languages\": \"en-AG\",\n\
    \    \"areaInSqKm\": \"443.0\",\n    \"population\": \"86754\"\n  },\n  {\n  \
    \  \"countryName\": \"Anguilla\",\n    \"continent\": \"NA\",\n    \"languages\"\
    : \"en-AI\",\n    \"areaInSqKm\": \"102.0\",\n    \"population\": \"13254\"\n\
    \  },\n  {\n    \"countryName\": \"Albania\",\n    \"continent\": \"EU\",\n  \
    \  \"languages\": \"sq,el\",\n    \"areaInSqKm\": \"28748.0\",\n    \"population\"\
    : \"2986952\"\n  },\n  {\n    \"countryName\": \"Armenia\",\n    \"continent\"\
    : \"AS\",\n    \"languages\": \"hy\",\n    \"areaInSqKm\": \"29800.0\",\n    \"\
    population\": \"2968000\"\n  }\n];\n\nvar data = d3.nest()\n    .key(function(d)\
    \ { return d.continent })\n    .sortKeys(d3.ascending)\n    .entries(raw_country_data);\n\
    // [\n//  {key: \"AS\", values: [\n//   {continent: \"AS\", ...\n//  ]}\n// ]\n\
    ```\n\nThe `d3.nest()` function creates a new nest operator. It takes no arguments,\
    \ but allows us to call all nests functions on it.\n\n### nest.key()\n\nTo set\
    \ up the key functions, we'll use the `nest.key()` method. This method takes a\
    \ single function that will be invoked for each element in the input array and\
    \ it is expected to return a string identifier that's used to assign the element\
    \ to its group.\n\nIn the above example, we set up the `key()` function to return\
