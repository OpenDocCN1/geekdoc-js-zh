  md: "# # What next?\n\nThis chapter will cover additional resources and stepping\
    \ off points for continued exploration of D3.\n\n# ## Maps\n\nBuilt into D3 is\
    \ an extensive collection of utility methods that make working with geographic\
    \ data much easier. D3, in combination with command line tools like ogr2ogr make\
    \ it easy to convert GIS shapefiles into a type of JSON (GeoJSON, specifically)\
    \ that D3 can read and draw as SVG. A common use case is in the creation of choropleths\
    \ and other thematic maps commonly used in data visualization.\n\nBecause geoJSON\
    \ files can get quite large, another great tool by Mike Bostock is [TopoJSON](link).\
    \ TopoJSON is an alternative map file format to GeoJSON, expect the files it produces\
    \ are *much* smaller and consequently load much faster inside of a browser. In\
    \ addition to TopoJSON the file format, there's TopoJSON the library (for reading\
    \ the format) and TopoJSON the command line program (for creating TopoJSON files\
    \ from GeoJSON files.) For an in depth tutorial on creating maps, see Mike Bostock's\
    \ excellent [Let's Make a Map](link) tutorial.\n\n# ## Layouts\n\nD3 Offers an\
    \ extensive collection of pre-existing [layout helper](link) functions that make\
    \ building the typical cookie-cutter graphs like pie, histogram, and stack chart\
    \ ease. D3 does **not** provide methods like `createPieChart`. Instead, D3 offers\
    \ functions that make creating them from scratch easier. Lets walk though a quick\
    \ pie chart example to show this in action. We'll combine to two new methods,\
    \ `d3.svg.arc()`, which creates a arc generator, and `d3.layout.pie()`. The `pie()`\
    \ layout simply takes data and produces the necessary parameters that `arc()`\
    \ expects.\n\n```\nvar data = [4,5,6];\nvar pie = d3.layout.pie();\nconsole.log(pie(data));\
    \ // =>\n[\n  { data:4, value:4, startAngle:4.61, endAngle:6.28 },\n  { data:5,\
    \ value:5, startAngle:2.51, endAngle:4.61 },\n  { data:6, value:6, startAngle:0,\
    \ endAngle:2.51 }\n]\n```\n\nNow we can use an arc generator to take the start\
    \ and end angles above and produce the necessary d attribute values to draw arc\
    \ paths in SVG.\n\n```\n// create an arc generator function, setting the outer\
    \ radius\n// of the created arcs to `100` and inner radius to `0`\nvar arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n\
    ```\n\n```\nvar color = d3.scale.category10();\nvar arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \  .enter().append('path')\n    .attr({ d: arc }) // create the arc paths using\
    \ the arc generator\n    .style({\n      // style each arc slice with a different\
    \ color and white border\n      fill: function(d, i){ return color(i) },\n   \
    \   stroke: 'white'\n    })\n```"
