    # Using `replace`, `template`, and `transclude` to modify the behavior of our
    visualizations


    When defining directives, we can optionally tell the Angular compiler that it
    should replace the element with the directive with a provided template. This comes
    in handy if we want to replace the custom directive element with an actual SVG
    element instead of having a custom directive element "wrapping" our visualization
    (which is what our directives have been doing up until now.) Let''s walk through
    an example of this in the case of creating a [sparkline](http://bl.ocks.org/vicapow/9819505)
    directive. Sparklines are little mini graphs that can be embedded inline between
    words in a text document.'
