  md: '# Selections And Data Binding


    This chapter covers D3''s "selections" and how they can be combined with data
    to expressively create and manipulate HTML documents. We''ll use selectors all
    throughout our D3 code so the content in this chapter is fundamental to using
    D3.


    > Those reads familiar with **jQuery** are strongly encouraged *not* to skip this
    chapter. Even though D3''s selectors are similar, they deviate in a few key areas.


    # Selections


    Selectors are objects that represent collections (or sets) of DOM elements. This
    allows us to modify properties on the selector and have those changes applied
    to all the DOM elements in it. This is an extremely powerful idea! It''s now no
    longer our job to be explicit in *how* the program should go about changing all
    the elements. Instead, we only need to specify which elements should change and
    their associated changes. Say we wanted to change the background of a bunch of
    `<div>` tags. Instead of having an array of DOM elements and modifying each one
    directly:


    ```

    1 // `divs` is just an array of DOM elements

    2 for(var i = 0; i < divs.length; i++){

    3     divs[i].style.backgroundColor = ''blue'';

    4 }

    ```


    Live version [http://jsbin.com/UdiDiQu/2/edit](http://jsbin.com/UdiDiQu/2/edit)


    We can apply modifications to each `<div>` element using the selector.


    ```

    1 // `divs` is a selector object

    2 divs.style(''background-color'', ''blue'');

    ```


    Live version: [http://jsbin.com/ADeReRo/1/edit](http://jsbin.com/ADeReRo/1/edit)


    The last two example snippets perform exactly the same task. The latter example
    also introduced our first selector method, `style`, which changes the background
    color of all the divs in the selection to blue. We''ll talk about this method
    more below. For now, just understand that selectors give us a vocabulary for talking
    about groups of DOM elements and that their methods apply to each containing DOM
    element within the selector.


    So how do we create new selectors? Fortunately, selectors in D3 follow the same
    convention used in CSS. (This should also feel very familiar if you have ever
    used jQuery.) In the same way a CSS rule applies to a set of DOM elements, we
    can collect DOM elements to put in our selector using the same rules. Here''s
    an example of a snippet of CSS which applies to all `<div>` tags that have the
    class ''foo'':'
  merge: -1
  pgno: 10
- img_proc: true
  md: "```\ndiv.foo{\n  /* CSS applied to all <div>'s of class \"foo\" */\n}\n```\n\
    \nWith selectors, how we specify which elements we want to select is exactly the\
    \ same. We can still just use div.foo by passing it to d3.selectAll. The result,\
