  md: "# SVG basics\n\nThe first section of this chapter provides an introduction\
    \ to SVG, a powerful open web standard for creating vector graphics in the browser.\
    \ In the second half of this chapter, we’ll highlight the D3 helper functions\
    \ that make working with SVG fun and manageable.\n\n# Scalable Vector Graphics\n\
    \nAlthough D3 can easily help us create and draw div elements, our visualizations\
    \ generally require much more horsepower. We’ll use Scalable Vector Graphics (or\
    \ SVG for short) to give us a much more expressive interface for drawing in the\
    \ DOM.\n\nSVG is, like HTML, is an XML-based markup language created specifically\
    \ for creating vector-based two-dimensional graphics that has support for interactivity\
    \ and animation.\n\nTraditional graphics systems, or raster graphics, rely on\
    \ manipulating pixels which often ends up being what’s called a destructive progress.\
    \ This means once we commit to modifying the pixel information in a particular\
    \ way, it’s very hard and often impossible to alter or undo those changes.\n\n\
    With vector graphics, instead of simply recording all the pixels in the image,\
    \ just the necessary shapes and colors are recorded and recounted just before\
    \ the graphic is shown on the screen. This last step, of taking the geometry and\
    \ converting it to pixels on the screen happens transparently and automatically\
    \ for us.\n\nThis process has the benefit of being easily scalable, as well as\
    \ taking up much less space to store. It allows for us to create SVG images from\
    \ any standard text editor, we can search, script them, and scale them indefinitely.\n\
    \nVector graphics do have some disadvantages compared to raster graphics. For\
    \ example, it’s much more convenient to store photos are raster graphics since\
    \ most photos are not composed of simple geometric shapes. On the other hand,\
    \ most data visualizations are composed of simple geometric shapes, so vector\
    \ graphics makes them a perfect fit for use with D3.\n\nAlmost every D3 data visualization\
    \ we’ll come across was likely created using SVG. The fact that we’re storing\
    \ geometric information and not pixel data directly also means it’s very easy\
    \ for us to go about making changes to the SVG graphics we create later.\n\nPossibly\
    \ the most convenient part about SVG is that we can use it directly inside of\
    \ our HTML. It will *feel* like we are working with any other DOM element but\
    \ the result will be a graphic.\n\n# Getting started\n\nTo get us started, lets\
    \ take a look at the following ‘Hello World’ style SVG example:\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n    <body>\n        <svg>\n            <circle cx=\"223\" cy=\"\
    83\" r=\"54\"/>\n```"
