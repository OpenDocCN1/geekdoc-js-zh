  md: '# Intro to Angular


    Up until this point, we''ve focused only on D3 but in the next chapters, we''ll
    look at some of the interesting ways in can be combined with Angular to make our
    visualizations more modular, reusable, and interactive. This also had a the benefit
    of making them easier to conceptualize in our heads as well as making it easier
    for us to come back to several months later after we''ve forgotten all the nuances
    of our visualization.


    # About Angular


    Angular is a framework that makes it easier to create (web) applications but it
    lends it self well to interactive visualization. It does this by forcing us to
    break up our application into pieces that perform specific types of tasks. Splitting
    our code up this way allows components to be easily swapped out for other components.
    It also helps with connecting our components to other components allowing one
    visualization to be driven by each other or update themselves automatically when
    their underlying data changes.


    Angular has a lot of features but most aren''t directly related to data visualization.
    For a more in depth deep dive into Angular check out Ari''s ng-book.


    # Angular for interactive and reusable data visualization


    There are a lot of reason''s to use Angular when doing data visualization but
    chief among them all are directives. Directives make it easier to create reusable
    visualizations. They are essentially a way for us to create our own HTML elements
    that act just like the browsers built-in HTML tags. Imagine we just created a
    pie chart visualization we''d like to reuse again. If we had created a directive
    that contained our pie chart, this would be simple. We can just copy and paste
    the `<pie-chart>` element in our html without having to write any JavaScript.


    ```

    1 <pie-chart></pie-chart>

    2 <pie-chart></pie-chart>

    ```


    This also makes it easier for people that didn''t write our pie chart, since they
    don''t need to know the pie chart works to use it.


    If we write our visualizations in directives, we also get a lot of other advantages
    for free. Namely, we can use Angular''s other built-in directives like `ng-switch`
    to conditionally show different visualizations. In this example we''re conditionally
    showing either a pie chart or bar chart view of the data depending on the state
    of the `selection` scope variable.


    ```

    1 <div ng-switch on="selection">

    2   <div ng-switch-when="pie">

    3     <pie-chart></pie-chart>

    4   </div>

    5   <div ng-switch-default>

    6     <bar-chart></bar-chart>

    7   </div>

    8 </div>

    ```


    Using another built-in Angular directive, `ng-repeat`, we can easily create the
    effective data'
