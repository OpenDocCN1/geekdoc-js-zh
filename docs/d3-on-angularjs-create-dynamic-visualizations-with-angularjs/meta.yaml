    我们可以使用 D3 的 `min()` 和 `max()` 函数来提取数组的最小值和最大值。这两个函数与其对应的内置 Math 函数的不同之处在于，它们会忽略\
    \ undefined 值。\n\n它们还使用自然排序（natural ordering）而非数值排序进行比较。这意味着 [\"20\", \"3\"] 的最大值是\
