    # Common Gotcha: Loading data from local file


    Most modern browsers impose security restrictions that prevent HTML files loaded
    from your computer from making requests for other local file resources. This means
    that if you''ve just been clicking on HTML files and opening them in your browser,
    those HTML pages won''t be able to make requests for our locally stored data files.
    This security restriction prevents normal browser users from mistakenly opening
    a downloaded HTML file and having it snoop other files off of their hard drive.
    To circumvent this restriction, the simplest solution is to run a web server using
    `python -m SimpleHTTPServer` from the command line in the directory from which
    you want to run your server. Then we can access our file.html in that directory
    from localhost:8000/our-file.html in the browser.


    # Common Gotcha: JSON is a subset of JavaScript


    JSON is a subset of JavaScript. This means we could copy and paste JSON into a
    JavaScript program without problems, but this does not mean we can copy and paste
    anything from JavaScript into JSON. One key difference is that JSON object keys
    must be in double quotes. The same is true for string values. ie., { foo : ''bar''
    } is valid JavaScript but not valid JSON. { "foo" :"bar" } is valid JSON and valid
    JavaScript. Valid JSON cannot contain function or date objects.


    # Working with data


    Often the hardest part of data visualization is just getting the data we want
    to visualize into a meaningful format. Notice how in the above example the dates
    are formatted as strings and contain a - ? We''ll have a hard time using those
    dates in scales or graphing them along a time line if we can''t work with them
    as numbers. To convert them over to numbers, we can use D3''s time formatting
    helper method, `d3.time.parse()`. With it, we can create a new date format object
    to parse our funky dates.


    ```

    1 var format = d3.time.format(''%B %e, - %Y'');

    2 format.parse("April 27, - 2011"); // => a new date object

    ```


    There''s a ton of different date formatting tokens you can use. Checkout the full
    list on the [D3 github wiki page](https://github.com/d3/d3/wiki/Date-Formatting).


    To reformat our data set so that it contains actual date objects, we can call
    our formatter on each "Air date" property of every element in our data array.
    In this step, we''ll also create a viewers property instead of viewers (in millions)
    since it''s best practice to keep our data in the most common and/or obvious units
    by default.


    ```

    1 var format = d3.time.format(''%B %e, - %Y'');

    2 data.forEach(function(datum){

    3   datum[''Air date''] = format.parse(datum[''Air date'']);

    4   // add another property, viewers

    5   datum[''U.S. Viewers''] = datum[''viewers (in millions)''] * 1000000;

    6   // remove the U.S. viewers (in millions) property

    7   delete datum[''U.S. viewers (in millions)''];

    8 });

    ```'
- md: " ## What next?\n\nThis chapter will cover additional resources and stepping\
    \ off points for continued exploration of D3.\n\n## Maps\n\nBuilt into D3 is an\
    \ extensive collection of utility methods that make working with geographic data\
    \ much easier. D3, in combination with command line tools like ogr2ogr make it\
    \ easy to convert GIS shapefiles into a type of JSON (GeoJSON, specifically) that\
    \ D3 can read and draw as SVG. A common use case is in the creation of choropleths\
    \ and other thematic maps commonly used in data visualization.\n\nBecause geoJSON\
    \ files can get quite large, another great tool by Mike Bostock is [TopoJSON](link).\
    \ TopoJSON is an alternative map file format to GeoJSON, expect the files it produces\
    \ are *much* smaller and consequently load much faster inside of a browser. In\
    \ addition to TopoJSON the file format, there's TopoJSON the library (for reading\
    \ the format) and TopoJSON the command line program (for creating TopoJSON files\
    \ from GeoJSON files.) For an in depth tutorial on creating maps, see Mike Bostock's\
    \ excellent [Let's Make a Map](link) tutorial.\n\n## Layouts\n\nD3 Offers an extensive\
    \ collection of pre-existing [layout helper](link) functions that make building\
    \ the typical cookie-cutter graphs like pie, histogram, and stack chart ease.\
    \ D3 does **not** provide methods like `createPieChart`. Instead, D3 offers functions\
    \ that make creating them from scratch easier. Lets walk though a quick pie chart\
    \ example to show this in action. We'll combine two new methods, `d3.svg.arc()`,\
    \ which creates a arc generator, and `d3.layout.pie()`. The `pie()` layout simply\
    \ takes data and produces the necessary parameters that `arc()` expects.\n\n```\n\
    var data = [4,5,6];\nvar pie = d3.layout.pie();\nconsole.log(pie(data)); // =>\n\
    [\n  { data:4, value:4, startAngle:4.61, endAngle:6.28 },\n  { data:5, value:5,\
    \ startAngle:2.51, endAngle:4.61 },\n  { data:6, value:6, startAngle:0, endAngle:2.51\
    \ }\n]\n```\n\nNow we can use an arc generator to take the start and end angles\
    \ above and produce the necessary d attribute values to draw arc paths in SVG.\n\
    \n```\n// create an arc generator function, setting the outer radius\n// of the\
    \ created arcs to `100` and inner radius to `0`\nvar arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n\
    ```\n\n```\nvar color = d3.scale.category10();\nvar arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \  .enter().append('path')\n    .attr({ d: arc }) // create the arc paths using\
    \ the arc generator\n    .style({\n      // style each arc slice with a different\
    \ color and white border\n      fill: function(d, i){ return color(i) },\n   \
    \   stroke: 'white'\n    })\n```\n\nHere's what it all looks like together. Note\
    \ the containing g element and (200,200) translation so that the center of the\
    \ pie chart isn't stuck in the top, left corner of the svg.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <body>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <script>\n      var vis = d3.select('body').append('svg').append('g')\n\
    \          .attr('transform', 'translate(200,200)');\n      var color = d3.scale.category10();\n\
    \      var arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n      var pie\
    \ = d3.layout.pie();\n      var arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \        .enter().append('path').attr({\n            d: arc,\n            fill:\
    \ function(d, i){ return color(i) },\n            stroke:文山\n        });\n   \
    \ </script>\n  </body>\n</html>\n```\n\nThere are many more layouts like this\
    \ one so if you ever find yourself creating a pretty common graph type, be sure\
    \ to look for possible pre-existing layout helpers first.\n\n## Plugins and other\
    \ tools\n\nThe venerable Mike Bostock and others have collected several common\
    \ [D3 plugins](https://github.com/d3/d3-plugins) that haven't seemed necessary\
    \ enough to be put into D3 core but are, on occasion, extremely useful. One of\
    \ the most interesting among them is the d3.fisheye plugin which applies a distorted\
    \ fisheye lense effect which is useful when focusing in a particular portion of\
    \ a larger collection of elements.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_83_0.png)\n\
    \nThere are a few common tools that are often used with D3. Chief among them may\
    \ be [Crossfilter](http://square.github.com/crossfilter/). Think of Crossfilter\
    \ as offering faster alternatives to D3's array helpers. With it, it's possible\
    \ to quickly sort and filter extremely large amounts (millions of rows) of data.\n\
    \n## Intro to Angular\n\nUp until this point, we've focused only on D3 but in\
    \ the next chapters, we'll look at some of the interesting ways in can be combined\
    \ with Angular to make our visualizations more modular, reusable, and interactive.\
    \ This also had a the benefit of making them easier to conceptualize in our heads\
    \ as well as making it easier for us to come back to several months later after\
    \ we've forgotten all the nuances of our visualization.\n\n## About Angular\n\n\
    Angular is a framework that makes it easier to create (web) applications but it\
    \ lends it self well to interactive visualization. It does this by forcing us\
    \ to break up our application into pieces that perform specific types of tasks.\
    \ Splitting our code up this way allows components to be easily swapped out for\
    \ other components. It also helps with connecting our components to other components\
    \ allowing one visualization to be driven by each other or update themselves automatically\
    \ when their underlying data changes.\n\nAngular has a lot of features but most\
    \ aren't directly related to data visualization. For a more in depth deep dive\
    \ into Angular check out Ari's ng-book.\n\n## Angular for interactive and reusable\
    \ data visualization\n\nThere are a lot of reason's to use Angular when doing\
    \ data visualization but chief among them all are directives. Directives make\
    \ it easier to create reusable visualizations. They are essentially a way for\
    \ us to create our own HTML elements that act just like the browsers built-in\
    \ HTML tags. Imagine we just created a pie chart visualization we'd like to reuse\
    \ again. If we had created a directive that contained our pie chart, this would\
    \ be simple. We can just copy and paste the `<pie-chart>` element in our html\
    \ without having to write any JavaScript.\n\n```\n<pie-chart></pie-chart>\n<pie-chart></pie-chart>\n\
    ```\n\nThis also makes it easier for people that didn't write our pie chart, since\
    \ they don't need to know the pie chart works to use it.\n\nIf we write our visualizations\
    \ in directives, we also get a lot of other advantages for free. Namely, we can\
    \ use Angular's other built-in directives like `ng-switch` to conditionally show\
    \ different visualizations. In this example we're conditionally showing either\
    \ a pie chart or bar chart view of the data depending on the state of the `selection`\
    \ scope variable.\n\n```\n<div ng-switch on=\"selection\">\n  <div ng-switch-when=\"\
    pie\">\n    <pie-chart></pie-chart>\n  </div>\n  <div ng-switch-default>\n   \
    \ <bar-chart></bar-chart>\n  </div>\n</div>\n```\n\nUsing another built-in Angular\
    \ directive, `ng-repeat`, we can easily create the effective data visualization\
    \ technique of small multiples allowing us to convey more information more effectively.\
    \ It does this by allowing us to reuse the same visualization a variable number\
    \ of times.\n\n```\n<div ng-repeat=\"races in incomes\">\n  <map ng-repeat=\"\
    race in races\"></map>\n</div>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_85_0.png)\n\
    \nLive version: http://vicapow.github.io/angular-d3-talk/slides/demos/life-expectancy/index.html\n\
    \nLastly, Angular makes it easy to create dynamic visualizations by handling updates\
    \ on the scope. This is often useful when creating visualizations that depend\
    \ on the state of some other visualization or when, say, you wanted two different\
    \ visualizations to update whenever a slider was moved.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_85_1.png)\n\
    \n## Model, View, Whatever\n\nMost web frameworks encourage developers to break\
    \ up their code into ether \"models\", \"views\", or \"controllers\" or (MVC).\
    \ We can think of them in the following way:\n\nModels: The information our application\
    \ wants to show or allow to be modified. Views: The components responsible for\
    \ showing or modifying that information or a \"view\" of the information. Controllers:\
    \ the logic responsible for properly connecting the two.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_86_0.png)\n\
    \nRemember to keep in mind that there's a difference between this general, informal\
    \ categorization of the parts of any application, and the types of components\
    \ that actually exist in our application. Some frameworks might share some of\
    \ these responsibilities across components or might call them something completely\
    \ different. In Angular specifically, there is no formal \"view\" class or function.\
    \ The \"view\" is just the DOM.\n\nIn Angular, for the most part, our viewers\
    \ and models are automatically connected. This automatic (or \"two-way\") data\
    \ binding is the default and occurs on what's called the \"scope\". Just by changing\
    \ a variable on the scope (aka, the model), it's change will automatically be\
    \ sent to the DOM. Because this isn't strictly MVC, the Angular community refers\
    \ to this pattern as \"Model, View, Whatever\" because you can loose a lot of\
    \ time contemplating exactly what pattern Angular falls into.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_86_1.png)"
  mdcn: "\n## 接下来做什么？\n\n本章将介绍一些额外的资源和继续探索 D3 的切入点。\n\n## 地图\n\nD3 内置了大量实用的方法，让地理数据的处理变得更加容易。D3\
    \ 结合 ogr2ogr 等命令行工具，可以轻松将 GIS shapefile 转换为 D3 能够读取并绘制成 SVG 的 JSON 格式（具体来说是 GeoJSON）。一个常见的应用场景是创建**分级统计图**（choropleth）以及其他常用于数据可视化的主题地图。\n\
    \n由于 GeoJSON 文件可能非常大，Mike Bostock 开发了另一个很棒的工具——[TopoJSON](link)。TopoJSON 是 GeoJSON\
    \ 的一种替代地图文件格式，它生成的文件*非常*小，因此在浏览器中加载速度更快。除了 TopoJSON 文件格式之外，还有 TopoJSON 库（用于读取该格式）和\
    \ TopoJSON 命令行程序（用于从 GeoJSON 文件创建 TopoJSON 文件）。关于创建地图的深入教程，请参阅 Mike Bostock 优秀的[Let's\
    \ Make a Map](link)教程。\n\n## 布局\n\nD3 提供了大量预置的[布局辅助函数](link)，让构建典型的模板化图表（如饼图、直方图和堆叠图）变得轻松。但\
    \ D3 **并不**提供像 `createPieChart` 这样的方法。相反，D3 提供的是让从零创建这些图表变得更简单的函数。让我们快速走读一个饼图示例来演示这一点。我们将结合两个新方法：`d3.svg.arc()`，它创建一个弧形生成器，以及\
    \ `d3.layout.pie()`。`pie()` 布局只是接收数据并生成 `arc()` 所需的必要参数。\n\n```\nvar data = [4,5,6];\n\
    var pie = d3.layout.pie();\nconsole.log(pie(data)); // =>\n[\n  { data:4, value:4,\
    \ startAngle:4.61, endAngle:6.28 },\n  { data:5, value:5, startAngle:2.51, endAngle:4.61\
    \ },\n  { data:6, value:6, startAngle:0, endAngle:2.51 }\n]\n```\n\n现在我们可以使用弧形生成器，将上述起始角度和结束角度转换为在\
    \ SVG 中绘制弧形路径所需的 d 属性值。\n\n```\n// 创建一个弧形生成器函数，将生成的弧形外半径设置为 `100`，内半径设置为 `0`\n\
    var arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n```\n\n```\nvar color\
    \ = d3.scale.category10();\nvar arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \  .enter().append('path')\n    .attr({ d: arc }) // 使用弧形生成器创建弧形路径\n    .style({\n\
    \      // 为每个弧形切片设置不同的颜色和白色边框\n      fill: function(d, i){ return color(i) },\n\
    \      stroke: 'white'\n    })\n```\n\n以下是完整的代码。注意包含的 g 元素和 (200,200) 的平移变换，这样饼图的中心就不会卡在\
    \ svg 的左上角了。\n\n```\n<!DOCTYPE html>\n<html>\n  <body>\n    <script src=\"http://d3js.org/d3.v3.min.js\"\
    \ charset=\"utf-8\"></script>\n    <script>\n      var vis = d3.select('body').append('svg').append('g')\n\
    \          .attr('transform', 'translate(200,200)');\n      var color = d3.scale.category10();\n\
    \      var arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n      var pie\
    \ = d3.layout.pie();\n      var arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \        .enter().append('path').attr({\n            d: arc,\n            fill:\
    \ function(d, i){ return color(i) },\n            stroke: 'white'\n        });\n\
    \    </script>\n  </body>\n</html>\n```\n\n还有更多这样的布局，所以如果你发现自己正在创建一个相当常见的图表类型，一定要先找找看是否有现成的布局辅助函数。\n\
    \n## 插件和其他工具\n\n可敬的 Mike Bostock 和其他人收集了一些常见的 [D3 插件](https://github.com/d3/d3-plugins)，这些插件似乎还没有必要纳入\
    \ D3 核心，但在某些时候却极其有用。其中最有趣的之一是 d3.fisheye 插件，它应用了一种扭曲的鱼眼镜头效果，在聚焦于较大元素集合中的某一部分时非常有用。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_83_0.png)\n\n有一些常用工具经常与 D3 一起使用。其中最重要的可能是\
    \ [Crossfilter](http://square.github.com/crossfilter/)。可以将 Crossfilter 视为 D3 数组辅助函数的更快替代方案。借助它，可以快速对海量数据（数百万行）进行排序和筛选。\n\
    \n## Angular 简介\n\n到目前为止，我们只关注 D3，但在接下来的章节中，我们将看看一些有趣的方式，将 D3 与 Angular 结合，使我们的可视化更加模块化、可复用和交互化。这还有一个好处，就是让我们更容易在脑海中构思它们，也让我们在几个月后忘掉可视化的所有细节之后，更容易回过头来理解。\n\
    \n## 关于 Angular\n\nAngular 是一个让创建（Web）应用变得更加容易的框架，但它也非常适合交互式可视化。它通过强制我们将应用拆分成执行特定类型任务的模块来实现这一点。这样拆分代码让组件可以方便地被替换为其他组件。它还有助于将我们的组件与其他组件连接起来，让一个可视化可以由另一个驱动，或者当底层数据变化时自动更新自身。\n\
    \nAngular 有很多功能，但大多数与数据可视化没有直接关系。要更深入地了解 Angular，请查看 Ari 的 ng-book。\n\n## 用于交互式和可复用数据可视化的\
    \ Angular\n\n使用 Angular 进行数据可视化有很多理由，但最重要的是**指令**（directives）。指令让创建可复用的可视化变得更加容易。本质上，它们是我们创建自己的\
    \ HTML 元素的方式，这些元素的行为就像浏览器内置的 HTML 标签一样。想象一下，我们刚刚创建了一个想要再次复用的饼图可视化。如果我们创建了一个包含饼图的指令，这就很简单了。我们只需要在\
    \ html 中复制粘贴 `<pie-chart>` 元素，而无需编写任何 JavaScript。\n\n```\n<pie-chart></pie-chart>\n\
    <pie-chart></pie-chart>\n```\n\n这也让没有编写我们饼图的人更容易使用，因为他们不需要知道饼图是如何工作的就能使用它。\n\n\
    如果我们在指令中编写可视化，我们还能免费获得很多其他优势。具体来说，我们可以使用 Angular 的其他内置指令，如 `ng-switch`，来条件性地显示不同的可视化。在这个例子中，我们根据\
    \ `selection` 作用域变量的状态，条件性地显示饼图或条形图的数据视图。\n\n```\n<div ng-switch on=\"selection\"\
    >\n  <div ng-switch-when=\"pie\">\n    Checkpoint encountered!\n\nI'll continue\
    \ from where I left off:\n\n    <pie-chart></pie-chart>\n  </div>\n  <div ng-switch-default>\n\
    \    <bar-chart></bar-chart>\n  </div>\n</div>\n```\n\n使用另一个内置的 Angular 指令 `ng-repeat`，我们可以轻松创建有效的小倍数（small\
    \ multiples）数据可视化技术，让我们能够更有效地传达更多信息。它通过让我们以可变次数复用同一个可视化来实现这一点。\n\n```\n<div ng-repeat=\"\
    races in incomes\">\n  <map ng-repeat=\"race in races\"></map>\n</div>\n```\n\n\
    ![](img/82f49fe8a368850935eb7606dfa7579d_85_0.png)\n\n实时版本：http://vicapow.github.io/angular-d3-talk/slides/demos/life-expectancy/index.html\n\
    \n最后，Angular 通过处理作用域上的更新，让创建动态可视化变得容易。这在创建依赖于其他可视化状态的可视化时，或者当你希望两个不同的可视化在滑块移动时自动更新时，特别有用。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_85_1.png)\n\n## 模型、视图、 Whatever\n\n\
    大多数 Web 框架鼓励开发者将代码拆分为\"模型\"（models）、\"视图\"（views）或\"控制器\"（controllers），即 MVC。我们可以这样理解它们：\n\
    \n**模型**（Models）：我们的应用想要展示或允许修改的信息。\n\n**视图**（Views）：负责展示或修改这些信息的组件，或者说是信息的\"\
    视图\"。\n\n**控制器**（Controllers）：负责将两者正确连接起来的逻辑。\n\n![](img/82f49fe8a368850935eb7606dfa7579d_86_0.png)\n\
    \n请记住，在任何应用中，这种通用的、非正式的各部分分类方式，与实际存在于我们应用中的组件类型之间是有区别的。有些框架可能会将这些职责跨组件共享，或者给它们起完全不同的名字。在\
    \ Angular 中特别要注意的是，没有正式的\"视图\"类或函数。\"视图\"就是 DOM。\n\n在 Angular 中，在大多数情况下，我们的视图和模型是自动连接的。这种自动（或\"\
    双向\"）数据绑定是默认的，发生在所谓的\"作用域\"（scope）上。只需改变作用域上的一个变量（即模型），它的变化就会自动传递到 DOM。因为这并不严格是\
    \ MVC，Angular 社区将这种模式称为\"Model, View, Whatever\"，因为你可能会花很多时间思考 Angular 到底属于哪种模式。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_86_1.png)\n"
