    \ create a new scope on its own. The simplest way to create a new scope is to\
    \ first create a “controller”. Controllers are normally used to modify scope variables\
    \ programmatically in JavaScript. Whenever we create and use a new controller,\
    \ a new scope is also created for it. Working from our previous example, lets\
    \ see what it looks like to create and use a controller to create new scopes.\n\
    \nWe first need to create a module to put our controller on.\n\n```\nvar app =\
    \ angular.module('myApp', []);\n```\n\nNext, we’ll create a controller called\
    \ ‘HelloController’ that just creates a variable on its new scope called ourRangeValue.\n\
    \n```\napp.controller('HelloController', function($scope){\n    $scope.ourRangeValue\
    \ = 50;\n});\n```\n\nTo use it, we need to remember to use our module in the <body>\
    \ tags ng-app.\n\n```\n<body ng-app=\"myApp\">\n```\n\nNext, we’ll use our new\
    \ controller twice using ng-controller=\"HelloController\" on a <div> tag. Now\
    \ the scopes inside the <div> will inherit from the new controllers created for\
    \ each HelloController.\n\n```\n<body ng-app=\"myApp\">\n  <div ng-controller=\"\
    HelloController\">\n    <input type=\"range\" ng-model=\"ourRangeValue\">\n  \
    \  <input type=\"range\" ng-model=\"ourRangeValue\">\n  </div>\n  <div ng-controller=\"\
    HelloController\">\n    <input type=\"range\" ng-model=\"ourRangeValue\">\n  \
    \  <input type=\"range\" ng-model=\"ourRangeValue\">\n  </div>\n</body>\n```\n\
    \nLive version: http://jsbin.com/hite/1/edit\n\nTwo scopes were created inside\
    \ our apps root scope. One for the first `HelloController` and another one for\
    \ the second. `ourRangeValue` will be a different property on each of these two\
    \ inner scopes. This has the effect of binding the first two range slides to the\
    \ value of `ourRangeValue` on the first scope and the second two range sliders\
    \ to the value of `ourRangeValue` on the second scope.\n\nInner scopes inherit\
    \ from their outer scopes. This means that if the `ourRangeValue` wasn’t found\
    \ on the `HelloController` scope, its outer scope would have been checked for\
    \ a property named `ourRangeValue` and so on until the root scope was checked.\n\
    \n# Scope inheritance\n\nng-init is used to initialize properties on the scope\
    \ of the current element. In the following example,"
  - '[PAGE 97]


    a property called foobar on the root scope is given the value 50. (The HelloController
    is unchanged from the previous examples.) We might expect that all of the range
    sliders would now be bound to the same foobar element in the outer scope but they
    are not. Instead, a new foobar property is created on each of the inner HelloController
    scopes.


    ```

    1  <body ng-app="myApp" ng-init="foobar=50">

    2    <div ng-controller="HelloController">

    3      <input type="range" ng-model="foobar">

    4      <input type="range" ng-model="foobar">

    5    </div>

    6    <div ng-controller="HelloController">

    7      <input type="range" ng-model="foobar">

    8      <input type="range" ng-model="foobar">

    9    </div>

    10  </body>

    ```


    ![](img/82f49fe8a368850935eb7606dfa7579d_97_0.png)


    This can be somewhat unexpected behavior but makes sense when considering that
    scope inheritance works the same as regular JavaScript inheritance. The following
    snippet illustrates what’s happening inside of Angular.


    ```

    1  var rootScope = { foobar: 50 };

    2  var scope1 = Object.create(rootScope);  // scope1 inherits from rootScope

    3  var scope2 = Object.create(rootScope);  // scope2 inherits from rootScope

    4  // scope1.foobar is 50

    5  // scope2.foobar is 50

    6  rootScope.foobar = 100;  // changing `rootScope.foobar` works as expected

    7  // scope1.foobar is 100

    8  // scope2.foobar is 100

    9  scope1.foobar = 2;  // but assigning a value to `foobar` creates a new

    10  // property on the child scope which shadows `rootScope.foobar`.

    11  // rootScope.foobar is 100 instead of 2

    ```


    > If this is still somewhat confusing, a longer form review of JavaScript prototype
    chaining and inheritance may be helpful. We recommend this blog post by Sebastian
    Porto


    One way to fix this is to use another object as a wrapper to prevent shadowing
    properties of the parent scope. In this way, we’re never assigning a new value
    to the foobar property.


    ```

    1  var rootScope = { foobar: { value: 50 } };

    2  var scope1 = Object.create(rootScope);  // scope1 inherits from rootScope

    3  var scope2 = Object.create(rootScope);  // scope2 inherits from rootScope

    4  // scope1.foobar.value is 50

    5  // scope2.foobar.value is 50

    6  rootScope.foobar.value = 100;

    7  // scope1.foobar.value is 100

    8  // scope2.foobar.value is 100

    9  scope1.foobar.value = 2;

    10  // rootScope.foobar.value is 2

    ```'
- md: "Using this knowledge of scope inheritance, let's update the previous example.\n\
    \n```html\n<body ng-app=\"myApp\" ng-init=\"foobar = { value: 50 }\">\n  <div\
    \ ng-controller=\"HelloController\">\n    <input type=\"range\" ng-model=\"foobar.value\"\
    >\n    <input type=\"range\" ng-model=\"foobar.value\">\n  </div>\n  <div ng-controller=\"\
    HelloController\">\n    <input type=\"range\" ng-model=\"foobar.value\">\n   \
    \ <input type=\"range\" ng-model=\"foobar.value\">\n  </div>\n</body>\n```\n\n\
    Live version: [http://jsbin.com/finijaru/1/edit](http://jsbin.com/finijaru/1/edit)\n\
    \nNow whenever an `<input>` range slider is adjusted, the same root scope `foobar.value`\
    \ property is updated and shared across all of the inner controller scopes.\n\n\
    ## Making visualizations dynamic with $watch\n\n### scope.$watch\n\nUsing Angular's\
    \ built-in directives makes it easy to do simple things like binding the changes\
    \ of a range slider to another but for complicated visualizations, we'll need\
    \ to create our own directives that watch for changes on the scope and update\
    \ their contents in response to these changes. Let's walk through a simple example\
    \ of a visualization directive that updates its contents in response to changes\
    \ to its data. Specifically we'll create a `<progress-bar>` directive. Its `progress`\
    \ scope property will be a number that represents the loading bar's progression\
    \ from 0 to 100 percent. Whenever this `progress` property changes, we'll need\
    \ to update the progress bar `<rect>`.\n\nTo allow for this type of task, scope\
    \ objects have a function called `$watch()` that we'll pass two arguments. The\
    \ first argument is the scope variable we'd like to watch, the second is the function\
    \ that should be called whenever a change is detected on that property. For our\
    \ `<progress-bar>` directive this might look the following:\n\n```javascript\n\
    scope.$watch('progress', function(progress){\n  rect.attr({x: 0, y: 0, width:\
    \ width * progress / 100, height: height });\n});\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_98_0.png)\n\
    \nLive version: [http://jsbin.com/vagiq/3/edit](http://jsbin.com/vagiq/3/edit)\n\
    \nEvery time the slider is dragged, the `ng-model` directive on the range slider\
    \ updates the scope variable `progress`. Then, the `scope.$watch('progress', ...)`\
    \ callback is called in the `progress-bar`.\n\nThis might not feel very \"automatic\"\
    . We still have to manually watch for changes to the scope when we're *building*\
    \ our own directives. The advantage is that our directive can now be placed into\
    \ other places and all of this \"wiring up\" will happen automatically. For example,\
    \ we could copy and paste our directive a few times and watch as changes to the\
    \ range slider updates all of the progress bars.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_99_0.png)\n\
    \nLive version: [http://jsbin.com/hadi/1/edit](http://jsbin.com/hadi/1/edit)\n\
    \nOr we could create an array of progresses and use an `ng-repeat` to create several\
    \ slider and progress bars for each.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_99_1.png)\n\
    \nLive version: [http://jsbin.com/manon/1/edit](http://jsbin.com/manon/1/edit)\n\
    \n## Let's make a dynamic donut chart\n\nNow that we understand how we can make\
    \ directives that update dynamically, let's work through a more complicated example\
    \ of a dynamically updating visualization. We'll take the donut chart directive\
    \ from the previous chapter and make it dynamic so that we can change its data\
    \ and the visualization will update accordingly.\n\nLive version: [http://jsbin.com/yili/6/edit](http://jsbin.com/yili/6/edit)\n\
    \nTo start off, we first need to be able to modify the data the chart is displaying.\
    \ Three `<input>` range sliders will do the trick but we could have used any method\
    \ to update the data. The directive doesn’t know or care how its data gets modified.\n\
    \n```html\n1 <body ng-app=\"myApp\" ng-init=\"chart=[10, 20, 30]\">\n2   <input\
    \ type=\"range\" ng-model=\"chart[0]\">\n3   <br>\n4   <input type=\"range\" ng-model=\"\
    chart[1]\">\n5   <br>\n6   <input type=\"range\" ng-model=\"chart[2]\">\n7   <br>\n\
    8   <donut-chart data=\"chart\"></donut-chart>\n9 </body>\n```\n\nLive version:\
    \ [http://jsbin.com/waqep/1/edit](http://jsbin.com/waqep/1/edit)\n\nThe directive\
    \ doesn’t update yet because it’s not watching for changes to its data scope variable.\
    \ To fix that, we’ll just use the `$watch` function like before.\n\n```javascript\n\
    1 scope.$watch('data', function(data){\n2   console.log(\"an element within `data`\
    \ changed!\");\n3   console.log(data);\n4 }, true);\n```\n\nLive version: [http://jsbin.com/waqep/3/edit](http://jsbin.com/waqep/3/edit)\n\
    \nOne important difference is that we’re now giving `$watch` an extra third variable\
    \ `true`. This tells `$watch` to also watch for changes within data itself. Otherwise,\
    \ changing the first element of data by doing `data[0]=45` would not trigger the\
    \ `$watch` callback because data is still the same array after the change. It\
    \ just has a different value for its first element.\n\n> `$watch` callbacks will\
    \ not be fired for changes to the elements of arrays unless you pass `true` as\
    \ the third argument. Otherwise, the `$watch` callback will only fire if the array\
    \ being watched becomes an entirely new array.\n\nThe last step is to update the\
    \ arc `<path>` tags when the data changes since they are the only part of our\
    \ visualization that depend on the data. Since we’ll be updating the arcs in the\
    \ `$watch` we need to give the `<path>` arc selector a name to refer to later.\
    \ We also don’t need to set the arcs `d` property anywhere except when the data\
    \ changes in the `$watch`.\n\n```javascript\n1 var arcs = g.selectAll('path').data(pie(data))\n\
    2   .enter().append('path')\n3     .style('stroke', 'white')\n4     .attr('fill',\
    \ function(d, i){ return color(i) });\n```\n\n```javascript\nscope.$watch('data',\
    \ function(){\n    arcs.data(pie(data)).attr('d', arc);\n}, true);\n```\n\nLive\
    \ version: [http://jsbin.com/jiqoz/1/edit](http://jsbin.com/jiqoz/1/edit)\n\n\
    ![](img/82f49fe8a368850935eb7606dfa7579d_101_0.png)\n\nOur Donut chart is lookin'\
    \ good! But it always has to have the same number of slices as it started with.\
    \ It would be better if we could instead add or remove elements from the chart\
    \ array and have the donut chart appropriately add or remove slices. We can do\
    \ this by having our `$watch` be responsible for adding or removing the necessary\
    \ arc `<path>` tags and combination with d3's `.enter()` and `.exit()` selections.\
    \ If some of this syntax is still a bit unclear, refer back to chapter 2 for a\
    \ refresher on how selections work in D3.\n\n```javascript\nvar arcs = g.selectAll('path');\n\
    scope.$watch('data', function(data){\n    arcs = arcs.data(pie(data));\n    arcs.exit().remove();\
    \ // remove path tags that no longer have data\n    arcs.enter().append('path')\
    \ // or add path tags if there's more data\n      .style('stroke', 'white')\n\
    \      .attr('fill', function(d, i){ return color(i) });\n    arcs.attr('d', arc);\
    \ // update all the `<path>` tags\n}, true);\n```\n\nNext, we need some way to\
    \ increase or decrease the elements in `chart`. For this, we can use two buttons,\
    \ one for adding elements to chart, another for removing elements.\n\n```html\n\
    <body ng-app=\"myApp\" ng-init=\"chart=[10, 20, 30]\">\n  <button ng-click=\"\
    chart.push(50)\">add slice</button>\n  <button ng-click=\"chart.pop()\">remove\
    \ slice</button>\n  <!-- ... -->\n</body>\n```\n\nWe also need some way to add\
    \ the `<input>` range sliders for each slice (or element) in the chart array.\
    \ For this, we can use an `ng-repeat`.\n\n```html\n<input type=\"range\" ng-model=\"\
    slice\" ng-repeat=\"slice in chart\">\n```\n\nHowever, when you run this code,\
    \ you'll notice a problem. Angular throws an error:\n\n> Error: [ngRepeat:dupes]\
    \ Duplicates in a repeater are not allowed. Use 'track by' expression to specify\
    \ unique keys. Repeater: slice in chart, Duplicate key: number:20\n\nLive version:\
    \ [http://jsbin.com/leco/1/edit](http://jsbin.com/leco/1/edit)\n\nWhat Angular\
    \ is telling us is that every element in an `ng-repeat` needs to be unique. However,\
    \ we can tell Angular to use the element's index within the array instead to determine\
    \ uniqueness by adding `track by $index` after `slice in chart`.\n\n```html\n\
    1 <input type=\"range\"\n2   ng-model=\"slice\" ng-repeat=\"slice in chart track\
    \ by $index\">\n```\n\nAdding this stops any errors from being thrown and adding\
    \ or removing slices seems to work but dragging a slider has no effect on the\
    \ visualization. The `chart` array is not being modified by the slider values.\
    \ This is another reincarnation of scope inheritance we mentioned earlier in this\
    \ chapter. `ng-repeat` creates a new scope for each `<input>` tag. And when a\
    \ range value gets updated, it's updating its `slice` property which isn't shared\
    \ with its parent.\n\nLive version: [http://jsbin.com/wadev/1/edit](http://jsbin.com/wadev/1/edit)\n\
    \nWe can fix it the same way as before by using a wrapper object. Doing so, we\
    \ can safely modify its properties without having to worry about shadowing properties\
    \ from the parent scope.\n\n```html\n1 <body ng-app=\"myApp\" ng-init=\"chart=[{value:\
    \ 10}, {value: 20}, {value: 30}]\">\n2   <donut-chart data=\"chart\" style=\"\
    float:right\"></donut-chart>\n3   <button ng-click=\"chart.push({value: 10})\"\
    >add slice</button>\n4   <button ng-click=\"chart.pop()\">remove slice</button>\n\
    5   <input type=\"range\" ng-model=\"slice.value\"\n6     ng-repeat=\"slice in\
    \ chart track by $index\">\n```\n\nOur directive now has to be updated so that\
    \ it can access the slice value of each object in the data array. Because the\
    \ pie layout is the only thing that uses `data` directly, we can give `pie` a\
    \ value accessor and it will take care of plucking the pie chart value out of\
    \ each object in the data array.\n\n```javascript\n1 pie.value(function(d){ return\
    \ d.value; });\n```"
  mdcn: "\n利用这种作用域继承的知识，让我们更新前面的示例。\n\n```html\n<body ng-app=\"my自检发现遗漏，重新翻译最后一段：Content](/content)\n\
    \n利用这种作用域继承的知识，让我们更新前面的示例。\n\n```html\n<body ng-app=\"myApp\" ng-init=\"foobar\
    \ = { value: 50 }\">\n  <div ng-controller=\"HelloController\">\n    <input type=\"\
    range\" ng-model=\"foobar.value\">\n    <input type=\"range\" ng-model=\"foobar.value\"\
    >\n  </div>\n  <div ng-controller=\"HelloController\">\n    <input type=\"range\"\
    \ ng-model=\"foobar.value\">\n    <input type=\"range\" ng-model=\"foobar.value\"\
    >\n  </div>\n</body>\n```\n\n在线版本：[http://jsbin.com/finijaru/1/edit](http://jsbin.com/finijaru/1/edit)\n\
    \n现在，每当调整 `<input>` 范围滑块时，同一个根作用域的 `foobar.value` 属性会被更新，并在所有内部控制器作用域之间共享。\n\n\
    ## 使用 $watch 让可视化动态化\n\n### scope.$watch\n\n使用 Angular 的内置指令可以轻松实现诸如将范围滑块的变化绑定到另一处等简单操作，但对于复杂的可视化，我们需要创建自己的指令来监视作用域的变化，并根据这些变化更新其内容。让我们来看一个简单的可视化指令示例，它会在数据变化时更新其内容。具体来说，我们将创建一个\
    \ `<progress-bar>` 指令。其 `progress` 作用域属性将是一个数字，表示加载进度从 0 到 100 的百分比。每当这个 `progress`\
    \ 属性发生变化时，我们需要更新进度条的 `<rect>`。\n\n为了完成这类任务，作用域对象提供了一个名为 `$watch()` 的函数，我们需要向它传递两个参数。第一个参数是我们希望监视的作用域变量，第二个参数是在该属性检测到变化时应调用的函数。对于我们的\
    \ `<progress-bar>` 指令，代码可能如下所示：\n\n```javascript\nscope.$watch('progress', function(progress){\n\
    \  rect.attr({x: 0, y: 0, width: width * progress / 100, height: height });\n\
    });\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_98_0.png)\n\n在线版本：[http://jsbin.com/vagiq/3/edit](http://jsbin.com/vagiq/3/edit)\n\
    \n每次拖动滑块时，范围滑块上的 `ng-model` 指令会更新作用域变量 `progress`。然后，`progress-bar` 中的 `scope.$watch('progress',\
    \ ...)` 回调就会被调用。\n\n这可能让人感觉不太\"自动\"。在*构建*自己的指令时，我们仍然需要手动监视作用域的变化。好处在于，我们的指令现在可以放置到其他位置，所有这些\"\
    接线\"工作都会自动完成。例如，我们可以复制粘贴几次我们的指令，然后观察范围滑块的变化如何更新所有进度条。\n\n![](img/82f49fe8a368850935eb7606dfa7579d_99_0.png)\n\
    \n在线版本：[http://jsbin.com/hadi/1/edit](http://jsbin.com/hadi/1/edit)\n\n或者我们可以创建一个进度数组，并使用\
    \ `ng-repeat` 为每个进度创建多个滑块和进度条。\n\n![](img/82f49fe8a368850935eb7606dfa7579d_99_1.png)\n\
    \n在线版本：[http://jsbin.com/manon/1/edit](http://jsbin.com/manon/1/edit)\n\n## 让我们制作一个动态环形图\n\
    \n既然我们已经了解了如何制作动态更新的指令，让我们来完成一个更复杂的动态更新可视化示例。我们将呛咳_FROM]前面的章节中获取环形图指令，并使其动态化，以便我们可以更改其数据，可视化效果会相应更新。\n\
    \n在线版本：[http://jsbin.com/yili/6/edit](http://jsbin.com/yili/6/edit)\n\n首先，我们需要能够修改图表显示的数据。三个\
    \ `<input>` 范围滑块就可以达到目的，但我们也可以使用任何方法来更新数据。指令不知道也不关心其数据是如何被修改的。\n\n```html\n1 <body\
    \ ng-app=\"myApp\" ng-init=\"chart=[10, 20, 30]\">\n2   <input type=\"range\"\
    \ ng-model=\"chart[0]\">\n3   <br>\n4   <input type=\"range\" ng-model=\"chart[1]\"\
    >\n5   <br>\n6   <input type=\"range\" ng-model=\"chart[2]\">\n7   <br>\n8   <donut-chart\
    \ data=\"chart\"></donut-chart>\n9 </body>\n```\n\n在线版本：[http://jsbin.com/waqep/1/edit](http://jsbin.com/waqep/1/edit)\n\
    \n指令还没有更新，因为它没有在监视其数据作用域变量的变化。为了解决这个问题，我们将像之前一样使用 `$watch` 函数。\n\n```javascript\n\
    1 scope.$watch('data', function(data){\n2   console.log(\"an element within `data`\
    \ changed!\");\n3   console.log(data);\n4 }, true);\n```\n\n在线版本：[http://jsbin.com/waqep/3/edit](http://jsbin.com/waqep/3/edit)\n\
    \n一个重要的区别是，我们现在给 `$watch` 传入了一个额外的第三个变量 `true`。这告诉 `$watch` 也要监视 data 内部的变化。否则，通过执行\
    \ `data[0]=45` 来改变 data 的第一个元素将不会触发 `$watch` 回调，因为变化后 data 仍然是同一个数组。只是它的第一个元素的值不同了。\n\
    \n> 除非你传入 `true` 作为第三个参数，否则 `$watch` 回调不会因数组元素的变化而触发。否则，`$watch` 回调只会在被监视的数组变成一个全新的数组时才会触发。\n\
    \n最后一步是在数据变化时更新圆弧 `<path>` 标签，因为它们是我们可视化中唯一依赖数据的部分。由于我们将在 `$watch` 中更新圆弧，所以需要给\
    \ `<path>` 圆弧选择器起一个名字以便稍后引用。我们也不需要在任何地方设置圆弧的 `d` 属性，除了在 `$watch` 中数据变化的时候。\n\n\
    ```javascript\n1 var arcs = g.selectAll('path').data(pie(data))\n2   .enter().append('path')\n\
    3     .style('stroke', 'white')\n4     .attr('fill', function(d, i){ return color(i)\
    \ });\n```\n\n```javascript\nscope.$watch('data', function(){\n    arcs.data(pie(data)).attr('d',\
    \ arc);\n}, true);\n```\n\n在线版本：[http://jsbin.com/jiqoz/1/edit](http://jsbin.com/jiqoz/1/edit)\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_101_0.png)\n\n我们的环形图看起来不错！但它总是必须保持与开始时相同数量的扇区。如果我们能够向图表数组中添加或删除元素，并让环形图相应地添加或删除扇区，那会更好。我们可以通过让\
    \ `$watch` 负责添加或删除必要的圆弧 `<path>` 标签，并结合使用 d3 的 `.enter()` 和 `.exit()` 选择来实现这一点。如果其中一些语法仍不太清楚，请返回第二章复习\
    \ D3 中选择的工作原理。\n\n```javascript\nvar arcs = g.selectAll('path');\nscope.$watch('data',\
    \ function(data){\n    arcs = arcs.data(pie(data));\n    arcs.exit().remove();\
    \ // 删除不再有数据的 path 标签\n    arcs.enter().append('path') // 或者有更多数据时添加 path 标签\n\
    \      .style('stroke', 'white')\n      .attr('fill', function(d, i){ return color(i)\
    \ });\n    arcs.attr('d', arc); // 更新所有 `<path>` 标签\n}, true);\n```\n\n接下来，我们需要某种方法来增加或减少\
    \ `chart` 中的元素。为此，我们可以使用两个按钮，一个用于向 chart 添加元素，另一个用于删除元素。\n\n```html\n<body ng-app=\"\
    myApp\" ng-init=\"chart=[10, 20, 30]\">\n  <button ng-click=\"chart.push(50)\"\
    >add slice</button>\n  <button ng-click=\"chart.pop()\">remove slice</button>\n\
    \  <!-- ... -->\n</body>\n```\n\n我们还需要某种方法来为 chart 数组中的每个扇区（或元素）添加 `<input>` 范围滑块。为此，我们可以使用\
    \ `ng-repeat`。\n\n```html\n<input type=\"range\" ng-model=\"slice\" ng-repeat=\"\
    slice in chart\">\n```\n\n然而，当你运行这段代码时，你会发现一个问题。Angular 抛出一个错误：\n\n> Error: [ngRepeat:dupes]\
    \ Duplicates in a repeater are not allowed. Use 'track by' expression to specify\
    \ unique keys. Repeater: slice in chart, Duplicate key: number:20\n\n在线版本：[http://jsbin.com/leco/1/edit](http://jsbin.com/leco/1/edit)\n\
    \nAngular 想告诉我们的是，`ng-repeat` 中的每个元素都需要是唯一的。不过，我们可以通过添加 `track by $index` 在 `slice\
    \ in chart` 之后，告诉 Angular 使用元素在数组中的索引来确定唯一性。\n\n```html\n1 <input type=\"range\"\
    \n2   ng-model=\"slice\" ng-repeat=\"slice in chart track by $index\">\n```\n\n\
    添加这个之后，就不会再抛出任何错误，而且添加或删除扇区似乎也能正常工作了，但拖动滑块对可视化没有任何影响。`chart` 数组没有被滑块的值修改。这是本章前面提到的作用域继承问题的另一种体现。`ng-repeat`\
    \ 为每个 `<input>` 标签创建一个新的作用域。当范围值更新时，它更新的是其 `slice` 属性，而这并不会与其父级共享。\n\n在线版本：[http://jsbin.com/wadev/1/edit](http://jsbin.com/wadev/1/edit)\n\
    \n我们可以用与之前相同的方法来解决这个问题，即使用一个包装对象。这样做之后，我们可以安全地修改其属性，而不必担心会遮蔽父作用域的属性。\n\n```html\n\
    1 <body ng-app=\"myApp\" ng-init=\"chart=[{value: 10}, {value: 20}, {value: 30}]\"\
    >\n2   <donut-chart data=\"chart\" style=\"float:right\"></donut-chart>\n3   <button\
    \ ng-click=\"chart.push({value: 10})\">add slice</button>\n4   <button ng-click=\"\
    chart.pop()\">remove slice</button>\n5   <input type=\"range\" ng-model=\"slice.value\"\
    \n6     ng-repeat=\"slice in chart track by $index\">\n```\n\n我们的指令现在需要更新，以便能够访问数据数组中每个对象的\
    \ slice 值。因为饼图布局是唯一直接使用 `data` 的部分，我们可以给 `pie` 一个值访问器（value accessor），它会负责从数据数组的每个对象中提取饼图值。\n\
    \n```javascript\n1 pie.value(function(d){ return d.value; });\n```\n"
