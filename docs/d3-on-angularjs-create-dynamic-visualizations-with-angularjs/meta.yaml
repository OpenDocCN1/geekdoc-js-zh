  - "[PAGE 32]\n\n# SVG group\n\nThe `<g>` tag is an easy way to group SVG elements.\
    \ Any transformations (positioning, scaling, rotating) that are applied to the\
    \ group element will also be applied to each of the child elements.\n\nUsing groups,\
    \ we could, for example, create a collection of SVG elements that draw a car using\
    \ circles for wheels, and rectangles for axles. If we then wanted to rotate the\
    \ car, we could simply apply the transformation to the `<g>` element containing\
    \ all the components.\n\n# SVG style\n\nStyling SVG elements is almost exactly\
    \ the same as styling HTML elements. We can still use CSS with `id` and `class`\
    \ attributes to connect our CSS with our SVG elements or simply apply the style\
    \ directly using the `style` attribute.\n\nThe only difference is that a large\
    \ number of the styles differ from what we except from experience with HTML.\n\
    \nTake for example the HTML `background-color: orange;` style. The closest equivalent\
    \ for an SVG element is `fill: orange;`. Similarly, what we expect as of `border-color:\
    \ blue` equivalent in SVG is `stroke: blue;` or `border-width: 10px;` and `stroke-width:\
    \ 10;` This is an important detail and a common gotcha when working with SVG coming\
    \ from an HTML background.\n\n```\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <style>\n\
    \      svg path {\n        stroke: red;\n        stroke-width: 30px;\n       \
    \ fill: white;\n      }\n      svg text {\n        font-size: 30px;\n        font-family:\
    \ sans-serif;\n        fill:red;  /* not `color` or `font-color` */\n      }\n\
    \    </style>\n  </head>\n  <body>\n    <svg>\n      <path d=\"M 30 20 L 140 200\
    \ L 240 20 z\"></path>\n      <text x=\"95\" y=\"80\">YIELD</text>\n    </svg>\n\
    \  </body>\n</html>\n```"
  - "[PAGE 33]\n\n![](img/82f49fe8a368850935eb7606dfa7579d_33_0.png)\n\nLive version:\
    \ [http://jsbin.com/iXiglFe/1/edit](http://jsbin.com/iXiglFe/1/edit)\n\nIt's possible\
    \ to place these styles directly on the elements themselves. Using CSS to do so\
    \ is generally much easier and more recommended as it is easier to maintain and\
    \ read.\n\n> **Common gotcha:**\n\nKeep in mind that for SVG elements, transformations\
    \ are applied using the `transform` attribute, unless HTML elements, which use\
    \ a `transform` CSS property.\n\n# More on SVG\n\n# Transparency\n\nSVG supports\
    \ drawing with transparency, which we can do one of two ways. We can either set\
    \ the `opacity` attribute directly on an element or we can set the `rgba` as a\
    \ color, where the fourth argument is the transparency (also known as the alpha\
    \ value).\n\nWe can set the opacity of an SVG element just like we set any other\
    \ attribute:\n\n```\nd3.select('body').append('svg')\n    .attr('width', '300px')\n\
    \    .attr('height', '200px')\n    .data([1,2,3])\n    .enter().append('circle')\n\
    \        .attr('fill', 'blue')\n        .attr('opacity', '0.4');\n```\n\nLive\
    \ version: [http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)"
  - "[PAGE 34]\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_0.png)\n\nAs we previously\
    \ mentioned, it's easy to combine the two attributes of `opacity` and `fill` using\
    \ the `rgba()` function, where we set both the color and the transparency in one\
    \ go.\n\n```\nd3.select('body').append('svg')\n   .attr('width', '300px')\n  \
    \ .attr('height', '200px')\n   .data([1,2,3])\n   .enter().append('circle')\n\
    \      .attr('fill', 'rgba(100, 200, 300, 0.4');\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_1.png)\n\
    \nLive version: [http://jsbin.com/UzIvodE/2/edit](http://jsbin.com/UzIvodE/2/edit)\n\
    \n# Strokes\n\nThere are more options at our disposal when it comes to the appearance\
    \ of shape strokes than just stroke thickness and color. There's also `stroke-linejoin`\
    \ which effects the corners of line segments, `stroke-linecap` which effects the\
    \ appearance of line ends in a similar way `stroke-linejoin` and also `stroke-dasharray`\
    \ which can be used to create a dashed line effect instead of the defualt solid\
    \ like.\n\n```\n<svg>\n   <line x1=\"20\" y1=\"20\"\n         x2=\"200\" y2=\"\
    200\"\n         stroke=\"blue\"\n         stroke-linecap=\"round\"\n         stroke-dasharray=\"\
    4,30\"\n         stroke-width=\"20\">\n   </line>\n</svg>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_34_2.png)\n\
    \nLive version: [http://jsbin.com/EBuciXuZ/1/edit](http://jsbin.com/EBuciXuZ/1/edit)\n\
    \n# Layering\n\nYou may run into situations where you have overlapping SVG elements\
    \ were one element should be behind another instead of in front. This can happen\
    \ when the order in which you add your SVG elements is not the same as their visual\
    \ depth order, bottom to top. With HTML we can fix this using the `z-index` CSS\
    \ property but that doesn't work for SVG elements. Instead, we'll have to remove\
    \ and re-add any elements we'd like to be on the every top of their parent element.\
    \ Luckily, D3 selections come with a nice helper method called `sort` for just\
    \ this problem. We can pass it our sort function and D3 will resort our selection\
    \ and update the DOM elements accordingly.\n\n```\nd3.selectAll('circles').sort(function(a,\
    \ b){\n   // assuming we've added our own `zIndex` data property\n   return a.zIndex\
    \ - b.zIndex;\n});\n```"
  - "[PAGE 35]\n\n# SVG and D3\n\nSVG can be somewhat tedious to use on it’s own but\
    \ after the previous introduction, we’ll rarely, if ever, need to write any SVG\
    \ directly.\n\nInstead, we’ll use D3 to create these elements and apply style\
    \ for us.\n\nWe’ll still need to know how SVG works to do master D3, but we will\
    \ let the library take care of the heavy lifting.\n\nNow that we’ve covered some\
    \ of the basics of SVG, we can begin to talk more about using it in combination\
    \ with D3.\n\n# From nothing to SVG\n\nWhen we first start up the page, we’ll\
    \ need a place to place our SVG elements. As stated above, we can only place our\
    \ elements inside of an `<svg>` tag. Sometimes it’s more convenient (especially\
    \ when we integrate with using directives) to not place this directly on the page.\n\
    \nWe can use d3 to make our svg, like so:\n\n```\nvar svg = d3.select(\"body\"\
    )\n        .append(\"svg\");\n```\n\nWith the svg variable, we can now reference\
    \ the `<svg>` element and interact with our D3 stage at any time. It’s possible\
    \ to use the same methods on the `<svg>` element that we’ll use on the D3 elements\
    \ to set attributes on it.\n\nFor instance, let’s set a height and a width:\n\n\
    ```\nd3.select('body').append('svg')\n  .attr('width', 300)\n  .attr('height',\
    \ 200);\n```\n\n# Generators\n\nOne of the nicest parts of D3, is it’s focus on\
    \ making SVG element creation manageable through D3’s generators.\n\nGenerators\
    \ play the part of both objects and functions. Generators are functions, like\
    \ any other function that has additional methods to allow us to change it’s behavior.\
    \ Just like any other D3 class, most generator methods return themselves so we\
    \ can chain methods on top of them.\n\nOnce we’ve configured our generators for\
    \ our needs, we’ll use them to *generate* the necessary SVG commands to create\
    \ our shape.\n\nLet’s look at a very simple example, the line generator:\n\nThe\
    \ `line` generator takes any data that we pass it and generators the necessary\
    \ SVG `<path>` d attribute commands. In order to use the path generator, we need\
    \ to tell it a little about the format of our data. We do this by defining `accessor`\
    \ functions for the x and y coordinates of the line across our data. This"
  - "[PAGE 36]\n\nessentially says \"hey line generator, when you create a line, use\
    \ this for the x and this for the y of each data point.\"\n\nIf our data was a\
    \ much of points where a single point was an array of the form [x, y] and the\
    \ array of points looked like this:\n\n```\nvar data = [ [x1, y1], [x2, y2], [x3,\
    \ y3], etc... ];\n```\n\nOur line generator would look like this:\n\n```\nvar\
    \ line = d3.svg.line()\n    .x(function(d) { return d[0]; })\n    .y(function(d)\
    \ { return d[1]; });\n```\n\nLets say our data instead was an array of coordinate\
    \ objects of the form { x: x1, y: y1 } and the array of points looked like this:\n\
    \n```\nvar data = [ { x: x1, y: y1 }, { x: x2, y: y2 }, etc... ];\n```\n\nThen\
    \ our line generator x and y accessors would look like this:\n\n```\nvar line\
    \ = d3.svg.line()\n    .x(function(d) { return d.x; })\n    .y(function(d) { return\
    \ d.y; })\n```\n\n# Here's a complete line generator example\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style>\n      body{ margin: 0; }\n      path { stroke:\
    \ black; stroke-width: 2px; fill: none;}\n    </style>\n  </head>\n  <body>\n\
    \    <script>\nvar lineGenerator = d3.svg.line()\n    .x(function(d) { return\
    \ d[0]; })\n    .y(function(d) { return d[1]; });\n// the line data\nvar lineData\
    \ = [[154, 14], [35, 172], [251, 127], [31, 58], [157, 205],\n    [154, 14]];\n\
    // create `<svg>` and inner `<path>` element\nd3.select('body').append('svg')\n\
    \    // use the generator and line data to create the `d` attribute for our path.\n\
    \    .append('path').datum(lineData).attr('d', lineGenerator);\n    </script>\n\
