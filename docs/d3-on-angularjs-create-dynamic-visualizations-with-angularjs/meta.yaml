    We can use this scale to provide a gradient between our values of 0 and 2. For
    instance:


    ```

    1 scale(0.5); // 125

    2 scale(1.1); // 275

    3 scale(1.9); // 475

    ```


    As we can see, our scales output relative ranges for each datum. This process
    is called *normalization*, which is mapping a numeric value to all possible minimum
    and maximum values on a given scale.


    > If it takes 100 licks to get to the center of a tootsie roll, then 90 licks
    in and we are at 90% of the way done, while at 10 licks we''re only at 10%. This
    is called normalization.


    Back to our mapping of viewership, we can create a scale that maps on to our entire
    dataset:


    ```

    1 var scale = d3.scale.linear()

    2    .domain(d3.extent(data))

    3    .range([0, 200]);

    ```


    This will map the entire range of our input values from the minimum values to
    the maximum viewership values.


    We can now use this scale to set the height of our bar chart:


    ```

    1 // count up from height,

