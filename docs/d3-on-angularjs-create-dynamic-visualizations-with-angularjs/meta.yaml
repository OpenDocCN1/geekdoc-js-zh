    The `range()` function sets the output range to span between 10 and 100 for output
    values. It accepts a single array of values to match the cardinality of the input
    domain. That is, the same amount of numbers as the domain.


    One feature of the `range()` function is that it does not need to be numeric inputs,
    so long as the underlying interpolation (depending upon which type of scale we''re
    working with, i.e. linear, time, etc) supports it.


    This enables us to scale between colors, for instance.


    ```

    1  var color = d3.scale.linear()

    2      .domain([0, 100])

    3      .range(["red",  "blue"]);

    4  color(0);   // -> "#ff0000" aka, red

    5  color(50);  // -> "#800080" aka, purple

    6  color(100); // -> "#0000ff" aka, blue

    ```


    # Polylinear scales


    With linear scales, we''re not limited to just two values. This allows us to connected
    domains to connected ranges. This is as if we had several individual linear scales
    connected. This most useful for dealing with multi color gradients.


    ```

    1  var scale = d3.scale.linear()

    2      .domain([0, 0.5, 1])

    3      .range([''blue'', ''white'', ''red'']);

    ```


    > A common mistake when creating color gradients like this is to forget to include
    the same number of domain elements as range colors. In the example above, if we
    gave domain() an array of length two (ie., [0, 1]) instead of 3 (ie., [0, 0.5,
    1]) our range output would only go from blue to white.


    # Using our scale


    When it comes time to translate our data to pixels, we can just use scale(d)


    For instance, let''s say that our domain ranges from 0 to 2 that we want to map
    on to a chart of between 0 to 500.


    ```

    1  var scale = d3.scale.linear()

    2      .domain([0, 2])

    3      .range([0, 500]);

    ```


    If we pass in 0 to our resulting scale() function, we''ll get an output value
    of 0. If we pass in 2, then we will get our maximum output of 500.'
