- img_proc: true
  md: "```\nd3.select('select').on('change', function(){ alert(this.value); });\n\
    d3.select('select').on('change', null);\n// nothing is alerted!\n```\n\nSome other\
    \ common events we'll be interested in are the mouse events `click`, `mousedown`,\
    \ `mousemove`, and `mouseup`. A click events are fired when a user presses and\
    \ then releases the mouse button. It's a combination of `mousedown` and `mouseup`.\
    \ mouse move is fired everytime the mouse moves.\n\nPutting together all our knowledge\
    \ of transitions and events, let's build a simple video game. The objective is\
    \ to avoid moving asteroids (`circles`) from colliding with our spaceship (mouse.)\
    \ We'll start off by defining our current level, and the width and height of our\
    \ game, which will take up the entire window.\n\n```\nvar level = 0, width = window.innerWidth,\
    \ height = window.innerHeight;\n```\n\nNow lets create the svg that will hold\
    \ our game objects.\n\n```\nvar svg = d3.select('body').append('svg');\n```\n\n\
    Lets add some asteroids. 20 sounds like a good number. Lets make the pretty big,\
    \ with a radius of 20\n\n```\nvar circles = svg.selectAll('circle').data(d3.range(20)).enter().append('circle')\n\
    \    .attr('r', 50)\n```\n\nWe'll randomly position all the asteroids across the\
    \ screen at every level and transition all the asteroids as go between levels\
    \ so lets create an update method we can call periodically using `setInterval`.\n\
    \n```\nfunction update(){\n    circles.transition().duration(2000).attr({\n  \
    \      cx: function(){ return Math.random() * width },\n        cy: function(){\
    \ return Math.random() * height } });\n    level++;\n}\n```\n\nSo there's something\
    \ on the screen when the user first visits our game, lets call update() right\
    \ off the bat. Then we'll setup our interval to call `update()` every 2 seconds.\n\
    \n```\nupdate();\nsetInterval(update, 2000);\n```\n\nWhen an asteroid (circle)\
    \ collides with our spaceship (mouse), game over! Alert the user that they lost\
    \ and reset the level counter.\n\n```\ncircles.on('mouseover', function(){\n \
    \   alert('Nice! You made it to level ' + level);\n    level = 0;\n});\n```\n\n\
    And we're done! We just made a video game in 15 lines of JavaScript. Here's what\
    \ the final version"
