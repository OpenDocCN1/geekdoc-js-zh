  md: '# # Introduction


    # ## About the authors


    Ari Lerner is a developer with more than 20 years of experience, and co-founder
    of Fullstack.io. He co-runs ng-newsletter, speaks at conferences, and recently
    released Riding Rails with AngularJS. He also teaches in-person classes at Hack
    Reactor and online with airpair.


    Victor Powell is a freelance data visualization developer. Prior to freelance,
    Victor built data visualization tools with YinzCam, Inc. used by NFL, NHL, and
    NBA sports teams. In his free time, Victor enjoys finding ways to explaining unintuitive
    or complex mathematical concepts visually. Victor also guest instructs at Hack
    Reactor.


    # ## About this book


    *The D3 on AngularJS* book is packed with the solutions you need to be a [D3](https://d3js.org)
    and [AngularJS](https://angularjs.org) expert. AngularJS is an advanced front-end
    framework released by the team at [Google](https://www.google.com). It enables
    you to build a rich front-end experience, quickly and easily and D3 is an advanced
    data visualization framework released by Mike Bostock.


    *The D3 on AngularJS* gives you the cutting-edge tools you need to get up and
    running on AngularJS and creating impressive web experiences in no time. The goal
    of this book is not only to give you a deep understanding of how D3 works, but
    how to integrate it properly into your own AngularJS apps.


    With these tools you can dive into making your own dynamic visualizations with
    AngularJS while being confident in understanding the technology.


    # ## Audience


    We have written this book for those who have never used AngularJS to build a web
    application and are curious about how to get started with an awesome JavaScript
    framework. We assume that you have a working knowledge of HTML and CSS and a familiarity
    with basic JavaScript (and possibly other JavaScript frameworks). We also assume
    that you''ve never written in D3 before, but are interested in learning.


    # ## Organization of this book


    The first half off the book focuses exclusively on the basics of D3 so we''ll
    start off assuming you have not used the Library before. In the second half of
    the book, we''ll cover Angular and how it can be used to make reusable data visualization
    components. We''ll also assume you have not used Angular but at the same time,
    we won''t get into too many details of the Library and only cover the concepts
    that specifically aid in creating reusable and interactive data visualizations.


    # ## Additional resources


    Since this book does not cover AngularJS in-depth, we urge you to check out the
    Complete Book on AngularJS at [ng-book.com](https://ng-book.com).


    We suggest that you take a look at the [AngularJS API documentation](https://docs.angularjs.org/api),
    as it gives you direct access to'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'the recommended methods of writing Angular applications. It also gives you
    the most up-to-date documentation available.


    # Conventions used in this book


    Throughout this book, you will see the following typographical conventions that
    indicate different types of information:


    In-line code references will look like: `<h1>Hello</h1>`.


    A block of code looks like so:


    ```

    1 var app = angular.module(''app'', []);

    2

    3 function FirstController($scope) {

    4     $scope.data = "Hello";

    5 }

    ```


    Any command at the command line will look like:


    ```

    1 $ ls -la

    ```


    Any command in the developer console in Chrome (the browser with which we will
    primarily be developing) will look like:


    ```

    1 > var obj = {message: "hello"};

    ```


    *Important words* will be shown in **bold**.


    Finally, tips and tricks will be shown as:


    > Tip: This is a tip


    # Development environment


    In order to write any applications using AngularJS or D3, we first need to have
    a comfortable development environment. Throughout this book, we’ll be spending
    most of our time in two places: our text editor and our browser. We recommend
    you download the Google Chrome browser, as it provides a great environment to
    develop in with its convenient and built-in developer tools suite. It’s also the
    browser we used to create the examples. In theory, there should be no differences
    in the way the examples run on other standards compliant browsers but we can’t
    ever be absolutely sure.'
