    \ })\n// => 6.5\n```\n\nD3 还提供了许多其他简单的数组辅助函数。有关更多函数及其功能的详细描述，请查看 [https://github.com/mbostock/d3/wiki/Arrays](https://github.com/mbostock/d3/wiki/Arrays)\
