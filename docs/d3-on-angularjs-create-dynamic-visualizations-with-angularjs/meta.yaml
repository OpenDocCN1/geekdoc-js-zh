    Using $http service instead of d3.json() allows us to avoid having to call $scope.$apply()
    directly. Angular will do this for us automatically. In fact, Angular *almost*
    always knows when to check the scope. The only times it doesn''t are when performing
    asynchronous events outside of Angular. This includes using any of D3''s behaviors
    (ie., drag, click, zoom, etc.) or using setTimeout (instead of Angular''s $timeout
    service.)


    > You may be curios as to how we''re able to use the $http service simply by adding
    it as another argument to the controller definition function. This is made possible
    by a feature in Angular called "dependency injection". A detailed overview of
    DI and how it works is beyond the scope of this book. Have a look at the Angular
    documentation [here for more details](here for more details). In the mean, just
    know that Angular is smart enough to check what arguments it should call your
    controllers initialization method with by looking at the variable names of the
    arguments. If we switched the arguments to our controllers initialize function
    from ($scope, $http) to ($http, $scope) our code would keep working!


    Using all we''ve learned so far, we can now create a simple "real time visualization
    dashboard" just by using the $interval service to periodically pull data from
