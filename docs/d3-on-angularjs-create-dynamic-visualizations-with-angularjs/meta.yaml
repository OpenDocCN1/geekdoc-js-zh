  md: 'Angular will carry of any styles or attributes be specified on the original
    directive to the replaced directive.


    But this alone wont be enough. As our code is written now, Angular will replace
    the data we put inside of the `<sl>` element. To tell Angular, “hey, instead of
    removing all the stuff inside of the element before compiling it, put it inside
    of *here*” we can use the `transclude` directive option in combination with the
    `ng-transclude` directive inside of our template.


    ```

    1 return {

    2     link: link

    3   , restrict: ''E''

    4   , replace: true

    5   , template: ''<svg ng-transclude class="sl"></svg>''

    6   , transclude: true

    7 };

    ```


    Whatever was in our `<sl>...</sl>` directive before will be placed inside of the
    `<svg>` element created from this template string.


    And now styles can be applied inline on our `<sl>` directive to adjust the display
    of the sparklines.


    ```

    1 <sl r="1" style="stroke:green">[10, 20, 30]</sl>

    ```


    ![](img/82f49fe8a368850935eb7606dfa7579d_115_0.png)


