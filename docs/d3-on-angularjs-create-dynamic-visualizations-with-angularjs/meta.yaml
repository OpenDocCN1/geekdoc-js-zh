    # # Services


    # ## Services to store data


    Beyond having directives remain unopinionated about their data sources, it’s also
    a good idea to do the same for controllers. This allows us to easily swap out
    different types of data from different controllers acting as a proxy between the
    controller and the data. Here’s a concrete example for when this ability would
    be useful. Imagine we have two controllers that both need to access the same remote
    piece of data. Instead of having each controller request the remote data independently,
    issuing two separate requests, we can instead use an Angular service to provide
    the data to each controller. In this way, the service can automatically store
    the data internally for subsequent requests or provide any necessary data formatting
    prior to passing the data back to each controller.


    # ## Services to reduce code duplication


    Services are also a great place to store common utility functions that multiple
    controllers might each need. This reduces the amount of code duplication across
    controllers. But services aren’t limited to just being used inside of controllers.
    Directives can also use services. Anytime we notice duplicate or similar code
    across directives or controllers, the best place to share this code is from within
    a service.


    # ## Built in directives


    To keep things simple, up to this point we’ve avoided creating our own directives
    in any other way but by their element name. That is, if we wanted a map component
    we created an element style directive and used it in our HTML as <my-map>. But
    directives are actually much more flexible and their use'
