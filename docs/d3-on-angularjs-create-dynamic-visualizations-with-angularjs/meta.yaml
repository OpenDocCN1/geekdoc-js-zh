    // [ [1,2] ]

    ```


    # ### d3.ascending()/d3.descending()


    Often times, data visualizations will need to sort arrays. D3 includes two helpers
    functions to help us with this type of sorting.


    The d3.ascending() and d3.descending() are helper functions that accept two arguments.


    For the d3.ascending(a,b), it will return a value of -1 if a is less than b, return
    1 if a is greater than b, and 0 if they are equal.


    The d3.descending(a,b) function returns the opposite, where it will return -1
    if a is larger than b, 1 if a is less than b, and 0 if they are equal.


    These functions can be used by passing them into the array sort() function, like
    so:


    ```

    var arr =[1,28,9,4];

    arr.sort(d3.ascending);

    // => [1, 4, 9, 28]

    arr.sort(d3.descending);

    // => [28, 9, 4, 1]

    ```


