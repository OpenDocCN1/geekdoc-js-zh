  md: "so this is a spark line \\. Pretty cool, right?\n\nhere's another \\\n\nhere's\
    \ a longer example \\\n\nan even longer example \\\n\nlets look at a few in a\
    \ row.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_114_0.png)\n\nMaking a sparkline\
    \ directive has a few advantages. The most noticeable is how easy it is now to\
    \ create more just by using this self explanatory HTML.\n\n```\nThis is a sparkline\
    \ <sl r=\"5\">[20,24,15,40]</sl>. That was a sparkline.\n```\n\nLive version:\
    \ http://bl.ocks.org/vicapow/9904612\n\n> We decided to use sl as the directive\
    \ name because we anticipated having to use many of them within a body of text.\
    \ It would have been tedious to type out fully <sparkline>...</sparkline> for\
    \ each spark line.\n\nThe drawback to defining our directive in this way is that\
    \ we're not able to simply specify the styles on the directive itself however,\
    \ especially with sparklines, we'll often want to style each one individually\
    \ inline.\n\n```\nThis is a red sparkline <sl style=\"stroke:red\">[20,24,15,40]</sl>\n\
    ```\n\nThis would not work as expected because the sl DOM element isn't an SVG\
    \ DOM element and so its stroke property wont be inherited by the containing SVG\
    \ element that our directive appends to itself. To fix this, we can tell Angular\
    \ to instead replace the entire element with an SVG element using the replace:\
    \ true option when define the directive. But for this to work, we also need to\
    \ tell Angular what it would replace the element with. To do this we'll also specify\
    \ a template\n\n```\nreturn {\n  link: link,\n  restrict: 'E',\n  replace: true,\n\
    \  template: '<svg class=\"sl\"></svg>'\n}\n```"
