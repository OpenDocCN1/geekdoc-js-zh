    # ## Let''s make a dynamic donut chart


    Now that we understand how we can make directives that update dynamically, let''s
    work through a more complicated example of a dynamically updating visualization.
    We''ll take the donut chart directive from the previous chapter and make it dynamic
    so that we can change its data and the visualization will update accordingly.


    Live version: [http://jsbin.com/yili/6/edit](http://jsbin.com/yili/6/edit)'
  - '[PAGE 100]


    To start off, we first need to be able to modify the data the chart is displaying.
    Three <input> range sliders will do the trick but we could have used any method
    to update the data. The directive doesn’t know or care how its data gets modified.


    ```

    1 <body ng-app="myApp" ng-init="chart=[10, 20, 30]">

    2   <input type="range" ng-model="chart[0]">

    3   <br>

    4   <input type="range" ng-model="chart[1]">

    5   <br>

    6   <input type="range" ng-model="chart[2]">

    7   <br>

    8   <donut-chart data="chart"></donut-chart>

    9 </body>

    ```


    Live version: [http://jsbin.com/waqep/1/edit](http://jsbin.com/waqep/1/edit)


    The directive doesn’t update yet because it’s not watching for changes to its
    data scope variable. To fix that, we’ll just use the $watch function like before.


    ```

    1 scope.$watch(''data'', function(data){

    2   console.log("an element within `data` changed!");

    3   console.log(data);

    4 }, true);

    ```


    Live version: [http://jsbin.com/waqep/3/edit](http://jsbin.com/waqep/3/edit)


    One important difference is that we’re now giving $watch an extra third variable
    true. This tells $watch to also watch for changes within data itself. Otherwise,
    changing the first element of data by doing data[0]=45 would not trigger the $watch
    callback because data is still the same array after the change. It just has a
    different value for its first element.


    > $watch callbacks will not be fired for changes to the elements of arrays unless
    you pass true as the third argument. Otherwise, the $watch callback will only
    fire if the array being watched becomes an entirely new array.


    The last step is to update the arc <path> tags when the data changes since they
    are the only part of our visualization that depend on the data. Since we’ll be
    updating the arcs in the $watch we need to give the <path> arc selector a name
    to refer to later. We also don’t need to set the arcs d property anywhere expect
    when the data changes in the $watch.


    ```

    1 var arcs = g.selectAll(''path'').data(pie(data))

    2   .enter().append(''path'')

    3     .style(''stroke'', ''white'')

    4     .attr(''fill'', function(d, i){ return color(i) });

    ```'
