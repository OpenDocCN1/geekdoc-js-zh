  md: '# # Dynamic visualizations


    As we saw in the last chapter, directives are a great tool for making our visualizations
    self contained and reusable across different parts of our project or different
    projects entirely. Another great advantage to using Angular and its directives
    for data visualization is Angular’s support for automatic two way data binding.
    That sounds like a mouth full but it’s a actually a simple idea. It just means
    that Angular takes care of updating the DOM whenever data changes. Similarly,
    it automatically updates our data when the DOM changes. All we need to specify
    is the relationship between our data and DOM elements. The big advantage to all
    of this is that we’ll get to write a lot less code. The disadvantage is that we’ll
    have to spend the effort to wrap our heads around this new way of thinking about
    data binding as well as develop a strong understanding of what all Angular is
    doing automatically for us.


    For the first half of this chapter we’ll be working from simple toy examples that
    illustrate the fundamentals. In the second part, we’ll walk through using these
    new concepts to make dynamic data visualizations.


    # ## Two way data binding


    To illustrate and motivate the advantages of two way data binding, we’ll start
    off with a very simple example. Here, several range <input> sliders are all bound
    to the same data model. When we drag one, all the others are updated automatically.
    This saves us the trouble of having to manually set up event listeners on all
    of the sliders as well as taking care of updating their values. It might help
    to think of Angular as having written all that code for us.


    ```

    1 <body ng-app>

    2   <input type="range" ng-model="ourRangeValue">

    3   <input type="range" ng-model="ourRangeValue">

    4   <input type="range" ng-model="ourRangeValue">

    5   <input type="range" ng-model="ourRangeValue">

    6 </body>

    ```


    ![](img/82f49fe8a368850935eb7606dfa7579d_95_0.png)


    Live version: [http://jsbin.com/tobuq/1/edit](http://jsbin.com/tobuq/1/edit)


    # ## The scope


    All of this automatic updating happens for variables on what’s called the “scope”.
    In the example above, the ng-model directive creates a variable on the scope called
    ourRangeValue and handles updating the value of the <input> range slider anytime
    ourRangeValue changes. The scope works a lot like the DOM tree. If we create a
    new scope on a DOM element, all of the child elements will have access to the
    variables on that new scope. When we told Angular the root of our app was the
    <body> tag it also created a default scope on the <body> tag that any inner elements
    can access. This is the scope the ourRangeValue is created on. This top level
    scope is called the “root scope”.'
