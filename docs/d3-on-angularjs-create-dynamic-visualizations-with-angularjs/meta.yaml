    # ## entries()


    Sometimes we want the specific array to contain both the key name and the value
    name. This is particularly useful when we''re interested in dynamic objects where
    we are interested in a single key by name.


    ```

    d3.entries({x: 1, y: 2, z: 3})

    // => [

    //    {key: "x", value: 1},

    //    {key: "y", value: 2},

    //    {key: "z", value: 3}

    // ]

    ```


    # ## Maps


    Maps are similar to objects in JavaScript, but when using any built-in object
    behavior and/or built-in keys (such as `__proto__` or `hasOwnProperty`), the object
    behavior will tend to act unexpectedly. For more, see [An Object is not a Hash
    by Guillermo Rauch](http://...)


    In D3, we can create a new map object simply by call the `d3.map()` function.
    It can also take an optional first argument that contains an object of keys and
    values to initialize the map with.


    ```

    var m1 = d3.map(); // map object

    var m2 = d3.map({x: 1}); // map object with x as a key and 1 as the value

    ```


    # ## map.has()


    We can test if a map includes a key or not using the `map.has()` method. It takes
    a single argument of a *key* string.


    ```

    var m = d3.map({x: 1})

    m.has("x"); // true

    m.has("y"); // false

    var key = "x";

    m.has(key); // true

    ```


    # ## map.get()


    We can fetch the value of a key inside of our map by using the `map.get()` function.
    It takes a single argument of a key string to fetch.


    ```

    var m = d3.map({x: 1})

    m.get("x"); // 1

    m.get("y"); // undefined

    ```


    # ## map.set()


    We can set a value inside of our map as well using the `map.set()` method. This
    takes two arguments, the key (string) to set and the value to set it. If the map
    already *knows* about the key, it will replace the old value with the new value.


    ```

    var m = d3.map({x: 1})

    m.set("y", 2);

    m.set("x", 2);

    // m => {x: 2, y: 2}

    ```'
