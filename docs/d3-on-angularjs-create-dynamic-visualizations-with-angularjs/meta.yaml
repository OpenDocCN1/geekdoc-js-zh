    10    .on(''mouseover'', function(){

    11      alert(''Nice! You made it to level '' + level);

    12      level = 0;

    13    });

    14 function update(){

    15    circles.transition().duration(2000).attr({

    16      cx: function(){ return Math.random() * width },

    17      cy: function(){ return Math.random() * height } });

    18    level++;

    19 }

    20 update();

    21 setInterval(update, 2000);

    22     </script>

    23   </body>

    24 </html>

    ```'
  - "[PAGE 80]\n\n# # Data Parsing and Formatting\n\nThis chapter covers some of the\
    \ common ways to get and clean data for use with D3.\n\n# ## Getting data into\
    \ the browser\n\nAll the examples up until this point used hard-coded data values\
    \ directly in our code. This is fine when working with very small, unchanging,\
    \ data sets but quickly becomes unmanageable when the amount of data increases\
    \ or our data changes frequently. We don't want to have to keep copying and pasting\
    \ data into our code. This problem can be solved with a few D3 helper functions\
    \ that allow us to load data in different formats from a separate files, instead\
    \ of being in our code. Specifically, we can use `d3.json()` to load [JSON](JSON)\
    \ formatted data, or `d3.csv()` to load [CSV](CSV) data.\n\nAll we need to give\
    \ each is the name of the file to load, and a callback to be called once the file\
    \ has been loaded.\n\n# ### Loading CSV data\n\n**episodes.csv**\",\n\n```\n1\
    \ Title, Air date, U.S. viewers (in millions)\n2 \"Winter Is Coming\", \"April\
