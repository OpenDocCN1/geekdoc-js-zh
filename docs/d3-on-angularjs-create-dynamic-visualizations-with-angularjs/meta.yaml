- img_proc: true
  md: "essentially says \"hey line generator, when you create a line, use this for\
    \ the x and this for the y of each data point.\"\n\nIf our data was a much of\
    \ points where a single point was an array of the form [x, y] and the array of\
    \ points looked like this:\n\n```\nvar data = [ [x1, y1], [x2, y2], [x3, y3],\
    \ etc... ];\n```\n\nOur line generator would look like this:\n\n```\nvar line\
    \ = d3.svg.line()\n    .x(function(d) { return d[0]; })\n    .y(function(d) {\
    \ return d[1]; });\n```\n\nLets say our data instead was an array of coordinate\
    \ objects of the form { x: x1, y: y1 } and the array of points looked like this:\n\
    \n```\nvar data = [ { x: x1, y: y1 }, { x: x2, y: y2 }, etc... ];\n```\n\nThen\
    \ our line generator x and y accessors would look like this:\n\n```\nvar line\
    \ = d3.svg.line()\n    .x(function(d) { return d.x; })\n    .y(function(d) { return\
    \ d.y; })\n```\n\n# Here's a complete line generator example\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n  <head>\n    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"\
    utf-8\"></script>\n    <style>\n      body{ margin: 0; }\n      path { stroke:\
    \ black; stroke-width: 2px; fill: none;}\n    </style>\n  </head>\n  <body>\n\
    \    <script>\nvar lineGenerator = d3.svg.line()\n    .x(function(d) { return\
    \ d[0]; })\n    .y(function(d) { return d[1]; });\n// the line data\nvar lineData\
    \ = [[154, 14], [35, 172], [251, 127], [31, 58], [157, 205],\n    [154, 14]];\n\
    // create `<svg>` and inner `<path>` element\nd3.select('body').append('svg')\n\
    \    // use the generator and line data to create the `d` attribute for our path.\n\
    \    .append('path').datum(lineData).attr('d', lineGenerator);\n    </script>\n\
