    # ## Isolate scope


    Our donut chart could really stand to be improved in a few ways. Specifically,
    it would be nice if our donut charts didn''t all show the same content. We''d
    prefer to be able to pass each its own data to display instead of hard coding
    the same data right in the link function of the directive. To do this, we can
    use the what''s called an isolate scope. An isolate scope will allow us to pass
    our data into the directive using an attribute. (In our case, we''ll just call
    it `data` but we could have called it whatever we like.)


    ```

    1 <donut-chart data="[8, 3, 7]"></donut-chart>

    2 <donut-chart data="[2, 5, 9]"></donut-chart>

    3 <donut-chart data="[6, 2, 3]"></donut-chart>

    ```


    To tell Angular our directive should have an isolate scope, we just add a `scope`
    property to the object returned from our directive declaration.


    ```

    1 return {

    2     link: link,

    3     restrict: ''E'',

    4     scope: { data: ''='' }

    5 }

    ```


    Inside of our `link` method, we''ll just reference `scope.data` and it will contain
    the data we passed to it in the `data` attribute in our template above.


    ```

    1 function link(scope, element, attr){

    2   // our data for the current directive instance!

    3   var data = scope.data;

    4   // ...

    5 }

    ```


    Live version: [http://jsbin.com/yili/6/edit](http://jsbin.com/yili/6/edit)


    ![](img/82f49fe8a368850935eb7606dfa7579d_93_1.png)


    If, you still wanted to have the same data shared between all the pie charts,
    we could now simply define a variable on the scope and pass it to all the individual
    donut charts.


    ```

    1 <body ng-app="myApp" ng-init="ourSharedData=[8, 2, 9]">

    2   <donut-chart data="ourSharedData"></donut-chart>

    ```'
