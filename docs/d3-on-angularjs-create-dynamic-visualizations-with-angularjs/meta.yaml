    | CSS rule | Meaning |\n|----------|---------|\n| .foo | select every DOM element\
    \ that has class foo |\n| #foo | select every DOM element that has id foo |\n\
    | div.foo | select all the <div> tags that have class foo |\n| div#foo | select\
