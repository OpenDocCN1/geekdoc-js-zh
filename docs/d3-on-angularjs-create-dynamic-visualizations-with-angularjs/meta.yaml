  md: 'Using the same syntax, we can add additional variables that will be available
    inside the expression. In this way, we could expose the index variable `i` in
    the expression or any other variables we''d like to be accessible from with the
    accessor.


    ```

    var i = 0;

    var d = data[i];

    var xVal = scope.accessorX({d: d, i: i});

    ```


    This technique also works well for other properties, like color, size, or anything
    else we''d like to be made configurable. This also makes it convient to set a
    property uniformity. In the case of our scatter plot, we might make the color
    configurable by an expression.


    ```

    <scatter data="episodes" color="color(d.title)" ... ></scatter>

    ```


    Inside of our controller, we would then need a color scale that the expression
    uses to determine the color for each plot point.


    ```

    // on our controller

    $scope.color = d3.scale.category10();

    ```


    Or alternative, set all the points to be `"red"` by setting `color="''red''"`
    in the accessor expression.


    ```

    <scatter data="episodes" color="''red''" ... ></scatter>

    ```


    ![](img/82f49fe8a368850935eb7606dfa7579d_110_0.png)


    Live version: [http://bl.ocks.org/vicapow/9591312](http://bl.ocks.org/vicapow/9591312)


    # ## Responsive directives'
