- img_proc: true
  md: "There’s a few ways new scopes get created but we can’t simply just create a\
    \ new scope on its own. The simplest way to create a new scope is to first create\
    \ a “controller”. Controllers are normally used to modify scope variables programmatically\
    \ in JavaScript. Whenever we create and use a new controller, a new scope is also\
    \ created for it. Working from our previous example, lets see what it looks like\
    \ to create and use a controller to create new scopes.\n\nWe first need to create\
    \ a module to put our controller on.\n\n```\nvar app = angular.module('myApp',\
    \ []);\n```\n\nNext, we’ll create a controller called ‘HelloController’ that just\
    \ creates a variable on its new scope called ourRangeValue.\n\n```\napp.controller('HelloController',\
    \ function($scope){\n    $scope.ourRangeValue = 50;\n});\n```\n\nTo use it, we\
    \ need to remember to use our module in the <body> tags ng-app.\n\n```\n<body\
    \ ng-app=\"myApp\">\n```\n\nNext, we’ll use our new controller twice using ng-controller=\"\
    HelloController\" on a <div> tag. Now the scopes inside the <div> will inherit\
    \ from the new controllers created for each HelloController.\n\n```\n<body ng-app=\"\
    myApp\">\n  <div ng-controller=\"HelloController\">\n    <input type=\"range\"\
    \ ng-model=\"ourRangeValue\">\n    <input type=\"range\" ng-model=\"ourRangeValue\"\
    >\n  </div>\n  <div ng-controller=\"HelloController\">\n    <input type=\"range\"\
    \ ng-model=\"ourRangeValue\">\n    <input type=\"range\" ng-model=\"ourRangeValue\"\
    >\n  </div>\n</body>\n```\n\nLive version: http://jsbin.com/hite/1/edit\n\nTwo\
    \ scopes were created inside our apps root scope. One for the first `HelloController`\
    \ and another one for the second. `ourRangeValue` will be a different property\
    \ on each of these two inner scopes. This has the effect of binding the first\
    \ two range slides to the value of `ourRangeValue` on the first scope and the\
    \ second two range sliders to the value of `ourRangeValue` on the second scope.\n\
    \nInner scopes inherit from their outer scopes. This means that if the `ourRangeValue`\
    \ wasn’t found on the `HelloController` scope, its outer scope would have been\
    \ checked for a property named `ourRangeValue` and so on until the root scope\
    \ was checked.\n\n# Scope inheritance\n\nng-init is used to initialize properties\
    \ on the scope of the current element. In the following example,"
