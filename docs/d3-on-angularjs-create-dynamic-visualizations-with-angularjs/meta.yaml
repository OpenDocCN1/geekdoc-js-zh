  - "[PAGE 82]\n\n# # What next?\n\nThis chapter will cover additional resources and\
    \ stepping off points for continued exploration of D3.\n\n# ## Maps\n\nBuilt into\
    \ D3 is an extensive collection of utility methods that make working with geographic\
    \ data much easier. D3, in combination with command line tools like ogr2ogr make\
    \ it easy to convert GIS shapefiles into a type of JSON (GeoJSON, specifically)\
    \ that D3 can read and draw as SVG. A common use case is in the creation of choropleths\
    \ and other thematic maps commonly used in data visualization.\n\nBecause geoJSON\
    \ files can get quite large, another great tool by Mike Bostock is [TopoJSON](link).\
    \ TopoJSON is an alternative map file format to GeoJSON, expect the files it produces\
    \ are *much* smaller and consequently load much faster inside of a browser. In\
    \ addition to TopoJSON the file format, there's TopoJSON the library (for reading\
    \ the format) and TopoJSON the command line program (for creating TopoJSON files\
    \ from GeoJSON files.) For an in depth tutorial on creating maps, see Mike Bostock's\
    \ excellent [Let's Make a Map](link) tutorial.\n\n# ## Layouts\n\nD3 Offers an\
    \ extensive collection of pre-existing [layout helper](link) functions that make\
    \ building the typical cookie-cutter graphs like pie, histogram, and stack chart\
    \ ease. D3 does **not** provide methods like `createPieChart`. Instead, D3 offers\
    \ functions that make creating them from scratch easier. Lets walk though a quick\
    \ pie chart example to show this in action. We'll combine to two new methods,\
    \ `d3.svg.arc()`, which creates a arc generator, and `d3.layout.pie()`. The `pie()`\
    \ layout simply takes data and produces the necessary parameters that `arc()`\
    \ expects.\n\n```\nvar data = [4,5,6];\nvar pie = d3.layout.pie();\nconsole.log(pie(data));\
    \ // =>\n[\n  { data:4, value:4, startAngle:4.61, endAngle:6.28 },\n  { data:5,\
    \ value:5, startAngle:2.51, endAngle:4.61 },\n  { data:6, value:6, startAngle:0,\
    \ endAngle:2.51 }\n]\n```\n\nNow we can use an arc generator to take the start\
    \ and end angles above and produce the necessary d attribute values to draw arc\
    \ paths in SVG.\n\n```\n// create an arc generator function, setting the outer\
    \ radius\n// of the created arcs to `100` and inner radius to `0`\nvar arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n\
    ```\n\n```\nvar color = d3.scale.category10();\nvar arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \  .enter().append('path')\n    .attr({ d: arc }) // create the arc paths using\
    \ the arc generator\n    .style({\n      // style each arc slice with a different\
    \ color and white border\n      fill: function(d, i){ return color(i) },\n   \
    \   stroke: 'white'\n    })\n```"
  - "[PAGE 83]\n\nHere's what it all looks like together. Note the containing g element\
    \ and (200,200) translation so that the center of the pie chart isn't stuck in\
    \ the top, left corner of the svg.\n\n```\n<!DOCTYPE html>\n<html>\n  <body>\n\
    \    <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n\
    \    <script>\n      var vis = d3.select('body').append('svg').append('g')\n \
    \         .attr('transform', 'translate(200,200)');\n      var color = d3.scale.category10();\n\
    \      var arc = d3.svg.arc().outerRadius(100).innerRadius(0);\n      var pie\
    \ = d3.layout.pie();\n      var arcs = vis.selectAll('path').data(pie([4,5,6]))\n\
    \        .enter().append('path').attr({\n            d: arc,\n            fill:\
    \ function(d, i){ return color(i) },\n            stroke: 'white'\n        });\n\
    \    </script>\n  </body>\n</html>\n```\n\nThere are many more layouts like this\
    \ one so if you ever find yourself creating a pretty common graph type, be sure\
    \ to look for possible pre-existing layout helpers first.\n\n# Plugins and other\
    \ tools\n\nThe venerable Mike Bostock and others have collected several common\
    \ [D3 plugins](https://github.com/d simplyid3/d3-plugins) that haven't seemed\
    \ necessary enough to be put into D3 core but are, on occasion, extremely useful.\
    \ One of the most interesting among them is the d3.fisheye plugin which applies\
    \ a distorted fisheye lense effect which is useful when focusing in a particular\
    \ portion of a larger collection of elements.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_83_0.png)\n\
    \nThere are a few common tools that are often used with D3. Chief among them may\
    \ be [Crossfilter](http://square.github.com/crossfilter/). Think of Crossfilter\
    \ as offering faster alternatives to D3's array helpers. With it, it's possible\
    \ to quickly sort and filter extremely large amounts (millions of rows) of data."
  - '[PAGE 84]


    # Intro to Angular


    Up until this point, we''ve focused only on D3 but in the next chapters, we''ll
    look at some of the interesting ways in can be combined with Angular to make our
    visualizations more modular, reusable, and interactive. This also had a the benefit
    of making them easier to conceptualize in our heads as well as making it easier
    for us to come back to several months later after we''ve forgotten all the nuances
    of our visualization.


    # About Angular


    Angular is a framework that makes it easier to create (web) applications but it
    lends it self well to interactive visualization. It does this by forcing us to
    break up our application into pieces that perform specific types of tasks. Splitting
    our code up this way allows components to be easily swapped out for other components.
    It also helps with connecting our components to other components allowing one
    visualization to be driven by each other or update themselves automatically when
    their underlying data changes.


    Angular has a lot of features but most aren''t directly related to data visualization.
    For a more in depth deep dive into Angular check out Ari''s ng-book.


    # Angular for interactive and reusable data visualization


    There are a lot of reason''s to use Angular when doing data visualization but
    chief among them all are directives. Directives make it easier to create reusable
    visualizations. They are essentially a way for us to create our own HTML elements
    that act just like the browsers built-in HTML tags. Imagine we just created a
    pie chart visualization we''d like to reuse again. If we had created a directive
    that contained our pie chart, this would be simple. We can just copy and paste
    the `<pie-chart>` element in our html without having to write any JavaScript.


    ```

    1 <pie-chart></pie-chart>

    2 <pie-chart></pie-chart>

    ```


    This also makes it easier for people that didn''t write our pie chart, since they
    don''t need to know the pie chart works to use it.


    If we write our visualizations in directives, we also get a lot of other advantages
    for free. Namely, we can use Angular''s other built-in directives like `ng-switch`
    to conditionally show different visualizations. In this example we''re conditionally
    showing either a pie chart or bar chart view of the data depending on the state
    of the `selection` scope variable.


    ```

    1 <div ng-switch on="selection">

    2   <div ng-switch-when="pie">

    3     <pie-chart></pie-chart>

    4   </div>

    5   <div ng-switch-default>

    6     <bar-chart></bar-chart>

    7   </div>

    8 </div>

    ```


    Using another built-in Angular directive, `ng-repeat`, we can easily create the
    effective data'
  - "[PAGE 85]\n\nvisualization technique of small multiples allowing us to convey\
    \ more information more effectively. It does this by allowing us to reuse the\
    \ same visualization a variable number of times.\n\n```\n<div ng-repeat=\"races\
    \ in incomes\">\n  <map ng-repeat=\"race in races\"></map>\n</div>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_85_0.png)\n\
    \nLive version: http://vicapow.github.io/angular-d3-talk/slides/demos/life-expectancy/index.html\n\
    \nLastly, Angular makes it easy to create dynamic visualizations by handling updates\
    \ on the scope. This is often useful when creating visualizations that depend\
    \ on the state of some other visualization or when, say, you wanted two different\
    \ visualizations to update whenever a slider was moved.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_85_1.png)"
  - '[PAGE 86]


    # Model, View, Whatever


    Most web frameworks encourage developers to break up their code into ether “models”,
    “views”, or “controllers” or (MVC). We can think of them in the following way:


    Models: The information our application wants to show or allow to be modified.
    Views: The components responsible for showing or modifying that information or
    a “view” of the information. Controllers: the logic responsible for properly connecting
    the two.


    ![](img/82f49fe8a368850935eb7606dfa7579d_86_0.png)


    Remember to keep in mind that there’s a difference between this general, informal
    categorization of the parts of any application, and the types of components that
    actually exist in our application. Some frameworks might share some of these responsibilities
    across components or might call them something completely different. In Angular
    specifically, there is no formal “view” class or function. The “view” is just
    the DOM.


    In Angular, for the most part, our viewers and models are automatically connected.
    This automatic (or “two-way”) data binding is the default and occurs on what’s
    called the “scope”. Just by changing a variable on the scope (aka, the model),
    it’s change will automatically be sent to the DOM. Because this isn’t strictly
    MVC, the Angular community refers to this pattern as “Model, View, Whatever” because
    you can loose a lot of time contemplating exactly what pattern Angular falls into.


    ![](img/82f49fe8a368850935eb7606dfa7579d_86_1.png)'
- md: "## Hello Angular!\n\nTo get familiar with how to install and setup an Angular\
    \ app, let's walk through creating a 'Hello World' style application. This app\
    \ will update a template whenever the value of an input tag changes.\n\n### Installing\
    \ Angular\n\nThe easiest way to install Angular is to include the latest version\
    \ from Google's CDN by copy and pasting the below snippet into a new HTML file.\
    \ (At the time of writing, the newest version is 1.2.10).\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.10/angular.min.js\"\
    ></script>\n  </head>\n  <body></body>\n</html>\n```\n\nNext, we'll need to tell\
    \ angular where our app begins using `ng-app`. Most of the time, this will just\
    \ be the entire `<body>` tag.\n\n```html\n<body ng-app>\n  <!-- yo angular, everything\
    \ in here is our app -->\n</body>\n```\n\nNow we'll add an input tag that created\
    \ a variable person on the scope. The snippet `ng-model=\"person\"` is responsible\
    \ doing this. It also handles checking for changes to the `<input>` tag and updating\
    \ the scope, or vice versa. In MVC speak, this \"wires up\" the \"model\" person\
    \ variable on scope to the `<input>` tag (our \"view\"). Don't worry too much\
    \ *how* the scope works. Just know that it contains the information of our application.\
    \ In this case, the \"person\" we'd like to say hello to. Angular will take care\
    \ of wiring everything up for us automatically using two way data binding.\n\n\
    ```html\n<body ng-app>\n  <input type=\"text\" ng-model=\"person\"></input>\n\
    </body>\n```\n\nThe person variable now updates whenever the value of the `<input>`\
    \ tag changes but there's no way to prove it since we're not using that variable\
    \ anywhere else. Let's fix that by using a simple Angular template.\n\n```html\n\
    <body ng-app>\n  <input type=\"text\" ng-model=\"person\"></input>\n  hello {{person}}!\n\
    </body>\n```\n\nLive version: [http://jsbin.com/izimoQoL/1/edit](http://jsbin.com/izimoQoL/1/edit)\n\
    \nGreat! Now when we update the `<input>` text field, the change is automatically\
    \ sent to the scope which then causes the template to get rendered. Here's the\
    \ full version.\n\n```html\n1 <!DOCTYPE html>\n2 <html>\n3 <head>\n4   <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.10/angular.min.js\"\
    ></script>\n5   <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"\
    ></script>\n6 </head>\n7 <body ng-app>\n8   <input type=\"text\" ng-model=\"person\"\
    ></input>\n9   hello {{person}}!\n10 </body>\n11 </html>\n```\n\n## Directives\
    \ for reusable visualizations\n\n### Understanding directives\n\nDirectives give\
    \ us a way to encapsulate and reuse our visualizations by allowing us to essentially\
    \ create our own HTML tags. In a way, you've already been using directives. The\
    \ HTML5 `<input>` tags like range and date are essentially the browsers own directives.\
    \ They're constructed from a combination of several UI element but expose a simple\
    \ API. We just don't get access to their code.\n\n```html\n<input type=\"range\"\
    \ min=\"1\" max=\"1000\" value=\"0\" style=\"width:100%\">\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_0.png)\n\
    \n```html\n<input type=\"date\" value=\"1989-01-23\">\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_1.png)\n\
    \n### Creating a directive\n\nNow that you understand what directives are, let's\
    \ walk through creating our first with an example. Most directives do something\
    \ useful but to keep it simple, we'll create a directive that just says \"hello\
    \ world!\".\n\nWe'll start off with this HTML:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <script src=\"angular.js\"></script>\n  </head>\n  <body ng-app>\n\
    \    <!-- our app! -->\n  </body>\n</html>\n```\n\nNext we need to make a new\
    \ app module to hold all of our directives. All of our directives will live on\
    \ this module. We only have one directive right now so it seems pointless to put\
    \ it into a module but when we have many, this will help us group related directives.\n\
    \n```javascript\nvar myApp = angular.module('myApp', []);\n```\n\nAnd in our app\
    \ we'll need to change `ng-app` to `ng-app=\"myApp\"` to tell Angular we'd like\
    \ to get fancy and use our new app module instead of the default.\n\n```html\n\
    1 <body ng-app=\"myApp\">\n2   <!-- our app! -->\n3 </body>\n```\n\nNow we can\
    \ actually create our directive. First, we give it a name. If we want to be able\
    \ to use our directive in HTML and call it `<hello-world></hello-world>`, we need\
    \ to name it \"helloWorld\". Angular will take care of converting that to the\
    \ proper HTML tag name with - dashes instead of capital letters.\n\n```javascript\n\
    1 myApp.directive('helloWorld', function(){\n2   // TODO: finish directive\n3\
    \ });\n```\n\nDirectives have a `link` function which is essentially a \"constructor\"\
    \ if you're familiar with Object Oriented Programming. It contains everything\
    \ that should happen every time the element appears in the HTML. Angular will\
    \ call our `link` method with a few arguments. The first is the `scope` (or \"\
    model\"). Next is the `element` the directive on. The third is an object hash\
    \ of all the elements properties.\n\nThe `restrict: 'E'` option tells angular\
    \ our directive should be used using the element name, (ie. `<hello-world></hello-world>`).\
    \ We could also indicate something is a directive using its class name by using\
    \ `'C'` instead of `'E'`. Then when we would use our directive using the `<div\
    \ class=\"hello-world\"></div>` style instead.\n\n```javascript\n1 myApp.directive('helloWorld',\
    \ function(){\n2   function link(scope, element, attr){\n3      // TODO: finish\
    \ directive\n4   }\n5   return {\n6      link: link,\n7      restrict: 'E'\n8\
    \   }\n9 });\n```\n\nOur directive doesn't do anything at the moment so lets change\
    \ that by adding the text \"hello world!\" to its contents. Because the `link`\
    \ method gets called for every new directive instance, our code for modifying\
    \ the directive will go inside of the `link` method.\n\n```javascript\n1 function\
    \ link(scope, element, attr){\n2   element.text(\"hello world!\");\n3 }\n```\n\
    \nThe directive is finished but we haven't used it yet in our HTML. Here we'll\
    \ add it to the `<body>` tag.\n\n```html\n1 <body ng-app=\"myApp\">\n2   <hello-world></hello-world>\n\
    3 </body>\n```\n\nWe're all done. Now when Angular loads our app, it will check\
    \ our HTML for any directives and invoke all the link functions on them. The resulting\
    \ `<body>` DOM looks like the following:\n\n```html\n1 <body ng-app=\"myApp\"\
    \ class=\"ng-scope\">\n2     <hello-world>hello world!</hello-world>\n3     <script>...</script>\n\
    4 </body>\n```\n\nLive version: http://jsbin.com/ABUmAQiR/1/edit\n\nhello world!\n\
    \n## A donut chart directive\n\nOur `<hello-world>` directive was quaint but not\
    \ very useful. Let’s expand on it by creating a donut chart directive that we\
    \ can reuse.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_91_0.png)\n\nTo get us\
    \ started, we’ll work from this existing D3 code that creates a donut chart.\n\
    \n```html\n1  <!DOCTYPE html>\n2  <html>\n3      <head>\n4          <title></title>\n\
    5      </head>\n6      <body>\n7          <script src=\"angular.js\"></script>\n\
    8          <script src=\"d3.js\"></script>\n9          <script>\n10          \
    \   var color = d3.scale.category10();\n11             var data = [10, 20, 30];\n\
    12             var width = 300;\n13             var height = 300;\n14        \
    \     var min = Math.min(width, height);\n15             var svg = d3.select('body').append('svg');\n\
    16             var pie = d3.layout.pie().sort(null);\n17      var arc = d3.svg.arc()\n\
    18          .outerRadius(min / 2 * 0.9)\n19          .innerRadius(min / 2 * 0.5);\n\
    20\n21      svg.attr({width: width, height: height});\n22      var g = svg.append('g')\n\
    23          // center the donut chart\n24          .attr('transform', 'translate('\
    \ + width / 2 + ',' + height / 2 + ')');\n25\n26      // add the <path>s for each\
    \ arc slice\n27      g.selectAll('path').data(pie(data))\n28          .enter().append('path')\n\
    29              .style('stroke', 'white')\n30              .attr('d', arc)\n31\
    \              .attr('fill', function(d, i){ return color(i) });\n32      </script>\n\
    33  </body>\n34  </html>\n```\n\nLive version: [http://jsbin.com/zinu/1/edit](http://jsbin.com/zinu/1/edit)\n\
    \nJust like in the \"hello world!\" example above, we'll need to setup our new\
    \ directive on the app module.\n\n```javascript\n1 myApp.directive('donutChart',\
    \ function(){\n2   function link(scope, element, attr){\n3       // put D3 code\
    \ here\n4   }\n5   return {\n6       link: link,\n7       restrict: 'E'\n8   }\n\
    9 });\n```\n\nThe only difference is changing the directive name from `helloWorld`\
    \ to `donutChart` so we'll be able to use our directive by the tag name `<donut-chart>`.\n\
    \nIn the link function, we can copy and paste in all of the original pie chart\
    \ code. The only change we'll need to make is updating the `d3.select('body')`\
    \ selection to be relative to the directive using `d3.select(element[0])` instead\
    \ of the entire DOM.\n\n```javascript\n1 // var svg = d3.select('body').append('svg');\
    \ // old version\n2 var svg = d3.select(element[0]).append('svg'); // new version\n\
    ```\n\nThe reason we have to use `element[0]` instead of just `element` is because\
    \ `element` \"is\" a jQuery wrapped selection and not an ordinary DOM object.\
    \ Doing `element[0]` gives us just the plain old DOM element. (I say \"is\" in\
    \ quotes because it's technically a jqLite wrapped DOM element. jqLite is essentially\
    \ a slimmed down version of jQuery.)\n\nLive version: [http://jsbin.com/niwe/1/edit](http://jsbin.com/niwe/1/edit)"
  mdcn: "\n## Hello Angular!\n\n为了熟悉如何安装和设置 Angular 应用，让我们通过创建一个“Hello World”风格的应用来学习。每当输入标签的值发生变化时，该应用都会更新模板。\n\
    \n### 安装 Angular\n\n安装 Angular 最简单的方法是从 Google 的 CDN 引入最新版本，只需将下面的代码片段复制并粘贴到一个新的\
    \ HTML 文件中。（在撰写本文时，最新版本是 1.2.10）。\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n\
    \    <script src=\"https://ajax.googleapis.com/ajax/ajax/libs/angularjs/1.2.10/angular.min.js\"\
    ></script>\n  </head>\n  <body></body>\n</html>\n```\n\n接下来，我们需要使用 `ng-app` 告诉\
    \ Angular 我们的应用从哪里开始。大多数情况下，这通常就是整个 `<body>` 标签。\n\n```html\n<body ng-app>\n \
    \ <!-- yo angular, everything in here is our app -->\n</body>\n```\n\n现在我们将添加一个输入标签，在作用域（scope）上创建一个变量\
    \ `person`。代码片段 `ng-model=\"person\"` 负责执行此操作。它还负责检查 `<input>` 标签的变化并更新作用域，反之亦然。用\
    \ MVC 的术语来说，这通过作用域上的“模型”变量 `person` 将其与 `<input>` 标签（我们的“视图”）“连接”起来。不必太担心作用域*如何*工作，只需知道它包含了我们应用程序的信息。在这种情况下，就是我们想要向其问候的“person”。Angular\
    \ 将通过双向数据绑定自动为我们处理所有连接工作。\n\n```html\n<body ng-app>\n  <input type=\"text\" ng-model=\"\
    person\"></input>\n</body>\n```\n\n现在，每当 `<input>` 标签的值改变时，`person` 变量都会更新，但由于我们没有在其他地方使用该变量，因此无法证明这一点。让我们使用一个简单的\
    \ Angular 模板来解决这个问题。\n\n```html\n<body ng-app>\n  <input type=\"text\" ng-model=\"\
    person\"></input>\n  hello {{person}}!\n</body>\n```\n\n在线版本：[http://jsbin.com/izimoQoL/1/edit](http://jsbin.com/izimoQoL/1/edit)\n\
    \n太棒了！现在当我们更新 `<input>` 文本字段时，更改会自动发送到作用域，从而导致模板被渲染。以下是完整版本。\n\n```html\n1 <!DOCTYPE\
    \ html>\n2 <html>\n3 <head>\n4   <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.10/angular.min.js\"\
    ></script>\n5   <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"\
    ></script>\n6 </head>\n7 <body ng-app>\n8   <input type=\"text\" ng-model=\"person\"\
    ></input>\n9   hello {{person}}!\n10 </body>\n11 </html>\n```\n\n## 用于可重用可视化图表的指令\
    \ (Directives)\n\n### 理解指令\n\n指令为我们提供了一种封装和重用可视化图表的方法，它允许我们实质上创建自己的 HTML 标签。在某种程度上，你已经在运行指令了。HTML5\
    \ 的 `<input>` 标签（如 range 和 date）本质上就是浏览器的自有指令。它们由多个 UI 元素组合而成，但对外提供了一个简单的 API，我们只是无法访问它们的源代码。\n\
    \n```html\n<input type=\"range\" min=\"1\" max=\"1000\" value=\"0\" style=\"width:100%\"\
    >\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_0.png)\n\n```html\n<input\
    \ type=\"date\" value=\"1989-01-23\">\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_1.png)\n\
    \n### 创建指令\n\n既然你已经理解了什么是指令，让我们通过一个例子来学习如何创建第一个指令。大多数指令都具有实用功能，但为了简单起见，我们将创建一个仅显示\
    \ “hello world!” 的指令。\n\n我们从这段 HTML 开始：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <script src=\"angular.js\"></script>\n  </head>\n  <body ng-app>\n\
    \    <!-- our app! -->\n  </body>\n</html>\n```\n\n接下来，我们需要创建一个新的应用模块来承载所有指令。所有指令都将存在于该模块中。目前我们只有一个指令，将其放入模块似乎没有意义，但当我们拥有许多指令时，这将有助于我们将相关的指令分组。\n\
    \n```javascript\nvar myApp = angular.module('myApp', []);\n```\n\n在应用中，我们需要将 `ng-app`\
    \ 更改为 `ng-app=\"myApp\"`，以告诉 Angular 我们想使用自定义的新应用模块，而不是默认模块。\n\n```html\n1 <body\
    \ ng-app=\"myApp\">\n2   <!-- our app! -->\n3 </body>\n```\n\n现在我们可以真正创建指令了。首先，给它起个名字。如果我们想在\
    \ HTML 中使用该指令并将其调用为 `<hello-world></hello-world>`，我们需要将其命名为 `\"helloWorld\"`。Angular\
    \ 会负责将其转换为正确的 HTML 标签名，用连字符 `-` 代替大写字母。\n\n```javascript\n1 myApp.directive('helloWorld',\
    \ function(){\n2   // TODO: finish directive\n3 });\n```\n\n指令有一个 `link` 函数，如果你熟悉面向对象编程，它本质上就像一个“构造函数”。它包含了每次元素出现在\
    \ HTML 中时都应该发生的一切。Angular 会向我们的 `link` 方法传递几个参数：第一个是 `scope`（或“模型”），其次是指令所在的 `element`，第三个是包含所有元素属性的对象哈希。\n\
    \n`restrict: 'E'` 选项告诉 Angular 我们的指令应该使用元素名称（即 `<hello-world></hello-world>`）。我们也可以通过使用\
    \ `'C'` 代替 `'E'`，通过类名来指定某个元素是指令。在这种情况下，我们将使用 `<div class=\"hello-world\"></div>`\
    \ 风格来调用指令。\n\n```javascript\n1 myApp.directive('helloWorld', function(){\n2  \
    \ function link(scope, element, attr){\n3      // TODO: finish directive\n4  \
    \ }\n5   return {\n6      link: link,\n7      restrict: 'E'\n8   }\n9 });\n```\n\
    \n我们的指令目前什么也不做，所以让我们通过在其内容中添加文本 “hello world!” 来改变这一点。因为 `link` 方法会在每个新指令实例创建时被调用，因此修改指令的代码将放在\
    \ `link` 方法内部。\n\n```javascript\n1 function link(scope, element, attr){\n2   element.text(\"\
    hello world!\");\n3 }\n```\n\n指令已完成，但我们还没有在 HTML 中使用它。在这里，我们将它添加到 `<body>` 标签中。\n\
    \n```html\n1 <body ng-app=\"myApp\">\n2   <hello-world></hello-world>\n3 </body>\n\
    ```\n\n全部完成了。现在当 Angular 加载我们的应用时，它会检查 HTML 中是否有任何指令，并调用它们所有的 `link` 函数。生成的 `<body>`\
    \ DOM 如下所示：\n\n```html\n1 <body ng-app=\"myApp\" class=\"ng-scope\">\n2     <hello-world>hello\
    \ world!</hello-world>\n3     <script>...</script>\n4 </body>\n```\n\n在线版本：http://jsbin.com/ABUmAQiR/1/edit\n\
    \nhello world!\n\n## 环形图指令 (Donut Chart Directive)\n\n我们的 `<hello-world>` 指令虽然可爱但没什么用处。让我们通过创建一个可重用的环形图指令来扩展它。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_91_0.png)\n\n为了开始，我们将基于这段现有的、可创建环形图的\
    \ D3 代码进行工作。\n\n```html\n1  <!DOCTYPE html>\n2  <html>\n3      <head>\n4     \
    \     <title></title>\n5      </head>\n6      <body>\n7          <script src=\"\
    angular.js\"></script>\n8          <script src=\"d3.js\"></script>\n9        \
    \  <script>\n10             var color = d3.scale.category10();\n11           \
    \  var data = [10, 20, 30];\n12             var width = 300;\n13             var\
    \ height = 300;\n14             var min = Math.min(width, height);\n15       \
    \      var svg = d3.select('body').append('svg');\n16             var pie = d3.layout.pie().sort(null);\n\
    17      var arc = d3.svg.arc()\n18          .outerRadius(min / 2 * 0.9)\n19  \
    \        .innerRadius(min / 2 * 0.5);\n20\n21      svg.attr({width: width, height:\
    \ height});\n22      var g = svg.append('g')\n23          // center the donut\
    \ chart\n24          .attr('transform', 'translate(' + width / 2 + ',' + height\
    \ / 2 + ')');\n25\n26      // add the <path>s for each arc slice\n27      g.selectAll('path').data(pie(data))\n\
    28          .enter().append('path')\n29              .style('stroke', 'white')\n\
    30              .attr('d', arc)\n31              .attr('fill', function(d, i){\
    \ return color(i) });\n32      </script>\n33  </body>\n34  </html>\n```\n\n在线版本：[http://jsbin.com/zinu/1/edit](http://jsbin.com/zinu/1/edit)\n\
    \n就像上面的 “hello world!” 示例一样，我们需要在应用模块上设置我们的新指令。\n\n```javascript\n1 myApp.directive('donutChart',\
    \ function(){\n2   function link(scope, element, attr){\n3       // put D3 code\
    \ here\n4   }\n5   return {\n6       link: link,\n7       restrict: 'E'\n8   }\n\
    9 });\n```\n\n唯一的区别是将指令名称从 `helloWorld` 更改为 `donutChart`，这样我们就可以通过标签名 `<donut-chart>`\
    \ 来使用我们的指令。\n\n在 `link` 函数中，我们可以复制并粘贴所有原始的饼图代码。我们需要做的唯一更改是将 `d3.select('body')`\
    \ 选择更新为相对于指令的选择，使用 `d3.select(element[0])` 而不是整个 DOM。\n\n```javascript\n1 // var\
    \ svg = d3.select('body').append('svg'); // 旧版本\n2 var svg = d3.select(element[0]).append('svg');\
    \ // 新版本\n```\n\n我们必须使用 `element[0]` 而不仅仅是 `element` 的原因，是因为 `element` “是”一个被\
    \ jQuery 包装的选择集，而不是一个普通的 DOM 对象。执行 `element[0]` 可以让我们获得原生的 DOM 元素。（我对 “是” 加引号是因为它技术上是一个被\
    \ jqLite 包装的 DOM 元素。jqLite 本质上是 jQuery 的精简版。）\n\n在线版本：[http://jsbin.com/niwe/1/edit](http://jsbin.com/niwe/1/edit)\n"
