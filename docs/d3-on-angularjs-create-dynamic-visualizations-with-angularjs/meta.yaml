  mdcn: "\n ```javascript\n2  .domain([0, 1])\n3  .range([10, 100]);\n```\n\n`range()`\
    \ 函数将输出值的范围设定在 10 到 100 之间。它接受一个数值数组，该数组的基数需要与输入域（domain）相匹配。也就是说，数组中数字的数量必须与定义域一致。\n\
    \n`range()` 函数的一个特点是，它不一定需要数值输入，只要底层的插值算法（取决于我们使用的比例尺类型，例如线性、时间等）支持即可。\n\n这使得我们能够实现颜色之间的缩放，例如：\n\
    \n```javascript\n1  var color = d3.scale.linear()\n2      .domain([0, 100])\n\
    3      .range([\"red\",  \"blue\"]);\n4  color(0);   // -> \"#ff0000\" 即红色\n5\
    \  color(50);  // -> \"#800080\" 即紫色\n6  color(100); // -> \"#0000ff\" 即蓝色\n```\n\
    \n## 分段线性比例尺 (Polylinear scales)\n\n在使用线性比例尺时，我们不局限于仅使用两个值。这允许我们将连接的定义域映射到连接的范围。这就像是将几个独立的线性比例尺连接在一起一样。这在处理多色渐变时非常有用。\n\
    \n```javascript\n1  var scale = d3.scale.linear()\n2      .domain([0, 0.5, 1])\n\
    3      .range(['blue', 'white', 'red']);\n```\n\n> 在创建此类颜色渐变时，一个常见的错误是忘记让定义域（domain）元素的数量与范围（range）颜色的数量保持一致。在上面的示例中，如果我们给\
    \ `domain()` 传递一个长度为 2 的数组（即 `[0, 1]`）而不是 3（即 `[0, 0.5, 1]`），那么我们的范围输出将仅从蓝色变到白色。\n\
    \n## 使用我们的比例尺\n\n当需要将数据转换为像素时，我们只需使用 `scale(d)`。\n\n例如，假设我们的定义域范围是从 0 到 2，我们希望将其映射到\
    \ 0 到 500 之间的图表上。\n\n```javascript\n1  var scale = d3.scale.linear()\n2      .domain([0,\
    \ 2])\n3      .range([0, 500]);\n```\n\n如果我们向生成的 `scale()` 函数传递 0，我们将得到输出值 0。如果我们传递\
    \ 2，我们将得到最大输出值 500。\n\n我们可以使用这个比例尺在 0 和 2 之间提供渐变。例如：\n\n```javascript\n1 scale(0.5);\
    \ // 125\n2 scale(1.1); // 275\n3 scale(1.9); // 475\n```\n\n我们可以看到，比例尺为每个数据项输出相对范围。这个过程被称为\
    \ *归一化* (normalization)，即将一个数值映射到给定比例尺上所有可能的最小值和最大值之间。\n\n> 如果舔到 Tootsie Roll\
    \ 糖果中心需要 100 下，那么舔了 90 下就完成了 90% 的进度，而舔了 10 下则只完成了 10%。这就是所谓的归一化。\n\n回到我们对收视率的映射，我们可以创建一个映射到整个数据集的比例尺：\n\
    \n```javascript\n1 var scale = d3.scale.linear()\n2    .domain(d3.extent(data))\n\
    3    .range([0, 200]);\n```\n\n这将把输入值的整个范围从最小值映射到最大收视率值。\n\n我们现在可以使用这个比例尺来设置柱状图的高度：\n\
    \n```javascript\n1 // 从高度向上计数，\n2 // 因为 y 轴是向下计数的\n3 svg.selectAll('rect')\n4\
    \    .data(data).enter()\n5    .append('rect')\n6    .attr('y', function(d){\n\
    7       return height - scale(d);\n8    });\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_68_0.png)\n\
    \n在本章中，我们介绍了如何使用 `d3.scale.linear()` 比例尺，但在将输入定义域数据映射到输出范围时，我们还有相当多的其他选项。\n\n\
    ## 其他非线性比例尺\n\nD3 包含了除简单线性映射之外的其他比例尺。例如，我们可以使用 `d3.scale.log()` 函数创建 **对数比例尺 (logarithmic\
