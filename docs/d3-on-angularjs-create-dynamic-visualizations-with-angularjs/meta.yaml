    # # Array helpers


    D3 is packed with a bunch of object helpers that allow us to massage our data
    into more meaningful data structures. This process, often called “cleaning” our
    data is a common task for data visualizers.


    We’ll discuss this process in-depth in chapter 7.


    JavaScript itself includes many methods to help us modify our datasets in a meaningful
    way. We can reverse the order of the elements in our array, modify the contents
    of our arrays, append two together, filter through elements, etc.


    The libraries `lodash` and `underscore` also provide convenient methods for handling
    many different cases for which we can modify our data.


    We’ll walk through common methods for how we can manipulate our data in this chapter.


    # ## Ranges


    We’ll often use a `range` in our data visualization tools. A range is an array
    containing an arithmetic progress of numbers. These numbers can be integers of
    floating point numbers. This is particularly useful when we’re creating axis where
    we want to show a range of numbers in a graph, for instance.


    We’ll use the method `d3.range([start,] stop[, step])`, which takes up to three
    arguments to generate arrays of incrementing/decrementing sequences:


    **start**

    The `start` argument is defaults to 0 and is considered optional. This is where
    the range array will start.


    **stop**

    The `stop` argument is required and will determine where the range will stop.
    Note that the resulting array will exclude the stop number.


    **step**

    The `step` determines how much we’ll increment or decrement our counter by. If
    it’s positive, then it will increase the next value by the `step` amount. If it’s
    negative, then it will decrease the next value by the `step` amount.


    If it’s omitted, then `step` defaults to 1.


    This enables us to generate arrays, such as the following:


    ```

    1 d3.range(0, 5); // => [0, 1, 2, 3, 4]

    2 d3.range(0, 6, 2); // => [0, 2, 4]

    3 d3.range(5); // => [0, 1, 2, 3, 4]

    4 d3.range(3, 1, -0.5); // => [3, 2.5, 2, 1.5]

    ```


