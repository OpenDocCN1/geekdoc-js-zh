    \ `d[0]` 来引用建筑名称，并使用 `scale(d[1])` 将建筑物高度映射到轴上的像素x位置。我们还将使用 `rotate(-20)` 给它一个轻微的逆时针旋转，这样标签就不会重叠。最后，我们应用最后一个平移变换\
    \ `translate(5,-5)`，这样标签就不会紧贴着数据点。\n\n```javascript\n// 添加标签\nsvg.selectAll('text').data(data)\n\
    \   .enter().append('text').text(function(d){ return d[0] })\n   .attr('transform',\
    \ function(d){\n      return 'translate(' + scale(d[1]) + ', ' + height + ') '\n\
    \         + 'rotate(-20) translate(5,-5)';\n   });\n```\n\n让我们也使用坐标轴的 `tickFormat()`\
    \ 方法来格式化坐标轴标签，这样人们就能知道我们使用的单位。D3提供了多种不同的格式化器，我们可以传递给坐标轴的 `tickFormat`。如果你有兴趣阅读相关内容，请查看\
    \ [d3.format()](https://github.com/mbostock/d3/wiki/Formatting) 和 [d3.time.format()](https://github.com/mbostock/d3/wiki/Time-Formatting)。我们的格式化器\
    \ `d3.format(',.0f')` 会四舍五入小数并添加逗号。即 `d3.format(',.0f')(1000.04) == \"1,000\"\
    `。\n\n```javascript\n// 创建我们的坐标轴并格式化刻度\nvar axis = d3.svg.axis().scale(scale)\n\
    \   .tickFormat(function(d){ return d3.format(',.0f')(d) + 'ft' }).ticks(5);\n\
    ```\n\n作为最后的修饰，假设我们觉得第一个数据点之前的空白区域太多了。让我们更新比例尺，使其从第一个数据点开始，而不是从零开始。这个更改很简单，只需将比例尺的定义域从\
    \ `[0, d3.max(...)]` 更改为 `d3.extent(data, ...)`。\n\n```javascript\nvar scale =\
    \ d3.scale.linear()\n   // .domain([0, d3.max(data, function(d){ return d[1];\
    \ })])\n   .domain(d3.extent(data, function(d){ return d[1]; }))\n   .range([10,\
    \ width]);\n```\n\n这是最终版本的样子：\n\n![](img/82f49fe8a368850935eb7606dfa7579d_73_0.png)\n\
    \n## 世界最高的建筑\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <script src=\"\
    http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n    <style>\n    \
    \  .x.axis path, .x.axis line{\n        fill: none; stroke: black;\n      }\n\
    \    </style>\n  </head>\n  <body>\n    <script>\n      var width = 700, height\
    \ = 100;\n      var svg = d3.select('body').append('svg');\n      // 世界最新的建筑\n\
    \      var data = [\n        [\"Burj Khalifa\"              , 2717],\n       \
    \ [\"Shanghai Tower\"            , 2073],\n        [\"Makkah Royal Clock Tower\
    \ Hotel\", 1971],\n        [\"One World Trade Center\"    , 1776],\n        [\"\
    Taipei 101\"                , 1670]\n      ];\n      var scale = d3.scale.linear()\n\
    \        .domain(d3.extent(data, function(d){ return d[1]; }))\n        .range([10,\
    \ width]);\n      // 添加数据点\n      svg.selectAll('circle').data(data)\n       \
    \ .enter().append('circle').attr('r', 4).attr('transform', function(d){\n    \
    \      return 'translate(' + scale(d[1]) + ', ' + height + ')'\n        });\n\
    \      // 添加标签\n      svg.selectAll('text').data(data)\n        .enter().append('text').text(function(d){\
    \ return d[0] })\n        .attr('transform', function(d){\n          return 'translate('\
    \ + scale(d[1]) + ', ' + height + ') '\n            + 'rotate(-20) translate(5,-5)';\n\
    \        });\n      // 创建坐标轴\n      var axis = d3.svg.axis().scale(scale)\n  \
    \      .tickFormat(function(d){ return d3.format(',.0f')(d) + 'ft' }).ticks(5)\n\
    \        .attr('transform', 'translate(0,' + height + ')');\n    </script>\n \
    \ </body>\n</html>\n```\n\n在线版本：http://jsbin.com/wujicosu/1/edit\n\n## 动画与交互\n\
    \n我们将在本章介绍动画和其他交互概念的基础知识。这些技术为实时更新、实时数据可视化等应用奠定了基础。\n\n### 过渡动画\n\n几乎所有使用D3构建的动画数据可视化的核心都是过渡动画。过渡动画使我们能够轻松地为一组选中的元素应用平滑的、动画的过渡效果。用一个简单的例子直接展示会更容易理解。如果第一次没有注意到动画，请重新加载页面。\n\
    \n```html\n1 <!DOCTYPE html>\n2 <html>\n3   <body>\n4     <script src=\"http://d3js.org/d3.v3.min.js\"\
    \ charset=\"utf-8\"></script>\n5     <script>\nd3.select('body').append('svg')\n\
    \  .append('circle').attr({r: 10, cx: 100, cy: 100})\n  .transition().attr('cx',\
    \ 300);\n6     </script>\n7  </body>\n8 </html>\n```\n\n哇，这多酷啊！我们只用一行代码就让一个 `circle`\
    \ 动了起来！让我们分解一下这里发生了什么。选择器有一个额外的方法叫做 `transition()`，它会返回*另一个选择器*，具体来说，是一个特殊的“[过渡](http://bost.ocks.org/mike/transition/)选择器”，它会逐渐将第一个选择器中所有DOM元素的属性和样式更新为第二个选择器中的新值。这一切都发生在250毫秒（1/4秒）的时间内，这是过渡动画的默认持续时间。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_75_0.png)\n\n作为提醒，对选择器调用 `transition()`\
    \ 返回的对象本身也是一个选择器，所以我们可以很容易地将这种技术用于包含多个元素的选择器。如果我们没有在过渡前后的两个选择器中更改某个特定的属性或样式，那么该属性将*不会*被过渡。\n\
    \n我们可以通过使用仅存在于过渡选择器上的 `.duration()` 方法来调整过渡的持续时间。基于上面的例子，我们可以使用 `transition().duration(4000)`\
    \ 来调整动画，使其花费4秒（4000毫秒），而不是250毫秒。\n\n```javascript\n1 d3.select('body').append('svg')\n\
    2   .append('circle').attr({r: 10, cx: 100, cy: 100})\n3   .transition().duration(4000).attr('cx',\
    \ 300);\n```\n\n过渡动画的另一个有用特性是指定缓动类型的能力。缓动让我们可以调整过渡应该如何加速。例如，如果我们从5英尺高的地方扔下一根羽毛，它会以近似恒定的速率下落（除非我们在没有大气层减缓羽毛速度的月球上）。这将是“线性”缓动类型。相反，如果我们扔下一把锤子，它会向下加速，越来越快。这将是“exp”缓动类型。默认情况下，D3使用“cubic-in-out”，这是现实世界中大多数物体移动的方式。大多数物体不会瞬间以恒定速度开始移动。它们先加速，然后当接近目标时减速，就像一辆车在停车标志后加速，然后在接近十字路口的红灯时减速。这是上面示例中说明的相同过渡。这是一个如何指定具有4秒持续时间的不同缓动类型的例子。\n\
    \n```javascript\nd3.select('body').append('svg')\n  .append('circle').attr({r:\
    \ 10, cx: 100, cy: 100})\n  .transition().duration(4000).ease('bounce').attr('cx',\
    \ 300);\n```\n\n[这里有一个可视化](link)展示其他缓动类型。\n\n![](img/82f49fe8a368850935eb7606dfa7579d_76_0.png)\n\
    \n请注意上面所有过渡动画（除了最后一个“cubic-in-out”）都获得了速度。“cubic-in-out”实际上与“cubic”相同，只是它的缓动均匀地应用于两端（进入和退出部分）。默认情况下，所有缓动类型都是“in”，所以只有“cubic”与“cubic-in”相同，我们可以通过附加“-out”或“-in-out”来调整缓动类型。以下是3种不同多\n"
