  md: "# Best practices for creating reusable visualizations\n\nSo far our visualizations\
    \ have been relatively simple example visualizations mainly intended to help us\
    \ understand how Angular and D3 works. In the the wild, our visualizations are\
    \ often drastically more complicated. This chapter will cover some of the general\
    \ best practices the authors have come across when creating directives that are\
    \ general purpose and reusable.\n\n> It’s important to remember that over generalization\
    \ can be just as bad as under generalization. A good strategy is to always take\
    \ some time up front to consider if a visualization needs to be generalized. Does\
    \ the visualization need to be used in multiple places? If the answer is “no”\
    \ then some of these techniques may unnecessarily over complicate our code.\n\n\
    # Accessor functions\n\nIn Angular, a scope expression is a code snippet, similar\
    \ to a function, that can be configured on the directive as an attribute. Our\
    \ directive will evaluate this expression when accessing each element in our data.\
    \ By making the accessors configurable, we avoid having a directive that assumes\
    \ a particular input format.\n\nThis means our directive can accept any type of\
    \ data array so long as we tell it out to pluck the specific values out of the\
    \ data using the accessor expression. We’ll walk through a demonstration of what\
    \ this means assuming our data is the following viewership information for AMC’s\
    \ *The Walking Dead* TV series.\n\n```\nscope.episodes = [\n  { title: 'Days Gone\
    \ Bye', air_date: '2010-10-31', us_viewers: 5.35 },\n  { title: 'Guts', air_date:\
    \ '2010-11-07', us_viewers: 4.71 },\n  // ...\n];\n```\n\nWe could specify the\
    \ x and y accessor expressions for a scatter plot directive given that our directive\
    \ has two Angular expressions on its scope, accessorX, and accessorY using the\
    \ following.\n\n```\n<scatter\n  data=\"episodes\"\n  accessor-x=\"d.air_date\"\
    \n  accessor-y=\"d.us_viewers\"></scatter>\n```\n\nWe can do this using the &\
    \ when configuring the directive. To make the two attributes accessor-x and accessor-y\
    \ expressions, the scope configuration on our directive needs to use an & instead\
    \ of a =.\n\n```\nscope: { accessorX: '&', accessorY: '&', data: '=' }\n```\n\n\
    The last step is to use the scope expressions when accessing the x and y values\
    \ of the data array in the directive.\n\n```\nvar d = data[0];\nvar xVal = scope.accessorX({d:\
    \ d});\n```"
  merge: -1
