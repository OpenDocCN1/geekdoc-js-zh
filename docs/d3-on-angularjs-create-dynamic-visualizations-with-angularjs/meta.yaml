    \ 是一种“元库（meta-library）”；如果你在创建一套新的数据可视化库，那么这就是你一定会想要这样一种库。它通过一种思考数据可视化的新方式来实现（关于这一点，稍后会详细讨论）。简而言之，如果我们要创建数据可视化，使用\
    \ D3 编写的代码量通常比不用 D3 要少一个数量级。\n\n在配置可视化的外观和感觉时，只要我们在创建构成柱状图的组件时使用了类（classes），就可以非常轻松地利用我们现有的\
