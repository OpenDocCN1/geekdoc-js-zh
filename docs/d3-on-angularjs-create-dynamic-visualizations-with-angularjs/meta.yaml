    released Riding Rails with AngularJS. He also teaches in-person classes at Hack
    Reactor and online with airpair.


    Victor Powell is a freelance data visualization developer. Prior to freelance,
    Victor built data visualization tools with YinzCam, Inc. used by NFL, NHL, and
    NBA sports teams. In his free time, Victor enjoys finding ways to explaining unintuitive
    or complex mathematical concepts visually. Victor also guest instructs at Hack
    Reactor.


    # ## About this book


    *The D3 on AngularJS* book is packed with the solutions you need to be a [D3](https://d3js.org)
    and [AngularJS](https://angularjs.org) expert. AngularJS is an advanced front-end
    framework released by the team at [Google](https://www.google.com). It enables
    you to build a rich front-end experience, quickly and easily and D3 is an advanced
    data visualization framework released by Mike Bostock.


