  md: '# ## Events


    Events allow our visualizations to be interactive. Using them, we specify what
    should happen when a user performs an action, like clicking, or moving the mouse,
    or pressing the keyboard. HTML on its own has a variety of different interactive
    events we can opt to be notified of using callbacks. D3 simply makes it easier
    to set them up using selections instead of having to deal with individual DOM
    elements directly. We can do all this just using the `on()` selection method,
    passing it the name of the event we want to listen for and a callback function
    which should be called when that event occurs. Lets have a look at a simple ''hello
    world'' style event example that compares the native HTML way of setting up an
    event listener and the D3 way.


    ```

    1 <!DOCTYPE html>

    2 <html>

    3     <body>

    4        <script src="http://d3js.org/d3.v3.min.js" charset="utf-8"></script>

    5        <select>

    6          <option value="hello">hello</option>

    7          <option value="world">world</option>

    8        </select>

    9        <script>

    10 // // the non-D3 way

    11 document.getElementsByTagName(''select'')[0]

    12    .addEventListener(''change'', function(){ alert(this.value); });

    13 // the D3 way

    14 d3.select(''select'').on(''change'', function(){ alert(this.value); });

    15      </script>

    16    </body>

    17 </html>

    ```


    Notice how the callback gets called with the `select` element as the `this` variable.
    Using `on` instead of `addEventListener` might sound like a trivial change but
    there''s more going on here than just that. Different event listeners are being
    applied to all the elements in the selection. Just like most other selection methods,
    our callback will get called with the first two arguments set to the clicked elements
    datum and index in the selection, respectively. Event listener will only be setup
    once per element, event if we re-setup the listener. If we copied and pasted the
    non-D3 version, we''d get two alerts.


    ```

    1 document.getElementsByTagName(''select'')[0]

    2   .addEventListener(''change'', function(){ alert(this.value); });

    3 document.getElementsByTagName(''select'')[0]

    4   .addEventListener(''change'', function(){ alert(this.value); });

    5 // the second event listener is added after the first

    ```


    If we did the same with the D3 version, we''d get only one.


    ```

    1 d3.select(''select'').on(''change'', function(){ alert(this.value); });

    2 d3.select(''select'').on(''change'', function(){ alert(this.value); });

    3 // the second event listener overrides the first

    ```


    This is convenient since most of the time, we''ll want simply re-apply our event
    listeners for all selected elements instead of having to explicitly remove our
    old listeners. If, for some reason, we want to remove all the event listeners
    for a selection, we can call `on()` with null as the second argument.'
  merge: -1
