    ## SVG 基础\n\n本章的第一节将介绍 SVG，这是一种在浏览器中创建矢量图形的强大开放 Web 标准。在本章的后半部分，我们将重点介绍让 SVG 操作变得有趣且可控的\
    \ D3 辅助函数。\n\n## 可缩放矢量图形 (Scalable Vector Graphics)\n\n虽然 D3 可以轻松地帮助我们创建和绘制 div\
    \ 元素，但我们的可视化通常需要更强大的能力。我们将使用可缩放矢量图形（简称 SVG）来为我们在 DOM 中绘图提供一个更具表现力的接口。\n\nSVG 与\
    \ HTML 一样，是一种基于 XML 的标记语言，专门用于创建支持交互和动画的矢量二维图形。\n\n传统的图形系统（或光栅图形）依赖于对像素的操作，这通常会导致所谓的“破坏性过程”。这意味着一旦我们决定以某种特定方式修改像素信息，就很难甚至不可能更改或撤销这些更改。\n\
    \n在矢量图形中，不再是简单地记录图像中的所有像素，而是在图形显示在屏幕上之前，仅记录必要的形状和颜色并重新计算。最后一步（将几何形状转换为屏幕上的像素）会透明且自动地为我们完成。\n\
    \n这个过程的优点是易于缩放，且占用的存储空间更小。它允许我们使用任何标准文本编辑器创建 SVG 图像，我们可以搜索它们、通过脚本控制它们，并且可以无限缩放。\n\
    \n与光栅图形相比，矢量图形确实有一些缺点。例如，将照片存储为光栅图形要方便得多，因为大多数照片并非由简单的几何形状组成。另一方面，大多数数据可视化是由简单的几何形状组成的，因此矢量图形使其成为\
    \ D3 的完美搭档。\n\n我们将会遇到的几乎每一个 D3 数据可视化作品可能都是使用 SVG 创建的。由于我们存储的是几何信息而非直接的像素数据，这意味着我们以后可以非常容易地对创建的\
    \ SVG 图形进行修改。\n\nSVG 最方便的一点可能是我们可以直接在 HTML 内部使用它。它会让我们*感觉*像是在操作任何其他 DOM 元素，但结果却是一个图形。\n\
    \n## 入门\n\n为了开始，让我们看一个如下的“Hello World”风格的 SVG 示例：\n\n```\n<!DOCTYPE HTML>\n<html>\n\
    \    <body>\n        <svg>\n            <circle cx=\"223\" cy=\"83\" r=\"54\"\
    />\n```\n"
