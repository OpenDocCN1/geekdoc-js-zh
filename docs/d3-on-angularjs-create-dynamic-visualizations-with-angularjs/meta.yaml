    # Updating the scope from within a directive


    So far, the communication of our directives with the outside world has been one
    sided. Our directives have always been responding to data changes, never the other
    way around. There are times, however, when we’d like to effect our data from within
    our directive.


    It can often be a very modular technique to update data on our directives scope
    and then optionally listen for changes to that variable in some other place in
    our application or even in other directives. This makes our directives more reusable
    because they no longer need to know anything about each other. We can drop a directive
    into another part of our application or another application entirely without much
    work in wiring it up since we’ll only have to use a $watch statement on the scope
    variable we passed to the directive in its HTML definition to be notified of change
    to the variable.


    As a concrete example, imagine we created a scatter plot directive and wanted
    to add the ability to see the details of an individual point whenever the mouse
    is placed over the top of this point. There are a few ways to achieve this, some
    more modular than others. One way is to create a specific directive, something
    such as a “scatter-plot-detail” directive. Which is fine until we need another
    type of scatter plot that does something slightly different. Possibly displaying
    the details in a slightly different way than the first. If we were to stick with
    our first strategy, we would now need a completely new directive, almost identical
    to the first expect in the way it displayed its detail content.


    A better approach would be to have a single directive that displays a scatter
    plot that is not responsible for displaying any details about the selected point.
    All it has is a new scope variable named selectedPoint. Then, when a point is
    moused over, it will set the selectedPoint scope property to the data of the newly
    moused over point.


    ```

    1 // our `<scatter-plot>` directives new isolate scope

    2 scope: { selectedPoint: ''='', data: ''='' }


    1 point.append(''circle'').attr(''r'', 5)

    2   .on(''mouseover'', function(d){

    3       scope.$apply(function(){

    4           scope.selectedPoint = d;

    5       });

    6   });

    ```


    To finish up, all we need to do is configure our directive in the HTML and add
    our description template using Angular’s {{ }} syntax.


    ```

    1 <body ng-app="myApp" ng-controller="MainCtrl">

    2   <div class="scatter-container">

    3     <scatter data="employers" selected-point="selectedEmployer"></scatter>

    4   </div>

    5   <div class="detail">

    6     <h2>{{selectedEmployer.name }}</h2>

    7     <!-- and possibly some other details about the employer -->

    8   </div>

    9 </body>

    ```'
- md: "## Best practices for creating reusable visualizations\n\nSo far our visualizations\
    \ have been relatively simple example visualizations mainly intended to help us\
    \ understand how Angular and D3 works. In the wild, our visualizations are often\
    \ drastically more complicated. This chapter will cover some of the general best\
    \ practices the authors have come across when creating directives that are general\
    \ purpose and reusable.\n\n> It’s important to remember that over generalization\
    \ can be just as bad as under generalization. A good strategy is to always take\
    \ some time up front to consider if a visualization needs to be generalized. Does\
    \ the visualization need to be used in multiple places? If the answer is “no”\
    \ then some of these techniques may unnecessarily over complicate our code.\n\n\
    ## Accessor functions\n\nIn Angular, a scope expression is a code snippet, similar\
    \ to a function, that can be configured on the directive as an attribute. Our\
    \ directive will evaluate this expression when accessing each element in our data.\
    \ By making the accessors configurable, we avoid having a directive that assumes\
    \ a particular input format.\n\nThis means our directive can accept any type of\
    \ data array so long as we tell it how to pluck the specific values out of the\
    \ data using the accessor expression. We’ll walk through a demonstration of what\
    \ this means assuming our data is the following viewership information for AMC’s\
    \ *The Walking Dead* TV series.\n\n```\nscope.episodes = [\n  { title: 'Days Gone\
    \ Bye', air_date: '2010-10-31', us_viewers: 5.35 },\n  { title: 'Guts', air_date:\
    \ '2010-11-07', us_viewers: 4.71 },\n  // ...\n];\n```\n\nWe could specify the\
    \ x and y accessor expressions for a scatter plot directive given that our directive\
    \ has two Angular expressions on its scope, accessorX, and accessorY using the\
    \ following.\n\n```\n<scatter\n  data=\"episodes\"\n  accessor-x=\"d.air_date\"\
    \n  accessor-y=\"d.us_viewers\"></scatter>\n```\n\nWe can do this using the `&`\
    \ when configuring the directive. To make the two attributes `accessor-x` and\
    \ `accessor-y` expressions, the scope configuration on our directive needs to\
    \ use an `&` instead of an `=`.\n\n```\nscope: { accessorX: '&', accessorY: '&',\
    \ data: '=' }\n```\n\nThe last step is to use the scope expressions when accessing\
    \ the x and y values of the data array in the directive.\n\n```\nvar d = data[0];\n\
    var xVal = scope.accessorX({d: d});\n```\n\nUsing the same syntax, we can add\
    \ additional variables that will be available inside the expression. In this way,\
    \ we could expose the index variable `i` in the expression or any other variables\
    \ we'd like to be accessible from with the accessor.\n\n```\nvar i = 0;\nvar d\
    \ = data[i];\nvar xVal = scope.accessorX({d: d, i: i});\n```\n\nThis technique\
    \ also works well for other properties, like color, size, or anything else we'd\
    \ like to be made configurable. This also makes it convenient to set a property\
    \ uniformity. In the case of our scatter plot, we might make the color configurable\
    \ by an expression.\n\n```\n<scatter data=\"episodes\" color=\"color(d.title)\"\
    \ ... ></scatter>\n```\n\nInside of our controller, we would then need a color\
    \ scale that the expression uses to determine the color for each plot point.\n\
    \n```\n// on our controller\n$scope.color = d3.scale.category10();\n```\n\nOr\
    \ alternatively, set all the points to be `\"red\"` by setting `color=\"'red'\"\
    ` in the accessor expression.\n\n```\n<scatter data=\"episodes\" color=\"'red'\"\
    \ ... ></scatter>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_110_0.png)\n\
    \nLive version: [http://bl.ocks.org/vicapow/9591312](http://bl.ocks.org/vicapow/9591312)\n\
    \n## Responsive directives\n\nResponsive web development involves having the components\
    \ of a site automatically resize or hide to take up just enough of the screen\
    \ space as is available. Browsing a responsive site on a mobile phone with a smaller\
    \ screen would show the site in an adapted view optimized for the new screen dimensions.\
    \ Similarly, for larger screens, a responsive site will grow large enough, possibly\
    \ showing more content, to fully utilize the larger space. This is alternative\
    \ to having two or three separate versions of the same site for different screen\
    \ sizes. With a responsive website design, the site grows or shrinks dynamically\
    \ in \"response\" to screen size changes.\n\nA good technique for having directives\
    \ update dynamically depending on the size of the screen is to have the directive\
    \ watch for changes to its width and height and update any internal content within\
    \ the visualization accordingly.\n\n```\nvar w = 0;\nvar h = 0;\nscope.$watch(function(){\n\
    \  w = el.clientWidth;\n  h = el.clientHeight;\n  return w * h;\n}, resize);\n\
    ```\n\nBut for this to work as expected, we'll need to have the scope check for\
    \ changes every time the window resizes.\n\n```\nangular.element($window).on('resize',\
    \ function(){ $scope.$apply() });\n```\n\nA good place for this code is somewhere\
    \ inside a main controller because it only needs to be called once. All directives\
    \ that are made responsive in this way, will be checked for changes once this\
    \ one line is added somewhere within our application.\n\nThe last step is to make\
    \ sure the directive element can be shrunken down. The containing element will\
    \ never be smaller than its content unless we set `overflow:hidden` meaning, \"\
    ignore any content inside this element that goes beyond the element itself.\"\n\
    \n```\nscatter{\n  display: block;\n  overflow: hidden;\n}\n```\n\nNow, to set\
    \ the actual size of the directive, we can use CSS percentages to have the size\
    \ of the visualization update dynamically just like any other built-in HTML element.\n\
    \n```\n.scatter-1{\n  width: 50%;\n  height: 400px;\n}\n```\n\nOr to have it take\
    \ up the entire page:\n\n```\n.scatter-1{\n  width: 100%;\n  height: 100%;\n}\n\
    ```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_112_0.png)\n\nLive version: [http://bl.ocks.org/vicapow/9716306](http://bl.ocks.org/vicapow/9716306)\n\
    \n## Services\n\n### Services to store data\n\nBeyond having directives remain\
    \ unopinionated about their data sources, it’s also a good idea to do the same\
    \ for controllers. This allows us to easily swap out different types of data from\
    \ different controllers acting as a proxy between the controller and the data.\
    \ Here’s a concrete example for when this ability would be useful. Imagine we\
    \ have two controllers that both need to access the same remote piece of data.\
    \ Instead of having each controller request the remote data independently, issuing\
    \ two separate requests, we can instead use an Angular service to provide the\
    \ data to each controller. In this way, the service can automatically store the\
    \ data internally for subsequent requests or provide any necessary data formatting\
    \ prior to passing the data back to each controller.\n\n### Services to reduce\
    \ code duplication\n\nServices are also a great place to store common utility\
    \ functions that multiple controllers might each need. This reduces the amount\
    \ of code duplication across controllers. But services aren’t limited to just\
    \ being used inside of controllers. Directives can also use services. Anytime\
    \ we notice duplicate or similar code across directives or controllers, the best\
    \ place to share this code is from within a service.\n\n### Built in directives\n\
    \nTo keep things simple, up to this point we’ve avoided creating our own directives\
    \ in any other way but by their element name. That is, if we wanted a map component\
    \ we created an element style directive and used it in our HTML as `<my-map>`.\
    \ But directives are actually much more flexible and their use isn't limited to\
    \ just that. Directives, in actuality, are just chunks of code that run on a DOM\
    \ element. We've been using them to encapsulate complex DOM manipulations (our\
    \ visualizations) while exposing a simple interface (their use in HTML as just\
    \ `<my-map>`) but directives can also be created using an attribute syntax such\
    \ as `<div my-map></div>`. This is done by using `restrict: 'A'` instead of `restrict:\
    \ 'E'` in our directive definition. Most of the features introduced to newcomers\
    \ of Angular are just the most useful directives that come bundled with the Library.\n\
    \nOne of the exciting things about using directives as attributes is that we're\
    \ no longer limited to having just one directive on an element. All the directives\
    \ on a given element will have access to the same scope properties. Take the `ng-show`\
    \ directive which either hides or shows the element its attached to depending\
    \ on the evaluation of its expression as true or false. This makes it easy to\
    \ implement something like a \"loading\" dialog. With it we can create a directive\
    \ component that is the loading dial and use the `ng-show` directive to hide the\
    \ directive once a map (or any other component) has finished loading its data.\n\
    \n```\n<loading-overlay ng-show=\"mapIsLoading\">\n</loading-overlay>\n<my-map\
    \ loading=\"mapIsLoading\"></my-map>\n```\n\nLive version: [http://bl.ocks.org/vicapow/9819505](http://bl.ocks.org/vicapow/9819505)\n\
    \n## Using `replace`, `template`, and `transclude` to modify the behavior of our\
    \ visualizations\n\nWhen defining directives, we can optionally tell the Angular\
    \ compiler that it should replace the element with the directive with a provided\
    \ template. This comes in handy if we want to replace the custom directive element\
    \ with an actual SVG element instead of having a custom directive element \"wrapping\"\
    \ our visualization (which is what our directives have been doing up until now.)\
    \ Let's walk through an example of this in the case of creating a [sparkline](http://bl.ocks.org/vicapow/9819505)\
    \ directive. Sparklines are little mini graphs that can be embedded inline between\
    \ words in a text document.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_108_0.png)\n\
    \nLive version: [http://bl.ocks.org/vicapow/9592134](http://bl.ocks.org/vicapow/9592134)"
  mdcn: "\n## 创建可复用可视化的最佳实践\n\n到目前为止，我们的可视化都是相对简单的示例，主要目的是帮助我们理解 Angular 和 D3 的工作原理。在实际应用中，我们的可视化往往要复杂得多。本章将介绍作者在创建通用且可复用的指令时总结的一些通用最佳实践。\n\
    \n> 重要的是要记住，过度泛化与泛化不足同样有害。一个好的策略是始终提前花些时间考虑可视化是否需要泛化。该可视化是否需要在多个地方使用？如果答案是“否”，那么其中一些技术可能会不必要地使我们的代码过于复杂。\n\
    \n## 访问器函数\n\n在 Angular 中，作用域表达式是一段代码片段，类似于函数，可以作为属性配置在指令上。我们的指令在访问数据中的每个元素时会计算这个表达式。通过使访问器可配置，我们避免了指令假定特定输入格式的问题。\n\
    \n这意味着我们的指令可以接受任何类型的数据数组，只要我们告诉它如何使用访问器表达式从数据中提取特定值。我们将在以下假设下演示这意味着什么：我们的数据是 AMC\
    \ *《行尸走肉》* 电视剧的收视信息。\n\n```\nscope.episodes = [\n  { title: 'Days Gone Bye', air_date:\
    \ '2010-10-31', us_viewers: 5.35 },\n  { title: 'Guts', air_date: '2010-11-07',\
    \ us_viewers: 4.71 },\n  // ...\n];\n```\n\n我们可以为散点图指令指定 x 和 y 访问器表达式，前提是我们的指令在其作用域上有两个\
    \ Angular 表达式，即 accessorX 和 accessorY，如下所示。\n\n```\n<scatter\n  data=\"episodes\"\
    \n  accessor-x=\"d.air_date\"\n  accessor-y=\"d.us_viewers\"></scatter>\n```\n\
    \n我们可以在配置指令时使用 `&` 来实现这一点。要使两个属性 `accessor-x` 和 `accessor-y` 成为表达式，我们指令上的作用域配置需要使用\
    \ `&` 而不是 `=`。\n\n```\nscope: { accessorX: '&', accessorY: '&', data: '=' }\n\
    ```\n\n最后一步是在指令中访问数据数组的 x 和 y 值时使用作用域表达式。\n\n```\nvar d = data[0];\nvar xVal =\
    \ scope.accessorX({d: d});\n```\n\n使用相同的语法，我们可以添加将在表达式内部使用的其他变量。这样，我们可以在表达式中暴露索引变量\
    \ `i` 或任何其他我们希望从访问器访问的变量。\n\n```\nvar i = 0;\nvar d = data[i];\nvar xVal = scope.accessorX({d:\
    \ d, i: i});\n```\n\n这种技术也适用于其他属性，如颜色、大小或任何我们希望配置的属性。这也使得设置属性统一性变得方便。在我们的散点图示例中，我们可以通过表达式配置颜色。\n\
    \n```\n<scatter data=\"episodes\" color=\"color(d.title)\" ... ></scatter>\n```\n\
    \n在我们的控制器中，我们随后需要一个颜色比例尺，供表达式用来确定每个数据点的颜色。\n\n```\n// 在我们的控制器中\n$scope.color =\
    \ d3.scale.category10();\n```\n\n或者，通过在访问器表达式中设置 `color=\"'red'\"`，将所有点设为 `\"\
    red\"`。\n\n```\n<scatter data=\"episodes\" color=\"'red'\" ... ></scatter>\n```\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_110_0.png)\n\n实时版本：[http://bl.ocks.org/vicapow/9591312](http://bl.ocks.org/vicapow/9591312)\n\
    \n## 响应式指令\n\n响应式网页开发涉及让网站的组件自动调整大小或隐藏，以恰好占用可用的屏幕空间。在屏幕较小的手机上浏览响应式网站时，网站会以针对新屏幕尺寸优化的自适应视图显示。同样，对于较大的屏幕，响应式网站会扩展得足够大，可能显示更多内容，以充分利用更大的空间。这与为不同屏幕尺寸创建两三个单独版本的网站不同。采用响应式网站设计，网站会根据屏幕尺寸变化动态地“响应”式增长或缩小。\n\
    \n让指令根据屏幕大小动态更新的一种好技术是让指令监视其宽度和高度的变化，并相应地更新可视化内部的任何内容。\n\n```\nvar w = 0;\nvar\
    \ h = 0;\nscope.$watch(function(){\n  w = el.clientWidth;\n  h = el.clientHeight;\n\
    \  return w * h;\n}, resize);\n```\n\n但为了使这按预期工作，我们需要在窗口大小调整时让作用域检查变化。\n\n```\n\
    angular.element($window).on('resize', function(){ $scope.$apply() });\n```\n\n\
    这段代码的一个好放置位置是在某个主控制器内部，因为它只需要调用一次。所有以这种方式实现响应式的指令，一旦在我们的应用中添加这一行代码，就会被检查变化。\n\n\
    最后一步是确保指令元素可以缩小。除非我们设置 `overflow:hidden`，否则容器元素永远不会小于其内容，这意味着“忽略此元素内部超出元素本身的任何内容”。\n\
    \n```\nscatter{\n  display: block;\n  overflow: hidden;\n}\n```\n\n现在，要设置指令的实际大小，我们可以使用\
    \ CSS 百分比，让可视化的大小像任何其他内置 HTML 元素一样动态更新。\n\n```\n.scatter-1{\n  width: 50%;\n \
    \ height: 400px;\n}\n```\n\n或者让它占据整个页面：\n\n```\n.scatter-1{\n  width: 100%;\n\
    \  height: 100%;\n}\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_112_0.png)\n\
    \n实时版本：[http://bl.ocks.org/vicapow/9716306](http://bl.ocks.org/vicapow/9716306)\n\
    \n## 服务\n\n### 用于存储数据的服务\n\n除了让指令不对数据来源持有偏见外，对控制器做同样的事情也是一个好主意。这使我们能够轻松地从不同的控制器中交换不同类型的数据，作为控制器和数据之间的代理。下面是一个具体示例，说明这种能力何时会很有用。假设我们有两个控制器都需要访问同一块远程数据。我们可以使用\
    \ Angular 服务为每个控制器提供数据，而不是让每个控制器独立请求远程数据（发出两个单独的请求）。这样，服务可以自动在内部存储数据以供后续请求，或者在将数据返回给每个控制器之前提供任何必要的数据格式化。\n\
    \n### 用于减少代码重复的服务\n\n服务也是存储多个控制器可能都需要的通用实用函数的好地方。这减少了跨控制器的代码重复量。但服务不仅限于在控制器内部使用。指令也可以使用服务。每当我们注意到指令或控制器之间存在重复或相似的代码时，共享这些代码的最佳位置就是在服务中。\n\
    \n### 内置指令\n\n为简单起见，到目前为止，我们一直避免以元素名称以外的方式创建自己的指令。也就是说，如果我们想要一个地图组件，我们就创建一个元素风格的指令，并在\
    \ HTML 中以 `<my-map>` 的形式使用它。但实际上指令要灵活得多，其用途不仅限于此。实际上，指令只是运行在 DOM 元素上的代码块。我们一直用它们来封装复杂的\
    \ DOM 操作（我们的可视化），同时暴露一个简单的接口（在 HTML 中只是以 `<my-map>` 的形式使用），但指令也可以使用属性语法创建，例如 `<div\
    \ my-map></div>`。这可以通过在我们的指令定义中使用 `restrict: 'A'` 而不是 `restrict: 'E'` 来实现。大多数向\
    \ Angular 新手介绍的功能只是库附带的最有用的指令。\n\n使用指令作为属性的一个令人兴奋之处在于，我们不再局限于在一个元素上只能有一个指令。给定元素上的所有指令都可以访问相同的作用域属性。以\
    \ `ng-show` 指令为例，它根据其表达式的计算结果为 true 或 false 来隐藏或显示所附加的元素。这使得实现类似“加载中”对话框变得容易。有了它，我们可以创建一个作为加载对话框的指令组件，并使用\
    \ `ng-show` 指令在地图（或任何其他组件）完成数据加载后隐藏该指令。\n\n```\n<loading-overlay ng-show=\"mapIsLoading\"\
    >\n</loading-overlay>\n<my-map loading=\"mapIsLoading\"></my-map>\n```\n\n实时版本：[http://bl.ocks.org/vicapow/9819505](http://bl.ocks.org/vicapow/9819505)\n\
    \n## 使用 `replace`、`template` 和 `transclude` 来修改可视化的行为\n\n定义指令时，我们可以选择告诉 Angular\
    \ 编译器，它应该用提供的模板替换带有指令的元素。如果我们想用实际的 SVG 元素替换自定义指令元素，而不是让自定义指令元素“包装”我们的可视化（这是我们到目前为止的指令一直在做的），这会很有用。让我们通过一个创建\
    \ [sparkline](http://bl.ocks.org/vicapow/9819505) 指令的例子来说明这一点。Sparkline 是可以嵌入文本文档中字词之间的迷你小图表。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_108_0.png)\n\n实时版本：[http://bl.ocks.org/vicapow/9592134](http://bl.ocks.org/vicapow/9592134)\n"
