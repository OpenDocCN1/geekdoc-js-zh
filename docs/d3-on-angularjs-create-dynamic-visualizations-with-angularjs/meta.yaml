    \n这里有一个使用 `d3.layout.pie` 的圆环图（donut chart）示例，它负责将我们的数据转换为可以直接传递给饼图生成器的格式。假设我们有以下想要用饼图表示的数据。\n\
    \n```javascript\nvar data = [21, 32, 35, 64, 83];\n```\n\n我们可以通过在饼图布局上调用 `pie()`\
    \ 方法，将其转换为传递给弧线生成器所需的起始和结束角度数组。\n\n```javascript\nvar pie = d3.layout.pie();\n\
