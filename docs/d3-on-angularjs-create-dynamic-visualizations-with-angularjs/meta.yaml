    4     <script>...</script>\n5     <h1>Hello World!</h1>\n6   </body>\n7 </html>\n\
    ```\n\n我们可以使用极好的 Chrome 开发者工具中的 Elements 标签页来检查生成 HTML 的源代码。在整本书中，我们将使用这些工具来深入检查运行中的代码。\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_9_1.png)\n\n## 常见陷阱\n\n![](img/82f49fe8a368850935eb7606dfa7579d_9_2.png)\n\
    \n在不使用 Angular 或 jQuery 时，请确保将任何依赖于 `<body>` 的代码放在 `<body>` 内部，而 *不是* 放在它之前（例如在\
    \ `<head>` 中）。如果代码在 body 元素之前执行，它将直接失败，因为 `<body>` 尚未创建。\n\n## 选择与数据绑定\n\n本章涵盖了\
    \ D3 的“选择（selections）”以及如何将它们与数据结合，以富有表现力地创建和操作 HTML 文档。我们将在所有的 D3 代码中使用选择器，因此本章的内容是使用\
    \ D3 的基础。\n\n> 强烈建议熟悉 **jQuery** 的读者 *不要* 跳过本章。尽管 D3 的选择器与之相似，但在几个关键领域有所不同。\n\n\
    ## 选择\n\n选择器是代表 DOM 元素集合（或集）的对象。这允许我们修改选择器上的属性，并使这些更改应用于其中的所有 DOM 元素。这是一个极其强大的想法！现在，程序应该\
    \ *如何* 更改所有元素不再是我们的任务。相反，我们只需要指定哪些元素应该更改以及相关的更改内容。假设我们想更改一组 `<div>` 标签的背景。与其拥有一个\
    \ DOM 元素数组并直接修改每一个：\n\n```\n1 // `divs` 只是一个 DOM 元素数组\n2 for(var i = 0; i < divs.length;\
    \ i++){\n3     divs[i].style.backgroundColor = 'blue';\n4 }\n```\n\n实时版本 [http://jsbin.com/UdiDiQu/2/edit](http://jsbin.com/UdiDiQu/2/edit)\n\
    \n我们可以使用选择器对每个 `<div>` 元素应用修改。\n\n```\n1 // `divs` 是一个选择器对象\n2 divs.style('background-color',\
    \ 'blue');\n```\n\n实时版本： [http://jsbin.com/ADeReRo/1/edit](http://jsbin.com/ADeReRo/1/edit)\n\
    \n最后两个示例代码片段执行的任务完全相同。后一个示例还引入了我们的第一个选择器方法 `style`，它将选择中所有 div 的背景颜色更改为蓝色。我们将在下面详细讨论这个方法。现在，只需理解选择器为我们提供了一套讨论\
    \ DOM 元素组的词汇，并且它们的方法适用于选择器包含的每个 DOM 元素。\n\n那么我们如何创建新的选择器呢？幸运的是，D3 中的选择器遵循与 CSS\
    \ 相同的约定。（如果你曾经使用过 jQuery，这应该会让你感到非常熟悉。）就像 CSS 规则应用于一组 DOM 元素一样，我们可以使用相同的规则收集 DOM\
    \ 元素并放入我们的选择器中。这里有一个 CSS 片段示例，它适用于所有具有类名 'foo' 的 `<div>` 标签：\n\n```\ndiv.foo{\n\
    \  /* 应用于所有类名为 \"foo\" 的 <div > 的 CSS */\n}\n```\n\n在使用选择器时，我们指定想要选择哪些元素的方式完全相同。我们仍然可以通过将\
    \ `div.foo` 传递给 `d3.selectAll` 来使用它。结果是一个新的选择器对象。\n\n```\nvar fooDivs = d3.selectAll('div.foo');\n\
    ```\n\n选择器对象 `fooDivs` 现在包含了页面上所有类名为 `foo` 的 div。将 `d3.selectAll` 想象成在整个 DOM 中搜索所有匹配选择器\
    \ \"div.foo\" 的元素会很有帮助。为了复习，这里有几个 CSS 规则及其相关含义。\n\n| CSS 规则 | 含义 |\n|----------|---------|\n\
    | .foo | 选择每个具有类名 foo 的 DOM 元素 |\n| #foo | 选择每个具有 ID 为 foo 的 DOM 元素 |\n| div.foo\
    \ | 选择所有具有类名 foo 的 `<div>` 标签 |\n| div#foo | 选择所有具有 ID 为 foo 的 `<div>` 标签 |\n\
    | div .foo | 选择 `<div>` 标签内部每个具有类名 foo 的 DOM 元素 |\n| div #foo | 选择 `<div>` 标签内部每个具有\
    \ ID 为 foo 的 DOM 元素 |\n| div p .foo | 选择 `<div>` 标签内部 `<p>` 标签内部每个具有类名 foo 的 DOM\
    \ 元素 |\n\n与在样式表中指定的 CSS 不同，选择器对象仅包含在选择器首次创建时匹配选择规则的元素。在上面的示例中，如果 DOM 中添加了具有类名\
