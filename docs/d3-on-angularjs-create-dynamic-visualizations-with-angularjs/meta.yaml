- md: "It might not look different but we're well on our way to making it reusable.\
    \ As a simple demo, we can easily create several donut charts just by copying\
    \ and pasting the `<donut-chart>` tag.\n\n```\n1 <donut-chart></donut-chart>\n\
    2 <donut-chart></donut-chart>\n3 <donut-chart></donut-chart>\n```\n\nLive version:\
    \ [http://jsbin.com/yili/1/edit](http://jsbin.com/yili/1/edit)\n\n![](img/82f49fe8a368850935eb7606dfa7579d_93_0.png)\n\
    \n## Isolate scope\n\nOur donut chart could really stand to be improved in a few\
    \ ways. Specifically, it would be nice if our donut charts didn't all show the\
    \ same content. We'd prefer to be able to pass each its own data to display instead\
    \ of hard coding the same data right in the link function of the directive. To\
    \ do this, we can use what's called an isolate scope. An isolate scope will allow\
    \ us to pass our data into the directive using an attribute. (In our case, we'll\
    \ just call it `data` but we could have called it whatever we like.)\n\n```\n\
    1 <donut-chart data=\"[8, 3, 7]\"></donut-chart>\n2 <donut-chart data=\"[2, 5,\
    \ 9]\"></donut-chart>\n3 <donut-chart data=\"[6, 2, 3]\"></donut-chart>\n```\n\
    \nTo tell Angular our directive should have an isolate scope, we just add a `scope`\
    \ property to the object returned from our directive declaration.\n\n```\n1 return\
    \ {\n2     link: link,\n3     restrict: 'E',\n4     scope: { data: '=' }\n5 }\n\
    ```\n\nInside of our `link` method, we'll just reference `scope.data` and it will\
    \ contain the data we passed to it in the `data` attribute in our template above.\n\
    \n```\n1 function link(scope, element, attr){\n2   // our data for the current\
    \ directive instance!\n3   var data = scope.data;\n4   // ...\n5 }\n```\n\nLive\
    \ version: [http://jsbin.com/yili/6/edit](http://jsbin.com/yili/6/edit)\n\n![](img/82f49fe8a368850935eb7606dfa7579d_93_1.png)\n\
    \nIf you still wanted to have the same data shared between all the pie charts,\
    \ we could now simply define a variable on the scope and pass it to all the individual\
    \ donut charts.\n\n```\n1 <body ng-app=\"myApp\" ng-init=\"ourSharedData=[8, 2,\
    \ 9]\">\n2   <donut-chart data=\"ourSharedData\"></donut-chart>\n3   <donut-chart\
    \ data=\"ourSharedData\"></donut-chart>\n4   <donut-chart data=\"ourSharedData\"\
    ></donut-chart>\n```\n\nLive version: [http://jsbin.com/yili/7/edit](http://jsbin.com/yili/7/edit)\n\
    \nGiving our donut chart an isolate scope also gives us the ability to use Angular’s\
    \ built-in `ng-repeat` directive to create an arbitrary number of donut charts\
    \ given an array of chart data arrays.\n\n```\n1 <body ng-app=\"myApp\" ng-init=\"\
    charts=[[8, 3, 7],[2, 5, 9],[6, 2, 3]]\">\n2   <donut-chart data=\"chart\" ng-repeat=\"\
    chart in charts\"></donut-chart>\n```\n\nLive version: [http://jsbin.com/yili/8/edit](http://jsbin.com/yili/8/edit)\n\
    \n## Dynamic visualizations\n\nAs we saw in the last chapter, directives are a\
    \ great tool for making our visualizations self contained and reusable across\
    \ different parts of our project or different projects entirely. Another great\
    \ advantage to using Angular and its directives for data visualization is Angular’s\
    \ support for automatic two way data binding. That sounds like a mouthful but\
    \ it’s actually a simple idea. It just means that Angular takes care of updating\
    \ the DOM whenever data changes. Similarly, it automatically updates our data\
    \ when the DOM changes. All we need to specify is the relationship between our\
    \ data and DOM elements. The big advantage to all of this is that we’ll get to\
    \ write a lot less code. The disadvantage is that we’ll have to spend the effort\
    \ to wrap our heads around this new way of thinking about data binding as well\
    \ as develop a strong understanding of what all Angular is doing automatically\
    \ for us.\n\nFor the first half of this chapter we’ll be working from simple toy\
    \ examples that illustrate the fundamentals. In the second part, we’ll walk through\
    \ using these new concepts to make dynamic data visualizations.\n\n### Two way\
    \ data binding\n\nTo illustrate and motivate the advantages of two way data binding,\
    \ we’ll start off with a very simple example. Here, several range `<input>` sliders\
    \ are all bound to the same data model. When we drag one, all the others are updated\
    \ automatically. This saves us the trouble of having to manually set up event\
    \ listeners on all of the sliders as well as taking care of updating their values.\
    \ It might help to think of Angular as having written all that code for us.\n\n\
    ```\n1 <body ng-app>\n2   <input type=\"range\" ng-model=\"ourRangeValue\">\n\
    3   <input type=\"range\" ng-model=\"ourRangeValue\">\n4   <input type=\"range\"\
    \ ng-model=\"ourRangeValue\">\n5   <input type=\"range\" ng-model=\"ourRangeValue\"\
    >\n6 </body>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_95_0.png)\n\nLive\
    \ version: [http://jsbin.com/tobuq/1/edit](http://jsbin.com/tobuq/1/edit)\n\n\
    ### The scope\n\nAll of this automatic updating happens for variables on what’s\
    \ called the “scope”. In the example above, the `ng-model` directive creates a\
    \ variable on the scope called `ourRangeValue` and handles updating the value\
    \ of the `<input>` range slider anytime `ourRangeValue` changes. The scope works\
    \ a lot like the DOM tree. If we create a new scope on a DOM element, all of the\
    \ child elements will have access to the variables on that new scope. When we\
    \ told Angular the root of our app was the `<body>` tag it also created a default\
    \ scope on the `<body>` tag that any inner elements can access. This is the scope\
    \ the `ourRangeValue` is created on. This top level scope is called the “root\
    \ scope”.\n\nThere’s a few ways new scopes get created but we can’t simply just\
    \ create a new scope on its own. The simplest way to create a new scope is to\
    \ first create a “controller”. Controllers are normally used to modify scope variables\
    \ programmatically in JavaScript. Whenever we create and use a new controller,\
    \ a new scope is also created for it. Working from our previous example, let's\
    \ see what it looks like to create and use a controller to create new scopes.\n\
    \nWe first need to create a module to put our controller on.\n\n```\nvar app =\
    \ angular.module('myApp', []);\n```\n\nNext, we’ll create a controller called\
    \ ‘HelloController’ that just creates a variable on its new scope called `ourRangeValue`.\n\
    \n```\napp.controller('HelloController', function($scope){\n    $scope.ourRangeValue\
    \ = 50;\n});\n```\n\nTo use it, we need to remember to use our module in the `<body>`\
    \ tag's `ng-app`.\n\n```\n<body ng-app=\"myApp\">\n```\n\nNext, we’ll use our\
    \ new controller twice using `ng-controller=\"HelloController\"` on a `<div>`\
    \ tag. Now the scopes inside the `<div>` will inherit from the new controllers\
    \ created for each `HelloController`.\n\n```\n<body ng-app=\"myApp\">\n  <div\
    \ ng-controller=\"HelloController\">\n    <input type=\"range\" ng-model=\"ourRangeValue\"\
    >\n    <input type=\"range\" ng-model=\"ourRangeValue\">\n  </div>\n  <div ng-controller=\"\
    HelloController\">\n    <input type=\"range\" ng-model=\"ourRangeValue\">\n  \
    \  <input type=\"range\" ng-model=\"ourRangeValue\">\n  </div>\n</body>\n```\n\
    \nLive version: http://jsbin.com/hite/1/edit\n\nTwo scopes were created inside\
    \ our app's root scope. One for the first `HelloController` and another one for\
    \ the second. `ourRangeValue` will be a different property on each of these two\
    \ inner scopes. This has the effect of binding the first two range sliders to\
    \ the value of `ourRangeValue` on the first scope and the second two range sliders\
    \ to the value of `ourRangeValue` on the second scope.\n\nInner scopes inherit\
    \ from their outer scopes. This means that if the `ourRangeValue` wasn’t found\
    \ on the `HelloController` scope, its outer scope would have been checked for\
    \ a property named `ourRangeValue` and so on until the root scope was checked.\n\
    \n### Scope inheritance\n\n`ng-init` is used to initialize properties on the scope\
    \ of the current element. In the following example, a property called `foobar`\
    \ on the root scope is given the value 50. (The `HelloController` is unchanged\
    \ from the previous examples.) We might expect that all of the range sliders would\
    \ now be bound to the same `foobar` element in the outer scope but they are not.\
    \ Instead, a new `foobar` property is created on each of the inner `HelloController`\
    \ scopes.\n\n```\n1  <body ng-app=\"myApp\" ng-init=\"foobar=50\">\n2    <div\
    \ ng-controller=\"HelloController\">\n3      <input type=\"range\" ng-model=\"\
    foobar\">\n4      <input type=\"range\" ng-model=\"foobar\">\n5    </div>\n6 \
    \   <div ng-controller=\"HelloController\">\n7      <input type=\"range\" ng-model=\"\
    foobar\">\n8      <input type=\"range\" ng-model=\"foobar\">\n9    </div>\n10\
    \  </body>\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_97_0.png)\n\nThis\
    \ can be somewhat unexpected behavior but makes sense when considering that scope\
    \ inheritance works the same as regular JavaScript inheritance. The following\
    \ snippet illustrates what’s happening inside of Angular.\n\n```\n1  var rootScope\
    \ = { foobar: 50 };\n2  var scope1 = Object.create(rootScope);  // scope1 inherits\
    \ from rootScope\n3  var scope2 = Object.create(rootScope);  // scope2 inherits\
    \ from rootScope\n4  // scope1.foobar is 50\n5  // scope2.foobar is 50\n6  rootScope.foobar\
    \ = 100;  // changing `rootScope.foobar` works as expected\n7  // scope1.foobar\
    \ is 100\n8  // scope2.foobar is 100\n9  scope1.foobar = 2;  // but assigning\
    \ a value to `foobar` creates a new\n10  // property on the child scope which\
    \ shadows `rootScope.foobar`.\n11  // rootScope.foobar is 100 instead of 2\n```\n\
    \n> If this is still somewhat confusing, a longer form review of JavaScript prototype\
    \ chaining and inheritance may be helpful. We recommend this blog post by Sebastian\
    \ Porto.\n\nOne way to fix this is to use another object as a wrapper to prevent\
    \ shadowing properties of the parent scope. In this way, we’re never assigning\
    \ a new value to the `foobar` property.\n\n```\n1  var rootScope = { foobar: {\
    \ value: 50 } };\n2  var scope1 = Object.create(rootScope);  // scope1 inherits\
    \ from rootScope\n3  var scope2 = Object.create(rootScope);  // scope2 inherits\
    \ from rootScope\n4  // scope1.foobar.value is 50\n5  // scope2.foobar.value is\
    \ 50\n6  rootScope.foobar.value = 100;\n7  // scope1.foobar.value is 100\n8  //\
    \ scope2.foobar.value is 100\n9  scope1.foobar.value = 2;\n10  // rootScope.foobar.value\
    \ is 2\n```"
  mdcn: "\n它看起来可能没什么变化，但我们正朝着使其可复用的方向稳步前进。作为一个简单的演示，我们只需复制并粘贴`<donut-chart>`标签，就能轻松创建多个环形图。\n\
