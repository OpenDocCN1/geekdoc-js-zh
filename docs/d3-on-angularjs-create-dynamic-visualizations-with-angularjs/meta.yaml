  - "[PAGE 87]\n\n# # Hello Angular!\n\nTo get familiar with how to install and setup\
    \ an Angular app, let's walk through creating a 'Hello World' style application.\
    \ This app will update a template whenever the value of an input tag changes.\n\
    \n# ## Installing Angular\n\nThe easiest way to install Angular is to include\
    \ the latest version from Google's CDN by copy and pasting the below snippet into\
    \ a new HTML file. (At the time of writing, the newest version is 1.2.10).\n\n\
    ```\n<!DOCTYPE html>\n<html>\n  <head>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.10/angular.min.js\"\
    ></script>\n  </head>\n  <body></body>\n</html>\n```\n\nNext, we'll need to tell\
    \ angular where our app begins using `ng-app`. Most of the time, this will just\
    \ be the entire `<body>` tag.\n\n```\n<body ng-app>\n  <!-- yo angular, everything\
    \ in here is our app -->\n</body>\n```\n\nNow we'll add an input tag that created\
    \ a variable person on the scope. The snippet `ng-model=\"person\"` is responsible\
    \ doing this. It also handles checking for changes to the `<input>` tag and updating\
    \ the scope, or vice versa. In MVC speak, this \"wires up\" the \"model\" person\
    \ variable on scope to the `<input>` tag (our \"view\"). Don't worry too much\
    \ *how* the scope works. Just know that it contains the information of our application.\
    \ In this case, the \"person\" we'd like to say hello to. Angular will take care\
    \ of wiring everything up for us automatically using two way data binding.\n\n\
    ```\n<body ng-app>\n  <input type=\"text\" ng-model=\"person\"></input>\n</body>\n\
    ```\n\nThe person variable now updates whenever the value of the `<input>` tag\
    \ changes but there's no way to prove it since we're not using that variable anywhere\
    \ else. Let's fix that by using a simple Angular template.\n\n```\n<body ng-app>\n\
    \  <input type=\"text\" ng-model=\"person\"></input>\n  hello {{person}}!\n</body>\n\
    ```\n\nLive version: [http://jsbin.com/izimoQoL/1/edit](http://jsbin.com/izimoQoL/1/edit)\n\
    \nGreat! Now when we update the `<input>` text field, the change is automatically\
    \ sent to the scope which then causes the template to get rendered. Here's the\
    \ full version."
