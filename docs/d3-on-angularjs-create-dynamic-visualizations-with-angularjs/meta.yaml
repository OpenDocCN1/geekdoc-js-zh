    # # Scales


    As we build our datasets and start to try to apply them to our visual canvas,
    we’ll need to set up scales so that our data can sit nicely on our page.


    It’s very unlikely that any of the data that we’ll work with will ever translate
    to our pixel coordinates in our visualizations. We’ll want to scale our data so
    that our data reflects the relationships we have to our pixel data.


    For this purpose, D3 includes a convenient helper object that we’ll use to create
    a scaled relationship between our data and the relative pixel coordinates to represent
    that data.


    When we talk about scales, we’re talking about relative data points that we can
    use to map to data'
