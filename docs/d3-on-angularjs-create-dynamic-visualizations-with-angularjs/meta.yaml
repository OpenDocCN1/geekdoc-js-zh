  md: "# SVG and D3\n\nSVG can be somewhat tedious to use on it’s own but after the\
    \ previous introduction, we’ll rarely, if ever, need to write any SVG directly.\n\
    \nInstead, we’ll use D3 to create these elements and apply style for us.\n\nWe’ll\
    \ still need to know how SVG works to do master D3, but we will let the library\
    \ take care of the heavy lifting.\n\nNow that we’ve covered some of the basics\
    \ of SVG, we can begin to talk more about using it in combination with D3.\n\n\
    # From nothing to SVG\n\nWhen we first start up the page, we’ll need a place to\
    \ place our SVG elements. As stated above, we can only place our elements inside\
    \ of an `<svg>` tag. Sometimes it’s more convenient (especially when we integrate\
    \ with using directives) to not place this directly on the page.\n\nWe can use\
    \ d3 to make our svg, like so:\n\n```\nvar svg = d3.select(\"body\")\n       \
    \ .append(\"svg\");\n```\n\nWith the svg variable, we can now reference the `<svg>`\
    \ element and interact with our D3 stage at any time. It’s possible to use the\
    \ same methods on the `<svg>` element that we’ll use on the D3 elements to set\
    \ attributes on it.\n\nFor instance, let’s set a height and a width:\n\n```\n\
    d3.select('body').append('svg')\n  .attr('width', 300)\n  .attr('height', 200);\n\
    ```\n\n# Generators\n\nOne of the nicest parts of D3, is it’s focus on making\
    \ SVG element creation manageable through D3’s generators.\n\nGenerators play\
    \ the part of both objects and functions. Generators are functions, like any other\
    \ function that has additional methods to allow us to change it’s behavior. Just\
    \ like any other D3 class, most generator methods return themselves so we can\
    \ chain methods on top of them.\n\nOnce we’ve configured our generators for our\
    \ needs, we’ll use them to *generate* the necessary SVG commands to create our\
    \ shape.\n\nLet’s look at a very simple example, the line generator:\n\nThe `line`\
    \ generator takes any data that we pass it and generators the necessary SVG `<path>`\
    \ d attribute commands. In order to use the path generator, we need to tell it\
    \ a little about the format of our data. We do this by defining `accessor` functions\
    \ for the x and y coordinates of the line across our data. This"
  merge: -1
