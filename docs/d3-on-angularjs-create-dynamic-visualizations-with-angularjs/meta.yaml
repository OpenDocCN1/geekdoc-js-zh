  - '[PAGE 102]


    However, when you run this code, you''ll notice a problem. Angular throws an error:


    > Error: [ngRepeat:dupes] Duplicates in a repeater are not allowed. Use ''track
    by'' expression to specify unique keys. Repeater: slice in chart, Duplicate key:
    number:20


    🐛 Live version: [http://jsbin.com/leco/1/edit](http://jsbin.com/leco/1/edit)


    What Angular is telling us is that every element in an `ng-repeat` needs to be
    unique. However, we can tell Angular to use the elements index within the array
    instead to determine uniqueness by adding `track by $index` after `slice in chart`.


    ```

    1 <input type="range"

    2   ng-model="slice" ng-repeat="slice in chart track by $index">

    ```


    Adding this stops any errors from being through and adding or removing slices
    seems to work but dragging a slider has no effect on the visualization. The `chart`
    array is not being modified by the slider values. This is another reincarnation
    of scope inheritance we mentioned earlier in this chapter. `ng-repeat` creates
    a new scope for each `<input>` tag. And when a range value gets updated, its updating
    its `slice` property which isn''t shared with its parent.


    🐛 Live version: [http://jsbin.com/wadev/1/edit](http://jsbin.com/wadev/1/edit)


    We can fix it the same way as before by using a wrapper object. Doing so, we can
    safely modify its properties without having to worry about shadowing properties
    from the parent scope.


    ```

    1 <body ng-app="myApp" ng-init="chart=[{value: 10}, {value: 20}, {value: 30}]">

    2   <donut-chart data="chart" style="float:right"></donut-chart>

    3   <button ng-click="chart.push({value: 10})">add slice</button>

    4   <button ng-click="chart.pop()">remove slice</button>

    5   <input type="range" ng-model="slice.value"

    6     ng-repeat="slice in chart track by $index">

    ```


    Our directive now has to be updated so that it can access the slice value of each
    object in the data array. Because the pie layout is the only thing that uses `data`
    directly, we can give `pie` a value accessor and it will take care of plucking
    the pie chart value out of each object in the data array.


    ```

    1 pie.value(function(d){ return d.value; });

    ```'
- md: "## Getting data into and out of directives\n\nThe combination of Angular and\
    \ D3 makes it easy to create visualizations that update automatically whenever\
    \ their data changes, but how do we get our data into Angular in the first place?\n\
    \n### The D3 way\n\nAs we've seen, D3 comes with a set of useful utilities for\
    \ loading data from remote sources. The most common being the `d3.json()` or `d3.csv()`\
    \ functions. If used properly, we can continue to use these same functions but\
    \ Angular also offers its own alternatives for loading in data.\n\nLet's start\
    \ off with a simple example of a donut chart directive that loads data in from\
    \ a remote file source.\n\n```\nd3.json('donut-data.json', function(err, data){\n\
    \  if(err){ throw err; }\n  arcs = arcs.data(pie(data));\n  arcs.exit().remove();\n\
    \  arcs.enter().append('path')\n    .style('stroke', 'white')\n    .attr('fill',\
    \ function(d, i){ return color(i) });\n  // update all the arcs (not just the\
    \ ones that might have been added)\n  arcs.attr('d', arc);\n});\n```\n\n\U0001F41B\
    \ Live version: [http://bl.ocks.org/vicapow/9535255](http://bl.ocks.org/vicapow/9535255)\n\
    \nThis gets the job done for a single instance of our donut chart, but if we wanted\
    \ to use our donut chart with different data? We would either need to edit our\
    \ existing donut chart directive by changing the url it was fetching data from\
    \ or create a new directive, almost exactly like the original that loaded data\
    \ in from the scope instead of putting `d3.json()` in our directive. A better\
    \ alternative would be for our directive to care nothing about where it gets its\
    \ data. That is, we would prefer our directive \"know\" nothing about where it\
    \ got its data and only care about *if* or *when* it gets data and *when* that\
    \ data changes.\n\nTo allow the above directive to conform to this new heuristic,\
    \ we should only have it watch for changes to the data on the scope, and then\
    \ we'll load our data onto the scope from somewhere else. For now, the \"someplace\
    \ else\" will be a controller. The controller is where the logic should go that\
    \ ties together our application.\n\nThe first step to doing this is defining our\
    \ controller. In our case, we'll call it `MainCtrl` because we only have one.\n\
    \n```\nvar myApp = myApp.controller('MainCtrl', function($scope){\n  // TODO:\
    \ controller logic here!\n});\n```\n\nThis creates a controller class that we\
    \ can then use to create a specific controller in our application using ng-controller.\n\
    \n```\n<body ng-app=\"myApp\" ng-controller=\"MainCtrl\">\n  <!-- MainCtrl's scope\
    \ -->\n</body>\n```\n\nNext, we'll just put our d3.json() code within the controller\
    \ definition.\n\n```\nvar myApp = myApp.controller('MainCtrl', function($scope){\n\
    \  d3.json('donut-data.json', function(err, data){\n    if(err){ throw err; }\n\
    \    $scope.data = data;\n    $scope.$apply();\n  });\n});\n```\n\nSo that when\
    \ the data is pulled in, we'll put it on the scope. Angular will then notice our\
    \ data scope property changed and let our `<donut-chart>` directive know about\
    \ the change. The scope is checked for changes when we call `$scope.$apply()`.\n\
    \nLastly, we need to wire up the directive to our MainCtrl's scope and change\
    \ back our directive to have a data scope property that watches for changes and\
    \ updates the visualization accordingly.\n\n```\n<donut-chart data=\"data\"></donut-chart>\n\
    \nscope.$watch('data', function(data){\n  // (update/add/remove the `<path>` elements\
    \ for each of the pie arcs)\n}, true);\n```\n\nAnd just like before, because we\
    \ want data to be a scope property configured as an attribute on our directive\
    \ in HTML, we'll need to set `scope:` to `{ data: '=' }` in the returned configuration\
    \ object in our directive.\n\nAnd now we can still use our `<donut-chart>` directive\
    \ with any type of data. In this example, we're both loading the donut chart data\
    \ using d3.json() for the first chart and hard coding our data on the MainCtrl's\
    \ scope for the second.\n\n### The Angular way\n\nIn addition to using d3.json(),\
    \ we can also use angular's $http service to pull in data.\n\n```\nmyApp.controller('MainCtrl',\
    \ function($scope, $http){\n  // using success/error callback style\n  $http.get('donut-data.json').success(function(data){\n\
    \    $scope.donutData1 = data;\n  }).error(function(err){\n    throw err;\n  });\n\
    });\n```\n\nWe can also use the alternative then() callback style:\n\n```\nmyApp.controller('MainCtrl',\
    \ function($scope, $http){\n  // using `then()` callback style\n  $http.get('donut-data-2.json').then(function(response){\n\
    \    $scope.donutData2 = response.data;\n  }, function(err){\n    throw err;\n\
    \  });\n});\n```\n\nLive version: http://bl.ocks.org/vicapow/9555539\n\nUsing\
    \ $http service instead of d3.json() allows us to avoid having to call $scope.$apply()\
    \ directly. Angular will do this for us automatically. In fact, Angular *almost*\
    \ always knows when to check the scope. The only times it doesn't are when performing\
    \ asynchronous events outside of Angular. This includes using any of D3's behaviors\
    \ (ie., drag, click, zoom, etc.) or using setTimeout (instead of Angular's $timeout\
    \ service.)\n\n> You may be curious as to how we're able to use the $http service\
    \ simply by adding it as another argument to the controller definition function.\
    \ This is made possible by a feature in Angular called \"dependency injection\"\
    . A detailed overview of DI and how it works is beyond the scope of this book.\
    \ Have a look at the Angular documentation [here for more details](http://docs.angularjs.org/guide/di).\
    \ In the mean, just know that Angular is smart enough to check what arguments\
    \ it should call your controllers initialization method with by looking at the\
    \ variable names of the arguments. If we switched the arguments to our controllers\
    \ initialize function from ($scope, $http) to ($http, $scope) our code would keep\
    \ working!\n\nUsing all we've learned so far, we can now create a simple \"real\
    \ time visualization dashboard\" just by using the $interval service to periodically\
    \ pull data from an API, taking its result and putting it on the scope. Our directive\
    \ will take care of the rest.\n\n```\nmyApp.controller('MainCtrl', function($scope,\
    \ $http, $interval){\n  $interval(function(){\n    $http.get('donut-data-api.json').then(function(response){\n\
    \      // your API would presumably send new data each time!\n      var data =\
    \ response.data.map(function(d){ return d * Math.random() });\n      $scope.donutData\
    \ = data;\n    }, function(err){\n      throw err;\n    });\n  }, 1000);\n});\n\
    ```\n\nLive version: http://bl.ocks.org/vicapow/9556184\n\n## Updating the scope\
    \ from within a directive\n\nSo far, the communication of our directives with\
    \ the outside world has been one sided. Our directives have always been responding\
    \ to data changes, never the other way around. There are times, however, when\
    \ we’d like to affect our data from within our directive.\n\nIt can often be a\
    \ very modular technique to update data on our directive's scope and then optionally\
    \ listen for changes to that variable in some other place in our application or\
    \ even in other directives. This makes our directives more reusable because they\
    \ no longer need to know anything about each other. We can drop a directive into\
    \ another part of our application or another application entirely without much\
    \ work in wiring it up since we’ll only have to use a $watch statement on the\
    \ scope variable we passed to the directive in its HTML definition to be notified\
    \ of change to the variable.\n\nAs a concrete example, imagine we created a scatter\
    \ plot directive and wanted to add the ability to see the details of an individual\
    \ point whenever the mouse is placed over the top of this point. There are a few\
    \ ways to achieve this, some more modular than others. One way is to create a\
    \ specific directive, something such as a “scatter-plot-detail” directive. Which\
    \ is fine until we need another type of scatter plot that does something slightly\
    \ different. Possibly displaying the details in a slightly different way than\
    \ the first. If we were to stick with our first strategy, we would now need a\
    \ completely new directive, almost identical to the first except in the way it\
    \ displayed its detail content.\n\nA better approach would be to have a single\
    \ directive that displays a scatter plot that is not responsible for displaying\
    \ any details about the selected point. All it has is a new scope variable named\
    \ selectedPoint. Then, when a point is moused over, it will set the selectedPoint\
    \ scope property to the data of the newly moused over point.\n\n```\n// our `<scatter-plot>`\
    \ directive's new isolate scope\nscope: { selectedPoint: '=', data: '=' }\n\n\
    point.append('circle').attr('r', 5)\n  .on('mouseover', function(d){\n      scope.$apply(function(){\n\
    \          scope.selectedPoint = d;\n      });\n  });\n```\n\nTo finish up, all\
    \ we need to do is configure our directive in the HTML and add our description\
    \ template using Angular’s `{{ }}` syntax.\n\n```\n<body ng-app=\"myApp\" ng-controller=\"\
    MainCtrl\">\n  <div class=\"scatter-container\">\n    <scatter data=\"employers\"\
    \ selected-point=\"selectedEmployer\"></scatter>\n  </div>\n  <div class=\"detail\"\
    >\n    <h2>{{selectedEmployer.name }}</h2>\n    <!-- and possibly some other details\
    \ about the employer -->\n  </div>\n</body>\n```"
  mdcn: "\n## 将数据导入和导出指令\n\nAngular 和 D3 的结合使得创建能够在数据更改时自动更新的可视化图表变得简单，但我们首先如何将数据导入\
    \ Angular 呢？\n\n### D3 方式\n\n正如我们所见，D3 提供了一套用于从远程源加载数据的实用工具。最常用的是 `d3.json()`\
    \ 或 `d3.csv()` 函数。如果使用得当，我们可以继续使用这些函数，但 Angular 同时也提供了加载数据的替代方案。\n\n让我们从一个简单的甜甜圈图（donut\
    \ chart）指令示例开始，该指令从远程文件源加载数据。\n\n```\nd3.json('donut-data.json', function(err,\
    \ data){\n  if(err){ throw err; }\n  arcs = arcs.data(pie(data));\n  arcs.exit().remove();\n\
    \  arcs.enter().append('path')\n    .style('stroke', 'white')\n    .attr('fill',\
    \ function(d, i){ return color(i) });\n  // update all the arcs (not just the\
    \ ones that might have been added)\n  arcs.attr('d', arc);\n});\n```\n\n\U0001F41B\
    \ 实时版本：[http://bl.ocks.org/vicapow/9535255](http://bl.ocks.org/vicapow/9535255)\n\
    \n对于单个甜甜圈图实例来说，这样可以完成任务，但如果我们想在甜甜圈图中使用不同的数据怎么办？我们要么需要通过更改获取数据的 URL 来编辑现有的甜甜圈图指令，要么需要创建一个与原指令几乎完全相同的新指令，使其从\
    \ scope 中加载数据，而不是在指令中放入 `d3.json()`。一个更好的替代方案是让指令完全不关心数据的来源。也就是说，我们希望指令对数据从哪里来“一无所知”，而只关心*是否*或*何时*获得数据，以及数据*何时*发生变化。\n\
    \n为了让上述指令符合这一新启发式方法，我们应该让它仅监听 scope 上数据的变化，然后我们将从其他地方把数据加载到 scope 上。目前，这个“其他地方”将是一个控制器（controller）。控制器是存放将应用程序串联在一起的逻辑的地方。\n\
    \n实现此的第一步是定义我们的控制器。在我们的案例中，我们将其命名为 `MainCtrl`，因为我们只有一个。\n\n```\nvar myApp = myApp.controller('MainCtrl',\
    \ function($scope){\n  // TODO: controller logic here!\n});\n```\n\n这创建了一个控制器类，然后我们可以使用\
    \ `ng-controller` 在应用程序中创建具体的控制器实例。\n\n```\n<body ng-app=\"myApp\" ng-controller=\"\
    MainCtrl\">\n  <!-- MainCtrl's scope -->\n</body>\n```\n\n接下来，我们将 `d3.json()`\
    \ 代码放入控制器定义中。\n\n```\nvar myApp = myApp.controller('MainCtrl', function($scope){\n\
    \  d3.json('donut-data.json', function(err, data){\n    if(err){ throw err; }\n\
    \    $scope.data = data;\n    $scope.$apply();\n  });\n});\n```\n\n这样，当数据被拉取进来时，我们会将其放入\
    \ scope。Angular 随后会注意到我们的数据 scope 属性发生了变化，并通知我们的 `<donut-chart>` 指令。当我们调用 `$scope.$apply()`\
    \ 时，系统会检查 scope 的变化。\n\n最后，我们需要将指令连接到 `MainCtrl` 的 scope，并将我们的指令改回具有一个监听变化并相应更新可视化的数据\
    \ scope 属性。\n\n```\n<donut-chart data=\"data\"></donut-chart>\n\nscope.$watch('data',\
    \ function(data){\n  // (update/add/remove the `<path>` elements for each of the\
    \ pie arcs)\n}, true);\n```\n\n就像之前一样，因为我们希望数据是 HTML 中配置为指令属性的 scope 属性，因此我们需要在指令返回的配置对象中将\
    \ `scope:` 设置为 `{ data: '=' }`。\n\n现在我们仍然可以使用 `<donut-chart>` 指令处理任何类型的数据。在这个示例中，我们对第一个图表使用\
    \ `d3.json()` 加载甜甜圈图数据，而对第二个图表在 `MainCtrl` 的 scope 中硬编码数据。\n\n### Angular 方式\n\
    \n除了使用 `d3.json()`，我们还可以使用 Angular 的 `$http` 服务来拉取数据。\n\n```\nmyApp.controller('MainCtrl',\
    \ function($scope, $http){\n  // using success/error callback style\n  $http.get('donut-data.json').success(function(data){\n\
    \    $scope.donutData1 = data;\n  }).error(function(err){\n    throw err;\n  });\n\
    });\n```\n\n我们也可以使用替代的 `then()` 回调风格：\n\n```\nmyApp.controller('MainCtrl', function($scope,\
    \ $http){\n  // using `then()` callback style\n  $http.get('donut-data-2.json').then(function(response){\n\
    \    $scope.donutData2 = response.data;\n  }, function(err){\n    throw err;\n\
    \  });\n});\n```\n\n实时版本：http://bl.ocks.org/vicapow/9555539\n\n使用 `$http` 服务而不是\
    \ `d3.json()` 可以让我们避免直接调用 `$scope.$apply()`。Angular 会自动为我们完成这项工作。事实上，Angular *几乎*\
    \ 总是知道何时检查 scope。唯一不检查的情况是在 Angular 之外执行异步事件时。这包括使用 D3 的任何行为（例如拖拽、点击、缩放等）或使用 `setTimeout`（而不是\
    \ Angular 的 `$timeout` 服务）。\n\n> 你可能很好奇，为什么我们只需将 `$http` 服务作为另一个参数添加到控制器定义函数中就能使用它。这是由\
    \ Angular 中一个名为“依赖注入（dependency injection）”的功能实现的。关于 DI 及其工作原理的详细概述超出了本书的范围。欲了解更多详情，请参阅\
    \ [此处的 Angular 文档](http://docs.angularjs.org/guide/di)。与此同时，你只需要知道 Angular 足够聪明，可以通过查看参数的变量名来检查应该用哪些参数来调用你的控制器初始化方法。如果我们把控制器初始化函数的参数从\
    \ `($scope, $http)` 切换到 `($http, $scope)`，我们的代码依然可以正常工作！\n\n利用目前学到的一切，我们现在可以使用\
    \ `$interval` 服务定期从 API 拉取数据，将其结果放入 scope，从而创建一个简单的“实时可视化仪表板”。我们的指令将处理其余的工作。\n\
    \n```\nmyApp.controller('MainCtrl', function($scope, $http, $interval){\n  $interval(function(){\n\
    \    $http.get('donut-data-api.json').then(function(response){\n      // your\
    \ API would presumably send new data each time!\n      var data = response.data.map(function(d){\
    \ return d * Math.random() });\n      $scope.donutData = data;\n    }, function(err){\n\
    \      throw err;\n    });\n  }, 1000);\n});\n```\n\n实时版本：http://bl.ocks.org/vicapow/9556184\n\
    \n## 从指令内部更新 scope\n\n到目前为止，我们的指令与外部世界的通信一直是单向的。我们的指令始终是在响应数据的变化，而从未反向操作。然而，有时我们希望从指令内部影响我们的数据。\n\
    \n一种非常模块化的技术是在指令的 scope 上更新数据，然后选择性地在应用程序的其他地方甚至其他指令中监听该变量的变化。这使得我们的指令更具可重用性，因为它们不再需要了解彼此。我们可以将指令放入应用程序的另一个部分或完全不同的应用程序中，而无需花费太多精力进行连接，因为我们只需要在\
    \ HTML 定义中传递给指令的 scope 变量上使用 `$watch` 语句，即可获得变量更改的通知。\n\n举一个具体例子，假设我们创建了一个散点图指令，并希望添加一项功能：当鼠标悬停在某个点上时，能够看到该点的详细信息。有几种方法可以实现这一点，其中一些比其他的更模块化。一种方法是创建一个特定的指令，例如“scatter-plot-detail”指令。这在我们需要另一种行为略有不同的散点图之前是可行的，比如以与第一个略有不同的方式显示详细信息。如果我们坚持第一种策略，我们现在需要一个全新的指令，除了显示详细内容的方式外，它与第一个几乎完全相同。\n\
    \n更好的方法是使用一个单一的指令来显示散点图，而该指令不负责显示选中点的任何详细信息。它只需要一个名为 `selectedPoint` 的新 scope\
    \ 变量。然后，当鼠标悬停在某个点上时，它将把 `selectedPoint` scope 属性设置为新悬停点的资料。\n\n```\n// our `<scatter-plot>`\
    \ directive's new isolate scope\nscope: { selectedPoint: '=', data: '=' }\n\n\
    point.append('circle').attr('r', 5)\n  .on('mouseover', function(d){\n      scope.$apply(function(){\n\
    \          scope.selectedPoint = d;\n      });\n  });\n```\n\n最后，我们只需要在 HTML 中配置我们的指令，并使用\
    \ Angular 的 `{{ }}` 语法添加描述模板。\n\n```\n<body ng-app=\"myApp\" ng-controller=\"\
    MainCtrl\">\n  <div class=\"scatter-container\">\n    <scatter data=\"employers\"\
    \ selected-point=\"selectedEmployer\"></scatter>\n  </div>\n  <div class=\"detail\"\
    >\n    <h2>{{selectedEmployer.name }}</h2>\n    <!-- and possibly some other details\
    \ about the employer -->\n  </div>\n</body>\n```\n"
