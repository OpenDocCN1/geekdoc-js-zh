  - "[PAGE 89]\n\n# # Directives for reusable visualizations\n\n# ## Understanding\
    \ directives\n\nDirectives give us a way to encapsulate and reuse our visualizations\
    \ by allowing us to essentially create our own HTML tags. In a way, you've already\
    \ been using directives. The HTML5 `<input>` tags like range and date are essentially\
    \ the browsers own directives. They're constructed from a combination of several\
    \ UI element but expose a simple API. We just don't get access to their code.\n\
    \n```\n<input type=\"range\" min=\"1\" max=\"1000\" value=\"0\" style=\"width:100%\"\
    >\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_0.png)\n\n```\n<input type=\"\
    date\" value=\"1989-01-23\">\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_89_1.png)\n\
    \n# ## Creating a directive\n\nNow that you understand what directives are, let's\
    \ walk through creating our first with an example. Most directives do something\
    \ useful but to keep it simple, we'll create a directive that just says \"hello\
    \ world!\".\n\nWe'll start off with this HTML:\n\n```\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <script src=\"angular.js\"></script>\n  </head>\n  <body ng-app>\n\
    \    <!-- our app! -->\n  </body>\n</html>\n```\n\nNext we need to make a new\
    \ app module to hold all of our directives. All of our directives will live on\
    \ this module. We only have one directive right now so it seems pointless to put\
    \ it into a module but when we have many, this will help us group related directives.\n\
    \n```\nvar myApp = angular.module('myApp', []);\n```"
