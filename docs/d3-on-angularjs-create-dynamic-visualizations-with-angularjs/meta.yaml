  md: 'isn''t limited to just that. Directives, in actuality, are just chunks of code
    that run on a DOM element. We''ve been using them to encapsulate complex DOM manipulations
    (our visualizations) while exposing a simple interface (their use in HTML as just
    `<my-map>`) but directives can also be created using the an attribute syntax such
    as `<div my-map></div>`. This is done be by using `restrict: ''A''` instead of
    `restrict: ''E''` in our directive definition. Most of the features introduced
    to newcomers of Angular are just the most useful directives that come bundled
    with the Library.


    One of the exciting things about using directives as attributes is that we''re
    no longer limited to having just one directive on an element. All the directives
    on a given element will have access to the same scope properties. Take the `ng-show`
    directive which either hides or shows the element its attached to depending on
    the evaluation of its expression as true or false. This makes it easy to implement
    something like a "loading" dialog. With it we can create a directive component
    that is the loading dial and use the `ng-show` directive to hide the directive
    once a map (or any other component) has finished loading its data.


    ```

    1  <loading-overlay ng-show="mapIsLoading">

    2  </loading-overlay>

    3  <my-map loading="mapIsLoading"></my-map>

    ```


