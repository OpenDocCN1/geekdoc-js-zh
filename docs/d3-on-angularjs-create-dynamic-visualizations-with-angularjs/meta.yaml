  md: "Responsive web development involves having the components of a site automatically\
    \ resize or hide to take up just enough of the screen space as is available. Browsing\
    \ a responsive site on a mobile phone with a smaller screen would show the site\
    \ in an adapted view optimized for the new screen dimensions. Similarly, for larger\
    \ screens, a responsive site will grow large enough, possibly showing more content,\
    \ to fully utilize the larger space. This is alternative to having two or three\
    \ separate versions of the same site for different screen sizes. With a responsive\
    \ website design, the site grows or shrinks dynamically in \"response\" to screen\
    \ size changes.\n\nA good technique for having directives update dynamically depending\
    \ our the size of the screen is to have the directive watch for changes to its\
    \ width and height and update any internal content within the visualization accordingly.\n\
    \n```\nvar w = 0;\nvar h = 0;\nscope.$watch(function(){\n  w = el.clientWidth;\n\
    \  h = el.clientHeight;\n  return w * h;\n}, resize);\n```\n\nBut for this to\
    \ work as expected, we'll need to have the scope check for changes every time\
    \ the window resizes.\n\n```\nangular.element($window).on('resize', function(){\
    \ $scope.$apply() });\n```\n\nA good place for this code is somewhere inside a\
    \ main controller because it only needs to be called once. All directives that\
    \ are made responsive in this way, will be checked for changes once this one line\
    \ is added somewhere within our application.\n\nThe last step is to make sure\
    \ the directive element can be shrunken down. The containing element will never\
    \ we smaller than its content unless we set `overflow:hidden` meaning, \"ignore\
    \ any content inside this element that goes beyond the element itself.\"\n\n```\n\
    scatter{\n  display: block;\n  overflow: hidden;\n}\n```\n\nNow, to set the actual\
    \ size of the directive, we can use CSS percentages to have the size of the visualization\
    \ update dynamically just like any other built in HTML element.\n\n```\n.scatter-1{\n\
    \  width: 50%;\n  height: 400px;\n}\n```\n\nOr to have it take up the entire page:\n\
    \n```\n.scatter-1{\n  width: 100%;\n  height: 100%;\n}\n```"
