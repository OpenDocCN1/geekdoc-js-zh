    \ tag |\n\nUnlike CSS specified in stylesheets, a selector object only contains\
    \ the elements that matched the selection rule when\nwhen the selection was first\
    \ created. In the example above, if new <div> tags were added to the DOM with\
    \ class foo they\nselector.\n\n# Selector methods\n\nThe methods on selectors\
