    \ `size()` 方法。\n\n### style\n\n请看以下示例，它使用 `style()` 选择器方法将页面上每个 `<div>` 的背景颜色更改为蓝色：\n\
    \n```\n// 将所有 div 的背景颜色改为蓝色\nd3.selectAll('div')\n  .style('background-color',\
