    relative to other points.


    # Why scales


    For instance, what if wanted to plot [the number of viewers](http://) for each
    episode of the third season of the AMC television show, *The Walking Dead* with
    a bar chart?


    Each bar chart would not stop until it was *way* outside of the visible screen
    space. We just don''t have 10 million pixels, one to represent each viewer!


    One solution would be to step through and apply a scaling factor to each data
    point so that the maximum point wouldn''t go past the top of are chart.


    ```

    1 <!DOCTYPE HTML>

    2 <html>

    3   <head>

    4     <script src="http://d3js.org/d3.v3.min.js"

    5       charset="utf-8"></script>

    6     <style> rect { stroke: red; stroke-width: 1; fill: black; } </style>

    7   </head>

    8   <body>

    9     <script>

    10      // viewers for each episode

    11      var data = [ 10870000, 9550000, 10510000,

    12                   9270000, 10370000, 9210000,

    13                   10430000, 10480000, 12260000,

    14                   11050000, 11010000, 11300000,

    15                   11460000, 10840000, 10990000,

    16                   12420000 ];

    17

    18      // scaling data

    19      var height = 200;

    20      // the episode with the most views

    21      var max = d3.max(data);

    22      // Our scale factor

    23      var scale = height / max;

    24      var scaled_data =

    25        data.map(function(d){

    26          return d * scale;

    27        });

    28

    29      var svg = d3.select(''body'')

    30                  .append(''svg'')

    31                  .selectAll(''rect'')

    32                  .data(scaled_data)

    33                  // add all the <rect> tags

    34        .enter().append(''rect'')

    35        .attr({

    36          width: 50,

    37          height: function(d){ return d },

    38          x: function(d, i){ return i * 50 },

    39          // y pixels count down

    40          y: function(d){ return height - d }

    41        });

    42    </script>

    43   </body>

    44 </html>

    ```'
