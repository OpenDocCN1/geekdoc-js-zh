    \ {x: 28, y: 5},\n  {x: 9, y: 5},\n  {x: 4, y: 2}\n]\nd3.min(obj, function(d)\
    \ { return d.x; })\n// => 1\nd3.max(obj, function(d) { return d.x; })\n// => 28\n\
    ```\n\n#### mean()\n\nmean() 函数返回给定数组的平均值。平均值是数组中所有值的算术平均数，或者是数组的 *中心* 值。\n\n\
    ```javascript\nvar arr = [1,28,9,4];\nd3.mean(arr);\n// => 10.5\nvar obj = [\n\
    \   {x: 1, y: 20},\n   {x: 28, y: 5},\n   {x: 9, y: 5},\n   {x: 4, y: 2}\n]\n\
    d3.mean(obj, function(d) { return d.x; })\n// => 10.5\n```\n\n#### median()\n\n\
    median() 函数使用 R-7 算法返回给定数组的中位数。中位数是数组的“中间”值。\n\n```javascript\nvar arr = [1,28,9,4];\n\
