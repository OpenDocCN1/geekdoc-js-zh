    \n## Quick testing\n\nA quick way to test out small snippets of D3 code is to\
    \ pull up the Chrome Developer Tools while visiting [d3js.org](http://d3js.org).\
    \ The global d3 object will be available there.\n\nAs it stands all our divs will\
    \ become blue, but what if we wanted to apply a different style to each div? The\
    \ `style()` method (along with most other selector methods) can be passed an accessor\
    \ function instead of a value. This accessor function will be called for each\
    \ element in the selector and *its* result will be used to set the ‘background-color’\
    \ (or whatever other style property we specify.)\n\nWorking from our previous\
    \ example, we can randomly change the color of every `<div>` to red or blue using\
    \ this technique. We’re just passing the `style` method a function instead of\
    \ a string.\n\n```\n1 // blue and red the divs!\n2 d3.selectAll('div')\n3   .style('background-color',\
    \ function(d, i) {\n4     if(Math.random() > 0.5) {\n5       return 'red';\n6\
    \     }else{\n7       return 'blue';\n8     }\n9   });\n```\n\nLive version: [http://jsbin.com/agibaYo/1/edit](http://jsbin.com/agibaYo/1/edit)\n\
    \nThe accessor we pass to style also gets called with two arguments, here named\
    \ `d` and `i`. `i` is the index of the current element in the selector. If we\
    \ wanted to instead color only the first div blue and the rest green we can use\
    \ the `i` property to check the index and apply the color accordingly.\n\n```\n\
    1 d3.selectAll('div')\n2   .style('background-color', function(d, i){\n3     //\
    \ make only the first div `blue`, the rest `green`\n4     if(i === 0){\n5    \
    \   return 'blue';\n6     }else{\n```\n\nThe first `d` argument stands for `datum`\
    \ we'll come back to this when we talk about data binding, but for the time being,\
    \ let's just ignore it.\n\nYou can make these two arguments whatever you like\
    \ but `d` and `i` are the common convention in the D3 community.\n\n## attr\n\n\
    Another selector method that operates almost identically to `style()` is `attr()`.\
    \ It follows the same calling conventions but is used to modify attributes of\
    \ the selected DOM elements (instead of only working on the style attribute like\
    \ the `style()` method).\n\nGiven a `<body>` with the following content:\n\n```\n\
    1 <body>\n2   <div>Hello</div>\n3   <div>World</div>\n4   <div>!</div>\n5 </body>\n\
    ```\n\nWe can set the width of all of the `<div>` elements to `100%` by using\
    \ the `attr()` method, like so:\n\n```\n1 d3.selectAll('div')\n2   .attr('width',\
    \ '100%');\n```\n\nApplying this to the previous HTML would result in the following\
    \ DOM:\n\n```\n1 <body>\n2   <div width=\"100%\">Hello</div>\n3   <div width=\"\
    100%\">World</div>\n4   <div width=\"100%\">!</div>\n5 </body>\n```\n\nLive version:\
    \ [http://jsbin.com/uNiTovuJ/1/edit?html,output](http://jsbin.com/uNiTovuJ/1/edit?html,output)\n\
    \nFor convenience, selector methods (like `style()` and `attr()`) can be passed\
    \ an object hash instead of individual key/value pairs.\n\nThis allows us to shrink\
    \ the following code into a single call:\n\n```\nvar divs = d3.selectAll('div');\n\
    ```\n\n```\ndivs.attr('width', '100%');\ndivs.attr('height', '100%');\ndivs.attr('background-color',\
    \ function(d, i) {\n    i % 2 === 0 ? 'red' : 'blue'\n});\n```\n\nThe above code\
    \ becomes just this:\n\n```\nd3.selectAll('div').style({\n  'width': '100%',\n\
    \  'height': '100%',\n  'background-color': function(d, i){\n     return i % 2\
    \ === 0 ? 'red' : 'blue';\n  }\n});\n```\n\nApplying this to the previous DOM\
    \ from above would result in the following:\n\n```\n<body>\n  <div style=\"width:\
    \ 100%; height: 100%; background-color: red;\">Hello</div>\n  <div style=\"width:\
    \ 100%; height: 100%; background-color: blue;\">World</div>\n  <div style=\"width:\
    \ 100%; height: 100%; background-color: red;\">!</div>\n</body>\n```\n\nLive version:\
    \ [http://jsbin.com/uNiTovuJ/2/edit](http://jsbin.com/uNiTovuJ/2/edit)\n\nMost\
    \ selector methods return a reference to the original selector. That is, in JavaScript\
    \ they return the self object. This allows us to easily chain selector method\
    \ calls:\n\n```\nd3.selectAll('divs')\n  .style(...).attr(...);\n```\n\n## Selectors\
    \ are not simply arrays\n\nAlthough it is convenient to think of selectors as\
    \ arrays, they are not and we cannot simply use the [] API to access individual\
    \ elements in the selector.\n\n## Data binding\n\nData binding and joining with\
    \ selections is probably one of the hardest concepts to wrap your brain around\
    \ in D3 so don't get discouraged if you have to read through this section a few\
    \ times to make sure you really get how they work. It will also provide the foundation\
    \ for almost everything that comes later.\n\nData binding might sound like a complicated\
    \ term, but it really only means updating what gets shown based on some piece\
    \ of information (or data.) As a simple example, image I was building a football\
    \ scoreboard application. The act of updating a teams score on the score board\
    \ when a player makes a point would be an example of data binding. Some part of\
    \ the user interface was updated based on some piece of data.\n\nWhen talking\
    \ about data binding within HTML, we usually mean changing the contents of some\
    \ visible property of a DOM element based on some variable. This could mean updating\
    \ the text within a DOM element or changing one of its style properties, like\
    \ its opacity. Since this task is so common in data visualization, D3 uses a new\
    \ way of performing data binding. Unlike with jQuery’s selections, D3 lets us\
    \ easily associate data with DOM elements which makes modifying those elements\
    \ a lot easier and, more importantly, take less code to write. The trade off is\
    \ that we have to *really* understand how selections operate under the hood to\
    \ get their benefit.\n\nUp until now, what we’ve described of D3 selections has\
    \ been a bit of a white lie. Selections are slightly more than just collections\
    \ of DOM elements. They are actually collections of data and DOM element pairs.\
    \ Here’s what a selector looks like in jQuery. It’s just a collection of DOM elements.\n\
    \n![](img/82f49fe8a368850935eb7606dfa7579d_15_0.png)\n\nHere’s what a D3 selector\
    \ looks like.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_15_1.png)\n\nThe dashed\
    \ blue lines represent empty data elements for each of the three `<div>` tags.\n\
    \nIf we were to then “bind” a new array of data to those data/element pairs, say\
    \ `[18, 4, 7]`, we would now have a selector that looks like the following.\n\n\
    ![](img/82f49fe8a368850935eb7606dfa7579d_15_2.png)\n\nAnd here’s the D3 code that\
    \ would produce this selector\n\n```\nvar selector = d3.selectAll('div').data([18,\
    \ 4, 7]);\n```\n\n18 is now associated with the first `<div>` tag, 4 with the\
    \ second, and 7 with the third.\n\nAs you’ve just seen, the selector `data()`\
    \ method takes an array of data and binds each data item in that array to each\
    \ DOM element in selector. To demonstrate this, let’s build a simple bar chart.\
    \ We’ll start off with this HTML.\n\n```\n<body>\n<style>\n.bar{\n  height: 10px;\n\
    \  background-color: blue;\n  border-bottom: 1px solid white;\n}\n</style>\n<div\
    \ class=\"bar\"></div>\n<div class=\"bar\"></div>\n<div class=\"bar\"></div>\n\
    </body>\n```\n\nAnd the JavaScript:\n\n```\n1 var data = [10, 30, 60];\n2 d3.selectAll('.bar').data(data)\n\
    3 .style('width', function(d){\n4 return d + '%';\n5 });\n```\n\n![](img/82f49fe8a368850935eb7606dfa7579d_16_0.png)\n\
    \nLive version: [http://jsbin.com/AllruJuW/1/edit](http://jsbin.com/AllruJuW/1/edit)\n\
    \nRemember that `style` and `attr` will apply style or attribute changes to each\
    \ DOM element in the selector. If they're passed a function, that function will\
    \ be run for each element. Now that we know selectors are *really* collections\
    \ of data/element pairs, it's more appropriate to say these accessor functions\
    \ are actually getting called for each data/element pair. The first argument to\
    \ this function (often labeled d) is the data item (or datum) for the current\
    \ data/element pair. The second, recalling from the previous section, is the current\
    \ index within the selector.\n\nBut what if we don't know ahead of time how many\
    \ bars we're going to have in our bar chart? This is where the `enter()` method\
    \ comes in.\n\n### .enter() method\n\nSo you may have noticed in the previous\
    \ example, `data()` seemed to be returning the original selector. Although it\
    \ is updating the data/element pairs in the original, it is also returning an\
    \ entirely new selector. The old selector and the new selector both happen to\
    \ have the same number of data/element pairs but they wont always. We could have\
    \ an empty selector and create a new one by binding a data array of length 3 to\
    \ it. Our data selector would now look like the following:\n\n![](img/82f49fe8a368850935eb7606dfa7579d_16_1.png)\n\
    \nBut our original selector would still be empty. Selections returned from calling\
    \ `data()` come with a method called `enter()` which also returns a new selector.\
    \ This new selector will contain all the data/element pairs that do not yet contain\
    \ elements. In our case, it will seem identical to the selector"
