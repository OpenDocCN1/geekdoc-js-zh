    \ The power scale, like the logarithmic scale is useful for translating data that\
    \ increases exponentially. These two scales output format are slightly different\
    \ in their computation of the output range.\n\nAll of these scales work very similar\
    \ to each other, with slight differences. Now that we know how they work, we can\
    \ examine the [D3 documentation](https://d3js.org) for more detailed explanation\
    \ of each of the functions.\n\n# ## Axes\n\nIn any visualization where we're trying\
    \ to convey meaning, having the viewer understand the scale of data in comparison\
    \ to other data is necessary. One easy way we can simply convey this type of data\
    \ is by using Axes in our visualizations.\n\nD3 provides fantastic helper functions\
    \ that help us construct the necessary annotations that combine to form an axis,\
    \ such as tick marks, labels and reference lines.\n\nAs long as we properly create\
    \ our scale and use it to build our axis, D3 can take care of constructing the\
    \ building function.\n\n# ## Creating an axis\n\nTo create an axis, we can use\
    \ the `d3.svg.axis()` method, like so:\n\n```\nvar axis = d3.svg.axis();\n```\n\
    \nThat's it. We'll discuss ways to customize this shortly.\n\nWe'll only need\
    \ to add the axis to our SVG element. It's possible to call our new `axis()` function\
    \ directly, ie., `axis(svg)`.\n\nAlthough this does technically work, it doesn't\
    \ allow us to chain our methods together, like the rest of D3.\n\nTo support chaining,\
    \ we'll instead use the form `svg.call(axis)` to create the axis on our svg:\n\
    \n```\n<!DOCTYPE html>\n<html>\n  <body>\n    <script\n      src=\"http://d3js.org/d3.v3.min.js\"\
