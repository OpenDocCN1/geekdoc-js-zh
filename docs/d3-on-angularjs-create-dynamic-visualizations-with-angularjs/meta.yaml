  md: 'We can generate permutations of our data based upon their position in an array.
    This is useful for laying out our data in a table, for instance.


    The d3.permute(array, indexes) takes two arguments:


    **array**


    The `array` is the original array that we’ll be pulling the data for our `indexes`.


    **indexes**


    The `indexes` are a list of integers that represent the location from within the
    array that we’re interested in.


    ```

    1 // => [''c'', ''b'', ''a'']

    2 d3.permute([''a'', ''b'', ''c''], [2, 1, 0])

    3 // => [''a'', ''a'', ''b'']

    4 d3.permute([''a'', ''b'', ''c''], [0, 0, 1])

    5 // => [''c'', ''b'', undefined]

    6 d3.permute([''a'', ''b'', ''c''], [2, 1, 4])

    ```


    # Accessing and manipulating simple arrays


    # array.forEach()


    [array.forEach()](array.forEach()) is actually not a feature of D3 but commonly
    underused by developers.


    The `array.forEach()` method is useful for iterating over an array of items without
    worrying about for-loops or needing to keep track of the current index.


    It accepts a two possible arguments:


    **callback**


    The `callback` parameter is a function that will be called for every single element
    in the array. This function will be called with the arguments:


    **element**


    The `element` is the element value of the array.


    **index**


    The `index` is the integer location inside of the array.


    **originalArray**


    The `originalArray` points to the original array being traversed.


    **thisArg**


    The `thisArg` is an optional argument that allows us to set the `this` value to
    be set inside the callback function.


    If we pass the `thisArg` in the `array.forEach()` method, then this will be the
    first argument the callback function will be called with. For instance: `function(thisArg,
    element, index, originalArray)`'
