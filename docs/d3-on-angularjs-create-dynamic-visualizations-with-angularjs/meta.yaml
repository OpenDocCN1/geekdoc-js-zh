    \n## Animation and interaction\n\nWe'll cover the basics of animation and other\
    \ interactive concepts in this chapter. These techniques lay the foundation for\
    \ things like live updating, real-time data visualizations.\n\n### Transitions\n\
    \nAt the heart of almost all animated data visualizations built with D3 are transitions.\
    \ Transitions make it effortless for us to apply a smooth, animated transition\
    \ over a collection of selected elements. It's easier to show how this works so\
    \ lets dive right in with a simple example. Reload the page if the animation wasn't\
    \ noticed the first time.\n\n```html\n1 <!DOCTYPE html>\n2 <html>\n3   <body>\n\
    4     <script src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n\
    5     <script>\n6 d3.select('body').append('svg')\n7   .append('circle').attr({r:\
    \ 10, cx: 100, cy: 100})\n8   .transition().attr('cx', 300);\n9     </script>\n\
    10  </body>\n11 </html>\n```\n\nWow, how cool is that? We took a `circle` and\
    \ animated with the addition of only a single line of code! Let's break down what's\
    \ happening here. Selectors have an additional method called `transition()` which\
    \ will return *another selection*, specifically, a special \"[transition](http://bost.ocks.org/mike/transition/)\
    \ selection\", that will gradually update all the DOM element attributes and styles\
    \ in the first selection with their new values, in the second selection. This\
    \ all occurs over a duration of 250 milliseconds (1/4 of a second), the default\
    \ duration for a transition.\n\n![](img/82f49fe8a368850935eb7606dfa7579d_75_0.png)\n\
    \nAs a reminder, the object returned from calling `transition()` on a selector\
    \ is itself a selector, so we can easily use this same technique for selectors\
    \ with multiple elements. If we don't change a particular property or attribute\
    \ on both selections (the selector before the transition and the one after), that\
    \ property will *not* be transitioned.\n\nWe can adjust how long a transition\
    \ takes by using the `.duration()` method that exists only on transition selectors.\
    \ Working from the above example, we can adjust the animation to take 4 seconds\
    \ (4000ms), instead of 250ms, by using `transition().duration(4000)`.\n\n```javascript\n\
    1 d3.select('body').append('svg')\n2   .append('circle').attr({r: 10, cx: 100,\
    \ cy: 100})\n3   .transition().duration(4000).attr('cx', 300);\n```\n\nAnother\
    \ useful feature of transitions is the ability to specify an easing type. Easing\
    \ lets us fiddle with how the transition should accelerate. For example, if we\
    \ drop a feather 5 feet, it will fall at about a constant rate (unless we're on\
