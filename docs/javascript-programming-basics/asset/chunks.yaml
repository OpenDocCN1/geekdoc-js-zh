- fmt: "\n![](Images/cover00083.jpeg)\n\n# JAVASCRIPT PROGRAMMING BASICS\n### STEP\
    \ BY STEP GUIDE FOR BEGINNERS\nJAKE BOND\n\n## Javascript Tutorial\nThis JavaScript\
    \ lesson makes it simple for both beginners and experts to learn JavaScript.\n\
    \n### What is JavaScript and how does it work?\nJavaScript is a dynamic programming\
    \ language for computers. It is a lightweight and cross-platform object-based\
    \ scripting language.\n\nWith the aid of JavaScript, we can make our website more\
    \ vibrant and engaging.\n\nBrendan Eich, a Netscape employee, designed it in 1995.\
    \ It's a programming language that's used to make interactive websites. It's most\
    \ commonly used for:\n* Validation on the client's end.\n* Its drop-down menus\
    \ are dynamic.\n* It shows the current date and time.\n* Before transferring data\
    \ to a server, validate user input in an HTML form.\n* Create forms that respond\
    \ to user input without requiring a connection to a server.\n* Install new windows\
    \ or frames and close them.\n* Using popup windows and dialog boxes to display\
    \ information (for example, an alert dialog box, a confirm dialog box, or a prompt\
    \ dialog box).\n* Create client-side programs that are small but complete.\n*\
    \ Clocks and other timepieces.\n* Game and app development for mobile devices.\n\
    \n### Features of Javascript\n* JavaScript is a scripting language that is based\
    \ on objects.\n* The language is case sensitive.\n* It's light in weight.\n* In\
    \ JavaScript, every statement must be followed by a semicolon (`;`).\n\n### Advantages\
    \ of Javascript\n* JavaScript is a scripting language that is interpreted. There\
    \ is no need for a compiler because there is no compilation process. JavaScript\
    \ is interpreted by the browser as HTML tags.\n* JavaScript is a simple programming\
    \ language. It is very simple to learn for anyone. It's used to create dynamic\
    \ and appealing websites.\n* Because JavaScript is run on the client side, it\
    \ lowers the load on the website server.\n* It includes conditional checking,\
    \ loops, and branching functionality that can be used in web pages.\n* For the\
    \ end user, JavaScript is relatively quick. They don't have to wait for the page\
    \ to reload to see if they missed something.\n* Web pages now have more functionality.\
    \ To provide our site visitors with more functionality, we can use JavaScript\
    \ to include drag-and-drop components and sliders.\n\n## JavaScript Example\n\n\
    ### Welcome to JavaScript\n```html\n<script>\n  document.write(\"Hello JavaScript\
    \ by TutorialandExample\");\n</script>\n```\n**Output:**\nWelcome to JavaScript\n\
    Hello JavaScript by TutorialandExample\n\n### Javascript Example\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <h2>Welcome to JavaScript</h2>\n  <script>\n    document.write(\"\
    Hello Friends\");\n  </script>\n</body>\n</html>\n```\n**Output:**\nWelcome to\
    \ JavaScript\nHello Friends\n\nJavaScript can be implemented by including JavaScript\
    \ statements in the code using `<script>...</script>`.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"Hello\
    \ World\");\n  </script>\n</body>\n</html>\n```\n**Output:**\nHello World\n\n\
    In JavaScript, code may be written in three places:\n1. Between the `<body>`...`</body>`\
    \ tag of HTML.\n2. Between the `<head>`...`</head>` tag of HTML.\n3. In `.js`\
    \ file (external JavaScript).\n\n#### As an illustration (code between the body\
    \ tags)\nIn the example below, the `<body>` tag contains JavaScript code.\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n    alert(\"\
    Hello world\");\n  </script>\n</body>\n</html>\n```\n\n#### Example2 (between\
    \ the head tag, the code)\nWe'll create the function `msg` in the example below\
    \ `()`. In JavaScript, you must write function in function name to define a function.\
    \ To invoke a function, we must first create an event. We're using the one-click\
    \ event to call the `msg()` function in this case.\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <script type=\"text/javascript\">\n    function msg() {\n  \
    \    alert(\"Hello world\");\n    }\n  </script>\n</head>\n<body>\n  <p>Welcome\
    \ to Javascript</p>\n  <form>\n    <input type=\"button\" onclick=\"msg()\">\n\
    \  </form>\n</body>\n</html>\n```\n\n### External JavaScript file\nWe can create\
    \ a JavaScript file that we include in HTML. Because a single file may be used\
    \ in multiple pages, it allows for code reuse and improves web page performance.\
    \ The file must have a `.js` extension.\n\n**Example:**\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <script type=\"text/javascript\" src=\"message.js\"></script>\n\
    </head>\n<body>\n  <p>Hello world</p>\n  <form>\n    <input type=\"button\" onclick=\"\
    msg()\">\n  </form>\n</body>\n</html>\n```\n\n## JavaScript comment\nComments\
    \ in JavaScript are used to describe the code, such as warnings or suggestions,\
    \ so users can understand it.\n\n### Types\n1. Single-line Comment\n2. Multi-line\
    \ Comment\n\n#### Single-line Comment\nDouble slashes `//` are used to express\
    \ single-line comments. While the program is running, any text between the double\
    \ slashes and the end of the line will be ignored.\n\n**Example added before the\
    \ statement:**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    // single-line\
    \ comment\n    document.write(\"hello world\");\n  </script>\n</body>\n</html>\n\
    ```\n\n**Example added after the statement:**\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    var a=10;\n    var b=20;\n    var c=a+b; //sum of a and\
    \ b\n    document.write(c);\n  </script>\n</body>\n</html>\n```\n**Output:** 30\n\
    \n#### Multi-line comment\nSingle and multi-line comments can both be made with\
    \ multi-line comments. Comments that span multiple lines begin with `/*` and conclude\
    \ with `*/`. JavaScript ignores the text in between.\n\n**Example:**\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    /* It is multi-line comment.\
    \ It will not be displayed */\n    document.write(\"Example of JavaScript multi\
    \ line comment\");\n  </script>\n</body>\n</html>\n```\n\n## Javascript Variable\n\
    Values (`\"Ram\"`) and expressions (`x+y`) are stored in variables. We must first\
    \ declare a variable before utilizing it. To declare a variable, we use the term\
    \ `var` as follows: `var name;`.\n\nThere are two types of variables:\n1. Local\
    \ Variable\n2. Global Variable\n\n### Local Variable\nIt's declared inside a function\
    \ or a block.\n**Example:**\n```javascript\n<script>\n  function() {\n    var\
    \ x=10; //local variable\n  }\n</script>\n```\n\n### Global Variable\nIt has a\
    \ global scope, meaning that it can be defined anywhere in JavaScript code. Outside\
    \ of the function, a variable is declared.\n**Example:**\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script>\n    var data =200; //global variable\n    function\
    \ a() {\n      document.writeln(data);\n    }\n    function b() {\n      document.writeln(data);\n\
    \    }\n    a(); //calling javascript function\n    b();\n  </script>\n</body>\n\
    </html>\n```\n\n### In JavaScript, declaring a global variable within a function\n\
    To declare a JavaScript global variable inside a function, we must use the `window`\
    \ object.\n**Example:**\n```javascript\n<script>\n  function a() {\n    window.value=90;\n\
    \  }\n</script>\n```\n"
