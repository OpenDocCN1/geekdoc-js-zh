  trans: "\n\n![](img/cover00083.jpeg)\n\n# JavaScript 编程基础\n### 初学者逐步入门指南\nJAKE BOND\n\
    \n## JavaScript 教程\n这节 JavaScript 课程让初学者和专家都能轻松学习 JavaScript。\n\n### 什么是 JavaScript\
    \ 以及它是如何工作的？\nJavaScript 是一种用于计算机的动态编程语言。它是一种轻量级跨平台的基于对象的脚本语言。\n\n借助 JavaScript，我们可以让网站更具活力和吸引力。\n\
    \nNetscape 员工 Brendan Eich 在 1995 年设计了它。它是一种用于创建交互式网站的编程语言。它最常见的用途包括：\n* 客户端验证。\n\
    * 动态下拉菜单。\n* 显示当前日期和时间。\n* 在将数据传输到服务器之前，验证 HTML 表单中的用户输入。\n* 创建无需连接服务器即可响应用户输入的表单。\n\
    * 打开和关闭新窗口或框架（frames）。\n* 使用弹出窗口和对话框显示信息（例如：警告对话框、确认对话框或提示对话框）。\n* 创建短小但完整的客户端程序。\n\
    * 时钟和其他计时器。\n* 移动设备的游戏和应用开发。\n\n## JavaScript 的特性\n* JavaScript 是一种基于对象的脚本语言。\n\
    * 该语言区分大小写。\n* 它非常轻量。\n* 在 JavaScript 中，每条语句后面必须跟一个分号（`;`）。\n\n## JavaScript 的优势\n\
    * JavaScript 是一种解释型脚本语言。不需要编译器，因为没有编译过程。JavaScript 由浏览器作为 HTML 标签进行解释。\n* JavaScript\
    \ 是一种简单的编程语言。对任何人来说都非常容易学习。它用于创建动态且吸引人的网站。\n* 因为 JavaScript 运行在客户端，它降低了网站服务器的负载。\n\
    * 它包含了可以在网页中使用的条件检查、循环和分支功能。\n* 对于终端用户来说，JavaScript 是相对快的。他们不需要等待页面加载即可查看是否漏掉了某些内容。\n\
    * 现在网页具有更多功能。为了给网站访问者提供更多功能，我们可以使用 JavaScript 引入拖放组件和滑块。\n\n## JavaScript \n\n\
    ### 欢迎学习 JavaScript\n```html\n<script>\n  document.write(\"Hello JavaScript by\
    \ TutorialandExample\");\n</script>\n```\n**输出：**\nWelcome to JavaScript\nHello\
    \ JavaScript by TutorialandExample\n\n### JavaScript 示例\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <h2>Welcome to JavaScript</h2>\n  <script>\n    document.write(\"\
    Hello Friends\");\n  </script>\n</body>\n</html>\n```\n**输出：**\nWelcome to JavaScript（注：此处原文为英文，保持输出）\n\
    Hello Friends\n\n可以通过在代码中使用 `<script>...</script>` 包含 JavaScript 语句来实现 JavaScript。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n    document.write(\"Hello World\");\n  </script>\n</body>\n</html>\n```\n\
    **输出：**\nHello World\n\n在 JavaScript 中，代码可以写在三个地方：\n1. 在 HTML 的 `<body>`...`</body>`\
    \ 标签之间。\n2. 在 HTML 的 `<head>`...`</head>` 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\
    \n#### 举例说明（写在 body 标签之间的代码）\n在下例示例中，`<body>` 标签包含了 JavaScript 代码。\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n    alert(\"\
    Hello world\");\n  </script>\n</body>\n</html>\n```\n\n#### 示例 2（在 head 标签之间的代码）\n\
    我们将在下例的 `()` 中创建函数 `msg`。在 JavaScript 中，你必须在函数名后编写函数体来定义函数。要调用函数，我们必须先创建一个事件。在这种情况下，我们正在使用单击事件来调用\
    \ `msg()` 函数。\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
    >\n    function msg() {\n      alert(\"Hello world\");\n    }\n  </script>\n</head>\n\
    <body>\n  <p>Welcome to Javascript</p>\n  <form>\n    <input type=\"button\" onclick=\"\
    msg()\">\n  </form>\n</body>\n</html>\n```\n\n### 外部 JavaScript 文件\n我们可以创建一个包含在\
    \ HTML 中的的 JavaScript 文件。由于单个文件可以在多个页面中使用，因此它允许代码复用并提高网页性能。该文件必须具有 `.js` 扩展名。\n\
    \n**示例：**\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
    \ src=\"message.js\"></script>\n</head>\n<body>\n  <p>Hello world</p>\n  <form>\n\
    \    <input type=\"button\" onclick=\"msg()\">\n  </form>\n</body>\n</html>\n\
    ```\n\n## JavaScript 注释\nJavaScript 中的注释用于描述代码，例如警告或建议，以便用户理解代码。\n\n### 类型\n1.\
    \ 单行注释\n2. 多行注释\n\n#### 单行注释\n双斜杠 `//` 用于表示单行注释。在程序运行时，双斜杠到行尾之间的任何文本都将被忽略。\n\n\
    **在语句之前添加的示例：**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    //\
    \ 单行注释\n    document.write(\"hello world\");\n  </script>\n</body>\n</html>\n\
    ```\n\n**在语句之后添加的示例：**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
    \    var a=10;\n    var b=20;\n    var c=a+b; // a 和 b 的和\n    document.write(c);\n\
    \  </script>\n</body>\n</html>\n```\n**输出：** 30\n\n#### 多行注释\n单行和多行注释都可以通过多行注释实现。跨行的注释以\
    \ `/*` 开始，以 `*/` 结束。JavaScript 会忽略其中的文本。\n\n**示例：**\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script>\n    /* 这是多行注释。它不会被显示 */\n    document.write(\"Example\
    \ of JavaScript line comment\");\n  </script>\n</body>\n</html>\n```\n\n## JavaScript\
    \ 变量\n值（`\"Ram\"`）和表达式（`x+y`）存储在变量中。在使用之前必须先声明变量。声明变量使用 `var` 关键字，如下：`var name;`。\n\
    \n变量有两种类型：\n1. 局部变量\n2. 全局变量\n\n### 局部变量\n它定义在函数或块内部。\n**示例：**\n```javascript\n\
    <script>\n  function() {\n    var x=10; // 局部变量\n  }\n</script>\n```\n\n### 全局变量\n\
    它具有全局作用域，意味着可以在 JavaScript 代码的任何地方定义。在函数外部声明变量。\n**示例：**\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script>\n    var data =200; // 全局变量\n    function a() {\n \
    \     document.writeln(data);\n    }\n    function b() {\n      document.writeln(data);\n\
    \    }\n    a(); // 调用 JavaScript 函数\n    b();\n  </script>\n</body>\n</html>\n\
    ```\n\n### 在 JavaScript 中于函数内部声明全局变量\n要在函数内部声明 JavaScript 全局变量，我们必须使用 `window`\
    \ 对象。\n**示例：**\n```javascript\n<script>\n  function a() {\n    window.value=90;\n\
    \  }\n</script>\n```\n\n"
