  trans: "\n为了重用代码，我们多次调用 JavaScript 方法。\n\n## 优点 - JavaScript 函数\n\n1. **代码可重用性**：我们多次使用相同的方法来节省时间和代码量。\n\
    2. **更少的代码**：得益于此，应用程序得到了压缩。当我们执行常规任务时，不需要编写大量的代码。\n\n## 语法\n\n```javascript\n\
    function functionName(parameter or not)\n{\n  statements\n}\n```\n\n## 示例\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction msg() {\n  alert(\"\
    Hello! world\");\n}\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"\
    click here\"/>\n</body>\n</html>\n```\n\n### 输出\nHello world!（你好，世界！）\n\n## 带参数的函数\n\
    \n通过传递参数来调用函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ getcube(number) {\n  alert(number*number*number);\n}\n</script>\n<form>\n  <input\
    \ type=\"button\" value=\"click\" onclick=\"getcube(3)\"/>\n</form>\n</body>\n\
    </html>\n```\n\n#### 输出\n27\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\nfunction getname() {\n  name=prompt(\"Enter the Name\");\n  alert(\"\
    Welcome Mr/Mrs \" + name);\n}\n</script>\n</body>\n<form>\n  <input type=\"button\"\
    \ value=\"Click\" onclick=\"getname()\"/>\n</form>\n</html>\n```\n\n## 带返回值的函数\n\
    \n调用返回值的函数，并在程序中使用它。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ getInfo() {\n  return \"Hello Raj! How are you?\";\n}\n</script>\n<script>\n\
    \  document.write(getInfo());\n</script>\n</body>\n</html>\n```\n\n### 输出\nHello\
    \ Raj! How are you?（你好，Raj！你你好吗？）\n\n## Function() 构造函数\n\n函数语句不仅仅用于定义函数；它还可以使用\
    \ `Function()` 构造函数和 `new` 运算符来动态定义函数。\n\n### 语法\n\n```javascript\nvar variename\
    \ = new Function(Arg1, Arg2..., \"Function Body\");\n```\n\n### 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func = new Function(\"a\", \"b\"\
    , \"return a+b\");\nfunction secondFunction() {\n  var result;\n  result = func(50,50);\n\
    \  document.write(result);\n}\n</script>\n</head>\n<body>\n  <p>点击按钮调用函数</p>\n\
    \  <form>\n    <input type=\"button\" onclick=\"secondFunction()\" value=\"Call\
    \ Function\">\n  </form>\n</body>\n</html>\n```\n\n## 函数字面量 (Function Literals)\n\
    \n函数字面量的概念（构造函数的另一种另一种方式）在 JavaScript 1.2 中引入。它是一个定义无名函数的表达式。函数字面量的语法与函数语句相似，不同之处在于它被用作表达式而不是语句，并且不需要函数名。\n\
    \n### 语法\n\n```javascript\nvar variename = function(Argument List){\n  Function\
    \ Body\n};\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\n\
    var func = function(a,b){return a+b};\nfunction secondFunction() {\n  var result;\n\
    \  result = func(10,20);\n  document.write(result);\n}\n</script>\n</head>\n<body>\n\
    \  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Call Function\">\n  </form>\n  <p>在函数内部使用不同的参数并尝试一下吧...</p>\n</body>\n\
    </html>\n```\n\n## JavaScript 对象 (Javascript Object)\n\n对象是一个包含状态和行为的实体。JavaScript\
    \ 是一种关注对象的脚本语言。虽然 JavaScript 是基于模板而非基于类的，但它允许我们直接创建对象。\n\n### 语法 - 添加属性 - 添加对象\n\
    \n```javascript\nobjectName.objectProperty = propertyValue;\n```\n\n我们使用 `write()`\
    \ 方法来记录对象，以便在文档上写入任何内容。`Document.write(\"Hello world\")`\n\n### 示例\n以下示例展示了如何\
    \ 创建一个对象。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n\
    <script type=\"text/javascript\">\n  var book = new Object(); // 创建了对象\n  book.subject\
    \ = \"5 points someone\"; // 将属性赋值给对象\n  book.author = \"ChetanBhagat\";\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"Book Name\
    \ is : \" + book.subject + \"<br>\");\n  document.write(\"Book Author is : \"\
    \ + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n### 输出\nBook\
    \ Name is : 5 points someone\nBook Author is : ChetanBhagat\n\n## 对象的方法 (Methods\
    \ of an Object)\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n\
    <script type=\"text/javascript\">\n// 定义一个作为方法的函数\nfunction addPrice(amount){\n\
    \  this.price = amount;\n}\nfunction book(title,author){\n  this.title = title;\n\
    \  this.author = author;\n  this.addPrice = addPrice; // 将该方法赋值为属性。\n}\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n  var myBook = book(\"Points\
    \ Someone\",\"ChetanBhagat\");\n  myBook.addPrice(150);\n  document.write(\"Book\
    \ Title is: \" + myBook.title + \"<br>\");\n  document.write(\"Book Author is\
    \ : \" + myBook.author + \"<br>\");\n  document.write(\"Book Price is : \" + myBook.price\
    \ + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n### 输出\nBook Title is:  Points\
    \ Someone\nBook Author is : ChetanBhagat\nBook Price is : 150\n\n## JavaScript\
    \ 数组 (Javascript array)\n\n数组用于在单个单元或内存区域表示元素集合。进入数组的每个元素都存储在数组中，索引从零开始。我们可以通过索引来存储数据。在\
    \ JavaScript 中，我们必须使用 `new` 关键字声明数组。我们使用 `new Array(n)`。数组中的槽位由 `n` 表示。\n\n###\
    \ 语法\n```javascript\narray = new array(n);\n```\n注意：当我们在 JavaScript 中指定大小构建数组时，我们会构建大小为零的对象。\n\
    \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var i;\n  var\
    \ emp = new Array();\n  emp[0] = \"Ajay\";\n  emp[1] = \"Abhay\";\n  emp[2] =\
    \ \"Arun\";\n  emp[3] = \"Shipra\";\n  for (i=0; i<emp.length; i++) {\n    document.write(emp[i]\
    \ + \"<br>\");\n  }\n</script>\n</body>\n</html>\n```\n\n### 输出\nAjay\nAbhay\n\
    Arun\nShipra\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script type=\"\
    text/javascript\">\nfunction array() {\n  num = new Array(5);\n  num[0] = 10;\n\
    \  num[1] = 20;\n  num[2] = 30;\n  num[3] = 40;\n  num[4] = 50;\n  sum = 0;\n\
    \  for (i=0; i<num.length; i++) {\n    sum = sum + num[i];\n  }\n  alert(sum);\n\
    }\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"array()\" value=\"\
    click here\">\n</body>\n</html>\n```\n\n## JavaScript 字符串 (Javascript String)\n\
    \nString 对象用于处理字符字符串。它是用于存储和处理文本的工具。\n\n在 JavaScript 中，有两种方法创建字符串：\n\n1. 字符串字面量。\n\
