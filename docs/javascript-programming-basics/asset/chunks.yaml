    ## 2. Using new keyword.


    ### String literal

    String literals are created by using double quotes.


    #### Syntax

    ```javascript

    var stringname="string value";

    ```


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var str="Hello String Literal";

    document.write(str);

    </script>

    </body>

    </html>

    ```

    #### Output

    `Hello String Literal`


    ### Using new keyword

    #### Syntax

    ```javascript

    var stringname=new String("new keyword")

    ```


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var stringname=new String("Hello String");

    document.write(stringname);

    </script>

    </body>

    </html>

    ```

    #### Output

    `Hello String`


    ### String properties

    There is a list of string object properties as well as their descriptions.


    1. `constructor`.

    2. `length`.

    3. `prototype`.


    **Constructor**– It gives you a reference to the string function that made the
    object in the first place.


    #### Syntax

    ```javascript

    string.constructor

    ```


    **Length** - The number of characters in a string is returned.


    #### Syntax

    ```javascript

    string.length

    ```


    **Prototype**– It let any object to have properties and methods added to it.(Number,
    Boolean, string, and data etc.). This is a global property that most objects have
    access to.


    #### Syntax

    ```javascript

    object.prototype.name = value

    ```


    ### Methods are also available in the JavaScript string:

    ![](Images/image00082.jpeg)


    #### charAt()

    It''s a method for getting the character from a given index.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var str = new String( "Hello" );

    document.writeln("str.charAt(0) is: " + str.charAt(0));

    document.writeln("<br />str.charAt(1) is: " + str.charAt(1));

    document.writeln("<br />str.charAt(2) is: " + str.charAt(2));

    document.writeln("<br />str.charAt(3) is: " + str.charAt(3));

    document.writeln("<br />str.charAt(4) is: " + str.charAt(4));

    </script>

    </body>

    </html>

    ```


    #### concat(str)

    This method returns a new string after adding two or more strings.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var x="Hello";

    var y="World";

    var z=x+y;

    document.write(z);

    </script>

    </body>

    </html>

    ```


    #### Here another example of concat(str)

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var a = new String( "Hello" );

    var b = new String( "Friends" );

    var c = a.concat( b );

    document.write("Concatenated String : " + c);

    </script>

    </body>

    </html>

    ```


    #### indexOf(str)

    index of a string - The index position of the given string is returned by the
    `indexOf(str)` method.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var x="Tutorial provide by tutorialandexample";

    var y=x.indexOf("by");

    document.write(y);

    </script>

    </body>

    </html>

    ```


    #### lastIndexOf(str)

    The string `lastIndexOf(str)` method returns the string''s last index point.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var x="Tutorial provide by tutorialExamole";

    var y=x.lastIndexOf("by");

    document.write(n);

    </script>

    </body>

    </html>

    ```


    #### match()

    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var str = "To more detail, see Chapter 2.5.4.1";

    var re = /(chapter \d+(\.\d)*)/i;

    var find = str.match( re );

    document.write(find );

    </script>

    </body>

    </html>

    ```


    #### toLowerCase()

    The specified string is returned as lowercase letters.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var x="HELLO WORLD";

    var y=x.toLowerCase();

    document.write(y);

    </script>

    </body>

    </html>

    ```


    #### toUpperCase()

    The specified string is returned in uppercase characters.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var x="hello world";

    var y=x.toUpperCase();

    document.write(y);

    </script>

    </body>

    </html>

    ```


    #### valueOf()

    It returns the string object''s primitive value.


    #### Example

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var str = new String("Hello world");

    document.write(str.valueOf( ));

    </script>

    </body>

    </html>

    ```

