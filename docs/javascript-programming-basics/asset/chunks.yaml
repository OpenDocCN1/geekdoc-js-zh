    ## 2. 使用 new 关键字。


    ### 字符串字面量

    字符串字面量是通过双引号创建的。


    #### 语法

    ```javascript

    var stringname="string value";

    ```


    #### 示例

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var str="Hello String Literal";

    document.write(str);

    </script>

    </body>

    </html>

    ```

    #### 输出

    `Hello String Literal`


    ### 使用 new 关键字

    #### 语法

    ```javascript

    var stringname=new String("new keyword")

    ```


    #### 示例

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var stringname=new String("Hello String");

    document.write(stringname);

    </script>

    </body>

    </html>

    ```

    #### 输出

    `Hello String`


    ### 字符串属性

    这里列出了字符串对象的属性列表及其描述。


    1. `constructor`。

    2. `length`。

    3. `prototype`。


    **构造函数 (Constructor)**– 它它为你提供一个指向最初创建该对象的字符串函数的引用。


    #### 语法

    ```javascript

    string.constructor

    ```


    **长度 (Length)** - 返回字符串中的字符数。


    #### 语法

    ```javascript

    string.length

    ```


    **原型 (Prototype)**– 它允许向任何对象添加属性和方法（如 Number、Boolean、string 和数据等）。这是一个大多数对象都可以访问的全局属性。


    #### 语法

    ```javascript

    object.prototype.name = value

    ```


