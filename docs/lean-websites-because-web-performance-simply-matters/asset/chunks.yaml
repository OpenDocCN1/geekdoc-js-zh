    2. 完成比较测试后，你将看到网站 A 和网站 B 的胶片图，如图 4.16 所示。网站 B 立即交付第一个可见内容，而网站 A 在 6 秒后才开始在折叠以上（above
    the fold）显示有用内容。


    ![比较两个服装网站的 WPT 胶片图](img/4-competitive-comparison.png)


    图 4.16。比较两个服装网站的 WPT 胶片图


    3. 这里是一些额外的测量：


    | 竞争性能对比 | [网站 A](http://www.webpagetest.org/result/141211_NJ_NN6/3/details/)
    | [网站 B](http://www.webpagetest.org/result/141211_NV_NN5/1/details/) |

    | --- | --- | --- |

    | 速度指数 (SpeedIndex) | 6197 | 4483 |

    | 字节（完全加载） | 4,761KB | 1,915KB |

    | 视觉完成 (Visually Complete) | 9.300s | 5.700s |


    网站 A 绝对有改进空间，因为它的性能明显没有网站 B 好。上面的每个类别都显示了两者之间的巨大差异。网站 A 的总页面大小是网站 B 的两倍以上。


    你自己尝试一下：考虑谁是你最大的竞争对手，哪个网站与你的网站相似，或者在速度方面你推崇哪一个网站。针对它进行衡量，并设定你的预算。


    ### 提示：WPT 的替代方案


    除了使用 WPT 的视觉比较外，你还可以使用 [SpeedCurve](http://speedcurve.com)，这是一个视觉良好、基于云的工具，可以让你针对竞争对手和行业类别对网站进行基准测试。


    ### 创建业务假设并证明它们


    花些时间理解网站速度如何影响你的业务指标，反之亦然。如果你需要管理层的支持来加速你的网站，最好的方法是将你的性能目标与真实的业务数据对齐。负面的性能结果是否会直接与糟糕的业务表现相关联？


    弄清这两个现象之间是否存在相关性是非常重要的。你可能需要产品经理或营销/销售团队的帮助来调查用户在网站的行为。向他们索要能够提供你当前网站最大的“痛”点的数据。寻找暗示性能是你的转化瓶颈的线索。


    目标是提出与性能相关的假设，这些假设可以通过具体数据进行验证，然后进行改进。


    让我们讨论一个简单的例子。假设你维护着一个销售家具的电子商务网站，你已经对竞争对手进行了性能分析，并定义了你的头号竞争对手。你想确保人们通过你的网站而不是竞争对手的网站购买家具。现在，让我们创建一些假设和目标。一个好的开始是比较你的网站与竞争对手网站首先加载的元素。例如，检查你的“行动号召”（CTA)[^([2])](#ch04.html_ftn.d5e1576)按钮加载是否比竞争对手网站上的按钮更快。或者比较折叠以上可见哪些内容。


    以下是一些可能帮助为家具电商网站形成假设的观察结果：


    | 观察 | 假设 |

    | --- | --- |

    | “今年冬季销售额很低，没有人点击我们的特别折扣按钮” | 通过确保特别折扣按钮更显著并尽可能快地加载，我们将增加销售和市场份额（以与竞争对手竞争） |

    | “网站访问人数比两个月前少” | 通过移除或优化资源——例如沉大的主图——我们将增加访问人数 |

    | “访问者在结账过程中流失” | 通过改进结账过程的页面加载时间，流失率将降低 |


    基于这些观察结果，上表显示了你如何戴上性能的帽子，做出假设，然后提出具体的预算目标。


    你还可以使用第 3 章中描述的 A/B 测试来测试不同的选项，以收集数据显示哪些变化将产生最大的影响。


    上述假设是有效的假设，并且在过去已适用于零售和购物网站。例如，提升 [AutoAnything.com](http://www.radware.com/PleaseRegister.aspx?returnUrl=6442452828)
    的页面加载时间使销售额提高了 13%。另一个[真实案例](https://blog.mozilla.org/metrics/2010/04/05/firefox-page-load-speed-%E2%80%93-part-ii/)来自
    Mozilla：将他们的页面加载时间缩短 2 秒导致下载量增加了 15.4%。你越早将内容交给用户，他们越早能与之交互，你受益得越多。


    你能想到你的网站可能对业务产生负面影响的性能瓶颈吗？


    ### 列出并承诺性能指标


    一旦你收集了足够的基准数据并创建了竞争性能分析，是时候将它们转化为官方目标并承诺执行。


    1. 列出你当前的性能数据。我将继续使用在本章开头介绍的示例页面。


    | WPT 指标 | 结果 |

    | --- | --- |

    | 完全加载 (Fully Loaded) | 2.58s |

    | 速度指数 (SpeedIndex) | 2222 |

    | 字节（完全加载） | 692KB |


    2. 优先考虑可以改进的结果。从容易实现的目标开始。例如，首先处理“完全加载”结果，目标是减少到 2 秒。


    | 优先级 | 指标 | WPT 结果 | 预算目标 |

    | --- | --- | --- | --- |

    | 1 | 完全加载 | 2.58s | < 2s |

    | 3 | 字节（完全加载） | 692KB | 目标 1 后改进 |

    | 2 | 速度指数 | 2222 | 目标 1 后改进 |


    此外，如果你为你的网站收集了 RUM 数据（就像我为 bbinto.me 做的那样），你还可以为加载时间指定目标，以确保你的真实用户“真正”从变化中受益。bbinto.me
    显示中值为 4.6s。对于这个例子，我们可以设定 3 秒。


    3. 承诺你的目标。不要只是口头上说说，要在团队中传阅和发布——如果有帮助，甚至打印出来挂在某处。Etsy 在公开网站性能方面做得很好。他们季度发布一次[性能报告](https://codeascraft.com/2014/08/01/q2-2014-site-performance-report/)。


