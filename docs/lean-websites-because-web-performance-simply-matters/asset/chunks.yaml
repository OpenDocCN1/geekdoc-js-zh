    To illustrate the use of caching headers, let''s take a look at the response headers
    from the previous Google sprite image, as outlined in the red box in [Figure 9.8](#ch09.html_ch9-cache-control
    "Figure 9.8. Checking out Cache-Control headers for the sprite image"). The response
    header is sent by the server, while the request header is sent by a browser to
    a server:


    ![Checking out Cache-Control headers for the sprite image](OEBPS/figures/9-cache-header-google.png)


    Figure 9.8. Checking out Cache-Control headers for the sprite image


    Let''s have a look at the `Cache-Control` header. Its settings are called `cache
    response directives`. The first directive is either `public`, `private`, `max-age`,
    or `no-cache`.


    * `public`: a public, or “shared” cache is leveraged by more than one client.
    Because of that, it provides great performance gain, because a user may receive
    a cached copy from somebody else without ever having to obtain the original copy
    from the origin. Publicly cacheable assets could be logos, navigation items, JavaScript
    and CSS files etc.—anything that is requested very frequently by most or every
    visitor to your site.

    * `private`: a private cache is only used by a single client and not shared. It
    allows caching of assets that are specific to one user in a browser. No proxy
    server will cache the response. This is mostly used when people access assets
    that need authorization and are served via HTTPS. The Google image example above
    uses a private directive, so the asset can’t be picked up by intermediate caches^([5])](#ch09.html_ftn.d5e3781)
    or CDNs to be used for other users to retrieve.

    * `max-age=[seconds]`: specifies the maximum amount of time in seconds that the
    asset is considered fresh. This directive is relative to the time of the request.
    In the Google image example, the `max-age` is set to 31536000 seconds, or 365
    days. These `Cache-Control` directives leave the asset in the browser cache for
    365 days before checking if a newer version is available to fetch.

    * `no-cache`: every time the asset is requested, the cache needs to submit a request
    to the origin for confirmation before releasing a cached copy.


    More on the different directives can be found in the [W3C Header Field Definitions
    document](http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.9).


    ### Conditional Requests


    Besides the caching directives set in the `Cache-Control` header, there are additional
    headers you can use to check for specific conditions of the asset; and these conditions
    can be used to determine if an updated copy of the asset should be fetched. These
    conditional requests can be content-based (`ETag`) or time-based (`If-modified-since`)
    states, or states that improve performance while the updated version of the asset
    is being fetched (`stale-while-revalidate`, `stale-if-error`).


    #### Content-based


    You will notice that some assets also have an `ETag` in the response header. When
    a browser is directed by a `Cache-Control` setting to refresh an asset, but the
    asset hasn''t changed, that''s where the `ETag` comes in. The `ETag` is generated
    by the server, and is an arbitrary token (such as an MD5 hash) that acts as a
    fingerprint of the contents of the asset. If the hash is still the same as the
    value of `If-None-Match` in the request header, then the browser knows the asset
    hasn''t changed, and so skips the download. Find more information on how to create
    `ETags` from [Yahoo’s Best Practices for Speeding Up Your Web Site](https://developer.yahoo.com/performance/rules.html#etags).


    Here''s an example of an `ETag` in use. The following snippet is an HTTP request
    header `if-None-Match`, and the corresponding response header with the `ETag`
    hash for a style sheet on my website `/css/services.css`. The hash is the same,
    indicating that the content of the style sheet hasn''t changed from the version
    in the cache, so the content doesn''t need to be downloaded again.


    * Request header:

    ```

    GET /css/services.css?ver=2015Febaa HTTP/1.1

    ...

    If-None-Match: "532a0d9b-bd8+gzip"

    ...

    ```


    * Response header:

    ```

    HTTP/1.1 304 Not Modified

    ...

    Etag: "532a0d9b-bd8+gzip"

    ...

    ```


    #### Time-based


    [Conditional time-based headers](https://devcenter.heroku.com/articles/increasing-application-performance-with-http-cache-headers),
    such as `If-modified-since` (in the request header) and `Last-modified` (in the
    response header), can be set to only request a fresh version of the asset if it
    actually has been modified since the browser’s copy was cached. If the cached
    copy is the most up-to-date, then the server will not serve any new copy and returns
    a 304 (not modified) response code.


    The following snippet is an HTTP request header of `if-modified-since`, and its
    corresponding response header with the `Last-modified` response for a style sheet
    on my website `/css/services.css`.

    ```

    GET /css/services.css?ver=2015Febaa HTTP/1.1

    ...

    If-Modified-Since: Wed, 19 Mar 2014 21:35:23 GMT

    ...

    ```


    * Response header:

    ```

    HTTP/1.1 304 Not Modified

    ...

    Last-Modified: Wed, 19 Mar 2014 21:35:23 GMT

    ...

    ```


    The `Last-modified` date is not newer than the `If-Modified-Since` date, and therefore
    no new copy has to be requested.


    #### `stale-while-revalidate`


    [Stale content](http://tools.ietf.org/html/rfc5861) describes an older version
    of the asset that the browser keeps using from the cache. The `stale-*` extensions
    allow the browser to continue using stale content under specific conditions, while
    it''s trying to retrieve a newer copy of the asset from the server in the background.


    The `stale-while-revalidate` header allows the browser to keep using the current,
    possibly stale, version of the asset, until the amount of time you specify in
    the header. In the meantime, the newest version of the asset is being re-fetched
    in the background. By updating the asset in the background, we achieve optimal
    utilization of the cache:


    ```

    HTTP/1.1 200 OK

    Cache-Control: max-age=86400, stale-while-revalidate=43200

    Content-Type: text/plain

    ```


    The asset will be read from the cache for 86400 seconds (1 day). After that time
    has passed, the cache will re-fetch the requested asset. If we didn''t set `stale-while-revalidate`,
    the page would load more slowly. Instead, we give the cache up to 43200 seconds
    (half a day) to re-fetch the new version in the background, thus ensuring fast-loading
    assets for the end user.


    #### `stale-if-error`


    When the `stale-if-error` header is set, it allows the user to receive the asset
    from the CDN without interruption, even if there is an issue with the asset at
    the origin server. Instead of showing a broken asset, it will instead serve the
    stale content to improve availability:


    ```

    HTTP/1.1 200 OK

    Cache-Control: max-age=1000, stale-if-error=1200

    Content-Type: text/plain

    ```


    In the example above, the response first indicates that the asset will be fresh
    for 1000 seconds. In addition, the asset can be used for another 1200 seconds.
    If an error occurs after that, it becomes stale.


    Not many websites are utilizing these optimization features yet. As of [January
    2015](http://bbinto.github.io/lean-web-code/chapter-9/cache-headers-stale-jan2015.xlsx),
    0.2% of the top Alexa websites use `stale-while-revalidate` for their assets,
    and only 0.1% use `stale-if-error`.


    ### Caching in Practice


    In order to benefit from the caching options mentioned above, the caching headers
    need to be set in your web server configuration file. We normally refer to this
    set up as the caching *policy*.


    It''s good practice for every developer to lay out a set of carefully formulated
    `Cache-Control` policies, outlining the website''s assets according to their expected
    lifetimes.

