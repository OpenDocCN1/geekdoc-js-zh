    As you can see from the results of both performance tests above, PageSpeed and
    Speed Index seem not to match up fully with their judging criteria. While Speed
    Index focuses mostly on the ATF visibility and interactivity, [Page Speed](https://developers.google.com/speed/docs/insights/about)
    also factors in the time it takes to load the page fully.


    # Anatomy of an HTTP Transaction


    Let''s have a closer look at how each asset of a page is loaded.


    Each item in the resource waterfall represents a network transaction, also called
    an HTTP transaction. An HTTP transaction describes the process of a client making
    a single request for HTTP content. When we talk about HTTP content, we normally
    refer to anything that can be received by the browser, in so-called content types.


    `Content types` can be scripts, images, HTML, text, Flash, Excel or Word documents
    etc.—basically anything that can be served to, and displayed by, the browser.
    Any other content type that is not supported and can''t be displayed will be offered
    as a download. The various content types are color-coded in the waterfall, as
    we saw previously.


    In [Figure 3.8](#ch03.html_ch3-time-waterfall "Figure 3.8. a WPT waterfall view
    for Time.com") you can find a snippet of a WPT waterfall view for Time.com:


    ![a WPT waterfall view for Time.com](OEBPS/figures/3-waterfall.png)


    Figure 3.8. a WPT waterfall view for Time.com


    Let''s look at a particular asset in the waterfall: the Twitter widget.


    ![A Twitter JavaScript file being loaded very early on in the process of loading
    the page](OEBPS/figures/3-waterfall-asset.png)


    Figure 3.9. A Twitter JavaScript file being loaded very early on the process of
    loading the page


    Overall, it took the browser 334ms to load this file. The transaction shown in
    this waterfall consists of five different bars, each color-coded. The third one
    is the longest. This bar shows the time that was spent for the SSL negotiation.


    So what does that all mean? Why did this event take the longest amount of time?
    And what do the other bars represent? Let''s take a closer look. The image below
    breaks down this HTTP transaction:


    ![A closer look at an HTTP transaction in the waterfall](OEBPS/figures/3-http-request-detail.png)


    Figure 3.10. A closer look at an HTTP transaction in the waterfall


    Let''s examine these from the left to right.


    ## DNS Lookup


    `DNS` stands for Domain Name System. During the DNS lookup, the browser attempts
    to look up the domain of the asset it is trying to load. Each human-friendly URL
    has a computer-friendly IP address. You can use both in your browser. For example,
    `www.sitepoint.com` maps to `54.221.218.251`.


    There are many variables that can cause a [delay](https://www.igvita.com/posa/high-performance-networking-in-google-chrome/)
    during this event.


    ## Initial Connection


    `initial connection` occurs when the client and server perform a “handshake” to
    start communicating with each other over Transmission Control Protocol (TCP).
    The browser basically says “Hello, I want to request some stuff, are you available?”
    and the server says “Yes, I''m here, send away.”


    So what could cause a delay for this event? Each party needs to wait until the
    other party “has spoken”. The server can''t send anything until the browser has
    received the “Yes, I''m here, send away.”


    The travel time to communicate from sender to receiver is governed by speed of
    light limitations: the further they are apart from each other, the longer it will
    take to set up the TCP connection.


    ## SSL Negotiation


    `Secure Socket Layer` (SSL) enables secure communication. It''s a protocol for
    encrypting information over the Internet (using `https://` instead of `http://`).
    HTTPS in the scheme instructs the browser to perform a secure handshake.


    ### Note: SSL or TLS?


    [SSL](http://technet.microsoft.com/en-ca/library/cc784450.aspx) was developed
    by Netscape Communications Corporation in 1994 to secure transactions over the
    World Wide Web. You''ve probably seen SSL in combination with TLS, sometimes even
    referred to as SSL/TLS. TLS stands for Transport Layer Security. SSL is the predecessor
    of TLS. The Internet Engineering Task Force standardized the SSL protocol, and
    named it TLS.


    The [differences](https://www.ietf.org/rfc/rfc2246.txt) between TLS and SSL 3.0
    are not dramatic, but they are significant enough to prevent interoperability
    between TLS 1.0 and SSL 3.0.


    This event is about negotiation between two parties (the browser and the server).
    Each SSL negotiation over HTTPS requires a new TCP connection, including the process
    of a [secure key exchange](http://publib.boulder.ibm.com/tividd/td/TRM/GC32-1323-00/en_US/HTML/admin231.htm),
    making it more computationally expensive. However, [modern hardware](http://chimera.labs.oreilly.com/books/1230000000545/ch04.html#TLS_COMPUTATIONAL_COSTS)
    has been able to absorb this disadvantage. Also, once negotiation has been completed,
    the same connection can be used for any request to the same origin.


    ## Time to First Byte


    `Time to First Byte` (TTFB) occurs after the TCP handshake has successfully been
    executed, and after the browser and server have started talking to each other—when
    the first byte is actually sent to the browser.


    This metric also represents latency. The bigger the green bar, the higher the
    latency. Depending on your location and/or the device you''re using, you will
    notice smaller or bigger latency.


    ### Note: Latency


    `Latency` is the time it takes for the content to be requested by, and sent to,
    your browser. Latency can vary. It is affected by the distance the data has to
    travel and the medium that conducts it. You experience higher latency particularly
    on [mobile networks](https://www.igvita.com/2012/07/19/latency-the-new-web-performance-bottleneck/).
    Why? The radio of your device needs to find the closest tower to establish a connection.
    If the device is idle, it can take even longer.


    TTFB comprises two factors: the actual physical distance from the browser to the
    server, and the processing time of the server. It can be summed up in the following
    formula: `TTFB = Round trip network latency + back-end processing time`.


    [Research](http://www.websiteoptimization.com/speed/tweak/time-to-first-byte/)
    that tested around 300 uncached websites showed the largest web page load time
    component to be TTFB, followed by DNS lookup, connection time, and download time.
    Even for cached websites, TTFB was still the biggest load time component, followed
    by connection time, download time and DNS lookup. Hence it''s worth focusing on
    optimizing TTFB.


    If the TTFB is slow, other metrics will suffer from this delay, creating a chain
    reaction.


    ## Content Download


    This event occurs when the asset you requested actually starts to show up in your
    browser. You sometimes can guess by looking at the length of the blue bar how
    big the asset actually is. Images, for example, tend to have a bigger blue bar.
    The bigger the blue bar, the larger the actual asset, and hence the more time
    it takes to be sent over the wire.


    Minimizing the file size of the asset is key to optimizing the amount of time
    spent on Content Download. Chapters 6 and 7 will present ways to optimize content
    such as images, JavaScript and HTML files.


    ## Unpredictable Side Effects: Connection Speed, Bandwidth and Latency


    While we can influence the performance factors mentioned above, those we''ll discus
    in this section are mostly beyond our control, but are still important to keep
    in mind when developing lean websites.


    ### Bandwidth and Latency


    It''s important to consider your users'' average bandwidth (connection speed)—which
    varies a lot between regions—when developing your website. The greater your users''
    bandwidth, the faster they''re likely to retrieve your website.


    [Akamai''s State of the Internet Report](http://www.akamai.com/dl/akamai/akamai-soti-q114.pdf?WT.mc_id=soti_Q114)
    contains a lot of great information about service providers, connection speeds
    by region, and mobile browser usage data:

