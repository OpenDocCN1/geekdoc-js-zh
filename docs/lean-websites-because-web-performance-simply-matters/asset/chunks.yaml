    # 介绍


    *   [WebPagetest](http://webpagetest.org) 是解决所有性能相关问题的“万灵药”。根据你选择的测试位置，你可以选择多种设备和浏览器选项之一。显然，你一次只能测试网站的一个页面，但有时这足够了。合成的
    WPT 结果将帮助你了解网站在移动设备上的性能表现。然而，你可能不会用它来调试，因为它是静态的，且不允许用户交互。


    要模拟不同的连接速度，你可以使用 Chrome 开发者工具、[Slowy](http://slowyapp.com/) 或 [Wireshark](https://www.wireshark.org/)。


    ## 设备测试


    如果你能够建立一个真实设备的实验室（就像 [Etsy 所做](https://codeascraft.com/2013/08/09/mobile-device-lab/)），以下工具可以帮助你在这些设备上简化测试：


    *   [Adobe Edge Inspect](https://creative.adobe.com/products/inspect) 通过将你的测试设备与电脑配对，帮助你在多个浏览器上实时测试你的网站。

    *   [Shim](https://github.com/dmolsen/shim) 作为 Node.js 运行，与 Adobe Edge Inspect
    类似，能够在一个连接到同一 WiFi 网络的多个设备上同时加载页面。


    ### 提示：模拟器 vs 真实设备测试


    在真实设备上测试始终比在模拟器上更好，尤其是当你有意识地决定支持特定的浏览器和设备操作系统时。例如，模拟器无法提供电量消耗、连接速度或性能的真实模拟，而且无法通过鼠标模拟触摸屏体验。因此，虽然它们对于简单的测试目的很方便，但不要过度依赖它们。当然，你必须在这种考虑与测试一系列不同设备的成本和物流成本之间取得平衡。


    ## 结语


    *   移动端使用率正在上升，通过移动设备浏览很快将超过桌面浏览。

    *   移动端面临的特殊挑战是速度、电池寿命和功耗。开发移动网站时，请假设用户的连接是最糟糕的。

    *   设备描述存储库是定期更新的市面设备列表，可用于识别连接到你网站的设备。

    *   你可以通过 HTTP user agent 字符串头（通过服务器端或客户端解决方案）检测设备。

    *   有一些非常有用的工具可以在移动设备上测试（或模拟）你的网站。


    * * *


    [^([6])](#ch10.html_d5e4059) 来源：Ilya Grigorik 的《High Performance Browser Networking》


    # 第 11 章：移动优化技术


    ## 热身


    在上一章中，我们讨论了移动网络带来的某些性能挑战。让我们来看看如何解决这些挑战，运行一些可以帮助移动网站变得精简快速的性能加速器。在本章最后，我将为你提供关于如何创建自己的移动策略的一些想法。


    ## 移动性能加速器


    让我们开始改进移动网页浏览的选项。


    ### 离线存储


    HTML5 引入了[离线存储](http://www.html5rocks.com/en/features/storage)，使得浏览器能够存储网页副本，从而允许用户在离线状态下浏览页面。离线存储可以通过消除从服务器重新获取资源的需求来帮助节省不必要的
    HTTP 请求。重要的是，在本书的背景下，离线存储也有助于提高*感知*性能。


    虽然离线存储可能有些[漏洞](http://alistapart.com/article/application-cache-is-a-douchebag)，而且有时在实现和管理上很复杂，但有一些
    Web 应用——例如 [金融时报 Web 应用](http://apps.ft.com/ftwebapp/) 或 [Google 的基于 Web 的离线邮箱](http://googlecode.blogspot.com/2009/04/gmail-for-mobile-html5-series-using.html)
    版本——已经展示了如何成功使用它进行性能增强。想象你正在火车上，想在进入隧道前读完一篇新闻。如果网站支持离线存储，你就可以持续阅读而不中断。


    离线浏览可以通过“应用程序缓存”（通常缩写为“appcache”）或“本地存储”（local storage）来实现，这两者都有助于避免 HTTP 请求，因为它们在本地缓存并保存文件。


    `[Appcache](https://developer.mozilla.org/en-US/docs/Web/HTML/Using_the_application_cache)`
    允许你指定浏览器应该缓存哪些文件并提供给离线用户。它基于 `manifest file`，该文件告诉浏览器从本地缓存加载哪些内容，哪些文件需要重新请求。然而，你需要考虑哪些文件应该保存在本地。由于
    appcache 在某些浏览器中仍然不可靠，最好遵循 [FT Labs](http://www.smashingmagazine.com/2013/05/23/building-the-new-financial-times-web-app-a-case-study/)
    团队的建议，保持 manifest 文件尽可能小，只包含较小文件，如字体、favicon 和少量图像。


    `[Local storage](http://diveintohtml5.info/storage.html)` 也被称为“客户端存储”或“Web 存储”。它像任何
    JavaScript 对象一样基于键值对。你可以在本地存储中存储 JavaScript 或 CSS 代码块，并在随后的页面查看中检索这些代码块并将其插入页面中，从而减小
    HTML 文档的下载尺寸，并加快初始渲染时间（Start Render time）。


    [Guardian](http://www.theguardian.com/) 网站展示了如何使用本地存储来提升性能的示例。它包含在访问者浏览器支持本地存储时执行的
    JavaScript。CSS 文件通过 Ajax 异步加载。在第一次运行时，CSS 是内联的，但也存储在浏览器的本地存储中。下当用户访问该页面或 Guardian
    网站上的任何后续页面时，服务器将不再加载内联 CSS，而是使用本地存储版本，从而更快地为用户提供页面。通过这种方法，Guardian 能够将其初始渲染时间从
    [1.113s 降至 0.759s](https://speakerd.s3.amazonaws.com/presentations/ca037050b8d40131e4494251e58a135f/Breaking_news_at_1000ms_-_4-3_-_pdf.pdf)。


    ### 提示：存储局限性


    如果你计划存储大量数据，请注意大多数移动浏览器在本地存储中无法存储超过约 5MB 的数据。


    你可以使用的其他本地存储技术包括 [Web SQL Database](http://www.w3.org/TR/webdatabase/)（已弃用）、[IndexedDB](http://www.w3.org/TR/IndexedDB/)
    和 [File System API](http://www.w3.org/TR/file-system-api/)。如果你想存储大量内容，应该考虑使用结构化数据库而不是本地存储，因为本地存储在执行多次操作时可能会慢。此外，本地存储是同步执行的，而数据库选项是异步的，允许你并行获取数据，从而避免阻塞移动应用程序的执行。


    ### 其他针对移动端的优化建议


    我们在第 5 章、第 6 章和第 7 章中讨论的所有性能加速器对移动网站都有帮助。但正如我们在第 10 章中所讨论的，移动网络更高的延迟以及移动设备性能较弱的
    CPU/GPU（导致 JavaScript 性能较慢）都为移动设备的 Web 性能带来了特殊挑战。让我们来看一些针对移动限制优化你网站的技巧。


    #### 应对移动延迟


