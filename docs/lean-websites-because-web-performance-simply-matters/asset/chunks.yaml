  trans: "\n\n不要让移动设备的无线电频繁地在空闲模式和活动模式之间切换，以避免不必要的往返。在空闲状态下，设备无法发送或接收任何数据。要发送和接收数据，无线电必须与附近的基塔同步，这需要移动设备与基塔之间进行多次往返。因此，在空闲和非空闲状态之间切换不仅会消耗电池寿命，还会引入更多延迟，从而影响性能。\n\
    \n因此，尝试尽可能快地单批次执行所有请求，然后让无线电返回空闲状态。尝试在无线电已经启动时使用它——例如，使用我们之前讨论过的预取技术。\n\n此外，通过尽可能减少\
    \ HTTP 请求来对抗移动端的延迟，并压缩和缓存资源以规避进一步的请求或往返。\n\n### 注意：域名分片（Domain Sharding）\n\n[域名分片](http://www.stevesouders.com/blog/2009/05/12/sharding-dominant-domains/)\
    \ 的理念是将资产分布在多个域名或子域名上，以便更快地为用户提供服务。浏览器可以开启六个并发连接，允许你的资产分布在六个不同的域名上并进行并行下载。然而，不要被这种方法误骗。特别对于移动网站，使用不同的域名意味着会有额外的\
    \ DNS 查询和必须打开的额外 TCP 连接。如果你使用[两个以上的域名](http://www.stevesouders.com/blog/2013/09/05/domain-sharding-revisited/)，性能将会受到损害，特别是当移动用户没有足够的带宽来处理来自服务器的大量资源时。\n\
    \n### 优化重绘（Repaints）和重流（Reflows）\n\nJavaScript 的执行在移动设备上可能速度较慢，因此请尽可能避免重绘和重流操作，并避免过多的\
    \ DOM 操作。第 5 章提供了关于如何增强重绘和重流的更多细节。\n\n### 无卡顿滚动和动画\n\n如今大多数移动设备使用触摸手势，通过手指进行滚动。手指手势可以轻松快速滚动页面。正如第\
    \ 5 章所述的，理想情况下动画应以每秒 60 帧的速度运行以获得流畅的结果。然而，由于移动端 CPU/GPU 的限制，处理动画可能需要几百毫秒。在此期间，动画可能会变得极其“卡顿（janky）”，特别是在快速滚动时。\n\
    \n为了在移动设备上产生平滑的动画，我建议使用 `requestAnimationFrame()`（在第 6 章 中讨论）。通过这种方式你可以节省 CPU\
    \ 周期，让动画与 GPU 同步更好。这有助于保护用户的电池寿命。\n\n## 内容呈现\n\n以下章节概述了向移动用户提供内容的种不同方法：专用移动端（“mdot”）站点；单\
    \ URL 响应式站点；以及 RESS 站点（一种混合模式）。\n\n首先，我将解释它们是什么以及如何设置。然后，我将对这些方法进行比较，帮助你决定哪种能为你的网站实现最佳性能结果。\n\
    \n### 专用移动网站，或 mdot \n\n`mdot` 网站是专门为移动设备设计的网站独立版本。它的名称源于此类网站使用的典型 URL 方案，例如 m.example.com。\n\
    \nmdot 方法的主要优势是内容自适应。在向用户发送站点内容之前，服务器会检测请求的设备类型，并自动从桌面端重定向到 mdot 站点。不会向用户发送沉重的桌面特定内容（如大图）。内容是专门为移动设备进行组织和呈现的。\n\
    \n然而，通过包含重定向，你增加了一个需要处理的额外 DNS 查询，这可能会增加整体页面加载时间。此外，由于是一个独立的网站，维护、设计和保持两个版本同步的精力也需要被考虑和规划。\n\
    \n如果你决定使用 mdot 站点，请确保在页面的 `head` 中正确添加代码，帮助像 Google 这样的搜索引擎理解向访问者发送哪个版本的站点。对于桌面版本，在\
    \ `head` 中放入此内容：\n\n```\n<link rel=\"alternate\" media=\"only screen and (max-width:\
    \ 640px)\"\n    href=\"http://m.example.com/hello\">\n```\n\n对于对应的移动站点，在 `head`\
    \ 中放入此内容：\n\n```\n<link rel=\"canonical\" href=\"http://www.example.com/hello\"\
    >\n```\n\n### 重定向\n\n在用户重定向到网站的移动版本之前，你需要正确检测他们的设备。重定向是 mdot 网站流程的一部分，用户只需要知道你网站的主（非\
    \ mdot）URL。一旦输入浏览器，服务器将根据其设备将用户引导至相应的站点。考虑 URL 命名规范至关重要。通过拥有清晰、结构化的 URL 层级结构，你将更容易在相应的网站之间进行映射映射——例如，example.com/section1\
    \ 可以对应 m.example.com/section1 或 example.com/m/section1。\n\n### 提示：跳过重定向\n\n避免用户在通过移动端访问网站时反复经历重定向。你可以通过鼓励用户将移动版本书签（无论是作为普通书签，还是将其添加到主屏幕）来缓解重定向延迟。\n\
    \n在讨论重定向技术之前，让我们来看一些使用 mdot 方法的网站真实示例，以及由于重定向导致的延迟。我通过 WPT 拍摄了移动设备上 LinkedIn（图\
    \ 11.1）和 Facebook（图 11.1）的瀑布图截图，并使用 WPT 移动设备测试了桌面 URL：\n\n![移动端的 LinkedIn，从 linkedin.com\
    \ 重定向到 touch.www.linkedin.com，仅重定向就浪费了 1.3 秒](img/11-redirect-linkedin.png)\n\n\
    图 11.1. [LinkedIn](http://www.webpagetest.org/result/141102_GK_F1K/) 在移动设备上，从\
    \ linkedin.com 重定向到 touch.www.linkedin.com，仅重定向就浪费了 1.3 秒\n\n![移动端的 Facebook，从\
    \ facebook.com 重定向到 m.facebook.com，仅两次重定向花费了约 3.6 秒](img/11-redirect-facebook.png)\n\
    \n图 11.2. [Facebook](http://www.webpagetest.org/result/141102_RS_F2Y/) 在移动设备上，从\
    \ facebook.com 重定向到 m.facebook.com，仅两次重定向花费了约 3.6 秒\n\n对于 Facebook 示例，用户在到达 mdot\
    \ 站点之前需要跳过两个重定向关卡：\n\n1. 第一次 1.1 秒的重定向是从 http:// 重定向到 https://\n2. 然后需要大约 2.5\
    \ 秒重定向到 m.facebook.com\n3. 只有在约 3.6 秒后，用户才能到达预期目的地。\n\n### 重定向方法\n\n引导用户进入合适位置有三种主要方法：\n\
    \n*   **服务器端重定向：**可以通过简单的服务器重写规则实现。你可以告诉 Apache、Nginx、IIS 或其他 Web 服务器如何根据用户代理重定向用户。此外，还可以利用\
    \ PHP 等服务器端语言根据用户代理来处理重定向。\n\n"
- fmt: "\n*   **ESI redirects:** running off the CDN network, ESI redirects are very\
    \ useful and can be set up based on user agent strings. All of this is done at\
    \ the edge; users will never get content they are not supposed to receive. Additionally,\
    \ when processing ESI, there is no need to go back to the origin for processing,\
    \ and thus the load at the origin is cut down.\n*   **Client-side redirects:**\
    \ the redirect is done via client-side scripting, such as JavaScript. The entire\
    \ page is sent to the user before any validation, selection or detection has been\
    \ executed.\n\nSo, which of these methods should you choose?\n\nNormally, server-side\
    \ redirects are faster than client-side redirects, so if it's choice between these\
    \ two, I would suggest focusing on a server-side solution. However, if you use\
    \ a CDN and ESI is supported, I'd consider this to be the preferred option, because\
    \ the ESI redirect offers an additional advantage over regular server-side redirects:\
    \ it occurs at the edge, and is faster than putting the redirect logic at the\
    \ origin.\n\nClient-side redirects are the least-preferred solution in my opinion,\
    \ because anything that the client has to figure out, such as JavaScript execution,\
    \ affects the performance, battery power and CPU consumption of the device.\n\n\
    No matter what redirect method you choose, remember not to limit users to only\
    \ viewing the mobile version of the site. Always give them the option to override\
    \ the redirect policy and view the full site, because people don't like to be\
    \ forced into things!\n\n### Responsive Websites\n\nBesides offering a dedicated\
    \ mdot site, there's another, quite different approach to optimizing your site\
    \ for mobile devices. Google's [mobile best practices](https://developers.google.com/webmasters/smartphone-sites/)\
    \ suggest that web developers should create responsive websites. `Responsive web\
    \ design` (RWD), coined by Ethan Marcotte in 2010, centers on the idea of serving\
    \ the one same HTML page to all devices. There's only one version of the site,\
    \ but it's *styled* differently for different devices. RWD relies on CSS3 media\
    \ queries, fluid grids, and flexible images. A media query serves up specially\
    \ targeted styles when the browser window is below (or above) a certain defined\
    \ width. The transition points specified by the media queries are known as `breakpoints**.\n\
    \nIn order for a website to transition as described, the layout must be flexible.\
    \ Fluid grids are designed by using variable measurements, such as percentages,\
    \ instead of pixels, so the elements inside the grid container can adjust according\
    \ to the parent container's size. Images are also sized in relative units to keep\
    \ them flexible and always contained within their parent element.\n\nHere are\
    \ some examples of how to use media queries. You can either use the `media` attribute\
    \ within a `link` element, or `@media` in the style sheet itself.\n\n*   External\
    \ style sheets loaded via a media query: in the example below, `mobile.css` will\
    \ be used on any device with a width below 321px; `portrait.css` will be used\
    \ instead on any device in portrait mode; and `print.css` will be used when the\
    \ page is being printed:\n\n```\n<link rel=\"stylesheet\" media=\"(max-width:\
    \ 320px)\" href=\n\"mobile.css\">\n<link rel=\"stylesheet\" media=\"(orientation:\
    \ portrait)\" href=\n\"portrait.css\">\n<link rel=\"stylesheet\" media=\"print\"\
    \ href=\"print.css\">\n```\n\n#### Warning: Possible Performance Cost\n\nThis\
    \ technique comes with a performance cost. Most browsers will [download all](http://scottjehl.github.io/CSS-Download-Tests/)\
    \ CSS files even if the media query returns false, as shown in [Figure 11.3](#ch11.html_ch11-mediaquery-css\
    \ \"Figure 11.3. All three CSS files are being downloaded by the browser, no matter\
    \ what media the user actually matches with\"):\n\n![All three CSS files are being\
    \ downloaded by the browser, no matter what media the user actually matches with](OEBPS/figures/11-mediaquery-css.png)\n\
    \nFigure 11.3. All three CSS files are being downloaded by the browser, no matter\
    \ what media the user actually matches with\n\nInstead of wasting these additional\
    \ HTTP requests, put the styles into one CSS file, as seen below. If you still\
    \ want to have structure and separation in your style sheets, keep separate files\
    \ during development, but then concatenate into one at deployment to save additional\
    \ HTTP requests.\n\n*   Here's as example of the same `@media` directives as above,\
    \ this time included within the style sheet itself:\n\n```\n@media (max-device-width:\
    \ 320px) {\n  /* mobile styles */\n}\n@media (orientation: portrait) {\n     \
    \ /* portrait styles */\n}\n@media print {\n    /* print styles */\n}\n```\n\n\
    [Research by Guy Podjarny](http://www.guypo.com/real-world-rwd-performance-take-2/)\
    \ shows that most responsive websites don’t yet focus on web performance: 72%\
    \ of the sites using responsive design don’t optimize for mobile. While being\
    \ viewed on small-screen devices, those pages have the same page weight as the\
    \ ones being viewed on a large-screen device. Try to avoid sacrificing performance\
    \ over convenience, because performance remains key for mobile websites.\n\nIn\
    \ general, it might seem easier to optimize a mobile website for performance than\
    \ a RWD website. Let's compare the advantages and disadvantages of responsive\
    \ web design.\n\n#### RWD Advantages\n\nAdvantages of RWD over dedicated mdot\
    \ sites include:\n\n*   **Cross-platform sharing**: have you ever gotten a link\
    \ shared by a friend, and when you open it on your laptop, it opens up the mobile\
    \ version? With RWD, you only share one URL, and don't have to worry what version\
    \ will be shown to the user.\n*   **Search engine optimization (SEO)**: Google\
    \ [indicates](https://developers.google.com/webmasters/mobile-sites/mobile-seo/overview/select-config)\
    \ that responsive web design is its “recommended design pattern.” A responsive\
    \ website only has one URL with (normally) the same content for all devices. Thus,\
    \ Google will have an easier job crawling and indexing your content.\n*   **Fewer\
    \ codebases to maintain**: consolidated work into one web property comes with\
    \ some maintenance advantages, one codebase serving all device properties.\n\n\
    #### RWD Disadvantages\n\nResponsive websites can be less efficient that mdot\
    \ sites, as they sometimes serve content to mobile devices that's not needed:\n\
    \nDownload and `display: none`\n\nFor smaller devices, not all the content should\
    \ be shown. Consequently, content needs to be removed or, as is the case of most\
    \ RWD sites, just not displayed. However, not displaying something doesn't mean\
    \ it's not served to the client. As we learned in [Chapter 5](#ch05.html \"Chapter\
    \ 5Mastering Lean HTTP Requests\"), anything on the critical rendering path with\
    \ `display: none` will still be loaded into the rendering tree. You are basically\
    \ only hiding assets visually while still asking the browser to download them―which\
    \ isn't cool!\n\nDuplication of DOM Elements\n\nWhen developing a RWD site, a\
    \ lot of logic is put into the code to handle and shuffle around boxes and containers,\
    \ which results in the DOM inevitably getting bigger and more complex. The more\
    \ code, the bigger the download, and the more work for the browser to construct\
    \ the page on screen.\n\nDownload and Resize\n\nRemember how we discussed that\
    \ we should serve the appropriate image size to users? Well, this becomes a challenge\
    \ for RWD. You want to show a nice image for a small screen, but you don't want\
    \ to give up the quality and size for it to be shown on a bigger screen. What\
    \ do you do? Sacrifice size for beauty and load the bigger image, but scale it\
    \ down for the small screen? Considering that images are one of the big performance\
    \ challenges, we shouldn't be doing this at all.\n"
