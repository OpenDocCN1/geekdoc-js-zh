  trans: "\n\n感觉这里效率很低，不是吗？这浪费了带宽。因此，Google 的聪明人们想出了一种解决方案，通过引入[规范化 JavaScript 库](https://developers.google.com/speed/pagespeed/module/filter-canonicalize-js)\
    \ 过滤器来减少这种低效率。其核心思想是将本地托管的 JavaScript 库（例如 `jQuery`）替换为托管在 Google CDN 上的等效库——这意味着用户在浏览时，可以使用之前已从\
    \ Google CDN 获取（并因此已缓存在浏览器中）的 `jQuery` 副本。\n\n按照以下方式启用该过滤器（针对 Apache）：\n\n```\n\
    ModPagespeedEnableFilters canonicalize_javascript_libraries\n```\n\n以下是该模块替换本地\
    \ `jQuery` 文件的示例：\n\n```html\n<html\n  <head>\n    <script src=\"/local/jquery-1.8.3.js\"\
    >\n    </script>\n    <script src=\"foo.js\">\n    </script>\n    <script src=\"\
    bar.js\">\n    </script>\n  </head>\n  <body\n  <!-- fun stuff -->\n  </body>\n\
    </html>\n```\n\n将被重写为：\n\n```html\n<html\n  <head>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.8.3/\n\
    jquery.min.js\">\n    </script>\n    <script src=\"foo.js\">\n    </script>\n\
    \    <script src=\"bar.js\">\n    </script>\n  </head>\n  <body\n  <!-- fun stuff\
    \ -->\n  </body>\n</html>\n```\n\n### 警告：注意潜在的单点故障 (SPOF)\n\n在使用 `canonicalize_javascript_libraries`\
    \ 过滤器时，请注意同步脚本阻塞。该过滤器会将您的本地版本替换为第三方脚本版本。如果您没有异步包含该脚本，而第三方提供商意外宕机，可能会导致单点故障（SPOF）。\n\
    \n### 合并 CSS\n\n[合并 CSS](https://developers.google.com/speed/pagespeed/module/filter-css-combine)\
    \ 过滤器会查找页面上所有的 CSS `link` 标签。该模块会移除所有单独的 CSS 标签，并将 CSS 文件合并为一个合并文件，将其放置在原始第一个\
    \ CSS `link` 所在的位置。这与我们之前看到的合并技术类似。\n\n您可以通过以下方式通过 Apache Web 服务器启用它：\n\n```\n\
    ModPagespeedEnableFilters combine_css\n```\n\n例如，假设原始 HTML 如下：\n\n```html\n<html\n\
    \  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"styles/1.css\"\
    >\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"styles/2.css\">\n   \
    \ <link rel=\"stylesheet\" type=\"text/css\" href=\"styles/3.css\">\n  </head>\n\
    \  <body\n    <!-- fun stuff -->\n  </body>\n</html> \n```\n\n合并 CSS 将其转变为类似内容：\n\
    \n```html\n<html\n  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    styles/1.css+2.css+\n3.css.pagespeed.cc.yu2He3_gBx.css\">\n  </head>\n  <body\n\
    \    <!-- fun stuff -->\n  </body>\n</html> \n```\n\n### 推迟 JavaScript\n\n[推迟\
    \ JavaScript](https://developers.google.com/speed/pagespeed/module/filter-js-defer)\
    \ 过滤器遵循我们在第 6 章 中讨论的 `defer` 属性逻辑。`defer` 属性会将脚本的执行延迟到 DOM 完成之后。带有该属性的脚本会被添加到脚本列表的末尾。为了确保脚本可以在页面加载结束时安全执行，该属性应仅用于不修改\
    \ DOM 的脚本。性能优势在于停止脚本阻塞浏览器中的其他进程。\n\n推迟 JavaScript 过滤器会自动为页面上的任何 `script` 标签添加\
    \ `src` 属性。HTML 中会添加一个 `window.onload` 处理程序，随后执行所有推迟的脚本。\n\n在您的 Web 服务器配置文件包含此行（针对\
    \ Apache）：\n\n```\nModPagespeedEnableFilters defer_javascript\n```\n\n如果您不希望为脚本添加\
    \ `defer` 属性（例如，因为脚本会修改 DOM），只需添加 `pagespeed_no_defer` 属性即可：\n\n```html\n<script\
    \ pagespeed_no_defer=\"\" src=\"execute.js\"></script>\n```\n\n为了演示这一点，最好在浏览器中实际查看。请查看[之前](http://www.modpagespeed.com/defer_javascript.html?ModPagespeed=off)和[之后](http://www.modpagespeed.com/defer_javascript.html?ModPagespeed=on&ModPagespeedFilters=defer_javascript)的页面以查看此过滤器的影响。\n\
    \n### 优先处理关键 CSS\n\n[优先处理关键 CSS](https://developers.google.com/speed/pagespeed/module/filter-prioritize-critical-css)\
    \ 过滤器会解析 CSS 文件并将其替换为仅在该页面使用的规则。这符合关键渲染路径范式，即尽快提供 ATF（屏折线以上）CSS 以提高初始渲染时间。\n\n\
    在您的 Web 服务器配置文件中包含以下行：\n\n```\nModPagespeedEnableFilters prioritize_critical_css\n\
    ```\n\n以下页面包含一个外部 `style.css` 文件，其中页面仅引用了 `class=\"red\"`：\n\n```html\n<html\n\
    \  <head>\n    <link rel=\"stylesheet\" href=\"style.css\">\n\n    <!-- style.css\
    \ 的内容\n          .red {color: red;}\n          .big { font-size: 8em; }\n    \
    \      .gallery {border:1p solid black; }\n    -->\n  </head>\n  <body\n    <div\
    \ class=\"red\">\n      Hello readers!\n    </div>\n  </body>\n</html>\n```\n\n\
    过滤器的输出将如下，仅关注此页面上真正使用的样式：\n\n```html\n<html\n  <head>\n    <style>\n      .red{red;}\n\
    \    </style>\n    </head>\n  <body\n    <div class=\"red\">\n      Hello readers!\n\
    \    </div>\n  </body>\n</html>\n<noscript><link rel=\"stylesheet\" href=\"style.css\"\
    ></noscript>\n```\n\n"
- fmt: "\nWhen `HTTP/1.1` was introduced a decade ago, latency wasn't something that\
    \ was worried about. However, times, technologies, and user expectations have\
    \ changed. `HTTP/1.1` is not enough to cope with today's challenges. Today's user\
    \ demands speedy and instant delivery of content, across different devices, and\
    \ in different locations, causing higher delays and requiring better handling\
    \ of HTTP requests. These performance issues have finally been addressed with\
    \ `HTTP/2`.\n\nIn `HTTP/1.1`, only the client can initiate a request. Even if\
    \ the server knows the client needs a resource, it has no mechanism to inform\
    \ the client and must instead wait to receive a request for the resource from\
    \ the client. `HTTP/2.0` promises to make HTTP requests more [efficient](https://www.mnot.net/blog/2014/01/30/http2_expectations),\
    \ reducing the need for workaround techniques to minimize HTTP requests, and thus\
    \ reducing latency.\n\nOne of the main advantages of `HTTP/2` over `HTTP/1.1`\
    \ is that it allows many concurrent HTTP requests to run across one single TCP\
    \ connection. Without a persistent connection (using `keep-alive`), the handshake,\
    \ as discussed in chapter 3, is enforced by `HTTP/1.1`, causing latency and delays.\
    \ While the idea of `keep-alive` is to keep the TCP connection open, `HTTP/2`\
    \ delivers even more improvements. It comes with default HTTP header compression,\
    \ as opposed to `HTTP/1.1`, which uses optional compression. In addition, with\
    \ `HTTP/2`, the server can proactively send the client the resource it will need,\
    \ known as **server push**.\n\nAlthough `HTTP/2` is a significant improvement,\
    \ be aware that using `HTTP/2` in the near future will still require you to do\
    \ your homework. This protocol won't magically remove render blocking and synchronous\
    \ third-party scripts, or minify scripts for you. These techniques will still\
    \ have to be employed to make this new protocol shine.\n\nHowever, with `HTTP/2`,\
    \ many small assets can be multiplexed in parallel, and techniques such as resource\
    \ bundling—image spriting and concatenation—[aren't necessary anymore](http://chimera.labs.oreilly.com/books/1230000000545/ch13.html#_removing_1_x_optimizations)\
    \ to improve performance.\n\n### Note: What About SPDY?\n\n[SPDY](http://www.chromium.org/spdy/spdy-whitepaper)\
    \ (pronounced SPeeDY) was introduced prior to `HTTP/2`, and was a big motivation\
    \ for most of the features for `HTTP/2`—and is therefore often considered to be\
    \ its predecessor. In February 2015, SPDY's inventor, Google, [officially said\
    \ goodbye to SPDY](http://blog.chromium.org/2015/02/hello-http2-goodbye-spdy-http-is_9.html)\
    \ and welcomed `HTTP/2` into the world.\n\n## Gzip Compression\n\n`Gzip` is a\
    \ very efficient compression program that can easily be enabled on your server\
    \ to shave off some milliseconds from your page load time. Your server will use\
    \ `zip` to compress files before sending them to your users. I highly recommend\
    \ you enable `Gzip` compression on your server, as it's a very quick and easy\
    \ performance win.\n\n### Warning: When to Use Gzip\n\n`Gzip` makes most sense\
    \ for uncompressed, text-based formats such as `HTML`, `XML`, `JSON` and `CSS`\
    \ files. Content types that have already been compressed (PDF and images), should\
    \ not be gzipped, as their file size could actually be [increased](https://developer.yahoo.com/performance/rules.html#gzip).\n\
    \nBut how do you know that `Gzip` is enabled? You can either open the developer\
    \ tools of your browser and check the response headers, as shown in [Figure 9.3](#ch09.html_ch9-gzip-header\
    \ \"Figure 9.3. Checking the main HTML page response headers in Firefox's developer\
    \ tools\"), or use tools such as the [HTTP compression test](http://checkgzipcompression.com),\
    \ as shown in [Figure 9.4](#ch09.html_ch9-gzip-test \"Figure 9.4. Using HTTP compression\
    \ test to check Gzip compression status\"):\n\n![Checking the main HTML page response\
    \ headers in Firefox's developer tools](OEBPS/figures/9-gzip-header.png)\n\nFigure\
    \ 9.3. Checking the main HTML page response headers in Firefox's developer tools\n\
    \n![Using HTTP compression test to check Gzip compression status](OEBPS/figures/9-gzip-test.png)\n\
    \nFigure 9.4. Using HTTP compression test to check Gzip compression status\n\n\
    All modern browsers support `Gzip` compression, so we just need to make sure that\
    \ it's enabled in the web server configuration file. Some web servers already\
    \ have `Gzip` enabled. `HTML5` Boilerplate gives [detailed instructions](https://github.com/h5bp/server-configs)\
    \ on how to enable `Gzip` for most common web servers.\n\nIf you don't own your\
    \ web server, you can enable `Gzip` via the `.htaccess` file for Apache servers,\
    \ or other equivalent files for different web servers (such as `web.config` for\
    \ IIS).\n\nLet's look at how to enable it on Apache:\n\n```\n<ifModule mod_gzip.c>\n\
    \    mod_gzip_on Yes\n    mod_gzip_dechunk Yes\n    mod_gzip_item_include file\
    \ .(html?|txt|css|js|php|pl)$\n    mod_gzip_item_include handler ^cgi-script$\n\
    \    mod_gzip_item_include mime ^application/x-javascript.*\n    mod_gzip_item_exclude\
    \ mime ^image/.*\n    mod_gzip_item_exclude rspheader ^Content-Encoding:.*gzip.*\n\
    </ifModule>\n```\n\nIf you want to compare the performance of your site gzipped\
    \ and not gzipped, you can set the following line in your Apache `.htaccess` file\
    \ to disable Gzip:\n\n```\nSetEnv gzip 1\n```\n\n[Figure 9.5](#ch09.html_ch9-gzip-bbinto\
    \ \"Figure 9.5. WPT comparison of bbinto.me without and with Gzip enabled\") shows\
    \ WPT results for my website, with and without Gzip enabled:\n\n![WPT comparison\
    \ of bbinto.me without and with Gzip enabled](OEBPS/figures/9-gzip-bbinto.png)\n\
    \nFigure 9.5. [WPT comparison](http://www.webpagetest.org/video/compare.php?tests=141011_G7_JD1,141011_7E_K5J)\
    \ of bbinto.me without and with Gzip enabled\n\nYou can see a clear difference\
    \ in performance between the gzipped and non-gzipped versions. My gzipped site\
    \ loaded almost one second faster. My speed index improved from 3140 to 2100,\
    \ and my start to render time improved from 3.05s to 1.94s. Gzip can be a simple\
    \ and quick performance win.\n\n## Caching\n\nWe briefly talked about caching\
    \ in [Chapter 5](#ch05.html \"Chapter 5Mastering Lean HTTP Requests\"), but let's\
    \ dig deeper into this topic, as caching can be a real performance enhancer.\n\
    \nBefore going into more detail on how caching can improve performance, let's\
    \ first take a look at how we can get more information about assets and their\
    \ current caching policy.\n\nIn [Figure 9.6](#ch09.html_ch9-google-cache \"Figure\
    \ 9.6. Using developer tools to assess caching on google.ca\"), you can see that\
    \ when I visit google.ca, some of the images my browser is fetching come from\
    \ the browser cache for Google's search landing page. That's not a surprise, because\
    \ I use Google several time throughout the day:\n\n![Using developer tools to\
    \ assess caching on google.ca](OEBPS/figures/9-cache-network-google.png)\n\nFigure\
    \ 9.6. Using developer tools to assess caching on google.ca\n\nLooking closer,\
    \ you can see that `nav_logo195.png` is a sprite image, as shown in [Figure 9.7](#ch09.html_ch9-cache-sprite\
    \ \"Figure 9.7. A sprite image on google.ca\"). It makes sense for Google to set\
    \ a very long cache time for this particular image, as the logo shouldn’t change\
    \ that often:\n\n![A sprite image on google.ca](OEBPS/figures/9-cache-sprite-google.png)\n\
    \nFigure 9.7. A sprite image on google.ca\n\nNow, let's move on to discuss how\
    \ we can improve performance through caching. The basic idea is to avoid as many\
    \ unnecessary HTTP requests as possible, by storing certain assets in the browser\
    \ that can be reused. Every browser includes a cache, but needs to get instructions\
    \ on how and when to use it. You can set that logic, such as when to request a\
    \ newer, or fresher version of an asset, and when not to use the version in the\
    \ cache, by using the `Cache-Control` header.\n"
