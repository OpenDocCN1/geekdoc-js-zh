    unit in a wireframe. Its main purpose is to help non-technical members of the
    design and content team understand each module''s performance impact to the overall
    website.


    This might not be the most scientific translation of perceived performance, but
    it''s useful for getting everybody on the same page during the early wireframing
    and design stages of a project:


    | Module | Points | Description |


    | --- | --- | --- |


    | Low impact | 1 | Small images, mostly static content and simple graphics, interaction
    elements like buttons and text fields. |


    | Medium impact | 2 | Medium-sized images and simple scripts. |


    | High impact | 6 | Large images and third-party scripts loading either heavy
    JavaScript or both JavaScript and images (such as adverts). |


    Sit down with your design team, take a pencil, and start marking MPMs in the wireframe.
    Based on the table above, try to identify what modules on the wireframe represent
    low, medium or high performance impacts. This will be useful for the designer
    who creates a design from these wireframes, but also for the developer who must
    plan out the critical rendering path. (The critical rendering path—which we''ll
    discuss in much more detail in Chapter 5—describes the code and resources required
    to render the initial view of a page.)


    The end goal of this exercise is to have the entire team focused on getting the
    content to load and display as efficiently as possible.


    Let''s try this out on a real-world website.


    ### Case Study: Time Magazine Website


    The following case study is used to show you how you can improve the wireframing
    process by applying MPMs to the site.


    Let''s take a look at the Time Magazine website:


    ![The Time Magazine website loading](OEBPS/figures/2-time.png)


    Figure 2.1. The Time Magazine website loading


    We can see, in the “filmstrip” in [Figure 2.5](#ch02.html_ch2-mpm-wireframe "Figure 2.5. The
    Time.com website sketched out in wireframe") above, that the main story image
    only appears after around six seconds. There is no visible content prior to that.
    I''ve broken this down further into simple wireframes to illustrate how the site,
    above the fold, looks at various points in time as the site is being loaded.


    Let''s have a closer look at the current order:


    ![After 3 seconds, we only see the menu and the magazine image](OEBPS/figures/2-wf-time-3s.png)


    Figure 2.2. After 3 seconds, we only see the menu and the magazine image


    ![After 5.7 seconds, other important pieces are being loaded](OEBPS/figures/2-wf-time-57s.png)


    Figure 2.3. After 5.7 seconds, other important pieces are being loaded


    ![After 7.5 seconds, most of the visible content above the fold has been loaded](OEBPS/figures/2-wf-time-75s.png)


    Figure 2.4. *After 7.5 seconds, most of the visible content above the fold has
    been loaded*


    There is room for improvement, especially if our goal is to show the top story
    element as soon as possible.


    #### Current Performant Order Based on MDMs


    Let''s see how we can apply the point and order system to the wireframe.'
