    \ optimization. | Over [100](http://www.imagemagick.org/script/formats.php) |\n\
    \n| [ImageOptim](https://imageoptim.com) | Stand-alone app or CLI for lossless\
    \ optimization and removing unnecessary color profiles and other metadata. | PNG,\
    \ GIF, JPEG |\n\n| [Scour](http://codedread.com/scour/) | CLI for cleaning and\
    \ optimizing SVGs. | SVG |\n\nWhile online tools and browser extensions are useful\
    \ for occasional optimization tasks, the command line tools can be used for batch\
    \ processing and automation during deployment. (See Chapter 8 for more on automation).\n\
    \n### Data URIs\n\nData URIs provide another interesting option for including\
    \ images on your page. What looks like an image to you just looks like a long\
    \ string of letters and numbers to a computer. That long string is called a **data\
    \ URI**.\n\nA data URI is a [Base64](http://en.wikipedia.org/wiki/Base64) string.\
    \ (Base 64 is an encoding scheme that represents binary data in an ASCII string\
    \ format.) Once you've converted your image to a data URI, you can insert that\
    \ string straight into your HTML or CSS—thus saving your browser one HTTP request,\
    \ which normally also means improving your site's performance.\n\nLet's use a\
    \ leaf.png example image to show how to convert it to a data URI. There are lots\
    \ of tools for performing the conversion. I used [DATAURL.NET](http://dataurl.net/#dataurlmaker),\
    \ as shown in [Figure 7.3](#ch07.html_ch7-leaf-uri \"Figure 7.3. Converting a\
    \ PNG image to a data URI\"):\n\n![Converting a PNG image to a data URI](OEBPS/figures/7-leaf-png-to-uri.png)\n\
    \nFigure 7.3. Converting a PNG image to a data URI\n\nHere's a trimmed version\
    \ of the output:\n\n```\ndata:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAXCAYAAAALHW+jAA\n\
    ”AABGdBTUEAALGPC/\n         xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3Ccu\n\
    \              ....\n          +7Qwdz8SrsdYz2s7ee7rLc2M4qVcD23mRbJpOB3+fDnr17bT+bgBNTHS+y\n\
    ”oNqFcVw2CzPT0/rQN+/erQ0VRpu9bs3+BwJLmvcQyqFgAAAAAElFTkSuQmCC\n```\n\nYou can\
    \ either put this code inside a style sheet or in an image tag in your HTML.\n\
    \n1.  Data URI via `the <img>` tag:\n\n    ```\n    <img src=\"data URI output\"\
    \ />\n    ```\n\n2.  Via external or inline CSS:\n\n    ```\n    .mydatauri {\n\
    \        background:url(data URI output)\n    }\n    ```\n\nYou can either use\
    \ online tools to create data URIs as shown above, or use CLI tools. For example,\
    \ you could use [CSSEmbed](https://github.com/nzakas/cssembed/downloads/) via\
    \ the Java CLI runtime. This tool looks through your CSS file and converts all\
    \ images to base64 encoded strings within your CSS. For example, consider this\
    \ CSS:\n\n```\n/* style.css */\nbackground: url('leaf.png');\n```\n\nBy running\
    \ the jar file, leaf.png will be converted to a data URI image.\n\n```\njava -jar\
    \ cssembed.jar -o style_optimized.css styles.css\n```\n\nThe new styleheet is\
    \ outputted as follows (trimmed):\n\n```\n/* style_optimized.css\nbackground:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAA↵\n\
    XCAYAAAALH\n+jAAAABGdBTUEAALGPCxhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA\n\
    ...)\n```\n\nIt's worth noting that base64 encoding makes file sizes roughly [33%\
    \ larger](http://davidbcalhoun.com/2011/when-to-base64-encode-images-and-when-not-to/)\
    \ than their original binary representations. Therefore, it's better to use the\
    \ data URI format on smaller images rather than on larger ones, as it could worsen\
    \ the performance of your page. And of course, optimize your image as much as\
    \ possible *before* converting it to a data URI."
