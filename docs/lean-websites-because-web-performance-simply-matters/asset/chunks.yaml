  trans: "\n\n这种方法的想法是异步包含脚本，将其从关键渲染路径中移除，从而防止它阻塞渲染——例如，当宿主机响应缓慢，甚至完全宕机时。浏览器会在后台下载脚本，一旦下载完成，将使用普通的\
    \ JavaScript 线程执行它：\n\n```\n1\\. <script>\n2\\.  (function(d,s,id){\n3\\.    \
    \  var js, 3js = d.getElementsByTagName(s)[0];\n4\\.      if (d.getElementById(id))\
    \ {return;}\n5\\.      js = d.createElement(s); js.id = id;\n6\\.      js.src\
    \ = \"http://example.com.com/3rdparty-script.js\";\n7\\.      3js.parentNode.insertBefore(js,\
    \ 3js);\n8\\.  }(document, 'script', '3rd-js'));\n</script>\n```\n\n让我们逐行此脚本看看它是如何工作的：\n\
    \n*   **第 2 行和第 8 行**：这是一个立即自执行函数。我们希望确保任何临时变量都留在局部作用范围内，而不会渗透到宿主页面的全局命名空间中。我们将\
    \ `d`、`s` 和 `id` 作为参数传递，因为这比在函数体内定义它们要短。\n*   **第 3 行**：这一行声明了一个变量并在页面上找到第一个可\
    \ `<script>` 元素。这是在页面上包含脚本的最简单钩，而不是随机追加。\n*   **第 4 行**：这一行检查脚本是否已在页面上，如果是，则直接退出，因为没有更多需要做的，由于我们只需要该文件一次。它防止了脚本文件被包含多次。\n\
    *   **第 5 行**：这一行创建一个脚本元素并为其分配一个 `id`，以便我们以后可以检查它，并确保它不会被错误地添加两次。\n*   **第 6 行**：在这里你将\
    \ `script` 元素的 `src` 属性指向你的第三方脚本。\n*   **第 7 行**：最后，我们将新创建的 `script` 元素添加到宿主页面的\
    \ DOM 中，就完成了。\n\n不过，这种方法也有一些缺点：\n\n*   脚本仍然会在 `window.onload` 上阻塞。\n*   它还会阻塞\
    \ CSSOM（CSS 对象模型），除非我们将它放在 CSS 加载之前。\n\n那么，是否有更好的方法我们可以可以使用呢？是的，有的！\n\n### 更新的、改进的方法\n\
    \n幸运的是，越来越多的浏览器厂商已经意识到了同步加载脚本并阻塞渲染的问题，因此 [W3C](http://www.w3.org/TR/html5/scripting-1.html)\
    \ 为 `<script>` 标签推荐了两个新属性。没有这些属性，浏览器会立即运行脚本。\n\n*   `async`：当使用此属性时，浏览器会在脚本可用时加载它，且不会阻塞\
    \ DOM 或 CSSOM。它具有无序执行特性，这意味着它可以放置在页面的任何位置。这可以用于那些容忍执行顺序错乱（out-of-order execution）的脚本。\n\
    *   `defer`：当使用此属性时，浏览器将在页面完成解析后运行脚本。\n\n有了这些新属性，我们可以解决动态标签无法解决以下问题：\n\n*   `async`\
    \ 属性不会阻塞 CSSOM。\n*   预加载扫描器（preload scanner）只能在 `src` 和 `href` 上运行，因此无法预加载任何定义为内联脚本的脚本。由于动态脚本标签是以内联脚本的形式呈现的，扫描器无法预加载这部分。\n\
    \n由于这些属性非常新，只有较新的浏览器支持它们，而旧浏览器将不知道它们的意思并直接忽略它们。如果你的目标受众使用 IE8 和 9，或者 Android 2.2\
    \ 或 2.3 设备，你可能需要在标签上添加 `defer` 以防万一，因为 `defer` 在 `async` 之前引入。正如 W3C 建议，[使用这两个属性的组合来覆盖更广泛的浏览器](https://www.igvita.com/2014/05/20/script-injected-async-scripts-considered-harmful/)。\n\
    \n### 抗 SPOF（单点故障）的工具\n\n让我们讨论一些工具和技术，通过收集页面上第三方脚本的信息及其包含方式，来识别潜在的 SPOF。\n\n*\
    \   **[SPOF-O-Matic](https://chrome.google.com/webstore/detail/spof-o-matic/plikhggfbplemddobondkeogomgoodeg)\
    \ 浏览器扩展**：WPT 的创建者 Pat Meenan 发布了 SPOF-O-Matic，这是一个实用的 Chrome 扩展。它可以检测特定页面的潜在\
    \ SPOF，并可以模拟它们。使用此工具模拟 SPOF 将揭示网站在出现 SPOF 时的渲染情况。它将帮助你检测是否将脚本放置在了关键渲染路径中，或者你的页面渲染是否不受第三方提供商代码的影响。\n\
    \n    安装 Chrome 扩展，浏览到你想要“SPOF 检查”的站点，并点击所示的 SPOF-O-Matic 按钮：\n\n    ![Chrome\
    \ 中 SPOF-O-Matic 扩展的截图](img/6-wpt-blackhole.png)\n\n    图 6.3. Chrome 中 SPOF-O-Matic\
    \ 扩展的截图\n\n    如图 6.3 所示，SPOF-O-Matic 提供了列出所有可能的 SPOF 脚本 (1)、通过浏览器模拟 SPOF (2)\
    \ 以及通过 WPT 创建 SPOF 对比视频 (3) 的选项。我决定“SPOF 检查”一下 wired.com，因为它依赖广告。页面一加载，扩展程序就指示可能存在三个导致\
    \ SPOF 的脚本。点击徽章会打开一个额外的窗口。它详细列出了所有脚本。你可以选择通过浏览器启用 SPOF 并立即刷新页面以查看影响，或者点击“Generate\
    \ SPOF Comparison Video”链接。\n\n    点击链接后，你将被重定向到 WPT，此时脚本已填充在位于高级设置下的 SPOF 文本框中。点击“Start\
    \ Test”时，WPT 将在有和没有 SPOF 模拟的情况下运行站点，并向你展示一个胶片轨道，如图 6.4 所示：\n\n    ![包含指向对比的链接的\
    \ SPOF 模拟的胶片](img/6-wpt-spof.png)\n\n    图 6.4. SPOF 模拟的胶片，包含指向对比的链接\n\n    如果你想记录胶片，点击“Create\
    \ Video”将测试结果报告为一个方便的视频，可以下载或嵌入以供日后参考。\n\n*   **通过 WPT 使用 SPOF 模拟器**：如果你不想使用浏览器扩展，可以使用\
    \ WPT 提供的 SPOF 功能来模拟 SPOF。WPT 在其高级设置中有一个 SPOF 标签，允许你模拟任何给定脚本的 SPOF。只需包含第三方脚本标签，WPT\
    \ 就会模拟当该提供商站点宕机时发生的情况：\n\n    ![WPT 以及包含第三方脚本以测试 SPOF 的 SPOF 标签的截图](img/6-spof-wpt.png)\n\
    \n    图 6.5. WPT 以及包含第三方脚本以测试 SPOF 的 SPOF 标签的截图\n\n*   **通过 hosts 文件中的黑洞（blackhole）**：除了使用\
    \ WPT，你也可以本地机器上模拟 SPOF。将第三方域名指向[黑洞](http://blog.patrickmeenan.com/2011/10/testing-for-frontend-spof.html)。黑洞的地址是\
    \ blackhole.webpagetest.org，相应的 IP 地址为 `72.66.115.13`。它是一个具有丢弃所有进入数据包防火墙规则的主机，因此模拟主机宕机。让我们尝试一下：\n\
    \n    *   更新 hosts 文件（请注意，你需要机器的管理员权限才能编辑这些文件）。\n\n        *   对于 Windows，文件位于\
    \ `C:\\Windows\\System32\\drivers\\etc\\hosts`。\n\n        *   在 Mac 上，你可以点击 Finder\
    \ 菜单中的“前往”->“前往文件夹”并粘贴 `/private/etc/hosts`，或者在在你偏好的命令行界面中输入 `vi /private/etc/hosts`。\n\
    \n"
