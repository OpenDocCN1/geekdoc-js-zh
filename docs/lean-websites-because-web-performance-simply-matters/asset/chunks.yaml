  trans: "\n\n所以到目前，我的观点如下：根据统计数据，如果速度和用户体验是我最关心的点，那么我不确定自己是否会选择 RWD（响应式网页设计）而不是独立的移动端站点（mdot）。但是，如果你没有预算开发一个独立的移动端站点，我可以推荐\
    \ RWD，但前提是遵循最佳实践。\n\n### 注意：响应式图像能救急吗？\n\n性能社区一直有一个运动旨在解决 RWD 站点比独立移动站点更重的问题。正如我们之前讨论过的，图像是导致网站臃肿的元凶。响应式图像旨在为\
    \ RWD 网站提供优化后的图像，移除小型设备不需要的臃肿图像。\n\n响应式图像的核心思想是浏览器将智能地显示图像，根据设备的能力从多个版本的图像中进行选择。从概念上讲，图像响应当前显示的设备，并相应地改变其尺寸和文件大小。\n\
    \n[响应式图像社区小组](http://responsiveimages.org/) 列出了几种向不同设备提供适当图像的方法。Guy Podjarny 的\
    \ [响应式与快速：实现高性能响应式设计](http://www.akamai.com/dl/akamai/responsive-and-fast-implementing-high-performance-responsive-design.pdf)\
    \ 也概述了使用响应式图像的最佳实践。\n\n好消息是，这是向正确设备提供正确尺寸图像迈出的一大步，并且在需要时只下载较小的图像。坏消息是，目前并非所有浏览器都支持响应式图像。\n\
    \nmdot 和 RWD 都有它们的性能优缺点。下一节介绍了一种结合了两种方法优点的混合方法。\n\n### RESS\n\nRESS 代表[带有服务器端组件的响应式网页设计](http://www.lukew.com/ff/entry.asp?1392)，并将响应式设计与服务器端组件相结合。它解决了\
    \ RWD 的许多问题，同时利用了 mdot 方法的优势。服务器端组件能够在向客户端发送内容之前卸载掉不需要的内容，而媒体查询仍被用于实现响应式布局。你可以采取两种\
    \ RESS 方法，详细信息见下文。\n\n#### 原始 RESS\n\nRESS 是我最喜欢的向不同设备提供内容的方法。它结合了这两者的长处，因为你可以为所有设备提供单一\
    \ URL，但可以创建如下的情境体验：\n\n* 服务器端组件负责任何沉重的工作或复杂的计算，例如 JavaScript 库、页面模板和其他功能。\n* 客户端组件负责任何与布局更相关的部分，例如更改和移动框——大部分是可以通过媒体查询轻松处理的内容。\n\
    \n例如，假设你有一个展示带文本和图像新闻的网站：移动端和桌面端版本应该交付相同的内容。假设桌面版本包含更大的头部和页脚，而移动端版本的头部和页脚更简单、更小，所以基本上只是设计不同但功能相同。桌面端的图像应该比移动端具有更高的分辨率。针对这种场景，一种可能的\
    \ RESS 方法如下：\n\n##### 服务器端组件\n\n在服务器上检测检测设备，并根据设备交付不同的图像。假设我们存储了一个名为 `s_photo1.jpg`\
    \ 的小尺寸图像，以及原始尺寸的 `photo1.jpg`。\n\n`<?=$device_prefix?>` 在服务器上根据设备确定，一旦页面在用户端加载，就会动态包含。以下代码使用\
    \ PHP 编写，显示了为 iPhone 应该提供什么前缀：\n\n```php\n<?php\n    $ua=$_SERVER['HTTP_USER_AGENT'];\n\
    \    $device_prefix = '';    \n    if(preg_match('/iphone/i',$ua)) {\n       \
    \ $device_prefix = 's_';\n    }\n?>\n```\n\n这以及你编写相应的 HTML 代码的方式：\n\n```html\n\
    <img src=\"<?=$device_prefix?>photo1.jpg\" alt=\"Example photo\"/>\n```\n\n#####\
    \ 客户端组件\n\n客户端组件可以通过媒体查询处理头部和页脚的样式。这些查询可以如下所示存储在 CSS 文件中（为了示例目的进行了简化）：\n\n```css\n\
    header {\n    height:100px;\n}\n\nfooter {\n    height:60px;\n}\n\n@media (max-device-width\
    \ : 560px) {\n    header {\n        height:50px;\n    }\n    footer {\n      \
    \  height:20px;\n    }       \n}\n```\n\n#### 带有 ESI 的 RESS\n\n如前所述，ESI 是处理设备检测和引导的强大工具，那么为什么不将\
    \ RESS 与 ESI 结合呢？\n\n通过 ESI，也可以为你的桌面端和移动站点提供单一 URL。根据用户连接你网站时使用的设备，你可以为整个页面创建一个内容和标记切换：\n\
    \n```html\n<!--esi\n<esi:choose>\n<esi:when test=\"$(HTTP_USER_AGENT) matches_i\
    \ $(mobile_ua)\">\n       <!-- Mobile head and body -->\n     </esi:when>\n  \
    \   <esi:otherwise>\n       <!-- Desktop head and body -->\n    </esi:otherwise>\n\
    </esi:choose>\n-->\n```\n\n上面的代码段演示了为移动设备提供完全不同的标记和内容有多简单。\n\n## 移动站点方法的比较\n\n\
    每种为移动设备优化内容的方法都有优缺点，在决定使用哪种时需要考虑多个因素。我的预算是多少？我有多少资源来支持网站的未来？在不同设备和语境下差异化提供网站内容有多重要？\n\
    \n让我们列出每种技术并描述它们的优缺点：\n\n| | 优点 | 缺点 | 注意事项\n| --- | --- | --- | --- |\n| mdot\
    \ | 关注性能、内容适配、仅交付所需内容。 | 多 URL（不利分享）、需要设备检测库、可能复杂的重定向逻辑、内容分叉、带有额外加载时间的重定向。 | 持续更新设备过滤器。\
    \ |\n| RWD | 所有内容共一个 URL、无重定向、易分享、Google 推荐、对 SEO 更好、不需要设备库。 | 涉及细致规划、交付了不需要的内容、可能损害性能。\
    \ | 具有重复 DOM 元素等的臃肿网站。 |\n| RESS (带有 ESI) | 如果需要，所有内容共一个 URL、无重定向、易分享。 | 需要设备检测或功能检测。带有\
    \ ESI 的 RESS：无需返回源处理，因此减少了源站负载。 | 持续更新设备过滤器。 |\n\n我的建议是在可以使用支持 ESI 的 CDN 时使用带有\
    \ ESI 的 RESS。这种方法提供了最大的灵活性，并最能根据特定平台或设备决定服务。\n\n## 总结\n\n* 各种技术（如离线存储）对于提高感知性能和延迟非常有用。\n\
    * User Agent HTTP 头可以管理和检测设备。\n* 有三种主要方案——mdot、RWD 和 RESS 可以高效向移动设备提供内容。与性能一样，你的选择取决于你的需求和资源。\n\
    * 如果选择 RWD，不要仅仅让网站具有响应式。还要关注性能。\n* 学习如何使用媒体查询。尽量避免将不需要的内容设为 `display:none` 的做法，因为隐藏内容仍会被下载到设备上。\n\
    * 绕过大量的客户端处理（JavaScript 以及未优化的第三方脚本），并尝试将逻辑从前端移动到后端。\n\n"
