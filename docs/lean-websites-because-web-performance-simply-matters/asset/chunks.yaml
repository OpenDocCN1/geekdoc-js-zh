    Instagram is one of the companies that really focuses on the symbiosis of design
    and speed. [Their motivation](https://speakerdeck.com/mikeyk/secrets-to-lightning-fast-mobile-design)
    is to find solutions for how speed can be a design feature.


    ## Perceived and Preemptive Web Performance


    Performance is part of user experience. Even if the actual performance of your
    site might be less than ideal, there are ways to trick users into thinking the
    site has better performance.


    This involves perceived and preemptive web performance. While `perceived performance`
    defines how your user perceives, or feels about, the loading of your website,
    `preemptive web performance` deals with predicting what the user might want to
    load next, dispatching it in advance to cut down on loading time later. As we
    learned in [Chapter 1](#ch01.html "Chapter 1Performance Simply Matters"), you
    don''t want users to become bored while waiting for web content to load. A website
    feels fast if the user is presented with a responsive system and is kept informed
    of progress.


    Following the “fake it till you make it” principle can help improve the perceived
    speed of a site. Some tricks that can make website visitors believe a website
    is responsive and speedy include:


    *   `Offline caching`: with many modern browsers now supporting this, it can be
    used to provide an illusion of performance. It has helped [Instagram](http://www.fastcodesign.com/1669788/the-3-white-lies-behind-instagrams-lightning-speed)
    create fast-feeling user experiences. Instead of waiting for the server to respond
    to a photo upload, the offline cache presents the photo the user just attempted
    to upload. Afterwards, the photo is actually sent to the server. If you pay attention
    to the loading spinner in your mobile browser, you can spot this trick yourself.


    *   `Presenting instant feedback and reporting progress`: let the user know how
    far along they are in their journey through your site.


    *   `Placing important functionality at the top of the page`: by displaying important
    content to users `above the fold` (ATF)—at the top of the page, so they don''t
    have to scroll—increases perceived performance. There''s much more on ATF in Chapter
    5.


    *   `Avoiding too many steps`: minimize the number of hoops users have to go through
    to achieve their goal.


    Preemptive strategies take this a step further, but require a lot more intelligence.
    An [example](http://java.dzone.com/articles/mobile-ux-refining-perceived) is Instagram''s
    photo upload functionality. Before a user hits the upload button, the image is
    uploaded in the background, purely on the assumption that this is the user''s
    eventual intention. But this approach is not always recommended. If users don''t
    have a good data plan on their mobile devices and want to save bandwidth, for
    example, this could really annoy them if they didn''t actually want to upload
    the photo after all.


    ### Note: Implementing Preemptive Performance


    Newer browsers have started to adopt the preemptive approach, supporting techniques
    such as the `prefetch` and `prerender` attributes that make the browser look ahead
    for resources that might be needed. Chapter 5 will discuss these attributes in
    more detail.


    ## The Performance Point System


    Now that we''ve learned some basic IA, design, and performance approaches, I''d
    like to propose a practical technique to bridge IA and design with performance:
    the `performance point system.` This might be a fun and easy way to get started,
    especially when you work with a design team. The idea behind this point system
    is to give the pre-development, non-technical members of the team a simple way
    to understand what components of a website could be considered “heavy”, and which
    elements promise better perceived performance.


    It''s about “divide and conquer”, the process of breaking down problems into sub-problems
    of the same type, until the individual sub-problems become simple enough to be
    solved directly.


    We can break down the visual elements of the wireframe into measurable performance
    modules. We can then move them around and arrange them to accomplish not only
    an intuitive information architecture, but also a positive user experience.


    Each module gets a number assigned, which defines its performance impact. At the
    end of the wireframing process, the numbers are summed to reveal a score. The
    lower the number, the better the expected performance.


    This approach suggests that you don''t have to *starve* your website by following
    performance patterns. A lean website in the context of this book does not refer
    to a website that is lacking any information or interaction. It only means that
    the website has been created with the concept of applying and following web performance
    paradigms, which I''ll explore in more detail in later chapters.


    ### Measurable Performance Modules


    A `measurable performance module` (MPM) describes a simplified and single performance
    unit in a wireframe. Its main purpose is to help non-technical members of the
    design and content team understand each module''s performance impact to the overall
    website.


    This might not be the most scientific translation of perceived performance, but
    it''s useful for getting everybody on the same page during the early wireframing
    and design stages of a project:


    | Module | Points | Description |


    | --- | --- | --- |

    | Low impact | 1 | Small images, mostly static content and simple graphics, interaction
    elements like buttons and text fields. |

    | Medium impact | 2 | Medium-sized images and simple scripts. |

    | High impact | 6 | Large images and third-party scripts loading either heavy
    JavaScript or both JavaScript and images (such as adverts). |


    Sit down with your design team, take a pencil, and start marking MPMs in the wireframe.
    Based on the table above, try to identify what modules on the wireframe represent
    low, medium or high performance impacts. This will be useful for the designer
    who creates the wireframe, but also for the developer who must plan out the critical
    path. (The critical path—which we''ll discuss in more detail in Chapter 5—describes
    the code and resources to render the initial view of a page.)


    The end goal of this exercise is to have the entire team focused on getting the
    content to load and display as efficiently as possible.


    ### Case Study: Time Magazine Website


    The following case study is used to show how you can improve the wireframing process
    by applying MPMs to the site.


    Let''s take a look at the Time Magazine website:


    ![The Time Magazine loading](OEBPS/figures/2-time.png)


    Figure 2.1. The Time Magazine loading


    We can see, in the “filmstrip” in [Figure 2.5](#ch02.html_ch2-mpm-wireframe "Figure
    2.5. The Time.com website sketched out in wireframe") above, that the main story
    image only appears after six seconds. There is no visible content prior to that.
    I''ve broken this down further into simple wireframes to illustrate how the site,
    above the fold, looks at various points in time as the site is being loaded.


    Let''s have a closer look at the current order:


    ![After 3 seconds, we only see the menu and the magazine image](OEBPS/figures/2-wf-time-3s.png)


    Figure 2.2. After 3 seconds, we only see the menu and the magazine image


    ![After 5.7 seconds, other important pieces are being loaded](OEBPS/figures/2-wf-time-57s.png)


    Figure 2.3. After 5.7 seconds, other important pieces are being loaded


    ![After 7.5 seconds, most of the visible content above the fold has been loaded](OEBPS/figures/2-wf-time-75s.png)


    Figure 2.4. *After 7.5 seconds, most of the visible content above the fold has
    been loaded*


    There is room for improvement, especially if our goal is to show the top story
    element as soon as possible.


    #### Current Performant Order Based on MDMs


    Let''s see how we can apply the point and order system to the wireframe.

