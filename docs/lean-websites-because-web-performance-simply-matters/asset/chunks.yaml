    # HTTP 事务的剖析


    让我们仔细观察页面每个资源是如何加载的。


    资源瀑布图中的每一项都代表一次网络事务，也称为 HTTP 事务。HTTP 事务描述了客户端对 HTTP 内容发起单个请求的过程。当我们谈论 HTTP 内容时，通常指的是浏览器通过所谓的“内容类型”（content
    types）接收的任何内容。


