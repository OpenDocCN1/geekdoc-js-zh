- fmt: "\nThe idea is to asynchronously include a script, removing it from the critical\
    \ rendering path and thus preventing it from blocking the rendering—when, for\
    \ example, the host is slow to respond, or even down altogether. The browser downloads\
    \ the script in the background, and once downloaded, executes it using the regular\
    \ JavaScript thread:\n\n```\n1\\. <script>\n2\\.  (function(d,s,id){\n3\\.   \
    \   var js, 3js = d.getElementsByTagName(s)[0];\n4\\.      if (d.getElementById(id))\
    \ {return;}\n5\\.      js = d.createElement(s); js.id = id;\n6\\.      js.src\
    \ = \"http://example.com.com/3rdparty-script.js\";\n7\\.      3js.parentNode.insertBefore(js,\
    \ 3js);\n8\\.  }(document, 'script', '3rd-js'));\n</script>\n```\n\nLet's look\
    \ at this script line by line and see how it works:\n\n*   **Lines 2 and 8**:\
    \ this is an immediate, self-invoking function. We want to ensure that any temporary\
    \ variable remains in the local scope and doesn’t bleed into the global namespace\
    \ of the host's page. We pass `d`, `s`, and `id` as arguments, since this is shorter\
    \ than defining them in the body of the function.\n*   **Line 3**: this line declares\
    \ a variable and finds the first available `<script>` element on the page. That's\
    \ the easiest hook for including the script on the page, as opposed to randomly\
    \ appending it.\n*   **Line 4**: this line checks if the script is already on\
    \ the page, and if so, exits straight away, as there’s nothing more to do, because\
    \ we only need the file once. It prevents the script file from being included\
    \ several times.\n*   **Line 5**: this line creates a script element and assigns\
    \ an `id` to it, so we can check for it later, and also to make sure it's not\
    \ appended twice by mistake.\n*   **Line 6**: here you point the `src` attribute\
    \ of the `script` element to your third-party script.\n*   **Line 7**: finally,\
    \ we append the newly created `script` element to the DOM of the host page and\
    \ we’re done.\n\nThere are some drawbacks with this approach, though:\n\n*   The\
    \ script will still block on `window.onload`.\n*   It also blocks the CSSOM (CSS\
    \ object model), unless we place it before the CSS is loaded.\n\nSo is there anything\
    \ better out there that we could use? Yes, there is!\n\n### The Newer, Improved\
    \ Way\n\nThankfully, more and more browser vendors have acknowledged the issue\
    \ of loading scripts synchronously and blocking the rendering, so the [W3C](http://www.w3.org/TR/html5/scripting-1.html)\
    \ has recommended two new attributes for the `<script>` tag. Without them, the\
    \ browser runs the script immediately.\n\n*   `async`: when using this attribute,\
    \ the browser loads the script when it's available, and won’t block the DOM or\
    \ CSSOM. It has an unordered execution, which means it can be placed anywhere\
    \ on the page. This can be used for scripts that tolerate an out-of-order execution.\n\
    *   `defer`: when using this attribute, the browser will run the script when the\
    \ page has finished parsing.\n\nWith these new attributes, we can solve the following\
    \ issues that the dynamic tag can't solve:\n\n*   The `async` attribute does not\
    \ block the CSSOM.\n*   The preload scanner can only run on `src` and `href`,\
    \ and hence can't preload anything that is defined as an inline script. Since\
    \ the dynamic script tag is presented as an inline script, the scanner can't preload\
    \ this piece.\n\nSince these attributes are fairly new, only newer browsers support\
    \ them, while older browsers won't know what they mean and will just ignore them.\
    \ If your target audience uses IE8 and 9, or Android 2.2 or 2.3 devices, you might\
    \ want to add `defer` to the tag, just in case, as `defer` was introduced prior\
    \ to `async`. [Use the combination of both attributes to cover a wider range of\
    \ browsers](https://www.igvita.com/2014/05/20/script-injected-async-scripts-considered-harmful/),\
    \ as suggested by the W3C.\n\n### Tools for Fighting SPOF\n\nLet's discuss a few\
    \ tools and techniques for identifying potential SPOFs by collecting information\
    \ about the third-party scripts on the page and how they've been included.\n\n\
    *   **The [SPOF-O-Matic](https://chrome.google.com/webstore/detail/spof-o-matic/plikhggfbplemddobondkeogomgoodeg)\
    \ browser extension**: Pat Meenan, the creator of WPT, released SPOF-O-Matic,\
    \ a useful Chrome extension. It detects potential SPOFs for a given page, and\
    \ can simulate them as well. Using this tool to simulate SPOF will reveal how\
    \ a website would render in case of a SPOF. It will help you detect if you've\
    \ placed the script in your critical rendering path, or if the rendering of your\
    \ page is unaffected by the third-party provider's code.\n\n    Install the Chrome\
    \ extension, browse to a site you'd like to “SPOF-check”, and click the SPOF-O-Matic\
    \ button as shown below:\n\n    ![Screenshot of the SPOF-O-Matic extension in\
    \ Chrome](OEBPS/figures/6-wpt-blackhole.png)\n\n    Figure 6.3. Screenshot of\
    \ the SPOF-O-Matic extension in Chrome\n\n    As you can see in [Figure 6.3](#ch06.html_ch6-spofomatic\
    \ \"Figure 6.3. Screenshot of the SPOF-O-Matic extension in Chrome\"), SPOF-O-Matic\
    \ offers options to list all possible SPOF scripts (1), simulate SPOF via the\
    \ browser (2), and to create a SPOF comparison video via WPT (3). I decided to\
    \ “SPOF-check” wired.com because it relies on ads. As soon as the page is loaded,\
    \ the extension indicates that there might be three scripts that could cause SPOF.\
    \ Clicking on the badge opens up an additional window. It lists all scripts in\
    \ detail. You can either choose to Enable SPOF via the browser and see the impact\
    \ by reloading the page immediately, or by clicking the Generate SPOF Comparison\
    \ Video link.\n\n    By clicking the link, you'll get redirected to WPT, where\
    \ the scripts are already populated in a SPOF text box, located under Advanced\
    \ Settings. When clicking Start Test, WPT will run the site with and without SPOF\
    \ simulation, and will present you with a filmstrip, as shown in [Figure 6.4](#ch06.html_ch6-spofomatic\
    \ \"Figure 6.4. Filmstrip of the SPOF simulation, including a link to the comparison\"\
    ):\n\n    ![Filmstrip of the SPOF simulation, including a link to the comparison](OEBPS/figures/6-wpt-spof.png)\n\
    \n    Figure 6.4. Filmstrip of the SPOF simulation, including a link to the comparison\n\
    \n    If you want to record the filmstrip, click Create Video to report the test\
    \ results as a handy video that can be downloaded or embedded for future reference.\n\
    \n*   **SPOF simulator via WPT**: if you don't want to use the browser extension,\
    \ you can use the SPOF functionality provided in WPT to simulate SPOF. WPT comes\
    \ with a SPOF tab in its Advanced Settings that allows you to simulate SPOF for\
    \ any given script. Just include the third-party script tags, and WPT will simulate\
    \ what happens when this provider's site is down:\n\n    ![Screenshot of WPT and\
    \ the SPOF tab for including third-party scripts to test SPOF](OEBPS/figures/6-spof-wpt.png)\n\
    \n    Figure 6.5. Screenshot of WPT and the SPOF tab for including third-party\
    \ scripts to test SPOF\n\n*   **Via blackhole in hosts file**: instead of using\
    \ WPT, you can also simulate SPOF locally on your machine. Point the third-party\
    \ domain to a [blackhole](http://blog.patrickmeenan.com/2011/10/testing-for-frontend-spof.html).\
    \ The address for the blackhole is blackhole.webpagetest.org, with corresponding\
    \ IP address `72.66.115.13`. It's a host with a firewall rule to drop all incoming\
    \ packets, and hence simulates the host being down. Let's try it out:\n\n    *\
    \   Update the hosts file (please note you need to have administrator access to\
    \ the machine to edit these files).\n\n        *   For Windows, the file is located\
    \ under `C:\\Windows\\System32\\drivers\\etc\\hosts`.\n\n        *   On Mac, you\
    \ can either use the Finder by clicking on Go -> Go to Folder in the Finder's\
    \ menu, and pasting in `/private/etc/hosts`, or by typing in `vi /private/etc/hosts`\
    \ in your preferred command line interface.\n"
