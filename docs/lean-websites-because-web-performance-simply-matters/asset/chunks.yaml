  raw: 'Imagine a situation where you visit a page and a loading indicator slowly
    moves from 5% to 10%. You''ll expect it to take a while to hit 100%. If the percentage
    unexpectedly begins to rise quickly to 95% and then 100%, you''ll be satisfied
    and happy, because your perception exceeded your expectation. Conversely, if the
    loading indicator goes up slower than you expect, you''ll experience an unpleasant
    feeling.


    In a nutshell, website visitors are satisfied when their perception exceeds their
    expectation, and dissatisfied when the opposite occurs.


    #### Perception


    We need to acknowledge that the perception of website speed is a *feeling*—something
    that is very subjective.


    For example, perception refers to how fast the user *thinks* your website is,
    rather than how fast it *actually* is. Most of the time, that''s almost more important
    than the actual speed of your website.


    Generally, the [perception of something being slow](http://www.slideshare.net/stoyan/psychology-of-performance)
    carries negative associations—unpleasantness, boredom, irritation, confusion and
    so on. Speed, on the other hand, is associated with success, resulting in less
    frustration and irritation—especially where the user is kept informed of progress.


    Given that your website''s loading time can be perceived as slow, it''s important
    to ensure that content is delivered as quickly as possible—or at least that, during
    any delay, the user is kept busy and distracted, so that the experience doesn''t
    *feel* slow to them.


    There''s a great [example](http://www.nytimes.com/2012/08/19/opinion/sunday/why-waiting-in-line-is-torture.html?pagewanted=all&_r=0)
    that illustrates the problem of perception. The Houston airport received a lot
    of complaints from passengers that it took too long to get their luggage. Instead
    of making the hard working airport personnel work even faster to get the luggage
    out, the airport decided to change the way passengers perceived the waiting time
    to pick up their luggage. They extended the distance from the arrival gate to
    the baggage claim sixfold. While the airport personnel were busy moving all the
    luggage to the baggage claim, passengers were kept busy by walking. The time for
    the bags to come out hadn''t changed. However, as a result of perceived performance,
    complaints started dropping dramatically.


    #### Expectations


    In the context of performance, when servicing customers, it''s important to manage
    and care about their expectations. Disney has done a fabulous job in managing
    expectations so the customer receives a positive outcome in their amusement parks.
    They have lineups that show you the expected waiting times, with a rather pessimistic
    estimate, so that customers get to the front of the line in a much shorter time
    than predicted. As a result, the customer feels more positive.


    So, how does this translate to servicing website visitors? We should set clear
    expectations by keeping them informed about the progress of their task. Show them
    the content they want to see in the fastest possible way; and, if waiting is required,
    show progress bars or other indicators to reassure them the website is still responding,
    and that they''ll receive the content that they requested.


    ### Note: Respect


    I''d like to mention “respect”, as I believe it''s an important factor in customer
    satisfaction. Ultimately, performance is about respect. Imagine you are made to
    stand in line for 20 minutes, only to find the cashier closing just before it''s
    your turn to be served. Frustrating, right? Couldn''t they have told you earlier?
    That''s where respect comes into play: the greater the respect shown for customers,
    the more likely they are to experience satisfaction.


