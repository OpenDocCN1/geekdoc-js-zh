    \ goes down. This might encourage the provider to help you include the script\
    \ in the most performant way.\n\n### Tip: Choosing Third-party Providers\n\n[JS\
    \ Manners](http://jsmanners.com/) is a handy scoring system to help publishers\
    \ choose the right third-party provider, based on specific performance characteristics.\n\
    \n## Cool Down\n\n*   You've received advice on optimizing HTML markup for performance,\
    \ with tools such as HTML Tidy or HTML Compressor.\n\n*   You've been introduced\
    \ to CSS best practices, and when and how to use different performance selectors.\
    \ Remember, the most efficient CSS selector is the ID.\n\n*   Use tools such as\
    \ CSS Shrink or CSSLint to help you identify non-performant CSS selectors.\n\n\
    *   Performant JavaScript options have been presented to you. Avoid `document.write()`\
    \ and expensive loops. Strive for lean DOM operations, and step back from repaints\
    \ and reflows.\n\n*   You've learned how third-party content can be evil, and\
    \ how, if it's not included properly, it could bring down your site. You've also\
    \ been provided with options for including third-party scripts properly, such\
    \ as circumventing the offending tag and using asynchronous loading options.\n\
    \n# Chapter 7\n\nProducing Lean Web Assets: Part 2\n\n## Warm Up\n\nThis chapter\
    \ continues the theme of producing lean web assets, focusing on images, videos,\
    \ audio, and web fonts. We'll cover several techniques for conquering common performance\
    \ challenges with these assets, including when to use web fonts, and how to load\
    \ them more efficiently.\n\n> Webpages have to be designed with speed in mind.\
    \ In fact, speed must be the overriding design criterion. To keep page sizes small,\
    \ graphics should be kept to a minimum and multimedia effects should only be used\
    \ when they truly add to the user's understanding of the information.\n\nThis\
    \ comment comes from the [Nielsen Norman Group](http://www.nngroup.com/articles/the-need-for-speed/)\
    \ all the way back in 1997\\. But it's actually still a valid suggestion, even\
    \ almost 20 years later: you should only include assets if they truly add value\
    \ to your page.\n\n## Optimizing Images\n\nAlthough images remain the main culprit\
    \ for heavy and slow websites by having a proven [high correlation to load times](http://httparchive.org/interesting.php#onLoad),\
    \ they also offer some of the biggest opportunities for optimization.\n\nFirst,\
    \ let's have a look at the most common image formats, the average image sizes\
    \ per page, and the median size of an image used on the top Alexa websites.\n\n\
    The most frequently used content type on the Internet is the `image/*` type. To\
    \ further break it down, the most used image format is JPEG, followed by PNG and\
    \ GIF, as shown in [Figure 7.1](#ch07.html_ch7-image-formats \"Figure 7.1. Big\
    \ Query result for most used image formats for top Alexa websites\"):\n\n![Big\
    \ Query result for most used image formats for top Alexa websites](OEBPS/figures/7-most-used-images.png)\n\
    \nFigure 7.1. [Big Query](http://bbinto.github.io/lean-web-code/chapter-7/queries/)\
    \ result for most used image formats for top Alexa websites\n\nThe median image\
    \ size used on the top Alexa websites was 30220 bytes, while the total image size\
    \ per page averages at around [1206KB](http://httparchive.org/trends.php), as\
    \ shown in the HTTP Archive pie in [Figure 7.2](#ch07.html_ch7-image-size \"Figure 7.2. Average\
    \ image size\"):\n\n![Average image size](OEBPS/figures/7-image-size.png)\n\n\
    Figure 7.2. [Average image size](http://httparchive.org/trends.php)\n\n### Compression\
    \ and Image Formats\n\nThe most efficient way to optimize images is to **compress**\
    \ them. The idea behind image compression is to remove redundant image data. By\
    \ doing so, the image size is dramatically reduced, and the asset can be served\
    \ faster to the browser.\n\nImage compression can either be lossy or lossless.\n\
    \n*   **Lossy image compression**: the “lossy” filter *eliminates* some pixel\
    \ data, mostly applied to photos.\n\n*   **Lossless image compression**: the “lossless”\
    \ filter *compresses* pixel data—ideal for technical drawings, clip art, or comics.\n\
    \nFurther, there are two approaches to encoding image data—raster and vector graphics,\
    \ which are covered next.\n\n#### Raster Graphics\n\n**Raster** graphics represent\
    \ an image by encoding the individual values of each pixel within a rectangular\
    \ grid. The following image formats fall under the category of raster graphics:\n\
    \n| Format | Compression | Description |\n\n| --- | --- | --- |\n\n| [JPEG](http://en.wikipedia.org/wiki/JPEG)\
    \ | Lossy | Best choice for photos or screenshots, though not recommended for\
    \ logos or line art. |\n\n| [JPEG2000](http://en.wikipedia.org/wiki/JPEG_2000)\
    \ | Lossy and Lossless | Its biggest advantage over JPEG is that it offers lossy\
    \ and lossless compression. Has the ability to deliver much smaller files but\
    \ the same level of detail as JPEG. |\n\n| [Progressive JPEG](http://en.wikipedia.org/wiki/JPEG)\
    \ | Lossy | Loads in a series of scans, starting with a low-resolution version,\
    \ with several versions in between until the full resolution has been achieved.\
    \ |\n\n| [GIF](http://en.wikipedia.org/wiki/Graphics_Interchange_Format) | Lossless\
    \ | Only supports 256 colors. Use instead of JPEG if you only need a few distinct\
    \ colors, or need to create text images. Allows transparency, but is mostly known\
    \ nowadays for its support for animations. |\n\n| [PNG](http://en.wikipedia.org/wiki/Portable_Network_Graphics)\
    \ | Lossless | Can be 5%–25% more compressed than GIF. Also supports transparency.\
    \ Use over GIF if you need to preserve a lot of colors. Can be much smaller than\
    \ JPEG or GIFs, and hence is a preferred format to display text images or logos.\
    \ PNG-8, similar to GIF, can support up to 256 colors, whereas PNG-24 is able\
    \ to display millions of colors. |"
