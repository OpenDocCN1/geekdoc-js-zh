  trans: '

    然而，任何增加帧率的调整都会增加文件的总体大小——因此，确定视频的意图至关重要。例如，如果你录制的是一个动作较少的 PowerPoint 演示文，但你又在意图像质量，那么你可能更关注更高的分辨率并降低帧率。对于体育赛事等快速运动的录制，你会希望[每秒尽可能捕捉更多的帧](https://ustream.zendesk.com/entries/22962268-Encoding-Specs-and-Stream-Settings#recommended)，同时牺牲一部分分辨率。


    # 分辨率


    有两种常见的 `resolution` 格式——标准定义 (SD) 和高定义 (HD)。SD 视频常见的分辨率包括 640x480px (4:3 宽高比例)
    和 640x360px (16:9 宽高比例)。HD 视频通常格式为 720p (1280x720px) 或 1080p (1920x1080px)。


    显然，分辨率越高，视频文件的大小越大，传输给在线消费者的时间就越长。


    # 比特率


    `bit rate` 控制视频的视觉质量和文件大小，单位是每秒比特 (kbit/s)。[Adobe](http://help.adobe.com/en_US/mediaencoder/cs/using/WSb8e30982e628fbecc0e59e6131255b4dd2-8000.html#WSb8e30982e628fbecc0e59e6131255b4dd2-7ffd)
    建议对通过网络传输的视频使用较低的比特率。根据分辨率的不同，以下比特率可以作为[指南](https://vimeo.com/help/compression)：SD
    使用 2,000–5,000kbit/s；HD 的 720p 使用 5,000–10,000kbit/s，1080p 使用 10,000–20,000kbit/s。


    ## 容器、编码器和压缩


    一旦选定了帧率、分辨率和比特率，你就需要将视频渲染为特定的视频格式。这些格式也被称为 `video containers`。视频容器包含编码器，因此视频播放器知道如何读取和播放文件。


    ### 容器


    常见的视频格式所示所示：


    | 格式 | 描述 |

    | --- | --- |

    | [.mp4](http://en.wikipedia.org/wiki/MPEG-4_Part_14) (H.264 编码) | 用于 YouTube
    和 Vimeo 视频。Windows 没有默认视频播放器可以播放此格式。需要 VLC 等工具进行播放。 |

    | [.mov](http://en.wikipedia.org/wiki/QuickTime) (H.264 编码) | Windows 没有默认视频播放器可以播放此格式。需要
    VLC 等工具进行播放。 |

    | [.wmv](http://en.wikipedia.org/wiki/Windows_Media_Video) | Mac 没有默认视频播放器可以播放此格式。需要
    VLC 等工具进行播放。 |

    | [.flv](http://en.wikipedia.org/wiki/Flash_Video) | 需要 Flash 播放器，并非所有设备（如 iOS）都支持。
    |

    | [.ogg](http://en.wikipedia.org/wiki/Ogg) | 开源，HTML5 视频格式候选格式。 |


    ### 编码器和压缩


    `codec` 决定了视频如何被 `co`mpressed（压缩）和 `dec`omressed（解压）（因此称为 codec）。过程的一部分是确定比特率与最终质量之间复杂的关系。


    你曾经尝试过导出用 iMovie 创建的视频吗？你有许多设置可以选择，因为有许多视频和音频编码器。以下是一些常见的：


    *   [H.264](http://en.wikipedia.org/wiki/H.264/MPEG-4_AVC): 蓝光光盘、Vimeo、YouTube
    和 iTunes 商店的视频编码标准。该编码器的意图是在低比特率下提供良好的视频质量。它也是目前移动端和网络上常用的视频编码器，在保持相同比特率的同时，比其他编码器（如
    Google 的 On2 或 [Sorensen Spark](http://en.wikipedia.org/wiki/Sorenson_Media#Encoding_Technologies)）提供更小的文件更高的视频质量。

    *   MP3 ([MPEG-1 Audio Layer 3](http://en.wikipedia.org/wiki/MP3)): MP3 是最流行的音频编码器。出于兼容性原因和历史因素，MP3
    支持最广泛的音频编码器。然而，如果你纯粹根据质量和性能选择，你会想要 AAC+。

    *   AAC+ ([Advanced Audio Coding](http://en.wikipedia.org/wiki/Advanced_Audio_Coding)):
    AAC+ 是一种在低比特率下提供最佳音频质量的音频编码器。它被 YouTube、iPhone、PlayStation、Android、Blackberry
    等使用。


    ## 传输方法


    网络视频常见的传输方法包括流媒体、下载和渐下载。根据文件大小和带宽，不同的用户场景将获得不同的性能结果。


    ### 流媒体


    `Streaming` 是通过一种协议实现的，视频被分成时间分块（通常为 10 秒）。浏览器对每个分块发送定期的 HTTP 请求。这意味着适用于 CSS 和
    HTML 等资源的相同优化规则同样这里。有两种主要的流媒体协议：


    *   `RTMP` ([Real Time Messaging Protocol](https://www.adobe.com/devnet/rtmp.html))
    较旧且运行在端口 1335 上，这意味着 Flash 无法查看。

    *   更常见的流媒体解决方案提供 `HLS` ([`en.wikipedia.org/wiki/HTTP_Live_Streaming))/`HDS` ([HTTP
    Dynamic Streaming`](https://www.adobe.com/ca/products/hds-dynamic-streaming.html))。


    ### 下载


    `Downloading` 意味着使用 HTTP 将视频文件作为一个单个大文件获取。通常这意味着你的用户必须在播放之前下载整个文件。


    取决于文件的大小，这可能需要用户在播放视频之前等待。因此，流媒体可能更适合大文件和较长的视频。然而，如果你无法访问流媒体服务器，通过下载获取文件可能是更简单的解决方案。此外，如果你知道用户的互联网连接较慢，或者视频需要高质量，下载可能是你的最佳选择。


    ### 渐下载


    视频格式可以针对 `progressive download` 进行优化，允许视频在下载过程中即可播放。[progressive download](http://www.onlinevideo.net/2011/05/streaming-vs-progressive-download-vs-adaptive-streaming/)
    的技术定义是：视频通过普通 Web 服务器而不是流媒体服务器传输，存储在查看者的硬盘上，然后从硬盘播放。


    这与流媒体相反，流媒体中视频通常不存储或缓存在本地，查看者无法稍后观看。渐下载有时被称为“快速启动”。


    此外，HTTP/1.1 允许浏览器请求视频资源的特定部分。你可以使用 `Accept-Range` HTTP 请求头告诉服务器只交付总视频文件中的字节子集，使其感觉更像“[伪流媒体](https://1stdev.com/tremendum-transcoder/articles/seeking-videos-beyond-the-buffer-line/)”。


    # 视频托管


    为了避免思考使用哪种传输方法，将你的视频托管在 YouTube 或 Vimeo 上可能是最合理的——这些服务针对快速内容传输进行了优化。

