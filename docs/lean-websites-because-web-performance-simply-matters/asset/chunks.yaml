    2. Once the comparison test is completed, you''ll be presented with filmstrips
    of Websites A and B, as shown in [Figure 4.16](#ch04.html_ch4-comparison "Figure
    4.16. WPT filmstrips comparing two clothing store websites"). The first visible
    content is delivered immediately by Website B, whereas Website A is only starting
    to show useful content above the fold after 6 seconds.


    ![WPT filmstrips comparing two clothing store websites](OEBPS/figures/4-competitive-comparison.png)


    Figure 4.16. WPT filmstrips comparing two clothing store websites


    3. Here are some additional measurements:


    | Competitive Performance Comparison | [Website A](http://www.webpagetest.org/result/141211_NJ_NN6/3/details/)
    | [Website B](http://www.webpagetest.org/result/141211_NV_NN5/1/details/) |

    | --- | --- | --- |

    | SpeedIndex | 6197 | 4483 |

    | Bytes (Fully Loaded) | 4,761KB | 1,915KB |

    | Visually Complete | 9.300s | 5.700s |


    There''s definitely room for improvement for website A, as it''s clearly not performing
    as well as website B. Each category above shows huge differences between the two.
    Website A comes out with more than double the total page size of Website B.


    Try this out yourself: consider who is your biggest competitor, what website is
    similar to yours, or what website do you admire when it comes to speed. Measure
    against it, and set your budget.


    ### Tip: Alternative to WPT


    Besides using WPT''s visual comparison, you can also use [SpeedCurve](http://speedcurve.com),
    a visually pleasing, cloud-based tool that lets you benchmark sites against competitors
    and industry categories.


    ### Create Business Hypotheses and Prove Them


    Spend some time understanding how site speed could dictate your business metrics
    and vice versa. If you need buy-in from management to speed up your site, the
    best way to do so is by aligning your performance goals with real business data.
    Can negative performance results directly correlate with bad business performance?


    It''s important to figure out if there''s a correlation between these two phenomena.
    You might require the help of a product manager, or a marketing/sales team to
    investigate user behaviours on the site. Ask them for data that will provide you
    with the biggest “pain” points for your current website. Look for clues suggesting
    that performance is your conversion bottleneck.


    The goal is to come up with hypotheses related to performance that can be validated
    with concrete data and then be improved upon.


    Let''s talk through a simple example. Imagine you maintain an ecommerce website
    selling furniture, and you''ve conducted performance analyses of your competitors
    and defined your #1 competitor. You want to make sure people will purchase furniture
    through your website instead of your competitor''s. Now, let''s create some hypotheses
    and goals. A good start is to compare what elements are loaded first on your website
    vs the competitor''s website. For example, check if your “call to action” (CTA)[^([2])](#ch04.html_ftn.d5e1576)
    buttons load faster than those on the competitor''s site. Or compare what content
    is visible above the fold.


    Here are some sample observations that might help in forming hypotheses for a
    furniture ecommerce website:


    | Observation | Hypothesis |

    | --- | --- |

    | “Winter sales were very low this year, and nobody clicked on our special discount
    button” | By ensuring that the special discount button is more prominent and loads
    as quickly as possible, we''ll increase sales and market share (to compete with
    the competitor) |

    | “Fewer visitors to the site than two months ago” | By removing or optimizing
    an asset—such as a heavy hero image—we''ll increase our visitor numbers |

    | “Visitors drop off during the checkout process” | By improving the page load
    time of the checkout process, the drop off rate will reduce |


    Based on these observations, the table above shows how you can put on your performance
    hat, make assumptions, and then come up with specific budget goals.


    You could further use A/B testing, as described in [Chapter 3](#ch03.html "Chapter
    3Measuring & Monitoring Performance"), to test out different options in order
    to collect data that shows what changes will have the biggest impact.


    The hypotheses above are valid assumptions, and have worked for retail and shopping
    sites in the past. For example, boosting [AutoAnything.com](http://www.radware.com/PleaseRegister.aspx?returnUrl=6442452828)''s
    page load time improved sales by 13%. Another [real-world example](https://blog.mozilla.org/metrics/2010/04/05/firefox-page-load-speed-%E2%80%93-part-ii/)
    comes from Mozilla: cutting their page load time by 2 seconds resulted in a 15.4%
    increase in downloads. The sooner you get your content to users, the sooner they
    can interact with it, and the more you benefit.


    Can you think of potential performance bottlenecks for your website that could
    negatively influence the business?


    ### List and Commit to Your Performance Metrics


    Once you''ve gathered enough baseline data and created a competitive performance
    analysis, it''s time to turn them into official goals, and commit to them.


    1. List your current performance data. I''ll continue to use the sample page I
    introduced at the beginning of the chapter.


    | WPT Metrics | Results |

    | --- | --- |

    | Fully Loaded | 2.58s |

    | SpeedIndex | 2222 |

    | Bytes (Fully Loaded) | 692KB |


    2. Prioritize results that could be improved. Start with the low-hanging fruit.
    For example, tackle the “Fully Loaded” result first, aiming to reduce it to 2
    seconds.


    | Priority | Metric | WPT Results | Budget Goal |

    | --- | --- | --- | --- |

    | 1 | Fully Loaded | 2.58s | < 2s |

    | 3 | Bytes (Fully Loaded) | 692KB | will improve after goal #1 |

    | 2 | SpeedIndex | 2222 | will improve after goal #1 |


    In addition, if you gather RUM data for your website, as I did it for bbinto.me,
    you can also specify a target for the RUM load time, to ensure that your real
    users “really” benefit from the changes. bbinto.me showed a median of 4.6s. For
    this example, we could aim for 3 seconds.


    3. Commit to your goals. Don''t just talk about them; circulate and publish them
    amongst the team—even print them out and hang them somewhere if that helps. Etsy
    does a great job in publicly exposing the performance of their website. They publish
    [their performance results](https://codeascraft.com/2014/08/01/q2-2014-site-performance-report/)
    quarterly.


    ### Tip: What Speed Index and PageSpeed Score Should You Aim For?


    *   Aim for a *low* Speed Index. As Paul Irish defines it, a site with a Speed
    Index under 10000 is considered fast—http://timkadlec.com/2014/01/fast-enough/#comment-1200946500


    *   Aim for a *high* PageSpeed value. Google considers websites scored with 85
    to be performing well—https://developers.google.com/speed/docs/insights/about


    ## Cool Down


    *   You''ve learned how to spot performance problems in a waterfall: aim for short
    and steep waterfalls.

