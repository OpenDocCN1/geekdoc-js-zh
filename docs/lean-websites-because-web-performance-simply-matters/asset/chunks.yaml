- fmt: "\nDon't allow the mobile device's radio to move in and out of idle mode too\
    \ often, in order to avoid unnecessary round trips. When in an idle state, the\
    \ device isn't able to send or receive any data. To send and receive data, the\
    \ radio must synchronize with a nearby radio tower, which requires several round\
    \ trips between the mobile device and the tower. As a result, switching between\
    \ the idle and non-idle states not only reduces battery life, but also introduces\
    \ more latency, which in turn affects performance.\n\nTherefore, try to execute\
    \ all your requests as quickly as possible, in a single batch, and then allow\
    \ the radio to return to idle. Try to use the radio while it's already fired up—for\
    \ example, by using pre-fetching techniques we've discussed previously.\n\nIn\
    \ addition, fight latency on mobile by reducing HTTP requests as much as possible,\
    \ and compress and cache assets to circumvent any further requests or round trips.\n\
    \n### Note: Domain Sharding\n\nThe idea behind [domain sharding](http://www.stevesouders.com/blog/2009/05/12/sharding-dominant-domains/)\
    \ is to split assets across multiple domains or subdomian in order to serve them\
    \ faster to the user. The browser can open up to six concurrent connections, allowing\
    \ your assets to be spread across six different domains, which can be downloaded\
    \ in parallel. Don't be fooled by this approach, however. In particular with regard\
    \ to mobile websites, with different domains, there aer additional DNS lookups\
    \ and additional TCP connections that have to be opened. If you use [more than\
    \ two domains](http://www.stevesouders.com/blog/2013/09/05/domain-sharding-revisited/),\
    \ performance suffers, especially when your mobile user doesn't have enough bandwidth\
    \ to handle this shower of assets from the server.\n\n### Optimizing Repaints\
    \ and Reflows\n\nJavaScript execution can be slower on mobile devices, so avoid\
    \ repaint and reflow operations as much as possible, and avoid too many DOM manipulations.\
    \ [Chapter 5](#ch05.html \"Chapter 5Mastering Lean HTTP Requests\") has more details\
    \ on how to enhance repaints and reflows.\n\n### Jank-free Scrolling and Animations\n\
    \nMost mobile devices nowadays use touch gestures, where fingers are the scrolling.\
    \ Finger gestures make it easy to scroll fast through pages. As discussed in [Chapter\
    \ 5](#ch05.html \"Chapter 5Mastering Lean HTTP Requests\"), animations should\
    \ ideally run at 60 frames per second for a smooth result. However, due to the\
    \ CPU/GPU constraints on mobile, processing animations can take several hundred\
    \ milliseconds. During this time, an animation may become hopelessly “janky”,\
    \ especially when scrolling fast.\n\nTo produce smooth animations on mobile devices,\
    \ I recommended using `requestAnimationFrame()` (discussed in [Chapter 6](#ch06.html\
    \ \"Chapter 6Producing Lean Web Assets: Part 1\")). You'll save CPU cycles this\
    \ way, the animations being better synced with your GPU. This will also help preserve\
    \ your user's battery life.\n\n## Content Presentation\n\nThe following section\
    \ outlines three different approaches to serving content to mobile users: the\
    \ dedicated mobile (“mdot”) site; the single-URL, responsive site; and the RESS\
    \ site, a kind of hybrid.\n\nFirstly, I'll explain what they are and how to set\
    \ them up. Then I'll present a comparison of the approaches, to help you decide\
    \ which will achieve the best performance results for your site.\n\n### Dedicated\
    \ Mobile Website, or mdot\n\nAn `mdot` website is a separate version of a site\
    \ geared specifically for mobile devices. Its name refers to the typical URL scheme\
    \ used on such websites, such as m.example.com.\n\nThe main advantage of the mdot\
    \ approach is content adaptation. Before sending the user the site content, the\
    \ server detects the kind of device making the request, and automatically redirects\
    \ from the desktop to the mdot site. No heavy desktop-specific content (such as\
    \ big images) will be sent to the user. The content is organized and presented\
    \ specifically for mobile devices.\n\nHowever, by including a redirect, you add\
    \ an additional DNS lookup to process, which could increase the overall page load\
    \ time. Also, being a separate website, the effort to maintain, design, and keep\
    \ both versions in sync needs to be considered and planned for.\n\nIf you decide\
    \ to use an mdot site, make sure you properly add code in the page's `head` to\
    \ help search engines like Google understand what version of the site to send\
    \ to your visitors. For the desktop version, put this in the `head`:\n\n```\n\
    <link rel=\"alternate\" media=\"only screen and (max-width: 640px)\"\n    href=\"\
    http://m.example.com/hello\">\n```\n\nFor the corresponding mobile site, put this\
    \ in the `head`:\n\n```\n<link rel=\"canonical\" href=\"http://www.example.com/hello\"\
    >\n```\n\n### Redirects\n\nBefore redirecting users to the mobile version of your\
    \ site, you'll need to detect their device properly. Redirects are part of the\
    \ mdot website process, and users only need to know the main (non-mdot) URL of\
    \ your site. Once typed into the browser, the server will direct users to the\
    \ appropriate site depending on their device. It's important that you think about\
    \ URL naming conventions. By having a clean, structured URL hierarchy, it will\
    \ be easier for you to map between the corresponding websites—for example, example.com/section1\
    \ could either correspond to m.example.com/section1 or example.com/m/section1.\n\
    \n### Tip: Skipping the Redirect\n\nAvoid making the user go through the redirect\
    \ over and over again when accessing the site via mobile. You can mitigate the\
    \ redirect delay by encouraging users to bookmark the mobile version, either as\
    \ a regular bookmark, or by adding it to their home screen.\n\nBefore discussing\
    \ redirect techniques, let's check out some real-world examples of websites that\
    \ use an mdot approach, and the delays caused due to the redirects. I took screenshots\
    \ of the waterfall for LinkedIn ([Figure 11.1](#ch11.html_ch11-redirect-linkedin\
    \ \"Figure 11.1. LinkedIn on mobile, redirect from linkedin.com to touch.www.linkedin.com,\
    \ wasting 1.3s just for the redirect\")) and Facebook ([Figure 11.1](#ch11.html_ch11-redirect-linkedin\
    \ \"Figure 11.1. LinkedIn on mobile, redirect from linkedin.com to touch.www.linkedin.com,\
    \ wasting 1.3s just for the redirect\")) on mobile devices via WPT, and tested\
    \ the desktop URLs with a WPT mobile device:\n\n![LinkedIn on mobile, redirect\
    \ from linkedin.com to touch.www.linkedin.com, wasting 1.3s just for the redirect](OEBPS/figures/11-redirect-linkedin.png)\n\
    \nFigure 11.1. [LinkedIn](http://www.webpagetest.org/result/141102_GK_F1K/) on\
    \ mobile, redirect from linkedin.com to touch.www.linkedin.com, wasting 1.3s just\
    \ for the redirect\n\n![Facebook on mobile, redirect from facebook.com to m.facebook.com,\
    \ taking around 3.6s just for two redirects](OEBPS/figures/11-redirect-facebook.png)\n\
    \nFigure 11.2. [Facebook](http://www.webpagetest.org/result/141102_RS_F2Y/) on\
    \ mobile, redirect from facebook.com to m.facebook.com, taking around 3.6s just\
    \ for two redirects\n\nFor the Facebook example, there are two redirect hoops\
    \ the user has to jump through before landing on the mdot site:\n\n1. The first\
    \ redirect of 1.1s is to redirect from http:// to https://\n2. Then it takes around\
    \ 2.5 seconds to redirect to m.facebook.com\n3. Only then, after approximately\
    \ 3.6 seconds, does the user get to the intended destination.\n\n### Redirect\
    \ Methods\n\nThere are three primary methods for directing users to the appropriate\
    \ location:\n\n*   **server-side redirects:** this can be done by simple server\
    \ rewrite rules. You can tell Apache, Nginx, IIS or other web servers how to redirect\
    \ users based on their user agent. In addition, server-side languages such as\
    \ PHP can also be utilized to handle the redirects based on the user agent.\n"
