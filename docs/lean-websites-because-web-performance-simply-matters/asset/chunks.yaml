    \ easy to share. | Device detection or feature detection required. RESS with ESI:\
    \ no need to go back to the origin for processing, hence load at the origin is\
    \ cut down. | Constant updating of device filters. |\n\nMy advice is to use RESS\
    \ with ESI where access to a CDN with ESI support is available. This approach\
    \ provides the most flexibility, and is best able to determine what to serve to\
    \ a specific platform or device.\n\n## Cool Down\n\n*   Various techniques such\
    \ as offline storage are useful for improving perceived performance and reducing\
    \ latency on mobile devices.\n\n*   The user agent HTTP header can be used to\
    \ manage and detect devices.\n\n*   Three main options—mdot, RWD and RESS—exist\
    \ for serving content efficiently to mobile devices. As always with performance,\
    \ your choice depends on your current needs and resources.\n\n*   If you choose\
    \ RWD, don’t just make the website responsive. Also pay attention to performance.\n\
    \n*   Learn how to use media queries properly. Try to avoid practices like setting\
    \ unwanted content to `display:none`, as the hidden content will still be downloaded\
    \ onto the device.\n\n*   Bypass extensive client-side processing (JavaScript,\
    \ and non-optimized, third-party scripts), and try to move the logic from the\
    \ front-end to the back-end.\n\n*   Strive to create the best user experience\
