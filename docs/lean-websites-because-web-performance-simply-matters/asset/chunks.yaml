    > “单一网络（One Web）”意味着在合理范围内，无论用户使用何种设备，都能获得相同的信息和服务。然而，这并不意味着在所有设备上都能以完全相同的形式呈现完全相同的信息。移动端的使用场景、设备能力的差异、带宽问题以及移动网络能力都会影响信息的呈现方式。（[W3C
    移动 Web 实践](http://www.w3.org/TR/mobile-bp/#OneWeb)）


    这段引用来自 W3C 移动 Web 倡议最佳实践工作组，它总结了我们应该如何为多设备构建网站。由于不同设备的性能和屏幕尺寸各异，如果我们想提供最佳用户体验，就需要针对每种设备来构建网站。


    为所有用户提供完全相同的内容并不总是明智的。想象一个精美、图片密集的旅游网站。对于使用宽带的桌面用户来说，这可能是一种很棒的，但对于使用小型移动设备的用户来说却是糟糕的。图片很可能需要减小尺寸以加快下载并节省带宽——如果它们确实需要显示的话。此外，移动用户可能只想查看行程详情或出发时间，因此适用于桌面端的布局和功能在移动场景下可能非常不合适。为用户提供最佳体验以帮助他们实现目标应该是核心关注点。


    ## 移动端的兴起：当前统计与互联网使用


    在网页早期，我们几乎可以确定网站访问者使用的是有线互联网连接，且只有少数浏览器可供选择。如今，各种设备、浏览器和互联网连接类型之间存在着大量的碎片化——这使得考虑如何最好提供
    Web 内容变得更加重要。


    [StatCounter](http://gs.statcounter.com) 提供了关于最常用屏幕尺寸、操作系统等的有用数据。根据 StatCounter
    的顶部列表（截至撰写时），全球范围内约有 [14](http://gs.statcounter.com/#all-resolution-ww-yearly-2012-2014)
    种不同的屏幕分辨率、[8](http://gs.statcounter.com/#all-os-ww-yearly-2012-2014) 个操作系统、[9](http://gs.statcounter.com/#all-browser-ww-yearly-2012-2014)
    种浏览器、多种不同的连接速度，以及大约 14,000 种不同的用户代理字符串（设备类型）。


    移动端使用的急剧增长似乎将持续下去。2014 年，全球约有 [72 亿](http://www.worldometers.info/world-population/)
    人，其中全球约有 [45.5 亿移动用户](http://www.emarketer.com/Article/Smartphone-Users-Worldwide-Will-Total-175-Billion-2014/1010536)。根据
    2015 年的[预测](http://www.icinsights.com/news/bulletins/Worldwide-Cellphone-Subscriptions-Forecast-To-Exceed-Worldwide-Population-In-2015/)，全球人口预计将达到
    74 亿，而手机订阅用户数计算将略高于 75 亿。


    此外，还有[建议](http://telecoms.com/301771/half-of-worlds-population-on-mobile-web-by-2020-report/)认为，移动端浏览将超过桌面浏览，并且在某些地区可能已经实现了这一点。这足以让我们确保我们的网站在移动设备上做到“性能无懈可击”。


    ## 移动性能挑战


    本节探讨了当前的移动限制，以及为什么为移动用户构建精简的网站尤为重要。


    ### 速度


    首先，移动端到底慢了多少？Akamai 的[*2014 年第二季度《互联网状况报告》](http://www.akamai.com/html/about/press/releases/2014/press-093014.html)
    通过 RUM（真实用户监控）从全球收集了“真实”的页面加载时间。（注意，这些 RUM 数据仅包含支持 `Navigation Timing API` 的设备。）结果在不同国家和不同大洲之间差异巨大。


    Akamai 将移动端与非移动端页面加载时间的差异定义为“移动惩罚（mobile penalty）”。以下是一些收集的数据，惩罚最高的国家在顶部，最低的在底部：


    | 国家 | 宽带平均加载时间 (ms) | 移动端平均加载时间 (ms) | 移动惩罚系数 |

    | --- | --- | --- | --- |

    | 爱尔兰 | 1508 | 5353 | 3.6x |

    | 加拿大 | 3014 | 5321 | 1.8x |

    | 美国 | 3354 | 5299 | 1.6x |

    | 土耳其 | 3320 | 2335 | 0.7x |


    为什么移动端一切都慢这么多？在为移动设备开发网站时，需要考虑几个性能限制。让我们逐一来看。


    ### 移动网络与高延迟


    无线通信比有线通信具有更高的延迟。无线连接基于设备中的无线电，需要通过空气传输，暴露在大量的拥堵和干扰中。因此，在移动连接请求网站时产生的延迟比通过局域网甚至家中的
    WiFi 连接要大。让我通过移动设备请求网页的高级、简化步骤来解释其原因。（Ilya Grigorik 在他的《高性能浏览器网络》一书中对此有一个非常[详细的章节](http://chimera.labs.oreilly.com/books/1230000000545/ch07.html)。）


    1. 起初，无线电是关闭的，手机处于空闲状态。

    2. 一旦你在浏览器中输入 `URL`，无线电就会尝试与附近的无线电塔建立连接。在通过空气传输到最近的无线电塔的过程中，请求暴露在干扰中。这是在有用信号中加入不希望的信号，例如[电磁干扰](http://en.wikipedia.org/wiki/Electromagnetic_interference)、[同道干扰](http://en.wikipedia.org/wiki/Co-channel_interference)或[载间干扰](http://en.wikipedia.org/wiki/Interference_(communication))。协商无线链路的这一步可能花费
    [1000–2000ms](https://www.igvita.com/2012/07/19/latency-the-new-web-performance-bottleneck/)。

    3. 一旦成功建立，无线电现在就可以开始传输数据。

    4. 现在数据包从无线电传输到基塔（称为**无线资源控制器**或 RRC）。这是设备必须经过的第一个无线跳。[用户平面单向延迟](http://chimera.labs.oreilly.com/books/1230000000545/ch07.html#_initiating_a_request)在
    4G 网络上可能需要 5 毫秒。

    5. 一旦到达 RRC，数据包将发送到核心网络（CN）。CN 连接基塔到全球网络以建立网站请求。CN 的一部分代表连接移动运营商到公共互联网的网关。


    正如你所料的，在处理无线通信时，延迟是一个遗憾的因素。因此，尽量减少 `HTTP` 请求的数量以避免任何额外的延迟问题。发送少数响应较大的 `HTTP` 请求比发送许多响应较小的
    `HTTP` 请求要好。


    下表[^([6])](#ch10.html_ftn.d5e4059) 显示在移动网络上请求 `HTTP` 资源通常会有多少延迟：


    | 移动代际 | 速率 | 延迟 |

    | --- | --- | --- |

    | 2G | 100–400kbit/s | 300–1000ms |

    | 3G | 0.5–5Mbit/s | 100–500ms |

    | 4G | 1–50Mbit/s | < 100ms |


    移动网络和运营商的延迟波动性可能非常大。[虽然 4G 网络将改善延迟](https://www.igvita.com/slides/2013/breaking-1s-mobile-barrier.pdf)，但在所有移动用户切换到
    4G 网络之前还需要很一段时间。


    ### CPU/GPU 与更较少的内存


    CPU 指的是**中央处理器**，它是所有计算机（包括移动设备）的大脑。如今的移动设备处理能力大致相当于五年前的桌面电脑。


