  trans: "\n\n提供带有 API 密钥的试用版本，或者你可以退回到产品的免费云端版本。该版本仅带有设备检测客户端，每月检测次数有限制，且仅支持一个网站。企业版（提供本地版本）提供对运营商识别的无限制访问，并提供[设备属性列表](https://deviceatlas.com/resources/available-properties)，这些属性在云端版本是受限的。\n\
    \nDeviceAtlas [数据浏览器](https://deviceatlas.com/device-data/explorer) 可以让你直观了解从该服务中获取哪些数据和设备属性。\n\
    \n以下代码段显示了传入 iPhone 4 的用户代理字符串以查询其设备属性后的部分输出：\n\n```\n$ php device.php\n$ -------------------------------------------------------------\n\
    \    All Properties:\n    3gp.aac.lc (boolean) : 1\n    displayPpi (integer) :165\n\
    \    js.supportBasicJavaScript (boolean) :1\n    js.geoLocation (boolean) :  1\n\
    \    flashCapable (boolean) :\n    js.json (boolean) : 1\n    isTablet (boolean)\
    \ :\n    isMobilePhone (boolean) :   1\n    browserVersion (string) :   5.0.2\n\
    \    osVersion (string) :    4_2_1\n    browserName (string) :  Safari\n    devicePixelRatio\
    \ (string) : 1\n    js.webSqlDatabase (boolean) :   1\n    stream.httpLiveStreaming\
    \ (boolean) :    1\n    marketingName (string) :    iPhone\n    ...\n```\n\n###\
    \ DeviceMap (免费)\n[DeviceMap](http://incubator.apache.org/devicemap/) 是 Apache\
    \ 的一个开源项目。它的目标创建一个包含移动设备信息的数据仓库。与 WURFL 类似，数据也存储在 XML 中，但它根据设备特性、浏览器和供应商数据被分为几个不同的文件。\n\
    \nDeviceMap 支持 Java、C#、VB.Net 和 JavaScript。提供了一个网页[演示](http://devicemap-vm.apache.org/browsermap/index.html)，让你快速了解可以从\
    \ DDR（设备数据库）中收集到什么类型的信息：\n\n```\n<!-- DeviceDataSource.xml Snippet -->\n<device\
    \ id=\"iPhone\" parentId=\"genericApple\">\n    <property name=\"model\" value=\"\
    iPhone\"/>\n    <property name=\"displayWidth\" value=\"320\"/>\n    <property\
    \ name=\"displayHeight\" value=\"480\"/>\n    <property name=\"device_os_version\"\
    \ value=\"1.0\"/>\n    <property name=\"mobile_browser_version\" value=\"5\"/>\n\
    \    <property name=\"from\" value=\"open_db_modified\"/>\n</device>\n```\n\n\
    ### 创建你自己的 DDR\n如果你不想让别人为你提供设备信息，你可以创建自己的列表，并存储在你偏好的格式中，例如 XML、JSON 等。\n\n例如，在我参与过的一个项目中，我们将设备分为不同的“桶”——“笨”（dumb）”、“智能”（smart）和“触摸”（touch）。具有简单\
    \ WAP 浏览器的设备被归类为“笨”，具有 HTML 浏览器的高级设备被归类为“智能”，具有高级浏览器和触摸手势的设备被归类为“触摸”。我们使用这些桶通过根据用户代理字符串（见下一节）识别设备来区分移动设备。根据用户设备属于哪一个桶，我们不仅提供不同的设计，还提供了不同尺寸的图像。\n\
    \n如果你的移动策略和桶易于管理，且不需要过多的细节挖掘，你可能完全满足于使用 CSS 媒体查询，或许还有一点 JavaScript。\n\n然而，尽管这听起来是一个很棒的计划——与购买商业\
    \ DDR 访问相比，它简单且廉价——但你需要理解这种方法带来的挑战。一个主要问题是，你需要不断维护可用设备列表，这为你的任务列表增加了另一个负担，而且这种负担很容易被忽视。一种可能的解决方案是创建一个\
    \ `cron job`，从商业或开源 DDR 获取新的设备和用户代理字符串，以保持你的设备仓库实时更新。\n\n## 设备检测\n为了利用从设备仓库中收集的信息，我们需要确定确底是哪些设备访问了我们的网站。可以通过几种设备检测方法来实现。\n\
    \n### 快速盘点\n在开始对你的网站使用设备检测之前，我的建议是对你当前的用户及其设备进行快速盘点。你可以使用 Google Analytics 这样的工具获取这些数据。\n\
    \n例如，在我的个人网站 (bbinto.me) 上使用 Analytics 显示，在 10 月，我有 23 个不同的设备访问了我的网站，共有 72 种不同的屏幕分辨率。\n\
    \n现实一点：你无法针对所有的设备、屏幕分辨率、浏览器和连接速度进行优化。然而，所有这些因素对于用户对网站性能和质量的体验仍然起着重要作用。与其对 Analytics\
    \ 中弹出的每一项进行优化，良好的开始是从你收集的列表中选出前五到十项，并专注于这些条目。\n\n现在，让我们看看如何检测用户的设备。\n\n### 标识符：HTTP\
    \ Header\nHTTP 头部（当浏览器请求内容时发送）是设备检测的基础。最有趣且实用的头部是 `user-agent` 字符串。使用用户代理字符串检测设备被称为“用户代理嗅探”（user\
    \ agent sniffing）。你可以使用默认的 Firefox 开发者工具来显示和修改用户代理字符串，如图 10.1 所示\n\n![Firefox\
    \ developer tools' Network Panel view with HTTP headers](img/10-http-header-firefox.png)\n\
    \n图 10.1. *Firefox 开发者工具带有 HTTP 头部的网络面板视图*\n\n通过用户代理字符串，你可以获取浏览器版本、操作系统和设备。\n\n\
    以下是一些常用设备及其用户代理字符串的示例：\n\n*   iPhone 6  Safari:\n    ```\n    Mozilla/5.0 (iPhone;\
    \ CPU iPhone OS 6_1_3 like Mac OS X) AppleWeb\n    Kit/536.26 (KHTML, like Gecko)\
    \ Version/6.0 Mobile/10B329 Safari\n    /8536.25\n    ```\n\n*   iPad  Safari:\n\
    \    ```\n    Mozilla/5.0 (iPad; CPU OS 7_0 like Mac OS X) AppleWebKit/537.51.1\n\
    \    (KHTML, like Gecko) CriOS/30.0.1599.12 Mobile/11A465 Safari\n    8536.25\
    \ (3B92C18B-D9DE-4CB7-A02A-22FD2AF17C8F)\n    ```\n\n*   Galaxy Nexus  Chrome:\n\
    \    ```\n    Mozilla/5.0 (Linux; Android 4.1.1; Galaxy Nexus Build/JRO03O)\n\
    \    AppleWebKit/535.19 (KHTML, like Gecko) Chrome/18.0.1025.166 Mobile Safari/535.19\n\
    \    ```\n\n设备检测背后的基本思想是将访问者浏览器的传入用户代理字符串与你维护的列表进行比较。使用你偏好的 DDR——无论是 WURFL、DeviceAtlas、DeviceMap\
    \ 还是你自己的过滤器——你就可以开始根据设备特性定制用户体验。设备检测最大的优势是内容变得具有上下文感知性。我们可以根据设备的功能和能力为用户提供不同的内容。\n\
    \n执行设备检测有多种选项：\n\n*   **服务端（Server-side）**：检测在服务器上进行，在内容进入浏览器之前决定向客户端提供什么内容。\n\
    *   **CDN**：检测在 CDN 层级进行，而无需返回源服务器获取内容。\n*   *客户端（Client-side）*：检测在浏览器接收到内容后执行。到那时，可能已经提供了不必要的内容。\n\
    *   *客户端提示（Client Hints）*：这种方法尚未完全支持，但它是为不同设备提供正确内容和功能最有前景且最高效的方法。它是客户端和服务器端解决方案的混合体。\n\
    \n"
- fmt: '

    There are several discussions in the web community over what approach to use when
    building performant (mobile) websites, or web apps. On one hand, there''s the
    notion of first sending everything needed to the browser, and then letting the
    client decide what to display. The advantage of this approach is that, once everything
    has arrived at the client''s end, browsing the site is faster, as all the necessary
    assets have already been sent down the wire. But on the other hand, you could
    also let the server decide what content to display `before` even sending it to
    the client—serving only the absolutely necessary assets on first load. This improves
    the time to first byte and initial load time, with more assets subsequently being
    fetched as needed. Server-side programming languages like `PHP`, `Perl`, `ASP.NET`,
    `Java`, `Python`—or even `Edge Side Includes`, sitting on the `CDN`—can be used
    to detect your users'' devices.


    My advice is that, if you can do the device detection on the server, choose this
    over client-side detection. Anything you tell your browser to do once the page
    has arrived only costs power, time, and data.


    Here are some useful tools for server-side device detection:


    * [Detect Mobile Browsers](http://detectmobilebrowsers.com/) is a great resource
    for mobile detection, offering many client-side and server-side solutions.

    * [51 Degrees](http://51degrees.com/Support/Documentation) provides a device management
    system, as well as device detection, in most common server-side programming languages.

    * [Apache Mobile Filter](http://fiftyone.apachemobilefilter.org/) is an `Apache`-based
    filter for detecting mobile devices.


    ## CDN Options


    [Edge Side Includes](http://www.w3.org/TR/esi-lang) (`ESI`) is an XML-based markup
    language. `ESI` support is offered by `CDN` vendors like `Akamai`, `F5` and `Varnish`.
    If you use any of these vendors, you have `ESI` at your disposal. `ESI` can be
    used for caching purposes, which will ultimately help you with mobile performance.


    If you''re familiar with [Server Side Includes](http://en.wikipedia.org/wiki/Server_Side_Includes)
    (`SSI`) and `XML/XSLT`, you''ll have no problem understanding `ESI`. It supports
    access to variables based on `HTTP request attributes`. For example, you can easily
    check for any field in the `HTTP_HEADER`, and hence also for the `HTTP_USER_AGENT`
    attribute.


    `ESI` can also include snippets of additional content via an `include` command.
    To make this even more powerful, `ESI` supports conditional processing, which
    means logic can be applied to execute specific content via an `include`, based
    on specific conditions like user agent strings. For example, you could include
    a map just for GPS capable devices, or only show a big video on desktop devices.
    All of this is done by the edge server—the server that is closest to the user.
    Users will never get content they''re not supposed to receive, and no data is
    sent down the wire that isn''t required. Additionally, when processing `ESI`,
    there''s no need to go back to the origin for processing, and thus the load at
    the origin is cut down.


    You can create a device list by assigning a regular expression to an `ESI` variable,
    and use this to detect user agent strings, like this:


    ```

    <esi:comment text="Regular expression to match tablets'' user agents"/>

    <esi:assign name="tablet" value="''(iPad|Nexus 10|PlayBook|Xoom|hp-tablet|Dell
    Streak)''"/>

    ```


    You could use `WURFL`, or any other device catalog, to populate this variable
    automatically, based on the latest devices and your defined criteria.


    ## Client-side Options


    Client-side device detection is executed on the client, thus working with already-delivered
    content. If you''ve decided to use a client-side approach, you can easily detect
    the user agent string by requesting the value of `navigator.userAgent` in `JavaScript`.


    Detect Mobile Browsers offers client-side options. [Device.js](https://github.com/matthewhudson/device.js/)
    is another, small (3KB) and solid `JavaScript` solution for detecting devices,
    and targeting the user experience based on that.


    ## Client Hints


    Most solutions discussed so far come with a price: you either have to use your
    web server (potentially relying on commercial DDRs), leverage your `CDN` for device
    detection features, or (if you can''t do either of these), use client-side options
    to do the heavy lifting.


    [Client Hints](https://github.com/igrigorik/http-client-hints) will land some
    time in the near future, offering a hybrid client/server-side solution. But how
    will it work? The user agent information stored in the `HTTP header` is used by
    `Client Hints` to make decisions about resources to be loaded for this specific
    client. The user agent gives the server hints on its capabilities, and hence won''t
    be asked to load resources that it doesn''t require—resulting in reduced overhead,
    as the logic is executed on the server.


    The current implementation status for `Client Hints` notes that `IE` is [considering](https://status.modern.ie/httpclienthints?term=client%20hints)
    the implementation, while Mozilla has filed a [bug report](https://bugzilla.mozilla.org/show_bug.cgi?id=935216)
    on it. The [entire draft](https://tools.ietf.org/html/draft-grigorik-http-client-hints-02)
    can be found on the `IETF` website.


    ## Disadvantages of User Agent Sniffing


    All of the approaches mentioned above rely on the user agent; and although the
    user agent is today''s go-to solution for detecting a visitor''s device, pure
    user agent sniffing suffers from several disadvantages:


    * The user agent string doesn''t include any information about—for example, the
    device''s screen width or height, and therefore can''t reliably identify all static
    variables.

    * In order to adapt and optimize content for different devices, the user agent
    detection requires a device database that can be costly to maintain.

    * User agent detection is not cache friendly, and therefore has to be executed
    every time the user visits your page.

    * User agent strings are not structured data and can be modified. (Some devices
    even lie about their true identity!)


    ## Device Testing


    Nowadays, it''s not enough to simply test your website on a range of desktop browsers,
    such as `Chrome`, `Safari`, `Firefox`, `Opera` or `Internet Explorer`. The multi-device
    macrocosm has added more challenges for us—different devices with different capabilities,
    different screen sizes, and many different connection speeds. We now have to plan
    for these challenges when building websites. If you work in a bigger company,
    you might be lucky enough to have access to a device lab with many different devices.
    If not, I''ll share some tips on how to get your website tested on a range of
    devices.


    It''s virtually impossible to test every single device or screen size out there.
    You can use the device inventory you''ve created, as described earlier, to help
    you set a baseline for what you''re going to support. If you don''t currently
    use analytics or tracking, now is the time to do it. The data it provides is extremely
    helpful in optimizing your performance.


    Once you''ve established the device list you want to support, you can start testing.


    ### Simulators


    There are various simulators you can use to simulate your web pages on different
    devices. Here''s a selection:


    * [User Agent Switcher](http://chrispederick.com/work/user-agent-switcher/) is
    a browser extension that can simulate different user agent strings, thus helping
    to debug various issues on the spot. Switching the user agent to a mobile device
    will help you simulate how your website looks on a mobile browser. There are other
    browser extensions for mimicking a different user agent. And recent versions of
    `Chrome` come with a user agent switcher built in.

    * [BrowserStack](http://www.browserstack.com/) is a commercial, online tool that''s
    really handy if you can''t afford to build a physical device lab. You can test
    your website on many different browsers, and debug your HTML, CSS and JavaScript
    with the handy developer tools included.

