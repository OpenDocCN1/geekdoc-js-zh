- fmt: "\n| Region | Q1 2014 Average Mbps |\n| --- | --- |\n| Global | 3.9 |\n| South\
    \ Korea | 23.6 |\n| Japan | 14.6 |\n| Hong King | 13.3 |\n| Switzerland | 12.7\
    \ |\n| Netherlands | 12.4 |\n| Latvia | 12 |\n| Sweden | 11.6 |\n| Czech | 11.2\
    \ |\n| Finland | 10.7 |\n| Ireland | 10.7 |\n\nHowever, while bandwidth will likely\
    \ improve in years to come, the latency that comes with it is not an easy problem\
    \ to solve. Improving latency requires updates and enhancements—such as shorter\
    \ cables through the oceans.\n\n## Last Mile Latency\n\n`Last mile latency` refers\
    \ to the latency between your request and your Internet service provider (ISP).\
    \ Although you may think most of the latency comes from the travel time between\
    \ the cabling from continent A to B, it's actually on the way from your browser\
    \ to your ISP where most of the latency bottleneck resides. This latency depends\
    \ on the cabling from the end user's house to the provider, the technology being\
    \ deployed, and the time of the day. Picking a provider based on these criteria\
    \ will help to reduce latency for the end user. However, this is something you\
    \ can't much influence as a website owner.\n\n`traceroute` is a command line tool\
    \ for measuring latency (for example, between you and your ISP). Here's an example:\n\
    \n```\ntraceroute to bbinto.me (23.229.170.160), 64 hops max, 52 byte \npackets\n\
    1  7.11.164.201 (7.11.164.201)  22.272 ms  8.525 ms  8.197 ms\n2  7.11.164.201\
    \ (7.11.164.201)  7.846 ms  11.971 ms  33.085 ms\n3  209.148.243.105 (209.148.243.105)\
    \  24.445 ms  13.891 ms  11.978 \nms // my ISP\n...\n13 be38.trmc0215-01.ars.mgmt.phx3.gdg\
    \ (184.168.0.69)  100.097 ms  \n67.337 ms  74.092 ms\n```\n\nLine #3 shows the\
    \ latency to my ISP, measured three times, ranging from around `12ms` to `25ms`.\
    \ The first column describes the hops that the request has to “go through” to\
    \ get to bbinto.me. It took 13 hops to get to bbinto.me: line #13 describes the\
    \ GoDaddy server, the final destination.\n\n## Monitoring Performance\n\nSo far,\
    \ we've looked at some of the tools for measuring site performance. In this section,\
    \ we'll focus on two techniques for monitoring site performance. The first, known\
    \ as “synthetic testing”, involves devising our own discrete tests. The second,\
    \ known as “real user monitoring”, involves studying actual end user behavior.\n\
    \n### Synthetic Measurements\n\n`Synthetic` testing is the most common and controllable\
    \ measurement tool available to developers. As opposed to real user monitoring,\
    \ synthetic testing is done by you and is in your control. You decide when and\
    \ how to run a test on your website. You can choose the specific conditions, such\
    \ as the browser, network condition and/or geographical location.\n\nYou can use\
    \ the free tools we've already discussed to conduct synthetic tests—tools such\
    \ as `WebPagetest`, `PageSpeed Insights`, or even your browser's developer tools.\n\
    \n### WebPagetest\n\nWe briefly discussed `WPT` earlier in this chapter. Let's\
    \ look at some of its other features that enable us to perform synthetic tests\
    \ on our sites.\n\n[Figure 3.11](#ch03.html_ch3-wp-intro \"Figure 3.11. Basic\
    \ view of the WPT interface, waiting for your input\") shows an overview of its\
    \ main functionality:\n\n![Basic view of the WPT interface, waiting for your input](OEBPS/figures/3-wp-intro.png)\n\
    \nFigure 3.11. Basic view of the WPT interface, waiting for your input\n\nThe\
    \ input is split into two sections—the basic information, such as the URL to test,\
    \ and the advanced settings, such as defining how many times the test should run.\n\
    \nLet's first look at the basic settings:\n\n* **Test Location**: choose the geographical\
    \ location you want to get performance results for. This might be where most of\
    \ your visitors come from, or even where barely any of your visitors come from.\
    \ You might also choose a location based on complaints you've received—say from\
    \ visitors in a country where the experience was poor.\n* **Browser**: you can\
    \ choose from a wide selection of browsers, including several mobile versions.\n\
    \nThere are many different options you can choose under the Advanced Settings.\
    \ For example, `Connection` lets you define exactly what connection speed should\
    \ be used to test the URL, the `Repeat View` helps you review the site's performance\
    \ with and without caching. The `Number of Tests to Run` helps you find the average\
    \ of all runs combined. You can also record the test as a video, labeled as you\
    \ like. If the site to be tested needs authentication, you can use the `Auth`\
    \ tab to fill in the required credentials.\n\n[Figure 3.12](#ch03.html_ch3-wp-advanced\
    \ \"Figure 3.12. WPT's Advanced Settings interface\") shows the Advanced Settings:\n\
    \n![WPT's Advanced Settings interface](OEBPS/figures/3-wp-advanced.png)\n\nFigure\
    \ 3.12. WPT's Advanced Settings interface\n\n#### Result Page\n\nThe `WebPagetest`\
    \ result page provides a wealth of performance data—such as an `ATF` filmstrip,\
    \ an evaluation of how many bytes are coming from third-party scripts as opposed\
    \ to your own domain, and details of when the CPU time of the browser hit its\
    \ peak.\n\nAs an example, I typed in `Time.com` with the location of `Dulles,\
    \ VA` with `Firefox` on a cable connection as my test scenario. The following\
    \ figure shows the corresponding result:\n\n![WPT result page for Time.com](OEBPS/figures/3-wpt-results.png)\n\
    \nFigure 3.13. WPT result page for Time.com\n\nConsidering each of the numbered\
    \ items in this screenshot in turn:\n\n1. The grading area (top right) gives you\
    \ a brief overview of how the site performs. The more greens and A's there are,\
    \ the better.\n2. There are several views to check out: the `Summary` tab gives\
    \ you a brief but sufficient overview of the performance of the tested website.\n\
    3. The table has a breakdown of the most important metrics. We discussed most\
    \ of them earlier. The two rows contain data collected in the first run (or test)—assuming\
    \ the site has not been visited before (`First View`)—and the second test run\
    \ (`Repeat View`). The second run reveals whether or not the site is utilizing\
    \ caching (and if so, how's doing so).\n4. The rest of the result page includes\
    \ waterfalls and screenshots illustrating the path your website has taken to render\
    \ itself. The waterfall is color coded to help you understand where each asset\
    \ spent most of its time loading.\n5. There are some additional tools (not pictured)\
    \ that you can utilize, such as exporting the test results in `HAR` or `CSV` formats\
    \ for further investigation.\n\n#### Note: What's HAR?\n\nThe official format\
    \ of HTTP Archive files is called `HAR`. It's a `JSON` format that provides an\
    \ easy way of exchanging network waterfalls (see below), saving you from having\
    \ to share screenshots. `HAR` is a file format that can be exported and imported\
    \ into many other [tools](https://gist.github.com/igrigorik/3500508).\n\n#####\
    \ WPT's Waterfall\n\nIn my opinion, `WPT`s waterfall is the best available tool\
    \ for investigating performance issues—providing much more information than those\
    \ included in browser developer tools.\n\n##### Domain and Content Breakdown\n\
    \nThe domain and content breakdown is very useful for evaluating the impact of\
    \ third party scripts, and identifies right away what type of content occupies\
    \ most of your bytes and requests.\n\n### Note: Get Yourself In Line\n\nIf you\
    \ run many tests on the public WebDetailPage instance, and depending on the time\
    \ of the day, you will notice it can get really busy. Your test runs might end\
    \ up in the queue next to many other tests from other users. If you feel your\
    \ tests can't always wait, I would suggest you consider installing your [own WPT\
    \ instance](https://sites.google.com/a/webpagetest.org/docs/private-instances).\
    \ It definitely gives you more flexibility and freedom when running tests. Otherwise,\
    \ you'll need to wait in line, until your performance test is called by the WPT\
    \ engine.\n\n##### Unique ID\n"
