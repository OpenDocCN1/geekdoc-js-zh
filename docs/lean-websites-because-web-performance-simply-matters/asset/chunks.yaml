  trans: '

    每次 `WPT` 运行都有一个唯一的 ID，你随时可以在以后在浏览器中引用它并进行审查，例如 [`www.webpagetest.org/result/140721_5F_1KP/`](http://www.webpagetest.org/result/140721_5F_1KP/)。


    我可以为 `WPT` 写一整本书，但有些聪明人[已经这么做过了](http://shop.oreilly.com/product/0636920033592.do)。此外，[WPT
    论坛](http://www.webpagetest.org/forums/) 是分享想法和提问的好佳地方。


    ## PageSpeed Insights


    `PageSpeed Insights`（在本章前面的部分介绍）提供了一个对特定网站运行合成性能测试的接口。测试完成后，你将看到类似如图所示的结果页：


    ![PageSpeed Insights data for time.com](img/3-pagespeed-result.png)


    图 3.14. time.com 的 `PageSpeed Insights` 数据


    `PageSpeed Insights` 缺乏 `WPT` 的一些功能，例如高级设置、测试位置选择、非常详细的瀑布视图以及每个测试的唯一 ID。`PageSpeed
    Insights` 只允许你输入网站的 URL。然而，它会自动包含移动用户的测试结果（这是 `WPT` 用户需要明确选择的）。与 `WPT` 相比，`PageSpeed
    Insights` 更关注优化，为优化网站提供帮助建议。


    ## 浏览器扩展与插件


    各种浏览器插件和扩展提供了测试网站性能的其他方法。像 `Firebug`、`YSlow` 和 `PageSpeed Insights` 等扩展允许你通过浏览器即时分析网站。


    以下是某些可用工具及其功能的简要总结：


    *   [**Firebug**](http://getfirebug.com/) 帮助你检查、记录、剖析、分析和调试你在浏览器中查看的页面。`Net` 标签页对于分析性能特别有用，因为它以非常详细的瀑布视图展示所有的
    `HTTP` 请求。


    *   [**YSlow**](https://developer.yahoo.com/yslow/) 可以作为 `Firebug` 扩展的附加组件，也可以作为独立插件添加到大多数浏览器中。`YSlow`
    是针对 `PageSpeed Insights` 和 `WPT` 的浏览器插件解决方案。`YSlow` 根据 [Yahoo 的高性能网站规则](https://developer.yahoo.com/performance/rules.html)
    分析你的网页。它包含不仅能帮助你进行诊断，还能进行即时分级的工具。


    *   [**PageSpeed Insights**](https://developers.google.com/speed/pagespeed/insights_extensions)
    可作为 `Chrome` 和 `Firefox` 的插件可用，提供如何让页面变快的建议。此外，它还根据几条[规则](https://developers.google.com/speed/docs/insights/rules)
    对页面进行评分。


    *   [**ShowSlow**](http://www.showslow.com/) 是一个开源网站服务也是浏览器插件，帮助你监控性能模式。它结合了主流性能工具的结果，包括
    `YSlow`、`Page Speed` 和 `WebPageTest`。


    ## 高级分析与编程工具


    除了上述工具，你还可以使用一些高级分析和编程工具进行合成测量。


    ### 查询能力 = Big Query + HTTP Archive


    当前的 `HTTP Archive` `SQL` 导出大约有 400GB 的原始数据。你可能不想下载并导入到你的数据库中。使用一个已经导入了所有数据并准备好你查询的工具如何？答案是
    [Big Query](https://cloud.google.com/bigquery/what-is-bigquery)。`Big Query` 是一个
    Google 数据库工具，允许你通过浏览器查询大型数据集。你可以轻松地将 `HTTP Archive` 项目加载到你的 `Big Query` 配置中，并对
    `HTTP Archive` 运行任何喜欢的查询，同时享受极速的 Google 基础设施。


    如果你想问一些 `HTTP Archive` 未回答的问题，这个工具非常有用。例如，最常见的第三方脚本是什么？查看 [BigQueri.es](http://bigqueri.es/)，这是一个用于寻找各种性能问题答案的绝佳社区资源。


    ### APIs


    如果你想避免手动监控和测量，我建议你查看一下提供的某些 `APIs`。通过 `APIs`，你可以轻松创建实用的工具和集成检查。它们可以消除手动打开浏览器的需求。

