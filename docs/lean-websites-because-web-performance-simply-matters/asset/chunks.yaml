    \ I'm closer to understanding my actual, real users. For example, knowing their\
    \ average connection speed will help me decide if my audience arrives at my site\
    \ via high-speed connection or lower-speed connections. I can then cater for that\
    \ specific scenario—perhaps by serving fewer or smaller images, or avoiding specific\
    \ assets altogether.\n\n### Tip: Help with Getting Boomerang Set Up\n\nIf you\
    \ need additional help with setting up RUM, I suggest that you read up on [the\
    \ boomerang how-to docs](http://www.lognormal.com/boomerang/doc/howtos/) or use\
    \ [Captain Rum](https://github.com/bbinto/captain-rum), a simple script that I\
    \ created.\n\nRather than creating your own beacon solution, you could use the\
    \ [Beacon API](http://www.w3.org/TR/beacon/), introduced by the World Wide Web\
    \ Consortium (W3C)—though it's currently in working draft, and not supported by\
    \ IE or Safari as yet. Its intent is to make it easier for web developers to send\
    \ analytics or diagnostic information back to the server.\n\n### Warning: RUM\
    \ and High-traffic Sites\n\nIf your website receives a lot of traffic, you'll\
    \ encounter a huge amount of beacon data in your log files. Hence, parsing the\
    \ log files and extracting the data can be slow. Consider introducing some code\
    \ to use a lower sample rate, or just enable the code during specific times of\
    \ the day.\n\n### Set Up Alerts\n\nMonitoring your site with automated alerts—which\
    \ notify you if something unwanted happens to your website—is a useful technique\
    \ for avoiding surprises. There are several commercial products available, as\
    \ well as free tools.\n\nHere are some examples of basic alerts you can set up\
    \ for your website:\n\n*   Get notified if your website is not available to your\
    \ visitors.\n\n*   Get notified if any issues occur based on geographic or platform-specific\
    \ events.\n\n*   Get notified if performance measurements reach a specific threshold,\
    \ such as page load times exceeding 10 seconds, or server response times exceeding\
    \ two seconds.\n\n#### Google Analytics\n\nIf you already use Google Analytics,\
    \ you may as well leverage its free custom alerts. While I mentioned that Analytics\
    \ only uses sampled data, and relies on the average measurements instead of the\
    \ median to calculate performance metrics, it is still a quick and easy alert\
    \ tool. Go to Admin -> Custom Alerts to create your [custom alert](https://www.igvita.com/2012/11/30/web-performance-anomaly-detection-with-google-analytics/),\
    \ as shown in [Figure 4.12](#ch04.html_ch4-ga \"Figure 4.12. Setting an alert\
    \ in Google Analytics\"):\n\n![Setting an alert in Google Analytics](OEBPS/figures/4-alerts-plt-google.png)\n\
    \nFigure 4.12. Setting an alert in Google Analytics\n\n#### Pingdom\n\nThough\
    \ Pingdom is a commercial monitoring tool, it's also available in a [free limited\
    \ version](https://www.pingdom.com/free/). The free version might be enough if\
    \ you only want RUM reporting and alerts of website downtime. A great feature\
    \ of Pingdom is that it allows you to choose between “average” or “median” measurement.\n\
    \nThe following [Figure 4.13](#ch04.html_ch4-pingdom \"Figure 4.13. Setting a\
    \ downtime alert in Pingdom\") screenshot shows how to set up alerts to notify\
    \ you when your website is down:\n\n![Setting a downtime alert in Pingdom](OEBPS/figures/4-alerts-downtime.png)\n\
    \nFigure 4.13. Setting a downtime alert in Pingdom\n\n#### CopperEgg\n\n[CopperEgg](http://copperegg.com/)\
    \ is one of many commercial tools that provides flexibility in setting up alerts,\
    \ RUM, and other measurements. The [Figure 4.14](#ch04.html_ch4-copperegg \"Figure 4.14. Setting\
    \ an alert in CopperEgg\") screenshot below shows an example of how granular you\
    \ can get when setting up alerts for specific performance metrics. It's a handy\
    \ suite of monitoring tools that will give you peace of mind.\n\n![Setting an\
    \ alert in CopperEgg](OEBPS/figures/4-alerts-copperegg.png)\n\nFigure 4.14. Setting\
    \ an alert in CopperEgg\n\n## Set up a Performance Budget\n\nBy setting a **performance\
    \ budget**, you can ensure that a defined baseline in values for various performance\
    \ metrics should not be exceeded. For example, this could mean setting target\
    \ values for page size or the amount of HTTP requests used on a page.\n\nFinding\
    \ a budget that is realistic, measurable, and achievable is a great start for\
    \ a leaner website. It provides goals that the whole team can focus on, and will\
    \ help you answer questions like “What are we trying to improve?” and “What will\
    \ the measurement for success be?”\n\nBut where to start? How do you set up a\
    \ budget for your website?\n\nHere are some pointers to help you set a budget\
    \ and stick to it:\n\n*   **Assess the standards of your competitors**: your competitors'\
    \ metrics can help you establish a performance baseline.\n\n*   **Create performance\
    \ hypotheses to strengthen business metrics**: come up with assumptions on how\
    \ to make your website more successful by making it faster.\n\n*   **List and\
    \ commit to your performance budget**: in order to stick to your budget, you need\
    \ to publish it, and commit to your performance metrics and thresholds.\n\nLet's\
    \ take a look at each of these in more detail.\n\n### Competitive Comparison\n\
    \n> “The wise learn many things from their enemies.” — Aristophanes\n\nOnce you\
    \ have your current site performance data, it can sometimes be difficult to determine\
    \ which results should be improved. One idea is to compare your performance results\
    \ with those of your competitors.\n\nWPT is a great resource for running competitive\
    \ analysis. Click the Visual Comparison tab when you first land on the WPT website.\
    \ It lets you add several different websites for comparison. Comparing your site\
    \ with a competitor's can give you a useful and tangible baseline for your website's\
    \ performance.\n\nFor example, let's assume you have a clothing retail website.\
    \ You'd probably want to make sure that users could browse your landing page faster\
    \ than a competing clothing retail site. That's where you can apply the WPT “Visual\
    \ Comparison” tool.\n\nFor now, let's call your site Website A, and the competitor's\
    \ site Website B.\n\n1.  Go to WPT and click the Visual Comparison tab. Type in\
    \ your website and your competitor's website to retrieve the comparative performance\
    \ data and filmstrips, as shown in [Figure 4.15](#ch04.html_ch4-visual \"Figure 4.15. Starting\
    \ a visual comparison on WPT\").\n\n    ![Starting a visual comparison on WPT](OEBPS/figures/4-visual-comparison.png)\n\
    \n    Figure 4.15. Starting a visual comparison on WPT"
