  trans: "\n\n让我们将前面示例中显示的文件使用 Google 的 [Closure Compiler](http://closure-compiler.appspot.com/home)\
    \ 进行合并。下载 Java [jar 文件](https://code.google.com/p/closure-compiler/downloads/list)\
    \ 并执行以下命令之一：\n\n```\njava -jar compiler.jar --js_output_file=concat.js 1.js 2.js\
    \ 3.js ...\n\n# 递归包含子目录下的所有 js 文件\njava -jar compiler.jar --js_output_file=concat.js\
    \ 'src/**.js'\n```\n\n### 提示：没有 Java？\n\nClosure Compiler 的本地版本需要安装 Java 并通过 Java\
    \ CLI 运行时运行。如果你不想通过命令行使用 Java，可以使用[在线版](http://refresh-sf.com/yui/)的 Closure Compiler。\n\
    \n### 图像雪碧 (Image Spriting)\n\n`image spriting` 的核心思想是减少加载页面图像所需的 HTTP 请求。雪碧技术通过将每个较小的单独图像组合成一张大图，然后在定义的\
    \ `X` 和 `Y` 坐标处显示该图的一小部分（即 `sprite`，精灵）。这样，你就不需要为每个图像发送多次 HTTP 请求，而只需要一次 HTTP\
    \ 请求。\n\n让我们通过一个示例来展示它是如何工作的。假设我有四张想要显示在页面上的植物图像——盆里的草丛、一棵树、一片叶子和一个盆栽。与其像这样使用单独的图像标签（产生四次\
    \ HTTP 请求）来显示每张植物图像：\n\n```\n<img src=\"img/planter.png\"/>\n<img src=\"img/tree.png\"\
    />\n<img src=\"img/leaf.png\"/>\n<img src=\"img/pot.png\"/>\n```\n\n我们可以使用 [CSS\
    \ Sprites Generator](http://csssprites.com/) 创建雪碧图，这是一个在线工具，允许你单独上传每张图像，并创建所需的\
    \ CSS 以及雪碧图（见下文）：\n\n![使用 CSS Sprites Generator 创建雪碧图和相应的 CSS](img/5-css-sprites-tool.png)\n\
    \n图 5.8。使用 CSS Sprites Generator 创建雪碧图和相应的 CSS\n\n现在我们可以使用生成的雪碧图和 x/y 坐标在页面中显示每张植物图像：\n\
    \n```\n<style type=\"text/css\">\n   div {\n       background: url('img/sprite.png');\n\
    \   }\n   .planter {background-position: -0px -0px; width: 107px; height: 81px}\n\
    \   .tree {background-position: -0px -91px; width: 46px; height: 52px}\n   .leaf\
    \ {background-position: -0px -153px; width: 47px; height: 55px}\n   .pot {background-position:\
    \ -0px -218px; width: 42px; height: 79px}\n </style>\n<!-- planter -->\n<div class=\"\
    planter\"></div\n<!-- tree -->\n<div class=\"tree\"></div\n<!-- leaf -->\n<div\
    \ class=\"leaf\"></div\n<!-- planted pot -->\n<div class=\"pot\"></div\n```\n\n\
    让我们在 WPT 中查看这些示例页面，首先是在不使用雪碧的情况下（图 5.9），然后是使用雪碧的情况下（图 5.10）：\n\n![使用 img 标签的未使用雪碧的示例页面](img/5-css-sprites-tool.png)\n\
    \n图 5.9. 使用 img 标签的未使用雪碧的示例页面\n\n图 5.10. 使用雪碧的页面\n\n### 代码压缩 (Minification)\n\n\
    代码压缩是在不改变文件功能的情况下减小文件大小的过程。这通常涉及移除不必要的字符，如注释、空白符以及缩短变量名。\n\n"
- fmt: "\n# Pre-browsing is a performance optimization technique, and refers to an\
    \ attempt to anticipate the user's interactions with your page—such as loading\
    \ assets prior to the user requesting them. [Resource hints](http://w3c.github.io/resource-hints/)—which\
    \ are [pre-browsing attributes](https://docs.google.com/presentation/d/18zlAdKAxnc51y_kj-6sWLmnjl6TLnaru_WH0LJTjP-o/edit#slide=id.p19)\
    \ added to the `link` tag—aim to help the browser predict your user's next steps\
    \ by proactively telling the browser what to prefetch.\n\nFor example, you probably\
    \ know where your users are headed most often on your site. You may be able to\
    \ use some of the following options to preload certain resources that you know\
    \ the browser will need to fetch for the next visited page.\n\nLet's check out\
    \ the resource hint attributes.\n\n### `rel=\"dns-prefetch\"`\n\nAs we saw earlier,\
    \ DNS lookups can take up additional time to load assets. DNS prefetching reduces\
    \ the time it takes to look up the domain by resolving it in advance.\n\nDNS prefetching\
    \ is useful when you have several links on your page referring to external websites\
    \ (that is, pointing to different domains). It reduces latency when the user actually\
    \ clicks on one of the external links. It's effectively telling the browser in\
    \ advance, “Hey buddy, I'm planning to use this domain.”\n\nThis tag should be\
    \ placed in the head of your page, and only be used for critical resources with\
    \ different domains. Don't include all the domains of your external links in the\
    \ head, as this might only increase the page load time.\n\nThe example below adds\
    \ DNS prefetching for the Flickr domain, as this domain is being used for images\
    \ in a photo gallery, later on in the page:\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <link rel=\"shortcut icon\" href=\"../../favicon.ico\"\n↵ type=\"\
    image/x-icon\"/>\n    <!-- ... -->\n    <link rel=\"dns-prefetch\" href=\"https://farm3.staticflickr.com\"\
    \ />\n    <title>My website</title>\n</head>\n<body>\n    <!-- ... -->\n    <img\
    \ src=\"https://farm3.staticflickr.com/2076/2378396331_f550196\n↵025.jpg\">\n\
    </body>\n</html>\n```\n\n### `rel=\"subresource\"`\n\nThis resource hint allows\
    \ pointing of the browser to another resource that you want to use later on in\
    \ the current page, and which therefore should be downloaded as a high priority.\
    \ Subresource resources are fetched with high priority as soon as they are encountered\
    \ by the loader.\n\nBy using this resource hint, you can optimize the user experience\
    \ on your site, as any resource marked as `subresource` is loaded faster. For\
    \ example, this technique is very useful if you want to load resources such as\
    \ important JSON files, or a logo, in advance.\n\nPlace this tag in the head of\
    \ your HTML as early as possible. The resources fetched should just be critical\
    \ resources for the **current** page. In the example below, it's a JSON file and\
    \ a logo:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n\
    \    <link rel=\"subresource\"  href=\"data.json\" />\n    <link rel=\"subresource\"\
    \  href=\"logo.jpg\" />\n    <title>My website</title>\n</head>\n<body>\n\n  \
    \  <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\n    <script>\n        $.getJSON(\
    \ \"data.json\", function( data ) {\n            //\n        });\n    </script>\n\
    </body>\n</html>\n```\n\n### `rel=\"prefetch\"`\n\nYou can hint to the browser\
    \ that an individual resource—or an entire site—should be prefetched, by including\
    \ the `prefetch` pre-browsing attribute in the head of your page. For example,\
    \ you could use the prefetch hint to load images that are used throughout your\
    \ site, and not just on your current page.\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <!-- ... -->\n    <link rel=\"subresource\" href=\"logo.jpg\"\
    \ />\n    <link rel=\"prefetch\" href=\"footer.jpg\" />\n    <title>My website</title>\n\
    </head>\n<body>\n    <!-- ... -->\n    <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\
    \n      <img src=\"footer.jpg\"/>\n</body>\n</html>\n```\n\nAfter the browser\
    \ has dealt with all critical subresources, it will start getting footer.jpg.\
    \ Please note that the prefetch hint is considered to be the [lowest possible\
    \ priority](https://medium.com/@luisvieira_gmr/html5-prefetch-1e54f6dda15d) hint.\n\
    \nTherefore, `subresource` and `prefetch` differ in their priorities as well as\
    \ their semantics: use `subresource` to load a resource with high priority within\
    \ the current page, whereas the `prefetch` resource is loaded with lower priority\
    \ but can refer to a resource used on a different page of your site.\n\n### `rel=\"\
    prerender\"`\n\nWith a use case similar to that of `prefetch`, `prerender` kicks\
    \ off by loading an entire page in the background (including all of its assets).\
    \ As I'm sure you can imagine, this event is quite resource heavy, and should\
    \ only be used if it's really needed! You could use this for a checkout process,\
    \ for example, where you can predict the subsequent pages the user will hit.\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n    <link\
    \ rel=\"prerender\" href=\"step-2.html\" />\n    <title>Check-Out Step 1</title>\n\
    </head>\n<body>\n    <!-- ... -->\n</body>\n</html>\n```\n\n### Browser Support\n\
    \nSince some of these resource hint attributes are fairly new (at the time of\
    \ writing), browser makers are still in the process of implementing them. Here's\
    \ a table of current support:\n\n| Browser | dns-prefetch | subresource | prefetch\
    \ | prerender |\n| --- | --- | --- | --- | --- |\n| Firefox | 3.5+ | n/a | 3.5+\
    \ | n/a |\n| Chrome | 1.0+ | 1.0+ | 1.0+ | 1.3+ |\n| Safari | 5.01+ | n/a | n/a\
    \ | n/a |\n| IE | 9+ | n/a | 10+ | 11+ |\n\nAs you can tell from the table above,\
    \ `dns-prefetch` seems to be supported by most browsers—and therefore, if used\
    \ properly, should improve a site's performance. Some external scripts could potentially\
    \ have a long DNS lookup, so we could use this attribute to improve the load time.\n\
    \n## Cool Down\n\n*   You've learned how the browser works, so you understand\
    \ when and how assets are being rendered.\n*   The CRP defines the resources that\
    \ are needed to render the initial view of the page (above the fold).\n*   You've\
    \ learned about the 14KB rule, and how to prioritize the visible content of your\
    \ page.\n*   You've been taken through an exercise on how to optimize the CRP.\n\
    *   Reducing and optimizing HTTP requests is the key for efficient web performance.\n\
    *   You've learned techniques to reduce and optimize HTTP requests by applying\
    \ concatenation and minification.\n*   Don't just concatenate everything. Differentiate\
    \ between context-based and frequency-based concatenation.\n*   You've learned\
    \ how spriting works, and that it reduces HTTP requests when serving images.\n\
    *   You got a glimpse of how predictive browsing works, and learned about new\
    \ tags for preloading assets—pre-fetch`, `dns-prefetch` etc.\n\n# Chapter 6\n\n\
    ## Producing Lean Web Assets: Part 1\n\n## Warm Up\n\nWhile the previous chapter\
    \ explored techniques for reducing and optimizing HTTP requests in general, this\
    \ chapter will focus on optimizing individual web assets such as HTML, CSS, and\
    \ JavaScript.\n\n## Optimizing HTML\n\nWhen writing HTML, make sure it is semantic,\
    \ valid, and as lean as possible. The more errors your code contains, and the\
    \ more nested elements you have, the more work you are requiring of the browser.\
    \ (The browser will do its best to correct your errors as it constructs the DOM,\
    \ but there's only so much it can do.)\n\nMove any inline styles from HTML elements\
    \ into your style sheets. For example, instead of writing `<div style=\"color:red\"\
    >`, use `div {color:red}` in a separate style sheet.\n\n### Keeping Things Tidy\n\
    \nThere are several tools that can help you keep your HTML in good shape, such\
    \ as HTML Tidy](http://www.html-tidy.org/), a command line tool that you can [download\
    \ from GitHub](https://github.com/htacg/tidy-html5) and install on your computer.\
    \ (There is also an [older command line version](http://tidy.sourceforge.net/),\
    \ which has a handy [online](http://infohound.net/tidy/) equivalent, though these\
    \ are a little old now and don't include support for HTML5.)\n"
  raw: "**Pre-browsing** is a performance optimization technique, and refers to an\
    \ attempt to anticipate the user's interactions with your page—such as loading\
    \ assets prior to the user requesting them. [**Resource hints**](http://w3c.github.io/resource-hints/)—which\
    \ are [pre-browsing attributes](https://docs.google.com/presentation/d/18zlAdKAxnc51y_kj-6sWLmnjl6TLnaru_WH0LJTjP-o/edit#slide=id.p19)\
    \ added to the `link` tag—aim to help the browser predict your user's next steps\
    \ by proactively telling the browser what to prefetch.\n\nFor example, you probably\
    \ know where your users are headed most often on your site. You may be able to\
    \ use some of the following options to preload certain resources that you know\
    \ the browser will need to fetch for the next visited page.\n\nLet's check out\
    \ the resource hint attributes.\n\n#### `rel=\"dns-prefetch\"`\n\nAs we saw earlier,\
    \ DNS lookups can take up additional time to load assets. DNS prefetching reduces\
    \ the time it takes to look up the domain by resolving it in advance.\n\nDNS prefetching\
    \ is useful when you have several links on your page referring to external websites\
    \ (that is, pointing to different domains). It reduces latency when the user actually\
    \ clicks on one of the external links. It's effectively telling the browser in\
    \ advance, “Hey buddy, I'm planning to use this domain.”\n\nThis tag should be\
    \ placed in the head of your page, and only be used for critical resources with\
    \ different domains. Don't include all the domains of your external links in the\
    \ head, as this might only increase the page load time.\n\nThe example below adds\
    \ DNS prefetching for the Flickr domain, as this domain is being used for images\
    \ in a photo gallery, later on in the page:\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <link rel=\"shortcut icon\" href=\"../../favicon.ico\"\n↵ type=\"\
    image/x-icon\"/>\n    <!-- ... -->\n    <link rel=\"dns-prefetch\" href=\"https://farm3.staticflickr.com\"\
    \ />\n    <title>My website</title>\n</head>\n<body>\n    <!-- ... -->\n    <img\
    \ src=\"https://farm3.staticflickr.com/2076/2378396331_f550196\n↵025.jpg\">\n\
    </body>\n</html>\n```\n\n#### `rel=\"subresource\"`\n\nThis resource hint allows\
    \ pointing of the browser to another resource that you want to use later on in\
    \ the current page, and which therefore should be downloaded as a high priority.\
    \ Subresource resources are fetched with high priority as soon as they are encountered\
    \ by the loader.\n\nBy using this resource hint, you can optimize the user experience\
    \ on your site, as any resource marked as `subresource` is loaded faster. For\
    \ example, this technique is very useful if you want to load resources such as\
    \ important JSON files, or a logo, in advance.\n\nPlace this tag in the head of\
    \ your HTML as early as possible. The resources fetched should just be critical\
    \ resources for the **current** page. In the example below, it's a JSON file and\
    \ a logo:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n\
    \    <link rel=\"subresource\"  href=\"data.json\" />\n    <link rel=\"subresource\"\
    \  href=\"logo.jpg\" />\n    <title>My website</title>\n</head>\n<body>\n\n  \
    \  <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\n    <script>\n        $.getJSON(\
    \ \"data.json\", function( data ) {\n            //\n        });\n    </script>\n\
    </body>\n</html>\n```\n\n#### `rel=\"prefetch\"`\n\nYou can hint to the browser\
    \ that an individual resource—or an entire site—should be prefetched, by including\
    \ the `prefetch` pre-browsing attribute in the head of your page. For example,\
    \ you could use the prefetch hint to load images that are used throughout your\
    \ site, and not just on your current page.\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <!-- ... -->\n    <link rel=\"subresource\" href=\"logo.jpg\"\
    \ />\n    <link rel=\"prefetch\" href=\"footer.jpg\" />\n    <title>My website</title>\n\
    </head>\n<body>\n    <!-- ... -->\n    <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\
    \n      <img src=\"footer.jpg\"/>\n</body>\n</html>\n```\n\nAfter the browser\
    \ has dealt with all critical subresources, it will start getting footer.jpg.\
    \ Please note that the prefetch hint is considered to be the [lowest possible\
    \ priority](https://medium.com/@luisvieira_gmr/html5-prefetch-1e54f6dda15d) hint.\n\
    \nTherefore, `subresource` and `prefetch` differ in their priorities as well as\
    \ their semantics: use `subresource` to load a resource with high priority within\
    \ the current page, whereas the `prefetch` resource is loaded with lower priority\
    \ but can refer to a resource used on a different page of your site.\n\n#### `rel=\"\
    prerender\"`\n\nWith a use case similar to that of `prefetch`, `prerender` kicks\
    \ off by loading an entire page in the background (including all of its assets).\
    \ As I'm sure you can imagine, this event is quite resource heavy, and should\
    \ only be used if it's really needed! You could use this for a checkout process,\
    \ for example, where you can predict the subsequent pages the user will hit.\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n    <link\
    \ rel=\"prerender\" href=\"step-2.html\" />\n    <title>Check-Out Step 1</title>\n\
    </head>\n<body>\n    <!-- ... -->\n</body>\n</html>\n```\n\n#### Browser Support\n\
    \nSince some of these resource hint attributes are fairly new (at the time of\
    \ writing), browser makers are still in the process of implementing them. Here's\
    \ a table of current support:\n\n| Browser | dns-prefetch | subresource | prefetch\
    \ | prerender |\n\n| --- | --- | --- | --- | --- |\n\n| Firefox | 3.5+ | n/a |\
    \ 3.5+ | n/a |\n\n| Chrome | 1.0+ | 1.0+ | 1.0+ | 1.3+ |\n\n| Safari | 5.01+ |\
    \ n/a | n/a | n/a |\n\n| IE | 9+ | n/a | 10+ | 11+ |\n\nAs you can tell from the\
    \ table above, `dns-prefetch` seems to be supported by most browsers—and therefore,\
    \ if used properly, should improve a site's performance. Some external scripts\
    \ could potentially have a long DNS lookup, so we could use this attribute to\
    \ improve the load time.\n\n## Cool Down\n\n*   You've learned how the browser\
    \ works, so you understand when and how assets are being rendered.\n\n*   The\
    \ CRP defines the resources that are needed to render the initial view of the\
    \ page (above the fold).\n\n*   You've learned about the 14KB rule, and how to\
    \ prioritize the visible content of your page.\n\n*   You've been taken through\
    \ an exercise on how to optimize the CRP.\n\n*   Reducing and optimizing HTTP\
    \ requests is the key for efficient web performance.\n\n*   You've learned techniques\
    \ to reduce and optimize HTTP requests by applying concatenation and minification.\n\
    \n*   Don't just concatenate everything. Differentiate between context-based and\
    \ frequency-based concatenation.\n\n*   You've learned how spriting works, and\
    \ that it reduces HTTP requests when serving images.\n\n*   You got a glimpse\
    \ of how predictive browsing works, and learned about new tags for preloading\
    \ assets—`pre-fetch`, `dns-prefetch` etc.\n\n# Chapter 6\n\nProducing Lean Web\
    \ Assets: Part 1\n\n## Warm Up\n\nWhile the previous chapter explored techniques\
    \ for reducing and optimizing HTTP requests in general, this chapter will focus\
    \ on optimizing individual web assets such as HTML, CSS, and JavaScript.\n\n##\
    \ Optimizing HTML\n\nWhen writing HTML, make sure it is semantic, valid, and as\
    \ lean as possible. The more errors your code contains, and the more nested elements\
    \ you have, the more work you are requiring of the browser. (The browser will\
    \ do its best to correct your errors as it constructs the DOM, but there's only\
    \ so much it can do.)\n\nMove any inline styles from HTML elements into your style\
    \ sheets. For example, instead of writing `<div style=\"color:red\">`, use `div\
    \ {color:red}` in a separate style sheet.\n\n### Keeping Things Tidy\n\nThere\
    \ are several tools that can help you keep your HTML in good shape, such as [HTML\
    \ Tidy](http://www.html-tidy.org/), a command line tool that you can [download\
    \ from GitHub](https://github.com/htacg/tidy-html5) and install on your computer.\
    \ (There is also an [older command line version](http://tidy.sourceforge.net/),\
    \ which has a handy [online](http://infohound.net/tidy/) equivalent, though these\
    \ are a little old now and don't include support for HTML5.)"
