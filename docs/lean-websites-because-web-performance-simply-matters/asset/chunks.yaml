  trans: "\n\n# 预浏览（Pre-browsing）是一种性能优化技术，指的是预测用户与你页面的交互——例如在用户请求资源之前加载这些资源。[资源提示](http://w3c.github.io/resource-hints/)——这些是添加到\
    \ `link` 标签的[预浏览属性](https://docs.google.com/presentation/d/18zlAdKAxnc51y_kj-6sWLmnjl6TLnaru_WH0LJTjP-o/edit#slide=id.p19)——旨在通过主动告诉浏览器需要预取什么，来帮助浏览器预测用户的下一步操作。\n\
    \n例如，你可能知道用户在你的网站上最常去哪里。你可以使用以下某些选项来预加载某些资源，你认为浏览器在访问下一个页面时需要获取这些资源。\n\n让我们来看看这些资源提示属性。\n\
    \n### `rel=\"dns-prefetch\"`\n\n正如我们之前看到的，DNS 查找可能会消耗额外的时间来加载资源。DNS 预取通过提前解析域名来缩短查找域名的时间。\n\
    \n当你的页面上有多个链接指向外部网站（即指向不同的域名）时，DNS 预取非常有用。它可以减少用户实际点击其中一个外部链接时的延迟。它实际上是提前告诉浏览器：“嘿，伙计，我正打算使用这个域名。”\n\
    \n此标签应该放在页面的 `<head>` 中，并且仅用于具有不同域名的关键资源。不要将所有外部链接的域名都包含在 `<head>` 中，因为可能只会增加页面加载时间。\n\
    \n下面的示例为 Flickr 域名添加了 DNS 预取，因为该域名在页面之后将用于画廊中的图片：\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n    <link rel=\"shortcut icon\" href=\"../../favicon.ico\"\
    \n↵ type=\"image/x-icon\"/>\n    <!-- ... -->\n    <link rel=\"dns-prefetch\"\
    \ href=\"https://farm3.staticflickr.com\" />\n    <title>My website</title>\n\
    </head>\n<body>\n    <!-- ... -->\n    <img src=\"https://farm3.staticflickr.com/2076/2378396331_f550196\n\
    ↵025.jpg\">\n</body>\n</html>\n```\n\n### `rel=\"subresource\"`\n\n这种资源提示允许浏览器指向你稍后在当前页面中使用的另一个资源，因此该资源应该以高优先级下载。子资源（Subresource）资源一旦被加载器遇到，就会以高优先级获取。\n\
    \n通过使用这种资源提示，你可以优化网站上的用户体验，因为任何标记为 `subresource` 的资源加载速度都会更快。例如，如果你想提前加载诸如重要的\
    \ JSON 文件或 Logo 等资源，这种技术就非常有用。\n\n尽可能早地在 HTML 的 `<head>` 中放置此标签。获取的资源应该只是**当前**页面的关键资源。在下面的示例中，它是一个\
    \ JSON 文件和一个 Logo：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n \
    \   <!-- ... -->\n    <link rel=\"subresource\"  href=\"data.json\" />\n    <link\
    \ rel=\"subresource\"  href=\"logo.jpg\" />\n    <title>My website</title>\n</head>\n\
    <body>\n\n    <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\n    <script>\n    \
    \    $.getJSON( \"data.json\", function( data ) {\n            //\n        });\n\
    \    </script>\n</body>\n</html>\n```\n\n### `rel=\"prefetch\"`\n\n你可以通过在页面的 `<head>`\
    \ 中包含 `prefetch` 预浏览属性，提示浏览器应该预取某个单独资源或整个网站。例如，你可以使用 prefetch 提示来加载整个网站中使用的图片，而不仅仅是当前页面上的。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n   \
    \ <link rel=\"subresource\" href=\"logo.jpg\" />\n    <link rel=\"prefetch\" href=\"\
    footer.jpg\" />\n    <title>My website</title>\n</head>\n<body>\n    <!-- ...\
    \ -->\n    <img src=\"logo.jpg\"/>\n    <!-- ... -->\n\n      <img src=\"footer.jpg\"\
    />\n</body>\n</html>\n```\n\n浏览器处理完所有关键子资源后，它将开始获取 `footer.jpg`。请注意，prefetch 提示被认为是[优先级最低的](https://medium.com/@luisvieira_gmr/html5-prefetch-1e54f6dda15d)提示。\n\
    \n因此，`subresource` 和 `prefetch` 在优先级和语义上都不同：使用 `subresource` 在当前页面内以高优先级加载资源，而\
    \ `prefetch` 资源以较低优先级加载，但可以指向你网站上其他页面使用的资源。\n\n### `rel=\"prerender\"`\n\n`prerender`\
    \ 的用例与 `prefetch` ，它通过在后台加载整个页面（包括其所有资源）来启动。正如我确定你可以想象的，此事件非常消耗资源，应该只在真的需要时使用！例如，你可以将其用于结账流程，在那里你可以预测用户将访问的后续页面。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <!-- ... -->\n   \
    \ <link rel=\"prerender\" href=\"step-2.html\" />\n    <title>Check-Out</title>\n\
    </head>\n<body>\n    <!-- ... -->\n</body>\n</html>\n```\n\n### 浏览器支持\n\n由于某些资源提示还很新，浏览器仍在实现中。以下是支持情况表：\n\
    \n| 浏览器 | dns-prefetch | subresource | prefetch | prerender |\n| --- | --- | ---\
    \ | --- |\n| Firefox | 3.5+ | 不支持 | 3.5+ | 不支持 |\n| Chrome | 1.0+ | 1.0+ | 1.0+\
    \ | 1.3+ |\n| Safari | 5.0+ | 不支持 | 不支持 | 不支持 |\n| IE | 9+ | 不支持 | 10+ | 11+ |\n\
    \n正如你从上表看到的，`dns-prefetch` 似乎被大多数浏览器支持，因此使用得当可以提高性能。\n\n# 第 6 章\n\n## 生成精简的 Web\
    \ 资源：第一部分\n\n## 热身\n\n上一章探索了减少和优化 HTTP 请求的通用技术，本章将重点优化单个 Web 资源，如 HTML、CSS 和 JavaScript。\n\
    \n## 优化 HTML\n\n在编写 HTML 时，确保它是语义化的、有效的且尽可能精简的。代码包含的错误越多、嵌套元素越多，对浏览器的要求就越高。（浏览器在构建\
    \ DOM 时会尽力纠正你的错误，但能力是有限的。）\n\n将 HTML 元素中的任何内联样式移动到样式表中。例如，与其写 `<div style=\"color:red\"\
    >`，不如在样式表中使用 `div {color:red}`。\n\n### 保持整洁\n\n有很多工具可以帮助你保持 HTML 的良好状态，例如 [HTML\
    \ Tidy](http://www.html-tidy.org/)，这是一个命令行工具，你可以从 [GitHub](https://github.com/htacg/tidy-html5)\
    \ 下载并安装到电脑上。（还有一个[较旧的命令行版本](http://tidy.sourceforge.net/)，它有一个方便的[在线](http://infohound.net/tidy/)对应版本，尽管这些现在已经过时了，不包含对\
    \ HTML5 的支持。）\n\n"
- fmt: "\nHTML Tidy not only checks your HTML for errors, but also warns of potential\
    \ problems, and even produces an amended version of your file for you.\n\nAnother\
    \ popular, online tool for checking the quality of your HTML code is the [W3C\
    \ Markup Validation Service](https://validator.w3.org/). You can provide it with\
    \ a link to your page, upload a file or just paste your code straight into the\
    \ form provided. The validator will list warnings and errors for you to address,\
    \ although it won't rewrite your code for you.\n\n### Further Tips on Optimizing\
    \ HTML Files\n\nOnce your HTML code is error free, there are further ways to optimize\
    \ it, such as the following:\n\n* Reduce the file size as much as possible. Minify\
    \ the HTML by removing whitespace and comments wherever possible. Instead of doing\
    \ this manually, use compressors such as `HTML Compressor`, which has both a [command\
    \ line](https://code.google.com/p/htmlcompressor/) and an [online](https://htmlcompressor.com/compressor/)\
    \ version.\n\n* Remove unused elements. As they serve no purpose, don't let the\
    \ browser waste precious time processing them.\n\n* Don't forget closing tags\
    \ for elements that require them. The rendering step could stumble on this and\
    \ get confused, potentially causing a delay (and a broken layout).\n\n* Practice\
    \ smart content layout. Place the most important content higher in the source\
    \ order, letting less important content (such as sidebars) load further down the\
    \ tree.\n\n* Keep the `head` as small and clean as possible to prioritize visible\
    \ content. The more links, scripts and other code in the `head`, the longer it\
    \ will be before the browser can download the actual page content.\n\n## Optimizing\
    \ CSS\n\nAs we've discussed already, externally linked CSS files are render blocking.\
    \ Each additional linked style sheet further degrades page load performance. Your\
    \ rule of thumb should always be to send the most important styles down the wire\
    \ as soon as possible, and inline styles in the head of the page itself if they\
    \ apply above the fold.\n\n### Lean CSS\n\nRegardless of whether you use external\
    \ style sheets or inline styles, aim to keep your CSS as lean as possible. In\
    \ particular, avoid unused selectors. They will only bloat your style sheets and\
    \ harm the load time of your page.\n\nOne of the key things to note when optimizing\
    \ CSS is that browsers read CSS selectors from `right to left`. The part furthest\
    \ to the right is the `key selector`, and is most responsible for the performance\
    \ of the overall selector.\n\nThe most efficient selector is the ID, followed\
    \ by class, tag, universal, attribute and pseudo class selectors. The efficiency\
    \ is reflected by the order of occurrence of each selector below.\n\n```\n#content\
    \        {…}  /* ID */\nbody #title     {…}  /* ID */\n.content        {…}  /*\
    \ class */\nol li a.current {…}  /* class *\nol              {…}  /* tag */\n\
    *               {…}  /* universal */\n[title='main']  {…}  /* attribute */\na:hover\
    \         {…}  /* pseudo */\n```\n\nBy following the rules below, you ensure performant\
    \ CSS:\n\n* **Choose a specific key selector**. For example, the following key\
    \ selector is not very efficient:\n\n    ```\n#menu a {…}\n    ```\n\n    Based\
    \ on the right-to-left principle, the browser must first find all existing links\
    \ on the page before applying the style to the links found in the `#menu` element.\n\
    \n    ```\n<ul id=\"menu\">\n        <li><a href=\"#\">Home</a></li>\n       \
    \ <li><a href=\"#\">Contact</a></li>\n   <!-- more -->\n    </ul>\n    ```\n\n\
    \    By adding a class to each `<li>` element, we can make the key selector more\
    \ efficient:\n\n    ```\n<ul id=\"menu\">\n        <li><a href=\"#\" class=\"\
    menu-item\">Home</a></li>\n        <li><a href=\"#\" class=\"menu-item\">Contact</a></li>\n\
    \       <!-- more -->        \n    </ul>\n    ```\n\n    The selector can now\
    \ be optimized:\n\n    ```\n#menu .menu-item {…}\n    ```\n\n    This optimized\
    \ key selector will now match far fewer elements. The browser is able to find\
    \ the elements faster, and can focus on the next styles to be rendered.\n\n* **Remove\
    \ unused selectors**. The older a style sheet is, or the more developers there\
    \ are working on it, the more likely the file is to become messy and bloated due\
    \ to unused selectors. (This could also happen for a CSS framework like Bootstrap,\
    \ or in a CSS reset.)\n\n* **Examine why you chose a selector in the first place**.\
    \ It might not always be needed. In the case below, the `font-family` declaration\
    \ cascades down, and there might not be a need to apply this to the `li a`:\n\n\
    \    ```\n#top-nav li a {font-family: Arial;}\n    ```\n\n    You could clean\
    \ this up as follows:\n\n    ```\n#top-nav {font-family: Arial;}\n    ```\n\n\
    * **Avoid inline CSS**. Styles applied directly to elements via the `style` attribute\
    \ are inefficient. Such styles should be moved to a style sheet instead, where\
    \ they can potentially be reused. For example, the `style` attribute in `<header\
    \ style=\"margin:5px; color:red\"/>`, should be removed, in favor of this:\n\n\
    \    ```\n/* style.css */\nheader {margin: 5px; color: red;}\n    ```\n\n* **Consolidate\
    \ declarations where possible**. Instead of duplicating the declaration `color:\
    \ red;` as follows:\n\n    ```\nh1 {color: red;}\nh2 {color: red;}\n    ```\n\n\
    \    You can put this into one single rule:\n\n    ```\nh1, h2 {color: red;}\n\
    \    ```\n\n* **Be sparing with CSS3 selectors**. Although selectors such as `:nth-child`\
    \ can be incredibly helpful in defining styles on specific elements of the page,\
    \ they are the slowest when it comes to rendering time in the browser.\n\n* **Avoid\
    \ `@import url(\"style.css\")`**. By using `@import`, the browser parses the CSS\
    \ file and downloads each import file sequentially. To increase performance, use\
    \ the HTML element `<link rel='stylesheet' href='style.css'>` instead of `@import`.\n\
    \n### CSS Optimization Tools\n\nThere are several tools that help with optimizing\
    \ CSS, by removing unnecessary selectors, pointing out bad practices, and minifying\
    \ your code:\n\n* [CSS Shrink](http://cssshrink.com/) has an online and CLI version,\
    \ and is useful for removing unnecessary selectors.\n\n* [Unused CSS](https://unused-css.com/)\
    \ is an online tool for removing unused CSS.\n\n* [UnCSS](https://github.com/giakki/uncss)\
    \ is a CLI tool for removing unused CSS.\n\n* [CSSLint](http://csslint.net/) is\
    \ an online tool that will “hurt your CSS feelings”. It's brutally honest in pointing\
    \ out any shortcomings of your CSS.\n\n* [CSSO](https://bem.info/tools/optimizers/csso/)\
    \ is a CLI tool that can minify and also perform structural optimization of CSS\
    \ files.\n"
  raw: "HTML Tidy not only checks your HTML for errors, but also warns of potential\
    \ problems, and even produces an amended version of your file for you.\n\nAnother\
    \ popular, online tool for checking the quality of your HTML code is the [W3C\
    \ Markup Validation Service](https://validator.w3.org/). You can provide it with\
    \ a link to your page, upload a file or just paste your code straight into the\
    \ form provided. The validator will list warnings and errors for you to address,\
    \ although it won't rewrite your code for you.\n\n### Further Tips on Optimizing\
    \ HTML Files\n\nOnce your HTML code is error free, there are further ways to optimize\
    \ it, such as the following:\n\n*   Reduce the file size as much as possible.\
    \ Minify the HTML by removing whitespace and comments wherever possible. Instead\
    \ of doing this manually, use compressors such as HTML Compressor, which has both\
    \ a [command line](https://code.google.com/p/htmlcompressor/) and an [online](https://htmlcompressor.com/compressor/)\
    \ version.\n\n*   Remove unused elements. As they serve no purpose, don't let\
    \ the browser waste precious time processing them.\n\n*   Don't forget closing\
    \ tags for elements that require them. The rendering step could stumble on this\
    \ and get confused, potentially causing a delay (and a broken layout).\n\n*  \
    \ Practice smart content layout. Place the most important content higher in the\
    \ source order, letting less important content (such as sidebars) load further\
    \ down the tree.\n\n*   Keep the `head` as small and clean as possible to prioritize\
    \ visible content. The more links, scripts and other code in the `head`, the longer\
    \ it will be before the browser can download the actual page content.\n\n## Optimizing\
    \ CSS\n\nAs we've discussed already, externally linked CSS files are render blocking.\
    \ Each additional linked style sheet further degrades page load performance. Your\
    \ rule of thumb should always be to send the most important styles down the wire\
    \ as soon as possible, and inline styles in the head of the page itself if they\
    \ apply above the fold.\n\n### Lean CSS\n\nRegardless of whether you use external\
    \ style sheets or inline styles, aim to keep your CSS as lean as possible. In\
    \ particular, avoid unused selectors. They will only bloat your style sheets and\
    \ harm the load time of your page.\n\nOne of the key things to note when optimizing\
    \ CSS is that browsers read CSS selectors from *right to left*. The part furthest\
    \ to the right is the *key selector*, and is most responsible for the performance\
    \ of the overall selector.\n\nThe most efficient selector is the ID, followed\
    \ by class, tag, universal, attribute and pseudo class selectors. The efficiency\
    \ is reflected by the order of occurrence of each selector below.\n\n```\n#content\
    \        {…}  /* ID */\nbody #title     {…}  /* ID */\n.content        {…}  /*\
    \ class */\nol li a.current {…}  /* class *\nol              {…}  /* tag */\n\
    *               {…}  /* universal */\n[title='main']  {…}  /* attribute */\na:hover\
    \         {…}  /* pseudo */\n```\n\nBy following the rules below, you ensure performant\
    \ CSS:\n\n*   **Choose a specific key selector**. For example, the following key\
    \ selector is not very efficient:\n\n    ```\n    #menu a {…}\n    ```\n\n   \
    \ Based on the right-to-left principle, the browser must first find all existing\
    \ links on the page before applying the style to the links found in the `#menu`\
    \ element.\n\n    ```\n    <ul id=\"menu\">\n        <li><a href=\"#\">Home</a></li>\n\
    \        <li><a href=\"#\">Contact</a></li>\n       <!-- more -->\n    </ul>\n\
    \    ```\n\n    By adding a class to each `<li>` element, we can make the key\
    \ selector more efficient:\n\n    ```\n    <ul id=\"menu\">\n        <li><a href=\"\
    #\" class=\"menu-item\">Home</a></li>\n        <li><a href=\"#\" class=\"menu-item\"\
    >Contact</a></li>\n       <!-- more -->        \n    </ul>\n    ```\n\n    The\
    \ selector can now be optimized:\n\n    ```\n    #menu .menu-item {…}\n    ```\n\
    \n    This optimized key selector will now match far fewer elements. The browser\
    \ is able to find the elements faster, and can focus on the next styles to be\
    \ rendered.\n\n*   **Remove unused selectors**. The older a style sheet is, or\
    \ the more developers there are working on it, the more likely the file is to\
    \ become messy and bloated due to unused selectors. (This could also happen for\
    \ a CSS framework like Bootstrap, or in a CSS reset.)\n\n*   **Examine why you\
    \ chose a selector in the first place**. It might not always be needed. In the\
    \ case below, the `font-family` declaration cascades down, and there might not\
    \ be a need to apply this to the `li a`:\n\n    ```\n    #top-nav li a {font-family:\
    \ Arial;}\n    ```\n\n    You could clean this up as follows:\n\n    ```\n   \
    \ #top-nav {font-family: Arial;}\n    ```\n\n*   **Avoid inline CSS**. Styles\
    \ applied directly to elements via the `style` attribute are inefficient. Such\
    \ styles should be moved to a style sheet instead, where they can potentially\
    \ be reused. For example, the `style` attribute in `<header style=\"margin:5px;\
    \ color:red\"/>`, should be removed, in favor of this:\n\n    ```\n    /* style.css\
    \ */\n    header {margin: 5px; color: red;}\n    ```\n\n*   **Consolidate declarations\
    \ where possible**. Instead of duplicating the declaration `color: red;` as follows:\n\
    \n    ```\n    h1 {color: red;}\n    h2 {color: red;}\n    ```\n\n    You can\
    \ put this into one single rule:\n\n    ```\n    h1, h2 {color: red;}\n    ```\n\
    \n*   **Be sparing with CSS3 selectors**. Although selectors such as `:nth-child`\
    \ can be incredibly helpful in defining styles on specific elements of the page,\
    \ they are the slowest when it comes to rendering time in the browser.\n\n*  \
    \ **Avoid `@import url(\"style.css\")`**. By using `@import`, the browser parses\
    \ the CSS file and downloads each import file sequentially. To increase performance,\
    \ use the HTML element `<link rel='stylesheet' href='style.css'>` instead of `@import`.\n\
    \n### CSS Optimization Tools\n\nThere are several tools that help with optimizing\
    \ CSS, by removing unnecessary selectors, pointing out bad practices, and minifying\
    \ your code:\n\n*   [CSS Shrink](http://cssshrink.com/) has an online and CLI\
    \ version, and is useful for removing unnecessary selectors.\n\n*   [Unused CSS](https://unused-css.com/)\
    \ is an online tool for removing unused CSS.\n\n*   [UnCSS](https://github.com/giakki/uncss)\
    \ is a CLI tool for removing unused CSS.\n\n*   [CSSLint](http://csslint.net/)\
    \ is an online tool that will “hurt your CSS feelings”. It's brutally honest in\
    \ pointing out any shortcomings of your CSS.\n\n*   [CSSO](https://bem.info/tools/optimizers/csso/)\
    \ is a CLI tool that can minify and also perform structural optimization of CSS\
    \ files.\n\nIf you want to carry out a quick optimization of some CSS, your best\
    \ bet is to use the online tools above, or one of several browser extensions that\
    \ are also available. For batched operations and automation, the command line\
    \ tools are more useful during deployment. I recommend you take the time to set\
    \ up these CLIs within your deployment process so that they are part of your daily\
    \ workflow. In Chapter 8, we'll discuss how to set these up.\n\nLet's take a look\
    \ at CSS Shrink, to illustrate how a CSS optimization tool can help improve the\
    \ performance of a site. I pasted the styles from one of my site's CSS files into\
    \ the online version of CSS Shrink. As a result, my CSS was shrunk by almost 19%,\
    \ as shown in [Figure 6.1](#ch06.html_ch6-css-shrink \"Figure 6.1. bbinto.me style\
    \ sheet file size reduced by almost 19%, thanks to CSS Shrink\"):\n\n![bbinto.me\
    \ style sheet file size reduced by almost 19%, thanks to CSS Shrink](OEBPS/figures/6-css-shrink.png)\n\
    \nFigure 6.1. bbinto.me style sheet file size reduced by almost 19%, thanks to\
    \ CSS Shrink\n\n## Optimizing JavaScript"
