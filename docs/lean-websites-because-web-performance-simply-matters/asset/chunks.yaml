- fmt: "\nSomething feels inefficient here, doesn’t it? It's a waste of bandwidth.\
    \ So, great minds at Google came up with a solution to reduce this inefficiency\
    \ by introducing the [Canonicalize JavaScript Libraries](https://developers.google.com/speed/pagespeed/module/filter-canonicalize-js)\
    \ filter. The idea is that you replace your locally hosted JavaScript libraries\
    \ (such as `jQuery`) with the equivalent library hosted on Google’s CDN—which\
    \ means that when browsing, users can utilize a copy of `jQuery` that was previously\
    \ fetched from Google’s CDN (and which was thus cached in the browser).\n\nEnable\
    \ the filter as follows (for Apache):\n\n```\nModPagespeedEnableFilters canonicalize_javascript_libraries\n\
    ```\n\nAnd here is an example of how the module would replace the local `jQuery`\
    \ file as shown below:\n\n```html\n<html\n  <head>\n    <script src=\"/local/jquery-1.8.3.js\"\
    >\n    </script>\n    <script src=\"foo.js\">\n    </script>\n    <script src=\"\
    bar.js\">\n    </script>\n  </head>\n  <body\n  <!-- fun stuff -->\n  </body>\n\
    </html>\n```\n\nwill be rewritten to\n\n```html\n<html\n  <head>\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.8.3/\njquery.min.js\">\n\
    \    </script>\n    <script src=\"foo.js\">\n    </script>\n    <script src=\"\
    bar.js\">\n    </script>\n  </head>\n  <body\n  <!-- fun stuff -->\n  </body>\n\
    </html>\n```\n\n### Warning: Watch Out For Potential SPOF\n\nWatch out for synchronous\
    \ script blockers when using the `canonicalize_javascript_libraries` filter. The\
    \ filter will replace your local version with a third-party version of the script.\
    \ If you haven't included the script asynchronously, and the third-party provider\
    \ goes down unexpectedly, this could potentially cause SPOF.\n\n### Combine CSS\n\
    \nThe [Combine CSS](https://developers.google.com/speed/pagespeed/module/filter-css-combine)\
    \ filter looks for all CSS `link` tags on the page. The module removes all individual\
    \ CSS link tags and concatenates the CSS files into one merged file, which it\
    \ places wherever the first CSS `link` originally was. This is similar to the\
    \ concatenating technique we saw previously.\n\nYou can enable this via your Apache\
    \ web server as follows:\n\n```\nModPagespeedEnableFilters combine_css\n```\n\n\
    As an example, imagine this as the original HTML:\n\n```html\n<html\n  <head>\n\
    \    <link rel=\"stylesheet\" type=\"text/css\" href=\"styles/1.css\">\n    <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"styles/2.css\">\n    <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"styles/3.css\">\n  </head>\n  <body\n  \
    \  <!-- fun stuff -->\n  </body>\n</html> \n```\n\nCombine CSS would turn it into\
    \ something like this:\n\n```html\n<html\n  <head>\n    <link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"styles/1.css+2.css+\n3.css.pagespeed.cc.yu2He3_gBx.css\"\
    >\n  </head>\n  <body\n    <!-- fun stuff -->\n  </body>\n</html> \n```\n\n###\
    \ Defer JavaScript\n\nThe [Defer JavaScript](https://developers.google.com/speed/pagespeed/module/filter-js-defer)\
    \ filter follows the `defer` attribute logic that we discussed in [Chapter 6](#ch06.html\
    \ \"Chapter 6Producing Lean Web Assets: Part 1\"). The `defer` attribute delays\
    \ the JavaScript execution of the script until after the DOM has finished loading.\
    \ The script with a `defer` attribute attached to it is added to the end of the\
    \ list of scripts. To ensure that the script can be safely executed at the end\
    \ of the page load, the attribute should only be used on scripts that don't modify\
    \ the DOM. The performance advantage comes from stopping scripts blocking other\
    \ processes in the browser.\n\nThe Defer JavaScript filter automatically adds\
    \ the `src` attribute to any `script` tag on the page. A `window.onload` handler\
    \ is added to the HTML that then executes all the deferred scripts.\n\nInclude\
    \ this line in your web server config file (for Apache):\n\n```\nModPagespeedEnableFilters\
    \ defer_javascript\n```\n\nIf you don't want a script to have the `defer` attribute\
    \ added—for example, because the script alters the DOM—just add the `pagespeed_no_defer`\
    \ attribute:\n\n```html\n<script pagespeed_no_defer=\"\" src=\"execute.js\"></script>\n\
    ```\n\nIn order to demonstrate this, it's best to actually view it in the browser.\
    \ Check out the [before](http://www.modpagespeed.com/defer_javascript.html?ModPagespeed=off)\
    \ and [after](http://www.modpagespeed.com/defer_javascript.html?ModPagespeed=on&ModPagespeedFilters=defer_javascript)\
    \ pages to view the impact of this filter.\n\n### Prioritize Critical CSS\n\n\
    The [Prioritize Critical CSS](https://developers.google.com/speed/pagespeed/module/filter-prioritize-critical-css)\
    \ filter parses the CSS file and replaces it with just rules used on that page.\
    \ This aligns with the critical rendering path paradigm, which is to serve the\
    \ ATF CSS as soon as possible to improve the initial render time.\n\nInclude the\
    \ following line in your web server config file:\n\n```\nModPagespeedEnableFilters\
    \ prioritize_critical_css\n```\n\nThe following page includes an external `style.css`\
    \ file where only the `class=\"red\"` is being referenced on that page:\n\n```html\n\
    <html\n  <head>\n    <link rel=\"stylesheet\" href=\"style.css\">\n\n    <!--\
    \ content of style.css\n          .red {color: red;}\n          .big { font-size:\
    \ 8em; }\n          .gallery {border:1p solid black; }\n    -->\n  </head>\n \
    \ <body\n    <div class=\"red\">\n      Hello readers!\n    </div>\n  </body>\n\
    </html>\n```\n\nThe filter will output as follows, only focusing on the style\
    \ that is really being used on this page:\n\n```html\n<html\n  <head>\n    <style>\n\
    \      .red{red;}\n    </style>\n    </head>\n  <body\n    <div class=\"red\"\
    >\n      Hello readers!\n    </div>\n  </body>\n</html>\n<noscript><link rel=\"\
    stylesheet\" href=\"style.css\"></noscript>\n```\n"
