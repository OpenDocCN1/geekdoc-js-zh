    维持一个精简的网站就像执行减重计划。在瘦身之后很快就反弹回失去掉的体重，这种情况太常见了！就像减肥一样，在维护精简网站时，我们需要避免[回溜球效应](http://en.wikipedia.org/wiki/Yo-yo_effect)。第
    4 章中讨论的监控工具，以及第 8 章中描述的性能自动化工具，都能帮助我们持续掌控网站优化。


    ## 监控清单


    - 先测量，后优化。

    - 持续对你的网站性能进行测量和监控，将帮助你识别并处理性能瓶颈。

    - 设置每日性能报告和警报，让你对性能表现无忧。

    - 自动化通过触发适当的警报，在对抗反复效应方面非常有帮助。请参阅第 8 章，了解用于掌控此点的工具和选项。


    ## 结语


    这是我们全书结束前的最后一个“结语”。我想用 Google 创始人拉里·佩奇（Larry Page）的一句话来结束最后一章：


    > “浏览应该像翻阅杂志页一样简单快速。”


    愿这句话能激励我们所有人，为了更精简的网站而努力！


    '
