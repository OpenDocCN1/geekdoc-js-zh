    > One Web means making, as far as is reasonable, the same information and services
    available to users irrespective of the device they are using. However, it does
    not mean that exactly the same information is available in exactly the same representation
    across all devices. The context of mobile use, device capability variations, bandwidth
    issues and mobile network capabilities all affect the representation. ([W3C Mobile
    Web Best Practices](http://www.w3.org/TR/mobile-bp/#OneWeb))


    This quote, from the W3C Mobile Web Initiative''s Best Practices Working Group,
    summarizes how we should build websites for multiple devices. Different devices
    with different capabilities and screen sizes require us to build websites targeted
    to each device if we want to provide the best user experience.


    It doesn''t always make sense to serve exactly the same content to all users.
    Imagine a glossy, image-heavy travel website. That might be a nice experience
    for a desktop user on a broadband connection, but terrible for a user on a small
    mobile device. The images most likely should be reduced in size for faster download
    and to save bandwidth—if they even need to be displayed at all. It may also be
    that the mobile user just wants to check itinerary details or departure times,
    so the layout and functionality appropriate for the desktop may be quite inappropriate
    in the mobile context. Providing users with the best experience to help them accomplish
    their goal should be the main focus.


    ## Mobile on the Rise: Current Stats and Internet Usage


    In the early days of the web, we could be pretty certain that our site visitors
    were on a wired Internet connection with only a few browsers to choose from. Nowadays,
    there''s a lot more fragmentation across a multitude of devices, browsers and
    types of Internet connections—which makes it more important to consider how best
    to serve web content.


    [StatCounter](http://gs.statcounter.com) provides useful data on the most commonly
    used screen sizes, operating systems and so forth. Based on the StatCounter top
    lists (at the time of writing), there are approximately [14](http://gs.statcounter.com/#all-resolution-ww-yearly-2012-2014)
    different screen resolutions, [8](http://gs.statcounter.com/#all-os-ww-yearly-2012-2014)
    operating systems, [9](http://gs.statcounter.com/#all-browser-ww-yearly-2012-2014)
    browsers, many different connection speeds, and around 14,000 different user agent
    strings (device types) worldwide.


    The steep rise in mobile usage looks like it will continue. In 2014, there were
    around [7.2 billion](http://www.worldometers.info/world-population/) people in
    the world, with around [4.55 billion mobile users](http://www.emarketer.com/Article/Smartphone-Users-Worldwide-Will-Total-175-Billion-2014/1010536)
    worldwide. Based on [predictions](http://www.icinsights.com/news/bulletins/Worldwide-Cellphone-Subscriptions-Forecast-To-Exceed-Worldwide-Population-In-2015/)
    for 2015, the worldwide population is expected to reach 7.4 billion, while the
    number of mobile phone subscriptions is calculated to be marginally over 7.5 billion.


    In addition, there are [suggestions](http://telecoms.com/301771/half-of-worlds-population-on-mobile-web-by-2020-report/)
    that mobile browsing will surpass desktop browsing, and that in some areas it
    might already have done so. That''s reason enough to ensure our sites are `performance
    bulletproof` on mobile devices.


    ## Mobile Performance Challenges


    This section looks at current mobile constraints, and why a lean website for mobile
    users is especially important.


    ### Speed


    First off, how much slower is mobile? Akamai''s [*State of the Internet Report
    from Q2, 2014*](http://www.akamai.com/html/about/press/releases/2014/press-093014.html)
    collected “real” page load times from around the world via RUM. (Note that this
    RUM data only includes devices with `Navigation Timing API` support.) The results
    vary greatly from country to country and across continents.


    Akamai defines the difference between page load time on mobile vs. non-mobile
    as the “mobile penalty”. Here is some of the data collected, with the highest
    penalty country at the top and the lowest at the bottom:


    | Country | Avg. PLT on Broadband (ms) | Avg. PLT on Mobile (ms) | Mobile Penalty
    |

    | --- | --- | --- | --- |

    | Ireland | 1508 | 5353 | 3.6x |

    | Canada | 3014 | 5321 | 1.8x |

    | United States | 3354 | 5299 | 1.6x |

    | Turkey | 3320 | 2335 | 0.7x |


    Why is everything so much slower on mobile? There are several performance constraints
    to consider when developing websites for mobile devices. Let''s go through them.


    ### Mobile Network and High Latency


    Wireless communication comes with more latency than wired communication. Wireless
    connections are based on the radio in the device, and need to travel through the
    air, exposed to a lot of congestion and interference. Hence, there''s more latency
    involved in requesting a website on a mobile connection than from a LAN or even
    WiFi connection at home. Let me explain why, by going through high-level, simplified
    steps on how a mobile device requests a web page. (Ilya Grigorik has a very [detailed
    chapter](http://chimera.labs.oreilly.com/books/1230000000545/ch07.html) on this
    in his *High Performance Browser Networking* book.)


    1. Initially, the radio is off, and the phone is in an idle state.

    2. As soon as you type a `URL` into the browser, the radio tries to establish
    a connection with a nearby radio tower. While traveling over air to the nearest
    radio tower, the request is exposed to interference. This is the addition of unwanted
    signals to a useful signal, such as [electromagnetic interference](http://en.wikipedia.org/wiki/Electromagnetic_interference),
    [co-channel interference](http://en.wikipedia.org/wiki/Co-channel_interference),
    or [inter-carrier interference](http://en.wikipedia.org/wiki/Interference_(communication)).
    This step of negotiating the radio link can take up to [1000–2000ms](https://www.igvita.com/2012/07/19/latency-the-new-web-performance-bottleneck/).

    3. Once successfully established, the radio can now start to transmit data.

    4. Now packets of data are transferred from the radio to the tower (called the
    **radio resource controller** or RRC). This is called [user-plane, one-way latency](http://chimera.labs.oreilly.com/books/1230000000545/ch07.html#_initiating_a_request).
    It''s the first wireless hop that each device has to go through. This can take
    up to 5ms on a 4G network.

    5. Once arrived at the RRC, the packets of data will be sent to the core network
    (CN). The CN connects the tower to the worldwide Web to establish the request
    for the website. Part of the CN represents a public gateway that connects the
    mobile carrier to the public Internet.


    As you can surmise, latency is an unfortunate factor when dealing with wireless
    communications. Consequently it is important to keep the number of `HTTP` requests
    as small as possible to avoid any further latency issues. It''s better to send
    fewer `HTTP` requests with bigger responses than many `HTTP` requests with smaller
    responses.


    The table below[^([6])](#ch10.html_ftn.d5e4059) shows how much latency typically
    comes with requesting `HTTP` assets over mobile networks for active mobile connections:


    | Mobile Generation | Data Rate | Latency |

    | --- | --- | --- |

    | 2G | 100–400kbit/s | 300–1000ms |

    | 3G | 0.5–5Mbit/s | 100–500ms |

    | 4G | 1–50Mbit/s | < 100ms |


    Latency variability can be very high on mobile networks and carriers. [While 4G
    networks will improve latency](https://www.igvita.com/slides/2013/breaking-1s-mobile-barrier.pdf),
    it will be a while before all mobile users have switched to 4G networks.


    ### CPU/GPU and Less Memory


    CPU stands for **central processing unit,** the brain of all computers including
    mobile devices. Today''s mobile devices offer processing power roughly equivalent
    to that of a desktop computer from five or more years ago.

