    衡量网站性能最快、最简单的方法是从使用你偏好的浏览器开发者工具开始。大多数浏览器都提供了内置的开发者工具，你可以用它们来检查网站代码并监控其性能。在 Windows
    上按下 `Ctrl + Shift + I`，在 Mac 上按下 `Cmd + Opt + I` 即可打开开发者工具。


    图 3.3 显示了 sitepoint.com 网站的一个示例，在 Firefox 开发者工具的网络（Network）标签页中打开。


    ![Firefox 开发者工具显示的 sitepoint.com Stats](img/3-simple-metrics.png)


    图 3.3. Firefox 开发者工具显示的 sitepoint.com Stats


    在图片的右下角，我们可以看到以下信息：


    1. 浏览器必须发送 59 个 HTTP 请求来渲染页面

    2. 页面总大小为 1,498.83 千字节

    3. 页面在浏览器中完全加载耗了 4.48 秒


    其他浏览器提供了更多功能。Google 的 Chrome 开发团队一直在 Chrome 开发者工具中添加实用功能。其中之一是时间轴（Timeline）标签页，它提供了加载页面时大部分时间消耗在方面的完整概述（参见图
    3.4）。


    ![Chrome 时间轴标签页查看 sitepoint.com Stats](img/3-chrome-timeline.png)


    图 3.4. Chrome 时间轴标签页查看 sitepoint.com Stats


    使用此工具，你可以选择想要分析的时间范围。你可以进一步深入研究渲染过程的每个部分。通过观察黄色的分布，你可以发现大部分脚本执行发生在何时。


    审计（Audits）标签页允许你在页面加载时对其进行分析，如图图 3.5 所示。该工具还提供了如何提高页面性能的建议。


    ![Chrome 审计标签页分析的 sitepoint.com](img/3-chrome-audits.png)


    图 3.5. Chrome 审计标签页分析的 sitepoint.com


    ## 资源瀑布图 (Resource Waterfall)


    优化性能在于了解如何以及何时加载资源，并避免任何内容的阻塞：这就是资源瀑布图（`resource waterfall`）派上用场的地方。


    我为止提到的大多数性能工具都包含资源瀑布图（可以通过浏览器开发者工具的网络标签页访问）。当我们之前在 Firefox 的网络标签页查看 sitepoint.com
    的基本信息时，你已经了解了资源瀑布图。那么为什么这个视图如此重要呢？每个网页都由 HTTP 事务（请求和响应）组成。它们组合在一起形成了浏览器中显示的网站。它们包含了你网站的资产和资源。视觉化表示所有
    HTTP 请求的最简单方法是将它们绘制在所谓的“瀑布图”上。资源之所以以瀑布形式排列，是因为浏览器无法一次下载所有资源。浏览器遵循规则下载每个组件，要么并行，要么顺序。


    下面的图片显示了资源瀑布图的一个示例，取自 Chrome 开发者工具：


    ![Chrome 开发者工具中的 sitepoint.com 资源瀑布图](img/3-chrome-waterfall.png)


    图 3.6. Chrome 开发者工具中的 sitepoint.com 资源瀑布图


    ## WebPageTest


    我最喜欢的性能工具是 [WebPageTest](http://www.webpagetest.org/) (WPT)，这是一个由 Patrick Meenan
    创建并维护的免费在线资源。（WPT 数据构成了 HTTP Archive 的骨干，该存档每月运行一次，分析并处理 Alexa 排名靠网站的 WPT 结果。）


    下面是展示 WPT 测试的截图。输入你想要测试的 URL，你将获得一个性能分析，包括详细的瀑布图：


    ![WPT 中的 sitepoint.com Stats](img/3-wpt.png)


    图 3.7. WPT 中的 sitepoint.com Stats


    除了大多数浏览器开发者工具中可用的数据（总请求数、页面总大小和页面加载时间）外，WPT 还提供了其他几个重要指标：


    1. **加载时间 (Load Time)**：`Load Time` 的测量标准为从初始导航开始到窗口加载事件（`onload`）开始的时间。

    2. **首次字节 (First Byte)**：`First Byte` 时间的测量标准为从初始导航开始到浏览器接收到基础页第一个字节的时间（在跟随重定向之后）。

    3. **开始渲染 (Start Render)**：`Start Render` 时间是内容开始在浏览器中出现的时间点。这甚至仅仅是背景颜色，或者是页面顶角的
    Logo。Start Render 时间在瀑布图中也被标记为一条绿线，理想情况下，它应该尽早出现。

    4. **文档完成（Document Complete，或页面加载时间）**：`Document Complete`（通常也称为 `Page Load Time`）记录初始页面加载过程完成的时刻。你也可以通过
    JavaScript 的 `window.onload()` 事件捕捉这一时刻。对于重量型网站，页面加载可能花费大量时间。未通过 JavaScript 推送的图像和内容将在此时完成完全加载，包括不可见元素。然而，如果使用
    JavaScript 触发内容推送（例如通过 Ajax 调用），它们可能不会包含在内。要计算这些事件，你应该查看“完全加载（Fully Loaded）”数据。

    5. **完全加载 (Fully Loaded)**：`Fully Loaded` 时间发生在页面所有资产都加载之后，包括主内容加载后由 JavaScript
    触发的任何活动。


    我们将在本章后面以及全书的其他部分查看 WPT 的更多功能。


    ## 专门的感知性能指标 (Dedicated Perceived Performance Metrics)


    让我们快速看几个我们在书中会经常提到的重要感知性能指标。


    ### 折叠以上加载时间 (Above Fold Time)


    `Above Fold Time` (AFT) 是一个重要的指标，可用于量化网站的感知性能。


    AFT 是衡量完全渲染用户起初在屏幕上看到的页面部分所需的时间。浏览器可能仍在加载页面折叠处（below the fold）更下资产。与页面加载时间（PLT）相比，AFT
    能更好地指示用户的性能体验。（在第 4 章中，我们将查看一些 PLT 如何误导感知性能的示例。）


    ### 速度索引 (Speed Index)


    `Speed Index` 于 2012 年添加到 WebPageTest，描述了“[页面可见部分显示的平均时间](https://sites.google.com/a/webpagetest.org/docs/using-webpagetest/metrics/speed-index)”结果以毫秒为单位。数字越小，性能越好。


    速度索引数据可以用于 A/B 测试或一般的竞争对手比较。是一些示例：


    | 网站 | 速度索引 |

    | --- | --- |

    | facebook.com | 3524 |

    | twitter.com | 2604 |

    | sitepoint.com | 1342 |

    | time.com | 10784 |


    ## 注意：A/B 测试


    `A/B 测试` 是向不同的用户展示网站的两个版本（A 和 B）。此过程让你比较两个版本之间的结果。


    ### 页面速度 (PageSpeed)


    Google 对速度索引的回答是 `PageSpeed` 分数。它从 0 到 100 分，分数越高越。Google [认为](https://developers.google.com/speed/docs/insights/about)
    85 分是一个性能良好的页面。可以通过在你的页面上运行 [PageSpeed Insights](https://developers.google.com/speed/pagespeed/insights/)
    工具获取 PageSpeed 分数：


    | 网站 | PageSpeed |

    | --- | --- |

    | facebook.com | 99 |

    | twitter.com | 99 |

    | sitepoint.com | 95 |

    | time.com | 82 |


