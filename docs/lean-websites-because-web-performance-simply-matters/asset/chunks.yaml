    \ |\n\n| [grunt-pagespeed](https://www.npmjs.org/package/grunt-pagespeed) | A\
    \ Grunt plugin to run Google PageSpeed Insights as part of CI. | Measure first\
    \ |\n\n| [grunt-perfbudget](https://github.com/tkadlec/grunt-perfbudget) | Grunt\
    \ task for performance budgeting. | Measure first/Setup baseline |\n\n| [grunt-phantomas](https://www.npmjs.org/package/grunt-phantomas)\
    \ | A Grunt task to produce PhantomJS-based web performance stats collector and\
    \ monitoring tool. | Measure first |\n\n| [grunt-uncss](https://github.com/addyosmani/grunt-uncss)\
    \ | A Grunt task for removing unused CSS from your projects. | Reducing file size\
    \ |\n\n| [grunt-usemin](https://github.com/yeoman/grunt-usemin) | A Grunt task\
    \ that replaces references to non-optimized scripts or style sheets into a set\
    \ of HTML files. | Reduce HTTP requests |\n\n| [SPOFCheck](https://github.com/senthilp/spofcheck)\
    \ | Can be used via CLI to detect SPOF-potential third-party scripts. | Remove\
    \ third-party monsters |\n\nLet's take some of the listed tasks above and apply\
    \ them to an example web page. The page includes a hero image, a link to the jQuery\
    \ library hosted on Google's CDN, a simple jQuery slideshow with previous and\
    \ next buttons, and some links to other JavaScript and CSS files. For comparison\
    \ purposes, I've created two versions of the page, one [prior to running Grunt](http://bbinto.me/lean-websites/crp-grunt/without/magic.html)\
    \ (titled “It's not magic”) and the other [after running Grunt](http://bbinto.me/lean-websites/crp-grunt/with/magic.html)\
    \ (titled “It's magic”).\n\nPrior to running Grunt, the slideshow images are not\
    \ optimized, and there are several individual CSS and JavaScript files that aren't\
    \ minified or concatenated. After running Grunt, the page looks the same, but\
    \ a lot has happened behind the scenes, as I'll detail below.\n\n#### Executing\
    \ Grunt on the Example Page\n\nGruntfile.js defines the tasks to be executed.\
    \ I've included several performance optimizing tools, such as a SPOF check that\
    \ assesses any third-party blocking scripts.\n\nThe Gruntfile I am using here\
    \ is a bit too big to list in this book; you can grab a copy of this file from\
    \ the code archive. To run Grunt, we just execute the `grunt` command on the command\
    \ line in the folder that contains the project.\n\nSo, what has been tested, changed,\
    \ and improved?\n\n*   The local CSS and JavaScript files have been minified and\
    \ concatenated (using grunt-concat, grunt-uglify, grunt-cssmin).\n\n*   The images\
    \ have been optimized via ImageMagick (using grunt-imagemin).\n\n*   The “next”\
    \ and “previous” buttons have been combined into a single sprite file (using grunt-montage)."
