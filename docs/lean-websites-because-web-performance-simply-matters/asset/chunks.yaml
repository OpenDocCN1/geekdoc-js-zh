    首先，使用黑洞 IP 地址，后跟一个空格，然后是你想要模拟 SPOF（单点故障）的第三方主机地址。


    ```

    72.66.115.13 www.google-analytics.com

    72.66.115.13 connect.facebook.net

    72.66.115.13 platform.twitter.com

    ```


    * 在 Mac 上，请确保刷新了 DNS 缓存以应用更改，在 CLI 命令行中输入 `dscacheutil -flushcache`。重启浏览器也会清除浏览器的
    DNS 缓存。

    * 在浏览器中刷新页面，观察 SPOF 是如何处理的。浏览你的网站或其他网站，查看它们如何应对这些脚本的任何一个宕机。


    ### 使用第三方脚本的技巧


    让我们总结一下在本节中讨论的内容。下次考虑包含任何第三方脚本时，请参考以下技巧：


    * 通常情况下，不要仅仅是复制和粘贴脚本。确保你了解它们的作用、应该在何处包含，最重要的是，为什么要使用它们。

    * 不要仅仅因为方便就盲目使用库和框架。引入少量的外部助手和库会为我们的页面增加更多的 HTTP 请求。有时，我们只需要该库提供的功能的一小部分，而某些特定功能可以很容易由我们编写——代码行更少，且不需要额外的
    JavaScript 引入。

    * 在包含第三方脚本之前，务必为自己留出时间进行评估。验证提供商是否关注性能，或者他们是否能就如何正确包含他们的脚本提供帮助。在选择提供商之前，检查他们的代码是否经过了合并和压缩，以及他们是否建议使用异步选项来包含脚本。这应该让你对性能在他们的优先级列表中的地位有一个良好的了解。Google
    发布了一份提供异步选项的第三方提供商列表。查看此[列表](https://developers.google.com/speed/docs/insights/UseAsync)
    以验证哪些提供商符合性能规范。

    * 将第三方提供商的风险和故障写入服务水平协议（SLA）。确保协议在第三方提供商宕机时能涵盖你的损失补偿。这可能会促使提供商以最高效的方式帮助你包含脚本。


    ### 提示：选择第三方提供商


    [JS Manners](http://jsmanners.com/) 是一个实用的评分系统，帮助发布者根据特定的性能特征选择正确的第三方提供商。


    ## 总结


    * 你已经学习了如何使用 HTML Tidy 或 HTML Compressor 等工具优化 HTML 标记以提高性能。

    * 你学习了 CSS 的最佳实践，以及何时以及如何使用不同的性能选择器。记住，最高效的 CSS 选择器是 ID。

    * 网页设计必须考虑速度。事实上，速度必须是首要的设计标准。为了保持页面大小较小，图形应保持最少，且只有在多媒体效果确实能增加用户对信息的理解时才使用它们。


    这条注释来自 [Nielsen Norman Group](http://www.nngroup.com/articles/the-need-for-speed/)
    早于 1997 年。但即使在几乎 20 年后的今天，它实际上仍然是一个有效的建议：只有当资产确实为你的页面增加价值时，才包含它们。


    ## 优化图像


    尽管图像由于其证明[与加载时间高度相关](http://httparchive.org/interesting.php#onLoad)，仍然是网站臃肿和缓慢的罪魁祸首，但它们也提供了最大的优化机会。


    首先，让我们来看常见的图像格式、每页平均图像大小，以及 Alexa 排名网站上使用的图像中位数大小。


    互联网上最常用的内容类型是 `image/*` 类型。进一步细分，最常用的图像格式是 JPEG，其次是 PNG 和 GIF，如图图 7.1 所示：


    ![Alexa 排名网站常用图像格式的查询结果](img/7-most-used-images.png)


    图 7.1. [查询](http://bbinto.github.io/lean-web-code/chapter-7/queries/) Alexa 排名网站常用图像格式的结果


    Alexa Alexa 排名网站上使用的图像中位数大小为 30220 字节，而每页图像总大小平均约为 [1206KB](http://httparchive.org/interesting.php#onLoad)，如图图
    7.2 所示：


    ![平均大小](img/7-image-size.png)


    图 7.2. [平均大小](http://httparchive.org/interesting.php#onLoad)


    ### 压缩与图像格式


    优化图像最有效的方法是进行压缩。图像压缩的原理是移除冗余的图像数据。通过这样做，图像大小被大幅缩小，资产可以更快地传输给浏览器。


    图像压缩可以是有损或无损的。


    * 有损图像压缩：“有损”过滤器*消除*某些像素数据，主要应用于照片。

    * 无损图像压缩：“无损”过滤器会*压缩*像素数据——技术图纸、剪画或漫画的理想选择。


    此外，编码图像数据有两种方法——位图和矢量图形，我们将在接下来介绍。


    #### 位图（Raster Graphics）


    位图通过编码矩形网格内每个像素的单个值来表示图像。以下图像格式属于位图范畴：


    | 格式 | 压缩 | 描述 |

    | --- | --- | --- |

    | [JPEG](http://en.wikipedia.org/wiki/JPEG) | 有损 | 照片或截图的最佳选择，但不建议用于 Logo 或线条画。
    |

    | [JPEG2000](http://en.wikipedia.org/wiki/JPEG_2000) | 有损和无损 | 与 JPEG 相比最大的优势是它提供了有损和无损压缩。能够交付比
    JPEG 小得多的但细节相同的文件。 |

    | [渐进式 JPEG](http://en.wikipedia.org/wiki/JPEG) | 有损 | 按系列扫描加载，从低分辨率版本开始，中间有几个版本，直到达到全分辨率。
    |

    | [GIF](http://en.wikipedia.org/wiki/Graphics_Interchange_Format) | 无损 | 仅支持 256
    色颜色。如果你只需要几种不同的颜色，或者需要创建文本图像，请用它替代 JPEG。支持透明度，但现在更多是以其支持动画闻名。 |

    | [PNG](http://en.wikipedia.org/wiki/Portable_Network_Graphics) | 无损 | 比 GIF 可压缩
    5%–25%。也支持透明度。如果你需要保留大量颜色，请用替代 GIF。PNG-8 与 GIF 类似，支持最多 256 种颜色，而 PNG-24 能够显示数百万种颜色。
    |


