    Instagram 是少数真正关注设计与速度共生的公司之一。[他们的初衷](https://speakerdeck.com/mikeyk/secrets-to-lightning-fast-mobile-design)是找到让速度成为一种设计特性的解决方案。


    ## 感知与抢占性网页性能


    性能是用户体验的一部分。即使你的网站的实际性能可能并不理想，也有办法可以欺骗用户让他们认为网站性能更好。


    这涉及到感知性网页性能和抢占性网页性能。`感知性能`定义了用户对你网站加载过程的感知或感受，而`抢占性网页性能`则涉及预测用户可能想要加载的内容，并提前分发以减少随后的加载时间。正如我们在第
    1 章中中学到的，你不希望用户在等待网页内容加载时感到无聊。如果用户看到的是响应迅速的系统并被持续告知进度，那么网站就会感觉很快。


    遵循“假装，直到你成真”（fake it till you make it）的原则可以帮助提高网站的感知速度。一些可以让网站访问者相信网站响应且快速的技巧包括：


    *   `离线缓存`：许多现代浏览器现在都支持这种技术，它可以用于提供一种性能的幻觉。它帮助[Instagram](http://www.fastcodesign.com/1669788/the-3-white-lies-behind-instagrams-lightning-speed)创建了快速感的用户体验。与其等待服务器响应照片上传，离线缓存会展示用户刚刚尝试上传的照片。之后，照片会被实际发送到服务器。如果你关注移动浏览器中的加载旋转图标，你就能自己发现这个技巧。


    *   `提供即时反馈并报告进度`：让用户知道他们在浏览你网站的旅程中处于什么位置。


    *   `将重要功能放在页面顶部`：通过向用户展示位于`折线以上`（ATF）的重要内容——即在页面顶部，这样他们无需滚动屏幕——可以提高感知性能。第 5 章将会有更多关于
    ATF 的内容。


    *   `避免过多的步骤`：尽可能减少用户为了实现目标需要经过的障碍次数。


    抢占性策略更进了一步，但需要更多的智能。一个[例子](http://java.dzone.com/articles/mobile-ux-refining-perceived)是
    Instagram 的照片上传功能。在用户点击上传按钮之前，图像会在后台上传，这完全是基于这是用户最终意图的假设。但这种方法并非总是推荐的。例如，如果用户的移动设备上没有良好的流量套餐并想要节省带宽，如果他们实际上并不想上传照片，这可能会让他们感到非常困扰。


    ### 注意：实现抢占性性能


    较新的浏览器已开始采用抢占性方法，支持诸如 `prefetch` 和 `prerender` 属性，这些属性让浏览器预读可能需要的资源。第 5 章将详细讨论这些属性。


    ## 性能打分系统


    现在我们已经学习了一些基础的 IA（信息架构）、设计和性能方法，我想提出一种实用的技术来连接 IA、设计与性能：`性能打分系统`。这可能是一个有趣且易于上手的方法，特别是当你与设计团队合作时。这个打分系统背后的理念是为团队中开发前的非技术成员提供一种简单的方法，让他们理解网站的哪些组件可以被认为是“重量级的”，哪些元素能提供更好的感知性能。


    这关乎“分而治之”，即将问题分解为相同类型的子问题，直到单个子问题变得简单到可以直接解决。


    我们可以将线框图的视觉元素分解为可衡量的性能模块。然后我们可以移动并安排它们，不仅为了实现直观的信息架构，为了获得良好的用户体验。


    每个模块被分配一个数字，该数字定义了它的性能影响。在线框图绘制结束时，将这些数字相加得到一个分数。数字越低，预期性能越好。


    这种方法表明，你不需要通过遵循性能模式来让你的网站“饥饿”。在本书的语境下，精简网站并不是指缺少任何信息或交互的网站。它仅意味着创建网站时采用了应用和遵循网页性能范式的理念，我将在后面的章节中详细探讨这一点。


    ### 可衡量的性能模块


    `可衡量的性能模块`（MPM）描述了线框图中一个简化的、单一性能单元。它的主要目的是帮助设计和内容团队的非技术成员理解每个模块对整个网站性能的影响。


    这可能不是“感知性能”最科学的翻译，但在项目早期的线框绘制和设计阶段，对于大家达成共识非常有帮助：


    | 模块 | 分值 | 描述 |


    | --- | --- | --- |

    | 低影响 | 1 | 小图片、大部分静态内容和简单图形、如按钮和文本字段等交互元素。 |

    | 中影响 | 2 | 中等大小的图片和简单脚本。 |

    | 高影响 | 6 | 大图片以及加载重量型 JavaScript 或 JavaScript 和图像的第三方脚本（如广告）。 |


    与你的设计团队坐在一起，拿一把铅笔，开始在线框图中标记 MPM。根据上面的表格，尝试识别线框图上的哪些模块代表低、中、高性能影响。这不仅对于创建线框图的设计师有用，也对于必须规划关键路径的开发者很有用。（关键路径——我们将在第
    5 章中详细讨论——描述了渲染页面初始视图的代码和资源。）


    这项练习的最终目标让整个团队专注于尽可能高效地加载和显示内容。


    ### 案例研究：时代周杂志网站


    以下案例研究用于展示你如何通过在网站应用 MPM 来改进线框绘制过程。


    让我们看看时代周杂志网站：


    ![时代周杂志加载](img/2-time.png)


    图 2.1. 时代周杂志加载


    我们可以从上面的图 2.5 中的“胶片”中看到，主故事图像在六秒后才出现。在此之前没有可见内容。我将其进一步分解为简单的线框图，以说明网站在加载过程中，折线以上部分在不同时间点的状态。


    让我们仔细观察当前的顺序：


    ![3 秒后，我们只看到菜单和杂志图片](img/2-wf-time-3s.png)


    图 2.2. 3 秒后，我们只看到菜单和杂志图片


    ![5.7 秒后，其他重要部分正在加载](img/2-wf-time-57s.png)


    图 2.3. 5.7 秒后，其他重要部分正在加载


    ![7.5 秒后，折线以上大部分的可见内容已加载](img/2-wf-time-75s.png)


    图 2.4. *7.5 秒后，折线以上大部分的可见内容已加载*


    还有改进空间，特别是如果我们的目标是尽快显示头条故事元素。


    #### 基于 MDM 的当前性能顺序


    让我们看看如何将打分和排序系统应用于线框图。

