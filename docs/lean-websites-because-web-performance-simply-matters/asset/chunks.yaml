    # Introduction


    *   [WebPagetest](http://webpagetest.org) is the silver bullet for everything
    performance related. Depending on the test location you choose, you can select
    one of several device and browser options. You can obviously only test one page
    of your site at a time, but this might sometimes be enough. The synthetic WPT
    result will help you understand how your site is performing on mobile. However,
    you probably wouldn''t use it for debugging, as it''s static and won''t allow
    user interaction.


    To simulate different connection speeds, you can use Chrome''s developer tools,
    [Slowy](http://slowyapp.com/) or [Wireshark](https://www.wireshark.org/).


    ## Real Device Testing


    If you can build a device lab of real devices, [like Etsy has](https://codeascraft.com/2013/08/09/mobile-device-lab/),
    the following tools can help you facilitate testing on those devices:


    *   [Adobe Edge Inspect](https://creative.adobe.com/products/inspect) helps you
    live-test your website on multiple browsers by pairing your testing devices with
    your computer.

    *   [Shim](https://github.com/dmolsen/shim), running as a Node.js application,
    is similar to Adobe Edge Inspect, being able to load a page simultaneously on
    several devices that are connected to the same WiFi network.


    ### Tip: Simulator vs. Real Device Testing


    It''s always better to test on real devices than on simulators, especially if
    you have made a conscious decision to support specific browsers and device OSs.
    Simulators can''t provide a proper simulation of battery consumption, for example,
    or of connection speed, or performance, and they can''t replicate a touch screen
    experience with a mouse. So while they can be handy for simple testing purposes,
    don''t put too much faith in them. Of course, you have to balance this consideration
    with the cost and logistics of testing a range of different devices.


    ## Cool Down


    *   Mobile usage is on the rise, and browsing via mobile devices will soon surpass
    desktop browsing.

    *   Particular challenges for mobile are speed, battery life and power consumption.
    When developing mobile websites, assume the worst connection for your user.

    *   Device description repositories are regularly updated lists of the many devices
    on the market, and can be used to identify the devices being used to connect with
    your site.

    *   You can detect devices based on the HTTP user agent string header, either
    via server-side or client-side solutions.

    *   There are some helpful tools for testing (or simulating) your website on mobile
    devices.


    * * *


