    * You''ve learned how to setup your own performance dashboard, starting with a
    private HTTP Archive instance, and collecting RUM data to understand your users''
    bandwidth, load times, and more importantly latency. In addition, you''ve been
    introduced to monitoring products and alert systems to help you combat performance.

    * You''ve learned how to set realistic performance goals based on the RUM measurements
    of your site, WPT results, as well as competitive comparison analysis.

    * Overall, you''ve been guided to spot performance problems for your own website.
    Now let''s fix them!

    * CTA buttons could be “Buy”, “Shop” and so on, depending on what you want your
    visitor to achieve with their visit.


    # Chapter 5: Mastering Lean HTTP Requests


    ## Warm Up

    We''ve learned that latency is one of the biggest bottlenecks when it comes to
    web performance. The best way to reduce latency is to cut down the amount of HTTP
    requests the browser has to make, and to minimize the size of each individual
    asset being requested. In order to understand how to master lean HTTP requests,
    I will first explain how the browser processes them. After helping you grasp how
    the browser works, I''ll discuss several ways to scale down and optimize HTTP
    requests, such as image spriting, concatenation, and minification.


    ## Understanding How the Browser Works

    By understanding how the browser renders your content, you''ll gain a lot of insight
    into how to structure and order your page elements. The browser has the task of
    loading assets, called HTTP requests. As we''ve seen from dissecting an HTTP transaction,
    each asset has several metrics attached to it to help measure its performance.


    The following process diagram shows what steps the browser goes through to render
    a page and its assets. **Rendering**—the process of displaying the requested content
    in the browser window—is the primary function of a browser:


    ![How the browser renders](OEBPS/figures/5-browser-rendering.png)


    Figure 5.1. How the browser renders


    ### Note: The Rendering Rule

    Any ambiguity that the browser encounters when rendering a page will block rendering
    until it''s resolved. Make sure to provide your browser with clean markup and
    instructions on how to render your page.


    Let''s go through the diagram shown in Figure 5.1:


    #### HTML

    HTML parsing is a crucial piece in the rendering puzzle and leads to the construction
    of the document object model. Parsing happens incrementally, so that the browser
    can discover required and upcoming requests while sending the necessary responses.


    #### Document Object Model

    The browser parses the HTML document to construct a **document object model**
    (DOM)—a tree structure that describes the elements on the page.


    #### CSS

    The CSS is **render blocking**, which means that the browser needs to load *all*
    CSS files referenced in the HTML markup prior to rendering the content. Without
    styling, a page can be impractical and sometimes even unusable. An effect called
    the “flash of unstyled content” (FOUC) could happen if your CSS is loaded too
    far towards the bottom of the page.


    #### CSS Object Model

    In addition to parsing the HTML, the browser also has to process the style sheets
    (the CSS) in order to understand how the elements in the DOM should be displayed.
    We refer to this as the CSS Object Model (CSSOM). Both the DOM and the CSSOM together
    allow the browser to paint the page.


    #### JavaScript

    JavaScript adds the power to manipulate and interact with the DOM, causing the
    render tree to change. If that happens, rendering is blocked until the browser
    has parsed and executed the script. JavaScript can be loaded synchronously, blocking
    the DOM, or asynchronously, which will not interrupt document parsing. JavaScript
    won''t run until the CSSOM is fully loaded. Different browsers run on different
    JavaScript engines. Depending on your users'' browsers, they might experience
    the performance of your website differently, especially if it''s a heavy JavaScript
    web application.


    #### Render Tree

    The **render tree** combines the content and style information of the entire visible
    content on the screen. It is the event where the DOM and CSSOM come together.


    Not all nodes from the DOM will end up in the render tree. For example, scripts
    and meta tags are non-visible elements and won''t be seen by the user.


    In addition, the `visibility: hidden` style declaration won''t insert its child(ren)
    into the render tree, but it will be rendered and displayed as an empty box. Elements
    (nodes) using the `display:none` style declaration, however, won''t be added to
    the render tree.


    #### Layout

    While the render tree gets us closer to actually seeing content on the screen,
    there is still something important missing: this process doesn''t define the position
    or size of each node on the page. That is what the **layout** step takes care
    of.


    #### Paint

    The final step is to **paint** the pixels. The style sheets define how expensive
    the paint process will be. If you have complicated styles, such as drop shadows
    or CSS animations, this could add complexity to your render tree, resulting in
    a slower load time. The paint step will reveal if your website, when scrolled,
    is jank-free or not. Repainting is expensive for the graphics processing unit
    (GPU) and can cause your page to feel clunky when scrolling.


    ### Note: Jank

    **Jank** refers to anything that feels clunky or delayed when scrolling through
    a page. It''s basically the opposite of smooth scrolling. For example, jank effects
    can occur when JavaScript tries to repaint a lot of content during an `onscroll`
    handler.


    ### Note: JavaScript Engines

    Some popular engines are Nitro, SpiderMonkey, V8 and Chakra:


    | Engine | Browser |

    | --- | --- |

    | Nitro (JavaScriptCore) | Safari |

    | SpiderMonkey | Firefox |

    | V8 | Google Chrome |

    | Chakra | Internet Explorer |


    Douglas Crockford, the “father of JavaScript”, built a representative performance
    benchmark tool to compare JavaScript engines:


    ![Performance comparison of different JavaScript engines (by Douglas Crockford)](OEBPS/figures/5-javascript-engine.png)


    Figure 5.2. Performance comparison of different JavaScript engines (by [Douglas
    Crockford])


    ### Critical Rendering Path

    By going through the page rendering process above, we have actually traversed
    through what''s known as the **critical rendering path** (CRP). The CRP describes
    the code and resources that are required to render the initial view of a page—or
    the visible, above the fold part.


    Let’s traverse through the CRP with a basic example:


    ```

    1\. <html>

    2\.  <head>

    3\.      <link rel="stylesheet" href="style.css">

    4\.  </head>

    5\.  <body>

    6\.      <div>Hello Friends!/</div>

    7\.      <img src="bbinto.jpg">

    8\.      <script src="load_map.js"></\/script>

    9\.  </body>

    10\. </html>

    ```

    ```


    There are several steps that happen to render this page:


    1.  The browser begins to construct the DOM after it receives the HTML. That’s
    also when the browser discovers the `link` tag and sends the request to retrieve
    the CSS.

    2.  The CSSOM can only be built when CSS has arrived, which is why the CSS is
    render blocking. The DOM building can’t be finished yet, because JavaScript has
    not been parsed.

    3.  Once the CSS arrives, the browser can build the CSSOM, which then unblocks
    the JavaScript.

    4.  Now the JavaScript can load, which unblocks the DOM to finish. The browser
    will merge DOM and CSSOM into the Render Tree.

    5.  Finally, the browser can complete the Layout and Paint steps.


    [Figure 5.3] illustrates what''s happening as the browser completes these steps:


    ![The critical rendering path](OEBPS/figures/5-crp-path.png)


    Figure 5.3. The critical rendering path

    '
