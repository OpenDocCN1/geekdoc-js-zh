  trans: "\n\n*   **ESI 重定向：** 在脱离 CDN 网络运行时，ESI 重定向非常有用，并且可以根据用户代理字符串（user agent\
    \ strings）进行设置。所有操作都在边缘端完成；用户永远不会获得他们不应该接收的内容。此外，在处理 ESI 时，无需返回源站进行处理，从而减轻了源站的负载。\n\
    *   **客户端重定向：** 重定向通过客户端脚本（如 JavaScript）完成。在执行任何验证、选择或检测之前，整个页面都会被发送给用户。\n\n那么，你应该选择这些方法中的哪一种？\n\
    \n通常情况下，服务器端重定向比客户端重定向快，因此如果在这两者之间进行选择，我建议侧重于服务器端解决方案。然而，如果你使用 CDN 且支持 ESI，我会认为这是首选方案，因为\
    \ ESI 重定向与普通的服务器端重定向相比，还有一个额外的优势：它发生在边缘端，比将重定向逻辑放在源站要速度快得多。\n\n在我看来，客户端重定向是最不受青睐的方案，因为任何需要客户端去解决的问题（例如\
    \ JavaScript 执行）都会影响设备的性能、电池电量和 CPU 消耗。\n\n无论你选择哪种重定向方法，请记住不要限制用户仅查看网站的移动版。始终给他们提供覆盖重定向策略并查看完整网站的选择，因为人们不喜欢被强迫做事情！\n\
    \n### 响应式网站\n\n除了提供专门的 mdot 站点外，还有另一种完全不同的方法来针对移动设备优化网站。Google 的[移动端最佳实践](https://developers.google.com/webmasters/smartphone-sites/)建议网页开发者应该创建响应式网站。`响应式网页设计`（RWD）由\
    \ Ethan Marcotte 在 2010 年提出，其核心思想是为所有设备提供同一个相同的 HTML 页面。网站只有一个版本，但它针对不同的设备有不同的*样式（styled）*处理。RWD\
    \ 依赖于 CSS3 媒体查询、流式网格和柔性图像。当浏览器窗口低于（或高于）某个定义的宽度时，媒体查询会提供专门针对的样式。媒体查询指定的转换点被称为`断点（breakpoints）`。\n\
    \n为了让网站能够按照描述的方式进行转换，布局必须是灵活的。流式网格使用变量测量值（如百分比）而不是像素设计的，因此网格容器内的元素可以根据父容器的大小进行调整。图像也使用相对单位进行尺寸设置，以保持其灵活性并始终包含在父元素中。\n\
    \n以下是使用媒体查询的一些示例。你既可以在 `link` 元素中使用 `media` 属性，也可以在样式表本身中使用 `@media`。\n\n*   通过媒体查询加载的外部样式表：在下面的示例中，`mobile.css`\
    \ 将用于任何宽度低于 321px 的设备；竖屏模式下的任何设备将改用 `portrait.css`；当页面打印时将使用 `print.css`：\n\n\
    ```\n<link rel=\"stylesheet\" media=\"(max-width: 320px)\" href=\n\"mobile.css\"\
    >\n<link rel=\"stylesheet\" media=\"(orientation: portrait)\" href=\n\"portrait.css\"\
    >\n<link rel=\"stylesheet\" media=\"print\" href=\"print.css\">\n```\n\n#### 警告：潜在的性能成本\n\
    \n这种技术伴随着性能成本。即使媒体查询返回假，大多数浏览器也会[下载所有](http://scottjehl.github.io/CSS-Download-Tests/)\
    \ CSS 文件，如图 11.3 所示：\n\n![无论用户实际匹配何种媒体，浏览器都会下载所有三个 CSS 文件](img/11-mediaquery-css.png)\n\
    \n图 11.3。无论用户实际匹配何种媒体，浏览器都会下载所有三个 CSS 文件。\n\n与其浪费这些额外的 HTTP 请求，不如将样式放入一个 CSS 文件中，如下所示。如果你仍然希望在样式表中保持结构和分离，请在开发期间保留单独的文件，但在部署时合并为一个文件，以节省额外的\
    \ HTTP 请求。\n\n*   这里是上述相同 `@media` 指令的示例，这次包含了样式表内部：\n\n```\n@media (max-device-width:\
    \ 320px) {\n  /* 移动样式 */\n}\n@media (orientation: portrait) {\n      /* 竖屏样式 */\n\
    }\n@media print {\n    /* 打印样式 */\n}\n```\n\n[Guy Podjarny 的研究](http://www.guypo.com/real-world-rwd-performance-take-2/)显示，大多数响应式网站尚未关注网页性能：72%\
    \ 使用响应式设计的网站没有针对移动端进行优化。在小屏幕设备上查看时，这些页面的权重与在大屏设备上查看的页面相同。尝试避免为了便利而牺牲性能，因为性能对于移动网站来说仍然是关键。\n\
    \n总的来说，优化移动网站的性能似乎比优化 RWD 网站要容易。让我们比较一下响应式网页设计的优缺点。\n\n#### RWD 优点\n\nRWD 相比优于专门的\
    \ mdot 站点的优势包括：\n\n*   **跨平台共享**：你是否收到过朋友分享的链接，但当你在笔记本电脑上打开它时，它打开的是移动版？有了 RWD，你只需要共享一个\
    \ URL，无需担心向用户显示哪个版本？（注：此处原文漏了一个问号）\n*   **搜索引擎优化（SEO）**：Google [指出](https://developers.google.com/webmasters/mobile-sites/mobile-seo/overview/select-config)响应式网页设计是其“推荐的设计模式”。响应式网站对所有设备只有一个\
    \ URL，且内容（通常）相同。因此，Google 爬取和索引你的内容的工作将变得更轻松。\n*   **维护的代码库更少**：将工作整合到一个网络属性中带来了一些维护优势，一个代码库服务所有设备属性。\n\
    \n#### RWD 缺点\n\n响应式网站可能不如 mdot 站点效率高，因为它们有时会向移动设备提供不需要的内容：\n\n下载与 `display: none`\n\
    \n对于较小的设备，并不是所有内容都应该显示。因此，内容需要被移除，或者像大多数 RWD 网站那样，只是不显示。然而，不显示某些内容并不意味着它没有发送给客户端。正如我们在第\
    \ 5 章中学习到的，关键渲染路径上任何带有 `display: none` 的内容仍然会被加载到渲染树中。你基本上是在视觉上隐藏了资源，但仍然要求浏览器下载它们——这并不高明！\n\
    \nDOM 元素的重复\n\n在开发 RWD 网站时，代码中加入了大量的逻辑来处理和移动框框及容器，这导致 DOM 不可避免地变得越来越且复杂。代码越多，下载量越大，浏览器构建页面时的工作就越多。\n\
    \n下载与调整大小\n\n记得我们讨论过应该为用户提供合适的图像大小吗？这对于 RWD 来说就变成了一个挑战。你希望在小屏幕上显示精美的图片，但又不想在大屏幕上显示时放弃它的质量和尺寸。你该怎么办？为了美观牺牲尺寸并加载较大的图像，但在小屏幕上进行缩放？考虑到图像是性能大挑战之一，我们根本不应该这样做。\n\
    \n"
- fmt: "\nSo for now, here are my two cents: based on statistics, I'm not convinced\
    \ I would use RWD over a dedicated mdot site if speed and user experience are\
    \ the things I care about the most. However, if you can't pay for a dedicated\
    \ mobile site, I can recommend RWD, but only by following the best practices.\n\
    \n### Note: Responsive Images to the Rescue?\n\nThere has been a movement in the\
    \ performance community to address the problem of RWD sites being heavier than\
    \ dedicated mobile sites. As we've discussed earlier, images are the main culprit\
    \ for heavy websites. Responsive images aim to serve optimized images to RWD websites,\
    \ removing unnecessary, bloated images for smaller devices.\n\nThe idea behind\
    \ a responsive image is that the browser will display the image intelligently,\
    \ choosing from a number of versions of the image based on the capabilities of\
    \ the device. Conceptually, the image responds to the current device it's displayed\
    \ in, and changes its dimensions and file size accordingly.\n\nThe [Responsive\
    \ Images Community Group](http://responsiveimages.org/) lists several approaches\
    \ to serving images appropriately to different devices. Guy Podjarny's [Responsive\
    \ & Fast: Implementing High-Performance Responsive Design](http://www.akamai.com/dl/akamai/responsive-and-fast-implementing-high-performance-responsive-design.pdf)\
    \ also outlines best practices on using responsive images.\n\nThe good news is\
    \ that this is a great step towards serving the right image size to the right\
    \ device, and downloading only a smaller image if that's all that's required.\
    \ The bad news is, not all browsers support responsive images yet.\n\nBoth mdot\
    \ and RWD have their performance advantages and disadvantages. The next section\
    \ describes a hybrid approach that combines the best of both methods.\n\n### RESS\n\
    \nRESS stands for [Responsive Web Design with Server Side Components](http://www.lukew.com/ff/entry.asp?1392),\
    \ and refers to the use of responsive design in combination with server-side components.\
    \ It solves many of the issues with RWD, utilizing advantages of the mdot approach.\
    \ The server-side components enable the offloading of unwanted content before\
    \ serving it to the client, while media queries are still used to accomplish responsive\
    \ layouts. There are two RESS approaches you can take, which are detailed below.\n\
    \n#### Original RESS\n\nRESS is my favorite approach for serving content to different\
    \ devices. It combines the best of both worlds, as you can present one single\
    \ URL for all devices, but create a situational experience like this:\n\n* Server-side\
    \ components take care of any heavy lifting, or complicated calculations such\
    \ as JavaScript libraries, page templates, and other functionalities.\n* Client-side\
    \ components take care of anything more layout-specific, such as changing and\
    \ moving boxes—mostly things that can easily be handled by media queries.\n\n\
    For example, imagine you have a website presenting news with text and images:\
    \ the mobile and desktop versions should deliver the same content. Let's assume\
    \ the desktop version includes a bigger header and footer, whereas the mobile\
    \ version's header and footer are simpler and smaller, so basically just differently\
    \ designed but with the same functionality. The images for desktop should be higher\
    \ resolution than the mobile versions. A possible RESS approach to this scenario\
    \ would be as follows:\n\n##### Server-side components\n\nDetect the device on\
    \ the server, and deliver a different image based on the device. Let's assume\
    \ we have a small version of an image stored as `s_photo1.jpg`, and the original\
    \ size `photo1.jpg`.\n\nThe `<?=$device_prefix?>` is determined on the server,\
    \ based on the device, and will be dynamically included once the page loads on\
    \ the user's end. The following code is provided in PHP and shows what prefix\
    \ should be served for an iPhone:\n\n```php\n<?php\n    $ua=$_SERVER['HTTP_USER_AGENT'];\n\
    \    $device_prefix = '';    \n    if(preg_match('/iphone/i',$ua)) {\n       \
    \ $device_prefix = 's_';\n    }\n?>\n```\n\nAnd this is how you would write the\
    \ corresponding HTML code:\n\n```html\n<img src=\"<?=$device_prefix?>photo1.jpg\"\
    \ alt=\"Example photo\"/>\n```\n\n##### Client-side components\n\nThe client-side\
    \ components can take care of the styling of the header and footer via media queries.\
    \ These queries can be stored in a CSS file as follows (simplified for the sake\
    \ of this example):\n\n```css\nheader {\n    height:100px;\n}\n\nfooter {\n  \
    \  height:60px;\n}\n\n@media (max-device-width : 560px) {\n    header {\n    \
    \    height:50px;\n    }\n    footer {\n        height:20px;\n    }       \n}\n\
    ```\n\n#### RESS with ESI\n\nAs mentioned earlier, ESI can be a powerful tool\
    \ for dealing with device detection and direction, so why not combine RESS with\
    \ ESI?\n\nWith ESI, it's also possible to serve one single URL for your desktop\
    \ and mobile site. Based on the device the user is using to connect with your\
    \ site, you can create a content and markup switch for the entire page:\n\n```html\n\
    <!--esi\n<esi:choose>\n<esi:when test=\"$(HTTP_USER_AGENT) matches_i $(mobile_ua)\"\
    >\n       <!-- Mobile head and body -->\n     </esi:when>\n     <esi:otherwise>\n\
    \       <!-- Desktop head and body -->\n    </esi:otherwise>\n</esi:choose>\n\
    -->\n```\n\nThe code snippet above demonstrates how easy it is to serve completely\
    \ different markup and content to a mobile device.\n\n## Comparison of Mobile\
    \ Site Approaches\n\nEach approach to optimizing content for mobile devices has\
    \ advantages and disadvantages, and several factors need to be considered when\
    \ deciding which to use. What is my budget? How many resources do I have to support\
    \ the website moving forward? How important is it to serve my site's content differently\
    \ on different devices and in different contexts?\n\nLet's list each technique\
    \ and describe its pros and cons:\n\n| | Pros | Cons | Watch out |\n| --- | ---\
    \ | --- | --- |\n| mdot | Focus on performance, content adaptation, delivering\
    \ only what is needed. | Multiple URLs (not easy to share), device detection repository\
    \ needed, potentially complicated redirect logic, content forking, redirect with\
    \ additional loading time. | Constant updating of device filters. |\n| RWD | One\
    \ URL for all content, no redirects, easy to share, suggested by Google, better\
    \ for SEO, no device repository required. | Careful planning involved, content\
    \ served that is not required, potentially hurting performance. | Bloated websites\
    \ with duplicated DOM elements and so on. |\n| RESS (with ESI) | If required,\
    \ one URL for all content, no redirects, easy to share. | Device detection or\
    \ feature detection required. RESS with ESI: no need to go back to the origin\
    \ for processing, hence load at the origin is cut down. | Constant updating of\
    \ device filters. |\n\nMy advice is to use RESS with ESI where access to a CDN\
    \ with ESI support is available. This approach provides the most flexibility,\
    \ and is best able to determine what to serve to a specific platform or device.\n\
    \n## Cool Down\n\n* Various techniques such as offline storage are useful for\
    \ improving perceived performance and reducing latency on mobile devices.\n* The\
    \ user agent HTTP header can be used to manage and detect devices.\n* Three main\
    \ options—mdot, RWD and RESS—exist for serving content efficiently to mobile devices.\
    \ As always with performance, your choice depends on your current needs and resources.\n\
    * If you choose RWD, don’t just make the website responsive. Also pay attention\
    \ to performance.\n* Learn how to use media queries properly. Try to avoid practices\
    \ like setting unwanted content to `display:none`, as the hidden content will\
    \ still be downloaded onto the device.\n* Bypass extensive client-side processing\
    \ (JavaScript, and non-optimized, third-party scripts), and try to move the logic\
    \ from the front-end to the back-end.\n* Strive to create the best user experience\
    \ based on the user's platform and device. Know device specific features, and\
    \ pitfalls, and take advantage of that knowledge.\n"
