- fmt: "\nLet's start with a couple of questions that can be answered via the captured\
    \ data. Please note that the following examples use SQL to query the database.\
    \ If you aren't familiar with SQL queries, check out [some courses](https://www.coursera.org/course/db)\
    \ or [tutorials](https://www.udacity.com/course/viewer#!/c-cs253/l-48756013/m-48691560),\
    \ and review some of the [HTTP Archive queries](https://gist.github.com/igrigorik/5801492)\
    \ by Ilya Grigorik to get you started.\n\n## How Big Is the Biggest Image?\n\n\
    Run the following query to reveal the answer to this question:\n\n```\nSELECT\
    \ req.url, req.respSize, req.mimeType, pages.url FROM requests\n↵ as req\nJOIN\
    \ (SELECT url , pageid, rank FROM pages) as pages\nON pages.pageid = req.pageid\n\
    WHERE req.mimeType like 'image%'\nORDER by req.respSize DESC\n```\n\n![Discovering\
    \ the biggest image used](OEBPS/figures/4-http-archive-query.png)\n\nFigure 4.3.\
    \ Discovering the biggest image used\n\n## What Is the Slowest Page?\n\nYou can\
    \ discover the slowest page by running the following query, shown in [Figure 4.4](#ch04.html_ch4renderstart\
    \ \"Figure 4.4. Analyzing render start times\"):\n\n```\nSELECT url, renderStart\n\
    FROM pages\nGROUP BY url\nORDER BY renderStart DESC\n```\n\n![Analyzing render\
    \ start times](OEBPS/figures/4-httparchive-cbc-renderstart.png)\n\nFigure 4.4.\
    \ Analyzing render start times\n\n## What Pages Exceed 200 Requests Per Page?\n\
    \nLet's find pages that are making more than 200 requests, shown in [Figure 4.5](#ch04.html_ch4totalreqs\
    \ \"Figure 4.5. Finding pages that exceed 200 requests\"):\n\n```\nSELECT url,\
    \ reqTotal\nFROM pages WHERE reqTotal > 200\nGROUP BY url\nORDER BY reqTotal DESC\n\
    ```\n\n![Finding pages that exceed 200 requests](OEBPS/figures/4-httparchive-cbc-counts.png)\n\
    \nFigure 4.5. Finding pages that exceed 200 requests\n\nGoing through the results\
    \ table of this query will help you identify bottlenecks and verify if the page\
    \ really needs to fetch more than 200 assets.\n\n## Create Your Private RUM Tests\n\
    \n[boomerang.js](http://yahoo.github.io/boomerang/doc/) is an open-source tool\
    \ that can help you track RUM data. The following section will outline, in a few\
    \ simple steps, how you can set up RUM for your site.\n\n![How the Navigation\
    \ Timing API is structured](OEBPS/figures/4-rum-explained.png)\n\nFigure 4.6.\
    \ [How the Navigation Timing API is structured](https://www.igvita.com/slides/2012/html5devconf/#8)\n\
    \nAs a refresher, the Navigation Timing API provides access to different events\
    \ throughout the journey of a page being delivered to the user. There are the\
    \ user's connectivity events, the server events, as well as the events executed\
    \ by the browser (from left to right in [Figure 4.6](#ch04.html_ch4-navtiming\
    \ \"Figure 4.6. How the Navigation Timing API is structured\")). For example,\
    \ we can go ahead and measure the server response time:\n\n```\nvar page = performance.timing,\n\
    rt = page.responseEnd - page.responseStart,\n\nconsole.log(rt); // server response\
    \ time\n```\n\nIn order to track any information about your users, JavaScript\
    \ code needs to be included in the page that is to be tested.\n\nYou can track\
    \ your users' performance data by creating a `beacon` that will send the RUM results\
    \ back to your server. A beacon is a request made purely to send performance data\
    \ back to your server. Until the W3C [Beacon API](http://www.w3.org/TR/beacon/)\
    \ is available, you'll need to create a beacon yourself. The value is in the request\
    \ itself, and the response is actually not important; but to make initiating the\
    \ request easier, it's normally convenient to request a tiny image (such as `beacon.gif`),\
    \ including several parameters, and be logged on your web server.\n\nLet's try\
    \ this out ourselves. I will show you how to track RUM data on my personal website.\n\
    \n1.  First, place the boomerang script into your page. Ideally, place it at the\
    \ bottom, to avoid obstructing any essential page assets.\n\n    The script below\
    \ shows you how I use the beacon to send performance data. I created a transparent\
    \ 1x1px GIF, uploaded it to the web server, and set the `beacon_url` path to its\
    \ location:\n\n    ```\n    <script src=\"http://bbinto.me/lean-websites/chapter-4/rum/\n\
    \    ↵boomerang/boomerang.custom.min.js\" type=\"text/javascript\">\n    ↵</script>\n\
    \    <script type=\"text/javascript\">\n         BOOMR.init({\n             beacon_url:\
    \ \"http://bbinto.me/lean-websites/chapter-4/rum\n    ↵/boomerang/images/beacon.gif\"\
    \n             });\n    </script>\n    ```\n\n2.  Once the script has been included,\
    \ reload the page. In the browser's console, you'll be able to see what kind of\
    \ data boomerang has started to collect:\n\n    ![Checking out boomerang data\
    \ in the console](OEBPS/figures/4-rum-beacon.png)\n\n    Figure 4.7. Checking\
    \ out boomerang data in the console\n\n3.  A simple log parser can now scan through\
    \ the logs to extract the data. Check out the log file entry below as an example.\
    \ `beacon.gif` lists the same boomerang data that we saw in the console above:\n\
    \n    ```\n    99.231.246.80 - - [02/Dec/2014:05:47:38 -0700]\n    \"GET /lean-websites/chapter-4/rum/boomerang/images/beacon.gif?\n\
    \    rt.start=navigation&\n    rt.tstart=1417524445852&\n    rt.bstart=1417524447232&\n\
    \    rt.end=1417524447752&\n    t_resp=816&\n    t_page=1084&\n    t_done=1900&\n\
    \    r=http%3A%2F%2Fwww.bbinto.me%2F&\n    r2=&\n    t_other=boomerang%7C1%2Cboomr_fb%7C1380%2Ct_domloaded%7C1423&\n\
    \    bw=764973&\n    bw_err=41596.59&\n    lat=86&\n    lat_err=0.92&\n    bw_time=1417524459&\n\
    \    v=0.9.1361953770&\n    u=http%3A%2F%2Fwww.bbinto.me%2F HTTP/1.1\" 200 35\n\
    \    ↵ \"http://www.bbinto.me/\" \"Mozilla/5.0 (Macintosh; Intel Mac OS\n    ↵\
    \ X 10_10_1)\n    ```\n\n    From the data above, we can draw the following conclusions\
    \ about my visit to bbinto.me:\n\n    *   `t_done`: my perceived load time was\
    \ 1084ms\n    *   `bw`: my measured bandwidth was 764973 bytes per second (or\
    \ 747KB/s)\n    *   `lat`: my measured latency was 86ms (or 0.08 seconds).\n\n\
    \    For more information about the remaining parameters, please check out the\
    \ [boomerang page](http://yahoo.github.io/boomerang/doc/howto-0.html).\n\n4. \
    \ Now that I have extracted the data from the log, I can export the result to\
    \ a spreadsheet or into a database to query it, and use it to create charts for\
    \ better illustration. I decided to save it as a CSV spreadsheet. The screenshot\
    \ below highlights the same set of data I triggered in step 2.\n\n5.  I kept the\
    \ beacon in place on the site for two days to gather real user data, and by the\
    \ end I had 300 data points—real visits from real users:\n\n    ![A snippet of\
    \ RUM data collected from beacon, via log files, exported as CSV and stored in\
    \ a spreadsheet](OEBPS/figures/4-rum-cbc-excel.png)\n\n    Figure 4.8. A snippet\
    \ of RUM data collected from beacon, via log files, exported as CSV and stored\
    \ in a spreadsheet\n\nThe screenshot shown in [Figure 4.8](#ch04.html_ch4-rum-cbc-excel\
    \ \"Figure 4.8. A snippet of RUM data collected from beacon, via log files, exported\
    \ as CSV and stored in a spreadsheet\") displays what I recorded: the exact time\
    \ the user accessed the page (`Date`), bandwidth (`bw`), latency (`lat`), page\
    \ load time (`t_done`), and the corresponding user agent (`UA`). Additionally,\
    \ with the help of simple spreadsheet functions, I determined the distribution\
    \ of RUM load times, user latency and bandwidth.\n\nThe following three metrics\
    \ are useful in understanding your users’ experiences when visiting your site:\n\
    \n*   **Page load time**: the following graph describes the distribution of load\
    \ times in milliseconds for bbinto.me, retrieved from all `t_done` data points.\
    \ You can see that most users experience a page load time between 3 and 5 seconds.\
    \ The page loads in under 5 seconds for half of the visitors. 95% of visitors\
    \ experienced a load time of below 19.1 seconds:\n\n    ![Page load time distribution](OEBPS/figures/4-rum-cbc.png)\n\
    \n    Figure 4.9. Page load time distribution\n"
