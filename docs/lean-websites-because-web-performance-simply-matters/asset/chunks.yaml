  trans: "\n\nGPU 代表 `graphics processing unit`（图形处理单元）。它的主要功能是卸载原本由主 `CPU` 处理和计算的图形任务。`GPU`\
    \ 的架构专门为图形处理而设计——因此，它可以比 `CPU` 更高效地完成这项任务。\n\n我们在 `CPU/GPU` 上承载的任务越重——尤其是在智能手机等较小设备上——它们就工作得越辛苦，导致处理速度变慢，性能下降。习惯了桌面级和笔记本电脑上巨大可用内存的开发者应该记住，移动设备的内存容量要少得多。可用内存越少，性能优化就越具挑战性。正如第\
    \ 6 章所示，某些 JavaScript 操作是以性能为代价的，对 DOM 的重大操作都可能导致移动设备的内存问题。\n\n## 较慢的 JavaScript\
    \ 执行\n\n在移动设备上，一切感觉都变慢了。它们的 JavaScript 引擎比桌面版本慢得多。DOM 操作和其他昂贵的操作让 `GPU` 和 `CPU`\
    \ 一直忙碌。例如，Flickr 在其网站移动版实现第一个版本的幻灯片时遇到了一个[重大问题](http://code.flickr.net/2011/07/20/lessons-learned-from-the-flickr-touch-lightbox/)。iOS\
    \ 浏览器在显示超过 20 张图片时会不断崩溃。崩溃的原因？Flickr 编写了太多的 DOM 操作，导致 `CPU` 和 `GPU` 无法跟上速度。\n\n\
    ## 功耗与流量套餐\n\n在开发精简网站时，除了意识到移动设备的性能限制外，考虑移动设备的电量和流量消耗也很重要。\n\n### 电池消耗\n\n移动设备由电池供电，设备工作越多，电量消耗得越快。精简网站的目标应该是尽量减少移动设备的电池电量。\n\
    \n以下是来自斯坦福大学和位于洛斯阿尔托斯的德国电信研究与开发部门的学术人员进行的一些优秀[研究](http://www2012.wwwconference.org/proceedings/proceedings/p41.pdf)\
    \ 的结果。他们的研究根据浏览网页评估了移动设备的能量水平。\n\n- **图像：** 渲染图像占总渲染能量的很大比例。将图像压缩为 JPEG 已显示出能量消耗方面的改进。\n\
    - **JavaScript：** JavaScript 是网页中耗能最高的组件之一。尽可能移除大量未使用的框架或操作。\n- **CSS：** CSS 的渲染成本取决于被样化的项目数量。合并\
    \ CSS 文件也有助于减少能量消耗。\n\n这些听起来都有些熟悉，不是吗？我在讨论通用网站优化时已经提到过这些内容了。因此，通过遵循这些规则，我们可以确保我们的网站在移动端也是节能的。\n\
    \n### 流量消耗\n\n流量套餐在几个国家仍然很[昂贵](http://www.wallcom.ca/pdfs/price-comp-report_2013update.pdf)，特别是在旅行时。网站资源越精简，对用户的强制流量消耗就越少。\n\
    \n有一个关于优化不当的网站对移动数据使用影响的醒目案例。[Mobiforge](http://mobiforge.com/) 进行了一项关于蜂窝数据费用的实验。他们取了一个欧洲移动运营商的\
    \ SIM 卡，在美国漫游时在 Android 手机上使用。仅加载一个大小约为 10MB 的[网页](http://www.briefcakes.com/gallery.html)[花费了约\
    \ 369 欧元，约合 480 美元](http://mobiforge.com/research-analysis/performance-money-part-1-end-users-wallet)。\n\
    \n## 设备管理\n\n各种组织创建了关于当前可用设备的信息库。其目标是帮助你根据各种因素（如功能、屏幕尺寸或操作系统）检测设备。大多数提供此类`设备描述库`(DDR)\
    \ 的组织会对数据访问收费，并提供访问限制的免费版本。商业版本通常带有额外功能，例如针对多个网站的检测、本地解决方案以及每月无限次检测。\n\n让我们来看看提供的几种\
    \ DDR 产品。\n\n### WURFL\n\n[WURFL](http://en.wikipedia.org/wiki/WURFL) 代表 Wireless\
    \ Universal Resource File（无线通用资源文件）。这是一个巨大的 XML 文件，列出了所有可用设备的详细信息。该库曾是免费开源的，直到\
    \ 2011 年才商业化。\n\n根据 HTTP user agent 字符串，你可以使用 WURFL 匹配并分析访问你网站的设备。它不仅列出了所有设备和规格，还提供了分组和分类——让你更容易根据功能对某些设备进行“分桶管理”。\n\
    \n以下是 iPhone 4 条目的 WURFL `device` 节点的示例片段：\n\n```xml\n<device id=\"apple_generic\"\
    \ user_agent=\"Mozilla/5.0 (iPhone; U; CPU\n iPhone OS 4_0 like Mac OS X; xx-xx)\
    \ AppleWebKit/532.9 (KHTML,\nlike Gecko) Version/4.0.5 Mobile/8A293 Safari/6531.22.7\"\
    \n fall_back=\"generic_xhtml\">\n    <group id=\"product_info\">\n      <capability\
    \ name=\"mobile_browser\" value=\"Safari\"/>\n      <capability name=\"device_os\"\
    \ value=\"iOS\"/>\n      <capability name=\"has_qwerty_keyboard\" value=\"true\"\
    />\n      <capability name=\"pointing_method\" value=\"touchscreen\"/>\n     \
    \ <capability name=\"is_tablet\" value=\"false\"/>\n      <capability name=\"\
    model_name\" value=\"iPhone\"/>\n      <capability name=\"device_os_version\"\
    \ value=\"4.0\"/>\n      <capability name=\"is_wireless_device\" value=\"true\"\
    />\n    </group>\n    <!-- ... -->\n    <group id=\"display\">\n      <capability\
    \ name=\"physical_screen_height\" value=\"74\"/>\n      <capability name=\"resolution_width\"\
    \ value=\"320\"/>\n      <capability name=\"resolution_height\" value=\"480\"\
    />\n    </group>\n  <!-- ... -->\n</device>\n```\n\n根据上述标准，你可以通过验证 `model_name`\
    \ 是否匹配用户输入的 user agent 字符串，来针对所有 iPhone 用户。\n\n### 提示：WURFL Explorer\n\n尝试使用 [WURFL\
    \ explorer](http://www.tera-wurfl.com/explore/?action=wurfl_id&id=apple_iphone_ver2)\
    \ 来检查 WURFL DDR 中许多设备的描述。\n\n随着更多设备的发布，WURFL DDR 文件在过去十年中增长得巨大。它目前是一个 20MB 的 XML\
    \ 文件。每次需要使用时都解析整个文件并不是非常高效的。我建议根据自己的需求过滤并缩小文件。\n\n如果你决定使用 WURFL 或其商业版本 [ScientiaMobile](http://www.scientiamobile.com/)，你可以受益于多种[服务端](http://www.smashingmagazine.com/2014/07/01/server-side-device-detection-with-javascript/)和[客户端](http://web.wurfl.io)实现方案。但如果你出于任何原因不想使用\
    \ WURFL，还有其他可用的存储库。\n\n### 其他 DDR\n\n虽然 WURFL 是最早的 DDR 产品之一，但还有其他解决方案可以提供关于用户设备的详细信息。这里没有真正的胜出者。选择哪种基本上取决于你对编程语言的偏好以及钱包。\n\
    \n#### DeviceAtlas（免费版和商业版）\n\n[DeviceAtlas](https://deviceatlas.com/) 与 WURFL\
    \ 遵循相同的理念：它让你访问一个巨大的移动设备数据库，输出你关于这些设备的任何类型的信息。\n\nDeviceAtlas 提供[多种编程语言](https://deviceatlas.com/resources)\
    \ 版本，例如 Java、PHP、NET、Python、Ruby 和 JavaScript，并且也可以通过 [REST API](https://deviceatlas.com/resources/rest-api)\
    \ 直接访问。\n\n"
- fmt: "\nThere's a trial version available that comes with an API key, or you can\
    \ fall back to the free, cloud-based version of the product that comes with a\
    \ device detection client only, offers a limit on detections per month, and is\
    \ only available for one website. The enterprise version (local version available)\
    \ offers unrestricted access to carrier identification and a [device properties\
    \ list](https://deviceatlas.com/resources/available-properties) that is otherwise\
    \ restricted for the cloud version.\n\nThe DeviceAtlas [Data Explorer](https://deviceatlas.com/device-data/explorer)\
    \ gives you a good overview of what kind of data and device properties you can\
    \ receive from this service.\n\nThe following code snippet shows part of the output\
    \ after passing in the user agent string for an iPhone 4 to inquire about its\
    \ device properties:\n\n```\n$ php device.php\n$ -------------------------------------------------------------\n\
    \    All Properties:\n    3gp.aac.lc (boolean) : 1\n    displayPpi (integer) :165\n\
    \    js.supportBasicJavaScript (boolean) :1\n    js.geoLocation (boolean) :  1\n\
    \    flashCapable (boolean) :\n    js.json (boolean) : 1\n    isTablet (boolean)\
    \ :\n    isMobilePhone (boolean) :   1\n    browserVersion (string) :   5.0.2\n\
    \    osVersion (string) :    4_2_1\n    browserName (string) :  Safari\n    devicePixelRatio\
    \ (string) : 1\n    js.webSqlDatabase (boolean) :   1\n    stream.httpLiveStreaming\
    \ (boolean) :    1\n    marketingName (string) :    iPhone\n    ...\n```\n\n###\
    \ DeviceMap (Free)\n[DeviceMap](http://incubator.apache.org/devicemap/) is an\
    \ open-source project by Apache. It aims to create a data repository that includes\
    \ information on mobile devices. Like WURFL, the data is also stored in XML, but\
    \ it's split up into several different files, based on device characteristics,\
    \ browser, and vendor data.\n\nDeviceMap supports Java, C#, VB.Net, and JavaScript.\
    \ A web [demo](http://devicemap-vm.apache.org/browsermap/index.html) is available,\
    \ giving you a quick peak into what kind of information you can gather from the\
    \ DDR:\n\n```\n<!-- DeviceDataSource.xml Snippet -->\n<device id=\"iPhone\" parentId=\"\
    genericApple\">\n    <property name=\"model\" value=\"iPhone\"/>\n    <property\
    \ name=\"displayWidth\" value=\"320\"/>\n    <property name=\"displayHeight\"\
    \ value=\"480\"/>\n    <property name=\"device_os_version\" value=\"1.0\"/>\n\
    \    <property name=\"mobile_browser_version\" value=\"5\"/>\n    <property name=\"\
    from\" value=\"open_db_modified\"/>\n</device>\n```\n\n### Create Your Own DDR\n\
    If you don't want somebody else to provide you with device information, you can\
    \ just create your own list, stored in your own preferred format, such as XML,\
    \ JSON and so on.\n\nFor example, on one project I was a part of, we categorized\
    \ devices into various “buckets”—“dumb”, “smart” and “touch”. Devices with simple\
    \ WAP browsers were classed as “dumb”, more advanced devices with HTML browsers\
    \ were “smart”, and devices with advanced browsers and touch gestures were “touch”.\
    \ We used these buckets to differentiate mobile devices by identifying them based\
    \ on their user agent string (see the next section). Depending on which of those\
    \ buckets the user's device fell into, we not only served different designs, but\
    \ also different image sizes.\n\nIf your mobile strategy and buckets are easy\
    \ to manage, and don't require a lot of detailed drilling, you may well be satisfied\
    \ with using CSS media queries, and perhaps a bit of JavaScript.\n\nHowever, while\
    \ this all sounds like a great plan—as it's simple to set up and inexpensive compared\
    \ to buying access to a commercial DDR—you need to understand the challenges that\
    \ come with this approach. A major issue is that you'll need to maintain the list\
    \ of available devices constantly, adding another burden to your task list that\
    \ can very easily be overlooked. A possible solution could be to create a `cron\
    \ job` to fetch new devices and user agent strings from either one of the commercial\
    \ or open-source DDRs to keep your device repository up to date.\n\n## Device\
    \ Detection\nIn order to utilize the information gleaned from the device repositories,\
    \ we'll need to determine exactly what devices are hitting our website. This can\
    \ be done by using several device detection methods.\n\n### Take a Quick Inventory\n\
    Before you start using device detection on your website, my advice is to do a\
    \ quick inventory of your current users and their devices. You can use a tool\
    \ like Google Analytics to get this data.\n\nFor example, using Analytics on my\
    \ personal website (bbinto.me) reveals that, during October, I had 23 different\
    \ devices accessing my site, with 72 different screen resolutions.\n\nLet's be\
    \ realistic: you can't target all devices, screen resolutions, browsers and connection\
    \ speeds. Yet all of those factors still play an important role in how your user\
    \ will experience the performance, and quality, of your site. Instead of optimizing\
    \ for every entry that pops up in Analytics, a good start is to pick the top five\
    \ to ten entries in the lists you've gathered and focus on these.\n\nNow, let's\
    \ move on to how you can detect your users' devices.\n\n### The Identifier: HTTP\
    \ Header\nHTTP headers—which are sent when the browser requests content—are the\
    \ basis for device detection. The most interesting and useful header is the `user-agent`\
    \ string. Using the user agent string to detect devices is called `user agent\
    \ sniffing`. You can use the default Firefox developer tools to show and modify\
    \ the user agent string, as shown in [Figure 10.1](#ch10.html_ch10-ff-ua-string\
    \ \"Figure 10.1. Firefox developer tools' Network Panel view with HTTP headers):\n\
    \n![Firefox developer tools' Network Panel view with HTTP headers](OEBPS/figures/10-http-header-firefox.png)\n\
    \nFigure 10.1. *Firefox developer tools' Network Panel view with HTTP headers*\n\
    \nWith a user agent string, you're able to retrieve the version of the browser,\
    \ the operating system, and the device.\n\nHere is a sample of some commonly used\
    \ devices and their user agent strings:\n\n*   Safari on iPhone 6:\n    ```\n\
    \    Mozilla/5.0 (iPhone; CPU iPhone OS 6_1_3 like Mac OS X) AppleWeb\n    Kit/536.26\
    \ (KHTML, like Gecko) Version/6.0 Mobile/10B329 Safari\n    /8536.25\n    ```\n\
    \n*   Safari on iPad:\n    ```\n    Mozilla/5.0 (iPad; CPU OS 7_0 like Mac OS\
    \ X) AppleWebKit/537.51.1\n    (KHTML, like Gecko) CriOS/30.0.1599.12 Mobile/11A465\
    \ Safari\n    8536.25 (3B92C18B-D9DE-4CB7-A02A-22FD2AF17C8F)\n    ```\n\n*   Chrome\
    \ on a Galaxy Nexus:\n    ```\n    Mozilla/5.0 (Linux; Android 4.1.1; Galaxy Nexus\
    \ Build/JRO03O)\n    AppleWebKit/535.19 (KHTML, like Gecko) Chrome/18.0.1025.166\
    \ Mobile Safari/535.19\n    ```\n\nThe basic idea behind device detection is to\
    \ compare the incoming user agent string of your visitor's browser with a list\
    \ you maintain. Using your preferred DDR—whether that's WURFL, DeviceAtlas, DeviceMap\
    \ or your own filters—you can then start customizing the user experience based\
    \ on the device's characteristics. The biggest advantage of device detection is\
    \ that content becomes context-sensitive. We can serve different content to users\
    \ depending on their device's functionality and capabilities.\n\nThere are various\
    \ options for executing device detection:\n\n*   **Server-side**: the detection\
    \ happens on the server, by deciding what to serve to the client before it lands\
    \ in the browser.\n*   **CDN**: the detection is done on the CDN level, without\
    \ having to go back to the origin to receive content.\n*   *Client-side*: the\
    \ detection is executed once the browser receives the content. Unnecessary content\
    \ might have been served by that time.\n*   *Client Hints*: this approach is not\
    \ fully supported yet, but it is the most promising and efficient way of serving\
    \ the right content, and functionality, to different devices. It's a hybrid of\
    \ client- and server-side solutions.\n"
