    that their search ranking algorithm takes page speed seriously, organising search
    results on that basis. This goes back to a [blog entry](http://googlewebmastercentral.blogspot.ca/2010/04/using-site-speed-in-web-search-ranking.html)
    Google posted in 2010, stating that “users place a lot of value in speed—that''s
    why we''ve decided to take site speed into account in our search rankings.”


    This is especially important when you have to deal with a lot of competitor products
    and websites. Being faster than your competitors definitely puts you ahead of
    the curve when somebody is googling for a service that you offer.


    The Alexa rank measures the popularity of a website against all the other websites
    on the Web. Alexa''s metrics are based on page views and visitors to those sites.


    Some [research](http://bigqueri.es/t/are-popular-websites-faster/162) has recently
    been done on top-ranked pages and their speed, investigating whether or not the
    popularity of a website correlates with the **Start Render** time. Start Render
    time will be discussed in more detail in Chapters 3 and 4, but for now, let''s
    say it''s a metric that records the time when the browser starts to “paint” content
    on the screen. It''s a helpful measurement in the context of perceived performance.
    If users can “see” content, it makes them feel that the website is ready to be
    browsed. However, the Start Render time only indicates that the page content has
    *started* to load, so even if users can view content, they may not actually be
    able to interact with it yet.


    ## Cool Down


    In this introductory chapter, we''ve looked at the relationship between psychology
    and performance, the perception of speed, and what it means to be slow.


    We''ve looked at why it''s important to tackle web performance and how this can
    be approached. The following chapters will present tools and techniques for improving
    the perceived performance of your site, and ultimately for producing lean websites
    in the future.


    * * *


    [^([1])](#ch01.html_d5e249) Source: [Web Performance Today](http://www.webperformancetoday.com/2014/07/16/eight-tricks-improve-perceived-web-performance/)
    and [High Performance Browser Networking](http://chimera.labs.oreilly.com/books/1230000000545/ch10.html#SPEED_PERFORMANCE_HUMAN_PERCEPTION)


    # Chapter 2


    User Experience and Performance


    ## Warm Up


    In this chapter, you''ll learn about the relationship between user experience
    and performance. A website''s user experience depends on several different factors:
    design, accessibility, information architecture, usability, perception, and performance.


    For the purposes of this book, we''ll focus on information architecture, design,
    and performance, which should all go hand in hand. Performance should be incorporated
    at the early design stage, and not added as an afterthought. It starts with content
    organization and architecture. The goal of performant information architecture
    is to serve the content that your users are looking for, in the most convenient,
    easiest and fastest possible way. Improving performance is an important factor
    in winning satisfied customers.


    We''ll finish the chapter by discussing a practical technique for bridging the
    gap between information architecture, design and performance, which I call the
    “performance point system”. In order to demonstrate the idea behind the performance
    point system, I''ll apply it to a real-world website.


    ## UX Principles


    > “User experience encompasses all aspects of the end-user''s interaction with
    the company, its services, and its products.” ― Jakob Nielsen


    There are several principles you can follow to achieve good user experience. First
    of all, you want to make sure you know and understand the user''s goal. You want
    to ask yourself why users are coming to your website. For example, the user goals
    of a shopping site such as Amazon, and of a public transit website, are very different.
    Whereas Amazon tries to persuade users to hang out for hours on their site, while
    making suggestions on similar products, a public transit website has another goal—to
    provide users with the train schedule as soon as possible. Once the user has the
    schedule information, they will most likely exit the site.


    Now it''s up to the UX team to make sure the site supports the goal. It''s worth
    coming up with hypothetical user journeys to measure their completion time. In
    the case of Amazon, the UX team needs to figure out how to keep users on the site.
    Using cookies and logins to retrieve information from previous visits, Amazon
    will want to seduce users into staying on the page by pretending to know them—and,
    more importantly, their interests. In the example of the public transit page,
    you could measure how many steps it takes to find or download the schedule, or
    to display the fares.


    All UX user journeys should be created with performance in mind. The team should
    lay out the journey so the user will perceive each step of their journey as easily
    and fast as possible. That''s where information architecture and wireframing come
    in.


    ## Information Architecture and Wireframes


    A big part of user experience is **[information architecture](http://iainstitute.org/en/learn/resources/what_is_ia.php)**
    (IA), which defines the structural design of shared information environments.
    It''s the art and science of organizing and labeling websites, intranets, online
    communities and software to support usability and findability. IA can be illustrated
    in wireframes. A [**wireframe**](http://en.wikipedia.org/wiki/Website_wireframe)
    is a visual guide that represents the skeletal framework of a website. It''s basically
    your first step in outlining the website.


    The goal of this part of the process is to plan out the user''s journey and flow
    while they explore the website. It''s a very important piece in the process of
    developing websites, and it sets the tone of the user''s journey. Performance
    should be considered as part of this journey. Instead of fixing performance issues
    later, make performance part of the wireframing process. Making good performance
    choices during this step can save you a lot of time later.


    ## Design for Performance


    After wireframing, the next step is the design process.


    Web designers love to create beautiful and aesthetic web pages, and they have
    a perfectly good reason for doing so. Thoughtful design can make a site welcoming,
    enjoyable to use and memorable. Design is a big part of user experience, but what
    about performance? Every single image or extra font you put on the page will affect
    the performance of the site.


    Our generation is [impatient](http://www.bostonglobe.com/lifestyle/style/2013/02/01/the-growing-culture-impatience-where-instant-gratification-makes-crave-more-instant-gratification/q8tWDNGeJB2mm45fQxtTQP/story.html),
    and even if a website is aesthetically appealing, the user may leave if it''s
    slow.


    In her excellent book [*Designing for Performance*](http://shop.oreilly.com/product/0636920033578.do),
    Lara Hogan states, “It’s imperative that designers weigh the balance between aesthetics
    and performance to improve the end user experience.”


    Don''t get me wrong, I''m all for design and aesthetics, but they have to be reasonable,
    and more importantly context sensitive. There''s no need to show everybody the
    high-resolution version of an image if it''s not needed. Be context sensitive,
    considerate, and respectful. Don''t fill your page with unnecessary, heavy assets
    like images just because you don''t know what else to put there.


    ### Note: Speed as a Design Feature'
