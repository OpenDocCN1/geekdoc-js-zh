    the browser''s developer tools for the upcoming examples.


    ### Your Website''s Waterfall


    After you run WPT or load the network panel in your browser''s developer tools,
    you''ll have detailed access to the website''s waterfall. The next step is to
    spot any potential performance problems in the waterfall.


    Let''s pick an example waterfall and analyze its formation. Check out the waterfall
    in [Figure 4.1](#ch04.html_ch4-sample-waterfall "Figure 4.1. Waterfall view for
    sample page"): it''s an analysis of a sample page that I created and will be using
    throughout the next few chapters. It includes several individual JavaScript and
    CSS files, and some images of dogs:


    ![Waterfall view for sample page](OEBPS/figures/4-waterfall-bbinto.png)


    Figure 4.1. *Waterfall view for [sample page](http://bbinto.me/lean-websites/crp-grunt/without/magic.html)*


    Let''s note three things about the waterfall results pictured above:


    1.  Line items 3,5,9 show big bodies of CSS assets. Loading too many different
    and large CSS files after one another will delay the rendering of the page, and
    specifically slow down the Start Render time.


    2.  Several image assets are being requested in line items 16–19, and they all
    consist of relatively big bodies. It''s best to aim for a “thin” waterfall, as
    this correlates to small resources (or small file sizes). Each asset or request
    should load quickly, that means the body of the asset should be small.


    3.  Numerous small JavaScript files are being requested in line items 22, 24,
    26 and 27\. The fewer requests you make, the smaller and “steeper” the waterfall
    will be. A steep waterfall is a great indicator of a lean website, revealing proper
    sharing and parallelizing of resources.


    ### Tip: Resource Not Found


    ![An asset was not found](OEBPS/figures/4-not-found-waterfall.png)


    Figure 4.2. An asset was not found


    Avoid red lines in your WPT waterfall, as shown in [Figure 4.2](#ch04.html_ch4-not-found
    "Figure 4.2. An asset was not found"). These indicate that the resource could
    not be found. The cause for this could be that the asset is not referenced properly
    in the markup (the wrong path is given, for example), or the asset doesn''t exist
    on the server. Please note that the WPT waterfall marks “not found” assets as
    red, whereas many other waterfall visualizers—such as your browser''s Network
    tab—will not highlight them. Performance will suffer from a “not found” asset
    in the waterfall, because the browser is wasting precious time trying to locate
    the file while still having to parse the rest of the page.


    Throughout the next few chapters, we''ll discuss how to optimize and fix the issues
    we''ve just discovered, whilst monitoring the improvement of the page''s performance.


    ## Performance Monitoring: Set up Your Performance Dashboard


    It''s important that you frequently monitor your website''s performance, as it
    can easily be degraded by such things as third party scripts or bloated images.
    A **performance monitoring dashboard** is handy for keeping track of your site''s
    performance, and will provide you with peace of mind as well.


    Here are tools and processes that I propose you could consider:


    *   Set up a private instance of HTTP Archive to track trends, over time, for
    a defined list of domains. This will help you measure current issues and also
    anticipate improvements in the future. By auditing trends, you can specifically
    tackle newly introduced performance issues that you wouldn''t have noticed otherwise.


    *   Calibrate your synthetic measurements with some real user results, by creating
    a RUM solution to capture and understand your real users'' settings. This can
    be very helpful in finding out about specific latency bottlenecks, for example,
    or bandwidth issues of your users.


    *   Create alerts to notify you if your website goes above a certain threshold
    (such as page load time, or server response time). You can rely on both free and
    commercial products to help you with that.


    ### Create Your Private HTTP Archive


    The public HTTP Archive collects web trends of the [Top Alexa websites](http://httparchive.org/about.php#listofurls),
    and if you''re lucky, your website is one of them and is being captured. (If not,
    you can [add](http://httparchive.org/addsite.php) your website to the list.)


    If your site isn''t listed, however, or isn''t (yet) accessible via the Internet,
    then it won''t be possible to monitor and track trends via the public HTTP Archive.


    Thankfully, as noted earlier, HTTP Archive is an open-source project that can
    be cloned for your own use. For example, if your company has many subdomains,
    internal websites, or different micro sites that you want to track, installing
    your own HTTP Archive instance will be very beneficial. You could even add your
    competitors'' websites to compare their pages with yours. All of the data will
    be stored in a local database, organized into several data tables of requests,
    pages, the list of URLs to check, and more. Hence, you can run ad hoc SQL queries
    against the data to gather all kinds of useful information.


    In order to set up HTTP Archive, you need a web server with MySQL and PHP. You''ll
    also need to request an API key so that the HTTP Archive instance can execute
    runs on the public WPT. (If you choose to run your own private instance of WebPagetest
    instead—in order to skip waiting times when being in a queue to run your test
    from the public instance—you don''t have to use an API key.) If you need step-by-step
    instructions on how to setup your own HTTP Archive data set and database, please
    check out my blog post “[Set up your own HTTP Archive to track and query your
    site trends](http://www.bbinto.me/performance/setup-your-own-http-archive-to-track-and-query-your-site-trends/)”.


    Once you have your private HTTP Archive database set up and filled with data,
    you can then run queries based on it. In order to provide you with some “real”
    results, I decided to use the HTTP Archive instance from one of my previous projects.'
