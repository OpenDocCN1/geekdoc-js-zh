- fmt: "\nFigure 5.5. [WPT video comparison](http://www.webpagetest.org/video/compare.php?tests=141222_R6_JNC%2C141222_4C_KDV&thumbSize=100&ival=500&end=visual#)\
    \ of our sample page, showing before and after optimization\n\n| Test | Speed\
    \ Index | Start Render | Visually Complete |\n| --- | --- | --- | --- |\n| [Without\
    \ optimized CRP](http://www.webpagetest.org/result/141222_R6_JNC/2/details/) |\
    \ 3400 | 3.4s | 3.4s |\n| [With optimized CRP](http://www.webpagetest.org/result/41222_4C_KDV/1/details/)\
    \ | 1608 | 0.7s | 2.3s |\n\nSo to summarize what we've done for the page above:\n\
    \n*   We focused on the order of rendering assets by loading critical assets as\
    \ early as possible\n*   We kept scripts and styles in the head to a minimum,\
    \ allowing only critical CSS in the head\n*   We kept the HTML as clean as possible\n\
    *   We moved non-critical scripts to the bottom of the page\n\n## Reducing HTTP\
    \ Requests\n\n> The fastest HTTP request is the one not made. (Steve Souders,\
    \ Chief Performance Officer at Fastly)\n\nWhile you don't have a lot of influence\
    \ over the user's network connection or the server's processing time, you can\
    \ optimize the things you do have control over—the size and number of HTTP requests\
    \ that are being sent.\n\nThe idea is simple: remove requests that you don't need\
    \ to make, and think before you include another HTTP request, especially if it's\
    \ coming from a different domain with an additional DNS lookup. For the requests\
    \ you *do* need to make, you should consider the following best practices.\n\n\
    ### (Smart) Concatenation\n\nA useful performance technique is to combine separate\
    \ files into one, a process called `concatenation`. With concatenation, you can\
    \ reduce the number of HTTP requests and hence serve content faster.\n\nIdeal\
    \ candidates for concatenation are JavaScript and CSS files, as they make up the\
    \ bulk of the non-binary assets for a web page, besides the actual HTML itself.\
    \ Although concatenation can reduce the number of HTTP requests required, it doesn't\
    \ mean that concatenating absolutely everything into one big file is always the\
    \ best way to go. What you need is a smart concatenation strategy, as follows.\n\
    \n#### CSS\n\nFirst, create an inventory of all the CSS files used on your website.\
    \ Go through them and analyze which files would benefit from concatenation.\n\n\
    For example, assume you have a huge website with many style sheets covering the\
    \ styling of different pages. Concatenating numerous CSS files into one big consolidated\
    \ CSS file might reduce the number of HTTP requests, but there are several edge\
    \ cases where this could actually result in overhead and redundancy:\n\n*   If\
    \ one of these concatenated CSS files changes frequently, the browser would need\
    \ to re-download the consolidated big CSS file every time it changes, which is\
    \ not optimal. One solution to this issue is to figure out which CSS files change\
    \ infrequently versus the ones that changes frequently, and separate them accordingly.\n\
    *   Figure out which styles are required on each page versus less frequently used\
    \ styles. Every website should follow a style guide defining which colors and\
    \ fonts to use on the site. For consistency, it makes sense to load these styles\
    \ on each and every page of your website. However, there may also be styles that\
    \ are not used on every single page. For example, it doesn't make sense to include\
    \ the styling of a shopping cart page in the style sheet that is loaded on each\
    \ page. The more selectors you put in your combined CSS file, the more complex\
    \ and bigger it will be, which inevitably results in less performant code. Detach\
    \ the uncommonly used styles from the commonly used styles. Before concatenating\
    \ CSS files, ask yourself how often and under what circumstances those files are\
    \ being used on the site.\n\n#### JavaScript\n\nThe same considerations about\
    \ concatenation apply to multiple JavaScript files.\n\n*   Before merging one\
    \ JavaScript file with another, think about the likelihood of the contents of\
    \ both files changing. Are they changed equally as often? Evaluate if the content\
    \ of these files should be fetched and cached separately by the browser, or combined\
    \ into one single file.\n*   There might be functionality or widgets that are\
    \ only used on certain pages of the site (for example, a photo gallery widget\
    \ only showing up on one specific page of your website). There is no need to include\
    \ them in the consolidated and concatenated master JavaScript file that is loaded\
    \ on every page. The overhead of downloading unused JavaScript might be bigger\
    \ than keeping files separated, especially if you know that not all visitors will\
    \ need the gallery widget.\n\nMake a conscious decision under what circumstances\
    \ you should concatenate files. Ask yourself if the functionality executed in\
    \ the JavaScript file is needed for all pages, or only for specific sections of\
    \ the site.\n\nOnce you've figured out which files should be concatenated, you\
    \ can then benefit from a performance gain. The following example illustrates\
    \ the performance improvement that can be achieved when properly concatenating\
    \ JavaScript files. The sample page relies on five separate JavaScript files—which\
    \ should, therefore, be concatenated.\n\n*   `non-concat.html`: this file includes\
    \ five JavaScript files:\n    ![WPT Waterfall of non-concat.html](OEBPS/figures/5-non-concat-ff.png)\n\
    \    Figure 5.6. WPT Waterfall of [non-concat.html](http://www.bbinto.me/lean-websites/chapter-5/minified/non-concat.html)\n\
    *   `concat.html`: this file includes the same JavaScript files concatenated into\
    \ one JavaScript file, named `concat.js`:\n    ![WPT waterfall of concat.html](OEBPS/figures/5-concat-ff.png)\n\
    \    Figure 5.7. WPT waterfall of [concat.html](http://www.bbinto.me/lean-websites/chapter-5/minified/concat.html)\n\
    \nI ran both pages through WPT, focusing on Start Render and Fully Loaded values.\n\
    \n| URL | Start Render | Fully Loaded |\n| --- | --- | --- |\n| [non-concat.html](http://www.webpagetest.org/result/150117_KK_N3V/5/details/)\
    \ | 0.547s | 0.615s |\n| [concat.html](http://www.webpagetest.org/result/150117_NG_N3T/4/details/)\
    \ | 0.473s | 0.554s |\n\nAs you can see, there are some performance gains achieved\
    \ by using concatenation.\n\n#### Conditional Loading\n\nIf you encounter styles\
    \ and functionality that are not needed on every page, or for every browser, or\
    \ for every device, it's not recommended that their files be concatenated. Rather,\
    \ use conditional loading to load assets based on certain conditions.\n\n**Conditional\
    \ resource loaders**, such as [yepnope](http://yepnope.com/) and [RequireJS](http://www.requirejs.org/),\
    \ can help you load only the assets needed for your specific case. In addition,\
    \ feature-detection libraries like [Modernizr](http://modernizr.com/) can identify\
    \ what capabilities and features the user's browser has, and therefore load or\
    \ remove specific files. [Detectizr](https://github.com/barisaydinoglu/Detectizr),\
    \ a library that sits on top of Modernizr, can trigger conditional loading based\
    \ on the device.\n\n#### Tools\n\nThough you can concatenate files by hand, it's\
    \ preferable to use tools to automate this process. A quick solution is to use\
    \ the [`cat`](http://en.wikipedia.org/wiki/Cat_%28Unix%29) Unix command. For example,\
    \ you can use the following command to concatenate all CSS files into `merge.css`,\
    \ or all JavaScript files into `merge.js`:\n\n```\n$ cd css/\n$ cat *.css > merge.css\n\
    \n// or JavaScript\n$ cd javascript/\n$ cat *.js > merge.js\n```\n\nThere are\
    \ also some more sophisticated command line tools available that combine concatenation\
    \ and minification. [Google's Closure Compiler](https://developers.google.com/closure/compiler/)\
    \ supports concatenation (only for JavaScript files), and task managers like [Grunt](https://github.com/gruntjs/grunt-contrib-concat)\
    \ and [Gulp](http://gulpjs.com/) offer concatenation tasks and plugins as well.\
    \ We will use Grunt and Gulp in Chapter 8 to show how to automate performance\
    \ tasks.\n"
