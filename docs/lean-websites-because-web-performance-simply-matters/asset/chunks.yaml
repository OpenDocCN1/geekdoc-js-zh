  trans: "\n\n![](img/cover.jpeg)\n\n# 目录\n\n- 前言\n- 1. 性能至上\n- 2. 用户体验与性能\n- 3. 性能的测量与监控\n\
    - 4. 性能训练营设置\n- 5. 精通高效 HTTP 请求\n- 6. 制作精简 Web 资源：第一部分\n- 7. 制作精简 Web 资源：第二部分\n\
    - 8. 自动化优化任务\n- 9. 网络与服务器性能改进\n- 10. 多设备 Web 世界\n- 11. 移动端优化技术\n- 12. 性能备查手册\n\
    \n![SitePoint®](img/sitepoint-logo-2012.png)\n\n# 精简型网站 (LEAN WEBSITES)\n### 作者：BARBARA\
    \ BERMES\n\n# 精简型网站\n\n作者：Barbara Bermes\n\nCopyright © 2015 SitePoint Pty. Ltd.\n\
    \n产品经理：Simon Mackie\n技术编辑：Andrew Betts\n英文编辑：Ralph Mason\n封面设计：Alex Walker\n\n\
    ## 权利声明\n\n版权所有。未经出版者事先书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书任何部分，评论性文章或评论中的简短引文除外。\n\
    \n## 免责声明\n\n作者和出版者已尽力确保书中信息的准确性。然而，书中包含的信息按现状销售，不提供任何明示或暗示的保证。作者、SitePoint Pty.\
    \ Ltd. 以及其分销商对于因书中指令或此处描述的软件或硬件引起的任何直接或间接损害均不承担责任。\n\n## 商标说明\n\n本书并未对每个商标的出现进行标注，仅以编辑方式使用这些名称，旨在维护商标所有者的利益，无侵权意图。\n\
    \n![SitePoint®](img/sitepoint-logo-2012.png)\n\n由 SitePoint Pty. Ltd. 出版\n48 Cambridge\
    \ Street Collingwood VIC 3066\n网址：www.sitepoint.com\n邮箱：business@sitepoint.com\n\
    \n## 关于 Barbara\n\n多年来，Barbara 一直是性能倡导者和 Web 技术专家，参与过多种 Web 项目，最近任职加拿大广播公司。作为一名国际讲师、jsm\
    \ 贡献者以及多伦多 Web 性能聚会的组织者，Barbara 与社区分享她对 Web 性能的热情和知识。\n\n## 关于 SitePoint\n\nSitePoint\
    \ 专门为 Web 专业人士提供有趣、实用且易懂的内容。访问 `http://www.sitepoint.com/` 可以获取我们的博客、书籍、时通讯和社区论坛。你将在那里找到关于\
    \ JavaScript、PHP、Ruby、移动开发等等大量信息。对于那些认为自己做不到的人——你绝对可以！\n\n# 前言\n\n请信任并遵循我们的观点：我们已经变成了一个非常急躁的社会——一种“优者劣汰”的文化。等待不再是一个选项。Google、Bing\
    \ 和 Yahoo 等搜索引擎正在竞争提供最快、最好的搜索结果。Amazon、Target 和 Walmart 等电子商务网站正在竞争创新的交付方法，如无人机配送（`http://en.wikipedia.org/wiki/Delivery_drone`）。我们的日常生活日益趋向于在线生活，速度缓慢是不可接受的。我们希望能够在在线上完成更多事情，并且动作要快——从点餐到购物，甚至是寻找人际关系。如果一个网站感觉很慢，我们可能会向网站所有者抱怨，而不是再次访问该网站，而是寻找替代方案。\n\
    \n尽管互联网速度已经提高，但网站逐年变得更大更复杂，因此它们不可避免地需要更多技术来满足当今急躁的用户。但为什么网站的整体规模在增加呢？我们是否变得懒惰了，认为现有的高速基础设施理所当然，不再关心精简和高效的代码了？\n\
    \n技术允许我们“做得更大”，但在性能方面可能并不能“做得更好”。服务器和互联网连接变得越来越复杂，结果是我们觉得有必要保留它们。然而，现在不是变懒的时候。现在是利用现有的各种工具让网站运行更快，并学习如何提高用户体验和满意度。因为没有人喜欢等待。\n\
    \n图 1 (`pr01.html_ch0-filesize`) 和图 2 (`pr01.html_ch0-httquests`) 源自 HTTP Archive，显示了网站的大小和\
    \ HTTP 请求数量，以及这两项指标在过去几年中的增长情况：\n\n![2011-2014 年平均网站传输大小的增加](img/0-http-filesize-increase.png)\n\
    图 1。2011-2014 年平均网站传输大小的增加\n\n![2011-2014 年每个网站平均 HTTP 请求数量的增加](img/0-http-requests-increase.png)\n\
    图 2。2011-2014 年每个网站平均 HTTP 请求数量的增加\n\n从 2010 年到 2014 年，网站的平均总传输大小（基本上是网站的整体重量）增加了\
    \ 150%，而请求总数（加载网站所需的所有资源）仅增长了约 16%。我们可以清楚地看到向复杂 Web 应用程序发展的趋势。我们的代码需要具备高性能以应对复杂应用程序的兴起。本书将向你展示如何你的网站变得更精简、更快速。\n\
    \n### 注意：为你的网站制定锻炼计划\n\n在整本书中，你会注意到我使用了各种关于锻炼计划的引用，特别是每章中的“热身”和“冷却”部分。事实上，本书的标题《精简型网站》也暗示了锻炼。这一想法背后的主要原因是，你想让网站更瘦以便使其运行更快。此外，通过反复实施书中讨论的技术（就像锻炼计划一样），你将培养出\
    \ Web 性能“肌肉记忆”，这种记忆将根根于你的 Web 开发常规——建立起习惯，让构建高效、高性能的网站变得像本能一样。\n\n## 谁应该读这本书\n\
    \n本书假设读者具有 Web 开发经验，并熟悉 HTML、CSS 和 JavaScript。具备一些后端经验会有帮助。\n\n## 采用的规范\n\n你会注意到，我们在整本书中使用了一些特定的排版和布局样式来表示不同类型的信息。请关注以下内容：\n\
    \n### 代码示例\n\n书中的代码将使用等宽字体显示，例如：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park. The birds \nwere singing and the kids\
    \ were all back at school.</p>\n```\n\n如果代码可以在书的代码存档找到，文件名将出现在程序列表的顶部，如下：\n\n\
    *example.css*\n\n```css\n.footer {\n  background-color: #CCC;\n  border-top: 1px\
    \ solid #333;\n}\n```\n\n如果只显示文件的部分内容，将用单词 *excerpt*（摘录）表示：\n\n*example.css (excerpt)*\n\
    \n```css\n border-top: 1px solid #333;\n```\n\n如果要在现有示例中插入额外的代码，新代码将以**粗体**显示：\n\
    \n```javascript\nfunction animate() {\n  new_variable = \"Hello\";\n}\n```\n\n\
    当需要现有代码作为上下文而不是重复所有代码时，将显示垂直省略号：\n\n```javascript\nfunction animate() {\n  …\n\
    \  return new_variable;\n}\n```\n\n"
