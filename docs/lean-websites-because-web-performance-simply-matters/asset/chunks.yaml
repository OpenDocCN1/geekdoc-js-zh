- fmt: "\n| [WebP](http://en.wikipedia.org/wiki/WebP) | Lossy and Lossless | Another\
    \ web image format, developed by Google, promising 45% more compression than PNG.\
    \ It's not supported by all browsers yet. We'll discuss this later. |\n\n## Warning:\
    \ Progressive Images\n\nIt might seem obvious that progressive image rendering\
    \ would [improve perceived load time](http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/),\
    \ because users receive visual feedback faster than with a regular JPEG image.\
    \ However, a [study](http://t.co/uDgtM2fFjv) by Radware suggests that progressive\
    \ images actually harm perceived performance by increasing user frustration.\n\
    \n### Vector Graphics\n\n`Vector` graphics are created from lines, points, and\
    \ polygons. Vector graphics don't lose quality when resized, whereas raster images\
    \ become pixelated when you zoom in on them.\n\nThe standard vector format for\
    \ the web is Scalable Vector Graphics (`SVG`). Behind the scenes, they are written\
    \ in XML, and you could create them by hand. More commonly, though, programs such\
    \ as Adobe Illustrator and Corel Draw are used to create and export them for the\
    \ web.\n\nYou can even animate SVGs with `JavaScript`, but as always, consider\
    \ how much real value this adds to your pages before weighing them down with extra\
    \ code.\n\nAs with raster images, SVGs can be optimized for fast loading by minimizing\
    \ the amount of data they contain. (For example, you may be able to remove lines\
    \ and points without reducing the quality of the graphic.) Again, you can optimize\
    \ an `SVG` manually, but it's more commonly done with various tools (some of which\
    \ are listed below). For further information on the performance of SVG images,\
    \ check out the [2014 Performance Calendar article](http://calendar.perfplanet.com/2014/tips-for-optimising-svg-delivery-for-the-web/)\
    \ by Sara Soueidan.\n\n### When to Use What?\n\nIn general, raster graphics should\
    \ be used for complex scenes with detailed shapes or forms, such as photorealistic\
    \ images. Vector graphics are suitable for images that consist of geometric shapes,\
    \ such as logos. The advantage of vector graphics is that they can be zoomed to\
    \ any size without reducing the quality.\n\nFrom a performance perspective, it\
    \ mostly comes down to the file size of each individual format. The file size\
    \ for vector graphics is typically small, making them a perfect fit for both multi-device\
    \ and high-resolution screens.\n\n### Image Compression and Optimization Tools\n\
    \nOnce you've decided on a format for your images, you can optimize them through\
    \ compression. The following table lists some useful, open-source tools for this\
    \ purpose. Most of them can run from the command line.\n\n| Tool | Compression\
    \ | Supported Formats |\n| --- | --- | --- |\n| [Kraken.io](https://kraken.io/)\
    \ | Online service, with a limited, free online version, plus a paid Pro version\
    \ with more features, including an API. | PNG, GIF, JPEG, SVG |\n| [Compressor.io](https://compressor.io/)\
    \ | Online service. | PNG, GIF, JPEG, SVG |\n| [jpegtan](http://jpegclub.org/jpegtran/)\
    \ | CLI for lossless optimization (including the removal of [EXIF](http://en.wikipedia.org/wiki/Exchangeable_image_file_format)\
    \ meta data, such as camera information etc.). Removing EXIF data can reduce the\
    \ file size of your image. | JPEG |\n| [optipng](http://optipng.sourceforge.net/)\
    \ | CLI for lossless compression of PNG, also for converting other formats to\
    \ PNG. | PNG |\n| [pngquant](http://pngquant.org/) | CLI for lossy compression\
    \ of PNG images. | PNG |\n| [gifsicle](http://www.lcdf.org/gifsicle/) | CLI for\
    \ creating and optimizing (animated) GIFs. | GIF |\n| [Trimage](http://trimage.org/)\
    \ | CLI for lossless compression, and removing EXIF and other metadata. | PNG\
    \ and JPEG |\n| [ImageMagick](http://www.imagemagick.org) | CLI for lossless optimization.\
    \ | Over [100](http://www.imagemagick.org/script/formats.php) |\n| [ImageOptim](https://imageoptim.com)\
    \ | Stand-alone app or CLI for lossless optimization and removing unnecessary\
    \ color profiles and other metadata. | PNG, GIF, JPEG |\n| [Scour](http://codedread.com/scour/)\
    \ | CLI for cleaning and optimizing SVGs. | SVG |\n\nWhile online tools and browser\
    \ extensions are useful for occasional optimization tasks, the command line tools\
    \ can be used for batch processing and automation during deployment. (See Chapter\
    \ 8 for more on automation).\n\n### Data URIs\n\nData URIs provide another interesting\
    \ option for including images on your page. What looks like an image to you just\
    \ looks like a long string of letters and numbers to a computer. That long string\
    \ is called a `data URI`.\n\nA data URI is a [Base64](http://en.wikipedia.org/wiki/Base64)\
    \ string. Base64 is an encoding scheme that represents binary data in an ASCII\
    \ string format.) Once you've converted your image to a data URI, you can insert\
    \ that string straight into your HTML or CSS—thus saving your browser one HTTP\
    \ request, which normally also means improving your site's performance.\n\nLet's\
    \ use a `leaf.png` example image to show how to convert it to a data URI. There\
    \ are lots of tools for performing the conversion. I used [DATAURL.NET](http://dataurl.net/#dataurlmaker),\
    \ as shown in [Figure 7.3](#ch07.html_ch7-leaf-uri \"Figure 7.3. Converting a\
    \ PNG image to a data URI\"):\n\n![Converting a PNG image to a data URI](OEBPS/figures/7-leaf-png-to-uri.png)\n\
    \nFigure 7.3. Converting a PNG image to a data URI\n\nHere's a trimmed version\
    \ of the output:\n\n```\ndata:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAXCAYAAAALHW+jAA\n\
    ”AABGdBTUEAALGPC/\n         xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3Ccu\n\
    \              ....\n          +7Qwdz8SrsdYz2s7ee7rLc2M4qVcD23mRbJpOB3+fDnr17bT+bgBNTHS+y\n\
    ”oNqFcVw2CzPT0/rQN+/erQ0VRpu9bs3+BwJLmvcQyqFgAAAAAElFTkSuQmCC\n```\n\nYou can\
    \ either put this code inside a style sheet or in an image tag in your HTML.\n\
    \n1. Data URI via the `<img>` tag:\n\n   ```\n   <img src=\"data URI output\"\
    \ />\n   ```\n\n2. Via external or inline CSS:\n\n   ```\n   .mydatauri {\n  \
    \     background:url(data URI output)\n   }\n   ```\n\nYou can either use online\
    \ tools to create data URIs as shown above, or use CLI tools. For example, you\
    \ could use [CSSEmbed](https://github.com/nzakas/cssembed/downloads/) via the\
    \ Java CLI runtime. This tool looks through your CSS file and converts all images\
    \ to base64 encoded strings within your CSS. For example, consider this CSS:\n\
    \n```\n/* style.css */\nbackground: url('leaf.png');\n```\n\nBy running the jar\
    \ file, `leaf.png` will be converted to a data URI image.\n\n```\njava -jar cssembed.jar\
    \ -o style_optimized.css styles.css\n```\n\nThe new styleheet is outputted as\
    \ follows (trimmed):\n\n```\n/* style_optimized.css\nbackground:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAA↵\n\
    XCAYAAAALH\n+jAAAABGdBTUEAALGPCxhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA\n\
    ...)\n```\n\nIt's worth noting that base64 encoding makes file sizes roughly [33%\
    \ larger](http://davidbcalhoun.com/2011/when-to-base64-encode-images-and-when-not-to/)\
    \ than their original binary representations. Therefore, it's better to use the\
    \ data URI format on smaller images rather than on larger ones, as it could worsen\
    \ the performance of your page. And of course, optimize your image as much as\
    \ possible *before* converting it to a data URI.\n"
