  trans: "\n\n- **延迟**：延迟通过收集信标（beacon）的 `lat` 值来记录。一半的访问需要处理 166ms 左右的延迟。95% 的访问者延迟低于\
    \ 370ms（第 95 位数）：\n\n  ![延迟分布](img/4-rum-latency.png)\n\n  图 4.10。延迟分布\n\n- **带宽**：另一个有趣的\
    \ RUM 实验是观察带宽，列在 `bw` 下。如下例所示，我从电子表格中汇总了所有的 `bw` 数据点，并根据特定范围对其进行过滤。下方的饼图显示了最常见的互联网连接。一半的访问者通过连接速度在\
    \ 512KB/s 到 1.6MB/s 之间的访问我的网站：\n\n  ![带宽分布](img/4-rum-bandwidth.png)\n\n  图 4.11。带宽分布\n\
    \n### 注意：Boomerang 方法\n\n页面加载时间的计算方式是：首先记录 `onbeforeunload` 事件的时间，将其存储在 cookie\
    \ 中。接着记录 `onload` 事件的时间，并用存储时间减去该 cookie 中的时间。随后，通过从服务器下载固定大小的图像并测量下载所需的时间来测量延迟和带宽。你可以参考\
    \ boomerang 网站[更多关于方法的详细信息](http://yahoo.github.io/boomerang/doc/methodology.html)。\n\
    \n如果你在设置 RUM 时需要额外帮助，我建议你阅读 [boomerang 教程文档](http://www.lognormal.com/boomerang/doc/howtos/)\
    \ 或使用我创建的简单脚本 [Captain Rum](https://github.com/bbinto/captain-rum)。\n\n与其创建自己的信标解决方案，不如使用由世界维网联盟（W3C）引入的\
    \ [Beacon API](http://www.w3.org/TR/beacon/)——尽管它目前处于工作草案阶段，且尚未被 IE 或 Safari 支持。它的意图是让\
    \ Web 开发者更容易向服务器发送分析或诊断信息。\n\n### 警告：RUM 与高流量网站\n\n如果你的网站流量很大，你会在日志文件中遇到大量的信标数据。因此，解析日志文件和提取数据可能会很慢。考虑引入一些代码使用较低的采样率，或者在每天的特定时段启用代码。\n\
    \n### 设置告警\n\n使用自动化告警来监控你的网站（当网站发生意外情况时通知你）是避免意外状况的有效技术。目前有多种商业产品可用，也有免费工具。\n\n\
    以下是你可以为网站设置的一些基础告警示例：\n\n- 如果你的网站对访客者不可用，则收到通知。\n- 如果根据地理或特定平台事件发生任何问题，则收到通知。\n\
    - 如果性能测量值达到特定阈值（例如页面加载时间超过 10 秒，或服务器响应时间超过 2 秒），则收到通知。\n\n#### Google Analytics\n\
    \n如果你已经在用 Google Analytics，不妨利用它的免费自定义告警。虽然我提到过 Analytics 仅使用采样数据，并且依赖平均值而非中位数来计算性能指标，但它仍然是一个快速且易用的告警工具。进入\
    \ Admin -> Custom Alerts 来创建你的[自定义告警](https://www.igvita.com/2012/11/30/web-performance-anomaly-detection-with-google-analytics/)，如图\
    \ 4.12 所示：\n\n  ![在 Google Analytics 中设置告警](img/4-alerts-plt-google.png)\n\n \
    \ 图 4.12。在 Google Analytics 中设置告警\n\n#### Pingdom\n\n虽然 Pingdom 是一个商业监控工具，但也有[免费受限版](https://www.pingdom.com/free/)。如果你只需要\
    \ RUM 报告和网站宕机告警，免费版可能足够了。Pingdom 的一个很棒的功能是允许你在“平均值”或“中位数”测量之间进行选择。\n\n下面的图 4.13\
    \ 截图显示了如何设置告警在网站宕机时通知你：\n\n  ![在 Pingdom 中设置宕机告警](img/4-alerts-downtime.png)\n\
    \n  图 4.13。在 Pingdom 中设置宕机告警\n\n#### CopperEgg\n\n[CopperEgg](http://copperegg.com/)\
    \ 是许多商业工具之一，提供了设置告警、RUM 和其他测量的灵活性。下方的图 4.14 截图显示了在设置特定性能指标告警时可以达到多细的粒度。这是一套实用的监控工具包，会让你安心。\n\
    \n  ![在 CopperEgg 中设置告警](img/4-alerts-copperegg.png)\n\n  图 4.14。在 CopperEgg 中设置告警\n\
    \n## 设置性能预算\n\n通过设置 `performance budget`（性能预算），你可以确保各种性能指标的定义基准值不会被超过。例如，这可能意味着为页面大小或页面使用的\
    \ HTTP 请求数量设置目标值。\n\n找到一个现实、可衡量且可实现的预算是构建精简网站的良好开端。它提供了一个整个团队可以关注的目标，并将帮助你回答诸如“我们试图改进什么？”以及“成功的衡量标准是什么？”\n\
    \n但从哪里开始？如何为你的网站设置预算？\n\n以下是一些帮助你设定预算并坚持预算的要点：\n\n- **评估竞争对手的标准**：竞争对手的指标可以帮助你建立性能基准。\n\
    - **创建性能假设以强化业务指标**：针对如何通过提高速度来使你的网站更成功提出假设。\n- **列出并承诺你的性能预算**：为了坚持预算，你需要发布它，并承诺你的性能指标和阈值。\n\
    \n让我们更详细地查看每一项。\n\n### 竞争比较\n\n> “智者能从敌人身上学到很多东西。” —— 亚里士芬德\n\n一旦你有了当前的网站性能数据，有时很难确定哪些结果应该改进。一种想法是将你的性能结果与竞争对手的结果进行比较。\n\
    \nWPT 是运行竞争分析的绝佳资源。当你第一次进入 WPT 网站时，点击 Visual Comparison（视觉比较）标签。它允许你添加多个不同的网站进行比较。将你的网站与竞争对手进行比较，可以为你的网站性能提供一个有用且切的基准。\n\
    \n例如，假设你有一个服装零售网站。你可能希望用户比竞争对手的服装零售网站更快地浏览你的落地页。这就是你可以应用 WPT “Visual Comparison”工具的地方。\n\
    \n现在，我们将你的网站称为 Website A，竞争对手的网站称为 Website B。\n\n1. 转到 WPT 并点击 Visual Comparison\
    \ 标签。输入你的网站和竞争对手的网站以获取对比性能数据和胶帧，如图 4.15 所示：\n\n  ![在 WPT 上启动视觉比较](img/4-visual-comparison.png)\n\
    \n  图 4.15。在 WPT 上启动视觉比较\n\n"
