    \ = '';    \n    if(preg_match('/iphone/i',$ua)) {\n        $device_prefix = 's_';\n\
    \    }\n?>\n```\n\nAnd this is how you would write the corresponding HTML code:\n\
    \n```\n<img src=\"<?=$device_prefix?>photo1.jpg\"\n↵ alt=\"Example photo\"/>\n\
    ```\n\nClient-side components\n\nThe client-side components can take care of the\
    \ styling of the header and footer via media queries. These queries can be stored\
    \ in a CSS file as follows (simplified for the sake of this example):\n\n```\n\
    header {\n    height:100px;\n}\n\nfooter {\n    height:60px;\n}\n\n@media (max-device-width\
    \ : 560px) {\n    header {\n        height:50px;\n    }\n    footer {\n      \
    \  height:20px;\n    }       \n\n}\n```\n\n#### RESS with ESI\n\nAs mentioned\
    \ earlier, ESI can be a powerful tool for dealing with device detection and direction,\
    \ so why not combine RESS with ESI?\n\nWith ESI, it's also possible to serve one\
    \ single URL for your desktop and mobile site. Based on the device the user is\
    \ using to connect with your site, you can create a content and markup switch\
    \ for the entire page:\n\n```\n<!--esi\n<esi:choose>\n<esi:when test=\"$(HTTP_USER_AGENT)\
    \ matches_i $(mobile_ua)\">\n       <!-- Mobile head and body -->\n     </esi:when>\n\
    \     <esi:otherwise>\n       <!-- Desktop head and body -->\n    </esi:otherwise>\n\
    </esi:choose>\n-->\n```\n\nThe code snippet above demonstrates how easy it is\
    \ to serve completely different markup and content to a mobile device.\n\n## Comparison\
    \ of Mobile Site Approaches\n\nEach approach to optimizing content for mobile\
    \ devices has advantages and disadvantages, and several factors need to be considered\
