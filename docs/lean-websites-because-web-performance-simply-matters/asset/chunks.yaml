    *   不要只看单一指标。仅仅因为一个网站有很多图片，并不意味着它比一个没有图片的页面慢。

    *   瀑布图（Waterfall）是识别性能瓶颈的绝佳工具。

    *   HTTP Archive 和 WebPagetest 是衡量网站性能的重要性能工具。

    *   PageSpeed 和 Speed Index（速度指数）捕捉了页面的整体性能。

    *   如果你喜欢编写代码和与 API 交互，那么将性能预算（performance budget）纳入你的持续部署流程中是非常值得的。它将消除大量的手动工作。

    *   合成测试（Synthetic testing）和真实用户监控（RUM）是互补且配合良好的流程。


    恭喜你，你在本章中学习到了很多知识。现在，我们将开始训练营，将所有所学知识付诸实践。


    # 第 4 章


    ## 性能训练营设置


    ## 热身


    到目前为止，在书中我们已经识别了网络性能的基本问题以及衡量它们的方法。在本章及接下来的章节中，我们将开始采取步骤解决这些性能问题。


    我们的目标是创建精简的网站，为此，我们需要建立一套“运动习惯”——通俗说，就是一套一系列程序，以确保我们的网站既快速、响应迅速且让用户感到愉悦。


    就像我们可能会参加一个高强度训练营课程来让身体精瘦一样，让我们开始我们的网络性能训练营吧。为了做好准备，我们将采取以下步骤：


    *   建立一个监控机制来记录我们网站的性能，以便了解需要优化什么。

    *   建立一个性能预算作为关注的目标。


    ## 先测量，后面向目标优化


    在设置任何目标之前，你首先需要对网站的性能进行审计。如果你还没有这样做过，请让你的网站通过 `WebPagetest` (`WPT`) 运行一遍。虽然你有一系列丰富的性能工具可以使用（正如我们在第
    3 章）中看到的），但在接下来的示例中，我将主要使用 `WPT` 和浏览器开发者工具。


    ### 你网站的瀑布图


    在运行 `WPT` 或在浏览器的开发者工具中加载网络面板后，你就可以详细访问网站的瀑布图。下一步是在瀑布图中识别任何潜在的性能问题。


    让我们选取一个瀑布图示例并分析它的形成。查看图 4.1 中的瀑布图：这是我创建的一个示例页分析，我将在接下来的几章节中使用它。它包含了几个独立的 JavaScript
    和 CSS 文件，以及一些狗的：


    ![示例页面的瀑布视图](img/4-waterfall-bbinto.png)


    图 4.1。[示例页面](http://bbinto.me/lean-websites/crp-grunt/without/magic.html)的瀑布视图


    让我们对上述的瀑布图结果注意三点：


    1.  第 3、5、9 行显示了大量的 CSS 资源。连续加载过多的不同且大型的 CSS 文件将推迟页面的渲染，并特别会减慢“开始渲染（Start Render）”时间。

    2.  第 16–19 行请求了几个图像资源，它们都由较大的主体组成。最好的目标是获得一个“薄”的瀑布图，因为这与小资源（或小文件大小）相关。每个资产或请求都应该快速加载，这意味着资产的主体应该是很小的。

    3.  第 22、24、26 和 27 行请求了许多小的 JavaScript 文件。请求越少，瀑布图就越小、越“陡”。陡峭的瀑布图是精简网站的一个很好的指标，揭示了资源的合理共享和并行化。


    ###set：资源未找到


    ![未找到资源](img/4-not-found-waterfall.png)


    图 4.2. 未找到资源


    避免你的 `WPT` 瀑布图中出现红线，如图 4.2 所示。这些表示找不到资源。其可能是标记中没有正确引用资源（例如给了错误的路径），或者资源在服务器上不存在。请注意，`WPT`
    瀑布会将“未找到”的资源标记为红色，而许多其他瀑布图可视化工具（例如你浏览器的网络标签页）不会高亮它们。瀑布图中的“未找到”资源会损害性能，因为浏览器在尝试定位文件时浪费了宝贵的时间，同时仍必须解析页面的其余部分。


    在接下来的章节中，我们将讨论如何优化和修复刚刚发现的问题，同时监控页面性能的改进。


    ## 性能监控：建立你的性能仪表板


    频繁监控你网站的性能很重要，因为性能很容易被第三方脚本或臃肿的图片等因素降低。性能监控仪表板对于跟踪网站性能非常有帮助，而且也会带给你安全感。


    以下是我建议你考虑的工具和流程：


    *   设置 `HTTP Archive` 的一个私有实例，以跟踪定义域列表的随时间演变化的趋势。这将帮助你衡量当前的问题，并预测未来的改进。通过审计趋势，你可以专门解决那些否则无法注意到的新引入的性能问题。

    *   通过创建一些真实用户的结果来校准你的合成测量结果，创建一个 `RUM` 解决方案。

    *   创建警报，当你的网站超过某个阈值时通知你（例如页面加载时间或服务器响应时间）。


    ### 创建你的私有 HTTP Archive


    公共的 `HTTP Archive` 收集了[Alexa 网站](http://httparive.org/about.php#listofurls) 的趋势，如果你足够幸运，你的网站就是其中之一并被记录了。（如果不是，你可以[添加](http://httparive.org/addsite.php)你的网站到列表中。）


    然而，如果你的网站不在列表中，或者尚未通过互联网访问，那么无法通过公共的 `HTTP Archive` 进行监控和跟踪。


    幸运的是，如前所述，`HTTP Archive` 是一个可以克隆供自己使用的开源项目。例如，如果你的公司有很多子域名、内部网站或你想跟踪的不同的微站点，安装自己的
    `HTTP Archive` 实例将非常有益。你甚至可以添加竞争对手的网站来与之对比。


    为了设置 `HTTP Archive`，你需要一个带有 `MySQL` 和 `PHP` 的 Web 服务器。你还需要请求 API 密钥，以便 `HTTP Archive`
    实例能够在公共 `WPT` 上执行运行。（如果你选择运行自己的私有 `WebPagetest` 实例以跳过在公共实例队列中等待的时间，那么你就不需要 API
    密钥。）如果你需要关于如何设置自己的 `HTTP Archive` 数据集和数据库的逐步说明，请查看我的博客文章“[设置自己的 HTTP Archive 以跟踪和查询你的网站趋势](http://www.bbinto.me/performance/setup-your-own-http-archive-to-track-and-query-your-site-trends/)”。


    一旦你有了私有的 `HTTP Archive` 数据库并填充了数据，就可以基于它运行查询。为了给你提供一些“真实”的结果，我决定使用我之前一个项目的 `HTTP
    Archive` 实例。


