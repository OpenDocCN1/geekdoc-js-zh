  trans: "\n\n| [WebP](http://en.wikipedia.org/wiki/WebP) | 有损和无损 | 另一种网络图像格式，由 Google\
    \ 开发，承诺比 PNG 压缩 45%。目前并非所有浏览器都支持它。我们稍后会讨论。 |\n\n## 警告：渐进式图像\n\n渐进式图像渲染似乎会[提高感知加载时间](http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/)，因为用户接收视觉反馈的速度比普通\
    \ JPEG 更快。然而，Radware 的一项[研究](http://t.co/uDgtM2fFjv) 表，渐进式图像实际上通过增加用户的挫败感而损害感知性能。\n\
    \n### 矢量图形\n\n`Vector` 图形是由线、点和多边形创建的。矢量图形在缩放时不会丢失质量，而位图在放大时会变得像素化。\n\n网页的标准矢量格式是可缩放矢量图形\
    \ (`SVG`）。在底层，它们是用 XML 编写的，你可以手动创建它们。不过，更常见的方法是使用 Adobe Illustrator 和 Corel Draw\
    \ 等程序来创建并导出它们到网页。\n\n你甚至可以使用 `JavaScript` 为 SVG 添加动画，但像往常一样，在用额外的代码增加负担之前，请考虑这为你的页面增加了多少实际价值。\n\
    \n与位图一样，可以通过减少其包含的数据量来优化 SVG 以实现快速加载。（例如，你可能可以在不降低图形质量的情况下删除线和点。）同样，你可以手动优化 `SVG`，但更常见的做法是使用各种工具（其中一些列在下方）。关于\
    \ SVG 图像性能的更多信息，请查看 Sara Soueidan 的 [2014 性能日历文章](http://calendar.perfplanet.com/2014/tips-for-optimising-svg-delivery-for-the-web/)。\n\
    \n### 何时该用什么？\n\n通常情况下，位图图形应用于具有细节形状或形式的复杂场景，例如写实级图像。矢量图形适用于由几何形状组成的图像，如 Logo。矢量图形的优势是它们可以缩放到任何尺寸而不降低质量。\n\
    \n从性能角度来看，这主要取决于每个单独格式的文件大小。矢量图形的文件大小通常很小，非常适合多设备和高分辨率屏幕。\n\n### 图像压缩和优化工具\n\n\
    一旦你决定了图像格式，就可以通过压缩对其进行优化。下表列出了一些用于此目的的实用开源工具。它们大部分可以从命令行运行。\n\n| 工具 | 压缩 | 支持的格式\
    \ |\n| --- | --- | --- |\n| [Kraken.io](https://kraken.io/) | 在线服务，提供有限的免费在线版，以及包含更多功能的付费\
    \ Pro 版（包含 API）。 | PNG, GIF, JPEG, SVG |\n| [Compressor.io](https://compressor.io/)\
    \ | 在线服务。 | PNG, GIF, JPEG, SVG |\n| [jpegtan](http://jpegclub.org/jpegtran/)\
    \ | 用于无损优化的 CLI（包括移除 [EXIF](http://en.wikipedia.org/wiki/Exchangeable_image_file_format)\
    \ 元数据，如相机信息等）。移除 EXIF 数据可以减小图像的文件。 | JPEG |\n| [optipng](http://optipng.sourceforge.net/)\
    \ | 用于 PNG 无损压缩的 CLI，也可将其他格式转换为 PNG。 | PNG |\n| [pngquant](http://pngquant.org/)\
    \ | 用于 PNG 有损压缩的 CLI。 | PNG |\n| [gifsicle](http://www.lcdf.org/gifsicle/) | 用于创建和优化（动画）GIF\
    \ 的 CLI。 | GIF |\n| [Trimage](http://trimage.org/) | 用于无损压缩以及移除 EXIF 和其他元数据的 CLI。\
    \ | PNG 和 JPEG |\n| [ImageMagick](http://www.imagemagick.org) | 用于无损优化的 CLI。 |\
    \ 超 [100](http://www.imagemagick.org/script/formats.php) |\n| [ImageOptim](https://imageoptim.com)\
    \ | 用于无损优化和移除必要的颜色配置文件和其他元数据的独立应用或 CLI。 | PNG, GIF, JPEG |\n| [Scour](http://codedread.com/scour/)\
    \ | 用于清理和优化 SVG 的 CLI。 | SVG |\n\n虽然在线工具和浏览器扩展对于偶尔的优化任务很有用，但命令行工具可以在部署期间用于批量处理和自动化。（有关自动化的更多信息请参见第\
    \ 8 章）。\n\n### Data URIs\n\nData URI 为在页面上包含图像提供了另一种有趣的选择。对你来说看起来像图像的内容，对计算机来说只是一长串字母和数字。这长串字符串被称为\
    \ `data URI`。\n\ndata URI 是一个 [Base64](http://en.wikipedia.org/wiki/Base64) 字符串。（Base64\
    \ 是一种编码方案，用 ASCII 字符串格式表示二进制数据。）一旦你将图像转换为 data URI，就可以将该字符串直接插入 HTML 或 CSS 中——从而为你的浏览器节省了一个\
    \ HTTP 请求，这通常意味着提高了你网站的性能。\n\n让我们用 `leaf.png` 示例图像来展示如何将其转换为 data URI。有很多工具可以执行此转换。我使用了\
    \ [DATAURL.NET](http://dataurl.net/#dataurlmaker)，如图 7.3](#ch07.html_ch7-leaf-uri\
    \ \"图 7.3. 将 PNG 图像转换为 data URI\") 所示：\n\n![将 PNG 图像转换为 data URI](img/7-leaf-png-to-uri.png)\n\
    \n图 7.3. 将 PNG 图像转换为 data URI\n\n这里是输出的精简版本：\n\n```\ndata:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAXCAYAAAALHW+jAA\n\
    ”AABGdBTUEAALGPC/\n         xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3Ccu\n\
    \              ....\n          +7Qwdz8SrsdYz2s7ee7rLc2M4qVcD23mRbJpOB3+fDnr17bT+bgBNTHS+y\n\
    ”oNqFcVw2CzPT0/rQN+/erQ0VRpu9bs3+BwJLmvcQyqFgAAAAAElFTkSuQmCC\n```\n\n你可以将此代码放在样式表中，或者放在\
    \ HTML 的图像标签中。\n\n1. 通过 `<img>` 标签使用 Data URI：\n\n   ```\n   <img src=\"data URI\
    \ output\" />\n   ```\n\n2. 通过外部或内联 CSS：\n\n   ```\n   .mydatauri {\n       background:url(data\
    \ URI output)\n   }\n   ```\n\n你可以像上面一样使用在线工具创建 data URI，也可以使用 CLI 工具。例如，你可以通过\
    \ Java CLI 运行时使用 [CSSEmbed](https://github.com/nzakas/cssembed/downloads/)。该工具会扫描你的\
    \ CSS 文件并将所有图像转换为 CSS 内部的 base64 字符串。例如，考虑这段 CSS：\n\n```\n/* style.css */\nbackground:\
    \ url('leaf.png');\n```\n\n通过运行 jar 文件，`leaf.png` 将被转换为 data URI 图像。\n\n```\n\
    java -jar cssembed.jar -o style_optimized.css styles.css\n```\n\n输出的新样式表如下（精简）：\n\
    \n```\n/* style_optimized.css\nbackground:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAA\n\
    XCAYAAAALH\n+jAAAABGdBTUEAALGPCxhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA\n\
    ...)\n```\n\n值得注意的是，base64 编码使文件大小比其原始二进制表示大出 [33%](http://davidbcalhoun.com/2011/when-to-base64-encode-images-and-when-not-to/)。因此，在较小的图像上使用\
    \ data URI 格式比在大图像上更好，因为可能会损害页面的性能。当然，在将其转换为 data URI *之前*，请尽可能地优化你的图像。\n\n"
- fmt: "\nAlso, watch out for caching limitations. Data URI images become part of\
    \ a larger HTML or CSS file, so to cache images encoded as data URIs, we need\
    \ to cache the pages that contain them. So, for example, if you put data URI images\
    \ in your HTML, they can only be cached as defined by the HTTP cache control header\
    \ (we'll discuss caching in more detail later). If the HTML is not cacheable,\
    \ the entire content of the HTML markup—including the inline data URI—will need\
    \ to be re-downloaded every single time a user visits the page. That can worsen\
    \ performance if the image is large. Hence, one option is to put the encoded image\
    \ in your style sheet, as you can then have a more aggressive cache for the CSS\
    \ file, while the HTML page can have no-cache or a very limited cache, as HTML\
    \ content is more likely to change. Large images make this more of a problem,\
    \ so a useful rule of thumb is to not inline any asset that is bigger than `4KB`.\n\
    \n## WebP\n\nWebP is a relatively new image format that promises great file size\
    \ savings over PNGs and JPEGs.\n\n[WebP](https://developers.google.com/speed/webp/?csw=1)\
    \ is an open-source image format, only currently supported in Chrome, Opera, and\
    \ Android. Some notable websites such as Facebook have started to [adopt this\
    \ format](http://highscalability.com/blog/2014/9/22/how-facebook-makes-mobile-work-at-scale-for-all-phones-on-al.html)\
    \ with great success. Most images sent to Facebook and Messenger for Android use\
    \ the WebP format, which has resulted in [data savings](https://code.facebook.com/posts/485459238254631/improving-facebook-on-android)\
    \ of 25–35% compared to JPG, and 80% compared to PNG.\n\nYou can convert your\
    \ images to WebP using a converter. I used [ImageMagick](http://imagemagick.org/)\
    \ to convert `leaf.png` to WebP, by installing ImageMagick and running the following\
    \ command:\n\n```\nconvert leaf.png -quality 50 -define webp:lossless=true leaf.webp\n\
    ```\n\nYou can tweak the settings by adding additional [options](http://www.imagemagick.org/script/webp.php).\n\
    \nOne of the drawbacks of WebP is that not all browsers support this new format,\
    \ notably Firefox, Internet Explorer and Safari. So you'll need to save two versions\
    \ of the image, one in WebP and one in the legacy image format, which will take\
    \ more storage space on your server.\n\nWhile it's recommended to experiment with\
    \ different quality settings, as well as compression options, to verify which\
    \ image format is smaller and comes with less detail loss, WebP will outperform\
    \ JPEG and PNG files for size most of the time. Even with comparable quality levels,\
    \ WebP images are [significantly smaller](https://www.andrewmunsell.com/blog/jpg-vs-webp).\n\
    \nWe've gone over several image formats and techniques now. Let's see how they\
    \ all compare with each other.\n\n## Comparison of Image Formats\n\nI ran a performance\
    \ test where I compared the following formats for the previously used [leaf image](http://www.vectorvaco.com/grass-and-green-vector-13164/).\n\
    \nI used a vector-based source file of `180x180px` and saved it to PNG, SVG, WebP,\
    \ and created a data URI from the PNG.\n\n1. [Inline Data URI](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-inline/):\
    \ base64 encoded image included inline as an image via `<img>`:\n\n```\n<img src=\"\
    data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQ...\"/>\n```\n\n2. [WebP](http://www.bbinto.me/lean-websites/chapter-4/data-uri/webp/):\
    \ PNG converted into WebP with ImageMagick, and referenced as a background image\
    \ via external CSS:\n\n```css\n/* style.css*/\n.leanleaf{\n    background-image:\
    \ url(../img/leaf.webp);\n    /* ... */\n}\n```\n\n3. [SVG](http://www.bbinto.me/lean-websites/chapter-4/data-uri/svg/):\
    \ exported vector-based source file to SVG, included as a background image via\
    \ an external CSS file:\n\n```css\n/* style.css*/\n.leanleaf{\n    background-image:\
    \ url(../img/leaf.svg);\n    /* ... */\n}\n```\n\n4. [Data URI](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-external):\
    \ base64 encoded and included as a background image in an external CSS file:\n\
    \n```css\n/* style.css*/\n.leanleaf{\n    width:156px;height:169px;background:url(data:image/png;base64,\n\
    iVBORw0KGgoAAAANSUHEUgAAALQ...\niVBORw0KGgoAAAANSUHEUgAAALQ...\n}\n```\n\n5. [PNG](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-external):\
    \ referenced as a background image via external CSS:\n\n```css\n/* style.css*/\n\
    .leanleaf{\n    background-image: url(../img/leaf.webp);\n    /* ... */\n}\n```\n\
    \n| Result | Inline Data URI | WebP | SVG | Data URI | PNG |\n| :--- | :--- |\
    \ :--- | :--- | :--- | :--- |\n| Median (ms) | 142 | 179 | 216 | 258 | 282 |\n\
    | Size (bytes) | 9873 | 1769 | 2161 | 2538 | 285 |\n\nInline data URI and WebP\
    \ show the fastest load times, whereas PNG the slowest.\n\n## Optimizing Video\n\
    \nLike images, video files tend to be bigger than CSS or HTML, so they come with\
    \ a higher performance price. Video file size depends on frame and bit rate, resolution,\
    \ compression format, and delivery method. In this section you'll learn how to\
    \ optimize these factors.\n\n### Video Creation and Content\n\nThe more complex\
    \ a video is, the harder it is to compress. If you have control over how the video\
    \ is shot, there are steps you can take to ensure that it will be easier to compress:\n\
    \n* Aim for noise-free content.\n* Keep the number of zooms to a minimum.\n* Keep\
    \ the number of background details and movements to a minimum.\n\n### Note: Audio\n\
    \n[Studies](http://web.media.mit.edu/~vmb/papers/sound.pdf) have shown that audio\
    \ quality can affect *perceived* video quality. This means that if you have good-sounding\
    \ audio, people will think your video *looks* better. That said, if your video\
    \ uses mostly spoken words, and no music, you should be fine using mono rather\
    \ than stereo audio (which will save some bandwidth that can be allocated to the\
    \ video instead).\n\nAudio bit rates should be [defined](http://support.limelight.com/support/docs/encoding_guide/)\
    \ based on their content, and therefore only set as high as your content demands.\
    \ Rates between 64 and 128kbit/s are sufficient for most cases. For recording\
    \ human speech, a low bit rate around 64kbit/s is acceptable. For music audio,\
    \ a higher bit rate of 192kbit/s would be ideal.\n\n### File Size: Frame Rate,\
    \ Bit Rate, and Resolution\n\nVideo settings including frame rate, bit rate and\
    \ resolution, each of which affects the file size of a video.\n\n#### Frame Rate\n\
    \nThe **frame rate** is defined as the number of frames that appear every second.\
    \ It's measured in frames per second (fps). The higher the frame rate or resolution,\
    \ the better the video experience for the user.\n"
