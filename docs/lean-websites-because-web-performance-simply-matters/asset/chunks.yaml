    >\n      Hello readers!\n    </div>\n  </body>\n</html>\n<noscript><link rel=\"\
    stylesheet\" href=\"style.css\"></noscript>\n```\n\n## Keep-alive\n\nAs discussed\
    \ in [Chapter 3](#ch03.html \"Chapter 3Measuring & Monitoring Performance\"),\
    \ every time an HTTP client—such as a browser—fetches a website asset, it will\
    \ create a new TCP session to the server, initiating a handshake between the client\
