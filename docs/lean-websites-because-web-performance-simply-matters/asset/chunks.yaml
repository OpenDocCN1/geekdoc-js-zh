    of the “magic” page"). You can see the difference in the number of assets being
    downloaded:


    ![Waterfall of the “not magic” page](OEBPS/figures/8-notmagic-waterfall.png)


    Figure 8.2. Waterfall of the “not magic” page


    ![Waterfall of the “magic” page](OEBPS/figures/8-magic-waterfall.png)


    Figure 8.3. Waterfall of the “magic” page


    Let''s also have a look at the WPT video comparison of the two pages, specifically
    focusing on the “Fully Loaded” metric. As you can see, the magic file wins:


    ![WPT video comparison of our pages](OEBPS/figures/8-grunt-video-comparison.png)


    Figure 8.4. [WPT video comparison](http://www.webpagetest.org/video/compare.php?tests=150123_B7_2RD%2C150123_61_2RB&thumbSize=100&ival=100&end=visual#)
    of our pages


    Here is the breakdown by WPT metrics:


    | Perf Results | Without magic | With magic |

    | --- | --- | --- |

    | Start Render Time | 1.457s | 1.148s |

    | Fully Loaded | 2.583s | 2.176s |

    | Bytes | 692KB | 615KB |

    | Speed Index | 2222 | 1719 |

    | PageSpeed Score | 82 | 88 |


    The optimization tasks we''ve done here with Grunt could have been done manually,
    but it would be quite a chore to keep working this way on a regular basis. Using
    task runners to take care of performance optimization can speed up the development
    process and make producing lean websites easier.


    ## Grunt Alternatives


    [Gulp](http://gulpjs.com/) is an alternative to Grunt, similarly automating common
    performance tasks like minifying JavaScript and compiling preprocessed CSS. While
    Grunt writes a lot to the file system, changing files, Gulp executes most operations
    in memory before writing it to disk (using streams). Most of the Grunt tasks are
    also available for Gulp, such as [gulp-concat](https://www.npmjs.com/packages/gulp-concat),
    [gulp-minify-html](https://www.npmjs.com/packages/gulp-minify-html), etc.


    Other task runners include [Maven](http://maven.apache.org/) and [Ant](http://ant.apache.org/),
    which are mainly used for Java projects but can also be used for automated web
    performance optimization. There are several performance add-ons available, such
    as [Google Closure Compiler](https://github.com/google/closure-compiler) or [HtmlCompressor](https://code.google.com/p/htmlcompressor/).
    Maven and Ant both use XML to describe the build process.


    ## Cool Down


    *   You''ve been setup with tools that can automate your performance optimization
    tasks.

    *   Most existing performance tools such as YSlow and the WPT API wrapper can
    be integrated into your continuous deployment process to remove any manual performance
    testing.

    *   You''ve been introduced to task runners and build systems, and how they can
    help you automate performance.

    *   Several specific Grunt performance tools were introduced to demonstrate the
    benefits of including performance tasks into a deployment process. The comparison
    of the “before” and “after” pages revealed how many performance improvements can
    be made without manual labor.


    # Chapter 9: Network and Server Performance Improvements


    ## Warm Up


    The performance techniques we''ve covered so far have focused on optimizing the
    front-end of a website—or everything that is downloaded to the browser. In this
    chapter, we''ll focus on improving back-end performance, which involves tweaks
    to your network and web server.


    ## Content Delivery Networks


    A content delivery network (CDN) is a hosting service that''s optimized for serving
    content quickly, in an attempt to overcome latency. If a user in Berlin requests
    a page that is hosted in San Francisco, on a server without a CDN, all the assets
    of that page must be retrieved from San Francisco, making its way over the Atlantic
    ocean. Pretty cumbersome, don''t you think? A CDN alleviates this problem by caching
    static content at several locations around the globe, allowing site assets to
    be delivered quickly to any browser.


    The following example outlines the performance of a website with and without a
    CDN:


    | velocityconf.com[^([a])](#ch09.html_ftn.d5e3544) | Original | CDN |

    | --- | --- | --- |

    | Load Time | 17.87s | 8.34s |

    | Start Render | 7.01s | 2.74s |

    | Requests | 81 | 81 |

    | Bytes in | 1014KB | 792KB |


    [^([a])](#ch09.html_d5e3544) Source: Sample data for velocityconf.com, taken from
    [Web Performance Today](http://www.webperformancetoday.com/2012/05/14/cdn-feo-front-end-optimization-web-acceleration/)


    The servers available throughout a CDN are called edge servers, and distributing
    multiple copies of a site''s content across these servers is called content replication.
    Most CDN providers maintain lots of edge servers around the world, making CDNs
    particularly useful for sites that serve content to many countries.


    [Figure 9.1](#ch09.html_ch9-cdn-example "Figure 9.1. Demonstration of a CDN in
    action") illustrates how a website is accessed within a CDN. As soon as a page
    is requested, the optimal server is determined either by the amount of hops needed
    to reach the server, or by which has the highest availability:


    ![Demonstration of a CDN in action](OEBPS/figures/9-cdn-example-external.png)


    Figure 9.1. Demonstration of a CDN in action


    The benefits of using a CDN include:


    *   **reduced latency:** by moving the content closer to the user, latency can
    be reduced and load times improved. Due to content replication and caching of
    static content at the edge, the user can benefit from cached content and faster
    delivery times.

    *   **reduced packet loss:** because packages travel shorter distances, there''s
    less chance they''ll be lost. This is particularly important in latency-sensitive
    situations, such as video streaming. A poorly streaming video will certainly decrease
    user satisfaction.

    *   **improved reliability:** having content replicated across a CDN improves
    a website''s up-time, as the site isn''t dependent on a single server.


    ## PageSpeed Insights for Your Web Server


    PageSpeed Insights is available as a back-end module `https://developers.google.com/speed/pagespeed/module`
    that can be installed on your server. The module comes with many useful filters
    `https://developers.google.com/speed/pagespeed/module/filters` that can be installed
    to optimize your code. The module optimizes the code without requiring you to
    modify the existing content, executing when the HTTP server delivers the assets.
    It''s basically a performance improvement “on the fly”.


    The following sections briefly cover a few of the filters that are worth mentioning
    in the context of reducing HTTP requests, and therefore latency[^([3])](#ch09.html_ftn.d5e3594).


    ### Canonicalize JavaScript Libraries


    jQuery is one of the most popular JavaScript libraries in use today. Imagine you
    navigate from website A—which is using jQuery—to website B—which also uses jQuery.
    The browser automatically fetches the jQuery script again from website B, even
    though it was just requested from website A.

