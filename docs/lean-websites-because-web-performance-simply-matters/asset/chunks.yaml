  trans: "\n*   在添加自定义字体之前请三思，除非它们对你公司的品牌至关重要。除了影响性能外，过多的不同字体会让你的设计显得杂乱。\n*   考虑仅在对连接不敏感的设备上加载网络字体。\n\
    *   如果你决定自己托管字体，请使用 [Glyphs](http://www.glyphsapp.com/) 或 [FontForge](http://fontforge.github.io)\
    \ 等工具进行优化。\n*   作为一个一般原则，尽量避免独立完成所有工作的麻烦。利用 Google 字体基础设施的力量和成果，利用跨站缓存和 Google\
    \ 的优化技术，从而为用户提供其设备的最优版本。\n\n现在我们已经讨论了优化网站资源的方法，接下来我们将看看如何将这些技术整合到自动化的性能优化工作流中。\n\
    \n## 总结 (Cool Down)\n\n*   虽然图像仍然是网页性能不佳的主要原因，但有很多方法可以对其优化。\n*   选择最适合你目的的图像格式，权衡它们的优缺点。\n\
    *   使用可用工具测量每种图像格式（包括数据 URIs）的性能。\n*   仔细考虑你选择的视频格式和交付方式——无论是流式传输、下载还是渐进下载——以确保最佳性能。\n\
    *   明智地使用网络字体，权衡设计和品牌需求与下载额外资产带来的性能影响。并考虑使用网络字体加载器来帮助你在渲染过程中管理字体加载。\n\n# 第 8 章：自动化优化任务\n\
    \n## 热身 (Warm Up)\n\n这一章是我整本书中最喜欢的。它涵盖了自动化网站性能优化的工具。有无数工具可以实现 Web 开发各项任务的自动化，其中许多非常适合书中介绍的优化任务。\n\
    \n在本章中，我将首先介绍一些你可以用于自动化的有用脚本和 API。在解释如何使用这些工具之后，我将使用任务运行器 `Grunt` 将它们应用于一个具体的示例。\n\
    \n## 自动化工具\n\n本节介绍了用于自动化性能优化的工具。它们的目的是根据前几节讨论的性能指南对代码进行验证，并以 `JSON` 或 `XML` 等结构化格式返回结果。\n\
    \n 与其他工具配合 PhantomJS\n\n到为止，我们可以我们一直在手动进行所有的性能测试，例如使用 `WPT`、`PageSpeed Insights`\
    \ 和 `YSlow` 浏览器扩展等工具。现在我们转转向 [PhantomJS](http://phantomjs.org/)，这是一个`无头浏览器`——这意味着你可以用它打开网站并在命令行中在上面运行命令。通过\
    \ `PhantomJS`，我们可以在不打开浏览器窗口的情况下运行相同的测试（例如使用 `YSlow`）。\n\n通过将 `PhantomJS` 与其他工具结合，你可以监控[页面和网络性能](http://phantomjs.org/network-monitoring.html)，并将其作为你部署过程的一部分。\n\
    \n这里是使用 `PhantomJS` 打开网页的简单示例：\n\n```javascript\n// open-mypage.js\nvar page =\
    \ require('webpage').create();\npage.open('http://bbinto.me', function() {\n \
    \ // do your stuff\n  console.log('Just opened bbinto.me');\n  phantom.exit();\n\
    });\n```\n\n你可以按照以下方式执行此代码：\n\n```bash\n$ phantomjs open-mypage.js \n```\n\n让我们来看一个使用\
    \ `PhantomJS` 配合 `YSlow` 分析简单[演示页面](http://bbinto.me/lean-websites/crp/index.html)\
    \ 的实际示例。首先，作为对比，图 8.1 显示了浏览器中的 `YSlow` 结果，该网站的总体得分为 87：\n\n![通过 Firefox 扩展运行 YSlow，浏览器窗口内的视觉表示](img/8-yslow-plugin.png)\n\
    \n图 8.1. 通过 Firefox 扩展运行 YSlow，浏览器窗口内的视觉表示\n\n现在让我们通过无头浏览器查看 `YSlow` 产生的性能结果。\n\
    \n*   首先，我们获取简单的 `JSON` 输出：\n\n```bash\n$ phantomjs yslow.js --info basic http://bbinto.me/lean-websites/\n\
    ↵crp/index.html\n\n// result\n$ {\"v\":\"3.1.8\",\"w\":623435,\"o\":87,\"u\":\"\
    http%3A%2F%2Fbbinto.me%2Fle\nan-websites%2Fcrp%2Findex.html\",\"r\":19,\"i\":\"\
    ydefault\",\"lt\":2191}\n```\n\n结果的关键点如下：\n\n*   `v`: 版本\n*   `w`: 权重\n*   `o`:\
    \ 总体得分\n*   `u`: URL\n*   `r`: 请求数\n*   `i`: 性能规则集（来自 `ydefault`、`yslow1` 或 `yblog`）\n\
    *   `lt`: 页面加载时间\n\n总体得分“87”与浏览器中运行的 `YSlow` 扩展的结果一致。\n\n*   这是一个完整的示例，包含了测试网站的预定义条件。如果不符合条件，测试将失败并返回警告。以下命令定义了阈值，以检查网站总体得分是否达到\
    \ `B`（或更高）：\n\n```bash\n$ phantomjs yslow.js --info basic --format tap --threshold\
    \ B http:\n//bbinto.me/lean-websites/crp/index.html\n```\n\n测试通过：\n\n```bash\n\
    $ TAP version 13\n1..1\nok 1 B (87) overall score\n```\n\n阈值范围可以从 0 到 100（其中 100\
    \ 最严格），或者可以使用 `A–F` 标记进行验证，其中 `A` 最好，`F` 最差。\n\n你可以为网站选择合适的阈值。例如，你甚至可以更具体、更严谨，将\
    \ HTTP 请求的阈值（`ynumreq:A`）设置为 95，如下：\n\n```bash\n$ phantomjs yslow.js --info grade\
    \ --format tap --threshold '{\"ynum\nreq\": \"95\"}' http://bbinto.me/lean-websites/crp/index.html\n\
    ```\n\n上面的示例使用了 `yslow.js` 文件中指定的 `ydefault` 规则集。这与通过浏览器扩展运行 `YSlow` 时使用的规则集是相同的。该规则集根据要测试的标准定义了总体得分的计算方式。\n\
    \n与单独使用 `YSlow` 不同，配合 `PhantomJS` 使用允许对性能测试和阈值进行更多自定义。为了使这一过程更加优化，你可以将 `PhantomJS`\
    \ 脚本添加到你的部署过程中。诸如 `Jenkins` 或 `Travis` 这样的持续集成工具提供了自动化测试环境，并在其中一个测试失败时提醒你。\n\n\
    ### 注意：持续交付、持续集成\n\n持续交付涉及构建软件使其能够随时进入生产环境。持续集成涉及定期测试并将更改合并到项目中。持续集成构建可以由各种事件启动，例如由版本控制系统中的提交触发、通过类似\
    \ cron 的机制进行调度，或在其他构建完成后进行构建等。\n\n诸如 [Jenkins](http://en.wikipedia.org/wiki/Jenkins_(software)))\
    \ 或 [Travis](https://travis-ci.org/recent) 之类的工具有助于组织运行这些流程。\n\n### WPT API 和\
    \ PageSpeed Insights API\n\n与其使用 `PhantomJS` 作为浏览器来测试网站性能，你也可以查询云端的性能 API。正如第\
    \ 3 章所示，`PageSpeed Insights` 和 `WPT` 都提供了 API。你可以使用这些 API 将性能测试集成到你的部署过程中。\n\n\
    让我们从 `WPT` API 开始，来说它是如何用于我们在不需要手动在浏览器窗口中分析任何内容的情况下检测糟糕的性能决策。\n\nGoogle 工程师 Marcel\
    \ Duran 构建了一个[用于 WPT API 的插件](https://github.com/marcelduran/webpagetest-api/wiki/Test-Specs)，以配合持续集成工具。\n\
    \n通过为 Duran 的 `WPT API` 封装器提供 `specs.json` 文件，你可以指定如何运行性能测试，以及测试何时应该通过或失败。让我们查看\
    \ `specs.json` 的一些示例内容：\n\n"
- fmt: "\n```\n{\n  \"median\": {\n    \"firstView\": {\n      \"requests\": 20,\n\
    \      \"render\": 400,\n      \"loadTime\": 4000\n    }\n  }\n}\n```\n\nThe sample\
    \ above creates the following ruleset: the page to be tested should not have more\
    \ than 20 HTTP requests on first view, the render time should be below 400ms,\
    \ and the total load time should be less than 4000ms. You're not limited to testing\
    \ these properties, though. You can use any of the attributes in the `WPT API`\
    \ JSON response to define your thresholds.\n\nHere's the command we issue to start\
    \ the test:\n\n```\nwebpagetest test http://urltotest.com --specs specs.json\n\
    ```\n\nThe returning JSON response will be compared with the `specs.json` file,\
    \ and outputs the following test result:\n\n```\nWebPageTest\n    ✓ median.firstView.requests:\
    \ 10 should be less than 20\n    1) median.firstView.render: 600 should be less\
    \ than 400\n    ✓ median.firstView.loadTime: 2500 should be less than 4000\n \
    \   2) median.firstView.score_gzip: 50 should be greater than 90\n\n  2 passing\n\
    \  2 failing\n```\n\nSimilar to `YSlow` for `PhantomJS`, you could easily hook\
    \ into the API from your continuous build machine to monitor your website's performance\
    \ for each build, issuing an alarm when any threshold has been crossed.\n\nLet's\
    \ now move on to the `PageSpeed Insights API`. The following request will provide\
    \ you with PageSpeed results for `bbinto.me`:\n\n```\ncurl GET https://www.googleapis.com/pagespeedonline/v1/runPagespeed?\n\
    url=http%3A%2F%2Fwww.bbinto.me&key={YOUR_API_KEY}\n```\n\nBy default, the result\
    \ comes back in JSON format, as follows:\n\n```\n{\n \"kind\": \"pagespeedonline#result\"\
    ,\n \"id\": \"http://www.bbinto.me/\",\n \"responseCode\": 200,\n \"title\": \"\
    bbinto.me\",\n \"score\": 51,\n \"pageStats\": {\n  \"numberResources\": 79,\n\
    \  \"numberHosts\": 13,\n  \"totalRequestBytes\": \"7990\",\n  \"numberStaticResources\"\
    : 44,\n  \"htmlResponseBytes\": \"107091\",\n  \"cssResponseBytes\": \"249769\"\
    ,\n  \"imageResponseBytes\": \"1500676\",\n  \"javascriptResponseBytes\": \"787229\"\
    ,\n  \"otherResponseBytes\": \"115450\",\n  \"numberJsResources\": 28,\n  \"numberCssResources\"\
    : 10\n },\n // ...\n```\n\nLooking at the JSON result above, you could focus on\
    \ a few criteria, such as the value of `score` or `numberResources`, to trigger\
    \ an alarm if the defined thresholds have been exceeded. By reading the results\
    \ of the performance JSON file, you can programmatically detect and react to performance\
    \ issues without ever having to run the page through the online browser version\
    \ of PageSpeed Insights.\n\nNote that these validation checks for the `PageSpeed\
    \ API` are only possible if your site is already live. If you need to validate\
    \ results like this before deploying, you will need to look at [WPT's private\
    \ instance](https://sites.google.com/a/webpagetest.org/docs/private-instances)\
    \ and use its API via the private instance. That way, you can test internal integration\
    \ pages as well. This is especially helpful for newly launching sites.\n\n## Task\
    \ Runners and Build Systems\n\nThe goal of task runners is to set up a sequence\
    \ of tasks that are automatically executed, saving developers from repetitive\
    \ manual work. There are several popular task runners available, but for the purposes\
    \ of this book, I will focus on `Grunt`.\n\n### Grunt\n\n[Grunt](http://gruntjs.com/)\
    \ is a JavaScript-based task runner that not only automates website development\
    \ and deployment tasks, but also includes handy performance tools. Let's look\
    \ at a few of them.\n\n| Performance Tools | Description | Applicable Exercise\
    \ Rule |\n| --- | --- | --- |\n| [grunt-closure-compiler](https://github.com/gmarty/grunt-closure-compiler)\
    \ | A Grunt task for `Closure Compiler` (a tool that minifies and concatenates\
    \ files). | Reduce file size and HTTP requests |\n| [grunt-contrib-concat](https://github.com/gruntjs/grunt-contrib-concat)\
    \ | A Grunt task to combine either JavaScript or CSS files. | Reduce HTTP requests\
    \ |\n| [grunt-contrib-cssmin](https://github.com/gruntjs/grunt-contrib-cssmin)\
    \ | Once your CSS files are all concatenated, use `cssmin` to shrink several lines\
    \ of CSS code into a single line. | Reduce file size |\n| [grunt-contrib-imagemin](https://github.com/gruntjs/grunt-contrib-imagemin)\
    \ | A Grunt task to optimize images used on your page. | Reduce file size |\n\
    | [grunt-contrib-uglify](https://github.com/gruntjs/grunt-contrib-uglify) | `Uglify`\
    \ and `concat` go almost hand in hand and should be used together. `Concat` first\
    \ combines all defined JavaScript files. `Uglify` only works on JavaScript files.\
    \ It minifies all code in a one line block of code. Use `cssmin` for CSS files.\
    \ | Reduce file size |\n| [grunt-criticalcss](https://github.com/filamentgroup/grunt-criticalCSS)\
    \ | Finds the above the fold CSS for your page, and outputs it into a file. |\
    \ 14KB head rule |\n| [grunt-htmltidy](https://www.npmjs.org/package/grunt-htmltidy)\
    \ | A Grunt task that runs `HTML Tidy`. | Clean markup |\n| [grunt-htmlcompressor](https://github.com/jney/grunt-htmlcompressor)\
    \ | A Grunt task to minify and compress HTML files. | Reduce file size |\n| [grunt-image-embed](https://github.com/ehynds/grunt-image-embed)\
    \ | This plugin encodes images as base64 and leverages the technique of data URIs\
    \ for images. | Reduce HTTP requests |\n| [grunt-montage](https://github.com/globaldev/grunt-montage)\
    \ | A Grunt task to sprite images. `ImageMagick` is required. | Reduce HTTP requests\
    \ |\n| [grunt-pagespeed](https://www.npmjs.org/package/grunt-pagespeed) | A Grunt\
    \ plugin to run Google PageSpeed Insights as part of CI. | Measure first |\n|\
    \ [grunt-perfbudget](https://github.com/tkadlec/grunt-perfbudget) | Grunt task\
    \ for performance budgeting. | Measure first/Setup baseline |\n| [grunt-phantomas](https://www.npmjs.org/package/grunt-phantomas)\
    \ | A Grunt task to produce `PhantomJS`-based web performance stats collector\
    \ and monitoring tool. | Measure first |\n| [grunt-uncss](https://github.com/addyosmani/grunt-uncss)\
    \ | A Grunt task for removing unused CSS from your projects. | Reducing file size\
    \ |\n| [grunt-usemin](https://github.com/yeoman/grunt-usemin) | A Grunt task that\
    \ replaces references to non-optimized scripts or style sheets into a set of HTML\
    \ files. | Reduce HTTP requests |\n| [SPOFCheck](https://github.com/senthilp/spofcheck)\
    \ | Can be used via `CLI` to detect SPOF-potential third-party scripts. | Remove\
    \ third-party monsters |\n\nLet's take some of the listed tasks above and apply\
    \ them to an example web page. The page includes a hero image, a link to the `jQuery`\
    \ library hosted on Google's CDN, a simple `jQuery` slideshow with previous and\
    \ next buttons, and some links to other JavaScript and CSS files. For comparison\
    \ purposes, I've created two versions of the page, one [prior to running Grunt](http://bbinto.me/lean-websites/crp-grunt/without/magic.html)\
    \ (titled “It's not magic”) and the other [after running Grunt](http://bbinto.me/lean-websites/crp-grunt/with/magic.html)\
    \ (titled “It's magic”).\n\nPrior to running `Grunt`, the slideshow images are\
    \ not optimized, and there are several individual CSS and JavaScript files that\
    \ aren't minified or concatenated. After running `Grunt`, the page looks the same,\
    \ but a lot has happened behind the scenes, as I'll detail below.\n\n### Executing\
    \ Grunt on the Example Page\n\n`Gruntfile.js` defines the tasks to be executed.\
    \ I've included several performance optimizing tools, such as a SPOF check that\
    \ assesses any third-party blocking scripts.\n\nThe `Gruntfile` I am using here\
    \ is a bit too big to list in this book; you can grab a copy of this file from\
    \ the code archive. To run `Grunt`, we just execute the `grunt` command on the\
    \ command line in the folder that contains the project.\n\nSo, what has been tested,\
    \ changed, and improved?\n\n*   The local CSS and JavaScript files have been minified\
    \ and concatenated (using `grunt-concat`, `grunt-uglify`, `grunt-cssmin`).\n*\
    \   The images have been optimized via `ImageMagick` (using `grunt-imagemin`).\n\
    *   The “next” and “previous” buttons have been combined into a single sprite\
    \ file (using `grunt-montage`).\n"
