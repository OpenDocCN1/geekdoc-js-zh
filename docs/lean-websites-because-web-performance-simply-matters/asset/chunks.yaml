  trans: "\n\n让我们先从几个可以通过捕获的数据回答的问题开始。请注意，以下示例使用 SQL 语句查询数据库。如果你不熟悉 SQL 查询，可以查看一些[课程](https://www.coursera.org/course/db)或[教程](https://www.udacity.com/course/viewer#!/c-cs253/l-48756013/m-48691560)，并回顾\
    \ Ilya Grigorik 提供的一些[HTTP Archive 查询](https://gist.github.com/igrigorik/5801492)来入门。\n\
    \n## 最大的图片有多大？\n\n运行以下查询以获取该问题的答案：\n\n```\nSELECT req.url, req.respSize, req.mimeType,\
    \ pages.url FROM requests\n↵ as req\nJOIN (SELECT url , pageid, rank FROM pages)\
    \ as pages\nON pages.pageid = req.pageid\nWHERE req.mimeType like 'image%'\nORDER\
    \ by req.respSize DESC\n```\n\n![发现使用的最大的图片](img/4-http-archive-query.png)\n\n\
    图 4.3. 发现使用的最大的图片\n\n## 哪个页面最慢？\n\n你可以通过运行以下查询发现最慢的页面，该查询位于图 4.4：\n\n```\nSELECT\
    \ url, renderStart\nFROM pages\nGROUP BY url\nORDER BY renderStart DESC\n```\n\
    \n![分析渲染开始时间](img/4-httparchive-cbc-renderstart.png)\n\n图 4.4. 分析渲染开始时间\n\n##\
    \ 哪些页面的请求数超过 200 次？\n\n让我们找到请求超过 200 次的页面，所示图 4.5：\n\n```\nSELECT url, reqTotal\n\
    FROM pages WHERE reqTotal > 200\nGROUP BY url\nORDER BY reqTotal DESC\n```\n\n\
    ![找到请求超过 200 次的页面](img/4-httparchive-cbc-counts.png)\n\n图 4.5. 找到请求超过 200 次的页面\n\
    \n查看此查询的结果表将帮助你识别瓶颈，并验证页面是否真的需要获取超过 200 个资源。\n\n## 创建你私有的 RUM 测试\n\n[boomerang.js](http://yahoo.github.io/boomerang/doc/)\
    \ 是一个可以帮助跟踪 RUM 数据的开源工具。下一节将通过几个简单的步骤概述你如何为你的网站设置 RUM。\n\n![Navigation Timing\
    \ API 的结构](img/4-rum-explained.png)\n\n图 4.6. [Navigation Timing API 的结构](https://www.igvita.com/slides/2012/html5devconf/#8)\n\
    \n作为复习，Navigation Timing API 提供了对页面交付给用户的整个过程中的不同事件的访问。这包括用户的连接事件、服务器事件，以及由浏览器执行的事件（在图\
    \ 4.6 中从左到右）。例如，我们可以直接测量服务器响应时间：\n\n```\nvar page = performance.timing,\nrt =\
    \ page.responseEnd - page.responseStart,\n\nconsole.log(rt); // server response\
    \ time\n```\n\n为了跟踪有关你用户的任何信息，JavaScript 代码需要包含在待测试的页面中。\n\n你可以通过创建一个 `beacon`\
    \ 来跟踪用户的性能数据，它会将 RUM 结果发送回你的服务器。beacon 是纯粹为了将性能数据传回服务器的请求。在 W3C [Beacon API](http://www.w3.org/TR/beacon/)\
    \ 可用之前，你需要自己创建一个 beacon。价值在于请求本身，而响应实际上并不重要；但为了方便发起请求，通常方便请求一个极小的图像（如 `beacon.gif`），并包含几个参数，并在你的\
    \ Web 服务器上记录日志。\n\n让我们亲自尝试一下。我将向你展示如何在我的个人网站上跟踪 RUM 数据。\n\n1.  首先，将 boomerang\
    \ 脚本放入你的页面中。理想情况下，将其放在底部，以避免阻塞任何页面资源。\n\n    下面的脚本显示了我如何使用 beacon 发送性能数据。我创建了一个透明的\
    \ 1x1px GIF，将其上传到 Web 服务器，并将 `beacon_url` 路径设置为其所在位置：\n\n    ```\n    <script\
    \ src=\"http://bbinto.me/lean-websites/chapter-4/rum/\n    ↵boomerang/boomerang.custom.min.js\"\
    \ type=\"text/javascript\">\n    ↵</script>\n    <script type=\"text/javascript\"\
    >\n         BOOMR.init({\n             beacon_url: \"http://bbinto.me/lean-websites/chapter-4/rum\n\
    \    ↵/boomerang/images/beacon.gif\"\n             });\n    </script>\n    ```\n\
    \n2.  包含脚本后，刷新页面。在浏览器的控制台中，你可以看到 boomerang 开始收集什么样的数据：\n\n    ![在控制台中查看 boomerang\
    \ 数据](img/4-rum-beacon.png)\n\n    图 4.7. 在控制台中查看 boomerang 数据\n\n3.  现在，简单的日志解析器可以扫描日志以提取数据。查看下方的日志文件条作为示例。`beacon.gif`\
    \ 列出了与我们在上面控制台中看到的相同的 boomerang 数据：\n\n    ```\n    99.231.246.80 - - [02/Dec/2014:05:47:38\
    \ -0700]\n    \"GET /lean-websites/chapter-4/rum/boomerang/images/beacon.gif?\n\
    \    rt.start=navigation&\n    rt.tstart=1417524445852&\n    rt.bstart=1417524447232&\n\
    \    rt.end=1417524447752&\n    t_resp=816&\n    t_page=1084&\n    t_done=1900&\n\
    \    r=http%3A%2F%2Fwww.bbinto.me%2F&\n    r2=&\n    t_other=boomerang%7C1%2Cboomr_fb%7C1380%2Ct_domloaded%7C1423&\n\
    \    bw=764973&\n    bw_err=41596.59&\n    lat=86&\n    lat_err=0.92&\n    bw_time=1417524459&\n\
    \    v=0.9.1361953770&\n    u=http%3A%2F%2Fwww.bbinto.me%2F HTTP/1.1\" 200 35\n\
    \    ↵ \"http://www.bbinto.me/\" \"Mozilla/5.0 (Macintosh; Intel Mac OS\n    ↵\
    \ X 10_10_1)\n    ```\n\n    从上述数据中，我们可以对我对 bbinto.me 的访问得出以下结论：\n\n    *   `t_done`:\
    \ 我感知的加载时间为 1084ms\n    *   `bw`: 我测量的带宽为 764973 字节/秒（或 747KB/s）\n    *   `lat`:\
    \ 我测量的延迟为 86ms\n\n    关于其余参数的更多信息，请查看[boomerang 页面](http://yahoo.github.io/boomerang/doc/howto.html)。\n\
    \n4.  现在我已经从日志提取了数据，可以将其导出到电子表格或数据库中查询，并用它创建图表。我决定将其保存为 CSV 表格。下面的截图高亮了我们在步骤 2\
    \ 中触发的相同数据集。\n\n5.  我在网站上保留了 beacon 两天以收集真实用户数据，到结束时我有 300 个数据点——真实用户的访问：\n\n\
    \    ![通过日志文件收集、导出为 CSV 并存储在电子表格中的 RUM 数据片段](img/4-rum-cbc-excel.png)\n\n    图\
    \ 4.8. 通过日志文件收集、导出为 CSV 并存储在电子表格中的 RUM 数据片段\n\n所示图 4.8 截图显示了我记录的内容：用户访问页面的精确时间（Date）、带宽（bw）、延迟（lat）、页面加载时间（t_done）以及相应的用户代理（UA）。此外，通过简单的电子表格函数，我确定了\
    \ RUM 加载时间、用户延迟和带宽的分布。以下三个指标对于理解用户访问你的网站的体验有用：\n\n页面加载时间：以下图表描述了 bbinto.me 以毫秒为单位的加载时间分布，检索自所有\
    \ `t_done` 数据点。你可以看到大多数用户的页面加载时间在 3 到 5 秒之间。一半访问者的页面在 5 秒内加载。95% 的访问者加载时间低于 19.1\
    \ 秒：\n\n    ![页面加载时间分布](img/4-rum-cbc.png)\n\n    图 4.9. 页面加载时间分布\n\n"
- fmt: "\n- **Latency**: latency was recorded by collecting `lat` values from the\
    \ beacon. Half of the visits have to deal with a latency around 166ms. 95% of\
    \ visitors had a latency of under 370ms (95th percentile):\n\n  ![Latency distribution](OEBPS/figures/4-rum-latency.png)\n\
    \n  Figure 4.10. Latency distribution\n\n- **Bandwidth**: another interesting\
    \ RUM experiment is to look at the bandwidth, listed under `bw`. As shown in the\
    \ example below, I aggregated all data points for `bw` from the spreadsheet and\
    \ filtered them based on specific ranges. The pie chart below shows the most common\
    \ Internet connections. Half of the visitors came to my site with a connection\
    \ between 512KB/s and 1.6MB/s:\n\n  ![Bandwidth distribution](OEBPS/figures/4-rum-bandwidth.png)\n\
    \n  Figure 4.11. Bandwidth distribution\n\n### Note: Boomerang's Methodology\n\
    \nPage load time is computed by first recording the time of the `onbeforeunload`\
    \ event, which is then stored in a cookie. This is followed by recording the time\
    \ of the `onload` event and subtracting that from the stored time in the cookie.\
    \ Subsequently, latency and bandwidth are measured by downloading fixed size images\
    \ from a server and measuring the time it took to download them. You can refer\
    \ to [more details of methodology](http://yahoo.github.io/boomerang/doc/methodology.html)\
    \ on the boomerang website.\n\nBy looking at these results, you'll notice that\
    \ I'm closer to understanding my actual, real users. For example, knowing their\
    \ average connection speed will help me decide if my audience arrives at my site\
    \ via high-speed connection or lower-speed connections. I can then cater for that\
    \ specific scenario—perhaps by serving fewer or smaller images, or avoiding specific\
    \ assets altogether.\n\n### Tip: Help with Getting Boomerang Set Up\n\nIf you\
    \ need additional help with setting up RUM, I suggest that you read up on [the\
    \ boomerang how-to docs](http://www.lognormal.com/boomerang/doc/howtos/) or use\
    \ [Captain Rum](https://github.com/bbinto/captain-rum), a simple script that I\
    \ created.\n\nRather than creating your own beacon solution, you could use the\
    \ [Beacon API](http://www.w3.org/TR/beacon/), introduced by the World Wide Web\
    \ Consortium (W3C)—though it's currently in working draft, and not supported by\
    \ IE or Safari as yet. Its intent is to make it easier for web developers to send\
    \ analytics or diagnostic information back to the server.\n\n### Warning: RUM\
    \ and High-traffic Sites\n\nIf your website receives a lot of traffic, you'll\
    \ encounter a huge amount of beacon data in your log files. Hence, parsing the\
    \ log files and extracting the data can be slow. Consider introducing some code\
    \ to use a lower sample rate, or just enable the code during specific times of\
    \ the day.\n\n### Set Up Alerts\n\nMonitoring your site with automated alerts—which\
    \ notify you if something unwanted happens to your website—is a useful technique\
    \ for avoiding surprises. There are several commercial products available, as\
    \ well as free tools.\n\nHere are some examples of basic alerts you can set up\
    \ for your website:\n\n- Get notified if your website is not available to your\
    \ visitors.\n- Get notified if any issues occur based on geographic or platform-specific\
    \ events.\n- Get notified if performance measurements reach a specific threshold,\
    \ such as page load times exceeding 10 seconds, or server response times exceeding\
    \ two seconds.\n\n#### Google Analytics\n\nIf you already use Google Analytics,\
    \ you may as well leverage its free custom alerts. While I mentioned that Analytics\
    \ only uses sampled data, and relies on the average measurements instead of the\
    \ median to calculate performance metrics, it is still a quick and easy alert\
    \ tool. Go to Admin -> Custom Alerts to create your [custom alert](https://www.igvita.com/2012/11/30/web-performance-anomaly-detection-with-google-analytics/),\
    \ as shown in [Figure 4.12](#ch04.html_ch4-ga \"Figure 4.12. Setting an alert\
    \ in Google Analytics\"):\n\n  ![Setting an alert in Google Analytics](OEBPS/figures/4-alerts-plt-google.png)\n\
    \n  Figure 4.12. Setting an alert in Google Analytics\n\n#### Pingdom\n\nThough\
    \ Pingdom is a commercial monitoring tool, it's also available in a [free limited\
    \ version](https://www.pingdom.com/free/). The free version might be enough if\
    \ you only want RUM reporting and alerts of website downtime. A great feature\
    \ of Pingdom is that it allows you to choose between “average” or “median” measurement.\n\
    \nThe following [Figure 4.13](#ch04.html_ch4-pingdom \"Figure 4.13. Setting a\
    \ downtime alert in Pingdom\") screenshot shows how to set up alerts to notify\
    \ you when your website is down:\n\n  ![Setting a downtime alert in Pingdom](OEBPS/figures/4-alerts-downtime.png)\n\
    \n  Figure 4.13. Setting a downtime alert in Pingdom\n\n#### CopperEgg\n\n[CopperEgg](http://copperegg.com/)\
    \ is one of many commercial tools that provides flexibility in setting up alerts,\
    \ RUM, and other measurements. The [Figure 4.14](#ch04.html_ch4-copperegg \"Figure\
    \ 4.14. Setting an alert in CopperEgg\") screenshot below shows an example of\
    \ how granular you can get when setting up alerts for specific performance metrics.\
    \ It's a handy suite of monitoring tools that will give you peace of mind.\n\n\
    \  ![Setting an alert in CopperEgg](OEBPS/figures/4-alerts-copperegg.png)\n\n\
    \  Figure 4.14. Setting an alert in CopperEgg\n\n## Set up a Performance Budget\n\
    \nBy setting a `performance budget`, you can ensure that a defined baseline in\
    \ values for various performance metrics should not be exceeded. For example,\
    \ this could mean setting target values for page size or the amount of HTTP requests\
    \ used on a page.\n\nFinding a budget that is realistic, measurable, and achievable\
    \ is a great start for a leaner website. It provides goals that the whole team\
    \ can focus on, and will help you answer questions like “What are we trying to\
    \ improve?” and “What will the measurement for success be?”\n\nBut where to start?\
    \ How do you set up a budget for your website?\n\nHere are some pointers to help\
    \ you set a budget and stick to it:\n\n- **Assess the standards of your competitors**:\
    \ your competitors' metrics can help you establish a performance baseline.\n-\
    \ **Create performance hypotheses to strengthen business metrics**: come up with\
    \ assumptions on how to make your website more successful by making it faster.\n\
    - **List and commit to your performance budget**: in order to stick to your budget,\
    \ you need to publish it, and commit to your performance metrics and thresholds.\n\
    \nLet's take a look at each of these in more detail.\n\n### Competitive Comparison\n\
    \n> “The wise learn many things from their enemies.” — Aristophanes\n\nOnce you\
    \ have your current site performance data, it can sometimes be difficult to determine\
    \ which results should be improved. One idea is to compare your performance results\
    \ with those of your competitors.\n\nWPT is a great resource for running competitive\
    \ analysis. Click the Visual Comparison tab when you first land on the WPT website.\
    \ It lets you add several different websites for comparison. Comparing your site\
    \ with a competitor's can give you a useful and tangible baseline for your website's\
    \ performance.\n\nFor example, let's assume you have a clothing retail website.\
    \ You'd probably want to make sure that users could browse your landing page faster\
    \ than a competing clothing retail site. That's where you can apply the WPT “Visual\
    \ Comparison” tool.\n\nFor now, let's call your site Website A, and the competitor's\
    \ site Website B.\n\n1. Go to WPT and click the Visual Comparison tab. Type in\
    \ your website and your competitor's website to retrieve the comparative performance\
    \ data and filmstrips, as shown in [Figure 4.15](#ch04.html_ch4-visual \"Figure\
    \ 4.15. Starting a visual comparison on WPT\").\n\n  ![Starting a visual comparison\
    \ on WPT](OEBPS/figures/4-visual-comparison.png)\n\n  Figure 4.15. Starting a\
    \ visual comparison on WPT\n"
