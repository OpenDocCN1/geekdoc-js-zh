  trans: "\n\n当 `HTTP/1.1` 在十年前引入时，延迟并不是一个令人担心的问题。然而，时代、技术和用户预期已经发生了变化。`HTTP/1.1`\
    \ 已不足以应对今天的挑战。现在的用户要求在不同设备和不同位置快速、即时地交付内容，这导致了更高的延迟，并要求对 HTTP 请求进行更好的处理。这些性能问题最终通过\
    \ `HTTP/2` 得到了解决。\n\n在 `HTTP/1.1` 中，只有客户端可以发起请求。即使服务器知道客户端需要某个资源，它也没有机制来通知客户端，必须等待接收客户端对该资源的请求。`HTTP/2.0`\
    \ 承诺让 HTTP 请求更加[高效](https://www.mnot.net/blog/2014/01/30/http2_expectations)，减少对为了减少\
    \ HTTP 请求而采用通变技术的需求，从而降低延迟。\n\n`HTTP/2` 优于 `HTTP/1.1` 的主要优势之一是它允许许多并发 HTTP 请求在单个\
    \ TCP 连接上运行。如果没有持久连接（使用 `keep-alive`），正如第 3 章所讨论的，手手将由 `HTTP/1.1` 强制执行，导致延迟和阻塞。虽然\
    \ `keep-alive` 的想法是保持 TCP 连接开启，但 `HTTP/2` 带来了更多的改进。它带有默认 HTTP 头部压缩，而 `HTTP/1.1`\
    \ 使用的是可选压缩。此外，通过 `HTTP/2`，服务器可以主动向客户端发送可能需要的资源，这被称为**服务器推送 (server push)**。\n\n\
    尽管 `HTTP/2`是一项巨大的改进，但请注意，在不久的将来使用 `HTTP/2` 仍然需要你做好功课。该协议不会魔法地消除渲染阻塞和同步第三方脚本，也不会为你压缩脚本。为了让这一新协议发挥作用，仍然需要采用技术。\n\
    \n然而，通过 `HTTP/2`，许多小资源可以并行复用，诸如资源合并——图片精灵和合并——等技术[不再需要](http://chimera.labs.oreilly.com/books/1230000000545/ch13.html#_removing_1_x_optimizations)来提高性能。\n\
    \n### Note：关于 SPDY？\n\n[SPDY](http://www.chromium.org/spdy/spdy-whitepaper)（读作\
    \ SPeeDY）在 `HTTP/2` 之前引入，它是 `HTTP/2` 大多数特性的动力——因此通常被视为其前身。2015 年 2 月，SPDY 的发明者\
    \ Google [正式向 SPDY 作别](http://blog.chromium.org/2015/02/hello-http2-goodbye-spdy-http-is_9.html)\
    \ 并欢迎 `HTTP/2` 进入世界。\n\n## Gzip 压缩\n\n`Gzip` 是一个非常高效的压缩程序，可以轻松地在你的服务器上开启，以减少几毫秒的加载时间。你的服务器将在文件发送给用户之前使用\
    \ `zip` 进行压缩。我强烈建议你在服务器上启用 `Gzip` 压缩，这是一个非常快速且简单的性能提升。\n\n### Warning：何时使用 Gzip\n\
    \n`Gzip` 对于未压缩的、基于文本的格式（如 `HTML`、`XML`、`JSON` 和 `CSS` 文件最有意义。对于已经压缩的内容类型（PDF 和图像），不应该进行\
    \ gzip 处理，因为它们的文件大小实际上可能会[增大](https://developer.yahoo.com/performance/rules.html#gzip)。\n\
    \n但如何知道 `Gzip` 已启用？你可以打开浏览器的开发者工具并检查响应头，如图 9.3 所示，或者使用 [HTTP 压缩 test](http://checkgzipcompression.com)\
    \ 等工具，如图 9.4 所示：\n\n![在 Firefox 开发者工具中检查主 HTML 页面响应头](img/9-gzip-header.png)\n\
    \n图 9.3. 在 Firefox 开发者工具中检查主 HTML 页面响应头\n\n![使用 HTTP 压缩测试检查 Gzip 压缩状态](img/9-gzip-test.png)\n\
    \n图 9.4. 使用 HTTP 压缩测试检查 Gzip 压缩状态\n\n所有现代浏览器都支持 `Gzip` 压缩，因此我们只需要确保它在 Web 服务器配置文件中启用。某些\
    \ Web 服务器已经启用了 `Gzip`。`HTML5` Boilerplate 提供了如何在大多数常用 Web 服务器上启用 `Gzip` 的[详细说明](https://github.com/h5bp/server-configs)。\n\
    \n如果你不拥有 Web 服务器，可以通过 Apache 服务器的 `.htaccess` 文件启用 `Gzip`，或者使用不同 Web 服务器的其他等效文件（例如\
    \ IIS 的 `web.config`）。\n\n让我们看看如何在 Apache 上启用它：\n\n```\n<ifModule mod_gzip.c>\n\
    \    mod_gzip_on Yes\n    mod_gzip_dechunk Yes\n    mod_gzip_item_include file\
    \ .(html?|txt|css|js|php|pl)$\n    mod_gzip_item_include handler ^cgi-script$\n\
    \    mod_gzip_item_include mime ^application/x-javascript.*\n    mod_gzip_item_exclude\
    \ mime ^image/.*\n    mod_gzip_item_exclude rspheader ^Content-Encoding:.*gzip.*\n\
    </ifModule>\n```\n\n如果你想比较网站开启 Gzip 和未开启的性能，可以在 Apache 的 `.htaccess` 文件中设置以下行来禁用\
    \ Gzip：\n\n```\nSetEnv gzip 1\n```\n\n图 9.5 显示了我的网站在开启和未开启 Gzip 时的 WPT 结果：\n\n\
    ![bbinto.me 开启和未开启 Gzip 的 WPT 对比](img/9-gzip-bbinto.png)\n\n图 9.5. bbinto.me 开启和未开启\
    \ Gzip 的[WPT 对比](http://www.webpagetest.org/video/compare.php?tests=141011_G7_JD1,141011_7E_K5J)\n\
    \n你可以看到 gzip 版本和非 gzip 版本之间性能的明显差异。我开启了 Gzip 的网站加载快了近一秒。我的速度索引（speed index）从 3140\
    \ 提高到 2100，渲染开始时间（start to render time）从 3.05s 提高到 1.94s。Gzip 可以是一个简单且快速的性能胜利。\n\
    \n## 缓存\n\n我们在第 5 章 中简要地提到过缓存，但让我们深入探讨这个主题，因为缓存可以成为一种真正的性能增强器。\n\n在详细介绍缓存如何提高性能之前，让我们先看看如何获取更多关于资源及其当前缓存策略的信息。\n\
    \n在图 9.6 中，你可以看到，当我访问 google.ca 时，我的浏览器获取的某些图像来自 Google 搜索着陆页的浏览器缓存。这并不意外，因为我一天中会多次使用\
    \ Google：\n\n![在使用开发者工具评估 google.ca 的缓存](img/9-cache-network-google.png)\n\n图\
    \ 9.6. 使用开发者工具评估 google.ca 的缓存\n\n仔细观察，你会发现 `nav_logo195.png` 是一张精灵图，如图 9.7 所示。Google\
    \ 为这张特定的图片设置很长的缓存时间是合理的，因为 logo 不会经常变化：\n\n![google.ca 上的精灵图](img/9-cache-sprite-google.png)\n\
    \n图 9.7. google.ca 上的精灵图\n\n现在，让我们讨论如何通过缓存来提高性能。基本思想是尽可能避免不必要的 HTTP 请求，通过在浏览器中存储可以重用的某些资源。每个浏览器都包含缓存，但需要关于如何以及何时使用它的指令。你可以通过使用\
    \ `Cache-Control` 头部来设置该逻辑，例如何时请求更更新或更新的资源版本，以及何时不使用缓存中的版本。\n\n"
