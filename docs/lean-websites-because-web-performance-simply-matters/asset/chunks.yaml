    \ influence as a web developer. With RUM, you can get a better sense of what your\
    \ actual users are experiencing in this regard. My own RUM experiences have revealed\
    \ surprising data on how many people have lower or higher bandwidth than I originally\
    \ expected.\n\nSo, how does RUM work? In order to perform real user monitoring,\
    \ you need access to the user's browser data. There are two main APIs that help\
    \ us collect and evaluate performance data coming right from our user's browser.\n\
    \n#### Navigation Timing\n\nThe **Navigation Timing API**, introduced by the W3C\
    \ Web Performance Working Group in 2012, allows developers to inquire about the\
    \ page's performance via JavaScript. It's a great way to understand the end-to-end\
    \ latency that your user experiences. The good news is that it's supported by\
    \ most browsers.\n\nThe following graphic illustrates all the events that can\
    \ be measured by JavaScript through the `PerformanceTiming` interface:\n\n![W3C\
    \ processing model for the Navigation Timing API](OEBPS/figures/3-navtiming.png)\n\
    \nFigure 3.15. [W3C processing model for the Navigation Timing API](http://www.w3.org/TR/navigation-timing/#processing-model)\n\
    \nAll of the above commands can be accessed via JavaScript to retrieve timing\
    \ information for your page. Measuring the time of the events helps you assess\
    \ the different phases of loading a page.\n\nFor example, imagine you want to\
    \ retrieve the total page load time (PLT) via JavaScript. The following example\
    \ does exactly that:\n\n```\nvar page = performance.timing,\n    plt = page.loadEventStart\
    \ - page.navigationStart,\n\nconsole.log(plt); // 34986, PLT output for specific\
    \ user in ms;\n```\n\nNavigation timing only covers data concerning the entire\
    \ page. So using this API might reveal that your page is slow, but what do you\
    \ do then? To actually identify and diagnose performance issues with it, you need\
    \ to look closer at each individual resource.\n\nThat's where the Resource Timing\
    \ API comes in handy. It makes it possible to examine performance data for specific\
    \ resources.\n\n#### Resource Timing\n\nThe **Resource Timing API** is a bit newer\
    \ and not as well supported as the Navigation Timing API. With the Resource Timing\
    \ API, you can dig deeper into understanding the behaviour of individual resources.\
    \ Imagine you put an image on your page but you aren't sure how it performs in\
    \ the real world. You want to know the TTFB data for this image.\n\nAs an example,\
    \ let's pick the [sitepoint.com logo](http://www.sitepoint.com/wp-content/themes/sitepoint/assets/svg/sitepoint.svg):\n\
    \n```\nvar img = window.performance.getEntriesByName(\"http://www.sitepoint.\n\
    ↵com/wp-content/themes/sitepoint/assets/svg/sitepoint.svg\")[0];\nvar ttfb = parseInt(img.responseStart\
    \ - img.startTime),\ntotal = parseInt(img.responseEnd - img.startTime);\nconsole.log(ttfb);\
    \ // output 85 (in ms)\nconsole.log(total); // output 98 (in ms)\n\n// you could\
    \ now log this somewhere in a database \n//or send an image beacon to your server\n\
    logPerformanceData('main logo', ttfb, total);\n```\n\nThe logging would reveal\
    \ how this image performs to users who viewed the image.\n\nThe following table\
    \ shows the current browser support for the mentioned APIs:\n\n| Browser | Navigation\
    \ Timing API | Resource Timing API |\n\n| --- | --- | --- |\n\n| Chrome | ✔ |\
    \ ✔ |\n\n| Opera | ✔ | ✔ |\n\n| IE >8 | ✔ | ✔ |\n\n| Safari >7 | ✔ |   |\n\n|\
    \ iOS Safari >7 | ✔ |   |\n\n| Firefox >30 | ✔ |   |\n\n| Android >4.3 | ✔ | ✔\
    \ |\n\n*Browser support for Resource Timing API August 2014, source: caniuse.com*\n\
    \n#### Free RUM Tools\n\n##### Boomerang\n\n[Boomerang](http://yahoo.github.io/boomerang/doc)\
    \ is an open source RUM tool that you are free to use under the GNU license.\n\
    \nBoomerang is based on the Navigation and Resource Timing APIs, collecting all\
    \ information needed for assessing the performance and user experience of your\
    \ site. For example, it can do anything that I've mentioned about the timing APIs\
    \ above. You can examine such things as how long the DNS lookup took for a particular\
    \ user, or what issues arose for a particular user demographic.\n\nYou can process\
    \ and funnel RUM data into a beacon parsed by a script from your web server log\
    \ files. This could then be put into a database or any other data storage. In\
    \ Chapter 4, I'll show you how to analyze RUM data via boomerang.\n\n##### Google\
    \ Analytics\n\nMost performance measurements are recorded in median averages rather\
    \ than mean. [Google Analytics](http://www.google.com/analytics/) (GA), however,\
    \ is measured in mean. This approach might not seem too well suited to your goal,\
    \ as it could also include outliers that skew your results. In addition, Google's\
    \ RUM sample rate is low, potentially not providing you with accurate real measurements.\n\
    \nHowever, if you already use GA and don't want to pay for a RUM service, or don't\
    \ want to build your own RUM tracking tool, it's a great place to start.\n\n###\
    \ Tip: Mean, Median or 95th Percentile?\n\n**Arithmetic Mean (average):** take\
    \ all values in your data set, and divide it by the total number of data points\
    \ you summed up. Outliers are included in the calculation and this could result\
    \ in skewing your data by pulling you away from the centre. Be aware that calculating\
    \ outliers might change the entire meaning of your numbers and could cause false\
    \ interpretations.\n\n**Median:** the most common measurement used in web performance.\
    \ Line up each value in a selected data set in ascending order, and the single\
    \ value in the middle of those values is your median. This approach gives you\
    \ a more accurate representation of the load time of your website, seen by actual\
    \ visitors.\n\n**95th percentile:** In order to measure performance, some also\
    \ use the high percentiles like 80th, 90th or [95th percentile](http://blog.catchpoint.com/2010/09/02/web_performance_metrics_best/)\
    \ instead of the median (50th percentile). For example, if the 95th percentile\
    \ of a response time is 1000ms, that means that 5% of the collected data points\
    \ are slower than 1000ms and 95% are faster than 1000ms.\n\n##### A/B Testing\n\
    \nFor the purposes of RUM, you can use A/B testing to check if an enhancement\
    \ you made to your website actually ends up enhancing your users' experience of\
    \ the site. With some real data for both versions of the site, you can identify\
    \ which is more successful and act accordingly.\n\n### Comparing RUM and Synthetic\n\
    \nNow that you've learned about synthetic testing and RUM, you might wonder whether\
    \ one technique is better than the other. It really depends on the question you\
    \ want to answer.\n\n|   | Synthetic | RUM |\n\n| --- | --- | --- |\n\n| **Who?**\
    \ | You run the test | The user runs the test |\n\n| **What?** | Measures the\
    \ experience of one selected configuration (more like a lab environment) | Measures\
    \ experience of “actual user” (casts a wide net,\L gives peace of mind), and you\
    \ get to know your user better |\n\n| **Why?** | Establishes a baseline performance\
    \ level | Get concrete information about users' latency, bandwidth, page load\
    \ time, etc. |\n\n| **How?** | Tools: private/public WebPagetest (API), PageSpeed\
    \ Insights (API), and commercial products | Tools: \LBoomerang.js, Google Analytics,\
    \ and commercial products |\n\nHaving a combination of synthetic and real user\
    \ data will help you cover your entire measurement spectrum.\n\nSeveral analogies\
    \ have been made to compare the approaches of RUM and synthetic measurement. One\
    \ that I really like is the following: [RUM is the floodlight and synthetic is\
    \ the flashlight](https://blogs.akamai.com/2012/12/situational-performance-measurement-with-a-splash-of-rum.html).\
    \ With synthetic testing, the flashlight, you focus on one specific thing. Anything\
    \ outside of that, you won't see. The floodlight, corresponding to RUM, reveals\
    \ all kinds of different findings.\n\n## Cool Down\n\nLet's review some of the\
    \ takeaways from this chapter:\n\n*   Measurement data is essential for tracking\
    \ progress."
