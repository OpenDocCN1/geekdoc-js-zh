  trans: "\n加载时间会有很大差异，这取决于几个你作为 Web 开发人员无法影响的外部因素。通过 `RUM`，你可以更好地感知实际用户在这方面的体验。我自己的\
    \ `RUM` 经验揭示了许多令人惊讶的数据，关于有多少人的带宽比我最初预期的要低，或要高。\n\n那么，`RUM` 是如何工作的呢？为了执行真实用户监控，你需要访问用户的浏览器数据。有两个主要的\
    \ API 帮助我们收集和评估直接来自用户浏览器的性能数据。\n\n## 导航时序 (Navigation Timing)\n\n`Navigation Timing\
    \ API` 由 W3C Web 性能工作组于 2012 年引入，允许开发者通过 `JavaScript` 查询页面性能。这是理解用户所经历的端到端延迟的极佳方法。好消息是，大多数浏览器都支持它。\n\
    \n下面的图插说明了 `JavaScript` 通过 `PerformanceTiming` 接口测量的所有事件：\n\n![Navigation Timing\
    \ API 的 W3C 处理模型](img/3-navtiming.png)\n\n图 3.15. [Navigation Timing API 的 W3C\
    \ 处理模型](http://www.w3.org/TR/navigation-timing/#processing-model)\n\n以上所有命令都可以通过\
    \ `JavaScript` 访问，以检索你页面的计时信息。测量事件的时间有助于你评估加载页的不同阶段。\n\n例如，假设你想通过 `JavaScript`\
    \ 获取总页面加载时间 (plt)。下面的示例恰恰演示了这一点：\n\n```\nvar page = performance.timing,\n    plt\
    \ = page.loadEventStart - page.navigationStart,\n\nconsole.log(plt); // 34986,\
    \ 特定用户的 PLT 输出，单位为毫秒；\n```\n\n导航时序仅涵盖关于整个页面的数据。因此，使用此 API 可能会发现你的页面很慢，但你该怎么办呢？为了实际识别并诊断性能问题，你需要更仔细地观察每一个单独的资源。\n\
    \n这就是 `Resource Timing API` 派上用场的地方。它使得检查特定性能数据成为可能。\n\n## 资源时序 (Resource Timing)\n\
    \n`Resource Timing API` 较新，支持程度没有 `Navigation Timing API` 那么。通过 `Resource Timing\
    \ API`，你可以更深入地理解单个资源的行为。假设你在页面上放了一张图片，但不确定它在真实世界中的表现如何。你想知道这张图片的 TTFB（首次字节时间）数据。\n\
    \n作为一个例子，让我们选取 [sitepoint.com 的 logo](http://www.sitepoint.com/wp-content/themes/sitepoint/assets/svg/sitepoint.svg)：\n\
    \n```\nvar img = window.performance.getEntriesByName(\"http://www.sitepoint.\n\
    ↵com/wp-content/themes/sitepoint/assets/svg/sitepoint.svg\")[0];\nvar ttfb = parseInt(img.responseStart\
    \ - img.startTime),\ntotal = parseInt(img.responseEnd - img.startTime);\nconsole.log(ttfb);\
    \ // 输出 85（毫秒）\nconsole.log(total); // 输出 98（毫秒）\n\n// 你现在可以将此数据记录在数据库的某处 \n//\
    \ 或者向你的服务器发送一个图片信标\nlogPerformanceData('main logo', ttfb, total);\n```\n\n日志将揭示这张图片对于查看该图片的用户表现如何。\n\
    \n下表显示了上述 API 的当前浏览器支持情况：\n\n| 浏览器 | Navigation Timing API | Resource Timing API\
    \ |\n| --- | --- | --- |\n| Chrome | ✔ | ✔ |\n| Opera | ✔ | ✔ |\n| IE >8 | ✔ |\
    \ ✔ |\n| Safari >7 | ✔ |  |\n| iOS Safari >7 | ✔ |  |\n| Firefox >30 | ✔ |  |\n\
    | Android >4.3 | ✔ | ✔ |\n\n*Resource Timing API 的浏览器支持情况，2014 年 8 月，来源：caniuse.com*\n\
    \n## 免费 RUM 工具\n\n### Boomerang\n\n[Boomerang](http://yahoo.github.io/boomerang/doc)\
    \ 是一个开源 RUM 工具，你可以在 GNU 许可证下免费使用。\n\nBoomerang 基于 `Navigation` 和 `Resource Timing\
    \ APIs`，收集评估你网站性能和用户所需的所有信息。例如，它可以完成我上面提到的关于时序 API 的任何操作。你可以检查诸此类项，例如特定用户的 DNS\
    \ 查询花费了多长时间，或者特定用户群体出现了哪些问题。\n\n你可以处理 RUM 数据并将其汇聚到由你的 Web 服务器日志文件脚本解析的信标（beacon）中。然后将其放入数据库或任何其他数据存储中。在第\
    \ 4 章中，我将向你展示如何通过 boomerang 分析 RUM 数据。\n\n### Google Analytics\n\n大多数性能测量记录为中位数平均值而不是平均数。然而，[Google\
    \ Analytics](http://www.google.com/analytics/) (GA) 是按平均数衡量的。这种方法看起来并不非常适合你的目标，因为它可能包含偏偏你结果的离群值。此外，Google\
    \ 的 RUM 采样率较低，可能无法为你提供准确的真实测量值。\n\n但是，如果你已经在使用 GA 且不想为 RUM 服务付费，或者不想构建自己的 RUM\
    \ 跟踪工具，它是一个极佳的起点。\n\n### 提示：平均数、中位数还是第 95 分位数？\n\n**算术平均值 (average)：** 取你数据集中所有的值，并除以你总和的数据点总数。离群值被包含在计算中，这可能导致数据偏斜，使你偏离中心。请注意，计算离群值可能会改变数字的整体含义，并导致错误的解释。\n\
    \n**中位数 (Median)：** Web 性能中最常用的测量方法。将选定数据集中的每个值按顺序排列，这些值中间的单一值就是你的中位数。这种方法能更准确地代表实际访问者所看到的网站网站加载时间。\n\
    \n**第 95 分位数 (95th percentile)：** 为了衡量性能，有些人也使用高分位数，如第 80、第 90 或 [第 95 分位数](http://blog.catchpoint.com/2010/09/02/web_performance_metrics_best/)而不是中位数（第\
    \ 50 分位数）。例如，如果响应时间的第 95 分位数是 1000ms，这意味着 5% 的收集数据点慢于 1000ms，而 95% 快于 1000ms。\n\
    \n### A/B 测试\n\n为了 RUM 的目的，你可以使用 A/B 测试来检查对网站进行的改进是否最终提升了用户的体验。\n\n## 比较 RUM 和同步测试\n\
    \n既然你已经了解了同步测试和 RUM，你可能会疑问哪种方法更好。这实际上取决于你想回答的问题。\n\n| | 同步测试 (Synthetic) | RUM\
    \ |\n| --- | --- | --- |\n| **谁执行？** | 你运行测试 | 用户运行测试 |\n| **什么？** | 测量特定配置的体验（更像实验室环境）\
    \ | 测量“实际用户”的体验（撒大网，让人放心），让你更了解用户 |\n| **为什么？** | 建立基准性能水平 | 获取延迟、带宽、页面加载时间等具体信息\
    \ |\n| **如何？** | 工具：私有/公共 WebPagetest (API)、PageSpeed Insights (API) 以及商业产品 |\
    \ 工具：Boomerang、Google Analytics 以及商业产品 |\n\n结合使用真实用户数据将帮助你覆盖整个测量频谱。\n\n人们使用了多种比喻来比较\
    \ RUM 和同步测量的方法。我很喜欢的一个是：[RUM 是泛光灯而同步测试是手电筒](https://blogs.akamai.com/2012/12/situational-performance-measurement-with-a-splash-of-rum)。对于同步测试，手电筒，你关注的是一个特定的点。之外的任何地方都看不见。对应\
    \ RUM 的泛光灯会揭示各种不同的发现。\n\n## 结语\n\n让我们回顾本章的一些要点：\n\n* 测量数据对于跟踪进度至关重要。\n\n"
