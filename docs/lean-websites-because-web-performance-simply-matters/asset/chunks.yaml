    \n### WPT API and PageSpeed Insights API\n\nInstead of using PhantomJS as your\
    \ browser to test a website for performance, you can also query performance APIs\
    \ in the cloud. As noted in [Chapter 3](#ch03.html \"Chapter 3Measuring & Monitoring\
    \ Performance\"), PageSpeed Insights and WPT both offer APIs. You can use these\
    \ APIs to integrate performance tests into your deployment process.\n\nLet's start\
    \ with the WPT API, to illustrate how it can be used to detect bad performance\
    \ decisions without us needing to analyze anything manually in a browser window.\n\
    \nMarcel Duran, a Google Engineer, has built a [plugin for the WPT API](https://github.com/marcelduran/webpagetest-api/wiki/Test-Specs)\
    \ to work with continuous integration tools.\n\nBy providing Duran's WPT API wrapper\
    \ with a specs.json file, you can specify how to run a performance test, and when\
    \ the test should pass or fail. Let's check out some example content for specs.json:"
