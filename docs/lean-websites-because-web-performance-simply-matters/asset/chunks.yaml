    动画是基于重流（reflows）的，执行动画的速度越快，触发的速度就越快，因此完成得越快。在 JavaScript 中创建动画，你通常使用 `setTimeout`
    或 `setInterval` 函数。


    **帧率**是设备在屏幕上产生连续图像的速率。帧率越低，用户越容易看到“卡顿”（janky）的体验；相反，帧率越高，动画或滚动的体验就越流畅。每秒 60 帧（fps）被用作大多数屏幕的标准，因为它与它们的刷新率（60Hz）相匹配。


    你动画的流畅度取决于其帧率。为了给用户提供流畅的体验，请确保帧率保持在 60fps。否则，你的用户可能会觉得动画很生硬，尤其是在快速向上或向下滚动时。帧率越高，网站给用户的响应感觉越灵敏。


    ### `requestAnimationFrame()`


    `requestAnimationFrame()` 是一个原生 API，可以在浏览器中执行任何类型的动画——涉及 DOM 元素、CSS、canvas、WebGL
    或其他内容。它应该优于使用 `setInterval()` 或 `setTimeout()`。


    `requestAnimationFrame()` 与 `setInterval()` 或 `setTimeout()` 的区别在于，你告诉浏览器在下一个可用机会绘制动画，而不是基于预定义的时间间隔（后者可能会占用更多的处理时间和电量）。例如，`setTimeout()`
    只在它想要刷新时刷新屏幕，而不是在计算机能够刷新时刷新，而且它不在乎浏览器中发生了什么其他事情——例如另一个浏览器标签页处于激活状态。


    `requestAnimationFrame()` 将所有动画分组到单个浏览器重绘中，从而减少了 CPU 周期。此外，如果你切换到新标签页，浏览器会限制动画，这样你访问其他页面时就不会被动画减慢浏览器。


    如何优化你的页面以避免重绘和重流，并让动画感觉不“生硬”或“卡顿”？


    你无法真正移除所有的重绘和重流，但你可以尝试尽量减少它们的发生。以下是一些关于如何[优化](https://dev.opera.com/articles/efficient-javascript/?page=3#reflow)它们的技巧：


    * 不要使用 `setInterval()` 或 `setTimeout()` 来制作动画，请使用 `requestAnimationFrame()`。

    * 避免不一致的帧率，因为这与糟糕的用户体验相关。要么使用 60fps，或者如果无法实现，请统一使用 30fps。`requestAnimationFrame()`
    可以限制动画，特别是当系统无法处理屏幕刷新率的渲染时。与每秒丢失某些帧的 60Hz 相比，一致的 30Hz 在我们眼里感觉更好。

    * 检查你的 `onScroll()` 处理器。这个事件处理器在滚动时可能会导致严重问题。通常，在 JavaScript 事件处理程序中添加过多的内容会给动画带来挑战，尤其是在滚动时。

    * 沉重的 CSS 动画或投影、模糊、线性渐变，以及大尺寸的固定背景图片，都会减慢渲染。

    * 在位置为 `fixed` 或 `absolute` 的元素上使用动画。它们不会影响其他元素的布局，从而减少了重流可能触发的级联效应。


    如果你想深入研究如何优化 JavaScript，我强烈推荐 Nicholas C. Zakas 编写的 [*High Performance JavaScript*](http://shop.oreilly.com/product/9780596802806.do)。


    ## 第三方脚本


    [最近的调查](http://bigqueri.es/t/what-is-the-distribution-of-1st-party-vs-3rd-party-resources/100/3)
    显示，**第三方内容**的占比正在增长。越来越多的站点在使用未托管在自身域名上的代码和资产。2011 年，网站 32% 的内容来自第三方；到 2013 年，这一数字已上升到
    38%。第三方脚本很有用，但如果实现不当，它们的引入会对性能产生重大影响。


    > “从严格意义上说，任何由非网站提供者之外的组织提供给客户端的内容都被视为第三方。” ― Ben Vinegar，*[Third-Party Script](http://www.manning.com/vinegar/)*
    的作者。


    ### 第三方脚本的类型


    第三方内容有几种不同的类别：


    * **广告**：任何提供 JavaScript 以供包含在你的页面中的广告网络或服务。

    * **追踪与分析**：这包括如 Google Analytics 和 Chartbeat 等追踪产品。

    * **社交媒体**：任何社交媒体脚本，例如 Facebook、LinkedIn、Twitter 和 Google+ 提供的脚本。

    * **库和框架**：例如 jQuery、YUI、Twitter Bootstrap，或通过其外部主机包含在页面上的任何辅助工具。


    如果你在一家拥有业务智能、分析或营销部门的公司工作，那么你很有可能被要求包含任何可以帮助衡量公司成功的东西。没有任何一种社交媒体或追踪工具是营销人员不想尝试的。社交媒体、广告和追踪脚本对于营销人员以及想要更好地了解其客户或寻找其他收入来源的公司来说，是巨大的诱惑。另一方面，在你原有内容之上添加任何外部内容（尤其是
    JavaScript）都会增加你页面的权重和加载时间。


    然而，你的准则应该是：使用第三方脚本所获得的价值必须大于它对性能的损害。


    ### 内容过载


    查看下方的饼图，它分析了 [Wired.com](http://wired.com)。不难发现，提供的很大一部分内容并非来自 Wired.com：


    ![Wired.com 按域名划分的内容](img/6-wired-content-breakdown.png)


    图 6.2. Wired.com 按域名划分的内容


    考虑到每个额外的外部 HTTP 请求都会产生另一次 DNS 查询，这可能会导致严重的延迟问题。


    ### 注意：Ghostery


    [Ghostery](https://www.ghostery.com/en/) 是一个浏览器扩展程序，列出页面上使用的所有第三方脚本。它可以让你快速了解第三方内容为页面加载时间增加了多少。


    ### 为最坏的情况做准备：SPOF


    你的网站可能发生的最破坏性的事情之一是第三方提供商故障，且该提供者的脚本包含方式影响了关键渲染路径。这种最坏的情况有一个名字：**单点故障**（SPOF）。SPOF
    描述了一个整个系统无法执行的事件。引用 [Wikipedia](http://en.wikipedia.org/wiki/Single_point_of_failure)：


    > 单点故障 (SPOF) 是系统中的一部分，如果它故障，将停止整个系统的运行。对于任何以高可用性或可靠性为目标的系统（无论是业务实践、软件应用还是工业系统），SPOF
    都是不受希望的。


    #### 标签


    我们之前讨论过关键渲染路径以及 JavaScript 如何阻塞渲染。


    ```

    <script src="http://example.com/3rdparty-script.js"></script>

    ```


    如果 example.com 宕机，该标签之后的所有内容都将被阻塞渲染。


    #### 避免 SPOF


    在本节中，我将描述几种在页面上包含脚本并避免 SPOF 事件风险的方法。


    ##### 动态方式


    你听说过动态脚本标签吗？它被高性能 Facebook 按钮的制定者 Stoyan Stefanov 和 boomerang.js 的创始人 Philip Tellis
    大力推广。

