  trans: "\n\n# 在创建缓存策略时，将你的网站结构化为逻辑目录是非常有益的。请检查你的资源，并根据它们的性质将它们拆分为多个目录。例如，很少更改的品牌文件和\
    \ logo 文件可以存储在一个需要长时间缓存的资源文件夹中，而动态内容可以存储在具有较短缓存时间的独立文件夹中。\n\n让我们来看一个例子。我的网站是一个\
    \ WordPress 博客，我不打算经常频繁地更改它的设计。因此，为我的主题文件设置较长时间的缓存时间是完全合理的。此外，我尝试根据我的日程，每两个到三个月发布新的博客文章来更新我的网站。所以，我想确保在设置\
    \ HTML 文件的缓存策略时，将这一写作计划考虑在内。为了稳妥起见，让我们将其设置为一个月。我还决定为我上传的所有内容（如图像、PDF 和文本文件）设置一年的缓存值，假设这些内容在被我上传后很少更改。\n\
    \n由于我每个文件夹都有不同的过期时间，我需要为每个文件夹创建一个单独的 `.htaccess` 文件。\n\n让我们根据我提议的缓存目标更新 `.htaccess`\
    \ 文件。\n\n* `/var/www/htdocs/bbinto.me/.htaccess`:\n```\n<ifModule mod_headers.c>\n\
    \    ExpiresActive On\n    # Expires after 1 month\n    <filesMatch \".(html)$\"\
    >\n    Header set Cache-Control \"max-age=2592000\"\n    </filesMatch>\n</ifModule>\n\
    ```\n\n* `/var/www/htdocs/bbinto.me/wp-content/themes/matheson/.htaccess`:\n```\n\
    <ifModule mod_headers.c>\n    ExpiresActive On\n    # Expires after 6 months\n\
    \    Header set Cache-Control \"max-age=15552000\"\n</ifModule>\n```\n\n* `/var/www/htdocs/bbinto.me/wp-content/uploads/.htaccess`:\n\
    ```\n<ifModule mod_headers.c>\n    ExpiresActive On\n    # Expires after 1 year\n\
    \    Header set Cache-Control \"max-age=31104000\"\n</ifModule>\n```\n\n如果你有直接访问\
    \ Web 服务器配置文件的权限（在 Apache 上，为 `httpd.conf`），你可以使用 `<Directory>` 在一个配置文件中定义所有文件夹，而不是将单独的\
    \ `.htaccess` 文件分别放入每个目录：\n\n```\n# Expires after 6 months\n<Directory \"/var/www/htdocs/bbinto.me/wp-content/themes/matheson\"\
    >\n    Header set Cache-Control \"max-age=15552000\"\n</Directory>\n\n# Expires\
    \ after 1 month\n<filesMatch \".(html)$\">\nHeader set Cache-Control \"max-age=2592000\"\
    \n</filesMatch>\n\n# Expires after 1 year\n<Directory \"/var/www/htdocs/bbinto.me/wp-content/uploads/\"\
    >\n    Header set Cache-Control \"max-age=31104000\"\n</Directory>\n```\n\n如上所示，我对文件和文件夹应用了一些简单的规则，你也可以包含正则表达式来包含或排除某些内容类型或目录。\n\
    \n在完成缓存策略的设置后，我通过 WPT 运行了在[没有](http://www.webpagetest.org/result/141019_C0_MWG/1/details/cached/)和[启用](http://www.webpagetest.org/result/141019_TB_MY7/1/details/cached/)缓存策略后的站点。对于这个例子，我只比较了\
    \ Repeat 视图的结果，因为那反映了缓存设置的使用情况。\n\n| | 无缓存 | 使用缓存 | 节省比例 |\n| --- | --- | ---\
    \ | --- |\n| **加载时间** | 6.629s | 2.485s | 62% |\n| **开始渲染** | 3.108s | 1.120s\
    \ | 63% |\n| **速度索引** | 4296 | 1108 | 74% |\n\n如你所见，使用缓存可以显著提高页面的性能。Google 有一个非常有用的[决策树](https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching?hl=en#defining-optimal-cache-control-policy)来帮助你决定如何设置高效的缓存策略。\n\
    \n### 提示：使用开发者工具检查缓存\n\n浏览器中的开发者工具通常有一个复选框，你可以启用或禁用它，以查看网站在设置了缓存和[未设置缓存](http://devtoolsecrets.com/secret/performance-disable-the-browser-cache.html)时的加载情况。\n\
    \n你可以在 Network 选项卡（Chrome）、Settings 选项卡（Firefox）或开发者工具菜单（Safari）下找到该选项。\n\n###\
    \ 缓存技巧\n\n值得注意的是，并没有一种可以应用于你网站所有资源的缓存“灵万能银药”。请花时间审核并定义你的资源以及它们的最佳缓存生命周期。每个资源都有不同的“新鲜度”要求。这里有一些[提示]/小贴士](https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching#caching-checklist)帮助你开始思考：\n\
    \n*   对于静态资源或很少更改的资源，Google 建议设置[一个月](https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching#caching-checklist)的过期策略，或者至少一周。例如，如果资源很少更改，就没有需要重复获取。\n\
    *   如果你使用 CDN，请区分哪些是对于所有用户都相同的资源。这些是 CDN 缓存的理想选择。\n*   如前所述，在合并所有 JavaScript 文件之前，请检查哪些\
    \ 应用程序部分更改频繁。为这些部分设置不激进的缓存策略。为资源确定合适的 `max-age`。\n\n"
