    \ page load time improved sales by 13%. Another [real-world example](https://blog.mozilla.org/metrics/2010/04/05/firefox-page-load-speed-%E2%80%93-part-ii/)\
    \ comes from Mozilla: cutting their page load time by 2 seconds resulted in a\
    \ 15.4% increase in downloads. The sooner you get your content to users, the sooner\
    \ they can interact with it, and the more you benefit.\n\nCan you think of potential\
    \ performance bottlenecks for your website that could negatively influence the\
    \ business?\n\n### List and Commit to Your Performance Metrics\n\nOnce you've\
    \ gathered enough baseline data and created a competitive performance analysis,\
    \ it's time to turn them into official goals, and commit to them.\n\n1.  List\
    \ your current performance data. I'll continue to use the sample page I introduced\
    \ at the beginning of the chapter as an example. The following data was taken\
    \ from the [WPT results](http://www.webpagetest.org/result/150123_B7_2RD/) for\
    \ the page:\n\n    | WPT Metrics | Results |\n\n    | --- | --- |\n\n    | Fully\
    \ Loaded | 2.58s |\n\n    | SpeedIndex | 2222 |\n\n    | Bytes (Fully Loaded)\
    \ | 692KB |\n\n2.  Prioritize results that could be improved. I propose starting\
    \ with the most obvious results—the low-hanging fruit. For example, you could\
    \ tackle the “Fully Loaded” result first, aiming to reduce it to under 2 seconds—nearly\
    \ a 30% decrease in page load time.\n\n    Be ambitious, but also stay realistic,\
    \ making sure these goals are achievable. There's always room for further improvement.\
    \ Start with your first goal of 2 seconds, then measure performance and business\
    \ data again to assess the effectiveness your approach.\n\n    | Priority | Metric\
    \ | WPT Results | Budget Goal |\n\n    | --- | --- | --- | --- |\n\n    | 1 |\
    \ Fully Loaded | 2.58s | =< 2s |\n\n    | 3 | Bytes (Fully Loaded) | 692KB | *will\
    \ automatically improve after goal #1 is achieved* |\n\n    | 2 | SpeedIndex |\
    \ 2222 | *will automatically improve after goal #1 is achieved* |\n\n    In addition,\
    \ if you gather RUM data for your website, as I did it for bbinto.me earlier,\
    \ you can also specify a target for the RUM page load time, to ensure that your\
    \ real users “really” benefit from the changes. bbinto.me showed a median of 4.6s\
    \ for RUM PLT. For this example, we could aim for 3 seconds.\n\n3.  Commit to\
    \ your goals. Don't just talk about them; circulate and publish them amongst the\
    \ team so everybody is reminded—even print them out and hang them up somewhere\
    \ if that helps. Etsy does a great job in publicly exposing the performance of\
    \ their website. They publish [their performance results](https://codeascraft.com/2014/08/01/q2-2014-site-performance-report/)\
    \ quarterly. It's their way of committing to performance, and it's a great idea.\n\
    \n### Tip: What Speed Index and PageSpeed Score Should You Aim For?\n\n*   Aim\
    \ for a *low* Speed Index. As Paul Irish defines it, a site with a Speed Index\
    \ [under 10000 is considered fast](http://timkadlec.com/2014/01/fast-enough/#comment-1200946500).\n\
    \n*   Aim for a *high* PageSpeed value. Google considers websites scored with\
    \ [85 to be performing well](https://developers.google.com/speed/docs/insights/about).\n\
    \nIn the following chapters, I'll show you how to turn these goals into actual\
    \ results and success.\n\n## Cool Down\n\n*   You've learned how to spot performance\
    \ problems in a waterfall: aim for short and steep waterfalls."
