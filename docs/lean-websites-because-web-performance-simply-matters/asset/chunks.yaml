    \ (one for each message) [is like hanging up and redialing the phone](http://nginx.com/blog/http-keepalives-and-web-performance/)\
    \ between each exchange in a conversation.\n\n[HTTP **keep-alive**](http://en.wikipedia.org/wiki/HTTP_persistent_connection)\
    \ is intended to solve this problem, by keeping the TCP connection open between\
    \ the client and the server once the HTTP transaction has completed. If the browser\
    \ requests another asset from the server, a new TCP session doesn't have to be\
    \ created.\n\nWithout keep-alive, each request will [incur two roundtrips](http://chimera.labs.oreilly.com/books/1230000000545/ch11.html)\
    \ of latency. In HTTP/1.1, keep-alive is enabled by default. For HTTP/1.0, you'll\
    \ need to set it via the `Connection: keep-alive` header. You can either do this\
    \ via the .htaccess file, or by updating your web server configuration file:\n\
    \n```\n<!-- your .htaccess file -->\n<ifModule mod_headers.c> Header set Connection\
    \ keep-alive </ifModule>\n```\n\nYou can verify if keep-alive is enabled for a\
    \ page by checking out the request header via the developer tools, as shown in\
    \ [Figure 9.2](#ch09.html_ch9-keep-alive \"Figure 9.2. Verifying keep-alive in\
    \ Chrome developer tools\"):\n\n![Verifying keep-alive in Chrome developer tools](OEBPS/figures/9-keep-alive.png)\n\
    \nFigure 9.2. Verifying keep-alive in Chrome developer tools\n\n## HTTP/2\n\n\
    As of February 2015, the HTTP/2 specification has been [approved](http://www.ietf.org/blog/2015/02/http2-approved/)\
    \ by the Internet Engineering Task Force (IETF)[^([4])](#ch09.html_ftn.d5e3681)."
