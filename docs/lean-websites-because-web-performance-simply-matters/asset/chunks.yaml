    Web: www.sitepoint.com\nEmail: business@sitepoint.com\n\n## About Barbara\n\n\
    Barbara has been an ardent performance advocate and web technologist for many\
    \ years, working on a variety of web projects, most recently for the Canadian\
    \ Broadcasting Corporation. As an international speaker, contributor to jsm, and\
    \ organizer of the Toronto Web Performance Meetup, Barbara shares her passion\
    \ and knowledge of web performance with the community.\n\n## About SitePoint\n\
    \nSitePoint specializes in publishing fun, practical, and easy-to-understand content\
    \ for web professionals. Visit `http://www.sitepoint.com/` to access our blogs,\
    \ books, newsletters, and community forums. You’ll find a stack of information\
    \ on JavaScript, PHP, Ruby, mobile development, and more. To you who thinks she\
    \ can't do it — absolutely can!\n\n# Preface\n\nPlease trust and follow we've\
    \ grown into a very impatient society—a culture of “survival of the fastest”.\
    \ Waiting is not an option anymore. Search engines like Google, Bing, and Yahoo\
    \ are competing to offer the fastest and best search results. Ecommerce sites\
    \ like Amazon, Target and Walmart are competing with innovative delivery methods\
    \ like same-day delivery (`http://en.wikipedia.org/wiki/Delivery_drone`). And\
    \ our everyday life is increasingly moving towards an online life where slowness\
    \ is not acceptable. We expect to be able to do more online and to do it quickly—from\
    \ ordering food to buying goods, or even finding relationships. If a site feels\
    \ slow, we'll probably complain to the site owner, not visit the site again, but\
    \ move on to find alternatives.\n\nAlthough Internet speeds have increased, websites\
    \ are getting bigger and more complex by the year, so they inevitably need to\
    \ be powered by more technologies to satisfy the impatient users of today. But\
    \ why is the overall size of websites increasing? Are we getting lazy and taking\
    \ current, high-speed infrastructures for granted, no longer caring about lean\
    \ and performant code?\n\nTechnology allows us to “go bigger”, but maybe not be\
    \ better when it comes to performance. Servers and Internet connections are getting\
    \ more sophisticated, and as a result, we feel the need to keep them. However,\
    \ this isn't the time to become lazy. This is the time to utilize the amazing\
    \ tools that are available for making websites faster, and to learn how to improve\
    \ user experience and satisfaction. Because nobody likes to wait.\n\nThe charts\
    \ in Figure 1 (`pr01.html_ch0-filesize`) and Figure 2 (`pr01.html_ch0-httquests`),\
    \ sourced from HTTP Archive, show the size and number of HTTP requests of websites,\
    \ and how both measurements have increased over recent years:\n\n![Increase in\
    \ average website transfer size, 2011-2014](OEBPS/figures/0-http-filesize-increase.png)\n\
    Figure 1. Increase in average website transfer size, 2011-2014\n\n![Increase in\
    \ average number of HTTP requests per website, 2011-2014](OEBPS/figures/0-http-requests-increase.png)\n\
    Figure 2. Increase in average number of HTTP requests per website, 2011-2014\n\
    \nFrom 2010 to 2014, the average total transfer size—basically the overall weight—of\
    \ a website increased by 150%, compared to the total number of requests (all the\
    \ assets of the website that need to be loaded), which only increased by around\
    \ 16%. We can clearly see a trend towards more complex web applications. Our code\
    \ needs to be performant to handle the rise of sophisticated applications. This\
    \ book will show you how to make your websites leaner and faster.\n\n### Note:\
    \ An Exercise Routine for Your Website\n\nThroughout this book, you'll notice\
    \ that I've used various references to exercise routines, notably the “Warm Up”\
    \ and “Cool Down” sections in each chapter. Indeed, the title of this book, Lean\
    \ Websites, also implies exercise. The primary reasoning behind that idea is that\
    \ you'll want to make your sites slimmer in order to make them faster. However,\
    \ additionally, by implementing the techniques discussed in this book over and\
    \ over, like an exercise routine, you'll develop a web performance “muscle memory”\
    \ that will become ingrained in your web development routine—establishing habits\
    \ that will make building efficient, performant websites seem like second nature.\n\
    \n## Who Should Read This Book\n\nThis book assumes experience of web development,\
    \ and familiarity with HTML, CSS, and JavaScript. Some back-end experience would\
    \ be useful.\n\n## Conventions Used\n\nYou’ll notice that we’ve used certain typographic\
    \ and layout styles throughout the book to signify different types of information.\
    \ Look out for the following items:\n\n### Code Samples\n\nCode in this book will\
    \ be displayed using a fixed-width font, like so:\n\n```\n<h1>A Perfect Summer's\
    \ Day</h1>\n<p>It was a lovely day for a walk in the park. The birds \nwere singing\
    \ and the kids were all back at school.</p>\n```\n\nIf the code is to be found\
    \ in the book’s code archive, the name of the file will appear at the top of the\
    \ program listing, like this:\n\n*example.css*\n\n```css\n.footer {\n  background-color:\
    \ #CCC;\n  border-top: 1px solid #333;\n}\n```\n\nIf only part of the file is\
    \ displayed, this is indicated by the word *excerpt*:\n\n*example.css (excerpt)*\n\
    \n```css\n border-top: 1px solid #333;\n```\n\nIf additional code is to be inserted\
    \ into an existing example, the new code will be displayed in bold:\n\n```javascript\n\
    function animate() {\n  new_variable = \"Hello\";\n}\n```\n\nWhere existing code\
    \ is required for context, rather than repeat all the code, a vertical ellipsis\
    \ will be displayed:\n\n```javascript\nfunction animate() {\n  …\n  return new_variable;\n\
    }\n```\n"
