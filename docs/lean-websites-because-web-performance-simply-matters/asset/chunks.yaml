    \ like the one pictured:\n\n![PageSpeed Insights data for time.com](OEBPS/figures/3-pagespeed-result.png)\n\
    \nFigure 3.14. `PageSpeed Insights` data for time.com.\n\n`PageSpeed Insights`\
    \ lacks some of the features of `WPT`, such as the advanced settings, the selection\
    \ of test locations, a very detailed waterfall view, and a unique ID for each\
    \ test. `PageSpeed Insights` only lets you type in the URL of the website. However,\
    \ it automatically includes the test results for mobile users (something a `WPT`\
    \ user needs to choose explicitly). `PageSpeed Insights` also focuses more on\
    \ optimization than `WPT`, offering helpful suggestions for optimizing your site.\n\
    \n## Browser Extensions and Plugins\n\nThere are various browser plugins and extensions\
    \ offering additional ways to test your site's performance. Extensions like `Firebug`,\
    \ `YSlow`, and `PageSpeed Insights` allow you to analyze your website on the spot\
    \ via the browser.\n\nHere is a quick summary of some of the tools available and\
    \ their functionality:\n\n*   [**Firebug**](http://getfirebug.com/) helps you\
    \ to inspect, log, profile, analyze and debug the page you are viewing in your\
    \ browser. The `Net` tab is especially handy for analyzing performance, as it\
    \ presents all `HTTP` requests in a very detailed waterfall view.\n\n*   [**YSlow**](https://developer.yahoo.com/yslow/)\
    \ can be installed as an add-on to the `Firebug` extension, but can also be added\
    \ as a stand-alone plugin for most browsers. `YSlow` is the browser plugin answer\
    \ to `PageSpeed Insights` and `WPT`. `YSlow` analyzes your web page according\
    \ to [Yahoo's rules for high performance websites](https://developer.yahoo.com/performance/rules.html).\
    \ It includes tools that not only help you diagnose but also triage on the spot.\n\
    \n*   [**PageSpeed Insights**](https://developers.google.com/speed/pagespeed/insights_extensions)\
    \ is available as plugin for `Chrome` and `Firefox`, providing suggestions on\
    \ how to make your page faster. In addition, it rates the page based on several\
    \ [rules](https://developers.google.com/speed/docs/insights/rules).\n\n*   [**ShowSlow**](http://www.showslow.com/)\
    \ is an open-source website service as well as browser plugin that helps you monitor\
    \ performance patterns. It combines the results of major performance tools including\
    \ `YSlow`, `Page Speed` and `WebPageTest`.\n\n## Advanced Analytical and Programming\
    \ Tools\n\nIn addition to the tools above, there are some advanced analytical\
    \ and programming tools you can use for synthetic measurement.\n\n### The Power\
    \ to Query = Big Query + HTTP Archive\n\nThe current `HTTP Archive` `SQL` dump\
    \ is around 400Gb of raw data. You probably don't want to download and import\
    \ this into your database. How about using a tool that already has all the data\
    \ imported, ready for you to query against? The answer is [Big Query](https://cloud.google.com/bigquery/what-is-bigquery).\
    \ `Big Query` is a Google database tool that allows you to query big sets of databases\
    \ via the browser. You can easily load the `HTTP Archive` project into your `Big\
    \ Query` profile, and run any query you like against the `HTTP Archive`, while\
    \ enjoying a blazing fast Google infrastructure.\n\nThis tool is very handy if\
    \ you want to ask questions that haven't been answered by the `HTTP Archive`.\
    \ For example, what are the most common third-party scripts? Check out [BigQueri.es](http://bigqueri.es/),\
    \ a great community resource for finding answers to all sorts of performance questions.\n\
    \n### APIs\n\nIf you want to avoid manual monitoring and measuring, I'd suggest\
    \ you take a look at some `APIs` on offer. With `APIs`, you can easily create\
    \ helpful tools and integration checks. They can remove the need for manually\
    \ opening the browser.\n\n"
  raw: "Each WPT run has a unique ID that you can always reference back to and review\
    \ in the browser at a later point, such as [http://www.webpagetest.org/result/140721_5F_1KP/](http://www.webpagetest.org/result/140721_5F_1KP/).\n\
    \nI could write a whole book about WPT, but some smart people have [already done\
    \ so](http://shop.oreilly.com/product/0636920033592.do). Additionally, the [WPT\
    \ forum](http://www.webpagetest.org/forums/) is a great place to share ideas and\
    \ ask questions.\n\n#### PageSpeed Insights\n\nPageSpeed Insights (introduced\
    \ earlier in this chapter) offers an interface for running synthetic performance\
    \ tests on a specific site. Following a test, you're presented with a result page\
    \ like the one pictured:\n\n![PageSpeed Insights data for time.com](OEBPS/figures/3-pagespeed-result.png)\n\
    \nFigure 3.14. PageSpeed Insights data for time.com\n\nPageSpeed Insights lacks\
    \ some of the features of WPT, such as the advanced settings, the selection of\
    \ test locations, a very detailed waterfall view, and a unique ID for each test.\
    \ PageSpeed Insights only lets you type in the URL of the website. However, it\
    \ automatically includes the test results for mobile users (something a WPT user\
    \ needs to choose explicitly). PageSpeed Insights also focuses more on optimization\
    \ than WPT, offering helpful suggestions for optimizing your site.\n\n#### Browser\
    \ Extensions and Plugins\n\nThere are various browser plugins and extensions offering\
    \ additional ways to test your site's performance. Extensions like Firebug, YSlow,\
    \ and PageSpeed Insights allow you to analyze your website on the spot via the\
    \ browser.\n\nHere is a quick summary of some of the tools available and their\
    \ functionality:\n\n*   [**Firebug**](http://getfirebug.com/) helps you to inspect,\
    \ log, profile, analyze and debug the page you are viewing in your browser. The\
    \ Net tab is especially handy for analyzing performance, as it presents all HTTP\
    \ requests in a very detailed waterfall view.\n\n*   [**YSlow**](https://developer.yahoo.com/yslow/)\
    \ can be installed as an add-on to the Firebug extension, but can also be added\
    \ as a stand-alone plugin for most browsers. YSlow is the browser plugin answer\
    \ to PageSpeed Insights and WPT. YSlow analyzes your web page according to [Yahoo's\
    \ rules for high performance websites](https://developer.yahoo.com/performance/rules.html).\
    \ It includes tools that not only help you diagnose but also triage on the spot.\n\
    \n*   [**PageSpeed Insights**](https://developers.google.com/speed/pagespeed/insights_extensions)\
    \ is available as plugin for Chrome and Firefox, providing suggestions on how\
    \ to make your page faster. In addition, it rates the page based on several [rules](https://developers.google.com/speed/docs/insights/rules).\n\
    \n*   [**ShowSlow**](http://www.showslow.com/) is an open-source website service\
    \ as well as browser plugin that helps you monitor performance patterns. It combines\
    \ the results of major performance tools including YSlow, Page Speed and WebPageTest.\n\
    \n#### Advanced Analytical and Programming Tools\n\nIn addition to the tools above,\
    \ there are some advanced analytical and programming tools you can use for synthetic\
    \ measurement.\n\n##### The Power to Query = Big Query + HTTP Archive\n\nThe current\
    \ HTTP Archive SQL dump is around 400Gb of raw data. You probably don't want to\
    \ download and import this into your database. How about using a tool that already\
    \ has all the data imported, ready for you to query against? The answer is [Big\
    \ Query](https://cloud.google.com/bigquery/what-is-bigquery). Big Query is a Google\
    \ database tool that allows you to query big sets of databases via the browser.\
    \ You can easily load the HTTP Archive project into your Big Query profile, and\
    \ run any query you like against the HTTP Archive, while enjoying a blazing fast\
    \ Google infrastructure.\n\nThis tool is very handy if you want to ask questions\
    \ that haven't been answered by the HTTP Archive. For example, what are the most\
    \ common third-party scripts? Check out [BigQueri.es](http://bigqueri.es/), a\
    \ great community resource for finding answers to all sorts of performance questions.\n\
    \n##### APIs\n\nIf you want to avoid manual monitoring and measuring, I'd suggest\
    \ you take a look at some APIs on offer. With APIs, you can easily create helpful\
    \ tools and integration checks. They can remove the need for manually opening\
    \ the browser, going to WebPagetest or Page Speed, manually typing in the URL\
    \ of the site you want to test, and so on. You can operate most of these tools\
    \ via a command line interface (CLI).\n\nPageSpeed Insights API\n\nIn order to\
    \ use the PageSpeed Insights API, you'll need to acquire an [API key](https://developers.google.com/speed/docs/insights/v1/getting_started).\n\
    \nThe key is required for each API call you make. For example, you'd issue a cURL\
    \ command like so:\n\n```\ncurl GET \"https://www.googleapis.com/page\n↵speedonline/v1/runPagespeed?url=http://c\n\
    ↵ode.google.com/speed/page-speed/&key={yo\n↵urAPIKey}\"\n```\n\nBy default, the\
    \ result comes back in JSON format:\n\n```\n{ \"kind\": \"pagespeedonline#result\"\
    , \n↵\"id\": \"http://time.com/\", \n↵\"responseCode\": 200, \n...\n↵\"numberCssResources\"\
    : 4 }\n```\n\nThe [JSON response](https://developers.google.com/speed/docs/insights/v1/reference),\
    \ which I've only shown a nippet of above, returns detailed information, such\
    \ as the size of each content type, the number of assets per content type and\
    \ the number of hosts contacted. Can you spot which content type returns the highest\
    \ number of `ResponseBytes`? `javascriptResponseBytes` represents the highest\
    \ number of uncompressed response bytes for JavaScript resources on the page,\
    \ and returns 2535002 bytes, which is just over 2.5Mb.\n\nWebPagetest API\n\n\
    WebPagetest offers an API as well. It's up to you which of the services you prefer.\n\
    \nAfter retrieving your API key from WebPagetest, you can send a request as follows:\n\
    \n```\ncurl http://www.webpagetest.org/runtest.ph\n↵p?f=json&url=www.time.com&k=<API\
    \ KEY>\n```\n\nAs I specified the format to be JSON (`f=json`), a successful response\
    \ will come back like this:\n\n```\n{ \"statusCode\":200, \"statusText\":\"Ok\"\
    ,\n↵ \"data\":{ \"testId\":\"140907_R9_DQP\", \n...\n↵\"jsonUrl\":\"http:\\/\\\
    /www.webpagetest.org\n↵\\/jsonResult.php?test=140907_R9_DQP\",\n...\n```\n\nThe\
    \ `jsonUrl` value includes the path to the actual JSON WPT result:\n\n```\n{ \"\
    data\" : { \"average\" : { \"firstView\" : { \n↵\"TTFB\" : 366, \"adult_site\"\
    \ : 0, \"aft\" : \n↵0, \"avgRun\" : 1, \"bytesIn\" : 1772202, \n↵\"bytesInDoc\"\
    \ : 1760651,\n↵... \"score_minify\" : 100, ... }}}}}\n```\n\nThis is just a snapshot\
    \ and not the complete JSON response, but hopefully you get a sense of the valuable\
    \ information stored in this response. As an example, any `score_*` value could\
    \ be used for performance validation (if below 50, raise a flag, and so on).\n\
    \nThere's a rate limit attached to the API key. This is another good reason to\
    \ install your own WPT instance, as there'll be no rate limit then.\n\n### Real\
    \ User Monitoring\n\nWhile synthetic testing focuses on one particular setup and\
    \ doesn't show the “real” experience of a user, **real user monitoring** (RUM)\
    \ tells you what an actual user is experiencing. It can't tell you how the user\
    \ *feels* about the performance, but it will give you a good sense of how long\
    \ it took them to view your page.\n\nRUM can help you collect a lot of information\
    \ about your users that synthetic testing can't, such as:\n\n*   **Cache**: RUM\
    \ helps to better understand how much of your content is being cached by users.\n\
    \n*   **Hardware**: RUM can reveal detailed information about the user's CPU,\
    \ GPU and memory performance.\n\n*   **Browsers**: RUM can identify what kind\
    \ of browsers load different pages.\n\n*   **Connectivity**: Internet connections\
    \ can drop any moment (especially on mobile). RUM can help figure out where connections\
    \ are slower."
