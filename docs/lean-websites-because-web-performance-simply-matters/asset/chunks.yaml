    \n    ```\n    /* style.css*/\n    .leanleaf{\n        width:156px;height:169px;background:url(data:image/png;base64,\n\
    \    ↵iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyA...)\n    ↵ no-repeat;margin:auto\
    \ auto;}\n    ```\n\n5.  [PNG](http://www.bbinto.me/lean-websites/chapter-7/data-uri/png-css):\
    \ PNG image, referenced as a background image via external CSS:\n\n    ```\n \
    \   /* style.css*/\n    .leanleaf{\n        background-image: url(../img/leaf.png);\n\
    \        /* ... */\n    }\n    ```\n\nAfter creating the sample pages, I tested\
    \ the load times and file size of each page.\n\nTo get some representative performance\
    \ data, I used [phantomJS](http://phantomjs.org/) to record the load time measurements\
    \ for each example page (100 data points each).\n\n| Result | Inline Data URI\
    \ | WebP | SVG | External Data URI | PNG |\n\n| --- | --- | --- | --- | --- |\
    \ --- |\n\n| Median (ms) | 142.5 | 179 | 216 | 258 | 282 |\n\n| HTML size (bytes)\
    \ | 9873 | 1769 | 2161 | 10085 | 1959 |\n\nInline data URI and WebP show the fastest\
    \ median load times, whereas PNG as a CSS background image loads the slowest,\
    \ followed by the data URI in CSS and the SVG served via CSS.\n\nIf you're not\
    \ sure what format is going to give the best performance for your site, try collecting\
    \ some load time data first, to see what format proves to be the most performant.\n\
    \n## Optimizing Video\n\nLike images, video files tend to be bigger than CSS,\
    \ JavaScript, or HTML files, so they come with a higher performance price, though\
    \ they can also add value to your site.\n\nYour videos should be encoded to play\
    \ on as many devices as possible, but also should be no larger than necessary.\
    \ Many of your users may have slow download speeds and expensive data plans. Several\
    \ of the top Alexa websites use auto-playback for videos on their landing page,\
    \ leaving a huge performance footprint for visitors—which results in many [“F”\
    \ marks in WPT](http://www.webpagetest.org/result/141028_30_CJV/).\n\nVideo file\
    \ size is dependant on frame and bit rate, resolution, compression format, and\
    \ delivery method. In this section you'll learn how to optimize these factors.\n\
    \n### Video Creation and Content\n\nThe more complex a video is, the harder it\
    \ is to compress, which makes it more difficult to optimize. If you have control\
    \ over how the video is shot, there are steps you can take to ensure that the\
    \ video will be easier to compress:\n\n*   Aim for noise-free content.\n\n*  \
    \ Keep the number of zooms to a minimum.\n\n*   Keep the number of background\
    \ details and movements to a minimum.\n\n    ### Note: Audio\n\n    [Studies](http://web.media.mit.edu/~vmb/papers/russ_sound.pdf)\
    \ have shown that audio quality can affect *perceived* video quality. This means\
    \ that if you have good-sounding audio, people will think your video *looks* better.\
    \ That said, if your video uses mostly spoken words, and no music, you [should\
    \ be fine](https://ustream.zendesk.com/entries/22962268-Encoding-Specs-and-Stream-Settings#bandwidth)\
    \ using mono rather than stereo audio (which will save some bandwidth that can\
    \ be allocated to the video instead).\n\n    Audio bit rates should be [defined](http://support.video.limelight.com/support/docs/encoding_guide/)\
    \ based on their content, and therefore only set as high as your content demands.\
    \ Rates between 64 and 128kbit/s are sufficient for most cases. For recording\
    \ human speech, a low bit rate of around 64kbit/s is acceptable. For music audio,\
    \ a higher bit rate of 192kbit/s would be ideal.\n\n### File Size: Frame Rate,\
    \ Bit Rate, and Resolution\n\nVideo settings including frame rate, bit rate and\
    \ resolution, each of which affects the file size of a video.\n\nFrame Rate\n\n\
    The **frame rate** is defined as the number of frames that appear every second.\
    \ It's measured in frames per second (fps). The higher the frame rate or resolution,\
    \ the better the video experience for the user."
