    我将 MPM（主要模块）绘制在上述的线框图中，并用虚线框表示。每个框中的数字描述了每个 MPM 在屏幕上出现的顺序。例如，菜单框是最先加载的。


    以下是每个 MPM 在首屏以上（above the fold）的计数，分为低影响、中等影响和高影响：


    | 计数 | 模块 | 分数 |

    | --- | --- | --- |

    | 10 | 低影响 | 10 |

    | 2 | 中等影响 | 4 |

    | 2 | 高影响 | 12 |

    | **14** | **总计** | **26** |


    通过检查每个 MPM 的文件大小，你可以评估每个 MPM 的影响。如前提到的，主要为了让设计人员和开发人员聚集，快速绘制出不同内容模块对性能的影响。它能让你轻松确定哪些元素可能太重，而不适合在首屏展示。


    ### 基于 MDM 的建议性能顺序


    通过对网站进行一些调整，我们应该能够提高感知性能。尽管 Time.com 对其主故事图片使用了渐进 JPEG (progressive JPEGs)，但图片似乎没有获得所需的早期关注。代码中的某些内容似乎阻塞了它的渲染，导致用户在
    5.7 秒后才能看到它。


    即使主新闻图片被归类为高影响模块，我认为在这种情况下，尽早加载这张图片是非常重要的。因此，我为 Time.com 提出的性能线框图可能所示图 2.7：


    ![Time.com 的性能线框图](img/2-wf-time-performant.png)


    图 2.7. Time.com 的性能线框图


    以下是我根据更改后获得的新 MPM 首屏以上计数：


    | 计数 | 模块 | 分数 |

    | --- | --- | --- |

    | 12 | 低影响 | 12 |

    | 3 | 中等影响 | 6 |

    | 1 | 高影响 | 6 |

    | **16** | **总计** | **24** |


    我减小了主故事图片的高度和宽度，通过将标题和描述右对，在图片旁边放置了更多上下文。我还将股票数据小部件替换为用户必须点击的 CTA 按钮。只有在点击时，才会加载股票数据，这在某种程度上缩短了
    ATF 加载时间。


    我还在线框图中添加了一些加载优先级数字，这样开发人员在规划关键渲染路径（我们将稍后讨论这个主题）时就知道该关注哪里。


    如果你不确定哪些小部件和元素应该被移除或移动到首屏以下，请验证那些小部件和元素是否真的被访问者使用。如果你认为一张大图片（高影响 MPM）应该放在首屏以上，请确保在性能预算与其他低中等影响模块之间取得平衡。


    性能线框图不足以让你的网站感觉很快，但它是你走向轻量化网站之旅的极佳起点。


    ## 总结


    在本章中，我们涵盖了以下主题：


    * 早期考虑并规划性能的方法

    * 如何“伪造”一个快速网站

    * 感知性能的重要性

    * 性能点数系统和 MDM 的概念


    性能最重要的规则之一是量化性能的好坏。虽然*感知*性能是 Web 性能的一个重要方面，但网站的*实际*性能同样重要——而这只能通过测量和监控来确定。你无法改进你没有测量过的东西。下一章将为你介绍几种用于测量和监控网站性能的指标指标、技术和工具。


    # 第 3 章：测量与监控性能


    ## 预热


    在改进某事物（无论是网站还是产品）的过程中，能够衡量进展是有帮助的。没有有效的测量，很难判断某物是变好了了还是变坏了。幸运的是，我们有很多工具可以测试和监控你的网站性能。这就是本章的重点。


    ## 测量性能


    在本节中，我们将查看用于测量和监控 Web 性能的工具。


    ### HTTP Archive：跟踪性能趋势


    [HTTP Archive](http://httparchive.org) 是一个免费的在线服务，它爬取前百万 Alexa 网站，以收集这些网站如何构建的数据。你可以使用它来探索趋势，例如页面大小、加载时间、内容交付网络
    (CDN) 的使用、不同内容类型（如图像、JavaScript 等）的分布以及许多[其他统计](http://httparchive.org/interesting.php)。


    这是 HTTP Archive 展示的一些有趣数据示例：


    * **总传输大小和总请求数**：网站页面总体在持续增长。从 2012 年到 2014 年，页面大小增加了约 38%：


    | 年份（8 月 1 日） | [总传输大小](http://httparchive.org/about.php#bytesTotal) | 上年的增长百分比
    |

    | --- | --- | --- |

    | 2012 | 1124 | - |

    | 2013 | 1532 | 27 |

    | 2014 | 1821 | 16 |


    *HTTP Archive 统计：2012-14 年单个顶级 Alexa 网站的平均总传输大小和总请求数*


    * **JavaScript 传输大小**：随着所有趋势 JavaScript Web 应用的应用，JavaScript 传输大小增加超过 100% 并不意外，从
    2011 年的 113Kb 增加到 2014 年的约 289Kb。


    * **图像格式**：HTTP Archive 可以帮助你回答“最常用的图像类型是什么？”如你所示，答案是 JPEG：


    ![按格式分类的请求](img/3-httparchive-images.png)


    图 3.1. 按格式分类的请求


    这类数据对于理解你的网站与当前标准的对比很有用。


    下面的图片显示了来自 Time.com 的[数据](http://httparchive.org/viewsite.php?pageid=17936268*)。如果你是一家新闻机构，你可能想将你的网站数据与这些进行比较。你在这里发现趋势。例如，Time.com
    似乎减少了图像文件大小以及请求量，这可能表明网站优化的趋势：


    ![HTTP Archive 的 Time.com 数据](img/3-httparchive-time.png)


    图 3.2. HTTP Archive 的 Time.com 数据


    HTTP Archive 为性能世界提供了很好的介绍——回答你或公司其他人可能提出的许多问题。它还可以帮助你的团队专注于特定的方向。例如，如果你正在考虑使用特定的图像格式或遵循特定的趋势，HTTP
    Archive 可以帮助支持这一决策。


    ### 有用的性能工具


    有许多用于衡量网站性能的各种工具，包括如 [New Relic](http://newreic.com/application-monitoring)、[Keynote](http://www.keynote.com/)
    或 [Neustar](http://www.neustar.biz/) 等商业产品。不过，在为工具掏钱之前，尝试开源工具，如你的浏览器和 [WebPagetest](http://www.webpagetest.org)
    是值得的。在本节中，我们将查看这两个工具可以做什么。


    #### 基于浏览器的开发工具


