- fmt: '

    *   Remember that images are your best friend, but also your worst enemy. The
    biggest optimization results can be achieved for images. Don''t serve any more
    pixels than needed, by choosing the right image compression and format. Review
    the compression and format options discussed in [Chapter 7](#ch07.html "Chapter
    7Producing Lean Web Assets: Part 2").

    *   Measure the performance of your image format before settling on it. Use image
    formats such as `PNG`, `GIF`, `JPEG`, `SVG` or even encode the image into a `base64`
    format (data URI) for the web.

    *   Avoid custom web fonts, using them only if really necessary. Where they are
    used, consider a web font loader, as discussed in Chapter 7.

    *   Use `Gzip` techniques, as introduced in [Chapter 9](#ch09.html "Chapter 9Network
    and Server Performance Improvements"), to reduce the file size sent over the wire.


    ## Reduce HTTP Requests


    One of the important aspects of performance optimization is reducing the number
    of HTTP requests you make. Only serve the necessary files to the user. In order
    to achieve this, check out the following summarized tips, previously discussed
    in [Chapter 5](#ch05.html "Chapter 5Mastering Lean HTTP Requests").


    ### Request Checklist


    *   Concatenate where applicable, to reduce the amount of HTTP requests. Be smart
    about it: separate more frequently changed code from less frequently changed code.
    Concatenate files based on these criteria, and use a more aggressive cache policy
    for the latter.

    *   “Less is more”. Load only what matters, especially when using `RWD`.

    *   Don''t blindly use `JavaScript` libraries and frameworks just because they
    are convenient.

    *   Use image sprites to reduce HTTP requests. Avoid too much white space between
    images to reduce memory consumption (see Chapter 5 for more details).

    *   For small images, consider using the `data URI` technique to remove additional
    HTTP requests.


    ## Fight Latency


    Latency is the biggest bottleneck for lean websites, as discussed in [Chapter
    3](#ch03.html "Chapter 3Measuring & Monitoring Performance"), [Chapter 5](#ch05.html
    "Chapter 5Mastering Lean HTTP Requests"), [Chapter 6](#ch06.html "Chapter 6Producing
    Lean Web Assets: Part 1") and [Chapter 7](#ch07.html "Chapter 7Producing Lean
    Web Assets: Part 2") and [Chapter 9](#ch09.html "Chapter 9Network and Server Performance
    Improvements"). Consider the steps below to lower latency as much as possible.


    ### Latency Checklist


    *   Measure your users'' latency by using the `Resource Timing API`, as introduced
    in [Chapter 3](#ch03.html "Chapter 3Measuring & Monitoring Performance").

    *   Fight latency by reducing HTTP requests as much as possible (see “Reduce HTTP
    requests” above).

    *   The highest latency occurs on mobile devices. Additional latency is caused
    by the radio of the device, as discussed in [Chapter 10](#ch10.html "Chapter 10A
    Multi-device Web World") and [Chapter 11](#ch11.html "Chapter 11Mobile Optimization
    Techniques").

    *   Reduce the amount of polling on your page. Don''t constantly try to fetch
    new content in the background, especially if it''s not immediately needed.

    *   Send the most important styles down the wire as soon as you can.

    *   Remove redirects where possible.

    *   Use the `keep-alive` header that keeps TCP connections open to reduce latency,
    as explained in [Chapter 3](#ch03.html "Chapter 3Measuring & Monitoring Performance")
    and [Chapter 9](#ch09.html "Chapter 9Network and Server Performance Improvements").

    *   Use offline storage techniques such as `appcache`, `local storage`, `Web SQL
    database`, or `IndexedDB` to cut down on latency. Review [Chapter 11](#ch11.html
    "Chapter 11Mobile Optimization Techniques") for more details.

    *   Use content delivery networks to avoid high latency, by moving requested resources
    closer to the users and thus reducing round trip time. [Chapter 9](#ch09.html
    "Chapter 9Network and Server Performance Improvements") outlines further server
    quick wins.

    *   `HTTP/2` (and formerly `SPDY`) provide efficient use of network resources
    and reduced latency, by allowing multiple concurrent requests on the same connection.


    ## Make Friends with the Server


    You wouldn''t believe how much a little server love can help your performance
    efforts. The examples in [Chapter 9](#ch09.html "Chapter 9Network and Server Performance
    Improvements") show that with only a little bit of effort in server optimization—such
    as using `Gzip` compression—huge performance improvements can be made. The tips
    below recap the most important ones.


    ### Server Checklist


    *   `Gzip` uncompressed assets such as `HTML`, `XML`, `JSON` and `CSS`.

    *   Create a solid cache policy, as described in Chapter 9. Use conditional requests
    (content-based and time-based) to specify how to retrieve assets from the network.

    *   Consider `PageSpeed Insights` for your web server. It''s a great tool for
    reducing some of the performance workload by applying `mod_pagespeed` filters.


    ## Tame the Mobile Beast


    One of the biggest challenges of mobile web browsing is the latency that comes
    with the radio and wireless connections. Don''t fear it, but be aware of it. [Chapter
    10](#ch10.html "Chapter 10A Multi-device Web World") and [Chapter 11](#ch11.html
    "Chapter 11Mobile Optimization Techniques") covered important aspects of mobile
    web performance, which are summarized below.


    ### Mobile Tips


    *   Be respectful of your visitors'' data charges on mobile. Don''t make the user
    pay for your bad performance.

    *   Avoid domain sharding (on mobile). More HTTP requests and DNS lookups will
    result in higher latency.

    *   Pay attention to `RUM` or `Analytics` data to understand your users'' connection
    speed and latency, then optimize them.

    *   Weigh the advantages and disadvantages of different mobile strategies. Choose
    between `mdot`, `RWD`, `RESS` or `RESS` with `ESI`. Review [Chapter 11](#ch11.html
    "Chapter 11Mobile Optimization Techniques") for a comparison table.

    *   Apply device description repositories to assist you with device detection.

    *   `RESS` with `ESI` redirect offers an additional advantage over regular server-side
    redirects: it occurs at the edge, and is faster than putting the redirect logic
    at the origin.

    *   Remove the need for a mobile direct by encouraging your user to bookmark your
    `mdot` site rather than using the desktop URL.

    *   Mobile devices are powered by batteries. Understand what causes the battery
    to drain: rendering images takes up most of the total rendering energy, followed
    by executing `JavaScript` code. Also, the more items are styled on a page, the
    bigger is the energy consumption for style sheets.

    *   Consider offline storage techniques as described in [Chapter 11](#ch11.html
    "Chapter 11Mobile Optimization Techniques").

    *   Test your mobile experience on real devices, as much as possible.


    ## Automate Your Performance Routines


    The idea behind automating performance optimization, as discussed in Chapter 8,
    is to help you build and maintain lean websites with the least manual labor. Using
    `APIs` and task runners to programmatically produce performant code during deployment
    helps greatly in producing lean websites.


    ### Automation Checklist


    *   Leverage the power of the `PageSpeed Insights API` to check for performance
    bottlenecks, apply filters and rules, and provide warnings. Review the list of
    filters in [Chapter 8](#ch08.html "Chapter 8Automating Optimization Tasks").

    *   Use task runners such as `Grunt`, `Gulp`, `Maven` or `Ant`—as discussed in
    Chapter 8—to make performance optimization a component of your deployment process.

    *   Even better, include task runners and performance APIs in your continuous
    integration system. Check out `YSlow`''s continuous integration plugins, as introduced
    in [Chapter 8](#ch08.html "Chapter 8Automating Optimization Tasks").


    ## Stay in Shape and Avoid the Yo-yo Effect

