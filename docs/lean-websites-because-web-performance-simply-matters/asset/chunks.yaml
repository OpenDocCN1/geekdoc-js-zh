    In this final chapter, I''ve compiled a list of the most important tips and tricks
    covered throughout this book. It''s designed to be a kind of performance cheat
    sheet, or, if you prefer, a set of exercises to guide you in practicing web performance.
    The more frequently you apply the tips below, the better you''ll get at mastering
    performance issues and creating fast, lean websites.


    ## Shape a Performance Culture


    This book has highlighted the importance of building a strong performance [culture](http://www.stevesouders.com/blog/2013/05/17/creating-a-performance-culture/).
    Make sure to bring everybody on board within your team and company. If you don''t
    create the right culture, there''ll be a constant performance battle with cross-functional
    teams such as product, marketing or design. You need to foster, educate and stand
    up for the idea that performance results in success, revenue, customer happiness
    and satisfaction. So foster web performance as part of your company''s culture.


    ### Team Culture Checklist


    *   Make `everybody` aware that performance is `everybody''s` business, from product
    manager to content strategist, from designer to developer.

    *   Encourage, and feel encouraged, to say “No”. Evaluate if a new script, or
    a big, heavy image, will really improve the customer experience and result in
    more revenue, and balance this against the performance hit the page might take
    because of this specific choice.

    *   Once performance gains have been made and identified, communicate, celebrate,
    and share this success frequently with the teams.


    ## Performance Is about Perception and Respect


    Page size or page load time are not the only indicators of performance. Perceived
    performance is essential for a happy user. People won''t notice when your site
    is fast, but they''ll notice when it loads slowly. We should show our users respect
    by serving the content they requested as fast as possible. Don''t make them wait!


    ### End User Checklist


    *   Ask the question “How long does it take for the user to interact with my page?”
    or “How many steps does it take the user to achieve this task?” Optimize based
    on these answers.

    *   Show respect to your visitors by avoiding any unnecessary delays in loading
    your page.

    *   Treat speed as a [feature](https://www.igvita.com/slides/2013/io-pagespeed.pdf).

    *   Optimize `from` the user''s perspective. Focus on the user''s circumstances,
    and not your `ideal` setup. Record RUM data to discover the actual latency and
    connection speed of your users. Review Chapter 3 for details on synthetic and
    real user monitoring.

    *   Your site is never fast enough: there''s `always` room for improvement.


    ## Wireframing for Performance


    Ensure that everybody in your team—including the designers and UX experts—understands
    how performance should be integrated, early on, into the design process. [Chapter
    2](#ch02.html "Chapter 2User Experience and Performance") covered some ideas on
    how to do that. Let''s briefly summarize some of the most important tips.


    ### Planning Checklist


    *   Define and agree upon what''s most important about your site, using the performance
    point system introduced in Chapter 2.

    *   Define measurable performance modules for each wireframe to illustrate performance
    impact.

    *   Agree on the above the fold content and prioritize visible content.

    *   Make an effort to explain performance implications to the entire team.

    *   Create a quick prototype to illustrate the performance impact of a proposed
    wireframe.


    ## Measure First, Then Optimize (and Repeat)


    Talk numbers, show graphs and pie charts! Quantifying performance bottlenecks
    can have a huge impact on the website''s decision makers. Use the tools and techniques
    introduced in [Chapter 3](#ch03.html "Chapter 3Measuring & Monitoring Performance")
    and [Chapter 4](#ch04.html "Chapter 4Performance Boot Camp Setup"), and practice
    the following guidelines.


    ### Measuring Checklist


    *   Choose your tools. Build your personal performance measurement arsenal by
    making use of powerful, open-source tools such as WebPagetest, PageSpeed Insights,
    RUM tools such as Boomerang, and the waterfall view of your browser. For tracking
    trends, check out HTTP Archive.

    *   Clean up your waterfall. Keep the overall waterfall as steep, thin and small
    as possible. Revisit Chapter 4 for more details.

    *   Set a performance budget to establish a goal to work towards, such as setting
    a baseline by comparing your performance results with those of your competitors.

    *   Before choosing third-party content (such as scripts), use the `Resource Timing
    API` introduced in Chapter 3 to measure their performance impact.

    *   Aim for a `low` Speed Index and a `high` PageSpeed value.

    *   Consider setting up a free private HTTP Archive, and WPT instance, for more
    control over a defined list of web pages and measurement cycles. [Chapter 4](#ch04.html
    "Chapter 4Performance Boot Camp Setup") covered steps on how to get started.


    ## Determine Your Critical Rendering Path


    Get to know and understand the critical rendering path of your page. Condense
    [the code and resources required to render the initial view of a web page](https://developers.google.com/speed/docs/insights/mobile?csw=1#MinimizeDNSLookups)
    as much as possible. Review the detailed example in [Chapter 5](#ch05.html "Chapter
    5Mastering Lean HTTP Requests") to help you apply some techniques and tools to
    optimize your critical rendering path.


    ### Critical Rendering Checklist


    *   HTML, the page itself, is always a critical resource. Keep it as clean as
    possible.

    *   Clean up your `DOM` by removing unused elements. They just delay the rendering
    process.

    *   Order matters: load critical assets as early as possible, and remove any render-blocking
    elements from the critical path.

    *   Don''t put third-party features—such as scripts or web fonts—in your critical
    path.

    *   Minimize repaint and reflows, and avoid changing the appearance of an element
    without changing its layout, or changing the page layout. Revisit Chapter 6 for
    the list of CSS elements to avoid.

    *   Aim for 60fps or persistent frames of 30fps and higher for smooth scrolling.
    For animations, use `requestAnimationFrame()` instead of `setInterval()` or `setTimeout()`,
    as explained in Chapter 6.

    *   Follow the 14KB rule to serve the most important content first.

    *   Prioritize visible content: focus on the above the fold content first, and
    load other assets afterwards.

    *   CSS is critical. Remove render-blocking CSS by using the `media` attribute
    (remembering, however, that the file will still be downloaded).

    *   The most important styles, especially above the fold styles, should go inline,
    as described in Chapter 5.

    *   Unblock the parser by using attributes such as `defer` or `async` for JavaScript
    tags.

    *   Put scripts at the bottom of the page to avoid render blocking.

    *   Make scripts non-blocking: wait until the `window.onload` event has fired
    to load less critical JavaScript files, and load them asynchronously, especially
    third-party scripts.

    *   Limit the total number of `script` tags to allow faster rendering. Review
    Chapter 6 for more JavaScript optimization tips.


    ## Reduce Bytes


    A smaller site is a faster site! In general, reducing the size of the assets that
    need to be sent to the browser will be beneficial. There are several optimization
    tips, described in [Chapter 6](#ch06.html "Chapter 6Producing Lean Web Assets:
    Part 1") and [Chapter 7](#ch07.html "Chapter 7Producing Lean Web Assets: Part
    2"), that you can follow to slim down the assets of your page.


    ### Asset Checklist


    *   Minify your page assets such as HTML, CSS and JavaScript.

