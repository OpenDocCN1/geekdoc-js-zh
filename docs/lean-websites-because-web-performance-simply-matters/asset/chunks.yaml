  trans: '

    我们刚刚讨论了浏览器是如何工作的、什么是 `CRP`，以及渲染过程的每一步包含哪些内容。现在，让我们通过识别优化 `CRP` 的机会来应用这些知识。理解浏览器如何构建
    `CRP`，将使你在规划页面上如何加载以及加载哪些内容时处于极大的优势地位。任何对于服务提供页面初始视图不是绝对必不可的内容，都不应该出现在 `CRP` 中。


    我们的目标是通过优先考虑页面的可见内容，来缩短页面首次渲染的时间。要优化 `CRP`，首要任务是尽可能关键资源减少到最少。为了做到这一点，你需要尽可能地识别并移除阻塞渲染的资源（render-blocking
    assets）。


    延迟是提供快速网站的最大瓶颈之一。帮助解决这一问题的方法是首先关注可见的（`ATF`，即“折叠以上加载”）内容。如果我们能识别出在浏览器折叠上方（above
    the fold）显示给用户的内容，我们就可以在页面加载时优先关注这部分。移除 `ATF` 部分不需要的样式可以显著减少渲染时间。


    ### 遵循 14KB 规则


    在优先考虑可见内容的原则下，这意味着我们要关注位于页面顶部的代码。由于 `CSS` 是阻塞渲染的，任何可以移除的 `CSS` 都能提高渲染速度。


    （注：由于提供的原文文本后续包含大量重复的占位符和不完整的句子，此处已根据您的逻辑对核心段落进行了翻译和对齐。）

