    *   标题已从“这不是魔法”更改为“这是魔法”（虽然这并不算真正的优化，但使用了 `grunt-processhtml`）。

    *   HTML 已经过压缩，并删除了注释（使用了 `grunt-htmlcompressor`）。

    *   已运行了针对潜在 SPOF（单点故障）脚本的测试（使用了 `SPOF-check`），并警告了输出过程中可能出现的问题。


    ## 比较


    让我们比较这两个版本页面的瀑布图。“并非魔法”的版本（运行 Grunt 之前）显示在图 8.2。“这是魔法”的版本（运行 Grunt 之后）显示在图 8.3
    你可以看到下载资源数量上的差异：


    ![“并非魔法”页面的瀑布图](img/8-notmagic-waterfall.png)


    图 8.2. “并非魔法”页面的瀑布图


    ![“这是魔法”页面的瀑布图](img/8-magic-waterfall.png)


    图 8.3. “这是魔法”页面的瀑布图


    让我们再看看这两个页面的 WPT 视频对比，特别关注“完全加载”指标。如你所见，“魔法”版本胜出：


    ![我们页面的 WPT 视频对比](img/8-grunt-video-comparison.png)


    图 8.4. 我们页面的[WPT 视频对比](http://www.webpagetest.org/video/compare.php?tests=150123_B7_2RD%2C150123_61_2RB&thumbSize=100&ival=100&end=visual#)


    以下是 WPT 指标的详细分类：


    | 性能结果 | 未使用魔法 | 使用魔法 |

    | --- | --- | --- |

    | 开始渲染时间 | 1.457s | 1.148s |

    | 完全加载 | 2.583s | 2.176s |

    | 字节 | 692KB | 615KB |

    | 速度索引 | 2222 | 1719 |

    | PageSpeed 分 | 82 | 88 |


    我们在这里使用 Grunt 完成的优化任务可以手动完成，但如果经常这样操作将非常费力。使用任务运行器来处理性能优化可以加速开发过程，并使制作精简网站变得更容易。


    ## Grunt 替代方案


    [Gulp](http://gulpjs.com/) 是 Grunt 的替代方案，同样可以自动处理常见的性能任务，如压缩 JavaScript 和编译预处理过的
    CSS。虽然 Gr 会频繁写入文件系统并更改文件，而 Gulp 在写入磁盘之前会在内存中执行大多数操作（使用流）。大多数 Grunt 任务在 Gulp 中也可用，例如
    [gulp-concat](https://www.npmjs.com/packages/gulp-concat)、[gulp-minify-html](https://www.npmjs.com/packages/gulp-minify-html)
    等。


    其他任务运行器还包括 [Maven](http://maven.apache.org/) 和 [Ant](http://ant.apache.org/)，它们主要用于
    Java 项目，也可以用于自动化 Web 性能优化。有几种性能插件可用，如 [Google Closure Compiler](https://github.com/google/closure-compiler)
    或 [HtmlCompressor](https://code.google.com/p/htmlcompressor/)。Maven 和 Ant 都使用
    XML 来描述构建过程。


    ## 总结


    *   你已经配置了可以自动化性能优化任务的工具。

    *   大多数现有性能工具（如 YSlow 和 WPT API 封装器）可以集成到你的持续部署过程中，以消除任何手动性能测试。

    *   你已经介绍了任务运行器和构建系统，以及它们如何帮助你实现性能自动化。

    *   介绍了几个特定的 Grunt 性能工具，以演示将性能任务包含在部署过程中的好处。“之前”和“之后”页面的对比揭示了在不进行人工操作的情况下可以进行多少改进。


    # 第 9 章：网络和服务器性能改进


    ## 热身


    我们目前为止涵盖的性能技术主要集中在优化网站的前端——或者说是下载到浏览器的所有。在本章中，我们将关注改进后端性能，这涉及到对你的网络和 Web 服务器进行微调。


    ## 内容分发网络


    内容分发网络（CDN）是一种为了快速提供内容内容的托管服务，旨在克服延迟。如果柏林的用户请求一个托管在旧金山没有 CDN 的服务器上的页面，那么该页的所有资源都必须从旧金山获取，跨越大西洋。这非常麻烦，你不觉得吗？CDN
    通过在全球范围内多个位置缓存静态内容来解决这个问题，允许网站资源快速递送到任何浏览器。


    以下示例概述了带有 CDN 和没有 CDN 的网站性能：


    | velocityconf.com[^([a])](#ch09.html_ftn.d5e3544) | 原始 | CDN |

    | --- | --- | --- |

    | 加载时间 | 17.87s | 8.34s |

    | 开始渲染 | 7.01s | 2.74s |

    | 请求数 | 81 | 81 |

    | 字节数 | 1014KB | 792KB |


    [^([a])](#ch09.html_d5e3544) 来源：velocityconf.com 的示例数据，取自 [Web Performance Today](http://www.webperformancetoday.com/2012/05/14/cdn-feo-front-end-optimization-web-acceleration/)


    整个 CDN 中可用的服务器被称为边缘服务器，在这些服务器上分发多个内容副本被称为内容复制。大多数 CDN 供应商在世界各地维护大量边缘服务器，使得 CDN
    对于向许多国家提供内容的网站特别有用。


    图 9.1 插释了如何在 CDN 内部访问网站。一旦请求页面，将根据到达服务器所需的跳数，或根据哪个服务器的可用性最高来确定最佳服务器：


    ![CDN 的工作演示](img/9-cdn-example-external.png)


    图 9.1. CDN 的工作演示


    使用 CDN 的益处包括：


    *   **减少延迟**：通过将内容移到用户附近，可以减少延迟并提高加载速度。由于内容复制和静态内容的缓存，用户可以从缓存内容和更快的递送速度中受益。

    *   **减少丢包**：由于数据包传输距离较短，它们丢失的概率较低。这在延迟敏感的情况（如视频流媒体）中尤为重要。糟糕的视频体验会降低用户满意度。

    *   **提高可靠性**：在 CDN 中复制内容提高了网站的可用性，因为网站不再依赖于单一服务器。


    ## 针对你的 Web 服务器使用 PageSpeed Insights


    PageSpeed Insights 以后端模块 `https://developers.google.com/speed/pagespeed/module`
    的提供，可以安装在你的服务器上。该模块带有许多用的过滤器 `https://developers.google.com/speed/pagespeed/module/filters`，可以安装以优化代码。该模块在不需要修改现有内容的情况下优化代码，在
    HTTP 服务器交付资源时执行。它基本上是“即时”的性能改进。


    后续章节简要介绍了在减少 HTTP 请求（从而减少延迟）背景下值得提到的几个过滤器[^([3])](#ch09.html_ftn.d5e3594)。


    #### 标准化 JavaScript 库


    jQuery 是目前最流行的 JavaScript 库之一。假设你从使用 jQuery 的网站 A 导航到同样使用 jQuery 的网站 B。浏览器会自动再次从网站
    B 获取 jQuery 脚本，即使它刚刚从网站 A 请求过。


