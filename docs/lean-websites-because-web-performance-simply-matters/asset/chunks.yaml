  trans: "\n\n| 地区 | 2014 年第一季度平均 Mbps |\n| --- | --- |\n| 全球 | 3.9 |\n| 韩国 | 23.6\
    \ |\n| 日本 | 14.6 |\n| 香港 | 13.3 |\n| 瑞士 | 12.7 |\n| 荷兰 | 12.4 |\n| 拉脱维亚 | 12 |\n\
    | 瑞典 | 11.6 |\n| 捷克 | 11.2 |\n| 芬兰 | 10.7 |\n| 爱尔兰 | 10.7 |\n\n然而，尽管带宽在未来几年可能会提高，但随之而来的延迟并不是一个容易解决的问题。改进延迟需要更新和增强——例如更短的跨洋电缆。\n\
    \n## 最后公里延迟\n\n`Last mile latency`（最后公里延迟）指的是你的请求与互联网服务提供商（ISP）之间的延迟。虽然你可能认为大部分延迟来自于从\
    \ A 大陆到 B 大陆缆线的传输时间，但瓶颈实际上位于从浏览器到 ISP 的路径上。这种延迟取决于从终端用户家中到服务者的布线、所部署的技术以及一天的时间。根据这些标准选择服务商将有助于减少终端用户的延迟。然而，作为网站所有者，你对此能影响有限。\n\
    \n`traceroute` 是一个用于测量延迟（例如，你与 ISP 之间）的命令行工具。这里是一个示例：\n\n```\ntraceroute to bbinto.me\
    \ (23.229.170.160), 64 hops max, 52 byte \npackets\n1  7.11.164.201 (7.11.164.201)\
    \  22.272 ms  8.525 ms  8.197 ms\n2  7.11.164.201 (7.11.164.201)  7.846 ms  11.971\
    \ ms  33.085 ms\n3  209.148.243.105 (209.148.243.105)  24.445 ms  13.891 ms  11.978\
    \ \nms // my ISP\n...\n13 be38.trmc0215-01.ars.mgmt.phx3.gdg (184.168.0.69)  100.097\
    \ ms  \n67.337 ms  74.092 ms\n```\n\n第 #3 行显示了到我 ISP 的延迟，测量了三次，范围在约 `12ms` 到 `25ms`\
    \ 之间。第一列描述了请求到达 bbinto.me 需“经过”的跳数。到达 bbinto.me 经过了 13 次跳跃：第 #13 行描述了 GoDaddy\
    \ 服务器，即终极目的地。\n\n## 监控性能\n\n到目前为止，我们已经查看了一些衡量网站性能的工具。在本节中，我们将关注监控网站性能的两种技术。第一种被称为“合成测试”（synthetic\
    \ testing），涉及设计我们自己的离散测试。第二种被称为“真实用户监控”（real user monitoring），涉及研究实际终端用户的行为。\n\
    \n### 合成测量\n\n`Synthetic` 测试是开发者可用的最常见且可控的测量工具。与真实用户监控相反，合成测试是由你执行的，并由你控制。你决定何时以及如何对你的网站运行测试。你可以选择特定的条件，例如浏览器、网络状况和/或地理位置。\n\
    \n你可以使用我们之前已经讨论过的免费工具来进行合成测试——如 `WebPagetest`、`PageSpeed Insights` 甚至你浏览器的开发者工具。\n\
    \n### WebPagetest\n\n我们在本章前面的部分简要讨论了 `WPT`。让我们看看它的其他功能，这些功能使我们能够对自己的网站执行合成测试。\n\
    \n图 3.11 显示了其主要功能的概览：\n\n![Basic view of the WPT interface, waiting for your input](img/3-wp-intro.png)\n\
    \n图 3.11 WPT 界面的基础视图，等待输入\n\n输入分为两个部分——基础信息（例如要测试的 URL）和高级设置（例如定义测试运行的次数）。\n\n\
    让我们先看基础设置：\n\n* **Test Location (测试位置)**：选择你想要获取性能结果的地理位置。这可能是你大多数访问者所在的地方，甚至是几乎没有访问者来自的地方。你也可以根据收到的投诉来选择位置——例如来自某个体验较糟糕国家的访问者的投诉。\n\
    * **Browser (浏览器)**：你可以从广泛的浏览器列表中选择，包括几个移动版本。\n\n在 Advanced Settings（高级设置）下有许多不同的选项可选。例如，`Connection`\
    \ 允许你精确定义测试 URL 时使用什么连接速度，`Repeat View`重复视图）帮助你查看有无缓存的网站性能。`Number of Tests to\
    \ Run`运行测试次数）帮助你找到所有运行的平均值。你还可以将测试录制为视频，并按需命名。如果要测试的网站需要身份验证，可以使用 `Auth` 标签填写所需的凭据。\n\
    \n图 3.12 显示了高级设置：\n\n![WPT's Advanced Settings interface](img/3-wp-advanced.png)\n\
    \n图 3.12 WPT 的高级设置界面\n\n#### 结果页面\n\n`WebPagetest` 结果页面提供了丰富的性能数据——例如 `ATF`（首次内容绘制）胶片、对来自第三方脚本与你自有域字节数的评估，以及浏览器\
    \ CPU 时间何时达到峰值的详细信息。\n\n例如，我输入了 `Time.com`，位置设为 `Dulles, VA`，使用 `Firefox` 并在电缆连接下作为测试场景。下图显示了相应的结果：\n\
    \n![WPT result page for Time.com](img/3-wpt-results.png)\n\n图 3.13. Time.com 的\
    \ WPT 结果页面\n\n逐一考虑截图中的每个编号项目：\n\n1. 评分区域（右上角）为你提供了网站性能的简要概述。绿色和 A 级越多越好。\n2. 有多个视图可以查看：`Summary`（摘要）标签页提供了足够的概览。\n\
    3. 表格列出了重要指标的细分。我们之前讨论了其中大部分内容。两行包含了第一次运行（假设之前未被访问过）和第二次运行的数据。第二次运行显示了网站是否利用了缓存（如果利用了，是如何利用的）。\n\
    4. 结果页面的其余部分包括瀑布图和截图，展示了网站渲染的路径。瀑布图通过颜色编码帮助你理解每个资源在加载上花费了大部分时间。\n5. 你还可以利用一些未显示的工具，例如将测试结果导出为\
    \ `HAR` 或 `CSV` 格式以便进一步调查。\n\n#### 注意：什么是 HAR？\n\nHTTP 存档文件的正式格式被称为 HAR。它是一种 `JSON`\
    \ 格式，提供了交换网络瀑布的简单方法（见下文），无需分享截图。`HAR` 是一种可以导出并导入许多其他[工具](https://gist.github.com/igrigorik/3500508)的文件格式。\n\
    \n##### WPT 瀑布图\n\n在我看来，WPT 的瀑布图是调查性能问题的最佳工具——提供比浏览器开发者工具包含的信息多得多。\n\n##### 域名和内容分解对于评估第三方脚本的影响非常有用，并立即识别出什么类型的内容了大部分字节和请求。\n\
    \n### 注意：排队\n\n如果你在公共 WebDetailPage 实例上运行多次测试，取决于一天的时间，你会发现它可能非常忙碌。你的测试运行可能会与其他用户的许多测试一起排队列中。如果你觉得你的测试不能总是等待，我建议你考虑安装[自己的\
    \ WPT 实例](https://sites.google.com/a/webpagetest.org/docs/private-instances)。这确实为你运行测试时提供了更多的灵活性和自由。否则，你必须等待，直到\
    \ WPT 引擎调用你的性能测试。\n\n##### 唯一 ID\n\n"
