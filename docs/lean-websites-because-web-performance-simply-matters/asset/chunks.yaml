- fmt: "\n# Structuring your website into logical directories can be very beneficial\
    \ when creating a caching policy. Review your assets and split them into multiple\
    \ directories based on their nature. For example, branding and logo files that\
    \ rarely change could be stored in a folder of assets to be cached for a long\
    \ time, while dynamic content could be stored in a separate folder with a short\
    \ cache time.\n\nLet's take a look at an example. My website is a WordPress blog,\
    \ and I don't intend to change the design of it that often. So setting a longer\
    \ time in the cache for my theme files makes perfect sense. Furthermore, I try\
    \ to update my website with a new blog post every two to three months, depending\
    \ on my schedule. So I want to make sure that I'm taking this writing schedule\
    \ into consideration when setting the cache policy for the HTML files. To be on\
    \ the safe side, let's set it to one month. I also decided to set a cache value\
    \ of one year for all my uploads, such as images, PDFs, and text files, assuming\
    \ they rarely change once I've uploaded them.\n\nSince I have different expiration\
    \ times for each of those folders, I'll need to create a separate `.htaccess`\
    \ file for each folder.\n\nLet's update the `.htaccess` files according to my\
    \ proposed caching goals.\n\n* `/var/www/htdocs/bbinto.me/.htaccess`:\n```\n<ifModule\
    \ mod_headers.c>\n    ExpiresActive On\n    # Expires after 1 month\n    <filesMatch\
    \ \".(html)$\">\n    Header set Cache-Control \"max-age=2592000\"\n    </filesMatch>\n\
    </ifModule>\n```\n\n* `/var/www/htdocs/bbinto.me/wp-content/themes/matheson/.htaccess`:\n\
    ```\n<ifModule mod_headers.c>\n    ExpiresActive On\n    # Expires after 6 months\n\
    \    Header set Cache-Control \"max-age=15552000\"\n</ifModule>\n```\n\n* `/var/www/htdocs/bbinto.me/wp-content/uploads/.htaccess`:\n\
    ```\n<ifModule mod_headers.c>\n    ExpiresActive On\n    # Expires after 1 year\n\
    \    Header set Cache-Control \"max-age=31104000\"\n</ifModule>\n```\n\nIf you\
    \ have direct access to your web server's config file (on Apache, it would be\
    \ `httpd.conf`), you can use `<Directory>` to define all folders in one config\
    \ file instead of putting separate `.htaccess` files into each directory individually:\n\
    \n```\n# Expires after 6 months\n<Directory \"/var/www/htdocs/bbinto.me/wp-content/themes/matheson\"\
    >\n    Header set Cache-Control \"max-age=15552000\"\n</Directory>\n\n# Expires\
    \ after 1 month\n<filesMatch \".(html)$\">\nHeader set Cache-Control \"max-age=2592000\"\
    \n</filesMatch>\n\n# Expires after 1 year\n<Directory \"/var/www/htdocs/bbinto.me/wp-content/uploads/\"\
    >\n    Header set Cache-Control \"max-age=31104000\"\n</Directory>\n```\n\nAs\
    \ shown above, I applied some simple rules to files and folders, but you could\
    \ also include regular expressions to include or exclude certain content types\
    \ or directories.\n\nAfter I finished setting up my caching policy, I ran my site\
    \ through WPT [without](http://www.webpagetest.org/result/141019_C0_MWG/1/details/cached/)\
    \ and [with](http://www.webpagetest.org/result/141019_TB_MY7/1/details/cached/)\
    \ the cache policy in place. For this example, I only compared the Repeat view\
    \ results, as that will reflect use of the cache settings.\n\n| | Without cache\
    \ | With cache | Savings |\n| --- | --- | --- | --- |\n| **Load Time** | 6.629s\
    \ | 2.485s | 62% |\n| **Start Render** | 3.108s | 1.120s | 63% |\n| **Speed Index**\
    \ | 4296 | 1108 | 74% |\n\nAs you can see, using the cache can make a significant\
    \ difference to the performance of the page. Google has a useful [decision tree](https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching?hl=en#defining-optimal-cache-control-policy)\
    \ to help you decide how to set up efficient caching policies.\n\n### Tip: Using\
    \ Developer Tools to Check Caching\n\nThe developer tools in your browser normally\
    \ have a check box that you can enable or disable to see how the website loads\
    \ with and [without the cache set](http://devtoolsecrets.com/secret/performance-disable-the-browser-cache.html).\n\
    \nYou can either find the option under the Network tab (Chrome), under Settings\
    \ (Firefox), or under the Developer tools menu (Safari).\n\n### Caching Tips\n\
    \nIt's worth noting that there is no caching silver bullet that you can apply\
    \ to all the assets of your site. Take your time auditing and defining your resources\
    \ and their optimal cache lifetime. Each asset will have different “freshness”\
    \ requirements. Here are a few [tips](https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching#caching-checklist)\
    \ to get you started thinking:\n\n*   For static assets, or assets that rarely\
    \ change, Google suggests setting an expiration policy of [one year](https://developers.google.com/speed/docs/insights/LeverageBrowserCaching),\
    \ or minimum of one week. For example, there's no need to re-fetch an asset if\
    \ it rarely changes, such as a logo.\n*   Use consistent URLs―don;t serve the\
    \ same content through different URLs. additionally, pay attention to how they\
    \ are typed in. As URLs are case sensitive, the same page could be cached multiple\
    \ times unnecessarily.\n*   Define a cache policy for your assets: differentiate\
    \ between often changing assets vs. very static assets that rarely change. Audit\
    \ and determine the appropriate `max-age` for these assets.\n*   If you use a\
    \ CDN, identify the assets that are identical for all your users. These are good\
    \ candidates for CDN caching.\n*   As mentioned before, think before you concatenate.\
    \ For example, before merging all your JavaScript files into one, evaluate if\
    \ there might be a piece of your web application that changes more frequently,\
    \ and consequently the corresponding JavaScript code that comes with it. Separate\
    \ this file with a less aggressive cache policy.\n\n## Cool Down\n\n*   You've\
    \ learned how a CDN works and how it can reduce latency.\n*   You've been introduced\
    \ to the PageSpeed Insights web server module, which includes several useful performance-enhancing\
    \ filters, such as `canonicalize_javascript_libraries` and `combine_css`.\n* \
    \  You've learned about the challenges for HTTP/1.1 in keeping up with today's\
    \ web demands, and that HTTP/2 has been introduced to address these issues—including\
    \ latency, which is one of the biggest challenges for the web.\n*   You've learned\
    \ how you can gain great performance improvements with some simple adjustments\
    \ to your web server setup, such as gzipping and using `keep-alive`.\n*   You've\
    \ been introduced to caching policies and how to set them up.\n\n* * *\n\n[^([3])](#ch09.html_d5e3594)\
    \ http://www.modpagespeed.com/ provides a list with before-after samples of applying\
    \ the mod_pagespeed filters.\n[^([4])](#ch09.html_d5e3681) IETF is an open, international\
    \ community of network designers, operators, vendors, and researchers concerned\
    \ with the evolution of the Internet architecture and the smooth operation of\
    \ the Internet. The goal of the IETF is to make the Internet work better.\n[^([5])](#ch09.html_d5e3781)\
    \ Intermediate caches are caches between the edge and the user, such as corporations\
    \ and schools that have a cache in their network.\n\n# Chapter 10: A Multi-device\
    \ Web World\n\n## Warm Up\n\nWe've covered lots of ways to optimize site performance,\
    \ but we still need to discuss how to serve the right content to users based on\
    \ their device and the circumstances they're in. Getting this right can also result\
    \ in significant performance improvements.\n\nDetecting devices is a crucial part\
    \ of this. In this chapter, we'll look at how to identify if your users are on\
    \ a laptop, tablet or smartphone, and if they're on a fast or slow connection.\
    \ We'll also look at why performance on mobile devices is especially important.\n\
    \n## One Web in a Multi-device World\n"
