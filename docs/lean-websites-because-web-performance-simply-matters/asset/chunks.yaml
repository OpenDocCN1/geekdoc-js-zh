    The wireframe shown in [Figure 2.5](#ch02.html_ch2-mpm-wireframe "Figure 2.5.
    The Time.com website sketched out in wireframe") was sketched based on one of
    the [most common screen sizes](http://www.w3schools.com/browsers/browsers_display.asp)
    of today: 1366x768px. If you know your visitors'' most used screen size, sketch
    it out based on that:


    ![The Time.com website sketched out in wireframe](OEBPS/figures/2-wf-time-mpm.png)


    Figure 2.5. The Time.com website sketched out in wireframe


    ![Time.com wireframe, including MPMs with order of appearance](OEBPS/figures/2-wf-time-order.png)


    Figure 2.6. Time.com wireframe, including MPMs with order of appearance


    I plotted the MPMs onto the wireframe in the image above, indicated by the dotted
    boxes. The number in each box describes the order in which each MPM appears on
    the screen. For example, the menu box was loaded first.


    Here''s the above the fold count of each MPM, categorized as low impact, medium
    impact, and high impact:


    | Count | Module | Score |

    | --- | --- | --- |

    | 10 | Low impact | 10 |

    | 2 | Medium impact | 4 |

    | 2 | High impact | 12 |

    | **14** | **Total** | **26** |


    By checking the file sizes of each MPM, you can assess each MPM''s impact. As
    mentioned before, this is mainly intended to bring design and developers together
    to quickly sketch out performance impacts of the different content modules. It
    lets you easily determine elements that might be too heavy to present above the
    fold.


    ### Suggested Performant Order based on MDMs


    By making some adjustments to the site, we should be able to improve perceived
    performance. Although Time.com uses progressive JPEGs for their main story image,
    it seems that the image doesn''t get the early attention it needs. Something in
    the code seems to be blocking its rendering, so that a user only sees it after
    5.7 seconds.


    Even if the main news image is classified as a high impact module, I would argue
    that, in this case, it is important to load this image as early as possible. So
    my proposed performant wireframe for Time.com could look like [Figure 2.7](#ch02.html_ch2-performant
    "Figure 2.7. A performant wireframe for Time.com"):


    ![A performant wireframe for Time.com](OEBPS/figures/2-wf-time-performant.png)


    Figure 2.7. A performant wireframe for Time.com


    Here is a new ATF count of MPMs, based on my changes:


    | Count | Module | Score |

    | --- | --- | --- |

    | 12 | Low impact | 12 |

    | 3 | Medium impact | 6 |

    | 1 | High impact | 6 |

    | **16** | **Total** | **24** |


    I decreased the image height and width of the main story image, placing more context
    next to the image by aligning the headline and description to the right. I also
    replaced the stock data widget with a CTA button that the user has to press. Only
    when pressed will the stock data be loaded, which will somewhat reduce the ATF
    load time.


    I also added some loading number priorities into the wireframe, so the developers
    will know where to put their focus when planning out the critical rendering path
    (which is a topic we''ll discuss later).


    If you''re not sure which widgets and elements should be either removed or moved
    down below the fold, verify if those widgets and elements are actually used by
    your visitors. And if you decide that a heavy image (high impact MPM) should be
    placed above the fold, make sure to balance the performance budget with other
    low and medium impact modules.


    A performant wireframe is not enough to make your website feel fast, but it''s
    an excellent start on your journey to a lean website.


    ## Cool Down


    In this chapter, we covered the following topics:


    * ways to take performance into consideration and plan it out, early on

    * how to “fake” a fast website

    * the importance of perceived performance

    * the idea of a performance point system and MDMs


    One of the most important rules for performance is quantifying whether performance
    is good or bad. While *perceived* performance is an important aspect of web performance,
    the *actual* performance of the site is important too—and that can only be determined
    by measuring and monitoring. You can''t improve something that you haven''t measured
    first. The next chapter will introduce you to several important metrics, techniques
    and tools for measuring and monitoring site performance.


    # Chapter 3: Measuring & Monitoring Performance


    ## Warm Up


    In the effort to improve something—be it a website or other product—it helps to
    be able to measure progress. Without effective measurement, it''s hard to determine
    if something has improved or gotten worse. Fortunately, there are many tools at
    our disposal for testing and monitoring your website''s performance. That''s the
    focus of this chapter.


    ## Measuring Performance


    In this section, we''ll look at several tools for measuring and monitoring web
    performance.


    ### HTTP Archive: Tracking Performance Trends


    [HTTP Archive](http://httparchive.org) is a free, online service that crawls the
    top 1 million Alexa websites to collect data on how these websites are built.
    You can use it to explore trends such as page sizes, load time, content delivery
    network (CDN) usage, distribution of different content types (such as images,
    JavaScript and so on), and many [other stats](http://httparchive.org/interesting.php).


    Here''s an example of the interesting data the HTTP Archive presents:


    * **Total transfer size and total requests**: the overall website page size is
    consistently growing. From 2012 to 2014, the page size went up by around 38%:


    | Year (August 1) | [Total transfer size](http://httparchive.org/about.php#bytesTotal)
    | Increase over previous year in % |

    | --- | --- | --- |

    | 2012 | 1124 | - |

    | 2013 | 1532 | 27 |

    | 2014 | 1821 | 16 |


    *HTTP Archive stats: Average Total Transfer Size and Total Requests from August
    2012–14 for a single Top Alexa website*


    * **JavaScript transfer size**: with all the trending JavaScript web applications,
    it''s no wonder that JavaScript transfer size increased by more than 100%, from
    113Kb in 2011 to around 289Kb in 2014.


    * **Image formats**: the HTTP Archive can help you answer questions like “What''s
    the most common image type used?” As you can see, the answer is JPEG:


    ![Image requests by format](OEBPS/figures/3-httparchive-images.png)


    Figure 3.1. Image requests by format


    Data of this kind is useful for understanding how your site compares with current
    standards.


    The image below shows [stats](http://httparchive.org/viewsite.php?pageid=17936268*)
    from Time.com. If you''re a news corporation, you might want to compare your site''s
    stats with these. You can spot trends here. For example, Time.com seems to have
    reduced image file sizes as well as requests, which might indicate a trend in
    website optimization:


    ![HTTP Archive''s data for Time.com](OEBPS/figures/3-httparchive-time.png)


    Figure 3.2. HTTP Archive''s data for Time.com


    The HTTP Archive provides a great introduction to the world of performance trends—answering
    many of the questions you or others in your company might have. It can also help
    your team focus on a specific direction. For example, if you''re thinking of using
    a specific image format or following a particular trend, the HTTP Archive can
    help to back up that decision.


    ### Useful Performance Tools


    There are many different tools available for measuring website performance, including
    commercial products like [New Relic](http://newreic.com/application-monitoring),
    [Keynote](http://www.keynote.com/) or [Neustar](http://www.neustar.biz/). Before
    you shell out money for a tool, though, it''s worth trying open source tools such
    as your browser and [WebPagetest](http://www.webpagetest.org). In this section,
    we''ll look at what you can do with both of these.


    #### Browser-based Developer Tools

