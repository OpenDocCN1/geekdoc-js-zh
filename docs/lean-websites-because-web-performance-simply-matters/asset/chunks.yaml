- fmt: "\nIn addition, they provide sharing options so you can include your video\
    \ on your own website. Online video platforms have powerful servers that deliver\
    \ reliable video content. They normally offer a `Flash` and `HTML5` version of\
    \ the source as well, making it easily accessible and optimized even on a mobile\
    \ device.\n\nYou could also host the video on your own web server, though some\
    \ hosting providers limit the amount of bandwidth and data that can be downloaded\
    \ from your website.\n\n## Web Fonts\n\nYou can use custom `web font` fonts to\
    \ display fonts that are not installed on the visitor's computer. Using a web\
    \ font can be especially helpful when a specific font is part of your corporate\
    \ identity. In [Figure 7.4](#ch07.html_ch7-airbnb \"Figure 7.4. airbnb.com uses\
    \ several custom fonts, shown via developer tools\") you can see that airbnb.com\
    \ makes use of several web fonts:\n\n![airbnb.com uses several custom fonts, shown\
    \ via developer tools](OEBPS/figures/7-web-fonts-example.png)\n\nFigure 7.4. *airbnb.com\
    \ uses several custom fonts, shown via developer tools*\n\nWeb fonts have become\
    \ very popular in recent years. According to HTTP Archive, in October 2014 [48%](http://httparchive.org/trends.php)\
    \ of the top 1 million Alexa websites were using web fonts. However, web fonts\
    \ come with a performance price. So how do you include web fonts without overly\
    \ impacting your site's performance?\n\nYou should decide if you want to store\
    \ the fonts on your server or include them via an external font hosting service.\
    \ Storing font files on your own server does add to your bandwidth usage, though\
    \ it saves your browser and extra DNS lookup—which it has to perform when retrieving\
    \ fonts from a third-party hosting service. However, external hosting services\
    \ can provide you with optimized solutions to deliver a smooth experience for\
    \ the user, usually with minimal performance impact.\n\n### Hosting Fonts on Your\
    \ Own Server\n\nIf you want to host a web font on your own server and call it\
    \ via the standard `@font-face` CSS selector—and have the font rendered by all\
    \ browsers and platforms—you'll need to make it available in [WOFF](http://caniuse.com/woff),\
    \ [TTF](http://caniuse.com/ttf), [EOT](http://caniuse.com/eot) and [SVG](http://caniuse.com/svg)\
    \ formats. In time, it's hoped that WOFF will be supported by all browsers. WOFF\
    \ is special in that is can be encoded in base64, as a data URI—and as we learned\
    \ previously, data URI encoding can be beneficial for performance, as it reduces\
    \ the number of HTTP requests we need to make.\n\nBefore adding web fonts to your\
    \ site, be sure to optimize them. Web fonts vary enormously in size, partly depending\
    \ on the number of characters they contain. You may only need a few hundred characters,\
    \ while fonts with comprehensive Unicode coverage can contain thousands of character\
    \ forms, or `glyphs`. You can actually remove unneeded glyphs from a font file\
    \ to make it smaller with the help of tools like [Glyphs](http://www.glyphsapp.com/)\
    \ and [FontForge](http://fontforge.github.io).\n\n### External Font Hosting\n\n\
    Instead of hosting web fonts on your own server, you can opt for one of the many\
    \ third-party font services, such as [Google Fonts](http://www.google.com/fonts)\
    \ or [TypeKit](https://typekit.com/). All you need to do with these services is\
    \ to select a few options to retrieve a simple line of code to include on your\
    \ site. You do pay a performance price for this, by accepting another DNS lookup;\
    \ but by choosing a popular web font, you might be able to benefit from `cross-site\
    \ caching`. Cross-site caching means that by using a popular, hosted font, the\
    \ chances are high that your visitor already has the font cached from a previously\
    \ visited site. It's worth checking out [Google Fonts Analytics](http://www.google.com/fonts#Analytics:total)\
    \ to find the most popular of its web fonts.\n\nWhen selecting a Google font,\
    \ you have the option of defining your character set with a parameter in the API\
    \ call:\n\n```\n<link href=\"http://fonts.googleapis.com/css?family=Open+Sans&subset=\n\
    ↵latin\" rel=\"stylesheet\">\n```\n\nGoogle Fonts offers a helpful performance\
    \ gauge for determining the page-load-time impact of including its fonts on your\
    \ site. In [Figure 7.5](#ch07.html_ch7-web-font-simple \"Figure 7.5. Google Fonts\
    \ service with performance gauge\") you can see that including a relatively simple\
    \ and limited character set has a small impact, while [Figure 7.6](#ch07.html_ch7-web-font-fat\
    \ \"Figure 7.6. Google Fonts service with performance gauge, showing a performance\
    \ alert\") shows that including multiple fonts with multiple sets has a much greater\
    \ impact:\n\n![Google Fonts service with performance gauge](OEBPS/figures/7-web-fonts-simple.png)\n\
    \nFigure 7.5. Google Fonts service with performance gauge\n\n![Google Fonts service\
    \ with performance gauge, showing a performance alert](OEBPS/figures/7-web-fonts-fat.png)\n\
    \nFigure 7.6. Google Fonts service with performance gauge, showing a performance\
    \ alert\n\nWith Google fonts, if you know that you only need one word in a particular\
    \ web font, you can use the `text` parameter to specify just the characters you\
    \ need. By using character subsetting, you guarantee the best optimization for\
    \ the font, as you only request the characters for the specific word:\n\n```\n\
    <link href=\"http://fonts.googleapis.com/css?family=Inconsolata&amp;\n↵text=Welcome%20Readers!\"\
    \ rel=\"stylesheet\">\n```\n\nOnce you've settled on one (or more than one) web\
    \ font, make sure to asynchronously include it to avoid render blocking.\n\nHowever,\
    \ if using asynchronous options, you run into the risk of showing your users a\
    \ FOUT (flash of unstyled text). [Most browsers](https://www.igvita.com/2014/01/31/optimizing-web-font-rendering-performance)\
    \ have adopted FOUT. Chrome and Firefox share the same behaviour when dealing\
    \ with loading of custom fonts: they timeout after 3 seconds and use a fallback\
    \ font, and only re-render the text once the font download has completed. IE immediately\
    \ renders the content with the fallback font, re-rendering once the custom font\
    \ is loaded. Safari suspends font rendering until the font has completely downloaded.\
    \ Google has worked together with TypeKit to provide a performant Web Font Loader\
    \ to combat FOUT, which we'll discuss next.\n\n### Web Font Loader\n\nThe [Web\
    \ Font Loader](https://github.com/typekit/webfontloader) (WFL) provides added\
    \ control over linked fonts using the `@font-face` attribute. The idea is to help\
    \ prioritize these assets—for example, by scheduling when to download the font,\
    \ or how the font should be rendered (synchronously or asynchronously). It fights\
    \ the FOUT effect by first [wrapping the entire HTML content](https://decadecity.net/talks/using-a-web-font-loader)\
    \ in a `wf-loading` class. The content of `wf-loading` is hidden at first. Once\
    \ the fonts have loaded, the content visibility is brought back with the `wf-active`\
    \ class, including a fade-in effect.\n\nThe example below shows Open Sans and\
    \ Satisfy being loaded via WFL:\n\n```\n<script>\n      WebFontConfig = {\n  \
    \    google: {\n        families: ['Open Sans', 'Satisfy']\n      }\n   };\n\n\
    \  (function() {\n    var wf = document.createElement('script');\n    wf.src =\
    \ ('https:' == document.location.protocol ? 'https' :\n↵ 'http') +\n         \
    \     '://ajax.googleapis.com/ajax/libs/webfont/1.5.6/\n↵webfont.js';\n    wf.type\
    \ = 'text/javascript';\n    wf.async = 'true';\n    var s = document.getElementsByTagName('script')[0];\n\
    \    s.parentNode.insertBefore(wf, s);\n  })();\n</script>\n```\n\nMore information\
    \ on configuration, and how to include TypeKit fonts, can be found in the WFL\
    \ documentation.\n\n### Note: Font Load Events API\n\nThe new [Font Load Events\
    \ API](http://dev.w3.org/csswg/css-font-loading/)—currently in draft mode—will\
    \ eventually give full control over managing how and when fonts are loaded and\
    \ rendered. However, until this API is fully supported in all browsers, I suggest\
    \ you use WFL.\n\n### Web Font Tips\n"
