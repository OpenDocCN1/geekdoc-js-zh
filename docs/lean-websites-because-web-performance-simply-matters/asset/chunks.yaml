    \ and ask questions.\n\n## PageSpeed Insights\n\n`PageSpeed Insights` (introduced\
    \ earlier in this chapter) offers an interface for running synthetic performance\
    \ tests on a specific site. Following a test, you're presented with a result page\
    \ like the one pictured:\n\n![PageSpeed Insights data for time.com](OEBPS/figures/3-pagespeed-result.png)\n\
    \nFigure 3.14. `PageSpeed Insights` data for time.com\n\n`PageSpeed Insights`\
    \ lacks some of the features of `WPT`, such as the advanced settings, the selection\
    \ of test locations, a very detailed waterfall view, and a unique ID for each\
    \ test. `PageSpeed Insights` only lets you type in the URL of the website. However,\
    \ it automatically includes the test results for mobile users (something a `WPT`\
    \ user needs to choose explicitly). `PageSpeed Insights` also focuses more on\
    \ optimization than `WPT`, offering helpful suggestions for optimizing your site.\n\
    \n## Browser Extensions and Plugins\n\nThere are various browser plugins and extensions\
    \ offering additional ways to test your site's performance. Extensions like `Firebug`,\
    \ `YSlow`, and `PageSpeed Insights` allow you to analyze your website on the spot\
    \ via the browser.\n\nHere is a quick summary of some of the tools available and\
    \ their functionality:\n\n*   [**Firebug**](http://getfirebug.com/) helps you\
    \ to inspect, log, profile, analyze and debug the page you are viewing in your\
    \ browser. The `Net` tab is especially handy for analyzing performance, as it\
    \ presents all `HTTP` requests in a very detailed waterfall view.\n\n*   [**YSlow**](https://developer.yahoo.com/yslow/)\
    \ can be installed as an add-on to the `Firebug` extension, but can also be added\
    \ as a stand-alone plugin for most browsers. `YSlow` is the browser plugin answer\
    \ to `PageSpeed Insights` and `WPT`. `YSlow` analyzes your web page according\
    \ to [Yahoo's rules for high performance websites](https://developer.yahoo.com/performance/rules.html).\
    \ It includes tools that not only help you diagnose but also triage on the spot.\n\
    \n*   [**PageSpeed Insights**](https://developers.google.com/speed/pagespeed/insights_extensions)\
    \ is available as plugin for `Chrome` and `Firefox`, providing suggestions on\
    \ how to make your page faster. In addition, it rates the page based on several\
    \ [rules](https://developers.google.com/speed/docs/insights/rules).\n\n*   [**ShowSlow**](http://www.showslow.com/)\
    \ is an open-source website service as well as browser plugin that helps you monitor\
    \ performance patterns. It combines the results of major performance tools including\
    \ `YSlow`, `Page Speed` and `WebPageTest`.\n\n## Advanced Analytical and Programming\
    \ Tools\n\nIn addition to the tools above, there are some advanced analytical\
    \ and programming tools you can use for synthetic measurement.\n\n### The Power\
    \ to Query = Big Query + HTTP Archive\n\nThe current `HTTP Archive` `SQL` dump\
    \ is around 400Gb of raw data. You probably don't want to download and import\
    \ this into your database. How about using a tool that already has all the data\
    \ imported, ready for you to query against? The answer is [Big Query](https://cloud.google.com/bigquery/what-is-bigquery).\
    \ `Big Query` is a Google database tool that allows you to query big sets of databases\
    \ via the browser. You can easily load the `HTTP Archive` project into your `Big\
    \ Query` profile, and run any query you like against the `HTTP Archive`, while\
    \ enjoying a blazing fast Google infrastructure.\n\nThis tool is very handy if\
    \ you want to ask questions that haven't been answered by the `HTTP Archive`.\
    \ For example, what are the most common third-party scripts? Check out [BigQueri.es](http://bigqueri.es/),\
    \ a great community resource for finding answers to all sorts of performance questions.\n\
