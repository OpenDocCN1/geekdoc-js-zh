    \ taken from [Web Performance Today](http://www.webperformancetoday.com/2012/05/14/cdn-feo-front-end-optimization-web-acceleration/)\n\
    \n |\n\nThe servers available throughout a CDN are called **edge servers**, and\
    \ distributing multiple copies of a site's content across these servers is called\
    \ **content replication**. Most CDN providers maintain lots of edge servers around\
    \ the world, making CDNs particularly useful for sites that serve content to many\
    \ countries.\n\n[Figure 9.1](#ch09.html_ch9-cdn-example \"Figure 9.1. Demonstration\
    \ of a CDN in action\") illustrates how a website is accessed within a CDN. As\
    \ soon as a page is requested, the optimal server is determined either by the\
    \ amount of hops needed for the request to reach the server, or by which has the\
    \ highest availability:\n\n![Demonstration of a CDN in action](OEBPS/figures/9-cdn-example-external.png)\n\
    \nFigure 9.1. Demonstration of a CDN in action\n\nThe benefits of using a CDN\
    \ include:\n\n*   **Reduced latency:** by moving the content closer to the user,\
    \ latency can be reduced and load times improved. Due to content replication and\
    \ caching of static content at the edge, the user can benefit from cached content\
    \ and faster delivery times.\n\n*   **Reduced packet loss:** because packages\
    \ travel shorter distances, there's less chance they'll be lost. This is particularly\
    \ important in latency-sensitive situations, such as video streaming. A poorly\
    \ streaming video will certainly decrease user satisfaction.\n\n*   **Improved\
    \ reliability:** having content replicated across a CDN improves a website's up-time,\
    \ as the site isn't dependent on a single server.\n\n## PageSpeed Insights for\
    \ Your Web Server\n\nPageSpeed Insights is available as a [back-end module](https://developers.google.com/speed/pagespeed/module)\
    \ that can be installed on your server. The module comes with many useful [filters](https://developers.google.com/speed/pagespeed/module/filters)\
    \ that can be installed to optimize your code. The module optimizes the code without\
    \ requiring you to modify the existing content, executing when the HTTP server\
    \ delivers the assets. It's basically a performance improvement “on the fly”.\n\
    \nThe following sections briefly cover a few of the filters that are worth mentioning\
    \ in the context of reducing HTTP requests, and therefore latency[^([3])](#ch09.html_ftn.d5e3594).\n\
    \n### Canonicalize JavaScript Libraries\n\njQuery is one of the most popular JavaScript\
    \ libraries in use today. Imagine you navigate from website A—which is using jQuery—to\
    \ website B—which also uses jQuery. The browser automatically fetches the jQuery\
    \ script again from website B, even though it was just requested from website\
    \ A."
