  trans: '


    网络社区对于在构建高性能（移动端）网站或 Web 应用程序时采用何种方法存在多种讨论。一方面，有一种观点是先将所有所需内容发送到浏览器，然后让客户端决定显示哪些内容。这种方法的优势是，一旦所有内容都到达客户端端，浏览网站的速度会更快，因为所有必要的资产已经通过网络传输完成。另一方面，你也可以让服务器在发送内容到客户端
    `之前` 就决定显示哪些内容——在首次加载时仅提供绝对必要的资产。这改进了首字节时间（TTFB）和初始加载时间，随后根据需要获取更多资产。可以使用服务器端编程语言如
    `PHP`、`Perl`、`ASP.NET`、`Java`、`Python`甚至是位于 `CDN` 上的 `Edge Side Includes`（边缘包含）来检测用户的设备。


    我的建议是，如果你可以在服务器端进行设备检测，请选择这种方法而不是客户端检测。页面到达后，你让浏览器执行的任何操作都会消耗电时间和数据。


    以下是一些用于服务器端设备检测的实用工具：


    * [Detect Mobile Browsers](http://detectmobilebrowsers.com/) 是移动端检测的极佳资源，提供了许多客户端和服务器端的解决方案。

    * [51 Degrees](http://51degrees.com/Support/Documentation) 为大多数常见的服务器端编程语言提供了设备管理系统以及设备检测功能。

    * [Apache Mobile Filter](http://fiftyone.apachemobilefilter.org/) 是基于 `Apache`
    的检测移动设备的过滤器。


    ## CDN 选项


    [Edge Side Includes](http://www.w3.org/TR/esi-lang) (`ESI`) 是一种基于 XML 的标记语言。`Akamai`、`F5`
    和 `Varnish` 等 `CDN` 供应商提供 `ESI` 支持。如果你使用这些任何一个供应商，就可以使用 `ESI`。`ESI` 可用于缓存，最终将帮助提升移动端性能。


    如果你熟悉 [Server Side Includes](http://en.wikipedia.org/wiki/Server_Side_Includes)
    (`SSI`) 和 `XML/XSLT`，那么理解 `ESI` 将没有问题。它支持基于 `HTTP request attributes` 访问变量。例如，你可以轻松检查
    `HTTP_HEADER` 中的任何字段，因此也可以检查 `HTTP_USER_AGENT` 属性。


    `ESI` 还可以通过 `include` 命令包含额外内容的片段。为了使这种功能更强大，`ESI` 支持条件处理，这意味着可以根据如用户代理字符串等特定条件应用逻辑，通过
    `include` 执行特定内容。例如，你可以仅为支持 GPS 的设备包含地图，或仅在桌面级设备上显示大视频。所有这些都由边缘服务器（即离用户用户的服务器）完成。用户永远不会接收到他们不应该接收的内容，也不会传输任何不需要的数据。此外，在处理
    `ESI` 时，不需要返回源站进行处理，从而减轻了源站的负载。


    你可以通过给 `ESI` 变量赋值正则表达式来创建设备列表，并使用它来检测用户代理字符串（user-agent strings），如下所示：


    ```

    <esi:comment text="Regular expression to match tablets'' user agents"/>

    <esi:assign name="tablet" value="''(iPad|Nexus 10|PlayBook|Xoom|hp-tablet|Dell
    Streak)''"/>

    ```


    你可以使用 `WURFL` 或任何其他设备目录，根据最新的设备和你定义的标准来自动填充此变量。


    ## 客户端选项


    客户端设备检测在客户端执行，因此处理的是已经送达的内容。如果你决定使用客户端方法，可以通过在 `JavaScript` 中请求 `navigator.userAgent`
    的值来检测用户代理字符串。


    Detect Mobile Browsers 提供了客户端选项。[Device.js](https://github.com/matthewhudson/device.js/)
    是另一个轻量（3KB）且可靠的 `JavaScript` 设备检测解决方案，并基于此针对用户体验。


    ## Client Hints（客户端提示）


    到目前讨论的大多数解决方案都有代价：你要么必须使用你的 Web 服务器（可能依赖商业 DDR），利用你的 `CDN` 的设备检测功能，或者（如果两者都无法实现）使用客户端选项来完成繁重工作。


    [Client Hints](https://github.com/igrigorik/http-client-hints) 将在近期推出，提供一种混合客户端/服务器端解决方案。但它将如何工作呢？存储在
    `HTTP header` 中的用户代理信息将由 `Client Hints` 用于为该特定客户端加载资源做出决策。用户代理为服务器提供了关于其能力的提示，因此不会被要求加载它不需要的资源——由于逻辑在服务器上执行，从而减少了开销。


    `Client Hints` 的当前实现状态指出，`IE` 正在[考虑](https://status.modern.ie/httpclienthints?term=client%20hints)实现，而
    Mozilla 已对此提交了[错误报告](https://bugzilla.mozilla.org/show_bug.cgi?id=935216)。[整个草案](https://tools.ietf.org/html/draft-grigorik-http-client-hints-02)
    可以在 `IETF` 网站上找到。


    ## 用户代理嗅探的缺点


    上述所有方法都依赖于用户代理（user agent）；尽管用户代理是今天检测访问者设备的首选方案，但纯的用户代理嗅探（sn sniffing）存在几个缺点：


    * 用户代理字符串不包含任何关于——例如设备屏幕宽度或高度的信息，因此无法可靠地识别所有静态变量。

    * 为了为不同设备适配并优化内容，用户代理检测需要设备数据库，维护该数据库成本可能很高。

    * 用户代理检测对缓存不友好，因此每次用户访问你的页面时都必须执行。

    * 用户代理字符串不是结构化数据且可以被修改。（某些设备甚至会伪造自己的真实身份！）


    ## 设备测试


    如今，仅仅在各种桌面浏览器（如 `Chrome`、`Safari`、`Firefox`、`Opera` 或 `Internet Explorer`）上测试你的网站是不够的。多设备的宏环境给我们带来了更多挑战——具有不同能力、不同屏幕尺寸和多种连接速度的设备。我们现在构建网站时必须考虑这些挑战。如果你在较大的公司工作，可能足够幸运，可以使用拥有许多不同设备的设备实验室。如果没有，我将分享一些关于如何在系列设备上对你的网站进行测试的技巧。


    测试世界上每一个设备或每个屏幕尺寸几乎是不可能的。你可以利用之前创建的设备清单来帮助你设定要支持的基准。如果你目前没有使用分析或追踪工具，现在是采取行动的时候了。它提供的数据对于优化你的性能非常有帮助。


    一旦确定了想要支持的设备列表，就可以开始测试了。


    ### 模拟器


    你可以使用各种模拟器在不同设备上模拟你的网页。以下是精选：


    * [User Agent Switcher](http://chrispederick.com/work/user-agent-switcher/) 是一个浏览器扩展，可以模拟不同的用户代理字符串，从而帮助现场调试各种问题。将用户代理切换到移动设备将帮助你模拟网站在移动浏览器上的外观。还有其他用于模拟不同用户代理的浏览器扩展。最新版本的
    `Chrome` 内置了用户代理切换器。

    * [BrowserStack](http://www.browserstack.com/) 是一个商业在线工具，如果你负担不起建立物理实验室，它非常方便。你可以在许多不同的浏览器上测试你的网站，并使用内置的便捷开发工具调试
    HTML、CSS 和 JavaScript。


