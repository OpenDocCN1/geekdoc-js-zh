    # Chapter 1: Performance Simply Matters


    ## A Lean Website

    This book, *Lean Websites*, examines the causes behind bloated and slow websites,
    dissects which assets of your page are necessary, which are nice to have, and
    which are not necessary at all and can be removed to shed some weight. It will
    help you understand what causes websites to be slow, and how to look for efficiency
    while maintaining the quality originally envisioned for your site.


    The title of the book includes the word `lean`. So what does the word mean?


    “Lean” is used in this book to describe both the nature of the product we create
    and the process of creating it. Keeping a product lean means removing anything
    that might impede its performance. In the case of a website, this means keeping
    a clear focus on elements that add value to the site, and ensuring that these
    elements are optimized to provide the best possible user experience. Likewise,
    the more we practice building healthy, lightweight websites, the leaner and more
    efficient the process becomes—hopefully becoming part of our DNA when deploying
    sites.


    But let''s be clear up front: there''s some bad news. From a performance perspective,
    there''s *a lot* you can do wrong—and probably are doing wrong—when it comes to
    building websites! But hey, there''s also good news: there are lots of relatively
    easy ways to fix those problems.


    “The secret of getting ahead is getting started,” as the saying goes. So let''s
    get started!


    ## The Psychology of Speed

    Why do people leave a website? There could be many reasons, such as difficulty
    finding what they are looking for. But there''s a good chance users leave a site
    because it feels too slow to load. In this section, I want to draw some attention
    to psychology, and how it plays a big role in our perception of speed and performance.


    ### What Is “Too Slow”, and When Do Websites “Feel” Slow?

    As psychologist Jeremy Dean points out, [time doesn''t fly when we are having
    fun](http://www.spring.org.uk/2011/06/10-ways-our-minds-warp-time.php). When do
    we experience fun? Clearly, it''s not when we have to wait. Who likes to wait,
    especially in this world of constant news and response? Nowadays, people desire
    instant satisfaction and have very little patience. Amazon offers one-day delivery;
    a cab shouldn''t take longer than ten minutes to arrive. We''ve become a society
    where waiting is not acceptable anymore—especially when it comes to the online
    world. When we visit websites, if we don''t get an instant response, a competitor''s
    site is just a click away.


    > [A watched pot never boils. Minutes drag when we are bored.](http://www.theguardian.com/science/2013/jan/01/psychology-time-perception-awareness-research)


    The problem with discussing website speed is that the perception of speed is very
    subjective and very context specific. What feels slow to me might not feel slow,
    say, to my father or my grandmother. We all have different expectations. For this
    reason, Chapter 3 will help us to formulate a definition of “too slow” with real
    numbers and data.


    ### Maister''s First Law of Service

    David Maister, a former professor at the Harvard Business School, came up with
    a formula for the law of service. The formula—the outcome of several years of
    research—provides a measurement on how waiting for a specific service affects
    customers'' perceptions of both the service provided and the actual product.


    Maister''s formula states that [Satisfaction = Perception - Expectation.](http://faculty.haas.berkeley.edu/andy/blockhandouts/Queue%20Psychology.ppt)
    In the context of web performance and serving content to site visitors, this formula
    raises the following questions:


    *   What was actually served and presented to the visitor, and did the content
    satisfy the user''s goal?

    *   What was perceived by the visitor?

    *   What did the visitor actually expect?


