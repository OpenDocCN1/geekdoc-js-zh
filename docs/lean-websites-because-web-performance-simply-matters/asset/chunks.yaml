    当你的网站响应迅速且快速时，让用户感到快乐并通过传输更少的字节降低运营和服务器成本，这些并不是关注性能的唯一好处。Google 已经[正式](http://www.thinkwithgoogle.com/articles/the-google-gospel-of-speed-urs-hoelzle.html)他们的搜索排名算法重视页面速度，并在此基础上组织搜索结果。这可以追溯到
    Google 在 2010 年发布的一篇[博客](http://googlewebmastercentral.blogspot.ca/2010/04/using-site-speed-in-web-search-ranking.html)，文中提到：“用户非常重视速度——这就是为什么我们决定在搜索排名中考虑网站速度。”


    当你必须处理大量的竞争产品和网站时，这一点尤为重要。当有人在 Google 上搜索你提供的服务时，比竞争对手快绝对能让你处于领先地位。


    Alexa 排名衡量了一个网站相对于 Web 上所有其他网站的受欢迎程度。Alexa 的指标基于这些网站的页面访问量和访问。


    最近对排名靠前的页面及其速度进行了一些[研究](http://bigqueri.es/t/are-popular-websites-faster/162)，调查了网站的受欢迎程度是否与
    `Start Render` 时间相关。Start Render 时间将在第 3 和第 4 章中进行详细讨论，但目前，我们可以说它是一个记录浏览器开始在屏幕上“绘制”内容时间的指标。在感知性能的背景下，这是一个非常有用的衡量标准。如果用户能够“看到”内容，他们就会觉得网站已经准备好可以浏览了。然而，Start
    Render 时间仅表示页面内容已开始加载，因此即使用户可以看到内容，他们实际上可能还无法与之进行交互。


    ## 总结


    在介绍章节中，我们查看了心理学与性能之间的关系、对速度的感知以及慢意味着什么。


    我们探讨了为什么解决 Web 性能很重要以及如何处理这个问题。接下来的章节将介绍改进网站感知性能的工具和技术，并最终为未来生产精的网站。


    ***


    [^([1])](#ch01.html_d5e249) 来源：[Web Performance Today](http://www.performperformancetoday.com/2014/07/16/eight-tricks-improve-perceived-web-performance/)
    和 [High Performance Browser Networking](http://chimera.labs.oreilly.com/books/1230000000545/ch10.html#SPEED_PERFORMANCE_HUMAN_PERCEPTION)


    # 第 2 章：用户体验与性能


    ## 热身


    在本章中，你将学习用户体验与性能之间的关系。网站的用户体验取决于几个不同的因素：设计、可访问性、信息架构、可用性、感知和性能。


    就本书而言，我们将关注信息架构、设计和性能，这三者应该是相辅相成的。性能应该被纳入早期设计阶段，而不是作为事后补救。它从内容组织和架构开始。高性能信息架构的目标是以最方便、最简单、最快的方式提供用户正在寻找的内容。提高性能是赢得满意客户的重要因素。


    我们将通过讨论一种弥合信息架构、设计与性能之间差距的实用技术来结束章，我将其称为“性能评分系统”。为了演示性能评分系统背后的理念，我将将其应用于一个真实的网站。


    ## UX 原则


    > “用户体验涵盖了终端用户与公司、服务及其产品交互的所有方面。” ― Jakob Nielsen


    有几个原则可以遵循以获得良好的用户体验。首先，你想要确保你了解并理解用户的目标。你需要问自己，用户为什么要访问你的网站。例如，像亚马逊这样的购物网站和公共交通网站的用户目标是非常不同的。Amazon
    试图说服用户在他们的网站上逗留几个小时，同时对相似产品提供建议；而公共交通网站有另一个目标——尽快为用户提供火车时刻表。一旦用户获得了时刻表信息，他们很可能会离开网站。


    现在，由 UX 团队确保网站支持该目标。制定假设的用户旅程来衡量他们的完成时间是值得的。在 Amazon 的情况下，UX 团队需要想出如何留住用户。通过 `cookies`
    和登录从之前的访问中检索信息，Amazon 希望通过假装了解他们——更重要的是了解他们的兴趣——来诱导用户留在页面。在公共交通页面的示例中，你可以衡量找到或下载时刻表或显示票价需要多少步。


    所有的 UX 用户旅程在创建时都应考虑到性能。团队应该规划旅程，让用户感知旅程的每一步都尽可能简单、快速。这就是信息架构和线框图发挥用场的地方。


    ## 信息架构与线框图


    用户体验的一大部分是`[信息架构](http://iainstitute.org/en/learn/resources/what_is_ia.php)` (IA)，它定义了共享信息环境的设计。它是组织和标记网站、内网、在线社区和软件以支持可用性和发现性的艺术与科学。IA
    可以通过线框图说明。`[线框图](http://en.wikipedia.org/wiki/Website_wireframe)` 是代表网站骨架框架的视觉指南。它基本上是你概述网站的第一步。


    该过程部分的目标是规划用户在浏览网站时的旅程和流程。这是开发网站过程中非常重要的一部分，它设定了用户旅程的基调。性能应该被视为旅程的一部分。与其在以后修复性能问题，不如让性能成为线框图过程的一部分。在这一步做出良好的性能选择可以以后为你节省大量时间。


    ## 为性能设计


    在绘制线框图之后，下一步是设计过程。


    Web 设计师喜欢创建美丽且审学的网页，他们这样做有充分的理由。周全的设计可以让网站倍受欢迎、易于使用且令人难忘。设计是用户体验的一部分，但性能呢？你在页面上放置的每一个图像或额外字体都会影响网站的性能。


    我们这一代人是[缺乏的](http://www.bostonglobe.com/lifestyle/style/2013/02/01/the-growing-culture-impatience-where-instant-gratification-makes-crave-more-instant-gratification/q8tWDNGeJB2mm45fQxtTQP/story.html)，即使网站在审美上很有吸引力，如果运行缓慢，用户可能会离开。


    在她优秀的著作[*Designing for Performance](http://shop.oreilly.com/product/0636920033578.do)`
    中，Lara Hogan 指出：“必须权衡审美与性能之间的平衡，以提高终端用户体验。”


    不要误会我，我完全支持设计和美学，但它们必须是合理的，更重要的是对上下文敏感。如果不需要，没必要给所有人展示图像的高分辨率版本。要保持敏感、体贴和尊重。不要因为你不知道还能放什么，就用不必要的、沉重的资源（如图像）填充你的页面。


    ### 注意：作为设计特性的速度


