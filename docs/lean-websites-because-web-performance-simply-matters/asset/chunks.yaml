    Ilya Grigorik


    # Chapter 11: Mobile Optimization Techniques


    ## Warm Up


    In the last chapter, we discussed some of the performance challenges posed by
    the mobile web. Let''s take a look at how to address those challenges, by running
    through some performance boosters that can help make a mobile website lean and
    fast. At the end of the chapter, I''ll present you with some ideas on how to create
    your own mobile strategy.


    ## Mobile Performance Boosters


    Let''s start by examining options for improving mobile web browsing.


    ### Offline Storage


    HTML5 introduced [offline storage](http://www.html5rocks.com/en/features/storage),
    which makes it possible for browsers to store a copy of a web page, thus allowing
    users to browse the page while offline. Offline storage can help save unnecessary
    HTTP requests by removing the need to re-fetch assets from the server. Importantly,
    in the context of this book, offline storage also helps to improve *perceived*
    performance.


    While offline storage can be somewhat [buggy](http://alistapart.com/article/application-cache-is-a-douchebag),
    and sometimes tricky to implement and manage, there are web applications—such
    as the [Financial Times Web App](http://apps.ft.com/ftwebapp/) or [Google''s web-based
    offline email](http://googlecode.blogspot.com/2009/04/gmail-for-mobile-html5-series-using.html)
    version—that have shown how to use it successfully for performance enhancements.
    Imagine yourself on a train, wanting to finish reading a news article before going
    underground. If the website supports offline storage, you can continue reading
    without interruption.


    Offline browsing can be realized by using either the “application cache” (often
    abbreviated to “appcache”) or “local storage”, both of which help in avoiding
    HTTP requests, because they cache and save files locally.


    `[Appcache](https://developer.mozilla.org/en-US/docs/Web/HTML/Using_the_application_cache)`
    allows you to specify which files the browser should cache and make available
    to offline users. It''s based on a `manifest file` that tells the browser what
    to load from a local cache versus what files to request freshly. However, you
    need to think about what files should be saved locally. Since appcache still unreliable
    in certain browsers, it''s best to follow the advice from the [FT Labs](http://www.smashingmagazine.com/2013/05/23/building-the-new-financial-times-web-app-a-case-study/)
    team and keep the manifest file as small as possible, and only include fairly
    small files such as fonts, favicons, and a few images.


    `[Local storage](http://diveintohtml5.info/storage.html)` is also referred to
    as “client-side storage” or “web storage”. It''s based on key–value pairs like
    any JavaScript object. You can store blocks of JavaScript or CSS in local storage,
    and on subsequent page views you can retrieve these blocks and insert them into
    the page, resulting in a smaller HTML document download size, and a faster Start
    Render time.


    [The Guardian](http://www.theguardian.com/) website shows an example of how to
    use local storage to boost performance. It includes some JavaScript that''s executed
    if the visitor''s browser supports local storage. The CSS file is asynchronously
    loaded via Ajax. On the first run, the CSS is included inline, but also stored
    in the browser''s local storage. Next time the user visits the page, or any subsequent
    pages on the Guardian website, the server won''t load the inline CSS again, but
    instead will use the local storage version, allowing the page to be served faster
    to the user. By using this method, the Guardian was able to drop its Start Render
    time from [1.113s to 0.759s](https://speakerd.s3.amazonaws.com/presentations/ca037050b8d40131e4494251e58a135f/Breaking_news_at_1000ms_-_4-3_-_pdf.pdf).


    ### Tip: Storage Limitations


    If you''re planning to store large amounts of data, be aware that most mobile
    browsers can''t store more than approximately 5MB in local storage.


    Other local storage techniques you could use include [Web SQL Database](http://www.w3.org/TR/webdatabase/)
    (deprecated), [IndexedDB](http://www.w3.org/TR/IndexedDB/), and the [File System
    API](http://www.w3.org/TR/file-system-api/). You should consider using a structured
    database rather than local storage if you want to store a lot of content, because
    local storage can become slow when performing multiple operations. Also, local
    storage is executed synchronously, whereas the database options are asynchronous,
    allowing you to fetch data in parallel, and thus avoid blocking the execution
    of your mobile application.


    ### Other Mobile-specific Optimization Tips


    All of the performance boosters we discussed in [Chapter 5](#ch05.html "Chapter
    5Mastering Lean HTTP Requests"), [Chapter 6](#ch06.html "Chapter 6Producing Lean
    Web Assets: Part 1") and [Chapter 7](#ch07.html "Chapter 7Producing Lean Web Assets:
    Part 2") are helpful for mobile websites. But as we discussed in [Chapter 10](#ch10.html
    "Chapter 10A Multi-device Web World"), the higher latency on mobile networks,
    and less powerful CPUs/GPUs of mobile devices (which leads to slower JavaScript
    performance), both create special challenges for web performance on mobile devices.
    Let''s go through some tips on how to optimize your website with a specific focus
    on mobile constraints.


    #### Fighting Mobile Latency

