    ![在页面加载早期加载的 Twitter JavaScript 文件](img/3-waterfall-asset.png)


    图 3.9. 在页面加载早期开始加载的 Twitter JavaScript 文件


    总体而言，浏览器花费了 334ms 来加载此文件。瀑布图中显示的事务由五个不同的条形组成，每个条形都有颜色标记。第三条最长。这个条形显示了用于 SSL 协商的时间。


    那么这一切意味着什么？为什么这个事件花费的时间长？其他条形代表什么？让我们仔细观察。下面的图片拆解了这次 HTTP 事务：


    ![瀑布图中 HTTP 事务的详细视图](img/3-http-request-detail.png)


    图 3.10. 瀑布图中 HTTP 事务的详细视图


    让我们从左到右检查这些。


    ## DNS 查找


    `DNS` 代表域名系统（Domain Name System）。在 DNS 查找期间，浏览器尝试查找其试图加载的资源的域名。每个人类友好的 URL 都有计算机友好的
    IP 地址。你可以在浏览器中同时使用两者。例如，`www.sitepoint.com` 映射到 `54.221.218.251`。


    有很多变量会导致此事件产生[延迟](https://www.igvita.com/posa/high-performance-networking-in-google-chrome/)。


    ## 初始连接


    `initial connection` 发生在客户端和服务器执行“握手”以通过传输控制协议（TCP）开始相互通信时。浏览器基本上是在说：“你好，我想请求一些东西，你方便吗？”，而服务器说：“是的，我在，请发送吧”。


    那么是什么导致了这个事件的延迟呢？双方都需要等待另一方“发言”。在浏览器接收到“是的，我在这里，请发送吧”之前，服务器无法发送任何内容。


    从发送者到接收者的通信时间受光速限制：它们之间的距离越远，建立 TCP 连接所需的时间就越长。


    ## SSL 协商


    `Secure Socket Layer` (SSL) 实现了安全通信。它是一种在互联网上加密信息的协议（使用 `https://` 代替 `http://`）。方案中的
    HTTPS 指令浏览器执行安全握手。


    ### 注意：SSL 还是 TLS？


    [SSL](http://technet.microsoft.com/en-ca/library/cc784450.aspx) 由 Netscape Communications
    Corporation 于 1994 年开发，用于保护万维网上的交易安全。你可能见过 SSL 与 TLS 结合使用，有时被称为 SSL/TLS。TLS 代表传输层安全（Transport
    Layer Security）。SSL 是 TLS 的前身。互联网工程任务组标准化了 SSL 协议，并将其命名为 TLS。


    TLS 和 SSL 3.0 之间的[差异](https://www.ietf.org/rfc/rfc2246.txt) 并不剧烈，但它们已足够显著，阻止了
    TLS 1.0 和 SSL 3.0 之间的互操作性。


    此事件涉及双方（浏览器和服务器）之间的协商。HTTPS 上的每次 SSL 协商都需要一个新的 TCP 连接，包括[安全密钥交换](http://publib.boulder.ibm.com/tividd/td/TRM/GC32-1323-00/en_US/HTML/admin231.htm)过程，这增加了计算开销。然而，[现代硬件](http://chimera.labs.oreilly.com/books/1230000000545/ch04.html#TLS_COMPUTATIONAL_COSTS)
    已经能够吸收这一缺点。此外，一旦完成协商，同一个连接就可以用于对任何同源请求。


    ## 首字节时间


    `Time to First Byte` (TTFB) 发生在 TCP 握手成功执行之后，以及浏览器和服务器开始通信之后——当第一个字节实际发送到浏览器时。


    该指标也代表延迟。绿色条越大，延迟越高。根据你所在地和/或使用的设备，你会注意到延迟较小或较大。


    ### 注意：延迟


    `Latency` 是内容被你的浏览器请求并发送过去所需的时间。延迟会有变化。它受到数据必须传输的距离以及传输介质的影响。你特别是在[移动网络](https://www.igvita.com/2012/07/19/latency-the-new-web-performance-bottleneck/)上体验到更高的延迟。为什么？你设备的无线电设备需要找到最近的塔以建立连接。如果设备空闲，时间可能会更长。


    TTFB 由两个因素组成：浏览器到服务器的实际物理距离，以及服务器的处理时间。它可以总结为以下公式：`TTFB = 往返网络延迟 + 后端处理时间`。


    一项[研究](http://www.websiteoptimization.com/speed/tweak/time-to-first-byte/) 测试了约
    300 个未缓存的网站，显示最大的网页加载时间部分是 TTFB，其次是 DNS 查找、连接时间和下载时间。即使对于缓存网站，TTFB 仍然是最大的加载时间部分，随后是连接时间、下载时间和
    DNS 查找。因此，关注优化 TTFB 是值得的。


    如果 TTFB 运行速度很慢，其他指标将受到这种延迟的影响，产生连锁反应。


    ## 内容下载


    此事件发生在你请求的资源实际上开始在浏览器中显示时。你有时可以通过观察蓝色条的长度来判断资源实际上有多大。例如，图像往往有较大的蓝色条。蓝色条越大，实际资源越大，因此在网上传输所需的时间就越长。


    最小化资源文件的大小是优化内容下载花费时间的关键。第 6 和第 7 章将介绍优化图像、JavaScript 和 HTML 文件等内容的方法。


    ## 不可预测的副作用：连接速度、带宽和延迟


    虽然我们可以影响上述性能因素，但本节将讨论的内容大多在我们的控制之外，但在开发精简网站时仍然需要记住它们。


    在开发你的网站时，考虑用户的平均带宽（连接速度）是非常重要的——这在不同地区之间差异很大。


    [Akamai 的互联网状况报告](http://www.akamai.com/dl/akamai/akamai-soti-q114.pdf?WT.mc_id=soti_Q114)
    包含了许多关于服务提供商、地区连接速度和移动浏览器使用数据的极佳信息：


