    screens, as it matches their refresh rate (60Hz).


    The smoothness of your animation depends on its frame rate. In order to accomplish
    a smooth experience for your users, make sure to keep the frame rate at 60fps.
    Otherwise, your users might experience your animations as clunky, especially when
    quickly scrolling up or down. The higher the frame rate, the more responsive the
    website feels to the user.


    `requestAnimationFrame()`


    `requestAnimationFrame()` is a native API that can execute any kind of animation
    in the browser—involving DOM elements, CSS, canvas, WebGL or anything else. It
    should be preferred over using `setInterval()` or `setTimeout()`.


    The difference between `requestAnimationFrame()` and `setInterval()` or `setTimeout()`
    is that you tell the browser to draw the animation at the next available opportunity,
    and not based on a predefined interval that could take up more processing time
    and power. For example, `setTimeout()` only refreshes the screen when it wants
    to, not when the computer is able to, and it doesn’t care what else is happening
    in the browser—such as another browser tab being active instead.


    `requestAnimationFrame()` groups all of the animations into one single browser
    repaint, resulting in fewer CPU cycles. Also, if you switch to a new tab, the
    browser will throttle the animation so you can visit other pages without the animation
    slowing down your browser.


    So how do you optimize your page to avoid repaints and reflows, and make animations
    not feel “clunky” or “janky”?


    You can''t really remove all repaints and reflows, but you can try to minimize
    their occurrence. Here are some tips on how to [optimize](https://dev.opera.com/articles/efficient-javascript/?page=3#reflow)
    them:


    *   Instead of using `setInterval()` or `setTimeout()` for animations, use `requestAnimationFrame()`.


    *   Avoid inconsistent frame rates, as this correlates with bad user experience.
    Either use 60fps or, if that''s not possible, use 30fps consistently. `requestAnimationFrame()`
    can throttle animations, especially when the system can''t handle rendering at
    the screen''s refresh rate. A consistent 30Hz feels better to our eyes than 60Hz
    with some missing frames per second.


    *   Check your `onScroll()` handlers. This event handler can cause serious issues
    when scrolling. In general, adding too much stuff into JavaScript event handlers
    imposes challenges on the animation, especially when scrolling.


    *   Heavy CSS animations or drop shadows, blurs, linear gradients, also big fixed
    background images, can slow down rendering.


    *   Use animations on elements with position fixed or absolute. They won''t affect
    other elements'' layout, thus reducing the cascading effect that a reflow might
    otherwise trigger.


    If you want to dig deeper how to optimize JavaScript, I highly recommend [*High
    Performance JavaScript*](http://shop.oreilly.com/product/9780596802806.do), a
    book by Nicholas C. Zakas.


    ## Third-party Scripts


    [Recent investigation](http://bigqueri.es/t/what-is-the-distribution-of-1st-party-vs-3rd-party-resources/100/3)
    has shown that the distribution of **third-party content** is growing. Ever more
    sites are using code and assets not hosted on their own domain. In 2011, 32% of
    a site''s content was coming from third-party content; by 2013, this had risen
    to 38%. While third-party scripts can be useful, when poorly implemented, their
    inclusion can have a significant performance impact.


    > “In the strictest sense, anything served to the client that’s provided by an
    organization that’s not the website provider is considered to be third-party.”
    ― Ben Vinegar, author of *[Third-Party Script](http://www.manning.com/vinegar/)*.


    ### Types of Third-party Scripts


    There are several different categories of third-party content:


    *   **Advertising**: any advertising network or service offering JavaScript to
    be included in your page.


    *   **Tracking and analytics**: this includes tracking products such Google Analytics
    and Chartbeat.


    *   **Social media**: any social media scripts, such as those offered by Facebook,
    LinkedIn, Twitter and Google+.


    *   **Libraries and frameworks**: examples include jQuery, YUI, Twitter Bootstrap,
    or any helpers that are included on your page via their external hosts.


    If you work for a company with a business intelligence, analytics or marketing
    department, the chances are high that you are being asked to include anything
    that could help measure the company''s success. There is not one social media
    or tracking tool out there that marketing wouldn''t like to try out. Social media,
    ads and tracking scripts are big temptations for marketers and companies wanting
    to better understand their customers or find other revenue streams. On the other
    hand, any foreign content you add on top of your own content—especially if it''s
    JavaScript—will add weight and load time to your page.


    However, your rule of thumb should be that the value you get from using a third-party
    script has to be greater than its performance hit.


    ### Content Overload


    Check out the pie chart below, analyzing [Wired.com](http://wired.com). It''s
    not difficult to see that a significant amount of the content being provided is
    not coming from Wired.com:


    ![Wired.com content breakdown by domain](OEBPS/figures/6-wired-content-breakdown.png)


    Figure 6.2. Wired.com content breakdown by domain


    Considering that each additional external HTTP request costs another DNS lookup,
    this can result in significant latency issues.


    ### Note: Ghostery


    [Ghostery](https://www.ghostery.com/en/) is a browser extension that lists all
    third-party scripts being used on a page. It can easily give you a quick idea
    of how much third-party content is adding to the page load time.


    ### Preparing for the Worst: SPOF


    One of the most damaging things that can happen to your website is if a third-party
    provider goes down, and the script from that provider is included in such a way
    that it affects the critical rendering path. This worst case has a name: a **Single
    Point of Failure** (SPOF). SPOF describes an event where the entire system fails
    to execute. To quote [Wikipedia](http://en.wikipedia.org/wiki/Single_point_of_failure):


    > A single point of failure (SPOF) is a part of a system that, if it fails, will
    stop the entire system from working. SPOFs are undesirable in any system with
    a goal of high availability or reliability, be it a business practice, software
    application, or other industrial system.


    #### The Offending Tag


    We''ve discussed the critical rendering path and how JavaScript blocks rendering.


    ```

    <script src="http://example.com/3rdparty-script.js"></script>

    ```


    If example.com were to go down, the entire content after this tag would be blocked
    from rendering. Imagine this tag sitting in the head of your page, blocking the
    entire content of the page below it. That''s pretty bad. So what can we do to
    fix this?


    #### Avoiding SPOF


    In this section, I''ll describe a few ways to include scripts on a page and avoid
    the risk of SPOF events.


    ##### The Dynamic Way


    Have you heard of the dynamic script tag? It''s been heavily promoted by Stoyan
    Stefanov—the man behind the performant Facebook Like button—and Philip Tellis,
    the creator of boomerang.js.'
