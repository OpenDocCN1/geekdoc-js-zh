- fmt: "\nGPU stands for `graphics processing unit`. Its main function is to offload\
    \ graphics tasks that would otherwise be processed and calculated by the main\
    \ `CPU`. The architecture of the `GPU` is designed solely around graphic processing—and,\
    \ as a result, it can accomplish this task more efficiently than the `CPU`.\n\n\
    The more we load on the `CPU/GPU`—especially on smaller devices such as smartphones—the\
    \ more they have to work, resulting in slower processing and poorer performance.\
    \ Developers who've become accustomed to the huge memory available on desktop\
    \ and laptop computers should remember that the memory capacity of mobile devices\
    \ is drastically less. The less memory available, the more challenging performance\
    \ becomes. As mentioned in [Chapter 6](#ch06.html \"Chapter 6Producing Lean Web\
    \ Assets: Part 1\"), certain JavaScript operations come with a performance price,\
    \ and any major manipulations of the DOM could cause memory problems for mobile\
    \ devices.\n\n## Slower JavaScript Execution\n\nEverything feels slower on mobile\
    \ devices. Their JavaScript engines are a lot slower than their desktop counterparts.\
    \ DOM manipulations and other expensive operations keep the `GPU` and `CPU` busy.\
    \ For example, Flickr encountered a [major issue](http://code.flickr.net/2011/07/20/lessons-learned-from-the-flickr-touch-lightbox/)\
    \ on the mobile version of their site when they implemented their first version\
    \ of a slideshow. The iOS browser would constantly crash when displaying more\
    \ than 20 images. The cause for the crash? Flickr coded too many manipulations\
    \ of the DOM, resulting in the `CPU` and `GPU` not being able to keep up with\
    \ it anymore.\n\n## Power Consumption and Data Plans\n\nIn addition to recognizing\
    \ the performance constraints of mobile devices, it's important to consider the\
    \ power and data consumption of mobile devices when developing a lean website.\n\
    \n### Battery Consumption\n\nMobile devices run off a battery, which drains faster\
    \ the more work the device has to do. A lean website should aim to minimize the\
    \ battery drain of mobile devices.\n\nThe following results came out of some excellent\
    \ [research](http://www2012.wwwconference.org/proceedings/proceedings/p41.pdf)\
    \ conducted by academics from Stanford University and Deutsche Telekom Research\
    \ & Development in Los Altos. Their research evaluated the energy level of mobile\
    \ devices based on browsing the Internet.\n\n- **Images:** rendering images takes\
    \ a significant fraction of the total rendering energy. Compressing images to\
    \ JPEG has shown improvements on energy consumption.\n- **JavaScript:** JavaScript\
    \ is one of the most energy-consuming components in a web page. Remove as many\
    \ unused frameworks or manipulations as possible.\n- **CSS:** the rendering cost\
    \ of CSS depends on the number of items styled. Concatenating CSS files also helps\
    \ to reduce energy consumption.\n\nThis all sounds a bit familiar, doesn't it?\
    \ I've already mentioned these things when we discussed optimizing websites in\
    \ general. So by following these rules, we can ensure that our website will also\
    \ be energy-efficient on mobile.\n\n### Data Consumption\n\nData plans still remain\
    \ [expensive](http://www.wallcom.ca/pdfs/price-comp-report_2013update.pdf) in\
    \ several countries, especially when traveling. The leaner a site's assets, the\
    \ less data consumption being forced on users.\n\nThere's a sobering example of\
    \ the effect a poorly optimized site can have on mobile data usage. [Mobiforge](http://mobiforge.com/)\
    \ ran an experiment on cellular data charges. They took a SIM from a European\
    \ cellular provider and used it on an Android phone while roaming in the US. Loading\
    \ just one [web page](http://www.briefcakes.com/gallery.html) with a size of around\
    \ 10MB [cost around €369, or approximately US$480](http://mobiforge.com/research-analysis/performance-money-part-1-end-users-wallet).\n\
    \n## Device Management\n\nVarious organizations have created repositories of information\
    \ about the currently available portable devices. The goal is to help you detect\
    \ devices based on a variety of factors, such as their features, screen-size,\
    \ or operating system. Most organizations offering such a `device description\
    \ repository` (DDR) charge for access to their data, offering a free version with\
    \ limited access. Commercial versions normally come with additional features,\
    \ such as detection for multiple websites, local solutions, and unlimited detections\
    \ per month.\n\nLet's look at several of the DDR products on offer.\n\n### WURFL\n\
    \n[WURFL](http://en.wikipedia.org/wiki/WURFL) stands for Wireless Universal Resource\
    \ File. It's a big XML file listing details of all of the devices available. The\
    \ repository used to be free and open-source, until it was commercialized in 2011.\n\
    \nBased on the HTTP user agent string, you can match and profile a device that\
    \ accesses your site using WURFL. It not only lists all devices and specifications,\
    \ but also provides grouping and categorization—making it easier for you to “bucket”\
    \ certain devices by their capabilities.\n\nHere is a sample snippet of the WURFL\
    \ `device` node for an iPhone 4 entry:\n\n```xml\n<device id=\"apple_generic\"\
    \ user_agent=\"Mozilla/5.0 (iPhone; U; CPU\n iPhone OS 4_0 like Mac OS X; xx-xx)\
    \ AppleWebKit/532.9 (KHTML,\nlike Gecko) Version/4.0.5 Mobile/8A293 Safari/6531.22.7\"\
    \n fall_back=\"generic_xhtml\">\n    <group id=\"product_info\">\n      <capability\
    \ name=\"mobile_browser\" value=\"Safari\"/>\n      <capability name=\"device_os\"\
    \ value=\"iOS\"/>\n      <capability name=\"has_qwerty_keyboard\" value=\"true\"\
    />\n      <capability name=\"pointing_method\" value=\"touchscreen\"/>\n     \
    \ <capability name=\"is_tablet\" value=\"false\"/>\n      <capability name=\"\
    model_name\" value=\"iPhone\"/>\n      <capability name=\"device_os_version\"\
    \ value=\"4.0\"/>\n      <capability name=\"is_wireless_device\" value=\"true\"\
    />\n    </group>\n    <!-- ... -->\n    <group id=\"display\">\n      <capability\
    \ name=\"physical_screen_height\" value=\"74\"/>\n      <capability name=\"resolution_width\"\
    \ value=\"320\"/>\n      <capability name=\"resolution_height\" value=\"480\"\
    />\n    </group>\n  <!-- ... -->\n</device>\n```\n\nBased on the above criteria,\
    \ you could target all iPhone users by validating the `model_name` to match the\
    \ incoming user agent string of your users.\n\n### Tip: WURFL Explorer\n\nTry\
    \ out the [WURFL explorer](http://www.tera-wurfl.com/explore/?action=wurfl_id&id=apple_iphone_ver2)\
    \ to examine descriptions of many devices in the WURFL DDR.\n\nThe WURFL DDR file\
    \ has grown tremendously over the last decade as more devices have been released.\
    \ It's currently a 20MB XML file. Parsing this entire file every time you need\
    \ to use it is not very efficient. I recommend filtering and shrinking the file\
    \ according to your own needs.\n\nIf you decide to use WURFL, or its commercial\
    \ [ScientiaMobile](http://www.scientiamobile.com/) version, you can benefit from\
    \ several [server-side](http://www.smashingmagazine.com/2014/07/01/server-side-device-detection-with-javascript/)\
    \ and [client-side](http://web.wurfl.io) implementations. But if you don't want\
    \ to use WURFL, for whatever reason, there are some other repositories available.\n\
    \n### Other DDRs\n\nWhile WURFL was one of the first DDR products, there are other\
    \ solutions that provide detailed information about your users' devices. There's\
    \ no real stand-out winner here. Which you choose basically depends on your preference\
    \ of programming language and your wallet.\n\n#### DeviceAtlas (Free and Commercial\
    \ Versions)\n\n[DeviceAtlas](https://deviceatlas.com/) follows the same idea as\
    \ WURFL: it gives you access to a huge database of mobile devices, spitting out\
    \ any kind of information you need about these devices.\n\nDeviceAtlas comes in\
    \ [several programming languages](https://deviceatlas.com/resources), such as\
    \ Java, PHP, .NET, Python, Ruby, and JavaScript, and is also accessible directly\
    \ via a [REST API](https://deviceatlas.com/resources/rest-api).\n"
