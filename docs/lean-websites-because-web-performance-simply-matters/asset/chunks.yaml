  trans: "\n\n此外，它们还提供了共享选项，使你能够将视频包含在自己的网站上。在线视频平台拥有强大的服务器，可以提供可靠的视频内容。它们通常还会提供 `Flash`\
    \ 和 `HTML5` 版本的源，即使在移动设备上也能轻松访问并经过优化。\n\n你也可以将视频托管在自己的 Web 服务器上，尽管某些托管提供商限制了从你的网站下载的带宽数据量。\n\
    \n## Web 字体\n\n你可以使用自定义的 `web font` 字体来显示访问者计算机未安装的字体。当特定字体是企业视觉识别的一部分时，使用网络字体会非常有帮助。在图\
    \ 7.4 中你可以看到 air.com 使用了多种网络字体：\n\n![airbnb.com uses several custom fonts, shown\
    \ via developer tools](img/7-web-fonts-example.png)\n\n图 7.4. *airbnb.com 使用多种自定义字体，通过开发者工具显示*\n\
    \n网络字体在近年来变得非常流行。根据 HTTP Archive 的数据，在 2014 年 10 月，前 100 万个 Alexa 网站中有 [48%](http://httparchive.org/trends.php)\
    \ 正在网络字体。然而，网络字体是有性能代价的。那么，如何在不过度影响网站性能的情况下包含网络字体呢？\n\n你应该决定是将字体存储在自己的服务器上，还是通过外部字体托管服务包含它们。将字体文件存储在自己的服务器上确实会增加带宽占用，但它可以节省浏览器的额外\
    \ DNS 查找——这是从第三方托管服务检索字体时必须执行的操作。然而，外部托管服务可以为你提供优化的解决方案，为用户提供流畅的体验，通常对性能的影响很小。\n\
    \n### 在自己的服务器上托管字体\n\n如果你想在自己的服务器上托管网络字体，并通过标准的 `@font-face` CSS 选择器调用它——并让所有浏览器和平台渲染该字体——你需要使其以\
    \ [WOFF](http://caniuse.com/woff)、[TTF](http://caniuse.com/ttf)、[EOT](http://caniuse.com/eot)\
    \ 和 [SVG](http://caniuse.com/svg) 格式提供。人们希望 WOFF 最终能被所有浏览器支持。WOFF 的特殊之处在于它可以被编码为\
    \ base64 作为数据 URI——正如我们之前学到的，数据 URI 编码对性能有益，因为它减少了我们需要进行的 HTTP 请求次数。\n\n在向网站添加网络字体之前，请务必对它们进行优化。网络字体的大小差异巨大，部分取决于它们包含的字符数量。你可能只需要几百个字符，而具有完整\
    \ Unicode 的字体可能包含数千个字符形状，或 `glyphs`。你实际上可以使用 [Glyphs](http://www.glyphsapp.com/)\
    \ 和 [FontForge](http://fontforge.github.io) 等工具从字体文件中删除不需要的 glyphs 以使其更小。\n\n\
    ### 外部字体托管\n\n与其在自己的服务器上托管网络字体，你可以选择许多第三方字体服务之一，例如 [Google Fonts](http://www.google.com/fonts)\
    \ 或 [TypeKit](https://typekit.com/)。对于这些服务，你只需要选择几个选项即可获取一段简单的代码包含在你的网站中。你确实为此付出了性能代价，接受另一次\
    \ DNS 查找；但通过选择流行的网络字体，你可能会从`跨站缓存`中受益。跨站缓存意味着，通过使用流行的托管字体，你的访问者可能已经从之前访问过的网站缓存了该字体。值得查看\
    \ [Google Fonts Analytics](http://www.google.com/fonts#Analytics:total) 来找到它最流行的网络字体。\n\
    \n在选择 Google 字体时，你可以通过 API 调用中的参数来定义你的字符集：\n\n```\n<link href=\"http://fonts.googleapis.com/css?family=Open+Sans&subset=\n\
    ↵latin\" rel=\"stylesheet\">\n```\n\nGoogle Fonts 提供了一个实用的性能仪表，用于确定在你的网站上包含其字体对页面加载时间的影响。在图\
    \ 7.5 中你可以看到包含相对简单有限的字符集的影响很小，而图 7.6 显示包含带有多个集的多个字体的影响要大得多：\n\n![Google Fonts\
    \ service with performance gauge](img/7-web-fonts-simple.png)\n\n图 7.5. Google\
    \ Fonts service with performance gauge\n\n![Google Fonts service with performance\
    \ gauge, showing a performance alert](img/7-web-fonts-fat.png)\n\n图 7.6. Google\
    \ Fonts service with performance gauge, showing a performance alert\n\n对于 Google\
    \ 字体，如果你知道在特定的网络字体中只需要一个单词，可以使用 `text` 参数仅指定你需要的字符。通过使用字符子集（character subsetting），你保证了字体的最佳优化，因为你只请求了特定单词的字符：\n\
    \n```\n<link href=\"http://fonts.googleapis.com/css?family=Inconsolata&amp;\n\
    ↵text=Welcome%20Readers!\" rel=\"stylesheet\">\n```\n\n一旦你确定了一个（或多个）网络字体，请确保异步地包含它，以避免渲染阻塞。\n\
    \n然而，如果使用异步选项，你可能会面临向用户显示 FOUT（无样式文本闪烁）的风险。[大多数浏览器](https://www.igvita.com/2014/01/31/optimizing-web-font-rendering-performance)都已采用\
    \ FOUT。Chrome 和 Firefox 在处理自定义字体加载时具有相同的行为：它们在 3 秒后超时并使用备用字体，并且在字体下载完成后才重新渲染文本。IE\
    \ 会立即使用备用字体渲染内容，并在自定义字体加载后重新渲染。Safari 则挂起字体渲染，直到字体完全下载。Google 与 TypeKit 合作提供了一个高性能的\
    \ Web Font Loader 来对抗 FOUT，我们接下来将讨论。\n\n### Web Font Loader\n\n[Web Font Loader](https://github.com/typekit/webfontloader)\
    \ (WFL) 使用 `@font-face` 属性对链接的字体提供了额外的控制。其理念是帮助优先考虑这些资产——例如，通过调度下载字体的时间，或字体应该如何渲染（同步或异步）。它通过首先将[整个\
    \ HTML 内容](https://decadecity.net/talks/using-a-web-font-loader) 包裹在 `wf-loading`\
    \ 类中来对抗 FOUT 效应。`wf-loading` 内容最初是隐藏的。一旦字体加载，通过 `wf-active` 类恢复内容的可见性，包括淡入效果。\n\
    \n下面的示例显示了如何通过 WFL 加载 Open Sans 和 Satisfy：\n\n```\n<script>\n      WebFontConfig\
    \ = {\n      google: {\n        families: ['Open Sans', 'Satisfy']\n      }\n\
    \   };\n\n  (function() {\n    var wf = document.createElement('script');\n  \
    \  wf.src = ('https:' == document.location.protocol ? 'https' :\n↵ 'http') +\n\
    \              '://ajax.googleapis.com/ajax/libs/webfont/1.5.6/\n↵webfont.js';\n\
    \    wf.type = 'text/javascript';\n    wf.async = 'true';\n    var s = document.getElementsByTagName('script')[0];\n\
    \    s.parentNode.insertBefore(wf, s);\n  })();\n</script>\n```\n\n关于配置以及如何包含\
    \ TypeKit 字体的更多信息可以在 WFL 文档中找到。\n\n### 注意：字体加载事件 API (Font Load Events API)\n\n\
    新的[字体加载事件 API（css-font-loading API）](http://dev.w3.org/csswg/css-font-loading/)——目前处于草稿阶段——最终将完全控制字体如何以及何时加载和渲染。然而，在此\
    \ API 在所有浏览器中得到完全支持之前，我建议你使用 WFL。\n\n### Web 字体技巧\n\n"
- fmt: "\n*   Think twice before adding custom fonts, unless they are essential for\
    \ your company's brand. As well as affecting performance, too many different fonts\
    \ can clutter your design.\n*   Consider loading web fonts only on less connection-sensitive\
    \ devices.\n*   If you decide to host fonts yourself, optimize them with tools\
    \ like [Glyphs](http://www.glyphsapp.com/) or [FontForge](http://fontforge.github.io).\n\
    *   As a general rule, avoid the hassle of doing it all by yourself. Leverage\
    \ the power and efforts of Google's font infrastructure, making use of cross-site\
    \ caching and Google's optimization techniques, thus presenting the user with\
    \ the most optimized version for their device.\n\nNow that we've discussed ways\
    \ to optimize our site assets, we'll next look at rolling all these techniques\
    \ into an automated performance optimization workflow.\n\n## Cool Down\n\n*  \
    \ While images remain the biggest cause of poor web performance, there are many\
    \ ways to optimize them.\n*   Select an image format that best suits your purpose,\
    \ weighing up the advantages and disadvantages of each.\n*   Use the tools available\
    \ to you for measuring the performance of each image format, including data URIs.\n\
    *   Think carefully about the video format and delivery method you choose—be it\
    \ streaming, download or progressive download—to help ensure optimal performance.\n\
    *   Use web fonts wisely, weighing up the needs of design and branding against\
    \ the performance impact of downloading extra assets. And consider using a web\
    \ font loader to help you manage font loading during the rendering process.\n\n\
    # Chapter 8: Automating Optimization Tasks\n\n## Warm Up\n\nThis chapter is my\
    \ favourite of the entire book. It covers tools that automate website performance\
    \ optimization. There are innumerable tools for automating the whole gamut of\
    \ web development tasks, and many of them are well suited to the optimization\
    \ tasks presented in this book.\n\nIn this chapter, I'll first introduce some\
    \ helpful scripts and APIs that you can use for automation. After explaining how\
    \ to use these tools, I'll apply them to a concrete example, using the task runner\
    \ `Grunt`.\n\n## Automation Tools\n\nThis section covers tools for automating\
    \ performance optimization. Their purpose is to validate code against the performance\
    \ guidelines discussed in the previous chapters, returning results in a structured\
    \ format such as `JSON` or `XML`.\n\n### PhantomJS in Collaboration with Other\
    \ Tools\n\nUp until now, we've done all our performance testing manually, so to\
    \ speak, using tools such as `WPT`, `PageSpeed Insights` and the `YSlow` browser\
    \ extension. Now we turn instead to [PhantomJS](http://phantomjs.org/), a `headless\
    \ browser`—meaning that you can use it to open a website and run commands on it\
    \ via the command line. With `PhantomJS`, we can run the same tests—using `YSlow`,\
    \ for example—without ever opening a browser window.\n\nBy combining `PhantomJS`\
    \ with other tools, you can monitor [page and network performance](http://phantomjs.org/network-monitoring.html),\
    \ and make this a part of your deployment process.\n\nHere's a simple example\
    \ of how `PhantomJS` opens a web page:\n\n```javascript\n// open-mypage.js\nvar\
    \ page = require('webpage').create();\npage.open('http://bbinto.me', function()\
    \ {\n  // do your stuff\n  console.log('Just opened bbinto.me');\n  phantom.exit();\n\
    });\n```\n\nYou can execute this code as follows:\n\n```bash\n$ phantomjs open-mypage.js\
    \ \n```\n\nLet's look at an actual example of using `PhantomJS` with `YSlow` to\
    \ analyze a simple [demo page](http://bbinto.me/lean-websites/crp/index.html).\
    \ Firstly, as a comparison, [Figure 8.1](#ch08.html_ch8-yslow-browser \"Figure\
    \ 8.1. YSlow via the Firefox extension, visual representation within browser window\"\
    ) shows the `YSlow` result in the browser, the site achieving an overall performance\
    \ score of 87:\n\n![YSlow via the Firefox extension, visual representation within\
    \ browser window](OEBPS/figures/8-yslow-plugin.png)\n\nFigure 8.1. YSlow via the\
    \ Firefox extension, visual representation within browser window\n\nNow let's\
    \ look at the performance results produced by `YSlow` via the headless browser.\n\
    \n*   Firstly, we retrieve simple `JSON` output:\n\n```bash\n$ phantomjs yslow.js\
    \ --info basic http://bbinto.me/lean-websites/\n↵crp/index.html\n\n// result\n\
    $ {\"v\":\"3.1.8\",\"w\":623435,\"o\":87,\"u\":\"http%3A%2F%2Fbbinto.me%2Fle\n\
    ↵an-websites%2Fcrp%2Findex.html\",\"r\":19,\"i\":\"ydefault\",\"lt\":2191}\n```\n\
    \nThe key to the results is as follows:\n\n*   `v`: version\n*   `w`: weight\n\
    *   `o`: overall score\n*   `u`: URL\n*   `r`: number of requests\n*   `i`: performance\
    \ ruleset (from `ydefault`, `yslow1` or `yblog`)\n*   `lt`: page load time\n\n\
    The overall score \"87\" matches the one from the `YSlow` extension running in\
    \ the browser.\n\n*   Here's an example of a full test, including predefined conditions\
    \ that the website is being tested against. If conditions are not met, the test\
    \ fails and returns a warning. The following command defines thresholds to check\
    \ if the website has an overall score of `B` (or better):\n\n```bash\n$ phantomjs\
    \ yslow.js --info basic --format tap --threshold B http:\n↵//bbinto.me/lean-websites/crp/index.html\n\
    ```\n\nThe test passed:\n\n```bash\n$ TAP version 13\n1..1\nok 1 B (87) overall\
    \ score\n```\n\nThe threshold value can range from 0 to 100 (with 100 being the\
    \ strictest), or can be validated with `A–F` marks, where `A` is the best and\
    \ `F` the worst.\n\nYou can pick the thresholds appropriate for your website.\
    \ For example, you could even be more specific and rigorous and set the threshold\
    \ on HTTP requests (`ynumreq:A`) to 95, as follows:\n\n```bash\n$ phantomjs yslow.js\
    \ --info grade --format tap --threshold '{\"ynum\n↵req\": \"95\"}' http://bbinto.me/lean-websites/crp/index.html\n\
    ```\n\nThe examples above use the `ydefault` ruleset specified in the `yslow.js`\
    \ file. That's the same ruleset that is being used when you run `YSlow` via the\
    \ browser extension. The ruleset defines how the overall score is calculated,\
    \ based on the criteria to be tested.\n\nIn contrast to using `YSlow` on its own,\
    \ using it with `PhantomJS` allows for more customization of performance tests\
    \ and thresholds. To make this an even more optimized process, you can add the\
    \ `PhantomJS` script to your deployment process. Continuous integration tools\
    \ such as `Jenkins` or `Travis` offer automated testing environments, and can\
    \ alert you when one of the test fails.\n\n### Note: Continuous Delivery, Continuous\
    \ Integration\n\nContinuous delivery involves building software such that it can\
    \ go into production at any time. Continuous integration involves regularly testing\
    \ and merging changes into a project. Continuous integration builds can be started\
    \ by various events, such as being triggered by a commit in a version control\
    \ system, scheduling via a cron-like mechanism, or building when other builds\
    \ have completed, etc.\n\nTools such as [Jenkins](http://en.wikipedia.org/wiki/Jenkins_(software)))\
    \ or [Travis](https://travis-ci.org/recent) help organizations to run these processes.\n\
    \n### WPT API and PageSpeed Insights API\n\nInstead of using `PhantomJS` as your\
    \ browser to test a website for performance, you can also query performance APIs\
    \ in the cloud. As noted in [Chapter 3](#ch03.html \"Chapter 3Measuring & Monitoring\
    \ Performance\"), `PageSpeed Insights` and `WPT` both offer APIs. You can use\
    \ these APIs to integrate performance tests into your deployment process.\n\n\
    Let's start with the `WPT` API, to illustrate how it can be used to detect bad\
    \ performance decisions without us needing to analyze anything manually in a browser\
    \ window.\n\nMarcel Duran, a Google Engineer, has built a [plugin for the WPT\
    \ API](https://github.com/marcelduran/webpagetest-api/wiki/Test-Specs) to work\
    \ with continuous integration tools.\n\nBy providing Duran's `WPT API` wrapper\
    \ with a `specs.json` file, you can specify how to run a performance test, and\
    \ when the test should pass or fail. Let's check out some example content for\
    \ `specs.json`:\n"
