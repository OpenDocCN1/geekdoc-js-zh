  trans: "\n此外，还要注意缓存的限制。Data URI 图像成为更大的 HTML 或 CSS 文件的一部分，因此若要缓存编码为 data URIs 的图像，我们需要缓存包含它们的页面。例如，如果你将\
    \ data URI 图像放在 HTML 中，那么它们只能根据 HTTP 缓存控制头部的定义进行缓存（我们将在稍后详细讨论缓存问题）。如果 HTML 不可缓存，则\
    \ HTML 标记的整个内容（包括内联 data URI）在用户每次访问页面时都需要重新下载。如果图像很大，这会降低性能。因此，一种方案是将编码后的图像放在样式表中，这样你就可以对\
    \ CSS 文件使用更具激进的缓存，而 HTML 页面可以设置为不缓存或非常有限的缓存，因为 HTML 内容更有可能发生。大图像会让这个问题更严重，一个实用的经验法则是不内联任何大于\
    \ `4KB` 的资源。\n\n## WebP\n\nWebP 是一种相对新的图像格式，相比 PNG 和 JPEG 能极大节省文件空间。\n\n[WebP](https://developers.google.com/speed/webp/?csw=1)\
    \ 是一种开源图像格式，目前仅受 Chrome、Opera 和 Android 支持。Facebook 等一些知名网站已开始[采用这种格式](http://highscalability.com/blog/2014/9/22/how-facebook-makes-mobile-work-at-scale-for-all-phones-on-al.html)\
    \ 并取得了巨大成功。发送到 Facebook 和 Android Messenger 的大部分图像使用 WebP 格式，与 JPG 相比[节省了数据](https://code.facebook.com/posts/485459238254631/improving-facebook-on-android）25–35%，与\
    \ PNG 相比节省了 80%。\n\n你可以使用转换器将图像转换为 WebP。我使用 [ImageMagick](http://imagemagick.org/)\
    \ 通过安装 ImageMagick 并运行以下命令将 `leaf.png` 转换为 WebP：\n\n```\nconvert leaf.png -quality\
    \ 50 -define webp:lossless=true leaf.webp\n```\n\n你可以通过添加额外的[选项](http://www.imagemagick.org/script/webp.php)\
    \ 来调整设置。\n\nWebP 的缺点之一并非所有浏览器都支持这种新格式，特别是 Firefox、Internet Explorer 和 Safari。因此，你需要保存两个版本的图像：一个\
    \ WebP 格式，一个旧图像格式，这会在你的服务器上占用更多存储空间。\n\n虽然建议尝试不同的质量设置以及压缩选项，以验证哪种图像格式更小且细节损失更少，但在大多数情况下，WebP\
    \ 的尺寸都会优于 JPEG 和 PNG 文件。即使在质量水平的情况下，WebP 图像也[显著小得多](https://www.andrewmunsell.com/blog/jpg-vs-webp)。\n\
    \n我们现在已经介绍了几种格式和技术。让我们看看它们之间的对比如何。\n\n## 图像格式对比\n\n我运行了一次性能测试，对比了之前使用的[叶子图像](http://www.vectorvaco.com/grass-and-green-vector-13164/)的以下格式。\n\
    \n我使用了一个 `180x180px` 的矢量源文件并将其保存为 PNG、SVG、WebP，并从 PNG 创建了一个 data URI。\n\n1. [内联\
    \ Data URI](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-inline/):通过\
    \ `<<img>>` 标签以图像形式内联的 base64 编码图像：\n\n```\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQ...\"\
    />\n```\n\n2. [WebP](http://www.bbinto.me/lean-websites/chapter-4/data-uri/webp/):使用\
    \ ImageMagick 将 PNG 转换为 WebP，并通过外部 CSS 作为背景图像引用：\n\n```css\n/* style.css*/\n.leanleaf{\n\
    \    background-image: url(../img/leaf.webp);\n    /* ... */\n}\n```\n\n3. [SVG](http://www.bbinto.me/lean-websites/chapter-4/data-uri/svg/):将矢量源文件导出为\
    \ SVG，通过外部 CSS 文件作为背景图像引入：\n\n```css\n/* style.css*/\n.leanleaf{\n    background-image:\
    \ url(../img/leaf.svg);\n    /* ... */\n}\n```\n\n4. [Data URI](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-external):\
    \ base64 编码并作为背景图像包含在外部 CSS 文件中：\n\n```css\n/* style.css*/\n.leanleaf{\nwidth:156px;height:169px;background:url(data:image/png;base64,\n\
    iVBORw0KGgoAAAANSUHEUgAAALQ...\niVBORw0KGgoAAAANSUHEUgAAALQ...\n}\n```\n\n5. [PNG](http://www.bbinto.me/lean-websites/chapter-4/data-uri/data-uri-external):通过外部\
    \ CSS 作为背景图像引用：\n\n```css\n/* style.css*/\n.leanleaf{\n    background-image: url(../img/leaf.webp);\n\
    \    /* ... */\n}\n```\n\n| 结果 | Inline Data URI | WebP | SVG | Data URI | PNG\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 中位数 (ms) | 142 | 179 | 216\
    \ | 258 | 282 |\n| 大小 (bytes) | 9873 | 1769 | 2161 | 2538 | 285 |\n\n内联 data URI\
    \ 和 WebP 的加载速度最快，而 PNG 最慢。\n\n## 优化视频\n\n像图像一样，视频文件通常比 CSS 或 HTML 大，因此会带来更高的性能代价。视频文件的大小取决于帧率、比特率、分辨率、压缩格式和传输方式。在本节中，你将学习如何优化这些因素。\n\
    \n### 视频制作与内容\n\n视频越复杂，越难压缩。如果你可以控制视频的拍摄，可以采取一些步骤来确保它更容易压缩：\n\n* 目标是无无噪声内容。\n\
    *   尽量减少缩放次数。\n*   尽量减少背景细节和运动数量。\n\n### 注意：音频\n\n[研究](http://web.media.mit.edu/~vmb/papers/sound.pdf)表明，音频质量会影响*感知*到的视频质量。这意味着如果你的音频听起来很好，人们会认为你的视频*看起来*更好。尽管如此，如果你的视频大部分是说话内容且没有音乐，你可以放心使用单声道而不是立体声（这可以节省一些可以分配给视频的带宽）。\n\
    \n音频比特率应根据其内容[定义](http://support.limelight.com/support/docs/encoding_guide/)，因此仅根据内容需求设置。64\
    \ 到 128kbit/s 之间的速率对于大多数情况都是足够的。对于录制人类语音，64kbit/s 左右的低比特率是可以的。对于音乐音频，192kbit/s\
    \ 的高比特率更为理想。\n\n### 文件大小：帧率、比特率和分辨率\n\n视频设置包括帧率、比特率和分辨率，每一项都会影响视频的大小。\n\n####\
    \ 帧率\n\n**帧率**定义为每秒出现的帧数。以每秒帧 (fps) 为单位。帧率或分辨率越高，用户的视频体验越好。\n\n"
- fmt: "\nHowever, every tweak to increase the frame rate will increase the overall\
    \ file size—so it's important to identify what the intention of your video is.\
    \ For example, if you record a PowerPoint presentation with very little movement\
    \ but you care about image quality, you might want to focus more on higher resolution\
    \ and lessen the frame rate. For fast-moving recordings, such as sports events,\
    \ you'll want to [make sure to capture as many frames](https://ustream.zendesk.com/entries/22962268-Encoding-Specs-and-Stream-Settings#recommended)\
    \ per second as possible, while giving up a bit of your resolution in return.\n\
    \n# Resolution\n\nThere are two common `resolution` formats—standard definition\
    \ (SD) and high definition (HD). Most common resolutions for SD videos include\
    \ 640x480px (4:3 aspect ratio) and 640x360px (16:9 aspect ratio). HD video is\
    \ usually formatted at 720p (1280x720px) or 1080p (1920x1080px).\n\nObviously,\
    \ the higher the resolution, the greater the file size of a video, and the longer\
    \ it will take to deliver to your online consumers.\n\n# Bit Rate\n\nThe `bit\
    \ rate` controls the visual quality of the video and the file size, measured in\
    \ kilobits per second (kbit/s). [Adobe](http://help.adobe.com/en_US/mediaencoder/cs/using/WSb8e30982e628fbecc0e59e6131255b4dd2-8000.html#WSb8e30982e628fbecc0e59e6131255b4dd2-7ffd)\
    \ recommends lower bit rates for videos delivered over the web. Depending on the\
    \ resolution, the following bit rates could serve as a [guideline](https://vimeo.com/help/compression):\
    \ for SD, use 2,000–5,000kbit/s; for HD, use 5,000–10,000kbit/s for 720p, and\
    \ 10,000–20,000kbit/s for 1080p.\n\n## Containers, Codecs and Compression\n\n\
    Once you've selected the frame rate, resolution and bit rate, you'll need to render\
    \ the video to a specific video format. These formats are also called `video containers`.\
    \ Video containers contain codecs, so the video player knows how to read and play\
    \ the file.\n\n### Containers\n\nThe most common video formats are shown below:\n\
    \n| Format | Description |\n| --- | --- |\n| [.mp4](http://en.wikipedia.org/wiki/MPEG-4_Part_14)\
    \ (H.264 encoded) | Used for YouTube and Vimeo videos. No default video player\
    \ on Windows can play the file format. Tools such as VLC are required for playback.\
    \ |\n| [.mov](http://en.wikipedia.org/wiki/QuickTime) (H.264 encoded) | No default\
    \ video player on Windows can play the file format. Tools such as VLC are required\
    \ for playback. |\n| [.wmv](http://en.wikipedia.org/wiki/Windows_Media_Video)\
    \ | No default video player on Mac can play the file format. Tools such as VLC\
    \ are required for playback. |\n| [.flv](http://en.wikipedia.org/wiki/Flash_Video)\
    \ | Flash player required, not supported by all devices (e.g. iOS). |\n| [.ogg](http://en.wikipedia.org/wiki/Ogg)\
    \ | Open-source, candidate for HTML5 video format. |\n\n### Codecs and Compression\n\
    \nThe `codec` determines how the video is `co`mpressed and `dec`omressed (hence\
    \ the name `codec`). Part of that process is determining the complex relationship\
    \ between bit rate and resulting quality.\n\nHave you ever tried to export a video\
    \ you created with iMovie? There are many settings you can choose, because there\
    \ are lots of video and audio codecs available. These are some common ones:\n\n\
    *   [H.264](http://en.wikipedia.org/wiki/H.264/MPEG-4_AVC): video encoding standard\
    \ for Blu-ray discs, Vimeo, YouTube and the iTunes store. The intention of this\
    \ codec is to provide good video quality with low bit rates. It's also the most\
    \ used video codec today for mobile and web, providing small file sizes but higher\
    \ quality video than other codecs (e.g. [Sorensen Spark](http://en.wikipedia.org/wiki/Sorenson_Media#Encoding_Technologies),\
    \ Google's On2) while still having the same bit rate.\n*   MP3 ([MPEG-1 Audio\
    \ Layer 3](http://en.wikipedia.org/wiki/MP3)): MP3 is the most popular audio codec.\
    \ For compatibility reasons, and due to its age, MP3 has the most commonly supported\
    \ audio codec. However, if you choose purely by quality and performance, you'd\
    \ want to go with AAC+.\n*   AAC+ ([Advanced Audio Coding](http://en.wikipedia.org/wiki/Advanced_Audio_Coding)):\
    \ AAC+ is an audio codec that offers the best audio quality at low bit rates.\
    \ It's used by YouTube, iPhone, PlayStation, Android, Blackberry etc.\n\n## Delivery\
    \ Method\n\nCommon delivery methods for videos over the web include streaming,\
    \ download, and progressive download. Based on the file size and bandwidth, you'll\
    \ get different performance results for different user scenarios.\n\n### Streaming\n\
    \n`Streaming` is achieved using a protocol where the video is split up into timed\
    \ chunks (usually 10 seconds). The browser makes a regular HTTP request for each\
    \ chunk. This means the same optimization rules apply here as for assets such\
    \ as CSS and HTML. There are two main streaming protocols:\n\n*   `RTMP` ([Real\
    \ Time Messaging Protocol](https://www.adobe.com/devnet/rtmp.html)) is older and\
    \ runs on port 1335, meaning it won't be viewable by Flash.\n*   A more common\
    \ streaming solution offers `HLS` ([http://en.wikipedia.org/wiki/HTTP_Live_Streaming))/`HDS`\
    \ ([HTTP Dynamic Streaming](https://www.adobe.com/ca/products/hds-dynamic-streaming.html)).\
    \ \n\n### Download\n\n`Downloading` means fetching the video file as one single,\
    \ large file using HTTP. Normally this means your user has to download the entire\
    \ file before playing it.\n\nDepending on the size of the file, this might require\
    \ the user to wait before they can play the video. Therefore, streaming might\
    \ be more appropriate for bigger files and longer videos. If you don't have access\
    \ to a streaming server, however, having the file reached via download might be\
    \ an easier solution. Additionally, if you know your users have slow Internet\
    \ connections, or the video needs to be high quality, download could be your best\
    \ option.\n\n### Progressive Download\n\nVideo formats can be optimized for `progressive\
    \ download`, allowing the video to be playable while the download is in progress.\
    \ The technical definition of [progressive download](http://www.onlinevideo.net/2011/05/streaming-vs-progressive-download-vs-adaptive-streaming/)\
    \ is that the video is delivered by a regular web server rather than a streaming\
    \ server, stored on the viewer's hard drive, and then played from the hard drive.\n\
    \nThis is the opposite of streaming, where the video usually is not stored or\
    \ cached locally, and the viewer can't watch it later. Progressive download is\
    \ sometimes called “Fast Start”.\n\nIn addition, HTTP/1.1 allows the browser to\
    \ request a specific piece of the video resource. You can use the `Accept-Range`\
    \ HTTP header to tell the server only to deliver a subset of bytes from the total\
    \ video file, making it more feel like “[pseudo streaming](https://1stdev.com/tremendum-transcoder/articles/seeking-videos-beyond-the-buffer-line/)”.\n\
    \n# Video Hosting\n\nIn order to avoid thinking about what kind of delivery method\
    \ to use, it might make the most sense to host your video on YouTube or Vimeo—services\
    \ that are optimized for speedy content delivery.\n"
  raw: 'However, every tweak to increase the frame rate will increase the overall
    file size—so it''s important to identify what the intention of your video is.
    For example, if you record a PowerPoint presentation with very little movement
    but you care about image quality, you might want to focus more on higher resolution
    and lessen the frame rate. For fast-moving recordings, such as sports events,
    you''ll want to [make sure to capture as many frames](https://ustream.zendesk.com/entries/22962268-Encoding-Specs-and-Stream-Settings#recommended)
    per second as possible, while giving up a bit of your resolution in return.


    Resolution


    There are two common **resolution** formats—standard definition (SD) and high
    definition (HD). Most common resolutions for SD videos include 640x480px (4:3
    aspect ratio) and 640x360px (16:9 aspect ratio). HD video is usually formatted
    at 720p (1280x720px) or 1080p (1920x1080px).


    Obviously, the higher the resolution, the greater the file size of a video, and
    the longer it will take to deliver to your online consumers.


    Bit Rate


    The **bit rate** controls the visual quality of the video and the file size, measured
    in kilobits per second (kbit/s). [Adobe](http://help.adobe.com/en_US/mediaencoder/cs/using/WSb8e30982e628fbecc0e59e6131255b4dd2-8000.html#WSb8e30982e628fbecc0e59e6131255b4dd2-7ffd)
    recommends lower bit rates for videos delivered over the web. Depending on the
    resolution, the following bit rates could serve as a [guideline](https://vimeo.com/help/compression):
    for SD, use 2,000–5,000kbit/s; for HD, use 5,000–10,000kbit/s for 720p, and 10,000–20,000kbit/s
    for 1080p.


    ### Containers, Codecs and Compression


    Once you''ve selected the frame rate, resolution and bit rate, you''ll need to
    render the video to a specific video format. These formats are also called **video
    containers**. Video containers contain codecs, so the video player knows how to
    read and play the file.


    #### Containers


    The most common video formats are shown below:


    | Format | Description |


    | --- | --- |


    | [.mp4](http://en.wikipedia.org/wiki/MPEG-4_Part_14) (H.264 encoded) | Used for
    YouTube and Vimeo videos. No default video player on Windows can play the file
    format. Tools such as VLC are required for playback. |


    | [.mov](http://en.wikipedia.org/wiki/QuickTime) (H.264 encoded) | No default
    video player on Windows can play the file format. Tools such as VLC are required
    for playback. |


    | [.wmv](http://en.wikipedia.org/wiki/Windows_Media_Video) | No default video
    player on Mac can play the file format. Tools such as VLC are required for playback.
    |


    | [.flv](http://en.wikipedia.org/wiki/Flash_Video) | Flash player required, not
    supported by all devices (e.g. iOS). |


    | [.ogg](http://en.wikipedia.org/wiki/Ogg) | Open-source, candidate for HTML5
    video format. |


    #### Codecs and Compression


    The **codec** determines how the video is **co**mpressed and **dec**ompressed
    (hence the name **codec**). Part of that process is determining the complex relationship
    between bit rate and resulting quality.


    Have you ever tried to export a video you created with iMovie? There are many
    settings you can choose, because there are lots of video and audio codecs available.
    These are some common ones:


    *   [H.264](http://en.wikipedia.org/wiki/H.264/MPEG-4_AVC): video encoding standard
    for Blu-ray discs, Vimeo, YouTube and the iTunes store. The intention of this
    codec is to provide good video quality with low bit rates. It''s also the most
    used video codec today for mobile and web, providing small file sizes but higher
    quality video than other codecs (e.g. [Sorensen Spark](http://en.wikipedia.org/wiki/Sorenson_Media#Encoding_Technologies),
    Google''s On2) while still having the same bit rate.


    *   MP3 ([MPEG-1 Audio Layer 3](http://en.wikipedia.org/wiki/MP3)): MP3 is the
    most popular audio codec. For compatibility reasons, and due to its age, MP3 has
    been the most commonly supported audio codec. However, if you choose purely by
    quality and performance, you''d want to go with AAC+.


    *   AAC+ ([Advanced Audio Coding](http://en.wikipedia.org/wiki/Advanced_Audio_Coding)):
    AAC+ is an audio codec that offers the best audio quality at low bit rates. It''s
    used by YouTube, iPhone, PlayStation, Android, Blackberry etc.


    ### Delivery Method


    Common delivery methods for videos over the web include streaming, download, and
    progressive download. Based on the file size and bandwidth, you''ll get different
    performance results for different user scenarios.


    #### Streaming


    **Streaming** is achieved using a streaming protocol where the streamed video
    is watched from within the browser. Streaming can also be cacheless, allowing
    the streaming publisher to make it more secure and not easy to store locally.
    Two of the most well-known examples for streaming video services are YouTube and
    Vimeo.


    There are two main protocols for streaming web video content. Both of them focus
    on bandwidth optimization, and are delivered by dedicated streaming servers.


    *   RTMP ([Real Time Messaging Protocol](https://www.adobe.com/devnet/rtmp.html))
    is older and runs on port 1335, meaning that it potentially won''t be viewable
    by visitors who only have port 80 open (HTTP). It was developed by Macromedia
    (now Adobe) to stream audio, video and data over the Internet for Flash players.


    *   A more common streaming solution offers HLS ([HTTP Live Streaming](http://en.wikipedia.org/wiki/HTTP_Live_Streaming))/HDS
    ([HTTP Dynamic Streaming](http://www.adobe.com/ca/products/hds-dynamic-streaming.html)).
    The video stream is split up into timed chunks (usually 10 seconds). The browser
    makes a regular HTTP request for each chunk of data. This means that the same
    optimization rules apply here as for other assets such as CSS and HTML. For example,
    caches can take advantage of the chunked discrete data and cache video streams
    for multiple users—something you can''t do with RTMP.


    #### Download


    **Downloading** means fetching the video file as one single, large file using
    HTTP. Normally this means your user has to download the entire video file before
    playing it back.


    Depending on the size of the file, this might require the user to wait before
    they can play the video. Therefore, streaming might be more appropriate for bigger
    files and longer videos. If you don''t have access to a streaming server, however,
    having the file reached via HTTP download might be an easier solution. Additionally,
    if you know your users have slow Internet connections, or the video needs to be
    high quality, download could be your best option.


    #### Progressive Download


    Video formats can be optimized for **progressive download**, allowing the video
    to be playable while the download is in progress. The technical definition of
    [progressive download](http://www.onlinevideo.net/2011/05/streaming-vs-progressive-download-vs-adaptive-streaming/)
    is that the video is delivered by a regular HTTP web server rather than a streaming
    server, stored on the viewer''s hard drive, and then played from the hard drive.


    This is the opposite of streaming, where the video usually is not stored or cached
    locally, and the viewer can''t watch it later. Progressive download is sometimes
    called “Fast Start”.


    In addition, HTTP/1.1 allows the browser to request a specific piece of the video
    resource. You can use the `Accept-Range` HTTP header to tell the server only to
    deliver a subset of bytes from the total video file, making it more feel like
    “[pseudo streaming](http://1stdev.com/tremendum-transcoder/articles/seeking-videos-beyond-the-buffer-line/)”.
    This provides the user with the advantage of not having to wait until the complete
    file has been downloaded.


    ### Video Hosting


    In order to avoid thinking about what kind of delivery method to use, it might
    make the most sense to host your video on YouTube or Vimeo—services that are optimized
    for speedy content delivery.'
