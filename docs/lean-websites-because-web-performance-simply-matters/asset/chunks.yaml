  trans: "\n\n图 5.5. 示例页面的 [WPT 视频对比](http://www.webpagetest.org/video/compare.php?tests=141222_R6_JNC%2C141222_4C_KDV&thumbSize=100&ival=500&end=visual#)，展示了优化前后的对比\n\
    \n| 测试 | 速度索引 (Speed Index) | 渲染开始 (Start Render) | 视觉完成 (Visually Complete) |\n\
    | --- | --- | --- | --- |\n| [未使用优化 CRP](http://www.webpagetest.org/result/141222_R6_JNC/2/details/)\
    \ | 3400 | 3.4s | 3.4s |\n| [使用优化 CRP](http://www.webpagetest.org/result/41222_4C_KDV/1/details/)\
    \ | 1608 | 0.7s | 2.3s |\n\n总结一下我们对上述页面所做的：\n\n*   我们专注于通过尽早加载关键资源来调整资产的渲染顺序\n\
    *   我们尽可能减少了 `<head>` 标签中的脚本和样式表，仅在 `<head>` 中保留关键 CSS\n*   我们保持 HTML 尽可能整洁\n\
    *   我们将非关键脚本移动到了页面底部\n\n## 减少 HTTP 请求\n\n> 最快的 HTTP 请求是不需要发送的请求。（Steve Souders，Fastly\
    \ 首席性能官）\n\n虽然你对用户的网络连接或服务器处理时间没有太大的控制权，但你可以优化你所能控制的内容——即正在发送的 HTTP 请求的大小和数量。\n\
    \n原理很简单：移除你不需要发送的请求，并在包含另一个 HTTP 请求之前深思熟虑，特别是当请求来自不同域名并需要额外的 DNS 查询时。对于你*确实*需要发送的请求，应该考虑以下最佳实践。\n\
    \n### 合并（智能合并）\n\n一种实用的性能技术是将多个独立的文件合并为一个文件，这个过程被称为 `concatenation`（合并）。通过合并，你可以减少\
    \ HTTP 请求的数量，从而更快地提供内容。\n\n合并的理想对象是 JavaScript 和 CSS 文件，因为除了 HTML 本身外，它们构成了网页非二进制资源的大部分。虽然合并可以减少所需的\
    \ HTTP 请求数量，但并不意味着将所有内容都合并成一个大文件总是最佳选择。你需要一种智能的合并策略，如下所示。\n\n#### CSS\n\n首先，为你网站上使用的所有\
    \ CSS 文件创建一个清单。检查这些文件并分析哪些文件可以从合并中获益。\n\n例如，假设你有一个巨大的网站，有许多样式表涵盖了不同页面的样式。将许多 CSS\
    \ 文件合并成一个大的合并 CSS 文件可能可以减少 HTTP 请求的数量，但在某些边缘情况下，这实际上可能会导致开销和冗余：\n\n*   如果这些合并的\
    \ CSS 文件其中一个频繁变化，浏览器每次在变化时都需要重新下载合并后的大 CSS 文件，这并不是最优的。解决此问题的办法是确定哪些 CSS 文件不经常变化，哪些频繁变化，并对它们进行相应的分离。\n\
    *   确定每个页面所需的样式与不经常使用的样式。每个网站都应该遵循样式指南，定义在网站上使用的颜色和字体。为了保持一致性，在网站的每个页面上加载这些样式是合理的。但是，可能也存在样式并不是每个页面都会使用的。例如，将购物车页的样式包含在每个页面都加载的样式表中是没有意义的。你在合并的\
    \ CSS 文件中放入的选择器越多，它就会变得越复杂、越大，不可避免地导致代码性能下降。将不常用的样式与常用的样式分离。在合并 CSS 文件之前，问问自己这些文件在网站上的使用频率以及在什么情况下使用。\n\
    \n#### JavaScript\n\n关于合并的相同考虑也适用于多个 JavaScript 文件。\n\n*   在将一个 JavaScript 文件与另一个合并之前，考虑两个文件内容更改的概率。它们的更改频率一样吗？评估这些文件的内容应该由浏览器单独获取并缓存，还是合并成一个文件。\n\
    *   可能存在仅在网站某些页面使用的功能或小组件（例如，只显示在你网站某个特定页面的图库小组件）。没有必要将它们包含在每个页面都加载的、合并后的主 JavaScript\
    \ 文件中。下载未使用 JavaScript 的开销可能比保持文件分离更大，特别是当你知道并非所有访问者都需要图库小组件时。\n\n对在什么情况下应该合并文件做出有意识的决定。问问自己\
    \ JavaScript 文件中执行的功能是所有页面都需要的，还是仅针对网站的特定部分。\n\n一旦你确定了哪些文件应该合并，你就可以获得性能提升。以下示例说明了恰当合并\
    \ JavaScript 文件时可以实现的性能改进。示例页面依赖于五个独立的 JavaScript 文件——因此，它们应该被合并。\n\n*   `non-concat.html`:\
    \ 此文件包含了五个 JavaScript 文件：\n    ![non-concat.html 的 WPT 瀑布图](img/5-non-concat-ff.png)\n\
    \    图 5.6 [non-concat.html](http://www.bbinto.me/lean-websites/chapter-5/minified/non-concat.html)\
    \ 的 WPT 瀑布图\n*   `concat.html`: 此文件将相同的 JavaScript 文件合并为一个名为 `concat.js` 的 JavaScript\
    \ 文件：\n    ![concat.html 的 WPT 瀑布图](img/5-concat-ff.png)\n    图 5.7 [concat.html](http://www.bbinto.me/lean-websites/chapter-5/minified/concat.html)\
    \ 的 WPT 瀑布图\n\n我通过 WPT 运行了两个页面，关注 Start Render（渲染开始）和 Fully Loaded（完全加载）值。\n\n\
    | URL | Start Render | Fully Loaded |\n| --- | --- | --- |\n| [non-concat.html](http://www.webpagetest.org/result/150117_KK_N3V/5/details/)\
    \ | 0.547s | 0.615s |\n| [concat.html](http://www.webpagetest.org/result/150117_NG_N3T/4/details/)\
    \ | 0.473s | 0.554s |\n\n如你所示，通过合并获得了一些性能提升。\n\n#### 条件加载\n\n如果你遇到并非每个页面、每个浏览器或每个设备都需要的样式和功能，不建议对这些文件进行合并。相反，使用条件加载根据某些条件加载资源。\n\
    \n**条件资源加载器**，例如 [yepnope](http://yepnope.com/) 和 [RequireJS](http://www.requirejs.org/)，可以帮助你只加载特定情况所需的资源。此外，像\
    \ [Modernizr](http://modernizr.com/) 这样的特性检测库可以识别用户浏览器具有哪些能力和特性，从而加载或移除特定文件。[Detectizr](https://github.com/barisaydinoglu/Detectizr)\
    \ 是一个位于 Modernizr 之上的库，可以根据设备触发条件加载。\n\n#### 工具\n\n虽然你可以手动合并文件，但最好使用工具来自动化此过程。一种快速的解决方案是使用\
    \ Unix [`cat`](http://en.wikipedia.org/wiki/Cat_%28Unix%29) 命令。例如，你可以使用以下命令将所有\
    \ CSS 文件合并为 `merge.css`，或将所有 JavaScript 文件合并为 `merge.js`：\n\n```\n$ cd css/\n\
    $ cat *.css > merge.css\n\n// 或者 JavaScript\n$ cd javascript/\n$ cat *.js > merge.js\n\
    ```\n\n还有一些更复杂的命令行工具可以结合合并和压缩化。[Google 的 Closure Compiler](https://developers.google.com/closure/compiler/)\
    \ 支持合并（仅针对 JavaScript 文件），像 [Grunt](https://github.com/gruntjs/grunt-contrib-concat)\
    \ 和 [Gulp](http://gulpjs.com/) 这样的任务管理器也提供了合并任务和插件。我们将在第 8 章中使用 Grunt 和 Gulp 来展示如何自动化性能任务。\n\
    \n"
- fmt: "\nLet's concatenate the files shown in the earlier example with Google's [Closure\
    \ Compiler](http://closure-compiler.appspot.com/home). Download the Java [jar\
    \ file](https://code.google.com/p/closure-compiler/downloads/list) and execute\
    \ one of the following commands:\n\n```\njava -jar compiler.jar --js_output_file=concat.js\
    \ 1.js 2.js 3.js ...\n\n# Recursively include all js files in subdirs\njava -jar\
    \ compiler.jar --js_output_file=concat.js 'src/**.js'\n```\n\n### Tip: No Java?\n\
    \nThe local version of Closure Compiler requires the installation of Java and\
    \ running it via the Java CLI runtime. If you don't want to use Java via a CLI,\
    \ Closure Compiler is available [online](http://refresh-sf.com/yui/).\n\n### Image\
    \ Spriting\n\nThe main idea of `image spriting` is to reduce the HTTP requests\
    \ that are needed to serve the images on the page. Spriting is done by combining\
    \ each smaller individual image into one big image, and then displaying a small\
    \ section of that image (a `sprite`) at defined `X` and `Y` coordinates. That\
    \ way, instead of making multiple HTTP requests for each image, you'll only need\
    \ one HTTP request.\n\nLet's run through an example to show how it works. Say\
    \ I have four flora images that I want to show on a page—a grass patch in a planter,\
    \ a tree, a leaf, and a planted pot. Instead of displaying each flora image by\
    \ using separate image tags (and four HTTP requests) like this:\n\n```\n<img src=\"\
    img/planter.png\"/>\n<img src=\"img/tree.png\"/>\n<img src=\"img/leaf.png\"/>\n\
    <img src=\"img/pot.png\"/>\n```\n\nwe can create a sprite image using the [CSS\
    \ Sprites Generator](http://csssprites.com/), an online tool that allows you to\
    \ upload each image individually, and which creates the required CSS as well as\
    \ the sprite image (see below):\n\n![Using the CSS Sprites Generator to create\
    \ a sprite image and corresponding CSS](OEBPS/figures/5-css-sprites-tool.png)\n\
    \nFigure 5.8. Using the CSS Sprites Generator to create a sprite image and corresponding\
    \ CSS\n\nWe can now use the generated sprite image and the x/y coordinates to\
    \ display each of the flora images in the page:\n\n```\n<style type=\"text/css\"\
    >\n   div {\n       background: url('img/sprite.png');\n   }\n   .planter {background-position:\
    \ -0px -0px; width: 107px; height: 81px}\n   .tree {background-position: -0px\
    \ -91px; width: 46px; height: 52px}\n   .leaf {background-position: -0px -153px;\
    \ width: 47px; height: 55px}\n   .pot {background-position: -0px -218px; width:\
    \ 42px; height: 79px}\n </style>\n<!-- planter -->\n<div class=\"planter\"></div\n\
    <!-- tree -->\n<div class=\"tree\"></div\n<!-- leaf -->\n<div class=\"leaf\"></div\n\
    <!-- planted pot -->\n<div class=\"pot\"></div>\n```\n\nLet's check out these\
    \ sample pages in WPT, first without using sprites ([Figure 5.9](#ch05.html_ch5-nosprite\
    \ \"Figure 5.9. Sample page without sprites, using img tags\")) and then with\
    \ sprites ([Figure 5.10](#ch05.html_ch5-sprite \"Figure 5.10. Sample page using\
    \ sprites\")):\n\n![Sample page without sprites, using img tags](OEBPS/figures/5-css-sprites-tool.png)\n\
    \nFigure 5.9. Sample page without sprites, using img tags\n\nFigure 5.10. Sample\
    \ page using sprites\n\n### Minification\n\nMinification is the process of reducing\
    \ the size of files without changing their functionality. This often involves\
    \ removing unnecessary characters like comments, whitespace, and shortening variable\
    \ names.\n"
  raw: "Let's concatenate the files shown in the earlier example with Google's [Closure\
    \ Compiler](http://closure-compiler.appspot.com/home). Download the Java [jar\
    \ file](https://code.google.com/p/closure-compiler/downloads/list) and execute\
    \ one of the following commands:\n\n```\njava -jar compiler.jar --js_output_file=concat.js\
    \ 1.js 2.js 3.js ...\n\n# Recursively include all js files in subdirs\njava -jar\
    \ compiler.jar --js_output_file=concat.js 'src/**.js'\n```\n\n### Tip: No Java?\n\
    \nThe local version of Closure Compiler requires the installation of Java and\
    \ running it via the Java CLI runtime. If you don't want to use Java via a CLI,\
    \ Closure Compiler is available [online](http://refresh-sf.com/yui/).\n\n### Image\
    \ Spriting\n\nThe main idea of **image spriting** is to reduce the HTTP requests\
    \ that are needed to serve the images on the page. Spriting is done by combining\
    \ each smaller individual image into one big image, and then displaying a small\
    \ section of that image (a **sprite**) at defined X and Y coordinates. That way,\
    \ instead of making multiple HTTP requests for each image, you'll only need one\
    \ HTTP request.\n\nLet's run through an example to show how it works. Say I have\
    \ four flora images that I want to show on a page—a grass patch in a planter,\
    \ a tree, a leaf, and a planted pot.\n\nInstead of displaying each flora image\
    \ by using separate image tags (and four HTTP requests) like this:\n\n```\n<img\
    \ src=\"img/planter.png\"/>\n<img src=\"img/tree.png\"/>\n<img src=\"img/leaf.png\"\
    />\n<img src=\"img/pot.png\"/>\n```\n\nwe can create a sprite image using the\
    \ [CSS Sprites Generator](http://csssprites.com/), an online tool that allows\
    \ you to upload each image individually, and which creates the required CSS as\
    \ well as the sprite image (see below):\n\n![Using the CSS Sprites Generator to\
    \ create a sprite image and corresponding CSS](OEBPS/figures/5-css-sprites-tool.png)\n\
    \nFigure 5.8. *Using the CSS Sprites Generator to create a sprite image and corresponding\
    \ CSS*\n\nWe can now use the generated sprite image and the x/y coordinates to\
    \ display each of the flora images in the page:\n\n```\n<style type=\"text/css\"\
    >\n   div {\n       background: url('img/sprite.png');\n   }\n   .planter {background-position:\
    \ -0px -0px; width: 107px; height:\n↵ 81px}\n   .tree {background-position: -0px\
    \ -91px; width: 46px; height:\n↵ 52px}\n   .leaf {background-position: -0px -153px;\
    \ width: 47px; height:\n↵ 55px}\n   .pot {background-position: -0px -218px; width:\
    \ 42px; height:\n↵ 79px}\n </style>\n<!-- planter -->\n<div class=\"planter\"\
    ></div>\n<!-- tree -->\n<div class=\"tree\"></div>\n<!-- leaf -->\n<div class=\"\
    leaf\"></div>\n<!-- planted pot -->\n<div class=\"pot\"></div>\n```\n\nLet's check\
    \ out these sample pages in WPT, first without using sprites ([Figure 5.9](#ch05.html_ch5-nosprite\
    \ \"Figure 5.9. Sample page without sprites, using img tags\")) and then with\
    \ sprites ([Figure 5.10](#ch05.html_ch5-sprite \"Figure 5.10. Sample page using\
    \ sprites\")):\n\n![Sample page without sprites, using img tags](OEBPS/figures/5-nosprite-example.png)\n\
    \nFigure 5.9. [Sample page without sprites, using `img` tags](http://www.webpagetest.org/result/141108_DJ_K4M/)\n\
    \n![Sample page using sprites](OEBPS/figures/5-sprite-example.png)\n\nFigure 5.10. [Sample\
    \ page using sprites](http://www.webpagetest.org/result/141108_9F_K4F/)\n\nWe've\
    \ reduced the number of HTTP requests by three individual requests, and [dropped\
    \ the load time](http://www.webpagetest.org/video/compare.php?tests=141108_9F_K4F,141108_DJ_K4M)\
    \ by around a tenth of a second.\n\nTalk to your design team to help you create\
    \ a “sprite sheet”. There are [many](http://blog.booking.com/automating-css-sprites-for-large-organisations.html)\
    \ tools available that you or your designers can use for spriting. You can either\
    \ write [scripts](http://www.johnwordsworth.com/projects/photoshop-sprite-sheet-generator-script/)\
    \ for Photoshop to handle this work for you, use online tools such as the CSS\
    \ Sprites Generator, or even automate the process by using command line tools\
    \ such as [Glue](http://gluecss.com/).\n\n### Note: Caching\n\nLeveraging the\
    \ browser's local cache is a technique used for performance optimization. Every\
    \ browser includes a cache, but needs to get instructions on how and when to use\
    \ it. You can set the logic—such as when to request a newer or fresher version\
    \ of an asset, or when not to use the one in the cache at all—by using the `Cache-Control`\
    \ headers.\n\nWe will learn more about caching and how to set `Cache-Control`\
    \ headers to reduce HTTP requests in Chapter 9.\n\n## Optimizing HTTP Requests\n\
    \nYou can't remove all HTTP requests, as there are requests and assets that are\
    \ crucial and required for the rendering your website. Therefore, after looking\
    \ into how to avoid unnecessary HTTP requests, let's focus now on optimizing the\
    \ requests that are absolutely necessary.\n\n### Minifying\n\n**Minifying** is\
    \ the process of using a tool to eliminate unnecessary characters from your code\
    \ to optimize it, without changing its functionality.\n\nDuring the process of\
    \ minifying, the following things are stripped out of your file:\n\n*   White\
    \ space characters\n\n*   New line characters\n\n*   Comments\n\n*   Block delimiters\n\
    \nIn addition to stripping out unnecessary characters, minifiers also typically\
    \ rewrite sections of code (such as variable names or identifiers) to optimize\
    \ it further. By minifying assets such as CSS, JavaScript or HTML files, you can\
    \ significantly reduce the size of data that has to be sent over the wire, and\
    \ hence improve load time and performance.\n\nClosure Compiler, a tool we discussed\
    \ earlier, not only provides concatenation capabilities, but also parses JavaScript,\
    \ analyzes it, removes dead code and rewrites and minifies what's left.\n\n###\
    \ Note: Minify as a Final Step\n\nMinification obfuscates the code, which thus\
    \ makes it hard for humans to read. If your code is not yet production-ready and\
    \ still needs some debugging, you might want to minify your code only during the\
    \ last step of your deployment. Task runners, which I will introduce in Chapter\
    \ 8, can add this kind of optimization as the last step of a build process.\n\n\
    #### Tools\n\nThere are many online, browser-based tools available that help you\
    \ minify your assets, such as [JSCompress for JavaScript](http://jscompress.com/),\
    \ [CSS Minifier for CSS](http://cssminifier.com/), and [HTML Minifier for HTML](http://www.willpeavy.com/minifier/).\
    \ The [PageSpeed Insights plugin](https://developers.google.com/speed/docs/insights/MinifyResources)\
    \ for Chrome offers links to minified versions of your content, as shown in [Figure 5.11](#ch05.html_ch5-pagespeed-min\
    \ \"Figure 5.11. PageSpeed Insights Chrome plugin, offering minified versions\
    \ of your assets\"):\n\n![PageSpeed Insights Chrome plugin, offering minified\
    \ versions of your assets](OEBPS/figures/5-pagespeed-minify.png)\n\nFigure 5.11. PageSpeed\
    \ Insights Chrome plugin, offering minified versions of your assets\n\nIn addition\
    \ to the online tools and plugins, there are various command line tools that can\
    \ be integrated into your deployment process—such as [YUI Compressor](http://developer.yahoo.com/yui/compressor/),\
    \ Closure Compiler, or [JSMin](http://www.crockford.com/javascript/jsmin.html)—to\
    \ achieve the same outcome. We'll discuss the automation of these tools in more\
    \ detail in Chapter 8.\n\nLet's just take a quick look at YUI Compressor for now.\
    \ After downloading the Java [jar file](https://github.com/yui/yuicompressor/releases),\
    \ you can run the following command on CSS or JavaScript files to minify them.\
    \ Please note that using this locally requires the installation of Java and running\
    \ it via the CLI.\n\n```\n// minify all .css files in current folder, and save\
    \ as -min.css\njava -jar yuicompressor.jar -o '.css$:-min.css' *.css\n\n// or\
    \ simply\njava -jar yuicompressor-1.0.jar -o 1.min.s 1.js\n```\n\n### Tip: No\
    \ Java?\n\nIf you don't want to use Java via CLI, the YUI Compressor is available\
    \ [online](http://refresh-sf.com/yui/).\n\n### Pre-browsing"
