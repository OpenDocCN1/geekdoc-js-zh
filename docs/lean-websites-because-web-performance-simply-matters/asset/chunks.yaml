    * 你已经学习了如何搭建自己的性能仪表板，从一个私有的 HTTP Archive 实例开始，收集 RUM 数据以理解用户的带宽、加载时间，以及更重要的延迟。此外，你还接触了监控产品和告警系统，以帮助你应对性能问题。

    * 你已经学习了如何根据网站的 RUM 测量结果、WPT 结果以及竞争对比分析来设定合理的性能目标。

    * 总的来说，你已经学会了如何发现自己网站的性能问题。现在，让我们来修复它们吧！

    * CTA 按钮可以是“购买”、“购物”等，取决于你希望访问者在访问时实现什么目标。


    # 第 5 章：掌握精简 HTTP 请求


    ## 预热

    我们已经了解到，在网页性能方面，延迟是最大的瓶颈之一。减少延迟的最佳方法是减少浏览器必须进行的 HTTP 请求数量，并尽可能地减小每个被请求资源的大小。为了让你理解如何掌握精简
    HTTP 请求，我将首先解释浏览器是如何处理它们的。在帮助你掌握浏览器工作原理后，我将讨论缩小规模和优化 HTTP 请求的方法，例如图片合并、文件合并和压缩。


    ## 理解浏览器的工作原理

    通过理解浏览器如何渲染你的内容，你将对如何构建和排序页面元素获得大量见解。浏览器的任务是加载资源，这些被称为 HTTP 请求。正如我们在剖析 HTTP 事务时看到的，每个资源都关联了几个指标，帮助衡量其性能。


    下面的流程图显示了浏览器渲染页面及其资源时所经历的步骤。**渲染**——在浏览器窗口中显示请求内容的过程——是浏览器的主要功能：


    ![How the browser renders](img/5-browser-rendering.png)


    图 5.1. 浏览器如何渲染


    ### 注意：渲染规则

    浏览器在渲染页面时遇到的任何歧义都会阻塞渲染，直到问题解决。请确保为浏览器提供整洁的标记以及如何渲染页面的指令。


    让我们来看图 5.1 所示的图：


    #### HTML

    HTML 解析是渲染拼图中的关键部分，会导致文档对象模型的构建。解析是增量进行的，这样浏览器就可以发送必要响应的同时，发现所需的和即将到来的请求。


    #### 文档对象模型

    浏览器解析 HTML 文档以构建**文档对象模型** (DOM) ——这是一个描述页面上元素的树结构结构。


    #### CSS

    CSS 是**渲染阻塞的**，这意味着浏览器在渲染内容之前，需要加载 HTML 标记中引用的*所有* CSS 文件。没有样式，页面可能会变得不可用，有时甚至无法使用。如果你的
    CSS 加载在页面靠后的位置，可能会发生名为“无样式内容闪”（FOUC）的现象。


    #### CSS 对象模型

    除了解析 HTML 之外，浏览器还必须处理样式表（CSS），以理解 DOM 中的元素应该如何显示。我们将其称为 CSS 对象模型（CSSOM）。DOM 和
    CSSOM 共同允许浏览器绘制页面。


    #### JavaScript

    JavaScript 赋予了操纵和与 DOM 交互的能力，这会导致渲染树发生变化。如果发生这种情况，渲染将被阻塞，直到浏览器解析并执行该脚本。JavaScript
    可以同步加载（阻塞 DOM），也可以异步加载（这不会中断文档的解析）。在 CSSOM 完全加载之前，JavaScript 将不会运行。不同的浏览器运行在不同的
    JavaScript 引擎上。根据你的用户使用的浏览器，他们对你网站性能的体验可能会有所不同，特别是当它是一个沉重的 JavaScript Web 应用时。


    #### 渲染树

    **渲染树**结合了屏幕上所有可见内容的内和样式信息。这是 DOM 和 CSSOM 汇合的事件。


    DOM 中的所有节点都会出现在渲染树中。例如，脚本和 meta 标签是非可见元素，用户是看不见的。


    此外，`visibility: hidden` 样式声明不会将其子元素插入渲染树，但它们会被渲染并作为空框显示。然而，使用 `display:none` 样式声明的元素（节点）不会被添加到渲染树中。


    #### 布局

    虽然渲染树让我们更接近在屏幕上看到内容，但仍然缺少一些重要内容：这个过程没有定义每个节点在页面上的位置或大小。这就是**布局**步骤负责的工作。


    #### 绘制

    最后一步是**绘制**像素。样式表定义了绘制过程的昂贵程度。如果你有复杂的样式，例如阴影或 CSS 动画，可能会增加渲染树的复杂性，导致加载时间变慢。绘制步骤将揭你的网站在滚动时是否无卡顿（jank-free）。对于图形处理单元（GPU）来说，重绘是非常昂贵的，会导致你的页面在滚动时感觉笨拙。


    ### 注意：卡顿 (Jank)

    **卡顿**指的是滚动页面时任何感觉笨拙或延迟的情况。它基本上是流畅滚动的反面。例如，当 JavaScript 尝试在 `onscroll` 处理程序中重绘大量内容时就会发生卡顿效应。


    ### 注意：JavaScript 引擎

    一些流行的引擎有 Nitro、SpiderMonkey、V8 和 Chakra：


    | 引擎 | 浏览器 |

    | --- | --- |

    | Nitro (JavaScriptCore) | Safari |

    | SpiderMonkey | Firefox |

    | V8 | Google Chrome |

    | Chakra | Internet Explorer |


    Douglas Crockford，“JavaScript 之之父”构建了一个代表性的性能基准工具来比较 JavaScript 引擎：


    ![Performance comparison of different JavaScript engines (by Douglas Crockford)](img/5-javascript-engine.png)


    图 5.2. 不同 JavaScript 引擎的性能对比（来自 Douglas Crockford））


    ### 关键渲染路径

    通过上面的页面渲染过程，我们实际上遍历了所谓的**关键渲染路径** (CRP)。CRP 描述了渲染页面初始视图（或可见的折叠以上部分）所需的代码和资源。


    让我们通过一个简单的示例遍历 CRP：


    ```

    1\. <html>

    2\.  <head>

    3\.      <link rel="stylesheet" href="style.css">

    4\.  </head>

    5\.  <body>

    6\.      <div>Hello Friends!/</div>

    7\.      <img src="bbinto.jpg">

    8\.      <script src="load_map.js"></\/script>

    9\.  </body>

    10\. </html>

    ```

    ```


    渲染此页面会发生几个步骤：


    1. 浏览器在接收到 HTML 后开始构建 DOM。此时浏览器也发现了 `link` 标签并发送请求以获取 CSS。

    2. 只有当 CSS 到达后，才能构建 CSSOM，这就是为什么 CSS 是渲染阻塞的。DOM 的构建无法完成，因为 JavaScript 尚未被解析。

    3. 一旦 CSS 到达，浏览器就可以构建 CSSOM，从而解除对 JavaScript 的阻塞。

    4. 现在 JavaScript 可以加载了，这解除了 DOM 的阻塞。浏览器将把 DOM 和 CSSOM 合并为渲染树。

    5. 最后，浏览器可以完成布局和绘制步骤。


    [图 5.3] 展示了浏览器在完成这些步骤时发生的情况：


    ![The critical rendering path](img/5-crp-path.png)


    图 5.3. 关键渲染路径


    '
- fmt: '

    We''ve just discussed how the browser works, what the `CRP` is, and what each
    step of the rendering process entails. Now let''s apply this knowledge by identifying
    opportunities to optimize the `CRP`. Understanding how the browser constructs
    the `CRP` puts you at a huge advantage when planning how and what to load on your
    page. Anything that is not absolutely essential for serving the initial view of
    a page should not be on the `CRP`.


    The goal is to improve the time to first render the page by prioritizing the visible
    content of the page. To optimize the `CRP`, first and foremost, you will need
    to minimize critical resources. In order to do that you will need to identify
    and remove render blocking assets as much as possible.


    Latency is one of the biggest bottlenecks for serving fast websites. One way of
    helping to conquer this issue is to focus on visible (`ATF`) content first. If
    we can identify what is shown to the user above the fold in the browser, we can
    focus on that piece first when the page is loaded. Removing styles not needed
    for the `ATF` part of the page can drastically reduce the amount of time it takes
    to render the page. Since `CSS` is render blocking, anything that we can remove
    from the `CSS` will improve our render times.


    ### Follow the 14KB Rule


    In the spirit of focusing on the visible content first, that also means focusing
    on the code that is at the top of an `HTML` page. Have you heard of the 14KB rule?


    In [Chapter 3](#ch03.html "Chapter 3Measuring & Monitoring Performance"), we discussed
    `HTTP` transactions. The first part of that is the initial connection. It''s the
    time that the client and browser start to communicate, performing a “handshake”.
    Each communication back and forth, before sending data, is defined as a `round
    trip`.


    It is better to serve as much valuable content as you can within the first round
    trip. Having said that, only [14KB](http://storage.googleapis.com/io-2013/presentations/239-%20Instant%20Mobile%20Websites-%20Techniques%20and%20Best%20Practices.pdf)
    of the `HTML` can be transferred before a new round trip.


    We should therefore send the most critical data to render first—presumably the
    `ATF` content—within the first 14KB. This way we can avoid additional round trips
    in order to show the first bits and pieces of the page.


    If you follow this 14KB rule, your `Start Render` time will be improved, as it
    will correlate with the first round trip time. Let''s look at an example to check
    how the Start Render time plays out. I used the wrapper of my blog, and included
    several cute dog pictures. The page consists of a hero image (the wide image at
    the top), several dog images, and further down more styling, including the footer.
    The screenshot in [Figure 5.4](#ch05.html_ch5-plain-atf "Figure 5.4. Our sample
    page, with the ATF area marked, as well as some additional styles outside the
    ATF") displays the page with `ATF` content highlighted:


    ![Our sample page, with the ATF area marked, as well as some additional styles
    outside the ATF](OEBPS/figures/5-plain-atf-full.png)


    Figure 5.4. Our sample page, with the ATF area marked, as well as some additional
    styles outside the ATF


    There are several tools available to help you extract styles for your `ATF` content
    from your style sheets, and instead embed (or “inline”) them within the `head`
    of your `HTML` page. I used a [bookmarklet](https://gist.github.com/terrencewood/8876579)
    that was introduced by Paul Kinlan, a smart engineer at Google, to help me identify
    the critical `ATF` styles. You could also use the [Critical Path CSS Generator](http://jonassebastianohlsson.com/criticalpathcssgenerator/)
    instead.


    1. Load the page in a browser with the bookmarklet installed.

    2. Click the bookmarklet, and voilà, the critical `CSS` appears in the console.

    3. Copy the output into the `head` of the page, wrapped in a `style` element.

    4. Move the rest of the `CSS` to the bottom of the page.


    Let''s not stop here! Before I show you the result of the improvements thus far,
    I want to optimize the `CRP` even further by cleaning up the head.


    You can do this by moving scripts to the bottom of the page and revisiting used
    style sheets. If you use different styles for different media (such as print vs.
    screen), make sure to use the `media` attribute to distinguish them. By specifying
    the `media` attribute for a print version of the page, you can be assured that
    the `print.css` style sheet won''t be render blocking. However, note that the
    file will still be downloaded by the browser.


    ```

    <link rel=''stylesheet'' href=''http://www.bbinto.me/wp-includes/css/print.css''
    type=''text/css''/>

    ```


    However, it''s better to include the `media` attribute, as shown below:


    ```html

    <!-- print.css stylesheet is not render blocking -->

    <link rel=''stylesheet'' href=''http://www.bbinto.me/wp-includes/css/print.css''
    type=''text/css'' media=''print'' />

    ```


    Here was the head prior to cleanup. Quite messy, don''t you think?


    ```html

    <head>

    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut" href="/favicon.ico" type="image/x-icon">

    <title>bbinto.me</title>

    <link rel=''stylesheet'' href=''http://www.bbinto.me/wp-content/themes/matheson/style.css?ver=3.9.2''
    type=''text/css'' media=''all'' />

    <link rel=''stylesheet'' href=''//fonts.googleapis.com/css?family=Raleway|Open-Sans:400,400italic,700,700italic''
    type=''text/css'' media=''all'' />

    <link rel=''stylesheet'' id=''font-awesome-css''  href=''http://www.bbinto.me/wp-content/themes/matheson/library/css/font-awesome.css''
    type=''text/css'' media=''all'' />

    <script type=''text/javascript'' src=''https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js''></script>

    </head>

    ```


    Moving unnecessary code out of the head to keep it as clean as possible. Let''s
    look at the cleaned-up:


    ```html

    <head>

    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut" href="/favicon.ico" type="image/x-icon">

    <title>bbinto.me</title>

    <style> /* critical inline css */

    *,::after,::before{box-sizing:border-box}*{word-wrap:break-word}html{font-family:sans-serif;font-size:62.5%;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:''Helvetica
    Neue'',Arial,sans-serif;font-size:14px;line-height:1.5}

    </style>

    </head>

    ```


    Here is the footer:


    ```html

    <link rel=''stylesheet'' id=''theme-stylesheet-css''  href=''http://www.bbinto.me/wp-content/themes/matheson/style.css?ver=3.9.2''
    type=''text/css'' media=''all'' />

    <link rel=''stylesheet'' href=''//fonts.googleapis.com/css?family=Raleway|Open-Sans:400,400italic,700,700italic''
    type=''text/css'' media=''all'' />

    <link rel=''stylesheet'' id=''font-awesome-css''  href=''http://www.bbinto.me/wp-content/themes/matheson/library/css/font-awesome.css''
    type=''text/css'' media=''all'' />

    <script type=''text/javascript'' src=''https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js''></script>

    ```

