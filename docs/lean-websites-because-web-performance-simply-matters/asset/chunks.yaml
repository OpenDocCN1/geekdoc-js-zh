    # 第 1 章：性能至关重要


    ## 精简的网站

    这本书《精简的网站》（*Lean Websites*）探讨了网站臃肿和缓慢背后的原因，剖析了页面中哪些资源是必要的，哪些是锦上添花的，哪些是完全没且可以删除以减轻负担的。它将帮助你理解导致网站变慢的原因，以及如何在保持网站最初设想质量的同时寻找效率。


    书名包含了 `lean`（精简）一词。那么这个词是什么意思呢？


    “Lean”在书中用于描述我们创建的产品的本质以及创建它的过程。保持产品精简意味着移除任何可能阻碍其性能的因素。对于网站来说，这意味着专注于关注为网站增加价值的元素，并确保这些元素经过优化，以提供最佳的用户体验。同样，我们越实践构建健康、轻量级的网站，这个过程就变得越精简、越高效——希望这能成为我们部署网站时
    DNA 的一部分。


    但让我们先明确一点：有一个坏消息。从性能的角度来看，在构建网站时，你可以犯下*很多*错误——而且可能正在犯这些错误！但嘿，也有好消息：有很多相对简单的方法可以解决这些问题。


    正如谚语所，“领先的秘诀在于开始。”所以，让我们开始吧！


    ## 速度的心理学

    人们为什么离开网站？可能有很多原因，例如很难找到他们想要的内容。但用户离开很有可能是因为加载太慢了。在这一部分中，我想关注一下心理学，以及它是如何在我们感知速度和性能中发挥巨大作用的。


    ### 什么是“太慢”，网站何时“感觉”慢？

    正如心理学家 Jeremy Dean 指出的，[当我们开心时，时间过得很快](http://www.spring.org.uk/2011/06/10-ways-our-minds-warp-time.php)。我们什么时候体验快乐？显然，不是在等待的时候。谁喜欢等待，尤其是在这个不断更新新闻和响应的世界里？如今，人们渴望即时满足，极少耐心。Amazon
    提供一日送达；出租车到达时间不应超过十分钟。我们已经变成了一个等待不再被接受的社会——尤其是在网络世界。当我们访问网站时，如果没有得到即时响应，竞争对手的网站只需点击一下就能触达。


    > [盯着锅里的水看永远不会烧开。当我们无聊时，分钟会过得格外漫长。](http://www.theguardian.com/science/2013/jan/01/psychology-time-perception-awareness-research)


    讨论网站速度的问题在于，速度的感知是非常主观的且取决于特定背景的。对我来说慢，对我父亲或祖母来说可能并不慢。我们都有不同的预期。因此，第 3 章将帮助我们用真实的数字和数据制定“太慢”的定义。


    ### Maister 的服务第一法则

    David Maister 是哈佛商学院的前教授，他为服务法则制定了一个公式。该公式——多年研究的结果——衡量了等待特定服务如何影响客户对所提供服务和实际产品的感知。


    Maister 的公式指出：[满意度 = 感知 - 预期。](http://faculty.haas.berkeley.edu/andy/blockhandouts/Queue%20Psychology.ppt)
    在网络性能和为访问者提供内容的范围内，这个公式提出了以下问题：


    * 实际向访问者呈现了什么，内容是否满足了用户的目标？

    * 访问者感知到了什么？

    * 访问者实际预期什么？


    #### 满意度


    '
- fmt: '

    Imagine a situation where you visit a page and a loading indicator slowly moves
    from 5% to 10%. You''ll expect it to take a while to hit 100%. If the percentage
    unexpectedly begins to rise quickly to 95% and then 100%, you''ll be satisfied
    and happy, because your perception exceeded your expectation. Conversely, if the
    loading indicator goes up slower than you expect, you''ll experience an unpleasant
    feeling.


    In a nutshell, website visitors are satisfied when their perception exceeds their
    expectation, and dissatisfied when the opposite occurs.


    ## Perception


    We need to acknowledge that the perception of website speed is a *feeling*—something
    that is very subjective.


    For example, perception refers to how fast the user *thinks* your website is,
    rather than how fast it *actually* is. Most of the time, that''s almost more important
    than the actual speed of your website.


    Generally, the [perception of something being slow](http://www.slideshare.net/stoyan/psychology-of-performance)
    carries negative associations—unpleasantness, boredom, irritation, confusion and
    so on. Speed, on the other hand, is associated with success, resulting in less
    frustration and irritation—especially where the user is kept informed of progress.


    Given that your website''s loading time can be perceived as slow, it''s important
    to ensure that content is delivered as quickly as possible—or at least that, during
    any delay, the user is kept busy and distracted, so that the experience doesn''t
    *feel* slow to them.


    There''s a great [example](http://www.nytimes.com/2012/08/19/opinion/sunday/why-waiting-in-line-is-torture.html?pagewanted=all&_r=0)
    that illustrates the problem of perception. The Houston airport received a lot
    of complaints from passengers that it took too long to get their luggage. Instead
    of making the hard working airport personnel work even faster to get the luggage
    out, the airport decided to change the way passengers perceived the waiting time
    to pick up their luggage. They extended the distance from the arrival gate to
    the baggage claim sixfold. While the airport personnel were busy moving all the
    luggage to the baggage claim, passengers were kept busy by walking. The time for
    the bags to come out hadn''t changed. However, as a result of perceived performance,
    complaints started dropping dramatically.


    ## Expectations


    In the context of performance, when servicing customers, it''s important to manage
    and care about their expectations. Disney has done a fabulous job in managing
    expectations so the customer receives a positive outcome in their amusement parks.
    They have lineups that show you the expected waiting times, with a rather pessimistic
    estimate, so that customers get to the front of the line in a much shorter time
    than predicted. As a result, the customer feels more positive.


    So, how does this translate to servicing website visitors? We should set clear
    expectations by keeping them informed about the progress of their task. Show them
    the content they want to see in the fastest possible way; and, if waiting is required,
    show progress bars or other indicators to reassure them the website is still responding,
    and that they''ll receive the content that they requested.


    ### Note: Respect


    I''d like to mention “respect”, as I believe it''s an important factor in customer
    satisfaction. Ultimately, performance is about respect. Imagine you are made to
    stand in line for 20 minutes, only to find the cashier closing just before it''s
    your turn to be served. Frustrating, right? Couldn''t they have told you earlier?
    That''s where respect comes into play: the greater the respect shown for customers,
    the more likely they are to experience satisfaction.


    ## Abandonment Rate: When Your Users Decide to Leave


    We''ve all abandoned a service before. Standing in an unmoving line will make
    us impatient, until we give up and quit. We leave the queue and don''t finish
    the task we actually wanted to accomplish. We experience frustration and disappointment.
    The same can happen with websites. If users consider your website helpful and
    fast, they''ll stay and finish their task. Otherwise, they''ll leave your site
    without completing their task. Therefore, the `abandonment rate` is probably the
    safest and most honest judgement you can get from your users on how satisfied
    they are with your service.


    There are many statistics and case studies demonstrating that abandonment behavior
    of users is due to poor performance. Ecommerce websites are hit the hardest. Stiff
    competition forces site owners to pay close attention to speed and execution.
    If your shopping cart doesn''t load fast enough, your users might just move to
    a competitor''s site.


    Here are some [real-world statistics and numbers](http://www.webperformancetoday.com/2010/06/15/everything-you-wanted-to-know-about-web-performance/)
    that prove how important speed is in a world of invaluable instantness:


    *   Amazon calculated that a page load slowdown of just one second could cost
    them $1.6 billion in sales [each year](http://www.fastcompany.com/1825005/how-one-second-could-cost-amazon-16-billion-sales)

    *   Almost 40% of online shoppers abandon a website that takes more than 3 seconds
    to load ([Gomez](http://www.mcrinc.com/Documents/Newsletters/201110_why_web_performance_matters.pdf))

    *   79% of online shoppers will not return to a website after a disappointing
    experience due to poor performance ([KissMetrics](https://blog.kissmetrics.com/loading-time/?wide=1))

    *   A 1-second delay in page load time equals 11% fewer page views, a 16% decrease
    in customer satisfaction, and 7% loss in conversions ([Aberdeen Group](http://www.aberdeen.com/research/5136/ra-performance-web-application/content.aspx))


    ## Response Time


    Perceived web performance involves how we, as humans, experience and respond to
    the performance of a system.


    The following graph shows how different response times of systems effect our brain,
    and how our brain deals with them, resulting in different emotions:


    ![Perceived performance in milliseconds, and how our brain reacts Source: Web
    Performance Today and High Performance Browser Networking](OEBPS/figures/1-perceived-web-performance.png)


    Figure 1.1. Perceived performance in milliseconds, and how our brain reacts[^([1])](#ch01.html_ftn.d5e249)


    *   We feel `instant perception` around a `100ms` delay

    *   A `slight perceptible delay` occurs between `100ms` and `300ms`

    *   We definitely feel a `perceptible delay` under `1000ms` (1s)

    *   After `1 second`, we feel that a `mental context switch` starts

    *   After `10 seconds` and more, the `abandon rate` goes up and the user tends
    to leave the site


    ### Note: Mental Context Switch


    A `mental context switch` happens when the user abandons the original purpose
    of coming to the site. They most likely are no longer interested in finishing
    their initial task.


    While each user will have a different tolerance for delay, we can expect a scale
    of perception for a *typical* user based on the data referenced above.


    The research really outlines the need to avoid any kind of delay as much as possible.
    Ilya Grigorik, a web performance advocate at Google, calls it the [1000ms “time
    to glass” challenge](https://www.igvita.com/slides/2013/io-pagespeed.pdf). In
    order to fully satisfy your user''s expectation, you have around 1000ms for your
    content to travel from your server to the user''s glass (screen).


    If you want to achieve a fast experience for your users, you need to understand
    what aspects could harm such a goal.


    ## Speed Matters: Everybody Cares, Even Google

