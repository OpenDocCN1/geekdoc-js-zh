    想象这样一个场景：你访问一个页面，加载指示器缓慢地从 5% 移动到 10%。你预计达到 100% 需要一段时间。如果百分比意料之外地快速飙升到 95% 然后到达
    100%，你会感到满意和快乐，因为你的感知超过了预期。相反，如果加载指示器的增长比你预想的要慢，你会产生一种不愉快的感觉。


    简而言之，当网站访问者的感知超过他们的预期时，他们是满意的；反之则会不满。


    ## 感知


    我们需要承认，对网站速度的感知是一种*感觉*——一种非常主观的东西。


    例如，感知是指用户*认为*你的网站有多快，而不是它*实际*有多快。在大多数时候，这几乎比你网站的实际速度更重要。


    通常情况下，[对某事缓慢的感知](http://www.slideshare.net/stoyan/psychology-of-performance)带有负面联想——不愉快、无聊、烦躁、困惑等等。另一方面，速度与成功相关联，能够减少挫败感和烦躁——特别是在用户能够随时获知进度的情况下。


    鉴于你网站的加载时间可能感知为缓慢，确保内容尽可能快地交付至关重要——或者至少在任何延迟期间，让用户保持忙碌并分散注意力，这样他们的体验就不会*感觉*很慢。


    有一个非常好的[示例](http://www.nytimes.com/2012/08/19/opinion/sunday/why-waiting-in-line-is-torture.html?pagewanted=all&_r=0)
    说明了感知问题。休斯顿机场收到了许多乘客的投诉，他们取行李花费太长时间。机场并没有让辛勤的机场工作人员工作得更快来运送，而是决定改变乘客对取行李等待时间的感知。他们将从到达口到行李提取处的距离延长了六倍。当机场工作人员忙于将所有行李运到行李提取处时，乘客则通过行走保持忙碌。行李出来的时间并没有改变。然而，由于感知性能的影响，投诉开始大幅下降。


    ## 预期


    在性能背景下，在服务客户时，管理并关注他们的预期至关重要。迪士尼在管理预期方面做得非常好，让客户在游乐园中获得了积极的结果。他们设置了显示预计等待时间的排队，且给出一个相当悲观的估计，这样客户排到队的时间比预测的要短得多。结果，客户感到更加积极。


    那么，这如何转化到服务网站访问者上？我们应该通过告知他们任务进度来设定明确的预期。以尽可能快的方式向他们展示想看的内容；如果需要等待，则显示进度条或其他指示器，以让他们他们网站仍在响应，并且将收到他们请求的内容。


    ### 备注：尊重


    我想提到“尊重”，因为我相信它是客户满意度的一个重要因素。归根结底，性能关乎尊重。想象你被要求排队等 20 分钟，结果在你轮到服务之前收银员就关门了。令人沮丧，对吧？他们难道不能早点吗？这就是尊重发挥作用的地方：对客户表现出的尊重越多，他们越容易获得满意。


    ## 流失率：当你的用户决定离开时


    我们都放弃过某项服务。站在一条不动的队伍中会让我们失去不耐，直到我们放弃并离开。我们离开队列，没有完成实际上想要完成的任务。我们体验到了挫败和失望。网站也会发生这种情况。如果用户认为你的网站很有用且快速，他们就会留下来完成任务。否则，他们会在未完成任务的情况下离开你的网站。因此，`放弃率`可能是你能从用户那里得到的关于他们对服务满意度的最安全、最诚实的判断。


    许多统计数据和案例表明，用户的放弃行为是因为性能糟糕。电子商务网站受到的冲击最严重。激烈的竞争迫使网站主密切关注速度和执行。如果你的购物车加载不够快，你的用户可能直接转到竞争对手的网站。


    以下是一些[真实的统计数据和数字](http://www.webperformancetoday.com/2010/06/15/everything-you-wanted-to-know-about-web-performance/)，证明了在追求瞬时价值的世界里速度有多重要：


    *   Amazon 计算出，页面加载每慢一秒，他们[每年就会损失 16 亿美元的销售额](http://www.fastcompany.com/1825005/how-one-second-could-cost-amazon-16-billion-sales)

    *   近 40% 的在线购物者会放弃加载超过 3 秒的网站（[Gomez](http://www.mcrinc.com/Documents/Newsletters/201110_why_web_performance_matters.pdf)）

    *   79% 的在线购物者在因性能差导致失望体验后不会再次访问该网站（[KissMetrics](https://blog.kissmetrics.com/loading-time/?wide=1)）

    *   页面加载时间延迟 1 秒意味着页面浏览减少 11%，客户满意度下降 16%，转化率损失 7%（[Aberdeen Group](http://www.aberdeen.com/research/5136/ra-performance-web-application/content.aspx)）


    ## 响应时间


    感知网络性能涉及我们人类如何体验和响应系统的性能。


    下面的图显示了系统的不同响应时间如何影响我们的大，以及大脑如何处理它们，从而产生不同的情绪：


    ![Perceived performance in milliseconds, and how our brain reacts Source: Web
    Performance Today and High Performance Browser Networking](img/1-perceived-web-performance.png)


    图 1.1. 以毫秒为单位的感知性能，以及我们大脑的反应[^([1])](#ch01.html_ftn.d5e249)


    *   在约 `100ms` 的延迟周围我们感到`瞬时感知`

    *   在 `100ms` 到 `300ms` 之间发生`轻微的可感知延迟`

    *   在 `1000ms` (1s) 以内我们绝对能感觉到`可感知延迟`

    *   在 `1 秒` 之后，我们感到`心理上下文切换`开始

    *   在 `10 秒`及更久，`流失率`上升，用户倾向于离开网站


    ### 备注：心理上下文切换


    当用户放弃了访问网站的原始目的时，就会发生`心理上下文切换`。他们可能不再对完成初始任务感兴趣了。


    虽然每个用户对延迟的忍受度不同，但我们可以根据上述数据预期一个*典型*用户的感知量表。


    该研究确实强调了尽可能避免任何延迟的必要性。Google 的性能倡导者 Ilya Grigorik 将其称为 [1000ms “玻璃时间”挑战](https://www.igvita.com/slides/2013/io-pagespeed.pdf)。为了完全满足你的用户的预期，你有大约
    1000ms 的时间让内容从服务器传输到用户的玻璃（屏幕）。


    如果你想为用户实现快速的体验，你需要了解哪些方面可能会损害这一目标。


