- fmt: '

    Maintaining a lean website is a bit like following a weight loss program. It''s
    all too common, after slimming down, to gain back all the weight lost in no time!
    As in dieting, so in maintaining lean websites, we need to avoid the [yo-yo effect](http://en.wikipedia.org/wiki/Yo-yo_effect).
    The monitoring tools discussed in [Chapter 4](#ch04.html "Chapter 4Performance
    Boot Camp Setup"), and the performance automation tools described in [Chapter
    8](#ch08.html "Chapter 8Automating Optimization Tasks"), help us to keep on top
    of website optimization.


    ## Monitoring Checklist


    - Measure first, then optimize.

    - Constant measuring and monitoring of your website''s performance will help you
    identify performance bottlenecks and deal with them.

    - Set up daily performance reports and warnings to keep your performance mind
    at ease.

    - Automation can be incredibly helpful in fighting the yo-yo effect by triggering
    appropriate warnings. Review Chapter 8 for tools and options for keeping on top
    of this.


    ## Cool Down


    This is our last cool down before the end of the book. I''d like to close this
    last chapter with a quote by Larry Page, the founder of Google:


    > “Browsing should be as simple and fast as turning a page in a magazine.”


    May that inspire us all to aim for leaner websites!

    '
