    为了说明缓存头（caching headers）的使用，让我们查看之前 Google 精灵图的响应头，如图 9.8 中红框所示。响应头由服务器发送，而请求头由浏览器发送到服务器：


    ![Checking out Cache-Control headers for the sprite image](img/9-cache-header-google.png)


    图 9.8 检查精灵图的 Cache-Control 头


    让我们来看一下 `Cache-Control` 头部。它的设置被称为`缓存响应指令`（cache response directives）。第一个指令可以是
    `public`、`private`、`max-age` 或 `no-cache`。


    *   `public`：公共（或“共享”）缓存被多个客户端利用。正因如此，它提供了极佳的性能提升，因为用户可以从他人那里获取缓存副本，而无需从源服务器获取原始副本。公共缓存的资源可以是
    Logo、导航项、JavaScript 和 CSS 文件等——即大多数或每个网站访问者都频繁请求的任何资源。

    *   `private`：私有缓存仅供单个客户端使用且不共享。它允许在浏览器中缓存特定于某个用户的资源。任何代理服务器都不会缓存该响应。这主要用于访问需要授权且通过
    HTTPS 服务的资源时。上面的 Google 图片示例使用了 `private` 指令，因此该资源无法被中间缓存^([5])](#ch09.html_ftn.d5e3781)
    或 CDN 捕获供其他用户提取。

    *   `max-age=[seconds]`：指定资源被认为“新鲜”（fresh）的最大时间（以秒为单位）。该指令相对于请求时间。在 Google 图片示例中，`max-age`
    被设置为 31536000 秒，即 365 天。这些 `Cache-Control` 指令会让资源在浏览器缓存中保留 365 天，在此之后再检查是否有新版本可供获取。

    *   `no-cache`：每次请求该资源时，缓存都需要向源服务器提交请求进行确认，然后才释放缓存副本。


    关于不同指令的更多信息，可以在 [W3C 头部字段定义文档](http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.9)
    中找到。


    ### 条件请求


    除了 `Cache-Control` 头部中设置的缓存指令外，你还可以使用额外的头部来检查资源的特定条件；这些条件可以用来判断是否应该获取更新后的资源副本。这些条件请求可以是基于内容的（`ETag`）或基于时间的（`If-modified-since`）状态，也可以是在从服务器获取资源更新版本时提高性能的状态（`stale-while-revalidate`、`stale-if-error`）。


    #### 基于内容


    你会发现某些资源在响应头中也包含一个 `ETag`。当浏览器根据 `Cache-Control` 设置被要求刷新资源时，如果资源并没有发生变化，`ETag`
    就派上用场了。`ETag` 由服务器生成，是一个任意标记（例如 MD5 哈希值），作为资源内容的指纹。如果哈希值与请求头中 `If-None-Match`
    的值相同，则浏览器就知道资源没有变化，从而跳过下载。关于如何从[雅虎加速网站的最佳实践](https://developer.yahoo.com/performance/rules.html#etags)中创建
    `ETags`，可以找到更多信息。


    这里是一个 `ETag` 使用示例。以下片段是一个 HTTP 请求头 `if-None-Match`，以及对应我网站上 `/css/services.css`
    样式表的带有 `ETag` 哈希的响应头。哈希值是相同的，表明样式表的内容与缓存中的版本没有变化，因此内容不需要重新下载。


    *   请求头：

    ```

    GET /css/services.css?ver=2015Febaa HTTP/1.1

    ...

    If-None-Match: "532a0d9b-bd8+gzip"

    ...

    ```


    *   响应头：

    ```

    HTTP/1.1 304 Not Modified

    ...

    Etag: "532a0d9b-bd8+gzip"

    ...

    ```


    #### 基于时间


    [条件性时间头部](https://devcenter.heroku.com/articles/increasing-application-performance-with-http-cache-headers），例如
    `If-modified-since`（在请求头中）和 `Last-modified`（在响应头中），可以被设置为：仅当资源自浏览器缓存副本以来确实已修改过时，才请求该资源的最新版本。如果缓存副本是最新的，服务器将不会提供任何新副本，并返回
    304（未修改）响应码。


    以下片段是 `if-modified-since` 的 HTTP 请求头，以及对应我网站上 `/css/services.css` 样式表的带有 `Last-modified`
    响应的响应头。

    ```

    GET /css/services.css?ver=2015Febaa HTTP/1.1

    ...

    If-Modified-Since: Wed, 19 Mar 2014 21:35:23 GMT

    ...

    ```


    *   响应头：

    ```

    HTTP/1.1 304 Not Modified

    ...

    Last-Modified: Wed, 19 Mar 2014 21:35:23 GMT

    ...

    ```


    `Last-modified` 日期并不比 `If-Modified-Since` 日期，因此不需要请求新副本。


    #### `stale-while-revalidate`


    [旧内容（Stale content）](http://tools.ietf.org/html/rfc5861) 描述了浏览器继续从缓存使用的旧版本资源。`stale-*`
    扩展允许浏览器在特定条件下继续使用旧内容，同时在后台尝试从服务器获取资源的更新新副本。


    `stale-while-revalidate` 头部允许浏览器继续使用当前的（可能是过时的）资源版本，直到达到你在头部中指定的时间为止。在此期间，资源的最新版本正在后台被重新获取。通过在后台更新资源，我们实现了缓存的最优利用：


    ```

    HTTP/1.1 200 OK

    Cache-Control: max-age=86400, stale-while-revalidate=43200

    Content-Type: text/plain

    ```


    资源将从缓存中读取 86400 秒（1 天）。在该时间段时间之后，缓存将重新获取所请求的资源。如果我们没有设置 `stale-while-revalidate`，页面的加载速度会变慢。相反，我们给了缓存长达
    43200 秒（半天）的时间在后台重新获取新版本，从而确保终端用户获得快速加载的资源。


    #### `stale-if-error`


    设置 `stale-if-error` 头部后，它允许用户从 CDN 获取资源而不会中断，即使源服务器上的资源出现问题。与其显示损坏的资源，它将提供旧内容以提高可用性：


    ```

    HTTP/1.1 200 OK

    Cache-Control: max-age=1000, stale-if-error=1200

    Content-Type: text/plain

    ```


    在上面的示例中，响应首先指示资源在 1000 秒内是新鲜。此外，资源还可以继续使用 1200 秒。如果之后发生错误，它将变为过期。


    目前许多网站还没有利用这些优化功能。根据[2015 年 1 月](http://bbinto.github.io/lean-web-code/chapter-9/cache-headers-stale-jan2015.xlsx)的数据，Alexa
    排名名前 0.2% 的网站资源使用了 `stale-while-revalidate`，只有 0.1% 使用 `stale-if-error`。


    ### 实践中的缓存


    为了从上述缓存选项中获益，需要在你的 Web 服务器配置中设置缓存头。我们通常将这种设置称为缓存*策略*（policy）。


    每位开发者的良好习惯是制定一套精心设计的 `Cache-Control` 策略，根据预期的生命周期列出网站的资源。


