    The quickest and easiest way to measure the performance of your site is to start
    with the developer tools of your preferred browser. Most browsers offer built-in
    developer tools that you can use to check your site''s code and monitor its performance.
    Hit `Ctrl + Shift + I` on Windows, and `Cmd + Opt + I` on Mac in your browser
    to bring up the developer tools.


    [Figure 3.3](#ch03.html_ch3devtools "Figure 3.3. sitepoint.com stats shown in
    Firefox developer tools") shows an example of the sitepoint.com website, opened
    in the Firefox developer tool''s Network tab.


    ![sitepoint.com stats shown in Firefox developer tools](OEBPS/figures/3-simple-metrics.png)


    Figure 3.3. sitepoint.com stats shown in Firefox developer tools


    At the bottom right of the image, we can see the following information:


    1. the browser had to send 59 HTTP requests to render the page

    2. the total page size is 1,498.83 kilobytes

    3. the page took 4.48 seconds to fully load in the browser


    Other browsers offer even more functionality. Google''s Chrome development team
    has been adding useful features to Chrome''s developer tools. One of the additions
    is the Timeline tab, providing you with the entire overview of where most time
    is spent when loading a page (see [Figure 3.4](#ch03.html_ch3-chrome-timeline
    "Figure 3.4. sitepoint.com stats viewed in Chrome''s Timeline tab")).


    ![sitepoint.com stats viewed in Chrome''s Timeline tab](OEBPS/figures/3-chrome-timeline.png)


    Figure 3.4. sitepoint.com stats viewed in Chrome''s Timeline tab


    Using this tool, you can select a range in time that you want to analyze. You
    can further drill down into each part of the rendering process. You can find out
    when most of the script execution is happening by looking at the yellow colored
    distribution.


    The Audits tab lets you analyze the page while it loads, shown in [Figure 3.5](#ch03.html_ch3-chrome-audits
    "Figure 3.5. sitepoint.com analyzed in Chrome''s Audits tab"). The tool also provides
    you with suggestions on how to improve the performance of the page.


    ![sitepoint.com analyzed in Chrome''s Audits tab](OEBPS/figures/3-chrome-audits.png)


    Figure 3.5. sitepoint.com analyzed in Chrome''s Audits tab


    ## Resource Waterfall


    Optimizing performance is about knowing how and when to load assets and avoiding
    any blocking of content: that''s where the `resource waterfall` comes in handy.


    Most of the performance tools I''ve mentioned so far include a resource waterfall
    (accessible via the Network tab in the developer tools of your browser). You got
    a glimpse of the resource waterfall when we looked at the basic information about
    sitepoint.com in Firefox''s Network tab previously. So why is this view so important?
    Each webpage consists of HTTP transactions (requests and responses). Bundled together,
    these make a website appear in your browser. They comprise the assets and resources
    of your website. The easiest way to visually represent all these HTTP requests
    is to plot them onto a so-called “waterfall”. The reason why the resources are
    aligned in a waterfall is because the browser can''t download all the resources
    at once. The browser follows rules for downloading each component, either in parallel
    or sequentially.


    The image below shows an example of a resource waterfall, taken from Chrome''s
    developer tools:


    ![sitepoint.com''s resource waterfall in Chrome''s developer tools](OEBPS/figures/3-chrome-waterfall.png)


    Figure 3.6. sitepoint.com''s resource waterfall in Chrome''s developer tools


    ## WebPagetest


    My favorite performance tool is [WebPagetest](http://www.webpagetest.org/) (WPT),
    a free, online resource created and maintained by Patrick Meenan. (WPT data forms
    the backbone of the HTTP Archive, whose monthly runs analyze and process the WPT
    results of the top Alexa websites.)


    Below is a screenshot illustrating a WPT test. Type in the URL you want to test,
    and you''re presented with a performance analysis, including a detailed waterfall:


    ![sitepoint.com stats in WPT](OEBPS/figures/3-wpt.png)


    Figure 3.7. sitepoint.com stats in WPT


    In addition to the data available in most browser developer tools (total requests,
    total page size, and page load time), WPT provides several other important metrics:


    1. **Load Time**: The `Load Time` is measured as the time from the start of the
    initial navigation until the beginning of the window load event (`onload`).

    2. **First Byte**: The `First Byte` time is measured as the time from the start
    of the initial navigation until the first byte of the base page is received by
    the browser (after following redirects).

    3. **Start Render**: The `Start Render` time is the first point in time that content
    starts to appear in the browser. This could even just the background color, or
    the logo at the top corner of the page. The Start Render time is also plotted
    in the waterfall as a green line, which ideally should appear as early as possible.

    4. **Document Complete (or Page Load Time)**: `Document Complete` (often also
    referred to as `Page Load Time`) records when the initial page loading process
    is complete. You can also capture this moment via JavaScript''s `window.onload()`
    event. For heavy websites, page load can take significant amount of time. Images
    and content not pushed via JavaScript will be fully loaded at this point in time,
    including non-visible elements. However, if JavaScript is being used to trigger
    the push of content (via Ajax calls, for example), they may not be included. To
    count these events, you should be looking at the “Fully Loaded” figures.

    5. **Fully Loaded**: `Fully Loaded` time occurs when all assets of the page have
    been loaded, including any activity that is triggered by JavaScript after the
    main content has loaded.


    We''ll look at more features of WPT later in this chapter and throughout the rest
    of the book.


    ## Dedicated Perceived Performance Metrics


    Let''s take a quick look at a few important perceived performance metrics that
    we''ll refer frequently in this book.


    ### Above Fold Time


    The `Above Fold Time` (AFT) is an important metric that can be used to quantify
    the perceived performance of a website.


    AFT is a measure of the time required to fully render just the part of the page
    users can initially see on their screen. The browser may still be loading assets
    further down the page below the fold. AFT can provide a better indication of how
    the user experiences performance than page load time (PLT). (In Chapter 4, we''ll
    look at some examples of how the PLT can misrepresent perceived performance.)


    ### Speed Index


    `Speed Index` was added to WebPagetest in 2012, and describes “[the average time
    at which visible parts of the page are displayed](https://sites.google.com/a/webpagetest.org/docs/using-webpagetest/metrics/speed-index)”.
    The results are presented in milliseconds. The smaller the number, the better
    the site''s performance.


    Speed Index data can be used for A/B testing or general competitor comparison.
    Here are some examples:


    | Website | Speed Index |

    | --- | --- |

    | facebook.com | 3524 |

    | twitter.com | 2604 |

    | sitepoint.com | 1342 |

    | time.com | 10784 |


    ## Note: A/B Testing


    `A/B testing` involves presenting different users with two different versions
    (A and B) of your site. This process lets you compare the results between the
    two versions.


    ### PageSpeed


    Google''s answer to Speed Index is the `PageSpeed` score. It goes from 0 to 100
    points, where a higher score is better. Google [considers](https://developers.google.com/speed/docs/insights/about)
    a score of 85 to be a page that is performing well. The PageSpeed score can be
    obtained by running the [PageSpeed Insights](https://developers.google.com/speed/pagespeed/insights/)
    tool on your page:


    | Website | PageSpeed |

    | --- | --- |

    | facebook.com | 99 |

    | twitter.com | 99 |

    | sitepoint.com | 95 |

    | time.com | 82 |

