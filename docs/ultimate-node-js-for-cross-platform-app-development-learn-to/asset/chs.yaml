  \ res.status(500).send({ message: exception.message });\n    });\n};\n\nexports.signin\
  \ = (req, res) => {\n  validateRequest(req);\n  User.findOne({\n    where: {\n \
  \     username: req.body.username\n    }\n  })\n```\n\n\n\n\n```javascript\n.then(user\
  \ => {\n  if (!user) {\n    return res.status(404).send({\n      message: \"User\
  \ not found\" });\n    });\n  }\n  var passwordIsValid = bcrypt.compareSync(req.body.password,\
  \ user.password);\n  if (!passwordIsValid) {\n    return res.status(401).send({\n\
  \      accessToken: null,\n      message: \"Invalid password!\"\n    });\n  }\n\
  \  // Set expired token in 10 minutes\n  var token = jwt.sign({ id: user.id }, configuration.secret,\
  \ {\n    expiresIn: 86400\n  });\n  user.then(\n    res.status(200).send({\n   \
  \   id: user.id,\n      username: user.username,\n      email: user.email,\n   \
  \   accessToken: token\n    })\n  )\n})\n.catch(err => {\n  res.status(500).send({\
  \ message: err.message });\n});\n};\n\nfunction validateRequest(req){\n  if (!req.body)\
  \ {\n    res.status(400).send({\n      message: \"Request can’t be empty!\"\n  \
  \  });\n    return;\n  }\n}\n```\n\n我们使用了一些中间件辅助函数和组件，例如 JWT 配置文件、令牌验证、用户验证等。\n\n\
  创建一个 `middlewares` 文件夹，并在 `src/middlewares` 文件夹内添加 `jwt-auth.js` 文件，然后添加以下代码：\n\n\
  ```javascript\nconst jwt = require(\"jsonwebtoken\");\nconst configuration = require(\"\
  ../config/config-jwt.js\");\nconst database = require(\"../models\");\nconst User\
  \ = database.user;\nverifyToken = (req, res, next) => {\n  const bearer = req.headers['authorization'];\n\
  \  let token = bearer.split(\" \")[1];\n  if (!token) {\n    return res.status(403).send({\n\
  \      message: \"Error when get token!\"\n    });\n  }\n  jwt.verify(token, configuration.secret,\
  \ (err, decoded) => {\n    if (err) {\n      return res.status(401).send({\n   \
  \     message: \"User unauthorized!\"\n      });\n    }\n    req.userId = decoded.id;\n\
  \    next();\n  });\n};\nconst jwtAuth = {\n  verifyToken: verifyToken\n};\nmodule.exports\
  \ = jwtAuth;\n```\n\n在 `src/middlewares` 文件夹内创建另一个名为 `verify-user.js` 的文件并添加以下代码：\n\
  \n```javascript\nconst database = require(\"../models\");\nconst User = database.user;\n\
  checkExistingUsername = (req, res, next) => {\n  User.findOne({\n    where: {\n\
  \      username: req.body.username\n    }\n  })\n  .then(user => {\n    if (user)\
  \ {\n      res.status(400).send({\n        message: \"Username already used!\"\n\
  \      });\n      return;\n    }\n    next();\n  });\n};\ncheckExistingEmail = (req,\
  \ res, next) => {\n  User.findOne({\n    where: {\n      email: req.body.email\n\
  \    }\n  }).then(user => {\n    if (user) {\n      res.status(400).send({\n   \
  \     message: \"Email already used!\"\n      });\n      return;\n    }\n    next();\n\
  \  });\n};\nconst verifyUser = {\n  checkExistingUsername: checkExistingUsername,\n\
  \  checkExistingEmail : checkExistingEmail\n};\nmodule.exports = verifyUser;\n```\n\
  \n现在，最后一步是添加数据库连接详情，我们可以用它连接到本地 MongoDB 服务器：\n\n```javascript\nlet mongoose = require('mongoose');\n\
