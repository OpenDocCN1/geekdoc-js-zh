  \ = Connection;\n```\n\n## 运行应用程序\n\n要启动应用程序，请在终端运行以下命令：\n\n```bash\nPS D:\\Demo\\\
  webApp> node server.js\n```\n\n**输出：**\n\n```text\nRunning on port 8080\nDatabase\
