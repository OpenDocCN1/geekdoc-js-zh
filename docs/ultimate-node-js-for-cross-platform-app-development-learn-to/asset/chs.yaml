  3. `d`\n4. `a`\n5. `a`\n\n# 第四章\n\n## 创建 REST API 和路由\n\n### 绪言\n\n本章将介绍 RESTful\
  \ API，并引导我们使用 Node.js 的 HTTP 模块创建后端服务器。我们将深入探讨不同的路由方法，如 `GET`、`POST`、`PUT` 和 `DELETE`。此外，我们将学习如何进行请求验证、响应转换和错误处理。本章还将阐述\
  \ CORS 请求处理，以及在使用 HTTP 构建后端服务器时我们应该遵循的一些标准。\n\n## 章节结构\n\n在本章中，将涵盖以下主题：\n\n* RESTful\
  \ 服务简介\n* 创建第一个 HTTP 服务器\n* 为 `GET`、`POST`、`PUT` 和 `DELETE` 添加路由\n* 请求验证\n* 响应转换\n\
  * 使用 Express 处理 CORS 请求\n* API 错误处理\n\n## RESTful 服务简介\n\nRESTful Web 服务被定义为一种松耦合、轻量级的\
  \ Web 服务，用于为 Web 或移动端应用程序构建 API。REST 基于无状态通信协议，通常是 HTTP 协议。\n\n表现状态转移（REST）是一种用于开发客户端服务器应用程序的知名且成熟的架构风格。REST\
  \ 主要关注通过请求和响应传输资源的表示形式。在这里，数据或操作等所有内容都被视为资源，并且通常可以使用统一资源标识符（URIs）在 Web 上进行访问。\n\n\
  以下是一些定义良好的 REST 资源示例：\n\n* 某地的当前天气状况\n* 用户的账户信息\n* 任何静态资源，如图像或 HTML 页面\n\n客户端可以执行特定的操作，包括：\n\
  \n* 使用模式搜索特定资源\n* 创建新资源\n* 通过更新信息修改现有资源\n* 完全删除资源\n\n以下原则使 RESTful 应用程序变得简单、轻量且快速：\n\
  \n* **通过 URI 识别资源**\n  RESTful Web 服务暴露一组用于与客户端交互的对象资源。资源使用 URIs 进行标识，URI 为定位资源和服务提供了全局地址空间。\n\
  \n* **统一 UI**\n  资源通过四个固定的创建、读取、更新和删除函数进行处理：`PUT`、`GET`、`POST` 和 `DELETE`。`PUT`\
  \ 创建新资源，然后可以使用 `DELETE` 命令将其删除。`GET` 获取资源在某种表示形式中的当前状态。`POST` 将新状态传输到资源。更多信息，请参阅“响应\
  \ HTTP 方法和请求”。\n\n* **自描述性消息**\n  所有 RESTful 服务在与客户端服务器的任何交互中都遵循相似的标准。每个请求都有自己的信息，例如请求负载、身份验证头和其他配置，服务器需要这些信息来识别具有适当权限的任何资源。一旦服务器接收到请求，它将在处理请求之前执行所有必要的后台检查。请求还包含\
  \ HTTP 协议特定的信息，网络层使用这些信息通过 HTTPS 协议在网络上安全地传递数据。\n\n* **可缓存资源**\n  缓存是一种存储 API 响应的机制，既可以存储在客户端浏览器中，也可以使用\
  \ Redis 或 Memcache 等技术存储在服务器本身。当客户端向服务器发送 API 请求时，将快速返回缓存数据，而不是执行数据库查询并返回实际响应。这有助于提高应用程序性能，并通过避免运行在浏览器上的客户端应用程序调用某些\
  \ API 来减少网络利用率。\n\n* **无状态**\n  REST API 是无状态的，这意味着客户端与服务器的任何交互都独立于每个请求和响应周期。每个请求都包含服务器处理给定请求并返回特定响应所需的所有信息。无状态传输通过减少为每个请求存储和检索有状态信息的额外工作，有助于减少客户端和服务器的内存占用。\n\
  \n## RESTful API 的优点\n\nRESTful API 具有以下优点：\n\n* **可扩展性**\n  使用 REST API 开发的系统由于客户端服务器交互和\
  \ HTTP 协议的状态特性，可以高效扩展。\n* **灵活性**\n  RESTful Web 服务遵循某些设计模式，有助于构建它们，并解耦了后端组件，使得不同团队可以独立工作。\n\
  * **可管理性**\n  基于 RESTful Web 服务易于维护，且在发生更改时不会影响应用程序。通常，这些 Web 服务被分为多个层，可以在不影响数据库的情况下更改。\n\
  * **技术无关**\n  REST API 取决于后台使用的技术。我们可以使用不同的编程语言编写客户端和服务器应用程序。\n\n## HTTP 方法的各种类型\n\
  \n以下是与 RESTful Web 开发相关的 HTTP 方法，通常用于构建 Web 应用：\n\n* **GET**\n  最常用的 HTTP 方法是 `GET`。`GET`\
  \ 方法的目的是从服务器检索数据。它用于请求以下资源，包括 Web 页面或 HTML 文件、图像、视频、JSON/XML 文档、CSS 和 JavaScript\
  \ 文件。`GET` 请求方法被认为是安全操作，这意味着不会更改服务器上任何资源的状态。\n\n* **PUT**\n  HTTP `PUT` 方法用于完全替换或创建由给定\
  \ URL 标识的资源。如果 `PUT` 方法指向的 URL 存在资源，则完全替换该资源的表示。如果该 URL 不存在资源，则创建一个新资源。PUT 操作是幂等的。\n\
  \n* **POST**\n  `POST` 请求方法将数据发送到服务器进行处理。发送到服务器的数据通常采用以下格式：\n  * Web 表单字段\n  * XML\n\
  \  * JSON 数据\n  `HTTP` 配置允许开发者决定 `HTTP POST` 方法发送的数据的处理类型。`POST` 方法原型包括：\n  * 在留言板发布消息\n\
  \  * 将 HTML 表单数据保存到数据库\n  * 根据提供的信息计算结果\n  `POST` 不被认为是安全操作，因为它可以更新服务器状态并对启动状态产生潜在的副作用。此外，`HTTP\
  \ POST` 方法不需要幂等，这意味着每次调用它可能会让服务器上的数据和资源处于不同的状态。\n\n* **DELETE**\n  `HTTP DELETE`\
  \ 方法的言自自懂。执行后，`DELETE` 函数指示的资源将从服务器上删除。与 PUT 操作一样，`HTTP DELETE` 方法是幂等的且不安全的。\n\n\
  * **PATCH**\n\n\n\n\n\n`PATH HTTP` 方法被独立地添加到超文本传输协议（HTTP）中，允许部分更新现有资源。例如，向服务器发送一个较小的部分负载（payload）比发送完整的资源表示要高效得多。\n\
  \n### **HEAD**\n`HTTP HEAD` 方法用于简单地返回服务器上资源的元数据。此 HTTP 请求方法会返回与给定 URL 资源相关的所有头部信息（headers），但不会实际返回资源本身。\n\
  \n### **OPTIONS**\n服务器不需要对其管理的每个资源支持所有的 `HTTP` 方法。某些资源支持 `PUT` 和 `POST` 操作，而其他资源仅支持\
  \ `GET` 操作。\n\n`HTTP OPTIONS` 方法返回一个支持且已启用的 `HTTP` 方法列表。\n\n### **TRACE**\n`TRACE\
  \ HTTP` 方法用于诊断、调试和故障排除。它只是简单地返回一个记录请求-响应循环信息的诊断追踪（trace）。\n\n追踪的内容通常只是从客户端发送到服务器的各种请求头部的回显（echo）。\n\
  \n### **CONNECT**\nconnect 函数用于连接到服务器端资源。`CONNECT HTTP` 方法最常见的目标是代理服务器，客户端必须通过该代理来从本地网络建立隧道连接。\n\
  \n## 不同 HTTP 动词的等幂性\n\n等幂性（Idempotency）是某些函数或 API 请求的属性，确保多次执行同一操作产生的结果与执行一次的结果相同。\n\
  \n等幂性对于 API 至关重要，因为它确保了即使由于网络中断或重复请求导致资源被多次调用，结果也能保持一致。非等幂操作可能会导致意外的副作用，例如创建额外的资源或意外的变化，这在数据准确性至关重要的情况下会带来重大风险。\n\
  \nHTTP 动词等幂性简化了使用 API 时的错误处理、并发控制、调试和操作监控。这在分布式应用面临网络故障和请求重试时，通过保持一致性和可预测性提升了用户体验。\n\
  \n`GET`、`HEAD`、`PUT`、`DELETE`、`OPTIONS` 和 `TRACE` 方法被认为是等等的。它们可以重试或多次执行而不会引起意外的副作用。\n\
  \n`POST` 本身不是等等的，这意味着多次发送相同的 `POST` 请求可能会产生不同的结果，或在后端服务器上创建多个数据条目。\n\n## RESTful\
  \ API 如何工作\n\n以下是客户端与服务器之间发生任何 REST API 的通用步骤：\n\n1. 客户端或浏览器配置带有负载（payload）和头部（Header）的\
  \ API 请求\n2. 客户端发起 AJAX 请求\n3. 服务器接收请求\n4. 在服务器上进行请求处理\n5. 将响应返回给客户端\n6. 客户端处理响应并向用户展示\n\
  \n![](img/4.1.jpg)\n\n**图 4.1：** RESTful API 工作模型\n\n## 创建第一个 HTTP 服务器\n\n使用以下步骤通过\
  \ HTTP 模块创建我们的后端服务器：\n\n### 1. 导入 HTTP 模块\n这是第一步，我们将使用 `require` 关键字将所需的 HTTP 模块导入到后端应用程序中。\n\
  \n在 `chap_04` 目录内创建一个 `http_basic.js` 文件并添加以下代码：\n\n```javascript\nvar http = require('http');\n\
  ```\n\n### 2. 创建配置\n现在添加一些用于设置服务器配置的变量，如主机（host）、端口（port）等：\n\n```javascript\nconst\
  \ host = 'localhost';\nconst port = 8000;\n```\n\n### 3. 创建服务器进程\n为了使用 HTTP 模块创建后端服务器，我们需要调用\
  \ HTTP 模块中定义的 `createServer()` 方法，我们可以通过上面的 `http` 变量访问它：\n\n```javascript\nconst\
  \ server = http.createServer();\n```\n\n这将创建一个服务器实例并将其存储在变量 `server` 中供后续使用。为了启动服务器进程，我们需要调用服务器实例上定义的\
  \ `.listen()` 方法：\n\n```javascript\nserver.listen(port, host, () => {\n    console.log(`Server\
  \ is running on http://${host}:${port}`);\n});\n```\n\n### 4. 请求处理器\n我们需要创建一个处理函数\
  \ `requestHandler()`，它将用于处理所有的客户端请求并处理响应：\n\n```javascript\nconst requestHandler\
  \ = function(req, res) {}\n```\n\n`requestListener` 函数期望两个参数：`req` 和 `res`。对于 `req`，我们可以访问客户端发送的请求对象；对于\
  \ `res`，我们可以访问将返回给客户端的相应响应对象。\n\n### 5. 请求处理\n在 `requestHandler()` 方法中，我们使用 `req`\
  \ 参数检查请求体参数，并使用 `res` 参数向客户端发送响应：\n\n```javascript\nconst requestHandler = function(req,\
  \ res) {\n    if(req.body){\n        console.log(`Request body`, req.body);\n  \
  \  }\n    res.send(\"Hello World from Node.js HTTP Server\");\n}\n```\n\n### 6.\
  \ 运行服务器\n我们将运行服务器：\n\n```bash\nHello World from Node.js HTTP Server\n```\n\n## 添加路由\n\
  \n### **GET**\n`GET` 方法用于访问资源。客户端使用 `GET` 请求来过滤数据：\n\n```javascript\n// 返回学生列表\n\
  app.get('/students', function (req, res) {\n    res.json(students);\n});\n```\n\n\
  ### **POST**\n请求用于将数据发送到服务器，例如向数据库添加行。在 REST CRUD 语义中，它执行的是创建（create）操作：\n\n```javascript\n\
  // 添加学生\nlet students = [];\napp.post('/students', function (req, res) {\n    student\
  \ = req.body;\n    students.push(student);\n    res.json({ message: \"Record Added\"\
  \ });\n});\n```\n\n### **PUT**\n`PUT` 方法主要用于更新已创建的数据。在 `PUT` 方法中，首先通过 URL 识别资源，如果它存在则进行更新；否则创建一个新资源。简单来说，我们可以说如果资源存在则更新它，否则创建新资源。\n\
  \n客户端使用 `PUT` 更新服务器上的现有资源：\n\n```javascript\n// 根据 id 更新学生\napp.put('/students/:id',\
  \ function (req, res) {\n    var id = req.params.id;\n    var student = req.body;\n\
  \    for (var i = 0; i < students.length; i++) {\n        if (students[i].id ==\
  \ id) {\n            students[i] = student;\n            break;\n        }\n   \
  \ }\n    res.json({ message: \"Record Updated\" });\n});\n```\n\n### **PATCH**\n\
  与 `PUT` 方法类似，`PATCH` 用于发送数据以更新“现有资源”。然而，PUT 和 PATCH 之间存在一个重要的区别：PATCH 只对记录进行部分更改，而不是覆盖整个记录（后者发生在\
  \ `PUT` 的情况下）。\n\n以下代码展示了在 JavaScript 中实现 `PATCH` 方法：\n\n```javascript\n// patch\
  \ 资源\napp.patch('/students/:id', function (req, res) {\n    var id = req.params.id;\n\
  \    var student = req.body;\n    for (var i = 0; i < students.length; i++) {\n\
  \        if (students[i].id == id) {\n            // 替换特定的属性\n            for (var\
  \ key in student) {\n                students[i][key] = student[key];\n        \
  \    }\n            break;\n        }\n    }\n});\n```\n\n\n\n\n\n```javascript\n\
  res.json({ message: “Record Updated using patch” });\n```\n\n```javascript\n});\n\
  ```\n\n## DELETE\n\nDELETE 请求用于从数据库中删除资源，例如文件、图像或数据。DELETE 请求旨在在删除某些资源后更改服务器状态。如果用户没有适当的身份验证，请求将失败，用户可能会获得未经授权的错误：\n\
  \n```javascript\n// deleting resource\n```\n\n```javascript\napp.delete(\"/students/:id”,\
  \ function (req, res) {\n  var id = req.params.id;\n  for (var i = 0; i < students.length;\
  \ i++) {\n    if (students[i].id == id) {\n      students.splice(i, 1);\n      break;\n\
  \    }\n  }\n  res.json({ message: “Record Deleted” });\n});\n```\n\n## 在 Node.js\
  \ 中使用 Swagger\n\nSwagger 是一套工具，可以非常方便地构建后端 API。它主要用于生成遵循 OpenAPI 规范的 API 文档，Swagger\
  \ 提供了帮助 API 开发各个阶段的工具，包括设计、开发、文档化和测试。\n\nOpenAPI 规范是一种用于创建接口以描述、生成、消费和渲染 RESTful\
  \ API 的规范，有时也称为 swagger 规范。\n\n以下是一个关于博客文章 Web 应用定义一组 API 的 Swagger 文档示例：\n\n![](img/4.2_rest_methods.jpg)\n\
  \n**图 4.2：** 使用 Swagger 文档的 RESTful API 方法示例\n\n# 在 Node.js 中设置 Swagger\n\n在 Node.js\
  \ 和 Express 服务器中使用 Swagger Docs 的简单方法是使用 NPM 中的 `swagger-ui-express` 包。该包允许我们根据开发者提供的\
  \ JSON/YAML 文件传输文档。\n\n首先，我们需要创建一个示例项目，然后通过 NPM 安装 `swagger-ui-express`。\n\n让我们在\
  \ `app.js` 中添加以下代码：\n\n```javascript\nvar express = require(‘express’);\nvar app\
