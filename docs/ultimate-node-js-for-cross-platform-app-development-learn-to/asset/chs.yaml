  \ 5.18:** 下载 Mongo shell\n\n# 运行 Mongo Shell 应用\n\n导航到以下路径并双击 `mongosh.exe` 以启动\
  \ Mongo shell 应用：\n\n`D:\\Software\\mongosh-1.8.2-win32-x64\\mongosh-1.8.2-win32-x64\\\
  bin`\n\n![](img/5.19.jpg)\n\n**图 5.19:** 运行并连接到 Mongo Shell\n\n现在，你已经进入了 Mongo shell\
  \ 环境。\n\n# Mongo Shell 基础命令\n\n现在是时候使用 Mongo shell 了。首先，我们将学习一些基础命令，这将帮助你开始使用 MongoDB。\n\
  \n运行 `db` 命令查看你当前正在工作的数据库：\n\n```\n> db\n```\n\n![](img/5.20.jpg)\n\n**图 5.20:**\
  \ db 查询的输出\n\n运行 `use` 命令切换到不同的数据库。如果你还没有数据库，请学习如何创建一个新数据库：\n\n```\n> use employee\n\
  ```\n\n![](img/5.21.jpg)\n\n**图 5.21:** use employee 命令的输出\n\n你可以使用以下命令创建集合并插入数据：\n\
  \n```\ndb.employee.insertOne( { name: “John” } );\n```\n\n其中\n\n*   `db` 指向当前使用的数据库。\n\
  *   `employee` 是集合名称。\n*   `insertOne` 是向集合中插入文档的方法。\n\n![](img/5.22_mongo_shell_insert.jpg)\n\
  \n**图 5.22:** use employee insertOne 命令的输出\n\n使用 `find` 方法从集合中获取数据：\n\n```\ndb.employee.find({})\n\
  ```\n\n![](img/5.23.jpg)\n\n**图 5.23:** use employee find 命令的输出\n\n使用 `show dbs`\
  \ 命令显示所有数据库：\n\n![](img/5.24.jpg)\n\n**图 5.24:** use show dbs 命令的输出\n\n一个可以帮助你轻松使用\
  \ Mongo shell 的重要命令是 `help`。运行帮助命令可以获取 Mongo shell 中可用的帮助选项列表。\n\n# MongoDB Compass\
  \ 简介\n\nMongoDB Compass 是一个强大的 MongoDB GUI 工具，允许用户在无需预先了解 MongoDB 查询语法的情况下分析存储数据的内容。在可视化环境中探索数据时，你可以使用\
  \ MongoDB Compass GUI 来优化操作、管理索引并实现文本验证。\n\n![](img/5.25.jpg)\n\n**图 5.25:** MongoDB\
  \ Compass\n\n# 在 Windows 上安装 Compass\n\n以下步骤将帮助在 Windows 上安装 MongoDB Compass：\n\n\
