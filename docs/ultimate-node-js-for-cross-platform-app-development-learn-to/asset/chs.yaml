  \n# 第 11 章：错误处理与日志记录\n\n## 引言\n\n在本章中，我们将学习 JavaScript 中错误的一些核心概念以及如何优雅地处理它们。我们还将解释\
  \ Node.js 应用中不同类型的错误以及导致它们发生的原因。本章将重点关注如何使用框架内部提供的各种技术处理 Node.js 内部的错误。在本章结束时，我们将介绍如何使用最流行的\
  \ Winston 包之一在 Node.js 应用中记录错误。\n\n## 结构\n\n本章将涵盖与 Node.JS 错误处理和日志记录相关的以下主题：\n\n\
  *   在 JavaScript 中定义错误\n*   错误类型\n*   在 JavaScript 中定义错误处理\n*   深入理解错误处理\n*   使用中间件函数处理错误\n\
  *   自定义错误处理\n*   使用错误处理构建 Express 应用\n*   在 Node.js 应用中记录错误\n*   使用 Winston 记录错误\n\
  \n## 在 JavaScript 中定义错误\n\n错误是可以阻止程序正常运行的语句。可能发生的错误主要有两种类型：`syntax`（语法错误）和 `runtime`（运行时）。\n\
  \n## 错误类型\n\n让我们尝试详细理解每一种。\n\n### 编译时错误\n\n当用户犯错时，会出现语法错误。在 NodeJS 中，解释器可以发现这些语法错误。最重要的是，这些错误在代码启动之前就会阻止程序运行。如图\
  \ 11.1 所示：\n\n```javascript\nconst express = require('express')\nconst app = express()\n\
  const port = 3000\n\napp.listen(port, () => {\n  console.log(`Example app listening\
  \ at http://localhost:${port}`)\n})\n```\n\n![](img/11.1.jpg)\n\n**图 11.1:** JavaScript\
  \ 中的语法错误\n\n### 运行时错误\n\n运行时错误发生在程序执行期间，只有当程序启动时才会被检测到。有时它们也被称为运行时错误，这些错误可能会导致程序崩溃或在执行过程中终止应用程序。一个示例是在访问数组的第\
  \ 5 个元素（该元素在数组中定义）时获取 `RangeError`。\n\n在这种情况下，我们使用异常处理，允许我们在不发生任何故障的情况下保持程序的正常流。以下是此类错误可能发生的一些场景：\n\
  \n*   发生除以零和整数溢出时。\n*   段错误（例如访问数组之外的内容）也会导致运行时错误。\n\n在下面的示例中，我们尝试访问数组的 `length`\
  \ 属性；它抛出了错误，因为 `tempArr` 初始化为 `null` 值：\n\n```javascript\nconst tempArr = null;\n\
  if(tempArr.length > 0){\n  console.log(`Length of array - ${tempArr.length}`);\n\
  }\n```\n\n![](img/11.2_error_runtime.jpg)\n\n**图 11.2:** JavaScript 中的运行时错误\n\n\
  ## 在 JavaScript 中定义错误处理\n\nJavaScript 异常处理是最强大的功能之一，有助于防止我们的程序和应用程序发生意外崩溃。此外，它还帮助开发者编写和维护程序的正常流程。\n\
  \n`Exception`（异常）是指在程序执行期间发生的意外或异常情况。`handling`（处理）一词指的是我们如何应对这些异常情况。\n\n\n\nJavaScript\
  \ 异常处理是处理程序执行过程中发生的异常语句的过程。这些异常技术还提供了适当错误跟踪机制，这意味着异常会详细解释错误发生的所有细节，以及其在代码中的位置。\n\
  \n我们使用 `try-catch` 块，这是 JavaScript 语言的默认功能，被广泛用于处理应用程序中的错误和异常：\n\n```javascript\n\
  try {\n  console.log(\"Code executed after timeout\")\n  throw new Error(\"throw\
  \ Error!\")\n} catch (error) {\n  next(error) // 调用中间件处理器以传递错误\n}\n```\n\n我们将尝试理解如何使用\
  \ `try-catch` 块来处理错误，并向终端用户抛出有意义的消息。在这个示例中，我们创建了一个 `sum()` 函数，它将两个数字相加并向用户弹出结果：\n\
  \n```javascript\nfunction sumNbr(a, b) {\n  try {\n    console.log(`Value of variable\
  \ a & b is : ${a}, ${b}`);\n    alertdd(`Sum - ${a+b}`)\n  } catch (e) {\n    console.log(\"\
  Error: \" + e.description);\n    throw new Error(e);\n  }\n}\nsumNbr(5, 5);\n```\n\
  \n当我们执行上述代码时，将得到一个异常，因为我们错误地将 `alert` 写成了 `alertdd`。\n\n![](img/11.3.jpg)\n\n**图\
  \ 11.3:** JavaScript 中的错误处理\n\n#导致 Node.js 错误的因素\n\n系统错误或应用程序异常可以通过许多不同的方式发生。其中一个示例包括引用未定义的变量或传递类型错误的参数。\n\
  \n一些常见的 Node.js 错误包括：\n\n* `EvalError`：这些错误在执行全局函数 `eval()` 时发生：\n\n```javascript\n\
  try {\n  throw new EvalError(\"Hello\", \"exampleFile.js\", 10);\n} catch (e) {\n\
  \  console.log(e instanceof EvalError); // true\n  console.log(e.message); // \"\
  Hello\"\n  console.log(e.name); // \"EvalError\"\n  console.log(e.fileName); //\
  \ \"exampleFile.js\"\n  console.log(e.lineNumber); // 10\n  console.log(e.columnNumber);\
  \ // 0\n}\n```\n\n* `RangeError`：这些错误在你尝试访问范围之外的变量时发生，例如尝试获取只包含三个元素的数组的第四个元素：\n\n\
  ```javascript\nvar verifyNumber = function (num) {\n  if (num < MIN || num > MAX)\
  \ {\n    throw new RangeError('Parameter range must be between ' + MIN + ' and '\
  \ + MAX);\n  }\n};\ntry {\n  verifyNumber(50);\n} catch (e) {\n  if (e instanceof\
  \ RangeError) {\n    // 处理范围错误\n  }\n}\n```\n\n* `ReferenceError`：这些错误在你尝试访问 JavaScript\
  \ 作用域内不存在的变量时发生：\n\n```javascript\nfunction sumOfNumbers() {\n  let val1 = 2;\n\
  \  let val2 = 3;\n  return val1 + val2;\n}\nsumOfNumbers();\nconsole.log(val1);\n\
  ```\n\n* `SyntaxError`：这些错误在开发者编写错误代码时发生，例如使用字符串代替整数值：\n\n```javascript\nfunction\
  \ check(x, y){\n  if((x === 10) && (y ===5){ // 缺少右括号；返回 true\n  } else {\n    return\
  \ false\n  }\n}\n```\n\n* `TypeError`：这些错误在你尝试访问不是有效类型的变量时发生：\n\n```javascript\n\
  let a = 1\nconsole.log(a())\n//output\nUncaught TypeError: a is not a function\n\
  ```\n\n* `URIError`：每当向 `encodeURI` 或 `decodeURI` 参数传递无效参数时发生这些错误：\n\n```javascript\n\
  // 此处报错\ndecodeURIComponent('%E0%B4%A');\n```\n\n## Node.js 中的错误类型\n\n在运行 Node.js\
  \ 后端服务器应用程序时，可能会发生各种类型的错误。这些错误通过不同的方式定义，如下：\n\n## 功能性错误\n\n这些错误在 Node.js 程序执行期间通常是预期的，应该被妥善处理。这类错误并不意味着程序本身存在\
  \ bug，因此我们需要适当的方法来处理这些错误。以下是导致功能性错误的常见原因：\n\n* 如果无法建立服务器连接，可能会导致这些错误。\n* 如果找不到服务器详细信息，可能会导致这些错误。\n\
  * 由于无效的用户输入，可能会发生这些错误。\n* 当服务器返回某些无效响应（如 400 或 500 响应）时，可能会发生这些错误。\n* 有时当系统本身内存耗尽时，应用程序会抛出错误。\n\
  \n## 编程错误\n\n这些错误因为代码中的某些问题被称为 bug。例如，这些是错误的常见用法：\n\n* 在没有回调函数的情况下调用了异步函数。\n* 有时程序员忘记在结束时解析\
  \ promise（resolve）。\n* 在大多数情况下，我们将不兼容的变量作为函数传递，例如在期望对象时传递了字符串。\n\n\n\n\n*   中间件在请求到达路由时运行，并在响应返回给客户端时完成。\n\
  *   有多个公开可用的原生和第三方中间件，例如会话管理、身份验证、登录、重定向等。\n\n## Express.js 默认错误处理\n\nExpress 提供了默认错误检测机制，以防止应用程序在处理错误时崩溃。无论我们编写的是同步还是异步代码，都需要确保妥当的错误处理，这可以使应用程序更加健壮。\n\
  \n让我们尝试理解如何在 Express 应用程序中使用错误处理，特别是在同步和异步代码的执行中。\n\n### 同步代码\n\n当 JavaScript 代码按顺序逐个执行时，我们称该代码是同步运行的。Express\
  \ 会自动捕捉同步代码中发生的错误。\n\n我们可以通过抛出错误来演示这种情况：\n\n```javascript\napp.get('/', (req, res)\
  \ => {\n  throw new Error(\"Hello Error!”)\n})\n```\n\n当我们运行上述代码时，Express 会检测到此错误并提供相应的详细信息，包括错误状态码、消息，在某些情况下甚至包括堆栈跟踪。这些错误由\
  \ Express 默认的错误处理器中间件函数处理，这可以帮助你避免编写大量的 `try-catch` 块，如下代码所示：\n\n```javascript\n\
  app.get('/', (req, res, next) => {\n  try {\n    throw new Error(\"Error!”)\n  }\
  \ catch (error) {\n    next(error)\n  }\n})\n```\n\n## 异步代码\n\n在开发后端应用程序时，我们大部分使用异步\
  \ JavaScript 逻辑来处理所有请求，这些逻辑用于读写文件、查询数据库以及发送外部 HTTP API 请求。正如我们看到的，Express 在执行同步代码时使用内置的错误处理器检测所有错误。但在异步代码的情况下，我们的服务器应用程序会因为错误而终止。\n\
  \n```javascript\napp.get('/', (req, res) => {\n  setTimeout(() => {\n    console.log(\"\
  Code executed after timeout\")\n    throw new Error(\"Error thrown!”)\n  }, 1000)\n\
  })\n```\n\n让我们尝试在执行异步代码时处理此错误：\n\n```javascript\nconst express = require('express')\n\
  const app = express()\napp.get('/', (req, res) => {\n  setTimeout(() => {\n    try\
  \ {\n      console.log(\"Code executed after timeout\")\n      throw new Error(\"\
  throw Error!”)\n    } catch (error) {\n      next(error) // 将错误传递给下一个中间件处理器\n  \
  \  }\n  }, 1000)\n})\napp.listen(3000, () => {\n  console.log(`Server listening\
  \ at http://localhost:3000`);\n})\n```\n\n上述代码成功执行，没有出现任何导致服务器崩溃的错误或异常。\n\n[图 11.4]\
  \ 显示了执行异步代码后发生的错误：\n\n![](img/11.4.jpg)\n\n**图 11.4：** 异步代码执行后发生的错误\n\n[图 11.5]\
  \ 显示了异步代码执行后显示的浏览器错误：\n\n![](img/11.5.jpg)\n\n**图 11.5：** 异步代码执行后显示的浏览器错误\n\n##\
  \ 自定义错误处理\n\nExpress 的默认错误处理中间件在大多数场景下处理意外、未处理的错误非常有用。然而，这种默认错误处理不足以满足使用 Node.js\
  \ 构建健壮服务器应用程序的所有需求。大多数应用程序开发者更倾向于按照自己的方式处理错误。\n\n例如，错误可以记录到数据库、文件等，以便进行进一步的分析、调试和报告。\n\
  \n在接下来的示例中，我们将尝试在路由本身中处理错误。根据操作的成功或否，我们将返回错误或将用户重定向到某些自定义错误页面：\n\n```javascript\n\
  const express = require('express')\nconst app = express()\napp.get('/page1', (req,\
  \ res) => {\n  try {\n    // 执行某些操作，如读取文件或调用数据库\n    return res.send(\"Page one\
  \ returned\")\n  } catch (error) {\n    console.error(err)\n    res.status('500').send(err)\
  \ // 将错误返回给用户\n  }\n})\napp.get('/page2', (req, res) => {\n  try {\n    // 执行某些操作，如读取文件或调用\
  \ API\n    return res.send(\"Page two data\")\n  } catch (error) {\n    console.error(err)\n\
  \    res.redirect('/error') // 重定向到错误页面\n  }\n})\napp.get('/error', (req, res) =>\
  \ {\n  res.send(\"Error page.\")\n})\napp.listen(3000, () => {\n  console.log(`Server\
  \ listening at http://localhost:3000`);\n})\n```\n\n我们定义了两个独立的路由，可以执行不同的操作，如读取文件或连接数据库。这种方法在只有几个路由的小型应用程序中有效，但一旦我们不断添加更多路由，错误处理逻辑就会重复，维护起来将变成一场噩梦。\n\
  \n运行应用程序后，将观察到以下输出：\n\n1. `http://localhost:3000/`\n![](img/11.6.jpg)\n**图 11.6：**\
  \ 导航到首页时抛出错误\n\n2. `http://localhost:3000/page1`\n![](img/11.7.jpg)\n**图 11.7：**\
  \ 导航到 page1 时发生错误\n\n3. `http://localhost:3000/page2`\n![](img/11.8.jpg)\n**图 11.8：**\
  \ 导航到 page2 时发生错误\n\n## 使用中间件函数处理错误\n\n如上一个示例所示，我们可以借助路由内部的 `try-catch` 块来处理错误。然而，这种方法的主要缺点是，如果我们有\
  \ 100 个路由，那么为每个路由定义通用逻辑将变得困难。\n\n使用中间件函数是 Node.js 中实现错误处理的更好解决方案。中间件函数更容易使用，因为它们可以访问错误、请求和响应对象，并且按照特定的顺序被调用。\n\
  \n注意：最重要的是定义中间件函数的顺序。错误处理器必须在路由处理器之后定义中间件，这样后续的（错误）调用才能引导到它们。\n\n```javascript\n\
  const express = require('express')\nconst promises = require('fs').promises\nconst\
  \ app = express()\n\napp.get('/page1', (req, res, next) => {\n  promises.readFile('./page1.txt')\n\
  \    .then(data => res.send(data))\n    .catch(err => next(err));\n})\n\napp.get('/page2',\
  \ (req, res, next) => {\n  promises.readFile('./page2.txt')\n    .then(data => res.send(data))\n\
  \    .catch(err => {\n      err.type = 'redirect';\n      next(err);\n    });\n\
  })\n\napp.get('/error', (req, res) => {\n  res.send(\"Custom error landing page.\"\
  )\n})\n\napp.use((error, req, res, next) => {\n  console.log(\"Error Handling Middleware\
  \ called\")\n  console.log('Path: ', req.path)\n  console.error('Error: ', error)\n\
  \  if (error.type == 'redirect')\n    res.redirect('/error')\n  else\n    res.status(500).send(error)\n\
  })\n\napp.listen(5000, () => {\n  console.log(`Example app listening at http://localhost:${5000}`)\n\
  })\n```\n\n在这里，我们将所有的错误处理逻辑都放在中间件函数中，这样就可以根据应用程序中发生的错误类型编写自定义的错误处理逻辑。\n\n\n\n\n\n\
  这种方法允许代码重用，并且变得更加高效。一旦发生错误，`Express` 将使用中间件函数收集所有错误，并向客户端发送自定义的响应。\n\n当我们运行上述代码时，在浏览\
  \ `localhost:3000/page1` 后，我们将得到以下输出：\n\n![](img/11.9_output_page1_Error.jpg)\n\n\
  **图 11.9：** `Express` 中的错误中间件函数\n\n如果在浏览 `localhost:3000/page2` 时发生任何此类未被妥善处理的错误，我们将获得自定义的错误页面：\n\
  \n![](img/11.10_custom_error.jpg)\n\n**图 11.10：** 使用 `Express` 中间件函数的自定义错误页面\n\n\
  ## 添加多个中间件处理器\n\n到为止，我们只看到了一个处理所有错误的中间件。然而，在实际的应用程序中，通常可以使用一个或多个中间件函数来处理不同的错误并返回转换后的响应。例如，一个中间件可以用于错误日志，而另一个用于转换客户端响应。因此，我们可以根据需要添加任意数量的不同中间件函数，以实现模块化应用。\n\
  \n以下代码用于实现多个中间件函数：\n\n```javascript\nconst express = require('express')\nconst promises\
  \ = require('fs').promises\nconst app = express()\napp.get('/page1', (req, res,\
  \ next) => {\n  promises.readFile('./page1.txt')\n    .then(data => res.send(data))\n\
  \    .catch(err => next(err))\n})\napp.get('/page1', (req, res, next) => {\n  promises.readFile('./page1.txt')\n\
  \    .then(data => res.send(data))\n    .catch(err => {\n      err.type = 'redirect'\n\
  \      next(err)\n    })\n})\napp.get('/error', (req, res) => {\n  res.send(\"Custom\
  \ error landing page.\")\n})\nfunction errorLogHandler(error, req, res, next) {\n\
  \  console.error(error)\n  next(error)\n}\nfunction errorHandler(error, req, res,\
  \ next) {\n  if (error.type == 'redirect') {\n    res.redirect('/error')\n  } else\
  \ {\n    next(error)\n  }\n}\napp.use(errorLogHandler)\napp.use(errorHandler)\n\
  app.listen(3000, () => {\n  console.log(`Server listening at http://localhost:${3000}`)\n\
  })\n```\n\n在这里，我们实现了相同的代码，但使用了更加模块化的方式，随着应用程序中添加更多路由，它可以为了更好的扩展，允许我们定义许多不同的错误处理情况。\n\
  \n**重要提示：** 我们只需要确保所有的中间件函数都按照正确的顺序定义，以便它们要么返回响应，要么调用下一组中间件函数。如果我们不遵循这一点，请求可能会一直等待，而不向客户端返回任何响应或错误。\n\
  \n## 构建带有错误处理的 Express 应用\n\n我们将创建一个示例应用程序，以了解如何在基于 `Express` 的 Node.js 应用中实现某些不同的错误处理技术。\n\
