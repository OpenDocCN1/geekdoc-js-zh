  4. a\n5. c\n6. c\n7. c\n8. a\n9. b\n10. d\n\n# [第 2 章]\n\n## [深度解析 Node.js]\n\n\
  ### [引言]\n\n本章将重点学习 Node.js 的一些核心概念，这些概念将很大程度上用于构建任何实时 Web 应用。我们将涵盖不同的编程方式，包括同步与异步。在本章中，我们将学习\
  \ Node.js 框架的不同模块，例如 `http`、`fs` 和缓冲区（buffers），并进行一些创建简单程序的实践工作。\n\n### [结构]\n\n\
  在本章中将涵盖以下主题：\n* 传统的 Web 应用程序架构\n* Node.js 架构\n* 事件循环\n* 非阻塞或异步 I/O\n* 核心模块\n\n###\
  \ [传统的应用程序架构]\n\n在 NodeJS 出现之前，Web 应用程序通常遵循多线程请求-响应模型。在这种模型中，服务器处理所有客户端请求，并在处理后向客户端返回响应。大多数请求/响应是基于\
  \ HTTP 协议的。这种应用程序也称为三层架构：\n* 表示层/客户端层\n* 应用层/业务层\n* 数据层\n\n**图 2.1：** 传统架构\n\n以下是请求/响应模型的处理步骤：\n\
  * Web 服务器接收来自客户端的请求。\n* 服务器内部可用线程池来提供服务。\n* 当 Web 服务器接收到任何客户端请求时：\n    * 从线程池中分配一个线程来处理请求。\n\
  \    * 该线程执行以下操作：\n        * 读取客户端请求\n        * 处理客户端数据\n        * 执行任何 IO 操作（如有必要）\n\
  \        * 准备最终响应\n    * Web 服务器将线程的响应返回给特定的客户端。\n\n**图 2.2：** 传统服务器架构\n\n在这里，\n\
  `n`: 客户数量\n`m`: 线程池数量\n\n假设：\n* 所有客户端同时使用该系统。\n* 由于硬件限制，服务器上的线程池数量有限。\n* `Client-1`、`Client-2`……`Client-n`\
  \ 是使用此应用程序的唯一客户。\n\n以下是客户端请求的处理步骤：\n* Web 服务器处理 `Request-1`（`Client-1`）并将请求分配给线程\
  \ `T-1`：\n    * `T-1` 读取并处理 `Request-1`（`Client-1`）。\n    * `Request-2` 不需要任何 I/O\
  \ 操作。\n    * `T-1` 向服务器发送 `Response-1`。\n    * Web 服务器将 `Response-1` 返回给 `Client-1`。\n\
  * `Client-2` 发起另一个 `Request-2`，由线程 `T-2` 取：\n    * `T-2` 处理 `Request-2`。\n    *\
  \ `Request-2` 不需要任何 I/O 操作。\n    * `T-2` 向服务器发送 `Response-2`。\n    * Web 服务器交替将\
  \ `Response-2` 发给 `Client-2`。\n* 此前的过程持续直到 `Client-n` 发起请求且线程池内所有可用线程都被耗尽。这导致后续请求发生阻塞操作。\n\
  * `T-n` 需要更多时间来获取可用资源，这些资源可用于处理请求并将响应返回服务器。\n* 一旦 `T-n` 完成所有处理，`Client-n` 必须等待更才能从服务器获得响应。\n\
  * 随着线程不断处理请求并可以空闲处理下一个请求，服务器处理该线程并继续处理下一个客户端请求。\n\n**传统模型的优势：**\n* 三层架构更安全，因为客户端无法直接访问数据。即使使用\
  \ NodeJS，我们将拥有相同的模型，只是用 Java 替换为我们的后端服务器。\n* 将应用程序服务器部署到多台机器的能力提供了更好的扩展性、性能和更好的可重用性。\n\
  * 您可以进行水平扩展并单独扩展每个项目。\n* 您可以从数据库服务器卸载核心性能负载并高效地执行负载均衡。\n* 当所有数据流通过决定如何以及谁使用数据的应用程序服务器时，数据完整性得到了提高。\n\
  * 模块化设计允许您更改某一层而不影响其他组件。\n\n**传统模型的缺点：**\n* 该系统无法处理更多同时的客户端请求。\n* 随着时间的推移，这种系统的响应速度会降低并让客户端等待响应。\n\
  * 为了处理大量请求，我们可能需要增加服务器资源，如内存、网络和磁盘。\n* 服务器由于阻塞 I/O 操作导致 CPU 闲置大量时间。\n\n### [Node.js\
  \ 架构]\n\nNode.js 的核心基于“单线程事件循环”架构来处理多个并发客户端请求。Node.js 处理模型基于事件驱动和回调机制。这种基于事件循环的机制允许\
  \ Node.js 以非阻塞方式执行任何类型的阻塞 I/O 操作。\n\n**Node.js 架构的关键组件：**\n\n以下是 Node.js 框架的一些核心组件：\n\
  * 需求：根据客户端的操作，后端服务器可以有不同类型的需求，例如阻塞（复杂）或非阻塞（简单）。\n* Node.js 服务器：客户端向服务器发送请求，Node.js\
  \ 处理用户请求并向用户返回输出。\n* 队列：用于存储传入的客户端请求并按相同顺序将其传递给事件循环的事件队列。\n\n\n\n\n\n- **线程池：**\
  \ 任何服务器的线程池都包含多个线程，这些线程在特定时刻可用，用于执行处理请求所需的的操作。\n- **事件循环：** 事件循环是 Node.js 架构的核心，它从事件队列中接收请求，并在处理后将响应返回给客户端。\n\
  - **外部资源：** 计算、存储等外部资源被用于处理阻塞的客户端请求。\n\nNode.js Web 服务器的工作流通常与图 2.3 所示的图表非常相似：\n\
  \n![](img/2.3_Node_architecture.jpg)\n\n**图 2.3：** Node.js 架构工作流\n\n此图展示了 Node.js\
  \ 应用在后台是如何运行的。V8 引擎编译你在程序中编写的代码，而应用程序代码通过绑定（binding）与底层的 Node.js 组件进行通信。当应用程序代码触发事件后，这些事件按照它们从应用程序触发的原始顺序推入事件队列。事件循环处理所有事件，调用它们的回调函数，并将它们发送到工作线程进行处理，直到事件队列为空。在回调函数执行后，其回调将返回到事件队列，等待事件循环将其提取。\n\
  \n你的部分困惑可能源于第二个图中所使用的技术术语。如果你仔细观察，在“NODE.JS BINDINGS”下方，写着“(NODE API)”，遗憾的是，这是两个不同的东西。Node.js\
  \ API 是其内置库的用户界面，而从软件编程的角度来看，绑定是使用不同语言编写的代码之间的桥梁。\n\n客户端通过向 Web 服务器发送请求来与 Web 应用程序交互，请求可以是非阻塞的或阻塞的。这些请求如下：\n\
  \n- 查询数据\n- 删除数据\n- 更新数据\n\nNode.js 接收传入的请求并将它们添加到事件队列。\n\n然后，请求通过事件循环一个接一个进行路由。确保你的需求足够简单，不需要外部资源。\n\
  \n事件循环处理简单请求（非阻塞操作），例如 I/O 轮询，并将响应返回给相应的客户端。\n\n线程池中的一个线程被分配给一个复杂请求。该线程负责访问外部资源、完成特定的锁请求以及管理计算能力、数据库、文件系统等。\n\
  \n当任务完成时，响应被发送到事件循环，然后返回给客户端。\n\n以下是让 Node.js 框架如此惊叹的核心组件：\n\n- **V8：** Google 用\
  \ C++ 编写的开源 JavaScript 引擎，用于 Chrome/Chromium 浏览器。当我们谈论浏览器时，JavaScript 代码是即时解释的，而\
  \ JavaScript 在内部由 V8 通过即时编译（JIT）进行编译，以加速执行。这一过程将 JavaScript 代码直接转换为机器码，与浏览器相比，速度更快。\n\
  - **libuv：** libuv 用 C 语言编写，最初用于抽象异步非阻塞 I/O 操作，包括异步 TCP 和 UDP 套接字。它帮助在线程执行 I/O 操作（如执行数据库查询）时同时使用\
  \ CPU 和其他资源，从而实现更好、更高效的网络资源利用。该库具有处理不同服务的机制，例如文件系统、网络调用、子进程、轮询、单例处理、流等。\n- **其他底层组件：**\
  \ 如 c-ares、HTTP 解析、OpenSSL、zlib 等组件大部分是用 C/C++ 编写的。\n- **应用：** 这是你用 JavaScript 编写代码、模块和\
  \ Node.js 内置项（或使用 TypeScript、CoffeeScript 等翻译为 JS）的地方。\n- **绑定（Binding）：** 绑定基本上是对用另一种语言编写的库的封装。这种语言为另一种语言编写的代码开放了库，使得不同语言编写的代码可以通信。\n\
  \n# 事件循环](#toc.xhtml_s39a)\n\nNode JS 平台并不遵循多线程无状态的请求/响应模型。相反，它遵循一种单线程事件循环模式。Node.js\
  \ 的处理模型主要基于 JavaScript 事件驱动模型并带有 JavaScript 回调机制。你应该了解 JavaScript 事件以及回调机制是如何工作原理。在深入研究该模型的内部机制之前，请查看图\
  \ 2.4 中的图。Node.js 处理模型的核心是**事件循环**。一旦我们理解了这一点，Node.js 的内部原理就非常容易理解。\n\n如果没有事件循环，Node.js\
  \ 内部这种单线程进程是不可能的。当函数在运行时被调用时，它使用事件循环来通过定时器、查询、回调等方法将不同任务的操作组合在一起。这些方法被称为一个阶段（phase），它使用先进先出（FIFO）技术来平滑地执行操作。\n\
  \n阶段方法解释如下：\n\n- **定时器（Timers）：** 这是一个使用定时器调用作为阈值的步骤，用于决定何时执行 `setInterval()` 和\
  \ `setTimeout()` 等操作。\n- **待定回调（Pending Recalls）：** 这些是被挂起以便稍后恢复的回调。\n- **轮询（Polls）：**\
  \ 这是选举事件的序列。\n- **检查（Checks）：** 这是一个使用 `setImmediate()` 方法立即执行操作的方法。\n- **关闭回调（Close\
  \ callbacks）：** 这是一种关闭已打开回调的方法。\n\nNode.js 处理请求时将执行以下步骤：\n\n- Web 服务器有一个有限的线程池来提供客户端服务。\n\
  - 服务器队列它们接收到的所有请求。这被称为**事件顺序（Order of Events）**。\n- Node JS Web 服务器仅使用一个基于事件循环的线程，该线程持续检查请求。\n\
  - 一旦事件队列接收到客户端请求，Node.js 开始处理该请求。\n    - 对于非阻塞请求，线程准备响应并将其返回给客户端。\n    - 否则对于某些阻塞\
  \ IO 操作（如访问文件系统），它采用不同的方法：\n        - 检查线程的可用性。\n        - 将客户端请求分配给单个线程。\n    \
  \    - 进行请求处理，包括 I/O 操作、准备响应，并将其返回事件循环。\n        - 事件循环将响应发送给发出请求的特定客户端。\n\n在这里，\n\
  \n**n**: 客户端数量\n\n**m**: 线程池数量\n\n**假设：**\n\n- 所有客户端同时使用系统。\n- 由于硬件限制，服务器有一个有限的线程池。\n\
  - Client-1、Client-2、……Client-n 是使用此应用程序的客户端。\n\n![](img/2.4_NodeJS-Single-Thread-Event-Model.jpg)\n\
  \n**图 2.4：** Node.js 请求处理模型\n\n以下是处理请求涉及的步骤：\n\n1. 所有客户端的请求由 Node.js Web 服务器放入事件队列。\n\
  2. 事件循环逐一个获取这些请求并执行以下操作：\n    1. 检查来自 Client-1 的 Request-1 是否需要任何阻塞 I/O 操作或执行计算任务；如果是，则需要单独的线程来处理此类请求。\n\
  \    2. 如果请求是非阻塞 I/O 任务，事件循环处理所有步骤并将 Response-1 发送给 Client-1。\n3. 事件循环继续接收来自 Client-2\
  \ 的 Request-2 并执行所有上述操作。\n\n\n\n\n4. 该过程对所有来自 `Client-n` 的 `Request-n` 重复执行。\n5.\
  \ 事件循环从内部线程池中选择线程 `T-1` 并将其分配给客户端请求线程 `T-1`。\n6. 线程 `T-1` 处理请求，并在执行必要的阻塞 I/O 或计算任务后将\
  \ `Response-n` 发回给 `Client-n`。\n\n## 阶段详解\n\n每个阶段都有一个队列/堆，事件循环用它存储待执行的回调。\n\n###\
  \ 定时器 (Timers)\n\nJavaScript 定时回调（`setTimeout`, `setInterval`）存储在堆中直到它们过期。一旦过期，事件循环从栈中获取关联的回调，并按延迟增加的顺序开始执行，直到定时器队列为空。然而，定时器回调的执行由事件循环的轮询（poll）阶段控制：\n\
  \n```\nconsole.log(‘Start’);\nsetTimeout(() => {\nconsole.log(‘Timeout callback’);\n\
  }, 2000);\nconsole.log(‘End’);\n```\n\n在前面的代码中，`setTimeout()` 函数由一个回调调用，该回调会在 2000\
  \ 毫秒（即 2 秒）后在控制台打印 `Timeout callback`。该函数在定时步骤中被添加到消息队列中，并在同步代码执行后由事件循环处理。\n\n**输出**:\n\
  \n```\nStart\nEnd\nTimeout callback\n```\n\n正如我们所见，在打印“Start”和“End” 2 秒后打印了“Timeout\
  \ callback”，这是因为 `setTimeout()` 函数是非阻塞的，它的回调在同步代码执行后由事件循环处理。\n\n### 待处理回调 (Pending\
  \ callbacks)\n\n在此阶段，事件循环查询如文件和网络 I/O 操作之类的事件。事件循环在请求阶段处理某些请求事件，并在事件循环的下次迭代中将某些事件移动到等待阶段。在等待阶段，事件循环将延迟事件添加到待处理回调队列并触发它们。待处理回调阶段的事件包含了发送给某些系统的\
  \ TCP 套字错误。例如，某些操作系统会将 `ECONNREFUSED` 错误事件的处理推迟到这一步。\n\n### 空闲/准备 (Idle/Prepare)\n\
  \n这不是作为事件循环阶段之一的官方阶段，主要在内部用于描述一些后台工作。此时，事件循环什么都不做，可以用于执行一些后台任务，包括垃圾回收和检查低优先级事件。它处于非活动状态，并准备进入下一个阶段。\n\
  \n### 轮询 (Poll)\n\n在此时，事件循环等待新的异步 I/O 调用。除了 `setTimeout`、`setInterval`、`setImmediate`\
  \ 和闭包回调外，几乎所有的回调都会被执行。\n\n事件循环在此处做两件事：\n\n*   如果请求阶段队列中已经存在回调，它将不断触发它们，直到所有回调从请求阶段回调队列中移除。\n\
  *   如果队列中没有回调，事件循环将留在请求阶段一段时间，并轮询 I/O 事件。\n\n当事务循环进入请求阶段时，它会激活待处理的 I/O 事务并执行它们，直到队列为空或达到依赖于系统的限制。在执行\
  \ JavaScript 回调之间，“下一个 tick（next ticks）”队列和微任务队列会被清理，就像在其他阶段一样。\n\n轮询阶段与其他阶段的区别在于，事件链链有时会阻塞事件链一段时间，并轮询\
  \ I/O 事件，直到时间过期或达到回调限制。\n\n### 检查/setImmediate (Check/setImmediate)\n\n事件循环在 I/O\
  \ 事件之后立即在控制阶段执行 `setImmediate` 回调。\n\n事件循环按照创建的顺序执行多个 `setImmediate()` 调用。在接下来的示例中，事件循环在请求阶段触发了对\
  \ `fs.readFile()` 的调用。随后它在事件循环的同一次迭代中立即在控制阶段触发 `setImmediate()` 回调。\n\n另一方面，它在 `setTimeout()`\
  \ 定时步骤中处理事件循环的下一次迭代。如果你在 I/O 回调上运行 `setImmediate()`，事件循环保证它将在事件循环同一次迭代的控制阶段运行：\n\
  \n```\nconst fs = require(“fs”);\nlet counter = 0;\nfs.readFile(“someFilePath”,\
  \ {\nencoding: “utf8”\n}, () => {\nconsole.log(`Reading file, counter = ${++counter}`);\n\
  setImmediate(() => {\nconsole.log(`setImmediate 1 from I/O callback, counter = ${++counter}`);\n\
  });\nsetTimeout(() => {\nconsole.log(`setTimeout from I/O callback, counter = ${++counter}`);\n\
  }, 0);\nsetImmediate(() => {\nconsole.log(`setImmediate 2 from I/O callback, counter\
  \ = ${++counter}`);\n});\n});\n```\n\n### 关闭回调 (Close Callback)\n\n在这个关闭阶段，Node.js\
  \ 执行回调以关闭事件并完成事件循环的给定迭代。当连接器关闭时，事件循环在此时处理关闭事件。当在此阶段创建“next ticks”和微任务时，它们的处理方式与事件循环的其他阶段相同。值得注意的是，可以使用\
  \ `process.exit()` 方法在任何阶段停止事件循环。此时 Node.js 进程将退出。\n\n## 非阻塞或异步 I/O (Non-blocking\
  \ or Asynchronous I/O)\n\n概述讨论了阻塞和非阻塞调用之间的区别。虽然这与事件循环有关，但不需要这些主题的先知识。读者需要理解 JavaScript\
  \ 的基础。\n\n### 阻塞 (Blocking)\n\n这意味着代码执行必须等待函数定义的所有操作完全执行完毕。这是因为事件循环在阻塞操作期间无法执行 JavaScript。\n\
  \n在 Node.js 中，由于计算密集型导致性能低下且不等待操作（如 I/O）的 JavaScript 通常被称为阻塞。Node.js 标准中最常用的阻塞函数是同步方法。原生模块也可以是阻塞方法。\n\
  \n以下示例是一个同步风格的程序。它在 V8 线程上从上到下运行，并消耗了一些 CPU（并不理想）：\n\n```\nconsole.log(Date.now().toString()\
  \ + ‘: Starting program’);\nconst startTime = Date.now();\nlet endTime = startTime;\n\
  while (endTime < startTime + 20) {\nendTime = Date.now();\n}\nconsole.log(Date.now().toString()\
  \ + ‘ Program Ends’);\n```\n\n在循环了 20 毫秒的 CPU 时间后，循环终止。由于事件循环中没有回调，程序结束了。\n\n###\
  \ 非阻塞 (Non-blocking)\n\n非阻塞系统调用是不阻塞当前代码执行的系统调用。非阻塞操作不等待 I/O 完成。如果阻塞操作会导致进程在操作系统层面被推迟，进程将继续执行而不是等待非阻塞\
  \ I/O 操作。非阻塞调用启动操作，并交给操作系统立即执行而不等待结果。\n\n阻塞和非阻塞 I/O 的主要区别在于 I/O 操作期间代码执行的行为。在阻塞\
  \ I/O 中，用户必须等待接收数据才能继续执行，而在非阻塞 I/O 中，用户无需等待任何内容，可以继续他们他们的工作！\n\n\n\n\n非阻塞 I/O 的主要优势是它允许用户在等待\
  \ I/O 操作完成的同时继续其他操作。这在编写许多许多任务同时发生的并发程序时特别有用。非阻塞 I/O 的编写比阻塞 I/O 稍微困难，但它也高效且灵活得多。这是因为非阻塞\
  \ I/O 允许用户以任何顺序同时执行多个 I/O 操作：\n\n```javascript\n‘use strict’\n\nconsole.log(Date.now().toString()\
  \ + ‘: Program started’);\n\nsetTimeout(() => {\n  console.log(Date.now().toString()\
  \ + ‘Asynchronous processing complete.’);\n}, 2000);\n\nconsole.log(Date.now().toString()\
  \ + ‘Program ends’);\n```\n\n**输出**:\n\n`Program started`\n`Program ends`\n`Asynchronous\
  \ processing complete.`\n\n该程序执行了以下操作：\n\n*   打印开始消息。\n*   调用 `setTimeout()`，设置\
  \ `2000` 毫秒的超时。\n*   打印结束消息。\n*   在经过至少 `2000` 毫秒后，事件循环调用提供给 `setTimeout()` 的匿名回调函数并运行它，显示“异步处理完成”的消息。\n\
  \n## 银行与咖啡馆\n\n让我们通过一个生活中的例子来理解阻塞和非阻塞。以下银行和咖啡馆为服务的示例将消除我们对阻塞与非阻塞的疑惑。\n\n### 银行（阻塞）\n\
  \n银行内部，每个部门都有独立的柜台，例如账户、收银台、贷款等。当你访问银行时，你会发现每个柜台前都排着队，客户在轮到时按特定顺序进入。\n\n这种事务处理的银行模型基于基本的阻塞技术：\n\
  \n*   在给定时刻，一名银行工作人员只能帮助一个客户。\n*   `Cashier` 按顺序处理你交易的所有阶段。\n*   如果收银员无法处理你的交易并可能需要主管批准，则收银员在继续之前必须等待批准。\n\
  *   在整个交易完成后，你将离开银行窗口。\n\n银行交易的本质是**同步的**。收银员必须独自完成交易的所有步骤，然后才能协助另一位客户。\n\n### 咖啡馆（非阻塞）\n\
  \n当你访问咖啡馆时，你会在其中一个柜台下单、付款并取号。在后台，许多厨师将共同工作，准备你的订单并提供服务。\n\n咖啡馆的事务处理模型是非阻塞的：\n\n\
  *   一个柜台一次只能协助一个客户。\n*   厨师一次只准备一个订单。\n*   柜台和厨师共享完成你订单的所有步骤。\n*   当厨师准备你的订单时，柜台并没有被阻塞，可以接受另一个客户的订单。\n\
  *   然后，当你的订单准备好时，你的名字会被公布，你去取餐。\n\n咖啡馆事件的这种性质是**异步**的例子。柜台不断接收订单、处理付款并收集足够的信息，以便客户报告其订单已完成。柜台工作人员随后帮助下一位客户，而幕后厨师则负责完成订单。\n\
  \n![](img/2.5_synchronus_vs_asyn.jpg)\n\n**图 2.5:** 同步与异步的时间跨对比\n\n当我们比较这两个示例中执行所花费的总时间时，我们会发现咖啡馆的订单处理速度比银行快得多。\n\
  \n这同样适用于 Node.js 框架，单线程事件循环有助于实现异步操作并导致更快的请求处理。\n\n## 核心 Node 模块\n\nNode 安装时附带了各种\
  \ node 模块，帮助我们在不显式导入的情况下使用这些功能或模块。\n\n## Buffers\n\n`Buffer` 对象表示 Node.js 中固定长度的字节序列。`Buffer`\
  \ 类是 JavaScript 类 `Uint8Array` 的子类，并扩展了涵盖更多额外用例的方法。如果支持缓冲区，Node.js API 接受简单的 `Uint8Arrays`。\n\
  \n尽管 `buffer` 类是全局可用的，但仍然建议通过 `import` 或 `require` 语句显式地引用它。\n\nNode.js 提供了一个 `buffer`\
  \ 类来存储原始数据，它类似于一个整数数组，但对应于在 V8 堆之外分配原始内存。使用 `buffer` 类是因为纯 JavaScript 不适合处理二进制数据。因此，当你处理\
  \ TCP 流或文件系统时，你必须处理字节流（octet streams）。\n\n## 创建 Buffers\n\n以下是一些常用方法：\n\n*   **创建一个包含\
  \ 10 个字节的未初始化的缓冲区**：\n\n    `buffer.alloc()` 方法创建一个任何大小的新缓冲区。当你使用此方法时，以字节为单位指定缓冲区的大小。以下代码将创建一个大小为\
  \ 10 字节的缓冲区：\n\n    ```javascript\n    var buf = new Buffer.alloc(10);\n    console.log(buf);\n\
  \    ```\n\n    **运行**：\n    ```\n    PS D:\\Demo\\Chapter-2\\buffer> node .\\create_buffer.js\n\
  \    ```\n\n    **输出**：\n    `<Buffer 00 00 00 00 00 00 00 00 00 00>`\n\n*   **从数组创建缓冲区**：\n\
  \n    ```javascript\n    var buffer = new Buffer.from([10, 20, 30, 40, 50]);\n \
  \   console.log(buffer);\n    ```\n\n    **运行**：\n    ```\n    PS D:\\Demo\\Chapter-2\\\
  buffer> node .\\create_buffer.js\n    ```\n\n    **输出**：\n    `<Buffer 0a 14 1e\
  \ 28 32>`\n\n*   **通过字符串创建缓冲区（带编码）**：\n\n    `Buffer.from()` 在需要字符串缓冲区时非常有用。\n\n\
  \    ```javascript\n    var buffer = Buffer.from(\"Learning Node\", \"utf8\");\n\
  \    console.log(buffer);\n    ```\n\n    **运行**：\n    ```\n    PS D:\\Demo\\Chapter-2\\\
  buffer> node .\\create_buffer.js\n    ```\n\n    **输出**：\n    `<Buffer 4c 65 61\
  \ 72 6e 69 67 20 4e 6f 64 65 20 64 65 70 74>`\n\n    **注意**：虽然 `utf8` 是默认编码，但你可以使用任何编码，例如\
  \ `ascii`、`utf16le`、`base64` 等。\n\n## 写入 Buffers\n\n以下语法用于写入 Node 缓冲区并返回字节数：\n\n\
  `buf.write(string[, offset][, encoding])`\n\n**参数**：\n\n传递给写入方法的参数列表如下：\n\n*   **string:**\
  \ 用于指定要写入的字符串数据。\n*   **offset:** 用于指定从缓冲区开始的索引（默认值为 0）。\n*   **length:** 用于指定写入的字节数（默认为\
  \ `buffer.length`）。\n*   **encoding:** 使用的编码（`utf8`）。\n\n我们在 `Chapter-2` 文件夹中创建一个新的\
  \ `buffer.js` 并添加以下代码：\n\n    ```javascript\n    var buf = new Buffer.alloc(256);\n\
  \    var len = buf.write(\"Writing Buffers of Length 256\");\n    console.log(\"\
  Octets : \" + len);\n    ```\n\n    **运行**：\n    ```\n    PS D:\\Demo\\Chapter-2\\\
  buffer> node .\\writing_buffer.js\n    ```\n\n    **输出**：\n    ```\n    <Buffer\
  \ 00 00 00 00 00 00 00 00 00 00>\n    <Buffer 0a 14 1e 28 32>\n    <Buffer 4c 65\
  \ 61 72 6e 69 67 20 4e 6f 64 65 20 6a 73 20 64 65 70 74>\n    Octets : 24\n    ```\n\
  \n## 从 Buffers 读取\n\n此处使用的语法用于从 Node 缓冲区读取数据并按指定的字符集编码返回字符串：\n\n`buf.toString([encoding][,\
  \ start][, end])`\n\n**参数**：\n\n传递给 `toString` 方法的参数列表如下：\n\n*   **encoding:** 用于使用的编码（`utf8`\
  \ 是默认编码）。\n*   **start:** 用于开始读取的起始索引（默认为 0）。\n*   **end:** 用于结束读取的结束索引（默认为整个缓冲区）。\n\
  \n```javascript\nvar buf = new Buffer.alloc(26);\nfor (var i = 0; i < 26; i++) {\n\
  \  buf[i] = i + 97;\n}\n```\n\n\n\n\n\n```javascript\nconsole.log(buf.toString(‘ascii’));\
  \ // outputs: abcdefghijklmnopqrstuvwxyz\nconsole.log(buf.toString(‘ascii’, 0, 5));\
  \ // outputs: abcde\nconsole.log(buf.toString(‘utf8’, 0, 5)); // outputs: abcde\n\
  console.log(buf.toString(undefined, 0, 5)); // encoding defaults to ‘utf8’, outputs\
  \ abcde\n```\n\n**运行**:\n```bash\nPS D:\\Demo\\Chapter-2\\buffer> node .\\string_buffer.js\n\
  ```\n\n**输出**:\n```\nabcdefghijklmnopqrstuvwxyz\nabcde\nabcde\nabcde\n```\n\n##\
  \ 将 Buffer 转换为 JSON\n\n我们可以使用以下语法将 buffer 转换为 JSON 对象：\n\n`buf.toJSON()`\n\n创建一个文件\
  \ `convert_json.js` 并添加以下代码：\n\n```javascript\nvar buf = new Buffer.from(‘Converting\
  \ buffer to json object’);\nvar json = buf.toJSON(buf);\nconsole.log(json);\n```\n\
  \n\n\n**运行**:\n```bash\nPS D:\\Demo\\Chapter-2\\buffer> node convert_json.js\n```\n\
  \n**输出**:\n```\n{\ntype: ‘Buffer’,\ndata: [\n67, 111, 118, 101, 114, 116, 105,\n\
  110, 103, 32, 98, 117, 102, 102,\n101, 114, 32, 116, 111, 32, 106,\n115, 111, 110,\
  \ 32, 111, 98, 106,\n101, 99, 116\n]\n}\n```\n\n## 合并 Buffer\n\n我们可以使用以下方法语法来合并\
  \ Node.js buffer：\n\n`Buffer.concat(list[, totalLength])`\n\n**参数:**\n\n以下参数列表被传递到\
  \ `concat` 方法中：\n\n* `list`: 要合并的 Buffer 对象数组列表。\n* `totalLength`: 这是合并后 buffer\
  \ 的总长度。\n\n```javascript\nvar buffer1 = new Buffer.from(‘Using NodeJS ‘);\nvar buffer2\
  \ = new Buffer.from(‘Concatenating buffers’);\nvar buffer3 = Buffer.concat([buffer1,buffer2]);\n\
  console.log(“buffer3 content: “ + buffer3.toString());\n```\n\n**运行**:\n```bash\n\
  PS D:\\Demo\\Chapter-2> node buffer.js\n```\n\n**输出**:\n```\nbuffer3 content: Using\
  \ NodeJS Concatenating buffers\n```\n\n## 比较 Buffer\n\n我们可以使用以下方法语法来比较 Buffer：\n\
  \n`buf.compare(otherBuffer);`\n\n**参数:**\n\n以下参数被传递到 compare 方法中：\n\n* `otherBuffer`:\
  \ 这是一个将要比较的新 buffer：\n\n```javascript\nvar buf1 = new Buffer.from(‘123’);\nvar buf2\
  \ = new Buffer.from(‘678’);\nvar res = buf1.compare(buf2);\nif(res < 0) {\n    console.log(buf1\
  \ +” less than “ + buf2);\n} else if(res === 0) {\n    console.log(buf1 +” is same\
  \ as “ + buf2);\n} else {\n    console.log(buf1 +” greater than “ + buf2);\n}\n\
  ```\n\n**运行**:\n```bash\nPS D:\\Demo\\Chapter-2/buffer> node compare_buffer.js\n\
  ```\n\n**输出**:\n```\n123 less than 678\n```\n\n## 复制 Buffer\n\n当我们想要通过另一个 buffer\
  \ 创建新的 Node buffer 时，此方法非常有用，使用以下语法完成：\n\n`buf.copy(targetBuffer[, targetStart][,\
  \ sourceStart][, sourceEnd])`\n\n**参数:**\n\n以下参数列表被传递到 copy 方法中：\n\n* `targetBuffer`:\
  \ 源 buffer 将被复制到的目标 Buffer 对象。\n* `targetStart`: 数字，可选，默认值: 0\n* `sourceStart`:\
  \ 数字，可选，默认值: 0\n* `sourceEnd`: 数字，可选，默认值: `buffer.length`\n\n```javascript\nvar\
  \ sourceBuf = Buffer.alloc(123);\n//复制一个 buffer\nvar targetBuf = Buffer.from(‘ABC’);\n\
  sourceBuf.copy(targetBuf);\nconsole.log(“Target Buffer content: “ + targetBuf.toString());\n\
  ```\n\n**运行**:\n```bash\nPS D:\\Demo\\Chapter-2\\buffer> node copy_buffer.js\n```\n\
  \n**输出**:\n```\nTarget Buffer content: 123\n```\n\n### 事件\n\nNode.js 的真正威力来自于核心事件模块，它有助于执行异步操作。我们定义了一个\
