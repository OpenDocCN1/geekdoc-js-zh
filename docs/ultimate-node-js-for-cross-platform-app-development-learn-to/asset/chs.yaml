  \ ‘rs’ 的注释，请谨慎使用） |\n| `w` | 打开文件进行写入；如果文件不存在则创建（如果存在则截断） |\n| `wx` | 类似 ‘w’，但如果路径存在则失败\
  \ |\n| `w+` | 打开文件进行读写；如果文件不存在则创建（如果存在则截断） |\n| `wx+` | 类似 ‘w+’，但如果路径存在则失败 |\n|\
