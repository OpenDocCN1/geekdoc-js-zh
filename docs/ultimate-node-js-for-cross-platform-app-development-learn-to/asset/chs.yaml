  \ 测试教程](https://www.youtube.com/watch?v=y18ubz7gOsQ)\n\n# 第 12 章：使用 Mocha 和 Chai\
  \ 进行 TDD\n\n## 引言\n在本章中，我们将学习使用 `Mocha` 和 `Chai` 等工具进行测试驱动开发（TDD）。本章的重点将是为单元测试的不同概念建立坚实的基础，并探索市场上可用的一些框架，如\
  \ `Mocha` 和 `chai`。在章节结束时，我们将尝试通过如何使用 `spy`、`stub`、`mock` 等核心概念来编写单元测试的示例。\n\n##\
  \ 结构\n本章将涵盖与在 Node.JS 中使用 Mocha 进行 TDD 相关的主题：\n* `Node.js` 单元测试概念\n* 测试驱动开发原则\n\
  * 测试框架类型\n* 使用 `Mocha` 建立首次测试\n* 运行和调试测试\n* 生成 HTML 和文本格式的报告\n\n## Node.js 单元测试概念\n\
  单元测试是开发者用于验证代码的自动化测试的关键类型之一。编写单元测试用例的重点是孤立地验证代码，这意味着被测系统不能与任何外部依赖项（如数据库、文件系统或任何类型的\
  \ HTTP 服务）进行交互。\n\n为了实现这一点，我们使用 `mocks`（模拟）或 `stubs`（存根）等技术，通过空实现来伪造所有所需的依赖项。\n\n\
  单元测试的主要目标是易于编写且无需过多配置即可运行，因为它们通常倾向于执行单个函数调用。此外，单元测试结果易于收集和显示。以测试给定代码每种可能结果的方式编写单元测试是非常重要的。在每个单元测试中，单元的返回值必须等于预期值，否则测试应该失败。\n\
  \n## 单元测试的重要性\nNode.js 单元测试有助于提高代码质量和产品的整体稳定性。假设用户在启动新应用程序后尝试进行注册。用户尝试提交申请表单，但由于某些问题，应用程序返回了错误信息，用户无法成功注册。从这个例子中，我们可以理解测试我们的\
  \ `API` 逻辑并确保它按预期工作的重要性。实现这一点最简单的方法是对应用程序中最小代码单元的核心业务逻辑进行单元测试。\n\n除了提高代码质量外，单元测试还可以用于创建回归套件。`回归套件`是指用于手动测试或通过自动化应用程序单元测试用例集合。在我们的\
  \ `CI/CD` 流水线内部执行全面且结构化的单元测试用例，有助于开发者在开发早期阶段识别任何问题。\n\n## 测试驱动开发基础\n测试驱动开发是一种方法，定义了我们如何同时进行开发和测试来提高产品质量。在过去，在我们遵循\
  \ `TDD` 之前，我们通常先编写代码逻辑，然后编写单元测试来验证这段代码；而测试驱动开发要求我们先写测试，然后修改代码，直到我们的代码逻辑通过已编写的测试。\n\
  \n使用 `TDD` 方法，我们产生的代码更简洁、更稳定，从长期来看不容易损坏并导致任何问题。当我们在 `TDD` 中编写单元测试时，它应该只测试一小部分逻辑，例如算法或业务问题，并在验证逻辑后通过或失败。单元测试应该始终是确定性的，这意味着它们应该始终给出通过或失败的结果。\n\
  \n## 测试驱动开发工作流\n定义 TDD 工作流的有以下五个步骤：\n1. **读取、理解和处理功能或 Bug 请求**：这是 `TDD` 过程的第一步，我们在这里为所需的功能或\
  \ Bug 定义单元测试用例。\n2. **通过编写单元测试来转换需求**：由于我们已经为功能或 Bug 定义了预期目标，我们开始根据业务逻辑设计单元测试用例。\n\
  3. **编写并开发符合要求的代码**：现在我们开始根据带有适当验收标准的定义功能或 Bug 编写单元测试用例。\n4. **运行所有测试并重复此步骤直到通过**：我们反复运行所有单元测试用例，直到它们都通过且我们已经开发了所有所需的代码逻辑。\n\
  5. **通过重构清理代码**：此过程的最后一步是冲洗、搓皂并重复。\n\n## 测试驱动开发的核心原则\n从软件开发开始，开发者的主要焦点一直是先写代码，然后进行手动测试以识别问题。一段时间后，我们意识到自动化测试的性，并开始编写单元测试以确保识别出的问题在开发后出现。现在\
  \ `TDD` 要求开发者先编写单元测试，运行测试，然后修改代码以修复失败的测试。\n\n以下是 `TDD` 的三个核心原则：\n* **首次测试失败**：这是遵循\
  \ `TDD` 方法的第一步，我们开始编写足够的代码逻辑，导致我们的首次测试以最小实现失败。如图 12.1 所示，`RED` 步骤是我们 `TDD` 过程的开始，其思想是当我们测试简单逻辑并通过基础代码后，就可以假设我们的代码已就绪。\n\
  * **代码更新和测试**：一旦单元测试通过或失败，我们需要根据测试结果更新代码逻辑。现在我们需要在代码中进行细微更改（重构）并再次运行测试。一旦我们的测试通过（`GREEN`\
  \ 状态），我们可以继续添加更多代码并从一个绿色测试切换到另一个绿色测试。一旦所有测试都变绿色，我们应该选择重构代码后的下一个失败测试。\n* **代码重构和测试**：在这一步中，我们进行代码重构以提高代码质量并考虑通过所有测试场景。这一步骤是一个持续的循环：编写失败测试、修复代码使其通过，并继续移动到下一个失败测试，然后更改代码通过该测试。从图\
  \ 12.1 可以看出，每次代码重构完成后，测试用例都会失败（`RED` 状态），我们需要进行一些更改使其通过（`GREEN` 状态）。\n\n![](img/12.1_ttd_steps.jpg)\n\
  \n**图 12.1:** 测试驱动开发过程步骤\n\n\n\n\n\n需要注意的最重要一点是 TDD 并没有规定如何编写精确的测试用例。然而，我们始终需要确定开发系统预期运行的场景或用例。这有助于我们理解每个功能的工作原理，并确保我们已经编写了相应的业务代码并对其进行了相应的测试。\n\
  \n作为开发者，我们的主要目标应该是编写并运行持续测试，以发现新的缺陷（无论是功能性的还是非功能性的），并验证更改或改进是否导致了缺陷或 Bug。\n\n##\
  \ 不同类型的测试框架\n\n以下是一些最流行的测试框架：\n\n### Mocha\n由于其灵活性，它是最受欢迎的 JavaScript 测试框架。通过 `Mocha`，开发者有更大的自由来编写测试用例。有很多第三方工具可用，它们提供了许多许多所必需的测试功能，如断言（assertions）、模拟（mocking）等。将\
  \ `Mocha`（测试框架）配合 `Chai`（断言库）已成为一种非常流行的组合。\n\n### AVA\n`AVA` 是一个小型轻量级的测试工具，具有高度的任意性并有助于同时执行测试，从而获得更好的性能。`AVA`\
  \ 不支持像 `Mocha` 那样的全局值，并使用清晰的语法来帮助关注我们需要测试的最重要信息。\n\n### Tape\n这是另一个非常小的框架。像 `AVA`\
  \ 一样，它不支持全局值。它安装快速，不需要过多配置。\n\n### Jasmine\n`Jasmine` 也是 TDD 或 BDD JavaScript 应用中非常流行的\
  \ JavaScript 测试框架之一。它提供了多个实用，可以轻松地对同步和异步代码自动化测试。`Jasmine` 在前端工作中广泛采用，开发者使用此框架来测试\
  \ Angular/React/Vue 应用。\n\n### Jest\n`Jest` 也是由 Facebook 开发的流行框架。它构建在 `Jasmine`\
  \ 之上，专为单元测试设计，主要是 `React` 和 `React Native` 应用，但在获得普及后，它开始被用于测试其他应用程序。`Jest` 的重点是为测试重量型\
  \ Web 应用提供支持和简单性。\n\n除了单元测试之外，`Jest` 主要用于执行组件测试（即孤立地测试应用程序的不同组件）。`Jest` 不依赖于第三方应用程序和软件，使其成为最广泛使用的\
  \ JavaScript 自动化测试框架。它被认为是最好的单元测试框架之一。\n\n## 单元测试核心概念\n\n以下是编写单元测试用例时广泛使用的一些核心概念：\n\
  \n*   **模拟 (Mocking)**：模拟主要用于通过模拟真实对象的行为并用模拟对象或函数替换真实对象来孤立地测试代码。我们可以使用模拟的查找对象来触发一个抛出意外错误的函数调用，以检查该函数处理任何类型错误的的预期行为。\n\
  *   **探听 (Snooping)**：探听有助于监听函数调用，稍后可用于验证对象是否用正确的参数被调用。定义在任何函数上的 `spy`（间探器）不会改变函数的行为。\n\
  *   **打桩 (Stumping)**：`Stumps` 与 `ies` 非常相似。我们不是破坏函数定义，而是使用 `stub`（桩）来控制函数的行为。当我们单元测试一个正在进行外部服务调用的函数时，我们希望模拟该依赖项以返回某些预定义的结果，这可以帮助我们单元测试逻辑。\n\
  \n## Node.js 单元测试的优势\n\n以下是我们在测试时应该考虑的单元测试的好处：\n\n*   **提高代码质量**：单元测试有助于提高你的代码质量。这为我们编写的业务逻辑是正确的提供了更多保证，并且不会发生意外的行为。单元测试还帮助我们发现代码中可能在重构期间引入的\
  \ Bug 和缺陷。\n*   **编码错误识别**：测试有助于你在软件开发生命周期早期发现 Bug。单元测试对于发现业务逻辑中的错误特别有用。如果你在软件开发周期更早阶段发现\
  \ Bug，就可以更早地修复问题，这样它们就不会影响代码的其他部分。\n*   **更好的设计和代码结构**：当我们编写测试时，我们验证了系统的设计，并检查每段代码是否符合整个应用程序代码库。编写可测试的代码有助于我们据此做出更好的设计决策。\n\
  *   **更高质量的产品**：单元测试有助于提高应用程序的整体质量，从而产生更好的产品并增加用户满意度。高质量的软件将帮助我们的客户对平台更有信心，并使他们在没有任何抱怨的情况下使用它。\n\
  *   **可视化代码覆盖率报告**：代码覆盖率衡量了单元测试执行的代码量，并包含了执行期间转换了哪些行、分支或方法等细节。一旦执行了所有测试，我们的报告插件就会生成\
  \ `JSON`、`HTML`、文本等格式的报告。\n\n## Node.js 单元测试剖析\n\n以下是执行每个测试内部需要执行的关键步骤（也称为 `AAA`）：\n\
  \n### 1. Arrange (准备)\n这是第一步，用于设置正确的状态、模拟依赖项或向对象添加 spy。我们使用的这些初始对象构成了运行测试的基准。\n\n\
  ### 2. Act (执行)\n这一步被称为 `Action` 阶段，我们调用想要测试的实际函数或代码段。\n\n### 3. Assert (断言)\n这一步也称为\
  \ `Assertion` 阶段，在此阶段验证我们的代码逻辑是否产生了预期的结果。除了之外，我们还可以判断给定的函数是否用正确的参数被调用。\n\n![](img/12.2_aaa_steps.jpg)\n\
  **图 12.2：** AAA 示例\n\n# 使用 Mocha 和 Chai 的优势\n\n使用 Mocha 和 Chai 的一些主要优势如下：\n\n* \
  \  **异步测试支持**：Node.js 通常包含异步操作，如网络请求或数据库交互。Mocha 能够很好地处理异步测试，因此不需要额外的库或复杂的配置即可编写异步测试。\n\
  *   **可读且表达力强的语句**：Chai 与 Mocha 无缝集成，提供了许多语句样式和表达性语法。它提供了多种语句样式，包括常用的词如 `expect`、`assert`\
  \ 和 `should`，因此你可以选择符合你偏好和可读性需求的样式。\n*   **社区支持**：由于庞大的用户群和活跃的生态系统，Mocha 和 Chai\
  \ 在 Node.js 社区获得了巨大的关注，因此你会找到资源、教程和社区支持。\n\n## 编写单元测试的实用技巧\n\n在编写第一个单元测试时，考虑以下四个实用建议：\n\
  \n*   始终在给定的单元测试中定义一组较小的语句。当我们添加较多断言时，意味着我们可能没有独立地测试最小代码单元。当测试复杂行为或场景时，将一个单元测试拆分为多个测试定义是有意义的。\n\
  *   确保避免重复相同的断言。当特定的测试用例验证给定属性的空值时，让我们避免在另一个测试中断言同一属性的空值。过多的断言会很难判断哪些重要场景是根据优先级进行测试的。\n\
  \n\n\n\n\n* 在编写应用程序测试用例时，每个人都应该遵循严格的组织、操作和保护原则。这使得我们的测试更具可读性、更容易组织，并且长期来看更具维护性。\n\
  * 我们应该始终避免使用未经证明的测试。在编写测试用例时，我们需要确保它们是有效的，并且始终测试正向的结果。有时我们会编写一个没有断言的测试，只包含准备（arrange）和执行（act）阶段。\n\
  \n## 编写单元测试的方法\n\n编写单元测试有两种主要方法：\n\n* `describe()`：这是一系列测试脚本，它调用一个带有两个参数的全局函数：一个字符串和一个函数。\n\
  \n  ```javascript\n  // start a test suite of one or more tests\n  describe(‘#sum()’,\
  \ function () {\n    // ...add some tests\n  })\n  ```\n\n* `it()`：这是为了执行而编写的最小测试用。`it()`\
  \ 调用一个带有两个参数的全局函数，即字符串和一个函数。你可以在 `describe()` 方法中编写多个 `it()` 语句。单元测试中使用的第三种方法取决于开发者的选择。每个\
  \ `it()` 语句具有以下函数之一，它接收一个值并期望以其真实形式返回：\n\n  ```javascript\n  // begin a test suite\
  \ of one or more tests\n  describe(‘#sum()’, function () {\n    // test a functionality\n\
  \    it(‘should add numbers’, function () {\n      // add an assertion\n      expect(sum(1,\
  \ 2, 3, 4, 5)).to.equal(15);\n    })\n    // ...some more tests\n  })\n  ```\n\n\
  * `expect()`：这是一个 BDD 风格的库。自然语言参数在这里链式调用。它主要用于逻辑值或数字等非描述性主题。\n\n  ```javascript\n\
  \  // begin a test suite of one or more tests\n  describe(‘#sum()’, function ()\
  \ {\n    // test a functionality\n    it(‘should add numbers’, function () {\n \
  \     // add an assertion\n      expect(sum(1, 2, 3, 4, 5)).to.equal(15);\n    })\n\
  \  })\n  ```\n\n* `should()`：这是一个 BDD 风格的库。在这种情况下，自然语言语句也是链式调用的。然而，它通过 `should`\
  \ 属性扩展每个对象以开始字符串。\n\n* `assert()`：这是一个 TDD 风格的库。它提供了额外的测试并且具有跨浏览器兼容性。\n\n# 行为驱动开发\
  \ (BDD) \n\n行为驱动开发 (BDD) 是一种敏捷软件方法，旨在完全减少团队成员之间的跨团队沟通差距。这种方法被证明在提高理解、增加协作和提高开发质量方面更加有效。它鼓励团队清晰地表达需求，并对产品应该如何工作达成共识。该框架是在开发者习惯编写\
  \ TDD 之后出现的，在 TDD 中，测试是在代码之前编写的，通过测试是软件开发中的关键优势。\n\n## BDD 与单元测试\n\n行为驱动开发哲学帮助开发者更多地关注客户需求，并执行单元测试和验收测试，从而提高我们的产品质量并帮助客户对我们更有信心。\n\
  \n单元测试应该按照被测试组件的行为相同的顺序编写，我们可以验证业务或利益相关者提供的所有需求。通过明确指定所有需求，我们确保任何团队成员都不会误解需求。\n\n\
  用户故事按以下格式编写：\n\n* 作为一个 [角色]\n* 我想要 [功能]\n* 这样就可以 [利益]\n\n例如，我们可以写一个用户在电子商务网站获取产品列表的用例。\n\
  \n* 作为一个用户\n* 我想要获取产品列表\n* 这样我就可以检查每个产品的价格\n\n我们可以如下编写我们的 BDD 测试：\n\n* **给定 (Given)**\
  \ 用户已登录系统\n* **当 (When)** 用户在搜索框中输入文本时\n* **并且 (And)** 点击 `enter` 键\n* **然后 (Then)**\
  \ 用户查看项目列表\n\nCucumber 是编写 BDD 测试的流行框架之一，允许每个团队成员审查测试并协作以对正在开发的功能达成共识。\n\n在下面的图中，我们可以看到编写\
  \ cucumber feature 文件的实时示例，它用于验证我们应用程序中可用的菜单选项功能。\n\n![](img/12.3_cucumber_example_.jpg)\n\
  \n**图 12.3:** 使用 Cucumber 框架的 BDD 测试示例\n\n# BDD 的主要优势\n\n以下是在我们的开发过程中使用 BDD 的主要优势：\n\
  \n* 提高包括利益相关者、测试人员和开发者在内的跨职能团队之间的协作。\n* 它是一个外部操作，这意味着正在构建的程序单元的实现提供了对*预期行为*的控制。\n\
  * 测试用例更清楚地表达了我们正在尝试开发和测试的功能。\n* 这迫使进行批判性分析和设计，因为开发者在开发生产代码之前必须完全理解预期输出以及如何测试它。\n\
  * 这有助于减少或克服未来由于设计实现错误而可能出现的所有瓶颈。\n\n# Mocha 和 Chai 的安装\n\n以下步骤用于安装 Mocha 和 Chai：\n\
  \n### 1. 项目设置\n\n使用以下命令为你的项目创建一个新文件夹：\n\n```bash\nPS D:\\Demo> mkdir unit_test\n\
  ```\n\n### 2. 项目初始化\n\n进入上述测试目录并运行命令：\n\n```bash\nPS D:\\Demo\\unit_test> npm init\
  \ -y\n```\n\n### 3. 安装 mocha 和 chai\n\n运行以下命令在本地和全局安装 mocha 和 chai：\n\n```bash\n\
  // 全局安装 mocha\nnpm install Mocha -g\n\n// 安装本地 mocha\nnpm install Mocha -- dev\n\
  \n// 安装本地 chai\nnpm install Chai -- dev\n```\n\n**输出：**\n\n![](img/12.4_mocha_install.jpg)\n\
  \n**图 12.4:** npm install 输出\n\n一旦我们安装了 mocha 和 chai，我们的 `package.json` 将更新如下：\n\
  \n```json\n{\n  \"name\": \"unit_test_demo\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\"\
  : \"\",\n  \"license\": \"ISC\",\n  \"devDependencies\": {\n    \"chai\": \"⁴.3.10\"\
  ,\n    \"mocha\": \"¹⁰.2.0\"\n  }\n}\n```\n\n在这里我们 `mocha` 和 `chai` 被添加到 `devDependencies`\
  \ 中，因为这些框架在本地执行测试用例时需要。生产环境不需要。\n\n# 添加源码和测试\n\n创建名为 `src` 和 `test` 的两个文件夹，并将它们放在工作目录。我们将使用\
  \ `src` 文件夹存储主文件，使用 `test` 目录存储测试用例。\n\n让我们创建一个简单的 Node.js 应用程序，可以使用它编写代码和测试用例。我们将使用以下文件夹结构创建我们的应用程序，它用于执行\
  \ RGB 到 HEX 以及反向颜色转换。\n\n![](img/12.5_folder_strc.jpg)\n\n**图 12.5:** 示例应用程序的文件夹结构\n\
  \n**src/app.js**\n\n```javascript\nvar express = require(\"express\");\nvar app\
  \ = express();\nvar converter = require(\"./color_converter\");\n\napp.get(\"/\"\
  , function (req, res) {\n  res.send(\"Hello world\");\n});\n\napp.get(\"/convert/rgb-hex\"\
  , function (req, res) {\n  var red = parseInt(req.query.red, 10);\n  var green =\
  \ parseInt(req.query.green, 10);\n  var blue = parseInt(req.query.blue, 10);\n \
  \ var hex = converter.convertRgbToHex(red, green, blue);\n  res.send(hex);\n});\n\
  \napp.get(\"/convert/hex-rgb\", function (req, res) {\n  var hex = req.query.hex;\n\
  \  var rgb = converter.convertHexToRgb(hex);\n  res.send(JSON.stringify(rgb));\n\
  });\n\napp.listen(5100, () => {\n```\n\n\n\n\n```javascript\ntry {\n  console.log(`Server\
  \ listening at http://localhost:5100`)\n} catch (error) {\n}\n```\n\n`src/color_converter.js`\n\
  \n```javascript\nexports.convertHexToRgb = function (hex) {\n  var red = parseInt(hex.substring(0,\
  \ 2), 16);\n  var green = parseInt(hex.substring(2, 4), 16);\n  var blue = parseInt(hex.substring(4,\
  \ 6), 16);\n  return [red, green, blue];\n};\n\nexports.convertRgbToHex = function\
  \ (red, green, blue) {\n  var redHex = red.toString(16);\n  var greenHex = green.toString(16);\n\
  \  var blueHex = blue.toString(16);\n  return pad(redHex) + pad(greenHex) + pad(blueHex);\n\
  };\n\nfunction pad(hex) {\n  return (hex.length === 1 ? \"0\" + hex : hex);\n}\n\
  ```\n\n`test/app.test.js`\n\n```javascript\n// test/server.js\nvar expect = require(\"\
  chai\").expect;\nvar request = require(\"request\");\ndescribe(\"Color Converter\
  \ API\", function () {\n  describe(\"Convert RGB to Hex\", function () {\n    var\
  \ url = \"http://localhost:5100/convert/rgb-hex?red=255&green=255&blue=255\";\n\
  \    it(\"returns status 200\", function (done) {\n      request(url, function (error,\
  \ response, body) {\n        expect(response.statusCode).to.equal(200);\n      \
  \  done();\n      });\n    });\n    it(\"returns the color in hex\", function (done)\
  \ {\n      request(url, function (error, response, body) {\n        expect(body).to.equal(\"\
  ffffff\");\n        done();\n      });\n    });\n  });\n  describe(\"Convert Hex\
  \ to RGB\", function () {\n    var url = \"http://localhost:5100/convert/hex-rgb?hex=00ff00\"\
  ;\n    it(\"returns status 200\", function (done) {\n      request(url, function\
