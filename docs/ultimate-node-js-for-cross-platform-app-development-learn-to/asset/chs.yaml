  \n调试是从 Web 应用程序中识别并消除错误的过程。开发服务器端应用程序涉及编写复杂的业务逻辑，而调试可以帮助在部署到任何环境之前轻松识别问题。\n\n一些通用的调试工具包括：\n\
  \n* `Console.log`\n* `Node inspector`\n* `DevTools`\n* `Chrome debugging tools`\n\
  \n## 日志\n\nNode.js 日志记录对开发者非常有用，从构建到调试 Web 应用程序无一如此。日志提供了关于应用程序行为和错误的大量信息，以及客户端使用系统时发生的异常。这些日志还帮助产品管理人员规划未来的新功能。`Express.js`\
  \ 可以轻松与日志框架集成，对系统内部发生的活动和问题提供详细洞察。有很多开源 Node.js 工具可以提供日志支持，包括 `Pino`、`Winston`、`Bunyan`、`Morgan`、`Loglevel`、`Log4js`、`Roarr`、`Tracer`\
  \ 等。\n\n## 身份验证/授权\n\nWeb 通过互联网使用，我们需要确保应用程序是安全的供客户端使用。Node.js 为实现身份验证/授权提供了强大的工具。用于此目的的一些流行包包括\
  \ `jsonwebtoken`、`bcryptjs` 和 `passportjs`。\n\n## Express.js 的优势\n\n以下是 `Express.js`\
  \ 的一些核心优势，这些使得该框架如此流行：\n\n* **易于学习和开发**\n    学习基于 JavaScript 的 `Express.js` 框架非常容易。随着\
  \ `TypeScript` 的流行，我们也可以用 TypeScript 开发 Node 应用程序。\n\n* **维护成本低**\n    使用 `Node.js`\
  \ 和 `Express.js` 开发的应用程序在一段时间内可以用极少的精力轻松维护。\n\n* **轻量级且开发快速**\n    `Express.js`\
  \ 是一个非常轻量的框架，我们可以用更少的代码快速创建后端服务器并实时部署。这有助于团队以更低的复杂性和更高的效率构建应用程序。\n\n* **自动化部署**\n\
  \    在 DevOps 的帮助下，我们可以通过最少的配置轻松实现使用 `Express.js` 开发的服务器应用程序的构建和部署。\n\n* **社区支持**\n\
  \    由于在开发者社区中非常流行，在 Stackoverflow 等各种平台上有很多与 `Express.js` 相关的支持和内容。\n\n* **开源工具和包**\n\
  \    我们看到 NPM 中有许多 Node 模块包，减少了我们的重复工作，提高了生产力，并帮助尽快交付功能和产品。\n\n## 安装 Express.js\n\
  \n以下是使用 `Express.js` 创建第一个后端服务器的步骤：\n\n1. 在文件夹内创建一个名为 `server.js` 的文件：\n   `D:\\\
  demo\\app\\`\n\n2. 在新创建文件中添加以下代码：\n```javascript\nconst express = require(‘express’);\n\
  const app = express();\napp.get(‘/’, (req, res) => {\n  res.send(‘Hello, My server\
  \ using Express’);\n});\nconst server = app.listen(8081, function () {\n  var host\
  \ = server.address().address;\n  var port = server.address().port;\n  console.log($”Server\
  \ is listening at http://{host}:{port}”)\n});\n```\n\n3. 打开终端或 `cmd`，使用 `npm i`\
  \ 命令安装依赖：\n```bash\nPS D:\\Demo\\app> npm i\nnpm WARN sample@1.0.0 No repository\
  \ field.\n+express@4.18.2\nadded 1 package from 8 contributors and audited 57 packages\
  \ in 0.764s\n7 packages are looking for funding\nrun `npm fund` for details\nfound\
  \ 0 vulnerabilities\n```\n\n**运行：**\n```bash\nPS D:\\Demo\\app> node server.js\n\
  ```\n\n**输出：**\n```\nServer is listening at http://:::8081\n```\n![](img/3.1_exress_app_running.jpg)\n\
  \n**图 3.1：** 浏览器中的应用程序\n\n## Express.js 工作原理\n\n`Express.js` 应用程序分为四个阶段：\n\n* 创建新的\
  \ Express 应用程序\n* 添加新路由\n* 在任意端口启动 HTTP 服务器\n* 处理请求/响应\n\n在前面的示例中，我们创建了代码在浏览器窗口上打印基本消息“`Hello,\
  \ My server using Express`”。让我们来理解每一行重要的代码：\n\n* 导入 express 模块：\n```javascript\n\
  const express = require(‘express’);\n```\n\n* 使用 `express()` 创建我们的应用程序对象：\n```javascript\n\
  const app = express();\n```\n\n* 添加默认的 GET 路由来监听传入的请求。\n  Express 路由用于处理所有客户端请求，我们可以将这些路由挂接到\
  \ Express 应用程序上。\n  * 我们定义的 `get()` 路由，它将是 Web 应用程序的根，并添加了回调函数来处理 `res`/**`req`。对于\
  \ Express 中定义的所有路由，必须提供回调函数来处理来自客户端的所有请求。处理后，将返回响应对象：\n```javascript\napp.get(‘/’,\
  \ (req, res) => {\n});\n```\n  在回调函数内部，我们将返回字符串、JSON 或任何其他格式的响应。这是通过调用 `res.send()`\
  \ 实现的\n```javascript\nres.send(‘Hello, My server using Express’);\n```\n\n* 我们使用\
  \ `listen()` 方法绑定并监听连接。该方法用于在指定端口启动服务器：\n`listen(port[, backlog], callback)`\n \
  \ listen 的参数如下：\n  * `port`：监听的端口。\n  * `host`（可选）：应用程序监听的 IP 地址。只有在指定端口时才能指定 host。\n\
  \  * `backlog`（可选）：等待连接队列的最大长度。只有在指定端口时才能指定 backlog。\n  * `callback`（可选）：应用程序启动时运行的操作。\n\
  \n* 对于输出，在控制台中打印关于应用程序成功启动的消息（Server is listening at `http://8081`）：\n```javascript\n\
  var server = app.listen(8081, function () {\n  var host = server.address().address;\n\
  \  var port = server.address().port;\n  console.log(\"Server is listening at http://8081\"\
  );\n```\n\n## 在 Express 中添加路由\n\n路由是一种用于定义应用程序端点（URI）以响应客户端请求的技术。\n\nExpress app\
  \ 对象包含了所有的路由信息和相应的 HTTP 方法定义，例如 `app.get()`，用于处理从客户端发送的请求。\n\n我们定义了所谓的“回调函数”，这些函数会在客户端发送请求并由\
  \ Express 应用程序处理时调用。也就是说，每当客户端向服务器发送请求时，Express 路由机制就会触发回调函数。\n\n以下代码是一个基础路由的示例：\n\
  ```javascript\nconst express = require(‘express’);\nconst app = express();\n// 当向应用程序根发送请求时返回消息“hello\
  \ world”\napp.get(‘/’, (req, res) => {\n  res.send(‘hello world’);\n})\n```\n\n\
  ## 请求/响应对象\n\nExpress.js 预定义了处理请求和响应对象的方法参数。这些是回调函数按照以下语法接受的参数：\n\n```javascript\n\
  app.get(‘/’, (req, res) => {\n  res.send(‘hello world’);\n})\n```\n\n**请求对象属性**\n\
  \n\n\n\n\n以下是与请求对象（request objects）的一些属性：\n\n| | **属性** | **描述** |\n| :--- | :---\
  \ | :--- |\n| 1. | `req.app` | 它持有指向 Express 应用实例的引用 |\n| 2. | `req.baseurl` | 这是挂载路由实例的\
  \ URL 路径 |\n| 3. | `req.body` | 这是随客户端请求体传递的键值对 |\n| 4. | `req.cookies` | 该属性是一个对象，包含\
  \ cookie-parser 中间件使用的请求发送的 cookies |\n| 6. | `req.hostname` | 这是来自 `host` HTTP\
  \ 标头的主机名 |\n| 7. | `req.ip` | 这是请求的远程 IP 地址 |\n| 8. | `req.params` | 此对象具有映射到命名路由参数的属性。例如，如果我们有路由\
  \ `/employee/:id`，那么 `id` 属性可以通过 `req.params.id` 获取。该对象默认为 `{}` |\n| 9. | `req.path`\
  \ | 它包含请求 URL 的路径部分 |\n| 10. | `req.protocol` | 这是请求协议字符串，当使用 TLS 请求时为 `http` 或\
  \ `https` |\n| 11. | `req.query` | 一个对象，包含路由中每个查询字符串参数的属性。例如，如果我们有路由 `/employee?isActive=false`，那么\
  \ `isActive` 属性可以通过 `req.query.isActive` 获取。该对象默认为 `{}` |\n| 12. | `req.route` |\
  \ 表示当前匹配路由的字符串值 |\n| 13. | `req.secure` | 这是一个布尔标志；如果建立了 TLS 连接，我们将该标志置为 true |\n\
  \n**表 3.1：** 请求对象属性列表\n\n以下是 Express.js 请求对象方法的一些示例：\n\n```\nreq.accepts('html’);\n\
  ```\n```\n//=>?html?\n```\n```\nreq.accepts('text/html’);\n```\n```\n// => ?text/html?\n\
  ```\n```\nreq.accepts('application/json’);\n```\n```\n// => ?application/json?\n\
  ```\n```\nreq.get('Content-Type’);\n```\n```\n// => “text/plain”\n```\n```\nreq.param(name\
  \ [, defaultValue])\n```\n```\n// ?name=sasha\n```\n```\nreq.param('name’)\n```\n\
  ```\n// => “sasha”\n```\n\n## 响应对象方法 (Response Object Methods)\n\n响应对象的方法向客户端发送响应并终止请求-响应循环。\n\
  \n以下是响应对象的一些方法：\n\n| | **方法** | **描述** | **语法** |\n| :--- | :--- | :--- | :--- |\n\
  | 1. | `res.append()` | 向 HTTP 响应头部字段追加指定的值 | `res.append(field [, value])` `res.append('Warning’,\
  \ ‘199 Miscellaneous warning’);` |\n| 2. | `res.attachment()` | 将文件作为附件在 HTTP 响应中发送\
  \ | `res.attachment([filename])` `res.attachment('path/to/js_pic.png’);` |\n| 3.\
  \ | `res.cookie()` | 设置 cookie 名称和值 | `res.cookie(name, value [, options])` `res.cookie('Section’,\
  \ { Names: [ABC, XYZ] });` |\n| 4. | `res.clearCookie()` | 用于清除通过名称指定的 cookie |\
  \ `res.clearCookie(name [, options])` `res.clearCookie('name’, { path: ‘/user });`\
  \ |\n| 5. | `res.download()` | 将文件作为附件传输并提示用户下载文件 | `res.download(path [, filename]\
  \ [, fn])` `res.download('/invoice-03.pdf’);` |\n| 6. | `res.json()` | 发送 JSON 响应\
  \ | `res.json([body])` `res.json({ data: [] })` |\n| 7. | `res.jsonp()` | 发送带 JSONP\
  \ 支持的 JSON 响应 | `res.jsonp([body])` `res.jsonp({ data: [] })` |\n| 8. | `res.redirect()`\
  \ | 重定向请求 | `res.redirect([status,] path)` `res.redirect('http://test.com’);` |\n\
  | 9. | `res.render()` | 渲染视图模板 | `res.render(view [, locals] [, callback])` `res.render('index’);`\
  \ |\n| 10. | `res.send()` | 发送各种类型的响应 | `res.send([body])` `res.send({ some: ‘json’\
  \ });` |\n| 11. | `res.sendFile()` | 将文件作为字节流发送 | `res.sendFile(path [, options]\
  \ [, fn])` `res.sendFile(fileName, options, function (err) { // ... }});` |\n| 12.\
  \ | `res.status()` | 设置响应状态码并将其字符串表示作为响应体发送 | `res.status(code)` `res.status(400).send('Bad\
  \ Request’);` |\n\n**表 3.2：** 响应对象属性列表\n\n以下是 Express.js 响应对象的示例：\n\n```\nres.append('Link’,\
  \ [\n```\n```\nres.attachment('path/to/js_pic.png’)\n```\n```\nres.cookie('Section’,\
  \ { Names: [ABC, XYZ] });\n```\n```\nres.clearCookie('name’, { path: ‘/user });\n\
  ```\n```\nres.download('/invoice-03.pdf’)\n```\n```\nres.json({ data: [] })\n```\n\
  ```\nres.jsonp({ data: [] })\n```\n```\nres.redirect('http://test.com’\n```\n```\n\
  res.render('index’);\n```\n```\nres.send({ some: ‘json’ });\n```\n```\nres.sendFile(fileName,\
  \ options, function (err) {\n// ...\n});\n```\n```\nres.status(400).send('Bad Request’);\n\
  ```\n\n## 在 Express 中使用中间件\n\nExpress 严重依赖路由和中间件。中间件是函数，可以在应用程序的请求-响应循环中访问请求对象（`req`）、响应对象（`res`）和\
  \ `next` 函数。\n\n中间件函数可以：\n\n*   执行代码\n*   对请求和响应对象进行修改\n*   结束请求-响应循环\n*   调用堆栈中的下一个中间件\n\
  \n如果中间件函数没有结束请求-响应循环或调用 `next`，请求将挂起。\n\n中间件有五种类型：\n\n1.  应用级中间件（绑定到 `app` 实例）\n\
  2.  路由级中间件（绑定到 `Router` 实例）\n3.  错误处理中间件（通过四个参数定义）\n4.  内置中间件\n5.  第三方中间件\n\n###\
  \ 应用级中间件\n\n应用级中间件绑定到使用 `app.use()` 的 app 实例。它为每个请求运行。\n\n```javascript\nconst express\
  \ = require('express')\nconst app = express()\n\napp.use((req, res, next) => {\n\
  \  console.log('Time of request: ', Date.now())\n  next()\n})\n```\n\n### 路由级中间件\n\
  \n路由级中间件的工作与应用级中间件类似，但它绑定到 `express.Router` 实例。\n\n```javascript\nconst express\
  \ = require('express')\nconst router = express.Router()\n\nrouter.use((req, res,\
  \ next) => {\n  console.log('Router hit')\n  next()\n})\n\napp.use('/', router)\n\
  ```\n\n### 错误处理中间件\n\n错误处理中间件通过传递四个参数而不是三个参数来定义：`err`、`req`、`res` 和 `next`。\n\n\
  ```javascript\napp.use((err, req, res, next) => {\n  console.error(err.stack)\n\
  \  res.status(500).send('Something broke!')\n})\n```\n\n### 内置中间件\n\nExpress 有一些内置中间件函数，如\
  \ `express.json()` 和 `express.static()`。\n\n```javascript\napp.use(express.static('public'))\n\
  ```\n\n### 第三方中间件\n\n你可以通过安装并使用 `app.use()` 使用其他开发者提供的中间件。\n\n```javascript\nconst\
  \ cookieParser = require('cookie-parser')\napp.use(cookie())\n```\n\n由于提供的文本较长且需要排版，我对\
