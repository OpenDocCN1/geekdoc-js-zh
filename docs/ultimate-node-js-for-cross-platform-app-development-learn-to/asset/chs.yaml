  *   [commercetools 中间件示例](https://commercetools.github.io/nodejs/sdk/Middlewares.html#example)](https://commercetools.github.io/nodejs/sdk/Middlewares.html#example)\n\
  *   [Express 中间件工作原理](https://simonplend.com/how-does-middleware-work-in-express/](https://simonplend.com/how-does-middleware-work-in-express/)\n\
