  \n# 前言\n\n本书涵盖了使用 `Node.js` 进行 Web 开发的许多方面。本书还介绍了 `Node.js` 的重要概念，这些概念可以用于构建实时 Web\
  \ 应用程序。\n\n本书对于想要从零开始学习 `Node.js` 并深入理解如何使用 `Node.js` 开发实时 Web 应用程序的开发者来说，采用了实用的方法。\n\
  \n本书分为 15 章节。我们将涵盖大多数 `Node.js` 基础概念以及用于开发后端应用程序的一些高级概念。\n\n在`第 1 章` 中，我们将学习一些对理解\
  \ `Node.js` 至关重要的术语和概念。一些核心概念将包括非阻塞事件、事件循环、异步执行、JavaScript 运行环境、`REPL`、`NPM` 等。这个介绍章节将帮助入门\
  \ `Nodejs`，并涉及安装、运行 `cli` 命令、运行第一个 `Nodejs` 程序等活动。\n\n在`第 2 章` 中，我们将深入学习负责使 `Node.js`\
  \ 成为伟大技术的内核内置模块和底层特性。我们将涵盖一些核心概念，包括事件循环、异步编程、事件和回调。\n\n在`第 3 章` 中，我们将学习 Express\
  \ 并涵盖 Express 核心概念介绍以及在本地系统上的安装等主题。我们还将学习如何使用 `express.js` 创建第一个支持路由和中间件的后端服务器。\n\
  \n在`第 4 章` 中，我们将仔细审视 RESTful 服务的的基础知识，并重点关注创建一些后端 RESTful API 和处理不同的路由。我们将学习请求验证和响应转换，这是使用\
  \ `Node.js` 构建 API 的重要部分。\n\n在`第 5 章` 中，我们将学习可以用于应用程序各种需求的 NoSQL 数据库。本章将侧重于探索更多\
  \ `MongoDB`，并涵盖如何安装和使用 `MongoDB` 作为后端数据库的基础知识，以及使用 `Mongo-cli` 执行一些基本的 CRUD 操作。\n\
  \n在`第 6 章` 中，我们将尝试将 `Node.js` 与我们的后端数据库即 `MongoDB` 连接，并使用 REST API 执行一些 CRUD 操作以从数据库中保存和检索数据。本章主要涉及数据库存储和使用\
  \ `Mongoose` 进行数据操作。\n\n在`第 7 章` 中，我们将学习用于构建和连接前端网页的模板引擎，以及如何使用特殊语法添加动态内容。我们将探索\
  \ `EJS` 模板引擎并为测试创建一些动态内容。\n\n在`第 8 章` 中，我们将学习任何真实的 `Node.js` 中常用的不同类型的中间件。我们还将学习如何创建自定义中间件将其用于我们的应用程序。\n\
  \n在`第 9 章` 中，我们将学习如何使用一些流行的身份验证技术（如表单验证、令牌和 Cookie）来保护应用程序。我们还将回顾基于权限的角色的授权等主题。\n\
  \n在`第 10 章` 中，我们将引入 `socket.io` 用于构建聊天机器人等实时应用程序。我们将涵盖 socket 编程理论，并使用 `socket.io`\
  \ 创建简单的聊天应用程序以测试客户端与服务器之间的通信。\n\n在`第 11 章` 中，我们将学习如何处理错误并持久化日志，以便进一步调试。本章将涵盖一些错误处理和记录日志的技术。\n\
  \n在`第 12 章` 中，我们将重点理解如何使用 `Mocha` 和 `chai` 工具编写测试用例并执行单元测试。\n\n在`第 13 章` 中，我们将学习如何在本地和生产环境中调试任何与\
  \ `Node. js` 相关的问题。在这里我们将探索一些广泛使用的工具，如 `REPL`、`Node Inspector` 等。\n\n在`第 14 章` 中，我们将讨论构建并将您的\
  \ node 应用部署到服务器上的主题。我们将涵盖如何创建并将包发布到 `NPM` 仓库，以便该模块可以被其他团队或开发者使用。\n\n在`第 15 章` 中，我们将对一些不在本书范围的高级主题进行介绍，例如构建高度分布式系统、利用如\
  \ `Kafka` 等消息系统、多线程系统等。为您的 Nuxt 应用提供数据服务的标准建议 (PSR)。\n\n# 下载代码\n\n代码包和彩色图片\n\n请点击链接或扫描二维码下载本书的\n\
