  # 用于 MongoDB 的 Mongo Shell\n\nMongoDB Mongo shell 是一个智能工具，它使用 JavaScript 接口，允许所有人通过命令行连接到\
  \ MongoDB 服务器。该 shell 可用于数据操作或执行任何类型的管理操作。\n\n以下是 Mongo shell 提供的主要功能：\n\n*   帮助从\
  \ Mongo shell 运行所有 MongoDB 查询。\n*   允许对信息进行操作并执行组织管理。\n*   使用 JavaScript API 发布命令。\n\
  *   能够使用 Mongo shell 监控各种信息。\n\n## 安装 Mongo Shell\n\n要在你的系统上安装 Mongo Shell，请从 MongoDB\
