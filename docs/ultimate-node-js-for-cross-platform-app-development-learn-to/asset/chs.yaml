  \ 下载最新版本\n\n    将下载的文件解压到 `C:\\kafka_2.13-3.6.0`\n\n现在在 bash 中运行以下命令。\n\n```bash\n\
  c:/kafka_2.13-3.6.0> ./zookeeper-server-start.sh\n```\n\n**输出：**\n\n![](img/15.2_kafka_connection_1.jpg)\n\
  \n**图 15.2:** 运行 Kafka Zookeeper\n\n打开另一个 bash 并运行以下命令：\n\n```bash\nc:/kafka_2.13-3.6.0>./bin/windows/kafka-server-start.bat\
  \ ./config/server.properties\n```\n\n![](img/15.3_zookeeper_running.jpg)\n\n**图\
  \ 15.3:** 运行 Kafka 服务器\n\n让我们创建一个简单的使用 Kafka 作为消息系统的 Node.js 应用程序。\n\n![](img/15.4.jpg)\n\
  \n**图 15.4:** Kafka 示例的应用程序结构\n\n在 `Producer.js` 中添加以下代码。\n\n```javascript\n// 从\
  \ kafkajs 库导入 `Kafka`\nconst { Kafka } = require(\"kafkajs\")\n\n// 生产者的客户端 ID\n\
  const clientId = \"my-app\"\n\n// 集群中的 broker 列表\nconst brokers = [\"localhost:9092\"\
  ]\n\n// 我们想要写入消息的主题\nconst topic = \"message-log\"\n\n// 初始化一个新的 kafka 客户端\nconst\
  \ kafka = new Kafka({ clientId, brokers })\nconst producer = kafka.producer()\n\n\
  // 我们定义了一个每秒写入一条新消息的异步函数\nconst produce = async () => {\n  await producer.connect()\n\
  \  let i = 0\n  // produce 连接后，我们启动一个定时器\n  setInterval(async () => {\n    try {\n\
  \      // 向配置的主题发送消息，\n      // 使用由当前 `i` 的值形成的 key 和 value\n      await producer.send({\n\
  \        topic,\n        messages: [\n          {\n            key: String(i),\n\
  \            value: \"this is message \" + i,\n          },\n        ],\n      })\n\
  \      // 如果消息写入成功，记录它并递增 `i`\n      console.log(\"writes: \", i)\n      i++\n \
  \   } catch (err) {\n      console.error(\"could not write \" + err)\n    }\n  },\
  \ 1000)\n}\nmodule.exports = produce\n```\n\n让我们为编写消费者端创建另一个文件。\n\n```javascript\n\
  // 从 kafkajs 库导入 `Kafka`\nconst { Kafka } = require(\"kafkajs\")\n\n// 从 kafka 客户端创建消费者\n\
  const clientId = \"my-app\"\n\n// 集群中的 broker 列表\nconst brokers = [\"localhost:9092\"\
  ]\nconst topic = \"message-log\"\nconst kafka = new Kafka({ clientId, brokers })\n\
  const consumer = kafka.consumer({ groupId: clientId })\n\nconst consume = async\
  \ () => {\n  await consumer.connect()\n  await consumer.subscribe({ topic })\n \
  \ await consumer.run({\n    // 每当消费者获取新消息时，都会调用此函数\n    eachMessage: ({ message\
  \ }) => {\n      // 在这里，记录消息\n      console.log(`received message: ${message.value}`)\n\
  \    },\n  })\n}\nmodule.exports = consume\n```\n\n我们需要写一个用于运行 Kafka 服务的 node 应用程序。\n\
  \n```javascript\nconst produce = require(\"./producer\")\nconst consume = require(\"\
  ./consumer\")\n\n// 调用 `produce` 函数，如果发生错误则记录错误\nproduce().catch((err) => {\n  console.error(\"\
  error in producer: \", err)\n})\n\n// 启动消费者，并记录任何错误\nconsume().catch((err) => {\n\
  \  console.error(\"error in consumer: \", err)\n})\n```\n\n**输出：**\n\n![](img/15.5.jpg)\n\
  \n**图 15.5:** 运行 Kafka 示例显示收到的消息\n\n## 多线程系统\n\n多线程是一种程序执行环境，允许在进程中创建多个线程。它们使用系统的共享资源（如\
  \ CPU、内存和磁盘）独立且并行地执行。\n\n例如，如果我们在简单的单线程方法中运行一组命令，执行将等待上一个操作完成。而在多线程程序中，命令可以在不同的线程中同时运行。\n\
  \nNode.js 在设计上是单线程的，在大多数情况下它使用一个线程执行所有操作。但在执行 I/O 密集型操作（如从数据库访问数据或读取文档操作）时，Node.js\
  \ 将这些交给由 libuv C 库控制的线程池。\n\n## 多线程的优势\n\n以下是使用多线程的主要优势：\n\n*   **更好的性能：**\n\n \
  \   多线程有助于保持应用程序的响应，我们在运行 CPU 密集型任务或任何长时间 I/O 操作时不会遇到问题。\n\n*   **更好的资源利用：**\n\n\
  \n\n\n\n多线程允许 Node.js 利用多个 CPU 核心，从而提高资源利用率和应用程序的可扩展性。\n\n# 在 Node.js 中运行并行子进程\n\
  \n我们可以使用 Node 的 `child_process` 模块启动一个新线程。该线程可以处理所有操作，事实上，它可以通过消息系统进行通信并独立运行任务，在隔离状态下执行所有操作。\n\
  \n可以使用以下命令创建 `child_process`：\n\n*   `spawn()`\n*   `exec()`\n*   `execFile()`\n\
  *   `fork()`\n\n## 定义工作线程 (Worker Threads)\n\n工作线程可以运行 CPU 密集型操作，而不会阻塞事件循环（event\
  \ loop）的执行。\n\n`worker_threads` 在 Node.js 10.5.0 中引入。在此版本之前，除非你使用 `--experimental-employee`\
  \ 标志运行 Node.js 软件，否则无法使用该模块。\n\n## 工作线程的使用\n\n以下是我们可以使用工作线程概念的关键领域：\n\n*   **CPU\
  \ 密集型任务：**\n    这些线程可以将某些 CPU 密集型任务（如图像处理和视频编码）卸载到单独线程中，以避免阻塞主线程。\n*   **网络 I/O：**\n\
  \    工作线程可以处理耗时的网络 I/O 操作，如发送 HTTP 请求或发送电子邮件，当线程等待工作线程完成 I/O 操作时，主线程继续执行其他操作。\n\
  *   **文件读写处理：**\n    工作线程可以并行处理许多文件 I/O 操作，例如读取或写入大文件，这可以避免阻塞主线程并提高整个系统的性能。\n* \
  \  **提高可扩展性：**\n    工作线程可以并行运行数据库查询，使系统能够处理多个查询并提高可扩展性。\n\n## 子进程示例\n\n让我们创建一个简单的应用程序，展示如何使用子进程来调用一组命令。\n\
  \n创建一个名为 `child_process.js` 的文件并添加以下代码。\n\n```javascript\nconst exec = require('child_process').exec;\n\
  exec('test.bat', (err, stdout, stderr) => {\n  if (err) {\n    console.error(err);\n\
  \    return;\n  }\n  console.log(stdout);\n});\n```\n\n现在，上述代码需要一个 `test.bat` 文件，该文件将在执行子进程时被调用。此批处理命令将直接在给定文件夹下创建一个新的子进程。\n\
  \n```bash\ndir\nmkdir child\n```\n\n运行应用程序后，我们将得到以下输出：\n\n![](img/15.6.jpg)\n\n\
  **图 15.6：** 在 Node.js 中创建子进程的输出。\n\n## 结论\n\n在本章中，我们讨论了分布式系统的某些核心概念，以及为什么它们由于高可用性、可扩展性和容错性在如今变得日益流行。Node.js\
  \ 是事件驱动编程的优秀平台，因为它具有基于事件的架构，能够快速且响应良好的处理。Kafka 已成为 Node.js 平台上开发易于扩展分布式系统的流行工具之一。多线程提高系统性能的一种极方法，在\
  \ Node.js 中，`work_threads` 为执行 CPU 密集型任务所需的支持和有用模块。\n\n## 延伸阅读\n\n以下链接可以帮助我们更多地理解在本章中讨论的概念。\n\
