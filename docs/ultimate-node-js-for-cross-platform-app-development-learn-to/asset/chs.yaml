  \n## 请求验证\n\n所有类型的 RESTful 服务都需要验证，以防止客户端向服务器发送不想要的数据。当我们收到创建用户的请求时，我们必须验证请求中发送的内容。如果请求无效，我们必须向客户端返回正确的错误响应。\n\
  \n为了给 Express 应用添加验证支持，我们可能需要了解一些负责执行验证的中间件，如下：\n\n- **body-parser**: 这是一个 Node.js\
  \ 请求体解析中间件，负责在执行处理程序逻辑之前解析传入的请求体，可以通过 `req.body` 属性访问所有客户端数据。\n- **Express Validator**:\
  \ Express Validator 是一个 Node.js 中间件，它使用 `validator.js` 库，负责内置函数进行验证和清理。换句话说，Express\
  \ Validator 是一个帮助验证您的服务器端数据的中间件库。\n\n# 验证请求体\n\n让我们以用户注册为例，输入必须从客户端发送到我们的服务器，包括以下数据：\n\
  \n| 字段 | 要求 |\n| :--- | :--- |\n| 全名 | 长度在 2 到 50 之间的字符串 |\n| 电子邮箱地址 | 必须是有效的邮箱\
  \ |\n| 密码 | 必须是 8 个字符 |\n| 确认 | 必须与密码相等 |\n\n**表 4.1：** 用户注册发送的属性列表\n\n```javascript\n\
  const { check } = require(‘validator’);\nexports.registrationValidation = [\n  check(‘name’,\
  \ ‘Name is required’).not().isEmpty(),\n  check(‘email’, ‘Please include a valid\
  \ email’).isEmail(),\n  check(‘password’, ‘Password must be 8 characters’).isLength({\
  \ min: 8 })\n];\n```\n\n创建一个 **http_request.js** 文件来测试验证并添加以下服务器代码：\n\n```javascript\n\
  const express = require(‘express’);\nconst bodyParser = require(‘body-parser’);\n\
  const validator = require(‘validator’);\nconst { validationResult } = require(‘express-validator’);\n\
  const app = express();\napp.use(express.json());\napp.use(bodyParser.json());\n\
  app.use(bodyParser.urlencoded({ extended: true }));\n\napp.post(‘register’, validator.registrationValidation,\
  \ (req, res) => {\n  // 注册代码\n  const errors = validationResult(req);\n  if (errors.isEmpty())\
  \ {\n    // 请求符合标准时\n    console.log(‘User registration is done’);\n    res.send(“User\
  \ registration success”);\n  }\n  res.status(400).json({\n    errors: errors.array()\n\
  \  });\n});\n\napp.listen(3000, () => console.log(‘Server is running on port 3000’));\n\
  ```\n\n为了检查验证函数，我们将使用 Postman 传递以下数据：\n\n```json\n{\n  name: “John DOE”,\n  email:\
  \ “john.doe@gmail.com”,\n  password: “Aes”,\n  confirmPassword: “Aest03Luxi74”\n\
  }\n```\n\n对于上述数据，`registrationValidation()` 函数将检查输入并根据我们为用户注册提供的验证定义进行验证。如果客户端通过了正确的输入，则注册将继续并执行\
  \ 方法内部定义的逻辑。否则，在输入无效的情况下，客户端将从验证函数获得错误响应。\n\n![](img/4.4_sample.jpg)\n\n**图 4.4：**\
  \ 验证错误的输出\n\n## 请求转换\n\n这是一个将我们的请求转换为服务器接受的不同格式的过程。例如，客户端可以通过桌面、Web 和移动应用等不同平台向后端服务器发送请求。\n\
  \n例如，客户端有将传入请求从 JSON 转换为 XML 的需求，对于此，可以使用流行的中间件 `body-parser` 和 `xml2js`：\n\n```javascript\n\
  const express = require(‘express’);\nconst bodyParser = require(‘body-parser’);\n\
  var mung = require(‘express-mung’);\nvar parseString = require(‘xml2js’).parseString;\n\
  ```\n\n\n\n\n\n```javascript\nlet app = express();\n\napp.use(bodyParser.json());\n\
  \napp.use(bodyParser.raw({ type: () => true }));\n\n// ...everything we have above\
  \ goes here ...\n\n//请求数据转换\napp.use((req, res, next) => {\n  if (/\\/xml$/.test(req.headers['content-type']))\
  \ {\n    parseString(req.body.toString(), function (err, result) {\n      console.dir(result);\n\
  \      req.body = result;\n    });\n  }\n  next();\n});\n```\n\n上面的代码看起来应该非常熟悉，因为它与我们之前创建后端服务器时编写的代码非常相似。在这里，我们正在使用\
  \ `body-parser` 通过在使用 `Express` 创建的应用对象上定义的 `use()` 函数来解析请求。`body-parser` 通过分析传入的请求，来判断\
  \ JSON 请求体内容是否匹配请求头中定义的内容类型。\n\n现在，最重要的问题是：我们为什么需要使用 `bodyParser.raw()` 这一行呢？当客户端使用不同类型的信息访问我们的\
  \ API 时就会发生这种情况。它可能是 XML 或其他内容！`raw()` 中间件允许我们的网关具有灵活性，以便未来添加更多内容类型：\n\n//请求数据转换\n\
  ```javascript\napp.use((req, res, next) => {\n  if (/\\/xml$/.test(req.headers['content-type']))\
  \ {\n    parseString(req.body.toString(), function (err, result) {\n      console.dir(result);\n\
  \      req.body = result;\n    });\n  }\n  next();\n});\n```\n\n该中间件适用于所有的 RESTful\
  \ 方法类型，并且每次都会检查请求头中定义的 `content-type` 属性。如果中间件发现头部的结尾是 `/xml`，我们的中间件函数将获取“原始”（raw）体数据（实际上是一个缓冲区），并由\
  \ `xml2js` 将 JSON 转换为实际 JavaScript 对象，用该对象替换 `req.body`。\n\n此操作与当 `content-type`\
  \ 定义为 `application/json` 时 `bodyParser.json()` 所执行的操作非常相似。\n\n在之前定义的给定转换中间件函数中，我们可以在数据到达\
  \ Express 路由和处理逻辑之前对数据进行许多操作。\n\n![](img/4.5_request_transformation.jpg)\n\n**图\
  \ 4.5：** 请求 XML 转换为 JSON 的输出\n\n## 响应转换\n\n在 Express 后端服务中，处理传入的请求是一个简单的过程，大多数情况下\
  \ Express 本身提供了所有必要的工具来帮助我们执行请求转换。\n\n当我们将输出响应转换为客户端期望的所需的格式时，这需要更多的工作和努力。为了理解这个过程，让我们来看使用\
  \ `express-mung` 软件包将 JSON 响应转换为 XML 的简单用例之一。\n\n响应转换可以通过以下步骤完成：\n\n1. **安装 express-mung\
  \ 软件包**\n2. **在默认路由中添加中间件**\n\n一旦我们添加了这个中间件，请求就会被转发到默认路由。我们需要将其附加到响应上的原因是由于客户端：\n\
  \n```javascript\n//响应转换\napp.use(mung((req, res) => {\n  console.log(\"Response\"\
  );\n  if (/\\/xml$/.test(req.url)) {\n    var builder = xml2js.Builder();\n    var\
  \ xml = builder.buildObject(body);\n  }\n}));\n```\n\n上面的代码看起来应该非常熟悉，因为它与我们之前创建后端服务器时编写的代码非常相似。在这里，我们正在使用\
  \ `body-parser` 通过在使用 `Express` 创建的应用对象上定义的 `use()` 函数来解析请求。`body-parser` 通过分析传入的请求，来判断\
  \ JSON 请求体内容是否匹配请求头中定义的内容类型。\n\n现在，最重要的问题是：我们为什么需要使用 `bodyParser.raw()` 这一行呢？当客户端使用不同类型的信息访问我们的\
  \ API 时就会发生这种情况。它可能是 XML 或其他内容！`raw()` 中间件允许我们的网关具有灵活性，以便未来添加更多内容类型：\n\n## 响应转换\n\
  \n在 Express 后端服务中，处理传入的请求是一个简单的过程，大多数情况下 Express 本身提供了所有必要的工具来帮助我们执行请求转换。\n\n当我们将输出响应转换为客户端期望的所需的格式时，这需要更多的工作和努力。为了理解这个过程，让我们来看使用\
  \ `express-mung` 软件包将 JSON 响应转换为 XML 的简单用例之一。\n\n响应转换可以通过以下步骤完成：\n\n1. **安装 express-mung\
  \ 软件包**\n2. **在默认路由中添加中间件**\n\n一旦我们添加了这个中间件，请求就会被转发到默认路由。我们需要将其附加到响应上的原因是由于客户端：\n\
  \n```javascript\n//响应转换\napp.use(mung((req, res) => {\n  console.log(\"Response\"\
  );\n  if (/\\/xml$/.test(req.url)) {\n    var builder = xml2js.Builder();\n    var\
  \ xml = builder.buildObject(body);\n  }\n}));\n```\n\n## 理解状态码\n\nHTTP 状态码是服务器响应客户端请求时返回的三位代码。一些常见的状态码分类如下：\n\
  \n*   **1xx**：信息响应，表示服务器正在考虑该请求。\n*   **2xx**：成功响应，表示请求已成功并完成。\n*   **3xx**：重定向意味着你将被重定向。\n\
  *   **4xx**：请求错误，包括页面未找到、页面未访问。\n*   **5xx**：服务器错误意味着请求是正确的，但服务器无法处理。\n\n以下是一些常见的状态码：\n\
  \n| **HTTP 码** | **标题** | **描述** |\n| :--- | :--- | :--- |\n| `200` | OK | 请求成功\
  \ |\n| `201` | Created | 请求已成功且资源已创建 |\n| `202` | Accepted | 请求已接受处理但尚未完成 |\n| `204`\
  \ | No Content | 服务器成功处理请求但未向浏览器返回内容 |\n| `301` | Moved Permanently | 目标资源已分配了新的\
  \ URI |\n| `302` | Found | 目标资源临时位于另一个 URI 下 |\n| `400` | Bad Request | 服务器由于语法错误无法或拒绝处理请求\
  \ |\n| `401` | Unauthorized | 请求缺少目标资源所需的身份凭据 |\n| `403` | Forbidden | 服务器理解请求但拒绝授权\
  \ |\n| `404` | Not Found | 服务器无法找到相关的请求 |\n| `405` | Method Not Allowed | 目标资源不支持该方法\
  \ |\n| `500` | Internal Server Error | 可能会在处理请求时遇到了意外状况 |\n| `501` | Not Implemented\
  \ | 服务器不支持实现请求的功能 |\n| `502` | Bad Gateway | 网关或代理在等待处理时返回了错误 |\n\n\n\n\n\n| `503`\
  \ | 服务不可用 | 服务器当前由于维护或服务故障无法处理请求 |\n| `504` | 网关超时 | 网关或代理未从上游服务器接收到及时的响应 |\n\n\
  **表 4.2:** HTTP 状态码列表\n\n# 使用 Express 处理 CORS 请求](#toc.xhtml_s107a)\n\n### 什么是 CORS？\n\
  \nCORS 代表跨源资源共享（Cross-Origin Resource Sharing）。它允许客户端通过覆盖应用于 API 的某些安全限制来执行 API\
  \ 服务调用。这是通过绕过 `Access-Control-Allow-Origin` 头部实现的，该头部告诉浏览器哪些源可以访问特定的 API。\n\n**换句话说**，CORS\
  \ 是浏览器的一种内置安全功能，限制客户端或用户从一个服务器向另一个服务器发送跨源 HTTP 请求，并指定哪些域名可以访问你的资源。\n\n### CORS 如何工作？\n\
  \n我们可以将前端应用结合或分别部署在不同的服务器上，基于 N 层应用架构或微服务。根据我们设计应用程序时遵循的模型，有两种方案来处理跨服务器请求并允许客户端发送请求。\n\
  \n*   客户端和服务器具有相同源。\n    在这种情况下，可以从相同域名访问资源，因为所有应用程序代码都部署在同一服务器上。你正尝试通过 API 访问服务器的资源，如静态\
  \ HTML、图像、文件或动态数据。同一个服务器正在处理该请求。\n\n*   客户端和服务器具有不同源。\n    在这里，应用程序部署在不同的服务器上，例如前端应用部署在\
  \ XYZ 服务器，后端 API 服务部署在 ABC 服务器上。当客户端通过运行在浏览器上的前端应用发送请求时，由于客户端浏览器定义的跨源请求策略，应用程序无法从不同服务器的\
  \ API 调用加载数据。\n\n这是浏览器的默认安全策略，防止应用程序发送来自不同域的请求。\n\nCORS 通过允许访问不同服务器上的资源来帮助应用程序。CORS\
  \ 在响应对象中中添加了 `access-control-allow-origins` 头部，客户端可以指定特定应用程序允许哪些源。客户端机器上的浏览器会查看此头部，并决定响应是否安全地交付给客户端。\n\
  \n# 使用 Express 配置 CORS](#toc.xhtml_s108a)\n\n让我们创建一个简单的 Express HTTP 服务器端点，用于提供\
  \ GET 响应：\n\n```javascript\nconst express = require('express');\nconst app = express();\n\
  const users = [{\n  Name: ‘test’, phone: 324234234\n}];\napp.get('/users', (req,\
  \ res) => {\n  res.send(users);\n});\napp.listen(6069);\n```\n\n使用 `npm nodemon`\
  \ 启动服务器。\n\n在浏览器中访问 `http://localhost:6069/users`。\n\n在这个示例中，CORS 是默认开启的，因为我们目前从相同域名提供服务，且发送此请求的客户端也在相同域名。\n\
  \n现在，让我们尝试通过创建一个虚拟 HTML 页面并使用 JavaScript 调用 AJAX 来让用户使用搜索命令：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <title>Document</title>\n  <script>\n  function\
  \ run() {\n    // 创建我们的 XMLHttpRequest 对象\n    let xhr = new XMLHttpRequest();\n\
  \    // 建立连接\n    var url = ‘http://localhost:6069/users’;\n    xhr.open(\"GET\"\
  , url, true);\n    // 请求成功后执行的函数\n    xhr.onreadystatechange = function () {\n \
  \     if (this.readyState == 4 && this.status == 200) {\n        console.log(this.responseText);\n\
  \      }\n    }\n    // 发送请求\n    xhr.send();\n  }\n  run();\n  </script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n通过运行以下命令启动后端服务器：\n\n```bash\nPS D:\\Book\\Building-Real-Time-application-using-Node.js\\\
  chap_04> node .\\express_cors.js\n```\n\n运行后，你将得到一个错误，显示**未找到 CORS 模块**\n\n![](img/4.7_Output_error.jpg)\n\
  \n**图 4.7:** 运行 CORS 命令的输出\n\n运行以下命令本地安装 CORS：\n\n![](img/4.8_cors_installation.jpg)\n\
  \n**图 4.8:** 本地安装 CORS 的输出\n\n在浏览器中打开 `http://localhost:3000/` 并从浏览器控制台执行以下 AJAX\
  \ 请求。\n\n在执行上述查询之前，确保服务器正在运行。\n\n![](img/4.9_javascript_ajax_code.jpg)\n\n**图 4.9:**\
  \ 用于发送 AJAX 调 JavaScript 代码\n\n我们试图从运行在另一个源的后端服务器获取用户信息，但该 URL 的源被允许接收此服务器的响应。这就是为什么会抛出\
  \ CORS 错误。\n\n![](img/4.10_browser_error_cors.jpg)\n\n**图 4.10:** 浏览器中的 CORS 错误\n\
  \n为了解决此错误，我们可能需要向服务器添加 CORS 头部，并允许 `http://localhost:3000/` 访问服务器响应。\n\n```javascript\n\
  app.use((req, res, next) => {\n  res.header('Access-Control-Allow-Origin', 'http://localhost:3000');\n\
  \  next();\n});\n```\n\n```javascript\napp.get('/users', (req, res) => {\n  res.send(users);\n\
  });\n```\n\n```javascript\napp.use((err, req, res, next) => {\n  console.error(err.stack);\n\
  \  res.status(500).send('Something broke!');\n});\n```\n\n\n\n\n\n在这里，我们正在检查一个错误条件，即\
  \ `name` 是请求负载中的必填输入项，每当请求负载中未提供 `name` 时，我们就会返回错误。\n\n以下示例使用了 `try-catch` 块来处理错误：\n\
  \n```javascript\napp.get('/employees', async (request, response) => {\n  try{\n\
  \    const apiResponse = await axios.get(\"http://localhost:3001/employees\");\n\
  \    const jsonResponse = apiResponse.data;\n    console.log(\"response \" + jsonResponse);\n\
  \    response.send(jsonResponse);\n  } catch(error) {\n    // return error response\n\
  \    response.status(500).json({ message: \"Error in invocation of API: /employees\"\
  \ });\n  }\n})\n```\n\n在这段代码中，我们学习了如何在 `catch` 块中记录错误，并在向客户端的 HTTP 响应中返回带有错误代码 `500`\
  \ 的错误消息。\n\n这看起来是一个非常简单的用例，但这种在每个路由函数中添加错误处理逻辑的方法并不是一种简洁的方法。\n\n接下来，我们将尝试使用 Express\
  \ 中间件更优雅地处理这个问题，正如接下来的章节解释的那样。\n\n### Express 内置默认错误处理器\n\n当我们使用 Express 框架时，会定义一个默认错误处理器函数，用于捕获并处理\
  \ 应用程序中的错误：\n\n```javascript\nconst express = require('express');\nconst app = express();\n\
  // handle get request for path /users with error\napp.get('/userswitherror', (request,\
  \ response) => {\n  // throw an error with status code of 400\n  let error = new\
  \ Error(`processing error in request at ${request.url}`)\n  error.statusCode = 400;\n\
  \  throw error;\n})\nconst port = 3000;\napp.listen(port, () => console.log(`Server\
  \ listening on port ${port}.`));\n```\n\n当我们运行这段代码时，我们将得到一个 `status code` 为 `400`\
  \ 的错误以及错误消息：`Processing error in request`。\n\n在这里，我们不需要处理这个错误，因为它是由 Express 的默认错误处理器处理的。\n\
  \n然而，这种默认处理器并不是一种向客户端提供详细错误信息的良好且用户友的方法。通过使用中间件函数进行错误处理可以极极改进这一点。\n\n### 使用中间件函数进行错误处理\n\
  \n当发生错误时，我们调用 `next(error)` 并将错误对象作为输入传递给下一个中间件函数，该函数被定义为错误处理器函数：\n\n```javascript\n\
  const express = require('express');\nconst axios = require(\"axios\");\nconst app\
  \ = express();\nconst errorHandler = (error, request, response, next) => {\n  console.log(`error\
  \ ${error.message}`)\n  const status = error.status || 400\n  // send back an easily\
  \ understandable error message to the caller\n  response.status(status).send(error.message);\n\
  }\napp.get('/users', async (request, response) => {\n  try {\n    const apiResponse\
  \ = await axios.get(\"http://localhost:3001/users\");\n    const jsonResponse =\
  \ apiResponse.data;\n    response.send(jsonResponse);\n  } catch (error) {\n   \
  \ next(error); // calling next error handling middleware\n  }\n})\napp.use(errorHandler);\n\
  ```\n\n在这里，我们使用 `try-catch` 块仅在发生问题时捕获错误，但错误的实际实现是在 `errorHandler()` 函数内部完成的。\n\n\
  中间件错误处理函数的定义与其他中间件函数相同，但它们接受一个 `error` 对象作为第一个输入参数，随后是 `request`、`response` 和 `next`\
  \ 对象参数，如下：\n\n```javascript\nconst errorHandler = (error, request, response, next)\
  \ => { }\n```\n\n## 结论\n\n在本章中，我们重点学习了一些核心知识。我们涵盖了关于请求/响应的一些重要概念以及如何从零创建自己的 HTTP\
  \ 服务器。\n\n在接下来的章节中，我们将学习一种流行的 NoSQL 数据库 MongoDB。我们将介绍有关 MongoDB 的核心概念，并在本地系统上进行一些实际操作。\n\
