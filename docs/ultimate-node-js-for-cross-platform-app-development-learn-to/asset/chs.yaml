  \n# 第 5 章：使用 MongoDB\n\n在本章中，我们将深入探讨 MongoDB 的一些核心概念，使用 Node.js 技术栈构建任何应用程序。\n\n\
  ## 引言\n\n本章将涵盖关于 MongoDB 的以下主题：\n\n* 数据库简介\n* SQL 与 NoSQL\n* MongoDB 安装\n* 创建首次连接\n\
  * 执行数据库操作\n\n\n\n\n\n* 行：一天中的时间\n* 数据点：华氏度\n\n一些流行的 SQL 数据库系统如下：\n\n* Oracle\n*\
  \ Microsoft SQL Server\n* PostgreSQL\n* MySQL\n* MariaDB\n\n## 非关系数据库\n\n非关系数据库，也称为\
  \ NoSQL 数据库，是一种不使用传统的基于表的关系结构结构的数据库。相比之下，非关系数据库使用不同的数据模型，例如键值对、文本、列族和图模型。这提供了更大的数据存储和管理灵活性，特别是对于大规模、分布式和非结构化数据。让我们逐一查看不同的非关系数据模型以进行拆解。\n\
  \n流行的 NoSQL 数据库包括：\n\n* MongoDB\n* Google Cloud Firestore\n* Cassandra\n* Redis\n\
  * Apache HBase\n* Amazon DynamoDB\n\n以下是 SQL 和 NoSQL 之间的主要区别：\n\n| 关系型数据库 | 非关系数据库\
  \ |\n| :--- | :--- |\n| 这些数据库具有固定、静态或预定义的模式 (schema) | 它们具有动态模式 |\n| 这些数据库不适合层级数据存储\
  \ | 这些数据库最适合层级数据存储 |\n| 这些数据库最适合复杂查询 | 这些数据库不擅长复杂查询 |\n| 纵向扩展 | 水平扩展 |\n| 遵循 ACID\
  \ 属性 | 遵循 CAP（一致性、可用性、分区容性） |\n| 示例：MySQL, PostgreSQL, Oracle, MS-SQL Server 等 |\
  \ 示例：MongoDB, GraphQL, HBase, Neo4j, Cassandra 等 |\n\n**表 5.1：** SQL 和 NoSQL 的区别\n\
  \n## 使用数据库的优势\n\n使用数据库的一些主要优势如下：\n\n* 减少数据冗余\n* 减少更新错误并提高一致性\n* 增强数据完整性并与应用程序解耦\n\
  * 通过使用宿主机语言和查询语言提高用户对数据的访问能力\n* 提高数据安全性\n* 减少数据输入、存储和检索成本\n\n## 使用数据库的缺点\n\n以下是使用数据库的缺点：\n\
  \n* 增加了应用程序设计的复杂度\n* 购买硬件或许可证的额外成本\n* 需要额外的数据安全性来维护信息安全\n* 数据库与应用程序的兼容性\n\n## 数据库管理系统\
  \ (DBMS)\n\n数据库管理系统 (`DBMS`) 是一组工具，帮助客户端访问数据库、控制存储的信息、操作信息以及生成报告。`DBMS` 内部的数据库引擎能够对所需数据进行访问、锁定和修改。数据库模式定义了存储数据的数据库逻辑结构。`DBMS`\
  \ 确保了多个数据库之间的并发性、安全性、数据完整性和一致的数据管理。\n\n# DBMS 的用途\n\n`DBMS` 广泛用于以下管理任务：\n\n* 变更管理\n\
  * 性能监控与调优\n* 安全\n* 备份与恢复\n* 数据库及使用它们的应用程序活动的日志记录与监控\n\n`DBMS` 为客户端提供了工具，以获取数据的集中视图，多个用户可以根据特定的权限和特权访问数据。`DBMS`\
  \ 可以应用用户级权限来限制终端客户端可见的数据。\n\n市面上可用的一些关键 `DBMS` 工具如下：\n\n* **MySQL Workbench**\n\
  \  `MySQL Workbench` 是一个可选的可下载工具，为 `MySQL` 工具提供额外支持。Oracle 免费提供此工具来管理 `MySQL` 数据库。我们可以使用此工具完成许多数据管理任务，但它主要用于改进数据建模技术和\
  \ `SQL` 开发。\n\n* **Microsoft Server SQL Management Studio**\n  `Microsoft Server\
  \ SQL Management Studio` 是一个免费工具，允许用户在为数据创建表和图表时使用图形化工具获得更多设计选项。这有助于在创建新数据或更新现有数据时记录您的系统。该工具还会创建数据库图，显示完整的数据库设计及其结构，并帮助您修改数据、表、列和关系。\n\
  \n* **SQL Developer**\n  `SQL Developer` 是一个开源的 `DBMS` 工具，帮助您创建、设计和执行其他数据库管理任务。该工具用于\
  \ `Oracle` 数据库的数据管理，并帮助管理端到端的数据库应用程序。`SQL Developer` 是一个非常轻量且快速的工具，可以在任何系统上使用而没有许多性能问题。\n\
  \n* **PgAdmin**\n  `PgAdmin4` 是适用于 `PostgreSQL` 数据库的强大数据库管理解决方案。对于任何使用 `PostgreSQL`\
  \ 作为主数据库的应用程序，这都是一个非常简单实用的工具。它是一个开源工具，提供了易于使用的界面并兼容所有主流操作系统。\n\n* **MongoDB Compass**\n\
  \  `MongoDB` 项目提供了名为 `MongoDB Compass` 的强大图形用户界面。`Compass` 允许我们通过视觉界面访问 `MongoDB`\
  \ 数据库引擎提供的大部分功能。该工具有助于通过单一界面探索数据库、集合和单个文档、创建交互查询、操作现有文档并设计构建流水线。\n\n# DBMS 中的数据模型类型\n\
  \n`DBMS` 可以根据数据模型分为五大类型：\n\n* **层级模型**\n  这种 `DBMS` 利用存储信息时的“父子”关系，现今很少使用。它的结构像树一样，中心节点指向记录，分支指向区域。`Windows\
  \ XP` 中使用的 `Windows 注册表` 是这种数据库的示例。\n\n* **网络模型**\n  这种 `DBMS` 支持多对多关系。这通常会导致复杂的数据库结构。`RDM\
  \ Server` 是实现组织模型的数据库管理系统。\n\n* **关系模型**\n  这种 `DBMS` 以表（也称为关系）的形式描述数据库连接。与组织 `DBMS`\
  \ 不同，`RDBMS` 不支持许多关系。关系 `DBMS` 通常具有预定义的数据类型。这是最流行的 `DBMS` 类型。关系数据库管理系统的示例包括 `MySQL`、`Prophet`\
  \ 和 `Microsoft SQL Server`。\n\n* **面向对象模型**\n  这种模型支持新的数据类型。存储的信息以对象的形式存在。存储在对象具有属性（例如性别和年龄）以及描述对其做什么的策略。`PostgreSQL`\
  \ 是面向对象的社会 `DBMS` 的示例。\n\n* **实体关系模型 (ER)**\n  在 `ER` 数据库模型中，感兴趣的对象通过关系分组为实体，其属性被分组为资产。这些关系作为胶水连接不同的实体以形成完整的数据库。`ER`\
  \ 模型的设计使得关系可以描述整个功能或业务逻辑。\n\n\n\n\n\n* DBMS 采用各种强大的能力来高效地存储和恢复信息。\n* 它提供了信息的准确、敏性和安全性。\n\
  * DBMS 通过推断判断限制，为防止数据被未经授权访问提供高水平的安全性。\n* DBMS 对信息的并发访问进行计划，确保同一时间只有一个客户端可以访问相同的信息。\n\
  * 缩短了应用程序开发时间。\n\n# DBMS 的缺点\n\nDBMS 可能提供许多优势，但它也存在某些缺陷：\n\n* DBMS 的设备和程序成本非常高，这增加了组织的预算。\n\
  * 大多数数据库管理框架通常是复杂的框架，因此需要为客户使用 DBMS 做好准备工作。\n* 在少数组织中，所有信息都整合到一个单一数据库中，这可能会因为电力故障而受到损害，或者数据库在存储介质上发生损坏。\n\
  * 在某些情况下，许多客户端同时使用同一个程序会导致部分数据丢失。\n* DBMS 无法执行现代计算。\n\n# DBMS 中的 ACID 特性\n\n数据库旨在处理数据的不断变化，每个\
  \ DBMS 系统都需要确保它们能够妥善地处理所有更改而不损坏数据。一旦数据被修改，就必须维护其完整性。这非常重要，因为当数据完整性受到损害时，整个数据集就会损坏，反之这会导致整个数据库处于不一致状态。数据库的内容可以作为一个名为\
  \ `Transaction`（事务）的单一逻辑操作单元的一部分进行访问和修改。\n\n这些事务通过读写操作访问数据。为了确保一致性，数据事务必须始终遵循某些特性被称为\
  \ `ACID`（原子性、一致性、隔离性和持久性）。\n\n以下是 DBMS 软件应该遵循的键 ACID 特性：\n\n### 原子性 (Atomicity)\n\
  原子性指的是数据库操作中，所有事务要么同时发生，要么一个都不发生。在 DBMS 系统中，事务不能部分完成。每个事务被视为一个独立的进程，一旦 DBMS 处理了整个操作，该事务就可能被标记为已完成或未完成的事务。\n\
  \n这里只会发生两种情况：\n\n* **提交 (Acceptance)**：当事务完成且所有更改提交到数据库时，整个更改请求被接受，维护了数据的完整性。\n\
  * **回滚 (Rollback)**：当任何事务失败时，DBMS 不会向数据库提交任何更改，我们看不到任何已执行的更改。\n\n### 一致性 (Consistency)\n\
  我们需要为某些数据库维护可靠性要求，以确保传输前后的数据一致。DBMS 软件必须维护数据完整性，确保所有数据更改始终受到保护。当事务发生时，数据完整性非常重要，因为它确保了事务完成前后存储在数据库中的数据的一致性。当一个或多个客户端请求任何信息时，每次必须交付准确的数据。\n\
  \n### 隔离性 (Isolation)\n当多个客户端从不同位置使用 Web 应用程序时，可能会执行多个事务，导致数据库状态不相同。在大多数情况下，会发生独立或不相关的事务，可能会导致问题。除非特定事务的更改被成功保存，否则一个事务所做的更改对任何其他事务都是见的。隔离性在并发执行事务时起着重要作用，确保所有事务都是独立发生的，并且请求按照调用的顺序进行处理。\n\
  \n### 持久性 (Durability)\nDBMS 中的持久性意味着确保任务完成后数据保留在数据库中。即使在使用应用程序时发生系统崩溃或错误，数据也必须足够健壮以继续工作。然而，在任何事件发生后，恢复管理器负责确保数据库的完整性。每次修改数据时，我们必须使用\
  \ `COMMIT` 命令提交配置或数据更改。持久性确保在事务成功完成后，数据更新和更改会被写入并保存到磁盘中。\n\n# MongoDB 基础\n\n在这里，我们将涵盖关于\
  \ MongoDB 的一些基础主题。\n\nMongoDB 是一个开源的 NoSQL 数据库管理程序。NoSQL（并非 SQL）被用作传统关系数据库的替代方案。NoSQL\
  \ 数据库在处理大规模分布式信息集方面非常有价值。MongoDB 是一个可以管理面向文档的数据并存储或恢复信息的工具。\n\nMongoDB 用于海量数据容量，帮助组织在存储大量信息的同时保持快速运行。组织还利用\
  \ MongoDB 的即席查询、排序、堆调整、聚合、服务器 JavaScript 执行等功能。\n\n结构化查询语言 (SQL) 是一种用于管理关系数据库的标准编程语言。SQL\
  \ 将信息规范化为模式和表，每个表包含固定的结构。\n\nMongoDB 作为 NoSQL 数据库，不再使用表和行，而是由集合（collections）和记录（records）组成。记录由键值对组成，这是\
  \ MongoDB 信息的基本单元。集合类似于 SQL 表，包含记录集。MongoDB 支持许多编程语言，如 C、C#、Go、Java、Python、Ruby\
  \ 和 Swift。\n\n## RDBMS 与 MongoDB\n\n以下是 RDBMS 和 MongoDB 的一些主要区别：\n\n* RDBMS 通常基于模式结构，而\
  \ MongoDB 是面向文档的。\n* RDBMS 支持通过相关实体或表之间的连接（join）来实现复杂事务，而 MongoDB 不支持使用连接操作的复杂事务。\n\
  * 在搜索方面，MongoDB 的性能优于 RDBMS。这是因为所有文档都存储在 BSON 格式中，新格式有助于更好地解析数据。\n* MongoDB 允许非常灵活且可扩展的文档结构，而在\
  \ RDBMS 中，表和模式结构是固定的，维护着表之间的关系。\n* 在 RDBMS 中，所有数据都存储在表中，而 MongoDB 中使用集合。\n* MongoDB\
  \ 提供了一个 `_id` 字段，这是一个 12 字节的十六进制数，确保每个文档的唯一性。对于这一点，我们在 RDBMS 数据库中使用主键。\n\n# MongoDB\
  \ 架构的关键组件\n\n以下是 MongoDB 中常用的一些术语：\n\n* `_id`：这是每个 MongoDB 文档的强制性字段，代表唯一的 MongoDB\
  \ 文档，类似于 SQL 数据库中的主键。当我们创建新文档时，如果没有提供会自动创建一个 `_id` 字段。\n* 集合 (Collection)：这是对 MongoDB\
  \ 文档进行分组的方式。集合等同于 SQL 数据库中用于存储信息的表。例如，当我们想要存储员工信息时，我们将创建一个员工集合并添加员工相关的文档。\n* 游标\
  \ (Cursor)：这是指向查询结果集的指针。客户端可以通过遍历游标来获取结果。\n* 数据库 (Database)：它是所有集合的容器，类似于 RDBMS\
  \ 中数据库存储表。当我们创建多个数据库时，每个数据库在文件系统中都有自己的 set 文件。一个 MongoDB 服务器可以存储多个数据库。\n\n\n\n\n\
  \n*   **文档（Document）**：MongoDB 集合中的文档存储的信息与 SQL 数据库表中的行非常相似。文档以 JSON 格式存储，由键值对形式的字段组成。\n\
  *   **字段（Field）**：这些键值对用于存储 JSON 文档中的所有信息。在接下来的示例中，我们正在存储用户信息，包括名称、年龄、组等：\n\n  \
  \  ```json\n    {\n      “name”: “sue”, // 用于存储名称值的字段\n      “age”: 25, // 用于存储年龄的字段\n\
  \      “status”: “A”,\n      “groups”:[\"news”, “sports”]\n    }\n    ```\n*   **JSON**：JavaScript\
  \ 对象表示法已成为数据表示的默认标准，被多种语言和平台的支持。\n\n    ![](img/5.3.jpg)\n\n    **图 5.3：** MongoDB\
  \ 中的 JSON 对象\n\n*   **BSON**：BSON 代表**二进制 JSON (Binary JSON)**。BSON 的二进制结构编码了不同的信息类型和长度，使得导航和搜索比\
  \ JSON 更快。BSON 增加了一些基本的非 JSON 数据类型，例如日期和二进制数据。如果没有 BSON，MongoDB 将失去一些重要的原生支持。\n\n\
  以下是示例 JSON 对象及其 BSON 响应，它们存储在 MongoDB 数据库中：\n\n```text\n{“hello”: “world”} →\n\\\
  x16\\x00\\x00\\x00 // 文档总大小\n\\x02 // 0x02 = 类型 String\nhello\\x00             //\
  \ 字段名\n\\x06\\x00\\x00\\x00world\\x00 // 字段值\n\\x00 // 0x00 = 类型 EOO (‘对象结束’)\n\
  ```\n\n## MongoDB 如何工作\n\n对于想要开发快速、实时且主要处理原始数据的 Web 客户端来说，MongoDB 是一个完美的数据库。MongoDB\
  \ 以易搜索的集合和文档形式存储所有信息。\n\n![](img/5.4.jpg)\n\n**图 5.4：** 运行中的 MongoDB\n\n每个数据库引擎都有非常复杂的内部架构，允许它同时执行多个任务并高效地处理所有请求。MongoDB\
  \ 的工作基本上可以分为两层：\n\n*   应用层\n*   数据层\n\n应用层包含两个子部分：第一部分（我们可以称为前端或应用程序接口）供用户使用，第二部分是实际的后端服务器。前端或用户界面供用户通过网络\
  \ 或移动端访问 MongoDB。后端系统包含使用控制器或 `Mongo shell` 运行逻辑的服务器，它向 MongoDB 服务器通信查询。\n\n当客户端发出请求时，MongoDB\
  \ 服务器接收请求并将所有收到的请求转发给 MongoDB 存储引擎。MongoDB 服务器本身不直接向文件、磁盘或内存读写数据。将收到的请求传递给存储引擎后，存储引擎负责向文件或内存读写数据，它基本上负责管理数据。\n\
  \n# MongoDB 的特性\n\n以下是 MongoDB 的不同特性：\n\n*   **复制（Replication）**：副本集是两个或多个 MongoDB\
  \ 实例，用于提供高可用性。副本集由核心（主）和辅助服务器组成。主 MongoDB 服务器执行所有的查询和写入操作，而辅助副本保留信息的副本。如果主副本发生故障，则切换到辅助副本。\n\
  *   **可扩展性（Scalability）**：MongoDB 支持垂直扩展和水平扩展。垂直扩展通过向现有机器增加更多控制资源来实现，而水平扩展则通过向用户资源中添加更多机器来实现。\n\
  *   **负载调整（Load adjusting）**：MongoDB 在不需要单独的专用负载均衡器的情况下，通过垂直扩展或水平扩展处理负载调整。\n*  \
  \ **无模式（Schema-less）**：MongoDB 可以作为一种无模式的数据库，这意味着数据库可以在不需要蓝图的情况下管理信息。\n*   **文档（Document）**：MongoDB\
  \ 中的信息以键值对的记录形式存储，而不是行和列，与 SQL 数据库相比，这使得信息更加灵活。\n\n## MongoDB 的优势\n\nMongoDB 为应用带来了许多优势。以下是主要优点：\n\
  \n*   维护 MongoDB 数据库更便宜、更简单。\n*   MongoDB 具有灵活的数据分配、灵活的模型和自动恢复功能，有助于降低运营成本。\n* \
  \  它是开源的，对开发者来说成本更低。\n*   MongoDB 数据库使用的存储空间较小，因此数据存储和处理的每 GB 较低。\n*   它支持内置缓存，可以提高数据检索性能。\n\
  *   当需要更改数据模型和格式时，MongoDB 不会产生问题，也不会对现有应用程序产生任何影响。\n*   MongoDB 提供许多实用功能，使其成为一个易用的\
  \ NoSQL 数据库。\n\n## MongoDB 的劣势\n\n尽管 MongoDB 有一些有利的，但也存在一些缺点：\n\n*   **连续性（Continuity）**：通过程序化的故障转移机制，客户端在\
  \ MongoDB 集群内有一个或多个节点。发生故障时，另一个节点将自然启动并继续提供服务。这种切换保证了连续性，但存在延迟。\n*   **写入限制**：由于容量限制，MongoDB\
  \ 的单节点限制了信息的写入速度。\n*   **数据一致性**：MongoDB 作为 NoSQL 数据库，不像任何 SQL 数据库那样提供完全的引用完整性（例如具有有助于维护的外键约束）。\n\
