  -   [Node.js 调试技巧](https://stackify.com/node-js-debugging-tips/)\n\n# 第 14 章：构建与部署\n\
  \n## 引言\n在本章中，我们将学习构建（Build）与部署（Deployment）的核心概念。我们将探索如何创建自己的 `npm` 包并将其发布到 `NPM`\
  \ 注册表。在随后的章节中，我们将介绍更多关于 CI/CD 的，并对 DevOps 的各个方面以及用于部署的不同工具进行详细讨论。最后，我们将使用 Docker\
  \ 和 Kubernetes 创建并部署一个示例 Node.js 应用程序。\n\n## 结构\n本章将涵盖与构建和部署概念相关的以下主题，以及我们如何在 Node.js\
  \ 中使用这些功能：\n\n*   创建 NPM 包\n*   发布 NPM 包\n*   CI/CD 简介\n*   CI/CD 的关键要素\n*   CI/CD\
  \ 的重要性\n*   构建项目依赖项\n*   部署第一个 Node.js 服务器\n\n## 创建 NPM 包\nNode Package Manager（Node\
  \ 包管理器）是互联网上最大的开源注册表，被软件开发社区用于构建基于 Node 的系统。\n\n首先，开发者在本地系统上构建组件，然后将他们的 Node 应用包发布到\
  \ NPM 以与他人共享。通过这种创建 NPM 包的方式，大多数机构可以在内部或与外部世界共享代码。\n\n让我们学习如何创建一个 NPM 包并将其发布到 NPM，以便他人下载和使用。\n\
  \n## 初始化 Git 仓库\n创建一个名为 `npm_publish` 的新项目，并运行以下命令初始化 `Git` 仓库。\n\n```bash\nPS D:\\\
  Demo\\npm_publish> git init\n```\n\n这将创建一个空的 `Git` `repository`，用于将代码库链接到 `GitHub`\
  \ 仓库。\n\n```\nInitialized empty Git repository in D:/Demo/npm_publish/.git/\n```\n\
  \n## 初始化 NPM\n下一步是使用以下命令初始化我们的第一个 Node 应用程序。\n\n```bash\nPS D:\\Demo\\npm_publish>\
  \ npm init\n```\n\n此命令会创建一个包含以下信息的 `package.json` 文件。\n\n*   **package name**（包名）：包名必须是唯一的，应该全小写字母，并可以包含空格。\n\
  *   **version**（版本）：用于识别当前包的版本，默认值为 1.0.0。当我们更新包时，需要使用语义化版本系统更新版本。\n*   **description**（描述）：你可以在此处输入你的包的描述。告诉我们你的包是做什么的以及如何使用它。\n\
  *   **entry point**（入口）：用于编写代码和启动我们 Node 服务器的主应用程序文件。默认值为 `index.js`。\n*   **test**（测试）：用于运行为应用程序编写的单元测试用例。\n\
  *   **git-repository**（Git 仓库）：我们可以提供远程 GitHub 仓库的链接。\n*   **keywords**（关键词）：这有助于其他人在\
  \ NPM 注册表中搜索并找到我们的包。\n*   **author**（作者）：包发布者的名称。\n*   **license**（许可证）：任何特定的许可或专利信息，或使用默认许可（互联网系统联盟\
  \ (ISC) 许可证）。\n\n**输出：**\n\n```bash\nPS D:\\Demo\\npm_publish> npm init\nThis utility\
  \ will walk you through creating a package.json file.\nIt only covers the most common\
  \ items, and tries to guess sensible defaults.\nSee `npm help init` for definitive\
  \ documentation on these fields\nand exactly what they do.\nUse `npm install <pkg>`\
  \ afterwards to install a package and\nsave it as a dependency in the package.json\
  \ file.\nPress ^C at any time to quit.\npackage name: (npm_publish) demo-publish-first-package\n\
  version: (1.0.0)\ndescription: This is used to publish node application to NPM\n\
  entry point: (app.js)\ntest command:\ngit repository: https://github.com/rameshksh/demo-publish-first-package.git\n\
  keywords: NPM publish\nauthor: Ramesh\nlicense: (ISC)\n```\n\n## 创建第一个 NPM 包\n要创建一个基础\
  \ Node 应用程序，请向此 `index.js` 文件添加以下代码。\n\n```javascript\n// index.js\nfunction CustomMessage(){\n\
  return \"Hello my package\";\n}\nmodule.exports = CustomMessage;\n```\n\n我们已经创建了包，现在将在发布之前对其进行测试。我们还添加了一个包含所有必要信息的\
  \ `README.md` 文件。\n\n![14.1: Readme 文件](img/14.1_readme.jpg)\n\n## 测试 NPM 包\n为了测试我们的包，我们需要将模块定位到本地系统以便全局可用。这通常通过\
  \ `npm link` 命令完成。\n\n**注意**：`npm link` 的一个重要点是，如果对包进行了任何更改，这些更改将反映在项目中。\n\n`npm\
  \ link` 只创建两个符号链接：\n\n*   **全局符号链接**（Global symbolic link）：当你在模块根目录运行 `npm link`\
  \ 时，npm 会从全局 node_modules 目录链接本地目录。全局 node_modules 文件夹是存储通过 `npm install -g` 安装的所有模块的文件夹。\n\
  *   **本地符号链接**（Local symbolic link）：当你在项目目录运行 `npm link <module_name>` 时，npm 会从全局\
  \ node_modules 到本地 `node_modules` 文件夹创建一个符号链接。\n\n我们可以通过删除符号来撤销 `npm link` 的任何更改。但它有一个内置命令\
  \ *npm unlink*，可以移除链接关联。\n\n只需在项目目录运行 `npm unlink --save <module_name>` 即可移除本地符号链接，并在模块目录运行\
  \ npm unlink 移除全局符号链接。\n\n以下命令用于创建一个可以通过 `npm link` 命令帮助在其他模块中定位和使用的包。\n\n```bash\n\
  PS D:\\Demo\\npm_publish\\my-package> npm link\n```\n\n这将在范围内创建一个包。以下是 `npm link`\
  \ 命令的输出：\n\n\n\n\n让我们创建一个测试文件夹并创建一个 `script.js` 文件。\n\n```\n// test/script.js\n\
  ```\n\n```javascript\nconst msg = require('demo-publish-first-package')\nconsole.log(msg())\n\
  ```\n\n现在，我们将之前创建的包链接到此应用程序中。\n\n```bash\nPS D:\\Demo\\npm_publish\\test> npm link\
  \ demo-publish-first-package\n```\n\n一旦命令执行成功，我们将看到以下输出：\n\n```\nD:\\Demo\\npm_publish\\\
  test\\node_modules\\demo-publish-first-package -> C:\\Program Files\\nodejs\\node_modules\\\
  demo-publish-first-package -> D:\\Demo\\npm_publish\\my-package\nPS D:\\Demo\\npm_publish\\\
  test>\n```\n\n![](img/14.2_npm_link.jpg)\n\n**图 14.2:** 将 NPM 包链接到测试应用程序\n\n# 运行测试应用程序\n\
  \n在链接好包之后，我们现在可以运行应用程序来验证一切是否按预期工作。\n\n```bash\nPS D:\\Demo\\npm_publish\\test>\
  \ node script.js\n```\n\n**输出：**\n\n```\nPS D:\\Demo\\npm_publish\\test> node script.js\n\
  Hello word my first npm package\nPS D:\\Demo\\npm_publish\\test>\n```\n\n# 发布你的\
  \ NPM 包\n\n为了将我们新创建的包发布到 NPM，我们需要在 [`www.npmjs.com/`](https://www.npmjs.com/) 创建一个账户。\n\
  \n一旦创建账户，我们就可以登录并将包发布到 `npm` 注册表。\n\n```bash\nPS D:\\Demo\\npm_publish\\my-package>\
  \ npm login\n```\n\n**输出：**\n\n```bash\nPS D:\\Demo\\npm_publish\\my-package> npm\
  \ login\nUsername: rameshksh12\nPassword:\nEmail: (this IS public)\nnpm notice Please\
  \ check your email for a one-time password (OTP)\nEnter one-time password:\nLogged\
  \ in as ramesksh12 on https://registry.npmjs.org/.\nPS D:\\Demo\\npm_publish\\my-package>\n\
  ```\n\n一旦我们成功登录 NPM 注册表，就可以使用以下命令发布我们的包。\n\n```bash\nPS D:\\Demo\\npm_publish\\\
  my-package> npm publish\n```\n\n**输出：**\n\n![](img/14.3_npm_publish_output.jpg)\n\
  \n**图 14.3:** NPM publish 的输出\n\n我们现在可以在 NPM 注册表中搜索我们新发布的包。\n\n![](img/14.4.jpg)\n\
  \n**图 14.4:** 在 NPM 注册表中搜索包\n\n# 持续集成与持续交付简介\n\n在当今节奏快速的软件开发公司中，每个人都正尝试使软件开发工作流自动化，以帮助团队更频繁地发布功能。我们拥有一套定义良好的持续迭代流程，用于构建、测试和部署代码，从而在避免\
  \ Bug 和不损害软件质量的前提下，缩短软件的上市时间。\n\n## 定义持续集成 (CI)\n\n持续集成是一种尽早且更频繁地将代码更改集成到共享源代码仓库（如\
  \ GitHub、TFS 或 Bitbucket）的主分支或主分支的实践。一旦代码合并，流水线就会自动触发所有单元测试，对每项更改进行端到端测试，并在所有测试通过后自动运行构建。通过持续集成，可以在开发过程的早期更容易识别并纠正错误和安全问题。使用\
  \ CI，我们频繁合并更改，并减少多个开发者在同一模块上工作时发生代码冲突的概率。持续集成还有助于建立流水线，通过静态代码分析进行常见的代码验证过程，从而确保良好的代码质量。\n\
  \n# 定义持续交付 (CD)\n\n持续交付是一种软件开发实践，它使准备基础设施（如服务器、网络、安全）和发布应用程序的过程自动化一旦开发者完成产品功能的开发，它们将作为\
  \ CI 过程的一部分进行测试。CD 的工作是先准备环境，并打包任何时候需要部署到任何特定环境中的所有内容。CD 上的软件结构使其能够随时生成。然后，你可以手动开始部署，或者切换到持续部署（在后者中部署也是自动化的）。\n\
  \n## 定义持续部署 (CD)\n\n持续部署帮助组织或个人将应用程序自动部署到服务器上，无需任何人工干预。在持续部署中，DevOps 团队配置了预定的代码发布标准，一旦满足并验证了标准，代码就会自动部署到第一个低级环境（如\
  \ dev、test 或 stg）。一旦 QA 验证了构建，相同的代码库将自动推广到生产环境。通过持续部署，组织变得更加灵活，现在他们可以比以往任何时候都更快地将新功能部署到生产环境中供用户使用。\n\
  \n# 定义持续测试 (CT)\n\n持续测试是一种软件测试实践，一旦通过任何功能将新代码引入 Test/STG/PROD 环境，系统就会持续执行自动化测试。使用设置良好的\
  \ CI/CD 流水线，持续测试会自动触发，并运行一系列测试以确保应用程序在引入新更改后仍能按预期工作。这通常有助于在开发过程的早期识别问题。\n\n在持续测试中，以下是关键测试策略：\n\
  \n- **单元测试**：用于验证代码单元是否符合预期的系统设计。\n- **集成测试**：检查应用程序的不同模块或服务在耦合在一个平台内时如何协同工作。\n\
  - **回归测试**：用于验证任何修复的问题在进行新的代码更改后不会再次出现。\n\n## CI/CD 的关键要素\n\nCI/CD 包含八个基础要素，有助于确保软件开发生命周期中的最大效率。将这些基础知识融入我们的流程，以改进整个\
  \ DevOps 工作流和软件。\n\n这些包括核心元素：\n\n- **单一源仓库**：源代码控制（SCM）包含了构建所需的所有文件和脚本，这是至关重要的。存档必须包含构建所需的所有内容。这包括源代码、数据库结构、库、专有文件和版本控制。它还应该包含脚本和构建应用程序的脚本。\n\
  - **定期提交**：我们应该尽早且频繁地将代码提交到主干、主分支——即主干开发。避免低分支并仅在主分支上工作。使用小型代码段并尽可能频繁分叉。不要一次合并多个更改。\n\
  - **自动化构建**：脚本应包含通过一个命令构建的所有内容。这包括 Web 服务器文件、数据库脚本和应用程序软件。CI 过程会自动打包代码将其编译成可用的应用程序。自测试结构\
  \ CI/CD 需要持续测试。\n- **测试脚本**：我们的测试脚本必须确保测试失败会导致构建失败。使用静态构建前测试脚本来验证代码的完整性、质量安全性。允许构建通过测试的代码。\n\
  - **重复操作**：仓库中的多次提交可以减少冲突的藏身之处。与其进行巨大的更改，不如进行小的重复操作。这样做在出现问题或冲突时可以很容易撤销更改。\n- **稳定的测试环境**\n\
  \n\n\n\n我们应该始终在生产环境的克隆版本（如 `test/stage`）中进行代码测试。绝对不要在实时生产环境中测试新代码。创建一个与真实环境尽可能接近的克隆环境。使用严谨的测试脚本来识别那些通过了初始预览测试过程的漏洞。\n\
  \n### 最大可见性\n每位开发者都应该能够访问最新的可执行文件，并看到存储库发生的所有更改。数据库中的信息对所有人可见。使用版本控制来管理更改，以便开发者了解最新版本的运行情况。最大可见性意味着所有人都可以监控进度并识别潜在问题。\n\
  \n### 随时进行预测性部署\n部署应该是常规化且低风险的，让团队在任何时候都放心进行部署。CI/CD 测试和验证过程必须严谨且可靠，让团队有信心随时发布更新。针对较小更改的重复部署风险较低，并且可以轻松回滚。\n\
  \n# CI/CD 的重要性\n以下是在其软件开发生命周期（SDLC）中实施 CI/CD 的组织所获得的一些关键益处。\n\n* **更快乐的用户和客户：**\
  \ 进入生产环境的错误更少，因此您的用户和客户将获得更好的用户体验。这增加了客户满意度，提高了客户信任，并提升了组织的形象。\n* **加速时间：** 当您可以随时部署时，就能更快地将产品和新功能推向市场。开发成本降低，更快的进展让您的团队能够处理其他工作。客户获得结果更快，为您的业务带来竞争优势。\n\
  * **更少的“火警演”：** 更频繁地、更小批量地在开发更早阶段测试代码，可以显著减少火警演。这带来了更顺畅的开发周期并减轻了团队压力。结果更具预测性，错误更容易被发现和修正。\n\
  * **设定合理的日期：** 通过将故事和任务分解为更小的部分，更容易按时管理每个步骤并跟踪进度。这种方法留了足够的时间来监控进度并精确定义完成日期。小任务有助于消除瓶颈以及围绕交付日期的大部分不确定性。\n\
  * **提高生产力：** 随着工作的自动化，团队将变得更加高效，并有助于项目的成功交付。据估计，开发者花费 35-50% 的时间来测试、验证和调试代码。通过自动化其中的一些过程，开发者提高了他们的生产力。\n\
  * **更少的上下文切换：** 当开发者获得更好的代码反馈时，每位开发者都可以专注于一个任务。通过以小的、可测试的工作块进行工作，开发者可以快速执行多任务处理，但为了提高生产力，应避免这样做。\n\
  * **减少倦怠：** CI/CD 可以显著减少发布问题并提高团队的跨功能交付。这提升了开发者的整体幸福感和健康，减少了由许多手动步骤和干预引起的倦怠。\n*\
  \ **更快的恢复：** CI/CD 通过轻松识别和解决问题加速了问题的解决和灾难恢复。CI/CD 帮助软件更频繁地更新，使得在漏洞出现时更容易发现并可以快速修复。如果系统崩溃，CI/CD\
  \ 帮助自动恢复。\n\n# 部署服务\n在准备部署 Node.js 应用时，有很多方法可以实现。这些部署服务分为四大类：\n\n* 基础设施即服务 (IaaS)\n\
  * 后端即服务 (BaaS)\n* 传统部署\n* 平台即服务 (PaaS)\n\n通常，部署涉及打包 Node.js 应用并配置其配置文件。一旦完成，您就可以确认该过程，`Command\
  \ Prompt` 将运行它。\n\n市场上上有多种可用的部署服务，但寻找良好的服务取决于各种业务需求，最重要的是您是想要免费服务还是付费服务。以下是用于部署\
  \ Node.js 应用的一些部署服务提供商。\n\n* **Heroku：** 一个免费服务，最初是一个 Ruby 部署平台，后来扩展到 PHP 和 Python\
  \ 等其他语言。\n* **Azure DevOps：** Azure DevOps 是微软在其云平台上提供的软件即服务 (SaaS) 产品。Azure DevOps\
  \ 通过自动化应用程序开发、部署和测试来减少人工投入。通过来自 `AzureDevOps` 的某些服务，我们可以快速高效地将应用程序部署到任何低级环境或生产环境。过去，Azure\
  \ DevOps 也被称为微软的 Visual Studio Team Services (VSTS)，作为存储代码和执行所有构建及部署操作的共享资源。\n*\
  \ **Docker：** Docker 是一个开放平台，用于在不同环境容器开发、部署和管理应用程序。每个 `docker container` 都可以使用编译好的\
  \ `docker images` 独立运行，镜像包含了使用给定基础设施运行应用程序所需的所有内容。Docker 加快代码交付、测试和部署，缩短了从编写代码到部署到环境之间的总时间。我们将在后续章节中详细介绍\
  \ Docker。\n* **Kubernetes：** Kubernetes 是一个可移植、可扩展的开源平台，用于管理工作负载和服务，它促进了信息的配置和自动化。这是一个大型且快速发展的生态系统。提供各种\
  \ Kubernetes 服务、支持和工具。我们将在后续章节中详细介绍 Kubernetes。\n\n## 部署流水线\n部署流水线主要用于 DevOps 团队背景。它定义了一个自动化且流化的过程，用于在代码从开发环境到生产环境发生更改后促进\
  \ CI/CD。\n\n部署流水线的主要目标是确保软件发布是高效、可靠且质量一致的。部署流水线由自动化步骤组成，代码更改在生产部署之前必须经过这些步骤。这些步骤通常包括代码构建、自动化测试以及部署到\
  \ staging（测试）和生产等不同环境。每个步骤的设计旨在确保代码质量和功能，在此过程中发现任何问题都会在移动到下一个步骤之前解决。\n\n# 流水线部署的优势\n\
  执行良好的部署流水线的主要益处如下：\n\n* 它通过自动化和加速软件交付过程，使新功能和错误修复能够更快地上市。流水线能够更早地发现和解决缺陷，减少了调优错误和昂贵退货的风险。\n\
  * 它促进了开发、测试和运维团队之间的协作，培养了共同责任和持续改进的文化。\n* 自动化过程减少了手动操作，并实现了更快、更频繁的发布，加快了新功能和错误修复的上市时间。每个阶段的测试自动化确保漏洞和问题在开发早期被发现，最小化了修复它们的成本和精力。\n\
  * 流水线确保跨环境的一致性，减少了可能导致开发、测试和生产环境之间差异的配置错误。\n* 持续集成和自动化安全检查确保代码在部署之前符合安全和合规标准。\n\n\
  # 部署流水线的关键组件\n\n\n\n\n以下是 DevOps 团队使用的任何部署流水线的关键组件：\n\n### 版本控制系统 (VCS)\nVCS 是一个用于跟踪和管理开发者所代码更改的仓库。这允许多个开发人员和团队进行协作，并开发跨团队依赖的功能。市面上流行的\
  \ VCS 选项包括 `Git`、`SVN` 和 `Mercurial`。\n\n### 构建服务器\n这些服务器负责自动构建和安装驱动 VCS 更改的代码。第一步包括从仓库拉取代码并将其转换为可以在组织内或社区外进行测试和分发的制品。`Jenkins`、`TeamCity`、`GitLab\
  \ CI/CD` 和 `Travis CI` 等流行工具常被用于构建服务器。\n\n### 自动化测试\n自动化测试执行各种类型的测试，如硬件测试、集成测试、功能测试和单元测试，以确保发布经过测试的稳定代码到任何环境中。自动化测试有助于在开发过程中早期发现错误，并降低产品开发的整体成本。\n\
  \n### 制品存储\n制品由构建服务器创建，代表已编译并准备好发布到任何特定环境的代码。制品仓库确保了在 UAT（用户验收测试）和生产环境中一致且可靠的交付。我们使用此存储对不同版本的制品进行备份和恢复。如果在当前构建制品中发现任何严重问题，我们可以轻松部署上一个生产构建。\n\
  \n### 部署自动化\n我们应该有一个简单的流程，将应用程序部署到我们的环境中。这可以通过设置自动化部署脚本和配置管理工具轻松实现，以确保部署过程的一致性。组织在使用\
  \ `Azure DevOps` 等 CI/CD 工具时，可以减少许多人工错误并保持高水平的交付。\n\n# 部署流水线阶段\n我们将解释部署流水线的主要阶段及其在软件开发过程中的重要性。\n\
  \n### 接入阶段 (Engagement stage)\n部署流水线始于提交阶段，阶段由版本控制系统 (VCS) 中的代码提交触发。在这一步中，代码更改从\
  \ VCS 获取，构建服务器通过执行必要的预构建步骤自动编译代码。然后，代码将通过静态代码分析，以识别潜在问题，如违反编码标准或安全漏洞。一旦代码通过这些初始检查，就会创建构建制品，这作为后续步骤的基础。\n\
  \n### 自动测试阶段 (Automatic test phase)\n在绑定阶段成功构建并创建制品后，下一步涉及自动化测试。在此阶段，将执行各种测试以确保代码的功能性、可靠性和性能。首先执行单元测试，以验证单个代码组件，然后是集成测试，以检查不同组件或模块之间的交互。功能测试则从终端用户的角度检查应用程序是否按预期工作。\n\
  \n### 实现阶段 (Stage of implementation)\n当代码更改通过自动化测试阶段后，应用程序将部署到预发布环境（Staging environment）。预发布环境类似于生产环境，允许在模拟真实使用的条件下进行彻底测试。这一步在应用程序移动到生产环境之前提供了最后的检查。\n\
  \n### 生产启动 (Start of production)\n部署流水线的最后阶段是在测试通过所有之前阶段且团队已获得组织内更高权限的批准后，将代码部署到生产环境。为了降低风险，组织通常使用部署策略，如金丝雀发布\
  \ (`Canary releases`)、蓝绿部署 (`blue-green deployments`) 或引入回滚机制，以管理发布过程并在出现潜在问题时轻松回滚。持续监控生产环境也是必须的，以确保应用程序的稳定性和性能。\n\
  \n# 流水线工具介绍\n有多种流行的部署流水线工具可以帮助自动化和编排软件交付过程。这些工具有助于定义持续集成、持续部署和持续交付流水线，确保顺畅高效的开发工作流。\n\
  \n以下是一些更常用的流水线工具。\n\n### Jenkins\nJenkins 丰富的插件生态系统允许与不同工具进行自定义和集成，提高了其对不同开发环境的适应性。将\
  \ `Jenkins` 与 `BrowserStack` 集成既简单又令人深刻。\n\n### GitLab CI/CD\nGitLab CI/CD 在 `GitLab`\
  \ 平台上实现软件集成、测试和部署自动化，简化了开发。\n\n### BrowserStack\nBrowserStack 提供与 `GitLab` 的无缝集成，便于高效的浏览器和设备兼容性测试。\n\
  \n### Travis CI\nTravis CI 专注于自动化构建、测试和部署工作流，以确保持续集成和交付。\n\n### CircleCI\n它是软件开发领域一种强大的自动化工具。它擅长自动化构建、测试和部署过程，为无缝的持续集成和交付环境做出贡献。\n\
  \n### GitHub Actions\n它是自动化软件工作流的强大力量。其核心优势在于自动化构建、测试和部署活动，为持续集成和交付创建了无缝的生态系统。\n\
  \n### Azure DevOps\nAzure DevOps 用于自动化应用程序开发、部署和测试。通过 `AzureDevOps` 的某些服务，我们可以快速高效地将应用程序部署到任何低级或实时环境。\n\
  \n# 使用 Docker 部署 Node.js \nDocker 提供了一个平台和一组工具，我们可以使用它们在一个名为 `container`（容器）的松散环境中封装并运行应用程序。容器是轻级的，包含了运行应用程序所需的所有内容，因此你不需要依赖宿主机操作系统的配置（如软件依赖）。Docker\
  \ 具有良好的隔离性和安全性，允许我们在同一主机上同时运行多个容器。我们可以共享容器，以确保容器在何处部署时工作方式都是相同的。\n\n当我们完成编码和测试后，将应用程序作为容器或编排服务部署到生产环境。它在本地数据中心、云提供商或两者的结合等环境中的工作方式是相同的。\n\
  \n### 前提条件\n在继续下一节之前，您的系统应应了以下组件：\n\n**Docker 版本** - `20.10.14`，构建 `a224086` (`docker\
  \ -v`)。\n\n**Node.js** - `v16.14.2`。\n\n**Npm** - `v8.6.0`。\n\n\n\n\n## 图 14.5：示例\
  \ Docker 文件\n\n任何以 `#` 开头的行都是注释（解析器命令除外），其他行必须包含特定的命令及其参数。虽然命令名称不区分大小写，但通常使用大写字母将它们与参数区分来。\n\
  \nDocker 文件中的第一行（未注释行）应该指定用作自定义镜像基础的基础镜像。后续命令将在基础镜像上执行，每个连续命令的输出都会在最终镜像构建之前为该镜像添加另一个层，最后构建镜像并将其标识符（ID）打印到控制台。\n\
  \n为你的应用程序创建一个 Docker 文件，并使用以下命令在文本编辑器中打开它：\n\n```dockerfile\n# 使用 Node 16 alpine\
  \ 作为父镜像\nFROM node:16-alpine\n\n# 将 Docker 镜像的工作目录更改为 /app\nWORKDIR /app\n\n# 将\
  \ package.json 和 package-lock.json 拷贝到 /app 目录\nCOPY package.json package-lock.json\
  \ ./\n\n## 安装依赖\nRUN npm install\n\n# 将项目其余文件拷贝到此镜像\nCOPY . .\n\n# 暴露应用端口\nEXPOSE\
  \ 3000\n\n# 启动应用程序\nCMD npm start\n```\n\n让我们详细了解 DockerFile 内部每一行的含义。\n\n### FROM\
  \ node:16-alpine\nDocker 文件中的第一条指令涉及选择基础镜像，它是 v16.x 版本的官方 Node.js Alpine Linux 镜像。\n\
  \n### WORK DIRECTOR. /app\n`WORKDIR` 命令指定 Docker 镜像中该文件中所有后续 `RUN`、`CMD`、`ENTRYPOINT`、`COPY`\
  \ 或 `ADD` 命令所在的工作目录。如果该文件夹不存在，则将创建它。# 将 package.json 和 package-lock.json 拷贝到 /app\
  \ 文件夹\n\n### COPY package.json package-lock.json .\n此 `COPY` 命令将来自机器项目目录的 `package.json`\
  \ 和 `package-lock.json` 文件拷贝到当前工作目录的容器文件系统中，根据之前的 `WORKDIR` 语句，该目录为 `/app`。\n\n\
  ### RUN npm install\n此时，将在 Docker 镜像文件系统的 `/app` 目录下运行 `npm install` 命令。由于它包含了 `package.json`\
  \ 和 `package-lock.json` 文件，它将利用这两个文件中的信息从 NPM 注册表下载所有依赖项。\n\n### COPY. .\n在项目和依赖项安装完成后，再次使用\
  \ `COPY` 命令将剩余的项目文件拷贝到 Docker 镜像文件系统中的 `/app` 目录。\n\n### EXPOSE 3000\n接下来，`EXPOSE`\
  \ 命令告诉 Docker 我们的应用程序将在运行时监听 3000 端口。在这里你可以使用 TCP 或 UDP 协议（例如 `3000/tcp` 或 `3000/udp`），尽管如果没有指定协议，默认为\
  \ TCP。\n\n### CMD npm starts\n最后，使用 `CMD` 命令通过运行 `package.json` 文件中定义的启动脚本来启动应用程序。该命令在基于此\
  \ Docker 镜像的容器启动时执行。此时，我们已经定义了为项目创建 Docker 镜像的所有必要指令。\n\n# 构建 Docker 镜像\n`docker\
  \ build` 命令用于从 Docker 文件创建 Docker 镜像。\n\n从项目根目录运行以下命令创建 Docker 镜像：\n\n```bash\n\
  PS D:\\Demo> docker build . -t demoapp\n```\n\n**输出：**\n```\n. . Successfully built\
  \ cd4bdd2ae572\nSuccessfully coded by demoapp:latest\n```\n\n前面的命令使用当前目录下的 Docker\
  \ 文件创建一个 Docker 镜像。该标志（flag）用于为新镜像指定标签名称，以便以后作为 `demoapp:latest` 引用。\n\n# 将 Docker\
  \ 镜像作为容器运行\n在上一节中，我们创建了一个包含 Node.js 项目的 Docker 镜像。现在我们可以在 Docker 容器中运行镜像并测试应用程序是否运行正常。在运行以下命令之前，请确保关闭所有正在运行的应用实例：\n\
  \n```bash\nPS D:\\Demo> docker compose up --build\n```\n\n**输出：**\n```\ndemoapp\
  \ server started on port:3000\n```\n\n当容器中运行 Docker 镜像时，它会创建一个典型的操作系统进程，并具有与主机独立的的文件系统、网络和进程树。虽然我们在第\
  \ 2 步中使用了 `EXPOSE` 命令显示容器中的应用程序正在监听 3000 端口，但此命令并不会让从主机访问该容器和端口。它只是确保运行在同一主机上的另一个\
  \ Docker 容器可以访问运行在指定端口上的应用程序。\n\n要让主机可以使用容器端口，你必须使用 `--publish 或 -p` 标志进行发布。这允许你将容器和端口映射到对应的主机端口。\n\
  \n例如，在之前的命令中，主机的 3000 端口连接到容器的 3000 端口，因此所有到 `http://localhost:3000` 的请求都会转发到监听\
  \ Docker 容器 3000 端口的应用程序。\n\n尝试在浏览器中打开 `http://localhost:3000`。你应该能观察到演示应用正如常运行。\n\
  \n## Kubernetes 简介\nKubernetes 是一个用于在私有、公共和混合云环境中管理 Linux 容器的开源平台。许多 DevOps 团队使用\
  \ Kubernetes 管理它们的微服务架构，其中每个微服务都封装在一个或多个容器中。Kubernetes 还支持 GitOps 开发模型，对 Kubernetes\
  \ 集群的所有更改都是完全自动化并在源码控制中进行管理的。\n\n应用程序开发者、IT 管理员和 DevOps 工程师使用 Kubernetes 自动部署、扩展、维护、调度和管理节点上的多个容器。Kubernetes\
  \ 允许你创建一组运行 Linux 容器的主机。\n\nKubernetes 环境被称为**集群 (cluster)**。它包含一个或多个**节点 (node)**。\n\
  \n**节点**仅仅是运行容器的机器。它可以是物理硬件也可以是虚拟机。除了节点，集群还有一个**控制平面 (control plane)**。管理层协调整个集群的工作。它调度新容器并提供你可以通信的\
  \ API 服务器。集群可以运行多个控制平面实例以创建更灵活、高可用的配置。\n\n## Kubernetes 核心组件\n以下是 Kubernetes 的核心组件：\n\
  \n*   **kube-apiserver**\n    这是运行 API 服务器的控制平面组件。它是与 Kubernetes 集群通信的唯一方式。你可以使用\
  \ `kubectl` CLI 或 HTTP 客户端向 API 服务器发布命令。\n\n*   **kube-controller-manager**\n  \
  \  控制器管理器启动并运行 Kubernetes 内置控制器。控制器是在发生变化后采取行动事件循环。它们根据 API 请求或负载增加等事件创建、扩展和删除对象。\n\
  \n*   **kube-scheduler**\n    调度器将新的文件夹（容器）分配到集群节点。它确定哪些节点满足 Pod 要求，然后选择最佳位置以最大化性能和可靠性。\n\
  \n*   **kubelet**\n    `kubelet` 是在每个节点上的工作进程。它与 Kubernetes 控制引擎通信以接收指令。`kubelet`\
  \ 负责拉取并根据调度请求启动容器。\n\n*   **kube-proxy**\n    代理是位于节点上的另一个组件。它配置主机的网络系统，以便流量到达集群服务。\n\
  \n*   **kubectl**\n\n\n\n\n这是 Kubernetes 运行环境中最重要的部分。需要此 CLI 来与集群及其对象进行交互。集群配置完成后，我们还可以安装官方仪表板（dashboard），通过图形界面管理\
  \ Kubernetes。\n\n## Kubernetes 部署与服务背景\n\nKubernetes 部署（Deployment）和服务（Service）是当我们把容器应用程序部署到\
  \ Kubernetes 集群时创建的 Kubernetes 对象。编写 Kubernetes 部署和服务文件的常用方式是使用 `YAML` 格式。该文件包含了容器应用程序的所有设置。Kubernetes\
  \ 执行这些 yaml 文件，并使用它们在 Kubernetes 上安装应用程序。\n\n`Kubernetes deployment` 定义了容器化应用程序的目录和资源。\n\
  \n`pod` 是 Kubernetes 集群中最小的可部署单元，它在 Kubernetes 集群中持有一个容器化应用程序。它还指定了构建容器化应用程序的 Docker\
  \ 镜像。\n\n`Kubernetes service` 描述了我们如何暴露运行在 pod 中的 Kubernetes 安装。我们可以决定应用程序仅运行在 Kubernetes\
  \ 集群内部，还是运行在集群外部。Kubernetes 为 pod 分配内部或外部 IP 地址。这取决于 `Service.yaml` 文件中描述的 Kubernetes\
  \ 服务类型。\n\n# 将 Node.js 部署到 Kubernetes 集群\n\n要将 Node.js 应用程序部署到 Docker 或 Kubernetes，我们必须首先创建一个容器镜像。这通常是通过从现有镜像开始并根据需要添加额外的功能层来实现。在构建\
  \ Node.js 应用程序时，社区提供了几个官方 Docker 示例来帮助你上手。这些镜像在现有 Linux 发行版（通常是 Debian 或 Alpine）之上包含了\
  \ Node.js 二进制文件。你可以从这些官方镜像开始，并将你的应用作为额外的层。\n\n## 选择你的镜像\n\n官方 Node.js 镜像三种。\n\n\
  * `基于 Debian 的完整镜像` - 包含构建和测试 Node.js 应用程序所需的所有核心组件。\n* `基于 Debian 的瘦镜像` - 仅包含运行预构建的\
  \ Node.js 应用程序所需的最小包。\n* `基于 Alpine 的镜像` - 确保最小的容器大小。\n\n## 配置 Dockerfile\n\n从基础镜像开始，你使用\
  \ Dockerfile 创建包含应用程序的自定义镜像。\n\n以下是最简单的 Dockerfile，它将你的 Node.js 应用程序 (`app.js`）复制到官方\
  \ Node.js 容器镜像中。\n\n```\nFROM node: 18-alpine\nCopy app.js.\nEXPOSE 3000\nCMD node\
  \ app.js\n```\n\n## 创建镜像\n\n要从 Dockerfile 创建镜像，请将该文件放在包含应用程序代码的目录并运行以下命令：\n\n```\n\
  docker build -t myImage:new\n```\n\n这会创建一个名为 `myImage` 的 Docker 镜像，其新标题基于当前目录的内容。\n\
  \n## 将镜像推送到注册仓库\n\n为了让 Kubernetes 使用此镜像，你必须将其发布到 Docker Hub 仓库。然后你可以在 Docker 或 Kubernetes\
  \ 上运行并测试你的应用程序。\n\n在终端运行以下命令：\n\n```\nPS D:\\Demo>docker login\nPS D:\\Demo>docker\
  \ push myImage\n```\n\n在 Kubernetes YAML 文件中，我们为 Docker 镜像定义 Docker Hub 仓库。Kubernetes\
  \ 从该仓库获取 Docker 镜像并在 Kubernetes 集群上创建容器应用程序。\n\n下一步是启动 `Minikube` Kubernetes 集群。\n\
  \n## 启动 MiniKube Kubernetes 集群\n\n启动 Minikube Kubernetes 集群，我们需要运行以下命令：\n\n```\n\
  PS D:\\Demo>minikube config set driver docker\nPS D:\\Demo>minikube start\n```\n\
  \n将在本地系统上创建并启动 MiniKube 集群。\n\n## 使用 YAML 文件进行 Kubernetes 部署\n\n部署 Kubernetes 应用程序的标准方法是通过部署对象，可以通过向\
  \ `deployment.yaml` 文件添加以下代码来创建。\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\n\
  metadata:\n  name: simple-app-deployment\nspec:\n  replicas: 2\n  selector:\n  \
  \  matchLabels:\n      app: simple-app\n  template:\n    metadata:\n      labels:\n\
  \        app: simple-app\n    spec:\n      containers:\n      - name: simple-app\n\
  \        image: myImage\n        resources:\n          limits:\n            memory:\
  \ \"256Mi\"\n            cpu: \"500m\"\n        ports:\n          - containerPort:\
  \ 3000\n```\n\n该 YAML 文件创建一个名为 `simple application deployment` 的 Kubernetes 部署：\n\
  \n* 这 Kubernetes 集群中创建 2 个副本或 pod。应用程序以两种方式工作。\n* 它从 Docker Hub 仓库拉取 `myImage` 镜像。\n\
  * 在 Kubernetes 集群中创建一个名为 `simple application` 的容器应用程序。\n* 它还为运行目录设置了资源限制。容器运行在端口\
  \ `3000` 上。\n\n一旦准备好此 YAML，你就可以运行此命令来创建你的 Kubernetes 集群部署：\n\n```\nkubectl apply\
  \ -f deployment.yaml\n```\n\n要获取 Kubernetes 部署，运行以下命令：\n\n```\nPS D:\\Demo>kubectl\
  \ get deployment\n```\n\n要获取 Kubernetes 服务，运行以下命令：\n\n```\nPS D:\\Demo>kubectl get\
  \ service\n```\n\n要启动应用程序，运行以下命令：\n\n```\nPS D:\\Demo>minikube service simple-app-service\n\
  ```\n\n这将启动 Minikube 隧道并为 pod 分配唯一的外部 IP 地址。我们可以使用此外部 IP 地址访问我们的应用程序。\n\n**注意**：某些\
  \ Kubernetes 概念超出了本书的范围。\n\n## 结论\n\n在本章中，我们涵盖了与 Node.js 应用程序构建和部署相关的一些概念。CI/CD\
  \ 已成为任何 DevOps 团队的重要部分，大多数组织都在遵循最新技术来部署其应用程序并维护基础设施。随着我们向云端迁移，CI/CD 设置的大部分复杂性已由\
  \ AWS、Azure 等云提供商处理。我们还简要涵盖了 Docker 和 Kubernetes 的基本概念，这些已成为容器化应用程序的流行方式。\n\n在最后一章节中，我们将分享由于本书范围限制未涵盖的高级主题的深入见解。\n\
