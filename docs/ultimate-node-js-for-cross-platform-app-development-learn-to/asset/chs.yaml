  \ 数据库创建成功\n\n现在，我们将尝试通过调用以下产品 API 来获取产品列表：\n\n\n\n\n存在一个或多个用户可以通过托管在 `example.com`\
  \ 上的公共聊天程序彼此连接。第一个用户向服务器发送请求以打开一个 WebSocket 连接，从而创建一个用于一对一通信的实时通道。服务器随后将该连接重定向到\
  \ `ws1.example.com`，该地址将用于两个用户之间的进一步通信。一旦所有通信完成，WebSocket 将关闭，直到建立新的连接为止。\n\n##\
  \ WebSocket 的用法\n\nWebSocket 协议主要用于构建一种需要在不同伙伴之间进行实时通信的解决方案。WebSockets 在多个设备或进程之间建立\
  \ TCP 套接字连接。\n\n以下是使用 WebSocket 的一些用例：\n\n* 聊天程序\n* 股票价格更新\n* 地图上的实时位置跟踪\n* 与观众的实时互动\n\
  * 在线拍卖\n* IoT 设备的更新\n* 如 Google Docs、Jira、Confluence 等类的在线协作工具。\n\n## WebSocket\
  \ 的优势\n\n以下是使用 WebSocket 的一些主要优势：\n\n* 我们可以使用 WebSocket 轻松构建实时应用程序。\n* 与 HTTP 协议相比，使用\
  \ WebSocket 创建的通道更安全。\n* WebSocket 非常适用于需要低延迟频繁双向通信的用例。\n* 需要频繁或大规模通信的应用程序。\n\n\
  ## WebSocket 的劣势\n\n以下是使用 WebSocket 的一些主要劣势：\n\n* 与流行的 HTTP 协议相比，WebSocket 不能无处使用。\n\
  * WebSocket 的实现可能会让应用程序架构变得复杂，特别是在服务器端。\n\n## WebSocket 与 HTTP\n\nHTTP 和 WebSocket\
  \ 都广泛用于构建通信应用。让我们比较两者并理解它们的主要区别：\n\n| WebSocket | HTTP |\n| :--- | :--- |\n| WebSocket\
  \ 是一种帧化的双双向协议 | HTTP 是一种工作在 TCP 之上的单向协议 |\n| WebSocket 协议可以支持持续数据传输 | HTTP 是无状态的\
  \ |\n| 它们主要用于实时应用程序开发 | HTTP 用于开发 RESTful 和 SOAP 应用程序 |\n| 所有通信发生在两端，使其成为更快的协议 |\
  \ 在 HTTP 中，连接在另一端建立，这使得它比 WebSocket 慢 |\n| WebSocket 使用单个 TCP 连接并要求由一方终止连接 | HTTP\
  \ 必须为不同的请求创建单独的连接 |\n| 连接保持激活状态直到发生变化 | 一旦请求完成，连接就会自动断开 |\n\n**表 10.1：** WebSocket\
  \ 和 HTTP 协议之间的区别。\n\n## 建立 WebSocket 连接\n\nWebSocket 不使用 `http://` 或 `https://`\
  \ 协议。相反，WebSocket URI 使用新的 `ws` 或 `wss`（用于安全 WebSocket）。URI 的其余部分遵循与 HTTP URI 相同的模式，即：主机名、端口、路径和任何请求参数。\n\
  \n`“ws:” “//” host [ “:” port ] path [ “?” inquiry]`\n`“wss:” “//” host [ “:” port\
  \ ] path [ “?” inquiry]`\n\nWebSocket 连接只能通过遵循上述模式的 URI 建立。这意味着当您看到模式为 `ws://`（或\
  \ `wss://`）的 URI 时，客户端和服务器**必须**遵循 WebSocket 连接协议以符合 WebSocket 规范。\n\n此模型假设服务器和客户端遵循标准的\
  \ WebSocket 连接协议。建立 WebSocket 连接始于一个 HTTP 更新请求，该请求包含许多头部，例如 `Connection: Update`、`Update:\
  \ WebSocket`、`Sec-WebSocket-Key` 等。\n\nWebSocket 连接是通过更新 HTTP 请求/响应对来建立的。\n\n支持\
  \ WebSocket 并想要建立连接的客户端会发送包含以下强制性标头的 HTTP 请求：\n\n* **Connection**：连接头部指定在事务结束后网络连接是否保持开启。该标头的常见值为\
  \ `keep-alive`，以确保连接的持久性，以便向同一服务器发送后续请求。在 WebSocket 开启握手期间，我们设置 `Upgrade` 头部以表示我们想要保持连接并将其用于非\
  \ HTTP 请求。\n* **Update**：客户端使用 `Update` 头部与服务器建立 WebSocket 连接。\n* **Sec-WebSocket-Key**：`Sec-WebSocket-Key`\
  \ 是由客户端生成的 16 字节 base64 编码随机值。\n* **Sec-WebSocket-Version**：这指定了所接受的 WebSocket 协议的默认版本，目前接受版本\
  \ 13。\n\n以下是客户端向服务器发送的 WebSocket 请求示例：\n\n```\nGET ws://example.com:8181/ HTTP/1.1\n\
  Host: localhost:8181\nConnection: Refresh\nRule: No cache\nCache Management: No\
  \ cache\nUpdate: Online crack\nSec-WebSocket Version: 13\nSec-WebSocket-Key: r53kcU32uC66gDdTuKASOvm\n\
  ```\n\n当客户端发送第一个请求来打开 WebSocket 连接时，它会等待服务器的响应。响应必须包含一个 HTTP 101 切换协议响应码。HTTP 101\
  \ 协议切换响应表示服务器正在切换到客户端在更新请求头部中请求的协议。此外，服务器必须具有以下 HTTP 头部：\n\n```\nHTTP/1.1 101 Switching\
  \ Protocols\nUpdate: websocket\nConnection: upgrade\nSec-WebSocket-Key: r53kcU32uC66gDdTuKASOvm\n\
  ```\n\n## WebSocket 协议\n\nWebSocket 协议是一种包含各种组件的框架类型。它还应用了帧类型、数据部分和负载长度来确保正常运行。要详细了解\
  \ WebSocket 协议，了解其构建模块至关重要。\n\n主要部分如下：\n\n* **Fin Bit**：WebSocket 的核心。在您连接时自动创建。\n\
  * **RSV1, RSV2 和 RSV3**：用于额外选项的保留位。\n* **Opcode**：每帧的一部分，用于解释特定帧的有效数据的处理方式。常见的操作码有\
  \ `0x00`、`0x1`、`0x2`、`0x0a`、`0x08` 等。\n\n| Opcode 值 | 描述 |\n| :--- | :--- |\n| 0x00\
  \ | 此帧继续前一帧的负载 |\n| 0x01 | 文本帧。服务器将文本帧解码为 UTF-8 编码 |\n| 0x02 | 二进制。服务器不修改地传输二进制帧\
  \ |\n| 0x03-0x07 | 为未来保留 |\n| 0x08 | 表示客户端想要断开连接 |\n| 0x09 | Ping 帧。作为心跳机制以确保连接仍然存。接收方必须响应\
  \ pong |\n| 0x0a | Pong 帧。此帧确保连接存活，并始终对 Ping 帧做出响应 |\n| 0x0b-0x0f | 为未来保留 |\n\n\
  **表 10.2：** OpCode 列表。\n\n\n\n\n\n*   当一个位为 1 时，掩码位被激活。WebSocket 要求所有负载数据必须使用客户端选择的随机密钥。掩码密钥配合负载数据在异或操作中帮助划分负载数据。这对于应用\
  \ API 安全非常重要，因为混淆可以防止缓存误解或缓存投毒。\n\n现在，让我们详细了解它的主要部分：\n\n### 负载长度\n它用于编码 WebSocket\
  \ 负载的总数据长度。当编码后的数据长度小于 126 字节时，会显示负载长度。如果负载长度超过 126 字节，则使用额外的字段来描述负载长度。\n\n### 掩码密钥\n\
  客户端发送到服务器的每一帧使用 32 位的值进行掩码。当掩码位为 1 时，显示掩码密钥。当掩码位为 0 时，掩码密钥为零。\n\n### 有用数据\n任意应用程序数据和扩展数据被称为用户数据。这些信息被客户端和服务器用于协商，并用于早期\
  \ WebSocket 握手。\n\n# 在 Express 中 Socket.IO\n\n以下步骤将用于使用 Socket.IO 创建一个 Express 服务器。\n\
  \n你需要创建一个名为 `server.js` 的新服务器端 JavaScript 文件。它将包含所有的服务器实例化并处理你的 Socket.IO 消息。\n\n\
  让我们创建 `server.js` 文件并添加以下代码：\n\n```javascript\nvar express = require(express’),\n\
  app = express(),\nhttp = require(http’),\nsocketIO = require(socket.io’),\nserver,\
  \ io;\napp.get('/', function (req, res) {\n  res.sendFile(__dirname + ‘index.html’);\n\
  });\nserver = http.Server(app);\nserver.listen(5000);\nio = socketIO(server);\n\
  io.on('connection’, function (socket) {\n  socket.emit('greeting-from-server’, {\n\
  \    greeting: ‘Hello Client’\n  });\n  socket.on('greeting-from-client’, function\
  \ (message) {\n    console.log(message);\n  });\n});\n```\n\n当用户导航到服务器根目录时，服务器将提供一个名为\
  \ `index.html` 的静态 HTML 文件。该 HTML 文件将处理客户端的 Socket.IO 消息。\n\n让我们创建一个 `index.html`\
  \ 文件并添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n  <script\
  \ src=”/socket.io/socket.io.js”></script>\n  <script>\n    var socket = io(http://localhost:5000’);\n\
  \    socket.on('ping-from-server’, function (message) {\n      document.body.appendChild(\n\
  \        document.createTextNode(message.greeting)\n      );\n      socket.emit('ping-from-client’,\
  \ {\n        greeting: ‘My first socket programming’\n      });\n    });\n  </script>\n\
  </body>\n</html>\n```\n\n运行应用程序：\n\n```bash\nPS D:\\Demo\\web-app> node server.js\n\
  ```\n\n现在检查浏览器 http://localhost:5000 输出：\n\n![](img/10.2_socket_io_output.jpg)\n\
  \n**图 10.2:** 第一个 socket 程序的输出\n\n首先，在这里我们创建新的 `Express` 服务器：\n\n```javascript\n\
  var express = require(express’)\n```\n\n接下来，我们设置了 `HTTP` 服务器，它将处理客户端和服务器之间所有的请求：\n\
  \n```javascript\nhttp = require(http’),\nserver = http.Server(app);\nserver.listen(5000);\n\
  ```\n\n我们导入了 Socket.IO 模块，并将 HTTP 服务器直接传递给 `Socket.IO` 构造方法，以创建服务器实例来监听新的 socket\
  \ 连接：\n\n```javascript\nsocketIO = require(socket.io’),\nio = socketIO(server);\n\
  io.on('connection’, function (socket) {\n  socket.emit('ping-from-server’, {\n \
  \   greeting: ‘My first Socket programming’\n  });\n  socket.on('greeting-from-client’,\
  \ function (message) {\n    console.log(message);\n  });\n});\n```\n\n最后，我们创建了前端应用程序，它将向创建的\
  \ WebSocket 服务器发送请求。\n\n## 客户端与服务器之间的通信\n\nSocket.IO 主要用于基于客户端和服务器之间建立直接通信通道创建实时应用程序。\n\
  \nSocket.IO 可以向特定的浏览器客户端发送事件。它也可以从服务器向多个浏览器发送事件。Socket.IO 能够使用许多传输机制。这是支持所有浏览器的关键。支持的传输包括\
  \ WebSockets、Flash、Ajax 长轮询、Ajax 多部分流、永久 Iframe 和 JSONP 轮询。允许的传输方式及其尝试顺序可以自定义。你可以将“transports”选项更改为传输名称数组。\n\
  \n## 选择 Node.js 和 Socket.IO 的原因\n\nNode.js 和 Socket.IO 提供了若干优势：\n\n*   **实时性功能**：Socket.IO\
  \ 允许客户端和服务器之间的实时通信。\n*   **可扩展性**：Node.js 可以处理成千上万甚至数百万用户。\n*   **跨平台兼容性**：Node.js\
  \ 兼容 Windows、Linux 和 macOS 在内的操作系统。\n\n\n\n\n```javascript\nsocket.on('sendMessage',\
  \ (message, callback) => {\n  const client = getClient(socket.id);\n  io.to(client.room).emit('message',\
  \ { client: client.name, text: message });\n  callback();\n});\n\nsocket.on('disconnect',\
  \ () => {\n  const client= removeClient(socket.id);\n  if(client) {\n    io.to(client.room).emit('message',\
  \ { client: 'Admin', text: `${client.name} has left.` });\n    io.to(client.room).emit('roomData',\
  \ { room: client.room, clients: getClientsInRoom(client.room)});\n  }\n});\n\nserver.listen(process.env.PORT\
  \ || 5000, () => console.log(`Server has started.`));\n```\n\n让我们创建一个 `server/package.json`\
