  \n**图 11.10：** todos 输出\n\n### 处理某些自定义错误\n\n通过在 `errors.js` 文件中定义类，我们可以添加基础错误处理，例如\
  \ `todos found`：\n\n```javascript\n// errors.js\nclass TodoIdNullError extends Error\
  \ {\n  constructor(todo_id, content) {\n    super();\n    this.name = this.constructor.name;\n\
  \    this.message = `Invalid Todo id - ${todo_id}`;\n    this.statusCode = 500;\n\
  \  }\n}\n\nclass TodoNotFoundError extends Error {\n  constructor(todo_id, content)\
  \ {\n    super();\n    this.name = this.constructor.name;\n    this.message = `Todo\
  \ not found - ${todo_id}`;\n    this.statusCode = 500;\n  }\n}\n\nmodule.exports\
  \ = {\n  TodoIdNullError,\n  TodoNotFoundError\n};\n```\n\n一旦定义了自定义错误处理类，我们允许路由在\
  \ `routes.js` 中抛出这些自定义错误：\n\n```javascript\n// routes.js\nconst express = require('express');\n\
  const router = express.Router();\nconst { TodoIdNullError, TodoNotFoundError } =\
  \ require(\"./errors\");\n\n// 首页\nrouter.get('/', (req, res) => {\n  res.send(\"\
  Home Page.....\");\n});\n\n// 获取 todos 列表\nrouter.get('/todos/:id', (req, res, next)\
  \ => {\n  if(req.params.id){\n    throw new TodoIdNullError();\n  }\n  // ... 逻辑\
  \ ...\n});\n```\n\n最后，我们实现错误处理中间件来捕获这些错误：\n\n```javascript\n// index.js\nfunction\
  \ errorLogHandler(error, req, res, next) {\n  console.error(error);\n  next(error);\n\
  }\n\nfunction errorHandler(error, req, res, next) {\n  if (error.type == 'redirect')\
  \ {\n    res.redirect('/error');\n  } else {\n    res.status(error.statusCode ||\
  \ 500).send(error.message);\n  }\n}\n\napp.use(errorLogHandler);\napp.use(errorHandler);\n\
  ```\n\n\n\n\n\n```javascript\nfetch(‘https://jsonplaceholder.typicode.com/todos/’\
  \ + req.params.id)\n  .then(res => res.json())\n  .then(todos => {\n    res.header(“Content-Type”,\
  \ ‘application/json’);\n    res.send(JSON.stringify(todos, null, 4));\n  })\n  .catch(err\
  \ => {\n    throw new TodoNotFoundError();\n    next(err);\n  })\n\nrouter.get(‘/error’,\
  \ (req, res) => {\n  res.send(“The URL you are trying to reach does not exist.”);\n\
  })\n\nmodule.exports = router;\n```\n\n现在尝试运行应用程序并导航到以下 URL，该 URL 提供了一个无效 ID：\n\n\
