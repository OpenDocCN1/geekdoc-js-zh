  \        done();\n      });\n    });\n    it(\"returns the color in RGB\", function\
  \ (done) {\n      request(url, function (error, response, body) {\n        expect(body).to.equal(\"\
  [0,255,0]\");\n        done();\n      });\n    });\n  });\n});\n```\n\n`PS D:\\\
  Demo\\unit testing> npm install request --save-dev`\n`PS D:\\Demo\\unit testing>\
  \ npm install express --save-dev`\n\n**运行单元测试：**\n\n![](img/12.6_rgb_example.jpg)\n\
  \n**图 12.6：** 运行单元测试的输出\n\n# 编写单元测试时使用的 Hooks\n\n我们有几个 Mocha 钩子用于编写单元测试。这些钩子中的某些用于设置某些前置条件，或者在运行测试后执行清理工作。\n\
  \n### BeforeEach\n\n`beforeEach` 方法是测试库中的一个函数（或钩子），允许针对每个测试用例设置一些定义的先决条件以便执行。此特定代码块会在你的测试包中的每个测试之前运行。例如，在下面的代码中，`beforeEach`\
  \ 方法在后续测试套件中定义的两个测试序列中执行了两次。每次执行都发生在实际测试函数执行之前的之前。\n\n以下使用 mocha 编写的代码使用了 `beforeEach()`：\n\
  \n```javascript\ndescribe(\"Tests with beforeEach\", function () {\n  beforeEach(function\
  \ () {\n    console.log(\"Initialising...\");\n  });\n  it(\"Test1\", function ()\
  \ {\n    //在此处编写测试逻辑\n  });\n  it(\"Test2\", function () {\n    //在此处编写测试逻辑\n  });\n\
  });\n```\n\n运行命令：`npm run test`\n\n*[图 12.7]* 显示了在 mocha 测试中使用 `beforeEach` 运行上述测试场景的输出。\n\
  \n![](img/12.7_beforeeach_example.jpg)\n\n**图 12.7：** 在单元测试中使用 beforeEach\n\n###\
  \ AfterEach\n\n`afterEach` 方法是测试库中的一个函数（或钩子），允许开发者在每个测试用例执行后执行清理工作。此特定代码块会在你的测试包中的每个测试之后运行。例如，在下面的代码中，`afterEach`\
  \ 方法在后续测试套件中定义的两个测试序列中执行了两次。每次执行都发生在实际测试执行之后。\n\n```javascript\ndescribe(\"Tests\
  \ with afterEach\", function () {\n  it(\"Test1\", function () {\n    //在此处编写测试逻辑\n\
  \  });\n  it(\"Test2\", function () {\n    //在此处编写测试逻辑\n  });\n});\n```\n\n## Spies\
  \ (间谍)\n\nSpies 是存储其使用信息的函数，包括传递给它们的参数和返回值。它们允许我们验证函数是否按预期被调用。\n\n在接下来的示例中，我们为数据库对象中定义的\
  \ `save` 方法创建了一个间谍。\n\n`src/database.js`\n```javascript\nconst Database = {\n  save:\
  \ function() {\n    // 一些逻辑\n  }\n};\n```\n\n`src/newUser.js`\n```javascript\nconst\
  \ Database = require('./database');\nfunction addNewUser(info) {\n  try {\n    Database.save(info);\n\
  \  }\n}\n```\n\n`test/newUser.js`\n```javascript\nconst Database = require('../database');\n\
  const sinon = require('sinon');\nconst addNewUser = require('../newUser');\n\ndescribe(\"\
  Spy example\", () => {\n  it('should pass', () => {\n    const save = sinon.spy(Database,\
  \ 'save');\n    const info = {\n      name: 'test'\n    };\n    addNewUser(info);\n\
  \    sinon.assert.calledWith(save, info);\n    save.restore();\n  });\n});\n```\n\
  \n**图 12.8：** afterEach 的输出\n\n### Stubs (桩)\n\nStubs 是用预定义值替换另一个函数。用于控制函数的输出或避免与依赖项交互。\n\
  \n我们将创建一个要测试的产品服务的实现。\n\n`src/product.service`\n```javascript\nconst request = require(\"\
  request\");\nasync function getAllProducts() {\n  return request.get(\"https://example.com/products\"\
  );\n}\nmodule.exports = { getAllProducts };\n```\n\n创建一个名为 `product.service.test.js`\
  \ 的测试文件并添加以下代码。\n\n`test/product.service.test.js`\n```javascript\nconst expect =\
  \ require(\"chai\");\nconst sinon = require(\"sinon\");\nconst request = require(\"\
  request\");\nconst service = require(\"../product.service\");\n\ndescribe(\"Product\
  \ Service\", () => {\n  afterEach(() => {\n    sinon.restore();\n  });\n  it(\"\
  should return all the products\", async () => {\n    const products = [{ id: \"\
  1\", name: \"Product123\" }];\n    sinon.stub(request, \"get\").returns(products);\n\
  \    const serviceProducts = await service.getAllProducts();\n    expect(serviceProducts).equal(products);\n\
  \  });\n});\n```\n\n### Mocks (模拟)\n\nMocks 是 spies 和 stubs 的结合，通常用于确保函数以特定的次数和特定的参数被调用，并返回预期值。\n\
  \n在接下来的代码中，我们正尝试使用 patch 请求更新订单：\n\n```javascript\nconst request = require(\"request\"\
  );\nasync function updateOrder(orderId) {\n  const url = \"https://example.com/orders/\"\
  ;\n  const order= await request.get(url + orderId);\n  if (!order) return;\n  await\
  \ request.patch(url + orderId);\n}\n```\n\n\n\n\n\n```javascript\nmodule.exports\
  \ = { updateOrder};\n```\n\n让我们创建 `order.service.test.js` 文件并添加以下代码来测试订单服务的功能。\n\
  \n```javascript\nconst expect = require(\"chai\").expect;\nconst sinon = require(\"\
  sinon\");\nconst request = require(\"request\");\nconst service = require(\"../src/order.service\"\
  );\ndescribe(\"Order Service\", () => {\n  afterEach(() => {\n    sinon.restore();\n\
  \  });\n  it(\"should not update the order\", async () => {\n    const mockReq =\
  \ sinon.mock(request);\n    const getOrder = mockReq.expects(\"get\").returns(null);\n\
  \    const updateOrder = mockReq.expects(\"patch\").returns({});\n    await service.updateOrder(\"\
  abc\");\n    expect(getOrder.callCount).equal(1);\n    expect(updateOrder.callCount).equal(0);\n\
  \  });\n  it(\"should update the Order\", async () => {\n    const mockReq = sinon.mock(request);\n\
  \    const getOrder = mockReq.expects(\"get\").returns({});\n    const updateOrder\
  \ = mockReq.expects(\"patch\").returns({});\n    await service.updateOrder(\"abc\"\
  );\n    expect(getOrder.callCount).equal(1);\n    expect(updateOrder.callCount).equal(1);\n\
  \  });\n});\n```\n\n在此项测试中，我们创建了模拟请求（mock request）的实现，并在不调用订单 API 的情况下，从 `get` 和\
  \ `update` 方法返回了不同的模拟值。\n\n**输出：**\n\n![](img/12.11_mock_exmaple.jpg)\n\n**图 12.11:**\
  \ 在单元测试中使用 Mock 的输出\n\n## 异步代码\n\n我们可以使用 `Mocha` 库内置的支持非常轻松地测试异步代码。\n\n让我们创建一个 `async.js`\
  \ 文件并添加以下调用外部 URL 的代码。\n\n```javascript\nconst axios = require('axios');\nfunction\
  \ get(url, cb) {\n  return axios.get(url);\n}\n```\n\n现在我们可以编写测试用例来验证上述代码。\n\n```javascript\n\
  describe('get()', function() {\n  it('works', async function() {\n    const res\
  \ = await get('http://example.com/responses');\n    assert.equal(res.data.args.answer,\
  \ 42);\n  });\n});\n```\n\n# 回调与 Promise\n\n我们可以使用 `Mocha` 提供的默认功能，通过回调和 Promise\
  \ 来测试任何异步调用。我们只需要在回调链的末尾传递一个 `done` 函数，以确保它在最后一个断言之后执行。\n\n创建一个名为 `http_request.js`\
  \ 的文件，它将用于使用 `http` 模块进行 RESTful API 调用。\n\n```javascript\nconst http = require('http');\n\
  var httpRequest = {\n  get: url => {\n    return (new Promise(function(resolve,\
  \ reject) {\n      http.get(url, res => {\n        resolve(res);\n      });\n  \
  \  }));\n  }\n};\nmodule.exports = httpRequest;\n```\n\n创建一个名为 `async.test.js` 的新文件：\n\
  \n```javascript\nconst req = require('../src/http_request');\nconst http = require('http');\n\
  const expect = require(\"chai\").expect;\ndescribe('sample tests for async code',\
  \ function () {\n  it('callback', function (done) {\n    http.get('http://www.example.com',\
  \ function (res) {\n      expect(res.statusCode).equal(200);\n      done();\n  \
  \  });\n  });\n  it('promise', function (done) {\n    req.get('http://www.example.com/').then(function\
  \ (res) {\n      expect(res.statusCode).equal(200);\n      done();\n    })\n  });\n\
  });\n```\n\n**输出：**\n\n![](img/12.12_async_sample.jpg)\n\n**图 12.12:** 单元测试中的回调和\
  \ Promise 输出\n\n## 结论\n\n单元测试是确保代码质量和 Node.js 整体稳定性的简单方法。单元测试还能帮助你发现代码中的 Bug 和错误，这些错误在编写代码时可能无法被发现。此外，早期发现编码错误可以减少整体开发成本，并通过多次重构代码修复测试用例来帮助改进系统设计。“Mocha`\
  \ 和 `chai` 是我们探索过的用于测试 Node.js 应用程序的流行库。\n\n在下一章，我们将涵盖更多关于调试 Node.js 应用程序的内容，并轻松地识别问题。\n\
  \n## 延伸阅读\n\n以下链接可以帮助你深入理解单元测试：\n\n* [`blog.logrocket.com/testing-node-js-mocha-chai/`](https://blog.logrocket.com/testing-node-js-mocha-chai/)\n\
  * [`brightsec.com/blog/unit-testing-in-nodejs/`](https://brightsec.com/blog/unit-testing-in-nodejs/)\n\
