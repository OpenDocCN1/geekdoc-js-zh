  \ 的一些核心概念\n\n让我们了解 Node.js 的一些核心概念。\n\n## V8 引擎\n\nNode.js 实现了 Google 强大的 JavaScript\
  \ 引擎，也称为 Chrome V8。\n\n**我们所指的 JavaScript 引擎到底是什么？**\n\n\n\n\n\nJavaScript 引擎负责用\
  \ C++ 编写的编译和执行 JavaScript 代码，并管理资源和内存分配。V8 引擎已经应用于我们的 Chrome 浏览器中。V8 可以被配置为作为一个独立程序运行，也可以被嵌入到任何\
  \ C++ 程序中，从而实现基于 JavaScript 的脚本接口，同时提供惊人的性能和灵活性。这还允许你根据需求在特定场景下扩展并引入你自己的 JavaScript\
  \ 变体。由于 V8 是一个虚拟机，这意味着它通过模拟通用的执行环境，将底层硬件从的 JavaScript 代码中抽象出来。你可以无缝地在 Windows、Mac\
  \ 和 Linux 上使用 V8。这非常棒，因为它让开发者能够将他们的应用部署到几乎任何类型的执行环境中，而无需过多担心底层硬件。\n\nJavaScript\
  \ 结合 C++ 编程的性能优势，可以产生影响。对于 Node.js 来说，V8 是同一个名为 `libuv` 的抽象层实现的，这使得 Node.js 能够以非阻塞的方式在各种操作系统上执行无缝的输入输出操作。与\
  \ `libuv` 一起，Node.js 还带有一个内置核心库，提供了许多实用的方法，开发者可以使用这些方法来编写程序，例如 Web 服务器和网络应用。\n\n\
  ![](img/1.18_v8_engine.jpg)\n\n**图 1.18:** V8 引擎核心层\n\n## 阻塞与非阻塞操作\n\n让我们尝试理解这到底意味着什么，以及为什么它让\
  \ Node.js 与其他服务器技术（如 Java、PHP 等）有所不同。\n\n**阻塞**Blocking）操作发生在 Node.js 进程内部的 JavaScript\
  \ 代码执行必须等待所有代码同步执行并且控制权移动到执行下一条语句时。\n\n例如，当我们使用 `fs` NPM 包读取文件系统时：\n\n```javascript\n\
  const fs = require(“fs”);\nconst data = fs.readFileSync(“/file.md”); // 在此处阻塞直到文件被读取\n\
  console.log(data);\n```\n\n在前面的代码中，`fs.readFileSync()` 会阻塞任何额外 JavaScript 的执行，直到整个文件数据被完全读取并在控制台中显示输出。\n\
  \n**非阻塞**Non-blocking）操作本质上是异步的，不会等待操作完成；它们会继续执行后续语句。一旦操作成功，错误第一个回调函数 `(err, data)`\
  \ 内部的代码就会执行：\n\n```javascript\nconst fs = require(“fs”);\nfs.readFile(“/file.md”,\
  \ (err, data) => {\n  if (err) throw err;\n  console.log(data);\n});\n```\n\n在前面的示例中，文件内容是异步读取的。操作完成后，执行回调函数\
  \ `(err, data)` 来抛出错误或将数据记录到控制台中。\n\n![](img/1.19_blocking_vs_non-blocking.jpg)\n\
  \n**图 1.19:** 同步与异步 I/O\n\n## 事件循环\n\nNode.js 是一个单线程、事件驱动的框架，可以执行异步非阻塞的代码。得于这些特性，它在内存方面非常高效。尽管\
  \ JavaScript 是单线程的，但由于事件循环的存在，Node.js 可以执行非阻塞 I/O 操作。这是通过在可行的情况下任务委托给操作系统来实现。\n\n\
  ![](img/1.20_event_loop.jpg)\n\n**图 1.20:** 同步与异步 I/O\n\n**事件循环**Event Loop 有一个简单的工作——监控调用堆栈（Call\
  \ Stack）、回调队列（Callback Queue）和微任务队列（Microtask queue）。如果调用堆栈为空，事件循环将从微任务队列中获取第一个事件，然后从回调队列中获取，并将其推入调用堆栈，从而有效地运行它。这样的迭代在事件循环中被称为一次\
  \ **tick**。\n\n由于 JavaScript 是单线程的，JavaScript 中的两个语句无法并行执行。执行是逐行进行的，这意味着每个 JavaScript\
  \ 语句在本质上都是同步且阻塞的。然而，有一种方法可以异步或并行运行你的代码。如果你使用 `setTimeout()` 函数，代码将在指定时间（毫秒）后执行。\n\
  \n让我们通过以下示例来理解这一点：\n\n```javascript\nconsole.log(“Start”);\nsetTimeout(function\
  \ callbackFunc(){\n  console.log(“Settimeout called after 5 seconds”);\n  // 现在将调用\
  \ sum\n  sum();\n},5000);\nfetch(“http://example.com/”).then(function outPutFunc(){\n\
  \  console.log(“Call back from example api”);\n});\nfunction sum(x, y){\n  return\
  \ x +y;\n}\n//......................\n//.....................\nconsole.log(“end”);\n\
  ```\n\n`setTimeout` 接受回调函数作为第一个参数，接受毫秒级的时间作为第二个参数。在浏览器控制台执行完前面的语句后，它将打印：\n\n```\n\
  Start\nEnd\nCall back from example api\nSettimeout called after 5 seconds\nNow sum\
  \ will be called\n```\n\n**注意：** 你的异步代码在所有同步代码执行完毕后运行。\n\n以下是运行上述应用程序时发生的关键步骤：\n\
  \n1. JS 引擎执行第一行并在控制台中打印 `Start`。\n2. 第二行看到 `setTimeout()`，一个名为 `callbackFunc` 的函数，JS\
  \ 引擎将 `callbackFunc` 推入回调队列。\n3. 随后，指针将直接跳到第七行，最后在程序结束处处，它将打印 `End`。\n4. 主线程结束后，事件循环首先检查微任务队列，然后是回调队列。在我们的案例中，它从微任务队列中获取\
  \ `outputFunc()` 并将其推入调用堆栈。\n5. 事件循环从回调队列中选取 `callbackFunc()` 并将其推入调用堆栈。\n6. JS\
  \ 引擎执行 `setTimeout`。\n\n![](img/1.21_calltack.jpg)\n\n**图 1.21:** 事件循环示例\n\n## 回调函数\n\
  \nJavaScript 默认是同步的，这意味着代码将按顺序执行。例如，以下代码将逐行执行，最终输出将记录在控制台中：\n\n```javascript\nconst\
  \ a = 1;\nconst b = 2;\nconst c = a * b;\nconsole.log(c);\ndoSomething();\n```\n\
  \n根据 Node.js 网站的官方定义 [`nodejs.dev/en/learn/asynchronous-programming-and-callbacks`](https://nodejs.dev/en/learn/asynchronous-programming-and-callbacks)\n\
  \n*回调作为一个值传递给另一个函数的简单函数，并在事件发生时才会执行。我们可以这样做是因为 JavaScript 有一等函数，可以赋值给变量并传递给其他函数（称为高阶函数）。*\n\
  \n```javascript\nsetTimeout(() => {\n  // 2 秒后运行\n}, 2000);\n```\n\n在 `setTimeout`\
  \ 函数上方有一个经典的示例，接受第一个参数作为回调函数，第二个参数是回调函数执行前的毫秒数。\n\n回调函数是处理异步函数调用的很好的方法，但每增加一个回调都会增加一层嵌套，当同一代码中发生大量回调时，就会导致**回调地狱**callback\
  \ hell：\n\n```javascript\nwindow.addEventListener(‘load’, () => {\n  document.getElementById(‘button’).addEventListener(‘click’,\
  \ () => {\n    setTimeout(() => {\n      fetch(“http://example.com/”).then(function\
  \ cbF() {\n        items.forEach(item => {\n          //更多代码\n        });\n    \
  \  });\n    }, 2000);\n  });\n});\n```\n\n这个示例显示了在 10 行代码内调用了如此回调函数；处理这种回调地狱的情况会变得非常混乱。\n\
  \n\n\n\n\n## 定义 Node.js 中的回调地狱\n\n回调函数用于延迟执行某个函数，直到另一个函数执行并返回数据。然而，在某些情况下，我们可能需要在一个回调中嵌套多个回调。如果你有许多相互依赖的连续异步请求，这种回调的嵌套特性会导致代码水平方向扩展，变得变得难以阅读和困惑。这种回调嵌套回调的现象被称为**回调地狱\
  \ (callback hell)**，有时也被称为**魔狱之字 (pyramid of doom)**。\n\n在下面的代码中，我们调用了多次 `setTimeout()`，它们接受一个回调函数。在这种情况下，每当一个\
  \ `setTimeout` 回调函数执行时，它都会返回触发一个新的 `setTimeout()` 函数：\n\n```javascript\nfunction\
  \ callbackhellexample() {\n  // 第 setTimeout 函数\n  setTimeout(() => {\n    console.log(10)\n\
  \    // 第二 setTimeout 函数\n    setTimeout(() => {\n      console.log(20)\n      //\
  \ 第三个 setTimeout 函数\n      setTimeout(() => {\n        console.log(30)\n      },\
  \ 500)\n    }, 2000)\n  }, 1000)\n};\n```\n\n一旦最内层的 `setTimeout` 函数完成执行，回调函数才会将执行权交给外层的上层回调函数。\n\
  \n## 避免回调地狱的方法\n\n以下是在 Node.js 中避免回调地狱问题的某些方法：\n\n### Promise\n\nPromise 是一个 JavaScript\
  \ 对象，代表异步操作的最终成功或失败及其最终输出。换句话说，Promise 是一个你可以在其上附加回调函数的对象，而不是直接将其传递给函数。\n\n下面是我们如何创建一个\
  \ promise 的示例，并根据操作状态，如果成功则调用 `resolve`，失败则调用 `reject`：\n\n```javascript\nvar displayGreeting\
  \ = (name) => alert(‘Welcome ‘ + name);\nvar processUserInput = () => {\n  return\
  \ new Promise((resolve, reject) => {\n    var name = prompt(“please enter name”);\n\
  \    if (name) {\n      resolve(name)\n    }\n    reject(false);\n  });\n}\nprocessUserInput().then(res\
  \ => displayGreeting(res));\n```\n\nPromise 是值的代理，该值在 promise 创建时并不一定已知。这使得处理器能够与异步操作的最终成功值或失败原因相关。这允许异步方法像同步方法一样返回值。异步方法不是立即返回最终值，而是返回一个\
  \ promise 以稍后返回值。\n\n![](img/1.22_promise_example.jpg)\n\n**图 1.22：** Promise 执行示例\n\
  \n一个 promise 可以处于以下状态之一：\n\n- **Pending（等待中）**：这是 promise 的初始状态，既未完成也未拒绝。\n- **Completed（已完成）**：这意味着操作成功完成。\n\
  - **Failed（失败）**：这意味着操作失败。\n\n一个 promise 包含以下两个关键部分：\n\n- **resolve**\n当某些操作执行成功且我们想要返回时，执行\
  \ resolve 回调函数。\n- **reject**\n当操作由于某些意外的失败条件而失败时，调用 reject 回调函数并返回一个错误。\n\n让我们通过一个简单的示例来理解一下。\n\
  \n在这里我们定义了函数 `getMulNum()` 来计算两个整数 `a` 和 `b` 的乘积。在函数中，我们使用 promise 构造函数 `new Promise()`\
  \ 创建一个新的 promise。\n\n计算 `a` 和 `b` 的乘积。如果和小于或等于 50，则触发回调。否则，调用回调 reject。将新 promise\
  \ 传递给变量 `myPromise`，然后返回它。\n\n```javascript\nfunction getMulNum(a, b) {\n  const\
  \ myPromise = new Promise((resolve, reject) => {\n    const mul = a * b;\n    if\
  \ (mul <= 50) {\n      resolve(“Successful result”)\n    } else {\n      reject(new\
  \ Error(‘Result must be less than 50’))\n    }\n  })\n  return myPromise\n}\n```\n\
  \n### Async and Await\n\nJavaScript 的执行默认以同步的方式进行。这意味着每行代码都从上到下执行，而不需要等待任何结果。\n\n\
  然而，我们的程序中有许多区域包含异步代码，处理这些代码的关键方法之一是使用 `Async/Await` 功能，我们在语言中得到了这种支持。\n\n**Async**：`async`\
  \ 函数允许你像编写同步代码一样编写基于 promise 代码，确保它们不会中断执行线程。它在事件循环上异步运行，并且异步函数总是返回一个值。它保证了 promise\
  \ 将会返回，如果没有返回，JavaScript 将自动将其封装成一个由值解析的 promise。\n\n```javascript\nconst getUserData\
  \ = async () => {\n  var data = {firstname: ‘john’, lastname: ‘Doe’ };\n  return\
  \ data;\n}\ngetUserData().then(data => console.log(`${data.lastname} ${data.lastname}`));\n\
  ```\n\n**Await**：`await` 函数用于等待 promise 的解析或拒绝。它只能在 async 块中使用。通过使用此关键字，你可以让你的代码等待直到\
  \ promise 返回结果。它只是让 async 块保持等待。\n\n`await` 关键字告诉 JavaScript 引擎停止执行当前函数，直到 promise\
  \ 解析并返回 promise 的值。你可以将其认为是一个无限循环，检查 promise 是否已解析，如果是，则返回已解析 promise 的值。\n\n`await`\
  \ 关键字只在异步函数（如之前解释的协程）中起作用。异步函数的问题是它们返回的是 promise 而不是值。\n\n在图 1.23 中，Task 1 被调用并等待响应。让我们再次看这个示例。然而，我们使用\
  \ `sleep` 函数来代替 `setTimeout()`，这样就可以使用 await 来实现 `mathationAsync`。\n\n```javascript\n\
  function sleep(ms) {\n  return new Promise((resolve) => setTimeout(resolve, ms));\n\
  }\n\nasync function mathOationAsync(x, y) {\n  // 代码在此等待 500 毫秒\n  await sleep(500);\n\
  \  // 等待结束。计算并返回值\n  return x+y\n}\n\n// mathOationAsync 是一个异步函数，这意味着它返回一个 Promise。\n\
  mathOationAsync(5, 7).then((result) => {\n  console.log(“加法的结果是：”, result);\n})\n\
  ```\n\n## 选择合适的方法\n\n在 JavaScript 中进行异步处理，你有以下选项：\n\n- callback\n- promise\n- async/await\n\
  \n如果你没有其他选择或只是想处理异步操作，使用 **callback**。即使如此，代码也是完全可控且易理解的。\n\n当存在多个链式（或依赖的）异步操作时，如果你尝试使用\
  \ callback，你会很快陷入**回调地狱**。为了避免这种情况，**Promise** 是更好的选择，它是保持操作有序和可预测的极佳工具。\n\n如果你并不需要或不想使用观察者，但想使用\
  \ Promise，**async/await** 也是一个很棒的工具。你可以使用 async/await 编写“同步”代码并更更容易地管理 Promise 链。\n\
  \n## REPL Console\n\n\n\n\nREPL（读取、求值、打印、循环）类似于 shell（Unix/Linux）和 Windows 命令提示符的计算机环境。Node.js\
  \ 在安装时带有内置的 REPL 环境。该系统是一种通过发布所使用的命令/表达式与用户交互的非常有用的方法。\n\n*   `Read`：此操作从用户处读取输入并将其解析为\
  \ JavaScript 数据结构，存储在内存中。\n*   `Eval`：对解析后的 JavaScript 数据结构进行求值。\n*   `Print`：在求值后打印结果。\n\
  *   `Loop`：用于循环输入命令。\n\n按两次 `Ctrl+C` 退出 NODE REPL 环境。\n\n## 开始使用 REPL\n\n要在 NODE\
  \ 的 REPL 环境中工作，打开终端（UNIX/LINUX）或命令提示符（Windows），输入 `node` 并按回车键启动 REPL。\n\n![](img/1.24_starting_repl.jpg)\n\
  \n**图 1.24：** 启动 REPL 终端\n\n以下是一些使用 REPL 的示例：\n\n### 简单算术运算\n可以执行基础数学运算，如加法、减法、乘法和除法，如图所示：\n\
  \n![](img/1.25_sum_output.jpg)\n\n**图 1.25：** REPL 中的算术运算\n\nREPL 可用于对字符串进行操作。在你的\
  \ REPL 中输入以下内容来拼接这些字符串：\n\n![](img/1.26_string_output.jpg)\n\n**图 1.26：** REPL 中的字符串操作\n\
  \n### 调用函数\n我们编写函数来处理特定任务，并执行复杂操作。REPL 提供了一种处理这些方法的简单方法。在 JavaScript 中，我们通常使用全局\
  \ `console.log()` 方法打印消息。也可以编写普通的 JavaScript 函数来解决问题并处理复杂逻辑。\n\n在下面的示例中，我们编写了 `addTwoNumbers()`\
  \ 函数，它接受两个参数并产生 30 的输出和。\n\n![](img/1.27_function_call.jpg)\n\n**图 1.27：** 在 REPL\
  \ 中使用函数调用进行求和\n\n### 使用变量\n我们可以使用变量存储值，并在以后执行操作时使用它们。\n\n![](img/1.28_repl_var.jpg)\n\
  \n**图 1.28：** 在 REPL 中使用变量\n\n### 循环和多行表达式\n我们可以使用多行表达式来编写循环和其他无法单行编写语句。例如，当我们使用\
  \ `do while` 循环进行迭代时，必须如下所示将所有语句写入不同的行：\n\n![](img/1.29_repl_loops.jpg)\n\n**图 1.29：**\
  \ REPL 中的循环和多行表达式\n\n### 使用下划线变量\n我们可以使用 `_` 变量获取 Node REPL 的上一个结果。让我们两个变量并执行一些算术运算。\n\
  \n```\nvar x = 10;\nvar y = 20;\nvar z = 0;\nx + y;\nz = _ * 100;\n```\n\n![](img/1.30_repl_underscore.jpg)\n\
  \n**图 1.30：** 在 REPL 中使用下划线\n\n### 使用点命令\n有一些以点 (.) 开头的特殊命令用于执行 REPL 命令行工具的一些核心功能，如下：\n\
  \n*   `.help`：显示点命令的帮助。\n*   `.editor`：启用编辑器模式，允许你轻松编写多行 JavaScript 代码。进入此模式后，按\
  \ `Ctrl-D` 运行你写的代码。\n*   `.break`：在输入多行表达式时，输入 `.break` 命令将终止后续输入，类似于按 `ctrl-C`。\n\
  *   `.clear`：将 REPL 上下文重置为空对象，并清除当前输入的任何多行表达式。\n*   `.load`：加载相对于工作目录的 JavaScript\
  \ 文件。\n*   `.save`：将你在 REPL 会话中输入的所有内容保存到文件（指定文件名）。\n*   `.exit`：退出 REPL（等同于按两次\
  \ Ctrl-C）。\n\n## 使用 NPM 和 Package.json\n\n包管理器定义为**一套用于自动化安装、升级、配置和使用软件的系统或工具集**。大多数包管理器用于在本地机器或生产服务器上发现并安装开发者工具。\n\
  \nMaven 是 Java 的包管理器之一，用于自动化特定应用程序安装、升级和删除系统依赖的过程。\n\n包管理器还处理包的捆和软件的分发。\n\nNPM 是由\
  \ npm, Inc. 维护的 Node.js JavaScript 运行环境默认包管理器。它由一个命令行（CLI 工具）程序（也称为 npm）以及一个用于托管公共（免费）和私有（付费）包的在线数据库（npm\
  \ registry）组成([`www.npmjs.com/`](https://www.npmjs.com/))。\n\n这里解释了一些重要的 NPM 命令。\n\
  \n## Init\n\n此命令用于初始化一个空的 node.js 项目。\n\n![](img/1.31_sum_output.jpg)\n\n**图 31：**\
  \ NPM init 命令输出\n\n## Install\n\n此命令用于在 `package.json` 所在的根 `node_modules` 文件夹内安装项目所需的所有依赖。\n\
  \n### 安装单个包\n如果需要，我们可以安装单个包。对于此命令，有多个可以添加的标志：\n\n*   `--save`：当我们使用 save 标志时，会在\
  \ `package.json` 的 dependencies 部分添加条目（包含运行环境所需的包）。\n*   `--save-dev`：这将条目并添加到 `package.json`\
  \ 文件的 `devDependencies` 部分（包含仅用于开发的包）。\n*   `--no-save`：这将安装模块但不在 `package.json`\
  \ 文件中添加任何条目。\n*   `--save-optional`：这将安装模块并在包文件的 `optionalDependencies` 部分添加条目。\n\
  *   `--no-optional`：这将防止可选依赖被安装。\n\n![](img/1.32_express.jpg)\n\n**图 1.32：** NPM\
  \ install 命令输出\n\n## Update\n\n此命令将根据给定的版本约束检查所有包是否有可用的新版本。\n\n*   `Update <package-name>`：此命令将更新单个包。\n\
  *   版本控制：NPM 还有帮助管理版本，这意味着我们可以指定任何更高或更低的版本，其依赖将相应安装兼容的版本。\n*   运行任务：此命令在运行任何特定脚本（如构建、启动服务器或运行单元测试）时非常有用。\n\
  \n    ```\n    \"scripts\": {\n      \"start-dev\": \"node dev.server.js\",\n  \
  \    \"start\": \"node prod.server.js\"\n    }\n    ```\n\n*   Uninstall：此命令有助于从给项目或应用程序卸载模块。\n\
  *   Publish：此命令用于将本地开发包发布到 npm 注册表以便共享。发布后，其他人可以下载并在他们的项目中使用。\n*   Login：此命令用于登录\
  \ npm.js 官方网站的账户。\n\n## Package.json 的属性\n\n以下是 **package.json** 中定义的属性详细列表：\n\n\
  *   **name**：包的名称，通常是应用程序或模块的标题。名称属性有一些限制：\n\n\n\n\n\n- 最大长度为 214 个 URL 友好型字符\n\
  - 不包含大写字母\n- 不以句号 (.) 或下划线 (_) 开头（作用域包除外）\n\n- version：该模块包的当前版本。Node.js 模块使用语义化版本（Semantic\
  \ Versioning），包含三个不同的版本级别。例如，版本 2.0.1 被分为三个级别：\n    - `Major-X.0.0`\n    - `Minor-0.X.0`\n\
  \    - `Patch-0.0.X`\n  其中 X 是版本的当前级别。\n  语义化版本（也称为 `SemVer`）是近年来发展的一种版本控制系统。对于软件开发人员、发行管理器和消费者来说，这是一个持续存在的问题。为软件开发项目采用全局版本管理方法，是跟踪软件动态的最佳方式，例如几乎每天更新的新工具、扩展、库和访问。这个问题可以通过语义化版本来解决。简单来说，这计算计算机输出的方法。\n\
  \  因此，`SemVer` 看起来像 `Major.Minor.Patch`。\n\n- license：此标识符用于描述该包所遵循的许可类型。你可能熟悉的几个示例有\
  \ MIT、ISC 和 GPL-3.0。\n\n- description：包的描述，包含模块的完整描述，帮助开发人员让用户更多地了解包用法。这有助于 Google\
  \ 或 npm 搜索等搜索引擎找到相关包。\n\n- homepage：该模块或项目创建并托管的包主页。\n\n- author：包的作者，即创建此应用程序的人。\n\
  \n- contributors：包的贡献者姓名\n\n- dependencies：依赖项列表。Node.js 应用使用多个模块构建，这些模块被分组为依赖项。当我们运行\
  \ `npm install` 命令时，NPM 会自动在包的 `node_module` 文件夹中安装这里提到的所有依赖项。\n\n- repository：仓库是一个存储源代码存储位置的数组，对于开源项目，这通常是一个像\
  \ GitHub 或 Bitbucket 这样的公共托管仓库。\n\n- main：模块的入口点。当我们使用 `required` 语句导入任何模块时，`main`\
  \ 属性将返回给 Node.js 。\n\n- Scripts：包含一组可以由 Node.js 执行的用户自定义命令。可以在此处添加一些用于测试、构建和执行代码覆盖的核心脚本。我们使用\
  \ `--npm run` 命令来执行任何给定的脚本，或者也可以使用 `node filename.js` 运行。\n\n```json\n\"scripts\"\
  : {\n  \"start\": \"npm run app.js\",\n  \"test\": \"npm run test.js\"\n}\n```\n\
  \n- keywords：描述模块的文本集合。这可以帮助任何包和相关模块。\n`package.json` 内部的一些示例关键词：\n\n```json\n\"\
  keywords\": {\n  \"Node\",\n  \"Introduction\"\n}\n```\n\n下面的代码显示了 `package.json`\
  \ 示例：\n\n```json\n{\n  \"name\": \"sample\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"This is sample node application\",\n  \"main\": \"app.js\",\n  \"scripts\":\
  \ {\n    \"test\": \"npm run test.js\"\n  },\n  \"keywords\": [\n    \"Node\",\n\
  \    \"Introduction\"\n  ],\n  \"author\": \"Ramesh\",\n  \"license\": \"ISC\"\n\
  }\n```\n\n## 使用 Node.js 创建的第一个控制台应用程序\n\n让我们创建一个名为 `Hello World` 的简单 Node.js 应用。\n\
