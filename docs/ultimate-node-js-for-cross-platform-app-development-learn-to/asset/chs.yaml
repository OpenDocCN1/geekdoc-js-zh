  ## 开始使用 Node.js (#toc.xhtml_c01)\n\n### 简介 (#toc.xhtml_s1a)\n\n本章将帮助您开始使用 Node.js，涉及活动包括安装、运行\
  \ CLI 命令以及创建我们的第一个 Node.js 应用程序。在本章中，我们还将简要回顾本书后续章节中涵盖的一些主题。\n\n### 结构 (#toc.xhtml_s2a)\n\
  \n本章将涵盖以下主题：\n\n*   Node.js 的历史\n*   定义 Node.js\n*   Node.js 的一些重要用途\n*   安装和设置本地环境\n\
  *   理解 Node.js 的核心概念\n*   Node.js 控制台 REPL\n*   NPM 和 `package.json`\n*   创建我们的第一个应用程序\n\
  \n# Node.js 的历史 (#toc.xhtml_s3a)\n\n如今，JavaScript 是世界上最流行的编程语言之一。Node.js 由 Ryan\
  \ Dahl 在 2009 年创建，最初仅支持 Linux 和 MacOS。其早期的开发和维护由 Joyent 赞助。\n\n2010 年，引入了包管理器 NPM，这使得开发者可以非常地发布和共享\
  \ Node.js 的源代码。2014 年底，由于 Joyent 治理内部的冲突，一群既是原始 node 项目贡献者又是技术人员的人将 Node 分叉出了一个名为\
  \ `IO.js` 的项目，以便快速开发并提供最新的功能。2015 年初，Node.js 基金会成立，关键成员包括 IBM、Intel、Microsoft、PayPal\
  \ 等许多家机构。\n\nNode.js 与 IO.js 合并后的第一个正式版本版本为 `4.x`。新的 Node.js 基金会通过发布具有最新功能的新版本并修复多个与安全和性能相关的问题，将整个框架推向新的高度，这已成为\
  \ Node.js 引入主流企业 Web 应用开发的关键。\n\n与 JAVA 和 .NET 等其他编程语言不同，Node 也是一个平台。这意味着您对您的应用程序逻辑以及其运行的环境具有完全的控制权。您可以。\n\
  \n# 定义 Node.js (#toc.xhtml_s4a)\n\nNode.js 是一个构建在 V8 JavaScript 引擎之上的运行时环境。它允许开发者在服务器端运行\
  \ JavaScript，从而创建全栈应用程序。\n\n# Node.js 的特性 (#toc.xhtml_s5a)\n\nNode.js 的一些核心特性包括：\n\
  \n*   **异步（Asynchronous）**：Node.js 的核心在于它是异步的；它不会等待操作完成，而是继续移动到下一个操作。\n*   **事件驱动（Event\
  \ Driven）**：Node 提供了一个名为 `Event` 的模块，其中包含一个 `EventEmitter` 类。事件处理器是一个在事件触发时调用的用户定义函数。\n\
  *   **无缓冲（No Buffering）**：在 Node.js 中，由于其异步性质，数据没有缓冲，用户总能更容易地接收数据，因为他们不需要等待。\n*\
  \   **单线程架构（Single-Threaded Architecture）**：Node.js 架构基于单线程事件循环模型，可以同时处理多个客户端请求。\n\
  *   **高扩展性（Highly Scalable）**：Node.js 后端应用程序具有高度的可扩展性，可以使用单线程异步处理数百万次请求。\n*   **执行快速（Fast\
  \ Execution）**：Node.js 通过使用 V8 引擎可以将 JavaScript 代码编译为机器码，从而更快更快。\n\n# Node.js 流行的原因\
  \ (#toc.xhtml_s6a)\n\n虽然我们已经探讨了一些让 Node.js 成为企业中流行框架的关键特性，但它不仅推动了开发社区向 Node.js 发展。让我们讨论一下使用\
  \ Node.js 构建企业应用程序的更多通用益处：\n\n\n\n\n\n*   **单一 JavaScript 语言**\n    Node.js 项允许你构建端到端\
  \ JavaScript 应用的技术。学习一种语言，你就可以开发应用的前端和后端。\n\n*   **Node.js 的广泛采用**\n    包括 LinkedIn、Netflix\
  \ 和 PayPal 在内的几家大公司已从其他后端技术迁移到 `Node.js`。\n\n*   **对全栈开发的需求**\n    全栈开发是目前公司最青睐的技能之一。如果你是一名前端开发者，学习\
  \ `Node.js` 将帮助你轻松地成为一名全栈开发者。\n\n*   **巨大的社区支持**\n    `Node.js` 拥有巨大的社区支持，对于与开发相关的任何问题或疑虑，你都能获得帮助。\n\
  \n此外，以下是让 `Node.js` 如此流行的其他关键特性：\n\n*   构建如聊天等实时应用\n*   实时游戏应用\n*   需要大量异步 I/O 操作的应用\n\
  *   如电子商务等可扩展 Web 应用\n*   使用 `Azure function`、`AWS Lambda` 或 `Google Cloud functions`\
  \ 的无服务器 Web 应用\n*   轻量级移动友型的 RESTful API\n*   在单线程上运行整个应用的能力\n\n有许多开源框架可以在核心 `Node.js`\
  \ 之上用于应用，例如：\n\n*   `Express.js`\n*   `Meteor.js`\n*   `Koa.js`\n*   `Sails.js`\n\
  *   `Next.js`\n*   `Hapi.js`\n\n在以下情况下无法使用 `Node.js`：\n\n*   在重型计算任务中存在性能瓶颈\n* \
  \  `Callback` 地狱问题\n*   工具和依赖管理不成熟\n*   第三方开发的不稳定的 API\n*   高 CPU 使用率的应用\n\n## Node.js\
  \ 对比浏览器 JavaScript\n\n下表显示了 JavaScript 和 `Node.js` 之间的区别：\n\n| | JavaScript | Node.js\
  \ |\n| :--- | :--- | :--- |\n| 1 | JavaScript 是一种流行的编程语言，主要用于客户端脚本 | `Node.js` 是一个\
  \ JavaScript 运行时，用于在服务器上运行 |\n| 2 | JavaScript 只能在浏览器中运行 | `Node.js` 运行在浏览器外的后端服务器（如\
  \ Linux/windows/mac）上 |\n| 3 | 主要用于执行客户端脚本 | `Node.js` 帮助编写后端服务端应用 |\n| 4 | JavaScript\
  \ 用于 HTML 中的 DOM 操作 | `Node.js` 不用于 DOM 操作 |\n| 5 | JavaScript 可以运行在任何支持 JavaScript\
  \ 引擎的浏览器上 | JavaScript 代码只能使用 `Node.js` 内部提供的 `V8` 引擎运行 |\n| 6 | 主要用于开发前端库 | `Node.js`\
  \ 主要用于创建如 RESTFul API 等后端服务器 |\n| 7 | 用于构建以网络为中心的应用 | `Node.js` 应用是高度分布的，并运行在多个服务器上\
  \ |\n\n**表 1.1：** `Node.js` 与浏览器 JavaScript 的区别\n\n## 安装 Node.js\n\n我们有多种方法在本地系统上安装\
