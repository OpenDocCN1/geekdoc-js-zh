  7. 你可以在终端看到输出为 `Hello World`。\n   ![](img/1.34_putput.jpg)\n   **图 1.34：** Hello\
  \ world 应用程序输出\n\n## 使用 Node.js 创建的第一个 Web 应用程序\n\n安装 Node.js 后，我们可以创建 Web 服务器并使用\
