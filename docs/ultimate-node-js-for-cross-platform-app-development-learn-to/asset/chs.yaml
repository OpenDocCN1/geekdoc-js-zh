  ```\n```\nres.download('/invoice-03.pdf’)\n```\n```\nres.json({ data: [] })\n```\n\
  ```\nres.jsonp({ data: [] })\n```\n```\nres.redirect('http://test.com’\n```\n```\n\
  res.render('index’);\n```\n```\nres.send({ some: ‘json’ });\n```\n```\nres.sendFile(fileName,\
  \ options, function (err) {\n// ...\n});\n```\n```\nres.status(400).send('Bad Request’);\n\
  ```\n\n\n\n\n\n```javascript\nconsole.log('Request logging will take care here');\n\
  \nnext();\n\n}\n```\n\n```javascript\n// 我们正在创建一个中间件数组，这些中间件将在请求处理之前执行\nconst logStuff\
  \ = [authMiddleware, logMiddleware]\n\n// 使用 logStuff 中间件数组获取请求\napp.get('/order/:id',\
  \ logStuff, (req, res, next) => {\n  res.send('Order detail...')\n})\n\nconst server\
  \ = app.listen(8081, function () {\n  var host = server.address().address;\n  var\
  \ port = server.address().port;\n  console.log(`Server is listening at http://${host}:${port}`)\n\
  });\n```\n\n在这里，我们想要使用两个中间件：\n\n- 身份验证中间件\n- 日志记录中间件\n\n我们可以通过中间件的数组语法同时配置这两者。因此，当客户端调用\
  \ URL `order/2312` 时，两个中间件将以同步方式一个接一个地执行。最后才会进行请求处理。\n\n### 路由级中间件\n\n路由级中间件用法与应用级中间件类似。唯一的区别是它绑定到\
  \ `express.Router()` 方法的实例上。\n\n下面的示例代码解释了应用级中间件与路由级中间件之间的区别：\n\n```javascript\n\
  // 路由级中间件\nconst express = require('express');\nconst app = express();\nconst router\
  \ = express.Router();\n\n// 一个没有挂载路径的中间件函数。此代码将对路由的每个请求执行\nrouter.use((req, res,\
  \ next) => {\n  console.log('Time:', Date.now())\n  next()\n})\n\n// /order/:id\
  \ 路径的处理器，渲染一个特殊页面\nrouter.get('/order/:id', (req, res, next) => {\n  res.render('order\
  \ detail page')\n})\n\n// 将路由挂载到 app 上\napp.use('/', router)\n\n// 使用路由并对任何透过的请求返回\
  \ 401\napp.use('/customer/settings', router, (req, res) => {\n  res.sendStatus(401).redirect('error\
  \ page')\n})\n```\n\n在这个示例中，我们同时使用了应用级中间件和路由级中间件。在这里，与 `express.Router()` 使用的路由是路由级中间件，而与\
  \ `app.use()` 使用的则是应用级中间件。\n\n### 错误处理中间件\n\nExpress.js 内部的错误处理指的是检测和处理同步发生的错误。Express\
  \ 包含一个默认的错误处理器，因此你不需要从一开始就开始创建自定义的错误处理机制。\n\n错误处理中间件遵循将错误作为第一个参数的理念，正因如此，在四个强制参数中，第一个参数总是\
  \ `err`。这些参数包括 `err`、`req`、`res` 和 `next`。如果我们不传递其中任何一个，它将被解释为普通中间件，这将导致错误处理器失败。\n\
  \n```javascript\napp.use((err, req, res, next) => {\n  console.error(err.stack);\n\
  \  res.status(500).send('internal error');\n})\n```\n\n### 内置中间件\n\n从 4.x 版本开始，以前包含在\
  \ Express 中的中间件现在被视为第三方包并单独安装。Express 拥有以下内置函数：\n\n- `express.static`: 用于提供静态资源，如\
  \ HTML 文件等\n- `express.json`: 用于解析带有 JSON 负载的传入请求。\n- `express.urlencoded`: 用于解析带有\
  \ URL 编码负载的传入请求。\n\n### 第三方中间件\n\n当我们需要添加额外的支持或功能时，我们使用第三方 Express 应用。在下面的示例中，使用\
  \ `body-parser` 函数来解析作为请求体参数传递的不同数据格式：\n\n```bash\nnpm install body-parser\n```\n\
  \n```javascript\nconst express = require('express')\nconst app = express()\nconst\
  \ bodyParser = require('body-parser')\n\n// 加载添加到 express 中的正体解析中间件\napp.use(bodyParser())\n\
  ```\n\n## 服务静态文件\n\n使用 Node.js 和 Express.js 开发的 Web 应用需要提供静态文件，如图像、CSS 和 JavaScript。可以使用\
  \ Express 自带的 `express.static` 内置函数完成：\n\n```javascript\nconst express = require('express')\n\
  ```\n\n其中 `root` 参数指定了从哪个位置提供静态资源。下面的示例将允许你从应用程序内部的 `public` 目录加载静态内容：\n\n```\n\
  app.use(express.static('public'))\n```\n\n// 现在，可以从 public 目录加载列出的文件：\n- http://localhost:3000/static/images.jpg\n\
  - http://localhost:3000/static/css.css\n- http://localhost:3000/static/js/app.js\n\
  - http://localhost:3000/static/images/bg.png\n- http://localhost:3000/static/hello.html\n\
  \n我们还可以创建一个虚拟路径，将文件映射到服务器上物理并不存在的不同位置：\n\n```javascript\napp.use('/static', express.static('public'))\n\
  ```\n\n// 这将帮助我们通过 /static 前缀提供 public 目录中的文件。\n- http://localhost:3000/static/images.jpg\n\
  - http://localhost:3000/static/css.css\n- http://localhost:3000/static/js/app.js\n\
  - http://localhost:3000/static/images/bg.png\n- http://localhost:3000/static/hello.html\n\
  \n## Express 应用生成器\n\n我们可以使用名为 `express-generator` 的工具自动生成 Express 应用。使用以下命令可以安装\
  \ `express-generator` 工具：\n\n```bash\nnpx express-generator\n```\n\n使用以下命令可以查看所有的命令选项：\n\
  \n| 标志 | 完整版本 | 描述 |\n| :--- | :--- | :--- |\n| -h | `--help` | 使用信息 |\n| -e | `--ejs--hbs--pug`\
  \ | 添加 ejs、hbs、pug 引擎支持 |\n| -H | `--hogan--no-view` | 添加 hogan 引擎支持，不生成视图 |\n|\
  \ -v | `--view <engine>` | 添加视图引擎（ejs, hbs, pug, jade, twig），默认 jade |\n| -c | `--css\
  \ <engine>` | 添加样式表引擎（less, stylus, compass, sass），默认 CSS |\n\n## 总结\n\n本章涵盖了 Express.js\
  \ 的基础知识，并展示了如何使用该框架构建轻量级后端应用服务器。我们还探索了 框架的核心功能，如路由、中间件和 HTTP 方法。\n\n在下一章中，我们将涵盖\
  \ Restful 服务的基础知识，并学习如何结合 Express 和 HTTP 模块创建自己的 RESTful API。\n\n## 问题\n\n1. 下列哪个\
