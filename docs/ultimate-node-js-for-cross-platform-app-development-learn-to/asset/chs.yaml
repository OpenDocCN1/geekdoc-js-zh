  \n## 创建 Mongoose 模型\n\n模型是根据 `Schema` 定义编译的高级构造函数。模型的实例被称为文档（document）。模型负责从底层 MongoDB\
  \ 数据库中创建和读取文档。\n\n在 `/web-app` 文件夹内创建一个名为 `models` 的文件夹。现在添加 `employee.js` 文件并添加以下代码。\n\
  \n```javascript\nvar mongoose = require('mongoose');\n\n// Employee 实体的 schema 定义\n\
  var empSchema = new mongoose.Schema({\n  email: {\n    type: String,\n    required:\
  \ true,\n    unique: true\n  },\n  firstName: {\n    type: String,\n    default:\
  \ ''\n  },\n  lastName: {\n    type: String,\n    default: ''\n  },\n  phone: String,\n\
  \  dob: Date\n});\n\n// 创建 Employee 模型\nvar employee = new mongoose.model('Employee',\
  \ empSchema);\nmodule.exports = employee;\n```\n\n接下来，我们将查看两个最重要的部分：路由（Routes）和控制器（Controllers）。\n\
  \n*   **路由 (Routing)** 是实际创建和托管 API 的部分。\n*   **控制器 (Controllers)** 是用于为 API 执行的不同操作编写独立代码的函数，并导入到路由部分以保持操作处理更加顺畅。\n\
  \    这些控制器可以在内部直接使用模型调用，或者我们可以创建单独的服务来抽象底层数据层的内部功能。\n\n这些是在 `REST` 服务下定义的不同类型的 `HTTP`\
  \ 请求，用于处理用户调用的所有操作，如获取数据、创建新记录等。它们实现了客户端与服务器之间的交互，并作为一种请求-响应协议工作。\n\n下表列出了一些流行的\
  \ HTTP 请求：\n\n| 方法 (Method) | 说明 (Description) |\n| :--- | :--- |\n| GET | 用于从指定的资源请求数据\
  \ |\n| POST | 用于向服务器发送数据以创建/更新资源 |\n| PUT | 用上传的内容替换目标资源的所有当前表示 |\n| DELETE | 删除\
  \ URI 提供的目标资源的所有当前表示 |\n| PATCH | PATCH 方法对资源进行部分修改 |\n\n**表 6.1：** HTTP 方法\n\n\
  像 Node JS 这样的系统大多基于 MVC（模型-视图-控制器）架构。其核心思想是它有助于关注应用程序的特定部分并并在模块化的基础上进行构建。\n\nMVC\
  \ 模式的关键组件有：\n\n*   **模型 (Model)**：它代表存储在数据库中的数据的结构和约束。\n*   **视图 (View)**：它是根据用户需要向用户呈现所需数据的方式。\n\
  *   **控制器 (Controller)**：该部分控制用户请求并生成提供用户的用户的响应。\n\n## 添加控制器\n\n像 Node JS 这样的系统大多基于\
  \ MVC（模型-视图-控制器）架构。其核心思想是它有助于关注应用程序的特定部分并并在模块化的基础上进行构建。\n\nMVC 模式的关键组件有：\n\n*  \
  \ **模型 (Model)**：它代表存储在数据库中的数据的结构和约束。\n*   **视图 (View)**：它是根据用户需要向用户呈现所需数据的方式。\n\
  *   **控制器 (Controller)**：该部分控制用户请求并生成提供用户的用户的响应。\n\n## 定义路由\n\n像 Node JS 这样的系统大多基于\
  \ MVC（模型-视图-控制器）架构。其核心思想是它有助于关注应用程序的特定部分并并在模块化的基础上进行构建。\n\n\n\n\n模板引擎在后台使用一个类似于\
  \ HTML 文件的模板文件（带有特殊的标签或语法），以及一个用于绑定值和生成动态内容的数据对象。然后，模板引擎解析 HTML 模板文件，用从 JavaScript\
  \ 请求中获取的数据替换所有占位符，并将最终的 HTML 输出发送到浏览器进行渲染。模板引擎也可以用于服务器端，我们可以在将最终内容发送到客户端渲染之前生成 HTML\
  \ 输出；或者我们可以将原始内容发送到客户端，在浏览器中使用 JavaScript 生成并渲染 HTML 输出。\n\n接下来的图表解释了模板引擎在 Node.js\
  \ 中是如何运作的。\n\n![](img/7.1_template_example.jpg)\n\n**图 7.1：** 模板引擎示例\n\n在这里，我们可以看到客户端发出的任何请求都由\
  \ `Node.js` `express` 服务器处理，模板引擎作为 `middleware`（中间件）使用，处理所有的静态 `HTML` 页面并通过将数据绑定到\
  \ `templates` 中来更新内容，最后将 `HTML` 文件返回给客户端浏览器。\n\n以下是用于 Node.js 的流行模板引擎：\n\n*   `Jade`\n\
  *   `Vash`\n*   `EJS`\n*   `Mustache`\n*   `Dust.js`\n*   `Nunjucks`\n*   `Handlebars`\n\
  *   `atpl`\n*   `haml`\n\n## 模板引擎的优势\n\n以下是在 Node.js 内部使用模板引擎的一些主要优势。\n\n*   提高开发人员效率\n\
  *   提高可读性和可维护性\n*   更快的性能\n*   最大化客户端处理\n*   一个模板用于多个页面\n*   模板可以从内容分发网络 (CDN) 访问\n\
  \n# 模板引擎的缺点\n\n以下是在 Node.js 内部使用模板引擎的一些主要缺点：\n\n*   随着时间的推移，嵌入的 `HTML` 和 `JS` 代码会变得难以维护。\n\
  *   在构建大型应用时，我们无法高效地使用模板引擎将所有网页渲染为完整的并交给任何 JavaScript 库（如 `Angular`/`React`）。\n\
  *   模板引擎增加了额外的复杂性和抽象，这使得调试和测试变得困难。\n*   这要求你学习可能与其他工具或语言不兼容的新语法和规则。\n*   取决于模型和数据的规模和复杂性，在开发实时应用时可能会出现性能问题和局限性。\n\
  *   模板引擎可能不支持构建网页所需的所有功能，例如交互性、状态管理或路由。\n\n# 模板引擎的核心组件\n\n以下是包含在模板引擎中的核心组件：\n\n\
  *   它应该是可以独立编译和运行的（不需要额外的 Web 服务器）。\n*   它应该能够生成各种类型的输出，包括文本数据、`json`、`xml` 等。\n\
  *   它的设计目标应该是简单、小型、轻量级且易于使用，适用于开发没有复杂性的实时应用。\n*   它的模板语法应该非常清晰直观。\n*   它应该具有良好的语法错误检查和良好的错误报告，这可以极大地帮助编写和调试模板。\n\
  *   模板引擎的一些额外功能包括：\n    *   占位符/字符串替换\n    *   条件\n    *   循环\n    *   宏（带参数）\n\
  \    *   有限的“嵌入式表达式”（格式化、算术等）\n\n## 使用模板进行 HTML 渲染\n\n当我们构建任何支持模板引擎的服务器端应用时，模板引擎会将模板文件内部所有的变量替换为实际值并生成最终的\
  \ `HTML` 内容，然后由客户端进行渲染。这使得后端开发人员能够以更少的努力和复杂性快速构建我们的应用程序。\n\n让我们在根目录下的 `server.js`\
  \ 文件中添加以下代码。\n\n```javascript\nconst express = require(‘express’);\nconst app =\
  \ express();\nconst path = require(‘path’);\nconst PORT = 3000;\n\n// 在 app 上设置模板引擎。\n\
  app.set(‘view engine’, ‘ejs’);\n\n// views 位置\napp.set(‘views’, path.join(__dirname,\
  \ ‘/views’));\n\napp.get(‘/’, (req, res) => {\n  res.render(‘home.ejs’, { msg: “Hello\
  \ World !!”} });\n});\n\napp.listen(PORT, () => console.log(‘listening on port ‘\
  \ + PORT));\n```\n\n现在我们将在 views 文件夹中创建一个名为 `views/home.ejs` 的新文件。这将包含一些与首页相关的的内容。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>Home</title>\n</head>\n<body>\n  <h1>The Home Page</h1>\n  <h1>Weclome\
  \ Message: <%= msg %> </h1>\n</body>\n</html>\n```\n\n在这个示例中，我们尝试展示了如何使用 `ejs` 模板引擎编写\
  \ `html`。如你所见，我们正在设置欢迎消息并更新首页的 `html` 内容以显示该消息。\n\n# 探索 EJS 标签\n\n我们可以通过以下方式使用 EJS\
  \ 标签：\n\n*   `<%= %>`：用于输出表达式的结果，并进行转义处理以防止 XSS 攻击。\n*   `<%- %>`：用于输出不经转义的提供的值。\n\
  *   `<% %>`：用于嵌入 JavaScript 代码，如控制流、条件等。\n*   `<%# %>`：用于在文件中注释。\n\n## 何时使用 EJS？\n\
  \n在大多数需要生成大量 JavaScript 输出的情况下，我们使用 EJS。让我们通过一个例子来理解。假设我们要为网页生成一个员工列表。\n\n### 案例\
  \ 1\n\n我们可以使用传统的开发网页的方式来遍历数组。\n\n```javascript\nvar html = “<h1>”+ employeeObj.description\
  \ + ”</h1>”;\nhtml += “<<ul>>”;\nfor(var i=0; i< employees.length; i++)\n{\nhtml\
  \ += ”<li><a href=’employees/” + employees[i] + ’>”;\nhtml += employees[i]+”</a></li>”;\n\
  }\nhtml += “</ul>”;\n```\n\n在这里我们可以看到语法很难理解，编写这段代码需要大量的精力。\n\n### 案例 2\n\n使用 EJS\
  \ 模板引擎可以轻松实现的功能。\n\n```html\n<h1><%=title%></h1>\n<ul>\n<%for (var i=0;i<employees.length;\
  \ i++){%>\n  <li>\n    <a href='employees/<%= employees[i] %>'>></a>\n    <%=employees[i]%>\n\
  \  </li>\n<%}%>\n</ul>\n```\n\n在这里我们可以注意到，几行代码的逻辑看起来非常清晰且易于理解。\n\n## 使用 EJS 创建动态内容\n\
  \n以下步骤将用于创建一个 Node.js Web 应用，以理解如何使用 `ExpressJS` 和 `EJS` 模板引擎。在这里我们将看到如何在网页上渲染用户数据。\n\
  \n### 步骤 1：安装 `express` 和 `ejs` 模板引擎的依赖\n\n```bash\nnpm install express ejs –save-dev\n\
  ```\n\n\n\n\n```javascript\nconst path = require('path');\n\nconst PORT = 3000;\n\
  \n// setting the templating engine on the app.\napp.set('view engine', 'ejs');\n\
  \n// views location\napp.set('views', path.join(__dirname, '/views'));\n\napp.listen(PORT,\
  \ () => console.log('listening on port ' + PORT));\n```\n\n我们创建了 express 应用程序。该应用程序监听在\
  \ `3000` 端口。\n\n### 步骤 3：设置模板引擎\n\n接下来的行代码告诉 express 服务器我们想要使用 EJS 作为我们的模板引擎。\n\n\
  ```javascript\napp.set('view engine', 'ejs');\n```\n\n### 步骤 4：设置视图文件夹\n\n让我们创建一个名为\
  \ `views` 的文件夹。视图文件夹将包含我们所有的模板。\n\n![](img/7.4_employee_list_view.jpg)\n\n**图 7.4：**\
  \ 查看 express 应用程序内部的文件夹\n\n在这里我们添加了一个名为 `employeeList.ejs` 的新文件，它将生成我们的 HTML 页面以显示员工列表。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>List of Employees!</title>\n</head>\n<body>\n  <h1>List of all Employees!</h1>\n\
  \  <ul>\n    <% for (let emp of employees) { %>\n      <li> <%=emp.name %> </li>\n\
  \    <% } %>\n  </ul>\n</body>\n</html>\n```\n\n第二个模板是 `home.ejs`，它将被用于在首页上显示欢迎消息。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>Home</title>\n</head>\n<body>\n  <h1>The Home Page</h1>\n  <h1>Weclome\
  \ Message: <%= msg %> </h1>\n</body>\n</html>\n```\n\n### 步骤 5：设置路由\n\n我们将为首页和员工列表页面创建路由。\n\
  \n```javascript\n// home route\napp.get('/', (req, res) => {\n  res.render('home.ejs',\
  \ {\n    msg: \"Hello World !!\"\n  });\n});\n\n// employees route\napp.get('/employees',\
  \ (req, res) => {\n  const employees = [{\n    name: \"test\",\n    salary: 20000,\n\
  \    age: 30,\n    doj: \"12-12-2000\"\n  },\n  {\n    name: \"test\",\n    salary:\
  \ 20000,\n    age: 30,\n    doj: \"12-12-2000\"\n  }\n  ];\n  res.render('employeesList.ejs',\
  \ {\n    employees\n  });\n});\n```\n\n正如我们所看到的，默认路由 `/` 在访问时会显示或渲染 `home.ejs` 页面。同时，`/employees`\
  \ 会渲染 `employeesList.ejs` 页面。\n\n我们将 `employees` 对象传递给渲染对象，以便将员工属性传递到网页并进行渲染。\n\n\
  ### 步骤 6：模板我们的视图文件\n\n在这里我们可以从服务器后端传递员工数据，我们只需要使用模板引擎语法在我们的网页上显示它即可。\n\n在我们的 HTML\
  \ 代码中，我们将使用 `<% %>` 语法来添加循环、条件等动态内容，并以此生成 HTML 作为响应。\n\n```html\n<ul>\n  <% for\
  \ (let emp of employees) { %>\n    <li> <%=emp.name %> </li>\n  <% } %>\n</ul>\n\
  ```\n\n### 步骤 7：运行应用程序\n\n在运行应用程序后，你将获得以下输出，可以通过提供的 URL 进行访问。\n\n**首页**\nhttp://localhost:3000/home\n\
  \n一旦你在浏览器中打开上述 URL，你将看到如 [图 7.5] 所示的如下首页。\n\n![](img/7.5.jpg)\n\n**图 7.5：** 首页视图的输出\n\
  \n**员工列表页面**\nhttp://localhost:3000/employees\n\n一旦你在浏览器中打开上述 URL，你将看到如 [图 7.6]\
  \ 所示的如下员工列表页面。\n\n![](img/7.6_employees_list_output.jpg)\n\n**图 7.6：** 员工列表视图的输出\n\
  \n## 结论\n\n在本章中，我们涵盖了一些内容。\n\n\n\n\n\n*   `res`: 此用于定义 HTTP 响应参数。\n\n*   `next`:\
  \ 此用于定义回调参数。\n\n    ```javascript\n    /**\n     * @param {Object} `request - Express\
  \ 请求对象（通常命名为 `req``\n     * @param {Object} `response - Express 响应对象（通常命名为 `res``\n\
  \     * @param {Function} `next - Express next() 函数`\n     */\n    function middlewareFunction(request,\
  \ response, next) {\n      // 执行某些操作\n    }\n```\n\n图 8.1 解释了定义中间件的过程以及处理中间件时使用的不同关键组件。\n\
  \n![](img/8.1_usage.jpg)\n\n**图 8.1:** 中间件用法\n\n在这里，我们定义了一个 express 路由 ('/') 的 GET\
  \ 方法，其第一个参数是 URL 路径，用于访问应用程序的根路径，第二个参数是一个带有 `req`、`res` 和 `next` 参数的中间件函数。\n\n#\
  \ 理解 Next() 函数(#toc.xhtml_s180a)\n\n`Next()` 函数在应用程序的请求和响应周期中起着重要作用。它是一个中间件函数，在调用时会运行下一个中间件函数。换句话说，如果当前中间件函数没有完成请求和响应周期，则执行\
  \ `Next()` 函数。需要注意的是，中间件的执行永远不会在请求队列中挂起。\n\n![](img/8.2_middleware-processing.jpg)\n\
  \n**图 8.2:** 中间件执行步骤\n\n在前面的图中，我们添加了多个中间件函数，这些函数用于执行特定的逻辑。执行逻辑后，控制通过 `Next()` 函数移动到下一个中间件。\n\
  \n# 在 Express 中使用内置中间件(#toc.xhtml_s181a)\n\n中间件函数已成为使用 Express 应用构建的应用程序的重要部分。它们可以获取\
  \ HTTP 请求和响应对象，并可以结束 HTTP 请求，也可以将其转发给另一个中间件函数以协助准备。中间件功能与 Express 应用程序中的一个或多个路由处理器连接，并在从应用程序接收\
  \ HTTP 请求到向调用者发送 HTTP 响应期间进行分组执行。\n\nExpress 中的每个 HTTP 请求和响应都可以被中间件有效使用。事实上，中间件可以自主地终止\
  \ HTTP 请求，也可以将请求交换给另一个中间件函数。通过 express 中间件的帮助，我们可以无缝地构建多功能的单页、混合和多页 Web 应用程序。\n\n\
  # Express 中间件类型(#toc.xhtml_s182a)\n\n以下是 Express 中使用的不同类型的中间件：\n\n*   应用级中间件 `app.use`\n\
  *   路由级中间件 `router.use`\n*   内置中间件 `express.static`、`express.json`、`express.urlencoded`\n\
  *   错误处理中间件 `app.use(err,req,res,next)`\n*   第三方中间件 `body-parser`、`cookie-parser`\n\
  \n![](img/8.3_middleware_types.jpg)\n\n**图 8.3:** 不同类型的中间件\n\n在前面的图中，我们可以看到在请求-响应过程中调用中间件函数之前执行了哪些步骤。\n\
  \n在接下来的章节中，我们将尝试详细介绍一些最流行的中间件。\n\n# 应用级中间件(#toc.xhtml_s183a)\n\n以下语法用于添加通用的应用级中间件：\n\
  \n```javascript\napp.use(function)\n```\n\n在应用级中间件中，我们可以使用多个中间件函数，这可以帮助我们转换或验证请求和响应。\n\
  \n例如，我们可以创建一个类似 '/response' 的应用路由，它会返回一个响应以及使用中间件函数 `requestTime()` 捕捉的请求时间。\n\n\
  ```javascript\nvar express = require('express')\nvar app = express()\nvar requestTime\
  \ = function (req, res, next) {\n  req.requestTime = Date.now()\n  next()\n}\napp.use(requestTime)\n\
  app.get('/response', function (req, res) {\n  var responseText = 'Hello World!<br>'\n\
  \  responseText += '<small>Requested at: ' + req.requestTime + '</small>'\n  res.send(responseText)\n\
  })\napp.listen(3000, (req, res) => {\n  console.log('server started running on 3000')\n\
  })\n```\n\n在前面的代码中，`getEmployees()` 路由必须通过 `authUser` 中间件由后端进行验证，如果身份验证成功，其余操作将由\
  \ `Next()` 函数执行。如果用户未通过验证，将抛出一个 HTTP 状态码为 401（未经授权）的错误。\n\n# 路由级中间件(#toc.xhtml_s184a)\n\
  \n以下语法用于添加路由级中间件：\n\n```javascript\nrouter.use((req, res, next) => {\n  // 操作\n\
  \  next()\n})\n```\n\n路由级中间件与应用级中间件非常，，工作几乎相同，但它可以被创建并限制在 `express.Router()` 实例上。\n\
  \n```javascript\nconst router = express.Router()\n```\n\n`express.Router()` 允许你将中间件限制在特定的路由。如果你为许多路由需要相同的中间件，而不是所有路由，那么它们将非常有价值。\n\
  \n```javascript\nconst express = require('express');\nconst app = express();\nconst\
  \ router = express.Router()\n\nrouter.use((req, res, next) => {\n  // 操作\n  next()\n\
  })\nrouter.get(\"/employees\", (req, res, next) => {\n  next()\n}, (req, res, next)\
  \ => {\n  res.json({\n    status: true,\n    id: req.params\n  })\n})\n\napp.use('/',\
  \ router)\napp.listen(3000, (req, res) => {\n  console.log('server started running\
  \ on 3000')\n})\n```\n\n# 内置中间件(#toc.xhtml_s185a)\n\n以下语法用于添加内置中间件：\n\n```javascript\n\
  app.use({\n  urlencoded: false\n});\napp.use(bodyParser.urlencoded({\n  extended:\
  \ false\n}))\napp.use(bodyParser.json())\n```\n\n此内置中间件不依赖于‘Connect’工作，与之前的中间件版本不同，Express\
  \ 4.X 的适配作为一个模块运行。\n\n通常，在中间件类型之下，你可以如下利用以下三个内置中间件：\n\n*   `static`: 作为应用程序的静态资源（HTML\
  \ 记录、图片等）。\n*   `json`: 通过与 JSON 载荷结合来处理传入请求。\n*   `urlencoded`: 用于以 URL 编码的形式组合请求体。\n\
  \n```javascript\nconst express = require('express');\nconst bodyParser = require('body-parser');\n\
  const { error } = require('console');\nconst app = express();\n\napp.use({\n  urlencoded:\
  \ false\n});\napp.use(bodyParser.urlencoded({\n  extended: false\n}))\napp.use(bodyParser.json())\n\
  \napp.listen(5000, (req, res) => {\n  console.log('server started running on port')\n\
  })\n```\n\n# 使用中间件进行错误处理(#toc.xhtml_s186a)\n\n以下语法用于添加错误处理中间件：\n\n```javascript\n\
  app.use((err, req, res, next) => {\n  console.log(err);\n});\n```\n\nExpress.js\
  \ 擅于处理运行 Express 应用程序时可能任何错误。Express 具有默认错误处理程序，它可以处理所有的错误处理功能，并与其他任何类型的中间件函数相似。\n\
  \n我们可以从下面的代码中注意到，错误处理器与其他中间件的区别在于，错误处理中间件有**四个**参数，而任何其他中间件只有**三个**参数：\n\n```javascript\n\
  const express = require('express');\nconst bodyParser = require('body-parser');\n\
  ```\n\n\n\n\n\n```javascript\nconst { error } = require('console');\n\nconst app\
  \ = express();\n\napp.get('/error', (req, res, next) => {\n  next(new Error('error!'));\n\
  });\n\napp.use((err, req, res, next) => {\n  console.log(err);\n  if (!res.headersSent)\
  \ {\n    res.status(500).send(err.message);\n  }\n});\n\napp.listen(5000, (req,\
  \ res) => {\n  console.log('server started running on port')\n})\n```\n\n### 第三方中间件\n\
  \n使用以下语法可以添加第三方中间件：\n\n```javascript\nconst bodyParser = require('body-parser');\n\
  \napp.use(bodyParser.urlencoded({\n  extended: false\n}))\n```\n\n在很多不同的情况下，我们可能需要在后端操作中包含一些额外功能。在这种情况下，我们需要安装第三方包，该包可以应用于\
  \ `express` 程序的应用层级或路由层级别。\n\n```javascript\nconst express = require('express');\n\
  const bodyParser = require('body-parser');\nconst { error } = require('console');\n\
  const app = express();\napp.use(bodyParser.urlencoded({\n  extended: false\n}))\n\
  app.use({\n  urlencoded: false\n})\napp.use(bodyParser.json())\n\nfunction authUser(req,\
  \ res, next) {\n  if(isUserVerified){\n    next();\n  }else{\n    throw error(\"\
  User not Authorized\");\n  }\n}\napp.post('/employees', authUser, (req, res) =>\
  \ {\n  var list = [{\n    name: 'wrewr',\n    salary: '3423'\n  }];\n  res.json({\n\
  \    \"status\": true,\n    \"data\": list\n  });\n});\napp.listen(3000, (req, res)\
  \ => {\n  console.log('server running on port')\n})\n```\n\n在前面的代码中，所有指定的中间件（如 `bodyParser.urlencoded`\
  \ 和 `bodyParser.json()`）将与 `content-type` 请求处理器一起，用解析后的主体填充 `req.body` 属性。\n\n#\
  \ 第三方中间件列表\n\n表 8.1 显示了 express 应用中常用的第三方中间件列表：\n\n| 名称 | 描述 | 语法 |\n| :--- | :---\
  \ | :--- |\n| body-parser | 解析 HTTP 请求主体。另见 body, co-body 和 raw-body | `express.bodyParser`\
  \ |\n| compression | 压缩 HTTP 响应 | `express.compress` |\n| connect-rid | 生成唯一的请求\
  \ ID | `NA` |\n| cookie-parser | 解析 cookie 请求头并填充 req.cookies。另见 cookies 和 keygrip\
  \ | `express.cookieParser` |\n| cookie-session | 建立基于 cookie 的会 | `express.cookieSession`\
  \ |\n| cors | 使用各种选项启用跨源资源共享 (CORS) | `NA` |\n| errorhandler | 开发阶段错误处理/调试 | `express.errorHandler`\
  \ |\n| method-override | 使用标头覆盖 HTTP 方法 | `express.methodOverride` |\n| morgan |\
  \ HTTP 请求记录器 | `express.logger` |\n| multer | 处理多部分表单数据 | `express.bodyParser` |\n\
  | response-time | 记录 HTTP 响应时间 | `express.responseTime` |\n| serve-favicon | 提供\
  \ favicon | `express.favicon` |\n| serve-index | 为给定路径提供目录列表 | `express.directory`\
  \ |\n| serve-static | 提供静态文件 | `express.static` |\n| session | 建立基于服务器的会（仅限开发阶段）\
  \ | `express.session` |\n| timeout |为 HTTP 请求处理设置超时时间 | `express.timeout` |\n| vhost\
  \ | 创建虚拟域名 | `express.vhost` |\n\n**表 8.1：** 第三方中间件列表\n\n# 创建我们的第一个自定义中间件\n\n从本章开始，我们已经看到了\
  \ Node.js 应用中不同类型中间件的工作。现在，让我们看看如何从头创建自定义的 Node.js 中间件，以便更好地理解。\n\n通过 Node.js 中间件，我们将能够运行任何代码，调整请求和响应对象，停止任何正在进行的请求-响应周期，并在一个中间件完成后随后调用堆栈中的下一个中间件。\n\
  \n```javascript\nfunction myCustomMiddleware(req, res, next) {\n  // 在此处编写自定义中间件...\n\
  }\n```\n\n让我们尝试创建一个自定义中间件，它将在请求处理发生之前对用户进行身份验证。\n\n在这里，我们创建了一段单独的代码从用户请求标头获取用户详情：\n\
  \n```javascript\n// getToken 将基于你的身份验证策略\nconst user = require(\"../getUsers\");\n\
  ```\n\n在 `setCurrentUser()` 函数中，我们将使用授权请求头从请求中获取令牌，并传递给 `getUser` 函数以检索用户详情。一旦获取用户详情：\n\
  \n```javascript\nmodule.exports = function setCurrentUser(req, res, next) {\n  //\
  \ 从标头获取令牌\n  const token = req.header(\"authorization\");\n  // 查找用户\n  getUser(token).then(user\
  \ => {\n    // 添加用户对象\n    req.user = user;\n    // 调用下一个中间件\n    next();\n  });\n\
  };\n```\n\n为了测试前面的代码，让我们创建一个 `server.js` 文件并添加内容：\n\n```javascript\nconst express\
  \ = require('express');\nconst setCurrentUser = require('./setCurrentUser');\nconst\
  \ isLoggedIn = require('./isLoggedIn');\n\nconst app = express();\napp.use(setCurrentUser);\n\
  app.get(\"/users\", isLoggedIn, function(req, res) {\n  // 获取用户\n  res.send(req.user);\n\
  });\n```\n\n## 中间件链\n\n中间件可以链式。我们可以在 `app.use()` 或 `app.METHOD()` 中使用多个中间件，并使用逗号（）将它们隔开。\n\
  \n以下语法用于中间件：\n\n`app.get(path, (req, res, next) => {}, (req, res) => {})`\n\n在下面的代码中，我们有不同类型的中间件如\
  \ `middleware1`、`middleware2`、`middleware3` 等。\n\n```javascript\nconst middleware1\
  \ = (req, res, next) => {\n  // 执行代码\n  next()\n}\n\nconst middleware2 = (req, res,\
  \ next) => {\n  // 执行代码\n}\n\nconst middleware3 = (req, res, next) => {\n  // 执行代码\n\
  }\n```\n\n所有这些中间件都可以连续链，并按照它们定义的顺序调用：\n\n```javascript\napp.get(\"/\", middleware1,\
  \ middleware2, middleware3);\n// 或者\napp.get(\"/\", function(req, res, next){\n\
  \  // 第一个中间件\n  next()\n}, function(){\n  // 第二个中间件\n})\n```\n\n在这里，客户端请求正由 express\
  \ 服务器处理，在处理请求时，在路由器返回响应之前，会执行一些额外的中间件函数，如身份验证等。\n\n![](img/8.4_middleware_chaining.jpg)\n\
  \n**图 8.4：** 中间件链\n\n\n\n\n\n*   [Node.js 视频](https://www.oreilly.com/library/view/nodejs-the/9781838826864/video25_23.html)](https://www.oreilly.com/library/view/nodejs-the/9781838826864/video25_23.html)\n\
