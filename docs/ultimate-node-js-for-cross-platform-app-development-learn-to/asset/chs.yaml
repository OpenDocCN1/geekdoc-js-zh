  \ | 如果路径是目录则返回 true |\n| `isSymbollink()` | 如果路径是符号链接则返回 true |\n| `isPipe()` |\
  \ 如果路径是管道则返回 true |\n| `isSocket()` | 如果路径是套接字则返回 true |\n| `isFIFO()` | 如果路径是 FIFO\
  \ 则返回 true |\n| `isCharacter()` | 如果路径是字符设备则返回 true |\n| `isBlock()` | 如果路径是块设备则返回\
  \ true |\n| `resolve()` | 返回绝对路径 |\n| `join()` | 使用平台特定的分隔符连接路径段 |\n| `normalize()`\
  \ | 返回归一化的路径 |\n| `extname()` | 返回文件的扩展名 |\n\n\n\n\n\n| 1. | `path.normalize(p)`\
  \ | 用于归一化字符串路径，处理 `..` 和 `.` 部分 |\n| 2. | `path.join([path1][, path2][, ...])` |\
  \ 用于将所有参数合并并归一化生成的路径 |\n| 3. | `path.resolve([from ...], to)` | 用于解析绝对路径 |\n| 4.\
  \ | `path.isabsolute(path)` | 确定路径是否为绝对路径。无论工作目录如何，绝对路径始终解析到相同的位置 |\n| 5. | `path.relative(from,\
  \ to)` | 用于计算从 `from` 到 `to` 的相对路径 |\n| 6. | `path.dirname(p)` | 返回路径的目录名。类似于 `unix`\
