  \ (!req.body) {\n    res.status(400).send({\n      message: “Request is empty!”\n\
  \    });\n    return;\n  }\n}\n```\n\n在 `src/services` 文件夹内再创建一个名为 `user-service.js`\
  \ 的文件并添加以下代码：\n\n```javascript\nconst database = require(\"../models”);\nconst configuration\
  \ = require(\"../config/config-jwt.js”);\nconst User = database.user;\nvar jwt =\
