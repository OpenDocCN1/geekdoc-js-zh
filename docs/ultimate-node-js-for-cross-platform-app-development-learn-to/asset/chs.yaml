  **图 13.1:** 使用 `console.log` 进行调试\n\n# 使用 Node Inspector (#toc.xhtml_s289a)\n\n\
  Node Inspector 是一个原生调试工具，它可以轻松地与 Chrome DevTools 集成，允许用户设置任何断点、检查变量并单步执行 Node.js\
  \ 代码，这与在 浏览器中调试 JavaScript 应用非常相似。\n\n第一步是使用以下命令全局安装 Node Inspector 包。\n\n```bash\n\
  npm install -g node-inspect\n```\n\n下一步是通过运行以下命令以调试模式启动我们的 Node.js 。\n\n我们可以通过导航到\
  \ `chrome://inspect` 来打开 Chrome DevTools，当在浏览器中打开应用程序时，我们可以看到以下输出。\n\nlocalhost:3000/employees?name=Ajay\n\
  \n![](img/13.2_debug_tool.jpg)\n\n**图 13.2:** 使用 Node Inspector 的调试日志输出\n\n最后，我们可以在\
  \ DevTools 内部附加任何调试断点，刷新页面后，我们会注意到代码执行已在断点处停止。\n\n![](img/13.3_Attaching_debugger_devtools.jpg)\n\
  \n**图 13.3:** 在 Chrome DevTools 中附加调试器\n\n我们还可以检查所有的本地和全局变量以及调用栈，类似于任何使用 JavaScript\
  \ 构建的前端应用。\n\n![](img/13.4.jpg)\n\n**图 13.4:** Chrome DevTools 内部的调用栈和其他细节\n\n#\
  \ 使用 Node.js debug 模块 (#toc.xhtml_s290a)\n\n我们还可以使用 debug 包，它广泛用于为整个应用程序添加调试信息。该包有几个配置，可以使用它们来控制调试行为。\n\
  \n```javascript\nvar debug = require('debug')('http')\n, http = require('http')\n\
  , name = 'My Demo App';\ndebug('Starting %o', name);\nhttp.createServer(function(req,\
  \ res){\n  debug(req.method + ' ' + req.url);\n  res.end('hello world\\n');\n}).listen(5000,\
  \ function(){\n  debug('listening');\n});\n```\n\n在这里，我们使用 required 方法导入了 debug\
  \ 模块，并将引用存储在本地变量 `debug` 中。一旦 debug 引用可用，我们就可以在应用程序内部添加尽可能多的调试行。\n\n# 调试 Express\
  \ 应用 (#toc.xhtml_s291a)\n\n我们将使用以下步骤来学习如何调试任何 Node.js 应用。\n\n# 创建 Node.js 应用 (#toc.xhtml_s292a)\n\
  \n我们将创建一个简单的 Node.js 应用，包含一个产品列表，可以通过提供查询参数中的不同输入进行过滤。\n\n现在，让我们创建一个 `app.js` 文件，我们将用它来编写核心应用逻辑。\n\
  \n```javascript\nconst express = require('express');\nconst app = express();\nconst\
  \ PORT = 3000;\n\n// loops 示例, 使用 /employees 路由\napp.get('/employees', (req, res)\
  \ => {\n  const query = req.params.query;\n  const employees = [{\n    id: 1,\n\
  \    name: \"Ajay Sharma\",\n    salary: 20000,\n    age: 30,\n    doj: \"12-12-2000\"\
  \n  },\n  {\n    id: 2,\n    name: \"John wick\",\n    salary: 20000,\n    age:\
  \ 30,\n    doj: \"12-12-2000\"\n  }\n  ];\n  let filtered = [];\n  if (query) {\n\
  \    if (query.name) {\n      filtered = employees.filter(item => item.name.contains(query.name));\n\
  \    } else if (query.id) {\n      filtered = employees.filter(item => item.id ==\
  \ query.id);\n    } else {\n      filtered = employees\n    }\n  }\n  res.json({\n\
  \    filtered\n  });\n});\napp.listen(PORT, () => console.log('listening on port\
  \ ' + PORT));\n```\n\n在这个应用中，我们简单地获取了一个预定义的员工列表，并运行一些查询参数来返回预期结果。\n\n作为本次练习的一部分，我们将尝试学习如何高效地调试\
  \ Node.js 应用，以识别问题并通过通过一些代码更改来解决它们。\n\n获取所有员工 - http://localhost:3000/employees\n\
  \n按名称过滤员工 - http://localhost:3000/employees?name=john\n\nNode.js 调试过程的下一步是使用 Nodemon\
  \ 包启用调试。\n\n# 使用 \"Nodemon\" 安装 Node.js 调试器 (#toc.xhtml_s293a)\n\nNodemon 是一个用于调试本地系统中任何\
  \ Node JS 应用的调试工具。我们可以全局安装 Nodemon：\n\n```bash\nnpm install -g nodemon\n```\n\n\
  一旦安装了 Nodemon，我们将使用以下命令运行：\n\n```bash\nnodemon app.js\n```\n\n通过运行命令，我们可以通过导航到 `chrome://inspect`\
  \ 来打开 Chrome DevTools，当在浏览器中打开应用程序时，我们可以看到以下输出。\n\nlocalhost:3000/employees?name=Ajay\n\
  \n![](img/13.2_debug_tool.jpg)\n\n**图 13.2:** 使用 Node Inspector 的调试日志输出\n\n最后，我们可以在\
  \ DevTools 内部附加任何调试断点，刷新页面后，我们会注意到代码执行已在断点处停止。\n\n![](img/13.3_Attaching_debugger_devtools.jpg)\n\
  \n**图 13.3:** 在 Chrome DevTools 中附加调试器\n\n我们还可以检查所有的本地和全局变量以及调用栈，类似于任何使用 JavaScript\
  \ 构建的前端应用。\n\n![](img/13.4.jpg)\n\n**图 13.4:** Chrome DevTools 内部的调用栈和其他细节\n\n#\
  \ 在 VS Code 中启动调试 (#toc.xhtml_s294a)\n\nVS Code 为 Node.js 内置调试。要使用它，只需在行旁边设置断点，然后按\
  \ `F5` 开始调试。\n\n或者，你可以使用 `launch.json` 文件来配置你的调试环境。\n\n```json\n{\n  \"version\"\
  : \"0.2.0\",\n  \"configurations\": [\n    {\n      \"name\": \"Launch Program\"\
  ,\n      \"type\": \"node\",\n      \"request\": \"launch\",\n      \"program\"\
  : \"${workspaceFolder}/app.js\"\n    }\n  ]\n}\n```\n\n通过使用这些功能，你可以检查变量、查看调用栈并逐行执行你的代码。\n\
  \n# 使用断点运行调试 (#toc.xhtml_s295a)\n\n在本节中，我们将演示如何使用断点来调试应用。我们将在过滤逻辑应用的行设置断点。\n\n```javascript\n\
  if (query.name) {\n  filtered = employees.filter(item => item.name.contains(query.name));\n\
  }\n```\n\n当代码遇到此断点时，执行将暂停，允许我们检查 `query` 和 `employees` 变量的值。\n\n# 结论 (#toc.xhtml.s296a)\n\
  \n调试 Node.js 应用可能是一项挑战，但有了正确的工具和技术，它可以变成一个更高效、更流畅的过程。通过遵循本文概述的步骤，你可以确保自己已准备好应对开发过程中可能出现的任何问题。确保从大量的日志记录和错误处理开始，使用\
