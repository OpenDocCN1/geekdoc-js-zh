  \n# 第 9 章：认证与授权\n\n## 引言\n在本章中我们将我们将用于保护 Node.js Web 应用安全的认证（Authentication）和授权（Authorization）概念。我们还将学习用于在任何类型的\
  \ Node.js 企业级应用中实现认证和授权的不同技术。\n\n## 结构\n本章将涵盖以下与 Node.js 认证和授权相关的主题：\n\n*   认证与授权简介\n\
  *   认证类型\n*   流行的认证技术\n*   授权简要介绍\n*   授权技术\n*   认证与授权的区别\n*   RESTAPI 的安全防护\n\n\
  ## 认证与授权简介\n认证过程通常用于验证的详细信息，例如用户名、电子邮件、凭据等。相比之下，授权则用于根据某些角色确认他们可以执行的操作。\n\n公司使用认证和授权解决方案根据用户的身份标识（如电子邮件或用户名）来识别用户，并提供对应用程序和\
  \ IT 系统的访问。认证是`确认用户身份的过程`。最流行的认证方式之一是使用用户名和密码。\n\n授权是指在验证用户身份后，允许用户访问某些资源或功能的过程。例如，系统管理员可能获得任何资源的超级用户权限，而标准用户被禁止访问相同的资源。大多数身份访问管理（IAM）解决方案都提供认证和授权功能，用于保护本地和云应用程序、服务以及\
  \ IT 基础设施。IAM 解决方案有助于确保每个用户都有定义的角色和职责，并能够访问所需的资源。\n\n## 认证简要介绍\n认证是通过验证个人的身份（他们声称是谁）来识别访问特定系统的过程。服务器使用认证来确定是谁将访问安全数据。服务器认证通常与用户名和密码结合使用。其他各种方法也可用于服务器认证，例如卡片、视膜扫描、语音识别和指纹。\n\
  \n仅凭认证不能保证登录用户将执行哪些操作，包括他们可以查看或更新哪些文件或数据。\n\n以下是处理用户认证所需的不同类别信息：\n\n*   **你所知道的**：密码是识别可以访问某个会话或事务的用户的最常用方式。\n\
  *   **你所拥有的**：这可以使用移动设备或应用、安全代码或数字身份卡完成。\n*   **你所特征的**：这现在已成为使用生物识别信息（如指纹、视膜扫描或面部识别）识别任何人的流行方式。\n\
  \n让我们通过以下图来理解认证过程。\n\n![](img/9.1_Authentication.jpg)\n\n**图 9.1：** 认证过程示例\n\n在这里，客户端首先在其客户端浏览器上打开一个网页。在登录页面上，用户输入他们在首次注册系统时可能创建的用户名和密码。一旦服务器确认了用户的身份，就会向客户端返回一个有效的令牌，该令牌用于建立安全的请求/响应周期，直到客户端和服务器之间维持活跃的会话。\n\
  \n在客户端注销系统或闲置一段时间后，令牌将过期，其他人将无法访问系统。\n\n## 认证的重要性\n以下是在构建 Web 应用中使用认证的一些关键益处：\n\n\
  *   当服务器需要确切知道是谁在尝试访问数据或托管在该台服务器上的网站时，通常使用服务器认证。\n*   当客户端需要确保其正在访问的是正确的服务器时，需要客户端认证。\n\
  *   为了在两个系统之间建立安全连接，用户必须向服务器和客户端双端验证其身份。\n*   客户端验证过程通常涉及服务器向客户端提供证书，该证书证明服务器属于给定的公司。\n\
  *   认证有助于保护存储在服务器上的数字数据和信息。\n\n## 认证类型\n根据安全级别和应用程序类型，有不同的认证因素或技术如下：\n\n*   **单因素认证\
  \ (Single-factor Authentication)**\n    单因素或单步认证是验证服务器最简单、最常用的方法。这种方法只需要用户输入用户名和密码即可访问系统。\n\
  *   **双因素认证 (Two-factor authentication)**\n    双因素认证需要两次验证来认证任何用户。这不仅需要用户名和密码组合来验证身份，还需要验证只有用户才知道的独特信息，包括一些安全问题（如学校名称、母亲的名字等）或\
  \ OTP。\n*   **多因素认证 (Multi-factor authentication)**\n    这是用于保护大多数客户端服务器关联的最安全、先进且现代的授权技术。它使用两个或多个级别的相互独立的认证因素。这种类型的验证通常由金融机构、银行和执法机构使用。这种认证消除了由身份盗窃、密码泄露等引起的安全问题。\n\
  \n## 流行的认证技术\n现在我们将讨论用于保护使用 Node.js 或其他技术栈构建的现代 Web 应用的一些流行认证技术。\n\n### 基于密码的认证\n\
  这是认证尝试访问系统的用户最简单、最古老的方法之一。对于这种认证，使用特定用户名的密码进行验证。如果用户提供的密码和用户名与系统数据库匹配，则用户通过了认证。\n\
  \n![](img/9.2_password_authentication.jpg)\n\n**图 9.2：** 基于密码的认证过程\n\n### 无密码认证\n\
  使用这种技术，用户不需要在使用用户名的同时提供密码。因此，与其使用密码，不如验证 `OTP` 后，他们会在注册的手机上接收一个 `OTP`（一次性密码）。如果\
  \ `OTP` 匹配成功，将授予用户访问系统的权限；否则，要求他们重新验证身份。\n\n### 2FA/MFA\n\n\n\n\n双因子身份验证/多因素身份验证是我们之前探索过的其他验证技术的组合。这种身份验证过程可以在任何系统上设置，在第一步中，用户可以输入用户名和密码等常规凭据。在通过验证后，系统会要求他们验证一些其他细节，如\
  \ `OTP`、`PIN` 或任何安全问题。这种额外信息用于确保用户凭据不会在互联网上被泄露，并针对非法访问提供额外的安全防护。\n\n## 单点登录 (SSO)\n\
  \nSSO 是一种身份验证方式，允许使用一组凭据访问多个应用程序。例如，在公司内部，所有用户都创建在 `active directory`（活动目录）上，它用于身份验证并提供对该公司域名下所有应用程序的访问。它允许用户登录一次，即可自动登录到来自同一集中化\
  \ `active directory` 的其他系统。\n\n![](img/9.3_sso_authentication.jpg)\n\n**图 9.3:**\
  \ 基于 SSO 的身份验证过程\n\n让我们了解微软 SSO 在后台是如何运作的。\n\n当用户尝试访问任何微软产品套件时，他们将被重定向到 `https://outlook.live.com/`\
  \ 进行登录。一旦用户通过 `MFA` 经过验证（即通过提供用户名、密码以及 `OTP`），他们就可以访问托管在微软域名下的所有其他应用程序。\n\n## 社交认证\n\
  \n这种身份验证技术不需要用户在尝试访问外部系统时输入用户名或密码等凭据。相反，这些用户使用其社交网络登录（如 `Gmail`、`Facebook`、`Microsoft`、`Apple`\
  \ 等）通过其现有凭据进行验证。\n\n![](img/9.4_Social_Authentication.jpg)\n\n**图 9.4:** 基于社交的认证过程\n\
  \n## 授权简介\n\n授权根据某些角色授予某执行特定任务权限的过程。换句话说，授权使能够检查用户是否有权访问文件、图像或数据等资源。它决定了用户可以访问哪些数据。授权通常与身份验证一起工作，以便系统根据用户的凭据允许其进入。一旦他们进入系统，就可以访问特定的数据。\n\
  \n![](img/9.5_Authorization.jpg)\n\n**图 9.5:** 授权过程示例\n\n授权过程始于客户端请求浏览器，用户向系统验证其凭据。一旦验证成功，系统将授予一个\
  \ `authorization token`（授权令牌），用于进一步访问 Web 应用程序。\n\n例如，考虑电子商务应用程序上的客户尝试访问其订单。他们首先使用其邮箱和密码组合登录平台。根据他们的授权角色，客户将能够访问某些。然而然而管理员或员工等特定模块对终端用户是不可见的。\n\
  \n# 授权的重要性\n\n以下是使用授权的主要优势：\n\n* 授权是服务器确定客户端是否可以访问资源文件或数据的过程。\n* 授权通常与身份验证结合，以便服务器对请求访问的客户端是谁有一个大致的了解。\n\
  * 授权所需的身份验证类型可能有所不同；在某些情况下可能需要密码，而在另一些情况下则可能不需要。\n* 在某些情况下，没有权限限制；任何用户只需通过请求即可访问资源或文件。互联网上的大多数网站不需要身份验证或授权。\n\
  \n## 授权技术\n\n在本节中，我们将学习在 `Node.js` 中执行授权的某些不同技术。\n\n## 基于角色的访问控制\n\n基于角色的访问控制 (`RBAC`)\
  \ 根据个人在组织中的角色和个人简介限制对系统或多个系统网络的访问。这已成为高级访问控制系统的主要方法之一，并被大多数组织所采用。\n\n员工可能仅可以使用有效履行其职责所必需的信息。接受可以基于多个因素，如能力、责任和工作资格。此外，对计算机资源的访问可以限制在特定任务上，例如查看、创建或编辑文件。因此，底层员工通常没有访问敏感信息的权限，除非他们执行职责时需要这些。如果你有大量员工并使用第三方和承包商，导致难以准确监控网络访问，这种方法就尤为有用。使用\
  \ `RBAC` 有助于保护公司的敏感数据和关键应用程序。\n\n## JSON Web Token\n\nJSON Web Token (JWT) 是一种广泛使用的\
  \ `JSON`（JavaScript 对象表示）格式，带有一些额外的结构。\n\n根据官方文档：\n\nJSON Web Token (`JWT`) 是一种开放标准\
  \ (`RFC 7519`)，定义了一种紧凑且自包含的方法，以 `JSON object` 的形式在双方之间安全传输信息。这些信息可以被验证和信任，因为经过了数字签名。`JWTs`\
  \ 可以使用密钥（使用 `HMAC` 算法）签名，或使用 `RSA` 或 `ECDSA` 使用公/私钥对进行非对称签名。\n\nJWT 令牌示例：\n\n```\n\
  {\n  \"name\": \"John Doe\",\n  \"email\": \"john@johndoe.com\",\n  \"admin\": true\n\
  }\n```\n\n以下是使用 `JWT` 的主要优势：\n\n* 它们轻量且在客户端应用程序（例如移动应用）中易于使用。\n* 它们是自包含的，这意味着 Liberty\
  \ `JVM` 服务器可以直接消耗令牌，并使用令牌所需的任何内容作为执行请求的身份。\n* 可以使用 `HMAC` 算法使用密钥进行对称签名，或使用私钥进行非对称签名。\n\
  * 它们内置了过期机制。它们可以扩展以涵盖自定义需求。\n\n## SAML\n\n`SAML` 代表安全断言语言（Security Assertion Language）。它是一种向服务提供提供授权信息的开放标准。这些凭据通过数字签名的\
  \ XML 文进行交换。\n\n## OpenID 授权\n\n它帮助客户端根据身份验证验证用户的身份。\n\n## OAuth\n\n`OAuth` 是一种授权协议，允许\
  \ `API` 身份验证并访问请求的资源。\n\n## 身份验证与授权的区别\n\n*[表 9.1]*概述了身份验证与授权之间的区别。\n\n| **身份验证\
  \ (Authentication)** | **授权 (Authorization)** |\n| :--- | :--- |\n| 身份验证是识别用户以提供系统访问的过程\
  \ | 授权是许可访问资源的过程 |\n| 在此过程中，用户或客户端以及服务器都经过验证 | 在此过程中，验证用户是否允许根据定义的策略和规则通过 |\n| 身份验证通常在授权之前执行\
  \ | 授权通常在用户成功身份验证后进行 |\n| 它需要用户的登录详情，如用户名、密码等 | 它需要用户的权限或安全级别 |\n| 数据通过 `Token IDs`\
  \ 提供 | 数据通过 `access tokens`（访问令牌）提供 |\n| 示例：输入登录详情对于员工身份验证身份以访问组织邮箱或软件是必要的 | 示例：员工成功身份验证后，他们可以根据自己的角色和简介访问并处理某些功能\
  \ |\n\n\n\n\n\n| 身份验证凭据可以根据用户需求进行部分更改 | 权限无法由用户更改。权限由系统所有者/管理员授予用户，他们可以进行更改 |\n\n\
  **表 9.1：** 身份验证与授权之间的区别\n\n# 保护真实世界的 API\n\n让我们构建一个示例应用程序，从中学习如何应用身份验证和授权来保护我们的后端应用程序。\n\
  \n在 `server.js` 中添加以下代码，该代码将用于初始化和运行我们的后端服务器应用程序：\n\n```javascript\nconst express\
  \ = require(“express”);\nconst cors = require(“cors”);\nconst app = express();\n\
  const Connection = require(“./connection”);\nrequire(“./app/routes/product-routes”)(app);\n\
  require(“./app/routes/user-routes”)(app);\nvar corsOptions = {\n  origin: “http://localhost:5000”\n\
  };\napp.use(cors(corsOptions));\napp.use(express.json());\napp.use(express.urlencoded({\n\
  \  extended: true\n}));\napp.get(“/”, (req, res) => {\n  res.json({\n    message:\
  \ “Applying authentication in node.js application”\n  });\n});\nconst PORT = process.env.PORT\
  \ || 8080;\napp.listen(PORT, () => {\n  Connection();\n  console.log(“Running on\
  \ port “, PORT);\n});\n```\n\n## 安装依赖项\n\n运行以下命令安装所有依赖项：\n\n```bash\nPS D:\\Book\\\
  Building-Real-Time-application-using-Node_fork.js\\chap_09\\webApp> npm i\n```\n\
  \n![](img/9.6_installation.jpg)\n\n**图 9.6：** 安装依赖项的输出\n\n## 深入理解应用程序\n\n我们将使用以下文件夹结构创建应用程序：\n\
  \n![](img/9.7_Folder_structure.jpg)\n\n**图 9.7：** 应用程序的文件夹结构\n\n我们将使用 Mongoose 创建用户和产品模型以持久化所有的客户端数据。\n\
  \n```javascript\nlet mongoose = require(‘mongoose’);\nconst {\n  Schema\n} = mongoose;\n\
  const userSchema = new Schema({\n  // String 是 {type: String} 的简写\n  username: String,\n\
  \  email: String,\n  password: String\n});\n// 创建一个模型\nlet user = mongoose.model(‘User’,\
  \ userSchema);\n// 导出创建的模块\nmodule.exports = user;\n\nlet mongoose = require(‘mongoose’);\n\
  const {\n  Schema\n} = mongoose;\nconst productSchema = new Schema({\n  // String\
  \ 是 {type: String} 的简写\n  name: String,\n  price: String,\n  isDeleted: Boolean\n\
  });\n// 创建一个模型\nlet product = mongoose.model(‘Product’, productSchema);\n// 导出创建的模块\n\
  module.exports = product;\n```\n\n下一步是通过路由处理客户端请求，为了此目的，我们将添加几个与产品和用户模块相关的路由。\n\n\
  在 `src/routes` 文件夹内创建一个名为 `product-routes.js` 的文件并添加以下代码：\n\n```javascript\nconst\
  \ { jwtAuth } = require(“../middleware”);\nconst productServices = require(“../services/product-services.js”);\n\
  module.exports = function(app) {\n  app.use(function(req, res, next) {\n    res.header(“Access-Control-Allow-Headers”,\
  \ “Authorization”, “Origin, Content-Type, Accept”);\n    next();\n  });\n  // 添加产品\n\
  \  app.post(“/api/v1/products/addproduct”, [jwtAuth.verifyToken], productServices.create);\n\
  \  // 查找所有产品\n  app.get(“/api/v1/products/getproducts”, [jwtAuth.verifyToken], productServices.findAll);\n\
  \  // 根据产品 id 查找产品\n  app.post(“/api/v1/products/getproductbyid”, [jwtAuth.verifyToken],\
  \ productServices.findOne);\n  // 根据产品 id 更新产品\n  app.post(“/api/v1/products/update”,\
  \ [jwtAuth.verifyToken], productServices.update);\n  // 根据产品 id 删除产品\n  app.post(“/api/v1/products/delete”,\
  \ [jwtAuth.verifyToken], productServices.delete);\n};\n```\n\n在 `src/routes` 文件夹内创建另一个名为\
  \ `user-routes.js` 的文件并添加以下代码：\n\n```javascript\nconst { verifyUser } = require(“../middleware”);\n\
  const userServices = require(\"../services/user-services.js”);\nmodule.exports =\
  \ function(app) {\n  app.use(function(req, res, next) {\n    res.header(“Access-Control-Allow-Headers”,\
  \ “Authorization”, “Origin, Content-Type, Accept”);\n    next();\n  });\n  // 用户注册\n\
  \  app.post(“/api/v1/signup”, [verifyUser.checkUsername], [verifyUser.checkEmail],\
  \ userServices.signup);\n  // 用户登录\n  app.post(“/api/v1/signin”, userServices.signin);\n\
  };\n```\n\n为了在客户端请求和数据库之间通信，我们将创建如 `ProductService` 和 `UserService` 的服务。创建一个 services\
  \ 文件夹，并在 `src/services` 文件夹内添加 `product-service.js` 文件，然后添加以下代码：\n\n```javascript\n\
  const db = require(\"../models”);\nconst Product = db.product;\n// const Op = db.Sequelize;\n\
  // 添加新产品\nexports.create = (req, res) => {\n  console.log(“Request : “, req.body);\n\
