  \   ![](img/5.29.jpg)\n   **图 5.29:** 下载 MongoDB compass\n5. 在 MongoDB 上运行你的第一次查询。\n\
  \   ![](img/5.30.jpg)\n   **图 5.30:** 运行首次查询\n\n## 总结\n\n本章介绍了 MongoDB 的部分内容，我们还探索了如何在本地系统中设置\
  \ MongoDB。在下一章中，我们将学习更多关于数据持久化的知识，并使用一些像 Mongoose 这样的流行工具。\n\n## 延伸阅读\n\n你可以使用以下在线资源来进一步了解\
  \ MongoDB：\n\n*   [`learn.mongodb.com/learning-paths/introduction-mongodb`](https://learn.mongodb.com/learning-paths/introduction-mongodb)\n\
  *   [`www.youtube.com/watch?v=lBBq3Oaw`](https://www.youtube.com/watch?v=lBBq3Oaw)\n\
  *   [`intellipaat.com/blog/what-is-mongodb/`](https://intellipaat.com/blog/what-is-mongodb/)\n\
  *   [`www.tutorialspoint.com/mongodb/index.htm`](https://www.tutorialspoint.com/mongodb/index.htm)\n\
  \n\n\n\n对于传统的 SQL 数据库，Mongoose 解决了开发者在应用层实现特定 Schema 的挑战。除了强制执行公式外，Mongoose 还提供了各种钩子（hooks）、模型验证以及其他功能，旨在让\
  \ MongoDB 变得更好用。\n\nMongoose 是一个基于 MongoDB 原生控制器的用于 Node.js 项目的 ODM 库。得益于现成的钩子，它允许你在编写\
  \ MongoDB 验证、类型转换和业务逻辑的基础时节省时间。\n\n## Mongoose 的特性\n\n以下是 Mongoose 的一些重要特性：\n\n\
  *   **Schemas（模式）**：MongoDB 是无模式的数据库。这允许文档具有不同数据类型的不同字段。虽然这增加了数据模型的灵活性，但从长远来看会导致问题。\n\
  *   **验证（Validation）**：Mongoose 提供了内置的 Schema 验证，使我们无需编写代码来验证添加到 MongoDB 控制器中的数据。\n\
  *   **实例方法（Instance Methods）**：Mongoose 允许轻松为特定对象或文档在 Schema 定义中定义自定义方法。Mongoose\
  \ 还为数据模型包含了存储前和存储后的函数。\n*   **检索结果（Retrieving Results）**：可以使用 Mongoose 轻松检索更新后的文档和查询结果。对于更新请求，Mongoose\
  \ 返回修改后的对象本身，而父级控制器返回对象、标志以及修改文档的数量。\n\n## Mongoose 的优势\n\n以下是 Mongoose 提供的优势：\n\
  \n*   链式函数使得代码变得灵活且易读。\n*   它消除了使用命名集合的需求。\n*   它执行批量操作来为属性添加默认值并进行数据验证。\n*   公式更容易定义。\n\
  *   它具有类型转换、数据验证、查询构建等许多功能。\n\n## Mongoose 的缺点\n\n以下是 Mongoose 的缺点：\n\n*   它不支持事务。\n\
  *   它缺乏触发器（triggers），这在关系型数据库管理系统（RDBMS）中可以让生活变得更轻松。\n*   与 MongoDB 驱动相比，抽象是以性能为代价的。\n\
  \n## 核心术语\n\n**Collections（集合）**\n\nMongo 中的集合等于关系型数据库中的表。它们可以包含多个 JSON 文档。\n\n\
  **Documentation（文档）**\n\n文档对应 SQL 记录或行。虽然 SQL 行可以引用其他表的数据，但 Mongo 文档通常将它们合并在一个文档中。\n\
  \n**Fields（字段）**\n\n字段，也称为属性（attributes），类似于 SQL 表中的列。在下面的代码中，fname、lname、email、phone\
  \ 甚至 topics 都是字段。\n\n```json\n{\n\"fname\": \"sue\", // 存储姓名的字段\n\"lname\": \"test\"\
  , // 存储姓的字段\n\"email\": \"sue.test@gmail.com\", // 存储邮箱的字段\n\"phone\": \"56756756756\"\
  , // 存储电话的字段\n\"topics\":[\"news\", \"sports\"] // 存储喜爱主题列表的字段\n}\n```\n\n**Diagram（图）**\n\
  \n虽然 Mongo 是无模式，但 SQL 通过表定义定义 Schema。Mongoose schema 是通过应用层强制的文档数据结构（或文档格式）。\n\n\
  **Schematic types（模式类型）**\n\n虽然 Mongoose schemas 定义了文档的整体结构或格式，但 `SchemaTypes` 定义了单个字段的预期数据类型（字符串、数字、布尔等）。你还可以提供有用的选项，使字段变为必选、为字段设置默认值等。\n\
  \n**Models（模型）**\n\n模型是高阶构造函数，它们接收一个 schema 并创建与关系型数据库中的记录对应的文档实例。\n\n## Schema\
  \ 和 Model\n\n**Referencing Mongoose（引用 Mongoose）**：这与我们连接数据库时使用的相同，这意味着定义 schema\
  \ 和 model 不需要显式地连接到数据库。\n\n```javascript\nlet mongoose = require('mongoose');\n\
  const { Schema } = mongoose;\n```\n\n**Schema definition（Schema 定义）**：我们定义一个 schema\
  \ 来决定对象的属性，包括默认值、数据类型（如果需要）等。\n\n```javascript\nlet mongoose = require('mongoose');\n\
  const { Schema } = mongoose;\nconst employeeSchema = new Schema({\n  // String 是\
  \ {type: String} 的简写\n  name:  String,\n  dob: { type: Date, default: Date.now },\n\
  \  address:  String,\n  phone: String\n});\n```\n\n在这里，`employeeSchema` 为员工了几个基本属性。我们定义了以下属性：\n\
  \n*   name: `String` SchemaType\n*   dob: `Date` SchemaType，且其默认值设置为 `Date.now (当前日期)`\n\
  *   address: `String` SchemaType\n*   phone: `String` SchemaType\n\n在 Mongoose 中，有\
  \ 8  SchemaTypes：\n\n*   Array\n*   Boolean\n*   Buffer\n*   Date\n*   Mixed（通用/灵活的数据类型）\n\
  *   Number\n*   ObjectId\n\n**Creating and exporting a model（创建并导出模型）**：为了使用定义的\
  \ schema，我们需要将其转换为我们可以操作的模型。为了做到这一点，我们使用以下代码：\n\n```javascript\nlet mongoose = require('mongoose');\n\
  const { Schema } = mongoose;\n// ... schema definition ...\nlet employee = mongoose.model('Employee',\
  \ employeeSchema);\nmodule.exports = employee;\n```\n\n## 连接 MongoDB\n\n我们将执行以下步骤将应用程序连接到数据库。\n\
  \n1. 创建文件夹并使用 `npm init` 命令初始化项目。\n2. 使用 `npm install` 命令安装最新版本的 Mongoose。\n\n上述命令将安装第\
  \ 7 版 Mongoose 库。\n\n## 数据库连接\n\n在 `chap_06` 文件夹下创建一个 **server.js** 文件并添加代码：\n\n\
  ```javascript\nconst express = require(\"express\");\nconst Employee = require(\"\
  ./employee_schema\");\n// 创建一个 express 应用。\nconst app = express();\napp.use(express.json());\n\
  \n// 创建一个 POST 端点接收用户数据。\napp.post(\"/\", async (req, res) => {\n  // 从请求体中解构数据。\n\
  \  const {\n    name,\n    dob,\n    address,\n    phone\n  } = req.body;\n\n  try\
  \ {\n    // 创建一个新的员工。\n    const employee = new Employee({\n      name: name,\n\
  \      dob: dob,\n      address: address,\n      phone: phone\n    });\n    // 将员工插入数据库。\n\
  \    await employee.save();\n    res.send(\"Employee Saved Successfully.\");\n \
  \ } catch (err) {\n    console.log(err);\n    res.json(err);\n  }\n});\n\napp.listen(8080,\
  \ function (err) {\n  if (err) console.log(err);\n  console.log(\"Server listening\
  \ on 8080\");\n});\n```\n\n现在，由于我们已经成功连接了数据库，让我们通过以下代码运行 database.js：\n\n\n\n\n\n\
  ```bash\nPS D:\\Book\\Building-Real-Time-application-using-Node_fork.js\\chap_06>\
  \ node server.js\n```\n\n我们已经使用 Mongoose 将应用程序连接到 `employeedb` 数据库。\n\n# 基础 Mongoose\
  \ 操作\n\n在本节中，我们将学习如何在 MongoDB 数据库上执行一些基础的 Mongoose CRUD（增删改查）操作。在这里，我们将学习如何使用 `mongoose.connect()`\
  \ 方法与 MongoDB NoSQL 数据库建立连接。\n\n让我们了解如何执行 Mongoose CRUD 操作。\n\n## 创建操作 (Create operation)\n\
  \n创建文档的方法方法是使用 `save()` 方法。\n\n当我们想要创建或保存 JSON 对象的新条目时，我们在对象上使用 `save()` 方法。该方法会将新创建的文档保存到\
  \ MongoDB 数据库中。\n\n```javascript\n// 创建新员工\nconst employee = new Employee({\n  name:\
  \ name,\n  dob: dob,\n  address: address,\n  phone: phone\n});\n\n// 将员工插入数据库。\n\
  await employee.save();\n```\n\n### `insert()`\n\n第二种方法 `insert()` 和 `insertMany()`\
  \ 也用于插入单个对象或记录数组。\n\n唯一的区别是，前者返回插入的数量以及关于插入记录的确认信息。相比之下，`insertMany()` 返回记录 ID 和插入的记录。\n\
  \n```javascript\nEmployee.collection.insert([\n  {\n    name: name,\n    dob: dob,\n\
  \    address: address,\n    phone: phone\n  },\n  {\n    name: name,\n    dob: dob,\n\
  \    address: address,\n    phone: phone\n  }\n])\n```\n\n### `create()`\n\n与 `save()`\
  \ 方法类似，`create()` 方法也用于在 Mongoose 中创建新的模型文档。然而，它是在数据库中创建一个或多个文档的快捷方式。\n\n```javascript\n\
  Employee.create([NewEmployee1, NewEmployee2, NewEmployee3])\n  .then((data) => {\n\
  \    resolve(data);\n  })\n  .catch((err) => {\n    reject(err);\n  })\n```\n\n\
  ## 查询操作 (Retrieve operation)\n\nMongoose CRUD 操作为我们三种简单的方法从 MongoDB 数据库中检索或读取任何数据：`find()`、`findOne()`\
  \ 和 `findById()`。\n\n`find()` 方法返回数据库中所有匹配查询的内容。\n\n```javascript\nEmployee.find([query],[callback])\n\
  ```\n\n`findOne()` 方法只返回第一个匹配的记录。\n\n```javascript\nEmployee.findOne([query],[fieldsToReturn],[callback])\n\
  ```\n\n最后，`findById()` 方法根据你提供的 id 从 MongoDB 数据库中返回单个对象。\n\n```javascript\nEmployee.findById(id,[fieldsToReturn],[callback])\n\
  ```\n\n## 更新操作 (Update operation)\n\n更新操作会在数据库中查找现有记录，获取它，然后根据提供的查询修改该记录。为了实现这一点，我们可以使用内置的\
  \ `FindByIdAndUpdate()` 方法通过提供其记录 ID 来更新特定记录。\n\n```javascript\nif (mongoose.Types.ObjectId.isValid(id))\
  \ {\n  Employee.findByIdAndUpdate(id, {\n    $set: {\n      name: employee.name\n\
  \    }\n  }, {\n    new: true\n  }).then((docs) => {\n    if (docs) {\n      resolve({\n\
  \        success: true,\n        data: docs\n      });\n    } else {\n      reject({\n\
  \        success: false,\n        data: \"no such employee exist\"\n      });\n\
  \    }\n  }).catch((err) => {\n    reject(err);\n  })\n} else {\n  reject({\n  \
  \  success: \"false\",\n    data: \"provide correct key\"\n  });\n}\n```\n\n对于基于条件的更新，可以使用\
  \ `update()` 方法；你甚至可以通过将 multi 标志设为 true 来更新多个文件。\n\n```javascript\nEmployee.update({_id:id},{$set:{name:employee.name,state:employee.state}},\
  \ {multi:true,new:true})\n  .then((docs) => {\n    if(docs) {\n      resolve({success:true,data:docs});\n\
  \    } else {\n      reject({success:false,data:\"no such employee exist\"});\n\
  \    }\n  }).catch((err) => {\n    reject(err);\n  })\n```\n\n## 删除操作 (Delete operation)\n\
  \n有两种方法可以删除或移除记录——`remove()` 和 `findOneAndRemove()`。`remove()` 会从 MongoDB 中删除所有给定给定记录，而\
  \ `findOneAndRemove()` 方法仅根据你提供的 Id 移除一条记录。\n\n```javascript\nEmployee.findOneAndRemove(id,options,callback);\n\
  ```\n\n## 实例示例 (Real-world Example)\n\n让我们基于 Node.js 和 Mongoose 创建一个 API 。\n\n##\
