  \n## 函数的调用\n\n`function` 关键字后面跟着函数名。我在代码中包含了圆括号。你可以在圆括号中包含一个或多个参数。你需要包含在函数中的代码放在大括号内。至于函数参数，你需要在创建函数并在现在想要调用它时传递它们。\n\
  \n`function` 关键字后面跟着函数名。我在代码中包含了圆括号。你可以在圆括号中包含一个或多个参数。你需要包含在函数中的代码放在大括号内。\n\n字体\
