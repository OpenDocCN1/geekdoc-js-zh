  \ 技巧改善了布局流。`box-sizing` 属性确保了你的盒子在添加额外的内边距（padding）后不会破坏。\n\n当你创建盒子时，你可以通过这段代码填充它们并让它们浮动。然而，如果你添加了某些超出盒子宽度的内容，盒子就会崩溃。`box-sizing`\
  \ 属性允许你适应变化的宽度和高度，并防止其崩溃。\n\n### 等高盒子\n\n你已经学习了如何在保持宽度相同的同时让盒子浮动。然而，真正的挑战是创建这些盒子并让它们以等高度浮动。你可以通过设置固定高度来解决这个问题。\n\
