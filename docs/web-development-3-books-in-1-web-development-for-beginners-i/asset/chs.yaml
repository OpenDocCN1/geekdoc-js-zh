  \  </tr>\n  <tr>\n    <td>Jackson Ramsey</td>\n    <td>Green</td>\n    <td>Namibia</td>\n\
  \  </tr>\n  <tr>\n    <td>Magot Rosy</td>\n    <td>Brown</td>\n    <td>Spain</td>\n\
  \  </tr>\n  <tr>\n    <td>Nany</td>\n    <td>Pink</td>\n    <td>Egypt</td>\n  </tr>\n\
  \  <tr>\n    <td>Paris Hilton</td>\n    <td>Tanned Pink</td>\n    <td>France</td>\n\
  \  </tr>\n</table>\n</body>\n</html>\n```\n\n| 客户名称 | 分配的颜色 | 国家名称 |\n| Alfredo\
  \ | Red | Ireland |\n| Jasmine Buckky | Green | Germany |\n| Centrum Chuccky | Violet\
  \ | Iceland |\n| Fanny Line | Purple | Scotland |\n| Fanny Brown | Yellow | Neverland\
  \ |\n| Peter | White | Treasure Island |\n| Jackson Ramsey | Green | Namibia |\n\
  | Magot Rosy | Brown | Spain |\n| Nany | Pink | Egypt |\n| Paris Hilton | Tanned\
  \ Pink | France |\n\nCSS 表格的高度和宽度通常被定义为属性。下面的示例将表格的宽度设置为 100%。你可以在任何喜欢的地方设置高度。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#listofcustomers {\n  font-family:\
  \ Helvetica, Arial, sans-serif;\n  border-collapse: collapse;\n  width: 75%;\n}\n\
  #listofcustomers td, #listofcustomers th {\n  border: 2px solid #aaa;\n  padding:\
  \ 6px;\n}\n#listofcustomers tr:nth-child(even){background-color: #e2e2e2;}\n#listofcustomers\
  \ tr:hover {background-color: #ddd;}\n#listofcustomers th {\n  padding-top: 15px;\n\
  \  padding-bottom: 15px;\n  text-align: left;\n  background-color: #4DFA90;\n  color:\
  \ grey;\n}\ntable, th, td {\n  border: 2px solid green;\n}\ntable {\n  width: 100%;\n\
  }\nth {\n  height: 50px;\n}\n</style>\n</head>\n<body>\n<table id=\"customers\"\
  >\n  <tr>\n    <th>客户名称</th>\n    <th>分配的颜色</th>\n    <th>国家名称</th>\n  </tr>\n \
  \ <tr>\n    <td>Alfredo</td>\n    <td>Red</td>\n    <td>Ireland</td>\n  </tr>\n\
  \  <tr>\n    <td>Jasmine Buckky</td>\n    <td>Green</td>\n    <td>Germany</td>\n\
  \  </tr>\n</table>\n</body>\n</html>\n```\n\n| 客户名称 | 分配的颜色 | 国家名称 |\n| Alfredo\
  \ | Red | Ireland |\n| Jasmine Buckky | Green | Germany |\n\n你可以看到当我增加第一列的高度时，第一列看起来有多宽敞。\n\
  \n### 表格对齐\n\nCSS 提供了 `text-align` 属性，用于设置内容的水平对齐。内容将居中、左左或右对齐。在下面的示例中，我将在同一段代码中添加三个对齐功能：对齐\
  \ `td`、对齐 `th` 以及以垂直格式对齐 `td`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  #listofcustomers {\n  font-family: Helvetica, Arial, sans-serif;\n  border-collapse:\
  \ collapse;\n  width: 75%;\n}\n#listofcustomers td, #listofcustomers th {\n  border:\
  \ 2px solid #aaa;\n  padding: 6px;\n}\n#listofcustomers tr:nth-child(even){background-color:\
  \ #e2e2e2;}\n#listofcustomers tr:hover {background-color: #ddd;}\n#listofcustomers\
  \ th {\n  padding-top: 15px;\n  padding-bottom: 15px;\n  text-align: left;\n  background-color:\
  \ #4DFA90;\n  color: grey;\n}\ntable, th, td {\n  border: 2px solid green;\n}\n\
  table {\n  width: 100%;\n}\nth {\n  height: 50px;\n}\ntd {\n  text-align: center;\n\
  }\nth {\n  text-align: left;\n}\ntd {\n  height: 50px;\n  vertical-align: top;\n\
  }\n</style>\n</head>\n<body>\n<table id=\"customers\">\n  <tr>\n    <th>客户名称</th>\n\
  \    <th>分配的颜色</th>\n    <th>国家名称</th>\n  </tr>\n  <tr>\n    <td>Alfredo</td>\n\
  \    <td>Red</td>\n    <td>Ireland</td>\n  </tr>\n  <tr>\n    <td>Jasmine Buckky</td>\n\
  \    <td>Green</td>\n    <td>Germany</td>\n  </tr>\n</table>\n</body>\n</html>\n\
  ```\n\n| 客户名称 | 分配的颜色 | 国家名称 |\n| Alfredo | Red | Ireland |\n| Jasmine Buckky |\
  \ Green | Germany |\n\n### CSS 布局\n\n如果你想在 CSS 中创建一个整洁的布局，你需要使用 CSS 的 `display`\
  \ 属性。该属性可以帮助你更好地控制布局。该属性指定了页面上的 HTML 元素应该如何显示。每个 HTML 元素都根据其类型有一个默认的显示值。大多数元素的默认显示值是\
  \ `inline` 或 `block`。块级元素会另起一行开始。它们还会占据整个宽度，一直延伸到左右两边。\n\n像 `<form>`、`<div>`、`<header>`、`<footer>`、`<p>`\
  \ 和 `<h1>` 这样的元素都是块级元素。\n\n块级元素总是具有全宽选项。如果你设置了块级元素的 `width`，它将防止元素延伸到容器的极端边缘。之后，你可以将边距设置为\
  \ `auto`，从而在容器中水平居中该特定元素。该元素将继承你指定的宽度，剩余空间将分布在左右边距之间。\n\n如果浏览器窗口小于你的 HTML 元素的宽度，你可能会遇到问题。这时，浏览器会在你的网页上添加一个水平滚动条。通过使用\
  \ `max-width`，你可以改进浏览器处理小窗口的方式。当你正在制作可以在小设备上使用的网站时，这一点至关重要。\n\n\n\n\n\nCSS `position`\
  \ 属性通常用于指定某个特定元素所使用的定位方法类型。你可以使用 `relative`、`sticky`、`static`、`fixed` 和 `absolute`\
  \ 方法。一旦决定了要选择哪种定位，你可以使用 `right`、`left`、`top` 和 `bottom` 属性对 HTML 元素进行定位。除非代码中设置了\
  \ `position` 属性，否则这些属性不会生效。此外，它们会根据你在代码中填充的位置值起作用。\n\n### Static（静态）\n网站的第一种布局位置是\
  \ `static`。网站上所有的 HTML 元素默认都是 `static` 位置。这些元素受 `left`、`top`、`bottom` 和 `right`\
  \ 属性的影响最小。带有 `static` 的 HTML 元素不会进行特殊定位，而是根据页面流进行定位的。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\ndiv.ThisIsStatic {\n  position: static;\n  border: 4px\
  \ solid #FF9DA97;\n}\n</style>\n</head>\n<body>\n<h4>学习静态定位属性；</h4>\n<p>静态定位最棒的地方是它不是以特定的方式定位的。它根据网页的流来塑造自己的位置：</p>\n\
  <div class=\"ThisIsStatic\">\n  查看此网页上静态定位是如何工作的；\n</div>\n</body>\n</html>\n```\n\
  \n#### 学习静态定位属性\n静态定位最棒的地方是它不是以特定的方式定位的。它根据网页的流来塑造自己的位置：\n查看此网页上静态定位是如何工作的；\n\n\
  ### Relative（相对）\n第二种布局位置是 `relative`。它相对于 HTML 元素的正常位置对其进行调整。对你已进行相对定位的 HTML 元素设置\
  \ `bottom`、`top`、`left` 和 `right` 属性，会导致它离开正常位置。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\ndiv.ThisIsRelative {\n  position: relative;\n  left: 40px;\n  border:\
  \ 4px solid black;\n}\n</style>\n</head>\n<body>\n<h4>学习相对定位属性；</h4>\n<p>静态定位最棒的地方是它不是以特定的方式定位的。它根据网页的流来塑造自己的位置：</p>\n\
  <div class=\"ThisIsRelative\">\n  查看此网页上静态定位是如何工作的；\n</div>\n</body>\n</html>\n\
  ```\n\n#### 学习相对定位属性；\n静态定位最棒的地方是它不是以特定的方式定位的。它根据网页的流来塑造自己的位置：\n查看此网页上静态定位是如何工作的；\n\
  \n### Fixed（固定）\n具有 `fixed` 位置的 HTML 元素应该相对于视口（viewport）进行定位。这意味着即使你向下滚动页面到部，元素也会一直留在同一个地方。你可以使用\
  \ `right`、`left`、`top` 和 `bottom` 属性来设置 HTML 元素的位置。`fixed` HTML 元素不会在网页所在的位置留出空隙。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv.ThisIsFixed {\n  position:\
  \ fixed;\n  bottom: 50;\n  right: 0;\n  width: 500px;\n  border: 4px solid red;\n\
  }\n</style>\n</head>\n<body>\n<h4>学习固定定位属性；</h4>\n<p>CSS 如果使用得当，有能力让你的网站对不同的媒体设备具有高度响应性并具有交互性：</p>\n\
  <div class=\"ThisIsFixed\">\n  此示例展示了如何调整你网站的布局；\n</div>\n</body>\n</html>\n```\n\
  \n#### 学习固定定位属性\nCSS 如果使用得当，有能力让你的网站对不同的媒体设备具有高度响应性并具有交互性：\n此示例展示了如何调整你网站的布局；\n\n\
  如果你给 `bottom` 属性赋予 `0` 值，`div` 元素将位于网页的底部。无论你向下滚动多少，它将保持固定并对用户可见。使用 `fixed` 功能时要小心。除非你必须显示用户在留在你的网站时需要知道的极其有用的信息，否则不要使用它。它从一件趣事变成一件令人厌烦的事情只需要一点时间，足以让用户开始讨厌你的网站。\n\
  \n### Absolute（绝对）\n具有 `absolute` 位置的 HTML 元素相对于最近已定位的祖先元素进行定位。如果你的绝对定位 HTML 元素缺少祖先元素，它将展开元素体，并随着你滚动页面而移动。定位元素是指具有除\
  \ `static` 以外的任何位置的元素。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv.ThisIsRelative\
  \ {\n  position: relative;\n  width: 500px;\n  height: 100px;\n  border: 5px solid\
  \ red;\n}\ndiv.ThisIsAbsolute {\n  position: absolute;\n  top: 100px;\n  right:\
  \ 0;\n  width: 300px;\n  height: 100px;\n  border: 5px solid yellow;\n}\n</style>\n\
  </head>\n<body>\n<div class=\"ThisIsRelative\"><h4>学习定位属性；</h4><div>CSS 如果使用得当，有能力让你的网站对不同的媒体设备具有高度响应性并具有交互性：</div></div>\n\
  <div class=\"ThisIsAbsolute\">\n此示例展示了如何调整你网站的布局；\n</div>\n</body>\n</html>\n```\n\
  *注：Absolute 部分包含了“学习固定定位属性”。*\n\n### Sticky（粘性）\n具有 `sticky` 位置的 HTML 元素会在用户滚动时调整。`sticky`\
  \ 元素在 `fixed` 和 `relative` 属性之间切换。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\ndiv.stickyscrolling {\n  position: -webkit-sticky;\n  position: sticky;\n\
  \  top: 0;\n  padding: 4px;\n  background-color: skyblue;\n  border: 2px solid grey;\n\
  }\n</style>\n</head>\n<body>\n<h4>学习定位属性；</h4>\n<div class=\"stickyscrolling\">这是粘性的！</div>\n\
  <div style=\"padding-bottom:2500px\">\n<p>CSS 如果使用得当，有能力让你的网站对不同的媒体设备具有高度响应性并具有交互性：</p>\n\
  <p> 此示例展示了如何调整你网站的布局。</p>\n<p>这是页面的结束。滚动查看该行是否固定在页面顶部。</p>\n</div>\n</body>\n</html>\n\
  ```\n\n#### 学习定位属性\n这是粘性的！CSS 如果使用得当，有能力让你的网站对不同的媒体设备具有高度响应性并具有交互性：\n此示例展示了如何调整你网站的布局；\n\
  \n如果你认为网页没有滚动，请向代码添加更多文本以启用滚动。\n\n### Elements Overlapping（重叠）\n当你有定位元素时，它们会与不同的\
  \ HTML 元素重叠。HTML 元素可能有负或正堆叠顺序。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  img {\n  position: absolute;\n  left: 2px;\n  top: 2px;\n  z-index: -2;\n}\n</style>\n\
  </head>\n<body>\n<p>学习重叠属性</p>\n<img src=\"css.gif\" width=\"200\" height=\"110\"\
  >\n<p>由于图像保持 z-index 为 -2，你将能够将其放在网页文本之后。</p>\n</body>\n</html>\n```\n\n### Layout\
  \ Overflow（溢出）\nCSS 布局 `overflow` 属性用于控制超出特定区域的内容。`overflow` 属性指定当元素内容对于网页上的某个区域过大时，程序员是想要固定内容还是为其添加滚动条。CSS\
  \ `overflow` 属性使用多个值来允许程序员自由实验。需要记住的一个重要点是，`overflow` 属性适用于具有指定高度的块元素。\n\n### Visible（可见）\n\
  第一个 `overflow` 属性命名为 `visible`。默认情况下，网页溢出是可见的。这意味着它永远不会被裁剪，并且会渲染到元素框之外。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  background-color: skyblue;\n\
  \  width: 150px;\n  height: 80px;\n}\n</style>\n```\n\n\n\n\n\n```css\n<style>\n\
  div {\n  border: 2px dotted red;\n  overflow: visible;\n}\n</style>\n</head>\n<body>\n\
  <p>这是 CSS 溢出</p>\n<p>CSS 如果与 HTML 5 结合，将彻底改变你网站的外观</p>\n<div>新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。</div>\n\
  </body>\n</html>\n```\n\n# 这是 CSS 溢出\n\nCSS 如果与 HTML 5 结合，将彻底改变你网站的外观\n\n新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。\n\
  \n虽然这里的文本出现在 body 标签内部，但在网页上，它将显示在 body 之外。\n\n### 隐藏 (Hidden)\n\n第二个属性被称为 `hidden`。使用此值时，你的\
  \ `overflow` 将显示为裁剪（clipped）。任何超出框的内容都将被隐藏。\n\n```html\n<!DOCTYPE html>\n<html\n\
  <head>\n<style>\ndiv {\n  background-color: skyblue;\n  width: 150px;\n  height:\
  \ 80px;\n  border: 2px dotted red;\n  overflow: hidden;\n}\n</style>\n</head>\n\
  <body>\n<p>这是 CSS 溢出</p>\n<p>CSS 如果与 HTML 5 结合，将彻底改变你网站的外观</p>\n<div>新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。</div>\n\
  </body>\n</html>\n```\n\n这是 CSS 溢出\n\nCSS 如果与 HTML 5 结合，将彻底改变你网站的外观\n\n新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像\n\
  \n你可以看到文本被切断了。无法放入框内的文本被划掉了（ slashed）。\n\n### 滚动 (Scroll)\n\n另一个值是 `scroll`。`overflow`\
  \ 保持裁剪状态，但框内会出现滚动条。用户可以使用垂直和水平滚动条来阅读全文。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\ndiv {\n  background-color: skyblue;\n  width: 150px;\n  height: 80px;\n\
  \  border: 2px dotted red;\n  overflow: scroll;\n}\n</style>\n</head>\n<body>\n\
  <p>这是 CSS 溢出</p>\n<p>CSS 如果与 HTML 5 结合，将彻底改变你网站的外观</p>\n<div>新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。</div>\n\
  </body>\n</html>\n```\n\n`auto` 值类似于 `scroll` 值，因为它也会在代码中添加滚动条。\n\n### CSS 浮动 (Float)\n\
  \nCSS `float` 属性为你的网页页增添了一丝样式。它指定了网页上不同的 HTML 元素应该如何浮动。与 `float` 属性配合的是 `clear`\
  \ 属性，它用于调整浮动元素。你可以通过使用 `float` 属性将图像悬浮在网页的右侧或左侧，从而对内容进行定位和格式化。`float` 属性的额外值为 `none`、`left`、`right`\
  \ 和 `inherit`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nimg {\n  float:\
  \ right;\n}\n</style>\n</head>\n<body>\n<p>这是 CSS 浮动</p>\n<p img src=\"Covid.jpg\"\
  \ alt=\"Covid\" style=\"width:180px;height:180px;margin-left:20px;\">新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。</p>\n\
  </body>\n</html>\n```\n\n这是 CSS 浮动\n\n新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。\n\
  \n将真实的图片上传到代码并在浏览器中运行，查看图像是如何浮动到代码右侧的。你可以以相同的方式应用 `left` 值。文本将移到右侧，图像将移到左侧。你可以在网页上创建并行的浮动项目。每个项目将相互浮动。查看下面的示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  float: left;\n  padding:\
  \ 20px;\n}\n.kaz1 {\n  background: skyblue;\n}\n.kaz2 {\n  background: yellow;\n\
  }\n.kaz3 {\n  background: skyblue;\n}\n</style>\n</head>\n<body>\n<p>这是 CSS 浮动</p>\n\
  <div class=\"kaz1\">新冠-19 疫情在全球范围内迅速蔓延。</div>\n<div class=\"kaz2\">新冠-19 疫情在全球范围内迅速蔓延。</div>\n\
  <div class=\"kaz3\">最初对这种疾病的恐惧是无法用言表的。</div>\n<p>这是 CSS 浮动</div></div>然而，人们逐渐发现，它并没有像最初看起来那么致命。</div>\n\
  </body>\n</html>\n```\n\n这是 CSS 浮动\n\n新冠-19 疫情在全球范围内迅速蔓延。最初对这种疾病的恐惧是无法用言表的。然而，人们逐渐发现，它并没有像最初看起来那么致命。\n\
  \n### 清除属性 (Clear)\n\n`clear` 属性用于调整浮动元素。它指定了哪些元素不应该在浮动元素旁边。`float` 属性的值有 `none`、`left`、`right`\
  \ 和 `inherit`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  float:\
  \ left;\n  padding: 20px;\n}\n.kaz1 {\n  background: skyblue;\n}\n.kaz2 {\n  background:\
  \ yellow;\n}\n.kaz3 {\n  background: skyblue;\n}\n</style>\n</head>\n<body>\n<p>这是\
  \ CSS 浮动</p>\n<div class=\"kaz1\">新冠-19 疫情在全球范围内迅速蔓延。</div>\n<div class=\"kaz2\"\
  >新冠-19 疫情在全球范围内迅速蔓延。</div>\n<div class=\"kaz3\">最初对这种疾病的恐惧是无法用言表的。</div>\n<p>这是\
  \ CSS 浮动</div></div>然而，人们逐渐发现，它并没有像最初看起来那么致命。</div>\n</body>\n</html>\n```\n*(注：由于原文文本在\
  \ HTML 结构上存在一些混乱和重复，翻译时已根据逻辑对内容进行了整理以确保可读性)*\n\n实际上，根据你提供的原始文本翻译如下：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  float: left;\n  padding: 20px;\n\
  }\n.kaz1 {\n  background: skyblue;\n}\n.kaz2 {\n  background: yellow;\n}\n.kaz3\
  \ {\n  background: skyblue;\n}\n</style>\n</head>\n<body>\n<p>这是 CSS 浮动</div>\n\
  <p>不清除</p>\n<div class=\"kaz1\">段落 1</div>\n<div class=\"kaz2\">段落 2</div>\n<p>是清除</p>\n\
  <div class=\"kaz3\">段落 3</div>\n<div class=\"kaz4\">段落 4</div>\n</body>\n</html>\n\
  ```\n\n不清除\n\n段落 1\n\n段落 2- 请注意，段落 2 位于段落 1 之后。然而，由于我们对段落 1 使用了浮动属性，它将浮在页面的左侧，段落\
  \ 2 的文本将环绕它流动。\n\n清除\n\n段落 3\n\n段落 4 将掉落在浮动的 3。“left”值将清除已向左浮动的元素。你可以通过将代码改为“right”或“both”来实验它们如何影响你的网页布局。\n\
  \n### CSS 浮动示例\n\n通过 CSS `float` 属性的帮助，你可以让框并排浮动。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\n* {\n  box-sizing: border-box;\n}\n.boxing {\n  float:\
  \ left;\n  width: 30%;\n  padding: 40px;\n}\n.clearfixingfeature::after {\n  content:\
  \ \"\";\n  clear: both;\n  display: table;\n}\n</style>\n</head>\n<body>\n<p>这是一个框网格</p>\n\
  <p>你正在看到并排浮的框：</p>\n<div class=\"clearfixingfeature\">\n  <div class=\"boxing\"\
  \ style=\"background-color:skyblue\">\n  <p>第一个浮动的框。</p>\n  </</div>\n  <div class=\"\
  boxing\" style=\"background-color:red\">\n  <p>第二个浮动的框。</p>\n  </</div>\n  <div\
  \ class=\"boxing\" style=\"background-color:yellow\">\n  <p>第三个浮动的框。</p>\n  </div>\n\
  </div>\n</body>\n</html>\n```\n\n<p>clearfix 杂技改进了布局流。`box-sizing` 属性确保你的框在添加额外的内边距后不会损坏。</p>\n\
  \n\n\n\n\n# 这是一个盒子网格\n\n你正在看到并排排列的浮动盒子：\n\n- 第一个悬浮的盒子。\n- 第二个悬浮的盒子。\n- 第三个悬浮的盒子。\n\
  \nclearfix 技巧改善了布局流。`box-sizing` 属性确保了你的盒子在添加额外的内边距（padding）后不会破坏。\n\n现在我将移除 `boxsize`\
  \ 特性，看看它如何影响网页的布局。参见示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.boxing\
  \ {\n  float: left;\n  width: 30%;\n  padding: 40px;\n}\n.clearfixingfeature::after\
