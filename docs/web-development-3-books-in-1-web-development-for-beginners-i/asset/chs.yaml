  \n注意 – 为了清楚地看到差异，你应该在移动设备上同时打开之前的两个示例。\n\n#### HTML `<base>` 元素\n\n`<base>` 元素指定了页面上每个相对\
  \ URL 的基础 URL 和目标：\n\n```html\n<!DOCTYPE html> \n<html>\n<head> \n<title>Page Title</title>\
  \ \n<base href=\"https://static.Wikipedia.com/ /images/\" target=\"_blank\"> \n\
  </head> \n<body> \n<img src=\"html5.png\"> \n<p>The base URL has been specified\
  \ and the browser will look for the image \"html5.png\" \nat \"https://static.Wikipedia.com/htmlpages/images/html5.png\"\
  </p> \n\n<p><a href=\" https://www.Wikipedia.com\">Wikipedia</a></a></p> \n\n<p>This\
  \ link opens in a new window as the base target has been set to \"_blank\".</p>\
  \ \n</body> \n</html>\n```\n\n输出结果：\n\n![](img/Image00070.gif)\n\n基础 URL 已指定，浏览器将查找图像\
  \ \"html5.png\" 位于 \"https://static.Wikipedia.com/ /images/html5.png\" \n\n[维基百科](https://www.wikipedia.com)\n\
  \n此链接将在新窗口中打开，因为基础目标已设置为 `\"_blank\"`。\n\n## 第 11 章\n\n## HTML 布局\n\n![](img/Image00001.jpg)\n\
  \nHTML 布局是指我们如何以结构良好且响应式的方式安排网页。这是创建网站时需要考虑的最重要的方面之一；出色的布局可以确保你的网站看起来非常专业，并且内容以最合适且用户友好的方式进行布局。\n\
  \n这些是你可以使用的 HTML5 元素用于定义网页的各个部分：\n\n* `<header>`：用于定义节或文档的头部。\n* `<nav>`：用于定义包含导航链接的容器。\n\
  * `<section>`：用于定义文档节。\n* `<article>`：用于定义自包含的、独立的文章。\n* `<aside>`：用于定义内容旁的内容，例如侧边栏。\n\
  * `<footer>`：用于定义节或文档的页脚。\n* `<details>`：用于定义额外的细节。\n* `<summary>`：用于 `<details>`\
  \ 元素的标题。\n\nHTML 布局确保网页的每个部分都拥有其自身的被正确创建的空间，并可以按照正确的顺序排列。\n\n#### 布局元素\n\n#### HTML\
  \ `<header>`\n\n当你想要创建网页头部部分时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\
  \n```html\n<header style=\"background-color: #303030; height: 80px; width: 100%\"\
  > \n    <h1 style=\"font-size: 30px; color: white;text-align: center; padding-top:\
  \ 15px;\">Welcome to MyFirstWebpage</h1> \n</header>\n```\n\n输出结果：\n\n![](img/Image00071.jpg)\n\
  \n#### HTML `<nav>`\n\n这是一个存放主导航链接的容器，这些链接可以指向同一页，也可以指向外部。这是一个示例：\n\n```html\n<nav\
  \ style=\"background-color:#bcdeef;\"> \n    <h1 style=\"text-align: center;\">Navigation\
  \ Links</h1> \n    <ul> \n        <li><a href=\"#\">link1</a></li> \n        <li><a\
  \ href=\"#\">link2</a></li> \n        <li><a href=\"#\">link3</a></li> \n      \
  \  <li><a href=\"#\">link4</a></li> \n    </ul> \n</nav>\n```\n\n#### HTML `<section>`\n\
  \n当你想要创建网页头部部分（节）时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\n```html\n\
  <section style=\"background-color: #303030; height: 80px; width: 100%\"> \n    <h1\
  \ style=\"font-size: 30px; color: white;text-align: center; padding-top: 15px;\"\
  >Welcome to MyFirstWebpage</h1> \n</section>\n```\n\n#### HTML `<article>`\n\n当你想创建网页文章部分时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\
  \n```html\n<article style=\"background-color: #303030; height: 80px; width: 100%\"\
  > \n    <h1 style=\"font-size: 30px; color: white;text-align: center; padding-top:\
  \ 15px;\">Welcome to MyFirstWebpage</h1> \n</article>\n```\n\n#### HTML `<aside>`\n\
  \n当你想要创建网页侧边部分时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\n```html\n<aside\
  \ style=\"background-color: #303030; height: 80px; width: 100%\"> \n    <h1 style=\"\
  font-size: 30px; color: white;text-align: center; padding-top: 15px;\">Welcome to\
  \ MyFirstWebpage</h1> \n</aside>\n```\n\n#### HTML `<footer>`\n\n当你想要创建网页页脚部分时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\
  \n```html\n<footer style=\"background-color: #303030; height: 80px; width: 100%\"\
  > \n    <h1 style=\"font-size: 30px; color: white;text-align: center; padding-top:\
  \ 15px;\">Welcome to MyFirstWebpage</h1> \n</footer\n```\n\n#### HTML `<details>`\n\
  \n当你想要创建网页细节部分时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\n```html\n<details\
  \ style=\"background-color: #303030; height: 80px; width: 100%\"> \n    <h1 style=\"\
  font-size: 30px; color: white;text-align: center; padding-top: 15px;\">Welcome to\
  \ MyFirstWebpage</h1> \n</details>\n```\n\n#### HTML `<summary>`\n\n当你想要创建网页细节标题时，使用此元素。在这里，你包含了标题元素、介绍内容、网页图标或标志以及关于作者的信息。这是一个示例：\n\
  \n```html\n<details style=\"background-color: #303030; height: 80px; width: 100%\"\
  > \n    <summary style=\"font-size: 30px; color: white;text-align: center; padding-top:\
  \ 15px;\">Welcome to MyFirstWebpage</summary> \n</details>\n```\n\n\n\n\n\n下表显示了\
  \ HTML 中最常见的字符实体：\n\n| 结果 | 描述 | 实体名称 | 实体数字 |\n| :--- | :--- | :--- | :--- |\n\
  | | 不换行空格 | `&nbsp;` | 160 |\n| < | 小于 | `&lt;` | 60 |\n| > | 大于 | `&gt;` | 62 |\n\
  | & | 安培符号 | `&amp;` | 38 |\n| “ | 双引号 | `&quot;` | 34 |\n| ‘ | 单引号（撇号） | `&apos;`\
  \ | 39 |\n| ¢ | 分分符号 | `&cent;` | 162 |\n| ¢ | 分分符号 | `&cent;` | 162 |\n| £ | 英镑\
  \ | `&pound;` | 163 |\n| ¥ | 日元 | `&yen;` | 165 |\n| € | 欧元 | `&euro;` | 8364 |\n\
  | © | 版权 | `&copy;` | 169 |\n\n请注意，在使用实体名称时，大小写是非常重要的。使用实体名称的优点是它们容易记忆，但你应该意识到浏览器可能并不支持每一个名称——尽管如此，它们往往倾向于支持实体数字。\n\
  \n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title></title>\n</head>\n\
  <body> \n    <h3>HTML 实体示例</h3>\n    <p> \"这是用实体编写的内容\"</p>\n    <p> <p> 段落标签 </p>\
  \ \n</body> \n</html>\n```\n\n输出结果是：\nHTML 实体示例\n\"这是用实体编写的内容\"\n段落标签\n\n### 变音符号（Diacritical\
  \ Marks）\n\n在 HTML 中，某些特殊的字母类型在字母下方或上方添加有一个字形——这些字形被称为变音符号。这些变音符号中的某些，例如锐音（` ́`）和重音（`̀`），也被称为重符号。变音符号可以使用字母的下方、上方、内部和之间。\n\
  \n以下是常用的变音符号：\n\n| 标记 | 字符 | 构造 | 结果 |\n| :--- | :--- | :--- | :--- |\n| ̀ | a |\
  \ a&#768; | à |\n| ́ | a | a&#769; | á |\n| ̂ | a | a&#770; | â |\n| ̃ | a |\
  \ a&#771; | ã |\n| ̀ | O | O&#768; | Ò |\n| ́ | O | O&#769; | Ó |\n| ̂ | O |\
  \ O&#770; | Ô |\n| ̃ | O | O&#771; | Õ |\n\n### HTML 符号\n\n我们常用的许多技术、数学和货币符号并不总是能在键盘上找到。相反，使用实体名称来将这些符号添加到\
  \ HTML 页面中。如果你找不到实体名称或该名称不存在，你可以使用十进制或十六进制引用或实体数字。\n\n这是一个示例：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n    <body>\n        <h3> 货币符号</h3>\n        <p>这是印度卢比符号 <b>₹<b</b></p>\n\
  \        <p>这是欧元符号 <b>€</b></p>\n        <p> 这是美元符号 <b>#36;</b></p>\n    </body>\n\
  </html>\n```\n\n输出结果是：\n货币符号\n这是印度卢比符号 ?\n这是欧元符号 ?\n这是美元符号 $\n\n这些是 HTML 支持的数学符号：\n\
  \n| 字符 | 数字 | 实体 | 描述 |\n| :--- | :--- | :--- | :--- |\n| ∀ | &#8704; | `&forall;`\
