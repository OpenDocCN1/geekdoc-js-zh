  ## 参考文献\n\n# Web 开发\n## 针对 HTML 初学者的 Web 开发\n\n![](img/Image00001.jpg)\nAndy Vickler\n\
  \n## 引言\n\n![](img/Image00001.jpg)\n\nHTML 是主要的网页语言，考虑到它被用于编写大多数网页，这并不意外——学好它确实将使你走上创建某些惊人网站的正确道路。你在这里将学到构成\
  \ HTML 文档的组成部分、所有不同的元素以及如何使用它们。\n\n在每一章中，你将找到简单的代码示例，展示每个元素是如何工作的，并对其工作原理进行简单的解释。在书的最后，有一最后一章将带你从头到尾使用\
  \ HTML 构建一个简单的网页。\n\n1989 年，蒂姆·伯纳斯-李（Tim Berners-Lee）发明了改变我们所知世界并在今天继续改变世界的发明。那个发明就是万维网（World\
  \ Wide Web），在当时，他无法使用像 `JavaScript` 和 `CSS` 这样复杂的编程语言；他拥有的只有 HTML。\n\n过去的 30 多年里，HTML\
  \ 几乎发生了无法认的变化但也并非完全如此。它现在拥有超过 120 个标签，远多于最初的 18 个，并且仍然是任何网页的核心、最重要的部分。简而言之，它是网页的基础技术。\n\
  \n如果你的网站基于良好的 HTML，你将拥有一个加载快速的站点。浏览器会增量渲染 HTML，这意味着用户在等待从服务器获取其余文件时，可以看到一个部分渲染的页面。\n\
  \n现代开发技术（如 `React` 这样流行的框架）需要向用户发送大量的 `JavaScript`，这些代码在下载后必须由用户的设备解析并执行。而这一切在网页构建之前都必须完成。如果你的网络缓慢，或者你的设备功率低或低端，加载时间可能会慢得令人痛苦并消耗设备电池。\n\
  \n如果你的站点基于良好的 HTML，它将是健壮的。虽然脚本和样式的加载可能需要更长时间，但内容将始终可用，而且 HTML 不仅向后兼容，而且面向未来——它将永远有效。\n\
  \n### 现在还有人手写 HTML 吗？\n\n我经常听到人们说，现在不需要学习 HTML 了，因为面对事实吧，现在还有谁会手写它呢？诚然，这很有道理——`WordPress`\
  \ 驱动了如今全球超过 35% 的网站。它使用模板来组装网页，并可以为它们应用不同的主题。`Drupal` 和 `Joomla` 的工作原理也相似。同时，其他开发者使用\
  \ `React` 和其他类似的框架，这些框架只是将一系列已经写好的组件组合在一起。\n\n但让我们面对事实吧——那些组件和模板仍然需要编写。那些使用 `React`\
  \ 或 `WordPress` 的开发者仍然需要一些 HTML 知识。否则，他们无法在使用的之前评估这些组件和模板的好坏。\n\n这就是我编写这本指南的原因，让你知道如何用老式的经典\
  \ HTML 制作网页，而不必担心别人的工作做得有多好。\n\n## 第 1 章\n\n## 什么是 HTML？\n\n![](img/Image00001.jpg)\n\
  \nHTML 代表超文本标记语言（Hyper Text Markup Language），它是用于创建 Web 应用程序和网页的语言。那么，这一切意味着什么呢？\n\
  \n*   **超文本 (HyperText)**：这仅仅意味着“文本中的文本”。任何包含链接的文本被称为两种事物之一——超链接或超文本。如果你点击这些链接之一，将打开一个新的网页。\n\
  *   **标记语言 (Markup Language)**：标记语言是用于对文档应用格式化和布局的计算机语言。这些语言确保了文本更具动态性和交互性，并可以将文本转换为链接、表格、图像等。\n\
  \n\n\n\n\n* 网页 – 网页是通常用 HTML 编写的文档，然后使用网页浏览器对其进行翻译。我们使用 `URLs` 来访问和识别这些网页，`URLs`\
  \ 是网页在互联网上的地址，并且它们可以是动态的或静态的。用于创建静态网页的唯一语言是 HTML。\n\n这意味着 HTML 语言用于通过样式设计创建美观的网页，并以良好的格式将其显示在网页上。HTML\
  \ 文档由多个标签组成，每个标签都有不同的内容。\n\n让我们通过查看一个简单的 HTML 示例将这一切置于语境中：\n\n```html\n<!DOCTYPE\
  \ > \n<html> \n<head> \n<title> Web page title </title> \n</head> \n<body> \n<h1>\
  \ Your first heading goes here </h1> \n<p> Your first paragraph goes here </p> \n\
  </body> \n</html> \n```\n\n（注：此处 运行此代码将在你的屏幕上显示以下内容：\n\nYour first heading goes\
  \ here\nYour first paragraph goes here\n\n让我们将这个示例拆解为各个组件：\n\n* `<!DOCTYPE>` - 这定义了文档类型或告诉浏览器正在使用哪个版本的\
  \ HTML。\n* `<html>` - 这告诉浏览器正在使用 HTML 文档。此标签之间的任何文本都在描述文档。换句话说，它是除 `<!DOCTYPE>`\
  \ 之外所有其他 HTML 元素的容器。\n* `<head>` - 这是 `<html>` 标签中的第一个元素，它包含了关于文档的详细信息，即元数据。在打开\
  \ `<body>` 标签之前，必须关闭 `<head>` 标签。\n* `<title>` - 顾名其义——此标签添加了网页的标题，即在浏览器显示的窗口顶部看到的标题。它必须包含在\
  \ `<head>` 标签内，并且应该被立即关闭。\n* `<body>` - 这是网页内容所在的地方，即终端用户看到的内容。它是 HTML 文档的主要内容。\n\
  * `<h1>` - 此标签中的任何文本都在描述网页的一级标题。\n* `<p>` - 此标签中的文本在描述网页的段落文本。\n\n随着你学习完这本书，所有这些都将变得更加清晰。\n\
  \n## HTML 简史\n\n蒂姆·伯纳斯-李（Tim Berners-Lee）是 20 世纪 80 年代末的一位物理学家，受聘于欧洲核子研究组织（CERN）。在他那里期间，他为研究人员提出了一个系统，并在\
  \ 1989 年发送了一份包含基于互联网的超文本系统的备录。\n\n他获得了“HTML 之父”的美誉。1991 年，他编写了名为《HTML Tags》的文档，这是第一个\
  \ HTML 描述。\n\n## HTML 版本\n\n自 HTML 发明以来，已经发布了几个版本：\n\n* HTML 1.0 – 1991 年发布，这是 HTML\
  \ 的第一个版本，非常基础。\n* HTML 2.0 - 下一个版本于 1995 年发布，并成为了网站设计的标准。它提供了额外功能的支持，包括表单元素（如选项按钮、文本框等）以及基于表单的文件上传。\n\
  * HTML 3.2 - W3C 于 1997 年初发布了这个版本，带来了对表格创建的支持以及对表单元素中新选项更多的支持。它还可以支持包含复杂数学方程的网页。1997\
  \ 年 1 月，它成为了浏览器标准，直到今天，大多数浏览器仍然以实际形式支持它。\n* HTML 4.01 – 下一个 HTML 版本于 1999 年 12 月出现，并证明极其稳定——今天依然如此。它是我们目前使用的官方标准，并提供了对\
  \ CSS（样式表）和不同多媒体元素脚本能力的支持。\n* HTML5 - HTML5 是最新版本，于 2008 年 1 月首次宣布。有两个基金会参与 HTML5\
  \ 的开发——万维网联盟（W3C）和网页超文本应用技术小组（WHATWG），直到今天它仍在开发中。\n\n## HTML 特性\n\n那么，为什么要使用 HTML？为什么不使用较新的语言，例如\
  \ JavaScript？除了 HTML 支持 JavaScript 和 CSS 之外，它还为用户提供了所有功能：\n\n1. 它是最容易理解和修改的语言之一。\n\
  2. 使用 HTML 制作有效的演示非常容易，因为它提供了大量的格式标签。\n3. 因为它是一种标记语言，它为用户提供了一种使用文本设计网页的灵活方法。\n4.\
  \ 它允许用户使用锚点标签在网页上添加链接，从而增强用户的浏览兴趣。\n5. 它不依赖于任何特定平台，可以在 Windows、Linux、Mac 以及所有其他系统上显示。\n\
  6. 它允许程序员轻松地向页面添加声音、视频和图形，确保它们更具互动性和吸引力。\n7. 它不像其他语言那样对大小写敏感，因此标签可以使用小写或大写。然而，为了可读性和一致性，建议使用小写。\n\
  \n## HTML 编辑器\n\n由于 HTML 文件是文本文件，它们需要在文本编辑器中创建。文本编辑器是一个允许你编辑文本以创建网页的程序。有许多不同的编辑器可以下载，但建议初学者在使用\
  \ Windows 时使用 `Notepad`（记事本），在使用 macOS 时使用 `TextEdit`。一旦你学会了基础，就可以转向其他专业编辑器，如 `Vim`、`Sublime\
  \ Text`、`Notepad++` 等。\n\n### 使用记事本\n\n### 第一步 – 打开记事 (Windows)\n\n如果你使用 Windows\
  \ 8 或更高版本：\n* 打开“开始”菜单\n\n搜索并打开记事本。\n\n### 第二步 – 编写 HTML\n\n在记事本中输入以下内容：\n\n```html\n\
  <!DOCTYPE html> \n<html> \n<head> \n<title> Web page title </title> \n</head> \n\
  <body> \n<h1> Your first heading goes here </h1> \n<p> Your first paragraph goes\
  \ here </p> \n</body> \n</html> \n```\n\n运行此代码将在你的屏幕上显示以下内容：\n\nYour first heading\
  \ goes here\nYour first paragraph goes here\n\n### 第三步 – 保存文件\n\n点击“文件”>“另存为”。将文件名命名为\
  \ `index.html`，并将保存类型更改为“所有文件”。点击保存。\n\n### 第四步 – 查看网页\n\n双击你保存的 `index.html` 文件，它将在你的默认浏览器中打开。\n\
  \n### 使用文本编辑 (macOS)\n\n### 第一步 – 打开文本编辑 (macOS)\n\n如果你使用 macOS：\n* 打开“启动”\n\n搜索并打开“文本编辑”。\n\
  \n你需要更改一些设置，以便能够正确保存文件：\n* 点击“格式”>“制作纯文本”。\n\n### 第二步 – 编写 HTML\n\n在文本编辑中输入以下内容：\n\
  \n```html\n<!DOCTYPE html> \n<html> \n<head> \n<title> Web page title </title> \n\
  </head> \n<body> \n<h1> Your first heading goes here </h1> \n<p> Your first paragraph\
  \ goes here </p> \n</body> \n</html> \n```\n\n### 第三步 – 保存文件\n\n点击“文件”>“另存为”。将文件名命名为\
  \ `index.html`，并将编码格式为“UTF-8”。点击保存。\n\n### 第四步 – 查看网页\n\n双击你保存的 `index.html` 文件，它将在你的默认浏览器中打开。\n\
  \n\n\n\n\n有几个标签用于定义 HTML 标题 - `<h1>`, `<h2>`, `<h3>`, `<h4>`, `<h5>`, 和 `<h6>`。`<h1>`\
  \ 是最重要的，而`<h6>` 是不重要的。\n\n<h1>这是标题 1</h1>\n\n<h2>这是标题 2</h2>\n\n<h3>这是标题 3</h3>\n\
  \n### HTML 段落\n\n`<p>` 标签用于定义 HTML 段落：\n\n```html\n<p>This is a paragraph.</p>\n\
  <p>This is another paragraph.</p>\n```\n（此处未翻译）\n\n### HTML 链接\n\n`<a>` 标签用于定义 HTML\
  \ 链接：\n\n```html\n<a href=\"https://www.wikipedia.com\">这是一个链接</a>\n```\n\n`href`\
  \ 属性用于指定链接的单元目标。我们将在下一章讨论属性，但现在，你只需要知道它们被用于提供有关元素的更多信息。\n\n### HTML 图像\n\n`<img>`\
  \ 标签用于定义 HTML 图像，其属性有 `src`（源文件）、`alt`（替代文本）、`height`（高度）和 `width`（宽度）。\n\n```html\n\
  <img src=\"wikipedia.jpg\" alt=\"Wikipedia.com\" width=\"104\" height=\"142\">\n\
  ```\n\n### 如何查看 HTML 源代码\n\n你曾多少次查看网页并好奇它是如何创建的？在任何 HTML 网页上，你只需要对页面点击鼠标右键。在 Chrome\
  \ 浏览器中，点击`查看网页源代码`（View Page Source），或者在 Edge 中，点击`查看源代码`（View Source）。其他浏览器也是一样。会打开一个窗口向你显示页面的源代码。\n\
  \n### 如何检查 HTML 元素\n\n只需右键点击空白区域或元素，并点击`检查元素`（Inspect Element）或“检查”。这将向你显示元素的 HTML\
  \ 和 CSS 部分，你还可以使用`样式`或`元素`面板来编辑 HTML。\n\n在下一章中，我们将查看组成 HTML 的构建块。\n\n## 第二章\n\n\
  ## HTML 构建块\n\n![](img/Image00001.jpg)\n\n让我们直接进入正题 – HTML 文档是由构建块组成的。基础的构建块包括：\n\
  \n字体 标签（Tags） – HTML 标签用于包裹内容并赋予其意义。所有标签都由 `<>` 包围。\n- 属性（Attributes） – HTML 属性为元素提供额外的细节，起始标签用于应用它们。所有属性都有两个字段：名称和值。\n\
  \n我们在这章中还将讨论元素。\n\n### 语法\n\n```html\n<tag name attribute_name= “ attr_value”>content</tag\
  \ name>\n```\n\nHTML 元素是单个 HTML 文件组件，写在标签中的任何内容都称为元素。\n\n![HTML 构建块 ](img/Image00002.gif)\n\
  \n这是一个示例：\n\n```html\n<!DOCTYPE html > \n<html \n  <head> \n    <title> 基础 HTML\
  \ 构建块 </title> \n  </head> \n  <body> \n      <h2> 构建块 </h2> \n      <p> 这是一个段落标签\
  \ </p> \n      <p style=\"color: red\" > 样式是段落标签的一个属性 </p> \n      <span> 元素包含一个标签、一个属性和内容\
  \ </span> \n  </body> \n</html> \n```\n\n（此处未翻译）\n输出结果是：\n构建块\n样式是段落标签的一个属性\n元素包含一个标签、一个属性和内容\n\
  \n### HTML 表格标签\n\n你可能会使用的表格标签有：\n\n- 表格 (Table)\n- `tr` (行)\n- `td` (单元格)\n- `th`\
  \ (表头单元格)\n- `tbody` (列表)\n- `thead` (表头)\n- `tfoot` (表脚)\n- `col` (列)\n- `colgroup`\
  \ (列组)\n- `caption` (标题)\n\n### HTML 表单标签\n\n表单标签有：\n\n- `form` (表单)\n- `input`\
  \ (输入)\n- `textarea` (文本区域)\n- `select` (选择)\n- `option` (选项)\n- `optgroup` (选项组)\n\
  - `button` (按钮)\n- `label` (标签)\n- `fieldset` (字段组)\n- `legend` (图例)\n\n### HTML\
  \ 脚本标签\n\n有两个脚本标签：\n\n- `script`\n- `noscript`\n\n### HTML 标签\n\n你可以将 HTML 标签认为类似于关键字。它们定义了浏览器格式化和显示内容的方式。通过使用标签，网络浏览器可以区分\
  \ HTML 和简单内容。标签由三个部分组成：起始标签、内容和结束标签。然而，某些 HTML 标签是不闭合的。\n\n当浏览器读取 HTML 文档时，它是从上到下、从左到右读取的\
  \ – 就像你阅读书页一样。HTML 文档是通过 HTML 标签创建并渲染属性的 – 每个标签都有自己的属性。\n\nHTML 文件需要基本的标签以便浏览器能够区分\
  \ HTML 和简单文本。根据你的代码需求，你可以使用任意数量的标签。\n\n- 每个 HTML 标签都应该包含在括号 `<>` 之间。\n- 所有 HTML\
  \ 标签都有不同的功能。\n- 如果使用了起始标签（`<tag>`），那么在大多数情况下，必须有一个结束标签（`</tag>`）。\n\n### 语法\n\n\
  ```html\n<tag> 内容 </tag>\n```\n\n### HTML 标签示例\n\n所有 HTML 标签都应该用小写字母写。这些是最基本的标签：\n\
  \n- `<p> 段落标签 </p>`\n- `<h2> 标题标签 </h2>`\n- `<b> 粗体标签 </b>`\n- `<i> 斜体标签 </i>`\n\
  - `<u> 下划线标签 </u>`\n\n### 未闭合的 HTML 标签\n\n并不是所有的 HTML 标签都需要闭合。例如：\n\n- `<br>` –\
  \ `br` 用于换行\n- `<hr>` – `hr` 用于插入水平线\n\n### HTML 元标签\n\n这些 元标签有：\n\n- `<!DOCTYPE>`\n\
  - `<title>`\n- `<link>`\n- `<meta>`\n- `<style>`\n\n### HTML 文本标签\n\n常用的文本标签有：\n\
  \n- `<p>`\n- `<h1>`\n- `<h2>`\n- `<h3>`\n- `<h4>`\n- `<h6>`\n- `<strong>`\n- `<em>`\n\
  - `<abbr>`\n- `<address>`\n- `<blockquote>`\n\n### HTML 链接标签\n\n有两个链接标签：\n\n- `<a>`\n\
  - `<base>`\n\n### HTML 对象和图像标签\n\n对象和图像标签有：\n\n- `<img>`\n- `<area>`\n- `<map>`\n\
  - `<param>`\n- `<object>`\n\n### HTML 列表标签\n\n主要的标签有：\n\n- `<ul>`\n- `<ol>`\n- `<li>`\n\
  - `<dl>`\n- `<dt>`\n- `<dd>`\n\n### HTML 标签列表\n\n以下列表按字母顺序排列了所有标签，以便你轻松找到需要的内容，带有星号\
  \ (*)：\n\n| 标签 | 描述 |\n|---|---|\n| `<!-- -->` | 用于在 HTML 文档中使用注释 |\n| `<!DOCTYPE>`\
  \ | 用于指定 HTML 版本 |\n| `<a>` | 锚标签，用于创建链接或超链接 |\n| `<abbr>` | 为长词或短语创建缩写 |\n| `<acronym>`\
  \ | 定义缩写 – HTML5 不支持此 |\n| `<address>` | 定义文章的联系信息 |\n| `<applet>` | 定义嵌入应用程序 –\
  \ HTML5 不支持此 |\n| `<area>` | 定义图像映射区域 |\n| `<article>` | 定义自包含的内容 |\n| `<aside>`\
  \ | 定义独立于主要内容的内容 – 通常显示为侧边栏 |\n| `<audio>` | 用于在 HTML 文档中嵌入声音 |\n| `<b>` | 用于将文本加粗\
  \ |\n| `<base>` | 定义同一文档内所有其他 URL（相对）的基础 |\n| `<basefont>` | 用于设置所有元素的默认字体、颜色和大小\
  \ |\n| `<bdi>` | 该标签隔离指定的文本段，使其与周围文本格式不同 |\n| `<bdo>` | 该标签覆盖文本的当前方向 |\n| `<big>`\
  \ | 使字体比周围内容大一 – HTML5 不支持此 |\n| `<blockquote>` | 定义来自其他来源的内容 |\n| `<body>` | 定义\
  \ HTML 文档的体部 |\n| `<br>` | 应用一次换行 |\n| `<button>` 表示可点击的按钮 |\n| `<canvas>` | 该标签用于为网页提供图形空间\
  \ |\n| `<caption>` | 用于定义表格标题 |\n| `<center>` | 用于内容居中对 – HTML5 不支持此 |\n| `<cite>`\
  \ | 用于定义书籍、网站或其他作品的标题 |\n| `<code>` | 用于显示 HTML 文档中的指定代码段 |\n| `<col>` | 定义表格中的列，表示公共列属性，并与\
  \ `<colgroup>` 元素配合使用 |\n| `<colgroup>` | 用于定义表格中的列组 |\n\n\n\n\n\n| `<data>*` |\
  \ 用于通过机器可读的翻译来链接内容 |\n| `<datalist>*` | 用于提供预定义列表的输入选项 |\n| `<dd>` | 为描述列表中的术语提供描述或定义\
  \ |\n| `<del>` | 定义被删除的文本 |\n| `<details>*` | 定义用户可以查看或隐藏的额外信息 |\n| `<dfn>` | 表示短语或句子中定义的术语\
  \ |\n| `<dialog>*` | 定义交互式组件，如对话框 |\n| `<dir>` | 用于作为容器类型，容纳所有文件的目录列表 – HTML5 不支持此项\
  \ |\n| `<div>` | 定义文档中的节或划分区域 |\n| `<dl>` | 定义描述列表 |\n| `<dt>` | 定义描述列表中的术语 |\n\
  | `<em>` | 强调元素内的内容 |\n| `<embed>*` | 一种嵌入容器，用于容纳外部媒体、应用程序、文件等 |\n| `<fieldset>`\
  \ | 在 Web 表单中将相关的标签或元素分组 |\n| `<figcaption>*` | 为 `<figure>` 添加说明或图表 |\n| `<figure>*`\
  \ | 定义自包含的内容 |\n| `<font>` | 定义内容的字体、类型、大小和颜色 – HTML5 不支持此项 |\n| `<footer>*` | 定义网页的页脚\
  \ |\n| `<form>` | 定义 HTML 表单 |\n| `<frame>` | 定义页面的特定部分，其中可能包含另一个 HTML 文件 – HTML5\
  \ 不支持此项 |\n| `<frameset>` | 定义一个 Frames 组 – HTML5 不支持此项 |\n| `<h1>` 到 `<h6>` | 定义文档中不同的标题级别\
  \ |\n| `<head>` | 定义 HTML 文档的头部部分 |\n| `<header>*` | 定义网页的头部 |\n| `<hr>` | 在段落级元素之间应用主题分隔\
  \ |\n| `<html>` | 代表 HTML 文档的根 |\n| `<i>` | 使用不同的语调表示文本 |\n| `<iframe>` | 定义用于嵌入其他内容的内联框架\
  \ |\n| `<img>` | 用于在 HTML 文档中插入图像 |\n| `<input>` | 定义 HTML 表单的输入字段 |\n| `<ins>`\
  \ | 表示插入文档的文本 |\n| `<isindex>` | 显示当前文档的搜索字符串 – HTML5 不支持此项 |\n| `<kbd>` | 定义键盘输入\
  \ |\n| `<label>` | 定义表单的输入字段标签 |\n| `<legend>` | 为 `<fieldset>` 定义标题 |\n| `<li>`\
  \ | 用于表示列表项 |\n| `<link>` | 用于表示外部资源与当前文档之间的关系 |\n| `<main>*` | 用于表示 HTML 文档的主内容\
  \ |\n| `<map>` | 定义带有活动区域的图像映射 |\n| `<mark>*` | 用于表示高亮文本 |\n| `<marquee>` | 用于插入垂直或水平的滚动文本或图像\
  \ – HTML5 不支持此项 |\n| `<menu>` | 用于创建包含命令的列表 |\n| `<meta>` | 定义 HTML 文档的元数据 |\n|\
  \ `<meter>*` | 用于定义具有分数值或已知范围的标量测量 |\n| `<nav>*` | 用于表示导航链接的页面节 |\n| `<noframes>`\
  \ | 在不支持 `<frame>` 元素的浏览器中提供备用内容 – HTML5 不支持此项 |\n| `<noscript>` | 在浏览器不支持脚本类型时提供备用内容\
  \ |\n| `<object>` | 用于在 HTML 文件中嵌入对象 |\n| `<ol>` | 用于定义有序项目列表 |\n| `<optgroup>`\
  \ | 用于分组下拉列表的选项 |\n| `<option>` | 用于定义下拉列表的项目或选项 |\n| `<output>*` | 作为容器并显示计算结果\
  \ |\n| `<p>` | 用于表示 HTML 文档段落 |\n| `<param>` | 用于定义 `<object>` 元素的参数 |\n| `<picture>*`\
  \ | 用于定义多个源元素和一个图像元素 |\n| `<pre>` | 用于定义 HTML 文档的预格式文本 |\n| `<progress>*` | 用于定义\
  \ HTML 文档中任务的进度 |\n| `<q>` | 用于定义短内联引用 |\n| `<rp>*` | 用于在浏览器不支持注音（ruby annotations）时定义备用内容\
  \ |\n| `<rt>` | 用于定义注音的读音和解释 |\n| `<ruby>` | 用于表示注音 |\n| `<s>` | 用于渲染错误或无关文本 |\n\
  | `<samp>` | 表示计算机程序的示例输出 |\n| `<script>` | 用于声明 HTML 文档的 JavaScript |\n| `<section>*`\
  \ | 用于定义文档的通用节 |\n| `<select>` | 用于表示一个提供选项菜单的控件 |\n| `<small>` | 将字体缩小为比文档基础字体更小一号\
  \ |\n| `<source>` | 用于为媒体元素定义多个资源，如 `<audio>`、`<video>` |\n| `<span>` | 用于分组和样式\
  \ |\n| `<strike>` | 渲染带下划线的文本 |\n| `<strong>` | 用于你认为重要的文本 |\n| `<style>` | 用于持有\
  \ HTML 定义的信息 |\n| `<sub>` | 定义你想要的下标文本 |\n| `<summary>*` | 为 `<details>` 定义摘要 |\n\
  | `<sup>` | 定义你想要的上标文本 |\n| `<svg>` | 用于可缩矢量图形 |\n| `<table>` | 用于表格格式表示数据或创建表格\
  \ |\n| `<tbody>` | 表示表格主体内容，配合 `<tfoot>` 和 `<thead>` 使用 |\n| `<td>` | 定义表格单元格数据\
  \ |\n| `<template>` | 用于页面加载时不显示的客户端内容，后续可用 JavaScript 渲染 |\n| `<textarea>` | 用于多行输出，如反馈、评论等\
  \ |\n| `<tfoot>` | 用于定义表格的页脚 |\n| `<th>` | 用于定义表格的头部单元格 |\n| `<thead>` | 用于定义表格的头部，配合\
  \ `<tfoot>` 和 `<tbody>` 使用 |\n| `<time>` | 用于定义 HTML 文档中的时间和日期 |\n| `<title>` |\
  \ 定义 HTML 文档的名称或标题 |\n| `<tr>` | 定义 表格行 |\n| `<track>` | 用于 `<audio>` 和 `<video>`\
  \ 元素的文本轨道 |\n| `<tt>` | 定义打字机字体 – HTML5 不支持此项 |\n| `<u>` | 用于渲染带下划线的文本 |\n| `<ul>`\
  \ | 用于定义无序列表 |\n| `<var>` | 用于定义编程或数学背景下的变量名 |\n| `<video>*` | 用于嵌入视频内容 |\n| `<wbr>*`\
  \ | 定义文本中可以换行的位置 |\n\n### HTML 属性\n\nHTML 属性类似于你在其他语言中找到关键字。它们是特殊的，并为元素提供更多细节——简而言之，它们用于修改\
  \ HTML 元素。\n\n每个标签或元素都可以有一个或多个属性，定义了元素的行为。关于属性，有几点需要注意：\n\n*   始终使用起始标签来应用\n*  \
  \ 必须始终以名称/值对的形式应用\n*   名称和值对大小写敏感，建议使用小写\n*   HTML 元素可以有多个属性，但它们之间必须有空格\n\n### 语法\n\
  \n属性使用的语法为：\n\n\n\n\n\n<element attribute_name=\"value\" > 内容 </element>\n\n这是一个示例：\n\
  \n```html\n<!DOCTYPE html >\n<html>\n<head>\n</head>\n<body>\n    <h1> 这是 Style\
  \ 属性 </h1>\n    <p style=\"height: 50px; color: blue\" > 它在元素中添加了 style 属性 </p>\n\
  \    <p style=\"color: red\" > 它改变了内容的颜色 </p>\n</body>\n</html>\n```\n\n运行此代码应该会在你的屏幕上输出以下内容：\n\
  \n这是 Style 属性\n它在元素中添加了 style 属性\n它改变了内容的颜色\n\n让我们来拆解一下：\n\n- `<p style=’height:\
  \ px; color: blue”> 它在元素中添加了 style 属性</p>` - 该语句使用了段落标签，并在其中应用了 style 属性。虽然这本书是关于\
  \ HTML 的，但当你想要在 HTML 元素上使用 CSS 属性时，这个属性非常有用。我们在这里执行的操作是设置了一个高度为 50px 的元素并将其更改为蓝色。\n\
  - `<p style=\"color: red\">它将改变内容的颜色</p>` - 再次使用了段落标签来包含 style 元素。这次我们将其改为了红色。\n\
  \n接下来，我们将查看一些常用的属性：\n\n### Title 属性 (Title Attribute)\n\n它在大多数浏览器中作为文本工具提示。当用户将光标悬停在文本或链接上时，将显示文本。它可以与任何链接或文本配合使用以显示相关描述。在下面的示例中，我们将其用于段落和标题标签：\n\
  \n使用 `<h1>` 标签：\n\n```html\n<h1 title=\"This is the heading tag\" > title 属性的示例\
  \ </h1>\n```\n\n使用 `<p>` 标签：\n\n```html\n<p title=\"This is the paragraph tag\"\
  \ > 将光标悬停在标题和段落上，描述将作为工具提示显示 </p>\n```\n\n代码示例为：\n\n```html\n<!DOCTYPE html >\n\
  <html>\n<head>\n</head>\n<body>\n  <h1 title=\"This is the heading tag\" > title\
  \ 属性的示例 </h1>\n  <p title=\"This is the paragraph tag\" > 将光标悬停在标题和段落上，描述将作为工具提示显示\
  \ </p>\n</body>\n</html>\n```\n\n在你的屏幕上，你会看到以下：\n\n### title 属性的示例\n将光标悬停在标题和段落上，描述将作为工具提示显示\n\
  \n### href 属性 (href Attribute)\n\n这是 `<a>` 锚点标签的主要属性，为锚点中指定的链接提供链接地址。简而言之，`href`\
  \ 提供了超链接；如果留空，它将留在同一页面。\n\n这是一个带有链接地址和不带链接地址的示例：\n\n带有链接地址：\n\n```html\n<a href=\"\
  https://www.Wikipedia.com/html-anchor\" > 这是一个链接 </a>\n```\n\n没有链接地址：\n\n```html\n\
  <a href=\"\" > 这是一个链接 </a>\n```\n\n输出将是：\n\n### href 属性的显示\n\n下面是锚点标签的链接；点击链接查看下一页\n\
  \n[这是一个链接](http://www.wikipedia.com/)\n\n### src 属性 (src Attribute)\n\n这是 `<img>`\
  \ 元素最重要的属性之一，事实上，它是必须的。它提供了在浏览器上显示的图像源。图像可以包含在相同或不同的目录中，且图像的名称或源必须正确——否则，图像将无法显示。\n\
  \n```html\n<img src=\"pigswimming.jpg\" height=\"1000\" width=\"584\" >\n```\n\n\
  注意，这也包含了 `width` 和 `height` 属性，定义了在浏览器上显示的图像大小。\n\n### src 属性的示例\nsrc 属性在浏览器上显示：\n\
  \n### 单引号还是双引号 (Single or Double Quotes)\n\n你注意到双引号被使用在 HTML 属性中。在 `src` 属性中，你应该使用哪一个？\n\
  \n使用双引号执行时：\n\n```html\n<a href=\"https://www.wikipedia.com/\" > 链接 </a>\n```\n\n\
  使用单引号执行时：\n\n```html\n<a href='https://www.wikipedia.com/' > 链接 </a>\n```\n\n在 HTML\
  \ 中，单引号和双引号是等价的。为了一致性，通常建议使用双引号。\n\n### 全局属性 (Global Attributes)\n\n全局属性是所有元素通用的属性。在\
  \ HTML5 中，带有 `*` 的属性如下：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| accesskey | 键盘快捷键 |\n\
  | class | 类名 |\n| contenteditable | 内容编辑 |\n| contextmenu | 右键菜单 |\n| data-* | 自定义数据\
  \ |\n| dir | 方向 |\n| draggable | 可拖拽 |\n| hidden | 隐藏 |\n| id | 唯一标识 |\n| lang |\
  \ 语言 |\n| style | 内联样式 |\n| spellcheck | 拼写检查 |\n| tabindex | 标签顺序 |\n| title |\
  \ 标题 |\n| translate | 翻译 |\n\n### 窗口事件属性 (Windows Event Attributes)\n\n这些事件属性应用于\
  \ `<body>` 标签并与窗口有关：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| onafterprint | 打印后执行 |\n\
  | onbeforeprint | 打印前执行 |\n| onbeforeunload | 卸载前执行 |\n| onerror | 发生错误时执行 |\n|\
  \ onhashchange | URL 发生变化时执行 |\n| onload | 页面完全加载后执行 |\n| onmessage | 发生消息事件时执行\
  \ |\n| onoffline | 网络断开且浏览器处于离线状态时执行 |\n| ononline | 浏览器恢复在线时执行 |\n| onpagehide\
  \ | 页面被隐藏（如用户离开页面）时执行 |\n| onpageshow | 页面获得焦点时执行 |\n| onpopstate | 窗口活动历史发生变化时执行\
  \ |\n| onresize | 窗口大小改变时执行 |\n| onstorage | 网页存储发生更新时执行 |\n| onunload | 窗口关闭或页面卸载时执行\
  \ |\n\n### 表单事件属性 (Form Event Attributes)\n\n这些发生在用户在表单内执行操作时。\n\n| 属性 |  |\n| :---\
  \ | :--- |\n| onblur | 表单元素失去焦点时执行 |\n| onchange | 元素值改变时执行 |\n| onfocus | 元素获得焦点时触发事件\
  \ |\n\n\n\n\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `oninput` | 当用户向元素添加输入时，执行脚本 |\n\
  | `oninvalid` | 当元素不满足预定义的约束时，执行脚本 |\n| `onreset` | 当用户重置表单元素的值时，触发事件 |\n| `onsearch`\
  \ | 当输入框进入搜索状态时，触发事件 |\n| `onselect` | 当用户选择文本时，触发事件 |\n| `onsubmit` | 在提交表单时触发事件\
  \ |\n\n### 键盘事件属性\n\n这些事件在用户与键盘进行交互时发生。这些是键盘事件：\n\n| 属性 | 描述 |\n| :--- | :--- |\n\
  | `onkeydown` | 当用户按下键盘按键时，触发事件 |\n| `onkeypress` | 当用户按下的键显示显示字符时，触发事件 |\n| `onkeyup`\
  \ | 当用户松开已按下的按键时，触发事件 |\n\n### 鼠标事件属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `onclick`\
  \ | 当元素被鼠标点击时，触发事件 |\n| `ondblclick` | 当元素被鼠标双击时，触发事件 |\n| `onmousedown` | 当鼠标按钮在元素上被点击按下时，触发事件\
  \ |\n| `onmousemove` | 当鼠标指针在元素上移动时，触发事件 |\n| `onmouseout` | 当鼠标移出元素范围时，触发事件 |\n\
  | `onmouseover` | 当鼠标移动到元素上时，触发事件 |\n| `onmouseup` | 在松开鼠标按钮时触发事件 |\n| `onmousewheel`\
  \ | 已弃 – 应该使用 `onwheel` 属性 |\n| `onwheel` | 当鼠标轮在元素上向下或向上滚动，触发事件 |\n\n### 剪贴板事件属性\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `oncopy` | 当用户复制内容到系统剪贴板时，触发事件 |\n| `oncut` |\
  \ 当元素中的内容被剪切并复制到剪贴板时，触发事件 |\n| `onpaste` | 当用户将内容粘贴到元素中时，触发事件 |\n\n### 媒体事件属性\n\n\
  | 属性 | 描述 |\n| :--- | :--- |\n| `onabort` | 当媒体播放中止时，执行脚本 |\n| `oncanplay` | 当媒体文件准备就绪播放时，执行脚本\
  \ |\n| `oncanplaythrough` | 当媒体文件可以在不停止或缓冲的情况下播放时，执行脚本 |\n| `oncuechange` | 当 `<track>`\
  \ 元素的文本提示更改时，执行脚本 |\n| `ondurationchange` | 当媒体文件的时长发生变化时，执行脚本 |\n| `onemptied`\
  \ | 如果由于媒体致命错误导致文件不可，则执行脚本 |\n| `onended` | 当媒体文件结束时，执行脚本 |\n| `onerror` | 在获取媒体数据时发生错误时，执行脚本\
  \ |\n| `onloadeddata` | 当媒体数据加载完成后，包含脚本 |\n| `onloadedmetadata` | 当媒体文件的元数据加载时，执行脚本\
  \ |\n| `onloadstart` | 当媒体文件开始加载时，执行脚本 |\n| `onpause` | 当播放暂停时，执行脚本 |\n| `onplay`\
  \ | 当暂停的媒体文件准备好再次播放时，执行脚本 |\n| `onplaying` | 当媒体文件开始播放时，执行脚本 |\n| `onprogress` |\
  \ 当浏览器开始检索媒体数据时，执行脚本 |\n| `onratechange` | 当播放速度变化时，执行脚本 |\n| `onseeked` | 当跳转操作结束且\
  \ `seeking` 属性被设置为 false 时，执行脚本 |\n| `onseeking` | 在激活跳转操作时执行脚本，并将 `seeking` 属性设置为\
  \ true |\n| `onstalled` | 当浏览器突然停止检索媒体数据时，执行脚本 |\n| `onsuspend` | 如果人为停止媒体数据抓取操作，则执行脚本\
  \ |\n| `ontimeupdate` | 当播放位置发生变化时（如快进或回退音轨），执行脚本 |\n| `onvolumechange` | 当媒体音量发生变化时（静音或取消静音），执行脚本\
  \ |\n| `onwaiting` | 当因需要加载更多数据而导致播放暂停时，执行脚本 |\n\n### HTML 元素\n\nHTML 文件由元素组成，元素用于创建网页并定义其上的内容。HTML\
  \ 元素通常由 `<tag name>`（起始标签）、内容（属性）和 `</tag name>`（结束标签）组成。请注意并非所有元素都有内容和结束标签。这些被称为空元素、空元素或自闭元素，包括\
  \ `<hr>`、`<br>` 等。这里有一个示例：\n\n```html\n<p> Hello world!!! </p>\n```\n\n这里还有一个示例：\n\
  \n```html\n<!DOCTYPE html >\n<html>\n<head>\n    <title> WebPage </title>\n</head>\n\
  <body>\n  <h1> This is my first web page </h1>\n  <h2> How does it look?</h2>\n\
  \    <p> It looks great! </p>\n</body>\n</html>\n```\n\n输出将是这样：\n\n这是我的第一个网页\n\n\
  看起来怎么样？\n\n看起来棒极了！\n\n注意 `<body>` 元素之间的内容可以在网页上看到。\n\n应该注意某些 HTML 元素可以嵌套，这意味着元素可以包含其他元素。\n\
  \n### 块级和内联 HTML 元素\n\n在 HTML 中，为了样式化的目的，元素分为两类：\n\n### 块级\n\n块级元素从新行开始，并占据可用宽度（它们向左右延伸到尽可能远）。\n\
  \n- `<address>`\n- `<article>`\n- `<aside>`\n- `<blockquote>`\n- `<body>`\n- `<div>`\n\
  - `<footer>`\n- `h1` 到 `h6`\n- `<header>`\n- `<hr>`\n- `<main>`\n- `<nav>`\n- `<ol>`\n\
  - `<p>`\n- `<pre>`\n- `<section>`\n- `<table>`\n- `<ul>`\n- `<div>`\n\n### 内联\n\n\
  内联元素不从新行开始，仅占据必要的宽度。它们用于包裹内联内容。\n\n- `<a>`\n- `<abbr>`\n- `<acronym>`\n- `<b>`\n\
  - `<bdo>`\n- `<big>`\n- `<br>`\n- `<button>`\n- `<cite>`\n- `<code>`\n- `<dfn>`\n\
  - `<em>`\n- `<i>`\n- `<img>`\n- `<input>`\n- `<kbd>`\n- `<label>`\n- `<map>`\n-\
  \ `<object>`\n- `<q>`\n- `<samp>`\n- `<script>`\n- `<select>`\n- `<small>`\n- `<span>`\n\
  - `<strong>`\n- `<sub>`\n- `<sup>`\n- `<textarea>`\n- `<time>`\n- `<tt>`\n- `<var>`\n\
  \n这里有一个示例：\n\n```html\n<!DOCTYPE html >\n<html>\n<head>\n    <title> WebPage </title>\n\
  </head>\n<body>\n  <div style=\"background-color: lightblue\">这是第一个 div </div>\n\
  \  <div style=\"background-color: lightgreen\">这是第二个 div </div>\n  <p style=\"background-color:\
  \ pink\">这仅占据文本宽度</p>\n</body>\n</html>\n```\n\n\n\n\n\n| `<h1>` ...... `<h6>` |\
  \ HTML 标题 | `</h1>`??.. | 用于提供页面标题 |\n| `<p>` | 段落 | `</p>` | 用于以段落形式显示内容 |\n| `<div>`\
  \ | div 区域 | `</div>` | 用于在网页中提供区域 |\n| `<br>` |  | ____________ | 空元素（Void element）——\
  \ 提供换行符 |\n| `<hr>` |  | ____________ | 空元素（Void element）—— 提供水平线 |\n\n\n\n\n\n\
  # 标题 1\n## 标题 2\n### 标题 3\n#### 标题 4\n##### 标题 5\n###### 标题 6\n\n请确保你只使用 `<h>` 标签作为内容的标题\
  \ – 它们绝不应用于放大或加粗你的文本。\n\n你也可以在嵌套元素中使用 `<h>` 标签。以下是使用标题标签的不同方式的示例：\n\n```html\n<!DOCTYPE\
  \ html > \n<html> \n  <head> \n    <title> Heading tags </title> \n  </head> \n\
  \  <body> \n    <h1> This is the main heading of the page. </h1> \n      <p> h1\
  \ is the most important , and is used to display the page keyword </p> \n    <h2>\
  \ This is the first sub-heading </h2> \n      <p> h2 describes the first sub heading\
  \ one the page. </p> \n      <h3> This is the second sub heading </h3> \n      <p>\
  \ h3 describes the second sub heading on the page. </p> \n      <p> We can use h1\
  \ to h6 tag to use different sub-heading with paragraphs if required. </p> \n  </body>\
  \ \n</html>\n```\n\n输出结果看起来像这样：\n\n这是页面的主标题\nh1 是最重要的，用于显示页面关键词\n这是第一个子标题\nh2 描述了页面上的第一个子标题\n\
  这是第二个子标题\nh3 描述了页面上的第二个子标题\n如果需要，我们可以使用 h1 到 h6 标签在段落中配合不同的子标题。\n\n### HTML 段落\n\
  \n`<p>` 标签用于定义网页页面内容中的段落。让我们来看一个简单的示例，看看它是如何运作的。值得注意的是，浏览器会在段落之前和之后添加空行。`<p>` 标签用于指示开始一个新段落。\n\
  \n注意 – 如果在一个 HTML 文件中使用多个 `<p>` 标签，浏览器会自动在段落之间添加一个空行。以下是示例：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>This is first paragraph.</p> \n<p>This is second paragraph.</p>\
  \ \n<p>This is third paragraph.</p> \n</body>\n</html>\n```\n\n输出结果是：\n\nThis is\
  \ the first paragraph\nThis is the second paragraph\nThis is the third paragraph\n\
  \n#### 段落空格\n\n如果你在 `<p>` 标签内部放置了额外的空格（无论是无意还是故意），浏览器在显示页面时会删除它们以及多余的空行。浏览器会将行数和空格数视作一个：\n\
  \n```html\n<p> \nI am \nProviding you with\nan HTML tutorial\nthat is hope you will\
  \ find beneficial. \n</p> \n<p> \nLook, I added in a lot \nof spaces           \
  \  I know that the browser will ignore them. \n</p> \n<p> \nYou cannot work out\
  \ what the HTML looks like</p> \n<p>because resized windows give different results.\
  \ \n</p> \n```\n\n以下是输出结果：\n\nI am providing you with a tutorial on HTML that I\
  \ hope you will find beneficial.\nLook, I added in a lot of spaces but I know that\
  \ the browser will ignore them.\nYou cannot work out what the HTML looks like because\
  \ resized windows give different results.\n\n#### 在 `<p>` 中使用 `<br>` 和 `<hr>`\n\n\
  当你需要换行时使用 `<br>` 标签，你可以将其包含在段落元素中。以下是一个展示其如何运作的示例：\n\n```html\n<!DOCTYPE html >\
  \ \n<html> \n    <head> \n    </head> \n  <body> \n      <h2> Use the line break\
  \ with the paragraph tag </h2> \n      <p><br> Mama and papa, and baby and Don,\
  \ \n    <br> Wanda and me? We all went to granny’s house \n             <br> on\
  \ Christmas day in Bobby’s sleigh. \n      </p> \n  </body>\n</html>\n```\n\n在段落标签上配合使用换行符\n\
  Mama and papa, and baby and Don,\nWanda and me? We all went to granny’s house\n\
  on Christmas day in Bobby’s sleigh\n\n`<hr>` 标签在段落或陈述之间应用一条水平线。以下是一个它与 `<p>` 标签一起使用的示例。\n\
  \n```html\n<!DOCTYPE html > \n<html>\n<head></head>\n<body>\n<h2> Example showing\
  \ a horizontal line with paragraphs </h2>\n<p> An HTML hr tag will draw a horizontal\
  \ line which separate two paragraphs .\n<hr> a new paragraph is started.\n</p>\n\
  </body>\n</html>\n```\n\n此内容的输出是：\n\nExample showing a horizontal line with paragraphs\n\
  An HTML hr tag will draw a horizontal line and separate two paragraphs with a new\
  \ paragraph is started.\n\n#### HTML 短语标签\n\nHTML 短语标签用于定义文本块的结构含义或特定文本的语义。这些是所有的短语标签\
  \ – 你能识别出其中一些：\n\n- `<abbr>`\n- `<acronym>`\n- `<mark>`\n- `<strong>`\n- `<em>`\n\
  - `<dfn>`\n- `<blockquote>`\n- `<q>`\n- `<code>`\n- `<kbd>`\n- `<address>`\n\n让我们详细查看这些标签：\n\
  \n1. **文本缩写**：当我们想要对某些文本进行缩写时，使用此标签。该文本放在 `<abbr>` 和 `</abbr>` 之间。这是一个示例：\n```html\n\
  <p><abbr title=\"Hypertext Markup language\">HTML</abbr> language used for pages.</p>\n\
  ```\n输出结果是：\nHypertext Markup language used for pages.\n\n2. **标记**：如果你想对特定内容进行高亮，可以使用\
  \ `<mark>` 和 `</mark>` 标签。这是一个示例：\n```html\n<p> This tag will <mark>highlight</mark>\
  \ the text.</p>\n```\n输出结果是：\nThis tag will highlight the text.\n\n3. **加粗**：如果你想显示某些文本为重要，应使用\
  \ `<strong>` 和 `</strong>` 标签。这是一个示例：\n```html\n<p> In HTML you should use <strong>lower-case</strong>,\
  \ when you write code.</p>\n```\n输出结果是：\nIn HTML you should use lower-case writing\
  \ code.\n\n4. **斜体**：如果你希望某些文本倾斜，应将其放在 `<em>` 和 `</em>` 之间。这是一个示例：\n```html\n<p>\
  \ HTML is an <em>easy</em> language to learn.</p>\n```\n输出结果是：\nHTML is an easy\
  \ language to learn.\n\n5. **定义**：`<dfn>` 标签用于指定内容的主关键词。这是一个如何使用的示例：\n```html\n\
  <p><dfn>HTML</dfn> is a markup language.</p>\n```\n输出结果是：\nHTML is a markup language.\n\
  \n6. **引用文本**：当你想要显示来自不同来源的内容时，使用 `<blockquote>` 标签。你可以通过使用 `cite` 属性提供来源 URL，源文本表示放在\
  \ `<cite>` 标签中。这是一个示例：\n```html\n<blockquote cite=\"https://www.keepinspiring.me/famous-quotes/\"\
  ><p>The first step toward success is taken when you refuse to be a captive of the\
  \ environment in which you find yourself.</p></blockquote>\n<cite>-Mark Caine</cite>\n\
  ```\n输出结果是：\n\"The first step toward success is taken when you refuse to be a captive\
  \ of the environment in which you find yourself.\" -Mark Caine\n\n7. **短引用**：如果你喜欢使用短引用，使用\
  \ `<q>` 标签。插入这些标签之间的文本将以双引号显示。这是一个示例：\n```html\n<p> Nelson Mandela said: <q>The\
  \ Greatest Glory In Living Lies In Never Falling, But In Rising Every Time We Fall.</q>\
  \ </p>\n```\n输出结果是：\nNelson Mandela said: \"The Greatest Glory In Living Lies In\
  \ Never Falling, But In Rising Every Time We Fall.\"\n\n8. **代码标签**：我们可以使用 `<code>`\
  \ 标签来显示特定的计算机代码。代码以等宽字体显示。这是一个示例：\n```html\n<p> First Java program </p>\n<p><code>class\
  \ Simple{ public static void main(String args[]){ System.out.println(\"Hello Java\"\
  ); }}</code></p>\n```\n输出结果是：\nFirst Java program\nclass Simple{ public static void\
  \ main(String args[]){ System.out.println(\"Hello Java\"); }}\n\n9. **键盘标签**\n\n\
  \n\n\n\n`<kbd>` 标签用于指示指定的内容是用户通过键盘输入的。这里有一个示例：\n\n<p> 请按下 <kbd> Ctrl </kbd> + <kbd>\
  \ Shift </kbd> + t <kbd></kbd> 来在 firefox 上恢复页面。 </p>\n\n以下是输出：\n\n键盘输入。\n\n请按下\
  \ Ctrl + Shift + t 来在 chrome 上恢复页面。\n\n## 10. Address 标签 (Address Tag)\n\n`address`\
  \ 标签用于定义内容作者的联系信息。`<address>` 和 `</address>` 之间的任何内容将以*斜体*显示。示例如下：\n\n<address>\
  \ 您可以通过 <a href=\"\" > example123@newdomain.com </a> 联系我们\n\n<br> 您也可以在以下地址找到我们：<br>\
  \ 1234 Pine street, Philadelphia, Pennsylvania, PA 19100. </address>\n\n输出为：\n\n\
  地址标签\n\n您可以通过 example123@newdomain.com 联系我们\n\n您也可以在以下地址找到我们：\n\n1234 Pine Street,\
  \ Philadelphia, Pennsylvania, PA 19100.\n\n## 第 5 章\n\n## 图像、表格和链接\n\n![](img/Image00001.jpg)\n\
  \n### HTML 图像\n\n每个人都知道，一个只有文字而没有图片的网站是非常无聊的，人们很快就会关闭它。添加图像可以显著提升您网站的外观和感受——这里是一些图像示例：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>HTML Image</h2>\n<img src=\"pic_girldancing.jpg\"\
  \ alt=\"girl dancing\" width=\"500\" height=\"333\">\n</body>\n</html>\n```\n\n\
  这将会显示以下内容，紧跟着一张图片：\n\nHTML Image\n\n另一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<h2>HTML Image</h2>\n<img src=\"img_girl.jpg\" alt=\"flower garden\" width=\"\
  500\" height=\"600\">\n</body>\n</html>\n```\n\n输出是：\n\nHTML Image\n\n![一张包含植物、花的图片\
  \ - 自动生成的描述](img/Image00003.jpg)\n\n最后一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<h2>HTML Image</h2>\n<img src=\"img_chania.jpg\" alt=\"open road\" width=\"\
  460\" height=\"345\">\n</body>\n</html>\n```\n\n它看起来像：\n\nHTML Image\n\n![一张包含自然、日落、云的图片\
  \ - 自动生成的描述](img/Image00004.jpg)\n\n### 语法与属性\n\n在 HTML 网页中嵌入图像需要使用 `<img>` 标签。从技术上讲，图像并不是被“插入”的；而是链接到一个存放图像的网页，而\
  \ `<img>` 标签是图像引用的容器。\n\n这是没有闭合标签的标签之一；它是空的，只包含属性，其中有两个是必选的：\n\n* `src` – 用于指定图像路径\n\
  * `alt` – 用于指定图像的备用文本——关于这一点稍后会介绍\n\n语法如下：\n\n```html\n<img src=\" url \" alt=\"\
  \ alternatetext \">\n```\n\n### src 属性\n\n`src` 属性用于指定图像的 URL 或路径。当您打开网页时，浏览器会在加载时获取图像并将其放入网页中。因此，您应该确保图像相对于网页的位置保持不变；否则，访问者只会看到损坏的链接图标。如果浏览器未能找到图像，它将显示损坏链接和\
  \ `alt` 文本。\n\n```html\n<img src=\"img_road.jpg\" alt=\"Open road\">\n```\n\n###\
  \ alt 属性\n\n`alt` 属性是另一个必选属性，它在观众无法看到图像时提供备备用文本。这可能是因为连接不佳、`src` 属性错误、正在使用屏幕阅读器等。`alt`\
  \ 属性的值用于描述图像：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>备用文本</h2>\n<p>alt\
  \ 属性用于反映图像的内容，以便无法查看图像的用户可以理解它是关于什么：</p>\n<img src=\"img_road.jpg\" alt=\"Open road\"\
  \ width=\"460\" height=\"345\">\n</body>\n</html>\n```\n\n如果浏览器无法定位图像，则显示 `alt`\
  \ 属性的值：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p> 如果浏览器无法定位图像，则显示 alt 属性的值：</p>\n\
  <img src=\"wrongname.gif\" alt=\"Open road\">\n</body>\n</html>\n```\n\n输出是：\n\n\
  如果浏览器无法定位图像，则显示 alt 属性的值：\n\n### 图像尺寸 - 宽度和高度\n\n`style` 属性用于指定图像的高度和宽度：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<h2>Image Size</h2>\n<p>这里使用 style 属性来指定图像的宽度和高度：</p>\n\
  <img src=\"img_girl.jpg\" alt=\"girl dancing\" style=\"width:500px;height:600px;\"\
  >\n</body>\n</html>\n```\n\n输出如下内容，紧跟着一张图片：\n\nHTML Image\n\n这里使用 style 属性来指定图像的宽度和高度：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>Image Size</h2>\n<p>这里使用 style 属性来指定图像的宽度和高度：</p>\n\
  <img src=\"img_girl.jpg\" alt=\"girl dancing\" style=\"width:500px;height:600px;\"\
  >\n</body>\n</html>\n```\n\n这里使用 style 属性来指定图像的宽度和高度：\n\n```html\n<img src=\"img_girl.jpg\"\
  \ alt=\"girl dancing\" style=\"width:500px;height:600px;\">\n```\n\n\n\n\n\n## 动画图像\n\
  \nHTML 允许动画图像：\n\n### 图片作为链接\n\n如果你想将图片用作链接，需要将 `<img>` 标签放在 `<a>` 标签内部：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<h2>图片作为链接</h2>\n<p>图片是一个链接，可以点击。</p>\n<a href=\"\
  default.asp\">\n<img src=\"smiley.gif\" alt=\"HTML tutorial\" style=\"width:42px;height:42px;\"\
  >\n</a>\n</body>\n</html>\n```\n\n输出结果如下，后面紧跟一个微笑笑脸：\n\n图片作为链接  \n图片是一个链接，可以点击。\n\
  \n### 常见图像格式\n\n这些是所有浏览器都支持的常见图像类型：\n\n| 缩写 | 文件格式 | 文件扩展名 |\n| :--- | :--- | :---\
  \ |\n| APNG | 动画可移植网络图形 | .apng |\n| GIF | 图像交换格式 | .gif |\n| ICO | 微软图标 | .ico,\
  \ .cur |\n| JPEG | 联合图像专家小组图像 | .jpg, .jpeg, .jfif, .pjpeg, .pjp |\n| PNG | 可移植网络图形\
  \ | .png |\n| SVG | 可缩矢量图形 | .svg |\n\n### HTML 图像标签\n\n* `<<img>>` - 用于定义图像\n*\
  \ `<map>` - 用于定义图像映射（image maps）\n* `<area>` - 用于定义图像映射中的点击区域\n* `<picture>` - 用于定义包含多个图像资源的容器\n\
  \n### HTML 表格\n\n在 HTML 中，你可以将数据排列成列和行：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\ntable {\n  font-family: arial, sans-serif;\n  border-collapse: collapse;\n\
  \  width: 100%;\n}\ntd, th {\n  border: 1px solid #dddddd;\n  text-align: left;\n\
  \  padding: 8px;\n}\ntr:nth-child(Ellie n) {\n  background-color: #dddddd;\n}\n\
  </style>\n</head>\n<body>\n<h2>HTML 表格</h2>\n<table>\n  <tr>\n    <th>公司</th>\n\
  \    <th>联系人</th>\n    <th>国家</th>\n  </tr>\n  <tr>\n    <td>Karl Werner</td>\n\
  \    <td>Griselda Winters</td>\n    <td>德国</td>\n  </tr>\n  <tr>\n    <td>Juan Carlos</td>\n\
  \    <td>Margarita del Carmen</td>\n    <td>墨西哥</td>\n  </tr>\n  <tr>\n    <td>Luisa\
  \ Bauer</td>\n    <td>Sebastian Huber</td>\n    <td>奥地利</td>\n  </tr>\n  <tr>\n\
  \    <td>Semantics Co Ltd</td>\n    <td>John Smith</td>\n    <td>英国</td>\n  </tr>\n\
  \  <tr>\n    <td>William Tremblay</td>\n    <td>Liam Williams</td>\n    <td>加拿大</td>\n\
  \  </tr>\n  <tr>\n    <td>Alessandro Berlusconi</td>\n    <td>Rosa Ricci</td>\n\
  \    <td>意大利</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\n该代码的输出为：\n\n| 公司\
  \ | 联系人 | 国家 |\n| :--- | :--- | :--- |\n| Karl Werner | Griselda Winters | 德国 |\n\
  | Juan Carlos | Margarita del Carmen | 墨西哥 |\n| Luisa Bauer | Sebastian Huber |\
  \ 奥地利 |\n| Semantic Co Ltd | John Smith | 英国 |\n| William Tremblay | Liam Williams\
  \ | 加拿大 |\n| Alessandro Berlusconi | Rosa Ricci | 意大利 |\n\n### 如何定义 HTML 表格\n\n\
  定义 HTML 表格是通过 `<table>` 标签完成的。使用 `<tr>` 标签定义每一行，而使用 `<th>` 标签定义表头。最后，使用 `<td>` 标签定义单元格/数据。默认情况下，`<th>`\
  \ 标签的文本为粗体并居中，而 `<td>` 标签的文本左对齐且为常规。\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<h2>基础 HTML 表格</h2>\n<table style=\"width:100%\">\n  <tr>\n    <th>名</th>\n\
  \    <th>姓</th>\n    <th>年龄</th>\n  </tr>\n  <tr>\n    <td>Gillian</td>\n    <td>Smith</td>\n\
  \    <td>50</td>\n  </tr>\n  <tr>\n    <td>Ellie</td>\n    <td>Merton</td>\n   \
  \ <td>94</td>\n  </tr>\n  <tr>\n    <td>John</td>\n    <td>Docherty</td>\n    <td>80</td>\n\
  \  </tr>\n</table>\n</body>\n</html>\n```\n\n输出为：\n\n基础 HTML 表格  \n| 名 | 姓 | 年龄\
  \ |\n| :--- | :--- | :--- |\n| Gillian | Smith | 50 |\n| Ellie | Merton | 94 |\n\
  | John | Docherty | 80 |\n\n注意 - `<td>` 元素是包含表格数据的图像、列表等 HTML 元素的容器。\n\n### 添加边框\n\
  \n许多人认为需要 CSS 为表格生成边框，但其实不需要：\n\n| Header | Header |\n| :--- | :--- |\n| Data |\
  \ Data |\n\n需要的 HTML 代码是：\n\n```html\n<table cellspacing=\"3\" bgcolor=\"#00000\"\
  >\n<tr><th>Header</tr>\n<tr><td>Data</tr>\n</table>\n```\n\n很久以前，在 90 年代，我们使用纯 HTML\
  \ 来处理边框，这是通过利用 `bgcolor` 和 `cellspacing` 属性实现的。如今，如果你倾向于使用 CSS，这是一个完美的方法：\n* 我们在\
  \ `<table>` 标签中使用 `bgcolor` 属性确保背景是特定的颜色\n* 在 `<tr>` 标签中，`bgcolor` 属性用于确保行和列的背景不同\n\
  * `<table>` 标签中的 `cellspacing` 属性在单元格周围创建空间。\n\n### 跨列单元格\n\n`colspan` 属性用于使单元格跨越多个列。这是一个示例：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ntable, th, td {\n  border:\
  \ 1px solid black;\n  border-collapse: collapse;\n}\nth, td {\n  padding: 5px;\n\
  \  text-align: left;\n}\n</style>\n</head>\n<body>\n<h2>跨列单元</h2>\n<p>`colspan`\
  \ 属性用于使单元格跨越一个列。</p>\n<table style=\"width:100%\">\n  <tr>\n    <th>姓名</th>\n  \
  \  <th colspan=\"2\">联系电话</th>\n  </tr>\n  <tr>\n    <td>Elon Musk</td>\n    <td>567852</td>\n\
  \    <td>567851</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\n输出为：\n\n跨列单元 \
  \ \n`colspan` 属性用于使单元格跨越一个列：\n\n| 姓名 | 联系电话 | |\n| :--- | :--- | :--- |\n| Elon\
  \ Musk | 567852 | 567851 |\n\n### 跨行单元格\n\n`rowspan` 属性用于使单元格跨越多个行：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ntable, th, td {\n  border: 1px solid black;\n\
  \  border-collapse: collapse;\n}\nth, td {\n  padding: 5px;\n  text-align: left;\n\
  }\n</style>\n</head>\n<body>\n<h2>跨行单元</h2>\n<p>`rowspan` 属性用于使单元格跨越一个行。</p>\n<table\
  \ style=\"width:100%\">\n  <tr>\n    <th>姓名：</th>\n    <td>Elon Musk</td>\n  </tr>\n\
  \  <tr>\n    <th rowspan=\"2\">联系电话：</th>\n    <td>567852</td>\n  </tr>\n  <tr>\n\
  \    <td>567851</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\n输出为：\n\n跨行单元 \
  \ \n`rowspan` 属性用于使单元格跨越一个行：\n\n| 姓名： | Elon Musk |\n| :--- | :--- |\n| 联系电话： |\
  \ 567852 |\n| 567851 |\n\n### 为表格添加标题\n\n`<caption>` 标签用于为表格添加标题：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\ntable, th, td {\n  border: 1px solid black;\n\
  \  border-collapse: collapse;\n}\nth, td {\n  padding: 5px;\n  text-align: left;\n\
  }\n</style>\n</head>\n<body>\n<h2>表格标题</h2>\n<p>caption 标签用于为表格添加标题。</p>\n<table\
  \ style=\"width:100%\">\n  <caption>每月储蓄</caption>\n  <tr>\n    <th>月份</th>\n  \
  \  <th>储蓄</th>\n  </tr>\n  <tr>\n    <td>3 月</td>\n    <td>$100</td>\n  </tr>\n\
  \  <tr>\n    <td>4 月</td>\n    <td>$50</td>\n  </tr>\n</table>\n</body>\n</html>\n\
  ```\n\n输出为：\n\n表格标题  \ncaption 标签用于为表格添加标题。\n\n| 每月储蓄 |\n| 月份 | 储蓄 |\n| 3 月 | $100\
  \ |\n| 4 月 | $50 |\n| | | |\n\n注意 `<caption>` 标签直接插入在 `<table>` 标签之后。\n\n### 特定表格的特殊样式\n\
  \n如果你想让特定表格具有特殊样式，必须通过 `id` 属性定义：\n\n```html\n<table id=\"t01\">\n  <tr>\n    <th>名</th>\n\
  \    <th>姓</th>\n    <th>年龄</th>\n  </tr>\n  <tr>\n    <td>Ellie \n    <td>Merton</td>\n\
  \    <td>94</td>\n  </tr>\n</table>\n```\n\n现在可以为表格定义特殊样式：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\ntable, th, td {\n```\n\n\n样式表格\n\n| 名字 | 姓 | 年龄\
  \ |\n| Gillian | Smith | 50 |\n| Ellie | Merton | 94 |\n| John | Docherty | 80 |\n\
  | 名字 | 姓 | 年龄 |\n| Gillian | Smith | 50 |\n| Ellie | Merton | 94 |\n| John | Docherty\
  \ | 80 |\n\n你还可以添加更多的样式：\n\n```css\n#t01 tr:nth-child(Ellie n) {\n  background-color:\
  \ #eee;\n}\n\n#t01 tr:nth-child(odd) {\n  background-color: #fff;\n}\n\n#t01 th\
  \ {\n  color: white;\n  background-color: black;\n}\n```\n\n将这些内容添加到代码中将产生输出输出：\n\
  \n样式表格\n\n| 名字 | 姓 | 年龄 |\n| Gillian | Smith | 50 |\n| Ellie | Merton | 94 |\n|\
  \ John | Docherty | 80 |\n| 名字 | 姓 | 年龄 |\n| Gillian | Smith | 50 |\n| Ellie | Merton\
  \ | 94 |\n| John | Docherty | 80 |\n\n### HTML 表格标签\n\n这些是 HTML 表格标签：\n\n| 标签 |or\
  \ |\n| :--- | :--- |\n| `<table>` | 用于定义表格 |\n| `<th>` | 用于定义表格的头单元格 |\n| `<tr>`\
  \ | 用于定义表格行 |\n| `<td>` | 用于定义表格单元格 |\n| `<caption>` | 用于定义表格标题 |\n| `<colgroup>`\
  \ | 用于指定表格中列组以便格式化 |\n| `<col>` | 用于指定 `<colgroup>` 标签内每列的属性 |\n| `<thead>` | 用于分组表格的头部内容\
  \ |\n| `<tbody>` | 用于分组表格主体内容 |\n| `<tfoot>` | 用于分组表格的页脚内容 |\n\n### HTML 链接\n\n\
  HTML 链接是一个超链接，当你点击它时，它会直接带你到另一个文档。你可能会注意到，当鼠标悬停在链接上时，鼠标光标会发生变化。注意，HTML 中的链接可以是文本、图像或其他元素。\n\
  \n### 语法\n\n`<a>` 标签用于定义超链接：\n\n```html\n<a href=\" url \"> 链接文本 </a>\n```\n\n`href`\
  \ 属性是 `<a>` 标签属性中最重要的属性，因为它用于指示链接的目标。链接文本是用户看到的内容，当他们点击它时，会被重定向到不同的 URL。\n\n以下是创建到\
  \ `Wikipedia.com` 链接的方法：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>HTML 链接</h1>\n\
  <p><a href=\"https://www.wikipedia.com/\">访问 Wikipedia.com!</a></p>\n</body>\n</html>\n\
  ```\n\n输出是：\n\nHTML 链接\n\n[访问 Wikipedia.com!](https://www.wikipedia.com/)\n\n在默认情况下，在所有浏览器中，链接显示如下：\n\
  \n- 带下划线且蓝色 – 未访问的链接\n- 带下划线且紫色 – 已访问的链接\n- 带下划线且红色 – 激活状态的链接\n\n### target 属性\n\
  \n默认情况下，链接页面在当前浏览器窗口中显示，但如果你想更改它，则必须指定另一个 `target`。`target` 属性用于指定链接的打开位置，它可以具有以下任何值：\n\
  \n- `_self` - 这是默认值，在点击链接的窗口或标签页中打开链接\n- `_blank` - 在不同的标签页或窗口中打开链接\n- `_parent_`\
  \ - 在父框架中打开链接\n- `_top_` - 在窗口的全主体中打开链接\n\n这是一个示例：\n\n`target=\"_blank\"` 用于在不同的标签页或窗口中打开链接：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>样式表格</h2>\n<a href=\"https://www.wikipedia.com/\"\
  \ target=\"_blank\">访问 Wikipedia.com!</a>\n</body>\n</html>\n```\n\n输出是：\n\n样式表格\n\
  \n[访问 Wikipedia.com!](https://www.wikipedia.com/)\n\n\n\n\n使用 `title` 属性来显示特定元素的额外信息。当鼠标光标悬停在元素上时，将以工具提示的形式显示。\n\
  \n[访问 Wikipedia](https://www.wikipedia.com/html/html_images.asp)\n\n输出为：\n\n# 链接标题\n\
  \n使用 `title` 属性来显示特定元素的额外信息。当鼠标光标悬停在元素上时，将以工具提示的形式显示：\n\n[访问 Wikipedia](https://www.wikipedia.com/html/html_images.asp)\n\
  \n### HTML 链接标签\n\n有一个你需要注意的链接标签：\n\n- `<a>` - 用于定义超链接\n\n# 第 6 章\n\n## HTML 列表\n\
  \n![](img/Image00001.jpg)\n\n在 HTML 中，列表被用于指定包含内容的列表。列表可以包含多个元素，HTML 中有三种类型的列表：\n\
  \n1. 有序列表或编号列表 – `ol`\n2. 无序列表或项目符号列表 – `ul`\n3. 描述列表或定义列表 – `dl`\n\n值得注意的是，列表可以在列表内部创建，被称为嵌套列表。让我们更详细地查看这些列表类型。\n\
  \n### 有序列表或编号列表 (ol)\n\n在有序或编号列表中，列表中的所有项目默认都用数字标记。`<ol>` 标签开始编号列表，`<li>` 标签用于开始项目列表：\n\
  \n```html\n<!DOCTYPE>\n<html> \n<body> \n<ol> \n<li>Libra</li> \n<li>Poker</li>\
  \ \n<li>Capricorn</li> \n<li>Oracle</li> \n</ol> \n</body>\n</html> \n```\n\n输出为：\n\
  \n1. Libra（天秤座）\n2. Poker（扑克）\n3. Capricorn（摩羯座）\n4. Oracle（甲骨）\n\n有序列表可以用于表示字母、数字或任何需要顺序格式的列表。编号列表分为五类：\n\
  \n1. 数字，例如 `1`、`2`、`3` 等。\n2. 大写罗马数字，例如 `I`、`II`、`III` 等。\n3. 小写罗马数字，例如 `i`、`ii`、`iii`\
  \ 等。\n4. 大写字母，例如 `A`、`B`、`C` 等。\n5. 小写字母，例如 `a`、`b`、`c` 等。\n\n`<ol>` 标签可以接受五种类型的属性来表示这五类列表：\n\
  \n| 类型 | 说明 |\n| :--- | :--- |\n| Type “1” | 默认 – 列表中所有项目使用数字排序 |\n| Type “I” |\
  \ 使用大写罗马数字对列表排序 |\n| Type “i” | 使用小写罗马数字对列表排序 |\n| Type “A” | 使用大写字母对列表排序 |\n| Type\
  \ “a” | 使用小写字母对列表排序 |\n\n这是一个有序列表的示例，显示了一个包含四个主题的编号列表。注意 `type=\"1\"` 没有定义，因为它是默认值，不需要定义：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<ol> \n<li>HTML</li> \n<li>Java</li>\
  \ \n<li>JavaScript</li> \n<li>SQL</li> \n</ol> \n</body>\n</html>\n```\n\n输出为：\n\
  \n1. HTML\n2. Java\n3. JavaScript\n4. SQL\n\n### ol type=\"I\"\n\n以及使用大写罗马数字显示的相同列表：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<ol type=\"I\"> \n<li>HTML</li> \n<li>Java</li>\
  \ \n<li>JavaScript</li> \n<li>SQL</li> \n</ol> \n</body>\n</html>\n```\n\n输出为：\n\
  \n1. HTML\n2. Java\n3. JavaScript\n4. SQL\n\n### ol type=\"i\"\n\n以及使用小写罗马数字的：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<ol type=\"i\"> \n<li>HTML</li> \n<li>Java</li>\
  \ \n<li>JavaScript</li> \n<li>SQL</li> \n</ol> \n</body>\n</html>\n```\n\n输出为：\n\
  \n1. HTML\n2. Java\n3. JavaScript\n4. SQL\n\n### ol type=\"A\"\n\n使用大写字母的：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<ol type=\"A\"> \n<li>HTML</li> \n<li>Java</li>\
  \ \n<li>JavaScript</li> \n<li>SQL</li> \n</ol>\n</body>\n</html>\n```\n\n输出为：\n\n\
  1. HTML\n2. Java\n3. JavaScript\n4. SQL\n\n### ol type=\"a\"\n\n最后，使用小写字母的：\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<ol type=\"a\"> \n<li>HTML</li> \n<li>Java</li>\
  \ \n<li>JavaScript</li> \n<li>SQL</li> \n</ol>\n</body>\n</html>\n```\n\n输出为：\n\n\
  1. HTML\n2. Java\n3. JavaScript\n4. SQL\n\n### Start 属性\n\n该属性配合 `<ol>` 标签使用，指定列表开始的位置：\n\
  \n- `<ol type=\"1\" start=\"5\">`: 从 5 开始显示。\n- `<ol type=\"A\" start=\"5\">`: 从\
  \ E 开始显示大写字母。\n- `<ol type=\"a\" start=\"5\">`: 从 e 开始显示小写字母。\n- `<ol type=\"I\"\
  \ start=\"5\">`: 从 V 开始显示大写罗马数字。\n- `<ol type=\"i\" start=\"5\">`: 从 v 开始显示小写罗马数字。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<ol type=\"i\" start=\"5\">\n<li>HTML</li>\
  \ \n<li>Java</li> \n<li>JavaScript</li> \n<li>SQL</li> \n</ol>\n</body>\n</html>\n\
  ```\n\n输出为：\n\n5. HTML\n6. Java\n7. JavaScript\n8. SQL\n\n### Reversed 属性\n\n`reversed`\
  \ 属性是一个布尔值，当配合 `<ol>` 标签使用时，会将列表倒序排列：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <ol reversed>\n<li>HTML</li> \n<li>Java</li> \n<li>JavaScript</li> \n<li>SQL</li>\
  \ \n</ol>\n</body>\n</html>\n```\n\n输出为：\n\n4. SQL\n3. JavaScript\n2. Java\n1. HTML\n\
  \n## 无序列表或项目符号列表 (ul)\n\n在无序列表中，使用项目符号来标记列表项目。`<ul>` 标签开始列表，`<li>` 标签开始列表项目：\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<ul> \n<li>Libra</li> \n<li>Poker</li>\
  \ \n<li>Capricorn</li> \n<li>Oracle</li> \n</ul>\n</body>\n</html>\n```\n\n输出为：\n\
  \n* Libra\n* Poker\n* Capricorn\n* Oracle\n\n无序列表或项目符号列表不需要特定的顺序。项目符号列表有四类型：\n\n\
  - `disc`\n- `circle`\n- `square`\n- `none`\n\n`<ul>` 标签有四种属性类型来表示不同的列表格式：\n\n| 类型\
  \ | 说明 |\n| :--- | :--- |\n| `disc` | 默认 – 使用实心圆标记列表项目 |\n| `circle` | 使用空圈标记列表项目\
  \ |\n| `square` | 使用正方形标记列表项目 |\n| `none` | 列表项目没有任何标记 |\n\n这是一个默认项目符号的示例：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<ul> \n<li>HTML</li> \n<li>Java</li> \n<li>JavaScript</li>\
  \ \n<li>SQL</li> \n</ul>\n</body>\n</html>\n```\n\n输出为：\n\n* HTML\n* Java\n* JavaScript\n\
  * SQL\n\n### ul type=\"circle\"\n\n以及圆圈格式：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<ul type=\"circle\"> \n<li>HTML</li> \n<li>Java</li> \n<li>JavaScript</li>\
  \ \n<li>SQL</li> \n</ul>\n</body>\n</html>\n```\n\n输出为：\n\n* HTML\n* Java\n* JavaScript\n\
  * SQL\n\n### ul type=\"square\"\n\n以及正方形格式：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<ul type=\"square\"> \n<li>HTML</li> \n<li>Java</li> \n<li>JavaScript</li>\
  \ \n<li>SQL</li> \n</ul>\n</body>\n</html>\n```\n\n输出为：\n\n* HTML\n* Java\n* JavaScript\n\
  * SQL\n\n### ul type=\"none\"\n\n以及“无标记”格式：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<ul type=\"none\"> \n<li>HTML</li> \n<li>Java</li> \n<li>JavaScript</li>\
  \ \n<li>SQL</li> \n</ul>\n</body>\n</html>\n```\n\n输出为：\n\nHTML\nJava\nJavaScript\n\
  SQL\n\n### 描述列表\n\n描述列表或定义列表样式在 HTML 和 XHTML 中均支持，条目的列表类似于百科全书或字典。当你需要术语列表、词表或其他键值列表时，最好使用这种列表，它包含三个标签：\n\
  \n1. `<dl>` 标签 – 用于定义列表的开始。\n2. `<dt>` 标签 – 用于定义术语。\n3. `<dd>` 标签 – 用于定义“定义”术语（描述）。\n\
  \n```html\n<!DOCTYPE>\n<<html> \n<body> \n<dl> \n<dt>Libra</dt> \n<dd>-一个星座。</dd>\
  \ \n<dt>Poker</dt> \n<dd>-我最喜欢的周末游戏之一</dd> \n<dt>Capricorn</dt>\n<dd>-另一个星座。</dd>\
  \ \n<dt>Oracle</dt> \n<dd>-一家跨国科技公司。</dd>  \n</dl> \n</body>\n</html> \n```\n\n\
  输出为：\n\nLibra\n-一个星座。\nPoker\n-我最喜欢的周末游戏之一\nCapricorn\n-另一个星座。\nOracle\n-一家跨国科技公司。\n\
  \n这是另一个示例：\n\n```html\n<!DOCTYPE>\n<html> \n<body> \n<dl> \n<dt>HTML</dt> \n```\n\
  \n\n\n\n\nHTML\n\n是一种标记语言\n\nJava\n\n是一个编程平台和语言\n\nJavaScript\n\n是一种脚本语言\n\nSQL\n\
  \n是一种查询语言\n\n### 嵌套列表\n\n列表内部的列表被称为嵌套列表。你可以在一个列表内部包含任何类型的列表，例如有序列表中的无序列表。\n\n```html\n\
  <!DOCTYPE html >\n<head>\n    <title> 嵌套列表 </title>\n</head>\n<body>\n    <p> 非洲国家及其首都是列表\
  \ </p>\n    <ol>\n        <li> 索马利亚\n            <ul>\n                <li> 摩加迪沙\
  \ (Mogadishu)</li>\n            </ul>\n        </li>\n        <li> 埃塞俄比亚\n     \
  \       <ul>\n                <li> 亚迪斯亚贝贝 (Adis Ababa)</li>\n            </ul>\n\
  \        </li>\n        <li> 冈比亚亚\n            <ul>\n                <li> 班朱尔 (Banjul)</li>\n\
  \            </ul>\n        </li>\n        <li> 塞拉内利昂\n            <ul>\n      \
  \          <li> 弗里亚敦 (Freetown)</li>\n            </ul>\n        </li>\n       \
  \ <li> 安哥拉\n            <ul>\n                <li> 卢安达 (Luanda)</li>\n         \
  \   </ul>\n        </li>\n        <li> 摩洛哥\n            <ul>\n                <li>\
  \ 拉巴特 (Rabat)</li>\n            </ul>  \n        </li>\n    </ol>\n</body>\n</html>\n\
  ```\n\n输出结果为：\n\n非洲国家及其首都是列表\n\n1. 索马利亚\n    * 摩加迪沙\n2. 埃塞俄比亚\n    * 亚迪斯亚贝贝\n3.\
  \ 冈比亚\n    * 班朱尔\n4. 塞拉内利昂\n    * 弗里亚敦\n5. 安哥拉\n    * 卢安达\n6. 摩洛哥\n    * 拉巴特\n\n\
  ## 第 7 章\n\n## HTML 表单\n\n![](img/Image00001.jpg)\n\nHTML 表单是文档中包含控件的部分。这些控件可以是菜单、复选框、密码字段、单选按钮、文本字段、提交按钮等。这些表单帮助用户输入所需的数据，包括姓名、密码、电子邮件地址、电话号码等。如果你希望从网站访问者那里收集某些数据，这些表单是必须的。例如，假设一个用户想从你的网站进行购买。他们需要为你提供收货地址、姓名、支付详情等，以确保订单能够被正确履行。\n\
  \n### HTML 表单语法\n\n包含表单的语法如下：\n\n```html\n<form action=\"server\" method=\"get|post\"\
  \ > \n//输入控件，例如文本框、文本区域、单选按钮、按钮 \n</form>\n```\n\n### HTML 表单标签\n\n这些是用于 HTML 表单的标签：\n\
  \n| 标签 |  |\n| :--- | :--- |\n| `<form>` | 用于定义 HTML 表单，供用户输入内容 |\n| `<input>` |\
  \ 用于定义输入控件 |\n| `<textarea>` | 用于定义多行输入 |\n| `<label>` | 用于为输入元素定义标签 |\n| `<fieldset>`\
  \ | 用于对表单中的相关元素 |\n| `<legend>` | 用于为 `<fieldset>` 元素定义标题 |\n| `<select>` | 用于定义下拉列表\
  \ |\n| `<optgroup>` | 用于在下拉列表中定义选项组 |\n| `<option>` | 用于定义下拉列表选项 |\n| `<button>`\
  \ | 用于定义可点击按钮 |\n\n### HTML5 表单属性\n\n| 标签 |  |\n| :--- | :--- |\n| `<datalist>`\
  \ | 用于指定预定义的输入控件 |\n| `<keygen>` | 用于在表单定义键对 |\n| `<output>` | 用于定义计算结果 |\n\n###\
  \ `<form>` 元素\n\n如前所述，`<form>` 元素为用户提供了输入信息的方法，并提供了不同的控件来实现此，包括密码字段、文本区域、文本字段等。需要注意的是，`<form>`\
  \ 元素本身不会创建表单；它是一个用于存放表单组成元素的容器。\n\n### `<input>` 元素\n\n这是最基本的表单元素之一，用于创建用户输入信息的表单字段。根据信息的类型，可以使用不同的输入字段。以下是一个显示简单文本输入的示例：\n\
  \n```html\n<body>\n  <form>\n    输入你的姓名 <br>\n    <input type=\"text\" name=\"username\"\
  >\n  </form>\n</body>\n```\n\n输出结果为：\n\n输入你的姓名![](img/Image00007.jpg)\n\n### 文本框控件\
  \ (TextField Control)\n\n`input` 标签的 `type=\"text\"` 属性用于创建一个称为单行控件的文本框控件。虽然添加 `name`\
  \ 属性是可选的，但如 `PHP`、`JSP` 等服务器端组件需要它。\n\n```html\n<form>\n    名: <input type=\"text\"\
  \ name=\"firstname\"/> <br>\n    姓: <input type=\"text\" name=\"lastname\"/> <br/>\n\
  </form>\n```\n\n此是输出结果：\n\n名:![](img/Image0008.jpg)\n姓![](img/Image0008.jpg)\n\n\
  如果漏掉了 `name` 属性，文本字段输入将不会发送到服务器。\n\n### `<textarea>` 标签\n\n当你在表单中使用多行文本时使用此标签。`<textarea>`\
  \ 的大小通过 `cols` 或 `rows` 属性指定。这里是一个示例：\n\n```html\n<!DOCTYPE html >\n<html>\n<head>\n\
  \    <title> HTML 中的表单 </title>\n</head>\n<body>\n  <form>\n    输入你的地址： <br>\n \
  \   <textarea rows=\"2\" cols=\"20\" ></textarea>\n  </form>\n</body>\n</html>\n\
  ```\n\n输出结果为：\n\n输入你的地址![](img/Image00009.jpg)\n\n### 标签标签 (Label Tag)\n\n最佳实践建议你应该在表单中带有标签，因为这可以确保代码对用户、浏览器和解析器更加友好。当点击标签时，文本控件将获得焦点。这要求标签标签具有与与输入标签的\
  \ `id` 属性匹配的属性。\n\n```html\n<form>\n    <label for=\"firstname\">名: </label> <br>\n\
  \    <input type=\"text\" id=\"firstname\" name=\"firstname\"/> <br>\n    <label\
  \ for=\"lastname\">姓: </label>\n    <input type=\"text\" id=\"lastname\" name=\"\
  lastname\"/> <br/>\n</form>\n```\n\n输出结果为：\n\n名:![](img/Image0008.jpg)\n姓![](img/Image0008.jpg)\n\
  \n### 密码字段控件 (Password Field Control)\n\n使用密码字段控件时，用户看不到密码：\n\n```html\n<form>\n\
  \    <label for=\"password\">密码: </label>\n    <input type=\"password\" id=\"password\"\
  \ name=\"password\"/>\n</form>\n```\n\n输出结果为：\n\n密码![](img/Image0008.jpg)\n\n###\
  \ 电子邮件字段控件 (Email Field Control)\n\n这是 HTML5 的新功能，用于验证用户输入了有效的电子邮件地址。此字段必须包含 `@`。\n\
  \n```html\n<form>\n    <label for=\"email\">电子邮件:</label>\n    <input type=\"email\"\
  \ id=\"email\" name=\"email\"/>\n</form>\n```\n\n你应该在浏览器中看到这个：\n\n电子邮件![](img/Image0008.jpg)\n\
  \n如果输入错误的电子邮件地址，屏幕将显示此类错误消息：\n\n电子邮件![](img/Image0010.jpg)\n\n请在电子邮件中包含 @\n\n###\
  \ 单选按钮控件 (Radio Button Control)\n\n单选按钮适用于给用户提供多个选项，例如测试、选择性别等。如果你将所有单选按钮命名为同一个，则每次只能选择一个：\n\
  \n```html\n<form>\n    <label for=\"gender\">性别:</label>\n    <input type=\"radio\"\
  \ id=\"gender\" name=\"gender\" value=\"male\"/>男性\n    <input type=\"radio\" id=\"\
  gender\" name=\"gender\" value=\"female\"/>女性 <br/>\n</form>\n```\n\n此输出在你的浏览器中看起来像这样：\n\
  \n![单选按钮控件](img/Image0011.gif)\n\n### 复选框控件 (Checkbox Control)\n\n当你的用户可以从多个复选框中勾选多个选项时使用复选框控件：\n\
  \n```html\n<form>\n    爱好: <br>\n    <input type=\"checkbox\" id=\"baseball\" name=\"\
  baseball\" value=\"baseball\"/>\n    <label for=\"baseball\"> 棒球 </label> <br>\n\
  \    <input type=\"checkbox\" id=\"basketball\" name=\"basketball\" value=\"basketball\"\
  />\n    <label for=\"basketball\"> 篮球 </label> <br>\n    <input type=\"checkbox\"\
  \ id=\"lacrosse\" name=\"lacrosse\" value=\"lacrosse\"/>\n    <label for=\"lacrosse\"\
  > 长曲球 </label>\n</form>\n```\n\n\n\n\n\n```html\n<label for=\"lacrosse\"> 长棍球 </label>\n\
  </form>\n```\n\n这些与单选按钮非常相似，但可以用于一次选择多个选项——而单选按钮一次只能选择一个选项。\n\n上述代码的输出将是：\n\n爱好：\n\
  \n 棒球\n 篮球\n 长棍球\n\n### 提交按钮控制\n\n在 HTML 中，当 Web 页面需要提交按钮时，使用 `<input type=\"\
  submit\">`，例如在注册账户或订阅邮件列表时。点击提交按钮时，用户的输入将被发送到服务器。其语法为：\n\n```html\n<input type=\"\
  submit\" value=\"submit\" >\n```\n\n将其拆解：\n\n- `type=\"submit\"` – 指定提交按钮的使用\n-\
  \ `value` 属性 – 你选择写在按钮上显示的任何内容\n- `name` 属性 – 可以省略\n\n这是一个示例：\n\n```html\n<form>\n\
  \    <label for=\"name\"> 输入名称 </label><br>\n    <input type=\"text\" id=\"name\"\
  \ name=\"name\" ><br>\n    <label for=\"pass\"> 输入密码 </label><br>\n    <input type=\"\
  Password\" id=\"pass\" name=\"pass\" ><br>\n    <input type=\"submit\" value=\"\
  submit\" >\n</form>\n```\n\n此的输出为：\n\n输入名称\n![](img/Image00012.jpg)\n\n输入密码\n![](img/Image00012.jpg)\n\
  ![](img/Image00013.jpg)\n\n### <fieldset> 元素\n\n当你想要在表单中将相关信息分组时，使用 `<fieldset>`\
  \ 元素。`<legend>` 元素配合它使用，为分组的元素提供标题。\n\n这是一个示例：\n\n```html\n<form>\n    <fieldset>\n\
  \        <legend> 用户信息： </legend>\n        <label for=\"name\"> 输入名称 </label><br>\n\
  \        <input type=\"text\" id=\"name\" name=\"name\" ><br>\n        <label for=\"\
  pass\"> 输入密码 </label><br>\n        <input type=\"Password\" id=\"pass\" name=\"\
  pass\" ><br>\n        <input type=\"submit\" value=\"submit\" >\n    </fieldset>\n\
  </form>\n```\n\n此的输出为：\n\n用户信息：\n输入名称：\n![](img/Image00014.jpg)\n\n输入密码：\n![](img/Image00014.jpg)\n\
  ![](img/Image00015.jpg)\n\n### HTML 表单示例\n\n这是一个简单的注册表单完整示例：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title> HTML 中的表单 </title>\n</head>\n<body>\n    <h2>\
  \ 注册表单</h2>\n    <form>\n        <fieldset>\n            <legend> 用户个人信息 </legend>\n\
  \            <label> 输入您的全名 </label><br>\n            <input type=\"text\" name=\"\
  name\" ><br>\n            <label> 输入您的电子邮箱 </label><br>\n            <input type=\"\
  email\" name=\"email\" ><br>\n            <label> 输入您的密码 </label><br>\n        \
  \    <input type=\"password\" name=\"pass\" ><br>\n            <label> 确认您的密码 </label><br>\n\
  \            <input type=\"password\" name=\"pass\" ><br>\n            <br><label>\
  \ 输入您的性别 </label><br>\n            <input type=\"radio\" id=\"gender\" name=\"gender\"\
  \ value=\"male\" /> 男 <br>\n            <input type=\"radio\" id=\"gender\" name=\"\
  gender\" value=\"female\" /> 女 <br/>\n            <input type=\"radio\" id=\"gender\"\
  \ name=\"gender\" value=\"others\" /> 其他 <br/>\n            <label> 输入您的地址：</br>\n\
  \            <textarea></textarea>\n            <input type=\"submit\" value=\"\
  sign-up\" >\n        </fieldset>\n    </form>\n</body>\n</html>\n```\n\n在你的屏幕上，你会看到类似这样的内容：![HTML\
  \ 表单](img/Image00016.gif)\n\n### HTML 表单输入\n\nHTML 表单最重要的元素之一是 `<input type=\"\"\
  >`。输入元素可以有各种 `type` 属性，用于定义信息字段。例如，`<input type=\"text\" name=\"name\">` 将提供一个文本框。\n\
  \n以下是 HTML 中不同的 `<input>` 元素类型：\n\n| type | 说明 |\n| :--- | :--- |\n| text | 用于定义单行文本的输入字段\
  \ |\n| password | 用于定义单行密码的输入字段 |\n| submit | 用于定义将表单发送到服务器的提交按钮 |\n| reset | 用于定义重置按钮，允许重置表单值\
  \ |\n| radio | 用于定义单选按钮，允许选择一个选项 |\n| checkbox | 用于定义复选框，允许选择多个选项 |\n| button |\
  \ 用于定义在给定事件上执行指定任务的推按钮 |\n| file | 用于定义从设备存储器中选择文件的方法 |\n| image | 用于定义带有图形表示的提交按钮\
  \ |\n\n在 HTML5 中，`<input>` 元素又添加了 10 种新类型：\n\n| type | 说明 |\n| :--- | :--- |\n|\
  \ color | 用于定义指定颜色的输入字段 |\n| date | 用于定义日期的输入字段 |\n| datetime-local | 用于定义本地时间的输入字段\
  \ |\n| email | 用于定义电子邮箱的输入字段 |\n| month | 用于定义月份的输入字段 |\n| number | 用于定义数字输入字段 |\n\
  | url | 用于定义 URL 的输入字段 |\n| week | 用于定义周的输入字段 |\n| search | 用于定义搜索的输入字段 |\n| tel\
  \ | 用于定义电话号码的输入字段 |\n\n\n\n\n\n用户 ID：![](img/Image00020.jpg) 密码：![](img/Image00021.jpg)\n\
  \n![](img/Image00022.jpg) ![](img/Image00023.jpg)\n\n当你输入用户 ID 和密码并点击按钮时，输入字段将重置为默认值。\n\
  \n### `<input type=\"radio\">`\n\n`<input>` 的 “radio” 类型用于定义单选按钮，允许用户从多个相关选项中选择一个。每次只能选择一个选项。这是一个示例：\n\
  \n```html\n<form>\n  <p> 请选择你最喜欢的颜色 </p>\n  <input type=\"radio\" name=\"color\"\
  \ value=\"white\" > 白色 <br>\n  <input type=\"radio\" name=\"color\" value=\"yellow\"\
  \ > 黄色 <br>\n  <input type=\"radio\" name=\"color\" value=\"black\" > 黑色 <br>\n\
  \  <input type=\"radio\" name=\"color\" value=\"red\" > 红色 <br>\n  <input type=\"\
  submit\" value=\"submit\" >\n</form>\n```\n\n输出是：\n\n输入 \"radio\" 类型\n表单顶部\n请选择你最喜欢的颜色\n\
  ![](img/Image00024.jpg) 白色\n![](img/Image00024.jpg) 黄色\n![](img/Image00024.jpg)\
  \ 黑色\n![](img/Image00024.jpg) 红色\n![](img/Image00025.jpg)\n\n### `<input type=\"\
  checkbox\">`\n\n`<input>` 的 “checkbox” 类型显示正方形框，用户可以勾选或取消勾选来从一系列给定选项中选择。这些与单选按钮类似，但单选按钮只允许用户在任何时候选择一个选项，而复选框允许他们选择多个。这是一个示例：\n\
  \n```html\n<form>\n  <label> 输入你的姓名： </label>\n  <input type=\"text\" name=\"name\"\
  \ >\n  <p> 请选择你最喜欢的运动 </p>\n  <input type=\"checkbox\" name=\"sport1\" value=\"\
  baseball\" > 棒球 <br>\n  <input type=\"checkbox\" name=\"sport2\" value=\"tennis\"\
  \ > 网球 <br>\n  <input type=\"checkbox\" name=\"sport3\" value=\"basketball\" > 篮球\
  \ <br>\n  <input type=\"checkbox\" name=\"sport4\" value=\"baseball\" > 棒球 <br>\n\
  \  <input type=\"checkbox\" name=\"sport5\" value=\"badminton\" > 羽毛球 <br><br>\n\
  \  <input type=\"submit\" value=\"submit\" >\n</form>\n```\n\n输出是：\n\n输入 \"checkbox\"\
  \ 类型\n注册表\n表单顶部\n输入你的姓名：![](img/Image00017.jpg)\n请选择你最喜欢的运动\n![](img/Image00026.jpg)\
  \ 棒球\n![](img/Image00026.jpg) 网球\n![](img/Image00026.jpg) 篮球\n![](img/Image00026.jpg)\
  \ 棒球\n![](img/Image00026.jpg) 羽毛球\n![](img/Image00027.jpg)\n\n### `<input type=\"\
  button\">`\n\n这用于定义简单的推入按钮，然后对其进行编程以控制事件功能，例如点击事件时会发生什么。虽然它主要配合 JavaScript 工作，但在\
  \ HTML 中同样有效：\n\n```html\n<form>\n  <input type=\"button\" value=\"点击我 \" onclick=\"\
  alert('you are learning HTML')\" >\n</form>\n```\n\n输出是：\n\n输入 \"button\" 类型。\n\
  点击按钮查看结果：\n\n### `<input type=\"file\">`\n\n“file” `<input>` 类型用于你想让用户从自己的设备存储器中选择一个或多个文件。当文件被选中并提交后，就可以将其上传到服务器，但这需要文件\
  \ API 和一些 JavaScript 代码，这超出了本书的范围。\n\n```html\n<form>\n  <label> 选择要上传的文件： </label>\n\
  \  <input type=\"file\" name=\"newfile\" >\n  <input type=\"submit\" value=\"submit\"\
  \ >\n</form>\n```\n\n输出是：\n\n输入 \"file\" 类型。\n选择任何类型的文件，选中的文件将显示“选择文件”选项旁边：\n我们可以选择任何类型的文件，直到我们不指定它！选中的文件将出现在“选择文件”选项旁边\n\
  表单顶部\n选择文件以上传：![](img/Image00028.jpg)\n\n### `<input type=\"image\">`\n\n这种类型的 `<input>`\
  \ 元素代表带有图片的提交按钮：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>输入 \"image\"\
  \ 类型。</h2>\n  <p> 图像可以作为提交按钮 </p>\n  <form>\n    <label> 用户 ID： </label><br>\n \
  \   <input type=\"text\" name=\"name\" /><br>\n    <input type=\"image\" alt=\"\
  提交\" src=\"login.png\" width=\"100px\" >\n  </form>\n</body>\n</html>\n```\n\n###\
  \ 新的 HTML5 <input> 类型\n\n### `<input type=\"color\">`\n\n这定义了带有颜色的输入字段，并允许用户使用浏览器中的视觉界面指定他们想要的颜色。请注意，`color`\
  \ 将使用十六进制值。\n\n```html\n<form>\n  <label> 选择颜色：</label>\n  <input type=\"color\"\
  \ name=\"favcolor\" value=\"#ff0000\" >\n  <input type=\"submit\" value=\"submit\"\
  \ >\n</form>\n```\n\n输出是：\n\n输入 \"color\" 类型\n表单顶部\n选择颜色：\n\n\n\n\n\n```html\n<input\
  \ type=\"url\" name=\"website\" placeholder=\"http://example.com\" ><br>\n<input\
  \ type=\"submit\" value=\"send data\" >\n</form>\n```\n\n输出是：\n\n\"url\" 类型输入\n\n\
  表单顶部\n\n输入您的网站 URL：\n\n![](img/Image00035.jpg)\n\n### `<input type=\"week\">`\n\n\
  此输入类型将创建一个输入字段，用户可以从下拉日历中选择周和年份，而无需提供时区。\n\n```html\n<form>\n    <label><b 选择您一年中中最棒的一周：\
  \ </b></label><br><br>\n    <input type=\"week\" name=\"bestweek\" >\n    <input\
  \ type=\"submit\" value=\"Send data\" >\n</form>\n```\n\n输出是：\n\n\"week\" 类型输入\n\
  \n表单顶部\n\n选择您一年中中最棒的一周：\n\n![](img/Image00036.jpg)\n\n### `<input type=\"search\"\
  >`\n\n““search” `<input>` 元素将创建一个允许用户输入搜索字符串的输入字段。这些字段在功能上设计为与文本类型对称，但可以有不同的样式。\n\
  \n```html\n<form>\n    <label> 在此处搜索： </label>\n    <input type=\"search\" name=\"\
  q\" >\n    <input type=\"submit\" value=\"search\" >\n</form>\n```\n\n输出是：\n\n\"\
  search\" 类型输入\n\n表单顶部\n\n在此处搜索：![](img/Image00037.jpg)\n\n### `<input type=\"tel\"\
  >`\n\n使用此元素允许您创建一个允许用户输入电话号码的输入字段。该类型没有默认验证（如 email 类型那样），因为电话号码的格式在世界各地是不同的。\n\n\
  ```html\n<form>\n    <label><b 输入您的电话号码（格式为 xxx-xxx-xxxx）： </b></label>\n    <input\
  \ type=\"tel\" name=\"telephone\" pattern=\"[0-9]{3}-[0-9]{3}-[0-9]{4}\" requiwhite\
  \ >\n    <input type=\"submit\" ><br><br>\n</form>\n```\n\n输出是：\n\n\"tel\" 类型输入\n\
  \n表单顶部\n\n输入您的电话号码（格式为 xxx-xxx-xxxx）：![](img/Image00038.jpg)\n\n表单底部\n\n注意我们在这里使用的两个属性是\
  \ `pattern` 和 `required` – 这些允许用户按特定格式输入数字，并且在需要将数字输入输入字段时是必须的。\n\n### HTML 表单属性\n\
  \nHTML 包含许多可以与 `<form>` 元素配合属性：\n\n### `action` 属性\n\n当此属性用于 `<form>` 元素时，它定义了表单在提交或用作\
  \ URI 时需要发生什么，用于处理表单上的信息。\n\n它可能是您想在表单处理中使用的 URI，也可能是 `.asp`、`.jsp`、`.pho` 等。如果未包含属性值，表单将在本地处理并留在当前页面。这是一个示例：\n\
  \n```html\n<form action=\"action.html\" method=\"post\" >\n    <label> 用户名： </label><br>\n\
  \    <input type=\"text\" name=\"name\" ><br><br>\n    <label> 用户密码 </label>\n \
  \   <input type=\"password\" name=\"pass\" ><br><br>\n    <input type=\"submit\"\
  \ >\n</form>\n```\n\n输出是：\n\n表单元素 action 属性的演示\n\n表单顶部\n\n用户名：\n\n![](img/Image00017.jpg)\n\
  \n用户密码\n\n![](img/Image00017.jpg)\n\n![](img/Image00039.jpg)\n\n当点击提交（Submit）按钮时，用户将被重定向到名为\
  \ `action.html` 的另一个页面。\n\n### `method` 属性\n\n此属性用于定义浏览器提交表单时使用的 HTTP 方法。它的可能的值有：\n\
  \n- `post`：当我们想要提交敏感数据时使用 – 这不会在 URL 中显示提交的数据。\n\n```html\n<form action=\"action.html\"\
  \ method=\"post\" >\n```\n\n- `get`：这是表单提交时的默认值，但是不安全的，因为表单提交后数据将显示在 URL 中：\n\n\
  ```html\n<form action=\"action.html\" method=\"get\" >\n```\n\n当提交数据时，输入的文本将显示如下：\n\
  \n`file:///D:/HTML/action.html?name=wikipedia&pass=123`\n\n### `target` 属性\n\n此属性用于定义表单提交后响应应该在哪里打开。这些是与此属性使用的关键字：\n\
  \n- `_self`：如果用作属性值，响应将只在当前页面显示：\n\n```html\n<form action=\"action.html\" method=\"\
  get\" target=\"_self\" >\n```\n\n- `_blank`：如果用作属性，响应将在新页面加载。\n\n```html\n<form\
  \ action=\"action.html\" method=\"get\" target=\"_blank\" >\n```\n\n### `autocomplete`\
  \ 属性\n\nautocomplete 属性是 HTML5 新增的，用于启用输入字段。有两个值 “on” 和 “off” – 它们提供了自动完成选项。\n\n\
  ```html\n<form action=\"action.html\" method=\"get\" autocomplete=\"on\" >\n<form\
  \ action=\"action.html\" method=\"get\" autocomplete=\"off\" >\n```\n\n### `enctype`\
  \ 属性\n\n此属性用于定义表单发送到服务器时的编码类型。可能的值有：\n\n- `application/x-www-form-urlencoded`：这是提交时的默认类型。它会对所有字符进行编码。\n\
  \n```html\n<form action=\"action.html\" method=\"post\" enctype=\"application/x-www-form-urlencoded\"\
  \ >\n```\n\n- `multipart/form-data`：当存在文件控件时使用。\n\n```html\n<form action=\"action.html\"\
  \ method=\"post\" enctype=\"multipart/form-data\" >\n```\n\n- `text/plain`：这只会编码空格；其他字符将编码。\n\
  \n```html\n<form action=\"action.html\" method=\"post\" enctype=\"text/plain\" >\n\
  ```\n\n### `novalidate` 属性\n\n这是添加到 `<form>` 的布尔值属性。如果对表单应用 `novalidate`，则提交时不会进行验证。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <h2> 表单</h2>\n    <form action=\"\
  action.html\" method=\"get\" novalidate>\n        <input type=\"text\" name=\"name\"\
  >\n        <input type=\"number\" name=\"age\">\n        <input type=\"email\" name=\"\
  email\">\n        <input type=\"submit\">\n    </form>\n    <p><b>尝试填写表单详情查看效果。</b></p>\n\
  </body>\n</html>\n```\n\n输出是：\n\n填充表单\n\n表单顶部\n\nname：\n\nage：\n\nemail：\n\n![](img/Image0040.jpg)\n\
  \n### `name` 属性\n\n该属性用于定义输入元素的名称。表单提交时，HTTP 请求将包含名称-值对。如果省略名称，输入字段将不会被处理。\n\n```html\n\
  <form action=\"action.html\" method=\"get\" >\n    <input type=\"text\" name=\"\
  name\" >\n    <input type=\"number\" name=\"age\" >\n    <input type=\"email\" name=\"\
  email\" >\n    <input type=\"submit\" value=\"Submit\" >\n</form>\n```\n\n输出是：\n\
  \n填充表单\n\n表单顶部\n\nname：\n\nage：\n\nemail：\n\n![](img/Image0041.jpg)\n\n### `value`\
  \ 属性\n\n此属性用于定义输入字段的初始或默认值。\n\n```html\n<form>\n    <label> 输入您的姓名 </label>\n  \
  \  <input type=\"text\" name=\"uname\" value=\"Input Name\" >\n    <label> 输入您的邮箱地址\
  \ </label>\n    <input type=\"text\" name=\"uname\" value=\"Input email\" >\n  \
  \  <label> 输入您的密码 </label>\n    <input type=\"password\" name=\"pass\" value=\"\"\
  \ >\n    <input type=\"submit\" value=\"login\" >\n</form>\n```\n\n输出是：\n\n填充表单\n\
  \n表单顶部\n\n输入姓名\n\n输入邮箱地址\n\n![](img/Image0042.jpg)\n\n\n\n\n\n![](img/Image00043.jpg)\n\
  \n输入您的密码\n\n![](img/Image00044.jpg)\n![](img/Image00045.jpg)\n\n表单底部\n\n`value`\
  \ 属性始终会在密码输入字段中自动清除。\n\n### required HTML5 属性\n\n该属性是一个布尔值，用于指定在提交表单之前必须填写某个字段：\n\
  \n```html\n<form>\n    <label> 输入您的邮箱地址 </label><br>\n    <input type=\"text\" name=\"\
  uname\" required ><br><br>\n    <label> 输入您的密码 </label><br>\n    <input type=\"\
  password\" name=\"pass\" ><br><br>\n    <input type=\"submit\" value=\"login\" >\n\
  </form>\n```\n\n输出结果为：\n\n填写表单\n\n表单顶部\n\n输入您的邮箱地址\n\n![](img/Image00044.jpg)\n\n\
  输入您的密码\n\n![](img/Image00044.jpg)\n![](img/Image00046.jpg)\n\n在提交表单时如果邮箱字段未填写，将显示错误消息。\n\
  \n### autofocus HTML5 属性\n\n另一个布尔值属性，它允许字段在网页加载后自动获得焦点。\n\n```html\n<form>\n   \
  \ <label> 输入您的邮箱地址 </label><br>\n    <input type=\"text\" name=\"uname\" autofocus\
  \ ><br><br>\n    <label> 输入您的密码 </label><br>\n    <input type=\"password\" name=\"\
  pass\" ><br><br>\n    <input type=\"submit\" value=\"login\" >\n</form>\n```\n\n\
  ### placeholder HTML5 属性\n\n`placeholder` 用于指定字段中的文本，告诉用户期望他们输入的内容。它可以与密码、文本、URL\
  \ 和邮箱值一起使用，当输入了 `value` 时，`placeholder` 会被移除。\n\n```html\n<form>\n    <label> 输入您的姓名\
  \ </label><br>\n    <input type=\"text\" name=\"uname\" placeholder=\"您的姓名\" ><br><br>\n\
  \    <label> 输入您的邮箱地址 </label><br>\n    <input type=\"email\" name=\"email\" placeholder=\"\
  example@gmail.com\" ><br><br>\n    <label> 输入您的密码 </label><br>\n    <input type=\"\
  password\" name=\"pass\" placeholder=\"您的密码\" ><br><br>\n    <input type=\"submit\"\
  \ value=\"login\" >\n</form>\n```\n\n输出结果为：\n\n注册表单\n\n表单顶部\n\n输入您的姓名\n\n![](img/Image00044.jpg)\n\
  \n输入您的邮箱地址\n\n输入您的密码\n\n![](img/Image00044.jpg)\n![](img/Image00047.jpg)\n\n###\
  \ disabled 属性\n\n该属性将禁用应用的输入字段，意味着用户无法与该字段进行交互。它无法接收任何点击事件，并且在提交表单时，值不会被发送到服务器。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <h3>注册表单</h3>\n    <form>\n    \
  \    <label>输入用户名</label><br>\n        <input type=\"text\" name=\"uname\" value=\"\
  USER\" disabled><br><br>\n        <label>输入您的邮箱地址</label><br>\n        <input type=\"\
  email\" name=\"email\" placeholder=\"example@gmail.com\"><br><br>\n        <label>输入您的密码</label><br>\n\
  \        <input type=\"password\" name=\"pass\" placeholder=\"您的密码\"><br><br>\n\
  \        <input type=\"submit\" value=\"login\">\n    </form>\n</body>\n</html>\n\
  ```\n\n输出结果为：\n\n注册表单\n\n表单顶部\n\n输入用户名\n\n![](img/Image00048.jpg)\n\n输入邮箱地址\n\n\
  输入您的密码\n\n![](img/Image00044.jpg)\n![](img/Image00049.jpg)\n\n### size 属性\n\n该属性用于按字符数控制输入字段的大小：\n\
  \n```html\n<label> 账户持有人 </label><br>\n<input type=\"text\" name=\"uname\" size=\"\
  40\" required ><br><br>\n<label> 账号 </label><br>\n<input type=\"text\" name=\"an\"\
  \ size=\"30\" required ><br><br>\n<label> CVV </label><br>\n<input type=\"text\"\
  \ name=\"cvv\" size=\"1\" required ><br>\n```\n\n输出结果为：\n\n带有禁用属性的注册表单\n\n表单顶部\n\
  \n账户名称\n\n![](img/Image00050.jpg)\n\n账号\n\n![](img/Image00051.jpg)\n\nCVV\n\n![](img/Image00052.jpg)\n\
  ![](img/Image00053.jpg)\n\n### form 属性\n\n该属性允许用户为表单指定外部字段，但该字段仍然是主表单的一部分。\n\n```html\n\
  User email: <input type=\"email\" name=\"email\" form=\"fcontrol\" required ><br>\n\
  <input type=\"submit\" form=\"fcontrol\" >\n```\n\n输出结果为：\n\n表单顶部\n\n用户名：\n\n![](img/Image00044.jpg)\n\
  \n用户密码：\n\n![](img/Image00044.jpg)\n\n表单底部\n\n邮箱字段是外部的\n\nUser email:\n\n![](img/Image00044.jpg)\n\
  \n# 8\n\n### Class Attribute\n\n![](img/Image00054.jpg)\n\n### required Attribute\n\
  \n![](img/Image00045.jpg)\n\n### autofocus Attribute\n\n![](img/Image00046.jpg)\n\
  \n### placeholder Attribute\n\n![](img/Image00047.jpg)\n\n### disabled Attribute\n\
  \n![](img/Image00048.jpg)\n\n### size Attribute\n\n![](img/Image00049.jpg)\n\n###\
  \ form Attribute\n\n![](img/Image00050.jpg)\n\n![](img/Image00051.jpg)\n\n![](img/Image00052.jpg)\n\
  ![](img/Image00053.jpg)\n\n\n\n\n如今，现代网站通常使用固定菜单进行导航，当你向下滚动页面时，它们通常显示在页面的顶部或侧边。然而，尽管现在是使用\
  \ CSS 实现的，但网页浏览器并非一直都支持 CSS。可以使用两个 HTML 元素来提供相同的页面布局，其中某些内容保持静态，而部分内容可以滚动——`frameset`\
  \ 和 `frame`。\n\n然而，框架确实自带了一系列问题，首先是易用性。随着如今移动设备和较小显示器的越来越流行，网站提供可以根据视口更改的视图至关重要。你可以通过操作\
  \ `frame` 来提供某种程度的响应式，但它们并不真正适用于响应式网站。其次是可访问性，许多辅助技术（如屏幕阅读器）在理解带有框架的网站并与其通信时会非常困难。\n\
  \n## 如何创建框架\n\n框架背后的概念非常简单：\n\n*   `frameset`元素用于在 HTML 文档中代替 `body` 元素\n*   `frame`\
  \ 元素用于为网页内容创建框架\n*   `src` 属性用于识别每个框架中加载的资源\n*   并且可以为每个框架创建带有相关内容的字体\n\n让我们来看看这一切是如何运作的。首先，我们将创建四个\
  \ HTML 文档。这是第一个：\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <h1>Frame\
  \ 1</h1>\n        <p>Frame 1 contents</p>\n    </body>\n</html>\n```\n\n\n\n\n\n\
  ```html\n<frame src=\"frame_2.html\" frameborder=\"0\">\n    <frame src=\"frame_3.html\"\
  \ frameborder=\"0\">\n    <frame src=\"frame_4.html\" frameborder=\"0\">\n</frameset>\n\
  </frameset>\n```\n\n我们对第一个框架应用了 `marginheight` 属性，在内容上方和下方留出了 `15px` 的内边距。`frameborder`\
  \ 的值为 `0`，移除了底部三个框架的边框。\n\n它的样子像这样：\n\n![对顶部框架应用了内边距并移除了其余三个框架边框的框架](img/Image00062.jpg)\n\
  \n### 使用链接指向目标框架\n\n我们使用框架的常用方法之一是向一个始终可见的框架添加固定导航（sticky navigation），无论其他框架中的内容处于什么位置都保持可见。当这些内容被正确实现时，导航链接将导致单个框架中加载新资源，而其余框架保持静态。\n\
  \n我们还可以格式化锚点，使其指向特定的框架，这是通过为带有 `name` 属性的目标框架元素赋值名称，然后在 `<a>` 元素中使用该属性目标来实现的——这将导致\
  \ `<href>` 加载到目标框架中。\n\n这听起来清楚吗？让我们一步步来看。\n\n首先，必须在我们希望打开链接的框架上分配一个 `name`。我们将使用在上一个示例中创建的布局——我们将左列用于导航，中间列作为目标框架。要做到这一点，需要为目标分配一个名称：\n\
  \n```html\n<frameset rows=\"150px,*\">\n    <frame noresize src=\"frame_1.html\"\
  \ marginheight=\"15\">\n    <frameset cols=\"20%,*,20%\">\n        <frame src=\"\
  frame_2.html\" frameborder=\"0\">\n        <frame src=\"frame_3.html\" name=\"mid_col\"\
  \ frameborder=\"0\">\n        <frame src=\"frame_4.html\" frameborder=\"0\">\n \
  \   </frameset>\n</frameset>\n```\n\n中间列被赋予了名称 `name=\"mid_col\"`，现在可以在左侧列（`frame_2.html`）的源文档中创建一些链接，并指向中间列：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <h1>Frame 2</h1>\n    <p>Contents\
  \ of Frame 2</p>\n    <ul>\n    <li><a href=\"frame_1.html\" target=\"mid_col\"\
  >Load frame_1.html</a></li>\n    <li><a href=\"frame_2.html\" target=\"mid_col\"\
  >Load frame_2.html</a></li>\n    <li><a href=\"frame_3.html\" target=\"mid_col\"\
  >Load frame_3.html</a></li>\n    <li><a href=\"frame_4.html\" target=\"mid_col\"\
  >Load frame_4.html</a></li>\n    </ul>\n</body>\n</html>\n```\n\n当网页加载时，左侧侧边栏有四个链接。当点击链接时，相关文件内容将显示在带有\
  \ `name=\"mid_col\"` 属性的中间列框架中。\n\n当页面加载时，我们首先看到的是这个：\n\n![页面左侧以列形式显示链接的框架集(frameset)](img/Image00063.jpg)\n\
  \n如果点击 `Load Frame_1.html`，我们将看到文件内容加载到中间列，如下所示：\n\n![左侧有导航列且中间框架打开链接的框架集](img/Image00064.jpg)\n\
  \n如果点击 `Load frame_2.html`，导航内容将在中间列和左侧侧边栏中：\n\n![左侧有导航列且中间框架打开链接的框架集](img/Image00065.jpg)\n\
  \n当点击 `Load frame_3.html` 和 `Load frame_4.html` 时，它们将按照你预期的方式工作——在中间列加载内容。\n\n如果我们在链接中省略了\
  \ `target=\"mid_col\"`，那么当点击该链接时，资源将在包含链接的框架中加载。如果我们需要重新加载整个页面（例如当链接到外部网站时），则需要在锚点元素中添加\
  \ `target=\"_blank\"` 或 `target=\"_top\"`。\n\n### HTML iframes\n\nIframes 用于显示嵌套的网页，即其他网页内部的网页。`<iframe>`\
  \ 标签用于定义内联框架（inline frames）。iframe 将一个文档嵌入另一个 HTML 文档的矩形区域内。然而，需要 JavaScript 使 iframe\
  \ 的内容与网页之间相互交互。\n\n### Iframe 语法\n\n用于定义内联框架的语法是：\n\n```html\n<iframe src=\"URL\"\
  ></iframe>\n```\n\n`src` 属性用于框架地址。\n\n### 设置高度和宽度\n\n`width` 和 `height` 通过 `<iframe>`\
  \ 属性设置。值的单位是像素，但你也可以将其设置为百分比。这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\np{ font-size: 50px; }\n</style>\n</head>\n<body style=\"background\">\n\
  <p>This is a paragraph.</p>\n<iframe src=\"https://www.w3schools.com\" width=\"\
  300\" height=\"200\"></iframe>\n</body>\n</html>\n```\n\n\n\n\n\n### Iframe 属性表（推断上下文）\n\
  \n| 属性 | 值 | 描述 |\n| :--- | :--- | :--- |\n| `frameborder` | 1 或 0 | 定义是否添加边框 -\
  \ HTML5 不支持此属性 |\n| `Width` | 像素 | 定义嵌入 iframe 的宽度 – 默认值为 300 px |\n| `src` | URL\
  \ | 此属性提供要加载到 iframe 中的内容的路径或文件名 |\n| `sandbox` | allow-formsallow-popupsallow-scriptsallow-same-origin\
  \ | 用于对帧内容应用额外的限制。这允许提交表单。如果不使用此关键词，表单将无法提交。如果应用此项，将启用弹出窗口；如果不应用，则不启用。这允许脚本运行。这允许嵌入资源被视为从同一源下载的。\
  \ |\n| `srcdoc` | | 在浏览器支持的情况下，此属性允许在内联帧中显示 HTML 内容，并覆盖 `src` |\n| `scrolling` |\
  \ autoyesno | 此属性告诉浏览器是否为 iframe 提供或不提供滚动条 – HTML5 不支持此属性。仅当 iframe 的内容大于 iframe\
  \ 的尺寸时才显示滚动条。iframe 滚动条将始终显示。iframe 滚动条将永远不显示 |\n\n# 第 9 章\n\n## HTML 注释与文件路径\n\n\
  ![](img/Image00001.jpg)\n\n### HTML 注释\n\n在计算机编程中，注释是向编码者和其他阅读代码的人解释代码作用的文本或代码。用户看不到它们，只要添加得当，编译器就会忽略它们。\n\
  \n可以使用 `<!-- … -->` 标签在 HTML 中添加注释 – 标签中编写任何内容都会被视为注释：\n\n语法格式：\n\n```\n<!-- 在此处编写你的注释文本\
  \ -->\n```\n\n例如：\n\n```html\n<!-- <p>这里有一些文本</p> \n<p>这里有更多文本</p> -->\n```\n\n\
  这是一个完整的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<!-- 这是页眉部分 -->\n<head>\n    <!--\
  \ 内部 CSS -->\n    <style>\n        body{\n            text-align: center;\n    \
  \        background-color: #f0f8ff;\n            font-size: 30px;\n            color:\
  \ red;\n        }\n    </style>\n</head>\n<!-- 这是正文部分，你希望在网页上显示的代码应该写在这里 -->\n<body>\n\
  \    <!-- 标题标签 -->\n<h2>第一个网页</h2>\n    <!-- 段落标签 -->\n    <p>在此处输入你的内容!!!</p>\n\
  </body>\n</html>\n```\n\n输出结果为：\n\n第一个网页\n\n在此处输入你的内容!!!\n\n### 多行注释\n\nHTML 代码还允许多行注释，你可以在其中添加代码描述、调试指令等。其语法格式如下：\n\
  \n```html\n<!---\n你的代码被注释了。\n为代码编写一段描述。\n它将不会在网页上显示。\n-->\n```\n\n这是一个示例：\n\n```html\n\
  <h2>蛋糕画廊</h2>\n<!-- 这是一个美味蛋糕的图片\n你可以在最喜欢的浏览器在网页上看到这张图片 -->\n<img src=\"https://static.xxxxx.com/htmlpages/images/cake.png\"\
  \ alt=\"蛋糕图片\" height=\"300px\"\nwidth=\"300px\">\n```\n\n（请注意，xxxxx.com 代替了真实的网站或图像源）\n\
  \n输出结果为：\n\n![包含蛋糕、巧克力、室内、植物的图片自动生成](img/Image00066.jpg)\n\n### HTML 文件路径\n\nHTML\
  \ 文件路径描述了文件在网站文件夹中的位置。它们非常像你在网络浏览器中输入的以查找特定网站的地址。任何外部资源都可以使用文件路径如图片、JS 文件、CSS 文件、视频等链接到\
  \ HTML 文件中。\n\n当 `<href>` 和 `<src>` 属性需要将 HTML 文件链接到外部源时，需要一个属性值。\n\n以下是指定文件路径的不同方式：\n\
  \n* `<img src=\"picture.jpg\">` - 用于指定 `picture.jpg` 在当前页面所在的文件夹中。\n* `<img src=\"\
  images/picture.jpg\">` - 用于指定 `picture.jpg` 在当前文件夹中另一个名为“images”的文件夹中。\n* `<img\
  \ src=\"/images/picture.jpg\">` - 用于指定 `picture.jpg` 在当前网站的根目录下的“images”文件夹中。\n\
  * `<img src=\"../picture.jpg\">` - 用于指定 `picture.jpg` 在当前文件夹的上一级文件夹中。\n\n我们在网页上使用文件路径来链接以下类型的外部文件：\n\
  \n* 图片\n* JavaScript\n* 样式表\n* 网页\n\n文件路径有两种类型——绝对路径和相对路径。\n\n### 绝对文件路径\n\n这些用于指定完整的\
  \ URL 地址，例如：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>使用完整的 URL 文件路径</h2>\n\
  <img src=\"https://www.xxxxx.com/images/nature-1.jpg\" alt=\"image\" style=\"width:300px\"\
  >\n</body>\n</html>\n```\n\n输出结果将是：\n\n### 使用绝对文件路径\n\n![包含树、草、户外、植物的图片自动生成](img/Image00067.jpg)\n\
  \n### 相对文件路径\n\n相对路径指定与页面位置相关的文件。在这个示例中，我们将查看如何使用文件路径指向位于“images”中的文件。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<h2>使用绝对文件路径</h2>\n<img src=\"https://www.xxxxx.com/images/nature-1.jpg\"\
  \ alt=\"image\" style=\"width:300px\">\n</body>\n</html>\n```\n（注：原文中包含一些重复和重叠的部分，我已根据提供的内容清理了结构。）\n\
  \n### 相对文件路径\n\n相对路径指定与页面位置相关的文件。在这个示例中，我们将查看如何使用文件路径指向位于“images”中的文件。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<h2>使用绝对文件路径</h2>\n<img src=\"https://www.xxxxx.com/images/nature-1.jpg\"\
  \ alt=\"image\" style=\"width:300px\">\n</body>\n</html>\n```\n\n\n\n\n\n主体中的内容显示在浏览器窗口中。\n\
  \ntitle 元素的内容显示在浏览器标签页、搜索引擎搜索结果以及收藏夹中。\n\n输出结果为：\n\n主体中的内容显示在浏览器窗口中。\n\ntitle 元素的内容显示在浏览器标签页、搜索引擎结果和收藏夹中。\n\
  \n### HTML `<style>` 元素\n\n用于为你的 HTML 页面设置样式。虽然 CSS 不在本书的涵盖范围内，但值得注意的是，`<style>`\
  \ 元素可以包含该特定 HTML 页面的 CSS 属性。这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>This is the Page Title</title>\n<style>\nbody {background-color: pink;}\n\
  h1 {color: red;}\np {color: blue;}\n</style>\n</head>\n<body>\n<h1>This is a Heading</h1>\n\
  <p>This is a paragraph.</p>\n</body>\n</html>\n```\n\n输出结果为：\n\nThis is a Heading\n\
  \nThis is a paragraph.\n\n### HTML `<link>` 元素\n\n当你想要将外部样式表链接到你的网页时，可以使用 `<link>`\
  \ 元素。它有两个属性 —— “rel”和“href”。“rel”用于说明它是一个样式表，而“href”提供了指向文件的路径。这是一个示例：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>This is the title</title>\n<link rel=\"\
  stylesheet\" href=\"style.css\">\n</head>\n<body>\n<h2>Web page with external CSS</h2>\n\
  <p>This looks cool</p>\n</body>\n</html>\n```\n\n输出结果为：\n\nWeb page with external\
  \ CSS\n\nThis is looks cool\n\n### HTML `<meta>` 元素\n\n当我们想要指定字符集，以及页面描述、作者、关键词和其他其他页面元数据（metadata）时，我们使用\
  \ `<meta>` 元素。通常，搜索引擎、浏览器和其他网络服务使用元数据作为为你的网页提供更佳排名的方式。\n\n让我们来看看元数据是如何使用的。\n\n###\
  \ 定义字符集\n\n```html\n<meta charset=\"UTF-8\">\n```\n\n`charset` 属性用于指定字符的编码。在这个示例中，我们使用的是\
  \ “UTF-8”，这意味着任何语言都可以显示。这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
  \ charset=\"UTF-8\">\n</head>\n<body>\n<p>This is written in English <span style=\"\
  color: blue\"> My friend's name is.......</span></p>\n<p>This is Chinese language\
  \ <span style=\"color: red\">Wǒ de péngyǒu jiào</span></p>\n</body>\n</html>\n```\n\
  \n输出结果为：\n\nThis is written in English. My friend's name is.......\n\nThis is Chinese\
  \ language W? de péngy?u jiào\n\n#### 定义你的网页描述\n\n```html\n<meta name=\"description\"\
  \ content=\"Free Web tutorials\">\n```\n\n元描述对于搜索引擎了解需要寻找什么非常有用。\n\n#### 定义搜索引擎关键词\n\
  \n```html\n<meta name=\"keywords\" content=\"HTML, CSS, XML, JavaScript\">\n```\n\
  \n当你需要为搜索引擎提供关键词时，也会使用关键词值，但很大程度上归因于垃圾邮件者，浏览器可能会忽略它。\n\n#### 定义网页作者\n\n```html\n\
  <meta name=\"author\" content=\"Akon\">\n```\n\n此值用于指定谁编写了网页上的内容，某些内容管理系统使用它自动提取作者详情。\n\
  \n#### 每 30 秒刷新一次文档\n\n```html\n<meta http-equiv=\"refresh\" content=\"30\">\n```\n\
  \nMeta refresh 告诉浏览器在指定时间后自动刷新页面。我们将其设置为在 30 秒后刷新，但你可以根据需要设置任何时间段。\n\n```html\n\
  <meta http-equiv=\"refresh\" content=\"10; url=https://www.Wikipedia.com/\">\n```\n\
  \n如果添加了带有内容值的 URL，则在设定时间结束后将重定向到该页面。这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<meta http-equiv=\"refresh\" content=\"5; url=https://www.Wikipedia.com/\"\
  >\n</head>\n<body>\n<h2>Meta element Example</h2>\n<p style=\"color: green;\">Please\
  \ wait for 5 seconds and it will automatically redirect to the URL specified in\
  \ meta tag</p>\n</body>\n</html>\n```\n\n输出结果为：\n\nMeta element Example\n\nPlease\
  \ wait for 5 seconds and it will automatically redirect to the URL specified in\
  \ meta tag\n\n这是一个展示了 head 中使用的所有 meta 元素的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<meta charset=\"UTF-8\">\n<meta name=\"description\" content=\"Free Web\
  \ tutorials\">\n<meta name=\"keywords\" content=\"HTML, CSS, XML, JavaScript\">\n\
  <meta name=\"author\" content=\"Akon\">\n</head>\n<body>\n<p>This is written in\
  \ English <span style=\"color: blue\"> My friend's name is.......</span></p>\n</body>\n\
  </html>\n```\n\n\n\n\n\nfeugiat nulla facilisis at vero eros et accumsan et iusto\
