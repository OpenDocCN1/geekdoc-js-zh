  \ | Green | Namibia |\n| Magot Rosy | Brown | Spain |\n| Nany | Pink | Egypt |\n\
  | Paris Hilton | Tanned Pink | France |\n\n### 宽度属性\n\nCSS 表格的 `width` 属性可以帮助你设置表格列和行的宽度。这可以减少列列错乱的可能性。它会使单元格变宽，使得文本看起来更加宽敞。在添加\
