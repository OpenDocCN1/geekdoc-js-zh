  \ – 用于于东亚排版 |\n| `<s>` | 用于定义错误的文本 |\n| `<samp>` | 用于定义计算机程序的示例输出 |\n| `<small>`\
  \ | 用于定义较小的文本 |\n| `<strike>` | 用于定义删除线文本 – 这在 HTML5 中不支持 – 使用 `<s>` 或 `<del>` 代替\
  \ |\n| `<strong>` | 用于定义重要文本 |\n| `<sub>` | 用于定义下标 |\n| `<sup>` | 用于定义上标 |\n| `<template>`\
