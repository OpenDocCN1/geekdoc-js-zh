  <body>\n<p>This is a Grid of Boxes</p>\n<p>You are looking at Float boxes put side\
  \ by side:</p>\n<div class=\"clearfixingfeature\">\n  <div class=\"boxing\" style=\"\
  background-color:skyblue\">\n  <p>The first suspended box.</p>\n  </div>\n  <div\
  \ class=\"boxing\" style=\"background-color:red\">\n  <p>The second suspended box.</p>\n\
  \  </div>\n  <div class=\"boxing\" style=\"background-color:yellow\">\n  <p>The\
  \ third suspended box.</p>\n  </div>\n</div>\n<p>The clearfix hack ameliorates the\
  \ layout flow. The box-sizing property ensures that your boxes do not break after\
  \ you add extra padding. </p>\n</body>\n</html>\n```\n\n如果你将其加载到网页中，盒子将呈现悬浮状态，但它们的尺寸将不是完美的。\n\
