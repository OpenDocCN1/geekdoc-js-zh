  </head>\n<body>\n<div class=\"headers\">\n  <p>Designing a layout</p>\n</div>\n\
  <div class=\"clearfixing\">\n  <div class=\"columns menus\">\n    <ul>\n      <li><a\
  \ href=\"#home\">Home Page</a></li>\n      <li><a href=\"#news\">News Corner</a></li>\n\
  \      <li><a href=\"#contact\">Contact & Email</a></li>\n      <li><a href=\"#about\"\
