  \n# 第一章\n\n## JavaScript 简介\n\n![](img/Image00001.jpg)\n\n`JavaScript` 是一种解释型语言。该语言的定义比“解释型”一词更广泛。你可以将其定义为一种弱类型、基于原型、动态且命令式的过程化语言。`JavaScript`\
  \ 以客户端编程语言的形式开发和实现。它是网络浏览器的一部分，被认为可以帮助开发者实现动态功能，并在网页上创建和集成用户界面。你可能可能在服务器端也能发现 `JavaScript`\
  \ 的实现。然而，`JavaScript` 编程语言的流行很大程度上基于它在客户端的应用。你可能在 Web 应用之外也能看到 `JavaScript`的应用。例如，你可能会发现它们被用于为桌面组件和\
  \ PDF 格式文档添加一些交互性。\n\n`JavaScript` 最初的设计与 `C` 语言的设计模式相同，但它采用了一些 `Java` 编程语言的名字。你不应该将\
  \ `Java` 与 `JavaScript` 混淆，因为它们在本质上是不同的。它们也有不同的目的和语义。\n\n### JavaScript 的开发者\n\n\
  Brendan Each 最初开发 `JavaScript` 时使用的名为 `Mocha`。后来这个名字被改为 `LiveScript`。随后，它再次被改为 `JavaScript`。这个名字困扰了一些人，并给人一种印象，即新语言（即\
  \ `JavaScript`）是 `Java` 的分支。人们认为这种新的编程语言是 Netscape 营销策略的一部分，旨在新编程语言领域获得急需的声望。\n\n\
  第二年，微软引入了一种类似的客户端语言并集成到他们著名的 `Internet Explorer 3.0` 浏览器中。为了规避品牌问题，他们将该语言命名为 `JScript`。这个术语听起来和视觉上被认为与\
  \ `JavaScript` 非常相似；然而，它的不同之处在于，它无法 100% 兼容 `ECMA` 规范。\n\n1997 年，出现了一项将 `JavaScript`\
  \ 提交给 `ECMA` 标准的提案，并在 1997 年 6 月，`ECMA` 标准以 `ECMAScript` 的名称采纳了它。该编程语言还赢得了 `ISO`\
  \ 标准推荐。`JavaScript` 因其适应互联网的方式积累了极高的普及率。这就是它成为全球最常用编程语言之一的原因。\n\n### JavaScript\
  \ 的用例\n\n`JavaScript` 运行在世界上大多数网页的客户端。当你打开一个网页，而它与你上次打开时有所不同，那么，这些变化可能是使用 `JavaScript`\
  \ 完成的。让我告诉你一件趣的事。在你的电脑屏幕上打开一个网页。右键点击网页然后点击“查看源代码”。你会在网页的代码中看到 `JavaScript` 这个词。不要将\
  \ `HTML` 与 `JavaScript` 混淆，因为你可能会在网页代码中发现这二者。\n\n`HTML` 是一种标记语言，允许开发者格式化内容并创建动态网页。你可以将文本变为粗体，创建你喜的框和表格，并在页面上添加按钮和项目符号。然而，`JavaScript`\
  \ 允许你修改文本、添加弹出消息，并通过 `HTML` 代码验证你输入的文本。`HTML` 和 `JavaScript` 并肩行走。`JavaScript` 领先于\
  \ `HTML` 的地方在于它让页面变得动态且可交互的方式。它将允许你的用户点击某些元素并从现有页面打开新页面。\n\n你应该学习 `JavaScript`，因为它非常容易实现。你只需要将代码放在\
  \ `HTML` 文档中，然后指示浏览器运行它。`JavaScript` 可以在许多计算机和操作系统上，即使在系统离线时也是如此。在 `JavaScript`\
  \ 的帮助下，你可以创建响应式界面，完善用户体验并提供极动态的功能。\n\n`JavaScript` 允许用户在需要时随时以文档的形式加载内容，而且无需重新加载网页。我们把这个过程称为\
  \ `Ajax`。`JavaScript` 允许你在浏览器中对现有可能性运行测试，然后做出相应反应。这一过程被称为防御性脚本（defensive Scripting）。`JavaScript`\
  \ 将修复你网页上出现的任何问题。它将弥补浏览器支持中存在的漏洞。\n\n当我们把 `JavaScript` 为我们做的一切与其他 Web 编程语言进行比较时，我们意识到它可以做很多。`JavaScript`\
  \ 受到了巨大的需求和喜爱，因为它允许你在没有任何费恼的情况下构建复杂的应用程序。你也可以用 `Flash` 构建复杂的应用程序，但 `JavaScript`\
  \ 是最佳选择，因为它是一种 Web 标准。\n\n当谈到 `JavaScript` 的用法时，它的用法在不断变化。起初，`JavaScript` 与网站的交互限于形成交互和给用户反馈。然而，它随着时间的推移而演变，现在的用途比开始多得多。\n\
  \n\n\n\n代码是指用于构成程序的文本。在书的许多章节中，你会发现大量的代码。我必须说，阅读和编写代码是学习和编写程序过程中不可或缺的一部分。\n\n元编程被认为是一种强大的技术，它能够让你编写一组程序。`ES6`\
  \ 的出现进一步放宽了 JavaScript 编程世界中元编程的使用。你可以使用 `proxies` 和其他类似的特性。`ES6` 的 `proxies` 倾向于重新定义对象中不同的操作。\n\
  \n# `<script>` 标签\n\n让我们来谈谈书中用最多的符号——标签。所有的 JavaScript 代码都包含在 `<script>` 标签内。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript rests in the Body</p>\n\
  <p id=\"demo12\"></p>\n<script>\ndocument.getElementById(\"demo12\").innerHTML =\
  \ \"This is your First JavaScript\";\n</script>\n</body>\n</html>\n```\n\n### JavaScript\
  \ 位于 Body（正文）中\n这是你的第一个 JavaScript\n\n旧版本的 JavaScript 编写方式不同。它采用如下格式，例如 `<script\
  \ type=\"text/javascript\">`。\n\nJavaScript 中有可以可以让你来执行代码块的函数。当某种事件发生时，你可以调用一个函数。事件可以定义为点击按钮。你可以在\
  \ HTML 文档中放置任何类型的脚本。你可以将脚本放置在 `<head>` 中、`<body>` 中或者两者都放置。在 `<head>` 中使用脚本的例如下：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction FunctionUN() {\n\
  \  document.getElementById(\"demo34\").innerHTML = \"I have changed the Paragraph.\"\
  ;\n}\n</script>\n</head>\n<body>\n<p>You have seen the JavaScript in the Head</p>\n\
  <p id=\"demo\">This is a Paragraph.</p>\n<button type=\"button\" onclick=\"FunctionUN()\"\
  >Click Me</button>\n</body>\n</html>\n```\n\n### 你在 Head（头部）中看到了 JavaScript\n这是一个段落。\n\
  点击我\n\n当你点击网页浏览器上的按钮时，你将触发函数的调用。你也可以将脚本放在 HTML 页面的 `<body>` 中。当你点击按钮时，将调用此函数。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is A Web Page</p>\n<p id=\"demo1\"\
  >This is a Paragraph</p>\n<button type=\"button\" onclick=\"FunctionZ()\">Click\
  \ Me</button>\n<script>\nfunction FunctionZ() {\n  document.getElementById(\"demo1\"\
  ).innerHTML = \"I have changed the Paragraph.\";\n}\n</script>\n</body>\n</html>\n\
  ```\n\n### 这是一个网页\n我已经更改了段落。\n点击我\n\n# 显示\n\n有不同的方法可以在网页浏览器中显示 JavaScript。程序员为了显示目的使用了不同的技术。我在书中使用的第一种方法是\
  \ `document.getElementById(id)` 方法。在短语中，`id` 指定义 HTML 文档的元素。`innerHTML` 单词定义了 HTML\
  \ 的内容。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First\
  \ Web Page</p>\n<p>This will be the First Paragraph.</p>\n<p id=\"demo1234\"></p>\n\
  <script>\ndocument.getElementById(\"demo1234\").innerHTML = 4567 + 36;\n</script>\n\
  </body>\n</html>\n```\n\n这将是我的第一个网页\n这将是第一个段落。\n4603\n\n你可以使用的第二方法是 `document.write()`\
  \ 方法。这也是一个简单的方法。但是，除了向你展示它是如何工作的这个示例外，我在书中没有使用这种方法创建任何脚本：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>This is going to be my First Web Page</p>\n<p>This will\
  \ be the First Paragraph.</p>\n<p id=\"demo1234\"></p>\n<script>\ndocument.write\
  \ (4567 + 36);\n</script>\n</body>\n</html>\n```\n\n这将是我的第一个网页\n这将是第一个段落。\n4603\n\
  \n如果你在加载 HTML 页面后使用这种方法，你将丢失所有数据，因为它们会被删除。因此，如果你犯了这个错误，应该注意后果。此外，你用这种方法创建一个按钮并测试\
  \ HTML 页面。查看下面的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going\
  \ to be my First Web Page</p>\n<p>This will be the First Paragraph.</p>\n<button\
  \ type=\"button\" onclick=\"document.write(335 + 6)\">Click me</button>\n</body>\n\
  </html>\n```\n\n这将是我的第一个网页\n这将是第一个段落。\n点击我\n\n另一种方法是 `window.alert` 方法。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First Web Page</p>\n\
  <p>This will be the First Paragraph.</p>\n<p id=\"demo1234\"></p>\n<script>\nwindow.alert\
  \ (4567 + 36);\n</script>\n</body>\n</html>\n```\n\n这将是我的第一个网页\n这将是第一个段落。\n\n上述文本将在浏览器上显示。每当你运行代码时，你会在屏幕顶部的警告窗口上看到数学计算的结果。`window`\
  \ 关键字的使用是可选的。由于 JavaScript 中的 `window` 对象是全局的，你可以省略它的使用并仍然得到相同的结果。以下代码将交付相同的结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First Web\
  \ Page</p>\n<p>This will be the First Paragraph.</p>\n<p id=\"demo1234\"></p>\n\
  <script>\nalert (4567 + 36);\n</script>\n</body>\n</html>\n```\n\n另一种方法是 `console.log()`\
  \ 方法。此方法用于调试代码并显示数据。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going\
  \ to be my First Web Page</p>\n<p>This will be the First Paragraph.</p>\n<p id=\"\
  demo1234\"></p>\n<script>\nconsole.log (4567 + 36);\n</script>\n</body>\n</html>\n\
  ```\n\n# 数值\n\n数字的值是数值。在 JavaScript 代码中，你将这样写：\n\n13\n\n\n\n\n\n你将在程序中使用它，它将为计算机内存中的数字带来位模式。JavaScript\
  \ 使用固定的位数，即 64 位，来存储单个数字的值。使用 64 位，你可以创建无限的模式。这意味着系统可能表示的不同数字数量是受到限制的。通过 `N` 位十进制数字，你有机会表示\
  \ `10N` 个数字。\n\n计算机的内存曾经要小得多，人们必须使用特定的 8 位和 16 位组来表示数字。某些小数字很容易溢出，导致变成一个无法容纳在某些位数中的数字。时代变了。即使是装在口袋里的电脑，也有巨大的空间来保存你需要的任何内容。\n\
  \n这些位存储了负数，其中一位表示单个数字的符号。你可能会遇到的另一个更大的问题是，非整数也应该被表示。为了实现这一点，你需要使用一些位来存储小数点的位置。\n\
  \n### 算术\n\n核心点是数字被用于算术。它们在编程中被用于执行加法和乘法等算术运算。乘法和加法的简单操作至少需要两个数字来产生第三个数字。`+` 是加法的符号，而\
  \ `*` 是乘法的符号。这两个符号都被称为运算符。当你编程时，在两个数字之间放置一个运算符，你就开始了一次算术运算。你可以使用括号来调整运算符执行的顺序。例如，在正常情况下，乘法优先。但如果你把加法放在括号里，你就改变了顺序。现在编辑器将先运行加法。\n\
  \n```\n(500 + 100) * 500\n```\n\n当运算符在没有括号的情况下出现时，它们的应用顺序根据优先级决定。\n\n## 字符串\n\n\
  在深入 JavaScript 编程的海洋之前，你必须背记的另一个概念是字符串的概念。JavaScript 字符串表示文本。你可以通过将任何想要转换为字符串的文本包含在引号内来编写它们。参见以下示例。\n\
  \n`‘I am looking at the sinking sun.’`\n\n`“I am going to take a flight to Mars.”`\n\
  \n`The weather is balmy, as April has started.`\n\n正如我在上述的示例中展示的那样，你可以使用单引号、双引号和反引号（backticks）。将每个引号放在字符串的开头或结尾，以便代码编辑器将文本识别为字符串。你\
  \ literal 可以在引号内放置任何内容，JavaScript 将其转换为字符串。然而，语言中的少数字符很难转换。你可能想过如何在引号内部放置引号。在字符串内部要几乎不可能包含的第一件事就是包含换行符。当你按下键盘上的回车键时，会出现换行。当你使用反引号时，不需要转义就可以这样做。\n\
  \n如果你想在字符串中包含特殊字符，可以使用反斜杠（`\\`）。反斜杠表示其前面的字符被赋予了特殊含义。这个过程被称为字符转义。如果反斜杠在引号前面，它不会结束字符串，而是会被包含在字符串中。如果你在反斜杠后插入一个\
  \ `‘n’` 字符，它将被解释为换行的形式。如果你在反斜杠后放一个 `‘t’`，它表示一个制表符。参见以下字符串的示例。\n\n```\n“I will reach\
  \ the moon\\n And I will travel onwards to Mars.”\n```\n\n你在网页上看到的将如下：\n\nI will\
  \ reach the moon\nAnd I will travel onwards to Mars.\n\n你可能会遇到一种情况，即字符串内部需要一个反斜杠，仅仅为了作为一个反斜杠，而不是任何特殊代码。如果两个反斜杠接连出现，它们肯定会合并。在生成的字符串值中只会下一个反斜杠。\n\
  \n你必须以一系列位的形式对字符串进行建模，以便它们存在于计算机上。JavaScript 执行它的方式取决于 Unicode 标准。这些标准倾向于为你需要的每个字符分配特定的数字，包括来自阿拉伯语、希腊语、亚美尼亚语和日语的字符。如果你为每个字符都有数字，你的字符串将由特定的数字序列描述。这就是\
  \ JavaScript 执行代码的方式。尽管如此，你可能会面临某些复杂性。JavaScript 的表示每个每个元素使用 16 位。Unicode 定义的字符比这多得多。像\
  \ emoji 这样的字符占用两个字符位置。\n\nJavaScript 字符串的一个独特之处是，你不能对它们进行除、减、乘运算。然而，有一个运算符可以使用于字符串。你可以对\
  \ JavaScript 字符串使用 `+` 运算符来拼接它们，或者简单地说，将它们合并为一个整体。参见以下示例：\n\n```\n“I” + “am” + “going”\
  \ + “to” + “Mars” + “.”\n```\n\n字符串值有几个关联函数，你可以使用它们来执行不同的操作。你用单引号或双引号编写的字符串行为相同。两种字符串的唯一区别在于字符串中转义字符的使用。当你在\
  \ `${}` 中写入内容时，结果将按计算结果得出，然后转换为字符串，然后包含在相同的位置。\n\n## JavaScript 数组\n\n可以通过方括号识别\
  \ JavaScript 数组。数组的项填充在方括号内部，并用逗号分隔。看看我们如何声明数组。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>Learn JavaScript Arrays</p>\n<p>JavaScript 数组的索引从 0 开始。这意味着数组的第一个元素是\
  \ [0]</p>\n<p id=\"array-demo\"></p>\n<script>\nvar carsArray = [\"Volkswagen\"\
  ,\"Honda\", \"Suzuki\"];\ndocument.getElementById(\"array-demo\").innerHTML = carsArray[0];\n\
  </script>\n</body>\n</html>\n```\n\nJavaScript 数组的索引从 0 开始。这意味着数组的第一个元素是 `[0]`。\n\
  \n\n\n\n\n由于这是第一个示例，你需要仔细理解它。首先，这行代码区分了后端代码和 JavaScript 前端。你可以说，它区分了你在编辑器中编写的内容和你在网页上看到的内容。`h1`\
  \ 和 `p` 标题在书中显示可能与在网页上显示的有所不同。这是因为我正在使用的文字处理器对 `h1` 和 `p` 有设置。如果你将代码复制粘贴到编辑器并在网页上运行，它们将正常工作。此外，我在本书的其余部分将这样编写嵌入\
  \ HTML 结构中的代码，因为你在创建网站时也是这样写的。你需要通过 HTML 嵌入在 JavaScript 中编写脚本，以便网络浏览器读取它们。在上面提到的示例中，你可以看到每个变量都有对应的存储。\n\
  \n现在，我不再创建一个单个字母变量，而是将创建具有完整单词名称的变量。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>你正在学习 JavaScript 变量</p>\n<p>在接下来的示例中，变量将使用完整的单词命名</p>\n<p id=\"variable-demo\"\
  ></p>\n<script>\nvar milkprice = 150;\nvar oilprice = 160;\nvar totalprice = milkprice\
  \ + oilprice;\ndocument.getElementById(\"variable-demo\").innerHTML =\n\"The value\
  \ of totalprice is: \" + totalprice;\n</script>\n</body>\n</html>\n```\n\n你正在学习\
  \ JavaScript 变量\n\n在接下来的示例中，变量将使用完整的单词命名。\n\ntotalprice 的值是: 310\n\n## JavaScript\
  \ 标识符\n\nJavaScript 变量需要赋予唯一的名称以便于识别。这些唯一名称被称为标识符。标识符可以是像 `a`、`b`、`c` 这样的短名称，也可以是像\
  \ `totalprice`、`milkprice` 和 `oilprice` 这样的描述性名称。JavaScript 变量有一些命名规则。你可以利用这些规则来减少错误概率。\n\
  \n- 变量不能包含数字、字母、美元符号和下划线。\n- 变量可以以 `$` 开头。\n- 变量对大小写敏感，这意味着 `a` 和 `A` 是不同的变量。\n\
  - 变量必须以字母开头。\n- 你不能使用 JavaScript 关键字作为变量。\n\n如果你在 JavaScript 中看到像 `=` 这样的等号，不要将其误认为是代数中使用的等号。它有不同的用途。\n\
  \n变量存储的信息稍后可以在你的程序中使用。脚本很长，因此变量可以轻松定位有用值。变量便于在同一段代码中重复使用某个值。与其记住这个值，不如创建一个变量并为其赋值。\n\
  \n## 数据类型\n\nJavaScript 变量可以持有不同类型的信息，如数字和文本。编程中的文本值被称为字符串。JavaScript 可以持有不同类型的数据。正如我已经解释过的，字符串必须写在单引号或双引号中，取决于你的习惯。你编写数字时不需要加引号。如果你给数字加引号，浏览器将将其解释为字符串。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>你正在学习 JavaScript 变量</p>\n<p>我正在定义\
  \ JavaScript 数据类型</p>\n<p id=\"variable-demo\"></p>\n<script>\nvar num = 5555555.889;\n\
  var novelist = \"Charles Dickens\";\nvar introduction = 'Charles Dickens wrote melodramatic\
  \ novels!';\ndocument.getElementById(\"variable-demo\").innerHTML =\nnum + \"<br>\"\
  \ + novelist + \"<br>\" + introduction;\n</script>\n</body>\n</html>\n```\n\n你正在学习\
  \ JavaScript 变量\n\n我正在定义 JavaScript 数据类型。\n\n5555555.889\n\nCharles Dickens\n\n\
  Charles Dickens wrote melodramatic novels!\n\n## 变量声明\n\n声明变量的过程实际上就是创建变量的过程。你可能在上面的示例中注意到我在每个变量之前都使用了\
  \ `var` 关键字。没有 `var` 关键字，你就无法创建变量。一旦声明了变量，该变量将没有值。你必须像我在示例中所做的那样为它赋值。在这里使用了等号 `=`。你将符号放在变量名和值之间。\n\
  \n### 未定义变量\n\n在不同的程序中，你经常可以声明不带值的变量。该值可以是你可以计算出来的，也可以是你稍后提供的，例如用户输入。你声明的未带值的变量将携带一个\
  \ `undefined` 值。我将使用我已经创建的示例之一，并去掉变量的值。让我们使用最新的示例，以便你更好地理解。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>你正在学习 JavaScript 变量</p>\n<p>我正在定义 JavaScript 的未定义变量</p>\n\
  <p id=\"variable-demo\"></p>\n<script>\nvar num;\nvar novelist;\nvar introduction;\n\
  document.getElementById(\"variable-demo\").innerHTML =\n</script>\n</body>\n</html>\n\
  ```\n\n你正在学习 JavaScript 变量\n\n我正在定义 JavaScript 的未定义变量。\n\n### 重复\n\n你可能定义并声明了一个变量，但后来改变了主意，并通过我刚刚解释的过程使其变为未定义。那么，这会让它变成未定义吗？答案是“不是”。在声明后将其未定义不会让变量失去它的值。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>你正在学习 JavaScript 变量</p>\n<p>这是 JavaScript\
  \ 的未定义变量</p>\n<p id=\"variable-demo\"></p>\n<script>\nvar milkprice = 150;\nvar\
  \ oilprice = 160;\nvar totalprice = milkprice + oilprice;\nvar novelist = \"Charles\
  \ Dickens\";\nvar introduction = 'Charles Dickens wrote melodramatic novels!';\n\
  var num;\nvar novelist;\nvar introduction;\ndocument.getElementById(\"variable-demo\"\
  ).innerHTML =\nnum + \"<br>\" + novelist + \"<br>\" + introduction;\n</script>\n\
  </body>\n</html>\n```\n\n你正在学习 JavaScript 变量\n\n这是 JavaScript 的未定义变量。\n\n310\n\n\
  Charles Dickens\n\n310\n\n### 算术\n\nJavaScript 与其他编程语言一样，允许你进行数学计算。你可以相加数字产生结果，然后将结果传递给变量进行存储。在代码中，你可以使用运算符\
  \ `=` 和 `+`。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript 算术</p>\n\
  <p>这是 JavaScript 的未声明算术</p>\n<p id=\"variable-demo\"></p>\n<script>\nvar a = 15\
  \ + 3452 + 13 + 8 + 1;\ndocument.getElementById(\"variable-demo\").innerHTML = a\n\
  </script>\n</body>\n</html>\n```\n\nJavaScript 算术\n\n3489\n\n### 减法\n\n下一个讨论的算术运算符是减法。运算符的符号与代数中使用的相同。你可以用选择的数字填充程序，并在中间放入\
  \ `–` 符号开始减法过程。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript 算术</p>\n\
  <p>JavaScript 减法</p>\n<p id=\"variable-demo\"></p>\n<script>\nvar a = 55;\nvar b\
  \ = 40;\nvar c = a - b;\ndocument.getElementById(\"variable-demo\").innerHTML =\
  \ c\n</script>\n</body>\n</html>\n```\n\nJavaScript 算术\n\nJavaScript 减法。\n\n15\n\
  \n## 字符串拼接\n\n就像你学习加数字一样，JavaScript 允许你拼接字符串。我将在接下来的示例中使用 `+` 运算符来连接字符串。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript 字符串拼接</p>\n<p>JavaScript 数据类型</p>\n\
  <p id=\"variable-demo\"></p>\n<script>\nvar a = \"Charles Dickens\" + \"\" + \"\
  \ wrote\" + \"\" + \" melodramatic novels!\";\ndocument.getElementById(\"variable-demo\"\
  ).innerHTML = a\nnum + \"<br>\" + novelist + \"<br>\" + introduction;\n</script>\n\
  </body>\n</html>\n```\n\nJavaScript 字符串拼接\n\nJavaScript 数据类型。\n\nCharles Dickens\
  \ wrote melodramatic novels!\n\n\n\n\n\n在 JavaScript 中，`let` 关键字用于变量声明。`var` 关键字也可以用于变量声明；然而，两者的主要区别在于它们的作用域。`var`\
  \ 关键字基于函数作用域，而 `let` 关键字基于块级作用域。学习如何使用 `let` 关键字与学习 `var` 关键字与 `let` 关键字之间的区别密切相关。\n\
  \n### 全局作用域\n\n你在 JavaScript 函数之外声明的变量。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>JavaScript Let 关键字</p>\n<p>你可以从任何脚本或任何函数访问全局变量。</p>\n<p id=\"let-demo\"></p>\n\
  <script>\nvar cars = \"BMW\";\nFunction1();\nfunction Function1() {\n  document.getElementById(\"\
  let-demo\").innerHTML = \"我计划买一辆 \" + cars + \" 用于我的日常通勤和越野。\";\n}\n</script>\n\
  </body>\n</html>\n```\n\nJavaScript Let 关键字\n\n你可以从任何脚本或任何函数访问全局变量。\n\n我计划买一辆 BMW\
  \ 用于我的日常通勤和越野。\n\n你可以在 JavaScript 程序的任何位置访问全局变量。\n\n### 函数作用域\n\n你在 JavaScript 函数范围内声明的变量具有函数作用域。在接下来的示例中，我将在函数范围内声明变量。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些是 JavaScript 作用域</p>\n<p>我将在 Function2()\
  \ 之外定义并声明变量。</p>\n<p id=\"let-demo1\"></p>\n<p id=\"let-demo2\"></p>\n<script>\n\
  Function2();\nfunction Function2() {\n  var cars = \"BMW\";\n  document.getElementById(\"\
  let-demo1\").innerHTML = typeof cars + \" \" + cars;\n}\ndocument.getElementById(\"\
  let-demo2\").innerHTML = typeof cars;\n</script>\n</body>\n</html>\n```\n\n这些是 JavaScript\
  \ 作用域\n\n我将在 `Function2()` 之外定义并声明变量。\n\nstring BMW\nundefined\n\n我尝试在函数内部和外部定义变量。因此，当我检查变量类型时，我发现超出函数限制的变量被标记为\
  \ undefined。这就是我们称其为函数作用域变量的原因。所以，如果你编写代码时不小心将变量引引到函数外部，你将看到相同的消息。解决方案是将声明包含在函数括号内，这样代码就能正常工作。\n\
  \n### 块级作用域\n\n使用 `var` 关键字声明的变量不具备块级作用域。只有在花括号内声明的变量才能从块外部访问。块级作用域是在 ES2015 中引入\
  \ JavaScript 的。在此之前，它没有作用域。虽然使用 `var` 关键字的变量没有块级作用域，但使用 `let` 关键字声明的变量可以具有块级作用域。\n\
  \n`var` 关键字在某些会给程序员带来问题。特别是当你尝试通过包含 `var` 关键字来重新声明变量时，你会看到编辑器中弹出大量问题。如果你在块内部重新声明变量，你也会在同一个块之外重新声明它。从长远来看，会导致额外的问题。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这段代码片段将使用 var 关键字声明你的变量</p>\n<p id=\"\
  let-demo\"></p>\n<script>\nvar xyz = 10000;\n// 你可以看到 xyz 的值为 10000\n{ \n  var xyz\
  \ = 1;\n  // 现在重新声明的变量 xyz 的值为 1\n}\n// 查看变量 xyz 的重新声明值是否已应用\ndocument.getElementById(\"\
  let-demo\").innerHTML = xyz;\n</script>\n</body>\n</html>\n```\n\n这段代码片段将使用 var\
  \ 关键字声明你的变量\n\n1\n\n所以，你可以看到我们遇到了一个大问题。使用 `var` 关键字，重新声明可能是一个难以处理的麻烦。这就是 `let` 关键字大显身场。它解决了重新声明的问题。如果你使用\
  \ `let` 关键字声明了变量，当你重新声明同一个变量时，就不会有任何问题。在接下来的代码中，我将解释 `let` 关键字如何解决重新声明的问题。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>我现在将使用 let 关键字重新声明一个变量</p>\n<p id=\"let-demo\"\
  ></p>\n<script>\nvar xyz = 1000;\n// 变量 xyz 的值为 1000\n{ \n  let xyz = 1;\n  // 现在\
  \ xyz 的值被设置为 1\n}\n// let 关键字将让变量 xyz 保留之前声明的值\ndocument.getElementById(\"let-demo\"\
  ).innerHTML = xyz;\n</script>\n</body>\n</html>\n```\n\n我现在将使用 let 关键字重新声明一个变量\n\
  \n1000\n\n由于 `let` 关键字引入得较晚，Internet Explorer 11 及之前的版本不支持它。目前，Chrome 49、Firefox\
  \ 44、Opera 36、Edge 12 和 Safari 11 支持使用 `let` 关键字。\n\n`var` 和 `let` 关键字在用于 JavaScript\
  \ 循环时具有不同的行为。通过以下两个示例理解这两个关键字的区别。\n\n### 示例 1\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>JavaScript 关键字</p>\n<p id=\"let-demo\"></p>\n<script>\nvar xyz = 4;\n\
  for (var xyz = 0; xyz < 9; xyz++) {\n}\ndocument.getElementById(\"let-demo\").innerHTML\
  \ = xyz;\n</script>\n</body>\n</html>\n```\n\nJavaScript 关键字\n\n9\n\n### 示例 2：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript 关键字</p>\n<p id=\"let-demo\"\
  ></p>\n<script>\nlet xyz = 4;\nfor (let xyz = 0; xyz < 9; xyz++) {\n}\ndocument.getElementById(\"\
  let-demo\").innerHTML = xyz;\n</script>\n</body>\n</html>\n```\n\nJavaScript 关键字\n\
  \n4\n\n在第一个示例中，当我使用 `var` 关键字时，循环内部的变量重新声明了外部变量。然而，当我在示例 2 中使用 `let` 时，循环内部的变量没有重新声明外部变量。`let`\
  \ 和 `var` 关键字都旨在声明变量。然而，在创建 JavaScript 程序之前，你应该理解它们之间的关键区别：\n\n*   `var` 关键字主要用于旧版本的\
  \ JavaScript，而 `let` 关键字被认为是声明变量的最新方法。`let` 关键字始于 ES6，也称为 ES2015。\n*   `var` 关键字基本上是函数作用域的，而\
  \ `let` 关键字是块作用域的。\n\n当我们讨论这两个关键字的推荐时，我们可以说在编写程序时 `let` 关键字是最佳选择。然而，某些浏览器不支持 `let`\
  \ 关键字。因此，你可能需要使用 `var` 关键字。\n\n## 第三章\n\n## JavaScript Constants\n\n![](img/Image00001.jpg)\n\
  \nJavaScript 中的 `const` 关键字是在 ES2015 中引入的。使用 `const` 关键字定义的变量与使用 `let` 定义的变量一样。区别在于你不能对其进行重新赋值。一旦初始化了常量，你就无法更改它的值。这就是常量与\
  \ `var` 关键字的区别。如果你必须声明常量，需要先初始化它。\n\n你应该仔细考虑一下在程序中是否需要使用常量。只有在你确定不需要更改变量的值时，才使用它。\n\
  \n常量名可以是合法的标识符。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>你正在学习 JavaScript\
  \ 常量</p>\n<p>记住你不能更改原始类型的值。</p>\n<p id=\"const-demo\"></p>\n<script>\ntry {\n  const\
  \ xyz = 89.141592653589793;\n  xyz = 54.14;\n}\ncatch (err) {\n  document.getElementById(\"\
  const-demo\").innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n\n你正在学习 JavaScript\
  \ 常量\n\n记住你不能更改原始类型的值。\n\nTypeError: Assignment to constant variable.\n\n\n\n\n\
  使用 `const` 关键字声明变量与在使用块级作用（Block Scope）时使用 `let` 关键字声明相似。接下来的示例将解释它是如何倾向于 `let`\
  \ 关键字并区别于 `var` 关键字的。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>在这个示例中，我将使用\
  \ `const` 关键字声明一个变量</p>\n<p id=\"const-demo\"></p>\n<script>\nvar xyz = 15;\n//\
  \ The value of xyz is 15\n{ \n  const xyz = 1;\n  // The value of xyz is 1\n}\n\
  // The value of xyz is 15\ndocument.getElementById(\"const-demo\").innerHTML = xyz;\n\
  </script>\n</body>\n</html>\n```\n\n在这个示例中，我将使用 `const` 关键字声明一个变量。\n\n15\n\n与使用\
  \ `var` 关键字声明的变量不同，常量在声明时必须赋值一个值。你不能让赋值部分为空。“constant”（常量）这个词有点让人困惑，如果说不是完全的误导的话。`const`\
  \ 关键字并不定义常量值。实际上，它定义的是你在等式中所使用的值的常量引用。这就是为什么你不能改变常量的原始值。然而，你可以更改它的属性。\n\n### 原始值\n\
  \n如果你给常量赋了一个原始值，以后你将无法再次更改它的值。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些是\
  \ JavaScript 常量</p>\n<p>让我们尝试是否可以更改原始值。</p>\n<p id=\"const-demo\"></p>\n<script>\n\
  try {\n  const xyz = 5556.175757557757793;\n  xyz = 3555.19090;\n}\ncatch (err)\
  \ {\n  document.getElementById(\"const-demo\").innerHTML = err;\n}\n</script>\n\
  </body>\n</html>\n```\n\n这些是 JavaScript 常量\n\n让我们尝试是否可以更改原始值。\n\n`TypeError: Assignment\
  \ to constant variable.`\n\n虽然你不能更改 JavaScript 常量的原始值，但你可以更改对象的属性。在接下来的示例中，我将使用\
  \ `const` 关键字创建一个对象，然后对该对象的属性引入一些更改，以查看我是否可以更改它们。查看示例以了解如何操作。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>JavaScript 常量</p>\n<p>你可以在声明对象后更改它们的属性：</p>\n<p id=\"\
  const-demo\"></p>\n<script>\n// 我将创建一个对象：\nconst mycar = {name:\"Honda\", model:\"\
  Vezel\", make:\"Japan\", color:\"Grey\"};\n// 让我们更改属性：\nmycar.model = \"Civic\"\
  ;\n// 你也可以添加一个新属性：\nmycar.transmission = \"Automatic\";\n// 现在该显示你的属性了：\ndocument.getElementById(\"\
  const-demo\").innerHTML = \"I have a \" + mycar.name + \".\" + \" It is of \" +\
  \ mycar.color + \" color and its model label is \" + mycar.model + \". \" + \"This\
  \ car has \" + mycar.transmission + \".\";\n</script>\n</body>\n</html>\n```\n\n\
  JavaScript 常量\n\n你可以在声明对象后更改它们的属性：\n\n我有一辆 Honda。它是灰色的，它的型号标签是 Civic。这辆车是自动挡的。\n\
  \n你看到我将型号从 Vezel 改为了 Civic。我还添加了新属性来描述汽车的变速模式。这为程序员提供了便利，因为他们可以创建一个对象，然后根据不断变化的需求合适地添加或更改属性。然而，在程序中，你不能将不同的对象重新赋值给同一个常量。如果你这样做，将会看到一个错误。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 常量</p>\n<p>禁止：你不能将不同的对象重新赋值给同一个常量：</p>\n\
  <p id=\"const-demo\"></p>\n<script>\ntry {\n  const mycar = {name:\"Honda\", model:\"\
  Vezel\", make:\"Japan\", color:\"black\"};\n  mycar = {name:\"BMW\", model:\"Z1\"\
  , make:\"German\", color:\"red\"};\n}\ncatch (err) {\n  document.getElementById(\"\
  demo\").innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 常量\n\
  \n禁止：你不能将不同的对象重新赋值给同一个常量：\n\n### 常量数组\n\n你可以使用 `const` 关键字创建数组，也可以更改它们。\n\n## 第章\n\
  \n## 提示与条件判断\n\n![](img/Image00001.jpg)\n\n提示框（prompt box）用于要求用户提供信息并为答案提供响应字段。代码向用户提出一些问题，然后在相应的字段中提供答案供响应。你可以更改响应内容。无论你是保留默认响应还是将其改为其他内容，你的响应都会被赋值给变量。\n\
  \nprompt 代码类似于 alert 代码。然而，两者有两点不同。对于 prompt 代码，你需要遵循一种方法来接收用户的响应，这意味着你必须从声明变量开始代码。之后，你必须使用一个等号。在\
  \ prompt 中，你必须指定第二个字符串，即你在看到提示显示时在字段中出现的默认响应。\n\n### JavaScript 的 if 语句\n\n在本节中，我将解释如何处理不同类型的条件。假设你有一个弹窗询问用户：“你住在哪里？”\n\
  \n如果用户正确回答“白宫”，他将收到祝贺。如果他输入了其他内容，程序将不返回任何结果。\n\n\n\n\n\n- `else` 关键字用于指定当相同条件为假时，编辑器必须执行的代码。\n\
  - `else-if` 关键字用于当第一个条件为假时，添加一个新的条件进行测试。\n\n`if` 语句是区分大小大小的，因此关键字 `if` 和 `IF` 是两个不同的单词。如果你将\
  \ `if` 替换为 `IF`，你将在屏幕上看到错误。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>如果时间小于\
  \ 15:00，我将显示“祝你有愉快的一天！”：</p>\n<p id=\"if-demo\">祝你有美味的夜晚!</p>\n<script>\nif (new\
  \ Date().getHours() < 15) {\n  document.getElementById(\"if-demo\").innerHTML =\
  \ \"Have a Great Day!\";\n}\n</script>\n</body>\n</html>\n```\n\n如果时间小于 15:00，我将显示“祝你有愉快的一天！”：\n\
  \n\n\n祝你有愉快的一天！\n\n## The else 语句\n\n你可以使用 `else` 语句来指定当你的条件为假时需要执行的代码。我将使用相同的代码并在代码中添加\
  \ `else` 语句，看看我们如何使用 `else` 语句来扩展代码，使其更具交互性和用户友好性。现在，用户将有两个选择，而不是死板的单选项代码。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>我希望你点击下方的按钮，根据当前时间显示问候：</p>\n<button onclick=\"\
  FunctionX()\">请点击我显示问候</button>\n<p id=\"ifelse-demo\"></p>\n<script>\nfunction\
  \ FunctionX() {\n  var myhours = new Date().getHours();\n  var mygreetings;\n  if\
  \ (myhours < 15) {\n    mygreetings = \"Have a Great Day\";\n  } else {\n    mygreetings\
  \ = \"Have a Great Evening. I hope you enjoy your dinner.\";\n  }\n  document.getElementById(\"\
  ifelse-demo\").innerHTML = mygreetings;\n}\n</script>\n</body>\n</html>\n```\n\n\
  我希望你点击下方的按钮，根据当前时间显示问候：\n\n请点击我显示问候\n\n祝你有愉快的一天\n\n你可以看到 `else` 语句完美地集成到了现有代码中。我冒昧在代码中添加了一个交互式按钮，以便用户确切知道要做什么。当用户点击按钮时，他们将收到一条问候消息。该消息将根据程序在你本地读取的时间进行构建。这就是你如何在页面上构建交互式网页应用并吸引访问者的方法，你的访问者也会喜欢这种被欢迎的方式。\n\
  \n## The else if 语句\n\n你可以向代码添加 `else-if` 语句，在第一个条件返回假时指定新条件。在下面的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多大的改进。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>我希望你点击下方的按钮，根据当前时间显示问候：</p>\n<button\
  \ onclick=\"FunctionX()\">请点击我显示问候</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {\n  var mygreetings;\n  var mytime = new Date().getHours();\n\
  \  if (mytime < 8) {\n    mygreetings = \"Have a Good Morning. I hope you have had\
  \ a nutritious breakfast. Get ready for work\";\n  } else if (mytime < 15) {\n \
  \   mygreetings = \"Have a Great Day. Don't forget to eat your lunch.\";\n  } else\
  \ {\n    mygreetings = \"Have a Great Evening. Any special plans for dinner?\";\n\
  \  }\n  document.getElementById(\"ifelse-demo\").innerHTML = mygreetings;\n}\n</script>\n\
  </body>\n</html>\n```\n\n我希望你点击下方的按钮，根据当前时间显示问候：\n\n请点击我显示问候\n\n祝你有愉快的一天。不要忘记吃午饭。\n\
  \n这运行得非常完美。现在，你的程序将在一天中的三个时间段都显示问候消息。你可以根据业务需求定制消息并使其更具交互性。一些编码人员习惯于在编写 `if` 语句时省略大括号。这种做法是完全合法的；但这样做稍微有点困难。有些程序员会将初始大括号放在新的一行。另一种做法是将整个\
  \ `if` 语句写在单行中，这更容易实现，但当你回来研究程序的结构时，它会很难阅读。我建议你遵循我在上面示例中使用的相同规则，这样你会发现编写和理解起来也更容易。在大多数情况下，你可以用双等号\
  \ `==` 代替三等号。然而，你可能会发现一些微小的技术差异。\n\n编写 `if` 语句以及 `if` 语句的变体有很多格式。使用 `if` 语句进行编码的可能性是无限的。\n\
  \n## JavaScript Switch 语句\n\n你可以使用 `switch` 语句对 JavaScript 条件执行不同的操作。它将帮助你处理单个代码块并执行它。编辑器对其进行评估，在值之间进行比较，如果匹配，则执行该块。如果不匹配，则不执行。下面的程序将在程序运行\
  \ `switch` 语句并检查你的电脑，查看电脑日历是哪一天，以及代码中该一天包含什么消息。它将遍历一周中的七天，当遇到匹配时，它将运行你已经关联到同一天的消息。参见下面的代码。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"switch-demo\"></p>\n<script>\n\
  var weekdays;\nswitch (new Date().getDay()) {\n  case 0:\n    weekdays = \"the restful\
  \ Sunday\";\n    break;\n  case 1:\n    weekdays = \"the blue blue Monday\";\n \
  \   break;\n  case 2:\n    weekdays = \"the superstitious Tuesday\";\n    break;\n\
  \  case 3:\n    weekdays = \"the hectic Wednesday\";\n    break;\n  case 4:\n  \
  \  weekdays = \"the overwhelming Thursday\";\n    break;\n  case 5:\n    weekdays\
  \ = \"the joyful Friday\";\n    break;\n  case 6:\n    weekdays = \"the sleepy Saturday\"\
  ;\n}\ndocument.getElementById(\"switch-demo\").innerHTML = \"Today is \" + weekdays\
  \ + \".\" + \" Have a productive day!\";\n</script>\n</body>\n</html>\n```\n\n今天是迷信周二。祝高效的一天！\n\
  \n在上面的代码示例中，你可能注意加入了 `break` 关键字。当代码遇到 `break` 关键字时，它会跳出特定的块。这种跳出 `switch` 块的操作为执行提供了停止。你不需要在\
  \ `switch` 块的最后一个情况下插入 `break` 关键字。无论包含，它都会结束。如果你从 `switch` 块中排除 `break` 关键字，网络浏览器即使在不匹配的情况下也会执行随后的用例。因此，如果你跳过了\
  \ `break` 关键字，请做好遇到错误的准备。\n\n还有另一个可以添加到 `switch` 语句的关键字。即使在不匹配的情况下也会运行代码。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p id=\"switch-demo\"></p>\n<script>\nvar weekdays;\n\
  switch (new Date().getDay()) {\n  default:\n```\n\n\n\n\n\n```javascript\nweekdays\
  \ = \"I am desperately waiting for the weekend because I have planned a vacation.\"\
  ;\n\nbreak;\n\n  case 0:\n    weekdays = \"it is the restful Sunday\";\n    break;\n\
  \n  case 1:\n    weekdays = \"it is the blue blue Monday\";\n    break;\n\n  case\
  \ 3:\n    weekdays = \"it is the hectic Wednesday\";\n    break;\n\n  case 4:\n\
  \    weekdays = \"it is the overwhelming Thursday\";\n    break;\n\n  case 5:\n\
  \    weekdays = \"it is the joyful Friday\";\n    break;\n\n  case 6:\n    weekdays\
  \ = \"it is the sleepy Saturday\";\n}\n\ndocument.getElementById(\"switch-demo\"\
  ).innerHTML = weekdays;\n```\n\n我正焦虑地等待周末，因为我计划了一个假期。\n\n# 第五章\n\n## JavaScript\
  \ 字符串与数组\n\n![](img/Image00001.jpg)\n\n我已经解释了什么是字符串以及你如何在脚本中使用它们。在处理字符串时，你可以使用一些方法。某些原始值不能拥有方法或属性，因为它们不是对象。然而，JavaScript\
  \ 允许原始值拥有属性和方法，因为它在执行属性和方法时会将原始值视为对象。你可以学习程序中所使用的字符串的长度。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String 属性将回答关于你的字符串长度的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>\nvar msgX = \"I am about to leave for New York\
  \ to start my own business.\";\nvar msgY = msgX.length;\ndocument.getElementById(\"\
  string-demo\").innerHTML = msgY;\n</script>\n</body>\n</html>\n```\n\n### 学习 JavaScript\
  \ 字符串的属性\n\n这个 String 属性将回答关于你的字符串长度的问题：\n\n58\n\n另一个 JavaScript 方法可以帮助你在字符串中查找另一个字符串。我在这里将使用的方法叫做\
  \ `indexOf()`。如果你在另一个字符串内部指定了一个字符串，它将为你找到它。需要记住的一个重要注意点是，你可以使用单引号在字符串内部创建另一个字符串。接下来的示例将解释这一操作。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n<script>\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.indexOf(\"\
  New York\");\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n\
  </body>\n</html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\n25\n\n你可以看到内部字符串的索引已经显示在屏幕上。请记住，JavaScript\
  \ 从 0 开始计算索引值。\n\n## lastIndexOf() 方法\n\n你可以使用 `lastIndexOf()` 方法来查看 `New York`\
  \ 最后一次出现的索引，它是我们指定的内部字符串。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript\
  \ 字符串的属性</p>\n<p>这个 String 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n\
  <script>\nvar msgX = \"I am about to leave for 'New York' to start my own business.\"\
  ;\nvar msgY = msgX.lastIndexOf(\"New York\");\ndocument.getElementById(\"string-demo\"\
  ).innerHTML = msgY;\n</script>\n</body>\n</html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\
  \n25\n\n#### 如果未找到索引怎么办？\n\n如果方法未能找到索引，它们将返回 `-1`。这可能发生你在代码中写了错误的拼写或完全不同的单词时。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n<script>\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.lastIndexOf(\"\
  Washington\");\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n\
  </body>\n</html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\n-1\n\n## search() 方法\n\
  \n还有另一种方法可以在长字符串中定位指定的内部字符串。如果匹配完全完美，你可以使用 `search()` 方法来查找它。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String 属性将回答关于你的字符串内部字符串的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>\nvar msgX = \"I am about to leave for 'New\
  \ York' to start my own business.\";\nvar msgY = msgX.search(\"New York\");\ndocument.getElementById(\"\
  string-demo\").innerHTML = msgY;\n</script>\n</body>\n</html>\n```\n\n这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：\n\n25\n\n如果你注意到这两个方法的结果，即 `search()` 和 `indexOf()`，你会发现它们是相同的。然而，`search()`\
  \ 不能接受第二个参数，而 `indexOf()` 可以。\n\n### 提取部分\n\n你可以根据需要将字符串分成多个部分。第一个方法是 `slice()`。通过使用两个参数来分割字符串：一个是起始位置，另一个是结束位置。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n<script>\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23,\
  \ 34);\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n\
  </body>\n</html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\n'New York'\n\n请记住 JavaScript\
  \ 从 `0` 点计算索引。如果一个参数变为负数，你必须从字符串的末尾向前计算。它将反向切割字符串。你可以尝试并获取结果。我现在将跳过它并测试忘记插入结束位置会发生什么。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n<script>\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23);\n\
  document.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n</body>\n\
  </html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\n'New York' to start my own business.\n\
  \n另一种切割字符串并创建子字符串的方法是 `substring()` 方法。它和 `slice()` 方法一样简单。它的不同之处在于不接受负索引。查看以下示例以理解它的用法。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 字符串的属性</p>\n<p>这个 String\
  \ 属性将回答关于你的字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n<script>\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.substring(23,\
  \ 34);\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n\
  </body>\n</html>\n```\n\n这个 String 属性将回答关于你的字符串内部字符串的问题：\n\n'New York'\n\n\n\n\n\
  第三也是最后一个切片方法是 `substr()` 方法，它与 `slice()` 非常相似。第二个参数定义了剩余字符串的长度。\n\n# 学习 JavaScript\
  \ 字符串属性\n\n这个 String 属性将回答关于字符串内部字符串的问题：\n\n```javascript\nvar msgX = \"I am about\
  \ to leave for 'New York' to start my own business.\";\nvar msgY = msgX.substr(23,\
  \ 34);\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n```\n\n这个 String\
  \ 属性将回答关于字符串内部字符串的问题：\n'New York' to start my own business\n\n当 JavaScript 允许你替换字符串内部的值时，它变得有趣了。例如，我在示例中包含的字符串包含\
  \ New York 作为我要访问的城市。JavaScript 允许你更改城市名称，而无需编写新代码并创建新字符串。这在编写长程序时为你节省了大量时间。该方法标识为\
  \ `replace()`。\n\n```javascript\nvar msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";\nvar msgY = msgX.replace('New York', 'Las Vegas');\n\
  document.getElementById(\"string-demo\").innerHTML = msgY;\n```\n\n学习 JavaScript\
  \ 字符串属性\nI am about to leave for 'Las Vegas' to start my own business.\n\n默认情况下，如果你写\
  \ `NEW YORK` 而不是 `New York`，JavaScript `replace()` 将无法工作。它是区分大小写的，并将不同的大小写识别为不同的单词。因此，如果你发现该方法不起作用，最好检查单词的大小写。此外，`replace()`\
  \ 方法只替换第一个匹配项。如果字符串中有多个 New York，它将只替换第一个匹配项，并保持其余单词不变。如果你想在忽略警告的情况下使用大写，你必须使用正则表达式（例如配合单词\
  \ `/i`）以便浏览器能够识别匹配。正则表达式将使单词不区分大小写。看在编辑器中应该怎么写的。\n\n```javascript\nvar msgX = \"\
  I am about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.replace(/NEW\
  \ YORK/i, 'Las Vegas');\ndocument.getElementById(\"string-demo\").innerHTML = msgY;\n\
  ```\n\n学习 JavaScript 字符串属性\nI am about to leave for 'Las Vegas' to start my own\
  \ business.\n\n让我们看看如果你在代码中漏掉了正则表达式并仍然使用大写字母，代码会变成什么。\n\n```javascript\nvar msgX\
  \ = \"I am about to leave for 'New York' to start my own business.\";\nvar msgY\
  \ = msgX.replace('NEW YORK', 'Las Vegas');\ndocument.getElementById(\"string-demo\"\
  ).innerHTML = msgY;\n```\n\n学习 JavaScript 字符串属性\nI am about to leave for 'New York'\
  \ to start my own business.\n\n你可以看到代码不再起了。\n\n### 全球化\n\n我已经解释过，如果你必须替换多个单词，你无法通过\
  \ `replace` 方法来实现。它根本不起作用。但是，有一个解决方案。如果你有多个必须替换为另一个单词的单词，你需要再次使用正则表达式。这次正则表达式被标记为\
  \ `/g`。包含表达式的方法与 `/i` 相同。不过，我将写一个新的字符串并包含该表达式以便你良好理解。\n\n```javascript\nvar msgX\
  \ = \"The Coach of the NBA team will visit Las Vegas. Las Vegas has a huge fan base\
  \ for NBA stars.\";\nvar msgY = msgX.replace(/Las Vegas/g, 'Los Angeles');\ndocument.getElementById(\"\
  string-demo\").innerHTML = msgY;\n```\n\n学习 JavaScript 字符串属性\nThe Coach of the NBA\
  \ team will visit Los Angeles. Los Angeles has a huge fan base for NBA stars.\n\n\
  还有一些其他方法可以调整字符串。你可以通过简单的方法将字符串转换为大写和小小写。\n\n```javascript\nfunction FunctionX()\
  \ {\n  var msg = document.getElementById(\"string-demo\").innerHTML;\n  document.getElementById(\"\
  string-demo\").innerHTML = msg.toUpperCase();\n}\n```\n\n我正在将字符串转换为大写和小写：\nJavaScript\
  \ 让你的网页具有交互性和用户友好！\n\n运行代码时会显示上述结果。我正在将字符串转换为大写和小写：\nJAVASCRIPT MAKES YOUR WEPAGES\
  \ INTERACTIVE AND USER-FRILY!\n\n你可以使用另一个 `toLowerCase()` 将文本转换为小写。\n\n### 合并\n\n\
  合并是所有编程语言不可或缺的一部分。当需要配对更多字符串时，程序员会寻求合并的支持。如果你代码写得好，`concat()` 方法就能顺畅运行。接下来的练习将帮助你顺利合并过程。\n\
  \n```javascript\nvar msg1 = \"I have been promoted as Executive Officer of Skyfall.\"\
  ;\nvar msg2 = \"I will call a board meeting next week!\";\nvar msg3 = msg1.concat(\"\
  \ \", msg2);\ndocument.getElementById(\"string-demo\").innerHTML = msg3;\n```\n\n\
  学习 JavaScript 字符串\nI have been promoted as Executive Officer of Skyfall. I will\
  \ call a board meeting next week.!\n\n 字符串数组\n\n这个标题可能看起来有点困惑。并没有所谓的“字符串数组”。但是，有一种新方法可以将字符串转换为数组。\n\
  \n```javascript\nfunction FunctionX() {\n  var msg1 = \"Texas, Las Vegas, Los Angeles.\"\
  ;\n  var msg2 = msg1.split(\",\");\n  document.getElementById(\"string-demo\").innerHTML\
  \ = msg2[0];\n}\n```\n\n点击“Click me”来生成第一个数组元素。\n点击此按钮\nTexas\n\n\n\n字符串是神奇的，如果你能良好掌握它们的方法和属性，它们将为你的编程工作提供极大帮助。如果你对细微差别有敏锐的观察力，JavaScript\
  \ 编程是所有语言中最简单且最完美的语言。\n\n## JavaScript 数组\n\n与变量一样，`JavaScript` `Arrays`（数组）也是值的容器。然而，它们在属性上与变量不同，在于它们可以在一个名称下存储比变量更多的数据。因此，每当你需要在同一种名称下加载更多数据时，都应该使用数组。设置数组有多种方法，最简单的方法是使用\
  \ `var` 关键字，然后编写数组名称并赋值。数组在一个变量中存储多个单独的值。你必须用逗号将它们隔开，并将它们全部放在方括号内。等号必须跟在变量名后面。\n\
  \n当你需要访问数组中的所有值时，应该像处理字符串那样使用索引数字。方括号之间的数字表示索引。该数字必须与数组中值的位置对应。最需要记住的是，索引的位置从 0\
  \ 开始。\n\n当你创建一个数组后，就可以在浏览器中运行它了。你应该能在浏览器屏幕上看到所需的值。你可以修改索引并插入其他内容来显示不同的值。保存修改后的数字并刷新浏览器以更改结果。如果你的数组有三个项目，而你将索引设置为\
  \ 3，你会发现浏览器会在计算机屏幕上显示“undefined”（未定义）。这是因为数组中只有三个项目。当你输入索引 3 时，你正尝试显示一个并不存在的第四个项目。JavaScript\
  \ 不会显示错误，而是在数组中添加一个尚未定义的定义位置。JavaScript 将新位置添加到数组的末尾。在你用合理的值填充它之前，它将保持为 `undefined`。你可以根据需要使用这个新的\
  \ `undefined` 位置来存储数据。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript\
  \ 数组</p>\n<p id=\"array-demo\"></p>\n<script>\nvar carsforsale = [\"Honda\", \"\
  Toyota\", \"GTX\", \"Ford\"];\ndocument.getElementById(\"array-demo\").innerHTML\
  \ = carsforsale;\n</script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nHonda,Toyota,GTX,Ford\n\
  \n你可以从上面的示例中看到，JavaScript 数组是一种特殊的变量，它可以同时存储多个值。如果你有一个汽车列表，通常你可能会将其存储在多个变量中，现在你可以使用数组将所有值打包并插入网页中。如果你将它们存储在独立的变量中，你将创建四个不同名称的变量。现在是\
  \ 4 辆车，所以你可能认为为这些值创建四个独立变量没什么什么。然而，如果你有 4000 个值，为所有值创建独立变量将是一个问题。在这种情况下，数组就派上用场了同样，如果你有一百个值并且必须在循环中使用它们，独立变量将没有太大帮助。数组更容易处理，因为你可以轻松地遍历它们。\n\
  \n空格或换行在 JavaScript 数组中并不重要。你可以以不同的格式编写它们。请以下示例，它的内容与上面相同，但格式不同。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p id=\"array-demo\"></p>\n<script>\n\
  var carsforsale = [\"Honda\",\n    \"Toyota\",\n    \"GTX\",\n    \"Ford\"];\ndocument.getElementById(\"\
  array-demo\").innerHTML = carsforsale;\n</script>\n</body>\n</html>\n```\n学习 JavaScript\
  \ 数组\nHonda,Toyota,GTX,Ford\n\n它的结果与上一个示例相同。另一种创建数组的方法，这被称为 JavaScript 关键字 `new`。我将在下例示例中使用\
  \ `new` 关键字来创建一个数组。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript\
  \ 数组</p>\n<p id=\"array-demo\"></p>\n<script>\nvar carsforsale = new Array(\"Honda\"\
  , \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"array-demo\").innerHTML\
  \ = carsforsale;\n</script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nHonda,Toyota,GTX,Ford\n\
  \n让我们分析这种新格式并理解它的不同之处。第一个区别是在数组开头和等号之后添加了关键字 `new`，紧接着 `new` 关键字后面是 `Array` 关键字。另一个显著区别是去掉了方括号并添加了圆括号，但两种方法的工作方式相同。第二种方法更复杂冗长。为了简单、速度和可读性，你应该选择第一种方法，也称为数组字面量方法（array\
  \ literal method）。\n\n### 索引数字\n\n你可以通过索引数字访问数组的项。正如前面提到的，数组的索引从数字 0 开始。在下面的示例中，我将访问索引为\
  \ 0 的元素。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n\
  <p id=\"array-demo\"></p>\n<script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\"\
  , \"GTX\", \"Ford\");\ndocument.getElementById(\"array-demo\").innerHTML = carsforsale[0];\n\
  </script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nHonda\n\n通过索引数字可以访问数组的项。正如前面提到的，数组的索引可以帮助更改数组的值。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p id=\"array-demo\"\
  ></p>\n<script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"\
  Ford\");\ncarsforsale[0] = \"BMW\";\ncarsforsale[1] = \"Mitsubishi\";\ndocument.getElementById(\"\
  array-demo\").innerHTML = carsforsale;\n</script>\n</body>\n</html>\n```\n学习 JavaScript\
  \ 数组\nBMW,Mitsubishi,GTX,Ford\n\n数组被视为特殊对象。如果你使用 `typeof` 运算符检查数组的类型，你会得到“object”。但我们必须使用“数组”这个词来描述\
  \ JavaScript 数组。这是因为 JavaScript 数组使用数字访问元素，而对象使用项名称。你可以给数组分配任何值。你可以赋值给变量的值你可以在数组中混合不同的类型。程序员更倾向于给数组使用复数名称，如城市、国家等。这是因为每个数组都是多个项目的列表。与普通变量一样，你只需要声明一次数组。\n\
  \nJavaScript 变量可能被称为对象，而 JavaScript 数组被认为是特殊对象，因为数组可以包含不同类型的变量。你可以用对象、函数甚至数组填充数组。与字符串一样，数组的真正力量在于丰富的属性和内置方法。\n\
  \n### 数组属性\n\n要讨论的第一个属性是 `length` 属性。它返回数组的长度，包含数组的所有元素。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p id=\"array-demo\"></p>\n<script>\nvar\
  \ carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"\
  array-demo\").innerHTML = carsforsale.length;\n</script>\n</body>\n</html>\n```\n\
  学习 JavaScript 数组\n4\n\n你可以构建一个遍历数组的循环来显示所有项或在程序中使用所有项。创建循环常用的方法之一是 `for` 循环。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些是 JavaScript 数组</p>\n<p>我将在下面的代码中使用\
  \ for 循环</p>\n<p id=\"array-demo\"></p>\n<script>\nvar carsforsale, msg, cLn, y;\n\
  carsforsale = [\"BMW\", \"Mitsubishi\", \"Honda\", \"Toyota\"];\n</script>\n</body>\n\
  </html>\n```\n\n\n\n\n```javascript\ncLn = carsforsale.length;\nmsg = \"<ul>\";\n\
  for (y = 0; y < cLn; y++) {\n  msg += \"<li>\" + carsforsale[y] + \"</li>\";\n}\n\
  msg += \"</ul>\";\ndocument.getElementById(\"array-demo\").innerHTML = msg;\n```\n\
  \n这些是 JavaScript 数组\n我将在下面的代码中使用 for 循环\n\n- 宝马\n- 本田\n- 丰田\n\n你已经看到如何在网页上显示一个整洁、清晰的项目列表。下次当你在网页上看到类似的列表时，你应该知道是数组和\
  \ for 循环起了作用。在数组中，还有另一个函数可以实现相同的效果。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>这些是 JavaScript 数组</p>\n<p>我将在下面的代码中使用 for 循环</p>\n<p id=\"array-demo\"></p>\n\
  <script>\nvar carsforsale, msg;\ncarsforsale = [\"BMW\", \"Honda\", \"Toyota\"];\n\
  msg = \"<ul>\";\ncarsforsale.forEach(function(value) {\n  msg += \"<li>\" + value\
  \ + \"</li>\";\n});\nmsg += \"</ul>\";\ndocument.getElementById(\"array-demo\").innerHTML\
  \ = msg;\n</script>\n</body>\n</html>\n```\n\n- 宝马\n- 本田\n- 丰田\n\n### 添加元素\n\n你可以使用\
  \ `push()` 方法向数组中添加元素。如果你在零售公司工作，每天都要向同一个数组上传新元素，这个 JavaScript 功能非常有帮助。JavaScript\
  \ 的奇妙之处在于它允许你声明带有值的变量。之后，你可以使用 `push` 函数向同一个变量添加值。你可以根据需要更改这些值。所有这些都可以在一个数组中完成。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p>我将使用 push\
  \ 方法向现有数组中添加新元素。</p>\n<button onclick=\"FunctionXX()\">请点击此按钮</button>\n<p id=\"\
  array-demo\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Tomato\", \"Ginger\"\
  , \"Potato\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\nfunction\
  \ FunctionXX() {\n  veggies.push(\"Spinach\");\n  document.getElementById(\"array-demo\"\
  ).innerHTML = veggies;\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 数组\n\
  南瓜, 西番柿, 生姜, 土豆\n\n你将使用 `push` 方法向现有数组添加新元素。当你在浏览器中运行代码时，你会看到上面的结果。当你点击网页浏览器中的按钮时，你可以在数组项目列表中看到新添加的元素。当我点击按钮时，我看到了以下结果\n\
  \n南瓜, 西番柿, 土豆, 菠菜\n\n你可以操作 `length` 属性向数组添加新元素。看看你是如何使用 `length` 属性的\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p>我将使用 push 方法向现有数组中添加新元素。</p>\n\
  <button onclick=\"FunctionXX()\">请点击此按钮</button>\n<p id=\"array-demo\"></p>\n<script>\n\
  var veggies = [\"Pumpkin\", \"Tomato\", \"Ginger\", \"Potato\"];\ndocument.getElementById(\"\
  array-demo\").innerHTML = veggies;\nfunction FunctionXX() {\n  veggies[veggies.length]\
  \ = \"Spinach\";\n  document.getElementById(\"array-demo\").innerHTML = veggies;\n\
  }\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 数组\n南瓜, 西番柿, 土豆, 菠菜\n\n如果你不知道自己在做什么，处理数组可能会很棘手。例如，你可以使用索引号向数组添加元素。在此过程中，如果你在代码中包含一个较大的索引，你将在数组中创建完全为\
  \ `undefined` 的空洞。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript\
  \ 数组</p>\n<p>我将添加具有高索引的元素。结果将在数组中产生 undefined \"空洞”。</p>\n<p id=\"undefinedarray-demo\"\
  ></p>\n<script>\nvar veggies, msg, cLn, XX;\nveggies = [\"Pumpkin\", \"Ginger\"\
  , \"Tomato\", \"Garlic\"];\nveggies[8] = \"Spinach\";\ncLn = veggies.length;\nmsg\
  \ = \"\";\nfor (XX = 0; XX < cLn; XX++) {\n  msg += veggies[XX] + \"<br>\";\n}\n\
  document.getElementById(\"undefinedarray-demo\").innerHTML = msg;\n</script>\n</body>\n\
  </html>\n```\n\n学习 JavaScript 数组\n南瓜\n生姜\n西番柿\n大蒜\nundefined\nundefined\nundefined\n\
  undefined\n菠菜\n\n你可以看到 JavaScript 并没有在代码中返回错误。它只是在没有项目填充的位置创建了一个 `undefined` 槽位。如果以后需要，可以用项目填充该\
  \ `undefined` 槽位。因此，这实际上并不能被视为致命错误。\n\n### 关联数组\n\n在编程世界中，许多编程语言具有具有索引元素的数组。在 JavaScript\
  \ 中，数组也可以具有由字符串索引的元素。这些被称为关联数组。\n\n```javascript\nvar user = {};\nuser[\"name\"\
  ] = \"John\";\nuser[\"age\"] = 30;\nuser[\"city\"] = \"New York\";\nconsole.log(user[\"\
  name\"]); // John\nconsole.log(user[\"age\"]); // 30\nconsole.log(user[\"city\"\
  ]); // New York\n```\n\n### 数组转换\n\nJavaScript 提供了可以将数组转换为字符串的方法。最常用的方法是 `toString()`\
  \ 方法。\n\n```javascript\nvar fruits = [\"Apple\", \"Banana\", \"Cherry\"];\nconsole.log(fruits.toString());\
  \ // Apple,Banana,Cherry\n```\n\n不仅 `toString()` 方法可以将数组转换为字符串，`join()` 方法也是如此。它允许你指定一个分隔符。\n\
  \n```javascript\nvar fruits = [\"Apple\", \"Banana\", \"Cherry\"];\nconsole.log(fruits.join(\"\
  \ - \")); // Apple - Banana - Cherry\n```\n\n\n\n\n当你在使用数组操作零售店或金融公司时，你可以使用 `pop`\
  \ 和 `push` 方法来提取或添加元素。`pop` 将一个元素从数组中弹出，而 `push` 则将一个元素推入数组。`pop` 方法唯一的问题是你 能从数组的末尾删除元素。请查看以下示例了解如何操作。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组</p>\n<p id=\"popping-demo1\"\
  ></p>\n<p id=\"popping-demo2\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\"\
  , \"Tomato\", \"Garlic\"];\ndocument.getElementById(\"popping-demo1\").innerHTML\
  \ = veggies;\nveggies.pop();\ndocument.getElementById(\"popping-demo2\").innerHTML\
  \ = veggies;\n</script>\n</body>\n</html>\n```\n\n# 学习 JavaScript 数组\n\n南瓜、生姜、番柿、大蒜\n\
  \n南瓜、生姜、番柿\n\n数组的最后一项通过 `pop()` 方法的帮助被弹出了。你可以重复运行脚本，最终将得到一个空数组。\n\n现在你已经学会了如何从数组中弹出项，我将解释如何推入元素。请记住，在运行代码后，你不会立即看到添加的元素。由于我在代码中添加了一个按钮，你必须先点击按钮才能显示元素。由于代码中包含一个函数，`push`\
  \ 方法将向代码中添加许多相同元素的实例。持续点击，浏览器将不断向数组中添加更多实例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
