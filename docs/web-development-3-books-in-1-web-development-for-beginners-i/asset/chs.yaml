  \  点击我进行数字排序\n`100,251,1002,1567,4045,5234`\n\n### 随机排序\n\n你可以使用 `random` 方法随机排序数组。请参考示例了解如何将该方法添加到代码中并获得所需的结果。通过使用\
  \ `random` 方法，你将获得数字的随机排序。我无法在这里显示所有排序结果，因为我每次点击按钮时，在浏览器中得到的结果都不一样。你可以使用代码并通过多次点击按钮查看不同的结果。请看以下示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组排序</p>\n<p>通过点击按钮，你可以按升序排序数组。</p>\n\
  <button onclick=\"FunctionT()\">点击我</button>\n<p id=\"demo10\"></p>\n<script>\n\
  var nums = [4000, 1000, 15, 555, 253, 102];\ndocument.getElementById(\"demo10\"\
  ).innerHTML = nums; \nfunction FunctionT() {\n  nums.sort(function(x, y){return\
