  土豆 ,花椰菜 ,卷菜\n\n## 数组排序 (Array Sorting)\n\n你可以使用 `sort()` 方法按字母顺序对数组排序。当你处理零售店或金融机构的海量数组项时，这非常有帮助。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is JavaScript Array Sort method</p>\n\
  <p>This method will sort out an array in alphabetical order.</p>\n<button onclick=\"\
  FunctionAlpha()\">请点击此处</button>\n<p id=\"demo10\"></p>\n<script>\nvar veggies =\
  \ [\"Garlic \", \"Spinach \", \"Radish \", \"Peas \", \"Potato \"];\ndocument.getElementById(\"\
  demo\").innerHTML = veggies;\nfunction FunctionAlpha() {\n  veggies.sort();\n  document.getElementById(\"\
  demo10\").innerHTML = veggies;\n}\n</script>\n</body>\n</html>\n```\n\n这是 JavaScript\
  \ 数组排序方法\n该方法将按字母顺序对数组排序。\n\n请点击此处\n大蒜 ,菠菜 ,萝卜 ,豌豆 ,土豆\n\n## 反转 (Reverse)\n\n你可以通过\
  \ `reverse()` 方法将数组设置为反转位置。它将元素反序排列。该方法按字母倒倒排列。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>This is JavaScript Array Sort method</p>\n<p>This method will sort out\
  \ an array in alphabetical order.</p>\n<button onclick=\"FunctionAlpha()\">请点击此处</button>\n\
  <p id=\"demo10\"></p>\n<script>\nvar veggies = [\"Garlic \", \"Spinach \", \"Radish\
  \ \", \"Peas \", \"Potato \"];\ndocument.getElementById(\"demo\").innerHTML = veggies;\n\
  function FunctionAlpha() {\n  veggies.sort();\n  veggies.reverse();\n  document.getElementById(\"\
  demo10\").innerHTML = veggies;\n}\n</script>\n</body>\n</html>\n```\n\n这是 JavaScript\
  \ 数组排序方法\n该方法将按字母顺序对数组排序。\n\n大蒜 ,菠菜 ,萝卜 ,豌豆 ,土豆\n\n## 数字排序 (Sorting Numeric)\n\n\
  `concat()` 方法遵循以下合并模式：\n西红柿 ,土豆 ,花椰菜 ,卷菜\n土豆 ,花椰菜 ,卷菜\n\n如果你省略了结束参数，结果将包含整个左侧的数组。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>By\
  \ clicking the button, you can sort the array in ascending order.</p>\n<button onclick=\"\
  FunctionT()\">请点击此处</button>\n<p id=\"demo10\"></p>\n<script>\nvar nums = [4000,\
  \ 1000, 15, 555, 253, 102];\ndocument.getElementById(\"demo\").innerHTML = veggies;\n\
  function FunctionT() {\n  nums.sort(function(x, y){return x - y});\n  document.getElementById(\"\
  demo10\").innerHTML = nums;\n}\n</script>\n</body>\n</html>\n```\n\n## 降序排序 (Sorting\
  \ Descending)\n\n`concat()` 方法遵循合并模式：\n西红柿 ,土豆 ,花椰菜 ,卷菜\n土豆 ,花椰菜 ,卷菜\n\n我将使用相同的\
  \ `sort()` 方法按降序模式进行排序。让我们看看可以得到什么类型的结果。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>JavaScript Array Sort</p>\n<p>By clicking the button, you can sort the array\
  \ in ascending order.</p>\n<button onclick=\"FunctionT()\">请点击此处</button>\n<p id=\"\
  demo10\"></p>\n<script>\nvar nums = [4000, 1000, 15, 555, 253, 102];\ndocument.getElementById(\"\
  demo\").innerHTML = veggies;\nfunction FunctionT() {\n  nums.sort(function(x, y){return\
  \ y - x});\n  document.getElementById(\"demo10\").innerHTML = nums;\n}\n</script>\n\
  </body>\n</html>\n```\n\n比较函数 (Compare Function)\n\n\n\n\n即使在处理数字时，你也可以使用 `compare`\
  \ 函数来获得所需的结果。该函数的作用是定义排序顺序的特定替代方案。此 `compare` 函数必须根据你使用的参数返回零、负值或正值。当你向 `sort()`\
  \ 函数传递几个值时，它会将这些值分发给 `compare` 函数。之后，它将根据返回的负值、正值或零值来对这些值进行排序。如果你看到负结果，则 `x` 将排在\
  \ `y` 之后；如果你看到正结果，则 `y` 将排在 `x` 之前。数字 0 表示这些值的排序顺序没有变化。\n\n该函数比较数组中的值。当它比较 `20`\
  \ 和 `100` 时候，它会调用 `compare` 函数并计算差值。如果结果为负数，它将声明 `20` 的值低于 `100`。你可以使用以下代码段对字母排序和数字排序进行实验。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 数组排序</p>\n<p>你可以使用点击按钮按字母顺序或数字顺序排序数组。</p>\n\
  <button onclick=\"FunctionP()\">点击我进行字母排序</button>\n<button onclick=\"FunctionQ()\"\
  >点击我进行数字排序</button>\n<p id=\"demo1\"></p>\n<script>\nvar nums = [4045, 1002, 1567,\
  \ 5234, 251, 100];\ndocument.getElementById(\"demo1\").innerHTML = nums; \nfunction\
  \ FunctionP() {\n  nums.sort();\n  document.getElementById(\"demo1\").innerHTML\
  \ = nums;\n}\nfunction FunctionQ() {\n  nums.sort(function(x, y){return x - y});\n\
  \  document.getElementById(\"demo1\").innerHTML = nums;\n}\n</script>\n</body>\n\
  </html>\n```\n\n# 学习 JavaScript 数组排序\n\n你可以使用点击按钮按字母顺序或数字顺序排序数组。\n\n点击我进行字母排序  点击我进行数字排序\n\
