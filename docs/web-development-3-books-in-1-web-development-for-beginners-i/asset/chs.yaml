  \n# Web 开发\n\n# 使用 CSS 进行设计\n\n![](img/Image00001.jpg)\n\nAndy Vickler\n\n## 引言\n\
  \n![](img/Image00001.jpg)\n\n本书包含了使用 CSS 设计网站的经过验证的步骤和策略。我从零创建了所有代码，以便你可以复制并粘贴到编辑器中进行练习。你可以更改值、属性和样式以获得不同的结果。CSS\
  \ 允许你尝试各种颜色组合、边框样式、边框图案、盒子、表单来设计网页。\n\n几乎所有的 HTML 元素都欢迎 CSS 作为样式工具。你可以选取单个 HTML\
  \ 元素并赋予它们独特的样式，为你的网站创建独特的视觉。本书包含了大量的代码和相关输出，以便你将代码用于练习。在书中，某些输出缺失，有些可能与你在网页上看到的不符，因为无法在书中整合网页。然而，当你在编辑器中执行代码并将其上传到浏览器时，你会发现输出正如我描述的以及你预期的那样。此外，请注意不同的不同的浏览器产生不同的结果。有些接受某些代码，而另一些不。因此，请不要忘记在\
  \ Firefox、Internet Explorer、Safari 和 Chrome 等不同浏览器上尝试同一段代码。\n\n最有趣的章节之一是书的最后一章，包含了创建和设计网页布局的代码。一旦学会了如何设计单个元素，本书将带你进入创建网页布局的旅。你将学习如何设置头部、页脚和列，以整合博客文章和其他重要元素。\n\
  \n我建议你在开始阅读本书时保持笔记本电脑运行。我也建议你在系统上安装诸如 Adobe Dreamweaver 这样的专业编辑器，以便你可以测试我在书中包含的所有代码示例。在系统上安装多个浏览器来测试不同的代码段也是更好的选择，这样你就能知道你的代码是否在所有浏览器上运行良好。使用在所有浏览器上运行良好的\
  \ CSS 代码，这样你就不会因为 CSS 代码在他们的浏览器上无法运行而失去客户。\n\n如果你具备 HTML 的实用性知识，你的学习过程将会很有趣。然而，你不需要成为\
  \ HTML 专家。HTML 的代码编写得很整洁，CSS 则清晰地嵌入在 `<style>` 和 `</style>` 标签中。在过几个代码示例后，你将开始掌握哪个\
  \ HTML 元素用于什么目的。此外，记住每段 CSS 代码必须设计一个或多个 HTML 元素。\n\n## 第一章：使用 CSS 进行设计\n\n![](img/Image00001.jpg)\n\
  \n网站的创建需要对设计原理以及向观众展示内容的技术有深入的理解。在开始阅读本书之前，你应该确保你有一个功能完备的计算机和操作系统。你应该理解电脑的目录系统，以便浏览不同的文件夹。你应该知道如何保存、定位和查找文件。\n\
  \n在开始阅读本书之前，你应该确保你有一个功能完备的计算机和操作系统。你应该理解电脑的目录系统，以便浏览不同的文件夹。你应该知道如何保存、定位和查找文件。\n\n\
  当你开始学习 CSS 时，你需要安装一个文本编辑器。没有特定的是必须安装的。你可以使用 Adobe Dream 和 Web。\n\n### 工具\n\n有很多工具可以用于\
  \ CSS 设计网站；它们从简单到复杂，再到一些健壮的包。工具的选择取决于你的个人喜好、购买的工具以及项目范围。CSS 使用文本作为基础。因此，你可以使用 `Notepad`、`TextEdit`\
  \ 这样的简单文本编辑器。它们非常适合创建和设计网页。但这些基础工具缺乏检查语法和组织不同网站文件夹的一些高级功能。此外，你无法将代码上传到 Web 服务器。\n\
  \n### Notepad 和 TextEdit\n\n你可以在 Windows 应用程序中找到 `Notepad`。按照以下步骤创建包含 CSS 代码的 HTML\
  \ 文件。\n\n- 你需要进入“开始”，然后是“程序”，最后是“记事本”。然后选择“文件”并点击“新建”。该文件将以 `.txt` 格式保存。\n- 当你打开\
  \ `Notepad` 时，你会看到顶部菜单有“文件”。现在点击“另存为”。在文件名字段中将文件扩展名从 `.txt` 更改为 `.html`。\n\n\n\n\
  \n\n-   在你的系统上，打开“应用程序”文件夹并找到 `TextEdit` 。`TextEdit` 软件默认创建以 `.rtf` 格式保存文档。你必须更改应用程序的设置才能成功使用\
  \ `HTML`。\n-   现在你应该选择“设置”（Preferences）。你会在这里看到一个对话框。\n-   在“新建文档”选项卡中，你应该选择“纯文本”单选按钮。现在你将只会看到没有任何任何格式的纯文本。\n\
  -   点击“打开”（Open）和“保存”（Save）标签。取消勾选 `.txt` 扩展并启用 `.html` 扩展，以更改你创建和保存的文件类型。\n\n##\
  \ 颜色编码\n\n你可以使用许多编辑器来编辑代码。其中一些选项也非常高级。高级文本编辑器具有许多优点，使得编辑器易于处理和操作。其最大的优点之一就是颜色编码。无论你是在为\
  \ `HTML` 或 `CSS` 页面编写代码，还是打开现有页面进行编辑，你都会看到不同颜色的代码。这有助于不同代码在视觉上进行分离，使得编辑和更改更加容易。带有值和属性的标签具有不同类型的颜色，让你更容易定位特定类型的代码。它还可以帮助你发现并纠正错误。如果你忘记添加引号和闭括号，代码的颜色就会改变。你会立即知道自己犯了错误。如果你漏掉了闭括号或某些引号，会导致内容的颜色与你正确应用标签时的颜色不同。当你习惯了彩色的语法后，你将通过追踪相同的颜色来发现\
  \ HTML 文档中的错误。大多数现代文本编辑器都允许你自定义语法颜色。你可以选择你喜欢的颜色。\n\n## 视觉辅助\n\n高级编辑工具在打开的编辑会话中包含行号。这些行号有助于人们在代码中定位，并有助于与开发者和设计师的协作。这些工具让你能够轻松看到原本不可见的换行符。\n\
  \n## 补全\n\n大多数文本编辑器都会处理不同的繁琐任务，如输入括号和常用标签。不同程序的快捷键和方法各异，但大多数功能全文本编辑器都保留了这一功能。某些编辑器通过从选项列表中选择剩余代码来触发代码补全。这加速了编码过程，因为你不需要记住整个代码。此外，大多数文本编辑器会自动处理重复任务。通过自动化片段、宏、代码和其他代码来加快编码速度。这些工具允许你在页面上包含可重用的代码段。这也为你节省了大量时间。\n\
  \n## 第二章\n\n## 简介 CSS\n\n![](img/Image00001.jpg)\n\n`CSS` 用于网页的样式化。它是层叠样式表（Cascading\
  \ Style Sheets）的缩写。它用于描述如何在屏幕或任何其他媒体上显示 `HTML` 元素。设计网站时，它将为你节省大量工作。你可以同时控制多个页面的网页布局。外部样式表将存储在所有的\
  \ `CSS` 文件中。\n\n`CSS` 定义了不同布局和屏幕尺寸变体的网页样式。在它上市时，`HTML` 并不打算包含格式化网页的标签。它主要用于描述你网站的内容如何在浏览器中显示。后来，`HTML`\
  \ 添加了 `<font>` 和 `<color>` 标签，这变成了网页开发人员的噩梦。在单个页面中添加字体和颜色信息的大型网站开发变得既昂贵又耗时。正是 `CSS`\
  \ 解决了这个问题。它移除了 `HTML` 页面上的样式功能。\n\n代码以 `.css` 扩展名保存。当你创建一个外部样式表文件时，只需更改文件即可改变你网站的外观。\n\
  \n## CSS 语法\n\n每个 `CSS` 规则包含一个声明块和一个选择器块。选择器将指向你需要样化的 `HTML` 元素。声明块将包含用分号分隔的声明。每个声明必须包含\
  \ `CSS` 属性的名称和值，并必须用冒号分隔它们。多个 `CSS` 声明应当用分号和声明块分隔。你必须将它们包含在大括号内。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\np {\n  color: green;\n  text-align: left;\n}\n\
  </style>\n</head>\n<body>\n<p>学习 CSS 编程!</p>\n<p>我用 CSS 编码样式化了这个段落。</p>\n</body>\n\
  </html>\n```\n\n学习 CSS 编程！\n\n我用 CSS 编码样式化了这个段落。\n\n在上面的示例中，`p` 是指向你必须样化的 `HTML`\
  \ 元素的选择器。`color` 是 `CSS` 的一个属性，而 `green` 是该属性的值。`text-align` 再次是一个 `CSS` 属性，而 `left`\
  \ 是该属性的值。这是 `CSS` 代码的基本结构。我将以相同的结构编写所有代码。唯一的区别是代码的长度和目标。\n\n## CSS 选择器\n\n正如你在示例看到的，`CSS`\
  \ 中的选择器用于选择你需要样化的特定 `HTML` 元素。`CSS` 选择器可以分为以下几类。\n\n-   `CSS` 有简单选择器，用于根据名称、`id`\
  \ 和 `class` 选择元素。\n-   你可以使用组合选择器，通过首先分析元素之间的关系来选择元素。\n-   伪类选择器基于 `HTML` 元素的特定状态。\n\
  -   属性选择器关注属性和属性的值。\n-   伪元素选择器关注特定元素的样式。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np {\n  text-align: left;\n  color: grey;\n}\n</style>\n</head>\n\
  <body>\n<p>我将此样式应用到这段代码中的所有段落。</p>\n<p id=\"para1\">段落 1</p>\n<p>段落 2</p>\n</body>\n\
  </html>\n```\n\n我将此样式应用到这段代码中的所有段落。\n\n段落 1！\n\n段落 2\n\nid 选择器将使用 HTML 的属性来选择特定元素。HTML\
  \ 元素的 id 是唯一的；这就是为什么 id 选择器只选择单个元素。如果你想通过唯一 ID 选择特定元素，你可以使用 `#` 字符和元素的 id。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\n#paragraph1 {\n  text-align: left;\n \
  \ color: green;\n}\n</style>\n</head>\n<body>\n<p id=\"paragraph1\">学习 CSS 编程!</p>\n\
  <p>我用 CSS 编码样式化了这个段落。</p>\n</body>\n</html>\n```\n\n学习 CSS 编程！\n\n我用 CSS 编码样式化了这个段落。\n\
  \nID 名称不能以数字开头。\n\n## 类选择器\n\n`CSS` 类选择器通过特定的类属性选择所有的 `HTML` 元素。你可以编写点和类名来选择具有特定名称的元素。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.kaz {\n  text-align: left;\n\
  \  color: red;\n}\n</style>\n</head>\n<body>\n<p class=\"kaz\">样式已应用到这个段落。</p>\n\
  <p class=\"kaz\">样式已应用到这个段落</p>\n</body>\n</html>\n```\n\n样式已应用到这个段落。\n\n样式已应用到这个段落\n\
  \n你可以自由指定想要受此类影响的 `HTML` 元素。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  p.kaz {\n  text-align: left;\n  color: red;\n}\n</style>\n</head>\n<body>\n<h4 class=\"\
  kaz\">样式没有应用到这个段落。</h4>\n<p class=\"kaz\">样式已应用到这个段落</p>\n</body>\n</html>\n```\n\
  \n样式没有应用到这个段落。\n\n样式已应用到这个段落\n\n\n\n\n\n此外，你还可以为单个 HTML 元素添加多个类（class）。这将为你的网页带来独特的视觉效果，也会让样式设置变得简单而有趣。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np.kaz {\n  text-align: left;\n\
  \  color: blue;\n}\np.large {\n  font-size: 200%;\n}\n</style>\n</head>\n<body>\n\
  <h4 class=\"kaz\">我将不会改变这个标题</h4>\n<p class=\"kaz\">我将这个段落变成红色并将其对齐到页面的左侧。</p>\n\
  <p class=\"kaz large\">我将这个段落变成红色，并将其对齐到页面的左侧。唯一的区别是它的字体更大。</p>\n</body>\n</html>\n\
  ```\n\n我将不会改变这个标题\n\n我将这个段落变成红色并将其对齐到页面的左侧。\n\n我将这个段落变成红色并将其对齐到页面的左侧。唯一的区别是它的字体更大。\n\
  \n## CSS 通用选择器\n\nCSS 通用选择器可以通过 `*` 符号来识别。它选择网页上的每一个元素。样式将覆盖到所有元素，并赋予它们通用的视觉效果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n* {\n  text-align: left;\n\
  \  color: blue;\n}\n* {\n  font-size: 130%;\n}\n</style>\n</head>\n<body>\n<h4 class=\"\
  kaz\">我也会改变这个标题</h4>\n<p class=\"kaz\">我将这个段落变成红色并将其对齐到页面的左侧。现在它的字体也会变大。</p>\n<p\
  \ class=\"kaz large\">我将这个段落变成红色，并将其对齐到页面的左侧。它的字体将会更大。</p>\n</body>\n</html>\n```\n\
  \n我也会改变这个标题\n\n我将这个段落变成红色并将其对齐到页面的左侧。现在它的字体也会变大。\n\n我将这个段落变成红色并将其对齐到页面的左侧。它的字体将会更大。\n\
  \n## 分组选择器\n\nCSS 分组选择器将样式应用于所有具有相同样式定义的 HTML 元素。在接下来的示例中，我将编写代码并对 HTML 文档内部的所有元素实现\
  \ CSS 分组选择器。形成选择器组是一个更好的选择，它有助于减少代码。我将在代码中使用逗号来分隔每个选择器。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\nh4, p, p {\n  text-align: left;\n  color: green;\n}\n</style>\n\
  </head>\n<body>\n<h4>学习 CSS 分组选择器</h4>\n<p>CSS 样式应用于此段落了！</p>\n<p>这个段落将继承相同的 CSS\
  \ 样式！</p>\n</body>\n</html>\n```\n\n### 学习 CSS 分组选择器\n\nCSS 样式应用于此段落了！\n\n这个段落将继承相同的\
  \ CSS 样式！\n\n## 添加 CSS\n\n每当浏览器读取样式表时，它都会准备好根据样式表中包含的信息来格式化 HTML 文档。在 HTML 文档中插入\
  \ CSS 有三种不同的方法：内部 CSS 方法、外部 CSS 方法和内联 CSS 方法。\n\n### 外部 CSS\n\n通过外部样式表，你可能通过更改单个文件来改变整个网站的外观。HTML\
  \ 页面需要集成对外部样式表的清晰引用。请记住，你必须将引用放在 HTML 文档的 `head` 内部。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<link rel=\"This is a stylesheet\" href=\"kazstyle.css\">\n</head>\n\
  <body>\n<h4>我正在写一个 h4 标题</h4>\n<p>样式将应用于此段落。</p>\n</body>\n</html>\n```\n\n我正在写一个\
  \ h4 标题\n\n样式将应用于此段落。\n\n你可以使用任何喜欢的文本编辑器编写外部 CSS 表格。你必须以 `.css` 扩展名保存它。这个外部 `.css`\
  \ 文件不能包含 HTML 标签。属性的单位和值之间不应有空格。\n\n### 内部 CSS\n\n第二种 CSS 集成类型是通过内部样式。如果单个 HTML\
  \ 页面带有独特的样式，你可以使用内部样式表。内部样式表定义在 `<style>` 元素中，该元素应该放在 HTML 文档的 `head` 中。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\nbody {\n  background-color: green;\n}\n\
  p {\n  color: blue;\n  margin-left: 60px;\n}\n</style>\n</head>\n<body>\n<h4> 学习\
  \ CSS 内部样式</h4>\n<p>我正在通过内部样式为 HTML 文档设置样式。</p>\n<p>这个段落带有相同的样式。</p>\n</body>\n\
  </html>\n```\n\n学习 CSS 内部样式\n\n我正在通过内部样式为 HTML 文档设置样式。\n\n这个段落带有相同的样式。\n\n### 内联\
  \ CSS 样式\n\n第三种方法是内联 CSS 样式。你可以为单个元素应用不同的样式。当你使用内联样式时，可以添加样式属性。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p style=\"color:red;text-align:left;\">地球是圆的。</p>\n<p\
  \ style=\"color:blue;\">不要相信。</p>\n</body>\n</html>\n```\n\n地球是圆的。\n\n不要相信。\n\n\
  ## 多样式表\n\n当一个元素发现多个样式时，会产生级联（cascading）规则：\n\n- 第一条规则是内联样式，它位于 HTML 元素内部。\n- 第二条规则是内部和外部样式，位于\
  \ `head` 部分。\n- 第三条规则是浏览器默认设置。\n\n内联样式优先级最高。它会覆盖内部和外部样式，也会覆盖浏览默认设置。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\nh4 {\n  color: blue;\n}\n</style>\n<link\
  \ rel=\"This is a stylesheet\" type=\"text/css\" href=\"kazstyle.css\">\n</head>\n\
  <body>\n<h4>多样式</h4>\n<p>你看到了外部和内部样式的组合。更改颜色产生结果</p>\n</body>\n</html>\n```\n\n\
  ### 多样式\n\n你看到了外部和内部样式的组合。更改颜色产生结果\n\n如果你在链接外部样式表之前定义内部样式，颜色将会改变。\n\n## 注释\n\nCSS\
  \ 注释无法在浏览器中显示；但它们支持源代码的文档化。你可以使用注释为代码添加简要说明，或者在以后编辑源代码时使用。浏览器忽略注释。注释必须放在 `<style>`\
  \ 括号内。它必须以 `/*` 开始，并以 `*/` 结束。在下面的示例中，我将在代码顶部添加一个注释。查看如何向 CSS 代码添加注释。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\n/* 我正在学习 CSS 来设计我的网站。*/\np {\n  color:\
  \ green;\n}\n</style>\n</head>\n<body>\n<p>学习 CSS！</p>\n<p>我正在用 CSS 为这个段落设置样式。</p>\n\
  <p>CSS 不允许注释在浏览器中显示。</p>\n</body>\n</html>\n```\n\n学习 CSS！\n\n我正在用 CSS 为这个段落设置样式。\n\
  \nCSS 不允许注释在浏览器中显示。\n\n你可以随心所欲地注释的位置。当你编写复杂的代码时，你需要注释来解释代码，这样当你以后回来查看这些代码时，可以轻松地扫描它。\n\
  \n\n\n\n\n```css\n/* 我正在学习 CSS 来设计我的网站。*/\n\np {\n  color: green; /* 我已将颜色设置为绿色。请不要在代码后面重复使用相同的颜色。请改用红色或蓝色\
  \ */\n}\n```\n</style>\n</head>\n<body>\n<p>学习 CSS！</p>\n<p>我正在使用 CSS 为这个段落设置样式。</p>\n\
  <p>CSS 不允许在浏览器中显示注释。</p>\n</body>\n</</html>\n\n# 学习 CSS！\n\n我正在使用 CSS 为这个段落设置样式。\n\
  \nCSS 不允许在浏览器中显示注释。\n\n## 背景颜色\n\n在设计网站时，更改背景颜色是一件趣事。不同的页面根据其结构和内容需要不同的颜色。通过 CSS，你可以为你的网页添加不同的颜色。这使得识别你的网页变得容易。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h4 style=\"background-color:SkyBlue;\"\
  >学习 CSS</h4>\n<p style=\"background-color:pink;\">\n在这段代码中，我将更改两个 HTML 元素的背景。更改背景颜色不会改变元素的文本颜色。\n\
  </p>\n</body>\n</html>\n```\n\n### 学习 CSS\n\n在这段代码中，我将更改两个 HTML 元素的背景。更改背景颜色不会改变元素的文本颜色。\n\
  \n## 文本颜色\n\n你也可以更改 HTML 元素的文本颜色。为了这个目的，我必须更改代码的位置。下面的示例将解释如何更改代码的颜色。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<h4 style=\"color:SkyBlue;\">CSS 文本颜色</h4>\n<p\
  \ style=\"color:Pink;\">你可以看到代码的位置发生了变化。现在它被集成到了相关的 HTML 中。</p>\n<p style=\"color:SeaGreen;\"\
  >这是在整个网页中为文本添加颜色最简单、高效的方法。如果需要，你可以为页面上的每个元素赋予唯一的颜色。</p>\n</body>\n</html>\n```\n\
  \n### CSS 文本颜色\n\n你可以看到代码的位置发生了变化。现在它被集成到了相关的 HTML 中。\n\n这是在整个网页中为文本添加颜色最简单、最高效的方法。如果需要，你可以为页面上的每个元素赋予唯一的颜色。\n\
  \n## 边框颜色\n\n虽然边框颜色在网页中并不常见，但 CSS 为你提供了最有效的方法为 HTML 元素添加边框，并涂上你所需的颜色。当你编写代码时，你有机会设置边框的宽度。你可以为边框设置不同的厚度以将其与其他区分开来。当你需要强调网页上的某个元素时，这非常有用。例如，当你设计落地页时，可以使用\
  \ CSS 的边框功能包围并着你的行动号召（Call To Action），使其突出且引人注目。就像我们将代码插入单个元素内部为文本着色一样，我们可以使用相同的技术创建并为\
  \ CSS 边框添加颜色。查看以下示例了解如何操作。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p style=\"\
  border: 6px solid pink;\">CSS 边框颜色</p>\n<p style=\"border: 4px solid SkyBlue;\"\
  >CSS 边框颜色</p>\n<p style=\"border: 2px solid Violet;\">CSS 边框颜色</p>\n</body>\n</html>\n\
  ```\n\n### CSS 边框颜色\n\nCSS 边框颜色\n\nCSS 边框颜色\n\n## 替代着色方法\n\nCSS 中添加颜色的另一种方法。你可以使用\
  \ HEX 值、RGB 值、RGBA 值、HSL 值和 HSLA 值。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>以下将显示与名称 \"Tomato\" 相同的颜色：</p>\n<p style=\"background-color:rgb(255, 99, 71);\"\
  >这种颜色是 rgb(255, 99, 71)。这在你制作专业网站时降低了出错的概率。</p>\n<p style=\"background-color:#ff6347;\"\
  >这是代码 #ff6347 的第二种方法</p>\n<p style=\"background-color:hsl(9, 100%, 64%);\">这是 hsl\
  \ 方法 (9, 100%, 64%)</p>\n<p>以下将显示与 \"Tomato\" 相同的颜色，但它具有 50% 的透明度：</p>\n<p style=\"\
  background-color:rgba(255, 99, 71, 0.5);\">这是精确的数字：rgba(255, 99, 71, 0.5)</p>\n\
  <p style=\"background-color:hsla(9, 100%, 64%, 0.5);\">这是第二种方法：hsla(9, 100%, 64%,\
  \ 0.5)</p>\n<p>你可以使用预定义的颜色名称，也可以借助 RGBA 或 HSLA 颜色值通过 RGB、HSL、HEX 或透明颜色来指定颜色。</p>\n\
  </body>\n</html>\n```\n\n以下将显示与名称 \"Tomato\" 相同的颜色：\n\n这种颜色是 rgb(255, 99, 71)。这在你制作专业网站时降低了出错的概率。\n\
  \n这是代码 #ff6347 的第二种方法。\n\n这是 hsl 方法 (9, 100%, 64%)。\n\n以下将显示与 \"Tomato\" 相同的颜色，但它具有\
  \ 50% 的透明度：\n\n这是精确的数字：rgba(255, 99, 71, 0.5)。\n\n这是第二种方法：hsla(9, 100%, 64%, 0.5)。\n\
  \n你可以使用预定义的颜色名称，也可以借助 RGBA 或 HSLA 颜色值通过 RGB、HSL、HEX 或透明颜色来指定颜色。\n\n\n\n\n当值达到最大时，背景完全是白色：`rgb(255,\
  \ 255, 255)`\n\n当你对红、绿、蓝使用相等的值时，你会产生不同深浅的灰色。值不相等则不会产生灰色。\n\n值不相等会破坏灰色调，结果会跳出一种新颜色：`rgb(255,\
  \ 100, 255)`\n\n你可以看到文本，因为它会将背景涂抹成纯黑色：`rgb(0, 0, 0)`\n\n这比第一个亮一点，但由于黑色的色调，你将看不到任何文本：`rgb(60,\
  \ 60, 60)`\n\n随着值的增加，你会看到更浅的色调：`rgb(120, 120, 120)`\n\n这比上一个亮：`rgb(180, 180, 180)`\n\
  \n这好多了：`rgb(240, 240, 240)`\n\n当值达到最大时，背景完全是白色：`rgb(255, 255, 255)`\n\n当你对红、绿、蓝使用相等的值时，你会产生不同深浅的灰色。值不相等则不会产生灰色。\n\
  \n值不相等会破坏灰色调，结果会跳出一种新颜色：`rgb(255, 100, 255)`\n\n## RGBA Colors\n\nRGBA 颜色值似乎是带有\
  \ alpha 通道的 RGB 值的扩展。它指定颜色的透明度。RGBA 是 (红、绿、蓝、alpha) 的缩写。alpha 参数是一个 0.0（完全透明）到 1.0（不透明）之间的数字。我将保持颜色值不变，只更改\
  \ alpha 值。结果非常悦目。\n\n当 alpha 为零时，背景完全透明的：`rgba(255, 70, 190, 0)`\n\n当你增加 alpha 值时，透明度会略微降低：`rgba(255,\
  \ 70, 190, 0.2)`\n\n这更不透明但仍然较亮：`rgba(255, 70, 190, 0.4)`\n\n继续增加值，你将在不改变颜色的情况下看到更深色的背景：`rgba(255,\
  \ 70, 190, 0.6)`\n\n变得浓密：`rgba(255, 70, 190, 0.8)`\n\n这是所有中最浓密的：`rgba(255, 70, 190,\
  \ 1)`\n\nalpha 的值 1 是最大值。你不能再增加它。即使你这样做，它对背景的透明度也没有影响：`rgba(255, 70, 190, 2)`\n\n\
  这是在不改变原始值的情况下处理颜最专业的方法。\n\n当 alpha 为零时，背景是透明的：`rgba(255, 70, 190, 0)`\n\n当你增加 alpha\
  \ 值时，透明度会略微降低：`rgba(255, 70, 190, 0.2)`\n\n这更不透明但仍然较亮：`rgba(255, 70, 190, 0.4)`\n\
  \n继续增加值，你将在不改变颜色的情况下看到更深色的背景：`rgba(255, 70, 190, 0.6)`\n\n变得浓密：`rgba(255, 70, 190,\
  \ 0.8)`\n\n这是所有中最浓密的：`rgba(255, 70, 190, 1)`\n\nalpha 的值 1 是最大值。你不能再增加它。即使你这样做，它对背景的透明度也没有影响：`rgba(255,\
  \ 70, 190, 2)`\n\n这是在不改变原始值的情况下处理颜色的最专业的方法。\n\n## HEX Colors\n\nHEX 表示十六进制颜色。十六进制颜色用十六进制数指定。六位数字可以分为两个红色、两个绿色和两个蓝的组合。十六进制整数指定颜色。值可以用\
  \ `00` 和 `ff` 的形式设置。`ff` 值是最大值 255。查看以下代码以理解你如何利用 HEX 创建出美妙的色彩混合。\n\n由于前两个位置指定为红色，`ff`\
  \ 意味着 255，所以你会看到深红色：`#ff0000`\n\n最后两个位置指定为蓝色。使用双 `f`，你会看到深蓝色：`#0000ff`\n\n这是一种混合，会产生海绿色：`#3cb71`\n\
  \n你不能在 `f` 之后使用任何字母。如果你这样做，屏幕上将不会显示颜色。如果没有颜色困扰到你，请留意 `g, z` 或 `q`。\n\n准备好迎接橙色：`#ffa500`\n\
  \n紫色出现了。这可能会让你困惑，如何知道哪种颜色组合会产生什么样的结果；然而，练习越多，就能产生越好的组合：`#6aacd`\n\n你可能在 CSS 源码中看到三位十六进制代码。短代码是六位代码的缩写。单个数字代表\
  \ `r`、`g` 和 `b`。在短代码中，一个值用于双倍值。代码 `#ff00cc` 与 `#f0c` 相同。\n\n## CSS 3-digit Hexadecimal\
  \ Code\n\nCSS HSL 是色相（hue）、饱和度（saturation）和亮度（lightness）的缩写。你可以通过按 HSL 顺序使用色相、饱和度和来指定颜色。色相范围从\
  \ 0 到 360，其中 `0` 表示红色，`120` 表示绿色，`240` 表示蓝色。饱和度的值为百分比形式。`0%` 意味着灰色，`100%` 意味着色彩。亮度也以百分比形式出现，`0%`\
  \ 是黑色，`50%` 是深浅中间，`100%` 是完全白色。你可以更改值并尝试颜色。\n\n此 HSL 代码产生深红色：`hsl(0, 100%, 50%)`\n\
  \n正如我所说 `240` 将带来蓝色，你会看到深蓝色：`hsl(240, 100%, 50%)`\n\n\n\n是时候把背景变为海绿色了。你可以改变数值来改变海绿色的密度：`hsl(147,\
  \ 50%, 47%)`\n\n紫色：`hsl(300, 76%, 72%)`\n\n是时候引入橙色了：`hsl(39, 100%, 50%)`\n\n我们这里有紫红色：`hsl(248,\
  \ 53%, 58%)`\n\n当我改变了饱和度和亮度后，没有紫色了：`hsl(248, 53%, 58%)`\n\n紫色仅仅因为饱和度的原因变成了蓝色：`hsl(248,\
  \ 53%, 58%)`\n\n饱和度有奇妙的作用。即使色相相同，它也能改变颜色。你可以将饱和度描述为衡量颜色强度的标准。在 100% 时，它是最纯净的颜色。没有灰色调。50%\
  \ 意味着它为 50% 的灰色留出了空间；然而，你仍然可以看到原始颜色。在 0% 时，饱和度完全是灰色。你无法再看到原始颜色。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p style=\"background-color:hsl(0, 100%, 45%);\">炽热色调：hsl(0,\
  \ 100%, 45%)</p>\n<p style=\"background-color:hsl(0, 80%, 50%);\">带灰的红色：hsl(0, 80%,\
  \ 45%)</p>\n<p style=\"background-color:hsl(0, 60%, 50%);\">红与灰的混合：hsl(0, 60%, 45%)</p>\n\
  <p style=\"background-color:hsl(0, 40%, 50%);\">灰色开始主于红色：hsl(0, 40%, 45%)</p>\n\
  <p style=\"background-color:hsl(0, 20%, 50%);\">红色几乎消失，为灰色留出空间：hsl(0, 20%, 45%)</p>\n\
  <p style=\"background-color:hsl(0, 0%, 50%);屏幕上没有红色，只有灰色：hsl(0, 0%, 45%)</p>\n</body>\n\
  </html>\n```\n\n使用 HSL 颜色，你可以通过增加和减少饱和度来设定颜色调并创建颜色混合。0% 的饱和度是全灰色。\n\n### 炽热色调：`hsl(0,\
  \ 100%, 45%)`\n\n带灰的红色：`hsl(0, 80%, 45%)`\n\n红与灰的混合：`hsl(0, 60%, 45%)`\n\n灰色开始主于红色：`hsl(0,\
  \ 40%, 45%)`\n\n红色几乎消失，为灰色留出空间：`hsl(0, 20%, 45%)`\n\n屏幕上没有红色，只有灰色：`hsl(0, 0%, 45%)`\n\
  \n使用 HSL 颜色，你可以通过增加和减少饱和度来设定颜色调并创建颜色混合。0% 的饱和度是全灰色。\n\nHSL 是程序员的青睐，因为它允许他们在不改变原始颜色的情况下进行实验。就像饱和度一样，你也可以改变颜色的亮度。在\
  \ 0% 时，意味着没有光。50% 意味着半光，100% 意味着全光。你将在屏幕上看到白色。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p style=\"background-color:hsl(150, 100%, 0%);\">在 0% 时，你的网站看起来是漆黑的。不推荐！hsl(0,\
  \ 100%, 0%)</p>\n<p style=\"background-color:hsl(150, 100%, 25%);\">深绿色出现：hsl(0,\
  \ 100%, 25%)</p>\n<p style=\"background-color:hsl(150, 100%, 50%);\">增加亮度从深绿色中引出鹦鹉色：hsl(0,\
  \ 100%, 50%)</p>\n<p style=\"background-color:hsl(150, 100%, 75%);\">随着亮度进一步提高，海绿色出现：hsl(0,\
  \ 100%, 75%)</p>\n<p style=\"background-color:hsl(150, 100%, 90%);\">当你将其提升到 90%\
  \ 时，天蓝色出现：hsl(0, 100%, 90%)</p>\n<p style=\"background-color:hsl(150, 100%, 100%);\"\
  >在 100% 时，屏幕上没有颜色：hsl(0, 100%, 100%)</p>\n</body>\n</html>\n```\n\n在 0% 时，你的网站看起来是漆黑的。不推荐！`hsl(0,\
  \ 100%, 0%)`\n\n深绿色出现：`hsl(0, 100%, 25%)`\n\n增加亮度从深绿色中引出鹦鹉色：`hsl(0, 100%, 50%)`\n\
  \n随着亮度进一步提高，海绿色出现：`hsl(0, 100%, 75%)`\n\n当你将其提升到 90% 时，天蓝色出现：`hsl(0, 100%, 90%)`\n\
  \n在 100% 时，屏幕上没有颜色：`hsl(0, 100%, 100%)`\n\n你也可以为 HSL 颜色添加透明度。这让上色过程变得更加有趣和神奇。HSL\
  \ 代码在包含通道道时转变为 HSLA。通道道会调整颜色的透明度。0% 的透明度表示透明背景，而 1% 的透明度表示不透明。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p style=\"background-color:hsl(150, 100%, 0%);\">全黑</p>\n\
  <p style=\"background-color:hsl(150, 100%, 25%);\">天蓝色出现</p>\n<p style=\"background-color:hsl(150,\
  \ 100%, 50%);\">海绿色出现</p>\n<p style=\"background-color:hsl(150, 100%, 75%);\">深绿色出现</p>\n\
  <p style=\"background-color:hsl(150, 100%, 100%);\">全白</p>\n</body>\n</html>\n```\n\
  \n### 三、饱和度\n\n是时候把背景变为海绿色了。你可以改变数值来改变海绿色的密度：`hsl(147, 50%, 47%)`\n\n紫色：`hsl(300,\
  \ 76%, 72%)`\n\n是时候引入橙色了：`hsl(39, 100%, 50%)`\n\n我们这里有紫红色：`hsl(248, 53%, 58%)`\n\
  \n当我改变了饱和度和亮度后，没有紫色了：`hsl(248, 53%, 58%)`\n\n紫色仅仅因为饱和度的原因变成了蓝色：`hsl(248, 53%, 58%)`\n\
  \n饱和度有奇妙的作用。即使色相相同，它也能改变颜色。你可以将饱和度描述为衡量颜色强度的标准。在 100% 时，它是最纯净的颜色。没有灰色调。50% 意味着它为\
  \ 50% 的灰色留出了空间；然而，你仍然可以看到原始颜色。在 0% 时，饱和度完全是灰色。你无法再看到原始颜色。\n\n### 四、亮度\n\nHSL 是程序员的青睐，因为它允许他们在不改变原始颜色的情况下进行实验。就像饱和度一样，你也可以改变颜色的亮度。在\
  \ 0% 时，意味着没有光。50% 意味着半光，100% 意味着全光。你将在屏幕上看到白色。\n\n在 0% 时，你的网站看起来是漆黑的。不推荐！`hsl(0,\
  \ 100%, 0%)`\n\n深绿色出现：`hsl(0, 100%, 25%)`\n\n增加亮度从深绿色中引出鹦鹉色：`hsl(0, 100%, 50%)`\n\
  \n随着亮度进一步提高，海绿色出现：`hsl(0, 100%, 75%)`\n\n当你将其提升到 90% 时，天蓝色出现：`hsl(0, 100%, 90%)`\n\
  \n在 100% 时，屏幕上没有颜色：`hsl(0, 100%, 100%)`\n\n你也可以为 HSL 颜色添加透明度。这让上色过程变得更加有趣和神奇。HSL\
  \ 代码在包含通道道时转变为 HSLA。通道道会调整颜色的透明度。0% 的透明度表示透明背景，而 1% 的透明度表示不透明。\n\n### 五、透明度\n\n\
  HSL 代码在包含通道道时转变为 HSLA。通道道会调整颜色的透明度。0% 的透明度表示透明背景，而 1% 的透明度表示不透明。\n\n### 六、图像\n\n\
  另一个用于背景的 CSS 属性是 `image` 属性。你可以指定如何使用图像作为网页的背景。默认情况下，图像总是重复的，以完全覆盖整个元素。\n\n\n\n\n\
  # CSS 背景图像！\n\n这段代码将把图像设置为你网页的背景！\n\n`background-attachment` 属性用于指定图像必须滚动还是保持固定，这意味着当用户滚动页面其他部分时，图像不会向上或向下滚动。\n\
  \n# CSS 边框\n\nCSS 边框属性非常有趣，它们允许你固定 HTML 元素边框的宽度、样式和颜色。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\np.dot {border-style: dotted;}\np.dash {border-style: dashed;}\n\
  p.sol {border-style: solid;}\np.doub {border-style: double;}\np.groov {border-style:\
  \ groove;}\np.ridg {border-style: ridge;}\np.ins {border-style: inset;}\np.out {border-style:\
  \ outset;}\np.non {border-style: none;}\np.hid {border-style: hidden;}\np.mixed\
  \ {border-style: dashed dotted solid double;}\n</style>\n</head>\n<body>\n<h4>你正在学习\
  \ border-style 属性</h4>\n<p>你可以使用各种边框设计你的网站：</p>\n<p class=\"dot\">段落有点状边框。</p>\n\
  <p class=\"dash\">段落有虚线边框。</p>\n<p class=\"sol\">段落有实线边框。</p>\n<p class=\"doub\"\
  >段落有双线边框。</p>\n<p class=\"groov\">段落有凹槽边框。</p>\n<p class=\"ridg\">段落有凸脊边框。</p>\n\
  <p class=\"ins\">段落有内凹边框。</p>\n<p class=\"out\">段落有凸出边框。</p>\n<p class=\"non\">段落没有边框。</p>\n\
  <p class=\"hid\">段落有隐藏边框。</p>\n<p class=\"mixed\">段落有混合边框。</p>\n</body>\n</html>\n\
  ```\n\n# 你正在学习 border-style 属性\n\n你可以使用各种边框设计你的网站：\n\n- 段落有点状边框。\n- 段落有虚线边框。\n-\
  \ 段落有实线边框。\n- 段落有双线边框。\n- 段落有凹槽边框。\n- 段落有凸脊边框。\n- 段落有内凹边框。\n- 段落有凸出边框。\n- 段落没有边框。\n\
  - 段落有隐藏边框。\n- 段落有混合边框。\n\n### 宽度\n\n你可以通过指定 `em`、`px`、`cm` 和 `pt` 单位来设置和更改边框的宽度。这些测量值将使边框变细、变粗或中等。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np.dot {border-style: dotted;\
  \ border-width: 10px;}\np.dash {border-style: dashed; border-width: medium;}\np.sol\
  \ {border-style: solid; border-width: 4px;}\np.doub {border-style: double; border-width:\
  \ thick;}\np.groov {border-style: groove; border-width: thin;}\np.ridg {border-style:\
  \ solid; border-width: 15px;}\np.ins {border-style: solid; border-width: 5px 15px;}\
  \ /*5px 上右, 15px 下左 */\np.out {border-style: solid; border-width: 5px 20px;}\np.non\
  \ {border-style: solid; border-width: 5px 15px 20px 5px;} /* 5px 上, 15px 右, 20px\
  \ 下, 5px 左 */\np.hid {border-style: hidden;}\np.mixed {border-style: dashed dotted\
  \ solid double;}\n</style>\n</head>\n<body>\n<h4>测试不同的边框宽度类型。 </h4>\n<p>我还将使用多个边框宽度：</p>\n\
  <p class=\"dot\">段落有点状边框。</p>\n<p class=\"dash\">段落有虚线边框。</p>\n<p class=\"sol\"\
  >段落有实线边框。</p>\n<p class=\"doub\">段落有双线边框。</p>\n<p class=\"groov\">段落有凹槽边框。</p>\n\
  <p class=\"ridg\">段落有凸脊边框。</p>\n<p class=\"ins\">段落有内凹边框。</p>\n<p class=\"out\"\
  >段落有凸出边框。</p>\n<p class=\"non\">段落没有边框。</p>\n<p class=\"hid\">段落有隐藏边框。</p>\n<p class=\"\
  mixed\">段落有混合边框。</p>\n</body>\n</html>\n```\n\n# 测试不同的边框宽度类型。\n\n我还将使用多个边框宽度：\n\n\
  - 段落有点状边框。\n- 段落有虚线边框。\n- 段落有实线边框。\n- 段落有双线边框。\n- 段落有凹槽边框。\n- 段落有凸脊边框。\n- 段落有内凹边框。\n\
  - 段落有凸出边框。\n- 段落没有边框。\n- 段落有隐藏边框。\n- 段落有混合边框。\n\n## 边框颜色\n\n你可以使用 `border-color`\
  \ 属性设置边框颜色。你可以使用颜色名称、`hex`、`rgb` 或 `hsl` 值。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np.dot {border-style: dotted; border-width: 10px; border-color:\
  \ red;}\np.dash {border-style: dashed; border-width: medium; border-color: green;}\n\
  p.sol {border-style: solid; border-width: 4px; border-color: blue;}\np.doub {border-style:\
  \ double; border-width: thick; border-color: yellow;}\np.groov {border-style: groove;\
  \ border-width: thin; border-color: purple;}\np.ridg {border-style: solid; border-width:\
  \ 15px; border-color: #ff0000;}\np.ins {border-style: solid; border-width: 5px 15px;\
  \ border-color: rgb(255, 0, 0);}\np.out {border-style: solid; border-width: 5px\
  \ 20px; border-color: hsl(0, 100%, 50%);}\np.non {border-style: solid; border-width:\
  \ 5px 15px 20px 5px; border-color: transparent;}\np.hid {border-style: hidden;}\n\
  p.mixed {border-style: dashed dotted solid double; border-color: red green blue\
  \ yellow;}\n</style>\n</head>\n<body>\n<h4>测试不同的边框颜色。</h4>\n<p class=\"dot\">段落有红色点状边框。</p>\n\
  <p class=\"dash\">段落有绿色虚线边框。</p>\n<p class=\"sol\">段落有蓝色实线边框。</p>\n<p class=\"doub\"\
  >段落有黄色双线边框。</p>\n<p class=\"groov\">段落有紫色凹槽边框。</p>\n<p class=\"ridg\">段落有十六进制红色凸脊边框。</p>\n\
  <p class=\"ins\">段落有 rgb 内凹边框。</p>\n<p class=\"out\">段落有 hsl 凸出边框。</p>\n</body>\n\
  </html>\n```\n\n# 边框边\n\n你可以使用 `border-top`、`border-right`、`border-bottom` 和 `border-left`\
  \ 属性单独为元素的每个边设置边框。\n\n```css\ndiv {\n  border-top: 5px solid red;\n  border-right:\
  \ 5px dashed green;\n  border-bottom: 5px dotted blue;\n  border-left: 5px double\
  \ yellow;\n}\n```\n\n\n\n\n\n你必须记住，边框的设计遵循某些规则。\n\n### 规则 1\n第一个规则是，如果你添加四个值并按 `ridge\
  \ dotted solid dashed` 的顺序排列，顶部的边框将是 `ridged`，右侧边框将是 `dotted`，底部边框将是 `solid`，左侧边框将是\
  \ `dashed`。\n\n规则 2：如果你添加三个值并按 `solid dotted dashed` 的顺序排列，顶部将是 `solid`，左右两侧是 `dotted`，底部将是\
  \ `dashed`。\n\n规则 3：如果你只添加 `solid` 和 `dashed`，顶部和底部将是 `solid`，左右两侧将是 `dashed`。\n\
  \n规则 4：如果你只添加 `solid`，边框的所有边都将是 `solid`。\n\n### 圆角边框\n\n边框的一个特殊属性是圆角边框。你可以使用特殊的\
  \ CSS 属性将正方形边框变为圆边框。该属性命名为 `border-radius`。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np.kaz {\n  border-top-style: solid; border-color: skyblue; border-radius:\
  \ 15px;\n  border-right-style: dotted; border-color: green border-radius: 15px;\n\
  \  border-bottom-style: double; border-color: skyblue border-radius: 15px;\n  border-left-style:\
  \ ridge; border-color: green border-radius: 15px;\n}\n</style>\n</head>\n<body>\n\
  <h4>我正在创建单独的边框</h4>\n<p class=\"kaz\">段落将具有四种不同的边框样式和圆角。</p>\n</body>\n</html>\n\
  ```\n\n# 第四章\n\n## CSS 外边距 (Margins) 与 内边距 (Padding)\n\n![](img/Image00001.jpg)\n\
  \n你可以使用 CSS 外边距在你定义的边框周围为不同的元素创建一些空间。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\ndiv {\n  margin: 100px;\n  border: 4px solid #5DAD60;\n}\n</style>\n</head>\n\
  <body>\n<h4>学习 CSS 外边距</h4>\n<div>此 HTML 元素将具有 100px 的边距。</div>\n</body>\n</html>\n\
  ```\n\n### 学习 CSS 外边距\n\nCSS 外边距有多个属性。你可以使用它们在边框周围为某些元素构建空间。你可以随心所欲地控制边距。你可以为顶、底、左、右不同的元素设置外边距。你可以在单独的代码行指定每个边的外边距。浏览器将计算外边距，并指定元素的长度和宽度。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  border: 5px solid\
  \ skyblue;\n  margin-top: 150px;\n  margin-bottom: 150px;\n  margin-right: 150px;\n\
  \  margin-left: 80px;\n  background-color: lightblue;\n}\n</style>\n</head>\n<body>\n\
  <p>我正在应用单独的 CSS 属性</p>\n<div>这个特定的 div 元素将具有 150px 的顶部外边距、150px 的右侧外边距、150px 的底部外边距和\
  \ 80px 的左侧外边距。</div>\n</body>\n</html>\n```\n\n### 外边距继承\n\n下面的示例包含了外边距的 CSS 继承功能。看看它是如何工作的。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  border: 5px solid\
  \ skyblue;\n  margin-left: 50px;\n}\np.kaz {\n  margin-left: inherit;\n}\n</style>\n\
  </head>\n<body>\n<h4>我正在测试外边距的继承值</h4>\n<p class=\"kaz\">这个 CSS 段落保留了从 div 元素继承的外边距。</p>\n\
  </body>\n</html>\n```\n\n### 外边距塌叠\n\nHTML 元素的顶部和底部外边距会被塌叠，形式为两个外边距中较宽的一个。这在左右外边距上不会发生，但在底部和顶部边距上会发生。\n\
  \n### CSS 内边距 (Padding)\n\nCSS 内边距为边框内 HTML 元素的内容增加了空间。你可以完全控制 CSS 内边距的属性。你可以用它在定义的边框内为元素生成空间。在\
  \ CSS 中，你可以使用属性设置不同元素顶、底、右、左侧的内边距。你可以为不同的属性指定内边距。CSS 内边距属性用于指定内边距的长度 `px` 和 `pt`。宽度以百分比表示。和外边距一样，它也有继承功能。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  border: 4px solid\
  \ skyblue;\n  background-color: lightblue;\n  padding-top: 40px;\n  padding-right:\
  \ 50px;\n  padding-bottom: 30px;\n  padding-left: 60px;\n}\n</style>\n</head>\n\
  <body>\n<h4>学习 CSS 内边距</h4>\n<p>我将使用 CSS 内边距的单独属性</p>\n<div>这个特定的 div 元素包含 40px\
  \ 的顶部内边距、50px 的右侧内边距、30px 的底部内边距和 60px 的左侧内边距。</div>\n</body>\n</html>\n```\n\n\
  ### CSS 宽度功能\n\n另一个重要功能是宽度功能。添加 `width` 属性可以测量并定义 HTML 元素具有多少宽度。当你定义宽度时，内边距会被添加到宽度属性中，这会产生意外的结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv.kaz {\n  width: 400px;\n\
  \  background-color: skyblue;\n}\ndiv.kaz1 {\n  width: 350px;\n  padding: 30px;\n\
  \  background-color: yellow;\n}\n</style>\n</head>\n<body>\n<p>学习 CSS 内边距和宽度功能</p>\n\
  <div class=\"kaz\">这个特定的 div 将有 400px 宽。</div>\n<br>\n<div class=\"kaz1\">尽管在 CSS\
  \ 中定义为 350px，该 div 将仍有 400px。</div>\n</body>\n</html>\n```\n\n如果你想将宽度保持在 350px，你需要包含\
  \ `box-sizing` 属性。这将保持元素的宽度。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  div.kaz {\n  width: 400px;\n  background-color: skyblue;\n}\ndiv.kaz1 {\n  width:\
  \ 300px;\n  padding: 30px;\n  box-sizing: border-box;\n  background-color: yellow;\n\
  }\n</style>\n</head>\n<body>\n<p>学习 CSS 内边距和宽度功能</p>\n<div class=\"kaz\">这个特定的 div\
  \ 将有 400px 宽。</div>\n<br>\n<div class=\"kaz1\">尽管在 CSS 中定义为 300px，该 div 将仍有 400px。</div>\n\
  </body>\n</html>\n```\n\n\n\n\n这些属性不包括边框、内边距和外距。它将设置边框、内边距和元素外距内区域的宽度和高度。你可以将值设置为\
  \ `auto` 来设置默认设置。浏览器将计算宽度和高度并调整自身以提供最具响应性的显示。长度值将以 `cm` 和 `px` 定义元素的宽度和高度。初始值用于将宽度或高度设置为默认。`inherit`\
  \ 值将触发属性的继承功能，并为元素分配父元素的值。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  div {\n  height: 100px;\n  width: 150%;\n  background-color: skyblue;\n}\n</style>\n\
  </head>\n<body>\n<p>这是 CSS 宽度和高度属性</p>\n<div>正在演示的 HTML 元素高度为 100 像素，宽度为 150%。</div>\n\
  </body>\n</html>\n```\n\n这是 CSS 宽度和高度属性。\n\n正在演示的 HTML 元素高度为 100 像素，宽度为 150%。\n\n\
  我正在使用 `px` 特性而不是百分比，使其更加精确高效。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  div {\n  height: 100px;\n  width: 150px;\n  background-color: skyblue;\n}\n</style>\n\
  </head>\n<body>\n<p>这是 CSS 宽度和高度属性</p>\n<div>正在演示的 HTML 元素高度为 100 像素，宽度为 150%。</div>\n\
  </body>\n</html>\n```\n\n这是 CSS 宽度和高度属性。\n\n正在演示的 HTML 元素高度为 100 像素，宽度为 150%。\n\n\
  你可以使用 `max-width` 属性设置最大宽度。你可以在长度值中指定此属性，例如 `cm` 和 `px`，或块的百分比 `%`。如果浏览器小于你的 HTML\
  \ 元素宽度，页面上将出现水平滚动条。`max-width` 特性将很好地处理这种情况。它将提高网站的响应性。`max-width` 特性会覆盖 `width`\
  \ 特性。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  max-width:\
  \ 500px;\n  height: 100px;\n  background-color: skyblue;\n}\n</style>\n</head>\n\
  <body>\n<p>这是 CSS max-width 属性</p>\n<div>正在演示的 HTML 元素高度为 100 像素，最大宽度为 500px。</div>\n\
  </body>\n</html>\n```\n\n这是 CSS max-width 属性。\n\n正在演示的 HTML 元素高度为 100 像素，最大宽度为 500px。\n\
  \n# 第五\n\n## CSS 盒模型\n\n![](img/Image00001.jpg)\n\nCSS 中的盒模型是网站设计和布局中不可或缺的一部分。CSS\
  \ 盒模型是一个封装了 HTML 元素的框。它包含了边框、外距、内边距和实际内容。CSS 盒模型有几个部分。最重要的部分之一是 `content`，你可以在其中插入显示在网站上的图像和文本。第二个组件是\
  \ `padding`，它会清除内容的所有区域。内边距始终是透明的。盒模型的第三部分是 `borders`。边框围绕模型的内容和内边距描勒。它完全封装了它们。盒模型的第四部分命名为\
  \ `margin`。它清理了边框周围区域并创建空间让框看起来更整洁。外距始终是透明的。盒模型倾向于元素周围添加边框，并定义所有元素之间的指定空间。在下面的示例中，我将创建一个盒模型。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  background-color:\
  \ grey;\n  width: 200px;\n  border: 20px solid skyblue;\n  padding: 40px;\n  margin:\
  \ 30px;\n}\n</style>\n</head>\n<body>\n<h4>学习盒模型</h4>\n<p>如果我们深入研究 CSS 盒模型，结果它是一个封装了你想要强调的每个\
  \ HTML 元素的框。</p>\n<div>这是你填充文本的地方。它有边框、适当的内边距、外距以及用户想要阅读的一些文本。</div>\n</body>\n\
  </html>\n```\n\n学习盒模型\n\n如果我们深入研究 CSS 盒模型，结果它是一个封装了你想要强调的每个 HTML 元素的框。这是你填充文本的地方。它有边框、适当的内边距、外距以及用户想要阅读的一些文本。\n\
  \n如果你想学习盒模型是如何工作的，你应该考虑如何正确设置元素的 `height` 和 `width`。当你设置 HTML 元素的 `height` 和 `width`\
  \ 时，你设置的是区域的尺寸。如果你想计算元素的大小，你需要加上内边距、外距和边框。你应该通过以下方法计算某个元素的总宽度。总宽度等于右内边距、左内边距、宽度、右边框、左边框、右外距和左外距。总高度通过测量高度、底部内边距、顶部内边距、底部外距和顶部边框计算。\n\
  \n## Outline\n\nCSS `outline` 绘制在元素的边框之外。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np {\n  border: 4px solid grey;\n  outline: #FFA99 solid 20px;\n\
  \  margin: auto;\n  padding: 40px;\n  text-align: left;\n}\n</style>\n</head>\n\
  <body>\n<h4>学习框的轮廓</h4>\n<p>这段文字将出现在框中。它有 4px 的灰色边框和宽度为 40px 的浅绿色轮廓。</p>\n</body>\n\
  </html>\n```\n\n学习框的轮廓\n\n这段文字将出现在框中。它有 4px 的灰色边框和宽度为 40px 的浅绿色轮廓。\n\n`outline`\
  \ 绘制在 HTML 元素周围。它画在边框之外，以便元素脱颖而出。它用于强调特定的文本、图像或信息。不要将 `outline` 与边框混淆，因为与边框不同，它是绘制在元素之外的。它可能会重叠内容。`outline`\
  \ 的宽度不会影响元素的高度。`outline` 特性具有不同的属性，让程序员自由实验。就像我们改变边框的外观一样，我们可以改变轮廓的外。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\np {outline-color:skyblue;}\np.dot {outline-style:\
  \ dotted;}\np.dash {outline-style: dashed;}\np.sol {outline-style: solid;}\np.doub\
  \ {outline-style: double;}\np.groov {outline-style: groove;}\np.rid {outline-style:\
  \ ridge;}\np.ins {outline-style: inset;}\np.out {outline-style: outset;}\n</style>\n\
  </head>\n<body>\n<p>学习 outline-style 属性</p>\n<p class=\"dot\">虚线轮廓</p>\n<p class=\"\
  dash\">破线轮廓</p>\n<p class=\"sol\">实线轮廓</p>\n<p class=\"doub\">双线轮廓</p>\n<p class=\"\
  groov\">槽纹轮廓</p>\n<p class=\"rid\">脊形轮廓</p>\n<p class=\"ins\">内凹轮廓</p>\n<p class=\"\
  out\">外扩轮廓</p>\n</body>\n</html>\n```\n\n学习 outline-style 属性\n\n虚线轮廓\n破线轮廓\n实线轮廓\n\
  双线轮廓\n槽纹轮廓\n脊形轮廓\n内凹轮廓\n外扩轮廓\n\n除非你设置了 `outline` 属性，否则其他属性将无效。首先设置它，然后应用其他属性以获得完整的功能和最少的错误。\n\
  \n### Width 属性\n\nCSS outline 特性具有 `width` 属性，根据需要使轮廓变粗或变细。`width` 属性指定轮廓有多宽。它可以具有以下值。如果你选择\
  \ `thin`，它等于 `1px`。如果你选择 `medium`，它大约为 `3px`。如果你选择 `thick`，它大约为 `5px`。你可以通过选择 `px`、`em`、`pt`\
  \ 和 `cm` 中的任何数字来设置特定尺寸。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np.kaz1\
  \ {\n  border: 2px solid grey;\n  outline-style: solid;\n  outline-color: blue;\n\
  \  outline-width: thin;\n}\n</style>\n</head>\n<body>\np.kaz2 {\n```\n\n\n\n```css\n\
  {\n  border: 2px solid black;\n  outline-style: solid;\n  outline-color: skyblue;\n\
  \  outline-width: medium;\n}\n\np.kaz3 {\n  border: 2px solid yellow;\n  outline-style:\
  \ solid;\n  outline-color: red;\n  outline-width: thick;\n}\n\np.kaz4 {\n  border:\
  \ 2px solid green;\n  outline-style: solid;\n  outline-color: green;\n  outline-width:\
  \ 6px;\n}\n```\n</style>\n</head>\n<body>\n<p>我正在学习 `outline-width` 属性</p>\n<p class=\"\
  kaz1\">生成细轮廓。</p>\n<p class=\"kaz2\">生成中等宽的轮廓。</p>\n<p class=\"kaz3\">这是一个粗轮廓。</p>\n\
  <p class=\"kaz4\">我正在为这个轮廓设置 6px 的厚度。</p>\n</body>\n</html>\n\n我正在学习 `outline-width`\
  \ 属性\n\n生成细轮廓。\n\n生成中等宽的轮廓。\n\n这是一个粗轮廓。\n\n我正在为这个轮廓设置 6px 的厚度。\n\n### 颜色属性\n\n你可以使用\
  \ CSS `outline` 属性来定义或更改网站上所有 HTML 元素的颜色。你可以使用 HEX、HSL 和 RGB 公式。编写颜色名称也是一种标准做法。\n\
  \n`invert` 值会执行颜色的反转，确保轮廓在完全不考虑背景深色的情况下保持可见。\n\n在这个代码示例中，我将解释如何通过代码为不同类型的轮廓分配多种颜色。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np.kaz1 {\n  border: 2px solid\
  \ grey;\n  outline-style: solid;\n  outline-color: blue;\n  outline-width: thin;\n\
  }\n\np.kaz2 {\n  border: 2px solid black;\n  outline-style: solid;\n  outline-color:\
  \ skyblue;\n  outline-width: medium;\n}\n\np.kaz3 {\n  border: 2px solid yellow;\n\
  \  outline-style: solid;\n  outline-color: #ff0000;\n  outline-width: thick;\n}\n\
  \np.kaz4 {\n  border: 2px solid green;\n  outline-style: solid;\n  outline-color:\
  \ rgb(50, 150, 255);\n  outline-width: 6px;\n}\n\np.kaz5 {\n  border: 2px solid\
  \ green;\n  outline-style: solid;\n  outline-color: hsl(255, 100%, 50%);\n  outline-width:\
  \ 6px;\n}\n\np.kaz6 {\n  border: 2px solid yellow;\n  outline-style: solid;\n  outline-color:\
  \ invert;\n  outline-width: 6px;\n}\n</style>\n</head>\n<body>\n<p>我正在学习 `outline-color`\
  \ 属性</p>\n<p class=\"kaz1\">颜色名称。</p>\n<p class=\"kaz2\">颜色名称。</p>\n<p class=\"\
  kaz3\">HEX 颜色。</p>\n<p class=\"kaz4\">用于轮廓的 rgb 颜色。</p>\n<p class=\"kaz5\">HSL 颜色。</p>\n\
  <p class=\"kaz6\">颜色反转。</p>\n</body>\n</html>\n```\n\n我正在学习 `outline-color` 属性\n\
  \n颜色名称。\n\n颜色名称。\n\nHEX 颜色。\n\n用于轮廓的 rgb 颜色。\n\nHSL 颜色。\n\n颜色反转。\n\n与其编写单独的代码行，CSS\
  \ 提供了一了一个简写属性，你可以在编写长代码时使用它来节省时间。然而，你应该在成为编码专家后才使用它。我将上述示例转换为简写代码。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\np.kaz1 {outline: solid blue thin;}\np.kaz2\
  \ {outline: solid skyblue medium;}\np.kaz3 {outline: dotted #ff0000 thick;}\np.kaz4\
  \ {outline: dashed rgb(50, 150, 255) 6px;}\np.kaz5 {outline: solid 2px green;}\n\
  p.kaz6 {outline: solid invert 6px;}\n</style>\n</head>\n<body>\n<p>我正在学习 `outline-color`\
  \ 属性</p>\n<p class=\"kaz1\">颜色名称。</p>\n<p class=\"kaz2\">颜色名称。</p>\n<p class=\"\
  kaz3\">HEX 颜色。</p>\n<p class=\"kaz4\">用于轮廓的 rgb 颜色。</p>\n<p class=\"kaz5\">HSL 颜色。</p>\n\
  <p class=\"kaz6\">颜色反转。</p>\n</body>\n</html>\n```\n\n我正在学习 `outline-color` 属性\n\
  \n颜色名称。\n\n颜色名称。\n\nHEX 颜色。\n\n用于轮廓的 rgb 颜色。\n\nHSL 颜色。\n\n颜色反转。\n\n### 轮偏移属性\n\n\
  此 CSS 属性在 HTML 元素和轮廓之间创建空间。该空间始终是透明的。你可以决定在轮廓和边框之间添加多少空间。我将通过示例来解释可以创建多大的间隙以及多少是足够的。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np {\n  margin: 40px;\n  border:\
  \ 2px dashed grey;\n  outline: 1px solid red;\n  outline-offset: 20px;\n}\n</style>\n\
  </head>\n<body>\n<p>我正在学习 `outline-offset` 属性</p>\n<p>你将看到在边框之外 20px 的轮廓。</p>\n\
  </body>\n</html>\n```\n\n学习 CSS `outline-offset` 属性\n\n你将看到在边框之外 20px 的轮廓。\n\n当你在浏览器中生成结果时，你会注意到轮廓和元素之间的空间是透明的。\n\
  \n### CSS 文本\n\n在开发和设计网站时，你需要对文本进行格式化并将其放入框内以便更好地显示。CSS 文本格式化是一项重要功能，因为没有文本和内容，网页设计是没有意义的。下面的示例将解释你有多少选项来格式文本。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv {\n  border: 2px dashed\
  \ grey;\n  outline: 1px solid red;\n  outline-offset: 20px;\n}\n</style>\n</head>\n\
  ...\n```\n\n\n\n\n这将是文本的默认方向。\n\n您的文本将从右到左方向。\n\n这将是文本的默认方向。\n\n您的文本将从右到左方向\n\n\
  ### 垂直对齐\n\n此 `vertical-align` 属性将为您的 HTML 元素设置垂直对齐。您可以添加图片并为其设置垂直对齐。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\nimg.topside {\n  vertical-align: top;\n\
  }\nimg.middleside {\n  vertical-align: middle;\n}\nimg.bottomside {\n  vertical-align:\
  \ bottom;\n}\n</style>\n</head>\n<body>\n<p>您的 <img src=\"logo.gif\" alt=\"kaz\"\
  \ width=\"250\" height=\"50\"> 图片具有默认对齐方式。</p><br>\n<p>您的 <img class=\"topside\"\
  \ src=\"kaz.gif\" alt=\"kaz\" width=\"250\" height=\"50\"> 图片将具有顶部对齐。</p><br>\n\
  <p>您的 <img class=\"middleside\" src=\"logo.gif\" alt=\"kaz\" width=\"250\" height=\"\
  50\"> 图片具有中间级对齐。</p><br>\n<p>您的 <img class=\"bottomside\" src=\"logo.gif\" alt=\"\
  kaz\" width=\"250\" height=\"50\"> 图片具有底部对齐。</p>\n</body>\n</html>\n```\n\n您的图片具有默认对齐方式。\n\
  \n您的图片将具有顶部对齐。\n\n您的图片具有中间级对齐。\n\n您的图片具有底部对齐。\n\n### 装饰\n\n您可以使用 `text-decoration`\
  \ 属性在 CSS 中装饰您的文本。该属性可以设置装饰，也可以移除装饰。该属性的取值‘none’会移除所有装饰。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\np.k {\n  text-decoration: overline;\n}\np.l {\n  text-decoration:\
  \ line-through;\n}\np.m {\n  text-decoration: underline;\n}\n</style>\n</head>\n\
  <body>\n<p class= \"k\">我们有第一段文字</p>\n<p class= \"l\">这是第二段文字</p>\n<p class= \"\
  m\">正在处理第三段文字</p>\n</body>\n</html>\n```\n\n我们有第一段文字\n\n这是第二段文字\n\n正在处理第三段文字\n\n\
  ### 文本转换\n\n此 CSS 属性旨在指定特定文本中的小写和大写字母。您可以使用它将文本转换为小写和大写字母，或者将特定单词的首字母大写。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\np.ucase {\n  text-transform: uppercase;\n\
  }\np.lcase {\n  text-transform: lowercase;\n}\np.capital {\n  text-transform: capitalize;\n\
  }\n</style>\n</head>\n<body>\n<p class=\"ucase\">这段文本被转换为大写字母。</p>\n<p class=\"\
  lcase\">将其格式化为小写。</p>\n<p class=\"capital\">首字母大写在网页上总是看起来很好。</p>\n</body>\n</html>\n\
  ```\n\n这段文本被转换为大写。\n\n将其格式化为小写。\n\n首字母大写在网页上总是看起来很好。\n\n### 缩进\n\n如果设计需要，您也可以对文本进行缩进。`text-indent`\
  \ 属性指定文本第一行的缩进。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np {\n  text-indent:\
  \ 60px;\n}\n</style>\n</head>\n<body>\n<p>我写这段话是为了展示您如何在 CSS 编程中对段落进行缩进。缩进在 CSS\
  \ 中是关重要的，因为它让文本在网页上看起来很整洁。随着人们注意力时间的缩短，缩进让文本变得易读且亲眼。我希望您在设计的下一个网站上良好地使用这个属性。</p>\n\
  </body>\n</html>\n```\n\n我写这段话是为了展示您如何在 CSS 编程中对段落进行缩进。缩进在 CSS 中是关重要的，因为它让文本在网页上看起来很整洁。随着人们注意力时间的缩短，缩进让文本变得易读且亲眼。我希望您在设计的下一个网站上良好地使用这个属性。\n\
  \n### 字间距\n\n此 CSS 属性用于指定特定文本字符之间的某些间距。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\np.k {\n  letter-spacing: 5px;\n}\np.l {\n  letter-spacing: -1px;\n}\n</style>\n\
  </head>\n<body>\n<p class=\"k\">这段文字的字母之间有 5px 的间距</p>\n<p class=\"l\">是时候缩小间距了。负间距在设计中也是一个特性。它美化了文本的外观。进一步减少会让文本变得混乱。</p>\n\
  </body>\n</html>\n```\n\n这段文字的字母之间有 5px 的间距\n\n是时候缩小间距了。负间距在设计中也是一个特性。它美化了文本的外观。进一步减少会让文本变得混乱。\n\
  \n### 行高度\n\n`line-height` 属性可以设置行高来指定空间。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\nimg.topside {\n  vertical-align: top;\n}\nimg.middleside {\n  vertical-align:\
  \ middle;\n}\nimg.bottomside {\n  vertical-align: bottom;\n}\n</style>\n</head>\n\
  <body>\n<p>您的 <img src=\"logo.gif\" alt=\"kaz\" width=\"250\" height=\"50\"> 图片具有默认对齐方式。</p><br>\n\
  <p>您的 <img class=\"topside\" src=\"kaz.gif\" alt=\"kaz\" width=\"250\" height=\"\
  50\"> 图片将具有顶部对齐。</p><br>\n<p>您的 <img class=\"middleside\" src=\"logo.gif\" alt=\"\
  kaz\" width=\"250\" height=\"50\"> 图片具有中间级对齐。</p><br>\n<p>您的 <img class=\"bottomside\"\
  \ src=\"logo.gif\" alt=\"kaz\" width=\"250\" height=\"50\"> 图片具有底部对齐。</p>\n</body>\n\
  </html>\n```\n*(注：此处提供的原文文本似乎重复了前面的对齐部分内容，已按要求保持格式翻译)*\n\n此段具有 0.7 行高\n\n是时候缩小间距了。负间距在设计中也是一个特性。它美化了文本的外观。进一步减少会让文本变得混乱。\n\
  \n### 字间距\n\n`word-spacing` 属性 旨在指定特定文本中单词间的空间。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np.k {\n  word-spacing: 10px;\n}\np.l {\n  word-spacing: -7px;\n\
  }\n</style>\n</head>\n<body>\n<p class=\"k\">看到间距如何影响段落的设计。</p>\n<p class=\"l\"\
  >单词</p>\n</body>\n</html>\n```\n\n看到间距如何影响段落的设计。\n\n单词\n\n### 文本阴影\n\n您可以为文本创建阴影以为网页增添一点样式。`text-shadow`\
  \ 属性负责添加阴影。看看您如何使用该属性以及它的作用。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  p {\n  text-shadow: 1px 1px;\n}\n</style>\n</head>\n<body>\n<p>学习文本阴影属性！</p>\n</body>\n\
  </html>\n```\n\n学习文本阴影属性！\n\n通过以下方法为文本添加颜色。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\np {\n  text-shadow: 1px 1px 5px yellow;\n}\n</style>\n</head>\n\
  <body>\n<p>学习文本阴影属性！</p>\n</body>\n</html>\n```\n\n学习文本阴影属性！\n\n### CSS 字体\n\n为网站选择正确的字体是关重要的。如果您选择了错误的字体，就会破坏页面设计。正确的字体对使用您网站的读者的体验产生巨大影响。正确的字体为您的品牌创建强大的身份。字体样式应该只有一个目标，即易于阅读。与字体样式相结合的是文本的颜色和大小，这是重要的。\n\
  \n你有五种字体族。\n\n- 第一种字体族是衬字体。该家族以字母边缘的小笔画而闻名。它们营造出强大的优雅和正式感，您可能在销售广告中见过它。该家族包含了 Times\
  \ New Roman、Georgia 和 Garamond。\n\n- 第二种字体族是无衬线字体。它具有整洁的线条，字母没有小笔画。它们看起来更现代，营造出极简主义的气息。该字体族包含了\
  \ Verdana、Helvetica 和 Arial。\n\n- 第三种字体族被称为等宽字体。属于该家族的所有字母都具有固定宽度。它们营造出机械感。它包含了\
  \ Monaco、Courier New 和 Lucida Console。\n\n\n\n\n\n* 第四种字体族被称为 `cursive`。`cursive`\
  \ 字体以类似于手写而称，该字体族包含了 `Lucida Handwriting` 和 `Brush Script M7`。\n* 第五种字体族被称为 `fantasy`。这些字体粗体、趣味且装饰性强，该字体族包含了\
  \ `Copperplate` 和 `Papyrus`。\n\n在设计网站时，你可以使用 `font-family` 属性来决定网页上显示何种字体样式。`font-family`\
  \ 属性应该在回退系统中包含多个字体名称，以确保尽可能多的浏览器能够兼容你的网站。从你选择的字体开始，以属于通用族（generic family）的字体结束。如果浏览器没有找到你放在顶部的字体，它将从通用族中选择类似的字体。用逗号分隔它们即可，一切正常。对于多个单词的字体名称，使用引号将其括起来。\n\
  \n```html\n<!DOCTYPE html>\n<html\n<head>\n<style>\n.kaz1 {\n  font-family: \"Times\
  \ New Roman\", Times, serif;\n}\n.kaz2 {\n  font-family: Arial, Helvetica, sans-serif;\n\
  }\n.kaz3 {\n  font-family: \"Lucida Console\", \"Courier New\", monospace;\n}\n\
  </style>\n</head>\n<body>\n<h4>Learning CSS font-family</h4>\n<p class=\"kaz1\"\
  >我计划用 Times New Roman 字体显示此段落。</p>\n<p class=\"kaz2\">Arial 字体在可读性方面是最好的。</p>\n\
  <p class=\"kaz3\">Lucida Console 字体看起来像是手写的字。</p>\n</body>\n</html>\n```\n\n# 学习\
  \ CSS Font-Family\n\n我计划用 Times New Roman 字体显示此段落。\n\nArial 字体在可读性方面是最好的。\n\nLucida\
  \ Console 字体看起来像是手写的字。\n\n### CSS 字体样式\n\n另一个 CSS 属性 `font-style` 用于指定文本的样式。它主要用于将一段文本转换为斜体。该属性包含三个值。你可以保持文本为普通（normal）、斜体（italic）或将其转为倾斜（oblique）。`normal`\
  \ 值将文本变为普通，而 `italic` 值将文本转为斜体，就像你在 MS Word 中看到的那样。`oblique` 值将文本转为倾斜。`oblique`\
  \ 看起来像斜体，但它的支持程度没有 `italic`。因此，不要混淆 `oblique` 和 `italic`。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\n.kaz1 {\n  font-style: normal;\n}\n.kaz2 {\n \
  \ font-style: italic;\n}\n.kaz3 {\n  font-style: oblique;\n}\n</style>\n</head>\n\
  <body>\n<h4>Learning CSS font-style</h4>\n<p class=\"kaz1\">我计划用普通字体样式显示此段落。</p>\n\
  <p class=\"kaz2\">斜体字体在样式方面是最好的。</p>\n<p class=\"kaz3\">倾斜字体看起来非常像斜体。</p>\n</body>\n\
  </html>\n```\n\n# 学习 CSS Font-Style\n\n我计划用普通字体样式显示此段落。\n\n斜体字体在样式方面是最好的。\n\n倾斜字体看起来非常像斜体。\n\
  \n### Font-Weight 属性\n\n另一个属性 `font-weight` 决定字体样式的粗细。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\n.kaz1 {\n  font-weight: normal;\n}\n.kaz2 {\n  font-weight:\
  \ lighter;\n}\n.kaz3 {\n  font-weight: bold;\n}\n.kaz4 {\n  font-weight: 1000;\n\
  }\n</style>\n</head>\n<body>\n<h4>Learning CSS font-weight property</h4>\n<p class=\"\
  kaz1\">CSS 是最好的网页设计语言。</p>\n<p class=\"kaz2\">在学习 CSS 之前，你必须学习 HTML。</p>\n<p class=\"\
  kaz3\">你可以设计网页上的每个 HTML 元素，赋予它独特的外观。</p>\n<p class=\"kaz4\">字体决定了网站的成败，所以请仔细设计文本。</p>\n\
  </body>\n</html>\n```\n\n# 学习 CSS Font-Weight Property\n\nCSS 是最好的网页设计语言。\n\n在学习\
  \ CSS 之前，你必须学习 HTML。\n\n你可以设计网页上的每个 HTML 元素，赋予它独特的外观。\n\n字体决定了网站的成败，所以请仔细设计文本。\n\
  \n### Font-Variant 属性\n\nCSS 的 `font-variant` 属性用于指定文本的小大写字体。当你应用该属性时，所有小写字母将被转换为大写字母。尽管如此，转换后的字体比原始大写字母字体小。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.kaz1 {\n  font-variant: normal;\n\
  }\n.kaz2 {\n  font-variant: small-caps;\n}\n</style>\n</head>\n<body>\n<h4>Learning\
  \ CSS font-weight property</h4>\n<p class=\"kaz1\">CSS 是最好的网页设计语言。</p>\n<p class=\"\
  kaz2\">在学习 CSS 之前，你必须学习 HTML。</p>\n</body>\n</html>\n```\n\n\n\n\n\n优秀的字体是优秀设计中不可或缺的一部分。优秀的字体搭配相得益彰，这对于出色的网页设计至关重要。你应该确保字体组合之间相互和谐。字体族（superfamily）就像是一组协同工作的字体。使用来自同一字体族的字体可以确保网页的平滑显示。\n\
  \n相似的字体在一起会产生冲突。如果方法正确，对比会产生最佳的效果。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\n.kaz1 {\n  font-family: Verdana, sans-serif;\n  font-size: 60px;\n  color:\
  \ gray;\n}\n.kaz2 {\nfont-family: Georgia, serif;\n  font-size: 20px;\n  color:\
  \ red;\n}\n</style>\n</head>\n<body>\n<h4>学习 CSS font-size 属性</h4>\n<p class=\"\
  kaz1\">CSS 是最好的网页设计语言。</p>\n<p class=\"kaz2\">在你学习 CSS 之前，你必须学习 HTML。</p>\n</body>\n\
  </html>\n```\n\n# 学习 CSS font-size 属性\n\nCSS 是最好的网页设计语言。\n\n在学习学习 CSS 之前，你必须学习 HTML。\n\
  \n让我们来看另一组可行搭配。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.kaz1 {\n\
  \  font-family: Muli, serif;\n  font-size: 40px;\n  color: gray;\n}\n.kaz2 {\nfont-family:\
  \ 'Fjalla One', sans-serif;\n  font-size: 20px;\n  color: red;\n}\n</style>\n</head>\n\
  <body>\n<h4>学习 CSS font-size 属性</h4>\n<p class=\"kaz1\">CSS 是最好的网页设计语言。</p>\n<p\
  \ class=\"kaz2\">在学习学习 CSS 之前，你必须学习 HTML。</p>\n</body>\n</html>\n```\n\n# 学习 CSS\
  \ font-size 属性\n\nCSS 是最好的网页设计语言。\n\n在学习学习 CSS 之前，你必须学习 HTML。\n\n## 第六章\n\n## 列表、表格、显示\n\
  \n![](img/Image00001.jpg)\n\nHTML 有两种类型的列表。CSS 的列表属性允许你为有序列表和无序列表设置不同的标记。你也可以插入图像将其设置为标记。你可以为列表项和列表的背景添加颜色。\n\
  \n### CSS 列表\n\n让我们来看 CSS 属性 `list-style-type`，它指定了访问者在网页上看到的列表项类型。你可以使用多种类型来显示项目符号。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nul.k1 {\n  list-style-type:\
  \ square;\n}\nul.k2 {\n  list-style-type: circle;\n}\nol.k3 {\n  list-style-type:\
  \ upper-roman;\n}\nol.k4 {\n  list-style-type: lower-alpha;\n}\n</style>\n</head>\n\
  <body>\n<h4>学习列表属性</h4>\n<p>你看到一个无序列表的示例：</p>\n<ul class=\"k1\">\n  <li>marinda</li>\n\
  \  <li>seven up</li>\n  <li>pepsi</li>\n</ul>\n<ul class=\"k2\">\n  <li>avocado</li>\n\
  \  <li>dragon fruit</li>\n  <li>guava</li>\n</ul>\n<p>这是一个有序列表的示例：</p>\n<ol class=\"\
  k3\">\n  <li>strawberry</li>\n  <li>blueberry</li>\n  <li>raspberry</li>\n</ol>\n\
  <ol class=\"k4\">\n  <li>oranges</li>\n  <li>apples</li>\n  <li>cherries</li>\n\
  </ol>\n</body>\n</html>\n```\n\n# 学习列表属性\n\n你看到一个无序列表的示例：\n\n* marinda\n* seven\
  \ up\n* pepsi\n* avocado\n* dragon fruit\n* guava\n\n这是一个有序列表的示例：\n\n1. strawberry\n\
  2. blueberry\n3. raspberry\n1. oranges\n2. apples\n3. cherries\n\n### 添加颜色\n\n你可以用一系列颜色来装饰列表，使其看起来很有趣。你添加到\
  \ `<ul>` 或 `<ol>` 标签中的任何内容都会影响整个列表。然而，你添加到 `<li>` 标签的属性只会影响列表的单个项。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\nul.k1 {\n  background: #ff1122;\n  padding:\
  \ 20px;\n}\nul.k2 {\n  background: #dd9911;\n  padding: 20px;\n}\nol.k3 {\n  background:\
  \ #bbe9e09;\n  padding: 6px;\n  margin-left: 25px;\n}\nol.k4 {\n  background: #aab9ee;\n\
  \  margin: 4px;\n}\n</style>\n</head>\n<body>\n<h4>学习列表属性</h4>\n<p>你正在看到一个无序列表的示例：</p>\n\
  <ul class=\"k1\">\n  <li>marinda</li>\n  <li>seven up</li>\n  <li>psi</li>\n</ul>\n\
  <ul class=\"k2\">\n  <li>avocado</li>\n  <li>dragon fruit</li>\n  <li>guava</li>\n\
  </ul>\n<p>这是一个有序列表的示例：</p>\n<ol class=\"k3\">\n  <li>strawberry</li>\n  <li>blueberry</li>\n\
  \  <li>raspberry</li>\n</ol>\n<ol class=\"k4\">\n  <li>oranges</li>\n  <li>apples</li>\n\
  \  <li>cherries</li>\n</ol>\n</body>\n</html>\n```\n\n# 学习列表属性\n\n你看到一个无序列表的示例：\n\
  \n* marinda\n* seven up\n* pepsi\n* avocado\n* dragon fruit\n* guava\n\n这是一个有序列表的示例：\n\
  \n1. strawberry\n2. blueberry\n3. raspberry\n1. oranges\n2. apples\n3. cherries\n\
  \n### CSS 表格\n\n你可以借助 CSS 改变 HTML 表格的外观。它们将看起来非常精美、格式良好。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\n#listofcustomers {\n  font-family: Helvetica, Arial, sans-serif;\n\
  \  border-collapse: collapse;\n  width: 75%;\n}\n#listofcustomers td, #listofcustomers\
  \ th {\n  border: 2px solid #aaa;\n  padding: 6px;\n}\n#listofcustomers tr:nth-child(even){background-color:\
  \ #e22e2;}\n#listofcustomers tr:hover {background-color: #ddd;}\n#listofcustomers\
  \ th {\n  padding-top: 15px;\n  padding-bottom: 15px;\n  text-align: left;\n  background-color:\
  \ #4D90;\n  color: grey;\n}\n</style>\n</head>\n<body>\n<table id=\"customers\"\
  >\n  <tr>\n    <th>Name of Customers</th>\n    <th>Color Allotted</th>\n    <th>Name\
  \ of Country</th>\n  </tr>\n  <tr>\n    <td>Alfredo</td>\n    <td>Red</td>\n   \
  \ <td>Ireland</td>\n  </tr>\n  <tr>\n    <td>Jasmine Buckky</td>\n    <td>Green</td>\n\
