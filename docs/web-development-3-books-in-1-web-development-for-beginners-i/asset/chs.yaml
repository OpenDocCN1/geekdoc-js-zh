  \nV\no\nl\nk\ns\nw\na\ng\ne\nn\n，\nV\ne\nz\ne\nl\n，\nF\no\nr\n\n## 死循环\n\n当你创建一个循环且没有终点时，它被称为死循环。循环会一直持续，直到计算机或浏览器崩溃。\n\
  \n### while 循环\n\n当你创建一个循环且没有终点时，它被称为死循环。循环会一直持续，直到计算机或浏览器崩溃。\n\n在你学习了 `for` 循环后，我将解释\
  \ `while` 循环如何工作。`while` 循环只要条件为真就会执行。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>While 循环</p>\n<p id=\"demo7\"></p>\n<script>\nvar msg = \"\";\nvar YY = 0;\n\
  while (YY < 10) {\n  msg += \"<br>The digit is \" + YY;\n  YY++;\n}\ndocument.>(\"\
  demo7\").innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\n0\n1\n2\n3\n4\n5\n\
  \n## do/while 循环\n\n`do/while` 循环被认为是 `while` 循环的一种变体。它在测试条件之前执行代码。`do/while` 与其他循环的区别在于即使你设置条件为假它也会执行一次。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这是 JavaScript Do/While 循环</p>\n<p\
  \ id=\"demo8\"></p>\n<script>\nvar msg = \"\";\nvar YY = 0;\ndo {\n  msg += \"<br>The\
  \ digit is \" + YY;\n  YY++;\n}\nwhile (YY < 5);\ndocument.getElementById(\"demo8\"\
  ).innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\n0\n1\n2\n3\n4\n\n如果你对 `for`\
  \ 和 `while` 循环进行比较，你会发现这两个循环非常相似。`while` 循环与 `for` 循环非常相似。然而，唯一的区别是这里省略了第一和第三语句。我将使用相同的示例并测试\
  \ `for` 和 `while` 循环，看看它们之间有多大差异。在第一部分，我将使用 `for` 循环。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p id=\"demo9\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"\
  Fortuner\", \"Land Cruiser\", \"Jimmy\"];\nvar YY = 0;\nvar msg = \"\";\nfor (;carsforsale[YY];)\
  \ {\n  msg += carsforsale[YY] + \"<br>\";\n  YY++;\n}\ndocument.getElementById(\"\
  demo9\").innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\nVezel\nFortuner\n\
  Land Cruiser\nJimmy\n\n在接下来的内容中，我将使用 `while` 循环收集待售车辆的名称，然后在浏览器中整齐地显示它们。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p id=\"demo9\"></p>\n<script>\nvar carsforsale\
  \ = [\"Vezel\", \"Fortuner\", \"Land Cruiser\", \"Jimmy\"];\nvar YY = 0;\nvar msg\
  \ = \"\";\nwhile (carsforsale[YY]) {\n  msg += carsforsale[YY] + \"<br>\";\n  YY++;\n\
  }\ndocument.getElementById(\"demo9\").innerHTML = msg;\n</script>\n</body>\n</html>\n\
  ```\n\nVezel\nFortuner\nLand Cruiser\nJimmy\n\nJavaScript Break 和 Continue 语句\n\n\
  \n\n\n\n`break` 和 `continue` 语句本质上与 `for` 和 `while` 循环相关。`break` 语句允许你跳出循环，而 `continue`\
  \ 语句则让你跳过循环内部某次特定的迭代。后者并不会中断循环，程序会继续运行。在之前的章节中讨论 `switch` 语句时，我已经解释过 `break` 语句。然而，那里的用途不同，因为它是应用于\
  \ `switch` 语句的。现在我将在循环中使用 `break` 语句。\n\n# 学习 JavaScript 循环\n\n我将在 `for` 循环中集成一个\
  \ `break` 语句。\n\n```javascript\nvar msg = \"\";\nvar YY;\nfor (YY = 0; YY < 10;\
  \ YY++) {\n  if (YY === 5) { break; }\n  msg += \"The next digit is \" + YY +\"\
  <br>\";\n}\ndocument.getElementById(\"demo9\").innerHTML = msg;\n```\n\n下一个数字是 0\n\
  下一个数字是 1\n下一个数字是 2\n下一个数字是 3\n下一个数字是 4\n\n循环本应完成 10 个数字的迭代，但由于我在位置 5 添加了 `break`\
  \ 语句，循环跳出了迭代，程序停止了。`continue` 语句不能被认为是 `break` 语句的相反面，因为和 `break` 语句一样，它也会中断循环，但随后继续执行程序的剩余迭代。我将使用相同的示例来详细说明你如何从\
  \ `continue` 语句中受益。\n\n```javascript\nvar msg = \"\";\nvar YY;\nfor (YY = 0; YY\
  \ < 10; YY++) {\n  if (YY === 5) { continue; }\n  msg += \"The next digit is \"\
  \ + YY + \"<br>\";\n}\ndocument.getElementById(\"demo9\").innerHTML = msg;\n```\n\
  \n下一个数字是 0\n下一个数字是 1\n下一个数字是 2\n下一个数字是 3\n下一个数字是 4\n下一个数字是 6\n下一个数字是 7\n下一个数字是 8\n\
  下一个数字是 9\n\n循环在点 5 中断并继续。你可以看到结果中缺失的数字是 5。`continue` 语句适用于跳过循环的某次迭代。`break` 语句只有一个目的：让你跳出\
  \ `switch` 或循环。你可以使用 `break` 语句跳出代码块。\n\n## 第七章\n\n## JavaScript 函数\n\n![](img/Image00001.jpg)\n\
  \n到目前为止，我们创建了在浏览器加载网页加载时立即运行的脚本。还有另一种使用代码的方法。你可以将代码封装在一个函数内并在浏览器中运行它。除非你进行函数调用，否则你不会在浏览器中看到任何操作。一个函数短语包含\
  \ `function` 关键字、函数名和大括号。\n\n你必须在 `function` 关键字后面包含一个空格。之后，你需要写下你选择给函数起的名称。这些与变量命名的习惯非常相似。然而，函数命名的唯一区别在于，你可以在函数名中添加数字、字母、`$`\
  \ 或下划线。之后，你需要添加一组圆括号来包含任何参数。之后，你需要放入大括号来编写代码。你不需要将函数写在多行上。如果你习惯的话，可以把它们写在单行上。但是，在开始时最好写在多行上，这样你就能清楚地了解它是如何写的。此外，如果代码运行不良好，你可以轻松地纠正任何错误。\n\
  \n创建 JavaScript 函数是为了执行特定的任务。当你进行函数调用时，你就可以执行它。\n\n```javascript\nfunction FunctionZZ(x1,\
  \ x2) {\n  return x1 * x2;\n}\ndocument.getElementById(\"demo890\").innerHTML =\
  \ FunctionZZ(345, 1222);\n```\n\n# 学习 JavaScript 函数\n\n在这个示例中，我将调用一个函数来执行计算并返回结果：\n\
