  ### 设置字体大小\n\n`size` 属性用于设置字体大小。接受的值范围从 1 直到 7，但默认值是 3。\n\n这是一个示例：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n  <head>\n      <title>设置字体大小</title>\n  </head>\n  <body>\n\
  \      <font size = \"1\">字体大小 = \"1\"</font><br />\n      <font size = \"2\">字体大小\
  \ = \"2\"</font><br />\n      <font size = \"3\">字体大小 = \"3\"</font><br />\n   \
  \   <font size = \"4\">字体大小 = \"4\"</font><br />\n      <font size = \"5\">字体大小\
  \ = \"5\"</font><br />\n      <font size = \"6\">字体大小 = \"6\"</font><br />\n   \
  \   <font size = \"7\">字体大小 = \"7\"</font>\n  </body>\n</html>\n```\n\n输出将是：\n字体大小\
  \ = \"1\"\n字体大小 = \"2\"\n字体大小 = \"3\"\n字体大小 = \"4\"\n字体大小 = \"5\"\n字体大小 = \"6\"\n\
  字体大小 = \"7\"\n\n#### 相对字体大小\n\n也可以指定比你预设大小更大或更小的字号数。语法为：\n\n`<font size = \"+n\"\
  >`\n\n或者\n\n`<font size = \"−n\">`\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n      <title>相对字体大小</title>\n  </head>\n  <body>\n      <font size =\
  \ \"-1\">字体大小 = \"-1\"</font><br />\n      <font size = \"+1\">字体大小 = \"+1\"</font><br\
  \ />\n      <font size = \"+2\">字体大小 = \"+2\"</font><br />\n      <font size = \"\
  +3\">字体大小 = \"+3\"</font><br />\n      <font size = \"+4\">字体大小 = \"+4\"</font>\n\
  \  </body>\n</html>\n```\n\n输出将是：\n字体大小 = \"-1\"\n字体大小 = \"+1\"\n字体大小 = \"+2\"\n\
  字体大小 = \"+3\"\n字体大小 = \"+4\"\n\n#### 设置字体字体\n\n`face` 属性用于设置字体，但你需要注意其中一点 – 如果网站用户没有安装这种特定的字体，他们就无法看到。相反，他们将看到适用于他们的系统的默认字体。\n\
  \n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n      <title>字体名称</title>\n\
  \  </head>\n  <body>\n      <font face = \"Times Roman\" size = \"5\">Times Roman</font><br\
  \ />\n      <font face = \"Verdana\" size = \"5\">Verdana</font><br />\n      <font\
  \ face = \"Comic MS\" size =\"5\">Comic Sans MS</font><br />\n      <font face =\
  \ \"WildWest\" size = \"5\">WildWest</font><br />\n      <font face = \"Bedrock\"\
