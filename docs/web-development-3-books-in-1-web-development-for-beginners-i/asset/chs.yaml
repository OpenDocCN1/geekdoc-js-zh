  这是 CSS，你正在创建一个网页。\n\n### 图片对齐\n\n你可以添加图片并根据你的意愿在页面上对其齐。查看以下代码。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\nimg {\n  display: block;\n  margin-left: auto;\n\
  \  margin-right: auto;\n}\n</style>\n</head>\n<body>\n<img src=\"mango.jpg\" alt=\"\
  芒果\" style=\"width:60%\">\n</body>\n</html>\n```\n\n### 左齐与右对齐\n\n你可以使用 CSS 设置右对齐或左对齐，将\
  \ HTML 元素放置在正确的位置。\n\n```css\n.leftalignment {\n  position: absolute;\n  left: 0px;\n\
  \  width: 250px;\n  border: 2px solid black;\n  padding: 15px;\n}\n```\n\n浮动对齐\n\
  \n\n\n\n\n你可以使用另一种方法，即 `float`，来设置右对齐或左对齐。`float` 属性更加平滑，并且可以实现紧凑对齐。让我们来看 `float`\
  \ 属性的演示。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.rightalign {\n \
  \ float: left;\n  width: 250px;\n  border: 2px solid black;\n  padding: 10px;\n\
  }\n</style>\n</head>\n<body>\n<h4>网页上对齐的元素</h4>\n<div class=\"rightalignment\">\n\
  <p>我正在使用 float 属性来在网页上设置对齐。</p>\n</div>\n</body>\n</html>\n```\n\n# 网页上对齐的元素\n\n\
  我正在使用 float 属性来在网页上设置对齐。\n\n# 第八章\n\n## CSS 组合器\n\n![](img/Image00001.jpg)\n\nCSS\
  \ 组合器解释了不同选择器之间的关系 - CSS 选择器可能包含不仅仅是简单的选择器。选择器有不同的类型。本章将解释这些选择器如何工作，以及组合器如何形成并分析它们之间的关系。\n\
  \n### 后代选择器\n\n后代选择器倾向于匹配从某个元素后代的元素。下一个示例将帮助你选择 `<p>` 和 `<div>` 元素。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv p {\n  background-color: skyblue;\n\
  }\n</style>\n</head>\n<body>\n<h4>这是后代选择器</h4>\n<p>这个后代选择器将匹配从某个特定元素后代的元素。</p>\n\
  <div>\n  <p>这是第一行。</p>\n  <p>这是第二行。</p>\n  <section><p>这是 div 的第三行也是最后一行。</p></section>\n\
  </div>\n<p>这一行在 div 之外。</p>\n<p>这一行在 div 之外。</p>\n</body>\n</html>\n```\n\n这是后代选择器\n\
  \n这个后代选择器将匹配从某个特定元素后代的元素。\n\n这是第一行。\n这是第二行。\n这是 div 的第三行也是最后一行。\n这一行在 div 之外。\n\
  这一行在 div 之外。\n\n### 子选择器\n\n第二类型是子选择器。它将选择拥有一个特定元素的元素。在下面的示例中，我将选择父选择器的子元素。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv > p {\n  background-color:\
  \ skyblue;\n}\n</style>\n</head>\n<body>\n<h4>这是子选择器</h4>\n<p>这个子选择器 (>) 应该连接到所有属于特定元素的元素。</p>\n\
  <div>\n  <p>这一行在 div 内部。</p>\n  <p>这一行在 div 内部。</p>\n  <section><p>这一行在 div 内部。</p></section>\n\
  \  <p>这一行也在 div 内部。</p>\n</div>\n<p>这一行在 div 之外。</p>\n<p>这一行在 div 之外。</p>\n</body>\n\
  </html>\n```\n\n这是子选择器\n\n这个子选择器 (`>`) 应该连接到所有属于特定元素的元素。\n\n这一行在 div 内部。\n这一行在 div\
  \ 内部。\n这一行在 div 内部。\n这一行也在 div 内部。\n这一行在 div 之外。\n这一行在 div 之外。\n\n### 相邻兄弟选择器\n\n\
  第三类型被称为相邻兄弟选择器。它用于选择某个元素之后的元素。兄弟元素拥有同一个父元素。我将在示例中展示相邻元素。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\ndiv + p {\n  background-color: skyblue;\n}\n</style>\n\
  </head>\n<body>\n<h4>这是相邻兄弟选择器</h4>\n相邻兄弟选择器 (+) 选择某个特定元素之后的元素。\n类型是相邻兄弟选择器。\n<div>\n\
  <p>这一行在 div 之后。</p>\n<p>这一行在 div 之后。</p>\n</div>\n<p>在 div 在 div 之后。</p>\n<p>这一行在\
  \ div 之后。</p>\n</body>\n</html>\n```\n\n这是相邻兄弟选择器\n\n相邻兄弟选择器 (`+`) 选择某个特定元素之后的元素。\n\
  \n这一行在 div 之后。\n这一行在 div 之后。\n这一行在 div 之后。\n这一行在 div 之后。\n这一行在 div 之后。\n这一行在 div\
  \ 之后。\n\n### 通用兄弟选择器\n\n最后类型是通用兄弟选择器。它将选择某个特定元素的兄弟元素。`~` 运算符用于此目的。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv ~ p {\n  background-color: skyblue;\n\
  }\n</style>\n</head>\n<body>\n<h4>这是通用兄弟选择器</h4>\n通用兄弟选择器 (~) 选择某个特定元素的兄弟元素。\n<div>\n\
  <p>这一行在 div 之后。</p>\n</div>\n<p>这一行在 div 之后。</p>\n<p>这一行在 div 之后。</p>\n</body>\n\
  </html>\n```\n\n\n\n\n\n`list-style-type` 特性可以移除导航栏中的项目符号。这段代码是创建水平和垂直导航栏的标准。\n\n\
  ### 垂直条形\n\n当你想要构建一个垂直导航栏时，可以在列表中使用 `<a>` 元素。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<style>\nul {\n  list-style-type: none;\n  margin: 0;\n  padding: 0;\n}\n\
  li a {\n  display: block;\n  width: 80px;\n  background-color: skyblue;\n}\n</style>\n\
  <ul>\n  <li><a href=\"#homepage\">首页</a></li>\n  <li><a href=\"#newspage\">新闻角</a></li>\n\
  \  <li><a href=\"#contactpage\">联系电话</a></li>\n  <li><a href=\"#aboutpage\">关于我们</a></li>\n\
  </ul>\n<p>我使用 `href=\"#\"` 只是为了测试链接。当你构建一个真实的网站时，应该使用 URL。</p>\n</body>\n</html>\n\
  ```\n\n[首页](https://tools.tutorialspoint.com/uploads/c3c6d6e1a2ecfe5a1314367f6bd9e220-6848/index.htm#homepage)\n\
  [新闻角](https://tools.tutorialspoint.com/uploads/c3c6d6e1a2ecfe5a1314367f6bd9e220-6848/index.htm#newspage)\n\
  [联系电话](https://tools.tutorialspoint.com/uploads/c3c6d6e1a2ecfe5a1314367f6bd9e220-6848/index.htm#contactpage)\n\
  [关于我们](https://tools.tutorialspoint.com/uploads/c3c6d6e1a2ecfe5a1314367f6bd9e220-6848/index.htm#aboutpage)\n\
  \n我使用 `href=\"#\"` 只是为了测试链接。当你构建一个真实的网站时，应该使用 URL。\n\n当你将链接显示为块级元素时，将使链接区域变得完全可点击，而不仅仅是文本。它还允许你指定宽度、边距、高度和内边距。块元素默认将占据可用的全部宽度。宽度可以随时移除。结果是当你以块元素的形式显示它们时，元素将覆盖可用宽度。这应该产生与上一个示例相同的结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<style>\nul {\n  list-style-type: none;\n\
  \  margin: 0;\n  padding: 0;\n}\nli a {\n  display: block;\n  background-color:\
  \ skyblue;\n}\n</style>\n<ul>\n  <li><a href=\"#homepage\">首页</a></li>\n  <li><a\
  \ href=\"#newspage\">新闻角</a></li>\n  <li><a href=\"#contactpage\">联系电话</a></li>\n\
  \  <li><a href=\"#aboutpage\">关于我们</a></li>\n</ul>\n<p>我使用 `href=\"#\"` 只是为了测试链接。当你构建一个真实的网站时，应该使用\
  \ URL。</p>\n</body>\n</html>\n```\n\n你可以在浏览器中查看输出。条形的元素将覆盖整个宽度。垂直导航栏中的一个惊人特性是当用户悬停在元素上时颜色的变化。在下面的示例中，我将创建一个在鼠标移动到其上方时改变颜色的导航栏。我添加了一些颜色。背景是白色的。当你将鼠标悬停在条形上时，它将变成红色。你可以测试颜色组合以产生你想要的结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<style>\nul {\n  list-style-type: none;\n\
  \  margin: 0;\n  padding: 0;\n  width: 250px;\n  background-color: grey;\n}\nli\
  \ a {\n  display: block;\n  color: skyblue;\n  padding: 6px 14px;\n  text-decoration:\
  \ none;\n}\n/* 以下几行代码将在悬停时改变链接的颜色 */\nli a:hover {\n  background-color: red;\n \
  \ color: white;\n}\n</style>\n<ul>\n  <li><a href=\"#homepage\">首页</a></li>\n  <li><a\
  \ href=\"#newspage\">新闻角</a></li>\n  <li><a href=\"#contactpage\">联系电话</a></li>\n\
  \  <li><a href=\"#aboutpage\">关于我们</a></li>\n</ul>\n<p>我使用 `href=\"#\"` 只是为了测试链接。当你构建一个真实的网站时，应该使用\
  \ URL。</p>\n</body>\n</html>\n```\n\n[首页](https://tools.tutorialspoint.com/uploads/bca82606122f153822b2fcd5ef-17746/index.htm#homepage)\n\
  [新闻角](https://tools.tutorialspoint.com/uploads/bca82606122f153822b2fcd5ef-17746/index.htm#newspage)\n\
  [联系电话](https://tools.tutorialspoint.com/uploads/bca82606122f153822b2fcd5ef-17746/index.htm#contactpage)\n\
  [关于我们](https://tools.tutorialspoint.com/uploads/bca82606122f153822b2fcd5ef-17746/index.htm#aboutpage)\n\
  \n### Active 类\n\n你可以为代码添加 `active` 类，让用户知道他们处于哪个页面。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<style>\nul {\n  list-style-type: none;\n  margin: 0;\n  padding:\
  \ 0;\n  width: 250px;\n  background-color: grey;\n}\nli a {\n  display: block;\n\
  \  color: skyblue;\n  padding: 6px 14px;\n  text-decoration: none;\n}\n/* 以下几行代码将在悬停时改变链接的颜色\
  \ */\nli a:hover {\n  background-color: red;\n  color: white;\n}\n</style>\n<ul>\n\
  \  <li><a href=\"#homepage\" class=\"active\">首页</a></li>\n  <li><a href=\"#newspage\"\
  >新闻角</a></li>\n  <li><a href=\"#contactpage\">联系电话</a></li>\n  <li><a href=\"#aboutpage\"\
  >关于我们</a></li>\n</ul>\n</body>\n</html>\n```\n\n### 添加边框\n\n你可以通过添加边框来进一步装饰导航栏。你也可以将其放置在\
  \ `ul` 标签内部。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody {\n  margin:\
  \ 0;\n}\nul {\n  list-style-type: none;\n  margin: 0;\n  padding: 0;\n  width: 20%;\n\
  \  background-color: #f1f1f1;\n  position: fixed;\n  height: 110%;\n  overflow:\
  \ auto;\n}\nli a {\n  display: block;\n  color: grey;\n  padding: 6px 14px;\n  text-decoration:\
  \ none;\n}\nli a.activeclass {\n  background-color: skyblue;\n  color: white;\n\
  }\nli a:hover:not(.activeclass) {\n  background-color: lightgrey;\n  color: white;\n\
  }\n</style>\n</head>\n<body>\n<ul>\n```\n\n### 固定导航栏\n\n为了给你的网站增加风味，你可以创建一个固定的导航栏。导航栏将是全长度的，并且也是固定的。每当用户向下或向上滚动时，条形将固定在页面侧边。注意，你应该在进行彻底客户研究后使用它，因为某些用户可能会觉得它很人。在使用之前进行测试是必要的。无论用户是否喜欢，你都应该知道如何创建。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody {\n  margin: 0;\n}\nul\
  \ {\n  list-style-type: none;\n  margin: 0;\n  padding: 0;\n  width: 20%;\n  background-color:\
  \ #f1f1f1;\n  position: fixed;\n  height: 110%;\n  overflow: auto;\n}\nli a {\n\
  \  display: block;\n  color: grey;\n  padding: 6px 14px;\n  text-decoration: none;\n\
  }\nli a.activeclass {\n  background-color: skyblue;\n  color: white;\n}\nli a:hover:not(.activeclass)\
  \ {\n  background-color: lightgrey;\n  color: white;\n}\n</style>\n</head>\n<body>\n\
  <ul>\n```\n\n\n` 标签中似乎不完整（在 HTML 代码部分被截断了），我根据您提供的上下文和 Markdown 规范，为您翻译了已提供的文本部分。\n\
  \n以下是翻译后的内容：\n\n[content]\n\n```html\n<ul>\n  <li><a class=\"activeclass\" href=\"\
  #home\">首页</a></li>\n  <li><a href=\"#news\">新闻角</a></li>\n  <li><a href=\"#contact\"\
  >联系方式</a></li>\n  <li><a href=\"#about\">关于我们</a></li>\n</ul>\n\n<div style=\"margin-left:20%;padding:2px\
  \ 14px;height:900px;\">\n  <p>这是一个全高侧边导航栏</p>\n  <p>当你向下滚动此区域时，你会发现侧边导航栏将固定在网页上</p>\n\
  \  <p>在这里放置一些文本，以便你可以向下滚动网页。文本不足将导致你无法向下滚动，从而永远无法测试固定条的效果。</p>\n  <p>在这里放置一些文本...</p>\n\
  \  <p>在这里放置一些文本...</p>\n  <p>在这里放置一些文本...</p>\n</div>\n```\n\n## 水平导航栏\n\n另一种类型的导航栏是水平条。你可以创建一个浮动条或内联列表在网页上列出不同的项目。\n\
  \n### 内联 (Inline)\n在此类编码中，你必须将 `<li>` 元素指定为内联（inline）。这会为网页上的标准代码增加额外的的层层。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\nul {\n  list-style-type: none;\n  margin:\
  \ 1px;\n  padding: 1px;\n}\nli {\n  display: inline;\n}\n</style>\n</head>\n<body>\n\
  <ul>\n  <li><a href=\"#home\">首页</a></li>\n  <li><a href=\"#news\">新闻角</a></li>\n\
  \  <li><a href=\"#contact\">联系方式</a></li>\n  <li><a href=\"#about\">关于我们</a></li>\n\
  </ul>\n</body>\n</html>\n```\n\n[首页](https://tools.tutorialspoint.com/uploads/8e9e9cf630781eaccd24c665da21eb62-17833/index.htm#home)\
  \ [新闻角](https://tools.tutorialspoint.com/uploads/8e9e9cf630781eaccd24c665da21eb62-17833/index.htm#news)\
  \ [联系方式](https://tools.tutorialspoint.com/uploads/8e9e9cf630781eaccd24c665da21eb62-17833/index.htm#contact)\
  \ [关于我们](https://tools.tutorialspoint.com/uploads/8e9e9cf630781eaccd24c665da21eb62-17833/index.htm#about)\n\
  \n`<li>` 元素默认是块级元素（block elements）。你可以在列表的每个项目前后添加换行符，以便在网页上单行显示。\n\n### 浮动 (Floats)\n\
  如果你想创建浮动的列表项，你必须首先指定网页上所有导航链接的布局。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <style>\nul {\n  list-style-type: none;\n  margin: 1px;\n  padding: 1px;\n  overflow:\
  \ hidden;\n}\nli {\n  float: left;\n}\nli a {\n  display: block;\n  padding: 10px;\n\
  \  background-color: skyblue;\n}\n</style>\n</head>\n<body>\n<ul>\n  <li><a href=\"\
  #home\">首页</a></li>\n  <li><a href=\"#news\">新闻角</a></li>\n  <li><a href=\"#contact\"\
  >联系方式</a></li>\n  <li><a href=\"#about\">关于我们</a></li>\n</ul>\n</body>\n</html>\n\
  ```\n\n[首页](https://tools.tutorialspoint.com/uploads/6132f110d3e0be92c3c426b5a0a9d5ce-17814/index.htm#home)\
  \ [新闻角](https://tools.tutorialspoint.com/uploads/6132f110d3e0be92c3c426b5a0a9d5ce-17814/index.htm#news)\
  \ [联系方式](https://tools.tutorialspoint.com/uploads/6132f110d3e0be92c3c426b5a0a9d5ce-17814/index.htm#contact)\
  \ [关于我们](https://tools.tutorialspoint.com/uploads/6132f110d3e0be92c3c426b5a0a9d5ce-17814/index.htm#about)\n\
  \n`float: left` 属性会将块级元素设置在页面相邻位置。`display: block` 允许你精确控制类似内边距、高度和宽度。由于块级元素占用总宽度，它们无法并排浮动。某些内边距为条增添了美感。\n\
  \n### 精华水平条 (Glamor Horizontal Bars)\n你可以更改代码让水平导航看起来更精致。在这个示例中，我将解释如何创建一个带有背景颜色的水平导航栏，以及当悬停在导航链接上时颜色如何变化。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nul {\n  list-style-type: none;\n\
  \  margin: 1px;\n  padding: 1px;\n  overflow: hidden;\n  background-color: lightgrey;\n\
  }\nli {\n  float: left;\n}\nli a {\n  display: block;\n  color: green;\n  text-align:\
  \ center;\n  padding: 12px 14px;\n  text-decoration: none;\n}\nli a:hover {\n  background-color:\
  \ yellow;\n}\n</style>\n</head>\n<body>\n<ul>\n  <li><a href=\"#home\">首页</a></li>\n\
  \  <li><a href=\"#news\">新闻角</a></li>\n  <li><a href=\"#contact\">联系方式</a></li>\n\
  \  <li><a href=\"#about\">关于我们</a></li>\n</ul>\n</body>\n</html>\n```\n\n[首页](https://tools.tutorialspoint.com/uploads/b41caa5d3b4ba4587f16d685723637/index.htm#home)\
  \ [新闻角](https://tools.tutorialspoint.com/uploads/b41caa5d3b4ba4587f16d685723637/index.htm#news)\
  \ [联系方式](https://tools.tutorialspoint.com/uploads/b41caa5d3b4ba4587f16d685723637/index.htm#contact)\
  \ [关于我们](https://tools.tutorialspoint.com/uploads/b41caa5d3b4ba4587f16d685723637/index.htm#about)\n\
  \n### 激活链接 (Active Links)\n我们可以通过包含 `activeclass` 为导航条添加更多代码，告诉用户他们正在浏览哪个页面。我将设置一个激活链接将使用的颜色。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nul {\n  list-style-type: none;\n\
  \  margin: 1px;\n  padding: 1px;\n  overflow: hidden;\n  background-color: lightgrey;\n\
  }\nli {\n  float: left;\n}\nli a {\n  display: block;\n  color: green;\n  text-align:\
  \ center;\n  padding: 12px 14px;\n  text-decoration: none;\n}\nli a:hover {\n  background-color:\
  \ yellow;\n}\n.activeclass {\n  background-color: skyblue;\n}\n</style>\n</head>\n\
  <body>\n<ul>\n  <li><a class=\"activeclass\" href=\"#home\">首页</a></li>\n  <li><a\
  \ href=\"#news\">新闻角</a></li>\n  <li><a href=\"#contact\">联系方式</a></li>\n  <li><a\
  \ href=\"#about\">关于我们</a></li>\n</ul>\n</body>\n</html>\n```\n\n[首页](https://tools.tutorialspoint.com/uploads/b3161d39cd61a9e7a13eb422b84392-12402/index.htm#home)\
  \ [新闻角](https://tools.tutorialspoint.com/uploads/b3161d39cd61a9e7a13eb422b84392-12402/index.htm#news)\
  \ [联系方式](https://tools.tutorialspoint.com/uploads/b3161d39cd61a9e7a13eb422b84392-12402/index.htm#contact)\
  \ [关于我们](https://tools.tutorialspoint.com/uploads/b3161d39cd61a9e7a13eb422b84392-12402/index.htm#about)\n\
  \n激活链接将具有天蓝色，稍后你可以激活链接的颜色。激活链接让你的代码更具互动性和精致。\n\n### 右对齐 (Right Alignment)\n你可以创建一个代码将某些导航栏元素浮动到页面的右侧。有时你需要让像“联系方式”或“关于我们”这样的元素与其它元素分开。这就是右对齐功能大有帮助的地方。\n\
  \n\n\n\n\n以下示例包含了创建一个固定在网页底部或顶部的水平导航栏的代码。即使使用户向下滚动页面，该栏目也会固定在原位置。当您创建固定位置导航栏时，应该确保将导航栏的宽度保持到最小，以免它覆盖页面的部分内容。宽大的固定水平条会令人困扰，因为它们有时会阻挡页面的完整视图。用户会发现很难阅读内容或在网页上移动其他元素。因此，最好对其进行测试。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody {margin:1px;}\nul {\n\
  \  list-style-type: none;\n  margin: 1px;\n  padding: 1px;\n  overflow: hidden;\n\
  \  background-color: lightgrey;\n  position: fixed;\n  top: 1px;\n  width: 150%;\n\
