  \n## HTML 字体\n\n除了颜色和背景图片外，字体在确保你的网站用户友好且内容可读方面也起着重要作用。你所使用的字体样式和颜色完全取决于查看网站时使用的浏览器和硬件，但\
  \ `<font>` 标签可以帮助我们为网站文本添加样式、颜色和大小。`<basefont>` 标签用于当你希望所有文本设置为相同的大小、颜色和字体时。\n\n\
  `<font>` 标签有三个可能的属性 – `size`、`face` 和 `color`。如果你想在任何时候更改这些属性的任何一个，只需要使用 `<font>`。在\
  \ `<font>` 标签关闭之前，后续的文本将保持更改状态。你可以使用一个 `<font>` 标签来更改一个或所有属性。\n\n### 设置字体大小\n\n\
  `size` 属性用于设置字体大小。接受的值范围从 1 直到 7，但默认值是 3。\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n  <head>\n      <title>设置字体大小</title>\n  </head>\n  <body>\n      <font\
  \ size = \"1\">字体大小 = \"1\"</font><br />\n      <font size = \"2\">字体大小 = \"2\"\
  </font><br />\n      <font size = \"3\">字体大小 = \"3\"</font><br />\n      <font size\
  \ = \"4\">字体大小 = \"4\"</font><br />\n      <font size = \"5\">字体大小 = \"5\"</font><br\
  \ />\n      <font size = \"6\">字体大小 = \"6\"</font><br />\n      <font size = \"\
  7\">字体大小 = \"7\"</font>\n  </body>\n</html>\n```\n\n输出将是：\n字体大小 = \"1\"\n字体大小 =\
  \ \"2\"\n字体大小 = \"3\"\n字体大小 = \"4\"\n字体大小 = \"5\"\n字体大小 = \"6\"\n字体大小 = \"7\"\n\n\
  #### 相对字体大小\n\n也可以指定比你预设大小更大或更小的字号数。语法为：\n\n`<font size = \"+n\">`\n\n或者\n\n`<font\
  \ size = \"−n\">`\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n   \
  \   <title>相对字体大小</title>\n  </head>\n  <body>\n      <font size = \"-1\">字体大小 =\
  \ \"-1\"</font><br />\n      <font size = \"+1\">字体大小 = \"+1\"</font><br />\n  \
  \    <font size = \"+2\">字体大小 = \"+2\"</font><br />\n      <font size = \"+3\">字体大小\
  \ = \"+3\"</font><br />\n      <font size = \"+4\">字体大小 = \"+4\"</font>\n  </body>\n\
  </html>\n```\n\n输出将是：\n字体大小 = \"-1\"\n字体大小 = \"+1\"\n字体大小 = \"+2\"\n字体大小 = \"+3\"\
  \n字体大小 = \"+4\"\n\n#### 设置字体字体\n\n`face` 属性用于设置字体名称，但你需要注意其中一点 – 如果网站用户没有安装这种特定的字体，他们就无法看到。相反，他们将看到适用于他们的系统的默认字体。\n\
  \n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n      <title>字体名称</title>\n\
  \  </head>\n  <body>\n      <font face = \"Times Roman\" size = \"5\">Times Roman</font><br\
  \ />\n      <font face = \"Verdana\" size = \"5\">Verdana</font><br />\n      <font\
  \ face = \"Comic MS\" size =\"5\">Comic Sans MS</font><br />\n      <font face =\
  \ \"WildWest\" size = \"5\">WildWest</font><br />\n      <font face = \"Bedrock\"\
  \ size = \"5\">Bedrock</font><br />\n  </body>\n</html>\n```\n\n输出将是：\nTimes Roman\n\
  Verdana\nComic MS\nWildWest\n\n#### 指定备用字体\n\n因为如果用户没有你的字体就看不到它，因此你可以指定更多字体作为备用。你所做的只是列出每个字体名称作为备选。\n\
  \n\n\n\n1. 在闭合的 `<head>` 标签下方输入 `<body>`。HTML 文档的主体现在已打开，在此标签中输入的任何内容将显示在页面上。\n\n\
  2. 输入 `<h1>` - 这会为你的 HTML 文档提供一个标题，它将以大号字体、加粗形式显示，并位于文档顶部。\n\n3. 输入页面标题——可以是任何内容，从你的页面标题到简单的问候语。\n\
  \n4. 在标题文本之后，输入 `</h1>` 来关闭标题标签，然后按回车键。\n\n从这里开始，你可以在页面上添加任何想要的标题。你可以从六种标题样式中进行选择，从\
  \ `<h1>` 到 `<h6>`，正如书在前面的部分所演示的那样。为了复习一下，你可以连续使用三个不同大小的标题，例如：\n\n```html\n<h1>Welcome\
  \ to this page!</h1>\n<h2>My name is Jimmy.</h2>\n<h3>I hope you have fun here.</h3>\n\
  ```\n\n不同的标题表示文本重要性，但即使你没有使用 `<h1>` 或 `<h2>` 标签，你仍然可以使用 `<h3>` 标签——你不需要按顺序使用它们。\n\
  \n5. 现在输入 `<p>` 来开启段落——文本将以正常大小在此处。\n\n6. 输入你的文本——也许是网页描述或其他你希望用户看到的其他信息。\n\n7.\
  \ 一旦你输入了文本，输入 `</p>` 来关闭标签并按回车键。你的段落文本看起来像这样：\n\n```html\n<p>This is my first paragraph</p>\n\
  ```\n\n同样，可以以此方式添加额外的段落，如果你想在一个标题下显示多个段落，可以连续使用多个 `<p>` 标签。\n\n还可以通过 `<font color=\"\
  color\">` 和 `</font>` 标签来更改文本颜色。确保你在引号内的“color”部分输入你想要的颜色。使用这些标签，你可以更改任何内容的颜色。例如，如果你想将一个段落改为红色文本，你需要输入以下内容：\n\
  \n```html\n<p><font color=\"red\">(your text here)</font></p>\n```\n\n你还可以添加其他格式，如斜体、加粗等。以下是一些示例：\n\
  \n```html\n<b>Bold text</b>\n<i>Italic text</i>\n<u>Underlined text</u>\n<sub>Subscript\
  \ text</sub>\n<sup>Superscript text</sup>\n```\n\n如果你想使用斜体和加粗来强调文本，而不仅仅是为了样式，请使用\
  \ `<em>` 和 `<strong>` 而不是 `<i>` 和 `<b>`。这将确保当使用屏幕阅读器或其他辅助技术时，你的网页可以更容易被理解。\n\n##\
  \ 添加更多元素\n\n你添加添加各种元素：\n\n### 添加图片\n\n1. 输入 `<img src=` 来打开图片标签。\n2. 在 `=` 之后直接粘贴或输入图片\
  \ URL，然后用 `>` 关闭图片标签。\n\n例如，如果你正在使用类似 `http://www.myimage.com/mountains` 的地址，你将输入：\n\
  \n```html\n<img src=\"http://www.myimage.com/mountains.jpg\">\n```\n\n### 链接到不同的页面\n\
  \n1. 输入 `<a href=` 来打开链接标签。\n2. 在 `=` 之后直接粘贴或输入链接 URL。\n3. 输入 `>` 来关闭链接。\n4. 在 `>`\
  \ 之后输入链接名称。\n5. 随后输入 `</a>`。\n\n例如，如果你想链接到 Wikipedia，它看起来像这样：\n\n```html\n<a href=\"\
  https://www.wikipedia.com\">Wikipedia</a>\n```\n\n### 添加换行符\n\n要添加换行符，只需在需要的地方输入\
  \ `<br>`。这将创建一条水平线，将你的页面分为若干部分。\n\n### 自定义你的颜色\n\n首先，决定你想要什么颜色以及在哪里使用，并选择颜色名称或相关的十六进制代码，你也可以使用十进制，但不建议这样做。\n\
  \n接下来，我们要更改背景颜色，这是通过带有 `style` 属性的 `<body>` 标签实现的。例如，你可以将背景颜色改为紫色（lilac），如下：\n\n\
  ```html\n<body style=\"background-color:lilac;\">\n```\n\n现在，我们要设置任何标签的文本颜色。这也可以通过\
  \ `style` 属性完成，允许你指定任何特定标签中文本的颜色。例如，你可能想让 `<p>` 标签中的文本设为深蓝色：\n\n```html\n<p style=\"\
  color:darkblue;\">\n```\n\n此更改仅对指定的 `<p>` 标签中的文本生效。如果你之后又开始另一个 `<p>` 标签，并且也希望那里的文本是深蓝色，你需要包含\
  \ `style` 属性。\n\n### 设置标题或段落的背景颜色\n\n这种方法与 `<body>` 标签非常相似。假设你希望其中一个 `<p>` 标签具有浅蓝色背景，而\
  \ `<h1>` 标签应该具有紫色背景。以下是操作方法：\n\n```html\n<p style=\"background-color:lightblue;\"\
  >\n<h1 style=\"background-color:lilac;\">\n```\n\n### 关闭你的文档\n\n要关闭主体，输入 `</body>`。这应该在添加了所有文本以及链接、图片等其他元素后添加。此标签将告诉浏览器不要再期待更多代码。\n\
  \n要关闭一个 HTML 文档，输入 `</html>`。此标签将告诉浏览器不要再期待更多代码。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>Wikipedia</title>\n</head>\n<body>\n<h1>Welcome to this page!</h1>\n\
  <h2>My name is Jimmy.</h2>\n<h3>I hope you have fun here.</h3>\n<p>This is my first\
  \ paragraph</p>\n<p><font color=\"red\">(your text here)</font></p>\n<b>Bold text</b>\n\
  <i>Italic text</i>\n<u>Underlined text</u>\n<sub>Subscript text</sub>\n<sup>Superscript\
  \ text</sup>\n<strong>Strong text</strong>\n<a href=\"https://www.wikipedia.com\"\
  >Wikipedia</a>\n<br>\n<body style=\"background-color:lilac;\">\n<p style=\"color:darkblue;\"\
  >\n<p style=\"background-color:lightblue;\">\n<h1 style=\"background-color:lilac;\"\
  >\n</body>\n</html>\n```\n\n\n\n\n\n| `<hr>` | 用于定义文档主题的更改 |\n| `<!--…-->` | 用于定义注释\
  \ |\n\n#### HTML 格式\n\n| 标签 | 描述 |\n| :--- | :--- |\n| `<acronym>` | 用于定义缩写词 – 这在\
  \ HTML5 中不支持 - 应该使用 `<abbr>` |\n| `<abbr>` | 用于定义缩写或省略词 |\n| `<address>` | 用于定义内容所有者或作者的联系信息\
