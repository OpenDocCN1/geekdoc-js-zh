  | FFCC00 | FFCC33 | FFCC66 | FFCC99 | FFCCCC | FFCCFF |\n| FFFF00 | FFFF33 | FFFF66\
  \ | FFFF99 | FFFFCC | FFFFFF |\n\n## HTML 字体\n\n除了颜色和背景图片外，字体在确保你的网站用户友好且内容可读方面也起着重要作用。你所使用的字体样式和颜色完全取决于查看网站时使用的浏览器和硬件，但\
  \ `<font>` 标签可以帮助我们为网站文本添加样式、颜色和大小。`<basefont>` 标签用于当你希望所有文本设置为相同的大小、颜色和字体时。\n\n\
  `<font>` 标签有三个可能的属性 – `size`、`face` 和 `color`。如果你想在任何时候更改这些属性中的任何一个，只需要使用 `<font>`\
  \ 即可。在 `<font>` 标签关闭之前，后续文本将保持更改状态。你可以使用一个 `<font>` 标签来更改一个或所有属性。\n\n### 设置字体大小\n\
  \n`size` 属性用于设置字体大小。接受的值范围从 1 直到 7，但默认值是 3。\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n  <head>\n      <title>设置字体大小</title>\n  </head>\n  <body>\n      <font\
  \ size = \"1\">字体大小 = \"1\"</font><br />\n      <font size = \"2\">字体大小 = \"2\"\
  </font><br />\n      <font size = \"3\">字体大小 = \"3\"</font><br />\n      <font size\
  \ = \"4\">字体大小 = \"4\"</font><br />\n      <font size = \"5\">字体大小 = \"5\"</font><br\
  \ />\n      <font size = \"6\">字体大小 = \"6\"</font><br />\n      <font size = \"\
  7\">字体大小 = \"7\"</font>\n  </body>\n</html>\n```\n\n输出将是：\n字体大小 = \"1\"\n字体大小 =\
  \ \"2\"\n字体大小 = \"3\"\n字体大小 = \"4\"\n字体大小 = \"5\"\n字体大小 = \"6\"\n字体大小 = \"7\"\n\n\
  #### 相对字体大小\n\n也可以指定比你预设大小更大或更小的字号数。语法为：\n\n`<font size = \"+n\">`\n\n或者\n\n`<font\
  \ size = \"−n\">`\n\n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n   \
  \   <title>相对字体大小</title>\n  </head>\n  <body>\n      <font size = \"-1\">字体大小 =\
  \ \"-1\"</font><br />\n      <font size = \"+1\">字体大小 = \"+1\"</font><br />\n  \
  \    <font size = \"+2\">字体大小 = \"+2\"</font><br />\n      <font size = \"+3\">字体大小\
  \ = \"+3\"</font><br />\n      <font size = \"+4\">字体大小 = \"+4\"</font>\n  </body>\n\
  </html>\n```\n\n输出将是：\n字体大小 = \"-1\"\n字体大小 = \"+1\"\n字体大小 = \"+2\"\n字体大小 = \"+3\"\
  \n字体大小 = \"+4\"\n\n#### 设置字体字体\n\n`face` 属性用于设置字体，但你需要注意其中一点 – 如果网站用户没有安装这种特定的字体，他们就无法看到。相反，他们将看到适用于他们的系统的默认字体。\n\
  \n这是一个示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n      <title>字体名称</title>\n\
  \  </head>\n  <body>\n      <font face = \"Times Roman\" size = \"5\">Times Roman</font><br\
  \ />\n      <font face = \"Verdana\" size = \"5\">Verdana</font><br />\n      <font\
  \ face = \"Comic MS\" size =\"5\">Comic Sans MS</font><br />\n      <font face =\
  \ \"WildWest\" size = \"5\">WildWest</font><br />\n      <font face = \"Bedrock\"\
  \ size = \"5\">Bedrock</font><br />\n  </body>\n</html>\n```\n\n输出将是：\nTimes Roman\n\
