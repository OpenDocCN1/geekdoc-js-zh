  \n第十章：CSS 下拉菜单与图片 (CSS Dropdowns & Images)\n\n![](img/Image0001.jpg)\n\n下拉菜单非常棒，它们让您的网站具有交互性并便于导航。CSS\
  \ 允许您创建悬停下拉菜单。当用户将鼠标悬在特定元素上时，会弹出一个框。\n\n### 下拉菜单 (A Dropdown)\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\n.letusdropdown {\n  position: relative;\n  display:\
  \ inline-block;\n}\n.thisisdropdown-content {\n  display: none;\n  position: absolute;\n\
  \  background-color: lightgrey;\n  min-width: 180px;\n  box-shadow: 1px 7px 17px\
  \ 1px rgba(0,0,0,0.2);\n  padding: 14px 18px;\n  z-index: 1;\n}\n.letusdropdown:hover\
  \ .thisisdropdown-content {\n  display: block;\n}\n</style>\n</head>\n<body>\n<h4>正在学习悬停下拉菜单</h4>\n\
  <p>用户将鼠标移动到网页下方文本上以打开下拉内容。</p>\n<div class=\"letusdropdown\">\n  <span>在此悬停鼠标</span>\n\
  \  <div class=\"thisisdropdown-content\">\n    <p>CSS 太棒了！不是吗？</p>\n  </div>\n</div>\n\
  </body>\n</html>\n```\n\n正在学习悬停下拉菜单 (You are Studying Hoverable Dropdown)\n用户将鼠标移动到网页下方文本上以打开下拉内容。\n\
  \n在此悬停鼠标 (Please Hover Your Mouse Here)\n当用户悬停在“在此悬停鼠标”上，将弹出菜单。用户可以点击链接到达另一个页面或启动任务。您也可以使用\
  \ `<button>` 元素创建下拉内容。您可以在 `<div>` 元素内部添加任何内容创建下拉内容。我使用了类和 `relative` 位置设置菜单的位置。第二个类\
  \ `thisisdropdown-content` 保存内容。菜单默认是隐藏的。只有当您将鼠标悬停在其上方时才能看到它。您可以更改宽度来尝试下拉菜单的设计。如果您不熟悉它，可以使用\
  \ `border` 属性代替 `box-shadow` 属性。\n\n### 下拉列表 (A Dropdown List)\n挑战是在下拉菜单中添加列表。您可以在下拉列表中添加任意数量的选项。我将向下拉菜单添加导航链接，允许用户在页面之间切换并执行不同的任务。您还可以对链接和菜单进行样式处理，使其看起来时尚且精致。这里是您可以为自己的网站编辑和自定义的代码示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n.mydropbutton {\n  background-color:\
  \ lightgrey;\n  color: black;\n  padding: 14px;\n  font-size: 14px;\n  border: none;\n\
  \  cursor: pointer;\n}\n.letusdropdown {\n  position: relative;\n  display: inline-block;\n\
  }\n.thisisdropdown-content {\n  display: none;\n  position: absolute;\n  background-color:\
  \ skyblue;\n  min-width: 180px;\n  box-shadow: 1px 7px 17px 1px rgba(0,0,0,0.2);\n\
  \  z-index: 1;\n}\n.thisisdropdown-content a {\n  color: black;\n  padding: 10px\
  \ 14px;\n  text-decoration: none;\n  display: block;\n}\n.thisisdropdown-content\
  \ a:hover{background-color: green}\n.letusdropdown:hover .thisisdropdown-content\
  \ {\n  display: block;\n}\n.letusdropdown:hover .mydropbutton {\n  background-color:\
  \ red;\n}\n</style>\n</head>\n<body>\n```\n\n\n\n\n\n## 悬停下拉菜单\n\n```html\n<div\
  \ class=\"letusdropdown\">\n  <button class=\"mydropbutton\">My Dropdown Menu</button>\n\
  \  <div class=\"thisisdropdown-content\">\n    <a href=\"#\">Iceland</a>\n    <a\
  \ href=\"#\">Ireland</a>\n    <a href=\"#\">India</a>\n  </div>\n</div>\n```\n\n\
  ## 悬停下拉菜单\n\n### 导航栏下拉菜单\n\n让我们通过在导航栏内部创建一个下拉菜单来提升到一个新的水平。如果你需要与用户有更多交互，可以将下拉菜单添加到栏中。事实上，这种导航栏和下拉菜单的组合正在成为网站设计的标准。用户通过将鼠标悬停在导航栏上来节省时间，并了解网站的内容。这种\
  \ CSS 特性加速了用户的决策。这就是它提高转化率的原因。用户喜爱那些能够帮助他们节省时间的业务。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\nul {\n  list-style-type: none;\n  margin: 1px;\n  padding:\
  \ 1px;\n  overflow: hidden;\n  background-color: skyblue;\n}\nli {\n  float: left;\n\
  }\nli a, .mydropbutton {\n  display: inline-block;\n  color: grey;\n  text-align:\
  \ center;\n  padding: 12px 14px;\n  text-decoration: none;\n}\nli a:hover, .letusdropdown:hover\
  \ .mydropbutton {\n  background-color: red;\n}\nli.letusdropdown {\n  display: inline-block;\n\
  }\n.thisisdropdown-content {\n  display: none;\n  position: absolute;\n  background-color:\
  \ skyblue;\n  min-width: 180px;\n  box-shadow: 1px 7px 17px 1px rgba(0,0,0,0.2);\n\
  \  z-index: 1;\n}\n.thisisdropdown-content a {\n  color: black;\n  padding: 10px\
  \ 14px;\n  text-decoration: none;\n  display: block;\n}\n.thisisdropdown-content\
  \ a:hover {background-color: green}\n.letusdropdown:hover .thisisdropdown-content\
  \ {\n  display: block;\n}\n.letusdropdown:hover .mydropbutton {\n  background-color:\
  \ red;\n}\n</style>\n</head>\n<body>\n<h4>Hoverable Dropdown menus</h4>\n<ul>\n\
  \  <li><a href=\"#home\">Home Page</a></li>\n  <li><a href=\"#news\">News Page</a></li>\n\
  \  <li class=\"letusdropdown\">\n    <a href=\"javascript:void(0)\" class=\"mydropbutton\"\
  >Browse Countries You Need To Visit</a>\n    <div class=\"thisisdropdown-content\"\
  >\n      <a href=\"#\">Iceland</a>\n      <a href=\"#\">Ireland</a>\n      <a href=\"\
  #\">India</a>\n    </div>\n  </li>\n</ul>\n</body>\n</html>\n```\n\n悬停下拉菜单\n\n[首页](https://tools.tutorialspoint.com/uploads/d2bf8c09bcbe0aeb903d398d55a5b7a8-17804/index.htm#home)\
  \ [新闻页](https://tools.tutorialspoint.com/uploads/d2bf8c09bcbe0aeb903d398d55a5b7a8-17804/index.htm#news)\
  \ 浏览你需要访问的国家\n\n## 图片画廊\n\n你可以通过简单的代码为你的网站添加图片。如果你正在为你的旅游网站创建一个在线商店，你可能需要为网站添加旅游目的地的图片。你可以通过创建代码来将它们堆叠起来。一旦你创建了代码，就可以继续添加更多图片来为网站添加更多旅游景点。删除旧过时的图片并用新图片替换它们。查看如何为此创建代码，然后对其进行编辑，看看实验可以走多远。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ndiv.1stgallery {\n  margin:\
  \ 7px;\n  border: 2px solid lightgrey;\n  float: left;\n  width: 200px;\n}\ndiv.1stgallery:hover\
  \ {\n  border: 2px solid red;\n}\ndiv.1stgallery img {\n  width: 120%;\n  height:\
  \ auto;\n}\ndiv.description {\n  padding: 20px;\n  text-align: center;\n}\n</style>\n\
  </head>\n<body>\n<div class=\"1stgallery\">\n  <a target=\"_blank\" href=\"italy.jpg\"\
  >\n    <img src=\"italy.jpg\" alt=\"beaches\" width=\"50\">\n  </a>\n  <div class=\"\
  description\">这里是你可以添加描述的地方</div>\n</div>\n<div class=\"1stgallery\">\n  <a target=\"\
  _blank\" href=\"spain.jpg\">\n    <img src=\"spain.jpg\" alt=\"Mountains\" width=\"\
  50\">\n  </a>\n  <div class=\"description\">Description Space</div>\n</div>\n<div\
  \ class=\"1stgallery\">\n  <a target=\"_blank\" href=\"rome.jpg\">\n    <img src=\"\
  rome.jpg\" alt=\"Castles\" width=\"50\">\n  </a>\n  <div class=\"description\">Description\
  \ Space</div>\n</div>\n<div class=\"1stgallery\">\n  <a target=\"_blank\" href=\"\
  germany.jpg\">\n    <img src=\"germany.jpg\" alt=\"Lakes\" width=\"50\">\n  </a>\n\
  \  <div class=\"description\">Description Space</div>\n</div>\n</body>\n</html>\n\
  ```\n\n### 图片精灵\n\nImage Sprites 允许你将多张图片合并到单个图像文件中，以减少加载网页所需的 HTTP 请求。通过使用 CSS\
  \ 属性 `background-position`，你可以根据需要显示精灵图像的特定部分。这种技术改进了网站的性能和加载速度，特别是在包含许多小图标或图片的页面上。\n\
  \n\n\n\n\n# 第十一章\n\n## CSS 属性与表单\n\n![](img/Image00001.jpg)\n\n你可以对带有属性值的不同 HTML\
  \ 元素设置样式。属性选择器通常用于通过指定的属性选择不同的元素。你可以使用属性选择器根据指定的属性来选择元素。以下示例将根据目标属性选择元素。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\na[target] {\n  background-color: lightgrey;\n\
  }\n</style>\n</head>\n<body>\n<h4>学习 CSS 选择器</h4>\n<p>以下带有 target 属性的链接将具有黄色背景：</p>\n\
  <a href=\"https://www.sinoform.com\">This is sinoform.com</a>\n<a href=\"http://www.treeisgreen.com\"\
  \ target=\"_blank\">This is treeisgreen.com</a>\n<a href=\"http://www.printmedia.org\"\
  \ target=\"_top\">This is printmedia.org</a>\n</body>\n</html>\n```\n\n### 学习 CSS\
  \ 选择器\n以下带有 target 属性的链接将具有黄色背景：\n[This is sinoform.com](https://www.sinoform.com/)\
  \ [This is treeisgreen.com](http://www.treeisgreen.com/) [This is printmedia.org](http://www.printmedia.org/)\n\
  \n### CSS 表单\n你的 HTML 表单外观需要通过 CSS 进行极大改进。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <style>\ninput[type=thetext], select {\n  width: 150%;\n  padding: 14px 24px;\n\
  \  margin: 10px 0;\n  display: inline-block;\n  border: 2px solid lightgrey;\n \
  \ border-radius: 6px;\n  box-sizing: border-box;\n}\ninput[type=submityourresponse]\
  \ {\n  width: 250%;\n  background-color: skyblue;\n  color: white;\n  padding: 16px\
  \ 24px;\n  margin: 6px 0;\n  border: none;\n  border-radius: 6px;\n  cursor: pointer;\n\
  }\ninput[type=submityourresponse]:hover {\n  background-color: yellow;\n}\ndiv {\n\
  \  border-radius: 7px;\n  background-color: seagreen;\n  padding: 15px;\n}\n</style>\n\
  <body>\n<h4>学习使用 CSS 样式化 HTML 表单</h4>\n<div>\n  <form action=\"/action_page.php\"\
  >\n    <label for=\"firstname\">First Name</label>\n    <input type=\"thetext\"\
  \ id=\"firstname\" name=\"firstname\" placeholder=\"Your first name..\">\n    <label\
  \ for=\"lastname\">Last Name</label>\n    <input type=\"thetext\" id=\"lastname\"\
  \ name=\"lastname\" placeholder=\"Your last name..\">\n    <label for=\"yourcountry\"\
  >Country</label>\n    <select id=\"yourcountry\" name=\"yourcountry\">\n      <option\
  \ value=\"Ireland\">Ireland</option>\n      <option value=\"canada\">Canada</option>\n\
  \      <option value=\"Iceland\">Iceland</option>\n    </select>\n    <input type=\"\
  submityourresponse\" value=\"Submit\">\n  </form>\n</div>\n</body>\n</html>\n```\n\
  \n### 学习使用 CSS 样式化 HTML 表单\nFirst Name Last Name Country ![](img/Image00073.jpg)\n\
  \n你可以通过使用 `width` 属性为输入字段添加更多样式。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  input {\n  width: 150%;\n}\n</style>\n</head>\n<body>\n<p>这是一个全宽输入字段：</p>\n<form>\n\
  \  <label for=\"firstname\">Your First Name</label>\n  <input type=\"thetext\" id=\"\
  firstname\" name=\"firstname\">\n</form>\n</body>\n</html>\n```\n这是一个全宽输入字段：\nYour\
  \ First Name\n\n### Padding 属性\n你可以使用 `padding` 属性为文本字段提供额外的内边距。当你处理多个输入框时，你可能需要在代码中添加一些外边距（margin）。将在外部添加额外的间距。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext] {\n  width:\
  \ 120%;\n  padding: 14px 25px;\n  margin: 10px 0;\n  box-sizing: border-box;\n}\n\
  </style>\n</head>\n<body>\n<p>这些是有内边距的文本字段：</p>\n<form>\n  <label for=\"firstname\"\
  >First Name</label>\n  <input type=\"thetext\" id=\"firstname\" name=\"firstname\"\
  >\n  <label for=\"lastname\">Last Name</label>\n  <input type=\"thetext\" id=\"\
  lastname\" name=\"lastname\">\n</form>\n</body>\n</html>\n```\n这些是有内边距的文本字段：\nFirst\
  \ Name Last Name\n\n### 更多设计\n让我们通过在代码中整合 `border` 属性为表单添加更多设计，以改变表单的颜色、大小和长度。`border-radius`\
  \ 属性可以用于设置输入字段的角。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext]\
  \ {\n  width: 120%;\n  padding: 14px 25px;\n  margin: 10px 0;\n  box-sizing: border-box;\n\
  \  border: 4px solid green;\n  border-radius: 6px;\n}\n</style>\n</head>\n<body>\n\
  <p>这些是有内边距的文本字段：</p>\n<form>\n  <label for=\"firstname\">First Name</label>\n  <input\
  \ type=\"thetext\" id=\"firstname\" name=\"firstname\">\n  <label for=\"lastname\"\
  >Last Name</label>\n  <input type=\"thetext\" id=\"lastname\" name=\"lastname\"\
  >\n</form>\n</body>\n</html>\n```\n你可以只添加 `border-bottom` 属性为输入添加底框。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext] {\n  width: 120%;\n\
  \  padding: 14px 25px;\n  margin: 10px 0;\n  box-sizing: border-box;\n  border:\
  \ none;\n  border-bottom: 4px solid red;\n}\n</style>\n</head>\n<body>\n<p>这些是有内边距的文本字段：</p>\n\
  <form>\n  <label for=\"firstname\">First Name</label>\n  <input type=\"thetext\"\
  \ id=\"firstname\" name=\"firstname\">\n  <label for=\"lastname\">Last Name</label>\n\
  \  <input type=\"thetext\" id=\"lastname\" name=\"lastname\">\n</form>\n</body>\n\
  </html>\n```\n\n### 有颜色的输入框\n你还可以使用 `background-color` 代码为表单创建彩色效果。你可以为背景赋予任何颜色。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext] {\n  width:\
  \ 120%;\n  padding: 14px 25px;\n  margin: 10px 0;\n  box-sizing: border-box;\n \
  \ background-color: skyblue;\n  color: green;\n}\n</style>\n</head>\n<body>\n<p>这些是有内边距的文本字段：</p>\n\
  <form>\n  <label for=\"firstname\">First Name</label>\n  <input type=\"thetext\"\
  \ id=\"firstname\" name=\"firstname\">\n  <label for=\"lastname\">Last Name</label>\n\
  \  <input type=\"thetext\" id=\"lastname\" name=\"lastname\">\n</form>\n</body>\n\
  </html>\n```\n\n### 聚焦输入框\n你可以通过添加一个在用户聚焦输入字段时改变颜色的属性来更改样式。将在下面的代码中添加 `focus` 属性以查看结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext] {\n  width:\
  \ 120%;\n  padding: 14px 25px;\n  margin: 10px 0;\n  box-sizing: border-box;\n \
  \ border: 2px solid skyblue;\n  outline: none;\n}\ninput[type=thetext]:focus {\n\
  \  background-color: lightgrey;\n}\n</style>\n</head>\n<body>\n<p>这些是聚焦的文本字段：</p>\n\
  <form>\n  <label for=\"firstname\">First Name</label>\n  <input type=\"thetext\"\
  \ id=\"firstname\" name=\"firstname\">\n  <label for=\"lastname\">Last Name</label>\n\
  \  <input type=\"thetext\" id=\"lastname\" name=\"lastname\">\n</form>\n</body>\n\
  </html>\n```\n现在聚焦字段将具有边框。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
  input[type=thetext] {\n  width: 120%;\n  padding: 14px 25px;\n  margin: 10px 0;\n\
  \  box-sizing: border-box;\n  border: 4px solid red;\n  -webkit-transition: 0.5s;\n\
  \  transition: 0.5s;\n  outline: none;\n}\ninput[type=thetext]:focus {\n  border:\
  \ 4px solid yellow;\n}\n</style>\n</head>\n<body>\n<p>这些是聚焦的文本字段：</p>\n<form>\n\
  \  <label for=\"firstname\">First Name</label>\n  <input type=\"thetext\" id=\"\
  firstname\" name=\"firstname\">\n  <label for=\"lastname\">Last Name</label>\n \
  \ <input type=\"thetext\" id=\"lastname\" name=\"lastname\">\n</form>\n</body>\n\
  </html>\n```\n你可以通过向搜索框添加背景图像来进一步修改你的搜索框。你可以通过使用 `background` 属性对其进行定位。请注意，你应该为图标在搜索框中的调整留出足够的空间。搜索框的代码如下：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=thetext] {\n  width:\
  \ 150%;\n  box-sizing: border-box;\n  border: 4px solid lightgrey;\n  border-radius:\
  \ 6px;\n  font-size: 14px;\n}\n</style>\n\n\n\n\n\n```html\n<style>\nbody {\n  background-color:\
  \ skyblue;\n  background-image: url('someicon.png');\n  background-position: 12px\
  \ 12px;\n  background-repeat: no-repeat;\n  padding: 14px 25px 14px 60px;\n}\n</style>\n\
  </head>\n<body>\n<p>查看这个带有图标的输入框：</p>\n<form>\n  <input type=\"thetext\" name=\"\
  search\" placeholder=\"在此处搜索..\">\n</form>\n</body>\n</html>\n```\n\n### 文本区域 (Text\
  \ Areas)\n\n您可以使用 `resize` 属性来防止文本区域被调整大小。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\ntextarea {\n  width: 150%;\n  height: 130px;\n  padding: 14px 25px;\n\
  \  box-sizing: border-box;\n  border: 4px solid red;\n  border-radius: 6px;\n  background-color:\
  \ skyblue;\n  font-size: 18px;\n  resize: none;\n}\n</style>\n</head>\n<body>\n\
  <p><strong>专业提示：</strong> 您可以应用 `resize` 属性来防止调整大小：</p>\n<form>\n  <textarea>一些文本...</textarea>\n\
  </form>\n</body>\n</html>\n```\n\n专业提示：您可以应用 `resize` 属性来防止调整大小：\n\n![](img/Image00074.jpg)\n\
  \n### 菜单样式 (Menu Styling)\n\n您可以使用相同的代码进行微调来为菜单设置样式。请记住，单个原始 HTML 元素可能会破坏您网站的外观。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nselect {\n  width: 150%;\n\
  \  padding: 18px 25px;\n  border: none;\n  border-radius: 6px;\n  background-color:\
  \ skyblue;\n}\n</style>\n</head>\n<body>\n<p>这是一个样式化的菜单。</p>\n<form>\n  <select\
  \ id=\"listofcountry\" name=\"listofcountry\">\n    <option value=\"ir\">我们到达了爱尔兰。</option>\n\
  \    <option value=\"ca\">加拿大正在邀请移民。</option>\n    <option value=\"usa\">美国仍然是超级大国。</option>\n\
  \  </select>\n</form>\n</body>\n</html>\n```\n\n以下代码可以帮助设置按钮，例如提交按钮或订阅按钮。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<style>\ninput[type=subscribe], input[type=submit],\
  \ input[type=Enter] {\n  background-color: skyblue;\n  border: none;\n  color: red;\n\
  \  padding: 18px 36px;\n  text-decoration: none;\n  margin: 6px 4px;\n  cursor:\
  \ pointer;\n}\n</style>\n</head>\n<body>\n<p>这些是样式化的按钮。</p>\n<input type=\"subscribe\"\
  \ value=\"订阅\">\n<input type=\"submit\" value=\"提交\">\n<input type=\"Enter\" value=\"\
  回车\">\n</body>\n</html>\n```\n\n这些是样式化的按钮。\n\n![](img/Image00075.jpg)\n\n### 响应式表单\
  \ (Responsive Form)\n\n您可以调整浏览器窗口的大小查看表单的行为。大多数情况下，表单对浏览器窗口大小的变化没有响应。当您的屏幕宽度低于 600px\
  \ 时，它将以列堆叠的形式显示。您可以创建表单来完成许多任务，例如收集联系信息或为销售产品收集财务信息。后者用于电子商务商店。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<style>\n* {\n  box-sizing: border-box;\n}\ninput[type=thetext],\
  \ theselect, thetextarea {\n  width: 150%;\n  padding: 14px;\n  border: 2px solid\
  \ skyblue;\n  border-radius: 6px;\n  resize: vertical;\n}\nlabel {\n  padding: 14px\
  \ 14px 0;\n  display: inline-block;\n}\ninput[type=thesubmit] {\n  background-color:\
  \ lightgrey;\n  color: red;\n  padding: 14px 25px;\n  border: none;\n  border-radius:\
  \ 8px;\n  cursor: pointer;\n  float: right;\n}\ninput[type=thesubmit]:hover {\n\
  \  background-color: yellow;\n}\n.class1 {\n  border-radius: 7px;\n  background-color:\
  \ seagreen;\n  padding: 30px;\n}\n.class2 {\n  float: left;\n  width: 25%;\n  margin-top:\
  \ 8px;\n}\n.class3 {\n  float: left;\n  width: 85%;\n  margin-top: 8px;\n}\n/* 在列之后产生清除的浮动\
  \ */\n.rowing:after {\n  content: \"\";\n  display: table;\n  clear: both;\n}\n\
  /* 这是一个生成的响应式布局 - 当屏幕宽度小于标准的 600px 时，两列将正确地堆叠在彼此之上，而不是并排放置 */\n@media screen and\
  \ (max-width: 600px) {\n  .class2, .class3, input[type=thesubmit] {\n    width:\
  \ 150%;\n    margin-top: 0;\n  }\n}\n</style>\n</head>\n<body>\n<h4>您正在查看一个响应式表单</h4>\n\
  <p>现在，您可以调整浏览器窗口的大小并查看切换效果。当屏幕宽度低于 600px 时，它将变为两列正确地堆叠在彼此之上。</p>\n<div class=\"\
  class1\">\n  <form action=\"/theaction_page.php\">\n    <div class=\"rowing\">\n\
  \      <div class=\"class2\">\n        <label for=\"firstname\">名</label>\n    \
  \  </div>\n      <div class=\"class3\">\n        <input type=\"thetext\" name=\"\
  firstname\" placeholder=\"您的名字\">\n      </div>\n    </div>\n    <div class=\"rowing\"\
  >\n      <div class=\"class2\">\n        <label for=\"lastname\">姓</label>\n   \
  \   </div>\n      <div class=\"class3\">\n        <input type=\"thetext\" name=\"\
  lastname\" placeholder=\"您的名字\">\n      </div>\n    </div>\n    <div class=\"rowing\"\
  >\n      <div class=\"class2\">\n        <label for=\"mycountry\">国家</label>\n \
  \     </div>\n      <div class=\"class3\">\n        <select id=\"mycountry\">\n\
  \          <option value=\"ir\">我们到达了爱尔兰。</option>\n          <option value=\"ca\"\
  >加拿大正在邀请移民。</option>\n          <option value=\"usa\">美国仍然是超级大国。</option>\n    \
  \    </select>\n      </div>\n    </div>\n    <input type=\"thesubmit\" value=\"\
  提交\">\n  </form>\n</div>\n</body>\n</html>\n```\n\n\n\n\n\n# 第十二章\n\n## CSS 网页布局\n\
  \n![](img/Image00001.jpg)\n\n你可以将网站的布局划分为菜单、页头、页脚和一些内容。有不同的布局设计可供选择。通常，一个网站有一个页头、页脚和内容。有一些菜单可以装饰页面。页头位于网页的顶部。它也可以设置在顶部导航菜单下方。通常，它包含网站的名称或\
  \ Logo。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>Decoding\
  \ CSS Layout</title>\n<meta charset=\"utf-8\">\n<meta name=\"theviewport\" content=\"\
  thewidth=device-width, theinitial-scale=1\">\n<style>\nbody {\n  margin: 1px;\n\
  }\n/* I am now Styling the website header */\n.header {\n  background-color: lightgrey;\n\
  \  padding: 25px;\n  text-align: center;\n}\n</style>\n</head>\n<body>\n<div class=\"\
  header\">\n  <h4>This Is The Header</h4>\n</div>\n</body>\n</html>\n```\n\n这是页头\n\
  \n### 导航栏\n\n布局的第二个组件是导航栏。它几乎是不可避免的。你必须有一个，因为它承载了一系列导航链接，引导用户穿过网站。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>CSS Website Layout</title>\n\
  <meta charset=\"utf-8\">\n<meta name=\"theviewport\" content=\"thewidth=device-width,\
  \ theinitial-scale=1\">\n<style>\n* {\n  box-sizing: border-box;\n}\nbody {\n  margin:\
  \ 1px;\n}\n/* This code is for Styling your header */\n.headerclass {\n  background-color:\
  \ skyblue;\n  padding: 25px;\n  text-align: center;\n}\n/* This code is for Styling\
  \ your top navigation bar */\n.topnavigationbar {\n  overflow: hidden;\n  background-color:\
  \ red;\n}\n/* This code is for Styling the topnavigation links */\n.topnavigationbar\
  \ a {\n  float: left;\n  display: block;\n  color: black;\n  text-align: center;\n\
  \  padding: 16px 18px;\n  text-decoration: none;\n}\n/* This code is for Changing\
  \ the color on the mouse hover */\n.topnavigationbar a:hover {\n  background-color:\
  \ lightgrey;\n  color: black;\n}\n</style>\n</head>\n<body>\n<div class=\"theheader\"\
  >\n  <h4>This Is Header</h4>\n</div>\n<div class=\"topnavigationbar\">\n  <a href=\"\
  #\">首页</a>\n  <a href=\"#\">关于我们</a>\n  <a href=\"#\">新闻角</a>\n</div>\n</body>\n\
  </html>\n```\n\n这是页头\n\n[首页](https://tools.tutorialspoint.com/uploads/913c1fb3e01bda4adc4898840c9660b4-17849/index.htm)\
  \ [关于我们](https://tools.tutorialspoint.com/uploads/913c1fb3e01bda4adc4898840c9660b4-17849/index.htm)\
  \ [新闻角](https://tools.tutorialspoint.com/uploads/913c1fb3e01bda4adc4898840c9660b4-17849/index.htm)\n\
  \n### 内容\n\n布局的这部分取决于目标用户。网站中最常见的布局是结合了以下不同的列。你可以使用三栏布局在页面上显示你的博客。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>This is my CSS Layout</title>\n\
  <meta charset=\"utf-8\">\n<meta name=\"theviewport\" content=\"thewidth=device-width,\
  \ theinitial-scale=1\">\n<style>\n* {\n  box-sizing: border-box;\n}\nbody {\n  margin:\
  \ 1px;\n}\n/* This code will Style your header */\n.headerwebsite {\n  background-color:\
  \ lightgrey;\n  padding: 25px;\n  text-align: center;\n}\n/* This code will Style\
  \ your top navigation bar */\n.topnavigationbar {\n  overflow: hidden;\n  background-color:\
  \ skyblue;\n}\n/* This code will Style your links */\n.topnavigationbar a {\n  float:\
  \ left;\n  display: block;\n  color: red;\n  text-align: center;\n  padding: 16px\
  \ 18px;\n  text-decoration: none;\n}\n/* This code will Change the color on the\
  \ hover */\n.topnavigationbar a:hover {\n  background-color: red;\n  color: black;\n\
  }\n/* Create three equal columns that floats next to other */\n.columns {\n  float:\
  \ left;\n  width: 30%;\n  padding: 15px;\n}\n/* Clear floats after the columns */\n\
  .rowing:after {\n  content: \"\";\n  display: table;\n  clear: both;\n}\n/* Create\
  \ three equal columns that floats next to other */\n.columns {\n  float: left;\n\
  \  width: 30%;\n  padding: 15px;\n}\n/* Clear floats after the columns */\n.rowing:after\
  \ {\n  content: \"\";\n  display: table;\n  clear: both;\n}\n/* Create three equal\
  \ columns that floats next to other */\n.columns {\n  float: left;\n  width: 30%;\n\
  \  padding: 15px;\n}\n/* Clear floats after the columns */\n.rowing:after {\n  content:\
  \ \"\";\n  display: table;\n  clear: both;\n}\n/* Create three equal columns that\
  \ floats next to other */\n.columns {\n  float: left;\n  width: 30%;\n  padding:\
  \ 15px;\n}\n/* Clear floats after the columns */\n.rowing:after {\n  content: \"\
  \";\n  display: table;\n  clear: both;\n}\n/* Create three equal columns that floats\
  \ next to other */\n.columns {\n  float: left;\n  width: 30%;\n  padding: 15px;\n\
  }\n/* Clear floats after the columns */\n.rowing:after {\nThis is a Responsive web\
  \ layout. You will see three columns properly stacked atop of other rather than\
  \ side by side */\n@media screen and (max-width:600px) {\n  .column {\n     width:\
  \ 100%;\n  }\n}\n</style>\n</head>\n<body>\n<div class=\"headerwebsite\">\n  <h4>This\
  \ Is The Header</h4>\n</div>\n<div class=\"topnavigationbar\">\n  <a href=\"#\"\
  >首页</a>\n  <a href=\"#\">博客</a>\n  <a href=\"#\">新闻</a>\n</div>\n<div class=\"rowing\"\
  >\n  <div class=\"columns\">\n    <h4>First Column</h4>\n  </div>\n  <div class=\"\
  columns\">\n    <h4>Second Column</h4>\n  </div>\n  <div class=\"columns\">\n  \
  \  <h4>Third Column</h4>\n  </div>\n</div>\n</body>\n</html>\n```\n\n这是页头\n\n这是一种响应式网页布局。你将看到三列垂直堆叠，而不是并排。\n\
  \n### 不等宽列\n\n网站可能包含不等宽的列。这些是不可避免的。因此，通常使用不等宽列来为主要内容留出足够的空间。你可以根据需要更改宽度。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>This is my CSS Layout</title>\n\
  <meta charset=\"utf-8\">\n<meta name=\"theviewport\" content=\"thewidth=device-width,\
  \ theinitial-scale=1\">\n<style>\n* {\n  box-sizing: border-box;\n}\nbody {\n  margin:\
  \ 1px;\n}\n/* This code will Style your header */\n.headerwebsite {\n  background-color:\
  \ lightgrey;\n  padding: 25px;\n  text-align: center;\n}\n/* This code will Style\
  \ your top navigation bar */\n.topnavigationbar {\n  overflow: hidden;\n  background-color:\
  \ skyblue;\n}\n/* This code will Style your links */\n.topnavigationbar a {\n  float:\
  \ left;\n  display: block;\n  color: red;\n  text-align: center;\n  padding: 16px\
  \ 18px;\n  text-decoration: none;\n}\n/* This code will Change the color on the\
  \ hover */\n.topnavigationbar a:hover {\n  background-color: red;\n  color: black;\n\
  }\n/* These are the right and left columns */\n.columns.side {\n  width: 20%;\n\
  }\n/* This is the Middle column */\n.columns.middle {\n  width: 60%;\n}\n/* This\
  \ clears the float after your columns */\n.rowing:after {\n  content: \"\";\n  display:\
  \ table;\n  clear: both;\n}\n/* This is a Responsive web layout. You will see three\
  \ columns properly stacked atop of other rather than side by side */\n@media screen\
  \ and (max-width:600px) {\n  .column {\n     width: 100%;\n  }\n}\n</style>\n</head>\n\
  <body>\n<div class=\"headerwebsite\">\n  <h4>This Is The Header</h4>\n</div>\n<div\
  \ class=\"topnavigationbar\">\n  <a href=\"#\">首页</a>\n  <a href=\"#\">博客</a>\n\
  \  <a href=\"#\">新闻</a>\n</div>\n<div class=\"rowing\">\n  <div class=\"columns\
  \ side\">\n    <h4>Left Column</h4>\n  </div>\n  <div class=\"columns middle\">\n\
  \    <h4>Middle Column</h4>\n  </div>\n  <div class=\"columns side\">\n    <h4>Right\
  \ Column</h4>\n  </div>\n</div>\n</body>\n</html>\n```\n\n\n\n\n```html\n<body\n\
