  \  <li><a href=\"#about\">About</a></li>\n</ul>\n</body>\n</html>\n```\n\n### 布局\n\
  \n在以下示例中，我将使用浮动属性来设计完整的布局。你可以使用代码来编辑你的页面。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<style>\n* {\n  box-sizing: border-box;\n}\n.headers, .footers {\n  background-color:\
  \ lightgrey;\n  color: black;\n  padding: 20px;\n}\n.columns {\n  float: left;\n\
  \  padding: 20px;\n}\n.clearfixing::after {\n  content: \"\";\n  clear: both;\n\
  \  display: table;\n}\n.menus {\n  width: 30%;\n}\n.contents {\n  width: 85%;\n\
  }\n.menus ul {\n  list-style-type: none;\n  margin: 0;\n  padding: 0;\n}\n.menus\
