  }\n</script>\n</body>\n</html>\n```\n\n# 学习 JavaScript 数组排序\n\n通过点击按钮，你可以按升序排序数组。\n\
  \n点击我\n`15,253,1000,555,102,4000`\n\n随机方法的问题在于它会倾向于某些数字而不是其他数字。还有另一种比这种更正确、更有用的方法。它被称为\
  \ Fisher-Yates 洗牌算法（Fisher-Yates shuffle）。该方法在数据科学早期就被引入。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>JavaScript 数组排序继续</p>\n<h3>这是 Fisher-Yates 方法</h3>\n\
  <p>当你反复点击按钮时，你将随机顺序排序数组。</p>\n<button onclick=\"FunctionXX()\">点击我</button>\n<p\
  \ id=\"demo12\"></p>\n<script>\nvar nums = [404, 10023, 123, 589, 2511, 102];\n\
  document.getElementById(\"demo12\").innerHTML = nums; \nfunction FunctionXX() {\n\
  var a, b, c;\n  for (a = nums.length -1; a > 0; a--) {\n    b = Math.floor(Math.random()\
  \ * (a + 1));\n    c = nums[a];\n    nums[a] = nums[b];\n    nums[b] = c;\n  }\n\
  \  document.getElementById(\"demo12\").innerHTML = nums;\n}\n</script>\n</body>\n\
  </html>\n```\n\n# JavaScript 数组排序继续\n\n### 这是 Fisher-Yates 方法\n\n当你反复点击按钮时，你将随机顺序排序数组。\n\
  \n点击我\n`404,10023,123,589,2511,102`\n\n## 数组值\n\nJavaScript 没有内置函数来查找最大值或最小值。然而，当你有一个数组时，你可以使用\
  \ `sort()` 来查找最大值和最小值。\n\n\n\n\n# JavaScript 数组排序获取最大值\n\n数组中的最高数字是：147777777777。\n\
  \n同样，你可以创建一个函数，该函数会遍历整个数组，首先检测出最小值，然后将其与数组其余值进行比较。最后，它将在浏览器中输出结果。查看 `min` 函数是如何工作以及遍历数组的。\n\
  \n```javascript\nvar nums = [4077879878, 10023, 147777777777, 53, 25, 1023];\n\n\
  document.getElementById(\"demo7\").innerHTML = ArrayMaxPoint(nums);\n\nfunction\
  \ ArrayMaxPoint(arr) {\n  var length = arr.length;\n  var maximum = -Infinity;\n\
  \  while (length--) {\n    if (arr[length] > maximum) {\n      maximum = arr[length];\n\
  \    }\n  }\n  return maximum;\n}\n```\n\n# JavaScript 数组排序获取最大值\n\n数组中的最高数字是：25。\n\
  \n```javascript\nvar nums = [4077879878, 10023, 147777777777, 53, 25, 1023];\n\n\
  document.getElementById(\"demo7\").innerHTML = ArrayMinPoint(nums);\n\nfunction\
  \ ArrayMinPoint(arr) {\n  var length = arr.length;\n  var minimum = Infinity;\n\
  \  while (length--) {\n    if (arr[length] < minimum) {\n      minimum = arr[length];\n\
  \    }\n  }\n  return minimum;\n}\n```\n\n## 对象数组排序\n\n如果你有一个包含对象的数组，可以使用以下方法对它们进行排序。\n\
  \n请点击按钮对汽车对象进行排序。\n\n```javascript\nvar carsObjects = [\n  {type:\"Honda\", year:2020,\
  \ Make:\"Japan\", Model:\"Vezel\"},\n  {type:\"Toyota\", year:2010, Make:\"Japan\"\
  , Model:\"Fortuner\"},\n  {type:\"Toyota\", year:2018, Make:\"Japan\", Model:\"\
  Vitz\"}\n];\n\nToDisplayCars();\n\nfunction FunctionO() {\n  carsObjects.sort(function(x,\
  \ y){return x.year - y.year});\n  ToDisplayCars();\n}\n\nfunction ToDisplayCars()\
  \ {\n  document.getElementById(\"demo2\").innerHTML =\n  carsObjects[0].type + \"\
  \ \" + carsObjects[0].year + \" \" + carsObjects[0].Make + \" \" + carsObjects[0].Model\
  \ + \"<br>\" +\n  carsObjects[1].type + \" \" + carsObjects[1].year + \" \" + carsObjects[0].Make\
  \ + \" \" + carsObjects[0].Model + \"<br>\" +\n  carsObjects[2].type + \" \" + carsObjects[2].year\
  \ + \" \" + carsObjects[0].Make + \" \" + carsObjects[0].Model;\n}\n```\n\nToyota\
  \ 2010 Japan Fortuner\nToyota 2018 Japan Fortuner\nHonda 2020 Japan Fortuner\n\n\
  我已经通过点击排序按钮进行了排序。在浏览器中首次运行代码时，可能会看到不同的顺序。只有在点击排序按钮时，顺序才会改变。\n\n## JavaScript 迭代\n\
  \n在创建网页时，JavaScript 数组中还有更多可以学习和应用的内容。`forEach()` 方法帮助你对数组的所有元素执行函数调用。\n\n该方法会为所有单个数组元素至少调用一次函数。\n\
  \n```javascript\nvar msg = \"\";\nvar nums = [4588888, 2234, 12349, 16899, 900025];\n\
  \nnums.forEach(FunctionE);\ndocument.getElementById(\"demo44\").innerHTML = msg;\n\
  \nfunction FunctionE(Evalue, Eindex, Earray) {\n  msg = msg + Evalue + \"<br>\"\
  ;\n}\n```\n\n4588888\n2234\n12349\n16899\n900025\n\n我为函数分配了三个参数；第一个参数处理项目的值，第二个参数处理项目的索引，第三个参数处理整个数组。在上面的示例中，我只部署了\
  \ `Evalue` 参数。这意味着如果你不需要另外两个，可以将它们从函数中删除以简化代码。然而，如果你认为以后会需要另外两个，可以保留它们并在随后的单独调用中使用它们。`forEach()`\
  \ 方法最好的处是它适用于除 Internet 8 或之前的版本之外的所有 Web 浏览器。\n\n# map() 方法\n\n程序员使用 `map()` 方法通过对所有元素执行单独函数来创建一个新数组。它不会对空元素执行函数，也不会改变数组的原始形式。接下来的示例将使用加法运算符为数组中的每个数字加\
  \ 1000 并创建一个新数组。\n\n```javascript\nvar nums1 = [12345, 7674, 3449, 12316, 990025];\n\
  \nvar nums2 = nums1.map(FunctionM);\ndocument.getElementById(\"demo90\").innerHTML\
  \ = nums2;\n\nfunction FunctionM(Mvalue, Mindex, Marray) {\n  return Mvalue + 1000;\n\
  }\n```\n\n13345,8674,4449,13316,990125\n\n我将移除加法运算符并添加乘法运算符以产生不同的结果创建一个新数组。\n\n\
  ```javascript\nvar nums1 = [12345, 7674, 3449, 12316, 990025];\n\nvar nums2 = nums1.map(FunctionM);\n\
  document.getElementById(\"demo90\").innerHTML = nums2;\n\nfunction FunctionM(Mvalue,\
  \ Mindex, Marray) {\n  return Mvalue * 1000;\n}\n```\n\n12345000,7674000,3449000,12316000,990025000\n\
  \n请注意，我在代码中包含的函数接受三个参数；第一个参数是值，第二个是索引，第三个是整个数组。如果你只需要处理一个参数，可以省略其余参数。省略不会影响程序。它将产生相同的结果。与前面的方法一样，`Array.map()`\
  \ 适用于 Explorer 8 或更早版本之外的所有 Web 浏览器。\n\n# filter() 方法\n\n`filter()` 方法倾向于创建一个包含通过测试的数组元素的新数组。我将过滤器设置为\
  \ 20，这意味着所有大于 20 的数字都将被该方法过滤掉。用户只会看到大于 20 的数字。其余元素将被隐藏。\n\n```javascript\nvar nums\
  \ = [45890, 17, 3459, 18, 2, 6, 23416, 87625];\n\nvar over20 = nums.filter(FunctionZ);\n\
  document.getElementById(\"demo789\").innerHTML = over20;\n\nfunction FunctionZ(valueF,\
  \ indexF, arrayF) {\n  return valueF > 20;\n}\n```\n\n45890,3459,23416,87625\n\n\
  # reduce() 方法\n\n`reduce()` 方法对所有数组元素进行函数调用并产生一个值。该方法在数组内部从左到右操作。它保持原始数组完整不变。\n\n\
  \n\n\n\n```javascript\nvar over20 = nums.reduce(FunctionZ);\n\ndocument.getElementById(\"\
  demo789\").innerHTML = over20;\n\nfunction FunctionZ(Total, valueF) {\n  return\
  \ Total + valueF;\n}\n```\n\n这是 JavaScript `Array.reduce()`。\n\n以下程序将通过过滤所有通过测试的数组元素来创建一个新数组。\n\
  \n`160433`\n\n```javascript\nvar nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625];\n\
  var over20 = nums.reduce(FunctionZ, 5000000000);\ndocument.getElementById(\"demo789\"\
  ).innerHTML = over20;\n\nfunction FunctionZ(Total, valueF) {\n  return Total + valueF;\n\
  }\n```\n\n这是 JavaScript `Array.filter()`。\n\n以下程序将通过过滤所有通过测试的数组元素来创建一个新数组。\n\n`5000160433`\n\
  \n### reduceRight() 方法\n\n`reduceRight()` 方法倾向于对数组的所有元素运行一个函数以产生一个值。该方法运行良好，从数组的右侧向左侧移动。最好的点是，你可以保持原始数组完\
  \ way。\n\n```javascript\nvar nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625900000];\n\
  var sum = nums.reduceRight(FunctionZ);\ndocument.getElementById(\"demo789\").innerHTML\
  \ = \"The Total sum of all the numbers is \" + sum;\n\nfunction FunctionZ(Total,\
  \ valueF) {\n  return Total + valueF;\n}\n```\n\n这是 JavaScript `Array.reduceRight()`。\n\
  \n以下程序将通过过滤所有通过测试的数组元素来创建一个新数组。\n\n所有数字的总和为 `87625972808`\n\n`Array.reduceRight()`\
  \ 在所有 Internet Explorer 8 或更早版本的浏览器中都能运行良好。\n\n### every() 方法\n\n`every()` 方法对数组进行彻底检查，以查看数组中的所有元素是否通过了测试。在下面的示例中，我将运行一个测试来查看所有元素是否大于\
  \ 500。\n\n```javascript\nvar nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625900000];\n\
  var Over500 = nums.every(FunctionZ);\ndocument.getElementById(\"demo789\").innerHTML\
  \ = \"Are all values bigger than 500: \" + Over500;\n\nfunction FunctionZ(valueF)\
  \ {\n  return valueF > 500;\n}\n```\n\n这是 JavaScript `Array.every()`。\n\n以下程序将显示测试结果。\n\
  \n`Are all values bigger than 500: false`\n\n现在我将故意让所有值都大于 500，看看结果是什么。\n\n```javascript\n\
  var nums = [45890, 1700, 3459, 1800, 2700, 6222, 23416, 87625900000];\nvar Over500\
  \ = nums.every(FunctionZ);\ndocument.getElementById(\"demo789\").innerHTML = \"\
  Are all values bigger than 500: \" + Over500;\n\nfunction FunctionZ(valueF) {\n\
  \  return valueF > 500;\n}\n```\n\n这是 JavaScript `Array.every()`。\n\n以下程序将显示测试结果。\n\
  \n`Are all values bigger than 500: true`\n\n### some() 方法\n\n有另一个方法用于检查数组中有多少值通过了测试。我将检查有多少个值通过了大于\
  \ 500 的测试。该方法可以接受多个参数，但因为我只需要一个，所以我坚持使用。你可以添加更多参数来筛选索引并产生整个数组。\n\n```javascript\n\
  var nums = [45890, 170, 345, 1800, 270, 622, 23416, 87625900000];\nvar Over500 =\
  \ nums.some(FunctionZ);\ndocument.getElementById(\"demo789\").innerHTML = \"Are\
  \ there some values bigger than 500: \" + Over500;\n\nfunction FunctionZ(valueF)\
  \ {\n  return valueF > 500;\n}\n```\n\n这是 JavaScript `Array.some()`。\n\n以下程序将显示测试结果。\n\
  \n`Are there some values bigger than 500: true`\n\n### indexOf() 方法\n\n`indexOf()`\
  \ 方法在数组中搜索指定的元素并返回第一次出现的位置。如果未找到元素，则返回 -1。\n\n```javascript\nvar nums = [45890,\
  \ 170, 345, 1800, 270, 622, 23416, 87625900000];\nvar p = nums.indexOf(622);\ndocument.getElementById(\"\
  demo789\").innerHTML = \"The position of 622 is: \" + p;\n```\n\n这是 JavaScript `Array.indexOf()`。\n\
  \n以下程序将显示元素的索引。\n\n`The position of 622 is 5`\n\n## lastIndexOf() 方法\n\n`lastIndexOf()`\
  \ 方法从右到左搜索数组并返回最后一次出现的位置。\n\n```javascript\nvar veggies = [\"Garlic\", \"Tomatoes\"\
  , \"Potatoes\", \"Tomatoes\", \"Pumpkin\"];\nvar a = veggies.lastIndexOf(\"Tomatoes\"\
  );\ndocument.getElementById(\"demo00\").innerHTML = \"Tomatoes are found at position\
  \ \" + a;\n```\n\n这是 JavaScript `Array.lastIndexOf()`。\n\n`Tomatoes are found at\
  \ position 3`\n\n### find() 方法\n\n`find()` 方法给你返回数组中第一个通过函数的项的值。\n\n```javascript\n\
  var nums = [444, 55544, 2333, 56666, 22, 876];\nvar a = nums.find(FunctionZ);\n\
  document.getElementById(\"demo00\").innerHTML = \"The number is bigger than 500\
  \ = \" + a;\n\nfunction FunctionZ(valueF) {\n  return valueF > 500;\n}\n```\n\n\
  这是 JavaScript `Array.find()`。\n\n`The number is bigger than 500 = 55544`\n\n###\
  \ findIndex() 方法\n\n`findIndex()` 方法将返回数组中第一个通过测试的元素的索引号。\n\n```javascript\nvar\
  \ nums = [444, 55544, 2333, 56, 22, 876];\nvar a = nums.findIndex(FunctionZ);\n\
  document.getElementById(\"demo055\").innerHTML = \"The index of the number that\
  \ is lower than 500 = \" + a;\n\nfunction FunctionZ(valueF) {\n  return valueF <\
  \ 500;\n}\n```\n\n这是 JavaScript `Array.findIndex()`。\n\n`The index of the number\
  \ that is lower than 500 = 0`\n\n\n\n\n\nJavaScript 的 `for` 循环包含一个语句和三个表达式。它有一个初始化部分，在\
  \ `for` 循环首次执行之前运行。该表达式用于创建计数器。你在此处创建的变量立即被作用化于 `for` 循环。一旦循环执行并到达逻辑终点，这些变量就会被销毁。\n\
  \nJavaScript `for` 循环的另一个重要部分是条件。`for` 循环在每次执行新迭代之前都会检查此表达式。如果你省略了这部分，表达式将被求值为为\
  \ `true`，并执行循环中的语句。如果求值为 `false`，循环将停止工作。\n\n循环的另一个重要部分是 `final-expression`。该表达式在每次迭代后运行。它用于递增计数器。不过，你也可以用它来减少计数器。循环的语句部分是在循环内部必须重复的代码。你可以根据需要从\
  \ `for` 循环中省略任何这些表达式。\n\nJavaScript 中的 `for` 循环用于计算数学数字或语句的迭代。它们也可以重复代码中的语句。只有在循环中插入\
  \ `break` 语句后，你才能退出循环。我将在接下来的章节中详细介绍 `break` 语句。\n\n循环之所以是特殊的，是因为它们避免了多次编写代码的麻烦。一旦你将代码包含在循环中，它就会重复。代码块应该重复多少取决于你在代码中包含的数字。此外，每次循环执行代码时，值都是不同的。因此，尽管代码有重复，但这种重复是按照适当的方法进行的。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"forloop-demo\"></p>\n<script>\n\
  var carsforsale = [\"Honda\", \"Toyota\", \"Vezel\", \"Fiat\", \"Volkswagen\"];\n\
  var msg = \"\";\nvar YY;\nfor (YY = 0; YY < carsforsale.length; YY++) {\n  msg +=\
  \ carsforsale[YY] + \"<br>\";\n}\ndocument.getElementById(\"forloop-demo\").innerHTML\
  \ = msg;\n</script>\n</body>\n</html>\n```\n\n本田\n丰田\nVezel\n菲亚\n大众\n\n在这个示例中，我创建了一个数组，然后添加了一个\
  \ `for` 循环来遍历数组的元素。`for` 循环遍历了数组中的项，并将它们整齐地显示在独立的行上。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p id=\"demo1\"></p>\n<script>\nvar msg = \"\";\nvar YY;\nfor (YY\
  \ = 0; YY < 3; YY++) {\n  msg += \"The next number you will have to add to the list\
  \ is \" + YY + \"<br>\";\n}\ndocument.getElementById(\"demo1\").innerHTML = msg;\n\
  </script>\n</body>\n</html>\n```\n\n你需要添加到列表的下一个数字是 0\n你需要添加到列表的下一个数字是 1\n你需要添加到列表的下一个数字是\
  \ 2\n\n在这个示例中，第一个语句在循环启动之前就设置了一个变量。第二个语句定义了该循环运行的正确条件。根据该条件，循环的运行次数不能超过三次。每当 `for`\
  \ 循环执行代码时，第三个语句都会通过 `YY++` 增加变量的值。\n\n通常，你需要使用第一个语句来初始化循环中的变量。然而，并不总是如此。JavaScript\
  \ 并不强制从第一个语句开始。你可以跳过它，并在第一个语句中初始化不同的值。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p id=\"demo1\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"Fortuner\", \"Sportage\"\
  , \"Sorento\"];\nvar YY, length, msg;\nfor (YY = 0, length = carsforsale.length,\
  \ msg = \"\"; YY < length; YY++) {\n  msg += carsforsale[YY] + \"<br>\";\n}\ndocument.getElementById(\"\
  demo1\").innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\nVezel\nFortuner\n\
  Sportage\nSorento\n\n你也可以跳过第一个语句，就好像你的值在循环启动之前已经设置好了。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p id=\"demo1\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"\
  Fortuner\", \"Sportage\", \"Sorento\"];\nvar YY = 0\nvar length = carsforsale.length\n\
  var msg = \"\"\nfor (; YY < length; YY++) {\n  msg += carsforsale[YY] + \"<br>\"\
  ;\n}\ndocument.getElementById(\"demo1\").innerHTML = msg;\n</script>\n</body>\n\
  </html>\n```\n\nVezel\nFortuner\nSportage\nSorento\n\n`for` 循环中的第二个语句通常用于评估起始变量的条件。然而，这并不总是如此。JavaScript\
  \ 不再关心这些了。第二个语句是可选的。如果第二个语句返回 `true`，循环将重新开始。如果返回其他值，循环将结束。如果省略了第二个语句，你必须在循环中插入一个\
  \ `break`。否则，循环将变成无限循环。你永远无法停止它。无限循环对你来说是一个死胡同，因为当用户打开包含无限循环的网站时，他们的浏览器将会崩溃。用户可能还会返回你的网站。\n\
  \n第三个语句递增起始变量的值。然而，第三个语句是可选的。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"\
  demo1\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"Fortuner\", \"Sportage\"\
  , \"Sorento\"];\nvar YY = 0\nvar length = carsforsale.length\nfor (; YY < length;\
  \ YY++) {\n  msg += carsforsale[YY] + \"<br>\";\n}\ndocument.getElementById(\"demo1\"\
  ).innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\nVezel\nSportage\n\n最需要记住的是，计数器\
  \ `YY` 可以是任何名称。它随着迭代递增。\n\n### `for...in` 循环\n\n另一种 `for` 循环类型是 `for...in`。`for...in`\
  \ 循环遍历对象的属性。\n\n#### JavaScript For/In 循环\n\n`for...in` 循环遍历对象的属性。大多数程序员使用 `i` 作为变量。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript For/In Loop</p>\n\
  <p>Our for/in loops through all the properties of the object.</p>\n<p id=\"demo1\"\
  ></p>\n<script>\nvar msg = \"\";\nvar car = {name:\"Honda\", model:\"Vezel\", year:2020,\
  \ make:\"Japan\"};\nvar YY;\nfor (YY in car) {\n  msg += car[YY] + \" \";\n}\ndocument.getElementById(\"\
  demo1\").innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript For/In\
  \ 循环\n\n我们的 for/in 循环遍历了对象的所有属性。\n\nHonda Vezel 2020 Japan\n\n\n\n\n如果你非常在意索引的顺序，那么你应该放弃使用\
  \ `for` 循环遍历数组的想法。顺序与实现方式无关。你无法按照预期的顺序访问数组的值。当你认为顺序很特殊时，使用 `for of` 循环、`for` 循环和\
  \ `Array.forEach()` 对你来说更重要且更好。\n\n## forEach() 循环\n\n该方法会为数组的每个元素调用一次函数，也称为回调函数。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript Array.forEach() 循环</p>\n\
  <p>此程序将为数组的每个元素调用一次函数。</p>\n<p id=\"demo5\"></p>\n<script>\nvar msg = \"\";\nvar\
  \ nums = [55545, 454, 1239, 78816, 45625];\nnums.forEach(FunctionYZ);\ndocument.getElementById(\"\
  demo5\").innerHTML = msg;\n\nfunction FunctionYZ(fvalue, findex, farray) {\n  msg\
  \ = msg + fvalue + \"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n### 学习 JavaScript\
  \ Array.forEach() 循环\n\n此程序将为数组的每个元素调用一次函数。\n\n55545\n454\n1239\n78816\n45625\n\n\
  上述代码中的函数通常接受三个参数。第一个参数是项目的值。第二个参数是项目的索引，第三个参数是数组本身。由于示例仅使用了值参数，你可以按照以下模式对其重写。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript Array.forEach() 循环</p>\n\
  <p>此程序将为数组的每个元素调用一次函数。</p>\n<p id=\"demo5\"></p>\n<script>\nvar msg = \"\";\nvar\
  \ nums = [55545, 454, 1239, 78816, 45625];\nnums.forEach(FunctionYZ);\ndocument.getElementById(\"\
  demo5\").innerHTML = msg;\n\nfunction FunctionYZ(fvalue) {\n  msg = msg + fvalue\
  \ + \"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n### 学习 JavaScript Array.forEach()\
  \ 循环\n\n此程序将为数组的每个元素调用一次函数。\n\n55545\n454\n1239\n78816\n45625\n\n我排除了 `fvalue` 之外的所有参数，仍然得到了相同的结果。\n\
  \n## for/of 循环\n\nJavaScript 中还有另一种类型的 for 循环，被称为 `for/of` 语句。该语句遍历可以迭代的特定对象的值。此语句允许你遍历各种数据结构，如\
  \ `Maps`、`Arrays`、`NodeLists` 和 `Strings`。\n\n当迭代开始时，下一个属性的值会自动分配给变量。JavaScript\
  \ 中的变量使用 `var`、`const` 和 `let` 关键字声明。我们已经在之前的章节中涵盖了所有主题。\n\nSafari 7、Chrome 38、Opera\
  \ 25、Edge 12 和 Firefox 51 是目前支持 `for/of` 语句的浏览器。Internet Explorer 不支持它。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>这些是 JavaScript For/Of 循环</p>\n<p>for/of 语句将遍历你可以迭代的对象的所有值。</p>\n\
