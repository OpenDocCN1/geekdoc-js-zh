  ```\n\n## 列表 15-23：添加动画\n\n为左轴制作动画非常简单：我们只需要在绘制轴之前在其容器上调用 `transition` ❶，这样左轴就会在每次比例尺发生变化时进行过渡（这只有在最大的条形被隐藏或取消隐藏时才会发生，这会改变范围的上限）。\n\
  \n要为条形制作动画，我们遵循标准做法，切换到高级 join 技术并为进入（entering）、更新（updating）和退出（exit）元素添加过渡。进入元素开始时设置了所有属性且透明度为\
  \ 0（意味着它们是 100%透明的）❷。然后我们调用 `transition` 并动画到 100%不透明 ❸，这实现了进入元素淡入的效果。更新元素保持相同的颜色和透明度，但它们的位置和尺寸可能会发生，因此我们对所有这些进行动画\
  \ ❹。这会将更新的元素拉伸并滑动到它们的新尺寸和位置。退出元素与进入元素相反，会淡出，我们通过将它们的透明度过渡回 0 ❺ 来实现。记住，在过渡完成后我们还必须对任何退出元素调用\
  \ `remove` ❻。\n\n重新加载页面并尝试隐藏和取消隐藏各种许可证。图例中的第一个许可证始终对应于 Star 数最多的仓库（因为仓库是按此排序的，而且我们按顺序从仓库中提取许可证名称），所以如果你想看到左轴调整大小，你需要关闭该许可证。你应该看到带有该许可证的仓库淡出，其他仓库扩展以填充空间和重新计算的比例尺。图\
  \ 15-6(a) 显示了显示所有许可证的图表，图 15-6(b) 显示了隐藏了 MIT 许可证（编写时，数据集中最流行的许可证）的图表。\n\n![](img/Figure_15-6.png)\n\
