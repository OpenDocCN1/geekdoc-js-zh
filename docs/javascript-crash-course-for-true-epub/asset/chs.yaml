  \ `[\"C3\", \"E4\"]` ❷。这对音符将保持原封不动地传递给 `triggerAttackRelease` 方法，其效果是同时播放两个音符，就像我们其他的多音合成器示例一一样。\n\
  \n最后，我们调用了 `.start(\"0:0:0\")` ❸，它的效果是立即播放此部分。例如，如果我们改用 `.start(\"1:0:0\")`，那么旋律将在一个小节的停顿后开始。为每个时间/音符对给的时间是相对于传递给\
  \ `start` 方法的时间。\n\n当你运行这个示例时，你应该能听到“玛丽有一只小羊”的开头。\n\n### 制作鼓声\n\n大多数电子音乐都有某种鼓点节奏。用于制作节奏的鼓声可以来自音频文件，也可以是合成的。在这里我们将使用后一种技术。鼓点节奏的核心围绕三个组件构建：大音鼓（“boom”声）、小军鼓（“bah”声）和镲片（“ti”声）。在本节中，你将学习合成这些声音的技术。\n\
  \n#### 镲片合成\n\n现实世界中的镲片由两个面对面的镲片组成。顶部的镲片连接到一个踏板上，这样鼓手可以让两个镲片接触或分开。我们在这里追求的是一种闭合（镲片接触）的声音。当你用鼓棒击打闭合镲片时，它们会发出一种迅速消失的高频噪音。\n\
  \n我们将通过使用一种不同的合成器 `NoiseSynth` 来生成白噪声，而不是带音高的音符，来近似这一点。在信号处理中，`white noise` 是在所有频率上都具有等强度分量的随机信号。我们将给\
  \ `NoiseSynth` 提供一个幅度包络，以模拟用棒击打镲片时的突然冲击。最后，我们将噪声通过 `filter` —— 一种允许某些频率通过同时降低其他频率水平的设备\
  \ —— 来消除低频，并使其听起来更高、更像镲片。\n\n首先，我们将设置 `NoiseSynth` 和包络，并在循环中播放镲片声。使用 Listing 12-16\
  \ 中的代码更新你的 `script.js`。\n\n```\n--snip--\n  Tone.start();\n\n❶ let hiHat = new Tone.NoiseSynth({\n\
  \    envelope: {\n      attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n\
  \    volume: -6\n  }).toDestination();\n\n❷ new Tone.Loop(time => {\n    hiHat.triggerAttackRelease(\"\
  16n\", time);\n  }, \"8n\").start(\"0:0\");\n\n  Tone.Transport.start();\n});\n\
  ```\n\nListing 12-16: 镲片声的开始\n\n我们首先设置 `NoiseSynth` 和包络，并在循环中播放镲片声。我们首先创建一个新的 `NoiseSynth`\
  \ ❶，带有一个包络和 -6 分贝的音量。由于 sustain 和 release 都被设置为 0，声音在初始攻击（0.001 秒）和衰减（0.1 秒）后会立即结束。接下来，我们使用\
  \ `Tone.Loop` 播放八分音符 ❷。注意 `Noise` 的 `triggerAttackRelease` 不接受音名，因为噪声没有音高。它在“0:0”处开始。\n\
  \n当你运行这个示例时，你应该听到一段镲片声。它听起来还不完美，因为我们还没有添加滤波器。我们将在[Listing 12-17]中完成这一点。\n\n```\n\
  --snip--\n  Tone.start();\n\n❶ let hiHatFilter = new Tone.Filter(15000, \"bandpass\"\
  ).toDestination();\n\n  let hiHat = new Tone.NoiseSynth({\n    envelope: {\n   \
  \   attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n    volume: -6\n\
  \  }).connect(hiHatFilter);\n\n  new Tone.Loop(time => {\n    hiHat.triggerAttackRelease(\"\
  16n\", time);\n  }, \"8n\").start(\"0:0\");\n```\n\nListing 12-17: 为镲片应用滤波器\n\n\
  首先，我们使用 `Tone.Filter` 创建了一个带通滤波器 ❶。这种滤波器只允许特定频率周围的频率通过。在这种情况下，我们告诉滤波器通过 15000 Hz（即\
  \ 15 kHz）周围的频带，同时消除其他频率。人类的听觉范围大约是 20 Hz 到 20 kHz，因此我们的滤波器允许噪声的高频部分通过。\n\n在[Listing\
  \ 12-16]中，我们对 `NoiseSynth` 使用 `toDestination()` 直接连接到输出。在[Listing 12-17]中，我们改为将滤波器连接到输出\
  \ ❶，然后将合成器连接到滤波器 ❷。这意味着合成器的声音在通过扬声器或耳机输出之前经过了滤波。\n\n#### 小军鼓合成\n\n在本节中，我们将合成小军鼓。小军鼓有一组靠在底部鼓面的金属丝（称为\
  \ *snare*），在击打鼓面时它们会对着鼓面响动。这使其产生了一个相对复杂的声音，由一些噪音一些更具音色的声音组成。为了模拟这一点，我们将使用两个独立的声源：一个噪声合成器和一个固定频率的普通合成器。两者都将具有短促的幅度包络以营造打击感，我们还将通过带通滤波器处理声音的噪声部分，使小军鼓听起来比镲片低。我们将创建一个新的\
  \ `Snare` 类来封装这些细节，如 Listing 12-18 所示。\n\n\n\n\n\n```\n--snip--\n  new Tone.Loop(time\
  \ => {\n    hiHat.triggerAttackRelease(\"16n\", time);\n  }, \"8n\").start(\"0:0:0\"\
  ).stop(\"4:0:0\");\n\n  class Snare {\n    constructor() {\n    ❶ this.noiseFilter\
  \ = new Tone.Filter(5000, \"bandpass\").toDestination();\n    ❷ this.noiseSynth\
  \ = new Tone.NoiseSynth({\n        envelope: {\n          attack: 0.001, decay:\
  \ 0.1, sustain: 0, release: 0\n        },\n        volume: -12\n      }).connect(this.noiseFilter);\n\
  \n    ❸ this.synth = new Tone.Synth({\n        envelope: {\n          attack: 0.0001,\
  \ decay: 0.1, sustain: 0, release: 0\n        },\n        oscillator: {type: \"\
  sine\"},\n        volume: -12\n      }).toDestination();\n    }\n\n    ❹ triggerAttackRelease(duration,\
  \ when) {\n      this.noiseSynth.triggerAttackRelease(duration, when);\n      this.synth.triggerAttackRelease(\"\
  G3\", duration, when);\n     }\n    }\n\n❺ let snare = new Snare();\n\n❻ new Tone.Loop(time\
  \ => {\n    snare.triggerAttackRelease(\"16n\", time);\n  }, \"2n\").start(\"0:1:0\"\
  ).stop(\"4:0:0\");\n\n  Tone.Transport.start();\n});\n```\n\nListing 12-18：合成小军鼓\n\
  \n从高层级来看，`Snare` 类有两个方法：`constructor` 和 `triggerAttackRelease`。`constructor` 创建了一个滤波器和两个合成器。`triggerAttackRelease`\
  \ 方法调用这两个合成器的 `triggerAttackRelease` 方法以让它们同时播放。\n\n在 `constructor` 中，我们首先创建了滤波器\
  \ ❶ 和 `noiseSynth` ❷。这与我们创建 `hi-hat`（镲片）的方式非常相似，只是我们对 `bandpass` 滤波器使用了 `5,000`\
  \ Hz 的频率，以反映小军鼓较低的声音。接下来，我们创建了带音高的合成器 ❸，它使用的幅度包络与 `noiseSynth` 类似，但攻击时间更短，以模拟小军鼓的声音（在真实的小军鼓中，军鼓弦是由鼓皮的震动触发的，因此它们会略后于鼓声）。`synth`\
  \ 配置了一个 `sine` 正弦波振荡器。由于我们要同时播放这两个合成器，我们给每个合成器设置了 `–12` 的音量，产生的整体音量与 `hi-hat` 相似。\n\
  \n`triggerAttackRelease` 方法 ❹ 只需要一个 `duration`（时长）和一个 `when` 参数。这些参数被传递给底层合成器的 `triggerAttackRelease`\
  \ 方法。当我们触发音高合成器时，我们给它一个音名 `\"G3\"`，这是我为小军鼓调定的音高。音高合成器的加入虽然微妙，但它让鼓声听起来更真实。\n\n接下来，我们实例化该类\
  \ ❺，最后创建了一个新的 `Tone.Loop` 对象 ❻。这个循环的长度是 `hi-hat` 循环的四倍（使用 `\"2n\"` 而不是 `\"8n\"`，或者说用二分符代替八分符），并且在四分音符后开始。这意味着每个小节的第二拍和第四拍都会有一个小军鼓击声。当你运行这个示例时，你应该每隔八分音符听到一次\
  \ `hi-hat`，每两个四分音符听到一次小军鼓。\n\n### 底鼓合成\n\n最后一个要合成的鼓声是底鼓。底鼓比小军鼓大得多，而且它没有那种会产生嘈杂声的军鼓弦。底鼓的声音相当复杂，但幸运的是\
  \ `Tone.js` 有一个名为 `MembraneSynth` 的合成器，可以很好地模拟它。这个合成器获取一个普通的振荡器并在短时间内降低其频率，当设置正确时，它听起来就非常像底鼓。`Listing\
  \ 12-19` 展示了如何实现。\n\n```\n--snip--\n  new Tone.Loop(time => {\n    snare.triggerAttackRelease(\"\
  16n\", time);\n  }, \"2n\").start(\"0:1:0\").stop(\"4:0:0\");\n\n  let kick = new\
  \ Tone.MembraneSynth({\n  ❶ pitchDecay: 0.02,\n    octaves: 6,\n    volume: -9\n\
  \  }).toDestination();\n\n❷ new Tone.Loop(time => {\n    kick.triggerAttackRelease(50,\
  \ \"16n\", time);\n  }, \"2n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\nListing 12-19：合成底鼓\n\n`MembraneSynth` 的选项包括 `pitchDecay`（音高衰减）❶，它以秒为单位指定频率变化的速度；以及\
  \ `octaves`（八度），它指定了在该时间内频率下降的几个八度。在我们的循环 ❷ 中，我们以 `50` Hz 的频率触发合成器。这个循环与小军鼓循环具有相同的\
  \ `\"2n\"` 时长，但从时间零开始，这意味着底鼓声和小军鼓声将每隔四分音符交替出现，产生经典的摇滚鼓点。当你运行这个示例时，你可能会识别出它是许多歌曲的基础鼓点模式。\n\
  \n### 回混\n\n`reverb`（`reverberation` 的缩写）是一种让音乐听起来像是在房间或更大的封闭空间内播放的效果。现实世界的声音在房间墙壁间反射时产生的随机回声正是这种混响的来源。混响让每个声音需要一点时间才会消失，这会让我们的鼓声听起来更真实。我们可以通过\
  \ `Tone.Reverb` 添加混响，正如你在 `Listing 12-20` 中看到的那样。\n\n```\n--snip--\n  Tone.start();\n\
  \n  let reverb = new Tone.Reverb({\n    decay: 1,\n    wet: 0.3\n  }).toDestination();\n\
  \n  let hiHatFilter = new Tone.Filter(15000, \"bandpass\").connect(reverb);\n\n\
  \  let hiHat = new Tone.NoiseSynth({\n    envelope: {\n      attack: 0.001, decay:\
  \ 0.1, sustain: 0, release: 0\n    },\n    volume: -6\n  }).connect(hiHatFilter);\n\
  \n  new Tone.Loop(time => {\n    hiHat.triggerAttackRelease(\"16n\", time);\n  },\
  \ \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  class Snare {\n    constructor()\
  \ {\n      this.noiseFilter = new Tone.Filter(5000, \"bandpass\").toDestination();\n\
  \      this.noiseSynth = new Tone.NoiseSynth({\n        envelope: {\n          attack:\
  \ 0.001, decay: 0.1, sustain: 0, release: 0\n        },\n        volume: -12\n \
  \     }).connect(this.noiseFilter);\n\n      this.synth = new Tone.Synth({\n   \
  \     envelope: {\n          attack: 0.0001, decay: 0.1, sustain: 0, release: 0\n\
  \        },\n        oscillator: {type: \"sine\"},\n        volume: -12\n      }).toDestination();\n\
  \    }\n\n    triggerAttackRelease(duration, when) {\n      this.noiseSynth.triggerAttackRelease(duration,\
  \ when);\n      this.synth.triggerAttackRelease(\"G3\", duration, when);\n    }\n\
  \  }\n\n  let snare = new Snare();\n\n  new Tone.Loop(time => {\n    snare.triggerAttackRelease(\"\
  16n\", time);\n  }, \"2n\").start(\"0:1:0\").stop(\"4:0:0\");\n\n  let kick = new\
  \ Tone.MembraneSynth({\n    pitchDecay: 0.02,\n    octaves: 6,\n    volume: -9\n\
  \  }).toDestination();\n\n  new Tone.Loop(time => {\n    kick.triggerAttackRelease(50,\
  \ \"16n\", time);\n  }, \"2n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n\
  });\n```\n\nListing 12-20：添加混响\n\n首先我们创建混响效果。`decay` 设置描述了声音停止后混响持续的时间（以秒为单位）。这个数字越大，回声越明显。`wet`\
  \ 设置指定了与原始声音相比的混响声比例。在这种情况下，`0.3` 意味着效果的输出是 30% 的混响和 70% 的原始声音。`wet` 设置越高，混响效果就越突出。\n\
  \n`Listing 12-20` 中的其余更改是将所有的 `toDestination()` 替换为 `connect(reverb)`。这样，所有的鼓声在发送到输出设备之前都会经过混响效果的处理。当你运行这个示例时，鼓声听起来会更像是在房间里播放的。你可以通过增加\
  \ `wet` 的值（例如改为 `0.6`）或增加 `Tone.Reverb` 设置中的 `decay` 来使效果更加显著。\n\n### 鼓点循环\n\n现在我们已经设置好了鼓声，如果能有一个更简单的方法来触发它们就好了。理想情况下，我们希望通过编写类似下面的代码来创建一个鼓点：\n\
  \n\n\n\n\n```\nkick:  x…x…\nsnare: ..x…x.\nhiHat: xxxxxxxx\n```\n\n然后我们可以让 JavaScript\
  \ 来工作，将该表示法转换为 `Tone.js` 可以理解的代码。在这里，每个 `x` 代表音符，每个点（`.`）代表空白，每一列代表一个八分音符。例如，在第一个八分音符中，`kick`\
  \ 和 `hi-hat` 播放，第二个中只有 `hi-hat` 播放，第三个中 `snare` 和 `hihat` 播放，依此类推。这里显示的模式与我们在前面的章节中构建的鼓点节奏相匹配。\n\
  \n为了实现这一点，我们将创建一个辅助函数，将由 `x` 和点组成的字符串转换为 `Tone.Sequence` 传输辅助函数可以使用的值数组。回想一下，`Tone.Sequence`\
  \ 接收音符名称数组并按顺序重复播放它们，其中 `null` 用于表示止符。我们的函数应该将点转换为 `null`，而保持 `x` 不变。\n\n> <samp\
  \ class=\"SANS_Dogma_OT_Bold_B_21\">NOTE</samp>\n\n*由于鼓声没有音符名称，任何字符串实际上对 `Tone.Sequence`\
  \ 来说都可以代表一次鼓击打击（我们只是为了方便而使用 `x`）。唯一重要的是它不是 `null`。*\n\n列表 12-21 显示了该函数的定义。将其添加到你的\
  \ `script.js` 文件中，放在现有的鼓点代码之前。\n\n```\n--snip--\n  Tone.start();\n\n  // 将字符串转换为音符或\
  \ null 的数组。\n  // 字符串中的点变成数组中的 null 并保持静音。\n  function mkSequence(pattern) {\n \
  \   return pattern.split(\" \").map(value => {\n      if (value == \".\") {\n  \
  \      return null;\n      } else {\n        return value;\n      }\n    });\n \
  \ }\n\n  let reverb = new Tone.Reverb({\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 12-21: mkSequence 辅助函数</samp>\n\n`mkSequence` 函数接收像 `\"x…x…\"` 这样的字符串并将其转换为字符串和\
  \ `null` 的数组，例如 `[\"x\", null, null, null, \"x\", null, null, null]`，这是 `Tone.Sequence`\
  \ 需要的格式。它使用 `split` 方法将字符串拆分为单个字符数组，并使用数组的 `map` 方法通过为每个字符调用函数创建一个新数组。如果字符是 `.`，它在新数组中将其替换为\
  \ `null`。否则，它原样传递该字符。\n\n接下来，我们将创建传递此函数的字符串，如列表 12-22 所示。在 `mkSequence` 函数定义之后添加此代码。\n\
  \n```\n--snip--\n  }\n\n  let drumPattern = {\n    kick:  \"x…x…\",\n    snare:\
  \ \"..x…x.\",\n    hiHat: \"xxxxxxxx\",\n  };\n\n  let reverb = new Tone.Reverb({\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 12-22: 定义\
  \ drumPattern</samp>\n\n我们将这三个字符串存储在一个名为 `drumPattern` 的对象中以便保持整齐。我添加了空格来对齐字符串，以便更容易查看模式。\n\
  \n最后，我们将使用辅助函数和 `Tone.Sequence` 来替我们现有的三个 `Tone.Loop` 调用，如列表 12-23 所示。\n\n```\n\
  --snip--\n  }).connect(hiHatFilter);\n\n  new Tone.Sequence(time => {\n    hiHat.triggerAttackRelease(\"\
  16n\", time);\n  }, mkSequence(drumPattern.hiHat), \"8n\").start(\"0:0:0\").stop(\"\
  4:0:0\");\n\n  class Snare {\n--snip--\n  let snare = new Snare();\n\n   new Tone.Sequence(time\
  \ => {\n    snare.triggerAttackRelease(\"16n\", time);\n  }, mkSequence(drumPattern.snare),\
  \ \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n  let kick = new Tone.MembraneSynth({\n\
  \    pitchDecay: 0.02,\n    octaves: 6,\n    volume: -9\n  }).connect(reverb);\n\
  \n   new Tone.Sequence(time => {\n    kick.triggerAttackRelease(50, \"16n\", time);\n\
  \  }, mkSequence(drumPattern.kick), \"8n\").start(\"0:0:0\").stop(\"4:0:0\");\n\n\
  \  Tone.Transport.start();\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 12-23: 在 Tone.Sequence 中使用 mkSequence</samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >替代 Tone.Loop</samp>\n\n在这里，我们用新的 `Tone.Sequence` 调用替换了每个 `Tone.Loop` 调用。在每种情况下，我们都调用\
  \ `mkSequence` 并传递 `drumPattern` 对象中的一个字符串，这将创建一个由 `x` 和 `null` 的数组。该调用的结果被传递给 `Tone.Sequence`\
  \ 辅助函数，我们用它来触发相应的鼓声。再次，`Tone.Sequence` 将将任何字符串（如 `\"x\"`）解释为鼓击打击的相应音符名称，而 `null`\
  \ 代表静音。`Tone.Sequence` 的最后一个参数 `\"8n\"` 意味着鼓点模式字符串中的每个点或 `x` 代表一个八分音符。\n\n如果你现在重新加载页面，应该能听到与之前相同的鼓点节奏。这看起来似乎为了获得相同的输出做了很多工作，但现在我们有了更大的灵活性来编写不同的鼓点模式，并且根据需要方便地修改它们。尝试在\
  \ `drumPattern` 的字符串中添加一些额外的军鼓或底鼓音符，听听效果如何。\n\n### <samp class=\"SANS_Futura_Std_Bold_B_11\"\
  >使用采样</samp>\n\n电子音乐的重要部分是*采样*（sampling）：使用现有音频片段来构建一首新作品。一种常用技术是修改采样的播放速度来改变其音高，这样单个采样就可以用于多个音符。如果你曾经加速过某人声音的录音让它听起来像松鼠一样高频，或者减慢速度让它听起来低沉...\n\
  \n\n\n\n\n列表 12-24：创建一个采样器\n\n我们通过将一个配置对象传递给 `Tone.Sampler` 构造函数创建一个采样器。在这个示例中，配置对象包含五个属性。第一个属性\
  \ `urls` 包含一个将音名名称映射到文件名的对象。例如，我们表示音名 `C5` 对应文件名 `trumpet-c5.mp3`。接下来，`baseUrl`\
  \ 定义了所有 URL 的共享前缀，这避免了我们为每个样本编写完整的 URL。所有的 URL 都在同一个 S3 桶中，因此我们可以使用它作为基础 URL，然后只需在\
  \ `urls` 中提供文件名。\n\n采样器乐器在播放样本时不会应用完整的 ADSR 包络，但它确实允许你设置攻击时间（attack，淡入速度）和释放时间（release，淡出速度）。我们使用了瞬时攻击（因为样本本身已经有了自己的攻击时间）以及长达一秒的释放时间。我们还把\
  \ `volume` 设置为 `-24 dB`，以免采样器的声音太大。最后，`onload` 属性允许我们在所有样本下载完成后指定要执行的操作。在本示例中，我们调用\
  \ `triggerAttackRelease` 来播放一个三音和弦。注意，`Tone.Sampler` 默认是多声的，因此它可以同时播放多个样本。\n\n当你运行这个示例时，仍然会听到鼓声。一旦样本加载，你还应该听到由小号采样器播放的\
  \ C 大和弦。这里值得注意的一个有趣点是，尽管我们为音符 `C5` 提供了样本，但我们没有为 `E5` 或 `G5`（C 大和弦中的其他音）提供样本。当我们告诉采样器播放这些音符时，它会选择最提供的样本，并通过改变播放速度来移动其音高。例如，距离\
  \ `G5` 最近的样本音高是 `F5`，因此该样本将稍微加快速度，使其听起来像 `G5`。只要我们尝试播放的音符与提供的样本不是太远，听起来就会很正常。然而，如果我们推得太远，结果将不会那么真实。例如，尝试通过将音符设置为\
  \ `C6`、`E6` 和 `G6` 来提高音高一个八度。它们现在听起来会开始有些滑稽。此外，由于样本是以两倍速度播放的，它们的持续时间减半，因此它们无法持续应有的整个小节（高音会因为播放得快而提前结束）。你也可以反过来操作，将音符设置为\
  \ `C4`、`E4` 和 `G4`。这次持续时间就不是问题了，因为样本为了降低音高而播放得较慢，但音符听起来仍然不会那么真实。\n\n### 总结\n\n在本章中，你学习了如何使用\
  \ Web Audio API 制作声音和音乐，并了解了使用像 `Tone.js` 这样的库如何通过隐藏许多底层细节来让你的生活变得简单得多。你还学习了许多使用\
  \ `Tone.js` 库进行声音合成和采样的技巧。如果某些音乐细节你没听懂，不要担心。这里最重要的是习惯与新的 JavaScript API 和库一起工作。我们将在下一章中运用这些内容，届时我们将使用在本章中创建的乐器编写一首真正的歌曲！\n\
  \n## 13 编写一歌曲\n\n![](img/opener.png)\n\n你已经学习了足够关于 `Tone.js` 基础和声音合成的知识，可以编写一首简单的歌曲了。我们的歌曲将由几个乐器组成：我们在上一章中开发的鼓、小号采样器、两个不同的合成器贝斯部分以及在另一个合成器上播放的一些和弦。\n\
  \n### 组织工作\n\n我们的歌曲将重用上一章的大部分代码，但我们将对其重新组织，以便更容易跟踪歌曲是如何构建的。`index.html` 文件与第 12\
  \ 章完全相同，但我们将从一个新的 `script.js` 文件开始，并将其组织为四个逻辑部分：\n\n- **Instruments（乐器）**：用于实例化和设置乐器\n\
  - **Sequencing（序列）**：用于创建要播放的循环音符序列\n- **Song（歌曲）**：用于调度每个序列的开始和结束\n- **Event Handling（事件处理）**：处理启动歌曲播放的点击事件的代码\n\
  \n我们将用多行注释标记这四个部分中的每一个部分，以便 `script.js` 文件更易导航。列表 13-1 显示了这些注释的样子。你现在可以按顺序将它们添加到文件中。\n\
  \n```\n/////////////////\n// Instruments //\n/////////////////\n\n////////////////\n\
  // Sequencing //\n////////////////\n\n//////////\n// Song //\n//////////\n\n////////////////////\n\
  // Event Handling //\n////////////////////\n```\n\n列表 13-1：界定 script.js 主要部分的注释\n\
  \n在整个章节中，随着我们构建歌曲，我会要求你将每段新代码添加到特定部分的末尾。这些注释将使你能够快速地找到新代码应该放在的位置。\n\n### Event Handling（事件处理）\n\
  \n让我们从编写 `script.js` 的事件处理部分开始。这段代码与我们在上一章开头编写的代码几乎完全相同：它创建了一个点击事件监听器，当用户点击按钮时切换\
  \ Play 按钮和“Playing”段落的样式，并执行启动歌曲所需的 `Tone.js` 调用。请在事件处理部分中输入列表 13-2 的内容。\n\n```\n\
  ////////////////////\n// Event Handling //\n////////////////////\n\nlet play = document.querySelector(\"\
  #play\");\nlet playing = document.querySelector(\"#playing\");\n\nplay.addEventListener(\"\
  click\", () => {\n  // 隐藏此按钮\n  play.style = \"display: none\";\n  playing.style\
  \ = \" \";\n\n  Tone.start();\n\n  // 修改此处以从歌曲的不同部分开始播放\n  Tone.Transport.position\
  \ = \"0:0:0\";\n  Tone.Transport.start();\n});\n```\n\n列表 13-2：事件处理代码\n\n这段代码与列表\
  \ 12-2 相比的一个重要区别是，我们在调用 `Tone.Transport.start()` 之前使用 `Tone.Transport.position`\
  \ 来设置传输的起始位置。在这里我们将起始位置设置为 `\"0:0:0\"`，这是默认值，所以这个调用并不是严格必要的。然而，包含这行代码使得当你每次向歌曲添加新元素时不需要听整首歌就能轻松修改起始位置。例如，如果你想跳过前\
  \ 20 小节，可以将 `Tone.Transport.position` 的值改为 `\"20:0:0\"`。\n\n与上一章不同，创建乐器和序列的所有都位于事件处理程序之外。这些代码可以在用户按下\
  \ Play 之前执行。只有 `Tone.start()` 调用必须在处理程序内部，以确保歌曲正常工作。如果我们愿意，可以将 `Tone.Transport`\
  \ 的行移动到处理程序之外，但让它们出现在 `Tone.start` 之后感觉更自然。\n\n### 制作鼓点（Making the Drumbeat）\n\n\
  现在让我们创建一个作为歌曲背景的鼓点。我们将使用在上章中创建的同样的��片、军鼓和底鼓声。首先我们声明这些乐器，如列表 13-3 所示。将此代码添加到 `script.js`\
  \ 的 Instruments 部分。\n\n\n\n\n\n```\n/////////////////\n// Instruments //\n/////////////////\n\
  \nfunction mkDrums() {\n  let reverb = new Tone.Reverb({\n    decay: 1,\n    wet:\
  \ 0.3\n  }).toDestination();\n\n  let hiHatFilter = new Tone.Filter(15000, \"bandpass\"\
  ).connect(reverb);\n\n  let hiHat = new Tone.NoiseSynth({\n    envelope: {\n   \
  \   attack: 0.001, decay: 0.1, sustain: 0, release: 0\n    },\n    volume: -6\n\
  \  }).connect(hiHatFilter);\n\n  class Snare {\n    constructor() {\n      this.noiseFilter\
  \ = new Tone.Filter(5000, \"bandpass\").connect(reverb);\n      this.noiseSynth\
  \ = new Tone.NoiseSynth({\n        envelope: {\n          attack: 0.001, decay:\
  \ 0.1, sustain: 0, release: 0\n        },\n        volume: -12\n      }).connect(this.noiseFilter);\n\
  \n      this.synth = new Tone.Synth({\n        envelope: {\n          attack: 0.0001,\
  \ decay: 0.1, sustain: 0, release: 0\n        },\n        oscillator: {type: \"\
  sine\"},\n        volume: -12\n      }).connect(reverb);\n    }\n\n    triggerAttackRelease(duration,\
  \ when) {\n      this.noiseSynth.triggerAttackRelease(duration, when);\n      this.synth.triggerAttackRelease(\"\
  G3\", duration, when);\n    }\n  }\n\n  let snare = new Snare();\n\n  let kick =\
  \ new Tone.MembraneSynth({\n    pitchDecay: 0.02,\n    octaves: 6,\n    volume:\
  \ -9\n  }).connect(reverb);\n\n  return {hiHat, snare, kick};\n}\n\nlet drums =\
  \ mkDrums();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >示例 13-3: 声明鼓组</samp>\n\n这段代码与我们在上一章中编写的代码完全相同，但为了保持代码整洁，我将所有的鼓组设置代码（包括混响效果）移动到了名为\
  \ `mkDrums`（代表“制作鼓”）的单一函数中 ❶。该函数返回一个包含三个鼓的对象 ❷。我们正在使用创建这种对象的新语法，称为`对象字面量简写语法`。使用这种简写语法，我们不需要输入\
  \ `{hiHat: hiHat, snare: snare, kick: kick}`，只需要输入 `{hiHat, snare, kick}`。这只有在属性名与变量名相同时才有效。\n\
  \n现在我们已经声明了鼓组，将创建实际的鼓点模式。我们将使用在上一章中开发的相同的单小节模式，其中镲片在每个八分符上响，底鼓和军鼓声每隔四分符交替一次。在代码的序列化部分添加\
  \ 示例 13-4 。\n\n```\n--snip--\n////////////////\n// Sequencing //\n////////////////\n\
  \n// 将字符串转换为音符或 null 数组。\n// 字符串中的点会变成数组中的 null 并是静音的。\n❶ function mkSequence(pattern)\
  \ {\n  return pattern.split(\" \").map(value => {\n    if (value == \".\") {\n \
  \     return null;\n    } else {\n      return value;\n    }\n  });\n}\n\n❷ let\
  \ drumPattern = {\n  kick:  \"x…x…\",\n  snare: \"..x…x.\",\n  hiHat: \"xxxxxxxx\"\
  ,\n};\n\nlet hiHatSequence = new Tone.Sequence(time => {\n  drums.hiHat.triggerAttackRelease(\"\
  16n\", time);\n}, mkSequence(drumPattern.hiHat), \"8n\");\n\nlet snareSequence =\
  \ new Tone.Sequence(time => {\n  drums.snare.triggerAttackRelease(\"16n\", time);\n\
  }, mkSequence(drumPattern.snare), \"8n\");\n\nlet kickSequence = new Tone.Sequence(time\
  \ => {\n    drums.kick.triggerAttackRelease(50, \"16n\", time);\n}, mkSequence(drumPattern.kick),\
  \ \"8n\");\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">示例\
  \ 13-4: 鼓点序列</samp>\n\n再次，这与我们在 第 12 章 中编写的代码相同。我们从一个辅助函数 `mkSequence` ❶ 开始，它接收一个由\
  \ x 和点组成的模式，并转换为 `Tone.Sequence` 可以使用的音符信息。然后，我们将需要的模式存储在 `drumPattern` 对象 ❷ 中，并使用\
  \ `Tone.Sequence` 为每个乐器生成序列。\n\n创建鼓点剩下的要做的工作是调度序列在歌曲的大部分时间内循环播放，如 示例 13-5 所示。将此代码添加到\
  \ `script.js` 文件的 Song 部分。\n\n```\n--snip--\n//////////\n// Song //\n//////////\n\
  \nhiHatSequence.start(\"0:0:0\").stop(\"44:0:0\");\nsnareSequence.start(\"0:0:0\"\
  ).stop(\"44:0:0\");\nkickSequence.start(\"0:0:0\").stop(\"44:0:0\");\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">示例 13-5: 调度鼓点序列</samp>\n\
  \n在这里我们告诉鼓组从歌曲开始开始并持续播放 44 小节。加载页面并点击**播放**，你应该能听到与之前相同的鼓声，但持续时间长得多。当你听腻了，刷新页面以停止鼓声播放。\n\
  \n### 添加贝斯线型\n\n接下来，我们将添加两个贝斯合成器，并让它们播放两条独立的贝斯线型。首先，我们通过将 示例 13-6 中的代码添加到 Instruments\
  \ 部分的末尾（紧接 Sequencing 部分之前）来创建合成器。\n\n```\n--snip--\nlet lowBass = new Tone.FMSynth({\n\
  \  oscillator: {\n  ❶ type: \"triangle\"\n  },\n  envelope: {\n    attack: 0.0001,\
  \ decay: 0.5, sustain: 0, release: 0\n  },\n  volume: -3\n}).toDestination();\n\n\
  let highBass = new Tone.FMSynth({\n  oscillator: {\n  ❷ type: \"square\"\n  },\n\
  \  envelope: {\n    attack: 0.0001, decay: 0.5, sustain: 0, release: 0\n  },\n \
  \ volume: -9\n}).toDestination();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >示例 13-6: 创建贝斯合成器</samp>\n\n在这里我们声明了两个贝斯乐器 `lowBass` 和 `highBass`。它们都使用了一种我们尚未见过的合成器\
  \ `FMSynth`。`FM` 是频率调制的缩写，而 `FM 合成` 涉及到使用一个振荡器来调制或修改另一个振荡器的频率。这种合成方式比纯振荡器产生的声音更丰富。`FMSynth`\
  \ 中有很多可以修改的参数（例如调制量、两个振荡器之间的频率关系、两个振荡器的波形等），但我们将主要使用默认值。我们要做的只是设置振荡器类型（`lowBass`\
  \ 为 `\"triangle\"` ❶，`highBass` 为 `\"square\"` ❷），以及音量。\n\n为了生成贝斯序列，我们将使用一种与我们目前的\
  \ `mkSequence` 辅助函数稍不同的技术。该辅助函数非常适合鼓组，因为你只需要一个字符来判断是否播放音符，但它对于需要提供音符名称的贝斯线（音符至少有两个字符，如\
  \ `C3` 或 `F#4`）来说并不适用。我们可能选择的一种符号类似于：\n\n```\n\"C3|  |  |C3|  |  |G2|B2\"\n```\n\
  \n竖线用于分隔，每对管道之间我们要播放的音符或代表静音的空格。（这里的序列是《Stand by Me》贝斯线的开头。）\n\n示例 13-7 给出了 `mkPipeSequence`\
  \ 的定义，我们将用它来处理贝斯序列。它接收一个字符串并转换为音符名称和 null 数组将此函数插入 `script.js` 的 Sequencing 部分，位于\
  \ `mkSequence` 的定义之后。\n\n```\n--snip--\n// 将字符串转换为音符或 null 数组。\n// 字符串中管道之间的空格会变成数组中的\
  \ null 并是静音的。\nfunction mkPipeSequence(pattern) {\n  return pattern.split(\"|\"\
  ).map(value => {\n    if (value.trim() == \" \") {\n      return null;\n    } else\
  \ {\n      return value;\n    }\n  });\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >示例 13-7: mkPipeSequence 函数</samp>\n\n\n\n\n此函数使用 `split(\"|\")` 通过管道符来分割字符串。以“Stand\
  \ by Me”为例，这将得到数组 `[\"C3\", \" \", \" \", \"C3\", \" \", \" \", \"G2\", \"B2\"]`。然后我们对这些每个值进行映射（map）。`trim`\
  \ 方法 ❶ 会移除字符串开头或结尾的任何空白字符，因此 `\" \".trim()` 的结果是 `\" \"`，一个空字符串。我们将返回数组中的任何空字符串替换为\
  \ `null`，并将音名原样传递，最终得到的返回值为 `[\"C3\", null, null, \"C3\", null, null, \"G2\", \"\
  B2\"]`。\n\n接下来，我们要为两条低音斯线条创建实际的序列（这里我们不会借用“Stand by Me”的内容）。将[Listing 13-8]中的代码添加到\
  \ `Sequencing` 部分的末尾。\n\n```\n--snip--\nlet lowBassSequence = new Tone.Sequence((time,\
  \ note) => {\n  lowBass.triggerAttackRelease(note, \"16n\", time, 0.6);\n}, mkPipeSequence(\"\
  G2|  |G2|  |  \"), \"8n\");\n\nlet highBassSequence = new Tone.Sequence((time, note)\
  \ => {\n  highBass.triggerAttackRelease(note, \"16n\", time, 0.3);\n}, mkPipeSequence(\"\
  G3|F3|D3|G2|D3|D3\"), \"8n\");\n--snip--\n```\n\nListing 13-8: 低音序列\n\n有两个低音部分：低音部分每小节播放三个八分音符，而高音部分则连续播放八分音符。\n\
  \n最后，我们需要根据传输器（transport）调度这些序列，如[Listing 13-9]所示。这段代码应该被添加到 `Song` 部分的末尾。\n\n```\n\
  --snip--\nlowBassSequence.start(\"0:0:0\").stop(\"47:3:0\");\nhighBassSequence.start(\"\
  4:0:0\").stop(\"47:3:0\");\n--snip--\n```\n\nListing 13-9: 调度低音序列\n\n低音序列从开始开始，高音序列在四小节后开始。两者都持续到第\
  \ 48 小节的中间。这样，低音部分在鼓声停止后还会持续几小节。如果你现在刷新页面并点击播放，你将听到歌曲的开头！我们不仅有鼓和低音，还有了一些基础结构，第二条低音线出现在四小节后，且鼓声结束。结尾的那段低音独奏是目前歌曲中最戏剧性的部分。要听那部分，你可以修改\
  \ `Event Handling` 部分中 `Tone.Transport.Position` 的值。如果你将其设置为 `\"40:0:0\"` 并重新加载，将跳到歌曲的最后八小节。\n\
  \n### 添加和弦\n\n接下来，我们将用一些和弦来填充这首歌。这首歌有两个独立的和弦，我们将在歌曲中的不同时间调度它们，以增加其结构性和多样性。\n\n首先，我们需要创建一个播放和弦的乐器。相应的代码在[Listing\
  \ 13-10]中；将其插入到 `Instruments` 部分的末尾。\n\n```\n--snip--\nlet chordSynth = new Tone.PolySynth(Tone.Synth,\
  \ {\n  oscillator: {\n    type: \"triangle\"\n  },\n  volume: -12\n}).toDestination();\n\
  --snip--\n```\n\nListing 13-10: 和弦合成器\n\n我们需要一个 `PolySynth`，因为该乐器将同时播放多个音符（这就是和弦的定义）。`PolySynth`\
  \ 基于普通的 `Synth`，使用默认的振幅包络和三角波发生器。\n\n接下来，我们将为和弦创建序列代码。我们不是在每次想在序列中播放和弦时手动编写和弦，而是创建一些命名的和弦，然后使用这些名称创建序列。将[Listing\
  \ 13-11]中的代码添加到 `Sequencing` 部分的末尾。\n\n```\n--snip--\nlet chords = {\n  1: [\"D4\"\
  , \"G4\"],\n  2: [\"E4\", \"G4\"],\n  3: [\"C4\", \"E4\", \"G4\"],\n  4: [\"B3\"\
  , \"F4\", \"G4\"],\n};\n\nfunction playChord(time, chordName) {\n  let notes = chords[chordName];\n\
  \  chordSynth.triggerAttackRelease(notes, \"16n\", time, 0.6);\n}\n\nlet chordSequence1\
  \ = new Tone.Sequence((time, chordName) => {\n  playChord(time, chordName);\n},\
  \ mkSequence(\"1…2…3..4…3…2…3..4\"), \"8n\");\n\nlet chordSequence2 = new Tone.Sequence((time,\
  \ chordName) => {\n  playChord(time, chordName);\n}, mkSequence(\"3…2…4..1\"), \"\
  8n\");\n--snip--\n```\n\nListing 13-11: 和弦序列化\n\n我们第一步创建一个名为 `chords` 的对象，包含我们要调度的四个和弦。我们可以为它们任意命名，但为了简单，我使用了数字\
  \ `1`、`2`、`3` 和 `4` 来引用这些和弦（请注意这些是对象键，数字会被解释为字符串）。每个和弦数字对应一个音名数组，这是我们的 `PolySynth`\
  \ 所要求的格式。两个和弦序列将只是这四个和弦的不同排列组合。\n\n接下来是一个用于播放和弦的辅助函数。这个 `playChord` 函数接收播放和弦的 `time`\
  \ 和作为字符串的和弦名称（1 到 4 之间的数字之一）。然后它在 `chords` 对象中查找并根据给定的 `chordName` 获取音符数组。该函数通过调用\
  \ `chordSynth` 的 `triggerAttackRelease` 并传递音名数组来结束。因为是 `PolySynth`，我们的 `chordSynth`\
  \ 乐器能够同时播放和弦中的所有音符。\n\n最后，我们创建了两个序列 `chordSequence1` 和 `chordSequence2`。这两个序列的回调函数都是我们的\
  \ `playChord` 函数。我们仍然使用了之前调度鼓声时相同的 `mkSequence` 辅助函数，但在这种情况下字符串中的值要么是点（静音），要么是和弦名称。与低音线条不同，`mkSequence`\
  \ 在这里可以工作是因为每个和弦名称都是单个字符，而且我们有 `playChord` 函数来将和弦名称重新解释为音高。与鼓声一样，我们将 `\"8n\"` 作为最后一个参数传递给\
  \ `Tone.Sequence`，这意味着每个点或和弦名称都是八分音符。第一个序列长度为 32 个八分音符，即 4 小节。第二个序列长度为 16 个八分音符，即\
  \ 2 小节。\n\n现在我们实际来根据传输器调度这些序列。将[Listing 13-12]中的代码添加到 `Song` 部分的末尾。\n\n```\n--snip--\n\
  chordSequence1.start(\"8:0:0\").stop(\"24:0:0\");\nchordSequence2.start(\"24:0:0\"\
  ).stop(\"32:0:0\");\nchordSequence1.start(\"32:0:0\").stop(\"40:0:0\");\n--snip--\n\
  ```\n\nListing 13-12: 调度和弦序列\n\n\n\n\n```\n--snip--\n// Samples from freesound.org:\n\
  // https://freesound.org/people/MTG/sounds/357432/\n// https://freesound.org/people/MTG/sounds/357336/\n\
  // https://freesound.org/people/MTG/sounds/357546/\nlet sampler = new Tone.Sampler({\n\
  \  urls: {\n    \"C5\": \"trumpet-c5.mp3\", \n    \"D5\": \"trumpet-d5.mp3\", \n\
  \    \"F5\": \"trumpet-f5.mp3\" \n  },\n  baseUrl: \"https://skilldrick-jscc.s3.us-west-2.amazonaws.com/\"\
  ,\n  attack: 0,\n  release: 1,\n  volume: -24\n}).toDestination();\n--snip--\n```\n\
  \n列表 13-13：声明小号采样乐器\n\n在这里，我们正在创建一个 `Tone.Sampler` 乐器，使用了与上一个章节相同的三个样本。请注意，我们不再使用采样器的\
  \ `onload` 属性来告诉它在样本下载完成后该做什么。这有点像“投机径”，但我知道小号不会在歌曲开始时播放，我是在赌一个事实：等到它们出现时，样本已经下载完成。正确的做法是在样本下载完成之前隐藏“播放”按钮，但这会给这个项目增加额外的复杂性。\n\
  \n列表 13-14 显示了用于曲律音符编排的代码。将此代码添加到“序列（Sequencing）”部分的末尾。\n\n```\n--snip--\nlet trumpetPart\
  \ = new Tone.Part((time, note) => {\n  sampler.triggerAttackRelease(note, \"1n\"\
  , time);\n}, [\n  [\"0:0:0\", \"G5\"],\n  [\"0:2:0\", \"C5\"],\n  [\"1:0:0\", \"\
  G5\"],\n\n  [\"2:0:0\", \"D5\"],\n  [\"2:2:0\", \"C5\"],\n  [\"3:0:0\", \"B4\"],\n\
  \n  [\"4:0:0\", \"G5\"],\n  [\"4:2:0\", \"C5\"],\n  [\"5:0:0\", \"G5\"],\n\n  [\"\
  6:0:0\", \"D5\"],\n  [\"6:2:0\", \"C5\"],\n  [\"7:0:0\", \"B4\"],\n  [\"7:2:0\"\
  , \"D5\"],\n\n  [\"8:0:0\", \"C5\"],\n  [\"8:2:0\", \"E5\"],\n  [\"9:0:0\", \"F5\"\
  ],\n  [\"9:2:0\", \"D5\"],\n\n  [\"10:0:0\", \"C5\"],\n  [\"10:2:0\", \"E5\"],\n\
  \  [\"11:0:0\", \"D5\"],\n\n  [\"12:0:0\", \"C5\"],\n  [\"12:2:0\", \"E5\"],\n \
  \ [\"13:0:0\", \"F5\"],\n  [\"13:2:0\", \"D5\"],\n\n  [\"14:0:0\", \"C5\"],\n  [\"\
  14:2:0\", \"E5\"],\n  [\"15:0:0\", [\"B4\", \"G5\"]]\n]);\n--snip--\n```\n\n列表 13-14：曲律的编排\n\
  \n提醒一下，`Tone.Part` 构造函数接受两个参数：一个为每个时间/音符对执行的回调函数，以及一个时间/音符对列表。在这里，回调函数为每个时间/音符对在小号采样器上播放一个长音（\"\
  1n\"，或一整个小节）。第一个音符在 \"0:0:0\" 播放，第二个音符在两个拍子后的 \"0:2:0\" 播放。因为音符的长度约为四拍，它们将会重叠——我故意这样做是为了给曲律增加一些趣味。\n\
  \n曲律还没有播放，因为我们还没有规定*何时*播放它。尽管每个音符都有时间，但这些时间是相对于该部分计划开始的时间的。要调度该部分，我们只需要在“歌曲（Song）”部分的末尾添加一些代码，如列表\
  \ 13-15 所示。\n\n```\n--snip--\ntrumpetPart.start(\"16:0:0\");\n--snip--\n```\n\n\
  列表 13-15：调度小号部分\n\n与我们目前调度的序列不同，该部分不会循环，因此不需要停止时间。我们告诉 `Tone.js` 在 16 个小节后开始小号部分，这意味着部分中给出的所有时间都是相对于\
  \ \"16:0:0\" 的。我们可以将两个时间相加，得到每个音符被调度的实际时间（例如，\"4:2:0\" + \"16:0:0\" 是 \"20:2:0\"\
  ）。\n\n现在你可以听整首歌曲了！在刷新页面之前，别忘记将 `Tone.Transport.position` 重置为 \"0:0:0\"。\n\n### 完整代码\n\
  \n我们在整个文件中都添加了代码，以防你弄混了，或者你只是想看看它最终应该是什么样子，列表 13-16 提供了 `script.js` 的全部内容。\n\n\n\
  \n\n\n```\n/////////////////\n// 器 //\n/////////////////\n\nfunction mkDrums() {\n\
  \  let reverb = new Tone.Reverb({\n    decay: 1,\n    wet: 0.3\n  }).toDestination();\n\
  \n  let hiHatFilter = new Tone.Filter(15000, \"bandpass\").connect(reverb);\n\n\
  \  let hiHat = new Tone.NoiseSynth({\n    envelope: {\n      attack: 0.001, decay:\
  \ 0.1, sustain: 0, release: 0\n    },\n    volume: -6\n  }).connect(hiHatFilter);\n\
  \n  class Snare {\n    constructor() {\n      this.noiseFilter = new Tone.Filter(5000,\
  \ \"bandpass\").connect(reverb);\n      this.noiseSynth = new Tone.NoiseSynth({\n\
  \        envelope: {\n          attack: 0.001, decay: 0.1, sustain: 0, release:\
  \ 0\n        },\n        volume: -12\n      }).connect(this.noiseFilter);\n\n  \
  \    this.synth = new Tone.Synth({\n        envelope: {\n          attack: 0.0001,\
  \ decay: 0.1, sustain: 0, release: 0\n        },\n        oscillator: {type: \"\
  sine\"},\n        volume: -12\n      }).connect(reverb);\n    }\n\n    triggerAttackRelease(duration,\
  \ when) {\n      this.noiseSynth.triggerAttackRelease(duration, when);\n      this.synth.triggerAttackRelease(\"\
  G3\", duration, when);\n    }\n  }\n\n  let snare = new Snare();\n\n  let kick =\
  \ new Tone.MembraneSynth({\n    pitchDecay: 0.02,\n    octaves: 6,\n    volume:\
  \ -9\n  }).connect(reverb);\n\n  return {hiHat, snare, kick};\n}\n\nlet drums =\
  \ mkDrums();\n\nlet lowBass = new Tone.FMSynth({\n  oscillator: {\n    type: \"\
  triangle\"\n  },\n  envelope: {\n    attack: 0.0001, decay: 0.5, sustain: 0.3, release:\
  \ 0.1\n  },\n  volume: -3\n}).toDestination();\n\nlet highBass = new Tone.FMSynth({\n\
  \  oscillator: {\n    type: \"square\"\n  },\n  envelope: {\n    attack: 0.0001,\
  \ decay: 0.1, sustain: 0.3, release: 0.1\n  },\n  volume: -9\n}).toDestination();\n\
  \nlet chordSynth = new Tone.PolySynth(Tone.Synth, {\n  oscillator: {\n    type:\
  \ \"triangle\"\n  },\n  volume: -12\n}).toDestination();\n\n// Samples 来自 freesound.org:\n\
  // https://freesound.org/people/MTG/sounds/357432/\n// https://freesound.org/people/MTG/sounds/357336/\n\
  // https://freesound.org/people/MTG/sounds/357546/\nlet sampler = new Tone.Sampler({\n\
  \  urls: {\n    \"C5\": \"trumpet-c5.mp3\", \n    \"D5\": \"trumpet-d5.mp3\", \n\
  \    \"F5\": \"trumpet-f5.mp3\" \n  },\n  baseUrl: \"https://skilldrick-jscc.s3.us-west-2.amazonaws.com/\"\
  ,\n  attack: 0,\n  release: 1,\n  volume: -24\n}).toDestination();\n\n////////////////\n\
  // 序列化 //\n////////////////\n\n// 将字符串转换为音符或 null 的数组。\n// 字符串中的点变成数组中的 null 并保持静音。\n\
  function mkSequence(pattern) {\n  return pattern.split(\" \").map(value => {\n \
  \   if (value == \".\") {\n      return null;\n    } else {\n      return value;\n\
  \    }\n  });\n}\n\n// 将字符串转换为音符或 null 的数组。\n// 字符串中管道符之间的空格会变成数组中的 null 并保持静音。\n\
  function mkPipeSequence(pattern) {\n  return pattern.split(\"|\").map(value => {\n\
  \    if (value.trim() == \" \") {\n      return null;\n    } else {\n      return\
  \ value;\n    }\n  });\n}\n\nlet drumPattern = {\n  kick:  \"x…x…\",\n  snare: \"\
  ..x…x.\",\n  hiHat: \"xxxxxxxx\",\n};\n\nlet hiHatSequence = new Tone.Sequence(time\
  \ => {\n  drums.hiHat.triggerAttackRelease(\"16n\", time);\n}, mkSequence(drumPattern.hiHat),\
  \ \"8n\");\n\nlet snareSequence = new Tone.Sequence(time => {\n  drums.snare.triggerAttackRelease(\"\
  16n\", time);\n}, mkSequence(drumPattern.snare), \"8n\");\n\nlet kickSequence =\
  \ new Tone.Sequence(time => {\n  drums.kick.triggerAttackRelease(50, \"16n\", time);\n\
  }, mkSequence(drumPattern.kick), \"8n\");\n\nlet lowBassSequence = new Tone.Sequence((time,\
  \ note) => {\n  lowBass.triggerAttackRelease(note, \"16n\", time, 0.6);\n}, mkPipeSequence(\"\
  G2|  |  |G2|G2|  |  |  \"), \"8n\");\n\nlet highBassSequence = new Tone.Sequence((time,\
  \ note) => {\n  highBass.triggerAttackRelease(note, \"16n\", time, 0.3);\n}, mkPipeSequence(\"\
  G3|F3|E3|D3|G2|D3|G3|D3\"), \"8n\");\n\nlet chords = {\n  1: [\"D4\", \"G4\"],\n\
  \  2: [\"E4\", \"G4\"],\n  3: [\"C4\", \"E4\", \"G4\"],\n  4: [\"B3\", \"F4\", \"\
  G4\"],\n};\n\nfunction playChord(time, chordName) {\n  let notes = chords[chordName];\n\
  \  chordSynth.triggerAttackRelease(notes, \"16n\", time, 0.6);\n}\n\nlet chordSequence1\
  \ = new Tone.Sequence((time, chordName) => {\n  playChord(time, chordName);\n},\
  \ mkSequence(\"1…2…3..4…31…2…3..4.343\"), \"8n\");\n\nlet chordSequence2 = new Tone.Sequence((time,\
  \ chordName) => {\n  playChord(time, chordName);\n}, mkSequence(\"3…2…4..1.213\"\
  ), \"8n\");\n\nlet trumpetPart = new Tone.Part((time, note) => {\n  sampler.triggerAttackRelease(note,\
  \ \"1n\", time);\n}, [\n  [\"0:0:0\", \"G5\"],\n  [\"0:2:0\", \"C5\"],\n  [\"1:0:0\"\
  , \"G5\"],\n\n  [\"2:0:0\", \"D5\"],\n  [\"2:2:0\", \"C5\"],\n  [\"3:0:0\", \"B4\"\
  ],\n\n  [\"4:0:0\", \"G5\"],\n  [\"4:2:0\", \"C5\"],\n  [\"5:0:0\", \"G5\"],\n\n\
  \  [\"6:0:0\", \"D5\"],\n  [\"6:2:0\", \"C5\"],\n  [\"7:0:0\", \"B4\"],\n  [\"7:2:0\"\
  , \"D5\"],\n\n  [\"8:0:0\", \"C5\"],\n  [\"8:2:0\", \"C5\"],\n  [\"9:0:0\", \"F5\"\
  ],\n  [\"9:2:0\", \"D5\"],\n\n  [\"10:0:0\", \"C5\"],\n  [\"10:2:0\", \"E5\"],\n\
  \  [\"11:0:0\", \"D5\"],\n\n  [\"12:0:0\", \"C5\"],\n  [\"12:2:0\", \"E5\"],\n \
  \ [\"13:0:0\", \"F5\"],\n  [\"13:2:0\", \"D5\"],\n\n  [\"14:0:0\", \"C5\"],\n  [\"\
  14:2:0\", \"E5\"],\n  [\"15:0:0\", [\"B4\", \"G5\"]]\n]);\n\n//////////\n// 歌曲 //\n\
  //////////\n\nhiHatSequence.start(\"0:0:0\").stop(\"44:0:0\");\nsnareSequence.start(\"\
  0:0:0\").stop(\"44:0:0\");\nkickSequence.start(\"0:0:0\").stop(\"44:0:0\");\n\n\
  ////////////////////\n// 事件处理 //\n////////////////////\n\nlet play = document.querySelector(\"\
  #play\");\nlet playing = document.querySelector(\"#playing\");\n\nplay.addEventListener(\"\
  click\", () => {\n  // 隐藏此按钮\n  play.style = \"none\";\n  playing.style = \" \"\
  ;\n\n  Tone.start();\n\n  // 修改此处从歌曲的不同部分开始播放\n  Tone.Transport.position = \"0:0:0\"\
  ;\n  Tone.start();\n});\n```\n\n### 列表 13-16：完整代码\n\n### 总结\n\n在本章中，你用 JavaScript\
  \ 编写了一首歌曲！现在你已经熟悉了 Tone.js，可以使用它来创作你自己的歌曲。另一个有趣的尝试是算法音乐，即不是编写固定的歌曲，而是编写代码让每次运行时随机产生新的音乐。尝试这种方法的简单方法是列出一组好听的和弦，然后在任何给节拍上随机选择一个进行播放。\n\
  \n\n\n\n\n本章将向你介绍 D3 的基础知识，为下一章做好准备。在下一章中，你将通过从外部 API 加载数据创建一个交互可视化。D3 主要使用一种名为可缩矢量图形（SVG）的\
  \ Web 图形技术，因此在深入 D3 之前，我们将先对 SVG 进行快速上手。\n\n### SVG 图形格式\n\nSVG 是一种使用点、线和曲线来定义图像的方法，而不是像素。这些图像被称为`矢量图形`。由于你定义的是图像的`形状`而不是单个像素本身，因此你可以调整\
  \ SVG 图像的大小或进行放大，而不会出现像素化（这就是名称中“可缩”一部分的含义）。\n\nSVG 基于可扩展标记语言（XML），这是一种用于存储数据的语言，与\
  \ HTML 一样，它依赖于具有起始标签和结束标签的嵌套元素结构。SVG XML 看起来与 HTML 相似，但它有一套自己的直接对应视觉元素的标签（相比之下，HTML\
  \ 中的标签用于定义结构和内容）。SVG 文件可以是独立的 XML 文件，也可以使用 HTML 的 `svg` 元素嵌入 HTML 文件中，从而方便在网页中添加\
  \ SVG 图形。\n\n在 Web 上渲染交互式图形时，SVG 相比 Canvas API 的优势是：SVG 绘制的每个元素都由网页上的 DOM 元素表示，这意味着可以使用\
  \ CSS 对其进行样式设置，并使用 JavaScript 添加事件处理程序来响应点击或悬停等鼠标事件。另一方面，基于 Canvas 的图形渲染速度更快，因此像游戏等需要高帧率的应用倾向于使用\
  \ Canvas API 而不是 SVG。\n\n让我们编写第一个 SVG。创建一个名为 `svg` 的新目录，并在该目录下创建一个 `index.html`\
  \ 文件，其中包含[Listing 14-1]的内容。我们将 SVG 嵌入到此 HTML 文件中。同时在同一目录下创建两个空文件，分别名为 `style.css`\
  \ 和 `script.js`——我们将在准备好对 SVG 进行样式设置并使其具有交互性后填充它们的内容。\n\n```\n<!DOCTYPE html>\n\
  <html>\n  <head>\n    <title>SVG</title>\n    <link rel=\"stylesheet\" href=\"style.css\"\
  >\n  </head>\n  <body>\n  ❶ <svg width=\"600\" height=\"600\"></svg>\n\n    <script\
  \ src=\"script.js\"></script>\n  </body>\n</html>\n```\n\nListing 14-1：用于探索 SVG\
  \ 的 `index.html` 文件\n\n[Listing 14-1] 中的代码遵循我们的标准 HTML 模板，添加了一个空的 `svg` 元素 ❶。`svg`\
  \ 元素被赋予了 600 像素的 `width` 和 `height`。当你在浏览器中加载页面时，它是空白的，因为我们还没有向 SVG 添加内容。\n\n现在让我们添加一些图形。我们将在\
  \ `svg` 元素中添加一个矩形和一些文本，如[Listing 14-2]所示。\n\n```\n--snip--\n  <body>\n    <svg width=\"\
  600\" height=\"600\">\n    ❶ <rect width=\"95\" height=\"20\" x=\"5\" y=\"5\"\n\
  \        stroke=\"red\" fill=\"none\"></rect>\n    ❷ <text x=\"10\" y=\"20\" font-family=\"\
  sans-serif\">Hello, SVG!</text>\n    </svg>\n\n    <script src=\"script.js\"></script>\n\
  --snip--\n```\n\nListing 14-2：在 `svg` 元素中添加图形\n\n`<svg>` 和 `</svg>` 标签内部的内容都是 SVG\
  \ XML，它有一套自己的标签名。在示例中，我们使用了 `rect` ❶ 和 `text` ❷ 元素。`rect` 元素根据元素属性设置的规范绘制矩形。我们将\
  \ `width` 和 `height` 分别设置为 95 像素和 20 像素，并将其 `x-` 和 `y-`坐标（矩形左上角的位置）设置为 (5, 5)。我们使用\
  \ `stroke` 属性将轮廓设置为红色，且不设置 `fill` 颜色（默认的 `fill` 颜色为黑色）。`rect` 元素不包含任何内容，因此起始标签紧接着就是结束标签。\n\
  \n同样，我们使用 `text` 元素向图形中插入文本。`text` 元素也使用 `x` 和 `y` 属性来设置其位置，但在这种情况下，它们指的是文本`baseline`（基线）的起点。在排版中，基线是贯穿大多数字母底部的隐形线，但不包括像\
  \ `p` 或 `g` 这样带有下伸部件的字母。默认情况下，`x` 属性给出文本起始的水平位置。我们使用 `font-family` 属性将文本的 `font`\
  \ 设置为默认无衬线字体。`text` 元素的内容是将被绘制的实际文本，在本例中为“Hello, SVG!”\n\n当你刷新页面时，你应该看到这段文本被一个红框矩形包围，如[Figure\
  \ 14-1]所示。\n\n![](img/Figure_14-1.png)\n\nFigure 14-1：我们的第一个 SVG 图\n\n尝试放大页面（在 Windows\
  \ 或 Linux 上使用 CTRL-+，在 macOS 上使用 COMMAND-+）。即使放大图像，矩形和文本也应该保持清晰。\n\n### 元素分组\n\n\
  你可以通过将多个 SVG 元素嵌套在一个 `g`（代表 group）元素内部来分组。这很有用，因为设置在 `g` 元素本身上的任何属性都适用于所有的子元素。为了演示这一点，请按照[Listing\
  \ 14-3]所示更新你的 `svg` 元素的内容。\n\n```\n--snip--\n<svg width=\"600\" height=\"600\">\n\
  ❶ <g font-family=\"sans-serif\" fill=\"blue\">\n    <text x=\"0\" y=\"20\">Always</text>\n\
  \    <text x=\"0\" y=\"40\">Be</text>\n    <text x=\"0\" y=\"60\">Coding</text>\n\
  \  </g>\n</svg>\n--snip--\n```\n\nListing 14-3：使用 `g` 元素分组\n\n在此示例中，我们创建了一个包含三个文本元素的组，每个元素一个单词。元素具有相同的\
  \ x 坐标但不同的 y 坐标，因此单词将垂直堆叠。父元素 `g` 的属性（`font-family` 和 `fill`）适用于所有子元素。刷新页面，你应该看到所有单词都是蓝色的无衬线字体。\n\
  \n使用 `g` 元素创建分组允许你对组内所有元素应用`变换`。SVG 支持多种变换，包括平移、旋转、缩放和倾斜。我们将使用 `translate` 按固定量移动所有元素。通过对起始\
  \ `g` 标签进行以下更改更新 `index.html`：\n\n```\n--snip--\n  <g transform=\"translate(100,\
  \ 50)\" font-family=\"sans-serif\" fill=\"blue\">\n--snip--\n```\n\n`transform`\
  \ 属性接受多个变换，用空格分隔。在这里我们传递了单个变换：`translate(100, 50)`。这意味着将组中的所有元素沿 x 轴移动 100 像素，沿\
  \ y 轴向下 50 像素。\n\n我们还可以在 `translate` 变换之后添加 `scale` 变换来调整组的大小：\n\n```\n--snip--\n\
  \  <g transform=\"translate(100, 50) scale(2, 3)\" font-family=\"sans-serif\" fill=\"\
  blue\">\n--snip--\n```\n\n平移之后，元素现在水平方向缩放 2 倍，垂直方向缩放 3 倍，如[Figure 14-2]所示。\n\n![](img/Figure_14-2.png)\n\
  \nFigure 14-2：对分组元素的变换\n\n所有的变换都相对于原点 (0, 0)，除非之前的平移移动了原点。这意味着缩放会影响元素的位置，也会影响它们的尺寸。例如，当你缩放一个左上角为\
  \ (10, 10)、右下角为 (30, 30) 的正方形 2 倍时，新的角点将位于 (20, 20) 和 (60, 60)。相对于原点的 x 和 y 坐标都翻了一倍。\n\
  \n\n\n\n\n### 绘制圆形\n\n你可以使用 `circle` 元素绘制 SVG 圆形。属性 `cx` 和 `cy` 设置圆心的中心坐标，而 `r`\
  \ 设置半径。要尝试一下，请将 `svg` 元素的内容替换为代码列表 14-4 中的代码。\n\n```\n--snip--\n<svg width=\"600\"\
  \ height=\"600\">\n❶ <circle fill=\"#faa0a0\" r=\"100\" cx=\"124\" cy=\"130\"></circle>\n\
  \n❷ <g stroke=\"#944e30\" stroke-width=\"3\">\n    <rect width=\"8\" height=\"100\"\
  \ x=\"120\" y=\"90\" fill=\"#e1704d\"></rect>\n    <circle fill=\"#acd270\" r=\"\
  18\" cx=\"124\" cy=\"150\"></circle>\n    <circle fill=\"#fdfce2\" r=\"18\" cx=\"\
  124\" cy=\"120\"></circle>\n    <circle fill=\"#f8c9dc\" r=\"18\" cx=\"124\" cy=\"\
  90\"></circle>\n  </g>\n</svg>\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >代码列表 14-4：绘制圆形</samp>\n\n在这个示例中，我们使用了新的 `circle` 元素，以及 `g` 和 `rect` 元素。第一个圆形 ❶\
  \ 的填充颜色为 `#faa0a0`（三文肉粉），半径为 100 像素，中心坐标为 (124, 130)。注意，我们在这里使用了十六进制颜色——请查看下一页的“十六进制颜色”框以获取更多信息。接下来，我们使用一个组\
  \ ❷ 为矩形和三个较小的圆形应用标准的边框颜色（栗子色）和宽度（3 像素），它们的填充颜色分别为绿色、黄色和玫瑰色。所有这些效果共同构成了一幅日本樱花团子（hanami\
  \ dango，一种在日本樱樱花季节流行的甜点）的可爱插图，如图图 14-3 所示。\n\n![](img/Figure_14-3.png)\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-3：使用 SVG 圆形绘制樱花团子的插图</samp>\n\
  \n注意元素声明的顺序决定了它们的绘制顺序。三个小圆是从下到上声明的，因此在重叠的地方，上方的圆形显示在顶部。同样，由于大圆先声明的，它被视为插图其余部分的背景。\n\
  \n### 定义路径\n\n`path` 元素是所有 SVG 元素中最强大的，它允许你通过在不同点之间绘制直线或曲线（即“路径”）来创建自定义形状。`path`\
  \ 元素的 `d` 属性（data 的缩写）是一个包含路径定义的字符串，该字符串是路径命令列表。此字符串的语法经过优化，尽可能紧凑，因此可以使用较短的字符串表示复杂的路径。这对于计算机来说是有利的，但对人类来说并不友好；不要期望这些字符串是易读的。\n\
  \n在下一个示例中，我们将使用 `path` 元素重新创建 HTML5 标志，从外层盾牌形状开始。将 `index.html` 中 `svg` 元素的内容替换为代码列表\
  \ 14-5 中的代码。\n\n```\n--snip--\n<svg width=\"600\" height=\"600\">\n  <path fill=\"\
  #e44d26\" d=\"M 0 0 H 182 L 165 185 L 90 206 L 17 185 Z\"/>\n  <path fill=\"#f16529\"\
  \ d=\"M 91 15 H 165 L 151 173 L 91 190 Z\"/>\n</svg>\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">代码列表 14-5：绘制 HTML5 标志盾牌</samp>\n\n在我们深入研究路径定义之前，如果知道结果应该是什么样会有帮助。刷新页面，你应该能看到图\
  \ 14-4 所示的盾牌设计。\n\n![](img/Figure_14-4.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-4：HTML5 标志盾牌</samp>\n\n此设计由两个路径组成，一个用于深色的主盾牌形状，另一个用于盾牌形状右半部分较浅的高亮部分。让我们来看深色部分的路径定义：\n\
  \n```\nM 0 0 H 182 L 165 185 L 90 206 L 17 185 Z\n```\n\n这里有六条指令：\n\n* `M 0 0`\n\
  * `H 182`\n* `L 165 185`\n* `L 90 206`\n* `L 17 185`\n* `Z`\n\n将这些命令想象成在屏幕上移动虚拟画笔：`M\
  \ 0 0` 移动到 (0,0)；`H 182` 水平移动到 182；`L 165 185` 连到 (165, 185)；`L 90 206` 连到 (90,\
  \ 206)；`L 17 185` 连到 (17, 185)；`Z` 结束路径。`M` 命令接收一个 (x, y) 坐标对但不绘制任何内容。`H` 命令接收一个\
  \ x 坐标并从当前位置画一条水平线。`L` 命令接收一个 (x, y) 坐标对并从当前位置画到该位置。最后，`Z` 命令关闭路径，将画笔回到起点。在英语中，这些命令的意思是：“移动到\
  \ (0,0)，画一条水平线到 182，连到 (165,185)，连到 (90,206)，连到 (17,185)，然后关闭路径”。\n\n由于我们可以使用相对坐标，`path`\
  \ 元素也可以相对于当前位置进行绘制。例如，使用小写字母 `m`、`h`、`l` 表示相对于当前位置的移动或绘制。而大写字母 `M`、`H`、`L` 则使用绝对坐标。事实上，这个路径定义可以写得更紧凑：\n\
  \n```\nm0 0h182l-17 185l-75 21l-73\n```\n\n空格是为了避免歧义，但在其他情况下是可选的。得益于负数，我们能够移除大部分数字。此外，如果连续多次使用相同的命令，可以只包含一次。例如，`l-17\
  \ 185-75 21` 是 `l` 的紧凑版本。**注意**：[SvgEditor](https://yqnn.io/svg-editor) 是一个非常有用的工具，用于实验路径以及转换绝对和相对命令。将这些命令想象成在屏幕上移动虚拟画笔：`m`\
  \ 命令接收一个 (x, y) 坐标对但不绘制任何内容。`h` 命令接收一个 x 坐标并从当前位置画一条水平线。`l` 命令接收一个 (x, y) 坐标对并从当前位置画到该位置。最后，`z`\
  \ 命令关闭路径，将画笔回到起点。在英语中，这些命令的意思是：“移动到 (0,0)，向右画线 182 单位，连到 (-17,185)，连到 (-75,21)，然后关闭路径”。SVG\
  \ 还有几个额外的路径命令，主要用于绘制各种曲线。我们在这里不深入介绍，但你可以在 MDN 上找到完整列表：[developer.mozilla.org/SVG](https://developer.mozilla.org/SVG)。\n\
  \n现在你理解了路径的工作原理，我们可以添加更多路径来填充 HTML5 标志的剩余部分。按照代码列表 14-6 所示更新 `svg` 元素的内容（如果你觉得这太复杂，我也不会因此怪你）。\n\
  \n```\n--snip--\n<svg width=\"600\" height=\"600\">\n  <path fill=\"#e44d26\" d=\"\
  M 0 0 H 182 L 165 185 L 90 206 L 17 185 Z\"/>\n  <path fill=\"#f16529\" d=\"M 91\
  \ 15 H 165 L 151 173 L 91 190 Z\"/>\n  <path fill=\"#ebebeb\" d=\"m 34 38 h 57 v\
  \ 23 h-32 l 2 24 h 30 v 23 h-51 z\"/>\n  <path fill=\"#ebebeb\" d=\"m 41 118 h 23\
  \ l 2 18 l 25 7 v 24 l-47 -13 z\"/>\n  <path fill=\"#fff\" d=\"m 148 38 h-57 v 23\
  \ h 55 z\"/>\n  <path fill=\"#fff\" d=\"m 143 85 h-52 v 23 h 28 l-3 30 l-25 5 v\
  \ 24 l 47 -13 z\"/>\n</svg>\n--snip--\n```\n\n\n\n\n我在这里使用相对路径命令，部分是为了增加多样性，部分是因为相对数字较小，可以使代码行变得更短。当你重新加载页面时，你应该能看到完整的\
  \ HTML5 标志，如图 14-5 所示。填充颜色为 `#ebebeb`（浅灰色）的两个路径绘制了数字“5”左侧两个部分，而填充颜色为 `#fff`（白色）的两个路径绘制了数字“5”右侧两个部分。\n\
  \n![](img/Figure_14-5.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-5：完整的 HTML5 标志</samp>\n\n通常情况下，你在创建数据可视化图形时，不需要手动编写自己的路径定义。D3 会为你创建它们。尽管如此，理解这些语法是有帮助的，这样当你调试时，就能看出发生了什么。\n\
  \n### 使用 CSS 为元素设置样式\n\n当你将 SVG 嵌入到 HTML 文件中时，每个 SVG 元素都会成为 DOM 的一部分，因此可以使用 CSS\
  \ 进行样式设置。为了了解它的工作原理，我们将绘制一些 SVG 形状并为它们都分配类名。将 svg 元素的内容替换为列表 14-7 中的代码。\n\n```\n\
  --snip--\n<svg width=\"600\" height=\"600\">\n  <circle class=\"boring\" r=\"40\"\
  \ cx=\"50\" cy=\"50\"></circle>\n  <rect class=\"boring\" x=\"120\" y=\"10\" width=\"\
  80\" height=\"80\"></rect>\n  <path class=\"boring\" d=\"M 230 90 l 40 -80 l 40\
  \ 80 z\"></path>\"\n\n  <circle class=\"fun\" r=\"40\" cx=\"50\" cy=\"180\"></circle>\n\
  \  <rect class=\"fun\" x=\"120\" y=\"140\" width=\"80\" height=\"80\"></rect>\n\
  \  <path class=\"fun\" d=\"M 230 220 l 40 -80 l 40 80 z\"></path>\"\n</svg>\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 14-7：带有类名的某些 SVG 元素</samp>\n\
  \n在这里我们绘制了一个圆、一个正方形和一个三角形，然后是另一个圆、正方形和三角形。注意三角形是用路径（paths）绘制的——没有像 `rect` 或 `circle`\
  \ 那样专门的三角形元素。前三个形状的类名为 `boring`，后三个的类名为 `fun`。当你重新加载页面时，你应该看到两行每行三个形状，它们都具有相同的默认黑色填充色，如图\
  \ 14-6 所示。\n\n![](img/Figure_14-6.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 14-6：没有样式的 SVG 形状</samp>\n\n现在我们将为这些形状设置样式。因为它们都有类名，所以我们可以在 CSS 中选择它们，就像我们选择\
  \ HTML 元素一样。将列表 14-8 中的代码添加到你的 `style.css` 文件中。\n\n```\n.boring {\n  fill: none;\n\
  \  stroke: black;\n  stroke-width: 3px;\n}\n\n.fun {\n  fill: hotpink;\n  stroke:\
  \ greenyellow;\n  stroke-width: 5px;\n  stroke-dasharray: 10,5;\n  stroke-linejoin:\
  \ round;\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 14-8：形状的样式</samp>\n\
  \n在这个列表中，我们为类设置了不同的样式：`.boring` 获得黑色边框，而 `.fun` 获得粉红色填充。注意 SVG 元素的属性名与 HTML 元素不同。例如，HTML\
  \ 元素使用 `background-color`，而 SVG 元素使用 `fill` 和 `stroke`。\n\n使用 CSS 的优势有两点：首先，样式信息集中在一个地方，因此它们是易于的；其次，你只需要更改一个定义，就可以更改所有使用该类的元素的样式。当你重新加载页面时，你会看到形状现在具有不同的样式，如图\
  \ 14-7 所示。\n\n还可以通过伪类如 `:hover` 为 SVG 元素设置悬停效果。将列表 14-9 中的代码添加到 `style.css` 的末尾来尝试一下。\n\
  \n```\n--snip--\n.fun:hover {\n  fill: greenyellow;\n  stroke: hotpink;\n}\n```\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 14-9：悬停效果</samp>\n\n在这里，当鼠标悬停在元素上时切换填充颜色和边框颜色。这是使用\
  \ SVG 相比 Canvas 的巨大优势之一：浏览器知道鼠标悬停在哪些元素上。\n\n### 使用 JavaScript 添加交互性\n\n我们可以使用 JavaScript\
  \ 为我们的 SVG 元素添加交互性，就像可以使用 CSS 设置它们的样式一样。再次，这是因为每个 SVG 元素都是 DOM 的一部分。首先，我们将编写一个选择元素并将它们打印到控制台的脚本。将列表\
  \ 14-10 中的代码添加到 `style.css`。\n\n```javascript\ndocument.querySelectorAll(\".fun\"\
  ).forEach(element => {\n  console.log(element);\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-10：选择元素</samp>\n\n在这个列表中，我们使用 `querySelectorAll` 方法选择所有类名为 `fun` 的元素。然后我们使用\
  \ `forEach` 方法遍历元素并将它们打印到控制台。当你运行这段代码时，你应该会在控制台中看到这些元素。\n\n```javascript\ndocument.querySelectorAll(\"\
  .fun\").forEach(element => {\n  element.setAttribute(\"data-offset\", 0);\n\n  element.addEventListener(\"\
  click\", event => {\n    let offset = Number(event.target.getAttribute(\"data-offset\"\
  ));\n\n    if (event.shiftKey) {\n      offset -= 5;\n    } else {\n      offset\
  \ += 5;\n    }\n\n    event.target.setAttribute(\"data-offset\", offset);\n    event.target.setAttribute(\"\
  transform\", `translate(${offset}, 0)`);\n  });\n});\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-11：点击移动 SVG 元素</samp>\n\n\n\n\n我们使用事件上的 `shiftKey` 属性来判断在点击鼠标时是否按下了 `SHIFT`\
  \ 键。如果是，我们就从 `offset` 中减 5；否则，我们就给 `offset` 加 5。然后，我们使用 `setAttribute` ❹ 将更新后的值赋值给\
  \ `data-offset` 属性。最后，我们再次使用 `setAttribute` 方法，但这次是为了设置 `transform` SVG 属性 ❺。正如你在本章早期看到的，我们可以使用字符串\
  \ `translate(x, y)` 通过 `transform` 将元素平移一段距离。在这里，我们将平移的 `x` 值设置为 `offset` 的值，将平移的\
  \ `y` 值设置为 `0`。这意味着如果 `offset` 是正值，元素将向右移动；如果是负值，元素将向左移动。\n\n当你重新加载页面时，那些彩色的 SVG\
  \ 元素现在应该会在点击它们时移动。如果你右键点击其中一个元素并选择“检查”，你会在 `Elements` 面板中看到该元素。当你点击浏览器视口中不同的元素时，你应该看到\
  \ `Elements` 面板中的 `data-offset` 和 `transform` 属性发生更新。\n\n### D3 库\n\n现在你已经了解了 SVG\
  \ 的基础知识，可以开始学习 D3 库，它利用 SVG 和 JavaScript 来创建数据可视化。`D3` 是 `Data-Driven Documents`（数据驱动文档）的缩写，让你能够创建内容由数据驱动的文档。它通过被称为“数据绑定”（data\
  \ binding）的技术，将你想可视化的底层数据的各个部分与页面上的单个元素关联。这样，如果数据发生变化，元素也会随之变化。你将在本节后续部分看到它是如何工作的。\n\
  \n### 设置\n\n我们将创建一组新文件来探索 D3。创建一个名为 `data` 的新目录，包含一个空的 `script.js` 文件和一个包含 Listing\
  \ 14-12 中内容的 `index.html` 文件。\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Data</title>\n\
  \  </head>\n  <body>\n  ❶ <svg width=\"600\" height=\"600\">\n      <circle cx=\"\
  50\" cy=\"50\" r=\"10\"></circle>\n      <circle cx=\"100\" cy=\"50\" r=\"10\"></circle>\n\
  \      <circle cx=\"150\" cy=\"50\" r=\"10\"></circle>\n    </svg>\n\n  ❷ <script\
  \ src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script src=\"script.js\"\
  ></script>\n  </body>\n</html>\n```\n\nListing 14-12: 用于处理 D3 的新 index.html\n\n\
  首先我们创建一个 `svg` 元素 ❶ 并画三个圆。然后我们使用 `script` 元素链接到托管在 `https://unpkg.com` 的 D3 库副本\
  \ ❷，就像我们在音乐项目中使用 Tone.js 所做的那样。现在，你可以在 `script.js` 文件中使用来自 D3 的代码了。当你加载页面时，你应该看到三个黑圆。很快，我们将用\
  \ D3 来操控这些圆。\n\n### 选择\n\nD3 的基本构建块之一是“选择”（selection），这是一种选取一组元素的方法，以便你对这些元素应用某些操作。让我们使用\
  \ D3 选择这三个 SVG 圆并将它们的填充颜色改为亮粉色（hot pink）。将 Listing 14-13 中的代码添加到 `script.js` 中。\n\
  \n```\nd3.selectAll(\"circle\").attr(\"fill\", \"hotpink\");\n```\n\nListing 14-13:\
  \ 选择圆\n\n`d3.selectAll` 方法接收一个 CSS 选择器（在本例中为元素名 `circle`），并返回 D3 选择，你可以在其上链式调用更多方法。这些链式方法调用将应用于所有匹配选择器的元素。在这里，我们将选择中每个元素的\
  \ `fill` 属性都设置为 `hotpink`。当你重新加载页面时，你应该看到那些黑圆现在变成了粉色。\n\n在更新选择集中的元素时，也可以使用函数而不是值。当你这样做时，函数会被调用，其返回值将作为更新这些元素时的值。这赋予了你动态修改元素的能力。使用\
  \ Listing 14-14 中的更改更新 `script.js` 代码以查看它是如何工作的。\n\n```\nd3\n  .selectAll(\"circle\"\
  )\n  .attr(\"fill\", \"hotpink\")\n❶ .attr(\"r\", (d, i) => 10 + i * 5);\n```\n\n\
  Listing 14-14: 使用函数计算值\n\n对于像这样长的方法链，通常会将代码拆分成多行以提高可读性。与之前一样，我们正在选择所有的圆并将填充颜色设置为亮粉色，但这次我们还更新了每个圆的半径\
  \ ❶。此处用于生成值的函数有两个参数：`d` 和 `i`。我们将在下一节介绍 `d` 参数（它是 `datum` 的缩写）。`i` 是 `index` 的缩写，是元素在选择集中的索引（第一个圆的索引为\
  \ 0，第二个为 1，依此类推）。我们使用代码 `10 + i * 5` 根据它们的索引数字给每个圆一个不同的半径。具体来说，这些圆的半径分别为 10、15 和\
  \ 20。当你重新加载页面时，你应该看到这三个圆的大小现在都不相同了。\n\n> 注意：D3 选择修改方法（如 `.attr`）返回选择集本身。这让我们能够继续链式调用修改方法，就像我们在\
  \ Listing 14-14 中两次调用 `.attr` 一样。\n\n如果你想选择单个元素而不是一组，请使用 `d3.select` 方法代替 `d3.selectAll`。例如，要在\
  \ HTML 的 `body` 元素中插入一个 `h1` 元素，你可以将 Listing 14-15 中的代码添加到 `script.js` 文件的末尾。\n\n\
  ```\n--snip--\nd3\n  .select(\"body\")\n  .insert(\"h1\", \"svg\")\n  .text(\"Hello,\
  \ D3!\");\n```\n\nListing 14-15: 使用 select 选择单个元素\n\n在这个示例中，我们首先选择 `body` 元素。然后该选择上调用\
  \ `insert`，传递两个参数 `\"h1\"` 和 `\"svg\"`。第一个参数是要插入的元素类型，第二个参数是要插入在其之前的元素。`insert`\
  \ 方法返回一个包含插入元素的新选择，而 `text` 方法向该选择中的元素添加文本内容（在本例中，即单个 `h1` 元素）。当你重新加载页面时，你应该会在 SVG\
  \ 元素上方看到一个文本为“Hello, D3!”的标题。这个示例也说明了 D3 选择可以同时应用于 HTML 和 SVG 元素。\n\n### 数据绑定\n\n\
  D3 最重要的特性或许是它的数据绑定概念。在基于 D3 的应用程序中，你会有一些尝试可视化的数据。每一条单独的数据（称为 datum）都将绑定到页面上的单个元素（通常是\
  \ SVG 元素）。你使用 `datum` 来设置所绑定元素的某些属性，以便元素在视觉上反映 `datum`。\n\n首先，我们将查看如何将数据绑定到现有的 SVG\
  \ 元素。保留 `index.html` 中的圆，并将 `script.js` 的内容替换为 Listing 14-16 中的代码。\n\n```\nlet numbers\
  \ = [3, 2, 1];\n\nd3\n  .selectAll(\"circle\")\n❶ .data(numbers)\n  .attr(\"r\"\
  , (d, i) => d * 5);\n```\n\nListing 14-16: 将数据绑定到我们的圆\n\n\n\n我们首先创建一个数字数组作为数据。然后，我们创建所有圆形元素的集合。`data`\
  \ 方法 ❶ 将数字数组逐个绑定到圆形集合上，因此第一个圆形元素绑定了值 3，第二个绑定了 2，第三个绑定了 1。最后，我们使用 `attr` 方法根据绑定的数据将每个圆形的半径设置为一个计算出的值。正如你在上一节中看到的，如果你使用函数而不是值来设置属性，则会调用该函数来计算集合中每个元素的值。函数的\
  \ `d` 参数对应绑定到当前元素的数据。\n\n当你重新加载页面时，你应该能看到三个从左到右逐渐变小的黑圆。为了确认一切运行正常，请右键点击第一个圆圈并选择\
  \ `Inspect`（检查），以在 Elements（元素）面板中显示该元素。你应该会看到它的 `r` 属性被设置为 15，这正是我们预期的 `d * 5`\
  \ 的结果，其中 `d` 为 3。\n\n使用“检查”工具也可以直接查看元素上设置的数据，这对于调试非常有帮助，特别是当你的数据比简单的数字复杂时。你只需要获取元素的引用，这可以通过\
  \ Chrome 控制台轻松获得。再次，右键点击第一个圆圈并选择 `Inspect`。你会看到类似图 14-8 的内容。\n\n![](img/Figure_14-8.png)\n\
  \n图 14-8：在 Elements 面板中选择圆形元素\n\n在所选行的末尾，你应该看到文本 `== $0`。这表示圆形元素的引用存储在名为 `$0` 的全局变量下。要验证这一点，请打开\
  \ JavaScript 控制台并输入 `$0`：\n\n```\n$0\n<circle cx=\"50\" cy=\"50\" r=\"15\"></circle>\n\
  ```\n\n控制台打印了你选择的圆形元素，表明 `$0` 确实是该元素的引用。现在你已经有了该引用，可以使用 `__data__` 属性查看绑定在上面的数据：\n\
  \n```\n$0.__data__\n3\n```\n\n这告诉你该圆形绑定了值 3，即我们数组中的第一个数字，正如我们预期的那样。`$0` 始终引用当前选中的元素，所以如果你右键检查另一个圆圈，再次在控制台输入\
  \ `$0.__data__` 将得到绑定到另一个圆圈的数据。\n\n### 数据连接 (Data Joins)\n\n你并不总是确切知道数据有多长，因此很难始终准备好数量完全正确的\
  \ SVG 元素来绑定你的数据。D3 通过 `joins` 概念解决了这个问题。在 D3 中，你使用连接来添加或删除必要的元素以匹配正在绑定的数据。\n\n我们可以通过连接扩展列表\
  \ 14-16 中的示例，这样就可以根据数字数组的长度按需要添加或移除 SVG 圆形元素。如列表 14-17 所示所示更新 `script.js` 文件。\n\n\
  ```\n❶ let numbers = [3, 2, 1, 2, 3];\n\nd3\n❷ .select(\"svg\")\n  .selectAll(\"\
  circle\")\n  .data(numbers)\n❸ .join(\"circle\")\n  .attr(\"r\", (d, i) => d * 5);\n\
  ```\n\n列表 14-17：连接额外的元素\n\n在这里我们创建了一个更长的数字数组 ❶。我们还添加了一行，在选择其中的圆形元素之前先选择 svg 元素 ❷。这是必要的，因为\
  \ D3 需要添加新的圆形元素，并且它需要知道将它们添加到哪个容器元素中。最后，我们添加了对 `join` 方法的调用 ❸。该方法接收集合中的元素名称，以添加或移除匹配数据。在这种情况下，我们的意思是如果\
  \ svg 元素中的圆形元素不足以包含数据中的所有项，那么 D3 应该添加更多（反之，如果太多了，D3 应该移除一些）。\n\n如果你重新加载页面，你会发现这似乎并不完全如你预期的那样。新圆形都出现在绘图区域的左上角。这是因为这些新圆形与\
  \ `index.html` 中定义的初始三个圆不同，它们没有设置 `cx` 或 `cy` 属性。要修复这个问题，我们需要使用 D3 设置这两个属性，如列表 14-18\
  \ 所示。\n\n```\nlet numbers = [3, 2, 1, 2, 3];\n\nd3\n  .select(\"svg\")\n  .selectAll(\"\
  circle\")\n  .data(numbers)\n  .join(\"circle\")\n  .attr(\"cx\", (d, i) => (i +\
  \ 1) * 50)\n  .attr(\"cy\", 50)\n  .attr(\"r\", (d, i) => d * 5);\n```\n\n列表 14-18：设置\
  \ cx 和 cy 属性\n\n`cx` 属性基于数据的索引。第一个元素应该在 50 位置，第二个在 100 位置，以此此类推。计算式 `(i + 1) * 50`\
  \ 为我们提供了正确的值。由于圆排成一行，所以 `cy` 属性只是一个常量。现在当你重新加载页面时，你应该看到五个排成一行的圆。\n\n> **注意**：如之前所述，你可以使用相同的连接技术在元素过多时移除它们。如果你将数字数组更改为只包含两个元素并重新加载页面，你只会看到两个圆。\n\
  \n既然我们现在使用 D3 的 `join` 方法根据数据需要创建新的 SVG 元素，就没有理由在 HTML 文件中创建它们了。如列表 14-19 所示修改 `index.html`，移除所有圆形元素，然后重新加载页面。\n\
  \n```html\n--snip--\n  <body>\n    <svg width=\"600\" height=\"600\"></svg>\n\n\
  \    <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script\
  \ src=\"script.js\"></script>\n  </body>\n```\n\n列表 14-19：移除圆形元素\n\n此时一切应该仍然可以正常工作，因为\
  \ `join` 方法会添加所需的所有圆形元素。注意 `script.js` 中仍然需要 `.selectAll(\"circle\")` 行，即使第一次调用时没有元素可供选择。\n\
  \n### 更新 (Real-Time Updates)\n\n如果底层数据发生变化，我们需要再次执行连接以更新可视化。为了实现这一点，我们将数据和连接代码移动。我们可以通过在页面上添加一些按钮来向\
  \ `numbers` 数组的开头或结尾添加随机值，或者从数组中删除数字。如列表 14-20 所示更新 `index.html`。\n\n```html\n--snip--\n\
  \  <body>\n    <div>\n      <button id=\"prepend\">Prepend</button>\n      <button\
  \ id=\"append\">Append</button>\n      <button id=\"drop\">Drop</button>\n    </div>\n\
  \n    <svg width=\"600\" height=\"600\"></svg>\n--snip--\n```\n\n列表 14-20：在 index.html\
  \ 中添加按钮\n\n刷新页面，你应该会在顶部看到三个按钮。接下来，我们将更新可视化的代码移动到一个单独函数中。用列表 14-21 中的内容替换 `script.js`\
  \ 中的代码。\n\n```javascript\nlet numbers = [3, 2, 1];\n\n❶ function update(data) {\n\
  \  d3\n    .select(\"svg\")\n    .selectAll(\"circle\")\n❷ .data(data)\n    .join(\"\
  circle\")\n    .attr(\"cx\", (d, i) => (i + 1) * 50)\n    .attr(\"cy\", 50)\n  \
  \  .attr(\"r\", (d, i) => d * 5);\n}\n\n❸ update(numbers);\n```\n\n列表 14-21：将更新代码移动到单独函数\n\
  \n这里没有功能上的变化——我们只是创建了一个更新函数来为我们处理 SVG 更新 ❶，然后调用它 ❸。注意我们将函数参数 `data` 传递给 `.data`\
  \ 方法 ❷，而不是直接传递 `numbers` 数组。\n\n\n\n\n\n接下来，我们将添加处理按钮点击的代码，这段代码会将一个 1 到 5 之间的随机浮点数插入到\
  \ `numbers` 数组的开头或结尾，或者删除数组中的最后一个元素。将列表 14-22 中的代码添加到 `script.js` 的末尾。\n\n```\n\
  --snip--\nupdate(numbers);\n\n❶ function getRandomNumber() {\n  return 1 + Math.random()\
  \ * 4;\n}\n\n❷ d3.select(\"#append\").on(\"click\", () => {\n  numbers.push(getRandomNumber());\n\
  \  update(numbers);\n});\n\n❸ d3.select(\"#prepend\").on(\"click\", () => {\n  numbers.unshift(getRandomNumber());\n\
  \  update(numbers);\n});\n\n❹ d3.select(\"#drop\").on(\"click\", () => {\n  numbers.pop();\n\
  \  update(numbers);\n});\n```\n\n列表 14-22：点击按钮时更新\n\n首先，我们声明了一个用于生成随机数的辅助函数 ❶，因为我们在两个地方需要此操作。然后，我们声明了三个按钮的处理器。注意，我们没有像在书中之前的那样使用普通的\
  \ DOM API 方法来添加点击处理程序，而是使用 `d3.select` 来选择按钮，并使用 `on` 方法来添加事件处理器。普通的 DOM API 方法同样有效，但使用\
  \ D3 方法更加简洁，并且与文件中其他的 D3 代码保持风格一致。\n\n第一个处理器由点击 Append 按钮触发 ❷：它将一个随机数推（push）到 `numbers`\
  \ 数组的末尾，然后我们调用 `update` 函数重新绘制可视化图形，增加一个圆圈。第二个处理器由点击 Prepend 按钮触发，它将一个随机数移（unshift）到\
  \ `numbers` 数组的前端 ❸。第三个由点击 Drop 按钮触发；它从数组中弹出（pop）最后一个数字 ❹。在执行完这些操作后，我们都调用了 `update`\
  \ 函数。\n\n刷新页面并尝试不同的按钮。你应该看到元素根据需要被添加或移除。\n\n### 过渡与关键函数\n\n与其在每次数据变化时突然地更新 D3 可视化图形，你可以使用*过渡（transitions）*来允许元素在属性改变时执行动画效果。过渡是\
  \ D3 中一个非常有用的功能，因为如果处理得当，它们能让你看到数据是如何演变的。让我们给 `update` 函数添加一个过渡，来看看它是如何工作的。按照列表\
  \ 14-23 所示所示进行更改。\n\n```\n--snip--\nfunction update(data) {\n  d3\n    .select(\"\
  svg\")\n    .selectAll(\"circle\")\n    .data(data)\n    .join(\"circle\")\n   \
  \ .transition()\n    .duration(500)\n    .attr(\"cx\", (d, i) => (i + 1) * 50)\n\
  \    .attr(\"cy\", 50)\n    .attr(\"r\", (d, i) => d * 5);\n}\n--snip--\n```\n\n\
  列表 14-23：添加过渡\n\n在这样的链式调用中使用 `transition` 方法意味着后续每一个属性变化将从当前值动画到新值。`duration` 方法设置以毫秒为单位的动画长度。这意味着每个圆圈的位置和半径将花费半秒（500\
  \ 毫秒）从当前值动画到新值。新圆圈的每个属性都从默认值 0 开始，因此它们将从 SVG 的左上角过渡进入。\n\n遗憾的是，按照我们编写 `update` 函数的方式，动画效果可能不会像你预期的那样完美。刷新页面并点击几次\
  \ **Prepend**。你应该看到一些奇怪的现象。\n\n\n\n\n你可以通过传递三个函数来定制 `join` 方法，这三个函数会在这三种可能的元素变化中的每一种被调用一次。通过这种方式，你可以指定三种不同的行为：一种用于进入元素，一种用于正在更新的元素，另一种用于退出的元素。要测试此功能，请如列表\
  \ 14-25 所示修改你的更新函数。首先，这些更改产生的结果与我们在上一个列表中通过简单 join 方法获得相同。\n\n```\n--snip--\n  .data(data,\
  \ d => d)\n  .join(\n    enter => enter.append(\"circle\"),\n    update => update,\n\
  \    exit => exit.remove()\n  )\n  .transition()\n--snip--\n```\n列表 14-25：带有 enter、update\
  \ 和 exit 函数的 join 方法。\n\n这个更高级的 `join` 方法版本接收三个函数。第一个函数带有一个名为 `enter` 的单一参数，它是每个新进入元素的临时占位符的选取集。为了获得与简单的\
  \ `.join(\"circle\")` 版本相同的行为，我们只需使用 `append` 方法为每个 `enter` 占位符添加一个圆。注意，`enter`\
  \ 占位符本身并不是 DOM 中的元素。它们只是 D3 提供的一个句柄，以便在它们被添加到 DOM 之前提供添加新进入元素的地方。例如，如果有五个新元素需要进入，`enter.append(\"\
  circle\")` 将创建五个新的圆元素并将它们放置在 `svg` 元素内部。\n\n第二个函数带有一个名为 `update` 的单一参数，它是包含所有已绑定到数据的现有元素的选取集。为了获得与之前相同的行为，我们只需原样返回该选取集。\n\
  \n第三个函数带有一个名为 `exit` 的单一参数，它是包含所有不再具有相应数据而应该移除的元素的选取集。为了获得与之前相同的行为，我们在选取集上调用 `remove`\
  \ 方法，这将从 DOM 中移除每个退出的元素。\n\n当你重新加载页面时，你应该看到与之前相同的行为；到目前为止，此更改没有任何任何功能上的影响。不过，既然我们已经让它运行起来，就可以改进动画以添加一些精致感。目前更新选取集中元素的向右移动动画是没问题的，但进入的元素目前从左上角飞入，而退出的元素直接消失了。让我们让进入的元素从它们的正确位置生长到到位，而退出的元素在当前位置收缩至消失。实现该行为的更改如列表\
  \ 14-26 所示。\n\n```\n--snip--\nfunction update(data) {\n  d3\n    .select(\"svg\"\
  )\n    .selectAll(\"circle\")\n    .data(data, d => d)\n    .join(\n      enter\
  \ => enter\n      ❶ .append(\"circle\")\n        .attr(\"cx\", (d, i) => (i + 1)\
  \ * 50)\n        .attr(\"cy\", 50)\n        .transition()\n        .duration(500)\n\
  \      ❷ .attr(\"r\", (d, i) => d * 5),\n      update => update\n        .transition()\n\
  \        .duration(500)\n      ❸ .attr(\"cx\", (d, i) => (i + 1) * 50),\n      exit\
  \ => exit\n        .transition()\n        .duration(500)\n      ❹ .attr(\"r\", 0)\n\
  \      ❺ .remove()\n    );\n}\n\nupdate(numbers); \n--snip--\n```\n列表 14-26：精修动画。\n\
  \n在更新后的代码中，我们将所有过渡移动到了单独的 `enter`、`update` 和 `exit` 函数中，而不是为所有元素使用单个过渡调用。`enter`\
  \ 函数添加一个圆元素 ❶，然后立即设置其位置（`cx` 和 `cy` 属性），但没有设置它的半径。一旦设置了位置，我们就使用 `transition` 方法将半径从零（默认值）动画到从数据计算出的值\
  \ ❷。这里的顺序很重要：链式调用中在调用 `transition` *之前*的任何内容都将立即发生，而在调用 `transition` *之后*的任何内容都将产生动画效果。这意味着任何新圆都将立即出现在正确的位置，而尺寸的变化（从零到所需的半径）将执行动画。这比之前的版本看起来可能更自然，在之前的版本中，所有三个属性都从零开始动画化，导致圆从角落飞入。\n\
  \n`update` 函数必须只对圆的 `cx` 属性进行动画处理 ❸，将其滑动到更新后的位置。对于现有元素，所有其他属性应保持不变。最后，`exit` 函数在移除元素\
  \ ❺ 之前将圆的半径动画化回零 ❹。如果在调用 `transition` 之后调用 `remove`（在此处所示），实际的元素移除将在动画完成后才会发生。\n\
  \n当你重新加载页面时，你应该看到新的且改进的动画：新元素在适当的位置展开，被移除的元素收缩消失。\n\n### 创建条形图\n\n现在你已经学习了 D3 的基础知识，让我们把它们应用到一个小型项目中：创建一个可视化文本框中字符频率的条形图。当有新文本输入或粘贴到框中时，该条形图将随之更新。创建此可视化工具将让你练习数据连接，教你一些新技术（如绘制坐标轴为数据提供上下文），并为下一章更重大的项目做好准备。\n\
  \n### 设置\n\n要开始，创建一个名为 `frequency` 的新目录，并添加空的 `script.js` 和 `style.css` 文件。然后创建一个\
  \ `index.html` 文件，并将列表 14-27 中的代码加入。\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n\
  \    <title>Character Frequency</title>\n    <link rel=\"stylesheet\" href=\"style.css\"\
  >\n  </head>\n  <body>\n    <div>\n    ❶ <textarea rows=\"5\" cols=\"70\"></textarea>\n\
  \    </div>\n    <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n\
  \    <script src=\"script.js\"></script>\n  </body>\n</html>\n```\n列表 14-27：用于字符频率项目的\
  \ index.html 文件。\n\n此 HTML 文档遵循了我们在一整本书中一直使用的模式。唯一新增的内容是 `textarea` 元素 ❶，它创建了一个多行文本输入。`rows`\
  \ 和 `cols` 属性设置了文本区域的行数和宽度（以固定宽度字符为单位）。\n\n注意，文档不包含 `svg` 元素。我们将使用 JavaScript 创建它。这是因为我们需要多次引用\
  \ `svg` 元素的宽度和高度，以确定可视化中元素的放置位置，因此在 JavaScript 中定义这些参数比在 HTML 文件中更有意义。而且既然我们将在 JavaScript\
  \ 中定义宽度和高度，我们也可以在 JavaScript 中创建 `svg` 元素本身。我们现在就这么做。将列表 14-28 中的代码添加到 `script.js`。\n\
  \n```javascript\nconst width = 600;\nconst height = 600;\n\n// 向页面添加 svg 元素\nlet\
  \ svg = d3\n  .select(\"body\")\n  .append(\"svg\")\n  .attr(\"width\", width)\n\
  \  .attr(\"height\", height);\n```\n列表 14-28：使用 JavaScript 创建 svg 元素。\n\n我们首先声明\
  \ `svg` 元素的 `width` 和 `height` 常量。然后我们使用 D3 选择 `body` 元素并为其添加一个 `svg` 元素，在此过程中设置\
  \ `width` 和 `height` 属性。我们将创建元素的结果保存到变量 `svg` 中，因为我们以后会需要它。\n\n#### 计算字符频率\n\n\n\
  \n\n接下来，我们将添加从文本区域读取文本并统计每个字符出现次数的代码。这为可视化生成了底层数据。每当文本发生变化时，我们需要更新数据并重绘图表。不过，目前我们只需要读取文本，计算字符频率，并将输出记录到控制台。请将\
  \ 列表 14-29 中的代码代码添加到 `script.js` 的末尾。\n\n```javascript\n--snip--\nd3.select(\"textarea\"\
  ).on(❶ \"input\", e => {\n❷ let frequencies = {};\n\n❸ e.target.value.split(\" \"\
  ).forEach(char => {\n    let currentCount = frequencies[char] || 0;\n    frequencies[char]\
  \ = currentCount + 1;\n  });\n\n  console.log(frequencies);\n});\n```\n\n**列表 14-29：计算字符频率**\n\
  \n`input` 事件 ❶ 在文本区域的内容发生变化时随时触发，无论是通过输入、删除、粘贴还是其他操作。我们在事件处理函数中做的第一件事是初始化一个新对象来跟踪字符频率\
  \ ❷。这个 `frequencies` 对象将使用字符作为键，并将该字符出现的次数作为值。然后，我们获取事件的目标（文本区域），获取其值（文本），并将其拆分为单个字符\
  \ ❸。对于每个字符，我们确定该字符的当前计数，如果尚未见过该字符，则默认为 0。然后我们将该计数加 1，并将新计数存回对象中。一旦完成了所有字符的计数，我们将\
  \ `frequencies` 对象打印到控制台，以便检查所有运行情况是否符合预期。请注意，我们每当文本变化时都会重新计算 `frequencies` 对象，而不是仅仅尝试跟踪添加或删除的字符。这使得处理一次性添加或删除多个字符的情况变得简单得多，例如当文本被粘贴到框中时。\n\
  \n加载页面，你应该能看到文本区域（`svg` 元素是不可见的，但如果你想检查它是否存在，可以在“元素”面板中看到它）。当你向文本区域输入文本时，你应该会在每次击键时看到控制台中都记录了对象，每次都包含文本区域中字符的频率。例如，如果你输入单词\
  \ *hello*，在输入完最后一个 *o* 后，你将得到这个对象：\n\n```json\n{\"h\": 1, \"e\": 1, \"l\": 2, \"\
  o\": 1}\n```\n\n一个包含所有字符及其频率的单个对象对于记录到控制台效果良好，但我们使用 D3 渲染时，我们需要一个对象数组，每个对象描述单个字符及其相关的频率。这样，数组中的每个条目将绑定到我们柱状图中每个条形的数据（datum）。为了让图表更易读，数组应该按字符的字母顺序排序。继续以单词\
  \ *hello* 为，而不是之前显示的对象，我们需要类似这样的内容：\n\n```json\n[\n  {\"char\": \"e\", \"count\"\
  : 1},\n  {\"char\": \"h\", \"count\": 1},\n  {\"char\": \"l\", \"count\": 2},\n\
  \  {\"char\": \"o\", \"count\": 1}\n]\n```\n\n要将数据放入此数组格式，请按照 列表 14-30 所示修改 `script.js`\
  \ 的末尾。\n\n```javascript\n--snip--\n    frequencies[char] = currentCount + 1;\n \
  \ });\n\n❶ let data = Object.entries(frequencies).map(pair => {\n    return {char:\
  \ pair[0], count: pair[1]};\n  });\n\n❷ data.sort((a, b) => d3.ascending(a.char,\
  \ b.char));\n\n  console.log(data);\n});\n```\n\n**列表 14-30：将频率数据转换为数组**\n\n首先，我们使用\
  \ `Object.entries` 将 `frequencies` 对象转换为一个由双元素数组组成的数组 ❶，其中第一个元素是键，第二个元素是值。我们将该数组映射为一个对象数组，其中键存储在属性\
  \ `char` 下，而值存储在属性 `count` 下。接下来，我们想要按字符对数据进行排序。`sort` 方法 ❷ 通过对每对元素 `a` 和 `b` 应用比较函数对数组中的元素进行排序，决定\
  \ `a` 应该排在 `b` 之后还是反之。这里我们使用 `d3.ascending` 比较函数，传递 `a.char` 和 `b.char`，这意味着数组将根据每个对象的\
  \ `char` 属性按字母升序排序。\n\n重新加载页面，现在你应该能看到当文本区域中的文本变化时，这个新的数据数组会被记录。\n\n### 绘制柱状图\n\n\
  现在我们已经有了所需格式的数据，可以将其渲染为柱状图。我们目前将从一个基础、原始的渲染开始，即简单的创建宽度与字符频率成比例的 `svg rect` 元素。我们将在此基础上逐步构建出一个包含更多信息的可视化结果。按照\
  \ 列表 14-31 所示修改 `script.js`。\n\n```javascript\n--snip--\n// 向页面添加一个 svg 元素\nlet\
  \ svg = d3\n  .select(\"body\")\n  .append(\"svg\")\n  .attr(\"width\", width)\n\
  \  .attr(\"height\", height);\n\n❶ function update(data) {\n  svg\n    .selectAll(\"\
  rect\")\n    .data(data)\n  ❷ .join(\"rect\")\n    .attr(\"width\", (d, i) => d.count\
  \ * 5)\n    .attr(\"height\", 10)\n    .attr(\"x\", 20)\n    .attr(\"y\", (d, i)\
  \ => i * 20);\n}\n\nd3.select(\"textarea\").on(\"input\", e => {\n--snip--\n\n \
  \ data.sort((a, b) => d3.ascending(a.char, b.char));\n\n❸ update(data);\n});\n```\n\
  \n**列表 14-31：定义更新函数**\n\n我们在这里声明了一个 `update` 函数 ❶，它每当文本变化 ❸ 时就会被调用。该函数根据我们之前学习的将数据绑定到选择（使用\
  \ `data` 方法）并使用简单版本的 `join` 方法连接必要的元素的相同模式，来创建、更新或删除渲染数据所需的 SVG 元素。\n\n`join` 方法返回一个包含所有当前\
  \ `rect` 元素的选择 ❷，包括任何刚添加的元素。每个 `rect` 现在都绑定到单个 `datum`，它代表单个字符和该字符出现的次数。我们设置合适的\
  \ `width`、`height`、`x` 和 `y` 属性来创建一个水平方向的柱状图。`width` 属性设置为字符计数的 5 倍，因此每个字符的每个实例都会让条形宽\
  \ 5 像素。`height` 属性是一个常量值 10（所有条形高度相同），`x` 属性是一个常量值 20（所有条形从 `svg` 元素的左侧 20 像素处开始）。`y`\
  \ 属性设置为 `datum` 索引的 20，这意味着每 20 像素有一个条形，每个条形之间留有 10 像素的空间。\n\n重新加载页面并在文本区域中输入单词\
  \ *hello*。当你输入每个字母时，你应该看到条形在 `svg` 元素中出现或更新，最后结果类似于 图 14-9。\n\n![](img/Figure_14-9.png)\n\
  \n**图 14-9：基础柱状图**\n\n到为止一切良好，但我们还有路路要走。这里有两个主要问题。首先，没有轴或标签，所以我们不知道每个条形代表哪个字符，也不知道条形的宽度对应什么。其次，条形的宽度和高度没有进行自动缩放，这意味着在条形无法放入\
  \ 600×600 像素的 `svg` 元素之前，我们目前有 30 个不同字符和每个字符 116 次的计数限制。幸运的是，这两个问题都可以用 D3 轻松地解决。\n\
  \n### 缩放条形\n\n\n\n\n\nD3 中的 `scale`（比例尺）是将某些数据值转换为视觉值的一种方法。例如，之前我们将字符频率图中条形形的宽度设置为数据值的五倍，这是缩放的一种简单形式。在这种情况下，我们手动设置了缩放因子，但\
  \ D3 也可以根据数据的最小值和最大值（称为 `domain`，域）以及显示的最小值和最大值（称为 `range`，范围）自动确定缩放。\n\n例如，假设你正在绘制一张人体年龄图。你的数据值范围从\
  \ 0 到 105，而渲染这些值的空间从 SVG 的左侧的 30 到 330 像素。你的 `domain` 是 `[0, 105]`，`range` 是 `[30,\
  \ 330]`。数据域中的值 0 映射到视觉范围中的 30，而值 105 映射到 330。请参阅图 14-10 以查看此映射的视觉化表示。\n\n![](img/Figure_14-10.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-10: 将域 [0, 105] 的值缩放到范围\
  \ [30, 330]</samp>\n\nD3 缩放的精妙之处在于，缩放因子可以根据 `domain` 的变化而动态改变。这样，即使最大数据值发生变化，当前的最大数据值也可以始终映射到整个视觉范围。为了为我们的条形图实现这种动态缩放，我们需要跟踪所有数据中的最大计数值，并将其用作\
  \ `domain` 的上边界。结果是，如果最大计数增加，未达到最大计数的条形都将相应缩小，而达到最大计数的条形将继续占据整个水平范围。例如，假设我们条形形的视觉范围为\
  \ `[0, 500]`，我们有以下数据：\n\n```\n[\n  {\"char\": \"a\", \"count\": 1},\n  {\"char\"\
  : \"b\", \"count\": 1},\n  {\"char\": \"c\", \"count\": 2}\n]\n```\n\n我们数据的 `domain`\
  \ 将是 `[0, 2]`。\"c\" 条形宽为 500 个单位，而 \"a\" 和 \"b\" 条形每个宽 250 个单位。如果我们再添加两个 c，“c\"\
  \ 条形仍为 500 个单位宽，但现在 \"a\" 和 \"b\" 条形每个将变为 125 个单位宽。\n\n现在让我们来实现这种动态水平缩放。请使用列表 14-32\
  \ 所示的代码修改你的脚本。\n\n```\n--snip--\n// 在页面上添加 svg 元素\nlet svg = d3\n  .select(\"body\"\
  )\n  .append(\"svg\")\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\
  \nlet margin = {top: 20, right: 10, bottom: 20, left: 50};\n\nfunction update(data)\
  \ {\n❶ let xScale = d3.scaleLinear()\n    .domain([0, d3.max(data, d => d.count)])\n\
  \    .range([margin.left, width - margin.right]);\n\n  svg\n    .selectAll(\"rect\"\
  )\n    .data(data)\n    .join(\"rect\")\n  ❷ .attr(\"width\", (d, i) => xScale(d.count)\
  \ - xScale(0))\n    .attr(\"height\", 10)\n  ❸ .attr(\"x\", xScale(0))\n    .attr(\"\
  y\", (d, i) => i * 20);\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-32: 为条形宽度创建比例尺</samp>\n\n首先，在 `update` 函数定义正之前，我们创建了一个描述条形图表边距（margins）的对象。这些值指示了图表主体距离\
  \ SVG 元素边缘有多远。如图 14-11 所示，到那个时候，我们将使用这些边距来决定在哪里绘制条形和坐标轴。\n\n![](img/Figure_14-11.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 14-11: 如何使用边距在 SVG 元素中定位图形（虚线）</samp>\n\
  \n在 `update` 函数内部，我们使用 `d3.scaleLinear` 方法创建一个比例尺 ❶。这意味着输入值线性地映射到输出值（而不是对数地映射，例如）。我们使用\
  \ `d3.max` 辅助函数将 `domain` 从 0 设置到最大计数。该辅助函数接收一个数据数组和一个从数据项中返回返回值的函数，并返回最大值。在这种情况下，它返回的是最大计数值。`range`\
  \ 设置为 `margin.left` 到 `width - margin.right`，这给了我们最长条形右侧的位置。\n\n`scaleLinear` 辅助函数为我们提供了一个从数据域映射到视觉范围的函数，将其赋值给变量\
  \ `xScale`。（正如第 5 章中所过的，高阶函数可以返回另一个函数，正如 `scaleLinear` 在此处所做的那样。）我们修改 `width` 属性设置，调用该\
  \ `xScale` 函数并传递每个数据项的计数 ❷。在这里，`xScale(0)` 提供条形左侧的水平位置，对应于域值 0，而 `xScale(d.count)`\
  \ 提供条形右侧的水平位置。要获得条形的宽度，我们需要从 `xScale(d.count)` 减去 `xScale(0)`，因为宽度只是条形左侧和右侧之间的距离。这将根据每个数据项的计数和最大计数提供适当的条形宽度。我们将条形的\
  \ `x` 属性设置为 `xScale(0)` 以强制执行左边距 ❸。\n\n刷新页面并在文本区域中开始输入。当你第一次输入字符时，会出现一个最大宽的单条形。尝试输入\
  \ *abccc*。\n\n\n\n\n\n图 14-12：我们在两个维度上都缩放过的柱形图\n\n尝试输入不同的文本，感受柱条随数据变化而更新的情况。接下来，我们将添加带有标签的轴，这些标签将随缩放一起更新，以显示数据的实际范围。这将使图表变得更容易理解。\n\
  \n### 添加带有标签的轴\n\n`D3` 轴辅助函数允许你沿着图表的侧边绘制轴。`D3` 中的轴包含一条水平或垂直线，以及垂直于该线绘制的小刻度线（tick\
  \ marks）和每个刻度对应的数值，如图 14-13 所示。轴允许你看到数据域（data domain）中的值。\n\n![](img/Figure_14-13.png)\n\
  \n图 14-13：用于数字 0 到 8 的轴\n\n轴与比例尺（scales）紧密相关，事实上，你需要一个比例尺来创建轴。例如，图 14-13 中的轴宽度为\
  \ 540 像素，包含从 0 到 8 的数字。该轴是使用域为 `[0, 8]` 范围为 `[0, 540]` 的比例尺创建的。\n\n要绘制轴，你首先必须定义一个包含轴元素的\
  \ `g` 元素。然后，你使用其中一个 `D3` 轴辅助函数创建一个轴生成器对象，最后使用该生成器对象将轴元素绘制到 `g` 元素中。\n\n我们的图表将有两个轴：一个用于显示计数值的顶部轴，以及一个用于显示字符值的左侧轴。首先，我们将添加\
  \ `g` 元素，如代码列表 14-34 所示。\n\n```\n--snip--\nlet margin = {top: 20, right: 10, bottom:\
  \ 20, left: 50};\n\n// Top axis container\n❶ let topContainer = svg\n  .append(\"\
  g\")\n  .attr(\"id\", \"top\")\n  .attr(\"transform\", ❷ `translate(0, ${margin.top})`);\n\
  \n// Left axis container\n❸ let leftContainer = svg\n  .append(\"g\")\n  .attr(\"\
  id\", \"left\")\n  .attr(\"transform\", ❹ `translate(${margin.left}, 0)`);\n\nfunction\
  \ update(data) {\n--snip--\n```\n\n代码列表 14-34：添加包含顶部和左侧轴的 g 元素\n\n我们通过向 `svg` 元素添加一个\
  \ `g` 元素并赋予其 id 为 `\"top\"` 来创建顶部轴容器 ❶。由于我们定义了 `xScale` 的范围为 `[margin.left, width\
  \ - margin.right]`，这同时也定义了轴的视觉范围。然而，`xScale` 并不感知垂直位置，这就是为什么我们必须将其向下平移 `margin.top`\
  \ ❷。我们将元素选择存储在名为 `topContainer` 的变量中，以便在稍后将轴绘制到容器时引用它。左侧轴容器以类似的方式创建的 ❸，但这次我们必须将其向右平移\
  \ `margin.left` ❹，因为 `yScale` 不感知水平位置。\n\n现在我们已经有了容器，就可以绘制轴了。对 `update` 函数进行如代码列表\
  \ 14-35 所示的修改。\n\n```\n--snip--\n  let yScale = d3.scaleBand()\n    .domain(data.map(d\
  \ => d.char))\n    .range([margin.top, height - margin.bottom])\n    .padding(0.5);\n\
  \n  let topAxis = d3.axisTop(xScale);\n\n  let leftAxis = d3.axisLeft(yScale);\n\
  \n  topContainer\n    .call(topAxis);\n\n  leftContainer\n    .call(leftAxis);\n\
  \n  svg\n    .selectAll(\"rect\")\n    .data(data)\n    .join(\"rect\")\n--snip--\n\
  ```\n\n代码列表 14-35：绘制轴\n\n在这里我们调用了 `d3.axisTop` 并传入 `xScale`，调用了 `d3.axisLeft` 并传入\
  \ `yScale`。这给了我们两个轴生成器：`topAxis` 和 `leftAxis`。轴生成器接收元素选择并在该元素中绘制轴。然而，我们并没有向轴生成器传递选择，而是将生成器本身传递给一个名为\
  \ `call` 的 `D3` 方法。该方法当链到选择上（在此情况下为 `topContainer` 或 `leftContainer`）时，会在当前选择上调用提供的函数。因此，编写\
  \ `topContainer .call(topAxis);` 等同于编写 `topAxis(topContainer);`，两种语句都会绘制柱形图的顶部轴。使用\
  \ `call` 被认为更符合惯用法（idiomatic），这使得更容易在语句上链用其他方法。\n\n刷新页面并在文本区域中输入一些文本。你将看到轴，如图 14-14\
  \ 所示。\n\n![](img/Figure_14-14.png)\n\n图 14-14：我们现在带有轴的柱形图\n\n如果你在网页检查器中检查轴，你会发现它们是由\
  \ `g`、`path`、`text` 和 `line` 元素组成的。`line` 元素类似于 `path`，但它仅通过 `x1`、`x2`、`y1` 和 `y2`\
  \ 属性定义起点和终点。这些属性在 SVG 规范中默认值为 0，这在绘制这些轴时通常完全足够，因此你会在检查器中发现许多 `line` 属性并没有被显式设置。\n\
  \n目前顶部轴有两个地方不太对。首先，如你在图 14-14 所示，标签包含了带有小数点的数字（例如 2.5），但我们只关心整数（你不可能有一个半字符）。因此，我们需要找到一种方法只渲染整数（也称为\
  \ integers）。其次，如果你输入 15 个相同的字符字符串（例如，*aaaaaaaaaaaaaaa*），那么标签将只显示从 0 到 14 的偶数，而不会有\
  \ 15 的标签，如图 14-15 所示。随着最大计数的增加，你将继续看到这个问题，特别是在超过 30 之后，刻度会切换为 5 的倍数。\n\n![](img/Figure_14-15.png)\n\
  \n图 14-15：最大计数为 15 时的顶部轴\n\n我们在这里更希望域扩展到 16，以便给出一个更好好看的轴。幸运的是，第二个问题很容易修复。`D3` 比例尺有一个很好的方法，可以将它们的域扩展到下一个“圆整”数字，在这种情况下，这意味着下一个会绘制刻度的数字。代码列表\
  \ 14-36 显示了如何引入这种方法。\n\n```\n--snip--\n  let xScale = d3.scaleLinear()\n    .domain([0,\
  \ d3.max(data, d => d.count)])\n    .range([margin.left, width - margin.right])\n\
  \    .nice();\n--snip--\n```\n\n代码列表 14-36：让我们的 x 比例尺“nice”\n\n当你刷新页面并再次输入 15 个相同的字符时，你会发现轴现在扩展到了\
  \ 16。只渲染整数需要更多的努力。这里的基本方法是获取刻度值，过滤它们只保留整数，然后在轴上设置这些刻度值。此外，我们还希望更改数字渲染以排除小数点，因此我们渲染\
  \ 1 而不是 1.0。这些更改在代码列表 14-37 所示。\n\n```\n--snip--\n  let yScale = d3.scaleBand()\n\
  \  .domain(data.map(d => d.char))\n  .range([margin.top, height - margin.bottom])\n\
  \  .padding(0.5);\n\n❶ let topAxisTicks = xScale.ticks()\n    .filter(tick => Number.isInteger(tick));\n\
  \n  let topAxis = d3.axisTop(xScale)\n  ❷ .tickValues(topAxisTicks)\n  ❸ .tickFormat(d3.format(\"\
  d\"));\n\n  let leftAxis = d3.axisLeft(yScale); \n--snip--\n```\n\n代码列表 14-37：在顶部轴上渲染整数刻度\n\
  \n\n\n\n首先，我们必须获取刻度（ticks），这可以通过 `xScale` 生成器的 `ticks` 方法获取 ❶。然后，我们使用 `Number.isInteger`\
  \ 将刻度过滤为整数值。这将把类似 `[0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4]` 的数组转换为 `[0, 1, 2, 3, 4]`。接下来，我们使用\
  \ `tickValues` 方法在顶端轴上设置过滤后的刻度值 ❷。最后，我们使用 `tickFormat` 方法为数字设置渲染格式 ❸。该方法接受一个格式化函数，用于对每个刻度值格式格式。在这种情况下，`d3.format(\"\
  d\")` 返回一个格式化数字且不带小数点的函数。\n\n刷新页面并再次输入一些文本；你应该能看到渲染出的不带小数点的整数。\n\n### 使用 CSS 和正则表达式进行样式设计\n\
  \n接下来，我们将使用一些 CSS 样式改进图表的外观。为了更好地区分不同类型的字符，我们将根据条形是否是小写字母、大写字母、数字还是其他字符，为它们赋予不同的颜色。为了实现这一点，我们需要一个能够区分这些类型字符的函数。该函数将使用`正则表达式`（regular\
  \ expressions），这是一种在文本字符串中指定模式并然后判断其他字符串是否匹配这些模式的方法。\n\n> **注意**\n\n> JavaScript\
  \ 的正则表达式功能非常强大，但我们将只考虑此项目需要的特性。要了解更多信息，请访问网站 [`www.regular-expressions.info`](https://www.regular-expressions.info)，或者在\
  \ MDN 中搜索“regular expressions”。\n\nJavaScript 拥有一种正则表达式字面量语法，由正斜杠分隔。例如，`/hi/` 是一个正则表达式字面量，用于匹配任何包含字符序列\
  \ `hi` 的字符串。`hi` 可以出现在字符串的任何位置。例如，正则表达式 `/hi/` 会匹配单词 `hither`、`Chicken` 和 `sushi`。你可以通过添加特殊字符来更精确地定义正则表达式的模式。例如，表达式开头的脱符号（`^`）表示字符序列应该出现在字符串的开头，因此\
  \ `/^hi/` 匹配任何以 `hi` 开头的字符串。同样，表达式末尾的美元符号（`$`）表示字符序列应该出现在字符串的结尾，因此 `/hi$/` 匹配任何以\
  \ `hi` 结尾的字符串。\n\n你可以使用正则表达式的 `test` 方法来查看特定字符串是否匹配。以下是 JavaScript 控制台中的示例：\n\n\
  ```\n/^hi/.test(\"hi there\");\ntrue\n/^hi/.test(\"Chicken\");\nfalse\n```\n\n字符串\
  \ \"hi there\" 通过了测试，因为 `hi` 出现在字符串的开头，而 \"Chicken\" 则没有通过。\n\n你可以结合使用 `^` 和 `$`\
  \ 创建一个必须匹配整个字符串的正则表达式。例如，`/^hi$/` 将仅匹配字符串 \"hi\" 而不匹配其他任何内容，如下所示：\n\n```\n/^hi$/.test(\"\
  hi\");\ntrue\n/^hi$/.test(\"him\");\nfalse\n```\n\n要匹配字符范围而不是单个字符，请使用方括号和连字符描述该范围。例如，`/[a-z]/`\
  \ 匹配从 `a` 到 `z` 的任何小写字母。正则表达式 `/^[A-Z][a-z]$/` 匹配包含一个大写字母后跟一个小写字母且没有有其他字符的字符串。在你的控制台中尝试一下：\n\
  \n```\n/^[A-Z][a-z]$/.test(\"Hi\");\ntrue\n/^[A-Z][a-z]$/.test(\"iH\");\nfalse\n\
  /^[A-Z][a-z]$/.test(\"Hip\");\nfalse\n```\n\n对于此项目，我们需要三个正则表达式：`/^[a-z]$/`（匹配单个小写字母）、`/^[A-Z]$/`（匹配单个大写字母）和\
  \ `/^[0-9]$/`（匹配单个数字）。如果一个字符不匹配其中任何一个表达式，我们就知道它是其他类型的字符，比如空格或标点符号。查看列表 14-38 中新的\
  \ `getClass` 函数，它使用这些正则表达式为给定字符的条形选择 CSS 类名。将此函数添加到 `script.js` 中，紧邻更新函数之前。\n\n\
  ```\n--snip--\n// 左侧轴容器\nlet leftContainer = svg\n  .append(\"g\")\n  .attr(\"id\"\
  , \"left\")\n  .attr(\"transform\", `translate(${margin.left}, 0)`);\n\nfunction\
  \ getClass(char) {\n  if (/^[a-z]$/.test(char)) {\n    return \"lower\";\n  } else\
  \ if (/^[A-Z]$/.test(char)) {\n    return \"upper\";\n  } else if (/^[0-9]$/.test(char))\
  \ {\n    return \"number\";\n  } else {\n    return \"other\";\n  }\n}\n\nfunction\
  \ update(data) {\n--snip--\n```\n\n**列表 14-38: getClass 函数**\n\n该函数根据提供的正则表达式对字符进行测试，并返回相应的类名：\"\
  lower\"、upper\"、number\" 或 \"other\"。接下来，我们将更新渲染代码，使用此函数为每个 `rect` 元素设置类名，如列表 14-39\
  \ 所示。\n\n```\n--snip--\n  svg\n    .selectAll(\"rect\")\n    .data(data)\n    .join(\"\
  rect\")\n    .attr(\"width\", (d) => xScale(d.count))\n    .attr(\"height\", yScale.bandwidth())\n\
  \    .attr(\"x\", (d) => xScale(d.char))\n    .attr(\"y\", (d) => yScale(d.char))\n\
  \    .attr(\"class\", (d) => getClass(d.char));\n--snip--\n```\n\n**列表 14-39: 根据字符应用类名**\n\
  \n现在每个 `rect` 元素都将根据字符拥有一个类名。最后一步是编写 CSS，为每个类名设置不同的填充颜色。将列表 14-40 中的 CSS 代码添加到 `style.css`\
  \ 中。\n\n```css\n.lower {\n  fill: purple;\n}\n.upper {\n  fill: orangered;\n}\n\n\
  .number {\n  fill: green;\n}\n\n.other {\n  fill: #555;\n}\n```\n\n**列表 14-40: 定义不同的样式**\n\
  \n现在当你刷新页面并输入不同的字符时，你应该看到类似图 14-16 的效果。\n\n![](img/Figure_14-16.png)\n\n**图 14-16:\
  \ 颜色编码条形**\n\n条形将根据输入的字符分配不同的颜色。\n\n### 数据清洗\n\n通常需要通过修复数据包含的错误或不规则之处来清洗数据集。例如，我们目前条形图方法的一个问题是，不同的空白字符显示为不同的条形，且每个标签都是不可见的（因为标签的内容只是空白）。这些空白字符包括空格、换行符、制表符以及通过不同组合组合输入的各种其他空格（例如不换行空格，在\
  \ macOS 上使用 OPTION-space，在 Windows 上使用 CTRL-SHIFT-space）。为了修复这个问题，我们在字符计数之前将所有空白字符转换为相同的\
  \ `\"<space>\"` 字符串，这样所有空白将由一个具有可读标签的条形可视化。如列表 14-41 所示更新你的 `script.js` 文件。这些更新位于文件末尾。\n\
  \n```\n--snip--\nfunction standardizeSpace(char) {\n❶ if (char.trim() == \" \")\
  \ {\n    return \"<space>\";\n  } else {\n    return char;\n  }\n}\n\nd3.select(\"\
  textarea\").on(\"input\", e => {\n  let frequencies = {};\n\n  e.target.value.split(\"\
  \ \").forEach(char => {\n  ❷ let standardized = standardizeSpace(char);\n    let\
  \ currentCount = frequencies[standardized] || 0;\n    frequencies[standardized]\
  \ = currentCount + 1;\n  });\n--snip--\n```\n\n**列表 14-41: 标准化空白字符**\n\n\n\n\n我们首先声明一个\
  \ `standardizeSpace` 函数，它接收一个字符并对其调用 `trim` 方法 ❶。`trim` 方法会移除字符串开头或结尾的空白字符，因此如果它返回空字符串，我们就知道该字符是空白字符。在这种情况下，我们返回字符串\
  \ `\"<space>\"`。否则，我们原样返回字符。然后我们必须修改文本处理代码，在将这些字符作为 `frequencies` 对象的键之前，调用我们的函数并标准化空白字符\
  \ ❷。\n\n现在，当你文本区域中输入各种类型的空白字符时，你应该看到一个标记为 `<space>` 的单个条形，而不是多个标签为空的条形。\n\n## 为更改动画\n\
  \n我们的最后一个任务是为轴和柱状图添加动画。这将更容易看到新元素的添加以及现有元素计数的变化。要为轴添加动画，我们只需要在 `update` 函数内部的 `topContainer`\
  \ 和 `leftContainer` 选择中添加对 `transition` 的调用，如 Listing 14-42 所示。\n\n```\n--snip--\n\
  let leftAxis = d3.axisLeft(yScale);\n\ntopContainer\n  .transition()\n  .call(topAxis);\n\
  \nleftContainer\n  .transition()\n  .call(leftAxis);\n--snip--\n```\n\nListing 14-42：为轴添加动画\n\
  \n现在，当轴范围更新以适应新数据时，现有的刻度将动画到它们更新后的位置，新刻度将淡入。\n\n我们为柱状图添加过渡效果有两种选择：我们可以保留现有的 join\
  \ 代码并仅添加单个 `transition` 调用，或者我们可以使用之前描述的高级 join 技术，这允许我们根据元素是进入（entering）、更新（updating）还是退出（exiting）来定制过渡。正如你可能猜到的，我们将采用高级版本！你可以在\
  \ Listing 14-43 中找到更新后的 update 代码。\n\n```\n--snip--\n  leftContainer\n    .transition()\n\
  \    .call(leftAxis);\n\n  svg\n    .selectAll(\"rect\")\n  ❶ .data(data, d => d.char)\n\
  \    .join(\n    ❷ enter => enter\n        .append(\"rect\")\n        .attr(\"x\"\
  , xScale(0))\n        .attr(\"y\", (d, i) => yScale(d.char))\n        .attr(\"class\"\
  , d => getClass(d.char))\n        .transition()\n        .attr(\"width\", d => xScale(d.count)\
  \ - xScale(0))\n        .attr(\"height\", yScale.bandwidth()),\n    ❸ update =>\
  \ update\n        .transition()\n        .attr(\"width\", d => xScale(d.count) -\
  \ xScale(0))\n        .attr(\"height\", yScale.bandwidth())\n        .attr(\"y\"\
  , (d, i) => yScale(d.char)),\n    ❹ exit => exit\n        .transition()\n      \
  \  .attr(\"width\", 0)\n        .attr(\"height\", 0)\n        .remove()\n    );\n\
  }\n--snip--\n```\n\nListing 14-43：为柱状图添加动画\n\n我们必须做的第一件事是设置一个 key 函数 ❶，告诉 D3 使用数据的\
  \ `char` 属性作为其标识符。接下来，我们切换到高级 join 技术，类似于 Listing 14-25。`enter` 函数 ❷ 在调用 `transition`\
  \ 之前先添加 `rect` 元素并设置其 `x`、`y` 和 `class` 属性，这意味着这些属性不会有动画。`width` 和 `height` 属性在\
  \ `transition` 调用之后，因此这些属性将会有动画。这样，新元素将从左轴原地生长。\n\n`update` 函数 ❸ 再次对 `width` 和 `height`\
  \ 执行动画，同时也对 `y` 属性执行动画。这意味着当添加新元素时，现有元素将滑动到新位置。\n\n最后，`exit` 函数 ❹ 在删除元素之前将 `width`\
  \ 和 `height` 变为 0，导致元素在之前的位置收缩消失。\n\n重新加载页面并尝试在文本区域中添加和删除字符。享受观察元素进入、退出或更新的过程。\n\
  \n### 总结\n\n在本章中，你学习了 SVG 的基础知识，以及如何使用 D3 根据数据集的实时变化创建、更新和删除 SVG 元素。到目前，你应该对如何在\
  \ D3 中构建基于数据的应用程序有了很好的理解。在下一章中，我们将通过构建一个从 API 读取数据并将其渲染为交互式图表的应用程序来运用这些知识。\n\n##\
  \ 15 从 GitHub Search API 可视化数据\n\n![](img/opener.png)\n\n在这个最后一个项目中，你将构建一个应用程序，从公共\
  \ API 读取数据并使用 D3 根据这些数据构建交互式柱状图。我们将从 GitHub Search API 读取数据。该 API 允许你在 GitHub 上搜索数据，这是一个托管\
  \ Git 仓库的服务（Git 是一种用于跟踪软件项目源代码的流行版本控制系统）。该 API 使用 HTTPS 协议并根据你编码到 URL 中的搜索查询返回 JSON\
  \ 格式的数据。\n\n如果你以前没有用过 GitHub，请访问 `https://github.com` 查看它的样子。在页面顶部，你会看到一个搜索框，可以用它来搜索公共的开源仓库（即源代码供任何人阅读和使用的仓库）。与其手动使用该搜索框，GitHub\
  \ Search API 允许我们通过程序化的方式执行搜索——例如使用 JavaScript。该 API 可以搜索 GitHub 上的各种项目，如仓库、用户和问题（issues）。我们将使用仓库搜索功能来查找顶部的\
  \ JavaScript 仓库。然后我们将绘制一个 D3 柱状图，按流行程度对仓库进行排名。观众可以通过悬停在其条形上来更多地了解每个仓库。我们还将通过允许观众根据软件许可证隐藏或显示仓库来增加一些交互性。\n\
  \n这个项目将让你获得处理来自 JSON API 的真实数据的经验。大量的编程工作归结为向第三方 API 发起请求并对返回的数据进行一些处理，正如你在这里练习的那样。你还将运用第\
  \ 14 章中学会的所有 D3 知识，构建更有趣的交互式图表，并学习创建更丰富可视化的技术。\n\n### 设置\n\n开始之前，创建一个名为 `github`\
  \ 的新目录，并添加空的 `style.css` 和 `script.js` 文件。然后创建一个 `index.html` 文件并添加 Listing 15-1\
  \ 中的代码。\n\n```\n<!DOCTYPE html>\n<html\n  <head>\n    <title>GitHub</title>\n  \
  \  <link rel=\"stylesheet\" href=\"style.css\">\n  </head>\n  <body>\n    <script\
  \ src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"></script>\n    <script src=\"script.js\"\
  ></script>\n  </body>\n</</html>\n```\n\nListing 15-1：用于我们的 GitHub Search API 可视化的\
  \ index.html 文件\n\n这是我们在第 14 章中使用的相同的基础 HTML 文件。它通过链接到 `https://unpkg.com` 上库副本的\
  \ script 元素允许我们访问 D3。\n\n### 获取数据\n\n现在让我们尝试从 GitHub Search API 获取一些数据。为了做到，我们需要将数据请求格式化为\
  \ URL 的一部分。访问该 URL 即可获取数据。整个 URL（包括我们将使用的搜索查询）如下（注意为了适应页面，它被分成了两行）：\n\n```\nhttps://api.github.com/search/repositories?q=language%3Ajavascript%20stars%3A\n\
  %3E10000&per_page=20&sort=stars\n```\n\n\n\n然而，我们不会手动输入 URL，而是将使用 JavaScript 来构建它，这样更容易理解和修改。\n\
  \nURL 包含两个部分：基础 URL（base URL），它让我们访问 API；以及查询字符串（query string），我们在其中指定想要的数据。这两个部分由一个问号（`?`）分隔。查询字符串包含键值对，用于向\
  \ API 发送有关我们所做查询的信息。每个键和值之间通过等号（`=`）连接，每个键值对之间通过连符号（`&`）分隔。在这个 URL 中，键为 `q`（搜索查询）、`per_page`（每页结果数）和\
  \ `sort`（结果排序方式）。查询字符串中的键和值允许包含一组有限的字符：a–z、A–Z、0–9、连字符（`-`）、点（`.`）、下划线（`_`）、波浪号（`~`）以及少量其他特殊字符。所有其他字符必须使用\
  \ `URL encoding` 系统表示，这也是 URL 中所有百分号（`%`）字符来源。例如，冒号（`:`）被编码为 `%3A`，空格被编码为 `%20`。\n\
  \n为了简化操作，我们将编写一个函数，它接收一个包含未编码查询字符串参数的对象，并将其转换为格式正确且编码后的 URL。将 Listing 15-2 中的代码添加到\
  \ `script.js`。\n\n```javascript\nfunction getUrl() {\n❶ let baseUrl = \"https://api.github.com/search/repositories\"\
  ;\n\n❷ let params = {\n    q: \"language:javascript stars:>10000\",\n    per_page:\
  \ 20,\n    sort: \"stars\"\n  };\n\n❸ let queryString = Object.entries(params).map(pair\
  \ => {\n    return `${pair[0]}=${encodeURIComponent(pair[1])}`;\n  }).join(\"&\"\
  );\n\n❹ return `${baseUrl}?${queryString}`;\n}\n\nlet url = getUrl();\n\nconsole.log(url);\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 15-2: 创建 URL</samp>\n\
  \n创建 URL 的代码位于 `getUrl` 函数中。该函数首先设置基础 URL（查询字符串之前的部分） ❶。接着，为了构建查询字符串，我们从创建一个 `params`\
  \ 对象 ❷ 开始，其中搜索查询 `q` 使用了 GitHub 的搜索查询格式。具体来说，我们正在搜索语言为 JavaScript 且星数超过 10,000 的仓库（GitHub\
  \ 用户可以“点星”仓库以备后之用，因此星数是受欢迎程度的粗略衡量标准）。如果你想，可以在 `https://github.com` 的搜索框中尝试此查询。\n\
  \n接下来，我们对 `params` 中的键值对进行映射（map），为每对创建一个格式为 \"key=value\" 的字符串 ❸。键不需要进行 URL 编码——未加引号的对象的键不包含任何特殊字符，因此它们在\
  \ URL 中已经是有效的了——但我们使用内置函数 `encodeURIComponent` 对值进行编码，该函数会将任何不允许的字符替换为它们的百分比编码版本。然后，我们将字符串连接在一起，并用\
  \ `&` 字符分隔，通过组合基础 URL、`?` 字符和查询字符串来构建并返回最终的 URL ❹。我们通过调用 `getUrl` 函数并将结果打印到控制台来结束脚本。\n\
  \n当你加载页面并打开控制台时，你应该能看到之前打印的 URL。如果你复制该 URL 并将其粘贴到浏览器的地址栏中，你应该看到大量的 JSON 数据。如果不是，请确保\
  \ URL 与上一页的 URL 匹配，如果不匹配请检查你的代码。如果 URL 看起来是正确的但你没有获取数据，或者收到了错误消息，可能是 GitHub 更改其\
  \ API 的工作方式。请查看后续的“已认证与未认证 API”框以获取在这种情况下的操作指导。\n\n要将 JSON 数据引入你的应用程序，你可以使用 D3 的\
  \ `json` 辅助方法，它可以从指定的 URL 获取 JSON。如 Listing 15-3 所示更新 `script.js` 的末尾。\n\n```javascript\n\
  --snip--\nlet url = getUrl();\n\nd3.json(url).then(data => {\n  console.log(data);\n\
  });\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 15-3: 获取 JSON\
  \ 数据</samp>\n\n从 API 获取大量数据可能需要一些时间，因此 `d3.json` 方法返回一个 `Promise`，这是一种代表未来可用内容的对象类型。`then`\
  \ 方法接收一个函数，该函数会在数据准备绪时调用。D3 将 JSON 响应字符串转换为 JavaScript 对象，因此 `data` 将是一个对象。在这里，我们只是将其打印到控制台。\n\
  \n当你重新加载页面并在等待几秒后，你应该会在控制台中看到数据。花点时间检查它。你应该看到三个顶层属性：`incomplete_results`、`items`\
  \ 和 `total_count`。如果查询时间过长导致 API 只能返回部分结果，`incomplete_results` 将为 `true`；否则为 `false`。`total_count`\
  \ 属性给出该搜索查询的结果数（这是搜索找到的结果总量，其中仅返回了前 20 个）。`items` 数组包含当前调用的结果；它应该包含 20 个项目。每个项目都是一个包含特定仓库信息的对象，包括其名称、描述和其他各种详细信息。其中几个字段本身就是\
  \ GitHub API URL，可以通过它们来获取有关仓库的额外信息。例如，`languages_url` 是一个 API URL，告诉你仓库使用了哪些编程语言，并按每种语言的代码数数细分。\n\
  \n在这个项目中，我们将使用每个项目中的几个字段：`full_name`、`stargazers_count`、`html_url` 和 `license`。`full_name`\
  \ 字段持有仓库所有者的名称和仓库名称，用斜杠连接：例如 \"facebook/react\"。`stargazers_count` 字段给出用户为仓库点数的次数。`html_url`\
  \ 字段持有仓库在 GitHub 上的 URL。最后，`license` 包含关于仓库使用的软件许可证的数据。\n\n> <samp class=\"SANS_Dogma_OT_Bold_B_21\"\
  >注意</samp>\n\n*开源代码所有使用软件许可证来告诉用户可以做什么和不能做什么。例如，某些许可证非常严格，规定不能用于代码本身开源的应用程序。其他许可证则宽松得多，允许你对代码做任何事情。*\n\
  \n### 基础可视化\n\n现在我们有了数据，将创建一个基础柱状图，显示数据集中的每个仓库收到了多少星。为了实现这一点，我们将创建所需的 SVG 元素、绘制轴，然后绘制条形。稍后我们将改进这个基础图表，使其更具信息量、更美观且具有交互性。\n\
  \n### 创建元素\n\n为了创建图表，我们首先必须创建一个包含它的 `svg` 元素以及两个轴的 `g` 元素。在这种情况下，轴位于底部和左侧。将 Listing\
  \ 15-4 中的代码添加到 `script.js` 的开头，位于 `getUrl` 函数之前。\n\n```javascript\nconst width =\
  \ 600;\nconst height = 400;\n\nlet svg = d3\n  .select(\"body\")\n❶ .append(\"svg\"\
  )\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\n❷ let margin = {top:\
  \ 20, right: 10, bottom: 20, left: 50};\n\n// 底部轴容器\nlet bottomContainer = svg\n\
  ❸ .append(\"g\")\n  .attr(\"id\", \"bottom\")\n  .attr(\"transform\", `translate(0,\
  \ ${height - margin.bottom})`);\n\n// 左侧轴容器\nlet leftContainer = svg\n❹ .append(\"\
  g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left},\
  \ 0)`);\n\nfunction getUrl() {\n--snip--\n}\n```\n\n\n\n\n\n就像我们在第 14 章中为字符频率表做的那样，我们在页面上添加一个\
  \ `svg` 元素 ❶ 并设置其宽度和高度。然后创建一个边距对象 ❷，并将 `g` 元素用于包含底部 ❸ 和左侧 ❹ 轴，我们根据边距对它们进行定位。\n\n\
  ### 绘制坐标轴\n\n创建好元素后，我们就可以开始编写更新函数，该函数将绘制可视化图形。首先，我们将根据数据创建比例尺并绘制坐标轴。按照代码列表 15-5\
  \ 所示对 `script.js` 进行修改。\n\n```javascript\n--snip--\n// Left axis container\nlet\
  \ leftContainer = svg\n  .append(\"g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\"\
  , `translate(${margin.left}, 0)`);\n\nfunction update(items) {\n❶ let xScale = d3.scaleBand()\n\
  \    .domain(items.map(d => d.full_name))\n    .range([margin.left, width - margin.right])\n\
  \    .padding(0.3);\n\n  let yScale = d3.scaleLinear()\n  ❷ .domain([0, d3.max(items,\
  \ d => d.stargazers_count)])\n    .range([height - margin.bottom, margin.top])\n\
  \    .nice();\n\n❸ let bottomAxis = d3.axisBottom(xScale);\n  let leftAxis = d3.axisLeft(yScale);\n\
  \n❹ bottomContainer.call(bottomAxis);\n  leftContainer.call(leftAxis);\n}\n\nfunction\
  \ getUrl() {\n--snip--\n\nd3.json(url).then(data => {\n❺ update(data.items);\n});\n\
  ```\n\n代码列表 15-5: 绘制坐标轴\n\n更新函数接收 API 响应中的 `items` 数组。我们的条形图将为每个仓库创建一个垂直条形，因此我们使用\
  \ `scaleBand` 辅助函数创建水平的 `xScale`，以便均匀地分布条形 ❶。域（domain）是每个仓库的 `full_name`。由于每个仓库的全名都是唯一的，因此这将产生\
  \ 20 个分带。垂直的 `yScale` 用于可视化每个仓库拥有的星标数量，因此它的域从零到最大 `stargazers_count` ❷。我们在这里使用 `nice`\
  \ 将比例尺的顶部舍入到下一个刻度值。在创建比例尺后，我们创建了坐标轴生成器 ❸，然后使用这些生成器将坐标轴绘制到容器 ❹，就像我们在字符频率项目中所做的那样。\n\
  \n这里要做的最后件事是在 `d3.json` 回调内部调用我们的 `update` 函数，传递 `items` 数组 ❺。我们能够直接从获取数据跳转到调用 `update`，因为\
  \ GitHub Search API 方便地返回了渲染所需的数据格式。不需要像在字符频率示例那样对数据进行处理（在那个例子中源数据只是一个字符串，我们需要一个描述每个字符及其计数的排序对象数组）。\n\
  \n当你重新加载 `index.html` 时，现在应该能看到坐标轴，如图 15-1 所示。我们稍后会修复底部轴标签；它们现在一团糟，因为 D3 正在尝试渲染每个仓库的全名。此外，取决于你运行此代码时最流行的\
  \ JavaScript 项目有多少颗星，你的左轴刻度可能会高于图中显示的 200,000。在写本文时，`facebook/react` 拥有 GitHub 上任何\
  \ JavaScript 项目中最多的星，大约 196,000 个。\n\n![](img/Figure_15-1.png)\n\n图 15-1: 坐标轴\n\n\
  鉴于我们在这里处理如此巨大的数字（而且每天都在增大），可以使用 SI 前缀（如用 `k` 表示 1,000）来提高可读性。在 D3 中通过正确的数字格式可以轻松实现。在进行此更改的同时，我们还将移除底部轴的刻度。请参代码列表\
  \ 15-6 查看这些更改。\n\n```javascript\n--snip--\n  let yScale = d3.scaleLinear()\n   \
  \ .domain([0, d3.max(items, d => d.stargazers_count)])\n    .range([height - margin.bottom,\
  \ margin.top])\n    .nice();\n\n  let bottomAxis = d3\n    .axisBottom(xScale)\n\
  \  ❶ .tickValues([]);\n\n  let leftAxis = d3\n    .axisLeft(yScale)\n  ❷ .tickFormat(d3.format(\"\
  ~s\"));\n\n  bottomContainer.call(bottomAxis);\n  leftContainer.call(leftAxis);\n\
  --snip--\n```\n\n代码列表 15-6: 清理比例尺\n\n对于底部轴，我们将刻度值更新为空列表 ❶，这有效地移除了刻度。对于左侧轴，我们使用格式指定化符\
  \ `~s` 添加了刻度格式 ❷，例如，它会将数字 200,000 渲染为 200k，将 1,000,000 渲染为 1M。图 15-2 显示了更新后的坐标轴现在的样子。\n\
  \n![](img/Figure_15-2.png)\n\n图 15-2: 清理后的坐标轴\n\n左轴中的数字现在更容易一眼看了，底部轴不再是文本的杂乱组合。\n\
  \n### 绘制条形\n\n现在坐标轴已经绘制完毕，我们需要绘制条形本身。将代码列表 15-7 中的代码添加到更新函数的末尾。\n\n```javascript\n\
  --snip--\n  bottomContainer.call(bottomAxis);\n  leftContainer.call(leftAxis);\n\
