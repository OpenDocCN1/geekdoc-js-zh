  \ `Math.random()` ❸，它返回一个 0 到 1 之间的随机数，用来决定是否播放音符。如果值小于 0.5，我们就播放一个音符；否则，跳过该音符。音符名称通过在\
  \ `notes` 数组中选取随机索引来确定，使用代码 `Math.floor(Math.random() * notes.length)` ❹。\n\n`Tone.Loop`\
