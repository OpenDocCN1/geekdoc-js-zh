  >列表 10-11: checkPaddleCollision 函数</samp>\n\n该函数将在传入 `ball` 和之前定义的每个挡板对象时调用。它使用一个长布尔表达式，由四个子表达式组成，所有它们都通过\
  \ `&&` 连接在一起，因此只有当四个子表达式都为 `true` 时，它才会返回 `true`。（我为每个子表达式添加了空格，以便操作数垂直对齐；这只是为了让代码更容易读。）在英语中，这些子表达式的意思是：\n\
  \n1. `ball` 的 `left` 边缘必须在挡板 `right` 边缘的左侧。\n2. `ball` 的 `right` 边缘必须在挡板 `left`\
