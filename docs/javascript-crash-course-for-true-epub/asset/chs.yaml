  SANS_Futura_Std_Book_Oblique_I_11\">图 15-4：显示某个仓库详情的侧边栏</samp>\n\n对于你悬停的每个条形，该仓库的详情都应该出现在新的侧边栏中。如果你点击仓库名称，浏览器应该打开新标签页并带你进入仓库的\
  \ GitHub 。\n\n### 条形的颜色编码\n\n为了在视觉上传递额外信息，我们将根据许可证类型对条形进行颜色编码。D3 允许你创建标尺，其输入（域）是值，输出（范围）是颜色。你将在列表\
  \ 15-13 中看到如何实现这一点。\n\n```javascript\n--snip--\nfunction update(items) {\n❶ let\
  \ licenses = new Set(items.map(d => getLicense(d)));\n\n❷ let colorScale = d3.scaleOrdinal()\n\
  \    .domain(licenses)\n    .range(d3.schemeCategory10);\n\n  let xScale = d3.scaleBand()\n\
  --snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 15-13：为许可证创建颜色标尺</samp>\n\
  \n首先，我们需要收集所有唯一的许可证名称。为了做到这一点，我们对 `items` 进行 `map` 操作，并为每一项调用我们的 `getLicense` 函数❶。这产生了一个许可证名称数组。在同一行中，我们将结果数组传递给\
  \ `Set` 构造函数。在编程术语中，`set` 是唯一项目的集合，因此 `Set` 构造函数可以接收项数组并过滤掉任何重复项。在 JavaScript 中，集合会像数组一样维护顺序。\n\
  \n`d3.scaleOrdinal` 辅助函数❷ 创建了一个具有离散输入和离散输出的标尺。在这里，输入是唯一的许可证名称，输出是颜色名称。对于标尺的范围，我们使用了\
  \ `d3.schemeCategory10`，这是一个包含 10 个十六进制颜色字符串的数组。你可以在控制台中查看它：\n\n```javascript\n\
  d3.schemeCategory10;\n(10) ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',\
  \ '#8c564b', \n '#e377c2', '#7f7f7f', '#bcbd22', '#17becf']\n```\n\n集合中的每个许可证将根据索引映射到这些颜色中的一种。如果许可证超过\
  \ 10 个，颜色将循环回到开头（第 11 和第 12 个许可证将使用与第一个和第二个相同的颜色）。\n\n接下来，我们必须根据许可证和颜色标尺设置条形的颜色。列表\
  \ 15-14 显示了如何在 `update` 函数的末尾进行该更改。\n\n```javascript\n--snip--\n  svg\n    .selectAll(\"\
  rect\")\n    .data(items, d => d.full_name)\n    .join(\"rect\")\n    .attr(\"x\"\
  , d => xScale(d.full_name))\n    .attr(\"y\", d => yScale(d.stargazers_count))\n\
  \    .attr(\"fill\", d => colorScale(getLicense(d)))\n    .attr(\"width\", xScale.bandwidth())\n\
  \    .attr(\"height\", d => yScale(0) - yScale(d.stargazers_count))\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 15-14：设置 rect 的填充颜色</samp>\n\
  \n在将许可证名称传递给 `colorScale` 之前，我们必须在 `d` 上调用 `getLicense` 函数来获取许可证名称（因为可能是 \"No License\"\
  ）。这为我们设置 `rect` 的 `fill` 属性提供了颜色值。\n\n通过这种颜色编码，你确实需要一个图例让用户知道每个颜色的含义。我们将该图例作为侧边栏中的另一个框，位于仓库信息框下方。它将包含与相应许可证名称并排颜色块。首先，我们需要更多的\
  \ HTML。使用列表 15-15 中的更改更新 `index.html`。\n\n```html\n--snip--\n        <p class=\"\
  stars\">\n          <span class=\"label\">Stars</span>\n          <span class=\"\
  value\"></span>\n        </p>\n      </div>\n\n      <div id=\"key\" class=\"box\"\
  >\n        <h1>Key</h1>\n      </div>\n    </div>\n--snip--\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 15-15：为许可证图例添加 div 和标题</samp>\n\n在这里我们在侧边栏\
  \ `div` 内部创建了名为 `key` 的另一个 `div` 并给它一个 `h1`。我们将使用 JavaScript 创建 `key` 的其他元素。\n\n\
  接下来是用于设置这些新元素以及我们将用 JavaScript 添加的子元素的 CSS。将列表 15-16 中的代码添加到 `style.css` 的末尾。\n\n\
  ```css\n--snip--\n#info a:hover {\n  text-decoration: underline;\n}\n\n#key h1 {\n\
