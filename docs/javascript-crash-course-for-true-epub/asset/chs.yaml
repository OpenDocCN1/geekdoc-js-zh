  \ 总结\n\n在最后一个项目中，你使用来自 GitHub 的数据了一个交互式图表。然而，我们只接触了该库提供的极小部分功能；它还有许多类型，如数据绑定、比例尺（scales）和过渡动画（transitions）。网站\
  \ https://d3js.org 是一个极佳的起点。\n\n# 结记\n\n你已经学习了语言的核心内容，完成了三个项目，现在你可能不知道该怎么办。好消息（或者坏消息，取决于你的观点）是，学习无止境。以下是一些关于后续步骤和工具的建议。\n\
  \n### 项目\n\n现在你应该对如何设置新项目有了相当好的理解，那么为什么不尝试构建新东西呢？一个选择是制作自己的游戏。一些简单的街机游戏包括《乒乓》（Pong）、《太空入侵者》（Space\
  \ Invaders）、《俄罗斯方》（Tetris）和《炸砖》（Breakout）。或者你可以尝试完全不同的，制作一个文字游戏，如 Wordle 或猜字游戏（Hangman）。\n\
  \n你还可以尝试在书中学到的知识的基础上创作你自己的音乐作品。在音乐方面，你可能想尝试制作一个鼓机，或者一个无限音乐生成器。你还可以利用所学知识为你的一个游戏添加音效。在数据可视化方面，还有无数其他\
  \ API 可以你尝试用于获取其他服务的数据。正如第 15 章所述，许多 API 需要某种形式的身份验证，这在浏览器端应用程序中是不可行的；但通过 Node.js，你也可以尝试构建你自己的应用程序。\n\
  \n### Node.js\n\n本书仅解释了如何编写在浏览器中运行的 JavaScript，但通过 Node.js，你也可以在后端 Web 服务器上运行 JavaScript。访问\
  \ https://nodejs.dev/en/learn/ 可以获取学习 Node.js 的绝佳指南。一旦你的应用有了了后端，你就可以开始做更有趣的事情，例如代表用户存储数据、使用密钥访问经过身份验证的第三方\
  \ HTTP API 等等等。\n\n\n\n\n\n有很多种类型的工具可以在你继续编程之旅的过程中为你提供帮助。本节介绍了其中一些工具，但绝非涵盖所有内容。\n\
  \n### Git\n\nGit 是一个流行的版本控制系统，允许你跟踪代码的更改并返回到早期的版本。当我刚开始编程时，我经常发现自己修改了代码却弄坏了某些功能，然后又不知道是从哪里弄坏的，也无法恢复之前的状态。为了避免这种情况，我开始对代码进行备份，以便返回到早期的版本。Git\
  \ 是实现这一目标的一种更好方法。通过 Git，你可以创建 `commits` 来存储代码在特定时间点的状态。每个提交都构建在之前的提交之上，同时跟踪了发生变化的内容。\n\
  \n网上有很多用于学习 Git 的在线资源。你可以在 `https://git-scm.com/doc` 找到其中许多资源。\n\n### GitHub\n\n\
  一旦在计算机上安装了 Git，使用 GitHub（这是我们在第 15 章中获取数据的服务）将是一个极佳的下一步。GitHub 提供了一种上传和共享本地 Git\
  \ 仓库的方法，以便在可以在任何地方访问它们。\n\nGitHub 还让你能够访问数百万个开源仓库，你可以对其进行 `fork`（创建自己的副本）并随心所欲地修改。例如，要查看我所有的公共仓库，请访问\
  \ `https://github.com/skilldrick`。\n\n### CodePen\n\n要他人分享你的项目，你需要一种让它们通过网页访问的方法。你可以建立自己的\
  \ Web 托管，但一个简单得选项是使用 CodePen (`https://codepen.io`)。这也是用于托管本书配套资源的工具，地址为 `https://codepen.io/collection/ZMjYLO`。\n\
  \n通过 CodePen，你可以创建并共享使用 HTML、`CSS` 和 `JavaScript` 构建的项目。代码在页面上的独立面板中完全可见。例如，图 A-1\
  \ 显示我制作的一个示例 Pen，每当你点击文本时，它都会额外添加一个感叹号。你可以在在线访问 `https://codepen.io/skilldrick/pen/abKaQpo`\
  \ 查看该 Pen。\n\n![](img/Figure_A-1.png)\n\n图 A-1：CodePen 上的示例 Pen\n\n在 `HTML` 面板中，只需要\
  \ `body` 元素的内容。CodePen 会自动提供其余 `HTML` 结构。你也可以通过设置对话框轻松地引入外部 `JavaScript` 库。\n\n\
  ### Glitch\n\n像 CodePen 一样，Glitch 是一个为你托管代码并让你与世界共享的服务。Glitch 的独特之处在于它运行前端和后端代码的能力。它不仅仅为\
  \ `HTML`、`CSS` 和 `JavaScript` 提供面板，还允许你定义一个包含所有所需文件的完整目录结构。你甚至可以添加 `SQLite` 数据库来存储数据。访问\
  \ `https://glitch.com` 了解更多，或查看 `https://glitch.new` 从启动应用程序列表中进行选择。\n\n## Web 开发\n\
  \n虽然本书的重点是 `JavaScript`，但在此过程中你也学习了一些通用的 Web 开发技能。如果这激发了你的兴趣，你可能想花更多时间学习 Web 开发的其他方面。\n\
  \n### HTML 和 CSS\n\n`HTML` 是绝大多数网页编写的语言，因此对其细节有更深入的理解是有价值的。要了解更多信息，请查看 `https://developer.mozilla.org/HTML`\
  \ 上的 MDN 文档。`CSS` 用于网页样式化，如果你想让页面看起来好看，那么理解它的工作原理至关重要。在 `https://developer.mozilla.org/CSS`\
  \ 上的 MDN 上学习更多。\n\n### JavaScript 框架和库\n\n今天的 Web 开发非常复杂，Web 应用通常包含数以千行的 `HTML`、`CSS`\
  \ 和 `JavaScript`。为了大幅减少编写一个功能完整的现代 Web 应用所需的代码量，许多开发者使用 `JavaScript` 框架和库。在本书编写期间，最流行的两个工具是\
  \ `React` 和 `Vue.js`。了解这些工具并非必须，但它们可以极大地简化构建复杂网站和前端应用程序的过程。你可以在 CodePen 中尝试 `React`\
  \ 和 `Vue.js`，或者查看它们的网站：\n\n- React: `https://reactjs.org`\n- Vue.js: `https://vuejs.org`\n\
  - CodePen 上的 React: `https://codepen.io/topic/react/templates`\n- CodePen 上的 Vue.js:\
  \ `https://codepen.io/topic/vue/templates`\n\n## 测试\n\n对于程序员来说，一个必备工具是自动化测试框架。自动化测试设计为定期在你的代码上，以确认它符合你的预期。编写代码时的一个常见问题是在添加新功能时，没有意识到该更改弄坏了程序的某些部分。通过编写良好的测试并定期运行它们，你可以识别出东西坏掉的时刻并修复它。你还可以放心地对代码进行大规模重构，因为你知道只要测试通过，就不太可能弄坏了任何东西。\n\
  \n`JavaScript` 有大量的测试库和框架。在本书编写期间，最流行的之一是 `Jest`：可以在 `https://jestjs.io` 查看它。\n\n\
  ## 更多 JavaScript！\n\n如果你想加深对 `JavaScript` 的知识，有很多资源可供你使用。以下是一些关于入门的建议：\n\n- MDN\
  \ `JavaScript` 门户：`https://developer.mozilla.org/JavaScript`\n- *Eloquent JavaScript*,\
  \ 第 3 版，Marijn Haverbeke 著（No Starch Press, 2018）\n- *JavaScript: The Definitive\
  \ Guide*, 第 7 版，David Flanagan 著（O’Reilly Media, 2020）\n\n## 其他语言\n\n你现在可能决定拓宽你的编程知识，而不是深入研究\
  \ `JavaScript`。去尝试吧！你学习的每种语言都能让你对通用编程提供宝贵的见解，所以这实际上是提高 `JavaScript` 能力的一种极方法。\n\n\
  ### TypeScript\n\n人们对 `JavaScript` 产生的问题之一是它的弱类型、动态类型，这允许值根据周围的代码隐式转换为不同的数据类型。例如，如果另一个操作数是字符串，`+`\
  \ 运算符会将数字操作数转换为字符串；而如果另一个操作数是数字，`-` 运算符会将字符串操作数转换为数字。\n\n\n\n\nTypeScript 语言正尝试为\
  \ JavaScript 添加静态类型。`Static typing` 意味着某个特定类型的变量只能包含该类型的值，且类型之间的转换必须是显式的。TypeScript\
  \ 在语法上是 JavaScript 的超集，这意味着一个有效的 JavaScript 程序也是一个有效的 TypeScript 程序。可以使用 TypeScript\
  \ 编译器将 TypeScript 代码转换为 JavaScript。\n\n使用静态类型使得编写出带有某些特定 bug 的代码变得不再可能。例如，在 JavaScript\
  \ 中，你可能会从文本框中获取一个值，假设它是一个数字，并将其与另一个数字相加。遗憾的是，文本框中的任何值都被视为字符串，因此另一个数字也会被隐式地转换为字符串，你最终将得到两个字符串的拼接结果。TypeScript\
  \ 不允许这样做。它知道来自文本框的值是字符串，并强迫你决定是想将两个操作数都转换为字符串进行拼接，还是将两个操作数都转换为数字进行相加。\n\nTypeScript\
  \ 的缺点是，有时编写本认为应该可以运行的代码会变得困难。这有时被称为`与编译器斗争`（`fighting the compiler`）。\n\n如果你想了解更多信息，这里有一些书籍和其他资源可以帮助你开始学习\
  \ TypeScript：\n\n*   TypeScript 手册：[`www.typescriptlang.org/docs/handbook/intro.html`](https://www.typescriptlang.org/docs/handbook/intro.html)\n\
  *   `Effective TypeScript`，Dan Vanderkam 著（O’Reilly Media, 2019）\n*   `Learning\
  \ TypeScript`，Josh Goldberg 著（O’Reilly Media, 2022）\n\n## Python\n\nPython 是一种脚本语言，与\
  \ JavaScript 类似，但它有不同的哲学。该语言采用了“电池内置”的方法，这意味着它的标准库功能完备，包含了广泛的功能（相比之下，JavaScript\
  \ 的标准库非常有限）。与 JavaScript 类似，Python 是动态类型的，因此同一个变量可以持有不同数据类型的值。但 JavaScript 是弱类型，而\
  \ Python 是`strongly typed`（强类型），这意味着没有隐式转换。在语法上，Python 看起来非常不同，它使用缩进（这是强制的而不是可选的）而不是括号来定义嵌套的代码块。\n\
  \nPython 是 Web 服务器以及科学和数值编程的流行语言。如果你想扩展自己的技能，它是一个很好的选择。接下来的这本书（与 `JavaScript Crash\
  \ Course` 同一系列）是该语言的极佳介绍，它的项目突出了 Python 发挥优势的一些领域：\n\n*   `Python Crash Course`，第\
  \ 3 版，Eric Matthes 著（No Starch Press, 2023）\n\n## Rust\n\n我今天最感到兴奋的语言之一是 Rust。和\
  \ TypeScript 一样，它是一种静态类型语言，但它的类型系统比目前使用的大多数语言都要强大。Rust 旨在取代旧的语言 `C` 和 `C++` 来开发高性能代码。\n\
  \n`C` 和 `C++` 都是没有`garbage collection`（垃圾回收）的语言，即告诉哪些值和对象不再被使用以释放内存的过程。相反，`C/C++`\
  \ 程序员必须手动释放不再使用的数据——这个过程很容易出错并经常会导致 bug。这些语言通常用于对性能敏感的环境，由于它们不使用垃圾回收是因为垃圾回收会降低软件性能。Rust\
  \ 通过编译时的 `borrow checker`（借用检查器）避免这个问题，它会跟踪在任何时刻哪些对象正在使用，以及被程序的哪些部分使用。\n\nRust 还被用作编译为\
  \ WebAssembly 的源语言，这是一个在浏览器中运行极其高效高性能代码的兴奋的新技术。以下是一些学习更多信息的资源：\n\n*   `The Rust\
  \ Programming Language`，第 2 版，Steve Klabnik 和 Carol Nichols 著（No Starch Press, 2023）\n\
  *   Rust and WebAssembly：[`rustwasm.github.io/docs/book/`](https://rustwasm.github.io/docs/book/)\n\
