  rect\")\n    .attr(\"x\", d => xScale(d.full_name))\n  ❷ .attr(\"y\", d => yScale(d.stargazers_count))\n\
  \    .attr(\"width\", xScale.bandwidth())\n  ❸ .attr(\"height\", d => yScale(0)\
  \ - yScale(d.stargazers_count));\n}\n\nfunction getUrl() {\n--snip--\n```\n\n代码列表\
  \ 15-7: 绘制条形\n\n与字符频率项目一样，我们 正在绘制一组 `rect` 元素。关键函数 ❶ 提取了 `full_name` 属性，我们在这里将其作为每个仓库的唯一标识符。目前，我们使用简单的\
  \ `join` 技术，没有对进入、更新和退出元素进行单独处理（那将在稍后进行）。\n\n`x` 属性根据在 `xScale` 中查找 `full_name`\
  \ 来设置，宽度则根据 `xScale` 的 `bandwidth` 方法。这次 `y` 和 `height` 属性要复杂一些，需要一些解释。如果你回看代码列表\
  \ 15-5 中 `yScale` 的定义，你会发现域是 `[0, d3.max(items, d => d.stargazers_count)]`，范围是 `[height\
  \ - margin.bottom, margin.top]`。根据我们设置的值，该范围扩大到 `[380, 20]`。范围从高到低，这意味着域中的高值映射到范围中的低值，反之亦然。这是因为计算机图形中的\
  \ y 值是从屏幕顶部向下计数的，但在我们的图表中，我们希望 y 值向上计数。\n\n\n\n\n\n## 改进可视化效果\n\n我们现在已经运行了一个基础的可视化，但它提供的信息并不多。在本节中，我们将实现一些改进来使可视化更有意义。我们将一种方法来查看有关每个仓库的更多信息。我们还将对条形进行颜色编码，以显示每个仓库的许可证类型，并确保轴标签标记正确。\n\
  \n### 显示仓库信息\n\n目前的图表没有提供任何识别每个条形代表哪个仓库的方法。解决这个问题有多种方法（例如，垂直或倾斜方向的刻度标签，或者某种类型的 `tooltip`，即悬停在条形上时弹出的文本字段），但对于本项目，我们将添加一个永久的侧边栏，当你悬停在条形上时它会显示该条形的更多信息。首先，我们将在\
  \ `index.html` 中添加侧边栏的 HTML，如列表 15-8 所示。\n\n```\n--snip--\n  <body><body>\n    <div\
  \ id=\"sidebar\">\n      <div id=\"info\" class=\"box\">\n        <p class=\"repo\"\
  >\n          <span class=\"label\">Repository（仓库）</span>\n        ❶ <span class=\"\
  value\"><a target=\"_blank\"></a></span></span>\n        </p>\n        <p class=\"\
  license\">\n          <span class=\"label\">License（许可证）</span>\n          <span\
  \ class=\"value\"></span>\n        </p>\n        <p class=\"stars\">\n         \
  \ <span class=\"label\">Stars（星数）</span>\n          <span class=\"value\"></span>\n\
  \        </p>\n      </div>\n    </div>\n\n    <script src=\"https://unpkg.com/d3@7.4.4/dist/d3.js\"\
  ></script>\n    <script src=\"script.js\"></script>\n  </body></body>\n--snip--\n\
  ```\n\n### 列表 15-8：向 index.html 添加侧边栏 HTML\n\n在这里我们设置了一个名为 `info` 的 `div`，包含了显示仓库信息所需的元素。它嵌套在另一个名为\
  \ `sidebar` 的 `div` 内部。这个外部 `div` 现在看起来是多余的，但稍后我们将向侧边栏添加另一个 `div` 元素，因此我们需要父 `div`\
  \ 元素来包含这两个侧边栏 `div` 元素。\n\n`info` `div` 将显示仓库名称、许可证类型和星数。我们使用 `span` 元素来包裹文本的部分。`span`\
  \ 是一个像 `div` 一样的容器元素，但与创建新块的 `div` 元素不同，`span` 是一个内联元素，因此它可以包含行文本的一部分而不产生新行。稍后，当你在悬停在条形上时，我们将更新\
  \ `value` spans 的内容，以显示与该条形相关的信息。\n\n其中一个 `span` 元素包含一个 `a` 元素 ❶，它创建指向另一个页面或网站的超链接。链接的\
  \ URL 通过 `href` 属性指定，我们将稍后动态地设置它。`target=\"_blank\"` 属性指示浏览器在新标签页或窗口中打开链接。\n\n侧边栏在现阶段看起来有点丑，所以让我们添加一些\
  \ CSS。将列表 15-9 中的代码添加到 `style.css` 中。\n\n```\nbody {\n❶ display: flex;\n  align-items:\
  \ flex-start;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\n.box {\n  padding:\
  \ 0px 15px 0px 15px;\n  border: 1px solid #888;\n  margin-bottom: 15px;\n}\n\n#info\
  \ .label {\n  font-weight: bold;\n  display: block;\n}\n\n#info a {\n  text-decoration:\
  \ none;\n}\n\n#info a:hover {\n  text-decoration: underline;\n}\n```\n\n### 列表 15-9：侧边栏样式设置\n\
  \n对于本项目，我们使用一种名为 `flexbox` ❶ 的 CSS 技术，这是 CSS 规范中较新的添加。Flexbox 使定义布局变得容易得多，特别是那些可以在各种屏幕和视口大小上灵活工作的布局。Flexbox\
  \ 布局有两个主要组件：`flex container`（弹性容器）和 `flex items`（弹性项目）。`flex container` 是父元素，定义了它的子弹性项目（容器的直接子元素的大小以及它们的流向方式。在我们的情况下，`flex\
  \ container` 是 `body` 元素，而 `flex items` 是 `svg` 元素和 `#sidebar` 元素。默认情况下，项目从左到右排列（这意味着\
  \ `#sidebar` 元素将出现在屏幕左侧，其右侧是 `svg` 元素）。声明 `align-items: flex-start;` 表示项目将对齐到父容器的顶部。\n\
  \n> **注意**\n\n> 如果你想学习更多关于 flexbox 的知识，请查看 [`css-tricks.com/snippets/css/a-guide-to-flexbox/`](https://css-tricks.com/snippets/css/a-guide-to-flexbox/)。\n\
  \n目前 `svg` 元素被追加到 body 元素，这意味着它位于侧边栏之后，由于布局原因，我们希望它在之前。为了实现这一点，我们在创建 `svg` 元素时需要从\
  \ `append` 方法切换到 `insert` 方法，因为后者允许我们指定插入到某个元素之前。`script.js` 的相应更改如列表 15-10 所示。\n\
  \n```\n--snip--\nlet svg = d3\n  .select(\"body\")\n  .insert(\"svg\", \"#sidebar\"\
  )\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n--snip--\n```\n\n###\
  \ 列表 15-10：在侧边栏之前插入 svg 元素\n\n现在侧边栏将出现在图表的右侧，因为 `svg` 元素现在在 `flex container` 中出现在侧边栏之前。\n\
  \n在我们编写在侧边栏显示仓库详情的代码之前，我们需要一个函数来获取仓库的许可证。访问其他信息将非常简单，但并不是所有仓库都有许可证，因此我们的函数必须处理没有可用数据的情况。在\
  \ `script.js` 中 `update` 函数之前插入以下代码。\n\n```\n--snip--\n// 左轴\nlet leftContainer\
  \ = svg\n  .append(\"g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left},\
  \ 0)`);\n\nfunction getLicense(d) {\n❶ let license = d.license?.name;\n\n❷ if (!license)\
  \ {\n    return \"No License\";\n  } else {\n    return license;\n  }\n}\n\nfunction\
  \ update(items) {\n--snip--\n```\n\n### 列表 15-11：getLicense 函数\n\n如果仓库有许可证，则许可证名称将作为\
  \ `d.license.name` 可，但如果它没有许可证，`d.license` 将是 `undefined`。我们使用 `?.` 运算符测试这种情况，该运算符被称为\
  \ `可选链运算符` ❶。与普通的 `.` 运算符一样，`?.` 尝试获取运算符左侧指定的对象并访问运算符右侧指定的方法或属性。然而，与普通的 `.` 运算符不同，如果左侧的对象为\
  \ `null` 或 `undefined`，`?.` 将返回 `undefined`。因此，如果 `d.license` 是 `undefined`（意味着仓库没有许可证），我们的\
  \ `license` 变量将被设置为 `undefined`，但如果 `d.license` 是一个对象（意味着仓库有许可证），那么 `license` 将设置为\
  \ `d.license.name`。如果 `license` 最终为 `undefined` ❷，我们的 `getLicense` 函数将返回字符串 \"No\
  \ License\"。否则，返回 `license` 的值。\n\n现在我们可以添加在悬停在条形上时更新侧边栏的代码。我们将通过向 `rect` 元素添加 `mouseover`\
  \ 事件处理程序来实现。使用列表 15-12 中的代码更新 `script.js`。这段代码位于 `update` 函数的末尾。\n\n```\n--snip--\n\
  \    .attr(\"width\", xScale.bandwidth())\n    .attr(\"height\", d => yScale(0)\
  \ - yScale(d.stargazers_count))\n    .on(\"mouseover\", (e, d) => {\n      let info\
  \ = d3.select(\"#info\");\n      info.select(\".repo .value a\").text(d.full_name).attr(\"\
  href\", d.html_url); 1\n      info.select(\".license .value\").text(getLicense(d));\n\
  \      info.select(\".stars .value\").text(d.stargazers_count);\n    });\n}\n\n\
  function getUrl() {\n--snip--\n```\n\n\n\n\n\n# 列表 15-12: 悬停时更新侧边栏\n\nD3 事件处理器在调用时带有两个参数：事件对象（`e`）和绑定到触发事件元素上的数据（`d`）。我们在处理器中执行的第一件事是选择\
  \ `#info` 元素，因为我们想要修改的所有元素都是该元素的子元素。然后，我们更新 `.repo` 元素内部 `.value` 元素内部的 `a` 元素❶（参考列表\
