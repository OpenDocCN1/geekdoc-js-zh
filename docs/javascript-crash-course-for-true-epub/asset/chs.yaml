  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 15-17：生成图例</samp>\n\n\
  \n\n\n在这里，我们使用 `#key` 元素作为新加入项的容器，并加入了一系列 `p` 元素以绑定到每个许可数据（datum）。我们使用了高级的 join\
  \ 技巧，但仅带了一个 `enter` 函数；我们不需要为更新或退出项定义自定义行为。（在这里我们不能使用常规的 join 技术，因为那样每当调用 `update`\
