  \ 列表 15-20 中看到的，我们在复选框的更改事件处理器中调用了 `update`。\n\n### 动画效果\n\n为了锦上添花，让我们添加一些动画。这将更容易在许可证显示或隐藏时看到条形的变化，并且让可视化看起来更酷炫。我们将对图表的两个部分制作动画：左轴和条形。要做到这一点，请按照\
