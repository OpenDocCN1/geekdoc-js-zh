- "# JavaScript 入门指南\n\n\n\n![](img/9781718502277.jpg)\n\n\n# 《JavaScript 快速入门》好评\n\
  \n“《JavaScript 快速入门》为那些只想卷起袖子从零开始学习基础知识的人们提供了一份完美且务实的指南。它跳过了许多让掌握 Web 编程变得复杂的干扰，如\
  \ UI 框架、构建工具和服务器技术，通过真实项目为渴望成为 Web 工程师奠定坚实的基础。”\n\n—JED SCHMIDT，BROOKLYNJS 创始人\n\
  \n“《JavaScript 快速入门》是一次有趣、实用且注重手操作的介绍，我希望我自己在学习 JavaScript 时能有这本书。读者可以从最基础开始学习，一直制作出与‘现实世界’开发实践相关的真实游戏和应用程序。”\n\
  \n—CASSIDY WILLIAMS (@CASSIDOO)，CONTENDA 顾问兼首席技术官\n\n“《JavaScript 快速入门》提供了关于如何思考和使用\
  \ JavaScript 的实用、务实且基于项目的教育。Nick Morgan 有丰富的经验，通过相互相接的示例向你介绍这门语言，并迅速进入真实项目的创建。当你深入阅读这本书时，你会发现你的构建模块就是互联网本身。你会发现自己正在使用音频和声音生成技术、使用\
  \ Canvas API 绘画以及引入第三方 JavaScript 库。当你完成这门快速课程时，你已经准备好开始自己的项目了。Nick 通过他的实战教学提供了一项极佳的服务，无论是在本书中还是在《儿童\
  \ JavaScript》中都是如此。我希望你像我一样喜欢这本书。”\n\n—SCOTT HANSELMAN (@SHANSELMAN)，微软开发者社区副总裁\n\
  \n“Nick 成功地将 JavaScript 的基础概念浓缩成简洁、易懂的描述，让初学者也能上手。再加入一些关于图形和声音的趣味课程来创建一个游戏，你就得到了一本非常优秀且引人入胜的\
  \ JavaScript 书，非常值得花时间。”\n\n—NICHOLAS C. ZAKAS (@SLICKNET)，ESLint 创建者及资深 JavaScript\
  \ 书籍作者\n\n献给 Lyra 和 Hazel\n\n# 关于作者\n\nNick Morgan 是《儿童 JavaScript》（JavaScript for\
  \ Kids, No Starch Press, 2014）的作者。他是 Airbnb 的软件工程师，负责维护网站运行的一些核心服务。在此之前，他曾在 Twitter\
  \ 工作，从 Web 团队开始，编写 JavaScript 帮助构建主网站，随后转到后端的 Tweets 服务，在那里他帮助设计了“编辑推文”功能。Nick 在英国长大，拥有萨雷郡大学的音乐和音响录制学位。他住在科罗拉州，与妻子、两个女儿和三只猫住在一起。\n\
  \n# 关于评论员\n\nAngus Croll 出于英国，现住在旧金山湾区，目前在 Netflix 负责所有性能相关的工作。作为文学小说和 JavaScript\
  \ 的双重爱好者，他是《如果海明威写过 JavaScript》（If Hemingway Wrote JavaScript, No Starch Press,\
  \ 2014）以及歌曲 Just 的创作者。\n\n# 致谢\n\n首先，感谢我的妻子 Philly 和我们的孩子们 Lyra 和 Hazel，让这一切变得值得。很抱歉我有这么多晚上都被写作占据了，我承诺至少一年内不会再写另一本书了！\n\
  \n感谢 Bill Pollock 信任我写第二本书；感谢我的编辑 Nathan Heidelberger 在塑造我的文本方面所付出的卓越工作（并忍受了我的延误！）；感谢\
  \ No Starch 的其他所有人，你们让这本书变成了现实。\n\n感谢我的朋友和技术评论员 Angus Croll 的一切。Angus 向我推荐了 Twitter，后来又向我推荐了\
  \ Bill Pollock——如果没有他，我不会在这里写这些。\n\n最后，感谢我的父母给了我好奇心和乐观态度，这最终促使我写了这本书。\n\n# 引言\n\n\
  ![](img/opener.png)\n\n我清晰地记得第一次“写” JavaScript 的情景。当时我正在玩弄网页设计，从另一个网站复制并粘贴了一些代码，以便在鼠标悬停在页面某些部分时添加一些效果。我完全不知道这些代码在做什么，但通过不断尝试，我成功地让它运行了。\n\
  \nJavaScript 是一门非常宽容的语言——有时宽容得过头——这对我和其他许多人来说，它是一个非常温和的编程入门。许多人选择 JavaScript 作为第一门编程语言是因为它太容易上手了：它就在你的浏览器中等着你！\n\
  \n## 这本书适合谁看？\n\n本书的目标是让你尽可能快地编写真实的 JavaScript 代码，教授所有要点，而不陷入语言的复杂细节中。我不指望你有任何先前的编程经验。如果你习惯于使用计算机完成浏览和编辑文档等日常任务，你就拥有了入门所需的一切。\n\
  \n\n\n\n\n`JavaScript Crash Course` 是为所有年龄段的人士编写的，旨在让他们通过实战示例和项目独立学习 JavaScript。你可能想转行计算机编程领域，或者想将编码作为一种爱好。也许你已经使用过其他编程语言，现在需要快速上手\
  \ JavaScript。如果你是一名老师，正在寻找一种简单的方法向学生介绍编程，那么 `JavaScript Crash Course` 对你来说也是一个很好的选择。\n\
  \n# 为什么选择 JavaScript？\n\n有数百种编程语言可以选择，但有几点让 JavaScript 特别于众。最重要的是它与网页浏览器（如 Google\
  \ Chrome、Safari、Microsoft Edge 和 Firefox）的关系。几乎每个网页浏览器都能运行 JavaScript，这意味着你用 JavaScript\
  \ 编写的代码可以在任何带有网页浏览器的计算机上运行。无需安装任何额外的特殊软件。几乎所有的智能手机浏览器也可以运行 JavaScript，所以你现在口袋或包里可能就有一个支持\
  \ JavaScript 的浏览器。\n\n由于其与网页浏览的关系，JavaScript 是 Web 开发中至关重要的一部分。如果一个网站包含动态、交互式的功能，它很可能是用\
  \ JavaScript 创建的。例如，YouTube 使用 JavaScript 在你悬停在缩略图上时显示视频预览；Threads 使用 JavaScript\
  \ 在你向下滚动页面时加载更多帖子；Amazon 使用 JavaScript 驱动其“内部查看”（Look Inside）功能。\n\n除了在浏览器中的用途外，JavaScript\
  \ 还被广泛用于网站的后端，即运行在服务器上的网站代码部分，向用户传递内容（与直接运行在用户设备上的前端代码相反）。这是通过名为 `Node.js` 的技术实现的。许多顶级网站都有\
  \ `Node.js` 后端，让你可以在网站的前端和后端使用同一种语言，甚至在两者之间共享代码。\n\n最后，JavaScript 已经成为各种应用程序非常流行的脚本语言，从\
  \ Photoshop（你可以在其中自动化图像处理）到 Gmail（你可以在其中添加自动化来组织邮件）。通过一些 JavaScript 知识，你就可以让这些应用程序随心所欲！\n\
  \n虽然这种语言在所有这些领域都很有用，但本书将完全关注基于浏览器的 JavaScript。这有几个原因。首先，正如我已经提到的，在浏览器中运行 JavaScript\
  \ 的巨大优势之一是不需要安装任何特殊物品即可开始。我不希望在书的开头写一个关于在计算机上安装 `Node.js` 的枯燥章节——这个章节在写完后可能就过时了。其次，虽然几乎所有的网站都使用\
  \ JavaScript 进行前端开发，但 JavaScript 只是编写后端代码的许多语言之一。浏览器是目前为止学习 JavaScript 最通用的环境。\n\
  \n我仍然强烈建议你在读完这本书并对该语言获得一些经验后去尝试 `Node.js` 以及 JavaScript 的其他用途。你应该将这本书看作一个跳板：是你 JavaScript\
  \ 教育的起点，而不是终点。关于读完书后后续步骤的更多信息，请参阅后记。\n\n# 你可以期待学习什么？\n\n本书将教你基于浏览器的 JavaScript。除了学习\
  \ JavaScript 语言本身外，你还将学习在任何编程语言中都有帮助的技能，例如如何思考问题以及如何构建程序。你将建立起一套编程知识基础，这些基础将贯穿你的整个职业和个人编码活动。\n\
  \n本书的`第一部分` 概述了语言的基础。我对语言概念和特征的顺序安排非常有目的，确保每个新概念都建立在之前的概念之上，并且绝不引入任何没有坚实基础的内容。以下是你在书中这一部分发现的内容：\n\
  \n- `第 1 章：入门`：向你展示如何在网页浏览器和文本编辑器中编写第一行 JavaScript 代码。\n- `第 2 章：基础`：介绍 JavaScript\
  \ 程序的要素元素，如表达式、语句和变量，并解释如何使用简单数据类型表示数字、文本和真/假值。\n- `第 3 章：复合数据类型`：讨论数组和对象，它们让你将多个数据项组合成更有意义的集合。\n\
  - `第 4 章：条件判断和循环`：教你使用控制结构为程序添加逻辑，这些结构可以做出决策并重复代码段。\n- `第 5 章：函数`：向你展示如何用函数创建可重用的代码块。\n\
  - `第 6 章：类`：帮助你通过类和面向对象的编程原则为代码添加更多结构。\n\n本书的`第二部分` 讨论了如何使用 JavaScript 与网页浏览器交互。这一部分探索了创建交互式\
  \ Web 应用的重要技术：\n\n- `第 7 章：HTML、DOM 和 CSS`：解释如何使用超文本标记语言 (HTML) 编写网页，并使用文档对象模型 (DOM)\
  \ 通过 JavaScript 修改其内容。你还将学习如何使用层叠样式表 (CSS) 为网页应用基础样式。\n- `第 8 章：基于事件的编程`：展示如何响应鼠标点击和按键等用户行为触发\
  \ JavaScript 代码。\n- `第 9 章：Canvas 元素`：教你如何使用 `Canvas API` 在浏览器中绘制图形和动画。\n\n本书的`第三部分`让你通过一系列项目将你在`第一部分`和`第二部分`中学到的技能付实践。项目之间没有依赖，因此你可以按任何顺序处理它们，或者只研究你觉得感兴趣的项目。我建议完成所有项目，因为它们都介绍了一些非常有用的通用概念。每个项目跨两个章节：\n\
  \n- `项目 1：创建一个游戏`：引导你制作自己版本的经典雅达 *Pong*（乒球）。这个项目将运用你对 `Canvas API` 的技能，并将学到的关于数据结构、条件判断和函数整合在一起。在`第\
  \ 10 章`开发游戏后，`第 11 章`将向你展示如何使用类和面向的设计原则重构代码。\n- `项目 2：制作音乐`：探索如何使用 JavaScript 制作音乐。`第\
  \ 12 章`解释了如何使用 `Web Audio API` 和一个名为 `Tone.js` 的库来生成声音。然后`第 13 章`将你所学的内容整合起来创作一首歌曲。\n\
  - `项目 3：数据可视化`：使用流行的 `D3` 库向你介绍数据可视化的世界。`第 14 章`教授了 `D3` 和可缩矢量图形 (SVG) 的基础知识，SVG\
  \ 是浏览器中绘图 `Canvas API` 的替代方案。随后在`第 15 章`中，你将构建一个应用程序来动态可视化从互联网加载的数据。这个项目说明了如何通过第三方\
  \ `API` 请求数据。\n\n\n\n\n本书包含许多实操练习，以便你练习所学到的内容。我鼓励你亲自尝试所有的练习，但如果你遇到困难或只是想检查答案，可以在\
  \ `https://codepen.io/collection/ZMjYLO` 在线查看解决方案。在那个页面上，你还可以找到书中项目的完整、可下载代码文件。\n\
  \n有关本书的更新和其他相关信息，请参阅 No Starch Press 网站：`https://nostarch.com/javascript-crash-course`。\n\
  \n# 第一部分 语言\n\n本书的这一部分介绍了 JavaScript 语言的基础知识。你将学习任何 JavaScript 程序的各种基础构建块，包括许多与任何编程语言都相关的核心概念。\n\
  \n首先，我们将查看两种编写和执行 JavaScript 代码的方法：在浏览器的控制台中，或者在文本编辑器中（第 1 章）。然后，你将学习如何使用变量和常量来表示单个数据，以及如何通过语句和表达式操作这些数据（第\
  \ 2 章）。接下来，你将看到如何使用 JavaScript 的复合数据类型——数组和对象，将单个值组合成更有意义的结构（第 3 章）。\n\n第一部分的后续章节将向你展示如何为代码添加结构。首先，你将通过条件判断和循环将逻辑引入程序，它们共同使你能够做出决策并控制代码执行的流程（第\
  \ 4 章）。然后，你将学习使用函数（第 5 章）和类（第 6 章）来复用和组织代码的技术。\n\n## 1 开始\n\n![](img/opener.png)\n\
  \n在本章中，你将开始编写第一个 JavaScript 代码。首先，你将学习如何将代码直接输入网络浏览器，而无需安装任何专用软件。这种方法非常适合快速测试简单的代码序列。接下来，你将看到如何在单独的文本编辑器程序中编写\
  \ JavaScript，随着代码变得复杂，这种方法更为合适。在整本书中，我们将使用这两种技术来编写和执行 JavaScript 代码，因此本章将为你接下来的所有内容做好准备。\n\
