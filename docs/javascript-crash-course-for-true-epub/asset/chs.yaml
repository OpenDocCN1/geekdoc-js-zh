  \n\n\n\n我们将最后查看的传输辅助工具是 `Tone.Part`。它是所有辅助工具中最灵活的一个，因为它允许我们指定每个播放音符的精确时机。通过 `Tone.Part`，我们不再传递一个音名数组，而是传递一个时间/音符对数组。例如，`[[\"\
