  >列表 15-16：设置图例样式</samp>\n\n此处 `h1` 元素的字体大小设置为 `1.5em`，这意味着父元素字体大小的 1.5 倍。这确保了此标题将比其他文本大\
  \ 1.5 倍。`#key .color` 规则集用于设置作为图例一部分的颜色块。这些将是 `div` 元素，但 `display: inline-block`\
  \ 意味着它们将表现像内联元素（如 `span`）那样不会强制换行，又像块级元素（如 `div`）那样可以具有固定尺寸。（内联元素无法设置宽度和高度，因为它们根据内容调整大小，而在这种情况下颜色块没有内容。）\n\
