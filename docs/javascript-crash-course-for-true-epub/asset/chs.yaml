  \ 12-8）。\n\n### Tone.js 传输器\n\nTone.js transport 为我们提供了一种简单定义音乐循环的方法，包括它们何时开始和何时结束。最简单的\
  \ `Tone.Loop` 定义了一种持续产生音符的方法。让我们通过每隔四分音符播放一个单音符来尝试。修改 `script.js` 以使用列表 12-10 中的代码。\n\
  \n```\n, time);\n  }, \"4n\");\n\n❹ loop.start(\"0:0:0\");\n  loop.stop(\"4:0:0\"\
  );\n\n  Tone.Transport.start();\n});\n```\n\n列表 12-10: 循环\n\n*在我们之前的列表中，我们使用的是数字作为持续时间，这些是以秒为单位的持续时间。使用“4n”（四分音符）或“16n”（十六分音符）等音符长度持续时间的优势在于，当我们更改\
  \ BPM 时，它们会自动调整。例如，将 BPM 加倍将使每个四分音符的持续时间减半。*\n\n\n\n\n我们传递给 `Tone.Loop` 的回调函数体调用了\
  \ `synth` 上的 `triggerAttackRelease` 方法，播放一个持续时间为十六分音符的 C4 音符❸。`triggerAttackRelease`\
  \ 方法的第三个参数 `time` 代表播放音符的时间。`Tone.Loop` 对象每次调用回调函数时都会提供一个新的 `time` 值，并将其填充为传输控制器（transport）上相应的位置。\n\
  \n最后，我们对 `Tone.Loop` 构造函数返回的循环对象调用 `start` 和 `stop` 方法 ❹，传入我们希望该循环开始和停止的 `time`，随后调用\
  \ `Tone.Transport.start` 启动传输器从头开始播放。我们从“0:0:0”（第一小节的开头）开始，在“4:0:0”（第五小节的开头）停止，这意味着这段代码将持续四个完整的小节，每个小节四拍。我们的循环在每个节拍上重复一次，每次播放一个音符，因此总共将播放\
  \ 16 个音符。尝试重新加载页面看看！你可以像音乐家那样这样数数小节和节拍：“*one* 二二三四，*two* 二二三四，*three* 二二三四，*four*\
  \ 二二三四”。注意 `Tone.js` 不会在时间点“4:0:0”处播放第十七分音符，因为循环的结束点是不包含在内的。\n\nListing 12-11 显示了创建我们在\
  \ Listing 12-10 中编写相同循环的另一种方法。这次我们把 `start` 和 `stop` 方法直接链式到 `Tone.Loop` 构造函数上。\n\
  \n```\n--snip--\n  let synth = new Tone.Synth().toDestination();\n\n  new Tone.Loop(time\
  \ => {\n    synth.triggerAttackRelease(\"C4\", \"16n\", time);\n  }, \"4n\").start(\"\
  0:0:0\").stop(\"4:0:0\");\n\n  Tone.Transport.start();\n});\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">Listing 12-11: 使用更少的代码进行循环</samp>\n\n使用这种表示法，我们不需要创建一个变量来持有\
  \ `Tone.Loop` 对象，通过链式调用 `start` 和 `stop` 方法节省了几行代码。我们在本节的剩余部分将使用这种模式。\n\n`Tone.Loop`\
  \ 虽然很基础，但也非常多功能。你你可以在回调中运行任何任意代码，因此你可以做的不仅仅是反复播放同一个音符。例如，你可以选择每次播放一个新的随机音符。Listing\
