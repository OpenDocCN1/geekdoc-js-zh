  SANS_Futura_Std_Book_Oblique_I_11\">列表 15-20：跟踪隐藏的许可</samp>\n\n\n\n\n## 列表 15-21：确定具有隐藏许可证的仓库\n\
  \n为了过滤项目列表，对于每个项目，我们使用集合的 `has` 方法检查其许可证名称是否在 `hiddenLicenses` 集合中。如果名称不在集合中，则它将出现在过滤后的列表中。否则，它会被过滤掉。\n\
  \n最后，我们需要切换到使用 `filtered` 数组而不是 `items` 数组进行渲染。新图表将只渲染过滤后的数据，因此我们需要更改比例尺和条形绘制代码以处理过滤后的数据。另一方面，我们不应该过滤\
  \ `licenses` 集合，因为为了保持一致的颜色方案并渲染图例，无论某些许可证当前在条形图中是否被隐藏。列表 15-22 显示了 `update` 函数中所有需要更改为使用\
