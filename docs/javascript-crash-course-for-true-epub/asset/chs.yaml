  \n### 评分\n\n当你可以赢或输时，游戏通常更有趣。在 *Pong* 中，如果你击中了对手挡板背后的墙壁，就会得分。当这种情况发生时，球将重置为它的起始位置和速度，以进行下一回合游戏。我们将在节中也会处理这部分，但首先，为了跟踪分数，我们需要创建一些新变量。使用\
  \ Listing 10-15 中的代码更新 `script.js`。\n\n```\n--snip--\nlet leftPaddleTop = 10;\n\
  let rightPaddleTop = 30;\n\nlet leftScore = 0;\nlet rightScore = 0;\n\ndocument.addEventListener(\"\
  mousemove\", e => {\n  rightPaddleTop = e.y - canvas.offsetTop;\n});\n--snip--\n\
  ```\nListing 10-15: 用于跟踪分数的变量\n\n在这里我们声明了两个新变量 `leftScore` 和 `rightScore`，并将它们都设为\
  \ `0`。稍后我们将添加逻辑，在得分时增加这些变量的值。\n\n接下来，我们将显示分数的的代码添加到 `draw` 函数的末尾。如 Listing 10-16\
  \ 所示更新函数。\n\n```\n--snip--\n  ctx.fillRect(\n    width - PADDLE_WIDTH - PADDLE_OFFSET,\n\
  \    rightPaddleTop,\n    PADDLE_WIDTH,\n    PADDLE_HEIGHT\n  );\n\n  // 绘制分数\n\
  \  ctx.font = \"30px monospace\";\n  ctx.textAlign = \"left\";\n  ctx.fillText(leftScore.toString(),\
  \ 50, 50);\n  ctx.textAlign = \"right\";\n  ctx.fillText(rightScore.toString(),\
  \ width - 50, 50);\n}\n\nfunction update() {\n--snip--\n```\nListing 10-16: 绘制分数\n\
  \n这段代码使用了一些我们还没有见过的新 canvas 属性和方法。首先，我们使用 `ctx.font` 设置即将绘制的文本的字体。这类似于 CSS 字体声明。在这种情况下，我们将字体设置为\
  \ 30 像素高且为 `monospace` 样式。`Monospace` 意味着每个字符占据相同的宽度，通常用于代码，正如本书中的代码列表一样。它看起来像。有很多\
  \ `monospace` 字体，但由于操作系统可能安装了不同的字体，我们只提供一个通用的字体样式（`monospace`），这意味着操作系统应该使用该字体样式的默认字体。在大多数操作系统中，Courier\
  \ 或 Courier New 是默认的 `monospace` 字体。\n\n接下来，我们使用 `ctx.textAlign` 设置文本的对齐方式。我们选择\
  \ `\"left\"` 对齐，但由于我们只想让它应用于左侧分数，在绘制右侧分数之前，我们将对齐方式改为 `\"right\"`。这样，如果分数变成两位数，数字将向屏幕中间延伸，保持视觉上的平衡。\n\
  \n要显示左侧分数，我们使用 `ctx.fillText` 方法。该方法有三个参数：要绘制的文本，以及绘制它的 `x` 和 `y` 坐标。第一个参数必须是字符串，因此我们对\
  \ `leftScore` 调用 `toString` 方法将其从数字转换为字符串。我们使用 `50` 作为 `x` 和 `y` 坐标，将文本放在画布的左上角附近。\n\
  \n> **注意**：`fillText` 的 `x`坐标参数的含义取决于文本的对齐方式。对于左对齐文本，`x` 指定左边缘，而对于右对齐文本它指定右边缘。\n\
  \n右侧分数的处理方式与左侧类似：设置文本对齐，然后调用 `fillText` 显示分数。这次我们将 `x` 坐标设置为 `width - 50`，使其像左侧分数距离左侧一样距离右侧。\n\
  \n当你刷新 `index.html` 时，你应该看到渲染出的初始分数，如 Figure 10-6 所示。\n\n![](img/Figure_10-6.png)\n\
  Figure 10-6: 显示分数\n\n现在我们需要处理球击中侧壁的情况。而不是反弹，应该增加相应的分数，并将球重置为原始速度和位置。首先我们将再次进行重构并编写一个重置球的函数。这还需要对球的速度和位置变量的处理方式进行一些更改。Listing\
  \ 10-17 显示了这些更改。\n\n```\n--snip--\nconst BALL_SIZE = 5;\n❶ let ballPosition;\n\n\
  let xSpeed;\nlet ySpeed;\n\nfunction initBall() {\n❷ ballPosition = {x: 20, y: 30};\n\
  \  xSpeed = 4;\n  ySpeed = 2;\n}\n\nconst PADDLE_WIDTH = 5;\n--snip--\n```\nListing\
  \ 10-17: initBall 函数\n\n\n\n\n\n在这里，我们将小球状态变量（`ballPosition`、`xSpeed` 和 `ySpeed`）的声明与这些变量的初始化分离。例如，`ballPosition`\
  \ 在程序的顶层 ❶ 处声明，但在新的 `initBall` 函数 ❷（“initialize ball”的缩写）中进行初始化。`xSpeed` 和 `ySpeed`\
  \ 也是如此。这样做是为了让我们能够随时通过调用 `initBall` 来将小球重置为初始位置和速度，而不需要在程序中到处复制粘贴小球状态变量的值。具体来说，我们现在可以在程序开始时调用\
  \ `initBall` 来首次设置小球，也可以在小球碰到左墙或右墙时随时调用它，将小球重置为原始状态。\n\n注意，我们不能在 `initBall` 函数内部同时声明和初始化小球状态变量——例如，在函数内部放置\
  \ `let ballPosition = {x: 20, y: 30};`——因为 `let` 关键字会在`当前作用域内`定义一个新变量，在这种情况下，该作用域就是\
  \ `initBall` 的函数体。因此，这些变量将仅在 `initBall` 内部可用。我们希望变量在整个程序范围内可用，所以我们在程序的顶层（任何函数体体之外）使用\
  \ `let` 声明它们。然而，由于我们想要多次初始化这些变量，因此我们在 `initBall` 函数中为它们赋值，该函数可以被重复调用。\n\n接下来，我们必须修改\
  \ `checkCollision` 函数中的碰撞检测代码，以便在碰到左墙或右墙时增加分数并重置小球。Listing 10-18 显示了如何实现。\n\n```\n\
  --snip--\n  if (checkPaddleCollision(ball, rightPaddle)) {\n    // 右球板碰撞发生\n   \
  \ let distanceFromTop = ball.top - rightPaddle.top;\n    let distanceFromBottom\
  \ = rightPaddle.bottom - ball.bottom;\n    adjustAngle(distanceFromTop, distanceFromBottom);\n\
  \    xSpeed = -Math.abs(xSpeed);\n  }\n\n❶ if (ball.left < 0) {\n    rightScore++;\n\
  \    initBall();\n  }\n❷ if (ball.right > width) {\n    leftScore++;\n    initBall();\n\
  \  }\n\n  if (ball.top < 0 || ball.bottom > height) {\n    ySpeed = -ySpeed;\n \
  \ }\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing\
  \ 10-18: 墙壁碰撞时得分</samp>\n\n之前，我们在一个 `if` 语句中检查左右墙的碰撞并让小球反弹，但我们必须单独处理左右墙，因为根据撞击到的是哪一面墙，不同的玩家会得分。因此，我们将\
  \ `if` 语句拆分为两个。如果小球碰到左墙 ❶，`rightScore` 增加，并通过调用我们新的 `initBall` 函数来重置小球。如果小球碰到右墙\
  \ ❷，`leftScore` 增加并重置小球。与顶部和底部墙碰撞的逻辑保持不变。\n\n最后，由于我们把小球状态变量的初始化移动到了 `initBall` 函数中，我们需要在游戏循环开始之前调用该函数，以便首次设置小球。滚动到\
  \ `script.js` 的底部，并按照 Listing 10-19 所示更新代码，在调用 `gameLoop` 之前添加对 `initBall` 的调用。\n\
  \n```\n--snip--\nfunction gameLoop() {\n  draw();\n  update();\n  checkCollision();\n\
  \n  // 在超时后再次调用此函数\n  setTimeout(gameLoop, 30);\n}\n\ninitBall();\ngameLoop();\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-19: 首次调用 initBall</samp>\n\
  \n现在当你刷新 `index.html` 时，你应该能看到小球碰到侧墙时分数增加，并且小球在碰到侧墙后应该重置为原始速度和位置。当然，现在击败电脑很容易，因为它还没有移动它的球板！\n\
  \n### 计算机控制\n\n现在让我们给游戏增加一些挑战吧！我们想让计算机控制的对手移动左球板并尝试击中小球。实现这一点有多种方法，但在我们简单的方法中，我们将让计算机始终匹配小球当前的位置。计算机的逻辑将非常简单：\n\
  \n*   如果小球的顶部在球板的顶部上方，则球板向上移动。\n*   如果小球的底部在球板的底部下方，则球板向下移动。\n*   否则，什么都不做。\n\n\
  使用这种方法，如果计算机可以以任何速度移动，它将永远不会错过。由于这对我们人类来说没好玩，我们将为计算机设置一个速度限制。Listing 10-20 显示了如何实现。\n\
  \n```\nlet canvas = document.querySelector(\"#canvas\");\nlet ctx = canvas.getContext(\"\
  2d\");\nlet width = canvas.width;\nlet height = canvas.height;\n\nconst MAX_COMPUTER_SPEED\
  \ = 2;\n\nconst BALL_SIZE = 5;\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 10-20: 限制计算机的速度</samp>\n\n我们将计算机的速度限制声明为一个常量 `MAX_COMPUTER_SPEED`。通过将其设置为\
  \ 2，我们意味着计算机不被允许在游戏的每一帧中将球板移动超过 2 像素。\n\n接下来，我们将定义一个名为 `followBall` 的函数，应用一些非常基础的人工智能来移动计算机的球板。新函数在\
  \ Listing 10-21 所示。将将其添加到代码中 `draw` 函数和 `update` 函数之间。\n\n```\n--snip--\nfunction\
  \ followBall() {\n❶ let ball = {\n    top: ballPosition.y,\n    bottom: ballPosition.y\
  \ + BALL_SIZE\n  };\n❷ let leftPaddle = {\n    top: leftPaddleTop,\n    bottom:\
  \ leftPaddleTop + PADDLE_HEIGHT\n  };\n\n❸ if (ball.top < leftPaddle.top) {\n  \
  \  leftPaddleTop -= MAX_COMPUTER_SPEED;\n❹ else if (ball.bottom > leftPaddle.bottom)\
  \ {\n    leftPaddleTop += MAX_COMPUTER_SPEED;\n  }\n}\n\nfunction update() {\n \
  \ ballPosition.x += xSpeed;\n  ballPosition.y += ySpeed;\n❺ followBall();\n}\n--snip--\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing 10-21: 计算机控制球板</samp>\n\
  \n在 `followBall` 函数内部，我们定义了代表小球 ❶ 和左球板 ❷ 的对象，每个对象都有表示边界的顶部和底部属性。然后我们实现移动移动逻辑：如果小球的顶部在球板上方\
  \ ❸，通过减去 `MAX_COMPUTER_SPEED` 让球板向上移动。同样，如果小球的底部在球板下方 ❹，通过加上 `MAX_COMPUTER_SPEED`\
  \ 让球板向下移动。\n\n我们在 `update` 函数中调用新的 `followBall` 函数 ❺。这样，移动左球板就变成了游戏循环每次迭代更新状态的一部分。\n\
  \n刷新页面，看看你是否对电脑得分！\n\n### 游戏结束\n\n创建游戏的最后一步是让它可赢（或可输）。为了实现这一点，我们必须添加某种游戏结束条件，并在那里停止游戏循环。在这种情况下，一旦某个玩家达到\
  \ 10 分，我们就停止游戏循环，然后显示“GAME OVER”。\n\n首先，我们需要声明一个变量来跟踪游戏是否结束。我们将使用该变量来决定是否重复 `gameLoop`\
  \ 函数。Listing 10-22 显示了需要做的更改。\n\n```\n--snip--\nlet leftScore = 0;\nlet rightScore\
  \ = 0;\n❶ let gameOver = false;\n\ndocument.addEventListener(\"mousemove\", e =>\
  \ {\n--snip--\n\nfunction checkCollision() {\n--snip--\n  if (ball.right > width)\
  \ {\n    leftScore++;\n    initBall();\n  }\n❷ if (leftScore > 9 || rightScore >\
  \ 9) {\n    gameOver = true;\n  }\n  if (ball.top < 0 || ball.bottom > height) {\n\
  \    ySpeed = -ySpeed;\n  }\n}\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 10-22: 添加 gameOver 变量</samp>\n\n\n\n\n在 `script.js` 的顶部，我们声明了一个名为 `gameOver`\
  \ 的变量，用于记录游戏是否结束❶。我们将其初始化为 `false`，以免游戏在开始之前就结束。然后，在 `checkCollision` 函数中，我们检查其中一个分数是否超过了\
  \ 9 ❷。如果是，我们将 `gameOver` 设置为 `true`。这个检查可以在任何地方发生，但我们将其放在 `checkCollision` 中，以便将增加分数的逻辑和检查分数的逻辑保持在一起。\n\
  \n接下来，我们将添加一个用于写入“GAME OVER”文本的函数，并修改游戏循环，使其在 `gameOver` 为 `true` 时结束。列表 10-23 展示了具体实现方法。\n\
  \n```javascript\n--snip--\n  if (ball.top < 0 || ball.bottom > height) {\n    ySpeed\
  \ = -ySpeed;\n  }\n}\n\nfunction drawGameOver() {\n  ctx.fillStyle = \"white\";\n\
  \  ctx.font = \"30px monospace\";\n  ctx.textAlign = \"center\";\n  ctx.fillText(\"\
  GAME OVER\", width / 2, height / 2);\n}\n\nfunction gameLoop() {\n  draw();\n  update();\n\
  \  checkCollision();\nif (gameOver) {\n    draw();\n    drawGameOver();\n  } else\
  \ {\n    // Call this function again after a timeout\n    setTimeout(gameLoop, 30);\n\
  \  }\n}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 10-23: 结束游戏</samp>\n\
  \n我们在 `checkCollision` 函数之后定义了 `drawGameOver` 函数❶。它在画布的中央用大号白色字体绘制“GAME OVER”文本。为了将文本置于画布中间，我们将文本对齐方式设置为\
  \ `\"center\"`，并使用画布宽度和高度的一半作为文本的 x 和 y 坐标。（在居中对齐的情况下，x 坐标指的是文本的水平中点。）\n\n在 `gameLoop`\
  \ 函数中，我们将对 `setTimeout` 的调用封装在一个条件语句中，该语句检查 `gameOver` 变量的值。如果是 `true` ❷，游戏结束了，因此我们调用了\
  \ `draw` 和 `drawGameOver` 函数。（需要 `draw` 函数来显示最终分数；否则，获胜者将停留在 9 分。）如果 `gameOver`\
  \ 为 `false` ❸，游戏可以继续：我们通过使用 `setTimeout` 在 30 毫秒后再次调用 `gameLoop` 来以前一样继续循环。\n\n\
  一旦 `gameOver` 变为 `true` 且游戏循环结束，游戏就会停止。在“GAME OVER”文本之后，屏幕上将不再绘制其他内容——至少在刷新页面并在程序从头开始运行之前如此。现在去试试吧：刷新\
  \ `index.html` 看看能不能打败电脑！一旦有人超过 9 分，你就会看到“GAME OVER”文本，如图 10-7 所示。\n\n![](img/Figure_10-7.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 10-7: 游戏结束</samp>\n\n我希望你赢了电脑，但没赢也不用担心——游戏相当难。这里你可以做一些让它更容易的事情：\n\
  \n*   增加 `gameLoop` 中帧之间的间隔时间。\n*   让挡板变得更高。\n*   降低电脑的最大速度。\n*   让更容易击中挡板边缘。\n\
  *   增加击中挡板边缘对 `ySpeed` 产生的影响。\n\n现在你已经有了一个可以运行的游戏，可以进行任何你更改。如果你已经是一个 `Pong` 高手，你可能想让它变得更难；以下练习提供了一些建议。你也可以尝试自定义外观，或者更改画布的大小——现在是你的游戏了。\n\
  \n### 完整代码\n\n为了方便起见，列表 10-24](#chapter10.xhtml_Lis10-24) 显示了整个 `script.js` 文件。\n\
  \n```javascript\nlet canvas = document.querySelector(\"#canvas\");\nlet ctx = canvas.getContext(\"\
  2d\");\nlet width = canvas.width;\nlet height = canvas.height;\n\n// ... (其余逻辑)\n\
  ```\n\n\n\n在本章中，你从零开始创建了一个完整的游戏。游戏循环、碰撞检测和渲染的基础知识具有广泛的适用性，因此凭借在这里学到的知识，你可以开始创建各种\
  \ 2D 游戏。例如，你可能会尝试实现一个你自己的版本的 `Breakout`（炸块）或 `Snake`（吃蛇）。如果你在逻辑方面需要帮助，网上有很多教程可以遵循。祝你玩得开心！\n\
  \n## 11 面向对象的乒乓球\n\n![](img/opener.png)\n\n在上一章中，我们构建了自己版本的`Pong`（乒乓球）游戏。之前的第 6\
  \ 章中，你学习了 JavaScript 中的类和面向对象编程。你可能会奇怪，为什么我们在实现 `Pong` 时没有使用任何类。主要原因是我想让游戏代码尽可能简单，不包含任何不必要的概念，以便更容易看出游戏实际在做什么。然而，随着程序变得越来越大复杂，为它们提供更多的结构会有帮助，而实现的一种常用方法就是使用面向对象编程。\n\
  \n为了帮助你更好地理解如何以面向对象的风格设计软件，在本章中，我们将介绍面向对象版本的 `Pong`。游戏的逻辑不会发生任何变化，但代码的结构和组织方式将不同。例如，处理球的代码将全部存储在一个名为\
  \ `Ball` 的类中。我们将使用这个类来跟踪球的位置，并确定球在撞击墙或拍板时应该如何反弹。同样，所有处理拍板的代码将存储在一个名为 `Paddle` 的类中。通过让\
  \ `Ball` 和 `Paddle` 类继承自一个共享的父类，我们可以轻松地共享适用于球和拍板的通用代码。\n\n本章将探索面向对象的 `Pong` 程序的通用结构，但我们不会进入代码的每一个细节；根据上一章的内容，你应该对它的工作原理有了很好的了解。考虑到这一点，在本章中，我们不会增量地构建游戏，而是将逐节遍历完整代码。因此，在你输入所有代码之前，代码将无法正确运行或执行任何操作。但在进入代码本身之前，让我们先更广泛地观察如何设计面向对象的计算机程序。\n\
  \n### 面向对象设计\n\n以面向的方式编写代码通过将代码组织成代表程序各个层面的类，为计算机程序增加了结构。这种结构使得其他程序员（甚至是以后的你）更容易理解你的代码是如何工作的。对面向对象设计技术进行全面处理将超出本书的范围，但在本节中，我们将介绍面向对象编程核心的几个原则。\n\
  \n面向对象设计中重要的第一步是建模你的领域，或者说你程序的世界。程序中有哪些不同的元素？它们需要做什么？它们之间是如何相互关联和交互的？在这种情况下，领域是\
  \ `Pong` 游戏，游戏中有几个可见元素：球、拍板和分数。虽然有两个拍板，但它们的行为方式基本相同，所以我们可以创建一个单一的 `Paddle` 类并带有两个自定义实例。同时，球的独特性足以让它拥有自己的类。我们还必须建模这些元素是如何交互的。例如，我们如何建模球与拍板的碰撞？这段代码必须存在于某处。正如你看到的，在我的设计中，我决定代码应该位于\
  \ `Ball` 类中。换句话说，球应该“知道”在撞击拍板和墙壁时如何反弹。\n\n面向对象编程的另一个重要方面是`封装`。这意味着将类的内部细节从程序的其余部分隐藏起来，并提供一个简单的接口供其用于与类交互。封装这些细节使得以后更改它们更容易而不影响程序的其他部分。例如，`Ball`\
  \ 类不需要向程序的其余部分暴露它的速度或位置。如果我们决定更改速度表示方式（例如，使用角度和速度代替 `xSpeed` 和 `ySpeed`），我们不需要更改程序其他部分的运行方式。\n\
  \n> 注意\n> 从技术上讲，`xSpeed` 和 `ySpeed` 在 `Ball` 类外部是可以访问的，但我们不会访问，因此可以将其视为封装的细节。JavaScript\
  \ 确实有一种声明属性为私有的方法，这意味着它们不能在类之外访问，但在编写时这是一个新功能，尚未在所有浏览器中可用。\n\n面向对象编程的终极关键方面是`多态`，这种想法是：如果一个方法预期接收特定类的对象，那么它也可以接收该类的子类的实例对象。例如，在本章中，你会看到一个拥有\
  \ `draw` 方法的 `Entity` 类以及它的两个子类：`Paddle` 和 `Ball`。根据多态性，任何使用 `draw` 方法的代码都应该接收任何类型的\
  \ `Entity` 作为参数，而无需担心我们传递的是一个 `Ball` 还是一个 `Paddle`。\n\n最后，面向对象设计与其说是一门科学，不如说有很多不同的实现方法。你应该将本章中的设计视为解决问题的一种可能方法，而不是处理事情的“正确方法”。考虑到这一点，让我们深入研究面向对象的\
  \ `Pong` 代码。\n\n### 文件结构\n\n面向对象版本 `Pong` 的 HTML 与上一章完全相同，但 JavaScript 完全不同。如果你愿意，可以为\
  \ `tennjs` 目录创建一个副本，删除 `script.js` 文件，并使用后续章节中所示的代码创建一个新的 `script.js` 文件。或者，你只需要删除现有\
  \ `tennjs` 目录中 `script.js` 文件中的所有代码，将其替换为新的面向对象代码。无论哪种方式，更新后的 `script.js` 文件将由一系列类声明组成，随后是一些启动游戏的额外代码。我们将顺序查看代码的每个部分。\n\
  \n### GameView 类\n\n我们将声明的第一个类是 `GameView`。这个类负责玩家的游戏视图，或者说游戏如何显示。由于游戏使用画布进行渲染，`GameView`\
  \ 类负责画布和绘图上下文环境。该类还负责在画布上绘制物体（例如球和拍板）以及显示“GAME OVER”文本。代码请参见列表 11-1。\n\n\n\n\n\n\
  ```\nclass GameView {\n  ❶ constructor() {\n    let canvas = document.querySelector(\"\
  #canvas\");\n    this.ctx = canvas.getContext(\"2d\");\n    this.width = canvas.width;\n\
  \    this.height = canvas.height;\n    this.offsetTop = canvas.offsetTop;\n  }\n\
  \n  ❷ draw(…entities) {\n    // Fill the canvas with black\n    this.ctx.fillStyle\
  \ = \"black\";\n    this.ctx.fillRect(0, 0, this.width, this.height);\n\n  ❸ entities.forEach(entity\
  \ => entity.draw(this.ctx));\n    }\n\n  ❹ drawScores(scores) {\n    this.ctx.fillStyle\
  \ = \"white\";\n    this.ctx.font = \"30px monospace\";\n    this.ctx.textAlign\
  \ = \"left\";\n    this.ctx.fillText(scores.leftScore.toString(), 50, 50);\n   \
  \ this.ctx.textAlign = \"right\";\n    this.ctx.fillText(scores.rightScore.toString(),\
  \ this.width - 50, 50);\n  }\n\n  ❺ drawGameOver() {\n    this.ctx.fillStyle = \"\
  white\";\n    this.ctx.font = \"30px monospace\";\n    this.ctx.textAlign = \"center\"\
  ;\n    this.ctx.fillText(\"GAME OVER\", this.width / 2, this.height / 2);\n  }\n\
  }\n```\n\n列表 11-1：GameView 类\n\n`GameView` 的 `constructor` ❶ 获取了 `canvas` 及其绘图上文的引用，并将它们分别保存为名为\
  \ `canvas` 和 `ctx` 的属性。它还存储了一些用于绘制的值：`canvas` 的 `width` 和 `height`，以及 `canvas` 距离浏览器视口顶部的偏移量（offsetTop`）。\n\
  \n`draw` 方法 ❷ 使用了第 5 章中引入的剩余参数。通过这种方式，你可以向 `draw` 传递多个参数，所有参数都将被收集到一个名为 `entities`\
  \ 的数组中。每个参数将是一个代表游戏中其中一个元素的对象：球和两个挡挡板。该方法首先绘制一个黑色矩形以清除画布，然后遍历元素数组，依次调用每个元素自身的 `draw`\
  \ 方法 ❸，并将绘图上下文作为参数传递。只有当传递给 `GameView.draw` 的每个对象都有自己的 `draw` 方法时才能生效；我们将在下一节介绍它是如何实现的。`GameView`\
  \ 上的 `draw` 方法在游戏循环的每次迭代中负有画布的最终责任，但它将实际绘制游戏元素的责任委托给了代表这些元素的对象。实际上，游戏中的每个元素都“知道”如何绘制自己，而\
  \ `GameView.draw` 只是负责协调调用。\n\n`drawScores` 方法 ❹ 接收一个包含两个分数的对象并将其绘制到画布上。这与上一章中的分数绘制代码非常相似。主要区别在于，它不再依赖全局变量获取画布宽度，而是通过引用\
  \ `this.width` 使用 `GameView` 类中的 `width` 属性。\n\n`drawGameOver` 方法 ❺ 与上一章中的对应函数也大部分相同，但它同样是从\
  \ `GameView` 获取宽度和高度，而不是从全局变量。\n\n### 游戏元素\n\n接下来，我们将实现代表三个主要游戏元素的类：两个挡板和一个球。我们将从一个名为\
  \ `Entity` 的超类开始，它将成为子类 `Paddle` 和 `Ball` 的父类。`Entity` 类的存在是为了共享挡板和球通用的通用代码。这包括跟踪元素尺寸和位置的代码、计算碰撞检测的元素边界的代码，以及绘制元素的代码。由于所有游戏元素都是矩形，无论我们处理的是挡板还是球，这些代码都是相同的。这展示了面向对象编程的优之处：我们可以在超类中写一次所有通用代码，并让子类继承它。\n\
  \n列表 11-2 包含了 `Entity` 类的代码。\n\n```\nclass Entity {\n  ❶ constructor(x, y, width,\
  \ height) {\n    this.x = x;\n    this.y = y;\n    this.width = width;\n    this.height\
  \ = height;\n  }\n\n  ❷ boundingBox() {\n    return {\n      left: this.x,\n   \
  \   right: this.x + this.width,\n      top: this.y,\n      bottom: this.y + this.height\n\
  \    };\n  }\n\n  ❸ draw(ctx) {\n    ctx.fillStyle = \"white\";\n    ctx.fillRect(this.x,\
  \ this.y, this.width, this.height);\n  }\n}\n```\n\n列表 11-2：Entity 类\n\n`Entity`\
  \ 的 `constructor` ❶ 接收 `x`、`y`、`width` 和 `height`，即实体左上角的坐标以及尺寸的 `width` 和 `height`。这些被保存为属性。`boundingBox`\
  \ 方法 ❷ 返回一个包含实体 `left`、`right`、`top` 和 `bottom` 边界的对象。在上一章中，我们在 `checkCollision`\
  \ 函数中手动创建了这些对象。`Entity` 超类为球和挡板提供了一种通用的计算方式。`draw` 方法 ❸ 接收绘图上下文并使用构造函数中定义的属性绘制一个白色矩形。`GameView`\
  \ 上的 `draw` 方法将调用每个项（`Entity` 的子类）。\n\n### 挡板\n\n`Paddle` 类继承 `Entity` 类。它在列表 11-3\
  \ 中定义。\n\n```\nclass Paddle extends Entity {\n  ❶ static WIDTH = 5;\n  static HEIGHT\
  \ = 20;\n  static OFFSET = 10;\n\n  ❷ constructor(x, y) {\n    super(x, y, Paddle.WIDTH,\
  \ Paddle.HEIGHT);\n  }\n}\n```\n\n列表 11-3：Paddle 类\n\n该类包含了三个静态属性，这些属性赋值给类本身而不是类的实例。静态属性的值将在类的所有实例间共享。在这种情况下，虽然每个\
  \ `Paddle` 实例都需要自己的 `x` 和 `y` 坐标，但每个 `Paddle` 对象应具有相同的宽度和高度，以及距离画布边缘相同的偏移。因此，我们将这些值定义为静态属性\
  \ `WIDTH`、`HEIGHT` 和 `OFFSET`，它们对应于上一章的 `PADDLE_WIDTH`、`PADDLE_HEIGHT` 和 `PADDLE_OFFSET`\
  \ 常量。\n\n> 注意：类中没有定义静态常量的方法，因此上一章的常量现在实际上是变量。它们的名称全大写是为了表示它们应该被视为常量\n\n使用 `static`\
  \ 关键字声明静态属性。例如，我们使用 `static WIDTH = 5` 声明了 `WIDTH` 静态属性。静态属性通过点符号访问，就像访问实例属性一样，只是在点的左侧使用类名，而不是\
  \ `this` 或实例名称。例如，`Paddle.WIDTH` 访问 `WIDTH` 静态属性。\n\n`Paddle` 的 `constructor` ❷\
  \ 只有两个参数：`x` 和 `y`。它使用 `super` 调用父类（`Entity`）的构造函数，传递 `x` 和 `y` 参数，并将 `Paddle.WIDTH`\
  \ 作为宽度参数、`Paddle.HEIGHT` 作为高度参数。\n\n### 球\n\n接下来是 `Ball` 类。它与 `Paddle` 类相似，都自自 `Entity`，但\
  \ `Ball` 有自己的根据速度更新位置以及进行碰撞检测的逻辑。列表 11-4 显示了该类的部分代码。\n\n\n\n\n\n```javascript\n\
  class Ball extends Entity {\n❶ static SIZE = 5;\n\n❷ constructor() {\n    super(0,\
  \ 0, Ball.SIZE, Ball.SIZE);\n  ❸ this.init();\n  }\n\n❹ init() {\n    this.x = 20;\n\
  \    this.y = 30;\n    this.xSpeed = 4;\n    this.ySpeed = 2;\n  }\n\n❺ update()\
  \ {\n    this.x += this.xSpeed;\n    this.y += this.ySpeed;\n    }\n\n❻ adjustAngle(distanceFromTop,\
  \ distanceFromBottom) {\n    if (distanceFromTop < 0) {\n      // 如果球击中挡板顶部附近，减少\
  \ ySpeed\n      this.ySpeed -= 0.5;\n    } else if (distanceFromBottom < 0) {\n\
  \      // 如果球击中挡板底部附近，增加 ySpeed\n      this.ySpeed += 0.5;\n    }\n  }\n}\n```\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">示例 11-4：Ball 类的开头</samp>\n\n\
  该类有一个名为 `SIZE` 的静态属性，用于定义球的宽度和高度 ❶。接下来是它的构造方法 ❷。与 `Paddle` 构造方法一样，`Ball` 构造方法执行的第一件事是调用其父类\
  \ `Entity` 的构造方法，这次向 `x` 和 `y` 参数传递 `0`，向宽度和高度参数传递 `Ball.SIZE`。这些 `0` 只是占位符；事实上，球在每个回合的开始时都处于相同的位置\
  \ `(20, 30)`。这种定位由 `Ball` 类的 `init` 方法处理，该方法在构造方法中被首次调用 ❸。`init` 方法本身被定义为设置球的初始位置和速度\
  \ ❹，就像上一章中的 `initBall` 函数一样。每当需要将球重置为初始位置时（得分后），就会调用此方法。\n\n下一个方法 `update` 使用球的当前速度来更新其\
  \ `x` 轴和 `y` 轴位置 ❺。随其后的是 `adjustAngle` 方法 ❻，它等同于上一章描述的 `adjustAngle` 函数。它根据球击中挡板的位置来改变球的垂直速度（反射角度）。\n\
  \n`Ball` 类的定义在 示例 11-5 中继续，包含了碰撞检测的方法。\n\n```javascript\nclass Ball extends Entity\
  \ {\n--snip--\n  checkPaddleCollision(paddle, xSpeedAfterBounce) {\n  ❶ let ballBox\
  \ = this.boundingBox();\n    let paddleBox = paddle.boundingBox();\n\n    // 检查球和挡板在垂直和水平方向上重叠\n\
  \  ❷ let collisionOccurred = (\n      ballBox.left   < paddleBox.right &&\n    \
  \  ballBox.right  > paddleBox.left &&\n      ballBox.top    < paddleBox.bottom &&\n\
  \      ballBox.bottom > paddleBox.top\n    );\n\n    if (collisionOccurred) {\n\
  \      let distanceFromTop = ballBox.top - paddleBox.top;\n      let distanceFromBottom\
  \ = ballBox.bottom - paddleBox.bottom;\n    ❸ this.adjustAngle(distanceFromTop,\
  \ distanceFromBottom);\n    ❹ this.xSpeed = xSpeedAfterBounce;\n    }\n  }\n\n \
  \ checkWallCollision(width, height, scores) {\n    let ballBox = this.boundingBox();\n\
  \n    // 击中左墙\n  ❺ if (ballBox.left < 0) {\n      scores.rightScore++;\n      this.init();\n\
  \    }\n    // 击中右墙\n  ❻ if (ballBox.right > width) {\n      scores.leftScore++;\n\
  \      this.init();\n    }\n    // 击中顶部或底部墙\n    if (ballBox.top < 0 || ballBox.bottom\
  \ > height) {\n    ❼ this.ySpeed = -this.ySpeed;\n    }\n  }\n}\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">示例 11-5：Ball 类的其余部分</samp>\n\n`checkPaddleCollision`\
  \ 方法与上一章中的 `check Collision` 和 `checkPaddleCollision` 函数有一定的重复。该方法接受两个参数：一个代表挡板的对象以及\
  \ `xSpeedAfterBounce`。后者代表如果球从其中一个挡板上反弹，我们应该为 `xSpeed` 设置的新值，它允许我们配置球是预期始终向右反弹（从左挡板）还是向左反弹（从右挡板）。与上一章一样，我们强制要求与左挡板碰撞时球向右反弹，反之亦然，以避免球在挡板“内部”反弹的奇怪情况。\n\
  \n我们使用父类 `Entity` 的 `boundingBox` 方法获取球和挡板的边界框 ❶，并将它们存储为 `ballBox` 和 `paddleBox`。接下来，我们比较各种边界框边缘以判断球和挡板之间是否发生了碰撞，并将结果保存在布尔变量\
  \ `collisionOccurred` ❷ 中。如果 `collisionOccurred` 为真，我们根据从边界框确定的相应距离调用 `adjustAngle`\
  \ 方法 ❸，然后将球的 `xSpeed` 设置为 `xSpeedAfterBounce` ❹。\n\n最后，`checkWallCollision` 方法检查球与墙之间是否发生了碰撞。它接受游戏区域的\
  \ `width` 和 `height` 以及一个代表 `scores` 的对象。如果球击中左墙 ❺ 或右墙 ❻，相应的得分将会增加，并通过调用 `init`\
  \ 重置球。\n\n\n\n\n`Game` 构造函数首先实例化了 `GameView`、`Ball` 和 `Paddle` 类。`leftPaddle` 实例使用\
  \ `Paddle.OFFSET` 设置其 x 坐标 ❶。右侧实例则使用 `Paddle.OFFSET`、`Paddle.WIDTH` 和 `this.gameView.width`\
  \ 来确定其 x 坐标 ❷，这与我们在上一章中计算右侧挡板的位置类似。\n\n在类内部实例化其他类是面向对象代码的常见特性。这种技术被称为 `composition`（组合），因为我们正在其他实例内部组合了多个实例。\n\
  \n接下来，`Game` 构造函数实例化了 `Scores` ❸ 并将 `gameOver` 布尔值设置为 `false`。最后，它设置了一个 `mousemove`\
  \ 事件监听器 ❹，当用户移动鼠标时更新右侧挡板的位置。在类构造函数中设置的事件监听器工作方式与我们在书中看到的其他事件监听器一样：只要应用程序运行，它就会有效，并且每当检测到事件时，就会触发其处理函数。\n\
  \n构造函数之后是 `Game` 类的 `draw` 方法，它负责绘制游戏的所有视觉部分。首先，该方法调用 `this.gameView.draw` ❺，传入三个主要的游戏元素：`this.ball`、`this.leftPaddle`\
  \ 和 `this.rightPaddle`。这是对我们在 Listing 11-1 中看到的 `GameView` 类 `draw` 方法的调用，该方法接受数量数量的对象作为参数并在每个对象上调用\
  \ `draw` 方法。最终结果是 `game.draw` 调用 `gameView.draw`，后者调用 `ball.draw`、`leftPaddle.draw`\
  \ 和 `rightPaddle.draw`。这看起来可能有些迂回，但你经常会在面向对象代码中遇到这种情况，为了让代码保持在逻辑位置，需要绕一些弯。在这种情况下，`game.draw`\
  \ 负责知道*哪些*对象被绘制（因为 `Game` 类跟踪了所有的游戏元素）；`gameView.draw` 负责绘制上下文、清除画布并调用元素的 `draw`\
  \ 方法；而每个游戏元素的 `draw` 方法则负责知道如何绘制自己。\n\n在绘制完所有实体后，`draw` 方法调用了 `this.gameView.drawScores`，传入了\
  \ `this.scores` 对象 ❻。\n\n`Game` 类继续在 Listing 11-8 中提供了其余方法。\n\n```javascript\nclass\
  \ Game {\n--snip--\n  checkCollision() {\n    this.ball.checkPaddleCollision(this.leftPaddle,\n\
  \                                 ❶ Math.abs(this.ball.xSpeed));\n    this.ball.checkPaddleCollision(this.rightPaddle,\n\
  \                                 ❷ -Math.abs(this.ball.xSpeed));\n\n  ❸ this.ball.checkWallCollision(\n\
  \      this.gameView.width,\n      this.gameView.height,\n      this.scores\n  \
  \  );\n\n  ❹ if (this.scores.leftScore > 9 || this.scores.rightScore > 9) {\n  \
  \    this.gameOver = true;\n    }\n  }\n\n❺ update() {\n    this.ball.update();\n\
  \    Computer.followBall(this.leftPaddle, this.ball);\n  }\n\n❻ loop() {\n    this.draw();\n\
  \    this.update();\n    this.checkCollision();\n\n  ❼ if (this.gameOver) {\n  \
  \    this.draw();\n      this.gameView.drawGameOver();\n    } else {\n      // 在超时后再次调用此方法\n\
  \    ❽ setTimeout(() => this.loop(), 30);\n    }\n  }\n}\n```\n\nListing 11-8: Game\
  \ 类的剩余\n\n`Game` 类的 `checkCollision` 方法协调所有的碰撞检测逻辑。首先，它调用两次球的 `checkPaddleCollision`\
  \ 方法，检查球与每个挡板之间的碰撞。回想 Listing 11-5，该方法接受两个参数：一个 `Paddle` 对象和一个新的、反弹后的 `xSpeed` 值。对于左侧挡板，我们知道想要球向右反弹，因此我们通过对当前\
  \ `xSpeed` 取 `Math.abs` ❶ 来使新的 `xSpeed` 为正数。对于右侧挡板，我们想要球向左反弹，所以通过对 `Math.abs(xSpeed)`\
  \ 的结果取反 ❷ 来使新的 `xSpeed` 为负数。\n\n接下来，`checkCollision` 方法调用 `ball.checkWallCollision`\
  \ 来处理墙碰撞 ❸。该方法接受宽度和高度（因为 `Ball` 对象不知道游戏区域有多大）以及分数（这样在撞击侧壁时可以增加分数）。最后，该方法检查任意分数是否超过了阈值\
  \ ❹，如果是，则将 `this.gameOver` 设置为 `true`。\n\n`Game` 对象的 `update` 方法 ❺ 控制游戏循环每次重复之间的状态变化。它调用球的\
  \ `update` 方法来移动球，然后使用 `Computer.followBall` 静态方法根据球的新位置告诉电脑移动左侧挡板。\n\n`Game` 类的最后一个方法\
  \ `loop` 定义了游戏循环 ❻。我们按顺序调用 `this.draw`、`this.update` 和 `this.checkCollision`。然后我们检查\
  \ `this.gameOver` 是否为真。如果是，❼ 我们再次调用 `draw` 并调用 `gameView.drawGameOver`；否则，我们使用 `setTimeout`\
  \ 在 30 毫秒后 ❽ 再次调用 `loop`。\n\n### 游戏\n\n最后要做的一件事是通过实例化 `Game` 类来启动游戏，如 Listing 11-9\
  \ 所示。\n\n```javascript\nlet game = new Game();\ngame.loop();\n```\n\nListing 11-9:\
  \ 启动游戏\n\n\n\n\n本章将介绍 Web Audio API 以及基于其构建的 JavaScript 库 Tone.js。这将是你首次接触广阔的第三方\
  \ JavaScript 库世界，这些库是预写代码的集合，你可以利用它们来简化复杂的任务。与 Web Audio API 相比，Tone.js 提高了抽象级别，让你以更自然的方式思考并实现音乐概念。一旦你熟悉了它的工作原理，在第\
  \ 13 章中，你将把所学知识付诸实践，制作一首你可以自定义甚至重写的歌曲。\n\n### Web Audio API\n\n本节介绍了 Web Audio API\
  \ 的基础知识，它提供了一种使用 JavaScript 在浏览器中创建和处理声音的方法。Google Chrome 在 2011 年引入了 Web Audio\
  \ API，不久后它被作为 W3C 标准发布（W3C，即世界维网联盟，是一个开发 Web 标准的组织）。要使用它，你需要创建节点并将它们连接在一起。每个 `node`\
  \ 代表声音的某个方面——一个节点可能生成一个基础音色，第二个节点可能用于设置其音量，第三个节点可能会对音色应用混响或失真等效果，以此类推。通过这种方案，你可以产生几乎任何你需要的声音。\n\
  \n### 设置\n\n一如既往，我们从一个简单的 HTML 文件开始。该文件将赋予用户播放由 Web Audio API 生成的声音的能力。创建一个名为 `music`\
  \ 的新目录，并将列表 12-1 中的内容输入名为 `index.html` 的新文件中。\n\n```\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <title>Music</title>\n  </head>\n  <body>\n  ❶ <button id=\"play\"\
  >Play</button>\n  ❷ <p id=\"playing\" style=\"display: none\">Playing</p>\n    <script\
  \ src=\"script.js\"></script>\n  </body>\n</html>\n```\n\n列表 12-1：用于探索 Web Audio\
  \ API 的 `index.html` 文件\n\n此列表创建了两个视觉元素：一个播放按钮 ❶和一个包含“Playing”文本的段落 ❷。该段落使用了内联样式属性（style），这允许我们直接从\
  \ HTML 文件向元素添加 CSS 声明。在这种情况下，我们把 `display` 设置为 `none`，从而隐藏该元素。稍后，我们将使用 JavaScript\
  \ 移除样式并在音频播放时显示该元素。\n\n接下来，我们将开始编写 JavaScript。在包括 Google Chrome 在内的许多浏览器中，在用户与页面进行交互之前，Web\
  \ Audio API 不播放任何声音。我们使用播放按钮作为我们的交互元素，它将触发我们的音频代码。由于我们只需要按钮被点击一次，因此在被点击后我们将将其隐藏。\n\
  \n在与 HTML 文件相同的目录下创建 `script.js`，并添加列表 12-2 所示的内容。这段代码在用户点击按钮时会隐藏播放按钮并显示“Playing”文本。注意，我们现在还没有编写任何\
  \ Web Audio API 代码——这只是在设置按钮。\n\n```\n❶ let play = document.querySelector(\"#play\"\
  );\nlet playing = document.querySelector(\"#playing\");\n❷ play.addEventListener(\"\
  click\", () => {\n  // Hide this button\n  play.style = \"display: none\";\n  playing.style\
  \ = \" \";\n});\n```\n\n列表 12-2：在鼠标点击时切换元素的可见性\n\n首先，我们使用 `document.querySelector`\
  \ 方法 ❶ 获取两个元素的引用。然后，我们为播放按钮添加一个点击事件监听器 ❷。当用户点击它时，我们的事件监听器为按钮添加 `display: none` 的内联样式属性，并将段落的内联样式设置为空字符串，从而有效地移除了在\
  \ HTML 文件中作为属性设置的内联样式。这段代码的最终效果是，点击播放按钮将隐藏按钮并显示段落。这有两个目的：它让用户知道现在应该播放音乐了，并且移除了按钮以便其无法被再次点击。\n\
  \n### 使用 Web Audio API 生成音色\n\n完成设置后，我们现在可以编写一些 Web Audio API 代码了。为了开始，我们将生成一个单音，即音频版的“Hello,\
  \ world!”。生成音色的代码如列表 12-3 所示。正如我之前提到的，除非由用户事件（如鼠标点击）触发，否则音频将不会播放，因此所有的音频代码都位于点击处理程序内部。\n\
  \n```\n--snip--\nplay.addEventListener(\"click\", () => {\n  // Hide this button\n\
  \  play.style = \"display: none\";\n  playing.style = \" \";\n\n❶ let audioCtx =\
  \ new AudioContext();\n\n❷ let oscNode = audioCtx.createOscillator();\n  oscNode.frequency.value\
  \ = 440;\n\n❸ let gainNode = audioCtx.createGain();\n  gainNode.gain.value = 0.5;\n\
  \n❹ oscNode.connect(gainNode);\n  gainNode.connect(audioCtx.destination);\n\n❺ oscNode.start(audioCtx.currentTime);\n\
  \  oscNode.stop(audioCtx.currentTime + 2);\n});\n```\n\n列表 12-3：使用 Web Audio API\
  \ 播放单音\n\n我们做的第一件事是创建 `audio context`（音频上下文）❶。这是我们与 Web Audio API 交互的对象，类似于 `canvas`\
  \ 元素的绘图上下文。接下来，我们创建第一个节点，一个振荡器 ❷。在电子和信号处理术语中，`oscillator` 是一种按规律反复上升下降信号的设备。Web\
  \ Audio API 输出的默认波形是正弦波，如图图 12-1](#chapter12.xhtml_fig12-1) 所示。当波振荡得足够快并连接到扬声器时，它就会产生可听的音色。在这个示例中，我们将频率设置为\
  \ 440 赫兹 (Hz)，或每秒 440 次。换句话说，振荡器输出的信号每秒共从 0 到 1 再回到 0 变换 440 次。这意味着波的一个周期持续 1/440\
  \ 秒，即 2.27 毫秒。我在这里使用 440 Hz 是因为它是音乐调音的标准参考频率。该频率对应于中 C 之上的 A 音。\n\n接下来，我们创建一个增益节点\
  \ ❸ 并将其值设置为 0.5。在信号处理中，`gain` 指信号幅度或其取值范围的增加或减少。从实际角度来说，增益起着音量控制的作用。增益 2 会使幅度翻倍，使声音更大；增益\
  \ 0.5 会使幅度减半，使声音更小；而增益 1（增益节点的默认值）对幅度没有影响。对图 12-1](#chapter12.xhtml_fig12-1) 所示的正弦波应用\
  \ 0.5 的增益，将产生一个最大值为 0.5、最小值为 –0.5 的正弦波，如图 12-2](#chapter12.xhtml_fig12-2) 所示。\n\n\
  \n\n\n到目前为止，我们有两个节点：一个振荡器节点和一个增益节点。为了实际上将增益应用于振荡器信号，我们需要将这些节点连接起来。我们使用振荡器节点的 `connect`\
  \ 方法❹将振荡器节点的输出连接到增益节点的输入。然后，为了能够听到结果，我们将增益节点的输出连接到主输出，我们可以通过音频上下文的 `ctx.destination`\
  \ 获取。这些连接意味着振荡器信号通过了增益节点，然后传递到输出端，如果开启声音，它最终将传到你的耳机或扬声器。图 12-3 展示了这些连接。\n\n![](img/Figure_12-3.png)\n\
  \n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 12-3：节点图</samp>\n\n在我们告诉振荡器开始之前，振荡器节点实际上不会创建信号。要做到这一点，我们在振荡器上调用\
  \ `start` 方法，并将 `audioCtx.currentTime` 作为参数传递 ❺。`currentTime` 属性对应于音频上下文处于激活状态的秒数。通过将\
  \ `audioCtx.currentTime` 传递给 `start` 方法，我们是在告诉振荡器立即播放。然后我们调用 `stop` 方法，传递 `audioCtx.currentTime\
  \ + 2`。这告诉振荡器在启动两秒后停止。\n\n所有这些代码的效果是，当你浏览器中加载 `index.html` 页面并点击播放按钮时，应该会播放一个 440\
  \ Hz 的音调，持续两秒。如果你没有听到任何声音，请确保电脑和浏览器已启用声音——例如，播放一个 YouTube 视频。如果仍然不起，请检查控制台确保没有任何错误。\n\
  \n你可能在想为了一个非常简单的示例你刚刚写了大量的代码，你是对的！Web Audio API 非常强大，但你必须在非常底层面使用极其基础的构建模块进行工作。为了简化问题，接下来我们将注意力转移到一个流行的、高级的音频库，称为\
  \ Tone.js。\n\n### Tone.js 库\n\nTone.js 库构建在 Web Audio API 之上。它的设计是为了让使用 API 创建音乐变得更容易。例如，与其费力折腾振荡器和增益节点，Tone.js\
  \ 让你可以使用带有音量控制的电子乐。与其使用频率，你可以使用音符名称。与其使用秒来控制事件发生的时间，你可以使用小节（bars）和拍（beats）。\n\n\
  Tone.js 网站 `https://tonejs.github.io` 提供了安装和使用该库的详细信息。最简单的选项是使用托管在内容分发网络（CDN）上的预构建文件，例如\
  \ `https://unpkg.com`，我们在这里也将这样做。这样，你访问该库只需要在 HTML 文件的 `<script>` 元素中直接引用 URL 即可。只要你在工作时可以访问互联网，就不需要下载库副本。\n\
  \n#### 使用 Tone.js 生成音调\n\n让我们改用 Tone.js 库重新创建我们的 Web Audio API “Hello, world!”示例。除了为库添加新的\
  \ `<script>` 标签外，我们可以保持所有 HTML 均不变，如列表 12-4 所示。\n\n```\n--snip--\n    <p id=\"playing\"\
  \ style=\"display: none\">Playing</p>\n    <script src=\"https://unpkg.com/tone@14.7.77/build/Tone.js\"\
  ></script>\n    <script src=\"script.js\"></script>\n  </body\n</html\n```\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 12-4：在</samp> <samp class=\"SANS_Futura_Std_Book_11\"\
  >index.html</samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">文件中引入 Tone.js</samp>\n\
  \n我们将新 `<script>` 元素的 `src` 设置为来自 `unpkg.com` 的文件，该文件包含完整 Tone.js 库的单个 JavaScript\
  \ 文件。\n\n接下来，我们将编写 JavaScript。由于 Tone.js 底层使用 Web Audio API，我们仍然面临需要用户输入才能开始播放音频的限制。因此，我们仍然需要点击事件处理器，但\
  \ `script.js` 中的其他内容都将改变。列表 12-5。\n\n```\n--snip--\nplay.addEventListener(\"click\"\
  , () => {\n  // 隐藏此按钮\n  play.style = \"display: none\";\n  playing.style = \" \"\
  ;\n\n  Tone.start();\n\n  let synth = new Tone.Synth({\n    oscillator: {type: \"\
  sine\"},\n    envelope: {attack: 0, decay: 0, sustain: 1, release: 0},\n    volume:\
  \ -6 \n }).toDestination();\n\n  synth.triggerAttackRelease(\"A4\", 2, 0);\n});\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 12-5：使用 Tone.js 播放单音</samp>\n\
  \n我们需要做的的第一件事是调用 `Tone.start`。这触发 Tone.js 库在点击处理器内部启动，确保浏览器允许播放音频。接下来，我们创建一个新的 `Tone.Synth`\
  \ 对象。`Synth` 是 `synthesizer`（合成器）的缩写，是一种电子乐器，通常带有键盘，可以生成（合成）各种声音。`Tone.Synth` 是这种乐器的简单代码版本。\n\
  \n`Tone.Synth` 构造函数接受一个对象作为参数，允许我们配置合成器的各个方面。在这种情况下，我们告诉合成器使用生成正弦波的振荡器。我们还给合成器提供了一个简单的幅度包络和\
  \ `-6` 的音量。我将在下一节解释这些设置的含义，但目前，这就是我们匹配列表 12-3 中 Web Audio API 振荡器的内容。构造函数之后，我们链调用\
  \ `toDestination` 方法，将合成器的输出连接到音频上下文的输出。\n\n最后，我们告诉合成器使用其 `triggerAttackRelease`\
  \ 方法播放单个音符。该方法接收音符名称、持续时间以及播放音符的时间。我们传递 `\"A4\"` 作为音符名称，它等同于 440 Hz，并告诉它立即播放两秒。当你重新加载浏览器并点击播放按钮时，你应该能听到与运行列表\
  \ 12-3 时相同的声音。\n\n正如你可能看到的，使用 Tone.js 库简化了使用 Web Audio API 制作音乐的过程。与其为声音的不同方面（音高、增益等）每个都创建单独的节点，一切都整合在一个\
  \ `Synth` 对象下。如果你有任何音乐知识，你还会发现该库使用的概念比 API 更接近你的理解，例如，使用音符名称而不是频率。随着你学习更多 Tone.js，你将看到更多这样的例子。\n\
  \n#### 理解 Tone.Synth 选项\n\n让我们仔细观察一下在列表 12-5 中传递给 `Tone.Synth` 构造函数的对象。第一个属性 `oscillator`\
  \ 定义了生成信号的振荡器的选项。在这种情况下，我们只是使用 `type` 属性将振荡器类型设置为正弦波。\n\n\n\n下一个属性定义了 `amplitude\
  \ envelope`（幅度包络）的选项，它决定了音符音量在其持续时间内的变化。大多数硬件和软件合成器都允许你配置幅度包络。最常见的包络类型是 `ADSR envelope`，`attack,\
  \ decay, sustain, release`（起始、衰减、维持、释放）的缩写。`attack`（起始）是从音符触发（例如当你按下合成器上的键时）到音符达到最大音量之间的时间。`decay`（衰减）是从起始结束到音符维持部分之间的时间。`sustain`（维持）是一个增益值，定义了在按键期间音符在起始和衰减后保持的音量。通常这是包络起始部分实现的全音量的一个比例。`release`（释放）定义了在释放按键后，音符幅度恢复到零所需的时间。图\
  \ 12-4 以图形形式展示了这些不同的值。\n\n![](img/Figure_12-4.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 12-4：ADSR 包络的组成部分</samp>\n\nADSR 包络是许多乐器工作方式的近似。例如，当你拉小提琴时，音符需要一些时间才能达到最大音量——也就是说它的很长的起始时间。相比之下，当你按下钢琴键时，起始时间非常短。同样，当你停止拉奏小提琴音符时，琴弦需要一点时间才能停止振动，而钢琴音符的释放则更为直接。合成的\
  \ ADSR 包络仍然非常简单——它们并不是现实乐器的完美模拟——但它们为原本无聊的音色增了许多表现力。\n\n尽管如此，我们为合成器使用的 ADSR 包络是非常无聊的。我们将起始、衰减和释放值设置为\
  \ 0，将维持值设为 1，这意味着音色在整个持续时间内都保持全音量。这与我们在 代码列表 12-3 中对 Web Audio API 振荡器所的操作一致，这也是生成的音色听起来如此机械合成的原因之一。\n\
  \n合成器选项对象的最后一个属性 `volume` 以分贝（dB）设置合成器的整体音量。分贝是描述增益的另一种方式，在某些方面更符合我们思考增益的方式。0 分贝设置等于\
  \ 1 的增益（音量不变），–6 分贝等于 0.5 的增益（即一半音量），–12 分贝对应 0.25 的增益（即四分之一音量），依此类推；每增加 6 分贝音量翻倍，每减少\
  \ 6 分贝则减半。我们的耳朵对声音之间的相对音量敏感，因此每当电平减半或翻倍时，在我们听来就像是下降或上升了一个固定量。这个“固定量”是一个固定的增加或减少的分贝数值，这就是为什么使用分贝设置音量更简单。在这种情况下，我们传递了\
  \ –6 dB 以匹配 代码列表 12-3 中的 0.5 增益。\n\n现在你已经知道这些选项了，让我们尝试玩玩它们吧！首先，我们将修改振荡器的类型。目前振荡器被设置为生成正弦波，但我们将切换到方波。图\
  \ 12-5 显示了方波单个周期的波形。\n\n![](img/Figure_12-5.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 12-5：方波</samp>\n\n注意，方波在幅度值之间有突然的过渡，而不是正弦波的平滑曲线。切换到方波振荡器的代码更改如 代码列表 12-6 所示。\n\
  \n```\n--snip--\n  let synth = new Tone.Synth({\n    oscillator: {type: \"square\"\
  },\n    envelope: {attack: 0, decay: 0, sustain: 1, release: 0},\n    volume: -6\
  \ \n  }).toDestination();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >代码列表 12-6：将振荡器类型更改为方波</samp>\n\n当你重新在浏览器中加载代码时，你应该听到一种非常不同的音色。方波比正弦波更响、更亮。你可以尝试的振荡器类型其他值还有“triangle”（三角波）和“sawtooth”（锯齿波）。图\
  \ 12-6](#chapter12.xhtml_fig12-6) 显示了这者的波形。\n\n![](img/Figure_12-6.png)\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 12-6：锯齿波和三角波</samp>\n\n想想这些其他振荡器类型与“sine”和“square”有什么不同。每个振荡器的独特声音被称为它的\
  \ `color`（颜色）或 `timbre`（音色）。\n\n接下来，让我们尝试更改包络。我们在 代码列表 12-5 中有意使用了非常基础的包络，以匹配 代码列表\
  \ 12-3 中没有包络的 Web Audio API 示例。现在我们将这些值设置为一些听起来更有音乐感的数值，如 代码列表 12-7 所示。\n\n```\n\
  --snip--\n  let synth = new Tone.Synth({\n    oscillator: { type: \"square\" },\n\
  \    envelope: {attack: 0.8, decay: 0.3, sustain: 0.8, release: 1},\n    volume:\
  \ -6 \n  }).toDestination();\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >代码列表 12-7：将振荡器类型更改为方波</samp>\n\n起始、衰减和释放的值均以秒为单位，而维持是 0 到 1 之间的一个数字，代表要保持的幅度电平。在这里，我们将起始设置为\
  \ 0.8 秒，衰减设置为 0.3 秒，维持设为 0.8，释放设置为 1 整秒。当你重新加载页面并播放声音时，你应该听到音符缓慢淡入到最大音量，然后略微减少。两秒后，音符被释放并在一秒内淡出。\n\
  \n最后一个可以尝试的参数是音量。正如我之前解释的，每减去 6 dB，电平就减半；每增加 6 dB，就翻倍。在这里尝试一些不同的值，例如 –12、–18 或 –24。你也可以反向操作，直到\
  \ 0 dB。\n\n### 顺序播放更多音符\n\n我们的合成器目前只播放单个音符，但我们可以轻松播放更多音符。Tone.js 中的音符频率可以用 Hz 或音符名称（如\
  \ A4）给出，就像我们在代码列表 12-5](#chapter12.xhtml_Lis12-5) 中做的那样。这些音符名称对应于键盘上的键，如图 12-7](#chapter12.xhtml_fig12-7)所示。\n\
  \n![](img/Figure_12-7.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 12-7：键盘上的音符名称</samp>\n\nC4 被称为 `middle C`（中音），位于大多数钢琴键盘的中间。键盘上从每个 C 到上方的 B 的每个八度都被赋予了一个数字。例如，图\
  \ 12-7](#chapter12.xhtml_fig12-7) 最左侧的键是 C3，上面的一个八度是 C4。如之前提到的，440 Hz 对应 A4，即 C4\
  \ 之上的 A。黑键被称为 `accidentals`（变音符号），它们比左边的键高一个半音，或者比右边的键低一个半音。例如，C4 右侧的黑键可以称为 C♯4\
  \ 或 D♭4（♯ 是升号 `sharp`，意味着高一个半音，而 ♭ 是降号 `flat`，意味着低一个半音）。在 Tone.js 中编写音符名称时，我们使用井号\
  \ (#) 表示升，使用字母 b 表示降。\n\n> <samp class=\"SANS_Dogma_OT_Bold_B_21\">注意</samp>\n\n\
  *B 和 C 之间以及 E 和 F 之间没有黑键，因为这些音符只差一个半音。*\n\n我们将播放从 A3 到 A4 的大调，它由音符 A3、B3、C♯4、D4、E4、F♯4、G♯4\
  \ 和 A4 组成。更新你的 *script.js* 以包含代码列表 12-8](#chapter12.xhtml_Lis12-8) 中的代码以实现此音阶。\n\
  \n\n\n\n```\n--snip--\n  let synth = new Tone.Synth({\n    oscillator: {type: \"\
  square\"},\n  ❶ envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 0.1\
  \ },\n    volume: -6\n  }).toDestination();\n\n  synth.triggerAttackRelease(\"A3\"\
  , 0.9, 0);\n  synth.triggerAttackRelease(\"B3\", 0.9, 1);\n  synth.triggerAttackRelease(\"\
  C#4\", 0.9, 2);\n  synth.triggerAttackRelease(\"D4\", 0.9, 3);\n  synth.triggerAttackRelease(\"\
  E4\", 0.9, 4);\n  synth.triggerAttackRelease(\"F#4\", 0.9, 5);\n  synth.triggerAttackRelease(\"\
  G#4\", 0.9, 6);\n  synth.triggerAttackRelease(\"A4\", 0.9, 7);\n});\n```\n\n列表 12-8:\
  \ 播放音阶\n\n这与 列表 12-5 非常相似，不同在于我们一个接一个触发多个音符。注意我们更新了 `envelope`，使其具有更短的攻击（attack）和释放（release）时间❶。特别是释放时间需要更短，这样每个音符的结束才与下一个音符的开始重叠。\n\
  \n正如我之前提到的，`triggerAttackRelease` 的第二个参数是音符的持续时间（秒），第三个参数是播放该音符的时间（同样是秒）。第一个音符 `A3`\
  \ 播放 `0.9` 秒，从时间零开始（即立即）。`0.1` 秒的释放发生在 `0.9` 秒持续时间之后，因此每个音符总共将播放 1 秒。下一个音符 `B3`\
  \ 有相同的持续时间，但第三个参数 `1` 意味着它比第一个音符晚一秒开始。第三个音符设置为比第一个音符晚两秒，以此类推。在浏览器中运行它，你应该听到一个八度的\
  \ A 大调音阶。\n\n### 同时播放多个音符\n\n我们目前为止使用的合成器是一个`单音合成器`（monophonic synth），这意味着它一次只能播放一个音符。要同时播放多个音符，我们需要创建一个`多音合成器`（polyphonic\
  \ synth）。在 列表 12-9 中，我们更新代码来创建一个新的多音合成器，并同时播放两个或三个音符。\n\n```\n--snip--\n  Tone.start();\n\
  \n  let synth = new Tone.PolySynth(\n    Tone.Synth,\n    {\n      oscillator: {\
  \ type: \"square\" },\n      envelope: { attack: 0.1, decay: 0.3, sustain: 0.8,\
  \ release: 0.1 },\n      volume: -6\n    }\n  ).toDestination();\n\n  synth.triggerAttackRelease([\"\
  A3\", \"C#4\"], 0.9, 0);\n  synth.triggerAttackRelease([\"B3\", \"D4\"], 0.9, 1);\n\
  \  synth.triggerAttackRelease([\"C#4\", \"E4\"], 0.9, 2);\n  synth.triggerAttackRelease([\"\
  D4\", \"F#4\"], 0.9, 3);\n  synth.triggerAttackRelease([\"E4\", \"G#4\"], 0.9, 4);\n\
  \  synth.triggerAttackRelease([\"F#4\", \"A4\"], 0.9, 5);\n  synth.triggerAttackRelease([\"\
  G#4\", \"B4\"], 0.9, 6);\n  synth.triggerAttackRelease([\"E4\", \"A4\", \"C#5\"\
  ], 1.9, 7);\n});\n```\n\n列表 12-9: 创建并播放多音合成器\n\n在这里我们调用 `new Tone.PolySynth` 而不是\
  \ `new Tone.Synth` 来创建一个多音合成器对象。`Tone.PolySynth` 构造函数接受两个参数：一个单音合成器（在此例中为 `Tone.Synth`）和一个包含通常传递给该单音合成器构造函数的选项的对象（在此例中，我们在列表\
