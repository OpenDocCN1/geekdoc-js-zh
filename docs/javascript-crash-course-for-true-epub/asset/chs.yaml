  )\n  .style(\"font-size\", \"14px\")\n❶ .attr(\"text-anchor\", \"middle\")\n❷ .attr(\"\
  transform\", `translate(12, ${midPoint}) rotate(270)`);\n\nfunction getLicense(d)\
  \ {\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 15-18：添加左轴标签</samp>\n\
  \n首先，我们需要计算在何绘制标签。它的垂直位置应该在图表的中间。我们根据总高度和两个边距计算图表的高度，然后通过加上顶部边距和图表高度一半来计算中点。\n\n\
  接下来，我们向 `svg` 元素添加一个带有 *Stars* 单词的 `text` 元素。我们在早些的 *style.css* 中通过对 `body` 元素应用\
  \ `font-family` 设置了字体。将 `text-anchor` 属性设置为 `middle` ❶ 会使文本围绕其计算出的位置居中。我们还指定了两个变换\
  \ ❷：一个 `translate` 后跟一个 `rotate`。`translate` 将标签中心移动到正确位置，`rotate` 将其逆时针旋转 90 度（或顺时针旋转\
  \ 270 度）。\n\n### 添加交互性\n\n我们的可视化已经具有一定的交互性，即悬停在条形上会在侧边栏显示有关该仓库的详情。添加另一个允许用户过滤数据的交互元素会很有趣。例如，既然我们现在有了一个列出不同许可类型的键，可以使用它来选择性地显示或隐藏带有相应许可的仓库。我们现在实现这个交互功能，同时添加动画来平滑图表的变化。\n\
  \n### 按许可过滤数据\n\n为了让用户能够按许可类型过滤数据，我们将为键中的每个项添加一个复选框。然后我们将使用这些复选框来决定哪些仓库应（临时）从图中排除。这需要跟踪我们想要隐藏的许可，并在渲染之前移除任何使用这些许可的仓库。\n\
  \n首先，我们添加复选框。按照列表 15-19 所示修改 `script.js` 以实现此操作。\n\n```javascript\n--snip--\n  \
  \  d3.select(\"#key\")\n      .selectAll(\"p\")\n      .data(licenses)\n      .join(\n\
  \        enter => {\n        let p = enter.append(\"p\");\n\n        p.append(\"\
  input\")\n         .attr(\"type\", \"checkbox\")\n         .attr(\"checked\", true)\n\
  \         .attr(\"title\", \"Include in chart\");\n\n         p.append(\"div\")\n\
  \         .attr(\"class\", \"color\")\n         .style(\"background-color\", d =>\
  \ colorScale(d));\n--snip--\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 15-19：添加复选框</samp>\n\n在 HTML 中，复选框是一个 `type` 属性值为 `checkbox` 的 `input` 元素。在代码中，我们在键中每个\
  \ `p` 元素的开头添加一个这样的元素。`checked` 属性决定复选框是否被选中；我们默认将其设置为选中，因此当可视化首次加载时将显示所有仓库。`title`\
  \ 属性会在悬停在元素上时提供带有辅助文本的工具提示。\n\n接下来，我们需要创建一个机制来跟踪哪些许可应该被隐藏。这部分代码在列表 15-20 中。\n\n\
  ```javascript\n--snip--\nfunction getLicense(d) {\n  let license = d.license?.name;\n\
  \n  if (!license) {\n    return \"No License\";\n  } else {\n    return license;\n\
