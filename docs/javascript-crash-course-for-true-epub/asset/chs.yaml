  >列表 10-13: 调整反弹角度</samp>\n\n\n\n\n\n`adjustAngle` 函数有两个参数，`distanceFromTop` 和 `distanceFromBottom`。它们分别代表球的顶部到挡板顶部的距离，以及挡板底部到球底部的距离。该函数首先检查\
  \ `distanceFromTop` 是否小于 `0` ❶。如果是，那么意味着在碰撞时，球的顶部边缘位于挡板顶部边缘之上，这就是我们对“靠近挡板顶部”的定义方式。在这种情况下，我们从\
