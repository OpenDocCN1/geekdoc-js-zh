  \ CSS 样式。我们使用 `colorScale` 为该数据设置相应的颜色值。最后，我们为 `p` 元素添加一个 `span` 元素来存放许可的实际名称 ❹。\n\
  \n刷新页面，你应该能看到类似图 15-5 的效果。\n\n![](img/Figure_15-5.png)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 15-5：带有键的颜色编码条形</samp>\n\n我们的可视化结果现在有一个完整的键，显示每种颜色映射的许可，这使得颜色意义大得多。\n\n### 标记左轴\n\
  \n图中暗示图表的左轴显示了每个仓库拥有的星标数量，但图表中并未明确说明。为了修复这个问题，我们将添加一个 `text` 元素来标记左轴。这部分代码在列表 15-18\
  \ 中。将此代码添加到 `getLicense` 函数之前。\n\n```javascript\n--snip--\n// 左轴容器\nlet leftContainer\
  \ = svg\n  .append(\"g\")\n  .attr(\"id\", \"left\")\n  .attr(\"transform\", `translate(${margin.left},\
