  trans: "\n\n支持哪些功能？你可以如何扩展功能？新的浏览器和客户端请求总是接踵而至？在本文中，我们将展示一些进一步了解这些问题的方法。不过，首先理解为\
    \ Web 开发意味着什么至关重要。\n\n## 这与你无关\n\n我们之所以立即选择某个特定的解决方案，很大程度上是因为我们自己自己，而这正是我们如履薄冰的地方。我们并不消费自己发布在\
    \ Web 上的内容；相反，消费的是我们不认识的人，而我们无法对他们的能力、设置、技术理解或品味做出假设。我们无法让自己的产品成功；我们只是构建了它，因此我们是该产品最糟糕的测试者。\n\
    \n我专业从事 Web 开发已经超过 10 年了，处理过从个人博客到多语言企业 CMS 解决方案，再到复杂的 Web 应用的所有工作。在这个过程中我学到了一点：永远不要为你自己或客户构建。相反，要为将使用该产品的人以及在你离开后必须接手项目的可怜的人而构建。\n\
    \n尽管我们必须采取行动来减少我们巨大的碳足迹，但我们需要留下一个更整洁的 Web。为了保持 Web 作为一个繁荣的市场和可持续的工作环境，我们必须改变在其中工作的方式，而不是留下不可维护、臃肿且半不可用（尽管很漂亮）的解决方案。我们必须让人们更容易使用\
    \ Web 应用程序，并防止其他开发者在后期被要求更改或扩展它时，浪费数小时去理解我们做了什么。\n\n## 介绍针对 JavaScript 组件的七步测试法\n\
    \n为此，我整理了一套七步测试，可以应用于你找到任何开箱即用（out-of-the-box）组件。所有的建议都有其原理，因此在将这些观点斥为“精英主义”或“不真正适合我们的环境”之前，请深思。\n\
    \n不要忘记，即使有些东西是免费的，它的开发者也会为了名声将其卖给你，许多解决方案在邮件列表中被据理捍卫，而不是被更改或更新。原因是，作为开发者，我们总是在移动中。维护和扩展旧方案不如创建一个酷炫的新方案有趣。这导致了曾经在处于尖端时备受喜爱的、现在却在互联网上生锈的废墟。\n\
    \n为了测试任何开箱即用的解决方案，我主要使用一种工具：Firefox Web 开发者工具栏。你可以在 [Firefox 附加程序网站](https://addons.mozilla.org/en-US/firefox/addon/60)\
    \ 获取它，它提供了一种简单测试你所选组件正在发生什么的方法。\n\n好了，开始：在决定 JavaScript 解决方案时要的七件事。\n\n### 1.\
    \ 如果关闭 JavaScript 会怎样？\n\n我对任何组件进行的第一个测试是关闭 JavaScript……但不是在文档加载后，而是在之前。通过 Web\
    \ 开发者工具栏关闭 JavaScript 非常简单。只需从“禁用”菜单中选择“禁用所有 JavaScript”并重新加载页面：\n\n```\n![litmus-disable-javascript.jpg](img/litmus-disable-javascript.jpg)\n\
    ```\n\n原理是有很多原因导致可能不使用 JavaScript：公司代理或个人防火墙可能会将其过滤掉，其他脚本可能会产生错误并干扰你的脚本，或者使用的系统可能没有启用\
    \ JavaScript。例如移动环境。\n\n当 JavaScript 不可用时，你不需要完整的功能，只需要一个不会让用户过载的界面和可以运行的交互元素。如果用户激活按钮时没有任何反应，这些用户将停止对你产生信任；毕竟，你没有遵守承诺。\n\
    \n过载是另一个问题。许多组件使用 CSS 和 JavaScript 在非常小的空间内挤入大量内容：想想选项卡内容元素和图像轮播。它们的后备方案是什么？如果你关闭\
    \ JavaScript，在计划显示 2 张图片的地方出现了 50 张，那么那就是很糟糕的用户体验。更好的后备方案是相同功能的服务器端解决方案，或者显示前\
    \ 2 张然后提供一个指向剩余图片的画廊页面链接。\n\n有时某个特定组件的 JavaScript 实际上非常好，但演示网站做得不好。例如，用 CSS 隐藏元素然后用\
    \ JavaScript 显示它们是非常常见的。但如果 JavaScript 被关闭了，解决方案就会崩溃。良好的演示和解决方案使用 JavaScript 为文档\
    \ body 添加类（class），并让所有的 CSS 依赖于该类。\n\n任何良好的 JavaScript 组件都应该具备的技巧是：使用 JavaScript\
    \ 让任何功能依赖于 JavaScript；这样，你就永远不会有无法的功能。这种技术被称为“非侵入式 JavaScript”（unobtrusive JavaScript），我在此之前为此[写过一门课程](http://onlinetools.org/articles/unobtrusivejavascript/)并为它[制定了一些规则](http://icant.co.uk/articles/seven-rules-of-unobtrusive-javascript/)。\n\
    \n### 2. 如何更改外观、感觉和内容？\n\n一个外观和感觉是硬编码的组件维护起来非常痛苦。你不能指未来的设计师知道如何通过搜索你的 JavaScript\
    \ 文件来更改某种颜色。这就是为什么我们最终得到了臃肿的 CSS 文件，因为人们添加随机的 ID 和类来增强其 CSS 选择器的特性。\n\n良好的组件将外观和感觉封装在\
    \ CSS 文件中，并提供句柄（即动态应用的类）来应用你自己的样式。如果你发现自己必须更改 JavaScript 来更改外观和感觉，你的脑中应该响起警报了。\n\
    \n（注：此处原文存在大量重复的句子，根据指令要求翻译内容且不重复原文，此处译文已反映原文的逻辑结构）\n\n如果你发现自己必须更改 JavaScript\
    \ 来更改外观和感觉，你的脑中应该响起警报了。\n\n良好的工具具有[配置对象](http://dev.opera.com/articles/json-configuration/)，允许你在不丢失\
    \ JavaScript 的情况下更改元素数量并定义文本标签。否则人们可能会在 Web 上保留不安全的代码，这也是我们邮箱箱充满垃圾邮件的原因之一。\n\n\
    ### 3.  许多组件创建者非常乐于宣布他们的产品“符合 Web 标准”并因此具有可访问性。虽然符合 Web 标准很重要，但它并不代表产品的质量或实用性。人们无法通过自动化工具真正验证语义。例如，以下示例都是有效的\
    \ HTML：\n\n```html\n<div class=\"menu\">\n  <div class=\"section>\n    <span class=\"\
    label\">Animals</span>\n    <div class=\"subtitle\">\n      <div class=\"item\"\
    >Giraffe</div>\n      <div class=\"item\">Donkey</div>\n      <div class=\"item\"\
    >Cheetah</div>\n      <div class=\"item\">Hippo</div>\n    </div>\n  </div>\n\
    \  <div class=\"section\">\n    <span class=\"label\">Stones</span>\n    <div\
    \ class=\"subtitle\">\n      <div class=\"item\">Diamond</div>\n      <div class=\"\
    item\">Ruby</div>\n      <div class=\"item\">Onyx</div>\n    </div>\n  </div>\n\
    </div>\n<ul class=\"menu\">\n  <li>\n    <button>Animals</button>\n    <ul>\n\
    \      <li><a href=\"giraffe.html\">Giraffe</a></li>\n      <li><a href=\"donkey.html\"\
    >Donkey</a></li>\n      <li><a href=\"cheetah.html\">Cheetah</a></li>\n      <li><a\
    \ href=\"hippo.html\">Hippo</a></li>\n    </ul>\n  </li>\n  <li>\n    <button>Stones</button>\n\
    \    <ul>\n      <li><a href=\"diamond.html\">Diamond</a></li>\n      <li><a href=\"\
    ruby.html\">Ruby</a></li>\n      <li><a href=\"onyx.html\">Onyx</a></li>\n   \
    \ </ul>\n  </li>\n</ul>\n```\n\n"
- fmt: '

    The second example works without JavaScript and uses much less HTML. It also requires
    much less CSS for styling because you would simply take advantage of the cascade.


    Furthermore, the HTML on which the widget is based is only half the story. What
    the `JavaScript` generates also needs to be valid, usable and accessible, and
    you can check this when you check the generated source in the Web developer toolbar.


    To do this, right-click anywhere in the document and select `Web Developer` →
    `View Source` → `View Generated Source`:


    ![litmus-view-generated-source.jpg](Images/litmus-view-generated-source.jpg)


    Usability and accessibility (accessibility being, in essence, merely a more comprehensive
    understanding of usability) are harder to test. But one very good test is to check
    how keyboard-accessible a widget it is. Keyboard-only users are on the rise, and
    widgets that work only with mouse-over events would not usable on a touchscreen
    mobile, for instance. Many widgets provide basic keyboard access (e.g. using the
    `Tab` key to jump from one link to another, and the `Enter` key to activate each),
    but this is not proper accessibility.


    A menu, for example, should not be navigated by tabbing through each of the items
    because this would require far too many keystrokes. Instead, the user should be
    able to tab to the main menu bar and from there use the cursor keys to navigate.


    A modal pop-up (commonly called a lightbox) should be able to be closed with a
    keyboard by hitting the `Escape` key or by tabbing to the “Close” button. If it
    is a multi-item lightbox, you should also be able to navigate the items with the
    cursor keys.


    The [W3C’s WAI websites](http://www.w3.org/TR/wai-aria-practices/#kbd_generalnav)
    have some great examples of how widgets should react to keyboard use, and Todd
    Kloots of Yahoo does a [great job of explaining the techniques behind good keyboard
    usability](http://www.yuiblog.com/blog/2009/02/23/managing-focus/) (also [as a
    video](http://developer.yahoo.com/yui/theater/video.php?v=kloots-a11y) and [using
    YUI3](http://developer.yahoo.com/yui/theater/video.php?v=kloots-yuiconf2009-a11y)
    and [focusing on WAI-ARIA](http://ericmiraglia.com/blog/?p=132)). Patrick Lauke
    of Opera also wrote [a great article on the subject](http://24ways.org/2009/dont-lose-your-focus)
    and [gave a presentation](http://www.splintered.co.uk/news/112/) at last year’s
    Future of Web Design. If you are a Mac user, make sure to [turn on keyboard access](http://www.456bereastreet.com/archive/200906/enabling_keyboard_navigation_in_mac_os_x_web_browsers/)
    before declaring a widget faulty.


    People also need to be able to resize the text in their browser. So test the widgets
    at several text sizes. Using Internet Explorer 6 for this is important because
    it is the main culprit in font-resizing issues. Newer browsers do a much better
    job zooming the entire interface, but you cannot expect end users to know how
    to use them.


    ### 4. Do You Understand What’s Going On?


    If you’ve read the Harry Potter books (or even seen the movies), you know that
    you shouldn’t trust magic without knowing what is going on. A book that responds
    to your writing is as suspicious as a widget that does something so amazing that
    you have no clue how it happened.


    Remember, if the doo-dad stops working, you will be asked to fix it or explain
    what went wrong. Therefore, it is important to at least know the basics of what
    `JavaScript` spell was cast to transform a list of images into an all-singing,
    all-dancing carousel.


    Good widgets have technical documentation for that kind of thing, and some even
    fire off custom events that tell you when something is happening. That way, you
    can debug the tool by waiting for these events and analyzing the current state
    of play. It also allows you to extend functionality, which we’ll come back to
    in step #7.


    ### 5. Does It Play Well With Others?


    The biggest problem with any `JavaScript` on the Web right now is that its security
    model gives every script on the page the same rights. This means that one bad
    script can mess up the user’s whole experience because it may override parts of
    another script.


    The places where scripts can clash are in variable and function names and events.
    If your widget does not protect its variables and function names or if it applies
    event functionality to elements without checking that other scripts are doing
    the same, you’ll have a problem.


    Say you have an element with the ID `menu`, and you have one script that turns
    its HTML content into a drop-down menu and another that enhances the different
    links by showing a beautiful roll-over message. If neither of these scripts append
    to the existing functionality and just apply it, you’ll have either a beautiful
    roll-over or a menu, depending on which script is applied last.


    The good news is that for widgets that are based on libraries, this “event clash”
    is very unlikely because libraries work around that out of the box. You can test
    for the problem of function and variable names that can be overwritten by other
    scripts. [JSLint](http://www.jslint.com/) is a tool and website where you can
    check `JavaScript` for syntactical problems such as unprotected variables. It
    is a very strict tool, though, and not all of its warnings are deal-breakers.


    ### 6. How Dedicated Is The Maintainer?


    When choosing a widget, you want to be very sure that the maintainer is dedicated
    to keeping it up date and to fixing it for future. This is rarely the case, and
    a lot of software is released with an “as is” statement, absolving the creator
    of any liability for problems it may cause.


    Software, especially the kind that is executed in the browser and for Web consumption,
    has to constantly evolve. Things that were once state of the art might be clumsy
    now. Some software turned out to perform poorly or be outright security holes.


    Whenever people claim that we have a great baseline environment on the Web for
    screen space and processing power, something comes along that debunks it. Right
    now, testing on dual or quad-core processors with resolutions starting at 1280
    might be normal for us designers, but given the sales figures of smartphones and
    netbooks, planning for audiences other than these high-end ones might be a idea.


    For developers, maintenance is the most boring task. When we release awesome widgets
    to the world, we don’t want to think about that phase of software delivery. Granted,
    most widgets are released as open source, but sadly, not many developers fix or
    improve on other people’s work; building and releasing something identical but
    slightly modified is much more fun.


    As the user of someone else’s widget, you don’t want this to fly back in your
    face, so you need to see just how dedicated the developer is. A few questions
    to ask are:


    •Is there a simple way to report bugs?


    •Is there trail of improvements and bug fixes?


    •Is there a history of comments and changes to the widget based on that feedback?


    • Has the widget been used in real scenarios, large projects or implementations
    similar to yours? What were the experiences of those who used it?


    •Does the solution have a community (i.e. are there a few people on mailing lists
    or in forums helping each other, rather than overloading the original developer)?


    If the developer has no big personal stake in the widget or there is no group
    of developers or commercial users, then there is a high chance that you will see
    few or no fixes or improvements in future, and you will be responsible for supporting
    the next browser version that behaves badly.


    ### 7. Is There A Testing Plan, And Is Upgrading And Extending Easy?

