    \ a different value:\n\n```javascript\nvar banner = document.querySelector( '.stage\
    \ div' ),\nstart = 0,\nmultiplier = 0;\nfunction sine(){\nmultiplier = 50 * Math.sin(\
    \ start * 2 );\nbanner.style.top = multiplier * Math.sin( start ) + 80 + 'px';\n\
    start += 0.05;\n}\nwindow.setInterval( sine, 1000/30 );\n```\n\nThe [result of\
    \ this](http://www.smashingmagazine.com/wp-content/uploads/2011/09/growingsinejump.html)\
    \ is a banner that seems to tentatively move up and down. Back in the day and\
    \ on the very slow Commodore 64, calculating the sine wave live was too slow.\
