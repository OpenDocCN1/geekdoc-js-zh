    specialist and is an active member of the jQuery community, posting plugins and
    extensions. He has worked for clients ranging from the London Stock Exchange to
    Durex. You can keep up with him and his projects and creations on his


    ### Christian Heilmann


    An international Developer Evangelist working for Mozilla in the lovely town of
    London, England.


