    UI. It’s a [Google Web Toolkit](http://code.google.com/webtoolkit/) (GWT) framework
    for REST and rapid development. We wanted to show off our framework, so we made
    [SpiffyUI.org](http://www.spiffyui.org/) using GWT.


    GWT is a dynamic framework that puts all of our content in JavaScript. Our index.html
    file looks like this:


    <body>


    <script type="text/javascript" language="javascript"


    src="org.spiffyui.spsample.index.nocache.js"></script>


    </body>


    Everything is added to the page with JavaScript, and we control our content with
    [hash tags](http://en.wikipedia.org/wiki/Hashtag#Hashtags) (I’ll explain why a
    little later). Every time you move to another page in our application, you get
    a new hash tag. Click on the “CSS” link and you’ll end up here:


    http://www.spiffyui.org#css


    The URL in the address bar will look like this in most browsers:


    http://www.spiffyui.org/?css


    We’ve fixed it up with HTML5\. I’ll show you how later in this article.


    This simple hash works well for our application and makes it bookmarkable, but
    it isn’t crawlable. Google doesn’t know what a hash tag means or how to get the
    content from it, but it does provide an alternate method for a website to return
    content. So, we let Google know that our hash is really JavaScript code instead
    of just an anchor on the page by adding an exclamation point (a “bang”), like
    this:


    http://www.spiffyui.org#!css


    This hash bang is the secret sauce in the whole AJAX crawling scheme. When Google
    sees these two characters together, it knows that more content is hidden by JavaScript.
    It gives us a chance to return the full content by making a second request to
    a special URL:


    http://www.spiffyui.org?_escaped_fragment_=css


    The new URL has replaced the #! with ?_escaped_fragment_=. Using a URL parameter
    instead of a hash tag is important, because parameters are sent to the server,
    whereas hash tags are available only to the browser.


    That new URL lets us return the same content in HTML format when Google’s crawler
    requests it. Confused? Let’s look at how it works, step by step.


    ### Snippets Of HTML


    The whole page is rendered in JavaScript. We needed to get that content into HTML
    so that it is accessible to Google. The first step was to separate SpiffyUI.org
    into snippets of HTML.


    Google still thinks of a website as a set of pages, so we needed to serve our
    content that way. This was pretty easy with our application, because we have a
    set of pages, and each one is a separate logical section. The first step was to
    make the pages bookmarkable.


    #### Bookmarking


    Most of the time, JavaScript just changes something within the page: when you
    click that button or pop up that panel, the URL of the page does not change. That’s
    fine for simple pages, but when you’re serving content through JavaScript, you
    want give users unique URLs so that they can bookmark certain areas of your application.


    JavaScript applications can change the URL of the current page, so they usually
    support bookmarking via the addition of hash tags. Hash tags work better than
    any other URL mechanism because they’re not sent to the server; they’re the only
    part of the URL that can be changed without having to refresh the page.


    The hash tag is essentially a value that makes sense in the context of your application.
    Choose a tag that is logical for the area of your application that it represents,
    and add it to the hash like this:


    http://www.spiffyui.org#css


    When a user accesses this URL again, we use JavaScript to read the hash tag and
    send the user to the page that contains the CSS.


    You can choose anything you want for your hash tag, but try to keep it readable,
    because users will be looking at it. We give our hashes tags like css, rest and
    security.


    Because you can name the hash tag anything you want, adding the extra bang for
    Google is easy. Just slide it between the hash and the tag, like this:


    http://www.spiffyui.org#!css


    You can manage all of your hash tags manually, but most JavaScript history frameworks
    will do it for you. All of the plug-ins that support HTML4 use hash tags, and
    many of them have options for making URLs bookmarkable. We use [History.js](https://github.com/balupton/history.js)
    by [Ben Lupton](http://balupton.com/). It’s easy to use, it’s open source, and
    it has excellent support for HTML5 history integration. We’ll talk more about
    that shortly.


    #### Serving Up Snippets


    The hash tag makes an application bookmarkable, and the bang makes it crawlable.
    Now Google can ask for special escaped-fragment URLs like so:


    ![CrawlerServerDiagram-front-page1.jpg](Images/CrawlerServerDiagram-front-page1.jpg)


    When the crawler accesses our ugly URL, we need to return simple HTML. We can’t
    handle that in JavaScript because the crawler doesn’t run JavaScript in the crawler.
    So, it all has to come from the server.


    You can implement your server in PHP, Ruby or any other language, as long as it
    delivers HTML. SpiffyUI.org is a Java application, so we deliver our content with
    a [Java servlet](http://en.wikipedia.org/wiki/Java_Servlet).


    The escaped fragment tells us what to serve, and the servlet gives us a place
    to serve it from. Now we need the actual content.


    Getting the content to serve is tricky. Most applications mix the content in with
    the code; but we don’t want to parse the readable text out of the JavaScript.
    Luckily, Spiffy UI has an HTML-templating mechanism. The templates are embedded
    in the JavaScript but also included on the server. When the escaped fragment looks
    for the ID css, we just have to serve CSSPanel.html.


    The template without any styling looks very plain, but Google just needs the content.
    Users see our page with all of the styles and dynamic features:


    ![specific-styles-500.jpg](Images/specific-styles-500.jpg)


    Google gets only the unstyled version:


    ![google-specific-sytles.jpg](Images/google-specific-sytles.jpg)'
