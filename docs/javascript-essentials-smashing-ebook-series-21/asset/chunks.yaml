  raw: '•What is supported, and how can you extend functionality? A new browser and
    client request is always around the corner?In this article, we’ll show some ways
    to find out more about these issues. First of all, though, understanding what
    it means to develop for the Web is important.


    ### It’s Not About You


    Most of the reasons why we choose a particular solution right away are very much
    about us, and this is where we tread on thin ice. We don’t consume what we put
    on the Web; rather, people we don’t know do, and we can’t make assumptions about
    their ability, set-up, technical understanding or taste. We won’t make our product
    a success; we only build it, and thus we are the worst testers of it possible.


    I’ve been developing for the Web professionally for over 10 years now, working
    on everything from personal blogs to multi-language enterprise CMS solutions to
    complex Web applications, and I’ve learnt one thing on the journey: never build
    for yourself or the client. Instead, build for the people who will use the product
    and the poor person who has to take over the project when you leave.


    Much as we have to act now to minimize our massive carbon footprint, we need to
    leave a cleaner Web behind. To keep the Web a thriving market and sustainable
    work environment, we have to change the way we work in it and leave behind unmaintainable,
    bloated and semi-workable, albeit pretty, solutions. We have to make it easier
    for people to use Web applications and save other developers from wasting hours
    trying to understand what we did when they are asked to change or extend it at
    a later stage.


    ### Introducing The 7-Step Test For JavaScript Widgets


    To this end, I’ve put together a seven-step test to apply to any out-of-the-box
    widget you find. All of the recommendations have a rationale, so please ponder
    it before dismissing the arguments as “elitist” or “not really suitable to our
    environment.”


    Let’s not forget that even when something is free, its developer will try to sell
    it to you for the fame, and many a solution is defended tooth and nail on mailing
    lists instead of being changed or updated. The reason is that, as developers we
    are always on the move. Maintaining and extending an old solution is not as sexy
    as creating a cool new one. This leads to ruins that once enjoyed love when they
    were state of the art but now rust away on the Internet.


    To kick the tires of any out-of-the box solution, I mostly use one tool: the Firefox
    Web developer toolbar. It is available [on the Firefox Add-On website](https://addons.mozilla.org/en-US/firefox/addon/60)
    and gives you an easy way to test what’s happening in your widget of choice.


    Okay, here goes: seven things to test when deciding on a JavaScript solution.


    ### 1\. What Happens If JavaScript Is Turned Off?


    The first test I do with any widget is turn off JavaScript… not after the document
    has loaded but before. Turning off JavaScript with the Web developer toolbar is
    very easy. Simply select “Disable All JavaScript” from the “Disable” menu and
    reload the page:


    ![litmus-disable-javascript.jpg](Images/litmus-disable-javascript.jpg)


    The rationale is that there are a lot of reasons why JavaScript may not be used:
    company proxies or personal firewalls could filter it out, other scripts could
    create errors and mess with yours, or the system in use could simply not have
    JavaScript enabled. Think of mobile environments, for example.


    You don’t need full functionality when JavaScript is not available, just a working
    interface that doesn’t overload users and interactive elements that work. If a
    button does nothing when users activate it, those users will stop trusting you;
    after all, you haven’t kept your promises.


    Overloading is another issue. A lot of widgets use CSS and JavaScript to squeeze
    a lot of content into a very small space: think tabbed content elements and image
    carousels. What should be their fallback? If you turn off JavaScript and have
    50 pictures where you planned for 2, then that would be a good user experience.
    A better fallback would be a server-side solution for the same functionality or
    to show the first 2 and then offer a link to a gallery page with the remaining
    pictures.


    Sometimes the JavaScript for a particular widget is actually very good but the
    demo websites have been done badly. Hiding elements with CSS and then revealing
    them with JavaScript, for example, is very common. But if JavaScript is turned
    off, the solution will break. Good demos and solutions use JavaScript to add a
    class to the body of the document and make all of the CSS dependent on that class.


    The trick that any good JavaScript widget should do is to make any functionality
    depend on JavaScript by using JavaScript; that way, you never have any functionality
    that won’t work. This technique is called “unobtrusive JavaScript,” and I have
    [written a course on it](http://onlinetools.org/articles/unobtrusivejavascript/)
    and [set a few rules for it](http://icant.co.uk/articles/seven-rules-of-unobtrusive-javascript/)
    a while back.


    ### 2\. How To Change The Look, Feel And Content?


    A widget whose look and feel are hard-coded is a pain to maintain. You cannot
    expect future designers to know how to change a certain color by hunting through
    your JavaScript files. This is how we end up with bloated CSS files, because people
    add random IDs and classes to enhance the specificity of their CSS selectors.


    Good widgets have their look and feel contained in a CSS file and give you handles
    (i.e. dynamically applied classes) to apply your own styling. If you find yourself
    having to change JavaScript to change the look and feel, alarm bells should go
    off in your head.


    This gets worse if you have content such as text labels in the JavaScript or if
    only a fixed number of elements can be displayed (as in the case of navigation
    menus). Labels and number of elements are what change the most in any Web product.
    For starters, you will probably roll out your product across different markets
    and will have to translate the buttons and menus.


    Good gadgets have [configuration objects](http://dev.opera.com/articles/view/json-configuration-for-javascript/)
    that allow you to change the number of elements and define the text labels without
    having to change the main JavaScript. The reason for this is that the functional
    part of the widget should be separated from the maintainer. If the widget has
    a security or performance problem, you should be able to replace it without losing
    your configuration and localization work. Otherwise people would be very likely
    to keep insecure code on the Web, which is one of the reasons why our inboxes
    are full of spam.


    ### 3\. How Usable And Semantic Is The Final Product?


    A lot of widget creators are very happy to announce that their products are “Web-standards
    compliant” and accessible because of it. While Web-standards compliance is important,
    it does not indicate the quality or usefulness of the product. One cannot really
    validate semantics with an automated tool. For example, the following examples
    are both valid HTML:


    <div class="menu">


    <div class="section">


    <span class="label">Animals</span>


    <div class="subsection">


    <div class="item">Giraffe</div>


    <div class="item">Donkey</div>


    <div class="item">Cheetah</div>


    <div class="item">Hippo</div>


    </div>


    </div>


    <div class="section">


    <span class="label">Stones</span>


    <div class="subsection">


    <div class="item">Diamond</div>


    <div class="item">Ruby</div>


    <div class="item">Onyx</div>


    </div>


    </div>


    </div>


    <ul class="menu">


    <li><button>Animals</button>


    <ul>


    <li><a href="giraffe.html">Giraffe</a></li>


    <li><a href="donkey.html">Donkey</a></li>


    <li><a href="cheetah.html">Cheetah</a></li>


    <li><a href="hippo.html">Hippo</a></li>


    </ul>


    </li>


    <li><button>Stones</button>


    <ul>


    <li><a href="diamond.html">Diamond</a></li>


    <li><a href="ruby.html">Ruby</a></li>


    <li><a href="onyx.html">Onyx</a></li>


    </ul>


    </li>


    </ul>'
