    \ as well as in CSS transitions and animations in modern browsers.\n\nYou can\
    \ use this the same way, but there is an even simpler option for getting a value\
    \ between 0 and 1 that follows a natural motion.\n\n### Not A Sin, Just A Natural\
    \ Motion\n\n[Sine waves](http://en.wikipedia.org/wiki/Sine_wave) are probably\
    \ the best thing ever for smooth animation. They happen in nature: witness a spring\
    \ with a weight on it, ocean waves, sound and light.\n\nIn our case, we want to\
    \ move from 0 to 1 smoothly.\n\nTo create a movement that goes from 0 to 1 and\
    \ back to 0 smoothly, we can use a sine wave that goes from 0 to `π` in a few\
    \ steps. The full sine wave going from 0 to `π` × `2` (i.e. a whole circle) would\
    \ result in values from -1 to 1, and we don’t want that (yet).\n\n```javascript\n\
    var counter = 0;\n// 100 iterations\nvar increase = Math.PI / 100;\nfor ( i =\
    \ 0; i <= 1; i += 0.01 ) {\nx = i;\ny = Math.sin(counter);\ncounter += increase;\n\
    }\n```\n\n![sine.png](Images/sine.png)\n\nA quick aside on numbers for sine and\
    \ cosine: Both `Math.sin()` and `Math.cos()` take as the parameter an angle that\
    \ should be in [radians](http://en.wikipedia.org/wiki/Radian). As humans, however,\
    \ degrees ranging from 0 to 360 are much easier to read. That’s why you can and\
    \ should convert between them with this simple formula:\n\n```javascript\nvar\
    \ toRadian = Math.PI / 180;\nvar toDegree = 180 / Math.PI;\nvar angle = 30;\n\
    var angleInRadians = angle * toRadian;\nvar angleInDegrees = angleInRadians *\
    \ toDegree;\n```\n\nBack to our sine waves. You can play with this a lot. For\
    \ example, you could use the absolute value of a full 2 × `π` loop:\n\n```javascript\n\
    var counter = 0;\n// 100 iterations\nvar increase = Math.PI * 2 / 100;\nfor (\
    \ i = 0; i <= 1; i += 0.01 ) {\nx = i;\ny = Math.abs( Math.sin( counter ) );\n\
    counter += increase;\n}\n```\n\n![msine.png](Images/msine.png)\n\nBut again, this\
    \ looks dirty. If you want the full up and down, without a break in the middle,\
    \ then you need to shift the values. You have to half the sine and then add 0.5\
    \ to it:\n\n```javascript\nvar counter = 0;\n// 100 iterations\nvar increase =\
    \ Math.PI * 2 / 100;\nfor ( i = 0; i <= 1; i += 0.01 ) {\nx = i;\ny = Math.sin(\
    \ counter ) / 2 + 0.5;\ncounter += increase;\n}\n```\n\n![shiftingup.png](Images/shiftingup.png)\n\
    \nSo, how can you use this? Having a function that returns -1 to 1 to whatever\
    \ you feed it can be very cool. All you need to do is multiply it by the values\
    \ that you want and add an offset to avoid negative numbers.\n\nFor example, check\
    \ out [this sine movement demo](http://www.smashingmagazine.com/wp-content/uploads/2011/09/sinejump.html):\n\
    \n![sinejump.png](Images/sinejump.png)\n\nLooks neat, doesn’t it? A lot of the\
    \ trickery is already in the CSS:\n\n```css\n.stage {\nwidth:200px;\nheight:200px;\n\
    margin:2em;\nposition:relative;\nbackground:#6cf;\noverflow:hidden;\n}\n.stage\
    \ div {\nline-height:40px;\nwidth:100%;\ntext-align:center;\nbackground:#369;\n\
    color:#fff;\nfont-weight:bold;\nposition:absolute;\n}\n```\n\nThe stage element\
    \ has a fixed dimension and is positioned relative. This means that everything\
    \ that is positioned absolutely inside it will be relative to the element itself.\n\
    \nThe div inside the stage is 40 pixels high and positioned absolutely. Now, all\
    \ we need to do is move the div with JavaScript in a sine wave:\n\n```javascript\n\
