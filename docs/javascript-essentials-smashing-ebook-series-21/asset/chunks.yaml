    /* functionality starts here */


    $(''body'').addClass(config.javascriptenabled);


    var current = null;


    $(''h2'').click(function(e){


    if(current){


    current.removeClass(config.currentsection);


    }


    current = $(this).next().addClass(config.currentsection);


    })


    });


    For more information on configuration objects and why they rock for maintenance,
    check out the blog post “[Providing Script Configuration Inline and Programatically](http://www.wait-till-i.com/2008/05/23/script-configuration/)“.


    In summary, go over your code once more when you think you’ve finished with it
    and the next person is about to take it over.


    ### Sin #6: Not Documenting Your Code


    “Good code documents itself” is a terribly common and misguided belief. In my
    years as a developer, I’ve found that my style of coding has changed constantly.
    What was common knowledge and best practice in 2004 might be forgotten or even
    considered poor style these days.


    Documenting all of the tricks and workarounds we do to make our code work in different
    browsers is definitely a good idea. This allows future maintainers to remove them
    when the targeted browser version becomes obsolete or a library function fixes
    the issue.


    Commenting your code also allows the maintainer to trace it back to you should
    they need some piece of information, and it allows people who have stumbled across
    your script to include it in a larger solution or library (which has happened
    to me). Because JavaScripts tend replicate on the Web (in all of those blogs and
    “script collections”), it is also a way to make your name known.


    Don’t go overboard with commenting, though. Obvious things don’t need to be spelled
    out. I have found the following situations worthy of comment:


    •Necessary hacks Browser hacks; content clean-up; things that should be supported
    server-side but are not yet.


    •Sections that are likely to change Timely solutions; IDs, classes and strings
    (as explained earlier).


    •Start of classes and reusable functions With name, author, version, date and
    license.


    •Third-party code Give credit where credit is due.


    •Sections with dependencies Some comment like, “Needs the Google API with an own
    key—this one will not work on your server.”


    In short, comment on anything that deviates from the normal flow of coding. I
    tend to use /* */ instead of // because it won’t create a bug if people remove
    the line break by accident.


    #### Special Case: Commenting Out Code


    One special case is commenting out sections that will be necessary in future releases
    or that depend on functionality not currently available. This can be amazingly
    useful but also a security risk, depending on what you’re commenting out. For
    example, don’t leave in any code that points to server-side APIs that are not
    available yet but could at any time be half-implemented. I’ve seen this before,
    where administrator links with the full unprotected path were commented out in
    the HTML.


    Still, commenting out can be very useful for debugging. One neat trick is the
    following:


    /*


    myFunction(''do something'');


    // */


    This is now commented out. But by adding a single slash in front of the first
    comment line, you will uncomment the whole block and make it live.


    //*


    myFunction(''do something'');


    // */


    This trick makes it awfully easy to toggle whole blocks.


    ### Sin #7: Optimizing For Machines, Not People


    The last sin is over-optimizing JavaScript based on the scads of information about
    performance that are available to us. You will find a lot of information on the
    Web about optimizing JavaScript for performance in the current browser environment.
    Notice that “current browser environment”—much information is browser- and version-specific
    and a necessary evil for now, but not necessarily in future. If your application
    is large or your website is high traffic, knowing and applying this information
    could make or break it. Again, though, a lot of this applies to edge cases that
    would have little impact on small projects and environments. This optimization
    does make it harder to maintain the code; some of the things we need to do to
    make browsers run fast on high-scale websites, such as writing out script nodes
    with document.write(), are downright nasty.


    When faced with the choice between making code cleaner and easier to amend, extend
    and understand on the one hand, and shaving two milliseconds off every page load
    on the other, I opt for the former. A lot of JavaScript optimization can be done
    through scripts. And rather than teach all developers on a project the ins and
    outs of JavaScript performance, an expert team (or even a tool) could optimize
    the code before it goes live.


    If you can do anything with machines to make the jobs of other machines easier,
    do it. The time has come for us to apply build processes as much to front-end
    code as we do to back-end code, instead of forcing ourselves to follow coding
    practices that go against the natural flow of writing code.


    # A Quick Look Into The Math Of Animations With JavaScript


    Christian Heilmann


    In school, I hated math. It was a dire, dry and boring thing with stuffy old books
    and very theoretical problems. Even worse, a lot of the tasks were repetitive,
    with a simple logical change in every iteration (dividing numbers by hand, differentials,
    etc.). It was exactly the reason why we invented computers. Suffice it to say,
    a lot of my math homework was actually done by my trusty Commodore 64 and some
    lines of Basic, with me just copying the results later on.


    These tools and the few geometry lessons I had gave me the time and inspiration
    to make math interesting for myself. I did this first and foremost by creating
    visual effects that followed mathematical rules in demos, intros and other seemingly
    pointless things.


    There is a lot of math in the visual things we do, even if we don’t realize it.
    If you want to make something look natural and move naturally, you need to add
    a bit of physics and rounding to it. Nature doesn’t work in right angles or linear
    acceleration. This is why zombies in movies are so creepy. This was [covered here
    before in relation to CSS animation](http://coding.smashingmagazine.com/2011/09/14/the-guide-to-css-animation-principles-and-examples/),
    but today let’s go a bit deeper and look at the simple math behind the smooth
    looks.


    ### Going From 0 To 1 Without Being Boring


    If you’ve just started programming and are asked to go from 0 to 1 with a few
    steps in between, you would probably go for a for loop:


    for ( i = 0; i <= 1; i += 0.1 ) {


    x = i;


    y = i;


    …


    }


    This would result in a line on a graph that is 45 degrees. Nothing in nature moves
    with this precision:


    ![forloop.png](Images/forloop.png)


    A simple way to make this movement a bit more natural would be to simply multiply
    the value by itself:


    for ( i = 0; i <= 1; i += 0.1 ) {


    x = i;


    y = i * i;


    }


    This means that 0.1 is 0.01, 0.2 is 0.04, 0.3 is 0.09, 0.4 is 0.16, 0.5 is 0.25
    and so on. The result is a curve that starts flat and then gets steeper towards
    the end:


    ![multiply.png](Images/multiply.png)


    You can make this even more pronounced by continuing to multiply or by using the
    “to the power of” Math.pow() function:'
