    x = i;


    y = Math.pow( i, 4 );


    }


    ![powerto.png](Images/powerto.png)


    This is one of the tricks of the easing functions used in libraries such as jQuery
    and YUI, as well as in CSS transitions and animations in modern browsers.


    You can use this the same way, but there is an even simpler option for getting
    a value between 0 and 1 that follows a natural motion.


    ### Not A Sin, Just A Natural Motion


    [Sine waves](http://en.wikipedia.org/wiki/Sine_wave) are probably the best thing
    ever for smooth animation. They happen in nature: witness a spring with a weight
    on it, ocean waves, sound and light.


    In our case, we want to move from 0 to 1 smoothly.


    To create a movement that goes from 0 to 1 and back to 0 smoothly, we can use
    a sine wave that goes from 0 to π in a few steps. The full sine wave going from
    0 to π × 2 (i.e. a whole circle) would result in values from -1 to 1, and we don’t
    want that (yet).


    var counter = 0;


    // 100 iterations


    var increase = Math.PI / 100;


    for ( i = 0; i <= 1; i += 0.01 ) {


    x = i;


    y = Math.sin(counter);


    counter += increase;


    }


    ![sine.png](Images/sine.png)


    A quick aside on numbers for sine and cosine: Both Math.sin() and Math.cos() take
    as the parameter an angle that should be in [radians](http://en.wikipedia.org/wiki/Radian).
    As humans, however, degrees ranging from 0 to 360 are much easier to read. That’s
    why you can and should convert between them with this simple formula:


    var toRadian = Math.PI / 180;


    var toDegree = 180 / Math.PI;


    var angle = 30;


    var angleInRadians = angle * toRadian;


    var angleInDegrees = angleInRadians * toDegree;


    Back to our sine waves. You can play with this a lot. For example, you could use
    the absolute value of a full 2 × π loop:


    var counter = 0;


    // 100 iterations


    var increase = Math.PI * 2 / 100;


    for ( i = 0; i <= 1; i += 0.01 ) {


    x = i;


    y = Math.abs( Math.sin( counter ) );


    counter += increase;


    }


    ![msine.png](Images/msine.png)


    But again, this looks dirty. If you want the full up and down, without a break
    in the middle, then you need to shift the values. You have to half the sine and
    then add 0.5 to it:


    var counter = 0;


    // 100 iterations


    var increase = Math.PI * 2 / 100;


    for ( i = 0; i <= 1; i += 0.01 ) {


    x = i;


    y = Math.sin( counter ) / 2 + 0.5;


    counter += increase;


    }


    ![shiftingup.png](Images/shiftingup.png)


    So, how can you use this? Having a function that returns -1 to 1 to whatever you
    feed it can be very cool. All you need to do is multiply it by the values that
    you want and add an offset to avoid negative numbers.


    For example, check out [this sine movement demo](http://www.smashingmagazine.com/wp-content/uploads/2011/09/sinejump.html):


    ![sinejump.png](Images/sinejump.png)


    Looks neat, doesn’t it? A lot of the trickery is already in the CSS:


    .stage {


    width:200px;


    height:200px;


    margin:2em;


    position:relative;


    background:#6cf;


    overflow:hidden;


    }


    .stage div {


    line-height:40px;


    width:100%;


    text-align:center;


    background:#369;


    color:#fff;


    font-weight:bold;


    position:absolute;


    }


    The stage element has a fixed dimension and is positioned relative. This means
    that everything that is positioned absolutely inside it will be relative to the
    element itself.


    The div inside the stage is 40 pixels high and positioned absolutely. Now, all
    we need to do is move the div with JavaScript in a sine wave:


    var banner = document.querySelector( ''.stage div'' ),


    start = 0;


    function sine(){


    banner.style.top = 50 * Math.sin( start ) + 80 + ''px'';


    start += 0.05;


    }


    window.setInterval( sine, 1000/30 );


    The start value changes constantly, and with Math.sin() we get a nice wave movement.
    We multiply this by 50 to get a wider wave, and we add 80 pixels to center it
    in the stage element. Yes, the element is 200 pixels high and 100 is half of that,
    but because the banner is 40 pixels high, we need to subtract half of that to
    center it.


    Right now, this is a simple up-and-down movement. Nothing stops you, though, from
    making it more interesting. The multiplying factor of 50, for example, could be
    a sine wave itself with a different value:


    var banner = document.querySelector( ''.stage div'' ),


    start = 0,


    multiplier = 0;


    function sine(){


    multiplier = 50 * Math.sin( start * 2 );


    banner.style.top = multiplier * Math.sin( start ) + 80 + ''px'';


    start += 0.05;


    }


    window.setInterval( sine, 1000/30 );


    The [result of this](http://www.smashingmagazine.com/wp-content/uploads/2011/09/growingsinejump.html)
    is a banner that seems to tentatively move up and down. Back in the day and on
    the very slow Commodore 64, calculating the sine wave live was too slow. Instead,
    we had tools to generate sine tables (arrays, if you will), and we plotted those
    directly. One of the tools for creating great sine waves so that you could have
    bouncing scroll texts was the Wix Bouncer:


    ![wixbouncer.png](Images/wixbouncer.png)


    ### Circles In The Sand, Round And Round…


    Circular motion is a thing of beauty. It pleases the eye, reminds us of spinning
    wheels and the earth we stand on, and in general has a “this is not computer stuff”
    feel to it. The math of plotting something on a circle is not hard.


    It goes back to [Pythagoras](http://en.wikipedia.org/wiki/Pythagoras), who, as
    rumor has it, drew a lot of circles in the sand until he found his famous [theorem](http://en.wikipedia.org/wiki/Pythagorean_theorem).
    If you want to use all the good stuff that comes from this theorem, then try to
    find a triangle with a right angle. If this triangle’s hypothenuse is 1, then
    you can easily calculate the horizontal leg as the cosine of the angle and the
    vertical leg as the sine of the angle:


    ![sincos.png](Images/sincos.png)


    How is this relevant to a circle? Well, it is pretty simple to find a right-angle
    triangle in a circle to every point of it:


    ![circle.png](Images/circle.png)


    This means that if you want to plot something on a circle (or draw one), you can
    do it with a loop and sine and cosine. A full circle is 360°, or 2 × π in radians.
    We could have a go at it — but first, some plotting code needs to be done.


    ### A Quick DOM Plotting Routine


    Normally, my weapon of choice here would be canvas, but in order to play nice
    with older browsers, let’s do it in plain DOM. The following helper function adds
    div elements to a stage element and allows us to position them, change their dimensions,
    set their color, change their content and rotate them without having to go through
    the annoying style settings on DOM elements.


    Plot = function ( stage ) {


    this.setDimensions = function( x, y ) {


    this.elm.style.width = x + ''px'';


    this.elm.style.height = y + ''px'';


    this.width = x;


    this.height = y;


    }


    this.position = function( x, y ) {


    var xoffset = arguments[2] ? 0 : this.width / 2;


    var yoffset = arguments[2] ? 0 : this.height / 2;


    this.elm.style.left = (x - xoffset) + ''px'';


    this.elm.style.top = (y - yoffset) + ''px'';


    this.x = x;


    this.y = y;


    };


    this.setbackground = function( col ) {


    this.elm.style.background = col;


    }


    this.kill = function() {


    stage.removeChild( this.elm );


    }


    this.rotate = function( str ) {


    this.elm.style.webkitTransform = this.elm.style.MozTransform =


    this.elm.style.OTransform = this.elm.style.transform =


    ''rotate(''+str+'')'';


    }


    this.content = function( content ) {


    this.elm.innerHTML = content;


    }


    this.round = function( round ) {


    this.elm.style.borderRadius = round ? ''50%/50%'' : '''';


    }


    this.elm = document.createElement( ''div'' );


    this.elm.style.position = ''absolute'';


    stage.appendChild( this.elm );


    };'
