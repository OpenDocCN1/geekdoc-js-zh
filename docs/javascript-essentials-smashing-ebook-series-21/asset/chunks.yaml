    He is also a member of the jQuery [Bug Triage/Docs/Front-end] teams where he assists
    with bugs, documentation and community updates. Most recently he''s been nominated
    for the [.net ''Brilliant Newcomer'' award](http://www.thenetawards.com/#num12).


