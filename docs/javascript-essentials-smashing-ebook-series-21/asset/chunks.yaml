    ## 何时依赖 JavaScript 是可以的（在某种程度上）


    对 JavaScript 依赖项的许多误解源于人们根据自己所的工作环境发表一概而论的观点。


    如果你是一名负责 `Gmail` 开发的 Google 工程师，你很难想象自己为什么要费精力在不使用 JavaScript 的情况下工作。对于开发 `OpenSocial`
    插件、移动应用、Apple 插件以及 Adobe Air 的开发者来说也是如此。换句话说，如果你的环境已经依赖于 JavaScript，那么请务必不要浪费精力去做回退（fallback）方案。


    但不要将这些闭源环境和边缘案例应用作为我们衡量 JavaScript 的标准。JavaScript 最大的力量也是最大的问题在于它的多功能性。说所有网站都可以脱离
    JavaScript 是因为 `Gmail` 需要它，就像说所有汽车都应该有启动按钮，因为它们在混合动力汽车上表现良好；或者说混合动力汽车应该配备巨大的油箱和防撞杠，因为它们在悍马车上表现优异。产品的技术功能集取决于它的实现方式和目标市场。不同的应用有不同的基础功能需要满足，以便触及最大的受众，而不将人们排除在外。


