  trans: "\n因此，虽然为特定浏览器构建软件的做法正在减少（至少对于 JavaScript 来说——至于 CSS，我们还有另一堆麻烦要处理），但我们仍然必须警惕某些“罪过”。\n\
    \n### 罪过一：与其他脚本不相处\n\n这是第一个罪过，我们在 Web 上仍然常见。遗憾的是，这在 API 和 Web 服务的演示代码中非常常见：全局变量、函数和\
    \ DOM-1 事件处理器。\n\n我指这些是什么意思？请考虑以下几：\n\n• HTML 文档中的每个脚本都与其他脚本具有相同的权限，在需要时，它可以覆盖其他脚本之前执行的内容。\n\
    \n• 如果你定义了一个变量或函数名，而其他包含文件使用了相同的名称，那么初始的定义会被覆盖。\n\n• 如果使用旧式的 `onEvent` 方式绑定事件处理器，这种情况对事件处理器同样适用。\n\
    \n假设你有一个脚本 `script_one.js`：\n\n```javascript\nx = 5;\n\nfunction init(){\n  alert('script\
    \ one init');\n  document.getElementsByTagName('h1')[0].onclick = function(){\
    \ own    this.style.background = 'blue';\n  }\n}\n\nalert('x is '+x);\nwindow.onload\
    \ = init;\n```\n\n紧随其后，你包含了另一个脚本 `script_two.js`：\n\n```javascript\nx = 10;\n\n\
    function init(){\n  alert('script two init');\n  document.getElementsByTagName('h1')[0].onclick\
    \ = function(){\n    this.style.color = 'white';\n  }\n}\n\nalert('x is '+x);\n\
    window.onload = init;\n```\n\n如果你[在浏览器中打开此文档](http://icant.co.uk/articles/sins/sins_globals.html)，你会发现\
    \ `x` 从 5 变成了 10，且第一个 `init()` 永远没有被调用。script two init 的 `alert()` 没有弹出，当你点击 `h1`\
    \ 时，背景也没有变成蓝色。只有文字变成了白色，这导致它变得不可见。\n\n解决方案不是使用 `onEvent` 处理器，而是使用正确的 DOM 2 级事件处理器（它们在\
    \ IE 中不起作用，但我们现在不必担心这个——记住，这正是库的用武）。此外，将你的函数封装在另一个具有更独特名称函数中，以防止它们互相覆盖。\n\n```javascript\n\
    var scriptOne = function(){\n  var x = 5;\n  function init(){\n    alert('script\
    \ one init');\n    document.getElementsByTagName('h1')[0].addEventListener(\n\
    \      'click',\n      function(e){\n        var t = e.target;\n        t.style.background\
    \ = 'blue';\n      },\n      false\n    );\n  }\n  alert('x inside is '+x);\n\
    \  return {init:init};\n}();\n\nwindow.addEventListener('load',scriptOne.init,false);\n\
    alert('x outside is '+x);\n\nvar scriptTwo = function(){\n  var x = 10;\n  function\
    \ init(){\n    alert('script two init');\n    document.getElementsByTagName('h1')[0].addEventListener(\n\
    \      'click',\n      function(e){\n        var t = e.target;\n        t.style.color\
    \ = 'white';\n      },\n      false\n    );\n  }\n  alert('x inside is '+x);\n\
    \  return {init:init};\n}();\n\nwindow.addEventListener('load',scriptTwo.init,false);\n\
    alert('x outside is '+x);\n```\n\n如果你[在浏览器中运行（不是 Internet Explorer 6）](http://icant.co.uk/articles/sins/sins_globals_fixed.html)，一切将如你预期那样出现：`x`\
    \ 先是 5，然后内部是 10，标题在你点击时变为蓝色和白色。两个 `init()` 函数都被调用了。\n\n你得到了一个错误。因为 `x` 在函数外部没有定义，`alert('x\
    \ outside is '+x);` 永远不起作用。\n\n原因是通过将 `x` 移动到 `scriptOne` 和 `scriptTwo` 函数并在它们前面添加\
    \ `var` 关键字，我们使其成为这些函数的一部分，但对外部世界隐藏了它们。这被称为闭包，[在此处有详细解释](https://developer.mozilla.org/en/Core_JavaScript_1.5_Guide/Working_with_Closures)。它可能是\
    \ JavaScript 最强大的功能之一。\n\n使用闭包和 `var` 关键字，你就不会遇到同名变量互相覆盖的问题。这在 jQuery 中也适用：你应该[为你的函数命名空间](http://jquery-howto.blogspot.com/2009/01/namespace-your-javascript-function-and.html)。\n\
    \n这可能很难理解，所以让我们来看一个简单的例子：\n\n```javascript\nvar x = 4;\nvar f = 3;\nvar me = 'Chris';\n\
    function init(){}\nfunction load(){}\n```\n\n现在这些都是全局变量和函数。任何其他具有相同变量的脚本都会覆盖它们。\n\
    \n你可以将它们嵌套在一个对象中以避免这种情况：\n\n```javascript\nvar longerAndMoreDistinct = {\n  x\
    \ : 4,\n  f : 3,\n  me : 'Chris',\n  init : function(){},\n  load : function(){}\n\
    }\n```\n\n这样，只有 `longerAndMoreDistinct` 是全局的。如果你想运行这个函数，你现在必须调用 `longerAndMoreDistinct.init()`\
    \ 而不是 `init()`。你可以通过 `longerAndMoreDistinct.me` 等访问 `me`。我不喜欢这样，因为我必须在不同的符号之间切换。所以，我们可以这样做：\n\
    \n```javascript\nvar longerAndMoreDistinct = function(){\n  var x = 4;\n  var\
    \ f = 3;\n  var me = 'Chris';\n  function init(){}\n  function load(){}\n}();\n\
    ```\n\n你定义了 `longerAndMoreDistinct`。\n\n### 罪过二：相信而非测试\n\n与 JavaScript 实现相关的另一个大罪过是期望一切顺利：每个参数的格式正确，你尝试增强的每个\
    \ HTML 元素确实可用，每个终端用户输入信息的格式正确。这种情况永远不会发生，而最后那个假设特别为糟糕，因为它允许恶意用户注入危险代码。\n\n当你编写\
    \ JavaScript 并将其交付世界，或者将其集成到由第三方维护的产品中时，一点偏执是好事。\n\n`typeof` 是你的朋友。正则表达式是你的朋友。`indexOf()`、`split()`\
    \ 和 `length` 都是你的朋友。\n"
- fmt: "\n# Sin #3: Using The Wrong Technology For The Job\n\nThe biggest problem\
    \ with JavaScript happens when you use the wrong tool for the job. It makes maintenance\
    \ a nightmare and deteriorates the code’s quality. Use tools for the jobs they\
    \ were meant for. This means:\n\n* Absolutely essential content and mark-up should\
    \ be in `HTML`, regardless of the environment it will be displayed in.\n* Any\
    \ “look and feel” elements should be maintainable through `CSS`. You should not\
    \ have to scour through `JavaScript` to change a color.\n* Any interaction with\
    \ the user that goes beyond hover effects (which, by definition, are an invitation\
    \ to interact and not the interaction itself—because they are inaccessible to\
    \ keyboard users) should be done with `JavaScript`.\n\nThe main reason why this\
    \ is still a valid, pragmatic and sensible approach to development is that as\
    \ Web technologies get muddled (for example, you can create content with `CSS`\
    \ and `JavaScript`, animate and transform in `CSS` and—if you really want—paint\
    \ with `HTML`), people’s skills and interests in these different technologies\
    \ vary quite a bit.\n\nSemantic mark-up buffs are not much interested in applying\
    \ closures in `JavaScript`. `JavaScript` developers are not much interested in\
    \ the order of elements in `CSS`. And `CSS` fans aren’t keen to learn how to make\
    \ a `JavaScript` animation run flicker-free.\n\nThis results in the same problems\
    \ being solved over and over again, only with different technologies. This is\
    \ a market-wide problem: a lot of state-of-the-art `Canvas` tricks were done in\
    \ `Flash` years ago, their impact debated and their problems fixed.\n\nMy favorite\
    \ instance of this is when people write loops to hide a lot of elements on the\
    \ page to make them available later on.\n\nSay this is your `HTML`:\n\n```html\n\
    <h2>Section 1</h2>\n<div class=\"section\">\n<p>Section 1 content</p>\n</div>\n\
    <h2>Section 2</h2>\n<div class=\"section\">\n<p>Section 2 content</p>\n</div>\n\
    <h2>Section 3</h2>\n<div class=\"section\">\n<p>Section 3 content</p>\n</div>\n\
    <h2>Section 4</h2>\n<div class=\"section\">\n<p>Section 4 content</p>\n</div>\n\
    ```\n\nThe [normal jQuery solution for this](http://icant.co.uk/articles/sins/sins_sectiondemo.html)\
    \ would be:\n\n```javascript\n$(document).ready(function(){\n  $('.section').hide();\n\
    \  $('h2').click(function(e){\n    $(this).next().toggle();\n  })\n});\n```\n\n\
    And then you realize that [making the style of the current section deviate](http://icant.co.uk/articles/sins/sins_section_with_current.html)\
    \ from that of the other sections would be great. \n\n```javascript\n$(document).ready(function(){\n\
    \  $('.section').hide();\n  $('h2').click(function(e){\n    $(this).next().toggle();\n\
    \    $(this).next().css('background','#ccc');\n    $(this).next().css('border','1px\
    \ solid #999');\n    $(this).next().css('padding','5px');\n  })\n});\n```\n\n\
    A few things are wrong with this. For starters, you’ve made it hard to maintain\
    \ this by controlling the look and feel in `JavaScript`, not `CSS` (more on this\
    \ later). Secondly, performance: while `jQuery` is amazingly speedy, a lot of\
    \ code is still hidden under the hood in `$('.section').hide()`. The last, and\
    \ very painful, performance issue is the copied and pasted lines that set the\
    \ `CSS`. Don’t ask `jQuery` to find the next sibling four times and do something\
    \ to it. You could store the `next()` in a variable, but even that is not needed\
    \ if you chain. If you really need to set a lot of `CSS` in `jQuery`, use a map:\n\
    \n```javascript\n$(document).ready(function(){\n  $('.section').hide();\n  $('h2').click(function(e){\n\
    \    $(this).next().toggle().css({\n      'background':'#ffc',\n      'border':'1px\
    \ solid #999',\n      'padding':'5px'\n    });\n  })\n});\n```\n\nWhat if you\
    \ then want to [allow only one of them to be open](http://icant.co.uk/articles/sins/sins_section_single_open.html)\
    \ at any time? Inexperienced developers would do something like this:\n\n```javascript\n\
    $(document).ready(function(){\n  $('.section').hide();\n  $('h2').click(function(e){\n\
    \    $('.section').hide();\n    $(this).next().toggle().css({\n      'background':'#ffc',\n\
    \      'border':'1px solid #999',\n      'padding':'5px'\n    });\n  })\n});\n\
    ```\n\nThis does the job, but you’re looping around the document and accessing\
    \ the DOM a lot, which is slow. You can alleviate this by keeping the current\
    \ open section in a variable:\n\n```javascript\n$(document).ready(function(){\n\
    \  var current = false;\n  $('.section').hide();\n  $('h2').click(function(e){\n\
    \    if(current){\n      current.hide();\n    }\n    current = $(this).next();\n\
    \    current.toggle().css({\n      'background':'#ffc',\n      'border':'1px solid\
    \ #999',\n      'padding':'5px'\n    });\n  })\n});\n```\n\nPredefine the current\
    \ section as `false`, and set it when you click the first heading. You would then\
    \ hide `current` only if it is `true`, thereby removing the need for another loop\
    \ through all elements that have the class `section`.\n\nBut here is the interesting\
    \ thing: if all you want is to show and hide sections, you don’t need any looping\
    \ at all! `CSS` already goes through the document when it renders and applies\
    \ classes. You just need to [give it something to hang on](http://icant.co.uk/articles/sins/sins_section_with_current.html),\
    \ such as a class:\n\n```javascript\n$(document).ready(function(){\n  $('body').addClass('js');\n\
    \  var current = null;\n  $('h2').click(function(e){\n    if(current){\n     \
    \ current.removeClass('current');\n    }\n    current = $(this).next().addClass('current');\n\
    \  })\n});\n```\n\nBy adding the class `js` to the body and toggling the `current`,\
    \ the beauty of this is that the handle will be re-usable by the designer:\n\n\
    ```css\n<style type=\"text/css\" media=\"screen\">\n.section {\n  border:1px solid\
    \ #999;\n  background:#ccc;\n}\n.js .section {\n  display:none;\n}\n.js .current\
    \ {\n  display:block;\n  border:1px solid #999;\n  background:#ffc;\n}\n</style>\n\
    ```\n\n# Sin #4: Depending On JavaScript\n\nThere is quite a discussion about\
    \ the need to consider non-JavaScript environments in this day and age, but here\
    \ is a fact: `JavaScript` can be turned off, and any `JavaScript` could break\
    \ the page. Given theakiness of code out there that may be running alongside yours\
    \ and the instability of mobile connections, I for one want to build one thing:\
    \ code that works.\n\nSo, making sure that the most basic usage of your product\
    \ does not depend on `JavaScript` is not just nice to have but essential if you\
    \ expect people to actually use.\n\nAbsolutely nothing is wrong with using `JavaScript`\
    \ heavily. On the contrary, it makes the Web much smoother and saves us a lot\
    \ of time if done right. But you should never promise functionality that doesn’t\
    \ work. And if you rely on `JavaScript`, this is exactly what you’re doing. I’ve\
    \ already covered the effects of bad `JavaScript` in detail in the [AJAX](http://www.smashingmagazine.com/2010/02/some-things-you-should-know-about-ajax/),\
    \ [JavaScript testing](https://www.smashingmagazine.com/2010/01/21/find-the-right-javascript-solution-with-a-7-step-test/)\
    \ and [security](https://www.smashingmagazine.com/2010/01/14/web-security-primer-are-you-part-of-the-problem/)\
    \ articles here on Smashing Magazine, but once again here are some simple steps\
    \ you can take to make sure you don’t break your promise to end users:\n\n* Anything\
    \ vital to the functionality of your product should not require `JavaScript`.\
    \ Forms, links and server-side validation and redirect scripts are your friends.\n\
    * If something depends on `JavaScript`, build it with `JavaScript` and add it\
    \ to the document using the `DOM` or the equivalent method in your library of\
    \ choice.\n* If you add `JavaScript` functionality, make sure it works with the\
    \ keyboard and mouse. `click` and `submit` handlers are bullet-proof, whereas\
    \ `key` and `mouse` events are flaky and don’t work on mobile devices.\n"
  raw: '### Sin #3: Using The Wrong Technology For The Job


    The biggest problem with JavaScript happens when you use the wrong tool for the
    job. It makes maintenance a nightmare and deteriorates the code’s quality. Use
    tools for the jobs they were meant for. This means:


    •Absolutely essential content and mark-up should be in HTML, regardless of the
    environment it will be displayed in.


    •Any “look and feel” elements should be maintainable through CSS. You should not
    have to scour through JavaScript to change a color.


    •Any interaction with the user that goes beyond hover effects (which, by definition,
    are an invitation to interact and not the interaction itself—because they are
    inaccessible to keyboard users) should be done with JavaScript.


    The main reason why this is still a valid, pragmatic and sensible approach to
    development is that as Web technologies get muddled (for example, you can create
    content with CSS and JavaScript, animate and transform in CSS and—if you really
    want—paint with HTML), people’s skills and interests in these different technologies
    vary quite a bit.


    Semantic mark-up buffs are not much interested in applying closures in JavaScript.
    JavaScript developers are not much interested in the order of elements in CSS.
    And CSS fans aren’t keen to learn how to make a JavaScript animation run flicker-free.


    This results in the same problems being solved over and over again, only with
    different technologies. This is a market-wide problem: a lot of state-of-the-art
    Canvas tricks were done in Flash years ago, their impact debated and their problems
    fixed.


    My favorite instance of this is when people write loops to hide a lot of elements
    on the page to make them available later on.


    Say this is your HTML:


    <h2>Section 1</h2>


    <div class="section">


    <p>Section 1 content</p>


    </div>


    <h2>Section 2</h2>


    <div class="section">


    <p>Section 2 content</p>


    </div>


    <h2>Section 3</h2>


    <div class="section">


    <p>Section 3 content</p>


    </div>


    <h2>Section 4</h2>


    <div class="section">


    <p>Section 4 content</p>


    </div>


    The [normal jQuery solution for this](http://icant.co.uk/articles/sins/sins_sectiondemo.html)
    would be:


    $(document).ready(function(){


    $(''.section'').hide();


    $(''h2'').click(function(e){


    $(this).next().toggle();


    })


    });


    And then you realize that [making the style of the current section deviate](http://icant.co.uk/articles/sins/sins_section_with_current.html)
    from that of the other sections would be great.


    $(document).ready(function(){


    $(''.section'').hide();


    $(''h2'').click(function(e){


    $(this).next().toggle();


    $(this).next().css(''background'',''#ccc'');


    $(this).next().css(''border'',''1px solid #999'');


    $(this).next().css(''padding'',''5px'');


    })


    });


    A few things are wrong with this. For starters, you’ve made it hard to maintain
    this by controlling the look and feel in JavaScript, not CSS (more on this later).
    Secondly, performance: while jQuery is amazingly speedy, a lot of code is still
    hidden under the hood in $(''.section'').hide(). The last, and very painful, performance
    issue is the copied and pasted lines that set the CSS. Don’t ask jQuery to find
    the next sibling four times and do something to it. You could store the next()
    in a variable, but even that is not needed if you chain. If you really need to
    set a lot of CSS in jQuery, use a map:


    $(document).ready(function(){


    $(''.section'').hide();


    $(''h2'').click(function(e){


    $(this).next().toggle().css({


    ''background'':''#ffc'',


    ''border'':''1px solid #999'',


    ''padding'':''5px''


    });


    })


    });


    What if you then want to [allow only one of them to be open](http://icant.co.uk/articles/sins/sins_section_single_open.html)
    at any time? Inexperienced developers would do something like this:


    $(document).ready(function(){


    $(''.section'').hide();


    $(''h2'').click(function(e){


    $(''.section'').hide();


    $(this).next().toggle().css({


    ''background'':''#ffc'',


    ''border'':''1px solid #999'',


    ''padding'':''5px''


    });


    })


    });


    This does the job, but you’re looping around the document and accessing the DOM
    a lot, which is slow. You can alleviate this by keeping the current open section
    in a variable:


    $(document).ready(function(){


    var current = false;


    $(''.section'').hide();


    $(''h2'').click(function(e){


    if(current){


    current.hide();


    }


    current = $(this).next();


    current.toggle().css({


    ''background'':''#ffc'',


    ''border'':''1px solid #999'',


    ''padding'':''5px''


    });


    })


    });


    Predefine the current section as false, and set it when you click the first heading.
    You would then hide current only if it is true, thereby removing the need for
    another loop through all elements that have the class section.


    But here is the interesting thing: if all you want is to show and hide sections,
    you don’t need any looping at all! CSS already goes through the document when
    it renders and applies classes. You just need to [give the CSS engine something
    to hang on to](http://icant.co.uk/articles/sins/sins_section_class_handle.html),
    such as a class for the body:


    $(document).ready(function(){


    $(''body'').addClass(''js'');


    var current = null;


    $(''h2'').click(function(e){


    if(current){


    current.removeClass(''current'');


    }


    current = $(this).next().addClass(''current'');


    })


    });


    By adding the class js to the body of the document and toggling the class current
    for the current section, you maintain control of the look and feel in CSS:


    <style type="text/css" media="screen">


    .section{


    border:1px solid #999;


    background:#ccc;


    }


    .js .section{


    display:none;


    }


    .js .current{


    display:block;


    border:1px solid #999;


    background:#ffc;


    }


    </style>


    The beauty of this is that the handle will be re-usable by the CSS designer and
    maintainer. Anything without the .js selector would be the non-scripting-enabled
    version of a part of the document, and anything with the .js selector is applied
    only when JavaScript is available. And yes, you should think about the case when
    it is not.


    ### Sin #4: Depending On JavaScript And Certain Input Devices


    There is quite a discussion about the need to consider non-JavaScript environments
    in this day and age, but here is a fact: JavaScript can be turned off, and any
    JavaScript could break the page for the other scripts that are included. Given
    the flakiness of code out there that may be running alongside yours and the instability
    of wireless and mobile connections, I for one want to build one thing: code that
    works.


    So, making sure that the most basic usage of your product does not depend on JavaScript
    is not just nice to have but essential if you expect people to actually use the
    product.


    Absolutely nothing is wrong with using JavaScript heavily. On the contrary, it
    makes the Web much smoother and saves us a lot of time if done right. But you
    should never promise functionality that doesn’t work. And if you rely on JavaScript,
    this is exactly what you’re doing. I’ve already covered the effects of bad JavaScript
    in detail in the [AJAX](http://www.smashingmagazine.com/2010/02/10/some-things-you-should-know-about-ajax/),
    [JavaScript testing](http://www.smashingmagazine.com/2010/01/21/find-the-right-javascript-solution-with-a-7-step-test/)
    and [security](http://www.smashingmagazine.com/2010/01/14/web-security-primer-are-you-part-of-the-problem/)
    articles here on Smashing Magazine, but once again here are some simple steps
    you can take to make sure you don’t break your promise to end users:


    •Anything vital to the functionality of your product should not require JavaScript.
    Forms, links and server-side validation and re-direct scripts are your friends.


    •If something depends on JavaScript, build it with JavaScript and add it to the
    document using the DOM or the equivalent method in your library of choice.


    •If you add JavaScript functionality, make sure it works with the keyboard and
    mouse. Click and submit handlers are bullet-proof, whereas key and mouse events
    are flaky and don’t work on mobile devices.'
