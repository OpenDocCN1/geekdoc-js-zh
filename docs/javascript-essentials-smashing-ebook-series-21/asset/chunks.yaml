  trans: "\n\n## 5. 可扩展性\n代码的编写方式是否同时支持 100 个和 10,000 个用户？它是否经过了优化？\n\n## 6. 风格\n\
    代码是否遵循特定的风格指南（如果是协作项目，最好是团队共同认可的）？\n\n虽然我同意这个列表，但如果将其扩展为一份指导评审人员在实践中应该向开发者提供什么的指南，将会非常有帮助。因此，评审人员应该执行以下操作：\n\
    \n- 提供清晰的注释，展示专业知识并进行良好的沟通。\n- 指出实现中的不足之处（但不要过度批评）。\n- 说明为什么不推荐某种特定方法，并在可能的情况下，引用博客文章、Gists、规范、[MDN](http://developer.mozilla.org/)\
    \ 页面和 [jsPerf](http://jsperf.com/) 测试来支持该论点。\n- 建议替代方案，可以通过单独的可运行代码形式提供，也可以通过\
    \ fork（分支）集成到代码中，以便开发者能够清晰地看到自己的错误在哪里。\n- 首先关注解决方案，其次才是风格。关于风格的建议可以在评审的后期提出，但在关注这些之前，应尽可能彻底地解决根本问题。\n\
    - 评审超出请求范围的内容。这完全取决于评审人员的自行判断，但如果我注意到开发者实现的其他方面存在问题，我通常会尝试建议他们如何改进这些问题。我还没有收到过关于此的投诉，所以我认为这不是坏事。\n\
    \n### 协作式代码评审\n\n虽然由一个开发者进行评审可能效果良好，但另一种方法是让更多人参与到过程中。这有几个明显的优势，包括减少个人评审人员的负担以及让更多人接触你的实现，这可能会带来更多的改进建议。它还允许在评审人员不小心犯错时筛选并修正意见。\n\
    \n为了协助小组，你可能希望使用协作工具，让所有评审人员同时检查并对代码进行评论。幸运的是，有一些不错的工具值得尝试：\n\n- [Review Board](http://www.reviewboard.org/)\n\
    这是一个基于 Web 的工具，采用 MIT 许可证免费提供。它可以与 `Git`、`CVS`、`Mercurial`、`Subversion` 以及其他版本控制系统集成。Review\
    \ Board 可以安装在运行 `Apache` 或 `lighttpd` 的服务器上，且个人和商业用途均免费。\n\n- [Crucible](http://www.atlassian.com/software/crucible)\n\
    该工具由澳大利亚软件公司 Atlassian 开发，同样基于 Web。它面向企业，在分布式团队中效果最好。Crucible 支持实时评审和实时评论，像 Review\
    \ Board 一样，与许多版本控制工具集成，包括 `Git` 和 `Subversion`。\n\n- [Rietveld](http://code.google.com/p/rietveld/)\n\
    与其他两个工具一样，Rietveld 也支持协作评审，但它实际上是由 Python 创始人 Guido van Rossum 编写的。它设计运行在 Google\
    \ 的云服务上，并受益于 Guido 编写 Mondrian 的经验——Mondrian 是 Google 内部用于评审代码的专用应用程序。\n\n- 其他\n\
    其他许多协作代码评审的选项并非为此目的创建的。包括 [CollabEdit](http://collabedit.com/)（免费且基于 Web）以及我个人喜欢的\
    \ [EtherPad](http://piratepad.net/front-page/)（同样免费且基于 Web）。\n\n![exhaustion.jpg](img/exhaustion.jpg)\n\
    \n（图片来源：joelogon）\n\n### 来自一次 JavaScript 代码评审的教训\n\n进入评审环节。\n\n最近有一开发者写信给我，请求我评审他们的代码，并就如何改进提供一些实用的建议。虽然我确实不是代码评审专家（别被上面的内容误导了），但这里是我提出的问题和解决方案。\n\
    \n#### 问题 1\n\n**问题**：函数和对象作为参数传递给其他函数时，没有任何类型验证。\n\n**反馈**：类型验证是确保你只处理所需类型输入的关键步骤。如果没有进行清理检查，你面临着用户传入几乎任何内容（字符串、日期、数组等）的风险，如果你在开发时没有进行防御性编程，这很容易破坏你的应用程序。对于函数，你起码应该执行以下操作：\n\
    \n1. 测试以确保传递的参数确实存在；\n2. 进行 `typeof` 检查，以防止应用执行并非有效函数的输入。\n\n```\nif (callback\
    \ && typeof callback === \"function\"){\n  /* 剩余逻辑 */\n}else{\n  /* 不是有效函数 */\n\
    }\n```\n\n遗憾的是，仅靠简单的 `typeof` 检查本身是不够的。正如 Angus Croll 在他的文章 “[修复 typeof 运算符](http://javascriptweblog.wordpress.com/2011/08/08/fixing-the-javascript-typeof-operator/)”中所指，如果你将\
    \ `typeof` 用于函数以外的任何地方，就需要意识到 `typeof` 检查的许多问题。\n\n例如，`typeof null` 返回 `object`，这在技术上是不正确的。事实上，当\
    \ `typeof` 应用于任何非函数的对象类型时，它返回 `object`，而无法区分 `Array`、`Date`、`RegEx` 或其他任何类型。\n\
    \n解决方案是使用 `Object.prototype.toString` 来调用 JavaScript 对象的底层内部属性，即 `[[Class]]`（对象的对象的类属性）。遗憾的是，专门的内置对象通常会覆盖\
    \ `Object.prototype.toString`，但你可以强制在它们上使用通用的 `toString` 函数：\n\n```javascript\n\
    Object.prototype.toString.call([1,2,3]); //\"[object Array]\"\n```\n\n你可能还会发现\
    \ Angus 下面的这个函数作为 `typeof` 更可靠的替代方案。尝试对对象、数组和其他类型调用 `betterTypeOf()` 看看会发生什么。\n\
    \n```javascript\nfunction betterTypeOf( input ){\n  return Object.prototype.toString.call(input).match(/^\\\
    [object\\s(.*)\\]$/)[1];\n}\n```\n\n在这里，`parseInt()` 被盲目地用于解析用户输入的整数值，但没有指定基。这可能会导致问题。\n\
    \n在 [JavaScript: The Good Parts](http://shop.oreilly.com/product/9780596517748.do)\
    \ 中，Douglas Crockford  `parseInt()` 是危险的。虽然你可能知道传递一个字符串参数会返回一个整数，但理想情况下你也应该通过第二个参数指定一个基（radix），否则它可能会返回意外的输出。参考以下示例：\n\
    \n```javascript\nparseInt('20'); // 返回你预期的结果，但是……\nparseInt('020'); // 返回 16\n\
    parseInt('00020'); // 返回 16\nparseInt('020', 10); // 因为指定了基，返回 20\n```\n\n你会对有多少开发者漏掉第二个参数感到惊讶，但这种情况经常发生。记住，你的用户（如果允许自由输入数字）并不一定遵循数字规范（因为他们疯了！）。我见过\
    \ `020`、`,20`、`;'20` 以及许多其他变体，所以尽力解析尽可能广泛的输入。以下使用 `parseInt()` 的技巧有时更好：\n\n```javascript\n\
    Math.floor(\"020\"); // 返回 20\nMath.floor(\"0020\"); // 返回 20\nNumber(\"020\"\
    ); // 返回 20\nNumber(\"0020\"); // 返回 20\n+\"020\"; // 返回 20\n```\n\n#### 问题 2\n\
    \n**问题**：代码库中到处都是检查特定浏览器检查（例如功能检测、支持 ES5 特性的检查等）。\n\n**反馈**：理想情况下，你的代码库应该尽可能 DRY（不要重复），这个问题有一些优雅的解决方案。例如，你可能会从加载时配置模式（也称为加载时和初始化分支）。基本思想是你只在应用程序加载时测试一次条件，然后在后续检查中访问该测试的结果。这种模式常见于加载时针对特定浏览器进行优化的\
    \ JavaScript 库中。\n\n```javascript\nvar tools = {\n  addMethod: null,\n  removeMethod:\
    \ null\n};\n```\n\n"
- fmt: "\n```javascript\nif(/* condition for native support */){\n  tools.addMethod\
    \ = function(/* params */){\n    /* method logic */\n  }\n}else{\n  /* fallback\
    \ - eg. for IE */\n  tools.addMethod = function(/* */){\n    /* method logic */\n\
    \  }\n}\n```\n\nThe example below demonstrates how this can be used to normalize\
    \ getting an `XMLHttpRequest` object.\n\n```javascript\nvar utils = {\n  getXHR:\
    \ null\n};\n\nif(window.XMLHttpRequest){\n  utils.getXHR = function(){\n    return\
    \ new XMLHttpRequest;\n  }\n}else if(window.ActiveXObject){\n  utils.getXHR =\
    \ function(){\n    /* this has been simplified for example sakes */\n    return\
    \ new ActiveXObject('Microsoft.XMLHTTP');\n  }\n}\n```\n\nFor a great example,\
    \ Stoyan Stefanov applies this to attaching and removing event listeners cross-browser,\
    \ in his book [JavaScript Patterns](http://shop.oreilly.com/product/9780596806767.do):\n\
    \n```javascript\nvar utils = {\n  addListener: null,\n  removeListener: null\n\
    };\n\n// the implementation\nif (typeof window.addEventListener === 'function')\
    \ {\n  utils.addListener = function ( el, type, fn ) {\n    el.addEventListener(type,\
    \ fn, false);\n  };\n  utils.removeListener = function ( el, type, fn ) {\n  \
    \  el.removeEventListener(type, fn, false);\n  };\n} else if (typeof document.attachEvent\
    \ === 'function') { // IE\n  utils.addListener = function ( el, type, fn ) {\n\
    \    el.attachEvent('on' + type, fn);\n  };\n  utils.removeListener = function\
    \ ( el, type, fn ) {\n    el.detachEvent('on' + type, fn);\n  };\n} else { //\
    \ older browsers\n  utils.addListener = function ( el, type, fn ) {\n    el['on'\
    \ + type] = fn;\n  };\n  utils.removeListener = function ( el, type, fn ) {\n\
    \    el['on' + type] = null;\n  }\n}\n```\n\n### Problem 3\n\n**Problem**: The\
    \ native `Object.prototype` is being extended regularly.\n\n**Feedback**: Extending\
    \ native types is generally frowned upon, and few (if any) popular code bases\
    \ should dare to extend `Object.prototype`. The reality is that there is not likely\
    \ a situation in which you absolutely need to extend it in this way. In addition\
    \ to breaking the object-as-hash tables in JavaScript and increasing the chance\
    \ of naming collisions, it’s generally considered bad practice, and modifying\
    \ it should only be a last resort (this is quite different from extending your\
    \ own custom object properties).\n\nIf for some reason you do end up extending\
    \ the object prototype, ensure that the method doesn’t already exist, and document\
    \ it so that the rest of the team is aware why it’s necessary. You can use the\
    \ following code sample as a guide:\n\n```javascript\nif(typeof Object.prototype.myMethod\
    \ != 'function'){\n  Object.prototype.myMethod = function(){\n    //implem\n \
    \ };\n}\n```\n\n[Juriy Zaytsev](http://twitter.com/kangax) has a great post on\
    \ [extending native and host objects](http://perfectionkills.com/extending-built-in-native-objects-evil-or-not/),\
    \ which may be of interest.\n\n### Problem 4\n\n**Problem**: Some of the code\
    \ is heavily blocking the page because it’s either waiting on processes to complete\
    \ or data to load before executing anything further.\n\n**Feedback**: Page-blocking\
    \ makes for a poor user experience, and there are a number of ways to work around\
    \ it without impairing the application.\n\nOne solution is to use “deferred execution”\
    \ (via promises and futures). The basic idea with promises is that, rather than\
    \ issuing blocking calls for resources, you immediately return a `promise` for\
    \ a future value that will eventually be fulfilled. This rather easily allows\
    \ you to write non-blocking logic that can be run asynchronously. It is common\
    \ to introduce callbacks into this equation that execute once the request completes.\n\
    \nI’ve written a relatively comprehensive [post](http://msdn.microsoft.com/en-us/scriptjunkie/gg723713)\
    \ on this with Julian Aubourg, if you’re interested in doing this through jQuery,\
    \ but it can of course be implemented with vanilla JavaScript as well.\n\nMicro-framework\
    \ [Q](https://github.com/kriskowal/) offers a CommonJS-compatible implementation\
    \ of promises and futures that is relatively comprehensive and can be used as\
    \ follows:\n\n```javascript\n/* define a promise-only delay function that resolves\
    \ when a timeout completes */\nfunction delay(ms) {\n  var deferred = Q.defer();\n\
    \  setTimeout(deferred.resolve, ms);\n  return deferred.promise;\n}\n\n/* usage\
    \ of Q with the 'when' pattern to execute a callback once delay fulfils the promise\
    \ */\nQ.when(delay(500), function () {\n  /* do stuff in the callback */\n});\n\
    ```\n\nIf you’re looking for something more basic that can be read through, then\
    \ here is Douglas Crockford’s implementation of promises:\n\n```javascript\nfunction\
    \ make_promise() {\n  var status = 'unresolved',\n  outcome,\n  waiting = [],\n\
    \  dreading = [];\n\n  function vouch( deed, func ) {\n    switch (status) {\n\
    \      case 'unresolved':\n        (deed === 'fulfilled' ? waiting : dreading).push(func);\n\
    \        break;\n      case deed:\n        func(outcome);\n        break;\n  \
    \  }\n  };\n\n  function resolve( deed, value ) {\n    if (status !== 'unresolved')\
    \ {\n      throw new Error('The promise has already been resolved:' + status);\n\
    \    }\n    status = deed;\n    outcome = value;\n    (deed == 'fulfilled' ? waiting\
    \ : dreading).forEach(function (func) {\n      try {\n        func(outcome);\n\
    \      } catch (ignore) {}\n    });\n  }\n\n  return {\n    when: function ( func\
    \ ) {\n      vouch('fulfilled', func);\n    },\n    fail: function ( func ) {\n\
    \      vouch('smashed', func);\n    },\n    fulfill: function ( value ) {\n  \
    \    resolve('fulfilled', value);\n    },\n    smash: function ( string ) {\n\
    \      resolve('smashed', string);\n    },\n    status: function () {\n      return\
    \ status;\n    }\n  };\n}\n```\n\n### Problem 5\n\n**Problem**: You’re testing\
    \ for explicit equality of a property using `==`\n\n**Feedback**: As you may or\
    \ not know, the `==` operator in JavaScript is fairly liberal and considers values\
    \ to be equal even if they’re of different types. This is due to the operator\
    \ forcing coercion into a single type (usually a number) prior to performing any\
    \ comparison. The reason I recommend `===` for more specific comparison (in this\
    \ case) is that `==` is known to have a number of gotchas and is considered unreliable\
    \ by many developers. You might also be interested to know that in abstractions\
    \ of the language, such as CoffeeScript, the `==` operator is completely dropped\
