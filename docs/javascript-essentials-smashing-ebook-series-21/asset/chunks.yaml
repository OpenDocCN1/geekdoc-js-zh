- fmt: '

    One last thing to consider is what will happen in future. Claims that the widget
    will “work in every environment” are bogus because that cannot be done. The great
    power of the Web is that software solutions can adapt to the environment they
    are being used in. If you use `Netscape 4`, you should see a few images; if you
    use the newest `Webkit` browser, you should see a fancy image carousel with animation
    and fading; that sort of thing.


    A good widget will have a proven test report covering which browsers and environments
    it has been tested in and what the known issues are. There will always be issues,
    and claiming otherwise is arrogant or ignorant.


    Upgrading your widget should be easy and painless, and there should be some versioning
    in place, with new versions being backwards-compatible.


    Extending the widget should be easy. We spoke earlier about not being limited
    to a particular number of items or a certain look and feel. But if you really
    use a widget, you will find you have to override certain functionality and react
    to various changes. Good widgets either have an `API` (a programming interface
    to extend it) or fire custom events for you to listen to. Custom events are “interesting
    moments” in a user’s interaction with the widget. For example, a button will tell
    the script when you have activated it, and if you write the widget a certain way,
    you can tell the world (or in this case, other scripts) when something happens
    to it. You can notify that a container has been opened, that data has returned
    from the Web or that a menu was too large to be displayed to the right and had
    to be moved to the left.


    Widgets built with the `Yahoo User Interface` library, for example, come [with
    a lot of custom events](http://developer.yahoo.com/yui/docs/YAHOO.widget.AutoComplete.html#events):


    ![litmus-events.jpg](Images/litmus-events.jpg)


    This allows you to monitor what is going on (like for debugging purposes) and
    extend functionality. The [demo page for the AutoComplete control](http://developer.yahoo.com/yui/examples/autocomplete/ac_basic_xhr_log.html),
    for example, displays in a logging console on the right what happens “under the
    hood” when you use the auto-complete field.


    ![litmus-events-logging.png](Images/litmus-events-logging.png)


    By subscribing to these events in `JavaScript`, overriding the original functionality
    for something new is pretty easy; in this case, we have an [auto-complete that
    returns photos and allows you to collect them](http://developer.yahoo.com/yui/examples/autocomplete/ac_flickr_xml.html).


    ![litmus-event-override.png](Images/litmus-event-override.png)


    Custom events are a great way to extend a widget while keeping the core code easy
    to upgrade.


    ### One Final Word On Size


    One last thing to mention: some widget developers use a certain argument to advocate
    for their solution but which is totally irrelevant to your decision, and that
    is size.


    Advertising-speak like “A drop-down menu in 20 lines of JavaScript” or “A full
    featured lightbox in under 2 KB” is fun and good for the developer’s ego, but
    in reality it is no measure of the quality of the solution. While you should avoid
    `JavaScript` solutions that are massive (let’s say 100 KB), code that has been
    written to be very generic and easy to extend will always be bigger than code
    that has been written to serve a single purpose. Any widget whose size is proudly
    trumpeted and is meant to be used by people who are not as good at developing
    as the initial owner will get bigger over time anyway. Developers like to play
    the numbers game, but maintainable code is different than extreme number-crunching.


    And if you get your kicks from this sort of thing, try the demo scene in which
    Farbrausch proved with [The Product](http://www.pouet.net/prod.php?which=1221)
    in 2000 that you can fit a seven-minute animation with music and synthesized voices
    into 64 KB.am


    # Ten Oddities And Secrets About JavaScript


    Andy Croxall![lg.php.gif](Images/lg.php.gif)


    `JavaScript`. At once bizarre and yet beautiful, it is surely the programming
    language that Pablo Picasso would have invented. `Null` is apparently an object,
    an empty array is apparently equal to false, and functions are bandied around
    as though they were tennis balls.


    This article is aimed at intermediate developers who are curious about more advanced
    `JavaScript`. It is a collection of `JavaScript`’s oddities and well-kept secrets.
    Some sections will hopefully give you insight into how these curiosities can be
    useful to your code, while other sections are pure WTF material. So, let’s get
    started.


    ### ![lg.php.gif](Images/lg.php.gif) Data Types And Definitions


    #### 1. Null is an Object


    Let’s start with everyone’s favorite `JavaScript` oddity, as well known as it
    is. `Null` is apparently an object, which, as far as contradictions go, is right
    up there with the best of them. `Null`? An object? “Surely, the definition of
    `null` is the total absence of meaningful value,” you say. You’d be right. But
    that’s the way it is. Here’s the proof:


    ```javascript

    alert(typeof null); //alerts ''object''

    ```


    Despite this, `null` is not considered an instance of an object. (In case you
    didn’t know, values in `JavaScript` are instances of base objects. So, every number
    is an instance of the `Number` object, every object is an instance of the `Object`
    object, and so on.) This brings us back to sanity, because if `null` is the absence
    of value, then it obviously can’t be an instance of anything.


    #### 2. NaN is a Number


    You thought `null` being an object was ridiculous? Try dealing with the idea of
    `NaN`.


    ```javascript

    alert(typeof NaN); //alerts ''Number''

    ```


    ```javascript

    alert(NaN === NaN); //evaluates false

    ```


    In fact `NaN` is not equal to anything. The only way to confirm that something
    is `NaN` is via `isNaN()`.


    #### 3. An Array With No Keys == False (About Truthy and Falsy)


    Here’s another much-loved `JavaScript` oddity:


    ```javascript

    alert(new Array() == false); //evaluates true

    ```


    To understand what’s happening here, you need to understand the concepts of truthy
    and falsy. These are sort of true/false-lite, which will anger you if you majored
    in logic or philosophy.


    I’ve read many explanations of what truthy and falsy are, and I feel the easiest
    one to understand is this: in `JavaScript`, every non-boolean value has a built-in
    boolean flag that is called when the value is asked to behave like a boolean;
    like, for example, when you compare it to a boolean.


    Because apples cannot be compared to pears, when `JavaScript` is asked to compare
    values of differing data types, it first “coerces” them into a common data type.
    False, zero, `null`, `undefined`, empty strings and `NaN` all end up becoming
    false—not permanently, just for the given expression. An example to the rescue:


    ```javascript

    var someVar = 0;

    alert(someVar == false); //evaluates true

    ```


    Here, we’re attempting to compare the number `0` to the boolean `false`. Because
    these data types are incompatible, `JavaScript` secretly coerces our variable
    into its truthy or falsy equivalent, which in the case of 0 (as I said above)
    is falsy.


    You may have noticed that I didn’t include empty arrays in the list of falsies
    above. Empty arrays are curious things: they actually evaluate to truthy but,
    when compared against a boolean, behave like a falsy. Confused yet? With good
    cause. Another example perhaps?


    ```javascript

    var someVar = []; //empty array


    alert(someVar == false); //evaluates true


    if (someVar) alert(''hello''); //alert runs, so someVar evaluates to true

    ```


    To avoid coercion, you can use the value and type comparison operator, `===`,
    (as opposed to `==`, which compares only by value). So:


    ```javascript

    var someVar = 0;

    alert(someVar == false); //evaluates true – zero is a falsy


    alert(someVar === false); //evaluates false – zero is a number, not a boolean

    ```

