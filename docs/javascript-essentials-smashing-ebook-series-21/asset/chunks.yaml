    ```javascript

    for ( i = 0; i <= 1; i += 0.1 ) {

    x = i;

    y = Math.pow( i, 4 );

    }

    ```


    ![powerto.png](img/powerto.png)


    这是 `jQuery` 和 `YUI` 等库中使用的缓动函数（easing functions）技巧之一，也用于现代浏览器中的 CSS 过渡和动画。


    你可以同样的方式使用它，但对于获取在 0 到 1 之间遵循自然运动的值，有一个甚至更简单的选项。


    ### 这不是错误，只是自然运动


    [正弦波](http://en.wikipedia.org/wiki/Sine_wave) 可能是平滑动画最好的东西。它们存在于自然界：观察一个挂着重物的弹簧、海浪、声音和光。


    在我们的案例中，我们想要平滑地从 0 移动到 1。


    为了创建一个从 0 到 1 再回到 0 的平滑运动，我们可以使用一个在几步内从 0 变到 `π` 的正弦波。一个完整的从 0 到 `π` × `2`（即一整圈）的正弦波将产生从
    -1 到 1 的值，我们暂时不需要那样。


    ```javascript

    var counter = 0;

    // 100 次迭代

    var increase = Math.PI / 100;

    for ( i = 0; i <= 1; i += 0.01 ) {

    x = i;

    y = Math.sin(counter);

    counter += increase;

    }

    ```


    ![sine.png](img/sine.png)


    关于正弦和余弦数值的简要说明：`Math.sin()` 和 `Math.cos()` 都接受一个单位为[弧度](http://en.wikipedia.org/wiki/Radian)的角度。然而，作为人类，0
    到 360 度的度更容易读得多。这就是为什么你能够并且应该这个简单的公式在它们之间进行转换：


    ```javascript

    var toRadian = Math.PI / 180;

    var toDegree = 180 / Math.PI;

    var angle = 30;

    var angleInRadians = angle * toRadian;

    var angleInDegrees = angleInRadians * toDegree;

    ```


    回到我们的正弦波。你可以对此玩很多。例如，你可以使用一个完整的 2 × `π` 循环的绝对值：


    ```javascript

    var counter = 0;

    // 100 次迭代

    var increase = Math.PI * 2 / 100;

    for ( i = 0; i <= 1; i += 0.01 ) {

    x = i;

    y = Math.abs( Math.sin( counter ) );

    counter += increase;

    }

    ```


    ![msine.png](img/msine.png)


    但再次，这看起来很粗糙。如果你想要完整的上下运动而中间没有断点，那么你需要偏移值。你必须将正弦减半，然后给它加上 0.5：


    ```javascript

    var counter = 0;

    // 100 次迭代

    var increase = Math.PI * 2 / 100;

    for ( i = 0; i <= 1; i += 0.01 ) {

    x = i;

    y = Math.sin( counter ) / 2 + 0.5;

    counter += increase;

    }

    ```


    ![shiftingup.png](img/shiftingup.png)


    所以，你如何使用它？拥有一个可以根据你输入的任何内容返回 -1 到 1 的函数是非常酷炫的。你只需要将它的结果乘以你想要的值，并添加一个偏移量以避免负数。


    例如，查看[这个正弦运动演示](http://www.smashingmagazine.com/wp-content/uploads/2011/09/sinejump.html)：


    ![sinejump.png](img/sinejump.png)


    看起来很整洁，不是吗？很多技巧已经包含在 CSS 中：


    ```css

    .stage {

    width:200px;

    height:200px;

    margin:2em;

    position:relative;

    background:#6cf;

    overflow:hidden;

    }

    .stage div {

    line-height:40px;

    width:100%;

    text-align:center;

    background:#369;

    color:#fff;

    font-weight:bold;

    position:absolute;

    }

    ```


    `.stage` 元素具有固定尺寸并采用相对定位。这意味着在它内部绝对定位的所有内容都将相对于元素本身。


    `.stage` 内部的 `div` 高 40 像素并是绝对定位的。现在，我们只需要用 JavaScript 以正弦波移动这个 `div` 即可：


    ```javascript

    var banner = document.querySelector( ''.stage div'' ),

    start = 0;

    function sine(){

    banner.style.top = 50 * Math.sin( start ) + 80 + ''px'';

    start += 0.05;

    }

    window.setInterval( sine, 1000/30 );

    ```


    `start` 值不断变化，通过 `Math.sin()` 我们得到了一个很好的波浪运动。我们将其乘以 50 以得到一个更宽的波浪，并加上 80 像素使其在
    `.stage` 元素中居中。是的，该元素高为 200 像素，100 是它的一半，但因为 banner 高 40 像素，所以我们需要减去它的一半来使其居中。


    目前，这是一个简单的上下运动。但是，没有什么阻止你让它变得更有趣。例如，50 的倍数系数本身可以是不同值的正弦波：


    ```javascript

    var banner = document.querySelector( ''.stage div'' ),

    start = 0,

    multiplier = 0;

    function sine(){

    multiplier = 50 * Math.sin( start * 2 );

    banner.style.top = multiplier * Math.sin( start ) + 80 + ''px'';

    start += 0.05;

    }

    window.setInterval( sine, 1000/30 );

    ```


    [这种结果](http://www.smashingmagazine.com/wp-content/uploads/2011/09/growingsinejump.html)
    是一个似乎在试探性上下移动的 banner。在过去，在非常缓慢的 Commodore 64 上，实时计算正弦波太慢了。相反，我们有工具来生成正弦表（如果说是数组）。


    '
- fmt: '

    The only things that might be new here are the transformation with different browser
    prefixes and the positioning. People often make the mistake of creating a `div`
    with the dimensions `w` and `h` and then set it to `x` and `y` on the screen.
    This means you will always have to deal with the offset of the height and width.
    By subtracting half the width and height before positioning the `div`, you really
    set it where you want it—regardless of the dimensions. [Here’s a proof](http://www.smashingmagazine.com/wp-content/uploads/2011/09/offsetissue1.html):


    ![offsetissue.png](Images/offsetissue.png)


    Now, let’s use that to [plot 10 rectangles in a circle](http://www.smashingmagazine.com/wp-content/uploads/2011/09/simplecircle.html),
    shall we?


    ![simplecircle.png](Images/simplecircle.png)


    ```javascript

    var stage = document.querySelector(''.stage''),


    plots = 10;


    increase = Math.PI * 2 / plots,


    angle = 0,


    x = 0,


    y = 0;


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.setBackground( ''green'' );


    p.setDimensions( 40, 40 );


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    p.position( x, y );


    angle += increase;


    }

    ```


    We want 10 things in a circle, so we need to find the angle that we want to put
    them at. A full circle is two times `Math.PI`, so all we need to do is divide
    this. The `x` and `y` position of our rectangles can be calculated by the angle
    we want them at. The `x` is the cosine, and the `y` is the sine, as explained
    earlier in the bit on Pythagoras. All we need to do, then, is center the circle
    that we’re painting in the stage (200,200 is the center of the stage), and we
    are done. We’ve painted a circle with a radius of 100 pixels on the canvas in
    10 steps.


    The problem is that this looks terrible. If we really want to plot things on a
    circle, then their angles should also point to the center, right? For this, we
    need to calculate the tangent of the right-angle square, as explained in this
    [charming “Math is fun” page](http://www.mathsisfun.com/algebra/trig-finding-angle-right-triangle.html).
    In JavaScript, we can use [`Math.atan2()](https://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/Math/atan2)
    as a shortcut. The result looks much better:


    ![tancircle.png](Images/tancircle.png)


    ```javascript

    var stage = document.querySelector(''.stage''),


    plots = 10;


    increase = Math.PI * 2 / plots,


    angle = 0,


    x = 0,


    y = 0;


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.setBackground( ''green'' );


    p.setDimensions( 40, 40 );


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    p.rotate( Math.atan2( y - 200, x - 200 ) + ''rad'' );


    p.position( x, y );


    angle += increase;


    }

    ```


    Notice that the `rotate` transformation in CSS helps us heaps in this case. Otherwise,
    the math to rotate our rectangles would be much less fun. CSS transformations
    also take radians and degrees as their value. In this case, we use `rad`; if you
    want to rotate with degrees, simply use `deg` as the value.


    How about animating the circle now? Well, the first thing to do is change the
    script a bit, because we don’t want to have to keep creating new plots. Other
    than that, all we need to do to [rotate the circle is to keep increasing the start
    angle](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotatingcircle.html):


    ```javascript

    var stage = document.querySelector(''.stage''),


    plots = 10;


    increase = Math.PI * 2 / plots,


    angle = 0,


    x = 0,


    y = 0,


    plotcache = [];


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.setBackground( ''green'' );


    p.setDimensions( 40, 40 );


    plotcache.push( p );


    }


    function rotate(){


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    plotcache[ i ].rotate( Math.atan2( y - 200, x - 200 ) + ''rad'' );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    setInterval( rotate, 1000/30 );

    ```


    Want more? How about a [rotating text message](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotatingmessage.html)
    based on this? The tricky thing about this is that we also need to turn the characters
    90° on each iteration:


    ![rotatedmessage.png](Images/rotatedmessage.png)


    ```javascript

    var stage = document.querySelector(''.stage''),


    message = ''Smashing Magazine ''.toUpperCase(),


    plots = message.length;


    increase = Math.PI * 2 / plots,


    angle = -Math.PI,


    turnangle = 0,


    x = 0,


    y = 0,


    plotcache = [];


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.content( message.substr(i,1) );


    p.setDimensions( 40, 40 );


    plotcache.push( p );


    }


    function rotate(){


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    // rotation and rotating the text 90 degrees


    turnangle = Math.atan2( y - 200, x - 200 ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    setInterval( rotate, 1000/40 );

    ```


    Again, nothing here is fixed. You can make the [radius of the circle change constantly](http://www.smashingmagazine.com/wp-content/uploads/2011/09/growrotatingmessage.html),
    as we did with the bouncing banner message earlier (below is only an excerpt):


    ```javascript

    multiplier = 80 * Math.sin( angle );


    for( var i = 0; i < plots; i++ ) {


    x = multiplier * Math.cos( angle ) + 200;


    y = multiplier * Math.sin( angle ) + 200;


    turnangle = Math.atan2( y - 200, x - 200 ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;

    ```


    And, of course, you can [move the center of the circle](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotaterotatingmessage.html),
    too:


    ```javascript

    rx = 50 * Math.cos( angle ) + 200;


    ry = 50 * Math.sin( angle ) + 200;


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + rx;


    y = 100 * Math.sin( angle ) + ry;


    turnangle = Math.atan2( y - ry, x - rx ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;

    ```


    For a final tip, how about [allowing only a certain range of coordinates](http://www.smashingmagazine.com/wp-content/uploads/2011/09/boxedrotatingmessage.html)?


    ```javascript

    function rotate() {


    rx = 70 * Math.cos( angle ) + 200;


    ry = 70 * Math.sin( angle ) + 200;


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + rx;


    y = 100 * Math.sin( angle ) + ry;


    x = contain( 70, 320, x );


    y = contain( 70, 320, y );


    turnangle = Math.atan2( y - ry, x - rx ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    function contain( min, max, value ) {


    return Math.min( max, Math.max( min, value ) );


    }

    ```

