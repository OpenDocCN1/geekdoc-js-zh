    Problem 3


    Problem: The native Object.prototype is being extended regularly.


    Feedback: Extending native types is generally frowned upon, and few (if any) popular
    code bases should dare to extend Object.prototype. The reality is that there is
    not likely a situation in which you absolutely need to extend it in this way.
    In addition to breaking the object-as-hash tables in JavaScript and increasing
    the chance of naming collisions, it’s generally considered bad practice, and modifying
    it should only be a last resort (this is quite different from extending your own
    custom object properties).


    If for some reason you do end up extending the object prototype, ensure that the
    method doesn’t already exist, and document it so that the rest of the team is
    aware why it’s necessary. You can use the following code sample as a guide:


    if(typeof Object.prototype.myMethod != ’function’){


    Object.prototype.myMethod = function(){


    //implem


    };


    }


    [Juriy Zaytsev](http://twitter.com/kangax) has a great post on [extending native
    and host objects](http://perfectionkills.com/extending-built-in-native-objects-evil-or-not/),
    which may be of interest.


    #### Problem 4


    Problem: Some of the code is heavily blocking the page because it’s either waiting
    on processes to complete or data to load before executing anything further.


    Feedback: Page-blocking makes for a poor user experience, and there are a number
    of ways to work around it without impairing the application.


    One solution is to use “deferred execution” (via promises and futures). The basic
    idea with promises is that, rather than issuing blocking calls for resources,
    you immediately return a promise for a future value that will eventually be fulfilled.
    This rather easily allows you to write non-blocking logic that can be run asynchronously.
    It is common to introduce callbacks into this equation that execute once the request
    completes.


    I’ve written a relatively comprehensive [post](http://msdn.microsoft.com/en-us/scriptjunkie/gg723713)
    on this with Julian Aubourg, if you’re interested in doing this through jQuery,
    but it can of course be implemented with vanilla JavaScript as well.


    Micro-framework [Q](https://github.com/kriskowal/) offers a CommonJS-compatible
    implementation of promises and futures that is relatively comprehensive and can
    be used as follows:


    /* define a promise-only delay function that resolves when a timeout completes
    */


    function delay(ms) {


    var deferred = Q.defer();


    setTimeout(deferred.resolve, ms);


    return deferred.promise;


    }


    /* usage of Q with the ''when'' pattern to execute a callback once delay fulfils
    the promise */


    Q.when(delay(500), function () {


    /* do stuff in the callback */


    });


    If you’re looking for something more basic that can be read through, then here
    is Douglas Crockford’s implementation of promises:


    function make_promise() {


    var status = ’unresolved’,


    outcome,


    waiting = [],


    dreading = [];


    function vouch( deed, func ) {


    switch (status) {


    case ’unresolved’:


    (deed === ’fulfilled’ ? waiting : dreading).push(func);


    break;


    case deed:


    func(outcome);


    break;


    }


    };


    function resolve( deed, value ) {


    if (status !== ’unresolved’) {


    throw new Error(’The promise has already been resolved:’ + status);


    }


    status = deed;


    outcome = value;


    (deed == ’fulfilled’ ? waiting : dreading).forEach(function (func) {


    try {


    func(outcome);


    } catch (ignore) {}


    });


    waiting = null;


    dreading = null;


    };


    return {


    when: function ( func ) {


    vouch(’fulfilled’, func);


    },


    fail: function ( func ) {


    vouch(’smashed’, func);


    },


    fulfill: function ( value ) {


    resolve(’fulfilled’, value);


    },


    smash: function ( string ) {


    resolve(’smashed’, string);


    },


    status: function () {


    return status;


    }


    };


    };


    Problem 5


    Problem: You’re testing for explicit numeric equality of a property using the
    == operator, but you should probably be using === instead


    Feedback: As you may or may not know, the identity == operator in JavaScript is
    fairly liberal and considers values to be equal even if they’re of completely
    different types. This is due to the operator forcing a coercion of values into
    a single type (usually a number) prior to performing any comparison. The === operator
    will, however, not do this conversion, so if the two values being compared are
    not of the same type, then === will just return false.


    The reason I recommend considering === for more specific type comparison (in this
    case) is that == is known to have a number of gotchas and is considered to be
    unreliable by many developers.


    You might also be interested to know that in abstractions of the language, such
    as CoffeeScript, the == operator is completely dropped in favor of === beneath
    the hood due to the former’s unreliability.


    Rather than take my word for it, see the examples below of boolean checks for
    equality using ==, some of which result in rather unexpected outputs.


    3 == "3" // true


    3 == "03" // true


    3 == "0003" // true


    3 == "+3" //true


    3 == [3] //true


    3 == (true+2) //true


    ’ \t\r\n ’ == 0 //true


    "\t\r\n" == 0 //true


    "\t" == 0 // true


    "\t\n" == 0 // true


    "\t\r" == 0 // true


    " " == 0 // true


    " \t" == 0 // true


    " \ " == 0 // true


    " \r\n\ " == 0 //true


    The reason that many of the (stranger) results in this list evaluate to true is
    because JavaScript is a weakly typed language: it applies type coercion wherever
    possible. If you’re interested in learning more about why some of the expressions
    above evaluate to true, look at the [Annotated ES5](http://es5.github.com/#x9.3.1)
    guide, whose explanations are rather fascinating.


    Back to the review. If you’re 100% certain that the values being compared cannot
    be interfered with by the user, then proceed with using the == operator with caution.
    Just remember that === covers your bases better in the event of an unexpected
    input.


