    \ radians. We could have a go at it — but first, some plotting code needs to be\
    \ done.\n\n### A Quick DOM Plotting Routine\n\nNormally, my weapon of choice here\
    \ would be `canvas`, but in order to play nice with older browsers, let’s do it\
    \ in plain DOM. The following helper function adds div elements to a stage element\
