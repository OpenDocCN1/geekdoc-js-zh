    \ dynamically */\n    javascriptenabled:'js',\n    currentsection:'current'\n\
    \  }\n\n  /* functionality starts here */\n\n  $('body').addClass(config.javascriptenabled);\n\
    \n  var current = null;\n\n  $('h2').click(function(e){\n\n    if(current){\n\n\
    \      current.removeClass(config.currentsection);\n    }\n\n    current = $(this).next().addClass(config.currentsection);\n\
    \  })\n\n});\n```\n\nFor more information on configuration objects and why they\
    \ rock for maintenance, check out the blog post “[Providing Script Configuration\
