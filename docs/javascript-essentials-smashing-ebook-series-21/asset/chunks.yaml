    Google 搜索喜欢简单、易于爬取的网站。而你喜欢那些能展示你的作品且引人注目的动态网站。但搜索引擎无法运行你的 JavaScript。那个加载你内容的酷炫
    AJAX 程正在损害你的 SEO。


    Google 的机器人可以轻松解析 HTML；它们可以拆解 Word 文档、PDF 甚至来自你网站偏远角落的图像。但对于它们来说，AJAX 内容是不可见的。


    ### AJAX 的问题


    AJAX 彻底改变了 Web，但它也隐藏了内容。如果你有一个 Twitter 账户，尝试查看你个人资料页的源代码。那里没有任何推文 —— 只有代码！Twitter
    页面上的几乎所有内容都是通过 JavaScript 动态构建的，爬虫无法看到任何内容。这就是为什么 Google 开发了 [AJAX 爬取](http://code.google.com/web/ajaxcrawling)。


    由于 Google 无法从 HTML 中获取动态内容，你将通过其他方式提供它。但存在两个大问题：Google 不运行你的 JavaScript，而且它并不信任你。


    Google 索引整个 Web，但它并不运行 JavaScript。现代网站是运行在浏览器中的小型应用程序，但在其索引时运行这些应用程序对 Google 和其他人来说都太慢了。


    信任问题更为棘手。每个网站都想在搜索结果中排第一；你的网站正在和其他所有网站争夺顶部位置。Google 不能简单地给你一个 API 来返回你的内容，因为某些网站使用了如[遮蔽法](http://en.wikipedia.org/wiki/Cloaking)
    等脏手段来尝试获得更高的排名。搜索引擎无法信任你会做正确的事。


    Google 需要一种方法，让你向浏览器提供 AJAX 内容，同时向爬虫提供简单的 HTML 内容。换句话说，你需要多种格式的相同内容。


    ### 相同内容的两个 URL


    让我们从一个简单的例子开始。我是一个名为 Spiffy UI 的开源项目的成员。它是一个用于 REST 和快速开发的 [Google Web Toolkit](http://code.google.com/webtoolkit/)
    (GWT) 框架。我们想要展示我们的框架，因此我们使用 GWT 制作了 [SpiffyUI.org](http://www.spiffyui.org/)。


    GWT 是一个动态框架，将我们所有的内容都放在 JavaScript 中。我们的 `index.html` 文件看起来如下：


    ```html

    <body>

    <script type="text/javascript" language="javascript"

    src="org.spiffyui.spsample.index.nocache.js"></script>

    </body>

    ```


    所有内容都通过 JavaScript 添加到页面，我们通过[标签 (hash tags)](http://en.wikipedia.org/wiki/Hashtag#Hashtags)
    来控制内容（我稍后会解释原因）。每当你移动到应用程序的另一个页面时，你会得到一个新的标签。点击“CSS”链接，你会来到这里：


    http://www.spiffyui.org#css


    在大多数浏览器中，地址栏中的 URL 看起来如下：


    http://www.spiffyui.org/?css


    我们用 HTML5 修复了它。我将在本文后续部分向你展示如何做。


    这种简单的哈希对我们的应用程序有效并可以书签，但它是不可爬取的。Google 不知道标签意味着什么，也不知道如何从中获取内容，但它确实为网站提供了一种返回内容的替代方法。因此，我们通过添加一个感叹号（“bang”）来让
    Google 知道我们的哈希实际上是 JavaScript 代码，而是页面上的锚点，如下：


    http://www.spiffyui.org#!css


    这种 hash bang 是整个 AJAX 爬取方案中的秘密配方。当 Google 看到这两个字符在一起时，它就知道有更多内容被 JavaScript 隐藏了。它给了我们机会，通过向特殊的
    URL 发起第二次请求来返回完整内容：


    http://www.spiffyui.org?_escaped_fragment_=css


    新 URL 用 `?_escaped_fragment=` 替换了 `#!`。使用 URL 参数而不是标签很重要，因为参数会被发送到服务器，而标签仅对浏览器可用。


    这个新 URL 让我们在 Google 爬虫请求时，能够以 HTML 格式返回相同的内容。困惑吗？让我们逐步查看它是如何运作的。


    ### HTML 片段


    整个页面是在 JavaScript 中渲染的。我们需要将该内容转换为 HTML，以便 Google 能够访问。第一步是将 SpiffyUI.org 拆分为
    HTML 片段。


    Google 仍然将网站视为一组页面，因此我们需要以这种方式提供我们的内容。对于我们的应用程序来说，这非常容易，因为我们有一组页面，每个页面都是一个独立的逻辑部分。第一步是让页面可以设置书签。


    #### 书签


    大多数时候，JavaScript 只是更改页面内的某些东西：当你点击那个按钮或弹出那个面板时，页面的 URL 不会改变。对于简单页面来说这很好，但当你通过
    JavaScript 提供内容时，你希望给用户提供唯一的 URL，以便他们可以收藏应用程序的某些区域。


    JavaScript 应用程序可以更改当前页面的 URL，因此它们通常通过添加标签来支持书签。标签比任何其他 URL 机制都更好，因为它们不会被发送到服务器；它们是
    URL 中唯一无需刷新页面即可更改的部分。


    标签本质上是一个在应用程序语境下有意义的值。选择一个对于它代表的应用程序区域逻辑合理的标签，并将其添加：


    http://www.spiffyui.org#css


    在大多数浏览器中，地址栏中的 URL 看起来如下：


    http://www.spiffyui.org/?css


    我们用 HTML5 修复了它。我将在本文后续部分向你展示如何做。


    这种简单的哈希对我们的应用程序有效并可以书签，但它是不可爬取的。Google 不知道标签意味着什么，也不知道如何从中获取内容，但它确实为网站提供了一种返回内容的替代方法。因此，我们通过添加一个感叹号（“bang”）来让
    Google 知道我们的哈希实际上是 JavaScript 代码，而是页面上的锚点，如下：


    http://www.spiffyui.org#!css


    这种 hash bang 是整个 AJAX 爬取方案中的秘密配方。当 Google 看到这两个字符在一起时，它就知道有更多内容被 JavaScript 隐藏了。它给了我们机会，通过向特殊的
    URL 发起第二次请求来返回完整内容：


    http://www.spiffyui.org?_escaped_fragment_=css


    新 URL 用 `?_escaped_fragment=` 替换了 `#!`。使用 URL 参数而不是标签很重要，因为参数会被发送到服务器，而标签仅对浏览器可用。


    这个新 URL 让我们在 Google 爬虫请求时，能够以 HTML 格式返回相同的内容。困惑吗？让我们逐步查看它是如何运作的。


    #### 提供片段


    整个页面是在 JavaScript 中渲染的。我们需要将该内容转换为 HTML，以便 Google 能够访问。第一步是将 SpiffyUI.org 拆分为
    HTML 片段。


    Google 仍然将网站视为一组页面，因此我们需要以这种方式提供我们的内容。对于我们的应用程序来说，这非常容易，因为我们有一组页面，每个页面都是一个独立的逻辑部分。第一步是让页面可以设置书签。


    大多数时候，JavaScript 只是更改页面内的某些东西：当你点击那个按钮或弹出那个面板时，页面的 URL 不会改变。对于简单页面来说这很好，但当你通过
    JavaScript 提供内容时，你希望给用户提供唯一的 URL，以便他们可以收藏应用程序的某些区域。


    JavaScript 应用程序可以更改当前页面的 URL，因此它们通常通过添加标签来支持书签。标签比任何其他 URL 机制都更好，因为它们不会被发送到服务器；它们是
    URL 中唯一无需刷新页面即可更改的部分。


    标签本质上是一个在应用程序语境下有意义的值。选择一个对于它代表的应用程序区域逻辑合理的标签，并将其添加：


    http://www.spiffyui.org#css


    在大多数浏览器中，地址栏中的 URL 看起来如下：


    http://www.spiffyui.org/?css


    我们用 HTML5 修复了它。我将在本文后续部分向你展示如何做。


    这种简单的哈希对我们的应用程序有效并可以书签，但它是不可爬取的。Google 不知道标签意味着什么，也不知道如何从中获取内容，但它确实为网站提供了一种返回内容的替代方法。因此，我们通过添加一个感叹号（“bang”）来让
    Google 知道我们的哈希实际上是 JavaScript 代码，而是页面上的锚点，如下：


    http://www.spiffyui.org#!css


    这种 hash bang 是整个 AJAX 爬取方案中的秘密配方。当 Google 看到这两个字符在一起时，它就知道有更多内容被 JavaScript 隐藏了。它给了我们机会，通过向特殊的
