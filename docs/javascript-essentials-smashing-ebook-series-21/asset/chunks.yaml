  trans: "\n\n虽然大多数浏览器会 set `ff9900`，但 Firefox 返回的是 `rgb(255, 153, 0)`，即其 RGB 等效值。这里有很多\
    \ JavaScript 函数可以将 RGB 转换为十六进制。\n\n请注意，当我说到“计算后颜色”（computed color）时，指的是当前的颜色，无论它是如何应用于元素上的。将其与“样式”（style）进行比较，后者只读取在元素的样式属性中隐式设置的样式属性。此外，正如你在上面的示例中注意到的那样，`IE`\
    \ 检测计算后样式的方法与其他浏览器不同。\n\n顺便提一下，jQuery 的 `css()` 方法包含了这种计算后检测，并以样式被应用于元素的方式返回它们：无论是隐式的、通过继承还是其他方式。因此，你很少需要使用原生的\
    \ `getComputedStyle` 和 `currentStyle`。\n\n## 杂杂\n\n### 9. 0.1 + 0.2 !== 0.3\n\n\
    这不仅是 JavaScript 中的一个奇现象；它实际上是计算机科学中普遍存在的问题，并影响着许多语言。它的输出是 `0.3000000000000004`。\n\
    \n这与被称为“机器精度”（machine precision）的问题有关。当 JavaScript 尝试执行上述行时，它会将值转换为它们的二进制等效值。\n\
    \n问题就在于此。`0.1` 并不是真正的 `0.1`，而是它的二进制等效值，这是一个接近但并不相等的值。从本质上说，只要你写下值，它们注定会丢失精度。你可能只是想要两个小数，但正如\
    \ Chris Pine [笔记](http://dev.opera.com/articles/view/why-i-love-ecmascript-4-real-decimals/)\
    \ 所说的，你得到的是二进制浮点运算。类似于你想把文本翻译成俄语，结果却是白俄罗斯语。相似但不相同。\n\n这里涉及的内容更多，但超出了本文范围（更不用说作者的数学能力）。计算机科学和开发者论坛非常欢迎解决方案。在某种程度上，你的选择取决于你进行的计算类型。每种方案的优缺点超出了本文范围，但常见的选择是：\n\
    \n1. 将转换为整数并对它们进行计算，然后再转换回小数；\n2. 调整逻辑以允许一个范围而不是特定结果。\n3. 所以，例如，而不是……\n\n```\n\
    var num1 = 0.1, num2 = 0.2, shouldEqual = 0.3;\nalert(num1 + num2 == shouldEqual);\
    \ //false\n```\n\n……而是我们会这样做：\n\n```javascript\nalert(num1 + num2 > shouldEqual\
    \ - 0.001 && num1 + num2 < shouldEqual + 0.001); //true\n```\n\n翻译成中文，这意味着因为 `0.1\
    \ + 0.2` 显然不是 `0.3`，所以改为检查它是否大致为 `0.3`——具体来说，是在其两侧 `0.001` 的范围之内。明显的缺点是，对于非常精确的计算，这将返回不准确的结果。\n\
    \n### 10. Undefined 是可以被定义的\n\n好了，让我们用一个愚蠢且无关紧要的问题结束吧。尽管听起来很奇怪，`undefined` 实际上并不是\
    \ JavaScript 中的一个保留字，尽管它有特殊含义，并且是判断变量是否未定义的唯一方法。所以：\n\n```javascript\nvar someVar;\n\
    alert(someVar == undefined); // 结果为 true\n```\n\n到目前为止都很正常。但是：\n\n```javascript\n\
    undefined = \"I'm not undefined!\";\nvar someVar;\nalert(someVar == undefined);\
    \ // 结果为 false!\n```\n\n你也可以查看 [Mozilla 的 JavaScript 所有保留字列表](https://developer.mozilla.org/en/JavaScript/Reference/Reserved_Words)\
    \ 以备后参考。\n\n# JavaScript 实现的七大罪\n\nChristian Heilmann![lg.php.gif](img/lg.php.gif)\n\
    \n在过去的几年里，使用 JavaScript 变得越来越容易。过去，我们需要了解每个浏览器的特性，而现在许多库如 `jQuery`、`YUI`、`Dojo`\
    \ 和 `MooTools` 即使是不懂 JavaScript 的人也能为无聊的 HTML 文档增加令人印象深刻且华丽的效果。通过借助 CSS 选择器引擎，我们远离了\
    \ `DOM` 的复杂性和不一致性，并让事情变得简单得多。\n\n然而，如果你查看一些发布的代码，我们似乎退后了一步。在获得更方便访问的同时，我们的代码也变得有些草率。要找到结构清晰、易于维护的\
    \ `jQuery` 代码非常困难，这就是为什么许多插件都在做同样的事情。自己写一个比试图理解其他开发者做了什么要快。\n\n不过，稳健、易于维护且安全的\
    \ JavaScript 规则并没有改变。所以，让我们过一遍 JavaScript 开发的七大罪，当你以后需要维护代码或将其交给其他方时，这些罪会让你吃头噬肉。\n\
    \n我们都不得不处理过别人编写的代码。我们也对缺乏可维护性和文档以及奇异的逻辑感到绝望。有趣的是，作为开发者，我们开始将这视为常态，并习惯了忽略别人的工作，转而反复为相同的问题编写新代码，仿佛我们是在下意识里试图通过留下不可维护的代码来确保自己的工作——留下只有我们自己能懂的代码，同时抱怨那里没有好的解决方案。\n\
    \n### 祖辈之罪：特定浏览器代码\n\n阻碍我们作为开发者进化的主要障碍之一是，JavaScript 在很大程度上是特定浏览器的。\n\n这主要是因为浏览器不支持标准（或者在管理机构达成标准之前就发布了），而且因为我们必须在竞争对手之前交付工作，且不能推延项目经理设定的过度乐观的期限。\n\
    \n这恰恰是 `Internet Explorer 6` 拒绝死亡的原因之一。全球办公室使用的数百个昂贵软件软件包是在这个浏览器处于顶尖水平时构建的。这——以及提倡从操作系统到文档、电子表格到浏览器都使用单一软件供应商的单一文化——是公司现在无法简单停止对其支持的原因。这也意味着新版本的\
    \ `IE` 将永远不得不以某种方式支持 `IE6` 的渲染错误。`IE6` 是互联网的弗兰肯斯坦，纠缠着它的创造者，被镇民们严重误解，他们宁愿杀死它、烧掉它并绕着它跳舞也不愿去理解它。\n\
    \n好消息是，现在你找不到很多以 `if(document.all){}` 开头并接 `else if(document.layers){}` 的脚本了。如果你发现了，请给作者发一封简单的邮件，鼓励他们向前看，或者更好是将他们的网站重定向到一个实际上正在维护的更好的脚本。\n\
    \n### 库的救援\n\n`jQuery`、`YUI`、`MooTools`、`Dojo` 和 `Glow` 等 JavaScript 库的工作是让 JavaScript\
    \ 开发变得可预测，并将开发者从我们称为浏览器支持的活狱中解出来。换句话说，它们修复了浏览器中的随机 Bug，让我们能够自由地采用标准，而不必担心某些浏览器不会识别它们。\n\
    \n例如，`DOM` 方法 `getElementById(id)` 应该是直接的：找到 ID 为 `id` 的元素并返回它。但由于某些版本的 `IE` 和\
    \ `Opera` 也会返回名称属性为 `id` 的元素，[jQuery 这样解决了该问题](http://github.com/jquery/jquery/blob/master/src/core.js)：\n\
    \n```javascript\nvar elem;\nelem = document.getElementById( match[2] );\nif (\
    \ elem ) {\n    // 处理 IE 和 Opera 返回名称\n    // 而不是 ID 的情况\n    if ( elem.id !==\
    \ match[2] ) {\n        return rootjQuery.find( selector );\n    }\n    // 否则，我们将元素直接注入\
    \ jQuery 对象中\n    this.length = 1;\n    this[0] = elem;\n}\n```\n\n这正是库非常有用的地方，这也是为什么\
    \ JavaScript 库会存在下去。浏览器总是会出错，而旧版浏览器也不会被终端用户升级，要么是因为上述的公司规定，要么是因为人们根本不在意跟上时代。\n\
    \n"
- fmt: "\nSo, while the practice of building software for certain browsers is on the\
    \ decline (at least for JavaScript—with CSS, we have a whole other headache ahead\
    \ of us), we still have to be mindful of certain sins.\n\n### Sin #1: Not Playing\
    \ Nice With Other Scripts\n\nHere’s the first one, which we still see a lot on\
    \ the Web. Sadly, it is very common in demo code for APIs and Web services: global\
    \ variables, functions and DOM-1 event handlers.\n\nWhat do I mean by these? Consider\
    \ the following:\n\n•Every script in the HTML document has the same rights as\
    \ the others and can, if need be, overwrite what other scripts have done before.\n\
    \n•If you define a variable or function name, and some other include uses the\
    \ same name, the initial one will be overwritten.\n\n•The same applies to event\
    \ handlers if you attach them the old-school `onEvent` way.\n\nSay you have the\
    \ script `script_one.js`:\n\n```javascript\nx = 5;\n\nfunction init(){\n  alert('script\
    \ one init');\n  document.getElementsByTagName('h1')[0].onclick = function(){\
    \ own    this.style.background = 'blue';\n  }\n}\n\nalert('x is '+x);\nwindow.onload\
    \ = init;\n```\n\nAnd immediately after this one, you include another script,\
    \ `script_two.js`:\n\n```javascript\nx = 10;\n\nfunction init(){\n  alert('script\
    \ two init');\n  document.getElementsByTagName('h1')[0].onclick = function(){\n\
    \    this.style.color = 'white';\n  }\n}\n\nalert('x is '+x);\nwindow.onload =\
    \ init;\n```\n\nIf you [open this document in a browser](http://icant.co.uk/articles/sins/sins_globals.html),\
    \ you will find that `x` turns from 5 to 10 and that the first `init()` is never\
    \ called. The script two init `alert()` does not come up, nor does the `h1` get\
    \ a blue background when you click it. Only the text turns to white, which renders\
    \ it invisible.\n\nThe solution is not to use `onEvent` handlers, but rather the\
    \ proper DOM level 2 event handlers (they don’t work in IE, but let’s not worry\
    \ about that at the moment—remember, this is what libraries are for). Furthermore,\
    \ wrap your functions in another with a more unique name to prevent them from\
    \ overriding each other.\n\n```javascript\nvar scriptOne = function(){\n  var\
    \ x = 5;\n  function init(){\n    alert('script one init');\n    document.getElementsByTagName('h1')[0].addEventListener(\n\
    \      'click',\n      function(e){\n        var t = e.target;\n        t.style.background\
    \ = 'blue';\n      },\n      false\n    );\n  }\n  alert('x inside is '+x);\n\
    \  return {init:init};\n}();\n\nwindow.addEventListener('load',scriptOne.init,false);\n\
    alert('x outside is '+x);\n\nvar scriptTwo = function(){\n  var x = 10;\n  function\
    \ init(){\n    alert('script two init');\n    document.getElementsByTagName('h1')[0].addEventListener(\n\
    \      'click',\n      function(e){\n        var t = e.target;\n        t.style.color\
    \ = 'white';\n      },\n      false\n    );\n  }\n  alert('x inside is '+x);\n\
    \  return {init:init};\n}();\n\nwindow.addEventListener('load',scriptTwo.init,false);\n\
    alert('x outside is '+x);\n```\n\nIf you [run this in a browser (not Internet\
    \ Explorer 6)](http://icant.co.uk/articles/sins/sins_globals_fixed.html), everything\
    \ will come up as you expect: `x` is first 5, then 10 on the inside, and the heading\
    \ turns blue and white when you click it. Both `init()` functions are called,\
    \ too.\n\nYou also get an error. Because `x` is not defined outside the functions,\
    \ the `alert('x outside is '+x);` never works.\n\nThe reason is that by moving\
    \ the `x` into the `scriptOne` and `scriptTwo` functions and adding the `var`\
    \ keyword in front of them, we have made them a part of those functions but hid\
    \ them from the outside world. This is called a closure and is [explained in detail\
    \ here](https://developer.mozilla.org/en/Core_JavaScript_1.5_Guide/Working_with_Closures).\
    \ It is probably the most powerful feature of JavaScript.\n\nUsing closures and\
    \ `var` keywords, you won’t have the problem of variables with similar names overriding\
    \ each other. This also applies in jQuery: you should [namespace your functions](http://jquery-howto.blogspot.com/2009/01/namespace-your-javascript-function-and.html).\n\
    \nThis can be tough to grasp, so let’s look at a simpler example:\n\n```javascript\n\
    var x = 4;\nvar f = 3;\nvar me = 'Chris';\nfunction init(){}\nfunction load(){}\n\
    ```\n\nAll of these are global variables and functions now. Any other script having\
    \ the same variables will override these.\n\nYou can nest them in an object to\
    \ avoid this:\n\n```javascript\nvar longerAndMoreDistinct = {\n  x : 4,\n  f :\
    \ 3,\n  me : 'Chris',\n  init : function(){},\n  load : function(){}\n}\n```\n\
    \nThat way, only the `longerAndMoreDistinct` is global. If you want to run this\
    \ function, you now have to call `longerAndMoreDistinct.init()` instead of `init()`.\
    \ You can reach me as `longerAndMoreDistinct.me` and so on. I don’t like this\
    \ because I have to switch from one notation to another. So, we can do the following:\n\
    \n```javascript\nvar longerAndMoreDistinct = function(){\n  var x = 4;\n  var\
    \ f = 3;\n  var me = 'Chris';\n  function init(){}\n  function load(){}\n}();\n\
    ```\n\nYou define `longerAndMoreDistinct`.\n\n### Sin #2: Believing Instead Of\
    \ Testing\n\nThe next big sin related to implementing JavaScript is expecting\
    \ everything to go right: every parameter being in the right format, every HTML\
    \ element you try to enhance being truly available, and every end user entering\
    \ information in the right format. This will never be the case, and that last\
    \ assumption is an especially bad one because it allows malicious users to inject\
    \ dangerous code.\n\nWhen you write JavaScript and give it to the world or integrate\
    \ it in a product that will be maintained by a third party, a little paranoia\
    \ is a good thing.\n\n`typeof` is your friend. Regular expressions are your friend.\
    \ `indexOf()`, `split()` and `length` are your friends. In other words, do everything\
    \ you can to make sure that incoming data is the right format.\n"
  raw: "So, while the practice of building software for certain browsers is on the\
    \ decline (at least for JavaScript—with CSS, we have a whole other headache ahead\
    \ of us), we still have to be mindful of certain sins.\n\n### Sin #1: Not Playing\
    \ Nice With Other Scripts\n\nHere’s the first one, which we still see a lot of\
    \ on the Web. Sadly, it is very common in demo code for APIs and Web services:\
    \ global variables, functions and DOM-1 event handlers.\n\nWhat do I mean by these?\
    \ Consider the following:\n\n•Every script in the HTML document has the same rights\
    \ as the others and can, if need be, overwrite what other scripts have done before.\n\
    \n•If you define a variable or function name, and some other include uses the\
    \ same name, the initial one will be overwritten.\n\n•The same applies to event\
    \ handlers if you attach them the old-school onEvent way.\n\nSay you have the\
    \ script script_one.js:\n\nx = 5;\n\nfunction init(){\n\nalert('script one init');\n\
    \ndocument.getElementsByTagName('h1')[0].onclick = function(){\n\nthis.style.background\
    \ = 'blue';\n\n}\n\n}\n\nalert('x is '+x);\n\nwindow.onload = init;\n\nAnd immediately\
    \ after this one, you include another script, script_two.js:\n\nx = 10;\n\nfunction\
    \ init(){\n\nalert('script two init');\n\ndocument.getElementsByTagName('h1')[0].onclick\
    \ = function(){\n\nthis.style.color = 'white';\n\n}\n\n}\n\nalert('x is '+x);\n\
    \nwindow.onload = init;\n\nIf you [open this document in a browser](http://icant.co.uk/articles/sins/sins_globals.html),\
    \ you will find that x turns from 5 to 10 and that the first init() is never called.\
    \ The script two init alert() does not come up, nor does the h1 get a blue background\
    \ when you click it. Only the text turns to white, which renders it invisible.\n\
    \nThe solution is not to use onEvent handlers, but rather the proper DOM level\
    \ 2 event handlers (they don’t work in IE, but let’s not worry about that at the\
    \ moment—remember, this is what libraries are for). Furthermore, wrap your functions\
    \ in another with a more unique name to prevent them from overriding each other.\n\
    \nvar scriptOne = function(){\n\nvar x = 5;\n\nfunction init(){\n\nalert('script\
    \ one init');\n\ndocument.getElementsByTagName('h1')[0].addEventListener(\n\n\
    'click',\n\nfunction(e){\n\nvar t = e.target;\n\nt.style.background = 'blue';\n\
    \n},\n\nfalse\n\n);\n\n}\n\nalert('x inside is '+x);\n\nreturn {init:init};\n\n\
    }();\n\nwindow.addEventListener('load',scriptOne.init,false);\n\nalert('x outside\
    \ is '+x);\n\nvar scriptTwo = function(){\n\nvar x = 10;\n\nfunction init(){\n\
    \nalert('script two init');\n\ndocument.getElementsByTagName('h1')[0].addEventListener(\n\
    \n'click',\n\nfunction(e){\n\nvar t = e.target;\n\nt.style.color = 'white';\n\n\
    },\n\nfalse\n\n);\n\n}\n\nalert('x inside is '+x);\n\nreturn {init:init};\n\n\
    }();\n\nwindow.addEventListener('load',scriptTwo.init,false);\n\nalert('x outside\
    \ is '+x);\n\nIf you [run this in a browser (not Internet Explorer 6)](http://icant.co.uk/articles/sins/sins_globals_fixed.html),\
    \ everything will come up as you expect: x is first 5, then 10 on the inside,\
    \ and the heading turns blue and white when you click it. Both init() functions\
    \ are called, too.\n\nYou also get an error. Because x is not defined outside\
    \ the functions, the alert('x outside is '+x); never works.\n\nThe reason is that\
    \ by moving the x into the scriptOne and scriptTwo functions and adding the var\
    \ keyword in front of them, we have made them a part of those functions but hid\
    \ them from the outside world. This is called a closure and is [explained in detail\
    \ here](https://developer.mozilla.org/en/Core_JavaScript_1.5_Guide/Working_with_Closures).\
    \ It is probably the most powerful feature of JavaScript.\n\nUsing closures and\
    \ var keywords, you won’t have the problem of variables with similar names overriding\
    \ each other. This also applies in jQuery: you should [namespace your functions](http://jquery-howto.blogspot.com/2009/01/namespace-your-javascript-function-and.html).\n\
    \nThis can be tough to grasp, so let’s look at a simpler example:\n\nvar x = 4;\n\
    \nvar f = 3;\n\nvar me = 'Chris';\n\nfunction init(){}\n\nfunction load(){}\n\n\
    All of these are global variables and functions now. Any other script having the\
    \ same variables will override these.\n\nYou can nest them in an object to avoid\
    \ this:\n\nvar longerAndMoreDistinct = {\n\nx : 4,\n\nf : 3,\n\nme : 'Chris',\n\
    \ninit : function(){},\n\nload : function(){}\n\n}\n\nThat way, only the longerAndMoreDistinct\
    \ is global. If you want to run this function, you now have to call longerAndMoreDistinct.init()\
    \ instead of init(). You can reach me as longerAndMoreDistinct.me and so on. I\
    \ don’t like this because I have to switch from one notation to another. So, we\
    \ can do the following:\n\nvar longerAndMoreDistinct = function(){\n\nvar x =\
    \ 4;\n\nvar f = 3;\n\nvar me = 'Chris';\n\nfunction init(){}\n\nfunction load(){}\n\
    \n}();\n\nYou define longerAndMoreDistinct as the outcome of a function without\
    \ a name that gets immediately executed (this is the () on the last line). This\
    \ now means that all of the variables and functions inside exist only in this\
    \ world and cannot be accessed from outside at all. If you want to make them accessible\
    \ from outside, you need to return them to the outside world:\n\nvar longerAndMoreDistinct\
    \ = function(){\n\nvar x = 4;\n\nvar f = 3;\n\nvar me = 'Chris';\n\nfunction load(){}\n\
    \nreturn {\n\ninit:function(){}\n\n}\n\n}();\n\nNow init() is available as longerAndMoreDistinct.init()\
    \ again. This construct of wrapping things in an anonymous function and returning\
    \ some of them is called the [Module pattern](http://www.wait-till-i.com/2007/07/24/show-love-to-the-module-pattern/),\
    \ and it keeps your variables safe. Personally, I still hate the shift in syntax,\
    \ so I came up with the [revealing module pattern](http://www.wait-till-i.com/2007/08/22/again-with-the-module-pattern-reveal-something-to-the-world/).\
    \ Instead of returning the real function, all I do is return a pointer to it:\
    \ \n\nvar longerAndMoreDistinct = function(){\n\nvar x = 4;\n\nvar f = 3;\n\n\
    var me = 'Chris';\n\nfunction load(){}\n\nfunction init(){}\n\nreturn {\n\ninit:init\n\
    \n}\n\n}();\n\nThis way, I can make things either available or not available simply\
    \ by adding to the object that is returned.\n\nIf you don’t need to give anything\
    \ to the world and just want to run some code and keep all of your variables and\
    \ function names safe, you can dispense with the name of the function:\n\n(function(){\n\
    \nvar x = 4;\n\nvar f = 3;\n\nvar me = 'Chris';\n\nfunction load(){}\n\nfunction\
    \ init(){}\n\n})();\n\nUsing var and wrapping code in this construct makes it\
    \ inaccessible to the outside world, but still makes it execute.\n\nYou may find\
    \ this to be complex stuff, but there is a good way to check your code. [JSLint](http://www.jslint.com/)\
    \ is a validator for JavaScript, much like the HTML or CSS validators, and it\
    \ tells you all the things that might be wrong with your code.\n\n### Sin #2:\
    \ Believing Instead Of Testing\n\nThe next big sin related to implementing JavaScript\
    \ is expecting everything to go right: every parameter being in the right format,\
    \ every HTML element you try to enhance being truly available, and every end user\
    \ entering information in the right format. This will never be the case, and that\
    \ last assumption is an especially bad one because it allows malicious users to\
    \ inject dangerous code.\n\nWhen you write JavaScript and give it to the world\
    \ or integrate it in a product that will be maintained by a third party, a little\
    \ paranoia is a good thing.\n\ntypeof is your friend. Regular expressions are\
    \ your friend. indexOf(), split and length are your friends. In other words, do\
    \ everything you can to make sure that incoming data is the right format.\n\n\
    You will get a lot of errors with native JavaScript; if you do anything wrong,\
    \ you’ll know what happened. The annoying thing about most JavaScript libraries\
    \ is that when they fail to execute some functionality, they do it silently. The\
    \ maintainer is left guessing and has to run through all the code and start debugging\
    \ with stop points (or—shudder!—alerts()) to reverse-engineer where you entered\
    \ instable code. To avoid this, simply wrap whatever you can in a test case rather\
    \ than try to access it."
