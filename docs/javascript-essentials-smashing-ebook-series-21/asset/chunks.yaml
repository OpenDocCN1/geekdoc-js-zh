  trans: "\n\n反馈：这种方法的问题（我仍然看到许多开发者在使用它）是，在每次循环迭代时都会不必要地重新访问数组长度。这可能会导致非常慢，特别是在处理\
    \ `HTMLCollections` 的时候（在这种情况下，缓存长度可能比反复访问快多达 190 倍，正如 Nicholas C. Zakas 在他的书籍\
    \ [High-Performance JavaScript](http://shop.oreilly.com/product/9780596802806.do)\
    \ 中提到的那样）。以下是几种缓存数组长度的优方案。\n\n```javascript\n/* cached outside loop */\nvar len\
    \ = myArray.length;\nfor ( var i = 0; i < len; i++ ) {\n}\n```\n\n```javascript\n\
    /* cached inside loop */\nfor ( var i = 0, len = myArray.length; i < len; i++\
    \ ) {\n}\n```\n\n```javascript\n/* cached outside loop using while */\nvar len\
    \ = myArray.length;\nwhile (len--) {\n}\n```\n\n有一项 [jsPerf](http://jsperf.com/)\
    \ 测试比较了在循环内和外部缓存数组长度的性能优势，使用了前缀递增、递减等方法，你也可以[查阅](http://jsperf.com/caching-array-length/7)，如果你想研究哪种性能最好。\n\
    \n### 问题 7\n\n问题：使用 jQuery 的 `$.each()` 来遍历对象和数组，而在某些情况下，其他地方使用了 `for` 循环。\n\n\
    反馈：在 jQuery 中，我们有两种方式可以无缝地遍历对象和数组。通用的 [$.each](http://api.jquery.com/jQuery.each/)\
    \ 会同时遍历这两种类型，而 [$.fn.each()](http://api.jquery.com/each/) 则专门遍历 jQuery 对象（如果你想在后者中使用标准对象，可以使用\
    \ `$()` 将其封装）。虽然底层的 `$.each` 性能比 `$.fn.each()` 更好，但标准的 JavaScript `for` 和 `while`\
    \ 循环的性能都远优于这两者，这一个 [jsPerf 测试](http://jsperf.com/jquery-each-vs-for-loop/24/)\
    \ 已经证明了这一点。以下是一些性能也更好的循环替代方案的示例：\n\n```javascript\n/* jQuery $.each */\n$.each(a,\
    \ function() {\n  e = $(this);\n});\n```\n\n```javascript\n/* classic for loop\
    \ */\nvar len = a.length;\nfor ( var i = 0; i < len; i++ ) {\n  //如果这必须是一个 jQuery\
    \ 对象，则..\n  e = $(a[i]);\n  //否则只需 e = a[i] 即可\n};\n```\n\n```javascript\n/* reverse\
    \ for loop */\nfor ( var i = a.length; i-- ) {\n  e = $(a[i]);\n}\n```\n\n```javascript\n\
    /* classic while loop */\nvar i = a.length;\nwhile (i--) {\n  e = $(a[i]);\n}\n\
    ```\n\n```javascript\n/* alternative while loop */\nvar i = a.length - 1;\nwhile\
    \ ( e = a[i--] ) {\n  $(e)\n};\n```\n\n你可能会发现 Angus Croll 关于“[重新思考 JavaScript\
    \ 循环](http://javascriptweblog.wordpress.com/2010/10/11/rethinking-javascript-for-loops/)”的文章是对这些建议的一个有趣的补充。\n\
    \n鉴于这是一个以数据为中心的应用，每个对象或数组中可能包含大量数据，你应该考虑重构以使用其中一种方法。从可扩展性的角度来看，你希望从处理密集型程序中尽可能减少毫秒，因为当页面上有数百或数千个元素时，这些时间会累积。\n\
    \n### 问题 8\n\n问题：正在使用字符串拼接在内存中构建 JSON 字符串。\n\n反馈：可以通过更优的方法来实现。例如，为什么不使用 `JSON.stringify()`\
    \ 呢？该方法接受一个 JavaScript 对象并返回其 JSON 等表示。对象通常可以根据你的需要复杂或深度嵌套，这几乎会产生更简单、更短的解决方案。\n\
    \n```javascript\nvar myData = {};\nmyData.dataA = [’a’, ’b’, ’c’, ’d’];\nmyData.dataB\
    \ = {\n  ’animal’: ’cat’,\n  ’color’: ’brown’\n};\nmyData.dataC = {\n  ’vehicles’:\
    \ [{\n    ’type’: ’ford’,\n    ’tint’: ’silver’,\n    ’year’: ’2015’\n  }, {\n\
    \    ’type’: ’honda’,\n    ’tint’: ’black’,\n    ’year’: ’2012’\n  }]\n};\nmyData.dataD\
    \ = {\n  ’buildings’: [{\n    ’houses’: [{\n      ’streetName’: ’sycamore close’,\n\
    \      ’number’: ’252’\n    }, {\n      ’streetName’: ’slimdon close’,\n     \
    \ ’number’: ’101’\n    }]\n  }]\n};\nconsole.log(myData); //object\nvar jsonData\
    \ = JSON.stringify(myData);\nconsole.log(jsonData);\n\n/*\n{\"dataA\":[\"a\",\"\
    b\",\"c\",\"d\"],\"dataB\":{\"animal\":\"cat\",\"color\":\"brown\"},\"dataC\"\
    :{\"vehicles\":[{\"type\":\"ford\",\"tint\":\"silver\",\"year\":\"2015\"},{\"\
    type\":\"honda\",\"tint\":\"black\",\"year\":\"2012\"}]},\"dataD\":{\"buildings\"\
    :[{\"houses\":[{\"streetName\":\"sycamore close\",\"number\":\"252\"},{\"streetName\"\
    :\"slimdon close\",\"number\":\"101\"}]}]}}\n*/\n```\n\n作为一个额外的调试技巧，如果你想在控制台中以格式化形式打印\
    \ JSON 以便阅读，那么为 `stringify()` 添加以下额外参数可以实现这一目标：\n\n```javascript\nJSON.stringify({\
    \ foo: \"hello\", bar: \"world\" }, null, 4);\n```\n\n### 问题 9\n\n问题：使用的命名空间模式在技术上是无效的。\n\
    \n反馈：虽然命名空间在应用程序的其他部分的实现正确，但对命名空间存在的初始检查是无效的。以下是你目前的代码：\n\n```javascript\nif (\
    \ !MyNamespace ) {\n  MyNamespace = { };\n}\n```\n\n问题是 `!MyNamespace` 将抛出 `ReferenceError`，因为变量\
    \ `MyNamespace` 从未被声明。更好的模式是利用内部变量声明进行布尔转换，如下：\n\n```javascript\nif ( !MyNamespace\
    \ ) {\n  var MyNamespace = { };\n}\n```\n\n//或\n\n```javascript\nvar myNamespace\
    \ = myNamespace || {};\n```\n\n// 尽管有更高效的方法可以：\n// myNamespace || ( myNamespace\
    \ = {} );\n// jsPerf 测试: [`jsperf.com/conditional-assignment`](http://jsperf.com/conditional-assignment)\n\
    //或\n\n```javascript\nif ( typeof MyNamespace == ’undefined’ ) {\n  var MyNamespace\
    \ = { };\n}\n```\n\n当然，这可以通过许多其他方式完成。如果你对阅读更多命名空间模式感兴趣（以及关于命名空间扩展的一些想法），我最近写了“[本质\
    \ JavaScript 命名空间模式](http://addyosmani.com/blog/essential-js-namespacing/)”。[Juriy\
    \ Zaytsev](http://twitter.com/kangax) 也有有一篇关于命名空间模式的[全面文章](http://perfectionkills.com/unnecessarily-comprehensive-look-into-a-rather-insignificant-issue-of-global-objects-creation/)。\n\
    \n### 结论\n\n就是这些。审查代码是尽可能在高水平上强制执行并维护编码标准质量、正确性和一致性的极佳方法。我强烈建议所有开发者在日常项目中尝试它们，因为它们对于开发者和代码审查者来说都是极佳的学习工具。下次见之前，尝试让你的代码通过审查，并祝你的项目顺利！\n\
    \n# 通过七步测试找到正确的 JavaScript 解决方案\n\nChristian Heilmann\n\n作为 Web 开发者和设计师，我们现在是有的所挑选。为了构建复杂的\
    \ Web ，或者只是为网站添加一些高度交互的元素，我们有许多预构建的解决方案可供选择。每个库都带有组件和解决方案，每个开发者都试图通过发布针对特定界面问题的酷炫\
    \ JavaScript 解决方案来证明自己。\n\n如此多的选择让我们很容易挑选，而这正是问题出现的地方。在大多数情况下，我们根据解决方案的便利性来衡量它的质量。我们选择一个解决方案而不是另一个的主要原因是：\n\
    \n它能完成我需要的吗？\n• 它看起来酷吗？\n• 它听起来好用吗？\n• 我想用它吗？\n• 它使用了我使用的框架吗？\n\n然而，你真正应该寻找的是不同的：\n\
    \n• 解决方案稳定吗？如果这个不可用，是否有良好的替代方案？\n• 易于自定义吗？你需要 JavaScript 专家才能修改组件吗？\n• 易用性和可访问性如何？没有鼠标或使用移动浏览器的用户会被阻挡吗？\n\
    • 你理解发生了什么吗？你能修复问题并向他人解释吗？\n\n"
- fmt: "\nWhat is supported, and how can you extend functionality? A new browser and\
    \ client request is always around the corner? In this article, we’ll show some\
    \ ways to find out more about these issues. First of all, though, understanding\
    \ what it means to develop for the Web is important.\n\n## It’s Not About You\n\
    \nMost of the reasons why we choose a particular solution right away are very\
    \ much about us, and this is where we tread on thin ice. We don’t consume what\
    \ we put on the Web; rather, people we don’t know do, and we can’t make assumptions\
    \ about their ability, set-up, technical understanding or taste. We won’t make\
    \ our product a success; we only build it, and thus we are the worst testers of\
    \ it possible.\n\nI’ve been developing for the Web professionally for over 10\
    \ years now, working on everything from personal blogs to multi-language enterprise\
    \ CMS solutions to complex Web applications, and I’ve learnt one thing on the\
    \ journey: never build for yourself or the client. Instead, build for the people\
    \ who will use the product and the poor person who has to take over the project\
    \ when you leave.\n\nMuch as we have to act now to minimize our massive carbon\
    \ footprint, we need to leave a cleaner Web behind. To keep the Web a thriving\
    \ market and sustainable work environment, we have to change the way we work in\
    \ it and leave behind unmaintainable, bloated and semi-workable, albeit pretty,\
    \ solutions. We have to make it easier for people to use Web applications and\
    \ save other developers from wasting hours trying to understand what we did when\
    \ they are asked to change or extend it at a later stage.\n\n## Introducing The\
    \ 7-Step Test For JavaScript Widgets\n\nTo this end, I’ve put together a seven-step\
    \ test to apply to any out-of-the-box widget you find. All of the recommendations\
    \ have a rationale, so please ponder it before dismissing the arguments as “elitist”\
    \ or “not really suitable to our environment.”\n\nLet’s not forget that even when\
    \ something is free, its developer will try to sell it to you for the fame, and\
    \ many a solution is defended tooth and nail on mailing lists instead of being\
    \ changed or updated. The reason is that, as developers we are always on the move.\
    \ Maintaining and extending an old solution is not as sexy as creating a cool\
    \ new one. This leads to ruins that once enjoyed love when they were state of\
    \ the art but now rust away on the Internet.\n\nTo kick the tires of any out-of-the\
    \ box solution, I mostly use one tool: the Firefox Web developer toolbar. It is\
    \ available [on the Firefox Add-On website](https://addons.mozilla.org/en-US/firefox/addon/60)\
    \ and gives you an easy way to test what’s happening in your widget of choice.\n\
    \nOkay, here goes: seven things to test when deciding on a JavaScript solution.\n\
    \n### 1. What Happens If JavaScript Is Turned Off?\n\nThe first test I do with\
    \ any widget is turn off JavaScript… not after the document has loaded but before.\
    \ Turning off JavaScript with the Web developer toolbar is very easy. Simply select\
    \ “Disable All JavaScript” from the “Disable” menu and reload the page:\n\n```\n\
    ![litmus-disable-javascript.jpg](Images/litmus-disable-javascript.jpg)\n```\n\n\
    The rationale is that there are a lot of reasons why JavaScript may not be used:\
    \ company proxies or personal firewalls could filter it out, other scripts could\
    \ create errors and mess with yours, or the system in use could simply not have\
    \ JavaScript enabled. Think of mobile environments, for example.\n\nYou don’t\
    \ need full functionality when JavaScript is not available, just a working interface\
    \ that doesn’t overload users and interactive elements that work. If a button\
    \ does nothing when users activate it, those users will stop trusting you; after\
    \ all, you haven’t kept your promises.\n\nOverloading is another issue. A lot\
    \ of widgets use CSS and JavaScript to squeeze a lot of content into a very small\
    \ space: think tabbed content elements and image carousels. What should be their\
    \ fallback? If you turn off JavaScript and have 50 pictures where you planned\
    \ for 2, then that would be a good user experience. A better fallback would be\
    \ a server-side solution for the same functionality or to show the first 2 and\
    \ then offer a link to a gallery page with the remaining pictures.\n\nSometimes\
    \ the JavaScript for a particular widget is actually very good but the demo websites\
    \ have been done badly. Hiding elements with CSS and then revealing them with\
    \ JavaScript, for example, is very common. But if JavaScript is turned off, the\
    \ solution will break. Good demos and solutions use JavaScript to add a class\
    \ to the body of the document and make all of the CSS dependent on that class.\n\
    \nThe trick that any good JavaScript widget should do is to make any functionality\
    \ depend on JavaScript by using JavaScript; that way, you never have any functionality\
    \ that won’t work. This technique is called “unobtrusive JavaScript,” and I have\
    \ [written a course on it](http://onlinetools.org/articles/unobtrusivejavascript/)\
    \ and [set a few rules for it](http://icant.co.uk/articles/seven-rules-of-unobtrusive-javascript/)\
    \ a while back.\n\n### 2. How To Change The Look, Feel And Content?\n\nA widget\
    \ whose look and feel are hard-coded is a pain to maintain. You cannot expect\
    \ future designers to know how to change a certain color by hunting through your\
    \ JavaScript files. This is how we end up with bloated CSS files, because people\
    \ add random IDs and classes to enhance the specificity of their CSS selectors.\n\
    \nGood widgets have their look and feel contained in a CSS file and give you handles\
    \ (i.e. dynamically applied classes) to apply your own styling. If you find yourself\
    \ having to change JavaScript to change the look and feel, alarm bells should\
    \ go off in your head.\n\nThis gets worse if you have to change JavaScript to\
    \ change the look and feel. This gets worse if you have to change JavaScript to\
    \ change the look and feel. This gets worse if you have to change JavaScript to\
