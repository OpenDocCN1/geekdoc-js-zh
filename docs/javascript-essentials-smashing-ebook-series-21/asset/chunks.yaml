    \  }\n}\n```\n\n下面的示例演示了如何使用这来规范化获取 `XMLHttpRequest` 对象。\n\n```javascript\nvar\
    \ utils = {\n  getXHR: null\n};\n\nif(window.XMLHttpRequest){\n  utils.getXHR\
    \ = function(){\n    return new XMLHttpRequest;\n  }\n}else if(window.ActiveXObject){\n\
    \  utils.getXHR = function(){\n    /* this has been simplified for example sakes\
    \ */\n    return new ActiveXObject('Microsoft.XMLHTTP');\n  }\n}\n```\n\n关于一个很好的例子，Stoyan\
    \ Stefanov 在他的书籍 [JavaScript Patterns](http://shop.oreilly.com/product/9780596806767.do)\
    \ 中将此应用于跨浏览器的事件监听器绑定与移除：\n\n```javascript\nvar utils = {\n  addListener: null,\n\
    \  removeListener: null\n};\n\n// the implementation\nif (typeof window.addEventListener\
    \ === 'function') {\n  utils.addListener = function ( el, type, fn ) {\n    el.addEventListener(type,\
    \ fn, false);\n  };\n  utils.removeListener = function ( el, type, fn ) {\n  \
    \  el.removeEventListener(type, fn, false);\n  };\n} else if (typeof document.attachEvent\
    \ === 'function') { // IE\n  utils.addListener = function ( el, type, fn ) {\n\
    \    el.attachEvent('on' + type, fn);\n  };\n  utils.removeListener = function\
    \ ( el, type, fn ) {\n    el.detachEvent('on' + type, fn);\n  };\n} else { //\
