    which shows you exactly what Google sees when it crawls your website. You can
    access it in your dashboard in Google Webmaster Tools under “Diagnostics.”


    ![webmastertools-2.jpg](Images/webmastertools-2.jpg)


    Enter a hash bang URL from your website, and click “Fetch.” Google will tell you
    whether the fetch has succeeded and, if it has, will show you the content it sees.


    ![webastertools-3.jpg](Images/webastertools-3.jpg)


    If Fetch as Googlebot works as expected, then you’re returning the escaped URLs
    correctly. But you should check a few more things:


    •[Validate your site map](http://www.validome.org/google/validate).


    •Manually try the URLs in your site map. Make sure to try the hash-bang and escaped
    versions.


    •Check the Google result for your website by searching for site:[www.yoursite.com](http://www.yoursite.com).


    ### Making Pretty URLs With HTML5


    Twitter leaves the hash bang visible in its URLs, like this:


    http://twitter.com/#!/ZackGrossbart


    This works well for AJAX crawling, but again, it’s slightly ugly. You can make
    your URLs prettier by integrating [HTML5 history](http://www.w3.org/TR/html5/history.html).


    Spiffy UI uses HTML5 history integration to turn a hash-bang URL like this…


    http://www.spiffyui.org#!css


    … into a pretty URL like this:


    http://www.spiffyui.org?css


    HTML5 history makes it possible to change this URL parameter, because the hash
    tag is the only part of the URL that you can change in HTML4. If you change anything
    else, the entire page reloads. HTML5 history changes the entire URL without refreshing
    the page, and we can make the URL look any way we want.


    This nicer URL works in our application, but we still list the hash-bang version
    on our site map. And when browsers access the hash-bang URL, we change it to the
    nicer one with a little JavaScript.


    ### Cloaking


    Earlier, I mentioned cloaking. It is the practice of trying to boost a website’s
    ranking in search results by showing one set of pages to Google and another to
    regular browsers. Google doesn’t like cloaking and may [remove offending websites
    from its search index](http://www.google.com/support/webmasters/bin/answer.py?answer=66355).


    AJAX-crawling applications always show different results to Google than to regular
    browsers, but it isn’t cloaking if the HTML snippets contain the same content
    that the user would see in the browser. The real mystery is how Google can tell
    whether a website is cloaking or not; crawlers can’t compare content programmatically
    because they don’t run JavaScript. It’s all part of Google’s Googley power.


    Regardless of how it’s detected, cloaking is a bad idea. You might not get caught,
    but if you do, you’ll be removed from the search index.


    ### Hash Bang Is A Little Ugly, But It Works


    I’m an engineer, and my first response to this scheme is “Yuck!” It just feels
    wrong; we’re warping the purpose of URLs and relying on magic strings. But I understand
    where Google is coming from; the problem is extremely difficult. Search engines
    need to get useful information from inherently untrustworthy sources: us.


    Hash bangs shouldn’t replace every URL on the Web. Some websites have had [serious
    problems](http://www.webmonkey.com/2011/02/gawker-learns-the-hard-way-why-hash-bang-urls-are-evil/)
    with hash-bang URLs because they rely on JavaScript to serve content. Simple pages
    don’t need hash bangs, but AJAX pages do. The URLs do look a bit ugly, but you
    can fix that with HTML5.


    #### Further Reading


    We’ve covered a lot in this article. Supporting AJAX crawling means that you need
    to change your client’s code and your server’s code. Here are some links to find
    out more:


    •“[Making AJAX Applications Crawlable](http://code.google.com/web/ajaxcrawling/),”
    Google Code


    •“[Session History and Navigation](http://www.w3.org/TR/html5/history.html),”
    HTML5 specification, section 5.4


    •[sitemaps.org](http://www.sitemaps.org/)


    •[Google Webmaster Tools](https://www.google.com/webmasters/tools)


    •[Spiffy UI source code](https://code.google.com/p/spiffyui/source/checkout),
    with a complete example of AJAX crawling.


    •Thanks to Kristen Riley for help with some of the images in this article.


