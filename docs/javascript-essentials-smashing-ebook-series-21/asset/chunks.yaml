    Zack Grossbart 是一位[工程师](http://www.zackgrossbart.com/hackito/)、设计师和[作者](http://www.zackgrossbart.com/blog/toc/)。他是
    [Spiffy UI](http://www.spiffyui.org/) 项目的创始成员，[WordPress 编辑日历](http://stresslimitdesign.com/editorial-calendar-plugin)插件的架构师，也是
    [NetIQ](http://www.netiq.com/) 的顾问工程师。


    Zack 在五岁时就开始尝试从软盘加载 DOS 了。他在 15 岁时开始从事计算机专业工作，并在 16 岁时创立了自己的第一家软件公司。Zack 与妻子女儿住在马萨诸塞州的剑桥市。

