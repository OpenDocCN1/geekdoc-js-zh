    \ calculate the horizontal leg as the cosine of the angle and the vertical leg\
    \ as the sine of the angle:\n\n![sincos.png](Images/sincos.png)\n\nHow is this\
    \ relevant to a circle? Well, it is pretty simple to find a right-angle triangle\
    \ in a circle to every point of it:\n\n![circle.png](Images/circle.png)\n\nThis\
    \ means that if you want to plot something on a circle (or draw one), you can\
