    最后一点需要考虑的是未来会发生什么。声称组件可以在“任何环境下工作”的说法是荒谬的，因为这是无法实现的。Web 的强大之处在于，软件解决方案可以适应它们所处的环境。如果你使用
    `Netscape 4`，你应该看到几张图片；如果你使用最新的 `Webkit` 浏览器，你应该看到一个带有动画和淡入效果的精美图片轮播；此类等等。


    一个良好的组件应该有一份经过证明的测试报告，涵盖它在哪些浏览器和环境中进行过测试，以及已知问题是什么。问题永远存在，声称没有问题是傲慢或无知的。


    升级你的组件应该是简单且无痛的，并且应该有一套版本控制机制，新版本具有向后兼容性。


    扩展组件应该是很简单的。我们之前讨论过不应限于特定的项目数量或特定的外观和感受。但如果你真的使用一个组件，你会发现你必须重写某些功能并对各种变化做出反应。良好的组件要么拥有一个
    `API`（用于扩展它的编程接口），要么会触发自定义事件供你监听。自定义事件是用户与组件交互中的“有趣时刻”。例如，当你激活按钮时，它会告诉脚本；如果你以某种方式编写组件，你就可以告诉世界（在这种情况下是其他脚本）当它发生某些事情时。你可以通知容器已打开、数据已从
    Web 返回，或者菜单太大无法在右侧显示而必须移动到左侧。


    例如，使用 `Yahoo User Interface` 库构建的组件[带有许多自定义事件](http://developer.yahoo.com/yui/docs/YAHOO.widget.AutoComplete.html#events):


    ![litmus-events.jpg](img/litmus-events.jpg)


    这允许你监控正在发生的情况（例如用于调试）并扩展功能。例如，[AutoComplete 控制的演示页](http://developer.yahoo.com/yui/examples/autocomplete/ac_basic_xhr_log.html)
    在右侧的日志控制台中显示了使用自动补全字段时“底层”发生了什么。


    ![litmus-events-logging.png](img/litmus-events-logging.png)


    通过在 `JavaScript` 中订阅这些事件，将原始功能重写为新功能非常简单；在这种情况下，我们有一个[可以返回照片并允许你收集它们的自动补全功能](http://developer.yahoo.com/yui/examples/autocomplete/ac_flickr_xml.html)。


    ![litmus-event-override.png](img/litmus-event-override.png)


    自定义事件是在扩展组件的同时保持核心代码易于升级的极佳方法。


    关于 关于尺寸最后的最后


    最后要提一点：有些组件开发者使用某个参数来推销他们的解决方案，但那与你的决定完全无关，那就是尺寸。


    广告用语如“20 行 JavaScript 编写的下拉菜单”或“小于 2 KB 的全功能灯箱”听起来很有趣，且利于开发者的自尊心，但实际上，这并不是衡量解决方案质量的尺度。虽然你应该避免使用庞大的
    `JavaScript` 解决方案（比说是 100 KB），但编写得非常通用且易于扩展的代码总是比为了单一目的而编写的代码要大。任何被自豪地吹嘘并打算让开发水平不如初始所有者的人使用的组件，随着时间的推移都会变得越来越大。开发者们喜欢玩数字游戏，但可维护的代码与极端的数字计算是不同的。


    如果你对这类事情感兴趣，可以尝试这个演示场景，Farbrausch 在 2000 年通过 [The Product](http://www.pouet.net/prod.php?which=1221)
    证明了你可以将一个带有音乐和合成语音的七分钟动画压缩到 64 KB 中。


    # 关于 JavaScript 的十个奇异与秘密


    Andy Croxall![lg.php.gif](img/lg.php.gif)


    `JavaScript`。它既怪异又美丽，无疑是帕布罗·毕加索会发明的编程语言。`Null` 显然是一个对象，空数组显然等于 `false`，而函数被随手抛得就像网球一样。


    本文针对对更高级 `JavaScript` 感兴趣的中级开发者。它是 `JavaScript` 奇异之处和深藏不秘密的合集。希望某些章节能让你洞察这些奇特现象如何对你的代码有用，而另一些章节则是纯粹的让人大跌（WTF）的内容。那么，让我们开始吧。


    ### ![lg.php.gif](img/lg.php.gif) 数据类型与定义


    #### 1. Null 是一个对象


    让我们从大家最喜欢的 `JavaScript` 奇异开始，尽管它是如此众所周知。`Null` 显然是一个对象，从矛盾论的角度来看，这完全可以名列前茅。`Null`？一个对象？“当然，`null`
    的定义是有意义值的完全缺失，”你可能会说。你是对的。但事实如此。这里是证明：


    ```javascript

    alert(typeof null); // 弹出 ''object''

    ```


    尽管如此，`null` 并不被视为对象的实例。（如果你不知道的话，`JavaScript` 中的值是基础对象的实例。所以，每个数字都是 `Number` 对象的实例，每个对象都是
    `Object` 对象的实例，以此此类推。）这让我们回到了理智，因为如果 `null` 是值的缺失，那么它显然不可能是任何东西的实例。


    #### 2. NaN 是一个数字


    你认为 `null` 是对象很荒谬？尝试处理一下 `NaN` 的概念吧。


    ```javascript

    alert(typeof NaN); // 弹出 ''Number''

    ```


    ```javascript

    alert(NaN === NaN); // 结果为 false

    ```


    事实上，`NaN` 不等于任何东西。确认某物是 `NaN` 的唯一方法是通过 `isNaN()`。


    #### 3. 无键的数组 == False (关于真值和假值)


    这是另一个深受喜爱的 `JavaScript` 奇异：


    ```javascript

    alert(new Array() == false); // 结果为 true

    ```


    要理解这里发生了什么，你需要理解真值（truthy）和假值（falsy）的概念。它们是某种“简化版的真/假”，如果你是主修逻辑学或哲学的，这会让你愤怒。


    我读过很多关于真值和假值的解释，我觉得最容易理解的是这种：在 `JavaScript` 中，每个非布尔值都有一个内置的布尔标记，当该值被要求像布尔值一样表现时会被调用；例如，当你把它与布尔值进行比较时。


    由于苹果无法与梨比较，当 `JavaScript` 被要求比较不同数据类型的值时，它首先会将它们“强制转换”为共同的数据类型。false`、0、`null`、`undefined`、空字符串和
    `NaN` 最终都会变成 `false`——不是永久性的，仅针对给定的表达式。一个救场的例子：


    ```javascript

    var someVar = 0;

    alert(someVar == false); // 结果为 true

    ```


    在这里，我们正尝试将数字 `0` 与布尔值 `false` 进行比较。由于这些数据类型不兼容，`JavaScript` 秘密地将我们的变量转换为相应的真值或假值，在
    0 的情况下（如我上面所述），它是假值。


    你可能注意到我没有在假值列表中包含空数组。空数组是奇特的东西：它们实际上求值为真，但当与布尔值比较时，表现得像假值。困惑了吗？很有理由。也许再来一个例子？


    ```javascript

    var someVar = []; // 空数组


    alert(someVar == false); // 结果为 true


    if (someVar) alert(''hello''); // alert 运行，所以 someVar 求值为真

    ```


    为了避免强制转换，你可以使用值和类型比较运算符 `===`（与 `==` 不同，后者只比较值）。所以：


    ```javascript

    var someVar = 0;

    alert(someVar == false); // 结果为 true – 0 是假值


    alert(someVar === false); // 结果为 false – 0 是数字，不是布尔值

    ```

