    <input type="submit" id="s" value="go">


    </div>


    </form>


    <div id="results"></div>


    Without JavaScript, this does nothing whatsoever. There is no sensible action
    attribute, and the text field has no name attribute. So, even when you send the
    form off, the server won’t get the information that the user has entered.


    Using jQuery and a JSON data source such as [YQL](http://developer.yahoo.com/yql),
