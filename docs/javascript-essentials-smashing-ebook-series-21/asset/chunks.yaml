- fmt: "\nThis, however, doesn't do anything outside of that function. If this is\
    \ what you need, then great. You may as well discard the name then:\n\n```javascript\n\
    (function(){\n\nvar name = 'Chris';\n\nvar age = '34';\n\nvar status = 'single';\n\
    \nfunction createMember(){\n\n// [...]\n\n}\n\nfunction getMemberDetails(){\n\n\
    // [...]\n}\n\n})();\n```\n\nIf you need to make some of the things reachable\
    \ to the outside, then you need to change this. In order to reach `createMember()`\
    \ or `getMemberDetails()`, you need to return them to the outside world to make\
    \ them properties of `myApplication`:\n\n```javascript\nvar myApplication = function(){\n\
    \nvar name = 'Chris';\n\nvar age = '34';\n\nvar status = 'single';\n\nreturn{\n\
    \ncreateMember:function(){\n\n// [...]\n},\n\ngetMemberDetails:function(){\n//\
    \ [...]\n}\n}\n}();\n\n// myApplication.createMember() and\n// myApplication.getMemberDetails()\
    \ now works.\n```\n\nThis is called a module pattern or singleton. It was mentioned\
    \ a lot by Douglas Crockford and is used very much in the [Yahoo User Interface\
    \ Library YUI](http://developer.yahoo.com/yui). What ails me about this is that\
    \ I need to switch syntaxes to make functions or variables available to the outside\
    \ world. Furthermore, if I want to call one method from another, I have to call\
    \ it preceded by the `myApplication` name. So instead, I prefer simply to return\
    \ pointers to the elements that I want to make public. This even allows me to\
    \ shorten the names for outside use: \n\n```javascript\nvar myApplication = function(){\n\
    \nvar name = 'Chris';\n\nvar age = '34';\n\nvar status = 'single';\n\nfunction\
    \ createMember(){\n\n// [...]\n}\n\nfunction getMemberDetails(){\n\n// [...]\n\
    }\n\nreturn{\n\ncreate:createMember,\n\nget:getMemberDetails\n}\n}();\n\n//myApplication.get()\
    \ and myApplication.create() now work.\n```\n\nI've called this \"[revealing module\
    \ pattern](http://www.wait-till-i.com/2007/08/22/again-with-the-module-pattern-reveal-something-to-the-world/).\"\
    \n\n### Allowing For Configuration\n\nWhenever I've written JavaScript and given\
    \ it to the world, people have changed it, usually when they wanted it to do things\
    \ that it couldn't do out of the box—but also often because I made it too hard\
    \ for people to change things.\n\nThe workaround is to add configuration objects\
    \ to your scripts. I've written about [JavaScript configuration objects](http://www.wait-till-i.com/2008/05/23/script-configuration/)\
    \ in detail, but here's the gist:\n\n- Have an object as part of your whole script\
    \ called `configuration`.\n- In it, store all of the things that people will likely\
    \ change when they use your script:\n    - CSS ID and class names;\n    - Strings\
    \ (such as labels) for generated buttons;\n    - Values such as \"number of images\
    \ being displayed,\" \"dimensions of map\";\n    - Location, locale and language\
    \ settings.\n- Return the object as a public property so that people can override\
    \ it.\n\nMost of the time you can do this as a last step in the coding process.\
    \ I've put together an example in \"[Five things to do to a script before handing\
    \ it over to the next developer](http://www.wait-till-i.com/2008/02/07/five-things-to-do-to-a-script-before-handing-it-over-to-the-next-developer/).\"\
    \n\nIn essence, you want to make it easy for people to use your code and alter\
    \ it to their needs. If you do that, you are much less likely to get confusing\
    \ emails from people who complain about your scripts and refer to changes that\
    \ someone else actually did.\n\n### Interacting With The Back End\n\nOne of the\
    \ main things I learned from all my years with JavaScript is that it is a great\
    \ language with which to make interactive interfaces, but when it comes to crunching\
    \ numbers and accessing data sources, it can be daunting.\n\nOriginally, I learned\
    \ JavaScript to replace Perl because I was sick of copying things to a `cgi-bin`\
    \ folder in order to make it work. Later on, I learned that making a back-end\
    \ language do the main data churning for me, instead of trying to do all in JavaScript,\
    \ makes more sense with regard to security and language.\n\nIf I access a Web\
    \ service, I could get `JSON-P` as the returned format and do a lot of data conversion\
    \ on the client, but why should I when I have a server that has a richer way of\
    \ converting data and that can return the data as `JSON` or `HTML`… and cache\
    \ it for me to boot?\n\nSo, if you want to use `AJAX`, learn about `HTTP` and\
    \ about writing your own caching and conversion proxy. You will save a lot of\
    \ time and nerves in the long run.\n\n### Browser-Specific Code Is A Waste Of\
    \ Time. Use Libraries!\n\nWhen I started Web development, the battle between using\
    \ `document.all` and using `document.layers` as the main way to access the document\
    \ was still raging. I chose `document.layers` because I liked the idea of any\
    \ layer being its own document (and I had written more than enough `document.write`\
    \ solutions to last a lifetime). The layer model failed, but so did `document.all`.\
    \ When Netscape 6 went all out supporting only the W3C DOM model, I loved it,\
    \ but end users didn't care. End users just saw that this browser didn't show\
    \ the majority of the Internets correctly (although it did)—the code we produced\
    \ was what was wrong. We built short-sighted code that supported a state-of-the-art\
    \ environment, and the funny thing about the state of the art is that it is constantly\
    \ changing.\n\nI've wasted quite some time learning the ins and outs of all of\
    \ the browsers and working around their issues. Doing this back then secured my\
    \ career and ensured that I had a great job. But we shouldn't have to go through\
    \ this trial by fire any longer.\n\nLibraries such as `YUI`, `jQuery` and `Dojo`\
    \ are here to help us with this. They take on the problems of browsers by abstracting\
    \ the pains of poor implementation, inconsistencies and flat-out bugs, and relieve\
    \ us of the chore. Unless you want to beta test a certain browser because you're\
    \ a big fan, don't fix browser issues in your JavaScript solutions, because you\
    \ are unlikely to ever update the code to remove this fix. All you would be doing\
    \ is adding to the already massive pile of outdated code on the Web.\n\nThat said,\
    \ relying solely on libraries for your core skill is short-sighted. Read up on\
    \ JavaScript, watch some good videos and tutorials on it, and understand the language.\
    \ (Tip: closures are God's gift to the JavaScript developer.) Libraries will help\
    \ you build things quickly, but if you assign a lot of events and effects and\
    \ need to add a class to every HTML element in the document, then you are doing\
    \ wrong.\n\n### Resources\n\nIn addition to the resources mentioned in this article,\
    \ also check out the following to learn about JavaScript:\n\n- [Douglas Crockford\
    \ on JavaScript](http://yuiblog.com/crockford/)\n    An in-depth video Lecture\
    \ series.\n- [The Opera Web Standards Curriculum](http://dev.opera.com/articles/wsc/)\n\
    \    With a detailed section on JavaScript.WordPress Essentials: How To Create\
    \ A WordPress Plugin\n\n# Lessons From A Review Of JavaScript Code\n\nAddy Osmani\n\
    \nBefore we start, I’d like to pose a question: when was the last time you asked\
    \ someone to review your code? Reviewing code is possibly the single best technique\
    \ to improve the overall quality of your solutions, and if you’re not actively\
    \ taking advantage of it, then you’re missing out on identifying bugs and hearing\
    \ suggestions that could make your code better.\n\nNone of us write 100% bug-free\
    \ code all of the time, so don’t feel there’s a stigma attached to seeking help.\
    \ Some of the most experienced developers in our industry, from framework authors\
    \ to browser developers, regularly request reviews of their code from others;\
    \ asking whether something could be tweaked should in no way be considered embarrassing.\
    \ Reviews are a technique like any other and should be used where possible.\n\n\
    Today we’ll look at where to get your code reviewed, how to structure your requests,\
    \ and what reviewers look for. I was recently asked to review some code for a\
    \ new JavaScript application, and thought I’d like to share some of my feedback,\
    \ because it covers some JavaScript fundamentals that are always useful to bear\
    \ in mind.\n\n### Introduction\n"
