    p.setDimensions( 40, 40 );


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    p.rotate( Math.atan2( y - 200, x - 200 ) + ''rad'' );


    p.position( x, y );


    angle += increase;


    }


    Notice that the rotate transformation in CSS helps us heaps in this case. Otherwise,
    the math to rotate our rectangles would be much less fun. CSS transformations
    also take radians and degrees as their value. In this case, we use rad; if you
    want to rotate with degrees, simply use deg as the value.


    How about animating the circle now? Well, the first thing to do is change the
    script a bit, because we don’t want to have to keep creating new plots. Other
    than that, all we need to do to [rotate the circle is to keep increasing the start
    angle](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotatingcircle.html):


    var stage = document.querySelector(''.stage''),


    plots = 10;


    increase = Math.PI * 2 / plots,


    angle = 0,


    x = 0,


    y = 0,


    plotcache = [];


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.setBackground( ''green'' );


    p.setDimensions( 40, 40 );


    plotcache.push( p );


    }


    function rotate(){


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    plotcache[ i ].rotate( Math.atan2( y - 200, x - 200 ) + ''rad'' );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    setInterval( rotate, 1000/30 );


    Want more? How about a [rotating text message](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotatingmessage.html)
    based on this? The tricky thing about this is that we also need to turn the characters
    90° on each iteration:


    ![rotatedmessage.png](Images/rotatedmessage.png)


    var stage = document.querySelector(''.stage''),


    message = ''Smashing Magazine ''.toUpperCase(),


    plots = message.length;


    increase = Math.PI * 2 / plots,


    angle = -Math.PI,


    turnangle = 0,


    x = 0,


    y = 0,


    plotcache = [];


    for( var i = 0; i < plots; i++ ) {


    var p = new Plot( stage );


    p.content( message.substr(i,1) );


    p.setDimensions( 40, 40 );


    plotcache.push( p );


    }


    function rotate(){


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + 200;


    y = 100 * Math.sin( angle ) + 200;


    // rotation and rotating the text 90 degrees


    turnangle = Math.atan2( y - 200, x - 200 ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    setInterval( rotate, 1000/40 );


    Again, nothing here is fixed. You can make the [radius of the circle change constantly](http://www.smashingmagazine.com/wp-content/uploads/2011/09/growrotatingmessage.html),
    as we did with the bouncing banner message earlier (below is only an excerpt):


    multiplier = 80 * Math.sin( angle );


    for( var i = 0; i < plots; i++ ) {


    x = multiplier * Math.cos( angle ) + 200;


    y = multiplier * Math.sin( angle ) + 200;


    turnangle = Math.atan2( y - 200, x - 200 ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    And, of course, you can [move the center of the circle](http://www.smashingmagazine.com/wp-content/uploads/2011/09/rotaterotatingmessage.html),
    too:


    rx = 50 * Math.cos( angle ) + 200;


    ry = 50 * Math.sin( angle ) + 200;


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + rx;


    y = 100 * Math.sin( angle ) + ry;


    turnangle = Math.atan2( y - ry, x - rx ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    For a final tip, how about [allowing only a certain range of coordinates](http://www.smashingmagazine.com/wp-content/uploads/2011/09/boxedrotatingmessage.html)?


    function rotate() {


    rx = 70 * Math.cos( angle ) + 200;


    ry = 70 * Math.sin( angle ) + 200;


    for( var i = 0; i < plots; i++ ) {


    x = 100 * Math.cos( angle ) + rx;


    y = 100 * Math.sin( angle ) + ry;


    x = contain( 70, 320, x );


    y = contain( 70, 320, y );


    turnangle = Math.atan2( y - ry, x - rx ) * 180 / Math.PI + 90 + ''deg'';


    plotcache[ i ].rotate( turnangle );


    plotcache[ i ].position( x, y );


    angle += increase;


    }


    angle += 0.06;


    }


    function contain( min, max, value ) {


    return Math.min( max, Math.max( min, value ) );


    }


    Summary


    This was just a quick introduction to using exponentials and sine waves and to
    plotting things on a circle. Have a go with the code, and play with the numbers.
    It is amazing how many cool effects you can create with a few changes to the radius
    or by multiplying the angles. To make it easier for you to do this, below are
    the examples on JSFiddle to play with:


    •[Sine bouncing message](http://jsfiddle.net/codepo8/tgEx6/11/)


    •[Double sine bouncing message](http://jsfiddle.net/codepo8/tgEx6/2/)


    •[Offset issue with plotting](http://jsfiddle.net/codepo8/tgEx6/4/)


    •[Distributing elements on a circle](http://jsfiddle.net/codepo8/tgEx6/8/)


    •[Distributing elements on a circle with correct angles](http://jsfiddle.net/codepo8/tgEx6/9/)


    •[Rotating a circle of boxes](http://jsfiddle.net/codepo8/tgEx6/7/)


    •[Oscillating rotating message](http://jsfiddle.net/codepo8/tgEx6/10/)


    •[Rotating message in a circle movement](http://jsfiddle.net/codepo8/tgEx6/5/)


    •[Boxed rotated message scroller](http://jsfiddle.net/codepo8/tgEx6/)


    # Searchable Dynamic Content With AJAX Crawling


    Zack Grossbart'
