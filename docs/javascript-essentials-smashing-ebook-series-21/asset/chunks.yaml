    \nIn summary, go over your code once more when you think you’ve finished with\
    \ it and the next person is about to take it over.\n\n### Sin #6: Not Documenting\
    \ Your Code\n\n“Good code documents itself” is a terribly common and misguided\
    \ belief. In my years as a developer, I’ve found that my style of coding has changed\
    \ constantly. What was common knowledge and best practice in 2004 might be forgotten\
    \ or even considered poor style these days.\n\nDocumenting all of the tricks and\
    \ workarounds we do to make our code work in different browsers is definitely\
    \ a good idea. This allows future maintainers to remove them when the targeted\
    \ browser version becomes obsolete or a library function fixes the issue.\n\n\
    Commenting your code also allows the maintainer to trace it back to you should\
    \ they need some piece of information, and it allows people who have stumbled\
    \ across your script to include it in a larger solution or library (which has\
    \ happened to me). Because JavaScripts tend replicate replicate on the Web (in\
    \ all of those blogs and “script collections”), it is also a way to make your\
    \ name known.\n\nDon’t go overboard with commenting, though. Obvious things don’t\
    \ need to be spelled out. I have found the following situations worthy of comment:\n\
    \n- Necessary hacks: Browser hacks; content clean-up; things that should be supported\
    \ server-side but are not yet.\n- Sections that are likely to change: Timely solutions;\
    \ IDs, classes and strings (as explained earlier).\n- Start of classes and reusable\
    \ functions: With name, author, version, date and license.\n- Third-party code:\
    \ Give credit where credit is due.\n- Sections with dependencies: Some comment\
    \ like, “Needs the Google API with an own key—this one will not work on your server.”\n\
    \nIn short, comment on anything that deviates from the normal flow of coding.\
    \ I tend to use `/* */` instead of `//` because it won’t create a bug if people\
    \ remove the line break by accident.\n\n#### Special Case: Commenting Out Code\n\
    \nOne special case is commenting out sections that will be necessary in future\
    \ releases or that depend on functionality not currently available. This can be\
    \ amazingly useful but also a security risk, depending on what you’re commenting\
    \ out. For example, don’t leave in any code that points to server-side APIs that\
    \ are not available yet but could at any time be half-implemented. I’ve seen this\
    \ before, where administrator links with the full unprotected path were commented\
    \ out in the HTML.\n\nStill, commenting out can be very useful for debugging.\
    \ One neat trick is the following:\n\n```javascript\n/*\nmyFunction('do something');\n\
    // */\n```\n\nThis is now commented out. But by adding a single slash in front\
    \ of the first comment line, you will uncomment the whole block and make it live.\n\
    \n```javascript\n//*\nmyFunction('do something');\n// */\n```\n\nThis trick makes\
    \ it awfully easy to toggle whole blocks.\n\n### Sin #7: Optimizing For Machines,\
    \ Not People\n\nThe last sin is over-optimizing JavaScript based on the scads\
    \ of information about performance that are available to us. You will find a lot\
    \ of information on the Web about optimizing JavaScript for performance in the\
    \ current browser environment. Notice that “current browser environment”—much\
    \ information is browser- and version-specific and a necessary evil for now, but\
    \ not necessarily in future. If your application is large or your website is high\
    \ traffic, knowing and applying this information could make or break it. Again,\
    \ though, a lot of this applies to edge cases that would have little impact on\
    \ small projects and environments. This optimization does make it harder to maintain\
    \ the code; some of the things we need to do to make browsers run fast on high-scale\
    \ websites, such as writing out script nodes with `document.write()`, are downright\
    \ nasty.\n\nWhen faced with the choice between making code cleaner and easier\
    \ to amend, extend and understand on the one hand, and shaving two milliseconds\
    \ off every page load on the other, I opt for the former. A lot of JavaScript\
    \ optimization can be done through scripts. Rather than teach all developers on\
    \ a project the ins and outs of JavaScript performance, an expert team (or even\
    \ a tool) could optimize the code before it goes live.\n\nIf you can do anything\
    \ with machines to make the jobs of other machines easier, do it. The time has\
    \ come for us to apply build processes as much to front-end code as we do to back-end\
    \ code, instead of forcing ourselves to follow coding practices that go against\
    \ the natural flow of writing code.\n\n# A Quick Look Into The Math Of Animations\
