    ### 罪过 #5：让维护变得不必要的困难


    优秀代码无法留在 Web 上的原因之一是，我们的工作环境、截止日期和招聘实践习惯了开发者为了快速发布而构建代码，而不考虑以后维护这些代码会有多困难。我曾将
    [JavaScript 称为 Web 设计中的村级自行车`](http://developer.yahoo.net/blogs/theater/archives/2008/10/fronteers_2008_christian_heilmann_on_maintain_1.html)
    ([幻灯片在此处](http://www.slideshare.net/cheilmann/fronteers-maintainability-presentation))：任何人都可以去骑。因为代码是公开的，未来的维护者将能够以他们喜欢的方式对其捣弄和扩展。


    遗憾的是，你的代码越难维护，其中添加的错误就越多，导致它看起来更像是一团乱码，而不是组织良好的脚本。


