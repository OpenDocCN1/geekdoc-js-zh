    values of differing data types, it first “coerces” them into a common data type.
    False, zero, null, undefined, empty strings and NaN all end up becoming false
    — not permanently, just for the given expression. An example to the rescue:


    var someVar = 0;


    alert(someVar == false); //evaluates true


