    \n### Circles In The Sand, Round And Round…\n\nCircular motion is a thing of beauty.\
    \ It pleases the eye, reminds us of spinning wheels and the earth we stand on,\
    \ and in general has a “this is not computer stuff” feel to it. The math of plotting\
