    # Seven JavaScript Things I Wish I Knew Much Earlier In My Career


    Christian Heilmann


    I’ve been writing JavaScript code for much longer than I care to remember. I am
    very excited about the language’s recent success; it’s good to be a part of that
    success story. I’ve written dozens of articles, book chapters and one full book
    on the matter, and yet I keep finding new things. Here are some of the “aha!”
    moments I’ve had in the past, which you can try out rather than waiting for them
    to come to you by chance.


    ### Shortcut Notations


    One of the things I love most about JavaScript now is shortcut notations to generate
    objects and arrays. So, in the past when we wanted to create an object, we wrote:


    ```javascript

    var car = new Object();


    car.colour = ''red'';

    car.wheels = 4;

    car.hubcaps = ''spinning'';

    car.age = 4;

    ```


    The same can be achieved with:


    ```javascript

    var car = {

    colour:''red'',

    wheels:4,

    hubcaps:''spinning'',

    age:4

    }

    ```


    Much shorter, and you don’t need to repeat the name of the object. Right now,
    `car` is fine, but what happens when you use `invalidUserInSession`? The main
    gotcha in this notation is IE. Never ever leave a trailing comma before the closing
    curly brace or you’ll be in trouble.


    The other handy shortcut notation is for arrays. The old school way of defining
    arrays was this:


    ```javascript

    var moviesThatNeedBetterWriters = new Array(

    ''Transformers'',''Transformers2'',''Avatar'',''Indiana Jones 4''

    );

    ```


    The shorter version of this is:


    ```javascript

    var moviesThatNeedBetterWriters = [

    ''Transformers'',''Transformers2'',''Avatar'',''Indiana Jones 4''

    ];

    ```


    The other thing about arrays is that there is no such thing as an associative
    array. You will find a lot of code examples that define the above car example
    like so:


    ```javascript

    var car = new Array();


    car[''colour''] = ''red'';

    car[''wheels''] = 4;

    car[''hubcaps''] = ''spinning'';

    car[''age''] = 4;

    ```


    This is not Sparta; this is madness—don’t bother with this. “Associative arrays”
    is a confusing name for objects.


    Another very cool shortcut notation is the ternary notation for conditions. So,
    instead of the following…


    ```javascript

    var direction;


    if(x < 200){

    direction = 1;

    } else {

    direction = -1;

    }

    ```

    You could write a shorter version using the ternary notation:


    ```javascript

    var direction = x < 200 ? 1 : -1;

    ```


    The true case of the condition is after the question mark, and the other case
    follows the colon.


    ## JSON As A Data Format


    Before I discovered JSON to store data, I did all kinds of crazy things to put
    content in a JavaScript-ready format: arrays, strings with control characters
    to split, and other abominations. The creation of [JSON](http://json.org/) by
    Douglas Crockford changed all that. Using JSON, you can store complex data in
    a format that is native to JavaScript and doesn''t need any extra conversion to
    be used immediately.


    JSON is short for "JavaScript Object Notation" and uses both of the shortcuts
    we covered earlier.


    So, if I wanted to describe a band, for example, I could do the following:


    ```javascript

    var band = {

    "name":"The Red Hot Chili Peppers",

    "members":[

    {

    "name":"Anthony Kiedis",

    "role":"lead vocals"

    },

    {

    "name":"Michael ''Flea'' Balzary",

    "role":"bass guitar, trumpet, backing vocals"

    },

    {

    "name":"Chad Smith",

    "role":"drums,percussion"

    },

    {

    "name":"John Frusciante",

    "role":"Lead Guitar"

    }

    ],

    "year":"2009"

    }

    ```

