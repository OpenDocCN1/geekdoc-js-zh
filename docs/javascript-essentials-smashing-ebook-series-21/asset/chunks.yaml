    # 我希望自己在职业生涯中更早知道的七件 JavaScript 事


    Christian Heilmann


    我编写 JavaScript 代码的时间比我记得的要长得多。我对这种语言最近的成功感到非常兴奋；能够成为这一成功故事的一部分是很好的。我已就此写过几十篇文章、书籍章节以及一整本书，但仍然不断发现新事物。这里是我过去经历的一些“恍然顿悟”时刻，你可以尝试它们，而不是等待它们偶然找上门。


    ### 简写符号


    我现在最喜欢 JavaScript 的点之一就是生成对象和数组的简写符号。所以，过去当我们想要创建一个对象时，我们这样写：


    ```javascript

    var car = new Object();


    car.colour = ''red'';

    car.wheels = 4;

    car.hubcaps = ''spinning'';

    car.age = 4;

    ```


    使用以下方式也可以实现：


    ```javascript

    var car = {

    colour:''red'',

    wheels:4,

    hubcaps:''spinning'',

    age:4

    }

    ```


    要短得多，而且不需要重复对象的名称。


    ## JSON 作为数据格式


    在发现用 JSON 存储数据之前，我曾用各种疯狂的方法将内容放入 JavaScript 可用的格式中：数组、带有控制字符分割的字符串以及其他畸产物。Douglas
    Crockford 创建的 [JSON](http://json.org/) 改变了一切。使用 JSON，你可以以 JavaScript 原生的格式存储复杂数据，而无需任何额外转换即可使用。


    JSON 是“JavaScript 对象表示法”的缩写，它使用了我们之前涵盖的两种简写方式。


    所以，例如，我想描述一个乐队，我可以这样做：


    ```javascript

    var band = {

    "name":"The Red Hot Chili Peppers",

    "members":[

    {

    "name":"Anthony Kiedis",

    "role":"lead vocals"

    },

    {

    "name":"Michael ''Flea'' Balzary",

    "role":"bass guitar, trumpet, backing vocals"

    },

    {

    "name":"Chad Smith",

    "role":"drums,percussion"

    },

    {

    "name":"John Frusciante",

    "role":"Lead Guitar"

    }

    ],

    "year":"2009"

    }

    ```


    '
- fmt: '

    You can use JSON directly in JavaScript and, when wrapped in a function call,
    even as a return format of APIs. This is called JSON-P and is supported by a lot
    of APIs out there. You can use a data endpoint, returning JSON-P directly in a
    script node:


    ```html

    <div id="delicious"></div><script>

    function delicious(o){

    var out = ''<ul>'';

    for(var i=0;i<o.length;i++){

    out += ''<li><a href="'' + o[i].u + ''">'' +

    o[i].d + ''</a></li>'';

    }

    out += ''</ul>'';

    document.getElementById(''delicious'').innerHTML = out;

    }

    </script>

    <script src="http://feeds.delicious.com/v2/json/codepo8/javascript?count=15&callback=delicious"></script>

    ```


    This calls the Delicious Web service to get my latest JavaScript bookmarks in
    JSON format and then displays them as an unordered list.


    In essence, JSON is probably the most lightweight way of describing complex data—and
    it runs in a browser. You can even use it in PHP using the `json_decode()` function.


    ## Native JavaScript Functions (Math, Array And String)


    One thing that amazed me is how much easier my life got once I read up thoroughly
    on the math and string functions of JavaScript. You can use these to avoid a lot
    of looping and conditions. For example, when I had the task of finding the largest
    number in an array of numbers, I used to write a loop, like so:


    ```javascript

    var numbers = [3,342,23,22,124];

    var max = 0;

    for(var i=0;i<numbers.length;i++){

    if(numbers[i] > max){

    max = numbers[i];

    }

    }

    alert(max);

    ```


    This can be achieved without a loop:


    ```javascript

    var numbers = [3,342,23,22,124];

    numbers.sort(function(a,b){return b - a});

    alert(numbers[0]);

    ```


    Notice that you cannot use `sort()` on a number array because it sorts lexically.
    There''s a [good tutorial on `sort()` here](http://www.javascriptkit.com/javatutors/arraysort.shtml)
    in case you need to know more.


    Another interesting method is `Math.max()`. This one returns the largest number
    from a list of parameters:


    ```javascript

    Math.max(12,123,3,2,433,4); // returns 433

    ```


    Because this tests for numbers and returns the largest one, you can use it to
    test for browser support of certain properties:


    ```javascript

    var scrollTop= Math.max(

    doc.documentElement.scrollTop,

    doc.body.scrollTop

    );

    ```


    This works around an Internet Explorer problem. You can read out the `scrollTop`
    of the current document, but depending on the `DOCTYPE` of the document, one or
    the other property is assigned the value. When you use `Math.max()` you get the
    right number because only one of the properties returns one; the other will be
    undefined. You can read more about shortening JavaScript with math functions [here](http://www.wait-till-i.com/2007/06/28/shortening-javascripts-with-math/).


    Other very powerful functions to manipulate strings are `split()` and `join()`.
    Probably the most powerful example of this is writing a function to attach CSS
    classes to elements.


    The thing is, when you add a class to a DOM element, you want to add it either
    as the first class or to already existing classes with a space in front of it.
    When you remove classes, you also need to remove the spaces (which was much more
    important in the past when some browsers failed to apply classes with trailing
    spaces).


    So, the original function would be something like:


    ```javascript

    function addclass(elm,newclass){

    var c = elm.className;

    elm.className = (c === '''') ? newclass : c+'' ''+newclass;

    }

    ```


    You can automate this using the `split()` and `join()` methods:


    ```javascript

    function addclass(elm,newclass){

    var classes = elm.className.split('' '');

    classes.push(newclass);

    elm.className = classes.join('' '');

    }

    ```


    This automatically ensures that classes are space-separated and that yours gets
    tacked on at the end.


    ## Event Delegation


    Events make Web apps work. I love events, especially custom events, which make
    your products extensible without your needing to touch the core code. The main
    problem (and actually one of its strengths) is that events are removed from the
    HTML—you apply an event listener to a certain element and then it becomes active.
    Nothing in the HTML indicates that this is the case though. Take this abstraction
    issue (which is hard for beginners to wrap their heads around) and the fact that
    "browsers" such as IE6 have all kind of memory problems and too many events applied
    to them, and you''ll see that not using too many event handlers in a document
    is wise.


    This is where [event delegation](http://icant.co.uk/sandbox/eventdelegation/)
    comes in. When an event happens on a certain element and on all the elements above
    it in the DOM hierarchy, you can simplify your event handling by using a single
    handler on a parent element, rather than using a lot of handlers.


    What do I mean by that? Say you want a list of links, and you want to call a function
    rather than load the links. The HTML would be:


    ```html

    <h2>Great Web resources</h2>

    <ul id="resources">

    <li><a href="http://opera.com/wsc">Opera Web Standards Curriculum</a></li>

    <li><a href="http://sitepoint.com">Sitepoint</a></li>

    <li><a href="http://alistapart.com">A List Apart</a></li>

    <li><a href="http://yuiblog.com">YUI Blog</a></li>

    <li><a href="http://blameitonthevoices.com">Blame it on the voices</a></li>

    <li><a href="http://oddlyspecific.com">Oddly specific</a></li>

    </ul>

    ```


    The normal way to apply event handlers here would be to loop through the links:


    ```javascript

    // Classic event handling example

    (function(){

    var resources = document.getElementById(''resources'');

    var links = resources.getElementsByTagName(''a'');

    var all = links.length;

    for(var i=0;i<all;i++){

    // Attach a listener to each link

    links[i].addEventListener(''click'',handler,false);

    }

    function handler(e){

    var x = e.target; // Get the link that was clicked

    alert(x);

    e.preventDefault();

    };

    })();

    ```


    This could also be done with a single event handler:


    ```javascript

    (function(){

    var resources = document.getElementById(''resources'');

    resources.addEventListener(''click'',handler,false);

    function handler(e){

    var x = e.target; // get the element

    if(x.nodeName.toLowerCase() === ''a''){

    alert(''Event delegation:'' + x);

    e.preventDefault();

    }

    };

    })();

    ```


    Because the click happens on all the elements in the list, all you need to do
    is compare the `nodeName` to the right element you want to react to the event.


    Disclaimer: while both of the event examples work in browsers, they fail in IE6.
    For IE6, you need to apply an event model other than the W3C one, and this is
    why we use libraries for these tricks.


    The benefits of this approach are more than just being able to use a single handler.
    Say, for example, you want to add more links dynamically to this list. With event
    delegation, there is no need to change anything; with simple event handling, you
    would have to reassign handlers and re-loop the list.


    ## Anonymous Functions And The Module Pattern


    One of the most annoying things about JavaScript is that it has no scope for variables.
    Any variable, function, array or object you define that is not inside another
    function is global, which means that other scripts on the same page can access—and
    will override—them.


    The workaround is to encapsulate your variables in an anonymous function and call
    that function immediately after you define it. For example, the following definition
    would result in three global variables and two global functions:


    ```javascript

    var name = ''Chris'';

    var age = ''34'';

    var status = ''single'';

    function createMember(){

    // [...]

    }

    function getMemberDetails(){

    // [...]

    }

    ```


    Any other script on the page that has a variable named `status` could cause trouble.
    If we wrap all of this in a name such as `myApplication`, then we work around
    that issue:


    ```javascript

    var myApplication = function(){

    var name = ''Chris'';

    var age = ''34'';

    var status = ''single'';

    function createMember(){

    // [...]

    }

    function getMemberDetails(){

    // [...]

    }


    }();

    ```

