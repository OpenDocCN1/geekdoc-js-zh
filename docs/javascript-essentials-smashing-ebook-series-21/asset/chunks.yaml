    \ + type] = fn;\n  };\n  utils.removeListener = function ( el, type, fn ) {\n\
    \    el['on' + type] = null;\n  }\n}\n```\n\n### 问题 3\n\n**问题**：原生的 `Object.prototype`\
    \ 经常被扩展。\n\n**反馈**：扩展原生类型通常是不被鼓励的，很少有（如果有的话）流行的代码库敢于扩展 `Object.prototype`。现实情况是，不太会出现你绝对需要以这种方式扩展它的情况。除了会破坏\
    \ JavaScript 中将对象作为哈希表的用特性并增加命名冲突的概率外，这通常被认为是一种坏实践，修改它应该只作为最后的手段（这与扩展你自定义对象的属性有很大不同）。\n\
    \n如果由于某种原因你最终确实扩展了对象原型，请确保该方法尚不存在，并对其进行记录，以便团队的其他成员了解其必要性所在。你可以使用以下代码示例作为指南：\n\
    \n```javascript\nif(typeof Object.prototype.myMethod != 'function'){\n  Object.prototype.myMethod\
    \ = function(){\n    //implem\n  };\n}\n```\n\n[Juriy Zaytsev](http://twitter.com/kangax)\
    \ 关于[扩展原生和主机对象](http://perfectionkills.com/extending-built-in-native-objects-evil-or-not/)\
    \ 写了一篇非常棒的帖子，你可能会感兴趣。\n\n### 问题 4\n\n**问题**：部分代码严重阻塞了页面，因为它们在执行进一步操作之前要么在等待进程完成，要么等待数据加载。\n\
    \n**反馈**：页面阻塞会导致糟糕的用户体验，有许多种方法可以在不损害应用程序的情况下规避这一点。\n\n一种解决方案是使用“延迟执行”（通过 promises\
    \ 和 futures）。promises 的基本思想是，与其对资源发出阻塞调用，不如立即返回一个代表未来值的 `promise`，该值最终会被兑现（fulfilled）。这可以很方便地让你编写出可以异步运行的非阻塞逻辑。在这个公式中，引入回调是常见的做法，它们会在请求完成后执行。\n\
    \n我曾与 Julian Aubourg 针对此写了一篇相对详尽[文章](http://msdn.microsoft.com/en-us/scriptjunkie/gg723713)，如果你感兴趣通过\
    \ jQuery 实现，但当然，也可以用原生 JavaScript 实现。\n\n微框架 [Q](https://github.com/kriskowal/)\
    \ 了一个了一个兼容 CommonJS 的 promises 和 futures 实现，它相对详尽，并可以如下使用：\n\n```javascript\n\
    /* 定义一个仅限 promise 的延迟函数，它在超时完成后完成 resolve */\nfunction delay(ms) {\n  var deferred\
    \ = Q.defer();\n  setTimeout(deferred.resolve, ms);\n  return deferred.promise;\n\
    }\n\n/* 使用 Q 的 'when' 模式在 delay 兑现 promise 后执行回调 */\nQ.when(delay(500), function\
    \ () {\n  /* 在回调中执行操作 */\n});\n```\n\n如果你正在寻找某种更基础、易读的内容，那么这里有 Douglas Crockford\
    \ 对 promises 的实现：\n\n```javascript\nfunction make_promise() {\n  var status =\
    \ 'unresolved',\n  outcome,\n  waiting = [],\n  dreading = [];\n\n  function vouch(\
    \ deed, func ) {\n    switch (status) {\n      case 'unresolved':\n        (deed\
    \ === 'fulfilled' ? waiting : dreading).push(func);\n        break;\n      case\
    \ deed:\n        func(outcome);\n        break;\n    }\n  };\n\n  function resolve(\
    \ deed, value ) {\n    if (status !== 'unresolved') {\n      throw new Error('The\
    \ promise has already been resolved:' + status);\n    }\n    status = deed;\n\
    \    outcome = value;\n    (deed == 'fulfilled' ? waiting : dreading).forEach(function\
    \ (func) {\n      try {\n        func(outcome);\n      } catch (ignore) {}\n \
    \   });\n  }\n\n  return {\n    when: function ( func ) {\n      vouch('fulfilled',\
    \ func);\n    },\n    fail: function ( func ) {\n      vouch('smashed', func);\n\
    \    },\n    fulfill: function ( value ) {\n      resolve('fulfilled', value);\n\
    \    },\n    smash: function ( string ) {\n      resolve('smashed', string);\n\
    \    },\n    status: function () {\n      return status;\n    }\n  };\n}\n```\n\
    \n### 问题 5\n\n**问题**：你正在使用 `==` 测试属性的显式相等性\n\n**反馈**：你可能知道或不知道，JavaScript 中的 `==`\
    \ 运算符是非常宽松的，即使值的类型不同它也会认为是相等的。这是因为该运算符在执行任何比较之前会强制将类型转换为单一类型（通常是数字）。我推荐使用 `===`\
    \ 进行更具体的比较（在此情况下），是因为众所 `==` 存在许多陷阱，并被许多开发者认为是不可靠的。你可能还会感兴趣，在语言的抽象（如 CoffeeScript）中，`==`\
    \ 运算符被完全丢弃，转而从底层使用 `===`。\n\n不要只听我的，请看下面使用 `==` 进行布尔检查的示例，其中一些会导致意想不到的输出。\n\n\
    ```javascript\n3 == \"3\" // true\n3 == \"03\" // true\n3 == \"0003\" // true\n\
    3 == \"+3\" //true\n3 == [3] //true\n3 == (true+2) //true\n\" \\t\\n \" == 0 //true\n\
    \"\\t\\n\" == 0 //true\n\"\\t\" == 0 // true\n\"\\t\\n\" == 0 // true\n\"\\t\\\
    r\" == 0 // true\n\" \" == 0 // true\n\"\\t\" == 0 // true\n\" \\r\\n \" == 0\
    \ //true\n```\n\n### 问题 6\n\n**问题**：在所有的 for 循环中都未缓存的数组长度。这在你遍历 `HTMLCollection`\
    \ 时尤为糟糕。\n\n这里有一个示例：\n\n```javascript\nfor( var i=0; i<myArray.length;i++ ){\n\
    \  /* do stuff */\n}\n```\n\n"
- fmt: "\nFeedback: The problem with this approach (which I still see a number of\
    \ developers using) is that the array length is unnecessarily re-accessed on each\
    \ loop’s iteration. This can be very slow, especially when working with `HTMLCollections`\
    \ (in which case, caching the length can be anywhere up to 190 times faster than\
    \ repeatedly accessing it, as Nicholas C. Zakas mentions in his book [High-Performance\
    \ JavaScript](http://shop.oreilly.com/product/9780596802806.do)). Below are some\
    \ options for caching the array length.\n\n```javascript\n/* cached outside loop\
    \ */\nvar len = myArray.length;\nfor ( var i = 0; i < len; i++ ) {\n}\n```\n\n\
    ```javascript\n/* cached inside loop */\nfor ( var i = 0, len = myArray.length;\
    \ i < len; i++ ) {\n}\n```\n\n```javascript\n/* cached outside loop using while\
    \ */\nvar len = myArray.length;\nwhile (len--) {\n}\n```\n\nA [jsPerf](http://jsperf.com/)\
    \ test that compares the performance benefits of caching the array length inside\
    \ and outside the loop, using prefix increments, counting down and more is also\
    \ [available](http://jsperf.com/caching-array-length/7), if you would like to\
    \ study which performs the best.\n\n### Problem 7\n\nProblem: jQuery’s `$.each()`\
    \ is being used to iterate over objects and arrays, in some cases while `for`\
    \ is being used in others.\n\nFeedback: In jQuery, we have two ways to seamlessly\
    \ iterate over objects and arrays. The generic [$.each](http://api.jquery.com/jQuery.each/)\
    \ iterates over both of these types, whereas [$.fn.each()](http://api.jquery.com/each/)\
    \ iterates over a jQuery object specifically (where standard objects can be wrapped\
    \ with `$()` should you wish to use them with the latter). While the lower-level\
    \ `$.each` performs better than `$.fn.each()`, both standard JavaScript `for`\
    \ and `while` loops perform much better than either, as proven by this [jsPerf\
    \ test](http://jsperf.com/jquery-each-vs-for-loop/24/). Below are some examples\
    \ of loop alternatives that also perform better:\n\n```javascript\n/* jQuery $.each\
    \ */\n$.each(a, function() {\n  e = $(this);\n});\n```\n\n```javascript\n/* classic\
    \ for loop */\nvar len = a.length;\nfor ( var i = 0; i < len; i++ ) {\n  //if\
    \ this must be a jQuery object do..\n  e = $(a[i]);\n  //otherwise just e = a[i]\
    \ should suffice\n};\n```\n\n```javascript\n/* reverse for loop */\nfor ( var\
    \ i = a.length; i-- ) {\n  e = $(a[i]);\n}\n```\n\n```javascript\n/* classic while\
    \ loop */\nvar i = a.length;\nwhile (i--) {\n  e = $(a[i]);\n}\n```\n\n```javascript\n\
    /* alternative while loop */\nvar i = a.length - 1;\nwhile ( e = a[i--] ) {\n\
    \  $(e)\n};\n```\n\nYou might find Angus Croll’s post on “[Rethinking JavaScript\
    \ for Loops](http://javascriptweblog.wordpress.com/2010/10/11/rethinking-javascript-for-loops/)”\
    \ an interesting extension to these suggestions.\n\nGiven that this is a data-centric\
    \ application with a potentially large quantity of data in each object or array,\
    \ you should consider a refactor to use one of these. From a scalability perspective,\
    \ you want to shave off as many milliseconds as possible from process-heavy routines,\
    \ because these can build up when hundreds or thousands of elements are on the\
    \ page.\n\n### Problem 8\n\nProblem: JSON strings are being built in-memory using\
    \ string concatenation.\n\nFeedback: This could be approached in more optimal\
    \ ways. For example, why not use `JSON.stringify()`, a method that accepts a JavaScript\
    \ object and returns its JSON equivalent. Objects can generally be as complex\
    \ or as deeply nested as you wish, and this will almost certainly result in a\
    \ simpler, shorter solution.\n\n```javascript\nvar myData = {};\nmyData.dataA\
    \ = [’a’, ’b’, ’c’, ’d’];\nmyData.dataB = {\n  ’animal’: ’cat’,\n  ’color’: ’brown’\n\
    };\nmyData.dataC = {\n  ’vehicles’: [{\n    ’type’: ’ford’,\n    ’tint’: ’silver’,\n\
    \    ’year’: ’2015’\n  }, {\n    ’type’: ’honda’,\n    ’tint’: ’black’,\n    ’year’:\
    \ ’2012’\n  }]\n};\nmyData.dataD = {\n  ’buildings’: [{\n    ’houses’: [{\n  \
    \    ’streetName’: ’sycamore close’,\n      ’number’: ’252’\n    }, {\n      ’streetName’:\
    \ ’slimdon close’,\n      ’number’: ’101’\n    }]\n  }]\n};\nconsole.log(myData);\
    \ //object\nvar jsonData = JSON.stringify(myData);\nconsole.log(jsonData);\n\n\
    /*\n{\"dataA\":[\"a\",\"b\",\"c\",\"d\"],\"dataB\":{\"animal\":\"cat\",\"color\"\
    :\"brown\"},\"dataC\":{\"vehicles\":[{\"type\":\"ford\",\"tint\":\"silver\",\"\
    year\":\"2015\"},{\"type\":\"honda\",\"tint\":\"black\",\"year\":\"2012\"}]},\"\
    dataD\":{\"buildings\":[{\"houses\":[{\"streetName\":\"sycamore close\",\"number\"\
    :\"252\"},{\"streetName\":\"slimdon close\",\"number\":\"101\"}]}]}}\n*/\n```\n\
    \nAs an extra debugging tip, if you would like to pretty-print JSON in your console\
    \ for easier reading, then the following extra arguments to `stringify()` will\
    \ achieve this:\n\n```javascript\nJSON.stringify({ foo: \"hello\", bar: \"world\"\
    \ }, null, 4);\n```\n\n### Problem 9\n\nProblem: The namespacing pattern used\
    \ is technically invalid.\n\nFeedback: While namespacing is implemented correctly\
    \ across the rest of the application, the initial check for namespace existence\
    \ is invalid. Here’s what you currently have:\n\n```javascript\nif ( !MyNamespace\
    \ ) {\n  MyNamespace = { };\n}\n```\n\nThe problem is that `!MyNamespace` will\
    \ throw a `ReferenceError`, because the `MyNamespace` variable was never declared.\
    \ A better pattern would take advantage of boolean conversion with an inner variable\
    \ declaration, as follows:\n\n```javascript\nif ( !MyNamespace ) {\n  var MyNamespace\
    \ = { };\n}\n```\n\n//or\n\n```javascript\nvar myNamespace = myNamespace || {};\n\
    ```\n\n// Although a more efficient way of doing this is:\n// myNamespace || (\
    \ myNamespace = {} );\n// jsPerf test: [http://jsperf.com/conditional-assignment](http://jsperf.com/conditional-assignment)\n\
    //or\n\n```javascript\nif ( typeof MyNamespace == ’undefined’ ) {\n  var MyNamespace\
    \ = { };\n}\n```\n\nThis could, of course, be done in numerous other ways. If\
    \ you’re interested in reading about more namespacing patterns (as well as some\
    \ ideas on namespace extension), I recently wrote “[Essential JavaScript Namespacing\
    \ Patterns](http://addyosmani.com/blog/essential-js-namespacing/).” [Juriy Zaytsev](http://twitter.com/kangax)\
    \ also has a pretty [comprehensive post on namespacing patterns](http://perfectionkills.com/unnecessarily-comprehensive-look-into-a-rather-insignificant-issue-of-global-objects-creation/).\n\
    \n### Conclusion\n\nThat’s it. Reviewing code is a great way to enforce and maintain\
    \ quality, correctness and consistency in coding standards at as high a level\
    \ as possible. I strongly recommend that all developers give them a try in their\
    \ daily projects, because they’re an excellent learning tool for both the developer\
    \ and the reviewer. Until next time, try getting your code reviewed, and good\
    \ luck with the rest of your project!\n\n# Find The Right JavaScript Solution\
    \ With A 7-Step Test\n\nChristian Heilmann\n\nAs Web developers and designers,\
    \ we are spoilt for choice right now. To build a complex Web application or even\
    \ just spice up a website with some highly interactive interface element, we have\
    \ hundreds of pre-built solutions to choose from. Every library comes with widgets\
    \ and solutions, and every developer tries to make a name for him or herself by\
    \ releasing a funky JavaScript solution to a certain interface problem. We can\
    \ pick from dozens of menus, image carousels, tabs, form validators and “lightboxes.”\n\
    \nHaving this much choice makes it easy for us to pick and choose, which is where\
    \ things go wrong. In most cases, we measure the quality of a solution by its\
    \ convenience to us. Our main reasons for picking one solution over another are:\n\
    \n Does it do what I need it to do?\n• Does it look cool?\n• Does it sound easy\
    \ to use?\n• Would I want to use it?\n• Does it use the framework I’m committed\
    \ to?\n\nThe things you should really look for are different, though:\n\n• How\
    \ stable is the solution? Is a good alternative available if this one doesn’t\
    \ work?\n• How easy is it to customize? Do you need to be a JavaScript expert\
    \ to modify the widget?\n• How usable and accessible is it? Are users who don’t\
    \ have a mouse or are on a mobile browser blocked?\n• Do you understand what’s\
    \ going on? Would you be able to fix a problem and explain it to others?\n• Is\
    \ it a contained solution? Will other scripts be able to interfere with it, or\
    \ would it contaminate the document?\n• How dedicated is the developer? Will the\
    \ solution be maintained in the future?\n"
  raw: 'Feedback: The problem with this approach (which I still see a number of developers
    using) is that the array length is unnecessarily re-accessed on each loop’s iteration.
    This can be very slow, especially when working with HTMLCollections (in which
    case, caching the length can be anywhere up to 190 times faster than repeatedly
    accessing it, as Nicholas C. Zakas mentions in his book [High-Performance JavaScript](http://shop.oreilly.com/product/9780596802806.do)).
    Below are some options for caching the array length.


    /* cached outside loop */


    var len = myArray.length;


    for ( var i = 0; i < len; i++ ) {


    }


    /* cached inside loop */


    for ( var i = 0, len = myArray.length; i < len; i++ ) {


    }


    /* cached outside loop using while */


    var len = myArray.length;


    while (len--) {


    }


    A [jsPerf](http://jsperf.com/) test that compares the performance benefits of
    caching the array length inside and outside the loop, using prefix increments,
    counting down and more is also [available](http://jsperf.com/caching-array-length/7),
    if you would like to study which performs the best.


    #### Problem 7


    Problem: jQuery’s $.each() is being used to iterate over objects and arrays, in
    some cases while for is being used in others.


    Feedback: In jQuery, we have two ways to seamlessly iterate over objects and arrays.
    The generic [$.each](http://api.jquery.com/jQuery.each/) iterates over both of
    these types, whereas [$.fn.each()](http://api.jquery.com/each/) iterates over
    a jQuery object specifically (where standard objects can be wrapped with $() should
    you wish to use them with the latter). While the lower-level $.each performs better
    than $.fn.each(), both standard JavaScript for and while loops perform much better
    than either, as proven by this [jsPerf test](http://jsperf.com/jquery-each-vs-for-loop/24/).
    Below are some examples of loop alternatives that also perform better:


    /* jQuery $.each */


    $.each(a, function() {


    e = $(this);


    });


    /* classic for loop */


    var len = a.length;


    for ( var i = 0; i < len; i++ ) {


    //if this must be a jQuery object do..


    e = $(a[i]);


    //otherwise just e = a[i] should suffice


    };


    /* reverse for loop */


    for ( var i = a.length; i-- ) {


    e = $(a[i]);


    }


    /* classic while loop */


    var i = a.length;


    while (i--) {


    e = $(a[i]);


    }


    /* alternative while loop */


    var i = a.length - 1;


    while ( e = a[i--] ) {


    $(e)


    };


    You might find Angus Croll’s post on “[Rethinking JavaScript for Loops](http://javascriptweblog.wordpress.com/2010/10/11/rethinking-javascript-for-loops/)”
    an interesting extension to these suggestions.


    Given that this is a data-centric application with a potentially large quantity
    of data in each object or array, you should consider a refactor to use one of
    these. From a scalability perspective, you want to shave off as many milliseconds
    as possible from process-heavy routines, because these can build up when hundreds
    or thousands of elements are on the page.


    #### Problem 8


    Problem: JSON strings are being built in-memory using string concatenation.


    Feedback: This could be approached in more optimal ways. For example, why not
    use JSON.stringify(), a method that accepts a JavaScript object and returns its
    JSON equivalent. Objects can generally be as complex or as deeply nested as you
    wish, and this will almost certainly result in a simpler, shorter solution.


    var myData = {};


    myData.dataA = [’a’, ’b’, ’c’, ’d’];


    myData.dataB = {


    ’animal’: ’cat’,


    ’color’: ’brown’


    };


    myData.dataC = {


    ’vehicles’: [{


    ’type’: ’ford’,


    ’tint’: ’silver’,


    ’year’: ’2015’


    }, {


    ’type’: ’honda’,


    ’tint’: ’black’,


    ’year’: ’2012’


    }]


    };


    myData.dataD = {


    ’buildings’: [{


    ’houses’: [{


    ’streetName’: ’sycamore close’,


    ’number’: ’252’


    }, {


    ’streetName’: ’slimdon close’,


    ’number’: ’101’


    }]


    }]


    };


    console.log(myData); //object


    var jsonData = JSON.stringify(myData);


    console.log(jsonData);


    /*


    {"dataA":["a","b","c","d"],"dataB":{"animal":"cat","color":"brown"},"dataC":{"vehicles":[{"type":"ford","tint":"silver","year":"2015"},{"type":"honda","tint":"black","year":"2012"}]},"dataD":{"buildings":[{"houses":[{"streetName":"sycamore
    close","number":"252"},{"streetName":"slimdon close","number":"101"}]}]}}


    */


    As an extra debugging tip, if you would like to pretty-print JSON in your console
    for easier reading, then the following extra arguments to stringify() will achieve
    this:


    JSON.stringify({ foo: "hello", bar: "world" }, null, 4);


    #### Problem 9


    Problem: The namespacing pattern used is technically invalid.


    Feedback: While namespacing is implemented correctly across the rest of the application,
    the initial check for namespace existence is invalid. Here’s what you currently
    have:


    if ( !MyNamespace ) {


    MyNamespace = { };


    }


    The problem is that !MyNamespace will throw a ReferenceError, because the MyNamespace
    variable was never declared. A better pattern would take advantage of boolean
    conversion with an inner variable declaration, as follows:


    if ( !MyNamespace ) {


    var MyNamespace = { };


    }


    //or


    var myNamespace = myNamespace || {};


    // Although a more efficient way of doing this is:


    // myNamespace || ( myNamespace = {} );


    // jsPerf test: [http://jsperf.com/conditional-assignment](http://jsperf.com/conditional-assignment)


    //or


    if ( typeof MyNamespace == ’undefined’ ) {


    var MyNamespace = { };


    }


    This could, of course, be done in numerous other ways. If you’re interested in
    reading about more namespacing patterns (as well as some ideas on namespace extension),
    I recently wrote “[Essential JavaScript Namespacing Patterns](http://addyosmani.com/blog/essential-js-namespacing/).”
    [Juriy Zaytsev](http://twitter.com/kangax) also has a pretty [comprehensive post
    on namespacing patterns](http://perfectionkills.com/unnecessarily-comprehensive-look-into-a-rather-insignificant-issue-of-global-objects-creation/).


    ### Conclusion


    That’s it. Reviewing code is a great way to enforce and maintain quality, correctness
    and consistency in coding standards at as high a level as possible. I strongly
    recommend that all developers give them a try in their daily projects, because
    they’re an excellent learning tool for both the developer and the reviewer. Until
    next time, try getting your code reviewed, and good luck with the rest of your
    project!


    # Find The Right JavaScript Solution With A 7-Step Test


    Christian Heilmann


    As Web developers and designers, we are spoilt for choice right now. To build
    a complex Web application or even just spice up a website with some highly interactive
    interface element, we have hundreds of pre-built solutions to choose from. Every
    library comes with widgets and solutions, and every developer tries to make a
    name for him or herself by releasing a funky JavaScript solution to a certain
    interface problem. We can pick from dozens of menus, image carousels, tabs, form
    validators and “lightboxes.”


    Having this much choice makes it easy for us to pick and choose, which is where
    things go wrong. In most cases, we measure the quality of a solution by its convenience
    to us. Our main reasons for picking one solution over another are:


    •Does it do what I need it to do?


    •Does it look cool?


    •Does it sound easy to use?


    •Would I want to use it?


    •Does it use the framework I’m committed to?


    The things you should really look for are different, though:


    •How stable is the solution? Is a good alternative available if this one doesn’t
    work?


    •How easy is it to customize? Do you need to be a JavaScript expert to modify
    the widget?


    •How usable and accessible is it? Are users who don’t have a mouse or are on a
    mobile browser blocked?


    •Do you understand what’s going on? Would you be able to fix a problem and explain
    it to others?


    •Is it a contained solution? Will other scripts be able to interfere with it,
    or would it contaminate the document?


    •How dedicated is the developer? Will the solution be maintained in the future?'
