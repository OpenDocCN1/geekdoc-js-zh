- fmt: "\nPhew. As you’ve probably gathered, this is a broad topic, and I recommend\
    \ reading up more on it — on data coercion, which, while not uniquely a JavaScript\
    \ concept, is nonetheless prominent in JavaScript.\n\nI discuss the concept of\
    \ truthy and falsy and data coercion more [over here](http://www.mitya.co.uk/blog/2011/Apr/Twisted-logic-understanding-truthy-and-falsy-174).\
    \ And if you really want to sink your teeth into what happens internally when\
    \ JavaScript is asked to compare two values, then check out [section 11.9.3 of\
    \ the ECMA-262](http://www.mozilla.org/js/language/E262-3.pdf) document specification.\n\
    \n## Regular Expressions\n\n### 4. replace() Can Accept a Callback Function\n\n\
    This is one of JavaScript’s best-kept secrets and arrived in v1.3. Most usages\
    \ of `replace()` look something like this:\n\n```\nalert('10 13 21 48 52'.replace(/\\\
    d+/g, '*')); //replace all numbers with *\n```\n\nThis is a simple replacement:\
    \ a string, an asterisk. But what if we wanted more control over how and when\
    \ our replacements take place? What if we wanted to replace only numbers under\
    \ 30? This can’t be achieved with regular expressions alone (they’re all about\
    \ strings, after all, not maths). We need to jump into a callback function to\
    \ evaluate each match.\n\n```\nalert('10 13 21 48 52'.replace(/\\d+/g, function(match)\
    \ {\n  return parseInt(match) < 30 ? '*' : match;\n}));\n```\n\nFor every match\
    \ made, JavaScript calls our function, passing the `match` into our `match` argument.\
    \ Then, we return either the asterisk (if the number matched is under 30) or the\
    \ `match` itself (i.e. no match should take place).\n\n### 5. Regular Expressions:\
    \ More Than Just Match and Replace\n\nMany intermediate JavaScript developers\
    \ get by just on match and replace with regular expressions. But JavaScript defines\
    \ more methods than these two.\n\nOf particular interest is `test()`, which works\
    \ like `match` except that it doesn’t return matches: it simply confirms whether\
    \ a pattern matches. In this sense, it is computationally lighter.\n\n```\nalert(/\\\
    w{3,}/.test('Hello')); //alerts 'true'\n```\n\nThe above looks for a pattern of\
    \ three or more alphanumeric characters, and because the string `Hello` meets\
    \ that requirement, we get true. We don’t get the actual match, just the result.\n\
    \nAlso of note is the `RegExp` object, by which you can create dynamic regular\
    \ expressions, as opposed to static ones. The majority of regular expressions\
    \ are declared using short form (i.e. enclosed in forward slashes, as we did above).\
    \ That way, though, you can’t reference variables, so making dynamic patterns\
    \ is impossible. With `RegExp()`, though, you can.\n\n```javascript\nfunction\
    \ findWord(word, string) {\n  var instancesOfWord = string.match(new RegExp('\\\
    b'+word+'\\b', 'ig'));\n  alert(instancesOfWord);\n}\n\nfindWord('car', 'Carl\
    \ went to buy a car but had forgotten his credit card.');\n```\n\nHere, we’re\
    \ making a dynamic pattern based on the value of the argument `word`. The function\
    \ returns the number of times that word appears in `string` as a word in its own\
    \ right (i.e. not as a part of other words). So, our example returns `car` once,\
    \ ignoring the `car` tokens in the words `Carl` and `card`. It forces this by\
    \ checking for a word boundary (`\\b`) on either side of the word that we’re looking\
    \ for.\n\nBecause `RegExp` are specified as strings, not via forward-slash syntax,\
    \ we can use variables in building the pattern. This also means, however, that\
    \ we must double-escape any special characters, as we did with our word boundary\
    \ character.\n\n## Functions And Scope\n\n### 6. You Can Fake Scope\n\nThe scope\
    \ in which something executes defines what variables are accessible. Free-standing\
    \ JavaScript (i.e. JavaScript that does not run inside a function) operates within\
    \ the global scope of the `window` object, to which everything has access; whereas\
    \ local variables declared inside functions are accessible only within that function,\
    \ not outside.\n\n```javascript\nvar animal = 'dog';\n\nfunction getAnimal(adjective)\
    \ { alert(adjective+' '+this.animal); }\n\ngetAnimal('lovely'); //alerts 'lovely\
    \ dog';\n```\n\nHere, our variable and function are both declared in the global\
    \ scope (i.e. on `window`). Because this always points to the current scope, in\
    \ this example it points to `window`. Therefore, the function looks for `window.animal`,\
    \ which it finds. So far, so normal. But we can actually con our function into\
    \ thinking that it’s running in a different scope, regardless of its own natural\
    \ scope. We do this by calling its built-in `call()` method, rather than the function\
    \ itself:\n\n```javascript\nvar animal = 'dog';\n\nfunction getAnimal(adjective)\
    \ { alert(adjective+' '+this.animal); };\n\nvar myObj = {animal: 'camel'};\n\n\
    getAnimal.call(myObj, 'lovely'); //alerts 'lovely camel'\n```\n\nHere, our function\
    \ runs not on `window` but on `myObj`—specified as the first argument of the `call`\
    \ method. Essentially, `call()` pretends that our function is a method of `myObj`\
    \ (if this doesn’t make sense, you might want to read up on JavaScript’s system\
    \ of prototypal inheritance). Note also that any arguments we pass to `call()`\
    \ after the first will be passed on to our function—hence we’re passing in `lovely`\
    \ as our `adjective` argument.\n\nI’ve heard JavaScript developers say that they’ve\
    \ gone years without ever needing to use this, not least because good design ensures\
    \ that you don’t need this.\n\nAs an aside, `apply()` does the same job as `call()`,\
    \ except that arguments to the function are specified as an array. So, the above\
    \ example using `apply()` would look like:\n\n`getAnimal.apply(myObj, ['lovely']);`\n\
    \n### 7. Functions Can ExecuteThemselves\n\nThe syntax is simple: we declare a\
    \ function and immediately call it as we call other functions, with `()` syntax.\
    \ You might wonder why we would do this. It seems like a contradiction in terms:\
    \ a function normally contains code we want to execute later, not now, otherwise\
    \ we wouldn’t put the code in a function.\n\nOne good use of self-executing functions\
    \ (SEFs) is to bind the current values of variables for use inside delayed code,\
    \ such as callbacks, timeouts and intervals. Here is the problem:\n\n```javascript\n\
    var someVar = 'hello';\n\nsetTimeout(function() { alert(someVar); }, 1000);\n\n\
    var someVar = 'goodbye';\n```\n\nNewbies in forums invariably ask why the alert\
    \ in the timeout says goodbye and not hello. The answer is that the timeout callback\
    \ function is precisely that—a callback—so it doesn’t evaluate the value of `someVar`\
    \ until it runs. And by then, `someVar` has long since overwritten by `goodbye`.\n\
    \nSEFs provide a solution to this problem. Instead of specifying the timeout callback\
    \ implicitly as we do above, we return it from an SEF, into which we pass the\
    \ current value of `someVar` as arguments. Effectively, this means we pass in\
    \ and isolate the current value of `someVar`, protecting it from whatever happens\
    \ to the actual variable `someVar` thereafter. This is like taking a photo of\
    \ a car before you respray it; the photo will not update with the resprayed color;\
    \ it will forever show the color of the car at the time the photo was taken.\n\
    \n```javascript\nvar someVar = 'hello';\n\nsetTimeout((function(someVar) {\n \
    \ return function() { alert(someVar); }\n})(someVar), 1000);\n\nvar someVar =\
    \ 'goodbye';\n```\n\nThis time, it alerts hello, as desired, because it is alerting\
    \ the isolated version of `someVar` (i.e. the function argument, not the outer\
    \ variable).\n\n## The Browser\n\n### 8. Firefox Reads and Returns Colors in RGB,\
    \ Not Hex\n\nI’ve never really understood why Mozilla does this. Surely it realizes\
    \ that anyone interrogating computed colors via JavaScript is interested in hex\
    \ format and not RGB. To clarify, here’s an example:\n\n```html\n#somePara { color:\
    \ #f90; }\n```\n\nHello, world!\n\n```script>\nvar ie = navigator.appVersion.indexOf('MSIE')\
    \ != -1;\n\nvar p = document.getElementById('somePara');\n\nalert(ie ? p.currentStyle.color\
    \ : getComputedStyle(p, null).color);\n</script>\n"
  raw: 'Phew. As you’ve probably gathered, this is a broad topic, and I recommend
    reading up more on it — particularly on data coercion, which, while not uniquely
    a JavaScript concept, is nonetheless prominent in JavaScript.


    I discuss the concept of truthy and falsy and data coercion more [over here](http://www.mitya.co.uk/blog/2011/Apr/Twisted-logic-understanding-truthy-and-falsy-174).
    And if you really want to sink your teeth into what happens internally when JavaScript
    is asked to compare two values, then check out [section 11.9.3 of the ECMA-262](http://www.mozilla.org/js/language/E262-3.pdf)
    document specification.


    ### Regular Expressions


    #### 4\. replace() Can Accept a Callback Function


    This is one of JavaScript’s best-kept secrets and arrived in v1.3. Most usages
    of replace() look something like this:


    alert(''10 13 21 48 52''.replace(/d+/g, ''*'')); //replace all numbers with *


    This is a simple replacement: a string, an asterisk. But what if we wanted more
    control over how and when our replacements take place? What if we wanted to replace
    only numbers under 30? This can’t be achieved with regular expressions alone (they’re
    all about strings, after all, not maths). We need to jump into a callback function
    to evaluate each match.


    alert(''10 13 21 48 52''.replace(/d+/g, function(match) {


    return parseInt(match) < 30 ? ''*'' : match;


    }));


    For every match made, JavaScript calls our function, passing the match into our
    match argument. Then, we return either the asterisk (if the number matched is
    under 30) or the match itself (i.e. no match should take place).


    #### 5\. Regular Expressions: More Than Just Match and Replace


    Many intermediate JavaScript developers get by just on match and replace with
    regular expressions. But JavaScript defines more methods than these two.


    Of particular interest is test(), which works like match except that it doesn’t
    return matches: it simply confirms whether a pattern matches. In this sense, it
    is computationally lighter.


    alert(/w{3,}/.test(''Hello'')); //alerts ''true''


    The above looks for a pattern of three or more alphanumeric characters, and because
    the string Hello meets that requirement, we get true. We don’t get the actual
    match, just the result.


    Also of note is the RegExp object, by which you can create dynamic regular expressions,
    as opposed to static ones. The majority of regular expressions are declared using
    short form (i.e. enclosed in forward slashes, as we did above). That way, though,
    you can’t reference variables, so making dynamic patterns is impossible. With
    RegExp(), though, you can.


    function findWord(word, string) {


    var instancesOfWord = string.match(new RegExp(''\b''+word+''\b'', ''ig''));


    alert(instancesOfWord);


    }


    findWord(''car'', ''Carl went to buy a car but had forgotten his credit card.'');


    Here, we’re making a dynamic pattern based on the value of the argument word.
    The function returns the number of times that word appears in string as a word
    in its own right (i.e. not as a part of other words). So, our example returns
    car once, ignoring the car tokens in the words Carl and card. It forces this by
    checking for a word boundary (b) on either side of the word that we’re looking
    for.


    Because RegExp are specified as strings, not via forward-slash syntax, we can
    use variables in building the pattern. This also means, however, that we must
    double-escape any special characters, as we did with our word boundary character.


    ### Functions And Scope


    #### 6\. You Can Fake Scope


    The scope in which something executes defines what variables are accessible. Free-standing
    JavaScript (i.e. JavaScript that does not run inside a function) operates within
    the global scope of the window object, to which everything has access; whereas
    local variables declared inside functions are accessible only within that function,
    not outside.


    var animal = ''dog'';


    function getAnimal(adjective) { alert(adjective+'' ''+this.animal); }


    getAnimal(''lovely''); //alerts ''lovely dog'';


    Here, our variable and function are both declared in the global scope (i.e. on
    window). Because this always points to the current scope, in this example it points
    to window. Therefore, the function looks for window.animal, which it finds. So
    far, so normal. But we can actually con our function into thinking that it’s running
    in a different scope, regardless of its own natural scope. We do this by calling
    its built-in call() method, rather than the function itself:


    var animal = ''dog'';


    function getAnimal(adjective) { alert(adjective+'' ''+this.animal); };


    var myObj = {animal: ''camel''};


    getAnimal.call(myObj, ''lovely''); //alerts ''lovely camel''


    Here, our function runs not on window but on myObj — specified as the first argument
    of the call method. Essentially, call() pretends that our function is a method
    of myObj (if this doesn’t make sense, you might want to read up on JavaScript’s
    system of prototypal inheritance). Note also that any arguments we pass to call()
    after the first will be passed on to our function — hence we’re passing in lovely
    as our adjective argument.


    I’ve heard JavaScript developers say that they’ve gone years without ever needing
    to use this, not least because good code design ensures that you don’t need this
    smoke and mirrors. Nonetheless, it’s certainly an interesting one.


    As an aside, apply() does the same job as call(), except that arguments to the
    function are specified as an array, rather than as individual arguments. So, the
    above example using apply() would look like this:


    getAnimal.apply(myObj, [''lovely'']); //func args sent as array


    #### 7\. Functions Can Execute Themselves


    There’s no denying it:


    (function() { alert(''hello''); })(); //alerts ''hello''


    The syntax is simple enough: we declare a function and immediately call it just
    as we call other functions, with () syntax. You might wonder why we would do this.
    It seems like a contradiction in terms: a function normally contains code that
    we want to execute later, not now, otherwise we wouldn’t have put the code in
    a function.


    One good use of self-executing functions (SEFs) is to bind the current values
    of variables for use inside delayed code, such as callbacks to events, timeouts
    and intervals. Here is the problem:


    var someVar = ''hello'';


    setTimeout(function() { alert(someVar); }, 1000);


    var someVar = ''goodbye'';


    Newbies in forums invariably ask why the alert in the timeout says goodbye and
    not hello. The answer is that the timeout callback function is precisely that — a
    callback — so it doesn’t evaluate the value of someVar until it runs. And by then,
    someVar has long since been overwritten by goodbye.


    SEFs provide a solution to this problem. Instead of specifying the timeout callback
    implicitly as we do above, we return it from an SEF, into which we pass the current
    value of someVar as arguments. Effectively, this means we pass in and isolate
    the current value of someVar, protecting it from whatever happens to the actual
    variable someVar thereafter. This is like taking a photo of a car before you respray
    it; the photo will not update with the resprayed color; it will forever show the
    color of the car at the time the photo was taken.


    var someVar = ''hello'';


    setTimeout((function(someVar) {


    return function() { alert(someVar); }


    })(someVar), 1000);


    var someVar = ''goodbye'';


    This time, it alerts hello, as desired, because it is alerting the isolated version
    of someVar (i.e. the function argument, not the outer variable).


    ### The Browser


    #### 8\. Firefox Reads and Returns Colors in RGB, Not Hex


    I’ve never really understood why Mozilla does this. Surely it realizes that anyone
    interrogating computed colors via JavaScript is interested in hex format and not
    RGB. To clarify, here’s an example:


    <!--


    #somePara { color: #f90; }


    -->


    Hello, world!


    <script>


    var ie = navigator.appVersion.indexOf(''MSIE'') != -1;


    var p = document.getElementById(''somePara'');


    alert(ie ? p.currentStyle.color : getComputedStyle(p, null).color);


    </script>'
