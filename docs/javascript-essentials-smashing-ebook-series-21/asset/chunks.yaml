  trans: '

    代码审查与维护良好的编码标准是密相分的。尽管如此，标准通常无法防止逻辑错误或对编程语言特性的误解，无论它是 `JavaScript`、`Ruby`、`Objective-C`
    还是其他语言。即使是最经验丰富的开发者也会犯这类错误，而代码审查可以极大地帮助发现这些错误。


    我们大多数人面对批评的第一反应是维护自己（或我们的代码），并可能进行反击。虽然批评可能会让人有些受挫，但请将其看作一次学习机会，促使我们做得更好、完善自我；因为在很多情况下，一旦我们冷静下来，它确实能带来帮助。


    另外请记住，没有人义务对你的工作提供反馈，如果这些意见确实具有建设性，那么请对他们花时间提供建议表示感谢。


    审查让我们能够借鉴他人的经验，并从第二双眼睛中获益。归结底，它们是我们写出更好代码的机会。是否利用这些机会完全取决于我们自己。


    ## 我可以在哪里获得代码审查？


    通常最具挑战性的部分是找到一位你信任的进行审查的资深开发者。以下你可以请求他人审查你代码的地方（有时也包括其他语言）。


    - [JSMentors](http://jsmentors.com/)


    JSMentors 是一个讨论与 `JavaScript` 相关一切（包括 `Harmony`）的邮件列表，许多经验丰富的开发者是其评审小组成员（包括 `JD
    Dalton`、`Angus Croll` 和 `Nicholas Zakas`）。这些导师并不总是能在线，但他们会尽力对提交的代码提供有用且具建设性的反馈。如果你在寻找超越原生
    `JavaScript` 针对特定 `JavaScript` 框架的帮助，大多数框架和库都有邮件列表或论坛，你可以在那里发帖，可能会提供类似水平的帮助。


    - [freenode IRC](http://webchat.freenode.net/)


    这里的许多聊天室专门用于讨论 `JavaScript` 语言以及寻求帮助或审查。最流行的房间显然是有命名的，`#javascript` 对于通用的 `JavaScript`
    请求特别有用，而像 `#jquery` 和 `#dojo` 等频道则更适合与特定库和框架的问题及请求。


    - [Code Review](http://codereview.stackexchange.com/) (beta)


    你把 Code Review 和 `StackOverflow` 混淆是可以被原的，但它实际上是一个非常实用的、全领域的、客观工具，用于获取代码的同行评审。在
    `StackOverflow` 上，你可能会问“为什么我的代码不起作用？”，而 Code Review 更适合诸如“为什么我的代码这么丑？”的问题。如果你对它提供的内容仍有怀疑，我强烈建议查看
    [FAQs](http://codereview.stackexchange.com/faq)。


    - [Twitter](http://twitter.com/)


    这听起来可能很奇怪，但我提交审查的代码中至少有一半是通过社交网络的。当然，如果你的代码是开源的，社交网络的效果最好，但尝试一下也无害处。我唯一的建议是，确保你关注和与之互动的开发者是有经验的；经验不足的开发者进行的审查有时比完全不审查还要糟糕，所以要小心！


    - [GitHub + reviewth.is](http://github.com/)


    我们都知道 `GitHub` 为代码审查提供了极佳的架构。它带有 `commits`、文件和行注释、更新通知、跟踪 `git` 分叉和仓库的简单方法等。所有缺失的只有一种真正启动审查的方法。一个名为
    [reviewth.is](http://reviewth.is/) 的工具试图纠正这一点，它为你提供了一个 post-commit hook 来帮助自动化这一过程，这样发布在外部的更改都有清晰的
    `#reviewthis` 标签，你可以标记任何你希望审查你更新的用户。如果你的许多同事恰好使用你相同的语言进行开发，这套设置对于近源代码审查效果很好。一种[与此配合得良好的工作流](http://stackoverflow.com/questions/3730527/workflow-for-github-based-code-review)（如果你在团队或协作项目上工作）是在仓库的主题分支中执行你自己的工作，然后通过该分支发送拉取请求（pull
    requests）。审查者将检查更改和 `commits`，然后可以逐行、逐文件地发表评论。你（开发者）将获取这些反馈，并在该主题分支上进行破坏性变基，重新推送，并允许审查循环重复，直到合并可以接受为止。


    ## 我应该如何构建我的审查请求？


    以下是根据经验的关于如何构建你的代码审查请求的一些指南，以增加它们被接受的几率。如果审查者在你的团队中，你可以随意一些；但如果审查者是外部人员，这些建议可能会为你节省一些时间：


    - 隔离你想要审查的内容；确保它可以很容易地运行、分叉和发表注释；清楚地说明你认为哪里可以进行改进；最重要的是，要保持耐心。


    - 让审查者查看、演示和更改你的代码尽可能容易。


    - 不要提交你整个网站或项目的 `ZIP` 文件；很少有人有时间处理所有这些。只有在你的代码绝对需要本地测试的情况下，这种做法是可以接受的。


    - 反之，在 [jsFiddle](http://jsfiddle.net/)、[jsbin](http://www.jsbin.com/) 或 [GitHub](http://gist.github.com/)
    gist 上隔离并减少你想要审查的内容。这将允许审查者轻松分叉你提供的内容，并对可以改进的地方发表意见。如果你更喜欢你的工作与他们建议的更改之间的 `diff`，你可能还会对
    [PasteBin](http://pastebin.com/) 感兴趣。


    - 明确你认为可以改进的地方。这将帮助审查者快速定位你最感兴趣的部分，并节省他们的时间。许多审查者都会查看你提交的其他部分，但如果他们知道你已经知道了这些资源，他们可能会提供替代方案（这正是你所需要的）。


    - 如果英语不是你的母语言，说出来并无害。当其他开发者告知我时，我就知道在审查中应该保持语言技术性还是简单。


    - 保持耐心。有些审查需要几天才有回复，这没有问题。其他开发者通常忙于其他项目，愿意安排查看你工作的人是友好的。这样做有时会有回报，因为审查者在有更多时可以提供更详细的反馈。


    ## 代码审查应该提供什么？


    Jonathan Betz，一位 Google 前开发者，曾说过代码审查理想情况下应该涵盖六个方面：


    1. 正确性 代码做到了它声称要做的吗？


    2. 复杂度 它是否以直接的方式实现了目标？


    3. 一致性 它是否一致地实现了目标？


    4. 可维护性 团队中的其他成员是否可以在合理的努力范围内轻松扩展代码？


    '
- fmt: "\n## 5. Scalability\nIs the code written in such a way that it would work\
    \ for both 100 users and 10,000? Is it optimized?\n\n## 6. Style\nDoes the code\
    \ adhere to a particular style guide (preferably one agreed upon by the team if\
    \ the project is collaborative)?\n\nWhile I agree with this list, expanding it\
    \ into an action guide of what reviewers should practically aim to give developers\
    \ would be useful. So, reviewers should do the following:\n\n- Provide clear comments,\
    \ demonstrate knowledge, and communicate well.\n- Point out the shortfalls in\
    \ an implementation (without being overly critical).\n- State why a particular\
    \ approach isn’t recommended, and, if possible, refer to blog posts, gists, specifications,\
    \ [MDN](http://developer.mozilla.org/) pages and [jsPerf](http://jsperf.com/)\
    \ tests to back up the statement.\n- Suggest alternative solutions, either in\
    \ a separate runnable form or integrated in the code via a fork, so that the developer\
    \ can clearly see what they did wrong.\n- Focus on solutions first, and style\
    \ second. Suggestions on style can come later in the review, but address the fundamental\
    \ problem as thoroughly as possible before paying attention to this.\n- Review\
    \ beyond the scope of what was requested. This is entirely at the reviewer’s discretion,\
    \ but if I notice issues with other aspects of a developer’s implementation, then\
    \ I generally try to advise them on how those, too, might be improved. I’ve yet\
    \ to receive a complaint about this, so I assume it’s not a bad thing.\n\n###\
    \ Collaborative Code Reviews\n\nAlthough a review by one developer can work well,\
    \ an alternative approach is to bring more people into the process. This has a\
    \ few distinct advantages, including reducing the load on individual reviewers\
    \ and exposing more people to your implementation, which could potentially lead\
    \ to more suggestions for improvements. It also allows a reviewer’s comments to\
    \ be screened and corrected if they happen to make a mistake.\n\nTo assist the\
    \ group, you may wish to employ a collaborative tool to allow all reviewers to\
    \ simultaneously inspect and comment on your code. Luckily, a few decent ones\
    \ out there are worth checking out:\n\n- [Review Board](http://www.reviewboard.org/)\n\
    This Web-based tool is available for free under the MIT license. It integrates\
    \ with `Git`, `CVS`, `Mercurial`, `Subversion` and a number of other source-control\
    \ systems. Review Board can be installed on any server running `Apache` or `lighttpd`\
    \ and is free for personal and commercial use.\n\n- [Crucible](http://www.atlassian.com/software/crucible)\n\
    This tool by Australian software company Atlassian is also Web-based. It’s aimed\
    \ at the enterprise and works best with distributed teams. Crucible facilitates\
    \ both live review and live commenting and, like Review Board, integrates with\
    \ a number of source-control tools, including `Git` and `Subversion`.\n\n- [Rietveld](http://code.google.com/p/rietveld/)\n\
    Like the other two, Rietveld also supports collaborative review, but it was actually\
    \ written by the creator of Python, Guido van Rossum. It is designed to run on\
    \ Google’s cloud service and benefits from Guido’s experience writing Mondrian,\
    \ the proprietary app that Google uses internally to review its code.\n\n- Others\n\
    A number of other options for collaborative code review weren’t created for that\
    \ purpose. These include [CollabEdit](http://collabedit.com/) (free and Web-based)\
    \ and, my personal favorite, [EtherPad](http://piratepad.net/front-page/) (also\
    \ free and Web-based).\n\n![exhaustion.jpg](Images/exhaustion.jpg)\n\n(Image Source:\
    \ joelogon)\n\n### Lessons From A JavaScript Code Review\n\nOn to the review.\n\
    \nA developer recently wrote in, asking me to review their code and provide some\
    \ useful suggestions on how they might improve it. While I’m certainly not an\
    \ expert on reviewing code (don’t let the above fool you), here are the problems\
    \ and solutions that I proposed.\n\n#### Problem 1\n\n**Problem**: Functions and\
    \ objects are passed as arguments to other functions without any type validation.\n\
    \n**Feedback**: Type validation is an essential step in ensuring that you’re working\
    \ only with input of a desired type. Without sanitization checks in place, you\
    \ run the risk of users passing in just about anything (a string, a date, an array,\
    \ etc.), which could easily break your application if you haven’t developed it\
    \ defensively. For functions, you should do the following at a minimum:\n\n1.\
    \ Test to ensure that arguments being passed actually exist,\n2. Do a `typeof`\
    \ check to prevent the app from executing input that is not a valid function at\
    \ all.\n\n```\nif (callback && typeof callback === \"function\"){\n  /* rest of\
    \ your logic */\n}else{\n  /* not a valid function */\n}\n```\n\nUnfortunately,\
    \ a simple `typeof` check isn’t enough on its own. As Angus Croll points out in\
    \ his post “[Fixing the typeof operator](http://javascriptweblog.wordpress.com/2011/08/08/fixing-the-javascript-typeof-operator/),”\
    \ you need to be aware of a number of issues with `typeof` checking if you’re\
    \ using them for anything other than functions.\n\nFor example, `typeof null`\
    \ returns `object`, which is technically incorrect. In fact, when `typeof` is\
    \ applied to any object type that isn’t a function, it returns `object`, not distinguishing\
    \ between `Array`, `Date`, `RegEx` or whatever else.\n\nThe solution is to use\
    \ `Object.prototype.toString` to call the underlying internal property of JavaScript\
    \ objects known as `[[Class]]`, the class property of the object. Unfortunately,\
    \ specialized built-in objects generally overwrite `Object.prototype.toString`,\
    \ but you can force the generic `toString` function on them:\n\n```javascript\n\
    Object.prototype.toString.call([1,2,3]); //\"[object Array]\"\n```\n\nYou might\
    \ also find Angus’s function below useful as a more reliable alternative to `typeof`.\
    \ Try calling `betterTypeOf()` against objects, arrays and other types to see\
    \ what happens.\n\n```javascript\nfunction betterTypeOf( input ){\n  return Object.prototype.toString.call(input).match(/^\\\
    [object\\s(.*)\\]$/)[1];\n}\n```\n\nHere, `parseInt()` is being blindly used to\
    \ parse an integer value of user input, but no base is specified. This can cause\
    \ issues.\n\nIn [JavaScript: The Good Parts](http://shop.oreilly.com/product/9780596517748.do),\
    \ Douglas Crockford refers to `parseInt()` as being dangerous. Although you probably\
    \ know that passing it a string argument returns an integer, you should also ideally\
    \ specify a base or radix as the second argument, otherwise it might return unexpected\
    \ output. Take the following example:\n\n```javascript\nparseInt('20'); // returns\
    \ what you expect, however…\nparseInt('020'); // returns 16\nparseInt('000020');\
    \ // returns 16\nparseInt('020', 10); // returns 20 as we've specified the base\
    \ to use\n```\n\nYou’d be surprised by how many developers omit the second argument,\
    \ but it happens quite regularly. Remember that your users (if permitted to freely\
    \ enter numeric input) won’t necessarily follow number conventions (because they’re\
    \ crazy!). I’ve seen 020, ,20, ;'20 and many other variations used, so do your\
    \ best to parse as broad a range of inputs as possible. The following tricks to\
    \ using `parseInt()` are occasionally better:\n\n```javascript\nMath.floor(\"\
    020\"); // returns 20\nMath.floor(\"0020\"); //returns 20\nNumber(\"020\"); //returns\
    \ 20\nNumber(\"0020\"); //returns 20\n+\"020\"; //returns 20\n```\n\n#### Problem\
    \ 2\n\n**Problem**: Checks for browser-specific conditions being met are repeated\
    \ throughout the code base (for example, feature detection, checks for supported\
    \ ES5 features, etc.).\n\n**Feedback**: Ideally, your code base should be as DRY\
    \ as possible, and there are some elegant solutions to this problem. For example,\
    \ you might benefit from the load-time configuration pattern here (also called\
    \ load-time and init-time branching). The basic idea is that you test a condition\
    \ only once (when the application loads) and then access the result of that test\
    \ for all subsequent checks. This pattern is commonly found in JavaScript libraries\
    \ that configure themselves at load time to be optimized for a particular browser.\n\
    \n```javascript\nvar tools = {\n  addMethod: null,\n  removeMethod: null\n};\n\
    ```\n"
  raw: '5.Scalability Is the code written in such a way that it would work for both
    100 users and 10,000? Is it optimized?


    6.Style Does the code adhere to a particular style guide (preferably one agreed
    upon by the team if the project is collaborative)?


    While I agree with this list, expanding it into an action guide of what reviewers
    should practically aim to give developers would be useful. So, reviewers should
    do the following:


    •Provide clear comments, demonstrate knowledge, and communicate well.


    •Point out the shortfalls in an implementation (without being overly critical).


    •State why a particular approach isn’t recommended, and, if possible, refer to
    blog posts, gists, specifications, [MDN](http://developer.mozilla.org/) pages
    and [jsPerf](http://jsperf.com/) tests to back up the statement.


    •Suggest alternative solutions, either in a separate runnable form or integrated
    in the code via a fork, so that the developer can clearly see what they did wrong.


    •Focus on solutions first, and style second. Suggestions on style can come later
    in the review, but address the fundamental problem as thoroughly as possible before
    paying attention to this.


    •Review beyond the scope of what was requested. This is entirely at the reviewer’s
    discretion, but if I notice issues with other aspects of a developer’s implementation,
    then I generally try to advise them on how those, too, might be improved. I’ve
    yet to receive a complaint about this, so I assume it’s not a bad thing.


    ### Collaborative Code Reviews


    Although a review by one developer can work well, an alternative approach is to
    bring more people into the process. This has a few distinct advantages, including
    reducing the load on individual reviewers and exposing more people to your implementation,
    which could potentially lead to more suggestions for improvements. It also allows
    a reviewer’s comments to be screened and corrected if they happen to make a mistake.


    To assist the group, you may wish to employ a collaborative tool to allow all
    reviewers to simultaneously inspect and comment on your code. Luckily, a few decent
    ones out there are worth checking out:


    •[Review Board](http://www.reviewboard.org/)


    This Web-based tool is available for free under the MIT license. It integrates
    with Git, CVS, Mercurial, Subversion and a number of other source-control systems.
    Review Board can be installed on any server running Apache or lighttpd and is
    free for personal and commercial use.


    •[Crucible](http://www.atlassian.com/software/crucible)


    This tool by Australian software company Atlassian is also Web-based. It’s aimed
    at the enterprise and works best with distributed teams. Crucible facilitates
    both live review and live commenting and, like Review Board, integrates with a
    number of source-control tools, including Git and Subversion.


    •[Rietveld](http://code.google.com/p/rietveld/)


    Like the other two, Rietveld also supports collaborative review, but it was actually
    written by the creator of Python, Guido van Rossum. It is designed to run on Google’s
    cloud service and benefits from Guido’s experience writing Mondrian, the proprietary
    app that Google uses internally to review its code.


    •Others


    A number of other options for collaborative code review weren’t created for that
    purpose. These include [CollabEdit](http://collabedit.com/) (free and Web-based)
    and, my personal favorite, [EtherPad](http://piratepad.net/front-page/) (also
    free and Web-based).


    ![exhaustion.jpg](Images/exhaustion.jpg)


    (Image Source: joelogon)


    ### Lessons From A JavaScript Code Review


    On to the review.


    A developer recently wrote in, asking me to review their code and provide some
    useful suggestions on how they might improve it. While I’m certainly not an expert
    on reviewing code (don’t let the above fool you), here are the problems and solutions
    that I proposed.


    #### Problem 1


    Problem: Functions and objects are passed as arguments to other functions without
    any type validation.


    Feedback: Type validation is an essential step in ensuring that you’re working
    only with input of a desired type. Without sanitization checks in place, you run
    the risk of users passing in just about anything (a string, a date, an array,
    etc.), which could easily break your application if you haven’t developed it defensively.
    For functions, you should do the following at a minimum:


    1.Test to ensure that arguments being passed actually exist,


    2.Do a typeof check to prevent the app from executing input that is not a valid
    function at all.


    if (callback && typeof callback === "function"){


    /* rest of your logic */


    }else{


    /* not a valid function */


    }


    Unfortunately, a simple typeof check isn’t enough on its own. As Angus Croll points
    out in his post “[Fixing the typeof operator](http://javascriptweblog.wordpress.com/2011/08/08/fixing-the-javascript-typeof-operator/),”
    you need to be aware of a number of issues with typeof checking if you’re using
    them for anything other than functions.


    For example, typeof null returns object, which is technically incorrect. In fact,
    when typeof is applied to any object type that isn’t a function, it returns object,
    not distinguishing between Array, Date, RegEx or whatever else.


    The solution is to use Object.prototype.toString to call the underlying internal
    property of JavaScript objects known as [[Class]], the class property of the object.
    Unfortunately, specialized built-in objects generally overwrite Object.prototype.toString,
    but you can force the generic toString function on them:


    Object.prototype.toString.call([1,2,3]); //"[object Array]"


    You might also find Angus’s function below useful as a more reliable alternative
    to typeof. Try calling betterTypeOf() against objects, arrays and other types
    to see what happens.


    function betterTypeOf( input ){


    return Object.prototype.toString.call(input).match(/^\[object\s(.*)\]$/)[1];


    }


    Here, parseInt() is being blindly used to parse an integer value of user input,
    but no base is specified. This can cause issues.


    In [JavaScript: The Good Parts](http://shop.oreilly.com/product/9780596517748.do),
    Douglas Crockford refers to parseInt() as being dangerous. Although you probably
    know that passing it a string argument returns an integer, you should also ideally
    specify a base or radix as the second argument, otherwise it might return unexpected
    output. Take the following example:


    parseInt(''20''); // returns what you expect, however…


    parseInt(''020''); // returns 16


    parseInt(''000020''); // returns 16


    parseInt(''020'', 10); // returns 20 as we''ve specified the base to use


    You’d be surprised by how many developers omit the second argument, but it happens
    quite regularly. Remember that your users (if permitted to freely enter numeric
    input) won’t necessarily follow standard number conventions (because they’re crazy!).
    I’ve seen 020, ,20, ;''20 and many other variations used, so do your best to parse
    as broad a range of inputs as possible. The following tricks to using parseInt()
    are occasionally better:


    Math.floor("020"); // returns 20


    Math.floor("0020"); //returns 20


    Number("020"); //returns 20


    Number("0020"); //returns 20


    +"020"; //returns 20


    Problem 2


    Problem: Checks for browser-specific conditions being met are repeated throughout
    the code base (for example, feature detection, checks for supported ES5 features,
    etc.).


    Feedback: Ideally, your code base should be as DRY as possible, and there are
    some elegant solutions to this problem. For example, you might benefit from the
    load-time configuration pattern here (also called load-time and init-time branching).
    The basic idea is that you test a condition only once (when the application loads)
    and then access the result of that test for all subsequent checks. This pattern
    is commonly found in JavaScript libraries that configure themselves at load time
    to be optimized for a particular browser.


    This pattern could be implemented as follows:


    var tools = {


    addMethod: null,


    removeMethod: null


    };'
