    •Be patient. Some reviews take several days to get back to me, and nothing’s wrong
    with that. Other developers are usually busy with other projects, and someone
    who agrees to schedule a look at your work is being kind. Be patient, don’t spam
    them with reminders, and be understanding if they get delayed. Doing this sometimes
    pay off, because the reviewer can provide even more detailed feedback when they
    have more time.


    ### What Should Code Reviews Provide?


    Jonathan Betz, a former developer at Google, once said that a code review should
    ideally address six things:


    1.Correctness Does the code do everything it claims?


    2.Complexity Does it accomplish its goals in a straightforward way?


    3.Consistency Does it achieve its goals consistently?


    4.Maintainability Could the code be easily extended by another member of the team
    with a reasonable level of effort?'
