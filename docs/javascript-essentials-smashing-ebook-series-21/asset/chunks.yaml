  trans: "\n然而，这在函数外部不会产生任何作用。如果这正是你需要的，那么太好了。你大可以抛弃这个名字了：\n\n```javascript\n(function(){\n\
    \nvar name = 'Chris';\n\nvar age = '34';\n\nvar status = 'single';\n\nfunction\
    \ createMember(){\n\n// [...]\n\n}\n\nfunction getMemberDetails(){\n\n// [...]\n\
    }\n\n})();\n```\n\n如果你需要让某些内容对外部可访问，那么你就需要修改这里。为了访问 `createMember()` 或 `getMemberDetails()`，你需要将它们返回到外部世界，使其成为\
    \ `myApplication` 的属性：\n\n```javascript\nvar myApplication = function(){\n\nvar\
    \ name = 'Chris';\n\nvar age = '34';\n\nvar status = 'single';\n\nreturn{\n\n\
    createMember:function(){\n\n// [...]\n},\n\ngetMemberDetails:function(){\n// [...]\n\
    }\n}\n}();\n\n// myApplication.createMember() 和\n// myApplication.getMemberDetails()\
    \ 现在可以工作。\n```\n\n这被称为模块模式或单例。Douglas Crockford 经常提到它，并且被广泛应用于[雅虎用户界面库 YUI](http://developer.yahoo.com/yui)。令我困扰的是，我必须切换语法才能让函数或变量对外部可用。此外，如果我想从一个方法调用另一个方法，我必须在调用时加上\
    \ `myApplication` 名称。因此，我更倾向于直接返回我想要公开的元素的指针。这甚至允许我缩短外部使用的名称：\n\n```javascript\n\
    var myApplication = function(){\n\nvar name = 'Chris';\n\nvar age = '34';\n\n\
    var status = 'single';\n\nfunction createMember(){\n\n// [...]\n}\n\nfunction\
    \ getMemberDetails(){\n\n// [...]\n}\n\nreturn{\n\ncreate:createMember,\n\nget:getMemberDetails\n\
    }\n}();\n\n//myApplication.get() 和 myApplication.create() 现在可以工作。\n```\n\n我将这种模式称为“[揭示模块模式](http://www.wait-till-i.com/2007/08/22/again-with-the-module-pattern-reveal-something-to-the-world/)”。\n\
    \n### 支持配置\n\n每当我写了 JavaScript 并将其推给世界时，人们都会修改它，通常当他们想要它执行一些开箱即用无法实现的功能时——但往往也是因为我让人们修改内容变得太难了。\n\
    \n解决办法是在你的脚本中添加配置对象。我曾详细写过[JavaScript 配置对象](http://www.wait-till-i.com/2008/05/23/script-configuration/)，但这里是核心点：\n\
    \n- 在整个脚本中包含一个名为 `configuration` 的对象。\n- 在其中存储所有人们在使用你的脚本时可能会更改的项：\n    - CSS\
    \ ID 和类名；\n    - 用于生成按钮的字符串（如标签）；\n    - 诸如“显示的图像数量”、“地图尺寸”等值；\n    - 位置、区域和语言设置。\n\
    - 将该对象作为公共属性返回，以便人们可以对其进行覆盖。\n\n大多数时候，你可以在编码过程的最后一步完成此操作。我整理了一个示例在[交给下一位开发者之前对脚本要做的五件事](http://www.wait-till-i.com/2008/02/07/five-things-to-do-to-a-script-before-handing-it-over-to-the-next-developer/)中。\n\
    \n本质上，你想要让人们轻松使用你的代码并根据他们的需求进行修改。如果你这样做了，你就不太可能收到那些抱怨你的脚本并引用他人实际所做更改的困惑邮件了。\n\n\
    ### 与后端交互\n\n我在多年 JavaScript 经验中中学到的主要点之一是，它是一个构建交互界面的极佳语言，但在处理数字和访问数据源时，它可能会让人力不从心。\n\
    \n最初，我学习 JavaScript 是为了取代 Perl，因为我厌倦了为了让它运行而将内容复制到 `cgi-bin` 文件夹。后来，我发现让后端语言为我进行主要的数据处理，而不是尝试在\
    \ JavaScript 中完成所有工作，在安全性和语言方面更有意义。\n\n如果我访问一个 Web 服务，我可以获取 `JSON-P` 作为返回格式并在客户端进行大量数据转换，但既然我有一个拥有更丰富数据转换方式、并且可以以\
    \ `JSON` 或 `HTML` 返回数据并为我缓存的服务器，我为什么要那样做呢？\n\n所以，如果你想使用 `AJAX`，请学习 `HTTP` 以及编写你自己的缓存和转换代理。从长远来看，这将节省你大量的时间精力。\n\
    \n### 浏览器特定代码是浪费时间。使用库！\n\n当我开始 Web 开发时，使用 `document.all` 和使用 `document.layers`\
    \ 作为访问文档的主要方式的战斗仍在进行中。我选择了 `document.layers`，因为我喜欢任何层都是自己的文档的想法（而且我写的 `document.write`\
    \ 解决方案足够用一辈子了）。层模型失败了，`document.all` 也失败了。当 Netscape 6 全力仅支持 W3C DOM 模型时，我非常喜欢，但终端用户并不在意。终端用户只看到这个浏览器没有正确显示互联网的大部分内容（尽管它显示了）——是我们产生的代码有问题。我们编写了支持尖端环境的短期代码，而尖端技术的有趣之处在于它在不断变化。\n\
    \n我浪费了大量时间来学习所有浏览器的细节并解决它们的问题。在当时这样做确保了我的职业，并确保我有一份好工作。但我们再也不需要经历这种火礼了。\n\n像 `YUI`、`jQuery`\
    \ 和 `Dojo` 这样的库是为了帮助我们解决这些问题的。它们通过抽象实现不良、不一致和明显的 Bug 等痛苦来承担浏览器的问题，并将我们从这些繁琐工作中解脱出来。除非你是某个浏览器的忠实粉丝并对其进行\
    \ Beta 测试，否则不要在你的 JavaScript 解决方案中修复浏览器问题，因为你可能不会更新代码来移除这个修复。你所做的只是给 Web 上已经庞大的过时代码堆又添新砖。\n\
    \n尽管如此，完全依赖库作为核心技能是短视的。阅读 JavaScript，看一些关于它的优秀视频和教程，并理解这门语言。（提示：闭包是上帝给 JavaScript\
    \ 开发者的礼物。）库将帮助你快速构建东西，但如果你分配了大量的事件和效果，并需要为文档中的每个 HTML 元素添加类，那么你的做法就错了。\n\n###\
    \ 资源\n\n除了本文提到的资源外，还可以查看以下内容来学习 JavaScript：\n\n- [Douglas Crockford 谈 JavaScript](http://yuiblog.com/crockford/)\n\
    \    一个系列深度的视频讲座。\n- [Opera Web 标准课程](http://dev.opera.com/articles/wsc/)\n  \
    \  包含关于 JavaScript 的详细章节。\nWordPress Essentials: How To Create A WordPress Plugin\n\
    \n# 从 JavaScript 代码审查获得的教训\n\nAddy Osmani\n\n在我们开始之前，我想提一个问题：你上一次请求别人审查你的代码是什么时候？代码审查可能是提高你解决方案整体质量的单一最佳技术，如果你没有积极利用它，那么你就错过了识别\
    \ Bug 以及听取可能让你的代码更好的建议的机会。\n\n我们没有人在任何时候都能写出 100% 没有 Bug 的代码，所以不要觉得寻求帮助带有污名。我们行业中一些经验最丰富的开发者，从框架作者到浏览器开发者，都会经常请求他人审查他们的代码；询问某些地方是否可以调整，绝不应该被认为是羞耻。审查是像任何其他技术一样的技术，应该尽可能地使用。\n\
    \n今天，我们将看看在哪里可以获得代码审查，如何构建你的请求，以及审查者在看什么。最近我被请求审查一个新 JavaScript 应用的代码，我想分享我的一些反馈，因为它们涵盖了一些始终有用的\
    \ JavaScript 基础知识。\n\n### 引言\n"
- fmt: '

    Reviewing code goes hand in hand with maintaining strong coding standards. That
    said, standards don’t usually prevent logical errors or misunderstandings about
    the quirks of a programming language, whether it’s `JavaScript`, `Ruby`, `Objective-C`
    or something else. Even the most experienced developers can make these kinds of
    mistakes, and reviewing code can greatly assist with catching them.


    The first reaction most of us have to criticism is to defend ourselves (or our
    code), and perhaps lash back. While criticism can be slightly demoralizing, think
    of it as a learning experience that spurs us to do better and to improve ourselves;
    because in many cases, once we’ve calmed down, it actually does.


    Also remember that no one is obliged to provide feedback on your work, and if
    the comments are indeed constructive, then be grateful for the time spent offering
    the input.


    Reviews enable us to build on the experience of others and to benefit from a second
    pair of eyes. And at the end of the day, they are an opportunity for us to write
    better code. Whether we take advantage of them is entirely our choice.


    ## Where Can I Get My Code Reviewed?


    Often the most challenging part is actually finding an experienced developer who
    you trust to do the review. Below are some places where you can request others
    to review your code (sometimes in other languages, too).


    - [JSMentors](http://jsmentors.com/)


    JSMentors is a mailing list that discusses everything to do with `JavaScript`
    (including `Harmony`), and a number of experienced developers are on its review
    panel (including `JD Dalton`, `Angus Croll` and `Nicholas Zakas`). These mentors
    might not always be readily available, but they do their best to provide useful,
    constructive feedback on code that’s been submitted. If you’re looking for assistance
    with a specific `JavaScript` framework beyond vanilla `JavaScript`, the majority
    of frameworks and libraries have mailing lists or forums that you can post to
    and that might provide a similar level of assistance.


    - [freenode IRC](http://webchat.freenode.net/)


    Many chat rooms here are dedicated both to discussing the `JavaScript` language
    and to requests for help or review. The most popular rooms are obviously named,
    and `#javascript` is particularly useful for generic `JavaScript` requests, while
    channels such as `#jquery` and `#dojo` are better for questions and requests related
    to particular libraries and frameworks.


    - [Code Review](http://codereview.stackexchange.com/) (beta)


    You would be forgiven for confusing Code Review with `StackOverflow`, but it’s
    actually a very useful, broad-spectrum, subjective tool for getting peer review
    of code. While on `StackOverflow` you might ask the question “Why isn’t my code
    working?,” Code Review is more suited to questions like “Why is my code so ugly?”
    If you still have any doubt about what it offers, I strongly recommend checking
    out the [FAQs](http://codereview.stackexchange.com/faq).


    - [Twitter](http://twitter.com/)


    This might sound odd, but at least half of the code that I submit for review is
    through social networks. Social networks work best, of course, if your code is
    open source, but trying them never hurts. The only thing I suggest is to ensure
    that the developers who you follow and interact with are experienced; a review
    by a developer with insufficient experience can sometimes be worse than no review
    at all, so be careful!


    - [GitHub + reviewth.is](http://github.com/)


    We all know that `GitHub` provides an excellent architecture for reviewing code.
    It comes with `commits`, file and line comments, update notifications, an easy
    way to track forks of `gits` and repositories, and more. All that’s missing is
    a way to actually initiate reviews. A tool called [reviewth.is](http://reviewth.is/)
    attempts to rectify that by giving you a post-commit hook that helps to automate
    this process, so changes that get posted in the wild have a clear `#reviewthis`
    hash tag, and you can tag any users who you wish to review your updates. If many
    of your colleagues happen to develop in the same language as you do, this set-up
    can work well for code reviews sourced closer to home. One [workflow that works
    well with this](http://stackoverflow.com/questions/3730527/workflow-for-github-based-code-review)
    (if you’re working on a team or on a collaborative project) is to perform your
    own work in a topic branch in a repository and then send through pull requests
    on that branch. Reviewers would examine the changes and `commits` and could then
    make line-by-line and file-by-file comments. You (the developer) would then take
    this feedback and do a destructive rebase on that topic branch, re-push it, and
    allow the review cycle to repeat until merging them would be acceptable.


    ## How Should I Structure My Review Requests?


    The following are some guidelines (based on experience) on how to structure your
    requests for code reviews, to increase the chances of them being accepted. You
    can be more liberal with them if the reviewer is on your team; but if the reviewer
    is external, then these might save you some time:


    - Isolate what you would like to be reviewed; ensure that it can be easily run,
    forked and commented; be clear about where you think improvements could be made;
    and, above all, be patient.


    - Make it as easy as possible for the reviewer to look at, demo and change your
    code.


    - Don’t submit a `ZIP` file of your entire website or project; very few people
    have the time to go through all of this. The only situation in which this would
    be acceptable is if your code absolutely required local testing.


    - Instead, isolate and reduce what you would like to be reviewed on [jsFiddle](http://jsfiddle.net/),
    on [jsbin](http://www.jsbin.com/) or in a [GitHub](http://gist.github.com/) gist.
    This will allow the reviewer to easily fork what you’ve provided and to show changes
    and comments on what can be improved. If you would prefer a `diff` between your
    work and any changes they’ve recommended, you might also be interested in [PasteBin](http://pastebin.com/).


    - Clearly indicate where you personally feel the implementation could be improved.
    This will help the reviewer quickly home in on what you’re most interested in
    having reviewed and will save them time. Many reviewers will still look at other
    parts of the code you’ve submitted regardless, but at least help them prioritize.


    - Indicate what (if any) research you’ve done into techniques for improving the
    code. reviewer might very well suggest the same resources, but if they’re aware
    that you already know of them, then they might offer alternative suggestions (which
    is what you want).


    - If English isn’t your first language, there’s no harm in saying so. When other
    developers inform me of this, I know whether to keep the language in my review
    technical or simple.


    - Be patient. Some reviews take several days to get back to me, and nothing’s
    wrong with that. Other developers are usually busy with other projects, and someone
    who agrees to schedule a look at your work is being kind. Doing this sometimes
    pay off, because the reviewer can provide even more detailed feedback when they
    have more time.


    ## What Should Code Reviews Provide?


    Jonathan Betz, a former developer at Google, once said that a code review should
    ideally address six things:


    1. Correctness Does the code do everything it claims?


    2. Complexity Does it accomplish its goals in a straightforward way?


    3. Consistency Does it achieve its goals consistently?


    4. Maintainability Could the code be easily extended by another member of the
    team with a reasonable level of effort?

    '
  raw: 'Reviewing code goes hand in hand with maintaining strong coding standards.
    That said, standards don’t usually prevent logical errors or misunderstandings
    about the quirks of a programming language, whether it’s JavaScript, Ruby, Objective-C
    or something else. Even the most experienced developers can make these kinds of
    mistakes, and reviewing code can greatly assist with catching them.


    The first reaction most of us have to criticism is to defend ourselves (or our
    code), and perhaps lash back. While criticism can be slightly demoralizing, think
    of it as a learning experience that spurs us to do better and to improve ourselves;
    because in many cases, once we’ve calmed down, it actually does.


    Also remember that no one is obliged to provide feedback on your work, and if
    the comments are indeed constructive, then be grateful for the time spent offering
    the input.


    Reviews enable us to build on the experience of others and to benefit from a second
    pair of eyes. And at the end of the day, they are an opportunity for us to write
    better code. Whether we take advantage of them is entirely our choice.


    ### Where Can I Get My Code Reviewed?


    Often the most challenging part is actually finding an experienced developer who
    you trust to do the review. Below are some places where you can request others
    to review your code (sometimes in other languages, too).


    •[JSMentors](http://jsmentors.com/)


    JSMentors is a mailing list that discusses everything to do with JavaScript (including
    Harmony), and a number of experienced developers are on its review panel (including
    JD Dalton, Angus Croll and Nicholas Zakas). These mentors might not always be
    readily available, but they do their best to provide useful, constructive feedback
    on code that’s been submitted. If you’re looking for assistance with a specific
    JavaScript framework beyond vanilla JavaScript, the majority of frameworks and
    libraries have mailing lists or forums that you can post to and that might provide
    a similar level of assistance.


    •[freenode IRC](http://webchat.freenode.net/)


    Many chat rooms here are dedicated both to discussing the JavaScript language
    and to requests for help or review. The most popular rooms are obviously named,
    and #javascript is particularly useful for generic JavaScript requests, while
    channels such as #jquery and #dojo are better for questions and requests related
    to particular libraries and frameworks.


    •[Code Review](http://codereview.stackexchange.com/) (beta)


    You would be forgiven for confusing Code Review with StackOverflow, but it’s actually
    a very useful, broad-spectrum, subjective tool for getting peer review of code.
    While on StackOverflow you might ask the question “Why isn’t my code working?,”
    Code Review is more suited to questions like “Why is my code so ugly?” If you
    still have any doubt about what it offers, I strongly recommend checking out the
    [FAQs](http://codereview.stackexchange.com/faq).


    •[Twitter](http://twitter.com/)


    This might sound odd, but at least half of the code that I submit for review is
    through social networks. Social networks work best, of course, if your code is
    open source, but trying them never hurts. The only thing I suggest is to ensure
    that the developers who you follow and interact with are experienced; a review
    by a developer with insufficient experience can sometimes be worse than no review
    at all, so be careful!


    •[GitHub + reviewth.is](http://github.com/)


    We all know that GitHub provides an excellent architecture for reviewing code.
    It comes with commits, file and line comments, update notifications, an easy way
    to track forks of gits and repositories, and more. All that’s missing is a way
    to actually initiate reviews. A tool called [reviewth.is](http://reviewth.is/)
    attempts to rectify that by giving you a post-commit hook that helps to automate
    this process, so changes that get posted in the wild have a clear #reviewthis
    hash tag, and you can tag any users who you wish to review your updates. If many
    of your colleagues happen to develop in the same language as you do, this set-up
    can work well for code reviews sourced closer to home. One [workflow that works
    well with this](http://stackoverflow.com/questions/3730527/workflow-for-github-based-code-review)
    (if you’re working on a team or on a collaborative project) is to perform your
    own work in a topic branch in a repository and then send through pull requests
    on that branch. Reviewers would examine the changes and commits and could then
    make line-by-line and file-by-file comments. You (the developer) would then take
    this feedback and do a destructive rebase on that topic branch, re-push it, and
    allow the review cycle to repeat until merging them would be acceptable.


    ### How Should I Structure My Review Requests?


    The following are some guidelines (based on experience) on how to structure your
    requests for code reviews, to increase the chances of them being accepted. You
    can be more liberal with them if the reviewer is on your team; but if the reviewer
    is external, then these might save you some time:


    •Isolate what you would like to be reviewed; ensure that it can be easily run,
    forked and commented; be clear about where you think improvements could be made;
    and, above all, be patient.


    •Make it as easy as possible for the reviewer to look at, demo and change your
    code.


    •Don’t submit a ZIP file of your entire website or project; very few people have
    the time to go through all of this. The only situation in which this would be
    acceptable is if your code absolutely required local testing.


    •Instead, isolate and reduce what you would like to be reviewed on [jsFiddle](http://jsfiddle.net/),
    on [jsbin](http://www.jsbin.com/) or in a [GitHub](http://gist.github.com/) gist.
    This will allow the reviewer to easily fork what you’ve provided and to show changes
    and comments on what can be improved. If you would prefer a “diff” between your
    work and any changes they’ve recommended, you might also be interested in [PasteBin](http://pastebin.com/),
    which supports this.


    •Similarly, don’t just submit a link to a page and ask them to “View source” in
    order to see what can be improved. On websites with a lot of scripts, this task
    would be challenging and lowers the chances of a reviewer agreeing to help. No
    one wants to work to find what you want reviewed.


    •Clearly indicate where you personally feel the implementation could be improved.
    This will help the reviewer quickly home in on what you’re most interested in
    having reviewed and will save them time. Many reviewers will still look at other
    parts of the code you’ve submitted regardless, but at least help them prioritize.


    •Indicate what (if any) research you’ve done into techniques for improving the
    code. The reviewer might very well suggest the same resources, but if they’re
    aware that you already know of them, then they might offer alternative suggestions
