  trans: "\n\n# 罪状 #3：任务使用了错误的技术\n\nJavaScript 最大的问题在于当你用错误的工具来完成任务时。这会让维护变成一场噩梦，并降低代码质量。应该根据它们的设计初衷使用工具。这意味着：\n\
    \n* 绝对核心的内容和标记应该放在 `HTML` 中，无论它将显示在什么种环境中。\n* 任何“外观和感受”元素都应该通过 `CSS` 进行维护。你不应该为了改变一个颜色而翻遍\
    \ `JavaScript` 代码。\n* 任何超出悬停效果之外的用户交互（根据定义，悬停效果只是交互的邀请，而非交互本身——因为键盘用户可能无法访问这些效果）都应该用\
    \ `JavaScript` 完成。\n\n这种方法之所以目前仍然是一个有效、务实且合理的开发方案，主要原因是：随着 Web 技术变得越来越复杂（例如，你可以用\
    \ `CSS` 和 `JavaScript` 创建内容，在 `CSS` 中进行动画和变换，而且如果你真的想的话，可以用 `HTML` 来绘画），人们对这些不同技术的技能和兴趣差异很大。\n\
    \n语义化标记的支持者对在 `JavaScript` 中应用闭包并不感兴趣。`JavaScript` 开发者对 `CSS` 中元素的顺序不感兴趣。而 `CSS`\
    \ 粉丝则不热于学习如何让一个 `JavaScript` 动画无闪烁运行。\n\n这导致相同的问题被反复解决，只是使用了不同的技术。这是一个市场范围内的问题：多年前许多先进的\
    \ `Canvas` 技巧都是在 `Flash` 中实现的，它们的影响尚有争议，而问题也得到了修复。\n\n我最喜欢的一个例子是，人们编写循环来隐藏页面上的许多元素，以便稍后使用。\n\
    \n假设这是你的 `HTML`：\n\n```html\n<h2>Section 1</h2>\n<div class=\"section\">\n<p>Section\
    \ 1 content</p>\n</div>\n<h2>Section 2</h2>\n<div class=\"section\">\n<p>Section\
    \ 2 content</p>\n</div>\n<h2>Section 3</h2>\n<div class=\"section\">\n<p>Section\
    \ 3 content</p>\n</div>\n<h2>Section 4</h2>\n<div class=\"section\">\n<p>Section\
    \ 4 content</p>\n</div>\n```\n\n[针对此问题的普通 jQuery 解决方案](http://icant.co.uk/articles/sins/sins_sectiondemo.html)\
    \ 是：\n\n```javascript\n$(document).ready(function(){\n  $('.section').hide();\n\
    \  $('h2').click(function(e){\n    $(this).next().toggle();\n  })\n});\n```\n\n\
    然后你会发现，如果[让当前章节的样式与其他章节不同](http://icant.co.uk/articles/sins/sins_section_with_current.html)\
    \ 就太棒了。\n\n```javascript\n$(document).ready(function(){\n  $('.section').hide();\n\
    \  $('h2').click(function(e){\n    $(this).next().toggle();\n    $(this).next().css('background','#ccc');\n\
    \    $(this).next().css('border','1px solid #999');\n    $(this).next().css('padding','5px');\n\
    \  })\n});\n```\n\n这里有几地方是不的。首先，你通过 `JavaScript` 而不是 `CSS` 来控制外观和感受，导致这难以维护（这一点稍后详述）。其次是性能问题：虽然\
    \ `jQuery` 速度惊人，但很多代码仍然隐藏在 `$('.section').hide()` 之下。最后，也是非常痛苦的性能问题是那些复制粘贴的设置\
    \ `CSS` 的行。不要让 `jQuery` 连续四次寻找相邻元素并对其进行操作。你可以将 `next()` 存储在变量中，但如果使用链式调用，甚至不需要这样做。如果你真的需要在\
    \ `jQuery` 中设置很多 `CSS`，请使用映射（map）：\n\n```javascript\n$(document).ready(function(){\n\
    \  $('.section').hide();\n  $('h2').click(function(e){\n    $(this).next().toggle().css({\n\
    \      'background':'#ffc',\n      'border':'1px solid #999',\n      'padding':'5px'\n\
    \    });\n  })\n});\n```\n\n如果你想[任何时间只允许其中](http://icant.co.uk/articles/sins/sins_section_single_open.html)\
    \ 打开呢？没有经验的开发者会这样做这样做：\n\n```javascript\n$(document).ready(function(){\n  $('.section').hide();\n\
    \  $('h2').click(function(e){\n    $('.section').hide();\n    $(this).next().toggle().css({\n\
    \      'background':'#ffc',\n      'border':'1px solid #999',\n      'padding':'5px'\n\
    \    });\n  })\n});\n```\n\n这虽然起作用，但你正在遍历文档并频繁访问 DOM，这很慢。你可以通过将当前打开的章节保留在变量中来缓解这一点：\n\
    \n```javascript\n$(document).ready(function(){\n  var current = false;\n  $('.section').hide();\n\
    \  $('h2').click(function(e){\n    if(current){\n      current.hide();\n    }\n\
    \    current = $(this).next();\n    current.toggle().css({\n      'background':'#ffc',\n\
    \      'border':'1px solid #999',\n      'padding':'5px'\n    });\n  })\n});\n\
    ```\n\n将当前章节预定义为 `false`，并在点击第一个标题时设置它。这样你只需只在 `current` 为 `true` 时才隐藏它，从而消除了再次遍历所有具有\
    \ `section` 元素的元素的性。\n\n但有趣的一点在于：如果你只是想显示和隐藏章节，你根本不需要任何循环！`CSS` 在渲染和应用类时已经遍历了文档。你只需要[给它提供一个挂载点](http://icant.co.uk/articles/sins/sins_section_with_current.html)，比如一个类：\n\
    \n```javascript\n$(document).ready(function(){\n  $('body').addClass('js');\n\
    \  var current = null;\n  $('h2').click(function(e){\n    if(current){\n     \
    \ current.removeClass('current');\n    }\n    current = $(this).next().addClass('current');\n\
    \  })\n});\n```\n\n通过给 body 添加类 `js` 并并切换 `current`，这种做法的妙之处在于句柄可以被设计师复用：\n\n\
    ```css\n<style type=\"text/css\" media=\"screen\">\n.section {\n  border:1px solid\
    \ #999;\n  background:#ccc;\n}\n.js .section {\n  display:none;\n}\n.js .current\
    \ {\n  display:block;\n  border:1px solid #999;\n  background:#ffc;\n}\n</style>\n\
    ```\n\n# 罪状 #4：依赖 JavaScript\n\n关于当今时代是否需要考虑非 JavaScript 环境有相当多的讨论，但事实是：`JavaScript`\
    \ 可以被关闭，而且任何 `JavaScript` 都可能破坏页面。考虑到可能与你的代码同时运行的那些杂乱代码以及移动连接的不稳定性，我个人想要构建一种东西：运行正常的代码。\n\
    \n所以，确保你的产品最基本的用法不依赖 `JavaScript` 不仅仅是锦上添花，如果你希望人们真正使用它，这是必不可少的。\n\n大量使用 `JavaScript`\
    \ 完全没有问题。相反，如果做得正确，它会让 Web 变得更加流畅并为我们节省大量时间。但你永远不要承诺无法实现的功能。如果你依赖 `JavaScript`，这正是你所做的。我已经在\
    \ Smashing Magazine 上详细介绍了糟糕 `JavaScript` 的影响，如 [AJAX](http://www.smashingmagazine.com/2010/02/some-things-you-should-know-about-ajax/)、JavaScript\
    \ 测试](https://www.smashingmagazine.com/2010/01/21/find-the-right-javascript-solution-with-a-7-step-test/)\
    \ 以及 [安全](https://www.smashingmagazine.com/2010/01/14/web-security-primer-are-you-part-of-the-problem/)\
    \ 文章，但再次这里你可以采取的一些简单步骤，以确保你不会违背对用户的承诺：\n\n* 产品功能的任何核心部分都不需要 `JavaScript`。表单、链接以及服务器端验证和重定向脚本是你的朋友。\n\
    * 如果某些功能依赖 `JavaScript`，请用 `JavaScript` 构建它们，并使用 `DOM` 或你所选库的相应方法将其添加到文档中。\n*\
    \ 如果你增加了 `JavaScript` 功能，请确保它可以使用键盘和鼠标工作。`click` 和 `submit` 处理程序是稳固的，而 `key` 和\
    \ `mouse` 事件则不稳定，且在移动设备上无法工作。\n\n"
- fmt: '

    •By writing clever back-end code that recognizes when data is required by JavaScript
    rather than building APIs that render HTML, you avoid having to do double-maintenance,
    which is an argument that many of the “Everyone enables JavaScript” zealots bring
    up a lot. For proof of this, check out the [presentation on building Web applications
    using YQL and YUI](http://www.yuiblog.com/blog/2010/02/11/video-heilmann-yql/)
    that I gave a few weeks ago (video in English and German).


    ## When JavaScript Dependence Is Okay (to a Degree)


    A lot of misunderstanding about JavaScript dependence stems from people making
    blanket statements based on the environments they work in.


    If you are a Google engineer working on `Gmail`, you would be hard pressed to
    think of why you would even bother working without JavaScript. The same goes for
    widget developers who work on `OpenSocial` widgets, mobile applications, Apple
    widgets and Adobe Air. In other words, if your environment already depends on
    JavaScript, then by all means don’t bother with a fall-back.


    But do not take these closed environments and edge-case applications as the standard
    by which we should be measuring JavaScript. JavaScript’s greatest power and greatest
    problem is its versatility. Saying that all websites can stand JavaScript because
    `Gmail` needs it is like saying that all cars should have a start button because
    they work great in Hybrids, or that hybrid cars should have massive tanks and
    cow catchers because they work great on Hummers. The technical feature set of
    a product depends on its implementation and target market. Different applications
    have different base functionality that needs to be satisfied in order to reach
    the largest audience and not block people out.


    ## Consider the Use Cases and Maintenance


    One fascinating aspect of JavaScript-dependent code is that, in many cases, people
    have simply not considered all the use cases ([here’s a great example](http://icant.co.uk/articles/sins/sins_jsform.html)).
    Take the following HTML:


    ```html

    <form action="#" id="f">

    <div>

    <label for="search">Search</label>

    <input type="text" value="kittens" id="search">

    <input type="submit" id="s" value="go">

    </div>

    </form>

    <div id="results"></div>

    ```


    Without JavaScript, this does nothing whatsoever. There is no sensible `action`
    attribute, and the text field has no `name` attribute. So, even when you send
    the form off, the server won’t get the information that the user has entered.


    Using `jQuery` and a `JSON` data source such as [YQL](http://developer.yahoo.com/yql),
    you can do a pure JavaScript search with this:


    ```javascript

    $(''#s'').click(function(event){

    event.preventDefault();

    $(''<ul/>'').appendTo(''#results'');

    var url =

    $.getJSON(''[http://query.yahooapis.com/v1/public/yql?''+

    ''q=select%20abstract%2Cclickurl%2Cdispurl%2Ctitle%20''+

    ''from%20search.web%20where%20query%3D%22''+

    $(''#search'').val() + ''%22&format=json&''+

    ''callback=?'',

    function(data){

    $.each(data.query.results.result,

    function(i,item){

    $(''<li><h3><a href="''+item.clickurl+''">''+

    item.title+'' (''+item.dispurl+'')</a></h3><p>''+

    (item.abstract || '''') +''</p></li>'').

    appendTo("#results ul");

    });

    });

    });

    ```


    This works… unless of course you are like me and prefer to send forms by hitting
    “Enter” rather than clicking the “Submit” button. Unless I tab through the whole
    form and focus on the “Submit” button, I get nothing.


    So, that’s the first thing to fix. If you create forms, never use a click handler
    on the button. Instead, use the `submit` event of the form. This catches both
    the clicking “Submit” and hitting “Enter” cases. With one change, you now support
    all of the keyboard users out there, and the whole change is contained in the
    first line:


    ```javascript

    $(''#f'').submit(function(event){

    event.preventDefault();

    $(''<ul/>'').appendTo(''#results'');

    var url =

    $.getJSON(''[http://query.yahooapis.com/v1/public/yql?''+

    ''q=select%20abstract%2Cclickurl%2Cdispurl%2Ctitle%20''+

    ''from%20search.web%20where%20query%3D%22''+

    $(''#search'').val() + ''%22&format=json&''+

    ''callback=?'',

    function(data){

    $.each(data.query.results.result,

    function(i,item){

    $(''<li><h3><a href="''+item.clickurl+''">''+

    item.title+'' (''+item.dispurl+'')</a></h3><p>''+

    (item.abstract || '''') +''</p></li>'').

    appendTo("#results ul");

    });

    });

    });

    ```


    We’ve now covered the first case. But without JavaScript, the form still doesn’t
    do anything. And another problem brings us to the next sin of writing JavaScript.


    ### Sin #5: Making Maintenance Unnecessarily Hard


    One thing that keeps great code off the Web is that our work environment, deadlines
    and hiring practices condition developers to build code for quick release, without
    considering how difficult maintaining that code will be later on. I once called
    [JavaScript the village bicycle of Web design](http://developer.yahoo.net/blogs/theater/archives/2008/10/fronteers_2008_christian_heilmann_on_maintain_1.html)
    ([slides here](http://www.slideshare.net/cheilmann/fronteers-maintainability-presentation)):
    anyone can go for a ride. Because the code is available in the open, future maintainers
    will be able to mess around with it and extend it any way they like.


    The sad thing is that the harder your code is to maintain, the more errors will
    be added to it, leading it to look more like alphabet soup than organized script.


    Take the above example. Those of you who haven’t worked with [YQL](http://developer.yahoo.com/yql)
    and `JSON-P` for cross-domain AJAX undoubtedly had a “What?” moment looking at
    the code. Furthermore, keeping a lot of `HTML` in `JavaScript` easy to follow
    is hard, and guess what is the first thing to change when a new design for the
    page comes along? Exactly: the `HTML` and `CSS`. So, to make it easier to maintain,
    I would shift all of the work to the back end, keeping the `HTML` in the same
    document:


    ```php

    <?php

    if(isset($_GET[''search''])){


    $search = filter_input(INPUT_GET, ''search'', FILTER_SANITIZE_ENED);


    $data = getdata($search);


    if($data->query->results){


    $out = ''<ul>'';


    foreach($data->query->result as $r){


    $out .= "<li>


    <h3><a href=\"{$r->clickurl}\">{$r->title}


    <span>({$r->dispurl})</span>


    </a></h3>


    <p>{$r->abstract}</p>


    </li>";


    }


    $out .= ''</ul>'';


    } else {


    $out = ''<h3>Error: could not find any results</h3>'';


    }


    if($_SERVER[''HTTP_REQUESTED_WITH'']!=''''){


    echo $out;


    die();

    }


    ?>


    <!DOCTYPE PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html41/strict.dtd">

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Ajax Search with PHP</title>

    <link rel="stylesheet" href="styles.css" type="text/css">

    </head>

    <body>

    <form action="independent.php" id="f">

    <div>

    <label for="search">Search</label>

    <input type="text" value="kittens" name="search" id="search">

    <input type="submit" id="s" value="Go">

    </div>

    </form>

    <div id="results"><?php if($out!=''''){echo $out;}?></div>

    <script src="jquery.js"></script>

    <script src="ajaxform.js"></script>

    </body>

    </html>

    ```


    ```php

    <?php


    function getdata($search){


    $url = ''http://query.yahooapis.com/v1/public/yql?''.

    ''q=select%20abstract%2Cclickurl%2Cdispurl%2Ctitle%20''.

    ''from%20search.web%20where%20query%3D%22''.$search.''%22''.

    ''&format=json'';


    $ch = curl_init();


    curl_setopt($ch, CURLOPT_URL, $url);


