    \n# JavaScript 动画数学初探\n\nChristian Heilmann\n\n在学校里，我讨厌数学。它是一件可怕、枯燥且无味的东西，充满了陈旧的书籍和非常理论化的问题。更糟糕，许多任务是重复性的，每次迭代中只有简单的逻辑变化（手动除法数字、微分等）。这正是在我们发明计算机的原因。可以说，我的很多数学作业实际上是由我那可靠的\
    \ Commodore 64 和几行 Basic 代码完成的，我只是在之后复制结果即可。\n\n这些工具以及我上过的几次几何课给了我时间和灵感，让数学对我来说变得有趣。我这样做首先是在\
    \ Demo、片头动画以及其它看似无意义的东西中创建遵循数学规则的视觉效果。\n\n在我们所做的视觉内容中有很多数学，即使我们没有意识到。如果你想让某个东西看起来自然并移动得自然，你需要在其中加入一些物理和舍入。自然界并不是按照直角或线性加速度运行的。这就是为什么电影里的僵尸如此可怕。[之前在这里结合\
    \ CSS 动画讨论过](http://coding.smashingmagazine.com/2011/09/14/the-guide-to-css-animation-principles-and-examples/)，但今天让我们深入一点，看看平滑效果背后的简单数学。\n\
    \n### 从 0 到 1 且不无聊\n\n如果你刚刚开始编程，被要求从 0 到 1 且中间几个步骤，你可能会选择一个 `for` 循环：\n\n```javascript\n\
    for ( i = 0; i <= 1; i += 0.1 ) {\n  x = i;\n  y = i;\n}\n```\n\n这会在图上产生一条 45\
    \ 度的线。自然界中没有任何东西以这种精度运动：\n\n![forloop.png](img/forloop.png)\n\n让这种运动稍微自然一点的一种简单方法是将该值乘以自身：\n\
    \n```javascript\nfor ( i = 0; i <= 1; i += 0.1 ) {\n  x = i;\n  y = i * i;\n}\n\
    ```\n\n这意味着 0.1 是 0.01，0.2 是 0.04，0.3 是 0.09，0.4 是 0.16，0.5 是 0.25，依此类推。结果是一条开始平坦并在末尾变得越来越陡峭的曲线：\n\
    \n![multiply.png](img/multiply.png)\n\n你可以通过继续相乘或使用“幂”函数 `Math.pow()` 来让这种效果更加明显：\n\
    \n"
- fmt: "\n```javascript\nfor ( i = 0; i <= 1; i += 0.1 ) {\nx = i;\ny = Math.pow(\
