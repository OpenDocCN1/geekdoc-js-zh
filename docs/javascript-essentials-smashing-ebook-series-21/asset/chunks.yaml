  trans: "\n\n呼。正如你可能察觉到的，这是一个广泛的话题，我建议你对此进行更多阅读——数据类型转换（data coercion），这虽然不是 JavaScript\
    \ 特有的概念，但在 JavaScript 中非常突出。\n\n我曾在[这里讨论过真值（truthy）、假值（falsy）以及数据类型转换的概念](http://www.mitya.co.uk/blog/2011/Apr/Twisted-logic-understanding-truthy-and-falsy-174)。如果你真的想深入了解\
    \ JavaScript 被要求比较两个值时内部发生了什么，请查看 [ECMA-262 文档规范的第 11.9.3 节](http://www.mozilla.org/js/language/E262-3.pdf)。\n\
    \n## 正则表达式\n\n### 4. replace() 可以接受回调函数\n\n这是 JavaScript 最不不为人知的秘密之一，并在 v1.3 版本中引入。`replace()`\
    \ 的大多数用法如下所示：\n\n```\nalert('10 13 21 48 52'.replace(/\\d+/g, '*')); // 将所有数字替换为\
    \ *\n```\n\n这是一种简单的替换：一个字符串，一个星号。但如果我们想对替换的发生方式和时进行更多控制呢？如果我们只想替换小于 30 的数字呢？这仅靠正则表达式是无法实现的（毕竟它们本质上是关于字符串的，而不是数学的）。我们需要跳转到回调函数来评估每个匹配项。\n\
    \n```\nalert('10 13 21 48 52'.replace(/\\d+/g, function(match) {\n  return parseInt(match)\
    \ < 30 ? '*' : match;\n}));\n```\n\n对于每一个匹配的项，JavaScript 都会调用我们的函数，并将 `match`\
    \ 传递给 `match` 参数。然后，我们返回星号（如果匹配的数字小于 30）或 `match` 本身（即不发生任何替换）。\n\n### 5. 正则表达式：不仅仅是匹配和替换\n\
    \n许多中间 JavaScript 开发者仅依靠正则表达式的匹配和替换就能工作。但 JavaScript 定义的方法比这两种多得多。\n\n特别值得关注的是\
    \ `test()`，它的用法与 `match` 类似，但它不返回匹配项：它只是确认模式是否匹配。从这个意义上说，它的计算开销更小。\n\n```\nalert(/\\\
    w{3,}/.test('Hello')); //  'true'\n```\n\n上面的代码寻找三个或更多字母数字字符的模式，因为字符串 `Hello`\
    \ 满足该要求，所以我们得到了 true。我们没有得到实际的匹配，只有结果。\n\n同样值得注意的是 `RegExp` 对象，通过它你可以创建动态正则表达式，而不是静态的。大多数正则表达式是使用短格式声明的（即包含在正斜线之间，如我们上面做的那样）。尽管如此，但你无法引用变量，因此创建动态模式是不可能的。但是使用\
    \ `RegExp()`，你可以做到。\n\n```javascript\nfunction findWord(word, string) {\n  var\
    \ instancesOfWord = string.match(new RegExp('\\b'+word+'\\b', 'ig'));\n  alert(instancesOfWord);\n\
    }\n\nfindWord('car', 'Carl went to buy a car but had forgotten his credit card.');\n\
    ```\n\n在这里，我们根据参数 `word` 的值创建一个动态模式。该函数返回该单词在 `string` 中作为独立单词出现的次数（即：不是作为其他单词的一部分）。因此，我们的示例返回了一次\
    \ `car`，忽略了单词 `Carl` 和 `card` 中的 `car` 标记。它通过检查我们要查找的单词两边的单词边界（`\\b`）来强制执行这一点。\n\
    \n由于 `RegExp` 是作为字符串指定的，而不是通过正斜线语法，因此可以在构建模式时使用变量。然而这意味着我们必须对任何特殊字符进行双重转义，正如我们处理单词边界字符时那样。\n\
    \n## 函数与作用域\n\n### 6. 你可以伪造作用域\n\n执行内容的作用域定义了哪些变量是可以访问的。独立的 JavaScript（即不在函数内部运行的\
    \ JavaScript）在 `window` 对象的全局作用域内运行，所有内容都可以访问；而在函数内部声明的局部变量仅在该函数内部可见，外部不可。\n\n\
    ```javascript\nvar animal = 'dog';\n\nfunction getAnimal(adjective) { alert(adjective+'\
    \ '+this.animal); }\n\ngetAnimal('lovely'); //  'lovely dog';\n```\n\n在这里，我们的变量和函数都声明在全局作用域（即在\
    \ `window` 上）。因为 `this` 始终指向当前作用域，在这个例子中它指向 `window`。因此，函数寻找 `window.animal` 并找到了它。到目前为止都很正常。但我们实际上可以欺骗函数让它认为自己正在另一个作用域中运行，无论它自然的作用域如何。我们通过调用内置的\
    \ `call()` 方法而不是直接调用函数来实现这一点：\n\n```javascript\nvar animal = 'dog';\n\nfunction\
    \ getAnimal(adjective) { alert(adjective+' '+this.animal); };\n\nvar myObj = {animal:\
    \ 'camel'};\n\ngetAnimal.call(myObj, 'lovely'); // 'lovely camel'\n```\n\n在这里，我们的函数不是运行在\
    \ `window` 上，而是运行在 `myObj` 上——这是作为 `call` 方法的第一个参数指定的。本质上，`call()` 假装我们的函数是 `myObj`\
    \ 的方法（如果这听起来不明，你可能想了解一下 JavaScript 的原型继承系统）。还要注意，传递给 `call()` 的第一个参数之后的任何参数都会传递给我们的函数——因此我们将\
    \ `lovely` 作为 `adjective` 参数传递进去。\n\n我听过 JavaScript 开发者说，他们好几年都不需要使用一次这个，这不仅是因为良好的设计确保了你不需要它。\n\
    \n顺便提一下，`apply()` 执行的工作与 `call()` 相同，只是函数的参数是以数组形式指定的。因此，上述使用 `apply()` 的示例看起来会是：\n\
    \n`getAnimal.apply(myObj, ['lovely']);`\n\n### 7. 函数可以自执行\n\n语法非常简单：我们声明一个函数，并像调用其他函数一样立即调用它，使用\
    \ `()` 语法。你可能会奇怪我们为什么要这样做。这看起来像是一个自矛盾：函数通常包含我们想以后执行的代码，而不是现在，否则我们就不会把代码放在函数里。\n\
    \n自执行函数（SEFs）的一个良好用途是绑定变量的当前值，用于延迟执行的代码，例如回调、超时和间隔。这里有一个问题：\n\n```javascript\n\
    var someVar = 'hello';\n\nsetTimeout(function() { alert(someVar); }, 1000);\n\n\
    var someVar = 'goodbye';\n```\n\n论坛里的新手总是问为什么超时里的 alert 显示的是 goodbye 而不是 hello。答案是超时回调函数恰恰就是——一个回调——所以它在运行之前不会评估\
    \ `someVar` 的值。等到那时，`someVar` 早已被 `goodbye` 覆盖了。\n\nSEFs 为这个问题提供了解决方案。我们不再像上面那样隐式地指定超时回调，而是从一个\
    \ SEF 中返回它，并在 SEF 中将 `someVar` 的当前值作为参数传递。有效这意味着我们传递并隔离了 `someVar` 的当前值，保护它免受之后实际变量\
    \ `someVar` 发生任何变化的影响。这就像在重新喷漆之前给汽车拍张照片；照片不会随着喷漆后的颜色而更新；它将永远显示拍摄照片时汽车的颜色。\n\n\
    ```javascript\nvar someVar = 'hello';\n\nsetTimeout((function(someVar) {\n  return\
    \ function() { alert(someVar); }\n})(someVar), 1000);\n\nvar someVar = 'goodbye';\n\
    ```\n\n这一次，它显示了 hello，如预期的那样，因为它显示的是隔离版本的 `someVar`（即：函数参数，而不是外部变量）。\n\n"
- fmt: "\nWhile most browsers will alert `ff9900`, Firefox returns `rgb(255, 153,\
    \ 0)`, the RGB equivalent. Plenty of JavaScript functions are out there for converting\
    \ RGB to hex.\n\nNote that when I say computed color, I’m referring to the current\
    \ color, regardless of how it is applied to the element. Compare this to style,\
    \ which reads only style properties that were implicitly set in an element’s style\
    \ attribute. Also, as you’ll have noticed in the example above, `IE` has a different\
    \ method of detecting computed styles from other browsers.\n\nAs an aside, jQuery’s\
    \ `css()` method encompasses this sort of computed detection, and it returns styles\
    \ however they were applied to an element: implicitly or through inheritance or\
    \ whatever. Therefore, you would relatively rarely need the native `getComputedStyle`\
    \ and `currentStyle`.\n\n## Miscellaneous\n\n### 9. 0.1 + 0.2 !== 0.3\n\nThis\
    \ one is an oddity not just in JavaScript; it’s actually a prevailing problem\
    \ in computer science, and it affects many languages. The output of this is `0.3000000000000004`.\n\
    \nThis has to do with an issue called machine precision. When JavaScript tries\
    \ to execute the line above, it converts the values to their binary equivalents.\n\
    \nThis is where the problem starts. `0.1` is not really `0.1` but rather its binary\
    \ equivalent, which is a near-ish (but not identical) value. In essence, as soon\
    \ as you write the values, they are doomed to lose their precision. You might\
    \ have just wanted two simple decimals, but what you get, as Chris Pine [notes](http://dev.opera.com/articles/view/why-i-love-ecmascript-4-real-decimals/),\
    \ is binary floating-point arithmetic. Sort of like wanting your text translated\
    \ into Russian but getting Belorussian. Similar, but not the same.\n\nMore is\
    \ going on here, but it’s beyond the scope of this article (not to mention the\
    \ mathematical capabilities of this author).\n\nWorkarounds for this problem are\
    \ a favorite on computer science and developer forums. Your choice, to a point,\
    \ comes down to the sort of calculations you’re doing. The pros and cons of each\
    \ are beyond the scope of this article, but the common choice is between the following:\n\
    \n1. Converting to integers and calculating on those instead, then converting\
    \ back to decimals afterward;\n2. Tweaking your logic to allow for a range rather\
    \ than a specific result.\n3. So, for example, rather than…\n\n```\nvar num1 =\
    \ 0.1, num2 = 0.2, shouldEqual = 0.3;\nalert(num1 + num2 == shouldEqual); //false\n\
    ```\n\n… we would do this:\n\n```javascript\nalert(num1 + num2 > shouldEqual -\
    \ 0.001 && num1 + num2 < shouldEqual + 0.001); //true\n```\n\nTranslated, this\
    \ says that because `0.1 + 0.2` is apparently not `0.3`, check instead that it’s\
    \ more or less `0.3` — specifically, within a range of `0.001` on either side\
    \ of it. The obvious drawback is that, for very precise calculations, this will\
    \ return inaccurate results.\n\n### 10. Undefined Can Be Defined\n\nOK, let’s\
    \ end with a silly, rather inconsequential one. Strange as it might sound, `undefined`\
    \ is not actually a reserved word in JavaScript, even though it has a special\
    \ meaning and is the only way to determine whether a variable is undefined. So:\n\
    \n```javascript\nvar someVar;\nalert(someVar == undefined); //evaluates true\n\
    ```\n\nSo far, so normal. But:\n\n```javascript\nundefined = \"I'm not undefined!\"\
    ;\nvar someVar;\nalert(someVar == undefined); //evaluates false!\n```\n\nYou can\
    \ also check [Mozilla’s list of all reserved words in JavaScript](https://developer.mozilla.org/en/JavaScript/Reference/Reserved_Words)\
    \ for future reference.\n\n# The Seven Deadly Sins Of JavaScript Implementation\n\
    \nChristian Heilmann![lg.php.gif](Images/lg.php.gif)\n\nUsing JavaScript has become\
    \ increasingly easy over the last few years. Whereas back in the day we needed\
    \ to know the quirks of every browser, now many libraries such as `jQuery`, `YUI`,\
    \ `Dojo` and `MooTools` allow someone who doesn’t even know JavaScript to spruce\
    \ up boring HTML documents with impressive and shiny effects. By piggy-backing\
    \ on the CSS selector engine, we have moved away from the complexity and inconsistencies\
    \ of the `DOM` and made things much easier.\n\nIf you look at some of the code\
    \ that has been released, though, we do seem to have taken a step backwards. In\
    \ gaining easier access, we also became a bit sloppy with our code. Finding clearly\
    \ structured, easy-to-maintain `jQuery` code is quite tough, which is why many\
    \ plug-ins do the same thing. Writing one yourself is faster than trying to fathom\
    \ what other developers have done.\n\nThe rules for solid, maintainable and secure\
    \ JavaScript haven’t changed, though. So, let’s run through the seven sins of\
    \ JavaScript development that will bite you in the backside when you have to maintain\
    \ the code later on or hand it over to another party.\n\nWe’ve all had to work\
    \ with code written by other people. We have despaired over the lack of maintainability\
    \ and documentation as well as weird logic. Funny enough, as developers, we started\
    \ to see this as normal and got used to ignoring other people’s work and instead\
    \ writing new code for the same problems over and over, as if we were subconsciously\
    \ trying to secure our jobs by leaving behind unmaintainable code—code that only\
    \ we understood, while complaining that no good solutions were out there.\n\n\
    ### Sins Of Our Fathers: Browser-Specific Code\n\nOne of the main obstacles that\
    \ kept us from evolving as developers was that JavaScript was largely browser-specific.\n\
    \nThis was mainly because browsers did not support the standards (or were shipped\
    \ before the governing bodies agreed on standards at all), and because we had\
    \ to deliver our work before the competition and without extending the overly\
    \ optimistic deadline set by our project managers.\n\nThis happens to be one reason\
    \ why `Internet Explorer 6` refuses to die. Hundreds of expensive software packages\
    \ that are being used in offices worldwide were built when this browser was state\
    \ of the art. This—and the monoculture that advocated using one software vendor\
    \ for everything from the operating system to documents to spreadsheets to the\
    \ browser—is the reason why companies now can’t simply discontinue support for\
    \ it. It also means that newer versions of `IE` will always have to support the\
    \ rendering mistakes of `IE6` in one way or another. `IE6` is the Frankenstein\
    \ of the Internet, haunting its creators, terribly misunderstood by the townsfolk,\
    \ who would sooner kill it, burn it and dance around it than make any sense of\
    \ it.\n\nThe good news is that you won’t find many scripts these days that begin\
    \ with `if(document.all){}` and continue with `else if(document.layers){}`. If\
    \ you do find one, please send its creator a brief email encouraging them to move\
    \ on or, better yet, to redirect their website to a better script that is actually\
    \ being maintained.\n\n### Libraries to the Rescue\n\nThe job of JavaScript libraries\
    \ such as `jQuery`, `YUI`, `MooTools`, `Dojo` and `Glow` is to make JavaScript\
    \ development predictable and to relieve developers of the living hell that we\
    \ call browser support. In other words, they fix random bugs in browsers and free\
    \ us to adopt standards without worrying that certain browsers won’t recognize\
    \ them.\n\nFor example, the `DOM` method `getElementById(id)` should be straightforward:\
    \ find the element with the ID `id` and return it. But because some versions of\
    \ `IE` and `Opera` also return elements that have the name attribute of id, [jQuery\
    \ solves the problem this way](http://github.com/jquery/jquery/blob/master/src/core.js):\n\
    \n```javascript\nvar elem;\nelem = document.getElementById( match[2] );\nif (\
    \ elem ) {\n    // Handle the case where IE and Opera return items\n    // by\
    \ name instead of ID\n    if ( elem.id !== match[2] ) {\n        return rootjQuery.find(\
    \ selector );\n    }\n    // Otherwise, we inject the element directly into the\
    \ jQuery object\n    this.length = 1;\n    this[0] = elem;\n}\n```\n\nThis is\
    \ where libraries are awfully useful and is why JavaScript libraries are here\
    \ to stay. Browsers will always do things wrong, and old browsers will not be\
