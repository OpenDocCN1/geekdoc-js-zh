  trans: "\n\n你可以看到我们的 [SiteMapServlet.java](http://spiffyui.googlecode.com/svn/trunk/spiffyui-app/src/main/java/org/spiffyui/spsample/server/SiteMapServlet.java)\
    \ servlet 的所有源代码。这个 servlet 大多只是查找表，接收一个 ID 并从我们服务器上的某处提供关联内容。它被称为 `SiteMapServlet.java`\
    \ 是因为该类还处理我们站点地图的生成。\n\n## 使用站点地图整合一切\n\n[我们的站点地图](http://www.spiffyui.org/sitemap.xml)\
    \ 告诉爬虫我们的应用程序中有哪些内容。每个网站都应该有一个站点地图；没有站点地图，AJAX 爬取无法工作。\n\n站点地图是简单的 XML 文档，列出了应用程序中的\
    \ URL。它们还可以包含关于页面优先级和更新频率的数据。站点地图的普通条目看起来如下：\n\n```xml\n<url>\n<loc>[`www.spiffyui.org`](http://www.spiffyui.org)/</loc>\n\
    <lastmod>2011-07-26</lastmod>\n<changefreq>daily</changefreq>\n<priority>1.0</priority>\n\
    </url>\n```\n\n我们的 AJAX 可爬取条目看起来像这样：\n\n```xml\n<url>\n<loc>[`www.spiffyui.org/#!css`](http://www.spiffyui.org/#!css)</loc>\n\
    <lastmod>2011-07-26</lastmod>\n<changefreq>daily</changefreq>\n<priority>0.8</priority>\n\
    </url>\n```\n\nhash bang（井号）告诉 Google 这是一个转义片段，其余部分的工作方式与任何其他页面一样。你可以混合使用 AJAX\
    \ URL 和普通 URL，并且可以使用一个站点地图处理所有内容。\n\n你可以手动编写站点地图，但有很多工具可以为你节省大量时间。关键是良好地格式化站点地图并将其提交到\
    \ Google Search Console 中。\n\n## Google Webmaster Tools\n\n[Google Web 站管理员工具](https://www.google.com/webmasters/tools)\
    \ 让你有机会向 Google 介绍你的网站。使用你的 Google ID 登录或创建一个新账户，然后验证你的网站。\n\n![google.wemaster-central.jpg](img/google.wemaster-central.jpg)\n\
    \n一旦验证通过，你就可以提交站点地图，然后 Google 将开始索引你的 URL。\n\n然后你就等待。这部分让人抓狂。SpiffyUI.org 花了大约两周才在\
    \ Google 搜索中正常显示。我在帮助论坛上发了六次帖子，当时以为它坏了。\n\n目前没有简单的方法来确保一切运行正常，但有一些工具可以帮助你查看发生了什么。最好的工具是[以\
    \ Googlebot 抓取](http://www.google.com/support/webmasters/bin/answer.py?hl=en&answer=158587)，它向你准确展示\
    \ Google 在爬取你的网站时看到的的内容。你可以在 Google Webmaster Tools 仪表板中的“诊断”下访问它。\n\n![webmastertools-2.jpg](img/webmastertools-2.jpg)\n\
    \n输入一个来自你网站的 hash bang URL，并点击“抓取”。Google 会告诉你抓取是否成功，如果成功，它将向你展示它看到的内容。\n\n![webastertools-3.jpg](img/webastertools-3.jpg)\n\
    \n如果“以 Googlebot 抓取”按预期工作，那么你正确地返回了转义 URL。但你应该检查其他几点：\n\n- [验证你的站点地图](http://www.validome.org/google/validate)。\n\
    - 手动尝试站点地图中的 URL。确保尝试了 hash-bang 和转义版本。\n- 通过搜索 `site:[www.yoursite.com](http://www.yoursite.com)`\
    \ 来检查你网站的 Google 搜索结果。\n\n## 使用 HTML5 创建美化 URL\n\nTwitter 在其 URL 中保留了 hash bang，如下：\n\
    \nhttp://twitter.com/#!/ZackGrossbart\n\n这对于 AJAX 爬取效果良好，但同样，它看起来有点丑。你可以通过集成 [HTML5\
    \ history](http://www.w3.org/TR/html5/history.html) 让你的 URL 更美观。\n\nSpiffy UI\
    \ 使用 HTML5 history 集成将像这样的 hash-bang URL 转换……\n\nhttp://www.spiffyui.org#!css\n\
    \n……转换为像这样的美观 URL：\n\nhttp://www.spiffyui.org?css\n\nHTML5 history 让更改此 URL 参数成为可能，因为井号是\
    \ HTML4 中你可以更改的唯一 URL 部分。如果你更改其他任何内容，整个页面都会重新加载。HTML5 history 在不刷新页面的情况下更改整个 URL，我们可以让\
    \ URL 呈现任何我们想要的样式。\n\n这个更优的 URL 在我们的应用程序中有效，但我们仍在站点地图上列出 hash-bang 版本。当浏览器访问 hash-bang\
    \ URL 时，我们用少量 JavaScript 将其更改为更优的版本。\n\n## 欺骗 (Cloaking)\n\n早我我提到欺骗。这是一种通过向 Google\
    \ 显示一组页面而向普通浏览器显示另一组页面来提高网站在搜索结果中排名的做法。Google 不喜欢欺骗，可能会[从其搜索索引中移除违网站](http://www.google.com/support/webmasters/bin/answer.py?answer=66355)。\n\
    \nAJAX 可爬取应用程序向 Google 显示的结果始终与普通浏览器不同，但如果 HTML 包含用户会看到的相同内容，那么它就不属于欺骗。搜索引擎需要从本质上不可信的来源（我们）那里获取有用信息。\n\
    \n## Hash Bang 有点丑，但有效\n\nHash bangs 不应该取代 Web 上的每一个 URL。简单页面不需要 hash bangs，但\
    \ AJAX 页面需要。URL 看起来确实有点丑，但你可以用 HTML5 修复。\n\n### 延伸阅读\n\n等等，支持 AJAX 爬取意味着你需要更改客户端代码和服务器代码。这里有一些链接可以了解更多：\n\
    \n- “[让 AJAX 应用可爬取](http://code.google.com/web/ajaxcrawling),”Google Code\n- “[会话历史与导航](http://www.w3.org/TR/html5/history.html),”HTML5\
    \ 规范，章节 5.4 \n- [sitemaps.org](http://www.sitemaps.org/)\n- [Google Webmaster\
    \ Tools](https://www.google.com/webmasters/tools)\n- [Spiffy UI 源代码](https://code.google.com/p/spiffyui/source/checkout)，包含完整的\
    \ AJAX 爬取示例。\n- 感谢 Kristen Riley 为本文中的图片提供的帮助。\n\n# 作者\n\n### Addy Osmani\n\n\
    Addy Osmani 是一位住在英国伦敦的 JavaScript 博客作者兼 AOL 的 UI 开发者。他还是 jQuery [Bug Triage/Docs/Front-end]\
    \ 团队的成员，负责处理错误、文档编写和社区更新。最近，他被提名了 [.net “杰出新秀”奖](http://www.thenetawards.com/#num12)。\n\
    \n### Andy Croxall\n\nAndy Croxall 是一位来自英国伦敦 Wandsworth 的 Web 开发者。他是一位 JavaScript\
    \ 专家，jQuery 社区的活跃成员，发布插件和扩展。他服务的客户从伦敦证券交易所到杜乐士（Durex）应有尽。你可以在这里关注他和他的项目和创作\n\n\
    ### Christian Heilmann\n\n一位在英国美丽的伦敦镇为 Mozilla 工作的国际开发者布道师（Developer Evangelist）。\n\
    \n### Zack Grossbart\n\n"
