  raw: 'While most browsers will alert ff9900, Firefox returns rgb(255, 153, 0), the
    RGB equivalent. Plenty of JavaScript functions are out there for converting RGB
    to hex.


    Note that when I say computed color, I’m referring to the current color, regardless
    of how it is applied to the element. Compare this to style, which reads only style
    properties that were implicitly set in an element’s style attribute. Also, as
    you’ll have noticed in the example above, IE has a different method of detecting
    computed styles from other browsers.


    As an aside, jQuery’s css() method encompasses this sort of computed detection,
    and it returns styles however they were applied to an element: implicitly or through
    inheritance or whatever. Therefore, you would relatively rarely need the native
    getComputedStyle and currentStyle.


    ### Miscellaneous


    #### 9\. 0.1 + 0.2 !== 0.3


    This one is an oddity not just in JavaScript; it’s actually a prevailing problem
    in computer science, and it affects many languages. The output of this is 0.30000000000000004.


    This has to do with an issue called machine precision. When JavaScript tries to
    execute the line above, it converts the values to their binary equivalents.


    This is where the problem starts. 0.1 is not really 0.1 but rather its binary
    equivalent, which is a near-ish (but not identical) value. In essence, as soon
    as you write the values, they are doomed to lose their precision. You might have
    just wanted two simple decimals, but what you get, as Chris Pine [notes](http://dev.opera.com/articles/view/why-i-love-ecmascript-4-real-decimals/),
    is binary floating-point arithmetic. Sort of like wanting your text translated
    into Russian but getting Belorussian. Similar, but not the same.


    More is going on here, but it’s beyond the scope of this article (not to mention
    the mathematical capabilities of this author).


    Workarounds for this problem are a favorite on computer science and developer
    forums. Your choice, to a point, comes down to the sort of calculations you’re
    doing. The pros and cons of each are beyond the scope of this article, but the
    common choice is between the following:


    1.Converting to integers and calculating on those instead, then converting back
    to decimals afterward; or


    2.Tweaking your logic to allow for a range rather than a specific result.


    3.So, for example, rather than…


    var num1 = 0.1, num2 = 0.2, shouldEqual = 0.3;


    alert(num1 + num2 == shouldEqual); //false


    … we would do this:


    alert(num1 + num2 > shouldEqual - 0.001 && num1 + num2 < shouldEqual + 0.001);
    //true


    Translated, this says that because 0.1 + 0.2 is apparently not 0.3, check instead
    that it’s more or less 0.3 — specifically, within a range of 0.001 on either side
    of it. The obvious drawback is that, for very precise calculations, this will
    return inaccurate results.


    #### 10\. Undefined Can Be Defined


    OK, let’s end with a silly, rather inconsequential one. Strange as it might sound,
    undefined is not actually a reserved word in JavaScript, even though it has a
    special meaning and is the only way to determine whether a variable is undefined.
    So:


    var someVar;


    alert(someVar == undefined); //evaluates true


    So far, so normal. But:


    undefined = "I''m not undefined!";


    var someVar;


    alert(someVar == undefined); //evaluates false!


    You can also check [Mozilla’s list of all reserved words in JavaScript](https://developer.mozilla.org/en/JavaScript/Reference/Reserved_Words)
    for future reference.


    # The Seven Deadly Sins Of JavaScript Implementation


    Christian Heilmann![lg.php.gif](Images/lg.php.gif)


    Using JavaScript has become increasingly easy over the last few years. Whereas
    back in the day we needed to know the quirks of every browser, now many libraries
    such as jQuery, YUI, Dojo and MooTools allow someone who doesn’t even know JavaScript
    to spruce up boring HTML documents with impressive and shiny effects. By piggy-backing
    on the CSS selector engine, we have moved away from the complexity and inconsistencies
    of the DOM and made things much easier.


    If you look at some of the code that has been released, though, we do seem to
    have taken a step backwards. In gaining easier access, we also became a bit sloppy
    with our code. Finding clearly structured, easy-to-maintain jQuery code is quite
    tough, which is why many plug-ins do the same thing. Writing one yourself is faster
    than trying to fathom what other developers have done.


    The rules for solid, maintainable and secure JavaScript haven’t changed, though.
    So, let’s run through the seven sins of JavaScript development that will bite
    you in the backside when you have to maintain the code later on or hand it over
    to another party.


    We’ve all had to work with code written by other people. We have despaired over
    the lack of maintainability and documentation as well as weird logic. Funny enough,
    as developers, we started to see this as normal and got used to ignoring other
    people’s work and instead writing new code for the same problems over and over,
    as if we were subconsciously trying to secure our jobs by leaving behind unmaintainable
    code—code that only we understood, while complaining that no good solutions were
    out there.


    ### Sins Of Our Fathers: Browser-Specific Code


    One of the main obstacles that kept us from evolving as developers was that JavaScript
    was largely browser-specific.


    This was mainly because browsers did not support the standards (or were shipped
    before the governing bodies agreed on standards at all), and because we had to
    deliver our work before the competition and without extending the overly optimistic
    deadline set by our project managers.


    This happens to be one reason why Internet Explorer 6 refuses to die. Hundreds
    of expensive software packages that are being used in offices worldwide were built
    when this browser was state of the art. This—and the monoculture that advocated
    using one software vendor for everything from the operating system to documents
    to spreadsheets to the browser—is the reason why companies now can’t simply discontinue
    support for it. It also means that newer versions of IE will always have to support
    the rendering mistakes of IE6 in one way or another. IE6 is the Frankenstein of
    the Internet, haunting its creators, terribly misunderstood by the townsfolk,
    who would sooner kill it, burn it and dance around it than make any sense of it.


    The good news is that you won’t find many scripts these days that begin with if(document.all){}
    and continue with else if(document.layers){}. If you do find one, please send
    its creator a brief email encouraging them to move on or, better yet, to redirect
    their website to a better script that is actually being maintained.


    #### Libraries to the Rescue


    The job of JavaScript libraries such as jQuery, YUI, MooTools, Dojo and Glow is
    to make JavaScript development predictable and to relieve developers of the living
    hell that we call browser support. In other words, they fix random bugs in browsers
    and free us to adopt standards without worrying that certain browsers won’t recognize
    them.


    For example, the DOM method getElementById(id) should be straightforward: find
    the element with the ID id and return it. But because some versions of IE and
    Opera also return elements that have the name attribute of id, [jQuery solves
    the problem this way](http://github.com/jquery/jquery/blob/master/src/core.js):


    var elem;


    elem = document.getElementById( match[2] );


    if ( elem ) {


    // Handle the case where IE and Opera return items


    // by name instead of ID


    if ( elem.id !== match[2] ) {


    return rootjQuery.find( selector );


    }


    // Otherwise, we inject the element directly into the jQuery object


    this.length = 1;


    this[0] = elem;


    }


    This is where libraries are awfully useful and is why JavaScript libraries are
    here to stay. Browsers will always do things wrong, and old browsers will not
    be upgraded by end users, either because of the aforementioned company regulations
    or because people simply don’t care to keep up with the times.'
