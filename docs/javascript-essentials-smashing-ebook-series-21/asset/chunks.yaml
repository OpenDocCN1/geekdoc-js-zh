    Web 应用运行起来的 JS 事件、匿名函数的实现、模块模式、配置与后端的交互以及使用库来指定代码。对于那些对 AJAX 感兴趣的读者，如果你想让内容变得动态化且可搜索，你将获得所需的信息。


