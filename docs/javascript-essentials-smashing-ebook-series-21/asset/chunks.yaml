    You can see all of the source code for our [SiteMapServlet.java](http://spiffyui.googlecode.com/svn/trunk/spiffyui-app/src/main/java/org/spiffyui/spsample/server/SiteMapServlet.java)
    servlet. This servlet is mostly just a look-up table that takes an ID and serves
    the associated content from somewhere on our server. It’s called `SiteMapServlet.java`
    because this class also handles the generation of our site map.


    ## Tying It All Together With A Site Map


    [Our site map](http://www.spiffyui.org/sitemap.xml) tells the crawler what’s available
    in our application. Every website should have a site map; AJAX crawling doesn’t
    work without one.


    Site maps are simple XML documents that list the URLs in an application. They
    can also include data about the priority and update frequency of the app’s pages.
    Normal entries for site maps look like this:


    ```xml

    <url>

    <loc>[http://www.spiffyui.org](http://www.spiffyui.org)/</loc>

    <lastmod>2011-07-26</lastmod>

    <changefreq>daily</changefreq>

    <priority>1.0</priority>

    </url>

    ```


    Our AJAX-crawlable entries look like this:


    ```xml

    <url>

    <loc>[http://www.spiffyui.org/#!css](http://www.spiffyui.org/#!css)</loc>

    <lastmod>2011-07-26</lastmod>

    <changefreq>daily</changefreq>

    <priority>0.8</priority>

    </url>

    ```


    The hash bang tells Google that this is an escaped fragment, and the rest works
    like any other page. You can mix and match AJAX URLs and regular URLs, and you
    can use only one site map for everything.


    You could write your site map by hand, but there are tools that will save you
    a lot of time. The key is to format the site map well and submit it to Google
    Webmaster Tools.


    ## Google Webmaster Tools


    [Google Webmaster Tools](https://www.google.com/webmasters/tools) gives you the
    chance to tell Google about your website. Log in with your Google ID, or create
    a new account, and then verify your website.


    ![google.wemaster-central.jpg](Images/google.wemaster-central.jpg)


    Once you’ve verified, you can submit your site map and then Google will start
    indexing your URLs.


    And then you wait. This part is maddening. It took about two weeks for SpiffyUI.org
    to show up properly in Google Search. I posted to the help forums half a dozen
    times, thinking it was broken.


    There’s no easy way to make sure everything is working, but there are a few tools
    to help you see what’s going on. The best one is [Fetch as Googlebot](http://www.google.com/support/webmasters/bin/answer.py?hl=en&answer=158587),
    which shows you exactly what Google sees when it crawls your website. You can
    access it in your dashboard in Google Webmaster Tools under “Diagnostics.”


    ![webmastertools-2.jpg](Images/webmastertools-2.jpg)


    Enter a hash bang URL from your website, and click “Fetch.” Google will tell you
    whether the fetch has succeeded and, if it has, will show you the content it sees.


    ![webastertools-3.jpg](Images/webastertools-3.jpg)


    If Fetch as Googlebot works as expected, then you’re returning the escaped URLs
    correctly. But you should check a few more things:


    - [Validate your site map](http://www.validome.org/google/validate).

    - Manually try the URLs in your site map. Make sure to try the hash-bang and escaped
    versions.

    - Check the Google result for your website by searching for `site:[www.yoursite.com](http://www.yoursite.com).


    ## Making Pretty URLs With HTML5


    Twitter leaves the hash bang visible in its URLs, like this:


    http://twitter.com/#!/ZackGrossbart


    This works well for AJAX crawling, but again, it’s slightly ugly. You can make
    your URLs prettier by integrating [HTML5 history](http://www.w3.org/TR/html5/history.html).


    Spiffy UI uses HTML5 history integration to turn a hash-bang URL like this…


    http://www.spiffyui.org#!css


    … into a pretty URL like this:


    http://www.spiffyui.org?css


    HTML5 history makes it possible to change this URL parameter, because the hash
    tag is the only part of the URL that you can change in HTML4. If you change anything
    else, the entire page reloads. HTML5 history changes the entire URL without refreshing
    the page, and we can make the URL look any way we want.


    This nicer URL works in our application, but we still list the hash-bang version
    on our site map. And when browsers access the hash-bang URL, we change it to the
    nicer one with a little JavaScript.


    ## Cloaking


    Earlier, I mentioned cloaking. It is the practice of trying to boost a website’s
    ranking in search results by showing one set of pages to Google and another to
    regular browsers. Google doesn’t like cloaking and may [remove offending websites
    from its search index](http://www.google.com/support/webmasters/bin/answer.py?answer=66355).


    AJAX-crawling applications always show different results to Google than to regular
    browsers, but it isn’t cloaking if the HTML contain the same content that the
    user would see. Search engines need to get useful information from inherently
    untrustworthy sources: us.


    ## Hash Bang Is A Little Ugly, But It Works


    Hash bangs shouldn’t replace every URL on the Web. Simple pages don’t need hash
    bangs, but AJAX pages do. The URLs do look a bit ugly, but you can fix that with
    HTML5.


    ### Further Reading


    Wait, supporting AJAX crawling means that you need to change your client’s code
    and your server’s code. Here are some links to find out more:


    - “[Making AJAX Applications Crawlable](http://code.google.com/web/ajaxcrawling),”
    Google Code

    - “[Session History and Navigation](http://www.w3.org/TR/html5/history.html),”
    HTML5 specification, section 5.4

    - [sitemaps.org](http://www.sitemaps.org/)

    - [Google Webmaster Tools](https://www.google.com/webmasters/tools)

    - [Spiffy UI source code](https://code.google.com/p/spiffyui/source/checkout),
    with a complete example of AJAX crawling.

    - Thanks to Kristen Riley for help with some of the images in this article.


    # Authors


    ### Addy Osmani


    Addy Osmani is a JavaScript blogger & UI Developer for AOL based in London, England.
    He is also a member of the jQuery [Bug Triage/Docs/Front-end] teams where he assists
    with bugs, documentation and community updates. Most recently he''s been nominated
    for the [.net ''Brilliant Newcomer'' award](http://www.thenetawards.com/#num12).


    ### Andy Croxall


    Andy Croxall is a Web developer from Wandsworth, London, England. He is a Javascript
    specialist and is an active member of the jQuery community, posting plugins and
    extensions. He has worked for clients ranging from the London Stock Exchange to
    Durex. You can keep up with him and his projects and creations on his


    ### Christian Heilmann


    An international Developer Evangelist working for Mozilla in the lovely town of
    London, England.


    ### Zack Grossbart

