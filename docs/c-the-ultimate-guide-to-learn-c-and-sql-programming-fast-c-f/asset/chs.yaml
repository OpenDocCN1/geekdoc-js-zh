  # 引言


  数据库就像一个容器。它是一个存储空间，程序员可以在此以建设性的方式组织数据。请记住，如果你只处理少量数据，则无需创建数据库。例如，处理数百个 Excel 电子表格需要数据库，而五个电子表格即使没有数据库也能处理。换句话说，将一定量的数据组织在数据库中可以让你免于复杂的数据管理。


  ## 深入理解数据库


  将数据全部组织在数据库中，可以让你轻松执行诸如查询数据、更新数据和删除旧数据等任务。最重要的是，数据库可以防止因数据多份拷贝而产生的冲突。


  例如，假设一家公司需要管理其整体财务支出。通常，会有专门的部门来处理此事，而该部门有若干人员。如果这些人各自持有自己的电子表格副本，那么考虑到人为错误的可能性，要得出无冲突的数据就会有些困难。


  而数据库则能够以更高的准确性和更少的冲突来存储和组织数据。


  另一个帮助你理解数据库的例子是查看手机的联系人列表。每个联系人是一条数据，你的智能手机就是数据库。只需轻点几个按钮，你就能轻松找到要找的联系人。你还可以轻松编辑每个联系人的详细信息。这种先进的数据管理方式远胜于用纸笔电话簿列出每个联系人。


  ## 数据库的类型


  数据库的不同类型如下：


  *   关系型数据库

  *   面向对象数据库

  *   基于文档的数据库


  在本电子书中，我将主要关注关系型数据库。不过，如有必要，我也会毫不犹豫地介绍其他两种类型。


  你可能已经接触过某种新型数据库，比如 NoSQL。它们被认为属于基于文档的数据库类别。这些数据库如今越来越流行，你可能会认为学习它们比学习 SQL 更好。


  请不要认为关系型数据库已经过时。我们今天仍在使用的大量数据库都采用关系模型。此外，SQL 在处理关系数据查询时非常有用。而且，新近流行的数据库的查询语言仍然与
  SQL 有一定关联，因为它们大多是在 SQL 之后开发的。


  换句话说，在不了解 SQL 的情况下直接跳入新型数据库，你会在前进道路上遇到大量挑战。因此，你决定先学习 SQL，然后再转向其他数据库（如 MongoDB）是正确的选择。


  闲话少说，现在让我带你进入 SQL 的世界。


  # 第 1 章 – 深入理解关系模型


  结构化查询语言（SQL）最初是为关系模型设计的。它是用于定义多个数据之间关系的语言。它也是用于在关系模式中查询数据的数据库编程语言。


  那么这一切是从何时开始的呢？


  第一个关系数据库创建于 60 年代，该模型中的编程主要由数学定义。事实上，这种数据库模型基于元组关系演算和关系代数。


  不过别担心，你无需深入研究代数和演算来处理关系数据库。SQL 将使关系数据库编程变得更加容易。


  ## 表、列和行


  在关系数据库中，数据存储在表中。在此模型中，所有表都有名称。例如，你可以将一个表命名为 `people`，将另一个表命名为 `sales`。这些名称指的是表中存储的数据类型。换句话说，我们称为
  `people` 的表包含人员数据，而称为 `sales` 的表包含销售数据。






  每个表都包含一组列。这些列定义了表中的不同数据片段。这正是关系模型区别于其他类型数据库的地方。你会注意到有些数据库将所有数据存储在一起。然而，在关系模型中，所有数据都按列分隔，每列都有一个名称。每列还可以限制将添加到其中的数据的类别和大小。例如，有些列只能存储字符串，而有些列只能存储数字。分配给每列的限制取决于数据库的创建者。


  列还分为必填列和非必填列。必填列意味着表中的每一行都必须包含与该列要求相对应的数据。另一方面，非必填列意味着我们可以为该列下的每一行赋予一个`NULL`值。在学习
  SQL 的过程中，你会发现`NULL`在数据库编程中有很多用途。


  使用行的主要目的是拥有可检索的数据以及可以存储数据的容器。我们为什么要存储数据？很简单，因为我们希望将来能再次获取这些数据，并且暂时需要一个存放它们的地方。因此，这就是数据库的核心思想。


  ## 键


  关系数据库的关键元素之一是键。我们现在知道一个表有多个列，每个列都有名称。每个列也有相关的属性。我们可以在列中指定的属性之一就是键。


  在关系数据库中，我们总是为每一行分配一个主键。这种特殊类型的键用于唯一确定某一行。这意味着该键的值必须保持唯一，并且在表中不能有任何重复。当且仅当在我们的关系模型中存在另一个包含该键的表时，我们可以将这两个表合并在一起。


  合并两个表时，总会有一些主键没有重复。合并后，你会注意到表中会出现一个包含这些键的新列。这些键现在被称为外键。它们充当第二个表主键的链接，使你能够方便地将两个分离表中的行关联起来。


  除了主键和外键，我们还有自然键。自然键是全局性的。这意味着你不能更改它们，因为它们在全球范围内用于标识单个实体。例如，已出版的书籍总是有自然键，我们称之为 ISBN。每本已出版的书都有自己唯一的
  ISBN，在处理书籍的关系数据库时，你需要将其用作主键。这与处理非自然键（如电子邮件、人员）的数据库不同，在后一种情况下，你需要为每一行自行创建主键。


  让我们以一个人及其联系号码的数据库为例。我们不能将姓名视为主键。我们也不能将人的电话号码视为主键。这是因为全球可能有两个或更多人有相同的联系号码、名字甚至姓氏。因此，我们应该自己创建主键。这就是标识列的作用。


  标识列作为一个自动递增的列，在我们向表中添加数据时不断生成唯一的键。键的组合方式并不重要，因为我们只需要为数据库中的每个实体提供一个唯一的键。


  # 第 2 章 – 关系模型示例


  由于我在上一章中一直在使用人员数据库，现在我将向你提供一个联系人数据库作为关系模型的完美示例。


  一个简单的联系人数据库通常如下所示：


  | 名字 | 姓氏 | 电子邮件地址 |

  | --- | --- | --- |

  | John | Doe | johndoe@email.com |

  | Mae | Lee | maelee@email.com |


  在这个表中，我们有三个列，分别用于查找特定数据。第一列要求输入名字。第二列要求输入姓氏，第三列要求输入该人的电子邮件地址。


  我们的行（不包括第一行）代表单个实体。第一个实体的行指的是名为 John Doe 的人，他的电子邮件是 johndoe@email.com。第二个实体的行指的是
  Mae Lee，电子邮件地址是 maelee@email.com。


  这是一个包含两个实体、由三列划分的数据库示例。


  假设 John Doe 有两个电子邮件地址，而 Mae Lee 有三个。有些人会通过添加列来增加额外数据。因此，表最终会变成这样：


  | 名字 | 姓氏 | 电子邮件 1 | 电子邮件 2 | 电子邮件 3 |

  | --- | --- | --- | --- | --- |

  | John | Doe | johndoe@... | johndoe2@... | `NULL` |

  | Mae | Lee | maelee@... | maelee2@... | maelee3@... |


  如果我们使用这种数据库设计，会有一个问题。首先，如果我们手头的问题是找出每个人有多少个电子邮件地址，那么要得到我们需要的答案会相当困难和繁琐。这是使用基于列的数据库的缺点。第二个问题是，对于那些只有一个电子邮件地址的人，我们最终会得到很多`NULL`值。第三，这种设计不实用，你不需要成为数据库专家也能意识到这一点。


  为了解决这三个问题，我们可以这样做：


  | 键 | 名字 | 姓氏 |

  | --- | --- | --- |

  | 1 | John | Doe |

  | 2 | Mae | Lee |


  第一步是首先为实体创建一个表。在这个表中，我们将第一列分配为主键。第二步是创建另一个表，用于存储这些人的电子邮件地址的值。第二个表如下所示：


  | 键 | 人员键 | 电子邮件地址 |

  | --- | --- | --- |

  | 1 | 1 | johndoe@email.com |

  | 2 | 1 | johndoe2@email.com |

  | 3 | 2 | maelee@email.com |

  | 4 | 2 | maelee2@email.com |

  | 5 | 2 | maelee3@email.com |


  在这个表中，你会看到有两列用于键。第一列指的是分配给每个电子邮件地址的主键。第二列指的是来自第一个表的外键。这是一个一对多关系模型的示例。


  在这个模型中，我们能够以最实用的方式组织数据。现在，我们也能更容易地回答每个人有多少封电子邮件的查询。这种方法被称为规范化。


  设计数据库有多种方式，而高效的设计取决于你想要回答哪些查询。


  综上所述，你现在已经准备好学习 SQL 了。


  # 第 3 章 – SQL 语句


  SQL 是一种特定的数据库语言。我们使用这种语言来创建语句。这些语句由有效的单词组成。有些单词应由 SQL 定义，而有些单词应由你定义。你在这些语句中指定的一些单词包括表名、列名以及表中的变量或数据。


  ## SQL 事实


  在继续之前，我想向你展示一些关于 SQL 的重要事实。


  关于 SQL，你需要知道的第一件事是它是可读的，因为它用英语编写。换句话说，学习 SQL 比学习任何其他编程语言都更容易。


  第二，你可以用 SQL 做更多的事情。这与大多数人的印象相反，他们认为 SQL 仅用于数据查询。这是错误的。


  第三，有效的 SQL 语句应以分号（;）结尾。虽然有些人会告诉你不再需要分号，但我建议你在查询中添加它，因为它是 ANSI 标准的一部分。此外，它在旧版和现代数据库中都能正常工作。分号允许你方便地将多个语句组合在一起，形成我们所说的批处理。这种方法即使在现代数据库中也能正常工作。





  第四点是 SQL 不区分大小写。你可以将变量写成大写或小写形式。在结构化查询语言中，两种写法都能正常工作。一个很好的实践方法是：将 SQL 特定的关键字用大写表示，而用户自定义的关键字用小写表示。这样能让你高效且快速地识别语句中的不同关键字。


  ## SQL 命令


  需要牢记的是，所有 SQL 语句都以一个命令开头。该命令通常是一个动词，用于指示数据库需要执行的操作。SQL 语句中使用的一个典型命令示例是 `SELECT`。


  `SELECT` 命令告诉数据库选择一组数据。如你所见，这是一个基于英语的单词，其含义非常直观。下面是该命令在 SQL 语句中的使用示例。


  ```

  SELECTVALUESFROMTABLENAME;

  ```


  上面的例子是一个通用的 SQL 语句示例，稍后我会逐部分讲解。


  请注意，你在语句中需要指定的一组值或变量取决于你试图执行的命令。所有这些变量都紧跟在命令之后出现在语句中。


  ## 命名值


  正如我所说，SQL 语句由 SQL 规范中的单词和用户创建的名称组成。这意味着命名值（如键、表名、列等）在 SQL 中非常重要。


  在 SQL 中命名没有绝对规则。人们有自己的命名变量方式，但我建议你遵循本书中使用的方法，以保持一致性。以下是本书中将实施的两条命名规则：


  *   所有表名必须使用单数形式。（例如：`person`、`email`、`phone`、`user` 等）

  *   列名在数据库中不应重复。


  有些人喜欢为表名使用复数形式。这并没有错。不过，我更习惯使用单数形式的表名。至于列名，有时不同表中的两列或多列会具有相同的名称。因此，我的做法是为每一列赋予唯一的名称，以消除歧义。例如，与其在
  `user` 表和 `email` 表中都使用 `ID` 作为主键的列名，不如分别使用 `user_ID` 和 `email_ID` 作为列名。


  你还应注意，SQL 中的名称是有作用域的。这意味着数据库本身必须有一个名称。数据库中的表也必须有名。每个表中的列也必须命名。当调用表时，其名称必须通过数据库名称进行限定，并使用句点（`.`）分隔名称。因此，在
  SQL 语句中指定时，它们看起来像这样：


  *   `Database.Table`

  *   `Table.Column`


  ## 在 SQL 中创建数据


  我并不打算教你如何从头创建数据库。作为初学者，你的任务应该只围绕向现有数据库添加或更新值。不过，我感觉你们中有些人仍然渴望学习 SQL，以便创建包括数据库在内的整个应用程序。因此，我将介绍
  SQL 的这一部分，但仅足以帮助你入门。


  用于创建新数据库的 SQL 关键字是 `CREATE DATABASE` 语句，这属于 ANSI 规范。假设你想创建一个用于存储联系人号码的新数据库，并将其命名为
  `Contacts`。操作如下：


  ```

  CREATE DATABASE Contact;

  ```


  为了在该数据库上工作，你需要先使用它。这里需要的关键字是 `USE DATABASE` 命令。执行方式如下：


  ```

  USE DATABASEContact;

  ```


  如果你想在 `Contact` 数据库中创建一个表，那么需要执行 `CREATE TABLE` 命令，操作如下：


  ```

  CREATE TABLE Contacts.User (...);

  ```


  之后，你就可以放入所有列名、类型和定义了。


  ## 数据类型


  数据类型很重要，因为它遵循列的限制。每一列都有关于可以存储哪种类型数据的规则。


  以下是一些主要数据类型及其简要说明。


  | 数据类型 | 描述 |

  | --- | --- |

  | `CHARACTER` | 用于定义列中允许的字符数。不多不少。 |

  | `CHARACTER VARYING` | 用于定义列中允许的最大字符数。可以少于但不能超过指定值。 |

  | `BINARY` | 用于将列专用于十六进制数据。 |

  | `SMALLINT` | 用于存储数值数据，范围从 -32,768 到 32,767。 |

  | `INTEGER` | 用于存储数值数据，范围从 -2,147,483,648 到 2,147,483,647。 |

  | `BIGINT` | 用于存储数值数据，范围从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。
  |

  | `BOOLEAN` | 用于存储 `TRUE` 或 `FALSE` 值。 |

  | `DATE` | 用于存储日、月、年，格式如下：`YYYY-MM-DD`。 |

  | `TIME` | 用于存储秒、分、时，格式如下：`HH:MM:SS`。 |

  | `TIMESTAMP` | 用于同时存储时间和日期。 |


  还有其他支持的数据类型，例如用于更复杂数字的类型。还有针对 UNICODE 字符与常规字符的特定数据类型。这些只是数据库编程中可用的部分类型。


  # 第 4 章 – 在 MySQL 中编码


  我将教你如何使用 MySQL 编写 SQL 数据库代码。为什么选择 MySQL？首先，它是一个开源平台，你可以免费获取。其次，它与所有主流操作系统兼容：Linux、OSX
  和 Windows。第三，它具备 ANSI 模式，可以强制你的数据库遵循 ANSI 规范。并非所有关系数据库管理系统都有此功能。


  在本章中，我将教你如何高效使用 `SELECT` 命令。这将使你能够有效利用该命令创建有趣且高效的数据查询。


  ## SELECT 命令结构


  你现在应该已经知道，SQL 关键字 `SELECT` 是一个用于从数据库中获取特定数据的命令。在 `SELECT` 关键字之后，应该跟的是我们希望从数据库中获取的项目列表。我们称之为“选择列表”。如果选择列表只包含变量，那么你可以简单地按如下方式编写语句：


  ```

  SELECT ''[Variable]'',''[Variable]'';

  ```


  大多数情况下，选择列表包含列名。此时，必须定义这些列所在的表。这就是 `FROM` 命令的用武之地。


  例如，我们的选择列表包含 `User`（列 A）和 `Email`（列 B），并且这些列位于名为 `Contact` 的表中。为了指定要查找的表，我们应该包含
  `FROM` 命令，如下所示：


  ```

  格式：SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];示例：SELECTUser,EmailFROMContact;

  ```


  但你可能要问：如果表中有很多列，我想全部选中怎么办？这时就要用到星号（`*`）的威力了。它在 SQL 语句中被称为通配符。要选择表中的所有列，你需要执行以下格式的语句：


  ```

  SELECT* FROM [TABLE_NAME];

  ```


  如你所见，通配符位于 `SELECT` 命令之后。这在选择所有列时非常有用。如果你不需要选择所有列，那么使用通配符可能会变得危险且低效。


  根据你使用的平台，有多种方法可以快速指定多个列。我个人建议避免使用通配符命令，因为低效使用此语法也可能导致应用程序崩溃。


  ## FROM 命令


  选择单个表编写 SQL 语句相当简单。从之前的示例可以看出，它只遵循一个简单的格式。


  ```

  FROM [TABLE_NAME]

  ```




  在 `FROM` 子句中，你可以通过为表名创建别名来缩短表名。假设你的表名是 `telecommunication`，并且你想查找表中 `owner` 列下的所有者名称列表。使用通用格式输入会得到如下结果。


  ```

  SELECT telecommunication.owner FROM telecommunication;

  ```


  为什么在上面的格式中我们需要在列名之前输入表名？这是因为我们必须使用表名来限定列。此外，这可以避免将来出现列名相同的情况时发生名称冲突。我建议你养成这个习惯。


  回到主题，这样做太不方便了。我们可以通过在 `FROM` 子句中分配别名来缩短表名。格式如下。


  ```

  SELECT [TABLE_NAME_ALIAS].[COLUMN_NAME] FROM [TABLE_NAME] [TABLE_NAME_ALIAS];

  ```


  使用 `owner` 列和 `telecommunication` 表，我们的新语句将如下所示。


  ```

  SELECT t.owner FROM telecommunication t;

  ```


  如你所见，我将字母 `t` 分配为表名的别名。这比一遍又一遍地重复完整名称更容易书写。请记住，不必使用表名的第一个字符作为别名。你可以为表名分配任何别名，它也可以是字符的组合。只需确保你使用的别名保持一致即可。


  ## 限制结果


  每当你执行 `SELECT` 查询时，数据库会返回指定列下的所有行。这意味着如果你的表有 20,000 行，那么它将返回 20,000 个值来响应你的语句。


  有两种方法可以解决这个问题。一种是在 `FROM` 子句之后添加额外的子句。另一种是在选择列表之前添加 `DISTINCT` 限定符。格式如下所示。


  ```

  SELECT DISTINCT [SELECT LIST] FROM [TABLE_NAME];

  ```


  这种格式只会返回不同的值，而不是提供指定列下的所有值。这是获取该列下所有唯一值的完美方法。例如，你有一个联系人表，某些实体因为拥有多个电话号码而出现在多行中。


  依赖通用格式会得到重复的结果。如果你只想知道你的联系人是谁，这并不高效，对吧？使用 `DISTINCT` 限定符可以防止你收到同一实体的多行数据。


  以下是我们包含所有者列和电信公司列的 `telecommunication` 表。


  | Key | Owner | Company |

  | --- | --- | --- |

  | 1 | Jean Grey | AT&T |

  | 2 | Luke Skywalker | Comcast |

  | 3 | Mae Lee | AT&T |

  | 4 | Stan Lee | AT&T |


  假设我们想查找数据库中的电信公司列表。使用通用格式会得到三个 AT&T 的结果，这是不必要的。然而，使用 `DISTINCT` 限定符，我们只会得到两个结果——一个
  Comcast 和一个 AT&T，这正是我们需要的。


  除了 `DISTINCT` 限定符，你还可以在 `FROM` 子句之后添加 `WHERE` 子句来限制结果。`WHERE` 子句充当一个精度更高的搜索引擎。这通过以下格式实现。


  ```

  SELECT [SELECT LIST] FROM [TABLE_NAME] WHERE [EXPRESSION];

  ```


  举一个简单的例子，我们使用另一个包含人们名字和姓氏的表。我们将这个表命名为 `person`。


  | Key | First | Last |

  | --- | --- | --- |

  | 1 | Lee | Mortis |

  | 2 | Mae | Lee |

  | 3 | John | Doe |

  | 4 | Stan | Lee |

  | 5 | Bruce | Lee |


  假设这是我们的客户数据库，我们想知道有多少客户的姓氏是 Lee。为此，我们需要执行 `WHERE` 子句命令。


  ```

  SELECT p.last FROM person p WHERE p.last = ''Last'';

  ```


  这将指示数据库专门查找姓氏列，并只关注该列中值为 Lee 的行。它会忽略该列中没有 Lee 值的行。换句话说，你只会得到姓氏为 Lee 的客户行。


  理解 `WHERE` 子句的秘诀在于记住可以在 `WHERE` 表达式中使用的不同运算符。这些运算符类似于数学运算符。这意味着它们很容易记住。与数学不同，我们在这里使用的运算符也适用于非数值数据，例如我们在上面的
  `WHERE` 子句中使用的等号（`=`）。以下是可以在 `WHERE` 子句中使用的简单运算符列表。


  | 运算符 | 名称与描述 |

  | --- | --- |

  | `=` | 等于——如果两侧数据相等，则返回 TRUE。 |

  | `<>` | 不等于——如果两侧数据不相等，则返回 TRUE。 |

  | `>` | 大于——如果左侧数据大于右侧数据，则返回 TRUE。 |

  | `<` | 小于——如果左侧数据小于右侧数据，则返回 TRUE。 |

  | `>=` | 大于或等于——如果左侧数据大于或等于右侧数据，则返回 TRUE。 |

  | `<=` | 小于或等于——如果左侧数据小于或等于右侧数据，则返回 TRUE。 |


  这些是在处理 SQL 查询的 `WHERE` 子句时返回布尔值的运算符。


  # 结论


  至此，你已经熟悉了关系数据库的工作原理以及 SQL 在从使用关系模型的数据库中查询数据时的效率。


  注意如何指定列的限制以及如何使用 `SELECT` 语句专门调用它们是很重要的。你还了解到 SQL 语句包含 SQL 定义的关键字和用户定义的关键字。这些关键字不区分大小写，但强烈建议以视觉友好的方式组织和编写语句。这样做不仅方便你查看自己的
  SQL 代码，也方便其他人查看。如果你在团队中工作，这是一个最佳实践。


  在编写 `SELECT` 语句时，使用表名限定列名也很重要。这可以避免将来不同表具有相似列名时出现问题。你刚刚学习了如何使用别名缩短表名。


  你还可以通过使用诸如 `FROM` 之类的子句来指定 `SELECT` 语句的数据提取。使用 `FROM` 子句可以让你指定 SQL 语句查找列时要查看哪个表。除此之外，`FROM`
  子句还允许你为表名分配别名。


  你还学习了如何使用 `DISTINCT` 限定符和 `WHERE` 子句来限制返回值的数量。请记住，应避免使用通配符，因为这是一种低效的从数据库中提取数据的方式。另一方面，`WHERE`
  子句是一个强大的命令，作为初学者你需要掌握它。熟悉不同的运算符，并在已有的数据库上尝试使用它们。


  我知道这本书是基础性的，但它足以让你为深入学习结构化查询语言做好准备。作为初学者，你无需急于学习如何创建自己的数据库。首先了解 SQL 函数所基于的数据库模型很重要。通过理解关系模型，你将轻松掌握
  SQL 的概念以及使用该语言可以执行的语句。


  如果你想继续学习 SQL，那么我建议你利用本书的续篇，其中将介绍 `SELECT` 语句的更深入子句。第二部分还将涉及 JOIN、数据处理和表创建。


  # 引言


  C++ 是一种新兴的编程语言，基于对象和编译。如果你从未编程过，可能会对“对象”和“编译”这两个词感到困惑。


  使用编译的程序由计算机的 CPU 直接读取，而不是通过计算机上安装的程序来解释运行。因此，这种程序更直接地与计算机的处理系统对话，而非与某个程序交互。


  你可能已经知道，计算机无法直接读取字母，只能读取二进制代码，因此代码必须被翻译成计算机可读的形式。这个过程称为编译。而面向对象的代码只是代码的组织方式。在接下来的章节中，你会更好地理解这一点。


  那么这一切意味着什么，为什么你需要了解它？作为使用 C++ 的程序员，你需要的不仅仅是普通的文本编辑器。只有少数几种编程语言仅靠文本编辑器就能工作，而且它们其实算不上真正的编程语言。你需要的东西之一就是编译器。


  另一个你需要的是集成开发环境，简称 IDE。这是一个面向程序员的文本编辑器，具有语法高亮功能，并且集成了编译器。对于 Windows 和 Linux，你可以使用几种不同的选择。


  你并不一定需要 IDE，因为基本的文本编辑器也能用，但像记事本这样的工具会让事情变得困难一些。文字处理软件也不是好选择，因为它们有拼写和语法自动更正功能，如果不小心，可能会破坏你的代码。


  开始学习 C++ 时，你应该知道它有严格的语法。这意味着代码是区分大小写的，所以输入 `Hello` 和输入 `hello` 是不同的。此外，你应该知道这种编程语言对空白字符不太敏感，所以不用担心。


  以上就是你刚开始学习 C++ 时需要了解的内容。让我们开始编写一些实际的代码吧！


  ## 第一章 – 你的第一个程序


  ![ANd9GcSiYFVzWNtEsPfcM_CSykJhn4tkkH-GCJ4xX-yvN9K3b23DtDU2aQ](img/00010.jpeg)由于这是一篇关于如何开始学习
  C++ 的简短教程，我们将在第一章就让你开始编写一个程序。你的第一个程序会非常简单。你只需要在屏幕上写出一句话，但这并不像在 Word 文档中写出来那么简单。首先，让我们看看代码，然后进一步解释它的含义。


  ![](img/00011.jpeg)


  这一行告诉编译器，它需要将 `isostream` 库链接到程序。库是一个存储代码片段（称为函数）的仓库。库还存储其他东西，比如变量和有时是运算符。


  `isostream` 库包含的代码允许你将字符发送到文本流中，然后这些字符被输出到屏幕上。可以把它想象成一条河流。你是河流的源头，屏幕是大海。从源头放入河流的任何东西都会流向屏幕。


  下一行（第二行）让编译器知道你想要使用名为 `std` 的命名空间，这是一个标准命名空间。命名空间是代码存储的区域。如果你有两段同名的代码，这会很有用。通常，代码片段不能共享相同的名称，但如果其中一个位于与另一个不同的命名空间中，那么它们就可以同名。


  第三行代码是代码的开始。顾名思义，它是 `main` 块。花括号 {} 内的所有内容都将被编译器翻译。每个程序都需要这一行，因为没有它，什么都不会发生。


  现在到了打印短语 `Hello World!` 的部分。为此，你需要使用存储在 `isostream` 库中的代码。这部分代码被称为语句或 `cout`，它将信息发送到流中。`cout`
  后面的 `<<` 是一个运算符，表示“输出”，因此与 `cout` 一起，它翻译为“输出这个流”。


  接下来的流是 `Hello, World!`，被称为字符串。字符串是字符序列，通过用双引号括起来表示。它以分号结束，表示语句的结束。如果不使用分号，程序将无法编译。


  ![`potofcode.com/wp-content/uploads/2015/03/helloworld.gif`](img/00012.jpeg)


  最后一行（不是右花括号）非常简单但非常重要。它放在 `main` 的末尾，告诉计算机 `main` 块已经完成。它将返回值 0 给 CPU。非零值会产生错误，因此这一行是必需的。


  现在你已经有了程序的源代码，你需要编译它。如果程序运行后立即关闭，请尝试从 `cmd`/终端提示符运行它。


  现在你已经知道如何创建第一个程序以及它是什么样子，让我们来看看变量！


  ## 第二章 – 变量


  在上一章中，我们提到了变量，并说会在后面讨论。现在是时候讨论它们了。变量是存储值的东西。想象每个变量都是一个盒子，每个盒子都标有名称和类别。


  ![`img.c4learn.com/2012/02/Variable-in-Java.jpg`](img/00013.jpeg)


  类别表示它存储的是哪种类型的物品，名称则是该特定变量的称呼。盒子可以存储很多东西，但前提是东西能放进盒子里。变量也是如此。它们都有类型、名称和大小，这些决定了它们能存储什么以及不能存储什么。


  例如，一种变量类型是整数。如果你了解基础数学，就知道整数是零、正整数和负整数。所以 -5、4、0 和 -378 都是整数。此外，整数变量有固定的大小。


  它们只能容纳两个数之间的一个数。这些范围因变量而异，这里暂不讨论，但默认整数的范围是 -2³¹ = -2,147,483,648 到 2³¹–1 = 2,147,483,647。你可能暂时不需要更大的数字，所以其余内容留到以后再说。


  下面是一个表格，展示了你可以使用的不同变量类型。


  ![](img/00014.jpeg)


  有几种不同的变量类型。你在编程时可能会用到它们全部，但目前你只需要使用其中几种。


  ### 使用变量


  看看下面的程序：


  ![](img/00015.jpeg)


  这个程序的大部分内容看起来都很熟悉，除了第四行和第六行。第一个不熟悉的部分是声明变量。这告诉编译器你将使用一个变量。在声明中，变量类型放在前面。在示例中，使用的是
  `int` 类型。接下来是变量的名称，这里称为 `var`。





  这很简单。变量名可以是任何内容，但务必确保它相关且不是 C++ 中已保留或具有特定含义的名称，同时不能以数字或特殊字符开头。变量名应以小写字母开头，并以分号结束语句。


  上面代码中的第九行被称为赋值语句，用于给变量赋值。等号是赋值运算符，负责执行赋值操作。左侧的变量被赋予右侧的值，而 `=` 是一个二元运算符，因为它有两个操作数：一个在左侧，另一个在右侧。右侧的操作数不必是一个值，也可以是另一个变量。左侧必须是一个变量，你不能改变数字七的含义。在示例中，整数变量
  `var` 的值为四十二。


  你可以看到 `cout` 语句中变量名周围没有引号。这是因为你想要输出 `var` 的值，而不是显示字符串 `''var''`。如果你编译这个程序，它会打印出
  `''42''`，因为这就是 `var` 的值。尝试将其改为另一个整数，并查看输出。


  ![images](img/00016.jpeg)


  变量还有前缀，这些前缀被添加到它们的声明中，从而改变它们的行为。有些会改变大小，有些不允许负数，还有些可能会做完全不同的事情。


  现在你已经了解了变量，让我们来谈谈如何扩展程序！


