  ## 第五章 – 条件语句


  拥有一个执行单一线性任务的程序（比如说“你好”）固然很好，但你很少会遇到只需要线性任务的程序。程序通常使用所谓的条件语句，即根据条件是否为真，将代码分支到不同路径的语句。这基本上就像道路上的岔路口。


  C++ 的条件语句采用 `if` 语句的形式。例如，如果某条件为真，则执行这行代码；如果为假，则执行另一行代码。以下面这段代码为例。


  ![](img/00022.jpeg)


  第一行到第五行对你来说应该已经很清楚了，但第三行可能需要一点解释。这是 `if` 语句的示例。它的操作方式是：首先获取整数变量 `a` 的值，并检查它是否小于
  2。如果为真，则执行花括号内的代码。


  如果不为真，则程序继续执行，就好像这段代码不存在一样。我们知道 1（即 `a` 的值）小于 2，所以如果你运行这个程序，屏幕上会显示 `''a is less
  than 2!''`。


  这里引入了另一个运算符：小于号 `<`。如果你熟悉数学，那么这个符号的用法不言自明。如果不熟悉，你需要学习它。注意，虽然 `<` 看起来像 `<<`，但它们完全不同，在编程中也没有关联。


  ![images(3)](img/00023.jpeg)


  当然，C++ 是一种强大的语言，因此它能够使用这些条件 `if` 语句做更强大的事情。


  总之，C++ 的条件语句以 `if` 语句开始，之后还可以有多个 `else if`。你需要记住的一个重要点是：一旦其中一个条件被满足，其余所有条件都会被跳过。如果你希望所有
  `if` 语句都被检查，那么可以连续使用多个独立的 `if` 语句。


  ## 第六章 – 循环


  ![images(4)](img/00024.jpeg)现在你已经能够编写代码来读取用户输入、根据输入执行不同操作并显示结果，但如果你想要重复执行相同的操作，只是参数不同，该怎么办？重复编写相同的代码会很无聊，而且如果在编写代码时不知道需要运行这段代码多少次，那会很尴尬。如果它取决于用户输入的内容呢？


  ![](img/00025.jpeg)


  要完成这个操作，你需要使用一种称为循环的结构。循环是一段重复执行的代码，一次又一次地运行，直到满足某个条件。C++ 有三种不同类型的循环：`while` 循环、`for`
  循环和 `do while` 循环。让我们从最简单的 `while` 循环开始。


  `While` 循环看起来几乎和 `if` 语句一样。


  ![](img/00026.jpeg)


  当你了解 `while` 循环的实际作用时，`''while''` 的用法就很明显了。这里的代码意思是：“当 `userInput` 变量的值不等于 10 时，从用户那里获取输入”。另外，记住
  `!` 在 C++ 中表示“非”，所以代码 `!=` 表示“不等于”。


  如果 `userInput` 是 10，那么代码不会被执行，循环将被跳过。`While` 循环可以看作是一个 `if` 语句，在代码执行完毕后会跳回自身的信息处。


  在我们继续之前，重要的是要知道以下这段代码在 C++ 中是可用的：


  ![](img/00027.jpeg)





  它其实有自己的名字。这是一个无限循环，所以它会无限地循环下去。运行这段代码，你会得到类似“1 等于 1 吗？是的，打印一个‘a’。”这样的结果。这个过程会不断重复。还有其他方式可以制造无限循环，但你大概不想这么做。


  第二种循环是 do while 循环。do while 循环看起来像这样：


  ![](img/00028.jpeg)


  虽然它看起来和你刚才看到的标准 while 循环不同，但两者几乎一样，只有一个区别。while 循环会先判断条件是否为真，如果为真则执行代码；而 do while
  循环会先执行一段代码，然后再检查条件是否为真。由于这个特性，无论你将 `userInput` 初始化为任何值，花括号之间的代码都一定会被执行。


  第三种循环是 for 循环。这是三种循环中最复杂的一种，但一旦你理解了它，就会非常强大。现在，我们先来了解它的用途。看看这个 for 循环：


  ![](img/00029.jpeg)


  这段代码告诉程序：先将变量 `i` 的值设为 2，只要 `i` 小于 10，就将其值输出到屏幕并递增。你可以用 while 循环轻松实现同样的功能，但那样会需要更多行代码，而且显得很不整洁。


  你还应该知道，for 循环第一行中使用的变量必须是同一个变量。同时要记住，第一个语句不是条件判断，而是赋值操作。


  当你需要遍历各种数据时，这种循环就非常有用。在下一章学习数组时，你会看到它的应用。


  ## 第七章——数组


  数组是一组变量组成的列表，这些变量因为具有共同用途而被组合在一起。它们并不一定非得有共同点，但把不相关的东西放在一起并不是个好主意。这就像把随机文件塞进文件柜却从不整理一样——如果你打算这么做，那还要文件柜干什么？


  下面是一个整数数组的声明：


  ```

  1 int a [5];

  ```


  你可以看到，数组看起来和普通变量类似，但末尾带有一对方括号。声明数组时，方括号内要填入你想要的数组大小。在这个例子中，你要存储五个整数变量。


  ![images(2)](img/00030.jpeg)


  只要你的 RAM 足够，数组可以是任意大小，但一次只能存放一种类型的变量。变量类型可以是任何你常用的类型。


  访问数组中的某个特定变量很简单。你只需在方括号中放入你想要的那个变量的序号。因此，第一个变量用 `[0]`，第二个用 `[1]`，以此类推。请看下面的例子：


  ![](img/00031.jpeg)


  有一件事你绝对不应该做：访问数组中不存在的变量，比如在一个只有五个位置的数组中访问第十个变量，或者访问一个没有被赋值的变量。如果变量没有被赋值，你会得到一个所谓的“垃圾值”，因为返回的值是不可用的。


  如果变量不存在，你可能会遇到段错误，因为程序会试图访问它不被允许访问的内存段。这可能导致程序意外终止。


  现在你已经知道如何创建数组了，接下来我们看看如何创建函数！


  ## 第八章——函数


  函数是编写复杂程序时避免重复代码的好方法。例如，假设你有一段复杂的代码，用于从用户那里获取输入并解析它。现在，你需要多次运行这段代码，但不是在循环中。到目前为止，你每次都得重新写一遍。


  ![images(3)](img/00032.jpeg)


  在现代复制粘贴技术下，这倒不是什么大问题，但代码会变得非常难看，而且重复代码在修复错误时也会带来麻烦。为了解决这个问题，你可以创建函数——这些代码片段可以被反复调用，而无需每次都重新编写。


  实际上，你已经使用过一个函数了。`main` 就是一个函数。那么，让我们来看看它是如何工作的：


  ![](img/00033.jpeg)


  我们来分析第一行，也就是包含 `main` 的那一行。这行代码开始定义一个函数，该函数不接受任何参数，名为 `main`，并且会返回一个 `int` 类型的值。你已经知道
  `int` 是一种变量类型，但“返回值”是什么意思呢？


  C++ 中的函数就像数学中的函数：你输入一个数字，对它执行某种运算，然后得到一个结果。在这里，`int` 就是输出函数将要返回的变量类型。参数是输入到函数中的变量，函数在执行运算后返回结果。


  让我们来看一个带有 `main` 的函数：


  ![](img/00034.jpeg)


  参数的写法类似于变量定义，并用逗号分隔。它们紧跟在函数名之后，并用圆括号括起来。这里有一个名为 `argc` 的整数值和一个名为 `argv` 的字符数组作为参数。你可以使用任何类型的变量作为函数参数，只要在调用该函数时提供相同类型的变量即可。


  现在你已经知道函数是什么以及它的作用了，接下来我们看看指针。


  ## 第九章——指针


  RAM（随机存取存储器）是计算机保存程序所用所有变量的地方，它本质上是一长串数字。每个数字都由其地址（即在这串数字中的位置）来标识。这些地址是逻辑上的，因此地址为
  4 的数字位于地址 3 之后、地址 5 之前。


  该地址上数字的具体大小由计算机架构决定。假设你有两个整数和一个字符。其中一个整数的地址可能是 1000，另一个是 1004。字符（`char`）的地址可能是 1008。那么为什么变量之间会有
  4 字节的间隔呢？因为整数占 4 个字节，所以它们需要占用 4 个地址来存储其值。即使你只用了 1 个字节而其他 3 个字节没用，它仍然会占用 4 字节的内存。


  ![images(4)](img/00035.jpeg)


  但为什么你需要知道这些呢？C++ 程序员需要知道，编译器并不会为他们提供花哨的地址映射，而是将变量转换为 RAM 中的地址。不过，有时我们自己了解这种转换也是有好处的。想想数组是如何工作的：它们只是一长串变量，其类型由程序员告诉编译器。


  所以你可能会想，这就像 RAM 一样，而你是对的。当你标记数组时，第五个值实际上是第六个值，因为所有数组都从零开始——你实际上是在取第一个变量之后的第五个变量。因此，如果你说数组是整数数组，第一个整数来自
  RAM 地址 1000，再结合你知道整数占 4 个字节，那么数组中的第 n 个整数的地址就是：


  ![](img/00036.jpeg)


  因此，第六个元素的地址是 1020。那么这有什么用呢？你可以在程序编译和运行时创建数组，并使其具有合适的大小。


  指针是一个普通变量，但它不存储整数，而是存储另一个变量的地址。下面是一个指针：


  ![](img/00037.jpeg)


  在这个指针中，你有一个变量，它存储了整数的地址。`*` 表示该变量是指针，而不是普通变量。你将它赋值为零。当你给指针赋值时，你给的不是数字或字符，而是另一个变量的地址。




  现在你已经了解了它们是什么，接下来让我们进入下一章，学习动态内存。


  ## 第十章 - 动态内存


  到目前为止，你可以在编译时创建变量并在运行时修改它们；然而，当你使用动态内存分配时，也可以在运行时创建它们。这种方法在程序运行过程中分配和释放 RAM。由于你正在访问
  RAM，很自然地会认为你将使用指针来完成，但 C++ 中的动态内存使用方式与 C 语言不同。


  请看下面的代码块。


  ![](img/00038.jpeg)


  这里你创建了一个指向 int 的指针，并为它分配了一些内存。由于 `i` 仍然是指针，而不是变量，你必须将 `i` 所指向的值设置为五，而不是设置 `i` 本身。这改变了
  `i` 所指向的位置，并使之前分配的内存成为孤儿，留在 RAM 的某个地方。这种被遗忘的内存被称为内存泄漏。要阻止这种情况，请确保使用 `delete` 运算符释放最初分配的内存。


  ![images(5)](img/00039.jpeg)


  不过，只为单个变量分配内存并没有太大帮助。如果你知道变量会存在，那么你可以正常声明它。而动态内存的作用是创建在编译时未知大小的可变长度数组。你实际上怎么可能知道它的大小呢？你不能创建一个指针数组，然后按需访问它们，那只是创建一个巨大的数组并希望一切顺利的更消耗
  RAM 的版本。


  现在你已经了解了什么是动态内存以及如何使用它，接下来让我们在下一章中看看类和对象。


  ## 第十一章 - 类和对象


  这实际上是 C++ 被创造出来的目的——支持类和对象。没有它们，C++ 就只是 C 语言。但之前提到的类和对象是什么呢？类就像一种模具，而对象是从模具中产生的东西。这些模具很灵活，可以用来制作你想要的任何类型的对象。模具可以是通用的，也可以是特定的。


  ![images(5)](img/00040.jpeg)


  假设你想制造一辆交通工具。这将是一个抽象的教程，因为代码实际上不会执行任何操作。想想一辆汽车需要哪些属性。它们需要速度、价格、颜色、制造商和型号。它是否是四轮驱动？你能用它做什么？你能启动引擎并停止吗？


  让我们看看汽车类的定义。


  ![](img/00041.jpeg) ![](img/00042.jpeg)


  ![](img/00043.jpeg)


  正如你所看到的，类的定义方式与结构体非常相似，这很合理，因为它们都是对数据进行分组的方式。但这个类包含了一些结构体无法包含的东西——函数。


