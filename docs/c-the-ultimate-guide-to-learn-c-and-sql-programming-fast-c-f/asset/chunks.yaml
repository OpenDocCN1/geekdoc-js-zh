    `var` 的值为四十二。


    你可以看到 `cout` 语句中变量名周围没有引号。这是因为你想要输出 `var` 的值，而不是显示字符串 `''var''`。如果你编译这个程序，它会打印出
    `''42''`，因为这就是 `var` 的值。尝试将其改为另一个整数，并查看输出。


    ![images](img/00016.jpeg)


    变量还有前缀，这些前缀被添加到它们的声明中，从而改变它们的行为。有些会改变大小，有些不允许负数，还有些可能会做完全不同的事情。


    现在你已经了解了变量，让我们来谈谈如何扩展程序！


    ## 第三章 - 扩展你的程序


    现在你已经知道如何使用变量以及如何将它们放入程序中，让我们来看看如何扩展程序。你真正知道如何做的只是使用变量并将它们放入程序中，所以你所能做的只是设置输出和变量的值。这在创建真正的程序时并不实用。


    ![images(2)](img/00017.jpeg)


    你需要的是操作变量以及从用户那里接收输入的方法。那么，让我们来看看下一步！


    ### iostream 库


    你已经知道 `iostream` 库能够输出数据，但它也能获取输入数据。该命令与 `cout` 语句非常相似。命令是 `cin`。不过有一个区别：当你使用
    `cin` 时，它后面的运算符是反向的。


    不再是 `<<`，而是 `>>`。一开始这可能会让人混淆，但你最终会学会的。注意，当你运行程序时，需要在输入所需信息后按回车键，就像在终端/命令提示符中一样。


    看看下面的程序，了解两者之间的区别。


    ![](img/00018.jpeg)


    现在你可能已经看到，使用 `iostream` 库获取用户输入很简单，这能产生一些更有用的程序。不过，`iostream` 的功能更强大。你可以将多个语句合并为一个。


    例如，要输出两个字符串或变量，通常需要两个语句，但你可以合并多个 `cout` 语句，生成更短的代码。你只需为要输出或输入的项目添加另一个运算符即可。


    例如：


    ![](img/00019.jpeg)


    你也可以用同样的方式组合 `cin` 语句，以便连续接收输入的多个部分。每次输入后都需要按回车键，并且不能在一行代码中混合输入和输出。


    现在你已经知道如何组合代码并扩展程序，让我们进一步讨论运算符。


    ## 第四章 – 运算符


    你已经学会了如何输出文本、声明变量以及获取输入，但你无法对变量进行任何操作。当然，你可以给它们赋值，但在现实世界中这有什么用呢？你真正需要的是无需费力就能操作变量的方法。幸运的是，运算符会帮你解决！


    你已经了解了与 `iostream` 库相关的两个运算符：输入和输出，即 `>>` 和 `<<`。


    ![images](img/00020.jpeg)


    这些运算符可以归入不同的类别，第一类是算术运算符。它们是 `-`、`+`、`/` 和 `*`。你可以像在数学中那样使用它们。例如，这段代码会将两个数字相加并显示结果。


    ![](img/00021.jpeg)


    现在你已经知道如何使用运算符，让我们来看看条件语句！


    ## 第五章 – 条件语句


    拥有一个执行单一线性任务的程序（比如说“你好”）固然很好，但你很少会遇到只需要线性任务的程序。程序通常使用所谓的条件语句，即根据条件是否为真，将代码分支到不同路径的语句。这基本上就像道路上的岔路口。


    C++ 的条件语句采用 `if` 语句的形式。例如，如果某条件为真，则执行这行代码；如果为假，则执行另一行代码。以下面这段代码为例。


    ![](img/00022.jpeg)


    第一行到第五行对你来说应该已经很清楚了，但第三行可能需要一点解释。这是 `if` 语句的示例。它的操作方式是：首先获取整数变量 `a` 的值，并检查它是否小于
    2。如果为真，则执行花括号内的代码。


    如果不为真，则程序继续执行，就好像这段代码不存在一样。我们知道 1（即 `a` 的值）小于 2，所以如果你运行这个程序，屏幕上会显示 `''a is less
    than 2!''`。


    这里引入了另一个运算符：小于号 `<`。如果你熟悉数学，那么这个符号的用法不言自明。如果不熟悉，你需要学习它。注意，虽然 `<` 看起来像 `<<`，但它们完全不同，在编程中也没有关联。


    ![images(3)](img/00023.jpeg)


    当然，C++ 是一种强大的语言，因此它能够使用这些条件 `if` 语句做更强大的事情。


    总之，C++ 的条件语句以 `if` 语句开始，之后还可以有多个 `else if`。你需要记住的一个重要点是：一旦其中一个条件被满足，其余所有条件都会被跳过。如果你希望所有
    `if` 语句都被检查，那么可以连续使用多个独立的 `if` 语句。


    ## 第六章 – 循环


    ![images(4)](img/00024.jpeg)现在你已经能够编写代码来读取用户输入、根据输入执行不同操作并显示结果，但如果你想要重复执行相同的操作，只是参数不同，该怎么办？重复编写相同的代码会很无聊，而且如果在编写代码时不知道需要运行这段代码多少次，那会很尴尬。如果它取决于用户输入的内容呢？


    ![](img/00025.jpeg)


    要完成这个操作，你需要使用一种称为循环的结构。循环是一段重复执行的代码，一次又一次地运行，直到满足某个条件。C++ 有三种不同类型的循环：`while` 循环、`for`
    循环和 `do while` 循环。让我们从最简单的 `while` 循环开始。


    `While` 循环看起来几乎和 `if` 语句一样。


    ![](img/00026.jpeg)


    当你了解 `while` 循环的实际作用时，`''while''` 的用法就很明显了。这里的代码意思是：“当 `userInput` 变量的值不等于 10
    时，从用户那里获取输入”。另外，记住 `!` 在 C++ 中表示“非”，所以代码 `!=` 表示“不等于”。


    如果 `userInput` 是 10，那么代码不会被执行，循环将被跳过。`While` 循环可以看作是一个 `if` 语句，在代码执行完毕后会跳回自身的信息处。


    在我们继续之前，重要的是要知道以下这段代码在 C++ 中是可用的：


    ![](img/00027.jpeg)


    '
- fmt: '

    It actually has its own name. It’s an infinite loop so it will loop infinitely.
    Going through the code, you’d get something like ‘Is 1 equal to 1? Yes it is,
    print an ‘a’.’ This will repeat over and over again. There are other ways to make
    infinite loops, but you probably don’t want to make one.


    The second type of loop is the do while loop. Do while loops look like this:


    ![](images/00028.jpeg)


    While it looks different than the standard while loop you just saw, it’s almost
    the same thing, except there’s one difference. The while loop evaluates a condition
    to see if it’s true and will run the code if it is, and the do while loop will
    execute some code and then check to see if the condition is true. Due to this
    happening, no matter what you initialized as `userInput` to the code between the
    curly-brackets will definitely run.


    The third type of loop is the for loop. This is the more complicated out of the
    three, but it’s powerful when you understand it. For now, let’s just cover the
    uses. Take a look at this for loop.


    ![](images/00029.jpeg)


    This piece of code tells the program to start by setting the value `i` to 2 and
    as long as `i` is less than 10, then output its value to the screen and increment.
    You can easily replicate this loop using a while loop, but it uses a lot more
    line of code and is pretty untidy.


    You should also know that the variables used in the first line of the for loop
    have to be the same variable. You also should remember that the first statement
    is not a conditional, it’s an assignment.


    This kind of loop comes in handy when you want to step through various pieces
    of data, and you’ll see this when you read about arrays in the next chapter.


    ## Chapter Seven– Arrays


    Arrays are a list of variables that are grouped together because they have a common
    use. They don’t really have to have something in common, but when you put unrelated
    things together it’s not really a good idea. It’s like filling your filing cabinet
    with random papers and never organizing them. What the need for a filing cabinet
    of you’re going to do that?


    Here’s a declaration of an array of integer variables.


    ```

    1 int a [5];

    ```


    You can see that arrays look like normal variables, but they have some square
    brackets at the ends. When you declare arrays, the brackets are then filled with
    the size of the array you’re looking for. In this case, you’re going to store
    five integer variables.


    ![images(2)](images/00030.jpeg)


    An array can be whatever size you want as long as you have the RAM to spare, but
    it can hold only one type of variable at once. The variable type can be something
    you’d normally use.


    Accessing a certain variable in the array is simplistic. You put the numbers of
    variables you want in the square brackets. So for the first variable you want
    `[0]`, for the second you put `[1]` and keep going. Take a look at the following
    example.


    ![](images/00031.jpeg)


    One thing you shouldn’t do is access a variable that’s not in the array that doesn’t
    exist, like the tenth variable in an array that has five places, or doesn’t have
    a variable assigned to it. If it doesn’t have a variable assigned to it, you’ll
    get what’s known as a garbage value because the value it returns is not going
    to be useable.


    If the variable doesn’t exist, you can get a segmentation fault because the program
    will try to access a segment of memory that it’s not allowed to. This can result
    in the program terminating unexpectedly.


    Now that you know how to create arrays let’s take a look at creating functions!


    ## Chapter Eight– Functions


    Functions are a great way of writing out complex programs without needing to repeat
    code. For example, let’s say you have a complicated part of code that gets some
    input from the user and parses it. Now let’s say you need to run the code several
    times, but not in a loop. Up until this point, you’d have to write it out every
    time.


    ![images(3)](images/00032.jpeg)


    With modern copying and pasting, it’s not that big of a deal, but it’ll look horrible
    and having repeated code can be a problem when you go to fix any errors. To remedy
    this problem, you can create functions, which are pieces of code that you’re able
    to call repeatedly without needing to write it out every time.


    Actually, you’ve already used a function. `main` is a function. So let’s take
    a look at it to see how it works.


    ![](images/00033.jpeg)


    Let’s examine the first line, the one that has the word `main` in it. This begins
    the definition of the function that will take no parameters, known as `main`,
    and will give back a value of type `int`. You already known what an `int` is,
    a type of variable, but what does return a value mean?


    A function in C++ is like a function in math, you insert a number and some operation
    is performed on it, and you get an answer. Here, the `int` is the variable that
    the output function is going to be. A parameter is the variable that is put into
    the function, and then the function performs an operation before it returns the
    results.


    Let’s take a look at a function that has a `main`.


    ![](images/00034.jpeg)


    The parameters are written like a variable definition and is separated by a comma.
    They are written right after the function name and are closed in by parenthesis.
    Now there is an integer value known as `argc` and an array of characters known
    as `argv` as the parameter. You can use any type of variable you want as a function
    parameter, as long as when you use that function you provide a variable that’s
    of the same type.


    Now that you know what a function is and does let’s take a look at pointers.


    ## Chapter Nine– Pointers


    RAM or random access memory is where the computer saves all the variables the
    program uses, and is basically a long line of numbers. Every number is identified
    by the address or where it is on that line. These are logical, so the number with
    the address four comes after the three but before the five.


    The exact size of the number at that address is figured out by the computer architecture.
    Say you have two integers and a character. One might have an address of 1000 while
    the other has an address of 1004. The character or `char` might have an address
    of 1008. So why is there a four byte gap between the variables? Integers are four
    bytes long, and so they take up four addresses in order to store their value.
    It doesn’t matter if you use one byte and don’t use the other three, it will still
    take up four bytes of memory.


    ![images(4)](images/00035.jpeg)


    But why do you need to know this? C++ programmers need to know that their compiler
    does not have fancy addressing for them, translating their variables into addresses
    in RAM, but sometimes it’s good to know the translations on our own. Think about
    how the arrays work for a moment, they are just long lines of variables whose
    type is what the programmer tells the compiler.


    So you might be thinking this is just like RAM and you’d be right. When you labeled
    the arrays and the fifth value was actually the number six because all arrays
    start at zero, you’re actually taking the fifth variable after the first variable.
    So if you say the array is an integer one, with the first integer coming from
    RAM address 1000, then combine that will what you know about integers being in
    four bytes, you can see that the nth integer in the array would have this address:


    ![](images/00036.jpeg)


    Therefore, the address of the sixth element is 1020. So why is this useful? You
    can make the array while the program is compiling and running and make it the
    proper size.


    A pointer is a normal variable, but instead of storing the integer, it stores
    the address of another variable. Here is a pointer.


    ![](images/00037.jpeg)


    In this pointer, you have a variable that stores the address of the integer. The
    `*` is the variable as a pointer and not a normal variable. You’ve assigned it
    to the value of zero. When you assign values to pointers, you’re not giving them
    numbers or characters, you’re giving them the address of another variable.

