    # 引言


    C++ 是一种新兴的编程语言，基于对象和编译。如果你从未编程过，可能会对“对象”和“编译”这两个词感到困惑。


    使用编译的程序由计算机的 CPU 直接读取，而不是通过计算机上安装的程序来解释运行。因此，这种程序更直接地与计算机的处理系统对话，而非与某个程序交互。


    你可能已经知道，计算机无法直接读取字母，只能读取二进制代码，因此代码必须被翻译成计算机可读的形式。这个过程称为编译。而面向对象的代码只是代码的组织方式。在接下来的章节中，你会更好地理解这一点。


    那么这一切意味着什么，为什么你需要了解它？作为使用 C++ 的程序员，你需要的不仅仅是普通的文本编辑器。只有少数几种编程语言仅靠文本编辑器就能工作，而且它们其实算不上真正的编程语言。你需要的东西之一就是编译器。


    另一个你需要的是集成开发环境，简称 IDE。这是一个面向程序员的文本编辑器，具有语法高亮功能，并且集成了编译器。对于 Windows 和 Linux，你可以使用几种不同的选择。


    你并不一定需要 IDE，因为基本的文本编辑器也能用，但像记事本这样的工具会让事情变得困难一些。文字处理软件也不是好选择，因为它们有拼写和语法自动更正功能，如果不小心，可能会破坏你的代码。


    开始学习 C++ 时，你应该知道它有严格的语法。这意味着代码是区分大小写的，所以输入 `Hello` 和输入 `hello` 是不同的。此外，你应该知道这种编程语言对空白字符不太敏感，所以不用担心。


    以上就是你刚开始学习 C++ 时需要了解的内容。让我们开始编写一些实际的代码吧！


    ## 第一章 – 你的第一个程序


    ![ANd9GcSiYFVzWNtEsPfcM_CSykJhn4tkkH-GCJ4xX-yvN9K3b23DtDU2aQ](img/00010.jpeg)由于这是一篇关于如何开始学习
    C++ 的简短教程，我们将在第一章就让你开始编写一个程序。你的第一个程序会非常简单。你只需要在屏幕上写出一句话，但这并不像在 Word 文档中写出来那么简单。首先，让我们看看代码，然后进一步解释它的含义。


    ![](img/00011.jpeg)


    这一行告诉编译器，它需要将 `isostream` 库链接到程序。库是一个存储代码片段（称为函数）的仓库。库还存储其他东西，比如变量和有时是运算符。


    `isostream` 库包含的代码允许你将字符发送到文本流中，然后这些字符被输出到屏幕上。可以把它想象成一条河流。你是河流的源头，屏幕是大海。从源头放入河流的任何东西都会流向屏幕。


    下一行（第二行）让编译器知道你想要使用名为 `std` 的命名空间，这是一个标准命名空间。命名空间是代码存储的区域。如果你有两段同名的代码，这会很有用。通常，代码片段不能共享相同的名称，但如果其中一个位于与另一个不同的命名空间中，那么它们就可以同名。


    第三行代码是代码的开始。顾名思义，它是 `main` 块。花括号 {} 内的所有内容都将被编译器翻译。每个程序都需要这一行，因为没有它，什么都不会发生。


    现在到了打印短语 `Hello World!` 的部分。为此，你需要使用存储在 `isostream` 库中的代码。这部分代码被称为语句或 `cout`，它将信息发送到流中。`cout`
    后面的 `<<` 是一个运算符，表示“输出”，因此与 `cout` 一起，它翻译为“输出这个流”。


    接下来的流是 `Hello, World!`，被称为字符串。字符串是字符序列，通过用双引号括起来表示。它以分号结束，表示语句的结束。如果不使用分号，程序将无法编译。


    ![`potofcode.com/wp-content/uploads/2015/03/helloworld.gif`](img/00012.jpeg)


    最后一行（不是右花括号）非常简单但非常重要。它放在 `main` 的末尾，告诉计算机 `main` 块已经完成。它将返回值 0 给 CPU。非零值会产生错误，因此这一行是必需的。


    现在你已经有了程序的源代码，你需要编译它。如果程序运行后立即关闭，请尝试从 `cmd`/终端提示符运行它。


    现在你已经知道如何创建第一个程序以及它是什么样子，让我们来看看变量！


    ## 第二章 – 变量


    在上一章中，我们提到了变量，并说会在后面讨论。现在是时候讨论它们了。变量是存储值的东西。想象每个变量都是一个盒子，每个盒子都标有名称和类别。


    ![`img.c4learn.com/2012/02/Variable-in-Java.jpg`](img/00013.jpeg)


    类别表示它存储的是哪种类型的物品，名称则是该特定变量的称呼。盒子可以存储很多东西，但前提是东西能放进盒子里。变量也是如此。它们都有类型、名称和大小，这些决定了它们能存储什么以及不能存储什么。


    例如，一种变量类型是整数。如果你了解基础数学，就知道整数是零、正整数和负整数。所以 -5、4、0 和 -378 都是整数。此外，整数变量有固定的大小。


    它们只能容纳两个数之间的一个数。这些范围因变量而异，这里暂不讨论，但默认整数的范围是 -2³¹ = -2,147,483,648 到 2³¹–1 = 2,147,483,647。你可能暂时不需要更大的数字，所以其余内容留到以后再说。


    下面是一个表格，展示了你可以使用的不同变量类型。


    ![](img/00014.jpeg)


    有几种不同的变量类型。你在编程时可能会用到它们全部，但目前你只需要使用其中几种。


    ### 使用变量


    看看下面的程序：


    ![](img/00015.jpeg)


    这个程序的大部分内容看起来都很熟悉，除了第四行和第六行。第一个不熟悉的部分是声明变量。这告诉编译器你将使用一个变量。在声明中，变量类型放在前面。在示例中，使用的是
    `int` 类型。接下来是变量的名称，这里称为 `var`。


