    # Introduction


    C++ is an up and coming programming language that’s based on objects and compiling.
    If you’re someone who’s never programmed before, you might be confused by the
    words object and compiling.


    A program that utilized compiling is read by the computer’s CPU rather than by
    being interpreted by a program installed on the computer to run that program.
    Therefore, the program speaks more to the computer’s processing system rather
    than a program.


    You may already know this, but computers are not able to read letters and have
    to read binary code, so the code has to be translated into a computer readable
    one. This process is known as compiling. Now, object-oriented code is just how
    the code is structured. You’ll understand that tidbit a little better in the following
    chapters.


    So what does that all mean and why do you need to know it? As a programmer using
    C++, you’re going to need more than just the average text editor. There only a
    few programming languages where that’s all you’ll need, and they’re not really
    programming languages. One of the things you are going to need is a compiler.


    Another thing you’re going to want is an Integrated Development Environment, also
    known as an IDE. This is a programmer-oriented text editor that has a syntax highlighting
    and is compiler integrated. For Windows and Linux, you can use a few different
    options.


    You don’t really need an IDE because a basic text editor will do, but something
    like Notepad is going to make things a little more difficult. Word processors
    are also a bad choice because they have autocorrect with spelling and grammar,
    which will mess up your code if you’re not careful.


    To begin with C++, you should understand that it has a rigid syntax. This means
    the code is case sensitive, so typing `Hello` is going to be different than typing
    `hello`. In addition, you should know that the programming language doesn’t care
    much about white space, so don’t worry about it.


    So that’s about all you need to know about C++ when you first begin. Let’s get
    into some actual coding to get you started!


    ## Chapter One – Your First Program


    ![ANd9GcSiYFVzWNtEsPfcM_CSykJhn4tkkH-GCJ4xX-yvN9K3b23DtDU2aQ](images/00010.jpeg)Due
    to this being a short tutorial on how to get started with C++, we’re going to
    start you out with a program in the first chapter. Your first program is going
    to be very simple. All you’re going to do is write a single phrase on the screen,
    but it’s not as simple as writing it in a Word document. First, let’s take a look
    at the code and then we’ll go further into what it means.


    ![](images/00011.jpeg)


    The line is going to tell the compiler it has to link to the `isostream` library
    to the program. A library is a repository where snippets of code are stored, known
    as functions. The library also stores other things, like variables and sometimes
    operators.


    The `isostream` library has code that will let you send characters into the text
    stream, which is then fed onto the screen. Think of it like a river. You’re the
    river’s source and the screen is the sea. Whatever is put into the river from
    the source is going to go onto the screen.


    The following line, line two, lets the compiler known that you want to use the
    namespace known as `std`, which is a standard namespace. Namespaces are an area
    where the code is stored. This is useful if you have two pieces of code that have
    the same name. Normally, pieces of code are not able to share the same name, but
    if one of is in a separate namespace than the other, then they can have the same
    name.


    The third line of code is the beginning of the code. It’s the `main` block, as
    the name implies. Everything inside the braces {} will be translated by the compiler.
    You’ll need that line in every program because nothing will happen without it.


    Now comes the printing of the phrase, `Hello World!` To do this, you use code
    that’s stored inside the `isostream` library. This part of the code is known as
    the statement or `cout`, which sends information to the stream. The `<<` that
    comes after the `cout` is an operator. This means ‘output’, so with the `cout`
    it all translates to ‘output this stream’.


    The following stream is `Hello, World!` and is known as a string. Strings are
    a sequence of characters and are shown by enclosing them in double quotation marks.
    This ends with a semi-colon and signifies the end of the statement. If the semicolon
    is not used, then the program is not going to compile.


    ![https://potofcode.com/wp-content/uploads/2015/03/helloworld.gif](images/00012.jpeg)


    The last line, not the closing brace, is very simple but also very important.
    It’s placed at the end of `main` and tells the computer that the `main` block
    has been finished. It will return a value of 0 to the CPU. A non-zero value will
    create an error, so it’s a necessary line.


    Now that you have the source code of the program, you have to compile i. If the
    program closes once you run it, then try running it from the `cmd`/terminal prompt
    instead.


    Now that you know how to create your first program and what it looks like let’s
    take a look at variables!


    ## Chapter Two – Variables


    In the last chapter, variables were mentioned and it was said that they would
    be discussed. Now is the time to discuss them. A variable is something that stores
    a value. Imagine that every variable is a box and every box is labeled with a
    name and category.


    ![http://img.c4learn.com/2012/02/Variable-in-Java.jpg](images/00013.jpeg)


    The category is what type of item it’s storing and its name is the specific variable
    it’s called. Boxes are able to store many things, but only if that thing fits
    inside the box. This is the same with variables. They all have a type, name, and
    size that govern what they are and are not able to store.


    For example, one type of variable is the integer. If you know basic mathematics,
    then you know that integers are zero, whole numbers, and their negative counterparts.
    So -5, 4, 0 and -378 are all integers. In addition, integer variables will have
    a fixed size.


    They are only able to hold one number between two others. These are specific to
    the variable and will not be discussed quite yet, but a default integers range
    is between -231 = -2, 147, 483, 648 and 231– 1 = 2, 147, 483, 647\. You probably
    won’t need numbers larger than that yet, so we’ll save the rest for another time.


    Here’s a table to see the different types of variables you can use.


    ![](images/00014.jpeg)


    There are a few different variable types. You’ll probably use them all when you
    program, but for now you’re only going to use a few.


    ### Using Variables


    Take a look at the following program:


    ![](images/00015.jpeg)


    Most of this program is going to look familiar, except for the fourth and sixth
    lines. The first unfamiliar part declares the variable. This is telling the compiler
    that you’re going to use a variable. In declarations, the variable type is going
    to come first. In the example, it''s using the `int` type. Next is the variable’s
    name, which would be known as `var`.

