    现在你已经了解了它们是什么，接下来让我们进入下一章，学习动态内存。


    ## 第十章 - 动态内存


    到目前为止，你可以在编译时创建变量并在运行时修改它们；然而，当你使用动态内存分配时，也可以在运行时创建它们。这种方法在程序运行过程中分配和释放 RAM。由于你正在访问
    RAM，很自然地会认为你将使用指针来完成，但 C++ 中的动态内存使用方式与 C 语言不同。


    请看下面的代码块。


    ![](img/00038.jpeg)


    这里你创建了一个指向 int 的指针，并为它分配了一些内存。由于 `i` 仍然是指针，而不是变量，你必须将 `i` 所指向的值设置为五，而不是设置 `i`
    本身。这改变了 `i` 所指向的位置，并使之前分配的内存成为孤儿，留在 RAM 的某个地方。这种被遗忘的内存被称为内存泄漏。要阻止这种情况，请确保使用 `delete`
    运算符释放最初分配的内存。


    ![images(5)](img/00039.jpeg)


    不过，只为单个变量分配内存并没有太大帮助。如果你知道变量会存在，那么你可以正常声明它。而动态内存的作用是创建在编译时未知大小的可变长度数组。你实际上怎么可能知道它的大小呢？你不能创建一个指针数组，然后按需访问它们，那只是创建一个巨大的数组并希望一切顺利的更消耗
    RAM 的版本。


    现在你已经了解了什么是动态内存以及如何使用它，接下来让我们在下一章中看看类和对象。


    ## 第十一章 - 类和对象


    这实际上是 C++ 被创造出来的目的——支持类和对象。没有它们，C++ 就只是 C 语言。但之前提到的类和对象是什么呢？类就像一种模具，而对象是从模具中产生的东西。这些模具很灵活，可以用来制作你想要的任何类型的对象。模具可以是通用的，也可以是特定的。


    ![images(5)](img/00040.jpeg)


    假设你想制造一辆交通工具。这将是一个抽象的教程，因为代码实际上不会执行任何操作。想想一辆汽车需要哪些属性。它们需要速度、价格、颜色、制造商和型号。它是否是四轮驱动？你能用它做什么？你能启动引擎并停止吗？


    让我们看看汽车类的定义。


    ![](img/00041.jpeg) ![](img/00042.jpeg)


    ![](img/00043.jpeg)


    正如你所看到的，类的定义方式与结构体非常相似，这很合理，因为它们都是对数据进行分组的方式。但这个类包含了一些结构体无法包含的东西——函数。


    ## 结论


    到现在为止，你已经知道如何创建你的第一个简单程序，甚至更多！你了解了什么是变量，如何扩展你的程序，如何使用运算符、条件、循环、数组、函数、指针、动态内存以及类和对象，将你的程序塑造成杰作！你看，C++
    并没有你曾经想象的那么难。


    下一步是收集你从本书中学到的知识，继续阅读更多关于 C++ 编程精彩世界的内容。当你感到得心应手时，设置一个虚拟机来进行编码，然后开始吧！你将学到一项在当今计算机行业非常有价值的技能。


    感谢你的阅读。希望你喜欢这本书。我恳请你留下真诚的反馈。

    '
