    循环会先执行一段代码，然后再检查条件是否为真。由于这个特性，无论你将 `userInput` 初始化为任何值，花括号之间的代码都一定会被执行。


    第三种循环是 for 循环。这是三种循环中最复杂的一种，但一旦你理解了它，就会非常强大。现在，我们先来了解它的用途。看看这个 for 循环：


