    # Nesting Subexpressions


    Analysis

    nThe pattern obviously worked, but it does require explanation. What makes this
    pattern work is a series of nested subexpressions. We''ll start with {{25[0-5]}
    | (2[0-4]\d) | \d{1,2})}, a set of four nested subexpressions, and we''ll look
    at them in reverse order. \d{1,2}) matches any two-digit number or up to 99. \d{1,2})
    matches any three-digit number starting with 1 (followed by any two digits), or
    numbers 100 through 199. \2[0-4]\d) matches numbers 200 through 249. (25[0-5])
    matches numbers 250 through 255. Each of these subexpressions is enclosed within
    another subexpression with | (so that one of the four subexpressions has to match,
    not all). After the range of numbers comes , to match ., and then the entire (all
    the number options \.) is enclosed into another subexpression and repeated three
    times using (3). Finally, the range of numbers is repeated (this time without
    the trailing .) to match the final IP address number. By restricting each of the
    numbers between 0 and 255, this pattern can match valid IP addresses and reject
    invalid addresses.

    It is worth noting that the more logical order for these expressions (the way
    I explained above) would not have worked. Consider the following:


    # Text


    ```

    Pinging hog.forta.com [12.159.46.200]

    with 32 bytes of data:

    ```


    # RegEx


    ```

    (\d{1,2}) |(\d{1,2}) | (2[0-4]\d) | (25[0-5])\.) {3}

    ➥(\d{1,2}) |(\d{1,2}) | (2[0-4]\d) | (25[0-5]))

    ```


    # Result


    ```

    Pinging hog.forta.com [12.159.46.200]

    with 32 bytes of data:

    ```


    # Analysis


    Notice that this time the final 0 wasn''t matched. Why is this? Because patterns
    are evaluated from left to right, and when there are four expressions, any of
    which can match, the first is tested first, the second, and so on. As soon as
    any pattern matches, the other options aren''t tested. In this example \d{1,2})
    matches 20 in 200, so the other options (including the final, 25[0-5]), which
    is what was needed here were never evaluated.


    # Tip


    Regular expressions like this can look overwhelming. The key to understanding
    them is to dissect them, analyzing and understanding one subexpression at a time.
    Start from the inside and work outward trying to read character by character from
    the beginning.

    It is a lot less complex than it looks.'
