    # Lesson 8 Using Backreferences


    Following is a simple example, converting the text within an <h1> tag pair to
    uppercase:


    # Text


    ```

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>RegEx</h2>

    Information about Regular Expressions.

    <h3>This is not valid HTML</h3>

    </body>

    ```


    # RegEx


    ```

    <([Hh]1>)(.*?)(\//[Hh]1>)

    ```


    # Replace


    ```

    $1$U2$E3

    ```


    # Result


    ```

    <body>

    <h1>WELCOME TO MY HOMEPAGE</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>RegEx</h2>

    Information about Regular Expressions.

    <h3>This is not valid HTML</h3>

    </body>

    ```


    # Analysis


    The pattern ([Hh]1>)(.*?)(\//[Hh]1>) breaks the header into three subexpressions:
    the opening tag, the text, and the closing tag. The second pattern then puts the
    text back together: $1 contains the start tag, \U2$ converts the second subexpression
    (header text) to uppercase, and $3 contains the end tag.


    # Summary


    Subexpressions are used to define defined sets of characters or expressions. In
    addition to being used for repeating matches (as seen in the previous lesson),
    subexpressions can be referred to within patterns. This type of reference is called
    a backreference and (unfortunately, there are implementation differences in backreference
    syntax). Backreferences are useful in text matching and in replace operations.'
