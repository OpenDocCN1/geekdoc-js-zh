    # Matching Special Characters


    A has a special meaning in regex. If you need a . in your pattern, you need a
    way to tell regex that you want the actual character and not the regex meaning
    of the . character. To do this, you escape the . by preceding it with a \ (backslash).
    \ is a metacharacter (a fancy way of saying a character with a special meaning,
    in contrast to the character itself). Therefore, . matches any character, and
    \. means the character itself.


