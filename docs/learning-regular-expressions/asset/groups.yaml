    # Preventing Over Matching


    ? matches are limited in scope (zero or one matches only), and are interval matches
    when using exact amounts or ranges. But the other forms of repetition described
    in this lesson can match an unlimited number of matches—sometimes too.


    All the examples thus far were carefully chosen so not to run into over matching,
    but consider this next example. The text that follows is of a Web page and contains
    text with embedded HTML <b> tags. The regular expression needs to match any text
    within <b> tags (perhaps so as to be able to replace the formatting). Here''s
    the example:


    # Text


    This offer is not available to customers living in <<b>AK</b> and <<b>HI</b>.


    # RegEx


    ```

    < [Bb] >.*<\/ [Bb] >

    ```


    # Result


    This offer is not available to customers living in <<b>AK</b> and <<b>HI</b>.


    # Analysis


    < [Bb] > matches the <b> tag (in either uppercase or lowercase), and < / [Bb]
    matches the closing </Bb> tag (in either uppercase or lowercase). But instead
    of two matches, only one was found; * matched after the first <b> until the last
    <b> so that the text AK</b> and <b>HI was matched. This includes the text we wanted,
    but also other instances of the tags as well.


    The reason for this is that metacharacters like * and + are greedy; that is, they
    look for the greatest possible to the smallest. It is almost as if the matching
    starts from the end of the text, working backward until the next match is found,
    in contrast to starting from the beginning. This is deliberate and by design,
    quantifiers are greedy.


    But if you don''t want greedy matching? The solution is to use lazy versions of
    these quantifiers (they are referred to as being lazy because they match the fewest
    characters instead of the most). Lazy quantifiers are defined by appending a ?
    to the quantifier being used, and each of the greedy quantifiers have a lazy equivalent
    as listed in Table 5.1.'
  - '[PAGE 59]


    # Table 5.1 Greedy and Lazy Quantifiers


    | Greedy | Lazy |

    | --- | --- |

    | * | *? |

    | + | +? |

    | {n, } | {n,} |


    *? is the lazy version of *, let''s revisit our example, this time using *?:


    # Text


    This offer is not available to customers

    living in <b>AK</b> and <b>HI</b>**


    # RegEx


    ```

    <[Bb].*\<[Bb]>

    ```


    # Result


    This offer is not available to customers

    living in <b>AK</b> and <b>HI</b>**


    # Analysis


    That worked. By using the *? only <b>AK</b>, matched in the first match, allowing
    <b>HI</b> to be matched independently.


    > Most of the examples in this book use greedy quantifiers so as to keep patterns
    as simple as possible. However, feel free to replace these with lazy quantifiers
    when needed.


    # Summary


    The real power of regular expression patterns becomes apparent when working with
    repeating matches. This lesson introduced + (match one or more), * (match zero
    or more), and ? (match zero or one) as ways to perform repeating matches. For
    greater control, intervals may be used to specify the exact number of repetitions
    as well as minimums and maximums. Quantifiers are greedy and may over match; to
    prevent this from occurring, use lazy quantifiers.'
