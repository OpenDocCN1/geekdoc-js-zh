    # Caution


    Backreferences will work only if the expression to be referred to is a subexpression
    (and enclosed such).


    # Tip


    Matches are usually referred to starting with 1. In many implementations, match
    0 can be used to refer to the entire expression.


    # Note


    As you have seen, subexpressions are referred to by their relative positions:
    \1 for first, \5 for fifth, and so on. Although commonly supported, syntax does
    have one limitation: moving or editing subexpressions (and thus altering the subexpression
    order) could break your pattern, and adding or deleting subexpressions can be
    even more problematic.


    To address this shortcoming, some newer regular expression implementations support
    named capture, a feature where each subexpression is given a unique name that
    may be used to refer to the subexpression (instead of the relative position).
    Named capture is not covered in this book because it is still not widely supported,
    and the syntax varies significantly between those implementations that do it.
    However, if your implementation supports the use of named capture (.NET, for example),
    you should definitely take advantage of the functionality.'
