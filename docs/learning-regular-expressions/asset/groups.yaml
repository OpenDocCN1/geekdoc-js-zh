- md: '

    Let''s look at another example using the same text. This time you need to find
    all files for North America (na) or South America (sa) regardless of what digit
    comes next:


    ## Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacl.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ## RegEx


    ```

    .a.

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacl.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ## Analysis


    The regex .a. did indeed find nal, na2, and sal1, but it also found four other
    matches that it was not supposed to. Why? Because the pattern matches any three
    characters so long as the middle one is a.


    What is needed is a pattern that matches .a. followed by a period. Here is another
    try:


    ## Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacl.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ## RegEx


    ```

    .a..

    ```


    ## Result


    | sales1.xls |

    | orders3.xls |

    | sales2.xls |

    | sales3.xls |

    | apacl.xls |

    | europe2.xls |

    | na1.xls |

    | na2.xls |

    | sal1.xls |


    ## Analysis


    .a.. does not work any better than .a. did; appending .a.. will match any additional
    character (regardless of what it is). How can you search for . when . is a special
    character that matches any character?


    ## Matching Special Characters


    . has a special meaning in regex. If you need a . in your pattern, you need a
    way to tell regex that you want the actual character and not the regex meaning
    of the . character. To do this, you escape the . by preceding it with a \ (backslash).
    \ is a metacharacter (a fancy way of saying a character with a special meaning,
    in contrast to the character itself). Therefore, . matches any character, and
    \. means the character itself.


    Let''s try the previous example again, this time escaping the . with \:


    ## Text


    | sales1.xls |

    | orders3.xls |

    | sales2.xls |

    | sales3.xls |

    | apacl.xls |

    | europe2.xls |

    | na1.xls |

    | na2.xls |

    | sal1.xls |


    ## RegEx


    ```

    .a\.

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    a2.xls

    sal1.xls

    ```


    ## Analysis


    .a\. did the trick. The first . matched n (in the first matches) or s (in the
    third). The second . matched 1 (in the first and third matches) or 2 (in the second).
    \. then matched the separating the filename from the extension.


    The example could be further improved by including the xls in the pattern so as
    to prevent a filename such as sa3.doc from being matched, like this:


    ## Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    a2.xls

    sal1.xls

    ```


    ## RegEx


    ```

    .a\.xls

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    a2.xls

    sal1.xls

    ```


    In regular expressions, \ is always used to mark the beginning of a block of one
    or more characters that have a special meaning. You saw \., and here, you''ll
    see many more examples of using \ in future lessons.


    > Note

    The use of special characters is covered in Lesson 4, "Using Metacharacters."


    > Note

    In case you were wondering, to escape \ (so as to search for a backslash) use
    \\ (two backslashes).


    > Tip

    - . matches all characters, right? Well, maybe not. In most regular expression
    implementations,

    - . matches every character except a newline character.


    ## Summary


    Regular expressions, also called patterns, are strings made up of characters.
    These characters may be literal (actual text) or metacharacters (special characters
    with special meanings), and in this lesson you learned how to match a single character
    using both literal text and metacharacters. . matches any character. \ is used
    to escape characters and to start special character sequences.


    ## Lesson 3

    ### Matching Sets of Characters


    In this lesson you''ll learn how to work with sets of characters. Unlike the .,
    which matches any single character (as you learned in the previous lesson), sets
    enable you to match specific characters and character ranges.


    ## Matching One of Several Characters


    As you learned in the previous lesson, . matches any one character (as does any
    literal character). In the final example in that lesson, .a was used to match
    both na and sa, . matched both the n and s. But what if there was a file (containing
    Canadian sales data) named cal.xls as well, and you still wanted to match only
    na and sa? .a. would also match c, and so that filename would also be matched.


    ## Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    apac1.xls

    europe2.xls

    a1.xls

    a2.xls

    sal1.xls

    cal.xls

    ```


    ## RegEx


    ```

    .a\.xls

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pac2.xls

    europe2.xls

    ```


    To find n or s you would not want to match any character, you would want to match
    just those two characters. In regular expressions a set of characters is defined
    using the metacharacters [ and ]. ] define a character set, everything between
    them is part of the set, and any one of the set must match (but not all).


    Here is a revised version of that example from the previous lesson:


    ## Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pac2.xls

    europe2.xls

    al1.xls

    nal2.xls

    sal1.xls

    cal1.xls

    ```


    ## RegEx


    ```

    [ns]a\.xls

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pac2.xls

    europe2.xls

    al1.xls

    nal2.xls

    sal1.xls

    cal1.xls

    ```


    ## Analysis


    The regular expression used here starts with [ns]; this matches either n or s
    (but not c or any other character). The opening [ and ] do not match any characters—they
    define the set. The literal a matches any character, \ matches the ., and the
    literal xls matches. When you use this pattern, only the three desired filenames
    are matched.


    > Actually, [ns]a\.xls is not quite right. If a file named usal.xls existed, it
    would match, (the opening u would be ignored and sal.xls would match). The solution
    to this problem involves position matching, which will be covered in Lesson 6,
    "Position Matching"


    As you can see, testing regular expressions can be tricky. Verifying that a pattern
    matches what you want is pretty easy. The real challenge is in verifying that
    you are not getting matches that you don''t.


    Character sets are frequently used to make searches (or specific parts thereof)
    not case sensitive.


    For example:


    ## Text


    The phrase "regular expression" is often abbreviated as RegEx or regex.


    ## RegEx


    [Rr]eg[Ee]x


    ## Result


    The phrase "regular expression" is often abbreviated as RegEx or regex.


    ## Analysis


    The pattern used contains two character sets: [Rr] matches R and r, and [Ee] matches
    E and e. This way, RegEx and regex are both matched. REGEX, however, would not
    match.


    > Tip

    If you are using matching that is not case sensitive, this technique would be
    unnecessary. This type of matching is used only when performing case-sensitive
    searches that are partially case sensitive.


    ## Using Character Set Ranges


    Let''s take a look at the file list again. The last used pattern, [ns]a\.xls,
    has another problem. If a file was named sam.xls? It, too, would be matched because
    the . matches all characters, not just digits.


    Character sets can solve this problem as:


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pac1.xls

    europe2.xls

    sam.xls

    al1.xls

    na2.xls

    sal1.xls

    cal1.xls

    ```


    ## RegEx


    ```

    [ns]a[0123456789]\xls

    ```


    ## Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pac1.xls

    europe2.xls

    sam.xls

    al1.xls

    na2.xls

    sal1.xls

    cal1.xls

    ```


    ## Analysis


    In this example, the pattern has been modified so that the first character would
    have to be n or s, the second character would have to be a, and the third could
    be any digit (specified as [0123456789]). Notice that file sam.xls was not matched,
    because m did not match the list of allowed characters (the 10 digits).

