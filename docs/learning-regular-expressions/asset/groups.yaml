    Using a regular expression in this example is somewhat unnecessary—a simple text
    match would have sufficed and have been easier. But imagine if you wanted to match
    not myArray[0] but also myArray[1], myArray[2], and so on. Then using a regular
    expression would make a lot of sense. You would escape [ ] and specify the characters
    to match between them. If you wanted to match array elements 0 through 9, you
    might use a regular expression like the following:


    ```

    myArray[[0-9]]

    ```


    # Tip


    Any metacharacter, not just the ones mentioned here, can be escaped by preceding
    it with a backslash.


    # Caution


    Metacharacters that are part of a pair (such as { }) must be escaped if not used
    as a metacharacter, or else the regular expression parser may throw an error.


    \ is used to escape metacharacters. This means that \ is itself a metacharacter;
    it is used to escape other characters. As noted in Lesson 2, to refer to \, you
    would need to escape the reference as \\.


    Take a look at the following simple example. The text is a file path using backslashes
    (used in Windows). Now imagine that you need to use this path on Linux, and as
    such, you need to locate all backslashes to change them to slashes:


    # Text


    ```

    \home\ben\sales\

    ```


    # RegEx


    ```

    \\

    ```


    # Result


    ```

    \home\\ben\sales\\

    ```


    # Analysis


    \\ matches \, and four matches are found. Had you just specified \ as the regular
    expression, you would likely have generated an error (because the regular expression
    parser would fully assume that your expression was incomplete; after all, \ is
    always followed by another character in a regular expression).'
- md: "\n## Matching Whitespace Characters\n\nMetacharacters generally fall into two\
    \ categories: those used to match text (such as .) and those used as part of regular\
    \ expression syntax (such as { and }). You'll be discovering many metacharacters\
    \ of both types, starting with the whitespace metacharacters.\n\nWhen you are\
    \ performing regular expression searches, you'll often need to match non-printing\
    \ whitespace characters embedded in your text. For example, you may need to find\
    \ all tab characters, or you may need to find line breaks. Because typing this\
    \ character into your regular expressions directly would be very tricky (to say\
    \ the least), you can use the special metacharacters listed in Table 4.1.\n\n\
    ## Table 4.1 Whitespace Metacharacters\n\n| Metacharacter | Description |\n|---\
    \ | --- |\n| \\b | Backspace |\n| \\f | Form feed |\n| \\n | Line feed |\n| \\\
    r | Carriage return |\n| \\t | Tab |\n| \\v | Vertical tab |\n\nLet's look at\
    \ an example. The following block of text contains a series of records in comma-delimited\
    \ format (often called CSV). Before processing the records, you need to remove\
    \ any blank lines in the data. This example follows:\n\n### Text\n\n```\n\"101\"\
    ,\"Ben\",\"Forta\"\n\"102\",\"Jim\",\"James\"\n\n\"103\",\"Roberta\",\"Robertson\"\
    \n\"104\",\"Bob\",\"Bobson\"\n```\n\n### RegEx\n\n```\n\\r\\n\\r\\n\n```\n\n###\
    \ Result\n\n```\n\"101\",\"Ben\",\"Forta\"\n\"102\",\"Jim\",\"James\"\n\n\"103\"\
    ,\"Roberta\",\"Robertson\"\n\"104\",\"Bob\",\"Bobson\"\n```\n\n## Analysis\n\n\
    \\r\\n matches a carriage return line combination, used by (Windows) as an end-of-line\
    \ marker. Searching for \\r\\n\\r therefore matches two end-of-line markers, and\
    \ thus the blank line in two records.\n\n## Tip\n\nI just stated that \\r\\n is\
    \ used by Windows as an end-of-line marker. However, Unix (Linux) as well as Mac\
    \ OSX systems use just the linefeed character. On those systems, you'll probably\
    \ just want to use \\n (and not the \\). The ideal regular expression should probably\
    \ accommodate both—an optional \\n and a required \\n. You'll revisit this example\
    \ in the next lesson.\n\nYou'll likely find uses for \\r and \\n as well as \\\
    t (tab). The other whitespace characters tend to be used infrequently.\n\n## Note\n\
    \nYou've seen a variation of the metacharacter. The . and [ are metacharacters\
    \ unless they are escaped. \\f and \\n, for example, metacharacters only when\
    \ they are escaped. Left unescaped, they are literal characters that match only\
    \ themselves.\n\n## Matching Specific Character Types\n\nThus far, you have seen\
    \ how to match specific characters, any characters (using .), and one of a set\
    \ of characters (using []), and how to negate matches (using ^). Sets of characters\
    \ (matching one of a set) is the most common form of matching, and special metacharacters\
    \ can be used in lieu of commonly used sets. These metacharacters are said to\
    \ match classes of characters. Class metacharacters are never actually needed\
    \ (you can always enumerate the characters to match or use ranges), but you will\
    \ undoubtedly find them to be incredibly useful.\n\n## Note\n\nThe classes listed\
    \ here are the basics supported in almost all regular expression implementations.\n\
    \n## Matching Digits and Nonidigits\n\nAs you learned in Lesson 3, [0-9] is a\
    \ shortcut for [0123456789] and is used to match any digit. To match anything\
    \ other than a digit, the set can be negated as [^0-9]. Table 4.2 lists class\
    \ shortcuts for digits and nonidigits.\n\n## Lesson 4 Using Metacharacters\n\n\
    ## Table 4.2 Digit Metacharacters\n\n| Metacharacter | Description |\n|---|---|\n\
    | \\d | Any digit (same as [0-9]) |\n| \\D | Any nondigit (same as [^0-9]) |\n\
    \nTo demonstrate the use of these metacharacters, let's revisit a prior example:\n\
    \n### Text\n\n```\nvar myArray = new Array();\n\nif (myArray[0] == 0) {\n\n}\n\
    ```\n\n### RegEx\n\n```\nmyArray\\\\d\\\n```\n\n### Result\n\n```\nvar myArray\
    \ = new Array();\n\nif (myArray[0] == 0) {\n\n}\n```\n\n### Analysis\n\n[\\d matches\
    \ any single digit, and \\d matches, so that myArray\\[d] matches myArray[0].myArray\\\
    [d] is shorthand for myArray\\[0-9], which is shorthand for myArray\\[0123456789].\
    \ This regular expression would also have matched myArray[1], myArray[2], and\
    \ so on (but not myArray[10]).\n\n## Tip\n\nAs you can see, there are always multiple\
    \ ways to define any regular expression. Free to pick the syntax that you are\
    \ comfortable with.\n\n## Caution\n\nRegular expression syntax is case sensitive.\
    \ \\d matches digits. \\D is the exact opposite of \\d; it only matches nondigits.\
    \ The same is true of the class metacharacters you'll see next. This is true even\
    \ when performing non-case-sensitive matching, in which the text matched will\
    \ not be case sensitive, but special characters (such as \\d) will be.\n\n## Matching\
    \ Alphanumeric Characters (and Nonalphanumeric Characters)\n\nAnother frequently\
    \ used set are all the alphanumeric characters, A through z (in uppercase and\
