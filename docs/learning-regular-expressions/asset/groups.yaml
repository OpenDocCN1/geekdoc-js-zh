    # Analysis


    Without word boundaries, the 0 in \30 was also matched. Why? Because there is
    $ in front of it. Enclosing the entire pattern within word boundaries solves this
    problem.


    # Summary


    Looking ahead and behind provides greater control over what is returned when matches
    are made. The lookaround operations allow subexpressions to be used to specify
    the location of text to be matched but not consumed (matched, but not included
    in the matched text itself). Positive lookahead is defined using (?=), and negative
    lookahead is defined using (!). Some regular expression implementations also support
    lookbehind (?<=) and negative lookahead using (?<!).


    # Lesson 10


    # Embedding Conditions


    A powerful yet infrequently used feature of the regular expression language is
    the capability to embed conditional processing within an expression. This lesson
    will explore this topic.


    # Why Embed Conditions?


    (123) 456-7890 and 123-456-7890 are both acceptable presentation formats for North
    American phone numbers. 1234567890, (123) -456-7890, and (123)-456-7890 all contain
    the correct number of digits, but are badly formatted. Could you write a regular
    expression to match only the *acceptable* formats and not any others?


    This is not a trivial problem; consider this obvious solution:


    Text


    ```

    123-456-7890

    (123)456-7890

    (123)-456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    RegEx


    ```

    \(?<d3>\d{3}\)??\d{3}-\d{4}

    ```


    Result


    ```

    123-456-7890

    (123)456-7890

    (123)-456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    # Analysis


    \? matches an optional parenthesis (notice that ( must be escaped)


    Replacing \?-? with \-?} will eliminate the third line (by allowing only ) or
    -, but not both) the fourth line is a problem. The pattern needs to match ) if
    there is an opening (. In truth, the pattern needs to match ), and that type of
    pattern cannot be implemented without conditional processing.


    # Caution


    Conditional processing is not supported by all regular expression implementations.


    # Using Conditions


    Regular expression conditions are defined by (?). In fact, you have already seen
    a couple of specific conditions:


    - * ?? matches the previous character or expression if it exists.

    - ?=|<= match text ahead or behind, if it exists.


    Embedded condition syntax also uses (?), which is not surprising considering that
    the conditions that are embedded are the same two just listed:


    - * Conditional processing based on a backreference.

    - * Conditional processing based on lookaround.


    A backreference condition allows for an expression to be used only if a previous
    subexpression was successful. If that sounds obscure, consider an example: you
    need to locate all <img> tags in your text; in addition, if any tags are links
    (enclosed between <a> and </a> tags), you need to match the complete link tags
    as well.


    The syntax for this type of condition is (?(backreference)true). The ? starts
    the condition, the backreference specified within parentheses, and the expression
    to be evaluated only if the backreference is present immediately follows.


    # Using Conditions


    For the example:


    # Text


    ```

    <!-- Nav bar --

    <<div>

    <a href="/home"><img src="/images/home.gif"></a>

    <img src="/images/spacer.gif">

    <a href="search"><img src="/images/search.gif"></a>

    <img src="/images/spacer.gif">

    <a href="/help"><img src="/images/help.gif"></a>

    </div>

    ```


    # RegEx


    ```

    <[Aa]+\s+([^>]+)*?<([Ii] [Mm]\s+([^>]+)*\)?(1)\s*\/[Aa]>

    ```


    # Result


    ```

    <!-- Nav bar --

    <div>

    <a href="/home"><img src="/images/home.gif"></a>

    <img src="/images/spacer.gif">

    <a href="search"><img src="/images/search.gif"></a>

    <img src="/images/spacer.gif">

    <a href="/help"><img src="/images/help.gif"></a>

    </div>

    ```


    # Analysis


    This pattern requires explanation. `<[Aa]+\s+([^>]+)*?>` matches an opening `<A>`
    or `<a>` tag (with any attributes may be present), if the `?` matches the expression
    `<[Ii] [Mm]\s+([^>]+)*>` then matches the `<img>` tag (regardless of case) with
    its attributes. `(1)\s*\/[Aa]>` starts off with a condition: `(1)` means execute
    what comes next if backreference 1 (the opening `<A>` tag) exists (or other words,
    execute only what comes next if the first `<A>` match was successful). If (1)
    exists, then `\s*` matches any trailing whitespace before the closing `</A>` tag.


    # Note


    ?(1) checks to see if backreference 1 exists. The backreference number 1 in this
    example does not need to be escaped. So, ?1) is correct, and ?1) is not (although
    the latter will usually work). The pattern just executes if a condition is met.
    Conditions can also have expressions, expressions that executed only if backreference
    does not exist (the condition is not met). The syntax for this form of condition
    is `(?backreference)true|false`. This syntax accepts a condition, as well as expressions
    to be executed if the condition is met or not.


    This syntax provides the solution for the phone number as shown here:


    # Text


    ```

    123-456-7890

    (123) 456-7890

    (123) -456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    # RegEx


    ```

    \(\d{3}\)?(?\1\)|\d{4}

    ```


    # Result


    | |

    |---||

    | 123-456-7890 |

    | (123) 456-7890 |

    | (123) -456-7890 |

    | (123)-456-7890 |

    | 1234567890 |

    | 123 456 7890 |


    # Analysis


    This pattern seemed to work, but why? Before, ?1 checks for the start of parentheses
    pair, but the results are enclosed within parentheses so to create subexpression.
    \d{3} matches the three-digit area code. If ?1 exists (meaning that parenthesis
    was opened), then \1 must be matched; otherwise, - must be matched. This way,
    parentheses must always be paired, and the hyphen separating the area code from
    the number is matched only if parentheses used. Why did the fourth line match?
    The opening no matching pair is assumed to be unrelated text and is ignored.


    > Tip Patterns can look complex when conditions are embedded, and this can make
    troubleshooting difficult. It is generally a good idea to build and test small
    parts of the expression and then put them together.


    # Lookaround Conditions


    A lookaround condition allows for expressions to be executed based on whether
    a lookahead or lookbehind operation succeeded. The syntax for lookaround conditions
    is the same as it is for backreference conditions, except the backreference (the
    inside of the parentheses) is replaced by a complete lookaround expression.


    Using Conditions


    > Note Refer to Lesson 9, "Looking Ahead and Behind," for details on using lookaround
    processing.


    As an example, consider U.S. ZIP codes. These may be five-digit ZIP codes formatted
    as 12345 or ZIP+4 codes formatted as 12345-6789. The hyphen is used only if the
    additional digits are present. Here is one solution:


    # Text


    ```

    11111

    22222

    33333-

    44444-

    ```


    # RegEx


    ```

    \d{5}(-\d{4})?

    ```


    # Result


    ```

    11111

    22222

    33333-

    44444-

    ```


    # Analysis


    Again, \d{5} matches the opening five digits. Then comes a condition in the form
    of (?=-\d{4}). The condition uses lookahead ? to match (but not consume) a hyphen,
    and if the condition is met (the hyphen exists), then -\d{4} matches hyphen followed
    by four digits. This way, 33333 is not matched (it has a hyphen and so the condition
    is met, but it does not have the additional four digits).


    But if you wanted to match any badly formatted ZIP codes? The third line in the
    example has a hyphen that probably should not be there. The preceding pattern
    matched the digits without the hyphen, but you could not match that entire ZIP
    code because it is badly formatted. This example may seem a bit contrived, but
    it simply demonstrates the use of lookaround conditions. So:


    # Text


    ```

    11111

    22222

    33333-

    44444-

    ```


    # RegEx


    ```

    \d{5} (?=-\d{4})

    ```


    # Result


    ```

    11111

    22222

    33333-

    44444-

    ```


    # Analysis


    - Lookaround conditions tend not to be used frequently because similar results
    can be accomplished using simpler means.


    # Summary


    Conditions may be embedded into regular expression patterns so as to be able to
    execute expressions only if a condition has (or not) been met. The condition may
    be a backreference (the condition is then checking for its existence) or a lookaround
    operation.

