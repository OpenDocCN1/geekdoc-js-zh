    # Lesson 4


    # Using Metacharacters


    Metacharacters were introduced in Lesson 2, “Matching Single Characters.” In this
    lesson you''ll learn about additional metacharacters used to match specific characters
    or character types.


    # Escaping Revisited


    Before venturing deeply into the world of metacharacters, it is important to revisit
    a topic mentioned in passing previously: escaping.


    Metacharacters that have special meaning within regular expressions. The (.) is
    a metacharacter; it is used to match any single character (as explained in Lesson
    2). Similarly, the left bracket ([) is a metacharacter; it is used to mark the
    beginning of a set (as explained in Lesson 3, “Matching Sets of Characters”).


    Because metacharacters can take special significance when used in regular expressions,
    these characters cannot be used to refer to themselves. For example, you cannot
    use a [ to match [ or to match . . Take a look at the following example. A regular
    expression is being used to attempt to match a JavaScript array containing [ and
    ].


    # Text


    ```

    var myArray = new Array();

    ...

    if (myArray[0] == 0) {

    }

    ```


    # RegEx


    ```

    myArray[0]

    ```'
