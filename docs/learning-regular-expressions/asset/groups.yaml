    # RegEx


    [ns]a[^0-9]\xls


    # Result


    +   sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    apac1.xls

    europe2.xls

    sam.xls

    nal1.xls

    na2.xls

    sal1.xls

    cal1.xls


    # Analysis


    The pattern used in this example is the exact opposite of the one used previously.
    [0-9] matches all digits (and only digits). [0-9] matches anything by the specified
    range of digits. As such, [ns]a[^0-9]\xls matches sam.xls but not nal1.xls, na2.xls,
    or sal1.xls.


    # Note


    > ^ negates all characters or ranges in a set, not just the character or range
    that it precedes.


    # Summary


    Metacharacters [ ] are used to define sets of characters, any one of which must
    match (OR in contrast to AND). Character sets may be enumerated explicitly or
    specified as ranges using the - metacharacter. Character sets may be negated using
    ^; this forces a match of anything but the specified characters.'
