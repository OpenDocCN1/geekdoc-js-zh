    # 位置匹配


    你现在已经学习如何在文本的任何位置通过各种组合和重复来匹配各种字符。然而，有时需要在文本块中的特定位置进行匹配，这需要位置匹配，本课将对此进行解释。


    # 使用边界


    位置匹配用于指定匹配应该发生在字符串的哪个位置。为了理解位置匹配的必要性，请考虑以下示例：


    Text


    The cat scattered his food all over the room.


    RegEx


    cat


    Result


    The cat scattered his food all over the room.


    Analysis


    模式 `cat` 匹配 `cat` 的所有出现处，甚至是 `scattered` 单词中的 `cat`。这实际上可能是想要的结果，但更有可能不是。如果你正在执行搜索以将所有的
    `cat` 替换为 `dog`，你将得到以下无意义的内容：


    The dog scattered his food all over the room.


    这引出了边界的使用，或用于指定模式之前或之后位置（边界）的特殊元字符。


    # 使用单词边界


    第一个边界（也是最常用的之一）是指定为 `\b` 的单词边界。正如其名称所示，`\b` 用于匹配单词的开头或结尾。


    为了演示 `\b` 的用法，这里是之前的示例，这次指定了边界：


    Text


    The cat scattered his food all over the room.


    RegEx


    ```

    \bcat\b

    ```


    Result


    The cat scattered his food all over the room.


    Analysis


    单词 `cat` 在前后都有空格，因此它匹配 `\bcat\b`（空格是分隔单词的字符之一）。


    > 注意：`\b` 到底匹配什么？正则表达式引擎并不理解英语，或者说任何语言，它们不知道什么是单词边界。`\b` 仅仅匹配通常作为单词部分的字符（字母、数字）和下划线（会被
    `\w` 匹配）与其他字符（会被 `\W` 匹配）之间的位置。


    重要的是要在匹配的文本前后都使用整个单词 `\b`。请考虑这个示例：


