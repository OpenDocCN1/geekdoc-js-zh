    # Using Character Set Ranges


    Let''s take a look at the file list example again. The last used pattern, [ns]a\.\xls,
    has another problem. If a file was named sam.xls? It, too, would be matched because
    the . matches all characters, not just digits.


    Character sets can solve this problem as:


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    sam.xls

    al1.xls

    na2.xls

    sal1.xls

    cal1.xls

    ```


    # RegEx


    ```

    [ns]a[0123456789]\xls

    ```


    # Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    sam.xls

    al1.xls

    na2.xls

    sal1.xls

    cal1.xls

    ```


    # Analysis


    In this example, the pattern has been modified so that the first character would
    have to be n or s, the second character would have to be a, and the third could
    be any digit (specified as [0123456789]). Notice that file sam.xls was not matched,
    because m did not match the list of allowed characters (the 10 digits).


    When working with regular expressions, you will find that you frequently specify
    ranges of characters (0 through 9, a through z, and so on). To simplify working
    with character ranges, regex provides a special metacharacter: - (hyphen) is used
    to specify a range.'
