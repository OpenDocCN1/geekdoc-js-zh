    # 第 11 ：常见问题的正则表达式解决方案


    ## 分析


    所有的 Discover 卡片均为 16 位，并以数字 6011 开头；使用 `6011\d{14}` 即可解决。


    大来卡（Diners Club）稍微复杂一些：


    ### 文本


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901


    ### 正则表达式


    ```

    (30[0-5]|36|38)\d{11}

    ```


    ### 结果


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901


    ## 分析


    大来卡为 14 位，以 300 到 305、36 或 38 开头。如果开头数字是 300 到 305，则还需要额外的 12 位数字。为了简化操作，该模式不区分前三位数字是什么，直接匹配它们。`(30[0-5]|36|38)\d{11}`
    包含三个表达式，其中任何一个匹配成功即可：`30[0-5]` 匹配 300 到 305，`36\d` 匹配任何以 36 开头的三位数，而 `38` 匹配任何以
    38 开头的三位数。通过这种方式，`\d{11}` 可以匹配剩余的 11 位数字。


    现在剩下的就是检查此处使用的任何卡类型的方法：


    ### 文本


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901


    ### 正则表达式


    ```

    (6011\d{12})|(4\d{15})|(5\d{14})|(37\d{13})|((30[0-5]|36|38)\d{11})

    ```


    ### 结果


    | | 号码 |

    | :--- | :--- |

    | MasterCard | 521234567890124 |

    | Visa 1 | 41234567890122 |

    | Visa 2 | 412345678901235 |

    | Amex | 371234567890123 |

    | Discover | 60111234567890123 |

    | Diners Club | 388112345678901 |


    ## 分析


    此处的模式使用了分支（提供备选方案，使用 `|`）来包含之前所有的模式，每个模式之间由 `|` 隔开。这是对所有主要卡类型的简单验证。


    > 此处使用的模式确保了数字正确且长度正确。然而，并不是每个以 4 开头的 13 位数字都是有效的 Visa 号。可以使用名为 Luhn 的算法来确定数字是否真实有效。


    ## 总结


    你现在已经看到了在此之前课程中介绍的许多概念和想法的实际示例。请随时使用并调整此处此处使用的任何示例；借此，欢迎来到充满活力且高效的正则表达式世界。


    本页特留白


    # 附录 A


    ## 流行应用程序和语言中的正则表达式


    虽然基础正则表达式语法在不同的实现之间很大程度上是一致的，但正则表达式的使用方法显然完全不同。支持正则表达式的语言和应用程序有它们自己的调用方法，并有自己的区别和细微差别。本附录描述了流行应用程序和语言中正则表达式的使用，并在适当的情况下提供了额外的用法说明。


    本附录中提供的信息仅供参考，并帮助你入门。每种实现的具体用法示例和注释超出了本书的范畴，你应该参考相关的应用程序或语言文档以获取更多信息。


    grep

    grep 是一个用于对文件或标准输入进行搜索的 Unix 实用程序。grep 支持基础、扩展和 Perl 正则表达式，具体取决于所指定的选项：


    - E 使用扩展正则表达式。

    - G 使用基础正则表达式。

    - P 使用 Perl 正则表达式。


    提示

    具体的功能和功能根据所指定的选项而异。大多数用户选择 Perl 正则表达式（后文将描述），因为它们是最标准的。


    注意以下几点（针对 grep）：


    - 默认情况下，grep 显示匹配的行。使用 `-o` 仅显示匹配部分。

    - 使用 `-v` 反向选择非匹配行。

    - 使用 `-c` 显示匹配计数。

    - 使用 `-i` 忽略大小写。


    Java

    Java 通过以下方法实现正则表达式的匹配：


    - `find()` 在字符串中查找匹配项。

    - `startsWith()` 尝试匹配字符串的开头。

    - `matches()` 尝试匹配整个字符串。

    - `replaceAll()` 替换所有匹配项。

    - `replaceFirst()` 替换第一个匹配项。


    额外的类通过 `util.regex.matcher` 提供更好的控制：


    - `compile()` 将正则表达式编译。

    - `flags()` 返回正则表达式的标志。

    - `matches()` 功能与之前描述的相同。

    - `pattern()` 返回用于创建的正则表达式。

    - `split()` 将字符串拆分。


    Sun 的正则表达式支持基于 Perl，但请注意以下几点：


    - 使用表达式需要导入 `util.regex.*`（如果只需要子集，请指定它们的名称）。

    - 不支持嵌入条件。

    - 不支持 `E`、`\1`、`\L`、`\u` 和 `\U` 大大小转换。

    - 不支持通过 `\b` 进行退格匹配。

    - 不支持 `\z`。


    JavaScript

    JavaScript 通过 String 和 RegExp 对象实现正则表达式处理：


    - `exec()` 是用于搜索匹配项的 RegExp 方法。

    - `match()` 是用于匹配字符串的 String 方法。

    - `replace()` 是用于替换操作的 String 方法。

    - `search()` 是用于搜索匹配的 String 方法。

    - `split()` 是用于将字符串拆分为多个字符串的 String 方法。

    - `test()` 是用于测试字符串匹配的 RegExp 方法。


    JavaScript 使用标志管理全局大小敏感搜索：`g` 启用全局，`i` 忽略敏感，两者可以组合为 `gi`。


    - 额外的修饰符（较新的浏览器支持）包括 `m` 支持多行字符串，`s` 用于行字符串，`x` 用于忽略正则内的空格。

    - 当你使用反引用时，`$` 返回匹配之前的内容，`''` 返回匹配之后的内容，`+` 返回最后匹配的子表达式，`&` 返回匹配的所有内容。

    - JavaScript 有一个名为 `RegExp` 的全局对象，可以通过它获取执行的正则表达式的信息。

    - 不支持 POSIX 字符类。

    - 不支持 `\A` 和 `\Z`。


    Microsoft .NET

    .NET Framework 作为基类库提供了强大且灵活的正则表达式处理。正则表达式适用于任何 .NET 语言和工具（包括 ASP.NET、C# 和 Visual
    Studio .NET）。


    .NET 中的正则表达式支持由 `Regex` 类提供（以及额外的支持类）。`Regex` 包含以下方法：


    - `IsMatch()` 检查指定字符串是否存在匹配项。

    - `Match()` 搜索单个匹配项并返回 `Match` 对象。

    - `Matches()` 搜索所有匹配项并返回 `MatchCollection` 对象。

    - `Replace()` 对指定字符串执行替换操作。

    - `Split()` 将字符串拆分为字符串数组。


