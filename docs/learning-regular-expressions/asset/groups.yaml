    # 附录 A 常用应用程序和语言中的正则表达式


    通过封装函数，也可以执行正则表达式而无需实例化并操作 Regex 类实例：


    - `Regex.IsMatch()` 在功能上等同于之前列表的 `IsMatch()` 方法。

    - `Regex.Match()` 在功能上等同于 `Match()` 方法。

    - `Regex.Matches()` 在功能上等同于 `Matches()` 方法。

    - `Regex.Replace()` 在功能上等同于 `Replace()` 方法。

    - `Regex.Split()` 在功能上等同于 `Split()` 方法。


    以下是关于 .NET 正则支持的重要点：


    - 使用正则表达式，必须使用 `System.Text.RegularExpressions` 导入正则对象。

    - 对于快速的内联正则表达式处理，封装函数是理想选择。

    - 使用 `Regex.Options` 指定正则表达式选项——可以使用 `RegexOption` 设置诸如 `IgnoreCase`、`Multiline`、`Singleline`
    等成员。

    - .NET 支持捕获，即为子表达式命名的能力（以便通过名称而非数字引用它们）。其语法为 `(?<name>)` 用于命名子表达式，`(?<name>)`
    用于引用反向引用，`${name}` 在替换模式中引用它。

    - 使用反向引用时，`$` 返回匹配字符串之前的所有内容，`$''` 返回最后一个匹配的子表达式，`$_` 返回整个匹配字符串。

    - 不支持使用 `\E`、`\1`、`\L`、`\u` 和 `\U` 进行大小写转换。

    - 不支持 POSIX 字符类。


    # Microsoft SQL Server T-SQL


    SQL Server 原生不支持正则表达式。然而，SQL Server T-SQL 语句可以使用 Microsoft CLR（公共语言运行时），它暴露了正则表达式功能。CLR
    超出了本书的范围，可以在微软网站上找到相关文档。


    # Microsoft Visual Studio .NET


    Visual Studio .NET 中的正则表达式支持由 .NET Framework 提供。请参阅本附录早前的 .NET 部分。


    # MySQL


    要使用正则表达式，请执行以下操作：


    - 从“编辑”菜单中选择“查找”和“替换”。

    - 选择“查找”、“替换”或“在文件中查找”或“在文件中替换”。

    - 勾选“使用” 框，并在下拉列表中选择“正则表达式”。


    注意以下几点：


    - 使用 `@` 代替 `*?`。

    - 使用 `#` 代替 `+`。

    - 使用 `^n` 代替 `{}`。

    - 在替换操作中，反向引用可能会被填充以便使用 `\w,n` 进行左对齐，其中 `w` 是宽度，`n` 是反向引用。要右对齐，使用 `\(-w,n)`。

    - Visual Studio .NET 使用以下特殊元字符和符号：`:a` 代表 `[a-zA-Z0-9]`，`:c` 代表 `[a-zA-Z]`，`:d`
    代表数字，`:h` 代表 `[a-f-F0-9]`（十六进制字符），`:i` 代表有效标识符 `[a-zA-Z_][a-zA-Z0-9_$]*`，`:q`
    代表引号字符串，`:w` 代表 `[a-zA-Z]`，`:z` 代表数字。

    - `\n` 是跨平台的行符，在替换操作中使用插入换行。

    - 支持以下特殊字母匹配字符：`:Lu` 匹配任何大写字母，`:Ll` 匹配任何小写字母，`:Lt` 匹配标题大小（首字母大写），`:Lm` 匹配标点字符。

    - 支持以下特殊数字匹配字符：`:Nd` 代表 `[0-9]+`，`:Nl` 代表罗马数字。

    - 支持以下特殊标点匹配字符：`:Pe` 代表标点开启，`:Ps` 代表标点关闭，`:Pi` 代表双引号，`:Pd` 代表破折号（连字符），`:Po` 代表其他标点字符。

    - 支持以下特殊符号匹配字符：`:Sm` 代表数学符号，`:Sc` 代表货币符号，`:Sk` 代表重音符号，`:So` 代表特殊符号。

    - 也支持其他字符；更多细节请咨询 Visual Studio .NET 文档。


    MySQL 是一个流行的开源数据库，MySQL 在其他数据库尚未涉足的地方提供了正则表达式支持作为执行数据库搜索的方法。


    MySQL 的正则表达式支持在 WHERE 子句中以以下格式访问：


    ```

    REGEXP "expression"

    ```


    > 注意

    使用正则表达式的完整 MySQL 语句将使用如下语法：

    SELECT * FROM table WHERE REGEXP "pattern".


    MySQL 的正则表达式支持非常有用且强大，但它并不是完整的正则表达式实现：


    - 仅提供搜索支持；不支持操作。

    - 搜索不区分大小写。要执行区分大小写的搜索，请使用 `BINARY` 关键字（位于 REGEXP 和表达式本身之间）。

    - 使用 `[\<]` 匹配单词开头，使用 `[\>]` 匹配单词结尾。

    - 不支持环视（Lookaround）。

    - 不支持嵌入条件。

    - 不支持八进制字符搜索。

    - 不支持 `\a`、`\b`、`\e`、`\f` 和 `\v`。

    - 不支持反向引用。


    # Oracle PL/SQL


    PL/SQL 是 Oracle DBMS 中使用的 SQL 格式。PL/SQL 支持正则表达式如下：


    - 可以使用 REGEXP_LIKE 代替 SQL LIKE。


    以下是关于 PL/SQL 正则表达式的一些有用说明：


    - `REGEXP_LIKE` 可匹配 `VARCHAR2`、`CHAR`、`NVARCHAR2`、`NCHAR`、`CLOB` 或 `NCLOB` 数据类型中的文本。

    - 指定 `REGEXP_LIKE` 参数 `c` 进行区分大小写的匹配。

    - 指定 `REGEXP_LIKE` 参数 `i` 进行不区分大小写的匹配。

    - 指定 `REGEXP_LIKE` 参数 `n` 允许 `.` 匹配换行符。

    - 指定 `REGEXP_LIKE` 参数 `x` 忽略空白字符。

    - 管道字符 `|` 可用于逻辑“或”。


    # Perl


    Perl 是正则表达式实现的鼻祖，大多数实现都兼容 Perl。


    正则表达式支持是 Perl 的核心部分，通过指定操作和模式使用：


    - `m/pattern/` 匹配模式。

    - `s/pattern/` 执行替换操作（注：原文此处为笔误，应为 `s/pattern/replacement/` 类似逻辑）。

    - `qr/pattern/` 返回一个正则对象。

    - `split()` 分割字符串。


    以下是关于 Perl 正则表达式的一些有用说明：


    - 修饰符可以传递模式之后。使用 `/i` 进行区分大小写的搜索，使用 `/g` 进行全局匹配。

    - 当使用反向引用时，`$` 返回匹配字符串之前的所有内容，`$''` 返回匹配字符串之后的内容，`$+` 返回整个匹配字符串。


    # PHP


    PHP 通过 PCRE（Perl 兼容表达式）提供正则表达式支持。


    PCRE 支持以下正则表达式函数：


    - `preg_grep()` 执行搜索并返回匹配数组。

    - `preg_match()` 执行正则表达式搜索获取第一个匹配。

    - `preg_match_all()` 执行全局正则表达式搜索。

    - `preg_quote()` 取模式并返回其转义后的版本。

    - `preg_replace()` 执行替换操作。

    - `preg_replace_callback()` 执行替换操作，但使用回调函数执行实际替换。

    - `preg_split()` 分割字符串。


    注意以下点：


    - 对于不区分大小写的匹配，使用 `i` 修饰符。

    - 多行字符串可以使用 `m` 修饰符启用。

    - PHP 可以评估替换字符串作为 PHP 代码。要启用此功能，使用 `e` 修饰符。

    - `preg_replace()`、`preg_replace_callback()` 和 `preg_split()` 都支持一个可选参数，指定限制替换或分割的最大次数。


    反向引用在 PHP 4.0.4 及以后版本可以使用 Perl 语法（例如 `$1`）；早期版本使用 `\` 代替 `$`。


    `\l`、`\u`、`\W`、`\U`、`\E`、`\Q` 和 `\v` 不支持。


    # Python


    Python 通过 `re` 模块提供正则表达式支持。

    Python 支持以下正则表达式：


    - `findall()` 查找所有字符串并以列表返回。

    - `finditer()` 查找所有字符串并以迭代器返回。

    - `match()` 在字符串开头执行正则表达式搜索。

    - `search()` 在字符串中搜索所有匹配。

    - `split()` 将字符串转换为列表，在模式匹配的地方进行分割。

    - `sub()` 用指定的字符串替换匹配项。

    - `subn()` 返回替换替换后的字符串以及替换次数。


    注意以下点：


    - 在使用之前，通过 `re.compile` 将正则表达式编译为对象。

    - `re.compile` 接受可选标志，如 `re.IGNORECASE` 用于不区分大小写的搜索。

    - 使用 `re.VERBOSE` 有助于调试正则表达式。

    - 如果未找到匹配项，`match()` 和 `search()` 返回 `None`。


    '
