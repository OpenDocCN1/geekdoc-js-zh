    # 第 10 节


    # 嵌入条件


    正则表达式语言中一个强大但不经常使用的特性是可以在表达式中嵌入条件处理。本节将探讨这一主题。


    # 为什么要嵌入条件？


    (123) 456-7890 和 123-456-7890 都是北美电话号码可以接受的格式。1234567890、(123) -456-7890 和 (123)-456-7890
    都包含正确的数字数量，但格式糟糕。你能写一个正则表达式来只匹配*可以接受的*格式而不匹配任何其他格式吗？


    这不是一个简单的问题；考虑一下这个显而易见的解决方案：


    文本


    ```

    123-456-7890

    (123)456-7890

    (123)-456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    正则表达式


    ```

    \(?<d3>\d{3}\)??\d{3}-\d{4}

    ```


    结果


    ```

    123-456-7890

    (123)456-7890

    (123)-456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    # 分析


    \? 匹配可选的括号（注意 `(` 必须被转义）


    将 `\?-?` 替换为 `\-?}` 将消除第三行（通过只允许 `)` 或 `-`，但不允许两者都有），但第四行是一个问题。如果存在左括号 `(`，则模式需要匹配
    `)`。事实上，该模式需要匹配 `)`，而这种模式在没有条件处理的情况下无法实现。


    # 注意


    并不是所有的正则表达式实现都支持条件处理。


    # 使用条件


    正则表达式条件通过 `(??)` 定义。事实上，你已经见过一些特定的条件：


    -   `??` 如果存在，则匹配上一个字符或表达式。

    -   `?=` 或 `?<=` 如果存在，则匹配前方或后方的文本。


    嵌入条件语法也使用 `(??)`，考虑到嵌入的条件就是上面列出的那两个，这并不意外：


    -   *基于反向引用的条件处理。*

    -   *基于环查的条件处理。*


    反向引用条件允许仅在之前的子表达式成功时才使用该表达式。如果这听起来很抽象，请考虑这样一个例子：你需要定位文本中所有的 `<img>` 标签；此外，如果任何标签是链接（封装在
    `<a>` 和 `</a>` 标签之间），你还需要匹配完整的链接标签。


    这种条件的语法是 `(?(backreference)true)`。`?` 开始条件，括号内指定反向引用，只有当反向引用紧随其后时，才会评估其后的表达式。


    # 使用条件


    对于以下示例：


    # 文本


    ```

    <!-- Nav bar --

    <<div>

    <a href="/home"><img src="/images/home.gif"></a

    <img src="/images/spacer.gif">

    <a href="search"><img src="/images/search.gif"></a>

    <img src="/images/spacer.gif">

    <a href="/help"><img src="/images/help.gif"></a>

    </div>

    ```


    # 正则表达式


    ```

    <[Aa]+\s+([^>]+?<([Ii]\s+([^>]+)?(1)\s*\/Aa]>

    ```


    # 结果


    ```

    <!-- Nav bar --

    <div>

    <a href="/home"><img src="/images/home.gif"></a

    <img src="/images/spacer.gif">

    <a href="search"><img src="/images/search.gif"></a>

    <img src="/images/spacer.gif">

    <a href="/help"><img src="/images/help.gif"></a>

    </div>

    ```


    # 分析


    此模式需要解释：`<[Aa]+\s+([^>]+?>` 匹配一个 `<A>` 或 `<a>` 标签（带有任何属性），如果 `?` 匹配了表达式 `<[Ii]\s+([^>]+)?(1)\s*\/Aa]>`
    是一个条件：如果反向引用 1（第一个 `<A>` 标签）存在，则执行后续内容。如果存在，则 `\s*` 匹配结束标签 `</A>` 之前的任何空格。


    # 注意


    `?(1)` 检查反向引用 1 是否存在。示例中的反向引用数字 1 不需要转义。所以 `?1)` 是正确的，而 `?(1)` 则不是（尽管后者通常有效）。模式仅在条件满足时执行。条件也可以带有表达式，即当反向引用不存在（条件不满足）时执行的表达式。这种形式的条件语法是
    `(?backreference)true|false`。这种语法为这里的电话号码提供了解决方案：


    # 文本


    ```

    123-456-7890

    (123) 456-7890

    (123) -456-7890

    (123)-456-7890

    1234567890

    123 456 7890

    ```


    # 正则表达式


    ```

    \(\d{3}\)?(?\1\))|\d{4}

    ```


    # 结果


    | |

    |---|

    | 123-456-7890 |

    | (123) 456-7890 |

    | (123) -456-7890 |

    | (123)-456-7890 |

    | 1234567890 |

    | 123 456 7890 |


    # 分析


    这个模式似乎有效，但为什么呢？之前，`?1` 检查括号对的开头，但结果被封装在括号内作为子表达式。`\d{3}` 匹配三位区号。如果 `?1` 存在（意味着打开了括号），则必须匹配
    `\1`；否则必须匹配 `-`。通过这种方式括号必须成对出现，且区号与数字之间的连字符仅在使用了括号时才匹配。为什么第四行匹配了？未匹配的开头被视为无关文本并被忽略。


    > 提示 嵌入条件时模式可能看起来复杂，这使得调试变得困难。通常建议构建测试表达式的小部分然后将它们组合在一起。


    # 环查条件


    环查条件允许根据前后查找操作是否成功来执行表达式。环查条件的语法与反向引用条件相同，但反向引用（括号内部）被替换为完整的环查表达式。


    使用条件


    > 注意 请参阅第 9 节“向前和向后查找”有关使用环查处理的详情。


    作为一个例子，考虑美国的邮政编码（ZIP codes）。这些可能是格式为 `12345` 的五位邮政编码，或者是格式为 `12345-6789` 的 ZIP+4
    编码。只有在存在额外数字时才使用连字符。这里有一个解决方案：


    # 文本


    ```

    11111

    22222

    33333-

    44444-

    ```


    # 正则表达式


    ```

    \d{5}(-\d{4})?

    ```


    # 结果


    ```

    11111

    22222

    33333-

    44444-

    ```


    # 分析


    再次，`\d{5}` 匹配开头的五个数字。接着是一个形式为 `(?=-\d{4})` 的条件。该条件使用领先 `?` 匹配（但不消耗）连字符，如果条件满足（连字符存在），则
    `-\d{4}` 匹配连字符及其后的四个数字。通过这种方式，`33333` 没有被匹配（它有一个连字符，所以条件满足，但它没有额外的四个数字）。


    但如果你想匹配任何格式糟糕的邮政编码呢？示例中的第三行有一个可能不该在那里的连字符。之前的模式匹配了不带连字符的数字，但你无法匹配整个邮政编码，因为它的格式糟糕。这个示例可能看起来有些牵强，但它仅仅演示了环查条件的用法。所以：


    # 文本


    ```

    11111

    22222

    33333-

    44444-

    ```


    # 正则表达式


    ```

    \d{5} (?=-\d{4})

    ```


    # 结果


    ```

    11111

    22222

    33333-

    44444-

    ```


    # 分析


    - 环查条件往往不经常使用，因为可以使用简单的方法实现类似的结果。


    # 总结


    条件可以嵌入到正则表达式模式中，以便仅在条件满足（或不满足）时执行表达式。条件可以是反向引用（此时条件是在检查其是否存在）或环查操作。


