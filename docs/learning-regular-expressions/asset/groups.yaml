    ID: 042

    SEX: M

    DOB: 1967-08-17

    Status: Active


    Analysis

    In this example, the pattern was to have located a four-digit OR, but for greater
    accuracy, the first two digits are explicitly listed as 19 and 20. | is the operator,
    and so 19|20 matches either 19 or 20, and 19|20\d{2} should match any four-digit
    number beginning with 19 or 20 (19 or 20 followed by two digits). Obviously, this
    did not work. Why? The | operator looks at what is to its left and to its right
