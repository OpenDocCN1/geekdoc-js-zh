    \ names, application variable names, database object names, and more). Table 4.3\
    \ lists the class shortcuts for alpha-numeric characters and nonalphanumeric characters.\n\
    \n## Table 4.3 Alphanumeric Metacharacters\n\n| Metacharacter | Description |\n\
