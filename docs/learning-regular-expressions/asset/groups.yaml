    \ is? You've already seen it—it is the sample statement shown previously. \\b[Cc]\
    \ [Rr] \\b.\n\nIt is worth noting that testing for equality (for example, does\
    \ this user-specified e-mail address match this regular expression) is a search\
    \ operation. The entire user-provided string is searched for a match (in contrast\
    \ to a substring search, which is what searches usually are)."
