    ```


    # 分析


    每个 `\d{1,3}` 实例匹配 IP 地址中的其中一个数字。四个数字由 `.` 分隔，它被转义为 `\.`。


    模式 `\d{1,3}\.`（最多 3 位数字后跟一个点）重复了三次，因此可以表示为重复。以下是相同示例的另一种版本：


    # 文本


    ```

    Ping hog.forta.com [12.159.46.200]

    with 32 bytes of data:

    ```


    # 正则表达式


    ```

    (\d{1,3}\.){3}\d{1,3}

    ```


    # 结果


    ```

    Ping hog.forta.com [12.159.46.200]

    with 32 bytes of data:

    ```


    # 分析


    此模式的效果与之前的一样，但语法不同。表达式 `\d{1,3}\.` 被包含在 `( )` 中以使其成为子表达式。`(\d{1,3}\.){3}` 将子表达式重复三次（对应
    IP 地址中的前三个数字），然后 `\d{1,3}` 匹配最后一个数字。


    # 注意


    > `(\d{1,3}\.){4}` 不是刚刚使用的模式的有效替代方案。你能想出为什么在这个示例中会失败吗？


    # 第 7 节 使用子表达式


    > 提示

    有些用户喜欢将表达式的一部分封装为子表达式以提高可读性；之前的模式可以表示为 `(\d{1,3}\.){3}(\d{1,3})`。这种做法完全合法的，且使用它不会影响表达式的实际行为（尽管取决于所使用的正则表达式实现，可能会对性能的影响）。


    使用子表达式进行分组非常重要，以值得再看另一个示例——一个完全不涉及重复的示例。这个示例尝试匹配用户记录中的年份：


    文本

    ID: 042

    SEX: M

    DOB: 1967-08-17

    Status: Active


    正则表达式

    19|20\d{2}


    结果

    ID: 042

    SEX: M

    DOB: 1967-08-17

    Status: Active


    分析

    在此示例中，模式本是匹配一个四位数的或，但为了更高的准确性，前两位被显式地列出为 19 和 20。`|` 是运算符，因此 `19|20` 匹配 19 或 20，而
    `19|20\d{2}` 应该匹配任何以 19 或 20 开头的四位数字（19 或 20 后面跟两个数字）。显然，这并没有起作用。为什么呢？`|` 运算符查看其左侧和右侧的内容，并将
    `19|20\d{2}` 读取为 `19` 或 `20\d{2}`（认为 `\d{2}` 是以 20 开头的表达式的一部分）。换句话说，它将匹配数字 19
    或任何以 20 开头的四位数字。因此，匹配了 19。

    解决方案是将 `19|20` 分组为子表达式，如下：


    文本

    ID: 042

    SEX: M

    DOB: 1967-08-17

    Status: Active


    # 嵌套子表达式


    # 正则表达式


    (19|20)\d{2}


    # 结果


    ID: 042

    SEX: M

    DOB: 1967-08-17

    Status: Active


    # 分析


    由于所有选项都在一个子表达式中，`|` 知道想要的是组内的选项之一。因此，`(19|20)\d{2}` 匹配 1967，并且也会匹配任何以 19 或 20
    开头的四位数字。在未来的某一天（大约一百年后），如果需要修改代码以匹配以 21 开头的年份，可以将模式更改为 `(19|20)\d{2}`。


    # 注意


    虽然本节涵盖了使用子表达式进行分组的内容，但子表达式还有另一个极其重要的用途。这将在第 8 节“使用反向引用”中介绍。


    # 嵌套子表达式


    子表达式可以嵌套。事实上，子表达式可以嵌套在子表达式中，而子表达式再次嵌套——你懂的。


    嵌套子表达式的能力允许创建极其强大的表达式，但它也会让模式看起来复杂、难以阅读和解码，从而令人望畏。事实是，嵌套子表达式很少像它们看起来那么复杂。


    为了演示嵌套子表达式的使用，我们再次查看 IP 地址示例。这是之前使用的模式（一个子表达式重复三次，后跟最后一个数字）：


    # 正则表达式


    ```

    (\d{1,3}\.){3}\d{1,3}

    ```


    那么这个模式有什么问题呢？从语法上来说，没有。IP 地址确实由四个数字组成；每个数字都是一到三位数字并由点分隔。模式是正确的，它将匹配任何有效的 IP 地址。但并不是它匹配的所有内容；无效的
    IP 地址也会被匹配。


    '
