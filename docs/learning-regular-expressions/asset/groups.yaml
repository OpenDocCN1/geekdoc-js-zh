    # Looking Behind


    > **Tip**

    Any subexpression can be turned into a lookahead expression by simply prefacing
    the text with ?=. Multiple lookahead expressions may be used in a search pattern,
    and they may appear anywhere in the pattern (not just at the beginning, as shown
    here).


    As you have just seen, ?= looks ahead (it looks what comes after the matched text,
    but does not consume what it finds). ?= is thus referred to as the *lookahead
    operator*. In addition to looking ahead, many regular expression implementations
    support looking ahead. Looking at what is before the text to be returned involves
    looking behind, and the *lookbehind operator* ?<.


    > **Tip**

    Need distinguishing ?= and <= from each other? Here''s a way to remember which
    is which: the one carries the arrow pointing behind (the < character) is **lookbehind**.


    <= is used in the same way as ?=; it is used within a subexpression and is followed
    by the text to match.


    Following is an example. A database search lists products, and you need only the
    prices:


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    Total items found: 4

    ```


    # RegEx


    ```

    \$[0-9]+

    ```


    # Result


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    Total items found: 4

    ```


    # Analysis


    ```

    \$ matches the $, and [0-9]+ matches the price.

    ```


    That worked. But what if you did not want the $ characters in the matched text?
    Could you simply drop \$ from the pattern?'
