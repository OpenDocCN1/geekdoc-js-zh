    # 防止过度匹配


    `?` 匹配的范围有限（仅匹配零次或一次），并且在在使用精确数量或范围时它们是区间匹配。但本课中描述的其他重复形式可以匹配无限数量的实例——有时甚至是如此。


    到目前为止的所有示例都经过仔细选择，以避免出现过度匹配，但请考虑下一个示例。接下来的文本是一个网页，包含嵌入了 HTML `<b>` 标签的文本。正则表达式需要匹配
    `<b>` 标签内的任何文本（可能是为了能够替换格式）。这里是示例：


    # Text


    此优惠不适用于居住在 <b>AK</b> 和 <b>HI</b> 的客户。


    # RegEx


    ```

    <[Bb]>.*<\/[Bb]>

    ```


    # Result


    此优惠不适用于居住在 <b>AK</b> 和 <b>HI</b> 的客户。


    # Analysis


    `<[Bb]>` 匹配 `<b>` 标签（无论是大写还是小写），`</Bb]>` 匹配结束的 `</body>` 标签（无论是大写还是小写）。但并不是两个匹配，而是只找到了一个；`*`
    匹配了从第一个 `<b>` 到最后一个 `<b>` 之间的内容，导致 `AK</b> 和 HI` 被匹配了。这包含了我们想要的文本，但也包含了标签的其他实例。


    其原因是像 `*` 和 `+` 这样的元字符是贪婪的；也就是说，它们寻找从尽可能大到尽可能小的匹配。这几乎就像匹配是从文本的末尾开始，向后查找直到找到下一个匹配，与从开头开始形成对比。这是刻意且符合设计的，量化是贪婪的。


    但如果你不想进行贪婪匹配呢？解决方案是使用这些量化的懒惰版本（它们被称为懒惰，是因为它们匹配的是最少字符而不是最多字符）。懒惰量化通过在所使用的量化后面添加一个
    `?` 来定义，每个贪婪量化都有对应的懒惰等效项，如表 5.1 所示。


    # 表 5.1 贪婪与懒惰量化


    | 贪婪 (Greedy) | 懒惰 (Lazy) |

    | --- | --- |

    | * | *? |

    | + | +? |

    | {n, } | {n,} |


    `*?` 是 `*` 的懒惰版本，让我们再次回到示例，这次使用 `*?`：


    # Text


    此优惠不适用于居住在 <b>AK</b> 和 <b>HI</b> 的客户。


    # RegEx


    ```

    <[Bb].*<[Bb]>

    ```


    # Result


    此优惠不适用于居住在 <b>AK</b> 和 <b>HI</b> 的客户。


    # Analysis


    这起作用了。通过使用 `*?`，只有 `<b>AK</b>` 在第一次匹配中被命中，允许 `<b>HI</b>` 被独立匹配。


    > 本书中的大多数示例都使用贪婪量化，以保持模式尽可能简单。然而，需要时，可以随时将这些替换为懒惰量化。


    # 总结


    在处理重复匹配时，正则表达式模式的真正威力显而易见。本课介绍了 `+`（匹配一个或多个）、`*`（匹配零或多个）和 `?`（匹配零或一次）作为执行重复匹配的方法。为了更好的控制，可以使用区间来指定精确的重复次数以及最小值和最小值。量化是贪婪的，可能会过度匹配；为了防止这种情况发生，请使用懒惰量化。


