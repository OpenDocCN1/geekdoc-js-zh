    # Lesson 9 Looking Ahead Behind


    Or did it? What you needed the text, but what you got also contained the opening
    and closing <title> tags. Is it possible to return just the title text?


    One solution could to use subexpressions (as seen in Lesson 7, “Using Subexpressions”).
    This would allow you to retrieve the matched text in three parts—the opening tag,
    the text, and the closing tag—and with the matched text broken into parts, it
    would not be too difficult to extract that part you want.


    But it makes little sense the effort to retrieve something that you actually don''t
    want, only to have to manually remove it. What you really need is a way to catch
    a pattern so that it contains matches that are not returned—matches that are used
    to find the correct match location, but not part of the core match. In other words,
    you need to look around.


    > Note

    This lesson discusses lookahead and lookbehind. The former is supported in all
    major regular expression implementations, but the latter is not supported as extensively.
    Java, .NET, PHP, Python, and Perl all support lookbehind (with some restrictions).
    JavaScript, does not consume.


    # Looking Ahead


    Lookahead specifies a pattern to be matched but not returned. A lookahead is actually
    a subexpression and is formatted as such. The syntax for a lookahead pattern is
    a subexpression preceded by >=, and the text to match follows the = sign.


    > Tip

    Some regular expression documentation uses the term consume to refer to what is
    matched and returned; lookahead matches are said to not consume.


    Here is an example. The following text contains a list of URLs, and you need to
    extract the protocol portion of each (possibly so to know how to process them):


    Text


    ```

    http://www.forta.com/

    https://mail.forta.com/

    ftp://ftp.forta.com/

    ```


    RegEx


    ```

    .+(?=);

    ```'
- md: '

    # Result


    http://www.forta.com/

    https://mail.forta.com/

    ftp://ftp.forta.com/


    # Analysis


    In the URLs, the protocol is separated from the hostname by a :. Pattern .+ matches
    any text (http in the first match), subexpression (?=) matches . But notice that
    the : was not matched;?= tells the regular expression to match : but to look ahead
    (and not consume it).


    To better understand what ?= is doing, here is the same example, this time without
    the lookahead metacharacters.


    # Text


    http://www.forta.com/

    https://mail.forta.com/

    ftp://ftp.forta.com/


    # RegEx


    .+(:)


    # Result


    http://www.forta.com/

    https://mail.forta.com/

    ftp://ftp.forta.com/


    # Analysis


    The subexpression (:) correctly matches : but the matched text is consumed and
    returned part of the match.


    The difference between the two examples is that the used pattern (?=:) to match
    :, and the later used (:). Both of these patterns match the same thing; both matched
    the : after the protocol. The difference is in whether matched was actually included
    in the matched text. When using lookahead, the regular expression parser looks
    ahead to process the :, but does not process it as part of the primary search.
    .+(:) finds the text up and including .. (?=:) finds the text up to, but not including,
    the :.


    > Note


    Lookahead (and lookbehind) actually do return results, but the results are always
    zero characters in length. As such, you will sometimes find the lookahead operations
    referred to as being zero-width.


    # Looking Behind


    > **Tip**

    Any subexpression can be turned into a lookahead expression by simply prefacing
    the text with ?=. Multiple lookahead expressions may be used in a search pattern,
    and they may appear anywhere in the pattern (not just at the beginning, as shown
    here).


    As you have just seen, ?= looks ahead (it looks what comes after the matched text,
    but does not consume what it finds). ?= is thus referred to as the *lookahead
    operator*. In addition to looking ahead, many regular expression implementations
    support looking ahead. Looking at what is before the text to be returned involves
    looking behind, and the *lookbehind operator*.


    > **Tip**

    Need distinguishing ?= and <= from each other. <= is used in the same way as ?=;
    it is used within a subexpression and is followed by the text to match. Following
    is an example. A database search lists products, and you need only the prices:


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # RegEx


    \$[0-9]+


    # Result


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # Analysis


    \$ matches $, and [0-9]+ matches the price. That worked. But what if you did not
    want the $ characters in matched text? Could you simply drop \$ from the pattern?


    # Text


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # RegEx


    [0-9]+


    # Result


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # Analysis


    That obviously did not work. You need \$ so as to determine which text to match,
    or you do not want it to be returned. The solution A lookbehind, as follows:


    # Text


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # RegEx


    (?=$)[0-9]+


    # Result


    ```

    ABC01: $23.45

    HG042: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    ```


    # Analysis


    That did the trick. (?<=\$) matches $, but does not consume it, and so only the
    prices (without the leading signs) are returned.


    # Lesson 9 Looking Ahead Behind


    Compare the first and last expressions used in this example. \$[0-9]+ matched
    $ followed by a dollar amount. (?<=\$)[0-9]+ also matched a dollar amount. The
    difference between the two is not in what they located while performing the search,
    but in what they included in the results. The former located and included $. The
    latter located $ so as to correctly fix the prices, but do not include $ in the
    results.


    > Caution

    Lookahead patterns may be variable length; they may contain . and +, for example,
    so as to be highly dynamic. Lookbehind patterns, on the other hand, must generally
    be fixed length. This is a restriction imposed by almost all regular expression
    implementations.


    # Combining Lookahead and Lookbehind


    Lookahead and lookbehind operations may be combined, as in the following example
    (the solution to the problem at the start of this lesson):


    ```

    Text

    <head>

    <title>Ben Forta''s Homepage</title>

    </head>

    ```


    ```

    RegEx

    (?<=<title>+)

    ```


    ```

    Result

    <head>

    <title>Ben Forta''s Homepage</title>

    </head>

    ```


    Analysis

    That worked. (?<=<title>) is a lookbehind operation that matches (but does not
    consume) <title>; (?</title>) similarly matches (but does not consume) </title>.
    All that is returned is the text (as that is all that was consumed).


    > Tip

    In the preceding example, it may be worthwhile to escape the < (the first character
    matched) to prevent ambiguity, so (?=< instead of (?<=<).


    # Negating Lookaround


    As thus far, lookahead and lookbehind are usually used to match text, essentially
    to specify the location of text to be returned (by specifying the text before
    or after the desired match). These are known as positive lookahead and positive
    lookbehind. The term positive refers to the fact that they look for a match.


    Lesser-used form of lookaround is the negative lookaround. Negating lookahead
    looks for text that does not match the specified pattern, and negative lookbehind
    similarly looks for text that does not match the specified pattern.


    You might have expected to be able to use ^ to negate a lookaround, but no, the
    syntax is a little different. Lookaround operations are negated using ! (which
    replaces the =). Table 9.1 lists all the lookaround operations.


    # Table 9.1 Lookaround Operations


    | Class | Description |

    |---|---|

    | (=) | Positive lookahead |

    | (!) | Negative lookahead |

    | (?<=) | Positive lookbehind |

    | (?<!) | Negative lookbehind |


    > Tip

    Generally, any regular expression implementations supporting lookahead support
    both positive and negative lookahead. Similarly, those implementations supporting
    lookbehind support positive and negative lookbehind.


    To demonstrate the difference between positive and negative lookbehind, here is
    an example. The following block of text contains numbers—both prices and quantities.
