    # Using Intervals


    +, *, and ? are used to solve many problems with regular expressions, but sometimes
    they are not enough. Consider the following:


    +   - and * match an unlimited number of characters. They provide no way to set
    a maximum number of characters to match.


    +   - The only minimums supported by, +, *, ? are zero or one. They provide no
    way to set an explicit minimum number of matches.


    +   - There is no way to specify an exact number of matches desired.


    To solve these problems, and to provide a greater degree of control over repeating
    matches, regular expressions allow for the use of intervals. Intervals are specified
    between the { and } characters.


    > Note

    { and } are metacharacters, as such, should be escaped \ when needed as literal
    text. It is worth noting that many regular expression implementations seem to
    be able to correctly process { } even if they are not escaped (being able to determine
    when they are literal and when they are metacharacters). However, it is best not
    to rely on this behavior and to escape the characters when needing them as literals.


    # Exact Interval Matching


    To specify an exact number of matches, you place that number between { and ).
    Therefore, {3} means three instances of the previous character or set. If there
    are only two instances, the pattern would not match.


