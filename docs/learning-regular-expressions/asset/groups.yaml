    d{13}\n```\n\n## Result\n\nMasterCard: 5212345678901234\nVisa 1: 4123456789012\n\
    Visa 2: 412345678901235\nAmex: 371234567890123\nDiscover: 60111234567890134\n\
    Diners Club: 3881234567890123\n\n# Analysis\n\nAmerican Express numbers are 15\
    \ digits with 34 or 37. 3[47] matches the first 2 digits, and \\d{13} matches\
    \ the remaining 13 digits.\n\nDiscover also uses a simple pattern:\n\n## Text\n\
    \n```\nMasterCard: 5212345678901234\nVisa 1: 4123456789012\nVisa 2: 412345678901235\n\
    Amex: 371234567890123\nDiscover: 60111234567890134\nDiners Club: 3881234567890123\n\
    ```\n\n## RegEx\n\n```\n6011\\d{14}\n```\n\n# Result\n\nMasterCard: 5212345678901234\n\
    Visa 1: 4123456789012\nVisa 2: 412345678901235\nAmex: 371234567890123\nDiscover:\
    \ 60111234567890134\nDiners Club: 3881234567890123\n"
