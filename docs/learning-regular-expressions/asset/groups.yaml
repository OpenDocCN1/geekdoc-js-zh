    # Matching One of Several Characters


    # Analysis


    The regular expression used here starts with [ns]; this matches either n or s
    (but not c or any other character). The opening [ and ] do not match any characters—they
    define the set. The literal a matches any character, \ matches the ., and the
    literal xls matches. When you use this pattern, only the three desired filenames
    are matched.


    > Actually, [ns]a.\xls is not quite right. If a file named usal.xls existed, it
    would match, (the opening u would be ignored and sal.xls would match). The solution
    to this problem involves position matching, which will be covered in Lesson 6,
    "Position Matching"


    As you can see, testing regular expressions can be tricky. Verifying that a pattern
    matches what you want is pretty easy. The real challenge is in verifying that
    you are not getting matches that you don''t.


    Character sets are frequently used to make searches (or specific parts thereof)
    not case sensitive.


    For example:


    # Text


    The phrase "regular expression" is often abbreviated as RegEx or regex.


    # RegEx


    [Rr]eg[Ee]x


    # Result


    The phrase "regular expression" is often abbreviated as RegEx or regex.


    # Analysis


    The pattern used contains two character sets: [Rr] matches R and r, and [Ee] matches
    E and e. This way, RegEx and regex are both matched. REGEX, however, would not
    match.


    # Tip


    If you are using matching that is not case sensitive, this technique would be
    unnecessary. This type of matching is used only when performing case-sensitive
    searches that are partially not case sensitive.'
