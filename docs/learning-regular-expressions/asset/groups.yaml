    The pattern is correct, and it will match any valid IP address. But that is not
    all it will match; invalid IP addresses will be matched, too.'
  - '[PAGE 74]


    An IP address is made up of 4 bytes, and the IP address presented as 12.159.46.200
    is a representation of 4 bytes. The four numbers in an IP address therefore have
    the range of values in a single byte, 0 to 255. This means that none of the numbers
    in an IP address may be greater than 255. Yet the pattern used will also match
    345 and 700 and 999, all invalid numbers within an IP address.


    > Note There is an important lesson here. It is easy to write regular expressions
    to match what you want and expect. It is much harder to write regular expressions
    to anticipate all possible scenarios so that they do not match what you do not
    want to match.


    It would be nice to be able to specify a range of valid values, but regular expressions
    match characters and have no real knowledge of what those characters are. Mathematical
    calculations are therefore not an option.


    Is there an option? Maybe. To construct a regular expression, you need to clearly
    define what it is to match and what you do not. Following are the rules defining
    the valid combinations in each number of an IP address:


    +   - Any one- or two-digit number.

    - Any three-digit number beginning with 1.

    - Any three-digit number beginning with 2 if the second digit is 0 through 4.

    - Any three-digit number beginning with 25 if the third digit is 0 through 5.


    When laid out sequentially like that, it becomes clear that there is indeed a
    pattern that can work. Here''s the example:


    ```

    Pinging hog.forta.com [12.159.46.200]

    with 32 bytes of data:

    ```


    ```

    (((25[0-5]) | (2[0-4]) | (1\d[2])) | (\d(1,2)))\.{3}

    ((25[0-5]) | (2[0-4]) | (1\d[2])) | (\d(1,2))))

    ```


