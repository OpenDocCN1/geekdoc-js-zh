    ## 引言


    正则表达式和正则表达式语言已经存在多年了。正则表达式专家长期以来一直拥有一项极其强大的工具，这种工具可以在几乎每种语言和每个平台上执行各种文本处理和操纵。


    这是一个好消息。但坏消息是，长期以来，正则表达式一直是极少数最精明的人士的专属财产。我们中的大多数人并没有完全理解正则表达式是做什么的，以及它们解决了什么问题。那些勇于挑战它们的人发现正则表达式的语法并不符合直觉，有时甚至非常晦涩。这很遗憾，因为事实是，正则表达式的复杂程度远没有初看时那么复杂。你只需要清楚地理解要解决的问题，以及如何利用正则表达式来解决它们。


    问题的部分源于该主题的高质量内容匮乏。关于正则表达式的少数书籍（事实上，大多数关于正则表达式教程的网站）倾向于集中在语法上，定义某些字符的作用以及与其他字符有何不同。但那是最简单的部分；正则表达式语言中的特殊字符并不多。棘手的部分在于理解如何使用这些字符来解决现实世界的问题。


    你手里拿的这本书并不是关于正则表达式所有已知知识的终极定论。如果那是你所需要的，你需要买一本 Jeffrey Friedl 的《精通正则表达式》（Mastering
    Regular Expressions, O''Reilly, ISBN 0596528214）。Friedl 先生是公认的正则表达式大师，他的书是该领域权威且最全面的。但是，无意冒
    Friedl 先生，他的书不是给学者看的——也不是给那些只想完成工作而不需要理解正则表达式引擎内部机制的普通用户看的。那些并不是有用信息——当你只想给你的
    HTML 表单添加验证，或简单地对解析后的文本执行常规操作时，它们就没用。如果你需要开始使用正则表达式，你会发现自己掌握的信息太少无法高效工作，而信息又多到让你无从何下手。


    这正是这本书大显身的地方。《学习正则表达式》将教你真正需要知道的正则表达式，从简单的文本匹配到更复杂的主题，包括反向引用、条件评估和预查处理。你将学会可以使用什么，并且将通过有规律、系统且简单的方法，通过清晰实用的示例和解决实际问题来学习它们。


    ## 谁应该学习正则表达式？


    这本书是为为你准备的：


    - 你是正则表达式的新手。

    - 你想快速学习如何充分利用正则表达式语言的优势。

    - 你想通过学习使用最强大（也最难理解）的工具之一来解决实际问题从而获得优势。

    - 你构建 Web 应用程序并渴望更复杂的表单和文本处理。

    - 你使用 JavaScript、Java。.NET、PHP、Python、MySQL（以及任何支持正则表达式的语言和数据库管理系统），并且你想学习如何在自己的应用程序开发中使用正则表达式。

    - 你想在正则表达式方面快速、轻松地提高效率，而无需向别人寻求帮助。


    所以，翻到第 1 节“介绍正则表达式”，开始行动吧。你很快就能驾驭正则表达式的力量，并感叹以前没有它们的情况下是如何过过来的。


    ## 第 1 节：介绍正则表达式


    在本节中，你将学习什么是正则表达式，以及它们能为你做什么。


    ### 理解需求


    正则表达式（通常缩写为 RegEx 或 regex）是一种工具，和所有工具一样，正则表达式的设计是为了解决非常特定的问题。理解正则表达式及其作用的最佳方法，是理解它们所解决的问题。


    考虑以下场景：


    - 你正在搜索一个包含文本 `car`（不区分大小写）的文件，但不想定位到单词中间的 `car`（例如 `scar`、`carry` 和 `incarcerate`）。

    - 你正在生成一个网页，需要显示从数据库检索的文本。该页面可能包含 URL，你希望这些 URL 在生成的页面中是可以点击的（因此不是只生成文本，而是生成有效的
    HTML `<a href="#">`）。

    - 你创建了一个程序，提示用户输入信息，包括电子邮件地址。你需要验证指定的地址格式是否正确（在语法上是有效的）。

    - 你正在编辑源代码，需要将所有的 `size` 出现替换为 `iSize`，但仅针对 `size` 本身，而不是作为另一个单词一部分的 `size`。

    - 你正在显示计算机文件系统中所有文件的列表，并想要进行过滤，以便定位包含文本 `Application` 的文件。

    - 你正在将数据导入应用程序。该数据是用制表符分隔的，而你的应用程序支持 CSV 文件（每行一个记录，逗号分隔值，每个值用引号括起来）。

    - 你需要搜索包含特定文本的文件，但仅限于特定位置（可能是行首或句尾）。


    所有这些场景都提出了独特的编程挑战。它们都可以像几乎任何支持条件处理和字符串操作的语言一样被解决。但解决方案会变得复杂到什么程度呢？你需要一次遍历单词或字符，执行各种
    `if` 语句，跟踪大量的日志以知道你找到了什么、没找到什么，检查空格和特殊字符，而且你必须一遍又一遍地做这一切。


    你可以使用正则表达式。上述每个挑战都可以使用编写良好的语句来解决——包含文本和特殊指令的极其精简的字符串——这些语句可能像这样：


    ```

    \b [Cc] [Rr] \b

    ```


    > 注意

    > 如果上一行看起来还没有意义，不要担心；它很快就会显示出来。


    ### 正则表达式是如何被使用的


    再次看这些问题场景，你会发现它们都属于两种类型之一：要么是在定位信息（搜索），要么是在定位信息并编辑信息（替换）。事实上，最简单的情况是，所有的正则表达式都用于：搜索和替换。每一个正则表达式要么匹配文本（执行搜索），要么匹配或替换文本（执行替换）。


    ### RegEx 搜索


    当搜索的文本具有高度动态性时，正则表达式被用于搜索，例如在前面描述的场景中搜索 `car`。首先，你需要定位 `car` 或 `CAR` 或 `Car` 甚至是
    `CaR`；这是简单的部分（很多搜索都能够执行不区分大小写的搜索）。更棘手的部分是确保 `scar`、`carry` 和 `incarcerate` 不被匹配。一些高级编辑器有“仅匹配单词”的功能，但很多没有，而且你可能并不是在正在编辑的文档中进行此更改。使用正则表达式进行搜索而不是仅仅使用文本
    `car` 解决了这个问题。


    > 提示

    > 想知道这个问题的解决方案是什么吗？你已经看过了——它就是之前显示的示例语句 `\b[Cc] [Rr] \b`。


    值得注意的是，测试相等性（例如，用户指定的电子邮件地址是否匹配此正则表达式）是一种搜索操作。搜索的是整个用户字符串（与通常子字符串搜索相反）。


    ### RegEx 替换


    正则表达式搜索非常强大、非常有用，而且并不难。很多你将遇到的课程和示例都是匹配。然而，正则表达式真正的威力在于替换操作，例如在之前的场景中你在文中替换 URL（可能是搜索以
    `http://` 或 `https://` 开头并在点、逗号或空格结尾的字符串）。这还需要你将找到的 URL 替换为嵌入的 HTML，因此：


    ```

    http://www.forta.com/

    ```


    替换为


    ```html

    <a href="http://www.forta.com/">http://www.forta.com/</a>

    ```


    或者可能定位的文本只是一个地址，而不是完全的 URL，例如：www.forta.com


    这也需要转换为 `<a href="http://www.forta.com/">http://www.forta.com/</a>`


    大多数应用程序中的搜索和替换选项无法处理这种替换操作，但使用正则表达式这非常简单。


    '
