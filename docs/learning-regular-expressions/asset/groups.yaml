    ## 总结


    子表达式用于将表达式的各个组合在一起，并使用 `(` 和 `)` 定义。子表达式的常见用途包括能够精确控制重复元字符所重复的内容，以及正确地定义 OR 条件。如果需要，子表达式可以嵌套。


    ## 第 8 节


    ## 使用反向引用


    上一节引入了子表达式，作为将字符分组为集合的方法。这种分组的主要用途是能够正确地控制重复的模式匹配（如在该节中所示）。本节将介绍子表达式的另一个重要用途——配合反向引用工作。


    ## 理解反向引用


    理解反向引用需求的最佳方法是看一个示例。HTML 开发者使用 `<h1>` 到 `<h6>` 标签以及相应的结束标签 `</h1>` 来在网页中定义和格式化标题文本。假设你需要定位所有的标题文本，无论标题级别如何。这里是示例：


    ### 文本


    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br>

    <h2>SQL</h2>

    Information about SQL

    <h2>Regex</h2>

    Information about Regular Expressions.

    </body>

    ```


    ### 正则表达式


    ```regex

    <[hH]1.*</[hH]1>

    ```


    ### 结果


    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br>

    <h2>SQL</h2>

    ```


    Information about SQL.


    <h2>Regex</h2>


    Information about Regular Expressions.


    </body>

    ```


    ### 分析


    模式 `<[h1].*</[hH]1>` 匹配了第一个标题（从 `<h1>` 到 `</h1>`），并且也会匹配 `<H1>`（因为 HTML 是不区分大小写的）。但可以使用什么模式来匹配任何标题（可能使用六个有效标题级别中的任何一个）呢？


    一种方案是使用简单的范围 1，如下所示：


    ### 文本


    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>Regex</h2>

    Information about Regular Expressions.

    </body>

    ```


    ### 正则表达式


    ```regex

    <[hH][1-6]>.*.*?</[hH][1-6]>

    ```


    ### 结果


    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>Regex</h2>

    Information about Regular Expressions.

    </body>

    ```


    ### 分析


    这似乎起作用了；`<[hH][1-6]>` 匹配任何标题标签（例如 `<h1>` 和 `<h2>`），而 `</[hH][1-6]>` 匹配任何标题结束标签（`</h1>`
    和 `</h2>`）。


    ## 理解反向引用


    **注意**

    注意这里使用了 `.*?`（懒惰），而不是 `.*`（贪婪）。正如第 5 节“重复匹配”所解释的，量词 `*` 是贪婪的，因此模式 `<[h][1-6]>.*</[hH][1-6]>`
    可能会从第二行的起始 `<h1>` 一直匹配到以 `</h2>` 结尾的第六行。使用懒惰量词 `.*?` 解决了这个问题。我说“是”而不是“将”，因为这个特定的示例即使使用贪婪量词也能正常工作。元字符
    `.` 通常不匹配换行符，在这个示例中，每个标题都单独成行。在这里使用懒惰量词没有副作用，所以何未患于其备。


    成功了吗？不完全是。看下面的示例（使用相同的模式）：


    ### 文本

    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>Regex</h2>

    Information about Regular Expressions.

    <h2>This is not valid HTML</</h3>

    </body>

    ```


    ### 正则表达式

    ```text

    [hH][1-6].*?</[hH][1-6]

    ```


    ### 结果

    ```html

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>Regex</h2>

    Information about Regular Expressions.

    <h2>This is not valid HTML</</h3>

    </body>

    ```


    ### 分析

    一个以 `<h2>` 开头并以 `</h3>` 结尾的标题标签是无效的，但这里使用的模式却匹配了它。


    问题在于匹配的第二部分（匹配结束标签的部分）并不知道匹配的第一部分（匹配起始标签的部分）。而这正是反向引用变得非常有用的地方。


    ## 使用反向引用进行匹配


    我们很快会回到标题问题。现在让我们看一个更简单的示例，一个如果不使用反向引用完全无法解决的示例。


    假设你有一段文本，想要定位所有重复的单词（拼写错误，即同一个单词错误地出现了两次）。显然，在搜索单词的第二次出现时，必须知道该单词。反向引用允许正则模式引用之前的匹配。


    理解此点的最佳方法是看它的用法，这里有一些包含三组重复单词的文本，所有这些都需要定位：


    ### 文本


    这是一段文本，这里有几个单词重复了，而它们不应该是重复的。


    ### 正则表达式


    ```regex

    (\w+)\s+\1

    ```


    ### 结果


    这是一段文本，这里有几个单词重复了，而它们不应该是重复的。


    ### 分析


    该模式显然起作用了，但它是如何工作的？`\s+` 匹配一个或多个空格，`\w+` 匹配一个或多个字母数字字符，而 `\1` 匹配之前的内容。（注：由于提供的原始文本存在大量重复和
    OCR 错误，此处已根据核心逻辑提取并翻译）。


    '
