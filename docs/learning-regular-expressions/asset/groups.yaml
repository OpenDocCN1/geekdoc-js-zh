    # Specifying Hexadecimal or Octal Values


    Although you''ll not find yourself needing to refer to specific characters by
    their octal hexadecimal value, it is worth noting that this is doable.


    # Using Hexadecimal Values


    Hexadecimal (base 16) values may be specified by preceding them with \x. Therefore,
    \x0A (ASCII character 10, the linefeed character) is functionally equivalent to
    \n.


    # Using Octal Values


    Octal (base 8) values may be specified as two- or three-digit numbers preceded
    by \0. Therefore, \011 (ASCII character 9, the tab character) is functionally
    equivalent to \t.'
  - '[PAGE 43]


    # Using POSIX Character Classes


    Note


    Many regular expression implementations also allow the specification of control
    characters using \c. For example, \cZ would match Ctrl-Z. In practice, you''ll
    find very little for this syntax.


    # Using POSIX Character Classes


    A lesson on metacharacters and shortcuts for various character sets would not
    be complete without a mention of the POSIX character classes. POSIX is a special
    set of standard character classes, and these are another form of shortcut that
    is supported by many (but not all) regular expression implementations.


    Note


    Javascript does not support the use of POSIX character classes in regular expressions.


    Table 4.5 POSIX Character Classes

    | Class | Description |

    | [:alnum:] | Any letter or digit (same as [a-zA-Z0-9]) |

    | [:alpha:] | Any letter (same as [a-zA-Z]) |

    | [:blank:] | Space or tab (same as [\t]) |

    | [:cntrl:] | ASCII control characters (ASCII 0 through 31 and 127) |

    | [:digit:] | Any digit (same as [0-9]) |

    | [:graph:] | Same as [:print:] excludes space |

    | [:lower:] | Any lowercase letter (same as [a-z]) |

    | [:print:] | Any printable character |

    | [:punct:] | Any character that is neither [:alnum:] nor [:cntrl:] |

    | [:space:] | Any whitespace character including spaces (same as [\f\n\r\t\v])
    |

    | [:upper:] | Any uppercase letter (same as [A-Z]) |

    | [:xdigit:] | Any hexadecimal digit (same as [a-fA-F-9]) |'
- md: "\n# Lesson 4 Using Metacharacters\n\nThe POSIX syntax is quite different from\
    \ the metacharacters seen thus far. To demonstrate the use of POSIX classes, let's\
    \ revisit an example from Lesson 3. The example used a regular expression to locate\
    \ RGB values in a block of HTML code:\n\n# Text\n\n```\nbody {\n    background-color:\
    \ #fefbd;\n}\nh1 {\n    background-color: #0000ff;\n}\ndiv {\n    background-color:\
    \ #d0f4e6;\n}\nspan {\n    background-color: #f08970;\n}\n```\n\n# RegEx\n\n```\n\
    #[[:digit:]][[:digit:]][[:digit:]][[:digit:]][[:digit:]][[:digit:]]]\n```\n\n\
    # Result\n\n```\nbody {\n    background-color: #fefbd;\n}\nh1 {\n    background-color:\
    \ #0000ff;\n}\ndiv {\n    background-color: #d0f4e6;\n}\nspan {\n    background-color:\
    \ #f08970;\n}\n```\n\n# Analysis\n\nThe pattern used in the previous lesson repeated\
    \ the character set [0-9A-Fa-f] six times. Here each [0-9A-Fa-f] has been replaced\
    \ by [[:digit:]]. The result is the same.\n\nNotice that the regular expression\
    \ used here starts with [[ and ends with ]] (two sets of brackets). This is important\
    \ and required when using POSIX classes. POSIX classes are enclosed within [:\
    \ and :]; the POSIX we used is [:xdigit:] (not :xdigit:). The outer [ ] are defining\
    \ the set; the inner [ ] are part of the POSIX class itself. \n\nAll 12 POSIX\
    \ classes enumerated here are generally supported in any implementation that supports\
    \ POSIX. However, there may be subtle variances from the preceding descriptions.\n\
    \n# Summary\n\nBuilding on the basics of character and set matching shown in Lessons\
    \ 2 and 3, this lesson introduced metacharacters that match specific characters\
    \ (such as tab or linefeed) or entire sets of characters (such as digits or alphanumeric\
    \ characters). These shortcut metacharacters and POSIX classes may be used to\
    \ simplify regular expression patterns.\n\n# Lesson 5\n\n# Repeating Matches\n\
    \nIn the previous lessons, you learned how to match individual characters using\
    \ a variety of metacharacters and special class sets. In this lesson, you'll learn\
    \ how to match multiple repeating characters or sets of characters.\n\n# How Many\
    \ Matches?\n\nYou've learned all the basics of regular expression pattern matching,\
    \ but all the examples have had one very serious limitation. Consider what it\
    \ would take to write a regular expression to match an email address. The basic\
    \ format of an email address looks something like the following:\n\n```\ntext@text.text\n\
    ```\n\nUsing the metacharacters discussed in the previous lesson, you could create\
    \ a regular expression like the following:\n\n```\n\\w@\\w\\.\\w\n```\n\nThe \\\
    w would match alphanumeric characters (plus an underscore, which is valid in an\
    \ email address); @ does not need to be escaped, but . does.\n\nThis is a perfectly\
    \ regular expression, albeit a rather useless one. It would match an email address\
    \ that looked a@b.c (which, although syntactically legal, is obviously not a valid\
    \ address). The problem with it is that \\w matches a single character obviously\
    \ you can't know how many characters to test for. After all, the following are\
    \ all valid email addresses, but they all have a different number of characters\
    \ before the:\n\n```\nb@forta.com\nben@forta.com\nforta@forta.com\n```\n\nWhat\
    \ you need is a way to match multiple characters, and this is doable using one\
    \ of several special metacharacters.\n\n# Matching One or More Characters\n\n\
    To match one or more instances of a character (or set), simply append a + character.\
    \ + matches one or more characters (at least one; zero would not). Whereas a matches,\
    \ a+ matches one or more as. Similarly, whereas [0-9] matches any digits, [0-9]+\
    \ matches one or more consecutive digits.\n\n> > Tip When you use + with sets,\
    \ the + should be placed outside the set. Therefore, [0-9]+ is correct, or [0-9]+\
    \ is not. \n[0-9]+ is a valid regular expression, but it will not match one or\
    \ more digits. Rather, it defines a set of 0 through 9 or the + character, and\
    \ any single digit or plus sign will match. Although legal, it probably not what\
    \ you'd want.\n\nLet’s revisit the email address example, using this + to match\
    \ one or more characters:\n\nSend personal email to ben@forta.com. For questions\
    \ about a book use support@forta.com. Feel free to send unsolicited email to spams@forta.com\
    \ (wouldn't it be if it were that simple, huh?).\n\n```\n\\w+@\\w+\\.\\w+\n```\n\
    \nSend personal email to ben@forta.com. For questions about a book use supports@forta.com.\
    \ Feel free to send unsolicited email to spams@forta.com (wouldn't it be if it\
    \ were that simple, huh?).\n\nThe pattern matches all three addresses correctly.\
    \ The regular expression first matches one or more alphanumeric characters using\
    \ \\w+. Next it matches @ followed by one or more characters, again using \\w+.\
    \ It then matches \\. (using the escaped \\.) and another \\w+ to match the end\
    \ of the address.\n\n> > Tip + is a metacharacter. To match a + you'll need to\
    \ escape it as \\.\n\n+ can also be used to match one or more sets of characters.\
    \ To demonstrate this, the following example shows the same regular expression\
    \ but with slightly different text:\n\n# Text\n\nSend personal email to ben@forta.com\
    \ or ben.forta.com. For questions about a book use support@forta.com. If your\
    \ message is urgent try ben@urgent.forta.com. Feel free to send unsolicited email\
    \ to spams@forta.com (wouldn't it be nice if it were that simple, huh?)\n\n# RegEx\n\
    \n```\n\\w+@\\..\\w+\n```\n\n# Result\n\nSend personal email to ben@forta.com\
    \ or ben.forta.com. For questions about a book use support@forta.com. If your\
    \ message is urgent try ben@urgent.forta.com. Feel free to send unsolicited email\
    \ to spams@forta.com (wouldn't it be nice if it were that simple, huh?)\n\n# Analysis\n\
    \nThe regular expression matched five addresses, but two of them are incomplete.\
    \ Why is this? \\w+@\\.\\w+ makes no accommodations for . characters before the\
    \ @, and it allows a single _ separating the strings after a . Although ben.forta.com\
    \ is a perfectly legal email address, the regular matched only fora instead of\
    \ ben.forta because \\w matches alphanumeric characters but not . in the middle\
    \ of a string of text.\n\nWhat we need here is to either \\w or , or in regular\
    \ expression parlance, a set of {\\w\\}. Following is a revised example:\n\n#\
    \ Text\n\nSend personal email to ben@forta.com or ben.forta.com. For questions\
    \ about a book use support@forta.com. If your message is urgent try ben@urgent.forta.com.\
    \ Feel free to send unsolicited email to spam@forta.com (wouldn't it be nice if\
    \ it were that simple, huh?)\n\n# RegEx\n\n```\n[\\w.]+@[\\w.]+\\w+\n```\n\n#\
    \ Result\n\nSend email to benforta.com or ben.forta@forta.com. For questions a\
    \ book use support@forta.com. If your message is urgent try ben@urgent.forta.com.\
    \ Feel free to send unsolicited email to spams.com (wouldn't be nice if it were\
    \ simple, huh?)\n\n# Analysis\n\nThat seemed to do trick. [\\w.]+ matches one\
    \ or more instances of any alphanumeric character, underscore, and . so forta\
    \ is matched. [\\w.]+ is also used for the string after the @ so that deeper (or\
    \ host) names are matched.\n\n> Note\n\nNotice that for the final match, you used\
    \ \\w+ and not [\\w.]. Can you figure out why? Try using [\\w.] for the final\
    \ match and see what is wrong with the second, third, and fourth matches.\n\n\
    > Note\n\nYou'll notice that the . in the set was not escaped, and it matched\
    \ . anyway (it was treated as a literal to operate on a metacharacter). Generally,\
    \ metacharacters such as . and + are considered to be literal text within sets,\
    \ and they need not be escaped. However, escaping them does no harm. [\\w.] is\
    \ functionally equivalent to [\\w.].\n\n# Matching Zero or More Characters\n\n\
    + one or more characters. Zero characters will not match—has to be at least one.\
    \ But if you wanted to match optional characters so that zero characters would\
    \ be allowed?\n\nTo do this, you use * metacharacter. * is used exactly like;\
    \ it is placed right after a character or a set and will match zero or more instances\
    \ of the character or set. Therefore, pattern B.* Forta would match B Forta, B.\
    \ Forta, Ben Forta, and other combinations, too.\n\nTo demonstrate the +, take\
    \ a look at a modified version of the email example:\n\n# Text\n\nHello .benforta.com\
    \ is my email address.\n```\n"
  mdcn: "\n\n# 第 4 Lesson 使用元字符\n\nPOSIX 语法与目前为止看到的元字符非常不同。为了演示 POSIX 类的用法，让我们重新回顾第\
    \ 3 中的一个示例。该示例使用正则表达式来定位 HTML 代码块中的 RGB 值：\n\n# 文本\n\n```\nbody {\n    background-color:\
    \ #fefbd;\n}\nh1 {\n    background-color: #0000ff;\n}\ndiv {\n    background-color:\
    \ #d0f4e6;\n}\nspan {\n    background-color: #f08970;\n}\n```\n\n# 正则表达式\n\n```\n\
    #[[:digit:]][[:digit:]][[:digit:]][[:digit:]][[:digit:]][[:digit:]]]\n```\n\n\
    # 结果\n\n```\nbody {\n    background-color: #fefbd;\n}\nh1 {\n    background-color:\
    \ #0000ff;\n}\ndiv {\n    background-color: #d0f4e6;\n}\nspan {\n    background-color:\
    \ #f08970;\n}\n```\n\n# 分析\n\n上一节中使用的模式重复了字符集 [0-9A-Fa-f] 六次。在这里，每个 [0-9A-Fa-f]\
    \ 都被替换为 [[:digit:]]。结果是相同的。\n\n注意，这里使用的正则表达式以 [[ 开头并以 ]] 结尾（两组括号）。在使用 POSIX 类时，这是非常重要且必须的。POSIX\
    \ 类被包含在 [: 和 :]; 之间；我们使用的 POSIX 类是 [:xdigit:]（而不是 :xdigit:）。外层的 [ ] 用于定义集合；内层的\
    \ [ ] 是 POSIX 类本身的一部分。\n\n在此处列出的所有 12 个 POSIX 类通常在任何支持 POSIX 的实现中都能得到支持。然而，与之前的描述可能存在细微差异。\n\
    \n# 总结\n\n在第 2 和第 3 节所示字符和集合匹配的基础上，本节引入了匹配特定字符（如制表符或换行符）或整个字符集（如数字或字母数字）的元字符。这些快捷元字符和\
    \ POSIX 类可以简化正则表达式模式。\n\n# 第 5 Lesson\n\n# 重复匹配\n\n在之前的几节中，你学习了如何使用各种元字符和特殊类集来匹配单个字符。在本节中，你将学习如何匹配多个重复的字符或字符集。\n\
    \n# 匹配多少次？\n\n你已经学习了正则表达式模式匹配的所有基础知识，但所有的示例都有一个非常严重的局限性。考虑一下编写一个匹配电子邮件地址的正则表达式需要什么。一个电子邮件地址的基本格式看起来如下：\n\
    \n```\ntext@text.text\n```\n\n使用上一节讨论过的元字符，你可以创建一个如下所示的正则表达式：\n\n```\n\\w@\\w\\\
    .\\w\n```\n\n\\w 会匹配字母和数字字符（加上下划线，这在电子邮件地址中是有效的）；@ 不需要转义，但 . 需要。\n\n这是一个完全正确的正则表达式，尽管它相当没用。由于它会匹配像\
    \ a@b.c 这样的电子邮件地址（尽管这在语法上是合法的，但显然不是一个有效的地址）。它的问题在于 \\w 匹配单个字符，显然你无法知道需要测试多少个字符。毕竟，以下都是有效的电子邮件地址，但它们在冒号之前的字符数量各不相同：\n\
    \n```\nb@forta.com\nben@forta.com\nforta@forta.com\n```\n\n你需要的是一种匹配多个字符的方法，这可以使用几种特殊元字符之一来实现。\n\
    \n# 匹配一个或多个字符\n\n要匹配一个或多个实例字符（或集合），只需在后面添加一个 + 字符即可。+ 匹配一个或多个字符（至少一个；零个不匹配）。而\
    \ a 匹配，a+ 则匹配一个或多个 a。同样，而 [0-9] 匹配任何数字，[0-9]+ 则匹配一个或多个连续数字。\n\n> > 提示 当你对集合使用\
    \ + 时，+ 应该放在集合外面。因此，[0-9]+ 是正确的，而 [0-9]+ 是不正确的。 \n[0-9]+ 是一个有效的正则表达式，但它不会匹配一个或多个数字。相反，它定义了一个\
    \ 0 到 9 或 + 字符的集合，任何单个数字或加号都会匹配。虽然它是合法的，但可能不是你想要的。\n\n让我们重新回到电子邮件地址示例，使用这个 + 来匹配一个或多个字符：\n\
    \n向 ben@forta.com 发送个人邮件。关于书的问题请使用 support@forta.com。欢迎向 spams@forta.com 发送未经请求的邮件（如果那么简单就好了，不是吗？）。\n\
    \n```\n\\w+@\\w+\\.\\w+\n```\n\n向 ben@forta.com 发送个人邮件。关于书的问题请使用 supports@forta.com。欢迎向\
    \ spams@forta.com 发送未经请求的邮件（如果那么简单就好了，不是吗？）。\n\n该模式正确地匹配了三个地址。正则表达式首先使用 \\w+ 匹配一个或多个字母数字字符。接下来，它匹配\
    \ @ 后面跟一个一个或多个字符，再次使用 \\w+。然后它匹配 \\.（使用转义的 \\.）和另一个 \\w+ 来匹配地址的结尾。\n\n> > 提示 +\
    \ 是一个元字符。要匹配 +，你需要将其转义为 \\.\n\n+ 也可以用于匹配一个或多个字符集。为了演示这一点，接面的示例显示了相同的正则表达式，但文本略有不同：\n\
    \n# 文本\n\n向 ben@forta.com 或 ben.forta.com 发送个人邮件。关于书的问题请使用 support@forta.com。如果你的消息很紧急，请尝试\
    \ ben@urgent.forta.com。欢迎向 spams@forta.com 发送未经请求的邮件（如果那么简单就好了，不是吗？）\n\n# 正则表达式\n\
    \n```\n\\w+@\\..\\w+\n```\n\n# 结果\n\n向 ben@forta.com 或 ben.forta.com 发送个人邮件。关于书的问题请使用\
    \ support@forta.com。如果你的消息很紧急，请尝试 ben@urgent.forta.com。欢迎向 spams@forta.com 发送未经请求的邮件（如果那么简单就好了，不是吗？）\n\
    \n# 分析\n\n该正则表达式匹配了五个地址，但其中两个是不完整的。这是为什么呢？\\w+@\\.\\w+ 没有考虑到 @ 之前的 . 字符，并且它允许在\
    \ . 之后的字符串用单个 _ 分隔。虽然 ben.forta.com 是完全合法的电子邮件地址，但正则表达式只匹配了 fora 而不是 ben.forta，因为\
    \ \\w 匹配字母数字字符，但不匹配文本字符串中间的 .。\n\n我们需要的是 \\w 或者 . ，或者用正则表达式的术语来说，一个集合 {\\w}。以下是一个修改后的示例：\n\
    \n# 文本\n\n向 ben@forta.com 或 ben.forta.com 发送个人邮件。关于书的问题请使用 support@forta.com。如果你的消息很紧急，请尝试\
    \ ben@urgent.forta.com。欢迎向 spam@forta.com 发送未经请求的邮件（如果那么简单就好了，不是吗？）\n\n# 正则表达式\n\
    \n```\n[\\w.]+@[\\w.]+\\w+\n```\n\n# 结果\n\n向 benforta.com 或 ben.forta@forta.com\
    \ 发送邮件。关于书的问题请使用 support@forta.com。如果你的消息很紧急，请尝试 ben@urgent.forta.com。欢迎向 spams.com\
    \ 发送未经请求的邮件（如果简单就好了，不是吗？）\n\n# 分析\n\n这似乎起作用了。[\\w.]+ 匹配一个或多个字母数字字符、下划线和 . 的实例，因此\
    \ forta 被匹配了。[\\w.]+ 也用于 @ 之后的字符串，以便匹配深层（或主机）名称。\n\n> > 注意 注意，对于最后一个一次匹配，你使用了\
    \ \\w+ 而不是 [\\w.]。你能猜出为什么吗？尝试对最后一个匹配使用 [\\w.]，看看第二、第三和第四次匹配出了问题。\n\n> > 注意 你会注意到集合中的\
    \ . 没有被转义，它仍然匹配了 .（它被视为字面量来操作元字符）。通常，元字符 . 和 + 在集合内部被视为字面文本，不需要转义。然而，转义它们没有害。[w.]\
    \ 与 [\\w.] 功能等同。\n\n# 匹配零或多个字符\n\n+ 匹配一个或多个字符。零个字符不匹配——至少有一个。但如果你想匹配可选字符以便允许零个字符？\n\
    \n要做到这一点，你使用 * 元字符。* 的用法与完全相同；它放在字符或集合之后，并将匹配零或多个该字符或集合的实例。因此，模式 B.* Forta 会匹配\
    \ B Forta、B. Forta、Ben Forta 以及其他组合。\n\n为了演示 +, 请看电子邮件示例的修改版本：\n\n# 文本\n\nHello\
    \ .benforta.com 是我的电子邮件地址。\n```\n\n"
