    # Lesson 9


    # Looking Ahead and Behind


    All the expressions used thus far have matched text, but sometimes you may want
    to use expressions to mark the position of text to be matched (in contrast to
    the matched text itself). This involves the use of *lookaround* (the capability
    to look ahead and behind), which will be explained in this lesson.


    # Introducing Lookaround


    Again, we''ll start with an example. You need to extract the title of a Web page;
    HTML page titles are placed between `<title>` and `</title>` tags in the `<head>`
    section of HTML code. Here''s the example:


    # Text


    ```

    <head>

    <title>Ben Forta''s Homepage</title>

    </head>

    ```


    # RegEx


    ```

    <[tT] [ii] [lL] [eE].*\/<tT] [ii] [tt] [lL] [eE>

    ```


    # Result


    ```

    <head>

    <title>Ben Forta''s Homepage</title>

    </head>

    ```


    # Analysis


    <[tT] [ii] [lL] [eE].*\/<tT] [ii] [tt] [lL] [eE> matches the opening `<title>`
    tag (in upper, lower, or mixed case), the closing `</title>` tag, and whatever
    text is between them. That worked.'
