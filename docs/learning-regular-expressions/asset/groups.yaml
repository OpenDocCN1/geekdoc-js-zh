    # Lesson 11 Regular Expression Solutions to Common Problems


    # Analysis


    All Discover cards are 16 digits and start with digits 6011; 6011\d{14} does the
    trick.


    Diners Club is a little trickier:


    # Text


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901


    # RegEx


    ```

    `30[0-5]|36|38)\d{11}`

    ```


    # Result


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901


    # Analysis


    Diners Club are 14 digits and begin with 300 through 305, 36, or 38. If the opening
    digits are 300 through 305, an additional 12 digits are needed. To make this simpler,
    the pattern matches the first three digits regardless of what they are. `30[0-5]|36|38)\d{11}`
    has three expressions, any of which must match; `30[0-5]` matches 300 through
    305, 36\d matches any three-digit number starting with 36, and 38 matches any
    three-digit number starting with 38. This way, `d{11}` can be used to match the
    remaining 11 digits.


    All remains now a way to check any of the card types used here:


    # Text


    MasterCard: 521234567890124

    Visa 1: 41234567890122

    Visa 2: 412345678901235

    Amex: 371234567890123

    Discover: 60111234567890123

    Diners Club: 388112345678901'
