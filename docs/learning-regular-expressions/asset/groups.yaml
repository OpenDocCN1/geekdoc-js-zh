    ## 匹配空白字符


    元字符通常分为两类：用于匹配文本的字符（例如 `.`）和作为正则表达式语法一部分的字符（例如 `{` 和 `}`）。你将发现许多这两类型的元字符，从空白元字符开始学习。


    当你执行正则表达式搜索时，你通常需要匹配嵌入在文本中的非打印空白字符。例如，你可能需要找到所有的制表符，或者你可能需要找到换行符。由于直接在正则表达式中输入这些字符会非常棘手（至少可以这么说），你可以使用表
    4.1 中列出的特殊元字符。


    ## 表 4.1 空白元字符


    | 元字符 | 描述 |

    |--- | --- |

    | \b | 退格符 |

    | \f | 换页符 |

    | \n | 换行符 (行进) |

    | \r | 回车符

    | \t | 制表符 |

    | \v | 垂直制表符 |


    让我们来看一个例子。以下文本块包含系列以逗号分隔格式（通常称为 CSV）的记录。在处理这些记录之前，你需要删除数据中的任何空行。示例所示：


    ### 文本


    ```

    "101","Ben","Forta"

    "102","Jim","James"


    "103","Roberta","Robertson"

    "104","Bob","Bobson"

    ```


    ### 正则表达式


    ```

    \r\n\r\n

    ```


    ### 结果


    ```

    "101","Ben","Forta"

    "102","Jim","James"


    "103","Roberta","Robertson"

    "104","Bob","Bobson"

    ```


    ## 分析


    `\r\n` 匹配回车换行组合，Windows 用它作为行结束标记。搜索 `\r\n\r` 因此会匹配两个行结束标记，从而匹配两条记录之间的空行。


    ## 提示


    我刚刚提到 `\r\n` 被 Windows 用作行结束标记。然而，Unix (Linux) 以及 Mac OSX 系统仅使用换行符。在这些系统上，你可能只想使用
    `\n`（而不是 `\`）。理想的正则表达式可能应该兼顾两者——一个可选的 `\n` 和一个必需的 `\n`。你将在下节课中回顾这个示例。


    你可能会发现 `\r`、`\n` 以及 `\t` (制表符) 的用法。其他空白字符使用频率较低。


    ## 注意


    你已经看到了元字符的变体。`.` 和 `[` 都是元字符，除非它们被转义。例如，`\f` 和 `\n` 只有在被转义时才是元字符。如果不转义，它们就是仅匹配自身的普通字符。


    ## 匹配特定字符类型


    到目前，你已经学习了如何匹配特定字符、任意字符（使用 `.`）以及字符集中的字符（使用 `[]`），以及如何取反匹配（使用 `^`）。字符集（匹配集合中的一个）是最常见的匹配形式，而特殊的元字符可以代替常用的集合。这些元字符被称为匹配字符类。字符类元字符并不是必需（你始终可以枚举要匹配的字符或使用范围），但你无疑会发现它们非常有用。


    ## 注意


    这里列出的类是几乎所有正则表达式实现都支持的基础知识。


    ## 匹配数字和非数字


    正如你在第 3 节中学到的，`[0-9]` 是 `[0123456789]` 的简写，用于匹配任何数字。要匹配数字以外的任何内容，可以将集合取反为 `[^0-9]`。表
    4.2 列出了数字和非数字的类快捷方式。


    ## 第 4 节 使用元字符


    ## 表 4.2 数字元字符


    | 元字符 | 描述 |

    |---|---|

    | \d | 任意数字（同于 [0-9]） |

    | \D | 任意非数字（同于 [^0-9]） |


    为了演示这些元字符的使用，让我们回顾之前的示例：


    ### 文本


    ```

    var myArray = new Array();


    if (myArray[0] == 0) {


    }

    ```


    ### 正则表达式


    ```

    myArray\\d\

    ```


    ### 结果


    ```

    var myArray = new Array();


    if (myArray[0] == 0) {


    }

    ```


    ### 分析


    `[\d` 匹配任何单个数字，`\d` 匹配，因此 `myArray\[d]` 匹配 `myArray[0]`。`myArray\[d]` 是 `myArray\[0-9]`
    的简写，而它是 `myArray\[0123456789]` 的简写。这个正则表达式也会匹配 `myArray[1]`、`myArray[2]` 等（但不会匹配
    `myArray[10]`）。


    ## 提示


    正如你所见，定义任何正则表达式总有多种方法。自由选择你熟悉的语法即可。


    ## 警告


    正则表达式语法是区分大小写的。`\d` 匹配数字。`\D` 是 `\d` 的完全相反的；它只匹配非数字。你接下来看到的字符类元字符也是如此。即使在执行不区分大小写的匹配时也是如此，即匹配的文本不区分大小写，但特殊字符（如
    `\d`）是区分大小写的。


    ## 匹配字母数字字符（非字母数字字符）


    另一个经常使用的集合是所有字母数字字符，A 到 z（大小写）、数字和下划线（通常用于文件名和目录名、应用程序变量名、数据库对象名等）。表 4.3 列出了字母数字字符和非字母数字字符的类快捷方式。


    '
