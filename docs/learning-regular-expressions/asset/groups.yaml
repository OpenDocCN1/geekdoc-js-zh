    # 学习正则表达式


    BEN FORTA


    ## 学习正则表达式


    ## Pearson Addison–Wesley 学习系列


    访问 informit.com/learningseries 获取所有可用出版物的完整列表。


    Pearson Addison-Wesley 学习系列是一系列实战编程指南，旨在帮助你快速学习新技术或新语言，以便你立即应用所学到的任何内容。


    每本书书都附有文中构建的一个或多个应用程序的示例代码。这些代码经过了完整的注释，可以自由地复用到你自己的项目中，而无任何限制。许多章节的末尾都有一系列练习，鼓励你重新审视刚刚学习的内容，并作为学习的一部分对代码进行修改或调整。


    该系列书籍采用了简单的方法：它们让你立即上手，并让你具备离开后构建自己应用程序的能力，并将该语言或技术应用于你正在从事的任何工作中。


    请确保与我们保持联系！informit.com/socialconnect


