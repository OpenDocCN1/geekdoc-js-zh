    注意：正则表达式源于 20世纪 50 年代数学领域的研究。多年后，源自这些早期工作的原理和思想进入了 Unix 世界，进入 Perl 语言以及如 `grep`
    等工具。多年来，正则表达式（用于之前描述的场景）曾是 Unix 社区的专属领域，但现在情况已经改变，几乎几乎每个计算平台都支持各种形式的正则表达式。


    为了让大家直观地理解这一点，以下都是有效的正则表达式（它们在稍后都会变得浅俗易懂）：


    - * Ben*

    - " "

    - `www\.forta.com`

    - `[a-zA-Z0-9]*`

    - `<[H]1.*</[H]1>`

    - `\r\n\r`

    - `\d{3,3}-\d{3,4}`


    需要注意的是，语法是掌握正则表达式中最简单的部分。然而，真正的挑战在于学习如何应用语法，如何将问题分解为可以解决的正则解决方案。这并不是仅仅通过读书就能学会的，但就像任何语言一样，精通源于实践。


    ## 使用正则表达式


    如前所述，并没有一个所谓的“正则表达式程序”；它不是你现在运行的软件或购买的应用程序。相反，正则表达式实现在许多软件产品、语言、工具和开发环境中。


    正则表达式如何使用，以及表达式功能在不同应用程序之间有何不同。某些应用程序通过菜单和对话框来访问正则表达式，而编程语言通常提供暴露正则功能的函数或类（class）。


    此外此外，并不是所有正则表达式的实现都是相同的。在语法和功能之间通常存在细微的（有时并不那么细微）的差异。


    附录 A，“流行应用程序和语言中的正则表达式”提供了许多支持正则表达式的应用程序和语言的使用细节和说明。在继续下一节之前，请参考附录以了解你将使用的应用程序或语言的细节。


    ## 总结


    为了帮助你快速上手，你可以在本书的 Web 页面找到在线正则表达式测试工具的链接：


    http://forta.com/books/0134757068/


    这些在线工具通常是实验正则表达式最简单的方法。


    ## 在开始之前


    在继续之前，请注意以下几个重要点：


    - 使用正则表达式时，你会发现某些问题几乎总有多种解决方案。有些更简单，有些更快，有些更具移植性，有些功能更强。编写正则表达式时，很少有绝对对错之分（当然，只要你的方案有效即可）。

    - 正如所述，不同的正则实现之间存在差异。书中使用的示例和课程尽可能适用于所有主流实现，差异或不兼容之处将对此作此类说明。

    - 就像任何语言一样，学习正则表达式的关键是实践、实践、再实践。


    > 注意

    > 我强烈建议你在阅读此书时，尝试每一个示例。


    ## 总结


    正则表达式是文本处理中提供的强大工具之一。正则表达式语言用于构建正则表达式（实际构建的字符串被称为正则表达式），而正则表达式则用于执行搜索和替换操作。


    ## 第 2 节


    ## 匹配单字符


    在本节中，你将学习如何对一个或多个字符进行简单的字符匹配。


    ## 匹配字面文本


    "Ben" 是一个正则表达式。因为它是纯文本，它看起来可能不像正则表达式，但它确实是。正则表达式可以包含纯文本（甚至可以*仅包含纯文本*）。诚然，这对正则表达式的处理来说是完全的浪费，但这是一个很好的开始点。


    所以，开始吧：


    ### 文本


    ```

    Hello, my name is Ben. Please visit

    my website at http://www.forta.com/.

    ```


    ### 正则


    ```

    Ben

    ```


    ### 结果


    ```

    Hello, my name is Ben. Please visit

    my website at http://www.forta.com/.

    ```


    ### 分析


    这里使用的正则表达式是字面文本，它匹配了原始文本中的 Ben。


    ### 注意


    - 在示例中，你会发现匹配的文本被阴影标记。我们将在书中使用这种格式，以便你清楚地看到示例匹配了什么。


    让我们看另一个相同搜索文本但不同正则表达式的示例：


    ### 文本


    Hello, my name is Ben. Please visit my website at http://www.forta.com/.


    ### 正则


    ```

    my

    ```


    ### 结果


    Hello, my name is Ben. Please visit my website at http://www.forta.com/.


    ### 分析


    my 也是静态文本，但注意两个 my 是如何匹配的。


    ### 有多少匹配？


    大多数正则表达式引擎的默认行为是返回第一个匹配项。在前面的示例中，第一个通常是匹配项，但第二个不是。


    那么，产生了两个匹配吗？大多数正则实现都提供了一种机制来获取所有匹配项的列表（通常以数组或其他特殊格式返回）。例如，在 JavaScript 中，使用可选的
    `g`（全局）标志会返回一个包含所有匹配项的数组。


    > 参考附录 A，“流行应用程序和语言中的正则表达式”，学习如何在你的语言或工具中执行全局匹配。


    ## 处理大小写


    正则表达式是区分大小写的，因此 Ben 不会匹配 ben。然而，大多数实现支持不区分大小写的匹配。例如，JavaScript 用户可以指定可选的 `i` 标志来强制进行不区分大小写的搜索。


    > 参考附录 A了解如何使用你的语言或工具执行不区分大小写的搜索。


    ## 匹配任意字符


    到为止，正则表达式只匹配了静态文本——这确实很令人乏味。接下来我们将查看匹配未知字符。


    在正则表达式中，特殊字符（或字符集）用于标识要搜索的内容。`.` 字符（点或句号）匹配任意一个字符。


    因此，搜索 `c.t` 将匹配 cat 和 cot（以及许多其他无意义的词）。


    这是一个示例：


    ### 文本


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### 正则


    ```

    sales.

    ```


    ### 结果


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### 分析


    这里使用正则 sales. 来查找所有以 sales 开头并跟着另一个字符的文件。九个文件中有三个符合模式。


    > 提示

    > 你经常会看到模式（pattern）一词用来描述实际正则表达式。


    ### 注意


    注意正则表达式匹配的是字符串内容。匹配项并不总是整个字符串，而是匹配模式的字符——即使它们是字符串的一部分。在将正则表达式的结果传递给其他代码或应用程序进行处理时，记住这一点非常重要。


    `.` 匹配任意字符，包括字母、数字甚至 `.` 本身：


    ### 文本


    ```

    sales.xls

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### 正则


    ```

    sales.

    ```


    ### 结果


    ```

    sales.xls

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### 分析


    这个示例包含一个可选的文件 sales.xls。该文件被模式 sales. 匹配，因为 `.` 匹配任意字符。


    可以使用多个 `.` 实例，可以挨挨使用（使用 `. .` 将匹配任意相邻的两个字符），也可以位于模式的不同位置。


