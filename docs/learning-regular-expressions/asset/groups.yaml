    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    # Analysis


    This example contains one optional file, sales.xls. The file was matched by the
    pattern sales. as . matches any character.


    Multiple instances of . may be used, either together (one after the other—using
    . . will match any two characters next to each other) or in different locations
