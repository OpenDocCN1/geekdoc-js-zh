    # RegEx Replace


    Regular expression searches are immensely powerful, very useful, and not difficult
    to learn. As much, many of the lessons and examples that you will run into are
    matches. However, the real power of regex is in replace operations, such as in
    the earlier scenario in which you replace URLs to locate URLs within text (perhaps
    searching for strings that start with http:// or https:// and ending with a period
    or a comma or whitespace). Then it also requires that you replace the found URL
    with two occurrences of the matched string with embedded HTML so:


    ```

    http://www.forta.com/

    ```


    is replaced with


    ```

    <a href="http://www.forta.com">http://www.forta.com/</a>

    ```


    Or perhaps the text being located is just an address, and not a fully qualified
    URL, like this: www.forta.com


    which would also need to be turned into <a href="http://www.forta.com">http://www.forta.com/</a>


    The Search and Replace option in most applications could not handle this type
    of replace operation, but this is incredibly easy using a regular expression.


    # So What Exactly Is a Regular Expression?


    Now that you know regular expressions are used for, a definition is in order.
    Simply put, regular expressions are strings that are used to match and manipulate
    text. Regular expressions are created using the regular expression language, a
    specialized language designed to do everything that just discussed and more. Like
    any language, regular expressions have a specific syntax and instructions that
    you must learn, and what is this book will teach you.


    The regular expression language is not a full programming language. It is usually
    not even an actual program or utility you can install and use. More than not,
    regular expressions are mini-languages built-in to other languages or products.
    The good news is that just about any decent language or tool these supports regular
    expressions. The bad news is that the regular expression language itself is not
    going to look like the language or tool you are using it. The regular expression
    language is a language unto itself—and not the most intuitive or obvious language
    at that.'
- md: '

    Note Regular expressions originate from research in the 1950s in the field of
    mathematics. Years later, the principles and ideas derived from this early work
    made their way into the Unix world into the Perl language and utilities such as
    `grep`. For many years, regular expressions (used in the scenarios previously
    described) were the exclusive domain of the Unix community, but this has changed,
    and now regular expressions are supported in a variety of forms from just about
    every computing platform.


    To put all in this perspective, the following are all valid regular expressions
    (and all will make sense shortly):


    - * Ben

    - "

    - `www\.forta.com`

    - `[a-zA-Z0-9]*`

    - `<[H]1.*</[H]1>`

    - `\r\n\r`

    - `\d{3,3}-\d{3,4}`


    It is important to note that syntax is the easiest part of mastering regular expressions.
    The real challenge, however, is learning how to apply syntax, how to dissect problems
    into solvable regex solutions. It is something that cannot be taught by simply
    reading a book, but like any language, mastery comes with practice.


    ## Using Regular Expressions


    As previously explained, there is no regular expressions program; it is not an
    application you run now software or you buy. Rather, the regular expressions are
    implemented in lots of software products, languages, utilities, and development
    environments.


    How regular expressions are used and how expression functionality varies from
    one application to the next. Some applications have menu and dialog boxes to access
    regular expressions, whereas programming languages typically provide functions
    or classes that expose regex functionality.


    Furthermore, not all regular expression implementations are the same. There are
    often subtle (and sometimes not so subtle) differences between syntax and features.


    Appendix A, "Regular Expressions in Popular Applications and Languages," provides
    usage details and notes for many of the applications and languages that support
    regular expressions. Before you proceed to the next lesson, consult appendix to
    learn the specifics pertaining to the application or language that you will be
    using.


    ## Summary


    To help you get started quickly, you''ll find links to online regular expression
    testing tools on this book''s Web page at


    http://forta.com/books/0134757068/


    These online tools are often the simplest way to experiment with regular expressions.


    ## Before You Get Started


    Before you go any further, take note of a couple of important points:


    - When using regular expressions, you will discover that there are almost always
    multiple solutions to some problem. Some may be simpler, some may be faster, some
    may be more portable, and some may be more capable. There is rarely a right or
    wrong solution when writing regular expressions (as long as your solution works,
    of course).

    - As already stated, differences exist between regex implementations. As much
    as possible, the examples and lessons used in this book apply to all major implementations,
    and differences or incompatibilities are noted as such.

    - As with any language, the key to learning regular expressions is practice, practice,
    practice.


    > Note

    > I strongly suggest that you try each and every example as you work through this
    book.


    ## Summary


    Regular expressions are one of the most powerful tools available for text manipulation.
    The regular expressions language is used to construct regular expressions (the
    actual constructed string is called a regular expression), and regular expressions
    are used to perform both search and replace operations.


    ## Lesson 2


    ## Matching Single Characters


    In this lesson you''ll learn how to perform simple character matches of one or
    more characters.


    ## Matching Literal Text


    Ben is a regular expression. Because it is plain text, it may not look like a
    regular expression, but it is. Regular expressions can contain plain text (and
    may even contain *only plain text*). Admitted, this is a total waste of regular
    expression processing, but it''s a good place to start.


    So, here goes:


    ### Text


    ```

    Hello, my name is Ben. Please visit

    my website at http://www.forta.com/.

    ```


    ### RegEx


    ```

    Ben

    ```


    ### Result


    ```

    Hello, my name is Ben. Please visit

    my website at http://www.forta.com/.

    ```


    ### Analysis


    The regular expression used here is literal text and it matches Ben in the original
    text.


    ### Note


    - In the examples you''ll see that the matched text is shaded. We''ll use this
    format throughout the book so you can easily see exactly what an example matched.


    Let''s look at another example using the same search text and a different regular
    expression:


    ### Text


    Hello, my name is Ben. Please visit my website at http://www.forta.com/.


    ### RegEx


    my


    ### Result


    Hello, my name is Ben. Please visit my website at http://www.forta.com/.


    ### Analysis


    my is also static text, but notice how two occurrences of my were matched.


    ### How Many Matches?


    The default behavior of most regular expression engines is to return the first
    match. In the preceding example, the first would typically be a match, but not
    the second.


    So were there two matches made? Most regex implementations provide a mechanism
    to obtain a list of all matches (usually returned in an array or some other special
    format). In JavaScript, for example, using the optional g (global) flag returns
    an array containing all the matches.


    > Consult Appendix A, “Regular Expressions in Popular Applications and Languages,”
    to learn how to perform global matches in your language or tool.


    ## Handling Case Sensitivity


    Regular expressions are case sensitive, so Ben will not match ben. However, most
    implementations support matches that are not case sensitive. JavaScript users,
    for example, can specify the optional i flag to force a search that is not case
    sensitive.


    > Consult Appendix A to learn how to use your language or tool to perform searches
    that are not case sensitive.


    ## Matching Any Characters


    The regular expressions thus far have matched static text only—rather anticlimactic,
    indeed. Next we''ll look at matching unknown characters.


    In regular expressions, special characters (or sets of characters) are used to
    identify what is to be searched for. The . character (period, or full stop) matches
    any one character.


    Therefore, searching for c.t will match cat and cot (and a bunch of other nonsensical
    words, too).


    Here is an example:


    ### Text


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### RegEx


    ```

    sales.

    ```


    ### Result


    ```

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    pacal1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### Analysis


    Here the regex sales is being used to find all filenames starting with sales and
    followed by another character. Three of the nine files match the pattern.


    > Tip

    > You''ll often see the term pattern used to describe the actual regular expression.


    ### Note


    Notice that regular expressions match patterns with string contents. Matches will
    not always be entire strings, but the characters that match a pattern—even if
    they are part of a string. In the example used here, the regular expression did
    not match a filename; rather, it matched part of a filename. This distinction
    is important to remember when passing the results of a regular expression to some
    other code or application for processing.


    . matches any character, alphabetical characters, digits, and even . itself:


    ### Text


    ```

    sales.xls

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### RegEx


    ```

    sales.

    ```


    ### Result


    ```

    sales.xls

    sales1.xls

    orders3.xls

    sales2.xls

    sales3.xls

    papac1.xls

    europe2.xls

    nal1.xls

    na2.xls

    sal1.xls

    ```


    ### Analysis


    This example contains one optional file, sales.xls. The file was matched by the
    pattern sales. as . matches any character.


    Multiple instances of . may be used, either together (one after the other—using
    . . will match any two characters next to each other) or in different locations
    in the pattern.

