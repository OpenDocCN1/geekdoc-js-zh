    # Appendix A


    ## Regular Expressions in Popular Applications and Languages


    Although basic regular expression syntax is, for the most part, consistent across
    different implementations, the way that regular expressions are used is definitely
    not. Languages and applications that support regular expression use their own
    invocation methods, and have their own differences and nuances. This appendix
    describes regular expression use in popular applications and languages and provides
    additional usage notes where appropriate.


    The information presented in this appendix is for reference and to help you started.
    Specific usage examples and notes for every implementation are beyond the scope
    of this book, and you should refer to the relevant application or language documentation
    for further information.


    grep

    grep is the Unix utility used to perform searches against files or standard input.
    grep supports basic, extended, and Perl regular expressions, depending on the
    option specified:


    - E uses extended regular expressions.

    - G uses basic regular expressions.

    - P uses Perl regular expressions.


    Tip

    Exact features and functionality vary based on the option specified. Most users
    opt for Perl regular expressions (described later) because these are the most
    standard.


    Note the following (for grep):


    - By default, grep displays the entire line for any lines containing matches;
    to show just the match, use the -o option.

    - Use option -v to negate the match and display only nonmatching lines.

    - Use option -c to display the count (number) of matches instead of all details.

    - Use option -i for matching that is not case sensitive.

    - grep is used for search operations, not for replace operations. As such, no
    replace functionality is supported.


    ## Java


    Regular expression matching is facilitated via the java.util.regex.matcher class
    and these are methods:


    - find() finds an occurrence of a pattern within a string.

    - lookingAt() attempts to match the beginning of a string against a specified
    pattern.

    - matches() attempts to match an entire string against a pattern.

    - replaceAll() performs a replace operation and replaces all matches.

    - replaceFirst() performs a replace operation and replaces the first match.


    Additional class methods provide greater control over specific operations. In
    addition, wrapper methods are available in the java.util.regex.pattern class:


    - compile() compiles a regular expression into a pattern.

    - flags() returns a pattern''s match flags.

    - matches() is functionally equivalent to the matches() method described earlier.

    - pattern() returns the regular expression from which a pattern was created.

    - split() splits a string into substrings.


    Sun''s regular expression support is based on the Perl implementation, but be
    aware of the following:


    - To use expressions, the regular expression package must be imported using import
    java.util.regex.* (This will include the entire package. If only subsets of the
    package are needed, specify their names instead of *).

    - Embedded conditions are not supported.

    - Case conversion using E, \1, \L, \u, and \U is not supported.

    - Backspace matching via \b is not supported.

    - \z is not supported.


    ## JavaScript


    JavaScript implements regular expression processing in the String and RegExp objects
    via the following methods:


    - exec is a RegEx method used to search for a match.

    - match is a String method used to match a string.

    - replace is a String method used to perform replace operations.

    - search is a String method used to test for a match in a string.

    - split is a String method used to break a string into multiple strings.

    - test is a RegEx method used to test for a match in a string.


    JavaScript regular expression support is modeled on that of Perl, but be aware
    of the following:


    - JavaScript uses flags to manage global case-sensitive searching: g enables global,
    i matches not case sensitive, and the two flags may be combined as gi.

    - Additional modifiers (supported later than 4 browsers) are m to support multiline
    strings, s for line-strings, and x to ignore whitespace within the regex.

    - When you use backreferences, $ returns everything before the matched string,
    '' returns everything after the matched string, + returns the last matched subexpression,
    and & returns everything that matched.

    - JavaScript features a global object named RegExp, which can be accessed to obtain
    information about the regular expression executed.

    - The POSIX character classes are not supported.

    - \A and \Z are not supported.


    ## Microsoft .NET


    The .NET Framework provides powerful and flexible regular-expression processing
    as part of the base class library. As regular expressions are available for use
    by any .NET languages and tools (including ASP.NET, C#, and Visual Studio .NET).


    Regular expression support in .NET is provided by the Regex class (as well as
    additional supporting classes). Regex includes the following methods:


    - IsMatch() checks to whether a match is found in a specified string.

    - Match() searches for a single match, which is returned as a Match object.

    - Matches() searches for all matches, which are returned as a MatchCollection
    object.

    - Replace() performs a replace operation on a specified string.

    - Split() splits a string into an array of strings.

