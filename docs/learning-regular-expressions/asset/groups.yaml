    # U.S. Social Security Numbers


    U.S. social security numbers (often abbreviates SSN) are three sets of digits
    separated by hyphens; the first set contains three digits, the second set contains
    two, and the third set contains four digits. Since 1972, the first set of three
    digits have been assigned based on the address provided on the application:


