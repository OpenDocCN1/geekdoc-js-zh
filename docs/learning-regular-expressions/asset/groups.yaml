    \ CSS 文件的示例：\n\n## 文本\n\n```\nbody {\n  background-color: #febfd8;\n}\nh1 {\n\
    \  background-color: #0000;\n}\ndiv {\n  background-color: #d0f4e6;\n}\nspan {\n\
    \  background-color: #f08970;\n}\n```\n\n## “排除所有项”匹配\n\n## 正则\n\n```\n# [0-9A-Fa-f]\
    \ [0-9A-Fa-f] [0-9A-Fa-f] [0-9A-Fa-f] [0-9A-Fa-f] [0-9A-Fa-f]\n```\n\n## 结果\n\n\
    ```\nbody {\n  background-color: #fefbd;\n}\nh1 {\n  background-color: #0000ff;\n\
    }\ndiv {\n  background-color: #d0f4e6;\n}\nspan {\n  background-color: #ff08970;\n\
    }\n```\n\n## 分析\n\n这里使用的模式包含作为字面文本的 `#`，然后重复六次字符集 `[0-9A-Fa-f]`。这匹配 `#` 后面跟六个字符，每个字符必须是数字或\
    \ A 到 F（大写或小写）。\n\n## “排除所有项”匹配\n\n字符集通常用于指定字符列表，其中任何一个必须匹配。但有时你想要相反的操作——一个你不想匹配的字符列表。换句话说，排除此处指定列表中的任何项。*\n\
    \n与其列举你想要的每个字符（如果你想排除除了几个以外的所有字符，这可能会非常长），可以使用元字符 `^` 对字符集进行取反。这是一个示例：\n\n## 文本\n\
    \n```\nsales1.xls\norders3.xls\nsales2.xls\nsales3.xls\npac1.xls\neurope2.xls\n\
    sam.xls\nna1.xls\nna2.xls\nsal1.xls\ncal.xls\n```\n\n## 正则\n\n```\n[ns]a[^0-9]\\\
    xls\n```\n\n## 结果\n\n```\nsales1.xls\norders3.xls\nsales2.xls\nsales3.xls\napac1.xls\n\
    europe2.xls\nsam.xls\nnal1.xls\nna2.xls\nsal1.xls\ncal1.xls\n```\n\n## 分析\n\n\
    此示例中使用的模式与之前使用的模式完全相反。`[0-9]` 匹配所有数字（仅限数字）。`[^0-9]` 匹配指定数字范围内的任何内容。因此，`[ns]a[^0-9]\\\
    xls` 匹配 `sam.xls`，但不匹配 `nal1.xls`、`na2.xls` 或 `sal1.xls`。\n\n## 注意\n\n> `^` 取反集合中的所有字符或范围，而不仅仅是它所前面的字符或范围。\n\
    \n## 总结\n\n元字符 `[ ]` 用于定义字符集合，其中任何一个必须匹配（与“与”相反，“或”）。字符集可以显式列举，也可以使用元字符 `-` 指定为范围。可以使用\
    \ `^` 对字符集进行取反；这将强制匹配指定字符以外的任何内容。\n\n## 第 4 课\n\n## 使用元字符\n\n元字符在第 2 节“匹配单个字符”中引入。在本节中，你将学习用于匹配特定字符或字符类型的额外元字符。\n\
    \n## 重温转义\n\n在深入探索元字符世界之前，回顾一个之前顺带提到过的话题是重要的：转义。\n\n在正则表达式中具有特殊含义的元字符。`.` 是一个元字符；它被用于匹配任何单个字符（如第\
    \ 2 节所示）。同样地，左括号 `[` 是一个元字符；它被用于标记一个集合的开始（如第 3 节“匹配字符集”所示）。\n\n由于元字符在正则表达式中使用时可能具有特殊意义，因此这些字符不能被用来引用它们自身。例如，你不能使用\
    \ `[` 来匹配 `[` 或匹配 `.`。\n\n因为元字符在正则表达式中使用时会产生特殊意义，这些字符不能被用来引用自身。\n\n## 文本\n\n```\n\
    var myArray = new Array();\n...\nif (myArray[0] == 0) {\n}\n```\n\n## 正则\n\n```\n\
    myArray[0]\n```\n\n## 结果\n\n```\nvar myArray = new Array();\n...\nif (myArray[0]\
    \ == 0) {\n}\n```\n\n## 分析\n\n（注：由于原始文本存在大量重复和 OCR 错误，此处翻译已处理核心逻辑。）\n"
