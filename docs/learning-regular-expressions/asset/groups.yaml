    # 正则表达式 (RegEx)


    ```

    [\w.]+@[\w.]+\.\w+

    ```


    # 结果


    Hello .ben@forta.com is my email address.


    # 分析


    你记得 `[\w.]+` 匹配一个或多个字母数字和 `.`，因此 `.ben` 被匹配了。这显然是前面文本中的拼写错误（文本中间有一个多余的句），但这无关紧要。更重要的问题是，虽然
    `.` 在电子邮件地址中是有效字符，但它并不是作为电子邮件地址开头字符的有效字符。


    换句话说，你真正需要匹配的是带有可选额外字符的字母数字文本，如下所示：


    # 文本


    Hello .ben@forta.com is my email address.


    # 正则表达式


    ```

    \w+[\w.]*@[\w.]+\.\w+

    ```


    # 结果


    Hello .ben@forta.com is my email address.


    # 分析


    这个模式看起来越来越复杂（正则表达式模式看起来通常比实际要复杂得多），所以让我们一起来看它。`\w+` 匹配任何字母数字，但不包括（作为电子邮件地址开头字符的有效字符）。对于初始有效字符，确实可以有一个
    `.` 和额外的字符，尽管这些字符实际上可能并不存在。`[\w]*` 匹配零或多个 `.` 和字母数字实例，这正是我们需要的。


    > 注意

    > 将 `*` 视为可选的元字符。与要求至少匹配一次的 `+` 不同，`*` 在存在时匹配任意数量的匹配，但并不要求它必须存在任何项。


    > 提示

    > `*` 是一个元字符。要匹配 `*`，你需要将其转义为 `\*`。


    # ## 匹配零或一个字符


    另一个非常有用的元字符是 `?`。与 `+` 类似，`?` 匹配可选文本（因此零个实例也会匹配）。与 `+` 不同，`?` 仅匹配零或一个字符实例（或集合），但不会多于一个。因此，`?`
    对于匹配文本块中特定的单个可选字符非常有用。


    考虑以下示例：


    | 文本 |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    | 正则表达式 |

    | --- |

    | http:\/[\w.\]+\+ |


    | 结果 |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    用于匹配 URL 的模式是 `http:\/`（这是字面文本，包括两个转义的斜杠），后面跟着 `[\w]+`，它匹配一个或多个允许字母数字、`.` 和正斜杠的集合实例。此模式只能匹配第一个
    URL（以 **http** 开头的那个），但不能匹配第二个（以 **https://** 开头的那个）。而使用 `*`（匹配零或多个 `s` 实例）将是不正确的，因为那将允许
    `httpsssss://`（这显然不是合法的）。


    使用 `?` 的解决方案如下例所示：


    | 文本 |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    | 正则表达式 |

    | --- |

    | http?\/[\w.\]+\+ |


    | 结果 |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    # 分析


    模式以 `https://?` 开头。`?` 意味着前面的字符（s）如果不存在，如果存在单个实例，则应该被匹配。换句话说，`https://` 同时匹配 `http://`
    和 `https://`（但不匹配其他内容）。


    顺便提一下，使用 `?` 是上一节中提到的问题的解决方案。你之前看过一个使用 `\r\n` 来匹配行结束符的示例，我提到在 Unix 或 Linux 机器上，你需要使用
    `\n`（不带 `\r`），而理想的解决方案是匹配一个可选的 `\r` 后跟一个 `\n`。该示例再次出现，使用了稍作修改的正则表达式：


    # 文本


    ```

    "101", "Ben", "Forta"

    "102", "Jim", "James"


    "103", "Roberta", "Robertson"

    "104", "Bob", "Bobson"

    ```


    # 正则表达式


    ```

    [\r]?\\n[\r]?\n

    ```


    # 结果


    ```

    "101", "Ben", "Forta"

    "102", "Jim", "James"


    "103", "Roberta", "Robertson"

    "104", "Bob", "Bobson"

    ```


    # 分析


    `[\r]?n` 匹配一个可选的单个 `\r` 实例，后跟一个强制的 `\n`。


    > 你会注意到这里使用的正则表达式 `[\r]?` 而不是 `\r?`。`[\r]` 定义了一个包含单个元字符的集合，即单元素的集合，因此 `\r` 实际上与
    `\r?` 相同。`[]` 通常用于定义字符集合，但某些开发者喜欢在字符周围也使用它以防止歧义（使其突出，以便你确切知道后续元字符适用于什么）。如果你同时使用
    `[]` 和 `?`，确保将 `?` 放在集合外面。因此，`http[s]://` 是正确的，但 `http[s?://` 则不是。


    # 提示


    > `?` 是一个元字符。要匹配 `?`，你需要将其转义为 `\?`。


    # ## 使用区间


    `+`、`*` 和 `?` 用于解决正则表达式的许多问题，但有时它们是不够的。考虑以下情况：


    - `-` 和 `*` 匹配无限数量的字符。它们没有提供其他方法。

    - `-` 匹配字母数字文本带有可选额外字符，如下所示：


    # 文本


    Hello .ben@forta.com is my email address.


    # 正则表达式


    ```

    \w+[\w.]*@[\w.]+\.\w+

    ```


    # 结果


    Hello .ben@forta.com is my email address.


    # 分析


    这个模式看起来越来越复杂（正则表达式模式看起来通常比实际要复杂得多），所以让我们一起来看它。`\w+` 匹配任何字母数字，但不包括（作为电子邮件地址开头字符的有效字符）。对于初始有效字符，确实可以有一个
    `.` 和额外的字符，尽管这些字符实际上可能并不存在。`[\w]*` 匹配零或多个 `.` 和字母数字实例，这正是我们需要的。


