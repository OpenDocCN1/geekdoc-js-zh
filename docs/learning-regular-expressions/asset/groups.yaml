    匹配字符串的开头。


    # 定义字符串边界


    为了演示字符串边界的使用，请看以下示例。有效的 XML 文档以 `<xml>` 开头并可能带有额外的属性（可能是版本号，例如 `<xml version="1.0">`）。以下是一个检查文本是否为
