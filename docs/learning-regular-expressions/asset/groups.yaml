    # Performing Replace Operations


    Every regular expression thus far in this book has been used for searching—locating
    text within a larger block of text. Indeed, it is likely that most of the regex
    patterns that you will write be used for searching. But that is not all regular
    expressions can do; regular expressions can also be used to perform powerful replace
    operations.


    Simple texts do not need regular expressions. For example, replacing all instances
    of CA with California and MI with Michigan is decidedly not a job for regular
    expressions. Although such a regex would be legal, there is no value in doing
    so, and in fact, the process would be easier (and execute faster) whenever regular
    string manipulation functions are available to you.


    Regex replace operations become compelling when backreferences are used. The following
    is an example used previously in Lesson 5, "Repeating Matches":


    # Text


    Hello, ben@ford.com is my email address.


    # RegEx


    ```

    \w+([\w\.]*)@[\w\]]+\.\w+

    ```


    # Result


    Hello, ben@ford.com is my email address.


    # Analysis


    This pattern identifies email addresses within a block of text (as explained back
    in Lesson 5).


    But what if you wanted to make any email addresses? In HTML you would use <a href="mailto:user@address.com">user@address.com</a>
    to create a clickable email address. Could a regular expression convert an address
    to this clickable address format? Actually, and very easily, (as long as you are
    using backreferences):


    # Text


    Hello, ben@ford.com is my email address.


    # RegEx


    ```

    (\w+([\w\.]*)@[\w\]]+\.\w+)$$$1

    ```


    # Replace


    ```

    <a href="mailto:$1">$1</a>

    ```


    # Result


    Hello, <a href="mailto:ben@forta.com">ben@forta.com</a> is my email address.


    # Analysis


    In replace operations, two regular expressions are used: one to specify the search
    pattern and a second to specify what to replace matched text. Backreferences can
    span patterns, so a subexpression matched in the first pattern may be used in
    the second pattern. (\w+!@\w+\..*) is the same pattern used previously (to locate
    an email address), but this time it is specified as a subexpression. This way
    matched text may be used in the replace pattern. <a href="$1"></a> uses the matched
    subexpression twice—once in the href attribute (to define the mailto:) and the
    other as the clickable text. So, ben@forta.com becomes <a href="mailto:ben@forta.com">ben@forta.com</a>
    which is exactly what was wanted.


    # Caution


    As noted previously, you will need to modify the backreference designator based
    on the implementation used. For example, JavaScript users will need to use $ instead
    of the previously used \.


    # Tip


    As seen in this example, a subexpression may be referred to multiple times simply
    by referring to the backreference as needed.


    Let''s look at one more example. User information is stored in a database, and
    phone numbers are stored in the format 313-555-1224. However, you need to reformat
    the phone numbers as (313) 555-1224. Here is the example:


    # Text


    ```

    313-555-1224

    248-555-9999

    810-555-9000

    ```


    # RegEx


    ```

    (\d{3}) - (\d{3}) - (\d{4})

    ```


    # Replace


    ```

    ($1) $3-$5

    ```


    # Result


    (313) 555-1234

    (248) 555-9999

    (810) 555-9000


    # Analysis


    Again, two regular expression patterns are used here. The first looks far more
    complicated than it is, so let''s walk through it. (\d{3}) (-\d{3}) (-\d{4}) matches
    a phone number, which breaks into five subexpressions (so as to isolate its parts).
    (\d{3}) matches the first three digits as the subexpression, (-) matches the second
    subexpression, and so on. The result is that the phone number is broken into five
    parts (each part its own subexpression): the area code, the hyphen, the first
    three digits of the number, another hyphen, and then the final four digits. These
    five parts can be used individually and as needed, and as ($1) $-5 simply reforms
    the number using only three of the subexpressions and ignoring the other two,
    thereby turning 313-555-1234 into (313) 555-1234.


