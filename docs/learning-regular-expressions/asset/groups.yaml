    ## Introduction


    Regular expressions and the regular expression language have been around for many
    years. Regular expression experts have long been armed with an incredibly powerful
    tool, one that can be used to perform all sorts of text processing and manipulation
    in just about every language and on every platform.


    That''s the good news. The bad news is that for too long, regular expressions
    have been the exclusive property of only the most savvy. Most of us do not fully
    understand what regular expressions do and what problems they solve. Those who
    have braved them find regular expression syntax to be unintuitive, and even convoluted
    at times. That''s sad, because the truth is that regular expressions are nowhere
    as complex as they appear to be at first glance. All it takes is a clear understanding
    of the problem being solved and how to leverage regular expressions so as to solve
    them.


    Part of the problem is scarcity of quality on the subject. The few books on regular
    expressions (and indeed, most of the Web sites being regular expression tutorials)
    tend to concentrate on the syntax, defining what does and differs from what. But
    that is the easy part; there are not many special characters in the regular expression
    language. The tricky part is understanding how they should be used so as to solve
    real-world problems.


    The book you are holding is not intended to be the last word on everything there
    is to know about regular expressions. If it is what you want, you need a copy
    of Jeffrey Friedl''s Mastering Regular Expressions (O''Reilly, ISBN 0596528214).
    Mr. Friedl is the acknowledged regular expressions guru, and his book is the definitive
    and most comprehensive on the subject. But, no offense to Mr. Friedl, his book
    is not for beginners—or for casual users who just want to get their jobs done
    without needing to understand the inner workings of regular expression engines.
    That is not useful information—it is, but not when all you want to add validation
    to your HTML forms or simply perform regular operations on parsed text. If you
    need to get up and running using regular expressions, you''ll find yourself there
    having too little information to be productive and having too much information
    to know where.


    And that is where this book comes in. Learning Regular Expressions will teach
    you the regular expressions that you really need to know, starting with simple
    text matches and up to more complex topics, including the use of backreferences,
    conditional evaluation, and look-ahead processing. You''ll learn what you can
    use, and you''ll learn it methodically, systematically, and simply by using clear
    and practical examples and solving real problems.


    ## Who Is Learning Regular Expressions For?


    This book is for you:


    - You are new to regular expressions.

    - You want to quickly learn how to get the most out of the regular expression
    language.

    - You want to gain an edge by learning to solve real problems using one of the
    most powerful (and least understood) tools available to you.

    - You build Web applications and crave more sophisticated form and text processing.

    - You use JavaScript, Java, .NET, PHP, Python, MySQL, (and any other languages
    and DBMSs with regular expression support), and you want to learn how to use regular
    expressions within your own application development.

    - You want to be productive quickly and easily in regular expressions, without
    having to call someone for help.


    So turn to Lesson 1, “Introducing Regular Expressions,” and get to work. You’ll
    be leveraging the power of regular expressions in no time at all and wondering
    how you ever managed without them.


    ## Lesson 1: Introducing Regular Expressions


    In this lesson you''ll learn what regular expressions are and what they can do
    for you.


    ### Understanding the Need


    Regular expressions (often shortened as RegEx or regex) are tools, and like all
    tools, regular expressions are designed to solve a very specific problem. The
    best way to understand regular expressions and what they do is to understand the
    problem they solve.


    Consider the following scenarios:


    - You are searching for a file containing the text car (regardless of case) but
    do not want to also locate car in the middle of a word (for example, scar, carry,
    and incarcerate).

    - You are generating a Web page and need to display text retrieved from a database.
    That page may contain URLs, and you want those URLs to be clickable in the generated
    page (so instead of generating just text, you generate valid HTML <a href="#">).

    - You create an app that prompts for user information including e-mail address.
    You need to verify that specified addresses are formatted correctly (that are
    syntactically valid).

    - You are editing source code and need to replace all occurrences of size with
    iSize, but only size and not size as part of another word.

    - You are displaying a list of all files in your computer file system and want
    to filter so that you locate files containing the text Application.

    - You are importing data into an application. The data is tab delimited and your
    application supports CSV files (one row per line, comma-delimited values, each
    enclosed with quotes).

    - You need to search for a file for some specific text, but only at a specific
    location (perhaps the start of a line or at the end of a sentence).


    All these scenarios present unique programming challenges. All of them can be
    solved just like about any language that supports conditional processing and string
    manipulation. But how complex a task would the solution become? You would need
    to loop through words or characters at a time, perform all sorts of if statements,
    track lots of logs so to know what you found and what you have not, check for
    whitespace and special characters, and you would need to do it all, over and over
    again.


    You could use regular expressions. Each of the preceding challenges can be solved
    using well-crafted statements—highly concise strings containing text and special
    instructions—statements that may look like this:


    ```

    \b [Cc] [Rr] \b

    ```


    > Note

    > Don''t worry if the previous line does not make sense yet; it will show shortly.


    ### How Regular Expressions Are Used


    Look at the problem scenarios again and you will notice that they all fall into
    one of two types: either information is being located (search) or information
    is being located and edited (replace). In fact, it is simplest, that all regular
    expressions are used for: search and replace. Every regular expression either
    matches text (performing a search) or matches or replaces text (performing a replace).


    ### RegEx Searches


    Regular expressions are used in searches when the text to be searched for is highly
    dynamic, as in searching for car in the scenario described earlier. For starters,
    you need to locate car or CAR or Car or even CaR; that''s the easy part (many
    searches are capable of performing searches that are not case sensitive). The
    trickier part is ensuring that scar, carry, and incarcerated are not matched.
    Some sophisticated editors have Match Only Words but many don''t, and you may
    not be making this change in a document you are editing. Using a regular expression
    for the search, instead of just the text car, solves the problem.


    > Tip

    > Want to know what the solution to this is? You''ve already seen it—it is the
    sample statement shown previously. \b[Cc] [Rr] \b.


    It is worth noting that testing for equality (for example, does this user-specified
    e-mail address match this regular expression) is a search operation. The entire
    user-provided string is searched for a match (in contrast to a substring search,
    which is what searches usually are).


    ### RegEx Replace


    Regular expression searches are immensely powerful, very useful, and not difficult
    to learn. As much, many of the lessons and examples that you will run into are
    matches. However, the real power of regex is in replace operations, such as in
    the earlier scenario in which you replace URLs to locate URLs within text (perhaps
    searching for strings that start with http:// or https:// and ending with a period
    or a comma or whitespace). Then it also requires that you replace the found URL
    with two occurrences of the matched string with embedded HTML so:


    ```

    http://www.forta.com/

    ```


    is replaced with


    ```

    <a href="http://www.forta.com">http://www.forta.com</a>a>

    ```


    Or perhaps the text being located is just an address, and not a fully qualified
    URL, like this: www.forta.com


    which would also need to be turned into <a href="http://www.forta.com">http://www.forta.com</a>a>


    The Search and Replace option in most applications could not handle this type
    of replace operation, but this is incredibly easy using a regular expression.


    ## So What Exactly Is a Regular Expression?


    Now that you know regular expressions are used for, a definition is in order.
    Simply put, regular expressions are strings that are used to match and manipulate
    text. Regular expressions are created using the regular expression language, a
    specialized language designed to do everything that just discussed and more. Like
    any language, regular expressions have a specific syntax and is not a full programming
    language. It is usually not even an actual program or utility you can install
    and use. More than not, regular expressions are mini-languages built-in to other
    languages or products. The good news is that just about any decent language or
    tool supports regular expressions. The bad news is that the regular expression
    language itself is not going to look like the language or tool you are using it.
    The regular expression language is a language unto itself—and not the most intuitive
    or obvious language at that.

    '
