    # 分析


    起始 `^` 匹配字符串的开头；因此 `\s*` 匹配字符串开头后跟零或多个空白字符（从而处理了 XML 开启之前的合法空格、制表符或换行符）。整个 `^\s*\?xml.*\?`
    匹配带有任何属性的起始 XML 标签，并正确处理了空白。


    > 提示

    > 模式 `\s*\?xml.*\?` 起作用了，但仅是因为此示例中显示的 XML 是完整的。如果使用了完整的 XML 列表，你将看到贪婪量词工作的示例。然而，这是一个关于何时使用
    `.*` 而不是简单的 `..` 的绝佳示例。


    $` 的用法与 `.` 相同。此模式可以检查网页中闭合标签 `</html>` 之后没有任何内容：


    # 正则表达式


    ```

    </[Hh] [Tt] [Mm] [Ll]>\s$

    ```


    # 分析


    每个字符 H、T、M 和 L 均使用了集合（以便处理任何大小写字符的组合），且 `\s*$` 匹配任何空白字符后跟字符串的结尾。


    > 注意

    > 模式 `^.*$` 是语法上正确的正则表达式；它几乎总是能找到匹配项，而且完全没有用处。你能推导出它匹配的是什么，以及何时找不到匹配项吗？


    # 使用多行模式


    `^` 匹配字符串的开头；因此 `\s*` 匹配字符串开头后跟零或多个空白字符（从而处理了 XML 开启之前的合法空格、制表符或换行符）。整个 `^\s*\?xml.*\?`
    匹配带有任何属性的起始 XML 标签，并正确处理了空白。


    许多正则表达式实现支持使用多行模式来改变 `^` 和 `$` 的行为。在多行模式下，`^` 匹配每一行的开头，`$` 匹配每一行的结尾。如果使用 `(?m)`
    模式符，`^` 匹配换行符之前的开头，`$` 匹配换行符之前的结尾。


    # 文本


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:impl="http://tips.cf" xmlns:intf="http://tips.cf"

    xmlns:apachecap="http://xml.apache.org/xml-soap"

    ```


    # 正则表达式


    ```

    ^\s*\?xml\?

    ```


    # 结果


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:impl="http://tips.cf" xmlns:intf="http://tips.cf"

    xmlns:apachecap="http://xml.apache.org/xml-soap"

    ```


    # 分析


    起始 `^` 匹配字符串的开头；因此 `\s*` 匹配字符串开头后跟零或多个空白字符（从而处理了 XML 开启之前的合法空格、制表符或换行符）。整个 `^\s*\?xml.*\?`
    匹配带有任何属性的起始 XML 标签，并正确处理了空白。


    # 总结


    > 提示

    > 模式 `\s*\?xml.*\?` 起作用了，但仅是因为此示例中显示的 XML 是完整的。如果使用了完整的 XML 列表，你将看到贪婪量词工作的示例。然而，这是一个关于何时使用
    `.*` 而不是简单的 `..` 的绝佳示例。


    正则表达式可以匹配任何文本块或字符串中特定位置的文本。`\b` 用于指定单词边界（`\B` 则相反）。`^` 和 `$` 分别标记字符串边界（字符串开头和结尾），尽管在配合
    `(?m)` 模式符时，`^` 和 `$` 也会匹配换行符开头和结尾。


    # 第 7 节


    # 使用子表达式


    元字符和字符匹配提供了正则表达式的基本能力，正如目前为止的课程所示。在本节中，你将学习如何使用子表达式分组。


    # 理解子表达式


    匹配多次字符是在第 5 节“重复匹配”中引入的。正如在该节中，`\d+` 匹配一个或多个数字，`https://` 匹配 `http://` 或 `https://`。


    在这两个示例中（事实上，在目前为止的所有示例中），重复元字符（例如 `?` 或 `{`）适用于特定的字符或元字符。


    例如，HTML 开发人员经常在单词之间放置不换行空格（使用 `&nbsp;`），以确保文本不在单词之间换行。假设你需要定位重复的 HTML 不换行空格（将其替换为其他内容）。示例如下：


    文本


    ```

