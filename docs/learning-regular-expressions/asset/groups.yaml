    ## 第 11 ：常见问题的正则表达式解决方案


    本节收集了一些实用的正则表达式，并对每个表达式进行了详细解释。其意图是通过实际的真实示例，将你在书中学到的所有内容整合在一起，并通过提供常用的模式来为你提供帮助。


    > 这里提供的示例并非所提问题的终极解决方案。到目前为止你应该很清楚，很少存在终极解决方案。通常情况下存在多种解决方案，它们对不可预测因素的容忍程度各异，而且模式的性能与其处理所有可能场景的能力之间始终存在权衡。在理解这一点的基础上，请随时使用此处提供的模式（如果需要，可以根据你的最佳需求对其进行调整）。


    ## 北美电话号码


    北美电话编号计划定义了北美电话号码的格式。根据该计划，电话号码（适用于美国、加拿大、加勒比大部分地区和其他几个地区）由一个三位的区号（技术上称为 NPA 或编号计划区）和一个七位的线路号码（其格式为三位前缀后接四位线路号码）组成。电话号码中可以使用任何数字，但有两个例外：区号的第一位和前缀的第一位不能为
    0 或 1。区号通常用括号括起来，且通常通过连字符与实际号码隔开。匹配 (555) 555-5555 或 (555)555-5555 555-555-5555
    其中之一很容易；但匹配其中任何一种（假设这是你所需要的）则有点复杂。


    ### 文本

    - J. Doe: 248-555-1234

    - B. Smith: (313) 555-1234

    - A. Lee: (810)555-1234


    ### 正则表达式

    ```

    \(?[2-9]\d\d\)?\-?[2-9]\d\-\d{4}

    ```


    ### 结果

    | J. Doe: 248-555-1234 |

    | B. Smith: (313) 555-1234 |

    | A. Lee: (810)555-1234 |


    ### 分析

    该模式以看起来奇怪的 `\?` 开始。括号是可选的，`\(` 匹配 `(`，`?` 表示匹配 0 或 1 次。`[2-9]\d\d` 匹配三位区号（第一位必须是
    2 到 9）。`\)?` 匹配可选的右括号。[ -]?` 匹配单个空格或连字符（如果存在）。`[2-9]\d-\d{4}` 匹配电话号码的剩余部分，即三位前缀（其第一位是
    2 到 9），后面跟着连字符和四个数字。


    此模式可以很容易地修改以处理其他显示格式，例如：

    555.555.5555。


    ### 文本

    - J. Doe: 248-555-1234

    - B. Smith: (313) 555-1234

    - A. Lee: (810)555-1234

    - M. Jones: 734.555.9999


    ### 正则表达式

    ```

    \((\.)?[2-9]\d\d.\-?[2-9]\d\-\d{4}

    ```


    ### 结果

    | J. Doe: 248-555-1234 |

    | B. Smith: (313) 555-1234 |

    | A. Lee: (810)555-1234 |

    | M. Jones: 734.555.9999 |


    ### 分析

    起始的匹配现在使用可选集合测试或 `.`，使用了模式 `\(.)?\?`。同样，`[\.)` 测试或 `..`（同样也是可选的），`[-\.]` 测试或 `.`
    `...`。可以很容易地添加其他电话号码格式。


    ## 美国邮政编码


    ZIP 编码于 1963 年引入美国（ZIP 实际上是区域改进计划 Zone Improvement Plan 的缩写）。美国有 40,000 多个 ZIP
    编码，全部由数字组成（第一位从东向西分配，0 在东部，9 在西海岸）。1983 年，邮政局开始使用扩展的 ZIP 编码 ZIP+4。额外的四个数字提供了更细粒度的划分（通常是特定的街区或建筑），这使得
    ZIP+4 成为可选，如果使用了，则邮政编码验证必须能够同时适应五位 ZIP 编码和 ZIP+4（用连字符分隔前五位和额外的四个数字）：


    ### 文本

    - 999 1st Avenue, Bigtown, NY, 11222

    - 123 High Street, Any City, MI 48034-1234


    ### 正则表达式

    ```

    \d{5}(-\d{4})?

    ```


    ### 结果

    - 999 1st Avenue, Bigtown, NY, 11222

    - 123 High Street, Any City, MI 48034-1234


    ### 分析

    `\d{5}` 匹配任何数字，`-\d{4}` 匹配连字符加上 +4 数字。因为这额外的四个数字本质上是可选的，因此 `-\d{4}` 被包含在括号内（变为子表达式），并使用
    `?` 可选允许该子表达式出现一次。


