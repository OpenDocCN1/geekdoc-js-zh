    # Nesting Subexpressions


    Subexpressions may be nested. In fact, subexpressions may be nested within subexpressions
    nested within subexpressions—you get the picture.


    The capability to nest subexpressions allows for incredibly powerful expressions,
    but it can also make patterns look convoluted, hard to read and decode, and so
    intimidating. The truth, is that nested subexpressions are seldom as complicated
    as they look.


    To demonstrate the use of nested subexpressions, we''ll look at the IP address
    example again. This is the pattern used previously (a subexpression repeated three
    times followed by the final number):


    # RegEx


    ```

    \d{1,3}\.){3}\d{1,3}

    ```


    So what is wrong with this pattern? Syntactically, nothing. An IP address is indeed
