    w]+\\+([\\d)?(\\/([\\w._]+\\*)*\\*(\\?\\S+)?))?\n```\n\n## Result\n\n```\nhttp://www.forta.com/blog\n\
    https://www.forta.com:80/blog/index.cfm\nhttps://www.forta.com\nhttp://ben:password@www.forta.com/\n\
    http://localhost/index.php?ab=1&c=2\nhttp://localhost:8500/\n```\n\n## Analysis\n\
    \nThis pattern builds on the previous example. https?://(\\w*:\\w@)? is now followed\
    \ by (\\w*:\\w@)?. This new pattern checks for embedded user and password (username\
    \ and password separated by : and followed by @) as seen in the fourth line in\
    \ the example. (\\?\\S+)? (after the path) matches the query string, ? followed\
    \ by additional text, and this, too, is made optional with ?.\n\n> Note: This\
    \ regular expression is one that should not be case sensitive.\n\n> Tip: Why not\
    \ always use this pattern over the previous one? In performance, this is a slightly\
    \ complex pattern and so it will run slower; if the extra functionality is not\
    \ needed it should not be.\n\n# Email Addresses\n\nRegular expressions are frequently\
    \ used for email address validation, and yet validating a simple email address\
    \ is anything but simple:\n\n## Text\n\nMy name is Ben Forta, and my email address\
    \ is ben@forta.com.\n\n## RegEx\n\n```\n(\\w+\\.)*\\w+@(\\w+\\.)+[A-Za-z]+\n```\n\
    \n## Result\n\nMy name is Ben Forta, and my email address is `ben@forta.com`.\n\
    \n# Analysis\n\n(\\w+\\.)*\\w+ matches the name portion of an email address (everything\
    \ before the @), and \\w+ matches zero or more instances of text followed by .,\
    \ (this combination matches both ben and benforta, for example). @ matches. (\\\
    w+\\+) then matches at least one instance of text followed by ., and [A-Za-z]+\
    \ matches the top-level domain (com or edu or uk, and so on).\n\nThe rules governing\
    \ email address formats are extremely complex. This pattern will not validate\
    \ every possible email address. For example, it will allow `ben..forta.com` (which\
    \ is invalid) and will not allow IP addresses as the hostname (which are allowed).\
    \ Still, it will suffice for most email validation, and it may work for you.\n\
    \n> Regular expressions used to match email addresses should usually not be case\
    \ sensitive.\n\n# HTML Comments\n\nComments in HTML pages are placed between <!--\
    \ and --> tags (at least two hyphens, although more are allowed). Being able to\
    \ locate all comments is useful when browsing (and debugging) Web pages:\n\n##\
    \ Text\n\n```\n<!-- Start of page -->\n<html>\n<!-- Start of head -->\n<head>\n\
    <title>My Title</title> Page title\n</head>\n<!-- Body -->\n<body>\n```\n\n##\
    \ RegEx\n\n```\n<!--{2,}.*?-2,}>\n```\n\n## Result\n\n```\n<!-- Start of page\
    \ -->\n<html>\n<!-- Start of head -->\n<head>\n<title>My Title</title><!-- Page\
    \ title -->\n</head>\n<!-- Body -->\n<body>\n```\n\n## Analysis\n\n<!--{2,} matches\
    \ the start of the comment, <!-- followed by two or more hyphens. .* matches the\
    \ comment body (non-greedy). {2,} matches the end of the comment.\n\n> Note: This\
    \ regular expression matches two or more hyphens and can be used to find mismatched\
    \ comments. However, the pattern does not attempt to match the number of hyphens\
    \ at the comment's start (potentially useful).\n\n# JavaScript Comments\n\nComments\
    \ in JavaScript (and other languages, including ActionScript) are preceded by\
    \ //. In the previous example, being able to locate all comments in a page can\
    \ be very useful:\n\n## Text\n\n```javascript\n<script language=\"JavaScript\"\
    >\n// Turn off fields only by\nfunction hideFields() {\n  document.getElementById('RegReplace').disabled=true;\n\
    \  document.getElementById('header').disabled=true;\n}\n// Turn on fields only\
    \ by\nfunction showFields() {\n  document.getElementById('RegReplace').disabled=false;\n\
    \  document.getElementById('header').disabled=false;\n}\n```\n\n## RegEx\n\n```\n\
    \\/\\/\n```\n\n# Credit Card Numbers\n\n## Result\n\n```javascript\n<script language=\"\
    JavaScript\">\n// Turn off fields only by\nfunction hideFields() {\n  document.getElementById('RegReplace').disabled=true;\n\
    \  document.getElementById('header').disabled=true;\n}\n// Turn on fields only\
    \ by\nfunction showFields() {\n  document.getElementById('RegReplace').disabled=false;\n\
    \  document.getElementById('header').disabled=false;\n}\n```\n\n# Analysis\n\n\
    Credit card numbers are 16 digits; the first digit is 5, and the second digit\
    \ is 1 through 5. `5[1-5]` `\\d{14}` matches the next 14 digits.\n\nVisa is a\
    \ little trickier:\n\n## Text\n\n```\nMasterCard: 5212345678901234\nVisa 1: 4123456789012\n\
    Visa 2: 412345678901235\nAmex: 371234567890123\nDiscover: 60111234567890134\n\
    Diners Club: 3881234567890123\n```\n\n## RegEx\n\n```\n\\d{12}(\\d{3})?\n```\n\
    \n## Result\n\nMasterCard: 5212345678901234\nVisa 1: 4123456789012\nVisa 2: 412345678901235\n\
    Amex: 371234567890123\nDiscover: 60111234567890134\nDiners Club: 3881234567890123\n\
    \n# Analysis\n\nAll Visa numbers start with 4 and are 13 or 16 digits (not 14\
    \ or 15, so a range cannot be used). `4\\d{12}` matches the next 12 digits, and\
    \ `(\\d{3})?` matches an additional 3 digits if they are present.\n\nAmerican\
