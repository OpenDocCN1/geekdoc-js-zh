    http://www.forta.com/blog

    https://www.forta.com:80/blog/index.cfm

    http://www.forta.com

    http://ben:password@www.forta.com/

    http://localhost/index.php?ab=1&c=2

    http://localhost:8500/

    ```


    Analysis


    This pattern builds on the previous example. https?://(\w*:\w@)? is now followed
    by (\w*:\w@)? This new pattern checks for embedded user and password (username
    and password separated by : and followed by @) as seen in the fourth line in the
    example. (\?\S+)? (after the path) matches the query string, ? followed by additional
    text, and this, too, is made optional with ?.


    > Note

    This regular expression is one that should not be case sensitive.


    > Tip

    Why not always use this pattern over the previous one? In performance, this is
    a slightly complex pattern and so it will run slower; if the extra functionality
    is not needed it should not be.


    # Email Addresses


    Regular expressions are frequently used for email address validation, and yet
    validating a simple email address is anything but simple:


    Text


    My name is Ben Forta, and my

    email address is ben@forta.com.'
