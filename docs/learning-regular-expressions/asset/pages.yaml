  md: 'The problem is that the second part of the match (the part matching the end
    tag) has no knowledge of the first part of the match (the part matching the start
    tag). And this is where backreferences become very useful.


    # Matching with Backreferences


    We''ll revisit the header problem shortly. For now let''s look at a simpler example,
    and one that cannot be solved at all without the use of backreferences.


    Suppose that you had a block of text and wanted to locate all repeated words (typos,
    where the same word was mistakenly twice). Obviously, when searching for the second
    occurrence of a word, that word must be known. Backreferences allow regular patterns
    to refer to previous matches (in this case, the previously matched word).


    The best way to understand this is to see it used, so here is some text containing
    three sets of repeated words, all of which need to be located:


    Text


    This is a block of text, several words here are repeated, and and the they should
    not be.


    RegEx


    ```

    { }(\w+) [ \1

    ```


    Result


    This is a block of text, several words here are repeated, and and the they should
    not be.


    Analysis


    The pattern apparently worked, but how did it work? { } matches one or more spaces,
    \w+ matches one or more alphanumeric characters, and { } matches trailing spaces.
    Notice that \w is enclosed within parentheses, and then a subexpression. This
    subexpression is not used for repeating matches; there is no repeat matching here.
    Rather, the subexpression is simply used to group an expression, to flag it and
    identify it for future use. The final part of this pattern is \1; this is a reference
    to the subexpression, \1 matches the same text as the first matched group. So
    when (\w+) matched the word of, so did \1, and when (\w+) matched the word and,
    so did \1.'
