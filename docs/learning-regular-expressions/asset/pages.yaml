  md: "# Analysis\n\nSets are used for each of the characters H, T, M, and L (so as\
    \ to be handle any combination of upper- or lowercase characters), and \\s*$ matches\
    \ any whitespace followed by the end of string.\n\n> Note\nThe pattern ^.*$ is\
    \ a syntactically correct regular expression; it will almost always find a match,\
    \ and it is utterly useless. You can work out what it matches and when it will\
    \ not find a match?\n\n# Using Multiline Mode\n\n^ matches the start of a string\
    \ and $ matches the end of a string—usually. There is an exception, or rather,\
    \ a way to change this behavior.\n\nMany regular expression implementations support\
    \ the use of metacharacters that modify the behavior of other metacharacters,\
    \ and one of these is (?m), which enables multiline mode. Multiline mode forces\
    \ the regular expression engine to treat line breaks as a string separator, so\
    \ that ^ matches the start of a string or the start after a line break (a new\
    \ line), and $ matches the end of a string or the end after a line break.\n\n\
    If used, (?m) must be placed at the very front of the pattern, as shown in the\
    \ following example, which uses a regular expression to locate JavaScript comments\
    \ within a block of code:\n\n# Text\n\n```\n<script>\nfunction doSpellCheck(form,\
    \ field) {\n  // Make sure not empty\nif (field.value == '') {\n    return false;\n\
    \  }\n  // Init\n  var windowName='spellWindow';\n  var spellCheckURL='spell.cfm?formname=comment&fieldname='+field.name;\n\
    \  ...\n  // Done\n  return false;\n}\n</script>\n```\n\n# RegExp\n\n(?m)^\\s*\\\
    /\\/.**"
