  md: '+ can also be used to match one or more sets of characters. To demonstrate
    this, the following example shows the same regular expression but with slightly
    different text:


    # Text


    Send personal email to ben@forta.com or ben.forta.com. For questions about a book
    use support@forta.com. If your message is urgent try ben@urgent.forta.com. Feel
    free to send unsolicited email to spams@forta.com (wouldn''t it be nice if it
    were that simple, huh?)


    # RegEx


    ```

    \w+@\.\\w+

    ```


    # Result


    Send personal email to ben@forta.com or ben.forta.com. For questions about a book
    use support@forta.com. If your message is urgent try ben@urgent.forta.com. Feel
    free to send unsolicited email to spams@forta.com (wouldn''t it be nice if it
    were that simple, huh?)


    # Analysis


    The regular expression matched five addresses, but two of them are incomplete.
    Why is this? \w+@\.\\w+ makes no accommodations for . characters before the @,
    and it allows a single _ separating the strings after a . Although ben.forta.com
    is a perfectly legal email address, the regular matched only fora instead of ben.forta
    because \w matches alphanumeric characters but not . in the middle of a string
    of text.


