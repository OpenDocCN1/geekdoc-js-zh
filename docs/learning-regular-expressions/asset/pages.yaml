    \ discussed in the previous lesson, you could create a regular expression like\
    \ the following:\n\n```\n\\w@\\w\\.\\w\n```\n\nThe \\w would match alphanumeric\
    \ characters (plus an underscore, which is valid in an email address); @ does\
    \ not need to be escaped, but . does.\n\nThis is a perfectly regular expression,\
    \ albeit a rather useless one. It would match an email address that looked a@b.c\
    \ (which, although syntactically legal, is obviously not a valid address). The\
    \ problem with it is that \\w matches a single character obviously you can't know\
    \ how many characters to test for. After all, the following are all valid email\
    \ addresses, but they all have a different number of characters before the:\n\n\
    ```\nb@forta.com\nben@forta.com\bforta@forta.com\n```\n\nWhat you need is a way\
    \ to match multiple characters, and this is doable using one of several special\
    \ metacharacters."
