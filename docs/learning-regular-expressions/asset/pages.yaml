- img_proc: true
  md: '# Result


    ```

    11111

    22222

    33333-

    44444-4444

    ```


    # Analysis


    Again, \d{5} matches the opening five digits. Then comes a condition in the form
    of (?=\d{4}). The condition uses lookahead?= match (but not consume) a hyphen,
    and if the condition is met (the hyphen exists), then-\d{4} matches hyphen followed
    by four digits. This way, 33333 is not matched (it has a hyphen and so the condition
    is met, but it does not have the additional four digits).


    Lookahead and lookbehind (both positive and negative) may be used as the condition,
    and an optional else expression may be used, too (using the same syntax seen previously,
    [expression).


    +   * Lookaround conditions tend not to be used frequently because similar results
    can be accomplished using simpler means.


    # Summary


    Conditions may be embedded into regular expression patterns so as to be able to
    execute expressions only if a condition has (or not) been met. The condition may
    be a backreference (the condition is then checking for its existence) or a lookaround
    operation.'
