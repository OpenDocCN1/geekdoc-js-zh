  md: '# RegEx


    (\w+\.)*\w+@(\w+\.)+[A-Za-z] +


    # Result


    My name is Ben Porta, and my email address is `benforta.com`.


    # Analysis


    (\w+\.)*\w+ matches the name portion of an email address (everything before the
    @), and \w+ matches zero or more instances of text followed by ., (this combination
    matches both ben and benforta, for example). @ matches. (\w+\+) then matches at
    least one instance of text followed by ., and [A-Za-z]+ matches the top-level
    domain (com or edu or uk, and so on).


    The rules governing email address formats are extremely complex. This pattern
    will not validate every possible email address. For example, it will allow `ben..forta.com`
    (which is invalid) and will not allow IP addresses as the hostname (which are
    allowed). Still, it will suffice for most email validation, and it may work for
    you.


    > Regular expressions used to match email addresses should usually not be case
    sensitive.


    # HTML Comments


    Comments in HTML pages are placed between <!-- and --> tags (at least two hyphens,
    although more are allowed). Being able to locate all comments is useful when browsing
    (and debugging) Web pages:


    # Text


    ```

    <!-- Start of page -->

    <html>

    <!-- Start of head -->

    <head>

    <title>My Title</title> Page title

    </head>

    <!-- Body -->

    <body>

    ```


    # RegEx


    ```

    <!---[2,}.*?-2,}>

    ```'
