- img_proc: true
  md: '# Defining String Boundaries


    To demonstrate the use of string boundaries, look at the following example. Valid
    XML documents begin with <xml> and likely have additional attributes (possibly
    a version number, as <xml version="1.0">). Following is a simple test to check
    whether text is an XML document:


    # Text


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:http="http://tips.cf" xmlns:intl="http://tips.cf"

    xmlns:apachesoap="http://xml.apache.org/xml-soap">

    ```


    # RegEx


    ```

    <\?xml\*?>

    ```


    # Result


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:http="http://tips.cf" xmlns:intl="http://tips.cf"

    xmlns:apachesoap="http://xml.apache.org/xml-soap">

    ```


    # Analysis


    The pattern appeared well. \<xml> matches \<xml>, .* matches any other text (zero
    or more instances of .), and \> matches the end ?>.


    But this is a very inaccurate test. Look at the example follows; the same pattern
    is used to match text with extraneous text before the XML opening:


    # Text


    This is bad, bad real!

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:http="http://tips.cf" xmlns:intl="http://tips.cf"

    xmlns:apachesoap="http://xml.apache.org/xml-soap">


    # RegEx


    ```

    <\?xml\*?>

    ```


    # Result


    This is bad, bad real!

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:http="http://tips.cf" xmlns:intl="http://tips.cf"

    xmlns:apachesoap="http://xml.apache.org/xml-soap">'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Analysis


    The pattern \?xml.*\? matched the second line of the text. And although the opening
    XML tag, be on the second line of text, this example is definitely invalid (and
    processing the text as XML could cause all sorts of problems).


    What is needed is a test that ensures the opening XML tag is the first actual
    text in the string, and that''s a perfect for the ^ metacharacter as seen next:


    # Text


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:impl="http://tips.cf" xmlns:intf="http://tips.cf"

    xmlns:apachecap="http://xml.apache.org/xml-soap"

    ```


    # RegEx


    ```

    ^\s*\?xml\?

    ```


    # Result


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <wsdl:definitions targetNamespace="http://tips.cf"

    xmlns:impl="http://tips.cf" xmlns:intf="http://tips.cf"

    xmlns:apachecap="http://xml.apache.org/xml-soap"

    ```


    # Analysis


    The opening ^ matches the start of the string; \s* therefore matches the start
    of string followed by zero or more whitespace characters (thus handling legitimate
    spaces, tabs, or line breaks before the XML opening). The complete ^\s*\?xml.*\?
    matches an opening XML tag with any attributes and correctly handles whitespace,
    too.


    > Tip


    > The pattern \s*\?xml.*\? worked, but only because the XML shown in this example
    is incomplete. A complete XML listing have been used, you would have seen an example
    of a greedy quantifier at work. This is, however, a great example of when to use
    .* instead of just ..


    $ is used the same way as. This pattern could be used to check that nothing comes
    after the closing </html> tag in a Web page:


    # RegEx


    ```

    </[Hh] [Tt] [Mm] [Ll]>\s$

    ```'
