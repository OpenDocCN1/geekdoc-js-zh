  md: '# RegEx


    ```

    `[\w.]+@[\w.]+\w+`

    ```


    # Result


    Send email to benforta.com or ben.forta@forta.com. For questions a book use support@forta.com.
    If your message is urgent try ben@urgent.forta.com. Feel free to send unsolicited
    email to spams.com (wouldn''t be nice if it were simple, huh?)


    # Analysis


    That seemed to do trick. [\w.]+ matches one or more instances of any alphanumeric
    character, underscore, and . so forta is matched. [\w.]+ is also used for the
    string after the @ so that deeper (or host) names are matched.


    > Note


    Notice that for the final match, you used \w+ and not [\w.]. Can you figure out
    why? Try using [\w.] for the final match and see what is wrong with the second,
    third, and fourth matches.


    > Note


    You''ll notice that the . in the set was not escaped, and it matched . anyway
    (it was treated as a literal to operate on a metacharacter). Generally, metacharacters
    such as . and + are considered to be literal text within sets, and they need not
    be escaped. However, escaping them does no harm. [\w.] is functionally equivalent
    to [\w.].


    # Matching Zero or More Characters


    + one or more characters. Zero characters will not match—has to be at least one.
    But if you wanted to match optional characters so that zero characters would be
    allowed?


    To do this, you use * metacharacter. * is used exactly like; it is placed right
    after a character or a set and will match zero or more instances of the character
    or set. Therefore, pattern B.* Forta would match B Forta, B. Forta, Ben Forta,
    and other combinations, too.


    To demonstrate the +, take a look at a modified version of the email example:


    # Text


    Hello .benforta.com is my email address.'
