  md: '# Matching One or More Characters


    To match one or more instances of a character (or set), simply append a + character.
    + matches one or more characters (at least one; zero would not). Whereas a matches,
    a+ matches one or more as. Similarly, whereas [0-9] matches any digits, [0-9]+
    matches one or more consecutive digits.


    > > Tip When you use + with sets, the + should be placed outside the set. Therefore,
    [0-9]+ is correct, or [0-9]+ is not.

    [0-9]+ is a valid regular expression, but it will not match one or more digits.
    Rather, it defines a set of 0 through 9 or the + character, and any single digit
    or plus sign will match. Although legal, it probably not what you''d want.


    Let’s revisit the email address example, using this + to match one or more characters:


    Send personal email to ben@forta.com. For questions about a book use support@forta.com.
    Feel free to send unsolicited email to spams@forta.com (wouldn''t it be if it
    were that simple, huh?).


    ```

    \w+@\w+\.\w+

    ```


    Send personal email to ben@forta.com. For questions about a book use supports@forta.com.
    Feel free to send unsolicited email to spams@forta.com (wouldn''t it be if it
    were that simple, huh?).


    The pattern matches all three addresses correctly. The regular expression first
    matches one or more alphanumeric characters using \w+. Next it matches @ followed
    by one or more characters, again using \w+. It then matches \. (using the escaped
    \.) and another \w+ to match the end of the address.


    > > Tip + is a metacharacter. To match a + you''ll need to escape it as \.'
