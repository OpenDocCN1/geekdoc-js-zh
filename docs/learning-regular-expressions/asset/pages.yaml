    # Python


    Python provides regular expression support via the re module.

    The regular expression functions are supported by Python:


    +   - preg_grep() performs a search and returns an array of matches.

    - findall() finds all substrings and returns them as a list.

    - finditer() finds all substrings and returns them as an iterator.

    - match() performs a regular expression search on the start of the string.

    - search() performs a search for all matches in a string.

    - split() converts a string into a list, splitting wherever the pattern matches.

    - sub() replaces matches with a specified substring.

    - subn() returns a string in which matches are replaced with a specified substring.


    Note the following:


    +   - Before they can be used, regular expressions are compiled into objects using
    re.compile.

    - re.compile accepts optional flags like re.IGNORECASE for case-insensitive searching.

    - Use flag re.VERBOSE to help with regular expression debugging.

    - match() and search() return None if no matches are found.'
