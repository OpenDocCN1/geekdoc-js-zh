    # RegEx


    (5-\d{14}) | (4\d{12} (\d{3}?)?) | (3[47]\d{13}) |\n➥ (6011\d{14}) | ((30[0-5]|36)\d{38})\d{11}))


    # Result


    | MasterCard | 5212345678901234 |

    | Visa 1 | 4123456789012 |

    | Visa 2 | 412345678901235 |

    | Amex | 371234567890123 |

    | Discover | 601112345678901234 |

    | Diners Club | 3881234567890123 |


    # Analysis


    The pattern here uses alternation (providing alternatives, or statements) to include
    all the previous patterns, each separated by a | |. The result? Simple validation
    of all major credit card types.


    > Note

    The patterns used here ensure that the credit card number has the correct digits
    and is of the correct length. However, not every 13-digit number that begins with
    4 is a valid Visa number. A formula known as Mod 10 can be used to perform a calculation
    on the digits (of all the credit card types mentioned here) so as to determine
    if the digits are truly valid. Mod 10 is an important part of implementing credit
    card processing, but it is not a job for regular expressions because it involves
    mathematical calculations.


