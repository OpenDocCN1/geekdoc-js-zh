    # Result


    ABC01: $23.45

    HGG42: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    Total items found: 4


    # Analysis


    That obviously did not work. You need the \$ so as to determine which text to
    match, or you do not want it to be returned.


    The solution? A lookbehind match, as follows:


    # Text


    ABC01: $23.45

    HGG42: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    Total items found: 4


    # RegEx


    (?=$)[0-9.]+


    # Result


    ABC01: $23.45

    HGG42: $5.31

    CFMX1: $899.00

    XTC99: $69.96

    Total items found: 4


    # Analysis


    That did the trick. (?<=\\$) matches $, but does not consume it, and so only the
    prices (without the leading \ signs) are returned.'
