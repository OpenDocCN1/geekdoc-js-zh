- img_proc: true
  md: '# # Lesson 11

    Regular Expression

    Solutions to Common

    Problems


    This lesson is a collection of useful regular expressions, along with detailed
    explanations of each. The intent is to bother everything you have learned in this
    book by using practical real-world examples and give you a leg up by providing
    commonly needed patterns that you can use.


    > > The examples presented here are not the ultimate solutions to the problems
    presented. By now it should be clear that there is rarely an ultimate solution.
    More often, multiple solutions exist with varying degrees of tolerance for the
    unpredictable, and there is always a trade-off between performance of a pattern
    and its capability to handle any all scenarios thrown at it. With that understanding,
    feel free to use the patterns presented here (and if needed, tweak them as you
    suit best).


    # ## North American Phone Numbers


    The North American Numbering Plan defines how North American telephone numbers
    are formatted. As the plan, telephone numbers (in the U.S.), Canada, much of the
    Caribbean, and several other locations) are made up of a three-digit area code
    (technically, the NPA or numbering plan area) and a seven-digit line (which is
    formatted as a three-digit prefix followed by a four-digit line). Any digits may
    be used in a phone number with two exceptions: the first digit of the area code
    and the first digit of the prefix may not be 0 or 1. The area code is often enclosed
    in parentheses, and the area code is often separated from the actual phone number
    by a hyphen. Matching one of (555) 555-5555 or (555)555-5555 555-555-5555 is easy;
    matching any of them (assuming that is what you need) is a bit tricky.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Lesson 11 Regular Expression Solutions to Common Problems


    # Text


    J. Doe: 248-555-1234

    B. Smith: (313) 555-1234

    A. Lee: (810)555-1234


    # RegEx


    ```

    \(?[2-9]\d\d\)?\-?[2-9]\d\-\d{4}

    ```


    # Result


    | J. Doe: 248-555-1234 |

    | B. Smith: (313) 555-1234 |

    | A. Lee: (810)555-1234 |


    # Analysis


    The pattern begins with the curious-looking \?. Parentheses are optional, \( matches,
    (, and matches 0 or 1 instance of that. [2-9]\d\d matches a three-digit area (the
    first digit must be through 9). \)? matches the optional closing parenthesis.
    [ -]? matches a single space or a hyphen, if either of them. [2-9]\d\d-\d{4} matches
    the rest of the phone number, the three-digit prefix (the first digit of which
    is through 9), followed by a hyphen and four more digits.


    This pattern could be easily modified to handle other presentation formats, for
    example,

    555.555.5555.


    # Text


    J. Doe: 248-555-1234

    B. Smith: (313) 555-1234

    A. Lee: (810)555-1234

    M. Jones: 734.555.9999


    # RegEx


    ```

    \((\.)?[2-9]\d\d.\-?[2-9]\d\-\d{4}

    ```


    # Result


    | J. Doe: 248-555-1234 |

    | B. Smith: (313) 555-1234 |

    | A. Lee: (810)555-1234 |

    | M. Jones: 734.555.9999 |


    # Analysis


    The opening match now tests for or as an optional set, using pattern \(.)?\?.
    Similarly,

    [\.) tests for or .. (also optional), and [-\.] tests for or .. Other phone number
    formats could be added just as easily.'
