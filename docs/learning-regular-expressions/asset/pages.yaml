  md: '# U.S. ZIP Codes


    ZIP codes were introduced to the U.S. in 1963 (ZIP is actually an acronym for
    Zone Improvement Plan). There are more than 40,000 U.S. ZIP codes, all made up
    of digits (the first digit is assigned from East to West, with 0 being on the
    East and 9 being on the West Coast). In 1983, the post office began using an extended
    ZIP code ZIP+4. The extra four digits provide a greater level of granularity (often
    a specific block or building), which makes use of ZIP+4 optional, and if so, ZIP-code
    validation must be able to accommodate both five-digit ZIP codes and ZIP+4 (with
    a hyphen separating the first five digits from the additional four digits):


    # Text


    999 1st Avenue, Bigtown, NY, 11222

    123 High Street, Any City, MI 48034-1234


    # RegEx


    ```

    \d{5}(-\d{4})?

    ```


    # Result


    999 1st Avenue, Bigtown, NY, 11222

    123 High Street, Any City, MI 48034-1234


    # Analysis


    \d{5} matches any digits, and -\d{4} matches a hyphen followed by the +4 digits.
    Because these additional four digits are essentially optional, -\d{4} is enclosed
    within parentheses (turning it into a subexpression), and ? is used to optionally
    allow a single instance of that subexpression.


    # Canadian Postal Codes


    Canadian postal codes are six characters made up of alternating letters and digits.
    The first series of three letters and digits identify the forward sorting area
    (or FSA), and the second series of three letters and digits identify the local
    delivery unit (or LDU). The first letter of the FSA identifies the province, territory,
    or region (18 letters are valid in this, A for Newfoundland and Labrador, B for
    Nova Scotia, K, L, N, and P for Ontario, excluding Toronto, which uses M, and
    so on), and so validation should ideally ensure that the first letter is a valid
    one. Canadian postal codes are generally formatted using a space to separate the
    FSA from the LDU:


    # Text


    123 4th Street, Toronto, Ontario, M1A 1A1

    567 8th Avenue, Montreal, Quebec, H9Z 2Z9'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Lesson 11 Regular Expression Solutions to Common Problems


    # RegEx


    [ABCDEFGHIJKLMNPRSTVXY] \d[A-Z] \d[A-Z]\d


    # Result


    123 4th Street, Toronto, Ontario, M1A 1A2

    567 8th Avenue, Montreal, Quebec, H9Z 9Z9


    # Analysis


    [ABCDEFGHIJKLMNPRSTVXY] matches any one of 18 valid characters, and \d[A-Z] matches
    a digit followed by any alphabetic character, and the FSA. \d[A-Z]\d matches a
    digit followed by an alphabetic character followed by a digit.


    > Note

    This regular expression is one that should not be case sensitive.


    # United Kingdom Postcodes


    United Kingdom postcodes are five, six, seven letters and digits defined by the
    Royal Mail. Postcodes are made up of two: the outward postcode (or outcode) and
    the inward postcode (or incode). The outcode is one or two alphabetic letters
    followed by one or two digits, one or two letters followed by a digit and a letter.
    The incode is always a single digit followed by two characters (any characters
    excluding C, I, K, M, O, and V, which are never used in postcodes). The incode
    and outcode are separated by a space:


    # Text


    171 Kyverdale Road, London N16 6PS

    33 Main Street, Portsmouth, P01 3AX

    18 High Street, London NW11 8AB


    # RegEx


    ```

    [A-Z]{1,2}\d[A-Z]\d | \d[ABD-HLJNP-UW]{2}

    ```


    # Result


    171 Kyverdale Road, London N16 6PS

    33 Main Street, Portsmouth, P01 3AX

    18 High Street, London NW11 8AB'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Analysis


    The code \d matches one or two alphabetic characters followed by a digit using
    [A-Z]{1,2}\d[A-Z]? matches an additional alphanumeric character if it exists.
    As such, [A-Z]{1,2}\d[A-Z]? matches every possible valid digit combination. To
    match the outcode, the pattern \d[ABD-HJLNPU-UW]{2} is used; this matches a single
    digit followed by two of allowed alphabetic characters (A, B, D through H, J,
    L, N, P through U, and W through 2).


    > Note

    This regular expression is one that should not be sensitive.


    # U.S. Social Security Numbers


    U.S. social security numbers (often abbreviates SSN) are three sets of digits
    separated by hyphens; the first set contains three digits, the second set contains
    two, and the third set contains four digits. Since 1972, the first set of three
    digits have been assigned based on the address provided on the application:


    # Text


    John Smith: 123-45-6789


    # RegEx


    ```

    \d{3}-\d{2}-\d{4}

    ```


    # Result


    John Smith: 123-45-6789


    # Analysis


    \d{3}-\d{2}-\d{4} matches any three digits followed by a hyphen, two digits, a
    hyphen, and any four digits.


    > Note

    Combinations of digits are potentially valid social security numbers, but a couple
    of rules can be used if needed. Valid social security numbers never have a field
    that is all 0s, and the first set of digits (thus far) must be no greater than
    728 (numbers higher than that have never been assigned, although they could be
    at some time in the future). this would be a very complex pattern to write, and
    so simpler \d{3}-\d{2}-\d{4} is usually used.'
