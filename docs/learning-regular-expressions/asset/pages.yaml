  md: "# Appendix A Regular Expressions in Popular Applications and Languages\n\n\
    > Note\nA complete MySQL statement using a regular expression would use such syntax\
    \ like this:\nSELECT * FROM table WHERE REGEXP \"pattern\".\n\nMySQL regular expression\
    \ support is useful and powerful, but it is not a full regular expression implementation:\n\
    \n+   - Only search support is provided; there is no support for replace operations.\n\
    - Searches are not case sensitive. To perform case-sensitive searches, use the\
    \ BINARY keyword (between REGEXP and the expression itself).\n- Use [[::] to match\
    \ the start of a word and [::] to match the end of a word.\n- Lookaround is not\
    \ supported.\n- Embedded conditions are not supported.\n- Octal character searching\
    \ is not supported.\n- \\a, \\b, \\e, \\f, and \\v are not supported.\n- Backreferences\
    \ are not supported.\n\n# Oracle PL/SQL\n\nPL/SQL is the SQL format used in Oracle\
    \ DBMSs. PL/SQL supports regular expressions as follows:\n\n+   - REGEXP_LIKE\
    \ can be used in lieu of SQL LIKE. \n\nFollowing are some useful notes pertaining\
    \ to PL/SQL regular expressions:\n\n+   - REGEXP_LIKE can be used to match text\
    \ in VARCHAR2, CHAR, NVARCHAR2, NCHAR, CLOB, or NCLOB data types.\n- Specify REGEXP_LIKE\
    \ parameter c for case-sensitive matching.\n- Specify REGEXP_LIKE parameter i\
    \ for case-insensitive matching.\n- Specify REGEXP_LIKE parameter n to allow .\
    \ to match the newline character.\n- Specify REGEXP_LIKE parameter x to ignore\
    \ whitespace characters.\n- The pipe character | can be used for OR.\n\n# Perl\n\
    \nPerl is the granddaddy of regular expression implementations, and most other\
    \ implementations attempt to be Perl compatible."
