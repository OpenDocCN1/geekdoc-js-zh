    # MySQL


    MySQL is a popular open source database, and MySQL ventures where no other databases
    have yet to venture providing regular expression support as a way to perform database
    searches.


    Regular expression support in MySQL is accessed in WHERE clauses in the following
    format:


    ```

    REGEXP "expression"

    ```'
