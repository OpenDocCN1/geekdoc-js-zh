- img_proc: true
  md: '# RegEx


    \B-\B


    # Result


    Please enter the nine-digit id as it appears on your color coded pass-key.


    # Analysis


    \B-\B matches a hyphen that is surrounded by word-break characters. The hyphens
    in nine-digit and pass-key do not match, but the one in color - coded does.


    > Note

    As seen in Lesson 4, “Using Metacharacters,” uppercase metacharacters usually
    negate the functionality of their lowercase equivalents.


    > Note

    Some regular expression implementations support two additional metacharacters.
    Whereas \b matches the start or end of a word, \< matches only the start of a
    word and \> matches only the end of the word. Although the use of these characters
    provides additional control, support for them is very limited (they are supported
    in egrep, but not in many other implementations).


    # Defining String Boundaries


    Word boundaries are used to locate matches based on word position (start of word,
    end of word, entire, and so on). String boundaries perform a similar function
    but are used to match patterns at the start or end of an entire string. The string
    boundary metacharacters ^ for start of string and $ for end of string.


    > Note

    In Lesson 3, “Matching Sets of Characters,” you learned that ^ is used to negate
    a set. Can it also be used to indicate the start of a string?


    +   ^ is one of several metacharacters that has multiple uses. It negates a set
    only if in a set (enclosed within [ and ]) and is the first character after the
    opening ]. Outside of a set, and at the beginning of a pattern, ^ matches the
    start of the string.'
