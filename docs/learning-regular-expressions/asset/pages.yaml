- img_proc: true
  md: "# Result\n\n```\n<script>\nfunction doSpellCheck(form, field) {\n  // Make\
    \ sure not empty\n  if (field.value == '') {\n    return false;\n  }\n  // Init\n\
    \  var windowName='spellWindow';\n  var spellcheckURL='spell.cfm?formname=comment&fieldname='+field.name+'\n\
    \  ...\n  // Done\n  return false;\n}\n</script>\n```\n\n# Analysis\n\n^\\ matches\
    \ the start of a string, followed by any whitespace, followed by \\/ (used to\
    \ define JavaScript comments), followed by any text, and then an end of string.\
    \ That pattern would match only the first comment (and only if it were the only\
    \ text in the page). The (?m) modifier in (?m)^\\*\\$ forces the pattern to treat\
    \ line breaks as string separators, and all comments were matched.\n\n> (?m) is\
    \ not supported by many regular expression implementations, including JavaScript.\n\
    \n# Note\n\nSome regular expression implementations also use the support of \\\
    A to mark the start of a string and \\Z to mark the end of a string. If supported,\
    \ these metacharacters function like ^ and $, respectively, unlike ^ and $, they\
    \ are not modified by (?m) and will therefore not operate in multiline mode.\n\
    \n# Summary\n\nRegular expressions can match any blocks of text or text at specific\
    \ locations within a string. \\b is used to specify a word boundary (and \\B does\
    \ the exact opposite). ^ and $ mark string boundaries (start of string and end\
    \ of string, respectively), although when used with the (?m) modifier, ^ and $\
    \ will also match strings that start or end at a line break."
