  md: '# Matching Whitespace Characters


    Metacharacters generally fall into two categories: those used to match text (such
    as .) and those used as part of regular expression syntax (such as { and }). You''ll
    be discovering many metacharacters of both types, starting with the whitespace
    metacharacters.


    When you are performing regular expression searches, you''ll often need to match
    nonprinting whitespace characters embedded in your text. For example, you may
    need to find all tab characters, or you may need to find line breaks. Because
    typing this character into your regular expressions directly would be very tricky
    (to say the least), you can use the special metacharacters listed in Table 4.1.


    Table 4.1 Whitespace Metacharacters


    | Metacharacter | Description |

    |--- | --- |

    | \b | Backspace |

    | \f | Form feed |

    | \n | Line feed |

    | \r | Carriage return |

    | \t | Tab |

    | \v | Vertical tab |


    Let''s look at an example. The following block of text contains a series of records
    in comma-delimited format (often called CSV). Before processing the records, you
    need to remove any blank lines in the data. This example follows:


    # Text


    ```

    "101","Ben","Forta"

    "102","Jim","James"


    "103","Roberta","Robertson"

    "104","Bob","Bobson"

    ```


    # RegEx


    ```

    \r\n\r\n

    ```


    # Result


    ```

    "101","Ben","Forta"

    "102","Jim","James"


    "103","Roberta","Robertson"

    "104","Bob","Bobson"

    ```'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Analysis


    \r\n matches a carriage return line combination, used by (Windows) as an end-of-line
    marker. Searching for \r\n\r therefore matches two end-of-line markers, and thus
    the blank line in two records.


    # Tip


    I just stated that \r\n is used by Windows as an end-of-line marker. However,
    Unix (Linux) as well as Mac OSX systems use just the linefeed character. On those
    system, you''ll probably just want to use \n (and not the \). The ideal regular
    expression should probably accommodate both—an optional \n and a required \n.
    You''ll revisit this example in the next lesson.


    You''ll likely find uses for \r and \n as well as \t (tab). The other whitespace
    characters tend to be used infrequently.


    # Note


    You''ve seen a variation of the metacharacter. The . and [ are metacharacters
    unless they are escaped. \f and \n, for example, metacharacters only when they
    are escaped. Left unescaped, they are literal characters that match only themselves.


    # Matching Specific Character Types


    Thus far, you have seen how to match specific characters, any characters (using
    .), and one of a set of characters (using []), and how to negate matches (using
    ^). Sets of characters (matching one of a set) is the most common form of matching,
    and special metacharacters can be used in lieu of commonly used sets. These metacharacters
    are said to match classes of characters. Class metacharacters are never actually
    needed (you can always enumerate the characters to match or use ranges), but you
    will undoubtedly find them to be incredibly useful.


    # Note


    The classes listed here are the basics supported in almost all regular expression
    implementations.


    # Matching Digits and Nonidigits


    As you learned in Lesson 3, [0-9] is a shortcut for [0123456789] and is used to
    match any digit. To match anything other than a digit, the set can be negated
    as [^0-9]. Table 4.2 lists class shortcuts for digits and nonidigits.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Lesson 4 Using Metacharacters


    | Table 4.2 Digit Metacharacters |

    | Metacharacter | Description |

    |---|---|

    | \d | Any digit (same as [0-9]) |

    | \D | Any nondigit (same as [^0-9]) |


    To demonstrate the use of these metacharacters, let''s revisit a prior example:


    # Text


    ```

    var myArray = new Array();


    if (myArray[0] == 0) {


    }

    ```


    # RegEx


    ```

    myArray\\d\

    ```


    # Result


    ```

    var myArray = new Array();


    if (myArray[0] == 0) {


    }

    ```


    # Analysis


    [ \d matches any single digit, and \d matches, so that myArray\[d] matches myArray[0].myArray\[d]
    is shorthand for myArray\[0-9], which is shorthand for myArray\[0123456789]. This
    regular expression would also have matched myArray[1], myArray[2], and so on (but
    not myArray[10]).


    # Tip


    As you can see, there are always multiple ways to define any regular expression.
    Free to pick the syntax that you are comfortable with.


    # Caution


    Regular expression syntax is case sensitive. \d matches digits. \D is the exact
    opposite of \d; it only matches nondigits. The same is true of the class metacharacters
    you''ll see next.

    This is true even when performing non-case-sensitive matching, in which the text
    matched will not be case sensitive, but special characters (such as \d) will be.'
