- img_proc: true
  md: '# Negating Lookaround


    As thus far, lookahead and lookbehind are usually used to match text, essentially
    to specify the location of text to be returned (by specifying the text before
    or after the desired match). These are known as positive lookahead and positive
    lookbehind. The term positive refers to the fact that they look for a match.


    Lesser-used form of lookaround is the negative lookaround. Negating lookahead
    looks for text that does not match the specified pattern, and negative lookbehind
    similarly looks for text that does not match the specified pattern.


    You might have expected to be able to use ^ to negate a lookaround, but no, the
    syntax is a little different. Lookaround operations are negated using ! (which
    replaces the =). Table 9.1 lists all the lookaround operations.


    # Table 9.1 Lookaround Operations


    | Class | Description |

    |---|---|

    | (=) | Positive lookahead |

    | (!!) | Negative lookahead |

    | (?<=) | Positive lookbehind |

    | (?<!) | Negative lookbehind |


    > Tip

    Generally, any regular expression implementations supporting lookahead support
    both positive and negative lookahead. Similarly, those implementations supporting
    lookbehind support both positive and negative lookbehind.


    To demonstrate the difference between positive and negative lookbehind, here is
    an example. The following block of text contains numbers—both prices and quantities.
    First we''ll just obtain the:


    # Text


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    I saved $5 on this order.

    ```


    # RegEx


    ```

    (?=\$)\d+

    ```


    # Result


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    I saved $5 on this order.

    ```'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Lesson 9 Looking Ahead Behind


    # Analysis


    This is very similar to the example seen previously. \d+ matches numbers (one
    or more digits), and (?<=\$) looks behind to match (not consume) the $ (escaped
    as \$). Therefore, the numbers in the two prices were matched, but not the quantities.


    Now we''ll do the opposite, locating just the quantities but not the prices:


    # Text


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    saved $5 on this order.

    ```


    # RegEx


    ```

    \b(?<=\!$)\d+\b

    ```


    # Analysis


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    saved $5 on this order.

    ```


    # Analysis


    Again, \d+ matched numbers, but this time only the quantities matched and not
    the prices. Expression (?<=\!$) is a negative lookbehind that will match only
    when what precedes the numbers is not a $$. Changing the = in the lookbehind changes
    the pattern from positive to negative.


    You may be wondering why the pattern in the negative lookbehind example defines
    boundaries (using \b). To understand why this is necessary, here is the same example
    without boundaries:


    # Text


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    saved $5 on this order.

    ```


    # RegEx


    ```

    (?<=\!$)\d+

    ```


    # Analysis


    ```

    I paid $30 for 100 apples,

    50 oranges, and 60 pears.

    saved $5 on this order.

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Analysis


    Without word boundaries, the 0 in \30 was also matched. Why? Because there is
    $ in front of it. Enclosing the entire pattern within word boundaries solves this
    problem.


    # Summary


    Looking ahead and behind provides greater control over what is returned when matches
    are made. The lookaround operations allow subexpressions to be used to specify
    the location of text to be matched but not consumed (matched, but not included
    in the matched text itself). Positive lookahead is defined using (?=), and negative
    lookahead is defined using (!). Some regular expression implementations also support
    lookbehind (?<=) and negative lookahead using (?<!).'
  merge: -1
