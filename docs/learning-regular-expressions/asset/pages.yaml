  md: '# Introduction


    Regular expressions and the regular expression language have been around for many
    years. Regular expression experts have long been armed with an incredibly powerful
    tool, one that can be used to perform all sorts of text processing and manipulation
    in just about every language and on every platform.


    That''s the good news. The bad news is that for too long, regular expressions
    have been the exclusive property of only the most savvy. Most of us do not fully
    understand what regular expressions do and what problems they solve. Those who
    have braved them find regular expression syntax to be unintuitive, and even convoluted
    at times. That''s sad, because the truth is that regular expressions are nowhere
    as complex as they appear to be at first glance. All it takes is a clear understanding
    of the problem being solved and how to leverage regular expressions so as to solve
    them.


    Part of the problem is scarcity of quality on the subject. The few books on regular
    expressions (and indeed, most of the Web sites being regular expression tutorials)
    tend to concentrate on the syntax, defining what does and differs from But that
    is the easy part; there are not many special characters in the regular expression
    language. The tricky part is understanding how they should be used so as to solve
    real-world problems.


    The book you are holding is not intended to be the last word on everything there
    is to know about regular expressions. If it is what you want, you need a copy
    of Jeffrey Friedl''s Mastering Regular Expressions (O''Reilly, ISBN 0596528214).
    Mr. Friedl is the acknowledged regular expressions guru, and his book is the definitive
    and most comprehensive on the subject. But, no offense to Mr. Friedl, his book
    is not for beginners—or for casual users who just want to get their jobs done
    without needing to understand the inner workings of regular expression engines.
    That is not useful information—it is, but not when all you want to add validation
    to your HTML forms or simply perform regular operations on parsed text. If you
    need to get up and running using regular expressions, you''ll find yourself there
    having too little information to be productive and having too much information
    to know where.


    And that is where this book comes in. Learning Regular Expressions will teach
    you the regular expressions that you really need to know, starting with simple
    text matches and up to more complex topics, including the use of backreferences,
    conditional evaluation, and look-ahead processing. You''ll learn what you can
    use, and you''ll learn it methodically, systematically, and simply by using clear
    and practical examples and solving real problems.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Who Is Learning Regular Expressions For?


    This book is for you:


    +   - You are new to regular expressions.

    - You want to quickly learn how to get the most out of the regular expression
    language.

    - You want to gain an edge by learning to solve real problems using one of the
    most powerful (and least understood) tools available to you.

    - You build Web applications and crave more sophisticated form and text processing.

    - You use JavaScript, Java, .NET, PHP, Python, MySQL, (and any other languages
    and DBMSs with regular expression support), and you want to learn how to use regular
    expressions within your own application development.

    - You want to be productive quickly and easily in regular expressions, without
    having to call someone for help.


    So turn to Lesson 1, “Introducing Regular Expressions,” and get to work. You’ll
    be leveraging the power of regular expressions in no time at all and wondering
    how you ever managed without them.'
  merge: -1
