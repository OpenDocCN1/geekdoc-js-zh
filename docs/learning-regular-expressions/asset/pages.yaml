  md: '# Lesson 6


    # Position Matching


    You''ve now learned how to match all sorts of characters in all sorts of combinations
    and repetitions and in any location within text. However, it is sometimes necessary
    to match at specific locations within a block of text, and this requires position
    matching, which is explained in this lesson.


    # Using Boundaries


    Position matching is used to specify where within a string of text a match should
    occur. To understand the need for position matching, consider the following example:


    Text


    The cat scattered his food all over the room.


    RegEx


    cat


    Result


    The cat scattered his food all over the room.


    Analysis


    The pattern cat matches all occurrences of cat, even cat within the word scattered.
    This may be, in fact, the desired outcome, but more likely than it is not. If
    you were performing the search to replace all occurrences of cat with dog, you
    would end up with the following nonsense:


    The dog scattered his food all over the room.


    That brings us to the use of boundaries, or special metacharacters used to specify
    the position (or boundary) before or after a pattern.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Using Word Boundaries


    The first boundary (and one of the most commonly used) is the word boundary specified
    as \b. As its name suggests, \b is used to match the start or end of a word.


    To demonstrate the use of \b, here is the previous example again, this time with
    the boundaries specified:


    Text


    The cat scattered his food all over the room.


    RegEx


    ```

    \bcat\b

    ```


    Result


    The cat scattered his food all over the room.


    Analysis


    The word cat has a space before and after it, and so it matches \bcat\b (space
    is one of the characters used to separate words). The word cat in scattered, however,
    did match, because the character before it is s and the character after it is
    t (neither of which match \b).


    > Note

    So what exactly is it \b matches? Regular expression engines do not understand
    English, or any language for that matter, and they do not know what word boundaries
    are. \b simply matches a location between characters that are usually parts of
    words (alphanumeric characters) and underscore, text that would be matched by
    \w and anything else (that would be matched by \W).


    It is important to realize that a whole word, \b must be used both before and
    after the text to be matched. Consider this example:


    Text


    The captain wore his cap and cape crowdly as he sat listening to the recap of
    how his crew saved the men from a capsized vessel.


    RegEx


    ```

    \bcap\b

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Result


    The captain wore his cap and cape proudly as he sat listening to the recap of
    how his crew saved the men from a capsized vessel.


    # Analysis


    The pattern \bcap matches any word that starts with cap, and four words matched,
    including three that are not the word cap.


    Following is the same example but with only a trailing \b:


    # Text


    The captain wore his cap and cape proudly as he sat listening to the recap of
    how his crew saved the men from a capsized vessel.


    # RegEx


    ```

    cat\b

    ```


    # Result


    The captain wore his cap and cape proudly as he sat listening to the recap of
    how his crew saved the men from a capsized vessel.


    # Analysis


    cap\b matches any word that ends with cap, and so two matches were found, including
    one that is not the word cap.


    If only the word was to be matched, the correct pattern to use would be \bcap\.


    > Note

    \b does not actually match a character; rather, it matches a position. The string
    matched \bcat\ will be three characters in length (c, a, and t), not five characters
    in length.


    To specifically not match at a word boundary, use \B. This example uses \B metacharacters
    to help locate hyphens with extraneous spaces around them:


    # Text


    Please enter the nine-digit id as it appears on your color - coded pass-key.'
