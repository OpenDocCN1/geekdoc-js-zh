  md: '# Appendix A Regular Expressions in Popular Applications and Languages


    It is also possible, via wrapper functions, to execute a regular expression without
    needing to instantiate and work with a Regex class instance:


    +   - Regex.IsMatch() is functionally equivalent to the IsMatch() method described
    in the previous list.


    +   - Regex.Match() is functionally equivalent to the Match() method.


    +   - Regex.Matches() is functionally equivalent to the Matches() method.


    +   - Regex.Replace() is functionally equivalent to the Replace() method.


    +   - Regex.Split() is functionally equivalent to the Split() method.


    Here are some important points pertaining to .NET regular support:


    +   - To use regular expressions, the regular objects must be imported using System.Text.RegularExpressions.


    +   - For quick inline regular expression processing, the wrapper functions are
    ideal.


    +   - Regular expression options are specified using the Regex.Options—RegexOption
    can be used to set members such as IgnoreCase, Multiline, Singleline, and more.


    +   - .NET supports capture, the capacity to name subexpressions (so as be able
    to refer to them by name instead of number). The syntax for this is \<name> to
    name a subexpression, \<name> to refer to the backreference, and ${name} to refer
    to it in a replacement pattern.


    +   - When using backreferences, $ returns everything before the matched string,
    $'' returns the last matched subexpression, $_ returns the entire matched string.


    +   - Case conversion using \E, \1, \L, \u, and \U is not supported.


    +   - The POSIX character classes are not supported.


    # Microsoft SQL Server T-SQL


    Microsoft SQL Server does not support regular expressions natively. However, SQL
    Server T-SQL statements can use the Microsoft CLR (Common Language Runtime), which
    exposes regular expression functionality. CLR is beyond the scope of this book,
    but documentation can be found on the Microsoft site.


    # Microsoft Visual Studio .NET


    Regular expression support in Visual Studio .NET is provided by the .NET Framework.
    See the .NET section earlier in this appendix.'
