  md: '# Matching Alphanumeric Characters (and Nonalphanumeric Characters)


    Another frequently used set are all the alphanumeric characters, A through z (in
    uppercase and lowercase), the digits, and the underscore (often used in file and
    directory names, application variable names, database object names, and more).
    Table 4.3 lists the class shortcuts for alpha-numeric characters and nonalphanumeric
    characters.


    Table 4.3 Alphanumeric Metacharacters


    | Metacharacter | Description |

    |--- |--- |

    | \w | Any alphanumeric character in upper- and lowercase (as as [a-zA-Z0-9])
    |

