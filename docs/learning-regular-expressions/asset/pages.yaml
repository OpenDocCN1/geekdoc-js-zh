  md: '# # Matching Zero or One Characters


    One other very useful metacharacter is ?. Like +, ? matches optional text (and
    so zero instances will match). Unlike +, ? matches only zero or one instance of
    a character (or set), but not more than one. As such, ? is very useful for matching
    specific, single optional characters in a block of text.


    Consider the following example:


    | Text |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    | RegEx |

    | --- |

    | http:\/[\w.\]+\+ |


    | Result |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    The pattern used to match a URL is http:\/ (which is literal text, including two
    escaped slashes, followed by [\w]+ which matches one or more instances of a set
    that allows alphanumeric characters, ., and forward slash. This pattern can match
    only the first URL (the one that starts with http**) but not the second (the one
    that starts with https://). And * (zero or more instances of s) would not be correct
    because that would then allow httpsssss:// (which is definitely not valid).


    The solution to use ? as seen in the following example:


    | Text |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |


    | RegEx |

    | --- |

    | http?\/[\w.\]+\+ |


    | Result |

    | --- |

    | The URL is http://www.forta.com/, to connect securely use https://www.forta.com/
    instead. |'
