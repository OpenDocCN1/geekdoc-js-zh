    That worked. (?<=<[T][i] [T][L] [e]E>) is a lookbehind operation that matches
    (but does not consume) <title>;(?=/ [T][i] [T][L] [e]>) similarly matches (but
    does not consume) </title>. All that is returned is the text (as that is all that
    was consumed).


    > Tip

    In the preceding example, it may be worthwhile to escape the < (the first character
    matched) to prevent ambiguity, so (?<=\< instead of (?<=<).'
