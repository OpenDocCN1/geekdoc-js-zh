  md: '# RegEx


    ```

    [\w.]+@[\w.]+\.\w+

    ```


    # Result


    Hello .ben@forta.com is my email address.


    # Analysis


    You will recall that [\w.]+ matches one or more instances of alphanumeric characters
    and ., and so .ben matched. is obviously a typo in the preceding text (an extraneous
    period in the middle of the text), but is that irrelevant. The bigger issue is
    that although . a valid character in an email address, it is not a valid character
    with which to start an email address.


    In other words, what you really need to match is alphanumeric text with optional
    additional characters, like this:


    # Text


    Hello .ben@forta.com is my email address.


    # RegEx


    ```

    \w+[\w.]*@[\w.]+\.\w+

    ```


    # Result


    Hello .ben@forta.com is my email address.


    # Analysis


    This pattern is looking increasingly complex (RegEx patterns often looks far more
    complex than they actually are), so let''s look at it together. \w+ matches any
    alphanumeric character but not (the valid characters with which to start an email
    address). The initial valid character, it is indeed possible to have a . and additional
    characters, although these may be in fact not present. [\w]* matches zero or more
    instances of . alphanumeric characters, which is exactly what was needed.


    > Note

    Think of * being the make optional metacharacter. Unlike +, which requires at
    least one match, matches any number of matches if present, but does not require
    that any be present.


    > Tip

    * is a metacharacter. To match an * you''ll need to escape it as \*'
