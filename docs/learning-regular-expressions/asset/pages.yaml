  md: '# Lesson 8


    # Using Backreferences


    The previous lesson introduced subexpressions as a way to group characters into
    sets. A primary use of this type of grouping is to be able to properly control
    repeating pattern matches (as demonstrated in that lesson). This lesson looks
    at the other important use of subexpressions—working with backreferences.


    # Understanding Backreferences


    The best way to understand the need for backreferences is to look at an example.
    HTML developers use the headers `<h1>` through `<h6>`, with corresponding end
    tags) to define and format header text within Web pages. Suppose you needed to
    locate all header text, regardless of header level. Here''s the example:


    # Text


    ```

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br>

    <h2>SQL</h2>

    Information about SQL

    <h2>Regex</h2>

    Information about Regular Expressions.

    </body>

    ```


    # Regex


    ```

    <[hH]1.*\</[hH]1>

    ```


    # Result


    ```

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br>

    <h2>SQL</h2>

    ```'
