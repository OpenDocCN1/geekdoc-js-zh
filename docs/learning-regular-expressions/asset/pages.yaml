    PHP provides Perl-compatible regular expression support via the PCRE (Perl Compatible

    package).


    The following regular expression functions are supported by PCRE:


    +   - preg_grep() performs a search and returns an array of matches.

    - preg_match() performs a regular expression search for the first match.

    - preg_match() performs a global regular expression search.

    - preg_quote() takes a pattern and returns an escaped version of it.

    - preg_replace() performs a search-and-replace operation.

    - preg_replace_callback() performs a search-and-replace operation, but uses a
    callback

    function to perform the actual replacement.

    - preg_split() splits a string into substrings.


    Note the following:


    +   - For matching that is not case sensitive, use the i modifier.

    - Multiline strings can be enabled using the m modifier.

    - PHP can evaluate replacement strings as PHP code. To enable this functionality,
    use the

