- img_proc: true
  md: '# IP Addresses


    IP addresses are made up of four bytes (each with a valid range of 0-255). IP
    addresses are usually formatted as four sets of digits (each is one to three digits
    in length) separated by . characters:


    Text


    ```

    localhost 127.0.0.1.

    ```


    RegEx


    ```

    ((25[0-5]) | (2[0-4]\d) | (\d{2}) | (\d{1,2}))\.{3}

    ->((25[0-5]) | (2[0-4]\d) | (\d{2}) | (\d{1,2})))

    ```


    Result


    ```

    localhost 127.0.0.1.

    ```


    Analysis


    This pattern uses a series of nested subexpressions. ((25[0-5]) | (2[0-4]\d) |
    (1\d{2}) | (\d{1,2})) is a set of four nested subexpressions. \d{2} matches any
    one- or two-digit number or 0 through 99. \d{3} matches any three-digit number
    starting with 1 (1 followed by two digits), or 100 through 199. (2[0-4]\d) matches
    200 through 249. (25[0-5]) matches 255 through 255. Each of these subexpressions
    is enclosed within another subexpression with a | between each (so that one of
    the four subexpressions matches, not all). After the range of numbers comes .
    to match ., and then the entire series (all number options plus .) is enclosed
    yet another subexpression and repeated three times using {3}. Finally, the range
    of numbers is repeated (this time without the trailing .) to match the final IP
    address number. By restricting each of the four numbers to values between 0 and
    255, this can indeed make valid IP addresses and reject invalid addresses.


    +   This IP example is explained in detail in Lesson 7, "Using Subexpressions."


    # URLs


    URL matching is a complicated task—or rather, it can be complicated depending
    on how flexible the matching needs to be. At a minimum, URL should match the protocol
    (probably http and https), a hostname, an optional port, and a path:'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Text


    http://www.forta.com/blog

    https://www.forta.com:80/blog/index.cfm

    https://www.forta.com

    http://ben:password@www.forta.com/

    http://localhost/index.php?ab=1&c=2

    http://localhost:8500/


    # RegEx


    https:///\[-\w.]+\(\d+)?(\/([\w.]*)*)?


    # Result


    http://www.forta.com/blog

    https://www.forta.com:80/blog/index.cfm

    https://www.forta.com

    http://ben:password@www.forta.com/

    http://localhost/index.php?ab=1&c=2

    http://localhost:8500/


    # Analysis


    https:// matches http or https:// (the makes s optional). \[-\w.]+\ matches the
    hostname. (:\d+) matches an option (as seen in the second and sixth lines in the
    example). (\/([\w.]*)*) matches the path, the other subexpression matches if one
    exists, and the inner subexpression matches the path itself. As you can see, this
    pattern cannot handle query strings, and it misreads embedded username:password
    pairs. However, for most URLs it will work adequately (matching hostnames, ports,
    and paths).


    > NotenThis regular expression is one that should not be case sensitive.


    > TipTo accept ftp URLs as well, replace the https? with (http|https|ftp). You
    can do the same for other URL types if needed.


    # Complete URLs


    A more complete (and slower) pattern would also match URL query strings (variable
    information) passed to a URL and separated from the URL itself by a ?, as well
    as optional login information, if specified:'
  merge: -1
