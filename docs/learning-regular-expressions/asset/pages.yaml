- img_proc: true
  md: '# Matching with Backreferences


    Note

    nThe term *backreference* refers to the fact that these entities *refer back*
    to a previous expression.


    What exactly does \1 mean? It matches the first subexpression used in the pattern.
    \2 would match the second subexpression, \3 the third, and so on. \1 [ +(\w*)
    ]+\1 thus matches any word and the same word as was seen in the preceding example.


    Caution

    Unfortunately, backreference syntax differs greatly from one regex implementation
    to another. JavaScript used \ to denote a backreference (except in replace operations
    $ is used), as do vi. PHP uses $ ($1 instead of \). The .NET regular expression
    support returns an object containing a property Groups that contains the matches,
    so match.Groups[1] refers to the first match in match. Visual Basic .NET, PHP
    returns this information in an array $matches, so $matches[1] refers to the first
    match (although this behavior can be changed based on the flags used). Java and
    Python return a match object containing an array named group.

    Implementation specifications are listed in Appendix A.


    Tip

    You think of backreferences as similar to variables.


    Now that you''ve seen how backreferences are used, let''s revisit the HTML header
    example. Using backreferences, it is possible to create a pattern that matches
    any start tag and the matching end (ignoring mismatched pairs). Here''s the example:


    ```

    Text

    <body>

    <h1>Welcome to my Homepage</h1>

    Content is divided into two sections:<br/>

    <h2>SQL</h2>

    Information about SQL.

    <h2>RegEx</h2>

    Information about Regular Expressions.

    <h2>This is not valid HTML</h2>

    </body>

    ```


    ```

    RegEx

    <[h] ([1-6]).*?<\/[h]\1

    ```'
