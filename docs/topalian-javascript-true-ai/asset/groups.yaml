    // HowToCombineJSFiles.js


    TUTORIAL:


    How to Combine all .js files in all folders that are in our js folder.


    Getting things ready:


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)


    We should add two new lines at the end of every script. This way they will combine
    nicely with a line break in between each script.


    Step One: Open our js folder


    Step Two: Type in the address bar of the js folder, **cmd**, press Enter. This
    opens our js folder in the command prompt


    Step Three: Type the command shown below in the command prompt and then press
    Enter


    `for /r "%CD%" %i in (**.js) do type "%i" >> main.js`


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)


    Now we have a newly created .js file named main.js that has all of js files included
    into one file. This makes it easy to upload our application and easy to find out
    how many lines of code our project is. To use our main.js file, we include it
    in our html file: `<script src=''js/main.js''></script>`


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)


