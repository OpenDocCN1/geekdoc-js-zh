    // 如何合并JS文件.js


    教程：


    如何合并我们 js 文件夹中所有子文件夹下的所有 .js 文件。


    准备工作：


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)


    我们应该在每个脚本的末尾添加两个新行。这样它们就能每个脚本之间通过换行符完美合并。


    第一步：打开我们的 js 文件夹


    第二步：在 js 文件夹的地址栏中输入 **cmd**，按回车。这会在命令提示符中打开 js 文件夹


    第三步：在提示符中输入所示命令并按回车


    `for /r "%CD%" %i in (**.js) do type "%i" >> main.js`


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)


    现在我们有了一个名为 main.js 的新 .js 文件，它将所有的 js 文件都包含在一个文件中。这使得我们很容易上传应用程序，并且易于发现项目有多少行代码。要使用我们的
    main.js 文件，我们要在 html 文件中引入它：`<script src=''js/main.js''></script>`


    ![](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)[](img/14f87992ce4751a6c40a2d6dfe52ba02_18_0.png)


