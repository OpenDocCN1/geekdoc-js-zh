  md: '![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_17_0.png)


    **Now we have a newly created .js file named **


    **main.js that has all of our js files included **


    **into one file.**


    **This makes it easy to upload our application **


    **and easy to find out how many lines of code **


    **our project is.**


    **To use our main.js file, we include it in our **


    **html file code:**


    **<script src = ''js/main.js''></script>**


    **Happy Scripting :-)**'
