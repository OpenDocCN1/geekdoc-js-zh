- img_proc: true
  md: '![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)![](img/14f87992ce4751a6c40a2d6dfe52ba02_16_0.png)


    **We should add two new lines at the end every**


    **script. This way they will combine nicely with **


    **a line break in between each script.**


    **Step One: Open our js folder**


    **Step Two: Type in the address bar of the js **


    **folder, ****cmd****, press Enter**


    **This opens our js folder in the command **


    **prompt**


    **Step Three: Type the command shown below **


    **in the command prompt and then press Enter**


    **for /r "%CD%" %i in (\*.js) do type "%i" >> **


    **main.js**'
