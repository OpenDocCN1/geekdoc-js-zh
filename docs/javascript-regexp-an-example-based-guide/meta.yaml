  md: '# matchAll method


    If you need to capture group portions and properties for every match with g flag
    active, use matchAll method. The return value is an iterator.


    ```

    > ''abc ac adc abcbc''.matchAll(/ab*c/g)

    > RegExpStringIterator { }

    ```


    ```

    // convert the iterator result to array of arrays

    // let arr = [...''abc ac adc abcbc''.matchAll(/ab*c/g)]

    // arr

    // <3> [Array(1), Array(1), Array(1)]

    0: ["abc", index: 0, input: "abc ac adc abcbc", groups: undefined]

    1: ["ac", index: 4, input: "abc ac adc abcbc", groups: undefined]

    2: ["abbc", index: 11, input: "abc ac adc abcbc", groups: undefined]

    length: 3

    __proto_: Array(0)

    ```


    ```

    // get array with details for first match

    // arr[0]

    < ["abc", index: 0, input: "abc ac adc abcbc", groups: undefined]

    // get index for second match

    // arr[1].index

    < 4

    ```


    You can also use Array.from() to convert the iterator to array object. Array.from
    allows you to provide a mapping function as second argument.


    ```

    // same as match: /ab*c/g

    > Array.from(''abc ac adc abcbc''.matchAll(/ab*c/g), m => m[0])

    < ["abc", "ac", "abbc"]

    // get index for match

    > Array.from(''abc ac adc abcbc''.matchAll(/ab*c/g), m => m.index)

    < [0, 4, 11]

    ```


    ```

    // get capture group portions as array for each match

    > Array.from(''xx:yyy x:y''.matchAll(/(?:x*):(y*)/g), m => m.slice(1))

    < (4) [Array(2), Array(2), Array(2), Array(2)]

    0: ["xx", "yyy"]

    1: ["x", """]

    2: ["x", "yy"]

    3: ["", "y"]

    length: 4 4

    __proto_: Array(0)

    ```


    > Before the introduction of matchAll method, exec method had to be used. See
    MDN: exec details and examples.'
