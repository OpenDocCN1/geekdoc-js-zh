    ```

    // if flags are needed, specify them as the second argument

    > new RegExp(''dog'', ''i'')

    > /dog/

    ```


    The main advantage of the constructor over // literal is the ability to dynamically
    construct the regex using ${ to insert content of other variables or the result
    of an expression.


    ```

    > let greeting = ''hi''

    ```


    ```

    > const pat1 = new RegExp(`${greeting} there`)

    > pat1

    > /hi there/

    ```


    ```

    > new RegExp(`${greeting.toUpperCase()}} there`)

    > /HI there/

    ```


    > Both strings and RegExp objects support special sequences. Some sequences like
    \t and \n mean the same but sequences like \b have completely different meaning.
    To avoid unintended behavior, use \\ instead of \.


    ```

    > new RegExp(''123\tabc'')

    > /123 abc/

    ```


    ```

    > new RegExp(''123\\tabc'')

    > /123\tabc/

    ```


