    \ returns 'null'\n> 'cat and dog'.search(/xyz/)\n< -1\n```\n\n## Capture groups\n\
    \nThe regexp grouping inside {} is also known as capture group. It has multiple\
    \ uses to work with matched portions. When capture groups are used with match\
    \ method, the matched portions will be part of the array. The first element is\
    \ followed by group 1, second leftmost will get group number 2 and so on.\n\n\
    ```\n// there are capture groups used here\n> 'abc ac dc abbc'.match(/(.*)d(.*)/\n\
    < [\"abc dc a\", \"bc ac\", \"c\", index: 0, input: \"abc dc abbc\", groups: undefined]\n\
    \n// matched portion\n> 'abc ac dc abbc'.match(/(.*)d(.*)[0]\n< \"abc dc a\"\n\
    \n// capture group portions\n> 'abc ac dc abbc'.match(/(.*)d(.*)[1]\n< \"bc ac\"\
    \n> 'abc ac dc abbc'.match(/(.*)d(.*)[2]\n< \"c\"\n```\n\n## Getting matched portions\n\
    \nThe match method returns all portions when g flag is used. Capture group portions\
    \ won't be part of the output.\n\n```\n> 'abc ac dc abbc'.match(/ab/g)\n< [\"\
