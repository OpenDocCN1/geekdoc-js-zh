    # 点的元字符和量符


    本章介绍了更多几个元字符。与重复字符串的方法类似，量符允许重复正则表达式模式的局部，从而使其更加紧凑并提高可读性。量符还可以指定为有界和无界范围，以匹配不同数量的模式。之前，你使用选择分支来构建
    OR 条件。在加入点元字符和量符后，你就可以构建 AND 条件了。


    # 点的元字符


    点元字符作为占位符，匹配除 \ 和 \n 之外的任何字符。s 标志部分将展示如何包含这些字符。


    ```javascript

    // 匹配 ''c''、任意字符然后是字符 ''t''

    ''tac cat abc;tuv acute''.replace(/c.t/g, ''X'')

    // "taxin X abuv axe"

    ```


    ```javascript

    // 匹配 ''r''、任意两个字符然后是字符 ''d''

    ''bread markedly reported overrides''.replace(/r./d/g, ''X'')

    // "bth maxly repo ovexes"

    ```


    ```javascript

    // 匹配 ''2''、任意字符然后是字符 ''3''

    ''42t33''.replace(/2./g, ''8'')

    // "483"

    ```


    # 贪婪量符


    量符帮助你重复正则的一部分。它们可以应用于字面字符、分组以及你将学习的特性。除了指定精确的数量和有界范围外，这些还可以匹配无界的变数量。如果输入字符串可以通过多种方式以不同的数量满足模式，你可以从两种类型的贪婪量符中选择（本文将涵盖）。


    首先，? 元字符将任何字符或组量化为匹配 0 或 1 次。这有助于定义最优模式并构建简洁的正则。


    ```javascript

    // 如： /ear/g

    ''far feat fear''.replace(/etar/g, ''X'')

    // "FX feat flxe fx*"

    ```


    ```javascript

    // 如： /bbar(t|)\b/

    ''spare part party''.replace(/\bpart/g, ''X'')

    // "X spare party"

    ```


    ```javascript

    // 如： /red|dev|\b/

    [''red'', ''ready'', ''redo'', ''reed''].filter(w => /bre??d\b/.test(w))

    // ["red", "red", "reed"]

    ```


    ```javascript

    // 等于 /part|parrot/g

    ''par part parrot parent''.replace(/par(ro)?t/g, ''X'')

    // "par X parent"

    // 等于 /part|parrot/g

    ''par part parrot parent''.replace(/par(en)?t/g, ''X'')

    // "par X X"

    ```


    * 元字符将字符或组量化为匹配 0 次或多次。它没有上界，更多细节将在本节稍后讨论。


    ```javascript

    // 匹配 ''t'' 后跟零个或多个 ''a'' 然后是 ''r''

    ''tr tear tear steer sitara''.replace(/ta*r/g, ''X'')

    // "X X Xe steer siX"

    ```


    ```javascript

    // 匹配 ''t'' 后跟零个或多个 ''e'' 或 ''a'' 然后是 ''r''

    ''tr tear tear steer sitara''.replace(/t(e|a)*/r/g, ''X'')

    // "X X Xe siX"

    ```


    ```javascript

    // 匹配 ''2''、任意字符然后是字符 ''3''

    ''42t33''.replace(/2./g, ''8'')

    // "483"

    ```


    ```javascript

    // 匹配零个或多个 ''1'' 后跟 ''2''

    ''3111111125''.replace(/12/g, ''X'')

