    # Dot metacharacter and Quantifiers


    This chapter introduces several more metacharacters. Similar to the repeat string
    method, quantifiers allow to repeat a portion of regular expression pattern and
    thus make it compact and improve readability. Quantifiers can also be specified
    as both bounded and unbounded ranges matching varying quantities of the pattern.
    Previously, you used alternation to construct OR conditional. Adding dot metacharacter
    and quantifiers to the mix, you can construct AND conditional.


    # Dot metacharacter


    The dot metacharacter serves as a placeholder to match any character except \
    and \n The s flag section will show how to include those characters as well.


    ```

    // matches ''c'', any character and then character ''t''

    > ''tac cat abc;tuv acute''.replace(/c.t/g, ''X'')

    < <taxin X abuv axe

    ```


    ```

    // matches ''r'', any two characters and then character ''d''

    > ''bread markedly reported overrides''.replace(/r./d/g, ''X'')

    < <bth maxly repo ovexes

    ```


    ```

    // matches ''2'', any character and then character ''3''

    > ''42t33''.replace(/2./g, ''8'')

    < "483"

    ```


    # Greedy quantifiers


    Quantifiers help you to repeat a portion of regex. They can be applied to literal
    characters, groupings and features that you will learn. Apart from to specify
    exact quantity and bounded range, these can also match unbounded varying quantities.
    If the input string can satisfy a pattern with varying quantities in multiple
    ways, you can choose among two types of greedy type of quantifiers is covered.


    First up, the ? metacharacter quantifies any character or group to match 0 or
    1 times. This helps to define optimal patterns and build terse regexes.


    ```

    // as: /ear/g

    > ''far feat fear''.replace(/etar/g, ''X'')

    < <FX feat flxe fx*

    ```


    ```

    // as: /bbar(t|)\/b/

    > ''spare part party''.replace(/\bpart\/g, ''X'')

    < "X spare party"

    ```


    ```

    // as: /red|dev|\b/

    > [''red'', ''ready'', ''redo'', ''reed''].filter(w => /bre??d\b/.test(w))

    < ["red", "red", "reed"

    ```'
