    # 分组与反向引用


    你已经听过更多关于分组的精彩内容。好了，它们以各种形式出现。


    # 反向引用


    首先，如何在正则表达式定义和替换部分直接引用捕获部分。你已经见过如何通过 match 方法引用捕获组。更直接地，你可以使用 `\N`（在正则定义中）和 `$N`（替换部分），其中
    N 是你想要的组。有了这些，你也可以在正则中使用量词应用于反向引用。下面列出了所有形式：


    - 在替换部分中，$1`, `$2` 等引用对应的组

    - 在替换部分中，$& 引用整个匹配部分

    - `$& 位于匹配部分之前

    - `$'' 位于匹配部分之后

    - 在正则定义中，`\1`, `\2` 等引用对应的组


    ```

    // 移除包裹数字的括号

    > ''[52] apples and mangoes''.replace(/(\d+)/g, ''$1'')

    ```

    ```

    // 如果单独替换

    > ''foo_123 baz_''.replace(/(.*?)/, ''$1'')

    < ''foo_123 baz_''

    ```


    ```

    // 用逗号分割的单词

    > ''good,bad 42,24''.replace(/(\w+),(\w+)/, ''$2,$1'')

    < ''bad 24,42''

    ```


    这里是在没有捕获组的情况下使用反向引用示例：


    ```

    // 复制第一个字段并作为最后一个字段

    > ''fork,42,nice,3.14''.replace(/.+/, ''$&,$'')

    < ''fork,42,nice,3.14,fork''

    ```


    这里是在正则定义中使用反向引用的一些示例：


    ```

    // 至少有一个连续重复字符的元素

    let words = [''mono'', ''excellent'', ''poll'']

    words.filter(w => /\w.\w/.test(w))

    < ["excellent", "poll"]

    ```


    ```

    // 移除由空格分割的连续重复单词

    // 注意反向引用上量词的使用

    > ''aa a a 42 f_1 f_1 13.14''.replace(/\b(\w+)(\1+)\b/g, ''$1'')

    < ''aa a a 42 f_1 f_1 13.14''

    ```


    # 反向引用的特殊情况


    由于 `$` 在替换部分是特殊的，因此在字面放置后面跟随数字时会出现问题。通常使用转义来达到这种目的，但这里你需要使用 `$$`。


    ```

    // 没有捕获组，所以 ''$1'' 被字面插入

    > ''cat''.replace(/a/, ''\$1'')

    < "c($1)"

    // 有捕获组，''\$1'' 在这里同于 ''$1''

    > ''cat''.replace(/(a)/, ''$1'')

    < "c(a)"

    ```


    ```

    // 使用 ''$1'' 避免反向引用并字面插入 ''$1''

    > ''cat''.replace(/(a)/, ''\$\$1'')

    < "c($1)"

    ```


    另一个问题是在普通字符紧跟反向引用时如何避免歧义？这取决于模式中存在多少反向引用，以及你是否需要在正则定义或替换部分避免歧义。例如，如果组少于 10 个，类似
    $12 的将引用第 1 个捕获组并将 2 作为一个字符。如果没有捕获组，那么像 $5 的内容将字字面插入为 $ 和 5。


    另一方面，如果你有超过 9 个但少于 100 个组，如果你想引用单个数字后跟字面字符，就会出现问题。解决方法是前缀加 0，使得位数等于最高捕获组的位数。所以，如果你有超过
    9 个但少于 100 个组，$05 将引用第 5 个捕获组，随后的任何数字都将被字面处理。


    ```

    // 为了说明目的，12 个捕获组，每个 2 位数的组，没有问题

    > ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)/./, ''$11'')

    < "kmn"

    ```


    ```

    // 如果你想引用 1 个单组并后跟 ''1'' 作为字符？

    // 使用 \x31 不起作用，因为它仍然导致结果为 $11

    > ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)/./, ''$1\x31'')

    < "kmn"

    ```

