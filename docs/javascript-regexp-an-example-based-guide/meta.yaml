  - "[PAGE 36]\n\n# Using function in replacement section\n\nSometimes, simple replacement\
    \ isn't enough and you need to do some processing on the matched portion. For\
    \ such cases, you can use function in the replacement section. The arguments available\
    \ to the function are similar to the details provided by match method. The first\
    \ one is matched portion. If capture groups are used, portions by groups will\
    \ be next. Depending on the complexity, you can use fully defined function or\
    \ arrow expressions.\n\n```\nfunction titleCase(m) {\n  return m[0].toUpperCase()\
    \ + m.substr(1).toLowerCase()\n}\n```\n\n// only function name is enough second\n\
    // the matched portion details will be passed automatically to the function\n\
    // in this example, 'titleCase' is using only the matched portion\n\n```\n'aBc\
    \ Ac DC abcBC'.replace(/.*?c/ig, titleCase)\n< \"Ac Ac Abbc\"\n```\n\n// can also\
    \ use arrow function expressions for simple cases\n\n```\n'abc ac abcbc'.replace(/ab*c/g,\
    \ m => m.toUpperCase())\n< \"ABC AC ABCBC\"\n```\n\n// ld will be covered later\n\
    // for now, it's enough to know that it will match all digits\n\n```\n'1 42 317'.replace(/\\\
    d+/g, m => m*2)\n< \"2 84 634\"\n```\n\nHere's an example with capture groups.\
    \ See also MDN: replace for more details.\n\n```\nfunction titleCase(m, g1, g2)\
    \ {\n  return g1.toUpperCase() + g2.toLowerCase()\n}\n```\n\n```\n'aBc Ac DC abcBC'.replace(/((a)(.*?)/ig,\
    \ titleCase)\n< \"Ac Ac Abbc\"\n```\n\n# Using dictionary in replacement section\n\
    \nSometimes, the functionality you need in replacement section can be simplified\
    \ to using a dictionary. The matched portion acts as the key to get corresponding\
    \ value from the dictionary.\n\n// one to one mappings\n\n```\nlet h = {'1': 'one',\
    \ '2': 'two', '4': 'four'}\n```\n\n```\n'9234012'.replace(/1|2|4/g, k => h[k])\n\
    < \"9two3four0onetwo\"\n```\n\n// providing a default value if the matched text\
    \ doesn't exist as a key\n\n```\n'9234012'.replace(/\\d/g, k => k in h ? h[k]\
    \ : 'X')\n< \"XtwoXfourXoneto\"\n```"
