  md: '# # What’s so special about Regular Expressions?


    Regular Expressions is a versatile tool for text processing. You''ll find them
    included in standard library of many programming languages that are used for scripting
    purposes. If not, you can usually find a third-party library. Syntax and features
    of regular expressions vary from language to language. JavaScript''s syntax is
    similar to that of Perl language, but there are significant differences.


    The String object in JavaScript supports variety of methods to deal with text.
    So, what''s special about regular expressions and why would you need it? For learning
    and understanding purposes, one can view regular expressions as a programming
    language in itself, special for text processing. Parts of a regular expression
    can be saved for future use, analogous to variables. There are ways to perform
    AND, OR, NOT conditionals. Operations similar to range and repetition and so on.


    Here''s some common use cases:


    +   - Sanitizing a string to ensure that it satisfies a known set of rules. For
    example, check if a given string matches password rules.

    - Filtering or extracting portions on an abstract level like alphabets, numbers,
    punctuation and so on.

    - Qualified string replacement. For example, at the start or the end of a string,
    only words, based on surrounding text, etc.


    # ## Further Reading


    +   - The true power of regular expressions — it also includes a nice explanation
    of what regular means in this context

    - softwareengineering: Is it a must for every programmer to learn regular expressions?

    - softwareengineering: When you should NOT use Regular Expressions?

    - codhorror: Now You Have Two Problems

    - wikedia: Regular expression — this article includes discussion on regular expressions
    as a formal language as well as details on various implementations'
