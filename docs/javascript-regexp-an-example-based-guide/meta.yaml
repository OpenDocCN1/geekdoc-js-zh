    \ to avoid escaping.\n\n```javascript\n> let path = '/foo/123/foo/baz/ip.txt'\n\
    ```\n\n```javascript\n// this is known as 'leaning toothpick syndrome'\n> path.replace(/\\\
    /foo\\/123\\\\/, '~')\n> \"~/foo/baz/ip.txt\"\n```\n\n```javascript\n// using\
    \ new RegExp improves readability and can reduce de-bugs\n> path.replace(new RegExp('^foo/123/'),\
    \ '~')\n< \"~/foo/baz/ip.txt\"\n```\n"
