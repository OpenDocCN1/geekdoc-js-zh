    # # Named capture groups


    Regexp can get cryptic and difficult to maintain, even for seasoned programmers.
    There are a few constructs to help clarity. One such is naming the capture groups
    and using name for backreferencing instead of plain numbers. The syntax is `<name>pat`
    for naming the capture groups, `\<name>` for backreferencing in regexp definition
    and `$name` in replacement section.


    ```

    let row = ''2018-03-24,food,2018-03-24,2018-10-25,56322''

    same as: /(\d(4)-\d(2)-\d(2))\*1/

    row.match(/(?<date>\d(4)-\d(2)-\d(2))\*k<date>)/[0]

    ''<2018-03-24,food,2018-03-24''

    ```


    ```

    // giving names to first and second captured words

    same as: replace(/(\w+),(\w+)/, ''$2,$1'')

    ''good,bad,42,24''.replace(/(?<fw=\w+),(?<sw=\w+)/, ''$sw,$fw'')

    ''<bad,good24''

    ```


    Named capture groups are also accessible via the groups property.


    ```

    let m = ''2018-10-25,car''.match(/(?<date>[^,]+),(?<product>[^,]+)/)


    m.groups

    {date: ''2018-10-25'', product: ''car''}

    m.date

    ''2018-10-25''

    m.groups.product

    ''car''

    ```


