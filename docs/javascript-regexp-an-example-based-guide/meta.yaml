  md: "Lookbehind isn't supported in Firefox. See this Q&A for a workaround.\n\n#\
    \ Positive lookarounds\n\nPositive lookaround syntax uses = similar to ! for negative\
    \ lookaround. The complete syntax looks like:\n\n+   - (?=pat) for positive lookahead\
    \ assertion\n- (?<=pat) for positive lookbehind assertion\n\n```\n// edit digits\
    \ if it is followed by \n// note that the end of string doesn't qualify as this\
    \ is positive assertion\n> '42 foo-5, ba23; x83, y-20; f12'.match(/\\d+(?=,)/g)\n\
    < \"5\", \"83\"\n// edit digits if it is preceded by - and by ; or \n> '42 foo-5,\
    \ ba23; x83, y-20; f12'.match(/(?<=\\)\\d+=[,])/g)\n< \"5\", \"20\"\n```\n\n```\n\
    // same as: match(/\\b\\w\\b').join('')\n> 'sea cat rat eel tea'.replace(/(?<=\\\
    b\\w)\\w*\\W*/g, ')\\n< \"secret\"\n```\n\nLookarounds are quite handy in dealing\
    \ with field based processing.\n\n```\n// except first and last fields\n> '1,two,3,four,5'.match(/(?<=\\\
    ,)[^]+(?=,)/g)\n< \"two\", \"3\", \"four\"\n```\n\n```\n// replace empty fields\
    \ with NA\n// note that in this example, order of lookbehind and lookahead doesn't\
    \ match\n> '1,,two,3,'.replace(/(?<=\\^)[^]+($)/g, 'NA')\n< \"NA,1,NA,two,3,NA,\
    \ NA\"\n// same thing with negative lookarounds\n> '1,,two,3,'.replace(/(?<![,])[^]+)/g,\
    \ 'NA')\n< \"NA,1,NA,two,3,NA, NA\"\n```\n\n```\n// there is an extra empty string\
    \ match at end of non-empty columns\n> 'cat,tiger'.replace(/(?<=\\^)[^]*/g, '${&}')\n\
    < \"{},{cat},{tiger}\"\n// lookarounds to the rescue\n> 'cat,tiger'.replace(/(?<=\\\
    ^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n```\n\nEven though lookarounds are\
