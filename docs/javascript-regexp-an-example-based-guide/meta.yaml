    > let pwds = [''hunter2'', ''F2h3u9%'', ''*XYz3.14\t'', ''r2_d2_42'', ''A $B$
    C1234'']


    > pwds.filter(// // add your solution here

    < ["F2h3u9%", "A $B$ C1234"]

    ```'
