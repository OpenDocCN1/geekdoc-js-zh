  md: "The workaround is simpler in regex definition. The \\0 prefix trick doesn't\
    \ work, but using ASCII code with \\xh works. For example, \\1x3 will refer to\
    \ 1 capture group followed by 1 as a character.\n\n```\n> abcdefghijklmnld'.replace(/(\\\
    .).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).*\\x31/, 'X')\n < 'Xd'\n```\n\
    \n# Non-capturing groups\n\nGrouping has many uses like applying a regex portion,\
    \ creating terse by factoring common portions and on. It also affects the output\
    \ of split method.\n\n```\n// without capture group\n > 'Sample123string42with77numbers'.split(/\\\
    d+/)\n < [\"Sample\", \"string\", \"with\", \"numbers\"]\n```\n\n```\n// use capture\
    \ group to include the part that was split as well\n > 'Sample123string42with77numbers'.split(/(\\\
    d+)/)\n < [\"123\", \"string\", \"42\", \"with\", \"777\", \"numbers\"]\n```\n\
    \n```\n// unlike methods in other languages, match with \\g flag\n // isn't affected\
    \ by capture groups and returns matched portions\n > 'effort flee oddball tool'.match(/(\\\
    b\\w\\(\\w)\\1\\b)/g)\n < [\"effort\", \"flee\", \"tool\"]\n```\n\nWhen backreferencing\
    \ is not required, you can use a non-capturing group to avoid change of split\
    \ method. It also helps to keep a track of capture groups when that particular\
    \ group is not needed for backreferencing. The syntax is (?:) to define a pattern.\
    \ More special groups starting with (?:) syntax will be discussed later.\n\n```\n\
    // here, grouping is needed to take out common portion and apply quantifier\n\
    \ // but using capture group will not be expected output\n > '123hand42hand777hand150'.split(/(hand(y|ful)?)/)\n\
    \ < [\"123\", undefined, \"42\", \"y\", \"777\", \"ful\", \"500\"]\n```\n\n```\n\
    // non-capturing group to leave the rescue\n > '123hand42hand777hand150'.split(/(?:y|ful)?)\n\
    \ < [\"123\", \" \"42\", \"777\", \"500\"]\n```\n\n```\n// with normal grouping,\
    \ to keep track of all the groups\n > '1,2,3,4,5,6,7'.replace(/([^,]+),([^,]+)/,\
    \ '$1($2)')\n < [\"1(2),3(4),5,67\"]\n```\n\n```\n// using non-capturing groups,\
    \ only relevant groups have to be tracked\n > '1,2,3,4,5,6,7'.replace(/((?:[^,]+)),([^,]+)/,\
    \ '$1($2)')\n < [\"1(2),3(4),5,67\"]\n```\n\nReferring to text matched by capture\
    \ group with a quantifier will only give the last match, not entire match. Use\
    \ a capture group around the grouping and quantifier to get the entire matching\
    \ portion. In such cases, the inner group is an ideal candidate to use-non-capturing\
    \ group."
