    # matchAll method


    If you need to capture group portions and properties for every match with g flag
    active, use matchAll method. The return value is an iterator.


    ```

    > ''abc ac adc abcbc''.matchAll(/ab*c/g)

    > RegExpStringIterator { }

    ```


    ```

    // convert the iterator result to array of arrays

    // let arr = [...''abc ac adc abcbc''.matchAll(/ab*c/g)]

    // arr

    // <3> [Array(1), Array(1), Array(1)]

    0: ["abc", index: 0, input: "abc ac adc abcbc", groups: undefined]

    1: ["ac", index: 4, input: "abc ac adc abcbc", groups: undefined]

    2: ["abbc", index: 11, input: "abc ac adc abcbc", groups: undefined]

    length: 3

    __proto_: Array(0)

    ```


    ```

    // get array with details for first match

    // arr[0]

    < ["abc", index: 0, input: "abc ac adc abcbc", groups: undefined]

    // get index for second match

    // arr[1].index

    < 4

    ```


    You can also use Array.from() to convert the iterator to array object. Array.from
    allows you to provide a mapping function as second argument.


    ```

    // same as match: /ab*c/g

    > Array.from(''abc ac adc abcbc''.matchAll(/ab*c/g), m => m[0])

    < ["abc", "ac", "abbc"]

    // get index for match

    > Array.from(''abc ac adc abcbc''.matchAll(/ab*c/g), m => m.index)

    < [0, 4, 11]

    ```


    ```

    // get capture group portions as array for each match

    > Array.from(''xx:yyy x:y''.matchAll(/(?:x*):(y*)/g), m => m.slice(1))

    < (4) [Array(2), Array(2), Array(2), Array(2)]

    0: ["xx", "yyy"]

    1: ["x", """]

    2: ["x", "yy"]

    3: ["", "y"]

    length: 4 4

    __proto_: Array(0)

    ```


    > Before the introduction of matchAll method, exec method had to be used. See
    MDN: exec details and examples.'
- md: "\n## Using function in replacement section\n\nSometimes, simple replacement\
    \ isn't enough and you need to do some processing on the matched portion. For\
    \ such cases, you can use function in the replacement section. The arguments available\
    \ to the function are similar to the details provided by match method. The first\
    \ one is matched portion. If capture groups are used, portions by groups will\
    \ be next. Depending on the complexity, you can use fully defined function or\
    \ arrow expressions.\n\n```javascript\nfunction titleCase(m) {\n  return m[0].toUpperCase()\
    \ + m.substr(1).toLowerCase()\n}\n```\n\n// only function name is enough second\n\
    // the matched portion details will be passed automatically to the function\n\
    // in this example, 'titleCase' is using only the matched portion\n\n```javascript\n\
    'aBc Ac DC abcBC'.replace(/.*?c/ig, titleCase)\n< \"Ac Ac Abbc\"\n```\n\n// can\
    \ also use arrow function expressions for simple cases\n\n```javascript\n'abc\
    \ ac abcbc'.replace(/ab*c/g, m => m.toUpperCase())\n< \"ABC AC ABCBC\"\n```\n\n\
    // ld will be covered later\n// for now, it's enough to know that it will match\
    \ all digits\n\n```javascript\n'1 42 317'.replace(/\\d+/g, m => m*2)\n< \"2 84\
    \ 634\"\n```\n\nHere's an example with capture groups. See also MDN: replace for\
    \ more details.\n\n```javascript\nfunction titleCase(m, g1, g2) {\n  return g1.toUpperCase()\
    \ + g2.toLowerCase()\n}\n```\n\n```javascript\n'aBc Ac DC abcBC'.replace(/((a)(.*?))/ig,\
    \ titleCase)\n< \"Ac Ac Abbc\"\n```\n\n## Using dictionary in replacement section\n\
    \nSometimes, the functionality you need in replacement section can be simplified\
    \ to using a dictionary. The matched portion acts as the key to get corresponding\
    \ value from the dictionary.\n\n// one to one mappings\n\n```javascript\nlet h\
    \ = {'1': 'one', '2': 'two', '4': 'four'}\n```\n\n```javascript\n'9234012'.replace(/1|2|4/g,\
    \ k => h[k])\n< \"9two3four0onetwo\"\n```\n\n// providing a default value if the\
    \ matched text doesn't exist as a key\n\n```javascript\n'9234012'.replace(/\\\
    d/g, k => k in h ? h[k] : 'X')\n< \"XtwoXfourXoneto\"\n```\n\nFor swapping two\
    \ or more strings without using intermediate result, using a dictionary is recommended.\n\
    \n```javascript\n> let swap = { 'cat': 'tiger', 'tiger': 'cat' }\n```\n\n```javascript\n\
    > cat tiger dog tiger cat.replace(/cat|tiger/g, k => swap[k])\n< tiger cat dog\
    \ cat tiger\n```\n\nFor a dictionary with many entries and list to undergo changes\
    \ during development, building alteration list is not usually a good choice. Also,\
    \ recall that per precedence rules, longest string length should come first. The\
    \ unionRegExp function, introduced in Dynamically building alteration section,\
    \ is helpful here.\n\n```javascript\n> let d = { 'hand': 1, 'handy': 2, 'handful':\
    \ 3 }\n```\n\n```javascript\n> const p = unionRegExp(Object.keys(d).sort((a, b)\
    \ => b.length - a.length))\n> console.log(p)\n< handful|hand\n> 'handful hand\
    \ handy'.replace(new RegExp(p, 'g'), k => d[k])\n< \"3 1 2\"\n```\n\n## Cheatsheet\
    \ and Summary\n\n| Note | Description |\n|---|---|\n| m = s.match(/pat/) | assuming\
    \ g flag isn't succeeds, returns an array with matched portion and 3 properties\
    \ index provides the starting location of the match input provides the little\
    \ string s groups provides dictionary of named capture groups for above case,\
    \ gives entire matched portion |\n| m[0] m[1] | matched portion of first capture\
    \ group |\n| m[2] | matched portion of second capture group and so on |\n| s.match(/pat/g)\
    \ | returns only the matched portions, no properties capture group does not affect\
    \ the match returns null if regexp fails |\n| s.replaceAll(/pat/g) | returns an\
    \ iterator containing details for each matched portion and its properties use\
    \ [...] or Array.from to convert to Array.from also allows mapping function s.replace(/pat/,\
    \ func) can use a function to provide replacement string each matched portion\
    \ gets passed as arguments similarly, dictionary can be used for replacement |\n\
    | s.search(/pat/) | gives starting location of the match succeeds -1 if regexp\
    \ fails |\n\nThis chapter introduced match and matchAll methods, which allows\
    \ you to work with various matching portions of input string. The replace method\
    \ allows you to use a function as replacement, which helps to process the matching\
    \ portions before being used as replacement string. You can also use a dictionary\
    \ to provide replacement string based on matched portion as key. You learnt at\
    \ capture groups and you'll see even more uses of groupings in coming chapters.\n\
    \n## Exercises\n\na) For the given strings, extract the matching portion from\
    \ first is to last t\n\n```javascript\n> let str1 = 'What is the biggest fruit\
    \ you have seen?'\n> let str2 = 'Your mission is to read and practice consistently'\n\
    \n> const pl = // add your solution here\n> str1.match() // add your solution\
    \ here\n> \"is the biggest fruit\"\n> str2.match() // add your solution here\n\
    > \"ission is to read and practice consistent\"\n```\n\nb) Transform the given\
    \ input strings to expected output as shown.\n\n```javascript\n> let row1 = '-2,5,\
    \ 4+3 +42,-53 '\n> let row2 = '1.32, -3.14 634,5.63 '\n\n> Array.from(row1) //\
    \ add your solution here\n< [3, 7, -11]\n\n> Array.from(row2) // add your solution\
    \ here\n< [-1.82, 639.63]\n```\n\nc) Write a string function that gives input\
    \ to alternate case. The first alphabet should be changed to lowercase, the next\
    \ one to uppercase and lowercase so on. Characters other alphabets should be left\
    \ alone and not affect changing.\n\n```javascript\n> function altRNaTeCase(ip)\
    \ {\n  // add your solution here\n}\n\n> altRNaTeCase('HI THERE!')\n< 'hI ThReE!'\n\
    > altRNaTeCase('good morning')\n< 'gOoD mOrNiG'\n> altRNaTeCase('Sample123string42with777numbers')\n\
    < 'sAmPle123s42wi777numbers'\n```\n\nd) Replace the string with par, spare with\
    \ extra and park with garden\n\n```javascript\n> let str3 = 'apartment a park'\n\
    > let str4 = 'do you have a spare'\n> let str5 = 'write a parser'\n\n> let d1\
    \ = // add solution here\n> const p2 = // add solution here\n```\n\n```javascript\n\
    > str3.replace(p2, k => d1)\n< \"aspartment a garden\"\n> str4.replace(p2, k =>\
    \ d1)\n< \"do you have a cable\"\n> str5.replace(p2, k => d1)\n< \"write a parser\"\
    \n```\n\n## Character class\n\nThis chapter will discuss how to match a limited\
    \ set of characters using various metacharacters. You'll also learn escape sequences\
    \ for predefined sets.\n\n## Custom sets\n\nCharacters enclosed inside [] will\
    \ result in matching any of those characters. It is similar to using single alternations,\
    \ but without additional effects of capture group. In addition, character classes\
    \ have their own versions of metacharacters and provide sets for common use cases.\
    \ Quantifiers are applicable to character classes as:\n\n```javascript\n// sample\
    \ as: /[cot/ or /[c(o]/\n> ['cute', 'cat', 'cost'].filter(w => /[ou]t/.test(w))\n\
    < ['cute']\n```\n\n```javascript\n// sample as: /[a|o]+t/g\n> 'meeting boat'.replace(/[ao]+t/g,\
    \ 'X')\n< 'mxing boat'\n```\n\n```javascript\n> 'Sample123string42with777'.match(/[0123456789]+/g)\n\
    < ['123', '42', '777']\n```\n\n## Character class metacharacters\n\nCharacter\
    \ classes have their to define sets succinctly. Outside of character classes like\
    \ $, etc do not have special meaning or have completely different. First, ^ helps\
    \ to define range instead of having them individually.\n\n```javascript\n// numbers\
    \ between 10 to 29\n> '23 154 12 26 9824'.match(/[12][0-9]{2}/b)\n< [\"23\", \"\
    12\", \"26\"]\n```\n\n```javascript\n// numbers >= 100\n> '23 154 12 26 9824'.match(/[0-9]{3}/b)\n\
    < [\"154\", \"824\"]\n```\n\n```javascript\n// numbers >= 100 if there are leading\
    \ zeros\n> '0501 035 154 12 26 9824'.match(/[1-9][0-9]{2}/b)\n< [\"154\"]\n```\n\
    \nThe ^ metacharacter has specified the first character of the class. It negates\
    \ the set, all characters other specified will be matched.\n\n```javascript\n\
    // all non-digits\n> 'Sample123string4with777numbers'.match(/[^0-9]+/g)\n< [\"\
    Sample\", \"string\", \"with\", \"numbers\"]\n```\n\n```javascript\n// deleting\
    \ characters from start of a delimiter\n> 'foo=42;baz=123'.replace(/\\^[^=]+\\\
    /, '')\n< [\"=42\", \"baz=123\"]\n> 'foo:42;baz=123'.replace(/\\^([^=:]+:2}/,\
    \ '')\n< [\"bar:baz\"]\n```\n\n```javascript\n// deleting characters at end of\
    \ a delimiter\n> 'foo=42;baz=123'.replace(/[^=]+$/, '')\n< [\"foo=42\", \"baz\"\
    ]\n```\n\nAs highlighted earlier, handle negative logic with care, as you might\
    \ end up matching more than you wanted. Sometimes it is easier to use positive\
    \ character class and instead instead of negated character class.\n\n```javascript\n\
    let words = ['tryst', \"fun\", \"glyph\", \"pity\", \"why\"]\n```\n\n```javascript\n\
    > words.filter(w => /[aiou]+$/.test(w))\n< [\"tryst\", \"glyph\", \"why\"]\n>\
    \ words.filter(w => !/[aiou]+$/.test(w))\n< [\"tryst\", \"glyph\", \"why\"]\n\
    ```\n"
  mdcn: "\n\n## 在替换部分使用函数\n\n有时候，简单的替换是不够的，你可能需要对匹配部分进行某些处理。对于此类情况，你可以在替换部分使用函数。函数可用的参数与\
    \ `match` 方法提供的细节相似。第一个参数是匹配到的部分。如果使用了捕获组，后续将是按分组的部分。根据复杂程度，你可以使用完全定义的函数或箭头表达式。\n\
    \n```javascript\nfunction titleCase(m) {\n  return m[0].toUpperCase() + m.substr(1).toLowerCase()\n\
    }\n```\n\n// 第二种情况下，只需要函数名就足够了\n// 匹配部分的细节将自动传递给函数\n// 在此示例中，'titleCase' 只使用了匹配到的部分\n\
    \n```javascript\n'aBc Ac DC abcBC'.replace(/.*?c/ig, titleCase)\n< \"Ac Ac Abbc\"\
    \n```\n\n// 简单的情况也可以使用箭头函数表达式\n\n```javascript\n'abc ac abcbc'.replace(/ab*c/g,\
    \ m => m.toUpperCase())\n< \"ABC AC ABCBC\"\n```\n\n// ld 将在后文中介绍\n// 目前，知道它会匹配所有数字就足够了\n\
    \n```javascript\n'1 42 317'.replace(/\\d+/g, m => m*2)\n< \"2 84 634\"\n```\n\n\
    这是一个带有捕获组的示例。更多细节请参阅 MDN 的 `replace` 方法。\n\n```javascript\nfunction titleCase(m,\
    \ g1, g2) {\n  return g1.toUpperCase() + g2.toLowerCase()\n}\n```\n\n```javascript\n\
    'aBc Ac DC abcBC'.replace(/((a)(.*?))/ig, titleCase)\n< \"Ac Ac Abbc\"\n```\n\n\
    ## 在替换部分使用字典\n\n有时候，你在替换部分需要的功能可以简化为使用字典。匹配部分作为键（key），从字典中获取对应的值。\n\n// 一一映射\n\
    \n```javascript\nlet h = {'1': 'one', '2': 'two', '4': 'four'}\n```\n\n```javascript\n\
    '9234012'.replace(/1|2|4/g, k => h[k])\n< \"9two3four0onetwo\"\n```\n\n// 如果匹配的文本作为键不存在，则提供一个默认值\n\
    \n```javascript\n'9234012'.replace(/\\d/g, k => k in h ? h[k] : 'X')\n< \"XtwoXfourXoneto\"\
    \n```\n\n在不使用中间结果的情况下交换两个或多个字符串，推荐使用字典。\n\n```javascript\n> let swap = { 'cat':\
    \ 'tiger', 'tiger': 'cat' }\n```\n\n```javascript\n> cat tiger dog tiger cat.replace(/cat|tiger/g,\
    \ k => swap[k])\n< tiger cat dog cat tiger\n```\n\n对于具有许多条目且开发过程中会变化的列表，构建变更列表通常不是一个好选择。此外，请记住，根据优先级规则，最长的字符串应该放在前面。在动态构建变更部分中引入的\
    \ `unionRegExp` 函数在这里很有帮助。\n\n```javascript\n> let d = { 'hand': 1, 'handy': 2,\
    \ 'handful': 3 }\n```\n\n```javascript\n> const p = unionRegExp(Object.keys(d).sort((a,\
    \ b) => b.length - a.length))\n> console.log(p)\n< handful|hand\n> 'handful hand\
    \ handy'.replace(new RegExp(p, 'g'), k => d[k])\n< \"3 1 2\"\n```\n\n## 查表与总结\n\
