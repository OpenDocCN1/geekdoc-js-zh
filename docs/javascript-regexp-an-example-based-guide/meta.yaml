  mdcn: "\n在正则表达式定义中，解决方法更简单。`\\0` 前缀技巧无效，但使用带有 `\\xh` 的 ASCII 码有效。例如，`\\1x3` 将指向第\
    \ 1 个捕获组后跟一个字符 `1`。\n\n```javascript\n> 'abcdefghijklmnld'.replace(/(\\.).(\\\
    .).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).*\\x31/, 'X')\n < 'Xd'\n```\n\n##\
    \ 非捕获分组组\n\n分组有许多用途，例如对正则表达式的一个部分应用操作、通过提取公共部分来创建简洁的表达式等。它也会影响 `split` 方法的输出。\n\
    \n```javascript\n// 不使用捕获组\n > 'Sample123string42with77numbers'.split(/\\d+/)\n\
    \ < [\"Sample\", \"string\", \"with\", \"numbers\"]\n```\n\n```javascript\n//\
    \ 使用捕获组包含被拆分的部分\n > 'Sample123string42with77numbers'.split(/(\\d+)/)\n < [\"Sample\"\
    , \"123\", \"string\", \"42\", \"with\", \"777\", \"numbers\"]\n```\n\n```javascript\n\
    // 与其他语言的方法不同，带有 \\g 标志的 match \n // 不受捕获组影响并返回匹配部分\n > 'effort flee oddball tool'.match(/(\\\
    b\\w+\\w)\\1\\b)/g)\n < [\"effort\", \"flee\", \"tool\"]\n```\n\n当不需要反向引用时，可以使用非捕获分组来避免\
    \ `split` 方法发生变化。当某个特定组不需要反向引用时，这也有助于跟踪捕获组。语法是使用 `(?:)` 来定义模式。稍后将讨论更多以 `(?:)`\
    \ 语法开头的特殊分组。\n\n```javascript\n// 在这里，需要分组来提取公共部分并应用量化符号\n // 但使用捕获组的输出将不是符合预期的结果\n\
    \ > '123hand42hand777hand150'.split(/(hand(y|ful)?)/)\n < [\"123\", undefined,\
    \ \"42\", \"y\", \"777\", \"ful\", \"150\"]\n```\n\n```javascript\n// 使用非捕获分组保留剩余部分\n\
    \ > '123hand42hand777hand150'.split(/(?:y|ful)?)\n < [\"123hand\", \"42hand\"\
    , \"777hand1100\n```\n\n```javascript\n// 使用普通分组，以跟踪所有的组\n > '1,2,3,4,5,6,7'.replace(/([^,]+),([^,]+)/,\
    \ '$1($2)')\n < [\"1(2),3(4),5,67\"]\n```\n\n```javascript\n// 使用非捕获分组，仅需跟踪相关的组\n\
    \ > '1,2,3,4,5,6,7'.replace(/((?:[^,]+)),([^,]+)/, '$1($2)')\n < [\"1(2),3(4),5,67\"\
    ]\n```\n\n引用带有量化符号的捕获组匹配的文本只会给出最后一个匹配项，而不是整个匹配项。在分组和量化符号周围使用捕获组来获取整个匹配部分。在这种情况下，内部分组是使用非捕获分组的理想候选者。\n\
    \n```javascript\n// 这里的 '$1' 只包含第四个字段\n> 'so:cat:rest:in:put:to'.replace(/([^:]+){4}/,\
    \ '$1')\n< \"(in):put:to\"\n\n// '$1' 现在将包含匹配部分\n> 'so:cat:rest:in:put:to'.replace(/((?:[^:]+){4})/,\
    \ '$1')\n< \"(so:cat:rest:in):put:to\"\n```\n\n## 命名捕获组\n\n即使对于经验丰富的程序员，正则表达式也可能变得晦涩且难以维护。有一些结构可以帮助提高清晰。其中一种是命名捕获组并使用名称进行反向引用而不是普通的数字。命名捕获组的语法是\
    \ `<name>pat`，在正则表达式定义中使用 `\\<name>` 进行反向引用，在替换部分中使用 `$name`。\n\n```javascript\n\
    let row = '2018-03-24,food,2018-03-24,2018-10-25,56322'\n// 等于: /(\\d(4)-\\d(2)-\\\
    d(2))*1/\nrow.match(/(?<date>\\d(4)-\\d(2)-\\d(2))*\\k<date>)/[0]\n'<2018-03-24,food,2018-03-24'\n\
    ```\n\n```javascript\n// 为第一个和第二个捕获的单词命名\n// 等于: replace(/(\\w+),(\\w+)/, '$2,$1')\n\
    'good,bad,42,24'.replace(/(?<fw=\\w+),(?<sw=\\w+)/, '$sw,$fw')\n'<bad,good24'\n\
    ```\n\n命名捕获组也可以通过 `groups` 属性访问。\n\n```javascript\nlet m = '2018-10-25,car'.match(/(?<date>[^,]+),(?<product>[^,]+)/)\n\
    \nm.groups\n{date: '2018-10-25', product: 'car'}\nm.date\n'2018-10-25'\nm.groups.product\n\
    'car'\n```\n\n## 抄表与总结\n\n| 注意事项 | 说明 |\n|---|---|\n| 反向引用 | 提供第 N 个捕获组的匹配部分，在替换部分中使用\
    \ $1, $2, $3 等 |\n| $$ | 提供整个匹配部分 |\n| $' | 提供来自匹配部分的字符串 |\n| $` | 提供匹配部分之后的字符串\
    \ |\n| 在正则表达式定义中使用 \\1, \\2, \\3 等 |\n| 在替换部分中字面量插入 $ |\n\n| $N | 说明 |\n| :---\
    \ | :--- |\n| \\N | 等于 $N，允许将反向引用和其他数字分离 |\n| \\N\\n0 \\xkhh | 允许在正则表达式定义中分离反向引用和数字\
    \ |\n\n本章涵盖了许多与分组相关的特性——通过反向引用来获取捕获组的匹配部分，以及通过命名分组来增加清晰度。当某个特定组不需要反向引用时，请使用非捕获分组。你将在下一章看到更多特殊分组。\n\
    \n## 练习题\n\n- a) 给定的字符串由 : 分隔：\n- b) 给定的字符串由 : 分隔：\n- c) 给定的字符串由 : 分隔：\n- d) 给定的字符串由\
    \ : 分隔：\n- e) 给定的字符串由 : 分隔：\n\n（注：OCR 中的练习题部分严重损坏/重复；我已根据可用碎片清理了结构。）\n\n"
