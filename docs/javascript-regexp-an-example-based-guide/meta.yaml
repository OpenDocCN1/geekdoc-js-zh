  md: "# # Character class class\n\nThis chapter will discuss how to create your own\
    \ placeholders to match limited set of characters and various metacharacters applicable\
    \ inside character classes. You'll also learn escape sequences for predefined\
    \ character sets.\n\n# ## Custom character sets\n\nCharacters enclosed inside\
    \ [] metacharacters is a character class (or set). It will result in matching\
    \ any of those characters inside. It is similar to using single character alternations\
    \ inside a grouping, but without the additional effects of a capture group. In\
    \ addition, character classes have their own versions of metacharacters and provide\
    \ predefined sets for common use cases. Quantifiers are applicable to character\
    \ classes as\n\n```\n// sample as: /[cot|cut/ or /[c(o)u]/\n > ['cute', 'cat',\
    \ 'coat', 'cost'].filter(w => /[ou]t/.test(w))\n < ['cute', 'cot'] ]\n```\n\n\
    ```\n// sample as: /[a(e|o)]+t/g\n > 'meeting coat boat foot'.replace(/[ao]+t/g,\
    \ 'X')\n < 'mxing coat bX site fx'\n```\n\n```\n> 'Sample123string42with777numbers'.match(/[0123456789]/+g)\n\
    \ < ['123', '42', '777']\n```\n\n# ## Character class metacharacters\n\nCharacter\
    \ classes have their own metacharacters to define the sets succinctly. Metacharacters\
    \ outside of character classes like ^, $, ( ) etc either do not have special meaning\
    \ or have completely different inside the character class. First up, the - metacharacter\
    \ helps to define a range of characters instead of having to specify them individually.\n\
    \n```\n// all digits\n > 'Sample123string42with777numbers'.match(/[0-9]+/g)\n\
    \ < ['123', '42', '777']\n```\n\n```\n// words made up of lowercase alphabets\
    \ and digits\n > 'Coat bin food tar12 best'.match(/\\b[a-z0-9]+\\b/g)\n < ['coat',\
    \ 'food', 'tar12', 'best']\n```\n\n```\n// words made up of lowercase alphabets,\
    \ but starting with 'p' to 'z'\n > 'coat tin food stop best'.match(/\\b[p-z][a-z]*\b\
    /g)\n < ['tin', 'put', 'stoop']\n```\n\n```\n// words made up of only 'a' to 'f'\
    \ and 'p' to 't' lowercase alphabets\n > 'coat tin food put stop best'.match(/\\\
    b[a-fp-t]+\\b/g)\n < ['best']\n```"
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Character classes can also be used to construct numeric ranges.


    ```

    // numbers between 10 to 29

    > ''23 154 12 26 98234''.match(/\b[12][0-9]\\b/)

    < ["23", "12", "26"]

    ```


    ```

    // numbers >= 100

    > ''23 154 12 26 98234''.match(/\b[0-9]{3}\\b/)

    < ["154", "08234"]

    // numbers >= 100 if there are leading zeros

    ```


    ```

    > ''0501 035 154 12 26 98234''.match(/\b*[1-9][0-9]{2,}\\b/)

    < ["0154", "98234"]

    ```


    However, it is very messy to match corner cases and some ranges are complicated
    to design. In such cases, it is better to match all the numbers and add code to
    use numeric operations.


    ```

    // numbers < 350

    > ''45 349 651 593 204''.match(/\b[0-9]+\\g).filter(n => n < 350)

    < ["45", "204"]

    > ''45 349 651 593 204''.replace(/\b[0-9]+\\g, m => m < 350 ? 0 : 1)

    < "0 0 1 1 0"

    ```


    ```

    // numbers between 200 and 650

    > ''45 349 651 593 204''.match(/\b[0-9]+\\g).filter(n => n >= 200 && n <= 650)

    < ["349", "593", "204"]

    ```


    The ^ metacharacter has specified the first character of the character class.
    It negates the set, all characters other those specified will be matched.


    ```

    // all non-digits

    > ''Sample123string4with777numbers''.match(/\^0-9]+\\g)

    < ["Sample", "string", "with", "numbers"]

    ```


    ```

    // deleting characters from start of a delimiter

    > ''foo=42;baz=123''.replace(/\^[^=]+\/, '''')

    < ["=42", "baz=123"]

    > ''foo:42;baz=123''.replace(/\^([^=:]+:2}/, '''')

    < ["bar:baz"]

    ```


    ```

    // deleting characters at end of a delimiter

    > ''foo=42;baz=123''.replace(/[^=]+$/, '''')

    < ["foo=42", "baz"]

    ```


    As highlighted earlier, handle negative logic with care, as you might end up matching
    more than you wanted. Sometimes it is easier to use positive character class and
    instead instead of negated character class.


    ```

    let words = [''tryst", "fun", "glyph", "pity", "why'']

    ```


    ```

    > words.filter(w => /[aiou]+$/.test(w))

    < ["tryst", "glyph", "why"]

    > words.filter(w => !/[aiou]+$/.test(w))

    < ["tryst", "glyph", "why"]

    ```'
  merge: -1
  pgno: 41
