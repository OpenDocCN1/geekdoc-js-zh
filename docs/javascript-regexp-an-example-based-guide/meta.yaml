    \ spare part party'.replace(/\\bpar((|t)\\b/g, 'X')\n> 'X spare party'\n```\n\n\
    # Precedence rules\n\nThere's some tricky situations when using alternation. If\
    \ it is used for testing a match to get true/false against a string input, there\
    \ is no ambiguity. However, for other things like string replacement without g\
    \ flag, it depends on a few factors. Say, you want to replace either are spared\
    \ — which one should get precedence? The bigger word spared or the substring are\
    \ inside or by something else?\n\nThe regex overlap matches earliest in the input\
    \ string gets precedence.\n\n```javascript\n// let words = 'lion elephant are\
    \ rope not'\n// starting index of 'on' index of 'ant' for given string input\n\
    // so 'on' will be replaced inrespective order of alternations\n> words.replace(/[on]ant/,\
    \ 'X')\n< 'LIX elephant are rope not'\n> words.replace(/[ant]on/, 'X')\n< 'LIX\
    \ elephant are rope not'\n```\n\nSo, what happens if two or more alternations\
    \ match on same index? The precedence is then left to right in the order of declaration.\n\
    \n```javascript\n// let mood = 'best years'\n// starting index of 'year' and 'years'\
