  - "[PAGE 6]\n\n# RegExp introduction\n\nThis chapter will get you started with defining\
    \ RegExp objects and using them inside string methods. To keep it simple, the\
    \ examples will not use special characters related to regular expressions. The\
    \ main focus will be to get you comfortable with syntax and text processing examples.\
    \ Two methods will be introduced in this chapter. The test method to search if\
    \ the input contains a string and the replace method to substitute a portion of\
    \ the input with something else.\n\n+   This book will use regular expressions\
    \ and regex interchangeably. When specifically referring to a JavaScript object,\
    \ RegExp will be used.\n\n# Console\n\nAs mentioned in the preface, examples presented\
    \ in this book have been tested on Chrome/Chromium console. Other browsers on\
    \ Chromium may also work. Use (Ctrl+Shift+J) shortcut from a new tab to open a\
    \ console. Some variable names are same across different charts, so open another\
    \ in such cases. See MDN: Regular Expressions for documentation, examples and\
    \ feature compatibility details.\n\n# test method\n\nFirst, up a simple example\
    \ to test whether a string is part of another string or not. Normally, you'd use\
    \ the includes method and pass a string as. For regular expressions, use the test\
    \ method on a RegExp object, which is defined by the search string enclosed within\
    \ //\n\n```\n> let sentence = 'This is a sample string'\n\n// check if 'sentence'\
    \ contains the given string argument\n> sentence.includes('is')\n< true\n> sentence.includes('z')\n\
    < false\n```\n\n```\n// check if 'sentence' matches the pattern as described by\
    \ the regex\n> /is/.test(sentence)\n< true\n> /z/.test(sentence)\n< false\n```\n\
    \nHere's some examples of using the test method in conditional expressions.\n\n\
    ```\n> let report = 'string theory'\n\n> if (/ring/.test(report)) {\n    console.log('mission\
    \ success')\n}\n> mission success\n```"
