    ⚠️ If you are dealing with non characters with Windows OS based text files, you''ll
    have to convert line endings to \n f first. Otherwise, you''ll get end of line
    matches for both \r and \n characters. You can also handle this case in regexp
    by using \r as an optional quantifier with quantifiers (see Greedy quantifiers
    sections).


    # Word anchors


    The third type of restriction is word anchors. Alabets (respective of case), digits
    and the underscore character qualify as word characters. You might wonder there
    are digits and underscores as well, why not alphabets? This comes from variable
    and function naming conventions — typically alphabets, digits and underscores
    are allowed. So, the definition is more oriented to programming languages than
    natural ones.


    The escape sequence \b denotes a word boundary. This works for both the start
    of word and ending of anchoring. Start of word means either the character prior
    to the word is a non-word character or there is no character (start of string).
    Similarly, end of word means the character after the word is a non-word character
    or no character (end of string). This implies that you cannot have word boundary
    \b without a word character.


    ```

    > let sample = ''par spar spare part''

    ```


    ```

    // replace /par/ irrespective of where it occurs

    > sample.replace(/par/g, ''X'')

    < "X sx apX sXe Xt"

    // replace /par/ only at the start of word

    > sample.replace(/\bpar/g, ''X'')

    < "X spar apparent spare Xt"

    // replace /par/ only at the end of word

    > sample.replace(/par\b/g, ''X'')

    < "X sx apparent spare part"

    // replace /par/ only if it is not part of another word

    > sample.replace(/\bpar\b/g, ''X'')

    < "X spar apparent spare part"

    ```


    You can get more creative using word boundary as a pattern by itself.


    ```

    // sample = ''par spar spare part''

    // space separated words to double quoted csv

    // note that ''replace'' method is used here

    > console.log(sample.replace(/\b/g, "")).replace(/ /g, ''''))

    < "par","spar","apparent","spare","part"

    ```'
