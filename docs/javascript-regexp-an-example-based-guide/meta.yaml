    # Lookarounds


    Having seen how to create custom character classes and various avatars of groupings,
    it is time for learning how to create custom anchors and add conditions to a pattern
    within exp definition. These assertions are also known as zero-width patterns
    we can add add restrictions similar to anchors and are not part of matched portions.
    Also, you will learn how to negate a grouping similar to character sets.


    # Negative lookarounds


    Lookaround assertions can be added to a pattern in two ways — as a prefix known
    as lookbehind and a suffix known as lookahead. Syntax, these two ways are differentiated
    by adding a < for the lookbehind version. Lookarounds can be used to construct
    both positive and negative assertions. Negative lookarounds use ! and = is used
    for positive


    +   - (!pat) for negative lookahead assertion

    - (?<!pat) for negative lookbehind assertion


    As mentioned above, lookarounds are not part of matched portions and do not capture
    the matched text.


    ```

    // ''foo'' only if it is not followed by a digit character

    // note that end of string satisfies the given assertion

    // ''foofoo'' has two matches as the assertion doesn''t consume characters

    > hey fool foo42 foot5 foo.replace(/foo(?!\d)/g, ''baz'')

    < baz! foo42 baz5 baz

    ```


    ```

    // ''foo'' only if it is not preceded by

    // note how ''foo'' at start of string is matched well

    > _foo _42foo.replace(/(?<!!)foo/g, ''baz'')

    < baz _42baz

    ```


    ```

    // overlap example

    // ''foot'' doesn''t match because it is preceded by '' ''

    // the ''before'' foot was considered even though it got replaced

    > food foo_42 foot.replace(/(?<!!)foo/g, ''baz'')

    < baz_foo42bazfoot

    ```


    Can be mixed with anchors and regex regexp to define truly powerful restrictions.


    ```

    // change world only if it is not preceded by or -

    > :cart apple --rest ''tea''.replace(/(?[:|-\-])\b\w+/g, ''X'')

    < :cart X --rest ''Y''

    ```


    ```

    // add space to boundaries, but not at start or end of string

    // similar to: replace(/\b/g, '' '').trim()

    > foo_baz=num1*35*42/num2.replace(/(?^)\b|($)/g, '' '')

    < foo_baz = num1 + 35 * 42 / num2

    ```'
- md: "\nLookbehind isn't supported in Firefox. See this Q&A for a workaround.\n\n\
    # Positive lookarounds\n\nPositive lookaround syntax uses = similar to ! for negative\
    \ lookaround. The complete syntax looks like:\n\n- (?=pat) for positive lookahead\
    \ assertion\n- (?<=pat) for positive lookbehind assertion\n\n```javascript\n//\
    \ edit digits if it is followed by \n// note that the end of string doesn't qualify\
    \ as this is positive assertion\n> '42 foo-5, ba23; x83, y-20; f12'.match(/\\\
    d+(?=,)/g)\n< \"5\", \"83\"\n// edit digits if it is preceded by - and by ; or\
    \ \n> '42 foo-5, ba23; x83, y-20; f12'.match(/(?<=\\)\\d+=[,])/g)\n< \"5\", \"\
    20\"\n```\n\n```javascript\n// same as: match(/\\b\\w\\b').join('')\n> 'sea cat\
    \ rat eel tea'.replace(/(?<=\\b\\w)\\w*\\W*/g, ')\\n')\n< \"secret\"\n```\n\n\
    Lookarounds are quite handy in dealing with field based processing.\n\n```javascript\n\
    // except first and last fields\n> '1,two,3,four,5'.match(/(?<=\\,)[^]+(?=,)/g)\n\
    < \"two\", \"3\", \"four\"\n```\n\n```javascript\n// replace empty fields with\
    \ NA\n// note that in this example, order of lookbehind and lookahead doesn't\
    \ match\n> '1,,two,3,'.replace(/(?<=\\^)[^]+($)/g, 'NA')\n< \"NA,1,NA,two,3,NA,\
    \ NA\"\n// same thing with negative lookarounds\n> '1,,two,3,'.replace(/(?<![,])[^]+)/g,\
    \ 'NA')\n< \"NA,1,NA,two,3,NA, NA\"\n```\n\n```javascript\n// there is an extra\
    \ empty string match at end of non-empty columns\n> 'cat,tiger'.replace(/(?<=\\\
    ^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n// lookarounds to the rescue\n> 'cat,tiger'.replace(/(?<=\\\
    ^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n```\n\nEven though lookarounds are\
    \ not part of matched portions, capture groups can be used inside positive lookarounds.\n\
    \n```javascript\n> console.log('a b c d e').replace(/(\\S+\\s+)(?=(\\S+\\s+))/g,\
    \ '$1$2\\n')\n< a\n b\n c\n d\ne\n```\n\n# AND conditional\n\nAs promised earlier,\
    \ here's lookaround it simpler to construct AND conditionals.\n\n```javascript\n\
    > let words = ['sequoia', 'subtle', 'questionable', 'exhibit', 'equation']\n\n\
    // words containing 'b' and 't' in any order\n// same as: /b.*e.*t|t.*e.*b|e.*t.*b|t.*b./\n\
    > words.filter(w => /(?=.*b)(?=.*t)/.test(w))\n< ['subtle', 'questionable', 'exhibit']\n\
    // words containing all vowels in any order\n> words.filter(w => /(?=.*a)(?=.*i)(?=.*o).*/.test(w))\n\
    < ['sequoia', 'questionable', 'equation']\n```\n\n# Variable length lookbehind\n\
    \nIn some of the implementations of regular expressions, lookbehind doesn't work\
    \ if the pattern match varying number of characters. For example, (?<=\\d+) is\
    \ looking for behind foo by one or more digits. As I've tested on the console,\
    \ there's no restriction in JavaScript. Here are some examples that were tested.\n\
    \n- // positive lookbehind examples\n> '=314not;21irk,3cool=42'.match(/(?<=\\\
    d+)[a-z]+/g)\n< ['not', 'cool']\n// replace only 3rd occurrence of 'cat'\n> 'cat\
    \ scatter cat'.replace(/(?<=(cat.*){2})cat/, 'X')\n< 'cat scatter Xer scat'\n\n\
    - // negative lookbehind examples\n// match only if 'cat' doesn't occur before\
    \ 'dog'\n> /(?<!<cat>).).test('cat,dog,parrot')\n< false\n// match only if 'parrot'\
    \ doesn't occur before 'dog'\n> /(?<!.*parrot).).test('cat,dog,parrot')\n< true\n\
    \n# Negated grouping\n\nYou've seen a few cases where negated character class\
    \ was useful than a positive set. For example, in field based processing, it needs\
    \ to match the fields by creating a negated character set of the delimiter character.\
    \ In a similar manner, there are cases where You need to negate a regexp pattern.\
    \ This is made possible by using negative lookahead and advancing one character\
    \ at a time as shown below.\n\n```javascript\n// cannot use /at(??!go)par/ as\
    \ lookarounds do not consume characters\n> /at((?!go).*/test('cat,dog,parrot')\n\
    < true\n> /at((?!do).*/test('cat,dog,parrot')\n< false\n```\n\n```javascript\n\
    // if it gets confusing, use 'match' method to see the matching portion\n> 'fox,cat,dog,parrot'.match(/at((?!go).)*par/)[0]\n\
    < \"at,dog,par\"\n```\n\n# Cheatsheet Summary\n\n| Note | Description |\n| :---\
    \ | :--- |\n| lookarounds | allows to create positive/negative assertions |\n\
    | zero-width like anchors and not part of matching portions |\n| (?!pat) | negative\
    \ lookahead |\n| (?<!pat) | negative lookbehind |\n| (?=pat) | positive lookahead\
    \ |\n| (?<=pat) | positive lookbehind |\n| variable length lookbehind is allowed\
    \ |\n| (?!pat)(?=pat) | multiple assertions can be specified next to each other\
    \ in any order as they mark a location without consuming characters |\n| ((?!pat)*\
    \ | Negates regexp pattern |\n\nIn this chapter, learnt how to use lookarounds\
    \ to create custom restrictions and also use grouping. With this, some of the\
    \ most powerful features of regexp have been covered. The next chapter will give\
    \ a brief introduction to working with unicode characters.\n\n# Exercises\n\n\
    a) Remove leading and trailing whitespaces from all individual fields of these\
    \ strings. This time use regular expressions instead of chaining normal methods.\n\
    \n```javascript\n> let csv1 = ' ,separated ,values '\n> let csv2 = 'good bad,nice\
    \ ice , stall'\n\n> const trim_whitespace = // add your solution\n> csv1.replace(trim_whitespace,\
    \ '')\n< \"comma,separated,values\"\n> csv2.replace(trim_whitespace, '')\n< \"\
    good bad,nice ice,stall\"\n```\n\nb) Filter all elements that satisfy all alphabets\n\
    \n- should have at least two letters\n- should have at least 3 digits\n- should\
    \ have at least one special character\n- should not end with a whitespace character\n\
    \n```javascript\n> let pwds = ['hunter2', 'F2h3u%', '*XYz3.14', 'r2_d2', 'A$ C234']\n\
    > pwds.filter(// // add your solution\n< [\"F2h3u%\", \"A$ C234\"]\n```\n\nc)\
    \ Match strings if it contains price but not if there is whitespace between them.\n\
    \n```javascript\nlet str1 = '23.qty,price,42'\nlet str2 = 'qty,oh'\nlet str3 =\
    \ '3.14,qty,6,errors,3'\nlet str4 = '42qty-6,price-234,error'\nlet str5 = '4,price,3.14,qty'\n\
    ```\n\n```javascript\nconst neg = // add your solution\nneg.test(str1)\n< true\n\
    neg.test(str2)\n< false\nneg.test(str3)\n< false\nneg.test(str4)\n< true\nneg.test(str5)\n\
    < false\n```\n\nd) For the given string, surround all words with {} except whole\
    \ words. Can you solve it with lookarounds and not having to use function in replacement?\n\
    \n```javascript\nlet w1 = 'part; cat super rest_42 spar'\nw1.replace() // add\
    \ your solution\n\"{part}; cat {super} {rest}42 {spar}\"\n```\n\ne) Simple partitioning\
    \ to get an array of three elements — string separator, portion by separator and\
    \ string after separator. For the first case, split the input string from first\
    \ occurrence of digits. For the second case, split based on last occurrence of\
    \ digits.\n\n```javascript\nlet w2 = 'Sample123string42with777numbers'\nw2.split()\
    \ // add your solution\n[\"Sample\", \"123\", \"string42with777numbers\"]\n```\n\
    \n```javascript\nw2.split() // add your solution\n[\"Sample\", \"123\", \"string42with777numbers\"\
    ]\n```\n\nBonus: Can you solve this exercise without lookarounds?\n\n```javascript\n\
    // w2 = 'Sample123string42with777numbers'\nw2.match() // add your solution\n[\"\
    Sample\", \"123\", \"string42with777numbers\"]\n```\n\n```javascript\nw2.match()\
    \ // add your solution\n[\"Sample\", \"123\", \"string42with777numbers\"]\n```\n\
    \n# Unicode\n\nSo far in the book, all examples were meant for strings made up\
    \ of ASCII characters. A few years back would have been sufficient for most of\
    \ the use cases. These days it would be rare to encounter ASCII only project.\
    \ This chapter will discuss matching.\n\n# Unicode character sets and u flag\n\
    \nSimilar escape sequence character sets, the \\p{ construct various predefined\
    \ sets to work with unicode. For negated sets, use \\P{}. You'll need to set the\
    \ u flag.\n\n```javascript\n// extract all consecutive letters\n> 'fox:αλεποῦ,eagle:αετóc'.match(/\\\
    pL+/gu)\n< [\"fox\", \"αλεποῦ\", \"eagle\", \"αετό\"]\n```\n\n```javascript\n\
    // delete all characters other than letters\n> \\u00f2,ß 4.foo.replace(/\\pL+/gu,\
    \ '')\n< [\\u00f8foo]\n```\n\n```javascript\n// extract words not surrounded by\
    \ punctuation marks\n> 'tie, ink est;'.match(/(?<=\\p)\\b\\w+(?=\\p)/gu)\n< [\"\
    ink\"]\n```\n\n> See MDN: Unicode property escapes for more details and list of\
    \ \\p{} sets. Also see regular-expressions: unicode for an overview of challenges\
    \ with unicode matching.\n\n# Codepoints\n\nYou can use codepoints \\u{} to specify\
    \ unicode characters. This is similar to how we use \\x for hexadecimal from string\n\
    \n```javascript\n// to get codepoints from hexadecimal\n> Array.from('fox:αλεποῦ',\
    \ c => c.codePointAt().toString(16))\n< [\"66\", \"6f\", \"78\", \"3a\", \"3b1\"\
    , \"3bb\", \"3b5\", \"3c0\", \"3bf\", \"3cd\"]\n```\n\n```javascript\n// use codepoint\
    \ to represent a character\n> \\u3b1\n< [\"α\"]\n```\n\n```javascript\n// range\
    \ for lowercase alphabets using \\u{}\n// note that \\u{} will work with 'u' flag\
    \ only\n```\n\n```javascript\n> 'fox:αλεποῦ,eagle:αετóc'.match(/\\u{61}-\\u{7a}]/gu)\n\
    < [\"fox\", \"eagle\"]\n```\n\n> See stackoverflow: Unicode string to hex.\n"
  mdcn: "\n\nFirefox 不支持后行断言（Lookbehind）。请参考此问答页面以获取解决方案。\n\n# 正向环绕断言 (Positive lookarounds)\n\
    \n正向环绕断言语法使用 `=`，类似于负向环绕断言的 `!`。完整语法如下：\n\n- `(?=pat)` 用于正向先行断言\n- `(?<=pat)`\
    \ 用于正向后行断言\n\n```javascript\n// 如果数字后面跟着逗号，则编辑数字\n// 注意，字符串末尾不符合此条件，因为这是一个正向断言\n\
    > '42 foo-5, ba23; x83, y-20; f12'.match(/\\d+(?=,)/g)\n< \"5\", \"83\"\n// 如果数字前面是\
    \ - 或是 ;，则编辑数字\n> '42 foo-5, ba23; x83, y-20; f12'.match(/(?<=\\)\\d+=[,])/g)\n\
    < \"5\", \"20\"\n```\n\n```javascript\n// 等同于: match(/\\b\\w\\b').join('')\n>\
    \ 'sea cat rat eel tea'.replace(/(?<=\\b\\w)\\w*\\W*/g, ')\\n')\n< \"secret\"\n\
    ```\n\n环绕断言在处理基于字段的处理时非常有用。\n\n```javascript\n// 排除第一个和最后一个字段\n> '1,two,3,four,5'.match(/(?<=\\\
    ,)[^]+(?=,)/g)\n< \"two\", \"3\", \"four\"\n```\n\n```javascript\n// 将空字段替换为 NA\n\
    // 注意在这个示例中，后行断言和先行断言的顺序并不匹配\n> '1,,two,3,'.replace(/(?<=\\^)[^]+($)/g, 'NA')\n\
    < \"NA,1,NA,two,3,NA, NA\"\n// 使用负向环绕断言效果一样\n> '1,,two,3,'.replace(/(?<![,])[^]+)/g,\
    \ 'NA')\n< \"NA,1,NA,two,3,NA, NA\"\n```\n\n```javascript\n// 在非空列末尾会有一个额外的空字符串匹配\n\
    > 'cat,tiger'.replace(/(?<=\\^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n// 环绕断言来救场\n\
    > 'cat,tiger'.replace(/(?<=\\^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n```\n\n\
    尽管环绕断言本身不是匹配部分的一部分，但在正向环绕断言内部可以使用捕获组。\n\n```javascript\n> console.log('a b c d\
    \ e').replace(/(\\S+\\s+)(?=(\\S+\\s+))/g, '$1$2\\n')\n< a\n b\n c\n d\ne\n```\n\
    \n# AND 条件\n\n如之前承诺的，这里使用环绕断言可以更简单地构建 AND 条件。\n\n```javascript\n> let words =\
    \ ['sequoia', 'subtle', 'questionable', 'exhibit', 'equation']\n\n// 包含 'b' 和\
    \ 't' 的单词，顺序不限\n// 等同于: /b.*e.*t|t.*e.*b|e.*t.*b|t.*b./\n> words.filter(w => /(?=.*b)(?=.*t)/.test(w))\n\
    < ['subtle', 'questionable', 'exhibit']\n// 包含所有元元的单词，顺序不限\n> words.filter(w =>\
    \ /(?=.*a)(?=.*i)(?=.*o).*/.test(w))\n< ['sequoia', 'questionable', 'equation']\n\
    ```\n\n# 可变长度后行断言\n\n在某些正则表达式的实现中，如果模式匹配的字符数量变化，后行断言将无法工作。例如，`(?<=\\d+)` 寻找 `foo`\
    \ 后面的一个或多个数字。正如我在控制台测试的，JavaScript 中没有这个限制。以下是一些测试过的示例。\n\n- // 正向后行断言示例\n> '=314not;21irk,3cool=42'.match(/(?<=\\\
    d+)[a-z]+/g)\n< ['not', 'cool']\n// 仅替换第 3 次 'cat'\n> 'cat scatter cat'.replace(/(?<=(cat.*){2})cat/,\
    \ 'X')\n< 'cat scatter Xer scat'\n\n- // 负向后行断言示例\n// 仅当 'cat' 未出现在 'dog' 之前时才匹配\n\
    > /(?<!<cat>).).test('cat,dog,parrot')\n< false\n// 仅当 'parrot' 未出现在 'dog' 之前时才匹配\n\
    > /(?<!.*parrot).).test('cat,dog,parrot')\n< true\n\n# 否定分组\n\n你可能见过几种情况，其中否定字符类比正向字符集更有用。例如，在基于字段的处理中，需要通过创建分隔符字符的否定字符集来匹配字段。同样，在某些情况下，你需要否定一个正则模式。这通过如下所示使用负向先行断言并每次移动一个字符来实现。\n\
    \n```javascript\n// 不能使用 /at(??!go)par/，因为环绕断言不会消耗字符\n> /at((?!go).*/test('cat,dog,parrot')\n\
    < true\n> /at((?!do).*/test('cat,dog,parrot')\n< false\n```\n\n```javascript\n\
    // 如果觉得困惑，使用 'match' 方法查看匹配部分\n> 'fox,cat,dog,parrot'.match(/at((?!go).)*par/)[0]\n\
    < \"at,dog,par\"\n```\n\n# 摘要表总结\n\n| Note | 说明 |\n| :--- | :--- |\n| 环绕断言 | 允许创建正向/负向断言\
    \ |\n| 零宽锚点 | 不消耗字符的匹配 |\n| (?!pat) | 负向先行断言 |\n| (?<!pat) | 负向后行断言 |\n| (?=pat)\
    \ | 正向先行断言 |\n| (?<=pat) | 正向后行断言 |\n| 可变长度后行断言 | 允许 |\n| (?!pat)(?=pat) | 多个断言可以任意指定且不消耗字符\
    \ |\n| ((?!pat)* | 否定正则模式 |\n\n在本章中，我们学习了如何使用环绕断言创建自定义限制以及分组。通过这些，涵盖了正则表达式的一些强大功能。下一章将介绍处理\
    \ Unicode 字符。\n\n# 练习\n\na) 移除这些字符串所有字段的端尾空格。这次使用正则表达式而不是链式方法。\n\n```javascript\n\
    > let csv1 = ' ,separated ,values '\n> let csv2 = 'good bad,nice ice ,stall'\n\
    \n> const trim_whitespace = //你的答案\n> csv1.replace(trim_whitespace, '')\n< \"\
    comma,values\"\n> csv2.replace(trim_whitespace, '')\n< \"good bad,nice ice,stall\"\
    \n```\n\nb) 过滤满足以下条件的元素\n\n- 应该至少有两个字母\n- 应该至少有三个数字\n- 应该至少有一个特殊字符\n- 应该不以空格结尾\n\
    \n```javascript\n> let pwds = ['hunter2', 'F2h3u%', '*XYz3.14', 'r2_d2', 'A$ C234']\n\
    > pwds.filter(// 你的答案\n< [\"你的答案\"]\n```\n\nc) 如果字符串包含 price，但如果它们之间有空格则不匹配。\n\
    \n```javascript\nlet str1 = '23.qty,price,42'\nlet str2 = 'qty,oh'\nlet str3 =\
    \ '3.14,qty,6,errors'\nlet str4 = '42qty-6,error'\nlet str5 = '4,price,3.14,qty'\n\
    ```\n\n```javascript\nconst neg = // 你的答案\nneg.test(str1)\n< true\nneg.test(str2)\n\
    < false\nneg.test(str3)\n< false\nneg.test(str4)\n< true\nneg.test(str5)\n< false\n\
    ```\n\nd) 对于给定字符串，用 {} 包围所有完整的单词。你可以用环绕断言解决它而不是使用函数吗？\n\n```javascript\nlet w1\
    \ = 'part; cat super_42 spar'\nw1.replace() // 你的答案\n\"{part}; cat {super} {spar}\"\
    \n```\n\ne) 简单的分区以获取三个元素的数组——分隔符、分隔符部分和分隔符后的字符串。第一种情况，从第一个数字处分割输入字符串。第二种情况，根据最后一个数字处分割。\n\
    \n```javascript\nlet w2 = 'Sample123string42with77numbers'\nw2.split() // 你的答案\n\
    [\"Sample\", \"123\", \"string42with777numbers\"]\n```\n\n```javascript\nw2.split()\
    \ // 你的答案\n[\"Sample\", \"123\", \"string42with777numbers\"]\n```\n\n附加题：你可以不用环绕断言解决这个练习吗？\n\
    \n```javascript\n// w2 = 'Sample123string42with77numbers'\nw2.match() // 你的答案\n\
    [\"Sample\", \"123\", \"string42with77numbers\"]\n```\n\n```javascript\nw2.match()\
    \ // 你的答案\n[\"Sample\", \"123\", \"string42with77numbers\"]\n```\n\n# Unicode\n\
    \n到为止，书中的所有示例都是针对 ASCII 字符组成的字符串。几年前这对于大多数用例已经足够了。现在很少遇到只有 ASCII 的项目。本章将讨论匹配。\n\
    \n# Unicode 字符集和 u标记\n\n与转义序列字符集类似，`\\p{}` 构建各种定义集来处理 unicode。对于否定集，使用 `\\P{}`。你需要设置\
    \ `u` 标记。\n\n```javascript\n// 提取所有连续字母\n> 'fox:αλεποῦ,eagle:αετóc'.match(/\\\
    pL+/gu)\n< [\"fox\", \"αλεποῦ\", \"eagle\", \"αετό\"]\n```\n\n```javascript\n\
    // 删除字母以外的所有字符\n> \\u00f2,ß 4.foo.replace(/\\pL+/gu, '')\n< [\\u00f8foo]\n```\n\
    \n```javascript\n// 提取未被标点符号包围的单词\n> 'tie, ink est;'.match(/(?<=\\p)\\b\\w+(?=\\\
    p)/gu)\n< [\"ink\"]\n```\n\n> 更多详情查看 MDN: Unicode property escapes 以及 \\p{} 列表。另查看\
    \ regular-expressions: unicode 以概述 unicode 匹配的挑战。\n\n# 代码点 (Codepoints)\n\n你可以使用代码点\
    \ `\\u{}` 来指定 unicode 字符。这类似于我们使用 `\\x` 获取字符串的十六进制。\n\n```javascript\n// 从十六进制获取代码点\n\
    > Array.from('fox:αλεποῦ', c => c.codePointAt().toString(16))\n< [\"66\", \"6f\"\
