  md: '# Working with matched portions


    Having seen a few regexp features that can match varying text, you''ll learn how
    to extract and work with matching portions in this chapter.


    # match method


    The match method can be used in different ways. When g flag isn''t used and the
    regexp succeeds, you get an array object containing various details of the first
    matching portion.


    ```

    // note that ''g'' flag isn''t used

    > ''abc ac adc abc''.match(/abc/)

    < ["abc", index: 0, input: "abc ac adc abc", groups: undefined]


    // to get only the matching portion

    > ''abc ac adc abc''.match(/abc/)[0]

    < ''abc''


    // non-regexp object will get processed as: RegExp(object)

    > ''abc ac adc abc''.match(''abc'')

    < ["abc", index: 0, input: "abc ac adc abc", groups: undefined]

    ```


    The index property gives the location of matched portion. If the regexp fails,
    the output is null and not an empty array. The groups property will be discussed
    in Named capture sections. See MDN: match for more details and examples.


    ```

    > let s1 = "cat and dog"


    > s1.match(/dog/).index

    < 8

    > s1.match(/dog/).input

    < "cat and dog"


    > s1.match(/xyz/)

    < null

    ```


    # search method


    The search method gives the index of first matching portion. If the regexp fails,
    it returns -1 as output.


    ```

    // same as: match(/dog/).index

    > ''cat and dog''.search(/dog/)

    < 8


    // cannot use match(/xyz/).index here

    // as ''match'' returns ''null'' if regexp doesn''t match

    > ''cat and dog''.search(/xyz/)

    < -1

    ```'
  merge: -1
  pgno: 33
