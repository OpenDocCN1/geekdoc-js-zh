    # # What’s so special about Regular Expressions?


    Regular Expressions is a versatile tool for text processing. You''ll find them
    included in standard library of many programming languages that are used for scripting
    purposes. If not, you can usually find a third-party library. Syntax and features
    of regular expressions vary from language to language. JavaScript''s syntax is
    similar to that of Perl language, but there are significant differences.


    The String object in JavaScript supports variety of methods to deal with text.
    So, what''s special about regular expressions and why would you need it? For learning
    and understanding purposes, one can view regular expressions as a programming
    language in itself, special for text processing. Parts of a regular expression
    can be saved for future use, analogous to variables. There are ways to perform
    AND, OR, NOT conditionals. Operations similar to range and repetition and so on.


    Here''s some common use cases:


    +   - Sanitizing a string to ensure that it satisfies a known set of rules. For
    example, check if a given string matches password rules.

    - Filtering or extracting portions on an abstract level like alphabets, numbers,
    punctuation and so on.

    - Qualified string replacement. For example, at the start or the end of a string,
    only words, based on surrounding text, etc.


    # ## Further Reading


    +   - The true power of regular expressions — it also includes a nice explanation
    of what regular means in this context

    - softwareengineering: Is it a must for every programmer to learn regular expressions?

    - softwareengineering: When you should NOT use Regular Expressions?

    - codhorror: Now You Have Two Problems

    - wikedia: Regular expression — this article includes discussion on regular expressions
    as a formal language as well as details on various implementations'
- md: "\n# RegExp introduction\n\nThis chapter will get you started with defining\
    \ RegExp objects and using them inside string methods. To keep it simple, the\
    \ examples will not use special characters related to regular expressions. The\
    \ main focus will be to get you comfortable with syntax and text processing examples.\
    \ Two methods will be introduced in this chapter: the test method to search if\
    \ the input contains a string and the replace method to substitute a portion of\
    \ the input with something else.\n\n- This book will use regular expressions and\
    \ regex interchangeably. When specifically referring to a JavaScript object, RegExp\
    \ will be used.\n\n# Console\n\nAs mentioned in the preface, examples presented\
    \ in this book have been tested on Chrome/Chromium console. Other browsers on\
    \ Chromium may also work. Use (Ctrl+Shift+J) shortcut from a new tab to open a\
    \ console. Some variable names are same across different charts, so open another\
    \ in such cases. See MDN: Regular Expressions for documentation, examples and\
    \ feature compatibility details.\n\n# test method\n\nFirst, set up a simple example\
    \ to test whether a string is part of another string or not. Normally, you'd use\
    \ the includes method and pass a string as argument. For regular expressions,\
    \ use the test method on a RegExp object, which is defined by the search string\
    \ enclosed within //\n\n```javascript\n> let sentence = 'This is a sample string'\n\
    \n// check if 'sentence' contains the given string argument\n> sentence.includes('is')\n\
    < true\n> sentence.includes('z')\n< false\n```\n\n```javascript\n// check if 'sentence'\
    \ matches the pattern as described by the regex\n> /is/.test(sentence)\n< true\n\
    > /z/.test(sentence)\n< false\n```\n\nHere's some examples of using the test method\
    \ in conditional expressions.\n\n```javascript\n> let report = 'string theory'\n\
    \n> if (/ring/.test(report)) {\n    console.log('mission success')\n}\n> mission\
    \ success\n```\n\n```javascript\n> if (!fire/.test(report)) {\n  console.log('mission\
    \ failed')\n}\n< mission failed\n```\n\nAnd here's some array processing examples.\n\
    \n```javascript\n> let words = ['cat', 'attempt', 'tattle']\n\n// get all elements\
    \ that contain 'tt'\n> words.filter(w => /tt/.test(w))\n< ['attempt', 'tattle']\n\
    \n// check if all the elements contain 'at'\n> words.every(w => /at/.test(w))\n\
    < true\n\n// check if any element contains 'stat'\n> words.some(w => /stat/.test(w))\n\
    < false\n```\n\n# Flags\n\nSome of the regular expression functionality is enabled\
    \ by passing flags, represented by an alphabet character. If you have used command\
    \ line, flags are similar to command options, for example grep -i will perform\
    \ case insensitive matching.\n\nIn this chapter, two flags will be discussed:\n\
    \n- flag to ignore case while matching alphabets (default is case sensitive)\n\
    - flag to match all occurrences (default only the first one is matched)\n\nExamples\
    \ for each is shown below, discussed in replace method later in this chapter.\n\
    \n```javascript\n> /cat/.test('Cat')\n< false\n> /cat/i.test('Cat')\n< true\n\
    ```\n\n```javascript\n> ['Cat', 'cot', 'CATER', 'SCat', 'ScUTle'].filter(w =>\
    \ /cat/i.test(w))\n< ['Cat', 'CATER', 'SCat']\n```\n\n# RegExp constructor and\
    \ reuse\n\nThe RegExp object can be saved in a variable. This helps to improve\
    \ code clarity, enable reuse, etc.\n\n```javascript\n> const pet = /dog/\n```\n\
    \n```javascript\n> pet.test('They bought a dog')\n> true\n> pet.test('A cat crossed\
    \ their path')\n< false\n```\n\nRegExp objects can also be constructed using the\
    \ RegExp() constructor. The first argument is a string or a RegExp object. The\
    \ second argument is used to specify one or more flags.\n\n```javascript\n> const\
    \ pat = new RegExp('dog')\n> pat\n> /dog/\n```\n\n```javascript\n// if flags are\
    \ needed, specify them as the second argument\n> new RegExp('dog', 'i')\n> /dog/\n\
    ```\n\nThe main advantage of the constructor over // literal is the ability to\
    \ dynamically construct the regex using ${ to insert content of other variables\
    \ or the result of an expression.\n\n```javascript\n> let greeting = 'hi'\n```\n\
    \n```javascript\n> const pat1 = new RegExp(`${greeting} there`)\n> pat1\n> /hi\
    \ there/\n```\n\n```javascript\n> new RegExp(`${greeting.toUpperCase()} there`)\n\
    > /HI there/\n```\n\n> Both strings and RegExp objects support special sequences.\
    \ Some sequences like \\t and \\n mean the same but sequences like \\b have completely\
    \ different meaning. To avoid unintended behavior, use \\\\ instead of \\.\n\n\
    ```javascript\n> new RegExp('123\\tabc')\n> /123 abc/\n```\n\n```javascript\n\
    > new RegExp('123\\\\tabc')\n> /123\\tabc/\n```\n\nHere's a screenshot of another\
