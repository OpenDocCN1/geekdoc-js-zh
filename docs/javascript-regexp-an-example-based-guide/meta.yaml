    # source and flags properties


    If you need the contents of a RegExp object, you can use source and flags properties
    to get the pattern string and flags respectively. These methods will help you
    to build a RegExp object using contents of another RegExp object.


    ```

    > const p3 = /\b/

    > const p4 = new RegExp(p3.source + ''|cat'', ''g'')


    > p4

    > <\bar\b|cat/g>

    > console.log(p4.source)

    > <\bar\b|cat

    > p4.flags

    > "g"

    ```


    ```

    > ''cater cat concatenate far spare''.replace(p4, ''X'')

    > "Xer X Xenate X spare"

    ```


    # Escaping delimiter


    Another character to keep track for escaping the delimiter used to define the
    RegExp literal. Or depending upon the pattern, you can use the new RegExp constructor
    to avoid escaping.


    ```

    > let path = ''/foo/123/foo/baz/ip.txt''

    ```


    ```

    // this is known as ''leaning toothpick syndrome''

    > path.replace(/\/foo\/123\\/, ''~'')

    > "~/foo/baz/ip.txt"

    ```


    ```

    // using new RegExp improves readability and can reduce typos

    > path.replace(new RegExp(''^foo/123/''), ''~'')

    > "~/foo/baz/ip.txt"

    ```


    # Cheatsheet Summary


    | Note | Description |

    | --- | --- |

    | \ | prefix metacharacters with \ to match them literally |

    | \ | to match literally |

    | source | property to convert RegExp object to string helps to insert a RegExp
    inside another RegExp |

    | flags | property to get flags of a RegExp object |

    | RegExp(`pat`) | helps to avoid or reduce escaping the / delimiter character
    |

    | Alternation precedence | tie-breaker is left to right if patterns have the same
    starting location robust solution: sort the alternations based on length, longest
    first |'
