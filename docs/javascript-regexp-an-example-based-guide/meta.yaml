    \n# Escaping metacharacters\n\nYou have seen a few metacharacters and escape sequences\
    \ that help to compose a RegExp literal. There's also / character used as delimiter.\
    \ This chapter will discuss how to remove special meaning of such constructs.\
    \ Also, you'll learn how to take care of special characters when building a RegExp\
    \ from normal strings. To match metacharacters literally, i.e. to remove their\
    \ special meaning, prefix them with \\. To indicate a literal, use \\.\n\n```javascript\n\
    // even though ^ is not used as anchor, it won't matched literally\n> /b/.test('a\
    \ + b') < false\n// escape will work\n> /b/.test('a + b') < true\n\n// case 1:\
    \ replace all matches\n// escaping metacharacters using 'escapeExp'\n// const\
    \ pat = new RegExp(escapeExp(usr_str), 'g')\n// pat\n// /(a*b)/g```\n\n```javascript\n\
    // case 2: replace only at the end of string\n> pat.replace(new RegExp(escapeRegex(usr_str)\
    \ + '$'), 'c')\n< \"f(a-b) - c\"\n```\n\n# Dynamically building alternation\n\n\
    When you are defining a regex yourself, you can manually escape metacharacters\
    \ where needed. However, if you have array of strings and need to match any of\
    \ their content literally, to do so you need to escape all metacharacters before\
    \ combining the strings with |. The function below uses unionExp introduced in\
    \ the previous section.\n\n```javascript\nfunction unionExp(arr) {\n  return arr.map(w\
    \ => escapeRegex(w)).join('|')\n}\n```\n\nAnd here are some examples with unionExp\
    \ used to construct the required regex. here, order of alternation wouldn't matter\
    \ and assume that other regex features are needed.\n\n```javascript\nlet w1 =\
    \ ['c*', 'dog$', 'f|x']\nconst p1 = new RegExp(unionExp(w1), 'g')\n> p1\n< /c*$|dog$|f|x/g\n\
    > 'c$ dog parrot f'.replace(p1, 'mammal')\n< 'mammal parrot mammal'\n\n// here,\
    \ alternation rules need to be applied first and assume that the terms need to\
    \ be matched to all words\nlet w2 = ['hand', 'handy', 'handful']\n// sort by length,\
    \ longest first\nw2.sort((a,b) => b.length - a.length)\n['handful', 'handy', 'hand']\n\
    const p2 = new RegExp(`${unionExp(w2)}`, 'g')\n> p2\n< /handful|handy|hand/g\n\
    // note that 'hands' and 'handed' isn't replaced\n// 'handful handed hands hand'.replace(p2,\
    \ 'X')\n< X handed hands X\n\n> The RegExp utility uses RegExp.escape and RegExp.union\
    \ methods. The union method has additional functionality of allowing a mix of\
    \ string and RegExp-like literals also take care of renaming backreferences.\n\
    \n# source and flags properties\n\nIf you need the contents of a RegExp object,\
