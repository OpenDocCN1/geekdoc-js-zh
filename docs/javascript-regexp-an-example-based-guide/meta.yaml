    Character classes can also be used to construct numeric ranges.


    ```

    // numbers between 10 to 29

    > ''23 154 12 26 98234''.match(/\b[12][0-9]\\b/)

    < ["23", "12", "26"]

    ```


    ```

    // numbers >= 100

    > ''23 154 12 26 98234''.match(/\b[0-9]{3}\\b/)

    < ["154", "08234"]

    // numbers >= 100 if there are leading zeros

    ```


    ```

    > ''0501 035 154 12 26 98234''.match(/\b*[1-9][0-9]{2,}\\b/)

    < ["0154", "98234"]

    ```


    However, it is very messy to match corner cases and some ranges are complicated
    to design. In such cases, it is better to match all the numbers and add code to
    use numeric operations.


    ```

    // numbers < 350

    > ''45 349 651 593 204''.match(/\b[0-9]+\\g).filter(n => n < 350)

    < ["45", "204"]

    > ''45 349 651 593 204''.replace(/\b[0-9]+\\g, m => m < 350 ? 0 : 1)

    < "0 0 1 1 0"

    ```


    ```

    // numbers between 200 and 650

    > ''45 349 651 593 204''.match(/\b[0-9]+\\g).filter(n => n >= 200 && n <= 650)

    < ["349", "593", "204"]

    ```


    The ^ metacharacter has specified the first character of the character class.
    It negates the set, all characters other those specified will be matched.


    ```

    // all non-digits

    > ''Sample123string4with777numbers''.match(/\^0-9]+\\g)

    < ["Sample", "string", "with", "numbers"]

    ```


    ```

    // deleting characters from start of a delimiter

    > ''foo=42;baz=123''.replace(/\^[^=]+\/, '''')

    < ["=42", "baz=123"]

    > ''foo:42;baz=123''.replace(/\^([^=:]+:2}/, '''')

    < ["bar:baz"]

    ```


    ```

    // deleting characters at end of a delimiter

    > ''foo=42;baz=123''.replace(/[^=]+$/, '''')

    < ["foo=42", "baz"]

    ```


    As highlighted earlier, handle negative logic with care, as you might end up matching
    more than you wanted. Sometimes it is easier to use positive character class and
    instead instead of negated character class.


    ```

    let words = [''tryst", "fun", "glyph", "pity", "why'']

    ```


    ```

    > words.filter(w => /[aiou]+$/.test(w))

    < ["tryst", "glyph", "why"]

    > words.filter(w => !/[aiou]+$/.test(w))

    < ["tryst", "glyph", "why"]

    ```'
