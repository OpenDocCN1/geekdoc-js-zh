  md: 'Similar to other metacharacters, prefix \ to character class metacharacters
    to match them literally. Some of them can be achieved by different placement as
    well.


    ```

    // - should be first or last character or escaped \

    > ''ab-cd'' gh-c 12-423''.match(/\b[a-z]{2,}\b/g)

    < "ab-cd", "gh-c"

    > ''ab-cd'' gh-c 12-423''.match(/\b[a-z\-0-9]{2,}\b/g)

    < "ab-cd", "gh-c", "12-423"


    // ^ should be other than first character or escaped \

    > ''f*(a*b)'' 3*(a+b)''.match(/[^*]*/g)

    < "a*b", "a+b"

    > ''f*(a*b)'' 3*(a+b)''.match(/([\^]+/g)

    < "a*b", "a+b"


    // [ doesn''t need escaping, but you can escape it if you wish \

    // and should be escaped using \

    > ''words=tea''.match(/[a-z\]0-9]+/[0])

    < "words[5]"

    > console.log(''5ba\abc2''.match(/[\a\b+)/[0]))

    < ba\bab

    ```


    # Escape sequence character sets


    Commonly used sets have defined escape sequences:


    +   * \w is similar to [A-Za-z0-9_] for matching word characters (recall the definition
    for word boundaries)

    * \d is similar to [0-9] for matching digit characters

    * \s is similar to [\t\r\n\f\v] for matching whitespace characters


    These escape sequences can be used as a standalone sequence or inside a character
    class. As mentioned before, the expression and description will assume input made
    of ASCII characters. Use \W , \D and \S respectively for their negated set.


    ```

    > Sample123string42with777numbers''.split(/\d+/)

    < "Sample", "string", "with", "numbers"


    > ''sea eat rat eel tea''.match(/\b\w+\g).join('''')

    < "secret"


    > ''tea sea-pit sit-lean bean''.match(/([\w:]+/g)

    < "sea", "pit sit", "lean bean"


    > Sample123string42with777numbers''.replace(/\D+/g, ''-'')

    < "-123-472-777"


    > 1..3 \f foo baz 42tzzz \r\n1-2-3 ''.match(/\S+/g)

    < [1..3", "foo-baz", "42", "zzz", "1-2-3"]

    ```'
