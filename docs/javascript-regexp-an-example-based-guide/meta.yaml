    # Groupings and backreferences


    You''ve been hearing more awesome stuff regarding groupings. Well, here they come
    in various forms. And some more will come next chapter!


    # Backreferences


    First, how to refer to capture portions directly in regexp definition and replacement
    section. You''ve already seen how to refer to captured groups by match and matchall
    methods. More directly, you can use \N (within regexp definition) and $N (replacement
    section), where N is the group you want. With more, you can also apply quantifiers
    to backreferences when used in regexp. All various forms are listed below:


    - in replacement section, $1, $2 etc to refer to the corresponding group

    - in replacement section, $ to refer to entirely matched portion

    - ''$'' gives before the matched portion

    - ''$'' gives after the matched portion

    - within regexp definition, \1, \2 etc to refer to the corresponding group


    ```

    // remove square brackets that surround digit

    > ''[52] apples and mangoes''.replace(/(\d+)/g, ''$1'')

    ```

    ```

    ```

    // replace with if it is alone

    > ''foo_123 baz_''.replace(/(.*?)/, ''$1'')

    < ''foo_123 baz_''

    ```


    ```

    // swap words that are separated by a comma

    > ''good,bad 42,24''.replace(/(\w+),(\w+)/, ''$2,$1'')

    < ''bad 24,42''

    ```


    Here are some examples for using backreferences available by default without capturing
    groups.


    ```

    // duplicate first field and add it as last field

    > ''fork,42,nice,3.14''.replace(/.+/, ''$&,$'')

    < ''fork,42,nice,3.14,fork''

    ```


    And here''s some examples for using backreferences within regexp definition


    ```

    // elements that have at least one consecutive repeated character

    let words = [''mono'', ''excellent'', ''poll'']

    words.filter(w => /\w+\.\w/.test(w))

    < ["excellent", "poll"]

    ```


    ```

    // remove any number of consecutive duplicate words separated by space

    // note the use of quantifier on backreference

    > ''aa a a 42 f_1 f_1 13.14''.replace(/\b(\w+)(\1+)\b/g, ''$1'')

    < ''aa 42 f_1 f_1 13.14''

    ```


    # Backreference oddities


    Since $ is special in replacement section, there''s an issue to place it literally
    followed by numbers. Usually, escaping is used for such purposes, but here you
    need to use $$


    ```

    // no capture group, so ''$1'' is inserted literally

    > ''cat''.replace(/a/, ''\$1'')

    < "c($1)"

    // with capture group, ''\$1'' is same as ''$1'' here

    > ''cat''.replace(/(a)/, ''$1'')

    < "c(a)"

    ```


    ```

    // use ''$1'' to avoid backreference and insert ''$1'' literally

    > ''cat''.replace(/(a)/, ''\$\$1'')

    < "c($1)"

    ```


    Another issue is to avoid ambiguity when you have normals immediately followed
    a backreference? It''ll depend on how many backreferences are present in the pattern
    and whether you need to avoid ambiguity in regex definition or replacement section.
    For example, if there are less than 10 groups, something like $12 will refer to
    1 capture group and 2 as a character. If there are no capture groups, then something
    $5 will get inserted literally as $ and 5.


    On the other hand, if you have more than 9 but less than 100 groups, then there
    would be an issue if you want to refer to single digit followed by literal characters.
    The workaround is to prefix 0 such that number of digits equals the number of
    digits for the highest capture group. So if you have more than 9 but less than
    100 groups, $05 will refer to 5th capture group and any digit after will be treated
    literally.


    ```

    // for illustration purposes, 12 capture groups 2-digit group, there''s no issue

    > ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)/./, ''$11'')

    < "kmn"

    ```


    ```

    // if you want to reference 1 single group followed by ''1'' as a character?

    // using \x31 wouldn''t work as it still results in $11

    > ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)/./, ''$1\x31'')

    < "kmn"

    ```

