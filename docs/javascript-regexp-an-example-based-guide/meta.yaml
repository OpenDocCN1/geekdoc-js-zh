  md: 'For swapping two or more strings without using intermediate result, using a
    dictionary is recommended.


    ```

    > let swap = { ''cat'': ''tiger'', ''tiger'': ''cat'' }

    ```


    ```

    > cat tiger dog tiger cat.replace(/cat|tiger/g, k => swap[k])

    < tiger cat dog cat tiger

    ```


    For a dictionary with many entries and list to undergo changes during development,
    building alteration list is not usually a good choice. Also, recall that per precedence
    rules, longest string length should come first. The unionRegExp function, introduced
    in Dynamically building alteration section, is helpful here.


    ```

    > let d = { ''hand'': 1, ''handy'': 2, ''handful'': 3 }

    ```


    ```

    > const p = unionRegExp(Object.keys(d).sort((a, b) => b.length - a.length))

    > console.log(p)

    < handful|hand

    > ''handful hand handy''.replace(new RegExp(p, ''g''), k => d[k])

    < "3 1 2"

    ```


    # # Cheatsheet and Summary


    | Note | Description |

    |---|---|

    | m = s.match(/pat/) | assuming g flag isn''t succeeds, returns an array with
    matched portion and 3 properties index provides the starting location of the match
    input provides the little string s groups provides dictionary of named capture
    groups for above case, gives entire matched portion |

    | m[0] m[1] | matched portion of first capture group

    | m[2] | matched portion of second capture group and so on |

    | s.match(/pat/g) | returns only the matched portions, no properties capture group
    does not affect the match returns null if regexp fails |

    | s.replaceAll(/pat/g) | returns an iterator containing details for each matched
    portion and its properties use [...] or Array.from to convert to Array.from also
    allows mapping function s.replace(/pat/, func) can use a function to provide replacement
    string each matched portion gets passed as arguments similarly, dictionary can
    be used for replacement |

    | s.search(/pat/) | gives starting location of the match succeeds -1 if regexp
    fails |


    This chapter introduced match and matchAll methods, which allows you to work with
    various matching portions of input string. The replace method allows you to use
    a function as replacement, which helps to process the matching portions before
    being used as replacement'
