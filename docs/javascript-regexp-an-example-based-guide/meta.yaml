  md: '| Pattern | Description |

    | --- | --- |

    | {m,n} | match m to n times |

    | {m,} | match at least m times |

    | {n} | match exactly n times |


    ```

    > let demo = [''abc'', ''ac'', ''abbc'', ''xabbbcz'', ''bc'', ''abbabbbc'']

    ```


    ```

    > demo.filter(w => /ab/1c/.test(w))

    < "abc", "abbc", "xabbbcz"

    > demo.filter(w => /ab{2}/.test(w))

    < "abc", "ac", "abbc"

    ```


    ```

    > demo.filter(w => /ab{3}c/.test(w))

    < "xabbbcz", "abbbbbc"

    ```


    ```

    > demo.filter(w => /ab{3}c/.test(w))

    < "xabbbcz"

    ```


    > The { metacharacters must be escaped to match them literally. However, unlike
    {n} metacharacters, they have more leeway. For example, escaping { } is enough,
    or if it doesn''t conform to any of the forms listed, escaping is not needed at
    all.


    Next, how to construct AND conditional using dot metacharacter and quantifiers.


    ```

