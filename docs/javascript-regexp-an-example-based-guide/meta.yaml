    # # Cheatsheet and Summary


    | Note | Description |

    | --- | --- |

    | . | match any character except \r and \n characters |

    | s | flag to match \r and \n characters with metacharacter |

    | greedy | match as much as possible |

    | ? | greedy quantifier: match @ or 1 times |

    | + | greedy quantifier: match @ or more times |

    | {m,n} | greedy quantifier: match 1 or more times |

    | {m} | greedy quantifier: match m to n times |

    | {n} | greedy quantifier: match at least m times; match exactly n times |

    | pat1.*pat2 | any number of characters between pat1 and pat2 |

    | pat1.pat2.*pat1 | match both pat1 and pat2 in any order |

    | non-greedy | append ? to greedy quantifier minimally as possible |

    | s.split(/pat/) | split a string based on regex use tools like regex101 and jex:
    regex |


