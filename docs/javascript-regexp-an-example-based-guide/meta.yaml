    ```

    > ''foot''.replace(/f\.o/, ''X'')

    < ''Xt''


    // a more practical example

    // prefix ''<'' with ''\\'' if it is not already prefixed

    > console.log(blah foo \< baz).replace(/\\\?/, ''\\''))

    < blah \< foo \< bar \ baz


    // say goodbye to /handful|hand/shenanigans

    > '' hand handy handful''.replace(/hand(y|ful)?/g, ''X'')

    < X X X

    ```


    But wait, how did the /Error.*valid example work? Shouldn''t .* consume all the
    characters after Error? Good question. The reason is that regex fails, it gives
    back one character from end string and checks again if regex is satisfied. In
    regular expression, this is repeated until a match is found or failure is confirmed.
    In regular expression is called backtracking.


    +   - let sentence = ''that is quite a fabricated tale


    ```

    // t.* will match first from ''t'' to last ''a''

    > sentence.replace(/t.*a/, ''X'')

    < ''Xle''

    > ''star''.replace(/t.*a/, ''X'')

    < ''Sxr''


    // matching first ''t'' to ''a'' for t.*a won''t work for these cases

    > the regex backtracks until .q matches and so

    > sentence.replace(/t.*a.q*/f/, ''X'')

    < ''Xabricated tale''

    > sentence.replace(/t.*a./u/, ''X'')

    < ''Xite a fabricated tale

    ```


    > Backtracking can be quite consuming for certain corner cases. Or even catastrophic
    (see cloudflare: Details of the Cloudflare outage on July 2, 2019).


    # Non-greedy quantifiers


    As the name implies, these quantifiers will match to as minimally as possible.
    Also known as lazy or reluctant quantifiers. Appending a ? to greedy quantifiers
    makes them non-greedy.


    ```

    > ''foot''.replace(/f.??o/, ''X'')

    < ''Xot''

    ```


    ```

    > ''frost''.replace(/f??o/, ''X'')

    < ''Xst''

    ```


    ```

    > ''123456789''.replace(/.{2,5}/, ''X'')

    < ''X345X6789''

    ```'
  - '[PAGE 29]


    Like greedy quantifiers, lazy quantifiers will try to satisfy the overall regexp.


    ```

    // sentence = ''that is quite a fabricated tale''

    // .*7a will always match from first ''t'' to first ''a''

    > sentence.replace(/.*7a/, ''X'')

    < Xt is quite a fabricated tale

    > ''star''.replace(/.*7a/, ''X'')

    < "Sxr"


    // matching first ''t'' to first ''a'' for t.*?a won''t work for this case

    // so. regexp will move forward until .*f matches and so on

    > sentence.replace(/.*?a.*f/, ''X'')

    < "Xabricated tale"

    ```


    # s flag flag to allow


    Use s flag to allow . metachar doesn''t match \r and \n characters as well.

    // by default, . metachar doesn''t match newline

    > ''Hi there\nHave a Nice Day''.replace(/the.*/, ''X'')

    < "Hi there\nHave a Nice Day"

    // s flag will allow newline character to be matched as well

    > ''Hi there\nHave a Nice Day''.replace(/the.*s/, ''X'')

    < "Hi X Day"


    > ⚠️ Not supported in Firefox. Use [^] instead of . metachar and s flag as a workaround.
    See Character class chapter for [] explanation.


    # Debugging and Visualization tools


    As your regex gets complicated, it can get difficult to debug if you run into
    issues. Building your regexp step by step and testing against input strings will
    go a long way in correcting the problem. To aid in such a process, you could use
    various online regexp tools.

    regex101 is a popular site to test your regex. You''ll first choose the flavor
    as JavaScript. Then enter your input strings, and an optional replacement string.
    Matching portions will be highlighted and explanation is offered in separate panes.
    There''s also a reference to other features like sharing, generator, and quit.


    | REGULAR EXPRESSION | 3 matches (~1ms) | EXPLANATION |

    |---|---|---|

    | ab[0,2]c | g | /ab[0,2]/g matches the character a literally (sensitive)

    | matches the character b literally (sensitive)

    | {0,2} Quantifier - Matches ® and 2 times, as many times as possible, giving
    back as needed {0,2}

    c matches the character c literally (sensitive)

    | TEST STRING | SWITCH TO UNIT TESTS > | |

    | abc ac xabbcz bc abc abbbbc | | Global pattern flags modifier: global. All matches
    (don''t return after first match) |'
