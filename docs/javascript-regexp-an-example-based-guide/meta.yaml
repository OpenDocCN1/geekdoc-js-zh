  md: '# # Alternation and Grouping


    Many a times, you want to check if the input string matches more than one pattern.
    For example, whether a car color is *green* or *blue* or *red*. In programming
    terms, you need to perform OR conditional. This chapter will discuss various ways
    to build a single regexp to match an input string against multiple conditions.


    # ## OR conditional


    In a conditional expression, you can use the logical operators to combine multiple
    conditions. With regular expressions, the `|` metacharacter is similar to logical
    OR. In such cases, any of the expression separated by `|` is satisfied. Each of
    these alternatives is a full regexp. For example, anchors are specific to particular
    alternation.


    ```

    // match either ''cat'' or ''dog''

    > const pets = /cat|dog/

    > pets.test(''I like cats'')

    < true

    > pets.test(''I like dogs'')

    < true

    > pets.test(''I like parrots'')

    < false

    ```


    ```

    // replace either ''cat'' at start of string or ''cat'' at end of word

    > ''catapults concatenate cat scat''.replace(/^cat|\b/g, ''X'')

    < ''Xapults concatenate X X''

    ```


    ```

    // replace either ''cat'' or ''dog'' or ''fox'' with ''mammal''

    > ''cat dog parrot fox''.replace(/cat|dog|fox/g, ''mammal'')

    < ''mammal mammal parrot mammal''

    ```


    # ## Grouping


    Often, there are some common things among the regexp alternatives. It could be
    common characters or regexp qualifiers like the anchors. In such cases, you can
    group them using a pair of parentheses metacharacters. Similar to `a(b+c)d = abcd`
    in maths, you get `a(b|c)d = abd|acd` in regular expressions.


    ```

    // without grouping

    > ''red reform read arrest''.replace(/reform|rest/g, ''X'')

    < ''red X read X''

    ```


    ```

    // with grouping

    > ''red reform read arrest''.replace(/re(form|st)/g, ''X'')

    < ''red X read X''

    ```


    ```

    // without grouping

    > ''par space part party''.replace(/\bpar|\bpart/g, ''X'')

    < ''X spare X party''

    ```'
