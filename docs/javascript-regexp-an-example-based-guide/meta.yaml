  - "[PAGE 52]\n\nLookbehind isn't supported in Firefox. See this Q&A for a workaround.\n\
    \n# Positive lookarounds\n\nPositive lookaround syntax uses = similar to ! for\
    \ negative lookaround. The complete syntax looks like:\n\n+   - (?=pat) for positive\
    \ lookahead assertion\n- (?<=pat) for positive lookbehind assertion\n\n```\n//\
    \ edit digits if it is followed by \n// note that the end of string doesn't qualify\
    \ as this is positive assertion\n> '42 foo-5, ba23; x83, y-20; f12'.match(/\\\
    d+(?=,)/g)\n< \"5\", \"83\"\n// edit digits if it is preceded by - and by ; or\
    \ \n> '42 foo-5, ba23; x83, y-20; f12'.match(/(?<=\\)\\d+=[,])/g)\n< \"5\", \"\
    20\"\n```\n\n```\n// same as: match(/\\b\\w\\b').join('')\n> 'sea cat rat eel\
    \ tea'.replace(/(?<=\\b\\w)\\w*\\W*/g, ')\\n< \"secret\"\n```\n\nLookarounds are\
    \ quite handy in dealing with field based processing.\n\n```\n// except first\
    \ and last fields\n> '1,two,3,four,5'.match(/(?<=\\,)[^]+(?=,)/g)\n< \"two\",\
    \ \"3\", \"four\"\n```\n\n```\n// replace empty fields with NA\n// note that in\
    \ this example, order of lookbehind and lookahead doesn't match\n> '1,,two,3,'.replace(/(?<=\\\
    ^)[^]+($)/g, 'NA')\n< \"NA,1,NA,two,3,NA, NA\"\n// same thing with negative lookarounds\n\
    > '1,,two,3,'.replace(/(?<![,])[^]+)/g, 'NA')\n< \"NA,1,NA,two,3,NA, NA\"\n```\n\
    \n```\n// there is an extra empty string match at end of non-empty columns\n>\
    \ 'cat,tiger'.replace(/(?<=\\^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\n// lookarounds\
    \ to the rescue\n> 'cat,tiger'.replace(/(?<=\\^)[^]*/g, '${&}')\n< \"{},{cat},{tiger}\"\
    \n```\n\nEven though lookarounds are not part of matched portions, capture groups\
    \ can be used inside positive lookarounds.\n\n```\n> console.log('a b c d e').replace(/(\\\
    S+\\s+)(?=(\\S+\\s+))/g, '$1$2\\n')\n< a\n b\n c\n d\ne\n```"
  - '[PAGE 53]


    # AND conditional


    As promised earlier, here''s lookaround it simpler to construct AND conditionals.


    ```

    > let words = [''sequoia'', ''subtle'', ''questionable'', ''exhibit'', ''equation'']


    // words containing ''b'' and ''t'' in any order

    // same as: /b.*e.*t|t.*e.*b|e.*t.*b|t.*b./

    > words.filter(w => /(?=.*b)(?=.*t)/.test(w))

    < [''subtle'', ''questionable'', ''exhibit'']

    // words containing all vowels in any order

    > words.filter(w => /(?=.*a)(?=.*i)(?=.*o).*/.test(w))

    < [''sequoia'', ''questionable'', ''equation'']

    ```


    # Variable length lookbehind


    In some of the implementations of regular expressions, lookbehind doesn''t work
    if the pattern

    match varying number of characters. For example, (?<=\d+) is looking for behind

    foo by one or more digits. As I''ve tested on the console, there''s

    no restriction in JavaScript. Here are some examples that were tested.


    +   // positive lookbehind examples

    > ''=314not;21irk,3cool=42''.match(//(?=\d+)[a-z]+/g)

    < [''not'', ''cool'']

    // replace only 3rd occurrence of ''cat''

    > ''cat scatter cat''.replace(/(?<=(cat.*){2})cat/, ''X'')

    < ''cat scatter Xer scat''


    +   // negative lookbehind examples

    // match only if ''cat'' doesn''t occur before ''dog''

    > /(?<!<cat>).).test(''cat,dog,parrot'')

    < false

    // match only if ''parrot'' doesn''t occur before ''dog''

    > /(?<!.*parrot).).test(''cat,dog,parrot'')

    < true


    # Negated groupping


    You''ve seen a few cases where negated character class was useful than a positive
    set. For

    example, in field based processing, it needs to match the fields by creating a

    negated character set of the delimiter character. In a similar manner, there are
    cases where

    You need to negate a regexp pattern. This is made possible by using negative lookahead
    and

    ancing one character at a time as shown below.


    ```

    // cannot use /at(??!go)par/ as lookarounds do not consume characters

    > /at((?!go).*/test(''cat,dog,parrot'')

    < true

    > /at((?!do).*/test(''cat,dog,parrot'')\n< false

    ```'
