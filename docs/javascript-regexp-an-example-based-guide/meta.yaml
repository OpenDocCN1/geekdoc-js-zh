    \ 35 * 42 / num2 \"\n// space at start/end of string can be trimmed off\n// you'll\
    \ learn how to add a qualifier so that trim is not needed\n> 'foo_baz=num1+35*42/num2'.replace(/b/g,\
    \ ' ' ').trim()\n< \" foo_baz = num1 + 35 * 42 / num2 \"\n```\n\nThe word boundary\
    \ has no anchor too. \\B matches whenever \\b doesn't. This duality will be with\
    \ some other escape sequences. Negative logic is handy in many text processing\
    \ situations. But with it care what might end up touching things you didn't intend!\n\
    \n```\n// replace 'par' if it is not start of word\n> sample.replace(/\\Bpar,\
    \ 'X')\n< \"par sx apent Sxe part\"\n// replace 'par' at the end of word but not\
