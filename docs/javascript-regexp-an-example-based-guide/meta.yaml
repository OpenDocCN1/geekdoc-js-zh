    \n```\n\nHere's some standalone pattern usage to compare and contrast the two\
    \ anchors.\n\n```\n> 'copper'.replace(/b/g, ':')\n< \":copper:\"\n> 'copper'.replace(/\\\
    B/g, ':')\n< \"c:o:p:p:e:r\"\n> '-----hello-----'.replace(/\\b/g, ' ')\n< \" \
    \    hello ----\"\n> '------hello------'.replace(/\\B/g, ' ')\n< \"      - h e\
    \ l l o -      \"\n```\n\n# Cheatsheet and Summary\n\n| Note | Description |\n\
