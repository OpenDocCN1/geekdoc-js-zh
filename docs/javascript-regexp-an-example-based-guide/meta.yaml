  md: "# # Escaping metacharacters\n\nYou have seen a few metacharacters and escape\
    \ sequences that help to compose a RegExp literal. There's also the / character\
    \ used as a delimiter for RegExp objects. This chapter will discuss how to remove\
    \ the special meaning of such constructs. Also, you'll learn how to take care\
    \ of special characters when you are building a RegExp literal from normal strings.\n\
    \nTo match the metacharacters literally, i.e. to remove their special meaning,\
    \ prefix them with a \\. To indicate a literal \\ character, use \\\\.\n\n```\n\
    // even though ^ is not used as anchor, it won't be matched literally\n> /b2/.test('a2\
    \ + b2 - C3*)\n< false\n// escape will work\n< /b2/.test('a2 + b2 - C3*)\n< true\n\
    \n// '(a*b) + c'.replace(/\\(\\\\)/g, '')\n< \"a*b\" + c\"\n\n// '//learn/by\\\
    \\example'.replace(/\\\\\\\\/g, '')\n< \"/learn/by/example\"\n```\n\n# ## Dynamically\
    \ escaping metacharacters\n\nWhen you are defining the regex yourself, you can\
    \ manually escape the metacharacters where needed. However, if you have strings\
    \ from elsewhere and need to match the contents literally, you'll have to somehow\
    \ escape all the metacharacters while constructing the regex. The solution of\
    \ course is to use regular expressions! The programming language itself would\
    \ provide an in-built method for such cases. JavaScript doesn't, MDN: Regular\
    \ Expressions doc has covered it in the form of a function shown below.\n\n```\n\
    > function escapeRegExp(string) {\n  return string.replace(/\\.*+?^\\$}()|[\\\
    [\\]/g, '\\$&');\n}\n```\n\nThere are many other things about regex that you've\
    \ learned yet. They will be discussed in coming chapters. For now, it is enough\
    \ to know that this function will accurately all the metacharacters. Examples\
    \ are shown below.\n\n```\n// sample input on which regex will be applied\n//\
    \ let eq = 'f(a*b) - 3*(a*b)'\n// sample string obtained from elsewhere where\
    \ needs to be matched literally\n// const usr_str = '(a*b)'\n\n// case 1: replace\
    \ all matches\n// escaping metacharacters using 'escapeRegExp' function\n// const\
    \ pat = new RegExp(escapeRegExp(usr_str), 'g')\n// pat\n// /(a\\*b)/g\n```"
