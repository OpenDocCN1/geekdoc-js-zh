    # Working with matched portions


    Having seen a few regexp features that can match varying text, you''ll learn how
    to extract and work with matching portions in this chapter.


    # match method


    The match method can be used in different ways. When g flag isn''t used and the
    regexp succeeds, you get an array object containing various details of the first
    matching portion.


    ```

    // note that ''g'' flag isn''t used

    > ''abc ac adc abc''.match(/abc/)

    < ["abc", index: 0, input: "abc ac adc abc", groups: undefined]


    // to get only the matching portion

    > ''abc ac adc abc''.match(/abc/)[0]

    < ''abc''


    // non-regexp object will get processed as: RegExp(object)

    > ''abc ac adc abc''.match(''abc'')

    < ["abc", index: 0, input: "abc ac adc abc", groups: undefined]

    ```


    The index property gives the location of matched portion. If the regexp fails,
    the output is null and not an empty array. The groups property will be discussed
    in Named capture sections. See MDN: match for more details and examples.


    ```

    > let s1 = "cat and dog"


    > s1.match(/dog/).index

    < 8

    > s1.match(/dog/).input

    < "cat and dog"


    > s1.match(/xyz/)

    < null

    ```


    # search method


    The search method gives the index of first matching portion. If the regexp fails,
    it returns -1 as output.


    ```

    // same as: match(/dog/).index

    > ''cat and dog''.search(/dog/)

    < 8


    // cannot use match(/xyz/).index here

    // as ''match'' returns ''null'' if regexp doesn''t match

    > ''cat and dog''.search(/xyz/)

    < -1

    ```'
  - "[PAGE 34]\n\n# Capture groups\n\nThe regexp grouping inside {} is also known\
    \ as a capture group. It has multiple uses, one of which is to work with matched\
    \ portions of those groups. When capture groups are used with match method, the\
    \ matched portions of those groups will also be part of the array output. The\
    \ first element is the element matched followed by portions of capture groups.\
    \ The leftmost will get group 1, second leftmost will get group number 2 and so\
    \ on.\n\n```\n// there are two capture groups used here\n> 'abc ac dc abbc'.match(/(.*)d(.*)/\n\
    < [\"abc ac dc a\", \"bc ac\", \"c a\", index: 0,\n  input: \"abc ac dc abbc\"\
    , groups: undefined]\n```\n\n```\n// matched portion\n> 'abc ac dc abbc'.match(/(.*)d(.*)/[0]\n\
    < \"abc ac dc a\"\n```\n\n```\n// capture group portions\n> 'abc ac dc abbc'.match(/(.*)d(.*)/)[1]\n\
    < \"bc ac a\"\n> 'abc ac dc abbc'.match(/(.*)d(.*)/)[2]\n< \"c a\"\n```\n\n# Getting\
    \ all matched portions\n\nThe match method returns all matched portions when the\
    \ g flag is used. Capture group portions and the three properties won't be part\
    \ of the output.\n\n```\n> 'abc ac dc abbc'.match(/ab/c/g)\n< [\"abc\", \"ac\"\
    , \"abbc\"]\n```\n\n```\n> 'abc ac dc abbc'.match(/ab+c/g)\n< [\"abc\", \"abbc\"\
    ]\n```\n\n```\n> 'par spar aparent spare part'.match(/\\bs?pare=\\b/g)\n< [\"\
    par\", \"spar\", \"spare\"]\n```\n\n```\n// entire matching portion is returned\
    \ even if capture group is used\n> 'par spar aparent spare part'.match(/\\bs?pare=(t|)\\\
    b/g)\n< [\"spare\", \"part\"]\n```\n\nIt is useful for debugging purposes well,\
    \ for example, to see what is going under the hood using replace method.\n\n```\n\
    > 'that is quite a fabricated tale'.match(/t.*a/g)\n< [\"that is quite a fabricated\
    \ ta\"\n```\n\n```\n> 'that is quite a fabricated tale'.match(/t?a/g)\n< [\"tha\"\
    , \"t is quite a\", \"ted ta\"]\n```"
