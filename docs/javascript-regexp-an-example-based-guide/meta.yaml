    # Precedence rules


    There''s some tricky situations when using alternation. If it is used for testing
    a match to get true/false against a string input, there is no ambiguity. However,
    for other things like string replacement without g flag, it depends on a few factors.
    Say, you want to replace either are spared — which one should get precedence?
    The bigger word spared or the substring are inside or by something else?


    The regex overlap matches earliest in the input string gets precedence.


    ```

    // let words = ''lion elephant are rope not''

    // starting index of ''on'' index of ''ant'' for given string input

    // so ''on'' will be replaced inrespective order of alternations

    > words.replace(/[on]ant/, ''X'')

    < ''LIX elephant are rope not''

    > words.replace(/[ant]on/, ''X'')

    < ''LIX elephant are rope not''

    ```


    So, what happens if two or more alternations match on same index? The precedence
    is then left to right in the order of declaration.


    ```

    // let mood = ''best years''

    // starting index of ''year'' and ''years'' will always be same

    // so, which one gets depends on the order of alternations

    > mood.replace(/year|years/, ''X'')

    < ''best X''

    > mood.replace(/years|year/, ''X'')

    < ''best X''

    ```


    Another example with replace to drive home the issue.


    ```

    // let sample = ''ear xerox at mare part learn eye''

    // this is going to be as same: replace(/ar|are|art)/g, ''X'')

    > sample.replace(/ar|are|art/g, ''X'')

    < ''eX xerox at mX part leXn eye''

    // this is going to be as same: replace(/are|ar|art/g, ''X'')

    > sample.replace(/are|ar|art/g, ''X'')

    < ''eX xerox at mX PXe leXn eye''

    // phew, finally this one works as expected

    ```'
