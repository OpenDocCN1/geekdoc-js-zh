  md: '# # Unicode


    So far in the book, all examples were meant for strings made up of ASCII characters.
    A few years back would have been sufficient for most of the use cases. These days
    it would be rare to encounter ASCII only project. This chapter will discuss discuss
    matching.


    # ## Unicode character sets and u flag


    Similar escape sequence character sets, the \p{ construct various predefined sets
    to work with unicode. For negated sets, use \P{}. You''ll need to set the u flag.


    ```

    // extract all consecutive letters

    > ''fox:αλεποῦ,eagle:αετóc''.match(\pL+/gu)

    < ["fox", "αλεποῦ", "eagle", "αετό"]

    ```


    ```

    // delete all characters other than letters

    > \u00f2,ß 4.foo.replace(/\pL+/gu, '''')

    < [\u00f8foo]

    ```


    ```

    // extract words not surrounded by punctuation marks

    > ''tie, ink est;''.match(/(?<=\p)\b\w+(?=\p)/)/gu)

    < ["ink"]

    ```


    > See MDN: Unicode property escapes for more details and list of \p{} sets. Also
    see regular-expressions: unicode for an overview of challenges with unicode matching.


    # ## Codepoints


    You can use codepoints \u{} to specify unicode characters. This is similar to
    how we use \x for hexadecimal from string


    ```

    // to get codepoints from hexadecimal

    > Array.from(''fox:αλεποῦ'', c => c.codePointAt().toString(16))

    < ["66", "6f", "78", "3a", "3b1", "3bb", "3b5", "3c0", "3bf", "3cd"]

    ```


    ```

    // use codepoint to represent a character

    > \u3b1

    < ["α"]

    ```


    ```

    // range for lowercase alphabets using \u{}

    // note that \u{} will work with ''u'' flag only

    ```


    ```

    > ''fox:αλεποῦ,eagle:αετóc''.match(/\u{61}-\u{7a}]/gu)

    < ["fox", "eagle"]

    ```


    > See stackoverflow: Unicode string to hex.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Cheatsheet and Summary


    | Note | Description |

    | --- | --- |

    | u | flag to enable unicode matching |

    | \p{} | Unicode character sets |

    | \{} | negated unicode character sets see MDN: Unicode property escapes for details
    |

    | \u{} | specify unicode characters using codepoints |


    A comprehensive discussion on regex usage with Unicode characters is out of scope
    for this book. Resources like regular-expressions: unicode and Programmers introduction
    to Unicode are recommended for further study.


    # Exercises


    **a) Check if input strings are made up of ASCII characters only. Consider the
    input to be non-empty strings and any character that is not 7-bit ASCII should
    result in false output.


    ```

    let str1 = ''123 456''

    let str2 = ''good food''

    let str3 = ''happy learning!''


    const pl = // add your solution here


    pl.test(str1)

    false

    pl.test(str2)

    false

    pl.test(str3)

    true

    ```


    **b) Retain only punctuation characters for the given string.


    ```

    let s1 = ''(a)(1)(b)(2){c}(3){xyz}{123}[[]](like)\{3.14\''


    s1.replace(// // add your solution here

    ''()\()\)\{\{\}\[\]\{.\}'', '''')

    ```


    **c) Is the following code snippet showing the correct output?",


    ```

    ''fox:αλεπού''.match(/\w+/g)

    ["fox'']

    ```'
