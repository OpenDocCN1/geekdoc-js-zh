  md: "# Capture groups\n\nThe regexp grouping inside {} is also known as a capture\
    \ group. It has multiple uses, one of which is to work with matched portions of\
    \ those groups. When capture groups are used with match method, the matched portions\
    \ of those groups will also be part of the array output. The first element is\
    \ the element matched followed by portions of capture groups. The leftmost will\
    \ get group 1, second leftmost will get group number 2 and so on.\n\n```\n// there\
    \ are two capture groups used here\n> 'abc ac dc abbc'.match(/(.*)d(.*)/\n< [\"\
    abc ac dc a\", \"bc ac\", \"c a\", index: 0,\n  input: \"abc ac dc abbc\", groups:\
    \ undefined]\n```\n\n```\n// matched portion\n> 'abc ac dc abbc'.match(/(.*)d(.*)/[0]\n\
    < \"abc ac dc a\"\n```\n\n```\n// capture group portions\n> 'abc ac dc abbc'.match(/(.*)d(.*)/)[1]\n\
    < \"bc ac a\"\n> 'abc ac dc abbc'.match(/(.*)d(.*)/)[2]\n< \"c a\"\n```\n\n# Getting\
    \ all matched portions\n\nThe match method returns all matched portions when the\
    \ g flag is used. Capture group portions and the three properties won't be part\
    \ of the output.\n\n```\n> 'abc ac dc abbc'.match(/ab/c/g)\n< [\"abc\", \"ac\"\
    , \"abbc\"]\n```\n\n```\n> 'abc ac dc abbc'.match(/ab+c/g)\n< [\"abc\", \"abbc\"\
    ]\n```\n\n```\n> 'par spar aparent spare part'.match(/\\bs?pare=\\b/g)\n< [\"\
    par\", \"spar\", \"spare\"]\n```\n\n```\n// entire matching portion is returned\
    \ even if capture group is used\n> 'par spar aparent spare part'.match(/\\bs?pare=(t|)\\\
    b/g)\n< [\"spare\", \"part\"]\n```\n\nIt is useful for debugging purposes well,\
    \ for example, to see what is going under the hood using replace method.\n\n```\n\
    > 'that is quite a fabricated tale'.match(/t.*a/g)\n< [\"that is quite a fabricated\
    \ ta\"\n```\n\n```\n> 'that is quite a fabricated tale'.match(/t?a/g)\n< [\"tha\"\
    , \"t is quite a\", \"ted ta\"]\n```"
  merge: -1
  pgno: 34
