- md: "\nThe workaround is simpler in regex definition. The \\0 prefix trick doesn't\
    \ work, but using ASCII code with \\xh works. For example, \\1x3 will refer to\
    \ 1 capture group followed by 1 as a character.\n\n```javascript\n> 'abcdefghijklmnld'.replace(/(\\\
    .).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).(\\.).*\\x31/, 'X')\n < 'Xd'\n```\n\
    \n## Non-capturing groups\n\nGrouping has many uses like applying a regex portion,\
    \ creating terse expressions by factoring common portions and so on. It also affects\
    \ the output of split method.\n\n```javascript\n// without capture group\n > 'Sample123string42with77numbers'.split(/\\\
    d+/)\n < [\"Sample\", \"string\", \"with\", \"numbers\"]\n```\n\n```javascript\n\
    // use capture group to include the part that was split as well\n > 'Sample123string42with77numbers'.split(/(\\\
    d+)/)\n < [\"Sample\", \"123\", \"string\", \"42\", \"with\", \"777\", \"numbers\"\
    ]\n```\n\n```javascript\n// unlike methods in other languages, match with \\g\
    \ flag\n // isn't affected by capture groups and returns matched portions\n >\
    \ 'effort flee oddball tool'.match(/(\\b\\w+\\w)\\1\\b)/g)\n < [\"effort\", \"\
    flee\", \"tool\"]\n```\n\nWhen backreferencing is not required, you can use a\
    \ non-capturing group to avoid change of split method. It also helps to keep track\
    \ of capture groups when that particular group is not needed for backreferencing.\
    \ The syntax is (?:) to define a pattern. More special groups starting with (?:)\
    \ syntax will be discussed later.\n\n```javascript\n// here, grouping is needed\
    \ to take out common portion and apply quantifier\n // but using capture group\
    \ will not be the expected output\n > '123hand42hand777hand150'.split(/(hand(y|ful)?)/)\n\
    \ < [\"123\", undefined, \"42\", \"y\", \"777\", \"ful\", \"150\"]\n```\n\n```javascript\n\
    // non-capturing group to leave the rescue\n > '123hand42hand777hand150'.split(/(?:y|ful)?)\n\
    \ < [\"123hand\", \"42hand\", \"777hand1100\n```\n```\n\njavascript\n// with normal\
    \ grouping, to keep track of all the groups\n > '1,2,3,4,5,6,7'.replace(/([^,]+),([^,]+)/,\
    \ '$1($2)')\n < [\"1(2),3(4),5,67\"]\n```\n\n```javascript\n// using non-capturing\
    \ groups, only relevant groups have to be tracked\n > '1,2,3,4,5,6,7'.replace(/((?:[^,]+)),([^,]+)/,\
    \ '$1($2)')\n < [\"1(2),3(4),5,67\"]\n```\n\nReferring to text matched by capture\
    \ group with a quantifier will only give the last match, not entire match. Use\
    \ a capture group around the grouping and quantifier to get the entire matching\
    \ portion. In such cases, the inner group is an ideal candidate to use-non-capturing\
    \ group.\n\n```javascript\n// '$1' here contains only the fourth field\n> 'so:cat:rest:in:put:to'.replace(/([^:]+){4}/,\
    \ '$1')\n< \"(in):put:to\"\n\n// '$1' will now contain the matching portion\n\
    > 'so:cat:rest:in:put:to'.replace(/((?:[^:]+){4})/, '$1')\n< \"(so:cat:rest:in):put:to\"\
    \n```\n\n## Named capture groups\n\nRegexp can get cryptic and difficult to maintain,\
    \ even for seasoned programmers. There are a few constructs to help clarity. One\
    \ such is naming the capture groups and using name for backreferencing instead\
    \ of plain numbers. The syntax is `<name>pat` for naming the capture groups, `\\\
    <name>` for backreferencing in regexp definition and `$name` in replacement section.\n\
    \n```javascript\nlet row = '2018-03-24,food,2018-03-24,2018-10-25,56322'\n// same\
    \ as: /(\\d(4)-\\d(2)-\\d(2))*1/\nrow.match(/(?<date>\\d(4)-\\d(2)-\\d(2))*\\\
    k<date>)/[0]\n'<2018-03-24,food,2018-03-24'\n```\n\n```javascript\n// giving names\
    \ to first and second captured words\n// same as: replace(/(\\w+),(\\w+)/, '$2,$1')\n\
    'good,bad,42,24'.replace(/(?<fw=\\w+),(?<sw=\\w+)/, '$sw,$fw')\n'<bad,good24'\n\
    ```\n\nNamed capture groups are also accessible via the groups property.\n\n```javascript\n\
    let m = '2018-10-25,car'.match(/(?<date>[^,]+),(?<product>[^,]+)/)\n\nm.groups\n\
    {date: '2018-10-25', product: 'car'}\nm.date\n'2018-10-25'\nm.groups.product\n\
    'car'\n```\n\n## Cheatsheet and Summary\n\n| Note | Description |\n|---|---|\n\
    | Backreference | gives matched portion of N capture group, use $1, $2, $3, etc\
