    ## Further Reading


    ## Preface


    Scripting and automation tasks often need to extract particular portions of text
    from input data or modify them from one format to another. This book will help
    you learn Regular Expressions as implemented in JavaScript. Regular expressions
    can be considered as mini-programming language in itself and is well suited for
    variety of text processing needs.


    The book heavily leans on examples to present features of regular expressions
    one by one. It is recommended that you manually type each example and experiment
    with them. Understanding the nature of sample input and the output produced is
    essential. As an analogy, consider learning to drive a bike or a car — no matter
    how much you read about them or listen to explanations, you need to practice a
    lot and infer your own conclusions. Should you feel that, code snippets are available
    chapter-wise on GitHub.


    ## Prerequisites


    A good understanding of basic-level programming concepts and prior experience
    working with JavaScript. Should also know functional programming concepts like
    map and filter.


    ## Conventions


    - The examples presented here have been tested on Chrome/Chromium console (version
    78+) and includes features not available in other browsers and platforms.

    - Code snippets shown are copy-pasted from console and modified for presentation
    purposes. Some commands are preceded by comments to provide context and explanations.
    Blank lines have been added to improve readability and output is skipped when
    it is undefined or unnecessary to be shown.

    - Unless otherwise noted, all examples and explanations are meant for ASCII characters.

    - External links are provided for further reading throughout the book. Not necessary
    to immediately visit them. They have been chosen with care and would help, especially
    during regards.

    - The js_regex repo has all the code snippets and exercises and other details
    related to the book. Click the Clone or download button to get the files.


    ## Acknowledgements


    - MDN: Regular Expressions — documentation and examples

    - stackoverflow — for answering pertinent questions on JavaScript and regular
    expressions

    - tex.stackoverflow — for help pandoc and tex related questions

    - Cover image: LibreOffice Draw and reglex

    - Warning and Info icons by Amada44 under public domain


