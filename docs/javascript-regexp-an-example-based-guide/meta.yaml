    \n包含在 [] 内部的字符将导致匹配其中的任何一个字符。这类似于使用单次分支，但没有捕获组的额外影响。此外，字符类有它们自己的元字符版本，并为常见用例提供了集合。量词适用于字符类，如：\n\
    \n```javascript\n// 包含在 [] 内部的字符\n```\n\n## 字符类元字符\n\n字符类可以简洁地定义集合。在字符类之外，如 $\
