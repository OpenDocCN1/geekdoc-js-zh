    > demo.filter(w => /ab{2}/.test(w))

    < "abc", "ac", "abbc"

    ```


    ```

    > demo.filter(w => /ab{3}c/.test(w))

    < "xabbbcz", "abbbbbc"

    ```


    ```

    > demo.filter(w => /ab{3}c/.test(w))

    < "xabbbcz"

    ```


    > The { metacharacters must be escaped to match them literally. However, unlike
    {n} metacharacters, they have more leeway. For example, escaping { } is enough,
    or if it doesn''t conform to any of the forms listed, escaping is not needed at
    all.


    Next, how to construct AND conditional using dot metacharacter and quantifiers.


    ```

    // match ''Error'' followed by zero or more characters followed by ''valid''

    > /Error.*valid/.test(Error: not a valid input)

    < true

    ```


    ```

    > /Error.valid/.test(Error: key not found)

    < false

    ```


    To allow matching in any order, you would have to bring in all as well. That is
    somewhat manageable for 2 or patterns. Lookarounds provide a comparatively easier
    approach.


    ```

    > /cat.dog|dog.cat/.test(cat and dog)

    < true

    > /cat.dog|dog.cat/.test(dog and cat)

    < true

    ```


    ```

    // if you need true/false result, this would be a scalable approach

    > let patterns = [/cat/, /dog/]

    > patterns.every(p => p.test(cat and dog))

    < true

    > patterns.every(p => p.test(dog and cat))\n< true

    ```


    So, how do these greedy quantifiers match? When are you using ? how does JavaScript
    decide to match 0 or 1 times, if both quantities satisfy the regex fo? For example,
    consider ''foot''.replace(/f.o/, ''X'') — should be replaced or fo? It will always
    replace foo, because there are greedy quantifiers.'
