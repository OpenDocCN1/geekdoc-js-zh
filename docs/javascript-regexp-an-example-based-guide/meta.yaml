    # Dot metacharacter and Quantifiers


    This chapter introduces several more metacharacters. Similar to the repeat string
    method, quantifiers allow to repeat a portion of regular expression pattern and
    thus make it compact and improve readability. Quantifiers can also be specified
    as both bounded and unbounded ranges matching varying quantities of the pattern.
    Previously, you used alternation to construct OR conditional. Adding dot metacharacter
    and quantifiers to the mix, you can construct AND conditional.


    # Dot metacharacter


    The dot metacharacter serves as a placeholder to match any character except \
    and \n. The s flag section will show how to include those characters as well.


    ```javascript

    // matches ''c'', any character and then character ''t''

    ''tac cat abc;tuv acute''.replace(/c.t/g, ''X'')

    // "taxin X abuv axe"

    ```


    ```javascript

    // matches ''r'', any two characters and then character ''d''

    ''bread markedly reported overrides''.replace(/r./d/g, ''X'')

    // "bth maxly repo ovexes"

    ```


    ```javascript

    // matches ''2'', any character and then character ''3''

    ''42t33''.replace(/2./g, ''8'')

    // "483"

    ```


    # Greedy quantifiers


    Quantifiers help you to repeat a portion of regex. They can be applied to literal
    characters, groupings and features that you will learn. Apart from to specify
    exact quantity and bounded range, these can also match unbounded varying quantities.
    If the input string can satisfy a pattern with varying quantities in multiple
    ways, you can choose among two types of greedy type of quantifiers is covered.


    First up, the ? metacharacter quantifies any character or group to match 0 or
    1 times. This helps to define optimal patterns and build terse regexes.


    ```javascript

    // as: /ear/g

    ''far feat fear''.replace(/etar/g, ''X'')

    // "FX feat flxe fx*"

    ```


    ```javascript

    // as: /bbar(t|)\b/

    ''spare part party''.replace(/\bpart/g, ''X'')

    // "X spare party"

    ```


    ```javascript

    // as: /red|dev|\b/

    [''red'', ''ready'', ''redo'', ''reed''].filter(w => /bre??d\b/.test(w))

    // ["red", "red", "reed"]

    ```


    ```javascript

    // same as: /part|parrot/g

    ''par part parrot parent''.replace(/par(ro)?t/g, ''X'')

    // "par X parent"

    // same as: /part|parrot/g

    ''par part parrot parent''.replace(/par(en)?t/g, ''X'')

    // "par X X"

    ```


    The * metacharacter quantifies a character or group to match 0 or more times.
    There is no upper bound, more details will be discussed later in this section.


    ```javascript

    // match ''t'' followed by zero or more of ''a'' followed by ''r''

    ''tr tear tear steer sitara''.replace(/ta*r/g, ''X'')

    // "X X Xe steer siX"

    ```


    ```javascript

    // match ''t'' followed by zero or more of ''e'' or ''a'' followed by ''r''

    ''tr tear tear steer sitara''.replace(/t(e|a)*/r/g, ''X'')

    // "X X Xe siX"

    ```


    ```javascript

    // match ''2'', any character and then character ''3''

    ''42t33''.replace(/2./g, ''8'')

    // "483"

    ```


    ```javascript

    // match zero or more of ''1'' followed by ''2''

    ''3111111125''.replace(/12/g, ''X'')

    // "3X511142"

    ```


    The split method separates the string based on pattern and returns array of strings.
    Non-capturing groups if you need the string separated by pattern as well.


    ```javascript

    // last element is empty because there is nothing after ''2'' at end of string

    ''3111111125''.split(/1/)

    // ["3", "5", "2"]

    ```


    ```javascript

    // note how ''2'' and ''4'' gets split, there is ''1'' between them

    ''3111111125''.split(/1/)

    // ["3", "5", "42"]

    ```


    The + metacharacter quantifies a character or group to match 1 or more times.
    To quantify, there is no upper bound. More importantly, this doesn''t have empty
    string.


    ```javascript

    ''tr tear steer sitara''.replace(/ta+r/g, ''X'')

    // "tr X X siX"

    ''tr tear steer sitara''.replace(/t(e|a)+/r, ''X'')

    // "tr X X siX"

    ```


    ```javascript

    ''3111111125''.replace(/1+/g, ''X'')

    // "3X511142"

    ''3111111125''.split(/1+/)

    // ["3", "42"]

    ```


    You can specify range of integer numbers, both bounded and unbounded, using {}
    metacharacters. There are three ways to use this quantifier listed below.


    | Pattern | Description |

    |---|---|

    | {m,n} | match m to n times |

    | {m,} | match at least m times |

    | {n} | match exactly n times |


    ```javascript

    let demo = [''abc'', ''ac'', ''abbc'', ''xabbcz'', ''bc'', ''abbbc'']

    ```


    ```javascript

    demo.filter(w => /ab/c/.test(w))

    // ["abc", "abbc", "xabbcz"]

    demo.filter(w => /ab{2}/.test(w))

    // ["abc", "ac", "abbc"]

    ```


    ```javascript

    demo.filter(w => /ab{3}c/.test(w))

    // ["xabbcz", "abbbc"]

    ```


    > The { } metacharacters must be escaped to match them literally. However, unlike
    {n} metacharacters, they have more leeway. For example, escaping {} is enough,
    or if it doesn''t conform to any of the forms listed, escaping is not needed at
    all.


    Next, how to construct AND conditional using dot metacharacter and quantifiers.


    ```javascript

    // match ''Error'' followed by zero or more characters followed by ''valid''

    /Error.*valid/.test(Error: not a valid input)

    // true

    ```


    ```javascript

    /Error.valid/.test(Error: not found)

    // false

    ```


    To allow matching in any order, you would have to bring in all as well. That is
    somewhat manageable for 2 or patterns. Lookarounds provide a comparatively easier
    approach.


    ```javascript

    /cat.dog|dog.cat/.test(cat and dog)

    // true

    /cat.dog|dog.cat/.test(dog and cat)

    // true

    ```


    ```javascript

    // if you need true/false result, this would be a scalable approach

    let patterns = [/cat/, /dog/]

    patterns.every(p => p.test(cat and dog))

    // true

    patterns.every(p => p.test(dog and cat))

    // true

    ```


    So, how do these greedy quantifiers match? When are you using ? does JavaScript
    decide to match 0 or 1 times, if both quantities satisfy the regex? For example,
    consider ''foot''.replace(/f.o/, ''X'') — should be replaced or not? It will always
    replace foo, because there are greedy quantifiers.


    ```javascript

    ''foot''.replace(/f\.o/, ''X'')

    // ''Xt''


    // a more practical example

    // prefix ''<'' with ''\'' if it is not already prefixed

    console.log(blah foo < baz).replace(/\\?/, ''\\''))

    // "blah < foo < bar \ baz"


    // say goodbye to /handful|hand/shen

    '' hand handy handful''.replace(/hand(y|ful)?/g, ''X'')

    // X X X

    ```


    But wait, how did the /Error.*valid example work? Shouldn''t .* consume all the
    characters after Error? Good question. The reason is that regex fails, it gives
    back one character from end string and checks again if regex is satisfied. In
    regular expression, this is repeated until a match is found or failure is confirmed.
    In regular expression is called backtracking.


    ```javascript

    let sentence = ''that is quite a fabricated tale''

    ```


    ```javascript

    // t.* will match first from ''t'' to ''a''

    sentence.replace(/.*a/, ''X'')

    // "Xt is quite a fabricated tale"

    ''star''.replace(/.*a/, ''X'')

    // "Sxr"

    ```


    # Non-greedy quantifiers


    As the name implies, these quantifiers will match minimally as possible. Also
    known as reluctant quantifiers. Appending a ? to quantifiers makes them non-greedy.


    ```javascript

    ''foot''.replace(/f.??o/, ''X'')

    // ''fot''

    ```


    ```javascript

    ''frost''.replace(/f??o/, ''X'')

    // ''Xst''

    ```


    ```javascript

    ''123456789''.replace(.{2,5}/, ''X'')

    // ''12345X789''

    ```


    Like greedy quantifiers, lazy quantifiers will try to satisfy the overall.


    ```javascript

    // sentence = ''that is quite a fabricated tale''

    // .*a will match from first ''t'' to ''a''

    sentence.replace(/.*?a/, ''X'')

    // "that is quite a fabricated tale"

    ```


    ```javascript

    let demo = [''abc'', ''ac'', ''abbc'', ''xabbcz'', ''bc'', ''abbbc'']


    demo.filter(w => /ab.*?c/.test(w))

    // ["abc", "abbc", "xabbcz"]

    demo.filter(w => /ab{2}/.test(w))

    // ["abc", "ac", "abbc"]

    ```


    ```javascript

    demo.filter(w => /ab{3}c/.test(w))

    // ["xabbcz", "abbbc"]

    ```


    # s flag to allow


    Use s flag to allow . doesn''t match \r and \n characters as well.

    // by default, . doesn''t match newline

    ''Hi there\nHave a Nice Day''.replace(/the.*/, ''X'')

    // "Hi there\nXax Day"

    // s flag will allow newline character to be matched as well

    ''Hi there\nHave a Nice Day''.replace(/the.*s/, ''X'')

    // "Hi X Day"


    # Debugging and Visualization tools


    As your regex gets complicated, it can get difficult to debug if you run into
    issues. Building your regexp step by step and testing against input strings will
    go a way in correcting the problem. To aid in such a process, you could use various
    online regexp tools.

    regex101 is a popular site to test your regex. You''ll first choose the flavor
    as JavaScript. Then enter your input strings, and an optional replacement string.
    Matching portions will be highlighted and explanation is offered in separate panes.
    There''s also a reference to other features like sharing, generator, and quit.


    | REGULAR EXPRESSION | 3 matches (~1ms) | EXPLANATION |

    |---|---|---|

    | ab[0,2]c | g | /ab[0,2]/g matches the character a literally (sensitive) |

    | matches the character b literally (sensitive) |

    | {0,2} Quantifier - Matches ® and 2 times, as many times as possible, giving
    back as needed {0,2} |

    | c matches the character c literally (sensitive) |

    | TEST STRING | SWITCH TO UNIT TESTS > | |

    | abc ac xabbcz bc abc abbbbc | | Global pattern flags modifier: global. All matches
    (don''t return after first match) |

