    \ new RegExp(p3.source + '|cat', 'g')\n\n> p4\n< /\\b|cat/g\n> console.log(p4.source)\n\
    < \\b|cat\n> p4.flags\n> \"g\"\n```\n\n```javascript\n> 'cater cat concatenate\
    \ far spare'.replace(p4, 'X')\n> \"Xer X Xenate X spare\"\n```\n\n# Escaping delimiter\n\
    \nAnother character to keep track for escaping the delimiter used to define the\
