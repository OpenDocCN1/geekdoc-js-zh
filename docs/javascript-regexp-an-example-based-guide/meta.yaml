  md: '# Anchors


    In this chapter, you''ll be learning about qualifying a pattern. Instead of matching
    anywhere in the given input string, restrictions can be specified. For now, you''ll
    see the ones that are already part of regular expression features. In later chapters,
    you''ll learn how to define your own rules for restriction.


    These restrictions are made possible by assigning special meaning to certain characters
    and escape sequences. The characters with special meaning are known as metacharacters
    in regexp parse. In case you need to match those characters literally, you need
    to escape them with a \ (discussed in Escaping metacharacters chapter).


    # String anchors


    This restriction is about qualifying a regexp to match at start or end of an input
    string. These provide functionality similarity to the string methods startsWith
    and endsWith . First is up ^ metacharacter, which restricts the matching to the
    start of string.


    ```

    // ^ is a prefix to the pattern

    /^cat/.test(''cater'')

    < true

    /cat/.test(''concatenation'')

    < false

    ```


    ```

    /hi/.test(''hi hello\ntop spot'')

    < true

    /top/.test(''hi hello\ntop spot'')

    < false

    ```


    To restrict the match to the end of the string, $ metacharacter is used.


    ```

    // $ is a suffix to the pattern

    /ares/.test(''spare'')

    < true

    /ares/.test(''nearest'')

    < false

    ```


    ```

    let words = [''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'', ''eel'',
    ''pest'']

    words.filter(w => /$/.test(w))

    < [''surrender'', ''newer'']

    words.filter(w => /$/.test(w))

    < [''pest'']

    ```


    Combining both the start and end anchors, you can restrict the matching to the
    whole string. Similar to comparing strings using the == operator.


    ```

    /^cat$/.test(''cat'')

    < true

    /^cat$/.test(''cater'')

    < false

    ```'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The anchors can be used by themselves as a pattern. Helps to insert text at
    the start or end of string, emulating string concatenation operations. These might
    not feel like useful capability, but combined with other regex they become quite
    a handy tool.


    ```

    > ''live''.replace(/\/, ''re'')

    < ''relive''

    > ''send''.replace(/\/, ''re'')

    < ''resend''


    > ''cat''.replace(/$, ''er'')

    < ''cater''

    > ''hack''.replace(/\$, ''er'')

    < ''hacker''

    ```


    # Line anchors


    A string input may contain single or multiple lines. The newline character \n
    is used as the line separator. The \m flag is used, and \$ anchors will match
    the start and end of any line respectively.


    ```

    // check if any line in the string starts with ''top''

    > /^top/m.test(hi hellontop spot)

    < true


    // check if any line in the string ends with ''er''

    > /er$/m.test(spare\npar\nera\ndare)

    < false


    // check if any line complete in the string is ''par''

    > /^par$/m.test(spare\npar\nera\ndare)

    < true

    ```


    Just like anchors, you can use the anchors by themselves as a pattern.


    ```

    > let items = ''catapults\nconcatenate\ncat''


    > console.log(items.replace(/^\/gm, ''* ''))

    * catapults

    * concatenate

    * cat


    > console.log(items.replace(/\$/gm, ''.''))

    < catapults.

    concatenate.

    cat.

    ```


    > If there is a newline character at the end of string, there is an additional
    start/end of line match after the newline.


    ```

    // ''foo '' is inserted three times

    > ''1\n2\n''.replace(/^\/mg, ''foo '')

    ```'
