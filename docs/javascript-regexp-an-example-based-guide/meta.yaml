    hi there\n42\nbye\n\n## Working with matched portions\n\nHaving seen a few regexp\
    \ features that can match varying text, you'll learn how to extract and work with\
    \ matching portions in this chapter.\n\n## match method\n\nThe match method can\
    \ be used in different ways. When g flag isn't used and the regexp succeeds, you\
    \ get an array containing details of the first matching portion.\n\n```\n// note\
