    \ some more will come in next chapter!\n\n# ## Backreferences\n\nFirst up, how\
    \ to refer to capture group portions directly in regexp definition and replacement\
    \ section. You have already seen how to refer to captured groups by match and\
    \ matchall methods. You've also seen how to pass captured portions to a function\
    \ in replace method. More directly, you can use reference \\N (within the regexp\
    \ definition) and $N (replacement section), where N is the capture group you want.\
    \ With more, you can also apply quantifiers to backreferences when used in regexp.\
    \ All the various forms are listed below:\n\n+   - in replacement section, $1,\
    \ $2 etc to refer to the corresponding capture group\n- in replacement section,\
    \ $6 to refer to entirely matched portion\n  - '$' gives before the matched portion\n\
    \  - '$' gives after the matched portion\n- within regexp definition, \\1, \\\
    2 etc to refer to the corresponding capture group\n\n```\n// remove square brackets\
    \ that surround digit characters\n> '[52] apples and mangoes'.replace(/(\\d+)/g,\
    \ '$1')\n< '52 apples and mangoes'\n```\n\n```\n// replace with and if it is alone\n\
    > 'foo_123 baz_'.replace(/(.*?)/, '$1')\n< 'foo_123 baz_'\n```\n\n```\n// swap\
    \ words that are separated by a comma\n> 'good,bad 42,24'.replace(/(\\w+),(\\\
    w+)/, '$2,$1')\n< 'bad 24,42'\n```\n\nHere are some examples for using backreferences\
    \ available by default without capturing groups.\n\n```\n// duplicate first field\
    \ and add it as last field\n> 'fork,42,nice,3.14'.replace(/.+/,, '$&,$&')\n< 'fork,42,nice,3.14,fork'\n\
    ```\n\nAnd here's some examples for using backreferences within regexp definition\n\
    \n```\n// elements that have at least one consecutive repeated word character\n\
    > let words = ['mono', 'excellent', 'poll']\n```"
