    # # Cheatsheet Summary


    | Note | Description |

    | --- | --- |

    | lookarounds | allows to create custom positive/negative assertions |

    | | zero-width like like anchors and not part of matching portions |

    | (?!pat) | negative lookahead assertion |

    | (?<!pat) | negative lookbehind assertion |

    | (=pat) | positive lookahead assertion |

    | (?=pat) | positive lookbehind assertion |

    | | variable length lookbehind is allowed |

    | (?!pat1)(?=pat2) | multiple assertions can be specified next to each other in
    any order |

    | | as they mark a matching location without consuming characters |

    | ((?!pat)* | Negates a regexp pattern


    In this chapter, we learnt how to use lookarounds to create custom restrictions
    and also to use grouping. With this, some of the most powerful features of regexp
    have been covered. The next chapter will give a brief introduction to working
    with unicode characters.


