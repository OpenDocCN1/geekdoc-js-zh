  - '[PAGE 11]


    # Anchors


    In this chapter, you''ll be learning about qualifying a pattern. Instead of matching
    anywhere in the given input string, restrictions can be specified. For now, you''ll
    see the ones that are already part of regular expression features. In later chapters,
    you''ll learn how to define your own rules for restriction.


    These restrictions are made possible by assigning special meaning to certain characters
    and escape sequences. The characters with special meaning are known as metacharacters
    in regexp parse. In case you need to match those characters literally, you need
    to escape them with a \ (discussed in Escaping metacharacters chapter).


    # String anchors


    This restriction is about qualifying a regexp to match at start or end of an input
    string. These provide functionality similarity to the string methods startsWith
    and endsWith . First is up ^ metacharacter, which restricts the matching to the
    start of string.


    ```

    // ^ is a prefix to the pattern

    /^cat/.test(''cater'')

    < true

    /cat/.test(''concatenation'')

    < false

    ```


    ```

    /hi/.test(''hi hello\ntop spot'')

    < true

    /top/.test(''hi hello\ntop spot'')

    < false

    ```


    To restrict the match to the end of the string, $ metacharacter is used.


    ```

    // $ is a suffix to the pattern

    /ares/.test(''spare'')

    < true

    /ares/.test(''nearest'')

    < false

    ```


    ```

    let words = [''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'', ''eel'',
    ''pest'']

    words.filter(w => /$/.test(w))

    < [''surrender'', ''newer'']

    words.filter(w => /$/.test(w))

    < [''pest'']

    ```


    Combining both the start and end anchors, you can restrict the matching to the
    whole string. Similar to comparing strings using the == operator.


    ```

    /^cat$/.test(''cat'')

    < true

    /^cat$/.test(''cater'')

    < false

    ```'
- md: "\nThe anchors can be used by themselves as a pattern. Helps to insert text\
    \ at the start or end of string, emulating string concatenation operations. These\
    \ might not feel like useful capability, but combined with other regex they become\
    \ quite a handy tool.\n\n```\n> 'live'.replace(/\\//, 're')\n< 'relive'\n> 'send'.replace(/\\\
    //, 're')\n< 'resend'\n\n> 'cat'.replace(/$/, 'er')\n< 'cater'\n> 'hack'.replace(/\\\
    $/, 'er')\n< 'hacker'\n```\n\n# Line anchors\n\nA string input may contain single\
    \ or multiple lines. The newline character \\n is used as the line separator.\
    \ The \\m flag is used, and ^^ and $ anchors will match the start and end of any\
    \ line respectively.\n\n```\n// check if any line in the string starts with 'top'\n\
    > /^top/m.test(hi hellontop spot)\n< true\n\n// check if any line in the string\
    \ ends with 'er'\n> /er$/m.test(spare\\npar\\nera\\ndare)\n< false\n\n// check\
    \ if any line complete in the string is 'par'\n> /^par$/m.test(spare\\npar\\nera\\\
    ndare)\n< true\n```\n\nJust like anchors, you can use the anchors by themselves\
    \ as a pattern.\n\n```\n> let items = 'catapults\\nconcatenate\\ncat'\n\n> console.log(items.replace(/^/gm,\
    \ '* '))\n* catapults\n* concatenate\n* cat\n\n> console.log(items.replace(/\\\
    $/gm, '.'))\n< catapults.\nconcatenate.\ncat.\n```\n\n> If there is a newline\
    \ character at the end of string, there is an additional start/end of line match\
    \ after the newline.\n\n```\n// 'foo ' is inserted three times\n> '1\\n2\\n'.replace(/^/mg,\
    \ 'foo ')\n< \"foo 1\nfoo 2\nfoo \"\n```\n\n```\n< '1\\n2\\n'.replace(/$/mg, '\
    \ baz')\n< '1 baz\n2 baz\nbaz\"\n```\n\n⚠️ If you are dealing with non-line- characters\
    \ with Windows OS based text files, you'll have to convert line endings to \\\
    n first. Otherwise, you'll get end of line matches for both \\r and \\n characters.\
    \ You can also handle this case in regexp by using \\r as an optional quantifier\
    \ with quantifiers (see Greedy quantifiers sections).\n\n# Word anchors\n\nThe\
    \ third type of restriction is word anchors. Alabets (respective of case), digits\
    \ and the underscore character qualify as word characters. You might wonder there\
    \ are digits and underscores as well, why not alphabets? This comes from variable\
    \ and function naming conventions — typically alphabets, digits and underscores\
    \ are allowed. So, the definition is more oriented to programming languages than\
    \ natural ones.\n\nThe escape sequence \\b denotes a word boundary. This works\
    \ for both the start of word and ending of anchoring. Start of word means either\
    \ the character prior to the word is a non-word character or there is no character\
    \ (start of string). Similarly, end of word means the character after the word\
    \ is a non-word character or no character (end of string). This implies that you\
    \ cannot have word boundary \\b without a word character.\n\n```\n> let sample\
    \ = 'par spar spare part'\n```\n\n```\n// replace /par/ irrespective of where\
    \ it occurs\n> sample.replace(/par/g, 'X')\n< \"X sx apX sXe Xt\"\n// replace\
    \ /par/ only at the start of word\n> sample.replace(/\\bpar/g, 'X')\n< \"X spar\
    \ apparent spare Xt\"\n// replace /par/ only at the end of word\n> sample.replace(/par\\\
    b/g, 'X')\n< \"X sx apparent spare part\"\n// replace /par/ only if it is not\
    \ part of another word\n> sample.replace(/\\bpar\\b/g, 'X')\n< \"X spar apparent\
    \ spare part\"\n```\n\nYou can get more creative using word boundary as a pattern\
    \ by itself.\n\n```\n// sample = 'par spar spare part'\n// space separated words\
    \ to double quoted csv\n// note that 'replace' method is used here\n> console.log(sample.replace(/\\\
    b/g, \"\")).replace(/ /g, ''))\n< \"par\",\"spar\",\"apparent\",\"spare\",\"part\"\
    \n```\n\n```\n// make a programming statement purpose only, won't work for all\
    \ cases\n> 'foo_baz=num1+35*42/num2'.replace(/b/g, ' ')\n< \" foo_baz = num1 +\
    \ 35 * 42 / num2 \"\n// space at start/end of string can be trimmed off\n// you'll\
    \ learn how to add a qualifier so that trim is not needed\n> 'foo_baz=num1+35*42/num2'.replace(/b/g,\
    \ ' ' ').trim()\n< \" foo_baz = num1 + 35 * 42 / num2 \"\n```\n\nThe word boundary\
    \ has no anchor too. \\B matches whenever \\b doesn't. This duality will be with\
    \ some other escape sequences. Negative logic is handy in many text processing\
    \ situations. But with it care what might end up touching things you didn't intend!\n\
    \n```\n// replace 'par' if it is not start of word\n> sample.replace(/\\Bpar,\
    \ 'X')\n< \"par sx apent Sxe part\"\n// replace 'par' at the end of word but not\
    \ whole word 'par'\n> sample.replace(/\\Bpar\\b, 'X')\n< \"par sx apent spare\
    \ part\"\n// replace 'par' if it is not end of word\n> sample.replace(/par/\\\
    B, 'X')\n< \"par sx apent Sxe part\"\n// replace 'par' if it is surrounded by\
    \ word characters\n> sample.replace(/\\Bpar\\B/g, 'X')\n< \"par sx apent Sxe part\"\
    \n```\n\nHere's some standalone pattern usage to compare and contrast the two\
