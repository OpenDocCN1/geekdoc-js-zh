    \ is a non-word character or no character (end of string). This implies that you\
    \ cannot have word boundary \\b without a word character.\n\n```\n> let sample\
    \ = 'par spar spare part'\n```\n\n```\n// replace /par/ irrespective of where\
    \ it occurs\n> sample.replace(/par/g, 'X')\n< \"X sx apX sXe Xt\"\n// replace\
