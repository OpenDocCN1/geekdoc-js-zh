  md: '# Textarea Maxlength


    In September 2004 Website agency Lost Boys contracted me to create, among other
    things, a script that keeps track of the number of characters the user enters
    in a textarea. This was the Textarea Maxlength script. I subsequently discussed
    aspects of this script at great length in my "JavaScript Triggers" article at
    A List Apart, implemented it in the comment areas of my own blog, and added a
    description to QuirksMode. You can find my article at http://alistapart.com/articles/scripttriggers.


    This is an extremely simple DOM script that slightly enhances the form it''s on.


    # Usable Forms


    In April 2003 the ING Bank contracted me to create a demo mortgage application
    form. Since this is one of the most complicated forms in existence, a way to hide
    irrelevant forms until they''re needed was mandatory. After all, a "Date of Divorce"
    field is only useful when the user indicates he is, in fact, divorced. In all
    other cases the field should remain hidden.


    So I wrote Useful Forms, and to celebrate that fact I wrote "Forms, Usability,
    and the W3C DOM". You can find this article at http://www.digital-web.com/articles/forms_usability_and_the_w3c_dom/.
    You''ll notice that the version of the script I discuss is other than the one
    used in this book.


    This is a moderately complex DOM script that continually restructures the document
    it''s running in. It contains valuable lessons about working with custom attributes,
    the definition of relations between HTML elements, the use of markers, global
    events, and the advantages of the Level O DOM when working with form fields.


    # Form Validation


    Form Validation was finalized in Spring 2004, when Website company SQR contracted
    me to create templates for a form-heavy site. Obviously, forms need validation
    scripts, and I created Form Validation, which hinged on the custom validation
    attribute and contained the—then major—innovation of displaying error messages
    next to the form field they apply instead of an alert.'
