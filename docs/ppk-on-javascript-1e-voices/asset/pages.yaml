  md: '# Site Survey


    +   * **Purpose:** Find out which pages of a site the user has visited, and redirect
    the user to a survey when she quits the site.

    * **User actions:** The user browses a site in the normal way.

    * **Feedback:** None visible. The popup remembers the pages the user has visited,
    but that information remains invisible.

    * **Script knowledge:** The script must keep track of the pages the user visits,
    and be alerted when the user leaves the site.

    * **Maintenance:** The client enters a few bits of data, notably the survey period
    and the project number. Nonetheless, there''s no maintenance in the traditional
    sense.

    * **Special:** Ideally, the users never notice that the script is there, until
    they see the survey being opened.


    # HTML structure


    This script should be able to work on any page in any site. Therefore, I didn''t
    prepare an HTML structure, except for defining an optional element `id=sitetrekText`.
    If this element is present in the page the script is added to, the script creates
    a little help text that announces the popup''s going to open.


    The popup contains a bit of text and a form. The script adds as many hidden fields
    to this form as necessary.


    This script uses no hooks, since I can''t predict how the pages it will work on
    will be structured. Besides, the script hardly changes anything in the document
    tree, so it doesn''t really need hooks.


    # Script structure


    The main challenge was keeping the communication between the popup and the main
    window open. The script reads out the necessary data (mainly the page URLs) and
    stores quite a bit of information in cookies for safekeeping.


    We''ll discuss these features in detail in 6B.'
