    ```


    An HTML parser will ignore Web tags and attributes it doesn''t understand, so
    serving a <center> tag to Mosaic is no problem. Besides, an application that uses
    cookies must also provide for a no-cookie situation, since even Netscape users
    won''t have one on their first visit.


    From the very start of their existence, browser detects have been an unnecessary
    scourge inflicted on the world by Web developers who thought they understood browsers
    but were tragically wrong.


    Browser vendors were forced to respond, and the only reasonable course of action
    was to make sure their identification strings matched the ones expected by the
    oh-so-clever detection strings. The arms had begun.


    When Explorer entered the market, it too supported cookies and the <center> tag,
    and it wanted to end up on the right side of these browser detects. So its identification
    string starts with Mozilla/, it too. It disguised itself as Netscape from the
    beginning of its career.


    Other browsers followed suit. Nowadays any browser that''s even remotely capable
    of more than just unstyled HTML parts starts its browser string with Mozilla.


    The Browser Wars upped the ante. As we saw in 1C, Netscape and Microsoft made
    sure that their version 4 browsers were totally incompatible. Reflexively, Web
    developers responded by creating more browser detects to separate the world into
    Netscape and Explorer.


    Some developers decided to code their sites for one browser only—usually Explorer.
    Although back then there was some justification for this decision, they still
    used browser detection instead of object detection in order to decide whether
    to admit a visitor or not.


    When the Browser ended, countless sites had set detection scripts that allowed
    access only to Explorer. History repeated itself: minor browsers'
