  md: "# return\n\nAfter a function has done its duty, JavaScript returns to the place\
    \ it was called from and continues from there. Take this example:\n\n[Site Survey/popup.js,\
    \ lines 22-49, condensed heavily]\n\n```\nfunction trackMain(url) {\n  if (url)\n\
    \    addPage(url);\n    // more stuff\n}\n\nfunction addPage(url) {\n  // more\
    \ stuff\n  addInput('p' + pageCounter,url);\n}\n```\n\naddInput(name,value)\n\
    addInput() is called from addPage(), and addPage() is called from track-Main().\
    \ When addInput() is ready, JavaScript returns to the addPage() function, sees\
    \ that it is ready, too, and returns to trackMain(). This function is not yet\
    \ complete, so now it continues where it left off, below the addPage(url) line.\n\
    \nThis is an implicit return; the function ends because it's done.\n\n# return\
    \ ends function\n\nYou can also explicitly order a function to return by using\
    \ the return keyword. In fact, you'll do this quite often.\n\nIt's common to check\
    \ for the existence of objects you're going to need before running a function.\
    \ If the objects are not supported, you use a return statement to end the function.\
    \ It shouldn't run any further, because it needs the missing objects and would\
    \ give error messages when they don't exist."
  merge: -1
  pgno: 241
- img_proc: true
  md: "We already encountered an example:\n[Edit Style Sheet, lines 5-6]\n\n```\n\
    function initStyleChange() {\n  if (!document.stylesheets) return;\n  // initialize\
    \ page using document.stylesheets\n```\n\nIf document.stylesheets is not supported,\
    \ the return statement is executed and the function ends.\n\n# Returning a value\n\
    \nThe function may also return a value. For instance, a function that calculates\
    \ should return the result of the calculation to the function that asked for it.\
    \ Take createReadablePrice() from Sandwich Picker:\n[Sandwich Picker, lines 193-208,\
    \ condensed]\n\n```\nfunction calculateTotalPrice() {\n  // calculate total price\n\
    \  document.getElementById('priceDisplay').innerHTML = createReadablePrice(price);\n\
    }\n```\n\n```\nfunction createReadablePrice(price) {\n  price = price.toFixed(2);\n\
    \  price = price.replace(/\\./, '\\,'');\n  return price;\n}\n```\n\ncalculateTotalPrice()\
    \ calculates the total price, and createReadablePrice() makes sure that it has\
    \ two decimals and a comma as decimal separator, that it becomes human-readable\
    \ for the Dutch market.\n\nWhen that's done, the price is ready to be shown to\
    \ the users of the site. Now createReadablePrice() returns the variable price\
    \ to whichever function asked for it:\n\n```\nreturn price;\n```"
  merge: -1
  pgno: 242
- img_proc: true
  md: "Of course, the function that called `createReadablePrice()` must do something\
    \ with this return value:\n\n```\ndocument.getElementById('priceDisplay').innerHTML\
    \ = =\ncreateReadablePrice(price);\n```\n\nThe return value of `createReadablePrice(price)`\
    \ is assigned to the `innerHTML` of the element with id=\"priceDisplay\".\n\n\
    Functions can return any value. `createReadablePrice()` returns a string, but\
    \ it's also possible to return numbers, booleans, or objects.\n\n# Functions as\
    \ values\n\nFunctions are values of a variable.\n\nFor example:\n\n```\nfunction\
    \ addInput(name,value) {\n  var mainForm = document.forms[0];\n  var newInput\
    \ = document.createElement('input');\n  // newInput.type = 'hidden';\n  newInput.name\
    \ = name;\n  newInput.value = value;\n  mainForm.appendChild(newInput);\n}\nnalert(addInput);\
    \ // note: no parentheses after addInput!\n```\n\nThe alert shows the entire function.\
    \ In other words, we have created a variable `addInput` and its value happens\
    \ to be (a reference to) a function. The variable `addInput` works like any other\
    \ variable. You could, for instance, assign its value to another variable, so\
    \ that it refers to the same function:\n\n```\nvar testCall = addInput;\ntestCall('name',\
    \ 'ppk');\n```\n\n`testCall` now has the same value as `addInput`: a reference\
    \ to the function."
  merge: -1
