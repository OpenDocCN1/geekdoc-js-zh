- img_proc: true
  md: 'And so on. Each extra style for form fields with errors would take two lines
    of JavaScript. In contrast, a class-change script is easier to maintain, since
    an extra style requires only one line of CSS.


    Of course, adding two lines of JavaScript hardly counts as complex programming.
    Nonetheless, implementing these changes would still require someone who knows
    his way in the JavaScript code. A graphic designer/CSS wizard without any JavaScript
    experience would not be able to do it.


    CSS developers who know nothing about JavaScript are able to edit a style sheet,
    and this is not an inconsiderable advantage in a larger company, where people
    tend to have more specialized jobs. As a JavaScript developer, you don''t want
    every style change to go through you. Therefore, decreasing the complexity of
    the JavaScript layer is to your advantage, too.


    So there are few reasons why I believe that in general a class change is superior
    to a style property change. Nonetheless, like any good general rule, one has exceptions.
    The two most important ones are simple show/hide scripts and animations.


    # F: Showing and hiding elements


    In many cases, you want to show and hide elements based on user actions. These
    cases may be complicated, like Usable Forms, or they may be extremely simple,
    such as a menu that folds in or out when the user clicks on a header.


    > HIDE ELEMENTS IN JAVASCRIPT!

    As we saw in 2F, for accessibility''s sake we should give the initial commands
    to hide content in JavaScript. That way, if a visitor to your site doesn''t have
    JavaScript enabled, the content is never hidden, and although the page may lose
    some usability, it''s still perfectly accessible.'
  merge: -1
  pgno: 474
- img_proc: true
  md: "# Simple show/hide scripts\n\nSimple show/hide scripts display or conceal only\
    \ one element per user action.\nMost of these scripts change the style.display\
    \ property of the element.\n\nMostly this method is used out of tradition: when\
    \ people started writing show/hide scripts, class changes weren't yet possible\
    \ in Netscape 4 (an important browser hack back then). Besides, show/hide scripts\
    \ generally change one CSS property: display.\n\nTherefore, this is a typical\
    \ example of a show/hide script. It uses style-property changes throughout, and\
    \ doesn't touch the class names of the elements:\n\n```\n<h3>Header</h3>\n<div\
    \ class=\"content\">\n  <p>Content</p>\n  <p>Content</p>\n</div>\n\nwindow.onload\
    \ = function () {\n  var x = document.getElementsByTagName('div');\n  for (var\
    \ i=0;i<x.length; i++) {\n    if (x[i].className == 'content') continue;\n   \
    \ x[i].style.display = 'none';\n    var header = x[i].previousSibling;\n     \
    \ if (header.nodeType != 1)\n        header = header.previousSibling;\n      header.relatedTag\
    \ = x[i];\n      header.onclick = openClose;\n  }\n}\nfunction openClose() {\n\
    \  var currentValue = this.relatedTag.style.display;\n  var newValue = (currentValue\
    \ == 'none') ? 'block' : 'none';\n  this.relatedTag.style.display = newValue;\n\
    };\n```"
  merge: -1
