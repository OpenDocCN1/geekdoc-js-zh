    # E: The event object and its properties


    > > **WARNING** General browser incompatibility warning throughout this section


    Once you have registered an event handler for the correct event, you can turn
    your attention to the event-handling function itself. Of course the exact form
    of this function depends heavily on the actions you want to take. Possibilities
    range from a simple one-line style to complex initializations of extra functionalities
    that take dozens of lines.


    Sometimes you need to access the event object. The browser automatically creates
    this object whenever an event occurs, and it contains all kinds of useful information
    about the event, such as the target element, the event type, the mouse position,
    the key user pressed, and much more.


    The event object and its properties suffer from serious browser incompatibilities.
    Although many of these incompatibilities are restricted to differing property
    names (W3C''s target vs. srcElement, for instance), there are areas where the
    problems are more fundamental, and some event properties are not present in all
    browsers.


    # The event object


    Before delving deeper into its properties, you first have to access the event
    object, which is handled differently by the W3C and the Microsoft models:


    +   - In the W3C model, the event object is sent to the event-handling function
    as the first argument.


    +   - In the Microsoft model, the event object is always window.event.'
