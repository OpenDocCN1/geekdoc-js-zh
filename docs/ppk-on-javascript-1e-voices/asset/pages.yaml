  md: '# NAVIGATOR VENDOR?


    Konqueror always has navigator,vendor, and Safari''s value always contains ''Mozilla''.
    Should we hope for a future browser detector based on navigator,vendor?


    No. Even if all browsers supported it, all browser detects would switch to ''navigator,vendor''
    and the whole thing would start all over again. It''s far better to leave navigator,vendor
    in peace and forget about browser altogether.


    not to prove the browser is not Safari. If the user tells Safari to identify itself
