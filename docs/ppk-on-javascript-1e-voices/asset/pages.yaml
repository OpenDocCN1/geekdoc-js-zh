- img_proc: true
  md: '# SECTION A: THE CSS REVOLUTION | 31


    ![](img/1cdc3bc9be02360dab81df06bea3c619_60_0.png)


    Figure 2.1


    The three layers of a Web page. The HTML structural layer is the required basis,
    and the CSS presentation and JavaScript behavior layers are built on top of it.


    The HTML structural layer is the most basic part of the page. The HTML tags form
    the structure of the page and give meaning to its content. For instance, if a
    certain text is marked up with `<h1>`, it''s a header and should be treated as
    such. Browsers (or, more generally, user agents—programs that interpret HTML)
    are expected to distinguish this header from the surrounding normal text, by displaying
    it in bold and in a larger font, or by pronouncing it slower. Once you''ve created
    structurally correct HTML, you can be reasonably certain that most user agents,
    here users, will recognize a header as a header.


    The purpose of the CSS presentation layer is to define how your HTML should be
    presented. CSS allows you to specify colors, fonts, leading, and other graphical
    elements, as well as the general layout of the page, for instance, “The navigation
    block goes next to the content block."


    The JavaScript behavior layer adds interactivity to an HTML/CSS page. As soon
    as you want something to happen when the user mouses over an HTML element, you
    need JavaScript to implement the effect.


    Every Web page needs an HTML structural layer—without HTML, there is no Web page.
    However, the CSS and JavaScript layers are optional. Old, obscure, or unusual
    browsers may not support CSS and/or JavaScript, in which case one or both layers
    may go missing—the presentation or behavior instructions are never executed.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'CHAPTER 2: CONTEXT


    ![](img/1cdc3bc9be02360dab81df06bea3c619_61_0.png)


    FIGURE 2.2

    If a browser can''t handle JavaScript, obviously the behavior layer won''t work.
    Will your site survive that experience?


    The consequence of this state of affairs is obvious. Any site must be able to
    survive the demise of the behavior layer (or the presentation layer, but that''s
    a much rarer occurrence). In other words, a site may not totally rely on JavaScript,
    but must remain accessible when JavaScript doesn''t work. We''ll get back to this
    in 2E.


    # Separation of concerns


    Another point raised by the division of client-side code into three layers is
    the separation of concerns. In general, it''s best to manage each of the three
    layers separately. At the most basic level, this is done by making sure of the
    following:


    +   - The HTML is structured, not too complex, and makes sense without CSS and
    JavaScript.

    - The CSS presentation layer and the JavaScript behavior layer reside in separate
    .css and .js files.


    Separating concerns makes for easy maintenance. When you use CSS and JavaScript
    files, it''s easy to link to these files from all pages in your site. This has
    obvious maintenance advantages: if you open the .css file and change, say, the
    font size from 12px to 0.8em, this change will immediately be propagated to all
    HTML pages that link to that .css file.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Besides, separation allows you to change the entire CSS presentation layer
    to give your site a new design, without having to recode either the HTML structure
    or the JavaScript behavior layer.


    # The three separations


    As you see, separation concerns makes your site''s code cleaner and easier to
    maintain. In the next section we''ll discuss the gory details of the three separations:


    +   - Separation of presentation and structure (CSS and HTML)

    - Separation of behavior and structure (JavaScript and HTML)

    - Separation of behavior and presentation (JavaScript and CSS).


    All three influence the way we should write JavaScript.


    # B: Separation of presentation and structure


    The basic idea of separation of presentation and structure is to make sure the
    HTML defines structure, and only structure, and that all presentation is defined
    in a separate CSS file. No more <font> tags or presentational tables in your HTML!
    If you need to specify a font or a grid, do so in CSS.


    A discussion of the separation of CSS and HTML seems to have no place in a JavaScript
    book. Nonetheless, there are a few aspects of this separation that influence the
    way you could code JavaScript.


    # CSS modification


    JavaScript allows you to modify CSS; i.e., you can make a link red in the CSS,
    and later on overrule this style with JavaScript and make the link green. Sometimes
    this is quite useful, since style changes allow you to pull the user''s eyes to
    the HTML element you need to focus on—an error message, for instance.'
  merge: -1
  pgno: 62
- img_proc: true
  md: "We'll discuss the ins and outs of CSS modification in Chapter 9, and we'll\
    \ see that CSS modification becomes much harder without a properly separated CSS\
    \ presentation layer.\n\nAs we'll see in 9E, the changing of the className of\
    \ an element is usually the best way to effect CSS modification. If Form Validation\
    \ finds a user error in a field, it changes the CSS class of that field:\n\n```\n\
    // obj is the form field\nobj.className += 'errorMessage';\n// CSS\ninput.errorMessage\
    \ {\n  border: 1px solid #cc0000;\n}\n```\n\nThe point is that this trick only\
    \ works if you have properly separated presentation and structure. The class errorMessage\
    \ has to be defined in CSS for the style to change, and that in turn is only possible\
    \ (or, at least, workable) if you started out with a proper CSS presentation layer.\n\
    \n# Modify structure or presentation?\n\nJavaScript allows you to change the presentation\
    \ of your Web site and also allows you to change the structure of your HTML document--in\
    \ fact, most example scripts do so.\n\nUsually it's clear whether a script should\
    \ change presentation or structure. Sandwich Picker, for instance, is all about\
    \ moving the <tr> that contains sandwiches the user selected to the correct table—the\
    \ search results table at the top of the page or the order table just below it.\
    \ This is an example of a pure structure change.\n\nXMLHTTP Speed Meter contains\
    \ an animation; it changes the CSS width of the element holding the gray background\
    \ image, while the document structure stays the same. This is an example of a\
    \ pure presentation change."
  merge: -1
  pgno: 63
- img_proc: true
  md: 'In a few cases, though, you can change either the HTML or the CSS. Usable Forms
    is the clearest example. The purpose of that script is to hide form fields until
    the user needs them. You can hide form fields in two ways: make them invisible
    by CSS (`display: none`) or remove them entirely from the document structure.


    The user doesn''t care which of the two''we choose; in either case the form fields
    appear only when they''re needed. Nonetheless there are a few differences between
    the two methods.


    First, I feel that changing forms in response to user actions is a change in structure,
    not in presentation. The form fields should not just be hidden from view, but
    should be entirely removed from the document. Once the user has checked or unchecked
    several form fields, and the script has reacted by showing or hiding form fields,
    every visitor will eventually see the unique document he or she needs.


    Of course with me, this is a theoretical consideration, and you should feel free
    to agree with me, though I don''t think a similar case can be made for hiding
    the form fields by CSS.


    There''s a practical component, too. When a form is submitted, the browser creates
    name/value pairs for all form fields, and sends them to the server. If we hide
    the unnecessary form fields by means of CSS, the fields themselves are still part
    of the form—they''re just hidden. Therefore they, too, are sent to the server,
    even though that''s not necessary.


    Conversely, if, as in Usable Forms, these form fields are entirely removed from
    the document structure (hence also from the HTML `<form>` tag), they aren''t sent
    to the server, for the simple reason that they aren''t part of the form at the
    moment it is submitted.


    I found these two reasons sufficient to make Usable Forms operate changing document
    structure instead of presentation. Although you may disagree with me, you should
    spend some time thinking about such issues when you encounter them.'
  merge: -1
