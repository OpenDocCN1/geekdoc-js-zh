  md: "# The () operator\n\nYou may have noticed that I left out the parentheses ()\
    \ in a few lines of the previous code examples. That's because () is actually\
    \ a JavaScript operator; it's a command to execute the function, and we don't\
    \ always want that to happen.\n\nLet's take a closer look at this important operator:\n\
    \n```\nfunction test() {\n  return \"Hello\";\n}\n```\n\nThe variable test now\
    \ refers to a function that returns the string \"Hello\":\n\n```\nalert(test);\n\
    alert(test());\n```\n\nHowever, these two alerts give different results. The first\
    \ alert is commanded to show the value of the variable test, which happens to\
    \ be a function. This is the first alert's result:\n\n```\nfunction () {\n  return\
    \ \"Hello\";\n}\n```\n\nThe second alert gets a quite different command: the parentheses\
    \ () tell it to execute the function test and show its return value, as follows:\n\
    \n```\nHello\n```\n\nThe key to good function use is knowing how to treat a function\
    \ as a value and when to execute it. Treating a function as a value is important\
    \ in event handling. Take, for instance, this line from Textarea Maxlength:\n\n\
    [Textarea Maxlength, line 16]\n\n```\nx[i].onkeyup = x[i].onchange = checkMaxLength;\n\
    ```"
  merge: -1
  pgno: 244
- img_proc: true
  md: "The keyup and onchange event handlers now get a reference to the function checkMaxLength\
    \ as their value, and that means \"If the keyup or change event occurs, execute\
    \ checkMaxLength.\"\n\nWe don't want the function to be executed when it is assigned\
    \ to the event handlers, but only when the event actually takes place. Therefore,\
    \ we don't include parentheses when we assign the event handler. We want to transfer\
    \ the function itself, not the return value of function.\n\nWe'll get back to\
    \ this important topic in 7C.\n\n# Nested functions and variable scope\n\nFunctions\
    \ can contain other functions. This is something you'll occasionally use in event\
    \ handling. Take this function from XMLHTTP Speed Meter (we'll treat it completely\
    \ in 10A):\n\n[XMLHTTP Speed Meter, lines 121-139, condensed]\n\n```\nfunction\
    \ sendRequest(url,callback,postData) {\n  var req = createXMLHTTPObject();\n \
    \ // administration\n  req.onreadystatechange = function () {\n    if (req.readyState\
    \ != 4) return;\n    // handle event\n  }\n}\n```\n\nThe nested function is a\
    \ normal function in all respects. It's executed when the onreadchange event occurs,\
    \ and it works normally.\n\nNonetheless, one problem can arise when you use nested\
    \ functions: variable scope."
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Definition scope of functions\n\nJavaScript functions run in the scope in\
    \ which they are defined, not in the scope from which they are executed.\n\nWhat\
    \ does that mean? It means that a nested function has access to all the local\
    \ variables of its parent function, even if the parent was executed long before\
    \ the nested function is called.\n\nThe sendRequest() function creates an XMLHttpRequest\
    \ object that fetches some data and stores it in req. When the data is returned\
    \ to the browser, an event handler fires does something with it (see 10B):\n[XMLHTTP\
    \ Speed Meter, lines 121-139, condensed]\n\n```\nfunction sendRequest(url,callback,postData)\
    \ {\n  var req = createXMLHttpRequest();\n  // administration\n  req.onreadystatechange\
    \ = function () {\n    if (req.readyState != 4) return;\n    if (req.status !=\
    \ 200 && req.status != 304) {\n      alert('HTTP error ' + req.status);\n    \
    \  return;\n    }\n    callback(req);\n  }\n}\n```\n\nreq refers to the XMLHttpRequest\
    \ object and is a local variable in sendRequest(), since it's declared within\
    \ the function body with a var keyword. Since the nested event-handling function\
    \ is defined within sendRequest(), this function also has access to all of its\
    \ parent function's local variables, including req. Therefore, the nested function\
    \ also uses req to refer to the XMLHttpRequest object.\n\nThe event handler fires\
    \ long after sendRequest() itself has finished, but because it was defined within\
    \ sendRequest(), it continues to have access to sendRequest()'s local variables."
  merge: -1
  pgno: 246
- img_proc: true
  md: "# Last value counts\n\nIt is important to realize that the nested function\
    \ has access only to the *final* value of a local variable. The next example,\
    \ which looks a bit like the previous one, doesn't do what you might expect:\n\
    \n```\nfunction init() {\n  var message = 'Clicked - ';\\n  var x = document.getElementsByTagName('a');\n\
    \  for (var i=0;i<x.length;i++) {\n    x[i].onclick = function () {\n      x[i].firstChild.nodeValue\
    \ = message;\n    }\n  }\n}\n```\n\nHere, too, an event handler is defined within\
    \ another function, and therefore has access to the local variables of that function.\
    \ In the case of *i*, though, it doesn't work as expected.\n\nThe function `init()`\
    \ defines event handlers on all `<a>` tags in the document. Let's say we have\
    \ 10. During that process, *i* goes from 0 to 10, and when the function exits,\
    \ it retains this final value 10.\n\nThe event handlers fire long after the function\
    \ has exited, and by that time *i* has the value 10. Therefore, the event handler\
    \ uses this value, and that causes an error. Since the tenth link in the document\
    \ has index number 9, the event handler gives an error message: it can't find\
    \ the eleventh link (with index 10) in the document.\n\nThe solution is to use\
    \ the `this` keyword instead:\n\n```\nx[i].onclick = function () {\n  this.firstChild.nodeValue\
    \ = message;\n}\n```\n\nIn order to understand why this works, we have to study\
    \ JavaScript objects."
  merge: -1
  pgno: 247
- img_proc: true
  md: "# J: Objects\n\nObjects are useful storage units for variables and functions\
    \ that are related to each other. For instance, in JavaScript every HTML element\
    \ is represented by an object, which conveniently gathers all relevant information\
    \ about the element in one place, where it is easy to access and change.\n\nTake\
    \ this form field:\n\n```\n<input name=\"name\" value=\"ppk\" id=\"mypname\" />\n\
    ```\n\nYou can access it by doing this:\n\n```\nvar formField = document.getElementById('mypname');\n\
    ```\n\nIn other chapters, I'll say that \"formField\" now contains the form field\"\
    . In this section, we're going to be very finicky and precise, so instead I say\
    \ that the variable formField now holds a reference to the JavaScript object that\
    \ represents the HTML form field.\n\nAn object is nothing more than a collection\
    \ of properties. Properties whose values are functions (such as event handlers)\
    \ are called methods. In JavaScript there is no difference between variables and\
    \ properties, and between functions and methods. Nonetheless, it's customary to\
    \ speak of the methods and properties of an object.\n\nProperties have a name\
    \ and a value, and calling a property by name reveals its value. Let's read out\
    \ a few properties of our object:\n\n```\nvar formField = document.getElementById('mypname');\n\
    alert('The field with name ' + formField.name + ' \n' has value ' + formField.value);\n\
    ```\n\nThe name and value properties of the form-field object coincide with the\
    \ HTML name and value attributes. Reading out these properties reveals their values,\
    \ which are shown in the alert. The alert faithfully reads \"The field with name\
    \ has value ppk\"."
  merge: -1
  pgno: 248
- img_proc: true
  md: "# 220 CHAPTER 5: CORE\n\nWe can also change these properties:\n\n```\nformField.name\
    \ = 'author';nalert('The form field with name ' + formField.name + '\nhas value\
    \ ' + formField.value);\n```\n\nNow the alert reads \"The form field with name\
    \ author has value ppk\", and if the form is submitted to the server, the form\
    \ field's name will be author.\n\nWe can also define methods on:\n\n```\nformField.onclick\
    \ = function () {\nalert('The form field with name ' + formField.name + \nhas\
    \ value ' + formField.value);\n}\n```\n\nNow the alert is shown whenever the user\
    \ clicks on the form field.\n\nThus the form object represents the HTML form field,\
    \ and there's an object for every single HTML element in a page. Since these objects\
    \ all contain useful information about the HTML elements they represent, and even\
    \ allow you to modify the elements, you'll use these objects continuously in your\
    \ scripts.\n\n# The dot\n\nAs you see in the code examples, every time I want\
    \ to access a method or property of the object formField, I start with formField.\
    \ and then add the name of the method or property. That immediately defines the\
    \ purpose of the dot operator; it is used to access methods or properties of an\
    \ object. The object itself is named on the left side of the dot, the method or\
    \ property on the right side.\n\nTherefore, any time you see a dot anywhere in\
    \ JavaScript code, you know that an object is being asked for a method or property.\
    \ This can be a simple operation, like formField.name (\"access the name of property\
    \ of objectField\"), or it can be something more complicated, like this:\n\n```\n\
    var x = document.getElementById('test').getElementsByTagName('a');\nThis uses\
    \ two dots, and therefore you immediately know that at least two objects are being\
    \ accessed (in fact, there are several more involved). First\n```"
  merge: -1
  pgno: 249
- img_proc: true
  md: "we access the getElementById method of the document object (document.\ngetElementById)\
    \ and execute it (('test')).\n\nThis method returns yet another object (let's\
    \ be precise: it's a reference to\nt object that represents the element with id=\"\
    test\"), and we access the\ngetElementsByTagName method of this new object in\
    \ order to get all <> tags\ncontained by this HTML element. The result is a nodeList.\n\
    \nAlthough this may sound slightly complicated, you'll intuitively do the right\
    \ thing\nwhenever you use this sort of statement, and you rarely have to worry\
    \ about the\nexact meaning. You now have access to all links in the element with\
    \ id=\"test\"\nand that's counts.\n\n# Defining objects\n\nUntil we work with\
    \ predefined objects. These come in two flavors: inter-\nval JavaScript objects\
    \ (such as the String objects discussed in 5F), and host\nobjects, or objects\
    \ created by JavaScript's host (the browser). Host objects\ninclude those that\
    \ represent each HTML element in your pages. The remaining\nchapters will focus\
    \ exclusively on this herd of objects.\n\nThere's a third flavor of object: those\
    \ you define yourself. Although this book\ndoes't treat object-oriented programming,\
    \ you should know how to create your\nown objects.\n\nThe following is perfectly\
    \ legal (a bit ponderous) JavaScript that creates\nan object:\n\n```\nvar test\
    \ = new Object();\ntest.a = 2;\ntest.b = '2';\ntest.c = function () {\n  alert(test.a\
    \ * test.b);\n}\n```\n\nWe first officially state that test becomes a new object.\
    \ Then we define a, b,\nand c as properties of the object, and give them values.\
    \ Since c's value is a\nfunction, c becomes a method."
