  md: "# switch\n\nI could also have used a switch statement for the last code example.\n\
    \nThe switch statement takes a value and goes through a list of options, each\
    \ of which is called a case. If it finds the right case, it starts executing the\
    \ code and doesn't stop until the end of the switch block or a break statement.\
    \ It also ignores all other cases.\n\nTake this bit from Edit Style Sheet. It\
    \ isn't different from the previous if/else if example:\n\n```\nswitch (relatedField.type)\
    \ {\n  case \"text\":\n    relatedField.value = styles[i];\n    break;\n  case\
    \ \"checkbox\":\n    if (relatedField.value == styles[i])\n      relatedField.checked\
    \ = true;\n    break;\n  case \"select-one\":\n    for (var j=0;j<relatedField.options.length;j++))\n\
    \      if (relatedField.options[j].value == styles[i])\n        relatedField.options[j].selected=true;\n\
    }\n```\n\nThe switch is performed on the value of relatedField.type, which, once\
    \ again, gives the type of a form field.\n\nIf type is \"text\", the first line\
    \ is executed, and then the switch encounters a break statement, which means \"\
    Stop operation.\" If type is \"checkbox\", the next two lines are executed, and\
    \ a break is once again encountered. If type is \"select-one\" the last few lines\
    \ are executed. There's no break statement after those lines because it's not\
    \ necessary; the entire switch block ends."
  merge: -1
  pgno: 226
