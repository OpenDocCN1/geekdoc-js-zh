- img_proc: true
  md: 'JavaScript will swing back to a thin phase in which its purpose is again redefined
    and large-scale solutions make place for smaller, simpler scripts.


    Of course, in due time this third thin phase will be followed by a third fat phase,
    in which an as-yet-uninvented acronym will redefine JavaScript’s purpose for the
