  md: 'instead. Therefore, any function that wants to use this target first has to
    find where the browser stores it. I use this line:


    [Usable Forms, line 71]


    ```

    varTarget = evt.target || evt.srcElement;

    ```


    What happens? JavaScript encounters an operator and starts evaluating the first
    expression (evt.target). If the browser is W3C DOM-compliant, evt.target exists,
    i.e., it is not undefined, and JavaScript has found an expression that evaluates
    to true. It doesn''t have to go on the next expression, so it breaks off the


    Nonetheless, it does not return true, but the value of the expression was last
    evaluated, i.e., evt.target''s value, which is the target of the event. That''s
    exactly the data we need.


    If the browser is Explorer, evt.target is undefined, which converts to boolean
    false. Therefore JavaScript proceeds to the second expression, and since evt.srcElement
    exists, it evaluates as true. Again, it doesn''t return true, but the value of
    the expression that was last evaluated (evt.srcElement), which is again the target
    of the event.


    In other words, evtTarget now contains the target of the event, whether that information
    is found in evt.target or evt.srcElement. You''ll often use this trick when there
    are several possible locations for one bit of data.


