  md: "# Form Validation\n\nObviously, Form Validation needs the submit event. When\
    \ the user submits the form, the script checks the content of all form fields:\n\
    \n[Form Validation, line 67]\n\n```\nforms[i].onsubmit = validate;\n```\n\nThe\
    \ validate() function returns true or false, so that the event knows whether to\
    \ allow the form submission or not.\n\nI don't need addEvent(), even though Form\
    \ Validation is a module. If there is another form-validation routine that also\
    \ uses the submit event, only one of the two routines should be executed. Therefore,\
    \ I overwrite any existing onsubmit event handlers with a qualm.\n\nThe main validation\
    \ function uses this keyword to find the correct form (after all, there can be\
    \ multiple forms on a single page), but the real action takes place on the form's\
    \ elements:\n\n[Form Validation, lines 73-74]\n\n```\nfunction validate() {\n\
    \  var els = this.elements;\n  // validate all elements\n```\n\nI use a second\
    \ event in Form Validation. When the script finds an error, it gives the offending\
    \ form field special styles. When the user changes the value of the form field,\
    \ I politely assume that she has corrected the error, and the special styles should\
    \ be removed.\n\nIn order to remove the styles, I use the event once more. If\
    \ the user changes the value, assume there is no more error:\n\n[Form Validation,\
    \ lines 108-110 and 122-129 condensed]\n\n```\nfunction handleError(obj,message)\
    \ {\n  obj.className += ' errorMessage';\n  obj.onchange = removeError;\n  //\
    \ administration\n}\n```"
