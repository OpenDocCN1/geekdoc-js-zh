    # B: Cross-window communication


    How do you establish cross-window communication? We''ve glanced at the `opener`
    property of popups and the availability of functions and variables in other windows,
    but in general, communication between two windows is possible only if two conditions
    are met:


    +   * Both windows contain pages that come from the same domain.

    * One window contains a reference to the other.


    The first condition is a result of JavaScript''s same-source policy, as discussed
    in 1B. You are not allowed to spy on windows that contain pages from another domain,
    since that would invade the user''s privacy.


    The second condition is more complicated: essentially, one of the windows must
    already know of the other''s existence. If neither of them is aware of the other,
    communication is impossible.


    If a user opens two browser windows and loads your site in both of them, JavaScript''s
    same-source policy is satisfied, but the windows don''t know of each other''s
    existence, and it is impossible to establish communication between them.


    In practice, cross-window communication is possible only if one window opens the
    other, or, in other words, if you create a popup window.


    # Opening popup windows


    You open a popup window with the `window.open()` method. It works as follows:


    ```

    window.open(''page.html'', ''popup'', ''width=300,height=400'');

    ```'
