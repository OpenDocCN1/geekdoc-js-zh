  md: "# Basic function syntax\n\nThis is a function from Site Survey. It is meant\
    \ to add hidden fields to a form:\n[Site Survey/popup.js, lines 49-56]\n\n```\n\
    function addInput(name,value) {\n  var mainForm = document.forms[0];\n  var newInput\
    \ = document.createElement('input');\n  // newInput.type = 'hidden';\n  newInput.name\
    \ = name;\n  newInput.value = value;\n  mainForm.appendChild(newInput);\n}\n```\n\
    \nThis example neatly highlights the most important syntactic requirements of\
    \ a function:\n\n+   - A function should be declared by using the function keyword.\
    \ If you don't use it, JavaScript has no way of knowing that you're declaring\
    \ a function.\n- After the function keyword comes the name of the function. You\
    \ use this name whenever you want to execute the function.\n- After the name come\
    \ required parentheses, which may contain arguments. Our example function has\
    \ two arguments, name and value, but you may use as many arguments as you like.\
    \ Arguments are separated by comma.\n- The statement(s) that comprise the function\
    \ body are contained in a function block delimited by curly braces {}.\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_239_0.png)"
  merge: -1
  pgno: 239
- img_proc: true
  md: 'The function is executed when you call it:


    The function is called by its name, functionName, followed by parentheses ().
    These parentheses are the JavaScript operator that gives the actual command to
    execute the function.


    The parentheses contain the arguments (here ''name'' and ''ppk''), separated by
    a comma. These arguments are passed to the function. Now the function does what
    it''s programmed to do; it creates a hidden form field with the name and value
    that were passed as arguments.


    # Arguments


    When you call a function (or tell it to run), you may also need to provide information
    for it to use. You pass these arguments to the function when you call it, and
    the function receives them in the variable(s) declared inside the parentheses.


    ```

    output(''name'', ''ppk'');

    function you addInput(name value)

    ```


    In the case of addInput(), the arguments contain the name and value of the new
    form field, and they are used in the function body:


    ```

    name = name;

    textInput.value = value;

    ```


    Of course you have to make sure that the function declaration and the calls use
    the same number and order of arguments.


    You can pass as many arguments to a function as you like, but in general I advise
    you to use as few as possible. Function declarations and calls with lots of arguments
    are generally hard to read, and decrease your code''s maintainability.'
  merge: -1
