- img_proc: true
  md: '> There''s one exception to the same-source rule. If your site is caught in
    else''s frameset, you are allowed to set (but not get!) top.location, or the location
    of the topmost frameset page. See http://www.quirksmode.org/js/framebust.html
    for more information.


    Therefore JavaScript has a strict same-source policy: Cross-window communication
    is allowed only when the pages in both windows come from the same Web domain.
    If that''s not the case, the browser gives a security error.


    This policy is very strict. Suppose I have two sub-domains, www.quirksmode.org
    and search.quirksmode.org. A page on the www domain opens a popup with a page
    on the search domain. Now the same-source policy kicks in and forbids any communication
    between the two windows, since they come from different (sub)domains.


    # document.domain


    There is one way in which I''m allowed to mitigate the same-source something.
    I can set document.domain property in both windows to ''quirksmode.org'':


    ```

    document.domain = ''quirksmode.org'';

    ```


    Now both pages consider themselves to come from quirksmode.org without any subdomain,
    and the www page and the search page are allowed to communicate with each other.


    Obviously, you may only set document.domain to a value that''s part of the real
    domain. This doesn''t work:


    ```

    document.domain = ''microsoft.com'';

    ```'
