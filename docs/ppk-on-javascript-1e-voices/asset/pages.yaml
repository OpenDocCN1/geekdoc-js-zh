  md: 'Since this is short-distance travel, and since the script moves entire <tr>s
    through the document but doesn''t touch the internal structure of the <tr>s, using
    parentNode.parentNode is safe.


    You''ll also use parentNode often when you change the document structure, because,
    as we see in B8, all methods you need for structure changes are defined on the
    parent node of the node you want to change. Suppose you want to remove the node
    with ID="testID" from the document:


    ```

    var x = document.getElementById(''testID'');

    x.parentNode.removeChild(x);

    ```


    First access the node (long range!), but in order to execute the removeChild()
    method, you have to move to its parent first.


    # Root nodes


    Finally, there are two special document properties that allow access to the <html>
    and <body> tags: document.documentElement and document.body. The first property
    exists in all XML documents, since every XML document must have a root element
    from which all other nodes descend. In HTML pages this is obviously the <html>
    tag.


    document.body is a special addition for HTML pages, since it is often useful to
    directly access the <body> tag.


    # C: Node information


    Every node has a few properties that contain a bit of information about the node.
    They are nodeName, nodeValue, nodeType, and tagName.


    # nodeName


    nodeName is the most useful property. Unexpectedly, it contains the name of the
    node. The name of an element node is always the tag name, and name'
