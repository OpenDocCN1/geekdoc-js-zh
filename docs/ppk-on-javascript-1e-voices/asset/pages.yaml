  md: 'JavaScript Core does not state which object becomes the global object; specific
    implementations are left to make that decision. Client-side JavaScript uses the
    window object:


    ```

    var exampleString = ''I am a JavaScript hacker''

    alert(window.exampleString);

    ```


    The variable exampleString is the exampleString property of the window object,
    and the alert works.


    In itself this is not really useful. You''ll rarely encounter situations in which
    saying window.exampleString is better than just saying exampleString. Nonetheless,
    it''s correct JavaScript.


    # K: Associative arrays


