  md: 'this form field. The rel custom attribute tells Usable Forms that the <tr>
    should be removed from the document, and also that it should be reinserted if
    the user checks/selects the form field à matching rel attribute.


    I call them custom attributes because custom-created them for the job. As a result,
    they are not valid HTML; the validation attribute is not a part of the HTML specification
    at all. rel is, but only on <a> and <link> tags. maxLength is valid, but only
    on <input> tag.


    This does not matter to JavaScript. The W3C DOM method getAttribute(), which we''ll
    discuss allow you to get the value of any attribute, whether it''s part of the
    HTML spec or not.


    Nonetheless, it might matter to you as a Web developer. If you have decided your
    pages should be perfectly valid (X)HTML, you cannot use custom attributes since
    the validator would choose on them.


    What''s more important? Valid (X)HTML or a custom attribute that closely operates
    with your script? This important decision is one you should make for yourself.
    To do you in this process, let''s discuss possible alternatives to the custom
    attributes of the three scripts.


    Form Validation does not need a custom attribute. The validation attribute can
    easily be rewritten as a class attribute:


    ```

    <input name="phone" class="required numeric" />

    ```


    This approach has clear advantages, although I didn''t realize that when I wrote
    the script back in 2003. Once you have a class="required numeric" you can easily
    add an extra style to the form field—for instance, an icon that communicates that
    the form field expects numeric input. Now you have available a series of class
    names that contain useful, semantic information about the form fields, such as
    "This field is required" and "This field is numeric."


    Therefore, if you move the values of validation to class, and then change .getAttribute(''validation'')
    to .className in Form Validation, the script works better than before.'
