    \n# Functions as values\n\nNow let's look at a more complicated example:\n\n```\n\
    var test = function () {\n  alert('Hello world!');\n}\nvar otherTest = test;\n\
    otherTest();\n```\n\nIn JavaScript, there is no fundamental difference between\
    \ functions and other values. In this example, the variable test refers to a function.\
    \ When the value of test is assigned to otherTest, otherTest becomes a function\
