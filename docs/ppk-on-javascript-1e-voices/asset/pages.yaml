  md: '# Keyboard users


    We already saw that keyboard users don''t generate mouse events (unless they also
    use a screen reader). Therefore, you should always define an alternative to mouse
    events. Sometimes it is simple, for instance, pairing the mouseover event with
    the focus event; and sometimes it''s more difficult, for instance, in a drag-and-drop
    script, where you''ll have to write extra functions in order to cater to keyboard
    users.


    We''ll discuss this more fully in 7B.


    # Clickable items


    Even if you create perfectly keyboard-accessible scripts, they are useless if
    the user cannot focus on the elements on which you''ve defined event handlers.


    Take Dropdown Menus. It uses a mouseover event to trigger the dropdowns, and in
    accordance with the previous rule I added focus events for keyboard users. However,
    in order to trigger the focus event, the keyboard user has to be able to focus
    on the dropdown menus. If that''s impossible, the script remains inaccessible.


    The only elements that reliably gain focus in all browsers are links, form fields,
    and buttons. Therefore, any keyboard-friendly event or script should be set on
    one of these HTML elements.


    Dropdown Menus does so; the focus events are applied to links. Since keyboard
    users can focus on links, the script remains accessible to them.


    # The <noscript> tag


    Browser vendors realized that Web developers might want to offer special content
    to users without JavaScript. In order to allow this, they invented the <noscript>
    tag.


    It works like this:


    +   Browsers that don''t support JavaScript don''t know this tag. Since unknown
    tags are ignored by HTML parsers, these browsers show the content of the tag:
    the noscript content.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '+   Browsers that support JavaScript check if JavaScript is enabled. If it
    is, they hide the <noscript> tag and its content from view; if not, the browser
    shows the content of the tag.


    Unfortunately, the tag doesn''t play an important role in modern accessibility.
    Plenty of browsers support antiquated versions of JavaScript, without the W3C
    DOM, XMLHttpRequest, or other modern goodies. These browsers will not show the
    content of the <noscript> tag because they support some (but not enough) JavaScript.
    Therefore their users, who should for all practical purposes be treated as noscript
    users, don''t see the scripted interface, but they don''t see the noscript extras.


    Therefore, it''s not best to use the tag at all.


    # G: The example scripts


    After all this theory, it''s time to study the usability and accessibility of
    the example scripts.


    Six out of eight example scripts offer significant usability enhancements over
    the unscripted page, and are therefore, worthwhile to use. We''ll treat the remaining
    two, Dropdown Menus and Site Survey, in time, and you''ll have to form your own
    opinion about their usability or lack thereof.


    Seven out of eight example scripts are accessible, and the remaining one, Edit
    Style Sheets, doesn''t have to be. Unfortunately, I made a few minor mistakes
    in Sandwich Picker that cause usability problems in the accessible noscript version.
    I could have removed them while preparing the script for this book, but decided
    not to because they highlight a few interesting accessibility solutions.


    # Textarea Maxlength


    When the user exceeds the 1250-character maximum length, the counter warns him.
    In addition, he can see how many characters he''s already typed. This is a small
    usability benefit.'
