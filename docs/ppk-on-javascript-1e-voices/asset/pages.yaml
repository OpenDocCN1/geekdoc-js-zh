  md: '# D: The <script> tag


    You have to include your scripts in the HTML page, and you have to start them
    at the right moment.


    You include scripts in your page by means of a <script> tag. This tag can be used
    in two ways:


    +   - You can give the tag an src attribute; the browser will automatically download
    the script from the indicated location.

    - You can insert JavaScript code between the <script></script> tags.


    Note that one <script> tag cannot fulfill both functions. It either imports an
    external file, or it contains JavaScript code.


    Of these two methods, the first one is clearly preferable. As we saw in 2C, unobtrusive
    scripting requiring your scripts to be totally separate from the HTML page, just
    as your CSS is totally separate. Therefore you should always import one or more
    .js files that contain the behavior layer of your site instead of directly writing
    your JavaScript commands in the HTML page.


    This also allows you to write one script file and use it on many pages. For instance,
    Dropdown Menu was written to be used in all pages on my client''s site, and was
    therefore included in all of them. Plus, if I change the .js file, these changes
    will automatically propagate to all pages in the site. This is a clear maintenance
    benefit.


    # Syntax


    <script> tags, whether they import an external file or contain JavaScript code,
    go in the <head> of the HTML document by custom. The HTML specification allows
    a <script> tag anywhere, and in the bad old days, inserting them in the <body>
    of a page (for instance to document.write() a few lines of HTML) was common. Despite
    all this, I generally advise you to put all <script> tags in the <head>, along
    with all CSS <link> tags. It keeps your code clean.'
  merge: -1
  pgno: 149
- img_proc: true
  md: "This is the syntax for including a script:\n\n```\n<head>\n  <title>Example\
    \ scripts - Sandwich Picker</title>\n  <link rel=\"stylesheet\" href=\"sandwiches.css\"\
    >\n  <script type=\"text/javascript\" src=\"sandwiches.js\"></script>\n</head>\n\
    ```\n\nThe `<script>` tag has an src attribute that points to the location of\
    \ the script and a `type=\"text/javascript\"` attribute that tells the browser\
    \ you're importing JavaScript. It also requires a closing tag: `</script>`.\n\n\
    You can also include scripts from other domains. JavaScript's same-source policy\
    \ (see 1B) doesn't apply to such scripts, since you, the Webmaster, explicitly\
    \ decide to include them and thus judge them to be safe.\n\n# language attribute\n\
    \nSometimes a language attribute attribute is added to the `<script>` tag. This\
    \ attribute serves to specify the exact JavaScript version being used. As we saw\
    \ in 1B, the JavaScript version number is not important, and you shouldn't use\
    \ it.\n\n# defer attribute\n\nThe purpose of the defer attribute is rather vague.\
    \ Officially it merely serves as an indication that the script being loaded does\
    \ not contain any commands that change the HTML, most importantly `document.write()`.\n\
    \n> DEFER IN EXPLORER\nInternet Explorer executes scripts with a defer attribute\
    \ only when the page has been completely loaded. At the time of writing it is\
