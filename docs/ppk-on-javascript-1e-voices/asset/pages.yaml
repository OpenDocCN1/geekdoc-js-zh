  md: '# Sandwich Picker


    Of all the example scripts I like this one best.


    In October 2004 I worked on a Website for my butcher, Keurslager Drost, who also
    owns a small but successful catering service. The site was meant to streamline
    catering orders, as well as give visitors an overview of his products.


    Ordering sandwiches was to become a major feature of the site. Since a full database
    solution was out of the question for budgetary reasons, the 100 or sandwiches
    would end up in one static HTML file, and users would have to be able to search
    through this huge list.


    With this in mind I created the Sandwich Picker script. A large data table contains
    all sandwiches, and two, initially empty, would contain the search results and
    the order information. A search box at the top of the page allows users to search
    for sandwiches, and the script moves the correct `<tr>`s to the top of the page,
    directly below the search box. I added a tiny order system, containing an ''order''
    and a ''remove'' button. Pressing these buttons would move the `<tr>` to the correct
    table. A price calculation script completed the page.


    The script offers an interesting example of interacting with the user by modifying
    the document structure, and it illustrates a few key points in the cooperation
    between JavaScript and CSS.


    # XMLHTTP Speed Meter


    In September 2005 Website Eend contracted me to create a script for a ADSL download
    speed meter for the ISP Wanadoo. The plan was extremely simple: users would enter
    their postal code and house number in a form, and an XMLHttpRequest script would
    silently send this data to a server side script that returned a bit of XML with
    the rough download speed the client could expect.


    The download speed was displayed as an animation that moved between the minimum
    and maximum speeds. Besides being graphically interesting, this animation would
    clearly show that the download speed was only an indication of what clients could
    expect, and not a definite promise. This was very important to Wanadoo, since
    an exact download speed is almost impossible to predict.'
