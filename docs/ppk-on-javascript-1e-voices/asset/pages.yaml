- img_proc: true
  md: 'The go() method allows you to specify how many pages you want the user to go
    forward (positive number) or backward (negative number). So this sends the user
    two pages backward:


    ```

    history.go(-2);

    ```


    There''s rarely a reason to send the user back more than one page, especially
    when you cannot find out page that was, so the go() method is seldom used.


    # History of separate windows


    Every window has a separate history. If you send the user on to a new window,
    its Back button doesn''t function, because the new window doesn''t yet have any
    pages in its history. And of course history.back() doesn''t work, either.


    The history of frames is even more complicated. Each frame has its history object,
    but so do the parent and top frames. When the user clicks the Back button, the
    browser window generally—but not always—undoes the most recent page change in
    one of its child frames. Unfortunately, this behavior is not totally reliable,
    and you shouldn''t write scripts that assume history.go() of the parent frame
    will undo all recent page changes in its child frames in the correct order.


    If you want to send the user back in the history of one specific frame, use the
    frame''s own history object:


    ```

    frames[1].history.back();

    ```


    # D: Window geometry


    The window object represents the graphical browser window the user sees on her
    computer screen. As such, the window object contains a few objects, methods, and
    properties that allow you to read out information about, or change, the graphical
    browser window.'
