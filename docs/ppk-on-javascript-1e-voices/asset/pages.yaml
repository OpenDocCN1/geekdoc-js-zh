  md: '# Setting event handlers


    The most important action the initialization function takes is registering event
    handlers. As far as the user is concerned, the script starts when-he-takes action
    and the page responds. But which action should he take?


    Usually, the correct event is obvious. Form Validation clearly needs the submit
