  md: "# status\n\nLet's first return to the onreadystchange event handler used in\
    \ sendRequest():\n[XMLHttpRequest Speed Meter, lines 120-138, condensed]\n\n```\n\
    function sendRequest(url,callback,postData) {\n  // more administration\n  req.onreadystchange\
