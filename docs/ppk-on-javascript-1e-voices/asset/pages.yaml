  md: '# SECTION A: THE STYLE PROPERTY 423


    ![](img/1cdc3bc9be02360dab81df06bea3c619_452_0.png)


    the style.width of the element to the new width. Then it adds + ''px'', because
    without that, the browsers wouldn''t know how to interpret the number, and would
