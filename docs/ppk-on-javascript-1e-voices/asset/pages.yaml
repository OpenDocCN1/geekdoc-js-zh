    # Getting styles


    > WARNING Browser incompatibilities ahead


    As we saw, the style property cannot read out styles in embedded, linked, or imported
    style sheets. Because Web developers occasionally need to read these styles nonetheless,
    both Microsoft and W3C have created ways of accessing non-inline styles. The Microsoft
    solution works only in Explorer, while the W3C standard works in Mozilla and Opera.


    Microsoft''s solution is the currentStyle property, which works exactly like the
    style property, except for two things:


    +   - It has access to all styles, not just the inline ones, and therefore reports
    the style that is actually applied to the element.

    - It is read-only; you cannot set it.'
