  md: '# XMLHTTP Speed Meter


    +   - Purpose: Show the estimated download speed as an animation.


    +   - User actions: The user enters her postal code and house number.


    +   - Feedback: An animation starts up and shows the estimated download speed.


    +   - Script knowledge: The script must catch the download speed (or error message)
    that the server returns.


    # HTML structure


    In all scripts we''ve discussed so far, I decided to store a significant amount
    of data in the HTML. This is not necessary with XMLHTTP Speed Meter; here, the
    data is pulled from the server by an XMLHttpRequest.


    Therefore the only important point in the HTML structure was the animation. I
    decided to always show a grey background image, and to overlay it with an element
    that has a green background image. The animation would consist of changing the
    width of this element.


    The script uses a few ids as hooks, and I assign a submit event to the only form
    in the page.


    # Script structure


    This script has two distinct modules:


    +   - The XMLHttpRequest module fetches data from the server.


    +   - The animation module receives this data and shows it as an animation.


    I developed each independently; their only point of connection is that the XMLHTTP
    module passes the data (the download speed) to the animation module.


    We''ll discuss the animation module in 9G and the XMLHttpRequest module in Chapter
    10.'
