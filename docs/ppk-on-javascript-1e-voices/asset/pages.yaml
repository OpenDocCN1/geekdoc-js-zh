  md: "# The danger\n\nTo explain why this is dangerous, let's take another look at\
    \ Usable Forms.\nWhen the script starts up, it has to go through all `<tr>` (or\
    \ `<div>`) tags of the document and move those elements with a `rel` attribute\
    \ to the waiting room.\nSuperficially, this seems simple:\n\n> [Usable Forms,\
    \ lines 1, 11, and 25-34 condensed and changed]\n\n```\nvar containerTag = 'TR';\n\
    var waitingRoom = document.createElement('div');\nvar containers = document.getElementsByTagName(containerTag);\n\
    for (var i=0;i<containers.length;i++) {\n  if (containers[i].getAttribute('rel'))\
    \ {\n    // do some administration\n    waitingRoom.appendChild(containers[i]);\n\
    \  }\n}\n```\n\nNote that the waiting room is not a part of the document. Say\
    \ that the second `<tr>` in the document is the first one with a `rel` attribute.\
    \ When the script reaches the second `<tr>` (with index 1), it sends it to the\
    \ waiting room, i.e., outside the document. It then moves on to index 2 and checks\
    \ again.\n\nThe problem is that the nodeList immediately updates and therefore\
    \ the index numbering of the `<tr>`s has changed! We removed the second `<tr>`\
    \ (x[1]), but this means that the third `<tr>` (x[2]) has become the second one\
    \ (x[1]). Since the script moves on index 2, it now checks this `<tr>`, and continues\
    \ with the fourth `<tr>` (which was x[3], and is now x[2]).\n\nThat's why nodeLists\
    \ are so dangerously dynamic. While looping through all elements of a nodeList,\
    \ you should **never** add or remove these elements to or from the document, or\
    \ even move them, because doing so messes up your `for()` loops and results in\
    \ very odd bugs."
