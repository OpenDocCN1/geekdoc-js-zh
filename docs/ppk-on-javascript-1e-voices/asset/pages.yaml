    # G: Attributes


    Attributes are a bit odd. Although officially they''re nodes, they are not fully-fledged
    parts of the document tree and do not appear in, for instance, the childNodes
    list of their parent node. Furthermore, many common HTML attributes, like the
    src of an <img> or the href of an <a>, are also JavaScript properties, which means
    you don''t need the W3C DOM attribute methods to read or change them. Finally,
    the handling of attributes is the area of the W3C DOM that contains most browser
    incompatibilities, and only about 20% of this part of the specification actually
    works correctly in all browsers.


    Attributes are always name/value pairs. Take a well-known attribute:


    ```

    <img src="pix/theImage.gif" />

    ```


    The name of the attribute is src, and its value is "pix/theImage.gif". Unsurprisingly,
    all attributes have a name and a value property that give you the name and value
    of the attribute.


    | ATTRIBUTES, PROPERTIES, BROWSER COMPATIBILITY |

    | I do not treat any W3C DOM attribute method or property except for elements,
    and because most of them are subject to one browser bug or another (and therefore
    useless). You can study the W3C DOM browser-compatibility tables at www.quirksmode.org.
    |


    89'
