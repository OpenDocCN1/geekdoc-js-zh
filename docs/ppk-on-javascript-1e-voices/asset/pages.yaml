  md: '# Converting to boolean


    JavaScript has rules to convert every data type into every other data type. You''ll
    rarely need most of these rules—situations in which you want to convert an object
    to a number are not very common. However, converting the other data types to booleans
    forms the basis of object detection, as we discussed in 3C.


    These are the rules for converting other data types to booleans:


    +   - The values `null` and `undefined` become `false`.

    - The numbers `NaN` become `false`.

    - An empty string `''''` becomes `false`.

    - All other values become `true`.


    We''ll get back to this important conversion in 5G.


    # Explicit data-type conversion


    I demonstrated this line of code earlier. It''s an example of explicit data-type
    conversion:


    ```

    var c = a + (b*1);

    ```


    The idea is straightforward: perform the simplest possible operation that converts
    the variable to the desired data type. Multiplying by 1 is one simple way of converting
    a string to a number. Subtracting O is another:


    ```

    var c = a + (b-0);

    ```


    You can convert a variable to a string by concatenating it with an empty string:


    ```

    var string = number_or_boolean_or_object + '''';

    ```


    Converting a variable to a boolean is best done by performing the NOT (!!) operation
    twice:


    ```

    var boolean = !!number_or_string_or_object;

    ```


    We''ll take a closer look at this operation in 5G.'
