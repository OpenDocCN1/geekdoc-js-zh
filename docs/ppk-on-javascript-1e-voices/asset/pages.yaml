  md: "Besides, it was relatively easy to get browser vendors to start working on\
    \ their CSS implementation because it was a new technology that was not yet weighed\
    \ down by millions of implementations on millions of sites. In contrast, JavaScript\
    \ was hampered by the countless existing implementations of the browser-specific\
    \ document.layers and document.all DOMs we briefly discussed in 1C. CSS offered\
    \ the possibility of a clean slate.\n\nOne of the drawbacks of this focus on CSS\
    \ was that, in the minds of standards supporters, JavaScript became equated with\
    \ “inaccessible.” You'll still encounter this misconception every now and then,\
    \ even though, as we'll see later in this chapter, JavaScript and accessibility\
    \ can co-exist in harmony, as long as you take some precautions.\n\n# Unobtrusive\
    \ scripting\n\nIn 2002, Stuart Langridge coined the term “unobtrusive scripting,”\
    \ which represented the first serious attempt to embed JavaScript in the new theory\
    \ of CSS-based, standards-compliant Web sites.\n\nAn unobtrusive script should\
    \ have all of the following traits: \n\n+   - It should be usable, i.e., it should\
    \ confer a definite usability benefit on the site.\n\n+   - It should be accessible,\
    \ i.e., if JavaScript doesn't work, the page should remain readable and understandable,\
    \ although the loss of some usability is inevitable.\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_58_0.png)"
  merge: -1
  pgno: 58
- img_proc: true
  md: '+   - It should be easy to implement, typically, a Web developer has only to
    include the script itself and add a JavaScript hook’in the document, and the script
    works. We’ll discuss JavaScript hooks in 4B.


    +   - It should be separate; it resides in its own .js file instead of being scattered-through
    the HTML.


    In theory the first idea has been present since JavaScript’s birth, but it has
    usually been disregarded by programmers eager to show off JavaScript’s capabilities.
    Never mind if these capabilities don''t confer a usability benefit—they’re cool!


    The other three ideas were new. Accessibility and JavaScript were generally held
    to be mutually exclusive, and most old-school JavaScript developers decided that
    their applications were too advanced to ever become accessible. That’s nonsense,
    of course, but it is powerful nonsense that has held JavaScript in thrall for
    too many years. We’ll discuss JavaScript and accessibility in 2E.


    Ease of implementation requires JavaScript hooks, and they became possible only
    with the advent of the W3C DOM. This was the sole idea that was new for technical
    rather than psychological reasons. See 4B for more information.


    Separation, lastly, was an idea borrowed from the CSS revolution. If you should
    separate your HTML and CSS, it’s logical to separate your JavaScript from both
    of them. Before we can discuss the three kinds of separation, we first have to
    study what we’re going to separate.


    # The three layers


    A Web page consists of three layers (and yes, these are the ones that need to
    be separated from each other):


    +   1. HTML structure.


    +   2. CSS presentation.


    +   3. JavaScript behavior.'
  merge: -1
