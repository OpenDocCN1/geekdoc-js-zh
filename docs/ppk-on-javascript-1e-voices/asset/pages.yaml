  md: '# The version number


    Explorer and Opera allow you to find their version number directly after the substring
    you were looking for (''Opera'', ''MSIE''). Ignore the first character of the
    substring (it''s always a space) and take the number that appears from the second
    character onwards.


    See again Opera''s string:


    ```

    Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; en) Opera 8.54

    ```


    It disguises itself as Explorer 6, yet it is really Opera 8.54. Both version numbers
    are separated from the identification substring by a space.


    Of course this rule does not work in any other browser. Putting the version number
    immediately after the browser name would be a dead giveaway, and navigator.userAgent
    is supposed to be shrouded in mystery.


    # The operating system


    The Windows operating system can be identified by the string ''Win''. Note that
    some browsers say ''Windows'', and others ''Win''.


    The Mac operating system can be identified by the string ''Mac''. Here, some local
    variation is possible.


    There is no general detect for Linux/Unix; I usually assume that any OS''s not
    Windows or Mac must be a flavor of Unix. That''s not always true, but minor players
    like Amiga and BeOS are so rare that they can safely be discounted.


    Of course these rules apply if the browser hasn''t disguised itself as another
    browser on another platform (such as Explorer 6 on Windows XP).


