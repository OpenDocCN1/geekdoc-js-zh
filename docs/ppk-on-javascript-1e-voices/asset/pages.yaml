- img_proc: true
  md: 'Cookies are small text files that are stored on the user''s computer. They
    are related to certain directories in a certain Web domain, and when the user''s
    browser requests a page from these directories, the cookies are automatically
    sent with the HTTP request. It''s up to the server to do something with the information
    the cookies carry.


    You can also set and retrieve cookies in JavaScript, and I do so in Edit Style
    Sheet and Site Survey. In both cases I want to remember certain information. In
    Edit Style Sheet I want to know which CSS selector the user was editing the last
    time he visited the page, so that I can automatically set the form to this selector,
    and the user can continue where he left off.


    In Site Survey I want to know if the user has been selected for the survey or
    not. If a user comes a page containing Site Survey for the first time, the script
    randomly determines whether or not the user is selected for the survey. If he
    is, the script makes sure that the popup appears in the way we''ve discussed in
    6B.


    # name/value


    The actual information of a cookie is contained in a name/value pair. The name
    is what makes a cookie unique for a given path: if you set a new cookie with the
    same name, the old cookie is overwritten.


    In Site Survey, the name/value pair is "ST_status=yes" if the user is selected
    for the survey, or "ST_status=no" if he''s not selected.


    Every subsequent time the user loads a page that contains Site Survey, the cookie
    is present, and the script uses the information contained in it to decide what
    to do next.


    # Expiry date


    Cookies have an expiry date after which they are no longer associated with the
    site and are lost. If you don''t define an expiry date, the cookie is lost when
    the current browser session ends; i.e., when the user closes his browser. If you
    define an expiry date in the past, the cookie is removed immediately.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'Expiry dates are set for GMT (Greenwich time) in the following format:


    Tue, 23 Jan 2007 13:57:39 UTC


    It''s in this expiry date that the Site Survey ’yes and ’no cookies differ. If
    the user has been selected for the survey, the script sets the expiry date to
    the end of the survey period, so that the user is never bothered again. If he
    hasn''t been selected, on the other hand, the script sets the expiry date to one
    day after the cookie was set.


    I did deliberately. The client and I agreed that if a user not selected for the
    survey visits the site at least one day later, he is once eligible for selection.
    In order to do this, the ’no cookie has to be removed after a day; i.e., its expiry
    date has to be set to one day after it was created.


    # domain and path


    You can set cookies only for your site''s domain, and by default they''re only
    set for the path (usually the directory) of the page that sets them.


    For instance, on www.quirksmode.org/js/cookies.html I set a few cookies to help
    my readers understand. If I did nothing, these cookies would only be associated
    with pages in www.quirksmode.org/js/ and its subdirectories.


    Usually this is too restrictive. In general you want to associate your cookies
    with all pages on your site. All cookies have a path that contains the directory
    path they''re associated with. If I set path=, all cookies are associated with
    the Web root of the server and all its subdirectories\in other words, the entire
    site. This is what you want.


    You can''t associate cookies with another domain. For example, since I set my
    test cookies in the domain www.quirksmode.org, they cannot be associated with,
    say, www.google.com or www.microsoft.com: only Google and Microsoft are allowed
    to set cookies for their domains. This is a security feature.'
