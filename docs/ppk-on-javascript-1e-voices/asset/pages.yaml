    \ is defined on. Take a look at a simple test object we studied a while break:\n\
    \n```\nvar test = new Object();\ntest.a = 2;\ntest.b = '2';\ntest.c = function\
    \ () {\n  alert(this.a * this); // was alert(test.a * test.b);\n}\n```\n\nI replaced\
