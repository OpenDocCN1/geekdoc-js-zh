  md: '# Changing the tree


    The W3C DOM allows you to change the node tree of a document. The following-snippet
    changes the document tree:


    ```

    var x = document.getElementsByTagName(''h1'')[0];

    var y = document.getElementsByTagName(''p'')[0];

    x.parentNode.insertBefore(y,x);

    ```


    ![](img/1cdc3bc9be02360dab81df06bea3c619_383_0.png)


    > FIGURE 8.2

    The DOM tree as rendered by the browser (above) and after (below) the script has
    run.


    The `<h1>` and `<p>` nodes now trade places, both in the DOM tree and in the browser
    window. This shows the great power of the W3C DOM: any change to the tree is immediately
    rendered by the browser and becomes visible to your users.


    # Creating elements


    The W3C DOM also allows you to create new elements and insert them in the document
    tree. This means that you can add anything to the document: status texts, new
    data obtained from an XMLHttpRequest script (see Chapter 10), or anything else
    that strikes your fancy.


    It''s even possible to completely rewrite an HTML page. Just remove all nodes
    in the document and append new nodes to it, including, if you wish, new'
  merge: -1
  pgno: 383
- img_proc: true
  md: "sheets and JavaScript files. This is rarely done; it's usually easier to simply\n\
    load a new page, but the W3C DOM allows it.\n\n# B: Finding elements\n\nThe first\
    \ step in any DOM script is finding the elements you want to do some-\nthing with.\
    \ There are two ways of finding elements:\n\n+   * Through the `getElementById()`\
    \ and `getElementsByTagName()` methods.\n  This is the best choice for searching\
    \ long-distance through the entire\ndocument.\n\n+   * Through the `parentNode`\
    \ and similar properties of an element. This is the\n  best choice for short-distance\
    \ travels from node to node.\n\n# Long-distance travel\n\nWhen you start up, you\
    \ usually want to find some HTML elements\nsomewhere in the document. The two\
    \ methods `getElementById()` and\n`getElementsByTagName()`, which we've already\
    \ seen in many code examples\nin the previous chapters, can find any HTML element\
    \ in the entire document,\nprovided you give them correct instructions.\n\nThese\
    \ two methods largely ignore the document structure. If you want to find\nall\
    \ `<p>` in the document, it doesn't really matter if they are direct children\
    \ of\nt`<body>` or children of `<div>` or other elements; you just want to get\
    \ them\nall. Similarly, `getElementById()` always returns the correct element,\
    \ wherever\nit may be hidden in the document structure. Therefore, these two methods\
    \ are\nt ones you need for \"long-distance\" searching: they give you the HTML\
    \ ele-\nents you need regardless of where they are in the document.\n\n# getElementById\n\
    \nThe `getElementById()` method returns the element that has the ID specified\
    \ in\nt argument:\n\n```\ndocument.getElementById('someID');\n```"
  merge: -1
  pgno: 384
- img_proc: true
  md: "356 | CHAPTER 8: DOM\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_385_0.png)\n\
    \n# getElementsByTagName\n\ngetElementsByTagName() method returns a nodeList (and\
    \ not an array!) of all elements with the desired tag name that are descendants\
    \ of the element on which you use the method. We'll discuss nodeLists in detail\
    \ in 8i. Once we have a nodeList, go through all elements in it and do something\
    \ with them, for instance, checking if they have a certain attribute, or setting\
    \ an event handler.\n\ngetElementsByTagName() can be used on any HTML element,\
    \ as well as the document. Both of these calls are valid:\n\n```\ndocument.getElementsByTagName('p');\n\
    document.getElementById('someID').getElementsByTagName('p');\n```\n\nThe first\
    \ call returns a nodeList of all <p> elements in the document, while the second\
    \ one returns a nodeList of all <p> elements that are descendants of the element\
    \ with ID=\"someID\".\n\nWe usually store such a nodeList in a variable:\n\n```\n\
    var pars = document.getElementsByTagName('p');\n```\n\nNow pars contains a list\
    \ of all individual <p>s in the page, and we can access them by their index numbers.\
    \ The first <p> has index 0, the second index 1, etc. the most common use of getElementsByTagName()\
    \ is requesting all tags of a certain type in order to loop through them.\n\n\
    ```\nvar pars = document.getElementsByTagName('p');\nfor (var i=0;i<pars.length;i++)\
    \ {\n  // do something with pars[i]; ie: with every paragraph\n}\n```"
  merge: -1
