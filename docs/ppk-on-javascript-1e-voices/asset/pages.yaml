  md: "# Level O DOM nodeLists\n\nThe Level O DOM also works with nodeLists, but they\
    \ differ from Level 1 DOM nodeLists in four important respects:\n\n+   - Level\
    \ O DOM nodeLists are available only for a limited number of elements, most importantly\
    \ form fields, images, and links.\n- Level O DOM nodeLists allow you to search\
