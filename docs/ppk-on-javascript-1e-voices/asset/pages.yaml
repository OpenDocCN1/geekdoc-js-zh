  md: 'All scripts use the Core language, Events, and the DOM, because all scripts
    must be a program (Core), must wait for the user to do something (Events), and
    must update the page somehow to give feedback (DOM).


    # Standardization


    Standards-wise, JavaScript is a bit of a patchwork, and in order to understand
    the reasons for this you need a quick historical summary. (JavaScript''s full
    story will be told in 1C.)


    # De facto Netscape 3 standard


    JavaScript was invented and first implemented by Netscape, which back in 1996
    was the leading browser. Then other browsers, such as Explorer, entered the market.
    In order to ensure that all existing Web sites functioned correctly, they were
    forced to copy Netscape''s JavaScript implementation exactly.


    Therefore, even all JavaScript browsers support the de facto Netscape 3 standard
    [Wait, the text says] "forced to copy Netscape''s JavaScript implementation exactly.


    Therefore, even all JavaScript browsers support the de facto Netscape 3 standard.
    It consists of Core 1.1, BOM, the traditional event model, and the Level 0 DOM.
    Back in those days CSS modification and data retrieval weren''t invented yet,
    so they''re not part of this standard. Nowadays the standard is distinctly antiquated,
    but since millions of Web pages still use old-fashioned Netscape 3 scripts, no
    browser can afford to relinquish this standard.


    Then followed the Browser Wars, during which Microsoft and Netscape struggled
    for pre-eminence in the browser market and made a distinct point of being incompatible
    as possible. It took JavaScript many years to recover from this oral, and we''re
    still suffering the consequences, especially in handling.


    # Modern standards


    In order to understand the modern standards we first have to discuss a fundamental
    distinction between Core and the DOM (which includes event handling and CSS modification).'
