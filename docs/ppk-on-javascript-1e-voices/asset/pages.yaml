  md: '# The screen object


    The screen object contains information about the user''s computer screen. screen.width
    and screen.height properties give the screen resolution, screen.availWidth and
    screen.availHeight give the available screen resolution, i.e., the screen resolution
    minus taskbars and such.


    screen.colorPrimary gives the number of bits per pixel the computer screen handle:
    screen.pixelDepth gives the same information, but doesn''t work in Explorer.


    These properties are often a part of detection scripts, such as Site Survey, in
    which it is important to gather information about the computer and browser the
    visitor is using. Other than in scripts, the screen object has no real use.


    # Window dimensions


    A set of properties contains information about the window dimensions. The most
    important are window.innerWidth and window.innerHeight, which set the window dimensions.


    Nowadays we don''t need these properties, because all browsers have made this
    information available elsewhere. We''ll discuss the right way to read out window
    dimensions in 9H.


    # Moving, resizing, and scrolling the window


    The window object has two methods to move the window, and two methods to resize
    the window, and two methods to scroll the window. They are moveTo(), moveBy(),
