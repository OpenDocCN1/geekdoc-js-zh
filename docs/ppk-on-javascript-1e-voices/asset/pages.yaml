  md: '# D: Separation of behavior and presentation


    > When I talk about "nosccript users" I mean those whose browser, for whatever
    reason, does not support enough JavaScript to use a scripted interface. This may
    be because their browser doesn''t support JavaScript at all, or because their
    browser supports some JavaScript, but not enough. Netscape 4 is a good example
    of the latter category.


    The third separation, that of behavior and presentation, is unfortunately more
    complex than the previous two. Don''t expect clear answers in this section; this
    separation is one of the areas of modern JavaScript that has not yet crystallized
    into a set of easily learned and understood rules. Right now we have more questions
    than answers.


    The basic question is: which effects should you define in CSS and which ones in
    JavaScript? Although the answer might seem obvious—presentation goes in the CSS
    and behavior in the JavaScript—there are gray areas where CSS and JavaScript overlap,
    and where it''s unclear if a certain effect is presentation or behavior.


    # Dropdown Menu—hover or mouseover/out?


    Dropdown Menu''s purpose is to show submenus when the user mouses over a main
    menu item and hide them when the user mouses out again, and since time immorial
    (1997, to be exact) we''ve used JavaScript to obtain this effect. Back then there
    were no other options; if you wanted a dropdown menu you needed JavaScript.'
  merge: -1
