  md: '# Arrays and nodeLists


    The example scripts contain a few arrays, but most of them are meant to shore
    up the deliberate weaknesses of a data type that superficially resembles the array
    but is in fact quite different: the W3C DOM nodeList.


    Take this bit of code:


    ```

    var x = document.getElementsByTagName(''p'');

    var y = x[2];

    ```


    x is a list that holds references to all <p> tags in the document, and just as
    in arrays, x[2] means the third element of array x, or the third paragraph in
    the document. I use this feature of the nodeList regularly.


    Nonetheless, nodeLists are not arrays. For now it''s best to see them as read-only
    arrays that lack all useful methods that the Array object defines. In this we''ll
    see that, nodeLists appear to be rather static and boring from an array perspective,
    they are in fact highly, even dangerously, dynamic.


    # length


    Every array has a length property that holds the number of elements in the array.
    Let''s return to our test array:


    ```

    var testArray = [0,1,''2'',''three'',false];

    alert(testArray.length);

    ```


    As you''d expect, the array shows 5. testArray has five elements with index numbers
    0, 1, 2, 3, and 4. The length property is automatically updated whenever you add
    or remove elements to or from the array.


    You are even allowed to set the length property:


    ```

    var testArray = [0,1,''2'',''three'',false];

    testArray.length = 0;

    alert(testArray[1]);

    ```'
