  md: "For instance:\n\n```\nvar x = document.getElementById('test');\nalert(x.currentStyle.color);\n\
    ```\n\nThe alert shows the current color style of the element, regardless of where\
    \ it's defined.\n\nW3C's solution is the window.getComputedStyle() method, which\
    \ works similarly but with a more complicated syntax:\n\n```\nvar x = document.getElementById('test');\n\
    alert(window.getComputedStyle(x,null).color);\n```\n\ngetComputedStyle() always\
    \ returns a pixel value, even if the original style was, instance, 50em or 11%.\n\
    \nAs always when we encounter incompatibilities, we need a bit of code branching\
    \ to satisfy all browsers:\n\n```\nfunction getRealStyle(id,styleName) {\n  var\
    \ element = document.getElementById(id);\n  var realStyle = null;\n  if (element.currentStyle)\n\
    \    realStyle = element.currentStyle[styleName];\nelse if (window.getComputedStyle)\n\
    \    realStyle = window.getComputedStyle(element,null)[styleName];\nreturn realStyle;\n\
    }\n```\n\nYou use this function as follows:\n\n```\nvar textDecoration = getRealStyle('test','textDecoration');\n\
    ```\n\nRemember that getComputedStyle() will always return a pixel value, while\
    \ currentStyle retains the unit specified in the CSS."
