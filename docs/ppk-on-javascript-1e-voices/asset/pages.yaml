    Sometimes you want to find the mouse position at the time the event took place.
    Poor you—you''re in a rough ride.


    There are six mouse-coordinate property pairs. All have an X and a Y component,
    which give the mouse coordinates in pixels. All inform you that the mouse X pixels
    to the right of and Y pixels below the reference point. A negative X means it''s
    left of the reference point; a negative Y means it''s above the reference point.


    Of course the question is: what is this reference point? Here''s where things
    turn sour. The reference points of the property pairs are as follows:


    | Pair | Reference point | Browser compatibility |

    | --- | --- | --- |

    | clientX, clientY | The browser window | All Safari |

    | layerX, layerY | A Browser Wars-style layer (the nearest absolutely positioned
    ancestor, or, if''s not there, the document) | Mozilla and Safari |

    | offsetX, offset | The event target | All but Mozilla |

    | pageX, pageY | The document | All but Explorer |

    | screenX, screenY | The computer screen | All browsers |

    | x, y | Various small fry. Don''t use it. There''s always a better choice. |
    Totally incompatible, not supported in Mozilla |'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'Let''s start with the good news: screenX and screenY work in browsers. Unfortunately,
    the information they contain is usually worthless: you rarely need to know the
    mouse position relative to the computer screen—well, maybe if you''re writing
    a complicated drag-and-drop script.


    Instead, you usually want to know the mouse position relative to the document.
    Often you need the coordinates because you want to place an element next to the
    mouse when the user mouses over a certain element. (Edit Style Sheet''s color
    picker is an example of this.) You can use pageX and pageY to find the mouse coordinates
    relative to the document, add or subtract a few pixels, and transfer them to the
    top and left style properties of an absolutely positioned element, and you''re
    ready for whatever comes next. This makes pageX and pageY is by far the most interesting
    and useful mouse coordinate property pair. But just to keep you on your toes,
    it''s not supported by Explorer.


    The second most useful pair is clientX and clientY, which gives the coordinates
    relative to the window (except in Safari, where they''re relative to the document).


    Fortunately, this pair gives us the possibility of working out the coordinates
    relative to the document in Explorer. If we add the scrolling offset of the page
    to the coordinates relative to the window, we can find the coordinates we need.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_348_0.png)


    FIGURE 7.6 The user clicks at the point indicated by the black box. We want to
    know the coordinates relative to the document, pageY contains them, but is not
    always supported. Another way of finding the same information is to add scrollTop
    to clientY.'
  merge: -1
