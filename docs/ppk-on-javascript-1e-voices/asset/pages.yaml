  md: "The if statement interprets this returned value as a boolean, which is false\
    \ if the value is null, and true otherwise. Therefore the textarea is initialized\
    \ only if it has a maxlength attribute.\n\nYou can also use several boolean operators\
    \ within the if statement. This allows you to perform quite complicated checks.\
    \ For instance, take a look at the most complex if statement in the example scripts,\
    \ from Usable Forms:\n\n[Usable Forms, lines 70-81, condensed]\n\n```\nvar e =\
    \ [event object];\ntvar tg = [target of event];\nif (IC(\n evtTarget.nodeName\
    \ == 'SELECT' && e.type == 'change'\n |\n evtTarget.nodeName == 'INPUT' &&\n evtTarget.getAttribute('rel'))\n\
    ) return;\n```\n\nIf the user clicks anywhere on the page or changes any select\
    \ box, a function is called. I want it to do something in only two cases:\n\n\
    +   - If the user has changed a select box, i.e., a change event has fired and\
    \ its target is a select box.\n\n+   - If the user has clicked on an input that\
    \ has a rel attribute.\n\nIf neither is the case, the function should end immediately\
    \ (return), and that's what the if checks for. Let's take apart:\n\n```\n(tg.nodeName\
    \ == 'SELECT' && e.type == 'change') // case 1\n```\n\nThis bit is true if the\
    \ target of the event is a <select> element AND the type of the event is change.\
    \ Let's call it 'case 1'.\n\n```\n(tg.nodeName == 'INPUT' && tg.getAttribute('rel'))\
    \ // case 2\n```\n\nThis bit is true if the target of the event is an <input>\
    \ element AND it has an attribute rel. Let's call it 'case 2'. So if it becomes:\n\
    \n```\nif (!(case 1 || case 2)) return;\n```"
  merge: -1
  pgno: 223
- img_proc: true
  md: "If both cases are false, the expression says:\n\n```\nif (!false || false))\
    \ return;\n```\n\nfalse || false is false, so it becomes:\n\n```\nif (!false)\
    \ return;\n```\n\nThe operator reverses this value to true. Therefore, the function\
    \ ends if neither of my requirements is met. That's exactly what I want.\n\nNow\
    \ suppose case 2 is true: the user has clicked on an <input> with a rel attribute.\
    \ The expression says:\n\n```\nif (!false || true)) return;\n```\n\nor:\n\n```\n\
    if (!true) return;\n```\n\nAgain, the operator reverses this value to false. Now\
    \ the return statement is not executed and the function does not end. That's also\
    \ exactly what I want.\n\n# else if and else\n\nif statements can be extended\
    \ with else if or else. Both are executed only when the original if statement\
    \ is not executed. else if means \"Now try this if,\" while else means \"In all\
    \ other cases.\"\n\nFor instance:\n\n```\nif (c == 4) {\n  alert('x is 4. Oh Joy!');\n\
    }\nelse {\n  alert('x is not 4. Too bad.');\n}\n```"
