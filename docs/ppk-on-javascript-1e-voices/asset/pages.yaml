  md: '# Omitting the {}


    You may omit the {} when an if, while, or for block contains only a single statement.
    For instance:


    ```

    if (x == 4)

    x = x * 2;

    ```


    If x is equal to 4, x is multiplied by 2. This is valid JavaScript. However, omitting
    the curly braces may lead to problems. Take this code; it''s not wrong, but it
    might not do what you expect:


    ```

    if (x == 4)

    x = x * 2

    alert(x);

    ```


    Again, if x is equal to 4, x is multiplied by 2. Then, whether x is equal to 4
    or not, x is alerted. In fact, JavaScript understands the code:


    ```

    if (x == 4) {

    x = x * 2

    alert(x);

    ```


    To prevent this sort of error, it''s best to always enclose if and for statements
    in curly braces.


    Note that function bodies must always be enclosed in curly braces, even if they
    contain only one statement.


    > DO AS I SAY

    \When you go through the example scripts you''ll see that I don''t always follow
    this rule. I often omit the {} in an if with only one single statement; and occasionally
    I encounter a bug because of that.


    This is one of the few times I''d like to ask you to do as I say, not as I do.'
