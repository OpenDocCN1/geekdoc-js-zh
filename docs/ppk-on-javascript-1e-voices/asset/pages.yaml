  md: '# selects and options


    Remember that common select boxes have type ''select-one'', not ''select''. This
    serves to distinguish from multiple selects, which are never used.


    Selects also have a `value` property, which takes the value of the selected option.
    Furthermore, they have a `selectedIndex` property that contains the number of
    the option the user has selected. Finally, they have an `options[]` nodeList that
    contains all options of the select.


    `options[]` is a unique nodeList because you''re allowed to add or remove elements,
    and these are added to or removed from the visible select box. Therefore, `options[]`
    is not equal to `getElementsByTagName(''option'')`, which is a normal read-only
    Level 1 DOM node.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_438_0.png)


    ![](img/1cdc3bc9be02360dab81df06bea3c619_438_1.png)'
