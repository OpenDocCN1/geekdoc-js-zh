  md: 'A certain `<ul>` does not have a class="menutree" the script ignores it and
    goes on to the next one.


    Although the class attribute might seem the ideal hook, I have two problems with
    it:


    +   - It already serves as the most important CSS hook.

    - Sometimes you need a name=value hook, and that''s pretty hard to pull off in
    a class.


    The first point is extremely subjective, the second less so. In the past I strongly
    felt that class was a CSS hook, and any JavaScript hook should use another attribute.
    It keeps presentation and behavior separated, and that cannot lead to clearer
    Web sites where every attribute serves a clear goal.


    Nonetheless, there''s a lot to say in favor of using the class attribute. It already
    has a certain meaning, "Deploy styles here." It could just as well say, "Deploy
    behavior here." Essentially the class can be both a CSS and a JavaScript hook.


    Dropdown Menu''s `<ul class="menutree">` is the best example. It serves both as
    a CSS and as a JavaScript hook. Thus you can initiate the dropdown menu and behavior
    also give the `<ul>` and its children the special styles any dropdown menu needs
    to be recognizable. We''ll see in a moment, Form Validation could also have benefited
    from a class hook.


    # Custom attributes


    Textarea Maxlength, Form Validation, and Usable Forms all use custom attributes
    for hooks, i.e., attributes that are not part of any (X)HTML specification.


    ```

    <textarea maxlength="300">

    <input name="phone" validation="required numeric" />

    <tr rel="othercategory">

    ```


    The maxlength custom attribute tells Textarea Maxlength that the `<textarea>`
    has a maximum length, and also what that maximum length is. The validation custom
    attribute tells Form Validation which checks should be performed on'
