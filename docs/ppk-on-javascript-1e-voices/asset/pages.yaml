  md: '# The NOT operator !


    The NOT operator reverses a boolean. If the variable is true it becomes false
    and vice versa:


    ```

    var z = !x;

    ```


    z is false, because x is true and the operator reverses that value.


    # The AND operator &&


    The AND operator takes two booleans and returns true if all are true. Otherwise
    it returns false:


    ```

    var z = x && y;

    ```


    z is false because y is false. For z to become true, both x and y have to be true.


    # The OR operator II


    The OR operator takes two booleans and returns false if all are false. Otherwise
    it returns true:


    ```

    var z = x || y;

    ```


    z is true because x is true. For z to become false, both x and y have to be false.


    > BITWISE OPERATORS & AND |

    JavaScript also contains the bitwise operators and (which perform bitwise AND
    and OR). If you don''t know what bitwise AND and OR are, don''t worry. You rarely
    need these operations in normal JavaScript.


    Just sure that you write && and || if you want to use the boolean AND and OR.'
  merge: -1
  pgno: 215
