  md: "# Deliberately omitting a break\n\nSometimes, however, omitting a break can\
    \ be exactly what you want. Take this example from Form Validation:\n\n[Form Validation,\
    \ lines 15-32]\n\n```\nfunction isRequired(obj) { // obj is the form field\n \
    \ switch (obj.type) {\n    case 'text':\n    case 'textarea':\n    case 'select-one':\n\
    \      if (obj.value)\n        return true;\n      return false;\n    case 'radio':\n\
    \      var radios = obj.form[obj.name];\n      for (var i=0;i<radios.length;i++)\
    \ {\n        if (radios[i].checked) return true;\n      }\n      return false;\n\
    \    case 'checkbox':\n      return obj.checked;\n  }\n}\n```\n\nI use a return\
    \ statement instead of break, but the return serves the same purpose—it ends the\
    \ case.\n\nNote the start of the function:\n\n```\ncase 'text':\ncase 'textarea':\n\
    case 'select-one':\n  if (obj.value)\n    return true;\n  return false;\n```"
