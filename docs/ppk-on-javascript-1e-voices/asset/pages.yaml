- img_proc: true
  md: 'The real power of these methods is that the strings they receive may contain
    non-numerical characters, as in these examples:


    ```

    alert(parseInt("3.54 apples")); // yields 3

    alert(parseFloat("3.54 apples")); // yields 3.54

    ```


    Both methods start at the left of the string; If the first character is not a
    number or a minus sign (or, in the case of parseFloat(), a decimal dot), they
    return NaN.


    If the first character is valid, the methods continue reading out the string until
    they encounter a non-numeric character (or, in the case of parseInt(), a decimal
    dot). Once they encounter such a character, they return the number they extracted.


    # F: Working with strings


    Strings are JavaScript''s most versatile data type, and you''ll manipulate them
    often.


    # Quotes


    A literal string is always surrounded by quotes. This alerts JavaScript to the
    fact that it''s a:


    ```

    var exampleString = "I am a JavaScript hacker"

    var exampleString2 = "49";

    ```


    As we already saw, the quotes make the second example a string, too, even though
    it happens to contain only numerical characters.


    JavaScript also allows you to use double quotes. So this, too, is perfectly valid
    JavaScript.


    ```

    var exampleString = "I am a JavaScript hacker"

    var exampleString2 = "49";

    ```'
