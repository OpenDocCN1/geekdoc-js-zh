    # Unraveling the browser string


    In light of the browser-detect arms race, treating the arcane of the browser string
    is essentially useless; every rule I mention can and will be broken by many browsers.
    Nevertheless I''ll give you a few examples in order to show you that browser detection
    is an exercise in futility.


    Here are a few browser strings. Try to unravel them:


    ```

    Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.7.12)

    Gecko/20050915

