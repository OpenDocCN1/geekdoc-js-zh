  md: 'It''s also possible to use a function reference instead of a string:


    ```

    setTimeout(myFunction,1000);

    ```


    Now the same thing happens. The advantage of this method is that your code is
    cleaner (no complicated quotes), but the disadvantage is that you cannot send
    arguments to the function.


    # clearTimeout


    It is also possible to cancel a timeout. To do this, you have to assign the timeout
    to a variable. After all, if you want to cancel it, JavaScript should be able
    to access the timeout.


    ```

    var myWeb = setTimeout(''myFunction''),1000);

    ```


    This line of code does exactly the same thing as the previous line. However, since
    we assigned the timeout to a variable, we can use the clearTimeout method to cancel
    the command:


    ```

    clearTimeout(myTimeout);

    ```


    If the timeout hasn''t yet taken place, it''s canceled, and myFunction() is not
    called.


    # Intervals


    Intervals are timeouts that are run repeatedly. This line commands myFunction()
    to be executed in 1000 milliseconds, and to repeat it every 1000 milliseconds
    until further notice:


    ```

    setInterval(''myFunction()'',1000);

    ```


    Just as with timeouts, you can cancel the interval:


    ```

    var myInterval = setInterval(''myFunction()'',1000);

    ```


    ```

    clearInterval(myInterval);

    ```'
