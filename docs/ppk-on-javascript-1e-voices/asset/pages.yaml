  md: '# A: The basics


    Let''s start with some JavaScript basics. Not is only is this a useful exercise
    for learning JavaScript, it will help you understand how a programming language
    works.


    # Case sensitivity


    Sacred tradition requires us to say "Hello world" before doing anything serious.
    Here goes:


    ```

    var test = ''Hello world'';

    alert(Test);

    ```


    We immediately encounter our first JavaScript error: Test is not defined.


    JavaScript is sensitive. The variable test is not the same as Test, so JavaScript
    doesn''t recognize it.


    Always care to write names such as getElementName with exactly the right mix of
    upper- and lowercase characters. If you even make the tiniest mistake (such as
    getElementById), JavaScript doesn''t understand what you mean.


    You''ll learn this JavaScript lesson the hard way.


    # Statements and the ;


    Every statement consists of a list of statements—commands that tell JavaScript
    to do something. Take this script:


    ```

    var test = ''Hello world'';

    alert(test);

    ```


    It contains two statements. The first tells JavaScript to create a variable test
    and to assign the string ''Hello world'' to it. The second tells JavaScript to
    create an alert box and display the value of test in it.


    As you see, I terminate every statement with a semicolon. This tells JavaScript
    that one statement has ended and any code that follows is part of a new'
