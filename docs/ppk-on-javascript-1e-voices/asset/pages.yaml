    # Edit Style Sheets


    This example script isn''t meant for the average user. It''s a site-administration
    script for Web masters, therefore, accessibility is not an issue. It''s perfectly
    acceptable to say that Web masters must use Explorer or Mozilla with JavaScript
    enabled in order to use the page.


    As to usability, it''s excellently suited for allowing people who don''t know
    anything about CSS to edit a style sheet. They immediately see the result of their
    actions, and that''s what counts.


    # Sandwich Picker


    From a usability perspective, I consider Sandwich Picker the best script in this
    book. It''s simple, obvious of quickly searching through a lot of items (and remember
    that the page I created for my client dealt about three times as many sandwiches
    as the example page I put on my site). Although it was born from necessity—the
    client didn''t have the money for a database-driven solution—I feel that Sandwich
    Picker can also be used in database-driven search sites to fine-tune the results.


    Unfortunately, I made a few errors on the page. Strictly speaking, it is accessible
    because the user can submit the form and thus order sandwiches—as long as he enters
    the sandwich names in the text area. Nonetheless, the usability of this noscript
    version suffers from a few problems.'
