  md: 'Note that the event is set not on the &lt;li&gt; itself but on the &lt;o&gt;
    that is its first child, because &lt;li&gt;s are unable to receive the keyboard
    focus.


    I do not use the blur event to simulate the딨, because it adds little to the overall
    user experience. If the user focuses on another link, all dropdown menus that
    are not children of this link are hidden anyway.


    By adding the focus event, I''ve made Dropdown Menus accessible as possible. Nonetheless,
    when you tab through the menu you''ll find it doesn''t behave quite the same as
    when you use the mouse. Besides, in order to reach the last link in it, you have
    to tab through all other links, while the mouse events allow you to take a shortcut.


    This user experience can be vastly improved by adding arrow-key navigation to
    the script. I didn''t do so, but the idea would be to register a general onkeydown
    event handler to all &lt;ul&gt;, and then to read out the arrow key it has pressed,
    and focus on the next (or previous) link.


    Since Dropdown Menu use event bubbling, all functions look for the event target
    and go on from there. In 7F we already discussed the extreme care you have to
    take when using event targets of trigger-happy events like mouseover.


    # Edit Style Sheet


    At first glance, Edit Style Sheet seems very similar to Usable Forms. The script
    should run whenever the user changes any value of any form field, and I could
    again have opted for a general click event.


