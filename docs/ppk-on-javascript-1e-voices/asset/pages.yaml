  md: "# Why browser detection doesn't work\n\nThe idea behind browser detection is\
    \ that you exclude those browsers in which you know your script will not work.\
    \ Essentially you take a blurry snapshot of browser compatibility patterns at\
    \ the time you create your script, and assume that this snapshot isn't blurry\
    \ and will remain accurate. But browser compatibility patterns are shifting constantly;\
    \ what's true today can be false tomorrow.\n\nLet's continue the document.stylesheets\
    \ example. You have found out that Opera doesn't support it and that Safari has\
    \ only read-only access, and you really decide to make sure these browsers won't\
    \ execute Edit Style.\n\nThis is wrong:\n\n```\nvar browser = [detect browser];\n\
    function initStyleChange () {\nif (browser == 'Opera' || browser == 'Safari')\n\
    return\nstart initialization\n```\n\nSure, Opera and Safari are now excluded from\
    \ the script. But what about Netscape 4? It doesn't support document.stylesheets,\
    \ but your browser detector doesn't stop it from trying to execute the script.\
    \ So you have to add it:\n\n```\nif (browser == 'Opera' || browser == 'Safari')\n\
    Il browser == 'Netscape 4')\nreturn;\n```\n\nAll fine and dandy, but iCab doesn't\
    \ support document.stylesheets either. Here we go again: \n\n```\nif (browser\
    \ == 'Opera' || browser == 'Safari')\nIl browser == 'Netscape 4' || browser ==\
    \ 'iCap')\nreturn\n```\n\nThis is getting ridiculous. You can never be certain\
    \ that your browser detect will catch all browsers, because there are simply too\
    \ many of them, and you can't test your script in all of them. As we've seen,\
    \ one well-placed object detection takes care of the whole problem, making it\
    \ obvious which method is better."
