- img_proc: true
  md: '# False start


    JavaScript was created by one man: Brendan Eich, then for Netscape Communications
    Corporation. Its public history starts with the release of Netscape 2 in March
    1996, but unfortunately it was a false start in more than one respect.


    Eich''s purpose in creating JavaScript was to give Web developers—not known for
    their technical prowess—an easy way to add bits of interactivity to pages. The
    idea was to copy scripts from other pages and tweak them a bit. In this respect
    he succeeded admirably: many JavaScript developers (including myself) started
    out as copy-pasters.


    Unfortunately JavaScript had the name LiveScript, but at the last possible moment
    its name was changed. This was done purely for marketing reasons: in 1996 Java
    was very popular, and Netscape thought it a good idea to ride on this popularity
    by choosing a similar name. Even worse, Netscape''s marketing managersさま referred
    Eich to "make the language look like Java.".


    The result was a language that superficially resembles Java in name and syntax
    and that is easy to learn by copy-pasting. This inevitably led people to discount
    JavaScript as a "dumbed-down" version of Java, as a cute little scripting language
    you could do a few tricks with that that wasn''t worth a serious programmer''s
    attention.


    We''re still suffering the consequences of this fatal misperception.


    # De facto standard


    Netscape 2, the first browser to support JavaScript, was a roaring success. Netscape
    3 followed pretty soon, and to everybody''s delight it supported even more functionality.


    Netscape 3 also gave JavaScript its first de facto standard. Although this is
    not an official specification promulgated by an official body like W3C, it is
    no less real: every browser that supports JavaScript also supports the de facto
    Netscape 3 standard.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'In 1996, Netscape 3 was the king of the hill. Web developers enthusiastically
    used its new functionalities and advanced features. Therefore, Netscape''s competitors,
    such as Microsoft''s Internet Explorer, had to support everything that Netscape
    supported. After all, who wanted a browser that didn''t support the cool stuff
    used on thousands of Web sites? This copycatting what made a de facto standard.


    This is an important theme in the Web''s history: once enough Web sites use a
    certain functionality, any browser must support that functionality and continue
    to support it indefinitely. If a browser doesn''t, users notice that their favorite
    sites don''t work, and they blame the browser they''re using, whether that''s
    fair or not.


    # The first thin phase


    In those early days, the browser was still definitely a thin client. Form validation
    and mouseovers are fine and dandy, but they don''t allow you to handle a significant
    amount of user interaction on the client. Users were forced to go back to the
    server time and again in to truly interact with Web sites. Back then that was
    no problem; no user expected otherwise.


    # The Browser Wars


    The browser market started to change rapidly. The first Internet hype began, and
    the Browser Wars were heating up. Who was going to rule the Web—Netscape or Explorer?


    ![](img/1cdc3bc9be02360dab81df06bea3c619_47_0.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Neither party was confident of winning the Wars with its version 3 browser,
    and therefore both decided to create an upgraded and extended versions 4.


    Unfortunately, Netscape''s and Microsoft''s CSS implementations did not match
    the standard—or each other—and that set the adoption of CSS by many years. Part
    of the reason was that the two competitors deliberately paid no attention to each
    other''s implementation, a state of affairs that also hindered JavaScript in those
    days.


    Both vendors W3C''s CSS specification, partly because they had shaped the specification,
    and partly because they were afraid that the competitor would support CSS and
    gain an advantage.


    A bunch of bargains and borders was not sufficiently cool to win the Browser Wars.
    Both browser vendors allowed JavaScript control over these CSS declarations. It
    was possible to use position:absolute to create a layer "on top of" the rest of
    the site, and continuously change its top and left properties to make it move
    across the screen. This was *seriously* cool stuff.


    > In the Netscape 4 model, any absolutely positioned element was called a layer.
    Even though the Microsoft model didn''t have an equivalent concept, it became
    custom to talk about layers when you meant absolutely positioned elements that
    moved across the screen.


    The Netscape 4 model had a slow and agonizing death, but the habit of talking
    about layers has remained. Nowadays it means an element that can be moved independently
    of the page''s content.'
