  md: '# CSS modification


    JAVASCRIPT ALLOWS YOU to modify the CSS presentation layer of your site. A style
    change is an excellent (and very common) way to draw your users’ eyes to the page
    element on which you want them to focus.


    In fact, seven of the example scripts use some form of CSS modification. For instance,
    Form Validation changes the styles of the incorrect form field, and XMLHttpRequest
    Speed Meter uses animations (i.e., many changes to the same style in a short time)
    to draw the eye of the user to the speed data. (Also, to be honest, a bit of eye
    candy.) Dropdown Menu use style changes to show and hide menu items. These changes
    all have the same purpose: to draw the eye of the user to these elements.'
  merge: -1
  pgno: 448
- img_proc: true
  md: 'JavaScript can modify CSS in four ways:


    +   - By modifying the style property of an element (element.style.margin = ''10%'').


    +   - By changing the class or id of an element (element.className = ''error'').
    The browser automatically applies the styles defined on the new class or id.


    +   - By writing new CSS instructions in the document (document.write(''<style>.accessibility{display:none}</style>'').


    +   - By changing the style sheet of the entire page.


    Most modification scripts use either the style property or a class/id change.
    The document.write method is used only in specialized situations to enhance the
    page''s accessibility. Finally, changing entire style sheets is rarely useful,
    because it''s not supported by all browsers, and because you usually want to single
    out specific elements for style changes.


    However, I use all four methods in the example scripts. We''ll look at all of
    them, and their proper context, in this chapter.


    # A: The style property


    The first, and best-known, way of modifying CSS is through the style property
    that all HTML elements possess, and that accesses their inline styles. style contains
    one property for every inline CSS declaration. If you want to set an element''s
    CSS margin, you use element.style.margin. If you want to set its CSS color, you
    use element.style.color. The JavaScript property always has a name similar to
    the CSS property.


    > Remember: the style property of an HTML element gives access to the inline styles
    of that element.'
  merge: -1
  pgno: 449
- img_proc: true
  md: "Let's review a bit of CSS theory. CSS offers four ways to define styles on\
    \ an element. You can use inline styles, where you put your CSS directly in the\
    \ style attribute of the HTML tag:\n\n```\n<p style=\"margin: 10%\">Text</p>\n\
    ```\n\nIn addition, you can embed, link to, or import a style sheet. However,\
    \ since an inline style is more specific than any other kind of style, inline\
    \ styles overrule defined in an embedded, linked, or imported style sheet. Because\
    \ the style property gives access to these inline styles, it will always override\
    \ other styles. That's the great strength of this method.\n\nHowever, when you\
    \ try to read styles, you might encounter problems. Take this example:\n\n```\n\
    <p id=\"test\">Text</p>\n#test {\n  margin: 10%;\n}\nalert(document.getElementById('test').style.margin);\n\
    ```\n\nThe test paragraph doesn't have any inline styles. Instead, the margin:\
    \ 10% is defined in an embedded (or linked or imported) style sheet, and is therefore\
    \ impossible to read through the style property. The alert remains empty.\n\n\
    In the next example, the alert will return a result of \"10%\", because margin\
    \ has now been defined as an inline style:\n\n```\n<p style=\"margin: 10%\" id=\"\
    test\">Text</p>\nalert(document.getElementById('test').style.margin);\n```\n\n\
    Thus, the style property is excellently suited for setting styles, but less-useful\
    \ for getting them. Later we'll discuss ways to get styles from an embedded, linked,\
    \ or imported style sheet."
  merge: -1
  pgno: 450
- img_proc: true
  md: "# Dashes\n\nMany CSS property names contain a dash, for instance font-size.\
    \ In JavaScript, however, a dash means “minus,” and therefore it cannot be used\
    \ in a property name. This gives an error:\n\n```\nelement.style.font-size = '120%';\n\
    ```\n\nDoes the browser have to subtract the (undefined) variable size from element.style.font?\
    \ If so, what does the = ‘120%’ bit mean? Instead, the browser expects a camelCase\
    \ property name:\n\n```\nelement.style.fontSize = '120%';\n```\n\nThe general\
    \ rule is that all dashes are removed from the CSS property names, and that the\
    \ character after a dash becomes uppercase. Thus margin-left becomes marginLeft,\
    \ text-decoration becomesDecoration, and border-left-style becomes borderStyle.\n\
    \n# Units\n\nMany numerical values in JavaScript need a unit, just as they do\
    \ in CSS. What does fontSize=120 mean? 120 pixels? 120 points? 120 percent? The\
    \ browser doesn’t know, and therefore it doesn’t do anything. The unit is necessary\
    \ to clarify your intent.\n\nTake the setInterval() function, which forms the\
    \ core of the animations in XMLHTTP Speed Meter:\n[XMLHTTP Speed Meter, lines\
    \ 70-73]\n\n```\nfunction setInterval(width) {\n  if (width < 0) width = 0;\n\
    \  document.getElementById('meter').style.width = width + 'px';\n}\n```\n\nThe\
    \ function is handed a value, and it should change the width of the meter to this\
    \ new value. After a safety check that allows only 0 or larger numbers, it sets"
  merge: -1
  pgno: 451
