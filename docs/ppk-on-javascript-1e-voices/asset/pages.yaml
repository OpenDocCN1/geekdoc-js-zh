- img_proc: true
  md: '# A: The CSS revolution


    As we saw in 1C, in 1998 (when Netscape and Explorer 4 couldn''t agree about anything),
    a group of concerned Web developers united in the Web Standards Project (WaSP),
    to do something about the ludicrous proprietary elements of JavaScript and to
    promote the use of CSS for defining the presentation of Web sites. Their main
    message was “Follow the standards,” and they aimed this message at both browser
    vendors and Web developers.


    At first, WaSP and its sympathizers concentrated on promoting CSS. There were
    various reasons for this, the most important being that using CSS in Web-site
    creation formed the clearest break with the past. JavaScript didn''t enter the
    equation, but because CSS was enough of a challenge to occupy the best minds in
    Web-development land for years, and because back in 1998 the average JavaScript
    was badly written, badly thought out, and completely inaccessible.


