  md: "# Helper functions\n\nIn order to defeat these rule-related browser incompatibilities,\
    \ we have to create two helper functions. Deletion is easy:\n\n```\nfunction deleteCSS(sheet,index)\
    \ {\n  if (sheet.deleteRule) {\n    sheet.deleteRule(index);\n  } else if (sheet.removeRule)\
    \ {\n    sheet.removeRule(index);\n  }\n}\n```\n\nInserting a rule is slightly\
    \ more complicated because of the different arguments the functions expect:\n\n\
    ```\nfunction insertCSS(sheet,selector,declarations,index) {\n  if (sheet.insertRule)\
    \ {\n    var toBeInserted = selector + \n      '{' + declarations + '';\n    sheet.insertRule(toBeInserted,index);\n\
    \  } else if (sheet.addRule) {\n    sheet.addRule(selector,declarations,index);\n\
    \  }\n}\n```\n\n# E: Comparison\n\nNow that we have studied all four CSS-modification\
    \ methods, we can ask ourselves which one is the best. The document.write method\
    \ should be used only in specialized accessibility-related cases. Changing an\
    \ entire style sheet is rarely useful. Therefore two methods remain useful. You\
    \ should use the style property, or change class or id values?\n\nTo get some\
    \ answers, let's take a look at the example scripts. Site Survey doesn't modify\
    \ CSS at all, Edit Style Sheet changes the entire style sheet, and Usable Forms\
    \ use the document.write method. Only XMLHTTP Speed Meter changes style properties,\
    \ while four scripts—Textarea Maxlength, Sandwich"
  merge: -1
  pgno: 472
- img_proc: true
  md: "Picker, Form Validation, and Dropdown Menu—use class changes. As you might\
    \ guess, I feel the class change is usually the superior CSS-modification technique.\n\
    \nIn my opinion, excessive reliance on the style property violates the separation\
    \ of presentation and behavior, and besides it's more complicated to code. Styles\
    \ belong in the CSS presentation layer—their natural habitat—not in either the\
    \ HTML structural layer or the JavaScript layer.\n\nWhen you change a style, you\
    \ are saying, \"Give this element a new presentation.\" Giving this command is\
    \ obviously a job for JavaScript. However, defining the new presentation is a\
    \ job for CSS. The new styles of the element, as well as the old ones, should\
    \ therefore be defined in the CSS file.\n\nThus presentation and behavior remain\
    \ separate: JavaScript gives the command to change styles, but it's up to the\
    \ CSS to define the new styles.\n\n# Example\n\nLet's take a look at a practical\
    \ example. Suppose I'd use the style property instead of a class change in Form\
    \ Validation:\n\n[Form Validation, lines 105-6 and 119-120, changed]\n\n```\n\
    function writeError(obj,message) {\n  obj.style.border = '1px solid #cc0000';\n\
    ```\n\n```\nfunction removeError() {\n  this.style.border = '';\n```\n\nOf this\
    \ work seems fine. But suppose later on the graphic designer decides the text\
    \ also to become red. You'd have to add two lines to your script:\n\n```\nfunction\
    \ writeError(obj,message) {\n  obj.style.border = '1px solid #cc0000';\n  obj.style.color\
    \ = '#cc0000';\n```\n\n```\nfunction removeError() {\n  this.style.border = '';\n\
    \  this.style.color = '';\n```"
