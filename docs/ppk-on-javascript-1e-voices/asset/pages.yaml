  md: "should not be closed, since the user is still mousing over it. If the menu\
    \ does\nnot contain the element, the user has moused out of it, and it should\
    \ be closed:\n[Dropdown Menu, lines 47-54, condensed]\n\n```\nfunction foldMenuIn(targetNode)\
    \ {\n  for (var i=0;i<currentlyOpenedMenus.length;i++) {\n    if (the menu does\
    \ NOT contain targetNode) {\n      // close menu\n    }\n  }\n}\n```\n\nThis function\
    \ is called onmouseover. When the user mouses over a new item,\nany menus associated\
    \ with other items should close. In this case, the element\nthe mouse moves to\
    \ is easy to find—it's the mouse's event target:\n[Dropdown Menu, line 32]\n\n\
    ```\nfoldMenuIn(evtTarget);\n```\n\nObviously, we should also call this onmouseout,\
    \ since a mouse\nmight also trigger menu closures. But how do we find the element\
    \ the mouse\nves to? The event's target is the element the mouse moves from, and\
    \ that\ninformation is useless.\n\n# relatedTarget, fromElement, and toElement\n\
    \nFortunately, the W3C and the Microsoft models allow you to find out which\n\
    element the mouse comes from. The W3C model defines the relatedTarget\nproperty\
    \ of the event object. This property refers to the object the mouse goes\nto (onmouseout)\
    \ or comes from (onmouseover).\n\nThe Microsoft model has two separate properties\
    \ for this information.\nfromElement refers to the object the mouse comes from\
