  md: '# Getting and setting attributes


    The W3C DOM has two or less reliable-attribute methods: getAttribute() and setAttribute().
    The first one is used often, the second rather less.

    Attribute() requires an attribute name and returns the value of that attribute.
    setAttribute() requires an attribute name and a value, and sets that attribute
    to the new value. This example:


    ```

    <img src="http://www.quirksmode.org/pix/logo.gif" id="test" />

    var imgEl = document.getElementById(''test'');

    alert(imgEl.getAttribute(''src''));

    imgEl.setAttribute(''src'',\n''http://www.quirksmode.org/pix/logo2.gif'');

    ```


    You access the <img> and ask for its src attribute. The browser returns the value
    of this attribute, and therefore the alert says http://www.quirksmode.org/logo.gif.
    Then you set the src attribute to a new value, and the image changes.


    If an attribute does not exist, getAttribute() returns null.


    # Custom attributes


    getAttribute() and setAttribute() work on any attribute an HTML tag contains,
    even custom ones, i.e., attributes that are not officially a part of any (X)HTML
    specification. I take advantage of this fact in Textarealength, Usable Forms,
    and Form Validation. All three scripts require the HTML coder to custom attributes
    to give the script instructions. We already discussed the use and dangers of custom
    attributes in 4B. In this chapter it''s enough to say that any HTML attribute
    is available through getAttribute().


    # Limitations


    > WARNING Browser incompatibilities ahead


    Unfortunately, these methods have a few problems in Explorer 6 and earlier. Many
    HTML tags have special attributes to store their inline styles (style) and'
