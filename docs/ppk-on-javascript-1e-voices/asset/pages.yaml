  md: '# Removing event handlers


    Both advanced models contain methods for removing event handlers. Let''s

    look at `removeEventListener()` and `detachEvent()`:


    ```

    removeEventListener(click, doThis, false); // W3C

    detachEvent(click, doThis); // Microsoft

    ```


    Now the `doThis()` event handler is removed from element x, and only

    `doThat()` is executed when the user clicks on the element.


    As you see, `removeEventListener()` takes the same arguments as

    addEventListener()`, and `removeEvent()` takes the same arguments as

    attachEvent()().


    # Disadvantage


    The advanced models have one disadvantage: it''s impossible to find out which

    event handlers have been registered on an element. Among other things, that

    means you can''t say “Now remove all onclick event handlers from element x."


    In the traditional method, this is possible:


    ```

    onclick = null;

    ```


    However, the advanced models require you to name the event-handling func-

    tion you want to remove. If you can''t do that because you''re not sure which

    event handlers are currently registered, you can''t remove the event handler.


    # addEventSimple()


    Unfortunately, neither of these advanced event-registration models is cross-

    browser. At the time of writing, Explorer supports only the Microsoft model,

    while Mozilla and Safari support only the W3C model. Opera supports both.


    As well when different browsers support different models, we need a bit of

    object detection. I generally use the two helper functions `addEventSimple()`

    and `removeEventSimple()` to do this job for me:'
