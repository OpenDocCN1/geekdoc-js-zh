  md: '# Mouse button


    WARNING Browser incompatibility alarm phase orange


    It''s also possible to read out the mouse button the user has clicked on. You
    can find this information in the button property. 99.9% of the mouse-button checks
    are about disabling the right mouse button (return false!) that the user can''t
    use View Source. You can use the button property to do this: if the user presses
    the right mouse button to bring up the context menu, button is 2.


    That''s the good news. The bad news is W3C''s specification for button is flat-out,
    although many browsers have implemented it regardless. Microsoft uses a proprietary
    system that''s much better than the standard.


    | Model | Left button | Middle button | Right button |

    | W3C | 0 | 1 | 2 |

    | Microsoft | 1 | 4 | 2 |


    What''s wrong with W3C''s system? The O. First of all, using the value O to indicate
    that something has happened is very odd. In my opinion, O should mean "no button
    pressed."


    The Microsoft system is a bitmask, which allows you to detect several buttons
    at once. For instance, when the user presses the left and right buttons simultaneously,
    button becomes 1 + 2 = 3; when he presses the right and middle buttons, it becomes
    2 + 4 = 6.


    W3C-compatible browsers don''t support this bitmask. Worse: they cannot support
    it, the O. Left + right buttons would become 0 + 2 = 2, the same as when the user
    clicks the right button only.


    I hope that a future version of the specification will use the Microsoft values,
    since they make sense. Fortunately, this difference doesn''t matter in practice,
    since you want to detect a right click in order to disable the View Source option.
    As I said, on a right click, button is 2 in all browsers.'
  merge: -1
  pgno: 351
