    \ are set and cleared in the most efficient way possible.\n\n# Dimensions and\
    \ position of elements\n\nTo wrap up this chapter, we will discuss how you can\
    \ find an element’s real\ndimensions and position in pixels.\n\n# Element dimensions\n\
    \nIn some situations, you need to find the exact dimension of an element—and\n\
