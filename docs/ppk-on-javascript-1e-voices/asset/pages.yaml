  md: '# Form field properties


    Every kind of form field has its own quirks, but before we discuss these we''ll
    take a look at five properties any form field possesses: type, form, disabled,
    name, and value.


    The type property of a form fields gives its type: text, hidden, textarea, checkbox,
    radio, select-one, select-multiple, file, submit, or reset. It is possible to
    change the type of a form field, but this does not work in all browsers, and is
    counter-indexed.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_435_0.png)


    Figure 8.20

    Form fields.


    The form property of a form field refers to its parent form, and because the <form>
    tag is usually not the parentNode of a form field, this simple property can be
    quite useful, as we will see when we discuss radio buttons.


    The disabled property contains a boolean that says whether the form field is disabled
    (true) or not (false). You can set disabled, and this will disable the form field
    so that the user cannot change it. Note, however, that a disabled form field is
    not sent back to the server, even if it contains a value.


    The last two properties are rather obvious: they give the name and the value of
    the form field.


    ```

    <input name="test" value="This is a test value" />

    ```'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'This field has name "test" and value "This is a test value". Of course the
    value is also the text contained in the form field, and if the user types a new
    text, the value changes. It is also possible to set the value:


    ```

    document.forms[0].elements[''test''].value = ''Changed value!'';

    ```


    The text in the form field is immediately updated. Changing the name of a field
    is not possible in all browsers, and I advise against it.


    # text, hidden, and textarea


    When you access a text field, hidden field, or textarea, you usually want to read
    out its value, which is contained in the value property.


    # checkboxes


    Checkboxes have a value, too, but usually you want to know if the user has checked
    the box. This information can be found in the checked property, which gives a
    boolean true or false (not checked).


    # radios


    Radios have a checked property, too, and it works the same as checkboxes. Nonetheless,
    radios are slightly more complicated than checkboxes, because you usually need
    to go through an entire array of radio buttons and see which one of them is checked.


    In order to work properly, all radio buttons that belong together have the same
    name attribute. The Level 0 DOM conveniently creates a nodeList keyed to this
    name so that you can easily access a group of radio buttons.


