  md: '# Shorthand styles


    WARNING Browser incompatibilities ahead


    Whether you get inline styles through the style property, or other styles through
    the function we just discussed, you''ll encounter problems when you try to read
    shorthand styles.


    Take this border declaration:


    ```

    <p id="test" style="border: 1px solid #cc0000;">Text</p>

    ```


    Since this is an inline style, you''d expect this line of code to work:


    ```

    alert(document.getElementById(''test'').style.border);

    ```


    Unfortunately, it doesn''t. The browsers disagree on the exact value they show
    in the alert.


    +   - Explorer 6.0 gives #cc0000 1px solid.

    - Mozilla 1.7.12 gives 1px solid rgb(204,0,0).

    - Opera 9 gives 1px solid #cc0000.

    - Safari 1.3 doesn''t give any border value.


    The problem is that border is a shorthand declaration. It secretly consists of
    no less than twelve styles: width, style, and color for the top, left, bottom,
    and right borders. Similarly, the font declaration is shorthand for font-size,
    font-family, font-weight, and line-height, so it exhibits similar problems.


    > Note the special color syntax Mozilla uses: rgb(204,0,0). This is a valid alternative
    to the traditional hex code, and you can use either syntax in CSS and JavaScript.'
  merge: -1
  pgno: 454
- img_proc: true
  md: "How is the browser supposed to handle such shorthand declarations? The example\
    \ above seems pretty straightforward; you would intuitively expect the browser\
    \ to return 1px solid #cc0000, exactly as the inline style attribute says. Unfortunately,\
    \ shorthand properties are more complicated than that.\n\nConsider the following\
    \ case:\n\n```\np {\n  border: 1px solid #cc0000;\n}\npp id=\"test\" style=\"\
