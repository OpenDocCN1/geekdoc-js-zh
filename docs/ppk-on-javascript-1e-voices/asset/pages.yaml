    Besides, you can''t trust what browsers say about themselves. They routinely disguise
    their identity in order to bypass browser detects.


    # The browser-detect arms race


    From the start of Web, every browser has a browser identification string. In JavaScript
    it''s stored in navigator.userAgent, and it''s also sent to the server as an HTTP
    header with every request the browser makes.


    Back around 1995 were Mosaic and Netscape, and of the two Netscape was decided
    the more advanced, since it supported exciting novelties like cookies and the
    <center> tag.


    Along came a now-fortunately-forgotten fool who decided to use a browser detect
    in order to determine support for these features—and things went downhill fast
    from there.


    How did these first browser detects find Netscape? They checked whether the browser
    identification string started with Mozilla/, which meant it was Netscape. Conversely,
    Mosaic’s string started with Mosaic/. Thus Web sites did like this (on the server,
    of course, JavaScript hadn''t been invented yet) and early Web developers felt
    very clever:


    ```

    <% if userAgent starts with ''Mozilla/'' %>

    <h1><center>Welcome, <% read name from cookie %>!</center></h1>

    </h1>

    ```'
