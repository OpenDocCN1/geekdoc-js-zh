  md: '# Inserting and deleting rules


    You can insert new rules into a style sheet, or remove rules from it. This feature
    is not used in Edit Style Sheet—I definitely don''t want a user who knows little
    of CSS to insert new rules that might mess up the entire page.


    > WARNING Browser incompatibilities ahead


    Nonetheless, inserting and deleting rules is important enough to treat. Unfortunately,
    this area of JavaScript again contains some browser incompatibilities. `insertRule()`
    and `deleteRule()` methods, while Explorer uses the Microsoft-proprietary `addRule()`
    and `removeRule()` methods. Safari and Opera don''t support these actions at all.


    As soon as you insert a rule, the style declarations in it are immediately applied
    to all relevant elements. Deleting a rule immediately removes these style declarations
    from all relevant elements.


    # insertRule() and addRule()


    When you are inserting a new rule, the browsers expect three bits of information:


    +   1. The selector of the new rule.


    +   2. The style declarations of the new rule, as a string.


    +   3. The position of the new rule (first rule of the style sheet, last rule,
    some-where between?).


    The W3C `insertRule()` and Microsoft `addRule()` methods need this information,
    but they differ in the way they want it delivered.


    W3C''s `insertRule()` expects two arguments:


    +   1. The entire rule (selector + declarations) as a string.


    +   2. The position of the new rule (0 = first rule in the style sheet, etc.).'
