  md: '# Octal and hexadecimal numbers


    JavaScript also allows you to use octal and hexadecimal numbers. Any number that
    starts with a 0 is octal; any number that starts with 0x is hexadecimal. Take
    this example:


    ```

    var test1 = 042;

    var test2 = 0x42;

    alert(test1 + '' '' + test2);

    ```


    The alert now says ''34 66'', since the octal 42 is decimal 34, while the hexadecimal
    number 42 is decimal 66.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_202_0.png)


    ![](img/1cdc3bc9be02360dab81df06bea3c619_202_1.png)'
