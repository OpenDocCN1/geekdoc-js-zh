    \n```\n<body>\n  <img src=\"someImg.gif\" name=\"firstIMG\" />\n  <img src=\"\
    someOtherImg.gif\" id=\"secondIMG\" />\n</body>\n```\n\nThe Level 1 DOM allows\
    \ us to access these images by document.getElementsByTagName('img'). The Level\
    \ O DOM allows the same through the document.images[] nodeList. document.images[0]\
    \ is the same as document.getElementsByTagName('img').\n\nIn addition, the Level\
    \ O DOM allows document.images['firstIMG'] and document.images['secondIMG']. It\
    \ searches for the image with the given name or ID. That can occasionally be quite\
    \ useful, especially if you have to find a specific image and are not sure of\
    \ the exact document structure (because other scripts might have changed it, for\
    \ instance). Just as Level 1 DOM nodeLists document.images[] reflects all changes\
    \ in the document, it presents the same damages.\n\ndocument.images[] is nothing\
    \ more than a convenient alternative to document.getElementsByTagName('img').\
    \ The other common Level O DOM nodeLists are somewhat more than that."
