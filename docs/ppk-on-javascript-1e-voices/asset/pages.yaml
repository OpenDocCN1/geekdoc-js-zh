    The same goes for iCab and Konqueror; their string might contain ''iCab'' or ''Konqueror'',
    but then again, they might not.


    I hope that future versions of these browsers will take the same risk as Opera
    and carry their true name in every identification string, even when in disguise.
    On the other hand, I can''t blame the vendors if they don''t—we Web developers
    have made a mess of things.


    # Gecko


    Mozilla''s identification string usually contains ''Gecko.'' Unfortunately, Safari''s
    default string also contains ''Gecko.'' (Why? To bypass browser detectors, of
    course.)


    In general, it''s very hard to identify Mozilla positively. I go through all other
    options, and if I cannot identify the browser I assume it''s Mozilla. But of course
    this assumption may be wrong.


    # MSIE


    Explorer''s string always contains the substring ''MSIE''. Most other browsers
    use this crucial passkey, too, so its presence proves nothing.'
