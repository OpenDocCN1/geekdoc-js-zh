  md: 'Any JavaScript book needs example scripts. Once the writer has explained a
    bit of theory, he should show how to apply this theory in practice. An example
    script is the most obvious way of doing that.


    Ideally, these scripts should be of practical value. It''s all fine and dandy
    to create a script that lists your pets in alphabetical order and shows their
    fluffy images when you click on their cute names, but even if it illustrates the
    theory of say, objects and popups, its practical value is essentially nil.


    Therefore this book features eight real-world scripts that real-world clients
    paid real-world money to write.


    Each of the eight scripts was written for a specific client with a specific, commercial
    goal in mind, and each of the clients indicated he or she was happy with the script.
    In fact, out of seven clients granted me additional business, and the only reason
    the seventh didn''t is that he''s a small business owner who needed just one website.


    You can''t get much more real-world than that.


    # How the example scripts are used


    The one disadvantage of using real-world example scripts is that it''s impossible
    for me to treat one script per book chapter. I can''t ask my clients to be content
    with a script that uses Core and Events but not DOM just because I haven''t explained
    DOM to you.


    Therefore the example scripts do everything in the book: They all use event handling,
    accessibility, DOM scripting, HTML structure, and CSS modification.


    Essentially I chopped the scripts into pieces and then ordered these pieces thematically.
    You can find all example scripts at http://www.quirksmode.org/book/. Even if you''re
    going to read this book somewhere other than in front of your computer, I advise
    you to familiarize yourself with the scripts beforehand. Throughout the book I
    assume you have an overall idea of what they do and why.'
  merge: -1
