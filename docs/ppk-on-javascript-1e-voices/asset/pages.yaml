  md: '# Correct use of browser detects


    There are two situations in which a browser detect is the correct solution.


    The first is when you actually want to know which browser a visitor uses, in order
    to store that information in a Web-site statistics program. Site Survey does so
    because my client wanted this information. Since the browser detect does not influence
    the script logic, it''s perfectly safe.


    The second situation is a lot messier and usually involves Explorer on Mac. This
    browser theoretically supports the W3C DOM, and therefore this object detection
    grants access to the advanced scripts:


    ```

    var W3C = document.createElement && document.getElementsByTagName;

    ```


    Nonetheless, when you actually run complicated scripts in Explorer Mac, chances
    are it''ll crash. This is a fact that no object detection will ever discover;
    object detection assumes that a method that is supported does not crash the browser.


    There is no solution to this dilemma other than browser-detect Explorer Mac out
    of existence. Sandwich Picker does so:


    lines 1-2


    ```

    var IEMAC = (navigator.userAgent.indexOf(''Mac'') != -1 && =

    navigator.userAgent.indexOf(''MSIE'') != -1);

    var W3DOM = (document.createElement && =

    document.getElementsByTagName && !!IEMAC);

    ```


    If navigator.userAgent contains the strings ''MSIE 5'' and ''Mac'', then the browser
    is Explorer on Mac (or a browser disguised as such). The next line performs a
    standard object detection, but adds the clause "and if it''s NOT Explorer Mac".


    A filthy solution, but it''s the only one possible.'
