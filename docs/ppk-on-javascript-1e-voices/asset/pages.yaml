    \n```\nfunction doSomething() {\n  var x = [something complicated that's what\
    \ you expected];\n  addDebuggingMessage('x is ' + x.nodeName);\n}\n```\n\nNowadays\
    \ it's also possible to embed such a debugging window in your document and use\
    \ the createTextNode() and appendChild() methods we'll discuss in 8D and 8E to\
    \ write your debugging messages. 3E for an example.\n\n# G: Cookies\n\nHTTP is\
    \ a stateless protocol. This means that a Web server doesn't remember anything.\
    \ If a user requests a page, the server has no idea if it is a new user, a user\
    \ who visits the site several times a week, or a user who has been obsessively\
    \ reloading every single page on the server for the past few hours. The server\
    \ just sends the requested page and forgets about it.\n\nUsually this is a good\
    \ thing. Since it doesn't have any memory, a Web server can fully concentrate\
    \ on serving Web pages, instead of also having to do de tedious and time-consuming\
    \ administration. HTTP is deliberately designed this way.\n\nNonetheless, sometimes\
    \ you need to remember things about your visitors. Is this user logged in? Has\
    \ this user requested the larger font size? Has this user already voted on the\
    \ poll? To enable you to this, Netscape introduced cookies back in the Internet's\
    \ gray antiquity."
