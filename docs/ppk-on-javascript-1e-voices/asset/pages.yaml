  md: '# SECTION E: THE EVENT OBJECT AND ITS PROPERTIES | 321


    # Don’t do it


    The chaos surrounding the mouse position is the most severe Browser War-style
    incompatibility still in existence, which makes the position properties rather
    hard to use.


    Besides, any script that uses the mouse position is fundamentally inaccessible:
    when the user doesn’t use a mouse, the mouse coordinates don’t hold useful information.
    In fact, you might find wildly incorrect mouse coordinates because, for instance,
    the mouse pointer is permanently located in the middle of the computer screen.


    Fortunately, finding mouse coordinates is rarely necessary, as Edit Style Sheet’s
    color picker proves. The idea of the script is that the user clicks on the Picker
    link, and that the color picker appears at the same height as the link.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_350_0.png)


    > FIGURE 7.7

    Clicking on the Pick color link opens the color picker at the same height as the
    link.",


    This script needs to calculate the color picker’s position. This calculation could
    start from the mouse position (“place the color picker 200 pixels to the left
    of and at the same height as the current mouse position”), but a far better technique
    is to start from the position of the link itself (“place the color picker 200
    pixels to the left of and at the same height as the link the user clicked on”).
    We’ll discuss this in 9H.


    As an added bonus, the position-finding script is accessible; it also works for
    non-mouse events such as focus.


    90% of the scripts that calculate the mouse position could just as easily as the
    position of the element the user clicked on or moused over their calculations.
    Therefore, my advice is not to try to find the mouse position at all. You rarely
    need it.'
  merge: -1
  pgno: 350
