  md: "their event handlers (onclick, onkeydown, etc.). In Explorer, these attributes\
    \ cannot be read or see through getAttribute() and setAttribute(); in fact, weird\
    \ bugs may occur if you try it.\n\nThe solution is to use the JavaScript properties\
    \ style, onclick, onkeydown, etc. to read or set these attributes. In order to\
    \ completely understand this, we first have to discuss the subtle difference between\
    \ HTML attributes and JavaScript properties.\n\n# HTML attributes and JavaScript\
    \ properties\n\nAlthough superbly they might seem the same, and there in fact\
    \ considerable overlap, HTML attributes are not always equal to JavaScript properties.\n\
    \nLet's dissect a few lines from Sandwich Picker. Each <tr>in the document contain\
    \ one sandwich. I need to know the price of this sandwich to calculate the total\
    \ price when the user orders it. Because the purpose of the script is to change\
    \ the placement of these <tr>s in the document, I want to attach the price of\
    \ a sandwich to its <tr>. In that way, the price always remains available, wherever\
    \ the <tr> may happen to be at a certain time.\n\n| 2,00 | |\n|---||\n| Pepper\
    \ salami |\n| Smoked meat |\n| Egg salad |\n| Russian egg salad |\n| Turkey salad\
    \ |\n| Chicken-curry salad |\n\nFIGURE 8.16\nAll sandwiches below this header\
    \ are priced at 2,00.\n\nSandwich prices are located in the header <tr>s of the\
    \ third table. I put them in a custom attribute in the HTML. Note that this is\
    \ an HTML attribute; it's hard-coded in the page's HTML.\n\n```\n<tr price=\"\
    2.00\">\n  <th colspan=\"5\" class=\"header\">&euro; 2,00</th>\n</tr>\n```"
