- img_proc: true
  md: 'In order to remove an option, simply set the correct element of the options

    List to null:


    ```

    var x = [a select box];

    x.options[1] = null;

    ```


    Now the second option is removed from the select box, and of course all

    options move one step up to accommodate this change. Therefore, a new

    x.options[1] is immediately available: this is the old x.options[2].


    Adding an option is slightly more complicated. You must first create a new

    option object and add new to the options array:


    ```

    var newOpt = new Option(''text'', ''value'');

    x.options[1] = newOpt;

    ```


    Note that the option requires two arguments: the text and the value.

    Once it''s created, you insert it in the options array, and of course the old

    x.options[1] now becomes x.options[2], etc.


    # File uploads


