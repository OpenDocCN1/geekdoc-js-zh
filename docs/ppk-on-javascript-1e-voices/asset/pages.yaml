  md: '# Sandwich Picker


    +   * Purpose: Allow the user to search for and order sandwiches.


    +   * User actions: The user searches for sandwiches. The user can indicate wether
    wants to order or trash a sandwich.


    +   * Feedback: The sandwiches the user searches for are moved to the search table.
    The ordered sandwiches are moved to the order table. The trashed sandwiches are
    returned to the start table at the bottom of the page.


    +   * Script knowledge: The script must know where the sandwiches are located,
    and has to be able to search through the names of all sandwiches.


    +   * Maintenance: The Webmaster should be able to add and remove sandwiches,
    and to set their prices. In this case the Webmaster was my client, and although
    he knew some basic HTML I didn''t want to make things too difficult for him.


    # HTML structure


    Each sandwich can be moved through the document. Since the list with all sandwiches
    and their descriptions is clearly a case of tabular data, it is made most sense
    to give each sandwich its own `<tr>` and move these `<tr>`s through the document.


    In addition, I put the price information in the table headers. Any sandwich below
    a certain header has that price. The element with `id="startTable"` initially
    contains all sandwich `<tr>`s, and therefore this `id` serves as the script''s
    hook.


    # Script structure


    The script''s main job is to find out which `<tr>`s should be moved to which position,
    and to do it. is trickier than it seems; we''ll discuss this problem fully in
    8I.


    The script should have easy access to the sandwich name and price, since they
    are needed for the search action and the total price calculation. Therefore I
    added these bits of data as properties of the object that represents the `<tr>`
    (see 5J).'
