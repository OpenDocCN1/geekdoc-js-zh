- img_proc: true
  md: "The alert gives a definite clue, because it itself causes the bug. That will\
    \ quickly lead you to suspect that the value of x is incorrect. In a real situation,\
    \ I would change the alert:\n\n```\nalert(x);\n```\n\nNow an alert pops up that\
    \ says 'undefined'. Now I'm certain that the bug is caused by x not being defined;\
    \ I only have to study the assignment to x, and I'll probably spot the missing\
    \ 't'.\n\n# Alerts and confirms\n\nSometimes alerts can be annoying. Let's say\
    \ an error occurs somewhere in a long-loop that goes through all <tr>s in an HTML\
    \ page. I suspect it has something to do with the number of cells in one row,\
    \ and I want to study the number of cells every row has. An alert allows me to\
    \ do that:\n\n```\nvar rows = document.getElementsByTagName('tr');\n(var i=0;\
    \ i<rows.length;i++) {\n  var cells = rows[i].getElementsByTagName('td');\n  alert(i\
    \ + ' : ' + cells.length);\n  var name = cells[1].firstChild.nodeValue;\n}\n```\n\
    \nThis works, up to a point. I now see the index of the row and its number of\
    \ cells. Unfortunately, the alert pops up every time the script finds a new <tr>\
    \ to work on, and if your HTML contains hundreds of <tr>s you'll see hundreds\
    \ of alerts. That gets done in a hurry.\n\nInstead, you could use a confirm:\n\
    \n```\nvar rows = document.getElementsByTagName('tr');\nfor (var i=0; i<rows.length;i++)\
    \ {\n  var cells = rows[i].getElementsByTagName('td');\n  if (!confirm(i + ' :\
    \ ' + cells.length + ' . Continue?'))\n    break;\n  var name = cells[1].firstChild.nodeValue;\n\
    ```"
