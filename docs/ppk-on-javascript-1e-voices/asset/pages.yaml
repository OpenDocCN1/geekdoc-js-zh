    Feel free to disagree with my decision in this specific situation, but sometimes
    solving a browser bug is more trouble than it''s worth.


    # Reporting browser bugs


    Once you''ve successfully isolated a bug, you should report it to the relevant
    browser vendor. All four major vendors offer bug reporting facilities.


    # Safari


    Safari offers the easiest feedback mechanism. Use just its ''Report Bugs to Apple''
    feature and answer a few questions.


    | Safari | File | Edit | View | Hist |

    |---|---|---|---|---|n| About Safari | | | | |

    | Report Bugs to Apple... | | | | |


    FIGURE 3.7\ Safari''s bug-reporting feature sends a bug report straight into Apple''s
    database.


    # Opera


    Opera makes it easy, too. Go to http://www.opera.com/support/bugs/ and carefully
    read the page, since it contains a useful summary of a proper bug report-process.


    Opera requires a good test case that has isolated the bug as much as possible.
    Once you''ve created that page, you can follow the links to the bug-report form.


    # Mozilla


    Reporting a Mozilla bug is hard. The complete bug database of Mozilla is online
    at http://bugzilla.mozilla.org/, but you need some experience with Bugzilla in
    order to use it.'
