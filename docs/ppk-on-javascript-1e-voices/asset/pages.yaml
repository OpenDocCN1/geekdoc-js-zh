    \ encounters two other cases, but it ignores those lines—they are irrelevant,\
    \ since the case is text.\n\n# default\n\nNeither example contains the final feature\
    \ of a switch: the default statement. default is a case, too, and it simply means\
    \ \"In all other cases.\"\n\nIt's used as follows:\n\n```\nfunction isRequired(obj)\
    \ { // obj is the form field\n switch (obj.type) {\n  case 'text':\n  case 'textarea':\n\
    \  case 'select-one':\n    // handle\n  case 'radio':\n    // handle\n  case 'checkbox':\n\
    \    // handle\n  default:\n    alert('Sorry, I don\\'t know what to do');\n }\n\
    ```\n\nIf obj.type has none of the values defined in the case statements, the\
