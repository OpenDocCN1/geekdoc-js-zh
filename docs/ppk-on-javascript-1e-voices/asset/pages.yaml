  md: 'Now hasName contains true or false, while name contains the name the user typed
    in.


    Note that the ''Do you have a name?'' string shown in the dialog boxes is plain
    text, not HTML. Therefore, if you want a line break to occur in the box, you should
    use \n (newline character), not <br />.


    ```

