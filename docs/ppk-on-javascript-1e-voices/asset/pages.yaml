  md: '# BOM


    JAVASCRIPT HAS AN intermediate layer between Core (discussed in the previous chapter)
    and the Document Object Model, or DOM (to be discussed in Chapters 7-10). Commonly
    called the Browser Object Model, or BOM, this layer is specific to JavaScript''s
    client-side implementation, so it''s not part of Core. It does not work with the
    HTML document, so it''s not part of the DOM, either. The BOM''s most important
    task is managing browser windows (each of which have a separate window object)
    and enabling communication between them. Therefore, the window object stands at
    the center of the BOM.


    Nonetheless, as you''ll notice, BOM is also the catch-all category of JavaScript.
    There are many objects, methods, and properties that are not part of the document
    structure (for instance, the URL of the current page or the identification string
    of the browser), and these are defined on the window object.


    Standards-wise, BOM is a bit of a problem. Core has been standardized by ECMA,
    and most aspects of the DOM have been specified by W3C. In contrast, the BOM has
    not yet officially defined by any standards organization, although at the time
    of writing, WHAT-WG is working on a specification. Fortunately, the most important
    BOM features were all of the facto Netscape 3 standard, and are therefore supported
    by all browsers.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'Site Survey is the quintessential BOM script. It''s useful to compare it to
    the other example scripts, to highlight the difference between DOM and BOM.


    All the other example scripts change an HTML document; for instance, by moving
    HTML elements through the document (Sandwich Picker, Usable Forms), changing the
    styles of elements (Edit Style Sheet, Dropdown Menu, XMLHTTP Speed Meter), or
    checking user input in a form field (Form Validation, Textarea Maxlength).


    In contrast, Site Survey hardly changes anything in the document. The script sits
    quietly in its corner (a popup) and registers what users are doing in the site
    by storing the URLs of all pages they visit. Ideally, the user never notices it''s
    there, until the script opens the survey page and politely requests the user to
    participate.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_269_0.png)


    The Web Hypertext Application Technology Working Group (WHAT-WG) is an unofficial
    collaboration of browser vendors and other interested parties who work on the
    development of new, advanced technologies for delivering applications on the Web.
    Although WHAT-WG''s specifications have no official status, some WHAT-WG members
    are also W3C members, while others are well-known Web developers; all of them
    support WHAT-WG''s recommendations in word and deed. It is likely that WHAT-WG''s
    ideas will eventually find their way into the official W3C specs and new browser
    versions.


    WHAT-WG''s best-known specification is Web Forms 2.0, in which the group defines
    new form widgets as sliders and date/time fields, and proposes ways of adding
    these widgets to HTML.


    Developers who are interested in innovating technologies that will make Web easier
    to use—and possible JavaScript implementations of these technologies—should take
    the time to acquaint themselves with the WHAT-WG''s projects. Their Web site can
    be found at http://whatwg.org/.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'The core tasks of Site Survey are to remember whether users are selected for
    the survey and to ensure that the popup stays in contact with the main window,
    even when the user requests new pages. Thus, Site Survey mainly concerns itself
    with window-related information as the URL of the current page or cookies associated
    with it. It does not work with DOM information such as the existence and value
    of form fields. The window object is more important to Site Survey than the document
    object.


    # A: The window object


    At the center of the BOM stands the window object. It serves four purposes:


    +   * It is the global object that JavaScript Core needs to function.

    * It represents the browser window that users see on their computer screen.

    * It has access to the HTML document loaded in the window.

    * It contains miscellaneous information and functionality.


    As JavaScript''s global object, the window object contains all the variables and
    functions defined in your scripts. (We discussed the global object in 5J.)


    As a representation of the browser window, the window object holds methods like
    `resizeTo` allow you to change the window''s dimensions, and objects such as `screen`
    that give information about the user''s computer screen. In addition, it allows
    you to open and close new browser windows.


    As the access portal to the HTML document, the window holds the document object,
    which in turn holds the entire HTML page the user is currently viewing.


    Finally, as a holder of miscellaneous information and functionality, the window
    object contains the `location` and `history` objects, which are meant for navigation,
    a few interaction methods such as `alert`, and the browser''s `userAgent` string.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# The window as global object


    As we saw in 5J, JavaScript always creates a global object to hold all global
    variables and functions in your scripts. If you wish, you can explicitly invoke
    this global object, for instance:


    ```

    var test = ''Hello world'';

    alert(window.test);

    ```


    test is a global variable, and as it''s a property of the window object. Therefore
    window.test also accesses the variable.


    Every browser window or frame is a global object in its own right. Although communication
    between these global objects is possible in certain circumstances, they remain
    separate.


    # New pages, new window object


    In the course of a browsing session, one window object can contain many pages.
    Whenever the user loads a new page, the old page is thrown away and the new one
    is loaded into the same window object.


    When that happens, JavaScript''s global object is also cleaned rigorously. All
    variables and functions are destroyed, and if you still need them in the new page
    you have to redefine them by rerunning your initialization script and other functions.


    # Persistent window object


    When the user loads a new page in a window, or even when he closes the entire
    window, the window object is wiped clean but is not destroyed. The most important
    consequence of this persistence of the window object is that any reference to
    it remains in force.


    For example, when you open a popup, the browser creates an opener property in
    the popup that refers to the window it''s opened from. This is an automatic, and
    very useful, feature that we''ll discuss in detail in 6B.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'When the user loads a new page in the main window, the window object is wiped
    clean. It is not destroyed, however, and therefore the opener property of the
    popup still refers to the same window object as it did earlier. (Of course, if
    the window now contains a page from another domain, JavaScript''s same-source
    policy does not allow you to access back to this page. We''ll get back to this
    problem in 6B.)


    Even when the user closes the main window, opener still refers to the nowclosed
    window. The window is gone from the computer''s screen, but the window object
    still exists and can be accessed, even though it doesn''t contain any useful data
    more.


    I use this fact extensively in Site Survey, and we''ll discuss it in more detail
    in 6B, when we cross-window communication.


    # Persistent data


    Sometimes a page contains bits of data that you want to keep for future use, even
    when the page is removed. Suppose a page contains a module that calculates the
    user''s yearly spending on insurance. In another page, you want to use the result
    of these calculations to show the user why it''s advisable to insure herself with
    the company.


    The result of the calculation is likely held by a global variable in the first
    page, and as soon as the user loads the second page, this global variable is lost.
    Somehow, you have to transfer the result of the calculation in the first page
    to the second page. You have to do this manually; there is no automatic way of
    taking care of it.


    You have three options. You can store the data in another window object. The new
    page can then retrieve the data from either of these sources. We''ll treat these
    two scenarios in this chapter (6B and 6G, respectively).


    The third option is that you send the data to the server for safekeeping. This
    is the most secure solution, since both cookies and other window objects can go
    astray and you run the risk of losing the result of the calculation. Nonetheless,
    sending data to the server is usually more complicated than storing it in a'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'cookie or another window. It generally involves a form and a server-side script
    that catches and stores the data, and retrieves it later.


    In short, storing the data on the server is the safest solution, but it requires
    a bit of extra work. In Site Survey, I opted for storing some data in a cookie,
    and other data in another window.


    # New windows as new global objects


    Your Web site may have more than one window, and thus more than one global object.
    If you use popups or frames, you effectively create several window objects, each
    of which is completely separate from all the others. These window objects are
    all global objects, and can contain variables or functions with the same names.


    Suppose your site uses a main window and a popup, and suppose you define a variable
    message each of them:


    ```

    var message = ''Hello world''; // in main window

    var message = ''Goodbye, cruel world''; // in popup window

    ```


    These two variables message are completely independent, since they''re properties
    of different global objects. If you use a line alert(message), it shows ''Hello
    world'' in the main window, and ''Goodbye, cruel world'' in the popup window.
    Both alert statements use the value of message as defined in their own global
    object.


    Sometimes you need variables or functions from another window, as I do in Site
    Survey. In order to access them, you first have access to the other window (or
    rather, the other global object). Once you''ve done that, you can request its
    properties and methods, which are its variables and functions. For instance, this
    alerts “Goodbye, cruel world” in the main window:


    ```

    // in main window

    var popup = [open popup and create reference to its window object];

    alert(popup.message);

    ```'
