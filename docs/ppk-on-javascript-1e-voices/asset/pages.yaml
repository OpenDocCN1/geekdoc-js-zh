  md: 'Treating functions as values is quite common in event handling. We''ll return
    to this subject in 5l and 7C.


    # Variables and literals


    A value is commonly expressed as a variable or a literal. The difference is simple:


    ```

    var a = 10;

    var b = a * 4;

    ```


    In this code example, a and b are variables, which means they may contain any
    value, though right now they contain 10 and 40.


    The 10 and 4 are literals: they literally mean 10 and 4, and cannot mean anything
    else.


    # B: Data types


    Every value has a data type to define what sort of value it is.


    For example, 4''s data type is number, “Hello world!”s data type is string, and
    the function test()''s data type is object.


    # The six data types


    JavaScript knows four important data types and two trivial ones. The important
    ones are number, string, boolean, and object; the trivial ones are undefined and
    null, which are two distinct ways of saying “It’s not there.”


    # Numbers


    Numbers are pretty self-explanatory: they’re numbers. You can add, subtract, multiply,
    and divide numbers, and when your script requires calculations, you always use
    numbers. Example:


    ```

    var exampleNumber = 42;

    ```


    We’ll discuss numbers in 5E.'
  merge: -1
