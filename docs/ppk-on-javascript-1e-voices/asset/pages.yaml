    # Closing windows


    Every window object has a close() method: calling it the window. Nonetheless,
    most browsers have a built-in safety catch that offers the user some control.
    Although every window can be closed by this method, in the case of windows that
    were opened by the user, some browsers refuse to execute window.close(), while
    others open a dialog box that asks the user if it''s OK to close the window. If
    the user denies permission, the window stays open.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_286_0.png)


    > FIGURE 6.1

    If you try to close a window that''s opened by the user, Explorer shows this dialog
    box.


    It is not possible to circumvent this security measure.


    Windows that were opened by JavaScript can be closed without encountering this
    dialog box.


    # Popup blockers


    Popup windows have a bad reputation, and not undeservedly. When purveyors of frontal
    nudity and similar undesirable types discovered that it was possible to confront
    any user with their products, popups became very popular overnight. Additionally,
    designers who were unable to create liquid layouts were determined to force users
    to view their sites at a certain width and height, and opening a popup was the
    simplest way of ensuring that.'
