- img_proc: true
  md: 'The script goes through all `<div>`s in the document, and ignores those that
    don''t have a class="content". It then sets their `display` to none (styles that
    hide content should be in JavaScript!).


    The script finds the header that `<div>` is related to. In principle, this is
    the previousSibling of the `<div>`, but as we saw in 8H there may be empty text
    nodes between the header and the `<div>`. The script goes back through the document
    tree until it finds a node with nodeType 1 (i.e., an element node). This is the
    header it''s looking for.


    Once it finds the header, it sets its `relatedTag` property to point to the `<div>`,
    and the header gets an onclick event handler.


    When the user clicks on the header, the openClose()` function reads out the current
    display of the header''s `relatedTag` (i.e., the `<div>` that should be opened
    or closed), and sets its `display` to the opposite value.


    # GENERATING THE DIVS


    Sometimes you don''t want the extra `<div>` in your HTML code, and editors of
    the HTML page could suddenly add extra headers. In addition, if the page is updated
    through a CMS, it would have to generate an extra `<div class="container">` around
    the correct content. You''ve just had to Wack the CMS you''re working with to
    do that.


    Enter the W3 DOM. Don''t put any divs in your HTML, but generate them when the
    page has been loaded. Go through all children of the body. As soon as you find
    a header, append a new div after it. Then move all nodes after you find the header
    to this generated div, until you encounter a new header. Then generate a new div,
    and continue with the content after the new header.


    Try expanding the show/hide script with this functionality. It''s a useful DOM
    exercise.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_476_0.png)'
  merge: -1
  pgno: 476
- img_proc: true
  md: 'Note a few important points:


    +   - The crucial `display: none` is set in JavaScript, not in CSS. If a noscript
    browser visits the page, all blocks remain open and accessible.


    +   - We set the inline style of the `<div>` to `display: none` so that we can
    read out the current `display` of the block through `style.display`.


    +   - When the script has loaded `(onload)` we relate every header to the content
    block it should open. We discussed the creation of such relations in 4C.


    This simple example of a show/hide script can be used in many circumstances.


    # Showing and hiding table rows


    In my script I used `<div>`s as example tags, but of course you can write a show/hide
    script for any tag you like. Showing and hiding `<ul>`s or `<li>`s in navigation
    could also be useful; in fact, Dropdown Menu does exactly that (though in a more
    complicated way than the simple script we just reviewed).


    > WARNING Browser incompatibilities ahead


    One case deserves special attention: showing and hiding table rows. Hiding table
    rows is done through `display: none`, obviously, but how do you show them? Table
    elements ought to have the special `display` value `table-row`, but unfortunately
    Explorer uses `display: block` instead.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_477_0.png)'
  merge: -1
  pgno: 477
- img_proc: true
  md: 'All browsers are strict about what they allow. If they expect table-row, they''ll
    choke on block, and vice versa. For instance, the following line makes Explorer
    restore the <tr> to view, but the other browsers literally make the <tr> a block
    that doesn''t pay attention to the rest of the table:


    ```

    var tr = [the tr you want to show];

    tr.style.display = ''block'';

    ```


    ![](img/1cdc3bc9be02360dab81df06bea3c619_478_0.png)


    FIGURE 9.3

    gave the middle <tr> display:

    block. Mozilla takes me into my word; it makes the tr a block, and the vertical
    alignment of <td>s is lost.


    Conversely, if you use the correct table-row value, the other browsers restore
    the <tr>, but Explorer gives an error:


    ```

    tr.style.display = ''table-row'';

    ```


    What now? Do we have to use a browser detect to decide between block table-row?
    Fortunately, every browser has a default style sheet that declares all default
    styles of all elements, and this style sheet includes the default display value
    of a <tr>.


    This default style contains either block or table-row, depending on the browser.
    If you allow this style to take over once more, the problem is solved; all browsers
    will restore the <tr> to view.


    How do you do this? As we saw at the start of this chapter, the style property
    sets the inline style of an element. If we remove the inline value entirely, the
    browser once again takes its display instructions from the default style sheet,
    and the problem is solved:


    ```

    tr.style.display = '''';

    ```'
  merge: -1
