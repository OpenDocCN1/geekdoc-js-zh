  md: "# Testing if an object exists\n\nThe `if()` statement hinges on boolean values,\
    \ The expression between the parentheses is evaluated as a boolean, and data-type\
    \ conversion makes sure that all parts of such an expression are interpreted as\
    \ booleans.\n\nRemember the rules of converting a value to a boolean?\n\n+   -\
    \ The special values `undefined` and `null` become `false`.\n- The numbers 0 and\
    \ `NaN` become `false`.\n- An empty becomes `false`.\n- All other values become\
    \ `true`.\n\nThe conversion of an object to a boolean forms the core of object\
    \ detection that we discussed in 3C. Let's repeat the example:\n[Edit Style Sheet,\
    \ lines 5-6]\n\n```\nfunction initStyleChange() {\n  if (!document.stylesheets)\
    \ return;\n```\n\ndocument.stylesheets is supposed to be an object, but the browser\
    \ might not support it. In any case, the `if()` statement forces data-type conversion\
    \ from object to boolean:\n\n+   - If the browser supports `document.stylesheets`,\
    \ the object exists and is converted to boolean `true`.\n- If the browser does\
    \ not support `document.stylesheets`, the object does not exist. As an object\
    \ that does not have the value `null`, which in turn converts to boolean `false`.\n\
    \nThe NOT operator reverses this value. Therefore, the `(return)` if the `if()`\
    \ statement returns `true`, i.e., if `document.stylesheets` evaluates to `false`:\
    \ if the browser does not support the object."
