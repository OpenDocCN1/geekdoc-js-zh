  md: 'Although nowadays browsers are serious about following all standards, we''re
    still suffering from a few holdovers of the Browser Wars: Microsoft has not yet
    implemented W3C''s Events specification, but instead uses its own proprietary
    event model. In order to write cross-browser event handling scripts you must understand
    both the W3C and the Microsoft models, as well as the older Netscape 3 standard.
    We''ll discuss all this in Chapter 7.


    # # Versions


    There are several JavaScript versions, ranging from the obsolete 1.0 to the 2.0
    that''s under development at the time of writing. It''s important to note that
    these version numbers only apply to Core; other areas of JavaScript (notably the
    DOM) have their own version numbers.


    | Core version | Implemented in | ECMA specifications |

    |---|---|--|

    | 1.0 | Netscape 2 earlier Explorer 3 versions | |

    | 1.1 | Netscape 3 later Explorer 3 versions | |

    | 1.2 | Netscape 4 – 4.5 | |

    | 1.3 | Netscape 4.5+ Explorer 4 (slight upgrade to 5.0) | v1 (v2 contained some
    clarifications) |

    | 1.4 | No browser, only Netscape servers | |

    | 1.5 | Mozilla Explorer 5.5+ | v3 |

    | 1.6-2.0 | Under construction | v4 |'
