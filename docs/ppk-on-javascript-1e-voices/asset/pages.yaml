  md: '# Data retrieval


    WEBSITES are collections of HTML documents. These documents are connected by hyperlinks,
    and clicking on such links causes the browser to discard the old page and load
    the new one, a process that may take a few seconds.


    This is fine as far as it goes, but occasionally you want a spiffier interface
    that doesn''t change or flicker while new data is being fetched from the server,
    and where the new data is integrated seamlessly into the existing page. Usually
    this is called a Single Page Interface, since the users enter a certain page,
    and all actions they result in new data being shown within that page.


    From a JavaScript perspective, the question is one of data retrieval: how do you
    retrieve data from the server without reloading a page? Simple: you use the XMLHttpRequest
    object, which all modern browsers support.


    Throughout this chapter we''ll discuss XMLHttpRequest Speed Meter, since it''s
    the only example script that uses data retrieval. Note the out, however, that
    it is the simplest possible data-retrieval script, because it fires just one query.
    More complicated data-retrieval applications need many more features than this
    chapter discusses. After all, this book is not about application design, but about
    basic JavaScript.'
  merge: -1
  pgno: 492
- img_proc: true
  md: "Note that you're allowed to retrieve XML data files only from the same domain\
    \ as the page. This is due to JavaScript's same-source policy, discussed in 1B.\n\
    \n# A: Sending the request\n\nSending an HTTP request through the XMLHttpRequest\
    \ object requires the following minimum steps:\n\n+   1. Create an XMLHttpRequest\
    \ object (this is browser dependent).\n2. Instruct the object to open a specific\
    \ file (the `open()` method).\n3. Tell the object what to do with the data the\
    \ server will return (an onreadystatechange handler).\n4. Give the object command\
    \ to send the request (the `send()` method).\n are more actions you can take,\
    \ but we'll focus on these required steps first.\n\n# The XMLHttpRequest object\n\
    \n> WARNING Browser incompatibilities ahead\n\nIn order to send an XMLHttpRequest\
    \ and receive a response, you have to create an XMLHttpRequest capable of performing\
    \ these actions. Unfortunately, creating this object requires a few browser-dependent\
    \ workarounds, in Explorer 6 and earlier the object is an ActiveX object, while\
    \ in all other browsers (including Explorer 7) it is a native object.\n\nThis\
    \ is XMLHttpRequest Speed Meter's object-creation function:\n[XMLHTTP Speed Meter,\
    \ lines 140-145)\n\n```\nvar XMLHttpRequestFactories = [\n    function () {return\
    \ new XMLHttpRequest()},\n    function () {return new ActiveX(\"Msxml2.XMLHTTP\"\
    )},\n    function () {return new ActiveX(\"Msxml3.XMLHTTP\")},\n    function ()\
    \ {return new ActiveX(\"Microsoft.XMLHTTP\")}\n];\n```"
  merge: -1
  pgno: 493
- img_proc: true
  md: "First, we create an array, XMLFactories, that contains one function for every\
    \ possible way to create an XMLHttpRequest object. The first one (new XMLHttpRequest())\
    \ tries to create a native object, while the remaining ones try to create ActiveX\
    \ objects. Msxml2.XMLHTTP, Msxml3.XMLHTTP, and Microsoft.XMLHTTP are all possible\
    \ names for ActiveX object; which one is supported depends on the user's Windows\
    \ configuration, not on the browser.\n\n[XMLHttpRequest Speed Meter, lines 147-160]\n\
    \n```\nfunction createXMLHttpRequestObject() {\n  var xmlhttp = false;\n  for\
    \ (var i=0;i<XMLHttpRequestFactories.length;i++) {\n    try {\n      xmlhttp =\
    \ XMLHttpRequestFactories[i];\n    } catch (e) {\n      continue;\n    }\n   \
    \ break;\n  }\n  return xmlhttp;\n}\n```\n\nThe createXMLHttpRequestObject function\
    \ first sets the xmlhttp variable to false (no support). It goes through all factory\
    \ methods and tries them. The problem is, of course, that if a factory method\
    \ is not supported, executing it gives an error message.\n\nHence the use of a\
    \ try/catch statement (see 5H). We try to execute each factory method. If that\
    \ succeeds, we have an XMLHttpRequest request object, the function skips the catch,\
    \ and encounters the break that immediately ends the for loop. If a factory method\
    \ gives an error, the function executes the catch statement and continues the\
    \ for loop."
  merge: -1
  pgno: 494
- img_proc: true
  md: 'Afterwards, xmlhttp refers to an XMLHttpRequest object that we can use, or
    it still false, which means that the user''s browser doesn''t support XMLHttpRequest
    at all. We return this value to the function that asked for it.


    The first time we createXMLHttpRequestObject is during the overall object detection
    at the start of the script.


    ```

    window.onload = function () {

    var supportCheck = document.createElement && createXMLHttpRequestObject();

    if (!supportCheck) return;

    ```


    [XMLHttpRequest Speed Meter, lines 19-21]


    The advanced interface should start up only if the browser supports both the W3C
    DOM and XMLHttpRequest. The script tries to create an object. If that fails, the
    initialization function ends, and the user gets the noscript interface.


    # open


    The next step is to open a new request, which means preparing it for sending.
    The actual send command is given later.


    The basic syntax is as follows:


    ```

    xmlhttp.open(method,url,true);

    ```


    method defines the method of the request: GET, POST, or HEAD. The first two work
    as always: With GET the (form) data is appended to the URL as a query string;
    with POST the data is sent along in the HTTP request''s body.


    A HEAD request returns only the HTTP headers of the response, not the file itself.
    This is occasionally useful, for instance if you want to display the last modification
    date of a file.'
  merge: -1
  pgno: 495
- img_proc: true
  md: '> Note that if you want to POST your data you must set the ''Content-Type''
    header of the request to ''application/x-www-form-encoded''.


    `url` is the URL of the file to be downloaded. The last argument tells the browser
    whether to handle the request asynchronously (`true`) or synchronously (`false`).
    You generally use `true`.


    Practical example:


    ```

    xmlhttp.open(''GET'',''some.xml'',true);

    ```


    Now the file.xml is loaded by GET in an asynchronous way.


    Asynchronous means that the browser does not wait for the response, but immediately
    allows more JavaScript commands or user actions. In contrast, if you send a synchronous
    request, all browser activity is stalled until the response arrives.


    The problem is, of course, that if all activity stalls, the browser stops responding
    to the user''s actions. Especially when it takes more than a few seconds to download
    the data, the user may think that the browser has crashed, and this is something
    to be avoided at all costs. Therefore, synchronous requests are rarely useful.'
  merge: -1
  pgno: 496
- img_proc: true
  md: "# readystatechange\n\nAfter you've called the open() method, you should specify\
    \ what happens when the response to your request arrives at the browser. For this\
    \ you use the (origi-ally Microsoft-proprietary) readystatechange event, fires\
    \ whenever the “ready state” of a request changes.\n\nPersonally, I'd rather use\
    \ a simple load event (“when the response has loaded, do this”), but unfortunately\
    \ Explorer doesn't support that event on XMLHttpRequestRequests.\n\nreadystatechange\
    \ is a curious event. There are five ready states: 0, 1, 2, 3, and 4.\n\n| Value\
    \ | Meaning | Description |\n| 0 | Uninitialized | The object has been created,\
    \ but the open method has not yet been called. |\n| 1 | Loading | The object has\
    \ been created, but the send method has not yet been called. |\n| 2 | Loaded |\
    \ The send method has been called, but the status and headers are not yet available.\
    \ |\n| 3 | Interactive | Some data has been received. |\n| 4 | Completed | All\
    \ data has been received. |\n\nThe first four values contain a few obscure incompatibilities\
    \ and are very rarely used in practice. (I've never understood their purpose.)\
    \ Ready state 4 (all data has been received) is the state generally used.\n\n\
    The basic syntax is as follows:\n\n```\nxmlhttp.onreadystatechange = function\
    \ () {\n  if (xmlhttp.readyState != 4) return;\n  // do something with the response\n\
    }\n```\n\nWhen the ready state of the request changes, the handler fires. Its\
    \ first point of action is seeing if readyState is 4. If it isn't, the function\
    \ ends immediately. If"
  merge: -1
  pgno: 497
- img_proc: true
  md: "it is, you can start doing something with the response. We'll get back to “doing\
    \ something with the “response” in 10B.\n\n# Oddities\n\nAlthough onreadystatechange\
    \ seems a normal event handler, there are some oddities. First of all, the event\
    \ type load in Explorer, instead of the readystatechange you expect. Secondly,\
    \ only Safari creates an event object for this event. Therefore, the following\
    \ code doesn't work:\n\n```\nxmlhttp.onreadystatechange = handleResponse;\nfunction\
    \ handleResponse(e) {\n  var evt = e || window.event;\n  // now evt is only defined\
    \ in Safari\n  // IE, Mozilla and Opera can't find the event object\n}\n```\n\n\
    Fortunately, access to the event object is rarely necessary when using onreadystatechange.\n\
    \n# send\n\nOnce you've called the open() method and set an onreadystatechange\
    \ event handler, you can send the request. The syntax is follows:\n\n```\nxmlhttp.send(data);\n\
    ```\n\nThe send() method requires an argument. If you POST your data, the argument\
    \ is the post data; if you use GET, the argument is null.\n\nWhen the request\
    \ is sent, you wait for the response to arrive. When it arrives, the onreadystatechange\
    \ event handler kicks in and does what you instructed it to do.\n\n# setRequestHeader\n\
    \nThe four features we've discussed so far are required. There are two more methods\
    \ of the XMLHttpRequest object that can come in handy in some situations."
  merge: -1
