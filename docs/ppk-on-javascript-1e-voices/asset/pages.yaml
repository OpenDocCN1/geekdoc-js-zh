    # WARNING Browser incompatibilities ahead


    The problem is that there''s no simple cross-browser way of reading the entire
    text of the style sheet. The W3C CSS module contains the cssText property, but
    the browsers don''t entirely agree on the scope of this property.


    cssText contains style declarations as a string. But which style declarations?
    There are three ways to use cssText:


    +   - document.styleSheets[0].cssText

    - document.styleSheets[0].cssRules[0].cssText

    - document.styleSheets[0].cssRules[0].style.cssText


    The first example would give the entire style sheet as a string; that''s exactly
    what we need for Edit Style Sheets. If we pasted document.styleSheets[0].cssText
    into a hidden text area, we''d be ready.


    Unfortunately, Mozilla doesn''t support this cssText. For this reason, I was sorely
    tempted to restrict this script to Explorer Windows, but its implementation was
    delayed several times, and in the end I didn''t solve this conundrum.


    > At the time of writing, the first use of cssText was supported only by Explorer
