  md: 'The function next checks if the request''s readyState is already 4. If so,
    the document is already in the browser''s cache, and the request does not need
    to be sent. This is important for Explorer, since you request a file that''s already
    cached in this browser, it may fire the onreadystatechange event handler before
    the request is officially sent, and could cause weird problems.


    Finally, the function sends the request with postData (either the POST data or
    null) as an argument.


    # abort


    > WARNING Browser incompatibilities ahead


    The abort() method allows you to abort an ongoing request. This is rarely necessary.
    When you take an XMLHttpRequest object that''s already downloading and give it
    other instructions, it forgets about its previous orders and starting downloading
    the new data. The only exception to this rule is Mozilla: This browser may require
    you to use the abort() method first.


    Note that if you use abort() you should first remove the onreadystatechange event
    handler, since Explorer and Mozilla also fire this event handler when the request
    is aborted:


    ```

    xmlhttp.onreadystatechange = function () {};nxmlhttp.abort();

    ```


    Note that Explorer requires you to assign an empty function to onreadystatechange.
    If you give it a null value, weird errors ensure.


    # B: Handling the response


    The request is sent to the server, which returns a document. In 1OC we''ll take
    a closer look at what format this document should be (XML, HTML, JSON); in this
    section we''ll treat the nuts and bolts of handling the response.'
