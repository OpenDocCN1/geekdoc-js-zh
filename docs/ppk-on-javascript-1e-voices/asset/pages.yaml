  md: '```

    Dynamic HTML (HTML) is the changing of CSS properties by means of JavaScript.
    See 7A for more details.

    ```


    Collectively, these tricks became known as DHTML. They had little to do with actual
    HTML, and much to do with CSS and JavaScript, but a now-forgotten marketing genius
    coined the term, which has persevered even to the present day.


    # Competing standards


    In order to make HTML possible, the browsers needed to extend their JavaScript
    capabilities. In the past, Web developers could access only form fields, links,
    and images, but now it became mandatory to allow access to layers, too, so that
    they could be moved across the browser window. A DOM upgrade was necessary.


    Unfortunately, in those days no specification existed for the improvement of JavaScript.
    Worse, both Netscape and Microsoft were trying to get a decisive advantage over
    the other, and therefore deliberately created totally incompatible DOM extensions.
    Both hoped that their DOM would become the new standard and the other DOM would
    be relegated to the ash of history.


    Thus the proprietary DOMs (also known as “intermediate DOMs”), since they came
    between Netscape 3''s and W3C''s DOMs came into being. Netscape 4 supported the
    document.layers DOM, while Explorer supported (and still supports) the document.all
    DOM. They worked quite differently, but in the end Explorer''s implementation
    was closer than Netscape''s to the eventual W3C DOM, as well as easier to use.'
