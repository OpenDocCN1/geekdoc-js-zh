  md: '# Core


    ALL PROGRAMMING LANGUAGES have to contain structures that allow you to say, “If
    this is the case, then do that,” or to perform calculations, or to define bits
    of code that should be run repeatedly. These structures—the structures that actually
    make JavaScript programming language—are part of the JavaScript Core language.


    In this long chapter, we''ll discuss the Core syntax and structures we use most
    often. For beginners, Core is the most complicated area of JavaScript, partly
    because some features are technically dense, and partly because their practical
    use is not always even. On the other hand, common Core functionalities such as
    operators, variables, and functions work pretty intuitively.


    Although I tried to treat all topics in the (to me) most logical order, readers
    with programming experience might want to skip some advanced subjects until later.
    That''s quite right; this chapter isn''t supposed to bog you down in details,
    but to enhance your understanding. If something doesn''t work for you, just leave
    it be for the moment and return to it later on.


    You might even decide to skip this chapter entirely, as well as Chapter 6, and
    move straight to event handling in Chapter 7. Later, when you have more experience,
    you can always return to Core.'
