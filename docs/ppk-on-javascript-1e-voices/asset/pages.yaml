  md: "# Solution\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_375_0.png)\n\nWorking\
    \ with the mouseout event can quickly become horribly complicated. That's why\
    \ I decided to use a separate array, currentlyOpenedMenus, which stores all menus\
    \ that are currently opened. Thus I can easily go through all opened menus and\
    \ see if they need to be closed. I reached this solution independently in both\
    \ my 2001 and my 2005 dropdown menu scripts, so I suppose this approach is worthwhile.\n\
    \nThe principle is simple. As soon as a menu is opened, a reference to this menu\
    \ is added to currentlyOpenedMenus:\n Menu, lines 34-37]\n\n```\nevtTarget.className\
    \ = 'highlight';nevtTarget.relatedItem.className = 'foldOut';nevtTarget.relatedItem.opened\
    \ = true;\ncurrentlyOpenedMenus.push(evtTarget.relatedItem);\n```\n\nWhen the\
    \ time comes to close menus, I go through this array and decide which of the currently\
    \ opened menus should be closed.\n\nHow do I decide whether to close a certain\
    \ menu? I take the element mouse goes to and see if the menu contains this element.\
    \ If it does, the menu"
