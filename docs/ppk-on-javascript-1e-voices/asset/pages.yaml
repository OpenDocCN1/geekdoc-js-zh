    # E: Creating and cloning elements


    The W3C DOM allows you to create your elements and text nodes, and add them to
    the document tree. In theory, you could remove all elements from the tree, create
    new ones, and repopulate the tree, thus changing the page completely. In practice,
    this feature is used in a somewhat restrained way.


    The DOM also allows you to clone existing elements, so that you can easily duplicate
    a certain feature and spread copies through your document.


    # createElement() and createTextNode()


