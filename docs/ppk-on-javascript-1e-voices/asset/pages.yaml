  md: '# XMLHTTP Speed Meter


    This script is usable enough, even though I''d be the first one to admit both
    the XMLHTTP call and the animation have mainly been added for the wow-effect,
    not to combat serious usability problems. It''s perfectly possible to create a
    simple form, submit it to the server, and receive a page that shows the download
    speed.


    In fact, the noscript version does exactly that. The database programmer created
    two PHP scripts: one to create XML for the scripted version, and one to create
    HTML for the noscript version.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_93_0.png)


    Figure 2.12 XMLHTTP Speed Meter noscript.


    The only visible difference between the scripted and noscript versions is the
    Submit button. Note how it''s being shown and hidden:


    +   - The HTML contains a hard-coded `<input type="image">` that will work anywhere.
    It submits the form to the HTML-generating PHP.

    - When JavaScript is supported, the input is hidden. The script also revises the
    form''s `action` attribute so that it points to the XML-generating PHP.


    # Site Survey


    People (especially Web developers) hate popups. Since Site Survey hinges on the
    clever use of a popup, some will question its usability. I knew when I created
    the script, and the client and I quickly agreed on a few measures to maintain
    a semblance of user-friendliness:


    +   - The popup would contain a short text that explained that a survey was in
    progress, and would they please leave the popup open. Thus it would at least be
    clear why the popup was present.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '+   - The user would be allowed to close the popup at any time. The script
    would interpret this as a sign that the user did not want to participate in the
    survey. In addition to being user-friendly, this was also a coder-friendly decision:
    when the popup closes, do nothing.


    As to accessibility, the popup won''t open when JavaScript is disabled, and hence
    the script that follows the user in his journeys through the surveyed site won''t
    work, either. Since the survey is not a necessary ingredient of any site, its
    demise is no problem; the host sites remain as accessible (or inaccessible) as
    they were.


    The only accessibility problem is that noscript users are effectively barred from
    participating in the survey. Since they might conceivably use the survey to complain
    about the host site''s in, I offered them one loophole to enter it. The host site''s
    homepage contains (or rather, is supposed to contain) a line of text with a link
    that leads directly to the survey. If the script kicks in, it is replaced by a
    text that warns that a popup is about to be opened.'
