  md: '# Strings


    Strings are sequences of characters. When you define single strings, you always
    surround them by either single quotes '' or double quotes ". This tells JavaScript
    that it''s dealing with a string. Examples:


    ```

    var exampleString = ''I am a JavaScript hacker'';\var exampleString2 = ''49'';",

    ```


    Note that the second example string contains a number (or rather, two numerical
    characters), but since it is surrounded by quotes, as far as JavaScript is concerned
    it''s a string.


    Strings are by far the most versatile type JavaScript has to offer, and pretty
    soon you''ll notice that you use strings everywhere. most of the times you read
    out something from the DOM—say, a text the user has entered in a form field—you
    get a string.


    We''ll take a closer look at strings in 5F.


    # Booleans


    Booleans know only two values: true and false. Real boolean variables are only
    useful when you have to answer a simple Yes/No question ("Is this form free of
    errors?" "Did the user check this checkbox?"). Example:


    ```

    var exampleBoolean = true;

    ```


    Note that there are no quotes around the true; if there were, it''d be a string,
    not a boolean. We''ll take a look at the boolean data type in 5G.


    # Objects


    The object data type encompasses everything that''s not a number, string, or boolean.
    It differs from the other three types because objects are copied, passed, and
    compared by reference, not by value.


    What does that mean? Take the following lines:


    ```

    var x = 1;

    var y = document.getElementById(''myName'');

    ```'
