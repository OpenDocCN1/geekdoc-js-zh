  md: '# E: Debugging


    When a browser doesn''t understand a certain JavaScript command, it produces a
    JavaScript error message. You need these messages for debugging, but unfortunately
    they''re sometimes hard to read.


    Occasionally the error messages won''t help you, or aren''t there at all, even
    though something is clearly wrong with your scripts. In these cases, you have
    to switch to other bug-hunting techniques.


    # Error messages


    First, you must make sure that you see error messages when they occur. In most
    browsers, this means opening the JavaScript error console:


    +   - Mozilla: Tools > (Web Development > JavaScript Console (the Web Development
    submenu exists in Mozilla, but not in Firefox).

    - Explorer: Double-click on the yellow triangle in the lower-left corner. Then
    check the checkbox in the error message alert.

    - Safari: Debug > Show JavaScript Console.

    - Opera: Preferences > Advanced > Content > JavaScript Options > Open JavaScript
    console on error. (Valid for 8.54. Unfortunately, the Content menu is missing
    in my 9.0 2 beta. In general, Opera is prone to moving these options to other
    tabs and menus all the time.)


    You''ll notice that the error messages vary greatly in quality. Take this wrong
    bit of script:


    ```

    var x = document.getElementById(''tes'');

    alert(x.nodeName);

    <div id="test"></div>

    ```


    I accidentally forgot the last ''t'' of ''test'', so the browsers don''t know
    what I''m talking about. Let''s see how they react.'
