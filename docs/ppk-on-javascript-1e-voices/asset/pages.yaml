  md: '# Words of thanks


    This book would never have been written if I hadn''t gained a lot of experience
    by creating the 100 or so JavaScript pages on www.quirksmode.org and if they hadn''t
    been appreciated worldwide.


    There first thanks go to my faithful readers who supported me mentally over the
    years, and who are now supporting me materially by buying this book.


    Second thanks to the editors of this book: Dean Edwards (general), Derek Featherstone
    (accessibility), and David Flanagan (Core), whose useful comments uncovered many
    mistakes and omissions; my development editor Wendy Sharp, who tightened the book
    considerably and more than one pointed out I forgot to explain something that''s
    obvious to me but not to my readers; and my former colleagues Babette van Hardveld,
    Marloes Hautmann, and Remco van ''t Veer, who read early drafts of a few chapters
    and provided valuable feedback from the perspective of non-JavaScript programmers.


    Third goes to my JavaScript fellow travellers who time and again wrote nifty scripts,
    explained obscure features, wrote great articles and books, criticized my wild
    ideas and generally acted as peer reviewers; among others Cameron Adams, Erik
    Arvidson, James Edwards, Aaron Gustafson, Christian Heilmann, Jeff Howden, Jeremy
    Keith, Stuart Langridge, Scott Andrew LePera, Dylan Schiemann, Bobby by van der
    Sluis, Doris Smith, Dan Webb, and Simon Willison.


    Also thanks go to Nick Finch and Jeffrey Zelman, over the years who gave me plenty
    of opportunity to publish articles and columns on their sites www.digital-web.com
    and www.alistart.com, who provided me with serious, enlightening feedback, and
    whose early encouragement proved to me that, though not a native speaker, I could
    write English well to get along in the world of Web development.


    Special thanks to E minor, the mysterious resident guru of the WDF mailing list
    who patiently explained the concept of object detection and why it''s superior
    to browser detection to a bewildered newbie back in 1998. This explanation showed
    me how clueless the average JavaScript developer was, and since I was now slightly
    less clueless myself I decided to publish a few articles to explain this and other
    important JavaScript principles.'
