  md: 'Both of the statements above multiply c by a and then assign the result to
    c, but the second one is shorter, and is used quite a lot.


    Of course, the +=, -- and /= operators also exist. They do the same thing: they
    take the value of the left-hand variable, then add, subtract, or divide it by
    the right-hand value, and assign the result to the left-hand variable.


    Finally, there is the unary negation operator - which simply means “Make this
    number negative":


    ```

    var a = -3;

    ```


    Now a contains the value -3.


    # ++ and --


    JavaScript contains a shorthand for adding or subtracting 1: the ++ and operators.
    As we''ll see in 5H, these are often used in for loops:


    ```

    c++;n++c;

    ```


    These statements do the same thing: Add 1 to c. But there''s a subtle difference
    between the two. If you put ++ before the variable name, the variable is first
    incremented (1 is added to it) and the new value is passed to the next operator.
    If you put the ++ after the variable name, the variable''s old value is passed
    to the next operator, and it is incremented afterwards.


    Take this example:


    ```

    var c = d = 1;

    var a = c++;nvar b = ++d;

    ```


    Initially c and d are both 1, and the ++ operator increments both to 2. However,
    a is 1 and b is 2:


    +   - var a = c++ means “Assign the (old) value of c to a, and then increment
    c."

    - var b = ++d means "Increment d, and then assign the (new) value to b."'
