  md: '# cloneNode()


    The cloneNode() method clones a node; that is, it makes a near-exact copy of the
    node, which you can subsequently insert in the document tree. For instance:


    ```

    var x = document.getElementsByTagName(''h1'')[]

    var y = x.cloneNode(true);

    document.body.appendChild(y);

    ```


    I take the first <h1> in the document and clone it. Then I append the clone to
    the <body>.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_405_0.png)


    FIGURE 8.12 The last element on the page is a clone of the <h1>.


    cloneNode() has a couple of features you must know about in order to use it properly:


    +   - cloneNode() expects an argument true or false. true means "Clone the element
    and all its child nodes." false means "Clone the element but not its child nodes."
    In practice, you always use true; I have never yet encountered a situation in
    which you want to clone a node but not its children.

    - cloneNode() does not clone event handlers. This is extremely annoying, but it''s
    how the method was specified. (Why? I have no idea.) So every time you clone a
    node with event handlers, you have to redefine them on the clone.'
