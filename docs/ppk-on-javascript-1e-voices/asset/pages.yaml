  md: 'The undefined value is returned in three cases:


    +   1. If you declared a variable but did not assign a value to it.


    +   2. If you access an undefined property of an object (and in JavaScript you
    can see anything like as a property of an object).


    +   3. If you have defined a function argument, but no value is passed to it.
    (5l for arguments.)


    Take, for instance, this code:


    ```

    var x;

    alert(x);

    ```


    I declared variable x explicitly (see 5D), but it doesn''t have a value. Therefore
    the alert gives undefined.


    The second rule has odd consequences:


    ```

    // y is not declared

    alert(y);

    alert(window.y);

    ```


    As you''d expect, the first alert gives an error message: y is not declared. However,
    the second alert accesses y as a property of JavaScript''s global object, the
    window (see 5l). Since undefined properties always have the value undefined, the
    alert doesn''t give an error message, but instead shows "undefined."


    # The typeof of operator


    The typeof operator shows the data type of a value. Its syntax is:


    ```

    typeof x;

    ```


    Note two oddities:


    +   * When used on functions, typeof yields "function". Nonetheless, as far as
    data types are concerned, functions are really objects.


    +   * null evaluates to "object".'
