  md: "# setTimeout or setInterval?\n\nWhy do I use setTimeout, not setInterval? In\
    \ my opinion, the two methods, though similar, are meant for different situations,\
    \ especially when it comes to animations. Before continuing, let's review the\
    \ difference:\n\n```\nsetTimeout(function(), 1000);\nsetInterval(function(), 1000);\n\
    ```\n\nThe first line means \"Execute function theFunction() 100 milliseconds\
    \ from now.\" The second line means \"Execute function theFunction() 100 milliseconds\
    \ from now, and continue executing it every 100 milliseconds.\"\n\nsetInterval\
    \ is best for animations that continue for an indefinite time (for instance, until\
    \ the user does something). setTimeout, on the other hand, is best suited for\
    \ animations that have a fixed start and end point.\n\nThe animation that moves\
    \ the meter to a new value has a fixed start (the old value) and a fixed end point\
    \ (the new value). Therefore this animation requires setTimeout.\n\nOnce the XMLHttpRequest\
    \ Speed Meter has arrived at its new value, however, a second animation kicks\
    \ in. This is the fluctuation that continues until the user does something. Since\
    \ the fluctuation doesn't have a fixed start and end point but should continue\
    \ until further notice, this animation requires setInterval.\n\n# Examples\n\n\
    XMLHttpRequest Speed Meter initializes the two kinds of animations. When a new\
    \ speed arrives from the server, moveToNewSpeed() is called. We'll ignore the\
    \ calculations and focus on setting and cancelling the timeouts and intervals:\n\
    \n[XMLHttpRequest Speed Meter, lines 78-86, condensed]\n\n```\nfunction moveToNewSpeed(Mbit)\
    \ {\n  for (var i=0; i<animationSteps.length; i++) {\n    clearTimeout(animationSteps[i]);\n\
    \    animationSteps.length = 0;\n  }\n  // calculations\n}\nclearInterval(fluctuationInterval);\n\
    ```"
