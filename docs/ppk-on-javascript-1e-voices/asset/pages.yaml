  md: "# Usable Forms\n\nPicking the right events for Usable Forms is tricky. The\
    \ script needs to know if the user has changed any form field with a rel attribute.\
    \ A change event would seem the obvious choice, but I decided not to use it for\
    \ two reasons.\n\nThe page I originally Usable Forms for contained 142 form fields,\
    \ and I didn't want to set a separate event on every one of them. Instead, I wanted\
    \ to use event bubbling. Unfortunately, change is an interface event and cannot\
    \ be registered on the document in most browsers. Therefore, I decided to use\
    \ the click event. Registering an onclick event handler on the document is always\
    \ possible, and therefore the event bubbles up nicely.\n\nIn addition, in Explorer\
    \ the change event on radio buttons and checkboxes fires only when the user blurs\
    \ them, i.e., when it clicks or tabs elsewhere. This is a serious problem in Usable\
    \ Forms' interface. It should be totally to the user that checking or unchecking\
    \ certain form fields causes the form to change. We cannot postpone the form change\
    \ until later, since could confuse some users.\n\nI use addEventListener(), because\
    \ Usable Forms is a module that can be added to any site, and site may already\
    \ have a document.onclick event handler:\n[Usable Forms, line 53]\n\n```\naddEventListener('click',showHide);\n\
    ```\n\nThere are no accessibility issues, since a click event also fires when\
    \ the user activates form fields by hitting the space bar.\n\nUnfortunately, the\
    \ general click event doesn't cover changes to select boxes, since click events\
    \ on options or selects are not supported. For select boxes I needed the change\
    \ event, and its lack of bubbling capabilities forced me to add individual change\
    \ events to all selects:\n[Usable Forms, lines 22-23]\n\n```\nvar selects = document.getElementsByTagName('select');\n\
    for (var i=0;i<selects.length;i++)\n  addEventListener(selects[i],'change',showHide);\n\
    ```\n\nWe discussed Usable Forms' need for the event target in 7F."
  merge: -1
  pgno: 365
