- img_proc: true
  md: 'Subdomains, however, are another matter. Suppose I had a domain search.quirksmode.org.
    Since my test cookies are set in the domain www.quirksmode.org, the pages in search.quirksmode.org
    do not have access to those cookies. I can change this by setting the cookie''s
    domain. If I make it domain=quirksmode.org, the cookie would be associated with
    all pages in all subdomains of quirkmode.org, including www and search.


    # Setting a cookie


    To summarize, a cookie consists of the following parts:


    +   - A name/value pair that contains the actual information; this is empty by
    default.

    - A GMT string with the expiry date; if not set, the cookie will expire when the
    user closes her browser.

    - A directory path; by default the directory of the page the cookie is set to.

    - A domain; by the default domain of the page the cookie is set to on.


    The syntax is as follows:


    ```

    document.cookie = ''testcookie=yes;expires=Tue, 23 Jan 2007 13:57:39 UTC; path=/;
    domain=quirksmode.org'';

    ```


    This creates a new cookie with the name testcookie and the value yes, valid until
    23 January 2007 in all directories of quirkmode.org and all its subdomains.


    This syntax is very precise; the semicolons and spaces that separate the various
    arguments and the strict form of the expiry date.


    Once set, the cookie is immediately available for reading. When the user next
    requests a page from your site, the cookie is sent along in the HTTP headers and
    can be caught by server-side programs.'
