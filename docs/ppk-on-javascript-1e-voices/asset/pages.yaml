  md: '# L: Markers


    There is one more aspect of Usable Forms I''d like to present: markers. Unlike
    all other topics in this chapter, markers are not "native" W3C DOM features, but
    rather a structuring trick I use in Usable Forms and Sandwich Picker.


    First, consider the problem. Usable Forms hides fields until the user takes a
    certain action: checks a radio button, selects a new option, whatever. Then the
    script retrieves the count `<tr>` from hyperspace and reininserts them into the
    document.


    But where in the document? Correct placement is absolutely vital to Usable Forms''
    user experience. When creating the HTML, we put the fields in an logical order
    to the user (we hope), and when form return from hyperspace they should once again
    take up this logical place in the form.


    To a lesser degree, Sandwich Picker has the same problem. If a user discards a
    sandwich, that sandwich should return to the start table at the bottom of the
    page. Although its exact placement is not as vital as in Usable Forms, it should
    at least go under the right price header.


    The solution to this placement problem is to use markers. The principle is very
    simple: I create one empty, hidden `<tr>` for each `<tr>` that will be hidden
    or moved, giving it a unique ID, and insert it just before or after the `<tr>`
    I''m going to remove. When the `<tr>` has to return to its original position,
    I insert it before the marker.


    Thus I keep the placement information where it belongs: in the HTML structural
    layer. I could also use a complicated JavaScript object, array, or hash to hold
    this information, but I find relying on the document structure much safer more
    elegant.


    Choosing a simple ID-naming scheme is important in using markers:


    [Usable Forms, lines 1, 18-19, and 41-51]


    ```

    var containerTag = ''TR'';nvar marker = document.createElement(containerTag);

    marker.style.display = ''none'';

    ```'
