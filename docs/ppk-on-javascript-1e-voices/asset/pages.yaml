  md: "# Use local variables\n\nIt's good programming practice to use as many local\
    \ variables as possible. It prevents variables from interfering with each other,\
    \ even if they share a name.\n\nFor instance, in Sandwich Picker I use the variable\
    \ price to hold the total price of all sandwiches the user ordered. After all,\
    \ it's a glaring obvious name for a variable that holds a price, and other programmers\
    \ will immediately understand its purpose.\n\nIf I had more price-calculation\
    \ functions, I'd likely want to use price there, too. However, if price were a\
    \ global variable, several functions would change its value. The result would\
    \ be that price has an unexpected value and my calculations would go wrong.\n\n\
    It's far safer to define each price variable separately—to create local variable\
    \ price for each price-calculation function. Each function will be unaware of\
    \ the price variables in the other functions, and there is no danger of interference.\n\
    \n# Defining local variables\n\nHow do you define a local variable? There are\
    \ two ways:\n\n+   - You explicitly declare them with the var keyword inside the\
    \ body of a function.\n- You declare them as an argument when you define a function.\n\
    \nA variable that has been declared in any other way is global in scope. (We'll\
    \ discuss functions in more depth in 5.1.)\n\nIn the following example, message\
    \ is a global variable, because it's defined out-side of any function body:\n\n\
    ```\nvar message = 'Error!';\nfunction doSomething() {\n    alert(message);\n\
    }\n```"
  merge: -1
