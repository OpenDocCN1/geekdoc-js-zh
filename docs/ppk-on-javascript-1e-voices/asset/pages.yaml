  md: "The following has a better chance to work across the board:\n\n```\nvar x =\
    \ document.getElementsByTagName('p')[0];\nvar previousElement = x.previousSibling;\n\
    while (previousElement.nodeType == 3) {\n  previousElement = previousElement.previousSibling;\n\
    }\nx.parentNode.insertBefore(x, x.previousElement);\n```\n\nWe take the element's\
    \ previousSibling. If this turns out to be a text node, we take the previous sibling\
    \ of the previousSibling, and we continue this check until we encounter a non-text\
    \ node.\n\nThere's a hidden assumption here: the parent node of the <p> (the <body>\
    \ here, it might be another node in other situations) never contains real text\
    \ nodes that actually contain text. If you're absolutely certain that this is\
    \ the case, the last example will work. But as soon as Web developer or CMS accidentally\
    \ adds a real text node as a sibling of the <p>, the script will misfire.\n\n\
    By far the safest solution is not to use previousSibling at all:\n\n```\nvar x\
    \ = document.getElementsByTagName('p')[0];\nvar y = document.getElementsByTagName('h1')[0];\n\
    x.parentNode.insertBefore(x,y);\n```\n\nThis makes sure that your script always\
    \ uses the correct elements, regardless of empty nodes.\n\nIn fact, the best defense\
    \ against empty text nodes is not to use previousSibling, nextSibling, and childNodes.\
    \ In the eight example scripts, I use nextSibling only twice (and previousSibling\
    \ and childNodes not at all). In both cases I use nextSibling when I add a new\
    \ element to the document, and it doesn't really matter whether it's inserted\
    \ before an empty text node or not. In cases where I have to change the order\
    \ of elements that are already in the document, I always search for all relevant\
    \ elements through getElementsByTagName()."
