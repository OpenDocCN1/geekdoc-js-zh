  md: 'A more complicated example is my favorite line of object detection, which checks
    if the W3C DOM is supported:


    ```

    var W3DOM = document.getElementsByTagName &&

    document.createElement;

    ```


    It checks if the browser supports getElementsByTagName and createElement. The
    principle is the same: if these methods (with data-type object) exist, they evaluate
    to true; if they don''t, they are null and evaluate to false. If a browser supports
    both of them (&&), it supports the W3C DOM.


    # Advanced uses of boolean operators


    The value returned by the && and || operators is unusual. To show why, let''s
    look at a case that involves strings and numbers:


    ```

    var x = ''2'';

    var y = ''3'';

    var z = x * y;

    ```


    As we saw earlier, the strings x and y are interpreted as numbers, the multiplication
    is executed, and the value operation evaluates to (which is a number) is stored
    in z. Therefore, z becomes a number, though x and y remain strings.


    Now let''s look at our last object-detection line:


    ```

    var W3DOM = document.getElementsByTagName &&

    document.createElement;

    ```


    Both objects are interpreted as booleans in order to perform the operation &&.
    Now you''d expect W3DOM to become a boolean, too, just as z became a number in
    the previous example.


    But that doesn''t happen. The boolean operators && and || don''t return true or
    false, but rather the value of the last expression they evaluated. This is very
    much an exception to the general rule:


    ```

    var W3DOM = document.getElementsByTagName &&

    document.createElement;

    alert(W3DOM);

    ```'
