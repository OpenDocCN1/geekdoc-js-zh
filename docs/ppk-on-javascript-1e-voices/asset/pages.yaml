  md: 'As we saw in 8B, the `<html>` and `<body>` tags are represented by `document.documentElement`
    and `document.body`. Therefore, one of these lines will give you the browser window''s
    width (without the scrollbars):


    ```

    document.documentElement.clientWidth;

    document.body.clientWidth;

    ```


    The second line is meant for Explorer versions earlier than 6, while the first
    line is meant for all other browsers. The difference is the interpretation of
    the `<body>` tag. In ancient times, the `<body>` element was the topmost visible
    element, and however, modern browsers made `<body>` a normal block-level element
    hidden, while `<html>` encompasses the entire browser window.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_488_0.png)


    Figure 9.6

    In Mozilla, the `<html>` element encompasses the entire browser window, while
    the `<body>` element is a normal block-level element. In Explorer 5.5, the `<body>`
    element encompasses the browser window, while the `<html>` element is invisible.


    Hence, to read out the window''s width and height, you to query the `clientWidth`
    of the `<html>` element in modern browsers, but of the `<body>` element in older
    ones. Fortunately, that''s simple:


    ```

    var windowWidth = document.documentElement.clientWidth;

    // document.body.clientWidth;

    ```'
