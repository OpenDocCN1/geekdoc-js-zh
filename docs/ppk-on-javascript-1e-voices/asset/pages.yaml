  md: '# INNERHTML AND THE SPECS


    innerHTML is not part of the W3 DOM specification. For some people, that''s reason
    enough not to use it. Personally, I disagree sharply: as we see in this section
    and the next, innerHTML is excellently suited for some tasks, and it has perfect
    browser compatibility.


    You''ll have to decide this for yourself, but I don''t see any good reasons for
    refusing to use innerHTML. Instead, we should try to find out in which situations
    innerHTML will work better than pure DOM methods, and in which situations the
    pure methods will have the advantage.


    innerHTML gives the HTML content of an element as a string, and it allows you
    to write new HTML content into an element. Take this example:


    ```

    <p id="test">This is a <strong>bold</strong> bit of text.</p>

    var x = document.getElementById(''test'');

    alert(x.innerHTML);

    ```


    Now the alert faithfully says ''This is a <strong>bold</strong> bit of text.''

    You can also italicize the text.


    ```

    x.innerHTML = ''This is an <em>emphasized</em> bit of text'';

    ```


    | File | Edit | View | Bookmarks | Tools | Window |

    |---|---|---|---|---||

    | This is an emphasized bit of text |


    FIGURE 8.13

    Setting the innerHTML immediately changes the document tree.


    # Garbage in, garbage out


    Since innerHTML is so powerful, you should take care to always pass it correct
    HTML. Garbage HTML can cause very weird effects. Take this example:


    ```

    x.innerHTML = ''This is an <strong>nested element</strong> innerHTML'';

    alert(x.innerHTML);

    ```'
