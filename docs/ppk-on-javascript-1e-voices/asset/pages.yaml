  md: '# The best way


    With all that said, what is the best way of registering event handlers? In the
    example scripts, you''ll see that I prefer the traditional model or my addEventSimple()
    function. it so simple and completely cross-browser, and because the this keyword
    always works correctly. There are situations where I cannot use this model, though,
    and in those cases I use addEventSimple().


    I use the traditional model when I have complete control over all scripts in a
    page. Sandwich Picker, for instance, was written specifically for my client''s
    site, and since I created the entire site I could control all event-handler registrations.
    Since there were no other scripts involved, it was safe to use the traditional
    model.


    On the other hand, Usable Forms and Site Survey can be added to any page. These
    modules should not set event handlers through the traditional model, since those
    might overwrite or be overwritten by handlers of the native scripts on the host
    page.


    Therefore I use addEventSimple() in Usable Forms and Site Survey. Using the two
    advanced models ensures that event handlers from my modules and native scripts
    do not interfere with each other.


    Another situation in which addEventSimple() may be a good choice when you need
    mass initialization. For instance, Dropdown Menu and Edit Style Sheets run on
    the same page, but both have a separate initialization function that should be
    executed on. To make sure that the two event handlers do not interfere with each
    other, I set both through addEventSimple().


    So in general I use addEventSimple() when several scripts that should not interfere
    with each other are present (or could be) on the same page.


    Nonetheless, let''s repeat it one more time: the this keyword doesn''t work correctly
    when you use addEventSimple(). I usually solve this problem by tipteing around
    it: if my functions don''t this, then there is no problem.'
