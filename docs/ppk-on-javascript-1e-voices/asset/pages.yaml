  md: 'During one of the overheated 1999 meetings I made a strategic decision. I would
    start to pay serious attention to mobile phones as soon as a serious client turned
    up who was willing to pay serious money for mobile phone support.


    Seven years have passed, and I''m still waiting for that client.


    Frankly I don''t believe Internet over mobile phones will ever amount to much
    in Europe and North America—though Asia is another matter. The phone displays
    and keyboards are too tiny, especially when compared to the wide swaths of space
    people are used to having available on their desktop and laptop computers. We''ll
    see year after next.


    From a testing perspective, mobile phones are an abomination, because there are
    far too many of them. I once heard a story about a testing protocol for mobile
    phones: an entire basketful is carried in and spread among the suffering developers,
    who spend their next few days catering to the phones'' whims. I don''t know if
    the story is true, but it could easily be.


    This dark cloud has a silver lining: Mozilla, Microsoft, Apple, and Opera have
    meanwhile developed developed mobile versions that are being implemented in the
    next generation of phones. This is decidedly an improvement over the “browsers”
    cobbled together by the mobile-phone vendors themselves, which are generally unable
    to support even HTML properly, let alone CSS or JavaScript.


    > HTML SUPPORT IN MOBILE PHONES

    The incomparable Molly Scholz has gone to the trouble of summarizing XHTML support
