- img_proc: true
  md: '# CHOOSING BETWEEN SINGLE AND DOUBLE QUOTES


    Long ago I decided that I''d always use single quotes for JavaScript and double
    quotes for HTML, even though both languages allow both types of marks. Therefore
    I nearly always use single quotes to delimit JavaScript strings.


    I advise you to make such a rule for yourself, since it''ll make your code readable
    and will occasionally prevent errors.


    But if a string contains quotation marks? What if I need the string ''I''m a JavaScript
    hacker''? This doesn''t work:


    ```

    var exampleString = ''I''m a JavaScript hacker'';

    ```


    JavaScript sees the second quote—the one being used as an apostrophe—as a string
    delimiter. Therefore it reads the string ''I'', followed by a bunch of variable
    names it doesn''t understand. The result is an error message.


    One solution is to use double quotes as string delimiters:


    ```

    var exampleString = "I''m a JavaScript hacker";

    ```


    JavaScript sees that you''re using double quotes to delimit the string, and therefore
    considers the single quote a part of the string.


    The other solution is to escape the single quote. This is done by adding a backslash
    (\) just before the character. This backslash tells JavaScript to treat the next
    character as a character, not as a string delimiter. So, this, too, is a valid
    way of defining the string:


    ```

    var exampleString = ''I\''m a JavaScript hacker'';

    ```


    Now JavaScript treats the second quote as a part of the string.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Concatenation: +


    As you learned in 5B, string concatenation means "sewing strings together."

    The principle is as simple:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    var exampleString2 = ''Hello world''

    alert(exampleString2 + exampleString);

    ```


    This yields "Hello world i a JavaScript hacker". You might want a space between
    the two sentences. No problem:


    ```

    alert(exampleString2 + '' '' + exampleString);

    ```


    The shorthand notation also works fine:


    ```

    exampleString2 += '' '' + exampleString;

    ```


    Unfortunately, string concatenation uses the same + operator as does mathematical
    addition (as we saw in 5B).


    # The String object


    As soon as you create a string it''s made into a String object, which contains
    many useful methods and properties that allow you to quickly and easily manipulate
    the string. They are among the most important tools of every JavaScript programmer.


    # length


    A string has a length, and the length property allows you to determine it:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.length); // yields 24

    ```


    Note that this is a read-only property.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# indexOf() and lastIndexOf()


    By the most notorious String method is indexOf(): It returns the index number
    of a string within the main string, and is often used in browser detects (see
    3D) to determine whether the user-agent string of a browser contains, for instance,
    ''MSIE''. Note that the first character in a string has index number 0, not 1.


    For example:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.indexOf(''JavaScript''));

    // yields 7

    ```


    This yields 7, since the substring ''JavaScript'' starts at the eighth character
    (index number 7) in exampleString.


    If the requested string does not exist, indexOf() returns -1:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.indexOf(''PHP'')); // yields -1

    ```


    Now let''s look at a slightly more complex example:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.indexOf(''a'')); // yields 2

    ```


    In fact, there are five ''a''s in exampleString. Without further instructions,
    indexOf() always returns the index number of the first character that matches
    the substring. Therefore, the previous example will yield 2 (which is the index
    number of the third character).


    But suppose you want to look for the second ''a'' in the string. You have to give
    indexOf() extra instructions by adding an argument:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.indexOf(''a'',3)); // yields 5

    ```


    Now indexOf() starts its search at the fourth character (with index number 3)
    and returns 5, since the first ''a'' after the fourth character is the sixth character
    (with index number 5) in the string.'
