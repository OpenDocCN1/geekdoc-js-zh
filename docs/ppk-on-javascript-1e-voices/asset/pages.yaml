  md: 'The browser sees that my pages do not come from microsoft.com, but from quirksmode.org.
    Therefore the value is ignored and I cannot communicate with any page from microsoft.com.


    # Other restrictions


    Apart from having no access to the host computer and the same-source policy, JavaScript
    has the following restrictions:


    +   - JavaScript cannot read properties of the History object (which we''ll discuss
    in 6C). Although you''re allowed to send your users back in their browser history,
    you''re not allowed to see to which page they''ll return.

    - JavaScript cannot set the value of a file upload field. Thus, malicious sites
    owners cannot set the value to the location of a password field and/or then automatically
    submit the form in order to get a copy of the user''s password file.

    - If you try to close a browser window that has been opened by the user, the user
    is asked to allow this action. You may close windows opened by JavaScript without
    this restriction.

    - Most browsers don''t allow you to open new windows that are smaller than 100x100
    pixels and/or are located outside the visible computer screen. In addition, you
    may not produce new windows without title bars.


    # C: JavaScript history


    During its checkered history JavaScript''s purpose has been continually redefined,
    not only because every generation of browsers supports more JavaScript, but also
    because of the struggle for pre-eminence between the fat and the thin models of
    JavaScript programming.


    A historical overview will therefore acquaint you with ancient and modern thinking
    about JavaScript''s purpose, as well as provide perspective on the fat client
    vs then client question discussed earlier. You''ll begin to understand why JavaScript
    has been frequently misunderstood, especially by “hard” programmers.'
