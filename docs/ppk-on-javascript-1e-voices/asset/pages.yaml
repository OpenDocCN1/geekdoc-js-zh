    \ Validation are good examples. I generally use a few classes for form fields,\
    \ because the graphic design often uses two or even three widths for input fields.\
    \ When a form field contains an error, I want to add a special warning style,\
    \ but I don't want to disturb any style that the element might already have. Therefore,\
    \ I cannot simply overwrite the old class value; I'd lose my special widths.\n\
    \nTake this situation:\n\n```\n<input class=\"smaller\" name=\"name\" />\ninput.smaller\
    \ {\n  width: 75px;\n}\ninput.errorMessage {\n  border-color: #cc0000;\n}\n```\n\
    \nInitially, the input has a width of 75px. If the script sets the class to 'errorMessage'\
    \ and discards the old value, the form field would get a red border color lose\
    \ its width, and that would be very confusing to the user.\n\nTherefore I *add*\
    \ the class `errorMessage`:\n[Form Validation, lines 105-106]\n\n```\nfunction\
    \ writeError(obj,message) {\n  obj.className += 'errorMessage';\n}\n```\n\nThis\
    \ code takes the existing `className` and adds the new class to it, preceded by\
    \ a space. This space is meant to separate the new class from any class value\
    \ the object might already have. Now the form field gets a red border color in\
    \ addition to its 75px width—exactly what we want. The form field applies both\
