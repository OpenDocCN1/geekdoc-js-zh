  md: '# Key properties


    Sometimes you want to know which key the user has pressed. As we saw in 7B, this
    is only possible on the keydown and keyup events. Some browsers don''t allow it
    on the keypress event.


    keyCode contains the code of the pressed key. The letters range from 65 (a) to
    90 (z), and most other keys have their own code, too.


    The alt, ctrlKey, shiftKey properties are true when the user presses the Alt,
    Control, false when he doesn''t. In some browsers, these properties are available
    only when the user presses a “real” key simultaneously.


    # F: Targeting


    When an event occurs, you often want to do something with the element on which
    the event took place. In order to do that, you need to find this element.


    For instance, when the user mouses over a link in Dropdown Menus, you need to
    find out which link that is, and whether it has a submenu (i.e., a nested ul).
    If it does, the time has come to drop the menu down. If the user clicks on a form
    field in Usable Forms, you need to find this element and if it has a rel attribute.


    There are two targeting properties. The first is the event object''s target srcElement
    property, which always refers to the element on which the event took place. The
    second is this keyword, which usually (but not always!) refers to the element
    on which you have defined the event handler.


    # The difference


    Take Dropdown Menu. As we saw in 7D, the script defines onmouseover and mouseout
    event handlers on the ul, even though the actual events take place on the o> that
    make up the bulk of the menu. Let''s tweak the script'
