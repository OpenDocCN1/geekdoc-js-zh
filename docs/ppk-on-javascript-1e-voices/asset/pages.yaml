  md: '# appendChild()


    The appendChild() method allows you to append a node as the last child of element.
    If the node you append is already present in the document, it is removed from
    its current position. The node retains all its child nodes; these are also moved
    to the new position.


    Example:


    ```

    var x = document.getElementsByElementsByTagName(''h1'')[0];

    x.parentNode.appendChild(x);

    ```


    ![](img/1cdc3bc9be02360dab81df06bea3c619_396_0.png)


    FIGURE 8.5 The <h1> is removed from its position and becomes the last child of
    the body. Its child node—the node ''Hello World!''—also moves.


    Of course you can also append text nodes:


    ```

    var y = x.firstChild;

    var z = document.getElementsByTagName(''p'')[1];

    y.appendChild(y);

    ```


    Now the text node ''Hello World!'' is removed from the <h1> and appended as the
    last child of the second <p>.


    Return value


    appendChild() returns a reference to the appended node:


    ```

    var x = y.appendChild(z);

    ```'
