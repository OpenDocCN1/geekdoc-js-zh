- img_proc: true
  md: 'Mozilla and Opera are expected to start supporting some of these features in
    2007, and other browsers are expected to follow later. Adobe participates in this
    effort, so ActionScript is also likely to implement Core 2.0.


    # Security


    The purpose of JavaScript is adding usability to a Web site, not breaching the
    user’s privacy and security.


    First of all, picture what happens when an innocent end user finds a Web page
    that contains JavaScript. He essentially downloads an unknown program written
    by an unknown person that’s going to run on his computer. In general, executing
    unknown programs that do unspecified things on and to your computer is the fastest
    way to get infected with viruses, Trojan horses, and other malign entities.


    In order to keep Web secure from these hazards, as well as breaches of privacy,
    JavaScript has strict security regulations. Its most important line of defense
    against malicious scripters is that it simply does not port certain actions.


    # No access to host computer


    JavaScript cannot read from or write to the file system of your user’s computer
    (with the exception of cookies; see 6G). Thus JavaScript cannot read password
    files from or viruses to the user’s hard disk.


    # Same-source policy


    As we’ll see in Chapter 6, JavaScript allows you to access and run scripts that
    are located in another frame or window. Nonetheless, without restrictions this
    would be a serious security hazard, since it might allow, for example, malicious
    site owners to read out the password the user types in his online banking tool,
    and then submit this password to their own servers.'
  merge: -1
