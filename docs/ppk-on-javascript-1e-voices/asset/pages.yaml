  md: '# INTRODUCTION


    Form Validation contains the basics of form handling, it generates a bit of HTML,
    and it uses JavaScript associative arrays in an interesting wây.


    # Dropdown Menu


    In 2004 I was contacted by Orchid for Change which offers Websites to local organizations
    affiliated to the Democratic Party.


    One script Orchid needed was an all-time classic: the dropdown menu. Even though
    its usability is somewhat suspect, it has been a favorite for years and is likely
    to remain one of the most requested scripts in the near future.


    This script gives excellent examples of the close cooperation between CSS and
    JavaScript to ensure accessibility, making a script keyboard-compatible, the complete
    mouseout event can cause, and a few more advanced topics.


    # Edit Style Sheet


    The next example script was also written for Orchid.


    Orchid has several HTML templates with main style sheets that define the positioning
    of the various items (masthead, navigation, main content, etc.). A client selects
    one of these pre-defined templates, and a site is created.


    However, to make each site unique, the client should have the opportunity to fine-tune
    the styles, mainly the colors, background-colors, fonts and typographical styles.
    For that purpose, each site has a second style sheet that can be tweaked to accommodate
    unique parts of the design.


    I wrote the Edit Style Script to allow clients to change this second style sheet
    for themselves. The client enters the desired colors and typography into a form,
    and the style sheet is changed so that the results are immediately visible.


    Unfortunately this script never left prototype phase. It therefore lacks a few
    features, notably a way of submitting the changed style sheet to the server and
    applying it to the entire site. Nonetheless the script provides an example of
    editing style sheets, as well as preparing your HTML forms to cooperate with a
    script.'
