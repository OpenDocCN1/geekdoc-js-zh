- img_proc: true
  md: "Therefore I use a do/while() loop:\n\n[XMLHTTP Speed Meter, lines 79-95, condensed]\n\
    \n```\nfunction moveToNewSpeed(Mbit) {\n  var distance = Mbit,- currentMbit;\n\
    \  var direction = distance/Math.abs(distance);\n  do {\n    pos += direction;\n\
    \    // give animation orders\n  } while (pos != Mbit)\n}\n```\n\nNow the test\
    \ pos != Mbit is executed after every loop instead of before. When we reach the\
    \ point where pos is equal to Mbit, the loop first executes the final step of\
    \ the animation. Only when that's done it conclude that it should stop.\n\n# break\
    \ and continue\n\nWe already encountered two statements related to loops: break\
    \ and continue.\n\n# break\n\nThe break statement can be used only within a switch\
    \ or a loop statement. It means \"End this code block immediately.\" It always\
    \ refers to the innermost code block of which it's part.\n\nI use it in Form Validation.\
    \ When I find an error in a form field I immediately want to create an error message\
    \ and go on to the next field:\n\n[Form Validation, lines 85-96, condensed]\n\n\
    ```\nfor (var j=0;j<reqs.length;j++) {\n  var OK = validationFunctions[reqs[j]](x[i]);\n\
    \  if (OK != true) {\n    // generate error message\n    break;\n  }\n}\n```"
  merge: -1
  pgno: 235
- img_proc: true
  md: "The break statement works on the for loop. This loop goes through all values\
    \ of the validation attribute, and each of these values has an associated function\
    \ (see 5K).\n\nIf that function returns an error, an error message is generated.\
    \ If that happens, the script breaks for the loop, because I don't want to continue\
    \ with the other validations; more than one error message would only confuse the\
    \ user.\n\nAs we've seen, break has a slightly different function in the switch\
    \ statement.\n\n# continue\n\nThe continue statement can only be used in a loop,\
    \ and it means \"Go on to the next iteration.\" It always refers to the innermost\
    \ loop of which it's a part.\n\nTake this example:\n\n+   - Dropdown Menu, lines\
    \ 7-19, condensed heavily\n\n```\nvar lists = document.getElementsByTagName('ul');\n\
    for (var i=0;i<lists.length;i++) {\n  if (lists[i].className != 'menreet') continue;\n\
    \    initialize <ul>\nn}\n```\n\nThe script takes all <ul> tags in the document\
    \ and loops through them. If the class name of a-<ul> is not 'menreet', then it\
    \ doesn't contain a dropdown menu, and the script must continue with the next\
    \ <ul>. it skips the rest of the code block, goes back to the for statement, performs\
    \ the update and the test, and continues with the next <ul>.\n\n# Labels\n\nOccasionally\
    \ you have nested loops and want to continue one that isn't the innermost one.\
    \ For instance:\n\n```\nfor (var i=0;i<x.length;i++) {\n  for (var j=0;j<x.length;j++)\
    \ {\n    if ([something is the case]) continue;\n  }\n}\n```"
  merge: -1
  pgno: 236
- img_proc: true
  md: "The continue statement continues the inner loop (the j) because that is its\
    \ default behavior. If you want it to continue with the outer loop (the i), you\
    \ have to use a label:\n\n```\nouterloop: for (var i=0;i<x.length;i++) {\n  for\
    \ (var j=0;j<x.length;j++) {\n    if (something is the case]) continue outerloop\n\
    \  }\n}\n```\n\nAs you see, a label is nothing more than a bit of text plus a\
    \ colon:. Repeating the bit of text after the continue tells JavaScript which\
    \ loop to continue. I can use the text 'outerloop' in the example because it refers\
    \ to the outer loop, but you can use any name you want.\n\nYou can also use a\
    \ label after a break statement; it specifies which loop should break. Although\
    \ you're allowed to add labels to any JavaScript statement, they're only really\
    \ useful in combination with continue or break.\n\n# try/catch\n\nThe try/catch\
    \ statement is not a loop. Its purpose is to make sure the user never sees an\
    \ error message. It tries a few lines of code, and if they generate an error,\
    \ the catch statement kicks in in.\n\nThe general syntax is as follows:\n\n```\n\
    try {\n  // these lines may cause an error\n}\ncatch (e) {\n  // these lines are\
    \ executed if an error occurs\n}\nfinally {\n  // these lines are always executed\
    \ regardless of any errors\n}\n```"
  merge: -1
  pgno: 237
- img_proc: true
  md: "You may leave out the catch or the finally block if you don't need them. Note\
    \ the (e) in the catch statement: it's required in some browsers. Using the variable-name\
    \ e is traditional, but you may use another name.\n\nI am not a big fan of try/catch\
    \ statements, since I don't like executing code that may cause an error. Nonetheless,\
    \ it's sometimes necessary to use them. Site Survey contains an example:\n\n[Site\
    \ Survey/popup.js, lines 77-87.]\n\n```\nfunction checkCommunication() {\n  try\
    \ {\n    opener.testVar = true;\n  } catch (e) {\n    return false;\n  }\n  return\
    \ true;\n}\n```\n\nFor reasons we'll discuss in 6B, the opener.testVar = true\
    \ line may cause an error. The purpose of this function is to find out if that\
    \ happens.\n\nThe function tries to execute the offending line. If it generates\
    \ an error message, the catch statement executes and returns false. If the line\
    \ works, the catch statement is ignored, and the function continues with the return\
    \ true. 10A discusses another try/catch statement in XMLHTTP Speed Meter.\n\n\
    # I: Functions\n\nFunctions are the backbone of any script. In general, about\
    \ 95% of the code you will be contained in functions. This makes functions one\
    \ of the most important JavaScript structures."
