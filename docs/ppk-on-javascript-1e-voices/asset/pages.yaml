    # D: Event bubbling and capturing


    Suppose you have a <div> that contains a `<form>` that contains a form field.
    All three elements have an onclick event handler. The user clicks on the form
    field, the event handler of the form field should now fire. But what about the
    <div>''s and the `<form>`''s event handlers? Should they fire too?


    ![](img/1cdc3bc9be02360dab81df06bea3c619_339_0.png)


    > FIGURE 7.2

    div, form, and input all have an onclick event handler. The user clicks on the
    input.


    The answer is Yes. If an event takes place, and several event handlers are eligible
    to handle the event, all of them fire.


    But which event handlers fire first? The <div>''s, because it''s the uppermost
    element? Or the form field''s, because it''s the element the user clicked on?
    The answer depends on whether you use event capturing or bubbling.


    Event bubbling means that the event starts on its target (the element user clicked
    on, i.e., the form field), fires the target''s onclick event handler, and bubbles
    up through the document tree from ancestor to ancestor until it reaches the document
    element. For any new HTML element it encounters, it also fires any relevant event
    handlers, if present, and therefore the onclick handlers of the <form> and the
    <div> also fire, in that order.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '![](img/1cdc3bc9be02360dab81df06bea3c619_340_0.png)


    Figure 7.3

    Event bubbling in the order form field, form, div.


    Event capturing is exactly the opposite. It starts at the document level and travels
    down the document to the event target (the form field). For each HTML element
    it encounters, it fires any relevant event handlers. Therefore, the handlers fire
    in the order `<div>`, `<form>`, form field.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_340_1.png)


    Figure 7.4

    Event capturing in the order div, form, form field.


    # # W3C model


    In the W3C event model, both capturing and bubbling occur. When an event fires,
    it is first captured by the document, and then travels down the document tree
    to the event target. This is called the capturing phase. Once the event arrives
    at its target, the bubbling phase starts, during which the event travels back
    upwards to the document.'
