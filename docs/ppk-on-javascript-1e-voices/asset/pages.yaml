  md: "All nodeLists also have a length property that gives the length of the nodeList:\n\
    \n```\nvar x = document.getElementsByTagName('p').length;\n```\n\nx is the number\
    \ of paragraphs in the document.\n\nThese two features combined mean that we often\
    \ use nodeLists as arrays:\n\n```\nvar x = document.getElementsByTagName('p');\n\
    for (var i=0;i<x.length;i++) {\n  // do something with each paragraph\n}\n```\n\
    \nIn L5 I said that nodeLists can be seen as read-only arrays. The time has to\
    \ come to amend that something. It's true that you cannot directly add or remove\
    \ elements to or from a nodeList. For example, if I run the following, nothing\
    \ happens, not even an error message:\n\n```\nx[1] = 'Test';\n```\n\nBut nodeLists\
    \ are not static. In fact, they're dangerously dynamic, because they immediately\
    \ reflect all changes in the document. For instance, take this code:\n\n```\n\
    var x = document.getElementsByTagName('p');\nalert(x.length);\nvar par = document.createElement('p');\n\
    document.body.appendChild(par)\nalert(x.length)\n```\n\nThis creates a nodeList\
    \ that holds all paragraphs in the document and alerts its length. Then another\
    \ paragraph is added to the document, and again the script alerts the length of\
    \ the nodeList. The nodeList has now increased by one because there's one more\
    \ paragraph in the document. The nodeList is updated automatically, and doesn't\
    \ require a new getElementsByTagName() call to see the changes."
