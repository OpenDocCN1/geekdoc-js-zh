  md: '# COOKIE RESTRICTIONS


    Web browsers are not required to store more than 300 cookies. In addition, they
    are not required to store more than 20 cookies per domain. Finally, cookie name/value
    pair may be larger than 4K.


    I haven''t personally tested the presence or absence of these restrictions in
    the various browsers, but in general you should assume that all browsers obey
    them.


    # document.cookie


    The cookie is stored in document.cookie. This is a rather odd property that partially
    behaves as a string, but is not a string. You set a cookie by assigning it to
    document.cookie. If you read this property, though, it contains the name/value
    pairs of all cookies associated with the current page.


    For instance:


    ```

    document.cookie = ''testcookie=yes; expires=Tue, 23 Jan 2007

    13:57:39 UTC; path=/; domain=quirksmode.org''

    document.cookie = ''testcookie2=maybe; expires=Tue, 23 Jan 2007

    13:57:39 UTC; path=/; domain=quirksmode.org''

    alert(document.cookie);

    ```


    Now the alert says "testcookie=yes,testcookie2=maybe".


    # Reading cookies


    To read out a previously set cookie, you should take document.cookie and split
    it by semicolons. This gives you the name/value pairs of all cookies associated
    with the current page, and you can search them for the name of the cookie you''re
    looking for.'
