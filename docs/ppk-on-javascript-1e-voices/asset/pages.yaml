- img_proc: true
  md: 'Originally, the idea behind these version numbers was to allow Web developers
    to specify what level of JavaScript they were using. It was supposed to work something
    like this:


    ```

    <script language="JavaScript.2">

    // scripts that use 1.2 features

    </script>

    ```


    Browsers that did not support JavaScript 1.2 were supposed to ignore the entire
    <script> tag, so that the scripts would only be executed in browsers that could
    handle 1.2.


    The advent of Netscape and Explorer 4 relegated this well-intentioned idea to
    the dustbin. Both browsers claimed to support JavaScript 1.2, but not even the
    most powerful fantasy can imagine supporting the same JavaScript 1.2. Besides,
    this was only truly implemented in Netscape 2 and 3, though specifying "JavaScript.1.2"
    triggers special and exciting incompatibilities in Netscape 4.


    Therefore these version numbers play no role in modern JavaScript development,
    and I advise you not to specify any version in the language attribute (in fact,
    you shouldn''t use that attribute at all).


    # Towards JavaScript 2.0


    As I write, JavaScript''s inventor Brendan Eich is working on JavaScript 2.0.
    The purpose is to add new features to the Core language, including a better variable
    typing system, support for Java-like classes and interfaces, and other innovations
    aimed at improving JavaScript as a programming language.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_42_0.png)'
  merge: -1
