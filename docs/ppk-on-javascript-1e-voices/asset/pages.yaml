  md: "Changing the width is pretty easy (as long as you remember to append a correct\
    \ unit). However, the width shouldn't change once, but many times over. How do\
    \ we cleanly issue a of commands to change the width?\n\n# setTimeout and setInterval\n\
    \nIn order to create a proper animation, you need either setTimeout or setInterval.\
    \ Before discussing the use of these methods, let's take a peek at the problem\
    \ they solve.\n\nIf you command the browser to change widths multiple times without\
    \ any pause, it will change the on-screen rendering only after the entire script\
    \ has been run. Suppose we want to animate from 0 to 56px width, with 14px intervals:\n\
    \n```\nfunction changeWidths() {\n  setWidth(14);\n  setWidth(28);\n  setWidth(42);\n\
    \  setWidth(56);\n}\n```\n\nNow the browser faithfully changes the width of the\
    \ element to 14, 28, 42, and 56 pixels. However, it doesn't show any of these\
    \ changes until the function has ended. Therefore, as far as the user is concerned,\
    \ the black bar is invisible at (width: 0), and then all of a sudden has a substantial\
    \ size (width: 56px), without any steps in between. This is no animation—you might\
    \ just as well set width: 56px immediately.\n\nWe have to pause between the steps\
    \ to give the browser the chance to catch up and to show every single step on\
    \ the screen before proceeding to the next. We have time to issue our commands:\
    \ do setWidth(14), wait, do setWidth(28), wait, etc.\n\nAs discussed in 6E, JavaScript\
    \ contains two methods that allow you to time your commands: setTimeout and setInterval.\
    \ They come in especially handy in animations."
  merge: -1
  pgno: 481
- img_proc: true
  md: "# Using setTimeout\n\nWe're going to use setTimeout to define a slight waiting\
    \ period between the width changes. (Why not setInterval? We'll discuss that later.)\n\
    \n```\nfunction changeWidths() {\n  setTimeout(setWidth(14), 100);\n  setTimeout(setWidth(28),\
    \ 200);\n  setTimeout(setWidth(42), 300);\n  setTimeout(setWidth(56), 400);\n\
    }\n```\n\nNow the animation works. The browser is commanded to run setWidth()\
    \ four times: once with argument 14 after 100 milliseconds, once with argument\
    \ 28 after 200 milliseconds, etc. As far as the browser is concerned, after executing\
    \ the function once, it considers the function ended, and shows the results on-screen.\n\
    \nNow the user sees a simple animation, each step of which makes the black 14\
    \ pixels wider, with a 100 millisecond pause between each step. The style change\
    \ has become a true animation.\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_482_0.png)\n\
    \n> An important part of creating a good animation is choosing an appropriate\
    \ interval for your steps. In theory, the smaller the time, the better the animation,\
    \ since small steps make an animation more fluid. Unfortunately, if you make your\
    \ steps too small, browsers start to have trouble.\n\n10 milliseconds seems be\
    \ a practical limit; it's about the smallest delay browsers can handle. But even\
    \ if you stay above this limit—setting, say, 500 animation steps with a 20-millisecond\
    \ interval—your script may use too many browser resources, since it runs 500 times\
    \ in a 2-second period. Of course, the exact behavior of the browser depends on\
    \ the speed of the computer it runs on, so some browsers might still show such\
    \ an animation correctly.\n\nI generally use a delay time of 50 milliseconds at\
    \ minimum, and restrict the number of steps to a moderate amount, say 10 to 50."
  merge: -1
  pgno: 482
- img_proc: true
  md: "When creating an animation, I always allow the client to set the exact animation\
    \ time. Clients frequently think an animation is slightly too slow or too fast,\
    \ and by allowing them to modify one variable by themselves, I save myself valuable\
    \ development time.\n\nSo's add a variable moveTime, which defines the pause between\
    \ the animation steps:\n\n```\nvar moveTime = 100; // in milliseconds\nfunction\
    \ changeWidths() {\n  setTimeout('setWidth(14)',moveTime*1);\n  setTimeout('setWidth(28)',moveTime*2);\n\
    \  setTimeout('setWidth(42)',moveTime*3);\n  setTimeout('setWidth(56)',moveTime*4);\n\
    }\n```\n\nThat's a useful addition, but the function is still quite ugly. Looking\
    \ for ways to further sanitize it, we see that what we're really doing is giving\
    \ a repetitive command, and such commands can be worked into a for{} loop:\n\n\
    ```\nvar moveTime = 100; // in milliseconds\nfunction changeWidths() {\n  for\
    \ (var i=1;i<5; i++) {\n    setTimeout('setWidth(' + (i*14) + ')',moveTime*i);\n\
    \  }\n}\n```\n\nThis is much better. i loops from 1 to 4. The width that the black\
    \ meter should be set to is always i*14 (14, 28, 42, 56), and the timeout time\
    \ is always moveTime*i (100, 200, 300, 400). Now the animation function has become\
    \ much more standardized, and all timeouts are set at once, reducing the clutter\
    \ in your script."
  merge: -1
