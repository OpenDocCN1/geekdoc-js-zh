    Now that I had a definite handle on the bug, I created a test page. As discussed
    in 3B, this step is absolutely crucial, since it forces you to create exactly
    those circumstances that trigger the bug, and leave out all irrelevant code, which
    in turn increases your understanding of the bug.


    So I created a simple test page with one input and four radio buttons. I checked
    the last radio and reloaded. Nothing happened. Then I added a little script that
    removes the single input, and the bug reappeared in all its glory.


