  md: 'First you need to create an account. Then Mozilla requires you to check if
    the bug has already been reported. That''s a reasonable request, but most bug
    reports are hard to read if you don''t know Mozilla''s and Bugzilla''s internal
    structure. The few times I reported a bug it turned out that the bug was already
    known, but I couldn''t find it because I didn''t understand these structures.


    # Microsoft


    The Microsoft bug reporting facilities are at https://connect.microsoft.com/feedback/default.aspx?SiteID=136
    and they are only for Explorer 7 and later. Please do not report bugs in earlier
    Explorer versions. Note that you need a Microsoft Connect account in order to
    gain access.


    # QuirksMode


    Finally, I have my own bug-reporting facilities at http://www.quirksmode.org/bugreports/.
    The reports here are primarily aimed at Web developers, although browser vendors
    occasionally go through these lists, too. A proper test page is required.


    If you report your bugs here, other Web developers will be able to find them,
    and will thank you for saving valuable portions of their time (and hair).


    # Please be patient


    You shouldn''t expect a bug that you report to a browser vendor to be solved within
    a few weeks. Usually browser vendors address dozens of bugs simultaneously, and
    their time is limited. Besides, the bug you report may depend on other bugs, or
    it may not be important enough for immediate action. Patience is a virtue when
    dealing with browser bugs.'
