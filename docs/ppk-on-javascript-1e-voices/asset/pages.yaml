  md: 'This operator is extremely useful for debugging. If you think a variable may
    hold a string instead of a number, you insert a typeof alert. In general, this
    is the first debugging tool you use when you think you''ve encountered a data-type
    problem.


    Sometimes typeof is used for object detection. However, since object detection
    often tries to find out if a certain object exists, typeof returns “object” whether
    an object exists or not (i.e., null, which evaluates to false), it’s not really
    useful in such situations. I advise you not to use typeof for object detection,
    but instead stick to the rules we discussed in 3C.


    # Data-type conversion


    One of the beauties of JavaScript is that converting values from one data type
    to another is quite easy—in fact, it happens all the time. Take this code:


    ```

    var a = 4;

    var b = ''4'';

    var c = a * b;

    ```


    As you can see with your newly acquired data-type knowledge, a is a number and
    b is a string. The third line tries to multiply these two—an operation that obviously
    requires numbers.


    Here''s where data-type conversion kicks in. The multiplication operator needs
    numbers, so JavaScript tries to convert its operands to numbers, if at possible.
    In this case it''s easy: b is interpreted as the number 4, and c becomes 16.


    It is important to remember that b does not become a number. It remains a string,
    but JavaScript interprets it as a number for the specific purpose of executing
    the multiplication.


    On the other hand, the result of the multiplication (stored in c) is a number.
    This gives you the best of both worlds: your original variables don’t change their
    data type, but the result of the operation has the correct data type.'
