  md: '# SECTION H: TEXT NODES 397


    | body |

    |---|---||

    | [empty] | h1 | p | [empty] | [empty] |

    | | ''Hello World!'' | ''I am a JavaScript hacker!'' |


    **Figure 8.18** The DOM tree changed, but the change is invisible.


    One way to remove these incompatibilities is to turn all empty text nodes off.
    This could be done by removing all whitespace from your HTML:


    ```

    <body><h1>Hello world!</h1>I am a JavaScript hacker!</body></body>

    ```


    Now the <body> has only two child nodes. Nonetheless, working in HTML files without
    any whitespace becomes annoying in a hurry.


    # Living with empty text nodes


    Therefore, effectively empty text nodes are here to stay, and we have to learn
    to live with them. Their first victims are the previousSibling and nextSibling
    properties, which are rather useless unless they usually refer to empty text nodes.
    The same happens to childNodes[]. This nodeList, too, is riddled with empty text
    nodes and rarely used.


    Let''s try to get the previousSibling in the last code example to work. We want
    to insert the <span> before the <h1>. We already saw that this works in Explorer,
    but not in the other browsers:


    ```

    var x = document.getElementsByTagName(''p'')[0];

    x.parentNode.insertBefore(x,x.previousSibling);

    ```


    Similarly, this works in the other browsers but not in Explorer:


    ```

    var x = document.getElementsByTagName(''p'')[0];

    x.parentNode.insertBefore(x,x.previousSibling.previousSibling);

    ```'
