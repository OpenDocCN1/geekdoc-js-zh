  md: "# selectorText\n\nEvery rule has a selectorText, which contains, unsurprisingly,\
    \ the rule selector as a string.\n\nWhen the user selects a new rule to edit from\
    \ the first select, the assignRule() function searches for this rule and opens\
    \ it for editing:\n\n[Edit Style Sheet, lines 48-55]\n\n```\nfunction assignRule()\
    \ {\n  var selector = this.value;\n  for (var i=0;i<sheetRules.length;i++)\n \
    \   if (sheetRules[i].selectorText.toLowerCase() =\n    == selector.toLowerCase())\n\
    \      currentRule = sheetRules[i];\n  }\n}\n```\n\nIt takes the desired selector\
    \ (i.e., the select box's value), and then goes through all the rules in sheetRules.\
    \ When it finds a rule with a matching selectorText, it points currentRule to\
    \ this rule. currentRule, too, is a global variable, since other functions need\
    \ access to the rule that's currently being edited.\n\nOne word of warning: some\
    \ browsers (Explorer and Safari at the time of writing) return an UPPERCASE selector\
    \ text. Therefore, the function compares selectorText.toLowerCase() to selector.toLowerCase().\n\
    \n# style\n\nEvery rule has a style property that works exactly like the style\
    \ property of individual HTML elements we discussed in 9A. If we wanted to change\
    \ the color of currentRule to green we could do this:\n\n```\ncurrentRule.style.color\
    \ = '#00cc00';\n```\n\nAll elements that take their style information from this\
    \ rule will change their color to green."
