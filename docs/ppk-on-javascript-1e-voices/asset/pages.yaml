  md: "# CHAPTER 9: CSS MODIFICATION\n\nDOCUMENT.WRITE AND PAGE LOADING\nIt's important\
    \ to repeat a feature of document.write from 6F; if you use it after the page\
    \ has been loaded completely, the browser will create a new page to contain the\
    \ new content, and it destroys the old page in the process. Therefore, the user\
    \ sees a blank page with a cryptic line of code instead of your carefully crafted\
    \ interface.\n\nThis is another reason to execute document.write immediately.\n\
    \nIncidentally, XMLHTTP Speed Meter is wrong. The script should hide the form's\
    \ Submit button when sufficient JavaScript is supported, but it does so only on\
    \ onload, which is too late:\n\n[XMLHTTP Speed Meter, lines 19-22]\n\n```\nwindow.onload\
    \ = function () {\n  var supportCheck = [check support];\n  if (!supportCheck)\
    \ return;\n  document.getElementById('submitImage').style.display = 'none';\n\
    ```\n\nIf the page is slow in building, visitors will first see the image, but\
    \ then all of a sudden it's hidden. That is confusing, and I should have used\
    \ the document.write() trick here, too.\n\nUsed correctly, this method is a powerful\
    \ accessibility tool. Used incorrectly, it can cause serious trouble. Always think\
    \ out all the scenarios before using document.write to add styles, and test your\
    \ pages with JavaScript disabled.\n\n# D: Changing entire style sheets\n\nWARNING\
    \ Browser incompatibilities ahead\n\nChanging entire style sheets works in Internet\
