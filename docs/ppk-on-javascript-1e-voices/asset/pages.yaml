  md: '# HOOKS AND EVENTHANDLER REGISTRATION


    In order to fully understand the code on the previous page, you have to understand
    JavaScript hooks—the hook here is the ID that says “deploy the behavior here”—and
    the various ways of registering event handlers. We''ll discuss event hooks in
    4B and event-handler registration in 7C.


    All examples separate behavior and structure, so you can take a look at the way
    they define event handlers if you prefer to study some practical examples right
    away.


    # The javascript: pseudo-protocol


    Occasionally you''ll see javascript:pseudo-protocol links like the following one:


    ```

    <a href="javascript:doAllKindsOfNiftyThings()">Do Nifty!</a>

    ```


    This complicated and dirty code is secretly meant as an onclick event handler:
    when the user clicks on this link, we want to execute doAllKindsOfNiftyThings().
    Therefore you should remove the javascript: call from the link and replace it
    with an onclick event handler in the separate .js file:


    ```

    <a href="homepage.html" id="nifty">Do Nifty!</a>

    ```


    ```

    // in separate .js file

    document.getElementById(''nifty'').onclick =

    doAllKindsOfNiftyThings;

    ```


    As to the href, it should contain either a URL that noscript users can follow,
    or the entire link should be generated in JavaScript. We''ll get back to this
    in 2F.'
