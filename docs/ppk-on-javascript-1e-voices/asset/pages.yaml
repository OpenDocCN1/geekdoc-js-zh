    Sheet also works with text fields in which the user can enter data, while Usable
    Forms only works with radio buttons, checkboxes, and selects. A click event on
    a text field doesn''t give much information, since at the time it occurs the field
    is most likely empty.


    Therefore, in Edit Style Sheet I cannot replace the change event with the click
    event, and since the change event doesn''t bubble up, I have to set it on every
    single field in the correct form:'
