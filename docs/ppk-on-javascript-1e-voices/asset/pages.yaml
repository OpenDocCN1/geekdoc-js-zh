- img_proc: true
  md: '# The second thin phase


    When the first phase of JavaScript ended, interest in the language dwindled, and
    its purpose became rather hazy. Some developers reverted to the pre-Browser Forms
    validation/mouseover school of thought; others continued to churn out fat (not
    to say obese) intests that pleased nobody; and many participants in the CSS revolution
    excluded JavaScript totally.


    History could have proceeded from this point. Explorer 5.0 was already available,
    and it supported large swaths of the W3C DOM, as well as XMLHttpRequest object
    that has come to play such a vital role in JavaScript’s second phase. But fat
    clients had gone out of fashion and simply stopped evolving.


    # A new start


    From about 2003 onwards, a few pioneers began to write JavaScript in a new style
    that was heavily influenced by the ideas of the CSS revolution. For the first
    time it was tightly embedded in a comprehensive theory of Web development, and
    the identification and solving of accessibility issues was taken seriously.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_52_0.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'The resulting scripts were thin, and mostly concerned themselves with subtly
    enhancing HTML pages and adding light touches of functionality. If the browser
    does not support JavaScript, little is lost except-for a bit of usability. This
    coding style is known as unobtrusive scripting, and we will discuss it in detail
    in Chapter 2.


    Unobtrusive scripting didn''t immediately conquer the world. In progressive Web-development
    circles, JavaScript still had a bad name for being inaccessible, while developers
    of Browser Wars-style bloatware were mostly unaware of the new approach.


    # The second fat phase


    Then JavaScript''s second fat phase started with a big bang. One article crystallumbling
    technical and usability notions by showing that modern techniques allow the creation
    of a single-page interface that silently loads little chunks of data from the
    server.


    The article was a resounding success, which in itself indicates that people were
    ready, even, to start a new fat phase of JavaScript use. And it''s true: a site
    can become much, much more usable if a few scripts make sure that one single page
    contains everything the user needs and allows her to take all actions she wants.
    Thus JavaScript''s purpose was again redefined. Fat became fashionable overnight.


    The Ajax wave brought new blood into the JavaScript community—an infusion of people
    from other disciplines, most importantly the server-side languages, with fundamentally
    different ways of looking at JavaScript.


    > Jesse James Garrett''s article “Ajax: A New Approach to Web Applications” started
    the Ajax hype. It can be found at http://www.adaptivepath.com/publications/essays/archives/000385.php.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'These developers are interpreting the purpose of JavaScript in different ways.
    Put (too) simply, traditional Web developers heavily influenced by the CSS revolution
    create thin, accessible JavaScript in spaghetti-code, while “hard programmers”
    coming from server-side development create fat, inaccessible Ajax clients in impeccably
    object-oriented code.


    In some respects Ajax HTML too closely for comfort. Accessibility, for instance,
    is hardly an issue for Ajax applications. And the hype tends to concentrate on
    technical issues (how Ajax?), while usability and interaction issues (why Ajax?)
    remain unreported. Finally, bloatware libraries (called “frameworks” nowadays
    are on the rise again.


    Fortunately, there has been one significant change since the first phase: browser
    vendors and JavaScript developers agree that standards are there to be followed.
    Although browser problems will always exist, the deliberate incompatibilities
    that characterized the Browser Wars have ever gone.


    # What''s next?


    At the time of writing, the Ajax hype is still running at full speed. Nonetheless
    I believe it will end just as HTML did: people will simply lose interest and it
    will fall apart into a bit of JavaScript and a lot of hot air—though I don’t know
    when this will happen.


    > 134 AJAX FRAMEWORKS AND COUNTING

    nA May 2006 count revealed that there were no less than 134 Ajax frameworks available.
