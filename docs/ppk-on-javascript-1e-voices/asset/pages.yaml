    ?<xml version=\"1.0\" encoding=\"utf-8\"?>\n<wanadoo>\n<distance>0</distance>\n\
    <speed>0</speed>\n<error>1</error>\n<message>Your postal code and/or house number\
    \ are incorrect.</message>\n</wanadoo>\n```\n\nWe already saw the script that\
    \ reads out the relevant data and does something with them:\n\n[XMLHTTP Speed\
    \ Meter, lines 52-59]\n\n```\nfunction catchData(req) {\n    var returnXML = req.responseXML;\n\
    \    if (!returnXML) return;\n    var speed = parseInt(returnXML);\n    getElementsByTagName('speed')[0].firstChild.nodeValue;\n\
    \    if (speed != currentSpeed)\n        moveToNewSpeed(speed);\n    currentSpeed\
    \ = speed;\n    var error = returnXML.getElementsByTagName('message')[0].firstChild;\n\
    ```"
  merge: -1
  pgno: 507
- img_proc: true
  md: "Since we're only reading out two tags and don’t generate any HTML, this is\
    \ a pretty simple function. Be warned, however, that as soon as you start generating\
    \ HTML, such a function becomes much, much more complicated.\n\n# HTML\n\nIn certain\
    \ respects, HTML is the best choice for importing data to a Web site. The reason\
    \ is, of course, that Web sites already work with HTML, and that adding bits of\
    \ it is extremely simple:\n\n```\nfunction catchData(req) {\n  var newHTML = req.responseText;\n\
    \  document.getElementById('someID').innerHTML = newHTML;\n}\n```\n\nYou read\
    \ out the responseText, i.e., the response as a text string. Since this text is\
    \ already HTML, you can simply paste it into some element’s innerHTML, and the\
    \ page will contain the new data.\n\nBut if you want to read out bits of data\
    \ and write them into several elements, or pass them on to other functions, as\
    \ I do in XMLHTTP Speed Meter, HTML becomes hard to work with.\n\nShowing error\
    \ messages is easy; if the server-side script returns something like this, we\
    \ just paste it in the appropriate HTML element:\n\n```\n<p>Your postal code and/or\
    \ house number are incorrect.</p>\n```\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_508_0.png)"
  merge: -1
  pgno: 508
- img_proc: true
  md: "However, reading out the speed is another thing. The script does not want to\
    \ print out the speed, but instead needs to send it on to another function that\
    \ starts up the animation. In theory this is possible, but it's not really intuitive\
    \ or easy:\n\n```\n// returned data\n15\n\n// script that does something:\nfunction\
    \ catchData(req) {\n  var response = req.responseText;\n  var speed = parseInt(response);\n\
    \  if (speed != currentSpeed)\n    moveToSpeed(speed);\n}\n```\n\nThis method\
    \ would work. The disadvantage is that the returned data is just \"15\", and doesn't\
    \ really count as HTML. Besides, it doesn't make use of HTML's main advantage:\
    \ pasting the response into an element.\n\nAll in all, the HTML response format\
    \ is not suited for XMLHttpRequest Speed Meter, or for any script that needs to\
    \ manipulate the server data instead of just them on the screen. On the other\
    \ hand, as we'll see in 10D, HTML is the most accessible format.\n\n# JSON\n\n\
    The JavaScript Object Notation format returns a string that should be interpreted\
    \ as a JavaScript object. This string contains a JavaScript object literal (see\
    \ 5J).\n\n> JSON INTRODUCTION\nJSON was invented by Douglas Crockford. See http://www.json.org/\
    \ for an extended introduction to the format."
  merge: -1
  pgno: 509
- img_proc: true
  md: "This would be the JSON equivalent of XMLHTTP Speed Meter's XML response:\n\n\
    ```\n{\n  distance: 2495,\n  speed: 15,\n  message: null,\n  error: 0;\n}\n```\n\
    \nOr, in case of an error:\n\n```\n{\n  distance: 0,\n  speed: 0,\n  message:\
    \ \"Your postal code and/or house number are incorrect.\",\n  error: 1;\n}\n```\n\
    \nThe advantage of JSON is that it is slightly more in line with JavaScript's\
    \ internal structure than XML.\n\nThe disadvantage is that the syntax is very\
    \ precise and unique to JavaScript, which means developers without experience\
    \ in JavaScript will not be able to create JSON strings on the fly. The script\
    \ you need to create an HTML structure to hold the data is as robust as verbose\
    \ as a script that reads out XML.\n\nHow do we interpret such a JSON string? For\
    \ example, catchData() would become something like this:\n\n```\nfunction catchData(req)\
    \ {\n  var responseObject = eval('(' + req.responseText + ')');\n  var speed =\
    \ responseObject.speed;\n  if (speed != currentSpeed) {\n    moveToNewSpeed(speed);\n\
    \    var error = responseObject.message;\n    // handle error\n  }\n```"
  merge: -1
  pgno: 510
- img_proc: true
  md: "# CSV\n\nCSV is the only plain-text format we'll cover here, but others are\
    \ similar enough that this will serve as an adequate example. \n\nComma-separated\
    \ values (or values separated by another character) is one of the oldest data-retrieval\
    \ systems in use. It simply sends back a string, within which the commas denote\
    \ where one bit of data ends and another starts.\n\nThe advantages of CSV are\
    \ that it's the shortest and most efficient data format, it has a venerable pedigree,\
    \ and it's well-known by developers in all sorts of languages.\n\nThe disadvantage\
    \ is that the file doesn't contain any clue about the interpretation of the data.\
    \ Files in other formats contain some sort of pointer (be it an XML or HTML tag\
    \ or a JavaScript property name) that tells you what sort of data they hold.\n\
    \nFor instance, if I swap the speed and message tags (XML) or properties (JSON),\
    \ the XML and JSON scripts would continue to function, since they access the speed\
    \ and message data by tag or property name, not by their position in the response\
    \ file. However, in a CSV file we can only access them by their position, and\
    \ this requires client-side and server-side developers to be very disciplined\
    \ in generating and reading the output.\n\nThese are CSV files for XMLHTTP Speed\
    \ Meter:\n\n```\n2495,15,null,0\n0,0,Your postal code and/or house number are\
    \ incorrect,,1\n```\n\nThe data is read and used in the following way:\n\n```\n\
    function catchData(req) {\n    var data = req.responseText.split(',');\n    var\
    \ speed = data[1];\n    if (speed != currentSpeed) {\n        moveToSpeed(speed);\n\
    \    }\n    var error = data[2];\n    // handle error\n}\n```"
  merge: -1
  pgno: 511
- img_proc: true
  md: 'As you see, the relevant data are being read by data[1] and data[2], so the
    function expects to find the speed at the second place, and the error message
    at the third. If a server-side programmer accidentally reversed the speed and
    message data, the JavaScript would not be able to extract the data it needs.


    # The best format?


    It won''t surprise you that there is no best format—only formats that are best
    suited to a specific type of application or situation. In general, I decide on
    a response format in the following way:


    +   - If I want to add large chunks of data to a page, I opt for HTML, since it
    allows me to easily add data with only a few lines of script.


    +   - If the project is large and complicated requires close cooperation with
    several programmers, I opt for XML, because this format is the most likely to
    be known and understood by all parties involved.


    +   - If I need to go through a lengthy response in search of the few bits of
    data I really need, I opt for either XML or JSON, since only these formats allow
    quick searches.


    +   - I never use CSV files, since I dislike the lack of metadata such as a speed
    or message property name.


    Of course you should feel free to disregard this advice and pick your response
    format. Especially when you''ll be doing both the client-side and the server-side
    coding, you should choose what comes naturally to you.


    # D: Accessibility


    Complicated, script-heavy, XMLHttpRequest applications have a problem when it
    comes to accessibility. Making such an application accessible without JavaScript
    is definitely a tough job. However, it''s something that simply has to be done.
    The main problem is that many application developers refuse to consider the issue,
    which of course makes finding answers even more difficult.'
  merge: -1
  pgno: 512
- img_proc: true
  md: "Unfortunately, the definitive guide on XMLHttpRequest and accessibility has\
    \ not yet been written. I try to provide some hints in this section, but you should\
    \ always temper the guidelines below with common sense; chances are that you'll\
    \ find yourself in a situation in which none of them apply.\n\n# Accessibility\
    \ with HTML\n\nOne (and only one) format is accessible in and of itself, and that's\
    \ HTML. Anyone who surfs the Web with a program that is able to interpret HTML.\
    \ Therefore, working with HTML files is the key to keeping an XMLHttpRequest application\
    \ accessible.\n\nLet's start with a simple example: you want to import a bit of\
    \ data and paste it into your page as, without modifying it or searching for specific\
    \ data. As we saw in 10C, the HTML response format is best suited for this.\n\n\
    So let's create a link list with a JavaScript hook, and an element to hold the\
    \ returned data:\n\n```\n<ul id=\"xmlhttp\">\n  <li><a href=\"data.html\">Data</a></a></li>\n\
    \  <li><a href=\"moredata.html\">More data</a></a></li>\n  <li><a href=\"stillmoredata.html\"\
    >Still more data</a></a></li>\n</ul>\n<div id=\"writeroot\"></div>\n```\n\nThese\
    \ simple links will work in any HTML-capable user agent. Your application is accessible.\n\
    \n> HIJAX\nThe methodology I describe here was developed by Jeremy Keith, who\
    \ calls it Hijax. Read about it at http://domscripting.com/blog/display/41."
  merge: -1
  pgno: 513
- img_proc: true
  md: "If a browser happens to support XMLHttpRequest, you can enhance these links.\n\
    You could do the following (using the createXMLHttpRequestObject() and sendRequest())\
    \ functions we already discussed:\n\n```\nvar XHRsupport = createXMLHttpRequestObject();\n\
    window.onload = function () {\n  if (!XHRsupport) return;\n  var list = document.getElementById('xmlhttp');\n\
    \  var links = list.getElementsByTagName('a');\n  for (var i=0;i<links.length;i++)\
    \ {\n    x[i].onclick = getPage;\n  }\nn\n\nfunction getPage() {\n  sendRequest(this.href,showPage);\n\
    }\n\nfunction showPage(req) {\n  var HTMLPage = req.responseText;\n  // paste\
    \ HTML into page\n}\n```\n\nNow whenever the user clicks on a link, the getPage()\
    \ function kicks in and fetches the required HTML page through XMLHttpRequest.\n\
    \nHowever, if the browser supports the advanced interface, you don't want to receive\
    \ the entire HTML page, but only the part of it that contains the actual content.\
    \ After all, you may not paste a second <html>, <head>, or <body> tag into your\
    \ page, and besides you probably don't want to show the site navigation and other\
    \ header.\n\nInstead, you want to show only the actual content of the HTML page\
    \ you're importing. The first step is to mark up this content:\n\n```\n// data.html\n\
    <html>\n<head>[...</head>\n```"
  merge: -1
  pgno: 514
- img_proc: true
  md: "```\n<body>\n<ul class=\"navigation\">[..]</ul>\n<div id=\"content\">\n  <h2>Page\
    \ content</h2>\n  [..]\n</div>\n</body>\n</html>\n```\n\nNow the problem becomes\
    \ one of importing or showing *only`<div id=\"content\">`, without the rest of\
    \ the HTML. One solution would be a server-side script that extracts this `<div>`\
    \ from the requested HTML page and sends it its content back to the browser:\n\
    \n```\nfunction getPage() {\n  sendRequest('extractScript.php?page=' + this.href,showPage);\n\
    }\n\nfunction showPage(req) {\n  var newData = req.responseText;\n  document.getElementById('writeroot').innerHTML\
    \ = newData;\n}\n```\n\nOf course, you could also use the reverse solution: create\
    \ HTML snippet files on your server to import with XMLHttpRequest, and also create\
    \ a template file that's used to give these snippets a \"coating\" of overhead\
    \ HTML in the case the browser requests the pages without XMLHttpRequest. In this\
    \ case you can distinguish between XMLHttpRequest and non-XMLHttpRequest requests\
    \ by checking if the User-Agent header is `'XMLHttpRequest`'.\n\nIf a server-side\
    \ solution is not possible, the simplest client-side solution is to use an iframe,\
    \ and load the HTML pages into that iframe:\n\n```\n<iframe id=\"writeroot\">/</iframe>\n\
    function getPage() {\n  document.getElementById('writeroot').src = this.href;\n\
    }\n```"
  merge: -1
  pgno: 515
- img_proc: true
  md: '# Accessibility with other response formats


    Unfortunately, XML, JSON, and CSV files are not accessible by themselves, so as
    soon as you use one of these response formats, accessibility gets more complicated.
    There are two ways to reconcile non-HTML responses and accessibility, they shouldn''t
    contain any essential elements, but sometimes neither can be used.


    The first way is to make sure that any XMLHttpRequest content consists of no extras.
    That leaves the basic functionality in the HTML page accessible to anyone. While
    the requested extra bits should make your page more usable, they choose this solution
    if you can, since it keeps things simple. Often, however, it is not a viable alternative.


    The second way is to create two server-side programs: one to deliver the XML (or
    JSON or CSV) to the XMLHttpRequest, and another to deliver plain HTML pages to
    older browsers. These programs must make a distinction between XMLHttpRequest
    and normal requests; they could do so by checking whether or not the User-Agent
    header is ''XMLHttpRequest''.


    The disadvantage to this method is that the server-side programmers have to create
    and maintain two applications instead of one, which of course makes the project
    more complex and expensive.


    Unfortunately, I have no other accessibility hints for XMLHttpRequest applications
    that do not work with HTML snippets. This only goes to show that we''ve barely
    scratched the surface of this complicated topic, and that more research is necessary.


    If you build a data-retrieval application, please take an hour to think about
    accessibility. Especially when you don''t work with HTML, chances are that you
    won''t find a solution, but I have the secret hope that somebody (maybe you!)
    will think of a viable approach that will take us one step nearer to accessible
    XMLHttpRequest applications.'
  merge: -1
