  md: '# Introduction


    THE PURPOSE OF this book is to offer easy access to the basic JavaScript knowledge
    I''ve gathered since I''ve been a professional Web developer.


    Since this book reflects my knowledge, it also reflects the limitations of that
    knowledge. I am a Web developer, not an application developer—which means I talk
    about browser incompatibilities, accessibility, low-level syntax, and cooperation
    with the HTML structural layer, instead of modules, design principles, and abstraction
    layers.


    During the eight years that I''ve earned a living by making Web sites, I have
    used some JavaScript features extensively but largely ignored others. I always
    took the tools I needed to do the job I was paid to, and it turns out that the
    JavaScript toolbox contains many features that I don''t need in my day-to-day
    use.


    Obviously, I cannot teach you to use a tool that I myself don''t understand. Therefore
    this book only treats those languages I work with. Object-oriented JavaScript,
    for instance, is conspicuously absent because I''ve never seen the need to use
    it. Besides, a book has a fixed length, and so I had to make choices—occasionally
    very difficult ones. In the end I selected those JavaScript features that I feel
    you must understand in order to use the language at competent intermediate to
    advanced level.'
  merge: -1
  pgno: 19
