  md: '# <script> tags with JavaScript content


    As I said, you can also put your script directly between the <script></script>
    tags—but remember that unobtrusive JavaScripting calls for an end to this practice
    (see 2C). This is the syntax:


    ```

    <script type="text/javascript">

    alert(''Hello world!'');

    </script>

    ```


    Of you can use as many lines of script as you need.


    If you''re using XHTML, the content of the <script> tag must be defined as CDATA,
    which tells the XML/HTML parser not to parse the contents, but to send it on to
    the script engine.


    ```

    <script type="text/javascript">

    <![CDATA[

    alert(''Hello world!'');

    ]]

    </script>

    ```


    Note the JavaScript comments //.. is necessary to hide the CDATA definition characters
    from the JavaScript interpreter. Since they are not JavaScript, but rather XHTML,
    the interpreter would choke on them.


    # Using multiple scripts


    You''re allowed to add an unlimited number of scripts to an HTML document. For
    instance, the Edit Style Sheet and Dropdown Menu scripts work on the same HTML
    page, and since I use separate .js files for the scripts, I include both:


    ```

    <script type="text/javascript" src="dropdown.js"></script>

    <script type="text/javascript" src="editstyles.js"></script>

    ```


    I created separate .js files for two reasons. First of all, they are independent
    scripts that should not influence each other, and which might be maintained by
    different programmers at different times.'
