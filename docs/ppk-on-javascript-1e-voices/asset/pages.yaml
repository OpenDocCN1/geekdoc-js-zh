- img_proc: true
  md: "We use the this keyword all the time in event handling. To understand why,\
    \ let's look at an even older example:\n\n```\nformField.onclick = function ()\
    \ {\n  alert('The form field with name ' + formField.name + \n  has value ' +\
    \ formField.value);\n}\n```\n\nHere we define an onclick event handler on a form\
    \ field. It fires whenever the user clicks on the form field. With our newly acquired\
    \ object knowledge we can easily see two important things:\n\n+   1. The onclick\
    \ event handler is in fact a method of the formField object.\n2. The this keyword\
    \ will refer to this formField object when used inside the event handler.\n\n\
    Therefore we'can also do the following:\n\n```\nformField.onclick = function ()\
    \ {\n  alert('The form field with name ' + this.name + \n  has value ' + this.value);\n\
    }\n```\n\nWe'll discuss this important technique further in 7F.\n\n# The global\
    \ object\n\nIf properties are really variables, it stands to reason that variables,\
    \ even global ones, are really properties. But properties of which object?\n\\\
    \ JavaScript automatically creates a global object to hold all the variables,\
    \ functions, and objects you define."
