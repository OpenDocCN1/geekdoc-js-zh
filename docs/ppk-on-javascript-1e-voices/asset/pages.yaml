  md: '# The Math object


    JavaScript has a Math object that contains methods for more complex mathematical
    operations (e.g., Math.sqrt(4) gives the square root of 4) and properties for
    constants (e.g., Math.PI) holds the number pi. Although the Math object allows
    many mathematical calculations, you''ll rarely need those in a Web site—well maybe
    if you want to calculate the path of a circular animation, but how often does
    that happen?


    # Math.round(), Math.floor(), and Math.ceil()


    The object contains three methods for rounding numbers: Math.round(), Math.floor(),
    and Math.ceil().


    Math.round() always rounds to the nearest integer:


    ```

    alert(Math.round(1.4)); // yields 1; the nearest integer

    alert(Math.round(1.6)); // yields 2; the nearest integer

    ```


    Math.floor() always rounds down (including when working with negative numbers):


    ```

    alert(Math.floor(1.6)); // yields 1

    alert(Math.floor(-1.6)); // yields -2

    ```


    Math.ceil() always rounds up (including when working with negative numbers):


    ```

    alert(Math.ceil(1.6)); // yields 2

    alert(Math.ceil(-1.6)); // yields -1

    ```'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Although these methods work on numbers, you can also specify a string as the
    argument. As usual, data-type conversion makes this possible:


    ```

    alert(Math.floor(''1.6'')); // also yields 1;

    ```


    # Math.random()


    Math.random() gives a random number between 0 and 1. I use it in XMLHTTP Speed
    Meter to generate a random animation: [HTTPRequest Speed Meter, line 111]


    ```

    var fluctuationDirection = (Math.random() < .5) ? 1 : -1;

    ```


    If the random number is smaller than 0.5, the animation should take one step in
    the positive direction; if it''s larger, it should take one step in the negative
    direction. If you need a random number between 0 and 10, simply multiply the value
    of Math.random() by 10:


    ```

    var randomNumber = Math.random() * 10;

    ```


    # Math.abs()


    Math.abs(x) gives the absolute (i.e., non-negative) value of the number x. I use
    this in XMLHTTP Speed Meter, too, because I want to calculate the direction of
    an animation: [XMLHTTP Speed Meter, lines 84-86]


    ```

    var distance = Mbit - currentMbit; var direction = distance/Math.abs(distance);
    if (!direction) return;

    ```


    currentMbit is the current position of the animation, and Mbit the desired position.
    Subtracting one from the other yields the distance animation has to go. But I
    also want to know the direction of the animation, so I divide distance (which
    may be positive or negative) by the absolute value of distance (which is always
    positive). This division yields 1 or -1, which gives me the direction of the animation.


    If the outcome is O (i.e., the current and desired position are the same) I end
    the function.'
