  md: "# COMMON ERROR IN STATEMENTS\n\nAs we saw in 5A, there are two nasty little\
    \ errors to avoid in your statements. Both examples below will always show the\
    \ alert, even if it is not 4:\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_222_0.png)\n\
    \nThe first example does not compare to 4, but assigns 4 to and returns this value.\
    \ Since 4 converts to boolean the alert always pops up. The second example has\
    \ a semicolon in exactly the wrong place, and therefore says \"if is equal to\
    \ 4, do nothing. Afterwards, show the alert.\n\nThe comparison returns true or\
    \ false. If true is returned, the alert pops up.\n\nNow take this statement from\
    \ Textarea Max. When the script initializes, it goes through all textareas in\
    \ the page and sees if they have an attribute maxlength. If one does, the textarea\
    \ is initialized:\n\n[Textarea Maxlength, 10-19, condensed heavily]\n\n```\nif\
    \ (textarea[i].getAttribute('maxlength')) {\n  // initialize textarea\n}\n```\n\
    \ntextarea[i] is the current textarea. I use the getAttribute method to search\
    \ for the attribute maxlength. If the attribute exists, then getAttribute returns\
    \ its value, which is a string, such as “300”. If there is no maxlength attribute,\
    \ it returns null."
