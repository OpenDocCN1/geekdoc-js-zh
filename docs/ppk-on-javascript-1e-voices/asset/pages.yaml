- img_proc: true
  md: "If x is equal to 4, the first code block is executed and the second one is\
    \ ignored. If x is not equal to 4, the first code block is ignored and the second\
    \ one is executed.\n\nelse if works like this:\n\n```\nvar x = 2;\nvar y = 3;\n\
    if (x == 4) {\n    alert('x is 4. Hurray!');\n}\\else if (y == 3) {\n    alert('y\
    \ is 3. Hurray!');\n}\n```\n\nThe first condition x == 4 is false: x is not equal\
    \ to 4. Therefore, the first code block is not executed. JavaScript now moves\
    \ to the else if and evaluates the condition y == 3. Since it is true, the second\
    \ alert is shown.\n\nOf course you can use as many else ifs as you like. Take\
    \ this example, from Usable Forms:\n\n[Usable Forms, lines 85-99, condensed]\n\
    \n```\nif (evtTarget.type == 'checkbox') {\n    // handle checkbox\n}\\else if\
    \ (evtTarget.type == 'radio') {\n    // handle radio\n}\\else if (evtTarget.type\
    \ == 'select-one') {\n    // handle select box\n}\n```\n\nIf the event target\
    \ is a checkbox, the first block is executed. If it's a radio, the second one\
    \ is executed, and if it's a select box, the third one is executed."
