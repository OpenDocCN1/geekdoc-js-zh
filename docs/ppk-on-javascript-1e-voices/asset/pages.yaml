- img_proc: true
  md: 'Using variables and functions that are defined in another window are therefore
    not very difficult, provided you can access the other window. As we''ll see in
    6B, gaining access to other windows is the most serious problem.


    # Availability of variables in other windows


    But there''s a catch we have to discuss right away. The last example, though correct
    in theory, does not work in practice:


    ```

    ```

    in main window

    var popup = [open popup and create reference to its window object];

    alert(popup.message);

    ```

    ```


    The second line correctly accesses the property of the popup global object. Nonetheless,
    it''ll likely give a JavaScript error.


    The problem is that the popup is created in the first line of code, and the browser
    hasn''t had the time to download the page. When the second line is executed, message
    is not yet available, and the second line results in a JavaScript error.


    This problem also exists in Site Survey. The page in the main window calls a function
    in the popup when it is unloaded; i.e., when the user requests another page or
    closes the window. This popup is opened as the user clicks anywhere in the main
    window. (Why? To defeat popup blockers. See 6B.)


