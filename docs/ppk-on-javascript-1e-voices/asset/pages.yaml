  md: 'Although JavaScript is best known for its function as a client-side scripting
    language in Web browsers, it can be implemented in a variety of other environments.
    Adobe''s ActionScript, for instance, implements JavaScript Core in Flash movies,
    and Netscape once had its own brand of Web servers that used JavaScript as their
    primary server-side language.


    Flash movies and Web servers are fundamentally different environments than Web
    pages. Nonetheless, they all use the JavaScript Core language in order to create
    a programming environment.


    DOM, on the other hand, is specific to XML documents (including HTML pages). Its
    view of a document as a hierarchical collection of nodes (see 8A) is excellently
    suited to Web pages, but largely useless in a Flash or server-side environment.


    That''s why there are separate standards for Core and the DOM.


    The European Computer Manufacturers Association (ECMA) has standardized JavaScript
    Core, and this standard is (supposed to be) used in any JavaScript implementation,
    be it Flash, Web browsers, Web servers, or one that is yet to be.


    On the other hand, XML and its numerous offshoots are the domain of the World
    Wide Web Consortium (W3C). W3C created the DOM specification, which includes event
    handling and CSS modification.


    The BOM and data retrieval have not yet been specified officially. The Web Hypertext
    Application Technology Working Group (WHAT-WG) is working on the BOM, while at
    the time of writing W3C has created a first draft of an XMLHttpRequest specification
    for data retrieval. The BOM still follows the old facto Netscape 3 standard, while
    XMLHttpRequest is being used as originally specified by Microsoft.


    # Two tiers


    JavaScript standards are therefore a two-tiered construct. The older, lower tier
    consists of the de facto Netscape 3 standard which is universally supported but
    rather restricted, while the newer, upper tier consists of standards'
  merge: -1
