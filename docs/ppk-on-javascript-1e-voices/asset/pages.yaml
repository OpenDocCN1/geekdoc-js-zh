  md: '# The + problem


    In general you don''t have to worry about data-type conversion; it just happens
    automatically. There''s one case, however, where a more formal ''understanding''
    is necessary: when you use the + operator.


    The problem with the + operator is that it can mean two things. If it''s used
    on numbers, it adds these two numbers together, but if it''s used on strings it
    means concatenate or sew these strings together. Concatenation is an addition
    of sorts, but it''s radically different from the mathematical operation.


    Take this example:


    ```

    var a = 4;

    var b = ''4'';

    var c = a + b;

    ```


    You think c has a value of 8, but in fact it contains the string ''44''. JavaScript
    gives precedence to string concatenation above number addition. Therefore JavaScript
    interprets a + b as a string concatenation, not an addition. The number is converted
    to a string instead of vice versa.


    Obviously, the solution to this problem is to make sure that both operands are
    numbers.


    ```

    var a = 4;

    var b = ''4'';

    var c = a + (b*1);

    ```


    If we multiply b by 1 first, JavaScript uses the value returned by this operation:
    a number. It subsequently interprets + as add, not as concatenate.


    # Adding and concatenating in one line of code


    Occasionally you want to add some numbers and concatenate a string in the same
    line of code. Let''s take a look at this example:


    ```

    var amount1 = 42;

    var amount2 = 24;

    var message = amount1 + amount2 + '' apples is what you ordered'';",

    ```'
