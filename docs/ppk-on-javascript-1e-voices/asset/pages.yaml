  md: '# Operators


    Most statements contain at least one operator, a character that tells JavaScript
    exactly which operation should be performed. Take this code:


    ```

    a b;

    ```


    Although you may have defined variables a and b, this pseudo-statement doesn''t
    tell JavaScript what to do with them, and produces an error.


    Instead, you should give explicit instructions:


    ```

    var c = a * b;

    ```


    This statement contains two operators: the * operator that performs the multiplication
    of a by b, and the = operator that assigns the result of multiplication to c.


    In general, you don''t have to worry about operators. On the whole, you''ll use
    them instinctively and correctly once you know what they mean. The most important
    exception is the + operator, and we''ll discuss its problems in detail in 5B.


    # Operands


    An operator needs operands—values on which to perform its operation. If we say
    a *, the operator commands a multiplication to take place. What do we multiply?
    The values of a and b. The * operator operates on a and b; therefore a and b are
    the operands of *. Most operators need two operands.


    # Operator precedence


    Take this statement:


    ```

    var a = x - y * z;

    ```


    Which operator goes first?—or *? If you remember your math, you''ll know that
    multiplication comes before subtraction. In technical terms, the multiplication
    operator has a higher precedence than the subtraction operator.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Therefore, this statement first multiplies y by z, and then subtracts the result
    from x. The result of this last operation is stored in a. If you want the subtraction
    to take place first, you use parentheses, just as in normal math:


    ```

    var a = (x - y) * z;

    ```


    This would subtract y from x, then multiply the result by z, and store the final
    result in a.


    Note that the operator has low precedence: it executes only when all other operators
    have been evaluated. That''s why the assignment of the final value of the calculation
    to a takes place last.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_179_0.png)'
