    # innerHTML vs. DOM


    When do you use innerHTML, and when do you use the pure DOM? In the end, this
    depends on your personal coding style, and it''s hard to give general rules. Nonetheless,
    there are some advantages to using innerHTML for the creation of large amounts
    of HTML.


    The power of innerHTML lies in the ease with which you can create complicated
    tree structures with just one line of code. None of the example scripts contain
    a case in which I have to add really swaths of HTML to the document, so here''s
    a contrived example of adding a slightly more complicated structure like the ones
    we''ve seen until now:


    ```

    var x = document.getElementById(''writeroot'');

    x.innerHTML = ''<ul><li>First option</li>

    <li>Second option</</></li></ul>'';

    ```


    Compare this to the following script that uses DOM methods:


    ```

    var x = document.getElementById(''writeroot'');

    var y = document.createElement(''ul'');

    var z = document.createElement(''li'');

    z.appendChild(document.createTextNodeNode(''First option''));

    ```'
