  md: "# CHAPTER 8: DOM\n\n![](img/1cdc3bc9be02360dab81df06bea3c619_421_0.png)\n\n\
    Some browsers (Explorer and Safari at the time of writing) equate HTML attributes\
    \ and JavaScript properties, and allow you to use price and `getAttribute('price')`\
    \ indiscriminately.\n\nOther browsers use HTML attributes and JavaScript properties\
    \ as different things. To keep your scripts cross-browser compatible, it's best\
    \ to treat attributes and properties as distinct entities.\n\nWhen the script\
    \ encounters the price attribute, it sets this price to all following windows,\
    \ until it encounters a new price attribute.\n\nSandwich Picker, lines 34-40,\
    \ condensed)\n\n```\nif (containers[i].getAttribute('price')) {\n  currentPrice\
    \ = containers[i].getAttribute('price');\n  containers[i].price = currentPrice;\n\
    ```\n\nThe first two lines read the HTML custom attribute price and then set totalPrice\
    \ to its value. The third line sets the JavaScript price property of the `<tr>`\
    \ to the value of currentPrice.\n\nEven though they share a name, the HTML custom\
    \ attribute and the JavaScript property are different things. The HTML attribute\
    \ is located in the document tree as an attribute node of the `<tr>`, while the\
    \ JavaScript property belongs to the object that represents the `<tr>` and is\
    \ not present in the document tree.\n\nThis is the general rule. There are, however,\
    \ numerous exceptions.\n\n# Attribute/property mappings\n\nBefore W3C specified\
    \ the DOM, JavaScript needed a way to access a few important HTML attributes,\
    \ like the value of a form field or the src of an image. In order to do this without\
    \ the as-yet-unspecified `getAttribute()` method, JavaScript's inventors decided\
    \ to map certain properties of JavaScript objects to HTML attributes."
  merge: -1
  pgno: 421
- img_proc: true
  md: 'For instance, all image objects would have a JavaScript src property that was
    equal to the HTML src attribute. Therefore these two lines are the same, though
    only the second works in older browsers:


    ```

    imgEl.setAttribute(''src'',

    ''http://www.quirksmode.org/pix/logo2.gif'');

    imgEl.src = ''http://www.quirksmode.org/pix/logo2.gif'';

    ```


    It''s important to note that this is not a general rule, but that the browser
    vendors have hand-picked certain important attributes and created JavaScript properties
    to match them. This attribute/property mappings are most often found in the areas
    that have been open to scripting influences since the beginning: form fields,
    links, and images.


    Later on, the style attribute that holds all inline styles of an element, as well
    as all event handlers (like onclick and onkeydown), were added to this list of
    special attributes/properties.


    Although the W3C DOM offers general and unrestricted access to all attributes,
    these special properties have never been removed from JavaScript, since that would
    mean old scripts would stop working.


    # The best way of getting and setting attributes


    With all this theoretical knowledge, we can discuss the best way of getting and
    setting attributes. I myself use these guidelines:


    +   - If there is an attribute/property mapping, I use it. This especially goes
    for style and event handlers, like Explorer cannot get or set them through the
    W3C DOM methods.


    +   - If there is no attribute/property mapping, I use getattr() and setAttribute().


    +   - Under no circumstances do I use attributes[] nodeList, which is supposed
    to contain all attributes but differs significantly per browser, or any other
    W3C DOM method. Their browser implementation is currently too buggy.'
  merge: -1
