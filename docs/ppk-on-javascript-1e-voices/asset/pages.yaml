- img_proc: true
  md: "![](img/1cdc3bc9be02360dab81df06bea3c619_499_0.png)\n\nThe setRequestHeader\
    \ method allows you to set one of the HTTP request headers. Its syntax is as follows:\n\
    \n```\nxmlhttp.setRequestHeader('Header-name', 'value');\n```\n\nI commonly see\
    \ the User-Agent header to 'XMLHttpRequest' so that server-side programs are able\
    \ to distinguish between XMLHttpRequestRequests and other requests.\n\n```\nxmlhttp.setRequestHeader('User-Agent',\
    \ 'XMLHttpRequest');\n```\n\nThis allows you to write server-side scripts that\
    \ serve up one document for advanced browsers and another one for browsers that\
    \ don't support (older) JavaScript. In 1OD we'll see that this can occasionally\
    \ be a useful accessibility tool.\n\nIf you want to POST your data, you must set\
    \ another header:\n\n```\nreq.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');\n\
    ```\n\n# setRequest function\n\nLet's bring all this wisdom together in one function:\
    \ the sendRequest() function I use in all my XMLHttpRequest projects (including\
    \ XMLHttpRequest Speed Meter). It requires the createXMLHTTPObject function we\
    \ discussed earlier.\n[XMLHttpRequest Speed Meter, lines 120-138, condensed]\n\
    \n```\nfunction sendRequest(url, callback, postData) {\n  var req = createXMLHTTPObject();\n\
    \  if (!req) return;\n  var method = (postData) ? \"POST\" : \"GET\";\n```"
