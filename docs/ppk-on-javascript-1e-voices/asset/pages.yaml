  md: "makes sense. However, we'll take a look at it anyway, since I use this tech-nique\
    \ in Edit Style Sheet.\n\n# Theory\n\nA document contains one or more style sheets,\
    \ each of which contain one or more rules. Every rule contains one selector and\
    \ an unlimited number of style declarations. Just as with the inline styles, these\
    \ style declarations are accessible through the style property of the rule.\n\n\
    ```\nstylesheets {\n  selector {\n    property: value[;] declaration\n  }\n  selector\
    \ {\n    property: value; } declaration\n    property: value; } declaration\n\
    \    property: value[;] declaration\n  }\n}\n```\n\nFIGURE 9.2 Every style sheet\
    \ contains one or more rules. Every rule contains a selector and one or more declarations,\
    \ each of which consists of a name/value pair.\n\nIn addition, Explorer and Mozilla\
    \ support the addition and removal of entire rules from the style sheet. Although\
    \ Edit Style Sheet doesn't use this feature, we'll treat it below.\n\nAlthough\
    \ the addition and removal of rules has been specified by W3C, Explorer supports\
    \ only its own version. So a bit of object detection is necessary when you want\
    \ to use these features.\n\n# document.styleSheets\n\nThe first requirement for\
    \ successful style-sheet editing is support for the document.styleSheets nodeList.\
    \ If the browser doesn't support that, the script won't work."
