  md: 'Nonetheless, suppose you create a 100% accurate browser detect that catches
    all browsers that don''t support document.styleSheets.(Impossible—but suppose
    for a moment that it isn’t.) Although you have solved your problem for the present
    time, the forward compatiblity of your solution is essentially nil.


    I fully expect Opera and Safari to start supporting document.stylesheets one day,
    although I cannot predict when and in which version. At that time, your browser
    detect will not only Opera and Safari access to the script, even though by then
    they would be able to easily handle it. Your perfect browser detection has become
