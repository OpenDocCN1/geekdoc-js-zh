    \  // containers[i] refers to the <tr>\n  // we're currently studying\n}\n```\n\
    \n# Short-distance travel\n\nEvery node in the document has five properties and\
    \ two nodes that allow you easy short-distance travel. The five properties are\
    \ parentNode, firstChild, lastChild, previousSibling, nextSibling, and they each\
    \ refer to the node that is parent node, first child, etc. of the node you use\
    \ them on.\n\n# parentNode, firstChild, lastChild, previousSibling, nextSibling\n\
    \nTake this bit of HTML from Sandwich Picker:\n\n```\n<tr>\n  <td class=\"number\"\
    ><input /></td>\n  <td class=\"description\">Spicy roast beef</td>\n  <td class=\"\
