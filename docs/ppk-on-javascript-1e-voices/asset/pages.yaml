    excellent handle to explain the difference between setTimeout and setInterval.


    # Site Survey


    Shortly after the XMLHTTP Speed Meter was delivered, I started working on an unusual
    and interesting script for research company RM Interactive.


    This company is hired by large Website owners to keep track of which pages their
    users visit, and to present an additional, and wholly voluntary, questionnaire
    after the user has left the site. This is all done by means of a popup.


    The script that did all these things were old, couldn''t handle popup blockers,
    and was inaccessible to noscript users. Since RM Interactive was about to be hired
    by the Dutch government, all accessibility issues need to be solved.


    So I rewrote the script from scratch, with emphasis on usability and accessibility.
    The script demonstrates circumventing popup blockers, keeping track of what happens
    in the main window, restoring communications between the popup and the main window,
    and finding out if the user has left the site.


    Note that Site Survey is the only script that''s spread out over two JavaScript
    files: survey.js in all pages of the host site, and popup.js in the popup.


