- img_proc: true
  md: '# Preparation


    A GOOD PRE phase is a crucial step in creating simple, efficient scripts. Before
    writing a single line of code, you must make many decisions, most importantly
    about the cooperation between the HTML and CSS on the one hand and the JavaScript
    on the other. You also must know how to insert scripts in your HTML pages, and
    how to make sure they run at the right time.


    The purpose of the preparation phase is to fix the basic outline of your scripts
    in your head (or on paper, or in a document, whatever works best for you). If
    you already know the rough shape your script is going to take, your actual coding
    hours can be spent on detail decisions and problems. Conversely, if you don''t
    prepare, you might find after a few days of frantic coding that your fundamental
    approach is wrong or too complicated, and that you have to start all over again.


    Don''t skip on the preparation phase! Even on a tight deadline in a chaotic project
    when using a few hours without coding a single line seems a a waste of time, a
    good preparation will save you a lot of extra work a few days down the line.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# A: HTML and CSS structure


    The most important decisions in the preparation phase concern the HTML and CSS
    structure of your pages. Unfortunately, it''s not really possible to give general
    rules for HTML and CSS structures; they depend on the purpose and context of the
    script. An HTML structure that works brilliantly in one case can be counterproductive
    in another situation.


    This is an area where you have to make your own decisions. However, I can offer
    a few examples that will help you start thinking about good structures.


    # HTML structure


    HTML structure is vital to some example scripts. The most obvious are Sandwich
    Picker, whose core is formed by the principle of "one sandwich one `<tr>`,," and
    Dropdown Menu, where the logical, semantic, nested `<ul><li>` structure is crucial.


    Where does Sandwich Picker find the name of a sandwich? In the `<tr>` second `<td>`.
    How does Dropdown Menu know if an `<li>` has a submenu? It checks if the `<li>`
    has a child `<ul>`.


    Obvious, isn''t it?


    In general, you should embrace such obviousness. Obviousness is the key to creating
    HTML structures that will help your script instead of hindering it. Besides, such
    HTML structures usually hold data that the script can use.


    Whenever you find the data your script needs by examining the document structure,
    you should do so, since it''s always the simplest alternative. It''s much easier
    to tell the script to look in the second `<td>` to find the sandwich name than
    to tell it to read from an array or object''s defined elsewhere.


    You''ll see plenty of examples of this in 4F, where we discuss the HTML structure
    of the example scripts.'
  merge: -1
  pgno: 135
- img_proc: true
  md: "# CSS structure\n\nAs with HTML, a good CSS structure can save you a lot of\
    \ headaches.\n\nThe Order and Trash buttons in Sandwich Picker are excellent examples.\
    \ They are created when the script is initialized, but the rules for their visibility\
    \ and invisibility are complicated.\n\nInitially both buttons are hidden. The\
    \ Order button becomes visible when the user adds a quantity to a sandwich, since\
    \ that's the first step in ordering it. When the sandwich is made to the order\
    \ table, the Order button should be hidden (the sandwich has already been ordered,\
    \ after all), and the Trash button should appear (since only now has it become\
    \ possible to remove the sandwich from the order form).\n\nOf course you can write\
    \ a script to arrange for all these show-hide actions. Hiding or showing a single\
    \ button is trivial, but keeping track of which buttons are visible and hidden,\
    \ and deciding which display changes are triggered by the latest user action,\
    \ most likely take a few dozen complicated lines of JavaScript.\n\nFortunately,\
    \ you don't need JavaScript for this task. It's far simpler to define the display\
    \ changes in CSS:\n\n```\na.trash,a.order {\n  display: none;\n}\ntr.highlight\
    \ a.order {\n  display: block;\n}\n#ordered a.order {\n  display: none;\n}\n#ordered\
    \ a.trash {\n  display: block;\n}\n```"
  merge: -1
  pgno: 136
- img_proc: true
  md: 'Initially both buttons are hidden. An order button in a `tr.highlight` is visible,
    except when it''s in `table#ordered`, then it''s hidden. A trash button is only
    visible in `table#ordered`.


    As soon as the script takes action, the CSS associated with the buttons are automatically
    shown or hidden, without the need for complicated JavaScript functions that monitor
    user behavior and button placement.


    Now the script only has to change the class of an ordered sandwich to `highlight`,
    and the Order button appears. When the script moves to `<tr>` to the Order table
    (which, surprisingly, has `id=ordered`), the button disappears again, but the
    Trash button appears.


    Obvious, isn''t it? Again, obviousness is the key. Creating good, useful CSS structures
    that cooperate closely with your scripts will save you a lot of time and trouble.


    # B: Hooks


    Many scripts do not work on an entire HTML page, but on specific HTML elements
    within the page. For instance, Dropdown Menu shouldn''t convert every single `<ul>`
    in a page to a dropdown menu, but only the `<ul>` that you indicate. Usable Forms
    should not hide all form fields in the document, but only the ones that you have
    marked as such.


    In order to tell the script which HTML elements it should work on, you need hooks.
    A hook can be any kind of HTML structure, although an attribute, as `id`, is the
    most obvious choice.


    When the script starts up, it goes through the document in search of these hooks,
    and when it finds one it initializes the script for the HTML elements that contain
    it. Thus Dropdown Menu looks for `<ul class="menetre">`, and converts those elements
    to dropdown menus. Usable Forms searches through all `<tr>` in the document and
    takes those with a `rel` attribute out of the document. Textarea Maxlength searches
    through all `<textarea>`s in the document and initializes those that have a `maxLength`
    attribute.


    Let''s discuss a few common hooks.'
  merge: -1
  pgno: 137
