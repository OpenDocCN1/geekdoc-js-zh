  md: '# Working with methods and properties


    Whether you use internal JavaScript objects, host objects, or self-defined objects,
    they all contain methods and properties.


    Many properties of host objects have predefined behavior. Take the href property
    of the location object that holds the URL of the current page. When you change
    the value of this property, the browsers interpret it as a command to load a new
    page (see 6C).


    Predefined properties generally work as described: "If you set this property to
    that value, this will happen." Sometimes, though, the property works only in one
    browser.


    You can create any property you want, just as you can create any variable you
    want. Even when some browsers interpret a change in a property''s value as a command
    to do something while other browsers don''t, the property doesn''t hurt.


    You can also access any property you want, even if it does not exist. In 5G we
    tried to access the target property of the event object, and saw that in Explorer
    it is undefined, since Explorer uses the srcElement property instead. Nonetheless,
    accessing target is safe, as long as you don''t mind the value undefined creeping
    in you your scripts.


    Methods are another story, though. When you execute a method, you in fact do two
    things: first you access it, and then you try to execute it. Accessing the method
    is always safe, just as with properties, but executing it is not.


    # Example


    An example will clarify these rules. As we''ll see in 7D, sometimes it''s useful
    to stop the propagation of an event (just nod wisely for the moment). The problem
    is that this functionality exists in two flavors: W3C-compliant browsers use the
    stopPropagation()method of the event object, while Microsoft uses a property of
    the event object: cancelBubble.'
  merge: -1
  pgno: 252
- img_proc: true
  md: "This is the correct way to handle the situation:\n\n```\nfunction stopProp(e)\
    \ { // e is the event object\n  if (e.stopPropagation()) {\n    e.stopPropagation();\n\
    \    e.cancelBubble = true;\n  }\n}\n```\n\ne holds the event. We first want to\
    \ execute the stopPropagation() method, but we can't just go off and do it. In\
    \ Explorer this method doesn't exist—and that really means that if you access\
    \ the stopPropagation property of the event, you get undefined. Executing this\
    \ value as a method is obviously impossible and gives an error message.\n\nWe\
    \ start out by checking the event has a method stopPropagation(if e.stopPropagation()).\
    \ If it does, it executes e.stopPropagation().\n\nThen we set Explorer's cancelBubble\
    \ property to true. Since we don't use any kind of object detection, all browsers,\
    \ including the W3C-compatible ones, execute this line of code. This does not\
    \ lead to error messages. You can always define any property you like, so this\
    \ action is legal. W3C-compliant browsers shrug and create a property cancelBubble\
    \ with value true. Of course they don't do anything with this new value, because\
    \ they're not programmed to do so. Only Explorer interprets this assignment as\
    \ a command to stop the propagation of the event.\n\n# Creating your own properties\n\
    \nCreating your own properties is sometimes useful. Of these properties don't\
    \ have any predefined meaning in the browsers, so you have to write scripts that\
    \ do something with the values they contain.\n\nLet's take a look at an example\
    \ from Sandwich Picker:\n\n[Sandwich Picker, lines 193-202]\n\n```\nfunction calculateTotalPrice()\
    \ {\n  var price = 0;\n```"
  merge: -1
  pgno: 253
- img_proc: true
  md: "```\nvar containers = [all trs in the ordered table]\nfor (var i=1;i<containers.length;i++)\
    \ {\n  var searchFields = [the input];\n  var amount = searchFields[0].value;\n\
    \  price += containers[i].price * amount;\n}\n```\n\ndocument.getElementById('priceDisplay').\n\
    innerHTML = createReadablePrice(price);\n\nNote that containers[i].price is a\
    \ property of the object containers[i].\nWhy do I use a property to store the\
    \ price? While Sandwich Picker runs, <tr containing sandwiches will constantly\
    \ be transferred from one table to another as the user searches, orders, and trashes\
