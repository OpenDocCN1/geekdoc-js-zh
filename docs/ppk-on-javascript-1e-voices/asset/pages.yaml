  md: "# for, while, do/while\n\nThere are four for loops in JavaScript, and although\
    \ they differ in detail, they are all meant to repeat a code block until a certain\
    \ condition is met. The most common one is the for loop, occasionally you'll use\
    \ while and do/while, too.\n\nThe fourth one, for in, loops through the properties\
    \ of an object. Since it is hard to understand without treating JavaScript objects\
    \ and associative arrays, first, I will explain it in detail in 5K.\n\n# for\n\
    \nThis is the structure of a for loop:\n\n```\nfor (initialize; test; update)\
    \ {\n  statements;\n}\n```\n\nA for statement always needs three arguments: an\
    \ initial condition, a test (will the for continue for another loop?), and an\
    \ update. The statements in the block are run repeatedly until the test becomes\
    \ false.\n\nBy far the most use of for is something like this:\n[Dropdown Menu,\
    \ lines 7-19, condensed heavily]\n\n```\nvar lists = document.getElementsByTagName('ul');\n\
    for (var i=0;i<lists.length;i++) {\n  if (lists[i].className != 'menutree') continue;\n\
    \  // initialize <ul>\n}\n```\n\nThe loop goes through all <ul> elements in the\
    \ page and does something with all of them. (We'll get back to the continue statement\
    \ later.)"
  merge: -1
  pgno: 230
- img_proc: true
  md: "Let's take a closer look at the three arguments:\n\n+   1. `var i=0` is the\
    \ initial condition. When the loop starts up for the first time, a local variable\
    \ `i` is created and set to 0.\n2. `i<x.length` is the test. Initially, and whenever\
    \ the update has been performed, the `for` statement checks the test, and if the\
    \ test returns `true`\n(if `i` is smaller than `x.length`), it continues another\
    \ loop.\n3. `i++` is the update. Every time the `for` statement finishes a loop,\
    \ it performs\nt update. `i` is increased by 1.\n\nThe net result of all this\
    \ is that the `for` loop goes through all `<ul>`s in the document. This is a best\
    \ practice: as soon as you use `getElementsByTagName()`,\n(see 8B), you start\
    \ up a `for` loop to go through the list it returns.\n\n# while\n\nA `while` loop\
    \ takes only one argument: a test expression. The loop continues as long as the\
    \ expression remains `true`.\n\nI use `while` loops mainly when I want to go through\
    \ an array and discard its elements one by one after doing something with them.\
    \ Take this example of Usable Forms:\n\n[Usable Forms, lines 41-51, condensed\
    \ heavily]\n\n```\nwhile(hiddenFields.length) {\n  // do stuff with hiddenFields[]\n\
    \  waitingRoom.append(hiddenFields.shift());\n}\n```\n\n`hiddenFields` is an array\
    \ of `<tr>`s that should be removed from the document. The `while` loop takes\
    \ the first of these `<tr>`s and removes it from the document. It simultaneously\
    \ removes this `<tr>` from the array by means of the `shift()` method. We'll get\
    \ back to this in 81.\n\nOnce per iteration, the `while` loop tests for `hiddenFields.length`:\
    \ in other words, it tests if the array still has elements in it. Once the `length`\
    \ reaches O\nwhich evaluates to `false`), the `while` loop quits."
  merge: -1
  pgno: 231
- img_proc: true
  md: "In theory it's possible to rewrite all for loops as while loops. For instance,\
    \ here's the for loop example rewritten as a while loop:\n\n```\nvar lists = document.getElementsByTagName('ul');\n\
    var i = 0;\nwhile (i<lists.length) {\n  if (lists[i].className == 'menutree')\
    \ {\n    // initialize <ul>\n    i++;\n  }\n}\n```\n\nThere's a danger here, though.\
    \ i must be updated within the while loop, or the loop will continue forever.\
    \ The i++ does not, but I had to make sure it was executed every time, which means\
    \ I had to change the class-name check.\n\nSuppose I'd done wrong:\n\n```\nvar\
    \ lists = document.getElementsByTagName('ul');\nwhile (i<lists.length) {\n  if\
    \ (lists[i].className != 'menutree') continue;\n  // initialize\n  i++;\n}\n```\n\
    \nSay the second <ul> does not have class=\"menutree\". The while loop faithfully\
    \ executes the continue statement, but i is not updated. That means the next iteration\
    \ of the loop again checks the second <ul>, which still doesn't have a class=\"\
    menutree\", and i is again not updated. This continues indefinitely. (Fortunately,\
    \ most browsers recognize an infinite loop after a while, and allow you to break\
    \ it.)\n\nIn general, when using a while loop, you have to make sure that every\
    \ iteration updates your test variable."
  merge: -1
  pgno: 232
- img_proc: true
  md: "# do/while()\n\nThe do/while() loop is almost, but not quite, the same as while().\
    \ It, too, takes one test expression and continues to loop as long as the expression\
    \ remains true. The difference is where while() first checks the test expression\
    \ and then starts another loop, do/while() first performs a loop and then checks\
    \ the test expression.\n\nTake this example:\n\n```\nvar x = 0;\nwhile (x != 0)\
    \ {\n  alert('x is not 0');\n}\n```\n\nThe while() loop is never executed, since\
    \ the very first test reveals that x is O.\n\n```\nvar x = 0;\ndo {\n  alert('x\
    \ is not 0');\n} while(x != 0);\n```\n\nHowever, the do/while() loop executes\
    \ before any test takes place and shows an alert. Only after the alert is shown\
    \ does the test reveal that x is O, and the loop stops.\n\nAs with while loops,\
    \ you should make sure that the test variable in do/while loops is updated in\
    \ every loop.\n\n> SEMICOLONS AND DO WHILE\nYou'll notice that I added a semicolon\
    \ after the do/while() loop. In this position it's perfectly safe, since the code\
    \ block has already been defined. Semicolons are only dangerous when they're inserted\
    \ between an if, for, or while state-ment and the code blocks they're supposed\
    \ to execute."
  merge: -1
  pgno: 233
- img_proc: true
  md: "So any code in a do/while() loop is executed at least once, while code in a\n\
    while() loop may never be executed.\n\nThe animation functions of XMLHttpRequest\
    \ Speed Meter contain a useful example of\ndo/while(). I have to create an animation\
    \ that goes from one point to another,\nbut beforehand I have no idea what these\
    \ two points will be, and whether the\nanimation moves to the left or to the right.\n\
    \nSuperficially, using a for loop seems to be possible. currentMbit is the cur-\n\
    rent position, and Mbit is the desired position:\n\n[XMLHttpRequest Speed Meter,\
    \ lines 79-95, condensed and changed]\n\n```\nfunction moveToNewSpeed(Mbit) {\n\
    \  var distance = Mbit - currentMbit;\n  var direction = distance/Math.abs(distance);\n\
    \  if (!direction) return;\n  for (var pos = currentMbit;pos != Mbit;pos+=direction)\
    \ {\n    // give animation orders\n  }\n}\n```\n\nThe script first calculates\
    \ the distance between the two points, (+1 or -1). Then the pos\ndirection the\
    \ animation has travel to the right. The variable pos goes\nfrom currentMbit to\
    \ Mbit in steps of direction.pos now becomes interme-\ndiate steps of the animation,\
    \ and this is used to give the animation orders.\n\nThis seems to work fine, except\
    \ for one tricky bit: the very last step, when pos\nbecomes exactly equal to Mbit,\
    \ is never made. As soon as pos becomes equal\nMbit, the test expression pos !=\
    \ Mbit becomes false, and the for loop\nstops. The animation stays stuck at the\
    \ penultimate step.\n\nI could solve the problem by changing the test expression\
    \ to pos > Mbit or pos\nMbit. However, I don't know whether pos starts out as\
    \ larger or smaller\nthan Mbit, because I don't know in which direction the animation\
    \ is going. If\nuse pos < Mbit, animations from left to right would never work,\
    \ and if I use\npos > Mbit, animations from right to left would never work."
  merge: -1
