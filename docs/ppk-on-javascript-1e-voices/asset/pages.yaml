  md: "The script now accesses the correct textarea.\n\nBut isn't the textarea the\
    \ user is currently editing also the target of the event? Yes, it is. Then why\
    \ doesn't the function use the target? Because of the textareas[i].onkeyup() statement\
    \ in the initialization routine.\n\nThat statement essentially calls maxLength()\
    \ as a method of the textarea object, and in order for the function to work, it\
    \ must use the this keyword. If it didn't—if it used the event target—the function\
    \ call would give error messages, since there's no event object available.\n\n\
    # textarea example\n\nIn Using Forms, the script registers a general onclick handler\
    \ on the document, and waits for click events on form fields to bubble up. In\
    \ addition, the script registers the same function as the change event handler\
    \ of boxes.\n\n[Used Forms, lines 21-23 and 53]\n\n```\nvar selects = document.getElementsByTagName('select');\n\
    for (var i=0;i<selects.length;i++)\n  addEventSimple(selects[i],'change',hideFields);\n\
    // initialization\n  addEventSimple(document,'click',hideFields);\n```\n\nObviously,\
    \ when a user clicks on, the first item on the agenda is to find out element he\
    \ clicked on, and whether the action should trigger document changes. Because\
    \ I use addEventSimple(), this keyword is useless: it doesn't work in Explorer.\
    \ Besides, even if it did, it would refer to the document, that's where I registered\
    \ the onclick event handler.\n\nIn this situation, I use the event's target:\n\
    \n[Used Forms, lines 70-81, condensed]\n\n```\nvar evt = e || window.event;\n\
    var evtTarget = evt.target || evt.srcElement;\n```"
