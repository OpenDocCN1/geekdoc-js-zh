  md: 'SECTION I: NODELISTS | 399


    > CONSTRUCTED DOM TREES

    The only situation in which properties are useful when you construct a document
    tree, or a portion of one, entirely in JavaScript. Then it contains no empty text
    nodes, and all properties work as you expect them to work.


    # I: nodeLists


    Some W3C DOM methods and properties return nodeList: lists of all nodes that meet
    a certain criterion. Of these, getElementsByTagName() is by far the most important.
    It returns a nodeList that contains all elements that have a tag name. Let''s
    take a close look at nodeLists and their dangers.


    Superficially, nodeLists look like arrays. They accept an index number between
    square brackets, and return the node with that index number. For instance:


    ```

    var x = document.getElementsByTagName(''p'')[1];

    ```


    x is the second paragraph (with index 1) in the document.


    > ITEM NOT NECESSARY

    All lists also have an method. It requires an index number, and returns the node
    with that index number. These two calls do exactly the same thing:


    ```

    var fourthP = x[3];

    var fourthP = x.item(3);

    ```


    is meant for other languages in which nodeLists don''t behave as arrays. In JavaScript
    you never need it.'
