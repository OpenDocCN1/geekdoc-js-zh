  md: '# Form Validation


    Validating a form is the oldest JavaScript effect in existence. Thus it''s quite
    likely that a user has encountered it before. As we saw in 1A, this script saves
    the user a round-trip to the server if he makes a mistake. From a usability perspective
    that''s always good. Then, the error messages are displayed right next to the
    form fields they apply to, which makes the whole process clear.


    If the script doesn''t work, the form is not validated. The only solution to this
    problem is installing a server-side form-validation script. This solution has
    been general knowledge since the dawn of time, but has always been disregarded.


    The form fields contain attributes that define which validations the script should
    perform on them. The server-side script could use these same definitions.


    # Dropdown Menu


    Are dropdown menus good from a usability point of view? I''m not going to get
    mixed up in that discussion; I will restrict myself to the observation that they''re
    a golden oldie for which clients frequently ask. Besides, most Web surfers are
    used, or at least resigned, to. them.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_89_0.png)


    FIGURE 2.10 Dropdown Menu with script enabled. Does it make the navigation more
    usable?


    Dropdown Menus offer an extreme example of diminished usability without JavaScript.
    I carefully crafted the CSS so that the menu would be to be user-friendly as possible
    in the absence of JavaScript, but in the end they remain huge lists of links that
    are hard to search through. Technically they are accessible—any user can activate
    any link—but finding the link you want to activate is another story altogether.'
  merge: -1
