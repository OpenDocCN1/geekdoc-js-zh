  md: '# SECTION B: FINDING ELEMENTS | 359


    ![](img/1cdc3bc9be02360dab81df06bea3c619_388_0.png)


    Figure 8.3 The DOM tree of the &lt;tr&gt; with the short-distance properties sketched.


    The first &lt;td&gt; is the firstChild of the &lt;tr&gt; the first &lt;td&gt;
    is the lastChild. When we start at the second &lt;td&gt;, the &lt;tr&gt; is its
    parentNode, the first &lt;td&gt; is its previousSibling, and the third &lt;td&gt;
    is its nextSibling. Almost all nodes contain these five properties, although text
    nodes cannot have child nodes and document nodes cannot have parent nodes.


    # childNodes[] and children[].


    Every node has two properties that contain nodeLists: childNodes[] and children[].
    The difference between the two is that childNodes contains all children of a node,
    while children[] contains only those children that are element nodes themselves,
    and not the text nodes. children[] is the more useful of the two, since you''re
    rarely interested in text nodes when you go through the children of an element,
    but unfortunately it is not part of the W3C DOM specification, and at the time
    of writing is not supported by Mozilla.


    > PREVIOUSSIBLING, NEXTSIBLING, AND CHILDNODES ARE USELESS


    firstChild, nextSibling, and childNodes appear to be useful properties, but unfortunately
    they are not nearly handy as they seem. In the example scripts I use nextSibling
    twice, and I don''t use previousSibling and childNodes at all.


    The reason is that they generally don''t refer to the element nodes you''d expect,
    but to empty text nodes. We''ll study these nuisances in 8H.'
