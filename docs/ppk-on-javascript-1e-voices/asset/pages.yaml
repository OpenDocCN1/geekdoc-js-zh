- img_proc: true
  md: 'By removing the inline style entirely, the default style sheet takes over and
    the &lt;tr&gt; becomes visible in all browsers. Better still, you don''t have
    to know whether the browser needs ''block'' or ''table-row''.


    # G: Animations


    Animations draw the eye of the user to the element that is animated. If that''s
    a good thing, the animation serves a good purpose; but if not, it doesn''t.


    XMLHTTP Speed Meter is the only example script that uses an animation. Although
    it''s there to provide some eye candy, it also serves a real purpose. By making
    the animation fluctuate within a range of download speeds, the interface conveys
    the message "Your download speed will be somewhere around here," without specifying
    an exact speed. This is very important to the client—an ISP who simply cannot
    guarantee an exact speed, and wants clients to be aware of that fact.


    # How animations work


    Animations are repeated changes to the same style of the same element. With a
    bit of luck, the style changes follow each other so rapidly that the user perceives
    the animation as one continuous movement instead of a lot of small steps.


    Nonetheless, JavaScript animations may become jerky for several reasons: the script
    isn''t fast enough; the user''s computer is slow; the page has many scripts running
    in addition to the animation; or the animation uses many tiny steps. If perfect
    animations are an absolute requirement for your site, Flash remains the best tool.


    Animations are one area in changing the style property is better than a class
    change. If XMLHTTP Speed Meter used class changes, I''d have to define dozens
    of classes: one for each possible animation step. That would make the CSS presentation
    layer extremely complicated.


    XMLHTTP Speed Meter uses two nested &lt;div&gt;s. The outer one contains the grey
    background image'
