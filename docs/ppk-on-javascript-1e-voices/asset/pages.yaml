- img_proc: true
  md: 'SECTION C: JAVASCRIPT HISTORY 21


    ![](img/1cdc3bc9be02360dab81df06bea3c619_50_0.png)


    Managing competing DOMs was the main challenge for Web developers during the Browser
    Wars. If you wanted to move a layer across the browser window—you had to write
    separate scripts to accommodate Netscape 4''s and Explorer 4''s DOMs and event
    models, as well as a bit of code that made sure older browsers would not try to
    execute it script.


    Some Web developers thought this was great fun; others complained about a complete
    lack of standardization.


    # The first fat phase


    Thanks to these new features, the client could now handle significant amounts
    of interaction. Animations, show/hide scripts, and other eye candy became possible
    overnight, in the hands of a competent interaction designer these tricks could
    help users make more sense of a site and take more actions before being forced
    to load another page. Unfortunately, competent interaction designers were thin
    on the ground.


    The fat model gained adherents, who began to redefine JavaScript''s purpose. From
    a thin, simple language that could do a few tricks, it became a more comprehensive
    construct that allowed developers to create true-page interfaces.


    Unfortunately, all this activity did not lead to the revolution promised by ecstatic
    gurus. Although a few experiments were interesting, most interfaces and libraries
    only offered variations on the moving layer and the dropdown menu.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'JavaScript''s redefined purpose was all about technology, and not about usability.
    This is a recurring theme in JavaScript history. Eight years later, we see essentially
    the same thing happening in JavaScript''s next fat phase.


    # Browser Peace


    Microsoft came out with Explorer 5 in 1999. It supported quite decent CSS, and
    the new W3C DOM standard. In contrast, Netscape 4 died, despite desperate last-rest
    attempts from both its parent company and Web developers to alleviate its suffering.
    Roughly at the same time, JavaScript''s first fat phase broke down into its components:
    a bit of JavaScript and a lot of hot air.


    This double demise of Netscape 4 and JavaScript''s first fat phase allowed Explorer
    to win the Browser Wars and made room for the CSS revolution and a new way of
    thinking about Web development.


    # The CSS revolution


    At the tail end of the Browser Wars, a group of concerned Web developers united
    in the Web Standards Project (WaSP). Their mission was to increase the awareness
    and compatibility of the various browsers and of Web developers themselves.


    Back then JavaScript stood for all that was wrong with the old way of making Web
    sites. There was no standard; the average JavaScript-''improved'' site was bloated,
    more likely than not worked only in one browser, and didn''t consider accessibility
    at all. A fundamental re-think was necessary.


    For reasons among others, the WaSP, and Web developers synthesizing with its goals,
    focused on CSS. Many Web developers were tired of the hacks and workarounds that
    the Browser Wars era had given rise to and desperately wanted to clean the slate.
    CSS, and not JavaScript, gave them the best chance to radically break with the
    past.'
  merge: -1
