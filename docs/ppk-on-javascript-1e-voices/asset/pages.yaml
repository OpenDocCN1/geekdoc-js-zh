  md: "To access the fifth <p> in the page you can also say:\n\n```\nvar fifthP =\
    \ pars[4];\n```\n\nThe syntax is useful only if you know exactly which <p> you\
    \ want to access, and are certain that it hasn't been moved or removed by another\
    \ part of your script. Therefore it isn't often used.\n\n# getElementsByTagName('*'););\n\
    \nFinally, you can use getElementsByTagName('*'), which gives you all element\
    \ nodes in the document in the order they appear in the source code. This method\
    \ is not used often, since you rarely need all the elements in the entire document.\
    \ Beside, it is not supported by Explorer 5.5 and earlier.\n\n# Examples\n\nFor\
    \ an example, let's look at Usable Forms. When the script starts up, it should\
    \ go through all tags of a certain kind; if they contain a rel attribute, they\
    \ should be removed from the document. The script does this through the getElementsByTagName()\
    \ method:\n\n> Usable Forms, lines 1 and 25-28\n\n```\nvar container = 'TR';nvar\
    \ containers = document.getElementsByTagName(container);\nfor (var i=0;i<containers.length;i++)\
    \ {\n  if (containers[i].getAttribute('rel')) {\n    // remove element\n    //\
    \ containers[i] refers to the <tr>\n    // we're currently studying\n  }\n}\n\
    ```\n\ncontainers becomes a nodeList that contains all <tr> tags in the entire\
    \ document. The script goes through them one by one and sees if they have a rel\
    \ attribute. If so, it removes them from the document and puts them in a waiting\
    \ room, where they remain until the user checks or selects the appropriate form\
    \ field."
