  md: "# Short distance only\n\nAlthough it's theoretically possible to use these\
    \ properties to go from any node to any other node, that's not recommended. Take,\
    \ for instance, this path:\n\n```\nvar x = [a node];\nvar y = x.parentNode.lastChild.childNodes[2].firstChild;\n\
    nextSibling;\n```\n\nThe code is unreadable; no other JavaScript programmer will\
    \ intuitively understand what you're doing. Besides, even though the path may\
    \ be correct at the moment you create the script, it doesn't account for changes\
    \ in the document tree, and changing the document tree is the whole point of W3C\
    \ DOM scripts.\n\nTherefore, I use these properties exclusively for short-distance\
    \ travel. In general I restrict myself to two, or at most three, of these properties\
    \ per statement, if you need more of them you're usually better served by getElementById(Id)\
    \ or getElementsByTagName().\n\n# Examples\n\nBy the most common use of firstChild\
    \ is in accessing the text of an element:\n\n```\n<p>I am a JavaScript hacker.</p>\n\
    ```\n\nIf you want to find the text contained by the paragraph, you have to travel\
    \ to the text node it contains and read out its nodeValue:\n\n```\nvar par = [the\
    \ paragraph];\nvar text = par.firstChild.nodeValue;\n```\n\nYou'll also use parentNode\
    \ a lot. For instance, this bit of Sandwich Picker [Sandwich Picker, lines 106-133,\
    \ condensed]\n\n```\nfunction orderSandwich() {\n  // more stuff\n  var x = this.value\
    \ * 1;\n  if (isNaN(x) || x == 0)\n    removeFromOrder(this);\n}\n```"
