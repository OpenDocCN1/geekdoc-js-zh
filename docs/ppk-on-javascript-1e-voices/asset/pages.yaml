    Another problem is that generated radio buttons do not work in Explorer. Although
    it''s possible to generate them through "pure" W3C DOM methods, the browser makes
    a mess of the name attributes of the radio buttons. Therefore, the generated radio
    buttons will likely not work as you expect them to.


    > Remember: the user is allowed to check only one radio button in a group, and
    a group is defined as all radio buttons that share a name attribute. If the attribute
    doesn''t work correctly, the radio buttons won''t work, either.


    Switching to innerHTML offers a solution:


    ```

    var newField = ''<input type="radio" name="radioGroup" value="first" />;

    newField += ''<input type="radio" name="radioGroup" value="second" />'';

    document.getElementById(''theForm'').innerHTML += newField;

    ```


    The radio buttons work as expected.


    # F: innerHTML


    In the previous section, I used the innerHTML property for certain jobs, it''s
