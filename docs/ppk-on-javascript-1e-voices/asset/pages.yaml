  md: 'Second, Dropdown Menu is used throughout the entire site of my client, but
    Edit Style Sheet is only used in one administration page. Therefore I include
    dropdown.js in every page, but editstyles.js only in the administration page.


    All scripts that you import end up in the global object of the HTML page. In practice,
    this means that if you define one variable in several script files, the last definition
    takes precedence. For instance, if dropdown.js and editstyles.js both contain
    a variable importantVariable, it gets the value defined in editstyles.js because
    it is the last script you imported.


    # E: Initialization


    Once you''ve imported your scripts, you need to make sure they start at the right
    moment. In order to explain the problems here, let''s take a detailed look at
    what happens when you include a script in an HTML page. We''ll start with a very
    simple example:


    ```

    <head>

    <script type="text/javascript" src="hello.js"></script>

    </head>

    ```


    ```

    // hello.js contains

    alert(''Hello world'');

    ```


    When the browser encounters the <script> tag, it sends out an HTTP request to
    fetch the script file. The parsing of the HTML page is now halted until the script
    file has been loaded, or until the browser decides it doesn''t want to wait any
    more (and the time at which it decides depends on the browser). Therefore, if
    you import scripts from a slow server, page rendering may be delayed.


    Once the script file has been received, it is parsed and the JavaScript statements
    are executed directly, if necessary. This means that the statement alert(''Hello
    world'') is executed as soon as the browser encounters it. Only after this has
    been done does the browser resume the normal HTML parsing.'
