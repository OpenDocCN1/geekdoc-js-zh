  md: '# C: Common operators


    Let''s review a few common operators.


    # Arithmetic operators


    The * operator, as you know, performs a multiplication. JavaScript also has the
    traditional - operator for subtraction and the / operator for division.


    JavaScript offers an elegant shorthand for all mathematical operators:


    ```

    c = c * a;

    a = 0;

    ```


    > JavaScript also contains the little-used modulo operator . This operator returns
    the remainder of a division:

    Now a is 1, because 5 modulo 2 is 1; after you''ve divided 5 by 2, 1 remains.'
