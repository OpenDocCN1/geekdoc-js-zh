  md: 'The location object also contains two methods: `reload()` and `replace()`.
    The function of `reload()` is obvious: it reloads the current page from the server,
    which is occasionally useful if you work with dynamic data.


    `replace()` commands the browser to replace the current page with the page on
    the URL specified in its argument:


    ```

    location.replace(''http://www.quirksmode.org'');

    ```


    Now the current page is replaced by QuirksMode.


    # href vs. replace()


    Although it may seem that `replace()` has exactly the same function as `href`,
    this is not the case. If you change the `location.href` of a page, the browser
    loads the new page as the user clicked on a link. The new page becomes a new entry
    in the window''s history.


    However, if you use `replace()`, the new page overwrites the old one in the window''s
    history. In 2F we discussed the circumstances in which this difference is important.


    # History


    The window contains a history object that gives limited access to its history.


    Every window remembers which it has shown and makes these pages available through
    the Back and Forward buttons of the browser. This list of URLs is stored in the
    History object. For privacy reasons, however, it is not possible to read this
    list, with the sole exception of its `length`. You can send the user backward
    and forward in this list, but you cannot know for sure which page he''ll end up
    in.


    The history object has three methods: `go()`, `back()`, and `forward()`. The last
    two methods mimic the Back and Forward buttons of the browser.'
