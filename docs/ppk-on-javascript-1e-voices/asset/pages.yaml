  md: '# Implicit variable declaration


    Using the var keyword is not required. If you start using a variable in your program
    without declaring it, JavaScript shrugs and creates it. This is called implicit
    variable declaration. An implicitly declared variable is always global in scope
    (see below).


    The following two examples are both correct JavaScript:


    ```

    var x = 10;

    var a = x * 2;

    alert(a);

    ```


    ```

    // b has never been used yet

    b = x * 2;

    alert(b);

    ```


    I do not use `var` to declare the variable b, but since I assign a value to it,
    JavaScript creates it automatically. Nonetheless, explicitly declaring your variable
    keeps your scripts clear and avoids scope issues, so I advise always to do it.


    # Variable scope


    Every variable has a scope: an ''area'' inside which the variable is known, but
    outside of which it is unreachable. There are two scopes: global and local.


    A global variable is defined throughout the JavaScript code (or, more correctly,
    throughout one global object) and can be used anywhere. A local variable is defined
    in only one function.


    > Note that JavaScript has no block scope, as C++ and Java do. Any local variable
    is known throughout the entire function in which it''s defined.'
