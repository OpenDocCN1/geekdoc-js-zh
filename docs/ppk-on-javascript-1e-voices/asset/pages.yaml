  md: '# A: Concepts


    Before we delve deeply into the DOM, let''s discuss a few general concepts.


    # Nodes


    To the W3C DOM, everything in an HTML document is a *node*. The entire document
    is a document node; every HTML tag, such as `<body>`, `<p>`, or even `<br />`,
    is an element node; and the texts contained in these elements are text nodes.
    Furthermore, HTML attributes like ID are attribute nodes, and even comments are
    comment nodes.


    # Node hierarchy


    Nodes have a hierarchical relationship to each other. Take this HTML snippet:


    ```

    <p>I am a JavaScript hacker.</p>

    ```


    The snippet contains two nodes: one element node for the `<p>` tag, and one text
    node that contains "I am a JavaScript hacker". Since the `<p>` node contains the
    text node, their relationship becomes parent (<p>) and child (text).


    In this hierarchical way, all nodes form a document tree. This tree starts at
    the document node itself and continues to branch out until it has reached all
    text nodes that reside at the lowest level of the tree.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_380_0.png)'
  merge: -1
  pgno: 380
- img_proc: true
  md: "Take this simple HTML page:\n\n```\n<html>\n<head>\n  <title>Hacking JavaScript</title>\n\
    </head>\n<body>\n  <h1>Hello world!</h1>\n  <p>I am a JavaScript hacker!</p>\n\
    </body>\n</html>\n```\n\nThe Level 1 DOM sees it as the following node tree:\n\
    \n![](img/1cdc3bc9be02360dab81df06bea3c619_381_0.png)\n\nFigure 8.1 The DOM treeview\
    \ of the HTML snippet.\n\n# Node types\n\nDocument, html, head, body, title, h1,\
    \ p, 'Hacking JavaScript', 'Hello world!', and 'I am a JavaScript hacker' are\
    \ all nodes. They're not all the same type of nodes, though. The document is a\
    \ document node, the three texts are nodes, and the six HTML tags are element\
    \ nodes."
  merge: -1
  pgno: 381
- img_proc: true
  md: 'The node type determines what you’re allowed to do with a node. For instance,
    text nodes cannot cannot contain other nodes, so, unlike element nodes, they have
    no child nodes. On the other hand, they have a few properties for reading out
    the text, which is something element nodes can’t do (and don’t need to do).


    # Family tree


    All these nodes have relationships to each other, and the DOM uses terminology
    borrowed from family trees to describe these relationships. Every node except
    for the document has a parent node. For instance, the parent node of the `<body>`
    element node is the `<html>` element node, and the parent node of ‘Hello world!’
    text node is the `<h1>` element node.


    Most elements have child nodes. For instance, the `<head>` node has one child
    node: the `<title>` node. In turn, the `<title>` node has a text as its child
    node.


    Some nodes are siblings because they share a parent. For instance, the `<h1>`
    and `<p>` nodes are siblings because they’re child nodes of the `<body>` node.


    Nodes can have descendants and ancestors. Descendants are all the nodes that are
    children of a node, or children of those children, etc. For instance, all text
    nodes are descendants of the `<html>` node, while the second and third text nodes
    are descendants of the `<body>` node.


    Ancestors are nodes that are parents of a node, or parents of this parent, etc.
    All text nodes have the `<html>` node as an ancestor, while the second and third
    text nodes have the `<body>` element as an ancestor.


    # Finding elements


    You can run up and down this family tree to find nodes. For instance, the `<h1>`
    node contains a property `parentNode` that refers to its parent: the `<body>`
    node.


    You can also directly find an element with a certain ID `getElementById()` or
