    hampered for reasons we''ll discuss in 2G.


    +   2. Form Validation works with the validation custom attribute (ie. an attribute
    that''s not a part of any (X)HTML specification). While writing Chapter 4, I noticed
    that in contrast to Usable Forms and Textarea Maxlength, which definitely need
    custom attributes, Form Validation'
