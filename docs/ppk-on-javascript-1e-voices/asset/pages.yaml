  md: '# toLowerCase() and toUpperCase()


    The methods toLowerCase() and toUpperCase() make a string wholly lower-case or
    wholly uppercase:


    ```

    var exampleString = ''I am a JavaScript hacker'';

    alert(exampleString.toLowerCase());

    alert(exampleString.toUpperCase());

    ```


    These alerts give you ''I am a JavaScript hacker'' and ''I AM A JAVASCRIPT HACKER'',
    respectively.


    These methods are occasionally useful when you compare strings. For instance,
    when you request the selectorText of a style rule (see 9D), some browsers return
    a lowercase string and others an uppercase.


    In Edit Style Sheet, I have to compare the returned selectorText with a string
    the user has chosen. Since I''m not certain either selectorText or the user string
    will be upper- or lowercase, I play it safe and convert both strings to lowercase
    before comparing them:


    [Edit Style Sheet, line 52]


    ```

    if (sheetRules[i].selectorText.toLowerCase()

    selector.toLowerCase())

    ```


    Of course, converting both to uppercase would work fine, too.


    # G: Working with booleans


    Boolean values are simple to work with, but by themselves they''re limited. Although
    you''ll occasionally use a variable with a boolean value, the most important use
    of the boolean data type is with the if statement.


    # Variables with boolean values


    A boolean value is either true or false. Variables commonly get a boolean value
    when they answer a Yes/No question like “Is this form valid?”. Take validForm
    from Form Validation:'
