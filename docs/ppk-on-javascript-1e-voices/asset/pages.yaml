  md: "# this or target?\n\nWhen do you use the this keyword and when do you use the\
    \ event target?\nThere are a few general rules, but there's also a lot of overlap,\
    \ especially when you have registered the event on the same element that will\
    \ be the event target.\n\n+   - In general, the this keyword is useful when you\
    \ register the same event handler on a lot of elements and/or when you want to\
    \ call the event handlers directly, i.e., without an event taking place.\n- In\
    \ general, the event target is useful when you rely on bubbling to take the event\
    \ upward in the document tree.\n\n# this example\n\nTakearea Maxlength. The script\
    \ registers event handlers on all textareas. We use the traditional model, so\
    \ this works as expected:\n\n[Textarea Max, lines 16-17]\n\n```\ntexareas[i].onkeyup\
    \ = textareas[i].onchange = checkMaxLength;\ntexareas[i].onkeyup();\n```\n\nWhen\
    \ the user changes the text in the textarea, checkMaxLength() is called.\nThis\
    \ function needs to know which textarea the user is currently editing—and it finds\
    \ it by the this keyword:\n\n[Textarea Max: lines 22-30]\n\n```\nfunction checkMaxLength()\
    \ {\n  var maxLength = this.getAttribute('maxLength');\n  var currentLength =\
    \ this.value.length;\n  if (currentLength > maxLength)\n    this.relatedElement.className\
    \ = 'toomuch';\n  else\n    this.relatedElement.className = '';\n    this.relatedElement.firstChild.nodeValue\
    \ = currentLength;\n}\n```"
