  md: '# CHAPTER 2: CONTEXT


    First, I included a message for noscript users that offered an extra mailto link
    to get in touch with the site owner. It''s correctly implemented: I hard-coded
    the message in HTML and then hid it by JavaScript, so that it is visible only
    if JavaScript is not supported. However, since the user can submit the form, this
    extra message was not really necessary and could confuse noscript users: “Do I
    use the mail link or the form?”


    The second mistake is that I plain forgot to include `<label>` tags, which are
    must for any accessible form.


    The third mistake is even more insidious: I coded the form fields next to the
    sandwich names in exactly the wrong way. I had two other options, of which would
    have resulted in better usability for the noscript page, but I chose the worst
    solution.


    The HTML of one sandwich `<tr>` looks like this:


    ```

    <tr>

    <td class="number">&lt;input /&gt;&lt;/td>

    <td class="description">English sandwich&lt;/td>

    <td class="extra">bacon, cheese, lettuce, tomato&lt;/td>

    <td class="empty">freshly fried&lt;/td>

    </tr>

    ```


    Note that the `<input>` tags all attributes. I did this deliberately, to keep
    the page easy to maintain. My client knew some basic HTML, and I trusted him to
    add a `<tr>` with new text for every sandwich to the document. I decided not to
    bother him with creating a unique name attribute for every `<input>`. Instead,
    I generated the necessary name by JavaScript.


    When the page is loaded, these `<input>` tags are not part of the `<form>`. When
