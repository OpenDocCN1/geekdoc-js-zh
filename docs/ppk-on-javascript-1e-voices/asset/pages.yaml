    One other property, navigator.cookieEnabled, is covered in 6G.


    # alert, confirm, and prompt


    The window object has three methods that cause dialog boxes to open: alert(),
    confirm(), and prompt(). The alert() method opens a dialog box with the argument
    as text. The confirm() method does the same, but gives the user an true (user
    clicked OK) or false (user clicked Cancel). The prompt() method allows the user
    to type in a string, and returns that string.


    Example:


    ```

    alert(''Do you have a name?'');

    var hasName = confirm(''Do you have a name?'');

    var name = prompt(''Do you have a name?'');

    ```


    ![](img/1cdc3bc9be02360dab81df06bea3c619_295_0.png)


    FIGURE 6.4

    Alert, confirm, and prompt dialog boxes.'
