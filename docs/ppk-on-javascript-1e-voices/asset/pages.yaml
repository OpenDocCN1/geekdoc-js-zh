  md: '# ppk on JavaScript


    Whether you''re an old-school scriper who needs to modernize your JavaScript skills
    or a standards-aware Web developer in search of best practices and code examples,
    you''ll welcome this guide from Peter-Paul Koch, the JavaScript master known as
    ppk.


    ppk begins by defining JavaScript''s purpose and context. Next he identifies tasks
    for which it''s best suited, discusses debugging, the arcane of the browser string,
    and tying the script in the HTML structure of your site. Then follows the meat
    of the book: chapters on the JavaScript Core language, the browser object model
    (BOM), event handling, the document object model (DOM), modifying CSS, and data
    retrieval. All these chapters contain theoretical instruction and take apart the
    relevant sections of the example scripts.


    Where other books teach JavaScript using sample scripts that have little value
    in professional practice, ppk on JavaScript takes you inside eight real-world
    scripts created for actual, paying clients. You''ll encounter useful scripts that:


