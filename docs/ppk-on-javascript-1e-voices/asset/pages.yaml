  md: '# Textarea Maxlength


    Obviously, Textarea Maxlength needs a key event. Whenever the user adds another
    character, the script checks if the maximum length has been exceeded. I chose
    the keyup event for several reasons:


    +   - It fires only once when the user releases the key, and therefore: my script
    is called only once per keystroke. In general, I like to call functions as infrequently
    as possible.

    - Since we don''t need to cancel the default action (i.e., prevent the pressed
    key''s character from being added to the textarea, we don''t need keypress.

    - We don''t need to know which key user pressed. (If we did, we wouldn''t be able
    to use keypress.)


    Nonetheless, the keyup event is not enough. Users might also paste text into the
    textarea without ever pressing a key. In that case, keyup wouldn''t fire. I also
    use the change event: if the user leaves the textarea and its content has changed,
    the script runs.


    So my event handlers become:


    ```

    textareas[i].onkeyup = textareas[i].onchange = maxLength;

    ```


    If the keyup or the change event occurs, maxLength() is executed. Neither are
    mouse events, so there shouldn''t be any problem accessibility-wise.


    Textarea Maxlength uses this keyword for targeting, which we already saw in 7F.
    There''s an extra complication, though: maxLength() should change the span element
    next to the textarea. This element is neither the target nor the event handler
    defined on, so neither this nor the target will point to.


    Instead, the script creates a reference to the span on the textarea:


    ```

    [Textarea Maxlength, line 15]

    ```


    ```

    textareas[i].relatedElement = [the span];

    ```


    Later on, maxLength() uses this reference. We discussed this trick in 4C.'
