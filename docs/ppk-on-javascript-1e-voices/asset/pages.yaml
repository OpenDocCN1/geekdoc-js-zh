    # D: Variables


    Variables are nothing more than useful containers to hold a value that''s going
    to be used and/or changed in your script. In fact, every script uses variables
    to store and manipulate data, and anyone who has even the least bit of JavaScript
    experience will intuitively use them correctly.


    # Variable names


    JavaScript variable names must consist of letters, numbers, underscores, and dollar
    signs. The first character may not be a number. Remember that JavaScript variable
    test is not the same as the variable Test.


    A custom in JavaScript development is to spell longer variable or function names
    in camelCase so they''re easier to read. The name starts with a lowercase character,
    but whenever a new "word" begins, you use an upper-case character. Sandwich Picker,
    for instance, uses the variable currentPrice instead of current_price.


    The W3C DOM uses the same system, for instance, getElementById or createElement.
    If you do the same with your variable names, you''ll get comfortable with the
    system quickly, and lessen your chances of making mistakes with inner capitals.'
