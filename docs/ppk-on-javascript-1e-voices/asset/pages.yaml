  md: '# Combining boolean operators


    You can combine these three operators to define quite complex boolean expressions.


    Let''s add a third example value:


    ```

    var x = true;

    var y = false;

    var z = false;

    ```


    Now let''s combine these variables and the three boolean operators:


    ```

    var a = x && (y || z);

    ```


    What''s a''s value? Start by swapping the values of x, y, and z:


    ```

    var a = true && (false || !false);

    ```


    Now resolve the NOT:


    ```

    var a = true && (false || true);

    ```


    Then resolve the part between parentheses (which, as usual, comes first). Since
    false true is true, we get:


    ```

    var a = true && true;

    ```


    Now you know that a is true.


    > BOOLEAN GENERATOR

    If you''re not used to working with boolean logic, it''s worth practicing. I have
    created a boolean generator that allows you to create and evaluate boolean expressions.
    You can find it at http://www.quirksmode.org/js/boolean.html.'
  merge: -1
