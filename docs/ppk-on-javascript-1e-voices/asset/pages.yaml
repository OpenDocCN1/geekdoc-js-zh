  md: '# Dealing with browser bugs


    Sometimes an error message will immediately reveal what''s wrong and why. Sometimes,
    though, even Mozilla''s errors don''t help you any further—you just don''t know
    what''s going on. Especially worrisome are the occasions when something is clearly
    wrong, yet no error appears.


    In all these cases you have to isolate the bug by hand. This generally involves
    three steps:


    +   1. If I''m not sure which function causes the bug, I turn off all functions
    in my script by inserting a return statement as its first line. Now the function
    doesn''t run any more, and if the bug also disappears I''m sure it''s caused by
    this function. Note, however, that if you find a bug-triggering function, you
    should still check all functions; the bug may be triggered by the combination
    of two functions.


    +   2. When I''ve found the offending function, I add alert statements to it.
    I put the alert after the first block of statements and test again. If the bug
    occurs, the lines above the alert are to blame; if the bug doesn''t occur I move
    the return or alert below the next logical block. Once I find the block that causes
    the error, I use the alert to further fine-tune my search and isolate a specific
    line.


    +   3. When I''ve successfully identified the browser bug I create a bug report,
    complete with this page.


    # Using alerts


    An alert statement stops the execution of the function it''s in, which gives you
    the chance to check if the bug has already occurred. Take the wrongly spelled
    ''test'' example we saw earlier. Assume that I haven''t spotted the missing ''t''
    and I''m still searching for the cause of the bug.


    ```

    var x = document.getElementById(''tes'');

    alert(x.nodeName);

    <div id="test"></div>

    ```'
