- img_proc: true
  md: 'message now becomes the string ''66 apples is what you ordered''. This may
    seem odd, since we just saw that concatenation is stronger than addition. But
    it''s the order of the variables and operators that here matters.


    JavaScript first encounters amount1 + amount2 and has to decide whether the means
    addition or concatenation. It looks at the two operands amount1 and amount2, sees
    that they''re both numbers, and therefore adds them, resulting in the number 66.


    Then it encounters the next +, which now means 66 + '' apples is what you ordered''.
    It looks at the operands, sees that one of them is a string, and interprets the
    + as concatenate. Therefore message becomes ''66 apples is what ordered''.


    As you see, JavaScript goes through + operators from left to right, and decides
    on an individual basis whether they mean add or concatenate. Therefore, the next
    example will not do what you want:


    ```

    var amount1 = 42;

    var amount2 = 24;

    var message = ''You ordered '' + amount1 + amount2 + '' apples'';

    ```


    When JavaScript encounters the ''You ordered '' + amount1 bit, it interprets the
    + as concatenation, since one of the operands is a string. This results in the
    string ''You ordered 42''. Since one of their operands is a string, the second
    and third + also concatenate, and the result becomes ''You ordered 4224 apples''.


    Fortunately, just as in mathematics, you can use parentheses () to say "Handle
    this operation first.", the solution is:


    ```

    var message = ''You ordered '' + (amount1 + amount2) + '' apples'';",

    ```


    JavaScript handles the (amount1 + amount2) operation first, and in this context
    + clearly means add, resulting in the number 66. Then it goes through the other
    + operators from left to right, and they clearly mean concatenate. Now message
    reads ''You ordered 66 apples''.'
  merge: -1
