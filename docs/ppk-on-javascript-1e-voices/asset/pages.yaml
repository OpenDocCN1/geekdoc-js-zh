    \ It works as follows:\n\n```\nfunction initializePage() {\n  var x = document.getElementById('test');\n\
    \  x.onclick = function () {alert('Hello world!');\n}\nwindow.onload = initializePage;\n\
    ```\n\nThis executes the initializePage() function when the page has been loaded\
