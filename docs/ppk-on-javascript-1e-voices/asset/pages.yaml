    \ another case but don't pay enough attention to the existing code:\n\n```\ncase\
    \ \"select-one\":\n  for (var j=0; j<relatedField.options.length; j++) {\n   \
    \ if (relatedField.options[j].value == styles[j]) {\n      relatedField.options[j].selected\
