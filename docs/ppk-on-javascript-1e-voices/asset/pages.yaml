  md: '# responseXML needs an XML document


    responseXML is available only when the returned document actually is XML, i.e.,
    when its MIME type proclaims it to be XML. That means that if you fetch an HTML
    page or a text file, responseXML is not available.


    However, if you make sure that your server sets the MIME type of HTML pages to
    text/xml, these pages are considered XML documents (provided they''re well-formed),
    and responseXML will be available.


    Unfortunately, if you serve all your HTML pages as text/xml, you''ll definitely
    encounter problems, since normal, non-XML requested HTML pages should be text/html
    in order for the browser to properly show them.


    Here is where setting the User-Agent header of the request to ''XMLHTTP'' can
    come in handy: a server-side script could send HTML pages as text/xml when it
    encounters this header, but as text/html otherwise.


    # getResponseHeader


    The getResponseHeader() method allows you to read out individual HTTP response
    headers. The syntax is as follows:


    ```

    var lastModified = req.getResponseHeader("Last-Modified");

    ```


    # getAllResponseHeaders


    The getAllResponseHeaders() method gives you a complete list of all HTTP response
    headers that the server sends back. The syntax is as follows:


    ```

    var allResponseHeaders = req.getAllResponseHeaders();

    ```


    # C: The response format


    An XMLHttpRequest allows you to retrieve any sort of data format from the server.
    In practice, most Web developers restrict themselves to XML, HTML,'
  merge: -1
  pgno: 505
- img_proc: true
  md: 'JSON (JavaScript Object Notation), CSV (comma-separated values), or another
    form of plain text.


    In this section we''ll discuss the advantages and disadvantages of all of these
    formats. I''ll use the return values of XMLHttpRequest as examples. The script
    expects XML, but it could easily be changed to accommodate JSON or CSV. HTML,
    as we''ll see, is much harder to use in this specific case.


    # XML


    Because of the name XMLHttpRequest, many developers select XML as their return
    format. There''s nothing wrong with that, but you should bear in mind that other
    formats are possible, and sometimes they''re more useful.


    The big advantages of XML are that most programmers know what it is, and that
    XML files can be read and used by a variety of programming languages. If you announce
    to other developers that you''re going to use XML they''ll nod wisely, while announcing
    any of the other formats may cause a few raised eyebrows and requests for further
    explanations. Socially, XML is the most acceptable format.


    What about its technical advantages and disadvantages? The most obvious advantage
    is that you can use nearly all W3C DOM methods and properties on an XML file—you
    don''t have to learn any new programming tricks.


    The disadvantage of XML is that both the server response and the script that interprets
    it can become verbose. You have to read out every interesting XML element separately,
    and you have to create every HTML element you need separately, too. This can make
    for quite lengthy scripts that become hard to read and maintain.


    # Example


    Let''s look at XMLHttpRequest Speed''s response:


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <wanadoo>

    ```'
