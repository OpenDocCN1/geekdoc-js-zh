  md: "# Return value\n\nEvery operator returns a value, and it's this value that\
    \ you want to do something with.\n\n```\nvar c = a * b;\n```\n\nIf we multiply\
    \ a by b, the operation returns the result of this multiplication. The operator\
    \ takes this return value and performs its own operation with it; it stores the\
    \ value in c.\n\n# Values\n\nGetting and using values is the whole point of programming.\
    \ Therefore we'll have to take a closer look at values in general. Take this line:\n\
