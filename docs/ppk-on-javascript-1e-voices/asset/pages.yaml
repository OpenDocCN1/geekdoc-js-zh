  md: '# SECTION D: SEPARATION OF BEHAVIOR AND PRESENTATION 41


    ![](img/1cdc3bc9be02360dab81df06bea3c619_70_0.png)


    The JavaScript events that are equivalent to the CSS selector are not mouseover
    and mouseout, the Microsoft proprietary mouseenter and mouseleave, which are available
    in Explorer but no other browser. See 7B.


    In addition, the CSS code continues to work when JavaScript is disabled. Unfortunately,
    this does not necessarily mean that the CSS variant is more accessible than the
    JavaScript one.


    Some people use a keyboard instead of a mouse. They use keystrokes (usually Tab)
    to focus on HTML elements (usually links), and then press Enter to activate the
    focused element. These keyboard users will not be able to use a CSS dropdown,
    since `li:hover` is a pure mouse selector that does not react to the keyboard
    focus. Besides, it''s impossible to focus on `<li>`—keyboard focus works only
    on links, buttons, and form fields.


    In contrast, the JavaScript can be made to accommodate keyboard users, as we''ll
    see in 7G. Therefore a CSS dropdown menu isn''t inherently more accessible than
    the JavaScript version. Keyboard users will vastly prefer the JavaScript version.


    In fact, both variants have their own problems, and from an accessibility standpoint
    neither is clearly superior. Accessibility alone doesn''t help us choose between
    CSS and JavaScript.


    Let''s take a high-level theoretical perspective. Are dropdown menus presentation
    or behavior? The effect takes place only after a user action, which would argue
    for it being a behavior. On the other hand, the effect is about presenting the
    submenus, which argues for it being presentational.


    Although I tend to lean towards the behavioral answer, the problem allows for
    more than one interpretation, and every Web developer should find his or her solution
    to this theoretical conundrum—or just ignore it.'
  merge: -1
