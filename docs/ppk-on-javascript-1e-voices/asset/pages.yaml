  md: '# lastModified


    The document.lastModified property contains the last modification date of the
    document, provided that the server adds it to the document headers. If the server
    doesn''t send this header, some browsers will decide the document was last modified
    today, while others maintain that it was last modified on 1 January 1970.


    If the server does send a last-modified date, you initially receive it as a string.
    This string is browser-dependent. Here are a few:


    ```

    01/22/2006 18:16:25 // Explorer Windows

    Sunday, January 22, 2006 18:16:25 // Mozilla

    Sun 22 2006 18:16:25 // Safari

    ```


    For this reason, among others, it''s best to convert the last-modified time to
    a date object:


    ```

    var lastModified = new Date(document.lastModified);

    ```


    # referrer


    The document.referrer property contains the referrer to the current page, i.e.,
    the URL of the page that brought the user to your page. If there is no such page,
    because the user typed in the URL or used a bookmark, document.referrer is empty.


    In general it''s not a good idea to rely on document.referrer for security, since
    it can be spoofed by malicious surfers.


    # domain


    The document.domain property allows you to circumvent the strictest part of JavaScript''s
    same-source policy. We already discussed its use in 1B.


    # write()


    The document.write() method allows you to write text to the page:


    ```

    document.write(''<h1>Hello world!</h1>'');

    ```'
