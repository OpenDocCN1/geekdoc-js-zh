    FIGURE 8.14 Browsers disagree sharply on the interpretation of the malformed HTML.


    The browser''s must solve the problem of the missing &lt;strong&gt; tag somehow.
    Each finds its own solution, and likely none of these solutions are what you want.
    Obviously, you should avoid this by making sure you always pass correct HTML to
    the innerHTML property.


    # Speed


    innerHTML is noticeably faster than pure DOM methods in the current browsers.
    When you append one or two children to an element, the speed difference isn''t
    really important; the user hardly distinguishes between, say, a 7- and 12-millisecond
    delay. However, once you start creating complicated structures like tables, using
    innerHTML instead of createElement()/appendChild() is a noticeable improvement.


    The speed difference between innerHTML and pure DOM methods goes from three times
    as fast (Mozilla, Opera) to thirty times as fast (Explorer).'
