    Dialog boxes contain plain text, not HTML.


    In 3E, we discussed the use of alert() in JavaScript debugging.


    confirm() and prompt() are rarely used, because, from a usability perspective,
    it''s better to have users enter information in form fields and then read it out
    than to confront them with potentially confusing extra boxes.


    # Timeouts and intervals


    Timeouts and intervals allow you to specify a bit of script that should be run
    after a certain time has elapsed. For instance:


    ```

    setTimeout(''myFunction()'',1000);

    ```


    Now the function myFunction() is executed 1000 milliseconds after the browser
    receives the setTimeout command. The two arguments this method requires:


    +   1. A string, which is evaluated (interpreted as a JavaScript command) when
    the timeout runs out.

    2. The waiting time in milliseconds.'
