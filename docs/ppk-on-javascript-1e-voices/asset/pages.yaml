    # focus and blur


    Each window has a method `focus()` and a method `blur()`. `focus()` brings the\window
    to the front of the stacking order; i.e., it becomes the uppermost win-

    dow on the user''s computer screen. The window also gains the keyboard focus;

    if you press Ctrl+R it''s the focused window that reloads. `blur()` does the oppo-

    site it hides the window behind the other windows.


    As we just saw, I also use `focus()` in Site Survey. When the window has been

    resized, I focus on it. Then I submit the form, so that the newly resized and

    focused window contains the start of the actual survey.


