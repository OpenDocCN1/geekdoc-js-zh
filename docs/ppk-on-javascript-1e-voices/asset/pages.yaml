  md: "# H: Dropdown Menu, mouseouts, and the related target\n\nDropdown Menu will\
    \ show you how to work with the mouseover and mouseout events, and will also show\
    \ you that the last event, especially, can cause a lot of trouble if you don't\
    \ use it correctly. We'll also discuss the relatedTarget toElement properties\
    \ that are vital to scripts that use mouse a lot.\n\nThe problem is that these\
    \ events can fire a lot of times when the user makes a small mouse movement, so\
    \ you have to manually distinguish between important and unimportant mouseovers\
    \ and mouseouts.\n\nBesides, neither the event target nor the this keyword is\
    \ worth much in mouseout events. They refer to the element the mouse moves out\
    \ of, and as we'll see, that's usually not interesting information.\n\n# Mouseover\n\
    \nLet's delve into Dropdown Menu's bowels a bit. As we saw, the script defines\
    \ general onmouseover and onmouseout event handlers for the entire menu, and relies\
    \ on event bubbling to get all the events that take place on its descendants:\n\
    \n```\n<ul class=\"menutree\">\n  <li><a href=\"#\">News</a>\n    <ul>\n     \
    \ <li><a href=\"#\">Press Releases</a>\n        <ul>\n          <li><a href=\"\
    #\">Release 1</a></li>\n          <li><a href=\"#\">Release 2</a></li>\n     \
    \     <li><a href=\"#\">Release 3</a></li>\n        </ul>\n      </li>\n    </ul>\n\
    \  </li>\n  etc.\n</ul>\n```"
