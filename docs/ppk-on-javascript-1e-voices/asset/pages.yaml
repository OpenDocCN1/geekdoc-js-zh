- img_proc: true
  md: "When we execute the method, an alert containing the number 4 pops up, just\
    \ as if we'd used normal variables and functions:\n\n```\ntest.c();\n```\n\n#\
    \ Object literals\n\nJavaScript also allows you to use an object literal instead\
    \ of how we did it in the previous code:\n\n```\nvar test = {\n  a: 2,\n  b: '2',\n\
    \  c: function () {\n    alert(test.a * test.b);\n  }\n}\n```\n\nExecuting test.c()\
    \ alerts 4, just as in the previous example. Note that the syntax of an object\
    \ literal is precise:\n\n```\n{\n  propertyName: propertyValue,\n  methodName:\
    \ function () {\n    // function body\n  },\n  propertyName: propertyValue //\
    \ note: no comma\n}\n```\n\nThe entire object literal is enclosed in curly braces,\
    \ and inside those braces all methods and properties are defined. First comes\
    \ the property name, then a colon, then the property value (which is a function),\
    \ followed by a comma. However, this comma is forbidden after the very last property\
    \ value.\n\nWe'll encounter a practical example of object literals in 10C."
