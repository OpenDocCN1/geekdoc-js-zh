  md: '# Accessibility and usability


    This brings us back to our starting point: any Web page should remain accessible
    when a browser does not support (sufficient) JavaScript. Before treating the practical
    accessibility of the example scripts, we first have to discuss a few general rules.


    We should carefully consider JavaScript''s purpose, which, as we saw in Chapter
    1, is the addition of an extra layer of usability to a Web site. As soon as JavaScript
    is disabled, a Web site''s usability will suffer—after all, an entire layer disappears.
    But the absence of this layer should not hamper the page''s basic accessibility.


    Take Usable Forms. When the script works, it makes sure that users will see certain
    fields only when they actually indicate they need them. The "Date of divorce"
    field will remain hidden until the user indicates he, in fact, divorced.


    When the script does not work, the user sees all form fields he may possibly need.
    From a usability perspective, this is obviously undesirable: the more fields the
    user sees, the more confused or irritated he becomes, and the more likely to decide
    not to bother with the form at all.


    Nonetheless, the page remains perfectly accessible, and I''ve done my duty as
    a Web developer. The user is able to fill out the form and submit it to the server,
    even if without myself script the process will become more time-consuming and
    confusing. The user might be less willing to fill out the form because it''s so
    huge and confusing, but that''s something we can''t help. When JavaScript is not
    supported, usability suffers.


    # Don''t restrict usability


    Accessibility should not restrict usability. If you have an excellent idea to
    increase your site''s usability that won''t work without JavaScript, use it—just
    make sure that it''s possible (not necessarily easy, just bare-bones possible)
    to use the page without it.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Perfect accessibility does *not* consist of offering exactly equal functionalities
    to script and noscript users. Sometimes that''s flat-out impossible, and at other
    times the attempt will backfire with a vengeance.


    For instance, let''s try to create the Usable Forms effect without JavaScript.
    You could serve a form without the optional fields first, let the user submit
    it to to the server, and send back an extended-form with the “Date of divorce”
    field when your server-side scripts notices the user has checked the “Divorced”
    radio-button. Technically, this could work.


    However, from a user-experience point of view, it is far worse than the noscript
    form we just studied. Although that form may be confusing and is certainly less
    usable than the scripted version, at least it doesn''t confront the user with
    extra downloads and fields at the moment he thinks he''s successfully submitted
    the form.


    In general, it''s better to accept the diminished usability of a noscript page
    than to try to work around it.


    # F: Rules of accessibility


    Although it''s nearly impossible to envision every situation that could hamper
    a scripted site''s usability, I have found a few rules that will help you get
    the basics right. Don''t treat them as the last word on JavaScript and accessibility.
    This is just set of rules that will prevent a few of the most common problems.
    No doubt they''ll be appended and amended by a next wave of thought and action,
    one or more of these rules will likely misfire in some situations.


    Always check these rules by applying your common sense.


    # Logical HTML


    The most obvious way of preserving accessibility in a scripted environment is
    to make sure that the plain HTML page contains all the bare-bones necessities
    for successful browsing.'
  merge: -1
  pgno: 80
- img_proc: true
  md: "Content, navigation, and important forms should all be hard-coded in your HTML.\
    \ Thus, whatever happens, any user will be able to access and use them.\n\nUsable\
    \ Forms is the prime example. When a browser doesn't support JavaScript, the form\
    \ is nonetheless accessible, because all form fields and labels are hard-coded\
    \ in the HTML. It's less usable, but as we've seen, that's inevitable.\n\n# Hard-coded\
    \ links have an href\n\nAny hard-coded link in your HTML should have an href attribute\
    \ that leads to a useful page or other file. Therefore this is wrong:\n\n```\n\
    <a href=\"#\" onclick=\"showPopup('niceimage.jpg')\">Nice image!</a>\n```\n\n\
    When a noscript user clicks on the link, nothing happens, and therefore the page\
    \ is inaccessible. In addition, we say in 2C that we shouldn't inline event handlers\
    \ anymore.\n\nInstead, an unobtrusive JavaScript does does this:\n\n```\n<a href=\"\
    niceimage.jpg\" id=\"nice\">Nice image!</a>\ndocument.getElementById('nice').onclick\
    \ = function () {\n  showPopup(this.href);\n}\n```\n\nNow a noscript user follows\
    \ the hard-coded href attribute, while a script user opens a popup. The site remains\
    \ accessible, and the behavior is separated from the structure.\n\n# Generating\
    \ content meant for script users\n\nIn some cases, generating content in JavaScript,makes\
    \ a site more accessible.\n\n# Links that trigger advanced scripts\n\nSuppose\
    \ you have a link that starts with a nifty Ajax script that fetches content and\
    \ does nice usable stuff, but that you don't have an HTML page for the link to\
    \ load to. As we've just seen, this is wrong:\n\n```\n<a href=\"#\" onclick=\"\
    startAjaxStuff()\">Commence coolness!</a>\n```"
  merge: -1
  pgno: 81
- img_proc: true
  md: 'We can''t just apply the previous rule, though. Which page are we going to
    put in the href attribute if there is no obvious noscript equivalent for the Ajax
    script?


    If adding an href to a link does not make sense, generate the link by JavaScript:


    ```

    var link = document.createElement(''a'');

    link.href = ''#'';

    link.onclick = startUpAjaxStuff();

    var linkText = document.createTextNode(''Commence coolness!'');

    link.appendChild(linkText);

    document.body.appendChild(link);

    ```


    Now a nos user does not see the link at all. That''s good, because it wouldn''t
    do anything if she clicked on it, and would just be confusing.


    The example script sets the link.href to ''#'', even though we saw that using
    ''#'' as a href is generally not a good idea. We need it, though: most browsers
    define a hyperlink as an a element with an href.


    Fortunately, the previous rule does not apply in this situation, since the link
    is not hard-coded in the HTML, but generated by JavaScript. We can be certain
    that the user will encounter this link only when her browser supports sufficient
    JavaScript to also run the onclick event handler. The href=''#'' is therefore
    allowed.


    # Hide content in JavaScript


    Hiding content is dangerous. In general, you hide content because you''ve decided
    the page becomes less usable when you don''t show everything immediately. You
    wait until the user clicks on a link or a header, and start up a script that shows
    the content.


    Without JavaScript, though, the content will never become visible, and the page
    is inaccessible. If you create a page that hides information until the user activates
    a script, you should always give the "hide content" commands in JavaScript, not
    in CSS.'
  merge: -1
  pgno: 82
- img_proc: true
  md: "For instance, Usable Forms initially hides all <tr>s that have a `rel` attribute.\
    \ This can be done in CSS, but it's flat-out wrong to do so:\n\n```\ntr[rel] {\n\
    \  display: none;\n}\n```\n\nIf a noscript visitor arrives at your page, he won't\
    \ see these <tr>s and has no way of making them visible. Therefore the page is\
    \ inaccessible.\n\nInstead, Usable Forms hides the <tr>s in JavaScript (in fact,\
    \ it removes them from the document entirely). If JavaScript is enabled, they\
    \ aren't hidden, and overall accessibility is preserved.\n\n# Redirecting your\
    \ users\n\nOccasionally, the best way to deal with an accessibility problem is\
    \ to create both a script and a noscript version of your site. Although I don't\
    \ like this solution and try to avoid it, it's nonetheless a trick that has proven\
    \ its value in practice.\n\nIf you use this approach, you should follow two rules.\
    \ First, the entrance page to your site should be the noscript page. Thus, all\
    \ browsers, even those that support nothing but HTML, will get a page they can\
    \ use.\n\nThen, once a browser has arrived at the noscript page, you start a script\
    \ that checks whether the browser supports your advanced scripts, and, if it does,\
    \ redirects them to the scripted page using the `replace()` method.\n\n```\n<head>\n\
    \  <title>Noscript page</title>\n  <script type=\"text/javascript\">\n    var\
    \ isSupported = [check JavaScript support];\n    if (isSupported) {\n      location.replace('scriptpage.html');\n\
    \    }\n  </script>\n</head>\n```"
  merge: -1
  pgno: 83
- img_proc: true
  md: 'Never ever use location.href in such situations. Using location.href creates
    a new entry in the browser''s history (which we''ll discuss fully in 6C). If the
    user arrives at the noscript page, she is redirected to the scripted page. Once
    she presses the Back button, however, she''s sent back to the noscript page, where
    the script promptly fires up and sends her back to the scripted page. The Back
    button is effectively broken—one of the worst usability sins in existence.


    ![](img/1cdc3bc9be02360dab81df06bea3c619_84_0.png)


    FIGURE 2.4 location.href creates a new entry in the browser''s history. If the
    user presses Back, she''s sent back to the noscript page, which sends her forward
    to the scripted page.


    location.replace() also loads a new page, but it overwrites the old page in the
    browser''s history. When the user presses Back, she''s sent to the previous page
    in the history—the one she was on before entering the noscript page. As far as
    the user is concerned, the Back button continues to function correctly.


    FIGURE 2.5 location.replace() overwrites the history entry of the previous page.
    If the user presses Back, the button works as expected.'
