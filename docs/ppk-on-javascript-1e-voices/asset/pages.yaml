    Do you still want to deny access to certain visitors based on browser strings?


    # userAgent


    The first rule of browser detection is to always use `navigator.userAgent`. Especially
    in older browsers, the value of this property may obey certain rules, though never
    officially defined, may give some clues to a browser''s identity. On the other
    hand, it may not.


    In contrast, all other properties of `navigator` are unreliable. You should assume
    that `navigator.appName`, `navigator.appVersion`, and their ilk all lie. (Why?
    To bypass browser detects, of course.)


    # Mozilla/


    As we saw, all browser identification strings start with ‘Mozilla/’ because that
    was the starting point of the arms race. The existence of this substring proves
    only that the browser has been released after 1994.


    # /version number]


    The slash is always followed by a version number, but unfortunately that, too,
    is useless. Every modern browser proclaims itself to be version 4 or 5 of the
    Mozilla code engine.'
