  md: "Namely, some feel that private functions are “implementation details,” and\
    \ do not require tests. If we accept premise, then ideally we can hide most of\
    \ our functionality in private functions and less code exposed that we need to\
    \ test. Fewer tests can mean less maintenance. Additionally, we can clearly separate\
    \ our “public interface” from the rest of the code, which means anyone using our\
    \ code can still benefit when learning or referencing a small part of it.\n\n\
    So how we create private functions? Pretending we don't know anything for a minute,\
    \ we could do this:\n\n```\nfunction(){\n  console.log('hi');\n}\n```\n\nor this:\n\
    \n```\nfunction(){\n  (function(){\n    console.log('hi');\n  })();\n}\n```\n\n\
    Here we have some anonymous functions. They are created, and then disappear. Any\
    \ this we put inside will link back to the top-level context. Since they're anonymous,\
    \ all we can do is run when we tell them to. Even if we know the this for anonymous\
    \ functions, we can't run them (except right away or as a callback), because they\
    \ don't have a name and cannot be addressed. Incidentally, they are called immediately\
    \ invoked function expressions (IIFES), and we'll talk about them more in Chapter\
    \ 7.\n\nWe'll explore a few more useful types of private functions in a minute,\
    \ but first we have a new piece to add to our diagrams (see Figure 5-17). The\
    \ diagrams for the preceding functions are the same (except for the lines of code,\
    \ which you might argue is five rather than three for the second one).\n\n![](img/25446dec1fb455dfb6ac99424735816c_135_0.png)\n\
    \nFigure 5-17. A “private” anonymous function"
