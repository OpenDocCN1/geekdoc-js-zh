  md: "const does not mean immutability!\n\nIf you are thinking that const provides\
    \ an easy path to immutability, I'm sorry to report some sad news. It prevents\
    \ a variable from being reassigned (i.e., through the = operator), but the contents\
    \ of the variable can still change. Array indexes can be updated. The same goes\
    \ for object attributes and maps and sets.\n\nObject.freeze to the rescue!? Almost.\
    \ If you freeze an object that is more than one level depth, you can update those\
    \ inner properties. Also, even if you freeze an object, it was declared var or\
    \ let, you can still reassign.\n\nTo ensure immutability, you'll need to go further,\
    \ and might find it easier to use a packed solution like Immutable.js to provide\
    \ immutable versions of arrays, maps, sets, and so on. Even if you're not using\
    \ anything that enforces it, it's best to create new variables without repurposing\
    \ them.\n\nIn general, it is preferable to use const. The less that your variables\
    \ are reassigned, better.\n\nSince we have tests in place, we can make the bold\
    \ assumption that all of our var declarations should be considered instead. Search\
    \ and replace them, and then run the tests. You'll get an error:\n\nTypeError:\
    \ Assignment to constant variable.\n\nThe error description \"constant variable\"\
    \ is worth noting as an odd oxymoron, let's move on. Unsurprisingly, our bold\
    \ assumption is wrong, but only in one case. Our first variable inside the classify\
    \ function requires reassignment for now, so the following line should be modified\
    \ to use let\n\n```\nconst first = classifier.labelProbabilities.get(difficulty)\
    \ + \nsmooth;\n```\n\nIt should be:\n\n```\nlet first = classifier.labelProbabilities.get(difficulty)\
    \ + \nsmooth;\n```\n\nAll the rest of the const declarations are fine, and we're\
    \ free to move on.\n\n# Bringing classify into the classifier\n\nWith a few changes,\
    \ the variable first doesn't have to be reassigned, Initially, it is meant to\
    \ reflect the likelihood of a difficulty appearing relative to other difficulties.\
    \ Later, it is multiplied by the likelihood of a chord existing in a song of given\
    \ difficulty.\n\n![](img/25446dec1fb455dfb6ac99424735816c_221_0.png)"
