  md: "```\nconst test = require('tape');\ntest('base dog price', assert) => {\n \
    \ assert.equal(new Dog).displayPrice(), 'The dog costs $50.');\n  assert.end();\n\
    });\n```\n\n# This is not the same assert as before\n\ntape has the same callback\
    \ parameter that has an assertion syntax built in. It's also responsible for ending\
    \ the test and counting the test cases. If we use a different assertion library\
    \ in tape, we have to add an extra assert.pass() line, which is as:\n\n```\nconst\
    \ test = require('tape');\nconst wish = require('wish');\ntest('base dog price',\
    \ (assert) => {\n  wish(new Dog).displayPrice() === 'The dog costs $50.';\n  assert.pass();\n\
    \  assert.end();\n});\n```\n\nIf we don't add that line, the tests won't fail,\
    \ but won't count them as passing, or even tests(!), in its output. We'll stick\
    \ with tape's assert in this chapter.\n\nThe decorator is useful in a couple of\
    \ cases. First, it's good if we're pulling the dog class in a module we don't\
    \ own and don't want to (or can't) manipulate it directly. Second, it's good to\
    \ keep us from a sprawling mess of subclasses. To illustrate that second point,\
    \ consider if our price was based on whether the dog was cute, trained, robotic,\
    \ or a show dog. All of those traits could affect the price, but they are not\
    \ mutually exclusive, so comprehensive subclassing would have to collect every\
    \ attribute (e.g., class FriendlyNotCuteTrainedNonRoboticNonShowDog extends).\n\
    \nTo decorate the dog with a particular trait, we can add a factory function that\
    \ takes a dog input:\n\n```\nfunction cuteDog(dog) {\n  const cuteDog = Object.create(dog);\n\
    cuteDog.cost = dog.cost + 20;\n  return cuteDog;\n};\n```\n\n```\ntest('cute dog\
    \ price', (assert) => {\n  assert.equal((new Dog)).displayPrice(), 'The dog costs\
    \ $70.');\n  assert.end();\n});\n```"
