  md: '# Whitespace


    The whitespace in our code seems okay for the most part. Before the classify function,
    there are three blank lines, two of which can and be deleted. Beyond blank lines,
    you may see trailing whitespace at the end of a line (EOL). This shows up in a
    different (and usually distracting) color in some editors, and doesn''t in others.
    How much do you dislike this trailing, meaningless whitespace probably has to
    do with what editor (and settings for editor) you use. You should feel free to
    delete it in many cases, but it will make your git diff (the set of changes to
    a project) much larger, a distraction of a different type.


    Another, somewhat editor-specific, whitespace instance comes from a blank line
    at the end of a file (EOF). Generally, this seems like a good idea (i.e., it follows
    the IEEE POSIX standard for what "file"), but can lead to version control/conflicts
    if two developers have different editors or personal preferences (as in the previous
    paragraph).


    # Do-Nothing Code


    Moving on to do-nothing code, we have an example of this in our file. The conditional
    check that follows an unnecessary part:


    ```

    if(!Object.keys(labelCounts).includes(label)){

    ```


    Specifically, the !! can go away, leaving:


    ```

    if(Object.keys(labelCounts).includes(label)){

    ```


    Make that change and save/run/check.commit.

    Since the includes function already returns a boolean, there is no need to use
    !! to cast it to one. If you''re wondering how this works, a unary ! returns the
    inverted "truthiness" of a value. You can try these in a console if you''re curious:


    ```

    !true // returns false

    !!true // returns true

    !![] // returns true

    !!0 // returns false

    ```


    A second reason is that !! is unnecessary here, although explicitly setting a
    boolean might make sense, for any value that is tested in an if statement, you
    can expect the if branch to be followed for true (and for false) values without
    explicitly coercing the boolean. So the following snippet would print "hi," because
    nonempty strings are "truthy" in JavaScript.


    ```

    if("print hi") {console.log(''hi'')}

    ```'
