    \ {\n  var smoothing = 1.01;\n  console.log(labelProbabilities);\n  var classified\
    \ = {};\n  Object.keys(labelProbabilities).forEach(function(difficulty) {\n  \
    \  var first = labelProbabilities[difficulty] + smoothing;\n    chords.forEach(function(chord)\
    \ {\n      var probabilityOfChordInLabel =\n        probabilityOfChordsInLabels[difficulty][chord]\n\
    ......\n```\n\nIf you want to move classified = {}; use the console.log, go for\
    \ it. Otherwise, we're all set.\n\nSince anonymous functions also create scopes,\
    \ first is declared at the top of its function scope. Before, when we introduced\
    \ the smoothing variable (as a solution to the “magic number” problem), we happened\
    \ to put it into the hoisted position.\n\n# Function Hoisting\n\nBefore leaving\
    \ the topic of hoisting, it's worth noting that there is a difference between\
    \ the following two declarations:\n\n```\nfunction myCoolFunction();\n//and\n\
    var myCoolFunction = function();\n```\n\nThe first one (the style of declaration\
    \ we're using in this classifier) is hoisted to the top of its function scope,\
    \ and because this is declared at the top level, that means the top of the file.\
    \ The whole function is hoisted to the top. That means that if you want to run\
    \ the function, there's nothing stopping you:"
