    # Callbacks and Testing


    From the last section, we have a new approach to fixing the pyramid of doom, but
    it doesn''t get us out of callback hell. In fact, by naming and extracting functions,
    we may actually reduce the clarity of the code in some cases. Rather than callbacks
    being nested, they could be spread across the file or multiple files.


    Creating an object with keeping callbacks somewhat organized, but that isn''t
    our only option. Part of what led us to that solution was the utility of having
    a container to store our side effect array. We had to do some aggregation based
    on the streaming/event-emitting nature of http library and our desire to print
    the entire HTML body at once. If we were adding to a page or saving a file, we
    might consider allowing the file or DOM to be the aggregate itself, and just pass
    the results of the stream to getting them into an intermediate form (the array).


    We''ve seen that passing a (callback) function into another function is useful
    for asynchronous programming, but it completely changes how weve been working
    in the earlier parts of this book. Instead of returning something valuable and
    acting on it, we''re letting the inner function call the shots (and its inner
    function and its inner function)! This is a property of continuation passing style
    (CPS) called inversion of control (IoC), and while useful, it has some drawbacks:


    +   * It''s confusing. You have to think backward until you get it.

    * It makes function signatures complex. Instead of function parameters acting
    as "inputs," they may be responsible for outputs as well.

    * Callback hell and the pyramid of doom are both likely without organizing code
    into objects or other high-level containers.

    * Error handling is more complicated.


    Additionally, asynchronous code is hard:


    +   * It makes testing more difficult (although part of this is the nature of
    asynchronous programming).

    * It''s hard to mix with synchronous code.

    * Return values are likely no longer important throughout the sequence of callbacks.
    This makes us rely on testing of callback arguments to determine mediate values.'
