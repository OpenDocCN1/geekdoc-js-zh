  md: "# Why Don’t We Care About Details of Implementation?\n\nLet's say we have a\
    \ simple function that multiplies numbers by 2:\n\n```\nfunction byTwo(number)\
    \ {\n  return number * 2;\n}\n```\n\nWe could instead write a function that accomplishes\
    \ the same goal in a slightly differ- ent way:\n\n```\nfunction byTwo(number)\
    \ {\n  return number << 1;\n}\n```\n\nAnd either of these work fine for many applications.\
    \ Any tests that we used for the byTwo function would basically just be a mapping\
    \ between an input number, and an output number that is twice the value. But most\
    \ of time, we are more interested in the results, rather whether the * or << operator\
    \ is used. We can think of this as an implementation detail. Although you could\
    \ think of implementation details like this as behavior, it is insignificant if\
    \ we all care about the input and output of a function.\n\nIf we happened to use\
    \ the second version of byTwo for some reason, we might find that it breaks when\
    \ our number argument gets too large (try it with a trillion: 1000000000000 <<\
    \ 1). Does this mean we suddenly care about this implementation detail?\n\nNo.\
    \ We care that our output is broken. This means that our test suite needs to include\
    \ more cases than we initially thought. And we can happily swap this implementation\
    \ out for one that satisfies all of our test cases; whether that return number\
    \ * 2 or return number + number is not our main concern.\n\nWe changed the implementation\
    \ details, but not we care about. What we care about is also what we test (either\
    \ manually or in an automated-way). Testing the specifics is not unnecessary in\
    \ many cases, but it will also result in a codebase that we can refactor for:\n\
    \n# Testing TypeScript Itself\n\nIf you are testing extremely specific implementation\
    \ details, you will at some point no longer be testing your program, but rather\
    \ the environment itself. We'll go over testing in later detail, but for now,\
    \ you can run either in a node console or by saving it to a file and running node\
    \ file_name.js. That said, it's not critical to do so at this point.\n\nLet's\
    \ say you're testing something like this:"
  merge: -1
