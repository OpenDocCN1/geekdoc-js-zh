  md: "# When did we apply the template method pattern?\n\nIn case it's unclear, it\
    \ was in this last step of moving the log function from the subclasses into Person.\
    \ The template method is really simple, so you might accidentally stumble into\
    \ it just by moving functions around objects. It is a specialized form of what\
    \ is sometimes called the \"pull-up method\" of refactoring,functions (or methods,\
    \ depending on the context) are brought into the superclass. What makes the template\
    \ method pattern is that of the implementation (in this case, the whatIs function)\
    \ creates variation from the subclasses.\n\n![](img/25446dec1fb455dfb6ac99424735816c_308_0.png)\n\
    \n# Functional Variant\n\nFor a function as basic as ours, you might wonder if\
    \ it justifies the superclass. We could also have done this:\n\n```\nfunction\
    \ log(person, number){\n  console.log(person.isNumber(number));\n}\nclass BinaryKnower{isNumber(number){\
    \ return Number('Ob' + number) };\nclass BinaryOblivious{isNumber(number){ return\
    \ Number(number) };\nconst person = new BinaryKnower();\nconst personTwo = new\
    \ BinaryOblivious();\n[person,personTwo].forEach(person => { log(person, 10) });\n\
    ```\n\nNow we're passing explicit arguments to the function, and must explicitly\
    \ reference the person object rather than this. In the previous code snippet,\
    \ we had one implicit parameter and one explicit one. You might prefer either\
    \ approach, but making a choice is important, as you'll likely to have one dominant\
    \ style in the codebase. Objects help group and namespace functions, but there\
    \ is additional complexity in sharing functions objects.\n\nIf you're tending\
    \ toward an object-oriented codebase, what we had before is preferable. If your\
    \ codebase is intended to be functional, you would want to keep the scope of the\
    \ function small (likely through creating modules) in order to prevent name collisions.\
    \ Additionally, you might want to identify if BinaryKnower and BinaryOblivious\
    \ classes are needed. It is easy to make the case against them if they only contain\
    \ one function\n\n```\nfunction log(fun, number){\n  console.log(fun(number));\n\
    }\nfunction whatIsInBinary(number){return Number('Ob' + number) };\nfunction whatIs(number){return\
    \ number};\n\n[whatIsInBinary, whatIs].forEach(fun => { log(fun, 10) });\n```\n\
    \nTemplate Method | 283"
