    \ of your function:\n\n```\nfunction addone(addend){\n  console.log(add + 1);\n\
    }\naddone(2);\n```\n\nAnd when we use callbacks to the same thing:\n\n```\nfunction\
    \ two(callback){\n  callback(2);\n}\ntwo((addend) => console.log(add + 1));\n\
    ```\n\nThe weight of the algorithm is now in the callback, rather than the two\
    \ function, which merely gives up control and passes a 2 to the callback. As we\
    \ have done before, we can name and extract the anonymous function, giving us\
    \ this:\n\n```\nfunction two(callback){\n  callback(2);\n}\nfunction addone(addend){\n\
    \  console.log(add + 1);\n}\ntwo(addone);\n```\n\nThe value of the calling function\
    \ (two) is that it supplies a variable to the callback. In this case, that is\
    \ all it does. If the two function needed its value to come from some longer-running\
