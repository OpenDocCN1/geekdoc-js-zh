  md: '3. Once everything in our outer cycle test is green, we''re free to refactor
    the outer cycle as we see fit. And we have two levels of testing to ensure our
    code continues to behave.


    For the purposes of refactoring, using a methodology like BDD doesn''t really
    matter. What matters that you have good coverage in your code, preferably from
    unit tests and end-to-end tests. If those were created in a "test first" via TDD
    or BDD, that''s fine. But the aspect of testing from the end users'' perspective
    through BDD is not critical. It''s possible to create high-level tests with good
    coverage that don''t test from this perspective and aren''t written before the
    implementation code.


    # Quality Processes as Team and Personal Branding


    You will often see development methodologies and quality-enhancing techniques
    as social proof. Job seekers add them to their résumé, hiring pages display them
    on job listings, and top consultancies build their brands around them.


    Although day-to-day there may a focus on "getting things done" (potentially to
    the detriment of quality), being comfortable with these techniques and tools means
    access to better employment opportunities, be they with companies or clients.


    # Tools for Quality


    Moving on to tools for testing...this could be a book unto itself. Though individual
    frameworks and tools rise and fall in popularity, knowing what types of tools
    are available remain useful. Sometimes, GitHub or npm stars are a good proxy for
    quality and popularity: Searching for "js <tooltip>" (e.g., "jest coverage") with
    your preferred search engine usually returns results. It''s best to learn one
    or two versions of each of these tools well, with JavaScript''s open source package
    development being as expansive as it is, be prepared to frequently adapt to new
    similar tools.


    # Version control


    Before any other tool is mentioned (in case you missed it in Chapter 1), it is
    critical that your project is under version control, preferably with backups elsewhere
    than just your computer. If lack of testing should produce skepticism rather than
    confidence, lack of version control, with a backup online (as of this writing,
    Git + GitHub is recommended), ensures your code doesn''t completely disappear.
    No amount of quality in the code matters if it can just get wiped out. Additionally,
    many of the tools covered here rely on versioned software for integration and
    to demonstrate progress.'
