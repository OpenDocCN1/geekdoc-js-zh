  md: '# Mutation Testing


    If you''re interested in other possibilities using dynamic analysis, which coverage
    tools make use of, you might want to check out mutation testing.


    This topic can run a bit deep, but basically a tool runs your test suite with
    a mutated codebase (most easily by changing tests, e.g., a string input where
    a boolean is expected) and fails when your tests pass in spite of the mutated
    code.


    This can allow you to look for cases where tests don''t actually require the code
    to be as it is. That may mean that the code is not exercised, but it could also
    mean that the normal input is meaningless in the context of the test. For example,
    if a parameter to a function is used in a way that is so general that various
    mutated inputs would work just as well, it suggests that even if coverage shows
    a line of code being run, the code is not sufficiently case. Exercised. At best,
    you might just be relying on type coercion in JavaScript''s code.


    Two warnings apply here. First, mutation testing relies on multiple variations
    on your normal test, so it will be slow. Second, it may break your code in unexpected
    ways and complicate the teardown phase of your test—for, by doing anything from
    leaving your test database in an unexpected state to actually changing the code
    in your files. Check your code into version control and back up your data before
    you run something this aggressive and unpredictable.


    # Style checkers,all linters


    Most quality tools don''t require dynamic analysis. They can inspect files without
    executing the code to look for many types of errors or stylistic violations. These
    checks are sometimes run locally as discrete scripts or online services after
    code is committed to a shared repository. For a tighter feedback loop, these checks
    can be integrated into a programmer''s IDE or editor. You can''t do better than
    getting notifications of mistakes immediately after you write them. Sometimes
    these are called linters. At best, these style checkers you have in place serve
    as an executable style guide.


    # Debuggers/loggers


    Sometimes, during a spike (writing exploratory, temporary code without testing),
    a tricky test case, or a manual test, it may be unclear what values variables
    have, what functions are outputting, or whether a certain section of code is running.
    In these cases, debuggers and loggers are your friends. At the point in the file
    where the confusion lies, either in your test or your implementation code, you
    can add a logging statement or a debugging breakpoint. Logging will give you the
    answer you need (e.g., “this function was reached” or "this file was loaded"),
    but debuggers'
