    Second, although these variables happen to be in the expected scopes, having variables
    that are not unique creates a risk of overwriting each other. What makes this
    worse is that this might be expected or relied-upon behavior, so we don''t know
    ahead of time changing one of these variable names, will introduce a bug.


    The third and worst thing about these names is that they give no information about
    what is inside. It is somewhat conventional (though a bad concession, as described)
    to use i and j as indices of loops. In those cases, the names index and innerIndex
    are more appropriate when the variables represent numerical keys. Change to index
    in the train function (there should be five of them). Save, check, and commit.


    # Alternative Opinion: Descriptive Variable Names Bad Code


    This is a nuanced view, and doesn''t apply to an easily avoidable style in JavaScript,
    in some languages (including some that compile to JavaScript), it is possible
    to specify much about a program through its type system. In those cases, descriptive
    variable names actually detract from the clarity of the possibilities provided
    by the type signatures of functions.


    To illustrate the point, imagine we have a function that we know takes a list/array
    of somethings as input and returns one as output. We describe these somethings
    as "numbers" or "strings" or another "type" as it applies to our case, but if
    we use the type system to transform a list of them into just one, we might prefer
    not to describe what kind of something it is. In those cases, prefer to use an
    x, y, a, or b, rather than a longer "descriptive" name that does nothing to the
    important part (e.g., the transformation from the list of somethings into just
    one something).


    We''ll get into functional programming in Chapter 11, but even in a functional
    context, you might not find single-letter descriptors compelling. That''s okay.
    In this book, we try to avoid that style, but it''s worth understanding the justification
    for the contrarian view on this.


    When we apply the pattern of thinking of i and j as indices for an argument in
    a forEach function, then we''ve really obscured their values. In the setCountsIn
    Labels function, i should actually be some (eight replacements), and each instance
    of j in that function should be chord (five replacements).'
