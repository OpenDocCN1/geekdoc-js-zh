  md: "Whoa. Okay, so this might look a little crazy, but there are only a few complications\
    \ here, and this should help you if you're wondering what part of the red/red/green/refactor\
    \ cycle you are in.\n\nStarting at the top left, we write a failing test, which\
    \ puts us in a red state. We have three possibilities from there (one failing\
    \ test). We could follow the arrow to the right (top-middle red state) and write\
    \ another failing (then we would have two). Or, if possible, we could follow the\
    \ long arrow down to the green state (implement the test). The most complicated\
    \ possibility exists when we can't implement the test to make it pass right. In\
    \ this case, we follow the short arrow down, where we meet another cycle just\
    \ like this one. Assume we're stuck for now, but we're always free to create new\
    \ failing tests in this cycle that we've initiated.\n\nIf any tests (at any level)\
    \ are in the green state in the middle, we can do one of two things: either refactor,\
    \ or call it and finish this test and code complete (leave the cycle). When we\
    \ start refactoring, we can either keep refactoring or finish this test and code\
    \ complete (leave the cycle).\n\nWhen all the tests are complete, the arrows can\
    \ all leave the cycle. If we're in an inner cycle, that we move into the green\
    \ phase of the outer cycle. If we're in the outer cycle, and we can't think of\
    \ any more tests to write (no more reds on top to the top row), then we're done.\n\
    \nOne subtlety in this process worth noting is that creating a new test after\
    \ a green test is only recommended after you have at least considered a refactoring\
    \ phase. If you move on right, there is no clear indication that more work is\
    \ to be done. By contrast, if you have just refactored something, you're free\
    \ to move on. Similarly, if you have written a failing test (red state), then\
    \ if you write another test case, your test framework will still let you know\
    \ that there is more work to be done on the first one, so you won't get lost there.\n\
    \nMoving from the diagram, here is a concrete example of a TDD cycle containing\
    \ another TDD cycle:\n\n+   1. Failing (red) high-level test is written: \"A customer\
    \ can log in.\"\n a. Failing low-level test is written: \"Route '/login' returns\
    \ 200 response.\"\n b. Routing code is written to pass the low-level test. We\
    \ can refactor this code written on the inner cycle.\n c. The high-level test\
    \ is still failing, so a new failing low-level test is written: \"The form post\
    \ route at '/login_post' should redirect to '/' for valid email and pass-word.\"\
    \n d. Code is written to handle successfully posting the email/password and returning\
    \ the logged-in home page. This inner cycle test is passing, so we can refactor\
