  md: "itself. They argue that it promotes bad practices like tight coupling of components,\
    \ and encourages deep hierarchies and mutable state.\n\nThe class keyword is a\
    \ hard blow to those who have been advocates for avoiding class-based OOP in JavaScript\
    \ for a long time.\n\nOn the pro side of things, people have always struggled\
    \ awkwardly to feel JavaScript to behave this way. If it is what Douglas Crockford\
    \ calls a “footgun”, then the very least, condemning and standardizing the “footwounds”\
    \ makes problems easier to search for and find. There’s some degree of herd immunity\
    \ if we’re all suffering from the same disease.\n\nAlso on the pro side, as features\
    \ grow around classes, richer APIs become available for reflection and inspecting\
    \ your code. For example, error messages can be more detailed by default.\n\n\
    Additionally, having a sanctioned standard for something that makes it easier\
    \ to learn (adapting the spec as necessary), rather than chasing the latest and\
    \ greatest way avoid messy “syntactic sugar” for constructor functions.\n\nThe\
    \ criticisms of classical OOP itself should be taken very seriously, however.\
    \ A deeply nested hierarchy will be difficult to debug and maintain. Critics are\
    \ not wrong to say that the extends encourages a deep hierarchy (e.g., class Dog\
    \ extends Animal extends Organ), but it does not necessarily demand it. They are\
    \ not wrong to feel that parent/child classes need to be tightly coupled.\n\n\
    # What About Multiple Inheritance?\n\nWhen people discuss multiple inheritance,\
    \ they mean a child class inheriting from multiple parents. If we had a clean\
    \ solution for this in JavaScript, it would probably mean allowing for extends\
    \ to take multiple base classes as parents.\n\nAlthough this type of mechanism\
    \ is supported in some languages (Python, for example), it can create some confusion.\
    \ If class A gets all its properties from classes B and C, how does it resolve\
    \ conflicts when a property exists in both parents? It depends on the language.\n\
    \nIf JavaScript had a class-based mechanism for multiple inheritance, it might\
    \ look like this:\n\n```\nclass Barky{\n  bark() { console.log('woof woof'); }\n\
    }\nclass Bitey{\n  bark() { console.log('grrr'); }\n  bite() { console.log('real\
