  md: 'The focus here is entirely on the practical concern we''ve had all along: building
    confidence through developing and maintaining the interfaces of our code. To that
    end, we''ll be covering five main topics:


    +   - The restrictions and benefits of functional programming

    - The basics of FP

    - More basics of FP

    - Burritos

    - Moving from OOP to FP


    # The Restrictions and Benefits of Functional Programming


    Generally speaking, programming within a functional paradigm requires a bit more
    structure than a typical JavaScript programmer might be used to. With that structure
    come certain guarantees and challenges. In this section, we''ll explore some of
    the basic trade-offs in attempting a functional style.


    # Restrictions


    Here''s a common piece of code that is often trotted out to denigrate programming
    in a nonfunctional style:


    ```

    x = 1;

    x = x + 1;

    ```


    That''s it seems pretty innocent, but there are many problems here. Many JavaScript
    programmers would be fine with this. Some would be bothered by the first assignment
    not being preceded by a var to scope it within a function. Other people would
    want a let to scope at the block level. As we''ve discussed earlier in the book,
    what we really want here is a const, which would prevent the reassignment on the
    second line. On a chalkboard in a math class, this would look especially ludicrous.


    We covered earlier how reassignment makes programs more complicated to deal with.
    With reassignment goes a bit deeper than the strictly practical.


    If we were thinking of both of these statements as mathematical facts, is x equal
    to 1 or does x equal 1 + 1? Apparently it depends on where you are in the program,
    right? So we can''t look at these statements as facts anymore. We have variable
    assignments instead of facts (values in functional terms). Values shouldn''t change.
    When they do, our programs look less like math and more like sequences of instructions.


    Okay, so we should be able to solve anyone''s objections like this, right?


    ```

    const x = 1

    const y = x + 1

    ```'
