  md: "# Factory Functions\n\nThe object literal option might seem pretty good as\
    \ far as simplicity goes, but if we're creating a lot of words, it might be clunky\
    \ compared to using the new keyword with either class or a constructor function.\
    \ We'll explore one more alternative now.\n\nWe can use factory functions like\
    \ this:\n\n```\nconst word = {\n  count(){\n    return this.word.length;\n  },\n\
    \  lookupUrl(){\n    return this.lookupUrl + this.word;\n  }\n}\nconst englishFactory\
    \ = (word) => {\n  return Object.create(word,\n    word: word,\n    language:\
    \ 'English',\n    lookupUrl: 'https://en.wiktionary.org/wiki/'\n  });\n};\n```\n\
    \n```\nconst japaneseFactory = (word) => {\n  return Object.create(word,\n   \
    \ word: word,\n    language: 'Japanese',\n    lookupUrl: 'http://jisho.org/search/'\n\
    \  });\n};\n```\n\n```\nconst englishWord = englishFactory('dog');\nconst japaneseWord\
    \ = japaneseFactory('犬');\n```\n\n```\n// interfaces tests\nwish(japaneseWord.word\
    \ === \"犬\");\nwish(japaneseWord.lookup() === \"http://jisho.org/search/\");\n\
    wish(japaneseWord.count() === 1);\n```\n\n```\nwish(englishWord.word === \"dog\"\
    );\nwish(englishWord.lookup() === \"https://en.wiktionary.org/wiki/dog\");\nwish(englishWord.count()\
    \ === 3);\n```\n\nRevisiting our entire reason for reasoning to begin with, we\
    \ had two main purposes. First, we didn't want to repeat code, we wanted to get\
    \ rid of the if statement. This accomplishes both of those goals. Plus, our interface\
    \ tests are still passing.\n\nSo what's the downside?"
