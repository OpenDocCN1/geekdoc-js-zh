    \ and in doing so, seem to solve the biggest organizational problems.\n\nHowever,\
    \ three major drawbacks to our frameworks are:\n\n+   * Even if the interface\
    \ in your app becomes more standardized or \"simplified\" within a framework,\
    \ team members will need to come up to speed.\n* Refactoring with framework x*\
    \ is a rewrite. There’s no such thing as \"refactoring\" by radically changing\
    \ interfaces.\n* Developers can become (or begin) completely dependent on frameworks,\
    \ which constrains experience in the language itself.\n\nThis last point is as\
    \ troubling as it is common. Many developers can use jQuery, React, and to some\
    \ degree, but struggle with JavaScript outside of those texts.\n\nIn Chapters\
    \ 6 and 7, we discussed the building blocks of architecting JavaScript in a reasonable\
    \ way. In this chapter and beyond, we take ideas a bit further, and in this chapter,\
    \ we will discuss how hierarchies go wrong.\n\nThere are definitely cases where\
    \ you will need a framework to help you organize and standardize your code, but\
    \ extracting functions, objects, and modules, as well as building hierarchies,\
    \ are all tools that you should consider along frameworks when you need to manage\
