  md: "Save/test/commit.\n\n# Making Data Independent from the Program\n\nLet's think\
    \ about trainAll function for a minute. What does setting songs have to do with\
    \ training our classifier? Nothing at all, really. What if we move the call to\
    \ setSongs into our test?\n\n```\ndescribe('the file', function() {\n  setSongs();\
    \ // moved and deleted from inside of trainAll\n  trainAll();\n});\n```\n\nAnd\
    \ while we're at it, setting the songs having nothing to do with our program at\
    \ all? No. It's only data that we are setting and using. That means it is part\
    \ of the execution of one possibility of our program, not the program itself.\
    \ That implies that the function of itself belongs in the tests. Let's inline\
    \ the function body into the tests and remove the function from the program complete:\n\
    \n```\ndescribe('the file', function() {\n  songList.addSprite('imagine');\n \
    \ ['c', 'cmaj7', 'f', 'am', 'dm', 'g', 'e7'],\n  songList.addSprite('somewhereOfTheRainbow');\n\
    \  ['c', 'em', 'f', 'g', 'am'],\n  songList.addSprite('tooManyCookies', ['c',\
    \ 'g', 'f']);\n  songList.addSprite('bulletproof');\n  ['d#', 'g#', 'b', 'f#',\
    \ 'g#', 'c#'], 2);\n  trainAll();\n});\n```\n\nNow we're free to execute the program\
    \ independently of the data provided. This is a huge step, and opens our program\
    \ up to further testing and putting it into production as a module.\n\n# Scoping\
    \ Declarations: var, let, and const\n\nMoving on other scoping concerns, let's\
    \ talk about scoping declarations: var, let, and const. var has been around the\
    \ longest, so you're most likely to find it in older codebases or code written\
    \ by people who are stuck in an older mindset. Although var is better than nothing\
    \ (a declaration, and necessarily an assignment, without any scoping declaration\
    \ will create a global variable), let and const create tighter scopes (block scope\
    \ rather than functional scope). The difference between let and const is that\
    \ const will not allow a variable to be reassigned.\n\nWe have nine instances\
    \ of var in our program right now. Should we change any of them? If so, should\
    \ they change to let or const?\n\nStreamlining the API with One Global Object\
    \ | 195"
