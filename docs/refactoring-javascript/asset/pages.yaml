  md: '# CHAPTER 12


    # Conclusion


    The topics we''ve covered have ranged from techniques as small as renaming variables
    to those as large as applying paradigms like FP and OOP. Taking account of paradigms,
    architectures, libraries, frameworks, and even individual style, your JavaScript
    might be wildly different from someone else''s. You might even find yourself in
    two very different modes from one project to another. If you''re writing a simple
    three-line shell script in JavaScript, you might not want tests or need to write
    any functions. You might completely leave off scoping declarations, even a simple
    var. You might be working with a team that thinks well in OOP. In that case, ES2015
    classes and applying appropriate design patterns might be the way to go. For more
    functional (or just function-curious) teams, FP is a great approach. It doesn''t
    have to be all or nothing, and it doesn''t have to be scary. Turn your linter
    off once in a while.


    Whether you''re making decisions about small stylistic changes or large architectural
    changes, ideally this book has provided you with a good basis for making choices.
    The alternatives of simply using a framework, rewriting into another framework,
    or putting up with JavaScript Jenga are comparatively expensive and demoralizing.


    "JavaScript" is basically a mythical animal. "Your JavaScript" starts with whatever
    styles, tools, platforms, paradigms, ideologies, and purposes you decide to pursue.
    Having a well-developed "your JavaScript" opens up a tremendous amount of possibilities.


    Hopefully, this book has helped you craft your JavaScript, leading to the creation
    of more maintainable, confidence-inspiring codebases.'
