    Some audio captchas on websites are horribly difficult. But it''s worse than that.
    The experience starts with being presented with an image of someone in a wheelchair,
    which certainly doesn''t apply to all people who are visually impaired. And the
    audio that follows is often disturbing and haunting as well as being difficult
    to parse. In all, all, it''s a truly unwerving and frustrating process.


    In a conference talk, accessibility expert Robert Christoph conducted an experiment
    with attendees using an audio captcha. He played it twice, and had everyone write
    down what they thought heard, then compare it to the person next to them. Finally,
    he asked how many people had written down the same as their neighbor—zero out
    of a thousand.


    Ignoring nonfunctional testing will necessarily lead to ignoring some people,
    which is somewhere between mean and illegal. Nonfunctional testing is very important,
    but not just the focus of this book.


    Nonfunctional testing, whether for accessibility or otherwise, is critical to
