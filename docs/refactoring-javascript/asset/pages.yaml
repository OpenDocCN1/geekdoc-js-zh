  md: '# Preface


    Welcome to *Refactoring JavaScript*. Throughout this book, we''ll be looking at
    ways to write better JavaScript, drawing inspiration from classical refactoring
    techniques while exploring various styles of coding.


    # Why This Book Exists


    Like it or not, JavaScript is not going away. No matter what framework or "compiles-to-JS"
    language or library you use, bugs and performance concerns will always be an issue
    if the underlying quality of your JavaScript is poor. Rewrites, including porting
    to the framework of the month, are terribly expensive and unpredictable. The bugs
    won''t magically go away, and can happily reproduce themselves in a new context.
    To complicate things further, features will get dropped, at temporarily.


    This book provides clear guidance on how best to avoid these pathological approaches
    to writing JavaScript. Bad code doesn''t have to stay that way. And making it
    better doesn''t have to be intimidating or reasonably expensive.


    # Who This Book Is For


    This book is meant for programmers who have experience writing bad code, and an
    interest in writing better code. It''s for those writing JavaScript on the frontend
    or the backend. It''s for those writing JavaScript by choice as well as those
    who are "stuck with it" due to JavaScript''s monopoly of the browser platform.


    If you''re an absolute beginner, you might want to write some bad code for a couple
    of months first. If you''re not interested in writing better code, you might not
    have the patience for this book. If neither of these situations describes you,
    we''re good to go.


    Interestingly enough, there are numerous efforts working to make JavaScript better,
    while at the same time others aim to make it obsolete. The number of ways to write
    good and bad JavaScript continues to expand. Frameworks can go a long way toward'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'handling complexity, programmers constrained by frameworks will be limited.
    If you find that you (or your codebase) are struggling to work outside of a framework
    (or at some of the more confusing edges of it), this book should give you new
    ideas for how to approach your work.


    If you have trouble, debugging, or having confidence in your codebase, this book
    should be helpful.


    Most of us don''t work on perfect codebases, especially in JavaScript, where engineers
    might primarily use Ruby, Python, and so on. What does this book help you identify
    which specific parts of a codebase are bad, while providing a multitude of options
    for improvement.


    # How To Use This Book


    Chapters 1–5 describe the interplay between JavaScript, refactoring, quality,
    confidence, and testing. In many books, it is common to tack on the end. In this
    book, for the types of code we are exploring, this wouldn''t be appropriate. Testing
    is essential for confidence. Confidence is essential to refactoring. Refactoring
    is essential for quality, which is the goal:


    testing -> confidence -> refactoring -> quality


    JavaScript (and its ecosystem) happens to provide the space in which transformation
    takes place, so opening chapters necessarily include an exploration of the language
    itself. If you''re completely comfortable with the transformation just described,
    you might want to skim or skip these chapters. Although that is not recommended,
    it is your book, so you can use it however you want. If you think it''s best used
    as a doorstop or to start a fire for warmth or a sacrifice of some sort, go for
    it. If you find an unconventional use for the book, email me a picture or video.
    I''m at http://evanbunchard.com/contact or @evanbunchard on Twitter and GitHub.


    +   Can I or doorstify digital copies too?

    Unfortunately, However, since this book is under a Creative License, you''re free
    to share links to the HTML version and any other files at http://refactoringis.com,
    for example.


    ![](img/25446dec1fb455dfb6ac99424735816c_15_0.png)


    Chapter 5, things get harder, especially if you skipped 1–5. More code to write
    and follow along. In Chapters 6 and 7, we go through refactoring functions and
    objects, and we don''t shy away from some of the complicated bits of JavaScript.
    Generally, the goal of these chapters is to provide options for improving code
    without radically changing the interface. By applying techniques found in these
    chapters, you''ll be able to turn a mess of a codebase into one that has a decent
    baseline of quality.'
