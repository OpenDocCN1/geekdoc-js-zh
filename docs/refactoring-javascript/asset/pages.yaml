  md: "+   • You have to implement a function on the null object every time you create\
    \ a new function that might call the null object instead of its mirrored real.\
    \ Since it's likely that you'd have to add and forget a null check (if you're\
    \ not using null objects), I think this is a wash.\n\n+   • You cannot insist\
    \ that third-party code follow sane practices for returning real values. If you're\
    \ stuck with a library that returns the billion-dollar mistake, you'll need to\
    \ wrap that interface with a new functionality, which could be confusing to people\
    \ used to working with the basic interface.\n\n+   • You might want different\
    \ null object functions depending on the eventual text of how the value will be\
    \ used. Will it be saved to the database? Logged? Used to create a new value?\
    \ These all suggest terminal functionality (such as our display function).\n\n\
    +   • When working with native object types like strings and arrays, you'll face\
    \ overextending them to build subclasses to mirror the null objects.\n\nOverall,\
    \ in *application development*, the null object pattern provides an alternative\
    \ to null checks (the errors when you forget to check for null). If you're writing\
    \ a library, framework, or module, however, it is worth considering this pattern\
    \ in order to avoid \"null-poisoning\" the codebases of anyone who uses your code.\n\
    \nIf you're trying to avoid all of the subclasses involved in this pattern, you\
    \ can try binning with the techniques presented in the state and strategy patterns.\
    \ Also, in Chapter 11, we'll look at a functional alternative to the null object\
    \ pattern called Maybe. For the next section, we'll double down on the null object\
    \ pattern by combining it with a wrapper.\n\n# Wrapper (Decorator and Adapter)\n\
    \nThere are a few ways to implement the decorator pattern. One that should not\
    \ be surprised by earlier sections in this chapter is that JavaScript does not\
    \ naturally fit in web with interfaces, abstract classes, and other object-oriented\
    \ language features that to be a part of the classical pattern.\n\nBefore moving\
    \ on, install tape with `npm install tape`. It's a more test framework than more.\
    \ We'll use it again in Chapter 10.\n\nMost of the time for the decorator pattern,\
    \ you'll see an example like this:\n\n```\nclass Dog{\n  constructor(){\n    this.cost\
    \ = 50;\n  }\n  displayPrice(){\n    return `The dog costs $$${this.cost}``;\n\
    \  }\n}\n```"
