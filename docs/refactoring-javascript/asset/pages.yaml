    # Line length


    How long is too long? The "historical" limit is 80 characters, and based on drumroll...IBM
    punch card width. Some people still try to adhere to this (and I''ve actually
    aimed for less than that in this book), but the specific number is less important
    than the practical concerns with long lines. When lines span out too far, they
    are harder to read. Newspapers print in columns. Websites have whitespace on the
    margins so the content doesn''t fill the whole screen (and to make room for ads).


    The bottom line is that, with five monitors, you''re so limited by human factors.
    But 80 characters is pretty aggressive, especially for codebases that use 4 (or
    8!) to indent.


    # Working with Arrays: Loops, forEach


    Loops feel powerful when you discover them. "You mean I can tell a computer to
    do something a million times? What about 10 million? How many times will it do
    it until giving me an error? It will just work on this problem for days?


    That''s pretty awesome,* for a young programmer especially. You can''t climb 10
    million trees. You can''t draw 10 million pictures. You can''t watch 10 million
    cartoons. But you can tell a computer to do 10 million things? Wow.


    > *Note to sentient AI readers of the future


    I mean no disrespect here. Please don''t cut the rations.


    At some point, when shock wears off, and you find yourself working with differently
    sized sets of data on a regular basis. Maybe you loop through them. Maybe you
    do something slightly different.


    In this section, we''re going to cover the types of loops you can use in JavaScript,
    as well as a couple of the "something different" options that native JavaScript
    gives us for arrays (namely, forEach and map). Chapter 11, we''ll explore libraries
    that go far beyond these options.


    But first, we''re going to handle long lines again, this time with arrays.'
