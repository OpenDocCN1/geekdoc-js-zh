  md: "# Better Than Loops\n\nIs there another option?\n\n```\nchords.forEach(function(chord){\n\
    \  if(!allChords.includes(chord)){\n    allChords.push(chord);\n  }\n});\n```\n\
    \nYou can use foreach instead of for...of. Does it matter right now, in this context?\n\
    Not really, but for purposes of code quality, reuse, and flexibility, forEach\
    \ is the better choice. First, although we haven't covered it yet, we could extract\
    \ that into an anonymous function quite easily.\n\n```\nfunction checkAndInclude(chord){\n\
    \  if(!allChords.includes(chord)){\n    allChords.push(chord);\n  }\n}\nchords.forEach(checkAndInclude);\n\
    ```\n\nThat's a cool possibility. Also, we can still access the index of the chord.\n\
    \n```\nfunction checkAndInclude(chord, index){\n  console.log(index);\n  if(!allChords.includes(chord)){\n\
    \    allChords.push(chord);\n  }\n}\nchords.forEach(checkAndInclude);\n```\n\n\
    If we don't want to extract the function, we can also use the shorter \"arrow\
    \ function\" syntax, which we'll cover in more detail later.\n\n```\nchords.forEach(chord)\
    \ => {\n  if(!allChords.includes(chord)){\n    allChords.push(chord);\n  }\n});\n\
    ```\n\nLet's go with this for now.\n\nAll that work, and although they're shorter,\
    \ we only rid of one line altogether (var index; at the top of the train function).\
    \ Some might argue that forEach is more expressive. Although \"expression\" is\
    \ not always the ultimate goal for every project, I have to concede that the approach\
    \ of forEach is flexible in a useful way, and in addition, parallels the syntax\
    \ for other very useful native methods (like the map and reduce functions)."
  merge: -1
  pgno: 185
- img_proc: true
  md: "In my opinion, forEach is actually the gateway to functional programming. Loops\
    \ are driven by the idea of doing something a bunch of times. But what we really\
    \ want to do is create sets of values to work with and then apply functions to\
    \ them to create new values.\n\nLeaving the context of our classifier for a bit,\
    \ let's look at two ways to assign elements to arrays. One uses for and one uses\
    \ map:\n\n```\n// make doubled array\nvar newArray = [];\n[2, 4].forEach(element\
    \ => {\n  newArray.push(element*2);\n});\nconsole.log(newArray);\n```\n\n```\n\
    // make doubled array\nvar newArray = [2, 3, 4].map(element => {\n  return element\
