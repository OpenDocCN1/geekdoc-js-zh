  md: "```\nvar siteURL = \"http://refactoringjs.com\";nfunction visitSite() {\n \
    \ window.location = siteURL;\n}\n$('.my-button').on('click', visitSite);\n$('.other-button').on('click',\
    \ visitSite);\n```\n\nNow we keep our click handlers. This organization is much\
    \ better.\n\n# Function Calls and Function Literals\n\nFor programmers who are\
    \ new to JavaScript or those who mostly work in some other language on the backend,\
    \ there is often some confusion over function syntax that makes this type of refactoring\
    \ difficult for them.\n\nThis is an anonymous function literal:\n\n```\nfunction();\n\
    ```\n\nThis is a named function literal:\n\n```\nfunction visitSite();\n```\n\n\
    This is an anonymous function literal assigned to a variable:\n\n```\nvar visitSite\
    \ = function();\n```\n\nThis is a function call:\n\n```\nvisitSite();\n```\n\n\
    The only way to call an anonymous function (the first one, when it is not assigned\
    \ to a variable as in the third snippet) is by running the containing code:\n\n\
    ```\n(function()());\n// or\n(function()());\n```\n\nThis is called an IIFE (\"\
    iffy\"), or an immediately invoked function expression. And it is a function call\
    \ (i.e., invocation).\n\nThe confusion arises when people realize that an anonymous\
    \ function declaration, when replaced with a named function for reuse, can be\
    \ used in the same way as a function reference:\n\n```\n$$('.my-button').on('click',\
    \ visitSite);\n```\n\nand not with a function call like this:\n\n```\n$$('.my-button').on('click',\
    \ visitSite());\n```\n\nYou should be passing a reference to the visitSite function\
    \ into the function, not a function call."
