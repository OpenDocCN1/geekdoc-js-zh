    # Sad Paths


    We discussed earlier coverage does not necessarily equate to confidence. Sad paths
    are one particular reason why. The problem might be a data integrity issue from
    a user interaction gone awry (e.g., an incorrectly formatted form entry that allows
    bad data to get into the database).


    Even if your code tests each branch of an if-else clause inside your function,
    some inputs will cause problems. This includes not just parameters passed to the
    function, but also nonlocal inputs such what time or date it is, as well as random
    numbers.


    In languages with strict type checking systems (unlike JavaScript), a good number
    of these sad paths go away. Automated coverage tools will not help you here. Sad
    paths will likely be hidden in the code (and test cases) that you didn''t write.


    Mutation testing, as described in Chapter 3, can be of some help here. But considering
    that there are infinitely error-causing inputs to your functions in JavaScript
    (and the more flexibility you insist on, the more likely you are to hit one),
    the best defense against sad paths is to ensure your inputs be evaluated correctly
    by your function ahead of time. Otherwise, you''re stuck seeing the bug happen
    live, and writing a regression test and code to handle it.


    Note that because of input validation (or using more robust mechanisms inside
    of a function), a sad path will not necessarily mean a new path of code that would
    require a new piece slice in our diagramming method.


    Passing in functions as inputs to a function can be done in a rational way, but
    not recognizing the trade-offs between simplicity in testing and flexibility is
    a mistake.


    The overall recommendation for this section is to have simple and explicit inputs
    whenever possible, both in the function definitions and calls. This makes testing
    a great deal easier.'
