  md: "Adding another trait is as simple as adding a new factory function:\n\n```\n\
    function TrainedDog({\n  const trainedDog = Object.create(dog);\n  trainedDog.cost\
    \ = dog.cost + 60;\n  return trainedDog;\n}\n\ntest(\"trained/cut dog price\"\
    ,assert) => {\n  assert.equal(TrainedCute(new Dog)).displayPrice(),\n    'The\
    \ dog costs $130.');\n});\nnasert.end();\n```\n\nWe can add nest decorators like\
    \ this quite easily.\n\n# We do have to nest the factory functions?\n\nYou might\
