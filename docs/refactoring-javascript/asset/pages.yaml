  md: "As we are describing fairly high-level changes for most of these patterns,\
    \ it's likely that the specific interfaces will change. And we should be aware\
    \ that when changing an interface, we might not be \"refactoring.\\ Sometimes,\
    \ patterns are presented with mechanics to provide a safe path between code and\
    \ after a pattern is applied. In lieu of those, the practical steps for applying\
    \ every pattern presented are:\n\n+   1. Save and check the code into version\
    \ control.\n2. Make a small change.\n3. Repeat steps 1 and 2 until you're done.\n\
    \nFollow that process, and write tests as you see fit. We've already explored\
    \ a few ways to do that, including test-driven development (TDD), characterization\
    \ tests, end-to-end, and unit tests.\n\nWe are striving for code we can be confident\
    \ in. That means in addition to code being well tested, it should also provide\
    \ sensible interfaces. That is the priority in this chapter.\n\n# # Template Method\n\
    \nThe template method pattern is useful for when you have two algorithms that\
    \ serve the same purpose, with minor variations. The basic mechanics require moving\
    \ some part of two subclass functions into the parent class.\n\nAlthough the refactoring\
    \ itself is fairly simple, in this section we'll talk about how you might get\
    \ to the point of wanting to do it, and what much you might do instead.\n\nLet's\
    \ say you have a Person class. As the saying goes, there are 10 types of people:\
    \ those who understand binary numbers, and those who don't. To start out, your\
    \ Person manages this knowledge in a boolean variable:\n\n```\nclass Person{\n\
    \  constructor(binaryKnown) {\n    this.binaryKnown = binaryKnown;\n  }\n  whatNumber(number)\
    \ { return number };\n  isInBinary(number) { return Number('0b' + number); };n}\n\
    \nconst personOne = new Person(true);\nconst personTwo = new Person(false);\n\n\
    [personOne, personTwo].forEach(person => {\n  if(person.binaryKnown) {\n    console.log(person.whatInBinary(10));\n\
    \  } else {\n    console.log(person.whatIs(10));\n  });\n```"
  merge: -1
  pgno: 305
