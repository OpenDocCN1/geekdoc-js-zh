  md: "So what we do if the string is null? We might as well return another null.\
    \ Now we want to tigerify our tonys:\n\n```\nfunction tigerify(string) {\n  return\
    \ `${string}, the tiger`;\n}\nconsole.log(tigerify(capitalize(personOne.name)));\n\
    console.log(tigerify(capitalize(personTwo.name)));\n```\n\nNow our output is:\n\
    \n+   Tony, the tiger\nnull, it's not an error, but that's not a value we want\
    \ to display. Let's try this:\n\nWell, let's try this:\n\n```\nfunction tigerify(string)\
    \ {\n  if(string == null){\n    return null;\n  } else {\n    return `${string},\
    \ the tiger`;\n}\n```\n\nNow we'll just plain null for the string, which isn't\
