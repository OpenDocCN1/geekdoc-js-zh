  md: 'Chapter 8 expands our view of architecture to those that include (or avoid)
    hierarchies.


    Chapters 9, 10, and 11 are dedicated to specific topics (design patterns, asynchronous
    programming, functional programming, respectively) that can take your code beyond
    baseline, but necessarily involve more aggressive changes. With the design patterns
    in Chapter 9, we recognize ways to extend and draw from JavaScript''s object-oriented
    side, and cover the historical connection between refactoring and object-oriented
    programming (OOP). In Chapter 10, we deal with the reality that many codebases
    have more than one thing to do at. In Chapter 11, we take a tour of functional
    programming through a couple of libraries that provide useful interfaces that
    go beyond our standard Array interfaces (forEach, map, reduce, etc.) give us.


    In some sense, these three chapters in particular break away from our initial
    goal of refactoring by changing the implementation details without changing the
    interface. On the other hand, these interfaces are useful and sometimes unavoidable.
    We may find ourselves wanting to write code that is much asynchronously for performance
    reasons. Or we could find ourselves “stuck” in a codebase that has much invested
    in good or bad attempts at OOP or functional programming (FP). So, through choice
    or code we inherit, these are parts of JavaScript that we should pay attention
    to and be able to improve upon. If you adopt a completely different paradigm to
    a codebase, is unlikely that you''ll be “refactoring” in the sense that we mean
    throughout the book.


    If we want to be rigid about it, these chapters still refactor within their paradigms
    (OOP to better OOP, async to better async, and FP to better FP), and if we wish
    to think in the broadest terms about the execution of our program (e.g., “running
    node myprogram.js” as input and “being satisfied with how it ran” as output),
    then we can be refactoring even while jumping from paradigm to paradigm. I encourage
    you to first work with smaller, incremental changes that are easy to test and
    be confident in.


    > To quote Opdyke''s original thesis on refactoring:

    This definition of semantic equivalence allows changes throughout the program,
    as long as this mapping to output values remains the same. Imagine that a circle
    is drawn around the parts of a program affected by a refactoring. The behavior
    viewed from outside the circle does not change. For some refactorings, the circle
    rounds most or all of the program. For example, if a variable is referenced throughout
    a program, the refactoring that changes its name will affect much of the program.
    For other refactorings, the circle covers a much smaller area;'
