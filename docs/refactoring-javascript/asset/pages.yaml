  md: 'If you''re wondering what the point of that was, it''s extracting and inlining
    functions should come as naturally to you as introducing and inlining variables.


    # Extracting and Naming Anonymous Functions


    In addition to extracting functions to group behavior, it is also useful for naming
    anonymous functions. We have some anonymous functions in our program. For examples,
    look at any code that follows a forEach, or the second parameter to the describe
    and it function calls in the test.


    We could extract some of these functions, but to demonstrate the benefits a bit
    more, let''s take a look at some pedestrian jQuery code that visits a URL when
    a button is clicked:


    ```

    $(''.my-button'').on(''click'', function() {

    window.location = "http://refactoringjs.com";

    });

    $(''.other-button'').on(''click'', function() {

    window.location = "http://refactoringjs.com";

    });

    ```


    Some people would correctly identify that duplication as a maintenance problem
    deserving of kind of fix. Unfortunately, many of them would want to solve this,
    extracting a variable, and so:


    ```

    var siteUrl = "http://refactoringjs.com";

    $(''.my-button'').on(''click'', function() {

    window.location = siteUrl;

    });

    $(''.other-button'').on(''click'', function() {

    window.location = siteUrl;

    });

    ```


    This makes it easier to change siteUrl in the future (assuming it is used in other
    places), but we can reduce duplication further by extracting a function:


    ```

    var siteUrl = "http://refactoringjs.com";

    function visitSite() {

    window.location = siteUrl;

    }

    $(''.my-button'').on(''click'', function() {

    visitSite();

    });

    $(''.other-button'').on(''click'', function() {

    visitSite();

    });

    ```


    Now our implementation will be easier to change in the future, but what good does
    does wrapping our function call in a function accomplish? Nothing! Try this instead:'
