  md: "In this chapter, our changes are much more aggressive. In order to approach\
    \ those changes with confidence, we're going to need more tests. Before we make\
    \ any more changes, we're going to test what we have now.\n\nIn case it isn't\
    \ obvious what we want to test, the premise is that we want to convert our manual\
    \ workflow into an automated one. That means that anything we've been looking\
    \ for output should be inside of a test.\n\n# Code wanting to be better\n\nIf\
    \ you look at code in a certain way, you can see how it wants to be better. Long\
    \ files want to be shorter. Comments explaining a few lines of code want to be\
    \ functions, named with the comment, that wrap up those few lines. As it applies\
    \ to us right now, these logging statements want to be functions.\n\n![](img/25446dec1fb455dfb6ac99424735816c_201_0.png)\n\
    \n# Our Setup Test\n\nBefore we start testing the actual behavior of our code,\
    \ it's useful to have a test to ensure everything is working properly.\n\nAdd\
    \ this to the bottom of your file:\n\n```\nvar wish = require('wish');\ndescribe('the\
    \ file', function() {\n  it('works', function() {\n    wish(true);\n  });\n});\n\
    ```\n\nNote that you may also need to run these commands from the command line:\n\
    \n```\nnpm install -g mocha\npm install wish\n```\n\nNow if you run mocha nb.js\
    \ you should see a passing test as well as our logging information.\n\n# Don't\
    \ forget about the watcher\n\nDon't forget about using mocha -w nb.js to run the\
    \ watcher in a terminal window to update the results when you make changes.\n\n\
    ![](img/25446dec1fb455dfb6ac99424735816c_201_1.png)"
