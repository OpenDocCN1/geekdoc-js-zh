    \ practical reasons for using it here:\n\n+   * If you're working on a legacy\
    \ web project, it's very likely to have jQuery.\n* If you're working on a legacy\
    \ web project with jQuery, it's very likely to have the exact kinds of nonsense\
    \ shown here.\n* Because jQuery is so closely tied to the DOM, it extremely common\
    \ to see procedural code that relies heavily on side effects. Because of how many\
    \ people use it, it is the worst JavaScript that you'll see.\n\n# Variable Hoisting\n\
    \nNow onto our last topic for variables: declaring variables where they are hoisted.\
    \ JavaScript has an esoteric feature called *hoisting*. Variables declared with\
    \ var or function are all initialized as undefined at the top of the function\
    \ scope in which you declare them. We'll get more into var, let, and const in\
    \ the next chapter, but for now, it is worth noting a JavaScript-specific refactoring\
    \ rewarding hoisting that we might want to use in our classifier.\n\nWith changes\
    \ from before, our train function would look like this:\n\n```\nfunction train(chords,\
    \ label) {\n  songs.push([chords, label]);\n  labels.push(label);\n  for (var\
    \ index = 0; index < chords.length; index++) {\n    if (allChords.includes(chords[index]))\
    \ {\n      allChords.push(chords[index]);\n    }\n  }\n  if (Object.keys(labelCounts).includes(label))\
    \ {\n    labelCounts[label] = labelCounts[label] + 1;\n  } else {\n    labelCounts[label]\
    \ = 1;\n  }\n}\n```"
