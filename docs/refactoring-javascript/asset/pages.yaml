  md: 'The principles of moving in small, confident steps, backed up by tests and
    version control, are helpful. Aside from that, the best thing to do is communicate
    clearly how long things will take, including admitting when your estimates carry
    assumptions that may prove to be incorrect. When in doubt, double your estimate,
    and then triple it.


    # A Rewrite of Your Own


    If you''re interested in a mini-rewrite project, moving the NBC code from OOP
    to FP style. Or moving it to FP from the procedural version of the code (before
    the classifier object sucked in all of the functions). See if your version is
    similar to that of the previous section. It is easier to start from scratch or
    move with a guess at how long it will take, and see how accurate your guess was.


    # Wrapping Up


    In this chapter, we discussed some of the benefits of functional programming,
    and how a good portion of them are realized through practices we''ve been discussing
    all: not reusing variables, avoiding shared state, extracting functions, and preferring
    Array''s higher-order functions to loops.


    We also explored some interfaces and libraries (Ramda and Sanctuary) for functional
    programming all with good old arrays, as well as Maybe, which might be new to
    you but will hopefully find a place in your toolkit to squash null, the billion-dollar
    mistake.


    Maybe functional programming will be your new favorite paradigm. If so, I''d encourage
    you to try stricter like Haskell, but if that gets intimidating or you miss working
    in the browser, remember that you can explore the concepts and exploit the interfaces
    of FP in JavaScript with just a few statements. FP doesn''t have to be all or
    nothing.


    It''s a huge topic, and in this chapter, we justmed the surface. As to what a
    path toward learning FP could look, I recommend the following sequence:


    +   1. Get familiar with the native JS Array''s higher-order functions (they take
    a function as input), such as Each, map, filter, and reduce.

    2. Try out a library like underscore or lodash, which have many more manipulations
    than what is provided for native JavaScript.

    3. Get used to composing functions and manipulating arguments with Ramda and/or
    Sanctuary.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '4. Use Sanctuary, ramda-fantasy, Folktale, or any of a number of other implementations
    of the Fantasy Land spec that describe burrito-like things from the earlier diagrams.


    Along the way, try these out as well:


    +   - Use Immutable.js or mori to enforce immutability beyond what const and .freeze
    can easily offer.


    +   - Try out functional languages that compile to JS.


    +   - Try out functional languages that don''t compile to JS.'
