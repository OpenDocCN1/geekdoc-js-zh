  md: '# Inputs (Nonlocal and Free Variables)


    Throughout the book (especially in Chapter 5), we distinguish between three types
    of inputs:


    +   - Explicit inputs (the parameters passed into a function)

    - Implicit inputs (the this refers to the containing context object, function,
    or class)

    - Nonlocal inputs (the values used within a function or object that are defined
    elsewhere)


