    # Evaluating Your Options for Hierarchies\n\nTo wrap up this section, recall that\
    \ we looked at four ways to build a hierarchy:\n\n+   - Classes\n- Constructor\
    \ functions\n- Object literals\n- Factory functions\n\nWhich one you choose in\
    \ a given situation is up to you. Constructor functions are probably the worst\
    \ option. Because they have a perennial attempt at classes, many variants exist,\
    \ and it is hard to find great documentation on them (a web search will show you\
    \ to do them from five, six, and seven years ago—all different). If you're considering\
    \ them, go for classes instead.\n\nFactory functions give you a more control (including\
    \ possibilities for establishing a prototype chain) as compared with object literals.\
    \ For simple cases, object literals are easier to work with.\n\nYour team or codebase\
    \ (including libraries you use) may be dedicated to certain methods of establishing\
    \ a hierarchy. In those cases, sticking to what's there is a decent option. You\
    \ could encounter two patological approaches, however. The first is an overreliance\
    \ on manipulating and inspecting prototype, constructor, and associated utilities.\
