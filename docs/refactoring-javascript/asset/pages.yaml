  md: '# Making Soup Versus Baking


    I like making soup. Early on, you can start to taste it as you go, adding more
    ingredients, and tasting them individually as well. Baking, on the other hand,
    is very frustrating. You have to wait 45 minutes before you can find out if it''s
    good.


    TDD is like making soup. You can have a tight feedback loop with the ingredients
    (low-level tests) or in bits (high-level tests).


