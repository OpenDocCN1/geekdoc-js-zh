  md: "One unfortunate distraction in this code is the call to super in the constructor\
    \ of the subclass. If you don't call super, you'll get a ReferenceError: this\
    \ is not defined, which not only is an unclear error, but also demonstrates how\
    \ null or undefined can come from core parts of the language, not just libraries.\n\
    \nRegardless, the output doesn't look so bad:\n\ntony\nnull\n\nBut let's say we\
    \ want to do something with those values:\n\n```\nfunction capitalize(string)\
    \ {\n  return string[0].toUpperCase() + string.substring(1);\n}\n```\n\n```\n\
    console.log(capitalize(personOne.name));\nconsole.log(capitalize(personTwo.name));\n\
    ```\n\nNow our trials starts with:\n\nTypeError: Cannot read property '0' of null\n\
    \nWe might be inclined to try to solve this by using an empty string instead of\
    \ null:\n\n```\nclass AnonymousPerson extends Person {\n  constructor() {\n  \
    \  super();\n    this.name = \"\";\n  }\n}\n```\n\nThis time, we'll get a new\
    \ error:\n\nTypeError: Cannot read property 'toUpperCase' of undefined\n\nIt's\
    \ just as bad as the first one, so we might well put our null back. Now we're\
    \ stuck doing some type checking inside of capitalize:\n\n```\nfunction capitalize(string)\
    \ {\n  if(string === null) {\n    return null;\n  } else {\n    return string[0].toUpperCase()\
    \ + string.substring(1);\n  }\n}\n```\n\nBecause we don't have a good way out\
    \ of the empty value we got from the Anonymous Person name property (we're pretending\
    \ we don't know about null objects), we're stuck with some kind of nonsensical\
    \ type check like this (it could just as be or undefined). And the consequence\
    \ for not type checking is that our program will throw an error at runtime."
