  md: '# CHAPTER 9


    # Refactoring to OOP Patterns


    It is tempting to treat software design patterns as checklists to learn. There’s
    something so nice about the idea that if we just "memorize these 23 things," we’ll
    be all set. The bad news is that, as mentioned in Chapter 2, even the latest in
    JavaScript should keep you busy until the free and open web fails or the sun goes
    supernova.


    Additionally, patterns have a mixed reputation. On the one hand, they can help
    to handle complexity. On the other hand, they can create complexity where it is
    not needed. Sometimes, extracting functions, extracting objects, breaking code
    up into modules, and depending on a framework (which itself likely exposes and
    documents patterns of its own) are simpler choices. Keeping the YAGNI ("Ya ain''t
    gonna need it") principle in mind and considering the interface you want for your
    code are the best guidelines when to implement (or remove) a design pattern.


    The good news is that these patterns aren’t hard to learn and are easy to reference
    so you don’t have to memorize every detail. Additionally, we’ll focus on just
    seven of them, chosen by their likelihood to solve real problems in legacy code.
    Just learn these patterns, and it will change your life! Here they are:


    +   * Template method

    * Strategy

    * State

    * null object

    * Decorator (“Wrapper” section)

    * Adapter (“Wrapper” section)

    * Facade


