  md: '# Wrapping Up


    As you''re refactoring, you might be tempted to change the interface of a function
    (not just the implementation). If you find yourself at that point, you are writing
    new code that requires new tests. Refactoring shouldn''t require new tests for
    code that is already covered and passing, although there are cases where more
    tests can increase confidence.


    To recap, use the red/green/refactor cycle for regressions. Write tests for confidence.
    Write characterization tests for untested code. Write regression tests for bugs.
    You can refactor as much as is practical, but only if you have enough coverage
    to be reasonably confident in the changes. In any case, keep the steps between
    your git commit small, so that you''re ready to roll back to a clean version easily.'
