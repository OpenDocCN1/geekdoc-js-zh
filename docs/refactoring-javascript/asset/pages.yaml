  md: "This simplifies the constructor calls and allows the binaryKnowledge to be\
    \ independent of the person. Before we move on to fully implementing the state\
    \ pattern, there are two additional possibilities worth consideration. The first\
    \ is a potential shortcoming of all three functions being contained in the same\
    \ knowledge objects. Is it possible for a person to know how to read binary, but\
    \ not execute an xor operation? Sure, why not? This design doesn't offer a flexible\
    \ approach to that situation, but we'll address that after completing the state\
    \ pattern.\n\nA second thing to consider is whether or not to add delegation from\
    \ the person object directly to binaryKnowledge. There is a possible convenience\
    \ in that, but it also has weaknesses. Tying those functions together in the constructor\
    \ (using statements like this.read = binaryKnowledge.read) would mean any new\
    \ functions added to the binaryKnowledge objects would also need new references\
    \ in the person constructor. Additionally, the client code then names the interfaces\
    \ of the binaryKnowledge objects. Whether to delegate or not is going to come\
    \ down to a matter of taste, but in general, the more dynamic the overhead and\
    \ confusion you will have when delegating individual functions.\n\n# The binary\
    \ object's functions can be changed!\n\n![](img/25446dec1fb455dfb6ac99424735816c_314_0.png)\n\
    \nAlthough it's convenient to attach objects directly to other objects like this,\
    \ it is worth considering that although const will protect the value of binary\
    \ from being reassigned, it does not prevent our aware or oblivious functions\
    \ from being reassigned. Furthermore, if multiple person objects may reference\
    \ the same function, redefining a function on a given person object will redefine\
    \ the function for other objects as well. Adding the following code to the end\
    \ demonstrates:\n\n```\nconst personOne = new Person(binaryAware);\nconst personTwo\
    \ = new Person(binaryAware);\npersonTwo.binaryKnowledge.read = () => `redefined\
    \ on both objects`;\n\n[personOne, personTwo].forEach(person => {\n  console.log(person.binaryKnowledge.read(10));\n\
    });\n```\n\nThe easiest path to having immutable objects is to have new objects.\
    \ We'll address this toward the end of this section.\n\nWhat makes this not quite\
    \ yet the state pattern is we haven't defined the transitions between our objects.\
    \ Let's do that now:"
