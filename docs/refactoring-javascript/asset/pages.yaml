    # Staging/QA servers


    It can be difficult to simulate production to the level needed on your local development
    machine. For this reason, servers (or instances/virtual machines) that are as
    similar as possible to production are often used with a database that has a sanitized
    but representative version of production data.


    ![](img/25446dec1fb455dfb6ac99424735816c_68_0.png)


    If these processes and tools seem overwhelming, don''t worry. When you need them,
    they can be useful, and if you don''t, you can usually avoid them. It''s good
    to experiment with new tools like on hobby projects, but if you go overboard,
    you''ll end up spending more time configuring everything to work together than
    you will actually doing the project!


    # Wrapping Up


    So now we have a good overview of what testing is, as well as why it''s useful
