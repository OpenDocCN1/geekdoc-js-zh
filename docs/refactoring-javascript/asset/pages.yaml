  md: '# # How Overrated Understanding Code


    It might sound like heresy, but hear me out.


    It''s completely possible to refactor (with tests in place, of course) without
    having a good understanding of what the code actually does. "Digging in" (especially
    when debugging) is a tremendously important skill, but quality improvements through
    refactoring do not always demand it. As in our example, you may hit a point where
    having further context, you''re stuck, but this is not always the case.


    Similarly, when you have a failed test build (or a deployment, eek), it''s tempting
    to "dig in" and see exactly went wrong, but sometimes, it''s much faster to just
    go back to a version of the code that behaved properly and work from there.


    Understanding the code (which includes tracing the execution path, and examining
    variables and other state at various points in time) is useful but can be tedious.
    It''s important to recognize that it''s not the only strategy that works.


    # Avoiding reassignment in loops


    Next, let''s talk about loops (which frequently have a "loop counter" variable
    that updates). Instead of using them, we should prefer usingforEach, at minimum:


    ```

    `[3, 4].forEach(element => console.log(element));`

    ```


    This is for when we have a simple side effect we want to run, but rather than
    using a loop (or forEach) to change values inside an array, we can use map to
    create a new array with values:


    ```

    `[3, 4].map(element => element * 2);`

    ```


    When we want to filter an array to kick some elements out, we can use filter,
    rather than creating a new array and pushing the elements that are okay:


    ```

    `[3, 4].filter(element => element % 2 == 0));`

    ```


    When we need to transform an array into some other type of value (object, number,
    etc.), we''re likely going to reduce:


    ```

    `[3, 4].reduce(element, accumulator) => element + accumulator);`

    ```


    In a loop, any of these functions tend to work with the index of the loop, as
    well as an outer variable that reassigns itself over time. An atomic creation
    of a new variable makes tests easier and keeps values the same.


    If you''re looking for a good jumping-off point for higher-order functions like
    these, the Array docs are a good place to start.'
