  md: 'your tests, mocks also set an expectation (a test) that the function is called.
    General mocking/stubbing functionality is usually included as part of a testing
    framework, but there are also more specific mocking/stubbing libraries that are
    not. These may stub out whole classes of function calls, including calls to the
    filesystem, the database, or any external web requests.


    # Build/task/packaging tools


    The JavaScript ecosystem has a ton of for gathering code together, transforming
    it, and running scripts (custom or library-defined). This can be dictated by a
    JavaScript framework, and you might have some that overlap in your project.


    # Loaders and watchers


    If you''re running the test suite frequently, it is essential to having a tight
    feedback loop, looping your app/program before every run can slow down significantly.
    A loader can speed up the process by keeping your app in memory. This is often
    paired with a watcher program that executes your test suite when you save a file.
    The feedback loop can be tightened even further when the watcher script intelligently
    only runs the tests relevant to the saved file.


    # Test run parallelizers


    Sometimes built into loaders/task runners or test frameworks, these tools make
    use of multiple cores on your machine, parallelizing the test run and execution
    of the test suite. One caution worth noting is if your application is heavily
    dependent on side effects (including using a database), you may see more failures
    when tests produce state that conflicts with other tests.


    # Continuous integration (CI) services


    These are online services that run your test suite on demand or upon events like
    committing to the shared version control repository, sometimes restricted to particular
    branches. These often make use of parallelization (and offer overall performance)
    beyond what you could accomplish on your personal machine.


    # Coverage reporters


    In order to know if code is safe to refactor, it is essential to know that the
    code is sufficiently covered by tests. Whether or not you are able to determine
    coverage without actually running the test suite (and consequently exercising
    the code) is an interesting academic question of dynamic versus static analysis,
    but fortunately, coverage tools that determine coverage by running the test suite
    are abundant. These can be run locally, but are often paired with CI systems.'
