  md: '# Test frameworks


    These vary significantly based on what JavaScript you are using (see Chapter 2),
    and how many tools you bundle together. In general, these allow you to specify
    tests in a file (or many) and have a command-line interface that you can use to
    run the test suite. A test framework may include many of the tools listed next
    as well. Some frameworks are specific to the frontend or backend code. Some are
    specific to the JavaScript framework. Some are high-level, low-level, or acceptance
    tests. They will usually dictate how test files are written as well as providing
    a test runner. The test runner will execute the suite (often allowing targeting
    of a specific directory, file, or individual test case), and output errors and
    failures of the run. It will also be responsible for the setup and teardown phases
    of the run. Besides loading code, this can also mean putting the database in a
    particular state (“seeding”) it before the test run, and resetting it afterward
    (as your tests may have created/deleted/changed records).


    In the next chapter, we use some of the more basic features of the Mocha framework.
    In Chapter 9, we will also be trying a more lightweight framework called Tape.


    # Assertion/expectation syntax libraries


    These are usually meant to work with particular testing frameworks and often come
    bundled with them. They are enable you to assert that a given function returns
    “hello world” or running a function with a set of inputs results in an error.


    Assertion libraries can be unnecessarily complicated. Chapter 4 introduces a simple
    assertion and characterization testing library called wish.


    # Domain-specific libraries


    Examples of these include database adapters and web drivers (to simulate clicks
    and other website interactions). These may be bundled into a JavaScript framework
    or testing framework. Often, they come with their own assertion/expectation syntax
    that extends the testing framework.


    # Factories and fixtures


    These tools are responsible for creating database objects either on demand (factories)
    or from a file specifying data (fixtures). These libraries are sometimes associated
    with the word fake or faker. You’ll find these useful if your tests require a
    lot of code to set up.


    # Mocking/stubbing libraries


    These are sometimes associated with the terms mocks/mocking, stubs/stubbing, doubles,
    and spies. Mocks and stubs both allow you to avoid calling a certain function
    in'
