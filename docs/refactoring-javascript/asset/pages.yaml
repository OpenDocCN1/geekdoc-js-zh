  md: "Now you get a stack trace that includes the filename, line, and column number\n\
    the error was thrown.\n\n```\nError: here I am\nat Object.<anonymous> (../refactoring.js/bayes/nb.js:1:78)\n\
    at Module._compile (module.js:541:32)\nat Object.Module.extensions..js (module.js:550:10)\n\
    at Module.load (module.js:458:32)\nat tryModuleLoad (module.js:417:12)\nat Function.load_\
    \ (module.js:409:3)\nat Function.Module.runMain (module.js:575:10)\nat at startup\
    \ (node.js:160:18)\nat node.js:449:3\n```\n\nAfter digging around the error object,\
    \ you'll find that this has two prop-\nerties and a message:\n\n```\ntypeof theError\
    \ === 'object';\nObject.getPropertyNames(theError)\ntypeof theError.message ===\
    \ 'string'\ntypeof theError.stack === 'string'\n```\n\nBoth properties are strings,\
    \ stack is what we're interested in, specifically the filename\nin it.\n\n# Regex\
    \ Basics for Handling Strings\n\nIt appears that the filename will have a slash,\
    \ and a colon after, which is unique\nam other file and folder names in the stack.\
    \ We can imagine convoluted\nfunction containing a for for adds letters to a string\
    \ and then sheaves off the\nslash and colon before returning it. Or, somewhat\
    \ intelligently, we could use a\nfew and array regex to match zeros to what we\
    \ want. Let's refine our fileName\nfunction like the following:\n\n```\nfunction\
    \ fileName() {\n  var theError = new Error('here I am');\n  return theError.stack.split('\\\
    n')[1].split('/') .pop().split(':')[0];\n}\n```\n\nIt is definitely better than\
    \ the for loop idea, but it feels a little...inelegant.\nRegex to recurse: Make\
    \ the top of the file looks like this:\n\n```\nfunction fileName() {\n  var theError\
    \ = new Error('here I am');\n  return /\\/(\\w+\\.js)\\\\:/.exec(theError.stack)[1];\n\
    }\nconsole.log(`Welcome to ${fileName()}`);\n```\n\nWhy is this better? Because\
    \ the syntax looking weird if you're not used to it,\nthis maps better to how\
    \ we initially thought of the problem (pull characters matching"
