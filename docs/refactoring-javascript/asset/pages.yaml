    \ we use an interface. When you play a piano, you're not physically pushing the\
    \ hammers into the strings. When you drive a car, you're probably focused on the\
    \ destination or next high-level step, occasionally thinking about your controls,\
    \ and rarely (if ever) about the internal components.\n\nBasically, a facade is\
    \ an interface that contains a curated subset from one or more APIs with the intention\
    \ of streamlining and simplifying the code one needs to write.\n\nAs for a more\
    \ specific software example, let's consider how JavaScript interacts with native\
