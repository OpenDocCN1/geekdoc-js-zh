  md: "```\nconsole.log(personOne.name.capitalize().tigerify().display());\nconsole.log(personTwo.name.capitalize());\n\
    ```\n\nThe biggest change here is the addition of two new classes: NSString and\
    \ Null String. The Person and AnonymousPerson constructors create these objects.\
    \ Notice that we're now chaining functions instead of nesting them, and display\
    \ now calls toString so that console doesn't print the type information. NSString\
    \ implements our functions as before (except for the type check we could remove\
    \ from capitalize, NullString only has capitalize implemented right now).\n\n\
    Why is that?\n\nBecause the traditional way to implement the null object pattern\
    \ is to return null. We hit the null wall and can't do anything else with personTwo\
    \ without type checking. It's worth stopping for a minute to think about how unfortunate\
    \ that is.\n\nNow let's do something better. We'll implement a NullString that\
    \ not only has null functions but also returns mirror values to the NSString.\n\
    \n> Why didn't we overwrite String.prototype?\nOverwriting base objects is considered\
    \ a likely bad idea unless you're sure that the changes are desirable for some\
    \ scope that's easy to contain. Most of other programmers (also you, after you've\
    \ forgotten that you overwrite parts of String) will assume that it is the same\
    \ String they're used to. Although subclassing is usually worse than other options\
    \ for extracting an object, it is very useful for creating copies of native objects\
    \ like String and Array.\n\nOur code looks like this with mirror interfaces:\n\
    \n```\n// with null object\nclass Person {\n  constructor(name) {\n    this.name\
    \ = new NSString(name);\n  }\n}\n\nclass AnonymousPerson extends Person {\n  constructor()\
    \ {\n    super();\n    this.name = new NullString;\n  }\n}\n\nclass NullString\
    \ {\n  capitalize() {\n    return this; // same as new NullString in this case\n\
    ```"
