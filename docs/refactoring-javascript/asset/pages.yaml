  md: '# Handling Randomness


    In Chapter 4, we dealt with randomness mostly by avoiding thinking about or testing
    It''re not going to go too in-depth either, but in the context of functional programming,
    we need to address that randomness makes our functions impure (meaning we cannot
    rely on them to yield the same output when given the same explicit input). In
    JavaScript, we call Math.random and get a "random" value. But what we''re actually
    getting is a "pseudorandom" number, which is calculated based on "seed", usually
    having something to do with. Unfortunately, this seed value cannot be set in our
    native Math. function.


    If it could be set with seed, we could generate the same "random" value sequence.
    For instance, it could work like this (but not in native JavaScript):


    ```

    const mySeed = 3;

    let rng = setRng(mySeed);

    rng.gimmerRandom();

    // returns 2593

    rng.gimmerRandom();

    // returns 8945


    rng = setRng(mySeed);

    rng.gimmerRandom();

    // returns 2593

    rng.gimmerRandom();

    // returns 8945

    ```


    That means that functions that appear random are actually deterministic. It is
    handy, because you can have random-like numbers that you can test. It is possible
    that for your application (or just your tests), this kind of randomness is enough.


