  md: "# But Aren’t Classes Bad?\n\n“JavaScript doesn’t have real classes! They are\
    \ just functions and prototypes and objects underneath It’s a trick. Don’t fall\
    \ for it! Its true nature is disguised by them!”\n\nOr “JavaScript was only built\
    \ in 10 days or something, right? It’s a mess underneath, and clinging to new\
    \ syntax is our only hope to avoid thinking about the differences between .prototype,\
    \ [[prototype]].getPrototypeOf(), and __proto__\n\nAlternatively, “Classes are\
    \ fine and useful if they run on your platform and your team can understand them.\n\
    \nAlso, as more features are added to JavaScript classes (such as real private\
    \ attributes, as discussed in Chapter 5), they are starting to look less like\
    \ “syntactic sugar” and more like a unique construct. This doesn’t invalidate\
    \ arguments of preferring object composition or functional programming over OOP,\
    \ but it does weaken the “classes are nothing special” argument.\n\n# Choosing\
    \ Our API\n\nNow that our class appears to be pretty good shape, it’s time to\
    \ consider our API itself. In other words, if someone were importing our code\
    \ as a module, what functions would be public (accessible to them), and which\
    \ would be private? As we know from Chapter 5, the private/public distinction\
    \ is bit complicated in JavaScript (as of this writing, “private” currently means\
    \ obscured or inaccessible, although this is likely to change), but nonetheless,\
    \ we can determine the ideal now, even before realizing the distinction fully\
    \ in a module. We’ll tackle that in the next section. For now, we’re just choosing\
    \ what functions need to be accessible.\n\nThere are three functions from classify\
    \ that we need to be public:\n\n+   - constructor\n- trainAll\n- classify\n\n\
    Additionally, our addSong function from songList needs to be accessible. For convenience’s\
    \ sake, let’s add a function to the classifier:\n\n```\nclass Classifier {\n \
    \ constructor() {\n  };\n  addSong(name, chords, difficulty){\n    this.songList.addSong(name,\
    \ chords, difficulty);\n  }\n}\n```"
