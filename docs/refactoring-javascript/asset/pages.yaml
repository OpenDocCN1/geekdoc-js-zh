  md: "+   * Localizing performance\n* Optimizing code\n* Converting code to use a\
    \ different interface (e.g., synchronous to asynchronous\n  or callbacks to promises)\n\
    \nAnd the list goes on. For existing code, any changes made to the interface (aka\
    \ behav-\n) should break tests. Otherwise, this indicates poor coverage. However,\
    \ changes to\nthe underlying details of implementation should not break tests.\n\
    \nAdditionally, any code change made without tests in place (or at least a commitment\n\
    to manually test the code) cannot be guaranteed to preserve behavior, and therefore\n\
    are not refactoring, just refactoring code.\n\n# \"refactoring\" vs. \"Refactoring\"\
    \n\n![](img/25446dec1fb455dfb6ac99424735816c_35_0.png)\n\nInitially for this book,\
    \ we considered designating \"refactoring\" as it\ncolloquially used to mean \"\
    changing code,\" by a lowercase r, and\nreserving the capitalized version for\
    \ our more specific definition\n(confistently refactoring code in a way that preserves\
