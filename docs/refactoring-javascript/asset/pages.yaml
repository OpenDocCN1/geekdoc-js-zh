    # Which Interfaces Do You Want?


    There''s more to the story here. Although we showed earlier that a factory function
    can sever the prototype link in the Object.create pattern, there is another option.
    Before, we used:


    ```

    const myPet = Object.assign(Object.create(animal), barky, bitey);

    ```


    That creates a prototype link between myPet and animal. This can be useful because
    we can add functionality to animal and have it inherited by myPet (as well as
    other objects that were created through a similar mechanism).


    But if we want a new object with the existing behavior, but without the baggage
    of a prototype, we could do this:


    ```

    const myPet = Object.assign(), animal, barky, bitey);

    ```


    Now animal acts just like barky and bitey. We can add properties to them, but
    myPet is unaffected:


    ```

    animal.hasBankAccount = false;

    console.log(myPet.hasBankAccount); // prints undefined

    ```


    Another way to look at this is that myPet''s prototype is now {}, rather than
    animal:


    ```

    console.log(Object.getPrototypeOf(myPet));

    // prints "{}"

    ```


    Also note that beFluffy (the function inherited from animal) is defined directly
    or not an object has myPet:


    ```

    console.log(myPet);

    // prints

    { beFluffy: [Function: beFluffy],

    bite: [Function: bite],

    bark: [Function: bark] }

    ```


