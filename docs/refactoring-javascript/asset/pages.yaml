    The new pieces here here are:


    +   - We''re requiring Ramda.

    - We assign name property by converting the value to a Maybe and then an Either.

    - Our tests are symmetrical and use S.either.


    Let''s talk about those last two bullet points. First, this line:


    ```

    this.name = S.maybeToEither('''', S.toMaybe(name));

    ```


    As before, in the null-null case, S.toMaybe makes a Just that holds the name value
    that we pass in. Then, Just is converted (through S.maybeToEither) into a Right
    that also holds the name.


    In the null case for name, S.toMaybe creates a Nothing, which is same as before.
    Then, S.maybeToEither turns Nothing into a Left, and unlike Nothing, Left can
    hold a value. The value that it is set to hold is a blank string.


    Because the Left is holding value from the beginning, we can pull it out in the
    same way as with a Right, apply the second function to it (capital Tiger)—namely,
    with these in the tests:


    ```

    assert.equal(S.either(R.identity, capitalTiger, personOne.name), '''');

    assert.equal(S.either(R.identity, capitalTiger, personTwo.name), '''');

    ```


    The S.either function says if it''s a Left, apply the first parameter function
    to it (R.identity), and if it''s a Right, apply the second parameter function
    to it (capital Tiger). It''s okay, but it''s also bit prescriptive.


    With a bit of an understanding, we can map instead. Left and Right are both either
    types. Left acts like Nothing, that unlike Right (or Just), it will ignore you
    when you try to map functions to it. That means our tests could also be the following:


    ```

    assert.equal(personOne.name.map(capitalTiger).value, ''Tony, the tiger'');

    assert.equal(personTwo.name.map(capitalTiger).value, '''');

    ```


    This is in line with how we expect Left to behave. The Right (or personOne.name)
    goes along with the map''s function (capitalTiger) in the same way a Just would.
    The Left (or personTwo.name) disregards the map''s wishes, just like a Nothing
    would do with map. Unlike Nothing, however, the Left is holding onto a value (just
    like a Just or Right). That means we can pull that attribute with .value for both
    our Left and our Right.'
