  md: "# Promises\n\nIf you like being able to write asynchronous JavaScript, but\
    \ don't like the mess that comes along with inversion of control, promises are\
    \ for you. Let's recap what we've seen so far. In direct style, you return values\
    \ from functions and use those values in other functions. In CPS (continuation\
    \ passing style), you invert control by the calling code supplying (and often\
    \ defining inline) a callback to be executed by the function that is called. Return\
    \ values become little better than meaningless, and instead the arguments passed\
    \ from the callback (one is conventionally called result) become the focus of\
    \ tests and subsequent callbacks.\n\nAlthough using callbacks opens up the possibility\
    \ of asynchronous code (without using some kind of polling), we introduce some\
    \ complexity both in the way we structure our functions and in the way we call\
    \ them.\n\nPromises shift this complexity to the function definition side of things,\
    \ leaving the function code with a relatively simple API. For most situations,\
    \ promises are a better choice than CPS. And where they're the right choice, CPS\
    \ probably isn't either. In those cases, you might be looking for stream handling,\
    \ observables, or some other high-level pattern.\n\n# The Basic Promise Interface\n\
    \nSo do we use promises? We'll cover their implementation soon, but for now, let's\
    \ see what the promise interface looks like:\n\n```\n// promises\nfour()\n  .then(addone)\n\
    \  .then(console.log);\n```\n\nThis is pretty straightforward. We have a function\
    \ that returns a 4 (wrapped in a promise), acted on by addone (which itself returns\
    \ a promise), which in turn is acted on by console.log.\n\nIf we're looking to\
    \ compose functions, promises are much easier to work with. Callbacks have us\
    \ stuck either hardcoding function names (and/or function literals of callbacks)\
    \ in the function declarations, passing them in as extra parameters in the function,\
    \ or using some other nontrivial and confusing alternatives.\n\nWith promises,\
    \ we are just chaining values together. We have a value (wrapped in a promise),\
    \ and then unwra by waiting (when necessary), then passes that value as a parameter\
    \ to the promise or function. To illustrate a bit more of the interface, we could\
    \ also write form 2:"
