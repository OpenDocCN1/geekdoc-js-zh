  md: 'Apparently, there was an intention to include and make use of the filesystem
    module at some point, but it was never realized. If you are actively working on
    some filesystem-based feature, then this should go. If you see something like
    this, especially with an accompanying comment:


    ```

    // use the file system for *something* later

    fs = require(''fs'')

    ```


    It is dead code of a particular type: speculative code. Maybe army and blankSong
    were speculative as well. The difference is intention, which is hard to tell without
    comments, supporting tests, or domain knowledge. You might also say they''re not
    dead code because they do nothing to execute (a couple of variables) whereas “real”
    dead code is unreachable/impossible to execute. For our purposes, it doesn''t
    matter. We treat all those cases the same: delete the code.


    Don''t comment it out. Any reasonably complex project should have some way of
    keeping track of feature (a bug log, feature tickets or “user stories,” etc.).
    If you comment out, your code is taking on extra work that it shouldn''t.


    There are two useful approaches to problematic comments. The first is simply to
    delete them. The second is to use as inspiration for creating a variable or function
    (explaining comments often indicate a good place to extract a function or variable),
    but in this section, we''re just covering what can be deleted. Feel free to delete
    this line for now, and save/run/check/commit the code.


    # Documentation: When Comments are Useful


    In any code of sufficient complexity and likelihood of being used by others, comments
    can be useful as documentation. These typically precede functions and classes
    (or objects) and describe what the function does, as well as the explicit parameters
    and return type. They may be responsible for helping to build external documentation.
    Obviously, we don''t want to delete these comments in the source files (compiled/minified
    files should strip these to make files smaller).


    ReadMes and tutorials can serve as a type of documentation as well, but high-quality
    descriptions of how code works, living as comments in the source files, are especially
    useful.


    Another interest of comments on the front end is to send secret messages to those
    who “view the source.” Usually this involves ASCII art and “Hey, developers! Work
    for us!”type notes.'
