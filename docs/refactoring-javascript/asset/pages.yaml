  md: "# # Is There Privacy in JavaScript?\n\nAs of this writing, there is no privacy\
    \ in JavaScript. Things are either in scope, or they're not. Unfortunately, having\
    \ an object and simply declaring some attributes as public and others as private\
    \ is not really possible. Because every attribute (property of an object) has\
    \ a \"this\" that it attaches to, for functions to be \"private\" in JavaScript,\
    \ they are necessarily also inaccessible.\n\nSo, practically speaking, at this\
    \ time we have two conventions to choose from. The first is to give up on that\
    \ dream and let attributes attach to some other this, with an eye towards the\
    \ subconventions of doing so in wrapping an anonymous function (à la revealing\
    \ module), or allowing this to attach to the global this for modules that are\
    \ exported. Because exporting is a whitelisting operation, only the functions\
    \ will be specified by other scripts. This is handy for having a smaller API,\
    \ but does complicate something.\n\nThe second (admittedly clunky) convention\
    \ is to let our functions bind to the public members, but give visual cues (prefixing\
    \ the function name with an_ (the most common) to indicate when something is intended\
    \ to be private.\n\nSo now, the meaning of private is more or less up to you,\
    \ as well as how you decide that what you term \"private.\"\n\nHowever, there\
    \ are proposals from TC39 (the committee that evaluates and determines JavaScript\
    \ features) related to privacy that are in the works. These include:\n\n+   *\
    \ Private fields\n\nIn this book, we are doing the same thing with these additions\
    \ as we're doing with the likely forthcoming async and await features: we're mentioning\
    \ them, but not going into detail. From the spec, this is the proposed new syntax\
    \ as this:\n\n```\nclass Foo {\n  #a;\n  #b;\n  #sum() { return #a + #b; }\n \
    \ printSum() { console.log(#sum)); }\n  constructor(a, b) { #a = a; #b = b; }\n\
    }\n```\n\nSo, #a and #b are both private (function/method) \"fields,\" and #sum\
    \ is a private \"method.\" These identifiers with a # would be unavailable outside\
    \ of the class text block. Thus, a new instance of Foo wouldn't have traditional\
    \ property-style access à foo.#a (or maybe foo.a—we don't know, and we're assuming\
    \ that wouldn't work anyway), foo.#b, or foo.#sum(). would be"
