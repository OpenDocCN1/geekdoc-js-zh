  md: "Instead of doing either of those, let's use the arrow syntax, which passes\
    \ the this context to the inner function and saves us from having to type the\
    \ word function so much. Awesome!\n\nYou might be wondering why we would ever\
    \ not use the arrow syntax. There are a few cases. Most importantly, you wouldnn't\
    \ want to use it in cases where the this you access to is going into the function.\
    \ For instance, you might expect the ths of a click handler in jQuery to refer\
    \ to the object clicked. If you use an arrow function, that won't be the case.\n\
    \nAnother reason is that in this form (ignoring the difficulty in passing parameters),\
    \ the functions are easy to extract or inline, as the syntax is very similar to\
    \ function declaration syntax:\n\n```\n// form 1\n\nchords.forEach(function myFunction(){\n\
    \  this.songList.allChords.add(chord);\n}, this);\n```\n\n```\n// form 2\n\nchords.forEach(myFunction,\
    \ this);\n\nfunction myFunction(){\n  this.songList.allChords.add(chord);\n};\n\
    ```\n\nIt's easy to convert between these two. If you start with an anonymous\
