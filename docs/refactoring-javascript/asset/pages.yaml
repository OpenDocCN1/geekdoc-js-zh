  md: '# Refactoring without tests: A historical note


    In the original 1992 work on refactoring, "Refactoring Object-Oriented Frameworks"
    by William Opdyke (and advised by Ralph Johnson) of "Design Patterns" fame, the
    word test appears only 39 times in a 202-page paper. However, Opdyke is inconsistent
    with refactoring as a process that preserves behavior. The term invariant appears
    125 times, and precondition comes frequently as well.


    In a nonacademic setting, 25 years after the original work, and in JavaScript,
    with its ecosystem of testing tools, preserving behavior are best facilitated
    by the processes we discuss in this book, and especially this chapter.


    However, if you''re curious about the initial ideas that went into refactoring,
    in a context likely a bit removed from your day job, checking out the original
    work is highly recommended.


