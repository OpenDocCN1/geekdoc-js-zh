    \ also applies now: if we add information about states to Person, then Person\
    \ becomes more complex and less focused. Said, it might be worth it in some cases\
    \ to centralize transition information.\n\n# State Pattern Versus State Machine\n\
    \nThere is a bit of crossover between the state pattern and the state machine.\
    \ Although the ideas are related, state machines tend to focus on the states themselves\
    \ and transitions between them, rather than providing a unified interface for\
    \ common functions. Although you gain simplicity by virtue of having one class/object\
    \ controlling all of your states and transitions (typically callback functions\
    \ to execute transitions as well), you lose the simplicity of a unified interface\
    \ in any given state. That means more type checking (if statements), and is a\
    \ likely place for complexity to accumulate over time.\n\nAnd now, some unfortunate\
    \ news about the state pattern."
