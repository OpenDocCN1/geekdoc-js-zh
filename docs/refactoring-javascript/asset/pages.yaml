  md: '# One More Thing About IIFEs


    We just used an IIFE as the right side of our assignment statement. In that case,
    the variable is likely a good candidate to export as a module.


    In other cases, where an IIFE is used specifically to reduce the scope of the
    code inside, we can use a block instead. So this:


    ```

    function(){

    // code we don''t want outside of this scope

    }();

    ```


    becomes this:


    ```

    {

    // code we don''t want outside of this scope

    }

    ```


    But if you try to use a block, meaning {}, on the right side of an assignment
    (as we did with an IIFE), it will be interpreted as an object and likely give
    an error. In those cases, you''re stuck with the IIFE.


    Getting back to our classifier, how would we use Object.create for a factory function?
    It turns to be very simple, and it relies on the object literal syntax much more
    than we rearranged things to use new with the constructor functions in the last
    section:


    ```

    const classifierTemplate = {

    songList:

    allChars: new Set(),

    ...}

    const wish = require(''file''); () => {

    var classifier = Object.create(classifierTemplate);

    ```


    To make this work, we only need two changes from what we did with the object literal.
    In we need to regard our initial object as a template, so we rename it classifierTemplate.
    Second, in our tests (which refer to classifier), we create the classifier by
    passing the template to Object.create. Note that we are just using an object literal
    here, not a function or IIFE, because we don''t have anything that are about being
    private at the module.


    In case you forget what a factory function with Object.create and a constructor
    function have have over using the object literal, the main one is that there are
    ways to create multiple classifier variables. The songList is a property of classifier,
    and as a nested object, a new version of it will be created for each classifier,
    even though it uses the object literal syntax. Object.create and'
