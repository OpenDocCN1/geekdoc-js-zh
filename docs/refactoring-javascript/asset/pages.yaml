  md: "arguments to function). By default, the language will be English, but if a\
    \ second argument is passed in, the language will be whatever that is instead.\n\
    \nNote that this does create some complexity in the function definition, as you\
    \ have two potential paths inside one. Additionally, the function calls will not\
    \ necessarily all the same.\n\nIt's better to use default arguments for something\
    \ that's truly default, rather than just a common case. For instance, initially\
    \ marking a word in a vocabulary as studied = false would make sense because it's\
    \ not possible for it to have been studied before it enters the system.\n\nAs\
    \ the second reason to subclass, let's look again at our lookUp function:\n\n\
    ```\nclass Word {\n  lookup() {\n    if (this.language === \"Japanese\") {\n \
    \     return `https://jisho.org/search/${this.word}`;\n    } else {\n      return\
    \ `https://en.wiktionary.org/wiki/${this.word}`;\n    }\n  }\n};\n```\n\nIf statements\
    \ are not necessarily a bad thing, but better code will to avoid them through\
    \ subclassing or some other polymorphic mechanism. If we delete the lookUp function\
    \ from the superclass and add to the subclasses, we'll end up with implementations\
    \ like this:\n\n```\nclass EnglishWord extends Word {\n  lookup() {\n    return\
    \ `https://en.wiktionary.org/wiki/${this.word}`;\n  }\n};\n```\n\n```\nclass JapaneseWord\
    \ extends Word {\n  lookup() {\n    return `http://jisho.org/search/${this.word}`;\n\
    \  }\n};\n```\n\nThis works great, and we have two tiny functions (three lines\
    \ each) instead of one small function (five lines). Overall, we gained a line,\
    \ but both functions are independently, simpler to test. Better still, we have\
    \ only one code path for each of them. This may seem subtle, but it means that\
    \ should either grow in complexity—for example, switching dictionaries for different\
    \ kinds of words (within a language)—the complexity will grow in a smaller context.\
    \ if statements tend to lead to more if"
