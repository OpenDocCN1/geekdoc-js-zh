    # Less intuitive aspects of types


    On the seemingly less awesome of type documentation (and code itself), the functional
    style prefers variable names, which can be a bit of a shock. Take a look at the
    type signature of Haskell''s map function (specifically for lists):


    ```

    map :: (a -> b) -> [a] -> [b]

    ```


    The grouping of the parentheses (a -> b) indicates that map takes a function as
    its first argument, which itself takes one input (a) and has one output (b). map
    also takes an array of [a]. It outputs an array of [b]. The a and b seem like
    excellent candidates for very bad names (short and nondescriptive), but there
