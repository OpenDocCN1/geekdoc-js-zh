    \n# Which Loop to Choose?\n\nBack to the hard stuff. Next up: Loops.\n\nIn our\
    \ train function, we have the following loop:\n\n```\nfor (index = 0; index <\
    \ chords.length; index++){\n  if(!allChords.includes(chords[index])){\n    allChords.push(chords[index]);\n\
    \  }\n}\n```\n\nThis is a for loop. We have other options.\n\n```\nindex = 0;\n\
    while(index < chords.length){\n  if(!allChords.includes(chords[index])){\n   \
    \ allChords.push(chords[index]);\n  }\n  index++;\n};\n```\n\nThis is a while\
    \ loop. It's a bit better suited for chords that don't involve a value increasing\
    \ incrementally. Otherwise, it moves (the set variable; condition; update) respect\
    \ of the loop to reach different areas.\n\n```\nindex = 0;\ndo{\n  if(!allChords.includes(chords[index])){\n\
    \    allChords.push(chords[index]);\n  }\n}\n```"
