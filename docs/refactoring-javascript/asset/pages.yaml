    console.log(display(tigerify(capitalize(personTwo.name))));\n```\n\nIt's actually\
    \ about the same number of lines. Is it better to have a conditional in every\
    \ function or have two functions in different classes? Now that we see them by\
    \ side, let's talk about the pros and cons of using the null object pattern:\n\
    \nPros:\n\n+   - You can use console.log and actually find out about your values.\n\
    - You can do anything you want in the function body.\n- You can have the null\
    \ object inherit and override functions (from NameString).\n- It's very easy to\
    \ forget a null check. Having a complete API to duplicate may seem more straightforward\
    \ to you.\n\nCons:\n\n+   - You might have the classes in two separate files by\
    \ convention, creating overhead in searching the project.\n- You might buck the\
    \ convention of separating them by having them in the same file. This also creates\
    \ overhead in searching the project.\n- You might have teammates who don't like\
    \ the idea of null objects, dont understand the stand of null objects, or just\
    \ care about null objects (this is the case with pretty every pattern or quality\
    \ concern in general).\n- Since null and undefined are so commonly returned, your\
    \ codebase is unlikely to be completely null/undefined free. That means you will\
    \ probably end up with inconsistencies and some confusion from people unfamiliar\
    \ with the patterns you implement.\n- Because returning null/undefined is so common,\
    \ if you want consistent expectations for not returning null/undefined, you'll\
    \ likely need to adapt a lot of your codebase as third-party APIs."
