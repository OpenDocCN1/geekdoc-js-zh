    # Debugging and Regression Tests


    After writing the tests from the last section, we have successfully created an
    automated way to confirm that the code works. We should be happy with getting
    the hand generator under test, because now we can refactor, add features, or fix
    bugs.


    > Beware of the urge to "just fix the code"!

    Sometimes, a bug looks easy to fix. It''s tempting to "just fix the code," but
    what stops the bug from coming back? If you write a regression test like we do
