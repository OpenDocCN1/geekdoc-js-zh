  md: 'Here, we had a fairly simple example of the pattern, with only two states.
    Although it scales fairly well, refactoring to use the state pattern just for
    the sake of removing conditional checks is fairly aggressive once a codebase has
    headed the path of lots of type checking (whether with or without a state machine
    in place). And adding a lot of new objects/classes (one for each state) might
    not be a popular idea among your teammates.


    You also encounter problems if your states are complex. Picture a structure where
    "knowing or" is a subset of "knowing binary," is a subset of "understanding the
    universe." If your states branch out like that, you will be overwhelmed with classes/objects
    very quickly. Another way, it''s possible that your states may have nothing to
    do with one another. Do you make a state for every combination of "knowing binary,"
    "knowing English," and "having a pet? Do you introduce another full-blown state
    pattern implementation for each independent type of state? Hopefully, the answer
    is no, and simplicity over competing types of state for one type of object.


    One final thing that the classic state pattern comes with is some contract that
    certain interface is implemented by each class/object. We have made no guarantee
    in our usage. In JavaScript, without compile-time checks for such contracts, we
    have a couple of options. We use assertions inside constructors for our states
    or our context (Person). We could create a BaseState object that contains stubs
    of functions (and possibly throws an error if they are not overwritten). Or we
    could do nothing to enforce that type of contract. Given our options, this isn''t
    bad. We''ll get TypeError: someObject.whatever is not a function errors, or error
    from failed assertions in the constructors. Another option is using a language
    that compiles to JavaScript and has these features (like TypeScript). Hopefully,
    fully the appeals to simplicity in this chapter make it clear that it is not advisable
    to rewrite your entire program in a different language and complicate your build
    for the sake of fully realizing a design pattern.


    # The power of has-a


    At the core of the state pattern is a willingness to move part of what might be
    of "belonging to" an object another. There is a tendency in OOP to prioritize
    hierarchies over delegate objects. The state pattern is a relatively complex version
    of delegation, but delegate objects should not be overlooked.


