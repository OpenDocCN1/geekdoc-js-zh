    With those thoughts in mind, a few additional patterns worth exploring are:


    # Composite


    This pattern is good for traversing trees of data, such as JSON/objects/document
    nodes.


    # Builder


    Used for complex object creation, this pattern is good for generating test data.


    # Observer


    This pattern can be seen in things like publish/subscribe, events, and observables.


    # Prototype


    This pattern is built into JavaScript.


    # Iterator


    Building your own iterator is an unlikely choice given the wealth of native options
    for iteration (including loops, array comprehension functions, and generators).


    # Proxy


    We actually see an example of this in Chapter 10 when we use the testdouble framework,
    which allows "faking out" the real function call as well as asserting that the
    function was called. Note there is also a native proxy object in JavaScript, and
    it is another possible approach to wrapping an object with withNull, as we covered
    earlier.


    The Go book doesn''t have a monopoly on design patterns, nor do object-oriented
    languages or web applications. In some languages or problem domains, a pattern
    might be very popular or easy to implement. JavaScript, given it spans so many
    paradigms and applications, has a large pool of architectural ideas to draw from.
    If you are looking for new patterns to think about, embedded programming, operating
