  md: 'But in the context of refactoring, we don''t care if this behavior changes
    yet, because we won''t be refactoring it. When we have any code that lacks tests
    (or at least documented way of executing it), we do not want to change this code.
    We can''t refactor it, because we won''t be able to verify that the behavior doesn''t
    change. Later in the book, we''ll cover creating "characterization tests" to deal
    with untested code.


    This situation isn''t confined to legacy code either, then need at risk. It''s
    also impossible to refactor new, untested code without tests, whether they are
    automated or manual.


    # How Conversations About Refactoring Should Go Until Tests Are Written


    +   "I refactored login to take email address and username"

    - "No, you didn''t."

    - "I''m refactoring the code to ____"

    - "No, you aren''t."

    - "Before we can add tests, we need to refactor."

    - "No."

    - "Refactoring th-"

    - "No."

    - "Refa-"

    - "No."


    # Why Don''t We Care About Performance?


    As far as refactoring goes, we initially care about performance. Like with our
    doubling function couple of sections back, we care about our inputs delivering
    outputs. Most of the time, we can lean on the tools given to us and our first
    guess at an implementation will be good enough. The mantra is to "write for humans
    first."


    Good enough for a first implementation means that we''re able to, in a reasonable
    amount of time, determine that the inputs yielded expected outputs. If our implementation
    does not allow for that it takes too long, then we need to change the implementation.
    But by that time, we should have tests in place to verify inputs and outputs.
    When we have tests in place, then we have confidence to refactor our code and
    change the implementation. If we don''t are putting behavior we really care about
    (the inputs and outputs) at risk.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Although it is part of what is called nonfunctional testing characteristics
    and generally not the focus of refactoring, we can prioritize performance characteristics
    (and other "nonfunctional" aspects of the code like usability) by making them
    falsifiable, just like the program''s correctness. In other words, we can test
    for performance.


    Performance is privileged over nonfunctional aspects of a codebase that is relatively
    easy to evaluate to a similar standard of correctness. by "benchmarking" our code,
    we create tests that fail when performance (e.g., of a function) is too slow,
    and pass when performance is acceptable. We do this by making the running of the
    function (or other process) itself the "input," and designating the time (or resource)
    as the "output."


    However, until the performance is under some verifiable testing of this format,
    it would not be considered "behavior" that we are concerned about or not changing.
    If we have functional tests in place, we can adjust our implementations freely
    until we decide on some standard of performance. At that point, our test suite
    grows to encompass performance characteristics.


    So in the end, caring about performance (and other nonfunctional aspects) is a
    secondary concern when we decide to create expectations and tests around it.


    # JavaScript''s Particular Difficulties with Performance


    For some types of JavaScript (see Chapter 2), it will be completely impossible
    to either change (unsafe) or refactor (safe) your code without changing performance.
    Adding a few lines of frontend code that don''t get minimized will increase the
    time for downloading and processing. The incredible amount of build tools, compilers,
    and implementations might perform any number of tricks because of how you structured
    your code.


    These things might be important for your program, but just to be clear, refactoring''s
    promise of "not changing behavior" must not apply to these situations. Subtle
    and difficult-to-control performance implications should be treated as a separate
    concern.


    # What Is the Point of Refactoring if Behavior Doesn''t Change?


    The point is to improve quality while preserving behavior. This is not to say
    that fixing bugs in code and creating new features (writing new code) are not
    important. In fact, these two types of tasks are tied more closely to business
    objectives, and are likely to receive much more direct attention from project/product
    managers than concerns about the quality of the codebase. However, those actions
    are both changing behavior and therefore are distinct from refactoring.'
  merge: -1
