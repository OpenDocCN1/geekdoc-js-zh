    \ for that check even if we wanted.\n\n# Subclassing? Just to avoid a conditional?\n\
    \nYou may be skeptical of subclassing being the best way to avoid conditionals.\
    \ Sometimes you'll prefer a simple conditional to subclass. Other times, you may\
    \ want to skip subclassing and the conditional altogether see (\"Strategy\" on\
    \ page 284).\n\nThere are many ways to avoid conditionals, but simplifying functions\
    \ to not ask \"what am I?”-type questions is key. This is sometimes times called\
    \ \"tell, don't ask\",\n\n![](img/25446dec1fb455dfb6ac99424735816c_275_0.png)\n\
    \nYou might find that the lookup URL itself is valuable. As with the language,\
