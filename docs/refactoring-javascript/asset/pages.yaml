  md: "Presumably, in a real application, we'd have a bit more to our Person objects,\
    \ which might justify using a class (or at least an object) rather than just the\
    \ function as we did here. However, it's entirely possible to organize your code\
    \ as a series of functions and return values. Look for opportunities to do both.\n\
    \nSince this chapter is primarily for the purpose of illustrating object-oriented\
    \ patterns, we'll ignore the functional variant for now.\n\n# Strategy\n\nThe\
    \ template method pattern allowed us to remove a conditional through subclassing.\
    \ The strategy pattern allows us to remove the subclasses by attaching a strategy\
    \ (function) to the parent object.\n\nLet's take a look at what we have:\n\n```\n\
    class Person{\n  log(number) { console.log(this.whatIs(number)) };\n}\n\nclass\
    \ BinaryKnower extends Person{\n  what(number) { return Number('0b' + number);\
    \ };\n}\n\nclass BinaryOblivious extends Person{\n  what(number) { return number\
    \ ); };\n}\n\nconst personOne = new BinaryKnower();\nconst personTwo = new BinaryOblivious();\n\
    [personOne, personTwo].forEach(person => person.log(10));\n```\n\nAs we trick\
    \ eye to the Person class in the last section, now let's consider whether we need\
    \ subclasses. We could avoid this by setting a type value in the constructor and\
    \ recreating the conditional in the whatIs function that we had earlier in the\
    \ \"test\" (code logging output):\n\n```\nclass Person{\n  constructor(knowsBinary){\n\
    \    this.knowsBinary = knowsBinary;\n  }\n  log(number) { console.log(this.whatIs(number));\n\
    \  whatIs({\n    if(this.knowsBinary){\n      return Number('0b' + number);\n\
    \    } else{\n      return number;\n    }\n  }\n}\n```"
