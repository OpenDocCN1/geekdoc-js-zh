  md: 'Additionally returning this opens us to the possibility of having a fluent
    interface, which means we could chain functions like this:


    ```

    object.set(3).set(4).set(5);

    ```


    # Fluent interfaces


    ![](img/25446dec1fb455dfb6ac99424735816c_134_0.png)


    Fluent interfaces can be useful for things like aggregating database query conditions
    or bundling up DOM manipulations (jQuery does this). You might also see this described
    as chaining functions. This is a common and useful pattern in both OOP and FP
    styles. OOP, it tends to be a result of returning this, whereas in FP, it commonly
    returns map, which returns an object (or functor, actually) of the same type (instance,
    arrays "map") to other arrays and promises "then" onto others.


    In FP style (and in the wrapper OOP patterns), you’ll see more of this:


    ```

    f(g(h()));

    ```


    That might seem very awkward in comparison with fluent interfaces, FP has great
    strategies for combining/composing functions. We’ll look at those more in Chapter
    11.


    All this is to say: if you’re returning undefined anyway, returning this instead
    will provide more information and better interfaces.


    As far as context goes, that’s about as complicated as it gets without delving
    into prototypes (the three or four that means), inheritance, mixins, modules,
    constructors, factory functions, properties, descriptors, getters, and setters.


    After this chapter, it’s all about better code through better interfaces. We won’t
    shy away from the topics in the previous paragraph, but we won’t make idols of
    any patterns either. This book is meant to explore many different ways to improve
    code.


    Any coding style you fall in love with is bound to be someone elses heresy. JavaScript
    presents many opportunities for both reactions.


    # Context Part 2: Privacy


    The last topic in this chapter is of “private” functions, and what means in JavaScript.
    Scope is a broader topic of hiding and exposing behavior that we’ll explore through
    examples later on. For now, we are only concerned with the privacy of functions,
    because we noted earlier, private functions have unique implications for testing.'
