  md: "Reordering our code a bit, we could express our object-returning code more\
    \ concisely like this:\n\n```\n// module pattern\nvar secretTemplate = (function(){\n\
    const secret = 'skrit';\nconst secretFunction = function(){\n  return secret;\n\
    }\ntotallyNotSecret = \"I'm defined in the global scope\";\nreturn {\n  normalInfo:\
    \ 'this is normal',\n  notSecret() {\n    return secret;\n  }\n}}();\nconst s\
    \ = Object.create(secretTemplate);\nconsole.log(s.normalInfo); // 'this is normal'\n\
    console.log(s.secret); // undefined\nconsole.log(s.secretFunction()); // error\n\
    console.log(s.notSecret()); // 'skrit'\nconsole.log(s.totallyNotSecret); // \"\
    I'm defined in the global scope\"\n```\n\nThis uses the module pattern, not to\
    \ be confused with modules to import and export packages. A popular variation\
    \ on the module pattern is the *revealing module pattern*, shown here:\n\n```\n\
    // revealing module pattern\nvar secretTemplate = (function(){\nconst secret =\
    \ 'skrit';\nconst secretFunction = function(){\n  return secret;\n}\ntotallyNotSecret\
    \ = \"I'm defined in the global scope\";\nconst normalInfo = 'this is normal',\n\
    const notSecret = function(){\n  return secret;\n}\nreturn {\n  normalInfo, notSecret\n\
    });\n\nconst s = Object.create(secretTemplate);\nconsole.log(s.normalInfo); //\
    \ 'this is normal'\nconsole.log(s.secret); // undefined\nconsole.log(s.secretFunction());\
    \ // error\nconsole.log(s.notSecret()); // 'skrit'\nconsole.log(s.totallyNotSecret);\
    \ // undefined\nconsole.log(totallyNotSecret); // \"I'm defined in the global\
    \ scope\"\n```\n\nThis is a cleaner, as it makes the object that is returned very\
    \ concise and readable."
