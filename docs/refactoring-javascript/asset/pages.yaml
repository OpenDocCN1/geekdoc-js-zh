    The interface tests may not be terribly surprising. However, with our hierarchy
    variants that follow, these are the ones we''ll really care about preserving.


    The internals tests are less straightforward. typeof only manages to tell us that
    JapaneseWord is an object and JapaneseWord is a function. The best information
    here is probably that JapaneseWord is an instance of both JapaneseWord and Word.
    By contrast, JapaneseWord is a class, so it''s not an instance of Word.


    In the next lines, we can see that the constructor for JapaneseWord (the object)
    is JapaneseWord (the class) and the prototype of JapaneseWord (the class) is Word
    (the class).


    From there, things get a bit sketchy. The prototype of japaneseword evaluates
    to an empty object, but if you log it, you''ll get a bit more info: JapaneseWord
    {}.


    If you want to go deeper than these prototypes, you should know a few things:


    +   * There''s a "standard" popular alternative to `Object.getPrototypeOf(thing)`,
    which you use like: `thing.__proto__`

    * `Object.getPrototypeOf` has the alias `Reflect.getPrototypeOf(thing)`.

    * There''s another prototype inspection attribute that you can use like this:
    `thing.prototype`. It''s super unreliable.

    * Partly because there''s so much nonsense and inconsistency around prototypes,
    when people talk about the "real, true, deep-down" prototype of something, when
    they use syntax like `[[Prototype]]` to indicate they mean the *real* prototype,
    as opposed to the five ways of actually interrogating an object.


    There are some subtle and nuanced opinions concerning prototypes, but for the
    sake of refactoring our example, we only care that the interface is served. For
    a more sympathetic and detailed exploration of prototypes in JavaScript, I''d
    recommend reading *this & Object Prototypes*, from the "You Don''t Know JS" series.


    # Let''s Wreck Our Hierarchy


    Now that we have a nice hierarchy set up, let''s break it down, exploring these
    options:


