- img_proc: true
  md: "Additional confusion arises when a parameter is used by the function being\
    \ referenced. If our function visit looked like this:\n\n```\nfunction visit(siteUrl)\
    \ {\n  window.location = siteUrl;\n}\n```\n\nsome people would be tempted to write\
    \ the click handler like this:\n\n```\n$$('.my-button').on('click', visitSite('http://refactoring.js'));\n\
    ```\n\nBut that won't work. In this case, the most obvious solution would be using\
    \ an anonymous function to wrap the call before:\n\n```\n$$('.my-button').on('click',\
    \ function() {\n  visitSite('http://refactoring.js');\n}\n```\n\nAnother solution,\
    \ which applies not only to the function of jQuery but to native JavaScript functions\
    \ like forEach and map, is to pass another argument along the others. In many\
    \ cases, what you pass will end up being the \"implicit\" parameter of the function\
    \ that you are calling, but if you are defining a function taking a function as\
    \ an argument, you could also design the function signature to take arguments\
    \ that will become explicit arguments to the function passed.\n\nIn any case,\
    \ when you are passing functions inside functions, you should keep two things\
    \ in mind. First, consult the API of the function that takes a function as argument\
    \ for any optional arguments that can be passed in, and what happens when they\
    \ are not. Second, recognize that JavaScript calls will work fine with too many\
    \ or too few arguments. You will get an error inside the function if you try to\
    \ call it and make use of a parameter that was not defined by the signature. Also,\
    \ any parameters that are unfulfilled by the call will be set as undefined.\n\n\
    # Streamlining the API with One Global Object\n\nAt this point, we have everything\
    \ wrapped up into functions, but we still have many global variables floating\
    \ around our functions as variables set without var. In this section, we have\
    \ two goals. The first is to reduce the scope of the global variables we have.\
    \ The second is to design our API—in other words, make decisions about how our\
    \ code will be used.\n\nFor the style of code we are exploring here, we want one\
    \ main object, which we will call classifier, and it will hold all of the functions\
