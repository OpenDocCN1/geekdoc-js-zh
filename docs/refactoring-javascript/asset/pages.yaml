    \ the counter value as it walks through the songList.\n\nWe can also use a filter,\
    \ rather than a foreach, to help us count the elements. The filter function returns\
    \ a new array of elements that matched the condition:\n\n```\nchordCountForDifficulty:\
    \ function(difficulty, testChord) {\n  return songList.reduce(function(counter,\
    \ song) {\n    if(song.difficulty === difficulty) {\n      counter += song.chords.filter(function(chord)\
    \ {\n        return chord === testChord;\n      });\n    }\n  });\n```\n\nWe get\
    \ the length of this array and add it to the counter. This means fewer updates\
    \ to the counter. We shaved two lines off the chordCountForDifficulty function.\
    \ We could have used a second reduce instead of filter if we wanted to focus more\
    \ on the count than the conditional, but that would mean an innerCount variable,\
    \ which seems a bit clunky.\n\n# Performance Impacts\n\nThe changes we've made\
    \ to query on an as-needed basis, rather than create structures for later needs,\
    \ are for refactoring purposes reducing the size of the code.\n\nDepending on\
    \ the data access patterns of your program, this strategy might make your program\
    \ slower or faster. Transforming structures into others (shallower) ones that\
    \ will never be used if frequently could produce some performance benefit. All\
    \ of this comes with the caveat that a given JavaScript platform might optimize\
    \ your code in ways you don't expect.\n\nWe'll discuss memoization along with\
