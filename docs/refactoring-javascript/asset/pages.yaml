  md: 'The main purpose of testing is to have confidence in your code. This confidence
    can-not be born in a vacuum. It’s forged in the skepticism developed from seeing
    code that errs and resists change. As we will see in “Debugging and Regression
    Tests” on page 77, confidence is the best indicator of how and to test. The greatest
    reason to learn testing is to develop your senses of confidence and skepticism
    when looking at a codebase. If that sounds a bit abstract, don''t worry. More
    concrete reasons for testing are coming up in the next section.


    First, a quick note on some terms we''ll be using:


    Coverage (also code coverage or test coverage)


    This is a measurement, most usefully a percentage, of the lines of code that are
    covered by tests.


    High-level and low-level


    Just like ordinary code, tests can be broad (high-level) or more involved in details
    (low-level). These are general terms, but for the two most important types of
    tests we’ll cover, *high-level* will generally correspond to “end-to-end tests”,
    whereas *low-level* will correspond to “unit tests.”


    Complexity


    This is a measurement of the pathways through the code. It tends to be more casually
    and generally referred to as *complexity*, rather than its ancestor cyclomatic
    complexity.


    Confidence


    This is, ultimately, why we test. Full test coverage gives us confidence that
    the whole codebase behaves as we intended. There are some caveats to this, covered
    by “Nonfunctional Testing” on page 32 and “Test-driven development” on page 37.


    Exercised


    A line of code is said to be *exercised* if it is run by the test suite. If a
    line is exercised, then it has coverage.


    Technical debt


    This is the situation where a lack of confidence and trust (via complexity and
    a lack of test coverage) in the codebase results in more guesswork and slower
    development overall.


    Feedback loop


    This is the gap between writing code and knowing if it is correct. A “tight” or
    “small” feedback loop (versus “loose” or “long” one) is good, because you know
    right away when your code is functioning as expected.'
