  md: '# Don''t forget to use new in constructor functions


    If you forget new when calling constructor function, your function may still run
    fine, but there''s a chance it won''t. This is because this will be bound to the
    global object (or undefined in strict mode).


    Sometimes, this fear (what if people forget the new keyword?) is cited as the
    main motivation behind preferring Object.create over new with a constructor function.
    The stronger case for Object.create has to do more than seeking consistency and
    with not obscuring JavaScript''s prototypical nature, rather than using the "pseudoclassical
    style" that constructor functions (and classes) with new.


    On the more flexible side of things, the parentheses after the constructor call
    following new are optional when no arguments are passed to the function. It''s
    a bit weird, but these are the:


    ```

    this.songlist = new Songlist();

    this.songlist = new Songlist();

    ```


    There is an important difference between creating objects like this and using
    object literals. If you use an object literal, you are stuck down cloning/deep
    copying/Object.create hijacks to get a new version. As we explored earlier, assigning
    some-to a new variable = just creates a new reference to the same object: two
    pointers to the same moon. If you need more than one moon, you''re going to need
    new, Object.create, class, and/or some other copying/cloning utility. If you know
    that''re going to want more than one object, object literals might not be the
    best starting point for creating them.


    This snippet also demonstrates another result of this change: we have to add this
    to all of our properties when we use a constructor function. Also notice that
    this syntax forces us to add our function keywords back in with the colons replaced
    with equal signs. Lastly, the commas at the end of statements have been replaced
    with semicolons (or not, in special cases, if you''re one of those people).


    ![](img/25446dec1fb455dfb6ac99424735816c_253_0.png)'
