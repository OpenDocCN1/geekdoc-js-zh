  md: 'Once we start doing this, we''re actually doing the job of the test runner
    part of a test framework: one with very few features, tons of duplication and
    inconsistency. Natural as it might be, this is a sure path to guesswork and frustration
    with temporary fits of confidence.


    # Look for These Symptoms


    Do you find programming to be an emotional rollercoaster, cycling between swearing,
    pumping your fist into the air saying "Yes!" and then some more swearing.


    This a sign your feedback loop is not tight enough. Getting too excited or disappointed
    about things working or reflects a state of surprise. It is very hard to be surprised
    if you are working in small steps, testing frequently, and using version control
    to maintain a recent and good version of the code.


    Is it boring not to type your code yourself? Maybe. Will you save a lot of time
    by not having to guess and redo work? Definitely.


    Instinctively, new coders will manually test this as they write the code, and
    delete all of the console.log statements afterward, effectively destroying any
    test-like coverage that they have. Because we know that tests are important, we
    will get our coverage back after we''ve written the tests, but isn''t it odd to
    write these weird tests, delete them, and then write better versions after?


