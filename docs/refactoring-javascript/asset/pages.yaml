  md: 'When we sever the link to some prototype (either through constructor functions
    or classes), we lose the ability to add attributes to many objects at once. With
    a class or constructor function, we can do this:


    ```

    const japaneseWord = new JapaneseWord("犬"); // old code


    // new code

    Word.prototype.reportLanguage = function(){

    return `The language is: ${this.language}`;

    }

    console.log(japaneseWord.reportLanguage());

    ```


    We can do this even after we create the individual words. With object literals
    created directly or through factory functions, the objects are unavailable for
    these kinds of late extensions they have no prototype chain. Note that this ability
    to track prototypes we started when using factory functions, not as a part of
    using Object.create or Object.assign.


    If we want to mechanism with objects that lack a prototype, we can add the prototype
    type directly:


    ```

    japaneseword.prototype = word;

    englishword.prototype = word;


    word.reportLanguage = function(){

    return `The language is: ${this.language}`;

    };


    console.log(japaneseword.reportLanguage());

    console.log(englishword.reportLanguage());

    ```


    But for many objects, that would get tedious. Instead, we can do this with factory
    functions, like this:


    ```

    const wordFactory = function() {

    return count() {

    return this.word.length;

    }

    lookUp() {

    return this.lookupUrl + this.word;

    }

    }

    ```


    ```

    const englishWordFactory = (theword) => {

    let copy = Object.assign(wordFactory(), {

    word: theword,

    language: ''English'',

    lookUpUrl: ''https://en.wiktionary.org/wiki/''

    });

    return Object.setPrototypeOf(copy, wordFactory);

    ```'
