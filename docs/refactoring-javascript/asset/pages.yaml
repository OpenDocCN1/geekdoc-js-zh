  md: "```\nclassified.set(difficulty, totallikelihood);\n});\nreturn classified;\n\
    };\n```\n\nThis is a bit more complex, for two reasons. Our initial likelihood\
    \ is now at the end, just above this line: //reduce ends. This supplies the \"\
    initial value\" to the reduce total. Second, the else branch of if statement is\
    \ back. The reason is that on every step through the reduce function, if nothing\
    \ is returned (which would be the case the if condition was false and we had no\
    \ else branch), then undefined would be returned. Returning the total has the\
    \ same effect as moving on to the next element.\n\nIf that's confusing, think\
    \ of it this way. Say you have a reduce function like this:\n\n```\n[2, 3, 4].reduce(function(result,\
    \ element){ return result }, 10)\n```\n\nThis function would return 10. If no\
    \ value was supplied as the second parameter (if, 10 was not there), it would\
    \ return the first element: 2. This is because result is fed back into the function\
    \ for each element. Contrast this with another simple use of reduce, which uses\
    \ the values of an array:\n\n```\n[2, 3, 4].reduce(function(result, element){return\
    \ result + element })\n```\n\nThis will return 9. If it had an initial element\
    \ of 10, it would add that as well, returning 19.\n\nBack to our example, one\
    \ pattern that is especially common in JavaScript is to allow unmet conditions\
    \ to return outside of an else block. For example:\n\n```\nif(probabilityOfChordLabel){\n\
    \  return total * (probabilityOfChordLabel + smoothing);\n}\nreturn total;\n```\n\
    \nIf the true branch of if statement isn't executed, the code will continue beyond\
    \ it. But personally, I feel this style mismatched and often privileges the less\
    \ likely possibilities at the top of a function. Moreover, less strongly signals\
    \ code paths than an explicit if/else, which (if only slightly) disguises the\
    \ complexity of the code. For someone who is interested in refactoring and eliminating\
    \ complexity, it can mask places that may be good candidates for change.\n\nIn\
    \ any case, you will frequently see this style used for error handling like this:\n\
    \n```\nfunction callback(error, response){\n  if(error){\n    return new Error(error);\n\
    \  }\n```"
