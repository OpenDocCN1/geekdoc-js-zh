  md: "Here’s how it starts: functions are just a circle (Figure 5-2).\n\n![](img/25446dec1fb455dfb6ac99424735816c_115_0.png)\n\
    \nFigure 5-2. Just a circle\n\nSimple enough. We'll be adding parts to represent\
    \ the following:\n\n+   * Bulk\n* Inputs\n* Outputs (return values)\n* Side effects\n\
    * Context\n* Privacy\n\nBefore the chapter is through, we will have explored all\
    \ of these components through this diagramming technique, making note of qualitative\
    \ differences between them along the way.\n\n# Function Bulk\n\nWe use the term\
    \ bulk to describe function bodies. It refers to two different but related characteristics:\n\
    \n+   * Complexity\n* Lines of code\n\nJavaScript linters (described in Chapter\
    \ 3) pick up on both of these things. So if you're using one as part of a build\
    \ process (or preferably within your editor), you should see warnings for both\
