  md: "```\nconsole.log(s.secret); // undefined\nconsole.log(s.secretFunction());\
    \ // error\nconsole.log(s.notSecret()); // 'skrit'\nconsole.log(s.totallyNotSecret);\
    \ // undefined\nconsole.log(totallyNotSecret); // \"I'm defined in the global\
    \ scope\n```\n\nAn alternative to creating objects with the new keyword is using\
    \ Object.create.\nBefore we change our classifier, let's observe the differences\
    \ between this constructor and struct, as well in the next snippet:\n\n```\n//\
    \ factory function\nvar secretTemplate = (function(){\n  var obj = {};\n  obj.normalInfo\
    \ = 'this is normal';\n  const secret = 'skrit';\n  const secretFunction = function(){\n\
    \    return secret;\n  };\n  obj.notSecret = function(){\n    return secret;\n\
    \    totallyNotSecret = \"I'm defined in the global scope\"\n    return obj;\n\
    \  };\n});\nconst s = Object.create(secretTemplate);\nconsole.log(s.normalInfo);\
    \ // 'this is normal'\nconsole.log(s.secret); // undefined\nconsole.log(s.secretFunction());\
    \ // error\nconsole.log(s.notSecret()); // 'skrit'\nconsole.log(s.totallyNotSecret);\
    \ // undefined\nconsole.log(totallyNotSecret); // \"I'm defined in the global\
    \ scope\"\n```\n\nSo, when we use Object.create, we need to supply an object to\
    \ be patterned from.\nTo retain the flexibility of using a constructor with new,\
    \ we end up returning an object inside of the function. Note that this function\
    \ is an IIFE. However, we could use a normal function as well:\n\n```\nvar secretTemplate\
    \ = function(){\n  ...\n};\nconst s = Object.create(secretTemplate);\n```\n\n\
    This gives us the same object, but seems a bit less clear. Also, in this construction,\
    \ the function will have to run every time we create a new object. In the IIFE\
    \ version, the secretTemplate function only has to run once, and to create new\
    \ objects we just reference the template object that was created."
