  md: 'The JavaScript in the file, called main.js, runs on page load. It''s about
    2,000 lines. There are some functions declared, mostly attached to an object like
    so that jQuery will its magics. Others are declared with function whatever() so
    that they are in the global scope. Objects, arrays, and variables are created
    along the way, and freely changed throughout the file. A half-hearted attempt
    at Backbone, React, or some other framework was made at one point for a crucial
    and complicated features. Those parts break often, as the team member who was
    initially excited about that framework was moved to a startup that do litter boxes.
    The code is also heavily dependent on inline JavaScript of index.html.


    Although frameworks can help make this type of code less likely, they cannot and
    should not completely prevent the free-form JavaScript. However, this type of
    JavaScript is not inevitable, nor is it impossible to fix. The absolute first
    order of business is to understand functions, and not any of the fancy kinds.
    In this chapter, we will be exploring six basic components of functions:


    +   * Bulk (lines of code and code paths)

    * Inputs

    * Outputs (return values)

    * Side effects

    * this: the implicit return

    * Privacy


    # # JavaScript Jenga


    If the frontend JavaScript codebase spooky story didn''t resonate with you, perhaps
    a description of what we are working with one like will sound more familiar.


    Programmers are tasked with making changes to the frontend. Each time they do,
    they make a small change as adding a bit of code and maybe some duplication. There
    is no test suite to run, so in lieu of confidence, the tools they have available
    to ensure the quality of the codebase are 1) performing as many manual checks
    of critical functionality as allowed by time and patience, and 2) The codebase
    gets larger and a bit more unstable with every change.


    Occasionally, a big breakaks in, and the whole stack of blocks topples over, right
    in front of the user. The only saving grace about this system is that version
    control allows the unstable (but mostly okay...probably?) previous version of
    the blocks to be set without too much trouble.


    This is technical debt in action. This is JavaScript Jenga.


    Throughout the rest of this chapter, we will be using a tool for diagramming JavaScript
    called Trellus. All the diagrams in this chapter were generated with it, and you
    can diagram your own functions at trell.us.'
