  md: '# About the Author


    Evan Burchard is a web development consultant and the author of *The Web Game
    Developer''s Cookbook* (Addison-Wesley). Offline, he has designed an award-winning
    kinetic game involving stacking real ice cubes, and periodically picks up his
    project to walk across the US.


    # Colophon


    The animal on the cover of Refactoring JavaScript is a Russian desman (*Desmana
    moschata*), a small mammal directly related to the mole. It is semaquatic, with
    a habitat of lake and river basins throughout Russia, Ukraine, and Kazakhstan.
    Desmans are generally only 7–8 inches long and 14–18 ounces in weight.


    The desman is functionally blind, but its distinctive two-lobed snout is packed
    with specialized dermal bumps (known as Eimer''s, which are also found in moles).
    These organs are highly sensitive to touch and are the animal''s primary source
    of sensory input. The desman also uses its nose like a periscope, to breathe and
    sniff for threats above the surface of the water. Desmans are adept swimmers,
    with webbed feet and flat tails (which help like a ship''s rudder). And indeed,
    they dig dens on land in which to sleep and raise their young, desmans spend much
    of their time in the water; their dens even underwater entrances. Their diet is
    made up of insects, larvae, amphibians, and small fish, most of which they catch
    underwater.


    Unfortunately, the Russian desman is endangered. Its soft, thick pelt—ideal for
    life in cold water—made it highly sought after in the fur trade of the early 20th
    century and the species was greatly overhunted. In 1957, the Soviet government
    established a complete ban on hunting desmans. Despite this, other factors like
    logging, pollution, and wetland drainage continue to cause a population decline
    as viable habitat disappears. Recent conservation efforts have had some success
    in establishing a healthy desman population within wildlife.


    Many of the animals on O''Reilly covers are endangered; all of them are important
    to the world. To learn more about how you can help, go to animals.oreilly.com.


    The cover image is from *Natural History of Animals*. The cover fonts are URW
    Typewriter and Guardian Sans. The text font is Adobe Minion Pro; the heading font
    is Adobe Myriad Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
