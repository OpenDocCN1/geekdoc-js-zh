    # How Many Iterations Does It Take to Trigger the Failure?\n\nIf you're good at\
    \ math, feel free to ignore this, but if you're curious and feel like you might\
    \ be in this situation again, knowing this could be heady. We're testing that\
    \ the first two cards are the same. What are the odds of the odds of happening?\
    \ How many iterations of the test do we use?\n\nWe actually need to invert the\
    \ test, and calculate the odds of the cards not being identical. It's 51/52 or\
    \ about 98.077% chance. So with one iteration, our odds are 100% – 98.077%, or\
    \ about 1.923%. Not a very good chance of hitting it.\n\nWith 100 iterations,\
    \ 98.077 times itself 100 times ((98.077)^100). That gives us 14.344%, and 100\
    \ minus 14.344% is 85.666. So 100 iterations is enough to make our failure likely\
    \ (>85% of the time), but a bit less than one of seven times, our test will not\
    \ fail.\n\nBack to confidence, 10,000 iterations give us a 3.688*10^-7 chance\
    \ of an errant testing. That is close enough to zero for \"confidence\"\n\nSo\
    \ we are confident that our change worked? The trouble is, we're still testing\
    \ something random, which means we're stuck with an inconsistent and possibly\
    \ slow test.\n\nIf you search for \"testing randomness\" online, many of the solutions\
    \ will suggest things that make our random function more predictable. In our case,\
    \ though, the implementation itself that we should still be skeptical about. How\
    \ can we get rid of the slow scaffolding test and still have confidence that our\
    \ code works? We need to test the implementation of a function that doesn't depend\
    \ on randomness. Here is one:\n\n```\ndescribe(`spliceCard()`, function() {\n\
    \  it(`returns two things`, function() {\n    wish(spliceCard(buildArray())).length\
    \ === 2);\n  });\n  it(`returns the selected card`, function() {\n    wish(spliceCard(buildArray())[0].match(/\\\
