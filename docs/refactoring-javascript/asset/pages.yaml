    The classify *variable* is hosted, but its assignment (the function) is not.

    In the "no-no" case of declaring a variable (even a function) without a var (or
    other

    scoping like let and const), it will not be hosted, but when that line hits,

    will be in the top-level scope (or undefined in strict mode).


    This knowledge matters if we decide to have hosted functions, we can end

    aving our declaration, assertion, or testing code at the top, which may be con-

    venient. Picture something like this at the very top of the file:


    ```

    train(getTrainingSet());

    classify(getNewSong());

    ```


    It''s certainly not essential and possibly not your style, but knowing about hoisting

    is critical to this type of "public interface first" structure, as well as promot-ing
    general confidence in your ability to reorder your code as you see fit.


    One last thing to note is that this is about as short as you can make a *function*
    declara-tion:


    ```

    function add(x, y){ return x + y };

    ```


    Compare to the slightly shorter anonymous *function expression* getting assigned

    to a variable:


    ```

    var add = (x, y) => x + y;

    ```


    For one-liners, this second form is nice, but keep hoisting rules in mind. Also,
    and

    this is a minor point, but because this form is anonymous (even though it is

    a variable that you can reference it through), the function object property name
    is not,

