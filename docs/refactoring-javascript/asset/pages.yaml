    \ //same as var index = undefined;\n  songs.push(label, chords);\n  labels.push(label);\n\
    \  for (index = 0; index < chords.length; index++) {\n......\n```\n\nIn looking\
    \ at the costly function, it might seem like we could do hoisting there as well.\
    \ In actuality, each variable is already declared (and assigned) right at the\
