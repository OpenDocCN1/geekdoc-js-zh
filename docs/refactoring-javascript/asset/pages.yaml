  md: '# CHAPTER 1

    What Is Refactoring?


    Refactoring is not changing code.

    Okay, yes, it is, but there''s more to it. Refactoring is a type of changing code,
    but has one major constraint that makes “changing code” an imprecise way to describe
    it: you don''t change the *behavior* of the code. Two immediate questions should
    come to mind:


    +   - How do you guarantee that behavior does not change?

    - What is the point of changing the code if the behavior doesn''t change?


    In the rest of the chapter, we will pursue the answers to these questions. We''re
    not going to go through the full history of JavaScript, as that''s covered extensively
    on the web already.


    # How Can You Guarantee Behavior Doesn''t Change?


    Unqualified, the answer to that question is that it is incredibly hard. Fortunately,
    many types of behavior are not our primary concern when refactoring. We''ll cover
    these next:


    +   - Details of implementation

    - Unspecified and untested behavior

    - Performance


    The shorter answer, for us, is using tests and version control.

    Another approach, supported by William Opdyke, whose thesis is the foundational
    work on refactoring, stresses using automated tools that are responsible for changing
    the code as well as guaranteeing safety *before* doing so. Professional coders
    might find that removing the human element limits the types of changes that can
    be made, as the'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'number of changes that can be guaranteed as "safe" is confined to the functionality
    of the tools.


    Writing tools to encompass the whole refactoring catalog proposed by Martin Fowler
    in his seminal book, Refactoring: Improving the Design of Existing Code (Addison-Wesley),
    would prove extremely difficult. And in JavaScript, a dynamic, multiparadmatic
    language with an ecosystem of variants (see Chapter 2), these tools are bound
    to lag behind a refactorer''s imagination than ever.


    Fowler''s approach pulls away from automation, while at the same time stressing
    the "mechanics" of refactoring: steps of altering code that minimize unsafe.


    If we relied on "Odpkyian," automated approach for this book, the tooling would
    hold us back significantly. We''re straying from Fowler''s emphasis on mechanics
    (step-by-step processes) as well. The reason is, as we move toward confidence
    in our code through a given refactoring, if it is backed by tests, verifying the
    success of our changes should be straightforward. When we fail to execute a refactoring
    properly, version control (we''ll be using Git) should give us an easy way to
    simply "roll back" to the state of the code before.


    # Warning! Use version control!


    ![](img/25446dec1fb455dfb6ac99424735816c_27_0.png)


    Any form of "changing code" carries significant risk to your codebase if you cannot
    easily revert it to a previous, save. If you haven''t developed backups of the
    codebase that you plan on refactoring, put this book down and don''t pick it up
    until you have your code under version control.


    If you''re not using version control, you probably want to use Git, and you probably
    want to back your work up on GitHub.


    Admittedly, the approach of this book might seem reactive and cavalier in comparison
    to the early paths of automation and mechanics. However, the "red" (failure state
    of a test), "green" (passing state of a test), "refactor" cycle, with an eye on
    rolling back quickly if things go wrong—employed in this book is based on how
    quality-focused teams operate with tools that are popular among them. Perhaps
    later, automated refactoring will catch up with Fowler''s extensive catalog of
    refactoring, as well as all that presented in this book, but I wouldn''t count
    on it happening.


    Our goal is to get JavaScript out of the muck. Although it is tempting to try
    to automate and mechanize this process, the most valuable parts of the work of
    the giants (Odpkye, Fowler, Johnson, et al.) whose shoulders this book humly stands
    on is that they gives us a new mindset around making code better and doing it
    safely.


    2 | Chapter 1: What Is Refactoring?'
