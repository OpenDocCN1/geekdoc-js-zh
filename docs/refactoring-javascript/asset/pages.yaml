    So, now that we''re reasonably confident in the behavior, how should we start
    refactoring?


    For this code, we are taking a broad view of refactoring. In practice, you might
    find another order more logical than what is presented here. In particular, after
    getting tests in, it is often easiest to extract functions before doing anything
    else.


    Extracting functions is often the best way to reveal the structure of a program,
    and is probably the most underutilized of refactoring techniques. However, we
    will wait until the next chapter to introduce it.


    We delay extracting functions for three reasons:


    +   * These two chapters are roughly arranged from simple to complex techniques,
    and it''s good to understand the simple ones first.


    +   * Extracting functions often violates other approaches. If we covered it,
    first some (but still important) methods would become unnecessary.


    +   * Additionally, when extracting functions, you often discover something else
    that could be done at the same time—for example, renaming a variable. To keep
    techniques isolated, we need to move in small steps first.


    Generally speaking, the techniques presented in this chapter are low-level. In
    other words, they are concerned with small pieces of code. They are more likely
    to be things that a linter could find or a text editor "automatically refactor".


    # # Renaming Things


    The easiest refactorings to do are simply renaming things that don''t make sense;
    whether it''s variables, functions, objects, or modules, this is a good place
    to start. In the worst case these break the program, and we get git checkout to
    get back to our previous version.


    On our hunt for bad names, we have a few things to look for:


    +   * Miselled words


    +   * Short names (abbreviations and one-letter names)


    +   * Nondescriptive/general names


    +   * Numbers in variable names


    +   * Doubled-up names'
