    \ of lookupUp and just add to the subclasses constructors:\n\n```\nclass Word\
    \ {\n  lookupUp() {\n    return this.lookupUrl + this.word;\n  }\n}\n```\n\n```\n\
    class EnglishWord extends Word {\n  constructor(word) {\n    super(word, \"English\"\
    );\n    this.lookupUrl = 'https://en.wiktionary.org/wiki/';\n  }\n}\n```\n\n```\n\
    class JapaneseWord extends Word {\n  constructor(word) {\n    super(word, \"Japanese\"\
    );\n    this.lookupUrl = 'http://jisho.org/search/';\n  }\n}\n```\n\nAdditionally,\
    \ we could, as we did with language, add another parameter (lookupUrl) to the\
    \ superclass's constructor:\n\n```\nclass Word {\n  constructor(word, language,\
    \ lookupUrl) {\n    this.word = word;\n    this.language = language;\n}\n```"
