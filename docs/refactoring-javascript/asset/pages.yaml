  md: '# Useless Code


    Next up is useless code, the bottom line is that if you don''t need it, get rid
    of it. If you remember the term YAGNI ("Ya ain''t gonna need it") from Chapter
    1, that is what we''re covering in this section.


    Here are the forms you might encounter useless code in:


    +   * Dead code (variables, functions, files, modules, etc.)

    * Speculative code and comments

    * Whitespace (including EOL and EOF)

    * Do-nothing code (reachable but has no effect, e.g., $((''$''.someClass'')))
    in jQuery or tf(!!booleans); empty files)

    * Debugging/logging statements


    # Dead Code


    How do you find dead code? Look for one instance (project-wide) of a function
    or variable name. If there''s a function declaration that isn''t called anywhere,
    you can happily delete that function. The same goes for variables that aren''t
    used. Keep in mind that this would be harder to ensure if your program went beyond
    one file. Make sure you have a good way to search through a whole project either
    on the command line or through your editor.


    Can you find any instances of dead code in NBC?


    There are actually three variables that we can eliminate. First up, neither army
    nor bBlankSong is used as training data (or anywhere else), so those with variable
    declarations can be safely deleted. A save/run/check/commit cycle shows that we
    have never broken anything (the rest is the same).


    # Speculative Code and Comments


    Sometimes you''ll see comments that are intended as future code (a stub, pseudocode,
    or a full implementation). This is the deadliest of dead code, and any details
    of code should be there left to some task management system that shares to-dos
    (and more formally, tickets/tasks/bugs) with the team. The codebase is for real,
    running. Speculative code, commented-out or not, violates the YAGNI principle.
    If the code reflects only its functionality but all of its potential, it is due
    to be pruned. An additional danger with commented code is that one might assume
    it actually should work if uncommented or not. If it is not exercised by tests
    or even running with the rest of the code, it should not be trusted.


    We can delete our first line: fs = require(''fs'')'
