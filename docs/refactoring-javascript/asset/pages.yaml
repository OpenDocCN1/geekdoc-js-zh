  md: "Hopefully, the antipattern is becoming clear: either check for null, or subject\
    \ people to errors and other awkward interactions. It takes one null to kick off\
    \ a codebase full of conditional checks and sadness. Not only does every function\
    \ that calls something could return a null value likely need a check, but your\
    \ tests are necessarily more complex as well, because any functions you test will\
    \ have at least two branches.\n\nSo do we fix it? The answer is we start treating\
    \ our names like objects, rather than strings and nulls. Then we can begin to\
    \ implement functions that have a mirror interface:\n\n```\nclass Person {\n \
    \ constructor(name){\n    this.name = new NameString);\n  }\n}\nclass AnonymousPerson\
    \ extends Person {\n  constructor(){\n    super();\n    this.name = new NullString();\n\
    \  }\n}\n```\n\n```\nclass NullString {\n  capitalize(){\n    return null;\n \
    \ }\n}\n```\n\n```\nclass NameString extends String {\n  capitalize(){\n    return\
    \ new NameString(this[0].toUpperCase()) + this.substring(1);\n  }\ntigerify()\
    \ {\n    if(this === null) {\n      return null;\n    } else {\n      return new\
    \ NameString(`${this}, the tiger`);\n    }\n}\ndisplay() {\n    if(this === null)\
    \ {\n      return '';\n    } else {\n      return this.toString();\n    }\n}\n\
    }\n```\n\n```\npersonOne = new Person(\"tony\");\npersonTwo = new AnonymousPerson(\"\
    tony\");\n```"
