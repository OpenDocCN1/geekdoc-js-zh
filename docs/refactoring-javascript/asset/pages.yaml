  md: '# Some Words in This Book


    # App, Application, Program


    Some words in this book are imprecise. App, application, program, and website
    are interchangeable much of the time. In case there any confusion, this book describes
    general principles for improving the quality of JavaScript, so none of those terms
    should be taken too literally. Maybe your code is a library or framework? In any
    case, the techniques in this book should apply just fine.


    # Inclusivity Through Words and Diagrams


    Some words in this book may not feel inclusive to everyone. I tried to balance
    the use of he and she, which I realize isn''t everyone''s ideal. Although I''d
    prefer to use the singular, that''s not within publisher guidelines at the moment.


    Additionally, I am realizing (too late) that my reliance on diagrams, especially
    those in Chapter 5, may cause a terrible distress to readers with a visual impairment.
    If you feel like you''ve missed out on any content for this reason, please feel
    free to reach out to me with any questions.


    # Users


    There''s also one word in this book I really hate, and that''s users. It''s imprecise
    and also creates some distance between the creators (developers/designers) and
    consumers (users). More precise and charitable words are often specific to the
    problem domain, or we''re stuck with terms like "people" or "people who use the
    program/website". If there is no more specific term than person or user (even
    including customer), it might be a hint that the business model is based purely
    on selling data, but that''s another discussion.


    The point is that the term user is used in this book to convey a familiar concept:
    a person who uses the program/website. Also, there are not yet magnanimous and
    accurate terms to supplant the related terms of user experience (UX) or user interface
    (UI). Rather than explaining this in several places or using nonstandard or specific
    terms for frequently abstract concepts, I chose to save the effort and just talk
    about it here.


    In any case, I fully endorse the following quote (and its implications) "Leonardo
    Vinci Vinci Data," Edward Tufte:


    > There are only two industries that refer to their customers as users: illegal
    drugs, and software houses.


    There is a movement called "ethical design" that hopefully will help the industry
    shed this term (and the inconsiderate practices that stem from it) at some point.'
  merge: -1
