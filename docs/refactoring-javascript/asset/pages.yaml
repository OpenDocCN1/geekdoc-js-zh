  md: 'The second problem, and this might seem strange, is that just by having assignments
    to begin with, we''ve introduced the concept of time into our program. There is
    a time before these values exist, and another one after. Yes, your JavaScript
    programs are steps of execution no matter how we go about it. However, in declarative
    programming (of which FP is one type), we should deemphasize those mechanics,
    describing what a program should do rather than how it should do. Moreover, assignments
    in and themselves are worthless unless they''re actually applied to a function
    (including one that just prints the value of the assignment).


    # # Spreadsheets as Declarative Programming


    As a simple example of declarative programming, consider a spreadsheet program.
    Some cells contain data (facts/values). Other cells contain functions to manipulate
    and use those calculations. Other cells have functions that use the results of
    executing other functions.


    When using a spreadsheet program, we don''t really think about the flow of execution
    of the program. Are the numbers displayed in the cells before they are used in
    other calculations? If a number is used in multiple calculations, which calculation
    is executed first?


    By the way, if you want to try out a declarative programming language that''s
    especially distant from JavaScript, you should look into Prolog.


    If worrying about reassments and even assignments seems really intense, I have
    bad news, good news, better news, and then more bad news. The first bit of bad
    news is that you might find a number of restrictions in a given functional programming
    language, such as:


    +   - Variables don''t exist. They may be called values, which are constants.

    - There is no global state (without some difficulty).

    - Assignment itself is more complex. Values tend to come from or go into functions.

    - Functions should always return something.

    - if statements without else branches are invalid.

    - Functions are declared along with a type signature that specifies inputs and
    outputs.

    - There is a compilation step where types need to line up properly (more on this
    later).

    - The language makes it difficult to use side effects that may be trivial in other
    languages.

    - There''s no concept of null.'
