  md: '# Refactoring JavaScript


    If JavaScript is a framework, frameworks can only do so much to help. No matter
    framework, "compiles-to-JS" language, or library you use, bugs and performance
    concerns will always be an issue if the underlying quality of your JavaScript
    is poor. With this hands-on guide, you''ll learn how to test and refactor your
    existing code to reduce complexity, improve readability, and gain confidence in
    the codebase.


    > I love that this book systematically lays out what refactoring means and doesn''t.
    The narrow focus—helping-developers improve quality with-out changing behavior—must-have-information
    that every JS developer needs. This should be required reading.

    —Kyle Simpson ("getify") JavaScript teacher


    Author Evan Burch shows you how to identify areas of bad code, and takes you through
    several refactoring methods for improving them. Techniques from ranging naming
    to applying principles of functional and object-oriented programming. If you''re
    motivated to write better JavaScript code either on the frontend or backend, this
    book is a must.


    +   - Use refactoring to restructure existing code, without changing its behavior

    - Learn the relationship between refactoring and quality

    - Explore the many versions of JavaScript in use today

    - Create automated tests to confirm that your code works, and find bugs that slip
    through

    - Learn how to refactor simple JavaScript structures, functions, and objects

    - Refactor your codebase by applying object-oriented and functional programming
    principles

    - Examine methods for refactoring asynchronous JavaScript


    > Refactoring JavaScript provides clear direction for your JavaScript code. The
    book looks at both tools and techniques for refactoring, or changing code without
    changing behavior. Examples are provided throughout the book with specific guidance
    for navigating the complexities involved in refactoring.

    —Prof. Steve Suresh, University of Wisconsin-Stevens Point


    Evan Burch is a web development consultant and author of The Web Game Developer''s
    Cookbook. Offline, he has designed an award-winning game involving stacking real
    ice cubes, and periodically picks up his project to walk across the US.


