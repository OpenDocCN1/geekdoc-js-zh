  md: "this pattern versus breaking strings and substrings to select from). The pattern\
    \ we're matching with a slash (\\/). It's followed by some number of word characters\
    \ (\\w+) and .js (.js), ending with a colon (:). Regex's exec function happens\
    \ to return an array, with the whole match as the first element, and then we care\
    \ about \\w+\\.js as the second. The parens in the regex let us get specific about\
    \ what we want (this use of parens is known as the capture in regex terms) versus\
    \ what we use to match the pattern.\n\nSave/run/check/commit.\n\nBasically, any\
    \ time you find yourself searching and/or replacing text, don't think of parsing\
    \ for loops or looping with split to make arrays. Or do, until it gets complicated,\
    \ and then use a regex.\n\n# Regex versus string APIs\n\n![](img/25446dec1fb455dfb6ac99424735816c_179_0.png)\n\
    \nOne that is a bit confusing that some functions are defined on regex objects\
    \ and others are defined on strings.\n\nRegex has the exec and test methods. Test\
