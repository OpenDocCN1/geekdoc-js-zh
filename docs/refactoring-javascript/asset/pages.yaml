    There is a safer, opt-in subset of JS that is available to developing scoping
    files or functions with "use strict".


    It is generally seen as good practice to use strict mode. Some frameworks and
    precompiled languages include it as part of the build/compilation process. Additionally,
    the bodies of class expressions and declarations include "use strict" by default.


    That said, following the ECMAScript specs has two major downsides. First, the
    raw documentation can be intimidating in both size and emphasis. It is generally
    written for those creating browsers rather than applications or websites. In other
    words, for most of us mere mortals, it is overkill. Some exposure to it is useful,
    for those who either enjoy describing the features in a more accessible way through
    blog posts, or prefer not to rely on blog posts as their source of truth.


    The second downside is even when a spec proposal is finalized (stage 4), there
    is no guarantee that your target implementations (i.e., node or your target browsers)
