    # Precompiled Languages


    So far, we''ve seen implementations, platforms, and each version of the ECMAScript
    spec all have their concept of what JavaScript is. So which JavaScript should
    you write?


    First, let''s take the simplest case of "compiled" versus "source" JavaScript:
    a process called minification. A minifier will compress your code to reduce the
    size of the file, while leaving the same meaning. In a browser context, this means
    a smaller download for the website user, and consequently, a faster page load.


    However, minification is far from the only case for compiling JavaScript into
    other JavaScript. One particularly successful project, Babel, with the purpose
    of allowing developers to make use of future features of JavaScript by taking
    as input source code that would potentially not yet work in the target implementation
    and then compiling it into older syntax with better adoption.


    Other precompiled languages specifically target a feature set that may not have
    anything to do with the ECMAScript spec, but feels JavaScript-inspired. Sweet.js
    allows developers to add new keywords and macros to JavaScript. React which is
    out of scope for this section, the language often used with JSX, is also a precompiled
    language that reads a mixture of JavaScript and HTML. Example of Babel''s expansion,
    both Sweet.js and JSX are compiled into JavaScript using it.


    One interesting effect of the love/hate relationship that many developers have
    with JavaScript is that it has led to an explosion of libraries, with some a compilation
    step that defines them as precompiled languages. These aim to treat JavaScript
    as a "compilation target."


    In a rage against braces and a (former) lack of classes, CoffeeScript gained popularity
    as a way to write (preferable to some) code that compiled into JavaScript. Many
    other compilations take a similar approach: write code the way you want to (using
    either a new or a pre preexisting language), and it will be compiled into JavaScript.
    Although CoffeeScript has fallen out of favor, precompiled languages are stepping
    up to fill in over perceived gaps (or just lack of consistency) in JavaScript.


    Precompiled Languages | 15'
