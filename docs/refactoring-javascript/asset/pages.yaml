  md: 'enough of a hassle to motivate testing early. Others might have felt a lack
    of confidence due to not testing low-level functions from the very start.


    On the other hand, there is a case for sticking with high-level tests (manual
    ones like ours) until your code begins to take a bit more shape. Many tests that
    cover-level refactorings may provide extra work without extra confidence.


    For instance, if you know you have dead code, do you want to test it before you
    delete it? If you have a function that you know you want to rename, do you really
    want to test it beforehand?


    # Four More Testing Philosophies


    The combination of unit and high-level testing in JavaScript (including testing
    private functions when you feel like, and using TDD when it works for you and
    your team) is fairly mainstream, although this book emphasizes characterization
    tests because they are utterly undermined.


    It is a good approach to be comfortable with, and tends to mesh with most teams.
    However, there are a few other testing philosophies that are worth considering:


    Unit tests are a waste of time (only high-level tests/metrics matter)


    +   I''ve never heard this a competent engineer who is currently working on coding
    tasks, rather than a manager or consultant focused more on high-level goals.


    TATFT (Test All The [Redacted] Time)


    +   In this approach, you test it all. You test your dependencies. You test everything.
    I''ve never personally seen people adapt in this practice, but I''ve definitely
    seen inspire people to write more tests.


    If it compiles (or type checks), it works


    For languages that care about safety (like Haskell or the compiles-to-JS variant,
    Psalm), many errors won''t happen, because the errors will come up at compile
    time. However, even in the case of type-safe, idempotent, functions, logic errors
    are still possible, so using a functional language doesn''t let you off the hook
    for testing.


    UUM (Uses Until Modification)


    This is a nuanced view on testing that suggests the degree to which you test code
    stands proportional to how much it will be used before it is modified. If it''s
    in your editor, actively being worked on, then it will be zero times before it''s
    modified, no test is necessary. If it''s headed out into the world where millions
    of people use it (whether it''s a developer library or something facing the general
    public), then it should have more tests. The original post is only a few bullet
    points long, and worth a look.'
