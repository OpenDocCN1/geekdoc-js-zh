  md: '![](img/25446dec1fb455dfb6ac99424735816c_367_0.png)


    # Benefits


    The good news is that those restrictions come a ton of benefits. When values exist
    only in a small scope and can''t change, you can trust that a function called
    with the same arguments always returns the same result. This is also called idempotence,
    which is half of what makes a pure function. The other half is not producing side
    effects.


    By this point in the book, functions returning something is a goal we''ve been
    striving for anyway, but what''s the benefit of restricting else? If you look
    at code for it without an else, you might notice that it will change the returned
    value, throw an error, or have some kind of side effect. In other words, it''s
    a vector for impurity to shake into our functions.


    Because type signatures (we cover them later, but just think about how we have
    talked about input and output types like string and number in Chapter 5) establish
    what types of values get passed around where, functional purity can be protected
    at a compilation stage if you have one (and it''s nice to discover errors, including
    type errors, then rather at runtime). But in a stricter functional programming
    language like Haskell, you can have impure functions, which can be complicated
    to set up. You could very well tell the “fun” out of “functional” for many and
    make the code just better.


    As far the last item in the bulleted list in the previous section, as we talked
    about before, avoiding null saves a billion dollars. And all the restrictions,
    this is the best. You won''t feel restricted while swimming in your Scrooge vault
    of gold.


    And now for the better news. The implications of using pure functions range from
    convenient to quite compiling. In a stateless world, there is no longer a question
    of something happened. If two processing cores of a machine (or more) run the
    same function, they get the same result, and it doesn''t matter which finishes
    first. In other words, you can avoid race conditions.


    Additionally, if functions always return the same when called with the same arguments,
    they are referentially transparent, which means we can substitute the evaluation
    of the expression with the value produced. Following from that, we (through minor
    effort in setting up) never have to evaluate a function twice in a row.'
