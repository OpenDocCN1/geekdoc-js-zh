  md: '# CHAPTER 4


    # # Testing in Action


    In the last chapter, we looked at some common objections to testing, and explored
    the benefits that can hopefully overwhelm those objections. If they can''t for
    your project, then there''s a strong possibility that either your team doesn''t
    have the strongest engineering culture (quite possibly for reasons out of their
    control), or you haven''t quite turned the corner on being able to write tests
    fast enough to justify their benefits.


    In this chapter, we''re getting into the details of how to test in the following
    scenarios:


    +   * New code from scratch

    * New code from scratch with TDD

    * New features

    * Untested code

    * Debugging and regression tests


    At the risk of beating a dead horse, you can''t refactor without tests. You can
    change code, but you need a way to guarantee that your code paths are working.'
