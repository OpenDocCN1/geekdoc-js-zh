  md: "What if instead of regaining variable, we introduced a likelihoods array that\
    \ would capture all of the values we need to multiply together, and then multiplied\
    \ them?\n\n```\nfunction classify(chords) {\nconst smoothing = 1.01;\nconst classified\
    \ = new Map();\nclassifier.labelProbabilities.forEach(\nfunction(probabilities,\
    \ difficulty) {\n  const likelihoods = [classifier.labelProbabilities.get(difficulty)\n\
    \  + smoothing];\n  chords.forEach(function(chord) {\n    const probabilityOfChordInLabel\
    \ =\n    classifier.probabilityOfChordInLabels.get(difficulty)[chord]\n    if(probabilityOfChordInLabel)\
    \ {\n      likelihoods.push(probabilityOfChordInLabel + smoothing);\n    }\n \
    \ });\n  const totalLikelihood = likelihoods.reduce(function(total, index) {\n\
    \    return total * index;\n  });\n  classified.set(difficulty, totalLikelihood);\n\
    \  return classified;\n});\n```\n\nWe've mentioned, but we haven't gone deep into\
    \ it, the reduction function . It allows us to step through an array and apply\
    \ some function to it, while working with a returned value, along each element.\n\
    \nBut wait! We already have an array that we are looping through chords. Why would\
    \ we create one new to step through? Do we really need to loop twice (once to\
    \ accumulate and to multiply)? Let's try using reduce on forEach instead:\n\n\
    ```\nfunction classify(chords) {\nconst smoothing = 1.01;\nconst classified =\
    \ new Map();\nclassifier.labelProbabilities.forEach(\nfunction(probabilities,\
    \ difficulty) {\n\n// reduce starts\n  const totalLikelihood = chords.reduce(function(total,\
    \ chord) {\n    const probabilityOfChordInLabel =\n    classifier.probabilityOfChordInLabels.get(difficulty)[chord]\n\
    \    if(probabilityOfChordInLabel) {\n      return total + (probabilityOfChordInLabel\
    \ + smoothing);\n    }else{\n      return total;\n    }\n  }, classifier.labelProbabilities.get(difficulty)\
    \ + smoothing);\n// reduce ends\n\n});\n```"
