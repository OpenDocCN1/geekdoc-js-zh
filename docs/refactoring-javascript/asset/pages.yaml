  md: 'We now have two more items to address. First, why is quality important, in
    the context of “getting things done?” And second, what is quality, and how does
    refactoring contribute to it?


    # Balancing Quality and Getting Things Done


    It may seem as though everyone and every project operates on a simple spectrum
    between quality and getting things done. On the one hand, you have a “beautiful”
    codebase that doesn’t do anything of value. On the other hand, you have a codebase
    that tries to support many features, but is full of bugs and half-completed ideas.


    A metaphor that has gained popularity in the last 20 years is that of technical
    debt. Describing how this puts code into a pseudofinancial langu noncoders can
    understand easily, and facilitates a more nuanced conversation about how quickly
    tasks can and should be done.


    The aforementioned spectrum of quality to speed is accurate to a degree. On small
    projects, visible and addressable technical debt may be acceptable. As a project
    grows, quality becomes increasingly important.


    # What Is Quality and How Does It Relate to Refactoring?


    There have been countless efforts to determine what makes for quality code. Some
    are determined by collections of principles:


    +   * SOLID: Single responsibility/open/closed, Liskov substitution, interface
    segregation, and dependency inversion

    * DRY: Don’t repeat yourself

    * KISS: Keep it simple, stupid

    * GRASP: General responsibility assignment software projects

    * YAGNI: Ain''t gonna need it


    There are metrics like code/test coverage, complexity, numbers of arguments, and
    length of a file. There are tools to monitor for syntax errors and style guides.
    Some languages go as far as to eliminate the possibility of certain types of code
    being written.


    There is no one grand metric for quality. For the purposes of this book, quality
    code is code that works properly and is to be extended easily. Flowing from that,
    our tactical concerns are, and write code that is easily testable. Here I not
    so humbly introduce the EVAN principles of code quality:


    +   * Extract functions and modules to simplify interfaces

    * Verify code behavior through tests'
  merge: -1
  pgno: 32
- img_proc: true
  md: '+   * Avoid impure functions when possible

    * Name variables and functions well


    Feel free to make up your own “principles of software quality” with your own name.


    # Human Readability as Quality


    “Human readability” is sometimes cited as the chief concern for quality, but this
    is a fairly intractable metric. Humans with varying experiences and exposure to
    concepts. New coders, or seasoned ones in a new paradigm or codebase, can struggle
    with abstractions, properly applied or not.


    One could conclude from that line of thinking that only the simplest abstractions
    can be a part of a high-quality codebase.


    In practice, teams find a balance between avoiding using esoteric and confusing
    features, and making time to mentor junior members to understand well-applied
    and sensible abstractions.


    In the context of refactoring, quality is the goal.


    Because you solve such wide range of problems in software and have so many tools
    at your disposal, your first guess is rarely optimal. To demand of yourself only
    to write the best solutions (and never revisit them) is completely impractical.


    With refactoring, you write your best guess for the code and the test (although
    not in order if you''re doing test-driven development, or TDD; have Chapter 4).
    Then, your tests ensure that you change the details of the code, the overall behavior
    (inputs and outputs of the test, aka the interface) remains the same. With the
    freedom that provides, you can change your code, approaching whatever version
    of quality (possibly including performance and other nonfunctional characteristics)
    and ever-forms of abstraction you see fit. Aside from the benefit of being able
    to improve your code gradually, one significant additional perk of practicing
    refactoring is that you will learn to be less wrong the first time around: not
    by insisting on it put, but by having experience with transforming code into good
    code.


    So we use refactoring to safely change code (but not behavior), in order to improve
    quality. You might rightly wondering what this looks like in action. This is what
    is covered in the rightfully; however, we have a few chapters of background to
    get through before promise can be delivered.


    Chapter 2 provides background on JavaScript itself. Chapters 3 and 4 give a justification
    for tests, followed by an actionable approach for testing, derived from natural
    inclinations to write code confidently and iterate quickly, rather than a dogmatic
    insistence on testing simply being understood as something unquestionably good
    and'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'proper. Chapter 5 explores quality in depth, aided by function visualizations
    called Trellis diagrams, which you can learn more about trellus.


    In Chapters 6 and 7, we look at general refactoring techniques. Following that,
    we look at refactoring object-oriented code with hierarchies in Chapter 8 and
    patterns in Chapter 9. We then finish with asynchronous refactoring (Chapter 10),
    and refactoringthrough functional programming (Chapter 11).


    Nailing down what exactly quality is be tough in a language as broad as JavaScript,
    but with the range of skills covered in these chapters, you should be left with
    a ton of options.


    # Refactoring as Exploration


    Although for most of this book we commit to refactoring as a process for improving
    code, it is not the only purpose. Refactoring also builds confidence in coding
    generally, as well as familiarity with what you are working on.


    Constraints have their place, and in many ways a lack of them is what makes JavaScript
    so difficult to learn and work. But at the same time, reverence breeds unnecessary
    constraints. I saw Ben Folds perform once, and he showed us by throwing his chair
    at the piano. Who would attack the traditionally revered (and expensive) piano?
    Someone more important than his tools.


    You''re more important than your code. Break it. Delete it. Change everything
    you want. F had the money for a new piano. You have freedom between you and your
    editor is no one’s business, and you are working in the cheapest, most flexible,
    and most durable medium of all time.


    By all means, refactor your code to improve when it suits you. My guess is that
    what will happen frequently. But if you want to delete something you don''t like,
    or just want to break it or tear apart to see how it works, for you will learn
    by writing tests and moving in small steps, that''s not always the easiest or
    most fun liberating to exploration.


    # What Is and Isn''t Refactoring


    Before we leave off, lets once again distinguish between refactoring and other
    alike practices. Here is a list of things that are not refactoring. Instead, they
    create new code and features:


    +   - Adding square root functionality to a calculator application

    -Creating an app/program from scratch

    -Rebuilding an existing app/program in a new framework

    -Adding a new package to an application or program

    -Addressing a user by first and last name instead of first name'
