    So we have casual and formal objects with different interfaces (hi versus hello,
    and by versus goodbye). If we need to support the same interface, Adapter can
    remap the functions to new ones. This is the same problem that WithNull helped
    us solve earlier.


    For the same reasons as with the decorators, Adapter would probably be best as
    a factory function. But if we use a function factory for the adapter, what is
    the difference between an adapter and a decorator?


    # The “decorator’ T39 proposal


    ![](img/25446dec1fb455dfb6ac99424735816c_333_0.png)


    There are, as of this writing, few proposals for JavaScript features that use
    the term decorator. Although they are distinct from our discussion here, they
    involve similar ideas of altering existing behavior.


    The difference is one of emphasis and likely usage. A decorator is more likely
    to have nested wrappers to add a few disparate traits. An adapter is more of a
    mapping of interfaces between one object and another. Imagine our WithNull implementing
    a conversion of every property to not allow for null. In a decorator scenario,
    we might prefer to nest it as WithoutNullName(WithNullPhone(person)). For an adapter,
    we would be more likely to apply the interface transformation as a necessary and
    simple step. The dog example was probably more of a decorator, while the “without
    null” example was more of an adapter. But does it matter? Not really. In all cases,
    we’re using wrapper functions to add properties to objects. It’s tempting to think
    in patterns of “interfaces” (the OOP term) and “abstract classes,” subclasses
    and private/public methods and members, but JavaScript isn’t Java. UML diagrams
    to describe these complex relationships could be a useful starting point for design,
    but for JavaScript, your best option is to start with the interface/client code
    you want to write and then figure out how to implement it.


    When should we avoid decorators and adapters? Well, if we have control over the
    entire implementation (i.e., we own our own libraries), we might get the same
    utility from altering the base code rather than complicating our interfaces with
    wrapping possibilities. Additionally, is actually simpler and more understandable
    than the original (unpatterned) code. Before using the adapter function, first
    extracting objects and functions. If you still want to apply the pattern, this
    will probably just make the process easier.'
