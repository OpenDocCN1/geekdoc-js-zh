  md: "```\n}\n));\n```\n\nOur personOne knows binary, so we'll get 2 (which is one,\
    \ zero in binary in case we missed the joke) logged first. Our personTwo assumes\
    \ that one, zero is 10, so that's logged second.\n\nThis works fine, but it leaves\
    \ our interrogation of binary knowledge to our client code (e.g., our interface,\
    \ tests, or whatever code might use this as a module). Consequently, we're stuck\
    \ with an if statement that we want to get of all our people to interpret a number.\
    \ Generally speaking, we want to eliminate conditionals where it is sensible and\
    \ also push complexity away the API (which you might think of as \"the public\
    \ interface,\" the inputs and outputs for the tests, or \"we use as the code\"\
    ). It's generally better if we can let the deeper parts of the code handle complexity.\n\
    \nLet's move that conditional into the Person object, and while we're at it, let's\
    \ use a string for binary knowledge instead of a boolean:\n\n```\nclass Person\
    \ {\n  constructor(typeOfPerson) {\n    this.typeOfPerson = typeOfPerson;\n  }\n\
    \n  isBinary(number) {\n    return Number('0b' + number);\n  }\n\n  log(number)\
    \ {\n    if (this.typeOfPerson === \"binary knower\") {\n      console.log(this.isBinary(10));\n\
    \    } else {\n      console.log(this.isBinary(10));\n    }\n  }\n}\n\nconst personOne\
    \ = new Person(\"binary knower\");\nconst personTwo = new Person(\"binary oblivious\"\
    );\n\n[personOne, personTwo].forEach(person => person.log(10));\n```\n\nNow our\
    \ conditional is neatly tucked away in the log function of the Person object.\
    \ Next, instead of just having a type variable to let the logging function know\
    \ what to do, let's use subclasses and get rid of the conditional altogether:"
