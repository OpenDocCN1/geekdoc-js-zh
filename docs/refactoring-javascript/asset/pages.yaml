  md: "+   - Concatenating, magic, and template strings\n- Regex basics for handling\
    \ strings\n- Long lines, part 2\n\n# Concatenating, Magic, and Template Strings\n\
    \nLet's say when we run our code, we want to output \"Welcome to \" plus the name\
    \ of our file through console.log.\n\nWe can start by adding this code to the\
    \ top of our file:\n\n```\nconsole.log('Welcome to nb.js');\n```\n\nThis will\
    \ work, but the filename remains out of a magic string, doesn't it? First, we\
    \ can separate the parts with the + operator.\n\n```\nconsole.log('Welcome to\
    \ ' + 'nb.js' + ' +');\n```\n\nThen we can move our string into a fileName variable.\n\
    If you use + for our current file, this output breaks our manual test in that\
    \ it adds output that was not previously there.\n\nOne tweak we can make here\
    \ is to use template strings, instead of concatenating with the + operator.\n\n\
    ```\nvar fileName = 'nb.js';\nconsole.log('Welcome to $' + fileName + '!');\n\
    ```\n\nInstead of using single or double quotes, we use backticks (``) for the\
    \ string, and then interpolate using ${}. As evidence that this would work just\
    \ with arbitrary JavaScript and not just a variable name, try using it with a\
    \ function like this:\n\n```\nfunction fileName() {\n  return 'nb.js';\n}\nconsole.log(`Welcome\
    \ to ${fileName}}`);\n```\n\nIn any case, it seems a little weird that we have\
    \ to explicitly set the filename, doesn't it? Does JavaScript have anything like\
    \ _FILE_ (a common feature in languages) that will simply use the name of the\
    \ file we're in?\nAs of writing, it doesn't, but helpfully by the time you're\
    \ reading this, it does. The current solution is shocking. Add this to the top\
    \ of your file:\n\n```\nvar theError = new Error('here I am');\nconsole.log(theError);\n\
    ```"
