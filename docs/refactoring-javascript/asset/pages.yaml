  md: "Object-Oriented Software—and is probably the most underused of all. Consider\
    \ how many conditional checks in your code are executed against null, undefined,\
    \ or the existence of a particular variable or function. Odds are, and the type\
    \ of checking makes up a large portion of your if statements. And worse, the absence\
    \ of these type checks likely accounts for a large portion of your errors.\n\n\
    # A (Non-)Value Not Even a Father Could Love\n\nTony Hoare invented the null reference\
    \ in 1965. In 2009, he called it \"billion dollar mistake\" because of all the\
    \ damage it has caused. Considering not only runtime errors, but all of the extra\
    \ time spent coding types for null values across every language that has implemented\
    \ it, a billion dollars is probably an understatement.\n\nIn fact, according to\
    \ research from Cambridge University in 2013 (admittedly sponsored by a bug-hunting\
    \ software vendor), bugs cost the $316 billion dollars every year. Surely, not\
    \ all of those derive from improper handling of null conditions, but from my personal\
    \ experience with web applications, I would guess that it accounts for a significant\
    \ portion. If I was hard-pressed for a percentage, I'd estimate somewhere around\
    \ half, assuming no typing tools are in place. It's certainly more than 1 in 316,\
    \ and we're talking about *annually* here.\n\nHoare's career is a distinguished\
    \ one, so this is not brought up to criticize him. The point is that \"null is\
    \ a billion-dollar mistake\" is not common enough knowledge for people to avoid\
    \ it. It (and undefined) didn't make Crockford's list of \"bad parts\" (Appendix\
    \ B in JavaScript: *The Good Parts*), and it is returned in place by so many APIs\
    \ in so libraries.\n\nLet's start with something that might return:\n\n```\nclass\
    \ Person {\n  constructor(name) {\n    this.name = name;\n  }\n}\nclass AnonymousPerson\
    \ extends Person {\n  constructor() {\n    super();\n    this.name = null;\n \
    \ }\n}\n\npersonOne = new Person(\"tony\");\npersonTwo = new AnonymousPerson(\"\
    tony\");\nconsole.log(personOne.name);\nconsole.log(personTwo.name);\n```"
