  md: '+   • We dropped the sets and maps. It''s worth exploring them, but they''re
    not as flexible as objects and arrays.


    +   • The module becomes just a namespace. Nothing in it is meant to be mutable,
    so it doesn''t hold any state or data—just functions producing output that is
    used as input to other functions.


    +   • The FP is shorter.


    +   • In the end, you''ll have code that is focused on explicitly transforming
    your data, “pipelining” it through different operations rather than having multiple
    states on objects.


    As far as getting to this point, the first thing to know is restructuring from
    OOP to FP is not easy. Some steps may seem counterintuitive if your experience
    is in moving from procedural to OOP.


    In no particular order, here are some the steps you may find yourself taking:


    +   • Have good-level tests in place. If something stops working, undo your changes.


    +   • Make every function that isn''t returning anything return the main object,
    probably with `return` at first.


    +   • Change all of these references to explicitly refer to the object, like Classifier
    (in this case).


    +   • Flatten out objects and subobjects that you can.


    +   • Move properties out of the objects.


    +   • Replace state variables with queries.


    +   • If you have trouble doing this, consider passing in the old state as part
    of queries until the state eventually turns into inputs to functions.


    +   • You’ll probably make the code look worse before it looks better, as you
    will to bring things out of structure before creating new structure. You might
    add duplication, pass around more parameters, and/or introduce unnecessary functions
    and poorly named variables as you go.


    # Why Didn’t We Compose More Functions?


    There are plenty of ways to combine functions (e.g., R.compose, inlining, creating
    an outer function that takes in all parameters), and it might seem obvious that
    we could have combined the `train` function with either the `addText` function
    or the classify function.


    The first question is why we do not merge the individual functions as opposed
    to high-level combined ones? The reason for not combining `train` and `addText`
    is that the interface provided by `addText` is most useful if it’s used a few
    times to build a bigger set of data. Training it at the same time would mean repetitive
    or more complicated calculation. The reason for not combining `train` and `classify`
    is that if the training data'
