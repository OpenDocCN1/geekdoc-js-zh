    \n```\nit('classifies', function() {\n  classify(['#fm7', 'a', 'dadd9', 'dmaj7',\
    \ 'bm', 'bm7', 'd', '#f#m']);\n});\n```\n\nNext, at the very end of the classify\
    \ function, have it return in addition to logging:\n\n```\nfunction classify(chords)\
    \ {\n  ...\n  console.log(classified);\n  return classified; // this line is new\n\
    });\n```\n\nBack to the test: we know that, since we're lacking coverage, we want\
    \ to write a character-ization test. We use the characterization mode of wish\
    \ by supplying a second parameter of true, and let the test output what is output.\n\
    \nMake the \"classifies\" test like this:\n\n```\nit('classifies', function()\
    \ {\n  var classified = classify(['#fm7', 'a', 'dadd9',\n  dmaj7', 'bm', 'bm7',\
    \ 'd', '#f#m']);\n\n  wish(classified.get('easy'), true);\n  wish(classified.get('medium'),\
    \ true);\n  wish(classified.get('hard'), true);\n});\n```\n\nAfter running mocha,\
    \ this leads to:\n\n```\nWishCharacterization: classified.get('easy')\nevaluated\
    \ to 1.3433333333333333\n```\n\nAnd then we just put that value into our test:\n\
    \n```\n// replace this\nwish(classified.get('easy'), true);\n\n// with this\n\
    wish(classified.get('easy') === 1.3433333333333333);\n```\n\nRun mocha again,\
