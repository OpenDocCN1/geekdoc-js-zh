- img_proc: true
  md: "```\nassert = require('assert');\nassert(2 + 2 === 4);\n```\n\nBy the way,\
    \ that first line will produce some scary-looking output if you're in a node console.\
    \ Don't worry about that, though; it's just showing what loaded. Also, the node\
    \ console already has assert, so you can leave the first line if you're not working\
    \ inside a .js file. The second line returns is undefined, which might seem weird.\
    \ That's normal. Try asserting something untrue like assert(3 === 2), and you'll\
    \ see an error.\n\nIf you make assertions like these, you're testing JavaScript\
    \ itself: its numbers, + operator, and === operator. Similarly, and more frequently,\
    \ you might find yourself testing libraries:\n\n+   - = require('underscore');\n\
    assert.first([3, 2]) === 3);\n\nThis is to test if the underscore library behaves\
    \ as expected. Testing low-level implementation details like this is useful if\
    \ you're exploring a new library or a multipiar of JavaScript (any good library\
    \ will have its own tests). There are two caveats to however. First, \"sanity\
    \ tests\" are necessary to ensure that some function or library has been made\
    \ available to your environment, although these tests need not stick around once\
    \ you've stabilized your environment. Second, if you're writing tests to help\
    \ yourself be confident in the code (more on this later), testing a library's\
    \ behavior is appropriate to demonstrate the code in action.\n\n# # Why Don't\
    \ We Care About unspecified and Untested Behavior?\n\nThe degree to which we specify\
    \ and test our code is literally the effort that demonstrates care for its behavior.\
    \ Not having a test, a manual procedure for execution, or at least a description\
    \ of how it works makes the code basically unreliable.\n\nLet's assume that the\
    \ following code has no supporting tests, documentation, or business processes\
    \ that are described through it:\n\n```\nfunction doesThings(args, callback){\n\
    \  doesOtherThings(args);\n  doesOtherThings(args, callback);\n  return s;\n}\n\
    ```\n\nDo we care if the behavior changes? Actually, yes! This function could\
    \ be holding a lot of things together. Just because we can't understand it doesn't\
    \ make it less important. However, it makes it much more dangerous."
