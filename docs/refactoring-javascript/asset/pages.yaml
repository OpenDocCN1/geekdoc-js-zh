    # Density and Abstraction


    At this point, you might be wondering if this refactoring is really worth it.
    By inlining variables, we might add some overhead to use map with a Map object.
    For some people, inlining variables and using functions with bind is going to
    make the code harder to read. For others, the arrow syntax, with all of its variation
    (which we will cover later), may be overwhelming. It''s important to be aware
    of how your style might impact other members of your team.


    So did we just make the code worse? Not necessarily. The advantage of inlining
    variables is twofold. First, less internal state means less to keep track of.
    Inlining variables can make it easier to extract functions, which are more flexible
    and testable than simple variables.


    For both variables and functions, the important part is to be aware of inlining
    and extracting as choices.


    > Code has no final, perfect, “refactored” state


    One important thing to note about our work on the classify function that there
    is no way to tell when you are “done” refactoring. Some refactorings (like inlining
    and extracting) are inverse processes, so you could end up undoing previous work
    with subsequent efforts. You could create an infinite loop of refactoring just
    to fix. In others'' opinions of what “good” code is, and you can really “improve”
    the code forever. This is part of why it is important to develop your own standards
    of quality, and to calibrate those with the people you work with.


