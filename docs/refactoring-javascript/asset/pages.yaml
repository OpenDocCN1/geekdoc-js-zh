    # "Weak" Versions of Set and Map


    Before we leave discussion of sets and maps, you should note that there are also
    WeakSet and WeakMap. The main differences between them and the "strong" (normal
    strength?) counterparts are:


    +   - They cannot be iterated (noForEach function).

    - They do not have a reference to their size.

    - WeakSet cannot store primitives.

    - They hold their keys "weakly"; that is, the keys are available for garbage collection
    when they don''t have any references.


    Basically, with the weak forms, you give up the capability of easily knowing what
    is inside or applying functions to the whole set. And what gain is control over
    memory leaks and privacy.


    # Array Alternative: Bit Fields


    One candidate for replacing arrays deserves a mention: bit fields. If you have
    an array that stores booleans, you might want bit fields in some cases. There
    is no native implementation of bit fields in JavaScript. However, you have access
    to numbers and bit-wise arithmetic, and that''s all you need.


    Imagine you have the following conditionals:


    ```

    states = [true,

    true,

    true,

    true,

    true,

    true,

    false,

    true]

    ```


    You could also represent these in binary as 0b11111101.'
