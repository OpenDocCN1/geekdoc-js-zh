    Keep in mind that moving from OOP to FP is just one type of restructuring. If
    you''re intending to move from one framework to another, a "rewrite" is probably
    what you''ll end up doing. Although it''s possible to do this slowly and carefully
    through a strangler app that slowly takes more and more responsibilities from
    the legacy app, it''s hard to not allow that to lead to a fractured experience
    for quite a while.


    A full rewrite, where the old app is supported until the new is "good enough"
    (unfortunately, this is usually pretty ambiguous), is an especially difficult
    problem, for a few reasons:


    +   - Feature parity for two apps in different frameworks is hard to define.

    - It''s easy for design changes and new features to become "essential" to the
    new app, increasing the scope from feature parity to something else.

    - A solid ("phased") cutover plan/upgrade path for all customers should be defined.

    - If the new version demands skills to build, your current team, though experts
    on the old app, might not have great experience with the technologies required
    for the rewrite.

    - "Business rules" that may be faithfully executed in the old app can be lost
    in translation, mistaken for bugs or details that don''t matter.

    - Progress can be very difficult to estimate how long a rewrite will take.

    - It''s very difficult to demonstrate.


    Overall, restructuring between paradigms and rewriting between frameworks are
    both very hard. They are not simple, mechanical processes like refactoring can
    be. On a multidisciplinary team with various styles and priorities, rewrites will
    mean very different things to different people.'
