    And both tests pass. We just had to add the WithoutNull function and use it to\
    \ wrap personTwo. All it prevents from being null. Because it does not convert\
    \ the name unless it is null, we can wrap any person object with WithoutNull,\
    \ anonymous or not. Notice that we use a simple factory function that returns\
    \ an object, but we could have used a class or constructor function instead. The\
    \ disadvantage of these approaches is that they implicitly return an object, and\
    \ here, it's easier to explicitly return a new one we construct manually. With\
    \ a class or constructor function, the implicitly returned class would be of type\
    \ WithoutNull, which is odd, and overiding it (returning a different object in\
    \ the constructor function of the class or from a constructor function called\
    \ with new) would be a bit confusing.\n\nTwo others are worth considering here.\
    \ First, it won't always be the case that we can decide what type of person object\
    \ we have. It's possible that we only have one type of person and we would not\
    \ be able to determine ahead of time whether or not it has a name (or any other\
    \ attributes we wrap with WithoutNull). For example, we might be receiving objects\
    \ from the database with a function like db.get(person: {id: 17}). Our WithoutNull\
    \ wrapper would be excellent for providing a consistent interface to name and\
    \ other attributes by wrapping the class like: WithoutNull(db.get(person: {id:\
    \ 17})). It's very likely that we would not want to change the database API itself,\
    \ but wrap values that it returns.\n\nSecond, if our API returned a string instead\
    \ of a real object in the normal Person case, we would have much more difficulty\
    \ in setting up a parallel function structure for NullString without directly\
    \ extending our \"untouchable\" Person and AnonymousPerson classes, overwriting\
    \ String.prototype, or compromising our fairly wrapping API.\n\nWe've seen two\
