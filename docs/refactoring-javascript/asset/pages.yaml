    program. Do you want to use Object.getPrototypeOfOf? What about Object.is? __proto__
    .prototype .constructor? .keys Reflect.ownKeys? Reflect.has? typeof? instanceof?


    Let’s call this “JavaScript’s deep, dark underbelly


    Are you confident that these behave as you expect? Are the desired properties
    enumerable when you want to loop through an object? When you create a new object,
    are you exposing your new or old objects to side effects?


    You’re likely to encounter projects that favor one style or another. One might
    even see a codebase with a dual personality, perhaps with half of it in a classical
    style and the other half using factory functions. Whatever your preferred style
    is, rewriting the “wrong” style is likely to be painful, possibly confusing and
    insulting to other team members.


    Although it is best to promote confidence early in a project by having answered
    Chapter 2’s question of “Which JavaScript are you using?” with a style guide (and
    yet, a lint that runs in your editor to enforce this (automatically), you won’t
    always be so.


    On a project that lacks opinions on a given style, hurts confidence in that intersection
    (of interface and reflection), what would you do?


    If you are not confident in a piece of code, write a test. For example, for this
    code:


    ```

    const myPet = Object.assign(animal, barky, bitey);

    ```


    use characterization tests to develop confidence in things like Object.keys(myPet),
    myPet.__proto__ Object.getPropertyNames(myPet), Object.getPrototypeOf(myPet),
    and any of these members of interface of JavaScript. As we practiced in Chapter
    4, use wish(value, true) or assert(value === null). Then we use the output of
    that characterization test to fill in the test: wish(value === value FromOutput)


    Aren’t these values already tested within JavaScript browser implementations?
    Yes, absolutely; they already have covering tests. Are they “implementation details,”
    which many argue against writing tests? Definitely. Will these tests be brittle
    if you change from classes to factory functions or factory functions to classes?
