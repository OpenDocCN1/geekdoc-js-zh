    var text = "Lorem ipsum dolor sit amet, \\

    consectetur adipiscing elit, sed do eiusmod \\

    tempor incididunt ut labore et dolore aliqua. \\

    Ut enim ad minim veniam, quis nostrud exercitation \\

    ullamco laboris nisi ut aliquip ex ea commodo consequat.",

    ```


    # Solution 4


    We can use templates to put the string on multiple lines, but this changes the
    string by adding new line characters \n on every line break. Note that if you
    don''t mind new line characters or want them, this is easier than solutions 1,
    2, and 3, and you would need to insert \n characters where you want a line break.


    ```

    var text = ''Lorem ipsum dolor sit amet,

    consectetur adipiscing elit, sed do eiusmod

    tempor incididunt ut labore et dolore aliqua.

    Ut enim ad minim veniam, quis nostrud exercitation

    ullamco laboris nisi ut aliquip ex ea commodo consequat.''

    ```


    Another involves setting every section to a variable or member of an array and
    then joining these bits together .join. This idea is bad enough to not deserve
    the "Solution 5."


    As for the first three, your options are all combination of awkward and brittle.
    Using Solution 1 with a text editor that wraps clearly is the best you can hope
    for in some cases. Solution 2 comes with a performance hit, has syntax, but slightly'
