  md: "# State\n\nThe pattern is a bit more involved than the strategy pattern, but\
    \ can flow naturally from it. Let's assume that \"awareness of binary\" actually\
    \ indicates knowledge of the binary operations read, and xor (exclusive or) as\
    \ well. (There are other binary operations, but three are sufficient to demonstrate\
    \ the pattern). To continue to use the strategy pattern for this case, we would\
    \ need to expand our constructor to include all of the new knowledge strategies:\n\
    \n```\nclass Person {\n  constructor(readKnowledge,andKnowledge,xorKnowledge){\n\
    \    this.read = readKnowledge;\n    this.and = andKnowledge;\n    this.xor =\
    \ xorKnowledge;\n  }\n}\n\nconst binary = {\n  readAware(number) {\n    return\
    \ Number('0b' + number);\n  },\n  readOblivious(number){\n    return number;\n\
    \  },\n  andAware(numberOne,numberTwo){\n    return numberOne & numberTwo;\n \
    \ },\n  andOblivious(numberOne,numberTwo){\n    return \"unknown\";\n  },\n  xorAware(numberOne,numberTwo){\n\
    \    return numberOne ^ numberTwo;\n  },\n  xorOblivious(numberOne,numberTwo){\n\
    \    return \"unknown\";\n  }\n}\n```\n\n```\nconst personOne = new Person(binary.readAware,\
    \ binary.andAware, binary.xorAware);\nconst personTwo = new Person(binary.readOblivious,\
    \ binary.andOblivious, binary.xorOblivious);\n```\n\n```\n[personOne,personTwo].forEach(person\
    \ => {\n  console.log(person.read(10));\n  console.log(person.and(2, 3));\n  console.log(person.xor(2,\
    \ 3));\n});\n```"
