  md: "```\nconst personOne = new Person(true);\nconst personTwo = new Person(false);\n\
    \n[personOne, personTwo].forEach(person => { person.log(10) });\n```\n\nWe could\
    \ eliminate this type check by adding functions to our personOne and personTwo\
    \ objects after they are created:\n\n```\nclass Person{\n  log(number) { console.log(this.whatIs(number))\
    \ };\n}\n\nconst personOne = new Person();\npersonOne.whatIs = (number) => Number('ob'\
    \ + number);\nconst personTwo = new Person(number => number);\npersonTwo.whatIs\
    \ = (number) => number = number;\n```\n\n```\n[personOne, personTwo].forEach(person\
    \ => { person.log(10) });\n```\n\nAlternatively, we can implement the type check\
    \ by supplementing the object with a function on:\n\n```\nclass Person{\n  constructor(whatIs)\
    \ { this.whatIs = whatIs;\n  log(number){console.log(this.whatIs(number)) };\n\
    }\n```\n\n```\nconst personOne = new Person(number => Number('ob' + number));\n\
    const personTwo = new Person(number => number);\n```\n\n```\n[personOne, personTwo].forEach(person\
    \ => { person.log(10) });\n```\n\nIf we wanted, could name and extract these functions\
    \ to simplify the constructor:\n\n```\nfunction binaryAware(number){\n  return\
    \ Number('ob' + number);\n}\n\nfunction binaryOblivious(number){\n  return number;\n\
    }\n```\n\n```\nconst personOne = new Person(binaryAware);\nconst personTwo = new\
    \ Person(binaryOblivious);\n```\n\nNow that the functions are extracted, we can\
    \ easily test them independently and creating any Person objects.\n\nYou might\
    \ be tempted to move these functions into the Person object, possibly as static\
    \ functions like this:\n\n```\nclass Person{\n  constructor(whatIs){\n  this.whatIs\
    \ = whatIs;\n}\n```"
