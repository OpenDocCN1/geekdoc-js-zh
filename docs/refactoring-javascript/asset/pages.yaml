    ```

    node -v

    npm -v

    mcha -v

    ```


    Yes, last V is a capital V, but the others are lowercase. If you get back anything
    other than version numbers, try searching for "installing node/npm on <whatever
    your operating system is>" (e.g., "installing npm on windows").


    By the way, we tend not to use the -g (global) flag for other packages. We use
    that flag for mocha because we want the tool available at the command line. The
    npm docs have additional details.


    The full reference versions of libraries used in creating this book can be found
