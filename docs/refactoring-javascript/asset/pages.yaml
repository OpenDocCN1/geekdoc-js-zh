    # Inheritance and Architecture


    So far, we''ve seen a few different patterns for copying data, ranging from the
    classiest (pseudo-) classical to the factory function that happily ignores most
    of the ideas around prototypes, constructors, and any other lines we''d need to
    draw from box to box in a UML diagram.


    To recap, we know that we can make solitary objects using:


    +   * Object literals

    * Classes (uses new)

    * Constructor functions (uses new)

    * Factory functions (just returns an object)

    * Object.assign and Object.create

    * Libraries (like mori and Immutable)


    Additionally, when it''s preferable to objects, we can make more specific containers
    as we need them, such as:


    +   * Set

    * Map

    * Array

    * String

    * Function

    * Other JavaScript types


    It''s already a lot of options, but in order to round out the discussion, let''s
    address architectural concerns a bit more deeply, centered on answering the following
    questions:


    +   * Why do some people hate classes?

    * What about multiple inheritance?

    * Which interfaces do you want?


    # Why Do Some People Hate Classes?


    The first argument that some people latch onto is that new, this, super, and anything
    else having to do with classical OOP style detracts from their preferred mechanism
    of sharing data and behavior between JavaScript objects (hurting the purity and
    making things confusing)—but some of these criticisms are of object-oriented programming'
