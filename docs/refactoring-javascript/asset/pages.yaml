  md: '# Test-driven development


    If you have the basics of testing down, test-driven development (TDD) can produce
    quality code with good test coverage. The downside is that it is a significant
    departure from a process of testing after the implementation code is written.
    The upside is that TDD, through the red/green/refactor cycle, can provide guidance
    throughout development. Additionally, if TDD is followed strictly, implementation
    code is written only in order to get a passing test. This means that no code is
    written that does not have coverage, and therefore, no code is written that cannot
    be refactored.


    One challenge to a coder using TDD is that sometimes it is not obvious how to
    test, or even write the implementation code to begin with. Here, an exploratory
    phase known as spiking is suggested, where the implementation code is attempted
    before the tests are written. Strict TDD advocates deleting or commenting out
    this spike code once the coder understands the task well enough to write tests
    and implement, à la the normal red/green/refactor cycle.


    A term that you''ll often see alongside TDD is BDD (behavior-driven development).
    Basically, this process is extremely similar to TDD, but is done from the perspective
    of the end user. This implies two points of importance. First, the tests tend
    to be high-level, end-to-end tests. Second, inside the red/green/refactor cycle
    of BDD end-to-end tests, there are smaller red/green/refactor cycles for TDD unit
    tests.


