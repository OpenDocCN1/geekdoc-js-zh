    \ can be defined iteratively like this:\n\n```\nfunction find(toFind, array){\n\
    \  let found = \"not found\";\n  array.forEach((element) => {\n    if(element\
    \ == toFind)\n      found = \"found\";\n  });\n  return found;\n}\nconsole.log(find(3,\
    \ [3, 9, 2])); // found\nconsole.log(find(3, [2, 9, 3])); // found\nconsole.log(find(3,\
    \ [2, 9, 2])); // not found\n```\n\nBut we could also have a recursive function:\n\
    \n```\nfunction find(toFind, array){\n  if (array[0] === toFind)\n    return \"\
    found\";\n  } else if(array.length === 0)\n    return \"not found\";\n  } else\
    \ {\n    return find(toFind, array.slice(1));\n  }\n```\n\n```\nconsole.log(find(3,\
    \ [3, 9, 2])); // found\nconsole.log(find(3, [2, 9, 3])); // found\nconsole.log(find(3,\
    \ [2, 9, 2])); // not found\n```\n\nBoth options have performance implications,\
    \ which we won't get into here, and neither is necessarily the best version of\
    \ find. This is just to illustrate a couple of things you need for recursive functions.\n\
    \nFirst, you need to call a function inside of its declaration (e.g., calls find()\
