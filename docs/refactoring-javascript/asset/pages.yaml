  md: '# Third-Party Libraries and Communities


    Although I tried very hard to present the best tools to demonstrate the fundamentals
    of refactoring and testing in JavaScript, there may be times where you find that
    a particular tool isn''t working for you. The great news is that JavaScript has
    a rich system of options. I have a preference for tools that are simple, flexible,
    and atomic, but you may feel differently. Large frameworks in particular are not
    explored in this text, as they tend to come with their own ecosystems of other
    tools (often themselves active and varied). I would absolutely recommend a framework
    when you''re starting out, but they are most useful when combined with facility
    in the underlying language, which I believe this book will teach you well.


    Additionally, every tool, framework, and library will come with some community
    and history. Just as I don''t believe in any one true way for tools. I also don''t
    endorse the community behind any given third-party code or project. Many projects
    will come with a code of conduct that will let you know if participating in them
    will be an enjoyable use of your time.


    # API, Interface, Implementation, "Client Code"


    This gets a little murky, but one thing I would highlight is the hierarchy not
    in terms of objects, but in the interface of a well-designed codebase. When code
    is a simple script, we expect it to run to top to bottom, as a procedure. As a
    codebase matures (through design, not butchery mixed with entropy), we expect
    to develop in three main layers (although this is obviously extended in more complex
    codebases).


    The first layer—the code behind the scenes, deep in the codebase—is referred to
    in this book as the *implementation*. For refactoring, the most important distinction
    is between the implementation and the next layer. This second layer can be called
    the interface or API and describes "public" functions and objects that one should
    expect to interact with if a codebase is used as a module. The third layer of
    consequence is the client code or calling code. It refers to the code that is
    written to interact with the interface layer. This is the code that people using
    a module would write, as well as testing the code that we write to test the interface
    layer.


    ![](img/25446dec1fb455dfb6ac99424735816c_19_0.png)


    # Basics of architecture


    Throughout this book, we''re creating programs that start out very unstructured,
    and our main thrust (regardless of a paradigm like OOP or FP) is to make divisions
    between these three layers. This is allows code to be testable and portable. If
    you''re mostly reliant on frameworks that provide their own organization, this
    might seem unfamiliar.'
