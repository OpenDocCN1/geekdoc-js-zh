  md: 'If you want to try it out, open facade.html in a browser. We have black box
    functions on an object called page. All it does is put together a limited subset
    of how you might interact with a website, including the basics of logging, analytics,
    page interactions, and performance monitoring. This could be useful for someone
    unfamiliar with browser APIs or the browser console.


    When should you not use a facade? Any time the direct interactions with an API
    are simple enough or understood well by you or other people interacting with it.
    In those cases, adding a facade is a bad idea, because either it will not be used,
    or will be used sometimes, leading to learning/supporting/understanding/maintaining
    two disparate interfaces.


    Facades are widely used for tasks like simplifying complex APIs. ORMs (object
    relational maps) can be useful for simplifying database interactions. And jQuery
    is a large facade for frontend JavaScript and all the APIs it interacts with.
    Once you get to the ORM or framework level, you''ve got a lot more going on than
    a simple "facade," but the intention is the same.


    It is tempting to think of interfaces strictly in terms of public/private (which
    in JavaScript could mean prepended with _, completely hidden, or a couple of things).
    However, exposing a smaller subset of an API is underutilized. Consider that we
    have already seen one example of why we might use a less-rich API over a complex
    one (tape versus mocha). Whether for convenience or learning, exposing a core/popular
    set of features independently could make documentation and coding easier on beginners
    (and “forgetters”)—which, considering how massive the JavaScript landscape is,
    is practically everyone.


    # What Does the Alphabet Have to Do with APIs?


    Even without the creation of a distinct, smaller interface for an API through
    a facade, people deserve better than documentation organized only alphabetically.
    What are the most useful functions? What are the most popular?


    These are not impossible questions to answer. By providing a subset of documentation
    or allowing functionality to be ranked by something more practical than the alphabet,
    advice to "RTFM" would be a lot more useful, albeit just as rude.


    # Wrapping Up


    We''ve left out the majority of the patterns from the seminal design pattern book,
    Design Patterns: Elements of Reusable Object-Oriented Software (also known as
    the "Gang of Four" or "GoF" book for its four authors), as well as a good number
    of those that have popped up throughout the years. Since this is a refactoring
    book and not a patterns book, we had to draw the line somewhere, especially given
    that term'
