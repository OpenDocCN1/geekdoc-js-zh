  md: '# # Which Framework Should I Use?


    This is a perennial question posed by JavaScript developers, and a language-specific
    form of probably the biggest question from new developers, “Which language should
    I learn?” The framework treadmill can give programmers a sense that they genuinely
    need to know everything. Job descriptions with inflated and even contradictory
    requirements don''t help. When it comes to JavaScript, there are so many frameworks,
    platforms, and distinct types of code you might write that some form of this question
    comes over time and again.


    In the end, you can''t possibly learn everything. If you have a job or target
    job that genuinely requires certain skills, spend your time on those first. If
    you don''t have a particular job in, find friends and mentors at meetups and follow
    what they do. Or, if you''re concerned with learning something that''s interesting
    to you, pick something that seems cool* and go as deep as you want, then move
    on, and at some point getting very adept with a handful of these technologies.


    You can apply this same process (filtering by job requirement, what your friends
    are using, and what you think is cool) to languages, frameworks, testing libraries,
    or musical instruments. In all of them, go occasionally, and if you''ll pull a
    bit of cross advice, keep an eye on where the money is.


    > *Seems cool* might sound vague, and it is. For me, that finding the most likely
    or novel-binding technology to me. I''m not likely to learn 14 variants of something
    that solves the same problem. For others, cool means new and hip. To other people
    it means popular or lucrative. If you don''t know what “seems cool” means to you,
    solve that by taking shallow trips into a few possibilities rather than spending
    too much wondering which to choose.


    # ## Versions and Specifications


    If you want to know where JavaScript is, and where it''s headed, you should follow
    what''s going on with the ECMAScript specification. Although features of JavaScript
    can bubble up from libraries and specific implementations, if you are looking
    for the canonical source of features that are likely to stick around, the ECMAScript
    specification.


    Specifically (as of this writing), the committee responsible for tracking and
    adopting new features into the spec is called TC39. Spec proposals go through
    a multistaged process for adoption. You can track proposals in all five stages
    (0–4) via GitHub.'
