  md: "# What about train?\n\nCurrently, our API relies on following the pattern of\
    \ adding songs and then training them all at once. Unfortunately, because of the\
    \ side effects we have, our code is not idempotent (a concept covered in Chapter\
    \ 11). In other words, our functions are not “pure”, because of their side effects,\
    \ and running them in a different order than specified (multiple times) is not\
    \ handled well.\n\nTrain does not run LabelProbabilities, and if setLabelProbabilities\
    \ were tied to train instead of trainAll, our tests would break.\n\nThis is a\
    \ problem we will not fix in this, but there is an idempotent (functional) version\
    \ of the NBC in Chapter 11.\n\nNow we can call the function directly from the\
    \ classifier, which means in the calls to our tests like this:\n\n```\nclassifier.addSong('imagine',\n\
    ['cmaj', 'f', 'am', 'dm', 'g', 'e7'],\nclassifier.addSong('somewhereOverTheRainbow',\n\
    ['cm', 'em', 'f', 'g', 'am'], 0);\n```\n\ncan turn into this:\n\n```\nclassifier.addSong('imagine',\n\
    ['cmaj', 'f', 'am', 'dm', 'g', 'e7'],\nclassifier.addSong('somewhereOverTheRainbow',\n\
    ['cm', 'em', 'f', 'g', 'am'], 0);\n```\n\nAdditionally, since our function in\
    \ the classifier has become pure delegation, we no longer need to be so specific\
    \ about the parameters:\n\n```\nclass Classifier {\n  constructor(){\n\naddSong(...songParams)\
    \ // rest\n  this.songList.addSong(...songParams); // spread\n};\n```\n\nThe ...songParams\
    \ in the function definition is known as rest parameter syntax, and using a similar\
    \ style in a function call is known as the spread operator. It’s hard to keep\
    \ these terms straight, but Chris Daley suggested this mnemonic: rest is for “receiving,”\
    \ spread is for “sending.” That works for me (Thanks, Chris).\n\nThe rest parameter\
    \ syntax takes any arguments you give it and turns them into an array. The spread\
    \ operator does the opposite, splitting the array you give it into individual\
    \ arguments to pass to the function.\n\n![](img/25446dec1fb455dfb6ac99424735816c_261_0.png)"
  merge: -1
  pgno: 261
- img_proc: true
  md: "The reason this is a good pattern to apply in this situation is that we already\
    \ have a function definition for addSong inside songList. If we decided to change\
    \ the function terms of what arguments it accepts, it would be nice not to have\
    \ to change this function as well. Using rest and spread affords us that flexibility.\n\
    \nBy the way, if we discovered that in actually songList was doing all the work,\
    \ and classifier simply delegating every function to it, removing these functions\
    \ and letting the tests (or client code that uses our module) call the songList\
    \ versions directly would be worth considering. Having just one object that interacts\
    \ with is for them, but if our delegation is adding sufficient bulk, we should\
    \ rethink the design.\n\n# Time for a Little Privacy?\n\nAs we saw in Chapter\
    \ 5, if we want privacy in a class, we can just add an underscore (_) in front\
    \ of all the properties we want to be private. This convention lets people using\
    \ the API know that they're in weird territory if they're addressing these properties\
    \ directly (sometimes the private/internal assets of an API are referred to as\
    \ the 'plumbing' as opposed to the 'porcelain').\n\nHopefully, your editor has\
