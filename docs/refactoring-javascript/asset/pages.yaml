  md: '# Deeper into Functional Programming


    If you''re looking to get deeper into FP, you might find yourself hitting a wall
    by only using JS directly or with libraries that don''t require a compilation
    step. For compiles-JS languages, you have some interesting options:


    +   - TypeScript

    - PureScript

    - Clojure

    - Elm


    If you want to explore FP on its own, without worrying about compiling to JavaScript,
    then you could look into this:


    +   - Haskell

    - Scheme/Clojure (Lisp variants)

    - Erlang

    - Scala


    As of this writing, there are many other choices out there in both categories,
    and many more are to be developed. The point is that you shouldn''t feel restricted
    by only working in JavaScript. Good ideas come from everywhere. It''s not uncommon
    to see a standard way of working in one language appear as an innovation in another.


    # Moving from OOP to FP


    As mentioned before, if you''re jumping paradigms like OOP to FP, it''s probably
    too large of a change to be called refactoring anymore. Despite that, it''s likely
    that you will find working through a similar process helpful: make small steps,
    keep changes under version control, passing a test suite.


