    But it isn''t. Dog will be a Bitey but has no idea how to be fluffy like an Animal.
    This is not a mechanism for multiple inheritance. Dog extends Ity. It''s as simple
    as that. This is not a mechanism for multiple inheritance at all. Rather, (Animal,
    Barky, Bitey) just evaluates to Bitey. Check out the following:


    +   - try this in the console:

    (1, 4, 3, 7);


    What do you expect this to evaluate? The answer is 7. In some languages this expression
    would be an array or list literal. It would throw an error. In JavaScript we get
    this questionable behavior of returning the last value inside the parentheses.
    This is what happens with our earlier attempt at multiple inheritance. This weird
    mechanism does not make class-based multiple inheritance possible. Dog extends
    Bitey, and Bitey alone. End of story.


    JavaScript doesn''t have a class-based way to do multiple inheritance. For that
    you need some other approach. Other languages would use a module, interface, or
    mixin.


