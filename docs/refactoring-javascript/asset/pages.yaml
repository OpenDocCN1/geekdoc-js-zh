  md: "```\nindex++;\nwhile(index < chords.length)\n```\n\nA do...while loop is basically\
    \ like a while loop, and can be handy for things you want to execute at least\
    \ once. Even if the breaking condition is while (false), the loop will run once.\n\
    \nIn all of these loop types so far, we're doing a lot of maintenance on the index.\
    \ But we really care about the index? If you had that thought, the next two are\
    \ for you.\n\n```\nfor (let chord of chords) {\n  if(!allChords.includes(chord))\
    \ {\n    allChords.push(chord);\n  }\n}\n```\n\n```\nfor (let chord in chords)\
    \ {\n  if(allChords.includes(chord)) {\n    allChords.push(chord);\n  }\n}\n```\n\
    \nWelcome to the modern world of for...of and for...in. for...in gets us completely\
    \ away from the index of an index. Think of it as \"element of\" for...in is a\
    \ bit more like our for and while loops, but without handling the index updating\
    \ ourselves. You can think of it as \"index in\" or \"index in danger of being\
    \ wrong\"  (see the following warning on for...in).\n\n![](img/25446dec1fb455dfb6ac99424735816c_184_0.png)\n\
    \n+   for...in caveats\n- Unlike a for loop with explicit indices, indices in\
    \ a for...in loop are not guaranteed to be in order.\n- Any properties that are\
    \ enumerable will be enumerated. This sounds tautological, but arrays could inherit\
    \ \"enumerable properties from other places (e.g., Array.prototype.customFunction),\
    \ or they have them directly set à myArray.customProperty = true.\n- Also, modifying\
    \ the array during a for...in loop can cause confusion.\n\nAs far as loops go,\
    \ in our case of looping through an array and not caring about the specific numerical\
    \ indices, for...comes with less upkeep than traditional loops, and doesn't have\
    \ the complexities of for...in."
