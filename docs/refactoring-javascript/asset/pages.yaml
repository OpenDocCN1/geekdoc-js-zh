    see people preferring the _privateFunction underscore hack for backward compatibility
    and in cases where testing private functions is desired.


    # Wrapping Up


    In this chapter, we covered a lot of detail how JavaScript works. We centered
    our conversation on functions, as they are the most important and complicated
    constructs in JavaScript (in any paradigm worth pursuing).


    But as the goal was to be prescriptive as well as descriptive, here are some takeaways
    repeating:


    +   * Try to keep bulk (complexity and lines of code) low.

    * Try to keep the total number of inputs low.

    * Prefer explicit to nonlocal inputs.

    * Make choices between passing this explicitly versus binding it to the function
    call, rather than hardcoding object names as nonlocal inputs.

    * Prefer real, meaningful return values to side effects.

    * Keep side effects to a minimum or nonexistent.'
