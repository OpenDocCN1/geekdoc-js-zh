  md: "# Speaking of semicolons...\n\nSome people really hate semicolons. They'll\
    \ only use them when absolutely necessary, as evidence of their deep knowledge\
    \ of JavaScript's automatic semicolon insertion (ASI).\n\nPersonally, I find the\
    \ edge cases for when semicolons are necessary somewhat hard to remember, and\
    \ I feel that (including people I work with) do. For those reasons, I include\
    \ them most of the time.\n\n“To semicolon, or not to semicolon?” is not the ultimate\
    \ question for a human: this is a job for a linker to handle.\n\nAlthough the\
    \ syntax might not be what we prefer, the tests still pass, so this is a successful\
    \ refactoring so far. What have we gained? Well, because we're inside of the constructor\
    \ function and not constrained by the JSON syntax, we're free to write any statements\
    \ we want. That means we could have private (meaning exposed) functions and variables\
    \ inside constructor, as well as declaring global variables by using var, let,\
    \ const (or we could do that in the object literal, but not directly). Most importantly,\
    \ as mentioned before, we can get multiple instances of the same object simply\
    \ without, rather than going through unwanted steps to “clone” or “copy” or “create”\
    \ one.\n\n# Constructor Functions Versus Factory Functions\n\nLet's take a break\
    \ from our classifier for a minute. You might find this sample similar to the\
    \ d3 code from Chapter 5, as it also concerns privacy. However, this discussion\
    \ is focused on objects and their creation.\n\nWe'll be defining our API in a\
    \ later section of this chapter, and in order to do that, we should be familiar\
    \ with what we can and cannot access inside constructor functions. The following\
    \ code sample is a bit shorter, so it will be easier to understand before applying\
    \ the concepts to our NBC code:\n\n```\n// constructor function\nconst Secret\
    \ = function() {\nthis.normalInfo = 'this is normal';\nconst secret = 'sekrit';\n\
    const secretFunction = function() {\n  return secret;\n}\nthis.notSecret = function()\
    \ {\n  return secret;\n}\ntallyNotSecret = \"I'm defined in the global scope\"\
    ;\n}\nconst s = new Secret();\nconsole.log(s.normalInfo); // 'this is normal'\n\
    ```"
  merge: -1
  pgno: 254
