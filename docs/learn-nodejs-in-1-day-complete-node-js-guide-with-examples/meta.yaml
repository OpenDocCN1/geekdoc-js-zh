  md: '# Chapter 8: Testing with Jasmine


    Testing is a key element to any application. For Node.js, the framework available
    for testing is called Jasmine. In early 2000, there was a framework for testing
    javascript applications called JsUnit. Later this framework got upgraded and is
    now known as jasmine.


    Jasmine helps in automated unit testing, something which has become quite a key
    practice when developing and deploying modern day web applications.


    In this tutorial, you will learn how to get your environment setup with jasmine
    and how you can start testing your first Node.js application with jasmine.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Overview of Jasmine for testing Node.js applications


    Jasmine is a **Behavior Driven Development(BDD)** testing framework for JavaScript.
    It does **not** rely on browsers, DOM, or any JavaScript framework. Thus, it''s
    suited for websites, Node.js projects, or anywhere that JavaScript can run. To
    start using Jasmine, you need to first download and install the necessary Jasmine
    modules.


    Next you would need to initialize your environment and inspect the jasmine configuration
    file. The below steps shows how to setup Jasmine in your environment


    **Step 1)** Installing the NPM Modules


    To use the jasmine framework from within a Node application, the jasmine module
    needs to be installed first. To install the jasmine-node module, run the below
    command.


    ```

    npm install jasmine-node

    ```


    **Step 2)** Initializing the project – By doing this, jasmine creates a spec directory
    and configuration json for you. The spec directory is used to store all your test
    files. By doing this, jasmine will know where all your tests are, and then can
    execute them accordingly. The JSON file is used to store specific configuration
    information about jasmine.


    To initialize the jasmine environment, run the below command


    ```

    jasmine init

    ```


    **Step 3)** Inspect your configuration file. The configuration file will be stored
    in the spec/support folder as jasmine.json. This file enumerates the source files
    and spec files you would like the Jasmine runner to include.


    The below screenshot shows a typical example of the package.json file for jasmine.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '![](img/cbcb6538723209554d9dc578069d9e55_95_0.png)


    +   1. Note that the spec directory is specified here. As noted earlier, when
