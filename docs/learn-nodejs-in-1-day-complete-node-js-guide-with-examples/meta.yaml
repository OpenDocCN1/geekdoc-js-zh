  md: '# # Chapter 1: Introduction


    The modern web application has really come a long way over the years with the
    introduction of many popular frameworks such as bootstrap, Angular JS, etc. All
    of these frameworks are based on the popular JavaScript framework.


    But when it came to developing server based applications there was just kind of
    a void, and this is where Node.js came into the picture.


    Node.js is also based on the JavaScript framework, but it is used for developing
    server-based applications. While going through the entire tutorial, we will look
    into Node.js in detail and how we can use it to develop server based applications.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# # What is node.js


    Node.js is an open-source, cross-platform runtime environment used for development
    of server-side web applications. Node.js applications are written in JavaScript
    and can be run on a wide variety of operating systems.


    Node.js is based on an event-driven architecture and a non-blocking Input/Output
    API that is designed to optimize an application''s throughput and scalability
    for real-time web applications.


    Over a long period of time, the framework available for web development were all
    based on a stateless model. A stateless model is where the data generated in one
    session (such as information about user settings and events that occurred) is
    not maintained for usage in the next session with that user.


    A lot of work had to be done to maintain the session information between requests
    for a user. But with Node.js there is finally a way for web applications to have
    a real-time, two-way connections, where both the client and server can initiate
    communication, allowing them to exchange data freely.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# Why use Node.js


    We will have a look into the real worth of Node.js in the coming chapters, but
    what is it that makes this framework so famous. Over the years, most of the applications
    were based on a stateless request-response framework. In these sort of applications,
    it is up to the developer to ensure the right code was put in place to ensure
    the state of web session was maintained while the user was working with the system.


    But with Node.js web applications, you can now work in real-time and have a 2-way
    communication. The state is maintained, and the either the client or server can
    start the communication.'
  merge: -1
  pgno: 6
- img_proc: true
  md: "# # Features of Node.js\n\nLet's look at some of the key features of Node.js\n\
    \n+   1. Asynchronous event driven IO helps concurrent request handling – This\
    \ is probably the biggest selling points of Node.js. This feature basically means\
    \ that if a request is received by Node for some Input/Output operation, it will\
    \ execute the operation in the background and continue with processing other requests.\n\
    \nThis is quite different from other programming languages. A simple example of\
    \ this is given in the code below\n\n```\nvar fs = require('fs');\n    fs.readFile(\"\
    Sample.txt\",function(error,data)\n {\n             console.log(\"Reading Data\
    \ completed\");\n});\n```\n\n+   - The above code snippet looks at reading a file\
    \ called Sample.txt. In other programming languages, the next line of processing\
    \ would only happen once the entire file is read.\n- But in the case of Node.js\
    \ the important fraction of code to notice is the declaration of the function\
    \ ('function(error,data)'). This is known as a callback function.\n- So what happens\
    \ here is that the file reading operation will start in the background. And other\
    \ processing can happen simultaneously while the file is being read. Once the\
    \ file read operation is completed, this anonymous function will be called and\
    \ the text \"Reading Data completed\" will be written to the console log.\n\n\
    +   2. Node uses the V8 JavaScript Runtime engine, the one which is used by Google\
    \ Chrome. Node has a wrapper over the JavaScript engine which makes the runtime\
    \ engine much faster and hence processing of requests within Node also become\
    \ faster.\n\n+   3. Handling of concurrent requests – Another key functionality\
    \ of Node is the ability to handle concurrent connections with a very minimal\
    \ overhead on a single process.\n\n+   4. The Node.js library used JavaScript\
    \ – This is another important aspect of development in Node.js. A major part of\
    \ the development community are already well versed in javascript, and hence,\
    \ development in Node.js becomes easier for a developer who knows javascript."
  merge: -1
  pgno: 7
