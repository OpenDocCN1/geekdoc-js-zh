  md: '# # Chapter 6: Node.js with MongoDB


    Mostly all modern day web applications have some sort of data storage system at
    the backend to store data. For example, if you take the case of a web shopping
    application, data such as the price of an item or the number of items of a particular
    type would be stored in the database.


    The Node js framework has the ability to work with databases which are commonly
    required by most modern day web applications. Node js can work with both relational
    (such as Oracle and MS SQL Server) and non-relational databases (such as MongoDB
    and MySQL). During this tutorial, we will see how we can use databases from within
    Node js applications.'
  merge: -1
