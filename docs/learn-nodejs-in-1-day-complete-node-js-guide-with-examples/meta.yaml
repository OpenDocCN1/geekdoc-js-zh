    ways.


    If you are interested in only determining the number of attached listeners, then
    look no further than the EventEmitter.listenerCount() method.


    (Note: Listeners are important because the main program should know if listeners
    are being added on the fly to an event, else the program will malfunction because
    additional listeners will get called.)


