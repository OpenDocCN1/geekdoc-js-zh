  md: '# Node.js and NoSQL Databases


    Over the years, NoSQL database such as MongoDB and MySQL have become quite popular
    as databases for storing data. The ability of these databases to store any sort
    of content and particularly in any sort of format is what makes these databases
    so famous.


    Node.js has the ability to work with both MySQL and MongoDB as databases. In order
    to use either of these databases, you need to download and use the required modules
    using the Node package manager.


    For MySQL, the required module is called "mysql" and for using MongoDB the required
    module to be installed is "Mongoose."


    With these modules, you can perform the following operations in Node.js


    +   1. Manage the connection pooling – Here is where you can specify the number
    of MySQL database connections that should be maintained and saved by Node.js.

    2. Create and close a connection to a database. In either case, you can provide
    a callback function which can be called whenever the "create" and "close" connection
    methods are executed.

    3. Queries can be executed to get data from respective databases to retrieve data.

    4. Data manipulation such as inserting data, deleting and updating data can also
    be achieved with these modules.


    For the remaining topics, we will look at how we can work with MongoDB databases
    within Node.js.'
