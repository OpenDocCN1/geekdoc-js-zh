    \nMongoClient.connect(url)\n    .then(function(err, db) {\n        db.collection('Employee').updateOne({\n\
    \            \"EmployeeName\": \"Martin\"\n        }, {\n            $set: {\n\
    \                \"EmployeeName\": \"Mohan\"\n            }\n        });\n   \
    \ });\n```\n\n# ### Code Explanation:-\n\n+   1. The first part is to include\
    \ the 'promise' module which will allow us to use the promise functionality in\
    \ our code.\n2. We can now append the 'then' function to our MongoClient.connect\
    \ function. So what this does is that when the connection is established to the\
    \ database, we need to execute the code snippet defined thereafter.\n3. Finally,\
    \ we define our code snippet which does the work of updating EmployeeName of the\
    \ employee with the name of \"Martin\" to \"Mohan\"."
- md: "## Note:\n\nIf you now check the contents of your MongoDB database, you will\
    \ find that if a record with EmployeeName of \"Martin\" exists, it will be updated\
    \ to \"Mohan.\"\n\nTo check that the data has been properly inserted in the database,\
    \ you need to execute the following commands in MongoDB:\n\n1. Use EmployeeDB\n\
    2. db.Employee.find({EmployeeName: \"Mohan\"})\n\nThe first statement ensures\
    \ that you are connected to the EmployeeDB database. The second statement searches\
    \ for the record which has the employee name of \"Mohan\".\n\n## Dealing with\
    \ nested promises\n\nWhen defining promises, it needs to be noted that the \"\
    then\" method itself returns a promise. So in a sense, promises can be nested\
    \ or chained to each other.\n\nIn the example below, we use chaining to define\
    \ 2 callback functions, both of which insert a record into the MongoDB database.\n\
    \n**(Note:** Chaining is a concept used to link execution of methods to one another.\
    \ Suppose if your application had 2 methods called 'methodA' and 'methodB.' And\
    \ the logic was such that 'methodB' should be called after 'methodA,' then you\
    \ would chain the execution in such a way that 'methodB' gets called directly\
    \ after 'methodA.'**)**\n\nThe key thing to note in this example is that the code\
    \ becomes cleaner, readable and maintainable by using nested promises.\n\n```\n\
    var Promise = require('promise');\nvar MongoClient = require('mongodb').MongoClient;\n\
    var url = 'mongodb://localhost/EmployeeDB';\nMongoClient.connect(url)\n\n.then(function(db)\
    \ {\n    db.collection('Employee').insertOne({\n        Employeeid: 4,\n     \
    \   EmployeeName: \"NewEmployee\"\n    })\n\n    .then(function(db1) {\n     \
    \   db1.collection('Employee').insertOne({\n            Employeeid: 5,\n     \
    \       EmployeeName: \"NewEmployee1\"\n        })\n    })\n});\n```\n\n### Code\
    \ Explanation:\n\n1. We are now defining 2 \"then\" clauses which get executed\
    \ one after the other. In the first then clause, we are passing the 'db' parameter\
    \ which contains our database connection. We are then using the collection property\
    \ of the 'db' connection to insert records into the 'Employee' collection. The\
    \ 'insertOne' method is used to insert the actual document into the Employee collection.\n\
    2. We are then using the 2nd then clause also to insert another record into the\
    \ database.\n\nIf you now check the contents of your MongoDB database, you will\
    \ find the 2 records inserted into the MongoDB database.\n\n## Generating promises\
    \ with the BlueBird library\n\nBluebird is a fully-featured Promise library for\
    \ JavaScript. The strongest feature of Bluebird is that it allows you to \"promisify\"\
    \ other Node modules in order to use them asynchronously. Promisify is a concept\
    \ applied to callback functions. This concept is used to ensure that every callback\
    \ function which is called returns some sort of value.\n\nSo if a Node JS module\
    \ contains a callback function which does not return a value, if we Promisify\
    \ the node module, all the functions in that specific node module would automatically\
    \ be modified to ensure that it returns a value.\n\nSo you can use BlueBird to\
    \ make the MongoDB module run asynchronously. This just adds another level of\
    \ ease when writing Node.js applications.\n\nWe will look at an example of how\
    \ to use the bluebird module.\n\nOur example will first establish a connection\
    \ to the \"Employee collection\" in the \"EmployeeDB\" database. If the connection\
    \ is established, then it will get all of the records in the collection and display\
    \ them in the console accordingly.\n\n### Step 1) Installing the NPM Modules\n\
    To use Bluebird from within a Node application, the Bluebird module is required.\
    \ To install the Bluebird module, run the below command\n\n```\nnpm install bluebird\n\
    ```\n\n### Step 2)\nThe next step is to include the bluebird module in your code\
    \ and promisify the entire MongoDB module. By promisify, we mean that bluebird\
    \ will ensure that each and every method defined in the MongoDB library returns\
    \ a promise.\n\n![](img/cbcb6538723209554d9dc578069d9e55_72_0.png)\n\n### Code\
    \ Explanation:\n\n1. The require command is used to include the Bluebird library.\n\
    2. Use Bluebird's .promisifyAll() method to create an async version of every method\
    \ the MongoDB module provides. This ensures that each method of the MongoDB module\
    \ will run in the background and ensure that a promise is returned for each method\
    \ call in the MongoDB library.\n\n### Step 3)\nThe final step is to connect to\
    \ our database, retrieve all the records in our collection and display them in\
    \ our console log.\n\n```\nmongoClient.connectAsync('mongodb://localhost/EmployeeDB')\n\
    \  .then(function(db) {\n    return db.collection('Employee').findAsync({})\n\
    \  })\n  .then(function(cursor) {\n    cursor.each(function(err, doc) {\n    \
    \  console.log(doc);\n    })\n  });\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_73_0.png)\n\
    \n### Code Explanation:\n\n1. You will notice that we are using the \"connectAsync\"\
    \ method instead of the normal connection method for connecting to the database.\
    \ Bluebird actually adds the Async keyword to each method in the MongoDB library\
    \ to distinguish those calls which return promises and those which don't. So there\
    \ is no guarantee that methods without the Async word will return a value.\n2.\
    \ Similar to the connectAsync method, we are now using the findAsync method to\
    \ return all of the records in the mongoDB 'Employee' collection.\n3. Finally,\
    \ if the findAsync returns a successful promise we then define a block of code\
    \ to iterate through each record in the collection and display them in the console\
    \ log.\n\nIf the above steps are carried out properly, all of the documents in\
    \ the Employee collection will be displayed in the console as shown in the output\
    \ below.\n\n![](img/cbcb6538723209554d9dc578069d9e55_74_0.png)\n\nHere is the\
    \ code for your reference\n\n```\nvar Promise = require('bluebird');\n\nvar mongoClient\
    \ = Promise.promisifyAll(require('mongodb')).MongoClient;\n\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    mongoClient.connectAsync('mongodb://localhost/EmployeeDB')\n\n.then(function(db)\
    \ {\n    return db.collection('Employee').findAsync({})\n\n})\n.then(function(cursor)\
    \ {\n    cursor.each(function(err, doc) {\n        console.log(doc);\n    })\n\
    });\n```\n\n## Creating a custom promise\n\nA custom promise can be created by\
    \ using a node module called 'q.' The 'q' library needs to be downloaded and installed\
    \ using the node package manager. After using the 'q' library, the method \"denodeify\"\
    \ can be called which will cause any function to become a function which returns\
    \ a promise.\n\nIn the example below, we will create a simple function called\
    \ \"Add\" which will add 2 numbers. We will convert this function into a function\
    \ to return a promise.\n\nOnce that is done, we will use the promise returned\
    \ by the Add function to display a message in the console.log.\n\nLet's follow\
    \ the below steps to creating our custom function to return a promise.\n\n###\
    \ Step 1) Installing the NPM Modules\n\nTo use 'q' from within a Node JS application,\
    \ the 'q' module is required. To install the 'q' module, run the below command\n\
    \n```\nnpm install q\n```\n\n### Step 2) Define the following code which will\
    \ be used to create the custom promise.\n\n```\nvar Q = require('q');\n\nfunction\
    \ Add() {\n    var a, b, c;\n    a = 5; b = 6;\n    c = a + b;\n}\n\nvar Display_promise\
    \ = Q.denodeify(Add);\n\nvar promise = Add;\n\npromise.then\n{console.log(\"Addition\
    \ function complete\");}\n```\n\n### Code Explanation:\n\n1. The first bit is\
    \ to include the 'q' library by using the require keyword. By using this library,\
    \ we will be able to define any function to return a callback.\n2. We are creating\
    \ a function called Add which will add 2 numbers defined in variables a and b.\
    \ The sum of these values will be stored in variable c.\n3. We are then using\
    \ the q library to denodeify (the method used to convert any function into a function\
    \ that would return a promise) our Add function or in other words convert our\
    \ Add function to a function which returns a promise.\n4. We now call our \"Add\"\
    \ function and are able to get a return promise value because of the prior step\
    \ we performed of denodeify the Add function.\n5. The 'then' keyword is used to\
    \ specify that if the function is executed successfully then display the string\
    \ \"Addition function completed\" in the console.log.\n\nWhen the above code is\
    \ run, the output \"Addition function completed\" will be displayed in the console.log\
    \ as shown below.\n\n![](img/cbcb6538723209554d9dc578069d9e55_76_0.png)"
  mdcn: "\n## 注意：\n\n现在检查 MongoDB 数据库的内容，如果存在员工名为 \"Martin\" 的记录，它将被更新为 \"Mohan\"\
    。\n\n要检查数据是否已正确插入数据库，你需要在 MongoDB 中执行以下命令：\n\n1.  使用 EmployeeDB\n2.  `db.Employee.find({EmployeeName:\
    \ \"Mohan\"})`\n\n第一条语句确保你连接到 EmployeeDB 数据库。第二条语句搜索员工名为 \"Mohan\" 的记录。\n\n##\
    \ 处理嵌套的 Promise\n\n在定义 Promise 时，需要注意的是 `then` 方法本身会返回一个 Promise。因此，在某种意义上，Promise\
    \ 可以彼此嵌套或链接。\n\n在下面的例子中，我们使用链式调用来定义 2 个回调函数，它们都将一条记录插入 MongoDB 数据库。\n\n**(注意：**\
    \ 链式调用是一种将方法执行相互关联的概念。假设你的应用有 2 个名为 'methodA' 和 'methodB' 的方法，并且逻辑要求在 'methodA'\
    \ 执行之后再调用 'methodB'，那么你会以某种方式链式调用，使得 'methodB' 在 'methodA' 之后直接被调用。**)**\n\n这个例子中需要注意的关键点是，通过使用嵌套的\
    \ Promise，代码变得更简洁、可读且易于维护。\n\n```\nvar Promise = require('promise');\nvar MongoClient\
    \ = require('mongodb').MongoClient;\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    MongoClient.connect(url)\n\n.then(function(db) {\n    db.collection('Employee').insertOne({\n\
    \        Employeeid: 4,\n        EmployeeName: \"NewEmployee\"\n    })\n\n   \
    \ .then(function(db1) {\n        db1.collection('Employee').insertOne({\n    \
    \        Employeeid: 5,\n            EmployeeName: \"NewEmployee1\"\n        })\n\
    \    })\n});\n```\n\n### 代码解释：\n\n1.  我们现在定义了 2 个 `then` 子句，它们将依次执行。在第一个 `then`\
    \ 子句中，我们传递了包含数据库连接的 'db' 参数。然后我们使用 'db' 连接的 `collection` 属性将记录插入 'Employee' 集合。`insertOne`\
    \ 方法用于将实际的文档插入 Employee 集合。\n2.  接着我们使用第二个 `then` 子句将另一条记录插入数据库。\n\n现在检查 MongoDB\
    \ 数据库的内容，你会找到已插入的 2 条记录。\n\n## 使用 BlueBird 库生成 Promise\n\nBluebird 是一个功能齐全的 JavaScript\
    \ Promise 库。Bluebird 最强大的功能是它允许你将其他 Node 模块 \"Promise 化\"，以便异步使用它们。Promise 化是应用于回调函数的概念。这个概念用于确保每个被调用的回调函数都返回某种值。\n\
    \n因此，如果一个 Node JS 模块包含一个不返回值的回调函数，如果我们将其 Promise 化，该特定 Node 模块中的所有函数都将被自动修改，以确保返回值。\n\
    \n所以你可以使用 BlueBird 让 MongoDB 模块异步运行。这为编写 Node.js 应用程序又增加了一层便利。\n\n我们将看一个如何使用 bluebird\
    \ 模块的例子。\n\n我们的示例将首先建立与 \"EmployeeDB\" 数据库中 \"Employee 集合\" 的连接。如果连接建立成功，它将获取集合中的所有记录并相应地在控制台中显示。\n\
    \n### 步骤 1) 安装 NPM 模块\n要在 Node 应用程序中使用 Bluebird，需要 Bluebird 模块。要安装 Bluebird 模块，请运行以下命令\n\
    \n```\nnpm install bluebird\n```\n\n### 步骤 2)\n下一步是在你的代码中包含 bluebird 模块，并将整个 MongoDB\
    \ 模块 Promise 化。Promise 化的意思是 bluebird 将确保 MongoDB 库中定义的每个方法都返回一个 Promise。\n\n\
    ![](img/cbcb6538723209554d9dc578069d9e55_72_0.png)\n\n### 代码解释：\n\n1.  `require`\
    \ 命令用于引入 Bluebird 库。\n2.  使用 Bluebird 的 `.promisifyAll()` 方法为 MongoDB 模块提供的每个方法创建异步版本。这确保了\
    \ MongoDB 模块的每个方法都将在后台运行，并确保为 MongoDB 库中的每次方法调用都返回一个 Promise。\n\n### 步骤 3)\n最后一步是连接到我们的数据库，检索集合中的所有记录，并在控制台日志中显示它们。\n\
    \n```\nmongoClient.connectAsync('mongodb://localhost/EmployeeDB')\n  .then(function(db)\
    \ {\n    return db.collection('Employee').findAsync({})\n  })\n  .then(function(cursor)\
    \ {\n    cursor.each(function(err, doc) {\n      console.log(doc);\n    })\n \
    \ });\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_73_0.png)\n\n### 代码解释：\n\
    \n1.  你会注意到我们使用 `connectAsync` 方法而不是普通的连接方法来连接数据库。Bluebird 实际上在 MongoDB 库的每个方法后添加了\
    \ Async 关键字，以区分那些返回 Promise 的调用和那些不返回的调用。因此，没有保证不带 Async 关键字的方法会返回值。\n2.  类似于\
    \ `connectAsync` 方法，我们现在使用 `findAsync` 方法来返回 mongoDB 'Employee' 集合中的所有记录。\n3.\
    \  最后，如果 `findAsync` 返回一个成功的 Promise，然后我们定义一个代码块来遍历集合中的每条记录并在控制台日志中显示它们。\n\n如果上述步骤执行正确，Employee\
    \ 集合中的所有文档将显示在控制台中，如下所示。\n\n![](img/cbcb6538723209554d9dc578069d9e55_74_0.png)\n\
    \n以下是供参考的代码\n\n```\nvar Promise = require('bluebird');\n\nvar mongoClient = Promise.promisifyAll(require('mongodb')).MongoClient;\n\
    \nvar url = 'mongodb://localhost/EmployeeDB';\nmongoClient.connectAsync('mongodb://localhost/EmployeeDB')\n\
    \n.then(function(db) {\n    return db.collection('Employee').findAsync({})\n\n\
    })\n.then(function(cursor) {\n    cursor.each(function(err, doc) {\n        console.log(doc);\n\
    \    })\n});\n```\n\n## 创建自定义 Promise\n\n可以使用名为 'q' 的 Node 模块创建自定义 Promise。'q'\
    \ 库需要使用 node 包管理器下载和安装。使用 'q' 库后，可以调用 `denodeify` 方法，该方法会使任何函数变成返回 Promise 的函数。\n\
    \n在下面的例子中，我们将创建一个名为 \"Add\" 的简单函数，用于将两个数字相加。我们将把这个函数转换成一个返回 Promise 的函数。\n\n完成后，我们将使用\
    \ Add 函数返回的 Promise 在 console.log 中显示消息。\n\n让我们按照以下步骤创建返回 Promise 的自定义函数。\n\n\
    ### 步骤 1) 安装 NPM 模块\n\n要在 Node JS 应用程序中使用 'q'，需要 'q' 模块。要安装 'q' 模块，请运行以下命令\n\n\
    ```\nnpm install q\n```\n\n### 步骤 2) 定义以下代码，用于创建自定义 Promise。\n\n```\nvar Q = require('q');\n\
    \nfunction Add() {\n    var a, b, c;\n    a = 5; b = 6;\n    c = a + b;\n}\n\n\
    var Display_promise = Q.denodeify(Add);\n\nvar promise = Add;\n\npromise.then\n\
    {console.log(\"Addition function complete\");}\n```\n\n### 代码解释：\n\n1.  第一部分是使用\
    \ require 关键字包含 'q' 库。使用这个库，我们将能够定义任何函数返回一个回调。\n2.  我们创建了一个名为 Add 的函数，它将把变量 a\
    \ 和 b 中定义的两个数字相加。这些值的和将存储在变量 c 中。\n3.  然后我们使用 q 库来 denodeify（用于将任何函数转换为返回 Promise\
    \ 的函数的方法）我们的 Add 函数，或者换句话说，将我们的 Add 函数转换为返回 Promise 的函数。\n4.  我们现在调用 \"Add\" 函数，并由于之前执行的\
    \ denodeify Add 函数的操作，能够获得一个返回的 Promise 值。\n5.  `then` 关键字用于指定如果函数执行成功，则在 console.log\
    \ 中显示字符串 \"Addition function completed\"。\n\n运行上述代码后，输出 \"Addition function completed\"\
    \ 将显示在 console.log 中，如下所示。\n\n![](img/cbcb6538723209554d9dc578069d9e55_76_0.png)\n"
