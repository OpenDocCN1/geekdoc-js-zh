    \ create a basic web server application using Node js.\n\n## Node as web server\
    \ using HTTP\n\nLet's look at an example of how to create and run our first Node\
    \ js application.\n\nOur application is going to create a simple server module\
    \ which will listen on port no 7000. If a request is made through the browser\
    \ on this port no, then server application will send a 'Hello World' response\
    \ to the client.\n\n```javascript\nvar http=require('http')\nvar server=http.createServer((function(request,response)\n\
    {\n    response.writeHead(200,\n    {\"Content-Type\" : \"text/plain\"});\n  \
    \  response.end(\"Hello World\\n\");\n}));\nserver.listen(7000);\n```\n\n### Code\
    \ Explanation:\n\n1.  The basic functionality of the require function is that\
    \ it reads a javascript file, executes the file, and then proceeds to return the\
    \ exports object. So in our case, since we want to use the functionality of the\
    \ http module, we use the require function to get the required functions from\
    \ the http module so that it can be used in our application.\n2.  In this line\
    \ of code, we are creating a server application which is based on a simple function.\
    \ This function is called whenever a request is made to our server application.\n\
    3.  When a request is received, we are saying to send a response with a header\
    \ type of '200.' This number is the normal response which is sent in an http header\
    \ when a successful response is sent to the client.\n4.  In the response itself,\
    \ we are sending the string 'Hello World.'\n5.  We are then using the server.listen\
    \ function to make our server application listen to client requests on port no\
    \ 7000. You can specify any available port over here.\n\nIf the command is executed\
    \ successfully, the following Output will be shown when you run your code in the\
    \ browser.\n\n### Output:\n\n![](img/cbcb6538723209554d9dc578069d9e55_37_0.png)\n\
    \nFrom the output:\n\n-   You can clearly see that if we browse to the URL of\
    \ localhost on port 7000, you will see the string 'Hello World' displayed in the\
    \ page.\n-   Because in our code we have mentioned specifically for the server\
    \ to listen on port no 7000, we are able to view the output when browsing to this\
    \ url.\n\nHere is the code for your reference:\n\n```javascript\nvar http=require('http')\n\
    \nvar server=http.createServer((function(request,response)\n{\n\nresponse.writeHead(200,\n\
    {\"Content-Type\" : \"text/plain\"});\n\nresponse.end(\"Hello World\\n\");\n}));\n\
    \nserver.listen(7000);\n```"
