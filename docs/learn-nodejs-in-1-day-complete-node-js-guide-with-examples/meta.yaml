  md: 'Pipes can be used to connect multiple streams together. One of the most common
    example is to pipe the read and write stream together for the transfer of data
    from one file to the other.


    +   - Node.js is often also tagged as an event driven framework, and it''s very
    easy to define events in Node.js. Functions can be defined which respond to these
    events.

    - Events also expose methods for responding to key events. For example, we have
    seen the once() event handler which can be used to make sure that a callback function
    is only executed once when an event is triggered.'
