- md: "## What are generators\n\nGenerators have become quite famous in Node.js in\
    \ recent times and that probably because of what they are capable of doing.\n\n\
    - Generators are function executions that can be suspended and resumed at a later\
    \ point.\n- Generators are useful when carrying out concepts such as 'lazy execution'.\
    \ This basically means that by suspending execution and resuming at will, we are\
    \ able to pull values only when we need to.\n\nGenerators have the below 2 key\
    \ methods\n\n1. Yield method – The yield method is called in a function to halt\
    \ the execution of the function at the specific line where the yield method is\
    \ called.\n2. Next method – This method is called from the main application to\
    \ resume the execution of a function which has a yield method. The execution of\
    \ the function will continue till the next yield method or till the end of the\
    \ method.\n\nLet's look at an example of how generators can be used.\n\nIn our\
    \ example, we are going to have a simple Add function which will add 2 numbers,\
    \ but we will keep on halting the method execution at different points to showcase\
    \ how generators can be used.\n\n```\nfunction* Add(x) {\n    yield x + 1;\n \
    \   var y = yield(null);\n    y = 6\n    return x + y;\n}\n\nvar gen = Add(5);\n\
    \ngen.next();\n\ngen.next();\n```\n\n### Code Explanation:\n\n1. The first step\
    \ is to define our generator \"function\". Note that this is done by adding a\
    \ \"*\" to the function keyword. We are then defining a function called Add which\
    \ takes a parameter of x.\n2. The yield keyword is specific to generators. This\
    \ makes it a powerful construct for pausing a function in the middle of anything.\
    \ So here, the function execution will be halted till we invoke the next() function,\
    \ which will be done in Step4. At this point, the value of x will become 6 and\
    \ the execution of the function will be stopped.\n3. This is where we first call\
    \ the generator function and send the value of 5 to our Add function. This value\
    \ will be substituted in the x parameter of our Add function.\n4. Once we call\
    \ the next() function, the Add() function will resume the execution. When the\
    \ next statement var y= yield(null) will be executed, the Add() function will\
    \ again stop executing.\n5. Now after calling the next() function again, the next\
    \ statements will run, and the combined value of x=6 and y=6 will be added and\
    \ returned.\n\n## Callbacks vs. generators\n\nGenerators are used to solve the\
    \ problem of what is known as callback hell. Sometimes callback functions become\
    \ so nested during the development of a Node.js application that it just becomes\
    \ too complicated to use callback functions.\n\nThis is where generators are useful.\
    \ One of the most common examples of this is when creating timer functions.\n\n\
    Let's see the below example of how generators can prove to be useful over callbacks.\n\
    \nOur example will just create a simple time delay function. We would then want\
    \ to call this function incorporating a delay of 1000, 2000 and 3000 ms.\n\n**Step\
    \ 1)** Define our callback function with the necessary time delay code.\n\n![](img/cbcb6538723209554d9dc578069d9e55_79_0.png)\n\
    \n### Code Explanation:\n\n1. Here we are creating a function called Timedelay\
    \ with a parameter called ptime. This will take in the necessary time delay we\
    \ want to introduce in our application.\n2. The next step is to just create a\
    \ message, which will be displayed to the user saying that the application is\
    \ going to be pause for these many numbers of milliseconds.\n\n**Step 2)** Now\
    \ let's look at the code if we were incorporating callbacks. Suppose we wanted\
    \ to incorporate callbacks based on the value of 1000, 2000 and 3000 milliseconds,\
    \ the below code shows how we would need to implement these using callbacks.\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_80_0.png)\n\n### Code Explanation:\n\
    \n1. We are calling the Timedelay as a callback with 1000 as the value.\n2. Next\
    \ we want to call the Timedelay function again with 2000 as the value.\n3. Finally,\
    \ we want to call the Timedelay function again with 3000 as the value.\n\nFrom\
    \ the above code, you can see that it becomes messier as we want to start calling\
    \ the function multiple times.\n\n**Step 3)** Now let's see how to implement the\
    \ same code using generators. From the below code you can now see how simple it\
    \ has become to implement the Timedelay function using generators.\n\n![](img/cbcb6538723209554d9dc578069d9e55_81_0.png)\n\
    \n### Code Explanation:\n\n1. We are first defining a generator function which\
    \ will be used to call our Timedelay function.\n2. We are calling the Yield function\
    \ along with the Timedelay function with 1000 as the parameter value.\n3. We are\
    \ then calling the Yield function along with the Timedelay function with 2000\
    \ as the parameter value.\n4. Finally, we are calling the Yield function along\
    \ with the Timedelay function with 3000 as the parameter value.\n\n## Filestream\
    \ in Node.js\n\nNode makes extensive use of streams as a data transfer mechanism.\n\
    \nFor example, when you output anything to the console using the console.log function,\
    \ you are actually using a stream to send the data to the console.\n\nNode.js\
    \ also has the ability to stream data from files so that they can be read and\
    \ written appropriately. We will now look at an example of how we can use streams\
    \ to read and write from files. We need to follow the below-mentioned steps for\
    \ this example\n\n**Step 1)** Create a file called data.txt which has the below\
    \ data. Let assume this file is stored on the D drive of our local machine.\n\n\
    - Tutorial on Node.js\n- Introduction\n- Events\n- Generators\n- Data Connectivity\n\
    - Using Jasmine\n\n**Step 2)** Write the relevant code which will make use of\
    \ streams to read data from the file.\n\n```\nvar fs = require(\"fs\");\nvar stream;\n\
    stream = fs.createReadStream(\"D://data.txt\");\n\nstream.on(\"data\", function(data)\
    \ {\n    var chunk = data.toString();\n    console.log(chunk);\n});\n```\n\n###\
    \ Code Explanation:\n\n1. We first need to include the 'fs' modules which contain\
    \ all the functionality required to create streams.\n2. Next we create a readable\
    \ stream by using the method – createReadStream. As an input, we give the location\
    \ of our data.txt file.\n3. The stream.on function is an event handler and in\
    \ it, we are specifying the first parameter as 'data.' This means that whenever\
    \ data comes in the stream from the file, then execute a callback function. In\
    \ our case, we are defining a callback function which will carry out 2 basic steps.\
    \ The first is to convert the data read from the file as a string. The second\
    \ would be to send the converted string as an output to the console.\n4. We are\
    \ taking each chunk of data which is read from the data stream and converting\
    \ it to a string.\n5. Finally, we are sending the output of each string converted\
    \ chunk to the console.\n\n### Output:\n\n![](img/cbcb6538723209554d9dc578069d9e55_83_0.png)\n\
    \n- If the code is executed properly, you will see the above output in the console.\
    \ This output will be the same as that in the data.txt file.\n\n### Writing to\
    \ a file\n\nIn the same way, that we create a read stream, we can also create\
    \ a write stream to write data to a file. Let's first create an empty file with\
    \ no contents called data.txt. Let's assume this file is placed in the D drive\
    \ of our computer.\n\nThe below code shows how we can write data to the file.\n\
    \n```\nvar fs = require(\"fs\");\nvar stream;\nstream = fs.createWriteStream(\"\
    D://data.txt\");\n\nstream.write(\"Tutorial on Node.js\")\nstream.write(\"Introduction\"\
    )\nstream.write(\"Events\")\nstream.write(\"Generators\")\nstream.write(\"Data\
    \ Connectivity\")\nstream.write(\"Using Jasmine\")\n```\n\n### Code Explanation:\n\
    \n1. We are creating a writable stream by using the method – createWriteStream.\
    \ As an input, we give the location of our data.txt file.\n2. Next we used the\
    \ stream.write method to write the different lines of text to our text file. The\
    \ stream will take care of writing this data to the data.txt file.\n\nIf you open\
    \ the data.txt file, you will now see the following data in the file\n\nTutorial\
    \ on Node.js\nIntroduction\nEvents\nGenerators\nData Connectivity\nUsing Jasmine"
  mdcn: "\n## 什么是生成器\n\n生成器（Generators）近年来在 Node.js 中变得相当流行，这可能是因为它们能够做的事情。\n\n- 生成器是可以在稍后时间点被暂停和恢复的函数执行。\n\
    - 生成器在执行诸如“惰性执行”等概念时非常有用。这基本上意味着，通过按需暂停和恢复执行，我们能够仅在需要时才拉取值。\n\n生成器有以下 2 个关键方法\n\
    \n1. Yield 方法 – 在函数中调用 yield 方法，会在调用该方法的特定行暂停函数的执行。\n2. Next 方法 – 此方法从主应用程序中调用，以恢复包含\
    \ yield 方法的函数的执行。函数的执行将继续，直到下一个 yield 方法或方法结束。\n\n让我们看一个如何使用生成器的示例。\n\n在我们的示例中，我们将有一个简单的\
    \ Add 函数，用于将两个数字相加，但我们会不断在不同点暂停方法执行，以展示如何使用生成器。\n\n```\nfunction* Add(x) {\n \
    \   yield x + 1;\n    var y = yield(null);\n    y = 6\n    return x + y;\n}\n\n\
    var gen = Add(5);\n\ngen.next();\n\ngen.next();\n```\n\n### 代码解释：\n\n1. 第一步是定义我们的生成器“函数”。请注意，这是通过在函数关键字前添加一个“*”来完成的。然后我们定义了一个名为\
    \ Add 的函数，它接受一个参数 x。\n2. yield 关键字是生成器特有的。这使其成为一个强大的构造，可以在任何时刻暂停函数。因此在这里，函数执行将被暂停，直到我们调用\
    \ next() 函数，这将在步骤 4 中完成。此时，x 的值将变为 6，函数的执行将停止。\n3. 这是我们第一次调用生成器函数并将值 5 发送到我们的\
    \ Add 函数。此值将被替换到 Add 函数的 x 参数中。\n4. 一旦我们调用 next() 函数，Add() 函数将恢复执行。当下一条语句 `var\
    \ y= yield(null)` 被执行时，Add() 函数将再次停止执行。\n5. 现在再次调用 next() 函数后，接下来的语句将运行，并且将相加\
    \ x=6 和 y=6 的合并值并返回。\n\n## 回调 vs. 生成器\n\n生成器用于解决所谓的回调地狱问题。有时在开发 Node.js 应用程序时，回调函数会变得如此嵌套，以至于使用回调函数变得过于复杂。\n\
    \n这就是生成器有用的地方。最常见的例子之一是创建定时器函数。\n\n让我们看下面的示例，了解生成器如何比回调更有用。\n\n我们的示例将只创建一个简单的延时函数。然后我们想要调用此函数，分别包含\
    \ 1000、2000 和 3000 毫秒的延迟。\n\n**步骤 1)** 定义我们的回调函数，包含必要的延时代码。\n\n![](img/cbcb6538723209554d9dc578069d9e55_79_0.png)\n\
    \n### 代码解释：\n\n1. 这里我们创建了一个名为 Timedelay 的函数，带有一个参数 ptime。它将接收我们希望在应用程序中引入的必要延时。\n\
    2. 下一步是创建一条消息，将向用户显示，说明应用程序将暂停这么多毫秒。\n\n**步骤 2)** 现在让我们看看如果我们使用回调的代码。假设我们想基于 1000、2000\
    \ 和 3000 毫秒的值来使用回调，下面的代码展示了如何使用回调来实现这些。\n\n![](img/cbcb6538723209554d9dc578069d9e55_80_0.png)\n\
    \n### 代码解释：\n\n1. 我们使用 1000 作为值调用 Timedelay 作为回调。\n2. 接下来，我们想再次调用 Timedelay 函数，使用\
    \ 2000 作为值。\n3. 最后，我们想再次调用 Timedelay 函数，使用 3000 作为值。\n\n从上面的代码可以看出，当我们需要多次调用函数时，代码会变得越来越混乱。\n\
    \n**步骤 3)** 现在让我们看看如何使用生成器实现相同的代码。从下面的代码中，你现在可以看到使用生成器实现 Timedelay 函数变得多么简单。\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_81_0.png)\n\n### 代码解释：\n\n1. 我们首先定义了一个生成器函数，该函数将用于调用我们的\
    \ Timedelay 函数。\n2. 我们调用 Yield 函数，并将 Timedelay 函数与参数值 1000 一起调用。\n3. 然后我们调用 Yield\
    \ 函数，并将 Timedelay 函数与参数值 2000 一起调用。\n4. 最后，我们调用 Yield 函数，并将 Timedelay 函数与参数值 3000\
    \ 一起调用。\n\n## Node.js 中的文件流\n\nNode 大量使用流作为数据传输机制。\n\n例如，当你使用 console.log 函数向控制台输出任何内容时，你实际上是在使用流将数据发送到控制台。\n\
    \nNode.js 还能够从文件中流式传输数据，以便可以适当地读取和写入。我们现在将看一个如何使用流从文件读取和写入的示例。为此示例，我们需要遵循以下步骤\n\
    \n**步骤 1)** 创建一个名为 data.txt 的文件，其中包含以下数据。假设此文件存储在我们本地机器的 D 盘上。\n\n- Node.js 教程\n\
    - 介绍\n- 事件\n- 生成器\n- 数据连接\n- 使用 Jasmine\n\n**步骤 2)** 编写相关代码，利用流从文件读取数据。\n\n```\n\
    var fs = require(\"fs\");\nvar stream;\nstream = fs.createReadStream(\"D://data.txt\"\
    );\n\nstream.on(\"data\", function(data) {\n    var chunk = data.toString();\n\
    \    console.log(chunk);\n});\n```\n\n### 代码解释：\n\n1. 我们首先需要包含 'fs' 模块，该模块包含创建流所需的所有功能。\n\
    2. 接下来，我们使用方法 – createReadStream 创建一个可读流。作为输入，我们提供 data.txt 文件的位置。\n3. stream.on\
    \ 函数是一个事件处理程序，在其中我们将第一个参数指定为 'data'。这意味着每当数据从文件流入流中时，就执行一个回调函数。在我们的例子中，我们定义了一个回调函数，它将执行两个基本步骤。第一个是将从文件读取的数据转换为字符串。第二个是将转换后的字符串作为输出发送到控制台。\n\
    4. 我们从数据流中获取每个数据块，并将其转换为字符串。\n5. 最后，我们将每个转换后的字符串块的输出发送到控制台。\n\n### 输出：\n\n![](img/cbcb6538723209554d9dc578069d9e55_83_0.png)\n\
    \n- 如果代码执行正确，你将在控制台上看到上述输出。此输出将与 data.txt 文件中的内容相同。\n\n### 写入文件\n\n以我们创建读取流相同的方式，我们也可以创建写入流来将数据写入文件。让我们首先创建一个名为\
    \ data.txt 的空文件，其中没有任何内容。假设此文件放在我们计算机的 D 盘中。\n\n下面的代码展示了如何将数据写入文件。\n\n```\nvar\
    \ fs = require(\"fs\");\nvar stream;\nstream = fs.createWriteStream(\"D://data.txt\"\
    );\n\nstream.write(\"Tutorial on Node.js\")\nstream.write(\"Introduction\")\n\
    stream.write(\"Events\")\nstream.write(\"Generators\")\nstream.write(\"Data Connectivity\"\
    )\nstream.write(\"Using Jasmine\")\n```\n\n### 代码解释：\n\n1. 我们正在使用方法 – createWriteStream\
    \ 创建一个可写流。作为输入，我们提供 data.txt 文件的位置。\n2. 接下来，我们使用 stream.write 方法将不同行的文本写入我们的文本文件。流将负责将这些数据写入\
    \ data.txt 文件。\n\n如果你打开 data.txt 文件，你现在将看到文件中的以下数据\n\nNode.js 教程\n介绍\n事件\n生成器\n\
    数据连接\n使用 Jasmine\n"
