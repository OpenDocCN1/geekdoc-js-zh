    makes it more manageable and maintainable for future purposes. That''s where modules
    in Node.js comes in action.


    Since each module is an independent entity with its own encapsulated functionality,
    it can be managed as a separate unit of work.


    During this tutorial, we will see how we can make use of modules in Node.js.'
