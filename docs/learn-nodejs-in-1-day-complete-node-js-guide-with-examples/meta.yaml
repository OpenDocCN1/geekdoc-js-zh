- img_proc: true
  md: 'At any point in its lifetime, an event emitter can have zero or more listeners
    attached to it. The listeners for each event type can be inspected in several
    ways.


    If you are interested in only determining the number of attached listeners, then
    look no further than the EventEmitter.listenerCount() method.


    (Note: Listeners are important because the main program should know if listeners
    are being added on the fly to an event, else the program will malfunction because
    additional listeners will get called.)


    ![](img/cbcb6538723209554d9dc578069d9e55_90_0.png)


    # **Code Explanation:-**


    +   1. We are defining an eventEmitter type which is required for using the event-related
    methods.

    2. We are then defining an object called emitter which will be used to define
    our event handlers.

    3. We are creating 2 events handlers which basically do nothing. This is kept
    simple for our example just to show how the listenerCount method works.

    4. Now when you invoke the listenerCount method on our data_received event, it
    will send the number of event listeners attached to this event in the console
    log.


    If the code is executed properly, the value of 2 will be shown in the console
    log.


    # 3. **The newListener Event**


    Each time a new event handler is registered, the event emitter emits a newListener
    event. This event is used to detect new event handlers. You typically use newListener
    event when you need to allocate resources or perform some action for each new
    event handler.'
  merge: -1
  pgno: 90
- img_proc: true
  md: "```\nvar events = require('events');\nvar eventEmitter = events.EventEmitter;\n\
    var emitter = new eventEmitter();\nemitter.on(\"newListener\", function(eventName,\
    \ listener) {\n    console.log(\"Added listener for \" + eventName + \" events\"\
    );\n});\nemitter.on('data_received', function() {});\nemitter.on('data_received',\
    \ function() {});\n```\n\n# Code Explanation:-\n\n+   1. We are creating a new\
    \ event handler for the 'newListener' event. So whenever a new event handler is\
    \ registered, the text \"Added listener for\" + the event name will be displayed\
    \ in the console.\n2. Here we are writing to the console the text \"Added listener\
    \ for\" + the event name for each event registered.\n3. We are defining 2 event\
    \ handlers for our event 'data_received'.\n\nIf the above code is executed properly,\
    \ the below text will be shown in the console. It just shows that the 'newListener'\
    \ event handler was triggered twice.\n\n```\nAdded listener for data_received\
    \ events\n\nAdded listener for data_received events\n```\n\n# Summary\n\nUsing\
    \ callback functions in Node.js does have its disadvantages. Sometimes during\
    \ the process of development, the nested use of callback functions can make the\
    \ code messier and difficult to maintain.\n\n+   - Most of the issues with nested\
    \ callback functions can be mitigated with the use of promises and generators\
    \ in node.js\n- A Promise is a value returned by an asynchronous function to indicate\
    \ the completion of the processing carried out by the asynchronous function.\n\
    - Promises can be nested within each other to make code look better and easier\
    \ to maintain when many asynchronous function need to be called at the same time.\n\
    - Generators can also be used to alleviate the problems with nested callbacks\
    \ and assist in removing what is known as the callback hell. Generators are used\
    \ to halt the processing of a function. This is accomplished by usage of the 'yield'\
    \ method in the asynchronous function.\n- Streams are used in Node.js to read\
    \ and write data from Input-Output devices. Node.js makes use of the 'fs' library\
    \ to create readable and writable streams to files. These streams can be used\
    \ to read and write data from files."
