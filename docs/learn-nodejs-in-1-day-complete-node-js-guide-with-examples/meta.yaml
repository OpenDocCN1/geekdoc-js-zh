    \ by using a node module called 'q.' The 'q' library needs to be downloaded and\
    \ installed using the node package manager. After using the 'q' library, the method\
    \ \"denodeify\" can be called which will cause any function to become a function\
    \ which returns a promise.\n\nIn the example below, we will create a simple function\
    \ called \"Add\" which will add 2 numbers. We will convert this function into\
    \ a function to return a promise.\n\nOnce that is done, we will use the promise\
    \ returned by the Add function to display a message in the console.log.\n\nLet's\
    \ follow the below steps to creating our custom function to return a promise.\n\
    \n# ## Step 1) Installing the NPM Modules\n\nTo use 'q' from within a Node JS\
    \ application, the 'q' module is required. To install the 'q' module, run the\
    \ below command\n\n```\nnpm install q\n```\n\n# ## Step 2) Define the following\
    \ code which will be used to create the custom promise.\n\n```\nvar Q= require('q');\n\
    \nfunction Add() {\n    var a, b, c;\n    a=5;b=6;\n    c=a+b;\n\n}\n\n    var\
    \ Display_promise= Q.denodeify(Add);\n\nvar promise=Add;\n\npromise.then\n{console.log(\"\
    Addition function complete\");}\n```\n\n# ### Code Explanation:-\n\n+   1. The\
    \ first bit is to include the 'q' library by using the require keyword. By using\
