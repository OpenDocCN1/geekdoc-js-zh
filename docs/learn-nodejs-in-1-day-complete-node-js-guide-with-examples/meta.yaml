    \ in a web browser.\n\nCreate file Node.js with file name firstprogram.js\n\n\
    ```\nvar http = require('http');\n\nhttp.createServer(function (req, res) {\n\
    \    res.writeHead(200, {'Content-Type': 'text/html'});\n    res.end('Hello World!');\n\
    }).listen(8080);\n```\n\n# Code Explanation:\n\n+   1. The basic functionality\
    \ of the \"require\" function is that it reads a JavaScript file, executes the\
    \ file, and then proceeds to return an object. Using this object, one can then\
    \ use the various functionalities available in the module called by the require\
    \ function. So in our case, since we want to use the functionality of http and\
