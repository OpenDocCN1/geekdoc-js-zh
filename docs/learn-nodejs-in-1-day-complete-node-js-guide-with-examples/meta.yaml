    \n```\nvar request = require(\"request\");\nrequest(\"http://www.google.com\"\
    , function(error, response, body)\n{\n    console.log(body);\n});\n```\n\n## 代码解释\n\
    \n1. 我们正在使用上一步安装的 'require' 模块。该模块包含可用于向网站发起GET请求的必要函数。\n2. 我们正在向www.google.com发起一个GET请求，并在收到响应后调用一个函数。当收到响应时，参数（error,\
    \ response, 和 body）将具有以下值：\n    a. Error – 如果在使用GET请求时收到任何错误，错误信息将记录在这里。\n   \
    \ b. Response - 响应将包含随响应发回的HTTP头信息。\n    c. Body - 主体将包含Google发送的整个响应内容。\n3. 在这里，我们只是将接收到的body参数的内容写入console.log。所以基本上，我们访问\
    \ **www.google.com** 所得到的任何内容都将被写入控制台。\n\n以下是供你参考的代码：\n\n```\nvar request = require(\"\
    request\");\n\nrequest(\"http://www.google.com\",function(error,response,body)\n\
    {\n\nconsole.log(body);\n\n});\n```\n\n## 总结\n\n- Node.js框架可以使用 'http' 模块来开发Web服务器。应用程序可以监听特定端口，并在应用程序收到请求时向客户端发送响应。\n\
    - 'request' 模块可用于从网站获取信息。信息将包含从相关网站请求的整个网页内容。\n\n# 第5章：Node.js与Express\n\n在本教程中，我们还将了解Express框架。该框架被设计为一个最小且灵活的Node.js\
    \ Web应用程序框架，为构建单页、多页和混合Web应用程序提供了一组强大的功能。\n\n# 什么是Express.js\n\nExpress.js是一个Node.js\
    \ Web应用服务器框架，专门用于构建单页、多页和混合Web应用程序。\n\n它已成为Node.js的标准服务器框架。Express是被称为MEAN技术栈的后端部分。\n\
    \nMEAN是一个免费且开源的JavaScript技术栈，用于构建动态网站和Web应用程序，包含以下组件：\n\n1. **MongoDB** - 标准的NoSQL数据库\n\
    2. **Express.js** - 默认的Web应用程序框架\n3. **Angular.js** - 用于Web应用程序的JavaScript MVC框架\n\
    4. **Node.js** - 用于可扩展的服务器端和网络应用程序的框架。\n\nExpress.js框架使得开发能够处理多种类型请求（如GET、PUT、POST和DELETE请求）的应用程序变得非常容易。\n\
    \n# 安装和使用Express\n\nExpress通过Node包管理器安装。这可以通过在命令行中执行以下命令来完成：\n\n```\nnpm install\
    \ express\n```\n\n上述命令请求Node包管理器下载所需的express模块并相应地安装它们。\n\n让我们使用新安装的Express框架创建一个简单的\
    \ \"Hello World\" 应用程序。\n\n我们的应用程序将创建一个简单的服务器模块，监听3000端口。在我们的示例中，如果通过浏览器对此端口发出请求，那么服务器应用程序将向客户端发送\
    \ 'Hello World' 响应。\n\n```\nvar express=require('express');\nvar app=express();\n\
    app.get('/',function(req,res)\n{\n    res.send('Hello World!');\n});\n\nvar server=app.listen(3000,function()\
    \ {});\n```\n\n## 代码解释\n\n1. 在我们的第一行代码中，我们使用require函数来包含 \"express模块\"。\n2. 在开始使用express模块之前，我们需要创建一个express模块的对象。\n\
    3. 这里我们创建了一个回调函数。每当有人浏览到我们Web应用程序的根路径 **http://localhost:3000** 时，这个函数就会被调用。回调函数将用于向网页发送字符串\
    \ 'Hello World'。\n4. 在回调函数中，我们将字符串 \"Hello World\" 发送回客户端。'res' 参数用于向网页发送内容。这个\
    \ 'res' 参数是由 'request' 模块提供的，用于将内容发送回网页。\n5. 然后我们使用listen函数让我们的服务器应用程序监听3000端口的客户端请求。你可以在这里指定任何可用的端口。\n\
    \n如果命令执行成功，当你在浏览器中运行代码时，将显示以下输出。\n\n## 输出\n\n从输出中，你可以清楚地看到，如果我们浏览到localhost的3000端口URL，你将在页面上看到字符串\
    \ 'Hello World' 被显示出来。因为我们在代码中明确指定了服务器监听3000端口，所以我们能够在这个URL浏览时查看到输出。\n\n# 什么是路由\n\
    \n路由是指确定应用程序对特定端点的客户端请求的响应方式。\n\n例如，客户端可以对各种URL（如下所示）发起GET、POST、PUT或DELETE HTTP请求：\n\
    \nhttp://localhost:3000/Books\nhttp://localhost:3000/Students\n\n在上面的例子中：\n\n\
    - 如果对第一个URL发起GET请求，那么响应理想情况下应该是一个书籍列表。\n- 如果对第二个URL发起GET请求，那么响应理想情况下应该是一个学生列表。\n\
    - 因此，根据访问的URL，Web服务器上的不同功能将被调用，并相应地将响应发送给客户端。这就是路由的概念。\n\n每个路由可以有一个或多个处理函数，当路由匹配时这些函数将被执行。\n\
    \n路由的一般语法如下所示：\n\n```\napp.METHOD(PATH, HANDLER)\n```\n\n其中：\n1. app是express模块的实例\n\
    2. METHOD是HTTP请求方法（GET、POST、PUT或DELETE）\n3. PATH是服务器上的路径。\n4. HANDLER是路由匹配时执行的函数。\n\
    \n让我们看看如何在express中实现路由的示例。我们的示例将创建3个路由：\n\n1. 一个 /Node 路由，如果访问此路由，将显示字符串 \"Tutorial\
    \ on Node\"\n2. 一个 /Angular 路由，如果访问此路由，将显示字符串 \"Tutorial on Angular\"\n3. 一个默认路由\
    \ /，将显示字符串 \"Welcome to Guru99 Tutorials.\"\n\n我们的基本代码将与之前的示例保持相同。下面的代码片段是展示如何实现路由的补充内容。\n\
    \n```\napp.route('/Node').get(function(req,res)\n{\n    res.send(\"Tutorial on\
    \ Node\");\n});\napp.route('/Angular').get(function(req,res)\n{\n    res.send(\"\
    Tutorial on Angular\");\n});\napp.get('/',function(req,res)\n{\n    res.send('Welcome\
    \ to Guru99 Tutorials');\n});\n```\n\n## 代码解释\n\n1. 这里我们定义了一个路由，如果浏览器中选择了URL **http://localhost:3000/Node**。我们为该路由附加了一个回调函数，该函数将在我们浏览Node\
    \ URL时被调用。\n\n    该函数有2个参数。\n\n    - 我们将主要使用 'res' 参数，它可以用于将信息发送回客户端。\n    - 'req'\
    \ 参数包含有关所发出请求的信息。有时，作为请求的一部分，可能会发送额外的参数，因此可以使用 'req' 参数来查找发送的额外参数。\n\n2. 我们使用send函数，如果选择了Node路由，则将字符串\
    \ \"Tutorial on Node\" 发送回客户端。\n\n3. 这里我们定义了一个路由，如果浏览器中选择了URL **http://localhost:3000/Angular**。我们为该路由附加了一个回调函数，该函数将在我们浏览Angular\
    \ URL时被调用。\n\n4. 我们使用send函数，如果选择了Angular路由，则将字符串 \"Tutorial on Angular\" 发送回客户端。\n"
