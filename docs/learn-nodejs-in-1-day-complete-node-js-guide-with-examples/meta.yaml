- md: "## Pipes in Node.js\n\nWithin Node applications, streams can be piped together\
    \ using the pipe() method, which takes two arguments:\n\n- A required writable\
    \ stream that acts as the destination for the data.\n- An optional object used\
    \ to pass in options.\n\nA typical example of using pipes is if you want to transfer\
    \ data from one file to the other. So let's see an example of how we can transfer\
    \ data from one file to the other using pipes.\n\n**Step 1)** Create a file called\
    \ datainput.txt which has the below data. Let's assume this file is stored on\
    \ the D drive of our local machine.\n\nTutorial on Node.js\n\nIntroduction\n\n\
    Events\n\nGenerators\n\nData Connectivity\n\nUsing Jasmine\n\n**Step 2)** Create\
    \ a blank empty file called dataOutput.txt and place it on the D drive of your\
    \ local machine.\n\n**Step 3)** Write the below code to carry out the transfer\
    \ of data from the datainput.txt file to the dataOutput.txt file.\n\n![](img/cbcb6538723209554d9dc578069d9e55_86_0.png)\n\
    \n## Code Explanation\n\n1. We are first creating a \"readstream\" to our datainput.txt\
    \ file which contains all our data which needs to be transferred to the new file.\n\
    2. We then need to create a \"writestream\" to our dataOutput.txt file, which\
    \ is our empty file and is the destination for the transfer of data from the datainput.txt\
    \ file.\n3. We then use the pipe command to transfer the data from the readstream\
    \ to the write stream. The pipe command will take all the data which comes into\
    \ the readstream, and push it to the writestream.\n\nIf you now open the dataOutput.txt\
    \ file, you will see all the data which was present in the datainput.txt file.\n\
    \n## Events in Node.js\n\nEvents are one of the key concepts in Node.js and sometimes\
    \ Node.js is referred to as an Event-driven framework.\n\nBasically, an event\
    \ is something that happens. For example, if a connection is established to a\
    \ database, then the database connection event is triggered. Event driven programming\
    \ is to create functions that will be triggered when specific events are triggered.\
    \ Let's look at a basic example of defining an event in Node.js.\n\nWe are going\
    \ to create an event called 'data_received'. When this event is triggered, the\
    \ text \"data received\" will be sent to the console.\n\n```\nvar events = require('events');\n\
    var eventEmitter = new events.EventEmitter();\neventEmitter.on('data_received',\
    \ function() {\n    console.log('data received successfully.');\n});\n\neventEmitter.emit('data_received');\n\
    ```\n\n### Code Explanation\n\n1. Use the require function to include the 'events'\
    \ module. With this module, you will be able to create events in Node.js.\n2.\
    \ Create a new events emitter. This is used to bind the event, which in our case\
    \ is \"data_received\" to a callback function which is defined in step 3.\n3.\
    \ We define an event-driven function which says that if in case the \"data_received\"\
    \ event is triggered then we should output the text \"data_received\" to the console.\n\
    4. Finally, we do have a manual trigger of our event using the eventEmitter.emit\
    \ function. This will trigger the data_received event.\n\nWhen the program is\
    \ run, the text \"data received\" will be sent to the console as shown below.\n\
    \n```\n\"C:\\Program Files (x86)\\JetBrains\\WebStorm 11.0.1\\bin\\runnerw.exe\"\
    \ \"\n\ndata received successfully\n\nProcess finished with exit code 0\n```\n\
    \n> Console shows the message 'data received successfully'\n\n## Emitting Events\n\
    \nWhen defining events, there are different methods for events which can be invoked.\
    \ This topic focuses on looking at each one of them in detail.\n\n1. **One time\
    \ event handlers**\n\nSometimes you may be interested in reacting to an event\
    \ only the first time it occurs. In these situations, you can use the once() method.\n\
    \nLet's see how we can make use of the once method for event handlers.\n\n![](img/cbcb6538723209554d9dc578069d9e55_89_0.png)\n\
    \nCode Explanation:\n\n1. Here we are using the 'once' method to say that for\
    \ the event 'data_received,' the callback function should only be executed once.\n\
    2. Here we are manually triggering the 'data_received' event.\n3. When the 'data_received'\
    \ event is triggered again, this time, nothing will happen. This is because of\
    \ the first step where we said that the event could only be triggered once.\n\n\
    If the code is executed properly, the output in the log will be 'data_received\
    \ successfully'. This message will only appear once in the console.\n\n2. **Inspecting\
    \ Event Listeners**\n\nAt any point in its lifetime, an event emitter can have\
    \ zero or more listeners attached to it. The listeners for each event type can\
    \ be inspected in several ways.\n\nIf you are interested in only determining the\
    \ number of attached listeners, then look no further than the EventEmitter.listenerCount()\
    \ method.\n\n(Note: Listeners are important because the main program should know\
    \ if listeners are being added on the fly to an event, else the program will malfunction\
    \ because additional listeners will get called.)\n\n![](img/cbcb6538723209554d9dc578069d9e55_90_0.png)\n\
    \n### Code Explanation\n\n1. We are defining an eventEmitter type which is required\
    \ for using the event-related methods.\n2. We are then defining an object called\
    \ emitter which will be used to define our event handlers.\n3. We are creating\
    \ 2 events handlers which basically do nothing. This is kept simple for our example\
    \ just to show how the listenerCount method works.\n4. Now when you invoke the\
    \ listenerCount method on our data_received event, it will send the number of\
    \ event listeners attached to this event in the console log.\n\nIf the code is\
    \ executed properly, the value of 2 will be shown in the console log.\n\n3. **The\
    \ newListener Event**\n\nEach time a new event handler is registered, the event\
    \ emitter emits a newListener event. This event is used to detect new event handlers.\
    \ You typically use newListener event when you need to allocate resources or perform\
    \ some action for each new event handler.\n\n```\nvar events = require('events');\n\
    var eventEmitter = events.EventEmitter;\nvar emitter = new eventEmitter();\nemitter.on(\"\
    newListener\", function(eventName, listener) {\n    console.log(\"Added listener\
    \ for \" + eventName + \" events\");\n});\nemitter.on('data_received', function()\
    \ {});\nemitter.on('data_received', function() {});\n```\n\n### Code Explanation\n\
    \n1. We are creating a new event handler for the 'newListener' event. So whenever\
    \ a new event handler is registered, the text \"Added listener for\" + the event\
    \ name will be displayed in the console.\n2. Here we are writing to the console\
    \ the text \"Added listener for\" + the event name for each event registered.\n\
    3. We are defining 2 event handlers for our event 'data_received'.\n\nIf the above\
    \ code is executed properly, the below text will be shown in the console. It just\
    \ shows that the 'newListener' event handler was triggered twice.\n\n```\nAdded\
    \ listener for data_received events\n\nAdded listener for data_received events\n\
    ```\n\n## Summary\n\nUsing callback functions in Node.js does have its disadvantages.\
    \ Sometimes during the process of development, the nested use of callback functions\
    \ can make the code messier and difficult to maintain.\n\n- Most of the issues\
    \ with nested callback functions can be mitigated with the use of promises and\
    \ generators in Node.js.\n- A Promise is a value returned by an asynchronous function\
    \ to indicate the completion of the processing carried out by the asynchronous\
    \ function.\n- Promises can be nested within each other to make code look better\
    \ and easier to maintain when many asynchronous functions need to be called at\
    \ the same time.\n- Generators can also be used to alleviate the problems with\
    \ nested callbacks and assist in removing what is known as the callback hell.\
    \ Generators are used to halt the processing of a function. This is accomplished\
    \ by usage of the 'yield' method in the asynchronous function.\n- Streams are\
    \ used in Node.js to read and write data from Input-Output devices. Node.js makes\
    \ use of the 'fs' library to create readable and writable streams to files. These\
    \ streams can be used to read and write data from files."
  mdcn: "\n## Node.js 中的管道\n\n在 Node 应用程序中，可以使用 `pipe()` 方法将流连接在一起，该方法接受两个参数：\n\n\
    -   一个必需的可写流，作为数据传输的目标。\n-   一个可选的对象，用于传入选项。\n\n使用管道的一个典型示例是，如果你想将数据从一个文件传输到另一个文件。那么，让我们来看一个如何使用管道将数据从一个文件传输到另一个文件的示例。\n\
    \n**步骤 1)** 创建一个名为 `datainput.txt` 的文件，其中包含以下数据。假设该文件存储在我们本地机器的 D 盘上。\n\nNode.js\
    \ 教程\n\n简介\n\n事件\n\n生成器\n\n数据连接\n\n使用 Jasmine\n\n**步骤 2)** 创建一个名为 `dataOutput.txt`\
    \ 的空白空文件，并将其放在本地机器的 D 盘上。\n\n**步骤 3)** 编写以下代码，以执行从 `datainput.txt` 文件到 `dataOutput.txt`\
    \ 文件的数据传输。\n\n![](img/cbcb6538723209554d9dc578069d9e55_86_0.png)\n\n## 代码解释\n\n\
    1.  我们首先为 `datainput.txt` 文件创建一个 \"readstream\"，该文件包含所有需要传输到新文件的数据。\n2.  然后我们需要为\
    \ `dataOutput.txt` 文件创建一个 \"writestream\"，这是我们的空文件，也是从 `datainput.txt` 文件传输数据的目标。\n\
    3.  然后我们使用 `pipe` 命令将数据从 readstream 传输到 write stream。`pipe` 命令会获取进入 readstream\
    \ 的所有数据，并将其推送到 writestream。\n\n如果你现在打开 `dataOutput.txt` 文件，你将看到 `datainput.txt`\
    \ 文件中存在的所有数据。\n\n## Node.js 中的事件\n\n事件是 Node.js 的关键概念之一，有时 Node.js 被称为事件驱动框架。\n\
    \n基本上，事件是发生的事情。例如，如果与数据库建立了连接，则会触发数据库连接事件。事件驱动编程是创建在特定事件触发时将被触发的函数。让我们看一个在 Node.js\
    \ 中定义事件的基本示例。\n\n我们将创建一个名为 'data_received' 的事件。当此事件触发时，文本 \"data received\" 将被发送到控制台。\n\
    \n```\nvar events = require('events');\nvar eventEmitter = new events.EventEmitter();\n\
    eventEmitter.on('data_received', function() {\n    console.log('data received\
    \ successfully.');\n});\n\neventEmitter.emit('data_received');\n```\n\n### 代码解释\n\
    \n1.  使用 `require` 函数引入 'events' 模块。有了这个模块，你将能够在 Node.js 中创建事件。\n2.  创建一个新的 events\
    \ emitter。这用于将事件（在我们的情况下是 \"data_received\"）绑定到在步骤 3 中定义的回调函数。\n3.  我们定义了一个事件驱动函数，它表示如果\
    \ \"data_received\" 事件被触发，那么我们应该将文本 \"data_received\" 输出到控制台。\n4.  最后，我们确实使用 `eventEmitter.emit`\
    \ 函数手动触发了我们的事件。这将触发 `data_received` 事件。\n\n当程序运行时，文本 \"data received\" 将被发送到控制台，如下所示。\n\
    \n```\n\"C:\\Program Files (x86)\\JetBrains\\WebStorm 11.0.1\\bin\\runnerw.exe\"\
    \ \"\n\ndata received successfully\n\nProcess finished with exit code 0\n```\n\
    \n> 控制台显示消息 'data received successfully'\n\n## 触发事件\n\n在定义事件时，事件有不同的方法可以被调用。本主题将重点关注详细查看每一个方法。\n\
    \n1.  **一次性事件处理器**\n\n有时你可能只对事件第一次发生时做出反应感兴趣。在这些情况下，你可以使用 `once()` 方法。\n\n让我们看看如何利用\
    \ `once` 方法进行事件处理。\n\n![](img/cbcb6538723209554d9dc578069d9e55_89_0.png)\n\n代码解释：\n\
    \n1.  这里我们使用 'once' 方法来表示对于事件 'data_received'，回调函数应该只执行一次。\n2.  这里我们手动触发 'data_received'\
    \ 事件。\n3.  当 'data_received' 事件再次触发时，这次不会发生任何事情。这是因为第一步我们说过该事件只能触发一次。\n\n如果代码执行正确，日志中的输出将是\
    \ 'data received successfully'。此消息在控制台中只会显示一次。\n\n2.  **检查事件监听器**\n\n在其生命周期的任何时候，事件发射器都可以有零个或多个监听器附加到它。每种事件类型的监听器可以通过多种方式进行检查。\n\
    \n如果你只想确定附加的监听器数量，那么只需要查看 `EventEmitter.listenerCount()` 方法。\n\n（注：监听器很重要，因为主程序应该知道监听器是否被动态添加到事件中，否则程序会因为额外的监听器被调用而出现故障。）\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_90_0.png)\n\n### 代码解释\n\n1.  我们定义了一个\
    \ eventEmitter 类型，这是使用事件相关方法所必需的。\n2.  然后我们定义一个名为 emitter 的对象，该对象将用于定义我们的事件处理器。\n\
    3.  我们创建了 2 个事件处理器，它们基本上什么都不做。为了我们的示例简单起见，只是为了展示 `listenerCount` 方法的工作原理。\n4.\
    \  现在当你对我们 `data_received` 事件调用 `listenerCount` 方法时，它会将附加到此事件的事件监听器数量发送到控制台日志。\n\
    \n如果代码执行正确，控制台日志中将显示值 2。\n\n3.  **newListener 事件**\n\n每次注册新的事件处理器时，事件发射器都会发出一个\
    \ `newListener` 事件。此事件用于检测新的事件处理器。当你需要为每个新的事件处理器分配资源或执行某些操作时，通常使用 `newListener`\
    \ 事件。\n\n```\nvar events = require('events');\nvar eventEmitter = events.EventEmitter;\n\
    var emitter = new eventEmitter();\nemitter.on(\"newListener\", function(eventName,\
    \ listener) {\n    console.log(\"Added listener for \" + eventName + \" events\"\
    );\n});\nemitter.on('data_received', function() {});\nemitter.on('data_received',\
    \ function() {});\n```\n\n### 代码解释\n\n1.  我们为 'newListener' 事件创建了一个新的事件处理器。因此，每当注册一个新的事件处理器时，控制台将显示文本\
    \ \"Added listener for\" + 事件名称。\n2.  这里我们为每个注册的事件将文本 \"Added listener for\" +\
    \ 事件名称写入控制台。\n3.  我们为事件 'data_received' 定义了 2 个事件处理器。\n\n如果上述代码执行正确，控制台将显示以下文本。它只是表明\
    \ 'newListener' 事件处理器被触发了两次。\n\n```\nAdded listener for data_received events\n\
    \nAdded listener for data_received events\n```\n\n## 总结\n\n在 Node.js 中使用回调函数确实有其缺点。有时在开发过程中，回调函数的嵌套使用会使代码变得混乱且难以维护。\n\
    \n-   大多数嵌套回调函数的问题可以通过在 Node.js 中使用 Promises 和生成器来缓解。\n-   Promise 是由异步函数返回的值，用于表示异步函数执行的处理已完成。\n\
    -   Promises 可以相互嵌套，当需要同时调用许多异步函数时，这可以使代码看起来更好并更易于维护。\n-   生成器也可用于缓解嵌套回调的问题，并有助于消除所谓的回调地狱。生成器用于暂停函数的处理。这是通过在异步函数中使用\
    \ 'yield' 方法来实现的。\n-   流在 Node.js 中用于从输入输出设备读取和写入数据。Node.js 使用 'fs' 库创建可读和可写流到文件。这些流可用于从文件读取和写入数据。\n"
