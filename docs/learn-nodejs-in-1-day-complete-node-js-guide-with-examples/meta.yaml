    # Chapter 4: Create Server and Get Data\n\nThe Node.js framework is mostly used\
    \ to create server based applications. The framework can easily be used to create\
    \ web servers which can serve content to users.\n\nThere are a variety of modules\
    \ such as the \"http\" and \"request\" module, which helps in processing server\
