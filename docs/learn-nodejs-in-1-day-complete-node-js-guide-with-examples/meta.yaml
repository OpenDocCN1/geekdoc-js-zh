    3. Good for collaborative environment – This is good for environments which manage
    document. In document management environment you will have multiple people who
    post their documents and do constant changes by checking out and checking in documents.
    So Node.js is good for these environments because the event loop in Node.js can
    be triggered whenever documents are changed in a document managed environment.

    4. Advertisement servers – Again here you could have thousands of request to pull
    advertisements from the central server and Node.js can be an ideal framework to
    handle this.

    5. Streaming servers – Another ideal scenario to use Node is for multimedia streaming
    servers wherein clients have request''s to pull different multimedia contents
    from this server.


    Node.js is good when you need high levels of concurrency but less amount of dedicated
    CPU time.


    Best of all, since Node.js is built on javascript, it''s best suited when you
    build client-side applications which are based on the same javascript framework.


    # ## When to not use Node.js


    Node.js can be used for a lot of applications with various purpose, the only scenario
    where it should not be used is if there are long processing times which is required
    by the application.


    Node is structured to be single threaded. If any application is required to carry
    out some long running calculations in the background. So if the server is doing
    some calculation, it won''t be able to process any other requests. As discussed
    above, Node.js is best when processing needs less dedicated CPU time.'
- md: "## Chapter 2: Download & Install Node.js\n\nTo start building your Node.js\
    \ applications, the first step is the installation of the Node.js framework. The\
    \ Node.js framework is available for a variety of operating systems right from\
    \ Windows to Ubuntu and OS X. Once the Node.js framework is installed you can\
    \ start building your first Node.js applications.\n\nNode.js also has the ability\
    \ to embed external functionality or extended functionality by making use of custom\
    \ modules. These modules have to be installed separately. An example of a module\
    \ is the MongoDB module which allows you to work with MongoDB databases from your\
    \ Node.js application.\n\n## How to install Node.js\n\nThe first steps in using\
    \ Node.js is the installation of the Node.js libraries on the client system. To\
    \ perform the installation of Node.js, perform the below steps:\n\n**Step 1)**\
    \ Go to the site **https://nodejs.org/en/download/** and download the necessary\
    \ binary files. In our example, we are going to download the 32-bit setup files\
    \ for Node.js.\n\n![](img/cbcb6538723209554d9dc578069d9e55_11_0.png)\n\n**Step\
    \ 2)** Double click on the downloaded .msi file to start the installation. Click\
    \ the Run button in the first screen to begin the installation.\n\n![](img/cbcb6538723209554d9dc578069d9e55_12_0.png)\n\
    \n**Step 3)** In the next screen, click the \"Next\" button to continue with the\
    \ installation.\n\n![](img/cbcb6538723209554d9dc578069d9e55_12_1.png)\n\n**Step\
    \ 4)** In the next screen Accept the license agreement and click on the Next button.\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_13_0.png)\n\n**Step 5)** In the next\
    \ screen, choose the location where Node.js needs to be installed and then click\
    \ on the Next button.\n\n1. First enter the file location for the installation\
    \ of Node.js. This is where the files for Node.js will be stored after the installation.\n\
    2. Click on the Next button to proceed ahead with the installation.\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_0.png)\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_14_1.png)\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_2.png)\n\
    \n**Step 6)** Accept the default components and click on the next button.\n\n\
    ![](img/cbcb6538723209554d9dc578069d9e55_14_3.png)\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_4.png)\n\
    \n**Step 7)** In the next screen, click the Install button to start the installation.\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_15_0.png)\n\n**Step 8)** Click the\
    \ Finish button to complete the installation.\n\n![](img/cbcb6538723209554d9dc578069d9e55_15_1.png)\n\
    \n## Installing Node through a package manager\n\nThe other way to install Node.js\
    \ on any client machine is to use a \"package manager\".\n\nOn windows, the node\
    \ package manager is known as Chocolatey. It was designed to be a decentralized\
    \ framework for quickly installing applications and tools that you need.\n\nTo\
    \ install Node.js via Chocolatey, the following steps need to be performed.\n\n\
    **Step 1)** Installing Chocolatey – The Chocolatey website (**https://chocolatey.org/**)\
    \ has very clear instructions on how this framework needs to be installed.\n\n\
    - The first step is to run the below command in the command prompt window. This\
    \ command is taken from the Chocolatey web site and is the standard command for\
    \ installing Node.js via Chocolatey.\n- The below command is a PowerShell command\
    \ which calls the remote PowerShell script on the Chocolatey website. This command\
    \ needs to be run in a PowerShell command window.\n- This PowerShell script does\
    \ all the necessary work of downloading the required components and installing\
    \ them accordingly.\n\n```\n@powershell -NoProfile -ExecutionPolicy Bypass -Command\
    \ \"iex ((new-object wet.webclient).DownloadString('https://chocolatey.org/install.ps1'))\"\
    \ && SET PATH=%PATH%;%ALLUSERSPROFILE%\\chocolatey\\bin\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_17_0.png)\n\
    \n**Step 2)** The next step is to install Node.js to your local machine using\
    \ the Chocolatey package manager. This can be done by running the below command\
    \ in the command prompt.\n\n```\ncinst nodejs install\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_17_1.png)\n\
    \nIf the installation is successful, you will get the message of the successful\
    \ installation of Node.js.\n\nNote: If you get an error like “C:\\ProgramData\\\
    chocolatey\\lib\\libreoffice\\tools\\chocolateyInstall.ps1” Then manually create\
    \ the folder in the path.\n\n## Running your first Hello world application in\
    \ Node.js\n\nOnce you have downloaded and installed Node.js on your computer,\
    \ let's try to display \"Hello World\" in a web browser.\n\nCreate file Node.js\
    \ with file name firstprogram.js\n\n```\nvar http = require('http');\n\nhttp.createServer(function\
    \ (req, res) {\n    res.writeHead(200, {'Content-Type': 'text/html'});\n    res.end('Hello\
    \ World!');\n}).listen(8080);\n```\n\n## Code Explanation:\n\n1. The basic functionality\
    \ of the \"require\" function is that it reads a JavaScript file, executes the\
    \ file, and then proceeds to return an object. Using this object, one can then\
    \ use the various functionalities available in the module called by the require\
    \ function. So in our case, since we want to use the functionality of http and\
    \ we are using the require(http) command.\n2. In this 2nd line of code, we are\
    \ creating a server application which is based on a simple function. This function\
    \ is called, whenever a request is made to our server application.\n3. When a\
    \ request is received, we are asking our function to return a \"Hello World\"\
    \ response to the client. The writeHead function is used to send header data to\
    \ the client and while the end function will close the connection to the client.\n\
    4. We are then using the .listen function to make our server application listen\
    \ to client requests on port no 8080. You can specify any available port over\
    \ here.\n\n## Executing the code\n\n**Step 1)** Save the file on your computer:\
    \ C:\\Users\\Your Name\\ firstprogram.js\n\n**Step 2)** In the command prompt,\
    \ navigate to the folder where the file is stored. Enter the command\n\n```\n\
    Node firstprogram.js\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_19_0.png)\n\
    \n**Step 3)** Now, your computer works as a server! If anyone tries to access\
    \ your computer on port 8080, they will get a \"Hello World!\" message in return!\n\
    \n**Step 4)** Start your internet browser, and type in the address: **http://localhost:8080**\n\
    \n## Output\n\n![](img/cbcb6538723209554d9dc578069d9e55_19_1.png)\n\n## Summary\n\
    \n- We have seen the installation of Node.js via the msi installation module which\
    \ is available on the Node.js website. This installation installs the necessary\
    \ modules which are required to run a Node.js application on the client.\n- Node.js\
    \ can also be installed via a package manager. The package manager for windows\
    \ is known as Chocolatey. By running some simple commands in the command prompt,\
    \ the Chocolatey package manager automatically downloads the necessary files and\
    \ then installs them on the client machine.\n- A simple Node.js application consists\
    \ of creating a server which listens on a particular port. When a request comes\
    \ to the server, the server automatically sends a 'Hello World' response to the\
    \ client.\n\n## Chapter 3: Modules\n\nA module in Node.js is a logical encapsulation\
    \ of code in a single unit. It's always a good programming practice to always\
    \ segregate code in such a way that makes it more manageable and maintainable\
    \ for future purposes. That's where modules in Node.js comes in action.\n\nSince\
    \ each module is an independent entity with its own encapsulated functionality,\
    \ it can be managed as a separate unit of work.\n\nDuring this tutorial, we will\
    \ see how we can make use of modules in Node.js.\n\n## What are modules in Node.js?\n\
    \nAs stated earlier, modules in Node js are a way of encapsulating code in a separate\
    \ logical unit. There are many readymade modules available in the market which\
    \ can be used within Node js.\n\nBelow are some of the popular modules which are\
    \ used in a Node js application:\n\n1. **Express framework** – Express is a minimal\
    \ and flexible Node js web application framework that provides a robust set of\
    \ features for the web and mobile applications.\n2. **Socket.io** - Socket.IO\
    \ enables real-time bidirectional event-based communication. This module is good\
    \ for creation of chatting based applications.\n3. **Jade** - Jade is a high-performance\
    \ template engine and implemented with JavaScript for node and browsers.\n4. **MongoDB**\
    \ - The MongoDB Node.js driver is the officially supported node.js driver for\
    \ MongoDB.\n5. **Restify** - restify is a lightweight framework, similar to express\
    \ for building REST APIs.\n6. **Bluebird** - Bluebird is a fully featured promise\
    \ library with focus on innovative features and performance."
  mdcn: "\n## 第二章：下载与安装 Node.js\n\n要开始构建你的 Node.js 应用程序，第一步是安装 Node.js 框架。Node.js\
    \ 框架适用于从 Windows 到 Ubuntu 和 OS X 等多种操作系统。Node.js 框架安装完成后，你就可以开始构建你的第一个 Node.js\
    \ 应用程序了。\n\nNode.js 还能够通过使用自定义模块来嵌入外部功能或扩展功能。这些模块需要单独安装。模块的一个例子是 MongoDB 模块，它允许你从\
    \ Node.js 应用程序中操作 MongoDB 数据库。\n\n## 如何安装 Node.js\n\n使用 Node.js 的第一步是在客户端系统上安装\
    \ Node.js 库。要执行 Node.js 的安装，请执行以下步骤：\n\n**步骤 1)** 访问网站 **https://nodejs.org/en/download/**\
    \ 并下载必要的二进制文件。在我们的示例中，我们将下载 Node.js 的 32 位安装文件。\n\n![](img/cbcb6538723209554d9dc578069d9e55_11_0.png)\n\
    \n**步骤 2)** 双击下载的 .msi 文件以开始安装。在第一个屏幕中单击“运行”按钮开始安装。\n\n![](img/cbcb6538723209554d9dc578069d9e55_12_0.png)\n\
    \n**步骤 3)** 在下一个屏幕中，单击“下一步”按钮继续安装。\n\n![](img/cbcb6538723209554d9dc578069d9e55_12_1.png)\n\
    \n**步骤 4)** 在下一个屏幕中，接受许可协议，然后单击“下一步”按钮。\n\n![](img/cbcb6538723209554d9dc578069d9e55_13_0.png)\n\
    \n**步骤 5)** 在下一个屏幕中，选择 Node.js 的安装位置，然后单击“下一步”按钮。\n\n1.  首先输入 Node.js 的安装文件位置。这是安装后\
    \ Node.js 文件的存储位置。\n2.  单击“下一步”按钮继续安装。\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_0.png)\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_14_1.png)\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_2.png)\n\
    \n**步骤 6)** 接受默认组件，然后单击“下一步”按钮。\n\n![](img/cbcb6538723209554d9dc578069d9e55_14_3.png)\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_14_4.png)\n\n**步骤 7)** 在下一个屏幕中，单击“安装”按钮开始安装。\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_15_0.png)\n\n**步骤 8)** 单击“完成”按钮完成安装。\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_15_1.png)\n\n## 通过包管理器安装 Node\n\n在任何客户端机器上安装\
    \ Node.js 的另一种方法是使用“包管理器”。\n\n在 Windows 上，Node 包管理器被称为 Chocolatey。它被设计为一个去中心化的框架，用于快速安装你需要的应用程序和工具。\n\
    \n要通过 Chocolatey 安装 Node.js，需要执行以下步骤。\n\n**步骤 1)** 安装 Chocolatey – Chocolatey\
    \ 网站 (**https://chocolatey.org/**) 提供了关于如何安装此框架的非常清晰的说明。\n\n-   第一步是在命令提示符窗口中运行以下命令。此命令取自\
    \ Chocolatey 网站，是通过 Chocolatey 安装 Node.js 的标准命令。\n-   以下命令是一个 PowerShell 命令，它调用\
    \ Chocolatey 网站上的远程 PowerShell 脚本。此命令需要在 PowerShell 命令窗口中运行。\n-   此 PowerShell\
    \ 脚本执行下载所需组件并相应安装的所有必要工作。\n\n```\n@powershell -NoProfile -ExecutionPolicy Bypass\
    \ -Command \"iex ((new-object wet.webclient).DownloadString('https://chocolatey.org/install.ps1'))\"\
    \ && SET PATH=%PATH%;%ALLUSERSPROFILE%\\chocolatey\\bin\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_17_0.png)\n\
    \n**步骤 2)** 下一步是使用 Chocolatey 包管理器将 Node.js 安装到你的本地计算机。这可以通过在命令提示符中运行以下命令来完成。\n\
    \n```\ncinst nodejs install\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_17_1.png)\n\
    \n如果安装成功，你将收到 Node.js 成功安装的消息。\n\n注意：如果你收到类似“C:\\ProgramData\\chocolatey\\lib\\\
    libreoffice\\tools\\chocolateyInstall.ps1”的错误，然后在该路径中手动创建文件夹。\n\n## 在 Node.js\
    \ 中运行你的第一个 Hello world 应用程序\n\n在你的计算机上下载并安装 Node.js 后，让我们尝试在 Web 浏览器中显示“Hello\
    \ World”。\n\n创建名为 firstprogram.js 的文件 Node.js\n\n```\nvar http = require('http');\n\
    \nhttp.createServer(function (req, res) {\n    res.writeHead(200, {'Content-Type':\
    \ 'text/html'});\n    res.end('Hello World!');\n}).listen(8080);\n```\n\n## 代码解释：\n\
    \n1.  “require”函数的基本功能是读取一个 JavaScript 文件，执行该文件，然后返回一个对象。使用此对象，你可以使用 require 函数调用的模块中提供的各种功能。因此，在我们的案例中，由于我们要使用\
    \ http 的功能，我们使用 require(http) 命令。\n2.  在这第 2 行代码中，我们正在创建一个基于简单函数的服务器应用程序。每当有请求发送到我们的服务器应用程序时，都会调用此函数。\n\
    3.  当收到请求时，我们要求函数向客户端返回“Hello World”响应。writeHead 函数用于向客户端发送头数据，而 end 函数将关闭到客户端的连接。\n\
    4.  然后我们使用 .listen 函数使我们的服务器应用程序在端口 8080 上监听客户端请求。你可以在此处指定任何可用的端口。\n\n## 执行代码\n\
    \n**步骤 1)** 在你的计算机上保存文件：C:\\Users\\Your Name\\ firstprogram.js\n\n**步骤 2)** 在命令提示符中，导航到文件存储的文件夹。输入命令\n\
    \n```\nNode firstprogram.js\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_19_0.png)\n\
    \n**步骤 3)** 现在，你的计算机作为服务器工作！如果有人尝试通过端口 8080 访问你的计算机，他们将收到“Hello World!”消息作为响应！\n\
    \n**步骤 4)** 启动你的互联网浏览器，然后输入地址：**http://localhost:8080**\n\n## 输出\n\n![](img/cbcb6538723209554d9dc578069d9e55_19_1.png)\n\
    \n## 总结\n\n-   我们已经了解了通过 Node.js 网站上可用的 msi 安装模块安装 Node.js。此安装安装了在客户端上运行 Node.js\
    \ 应用程序所需的必要模块。\n-   Node.js 也可以通过包管理器安装。Windows 的包管理器被称为 Chocolatey。通过在命令提示符中运行一些简单的命令，Chocolatey\
    \ 包管理器会自动下载必要的文件，然后将它们安装在客户端计算机上。\n-   一个简单的 Node.js 应用程序包括创建一个监听特定端口的服务器。当请求到达服务器时，服务器会自动向客户端发送\
    \ 'Hello World' 响应。\n\n## 第三章：模块\n\nNode.js 中的模块是代码在单个单元中的逻辑封装。将代码以使其更具可管理性和可维护性的方式分隔始终是一种良好的编程实践。这就是\
    \ Node.js 中的模块发挥作用的地方。\n\n由于每个模块都是一个具有其自身封装功能的独立实体，它可以作为一个独立的工作单元进行管理。\n\n在本教程中，我们将了解如何在\
    \ Node.js 中使用模块。\n\n## Node.js 中的模块是什么？\n\n如前所述，Node.js 中的模块是将代码封装在单独逻辑单元中的方式。市场上有许多现成的模块可以在\
    \ Node.js 中使用。\n\n以下是一些在 Node.js 应用程序中使用的流行模块：\n\n1.  **Express 框架** – Express\
    \ 是一个最小且灵活的 Node.js Web 应用程序框架，为 Web 和移动应用程序提供了一套强大的功能。\n2.  **Socket.io** - Socket.IO\
    \ 支持实时双向事件驱动的通信。此模块非常适合创建基于聊天的应用程序。\n3.  **Jade** - Jade 是一个高性能的模板引擎，使用 JavaScript\
    \ 为 node 和浏览器实现。\n4.  **MongoDB** - MongoDB Node.js 驱动程序是 MongoDB 官方支持的 node.js\
    \ 驱动程序。\n5.  **Restify** - restify 是一个轻量级框架，类似于 express，用于构建 REST API。\n6.  **Bluebird**\
    \ - Bluebird 是一个功能齐全的 promise 库，专注于创新特性和性能。\n"
