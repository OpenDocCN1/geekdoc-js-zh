  md: '# Extending modules


    When creating modules, it is also possible to extend or inherit one module from
    another.


    In modern day programming, it''s quite common to build a library of common modules
    and then extend the functionality of these common modules if required.


    Let''s look at an example of how we can extend modules in Node.js.


    **Step 1)** Create the base module.


    In our example, create a file called "Tutorial.js" and place the below code.


    In this code, we are just creating a function which returns a string to the console.
    The string returned is "Guru99 Tutorial".


    ```

    var exports=module.exports={};

    exports.tutorial=function()

    {

    console.log("Guru99 Tutotial")

    }

    ```


    +   1. The exports module is used so that whatever function is defined in this
    file can be available in other modules in Node.js

    2. We are creating a function called tutorial which can be used in other Node.js
    modules.

    3. We are displaying a string "Guru99 Tutorial" in the console when this function
    is called.


    Now that we have created our base module called Tutorial.js. It''s now time to
    create another module which will extend this base module.


    We will explore how to do this in the next step.


    **Step 2)** Next we will create our extended module. Create a new file called
    "NodeTutorial.js" and place the below code in the file.


    ```

    var Tutor=require(''./Tutorial.js'');

    exports.NodeTutorial=function()

    {

    console.log("Node Tutorial")

    function pTutor()

    {

    var PTutor=Tutor

    PTutor.tutorial;

    ```'
