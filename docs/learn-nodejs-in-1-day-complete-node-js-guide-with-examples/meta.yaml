    3. When the ''data_received'' event is triggered again, this time, nothing will
    happen. This is because of the first step where we said that the event could only
    be triggered once.


    If the code is executed properly, the output in the log will be ''data_received
    successfully''. This message will only appear once in the console.


    2. **Inspecting Event Listeners**'
  merge: -1
