    ![](img/cbcb6538723209554d9dc578069d9e55_66_0.png)


    +   1. In the above code, the part of the function(err,db) is known as the declaration
    of an anonymous or callback function. When the MongoClient creates a connection
    to the MongoDB database, it will return to the callback function once the connection
    operation is completed. So in a sense, the connection operations happens in the
    background, and when it is done, it calls our callback function. Remember that
    this is one of the key points of Node.js to allow many operations to happen concurrently
    and thus not block any user from performing an operation.

    2. The second code block is what gets executed when the callback function is actually
    called. The callback function just updates one record in our MongoDB database.


    So what is a promise then? Well, a promise is just an enhancement to callback
