- md: "# Node.js\n\n![](img/cbcb6538723209554d9dc578069d9e55_0_0.png)\n\nLEARN IN\
    \ 1 DAY\n\nKRISHNA RUNGTA\n\n# Learn NodeJS in 1 Day\n\n## By Krishna Rungta\n\
    \nCopyright 2016 - All Rights Reserved – Krishna Rungta\n\n**ALL RIGHTS RESERVED.**\
    \ No part of this publication may be reproduced or transmitted in any form whatsoever,\
    \ electronic, or mechanical, including photocopying, recording, or by any informational\
    \ storage or retrieval system without express written, dated and signed permission\
    \ from the author.\n\n# Table of Content\n\n## Chapter 1: Introduction\n\n- 1.\
    \ What is Node.js\n- 2. Why use Node.js\n- 3. Features of Node.js\n- 4. When to\
    \ use and not use Node.js\n\n## Chapter 2: Download & Install Node.js\n\n- 1.\
    \ How to install Node.js\n- 2. Installing Node through a package manager\n- 3.\
    \ Running your first Hello world application in Node.js\n\n## Chapter 3: Modules\n\
    \n- 1. What are modules in Node.js\n- 2. Using modules in Node.js\n- 3. Creating\
    \ NPM modules\n- 4. Extending modules\n- 5. Publishing NPM Modules\n- 6. Managing\
    \ third party packages with npm\n- 7. What is the package.json file\n\n## Chapter\
    \ 4: Create Server and Get Data\n\n## Chapter 5: Node.js with Express\n\n- 1.\
    \ What is Express.js\n- 2. Installing and using Express\n- 3. What are Routes\n\
    - 4. Sample Web server using Express.js\n\n## Chapter 6: Node.js with MongoDB\n\
    \n- 1. Node.js and NoSQL Databases\n- 2. Using MongoDB and Node.js\n- 3. How to\
    \ build a node express app with MongoDB to store and serve content\n\n## Chapter\
    \ 7: Promise, Generator, Event and Filestream\n\n- 1. What are promises\n- 2.\
    \ Callbacks to promises\n- 3. Generating promises with the BlueBird library\n\
    - 4. Creating a custom promise\n- 5. Callbacks vs generators\n- 6. Filestream\
    \ in Node.js\n- 7. Emitting Events\n\n## Chapter 8: Testing with Jasmine\n\n-\
    \ 1. Overview of Jasmine for testing Node.js applications\n- 2. How to use Jasmine\
    \ to test Node.js applications\n\n# Chapter 1: Introduction\n\nThe modern web\
    \ application has really come a long way over the years with the introduction\
    \ of many popular frameworks such as bootstrap, Angular JS, etc. All of these\
    \ frameworks are based on the popular JavaScript framework.\n\nBut when it came\
    \ to developing server based applications there was just kind of a void, and this\
    \ is where Node.js came into the picture.\n\nNode.js is also based on the JavaScript\
    \ framework, but it is used for developing server-based applications. While going\
    \ through the entire tutorial, we will look into Node.js in detail and how we\
    \ can use it to develop server based applications.\n\n## What is Node.js\n\nNode.js\
    \ is an open-source, cross-platform runtime environment used for development of\
    \ server-side web applications. Node.js applications are written in JavaScript\
    \ and can be run on a wide variety of operating systems.\n\nNode.js is based on\
    \ an event-driven architecture and a non-blocking Input/Output API that is designed\
    \ to optimize an application's throughput and scalability for real-time web applications.\n\
    \nOver a long period of time, the framework available for web development were\
    \ all based on a stateless model. A stateless model is where the data generated\
    \ in one session (such as information about user settings and events that occurred)\
    \ is not maintained for usage in the next session with that user.\n\nA lot of\
    \ work had to be done to maintain the session information between requests for\
    \ a user. But with Node.js there is finally a way for web applications to have\
    \ a real-time, two-way connections, where both the client and server can initiate\
    \ communication, allowing them to exchange data freely.\n\n## Why use Node.js\n\
    \nWe will have a look into the real worth of Node.js in the coming chapters, but\
    \ what is it that makes this framework so famous. Over the years, most of the\
    \ applications were based on a stateless request-response framework. In these\
    \ sort of applications, it is up to the developer to ensure the right code was\
    \ put in place to ensure the state of web session was maintained while the user\
    \ was working with the system.\n\nBut with Node.js web applications, you can now\
    \ work in real-time and have a 2-way communication. The state is maintained, and\
    \ the either the client or server can start the communication.\n\n## Features\
    \ of Node.js\n\nLet's look at some of the key features of Node.js\n\n1. Asynchronous\
    \ event driven IO helps concurrent request handling – This is probably the biggest\
    \ selling points of Node.js. This feature basically means that if a request is\
    \ received by Node for some Input/Output operation, it will execute the operation\
    \ in the background and continue with processing other requests.\n\nThis is quite\
    \ different from other programming languages. A simple example of this is given\
    \ in the code below\n\n```\nvar fs = require('fs');\n    fs.readFile(\"Sample.txt\"\
    ,function(error,data)\n {\n             console.log(\"Reading Data completed\"\
    );\n});\n```\n\n- The above code snippet looks at reading a file called Sample.txt.\
    \ In other programming languages, the next line of processing would only happen\
    \ once the entire file is read.\n- But in the case of Node.js the important fraction\
    \ of code to notice is the declaration of the function ('function(error,data)').\
    \ This is known as a callback function.\n- So what happens here is that the file\
    \ reading operation will start in the background. And other processing can happen\
    \ simultaneously while the file is being read. Once the file read operation is\
    \ completed, this anonymous function will be called and the text \"Reading Data\
    \ completed\" will be written to the console log.\n\n2. Node uses the V8 JavaScript\
    \ Runtime engine, the one which is used by Google Chrome. Node has a wrapper over\
    \ the JavaScript engine which makes the runtime engine much faster and hence processing\
    \ of requests within Node also become faster.\n\n3. Handling of concurrent requests\
    \ – Another key functionality of Node is the ability to handle concurrent connections\
    \ with a very minimal overhead on a single process.\n\n4. The Node.js library\
    \ used JavaScript – This is another important aspect of development in Node.js.\
    \ A major part of the development community are already well versed in javascript,\
    \ and hence, development in Node.js becomes easier for a developer who knows javascript.\n\
    \n5. There are an Active and vibrant community for the Node.js framework. Because\
    \ of the active community, there are always keys updates made available to the\
    \ framework. This helps to keep the framework always up-to-date with the latest\
    \ trends in web development.\n\n## Who uses Node.js\n\nNode.js is used by a variety\
    \ of large companies. Below is a list of a few of them.\n\n- Paypal – A lot of\
    \ sites within Paypal have also started the transition onto Node.js.\n- LinkedIn\
    \ - LinkedIn is using Node.js to power their Mobile Servers, which powers the\
    \ iPhone, Android, and Mobile Web products.\n- Mozilla has implemented Node.js\
    \ to support browser APIs which has half a billion installs.\n- Ebay hosts their\
    \ HTTP API service in Node.js\n\n## When to use and not use Node.js\n\nNode.js\
    \ is best for usage in streaming or event-based real-time applications like\n\n\
    1. Chat applications\n2. Game servers – Fast and high-performance servers that\
    \ need to processes thousands of requests at a time, then this is an ideal framework.\n\
    3. Good for collaborative environment – This is good for environments which manage\
    \ document. In document management environment you will have multiple people who\
    \ post their documents and do constant changes by checking out and checking in\
    \ documents. So Node.js is good for these environments because the event loop\
    \ in Node.js can be triggered whenever documents are changed in a document managed\
    \ environment.\n4. Advertisement servers – Again here you could have thousands\
    \ of request to pull advertisements from the central server and Node.js can be\
    \ an ideal framework to handle this.\n5. Streaming servers – Another ideal scenario\
    \ to use Node is for multimedia streaming servers wherein clients have request's\
    \ to pull different multimedia contents from this server.\n\nNode.js is good when\
    \ you need high levels of concurrency but less amount of dedicated CPU time.\n\
    \nBest of all, since Node.js is built on javascript, it's best suited when you\
    \ build client-side applications which are based on the same javascript framework.\n\
    \n## When to not use Node.js\n\nNode.js can be used for a lot of applications\
    \ with various purpose, the only scenario where it should not be used is if there\
    \ are long processing times which is required by the application.\n\nNode is structured\
    \ to be single threaded. If any application is required to carry out some long\
    \ running calculations in the background. So if the server is doing some calculation,\
    \ it won't be able to process any other requests. As discussed above, Node.js\
    \ is best when processing needs less dedicated CPU time."
  mdcn: "\n# Node.js\n\n![](img/cbcb6538723209554d9dc578069d9e55_0_0.png)\n\n1天精通\n\
    \nKRISHNA RUNGTA\n\n# 1天精通NodeJS\n\n## 作者：Krishna Rungta\n\n版权 © 2016 - 保留所有权利\
    \ – Krishna Rungta\n\n**保留所有权利。** 未经作者明确书面、注明日期并签署的许可，不得以任何形式（电子或机械，包括影印、录音，或任何信息存储或检索系统）复制或传播本出版物的任何部分。\n\
    \n# 目录\n\n## 第1章：简介\n\n- 1. 什么是Node.js\n- 2. 为什么使用Node.js\n- 3. Node.js的特性\n-\
    \ 4. 何时使用与不使用Node.js\n\n## 第2章：下载与安装Node.js\n\n- 1. 如何安装Node.js\n- 2. 通过包管理器安装Node\n\
    - 3. 在Node.js中运行你的第一个Hello World应用程序\n\n## 第3章：模块\n\n- 1. Node.js中的模块是什么\n- 2.\
    \ 在Node.js中使用模块\n- 3. 创建NPM模块\n- 4. 扩展模块\n- 5. 发布NPM模块\n- 6. 使用npm管理第三方包\n- 7.\
    \ 什么是package.json文件\n\n## 第4章：创建服务器与获取数据\n\n## 第5章：Node.js与Express\n\n- 1. 什么是Express.js\n\
    - 2. 安装与使用Express\n- 3. 什么是路由\n- 4. 使用Express.js的Web服务器示例\n\n## 第6章：Node.js与MongoDB\n\
    \n- 1. Node.js与NoSQL数据库\n- 2. 使用MongoDB和Node.js\n- 3. 如何构建一个使用MongoDB存储和提供内容的Node\
    \ Express应用\n\n## 第7章：Promise、生成器、事件与文件流\n\n- 1. 什么是Promise\n- 2. 从回调到Promise\n\
    - 3. 使用BlueBird库生成Promise\n- 4. 创建自定义Promise\n- 5. 回调与生成器\n- 6. Node.js中的文件流\n\
    - 7. 触发事件\n\n## 第8章：使用Jasmine进行测试\n\n- 1. 用于测试Node.js应用程序的Jasmine概述\n- 2. 如何使用Jasmine测试Node.js应用程序\n\
    \n# 第1章：简介\n\n随着许多流行框架（如Bootstrap、Angular JS等）的引入，现代Web应用程序在多年里确实取得了长足的进步。所有这些框架都基于流行的JavaScript框架。\n\
    \n但在开发基于服务器的应用程序方面，过去一直存在空白，而Node.js正是在这个时候应运而生。\n\nNode.js也基于JavaScript框架，但它用于开发基于服务器的应用程序。在整个教程中，我们将详细了解Node.js以及如何使用它来开发基于服务器的应用程序。\n\
    \n## 什么是Node.js\n\nNode.js是一个开源的、跨平台的运行时环境，用于开发服务器端Web应用程序。Node.js应用程序使用JavaScript编写，可以在各种操作系统上运行。\n\
    \nNode.js基于事件驱动架构和非阻塞输入/输出API，旨在优化实时Web应用程序的吞吐量和可扩展性。\n\n长期以来，可用于Web开发的框架都基于无状态模型。无状态模型是指在一个会话中生成的数据（如用户设置信息和发生的事件）不会被保留用于与该用户的下一次会话。\n\
    \n为了在用户请求之间维护会话信息，需要做大量的工作。但有了Node.js，Web应用程序终于有了一种实时双向连接的方式，客户端和服务器都可以发起通信，从而允许它们自由地交换数据。\n\
    \n## 为什么使用Node.js\n\n我们将在接下来的章节中深入了解Node.js的真正价值，但究竟是什么让这个框架如此著名。多年来，大多数应用程序都基于无状态的请求-响应框架。在这类应用程序中，需要开发人员确保在用户使用系统时放置了正确的代码来维持Web会话的状态。\n\
    \n但使用Node.js Web应用程序，你现在可以实时工作并进行双向通信。状态得以维持，并且客户端或服务器都可以启动通信。\n\n## Node.js的特性\n\
    \n让我们看看Node.js的一些关键特性\n\n1. 异步事件驱动IO有助于并发请求处理——这可能是Node.js最大的卖点。此特性基本意味着，如果Node收到一个用于某些输入/输出操作的请求，它将在后台执行该操作，并继续处理其他请求。\n\
    \n这与其他编程语言非常不同。下面的代码给出了一个简单的例子\n\n```\nvar fs = require('fs');\n    fs.readFile(\"\
    Sample.txt\",function(error,data)\n {\n             console.log(\"Reading Data\
    \ completed\");\n});\n```\n\n- 上面的代码片段是读取一个名为Sample.txt的文件。在其他编程语言中，只有在读完整个文件后，才会执行下一行处理代码。\n\
    - 但在Node.js的情况下，需要注意的重要代码部分是函数声明（'function(error,data)'）。这就是所谓的回调函数。\n- 所以这里发生的是，文件读取操作将在后台启动。其他处理可以在文件读取的同时进行。一旦文件读取操作完成，这个匿名函数将被调用，并将文本“Reading\
    \ Data completed”写入控制台日志。\n\n2. Node使用V8 JavaScript运行时引擎，也就是Google Chrome所使用的引擎。Node在JavaScript引擎之上有一个包装器，这使得运行时引擎快得多，因此Node内部的请求处理也变得更快。\n\
    \n3. 处理并发请求——Node的另一个关键功能是在单个进程中以非常小的开销处理并发连接的能力。\n\n4. Node.js库使用JavaScript——这是Node.js开发的另一个重要方面。大部分开发社区已经精通JavaScript，因此，对于了解JavaScript的开发人员来说，Node.js的开发变得更加容易。\n\
    \n5. 有一个活跃且充满活力的Node.js框架社区。由于活跃的社区，框架总是会获得关键更新。这有助于使框架始终保持与Web开发最新趋势同步。\n\n##\
    \ 谁在使用Node.js\n\nNode.js被许多大型公司使用。以下是其中一些。\n\n- PayPal – PayPal内部的许多站点也已开始向Node.js迁移。\n\
    - LinkedIn - LinkedIn使用Node.js来支持其移动服务器，该服务器为iPhone、Android和移动Web产品提供支持。\n- Mozilla已实现Node.js来支持浏览器API，该API有五亿次安装。\n\
    - Ebay在其HTTP API服务中托管Node.js\n\n## 何时使用与不使用Node.js\n\nNode.js最适合用于流媒体或基于事件的实时应用程序，例如\n\
    \n1. 聊天应用程序\n2. 游戏服务器——需要一次处理数千个请求的快速高性能服务器，那么这是一个理想的框架。\n3. 适合协作环境——这适用于管理文档的环境。在文档管理环境中，会有多人发布他们的文档，并通过签出和签入文档进行持续更改。因此，Node.js适用于这些环境，因为Node.js中的事件循环可以在文档管理环境中文档被更改时触发。\n\
    4. 广告服务器——同样，这里可能有成千上万的请求从中央服务器拉取广告，Node.js是处理此任务的理想框架。\n5. 流媒体服务器——使用Node的另一个理想场景是多媒体流媒体服务器，客户端请求从此服务器拉取不同的多媒体内容。\n\
    \nNode.js在你需要高并发但较少专用CPU时间时表现良好。\n\n最重要的是，由于Node.js建立在JavaScript之上，当你构建基于相同JavaScript框架的客户端应用程序时，它是最合适的。\n\
    \n## 何时不使用Node.js\n\nNode.js可以用于许多具有各种用途的应用程序，唯一不应使用的情况是应用程序需要长时间的处理时间。\n\nNode的结构是单线程的。如果任何应用程序需要在后台执行一些长时间运行的计算。因此，如果服务器正在进行某些计算，它将无法处理任何其他请求。如上所述，当处理需要较少的专用CPU时间时，Node.js是最佳选择。\n"
