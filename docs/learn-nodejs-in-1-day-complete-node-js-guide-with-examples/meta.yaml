    \nIn order to use Jasmine to test Node.js applications, a series of steps needs\
    \ to be followed.\n\nIn our example below, we are going to define a module which\
    \ adds 2 numbers which need to be tested. We will then define a separate code\
    \ file with the test code and then use jasmine to test the Add function accordingly.\n\
    \nStep 1) Define the code which needs to be tested. We are going to define a function\
    \ which will add 2 numbers and return the result. This code is going to be written\
    \ in a file called \"Add.js.\"\n\n```\nvar exports=module.exports={};\nexports.AddNumber=function(a,b)\n\
    {\n  return a+b;\n};\n```\n\n### Code Explanation:\n\n1.  The \"exports\" keyword\
    \ is used to ensure that the functionality defined in this file can actually be\
    \ accessed by other files.\n2.  We are then defining a function called 'AddNumber.'\
    \ This function is defined to take 2 parameters, a and b. The function is added\
    \ to the module \"exports\" to make the function as a public function that can\
    \ be accessed by other application modules.\n3.  We are finally making our function\
    \ return the added value of the parameters.\n\nStep 2) Next we need to define\
    \ our jasmine test code which will be used to test our \"Add\" function In the\
    \ Add.js file. The below code needs to be put in a file called **add-spec.js.**\n\
    \n> **Note:** - The word 'spec' needs to be added to the test file so that it\
    \ can be detected by jasmine.\n\n```\nvar app=require(\"../Add.js\");\ndescribe(\"\
    Addition\",function(){\n  it(\"The function should add 2 numbers\",function()\
    \ {\n    var value=app.AddNumber(5,6);\n    expect(value).toBe(11);\n  });\n});\n\
    ```\n\n### Code Explanation:\n\n1.  We need to first include our Add.js file so\
    \ that we can test the 'AddNumber' function in this file.\n2.  We are now creating\
    \ our test module. The first part of the test module is to describe a method which\
    \ basically gives a name for our test. In this case, the name of our test is \"\
    Addition\".\n3.  The next bit is to give a description for our test using the\
    \ 'it' method.\n4.  We now invoke our AddNumber method and send in 2 parameters\
    \ 5 and 6. This will be passed to our AddNumber method in the App.js file. The\
    \ return value is then stored in a variable called value.\n5.  The final step\
    \ is to do the comparison or our actual test. Since we expect the value returned\
    \ by the AddNumber function to be 11, we define this using the method expect(value).toBe(the\
    \ expected value).\n\n### Output\n\n1.  In order to run the test, one needs to\
    \ run the command jasmine.\n2.  The below screenshot shows that after the jasmine\
    \ command is run, it will detect that there is a test called add-spec.js and execute\
