    4. Now when you invoke the listenerCount method on our data_received event, it
    will send the number of event listeners attached to this event in the console
    log.


    If the code is executed properly, the value of 2 will be shown in the console
    log.


    # 3. **The newListener Event**


    Each time a new event handler is registered, the event emitter emits a newListener
    event. This event is used to detect new event handlers. You typically use newListener
    event when you need to allocate resources or perform some action for each new
    event handler.'
