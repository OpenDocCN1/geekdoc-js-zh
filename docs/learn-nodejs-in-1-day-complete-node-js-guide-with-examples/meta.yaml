    # # What are Routes


    Routing refers for determining the way in which an application responds to a client
    request to a particular endpoint.


    For example, a client can make a GET, POST, PUT or DELETE http request for various
    URL''s such as the one''s shown below;


    http://localhost:3000/Books

    http://localhost:3000/Students


    In the above example,


    +   - If a GET request is made for the first URL, then the response should ideally
    be a list of books.

    - If the GET request is made for the second URL, then the response should ideally
    be a list of Students.

    - So based on the URL which is accessed, a different functionality on the web
    server will be invoked and accordingly the response will be sent to the client.
    This is the concept of routing.


    Each route can have one or more handler functions, which are executed when the
    route is matched.


    The general syntax for a route is shown below


    ```

    app . METHOD(PATH,  HANDLER)

    ```


    Wherein,

    1) app is an instance of the express module

    2) METHOD is an HTTP request method (GET, POST, PUT or DELETE)

    3) PATH is a path on the server.

    4) HANDLER is the function executed when the route is matched.


    Let''s look at an example of how we can implement routes in express. Our example
    will create 3 routes as'
