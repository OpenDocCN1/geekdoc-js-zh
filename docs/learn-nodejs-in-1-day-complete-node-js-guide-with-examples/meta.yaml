    \ in our code, we have mentioned that our default URL would display this message.\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_47_0.png)\n\nFrom the output, you can\
    \ see that if the URL has been changed to /Node, the respective Node route would\
    \ be chosen and the string \"Tutorial On Node\" is displayed.\n\n![](img/cbcb6538723209554d9dc578069d9e55_47_1.png)\n\
    \nFrom the output, you can see that if the URL has been changed to /Angular, the\
    \ respective Angular route would be chosen and the string \"Tutorial On Angular\"\
    \ is displayed.\n\n## Sample Web Server Using Express.js\n\nFrom our above example,\
    \ we have seen how we can decide on what output to show based on routing. This\
    \ sort of routing is what is used in most modern day web applications. The other\
    \ part of a web server is about using templates in Node.js.\n\nWhen creating quick\
    \ on-the-fly Node applications, an easy and fast way is to use templates for the\
    \ application. There are many frameworks available in the market for making templates.\
    \ In our case, we will take the example of the jade framework for templating.\n\
    \nJade gets installed via the Node Package manager. This can be done by executing\
    \ the following line in the command line:\n\n**npm install jade**\n\nThe above\
    \ command requests the Node package manager to download the required jade modules\
    \ and install them accordingly.\n\nLet's use our newly installed jade framework\
    \ and create some basic templates.\n\n### Step 1)\n\nThe first step is to create\
    \ a jade template. Create a file called index.jade and insert the below code:\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_49_0.png)\n\n1. Here we are specifying\
    \ that the title of the page will be changed to whatever value is passed when\
    \ this template gets invoked.\n2. We are also specifying that the text in the\
    \ header tag will get replaced to whatever gets passed in the jade template.\n\
    \n```\nvar express=require('express');\n\nvar app=express();\n\napp.set('view\
    \ engine','jade');\n\napp.get('/',function(req,res)\n{\n\t\tres.render('index',\n\
    \t\t\t\t{title:'Guru99',message:'Welcome'})\n});\n\nvar server=app.listen(3000,function()\
    \ {});\n```\n\n### Code Explanation:\n\n1. The first thing to specify in the application\
    \ is \"view engine\" that will be used to render the templates. Since we are going\
    \ to use jade to render our templates, we specify this accordingly.\n2. The render\
    \ function is used to render a web page. In our example, we are rendering the\
    \ template (index.jade) which was created earlier.\n3. We are passing the values\
    \ of \"Guru99\" and \"Welcome\" to the parameters \"title\" and \"message\" respectively.\
    \ These values will be replaced by the 'title', and 'message' parameters declared\
    \ in the index.jade template.\n\nIf the command is executed successfully, the\
    \ following Output will be shown when you run your code in the browser.\n\n###\
    \ Output:\n\n![](img/cbcb6538723209554d9dc578069d9e55_51_0.png)\n\nFrom the output,\
    \ we can see that the title of the page gets set to \"Guru99\" and the header\
    \ of the page gets set to \"Welcome.\"\n\n- This is because of the jade template\
    \ which gets invoked in our node js application.\n\n## Summary\n\n- The express\
    \ framework is the most common framework used for developing Node js applications.\
    \ The express framework is built on top of the node.js framework and helps in\
    \ fast-tracking development of server based applications.\n- Routes are used to\
    \ divert users to different parts of the web applications based on the request\
    \ made. The response for each route can be varied depending on what needs to be\
    \ shown to the user.\n- Templates can be used to inject content in an efficient\
    \ manner. Jade is one of the most popular templating engines used in Node.js applications.\n\
    \n## Chapter 6: Node.js with MongoDB\n\nMostly all modern day web applications\
    \ have some sort of data storage system at the backend to store data. For example,\
    \ if you take the case of a web shopping application, data such as the price of\
    \ an item or the number of items of a particular type would be stored in the database.\n\
    \nThe Node js framework has the ability to work with databases which are commonly\
    \ required by most modern day web applications. Node js can work with both relational\
    \ (such as Oracle and MS SQL Server) and non-relational databases (such as MongoDB\
    \ and MySQL). During this tutorial, we will see how we can use databases from\
    \ within Node js applications.\n\n## Node.js and NoSQL Databases\n\nOver the years,\
    \ NoSQL databases such as MongoDB and MySQL have become quite popular as databases\
    \ for storing data. The ability of these databases to store any sort of content\
    \ and particularly in any sort of format is what makes these databases so famous.\n\
    \nNode.js has the ability to work with both MySQL and MongoDB as databases. In\
    \ order to use either of these databases, you need to download and use the required\
    \ modules using the Node package manager.\n\nFor MySQL, the required module is\
    \ called \"mysql\" and for using MongoDB the required module to be installed is\
    \ \"Mongoose.\"\n\nWith these modules, you can perform the following operations\
    \ in Node.js:\n\n1. Manage the connection pooling – Here is where you can specify\
    \ the number of MySQL database connections that should be maintained and saved\
    \ by Node.js.\n2. Create and close a connection to a database. In either case,\
    \ you can provide a callback function which can be called whenever the \"create\"\
    \ and \"close\" connection methods are executed.\n3. Queries can be executed to\
    \ get data from respective databases to retrieve data.\n4. Data manipulation such\
    \ as inserting data, deleting and updating data can also be achieved with these\
    \ modules.\n\nFor the remaining topics, we will look at how we can work with MongoDB\
    \ databases within Node.js.\n\n## Using MongoDB and Node.js\n\nAs discussed in\
    \ the earlier topic, MongoDB is one of the most popular databases used along with\
    \ Node.js.\n\nDuring this chapter, we will see:\n\n- How we can establish connections\
    \ with a MongoDB database\n- How we can perform the normal operations of reading\
    \ data from a database as well as inserting, deleting and updating records in\
    \ a MongoDB database.\n\nFor the purpose of this chapter, let's assume that we\
    \ have the below MongoDB data in place:\n\n- Database name: EmployeeDB\n- Collection\
    \ name: Employee\n\n```\nDocuments\n{\n        {Employeeid: 1, EmployeeName: \"\
    Guru99\"},\n        {Employeeid: 2, EmployeeName: \"Joe\"},\n        {Employeeid:\
    \ 3, EmployeeName: \"Martin\"},\n}\n```\n\n1. **Installing the NPM Modules**:\
    \ To access Mongo from within a Node application, a driver is required. There\
    \ are number of Mongo drivers available, but MongoDB is among the most popular.\
    \ To install the MongoDB module, run the below command: **npm install mongodb**\n\
    2. **Creating and closing a connection to a MongoDB database**: The below code\
