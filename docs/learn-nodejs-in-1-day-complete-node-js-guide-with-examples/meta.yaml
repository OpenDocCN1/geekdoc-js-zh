    # # Chapter 3: Modules


    A module in Node.js is a logical encapsulation of code in a single unit. It''s
    always a good programming practice to always segregate code in such a way that
    makes it more manageable and maintainable for future purposes. That''s where modules
    in Node.js comes in action.


    Since each module is an independent entity with its own encapsulated functionality,
    it can be managed as a separate unit of work.


    During this tutorial, we will see how we can make use of modules in Node.js.'
  - '[PAGE 21]


    # # What are modules in Node.js?


    As stated earlier, modules in Node js are a way of encapsulating code in a separate
    logical unit. There are many readymade modules available in the market which can
    be used within Node js.


    Below are some of the popular modules which are used in a Node js application


    +   1. **Express framework** – Express is a minimal and flexible Node js web application
    framework that provides a robust set of features for the web and mobile applications.

    2. **Socket.io** - Socket.IO enables real-time bidirectional event-based communication.
    This module is good for creation of chatting based applications.

    3. **Jade** - Jade is a high-performance template engine and implemented with
    JavaScript for node and browsers.

    4. **MongoDB** - The MongoDB Node.js driver is the officially supported node.js
    driver for MongoDB.

    5. **Restify** - restify is a lightweight framework, similar to express for building
    REST APIs

    6. **Bluebird** - Bluebird is a fully featured promise library with focus on innovative
    features and performance'
- md: "## Using modules in Node.js\n\nIn order to use modules in a Node.js application,\
    \ they first need to be installed using the Node package manager.\n\nThe below\
    \ command line shows how a module \"express\" can be installed.\n\nnpm install\
    \ express\n\n![](img/cbcb6538723209554d9dc578069d9e55_22_0.png)\n\n- The above\
    \ command will download the necessary files which contain the \"express modules\"\
    \ and take care of the installation as well.\n- Once the module has been installed,\
    \ in order to use a module in a Node.js application you need to use the 'require'\
    \ keyword. This keyword is a way that Node.js uses to incorporate the functionality\
    \ of a module in an application.\n\nLet's look at an example how we can use the\
    \ \"require\" keyword. The below \"Guru99\" code example shows how to use the\
    \ require function.\n\n```\nvar express=require('express');\nvar app=express();\n\
    app.set('view engine', 'jade');\napp.get('/',function(req,res)\n{\n});\nvar server=app.listen(3000,function()\n\
    {\n});\n```\n\n1. In the first statement itself, we are using the \"require\"\
    \ keyword to include the express module. The \"express\" module is an optimized\
    \ JavaScript library for Node.js development. This is one of the most commonly\
    \ used Node.js modules.\n2. After the module is included, in order to use the\
    \ functionality within the module, an object needs to be created. Here an object\
    \ of the express module is created.\n3. Once the module is included using the\
    \ \"require\" command and an \"object\" is created, the required methods of the\
    \ express module can be invoked. Here we are using the set command to set the\
    \ view engine, which is used to set the templating engine used in Node.js. **Note:**\
    \ (Just for the reader's understanding, a templating engine is an approach for\
    \ injecting values in an application by picking up data from data files. This\
    \ concept is pretty famous in Angular JS wherein the curly braces `{{ key }}`\
    \ is used to substitutes values in the web page. The word 'key' in the curly braces\
    \ basically denotes the variable which will be substituted by a value when the\
    \ page is displayed.)\n4. Here we are using the listen method to make the application\
    \ listen on a particular port number.\n\n## Creating NPM modules\n\nNode.js has\
    \ the ability to create custom modules and allows you to include those custom\
    \ modules in your Node.js application.\n\nLet's look at a simple example of how\
    \ we can create our own module and include that module in our main application\
    \ file. Our module will just do a simple task of adding 2 numbers.\n\nLet's follow\
    \ the below steps to see how we can create modules and include them in our application.\n\
    \n**Step 1)** Create a file called \"Addition.js\" and include the below code.\
    \ This file will contain the logic for your module.\n\nBelow is the code which\
    \ would go into this file;\n\n```\nvar exports=module.exports={};\nexports.AddNumber=function(a,b)\n\
    {\nreturn a+b;\n};\n```\n\n1. The \"exports\" keyword is used to ensure that the\
    \ functionality defined in this file can actually be accessed by other files.\n\
    2. We are then defining a function called 'AddNumber'. This function is defined\
    \ to take 2 parameters, a and b. The function is added to the module \"exports\"\
    \ to make the function as a public function that can be accessed by other application\
    \ modules.\n3. We are finally making our function return the added value of the\
    \ parameters.\n\nNow that we have created our custom module which has the functionality\
    \ of adding 2 numbers. It's now time to create an application, which will call\
    \ this module.\n\nIn the next step, we will actually see how to create the application\
    \ which will call our custom module.\n\n**Step 2)** Create a file called \"app.js,\"\
    \ which is your main application file and add the below code.\n\n```\nvar Addition=require('./Addition.js');\n\
    console.log(Addition.AddNumber(1,2));\n```\n\n1. We are using the \"require\"\
    \ keyword to include the functionality in the Addition.js file.\n2. Since the\
    \ functions in the Addition.js file are now accessible, we can now make a call\
    \ to the AddNumber function. In the function, we are passing 2 numbers as parameters.\
    \ We are then displaying the value in the console.\n\n![](img/cbcb6538723209554d9dc578069d9e55_25_0.png)\n\
    \n### Output:\n\n- When you run the app.js file, you will get an output of value\
    \ 3 in the console log.\n- The result is because the AddNumber function in the\
    \ Addition.js file was called successfully and the returned value of 3 was displayed\
    \ in the console.\n\n**Note:** We are not using the \"Node package manager\" as\
    \ of yet to install our Addition.js module. This is because the module is already\
    \ part of our project on the local machine. The Node package manager comes in\
    \ the picture when you publish a module on the internet which we see in the subsequent\
    \ topic.\n\n## Extending modules\n\nWhen creating modules, it is also possible\
    \ to extend or inherit one module from another.\n\nIn modern day programming,\
    \ it's quite common to build a library of common modules and then extend the functionality\
    \ of these common modules if required.\n\nLet's look at an example of how we can\
    \ extend modules in Node.js.\n\n**Step 1)** Create the base module.\n\nIn our\
    \ example, create a file called \"Tutorial.js\" and place the below code.\n\n\
    In this code, we are just creating a function which returns a string to the console.\
    \ The string returned is \"Guru99 Tutorial\".\n\n```\nvar exports=module.exports={};\n\
    exports.tutorial=function()\n{\nconsole.log(\"Guru99 Tutorial\")\n}\n```\n\n1.\
    \ The exports module is used so that whatever function is defined in this file\
    \ can be available in other modules in Node.js.\n2. We are creating a function\
    \ called tutorial which can be used in other Node.js modules.\n3. We are displaying\
    \ a string \"Guru99 Tutorial\" in the console when this function is called.\n\n\
    Now that we have created our base module called Tutorial.js. It's now time to\
    \ create another module which will extend this base module.\n\nWe will explore\
    \ how to do this in the next step.\n\n**Step 2)** Next we will create our extended\
    \ module. Create a new file called \"NodeTutorial.js\" and place the below code\
    \ in the file.\n\n```\nvar Tutor=require('./Tutorial.js');\nexports.NodeTutorial=function()\n\
    {\nconsole.log(\"Node Tutorial\")\nfunction pTutor()\n{\nvar PTutor=Tutor;\nPTutor.tutorial();\n\
    }\n}\n```\n\nNote, the following key points about the above code:\n\n1. We are\
    \ using the \"require\" function in the new module file itself. Since we are going\
    \ to extend the existing module file \"Tutorial.js\", we need to first include\
    \ it before extending it.\n2. We then create a function called \"NodeTutorial.\"\
    \ This function will do 2 things,\n    - It will send a string \"Node Tutorial\"\
    \ to the console.\n    - It will send the string \"Guru99 Tutorial\" from the\
    \ base module \"Tutorial.js\" to our extended module \"NodeTutorial.js\".\n3.\
    \ Here we are carrying out the first step to send a string \"Node Tutorial\" to\
    \ the console.\n4. The next step is to call the function from our Tutorial module,\
    \ which will output the string \"Guru99 Tutorial\" to the console.log.\n\n**Step\
    \ 3)** Create your main app.js file which is your main application file and include\
    \ the below code.\n\n```\nvar localTutor=require('./NodeTutorial.js');\nlocalTutor.NodeTutorial();\n\
    localTutor.NodeTutorial.pTutor();\n```\n\nThe above code does the following things:\n\
    \n1. Our main application file now calls the \"NodeTutorial\" module.\n2. We are\
    \ calling the \"NodeTutorial\" function. By calling this function, the text \"\
    Node Tutorial\" will be displayed in the console log.\n3. Since we have extended\
    \ our Tutorial.js module and exposed a function called pTutor. It also calls the\
    \ tutorial module in the Tutorial.js module, and the text \"Guru99 Tutorial\"\
    \ will be displayed to the console as well.\n\n### Output:\n\nSince we have executed\
    \ the above app.js code using Node, we will get the following output in the console.log\
    \ file.\n\n- Node Tutorial\n- Guru99 Tutorial\n\n## Publishing NPM (Node Package\
    \ Manager) Modules\n\nOne can publish their own module to their own Github repository.\n\
    \nBy publishing your module to a central location, you are then not burdened with\
    \ having to install yourself on every machine that requires it.\n\nInstead, you\
    \ can use the install command of npm and install your published npm module.\n\n\
    The following steps need to be followed to publish your npm module:\n\n**Step\
    \ 1)** Create your repository on GitHub (an online code repository management\
    \ tool). It can be used for hosting your code repositories.\n\n**Step 2)** You\
    \ need to tell your local npm installation on who you are. Which means that we\
    \ need to tell npm who is the author of this module, what is the email id and\
    \ any company URL, which is available which needs to be associated with this id.\
    \ All of these details will be added to your npm module when it is published.\n\
    \nThe below commands sets the name, email and URL of the author of the npm module.\n\
    \n```\nnpm set init.author.name \"Guru99.\"\nnpm set init.author.email \"guru99@gmail.com\"\
    \nnpm set init.author.url \"http://Guru99.com\"\n```\n\n**Step 3)** The next step\
    \ is to login into npm using the credentials provided in the last step. To login,\
    \ you need to use the below command.\n\n```\nnpm login\n```\n\n**Step 4)** Initialize\
    \ your package – The next step is to initialize the package to create the package.json\
    \ file. This can be done by issuing the below command.\n\n```\nnpm init\n```\n\
    \nWhen you issue the above command, you will be prompted for some questions. The\
    \ most important one is the version number for your module.\n\n**Step 5)** Publish\
    \ to GitHub – The next step is to publish your source files to GitHub. This can\
    \ be done by running the below commands.\n\n```\ngit add .\ngit commit -m \"Initial\
    \ release\"\ngit tag v0.0.1\n```"
  mdcn: "\n## 在 Node.js 中使用模块\n\n要在 Node.js 应用程序中使用模块，首先需要使用 Node 包管理器来安装它们。\n\n以下命令行展示了如何安装名为\
    \ \"express\" 的模块。\n\nnpm install express\n\n![](img/cbcb6538723209554d9dc578069d9e55_22_0.png)\n\
    \n- 上述命令将下载包含 \"express 模块\" 的必要文件，并处理安装过程。\n- 模块安装后，要在 Node.js 应用程序中使用它，你需要使用\
    \ 'require' 关键字。这个关键字是 Node.js 用来在应用程序中集成模块功能的一种方式。\n\n让我们看一个如何使用 \"require\"\
    \ 关键字的例子。下面的 \"Guru99\" 代码示例展示了如何使用 require 函数。\n\n```\nvar express=require('express');\n\
    var app=express();\napp.set('view engine', 'jade');\napp.get('/',function(req,res)\n\
    {\n});\nvar server=app.listen(3000,function()\n{\n});\n```\n\n1. 在第一条语句中，我们就使用了\
    \ \"require\" 关键字来引入 express 模块。\"express\" 模块是一个针对 Node.js 开发优化的 JavaScript 库。这是最常用的\
    \ Node.js 模块之一。\n2. 模块引入后，为了使用其内部功能，需要创建一个对象。这里创建了一个 express 模块的对象。\n3. 一旦模块通过\
    \ \"require\" 命令引入并创建了 \"对象\"，就可以调用 express 模块所需的方法。这里我们使用 set 命令来设置视图引擎，用于设定\
    \ Node.js 中使用的模板引擎。**注意：**（仅为了让读者理解，模板引擎是一种通过从数据文件中提取数据来向应用程序注入值的方法。这个概念在 Angular\
    \ JS 中非常流行，其中使用花括号 `{{ key }}` 来在网页中替换值。花括号中的 'key' 基本上表示当页面显示时将被一个值替换的变量。）\n\
    4. 这里我们使用 listen 方法使应用程序监听一个特定的端口号。\n\n## 创建 NPM 模块\n\nNode.js 能够创建自定义模块，并允许你将这些自定义模块包含在你的\
    \ Node.js 应用程序中。\n\n让我们看一个简单的例子，了解如何创建自己的模块并将其包含在主应用程序文件中。我们的模块将只执行一个简单的任务：将两个数字相加。\n\
    \n请按照以下步骤了解如何创建模块并将其包含在应用程序中。\n\n**步骤 1)** 创建一个名为 \"Addition.js\" 的文件，并包含以下代码。此文件将包含你的模块的逻辑。\n\
    \n以下是放入此文件的代码：\n\n```\nvar exports=module.exports={};\nexports.AddNumber=function(a,b)\n\
    {\nreturn a+b;\n};\n```\n\n1. \"exports\" 关键字用于确保此文件中定义的功能确实可以被其他文件访问。\n2. 然后我们定义了一个名为\
    \ 'AddNumber' 的函数。该函数定义为接受两个参数 a 和 b。该函数被添加到模块 \"exports\" 中，使其成为一个公共函数，可以被其他应用程序模块访问。\n\
    3. 最后，我们的函数返回参数的相加值。\n\n现在我们已经创建了具有将两个数字相加功能的自定义模块。是时候创建一个调用此模块的应用程序了。\n\n在下一步中，我们将实际了解如何创建将调用我们自定义模块的应用程序。\n\
    \n**步骤 2)** 创建一个名为 \"app.js\" 的文件，这是你的主应用程序文件，并添加以下代码。\n\n```\nvar Addition=require('./Addition.js');\n\
    console.log(Addition.AddNumber(1,2));\n```\n\n1. 我们使用 \"require\" 关键字来引入 Addition.js\
    \ 文件中的功能。\n2. 由于 Addition.js 文件中的函数现在可以访问，我们现在可以调用 AddNumber 函数。在函数中，我们传递了两个数字作为参数。然后我们在控制台显示该值。\n\
    \n![](img/cbcb6538723209554d9dc578069d9e55_25_0.png)\n\n### 输出：\n\n- 当你运行 app.js\
    \ 文件时，你将在控制台日志中得到值为 3 的输出。\n- 该结果是因为 Addition.js 文件中的 AddNumber 函数被成功调用，并返回了 3，显示在控制台中。\n\
    \n**注意：** 我们目前还没有使用 \"Node 包管理器\" 来安装我们的 Addition.js 模块。这是因为该模块已经是本地计算机上项目的一部分。Node\
    \ 包管理器会在你将模块发布到互联网上时发挥作用，这将在后续主题中看到。\n\n## 扩展模块\n\n创建模块时，也可以从另一个模块扩展或继承一个模块。\n\
    \n在现代编程中，构建一个通用模块库，然后在需要时扩展这些通用模块的功能是非常常见的。\n\n让我们看一个如何在 Node.js 中扩展模块的例子。\n\n\
    **步骤 1)** 创建基础模块。\n\n在我们的示例中，创建一个名为 \"Tutorial.js\" 的文件，并放入以下代码。\n\n在此代码中，我们只是创建一个函数，该函数返回一个字符串到控制台。返回的字符串是\
    \ \"Guru99 Tutorial\"。\n\n```\nvar exports=module.exports={};\nexports.tutorial=function()\n\
    {\nconsole.log(\"Guru99 Tutorial\")\n}\n```\n\n1. 使用 exports 模块是为了使此文件中定义的任何函数在\
    \ Node.js 的其他模块中可用。\n2. 我们正在创建一个名为 tutorial 的函数，该函数可以在其他 Node.js 模块中使用。\n3. 当此函数被调用时，我们在控制台中显示一个字符串\
    \ \"Guru99 Tutorial\"。\n\n现在我们已经创建了名为 Tutorial.js 的基础模块。是时候创建另一个模块来扩展这个基础模块了。\n\
    \n我们将在下一步中探讨如何执行此操作。\n\n**步骤 2)** 接下来，我们将创建扩展模块。创建一个名为 \"NodeTutorial.js\" 的新文件，并在其中放入以下代码。\n\
    \n```\nvar Tutor=require('./Tutorial.js');\nexports.NodeTutorial=function()\n\
    {\nconsole.log(\"Node Tutorial\")\nfunction pTutor()\n{\nvar PTutor=Tutor;\nPTutor.tutorial();\n\
    }\n}\n```\n\n请注意上述代码的以下关键点：\n\n1. 我们在新的模块文件本身中使用了 \"require\" 函数。由于我们将扩展现有模块文件\
    \ \"Tutorial.js\"，因此在扩展之前需要先将其包含进来。\n2. 然后我们创建一个名为 \"NodeTutorial\" 的函数。这个函数将做两件事，\n\
    \    - 它将向控制台发送一个字符串 \"Node Tutorial\"。\n    - 它将从基础模块 \"Tutorial.js\" 中获取字符串\
    \ \"Guru99 Tutorial\" 并发送到我们的扩展模块 \"NodeTutorial.js\"。\n3. 这里我们正在执行第一步，向控制台发送一个字符串\
    \ \"Node Tutorial\"。\n4. 下一步是调用我们 Tutorial 模块中的函数，这将把字符串 \"Guru99 Tutorial\" 输出到\
    \ console.log。\n\n**步骤 3)** 创建你的主应用程序文件 app.js，并包含以下代码。\n\n```\nvar localTutor=require('./NodeTutorial.js');\n\
    localTutor.NodeTutorial();\nlocalTutor.NodeTutorial.pTutor();\n```\n\n上述代码执行以下操作：\n\
    \n1. 我们的主要应用程序文件现在调用 \"NodeTutorial\" 模块。\n2. 我们调用 \"NodeTutorial\" 函数。通过调用此函数，文本\
    \ \"Node Tutorial\" 将显示在控制台日志中。\n3. 由于我们扩展了 Tutorial.js 模块并公开了一个名为 pTutor 的函数。它还会调用\
    \ Tutorial.js 模块中的 tutorial 模块，文本 \"Guru99 Tutorial\" 也将显示在控制台中。\n\n### 输出：\n\n\
    由于我们使用 Node 执行了上述 app.js 代码，我们将在 console.log 文件中获得以下输出。\n\n- Node Tutorial\n-\
    \ Guru99 Tutorial\n\n## 发布 NPM（Node 包管理器）模块\n\n可以将你自己的模块发布到你自己的 Github 仓库。\n\n\
    通过将模块发布到中央位置，你就不必自己在每一台需要它的机器上安装。\n\n相反，你可以使用 npm 的 install 命令来安装你已发布的 npm 模块。\n\
    \n发布你的 npm 模块需要遵循以下步骤：\n\n**步骤 1)** 在 GitHub（一个在线代码仓库管理工具）上创建你的仓库。它可用于托管你的代码仓库。\n\
    \n**步骤 2)** 你需要告诉本地的 npm 安装你是谁。这意味着我们需要告诉 npm 此模块的作者是谁，电子邮件 ID 是什么，以及任何需要与此 ID\
