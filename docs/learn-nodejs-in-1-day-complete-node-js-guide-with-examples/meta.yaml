  md: "# # What are generators\n\nGenerators have become quite famous in Node.js in\
    \ recent times and that probably because of what they are capable of doing.\n\n\
    +   - Generators are function executions that can be suspended and resumed at\
    \ a later point.\n- Generators are useful when carrying out concepts such as 'lazy\
    \ execution'. This basically means that by suspending execution and resuming at\
    \ will, we are able to pull values only when we need to.\n\nGenerators have the\
    \ below 2 key methods\n\n+   1. Yield method – The yield method is called in a\
    \ function to halt the execution of the function at the specific line where the\
    \ yield method is called.\n2. Next method – This method is called from the main\
    \ application to resume the execution of a function which has a yield method.\
    \ The execution of the function will continue till the next yield method or till\
    \ the end of the method.\n\nLet's look at an example of how generators can be\
    \ used.\n\nIn our example, we are going to have a simple Add function which will\
    \ add 2 numbers, but we will keep on halting the method execution at different\
    \ points to showcase how generators can be used.\n\n```\nfunction* Add(x) {\n\
    \    yield x + 1;\n    var y = yield(null);\n    y = 6\n    return x + y;\n}\n\
    \nvar gen = Add(5);\n\ngen.next();\n\ngen.next();\n```\n\n# ## Code Explanation:-\n\
    \n+   1. The first step is to define our generator \"function\". Note that this\
    \ is done by adding a \"*\" to the function keyword. We are then defining a function\
    \ called Add which takes a"
