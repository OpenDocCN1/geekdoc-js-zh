- md: "# Handling GET Requests in Node.js\n\nMaking a GET Request to get the data\
    \ from another site is relatively very simple in Node.js. To make a GET request\
    \ in the node, we need to first have the request module installed. This can be\
    \ done by executing the following line in the command line:\n\n```\nnpm install\
    \ request\n```\n\nThe above command requests the Node package manager to download\
    \ the required request modules and install them accordingly.\n\nWhen your npm\
    \ module has been installed successfully, the command line will show the installed\
    \ module name and version: <name>@<version>.\n\nIn the above snapshot, you can\
    \ see that the 'request' module along with the version number 2.67.0 was downloaded\
    \ and installed.\n\nNow let's see the code which can make use of this 'request'\
    \ command.\n\n```\nvar request = require(\"request\");\nrequest(\"http://www.google.com\"\
    , function(error, response, body)\n{\n    console.log(body);\n});\n```\n\n## Code\
    \ Explanation\n\n1. We are using the 'require' module which was installed in the\
    \ last step. This module has the necessary functions which can be used to make\
    \ GET requests to websites.\n2. We are making a GET Request to www.google.com\
    \ and subsequently calling a function when a response is received. When a response\
    \ is received the parameters (error, response, and body) will have the following\
    \ values:\n    a. Error – In case there is any error received when using the GET\
    \ request, this will be recorded here.\n    b. Response - The response will have\
    \ the http headers which are sent back in the response.\n    c. Body - The body\
    \ will contain the entire content of the response sent by Google.\n3. In this,\
    \ we are just writing the content received in the body parameter to the console.log\
    \ file. So basically, whatever we get by going to **www.google.com** will be written\
    \ to the console.log.\n\nHere is the code for your reference:\n\n```\nvar request\
    \ = require(\"request\");\n\nrequest(\"http://www.google.com\",function(error,response,body)\n\
    {\n\nconsole.log(body);\n\n});\n```\n\n## Summary\n\n- The Node.js framework can\
    \ be used to develop web servers using the 'http' module. The application can\
    \ be made to listen on a particular port and send a response to the client whenever\
    \ a request is made to the application.\n- The 'request' module can be used to\
    \ get information from web sites. The information would contain the entire content\
    \ of the web page requested from the relevant web site.\n\n# Chapter 5: Node.js\
    \ with Express\n\nIn this tutorial, we will also have a look at the express framework.\
    \ This framework is built in such a way that it acts as a minimal and flexible\
    \ Node.js web application framework, providing a robust set of features for building\
    \ single and multipage, and hybrid web application.\n\n# What is Express.js\n\n\
    Express.js is a Node.js web application server framework, which is specifically\
    \ designed for building single-page, multi-page, and hybrid web applications.\n\
    \nIt has become the standard server framework for node.js. Express is the backend\
    \ part of something known as the MEAN stack.\n\nThe MEAN is a free and open-source\
    \ JavaScript software stack for building dynamic web sites and web applications\
    \ which has the following components:\n\n1. **MongoDB** - The standard NoSQL database\n\
    2. **Express.js** - The default web applications framework\n3. **Angular.js**\
    \ - The JavaScript MVC framework used for web applications\n4. **Node.js** - Framework\
    \ used for scalable server-side and networking applications.\n\nThe Express.js\
    \ framework makes it very easy to develop an application which can be used to\
    \ handle multiple types of requests like the GET, PUT, and POST and DELETE requests.\n\
    \n# Installing and using Express\n\nExpress gets installed via the Node Package\
    \ manager. This can be done by executing the following line in the command line:\n\
    \n```\nnpm install express\n```\n\nThe above command requests the Node package\
    \ manager to download the required express modules and install them accordingly.\n\
    \nLet's use our newly installed Express framework and create a simple \"Hello\
    \ World\" application.\n\nOur application is going to create a simple server module\
    \ which will listen on port no 3000. In our example, if a request is made through\
    \ the browser on this port no, then server application will send a 'Hello World'\
    \ response to the client.\n\n```\nvar express=require('express');\nvar app=express();\n\
    app.get('/',function(req,res)\n{\n    res.send('Hello World!');\n});\n\nvar server=app.listen(3000,function()\
    \ {});\n```\n\n## Code Explanation\n\n1. In our first line of code, we are using\
    \ the require function to include the \"express module.\"\n2. Before we can start\
    \ using the express module, we need to make an object of the express module.\n\
    3. Here we are creating a callback function. This function will be called whenever\
    \ anybody browses to the root of our web application which is **http://localhost:3000**.\
    \ The callback function will be used to send the string 'Hello World' to the web\
    \ page.\n4. In the callback function, we are sending the string \"Hello World\"\
    \ back to the client. The 'res' parameter is used to send content back to the\
    \ web page. This 'res' parameter is something that is provided by the 'request'\
    \ module to enable one to send content back to the web page.\n5. We are then using\
    \ the listen to function to make our server application listen to client requests\
    \ on port no 3000. You can specify any available port over here.\n\nIf the command\
    \ is executed successfully, the following Output will be shown when you run your\
    \ code in the browser.\n\n## Output\n\nFrom the output, you can clearly see that\
    \ if we browse to the URL of localhost on port 3000, you will see the string 'Hello\
    \ World' displayed in the page. Because in our code we have mentioned specifically\
    \ for the server to listen on port no 3000, we are able to view the output when\
    \ browsing to this URL.\n\n# What are Routes\n\nRouting refers to determining\
    \ the way in which an application responds to a client request to a particular\
    \ endpoint.\n\nFor example, a client can make a GET, POST, PUT or DELETE http\
    \ request for various URL's such as the one's shown below:\n\nhttp://localhost:3000/Books\n\
    http://localhost:3000/Students\n\nIn the above example:\n\n- If a GET request\
    \ is made for the first URL, then the response should ideally be a list of books.\n\
    - If the GET request is made for the second URL, then the response should ideally\
    \ be a list of Students.\n- So based on the URL which is accessed, a different\
    \ functionality on the web server will be invoked and accordingly the response\
    \ will be sent to the client. This is the concept of routing.\n\nEach route can\
    \ have one or more handler functions, which are executed when the route is matched.\n\
    \nThe general syntax for a route is shown below:\n\n```\napp.METHOD(PATH, HANDLER)\n\
    ```\n\nWherein:\n1. app is an instance of the express module\n2. METHOD is an\
    \ HTTP request method (GET, POST, PUT or DELETE)\n3. PATH is a path on the server.\n\
    4. HANDLER is the function executed when the route is matched.\n\nLet's look at\
    \ an example of how we can implement routes in express. Our example will create\
    \ 3 routes as:\n\n1. A /Node route which will display the string \"Tutorial on\
    \ Node\" if this route is accessed\n2. A /Angular route which will display the\
    \ string \"Tutorial on Angular\" if this route is accessed\n3. A default route\
    \ / which will display the string \"Welcome to Guru99 Tutorials.\"\n\nOur basic\
    \ code will remain the same as previous examples. The below snippet is an add-on\
    \ to show case how routing is implemented.\n\n```\napp.route('/Node').get(function(req,res)\n\
    {\n    res.send(\"Tutorial on Node\");\n});\napp.route('/Angular').get(function(req,res)\n\
    {\n    res.send(\"Tutorial on Angular\");\n});\napp.get('/',function(req,res)\n\
    {\n    res.send('Welcome to Guru99 Tutorials');\n});\n```\n\n## Code Explanation\n\
    \n1. Here we are defining a route if the URL **http://localhost:3000/Node** is\
    \ selected in the browser. To the route, we are attaching a callback function\
    \ which will be called when we browse to the Node URL.\n\n    The function has\
    \ 2 parameters.\n\n    - The main parameter we will be using is the 'res' parameter\
    \ which can be used to send information back to the client.\n    - The 'req' parameter\
    \ has information about the request being made. Sometimes additional parameters\
    \ could be sent as part of the request being made, and hence the 'req' parameter\
    \ can be used to find the additional parameters being sent.\n\n2. We are using\
    \ the send function to send the string \"Tutorial on Node\" back to the client\
    \ if the Node route is chosen.\n\n3. Here we are defining a route if the URL **http://localhost:3000/Angular**\
    \ is selected in the browser. To the route, we are attaching a callback function\
    \ which will be called when we browse to the Angular URL.\n\n4. We are using the\
    \ send function to send the string \"Tutorial on Angular\" back to the client\
    \ if the Angular route is chosen."
  mdcn: "\n# 在Node.js中处理GET请求\n\n在Node.js中发起GET请求以从其他站点获取数据相对非常简单。要在Node中发起GET请求，我们首先需要安装request模块。这可以通过在命令行中执行以下命令来完成：\n\
