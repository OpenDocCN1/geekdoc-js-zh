    当你准备好让你那出色的网站上线时，可以在互联网上搜索廉价的网页托管或类似的服务。你也可以搜索最好的免费和付费网页托管。想一想，如果你打算使用你的网站来赚钱，每月花费二到四美元购买一个廉价且可靠的网页主机真的并不多。在选择任何主机之前，请务必研究一下他们的服务条款。


    当你找到了你认为适合自己的主机后，上传你的网站非常简单。你已经做好了正确的准备，可以实现快速传输。你电脑桌面上有一个命名为 `website` 或类似名称的单个文件夹。你网站的主页命名为
    `index.html`。服务器在加载你的站点时会首先查找 `index.html`。如果找不到，用户将收到“页面未找到”的错误。它本质上就是你的首页。


    根据你选择的主机类型，情况可能会略有不同，但你需要寻找的是被称为 `FTP` 的东西。它指的是文件传输协议（File Transfer Protocol）。你会发现某些服务器允许无限文件传输，而另一些则有一定限制。在选择主机之前，你应该研究所有的优缺点。先看看其他人对该主机的评价。无论如何，`FTP`
    就是你上传网页的地方。当你上传了整个站点后，全世界都可以看到它了。


    每当你想要更改或更新你的站点时，只需要回到桌面上的网站文件夹，进行更改或添加，然后重新上传到你的网页主机中。在进行任何更改之前，为你的页面制作备份是一个好主意。这样万一出现问题，你始终可以回到原始文档并找出发生了什么。你甚至可以创建一个命名为
    `updates` 或类似名称的独立文件夹，并将内容复制粘贴到这个新文件夹中。


    经验丰富的开发者做的另一件事是，每当他们进行更改或更新时，通常会有一份文档或类似的文件记录更改日期和操作内容。这样当问题出现时，他们就有一份记录可以回顾。有些开发者甚至会保存副本，文件名直接说明他们做了哪些更改。但在电脑某处创建一个可以记录更新内容的简单文本文档通常也足够。


    # 测验答案 1 - 12 章


    ## 第 1 章测试答案

    1\. 网页浏览器读取并渲染成视觉和听觉网页的标准语言。

    2\. 一个包围元素内容并告诉浏览器该元素是什么种类型的标签。例如：`<p>这些是开始标签和结束标签</p>`。元素是指从开始标签、内部内容到结束标签的完整代码。

    3\. 开始标签 `<p>` 告诉浏览器这是元素的开始，而结束标签 `</p>` 加上斜杠告诉浏览器这是结束，并移动到下一个元素。

    4\. `<!doctype html>` 这告诉浏览器文档的类型。

    5\. 属性是其所在标签的修饰符。通常包含一个名称和一个值。它们总是被放在开始标签中。


    ## 第 2 章测试答案

    1\. 浏览器按照从上到下的方式读取 HTML。

    2\. `<head></head>` 标签。

    3\. 浏览器默认会忽略任何额外的间距或空白。它只会在每个单词之间留一个空格。

    4\. 因为不同的浏览器读取和显示代码的方式可能不同。为了防止停电等情况，经常保存也是一种良好的习惯。


    ## 第 3 章测试答案

    1\. `<!--这是一个 HTML 注释-->`

    2\. 它们可以帮助你将代码组织成章节，并提醒你以后做某些事情。它们还可以用于调试代码中的问题。

    3\. `50 & 60` 都大于 `40`。


    ## 第 4 章测试答案

    1\. 它是一个没有内容的元素，例如换行符 `<br>`。

    2\. 在地址中。


    ## 第 5 章测试答案

    1\. `<img src="imagename.fileextension">`。

    2\. 当只有一两个图片进行非常微小的更改时。

    3\. `alt="这里是某些文本"`。

    4\. `.jpg` 或 `.jpeg`

    5\. `.png` 但也可以使用 `.gif`。


    ## 第 6 章测试答案

    1\. 有序列表是有编号的，而无序列表使用符号代替数字。

    2\. `<li></li>`

    3\. `<table>` 是表格开始标签，告诉浏览器我们正在创建一个表格；`<<th>>` 是表格表头的开始标签；`<<tr>>` 是表格行的开始标签；`</td>`
    是表格单元数据的结束标签。

    4\. 从左到右。

    5\. 它在我们的表格上方添加了一个类似于标题的说明。你紧跟在表格开始标签 `<table>` 之后添加它。


    ## 第 7 章测试答案

    1\. 锚点标签（anchor tag）。

    2\. 它为锚点标签提供了一个链接到的目的地。

    3\. 井号 `#`

    4\. 你可以链接到当前网页内部的某个地方、到你网站内的另一个网页，以及到外部网站。

    5\. 在 `<body>` 元素的末尾，紧邻 `</body>` 结束标签之前。这是用于放在页面底部的页脚（footer）。页脚也可以用于其他地方。


    ## 第 8 章测试答案

    1\. `form` 元素。

    2\. 在 `form` 元素内部添加 `label` 元素。通常位于 `input` 类型代码上方。

    3\. 在 `value` 属性的双引号内。`value="这里"`。

    4\. 编程代码。例如 `JavaScript`。

    5\. 指定用户输入的最小值和最大值。


    ## 第 9 章测试答案

    1\. 单选按钮（radio）表单用于只需要一种选择的情况，如是或否。复选框（checkbox）表单允许用户选择多个选项。

    2\. `text`、`submit`、`number`、`radio` 和 `checkbox` 都是答案。

    3\. 它将根据用户的选择设置为是或否。该值将发送到服务器进行处理。


    ## 第 10 章测试答案

    1\. 为浏览器和搜索引擎提供的关于页面的指令和信息。

    2\. `title` 元素、`meta` 描述和 `meta` 关键词内部。

    3\. 大约三个描述性的句子。

    4\. `head` 元素。

    5\. 是，因为搜索引擎可以在搜索结果中弹出你的任何一个页面，而且你的每个页面都有不同的元数据。

    6\. `en-us`


    ## 第 11 章测试答案

    1\. 为你的 HTML 元素进行设计、样式、动画和定位。

    2\. 在 `head` 元素内部。

    3\. `{ }` 左括号和右括号。

    4\. 选择器（或多个选择器）、起始大括号、至少一个属性：值；以及结束大括号。

    5\. 用逗号跟随另一个选择器名称。例如 `h1,h2,h5 {`

    6\. 它是语句的结束，并进入下一个语句。


    ## 第 13 章测试答案

    1\. 这是一种更短的方法，可以在单行内影响多个属性设置，而不是使用多行。


