  trans: "\n\n你现在文本编辑器中应该打开了六个标签页。确保除了 `stylesheet.css` 之外，所有的标签后缀名都是 `.html`。如果其中一个或多个标签的文件名后没有\
    \ `.html`，那么它们可能被保存为了 `.txt` 或其他格式。在这种情况下，你需要重新保存并确保指定它们为 `.html` 文档。我们暂时不会再创建新页面了，所以这部分目前已经好了。我们刚刚创建的新页面是空的，我们创建它们是为了以后以后使用。现在我们只想设置好首页（Home\
    \ page）。然后我们将复用很多代码。如果你现在运行 `index.html` 页面，你会看到页面上有一个页眉和五个链接。到为止，我们还没有为任何内容指定任何\
    \ CSS 样式，所有内容都以块级元素的形式显示。你还会看到链接有下划线并且一个一个堆叠在一起。我们稍后会对所有这些进行更改和样式化。现在我们只需要设置页面内容。但请记住，点击这些链接是可以的，它们只是会将你带到一个空白页面，因为我们还没有向它们添加任何代码。我们整个网站中，唯一包含内容的页面就是\
    \ `index.html`，也称为我们的主页。\n\n## 设置我们的主内容区域\n\n接下来我们将设置主内容区域。以下是你想要添加到 `index.html`\
    \ 页面中的代码。请将其放在 `</div>` 导航 div 结束标签的正下方。在构建整个网站的过程中，你可以为标题和段落输入不同的文本，但目前你可能想完全复制下方练习题中的内容。这样做有几个原因：其之一是元素包含的内容量对于我们网站的响应式（responsive）至关重要。这部分在我们开始处理此布局的\
    \ CSS 部分时你会理解得更好。另一个原因是是某些段落包含了重要信息，其中一些你会立即理解，另一些在之后看来会更有意义。创建一个响应式网站是一项棘手的工作。为了在快速教你知识的同时给你提供一个可运行的响应式网站，我在实际的\
    \ HTML 内容中包含了一些相关信息来提供帮助。在我们继续进行时请记住这一点。接下来的示例有很多内容，所以请务必花时间确保所有输入都正确。以下是我们要在关闭导航\
    \ div 标签之后要添加的下一部分 HTML 代码：\n\n```html\n</div>\n\n<div class=\"mainContent\">\n\
    \  <div class=\"content\">\n    <article class=\"topContent\">\n      <header>\n\
    \        <h2>Hello Internet</h2>\n      </header>\n      <footer>\n        <p\
    \ class=\"subHeading\">written by Johnathan Doe.</p>\n      </footer>\n      <p>欢迎大家来到我的新网站，这个网站旨在教你许多不同类型的计算机编程语言。如果你对\
    \ Web 开发、Web 设计，或者为你的网站添加编程功能以使其更具用户交互性感兴趣，那么这个网站正适合你。请查看我的教程（Tutorials）部分。你将获得的一些教程系列包括\
    \ HTML、CSS、JavaScript、PHP、asp.net 和 Java。请务必查看“如何构建响应式网站”系列。</p><br>\n      <p>对应用或游戏开发感兴趣吗？查看我关于\
    \ Java 的视频系列。Java 是一种复杂的编程语言，现在几乎用于所有地方。如果你是 Java 初学者，我建议你从“Java 入学者”系列开始。如果你有一点\
    \ Java 甚至 C# 的经验（因为它非常相似），那么从中级系列开始应该是没问题的。如果你对这个网站有任何建议，请在“联系我们（Contact Us）”页面向我们发送消息。</p>\n\
    \    </article>\n    <article class=\"bottomContent\">\n      <header>\n     \
    \   <h2>More information on web development and programming</h2>\n      </header>\n\
    \      <footer>\n        <p class=\"subHeading\">written by Johnathan Doe.</p>\n\
    \      </footer>\n      <p>这是第二个 div 的示例，用于将信息与放在顶部的主内容分开。这样的一些原因是为了提高你页面的视觉效果和感受，并区分你可能正在编写的不同主题。你可以在页面上设置任意数量的区块。这只是一个演示性的布局。此外，你的每一个页面都可以有相同的布局，也可以完全完全不同。你可以从主页面复制并粘贴许多元素到你的子页面中，并在必要的地方进行修改。你的\
    \ CSS 规则可以应用于这些新页面，或者你可以使用 class 或 id 属性创建新规则。在学习本节课程时需要记住的另一点是，内容的大小也很重要。当我们进行定位时，会将元素向左浮动（floating）。如果你记得它是如何运作的，它会将元素固定在屏幕的左侧。这意味着了几点：：这个段落中的文本量很重要，因为首先浏览器会从上到下读取你的\
    \ HTML 代码。所以我们所有想要在左侧的主内容将首先显示。然后通过给它们设置宽度（width）属性，我们将为右侧的主内容留出空间来填充额外空间。随着我们的学习你会看到。但由于我们将所有内容向左浮动，所以我们实际上想放在左侧的内容必须比右侧大。将所有内容向左对齐的一个良好准则是：只需确保你在左侧有更多内容。这是很合理的，因为这是你的主区域。之后你可以尝试向右浮动和使用不同的定位系统。</p>\n\
    \    </article>\n  </div>\n</div>\n```\n\n"
- fmt: "\nThe first thing we did was set up a `div` with a class name of `\"mainContent\"\
