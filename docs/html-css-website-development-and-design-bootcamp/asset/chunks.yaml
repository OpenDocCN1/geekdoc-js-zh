  trans: "\n\n# CSS 类 (Classes) 和 ID\n\n我们将从类开始。首先需要做的是删除我们在第 14 章中添加到 `h3` 元素和 `p`\
    \ 元素中的内联样式。请删除 `style=\"color:red;font-size:20px;\"` 代码和 `style=\"color:purple;font-size:14px;text-align:left;\"\
    ` 代码。\n\n现在，你只剩下一个没有内联样式代码的 `<h3>` 元素和一个 `<p>` 元素。我们的 `h3` 和 `p` 元素现在从 `head`\
    \ 元素中的内部样式表中获取属性值。\n\n## 使用类 (Classes)\n\n类允许你同时设计一个特定元素或多个元素。虽然所有段落可能共享 `p` 规则中指定的相同样式特征，但类允许特定的段落拥有不同的样式集。\n\
    \n为了实现这一点，请在第一个和第二个 `p` 元素的起始标签中添加以下代码：\n\n```html\n<p class=\"gray\">\n<p class=\"\
    gray\">\n```\n\n通过给这两个段落都赋予名为 `gray` 的类，我们可以专门地针对它们进行设置。使类名与其用途相关是非常重要的。\n\n现在，在你的内部样式表中创建一个新规则。在\
    \ `p` 规则的 `}` 关闭花括号之后，添加这段代码：\n\n```css\n.gray {\n    color: gray;\n}\n```\n\n\
    - `.gray{`: 我们为类创建规则的方法是添加一个 `.`（点）和类名。\n- `color: gray;`: 这将字体颜色设置为灰色。你可以在一个类中包含尽可能多需要的属性和值。\n\
    - `}`: 关闭 CSS 规则。\n\n当你运行代码时，前两个段落将显示灰色文本，但仍将保留来自 `p` 规则的其他属性。这里的类被用来覆盖字体颜色。\n\
    \n### 类的可复用性\n类是可复用的。例如，如果你创建这样一个类规则：\n\n```css\n.maincontent {\n    background-color:\
    \ black;\n    color: blue;\n    text-align: center;\n    font-family: arial;\n\
    \    font-size: 15px;\n}\n```\n\n你可以在任何你认为属于主要内容元素的 HTML 元素（如 `p` 或 `h1`）的起始标签中使用\
    \ `class=\"maincontent\"`。\n\n## CSS ID\n\n`id` 与类非常相似，并且可以在任何可以使用类的地方使用。然而，`id`\
    \ 专门用于一个你计划不更改或不重复的唯一元素，例如标题或页脚。\n\n为了演示，请将这段代码添加到嵌套在 `<footer></footer>` 元素内部的\
    \ `<p>` 起始标签中：\n\n```html\n<p id=\"footer\">\n```\n\n现在，在你的内部样式表中，在 `.gray` 规则下方，为该\
    \ `id` 添加这个新规则：\n\n```css\n#footer {\n    background-color: yellow;\n}\n```\n\n\
    - `#footer{`: 对于 `id` 规则，选择器以 `#`（井号）而不是 `.`（点）开头。\n- `background-color: yellow;`:\
    \ 为页脚中的 `p` 元素应用黄色背景。\n- `}`: 关闭规则。\n\n### 类与 ID 总结\n在选择类或 `id` 时，请确保它符合该元素的用途。避免给每一个\
    \ HTML 元素都添加类或 `id`，因为那样会违背这些选择器的初衷。\n\n## 第 16 章测验\n\n1. 你会在什么地方想要使用类？\n2. 你会在什么地方想要使用\
    \ `id`？\n3. 在 CSS 规则中，类选择器和 `id` 选择器分别使用什么符号？\n\n# 第 17 章：盒模型、外边距和内边距\n\n本章重点讨论盒模型，它对于定位元素和添加间距极其重要。\n\
    \n## 盒模型图解\n\n![](img/00001.jpeg)\n\n页面上的每个元素都包含在不可见的盒子中：\n\n- **内容区 (Content\
    \ Box)**：元素的实际内容（文本、图像等）。\n- **内边距 (Padding)**：内容与边框之间的空间。\n- **边框 (Border)**：围绕内边距和内容的线条。\n\
    - **外边距 (Margin)**：元素边框与其他周围元素之间的空间。\n\n## 盒模型示例\n\n为了使这些盒子可见，请在内部样式表中为 `h3` 元素添加以下规则：\n\
    \n```css\nh3 {\n    background-color: gray;\n    border: 5px solid yellow;\n}\n\
    ```\n\n在这个 `h3` 规则中，我们使用了边框的简写形式。或者，你也可以使用单独的属性：`border-width:`、`border-style:`\
    \ 和 `border-color:`。\n\n为了在文本和边框之间创建空间，请在 `h3` 规则中添加 `padding`：\n\n```css\nh3\
    \ {\n    background-color: gray;\n    border: 5px solid yellow;\n    padding:\
    \ 25px;\n}\n```\n\n现在，内容的四个方向都有 25 像素的内边距。由于没有指定 `width`，边框将贯穿页面的整个宽度。\n\n"
- fmt: "\n## Margin and Padding\n\nAnother thing that you can see here is that we\
    \ have a margin. And that's the space between the border and the other elements\
    \ around it. There is also a margin between the border and the outside of the\
    \ page. The browser adds this automatically. Notice that the margin between the\
    \ `h3` element and the two elements that are above and below it is double the\
    \ size of the margin on the sides of our `h3` element. That is because there are\
    \ default margins that the browser adds to every element. So it is adding our\
    \ `h3` margin and the margin of the other element together. And since the edge\
    \ of our page is not an element we only have the `h3` margin.\n\nLet's add a margin\
    \ to our `h3` rule to see an example of what happens when we specify the margin\
    \ amount:\n\n```css\nh3 {\n    background-color: gray;\n    border: 5px solid\
    \ yellow;\n    padding: 25px;\n    margin: 30px;\n}\n```\n\nAnd finally we specified\
    \ that we wanted a 30 pixel margin from the border to anything else around it\
    \ on all four sides.\n\nOne other thing that we can do with the margin here is,\
    \ if you look at your page now you can see there is a margin between every element\
    \ and the end of the page. We can take this away so that everything bumps right\
    \ up against the edge of the browser window. We have to add this code to our `body`\
    \ rule:\n\n```css\nbody {\n    background-color: #008080;\n    margin: 0px;\n\
    }\n```\n\nAnd now all of our elements butt right up against the edge of the browser\
    \ window except for the `h3` element because we specified a margin. You should\
    \ know that we took the margin away from the `body` here not the elements themselves.\
    \ You could use the `margin: 0;` on any of your elements though. Also you may\
    \ have noticed that all of our lists still have some space. And that is because\
    \ there is an invisible margin around our lists. To make it visible all you have\
    \ to do is add this code to both your `ul` and `ol` rules:\n\n```css\nul {\n \
    \   font-weight: bold;\n    border: 2px solid red;\n}\n\nol {\n    font-style:\
    \ italic;\n    border: 2px solid red;\n}\n```\n\nNow you can see the borders with\
    \ the margin space for both of your lists on your page.\n\n### Margin and Padding\
    \ properties\n\nJust like the `border` property you can individually control your\
    \ margins and padding. Below is a list of properties that you could use on any\
    \ element to control the margin and padding amounts individually:\n\n- `margin-left:`\n\
    - `margin-right:`\n- `margin-top:`\n- `margin-bottom:`\n- `padding-left:`\n- `padding-right:`\n\
    - `padding-top:`\n- `padding-bottom:`\n\nUsing these properties on your elements\
    \ is one way of positioning your content on your page. A little bonus exercise\
    \ that you can do here is go to your `body` rule and add `border: 5px solid black;`\
    \ and remove your `margin: 0px;` code. This will give you a visual of the margin\
    \ that is added to the `body` by default.\n\nThe final thing that we gonna go\
    \ over in this chapter is that you can either apply values to your margin top,\
    \ right, bottom, and left individually by using the properties above or by coding\
    \ it shorthand just like the `border` property. Below is an example:\n\n`margin:\
    \ 5px 10px 5px 10px;`\n\nAnd the order in which the values that you enter are\
    \ top, right, bottom, left. So this line of code would give you a margin of 5\
    \ pixels on the top and bottom of your element and 10 pixels on the left and right\
    \ sides. It is exactly the same order for the `padding` property if you want to\
    \ code that shorthand as well.\n\n### Quiz Chapter 17\n\n1. Padding is the space\
    \ between the content and what?\n2. A Margin is the space between the border and\
    \ what?\n3. What value is used to get rid of a margin?\n4. In what order are your\
    \ values entered shorthand for the margin properties?\n5. If you had two elements,\
    \ one above the other and you take the margin away from one of them. Is there\
    \ still space between the two elements?\n\n## Chapter 18: Div's and Span's\n\n\
    This chapter is going to be more of a discussion about these two elements. First\
    \ of all they are HTML elements and it didn't make sense to learn about these\
    \ until we got into CSS. Because they kind of need CSS to actually do something.\n\
    \n### Div's\n\nThe `div` element is used to divide your HTML content up into logical\
    \ sections for things like positioning and styling. You can have one or multiple\
    \ elements inside of a `div`. An example of the use of two `div`'s follows:\n\n\
    ```html\n<div id=\"navigation\">\n    <ul>\n        <li>Home</li>\n        <li>News</li>\n\
    \        <li>Pictures</li>\n        <li>Contact</li>\n    </ul>\n</div>\n\n<div\
    \ id=\"maincontent\">\n    <h1>Welcome to my Website</h1>\n    <p>Check out my\
    \ news section and the pictures page.</p>\n</div>\n```\n\nIn the above example\
    \ we have two `div`'s. One we used to hold a navigation menu and the other is\
    \ used to hold our main content section. One of the main uses of a `div` is to\
    \ control how you position your elements. But they can also be used for inheriting\
