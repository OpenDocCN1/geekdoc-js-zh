    在接下来的几条规则中，我们将为导航栏添加样式和一些动画。我在此处也添加了一些高级代码，以向你展示如何使用 CSS 为你的元素添加动画。我们在 CSS 规则中使用的这些高级代码，目的是让你对通过
    CSS 的力量可以创建的可能效果有更好的理解。至于百分比，只要知道这些数字是我通过尝试错误得出的。因此，在你设计自己的页面时，你将尝试不同的值，直到得到你想要的结果。这只需要一点简单的数学计算。我们知道将
    `body` 设置为浏览器窗口的 100%。因此，当我们用百分比来调整元素大小时，很容易计算出你想让每个元素占据多少百分比的比例，而不会超过 100%。我所说的尝试错误就是不断调整这些值。此外，由于我们的按钮是指向其他页面的链接，因此我们的字体样式将在创建链接样式规则时进行。现在我们对按钮本身进行样式设置。所以请将此规则添加到你的
    `stylesheet.css` 中：


    ```css

    .button {

    border-radius: 7px;

    background-color: blue;

    width: 19%;

    height: auto; /*自动适应高度到文本大小.*/

    margin: 1% .5%; /*1% 顶部和底部，.5% 左右。 */

    float: left;  /*左浮动以便它们并排显示。*/

    -webkit-transition:-webkit-transform 2s, background 2s;

    -ms-transition:-webkit-transform 2s, background 2s;

    -moz-transition:-webkit-transform 2s, background 2s;

    -o-transition:-webkit-transform 2s, background 2s;

    }

    ```


    - `.button`: 我们开始编写 `.button` 类选择器。

    - `background-color: blue;`: 将按钮的背景颜色设置为蓝色。

    - `width: 19%;`: 给按钮 19% 的宽度，因为我们有五个按钮，并且希望在它们之间留一点边距。

    - `height: auto;`: 设置按钮的高度以适应文本的大小。

    - `margin: 1% .5%;`: 这里是另一种简写方式。在这条规则中，我们将顶部和底部的边距设置为 1%，左右两侧（按钮之间的空间）设置为 .5%。所以在这里你可以看到为什么我们的宽度值是
    19% 而不是 20%。因为我们希望在按钮之间有 .5% 的边距。在两个边距相加后，最终结果将是 1%。

    - `float: left;`: 我们在按钮上使用 `float` 属性，以便它们并排显示。

    - 接下来的四行代码是在设置我们的动画。这基本上是重复了四次的一行代码，以确保代码在不同浏览器之间的兼容性。为了简化这段高级代码，我们告诉浏览器我们要进行某种变换，并让它花费
    2 秒来完成过渡。我们还将更改背景颜色，同样我们也希望它花费 2 秒来完成。这将为我们提供一个从一种颜色到另一种颜色的漂亮渐变变换，耗时 2 秒。请注意，你可以更改过渡所需的时间。例如，半秒钟就是
    .5s。我们创建的下一条规则将更好地解释我们在这里所做的事情。


    现在我们将鼠标悬停在按钮上为它添加一些样式，这将更好地解释我们 `.button` 规则中的过渡（transition）和变换（transform）代码。在你的
    `.button` 规则下方添加此新规则：


    ```css

    .button:hover {

    -webkit-transform:rotate(360deg);

    -ms-transform:rotate(360deg);

    -moz-transform:rotate(360deg);

    -o-transform:rotate(360deg);

    background: red;

    }

    ```


    - `.button:hover`: 我们有另一个 `.button` 规则。这次我们添加了 `:hover` 选择器。这个 `:hover` 选择器可以用许多不同的
    CSS 规则。当用户将鼠标悬停在特定元素上时，你只需对 `:hover` 选择器之前的规则进行样式设置。确保选择器名称中没有空格。所以我们创建这条规则是为了在鼠标悬停在其中一个按钮上方时发生某些变化。

    - `transform:rotate(360deg);`: 这是我们希望在鼠标悬停在按钮上发生的情况之一。我们希望它旋转 360 度。我们在 `.button`
    选择器中指定了希望这个过渡花费 2 秒。在这里我们也添加了代码以确保与其他浏览器的兼容性。

    - `background: red;`: 这是我们想要的第二个效果。我们希望背景在悬停时从蓝色变为红色。在我们的 `.button` 规则中，我们最初将按钮颜色设置为蓝色，并指定了希望这个过渡也花费
    2 秒。所以现在我们动画的效果是：我们有一个蓝色按钮，当鼠标悬停时时，它将旋转 360 度，并同时以渐变方式颜色变为红色。这将在 2 秒内完成。


    现在我们要为链接设置样式。方法是为我们的锚点标签（anchor）创建一个 CSS 规则。在 `.button:hover` 规则之后添加此规则：


    ```css

    a {

    text-decoration: none;

    color: white;

    }

    ```


    - `a`: 我们为锚点标签 `a` 创建选择器。

    - `text-decoration: none;`: 去除下划线。

    - `color: white;`: 将字体颜色设置为白色。


    ```css

    a:hover {

    color: black;

    }

    ```


    - `a:hover`: 当鼠标悬停时设置链接样式。

    - `color: black;`: 悬停时颜色改为黑色。


    ### 更多内容的样式


    我们完成了导航的样式和动画。现在开始处理其他内容。添加此规则：


    ```css

    img {

    max-width: 100%;

    margin: 10px;

    }

    ```


    - `img`: 这里我们为 `img` 元素创建一个规则。我们所做的只是告诉浏览器图片永远不要超过 100%。这是一个安全规则，因为我们的布局将是响应式的，我们希望内容能够调整大小。并且给图片设置了
    10 像素的边距，以便它不会与其他元素挤在一起。


    ```css

    h2 {

    color: blue;

    text-align: center;

    }

    ```


    - `h2`: 这里我们将所有 `h2` 元素的字体颜色设置为蓝色。并让文本居中。- 如果你想为顶部标题设置样式，请添加一个 h4 规则。


    ```css

    .subHeading {

    font-size: 60%;

    font-style: italic;

    font-weight: bold;

    text-align: right;

    }

    ```


    - `.subHeading`: 我们为 `.subHeading` 类创建一个规则。

    - `font-size: 60%;`: 我们希望子标题的字体大小为我们在 `body` 规则中指定的原始默认大小的 60%。因此它将比默认大小小 40%。

    - `font-style: italic;`: 让我们的子标题字体变为斜体。

    - `font-weight: bold;`: 并且让它加粗。

    - `text-align: right;`: 最后我们将文本右对齐。


    ```css

    p {

    text-indent: 20px;

    }

    ```


    - `p`: 我们在这里所做的只是给 `p` 元素设置了 20 像素的缩进。


    ### 主内容的样式设置、调整和定位


    好了，现在我们将开始处理内容区域的所有样式、大小和定位。我们将从 `topContent` 类开始。添加此代码：


    ```css

    .topContent {

    background-color: white;

    color: black;

    padding: 3% 5%;

    margin-top: 20px;

    border-radius: 5px;

    -moz-border-radius: 5px;

    -webkit-border-radius: 5px;

    }

    ```


