  trans: "\n\n- `</p>` 被称为结束标签或闭合标签（注意添加了正斜杠 `/`）。这告诉浏览器这是一个结束标签，并继续处理下一个元素。\n- 整个代码，即开始标签、内容和结束标签，被称为一个元素。\n\
    \n此外，标签不区分大小写。因此，`<body>` 和 `<BODY>` 对浏览器来说含义完全相同。最佳实践是在标签中使用小写字母。当你准备创建一个元素时，先同时写出开始标签和结束标签，然后再填充内容。这样你就不会忘记闭合它。浏览器会从上到下读取你的\
    \ HTML，因此你不希望标签相互交叉。缩进是组织代码的好方法，我们稍后会详细讨论。`notepad++` 的另一个好处是，如果你点击一个标签，它会高亮显示与之关联的另一个标签。同样，当我们进入实际编码时，这会更有意义。标签也有几种不同的类型，但这是最常见的一种。\n\
    \n## 标签属性\n\nHTML 标签可以拥有属性。属性是它所在标签的修饰符。它们总是放在开始标签中，通常有一个名称和一个“值”。例如：\n\n`<p align=\"\
    center\">本段中的文本居中对齐。</p>`\n\n- 这个属性的名称是 `align`。然后我们添加一个等号 `=`。\n- 值是 `\"center\"\
    `。并且值总是放在双引号内。\n- 当该文本在网页上显示时，此属性会使标签之间的文本居中对齐。\n- 因此，你是在告诉浏览器，当显示这段文本时，你希望它居中在页面中间。\n\
    \n请注意，结束标签不包含属性的任何部分。属性只出现在开始标签中，绝不会出现在结束标签中。而且标签可以有多个属性，你将在本书后面看到这一点。\n\n###\
    \ 第一章测验\n\n1. 什么是 HTML？\n2. 什么是标签和元素？\n3. 开始标签和结束标签有什么区别？\n4. 在任何 HTML 文档中，你写的第一行是什么？\n\
    5. 标签属性有什么作用？\n\n## 第二章：开始\n\n好了，现在你大概了解了我们要处理的内容，我们可以开始了。我希望你做的第一件事是（这样你就不必在几章后再做）：转到你的桌面，右键单击，创建一个新文件夹。将其命名为\
    \ `website`。这就是你在制作网站时设置网页、图片、视频等的方式。所以我们不妨从现在开始。希望你已经下载了 `notepad++`，因为它会有所帮助。相信我，你以后会感谢我的。创建好\
    \ `website` 文件夹后，打开 `notepad++` 或 `notepad`（取决于你决定使用哪个）。从顶部菜单中点击 `File`，然后点击 `Save\
    \ as`。现在，将你的新页面保存为 `index.html`。这最终将成为你网站的主页。但现在我们将用它来学习。别忘了添加 `.html`。这非常重要，因为你的浏览器需要知道这一点。它不能是\
    \ `.txt` 或任何其他文件格式。\n\n### 创建你的第一个网页\n\n那么，让我们开始吧。在文本编辑器中输入以下文本。然后我们将逐部分分解。记住在\
    \ HTML 标签中使用小写字母。\n\n```html\n<!doctype html>\n<html>\n<head><title>Main Page</title></head>\
    \ \n<body>\n</body>\n</html>\n```\n\n- 就是这样。这就是你创建每个 HTML 页面时都会使用的相同代码。你只需添加任何你想要的额外内容。\n\
    - `<!doctype html>` 这就是你已知的文档类型声明，它将永远是你为每个 HTML 页面编写的第一行。\n- `<html>` 开始 HTML\
    \ 标签。这个标签告诉浏览器，你放在这个标签及其结束标签之间的所有内容都是 HTML 代码。\n- `<head><title>Main Page</title></head>`\
    \ 这些是你的开始和结束 `head` 标签以及 `title` 标签。我想向你展示它们可以像这样输入，作为一个例子。这里的 `title` 标签可以被视为嵌套元素或嵌套标签，因为它们嵌套在\
    \ `head` 标签内部。就像 `body` 元素嵌套在 `html` 元素内部一样。记住，HTML 文档是从上到下读取的，所以浏览器可以理解这一点。但更好、更清晰的写法是：\n\
    \n```html\n<head>\n    <title>Main Page</title>\n</head>\n```\n\n这里有几件事需要说明。注意我是如何缩进\
    \ `title` 元素行的。缩进代码有助于保持代码更有条理和可读性，尤其是当页面上有很多代码时。如何组织代码取决于你自己，但这是经验丰富的编码者可能会采用的方式。现在回到标签。此外，你会听到编码者以不同的方式称呼\
    \ `<title>Main Page</title>`。他们可能称之为标签、元素，甚至标签元素。在本书后面，当我们有两个标签且中间有内容时，我会将其称为元素。但为了学习目的，我现在会同时称其为标签和/或元素。好的，`head`\
    \ 标签用于几个方面。首先，像上面的例子一样，用于存放页面标题。它们还用于其他事情，比如搜索引擎的关键词、元数据等。我们稍后会讨论这些。目前，它们只是存放我们页面的\
    \ `title` 元素。\n\n- 然后我们有 `title` 标签。我们在这里输入的标题 `Main Page` 将是搜索引擎中显示的可点击链接。当你的页面在互联网上被查看时，它也会出现在浏览器左上角的小标签上。标题\
    \ `Main Page` 只是一个例子。你应该在这里放一些能描述你页面的内容。我们稍后会详细讨论。\n- `<body></body>` 标签是你将要输入\
    \ 99% 代码的地方。你放在这两个标签之间的所有内容都是网页浏览者会看到的。因此，所有文本、图片、菜单等都将放在这里。\n- 最后，我们添加结束 HTML\
    \ 标签 `</html>`。这告诉浏览器这是我们的 HTML 文档的结尾。基本上意味着我们网页的结束。\n\n就像我上面说的，这是互联网上每个网页的基本框架。\n\
    \n### 向页面添加一些内容\n\n让我们向 HTML 文档添加一些内容，这样当我们在浏览器中运行时，就能看到一些东西。现在如果我们运行它，页面将是空的。所以，将以下内容添加到上面练习的代码中。\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n    <title>Main Page</title>\n</head>\
    \ \n<body>\n    <h1>欢迎来到我的第一个网页！</h1>\n    <p>这将会非常震撼！！！！</p>\n    <p>哦，是的   \
    \         它确实如此。</p>\n</body>\n</html>\n```\n\n输入新代码后，确保保存它。你应该已经将页面保存为 `index.html`，所以现在编辑代码后只需点击保存即可。每次更改代码后，都必须重新保存，才能在浏览器中看到更改生效。现在，在浏览器中运行你的网页。在文本编辑器的顶部菜单中，点击\
    \ `Run`，然后如果你使用的互联网浏览器是 Google Chrome，则点击 `Launch in Chrome`。如果你使用不同的浏览器，如 Internet\
    \ Explorer 或 Mozilla Firefox，则选择 `Launch in` 其中之一。请注意，如果你想在该浏览器中运行代码，必须已下载该浏览器。这引出了我想讨论的一点。在测试或进行更改时，最好至少在两个浏览器中运行代码。我使用\
    \ Google Chrome 和 Internet Explorer 来测试我的代码。原因是两个不同的浏览器可能不会以相同的方式显示你的网页。在这种情况下，你可能需要稍微更改代码以获得相同的结果。而且，在问题发生时及时发现这些小问题，比一次性清理一大堆代码要好得多。因此，一个好的习惯是经常保存代码，并偶尔在几个浏览器中运行它。\n\
    \n"
- fmt: '

    So hopefully you successfully ran your HTML in a browser and can see your web
    page with a header and two lines of text. You should have also noticed that I
    took the `head` and `title` elements and put them on their own lines. Just like
    in the above examples you could have entered them all on one line or like in they
    are in this example. It''s up to you. I have introduced two tags here.


    - `<h1>Welcome to my first web page!</h1>` - This is a `h1` element. And as you
    can see it makes the text bold and increases the size. There are 6 heading elements
    you can use and I will show you the examples in a minute.

    - `<p>This is going to be epic!!!!</p> <p>Oh, yes it is.</p>` - And these are
    paragraph elements. You will use this element very often for anything from one
    line of text to an entire paragraph. As you probably have noticed even though
    we added a whole bunch of spaces in between the words yes and it in the second
    paragraph the browser displayed the text with only one space in between each word.
    It does this by default. All of these spaces are called white-space and your browser
    will ignore any extra spacing unless you specify that you want the extra spaces.
    There are a few ways to do that and we''ll get into that later. One other thing
    you may have noticed here is that after the first paragraph we have a line break
    just like if you hit return on your keyboard and then the next paragraph starts.
    The `p` element does this automatically. There are ways to manipulate line breaking,
    spacing, indenting, and so on. But I wanted to point out that with the `p` element
    you don''t have to worry about including a line break yourself in between your
    paragraphs.


    ## Examples Of The Heading Elements


    In your text editor underneath the second `p` element add this code to see the
    six available default headings:


    ```html

    <h1>Heading 1</h1>

    <h2>Heading 2</h2>

    <h3>Heading 3</h3>

    <h4>Heading 4</h4>

    <h5>Heading 5</h5>

    <h6>Heading 6</h6>

    ```


    Now save your work and run it in the browser again. If you kept your browser window
    open you can just re-save your HTML and hit the refresh button to see the new
    stuff we just added. You should see the six different headings displayed. Also
    there was a line break in between each one. Again that''s done by the browser
    automatically. Heading 1 has the biggest and boldest font. They decrease in size
    all the way down to Heading 6. When we get into some more advanced stuff and start
    using CSS we will be able to change these default sizes. So for example, we will
    be able to use the `<h1></h1>` element many times and have each of the headings
    displayed in different sizes if we wanted to. This control over the elements is
    one of the ways to make your pages unique. Experienced coder''s consider it standard
    to use the `h1` element at least once on every page. I also want to point out
    early on in this book here that the HTML content we will be creating over the
    next eight to nine chapters or so is what we''re going to be using when we start
    learning how to style. So your gonna want to keep the elements you add to your
    page for now. Your page will start looking a little sloppy but were only using
    it for learning purposes and later on we will be creating an actual website layout
    that is usable and looks good.


    ### Quiz Chapter 2


    1. How does your browser read HTML?

    2. Which set of tags or element do we put all of our behind the scenes directions
    for the browser in?

    3. What happens to your text if you add a bunch of spaces in between two words
    in the text editor when it is rendered and displayed in the browser window?

    4. Why is it good to save and run your code in multiple browsers often?


    ## Chapter 3: HTML comments and special/escape characters


    As you build your web page your HTML document will start to get pretty long. A
    good way to keep track of things is by adding comments. Comments that you add
    are only visible to you in your text editor. They will not display on your page
    and are just their to organize or remind yourself to do something, etc. They can
    also be used to debug problems in your code. If you have a section of code that
    you think may be causing an issue, You can add comment code around it so that
    the browser will ignore whatever code is inside. To add a Comment to your code
    you would enter it like this:


    ```html

    <!--Added a unordered list to my news section. July 15, 2015-->

    ```


    These symbols, `<!-- -->` tell the browser that what''s inside is a comment and
    should not be displayed. You add your comment in between the hyphens/dashes. If
    you put this comment somewhere inside of the `body` element and are using `notepad++`
    you can see that it changed color recognizing that this is a comment. This is
    one of those reasons why I like to use `notepad++` or `TextWrangler`. And I''m
    sure you''ve noticed how it highlighted the other tags, etc. with different colors
    depending on what type of content they were. Regular notepad is just black and
    white. And that''s what makes it harder to read and find things even for experienced
    coders. When you get more experienced you can play around with the settings in
    your text editor to use different colors and fonts. Among many other things.


    And if you save and run in the browser you can see that it won''t display this
    text. You can add as many comments as you want. If you ever work on a project
    with someone else you can also use this to tell them about changes you''ve made
    or something that you want them to do. To make the browser ignore a portion of
    your code, All that you would need to do is add the beginning comment code `<!--`
    before the portion you want to ignore and the ending comment code `-->` right
    after the end of the portion. Everything inside is now considered a comment and
    will not be displayed on your page. It will also change color telling you that
    it recognizes that this is a comment. You can make the browser ignore one or multiple
    things at once. This is a good tool for finding problem code.


    ### Special/Escape Characters


    There may be times where you need to add some extra spaces for things like positioning
    an image with text around it the way you want. Or there might be some special
    characters that you need to include but you don''t want the browser to read the
    characters as HTML code. So I have a list below of how to put some of these character''s
    on your page without any problems. These codes may look complicated but they are
    really the only thing in HTML that isn''t plain English. And you can always do
    an internet search for an HTML code if you ever forgot one. I still search for
    certain things because it''s impossible to memorize everything. You can just search
    for something like "How to add multiple spaces in HTML?" or do a search for them
    all and just print them out or save them to your computer. It''s up to you. The
    codes I added below are the most commonly used.


    - `&nbsp;` You use this code to add a space whether it''s between a word or to
    create some space in between an image and nearby text. To add multiple spaces,
    Simply add the code multiple times. For example to get three spaces in this line
    of text you would write it like this: `<p>This line has &nbsp;&nbsp;&nbsp; three
    spaces in it.</p>`. You should also notice when you enter one of these codes in
    your text editor correctly that the code will italicize.

    - `&amp;` To add an (&) ampersand symbol. `<p>Tim &amp; Mike went fishing.</p>`.
    The result would be. Tim & Mike went fishing.

    - `&lt;` To add a < less than sign. `<p>14 is &lt; 20.</p>`. The result would
    be. 14 is < 20.

    - `&gt;` To add a > greater than sign. `<p>20 is &gt; 14.</p>`. The result would
    be. 20 is > 14.

    - `&#63;` To add a ?. This is because the question mark can be confused with some
    programming language codes. In most cases you could just type the `?` and it would
    display properly. But if you want to make sure the browser doesn''t get confused
    you can use this code in place of the question mark.

    - `&#8482;` To add a trademark Tm symbol.

    - `&copy;` To add a copyright © symbol.


