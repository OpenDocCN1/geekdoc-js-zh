  trans: "\n\n![](img/00003.jpeg)\n\n# HTML, CSS 网站开发与设计实训练营\n\n从完全初学者到新手阶段均适用。学习如何像专业人士一样快速编程，最快仅需一天！额外赠送：我们将设计一个响应式网站布局！\n\
    \nClear Coded Programming（清晰代码编程）\n\n## 法律信息\n\n版权所有 Clear Coded Programming。全球保留版权。\n\
    \n未经作者许可，不得复制或转载本书的任何部分。\n\n责任限制与免责声明\n\n尽管作者和出版者已尽力确保书中的信息在发布/印刷时是准确的，但作者和出版者对于因错误或遗漏导致的任何损失、损害或中断（无论此类错误或遗漏是由于疏忽、事故还是其他原因引起），均不承担且特此否认任何责任。书中的信息按“原样”分发，不提供任何保证或担保。对于因本书指令或书中描述的计算机软件、服务和产品直接或间接引起或声称损失或损害，作者和出版者不对任何个人或实体承担任何责任。本书旨在教学和娱乐读者。作者和出版者不保证书中内容没有错误，且不承担任何责任。作者和出版者不对书中内容的准确性和完整性做出任何陈述，并特别否认任何特定用途的适销性暗示担保，在任何情况下均不对利润损失或任何其他商业损害（包括但不限于特殊的、间带的、性的或其他损害）承担责任。\n\
    \n商标\n\n书中识别的产品名称、软件和服务均为其各自持有者为人知的商标、注册商标或服务标记。书中识别的所有产品名称、软件和服务均仅以编辑形式出现，仅为了所标识公司的利益。作者和出版者无侵犯商标的意图。使用任何标记产品名称、软件或服务均不表示对上述公司的任何形式的支持或附属关系。本书的作者和出版者与书中提到的任何产品、软件或服务均无关联。\n\
    \n## 谁应该读这本书？\n\n这本书非常适合对构建和设计自己独特的奇妙网站感兴趣的人。它的设计旨在让完全初学者或新手编程人员通过一个简单的循序系统，快速获得像专业人士一样快速编程的能力。书中的练习短小且非常高效。你将在阅读本书的前\
    \ 20 分钟内创建出你的第一个基础网页并开始向其中添加内容。在书中，我们涵盖了基础 HTML 和 CSS，以及一些更常用的内容。我们还处理了一些动画代码和目前流行的设计。我们讨论了如何将你的网站发布到互联网，以及根据你制作的网站类型最佳实现方法。你将学习经验网页开发人员和设计师使用的技术、如何创建用户输入表、什么是元标记（meta\
    \ tags）以及你可以用它们做什么、什么是盒模型、如何将你的网页划分为部分、如何重用代码使子页创建变得快速快捷、实现相同功能的不同系统、在页面上放置内容的不同方法、如何让你的网站在搜索引擎排名中领先、完成本书后你应该研究什么。在书最后，我们创建一个可以使用且自定义的响应式网站布局，你可以对其随心所欲。我创建和设计网站已有超过\
    \ 10 年。在书中，我分享了我认为快速学习 HTML 和 CSS 的极佳系统，特别是对于完全初学者。我希望当我第一次接触网页开发时有这样一本书。在读本书之前我认为应该涵盖的另一点是：请跟随练习并将代码输入你的编辑器。听我的，这样做你会学得快十倍。我们将讨论你应该使用什么编辑器。你已经拥有了在计算机上构建和设计网站所需的一切，但有一些优秀的免费编辑器可以下载，它们会给你带来很多。我对这本书感到非常兴奋，迫待看到你们创作什么样的网站。如果你读了这本书，请留下反馈。我会考虑所有的反馈，以确保未来为你提供最好的内容。祝你成为网页开发者和设计师的之旅顺利。\n\
    \n## 目录\n\n-   法律信息\n-   谁应该读这本书？\n-   第 1 章：什么是 HTML？概览\n    -   学习 HTML 和 CSS\
