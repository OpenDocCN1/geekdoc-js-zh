    You can add as many rows as you want. Your table could be 5 columns wide and 200
    rows long. It''s up to you. Before we finish up with this table exercise I want
    to introduce you to one more HTML element that you can use for your tables. And
    that is the `caption` element. This just defines a caption for our table. Add
    this code immediately after the opening `table` tag line:


    ```html

    <caption>Foods</caption>

    ```


    Now if you''ll see that our table has a centered caption right above the top border.
    You might be thinking why did we put this code after we started the table if HTML
    is read from top to bottom. And that is because this element is specifically embedded
    into our `table` element. So if we moved our table to a different position the
    `caption` element would move with it. But if we used an `<h1>` element for example
    to create a heading for our table, we would have to put that immediately before
    our opening `<table>` tag. Then we would have to add code to center it and if
    we moved our table position on our page we also have to move our `<h1>` element
    as well. The `caption` tag specifically defines a table caption. Also it can only
    be added once per table. That''s about it for this chapter and again when we get
    into CSS we''ll be able to align the text in our table cells, color the table
    border, change the font style and many other things.


    ## Quiz Chapter 6


    1. What is the main difference between an unordered list and an ordered list?

    2. What tags do you use to add a list item?

    3. What are each of these tags used for? `<table>`, `<th>`, `<tr>`, `<td>`.

    4. In what direction is a table row displayed?

    5. What is the use of the `caption` element and where do you enter the code for
    it?


    ## Chapter 7: Links


    In this chapter were gonna be talking about a few of the ways to use links in
    our web pages. But first let''s add two headings and two paragraphs to our page
    to make it a little larger so that this exercise will make more sense. The text
    in the paragraphs below is just for example purposes. You can put whatever type
    of content that you want in them but I wouldn''t worry about it too much because
    we are going to delete these later before we make an actual website. Use copy
    and paste for the paragraph content to save some time.


    Also note that when entering large groups of text into your text editor like this
    you can hit enter/return when your text is coming close to the right side of the
    screen. Remember HTML is gonna ignore all of the extra spacing so this is helpful
    in the way that you won''t have to scroll left and right constantly to see all
    of your code. You can keep all of your content in the normal size of the window.
    For example you can have your paragraph text all on one line even if it''s 25
    sentences long, but that would obviously be harder to read. Instead you spread
    the content over multiple lines so you can see it all at once. HTML will only
    add one space in between each word so it wouldn''t matter even if you skipped
    a bunch of lines.


    A little fun fact about text that is used as a placeholder: There is text called
    Lorem Ipsum that web developers will use to fill their web page with content like
    a placeholder until they put their own content in. It has been around and used
    for all different types of things since the 1500''s. Do an internet search for
    Lorem Ipsum to learn more about it.


    Add this code right after the table that you just created in chapter 6:


    ```html

    <h1>Gaming Stuff</h1>

    <p>This paragraph is all about gaming. This paragraph is all about gaming. This
    paragraph is all about gaming. This paragraph is all about gaming. This paragraph
    is all about gaming. This paragraph is all about gaming. This paragraph is all
    about gaming. This paragraph is all about gaming.</p>


    <h2>Gaming Accessories</h2>

    <p>This paragraph is all about gaming accessories. This paragraph is all about
    gaming accessories. This paragraph is all about gaming accessories. This paragraph
    is all about gaming accessories. This paragraph is all about gaming accessories.
    This paragraph is all about gaming accessories. This paragraph is all about gaming
    accessories. This paragraph is all about gaming accessories. This paragraph is
    all about gaming accessories. This paragraph is all about gaming accessories.
    This paragraph is all about gaming accessories. This paragraph is all about gaming
    accessories.</p>

    ```


    Now you should have enough content on your web page to simulate having a large
    one. In a case like that you might want to add a link to jump to a certain part
    of your page when it is clicked. For this example we''re just gonna create a link
    at the very end of the page that when clicked will take the user back to the top.
    Right before your closing `</body>` tag add this code:


    ```html

    <a href="#top">Back to Top</a>

    ```


    - `<a>`: This is called the anchor tag. It defines a hyperlink.

    - `href=`: This is a `href` attribute. This attribute gives the anchor tag a destination
    to link to.

    - `"#top"`: For the value of the `href` attribute we add our double quotes and
    a hatch tag. The hatch tag is what tells the anchor tag that this is going to
    be linking to something within this web page.

    - `Back to Top`: This text here is the actual link. It will be what the user will
    click on.

    - `</a>`: And finally we close out the anchor element.


    So now we have a link set up, but it won''t take us anywhere if we click on it
    right now. That is because we have to create another anchor tag in order for this
    tag to link to that one. Since we want to link back to the top of the page we
    will add our second anchor tag immediately after the opening `<body>` tag:


    ```html

    <a name="top"></a>

    ```


    - `<a>`: Again we start with an opening anchor tag.

    - `name=`: Then we have the `name` attribute. The value that we give to `name`
    will link up to the `#` hatch tag value that we specified in the first anchor.

    - `"top"`: And the value that we give it is `"top"`. This has to match your hatch
    tag value.

    - `</a>`: And we close the anchor element.


    If you save/run your page you will be able to scroll to the bottom of your page
    and click the Back to Top link. Note that if you wanted to jump to a certain paragraph
    for example you would first add an anchor to the opening tag of that specific
    element. So If we wanted to link to our Gaming Stuff heading, we would add our
    anchor here:


    ```html

    <h1><a name="gaming stuff article"></a>Gaming Stuff</h1>

    ```


    And then somewhere else on your page where you want to add your click-able link
    you add this:


    ```html

    <a href="#gaming stuff article">Click Me to go to Gaming Stuff</a>

    ```


    Don''t forget to add the `#` and also the text `Click Me to go to Gaming Stuff`
    here because if you don''t put in any text or image there won''t be anything for
    the user to click on. The link wouldn''t even be visible on your web page.

