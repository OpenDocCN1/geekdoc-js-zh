    will hold all of our new rules. Below are the rules that we have the new instructions
    in:


    @media only screen and (min-width: 150px) and (max-width: 600px){


    body {


    width: 91%;


    font-size: 90%;


    }


    .topHeader {


    height: auto;


    width: 100;


    }


    .button {


    width: 50%;


    margin: 1% 5%


    }


    img {


    max-width: 100%;


    margin: 10px;


    }


    .content {


    width: 100%;


    padding: 3% 5%;


    }


    .topRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .middleRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .bottomRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .mainFooter p{


    width: 108%;


    clear: both;


    }


    }


    Notice that there are two closing curly brackets at the end of this code. One
    is for closing the .mainFooter p element and the other is the closing curly bracket
    that holds all of our newly changed rules for the @media code. We''re not gonna
    get too deep into discussion about this. As you can see we have rules that we
    already created but down here in the responsive code section we specify the changes
    that we want to happen on these different target screen sizes. When designing
    a responsive website you would want to test your code on different devices. The
    changes that were made in the rules above were tweaked until I got the results
    that looked good. Really all that your changing in these rules is your sizing
    code. This way of developing will take some research and practice but I wanted
    to give you a responsive website layout in this book so that you can have a taste
    of the possibilities of HTML and CSS in the current stage it''s in now. Also before
    we end this part of the book you should know that the rules in the responsive
    code section only need to include the changed properties and values. The original
    code that you don''t want to change does not have to be included in this new set
    of rules. These new rules are just instructions to the browser of what changes
    that you want to happen for specific device screen sizes.


    Adding Content To Our Sub-Pages


    Now that we have completed the main page of your responsive website layout and
    added a bunch of styles, creating the content on your sub pages for your website
    is pretty simple. First you start with the basic framework of any web page and
    you copy and paste this into all of your other .html documents. You make any necessary
    changes to the meta data, etc. to fit that specific page. Below is the basic framework
    of any web page again without the meta data.


    <!doctype html>


    <head>


    <title>


    </title>


    </head>


    <body>


    </body>


    </html>


    When you have all of your basic HTML setup for each page you can just copy and
    paste elements with or without their div''s, classes, etc. and make any changes
    to the content that you want. For example if you wanted your pages laid out in
    the same way you could copy and paste all of your mainContent and rightSidebar
    content to your sub pages and change the text in the paragraphs and headers. If
    you include the class your new content will use all of the styles for those CSS
    rules. You could also create new classes with different sets of CSS rules to makes
    your pages different. There are so many ways to develop and design and now it''s
    up to you. Now is the time where you go off on your own and experiment with all
    of the new HTML and CSS tools that you have learned in this book. Have fun and
    don''t be afraid to try new things with the code. I''m excited to see what new
    ideas that you come up with.


    Final Quiz Chapter 23


    1.What are some of the uses of meta tags?


    2.What are two common uses for a div?


    3.How do you create an external style sheet?


    4.What happens to an element that you floated left if there isn''t enough room
    for it to display it on the right side of another element?


    5.What is :hover used for?


    6.What does it mean to have a responsive or fluid website?


    7.What are a few of the things that are important when sizing and positioning
    your content besides the float property?


    8.In simplest terms what is responsive CSS code used for?


    9.How is creating you sub-pages easier and faster?


    Chapter 24: Putting Your Website On The Internet


    Okay so you have completed your entire website and are happy with the results.
    How do you put your website live on the internet? Well you need to find a web
    host. There are many out there and a bunch of things to consider before choosing.
    A web host is basically in simplest terms a chunk of space on the internet where
    you upload your web pages to a web server. You can choose to go with free web
    hosting or paid web hosting. Depending on what type of website you have you might
    want to go with a paid web hosting service. These can run from about 2 dollars
    a month and up. Why would you want to pay for web hosting when you can get it
    for free? Well you will have more control over your website and a paid service
    can be way more reliable as far as things like the server down time. And that
    information is usually pretty available to you. Most web hosts will actually use
    this information in their advertisements. With a paid service you have more options
    as far as advertisements and things like that. If you plan on trying to earn money
    from advertisements on your page or if you have a business type website a paid
    service is probably the way to go. Free hosting is more for the hobby type website.
    You''ll find that with free web service the host will be able to in most cases
    put adds on your pages among other things that you wouldn''t make money from.
    They would and that''s one of the reasons why it is free. They are usually less
    reliable as well and you could have server down time for long periods. So it really
    depends on what type of website you have to put on the internet. I recommend making
    one or two practice sites first and going with a free host so that you can get
    an idea of how to work with them.'
