    ## 第 19 章 测验答案


    1. 从屏幕左侧一直延伸到右侧。并且它们会一个接一个地显示。


    2. 它们与其他周围元素并排显示。


    3. 块级元素会收缩以适应窗口，但保持在同一行。


    4. 行内元素只要有足够的空间就会保持在同一行。如果空间不足，大多数情况下它们会移到下一行。


    ## 第 20 章 测验答案


    1. 可接受的答案：

    ```

    float:none; float:left; float:right; float:initial; float:inherit;

    ```


    2. 将其从自然流中取出，并固定到屏幕的某个特定部分。


    3. 你可以让它们并排显示。


    4. 元素将保持固定在您指定的一个或多个方向上。


    5. 这是浏览器默认显示元素的方式。基本上是从屏幕左侧一直延伸到右侧，自上而下排列。


    ## 第 21 章 测验答案


    1. 它们以相同的方式定位，但固定定位的元素完全脱离自然流，并且不会移动。


    2. 绝对定位。


    3. `top:` 和 `left:` 是最常用的一组定位属性，`bottom:` 和 `right:` 是第二常用的一组。


    ## 第 22 章 测验答案


    1. 绝对定位相对于浏览器屏幕的顶部和左侧进行定位。相对定位相对于另一个元素进行定位。


    2. 在没有定位代码的情况下，元素默认会显示的位置。


    ## 第 23 章 最终测验答案


    1. 页面的描述、搜索引擎的关键词、告诉浏览器网站使用的语言类型，以及更多其他用途。


    2. 将页面划分为多个区域以便定位，并继承 CSS 样式。


    3. 在文本编辑器中创建一个新文件，并将其保存为 `.css` 文件。然后在 `.html` 页面的 `head` 元素中链接到这个文件。


    4. 它会显示在它下面，并靠左对齐。


    5. 用于对鼠标悬停的元素设置样式。


    6. 响应式或流式网站基本上意味着该网站兼容多种不同的屏幕尺寸，如手机、平板、笔记本电脑和电视屏幕。


    7. 宽度、外边距、内边距以及内容的大小。


    8. 为浏览器指定针对目标屏幕尺寸的大小和位置变化。


    9. 你可以复制粘贴许多元素；你创建的 CSS 代码可以在整个网站中重复使用；你可以复制粘贴代码并修改一些内容，从而创建一个全新的元素。


    ## 完成本书后该做什么


    现在你应该对 HTML 和 CSS 有了很好的理解。完成本书后最好的事情就是练习。还有更多的 HTML 元素可供你使用。你对代码的实践经验越多，记住的就越多，复制起来也越容易。尝试新事物并进行实验也很重要。看看你能想出什么。网页开发和设计有无限的可能性。进一步研究动画、特效和响应式网站开发是另一个好的起点。你还应该搜索流行或常见的
    HTML 和 CSS 代码。外面还有更多的代码。你不需要全部学会。即使是最专业的程序员也无法记住所有代码。这取决于你想要创建的内容。我们在本书中涵盖了几乎所有的基础代码和一些流行代码。但
    HTML 和 CSS 提供了如此多的工具，让你可以创建和设计几乎任何你能想象到的东西。另一件你可以研究的事情是 Bootstrap。搜索 Bootstrap
    网站以了解更多信息。描述 Bootstrap 最简单的方式是，它是一个可供你在网站中使用的不同代码语言的库。这个库会让复杂的代码变得简单得多。动画、表单验证、网站分区等，都是
    Bootstrap 可以极大帮助你的一些方面。不过，你首先需要对至少 HTML 和 CSS 有良好的掌握。所以，练习是关键。


    '
- fmt: '

    After you have enough HTML and CSS experience under your belt you should look
    into either JavaScript basics-then JQuery, or PHP. These programming languages
    can really make a big impact on your website. JavaScript is used more for things
    like making your pages interactive and PHP is a server side programming language.
    And what that means is that it is used for things like form validation on the
    server side and other hidden functions for your website that are done in the background
    from the web server that you upload your site too. Form validation is important
    in many ways especially if you plan on making a social media website. Things like
    validating a user name and password, survey answers to be processed, etc. are
    done with PHP. Look into each one a little further to see which one best fits
    what you want your site to be. These programming languages are similar in a lot
    of ways. And really aren''t too difficult to learn. If you look into learning
    JavaScript which is super popular for web development, You really only need to
    take a basic course on it. JQuery is basically a file that you download from the
    internet and put into your website folder. And what that does is simplifies very
    long complicated code down into simple tiny pieces of code that will do the same
    thing. JQuery is easy to learn and very fun. It''s really up to you and what you
    want to do. I recommend learning JavaScript basics and then JQuery first so that
    you can easily make your page user interactive and animated. Then you can check
    out PHP to give your website the ability to update on the fly. All of these things
    combined can make amazing dynamic professional websites that web developers and
    designers have just started creating recently. Don''t stress about how many things
    there are to know about web development. You already have all of the tools you
    need to make great websites. These programming languages are additional features
    that you can add. And there are many more. JavaScript, JQuery, and PHP are the
    most popular. When and if you do start learning a programming language you''ll
    see how similar some of the other languages are in many ways. And they really
    are fun to experiment with.


    So that''s it for this book. Good Luck on your journey of becoming a great web
    developer and designer. Thank you for choosing this book and I hope that you gained
    a lot from it. Please leave a review. Let me know what you think. Is there anything
    that you wanted to learn that I didn''t include? Anything you didn''t like? Was
    the layout of the book easy to understand? What did you think about the quiz''s.
    If you have any recommendations please let me know so that I can provide you with
    the best content possible in the future. Again Thank you all so much. You don''t
    know how much it means to me.


    Best of luck,


    Clear Coded Programming

