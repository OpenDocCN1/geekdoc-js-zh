    # HTML Head 元素与 SEO


    ## Title 元素

    首先，让我们详细探讨一下 `title` 元素。你可能还记得，它实际上并不会显示在你的网页正文中。事实上，你放入 `head` 元素中的所有内容，要么是给浏览器的指令，要么是关于页面的信息，旨在帮助你的页面在搜索引擎中获得更好的排名。


    其目标是让你的页面显示在搜索引擎结果的前列。当用户访问你的页面时，`title` 元素会显示在浏览器左上角出现的小标签页上。此外，当有人搜索与你页面内容类似的内容时，标题也会成为指向你网页的实际链接。


    例如，如果有人搜索“预算有限的晚餐食谱”，这个页面可能会在他们的搜索结果中排名较高。使用良好的关键词，以一种能吸引人们访问你网站的方式来措辞标题是非常重要的。在上面的例子中，目标关键词是“晚餐”、“食谱”和“预算”。你应该根据每个页面包含的具体内容，为网站上的每个页面确定一个合适的标题。


    ## Meta 标签

    Meta 标签包含关于网页的元数据（meta data）。


    ### Description Meta 标签

    ```html

    <meta name="description" content="Two or three really descriptive sentences."/>

    ```

    此标签用于网页的描述。这里输入的信息是用户在搜索结果的可点击链接下方看到的内容。你应该为网站的每个页面添加特定的描述，因为搜索引擎可能会显示任何页面，而不仅仅是首页。


    建议使用两到三个能很好地描述页面内容的句子，因为搜索引擎会在几行之后截断文本。如果你没有输入 meta 描述，浏览器会自动从页面中提取相关文本来生成一个。


    ### Keywords Meta 标签

    ```html

    <meta name="keywords" content="keyword, keyword keywords, keyword"/>

    ```

    这是关键词 meta 标签。虽然 Google 表示由于滥用问题，他们不再使用此元数据来查找相关页面，但其他搜索引擎仍然在使用。


    为了优化排名，请输入 6 到 8 个描述你页面的词语或短语（用逗号分隔）。例如：`content="quick recipes, great tasting,
    cooking, videos, family meals, 30 minute dinners"`。避免添加与内容无关的关键词。


    ### Language Meta 标签

    ```html

    <meta http-equiv="content-language" content="en-us"/>

    ```

    此标签指定了网站编写时使用的语言。在 `content` 属性中，你需要添加语言代码。例如，`en-us` 告诉浏览器该网站使用的是美国英语。


    ## 最佳实践与测试

    确保所有 meta 标签和标题信息输入正确；缺失一个 `"` 符号可能会导致你的元数据无法显示。


    - **字符限制**：尽量将标题和描述分别控制在 65 个字符以内（包括空格）。

    - **测试**：在你将网站上传到 Web 主机之前，无法查看这些数据。

    - **反向链接**：搜索引擎还会寻找从其他高质量网站指向你网站的链接。与类似网站的创建者建立关系并交换链接可以提高你的排名。


    ## 第 10 章测验

    1. 在 HTML 文档中使用 meta 标签的主要目的是什么？

    2. 网站关键词最重要的放置位置在哪里？

    3. 你的标题和描述应该有多长？

    4. 所有 meta 标签都嵌入在哪个元素内部？

    5. 你应该在每一个 HTML 页面上都放置 meta 标签吗？为什么？

    6. 美国英语的语言代码是什么？


