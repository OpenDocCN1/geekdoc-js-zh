    # 响应式网页设计与部署


    ## 媒体查询 (Media Queries)


    既然我们已经用注释划分了各个部分，让我们开始添加 CSS 规则，以便页面在较小的屏幕上查看时发生变化。这里需要了解的是，针对所有不同的屏幕尺寸，你可能有很多这样的部分。这属于高级
    CSS，而且非常新。基本上，由于可以在许多设备和屏幕尺寸上查看网页，这是从现在起所有网站制作或应该这样制作的方式。单关于这一个主题就可以写一整本书。如果你想了解更多信息，可能想查看专门关于开发响应式网站的书籍。好了，在你的注释行下方添加此代码：


    ```css

    @media only screen and (min-width: 150px) and (max-width: 600px){


    }

    ```


    上面的代码是在告诉浏览器关于我们目标最小和最大设备屏幕宽的信息。关于这有很多需要了解的，仅凭这本书无法全部解释。我们所有包含更改的 CSS 规则都将放在上面代码中两个
    `{ }` 大括号之间。它们将包含我们所有的新规则。下面是我们包含新指令的规则：


    ```css

    @media only screen and (min-width: 150px) and (max-width: 600px){


    body {


    width: 91%;


    font-size: 90%;


    }


    .topHeader {


    height: auto;


    width: 100;


    }


    .button {


    width: 50%;


    margin: 1% 5%


    }


    img {


    max-width: 100%;


    margin: 10px;


    }


    .content {


    width: 100%;


    padding: 3% 5%;


    }


    .topRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .middleRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .bottomRightSidebar {


    width: 100%;


    margin: 1% 0% 1% 4%;


    }


    .mainFooter p{


    width: 108%;


    clear: both;


    }


    }

    ```


    注意这段代码末尾有两个闭合大括号。一个用于关闭 `.mainFooter p` 元素，另一个是包含我们针对 `@media` 代码的所有新更改规则的闭合大括号。我们对此不会进行深入讨论。如你所见，我们已经创建了一些规则，但在下方的响应式代码部分，我们指定了希望在这些不同目标屏幕尺寸上更改。在设计响应式网站时，你会希望在不同的设备上测试你的代码。上述规则中所做的更改经过不断调整，直到我得到了看起来良好的结果。实际上，你在这些规则中更改的所有内容都是你的尺寸代码。这种开发方法需要一些研究和实践，但我想在书中为你提供一个响应式网页布局，以便你能够领略
    HTML 和 CSS 在当前阶段所拥有的可能性。此外，在结束这本书的这部分之前，你应该知道，响应式代码部分中的规则只需要包含更改的属性和值。你不想更改的原始代码不需要包含在这一组新规则中。这些新规则只是告诉浏览器你希望在特定设备屏幕尺寸上发生哪些更改。


    ## 在我们的子页面中添加内容


    现在我们已经完成了你的响应式网页布局的主页，并添加了许多样式，为你的网站子页面创建内容就非常简单了。首先，你从任何网页的基本框架开始，并将其复制粘贴到所有其他
    .html 文档中。对元数据（meta data）等进行任何必要的更改以适应特定页面。下面再次是任何网页的基本框架，但不包含元数据。


    ```html

    <!doctype html>

    <head>

    <title>

    </title>

    </head>

    <body>

    </body>

    </html>

    ```


    当你完成每个页面的所有基础 HTML 设置后，你只需要复制粘贴带有或不带有其 `div`、类名（classes）等的元素，并对你想要更改的内容进行任何修改。例如，如果你希望页面以相同的方式布局，你可以将所有的
    `mainContent` 和 `rightSidebar` 内容复制粘贴到你的子页面中，并更改段落和标题中的文本。如果你包含了类名，你的新内容将使用那些
    CSS 规则的所有样式。你也可以创建具有不同一组 CSS 规则的新类，以使你的页面与众不同。开发和设计的方法有很多种，现在取决于你了。现在是你独立去尝试你已经在这书中学到的所有新
    HTML 和 CSS 工具的时候了。玩得开心，不要害怕用代码尝试新事物。我很期待看到你提出的新新想法。


    ## 第 23 章最终测试


    1. 元标签（meta tags）的某些用途是什么？

    2. `div` 的两个常见用途是什么？

    3. 如何创建外部样式表？

    4. 如果一个左浮动（floated left）的元素没有足够的空间让它在另一个元素的右侧显示，会发生什么？

    5. `:hover` 是做什么用的？

    6. 拥有响应式或流式网站意味着什么？

    7. 除了浮动（float）属性外，在调整内容尺寸和定位时有哪些重要事项？

    8. 从简单来说，响应式 CSS 是做什么的？

    9. 如何创建子页面变得更容易、更快？


    ## 第 24 章：将你的网站发布到互联网


    好了，你已经完成了整个网站并对结果感到满意。你如何将你的网站发布到互联网上？嗯，你需要一个 Web 主机（web host）。那里有很多选择，在选择之前有很多需要考虑的。Web
    主机基本上是互联网上的一块空间，你可以在那里将你的网页上传到 Web 服务器。你可以选择免费 Web 主机或付费 Web 主机。根据你网站的类型，你可能希望使用付费
    Web 主机服务。这些服务每月大约 2 美元起。既然可以免费获得，你为什么要为 Web 主机付费？嗯，你将对你的网站有更多控制权，而且付费服务在服务器停机等方面要可靠得多。而且这些信息通常对你是开放的。大多数
    Web 主机实际上会在他们的广告中使用这些信息。对于付费服务，在广告等方面你有更多选择。如果你计划通过页面上的广告获利，或者你有一个业务类型的网站，那么付费服务可能是更好的选择。免费主机更适合爱好类的网站。你会发现，对于免费
    Web 服务，主机大多数情况下可以在你的页面上放置广告，以及其他你无法从中获利的内容。他们会这样做，这也是它免费的原因之一。它们通常可靠性也较低，你可能会遇到长时间的服务器停机。因此，这真的取决于你要发布到互联网的是什么类型的网站。


