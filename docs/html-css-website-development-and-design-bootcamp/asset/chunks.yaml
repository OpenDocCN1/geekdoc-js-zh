- fmt: "\n# Chapter 19: Inline-block Elements\n\nThe `inline-block` element. Some\
    \ coders consider this useful and some consider it complicated and tricky. We\
    \ aren't going to use this property in this book but we should discuss it. The\
    \ most common use of displaying elements `inline-block` is to fix an issue that\
    \ coders will have when their page is viewed in Internet Explorer 6. And the issue\
    \ is margins, similar to things we discussed above. Even though I.E.6 is a very\
    \ old version of the browser, there are still some people out there that haven't\
    \ updated their browsers in a long time and are still using Internet Explorer\
    \ 6 so web developers will kind of try to trick the I.E. 6 browser into displaying\
    \ something `inline-block` but hide it from all of the other browsers that people\
    \ might be using. Basically something that is displayed `inline-block` is a mix\
    \ between both inline and block as the name suggests. It's a little bit inline\
    \ and little bit block. Using it in certain cases might give you good or bad results.\
    \ If you wanted to learn more about this element you could do a little research\
    \ on it to see some sample web pages that people have created with the `display:inline-block;`\
    \ property and value being used. And what it would look like using just inline\
    \ or just block. Any issue with a margin that might come up for you shouldn't\
    \ be too difficult to fix using the first two systems. If anything you might have\
    \ to play around with the margin values in CSS to get the result you want.\n\n\
    ## Quiz Chapter 19\n\n1. How is a block element displayed?\n2. How is a inline\
    \ element displayed?\n3. What happens when you re-size your browser screen with\
    \ block elements?\n4. What happens when you re-size your browser screen with a\
    \ bunch of inline elements on the same line?\n\n# Chapter 20: Floating Elements\
    \ Introduction and Positioning Part 2\n\nFloating elements allows you to pin elements\
    \ to different parts of the screen. It also makes it possible to display block\
    \ elements side by side. If you wanted to float one of your elements you would\
    \ have to add a `width: value;` and a `float: value;` to the CSS rule for the\
    \ element you want to affect. The values for the `float` property are `none`,\
    \ `left`, `right`, `initial`, and `inherit`. The main one we'll be using in this\
    \ book is `left`. Know that floating an element will remove it from the natural\
    \ flow that we talked about earlier. And the browser will kind of ignore the elements\
    \ that you float. This is how we could display block elements side by side. Because\
    \ if you floated an element to the `left` for example. The browser would take\
    \ the very next element and display it side by side with the floated element as\
    \ long as there is enough room to the `right`. It's kind of like the element is\
    \ invisible to the browser in a way. If you had some elements floated `left` and\
    \ some floated `right` on your page when you run it in your browser and re-size\
    \ your screen these elements will stay pinned in the area or direction that you\
    \ told them to. Also your browser will not automatically add margins to your floated\
    \ elements. You need to add them yourself. There are many benefits to the `float`\
    \ system. Floating is a little bit tricky but we'll clear up a lot of questions\
    \ in our website layout.\n\n## Quiz Chapter 20\n\n1. Name two properties and values\
    \ that you can use to float an element?\n2. What does floating an element do to\
    \ it?\n3. What is a benefit of floating block elements?\n4. What happens if you\
    \ re-size your web page that contains floated elements?\n5. What is the natural\
    \ flow?\n\n# Chapter 21: Absolute and Fixed Positioning\n\nLet's talk about two\
    \ more types of positioning for your content. These two systems are not used as\
    \ much anymore since the creation of responsive websites has become so popular\
    \ recently. But we need to go over them anyway.\n\n## Absolute Positioning\n\n\
    If we use absolute positioning to position an element we are telling the browser\
    \ exactly on the page where we want it displayed. We use the `position` property\
    \ and the value `absolute`. Then we give it either a `top` or `bottom` value,\
    \ and a `left` or `right` value. This can best be described in an example. Add\
    \ this code to your ordered list rule in your style sheet:\n\n```css\nol {\n \
    \   font-style: italic;\n    border: 2px solid red;\n    width: 100px;\n    position:\
    \ absolute;\n    top: 250px;\n    left: 450px;\n}\n```\n\n- `width: 100px;` First\
    \ we added a width to make our border for our list a little more realistic.\n\
    - `position: absolute;` And now we add our position property with a value of `absolute`.\n\
    - `top: 250px;` Here we are saying we want our ordered list to display 250 pixels\
    \ down from the top of our browser window. You could have also used the property\
    \ `bottom` here instead. In that case you would be saying display my ordered list\
    \ 250 pixels up from the bottom.\n- `left: 450px;` And finally we say also move\
    \ my ordered list 450 pixels from the left of the browser screen. Again you could\
    \ have used the `right` property here and positioned from the right. Most coders\
    \ use the `top` and `left` properties for this type of system.\n\nNow if you save/run\
    \ your page you'll see that your improved ordered list with a nicer border has\
    \ now jumped to a different part of the screen. And that is 250 pixels from the\
    \ top and 450 pixels from the left. It's important to know here that positioning\
    \ in this way removes the element from the natural flow similar to a floated element.\
    \ An absolute positioned element when moved to a position can overlap another\
    \ element on your page. As if it was laying on top of it. And you can use that\
    \ to your advantage design-wise in some ways but it is unlike a floated element\
    \ in the way that if you float an element it will still have some boundaries with\
    \ the other elements on the page. So your other elements will move accordingly\
    \ with the floated element and won't overlap. And if you re-size your browser\
    \ window you'll notice that your ordered list will not move from the position\
    \ you set because it is out of the natural flow. It is an inline element now.\
    \ Note that an element that you position absolutely will first position off of\
    \ a parent element that doesn't have a `static` position. You'll learn about `static`\
    \ positioning in the next chapter. If there is no such element which will likely\
    \ be the case then it will position off of HTML (the browser window) like with\
    \ our ordered list. If you position something and it didn't end up being in the\
    \ area that you want it to, It is very easy to adjust. Practice makes perfect\
    \ with positioning. And even very experienced coders will tweak their positions\
    \ many times when making a web page.\n\n## Fixed Positioning\n\nFixed positioning\
    \ is completely out of the natural flow. When you position an element this way\
    \ it will not move. Again the best way to describe this is by using an exercise:\
    \ Add this code to your h3 rule in your style sheet:\n\n```css\nh3 {\n    background-color:\
    \ gray;\n    border: 5px solid yellow;\n    padding: 25px;\n    margin: 30px;\n\
    \    width: 400px;\n    position: fixed;\n    top: 300px;\n    left: 450px;\n\
    }\n```\n\n- `width: 400px;` We gave it a width to size it a little better like\
    \ we did in the previous exercises.\n- `position: fixed;` The only difference\
    \ here is that we used the value `fixed` instead of `absolute`.\n- `top: 300px;`\
    \ We tell the browser that we want it 300 pixels from the top of the browser screen.\n\
    - `left: 450px;` And also 450 pixels from the left of the browser screen.\n"
