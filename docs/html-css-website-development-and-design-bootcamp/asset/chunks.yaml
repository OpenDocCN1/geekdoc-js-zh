  trans: "\n\n现在，在 `body` 元素内部，将以下代码添加到你的图像元素之后，然后我们将像往常一样将其逐一分解分析。\n\n```html\n<!doctype\
    \ html>\n<html>\n<head>\n<title>Main Page</title>\n</head> \n<body>\n<img src=\"\
    image.jpg\">\n <ul>\n <li>Football</li>\n <li>Baseball</li>\n <li>Basketball</li>\n\
    \ </ul>\n</body>\n</html>\n```\n\n- 第一行只是一个注释，是为了让你在练习使用注释方面有更多经验。\n- `<ul>` 这是无序列表的开始标签。\n\
    - `<li>Football</li>` 这是一个列表元素。它被放置在无序列表元素内部。在这个示例中，我们使用了三个由 `<li>` 列表项标签指定的列表项。\n\
    - `</ul>` 最后，我们关闭无序列表。\n\n就这么简单。当你需要进行更改时，可以根据需要添加、删除或修改任何列表项。当你保存并在浏览器中运行时，你会发现无序列表在每个列表项之前都有圆点。这些圆点是默认添加的。即使是像这些圆点这样简单的东西也是由设计者控制的。你可以更改圆点的样式，而不是使用默认的圆形样式，或者如果你愿意，可以完全移除它们。这一切都可以通过使用\
    \ CSS 代码非常简单地完成。除了简单的列表，你还会将列表元素用于许多其他用途。例如，一个常见的用途是在页面顶部创建导航菜单。\n\n## 创建有序列表/数字列表\n\
    \n创建有序列表的代码与创建无序列表的代码完全相同，不同之处在于我们使用 `<ol></ol>` 标签而不是 `<ul></ul>` 标签。这个列表会为你提供数字而不是圆点。提示：只需复制并粘贴无序列表代码，并将\
    \ `<ul></ul>` 标签中的 `u` 改为 `o` 即可。你会发现，你在 HTML 文档中添加的代码越多，实际需要输入的内容就越少。很多内容只是复制、粘贴和编辑。对于大多数内容，你最终将通过这种方式创建整个网站。大多数有经验的编码人员已经创建、测试并保存了许多像页眉、导航栏、页脚以及你能想到的任何其他内容，他们只需将这些部分复制并粘贴到新的网页和网站中。因此，他们基本上为那些需要反复使用的一切创建了模板。在制作多个网站时，这可以节省大量时间。如果你将这段代码添加到无序列表元素下方，你可以看到一个示例：\n\
    \n```html\n<!--This is an ordered list-->\n<ol>\n    <li>Football</li>\n    <li>Baseball</li>\n\
    \    <li>Basketball</li>\n</ol>\n```\n\n我想让你在这两个列表的代码中注意的最后一件事是我如何缩进 `<li>` 列表元素的。你可以看到，如果你有\
    \ 100 行代码，这样会更容易查找和阅读。这比所有内容都直接从屏幕左侧开始要清晰得多。随着你编写更多代码，你会找到自己喜欢的代码组织系统。但这就是我的做法。好了，现在去保存/运行你的代码吧。现在你已经创建了一个圆点列表和一个数字列表。\n\
    \n## 创建表格\n\n现在我们有了两个列表，在本章中我想向你展示的最后一件事是如何创建表格，因为它的创建方式与我们创建列表非常相似，只不过我们会有列和行。供参考：行是从左到右（水平的），而列是从上到下（垂直的）。在我刚开始学习编程时，这经常让我感到困惑。我无法告诉你我有多少次把表格做成了与我想要的相反的方向。这再次证明了经常保存并运行代码是多么重要。即使你正处于创建包含大量代码的元素的过程中。例如，如果你正在创建一个具有许多行和列的表格，而不小心以错误的方式输入了表格信息，那么回头修改所有代码来修复错误将非常痛苦。尽早发现这类问题会更好。相信我，这会为你省掉很多麻烦。现在，在你的有序列表下方添加这段代码：\n\
    \n```html\n<!--This is our table-->\n<table>\n<tr>\n    <th>Meats</th>\n    <th>Fruits</th>\n\
    \    <th>Desserts</th>\n</tr>\n<tr>\n    <td>Bacon</td>\n    <td>Banana</td>\n\
    \    <td>Chocolate cake</td>\n</tr>\n</table>\n```\n\n- `<table>` 首先，表格开始标签告诉浏览器这是一个表格。在这个标签之上的是仅供我们查看的注释。记住，注释不会显示在网页上。\n\
    - `<tr>` 然后，表格行开始标签启动一行。记住，这将从左到右显示。\n- `<th></th>` 这些是表格标题标签。这就是我们放置每行标题的地方。它们也将从左到右显示。并且表格标题元素位于表格行元素内部。在我们的练习中，我们有三个表格标题元素。\n\
    - `</tr>` 然后我们关闭标题的表格行。\n- `<tr>` 我们添加一个新行来开始添加数据。\n- `<td></td>` 添加表格数据标签，以及所有三个表格数据元素中要从左到右显示的数据。\n\
    - `</tr>` 然后我们关闭这一行。\n- `</table>` 最后，我们关闭整个表格。\n\n现在，当你在浏览器中运行它时，你会注意到几件事。浏览器会自动加粗并居中你的表格标题。它会根据该列中最大的数据元素来居中标题。因此，你可以看到最后一列的标题被推向了更右侧，因为其下方数据的大小。你还可以看到没有墙壁或边框。它们存在，但目前是不可见的。我们可以通过直接在\
    \ HTML 中使用标签属性使它们可见。将此内容添加到我们刚刚创建的表格开始标签中：\n\n`<table border=\"1\" style=\"width:100%\"\
    >`\n\n运行后，你会看到一个跨越网页宽度的边框。如果你将 `width` 属性的值更改为 `50%`，你将得到一个恰好跨越页面一半的表格。你可以尝试调整大小以获得想要的结果。要调整边框的厚度，你可以将\
    \ `border` 属性的值从 `1` 更改为 `2` 或任何你想要的值。请注意，这个数字是像素值。我不会过多地深入讨论这种样式定义方式，因为这种方式已经相当过时了。如今，我们几乎所有的样式需求都使用\
    \ CSS。但我只是想给你一个示例。\n\n添加更多行很简单。只需复制、粘贴并更改内容。例如，将此内容直接添加到你的表格数据行关闭标签 `</tr>` 下方：\n\
    \n```html\n<tr>\n    <td>Bacon</td>\n    <td>Banana</td>\n    <td>Chocolate cake</td>\n\
    </tr>\n<tr>\n    <td>Ham</td>\n    <td>Pineapple</td>\n    <td>Yogurt</td>\n</tr>\n\
    </table>\n```\n\n"
