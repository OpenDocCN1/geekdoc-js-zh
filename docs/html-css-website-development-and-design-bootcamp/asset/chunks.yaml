    this entire div out by adding the <!--, --> comment code before and after the
    div so that it''s still in your code for you to use later but the browser will
    ignore it. The purpose of this part of the example is just to teach you a common
    way of adding a logo that''s easy to control with your navigation class. In the
    example we just add our image element under our buttons but inside of our navigation
    div because this would let us control the logo with our "navigation" class. In
    this example to add a logo, We would have created a folder inside of our website
    folder again and named it images. This way if we saved many images for our website
    we can keep them a lot more organized in this folder. You can name the folder
    whatever you want and whenever you want to take an image out of it to put into
    your website, You would always just specify the folder name first in the file
    path. For example if you had a waterfall.jpeg image saved in the images folder
    with the logo.png image. To add it somewhere on your web page you would add this
    code somewhere in your HTML. <img src="images/waterfall.jpeg">. Also know that
    if you saved it as .jpg you have to enter "images/waterfall.jpg". It''s the same
    thing except for the "e" in the file format. It''s a good idea to pick either
    .jpg or .jpeg and always save that type of image with the same file format. So
    if you ever have an image that doesn''t load make sure that you have the same
    file extension in your HTML as you do in your images folder. And the last thing
    is if you didn''t remove this code or comment it out, You can still keep it there
    as a place holder for now until your create a logo. The browser will just load
    a tiny file not found image.


    We now have the names setup for our navigation bar buttons and the links to make
    them take the user to another page in our website. But those pages don''t exist
    yet. So let''s just create them and save them with the names we just specified
    in our links. You should be comfortable with this. But in case your not. We need
    to click File, then New again. Then when your new page pop''s up click File, then
    Save as. And since we already have an index.html we don''t have to create another
    one. The next button in the above example is for the Tutorials page. It has a
    link that points to tutorials.html. So that is exactly what we want to save this
    new document as. Again make sure that you click the drop down button for the Save
    as type box and choose the option that includes .html. And name it tutorials.html.
    You should also know that if you accidentally saved it as tutorial.html the link
    would not work. It has to be exact. But if you ever make that mistake you can
    just rename the document by clicking File, and Save as again. So go ahead and
    create the other three pages. They are programming.html, sourcecode.html, and
    contactus.html. If you entered different names for your buttons. Then just save
    these new documents as the appropriate name you specified. Also, Very important.
    Make sure that you save all of these new HTML documents into your website folder
    along with your logo image and/or images folder if you added one.'
