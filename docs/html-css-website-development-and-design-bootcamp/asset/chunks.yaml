  trans: "\n我们做的第一件事是设置一个类名为 `\"mainContent\"` 的 `div`。这个 `div` 将包含我们写在其中的所有内容。再次提醒，最好在这里输入你的起始和结束\
    \ `div` 标签，然后将你的其他代码放在里面，这样你就不会忘记了。请记住对你所有的标签都这样做，因为我不会再提这一点了。很多网页开发者会先创建页面内容，然后使用\
    \ `div` 标签将页面分为若干部分，以便之后进行定位和样式设置。我们从一开始就添加它们的原因是因为我已经规划好了这个布局。在开始构建网站之前，至少有一个良好的计划是一个好主意。我通常使用画图程序甚至几张纸来勾勒布局。你以后可以随时更改。\n\
    \n`<div class=\"content\">` 我们创建了另一个类名为 `\"content\"` 的 `div`。它嵌套在 `\"mainContent\"\
    ` `div` 内部。\n\n`<article class=\"topContent\"></article>` 然后我们创建了 `article` 标签并给它分配了类名\
    \ `\"topContent\"`。在这里我们接触了一个新的 HTML 元素。`article` 用于新闻和帖子等内容。有许多 HTML 元素的作用几乎完全相同，但它们的名称可以帮助我们更好地分类内容。因此它将包含我们想要在屏幕左侧的一些主要内容。我们将将其放在顶部。所以我们恰当地将其命名为\
    \ `\"topContent\"`。\n\n接下来，我们为文章创建了一个嵌套在 `header` 元素内部的 `h2` 标题。\n\n然后我们创建一个类名为\
    \ `\"subHeading\"` 的 `p` 元素，并嵌套在 `footer` 元素内部。这是 `footer` 元素的另一个用途。这将是一个子标题。你也可以在这里做其他事情，例如使用标题标签\
    \ `<h5></h5>` 代替 `p` 元素，或者使用 `footer` 元素以外的其他元素。实现相同结果的方法有很多。这完全取决于你想如何控制你的元素。我想在这个布局设计中向你提供使用相同元素的不同示例。但当你对网页开发和设计获得一些经验后，你的代码将适应你的风格。尽管这是一个有效的响应式网站，但某些代码可以更整洁，我们可以使用更少的代码，但目标不仅是给你提供一个可以运行的网站布局，还要给你提供各种示例。\n\
    \n`<p></p>``<p></p>` 现在我们设置了两个包含某些信息的段落元素。我们在第一个段落的 `p` `</p>` 结束标签之后添加了一个 `<br>`\
    \ 换行标签，在两个段落之间留出一个空行。尝试加上和不加换行符，看看你更倾向于哪种。\n\n我们以与 `\"topContent\"` 完全相同的方式建立了另一个类名为\
    \ `\"bottomContent\"` 的 `article`。\n\n最后，我们为 `\"mainContent\"` 和 `\"content\"\
    ` `div` 添加了结束标签。这完成了页面左侧主要内容的设置。\n\n## 设置我们的子内容区域\n\n现在，让我们为屏幕右侧添加一些内容框。你可以使用它们来放置链接、广告、新闻、更新或你喜欢的任何内容。在\
    \ `\"mainContent\"` `div` 的结束 div 标签之后，为右侧内容输入以下代码：\n\n```html\n</div>\n\n<aside\
    \ class=\"topRightSidebar\">\n  <article>\n    <h2>新教程更新</h2>\n    <p>有一系列针对安卓设备游戏开发的全新\
    \ Java 教程。请在编程部分查看它。学习如何创建你可以在在线应用商店销售的独特游戏应用。无论你是对 2D 还是 3D 游戏感兴趣，这个系列教程都能提供支持。</p>\n\
    \  </article>\n</aside>\n\n<aside class=\"middleRightSidebar\">\n  <article>\n\
    \    <h2>加入我们的社区！</h2>\n    <p>我们目前正在为这个网站开发论坛板块。请尽快回来注册加入。在我们的论坛中，你将能够与网页设计、开发和编程感兴趣或从事工作的人建立联系。在这里，你可以向社区询问你可能遇到的问题，或者在帖子中帮助他人。我们的目标是将这个网站成长为一个巨大的计算机代码和编程相关的训练视频库。欢迎大家加入。感谢你的支持。</p>\n\
    \  </article>\n</aside>\n\n<aside class=\"bottomRightSidebar\">\n  <article>\n\
    \    <h2>即将进行的活动</h2>\n    <p>你对科学和物理感兴趣吗？我们将在周一发布全新的《初学者物理》系列的第一个视频。根据你们在邮件中的大量请求，我们非常高兴能为你带来这个系列。我们在这里提供你想要的内容。每天都会上传一个新的视频教程。</p>\n\
    \  </article>\n</aside>\n```\n\n好的，这里我们有一些新的 HTML 元素。那是 `aside` 元素。你可以在 `article`\
    \ 内部或外部使用 `aside` 元素。该元素的一些用途是从新闻文章或故事中提取一些引人注目的内容，以及如网站更新等其他信息。我们在这里将它们用于页面右侧的内容。在上面的示例中，它们只填充了一些示例内容。我们有三个部分，这些是页面的子内容区域。注意，`aside`\
    \ 元素并不意味着它们必须位于页面的侧。它们用于与主题相关的侧边信息。但你有许多方式使用它们。\n\n所以我们根据之后的位置为 `aside` 类命了恰的名字。类名分别为\
    \ `\"topRightSidebar\"`、`middleRightSidebar\"` 和 `\"bottomRightSidebar\"`。\n\n\
    在三个 `aside` 元素中的每一个内部都有一个 `article`、`h2` 和 `p` 元素。\n\n确保你拥有所有的 `article` 和 `aside`\
    \ 标签。\n\n## 为页面底部创建页脚\n\n最后，对于我们的首页，我们将创建一个脚。你可以将页脚用于许多功能，如版权信息、商标、品牌、联系信息和链接。这个页脚将位于页面的底部。记住，浏览器从上到下读取你的代码，因此你希望页面底部的页脚元素是\
    \ body 元素的最后一个元素。在你的 `</aside>` 标签之后添加以下代码：\n\n```html\n</aside>\n\n<div>\n  <footer\
    \ class=\"mainFooter\">\n    <p> 版权 &copy; 姓名 2016-----联系我们 something@whatever.com</p>\n\
    \  </footer>\n</div>\n\n</body>\n</html>\n```\n\n我们完成了 `index.html` 文件的 HTML 内容编写。但如果你在浏览器中运行页面，它看起来非常无聊，而且所有内容堆叠在一起。因此，我们需要在\
    \ CSS 代码中添加所有的样式和定位。\n"
- fmt: "\n# CSS Styling Basics\n\n## Getting Started\n\nSo now that we're done with\
    \ the HTML part let's move on to the CSS. We need to jump over to our blank `stylesheet.css`\
    \ document in our text editor and start adding some CSS rules. It's important\
    \ to know that depending on the size of your paragraphs/content you may have to\
    \ slightly adjust your `margin`'s, `padding`'s, and `width`'s to fit the design\
    \ you want. Although this website layout works, this responsive website layout\
    \ that we're working on here is going to be more of a learning tool for creating\
    \ websites in this way. You will be able to build upon it even more and have a\
    \ completely unique responsive site. The very first rule that you'll see is one\
    \ that will affect all of the elements on our page. Then we'll make our `body`\
    \ rule to add some defaults that the entire page will inherit except where we\
    \ override them for specific areas. Add these rules first right at the top of\
    \ you document because this is where we will make changes that will affect all\
    \ of your pages in your website. Also remember that throughout all of this CSS\
    \ we're adding you should save and run your page often. And when your going to\
    \ run you page in the browser you have to save your `stylesheet.css` because that\
    \ is where you added the code or altered it. But then you have to go back to your\
    \ `index.html` page before you run. If you ran the `stylesheet.css` you will just\
    \ see a page with your CSS code in the browser. Since this page is not an actual\
    \ visible part of your website that is why you run you HTML page. Later down the\
    \ road when you have code in your other HTML pages you can run them as well. So\
    \ to simplify you run your HTML page not the CSS but don't forget to save your\
    \ changes in code or you won't see the change in the browser.\n\n## Default Styles\n\
    \n```\n* {\n         margin: 0;\n         padding: 0;\n}\nbody {\n         width:\
    \ 100%;\n         text-align: center;\n         line-height: 1.5;\n         font-family:\
    \ tahoma, georgia, times new roman, arial;\n         font-size: 100%;\n      \
    \   background: gray;\n}\n```\n\n- `*` { Okay we start with the asterisk selector.\
    \ This rule will affect every element on our pages. So here we're taking away\
    \ the browser's default `margin` and `padding`. We set them to none basically\
    \ so we can specify our own.\n- Then we have our `body` rule. In here we tell\
    \ the browser that we want the body to fit 100 percent of the browser window,\
    \ Align all the text center, line spacing of 1.5, and for the `font-family` we\
    \ are saying we want to use tahoma font throughout our website. But in case the\
    \ browser can't display this font for some reason we tell it to try georgia next.\
    \ And then we just have two more backups. The font families above are pretty common\
    \ so the browser should find them easily. It's just a precaution.\n- Finally we\
    \ set our default `font-size` to 100 percent and give a `background` color to\
    \ the whole `body` of gray.\n\nUsing percents here instead of some of the other\
    \ options is really up to you. In my experience it's easier to make adjustments\
    \ with percentages. But there will be some rules that you will use pixels instead\
    \ of percents. Okay so we're done setting up our defaults. Let's start styling\
    \ some elements. The order in which you add your rules is up to you. It wouldn't\
    \ make any difference to how our styles would work. Let's work on our header.\
    \ There is a lot of code in this rule that we'll go over. Add this rule to your\
    \ `stylesheet.css` document:\n\n## Styling the Header\n\n```\n.topHeader {\nbackground:\
    \ -moz-linear-gradient(white, black);\nbackground: -webkit-linear-gradient(white,\
    \ black);\nbackground: -o-linear-gradient(white, black);\nbackground: -ms-linear-gradient(white,\
    \ black); /*For IE10*/\nbackground: linear-gradient(white, black);\nfilter: progid:\
    \ DXImageTransform.Microsoft.gradient (GradientType=0, startColorstr='white',\
    \ endColorstr='black');  /*For displaying in IE7, IE8,  and IE9*/\nheight: auto;\
    \ /*For IE7*/\ncolor: white;\nwidth: 97%;\nmargin-top: 1%;\nmargin-left: 0%;\n\
    padding: 20px;\nborder: 1px solid blue;\n```\n\n- `.topHeader` { As you already\
    \ know the . dot specifies this is a class and topHeader is the name of the class.\n\
    - `background`: Now this part is pretty advanced but I wanted to give you the\
    \ code for a really nice header with a gradient background. Notice we used `background`\
    \ here instead of `background-color`. This will let us affect multiple background\
    \ properties at once. And that's what we want to do here. Besides the `background-color`:,\
    \ and now the `background`: properties that you know about. Some others are `background-repeat`:,\
    \ `background-attachment`:, `background-position`:, and `background-image`:. `background-image`\
    \ is one you might want to use for things like an image for your entire background\
    \ instead of a color. And you would do that simply by adding this code to your\
    \ `body` rule. `background-image` URL(\"thename.jpg\"). The other properties are\
    \ not used very often but you can check them out. So we want to use the `background`:\
    \ property here because our header will be a gradient color that starts at white\
    \ and ends at black. The best way to describe this is to run the code. The other\
    \ `background`: rules that we entered are to make sure that this will display\
    \ correctly in many browsers.\n- `filter`: This is also really advanced CSS code\
    \ here. This is basically some more security to make sure that this header displays\
    \ correctly in different browsers.\n- Although you don't completely understand\
    \ the `filter` you should be comfortable with the `background`: property and that\
    \ the -moz-, -webkit-, -o-, and -ms- are to make these other browsers accept our\
    \ code since we have used this same type of system in the `border-radius` lesson\
    \ in this book. Again this is very advanced but I wanted to include this in the\
    \ book so that you can use this code in multiple areas of your website. It doesn't\
    \ have to be the header. You can add this background to a paragraph if you wanted.\
    \ This is something that you can do a little more research into if you wanted\
    \ more information. Also your gradient doesn't have to be white to black. You\
    \ can add any colors in here that you want. Even custom colors like hex code values.\n\
    - `height`: auto; This is our final fail safe code and it just makes sure that\
    \ the text is centered top to bottom in Internet Explorer 7. There are comments\
    \ next to some of the code to help you better understand what browser version\
    \ were trying to make this code compatible with.\n- `color`: white; Here we simply\
    \ make the font white.\n- `width`: 97%; We give it a width of 97 percent of the\
    \ browser window to give it a little space on the outside of the border.\n- `margin-top`:\
    \ 1%; And we give a margin to the top of 1 percent to create a little space between\
    \ the header and the top of the browser window.\n- `margin-left`: 0%; Here we\
    \ take away any margin that was on the left of the border so it will span the\
    \ entire width of the browser window.\n- `padding`: 20px; Then we add some space\
    \ between the text and the border so that it's a nice thick header for our page.\
    \ You can play around with all of the values in this rule to get a style that\
    \ you like.\n- `border`: 1px solid blue; Finally we add a 1 pixel solid blue border.\
    \ This gives a nice highlight affect around our header.\n\n## Additional Tips\n\
    \nHopefully this rule wasn't too complicated. You could always add a more simplified\
    \ header if you choose. Some of this more advanced stuff shouldn't be explained\
    \ in this book and is better to come with experience because even a coder that\
    \ has been building websites for a long time would have to do some internet searches\
    \ to achieve this result for their header. And you'll find yourself wanting to\
    \ make your styles more eye catching so this is a good example for that. There\
    \ are so many things that you can do with HTML and CSS if you do the research.\n\
    \n## Animations\n"
