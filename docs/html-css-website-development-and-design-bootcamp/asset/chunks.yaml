  trans: "\n\n# CSS 样式基础\n\n## 入门\n\n现在我们已经完成了 HTML 部分，接下来进入 CSS。我们需要在文本编辑器中打开空白的\
    \ `stylesheet.css` 文档，开始添加一些 CSS 规则。需要注意的是，根据段落/内容的长度，你可能需要稍微调整 `margin`、`padding`\
    \ 和 `width` 来适应你想要的布局。虽然这个网站布局是可行的，但我们正在制作的这个响应式网站布局，更多是作为一种学习工具，帮助你以这种方式创建网站。你可以在此基础上进一步扩展，打造一个完全独特的响应式网站。你看到的第一个规则将影响页面上的所有元素。然后我们将创建\
    \ `body` 规则，添加一些默认样式，整个页面都会继承这些样式，除非我们在特定区域覆盖它们。请先将这些规则添加到文档的最顶部，因为这里所做的更改会影响网站的所有页面。另外请记住，在添加所有\
    \ CSS 的过程中，你应该经常保存并运行页面。当你在浏览器中运行页面时，必须保存 `stylesheet.css`，因为代码是在那里添加或修改的。但之后你需要先回到\
    \ `index.html` 页面再运行。如果你直接运行 `stylesheet.css`，浏览器中只会显示 CSS 代码的页面。由于这个页面并不是网站实际可见的部分，所以你需要运行\
    \ HTML 页面。以后当你在其他 HTML 页面中添加代码时，也可以运行它们。简单来说，你运行的是 HTML 页面而不是 CSS，但别忘了保存代码中的更改，否则浏览器中不会看到变化。\n\
    \n## 默认样式\n\n```\n* {\n         margin: 0;\n         padding: 0;\n}\nbody {\n\
    \         width: 100%;\n         text-align: center;\n         line-height: 1.5;\n\
    \         font-family: tahoma, georgia, times new roman, arial;\n         font-size:\
    \ 100%;\n         background: gray;\n}\n```\n\n- `*` { 我们从星号选择器开始。这条规则会影响页面上的每一个元素。这里我们去掉了浏览器的默认\
    \ `margin` 和 `padding`，基本上将它们设为无，以便我们可以指定自己的值。\n- 然后是 `body` 规则。在这里我们告诉浏览器，我们希望\
    \ body 占据浏览器窗口的 100%，所有文本居中对齐，行间距为 1.5，对于 `font-family`，我们表示希望在整个网站中使用 tahoma\
    \ 字体。但如果浏览器由于某种原因无法显示这种字体，我们告诉它接下来尝试 georgia。然后我们还有两个备选字体。上面的字体族都很常见，浏览器应该能轻松找到它们。这只是个预防措施。\n\
    - 最后我们将默认的 `font-size` 设为 100%，并为整个 `body` 设置灰色 `background`。\n\n这里使用百分比而不是其他选项完全取决于你。根据我的经验，使用百分比更容易进行调整。但有些规则你会使用像素而不是百分比。好了，默认样式设置完毕。让我们开始为一些元素添加样式。添加规则的顺序由你决定，这不会影响样式的效果。我们来处理页眉。这条规则中有很多代码需要讲解。将这条规则添加到你的\
    \ `stylesheet.css` 文档中：\n\n## 设置页眉样式\n\n```\n.topHeader {\nbackground: -moz-linear-gradient(white,\
    \ black);\nbackground: -webkit-linear-gradient(white, black);\nbackground: -o-linear-gradient(white,\
    \ black);\nbackground: -ms-linear-gradient(white, black); /*For IE10*/\nbackground:\
    \ linear-gradient(white, black);\nfilter: progid: DXImageTransform.Microsoft.gradient\
    \ (GradientType=0, startColorstr='white', endColorstr='black');  /*For displaying\
    \ in IE7, IE8,  and IE9*/\nheight: auto; /*For IE7*/\ncolor: white;\nwidth: 97%;\n\
    margin-top: 1%;\nmargin-left: 0%;\npadding: 20px;\nborder: 1px solid blue;\n```\n\
    \n- `.topHeader` { 如你所知，点号表示这是一个类，topHeader 是类名。\n- `background`: 这部分相当高级，但我希望给你提供一段代码，用于创建带有渐变背景的漂亮页眉。注意这里我们使用了\
    \ `background` 而不是 `background-color`。这让我们可以同时影响多个背景属性，这正是我们想要的。除了你已知的 `background-color`:\
    \ 和 `background`: 属性外，还有其他一些属性，如 `background-repeat`:、`background-attachment`:、`background-position`:\
    \ 和 `background-image`:。`background-image` 可能用于为整个背景设置图片而不是颜色。你只需在 `body` 规则中添加这段代码即可：`background-image`\
    \ URL(\"thename.jpg\")。其他属性不常用，但你可以了解一下。这里我们想使用 `background`: 属性，因为我们的页眉将是一个从白色渐变到黑色的颜色。最好的描述方式就是运行代码。我们输入的其他\
    \ `background`: 规则是为了确保它在多种浏览器中正确显示。\n- `filter`: 这也是非常高级的 CSS 代码。这基本上是为了进一步确保页眉在不同浏览器中正确显示。\n\
    - 虽然你还没有完全理解 `filter`，但你应该熟悉 `background`: 属性，并且知道 -moz-、-webkit-、-o- 和 -ms- 是为了让其他浏览器接受我们的代码，因为我们在本书的\
    \ `border-radius` 课程中已经使用过类似的机制。再次强调，这非常高级，但我希望将其包含在书中，以便你可以在网站的多个区域使用这段代码。不一定非要用在页眉上。如果你愿意，也可以将这种背景添加到段落中。如果你想了解更多信息，可以进一步研究。另外，你的渐变不一定要从白色到黑色。你可以在这里添加任何你喜欢的颜色，甚至像十六进制代码值这样的自定义颜色。\n\
    - `height`: auto; 这是我们的最后一道保险代码，它确保文本在 Internet Explorer 7 中垂直居中。代码旁边有一些注释，帮助你更好地理解我们试图让这段代码兼容哪些浏览器版本。\n\
    - `color`: white; 这里我们简单地将字体设为白色。\n- `width`: 97%; 我们将其宽度设为浏览器窗口的 97%，以便在边框外侧留出一点空间。\n\
    - `margin-top`: 1%; 我们给顶部添加 1% 的外边距，在页眉和浏览器窗口顶部之间创建一点间距。\n- `margin-left`: 0%;\
    \ 这里我们去掉了边框左侧的所有外边距，使其横跨浏览器窗口的整个宽度。\n- `padding`: 20px; 然后我们在文本和边框之间添加一些内边距，使页眉看起来更厚实。你可以调整这条规则中的所有值，以获得你喜欢的样式。\n\
    - `border`: 1px solid blue; 最后我们添加一个 1 像素的实线蓝色边框。这为页眉周围提供了一个漂亮的突出效果。\n\n## 额外提示\n\
    \n希望这条规则不算太复杂。如果你愿意，也可以添加一个更简单的页眉。本书不应过多解释这些高级内容，它们更适合在实践中积累经验，因为即使是长期从事网站开发的程序员，也需要上网搜索才能为自己的页眉实现这样的效果。你会发现你希望让自己的样式更吸引眼球，所以这是一个很好的例子。如果你愿意研究，HTML\
    \ 和 CSS 能做的事情非常多。\n\n## 动画\n\n"
- fmt: '

    In the next few rules that we make we''re gonna be adding styles and some animations
    to our navigation bar. I''ve added some advanced code to this as well to show
    you how you can add animation to your elements with CSS. The point of the advanced
    code that we''re using in the CSS rules is to give you a better idea of the possible
    effects that you can create with the power of CSS. As far as the percentages go,
    just know that I came up with these numbers by trial and error. So when designing
    your own pages you will try different values until you get the result you want.
    And with a little bit of simple math. We know we set our body to 100 percent of
    the browser window. So when we''re sizing our elements with percentages it''s
    kind of easy to figure out what percent you want each of them to take up without
    going over 100 percent. And tweaking the values is what I mean by trial and error.
    Also since our buttons are links to our other pages our font styling is gonna
    happen when we create our link style rules. For now we are styling the button
    itself. So go ahead and add this rule to your `stylesheet.css`:


    ```css

    .button {

    border-radius: 7px;

    background-color: blue;

    width: 19%;

    height: auto; /*automatically fits height to size of the text.*/

    margin: 1% .5%; /*1% top and bottom, .5% right and left. */

    float: left;  /*float left so that they will display side by side.*/

    -webkit-transition:-webkit-transform 2s, background 2s;

    -ms-transition:-webkit-transform 2s, background 2s;

    -moz-transition:-webkit-transform 2s, background 2s;

    -o-transition:-webkit-transform 2s, background 2s;

    }

    ```


    - `.button`: We start our `.button` class selector.

    - `background-color: blue;`: Set the background color of the button to blue.

    - `width: 19%;`: Give the buttons a width of 19 percent because we have five buttons
    and we want a little bit of margin space between them.

    - `height: auto;`: Set the height of the buttons to fit the size of the text.

    - `margin: 1% .5%;`: Here is another way to shorthand. In this rule we are setting
    the top and bottom margins to 1% and the left and right sides (space in between
    buttons) to .5%. So here you could see why we have a value of 19% in our width
    instead of 20%. Because we want a .5% margin in between our buttons. Which will
    end up being 1 percent after the two margins are added together.

    - `float: left;`: We use the `float` property on our buttons so that they will
    display side by side.

    - The next four lines of code are setting up our animation. And it is basically
    one line of code repeated four times to make the code compatible between different
    browsers. To simplify this advanced code we are telling the browser that we want
    to make a transformation of some kind and have it take 2 seconds to complete the
    transition. We also are gonna change the background color and that too we want
    to have take 2 seconds to complete. This will give us a nice gradient transformation
    from one color to another that will take 2 seconds to complete. Note that you
    can change the amount of time that the transition will take. For example a half
    of a second would be .5s. The next rule that we create will explain what we were
    doing here a little better.


    So now we are going to add some style to the button when it is hovered over with
    the mouse and it will explain the transition and transform code a little better
    from our `.button` rule. Add this new rule under your `.button` rule:


    ```css

    .button:hover {

    -webkit-transform:rotate(360deg);

    -ms-transform:rotate(360deg);

    -moz-transform:rotate(360deg);

    -o-transform:rotate(360deg);

    background: red;

    }

    ```


    - `.button:hover`: We have another `.button` rule. This time we added the `:hover`
    selector. This `:hover` selector can be used in many different CSS rules. You
    are just styling the rule before the `:hover` selector when the user hovers their
    mouse over that specific element. Make sure that there is no spacing in the selector
    name. So we are creating this rule to make something happen when the mouse is
    hovering above one of our buttons.

    - `transform:rotate(360deg);`: And this is one of the things that we want to happen
    when the button is hovered over with the mouse. We want it to rotate 360 degrees.
    And we specified in our `.button` selector that we want this transition to take
    2 second. Here we also add the code to make it compatible in other browsers.

    - `background: red;`: This is the second effect that we want. So we want the background
    to change from blue to red when it is hovered over. In our `.button` rule we originally
    set the button color to blue and we specified that we want this transition to
    take 2 seconds as well. So now the effect of our animation is. We have a blue
    button that when the mouse is hovered over it will rotate 360 degrees and change
    its color in a gradient manner to red at the same time. And this will take 2 seconds
    to happen.


    We are going to style our links now. And the way we do that is by creating a CSS
    rule for our anchor. Add this rule after the `.button:hover` rule:


    ```css

    a {

    text-decoration: none;

    color: white;

    }

    ```


    - `a`: Our selector for our button text since it is a link is the `a` or anchor
    tag.

    - `text-decoration: none;`: We take away the default decorations like underline.

    - `color: white;`: We set the font color to white.


    ```css

    a:hover {

    color: black;

    }

    ```


    - `a:hover`: We style the link when it is hovered over.

    - `color: black;`: We change the color to black when hovered.


    ### Styling More Content


    We are done with the navigation style and animation for now. Let''s begin working
    on some of other content. Add this rule:


    ```css

    img {

    max-width: 100%;

    margin: 10px;

    }

    ```


    - Here we are just creating a rule for our `img` element. And all that we''re
    doing is telling the browser that we never want image to exceed 100%. This is
    more of a safety rule since our layout is going to be responsive and we want our
    content to size accordingly.

    - And we give our image a margin of 10 pixels on all sides so that it isn''t bumped
    up against other elements.


    ```css

    h2 {

    color: blue;

    text-align: center;

    }

    ```


    - Here all we did was set the font color for all of our `h2` elements to blue.

    - And we center the text.

    - If you want to style the text for the top header just add an h4 rule.


    ```css

    .subHeading {

    font-size: 60%;

    font-style: italic;

    font-weight: bold;

    text-align: right;

    }

    ```


    - `.subHeading`: We create a rule for our `.subHeading` class.

    - `font-size: 60%;`: We want the text for our sub headings to be 60% of the original
    default size that we specified in our `body` rule. So this will be 40% smaller
    than our default size.

    - `font-style: italic;`: We make our sub headings font italic.

    - `font-weight: bold;`: And we also make it bold.

    - `text-align: right;`: Finally we align the text to the right.


    ```css

    p {

    text-indent: 20px;

    }

    ```


    - All that we did here was give our `p` elements a 20 pixel indent.


