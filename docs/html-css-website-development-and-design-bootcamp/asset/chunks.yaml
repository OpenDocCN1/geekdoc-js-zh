    Chapter 8: Creating input forms


    In this chapter we will be learning how to create a few different types of input
    forms. There are a few steps involved in order to make them function the way you
    want. For example if you wanted to save the information that the user entered
    into a database. You would need to use a programming language like JavaScript.
    And that is something to look into after you learn HTML and CSS. But for this
    lesson we are just gonna be focusing on actually creating the forms and adding
    them to our web page. You can skip this chapter and come back to it later if you
    like because the coding that you will learn here is gonna be a lot more useful
    when you get into the more advanced stuff. But this is a good point for you to
    learn the creation of the actual visible form part of the process. And making
    the form function the way you want will come later.


    One Line Text-Box And Submit Button


    So we''ll start with the text-box, (the input field that the user would enter
    some type of information into like an e-mail address, a password, and so on).
    Let''s start creating our text-box. Right after the opening body tag <body> add
    this:


    <form action="" method="">


    <input type="text" name="">


    </form>


    As you can see we have opening and closing form tags and an input element embedded
    in between them. Don''t worry too much about these form tags and attributes that
    are in the opening tag. These form tags just tell the browser that this is a form
    and the attributes inside of the opening tag are something you''ll learn when
    you get into JavaScript. It''s what will specify the function that you want to
    perform and there are many different functions and things that you could do with
    JavaScript. So I strongly recommend taking a look at that after completing this
    book.


    <input type="text" name=""> This is our input element. It is the code that actually
    puts the text-box on our page. Without this there would be nothing displayed because
    the form element is basically just a container to hold our input elements. Again
    don''t worry about the attributes for now. In this exercise we are just learning
    how to create the input field. There are many different attributes that can added
    to this element as well. But for this example since we want to create a text box
    we specified the input type as text. And this does not need a closing tag.


    If you save and run this code you will get a text box right at the top of your
    page. This is the most common type of input field that you will see on web pages.
    Say if we wanted two one line text boxes for the user to put a username and password
    in. All we would have to do is add another input element under the first one like
    so:


    <form action="" method="">


    <input type="text" name="">


    <input type="text" name="">


    </form>


    This would give us two boxes side by side on the same line. So to make it look
    a little better we''ll add two line breaks in between. Add these line breaks to
    your form:


    <form action="" method="">


    <input type="text" name="">


    <br/>


    <br/>


    <input type="text" name="">


    </form>


    Now when you run your page you''ll see that it''s starting to resemble a form
    that you probably have seen a million times. If you click inside one of the text
    boxes you will be able to add some text. Right now we don''t have the code to
    do anything with the content and it wouldn''t make sense to teach you that at
    this point. But you need to know how to actually make a form before you get into
    the programming part of it anyway. You can see that if you add a lot of text the
    box will scroll to the right only showing the amount of content that will fit
    in the default size text box. If you wanted to change length of your text box,
    It is really simple. You just add this attribute to your input element. Only add
    it to your first text box so you can see the difference between the two.


    <input type="text" name="" size="40">


    So now the first text box is 40 pixels in length and the second box is the default
    size. Let''s add some labels to our form. One for the user to enter their username
    and one for them to enter their password. Put in this code and then we''ll go
    over it: Note, I took out the size attribute that we added to the first text box.


    <form action="" method="">


     <label for="name">Username:</label>


    <input type="text" id="name" name="">


    <br/>


    <br/>


    <label for="password">Password:</label>


    <input type="text" id="password" name="">


    </form>


    We added quite a bit of code here. But at this point you should be pretty comfortable
    with what we did. We''ll break down the code that we entered to create our label
    for the Username text-box. The Password label is set up in the exact same way.


    <label></label> These are the label element tags. This element has to be closed
    and we did that all on one line. We have a label element above our first text-box
    and one above our second text-box.


    for= This is our for attribute. It goes in our opening tag. This for= attribute
    is used in kind of the same way the name= attribute was used when we created our
    hyperlinks to jump to different parts of our page. Our for attribute will link
    up with another attribute.


    "name" This is our attribute value. And this is the value that will link to it''s
    twin value. I know that value is kind of a weird name for this but that is the
    correct term used. It''s basically just the name that you gave to your for attribute.


    >Username This is the text that will display for our label. It will appear to
    the left of the text-box that it is assigned to.


    </label> Then we close the label element.'
