    你可以根据需要添加任意数量的行。你的表格可以是 5 列宽、200 行长，完全由你决定。在结束这个表格练习之前，我想向你介绍另一个可以用在表格中的 HTML
    元素，那就是 `caption` 元素。它用于为我们的表格定义标题。请将以下代码紧跟在 `table` 标签的起始行之后添加：


    ```html

    <caption>Foods</caption>

    ```


    现在你会看到我们的表格在顶边框正上方有一个居中的标题。你可能会在想，既然 HTML 是从上到下读取的，为什么我们要把这段代码放在表格开始之后。这是因为该元素被专门地嵌入到了我们的
    `table` 元素中。因此，如果我们把表格移动到不同的位置，`caption` 元素会随之移动。但如果我们使用例如 `<h1>` 元素来为表格创建标题，我们就必须将其放在起始
    `<table>` 标签的正前方。然后我们还得添加代码来使其居中，而且如果我们移动了页面上的表格位置，我们也必须同时移动 `<h1>` 元素。`caption`
    标签专门用于定义表格标题。此外，每个表格只能添加一次。本章内容就到这里，再次提醒，当我们进入 CSS 部分时，我们将能够对齐表格单元格中的文本、为表格边框着色、更改字体样式以及实现许多其他功能。


    ## 第 6 章测验


    1. 无序列表和有序列表的主要区别是什么？

    2. 使用什么标签来添加列表项？

    3. 以下每个标签的用途是什么？`<table>`, `<th>`, `<tr>`, `<td>`。

    4. 表格行是以什么方向显示的？

    5. `caption` 元素的作用是什么，其代码应该写在哪里？


    ## 第 7 章：链接


    在本章中，我们将讨论在网页中使用链接的几种方式。但首先，让我们在页面中添加两个标题和两个段落，使页面稍微大一点，这样这个练习才会更有意义。下面段落中的文本仅用于示例目的。你可以放入任何你想要的内容，但不必过于在意，因为在创建实际网站之前，我们稍后会删除它们。为了节省时间，请直接复制并粘贴段落内容。


    另外请注意，当你像这样在文本编辑器中输入大量文本时，当文本接近屏幕右侧时可以按下回车键（Enter/Return）。记住，HTML 会忽略所有额外的空格，因此这很有帮助，因为你不需要为了查看所有代码而不断地左右滚动。你可以将所有内容保持在正常的窗口大小内。例如，即使你的段落文本长达
    25 句话，你也可以将其全部放在一行中，但这显然更难阅读。相反，你可以将内容分布在多行中，以便一次性全部看到。HTML 在每个单词之间只会添加一个空格，所以即使你跳过了很多行也没有关系。


    关于用作占位符文本的一个有趣事实：有一种名为 Lorem Ipsum 的文本，Web 开发人员会用它来填充网页内容作为占位符，直到他们放入自己的内容。它自
    16 世纪以来就一直存在并被用于各种不同类型的场景。你可以通过互联网搜索 Lorem Ipsum 来了解更多信息。


    将以下代码添加到你在第 6 章中刚刚创建的表格之后：


    ```html

    <h1>Gaming Stuff</h1>

    <p>This paragraph is all about gaming. This paragraph is all about gaming. This
    paragraph is all about gaming. This paragraph is all about gaming. This paragraph
    is all about gaming. This paragraph is all about gaming. This paragraph is all
    about gaming. This paragraph is all about gaming.</p>


    <h2>Gaming Accessories</h2>

    <p>This paragraph is all about gaming accessories. This paragraph is all about
    gaming accessories. This paragraph is all about gaming accessories. This paragraph
    is all about gaming accessories. This paragraph is all about gaming accessories.
    This paragraph is all about gaming accessories. This paragraph is all about gaming
    accessories. This paragraph is all about gaming accessories. This paragraph is
    all about gaming accessories. This paragraph is all about gaming accessories.
    This paragraph is all about gaming accessories. This paragraph is all about gaming
    accessories.</p>

    ```


    现在你的网页上应该有足够的内容来模拟一个大型页面。在这种情况下，你可能想添加一个链接，以便在点击时跳转到页面的某个特定部分。在这个示例中，我们将在页面最末尾创建一个链接，点击后将用户带回顶部。在闭合
    `</body>` 标签之前，添加以下代码：


    ```html

    <a href="#top">Back to Top</a>

    ```


    - `<a>`：这被称为锚点标签（anchor tag）。它定义了一个超链接。

    - `href=`: 这是一个 `href` 属性。该属性为锚点标签提供了一个链接的目标地址。

    - `"#top"`: 对于 `href` 属性的值，我们添加双引号和一个井号（hatch tag）。井号告诉锚点标签，这将链接到当前网页内部的某个位置。

    - `Back to Top`: 这里的文本是实际的链接。这将是用户点击的部分。

    - `</a>`: 最后，我们闭合锚点元素。


    现在我们设置好了一个链接，但如果现在点击它，它不会带我们去任何地方。这是因为我们必须创建另一个锚点标签，以便这个标签能够链接到那个标签。既然我们要链接回页面顶部，我们将把第二个锚点标签紧跟在起始
    `<body>` 标签之后添加：


    ```html

    <a name="top"></a>

    ```


    - `<a>`: 同样，我们以一个起始锚点标签开始。

    - `name=`: 然后我们使用 `name` 属性。我们赋予 `name` 的值将与我们在第一个锚点中指定的 `#` 井号标签值相匹配。

    - `"top"`: 我们赋予它的值是 `"top"`。这必须与你的井号标签值一致。

    - `</a>`: 然后我们闭合锚点元素。


    如果你保存/运行页面，你将能够滚动到页面底部并点击“Back to Top”链接。请注意，如果你想跳转到某个特定段落，例如，你会首先在该特定元素的起始标签中添加一个锚点。所以，如果我们想链接到“Gaming
    Stuff”标题，我们会在这里添加锚点：


    ```html

    <h1><a name="gaming stuff article"></a>Gaming Stuff</h1>

    ```


    然后在页面中你想添加可点击链接的其他地方，添加以下内容：


    ```html

    <a href="#gaming stuff article">Click Me to go to Gaming Stuff</a>

    ```


    不要忘记添加 `#` 以及文本 `Click Me to go to Gaming Stuff`，因为如果你不放入任何文本或图像，用户将没有任何可以点击的内容。该链接甚至不会在你的网页上显示。

