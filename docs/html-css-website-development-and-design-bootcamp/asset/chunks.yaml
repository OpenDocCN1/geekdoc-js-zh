  trans: "\n## 表单布局基础\n\n`id=\"name\"` 这是我们为文本框元素添加的属性名和属性值，我们想要为其分配标签。值 `\"name\"\
    ` 是将此值与标签值绑定的关键。它必须与其对应项完全匹配才能链接到它。当我说链接到彼此时，我的意思是浏览器知道这个值与另一个对应的值绑定，这样浏览器就知道你想要把刚刚创建的标签放在哪里。\n\
    \n我们现在有一个表单，包含用户名和密码文本框，供用户输入信息。正如我所说，本课只是教你如何创建表单的布局。当你到了让网站用户交互的阶段时，输入到这两个文本框中的信息会被发送到服务器，在那里数据会被处理，然后我们可以用它做些什么。但是用户需要一个按钮来点击或者某种提交数据的方式。所以为了完成我们的表单布局，我们要添加一个提交按钮。在\
    \ `<input type=\"text\" id=\"password\" name=\"\">` 行之后，在表单元素内输入以下新代码：\n\n```html\n\
    <form action=\"\" method=\"\">\n <label for=\"name\">Username:</label>\n <input\
    \ type=\"text\" id=\"name\" name=\"\">\n <br/>\n <br/>\n <label for=\"password\"\
    >Password:</label>\n <input type=\"text\" id=\"password\" name=\"\">\n <br/>\n\
    \ <br/>\n <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n- `<br/><br/>`\
    \ 我们添加了两个换行符来更好地定位按钮。\n- `<input type=\"submit\">` 然后我们添加另一个 input 元素。这次我们将 `input`\
    \ 的 type 设置为 `submit` 而不是 `text`。这只是告诉浏览器我们需要一个提交按钮。\n- `value=\"Submit\">` 这是我们放在按钮上的文本。如果你愿意，也可以输入不同的内容，比如\
    \ `Post` 作为按钮文本。\n\n如果你运行你的代码，你会看到我们带有新提交按钮的完整表单。你可以点击它，但它实际上不会做任何事情，因为我们还没有用任何编程方式为按钮添加功能。那将在我们首先学习如何创建和设计整个网页或网站之后才会讲到。\n\
    \n## 创建多行文本框\n\n接下来我们要学习的是如何制作多行文本框。我们没有在上面例子中学习这个的原因是，创建多行文本框的代码与单行文本框的代码非常不同。所以请清除表单标签之间的所有内容。或者如果你想保留那个例子在页面上，你可以就在我们创建的第一个表单下面再创建一组表单标签。我们将制作几种不同类型的表单，所以你可能想保留每个表单的代码，这样你就可以查看它们并比较差异。我们需要为多行文本框输入的代码是：\n\
    \n```html\n<br/>\nFeedback:\n<form action=\"\" method=\"\">\n <textarea rows=\"\
    10\" cols=\"20\"></textarea>\n <br/>\n <br/>\n <input type=\"submit\" value=\"\
    Send Feedback\">\n</form>\n<br/>\n```\n\n- 我们一步一步来。我们添加了一个换行符，以便在两个表单之间创建一些空间，以防你在页面上保留了第一个表单。\n\
    - `Feedback:` 这里我们添加了一个仅包含简单文本的标题/标签。有很多种方式可以为页面添加标题、标签等。这是一种示例，展示了文本如何在页面上显示而不使用任何标签。但要注意，因为我们以这种方式输入标签，所以它没有绑定到表单中。你可以看到它甚至不在表单元素内部。所以如果我们想要重新定位表单或做任何调整，这个\
    \ `Feedback:` 标签就必须单独调整。如果你要创建的文本是永久性的，这种方式可以用于添加文本。也就是说，你永远不会移动它或对它做任何操作。因此，最好将内容放在某些标签之间，无论是\
    \ `<p>` 元素、`<h1>` 元素还是任何其他适合你需求的标签。\n- `<form action=\"\" method=\"\">` 我们添加开始表单标签，告诉浏览器这是一个表单。\n\
    - `<textarea rows=\"10\" cols=\"20\"></textarea>` 这是实际创建多行文本框的代码。如你所见，它与创建单行文本框的代码非常不同。但这是浏览器理解的方式。它是一个\
    \ `textarea` 元素，必须有闭合标签。对于 `rows` 和列 (`cols`)，你可以输入任意数字。所以如果你想要 25 行和 50 列，那也可以。\n\
    - `<br/><br/>` 我们再次添加了几个换行符来创建一些空间。试着调整换行符。看看浏览器在没有换行符的情况下会显示“发送反馈”按钮的位置，然后再看看如果你只添加一个换行符按钮会在哪里。尝试代码的不同写法很重要。实验一下，你会发现偶尔会意外得到你喜欢的结果。记住你是老板，你告诉浏览器该怎么做。\n\
    - `<input type=\"submit\" value=\"Send Feedback\">` 我们添加提交按钮，但这次我们将按钮上的文本设置为 `Send\
    \ Feedback`。\n- `</form>` 我们关闭表单。\n- `<br/>` 我们在最后添加了一个换行符，以便在该表单和下面显示的下一个元素之间创建空间。\n\
    \n保存并运行你的代码。现在你已经有了带发送反馈按钮的多行文本框。注意，如果你在文本框中添加大量文本，而这些文本不适合你指定的大小，你会注意到右侧会出现一个滚动条。浏览器会自动为我们做到这一点。\n\
    \n## 数字输入框\n\n在本章结束之前，我们还要制作一种输入表单。那就是数字输入框。在多行文本框表单之后添加此代码。\n\n```html\n<form\
    \ action=\"\" method=\"\">\n How old are you?<br/>\n <input type=\"number\" min=\"\
    0\" max=\"99\">\n</form>\n```\n\n- `<form action=\"\" method=\"\">` 首先打开你的表单元素。\n\
    - `How old are you?<br/>` 我们在这里添加问题和一个换行符。\n- `<input type=\"number\" min=\"0\"\
    \ max=\"99\">` 然后我们输入类型为 `number` 的 input 元素。我们还使用 `min` 和 `max` 属性指定了用户输入的最小值和最大值。注意，如果你选择不输入\
    \ `min` 和 `max` 属性，你的输入框会显示得更长。由于我们将 `max` 值指定为两位数，因此本例中框的长度会更短。还要注意，大小可能因用户使用的浏览器而异。\n\
    - `</form>` 然后我们关闭表单元素。\n\n如果你继续运行带属性的代码然后不带属性运行，你会看到框长度的差异。另外，如果你在最新版本的 Internet\
    \ Explorer 中运行此代码，你会看到该浏览器允许你输入文本，但如果你在 Google Chrome 中运行，它不会。它只允许数字。另一件你可能注意到的事情是，当你在\
    \ I.E. 中运行时，没有上下箭头供用户点击来调整数字，如果你输入大于 `max` 值的数字（如 `101`），当你悬停在小 x 按钮上时，会弹出一个对话框，显示“你必须输入介于\
    \ 0 和 99 之间的值”。这是一个很好的例子，说明为什么在测试时在多个浏览器中运行代码很重要。你可以看到两个浏览器如何以不同方式显示你的页面。通常差异很小，你不必担心。但有时某个浏览器可能根本不显示你页面的某部分。在这种情况下，你需要进行一些调整。\n\
    \n## 第 8 章测验\n\n1. 用于创建单行或多行文本框的元素是什么？\n2. 如何在表单中添加嵌入式标签？\n3. 创建按钮时，你在哪里输入会显示在按钮上的文本？\n\
    4. 你需要什么才能使表单功能正常？\n5. 在本章中，`min` 和 `max` 属性的用途是什么？\n\n## 第 9 章：更多表单布局\n"
