- fmt: "\n2. What are some of the uses of an HTML comment?\n\n3. What code would you\
    \ write to display this sentence? 50 & 60 are both `>` 40.\n\n## Chapter 4: Empty\
    \ elements\n\nHTML elements that have no content are called empty elements. An\
    \ example of an empty element is the line break `<br>`. It doesn't have a closing\
    \ tag and can be written in a few ways. `<br>` or `<br/>` or `</br>`. In the second\
    \ and third examples we are opening and closing it in the same tag. There are\
    \ other empty elements and we will go over them but for now below is an example\
    \ of using the line break:\n\n```\n<p>John Doe<br/>123 Lucky Street<br/>Las Vegas,\
    \ NV. 77777</p>\n```\n\nIt would appear like this on your page:\n\nJohn Doe\n\n\
    123 Lucky Street\n\nLas Vegas, NV. 77777\n\nWithout these line break tags the\
    \ text would appear all on one line. You can also add multiple line breaks in\
    \ order to create more separation between a heading and a subheading for example.\
    \ Adding `<br/><br/><br/>` would create three empty lines as if you hit the return\
    \ key on your keyboard three times.\n\nThis small chapter is just to explain to\
    \ you what an empty element is so that when we use them later on you'll have a\
    \ better understanding of how they work.\n\n### Quiz Chapter 4\n\n1. What is an\
    \ empty element?\n\n2. What is a good example of the use of a line break element\
    \ from this chapter?\n\n## Chapter 5: Images\n\nOn to some fun stuff. Let's add\
    \ an image to our web page. First of all go ahead and create a simple image in\
    \ Microsoft paint or any other program that you might use. It could be a colored\
    \ rectangle. It doesn't matter. As long as you have an image to use for this lesson.\
    \ Make it about 500 pixels by 500 pixels and save it as `image.jpg`. When you\
    \ save it, save it right into your website folder that has your HTML document\
    \ in it. As far as taking images off of the web is concerned you have to be careful\
    \ what images you use because you don't own the rights to that image and might\
    \ have to ask the creator for permission or put an acknowledgment to that person\
    \ in your website or wherever you may have used it. There are some safer places\
    \ out there like creative commons website's where people upload images to a website\
    \ and release all of their rights to them. You can do a search for creative common\
    \ images but read very carefully because some of their content has rules you still\
    \ have to follow. One website for downloading free images is FreeDigitalPhotos.net.\
    \ Just make sure you read their rules and terms of use. But for learning purposes\
    \ any image that you create will be fine. So now that you have an image saved\
    \ into your website folder go back to your HTML code in your text editor and enter\
    \ this line right after your opening body tag:\n\n```\n<img src=\"image.jpg\"\
    >\n```\n\nOkay before we run our page let's break this down:\n\n- This is another\
    \ empty element and does not have a closing tag.\n- `<img` stands for image and\
    \ tells the browser that we are adding an image to our page in the area we placed\
    \ it in our code. So for our example we are displaying it as the first thing at\
    \ the top of our web page.\n- `src=` stands for source and this is an attribute.\
    \ It's telling the browser where to find the image and since we saved it right\
    \ into our website folder we don't have to specify a huge file location. We can\
    \ just call it by name.\n- `\"image.jpg\">` And this is the name and file extension\
    \ or your image. Make sure that you surround it with double quotes.\n\nGo ahead\
    \ and run your page now and you will see your image is displayed in the top left\
    \ corner of your browser window. You'll also see that there is a bit of space\
    \ between the image and the sides of the page. This is called a margin. The browser\
    \ adds this automatically and we'll go over how to change this later.\n\nAnother\
    \ thing that you could do if you plan on adding a lot of images to your website\
    \ is create a folder inside of you website folder. Name it something like `images`.\
    \ This way you can keep all of your images organized and in one place. The only\
    \ difference in your code to add an image now would be adding the folder name\
    \ and a forward slash. So you would have:\n\n```\n<img src=\"image.jpg\">\n```\n\
    \nYou could also point to another image online and grab a copy from that website\
    \ to display on your page. Say if you had an image stored on photobucket.com.\
    \ In this case you would use the full url (location) of your image. For example:\n\
    \n```\n<img src=\"http://www.photobucket.com/youraccount/nameofyourimage.jpg\"\
    >\n```\n\n### Resizing Images\n\nIf after you load your image onto your page you\
    \ don't like the size of it. You can change it simply by adding this code directly\
    \ to your img img element:\n\n```\n<img src=\"images/image.jpg\" width=200 height=200>\n\
    ```\n\nWhat's happening here is we are loading the image at it's original size\
    \ and then the web browser on the user's computer will re-size it. By the way\
    \ the 200 that we put in for the width and height means 200 pixels. When we get\
    \ into CSS we will be able to re-size things in a few different ways including\
    \ scaling and percentage. Resizing images in the example above is okay if you\
    \ just want to make a small change to one or two images. But you wouldn't want\
    \ to do this throughout your entire site with many images. This will make a big\
    \ impact on how fast your website loads. So it's always a better idea to re-size\
    \ your images.\n\n### Quiz Chapter 5\n\n1. What is the empty element used to add\
    \ an image to your web page?\n2. When is it okay to re-size an image inside using\
    \ HTML?\n3. What attribute do you use to add alternate text to an image?\n4. What\
    \ format would be best to use for an image that has many colors?\n5. What is the\
    \ best format to use for an image containing text?\n\n## Chapter 6: Creating unordered\
    \ lists, ordered lists, and tables\n\nMaking a list in HTML is pretty simple and\
    \ after you do it once you'll have it down pat. First we'll make an unordered\
    \ list. This is just a list with bullets. Let's clean up our HTML a little bit\
    \ first. Delete some of the elements until your only left with this.\n\n```\n\
    <!doctype html>\n<html>\n<head>\n<title>Main Page</title>\n</head> \n\n<body>\n\
    \n<img src=\"image.jpg\">\n\n</body>\n\n</html>\n```\n"
