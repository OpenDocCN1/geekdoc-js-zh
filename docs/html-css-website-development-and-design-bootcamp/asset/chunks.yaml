    Chapter 17: The Box Model, Margin, and Padding


    This chapter is all about the box model. Below is a diagram of the box model and
    we''re gonna discuss this in detail because this is extremely important to understand
    when you position your elements, add spacing, and many other things.


    Box Model Diagram


    ![](images/00001.jpeg)


    Every element on your page is set up like this. Imagine invisible boxes around
    every single heading, every paragraph, and even your background for the entire
    page. They only become visible when we specify them to be seen with code.


    First the content box. And that''s what we''ve been using. Every time we add
    something to our page it is the content of the element that we are seeing.


    Second is the padding. This is the space between the content and where your background
    color would end. Or to describe it better. It''s where the border begins. We''ll
    see this in an example in a minute.


    Third is the border. And we''ve already used the border property a few times
    now so you should have an good idea of where the border shows up when you add
    that property.


    Finally we have the margin. And that is the space between all of your elements.
    The browser automatically adds some space by default. And in the example you''ll
    see that you can take away the margin completely if you want.


    So let''s see an example of the box model. We will work with our h3 element since
    we haven''t added any styles to it yet. Don''t worry about what the heading actually
    says. It doesn''t matter. We just want to make our boxes visible. So in your internal
    style sheet add this new rule:


    h3 {


    background-color: gray;


    border: 5px solid yellow;


    }


    In our new h3 rule we''ve adding a background color like we have many times now.
    And a border that we coded short hand. As you know you could have set the border
    by the individual property and value with border-width:, border-style:, and border-color:.
    So run your code here and you''ll see that we now have a gray background, a yellow
    border, and our border is kind of close to our heading text. So let''s add some
    padding to give some space between the text and the border. Put this into your
    h3 rule:


    h3 {


    background-color: gray;


    border: 5px solid yellow;


    padding: 25px;


    }


    Save and run your code again. Now we have a 25 pixel margin around all four sides
    of our content (the text). Since we haven''t specified a width, The border runs
    the entire width of the page. But you can see we have 25 pixels on the top, 25
    pixels on the bottom, and 25 pixels on the left. The right margin is there too.
    It just can''t be seen because we didn''t specify a width.'
