  trans: "\n\n2. HTML 注释的用途有哪些？\n\n3. 你会写什么代码来显示这句话？50 & 60 均 `>` 40。\n\n## 第 4 章：空元素\n\
    \n没有内容的 HTML 元素被称为空元素。空元素的一个例子是换行符 `<br>`。它没有闭合标签，可以用几种方式书写：`<br>` 或 `<br/>` 或\
    \ `</br>`。在第二个和第三个示例中，我们是在同一个标签内进行开启和关闭。还有其他空元素，我们稍后会介绍，但现在下面是一个使用换行符的示例：\n\n\
    ```\n<p>John Doe<br/>123 Lucky Street<br/>Las Vegas, NV. 77777</p>\n```\n\n它在你的页面上显示如下：\n\
    \nJohn Doe\n\n123 Lucky Street\n\nLas Vegas, NV. 77777\n\n如果没有这些换行标签，文本将全部显示在一行。你也可以添加多个换行符，以便在标题和副标题之间创建更大的间距。例如，添加\
    \ `<br/><br/><br/>` 会创建三个空行，就像你在键盘上按了三次回车键一样。\n\n这个小章节只是向你解释什么是空元素，以便我们以后使用它们时，你能更好地理解它们是如何工作的。\n\
    \n### 第 4 章测试\n\n1. 什么是空元素？\n\n2. 本章中换行元素用法的一个很好的例子是什么？\n\n## 第 5 章：图像\n\n现在进入一些有趣的内容。让我们为我们的网页添加一张图片。首先，请在\
    \ Microsoft 画 或任何你可能使用的其他程序创建一个简单的图像。它可以是一个彩色矩形，没关系，只要你有一张图片供本课程使用即可。将其设置为大约 500x500\
    \ 像素，并保存为 `image.jpg`。保存时，请直接保存到包含你 HTML 文档的网站文件夹中。关于从网上获取图片，你必须小心使用的图片，因为你并不拥有该图片的权利，可能需要征作者的许可，或者在你的网站或任何使用过的地方向该人员致谢。有一些更安全的地方，例如知识共享（Creative\
    \ Commons）网站，人们将图片上传到网站并放弃所有权利。你可以搜索知识共享图片，但要非常仔细阅读，因为它们的某些内容你仍必须遵守其规则。一个下载免费图片的网站是\
    \ FreeDigitalPhotos.net。只需确保你阅读了他们的规则和使用条款。但出于学习目的，你创建的任何图片都可以。现在你已经将图片保存到你的网站文件夹中，请回到文本编辑器中的\
    \ HTML 代码，在你的 `<body>` 标签之后立即输入这一行：\n\n```\n<img src=\"image.jpg\">\n```\n\n好了，在我们运行页面之前，让我们来拆解一下：\n\
    \n- 这是另一个空元素，没有闭合标签。\n- `<img` 代表 image（图像），告诉浏览器我们正在代码中放置的区域处向页面添加一张图像。因此，对于我们的示例，我们将其显示为网页顶部的第一个元素。\n\
    - `src=` 代表 source（源），这是一个属性。它告诉浏览器去哪里寻找图片，由于我们将其直接保存到网站文件夹中，所以我们不需要指定巨大的文件路径。我们只需通过名称调用它。\n\
    - `\"image.jpg\">` 这是你的图片名称和文件扩展名。确保用双引号将其括起来。\n\n现在运行你的页面吧，你会看到图片显示在浏览器窗口的左上角。你还会发现图片和页面边缘之间有一定的空间。这被称为\
    \ margin（外边距）。浏览器会自动添加此，我们稍后会介绍如何更改它。\n\n如果你计划为网站添加大量图片，可以做的另一件事是在你的网站文件夹内部创建一个文件夹。将其命名为类似\
    \ `images` 的名称。这样你就可以把所有的图片存放在一个地方。现在代码中添加图片的唯一区别是添加文件夹名称和正斜杠。所以你会得到：\n\n```\n\
    <img src=\"image.jpg\">\n```\n\n你也可以指向在线上的另一个图片，并从该网站获取副本显示在你的页面上。假设你有一张图片存储在\
    \ photobucket.com。在这种情况下，你将使用图片的完整 URL（位置）。例如：\n\n```\n<img src=\"http://www.photobucket.com/youraccount/nameofyourimage.jpg\"\
    >\n```\n\n### 调整图像大小\n\n如果在将图片加载到页面后不喜欢它的尺寸，你可以通过直接在 `<img>` 元素中添加此代码来简单地更改：\n\
    \n```\n<img src=\"images/image.jpg\" width=200 height=200>\n```\n\n这里发生的是我们按原始大小加载图片，然后用户计算机上的网络浏览器将对其进行重新调整。顺便说一下，我们在宽度和高度中放入的\
    \ 200 表示 200 像素。当我们进入 CSS 时，将能够以几种不同的方式重新调整大小，包括缩放和百分比。在上面的示例中，如果你只想对一两张图片进行小更改，这样做是可以的。但你不想在有许多图片的整个网站上这样做。这将对网站的加载速度产生巨大影响。因此，重新调整图片大小总是更好的主意。\n\
    \n### 第 5 章测试\n\n1. 使用什么空元素向你的网页添加图像？\n2. 什么时候在 HTML 内部重新调整图像大小是合适的？\n3. 你使用什么属性为图像添加替代文本（alternate\
    \ text）？\n4. 对于具有许多颜色的图像，什么格式最好？\n5. 对于包含文本的图像，最好的格式是什么？\n\n## 第 6 章：创建无序列表、有序列表和表格\n\
    \n在 HTML 中创建列表非常简单，操作一次后你就学会了。首先我们创建一个无序列表。这是一个带符号的列表。让我们先清理一下 HTML。删除一些元素，直到只剩下这些：\n\
    \n```\n<!doctype html>\n<html>\n<head>\n<title>Main Page</title>\n</head> \n\n\
    <body>\n\n<img src=\"image.jpg\">\n\n</body>\n\n</html>\n```\n"
- fmt: "\nAnd now inside the body element add this code after your image element and\
    \ then we'll break it down piece by piece like normal.\n\n```html\n<!doctype html>\n\
    <html>\n<head>\n<title>Main Page</title>\n</head> \n<body>\n<img src=\"image.jpg\"\
    >\n <ul>\n <li>Football</li>\n <li>Baseball</li>\n <li>Basketball</li>\n </ul>\n\
    </body>\n</html>\n```\n\n- The first line is just a comment to give you a little\
    \ more practice using them.\n- `<ul>` This is the unordered list opening tag.\n\
    - `<li>Football</li>` This is a list element. It is put inside of the unordered\
    \ list element. In this example with have three list items that we specified with\
    \ the `<li>` list item tags.\n- `</ul>` And finally we close the unordered list.\n\
    \nIt's as simple as that. You can add, delete, or alter any list items you want\
    \ when you need to make changes. When you save and run in your browser you can\
    \ see that an unordered list has bullets before each list item. They are added\
    \ by default. Even something simple like these bullets are controlled by the designer.\
    \ You can change the style of the bullets instead of using the default circular\
    \ style or remove them completely if you want. This can all be done very simply\
    \ using CSS code. You will use the list element for many other things besides\
    \ just a list. For example one common use is for creating a navigation menu at\
    \ the top of your page.\n\n## Creating An Ordered List/Numbered List\n\nThe code\
    \ for creating an ordered list is exactly the same as the code for an unordered\
    \ list except we use the `<ol></ol>` tags instead of the `<ul></ul>` tags. And\
    \ this list will give you numbers instead of bullets. Tip, Just copy and paste\
    \ the unordered list code and change the u's to o's in the `<ul></ul>` tags. You'll\
    \ find that the more code you add to your HTML documents, the less typing you'll\
    \ actually have to do. A lot of it is just copy, paste, and edit. And you'll end\
    \ up creating entire websites this way for most of the content. Most coders with\
    \ experience have a lot of things like headers, navigation bars, footers, and\
    \ anything else you could think of already created, tested, and saved somewhere\
    \ that they can just copy and paste parts of them into their new web pages and\
    \ website's. So they basically make themselves templates for everything that they\
    \ now they are going to use over and over again. This saves a huge amount of time\
    \ when making multiple website's. So if you add this code under your unordered\
    \ list element you can see an example:\n\n```html\n<!--This is an ordered list-->\n\
    <ol>\n    <li>Football</li>\n    <li>Baseball</li>\n    <li>Basketball</li>\n\
    </ol>\n```\n\nOne last thing that I want you to notice in the code for these two\
    \ lists is how I indented the `<li>` list elements. You can see how if you had\
    \ a 100 lines of code how this would be easier to find and read. It's a lot clearer\
    \ than if you just had everything start right at the left of your screen. As you\
    \ code more you'll find your own system for how you like your code organized.\
    \ But this is what I do. Okay so go ahead and save/run your code. And now you've\
    \ created both a bullet list and a numbered list.\n\n## Creating A Table\n\nNow\
    \ that we have our two lists the last thing I want to show you in this chapter\
    \ is how to create a table because it's very similar to how we made our lists\
    \ except we'll have columns and rows. FYI, rows are left to right (horizontal)\
    \ and columns are up and down (vertical). That used to trip me up when I first\
    \ started coding. I can't tell you how many times that I made a table the opposite\
    \ way I wanted to. Which brings up the point again of how important it is to save\
    \ and run your code often. Even when your in the middle of creating an element\
    \ that contains a lot of code. For example if you are creating a table that has\
    \ many rows and columns and accidentally entered your table information in the\
    \ wrong way, it would really be a pain to go back and change all of your code\
    \ to fix the mistake. It's better to catch things like this early. Trust me it\
    \ will save you a lot of headache. So under your ordered list go ahead and add\
    \ this code:\n\n```html\n<!--This is our table-->\n<table>\n<tr>\n    <th>Meats</th>\n\
    \    <th>Fruits</th>\n    <th>Desserts</th>\n</tr>\n<tr>\n    <td>Bacon</td>\n\
    \    <td>Banana</td>\n    <td>Chocolate cake</td>\n</tr>\n</table>\n```\n\n- `<table>`\
    \ First the opening table tag tells the browser that this is a table. Above this\
    \ tag is just a comment for us to view only. Remember comments will not display\
    \ on the web page.\n- `<tr>` Then the table row opening tag starts a row. Remember\
    \ this will display left to right.\n- `<th></th>` These are the table header tags.\
    \ So this is where we put the header for each row. They will also display from\
    \ left to right. And the table header element is inside of the table row element.\
    \ In our exercise we have three table header elements.\n- `</tr>` Then we close\
    \ the table row for our headers.\n- `<tr>` We add a new row to start adding our\
    \ data.\n- `<td></td>` Add the table data tags with the data to be displayed from\
    \ left to right for all three table data elements.\n- `</tr>` Then we close out\
    \ this row.\n- `</table>` And Finally we close the entire table.\n\nNow when you\
    \ run this in your browser you'll notice a few things. The browser will automatically\
    \ bold and center your table headers. It will center a header based off of the\
    \ largest data element in the column. So as you can see the last column's header\
    \ is pushed farther to right because of the size of the data underneath it. You\
    \ can also see that there are no walls or borders. They are there but are invisible\
    \ at the moment. We can make them visible by using tag attributes directly in\
    \ HTML. Add this to your opening table tag that we just created:\n\n`<table border=\"\
    1\" style=\"width:100%\">`\n\nWhen you run you'll see that you get a border that\
    \ spans the width of your web page. If you change value in your `width` property\
    \ to `50%` you will get a table that spans exactly half of your page. You can\
    \ play around with the size to get the result you want. To adjust the thickness\
    \ of your border you can change the value in your `border` property from `1` to\
    \ `2` or whatever you want. Note that this number is a pixel value. I'm not gonna\
    \ get into styling in this way too much because this way of styling is pretty\
    \ much old news. Nowadays we use CSS for pretty much all of our styling needs.\
    \ But I just wanted to give you an example.\n\nAdding more rows is simple. Just\
    \ copy and paste and change the content. For example add this right under your\
    \ closing table data row tag `</tr>`:\n\n```html\n<tr>\n    <td>Bacon</td>\n \
    \   <td>Banana</td>\n    <td>Chocolate cake</td>\n</tr>\n<tr>\n    <td>Ham</td>\n\
    \    <td>Pineapple</td>\n    <td>Yogurt</td>\n</tr>\n</table>\n```\n"
