    \ product, software, or service mentioned in this book.\n\n## Who Should Read\
    \ This Book?\n\nThis book is great for anyone interested in building and designing\
    \ their own unique amazing websites. It was designed to take the complete beginner\
    \ or novice coder and give them the ability to code like a pro fast with a simple\
    \ step by step system. The exercises in this book are short and very impactful.\
    \ You will create your first basic web page within the first 20 minutes of this\
    \ book and begin adding content to it. In this book we cover basic HTML and CSS\
    \ plus some of the more widely used stuff. There is also some animation code and\
    \ currently popular designs that we work on. We discuss how to put your website\
    \ live on the internet and what is the best way to do it depending on the type\
    \ of website that you make. You'll learn some of the techniques that experienced\
    \ web developers and designers use, how to create user input forms, what meta\
    \ tags are and what you can do with them, what the box model is, how to divide\
    \ your web pages up into sections, how to re-use code to make sub page creation\
    \ quick and easy, different systems that are used to do the same thing, the different\
    \ ways of positioning the content on your page, how to get your website high in\
    \ search engine rankings, what you should look into after completing this book,\
    \ and in the end of the book we create a usable and customizable responsive website\
    \ layout that you can do whatever you want with. I have been creating and designing\
    \ websites for over 10 years. In this book I share what I think is an awesome\
    \ system for learning HTML and CSS fast, especially for the complete beginner.\
    \ I wish that there was a book like this when I first got introduced to web development.\
    \ One other thing that I think I should cover before you read this book is that\
    \ it is so important that you follow along with the quick exercises and type the\
    \ code into your text editor. Take it from me you will learn ten times faster\
    \ if do the exercises. We will discuss what text editor that you should use as\
    \ well. You already have everything you need to build and design websites on your\
    \ computer but there are some great free text editors that you can download super\
    \ fast that give you many benefits for coding. I've also added optional end of\
    \ chapter tests that you can use to see how much information you've retained.\
    \ I'm so excited about this book and I can't wait to see what kind of websites\
