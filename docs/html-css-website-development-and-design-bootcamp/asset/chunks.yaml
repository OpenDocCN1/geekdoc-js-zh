    \n`border: 2px solid white;`\n\n这被称为简写（shorthand），因为你在一行代码中组合了多个属性。这段代码实现的效果与\
    \ `border-width`、`border-color` 和 `border-height`（注：此处应为 border-style）属性完全相同。这取决于程序员自己决定偏于哪种方式。\n\
    \n## Border-Radius 属性 / 圆角边框\n\n另一个有助于让你的页面看起来更美观的边框属性是 `border-radius`。这个属性将使你添加代码的那个边框的角变为圆角。将此代码添加到你的\
    \ `p` 规则中并在浏览器中运行它：\n\n```css\np {\n  color: red;\n  background-color: black;\n\
    \  font-family: tahoma;\n  font-size: 20px;\n  text-align: center;\n  border:\
    \ 2px solid white;\n  border-radius: 20px;\n  width: 50%;\n}\n```\n\n现在，你有一个半径为\
    \ 20 像素的圆角边框。你也可以在这里尝试其他值来获取你喜的半径，例如 `5px` 或 `12px`。\n\n请注意，如果你在 Google Chrome\
    \ 中运行这段代码，你的边框将会有圆角，但如果你在 internet explorer 中运行，则不会。有一种修复方法，即给属性添加一个前缀。将此代码添加到你的\
    \ `p` 规则中：\n\n```css\np {\n  color: red;\n  background-color: black;\n  font-family:\
    \ tahoma;\n  font-size: 20px;\n  text-align: center;\n  border: 2px solid white;\n\
    \  border-radius: 20px;\n  -webkit-border-radius: 20px;\n  -moz-border-radius:\
    \ 20px;\n  width: 50%;\n}\n```\n\n`-webkit-border-radius: 20px;` 通过复制 `border-radius:`\
    \ 属性代码并添加前缀 `-webkit-`，你的边框现在在 Internet Explorer 中将拥有圆角。\n\n`-moz-border-radius:\
    \ 20px;` 通过复制 `border-radius:` 属性代码并添加前缀 `-moz-`，你的边框现在在 Mozilla Firefox 中将拥有圆角。\n\
    \n每当你遇到这类问题时，都可以尝试复制你的属性并向代码添加这些前缀。你还可以使用其他前缀，我们将在本书的后续部分使用它们。简而言之，某些浏览器可以正常显示代码，而另一些则不能。这些前缀来自于一个\
    \ web kit，使其具有兼容性。这完全取决于浏览器何时获得更新以接受这些代码。顺便说（FYI），即使浏览器对此类内容进行了更新，你不再需要这些前缀，额外的代码也不会破坏你的页面。这就是为什么在多个浏览器中运行代码通常非常重要的原因之一。你还会在其他代码中遇到这个问题。通常是当向\
    \ HTML 或 CSS 添加新代码时会发生这种情况。如果浏览器没有设置好如何处理它，它就会 忽略它。当问题出现时，尝试这种技术，它应该能解决你的问题。\n\
    \n### 浏览器前缀更新\n\n这是一个更新后的浏览器前缀列表，你可以将其添加到代码中以使其正常工作。\n"
- fmt: "\n# Chapter 14: Inline Styling\n\nIn this chapter we're gonna WOMP, WOMP-WOMP,\
    \ WOMP, WOMP, DO IT INLINE STYLE. Sorry, I had to. Anyway, out of the three ways\
    \ of adding CSS to your HTML documents this is the least common way used but we\
    \ still need to cover it so that you can decide which way works best for you.\
    \ \n\nAdding CSS inline style means that you would be embedding your CSS code\
    \ directly into you HTML elements. This can get a bit messy if you are adding\
    \ many properties. To give an example of this we are going to add a few new elements\
    \ to our HTML document that we're using for learning purposes. So add this new\
    \ element somewhere in your code and go ahead and run it.\n\n```html\n<h3 style=\"\
    color:red;font-size:20px;\">This heading was created with inline styling</h3>\n\
    ```\n\n- `style=\"color:red;font-size:20px;\"` We have added our `style` tag directly\
    \ into our opening `h3` tag. Notice that we don't need to close it close when\
    \ using it in this way. Then we add an equals sign and a set of double quotes.\
    \ Inside of the double quotes we specify the properties and the values that we\
    \ want to apply to this specific `h3` element. As you can see the `;` semicolons\
    \ also goes in between the double quotes to end our CSS statements/rules.\n- We\
    \ specify that we want this `h3` element to have red text and a font size of 20\
    \ pixels.\n\nSo you might be wondering what would happen if we created a new `p`\
    \ element because we are already using an internal style sheet up in our `head`\
    \ element. And any `p` element that we have already or are going to create will\
    \ have properties that we set in our `p` rule. Let's add this code under our new\
    \ `h3` element and then we can run it and go over what is happening.\n\n```html\n\
    <h3 style=\"color:red;font-size:20px;\">This heading was created with inline styling</h3>\n\
    \n<p style=\"color:purple;font-size:14px;text-align:left;\">\nWe made this paragraph\
    \ with inline styles. It also has style attributed to it from our internal style\
    \ sheet</p>\n```\n\n- So now after you run your new code you can see that this\
    \ paragraph is different from the other three `p` elements that we have on our\
    \ page. So what is happening?\n- Well first we are inheriting the properties that\
    \ we set in our `p` rule. And then in our inline style code we are overriding\
    \ some of those properties for this specific paragraph alone. And what we changed\
    \ was the color of the text to purple, the font size to 14 pixels, and we aligned\
    \ the text left.\n\nThat is all that we need to cover with inline style. Pretty\
    \ simple to understand. And now you know that you can mix match multiple ways\
    \ of styling. But when you begin designing your pages I recommend that you pick\
    \ the system that is the easiest and most organized for you to understand. Most\
    \ coders don't use inline style too much because their HTML quickly would become\
    \ cluttered.\n\n### Quiz Chapter 14\n1. Where do we put the code for our inline\
    \ style?\n2. What is the term used when we alter a property that was already specified\
    \ somewhere else in our code?\n\n# Chapter 15: Colors and CSS comments\n\n## Primary\
    \ colors\nWe are gonna discuss the color value a little deeper in this chapter.\
    \ There are three ways to add color to our elements. The first way is by using\
    \ one of the sixteen primary colors and calling it by name. This is the way we've\
    \ added color so far throughout this book. A list of the sixteen primary colors\
    \ that you could use follows in alphabetical order:\n\n1. `aqua`\n2. `black`\n\
    3. `blue`\n4. `fuchsia`\n5. `gray`\n6. `green`\n7. `lime`\n8. `maroon`\n9. `navy`\n\
    10. `olive`\n11. `purple`\n12. `red`\n13. `silver`\n14. `teal`\n15. `white`\n\
    16. `yellow`\n\n## RGB colors\nThe second way to add color to your elements is\
    \ by using an RGB value. The RGB stands for red, green, and blue. And it is a\
    \ mix between these three values that gives you access to millions of colors.\
    \ \n\nYou can do a search for rgb values. But a simple way to get them is by using\
    \ ms paint or any other program like paint. Let's use ms paint for example. If\
    \ you open it up and click on the edit colors menu in the top right you'll get\
    \ a color palette screen. Now if you move the slider up and down and move the\
    \ cross hair cursor inside of the color box you can see that it is possible to\
    \ get a huge amount of color combinations. And when you get a color that you like\
    \ the red, green, and blue values will be displayed in the bottom right of the\
    \ color palette screen. \n\nNow remember these values or write them down because\
    \ we're gonna use them to change the background color of our web page. So we need\
    \ to go to our `body` rule in our CSS internal style sheet and replace the `background-color:\
    \ yellow;` with this code: You can add your values or use the ones that I have\
    \ here. And you add in order the red, green, blue values in between the parenthesis:\
    \ `background-color: rgb(65,77,103);`. If you used the rgb values that I entered\
    \ when you run your page you will get a kind of grayish blue background color.\n\
    \n## Hex Code Colors\nAnd the last way to add color is by using a hex code. This\
    \ is similar to rgb values as you have access to millions of colors. You can search\
    \ for popular hex code values or if you have a color that you like with the rgb\
    \ values you can do a search for a rgb to hex converter. \n\nMany coders prefer\
    \ to use the hex code because it's easier to enter into their CSS. So if you replace\
    \ the `background-color` property again with this code: `background-color: #008080;`\
    \ you will get a teal background. And as you can see the value is just a hatch\
    \ tag and a number. This can also be a number/letter value. As you start designing\
    \ web pages you will probably use a mix of primary colors and rgb or hex codes\
    \ inside of your CSS. That is perfectly fine and is very common.\n\n## Adding\
    \ Comments To CSS\nWhat most coders do often, is when they have a bunch of hex\
    \ codes or rgb values that they like, they create a folder on their desktop with\
    \ a document inside that has a list of the codes and usually a small image of\
    \ the color next to them. You could also add a comment area in your CSS with the\
    \ values that you plan on using throughout your website. \n\nThe way to add a\
    \ comment in your CSS code is a little different from how you would to your HTML.\
    \ As you know you add a comment to HTML like this: `<!-- comment -->`. But to\
    \ add a comment in CSS you would enter it in this way:\n\n- `/*CSS comments are\
    \ also ignored by the browser. */`\n- `/*You could also enter your comment on\
    \ multiple lines like this. As long as you surround the text with the forward\
    \ slashes and the * asterisk symbols*/`\n\nWhen you start to have a lot of code\
    \ in your CSS you might want to add comments to section parts of your code out\
    \ in a way that will make it easier for you to navigate and find things in your\
    \ code. An example of how a coder might put their code into sections using CSS\
    \ comments is:\n\n```css\n/*====================HEX CODES=======================*/\n\
    /*In here they might have a list of their favorite hex codes.\n#000 = black\n\
    #388f00 = green\n#c34c1d = burnt orange*/\n\n/*====================HEADINGS========================*/\n\
    /* Then in here they would have all of their CSS rules for their headings. h1,\
    \ h2, and so on. */\n\n/*==================MAIN CONTENT======================*/\n\
    /* This is where they would put their main content rules like p elements, etc.\
    \ */\n```\n\nYou will find a system that works for you with experience. That's\
    \ it for this chapter. Go ahead and experiment with different color combinations\
    \ and test out the three ways of adding color to your web page.\n\n### Quiz Chapter\
    \ 15\n1. What are the three ways of adding color to you website?\n2. How many\
    \ primary colors are available to you for your code?\n3. What symbol do you start\
    \ a hex code with?\n4. How do you enter a CSS comment compared to an HTML comment?\n\
    \n# Chapter 16: Classes and Id's\nIn this chapter we are going to learn about\
    \ CSS classes and id's. What they do, Which one to use, and how they can help\
    \ you design your elements faster and easier.\n\n## CSS Classes\n"
