    希望你已经成功在浏览器中运行了 HTML，并能看到包含一个页眉和两行文本的网页。你应该也注意到了，我将 `head` 和 `title` 元素分别放在了单独的行中。就像之前的示例一样，你可以将它们全部写在同一行，或者像本例中这样分开写。这取决于你的习惯。在这里我引入了两个标签。


    - `<h1>Welcome to my first web page!</h1>` - 这是一个 `h1` 元素。如你所见，它使文本变粗并增大了字号。共有
    6 个标题元素可供使用，我稍后会为你展示示例。

    - `<p>This is going to be epic!!!!</p> <p>Oh, yes it is.</p>` - 这些是段落元素。你会经常使用这个元素，无论是处理单行文本还是整个段落。你可能已经注意到，尽管我们在第二个段落的
    words "yes" 和 "it" 之间添加了大量空格，但浏览器在显示文本时，每个单词之间仅保留了一个空格。这是浏览器的默认行为。所有这些空格被称为“白空格”（white-space），除非你明确指定需要额外空格，否则浏览器会忽略任何多余的间距。有几种方法可以实现这一点，我们稍后会详细讨论。你可能还会注意到，在第一个段落之后有一个换行，就像你在键盘上按下回车键一样，然后才开始下一个段落。`p`
    元素会自动完成此操作。虽然有多种方法可以操纵换行、间距、缩进等，但我想要指出的是，使用 `p` 元素时，你无需担心自己在段落之间手动添加换行符。


    ## 标题元素示例


    在文本编辑器中，在第二个 `p` 元素下方添加以下代码，以查看六个可用的默认标题：


    ```html

    <h1>Heading 1</h1>

    <h2>Heading 2</h2>

    <h3>Heading 3</h2>

    <h4>Heading 4</h4>

    <h5>Heading 5</h5>

    <h6>Heading 6</h6>

    ```


    现在保存你的工作并在浏览器中再次运行。如果你一直开着浏览器窗口，只需重新保存 HTML 并点击刷新按钮即可看到新添加的内容。你应该能看到显示的六个不同的标题。此外，每个标题之间都有一个换行。同样，这是由浏览器自动完成的。标题
    1 的字体最大且最粗，字号一直递减到标题 6。当我们进入更高级的内容并开始使用 CSS 时，我们将能够更改这些默认大小。例如，如果我们愿意，我们可以多次使用
    `<h1></h1>` 元素，并让每个标题以不同的尺寸显示。这种对元素的控制是让你的页面独具一格的方法之一。经验丰富的程序员认为，在每个页面中至少使用一次
    `h1` 元素是标准做法。我还想在本书的早期阶段指出，我们在接下来的八到九章左右创建的 HTML 内容，将在我们开始学习样式设计时继续使用。因此，目前请保留你添加到页面上的元素。你的页面可能会开始看起来有点凌乱，但我们现在仅将其用于学习目的，稍后我们将创建一个实际的、可用且美观的网站布局。


    ### 第二章测验


    1. 浏览器是如何读取 HTML 的？

    2. 我们将所有给浏览器的“幕后”指令放在哪一组标签或元素中？

    3. 如果你在文本编辑器中在两个单词之间添加大量空格，当它在浏览器窗口中渲染和显示时，文本会发生什么？

    4. 为什么经常在多个浏览器中保存并运行代码是有好处的？


    ## 第三章：HTML 注释与特殊/转义字符


    随着网页的构建，你的 HTML 文档会变得相当长。跟踪内容的一个好方法是添加注释。你添加的注释仅在文本编辑器中对你可见。它们不会显示在页面上，仅用于组织内容或提醒自己要做某事等。它们还可以用于调试代码中的问题。如果你认为某段代码可能导致问题，可以在其周围添加注释代码，这样浏览器就会忽略内部的所有代码。要在代码中添加注释，你可以这样输入：


    ```html

    <!--Added a unordered list to my news section. July 15, 2015-->

    ```


    这些符号 `<!-- -->` 告诉浏览器内部的内容是注释，不应显示。你在连字符/破折号之间添加你的注释。如果你将此注释放在 `body` 元素内部并使用
    `notepad++`，你会发现它的颜色发生了变化，表明它识别出这是一个注释。这就是为什么我喜欢使用 `notepad++` 或 `TextWrangler`
    的原因之一。而且我相信你已经注意到，它会根据内容类型的不同，用不同的颜色高亮显示其他标签等。普通的记事本（Notepad）只有黑白两色，这使得即使是经验丰富的程序员也难以阅读和查找内容。当你变得更有经验时，你可以尝试调整文本编辑器的设置，使用不同的颜色和字体，以及许多其他选项。


    如果你保存并在浏览器中运行，你会发现它不会显示这段文本。你可以根据需要添加任意数量的注释。如果你与他人合作项目，也可以利用这一点告知他们你所做的更改或希望他们完成的事项。要让浏览器忽略一部分代码，你只需要在想要忽略的部分之前添加起始注释代码
    `<!--`，并在该部分结束之后立即添加结束注释代码 `-->`。内部的所有内容现在都被视为注释，不会显示在页面上。它还会改变颜色，告诉你它识别出这是一个注释。你可以让浏览器一次忽略一个或多个内容。这是寻找问题代码的一个好工具。


    ### 特殊/转义字符


    有时你可能需要添加一些额外的空格，例如为了按照你想要的方式对带有周围文本的图像进行定位。或者可能有一些你需要包含的特殊字符，但你不希望浏览器将这些字符读取为
    HTML 代码。因此，我在下面列出了一些如何在页面上毫无问题地放置这些字符的方法。这些代码看起来可能很复杂，但它们实际上是 HTML 中唯一不是纯英语的内容。如果你忘记了某个
    HTML 代码，随时可以在互联网上搜索。我仍然会搜索某些内容，因为不可能记住所有东西。你可以搜索类似“如何在 HTML 中添加多个空格？”之类的内容，或者一次性搜索全部并将其打印出来或保存到电脑上。这取决于你。我在下面添加的代码是最常用的。


    - `&nbsp;` 使用此代码添加空格，无论是在单词之间，还是在图像和附近文本之间创建空间。要添加多个空格，只需多次添加该代码。例如，要在这一行文本中获得三个空格，你应该这样写：`<p>This
    line has &nbsp;&nbsp;&nbsp; three spaces in it.</p>`。你还会注意到，当你在文本编辑器中正确输入这些代码之一时，代码会变为斜体。

    - `&amp;` 用于添加 (&) 和号。`<p>Tim &amp; Mike went fishing.</p>`。结果将是：Tim & Mike went
    fishing.

    - `&lt;` 用于添加 < 小于号。`<p>14 is &lt; 20.</p>`。结果将是：14 is < 20.

    - `&gt;` 用于添加 > 大于号。`<p>20 is &gt; 14.</p>`。结果将是：20 is > 14.

    - `&#63;` 用于添加 ?。这是因为问号可能会与某些编程语言代码混淆。在大多数情况下，你直接输入 `?` 就能正常显示。但如果你想确保浏览器不会产生混淆，可以使用此代码代替问号。

    - `&#8482;` 用于添加商标 Tm 符号。

    - `&copy;` 用于添加版权 © 符号。


    ### 第三章测验


    1. 在 HTML 中如何创建注释？


