- fmt: "\n```html\n</div>\n\n<div class=\"button\">\n<a href=\"tutorials.html\">Tutorials</a>\n\
    </div>\n\n<div class=\"button\">\n<a href=\"programming.html\">Programming</a>\n\
    </div>\n\n<div class=\"button\">\n<a href=\"sourcecode.html\">Source Code</a>\n\
    </div>\n\n<div class=\"button\">\n<a href=\"contactus.html\">Contact us</a>\n\
    </div>\n\n<img src=\"images/logo.png\">\n\n</div>\n</body>\n```\n\nWe have added\
    \ a lot of code to our body element so let's break it all down piece by piece.\n\
    \n## HTML Structure Breakdown\n\n### Header and Class Naming\nWe created an `h4`\
    \ heading that we will use for the top of all of our pages and we put it in an\
    \ HTML `header` element with a class with a name of `topHeader`. As we work on\
    \ this website you will be introduced to some more HTML and CSS code that we haven't\
    \ covered before. There are many many different HTML elements available to you.\n\
    \nThe `header` element is pretty self explanatory and you can use it anywhere\
    \ on your page. It's not only used for the header at the top of your page. \n\n\
    Regarding the class name, there is no spacing in between the two words. This is\
    \ because if we named it like `top header`, you are actually representing two\
    \ separate classes: one named `top` and one named `header`. Notice how the first\
    \ letter of the second word is capitalized. If you have more than one word in\
    \ your name, it is considered good practice to enter it in this way (CamelCase)\
    \ for programming purposes. This is the most common way, but you might also see\
    \ it entered like `top_header` or `top_Header`. It is probably best to stick with\
    \ the first letter of the second word capitalized system. If your name contained\
    \ three words, capitalize the first letter of the second and third word to make\
    \ it more readable. Class names and `id`s can't have spacing, which is why some\
    \ coders use the `_` underscore. It's also important to know that when we create\
    \ our rules in CSS, we need to enter the class names exactly how we entered them\
    \ in our HTML.\n\n### Navigation Bar and Divs\nNext we create a `div` for our\
    \ entire navigation bar with a class name of `navigation`. It is best when you're\
    \ going to put a lot of code inside of a `div` to type both the opening and closing\
    \ tags so that you don't forget to close the `div` later. \n\nIf you're using\
    \ Notepad++, you can click on a `div` tag and Notepad++ will highlight its twin\
    \ tag. In the example above, we have the `navigation` `div` that is holding all\
    \ of our navigation buttons, and all of those buttons have their own `div`s as\
    \ well. So we have `div`s nested inside of `div`s. `div`s can be used for more\
    \ than just positioning parts of your page; they can also be used for things like\
    \ inheriting CSS styles.\n\n### Button Implementation\nThen we set up a `div`\
    \ class and named it `button`. We will re-use this class over and over for all\
    \ of our buttons. In total we set up five separate `div`s with the name `class`\
    \ and the value `button`.\n\nFor our first button, we have an anchor tag:\n```html\n\
    <a href=\"index.html\">Home</a>\n```\nThis points/links to our `index.html` page.\
    \ We gave the button a name of \"Home\", which is the text that you will see on\
    \ the button. We add four more buttons in the same way as our Home button.\n\n\
    ### Adding a Logo\nFinally, there is an example of how you might insert a logo\
    \ below your navigation buttons:\n```html\n<img src=\"images/logo.png\">\n```\n\
    Note that you can remove the `<img src=\"images/logo.png\">` code and the two\
    \ `div` tags that surround the image element if you don't have a logo. You can\
    \ also just comment this entire `div` out by adding the `<!--` and `-->` comment\
    \ code.\n\nIn the example, we add our image element under our buttons but inside\
    \ of our `navigation` `div` so that we can control the logo with our `navigation`\
    \ class. To add a logo, we would create a folder inside of our website folder\
    \ named `images`. Whenever you take an image out of it, you specify the folder\
    \ name first in the file path. For example, if you had a `waterfall.jpeg` image\
    \ saved in the `images` folder, you would add:\n```html\n<img src=\"images/waterfall.jpeg\"\
    >\n```\nAlso know that if you saved it as `.jpg`, you have to enter `images/waterfall.jpg`.\
    \ It's a good idea to pick either `.jpg` or `.jpeg` and always save that type\
    \ of image with the same file format.\n\n## Creating the Linked Pages\n\nWe now\
    \ have the names setup for our navigation bar buttons and the links to make them\
    \ take the user to another page, but those pages don't exist yet. \n\nTo create\
    \ them:\n1. Click **File**, then **New**.\n2. Click **File**, then **Save as**.\n\
    3. Choose the option that includes `.html` in the \"Save as type\" box.\n\nBased\
    \ on the example, you should create the following pages:\n- `tutorials.html`\n\
    - `programming.html`\n- `sourcecode.html`\n- `contactus.html`\n\nIf you entered\
    \ different names for your buttons, save these new documents as the appropriate\
    \ names you specified. Very important: make sure that you save all of these new\
    \ HTML documents into your website folder along with your logo image and/or `images`\
    \ folder.\n"
