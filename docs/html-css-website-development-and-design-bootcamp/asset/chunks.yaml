    \ `h1` 和 `h2` 标题现在都居中了，并且带有一个 4 像素厚的实白色边框。让我们为我们的段落添加一个指定宽度的边框。在你的 `p` 规则中添加此代码：\n\
    \n```css\np {\n  color: red;\n  background-color: black;\n  font-family: tahoma;\n\
    \  font-size: 20px;\n  text-align: center;\n  border-width: 2px;\n  border-color:\
