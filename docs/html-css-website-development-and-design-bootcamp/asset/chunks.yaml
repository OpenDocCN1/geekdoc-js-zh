    Just like the border property you can individually control your margins and padding.
    Below is a list of properties that you could use on any element to control the
    margin and padding amounts individually:


      margin-left:


      margin-right:


      margin-top:


      margin-bottom:


      padding-left:


      padding-right:


      padding-top:


      padding-bottom:


    So now that you have some experience with that you should experiment with these
    properties a little bit. Using these properties on your elements is one way of
    positioning you content on your page. But later in this book we go over positioning
    in more detail and these margin and padding properties will kind of be helpers
    for us. A little bonus exercise that you can do here is go to your body rule and
