    \ 这里我们再次使用字体属性，但这次我们要调整大小。我们希望文本大小为 `20px`。调整大小有几种不同的方式：你可以使用 `%`、`em`、`px`。像素（Pixels）非常常用，也是我们在这里使用的单位。稍后你将看到如何组合不同的值，以便你可以在\
    \ CSS 代码中通过一个值来调整整个网站或特定部分。\n\n`text-align: center;` 在最后一条语句/指令中，我们使用 `text-align`\
    \ 属性并将其设置为 `center`。现在段落中的文本居中对齐了。你在这里还可以使用其他一些值，如 `left`、`right` 和 `justify`。\n\
    \n`}` 不要忘记用闭合花括号结束你的 `p` 规则。\n\n在这个示例中，我们学习了更多属性。现在如果你保存并运行代码，你可能会注意到，尽管我们试图为\
    \ `h1` 标题下的段落设置样式，但我们的代码以完全相同的方式影响了页面上的每一个 `p` 元素。这是正常的。我们的选择器是 `p` 元素，因此任何 `p`\
    \ 元素都会获得相同的样式更改。有两种方法可以具体选择你想要更改的元素：使用类（classes）或 ID（id's）。\n\n另外请知晓，你在规则内部输入语句的顺序并不那么重要。你可能想以某种特定方式排序的主要原因是这样更方便你理解。\n\
    \n### 文本装饰\n\n让我们再看看几个 CSS 文本/字体属性。我们将在 `h1,h2` 规则中添加另一条语句。将此内容添加到花括号内的任意位置：\n\
    \n```css\ntext-decoration: underline;\n```\n\n这里还可以使用其他几个值，如 `overline`、`line-through`\
    \ 和 `none`。`none` 这个值确实有其用途，例如去掉无序列表中的项目符号。\n\n## 加粗与斜体\n\n这是一个快速练习，向你展示如何使文本加粗以及如何使其倾斜。我们将在\
    \ `style` 标签内为无序列表和有序列表创建两个新规则。将这两个新规则直接添加到你的 `p` 规则下方：\n\n```css\nul {\n    font-weight:\
    \ bold;\n}\n\nol {\n    font-style: italic;\n}\n```\n\n再次运行代码，你将得到一个加粗的无序列表和一个斜体的有序列表。如果你想在页面上加粗或倾斜单个单词或仅几个单词，可以直接在代码中使用\
    \ HTML 标签。例如：\n\n`I like things <b>bold</b> but not <em>italicized</em>.`\n\n\
    你用 `<b></b>` 加粗标签包裹任何你想要加粗的词，并使用 `<em></em>` 强调标签来表示斜体词。\n\n## Body 样式与继承\n\n\
    在结束本章之前，让我们去掉那个枯燥的白色背景。我们使用的选择器是 `body`。将此规则放在你的起始 `<style>` 标签之后：\n\n```css\n\
    body {\n    background-color: yellow;\n}\n```\n\n`body` 是其内部所有内容（如 `h1`、`p` 和\
    \ `footer` 元素）的父级。父元素 `body` 的子元素将继承我们在其中指定的属性。这就是我们放置希望在全站生效的代码的地方（例如 `font`、`text-size`、`background-color`）。当我们为像\
    \ `p` 这样的特定元素创建规则时，内部的属性被称为“覆盖”（overrides）。\n\n## 第 12 章测验\n\n1. 用于更改文本大小的属性是什么？\n\
    2. 如何使用 CSS 为文本添加下划线？\n3. 如何更改 body 的背景颜色/壁纸？\n4. 为什么在编码之前规划网站设计是一个好主意？\n5. 在\
    \ CSS 中使用 `body` 规则有哪些优势？\n6. 使文本加粗和倾斜使用的是哪些 HTML 标签？\n7. 使文本加粗和倾斜使用的是哪些 CSS 属性和值？\n\
    \n## 第 13 章：边框\n\n你可以为页面上的任何元素添加边框，无论是图像还是段落。让我们将 `h1` 和 `h2` 标题居中，并在文本周围添加边框。将此内容添加到你的\
    \ `h1,h2` 规则中：\n\n```css\nh1,h2 {\n    background-color: blue;\n    color: white;\n\
    \    text-decoration: underline;\n    text-align: center;\n    border-width: 4px;\n\
    \    border-color: white;\n    border-style: solid;\n}\n```\n\n- `text-align:\
    \ center;` 首先，我们将标题文本居中对齐。\n- `border-width: 4px;` 我们将 `border-width` 属性设置为 4\
    \ 像素厚。\n- `border-color: white;` 接下来，我们告诉浏览器我们希望边框为白色。\n\n"
- fmt: "\n`border-style: solid;` And finally we set our border to solid. There are\
    \ many other values that could have been used here instead of `solid` like `dotted`,\
    \ `dashed`, `double`, `groove`, `ridge`, `inset`, `outset`, `none`, and `hidden`.\
    \ You can try out the other values to see what kind of results you get. We used\
    \ `solid` here because it's a very common style to use for a border.\n\nNow when\
    \ you run your code you should see that both your `h1` and `h2` headings are now\
    \ centered with a 4 pixel thick solid white border. Let's add a border to our\
    \ paragraphs with a specified width. Add this code to your `p` rule:\n\n```css\n\
    p {\n  color: red;\n  background-color: black;\n  font-family: tahoma;\n  font-size:\
    \ 20px;\n  text-align: center;\n  border-width: 2px;\n  border-color: white;\n\
    \  border-style: solid;\n  width: 50%;\n}\n```\n\nRun your new code. You'll now\
    \ see that you have a border around all of your paragraphs and they take up 50\
    \ percent of the width of your screen because we specified that in the `width`\
    \ property. Another thing that you should know is that if you change the size\
    \ of your browser window your paragraphs will change in size as well to match\
    \ the value of 50 percent. So using percent here instead of pixels is good because\
    \ no matter what size computer screen that your viewers have your paragraphs will\
    \ always be 50 percent of their screen. It doesn't have to be 50 percent. This\
    \ is just an example. You could have it be `41%` if that fit you needs when positioning\
    \ and sizing elements on your page.\n\nThese border properties that we just entered\
    \ into our CSS rules can be written in a much simpler way. Some coders prefer\
    \ to code in this way because it's easier for them to understand. If you wanted\
    \ to, you could replace all of these properties below:\n\n`border-width: 2px;`\n\
    `border-color: white;`\n`border-style: solid;`\n\nwith just one line of code.\
    \ And the code would look like this:\n\n`border: 2px solid white;`\n\nThis is\
    \ called shorthand because your combining multiple properties on one line of code.\
    \ This code will do the exact same thing as the `border-width`, `border-color`,\
    \ and `border-height` properties did. It's up to the coder to decide which way\
    \ they prefer.\n\n## The Border-Radius Property / Border With Rounded Corners\n\
    \nThere is another border property that is useful for giving your page a nice\
    \ look and that property is `border-radius`. This property will round the corners\
    \ of the border that you add the code to. Add this code to your `p` rule and run\
    \ it in the browser:\n\n```css\np {\n  color: red;\n  background-color: black;\n\
    \  font-family: tahoma;\n  font-size: 20px;\n  text-align: center;\n  border:\
    \ 2px solid white;\n  border-radius: 20px;\n  width: 50%;\n}\n```\n\nNow you have\
    \ a border with rounded corners at a radius of 20 pixels. You could try other\
    \ values here as well to get the amount of radius that you prefer like `5px` or\
    \ `12px`.\n\nTake notice here that if your run this code in Google Chrome you\
    \ will have rounded corners on your border but if you run it in internet explorer\
    \ you won't. There is a way to fix this and that is by adding a prefix to the\
    \ property. Add this code to your `p` rule:\n\n```css\np {\n  color: red;\n  background-color:\
    \ black;\n  font-family: tahoma;\n  font-size: 20px;\n  text-align: center;\n\
    \  border: 2px solid white;\n  border-radius: 20px;\n  -webkit-border-radius:\
    \ 20px;\n  -moz-border-radius: 20px;\n  width: 50%;\n}\n```\n\n`-webkit-border-radius:\
    \ 20px;` By duplicating the `border-radius:` property code and adding the prefix\
    \ `-webkit-` your border will now have the rounded corners in Internet Explorer.\n\
    \n`-moz-border-radius: 20px;` By duplicating the `border-radius:` property code\
    \ and adding the prefix `-moz-` your border will now have the rounded corners\
    \ in Mozilla Firefox.\n\nAnytime that you have this type of issue you could try\
    \ duplicating your property and adding these prefixes to your code. There are\
    \ some other prefixes that you can use as well. We will use them later in this\
    \ book. Basically in a nutshell, Some of the browsers can display the code fine\
    \ while others won't. These prefixes come from a web kit that makes them compatible.\
    \ It all depends on when the browser gets the updates to be able to accept the\
    \ code. FYI, Even after a browser would get an update for something like this\
    \ where you didn't need the prefixes anymore, The extra code wouldn't mess up\
    \ your page. This is one of the reasons why running your code in multiple browsers\
    \ often is so important. And you will come across this issue with other code.\
    \ Usually it is new code added to HTML or CSS that this happens with. And the\
    \ browser kind of ignores it if it's not set up to know what to do with it. When\
    \ a problem comes up try this technique and it should solve your problem.\n\n\
    ### UPDATE FOR BROWSER PREFIXES\n\nThis is an updated list for browser prefixes\
    \ that you can add to your code to make it work properly in other browsers. I\
    \ figured this will be the best place to add this update since we just started\
    \ discussing prefixes. You can duplicate your code and try these prefixes anytime\
    \ you have this type of issue come up where the code is working differently in\
    \ some browsers. The list below will name the prefix and what browser it will\
    \ affect.\n\n- `-moz-`: Firefox and other browsers that use Mozilla's browser\
    \ engine.\n- `-webkit-`: Safari, Chrome and other browsers that use the Webkit\
    \ engine.\n- `-o-`: Opera.\n- `-ms-`: Internet Explorer. (This doesn't always\
    \ work). If it doesn't try `-webkit-` or `-moz-` but it's probably best to just\
    \ add all four to make sure you have all of your bases covered.\n\nYou could also\
    \ round your border corners independently to get a different look. And to give\
    \ you an example of that instead of the `border-radius` properties that we just\
    \ added you could have coded it like this:\n\n```css\np {\n  color: red;\n  background-color:\
    \ black;\n  font-family: tahoma;\n  font-size: 20px;\n  text-align: center;\n\
    \  border: 2px solid white;\n  border-bottom-left-radius: 20px;\n  border-bottom-right-radius:\
    \ 0px;\n  border-top-left-radius: 0px;\n  border-top-right-radius: 20px;\n  -webkit-border-bottom-left-radius:\
    \ 20px;\n  -webkit-border-bottom-right-radius: 0px;\n  -webkit-border-top-left-radius:\
    \ 0px;\n  -webkit-border-top-right-radius: 20px;\n  -moz-border-bottom-left-radius:\
    \ 20px;\n  -moz-border-bottom-right-radius: 0px;\n  -moz-border-top-left-radius:\
    \ 0px;\n  -moz-border-top-right-radius: 20px;\n  width: 50%;\n}\n```\n\nIf you\
    \ use this code only your top right and bottom left corners of your border will\
    \ have a radius. It gives a pretty nice effect. You could round one corner or\
    \ three, change the radius amounts. It's totally up to you.\n\nAnd as you can\
    \ see we have to duplicate this code three times and add the `-moz-` and the `-webkit-`\
    \ prefixes to make this style compatible in Chrome, IE, and Firefox.\n\nThat's\
    \ gonna wrap up this chapter on borders. You should play around with different\
    \ border properties to get a good feel for how to use them. You can literally\
    \ make thousands of different borders. For example you could have a border with\
    \ only three sides and you can color them all differently. Or have two sides thicker\
    \ than the other two. You could use the properties in many ways. Here is a list\
    \ of some of the useable border properties for you to experiment with. You can\
    \ use these properties on any element that you want to add a border to.\n\n####\
    \ List of border properties\n\n- `border`\n- `border-top`\n- `border-bottom`\n\
    - `border-left`\n- `border-right`\n- `border-top-left`\n- `border-top-right`\n\
    - `border-bottom-left`\n- `border-bottom-right`\n- `border-radius`\n- `border-top-left-radius`\n\
    - `border-top-right-radius`\n- `border-bottom-left-radius`\n- `border-bottom-right-radius`\n\
    \n## Quiz Chapter 13\n\n1. What is a shorthand property?\n2. What are some of\
    \ the benefits of using the `width` property with a percent value instead of a\
    \ pixel value?\n3. What are the names of the two prefixes that can be used to\
    \ try to have your styles take affect in Internet Explorer and Mozilla Firefox?\n\
    4. If you wanted to add a border radius to all four corners of your border, What\
    \ property would you use?\n\n## Chapter 14: Adding CSS inline style\n"
