    - 第 13 章测验\n\n## 第 14 章：添加 CSS 内联样式\n- 第 14 章测验\n\n## 第 15 章：颜色与 CSS 注释\n- RGB\
    \ 颜色\n- 十六进制颜色代码\n- 为 CSS 添加注释\n- 第 15 章测验\n\n## 第 16 章：类与 ID\n- CSS ID\n- 第 16\
    \ 章测验\n\n## 第 17 章：盒模型、外边距与内边距\n- 外边距和内边距属性\n- 第 17 章测验\n\n## 第 18 章：div 与 span\n\
    - span\n- 第 18 章测验\n\n## 第 19 章：块级、行内、行内块级与定位（第一部分）\n- 块级元素\n- 行内元素\n- 行内块级元素\n\
    - 第 19 章测验\n\n## 第 20 章：浮动元素介绍与定位（第二部分）\n- 第 20 章测验\n\n## 第 21 章：绝对定位与固定定位\n-\
    \ 第 21 章测验\n\n## 第 22 章：相对定位\n- 第 22 章测验\n\n## 第 23 章：构建响应式网站布局\n- 任何网页的基本框架\n\
    - 设置我们的 CSS 外部样式表\n- 将 CSS 样式表与 HTML 文档链接\n- 用示例代码完成元标签\n- 创建顶部页眉、导航按钮和 Logo\n\
    - 设置主内容区域\n- 设置子内容区域\n- 为页面底部创建页脚\n- 在外部样式表中进行样式与定位\n- 动画\n- 为更多内容添加样式\n- 主内容的样式、尺寸与定位\n\
    - 子内容的样式、尺寸与定位\n- 完成页脚\n- 响应式代码介绍\n- 为子页面添加内容\n- 第 23 章最终测验\n\n## 第 24 章：将网站发布到互联网上\n\
    \n## 附录\n- 第 1-12 章测验答案\n- 第 13-23 章测验答案\n- 完成本书后的建议\n\n---\n\n# 第 1 章：什么是 HTML？简要概述\n\
    \n超文本标记语言，简称`HTML`，简单来说，是浏览器读取并渲染成可见、可听网页的标准语言。`HTML`并非复杂的编程语言，学习速度相当快。你在互联网上看到的一切几乎都是`.html`文件。这些文件包含标签和元素。目前，你可以将标签和元素视为网页的构建块。要创建网站，你需要将`.html`文件相互链接。因此，当你在网页上点击“首页”按钮时，实际上是在点击网站目录中另一个`.html`文件的链接。`HTML`和`CSS`基本上是一个巨大的工具箱，你可以随意使用其中的工具，而且它一直在进化。所以，你的工具箱中会不断添加更多工具。`HTML`只是一个文本文档。在继续之前，我想指出，如果你在平板电脑上阅读本书，最好以横屏模式查看，这样阅读代码部分会更容易一些。\n\
    \n下面是一个`HTML`文档的视觉示例，让你在开始之前了解你的工作会是什么样子。\n\n```html\n<!doctype html>\n<html>\n\
    <head>\n<title>首页</title>\n</head>\n<body>\n<h1>欢迎来到我的网页！</h1>\n          <p>这是一个基本网页中几个标签和元素的示例。</p>\n\
    <h2>二级标题</h2>\n          <p>这是创建段落元素的方法。</p>\n</body>\n</html>\n```\n\n上面是一个非常基础的`HTML`文档示例，只是为了在你深入其他内容之前给你一个直观印象。但正如你所见，它不过是一个文本文档。这个示例基本上是任何网页的框架。我们稍后会详细讲解所有这些内容以及每一行代码的含义。但如果你从未见过`HTML`，现在至少有了一个概念。就这么简单，对吧？它只是浏览器读取的纯文本指令，没有晦涩难懂的内容。不过，在真正开始编码之前，我想先解释一下代码的各个部分。还有一点我想快速提及的是第一行：`<!doctype\
    \ html>`。这一行并不是一个`HTML`标签。它的作用只是告诉浏览器该网页需要使用哪个版本的`HTML`。这里指定的是`HTML5`。但这已经不是你真正需要担心的事情了。过去，由于存在多个`HTML`版本，你必须指定所使用的版本。后来他们通过这一行代码将其统一了。你只需确保在你创建的每个`HTML`页面的第一行都加上它即可。唯一可能因未指定`HTML`版本而出现问题的情况是，用户试图在非常老旧的浏览器版本中查看你的页面。例如，如果有人多年未更新浏览器，还在使用\
    \ Internet Explorer 7，你的页面可能无法按预期显示。但我不担心这个。只要你有这一行，就应该没问题。顺便说一下，不同版本的`HTML`本质上是相同的，只是有更新或附加功能。正如我们上面提到的，`HTML`就像一个巨大的工具箱，不断有新的、改进的工具加入，让你的工作更轻松。\n\
    \n## 开始编写 HTML 和 CSS 所需的条件\n\n你只需要一个文本编辑器。PC 用户可以直接使用`记事本`，Mac 用户可以使用`文本编辑`。但我推荐下载`notepad++`。它下载很快，并且能为你编写代码带来诸多好处，比如语法高亮。这基本上就是用颜色标记文本，使你的代码更易读。当你想要回头编辑代码时，这尤其有用。如果你是\
    \ Mac 用户，`textwrangler`是个不错的选择。但这取决于你自己。\n\n## 标签与元素\n\n以下是一个`HTML`元素的示例：`<p>欢迎来到我的网页！</p>`\n\
    \n- `<p>` 称为起始标签或开放标签。\n- 文本 `欢迎来到我的网页！` 称为元素的内容。\n\n"
- fmt: "\n- The `</p>` is called the ending or closing tag. (Notice the addition of\
    \ the forward slash `/`). This is what tells the browser that this is an ending\
    \ tag and to move on to the next element.\n- This entire code, the opening tag,\
    \ the content, and the closing tag is called an element.\n\nAlso tags are not\
    \ case sensitive. So `<body>` means the exact same thing to the browser as `<BODY>`.\
    \ It is good practice to use lowercase characters in your tags. And when your\
    \ going to create an element write both the opening and closing tags first, then\
    \ fill in the content. This way you won't forget to close it. Your browser will\
    \ read your HTML from top to bottom so you don't want to have your tags crisscrossing\
    \ each other. Indenting is a good way to organize your code and we will get into\
    \ that later. Another benefit to `notepad++` is if you click on a tag it will\
    \ highlight the other tag that it's connected too. Again this will make more sense\
    \ when we get into the actual coding. There are a few different types of tags\
    \ as well. But this is the most common.\n\n## Tag Attributes\n\nAn HTML tag can\
    \ have attributes. An attribute is a modifier of the tag it is in. They are always\
    \ put in the opening tag and generally have a name and a \"value\". For example:\n\
    \n`<p align=\"center\">The text in this paragraph is center aligned.</p>`.\n\n\
    - The name of this attribute is `align`. Then we add an equals `=` sign.\n- The\
    \ value is `\"center\"`. And the value is always put inside of double quotes.\n\
    - This attribute will center the text in between the tags when it is displayed\
    \ on your web page.\n- So you are telling the browser when it displays this text\
    \ that you want it centered in the middle of your page.\n\nTake note that the\
    \ closing tag does not contain any part of the attribute. Attributes only go in\
    \ the opening tag. Never in the closing tag. And tags can have multiple attributes\
    \ as you will see later in this book.\n\n### Quiz Chapter 1\n\n1. What is HTML?\n\
    2. What is a tag and an element?\n3. What is the difference between an opening\
    \ tag and a closing tag?\n4. What is the first line that you write in any HTML\
    \ document?\n5. What does a tag attribute do?\n\n## Chapter 2: Getting Started\n\
    \nOkay now that you have kind of an idea of what your dealing with here we can\
    \ begin. The first thing I want you to do so that you don't have to do it a few\
    \ chapters from now is go to your desktop, right click, and create a new folder.\
    \ Name it `website`. This is the way you would set up your web pages, images,\
    \ videos, etc. if you were making a website. So we might as well start right from\
    \ there. Now hopefully you downloaded `notepad++` because it will help. Trust\
    \ me you'll thank me for it later. After you have your `website` folder made,\
    \ Open up `notepad++` or `notepad`. Whichever one you decided to use. From the\
    \ top menu click `File` and then `Save as`. Now you want to save your new page\
    \ as `index.html`. This will eventually become your homepage for your website.\
    \ But for now we will use it to learn. And don't forget to add the `.html`. Its\
    \ very important because your browser needs to know this. It can't be `.txt` or\
    \ any other file format.\n\n### Creating Your First Web Page\n\nSo let's begin.\
    \ Enter this text into you text editor. And then we'll break it down piece by\
    \ piece. Remember to use lowercase letters in your HTML tags.\n\n```html\n<!doctype\
    \ html>\n<html>\n<head><title>Main Page</title></head> \n<body>\n</body>\n</html>\n\
    ```\n\n- And that's it. This is the same code that you will use for every HTML\
    \ page you ever create. You will only add in any extra content you want.\n- `<!doctype\
    \ html>` This is called the doctype declaration as you already know and will always\
    \ be the very first line you write for every HTML page you create.\n- `<html>`\
    \ The opening HTML tag. This tag tells the browser that everything you put in\
    \ between this tag and it's closing tag is HTML code.\n- `<head><title>Main Page</title></head>`\
    \ These are your opening and closing `head` tags and `title` tags. I wanted to\
    \ show you that they could be entered like this as an example. The `title` tags\
    \ here would be considered a nested element or nested tags because they are nested\
    \ inside of the `head` tags. Just like the `body` element is nested inside of\
    \ the `html` element. Remember an HTML document is read from top to bottom so\
    \ this would be okay for the browser to understand. But a better, more clear way\
