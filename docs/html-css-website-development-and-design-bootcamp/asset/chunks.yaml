- fmt: "\n# CSS Classes and IDs\n\nWe'll begin with classes. The first thing we need\
    \ to do is remove the inline styles that we added to our `h3` element and our\
    \ `p` element from chapter 14. So delete the `style=\"color:red;font-size:20px;\"\
    ` code and the `style=\"color:purple;font-size:14px;text-align:left;\"` code.\n\
    \nNow you're just left with an `<h3>` element and a `<p>` element without inline\
    \ style code. Our `h3` and `p` elements now take the property values from our\
    \ internal style sheet in the `head` element.\n\n## Using Classes\n\nA class allows\
    \ you to design one specific element or many elements at the same time. While\
    \ all paragraphs might share the same style characteristics specified in a `p`\
    \ rule, classes allow specific paragraphs to have a different set of styles.\n\
    \nTo implement this, add the following code to the opening tags of both your first\
    \ and second `p` elements:\n\n```html\n<p class=\"gray\">\n<p class=\"gray\">\n\
    ```\n\nBy giving a class with the name `gray` to both paragraphs, we can target\
    \ them specifically. It is important to make your class names relevant to their\
    \ purpose.\n\nNow, create a new rule in your internal style sheet. Right after\
    \ the `}` closing curly bracket for your `p` rule, add this code:\n\n```css\n\
    .gray {\n    color: gray;\n}\n```\n\n- `.gray{`: The way we make a rule for a\
    \ class is by adding a `.` (dot) and the class name.\n- `color: gray;`: This sets\
    \ the font color to gray. You can include as many properties and values as needed\
    \ in a class.\n- `}`: Closes the CSS rule.\n\nWhen you run your code, the first\
    \ two paragraphs will have gray text but will still retain other properties from\
    \ the `p` rule. The class is used here to override the font color.\n\n### Reusability\
    \ of Classes\nClasses are reusable. For example, if you create a class rule like:\n\
    \n```css\n.maincontent {\n    background-color: black;\n    color: blue;\n   \
    \ text-align: center;\n    font-family: arial;\n    font-size: 15px;\n}\n```\n\
    \nYou can use `class=\"maincontent\"` inside the opening tag of any HTML element\
    \ (such as `p` or `h1`) that you consider a main content element.\n\n## CSS IDs\n\
    \nAn `id` is very similar to a class and can be used anywhere a class can. However,\
    \ an `id` is specifically used for a unique element that you don't plan on changing\
    \ or repeating, such as a heading or a footer.\n\nTo demonstrate, add this code\
    \ to the opening `<p>` tag nested inside your `<footer></footer>` element:\n\n\
    ```html\n<p id=\"footer\">\n```\n\nNow, in your internal style sheet, under the\
    \ `.gray` rule, add this new rule for the `id`:\n\n```css\n#footer {\n    background-color:\
    \ yellow;\n}\n```\n\n- `#footer{`: For an `id` rule, the selector starts with\
    \ a `#` (hash tag) instead of a `.` (dot).\n- `background-color: yellow;`: Applies\
    \ a yellow background to the `p` element in the footer.\n- `}`: Closes the rule.\n\
    \n### Class vs ID Summary\nWhen choosing between a class or an `id`, ensure it\
    \ makes sense for the element's purpose. Avoid adding a class or `id` to every\
    \ single HTML element, as that defeats the purpose of these selectors.\n\n## Quiz\
    \ Chapter 16\n\n1. Where would you want to use a class?\n2. Where would you want\
    \ to use an `id`?\n3. What symbol do you use in your CSS rule for the class selector\
    \ and the `id` selector?\n\n# Chapter 17: The Box Model, Margin, and Padding\n\
    \nThis chapter focuses on the box model, which is extremely important for positioning\
    \ elements and adding spacing.\n\n## Box Model Diagram\n\n![](images/00001.jpeg)\n\
    \nEvery element on your page is contained within invisible boxes:\n\n- **Content\
    \ Box**: The actual content of the element (text, images, etc.).\n- **Padding**:\
    \ The space between the content and the border.\n- **Border**: The line surrounding\
    \ the padding and content.\n- **Margin**: The space between the element's border\
    \ and other surrounding elements.\n\n## Box Model Example\n\nTo make these boxes\
    \ visible, add the following rule to your internal style sheet for the `h3` element:\n\
    \n```css\nh3 {\n    background-color: gray;\n    border: 5px solid yellow;\n}\n\
    ```\n\nIn this `h3` rule, we used shorthand for the border. Alternatively, you\
    \ could use individual properties: `border-width:`, `border-style:`, and `border-color:`.\n\
    \nTo create space between the text and the border, add `padding` to the `h3` rule:\n\
    \n```css\nh3 {\n    background-color: gray;\n    border: 5px solid yellow;\n \
    \   padding: 25px;\n}\n```\n\nNow there is a 25-pixel padding around all four\
    \ sides of the content. Since no `width` was specified, the border runs the entire\
    \ width of the page.\n"
