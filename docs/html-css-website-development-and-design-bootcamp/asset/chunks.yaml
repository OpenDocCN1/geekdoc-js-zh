    It should be pretty clear what we are doing in this rule. Now since we are going
    to use the exact same rules for our `.bottomContent` class all that we need to
    do is copy this `.topContent` rule that we just made and paste under itself. And
    just change the selector name to `.bottomContent`.


    When you save and run your page you now have a white background, black font, 3
    percent padding to the top and bottom, 5 percent padding to the left and right,
    and a border radius on all four sides of 5 pixels for both the `.topContent` and
    the `.bottomContent` sections. We also gave a margin of 20 pixels to the top of
    both elements to create some separation. So just for a visual your `.bottomContent`
    rule should look like this:


    ```css

    .bottomContent{

    background-color: white;

    color: black;

    padding: 3% 5%;

    margin-top: 20px;

    border-radius: 5px;

    -moz-border-radius: 5px;

    -webkit-border-radius: 5px;

    }

    ```


    Next we have our `.mainContent` rule and we''re just gonna use this `div` to give
    this section''s text a left align. Again you would probably use some of the `div`s
    in this lesson in a different way when creating your own design. The purpose of
    some of this code is to give you more examples of how to use it. You new rule
    under your `.bottomContent` rule should look like this:


    ```css

    .mainContent {

    text-align: left;

    }

    ```


    Let''s work on our `div` with a class name of "content". As we discussed earlier
    depending on the size of your paragraphs/content you may have to adjust your percentages.
    This is normal to do and sometimes you will make adjustments a few times in order
    to get your placement right especially when you add more content to your pages.
    So let''s add this rule to our style sheet:


    ```css

    .content {

    width: 62%;

    padding: 3% 5%;

    float: left;

    }

    ```


    - We want this to be larger than our right content because it is where we would
    put our most important information. So we give it a width of 62 percent.

    - `padding: 3% 5%;` We give it a padding of 3 percent top and bottom and 5 percent
    left and right.

    - `float: left;` Finally we float this `div` to the left as we will with every
    other element that we float. If you read the paragraph in the bottom content HTML
    there is a little explanation of how this works.


    ## Styling, Sizing, And Positioning Our Sub-Content


    We''re done with all of our left side of the page main content. Now we''ll begin
    working on the right side stuff. First add this rule under your `.content` rule:


    ```css

    .topRightSidebar {

    background-color: white;

    color: black;

    font-style: italic;

    text-align: left;

    padding: 1%;

    margin-top: 50px;

    border-radius: 5px;

    -moz-border-radius: 5px;

    -webkit-border-radius: 5px;

    width: 25%;

    float: left;

    }

    ```


    - `.topRightSidebar`: Our selector name is the class of `topRightSidebar`.

    - `background-color: white;`: Sets the background color to white.

    - `color: black;`: Sets the font color to black.

    - `font-style: italic;`: Makes our text italicized.

    - `text-align: left;`: Left align the text.

    - `padding: 1%;`: 1 percent padding on all sides between the text and the border.

    - `margin-top: 50px;`: Here we give a margin to the top of 50 pixels. To get this
    50 pixel amount here this value was changed several times until I got the desired
    placement and that was to line up the tops of the left and right content.

    - `border-radius: 5px;`: And we have a border with a radius of 5 pixels. The next
    two lines are to make sure it displays the same in other browsers.

    - `width: 25%;`: We give it a width of 25 percent because this is our sub content.
    It should be smaller than our main content. And this value of 25 percent was achieved
    by tweaking the value until it looked good and fit nicely.

    - `float: left;` Finally we float this element left. And since we set a width
    for our main content and left room for the right content it will float to the
    left of our top content. This works in this way because we set the widths to the
    right amount so that they would fit side by side. If there wasn''t enough room
    it would have displayed on the left hand side of the screen underneath all of
    our main section which we don''t want.


    Now for both the `.middleRightSidebar` and the `.bottomRightSidebar` we are just
    going to copy our entire `.topRightSidebar` rule and paste it below itself two
    more times. We just change the selector names to match and the values are all
    the same except for one. So your next two rules should look like this underneath
    your `.topRightSidebar` rule:


    ```css

    .middleRightSidebar {

    background-color: white;

    color: black;

    font-style: italic;

    text-align: left;

    padding: 1%;

    margin-top: 10px;

