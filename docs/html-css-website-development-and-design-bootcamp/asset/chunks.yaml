  trans: "\n# 链接到外部网站\n\n本章我们要学习的最后一种链接方式是链接到外部网站。我们将在页脚内部创建一个链接，点击后用户将被带到 Google\
    \ 搜索引擎。让我们在之前创建的“返回顶部”链接代码之后、闭合 `</body>` 标签之前添加这段代码。\n\n顺便说一下，这始终是您放置页面底部页脚的位置。您可以在代码的其他区域使用页脚。但是如果您按照其通常的用途使用它，也就是作为网页最底部的页脚，您需要将代码作为在\
    \ body 元素闭合之前的最后一项添加，因为浏览器从上到下读取代码。所以在这里添加这段代码：\n\n```html\n<footer>\n    <p>\
    \ <a href=\"http://www.google.com\">Click me</a> to go to Google search.</p>\n\
    </footer>\n```\n\n就这么简单，让页面上的任何文本成为可点击的链接。我们为页面创建了一个页脚，其中嵌套了一个 `p` 元素，锚点元素嵌套在其中。您还可以通过创建无序列表并在列表项\
    \ `<li></li>` 标签之间添加链接来制作链接列表。您可以添加一个标题，比如“我最喜欢的网站”。您只需像这样添加锚点标签：\n\n```html\n\
    <ul>\n    <li><a href=\"http://www.google.com\">Go to Google</a></li>\n    <li><a\
    \ href=\"http://www.yahoo.com\">Go to Yahoo</a></li>\n</ul>\n```\n\n这就结束了本章关于链接的内容。多尝试不同的方式添加链接，您很快就会像专家一样使用链接。在本书后面，当我们开始为网站创建多个网页时，我们将学习如何将所有页面相互链接。\n\
    \n## 测验 第 7 章\n\n1. 这个标签的名称是什么？`<a>`。\n2. `href` 属性有什么作用？\n3. 使用什么特殊符号来告诉锚点您链接到同一页面内的内容？\n\
    4. 说出两种可以在网页中使用链接的方式？\n5. 您始终想在哪个位置添加页面底部页脚的代码？\n\n# 第 8 章：创建输入表单\n\n在本章中，我们将学习如何创建几种不同类型的输入表单。要使它们按您想要的方式运行，需要涉及一些步骤。例如，如果您想将用户输入的信息保存到数据库中，您需要使用像\
    \ `JavaScript` 这样的编程语言。这是在您学习 HTML 和 CSS 之后需要了解的内容。\n\n但在本课程中，我们只关注实际创建表单并将其添加到网页。如果您愿意，可以跳过本章，稍后再回来学习，因为您在这里学到的编码在进入更高级的内容时会更有用。\n\
    \n## 单行文本框和提交按钮\n\n那么我们从文本框开始（用户可以输入某种信息的输入字段，例如电子邮件地址、密码等）。让我们开始创建文本框。在开口 `<body>`\
    \ 标签之后添加以下内容：\n\n```html\n<form action=\"\" method=\"\">\n    <input type=\"text\"\
    \ name=\"\">\n</form>\n```\n\n- 如您所见，我们有开口和闭合的 `form` 标签，以及嵌入在它们之间的 `input` 元素。不要过于担心这些\
    \ `form` 标签和开口标签中的属性。这些 `form` 标签只是告诉浏览器这是一个表单，而开口标签内的属性是您在学习 `JavaScript` 时才会了解的内容。\n\
    - `<input type=\"text\" name=\"\">` 这是我们的输入元素。它是将文本框实际放到页面上的代码。没有这个，页面上什么都不会显示，因为\
    \ `form` 元素基本上只是一个用于容纳输入元素的容器。同样，现在不用担心属性。在这个练习中，我们只是学习如何创建输入字段。因为我们想要创建一个文本框，所以我们将\
    \ `input type` 指定为 `text`。这不需要闭合标签。\n\n如果您保存并运行此代码，您将在页面顶部获得一个文本框。比如说，如果我们想要两个单行文本框供用户输入用户名和密码，我们只需要在第一个下面添加另一个\
    \ `input` 元素，如下所示：\n\n```html\n<form action=\"\" method=\"\">\n    <input type=\"\
    text\" name=\"\">\n    <input type=\"text\" name=\"\">\n</form>\n```\n\n这会在同一行上并排显示两个框。为了让它看起来更好，我们会在它们之间添加两个换行符：\n\
    \n```html\n<form action=\"\" method=\"\">\n    <input type=\"text\" name=\"\"\
    >\n    <br/>\n    <br/>\n    <input type=\"text\" name=\"\">\n</form>\n```\n\n\
    如果您想更改文本框的长度，只需在 `input` 元素中添加 `size` 属性：\n\n```html\n<input type=\"text\" name=\"\
    \" size=\"40\">\n```\n\n现在第一个文本框长度为 40 像素，第二个框为默认大小。让我们为表单添加一些标签。放入此代码，然后我们将对其进行解释：\n\
    \n```html\n<form action=\"\" method=\"\">\n    <label for=\"name\">Username:</label>\n\
    \    <input type=\"text\" id=\"name\" name=\"\">\n    <br/>\n    <br/>\n    <label\
    \ for=\"password\">Password:</label>\n    <input type=\"text\" id=\"password\"\
    \ name=\"\">\n</form>\n```\n\n- `<label></label>` 这些是标签元素标签。此元素必须闭合。\n- `for=`\
    \ 这是我们的 `for` 属性。它放在开口标签中。这个 `for` 属性会与另一个属性关联。\n- `\"name\"` 这是我们的属性值。这个值会与其配对的值关联。\n\
    - `>Username` 这是将显示在我们标签上的文本。\n- `</label>` 然后我们闭合标签元素。\n\n"
- fmt: "\n## Form Layout Basics\n\n`id=\"name\"` This is the attribute name and value\
    \ we added to the text-box element that we wanted to assign the label to. And\
    \ the value `\"name\"` is what ties this value to the label value. It has to match\
    \ it's counterpart exactly to link to it. When I say link to each other I mean\
    \ that the browser knows that this value is tied to another twin value and that\
    \ lets the browser know where you want to put the label that you just created.\n\
    \nWe now have a form that has a Username and a Password text-box for your user\
    \ to enter their information into. And as I said this lesson was just to teach\
    \ you how to create the layout of a form. When you get to the point of making\
    \ your website user interactive, the information that would be entered into these\
    \ two text-boxes would be sent to a server where the data would be processed and\
    \ then we could do something with it. But the user would need to have a button\
    \ to click or someway of submitting the data. So to finish our form layout were\
    \ gonna add a submit button. Enter this new code inside of our form element right\
    \ after the `<input type=\"text\" id=\"password\" name=\"\">` line:\n\n```html\n\
    <form action=\"\" method=\"\">\n <label for=\"name\">Username:</label>\n <input\
    \ type=\"text\" id=\"name\" name=\"\">\n <br/>\n <br/>\n <label for=\"password\"\
    >Password:</label>\n <input type=\"text\" id=\"password\" name=\"\">\n <br/>\n\
    \ <br/>\n <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n- `<br/><br/>`\
    \ We've added two line breaks to position our button a little better.\n- `<input\
    \ type=\"submit\">` Then we add another input element. This time we have the `input`\
    \ type set to `submit` instead of `text`. This just tells the browser that we\
    \ want a submit button.\n- `value=\"Submit\">` And this is the text that we put\
    \ on the button. You could have entered something different like `Post` for the\
    \ buttons text if you wanted to.\n\nAnd if you run your code you'll see our completed\
    \ form with our new Submit button. You can click on it but it won't actually do\
    \ anything because we haven't added any function to the button with any programming.\
    \ That comes way later after we first learn how to create and design an entire\
    \ web page or website.\n\n## Creating A Multi-Line Text-Box\n\nThe next thing\
    \ we're gonna learn is how to make a multi-line text-box. And the reason we didn't\
    \ learn this in the above example is that the code for creating a multi-line text-box\
    \ is very different from a single line text-box. So clear out everything in between\
    \ your form tags. Or if you want to keep that example on your page for now you\
    \ can just create another set of form tags underneath the first form that we created.\
    \ We will be making a few different types of forms so you might want to keep the\
    \ code for each of them there so that you can review them all and compare the\
    \ differences. The code that we need to enter for the multi-line text-box is:\n\
    \n```html\n<br/>\nFeedback:\n<form action=\"\" method=\"\">\n <textarea rows=\"\
    10\" cols=\"20\"></textarea>\n <br/>\n <br/>\n <input type=\"submit\" value=\"\
    Send Feedback\">\n</form>\n<br/>\n```\n\n- We'll go through this step by step.\
    \ We added a line break to create some space in between our two forms in case\
    \ you kept the first one on your page.\n- `Feedback:` Here we added a heading/label\
    \ with just simple text. There are many ways you can add headings, labels, etc.\
    \ to your page. This was an example of how text would appear on your page without\
    \ any tags. But be aware that because we entered a label in this way that it's\
    \ not tied into the form. As you can see it's not even inside of the form element.\
    \ So if we want to reposition our form our anything like that this `Feedback:`\
    \ label would have to be adjusted separately. This way is okay to add text if\
    \ the text that your creating is permanent. I.E. your never going to move it or\
    \ do anything to it. So it's always better to put your content in between some\
    \ tags whether its a `<p>` element, a `<h1>` element, or anything else that would\
    \ fit your needs.\n- `<form action=\"\" method=\"\">` We add our opening form\
    \ tag to tell the browser that this is a form.\n- `<textarea rows=\"10\" cols=\"\
    20\"></textarea>` This is the code that actually creates the multi-line text-box.\
    \ As you can see it is much different from the code to create a one-line text-box.\
    \ But this is the way it was set up for the browser to understand. It's a `textarea`\
    \ element and it has to have a closing tag. For the `rows` and columns (`cols`)\
    \ you can add any numbers you want in here. So if you wanted 25 rows and 50 columns\
    \ that would be fine.\n- `<br/><br/>` Again we add a couple of line breaks to\
    \ create some space. Play around with the line breaks. See where the browser would\
    \ display the Send Feedback button without any line breaks, and then where the\
    \ button would be if you only added one line break here. It's important to try\
    \ different things with your code. Experiment with it and you'll find that you\
    \ will accidentally get results that you like from time to time. Remember your\
    \ the boss and you tell the browser what to do.\n- `<input type=\"submit\" value=\"\
    Send Feedback\">` We add our submit button but this time we set the text on the\
    \ button to `Send Feedback`.\n- `</form>` We close out our form.\n- `<br/>` And\
    \ we added a line break at the end to create space between this form and the next\
    \ element that will be displayed under it.\n\nSave and run your code. And now\
    \ you have your multi-line text-box created with a Send Feedback button. Note,\
    \ If add a bunch of lines of text in your text-box that wouldn't fit in the text-box\
    \ size that you specified you will notice that a scroll bar appears on the right\
    \ side. The browser does this for us automatically.\n\n## Number Input Box\n\n\
    There is one more input form that we are going to make before ending this chapter.\
    \ And that is a number input box. Add this code after your multi-line text-box\
    \ form.\n\n```html\n<form action=\"\" method=\"\">\n How old are you?<br/>\n <input\
    \ type=\"number\" min=\"0\" max=\"99\">\n</form>\n```\n\n- `<form action=\"\"\
    \ method=\"\">` First open your form element.\n- `How old are you?<br/>` We add\
    \ our question here and a line break.\n- `<input type=\"number\" min=\"0\" max=\"\
    99\">` Then we enter our input element with the type `number`. We also specified\
    \ a minimum and a maximum number for the user to input with the `min` and `max`\
    \ attributes. Note that if you choose to not put in the `min` and `max` attributes\
    \ your input box will display longer in length. Since we specified a two digit\
    \ number as the `max` value the length of the box for this example will be shorter.\
    \ Also be aware that the size may vary depending on what browser the user is using.\n\
    - `</form>` And we close our form element.\n\nIf you go ahead and run your code\
    \ with the attributes and then without you will see the difference in the length\
    \ of the box. Also if you run this code in the newest version of internet explorer\
    \ you'll see that this browser will let you enter text but if you run it in Google\
    \ chrome it will not. It will only allow numbers. Another thing you might have\
    \ noticed is that when you run it in I.E. there are no up and down arrows for\
    \ the user to click to adjust the number and if you enter a number like `101`\
    \ that is greater than our `max` value, when you hover over the little x button\
    \ that appears you will get a dialogue that pops up and says \"You must enter\
    \ a value between 0 and 99\". This is a good example of why it's important to\
    \ run your code in more than one browser when testing. You can see here how two\
    \ browsers will display your page differently. Usually the differences are minimal\
    \ and you won't have to worry about it. But there are times that one browser might\
    \ not display a portion of your page at all. And in that case you would have to\
    \ make some adjustments.\n\n## Quiz Chapter 8\n\n1. What element is used to create\
    \ a single line or a multi-line text-box?\n2. How do you add an embedded label\
    \ to your form?\n3. When creating a button, Where would you enter the text that\
    \ would display on the button?\n4. What do you need in order to make your form\
    \ function?\n5. What were the attributes `min` and `max` used for in this chapter?\n\
    \n## Chapter 9: More form layouts\n"
