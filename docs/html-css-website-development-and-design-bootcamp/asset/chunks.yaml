  trans: '

    当你积累了足够的 HTML 和 CSS 经验后，应该考虑学习 JavaScript 基础——然后是 jQuery，或者 PHP。这些编程语言可以对你的网站产生巨大影响。JavaScript
    更多用于让你的页面具有交互性，而 PHP 是一种服务器端编程语言。这意味着它被用于服务器端表单验证，以及在你上传网站的 Web 服务器上后台运行的其他网站隐藏功能。表单验证在许多方面都非常重要，特别是如果你计划制作社交媒体网站。诸如验证用户名和密码、待处理的问卷答案等，都是通过
    PHP 完成的。进一步了解每一种语言，看看哪一种最符合你对网站的设。这些编程语言在很多方面都是相似的，而且学习起来并不太困难。如果你学习在 Web 开发中超级受欢迎的
    JavaScript，你其实只需要上一门基础课程即可。JQuery 基本上是一个你从网上下载并放入网站文件夹的文件。它的作用是将非常长且复杂的代码简化为简单微小的代码段，且实现相同的功能。JQuery
    易学且非常有趣。这完全取决于你以及你想做什么。我建议先学习 JavaScript 基础，然后是 JQuery，这样你就能轻松地让页面具有用户交互和动画效果。然后你可以查看
    PHP，让你的网站具备动态更新的能力。所有这些元素的结合，可以创造出 Web 开发人员和设计师最近才开始的精彩动态专业网站。不要为 Web 开发中需要学习的知识过多感到压力。你已经拥有制作优秀网站所需的所有工具。这些编程语言是你可以添加的额外功能，而且还有更多。JavaScript、JQuery
    和 PHP 是最受欢迎的。当你以及开始学习编程语言时，你会发现其他一些语言在很多方面是多么相似。而且对它们进行实验真的很有趣。


    这本书就到此结束。祝你在这成为优秀 Web 开发人员和设计师的道路上一切顺利。感谢你选择这本书，我希望你从中获益匪浅。请留下评价，告诉我你的想法。有什么你想要学习但我没有包含的内容吗？有什么你不喜欢的地方吗？书的排版易于理解吗？你对测验觉得如何？如果你有任何建议，请告诉我，以便我未来为你提供尽可能优质的内容。再次感谢大家。你们不知道这对我意味着多大。


    祝好运，


    Clear Coded Programming

