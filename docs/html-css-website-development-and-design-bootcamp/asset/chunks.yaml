    background-color: black;

    color: white;

    font-size: 90%;

    font-style: italic;

    clear: both;

    float: left;

    }

    ```


    - `.mainFooter p`: 这个选择器用于样式 `mainFooter` 类中的 `p` 元素。

    - `width: 100%;`: 我们给它设置了 100% 的宽度。

    - `background-color: black;`: 背景颜色设置为黑色。

    - `color: white;`: 字体颜色设置为白色。

    - `font-size: 90%;`: 在这里我们将字体大小设置为默认值的 90%。90% 经常用于页脚，以便将其与所有内容隔开。

    - `font-style: italic;`: 我们将字体变为*斜体*。

    - `clear: both;`: 这个属性和值只是确保没有任何东西出现在我们页脚的左侧或右侧。

    - `float: left;`: 我们将其左浮动。这就是为什么页面底部页脚是在关闭 `body` 标签之前添加到 HTML 中的，因为我们希望它显示在底部，而不是与其他任何元素并排显示。


    ## 代码介绍


    我们需要的其他 CSS 代码是让我们的网页具有响应式的代码，基本上这意味着重写我们的一些 CSS 规则，以便在在较小的屏幕上查看或浏览器窗口最小化时发生我们希望的数值变化。这就是你测试响应式代码的方法，以确保它按照你的预期工作。你将添加规则，保存并运行页面，全全屏查看，然后将其缩小到最小尺寸，同时确保所有的元素都调整或移动到了你想要的位置。这是你在外部样式表中放置
