- fmt: "\n# Linking to External Sites\n\nThe last way to link that were gonna learn\
    \ in this chapter is how to link to an external site. We are gonna create a link\
    \ right inside of a footer that when clicked the user will be taken to the Google\
    \ search engine. Let's add this on the line after the Back To Top link code that\
    \ we created earlier and right before the closing `</body>` tag. \n\nBy the way\
    \ this is always where you would want to put your bottom of the page footer. You\
    \ can use the footer in other area's of your code. But if your using it in the\
    \ way that it's normally intended for, Which is a footer at the very bottom of\
    \ your web page, you want to add your code as the last thing before the body element\
    \ is closed out because the browser reads the code from top to bottom. So add\
    \ this code there:\n\n```html\n<footer>\n    <p> <a href=\"http://www.google.com\"\
    >Click me</a> to go to Google search.</p>\n</footer>\n```\n\nIt's that simple\
    \ to make any text on your page a click-able link. We created a footer for our\
    \ page that has a `p` element nested inside of it with an anchor element nested\
    \ inside of that. You could also make a list of links by creating an unordered\
    \ list and adding your links in between you list item `<li></li>` tags. And you\
    \ can add a heading that says something like \"My Favorite Sites\". You would\
    \ just add the anchor tags like so:\n\n```html\n<ul>\n    <li><a href=\"http://www.google.com\"\
    >Go to Google</a></li>\n    <li><a href=\"http://www.yahoo.com\">Go to Yahoo</a></li>\n\
    </ul>\n```\n\nThat's gonna wrap up this chapter on links. Play around with adding\
    \ links in different ways and you'll be linking like a pro in no time. Later in\
    \ this book when we start creating multiple web pages for our website we'll learn\
    \ how to link all of our pages to each other.\n\n## Quiz Chapter 7\n\n1. What\
    \ is the name of this tag? `<a>`.\n2. What does the `href` attribute do?\n3. What\
    \ special symbol do you use to tell the anchor that you are linking to something\
    \ within the same page?\n4. Name two ways that you could use links in your web\
    \ page?\n5. In what place do you always want to add the code for your bottom of\
    \ the page footer?\n\n# Chapter 8: Creating Input Forms\n\nIn this chapter we\
    \ will be learning how to create a few different types of input forms. There are\
    \ a few steps involved in order to make them function the way you want. For example\
    \ if you wanted to save the information that the user entered into a database,\
    \ you would need to use a programming language like `JavaScript`. And that is\
    \ something to look into after you learn HTML and CSS. \n\nBut for this lesson\
    \ we are just gonna be focusing on actually creating the forms and adding them\
    \ to our web page. You can skip this chapter and come back to it later if you\
    \ like because the coding that you will learn here is gonna be a lot more useful\
    \ when you get into the more advanced stuff.\n\n## One Line Text-Box And Submit\
    \ Button\n\nSo we'll start with the text-box (the input field that the user would\
    \ enter some type of information into like an e-mail address, a password, and\
    \ so on). Let's start creating our text-box. Right after the opening body tag\
    \ `<body>` add this:\n\n```html\n<form action=\"\" method=\"\">\n    <input type=\"\
    text\" name=\"\">\n</form>\n```\n\n- As you can see we have opening and closing\
    \ `form` tags and an `input` element embedded in between them. Don't worry too\
    \ much about these `form` tags and attributes that are in the opening tag. These\
    \ `form` tags just tell the browser that this is a form and the attributes inside\
    \ of the opening tag are something you'll learn when you get into `JavaScript`.\n\
    - `<input type=\"text\" name=\"\">` This is our input element. It is the code\
    \ that actually puts the text-box on our page. Without this there would be nothing\
    \ displayed because the `form` element is basically just a container to hold our\
    \ input elements. Again don't worry about the attributes for now. In this exercise\
    \ we are just learning how to create the input field. Since we want to create\
    \ a text box we specified the `input type` as `text`. And this does not need a\
    \ closing tag.\n\nIf you save and run this code you will get a text box right\
    \ at the top of your page. Say if we wanted two one line text boxes for the user\
    \ to put a username and password in, all we would have to do is add another `input`\
    \ element under the first one like so:\n\n```html\n<form action=\"\" method=\"\
    \">\n    <input type=\"text\" name=\"\">\n    <input type=\"text\" name=\"\">\n\
    </form>\n```\n\nThis would give us two boxes side by side on the same line. To\
    \ make it look a little better we'll add two line breaks in between:\n\n```html\n\
    <form action=\"\" method=\"\">\n    <input type=\"text\" name=\"\">\n    <br/>\n\
    \    <br/>\n    <input type=\"text\" name=\"\">\n</form>\n```\n\nIf you wanted\
    \ to change length of your text box, you just add the `size` attribute to your\
    \ `input` element:\n\n```html\n<input type=\"text\" name=\"\" size=\"40\">\n```\n\
    \nNow the first text box is 40 pixels in length and the second box is the default\
    \ size. Let's add some labels to our form. Put in this code and then we'll go\
    \ over it:\n\n```html\n<form action=\"\" method=\"\">\n    <label for=\"name\"\
    >Username:</label>\n    <input type=\"text\" id=\"name\" name=\"\">\n    <br/>\n\
    \    <br/>\n    <label for=\"password\">Password:</label>\n    <input type=\"\
    text\" id=\"password\" name=\"\">\n</form>\n```\n\n- `<label></label>` These are\
    \ the label element tags. This element has to be closed.\n- `for=` This is our\
    \ `for` attribute. It goes in our opening tag. This `for` attribute will link\
    \ up with another attribute.\n- `\"name\"` This is our attribute value. And this\
    \ is the value that will link to its twin value.\n- `>Username` This is the text\
    \ that will display for our label.\n- `</label>` Then we close the label element.\n"
