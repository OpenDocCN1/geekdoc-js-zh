    \ we'll have columns and rows. FYI, rows are left to right (horizontal) and columns\
    \ are up and down (vertical). That used to trip me up when I first started coding.\
    \ I can't tell you how many times that I made a table the opposite way I wanted\
    \ to. Which brings up the point again of how important it is to save and run your\
    \ code often. Even when your in the middle of creating an element that contains\
    \ a lot of code. For example if you are creating a table that has many rows and\
    \ columns and accidentally entered your table information in the wrong way, it\
    \ would really be a pain to go back and change all of your code to fix the mistake.\
    \ It's better to catch things like this early. Trust me it will save you a lot\
    \ of headache. So under your ordered list go ahead and add this code:\n\n<!--This\
    \ is our table-->\n\n<table>\n\n<tr>\n\n         <th>Meats</th>\n\n         <th>Fruits</th>\n\
    \n         <th>Desserts</th>\n\n</tr>\n\n<tr>\n\n         <td>Bacon</td>\n\n        \
    \ <td>Banana</td>\n\n         <td>Chocolate cake</td>\n\n</tr>\n\n</table>\n\n\
    <table> First the opening table tag tells the browser that this is a table. Above\
    \ this tag is just a comment for us to view only. Remember comments will not display\
    \ on the web page.\n\n<tr> Then the table row opening tag starts a row. Remember\
    \ this will display left to right.\n\n<th></th> These are the table header tags.\
    \ So this is where we put the header for each row. They will also display from\
    \ left to right. And the table header element is inside of the table row element.\
    \ In our exercise we have three table header elements.\n\n</tr> Then we close\
    \ the table row for our headers.\n\n<tr> We add a new row to start adding our\
    \ data.\n\n<td></td> Add the table data tags with the data to be displayed from\
    \ left to right for all three table data elements.\n\n</tr> Then we close out\
    \ this row.\n\n</table> And Finally we close the entire table.\n\nNow when you\
    \ run this in your browser you'll notice a few things. The browser will automatically\
    \ bold and center your table headers. It will center a header based off of the\
    \ largest data element in the column. So as you can see the last column's header\
    \ is pushed farther to right because of the size of the data underneath it. You\
    \ can also see that there are no walls or borders. They are there but are invisible\
    \ at the moment. We can make them visible by using tag attributes directly in\
    \ HTML. Add this to your opening table tag that we just created:\n\n<table border=\"\
    1\" style=\"width:100%\">.\n\nWhen you run you'll see that you get a border that\
    \ spans the width of your web page. If you change value in your width property\
    \ to 50% you will get a table that spans exactly half of your page. You can play\
    \ around with the size to get the result you want. To adjust the thickness of\
    \ your border you can change the value in your border property from 1 to 2 or\
    \ whatever you want. Note that this number is a pixel value. I'm not gonna get\
    \ into styling in this way too much because this way of styling is pretty much\
    \ old news. Nowadays we use CSS for pretty much all of our styling needs. But\
    \ I just wanted to give you an example.\n\nAdding more rows is simple. Just copy\
    \ and paste and change the content. For example add this right under your closing\
    \ table data row tag </tr>:\n\n<tr>\n\n         <td>Bacon</td>\n\n         <td>Banana</td>\n\
    \n         <td>Chocolate cake</td>\n\n</tr>\n\n<tr>\n\n          <td>Ham</td>\n\
    \n          <td>Pineapple</td>\n\n          <td>Yogurt</td>\n\n</tr>\n\n</table>"
