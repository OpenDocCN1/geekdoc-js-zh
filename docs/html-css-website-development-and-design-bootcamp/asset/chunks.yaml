    保存并运行你的页面，现在你用`span`标签包围的文字会高亮显示为黄色。`span`元素的其他用途包括加粗或斜体文本。在这种情况下，你可以创建一个`.bold`规则和一个`.italic`规则。你可以反复使用它们。你甚至可以组合这些类。例如，如果你想同时加粗和斜体某些文本，你可以创建一个名为`.boldital`或类似的类。然后你可以在网站的任何地方使用这个规则。


    这里你还需要知道一件事，在上面的例子中，我们使用了一个类来为`span`添加 CSS。但你也可以使用内联样式。同样，这取决于你更喜欢哪种编码方式。使用带有内联
    CSS 样式的`span`看起来像这样：


    ```html

    <span style="background-color: yellow">text color, size, and alignment properties</span>

    ```


    你不需要在内部样式表中创建类规则，因为你是在内联样式。你可以在这里设置多个属性。但你可以看到，如果你在所有元素中都这样做，会变得混乱且有些令人困惑。我建议使用内部或外部样式表。外部样式表是最常用的方法，因为你可以在一个文档或多个文档中控制所有
    CSS，对于非常大的网站尤其如此。你将在本书后面看到这一点。


    ## 第 18 章测验


