    width of the screen where as an inline element will take up the space it needs
    and leave the extra room to the side of it for the next element.


    When we start using block and inline elements your gonna notice some strange things
    going on with our margins. That is because a block element handles margins differently
    from a inline element. And really this is something that has to be adjusted at
    the time when your creating your content. You''ll have to make some changes to
    the margin amounts to get the spacing that you want between the elements. To try
    to simplify what you will see happening with the margins, If you had two block
    elements with a margin of 20 pixels on the top and bottom, You might think that
    you would have a space of 40 pixels between the two. But that''s not the case
    with a block element. It will kind of split the 40 pixels in half. On the other
    hand an inline element will add the two margins. So there would be a bigger margin
    space. This really isn''t that important at this time. Like I said it kind of
    has to be dealt with as your creating your page. You can plan out your site as
    much as you want but their will always be some alterations that you''ll have to
    make to get the exact results that you want. You should also know that we will
    be able to convert inline elements to block elements, and the other way around
    to fit our needs. One example would be that we convert an inline to a block for
    centering purposes. The reason for this is because you can''t center an inline
    element. This will all become more clear when we''re developing our responsive
    website.


    Inline-Block Elements'
