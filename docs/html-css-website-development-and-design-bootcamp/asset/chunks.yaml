  raw: '-The </p> is called the ending or closing tag. (Notice the addition of the
    forward slash / ). This is what tells the browser that this is an ending tag and
    to move on to the next element.


    -This entire code, the opening tag, the content, and the closing tag  is called
    an element.


    Also tags are not case sensitive. So <body> means the exact same thing to the
    browser as <BODY>. It is good practice to use lowercase characters in your tags.
    And when your going to create an element write both the opening and closing tags
    first, then fill in the content. This way you won''t forget to close it. Your
    browser will read your HTML from top to bottom so you don''t want to have your
    tags crisscrossing each other. Indenting is a good way to organize your code and
    we will get into that later. Another benefit to notepad++ is if you click on a
    tag it will highlight the other tag that it''s connected too. Again this will
    make more sense when we get into the actual coding. There are a few different
    types of tags as well. But this is the most common.


    Tag Attributes


    An HTML tag can have attributes. An attribute is a modifier of the tag it is in.
    They are always put in the opening tag and generally have a name and a "value".
    For example:


    <p align="center">The text in this paragraph is center aligned.</p>.


    -The name of this attribute is align. Then we add an equals = sign.


    -The value is "center". And the value is always put inside of double quotes.


    -This attribute will center the text in between the tags when it is displayed
    on your web page.


    -So you are telling the browser when it displays this text that you want it centered
    in the middle of your page.


    Take note that the closing tag does not contain any part of the attribute. Attributes
    only go in the opening tag. Never in the closing tag. And tags can have multiple
    attributes as you will see later in this book.


    Quiz Chapter 1


    1.What is HTML?


    2.What is a tag and an element?


    3.What is the difference between an opening tag and a closing tag?


    4.What is the first line that you write in any HTML document?


    5.What does a tag attribute do?


    Chapter 2: Getting Started


    Okay now that you have kind of an idea of what your dealing with here we can begin.
    The first thing I want you to do so that you don''t have to do it a few chapters
    from now is go to your desktop, right click, and create a new folder. Name it
    website. This is the way you would set up your web pages, images, videos, etc.
    if you were making a website. So we might as well start right from there. Now
    hopefully you downloaded notepad++ because it will help. Trust me you''ll thank
    me for it later. After you have your website folder made, Open up notepad++ or
    notepad. Whichever one you decided to use. From the top menu click File and then
    Save as. Now you want to save your new page as index.html. This will  eventually
    become your homepage for your website. But for now we will use it to learn. And
    don''t forget to add the .html. Its very important because your browser needs
    to know this. It can''t be .txt or any other file format.


    Creating Your First Web Page


    So let''s begin.  Enter this text into you text editor. And then we''ll break
    it down piece by piece. Remember to use lowercase letters in your HTML tags.


    <!doctype html>


    <html>


    <head><title>Main Page</title></head> 


    <body>


    </body>


    </html>


    And that''s it. This is the same code that you will use for every HTML page you
    ever create. You will only add in any extra content you want.


    <!doctype html> This is called the doctype declaration as you already know and
    will always be the very first line you write for every HTML page you create.


    <html>  The opening HTML tag. This tag tells the browser that everything you
    put in between this tag and it''s closing tag is HTML code.


    <head><title>Main Page</title></head> These are your opening and closing head
    tags and title tags. I wanted to show you that they could be entered like this
    as an example. The title tags here would be considered a nested element or nested
    tags because they are nested inside of the head tags. Just like the body element
    is nested inside of the HTML element. Remember an HTML document is read from top
    to bottom so this would be okay for the browser to understand. But a better, more
    clear way to write it would be:


    <head>


    <title>Main Page</title>


    </head>


    There a few things to go over here. Notice how I indented the title element line.
    Indenting your code will help keep it more organized and readable too. Especially
    when you have a bunch of code on the page. It is up to you how you want to organize
    your code but this is the way that an experienced coder might enter it. Now back
    to the tags. Also you will hear coders refer to this, <title>Main Page</title> 
    in different ways. They might call it the tag, the element, or even the tag element.
    Later in this book when we have two tags with content in between I will refer
    to it as an element. But for learning purposes I''m going to refer to it as both
    tag and/or element for now. Okay the head tags are used for a few things. First
    is to hold the title of the page like in the above example. They are also used
    for other things like keywords for the search engine, meta data, etc. We''ll talk
    about these things later. For now their just holding the title element of our
    page.


    And then we have the title tags. The title Main Page that we entered here would
    be the click-able link that would show up in a search engine. It''s also on the
    little tab at the top left of the browser when your page is being viewed on the
    internet. The title Main Page is just for an example. You would want to put something
    in here that would describe your page. We''ll get into this a lot more later on.


    The <body></body> tags is where your gonna be entering 99% of your code. Everything
    that you put in between these two tags is what the viewer of your web page will
    see. So all of the text, images, menu''s, etc. will go in here.


    Finally we add our closing HTML tag. </html> This tells the browser that this
    is the end of our HTML document. And that basically means the end of our web page.


    Like I said above this is the very basic framework of every single web page on
    the internet.


    Adding Some Content To Your Page


    Let''s add some content to our HTML document so that when we run it in the browser
    we''ll have something to see. Right now if we ran it our page would be empty.
    So add this to your code from the above exercise.


    <!doctype html>


    <html>


    <head>


    <title>Main Page</title>


    </head> 


    <body>


    <h1>Welcome to my first web page!</h1>


    <p>This is going to be epic!!!!</p>


    <p>Oh, yes             it is.</p>


    </body>


    </html>


    After you have the new code entered. Make sure you save it. You should already
    have your page saved as index.html so now you can just click save when you edit
    your code. You will have to re-save your code any time you change it before you
    can see the changes take affect in the browser. Now to run your web page in a
    browser. In the top menu of your text editor click on Run and then click on Launch
    in Chrome if the internet browser you use is Google Chrome. If you use a different
    browser like Internet Explorer, or Mozilla Firefox then choose Launch in one of
    those. Know that you must have the browser downloaded if you want to run your
    code in that browser. And this brings up something I want to talk about. It is
    a good idea to run your code in at least two browsers when testing or making changes.
    I use Google Chrome and Internet Explorer for my code. And the reason for this
    is that two different browsers might not display your web page in the same way.
    In those instances you might have to change your coding slightly to get the same
    result. And it''s a lot better to find little things like this as they happen
    so that you don''t have to clean up a whole bunch of code at once. So a good thing
    to get used to is to save you code often and run it in a couple of browsers occasionally.'
