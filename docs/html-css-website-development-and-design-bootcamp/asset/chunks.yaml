  trans: '

    本章我们将继续介绍几种常见的表单。与第 8 章类似，如果你愿意，本章也可以跳过。但建议至少通读这两章，即使不编写代码，也能了解大致内容。


    ## 单选按钮表单


    本章我们要制作的第一个表单是包含单选按钮的表单，供用户选择。我们将向用户提问，并提供两个答案选项。注意，单选按钮只能选择一个选项。允许用户选择多个选项的表单使用复选框，这将在下一个练习中创建。现在开始编写代码。将以下代码添加到页面中，最好放在数字输入表单之后，以便将所有表单示例集中在一处。


    ```html

    <form action="" method="">

    你喜欢培根吗？<br/>

    是：

    <input type="radio" name="yesorno" value=""><br/>

    否：

    <input type="radio" name="yesorno" value="">

    </form>

    ```


    - `<form action="" method="">` 与之前一样，打开表单元素。

    - 你喜欢培根吗？`<br/>` 然后添加问题文本。这里添加换行，以便第一个单选按钮显示在下一行。

    - 是：第一个单选按钮的标签。

    - `<input type="radio" name="yesorno" value=""><br/>` 输入元素。这次将 `type` 设置为 `radio`。现在你开始理解
    `type` 属性的作用了。我们已经使用过 `text`、`submit`、`number` 和现在的 `radio` 类型。`name` 属性设置为 `yesorno`，这是用来关联另一个选项的名称。你也可以将
    `value` 设置为 `nooryes`。`value` 属性设置为 `""`，空值将根据用户选择被赋值。如果用户选择“是”，则值为“是”，然后发送到服务器处理。不过本练习不涉及发送和处理输入数据。最后添加另一个换行。

    - 否：第二个单选按钮的标签。

    - `<input type="radio" name="yesorno" value="">` 另一个输入元素，与第一个完全相同。两个输入元素的 `name`
    属性必须一致，都设为 `yesorno`，否则用户可能同时选择“是”和“否”，这是我们不希望看到的。我们希望用户只能二选一。

    - `</form>` 最后关闭表单元素。


    这样就完成了单选按钮表单。运行代码，你会发现只能选择“是”或“否”，不能同时选。如果实际制作网站表单，你可能需要添加提交按钮将用户输入发送到服务器。我们已经知道如何添加提交按钮，这里不再重复。


    ## 复选框表单


    接下来创建复选框表单。这种表单适用于调查、购物车列表等场景，因为用户可以选择多个选项。用途广泛。将以下代码添加到页面：


    ```html

    <form action="" method="">

    你想学习以下哪种计算机语言？<br/>

    <input type="checkbox" name=""> HTML <br/>

    <input type="checkbox" name=""> CSS <br/>

    <input type="checkbox" name=""> JavaScript <br/>

    <input type="checkbox" name=""> C# <br/>

    <input type="checkbox" name=""> Java

    </form>

    ```


    - `<form action="" method="">` 打开表单元素。注意这次没有在表单前加换行，你可以根据需要决定是否添加。

    - 接着输入问题文本，并在末尾添加换行。

    - `<input type="checkbox" name=""> HTML <br/>` 第一个输入元素，使用 `type` 为 `checkbox`。`name`
    属性的用法与单选按钮表单相同，将设置为用户的选择并发送到服务器。添加复选框旁边的文本，并以换行结束，使下一个复选框显示在下一行。如果希望复选框显示在同一行，则不加换行标签。后续四个输入元素同理，只需更改选项文本。

    - `</form>` 最后关闭表单元素。


    运行代码后，你可以任意选择或取消选择多个复选框。如果希望用户访问页面时某个复选框默认选中，只需在输入元素中添加一个属性，例如：


    ```html

    <input type="checkbox" name="" checked="checked"> HTML <br/>

    ```


    - 属性名为 `checked`，值为 `checked`。这样用户访问或刷新页面时，该复选框将默认选中，用户也可以取消选择。


    ## 下拉菜单


    本练习学习如何创建下拉菜单。假设你想询问访问者最喜欢一周中的哪一天。将以下代码添加到页面：


    ```html

    <form action="" method="">

    你最喜欢一周中的哪一天？

    <select name="">

    <option value="">星期日</option>

    <option value="">星期一</option>

    <option value="">星期二</option>

    <option value="">星期三</option>

    <option value="">星期四</option>

    <option value="">星期五</option>

    <option value="">星期六</option>

    </select>

    </form>

    ```


    这个表单看起来与之前的不同。`name=""` 和 `value=""` 属性用于编程目的，使列表按特定方式工作。在浏览器中运行代码，你将看到一个包含一周各天的下拉列表供访问者选择。默认情况下，菜单宽度等于最大选项的宽度，第一个选项会显示在菜单框中。因此，在用户操作之前，会显示“星期日”选项。


    ## 第 9 章测验


    1. 单选按钮表单和复选框表单的主要区别是什么？

    2. 到目前为止，我们使用了哪三种输入元素类型？

    3. 本章中 `value=""` 属性有什么作用？


    ## 第 10 章：元标签和标题元素的更多内容


    在下一章开始学习 CSS 之前，我们还需要了解一些内容：`title` 元素和 `meta` 标签。它们是什么？如何使用？你不需要在文本编辑器中输入这些代码，仅用于学习目的，之后你会知道如何为特定页面输入。本示例假设我们正在制作一个食谱网站。以下是示例代码，我们将进行讨论：


    ```html

    <!doctype html>

    <html>

    <head>

    <title>最佳预算简易晚餐食谱</title>

    <meta name="description" content="令人惊叹的 30 分钟简易预算食谱。观看烹饪视频，打印全家人都会喜欢的美味食谱。"/>

    <meta name="keywords" content="快速食谱, 美味, 烹饪, 视频, 家庭餐, 30 分钟晚餐"/>

    <meta http-equiv="content-language" content="zh-cn"/>

    </head>

    <body>

    </body>

    </html>

    ```

    '
- fmt: '

    # HTML Head Elements and SEO


    ## The Title Element

    First let''s get into a little more detail about the `title` element. As you probably
    remember this is not actually displayed on your web page. Actually everything
    you put into the `head` element is either instructions for the browser or information
    about your page that would help your page have better rankings in a search engine.


    The goal is to get your page displayed somewhere in the top results of a search
    engine. The `title` element is displayed on the little tab that appears in the
    top left corner of the browser when a user visits your page. But the title is
    also what would become the actual link to your web page when someone searches
    for something similar to the content of you page.


    For example, if someone searched for "dinner recipes on a budget", this page might
    show up high in their search results. It''s very important to have the title worded
    in a way that makes people want to visit your site, using good keywords. In the
    example above, the keywords to target are "dinner", "recipes", and "budget". You
    should figure out a good title for every page on your website based on the specific
    content that page contains.


    ## Meta Tags

    Meta tags contain meta data about a web page.


    ### Description Meta Tag

    ```html

    <meta name="description" content="Two or three really descriptive sentences."/>

    ```

    This tag is used for the description of the web page. The information entered
    here is what the user would see under the clickable link in search results. You
    should add a specific description to every page of your website, as search engines
    can display any page, not just the homepage.


    It is recommended to use two or three sentences that describe the page content
    well, as search engines will cut off text after a few lines. If you don''t enter
    a meta description, the web browser will automatically generate one by taking
    related text from the page.


    ### Keywords Meta Tag

    ```html

    <meta name="keywords" content="keyword, keyword keywords, keyword"/>

    ```

    This is the keywords meta tag. While Google states they no longer use this meta
    data to find relevant pages due to abuse, other search engines still do.


    To optimize your ranking, enter between 6 to 8 descriptive words or phrases (separated
    by commas) that refer to your page. For example: `content="quick recipes, great
    tasting, cooking, videos, family meals, 30 minute dinners"`. Avoid adding keywords
    that are irrelevant to your content.


    ### Language Meta Tag

    ```html

    <meta http-equiv="content-language" content="en-us"/>

    ```

    This tag specifies the language the website was written in. In the `content` attribute,
    you add the language code. For example, `en-us` tells the browser that the site
    is written in English as used in the United States.


    ## Best Practices and Testing

    Ensure all meta tags and title information are typed correctly; a missing `"`
    symbol may prevent your meta data from appearing.


    - **Character Limit**: Try to keep your title and description under 65 characters
    each (including spaces).

    - **Testing**: You cannot view this data until you upload your website to a web
    host.

    - **Backlinks**: Search engines also look for links from other quality websites
    to your site. Building relationships with creators of similar websites to exchange
    links can improve your ranking.


