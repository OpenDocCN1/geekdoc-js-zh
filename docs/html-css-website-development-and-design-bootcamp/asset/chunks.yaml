    refer to things in your own way, but this is the technical term used.


    The code that we just added in the above lesson is exactly how all of your CSS
    will look for the most part. Very simple. It''s just:


    selector{


    property: value;


    }


    Let''s save and run our code. Now if you scroll down to your h1 element heading
    "Gaming Stuff", you''ll see that the font has changed to white and we now have
    a blue background for the heading that spans the entire width of the page. There
    are many things that you can do to this background as well like change the width,
    add a border, and so on. We''ll learn all of that in future lessons. We can also
    add multiple selectors to our rules. So for example if we wanted our h1 and h2
    headings styled in the same way we could just add a comma and the h2 selector.
    Add this to your h1 rule and then save/run your code:


    <style>


    h1,h2{


    background-color: blue;


    color: white;


    }


    </style>


    Now both our h1 and h2 headings have a blue background and white font. We''ll
    end this chapter here so that you don''t get overwhelmed with too much information
    at once.


    Quiz Chapter 11


    1.What is CSS code used for?


    2.When using an inline style sheet for your CSS code, Where do you put your <style></style>
    tags?


    3.Your properties and values have to go between what symbols?


    4.What does a CSS rule consist of?


    5.What is the name of the property used to change the font color?


    6.How do you add multiple selectors?


    7.A semicolon in a CSS rule means what to the browser?


    Chapter 12: Styling text


    In this chapter we''ll go through some of the properties that you can use to style
    the text on your web pages. For this exercise we''ll use the paragraph directly
    under the h1 element that we just added style to. Add this code inside of your
    style tags right after the } closing curly bracket for the h1 rule:


    <style>


    h1,h2{


    background-color: blue;


    color: white;


    }


    p {


    color: red;


    background-color: black;


    font-family: tahoma;


    font-size: 20px;


    text-align: center;


    }


    </style>


    p { The selector we want to style is p and we open the curly brace.


    color: red; Then we choose the font color property. Remember it is color not
    font-color. We add a colon and enter the value red to change the font color to
    red. Finish the statement with a semicolon so that the browser will move to the
    next property.'
