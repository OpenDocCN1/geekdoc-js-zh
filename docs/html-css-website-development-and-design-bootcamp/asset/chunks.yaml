    # 创建并链接 CSS 样式表


    ## 创建新的 CSS 文件


    我们需要为样式表创建一个新文件。在你的文本编辑器中，点击“文件”（File），然后“新建”（New）。在新文件页面出现后，再次点击“文件”并选择“另存为”（Save
    as）。将文件保存为 `stylesheet.css`，并确保从“保存类型”下拉菜单中选择级联样式表文件 (*.css*)。将其保存到你桌面上的网站文件夹中。保存后，你将在文本编辑器中看到两个标签页：一个对应
    `index.html`，另一个对应 `stylesheet.css`。样式页面最初是空的，但将其保存为 `.css` 文件会告诉文本编辑器应用正确的语法高亮。在添加内容之前，务必将新文件保存为正确的文档类型。你可以通过点击并拖动标签来重新排列顺序。


    就像你创建的 `stylesheet.css` 文件一样，当你使用 JavaScript 添加交互功能时，会将 JavaScript 代码保存在单独的 `something.js`
    文件中。你的 `.css` 和 `.js` 文件都应该保存在你的网站文件夹中。将你网站的所有文件——如 HTML 内容、图像、CSS 样式和 JavaScript
    编程——放在一个文件夹中，并在网站上线时上传它。如果你有许多媒体文件，可以考虑为图像、音频和视频创建子文件夹。添加音频和视频与添加图像类似。


    ## 将我们的 CSS 样式表链接到 HTML 文档


    为了让我们的 HTML 页面使用外部样式表中的样式，我们需要将它们链接起来。你创建的每个 HTML 页面都将使用这种链接方法。这就是 CSS 如此强大的原因——它的样式可以在整个网站中复用。在
    `<head></head>` 元素内部添加以下代码：


    ```html

    <!doctype html>

    <head>

    <title></title>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    </head>

    ```


    ### The link 元素


    - `<link>` 告诉浏览器我们正在将此文档链接到某些内容。

    - `rel="stylesheet"` 这是关系属性，我们给它的名称/值 "stylesheet" 只是定义了当前 HTML 文档与我们正在链接的文档之间的关系。

    - `type="text/css"` 这告诉浏览器我们正在链接的媒体类型。这里的值 "text/css" 指定了它是 CSS 代码。

    - `href="stylesheet.css">` 我们的链接指向我们的 `stylesheet.css` 文档。


    现在，我们的 `index.html` 文档已经链接到了 `stylesheet.css` 文档。接下来，在我们刚刚创建的链接正下方添加此元数据：


    ```html

    <!doctype html>

    <head>

    <title></title>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    <meta name="viewport" content="width-device-width initial-scale=1.0">

    </head>

    ```


    ###  viewport 元 标签


    在输入元数据代码时，如果所有代码都在同一行，会更容易阅读。HTML 会忽略额外的空格，但将元标签保持在行内会让它更有组织。这是一个响应式元标签，可以帮助浏览器适应不同的屏幕尺寸。你将像链接样式表一样，将此标签添加到你所有的
    HTML 文档中。如果需要，可以删除或更改该标签，但布局应该可以正常工作。我已经在几个浏览器中测试过，没有问题。关于它的工作原理以及编码人员使用的不同值，有许多观点。


    ## 使用示例代码完成元标签的设置


    我们现在将完成位于头部（header）的元数据和标题元素信息。将此内容添加到你创建的每个页面，根据每个页面的需要进行复制粘贴和调整。创建第一个 HTML 页面之后，后续页面将通过复制粘贴创建得快得多。以下是示例设置：


    ```html

    <!doctype html>

    <head>

    <title>快速高效地学习 HTML、CSS 和 JavaScript 编码，用于网站开发和设计。

    </title>

    <meta name="description" content="此网站旨在教你如何使用 HTML、CSS 和 JavaScript 编码来制作出色的响应式交互网站。请观看我们的训练视频教程。"/>

    <meta name="keywords" content="HTML, CSS, JavaScript, web development, web design,
    learn coding, programming, responsive website"/>

    <meta http-equiv="content-language" content="en-us"/>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    <meta name="viewport" content="width-device-width initial-scale=1.0">

    </head>

    ```


    ## 创建顶部页眉、导航按钮和 Logo


    现在我们将在网页顶部设置导航按钮。一旦我们创建并样式化了它们，就可以将它们复制粘贴到其他页面。在你的 `<body>` 开放标签之后添加此代码：


    ```html

    <body>

    <header class="topHeader">

    <h4>欢迎来到网站开发与设计教程</h4>

    </header>

    <div class="navigation">

    <div class="button">

    <a href="index.html">首页</a>

    ```


