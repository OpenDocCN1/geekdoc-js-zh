    # 第 14 章：内联样式


    在本章中，我们将——砰、砰砰、砰、砰——使用**内联样式（INLINE STYLE）**。抱歉，我不得不这么说。无论如何，在向 HTML 文档添加 CSS
    的三种方法中，这是最不常用的方法，但我们仍然需要介绍它，以便你决定哪种方法最适合你。


    添加 CSS 内联样式意味着你将把 CSS 代码直接嵌入到你的 HTML 元素中。如果你添加很多属性，这可能会变得有点混乱。为了说明这一点，我们将在用于学习的
    HTML 文档中添加几个新元素。请在你的代码某处添加这个新元素，然后运行它。


    ```html

    <h3 style="color:red;font-size:20px;">这个标题是用内联样式创建的</h3>

    ```


    - `style="color:red;font-size:20px;"` 我们将 `style` 标签直接添加到了起始 `h3` 标签中。注意，当我们用这种方式使用它时，我们不需要关闭它。然后我们添加一个等号和一组双引号。在双引号内部，我们指定了想要应用到此特定
    `h3` 元素的属性和值。如你所见，`;` 号也位于双引号之间，用于结束我们的 CSS 语句/规则。

    - 我们指定了此 `h3` 元素具有红色文本和 20 像素的字体大小。


    所以你可能会想，如果我们创建一个新的 `p` 元素会发生什么，因为我们已经在 `head` 元素中使用了内部样式表。我们已经创建或将要创建的任何 `p` 元素将具有我们在
    `p` 规则中设置的属性。让我们将这段代码添加到新的新的 `h3` 元素下面，然后我们可以运行它并查看发生了什么。


    ```html

    <h3 style="color:red;font-size:20px;">这个标题是用内联样式创建的</h3>


    <p style="color:purple;font-size:14px;text-align:left;">

    我们用内联样式创建了这个段落。它还带有来自我们内部样式表的样式属性</p>

    ```


    - 所以，现在在你运行新代码后，你可以看到这个段落与页面上的其他三个 `p` 元素不同。这是发生了什么？

    - 嗯，首先我们继承了在 `p` 规则中设置的属性。然后我们在内联样式代码中，我们仅针对这个特定的段落覆盖了其中某些属性。我们更改的是将文本颜色改为紫色，字体大小更改为
    14 像素，并将文本左对齐。


    这些就是我们需要用内联样式涵盖的所有内容。理解起来非常简单。现在你知道你可以混合使用多种样式方法了。但当你开始设计页面时，我建议你选择一个对你来说最容易理解且最有条理的系统。大多数编码员不会过多地使用内联样式，因为他们的
    HTML 很快就会变得杂乱无章。


    ### 第 14 章测验

    1. 我们把内联样式的代码放在哪里？

    2. 当我们修改代码中其他地方已经指定的属性时，所使用的术语是什么？


    # 第 15 章：颜色和 CSS 注释


    ## 原色

    在本章中，我们将更深入地讨论颜色值。有三种方法为我们的元素添加颜色。第一种方法是使用十六种原色之一并通过名称调用它。这是我们到目前为止书中添加颜色的方法。以下是你可以使用的十六种原色的列表，按字母顺序排列：


    1. `aqua`

    2. `black`

    3. `blue`

    4. `fuchsia`

    5. `gray`

    6. `green`

    7. `lime`

    8. `maroon`

    9. `navy`

    10. `olive`

    11. `purple`

    12. `red`

    13. `silver`

    14. `teal`

    15. `white`

    16. `yellow`


    ## RGB 颜色

    为元素添加颜色的第二方法是使用 RGB 值。RGB 代表红（red）、绿（green）和蓝（blue）。这三个值之间的混合让你访问数百万颜色。


    你可以搜索 RGB 值。但获取它们的简单方法是使用 MS Paint 或任何其他程序（如 Paint）。让我们以 MS Paint 为例。如果你打开它并点击右上角的“编辑颜色”菜单，你会得到一个调色板屏幕。现在，如果你上下移动滑块并在颜色框内移动交叉光标，你可以看到获得大量的颜色组合。当你得到你喜欢的颜色时，红、绿、蓝值将显示在调色板屏幕的右下角。


    现在记住这些值或把它们写下来，因为我们将用它们来更改网页的背景颜色。我们需要回到 CSS 内部样式表中的 `body` 规则，并将 `background-color:
    yellow;` 替换为此代码：你可以添加你的值，或使用我这里的值。按顺序在括号之间添加红、绿、蓝值：`background-color: rgb(65,77,103);`。如果你使用了我输入的
    RGB 值并运行页面，你将得到一种蓝色的背景色。


    ## 十六进制代码颜色

    添加颜色的最后方法是使用十六进制代码（hex code）。这种方法与 RGB 值类似，你可以访问数百万种颜色。你可以搜索一个 RGB 到十六进制的转换器。


    许多编码员倾向于使用十六进制代码，因为对他们来说更容易。当你在 CSS 中使用 `background-color` 属性时：`background-color:
    #008080;` 你将得到一种青色背景。


    ## CSS 注释

    在 CSS 中添加注释。编码员经常这样做，当他们有很多十六进制代码或 RGB 值时，他们在桌面上创建一个包含这些颜色的文档。


    在 CSS 中添加注释的方法与在 HTML 中稍有不同。你知道在 HTML 中是这样添加注释：`<!--注释 -->`。但在 CSS 中，你会以这种方式输入：


    - `/*CSS 注释会被浏览器忽略。*/`

    - `/*你也可以这样输入多行注释。只要你用正斜杠和星号包围文本即可*/`


    当你开始 CSS 中有大量代码时，你可能想通过注释对代码部分进行划分，以便于你导航和查找内容。编码员使用 CSS 注释将代码分部分的示例：


    ```css

    /*================十六进制代码=======================*/

    /*在这里他们列出了他们喜欢的十六进制代码。

    #000 = 黑色

    #388f00 = 绿色

    #c34c1d = 橙色*/


    /*================标题========================*/

    /*然后这里是所有的标题规则。h1、h2 等。 */


    /*================主内容======================*/

    /*这里是他们的主内容规则，如 p 元素等。 */

    ```


    通过经验，你会找到适合自己的系统。本章就此结束。去尝试不同的颜色组合，并测试为你的网页添加颜色的三种方法。


    ### 第 15 章测验

    1. 为你的网站添加颜色的三种方法是什么？

    2. 你的代码中有多少原色可以使用？

    3. 十六进制代码以什么符号开头？

    4. 在 CSS 中添加注释与在 HTML 中有何不同？


    # 第 16 章：类和 ID

    在本章中，我们将学习 CSS 类（classes）和 ID（id''s）。它们的作用是什么，应该使用哪一个，以及它们如何帮助你更快、更容易地设计元素。


    ## CSS 类


