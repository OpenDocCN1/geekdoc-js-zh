  trans: "\n\n## 外边距 (Margin) 与 内边距 (Padding)\n\n在这里你还能看到我们有一个外边距（margin）。它是边框（border）与周围其他元素之间的空间。在边框与页面外部之间也存在外边距，这是浏览器自动添加的。请注意，`h3`\
    \ 元素与其上方和下方两个元素之间的外边距，是 `h3` 元素两侧外边距大小的两倍。这是因为浏览器会为每个元素添加默认外边距。因此，它将我们的 `h3` 外边距与另一个元素的外边距相加了。而由于页面的边缘不是一个元素，所以这里只有\
    \ `h3` 的外边距。\n\n让我们在 `h3` 规则中添加一个外边距，来看看当我们指定外边距数值时会发生什么：\n\n```css\nh3 {\n  \
    \  background-color: gray;\n    border: 5px solid yellow;\n    padding: 25px;\n\
    \    margin: 30px;\n}\n```\n\n最后，我们指定了在所有四个方向上，从边框到周围任何其他内容的距离为 30 像素。\n\n关于外边距，我们还可以做的一件事是：如果你现在观察页面，可以看到每个元素与页面末尾之间都有外边距。我们可以将其去掉，使所有内容直接紧贴浏览器窗口的边缘。我们需要在\
    \ `body` 规则中添加这段代码：\n\n```css\nbody {\n    background-color: #008080;\n    margin:\
    \ 0px;\n}\n```\n\n现在，除了 `h3` 元素（因为我们为其指定了外边距）之外，所有元素都紧贴浏览器窗口的边缘。你应该知道，我们在这里去掉的是\
    \ `body` 的外边距，而不是元素本身的外边距。不过，你可以在任何元素上使用 `margin: 0;`。此外，你可能已经注意到所有的列表仍然有一些空间，这是因为列表周围有一个不可见的外边距。要使其可见，你只需在\
    \ `ul` 和 `ol` 规则中都添加这段代码：\n\n```css\nul {\n    font-weight: bold;\n    border:\
    \ 2px solid red;\n}\n\nol {\n    font-style: italic;\n    border: 2px solid red;\n\
    }\n```\n\n现在你可以在页面上看到两个列表的边框以及外边距空间了。\n\n### 外边距与内边距属性\n\n就像 `border` 属性一样，你可以分别控制外边距和内边距。以下是你可以在任何元素上使用的属性列表，用于分别控制外边距和内边距的数值：\n\
    \n- `margin-left:`\n- `margin-right:`\n- `margin-top:`\n- `margin-bottom:`\n-\
    \ `padding-left:`\n- `padding-right:`\n- `padding-top:`\n- `padding-bottom:`\n\
    \n在元素上使用这些属性是页面定位内容的一种方式。这里有一个小练习：前往你的 `body` 规则，添加 `border: 5px solid black;`\
    \ 并删除 `margin: 0px;` 代码。这将让你直观地看到浏览器默认给 `body` 添加的外边距。\n\n本章最后要讲解的是，你可以使用上述属性分别给上、右、下、左外边距赋值，或者像\
    \ `border` 属性那样使用简写形式。下面是一个示例：\n\n`margin: 5px 10px 5px 10px;`\n\n你输入数值的顺序是：上、右、下、左。因此，这行代码会给元素的顶部和底部提供\
    \ 5 像素的外边距，左侧和右侧提供 10 像素的外边距。如果你想对 `padding` 属性使用简写，其顺序完全相同。\n\n### 第 17 章测验\n\
    \n1. 内边距（Padding）是内容与什么之间的空间？\n2. 外边距（Margin）是边框与什么之间的空间？\n3. 使用什么值可以去掉外边距？\n\
    4. 外边距属性的简写数值输入顺序是什么？\n5. 如果有两个元素一个在另一个上方，并且你去掉其中一个的外边距，这两个元素之间是否仍然有空间？\n\n##\
    \ 第 18 章：Div 和 Span\n\n本章将更多地讨论这两个元素。首先，它们是 HTML 元素，但在进入 CSS 之前学习它们没有意义，因为它们需要\
    \ CSS 才能真正发挥作用。\n\n### Div\n\n`div` 元素用于将 HTML 内容划分为逻辑区域，以便进行定位和样式设置。一个 `div`\
    \ 内部可以包含一个或多个元素。以下是使用两个 `div` 的示例：\n\n```html\n<div id=\"navigation\">\n    <ul>\n\
    \        <li>Home</li>\n        <li>News</li>\n        <li>Pictures</li>\n   \
    \     <li>Contact</li>\n    </ul>\n</div>\n\n<div id=\"maincontent\">\n    <h1>Welcome\
    \ to my Website</h1>\n    <p>Check out my news section and the pictures page.</p>\n\
    </div>\n```\n\n在上面的示例中，我们有两个 `div`。一个用于存放导航菜单，另一个用于存放主内容区域。`div` 的主要用途之一是控制元素的定位方式，但它们也可以用于继承样式。\n\
    \n### Span\n\n`span` 元素与 `div` 类似，但它是用于 HTML 内容内部的内联（inline）元素，且适用于更小的范围，比如一个单词或几个单词。`span`\
    \ 最常见的用途之一是突出显示某个词。让我们使用之前赋予了 `class=\"gray\"` 的段落元素。在段落中，将以下代码包裹在这些词周围：\n\n`<span\
    \ class=\"highlightyellow\">text color, size, and alignment properties</span>`\n\
    \n我们必须给它一个类（class）和一个名称。我们给的名称是 `highlightyellow`。你可以将其命名为任何你想要的名称，例如 `yellowbackground`。`span`\
    \ 元素像 `div` 一样，有开始标签和结束标签。\n\n在 `style` 元素标签之间添加这条新的 CSS 规则：\n\n```css\n.highlightyellow\
    \ {\n    background-color: yellow;\n}\n```\n\n我们使用 `.` 点号来指定这是一个类规则。请注意，我们为 `span`\
    \ 元素使用了类（class），而为 `div` 元素使用了 ID。这是因为我们可能会在页面各处以及不同的 HTML 元素内部多次使用 `span`，而 `div`\
    \ 通常更具唯一性，所以我们使用 `id`。\n\n"
