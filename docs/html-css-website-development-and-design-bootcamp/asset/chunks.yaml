    ## 为我们的子内容设置样式、尺寸和定位


    我们已经完成了页面左侧的所有主要内容。现在我们将开始处理右侧的内容。首先，在你的 `.content` 规则下方添加这条规则：


    ```css

    .topRightSidebar {

    background-color: white;

    color: black;

    font-style: italic;

    text-align: left;

    padding: 1%;

    margin-top: 50px;

    border-radius: 5px;

    -moz-border-radius: 5px;

    -webkit-border-radius: 5px;

    width: 25%;

    float: left;

    }

    ```


    - `.topRightSidebar`: 我们的选择器名称是类 `topRightSidebar`。

    - `background-color: white;`: 将背景颜色设置为白色。

    - `color: black;`: 将字体颜色设置为黑色。

    - `font-style: italic;`: 让我们的文本变为*斜体*。

    - `text-align: left;`: 文本左对齐。

    - `padding: 1%;`: 文字与边框之间四周留有 1% 的内边距。

    - `margin-top: 50px;`: 在这里我们给顶部设置了 50 像素的外边距。为了得到 50 像素的数值，这个值被修改了多次直到我我理想的位置，即让左右内容的顶部对齐。

    - `border-radius: 5px;`: 我们设置了半径为 5 像素的圆角。接下来的两行是为了确保它在其他浏览器中显示相同。

    - `width: 25%;`: 我们给它设置了 25% 的宽度，因为这是我们的子内容。它应该比主要内容小。这个 25% 的值是通过不断调整数值直到它看起来良好且恰当合适实现的。

    - `float: left;` 最后，我们将此元素左浮动。由于我们为主要内容设置了宽度并为右内容留出了空间，它将浮动在顶部内容的左侧。这种方式之所以有效是因为我们将宽度设置成了合适的数值，以便它们并排排列。如果没有足够的空间，它将显示在屏幕左侧，在我们所有主要部分的下方，那是我们不希望看到的。


    现在对于 `.middleRightSidebar` 和 `.bottomRightSidebar`，我们将直接复制整个 `.topRightSidebar`
