    好的，当你这次运行代码时，你会发现 h3 标题已经移动到了我们设置的位置。调整浏览器窗口大小时，得到的结果与使用绝对定位时是一样的。但现在使用滚动条向上或向下滚动页面。正如你所看到的，我们的
    h3 标题固定在这个位置，它永远不会移动。它被固定在那个地方。除了广告之类的内容，这种系统真的没有多大用处。此外，你也不想惹恼访问你网站的人。所以这就是使用绝对定位和固定定位之间的区别。虽然我们不会使用这些类型的定位方法，但了解它们仍然是有好处的，你可能在以后某一个时刻会用到它们。


    ### 第 21 节测试


    1. 元素上绝对定位和固定定位之间的主要区别是什么？

    2. 本章描述的这两种系统中，哪一个可以用于为了设计重叠元素？

    3. 告诉浏览器在何处显示固定或绝对元素，你可以使用的常用的两组定位属性是什么？


    ## 第 22 章：相对定位


    我们要讨论的最后一种定位系统是相对定位。这种定位方式可能有点棘手。使用它可能无法轻松实现你想要的结果。但在在此之前，我们必须谈谈静态定位。你可能会认为我们没有涵盖过它。但静态定位是在我们指定任何其他类型定位时使用的默认定位系统。所以，在整本书中我们一直在使用静态定位。如果你想要一个示例，可以在任何一个没有指定其他定位系统的
    CSS 规则中添加 `position: static;` 代码。你会发现没有任何变化。我们需要讨论静态定位的原因是，相对定位在某种程度上类似于绝对定位，即你会告诉浏览器让一个元素相对于例如
    `top` 和 `left` 移动一段距离。但绝对定位和相对定位之间存在区别。也就是说，如果我们使用 `top` 和 `left` 坐标来对元素进行绝对定位，在大多数情况下，它将从浏览器窗口的顶部和左侧显示元素；而相对定位将从该元素在没有定位时在页面上显示的位置的顶部和左侧显示。例如，如果你创建了某种列表且完全没有给它任何定位代码，它默认将是静态定位的。然后如果你给列表添加了带有
    `top` 和 `left` 坐标的 `position: relative;`，它将从原始显示的位置按照你通过 `top` 和 `left` 坐标设置的量进行移动。


    ### 第 22 章测试


    1. 绝对定位和相对定位之间的主要区别是什么？

    2. 相对定位的元素根据什么进行定位？


    ## 第 23 章：让我们构建一个响应式网站布局！！！


    终于！是时候处理我们的布局了。在此过程中我们将学习更多的 HTML 元素和一些新的 CSS 代码。我们的布局将包含一个带有内容区域的首页、一个带有动画的导航菜单以及指向网站内其他页面的链接。它将是一个响应式布局。所以当我们调整网站大一时，元素将缩小和/或移动以适应屏幕。我们还将学习
    CSS 外部样式表并将其用于此设计。在开始之前，我们需要先做几件事。首先，我们需要清理学习页面上所有的垃圾。或者你可以直接把它关闭并作为参考。只需确保如果你想保留它，就保存并将其重命名为
    `examples.html` 之类的。此外，你应该将其从网站文件夹中移除并放在其他地方。你也应该把那里的图片删掉。无论你决定哪种方法都可以。现在你的桌面上应该有一个名为
    `website` 的文件夹，它应该是空的或者里面有一个 `index.html` 页面。如果里面有 `index.html` 页面，该页面需要被清理。下面是你现在新或修改后的
    `index.html` 页面应该有的样子。这是我们将基于之工作的框架：


    ### 任何网页的基础框架


    ```

    <!doctype html>

    <head>

    <title></title>

    </head>

    <body>

    </body>

    </html>

    ```


    再次澄清一下，你的桌面上应该有一个名为 `website` 的文件夹，里面保存了一个 `index.html` 文件。该文件内部应该包含上面示例“任何网页的基础框架”中的代码。`website`
    文件夹中除了 `index.html` 文件外，不应该有任何其他内容。而且在那个文件中，除了基础框架代码外，你不应该在其中包含任何其他代码。一旦你按照正确的方式设置好了一切，就可以开始了。请注意，在我们构建响应式布局的过程中，你可以更改颜色、字体、导航按钮名称等。你可能想跟着练习并在稍后进行更改。那也可以的。至于元数据，标题元素、描述和关键词将由你来创建，因为你的网站会有不同的标题、描述和关键词。为了演示之目的，我将添加一个非常简化的示例作为回顾。在这个练习中创建的网站将关于教授计算机编程。你的网站将关于不同的内容。你可以自由地对我们在这里构建的最终产品做任何你想做的事。你可以保持原样或完全更改。这没关系。这取决于你。关于网站创建的另一点需要了解的是版权问题。如果你浏览互联网，你会发现大多数页面的页脚处都有一些版权信息。你还可能看到品牌名称、商标等内容。请知道，即使页面上没有版权信息，它仍然受版权保护。这在以前是必须特别说明的。现在，你的网页、图片等在你创建或将其上传到互联网的那一刻起就受到版权保护了。但无论如何，在页脚处添加版权信息也是个好主意。这样访问者就会知道，使用你的任何设计等需要你的许可。


    好了，现在我们完成了那些工作，我们需要设置我们的 CSS 外部样式表。这几乎与我们一直在使用的内部样式表完全一样，只不过它是一个完全独立的文件。我们将从那里以更清晰、更有组织的方式控制我们所有的
    CSS 样式。


    ### 设置我们的 CSS 外部样式表


    '
- fmt: '

    # Creating and Linking a CSS Stylesheet


    ## Creating a New CSS File


    We need to create a new file for our style sheet. In your text editor, click File
    then New. After the new file page appears, click File again and choose Save as.
    Save the file as `stylesheet.css`, making sure to select the option for Cascade
    Style Sheets File (*.css) from the Save as type dropdown. Save it into your website
    folder on your desktop. After saving, you will see two tabs in your text editor:
    one for `index.html` and one for `stylesheet.css`. The style sheet page is initially
    empty, but saving it as a `.css` file tells the text editor to apply the correct
    syntax highlighting. Always save a new file as its correct document type before
    adding content. You can reorder the tabs by clicking and dragging them.


    Just like the `stylesheet.css` file you created, when you add interactivity with
    JavaScript you will save your JavaScript code in a separate `something.js` file.
    Both your `.css` and `.js` files should be saved in your website folder. Keep
    all your website''s files—such as HTML content, images, CSS styles, and JavaScript
    programming—in one folder, which you will upload when your site goes live. If
    you have many media files, consider creating subfolders for images, audio, and
    video. Adding audio and video is similar to adding images.


    ## Linking Our CSS Style Sheet With Our HTML Document


    In order for our HTML pages to use the styles from our external style sheet, we
    need to link them. You will use this same linking method for every HTML page you
    create. This is what makes CSS so powerful—its styles can be reused across the
    entire site. Add the following code inside your `<head></head>` element:


    ```html

    <!doctype html>

    <head>

    <title></title>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    </head>

    ```


    ### The link Element


    - `<link>` Tells the browser that we are linking this document to something.

    - `rel="stylesheet"` This is the relationship attribute and the name/value we
    give it "stylesheet" just defines the relationship between this current HTML document
    and the document that we are linking to.

    - `type="text/css"` This tells the browser what media type that we are linking
    to. And this value here "text/css" specifies that it is CSS code.

    - `href="stylesheet.css">` And we point our link to our `stylesheet.css` document.


    We now have our `index.html` document linked with our `stylesheet.css` document.
    Next add this meta data right under the link we just made:


    ```html

    <!doctype html>

    <head>

    <title></title>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    <meta name="viewport" content="width-device-width initial-scale=1.0">

    </head>

    ```


    ### The viewport Meta Tag


    When entering the meta data code, it''s easier to read if you have all of the
    code on one line. HTML ignores extra space, but keeping the meta tag on one line
    makes it more organized. This is a responsive meta tag that helps the browser
    adjust to different screen sizes. You will add this tag to all of your HTML documents,
    just like the link to the style sheet. The tag can be removed or altered if needed,
    but the layout should work fine. I have tested it in several browsers without
    issues. There are many opinions about how it works and the different values coders
    use.


    ## Finishing Up The Meta Tags With Example Code


    We will now finish up with the meta data and title element information that goes
    in the header. Add this to every page you create, copying and pasting and adjusting
    as needed for each page. After creating your first HTML page, subsequent pages
    will be created much faster through copy and pasting. Below is the example setup:


    ```html

    <!doctype html>

    <head>

    <title>Learn to code in HTML, CSS, and JavaScript fast and well for website development
    and design.

    </title>

    <meta name="description" content="This website is designed to teach you how to
    code in  HTML, CSS, and JavaScript to make amazing responsive interactive websites.
    Please Watch our training video tutorials."/>

    <meta name="keywords" content="HTML, CSS, JavaScript, web development, web design,
    learn coding, programming, responsive website"/>

    <meta http-equiv="content-language" content="en-us"/>

    <link rel="stylesheet" type="text/css" href="stylesheet.css">

    <meta name="viewport" content="width-device-width initial-scale=1.0">

    </head>

    ```


    ## Creating A Top Header, Navigation Buttons, And Logo


    Now we will set up the navigation buttons at the top of our web pages. Once we
    create and style them the first time, we can copy and paste them to other pages.
    Add this code right after your `<body>` opening tag:


    ```html

    <body>

    <header class="topHeader">

    <h4>Welcome to Website Development and Design Tutorials</h4>

    </header>

    <div class="navigation">

    <div class="button">

    <a href="index.html">Home</a>

    ```

