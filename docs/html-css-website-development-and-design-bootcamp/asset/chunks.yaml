  trans: "\n# 第 19 章：内联块元素\n\n`inline-block` 元素。有些程序员认为这很有用，有些则认为它复杂且棘手。我们在这本书中不会使用这个属性，但我们应该讨论它。将元素显示为\
    \ `inline-block` 的最常见用途是修复程序员在页面使用 Internet Explorer 6 浏览时会出现的问题。问题是外边距，类似于我们之前讨论的内容。尽管\
    \ I.E.6 是非常老旧的浏览器版本，但仍有一些人很长时间没有更新浏览器，仍在使用 Internet Explorer 6，因此网页开发者会尝试让 I.E.\
    \ 6 浏览器显示 `inline-block`，但在其他浏览器中隐藏它。基本上，显示为 `inline-block` 的元素是正如其名称所示的内联和块级的混合体。它既有内联的特性，也有块级的特性。在某些情况下使用它可能会带来好的或坏的结果。如果你想了解更多关于这个元素的信息，可以做一些研究，看看人们使用\
    \ `display:inline-block;` 属性和值创建的示例网页。以及仅使用内联或仅使用块级时的外观。任何可能出现的外边距问题，使用前两种系统应该不会太难解决。如果有任何需要，你可能需要在\
    \ CSS 中调整外边距值以获得想要的结果。\n\n## 第 19 章测验\n\n1. 块元素是如何显示的？\n2. 内联元素是如何显示的？\n3. 当你调整浏览器窗口大小时，块元素会发生什么？\n\
    4. 当你调整浏览器窗口大小时，放在同一行的多个内联元素会发生什么？\n\n# 第 20 章：浮动元素简介及定位第二部分\n\n浮动元素允许你将元素固定在屏幕的不同位置。它还可以让块元素并排显示。如果你想让某个元素浮动，你需要在该元素的\
    \ CSS 规则中添加 `width: value;` 和 `float: value;`。`float` 属性的值有 `none`、`left`、`right`、`initial`\
    \ 和 `inherit`。我们在本书中主要使用的是 `left`。请注意，浮动元素会从我们之前讨论的自然流中移除。浏览器会基本上忽略你浮动的元素。这就是我们能让块元素并排显示的原因。因为如果你把一个元素向左浮动（例如），浏览器会把紧随其后的元素与该浮动元素并排显示，只要右边有足够的空间。这有点像该元素对浏览器来说是隐形的。如果你在页面上有一些元素向左浮动，有些向右浮动，当你运行页面并调整窗口大小时，这些元素会保持在你指定的位置或方向上。另外，浏览器不会自动为浮动元素添加外边距，你需要自己添加。`float`\
    \ 系统有很多好处。浮动有点棘手，但我们会在网站布局中澄清很多问题。\n\n## 第 20 章测验\n\n1. 说出两个可用于浮动元素的属性和值？\n2.\
    \ 浮动元素对它有什么影响？\n3. 浮动块元素有什么好处？\n4. 如果你调整包含浮动元素的网页大小会发生什么？\n5. 什么是自然流？\n\n# 第 21\
    \ 章：绝对定位和固定定位\n\n让我们再讨论两种内容定位的方式。这两种系统自响应式网站近来变得非常流行以来已经不那么常用了。但我们仍然需要了解它们。\n\n\
    ## 绝对定位\n\n如果我们使用绝对定位来放置元素，我们就是在告诉浏览器在页面上的确切位置。我们使用 `position` 属性和值 `absolute`。然后我们给它一个\
    \ `top` 或 `bottom` 值，以及一个 `left` 或 `right` 值。最好的说明方式是通过一个例子。将以下代码添加到你的有序列表规则的样式表中：\n\
    \n```css\nol {\n    font-style: italic;\n    border: 2px solid red;\n    width:\
    \ 100px;\n    position: absolute;\n    top: 250px;\n    left: 450px;\n}\n```\n\
    \n- `width: 100px;` 首先我们添加了一个宽度，使列表的边框更真实一些。\n- `position: absolute;` 然后我们添加位置属性，值为\
    \ `absolute`。\n- `top: 250px;` 这里我们想让有序列表从浏览器窗口顶部向下显示 250 像素。你也可以使用 `bottom` 属性代替。这种情况下，你是说让有序列表从底部向上\
    \ 250 像素显示。\n- `left: 450px;` 最后我们还说让有序列表从浏览器屏幕左侧移动 450 像素。同样，你可以使用 `right` 属性从右侧定位。大多数程序员对这种系统使用\
    \ `top` 和 `left` 属性。\n\n现在如果你保存/运行你的页面，你会看到改进后的带更好边框的有序列表已经跳到了屏幕的另一部分。那是距顶部 250\
    \ 像素、距左侧 450 像素的位置。需要注意的是，这种定位方式会将元素从自然流中移除，类似于浮动元素。绝对定位的元素移动到某个位置后，可能会与页面上的另一个元素重叠。就像它覆盖在上面一样。你可以在设计上利用这一点，但在某些方面它与浮动元素不同，因为浮动元素仍会与页面上的其他元素保持一定的边界。因此，其他元素会随浮动元素移动而移动，不会重叠。如果你调整浏览器窗口大小，你会注意到有序列表不会移动到你设置的位置，因为它已脱离自然流。它现在是一个内联元素。注意，绝对定位的元素首先会相对于没有\
    \ `static` 位置的父元素定位。你会在下一章学习 `static` 定位。如果没有这样的元素（很可能是这种情况），那么它将相对于 HTML（浏览器窗口）定位，就像我们的有序列表一样。如果你定位的元素最终不在你想要的区域，调整起来非常容易。定位需要多练习。即使是非常有经验的程序员在制作网页时也会多次调整位置。\n\
    \n## 固定定位\n\n固定定位完全脱离自然流。当你用这种方式定位元素时，它不会移动。同样，最好的说明方式是通过一个练习：将以下代码添加到你的 h3 规则的样式表中：\n\
    \n```css\nh3 {\n    background-color: gray;\n    border: 5px solid yellow;\n \
    \   padding: 25px;\n    margin: 30px;\n    width: 400px;\n    position: fixed;\n\
    \    top: 300px;\n    left: 450px;\n}\n```\n\n- `width: 400px;` 我们给它设置了一个宽度，以便像之前的练习一样更好地调整大小。\n\
    - `position: fixed;` 唯一的区别是我们使用了值 `fixed` 而不是 `absolute`。\n- `top: 300px;` 我们告诉浏览器我们希望它距浏览器屏幕顶部\
    \ 300 像素。\n- `left: 450px;` 同时也距左侧 450 像素。\n\n"
