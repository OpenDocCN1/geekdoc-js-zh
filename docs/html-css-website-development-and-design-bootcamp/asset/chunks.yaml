    ```html

    </div>


    <div class="button">

    <a href="tutorials.html">教程</a>

    </div>


    <div class="button">

    <a href="programming.html">编程</a>

    </div>


    <div class="button">

    <a href="sourcecode.html">源代码</a>

    </div>


    <div class="button">

    <a href="contactus.html">联系我们</a>

    </div>


    <img src="images/logo.png">


    </div>

    </body>

    ```


    我们在 body 元素中添加了大量代码，下面逐部分进行拆解分析。


    ## HTML 结构拆解


    ### 标题与类命名

    我们创建了一个 `h4` 标题，用于所有页面的顶部，并将其放入一个类名为 `topHeader` 的 HTML `header` 元素中。在构建这个网站的过程中，你将接触到一些之前未涉及过的
    HTML 和 CSS 代码。HTML 提供了大量不同的元素供你使用。


    `header` 元素含义明确，你可以在页面的任何位置使用它，它并非仅用于页面顶部的页眉。


    关于类名，两个单词之间没有空格。这是因为如果命名为 `top header`，实际上表示两个独立的类：一个名为 `top`，另一个名为 `header`。注意第二个单词的首字母大写。如果名称包含多个单词，在编程中通常建议采用这种写法（驼峰命名法）。这是最常见的方式，但你也可能看到类似
    `top_header` 或 `top_Header` 的写法。最好坚持使用第二个单词首字母大写的命名系统。如果名称包含三个单词，则将第二和第三个单词的首字母大写，以提高可读性。类名和
    `id` 不能包含空格，因此有些程序员会使用下划线 `_`。同样重要的是，在 CSS 中创建规则时，必须严格按照 HTML 中输入的类名来书写。


    ### 导航栏与 Div

    接下来，我们为整个导航栏创建一个 `div`，类名为 `navigation`。当你准备在 `div` 中放入大量代码时，最好同时输入开始和结束标签，以免之后忘记关闭该
    `div`。


    如果你使用 Notepad++，可以点击某个 `div` 标签，Notepad++ 会高亮显示其对应的配对标签。在上面的示例中，`navigation` `div`
    包含了所有导航按钮，而这些按钮各自也有自己的 `div`。因此，我们实现了 `div` 嵌套 `div`。`div` 不仅可用于定位页面各部分，还可用于继承
    CSS 样式等用途。


    ### 按钮实现

    然后我们设置了一个 `div` 类，命名为 `button`。我们将反复使用这个类来创建所有按钮。总共设置了五个独立的 `div`，其 `class` 属性值均为
    `button`。


    对于第一个按钮，我们使用了一个锚点标签：

    ```html

    <a href="index.html">首页</a>

    ```

    它指向/链接到我们的 `index.html` 页面。我们将按钮命名为“首页”，这是你在按钮上看到的文本。按照与首页按钮相同的方式，我们又添加了四个按钮。


    ### 添加 Logo

    最后，展示了一个如何在导航按钮下方插入 Logo 的示例：

    ```html

    <img src="images/logo.png">

    ```

    请注意，如果你没有 Logo，可以删除 `<img src="images/logo.png">` 代码以及包围该图片元素的两个 `div` 标签。你也可以通过添加
    `<!--` 和 `-->` 注释代码来注释掉整个 `div`。


    在示例中，我们将图片元素放在按钮下方，但仍在 `navigation` `div` 内部，以便通过 `navigation` 类控制 Logo。要添加 Logo，需要在网站文件夹内创建一个名为
    `images` 的文件夹。当你从该文件夹中取出图片时，需要在文件路径中先指定文件夹名称。例如，如果你在 `images` 文件夹中保存了一张 `waterfall.jpeg`
    图片，则应添加：

    ```html

    <img src="images/waterfall.jpeg">

    ```

    另外请注意，如果你将其保存为 `.jpg` 格式，则必须输入 `images/waterfall.jpg`。建议统一选择 `.jpg` 或 `.jpeg`
    格式，并始终以相同的文件格式保存该类图片。


    ## 创建链接页面


    现在我们已经为导航栏按钮设置了名称，并添加了链接，使用户能够跳转到其他页面，但这些页面目前还不存在。


    创建方法如下：

    1. 点击 **文件**，然后选择 **新建**。

    2. 点击 **文件**，然后选择 **另存为**。

    3. 在“保存类型”框中，选择包含 `.html` 的选项。


    根据示例，你应该创建以下页面：

    - `tutorials.html`

    - `programming.html`

    - `sourcecode.html`

    - `contactus.html`


    如果你为按钮设置了不同的名称，请将这些新文档保存为你指定的相应名称。非常重要的一点：请确保将所有新的 HTML 文档保存到你的网站文件夹中，同时放入 Logo
    图片和/或 `images` 文件夹。


