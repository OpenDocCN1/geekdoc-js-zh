  raw: 'Another thing that you can see here is that we have a margin. And that''s
    the space between the border and the other elements around it. There is also a
    margin between the border and the outside of the page. The browser adds this automatically.
    Notice that the margin between the h3 element and the two elements that are above
    and below it is double the size of the margin on the sides of our h3 element.
    That is because there are default margins that the browser adds to every element.
    So it is adding our h3 margin and the margin of the other element together. And
    since the edge of our page is not an element we only have the h3 margin. Hopefully
    that wasn''t too confusing. But let''s add a margin to our h3 rule to see an example
    of what happens when we specify the margin amount.


    h3 {


    background-color: gray;


    border: 5px solid yellow;


    padding: 25px;


    margin: 30px;


    }


    And finally we specified that we wanted a 30 pixel margin from the border to
    anything else around it on all four sides.


    One other thing that we can do with the margin here is, If you look at your page
    now you can see there is a margin between every element and the end of the page.
    We can take this away so that everything bumps right up against the edge of the
    browser window. You might like the default margin and want to keep it. But let''s
    get rid of it so you can see what your page would look like with no body margin.
    We have to add this code to our body rule:


    body {


    background-color: #008080;


    margin: 0px;


    }


    And now all of our elements butt right up against the edge of the browser window
    except for the h3 element because we specified a margin. You should know that
    we took the margin away from the body here not the elements themselves. You could
    use the margin: 0; on any of your elements though. Also you may have noticed that
    all of our lists still have some space. And that is because there is an invisible
    margin around our lists. To make it visible all you have to do is add this code
    to both your ul and ol rules:


    ul {


    font-weight: bold;


    border: 2px solid red;


    }


    ol {


    font-style: italic;


    border: 2px solid red;


    }


    Now you can see the borders with the margin space for both of your lists on your
    page.


