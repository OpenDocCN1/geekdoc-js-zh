  trans: "\n\n# 设计与美化你的元素\n\n层叠样式表（Cascading Style Sheets）或 CSS 是你用来改变网页外观和感觉的代码。从字体、背景颜色、文本颜色到页面内容的定位，所有内容都由它控制。你甚至可以为页面添加一些动画效果。\n\
    \n向 HTML 文件添加 CSS 样式有三种方法。我们将逐一介绍每种方法以及它们的最优使用方式。在这个过程中，我们还会学习一些更多的 HTML 代码。由于某些\
    \ HTML 元素需要配合 CSS 代码才能正常工作，因此部分 HTML 内容必须在开始学习 CSS 之后才引入。\n\n我们将通过使用在前几章中创建的 HTML\
    \ 元素来学习 CSS。我们会通过尝试美化不同的元素来让你习惯使用 CSS。稍后当我们处理实际的布局时，由于你已经对最常见的内容有了经验，事情会变得更容易理解。\n\
    \n你可以删除之前用来创建所有表单的代码，以稍微清理一下页面，因为我们不会给这些元素添加任何样式。不过，为了以后参考，把它们留在那里也没关系。在我们制作网站布局之前，你可以再次“另存为”，将我们正在使用的这个\
    \ `index.html` 文件重命名为类似 `training.html` 的名称。然后在桌面上创建另一个文件夹并将其拖入其中。如果你不想将此文档包含在你的网站中，你肯定不想把它保存在网站文件夹里。我们暂时还会使用它，所以目前可以保持原样。如果你不在意这些学习代码，直接删除所有\
    \ `<form action=\"\" method=\"\"></form>` 元素即可。这样你的页面顶部显示的第一项应该是图像。\n\n## CSS\
    \ 代码示例\n\n下面是一个 CSS 代码的可视化示例，让你对我们将要处理的代码有一个大致的了解：\n\n```css\nbody{\n    background-color:\
    \ blue;\n    font-family: tahoma;\n    font-size: 14px;\n}\n\nh1{\n    color:\
    \ white;\n    text-align: center;\n}\n\np.news{\n    background-color: gray;\n\
    \    color: black;\n    text-align: left;\n    font-size: 120%;\n}\n\nfooter{\n\
    \    positon: fixed;\n    background-color: black;\n    color: white;\n}\n```\n\
    \n如你所见，它并不难理解。它看起来像是一组指令列表，而这正是它的本质。你只是在告诉浏览器你希望你的元素看起来是什么样子。\n\n## 使用内部样式表添加\
    \ CSS\n\n我们要向 HTML 元素添加样式的第一种方法是使用内部样式表。设置方法是在 `head` 元素内部添加 `<style></style>`\
    \ 标签。因此，在你的 meta 标签（如果你代码中有的话）之后立即添加这些标签。确保将它们放在 `head` 标签内部。另外请注意，这些 `<style></style>`\
    \ 标签是 HTML 标签，但其中的代码将是 CSS。\n\n```html\n<head>\n    <meta tags if you have any./>\n\
    \    <style>\n    </style>\n</head>\n```\n\n好了，现在当我们美化某个东西时，相应的代码将放入我们的 `style`\
    \ 元素中。如果你有多个 HTML 页面，你需要将这些标签嵌入到每个页面的 `head` 元素中。这样每个页面都会有自己的内部样式表。\n\n让我们从简单的开始。我们将为你在第一个段落上方使用的\
    \ `h1` 元素添加背景颜色并更改文本颜色。\n\n`<h1><a name=\"gaming stuff article\"></a>Gaming Stuff</h1>`。将以下代码添加到你的\
    \ `style` 标签内，我们将讲解刚刚学到的新代码。\n\n```css\n<style>\nh1{\n    background-color: blue;\n\
    \    color: white;\n}\n</style>\n```\n\n- `h1{` 这被称为**选择器（selector）**。它告诉浏览器我们要为这个\
    \ HTML 元素添加样式。注意这里没有 `<` 或 `>` 小于号或大于号。我们在这里不需要它们，因为这些不是 HTML 标签。另一件重要的事情是，尽管我们在文档中使用\
    \ CSS 代码，但我们仍然将其保存为 `.html`，因为 `style` 元素是一个 HTML 元素。既然你已经将页面保存为 `.html` 文档，你只需像之前一样保存并运行即可。现在，所有针对这个\
    \ `h1` 元素的样式都将放在花括号 `{ }` 之间。\n- `background-color: blue;` 首先是一个**属性（property）**，它是\
    \ `h1` 元素的 `background-color` 属性。在你输入想要更改的属性后，添加一个 `:` 冒号。然后是我们有**值（value）**，即\
    \ `blue`。所以这行代码总共的意思是：“嘿浏览器，把我的 `h1` 元素背景颜色改为蓝色。”在输入值之后，我们添加一个 `;` 分号。这个分号告诉浏览器我们已经完成了这个属性，可以进入下一个。分号还意味着这是一个语句的结束。所以基本上，我们的指令被称为**语句（statements）**。\n\
    - `color: white;` `color` 是我们用来更改字体颜色的属性。每当你想要更改任何内容的字体颜色时，要使用的属性就是 `color`。我们将此属性设置为\
    \ `white` 并以分号结尾。你可以在这里添加任意数量的属性。\n- `}` 我们添加闭合花括号。从 `h1` 选择器 `h1{` 到闭合花括号 `}`\
    \ 的所有代码被称为一个 **CSS 规则（CSS rule）**。\n\n我们在上述课程中添加的代码基本上就是所有 CSS 的样子。非常简单。它就是：\n\
    \n```css\nselector{\n    property: value;\n}\n```\n\n让我们保存并运行代码。现在，如果你滚动到 `h1`\
    \ 元素标题 \"Gaming Stuff\"，你会发现字体已变为白色，并且标题现在有一个横跨整个页面宽度的蓝色背景。\n\n我们还可以在规则中添加多个选择器。例如，如果我们希望\
    \ `h1` 和 `h2` 标题的样式相同，我们可以直接添加一个逗号和 `h2` 选择器。将此内容添加到你的 `h1` 规则中，然后保存/运行代码：\n\n\
    ```css\n<style>\nh1,h2{\n    background-color: blue;\n    color: white;\n}\n</style>\n\
    ```\n\n现在，我们的 `h1` 和 `h2` 标题都拥有蓝色背景和白色字体。\n\n## 第 11 章测验\n\n1. CSS 代码是用来做什么的？\n\
    2. 当为 CSS 代码使用内部样式表时，你应该将 `<style></style>` 标签放在哪里？\n3. 属性和值必须放在什么符号之间？\n4. 一个\
    \ CSS 规则由什么组成？\n5. 用于更改字体颜色的属性名称是什么？\n6. 如何添加多个选择器？\n7. CSS 规则中的分号对浏览器意味着什么？\n\
    \n# 第 12 章：美化文本\n\n在本章中，我们将介绍一些可用于美化网页文本的属性。对于这个练习，我们将使用紧跟在刚才添加了样式的 `h1` 元素下方的段落。将此代码添加到你的\
    \ `style` 标签中，紧跟在 `h1` 规则的 `}` 闭合花括号之后：\n\n```css\n<style>\nh1,h2{\n    background-color:\
    \ blue;\n    color: white;\n}\n\np {\n    color: red;\n    background-color: black;\n\
    \    font-family: tahoma;\n    font-size: 20px;\n    text-align: center;\n}\n\
    </style>\n```\n\n- `p {` 我们想要美化的选择器是 `p`，然后打开花括号。\n- `color: red;` 然后我们选择字体颜色属性。记住它是\
    \ `color` 而不是 `font-color`。我们添加一个冒号并输入值 `red` 将字体颜色改为红色。用分号结束语句，以便浏览器移动到下一个属性。\n\
    \n"
- fmt: "\n## CSS Text and Font Properties\n\n`background-color: black;` We give our\
    \ paragraph a black background.\n\n`font-family: tahoma;` Here we chose the property\
    \ `font-family` and the value `tahoma`. You could put any of your favorite fonts\
    \ in here like `arial`, `georgia`, `times new roman`. Note that some browsers\
    \ might not find the font that you enter here if it's an uncommon one so it will\
    \ go back to the default font.\n\n`font-size: 20px;` Here we are using the font\
    \ property again and this time we want to adjust the size. We want our text to\
    \ be `20px`. There are a few different ways to adjust the size: you could use\
    \ `%`, `em`, `px`. Pixels is very common and that's what we used here. Later you'll\
    \ see how we can combine different values so that you can adjust your entire website\
    \ or specific parts with one value in your CSS code.\n\n`text-align: center;`\
    \ In our final statement/instruction we use the `text-align` property and set\
    \ it to `center`. Now our text in the paragraph is center aligned. Some other\
    \ values that you could have used here are `left`, `right`, and `justify`.\n\n\
    `}` And don't forget to end your `p` rule with the closing curly bracket.\n\n\
    We learned a few more properties in this example. Now if you save and run your\
    \ code you might notice that even though we were trying to style the paragraph\
    \ under the `h1` heading, our code affected every `p` element that we had on the\
    \ page in the exact same way. This is normal. Our selector is the `p` element,\
    \ so anything that is a `p` element gets the same style changes. There are two\
    \ ways that you can specifically pick what elements that you want to change: by\
    \ using classes or id's.\n\nAlso know that the order that you enter your statements\
    \ inside of your rules isn't that important. The main reason that you might want\
    \ to order them in a certain way is that it's easier to understand for you.\n\n\
    ### Text Decoration\n\nLet's go over a few more CSS text/font properties. We'll\
    \ add another statement inside of our `h1,h2` rule. Add this somewhere inside\
    \ of the curly brackets:\n\n```css\ntext-decoration: underline;\n```\n\nA few\
    \ other values that you could use here would be `overline`, `line-through`, and\
    \ `none`. The value `none` does have its uses, such as getting rid of bullets\
    \ in an unordered list.\n\n## Bold and Italicize\n\nThis is a quick exercise to\
    \ show you how to make your text bold and how to italicize it. We're going to\
    \ make two new rules inside of our `style` tags for the unordered list and the\
    \ ordered list. Add these two new rules right under your `p` rule:\n\n```css\n\
    ul {\n    font-weight: bold;\n}\n\nol {\n    font-style: italic;\n}\n```\n\nRun\
    \ your code again and you have a bold unordered list and an italicized ordered\
    \ list. If you wanted to bold or italicize a single word or just a few words on\
    \ your page, you could use HTML tags directly in your code. For example:\n\n`I\
    \ like things <b>bold</b> but not <em>italicized</em>.`\n\nYou surround whatever\
    \ word or words you want bolded with the `<b></b>` bold tags and use the `<em></em>`\
    \ emphasis tags for italicized words.\n\n## Body Styling and Inheritance\n\nBefore\
    \ we end this chapter let's get rid of that boring white background. The selector\
    \ that we use is `body`. Put this rule right after your opening `<style>` tag:\n\
    \n```css\nbody {\n    background-color: yellow;\n}\n```\n\nThe `body` is the parent\
    \ of everything inside of it (such as `h1`, `p`, and `footer` elements). The children\
    \ of the parent element `body` will inherit properties that we specify in it.\
    \ This is where we put code that we want to take effect site-wide (e.g., `font`,\
    \ `text-size`, `background-color`). When we make a rule for a specific element\
    \ like `p`, the properties inside are called overrides.\n\n## Quiz Chapter 12\n\
    \n1. What is the property used to change the size of text?\n2. How would you underline\
    \ text using CSS?\n3. How do you change the body's background color/wallpaper?\n\
    4. Why is a good idea to plan out your website design before you code?\n5. What\
    \ are some of the advantages of using a `body` rule in CSS?\n6. What are the HTML\
    \ tags used to make text bold and italicized?\n7. What are the CSS properties\
    \ and values used to make text bold and italicized?\n\n## Chapter 13: Borders\n\
    \nYou can add a border to any element on your page whether it's an image or a\
    \ paragraph. Let's center the `h1` and `h2` headings and add borders around the\
    \ text. Add this to your `h1,h2` rule:\n\n```css\nh1,h2 {\n    background-color:\
    \ blue;\n    color: white;\n    text-decoration: underline;\n    text-align: center;\n\
    \    border-width: 4px;\n    border-color: white;\n    border-style: solid;\n\
    }\n```\n\n- `text-align: center;` First we center aligned the text for our heading.\n\
    - `border-width: 4px;` We set our `border-width` property to 4 pixels thick.\n\
    - `border-color: white;` Next we tell the browser that we want the border to be\
    \ white.\n"
