    TV screen.


    7. widths, margins, padding, and the size of the content.


    8. To specify changes in sizes and positioning to the browser for targeted screen
    sizes.


    9. You will be able to copy and paste many elements, the CSS code that you created
    is re-usable throughout your entire site, You can copy and paste code and alter
    a few things to make a completely new element.


    ## What To Do After Completing This Book


    You should have a good understanding of HTML and CSS now. The best thing to do
    after completing this book is to practice. There are many more HTML elements available
    to you. The more experience you have working with the code, the more you will
    remember and the easier it will be to replicate. It''s also important to experiment
    and try new things. See what you can come up with. There are so many possibilities
    in web development and design. Doing more research on animations, special effects
    and responsive website development is another good place to start. You should
    also do a search for popular or common HTML and CSS code. There is so much more
    code out there. You don''t have to learn it all. Not even the most expert coder''s
    know all of the code there is off the top of their head. It depends on the content
    you want to create. We covered pretty much all of the basic code and some popular
    code in this book. But HTML and CSS has so many tools to let you create and design
    basically anything you can imagine. One other thing that you can look into is
    bootstrap. Do a search for bootstrap websites to learn more about it. The simplest
    way to describe bootstrap is that it is a library of different code languages
    available for you to use in your website. This library will make complicated code
    a whole lot easier. Animations, form validation, website sections, etc. are some
    of the things that bootstrap can help you tremendously with. You do want to have
    a good grasp on at least HTML and CSS first though. So practice is key.

