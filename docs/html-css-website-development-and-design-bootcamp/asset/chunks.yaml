    <p class="subHeading">written by Johnathan Doe.</p>


    </footer>


              <p>Welcome everyone to my new website designed to teach you many different
    types of computer programming languages. Also if you are interested in web development,
    web design, or adding programming to your website to make it more user interactive
    then this is the site for you. Please check out my Tutorials section. Some of
    the tutorial series that you will have access to are HTML, CSS, JavaScript, PHP,
    asp.net, and Java. Make sure to take a look at the How to build a responsive website
    series.


              </p></br>


              <p>Interested in app or game development? Check out my video series
    on Java. Java is a complex programming language used in almost everything nowadays.
    If your new to Java I suggest that you start out with the Java for beginner''s
    series. If you have a little experience in Java or even C# since it is very similar
    then you should be fine starting with the intermediate series. If you have any
    suggestions for this site please send us a message in the Contact Us page.


              </p>


    </article>


    <article class="bottomContent">


    <header>


    <h2>More information on web development and programming</h2>


    </header>


    <footer>


    <p class="subHeading">written by Johnathan Doe.</p>


    </footer>


    <p>This is an example of second div set up to separate information from the main
    content that we put in the top. Some reasons for this would be to improve the
    look and feel of your page. And to separate different subjects that you may be
    writing about. You can set up as many sections on your pages as you like. This
    is just a demonstration layout. Also each and every one of your pages can have
    the same layout or they can all be totally different. You will be able to copy
    and paste many elements from your main page into your sub pages and just alter
    where it is necessary. And your CSS rules can apply to those new pages or you
    can create new rules with the class or id attribute. Another thing to remember
    here as you go through this lesson is that the size of your content matters too.
    We are going to be floating our elements to the left when we are positioning.
    And if you remember how that works it will pin the element to the left of the
    screen. So this means a few things. The amount of text in this paragraph matters
    because first of all the browser will read your HTML code from top to bottom.
    So all of our main content that we want on the left side will display first. Then
    with giving them a width property we are going to leave room for our right side
    main content to fill in the extra space. You will see as we go along. But because
    we are going to be floating everything to the left, the content that we actually
    want to be on the left has to be larger than the right side content otherwise
    our content that we wanted on the right will have space to position all the way
    to the left. A good rule of thumb here for positioning your elements by floating
    everything to the left is just make sure that you have more content to the left.
    Which would make sense because it is your main section. You can experiment with
    floating right and different positioning systems afterward''s. You can also add
    a few line breaks at the end of your left side content as well to create a larger
    element. But you don''t want to add too many as it won''t look good. With the
    float left system that we are using in this layout we are making our page fluid.
    So when the page is viewed in a smaller display, since we floated everything left
    when there isn''t enough room to display our right side elements on the right
    they will float left stacking one above the other. You can test this by minimizing
    the browser window down to the smallest size and seeing what happens to the right
    side content and your navigation buttons, etc. when we get all of our CSS positioning
    code entered. We control all of this by specifying our width properties, floating
    left, margins, and padding. You will have to play around with your code a little
    bit to get everything just right when you add your own paragraph content. So you
    will basically debug all of your pages depending on the size of your content to
    make sure that everything stays fluid/responsive and in the area''s that you want.


