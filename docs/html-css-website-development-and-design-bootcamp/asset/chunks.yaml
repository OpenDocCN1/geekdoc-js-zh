    ## Chapter 22: Relative Positioning


    The final positioning system that we''re gonna talk about is relative. And this
    way of positioning can be kind of tricky. Using it might not give you the results
    that you want to achieve easily. But before we get into that we have to talk about
    static positioning. And you might be thinking we didn''t cover that. But static
    positioning is the default positioning system used when we don''t specify any
    other type. So we''ve been using static positioning throughout this book. If you
    wanted an example, You could go ahead and add the `position: static;` code to
    one of your CSS rules that you didn''t specify any other positioning system in.
    And you''ll see that their is no change. The reason we needed to discuss static
    positioning is because relative positioning is like absolute positioning in the
    way that you will tell the browser that you want to move an element a certain
    amount from say the `top` and the `left`. But there is a difference between absolute
    and relative. That is if we use `top` and `left` coordinates to position an element
    with absolute it will display your element from the top and the left of the browser
    window in most cases, But relative positioning will display your element from
    the top and left of where it would have been displayed on the page with no positioning.
    So for example if you made a list of some type and you didn''t give it any positioning
    code at all it would be positioned static by default. And then if you were to
    add a `position: relative;` with a `top` and `left` coordinate to your list it
    would move from where it was displayed originally by the amounts that you set
    with the `top` and `left` coordinates.


    ### Quiz Chapter 22


    1. What is the main difference between absolute and relative positioning?

    2. A relatively positioned element will position according to what?


    ## Chapter 23: Let''s Build A Responsive Website Layout!!!


    Finally! It''s time to work on our layout. We are gonna be learning a few more
    HTML elements in the process and some new CSS code. Our layout will consist of
    a completed Homepage with some content areas, a navigation menu that has some
    animations, and links to our other pages withing our website. It will be a responsive
    layout. So when we re-size our website, The elements will shrink and/or move to
    fit the screen. We will also be learning about the CSS external style sheet and
    using it for this design. There are a few things that we need to do first in order
    to begin. First we need to clear out all of the garbage on our learning page.
    Or you can just close it out and keep it as a reference. Just make sure that if
    you want to keep it you save it and rename it `examples.html` or something like
    that. Also you should remove it from the website folder and put it somewhere else.
    You should get rid of the image that is in there too. Whatever way you decide
    is fine. Right now you should have a folder on your desktop named `website` and
    it should either be empty or you should have an `index.html` page in it. If you
    have the `index.html` page in it, That page is gonna need to be cleaned up. Below
    is what your new or altered `index.html` page should look like now. And this is
    the framework that we''ll be working off of:


    ### Basic Framework Of Any Web Page


    ```

    <!doctype html>

    <head>

    <title></title>

    </head>

    <body>

    </body>

    </html>

    ```


    Just to clarify one more time, You should have a folder named `website` on your
    desktop with an `index.html` file saved in it. This file should have the code
    from the above example "Basic Framework Of Any Web Page" inside of it. The `website`
    folder should not have anything else inside of it besides the `index.html` file.
    And you should not have any other code in that file besides the basic framework
    code. Once you have that all set up the right way your good to go. Take note that
    as we go through this process of building a responsive layout you can change the
    colors, font, navigation button names, etc. You might want to follow along with
    the exercise and make your changes later. That is also fine. And as far as the
    meta data goes, the title element, description, and keywords are gonna be left
    up to you to create as your website will have a different title, description,
    and keywords. For demonstration purposes I''ll add a very simplified example of
    them as a refresher. The website created in this exercise is gonna be about teaching
    computer programming. Your site will be about something different. You are free
    to do whatever you want with the final product that we build here. You can keep
    it the same or change it completely. That is fine. It''s up to you. One other
    thing to know about website creation is the copyright stuff. If you browse around
    the internet you''ll notice that on most pages you''ll see some copyright information
    down in the footer. You may also see brand names, trademarks and other things.
    Know that even without the copyright information on the page it is still copyrighted.
    This is something that used to have to be specified. Nowadays your web pages,
    images, etc. are all copyrighted the moment you create or upload them to the internet.
    But it''s a good idea to just add a copyright down in your footer anyway.  And
    this way visitor''s will know that they need your permission to use any of your
    designs, etc.


    Okay now that we''re done with that we need to set up our CSS External Style Sheet.
    This is gonna be almost exactly like the internal style sheet that we''ve been
    using except it will be a completely separate file. And we will control all of
    our CSS styling right from there in a much more clear and organized way.


    ### Setting Up Our CSS External Style Sheet

