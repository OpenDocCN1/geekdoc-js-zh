  md: 'Although the Chart Wizard is very useful when the data series are static, it
    is not so helpful when the data is dynamic, such as unknown values being read
    from a server via JavaScript. You need a bit of JavaScript and an understanding
    of how the URL is constructed if you''ll be using image charts with dynamic data.


    One drawback of the image charts is the cryptic nature of the URL that must be
    passed to the Google servers. Let''s take a closer look at the format of the URL
    to generate the pie chart shown previously in Figure 8-5:


    ```

    https://chart.googleapis.com/chart?

    cht=p3&

    chs=500x250&

    chd=t:60,40&

    chl=Hello|World

    ```


    Here is a breakdown of the URL:


    ```

    https://chart.googleapis.com/chart?

    All chart requests are sent to this address.

    cht=p3&

    The type of chart—in this case, a 3D pie chart.

    chs=500x250&

    The size of the chart in pixels, width × height.

    chd=t:60,40

    ```


    The data for each pie slice (one data series), specified in a basic text format
    that allows floating-point values between 0 and 100. There are other ways to specify
    data in the URL, which I''ll cover later in this chapter.


    ```

    chl=Hello|World

    ```


    These are the labels for each slice, separated by a pipe character.


    Using ampersands (&) in URLs can cause problems with XHTML-encoded pages. Replace
    the ampersand symbol with &amp; if you encounter problems with WC3 validation
    or other issues with XHTML pages.


    ![](img/a94409271b7a0212fea9cd6ea548a191_216_0.png)


    Study the online documentation for details about the different chart styles and
    the multitude of URL parameters required to set them up.


    # Data Formats and Chart Resolution


    You can specify data for image charts in any one of four ways:


    Basic text


    As used in the pie chart example, for floating-point numbers 0–100 inclusive.'
