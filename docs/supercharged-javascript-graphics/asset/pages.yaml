    \ seconds versus 0.100001 seconds. Again, too small an improvement to be worthwhile.\n\
    \nThere are two factors that determine whether loop unrolling will provide a tangible\
    \ benefit:\n\n+   - The number of iterations. In practice, many iterations (probably\
    \ thousands) are needed to make a difference.\n- The proportion of time the inner\
    \ loop code takes versus the loop overhead. Complex inner loop code that is many\
    \ times slower to execute the loop overhead will show a smaller improvement. This\
    \ is because most of the time is being spent inside the inner loop, not the loop\
    \ overhead.\n\nIt is not practically easy to unroll loops that handle hundreds\
    \ or thousands of iterations. The solution is to use a technique that is a variation\
    \ of Duff's device. This works by performing partial unrolling of a loop. For\
