  md: '![](img/a94409271b7a0212fea9cd6ea548a191_212_0.png)


    Figure 8-2. All sorts of information can be given a visual kick with Google Chart
    Tools. This is a Google-O-Meter image chart.


    ![](img/a94409271b7a0212fea9cd6ea548a191_212_1.png)


    Figure 8-3. A sophisticated interactive chart with mouse-wheel zooming and drag
    scrolling


    +   * The maximum URL size for image charts is 2 KB using GET, and 16 KB using
    POST. There are no such limitations for interactive charts, which connect to the
    Google chart servers using AJAX.

    * The maximum number of chart requests is 250,000 per day. If you require more
    than this amount, you will need to contact Google. If you''re using mostly unchanging
    charts, one workaround is to simply take a copy of the generated image chart and
    save it on your own web servers as an image instead of constantly requesting the
    chart from Google.'
