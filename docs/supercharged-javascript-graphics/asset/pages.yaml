  md: '# PhoneGap


    PhoneGap is a suite of multiplatform native libraries that take regular web applications
    and hide them inside a native application “wrapper.” This enables you to distribute
    and sell web applications as if they were native applications on multiple mobile
    formats. However, although PhoneGap is undoubtedly useful, it is not a one-click-wonder
    solution that will convert web applications into best-selling native applications
    with no effort on your part. There are a few points to consider when using PhoneGap:


    +   - PhoneGap will not improve a web application’s performance. If your web application
    is slow, it will still be slow after made native with PhoneGap.

    - You’ll need to install the desired platform’s software development kit along
    with the relevant PhoneGap library. This is not a trivial task in some cases and
    can be tricky to get working.

    - If applicable, you will still be required to go through the desired platform’s
    approval process and pay any fees to release a web application wrapped with PhoneGap.


    The next chapter will demonstrate how to convert our TilePic application into
    a native Android application using PhoneGap.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# CHAPTER 10


    # Creating Android Apps with PhoneGap


    In the previous chapter, we developed a mobile-friendly web application using
    jQuery Mobile. In this chapter, we''ll convert the same mobile application into
    a native Android mobile application using PhoneGap. At first glance, converting
    a JavaScript application into a native Android application seems like a miraculous
    metamorphosis: native Android apps are usually written in Java, Java is not JavaScript,
    and you can''t convert from one to the other. How does PhoneGap manage this? PhoneGap''s
    apparent magical abilities lie within the Android system itself. Android provides
    a facility called WebView that allows native applications to display regular web
    content. This includes the ability to execute JavaScript within the web content
    as normal.


    One exciting feature of WebView is that it also allows interaction between a native
    Android application and the web content within the WebView. This is extremely
    useful, both for Android developers wanting to display and interact with web content
    within their applications and for web developers wanting to take advantage of
    Android device features like cameras and accelerometers. Essentially, PhoneGap
    is an Android application that uses a WebView for your web content, and also provides
    a JavaScript library for accessing some of the facilities of the Android device.


    Other flavors of PhoneGap work in a similar way. For example, the Apple iPhone
    version of PhoneGap uses the iOS system''s WebView facility internally. Regardless
    of the underlying implementation, the PhoneGap JavaScript library provides a consistent
    interface to the device''s features.


    This chapter explains how to install PhoneGap for Android on a Windows system
    using the Eclipse development environment. At the time of writing, PhoneGap has
    variants for Apple''s iOS, BlackBerry, Palm webOS, Windows 7 Mobile (coming soon),
    and Symian. All of the variants will require you to install the appropriate development
    environment.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Installing PhoneGap


    Web developers are used to installing JavaScript libraries a jiffy by including
    a simple script tag at the top of an HTML page. Installing PhoneGap and the other
    associated applications and files is a more laborious process. Some of the required
    elements may already be installed on your system, but this chapter assumes a clean
    install of all elements is required. Here''s a breakdown of the steps involved:


    +   1. The Java Development Kit (JDK). This differs from the Java Runtime Environment
    (JRE) which is typically installed on systems. The JRE allows Java programs to
    run on a system, while the JDK contains all the resources for actually developing
    Java applications (and also contains the JRE). Remember, PhoneGap is actually
    native Android Java application, and that''s your Java development must be enabled
    on your system.

    2. Install the Android Development Kit (SDK) for windows. This download enables
    you to install all the desired Android platform versions, tools, and utilities,
    including a virtual device manager and an Android emulator that allows you to
    test applications without actually having device hardware.

    3. Install the Eclipse Integrated Development Environment (IDE). This is the preferred
    IDE for Java and includes a code editor, debugger, project organization facilities,
    and other tools for making Java application development easier.

    4. Install the Android Development Tools (ADT) plug-in for Eclipse. This leverages
    Eclipse''s Java development tools and turns it into an Android IDE with everything
    you need for full-blown Android development.

    5. Install PhoneGap it is by far the smallest download!


    # Installing the Java JDK


    You can find the latest Java JDK on the Oracle website at http://www.oracle.com/technetwork/java/javase/downloads/index.html.
    This address may change in the future, but just search for "download java jdk"
    in Google, and you should find it.


    Click the leftmost link to download the JDK (Figure 10-1). Select the platform
    required (e.g., Windows), and agree to the terms of the license agreement. The
    download filename will be presented as a link (e.g., jdk-6u24-windows-i586.exe),
    and is approximately 75 MB in size (as opposed to about 15 MB for the JRE; this
    is one way to check whether you are downloading the correct file). Once the file
    has downloaded, simply double-click it to install.'
