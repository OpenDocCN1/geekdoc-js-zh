  md: '![](img/a94409271b7a0212fea9cd6ea548a191_172_0.png)


    The socket server (server.php) is actually composed of two parts: a general-purpose
    socket handler class (WebSocketServer), which can be used for a variety of applications,
    and a chat-application-specific callback function (process()), which is tailored
    to our chat application. Check out the book''s code repository for the PHP source
    code.


    Thorough coverage of PHP is beyond the scope of this book, but even if you have
    never used it before, the language is relatively easy to learn and there are a
    number of online resources. If you are interested in taking a closer look at the
    socket server code, there are a couple of PHP syntax idiosyncrasies worth mentioning:


    +   * Variables are preceded by a $ symbol (not to be confused with jQuery''s
    use of $).

    * Strings are only concatenated with a period symbol (.) instead of the usual
    addition sign (+).


    The socket server performs, among things, the following operations:


    +   * Accepts new connections and maintains a list of connected clients

    * Receives data updates from clients (chat text and position)

    * Transmits data updates to all connected clients

    * Removes clients from the list when connection is broken (e.g., browser closed)


    # Installing a web hosting environment


    Unless you have root access to a dedicated or virtual web server, it is unlikely
    that you will be able to get the socket server working. Properly configured server-hosting
    environments will invariably have a firewall that prevents any of any communications
    ports. Luckily, you can still experiment with server-side code by installing a
    hosting environment on your own local machine.


    Installing a web-hosting environment used to be a painful and lengthy process
    at the best of times. However, the “Apache Friends” XAMPP software consolidates
    the required modules (Apache and PHP) into a single download that you can install
    in a few minutes on Windows, Mac, and Linux systems. To download the XAMPP software,
    go to http://www.apachefriends.org/en/xampp.html.


    Figure 6-16 shows the XAMPP control panel. Note that PHP is not featured in the
    control panel and “just works” transparently.'
