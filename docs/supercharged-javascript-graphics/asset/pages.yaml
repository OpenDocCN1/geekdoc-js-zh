  md: "# Canvas and Recursive Drawing\n\nOne benefit of immediate mode drawing is\
    \ the lack of an intervening data structure that we've have to create and manipulate\
    \ to keep track of drawing elements; with immediate mode drawing, you can just\
    \ fire and forget drawing commands, layering them as thick as you like. This makes\
    \ Canvas particularly useful for high-density, recursive drawing functions like\
    \ fractals. Recursive functions are defined as those that call themselves. Feeding\
    \ the last set of results generated by a function back into the function, we create\
    \ a kind of software feedback loop. The following example calls itself 10 times:\n\
    \n```\nvar recurse(value1, value2) {\n  value1--;\n  value2++;\n  if (value1 <=\
    \ 0) return;\n  recurse(value1, value2);\n}\nrecurse(10,0);\n```\n\nThe previous\
    \ example is not particularly exciting, but it demonstrates two important aspects\
    \ of recursive functions:\n\n+   - Values are adjusted within the recursive function\
    \ and fed back into it.\n- We need a test to break out of infinite recursive loops.\n\
    \nInstead of applying simple increments and decrements, what if we did something\
    \ more interesting a bit of trigonometry and some random elements? Figure 6-14\
    \ shows a recursively tree that uses Canvas-drawing commands. The natural-looking\
    \ effect is a recognizable feature of recursive graphical functions. Notice how\
    \ the final tips of the branches look very refined and thin. This is due to the\
    \ previously fractional pixel anti-aliasing.\n\nThe highly detailed and complex\
    \ appearance defies the simple nature of the code:\n\n```\nvar drawTree = function\
    \ (ctx, startX, startY, length, angle, branchWidth) {\n  var rand = Math.random();\n\
    \  newLength, newAngle, newDepth, maxBranch = 3,\n  endX, endY, maxAngle = 2 *\
    \ Math.PI / 4,\n  subBranches, lenShrink;\n// Draw a branch, leaning to the left\
    \ or the right (depending on angle).\n// First branch (the trunk) is straight\
    \ up (angle = 1.571 radians)\n  ctx.beginPath();\n  ctx.moveTo(startX, startY);\n\
    \  endX = startX + length * Math.cos(angle);\n  endY = startY + length * Math.sin(angle);\n\
    \  ctx.lineCap = 'round';\n  ctx.lineWidth = branchWidth;\n  ctx.lineTo(endX,\
    \ endY);\n```"
