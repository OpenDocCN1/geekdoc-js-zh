    Figure 5-2. Orbit Assault, an arcade game—DHTML style


    but also created the hardware on which it ran. Regarded as an icon of the video
    industry, the compulsive and addictive game is still fun today.


    To ensure that our DHTML Orbit Assault is equally fun to play for a good proportion
    of Internet users, we''ll set the following requirements:


    +   - It should work on popular browsers on different hardware.


    +   - Within reason, we should aim for a consistent speed, regardless of browser
    or hardware.


    +   - We should preserve the best characteristics of the original Space Invaders
    game, including ticker elements like destructible shields.


    We''ve done some of the work alike: we will use the DHTMLSprite and timeInfo objects
    developed in Chapter 2.


    # # Game Objects Overview


    Orbit Assault uses six game objects to create its addictive gameplay. The following
    descriptions offer some insight into the behavioral characteristics of these objects
    and how they interact. Figure 5-3 shows the sprite images used by the objects.'
