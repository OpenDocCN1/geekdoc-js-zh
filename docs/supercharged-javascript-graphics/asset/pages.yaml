  md: 'These additional specifications will also improve the look and feel of the
    carousel:


    +   - All images should retain their attributes and any event-based functionality
    attached to them.

    - Links surrounding the images should not be affected by the carousel.

    - The appearance of the carousel should be flexible in terms of the overall dimensions
    and scaling of the carousel items.

    - The carousel elements should ideally fade in when their images load, avoiding
    any flickering or jerking effects as the DOM is changed.

    - When the user hovers his mouse over carousel items, the carousel will spinning,
    and start again when he moves the mouse away. This will make it easier to select
    items.


    # Carousel image loading


    For the carousel to be initialized correctly, we must know the width and height
    of the image items in order to perform all the calculations related to carousel
    item positions and scaling. In an ideal world, we would know the sizes of all
    images being used in the carousel before they load. In practice, this won''t necessarily
    be the case, but we can find the size of any image it has loaded by reading its
    width and height properties.


    However, detecting when an image has loaded is a more frustrating task than you
    might expect. It is not as simple as attaching a load event to an image and acting
    when the event occurs. Unfortunately, load event leads are inconsistent across
    different browsers. Browsers may not or may trigger the event when the image is
    loaded from the browser cache instead of the network. One fail-safe way of ensuring
    that images have been loaded is to listen for the window load event. When this
    event is fired, it means that all the page assets have been loaded. The drawback
    of this method is that the entire page must be loaded before the user can start
    interacting with the contents.


    It might seem wasteful to trigger the loading of images that are already specified
    within image elements in the DOM. In fact, there is very little overhead, as the
    images will be obtained from the browser cache if they have been loaded previously.


    The following loadImage() function facilitates image-loading initialization and
    detection. It takes into account the various browser idiosyncrasies, enabling
    image loading to be initialized and executing a callback function when the image
    has arrived from the network or browser cache. The function works with existing
    image elements already in the DOM, or with image elements created with new Image().
    loadImage() expects an image element, the source URL of the image, and a callback
    function as arguments.'
