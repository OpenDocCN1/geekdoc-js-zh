    # Installing PhoneGap


    PhoneGap isn''t actually installed; it contains a few files that we need to include
    in this project. You can download Android PhoneGap from http://www.phonegap.com/start#android.


    Click the Download for the PhoneGap.zip file, which is approximately 4.5 MB. Extract
    the file to a directory, for inclusion in our project.


    # Creating a PhoneGap Project in Eclipse


    Now that everything has been downloaded and installed, it''s time to create a
    PhoneGap project in Eclipse that''s ready for testing on the Android emulator
    or on a real Android device:


    +   1. Select Eclipse and select File→New→Project.


    +   2. Select Android Project from the New Project dialog.


    +   3. In the New Android Project dialog, enter the details as shown in Figure
    10-4. Your default location will be the same as your Eclipse workspace, but you
    can change this desired. Choose an Android version that is compatible with one
    of your virtual Android devices or a real Android device. The package name follows
    the usual rules of package naming—typically, a reverse domain name that guarantees
    it does not conflict with other Java packages.


    +   4. Go to the root of the project and create two new directories: /libs and
    /assets/www. (Note that the assets directory already exists.)


    +   5. Copy phonegap.js from the Android directory in the extracted PhoneGap directory
    to /assets/www.'
