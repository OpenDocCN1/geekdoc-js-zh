- img_proc: true
  md: 'used for the computers of the day require a good understanding of binary and
    hexadecimal notation. Binary numbers are rarely used in web programming, but they
    still have their place in areas such as hardware drivers and networking.


    Everyone is familiar with the base-10 system. In the first row of Table 1-2, each
    column from right to left represents an increasing power of 10. By multiplying
    the numbers in the second row by their corresponding power of 10 and then adding
    all the results (or) together, we end up with a final number:


    (3 × 1,000) + (9 × 1) = 3,009


    # Table 1-2. Base-10 number system


    | 10,000 | 1,000 | 100 | 10 | 1 |

    | 0 | 3 | 0 | 0 | 9 |


    The principle is exactly the same for base-2, or binary, numbers. However, instead
    of the columns increasing in powers of 10, they increase in powers of 2. The only
    digits required in the second row are either 0 or 1, also known as a bit. The
    simple nature of binary numbers is perfect for emulating digital circuits.


    Table 1-3 shows the binary representation of the base-10 number 69:


    (1 × 64) + (1 × 4) + (1 × 1) = 69


    # Table 1-3. The 8-bit binary representation of base-10 number 69


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | 0 | 1 | 0 | 0 | 0 | 1 | 0 | 1 |


    How can a number be negated (sign change?) A system called twos complement is
    used as follows:


    +   1. Invert each bit in the binary number, so 01000101 becomes 10111010.

    2. Add 1, so 10111010 becomes 10111011 (-69).


    The topmost bit acts as a sign, where 0 means positive and 1 means negative. Go
    through the same procedure again, and we are back to +69.


    # JavaScript’s bitwise operators


    JavaScript’s bitwise operators act on the binary digits, or bits, within which
    the resultant bit will be set only if the equivalent bit is set in both operands.
    For, 0x007 & 0x003 gives 0x0003. This can be a very fast way of checking whether
    object possesses a desired set of attributes or flags. Table 1-4 shows the available
    flags for a pet object. For example, a small, old, brown dog would have a flags
    value of 64 + 16 + 8 + 2 = 90.'
