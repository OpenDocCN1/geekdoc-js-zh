  md: '```

    // This code is unoptimized, but illustrates the calculations required.

    var vertOffset = -Math.floor(index * 64 / 256); // 64 is the sprite height.

    var horizOffset = -(index * 64 % 256);

    ```


    Notice how the values calculated are negated. The div element is a fixed, 64-pixel-square
    aperture above the first cog image (index = 0). To show the next cog (index =
    1), the container image must be moved to the left by 64 pixels (negative horizontal
    offset). If the index were set to the last cog image (index = 4), the container
    image would need to move up by 64 pixels (negative vertical offset).


    ![](img/a94409271b7a0212fea9cd6ea548a191_44_0.png)


    Figure 2-1. Animation images embedded into a single container image; each dotted
    grid represents 32 pixels


    How are sprites of different sizes handled? In Figure 2-1, there are some smaller
    32-pixel sprite images at the bottom of the container image. The calculation to
    determine the pixel offsets are the same as before, but we use the required sprite
    size of 32 pixels instead:


    ```

    // This code is unoptimized, but illustrates the calculations required.

    var vertOffset = -Math.floor(index * 32 / 256) * 32; // 32 is the sprite height.

    var horizOffset = -(index * 32 % 256);

    ```


    The index also need to take into account that the sprite sizes are now 32 pixels.
    The first 32-pixel sprite image in Figure 2-1 (the first small black circle) has
    an index of 32. As long as sprite images appear in the container image at pixel
    boundaries that are a multiple of their size, they can be accessed using indexing
    calculations.


    ![](img/a94409271b7a0212fea9cd6ea548a191_44_1.png)


    The container image in Figure 2-1 is a 32-bit PNG file, which allows millions
    of colors and an alpha channel for smooth transparency. Unfortunately, 32-bit
    PNGs don''t work well in IE6, because the transparent areas become an opaque grey.
    One solution is to save the image as an 8-bit palletized PNG. In IE6, any semitparent
    areas will disappear completely and show a coarser edge.'
