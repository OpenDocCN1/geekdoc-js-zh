  md: "# What happens if the delay is reduced?\n\n```\nsetInterval(bigFunction, 5);\n\
    ```\n\nIt would be reasonable to expect each setInterval() callback to be queued\
    \ several times after the first callback executes. In fact, the usual behavior\
    \ is that only one callback to bigFunction() will ever be active. The queued callback\
    \ happen immediately after the first callback has finished? Possibly, but not\
    \ necessarily; other events and code running in the browser can force setInterval()\
    \ callbacks to be delayed or dropped altogether. Callbacks may even occur back\
    \ to back, at less than the interval specified, if JavaScript sees a window of\
    \ opportunity to flush the queue.\n\nThe important lesson is here that while setInterval()\
    \ works at millisecond resolution, there is no guarantee that callbacks will be\
    \ executed at the intervals specified.\n\nsetTimeout() calls a function, only\
    \ once, after a specified delay. You might think of it as setInterval()'s more\
    \ predictable friend.\n\n```\nsetTimeout(bigFunction, 50);\n```\n\nThis will call\
    \ bigFunction(), only once, after a delay of 50ms. With setInterval(), the delay\
    \ should be regarded as a guide.\n\nYou can also use setTimeout() to call a function\
    \ continuously, but with less unpredictable behavior than setInterval():\n\n```\n\
    // This is a callback function.\nvar bigFunction = function() {\n  // Do something...\n\
    \  // This code needs to be called regularly.\n  // It takes 20ms to execute\n\
    \  setTimeout(bigFunction, 10);\n}\n```\n\nWhenever bigFunction() finishes, it\
    \ sets up another setTimeout() with itself the callback.\n\nIn this example, though\
    \ the timeout is less than the time it takes for bigFunction() to execute, the\
    \ setTimeout() callback will execute only after bigFunction() has finished. In\
    \ fact, the frequency of execution will be similar to the following alternative\
    \ code, which uses setInterval():\n\n```\nsetInterval(bigFunction, 20*10);\n```\n\
    \n# Timer Accuracy\n\nBrowsers running under Windows have to cope with coarse-grained\
    \ timers. For example, the underlying operating system used by Windows XP means\
    \ that JavaScript functions such as Date(), setInterval(), and setTimeout() will\
    \ not give reliable results when the timings are less than 15ms or so. One browser\
    \ to use this is Google Chrome, which offers 1ms accuracy by switching Windows\
    \ into an accurate timer mode."
