  md: "# Summary\n\nThe preceding overview of image charts showed how to create basic\
    \ charts with a correctly formatted URL, and how to use JavaScript to create image\
    \ charts with dynamic data. The Chart API gives you virtually unlimited options\
    \ and chart combinations, and with Google offering \"no questions asked\" use\
    \ of the API for anyone requesting fewer than 250,000 charts per day, is plenty\
    \ of scope for experimentation.\n\nNext, we move on interactive charts (aka Google\
    \ Visualizations API), which is a more programmer-focused interface to Google's\
    \ charting services.\n\n# Interactive Charts\n\nIn contrast to image charts, (as\
    \ their name implies) are displayed as regular images, interactive charts are\
    \ composed of dynamic graphics that are drawn using various browser facilities\
    \ such as HTML, Flash, Canvas, SVG, and VML. Typical interactivity includes zooming,\
    \ scrolling, sorting, tool tips, and hover effects.\n\nThe drawing method employed\
    \ is mostly transparent to the developer, as a well-written visualization will\
    \ use the appropriate rendering method for the target browser. This is a great\
    \ time-saver, allowing the developer to concentrate on the functionality and aesthetics\
    \ of the charts rather than the minutiae of drawing.\n\nInteractive charts require\
    \ the use of an external API, which you would typically include in the <head>\
    \ section of your page, as any external library:\n\n```\n<script type=\"text/javascript\"\
    \ src=\"https://www.google.com/jsapi\"></script>\n```\n\nThe stages required to\
    \ draw a chart using the visualizations API are as follows:\n\n+   1. Load the\
    \ general Google AJAX API.\n2. Request the appropriate visualizations API.\n3.\
    \ When the visualizations API has loaded, prepare the data, and finally draw the\
    \ chart into an element on the page.\n\nThe following code draws a chart using\
    \ the same bakery sales data used earlier in the chapter:\n\n```\n<html>\n<head>\n\
    <!-- Load the general Google AJAX API --\n<script type=\"text/javascript\" src=\"\
    https://www.google.com/jsapi\">\n</script>\n<script type=\"text/javascript\">\n\
    // Load the visualization API, using the 'corechart' package within it.\ngoogle.load(\"\
    visualization\", \"1\", {\n  packages: [\"corechart\"]\n});\n</script>\n```"
