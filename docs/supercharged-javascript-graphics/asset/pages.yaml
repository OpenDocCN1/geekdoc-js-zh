  md: '# CHAPTER 9

    Reaching the Small Screen with jQuery Mobile


    Web-enabled mobile devices have opened up a plethora of development options for
    programmers and designers. With so many mobile platforms available, covering all
    bases and developing native applications for each mobile operating system is not
    practical. A nonexhaustive list of mobile operating systems includes:


    +   * iOS

    * Symbian

    * Android

    * BlackBerry OS

    * Windows Mobile

    * webOS


    Each of these operating systems has its own development environment and programming
    languages. For example, Apple''s iOS uses the Cocoa development environment and
    the Objective-C programming language, whereas Android is built on Linux with development
    in Java. Unfortunately, the smallness of the devices defies the complexity of
    the underlying software. Even if we ignore the prospect of having to learn another
    programming language, we''re still faced with large and complex operating systems
    that provide a significant learning curve in and of them.


    To e out the best performance from mobile devices and to make best of their hardware
    facilities; we''d ideally develop using the native operating systems and programming
    languages of the platform. However, where absolute performance is not crucial,
    development time is limited, and multiplatform support is desired, there is an
    alternative. Using your usual web tools—JavaScript, HTML, and CSS—you can develop
    applications that offer much of the look and feel of native software, but without
    the overhead and learning curve. However, it''s important to be realistic about
    what is possible with this method of development: JavaScript is not the fastest'
  merge: -1
  pgno: 232
