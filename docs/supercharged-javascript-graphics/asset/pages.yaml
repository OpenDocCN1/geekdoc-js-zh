    The createRadialGradient() command allows you to create a radial gradient that
    spans two circles. The command accepts two circles specified with a position and
    radius:


    ```

    ctx.createRadialGradient(circleX, centerY, circleRadius, circleX, centerY, circleRadius);

    ```


    Typically, the circles’ centers are at the same position and the first circle
    lies inside the second, although this is not a prerequisite for the function to
    work. Any area the first, smaller circle is filled with the first color defined
    by addColorStop(); this color fades to the ends of the larger circle into the
    final color defined by addColorStop(). Any area outside the larger circle is also
    filled with the final addColorStop().


    The following function creates a sun using a radial gradient that fades from solid
    white to transparent yellow. We can overlay this on the sky and grass gradient
