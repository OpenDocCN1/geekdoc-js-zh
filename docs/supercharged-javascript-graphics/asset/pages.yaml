  md: "# Creating a JavaScript Vector Object\n\nTo make the most of vectors in JavaScript,\
    \ we can encapsulate some of the functionality described earlier in a reusable\
    \ object, making the vectors easier to use in applications. We can then easily\
    \ attach any additional vector-related functionality to this object as needed.\n\
    \nThe x and y components of the vector are actually called vx and vy in the vector\
    \ object; this makes it more obvious in the later code examples that we are dealing\
    \ with vector properties and not some other x and y values:\n\n```\nvar vector2d\
    \ = function (x, y) {\n  var vec = {\n    // x and y components of vector stored\
    \ in vx,vy.\n    vx: x,\n    vy: y,\n\n    // scale() method allows us to scale\
    \ the vector\n    // either or down.\n    scale: function (scale) {\n      vec.vx\
    \ *= scale;\n      vec.vy *= scale;\n    },\n\n    // add() method adds a vector.\n\
    \    add: function (vec2) {\n      vec.vx += vec2.vx;\n      vec.vy += vec2.vy;\n\
    \    },\n\n    // sub() method subtracts a vector.\n    sub: function (vec2) {\n\
    \      vec.vx -= vec2.vx;\n      vec.vy -= vec2.vy;\n    },\n\n    // negate()\
    \ method points the vector in the opposite direction.\n    negate: function ()\
    \ {\n      vec.vx = -vec.vx;\n      vec.vy = -vec.vy;\n    },\n\n    // length()\
    \ method returns the length of the vector using Pythagoras.\n    length: function\
    \ () {\n      return Math.sqrt(vec.vx * vec.vx + vec.vy * vec.vy);\n    },\n\n\
    \    // A faster length calculation that returns the length squared.\n    // Useful\
    \ if all you want to know that one vector is longer than another.\n    lengthSquared:\
    \ function () {\n      return vec.vx * vec.vx + vec.vy * vec.vy;\n    }\n  });\n\
    ```"
  merge: -1
  pgno: 190
