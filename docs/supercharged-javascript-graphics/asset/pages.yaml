  md: "You can create SVG XML manually with any text editor, or output it from a drawing\
    \ package like Adobe Illustrator or Inkscape. The following SVG example displays\
    \ a blue rectangle:\n\n```\n<xml version=\"1.0\" standalone=\"no\" ?>\n<!DOCTYPE\
    \ svg PUBLIC\n  //W3C//DTD SVG 1.1//EN\" \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n\
    \  <rect id=\"a_rectangle\" width=\"100\" height=\"100\" fill=\"rgb(0,255,0)\"\
    \ />\n</svg>\n```\n\nTo manipulate the rectangle using JavaScript, you need to\
    \ access the rectangle element and adjust its attributes as required. Sound? Like\
    \ HTML, we have to go through a DOM-like structure to define visuals. What happens\
    \ if we, for example, 1000 rectangles? That’s right—we have to insert 1000 element\
    \ elements into the XML. This approach is not particularly efficient or intuitive\
    \ for programming-dynamic graphics.\n\nSVG offers you the ability to draw and\
    \ animate without resorting to JavaScript at all, and you can edit it very simply\
    \ using the plethora of SVG-compatible tools available. Now benefiting from support\
    \ in IE9, SVG is a good solution where vector imagery is required. Sites like\
    \ Wikipedia use SVG extensively for vector illustrations.\n\n# Canvas Versus Adobe\
    \ Flash\n\nMost users are familiar with Adobe Flash. It powers a huge amount of\
    \ online advertising content, videos, and games. Indeed, there are many examples\
    \ of websites created with Flash. It is a mature plug-in dating back to 1996 and\
    \ enjoys nearly ubiquitous installation on many systems. However, there are issues\
    \ with Flash and developments in HTML5 (which includes Canvas) that may herald\
    \ a sea change in the creation of rich internet content:\n\n+   - Flash is a proprietary\
    \ format owned by Adobe. There is no charge for playing Flash, but to develop\
    \ it you must purchase the appropriate authoring software. Using a closed system\
    \ like Flash to power web-based content is incongruous with the evolution of the\
    \ free and open web.\n- Flash has its roots in the desktop PC era. It is deliberately\
    \ not supported-browser on popular mobile hardware, such as the iPod, iPhone,\
    \ and iPad. Apple relinquished slightly in September 2010, allowing software to\
    \ be developed with Flash and then packaged as native applications.\n- Despite\
    \ the availability of Flash Lite on some mobile devices and Flash 10.1 support\
    \ on Android 2.2-powered devices, mobile users are less dependent on Flash for\
    \ rich content. They can compensate for its absence with easily downloaded native\
    \ applications (e.g., the excellent Android YouTube player application) or thousands\
    \ of games."
