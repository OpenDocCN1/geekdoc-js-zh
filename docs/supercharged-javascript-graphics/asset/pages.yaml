  md: "```\n// normalize() method turns the vector into a unit length vector\n// pointing\
    \ in the same direction.\nnormalize: function () {\n  var len = Math.sqrt(vec.vx\
    \ * vec.vx + vec.vy * vec.vy);\n  if (len) {\n    vec.vx /= len;\n    vec.vy /=\
    \ len;\n  }\n  // As we have already calculated the length, it might as well be\n\
    \  // returned, as it may be useful.\n  return len;\n},\n\n// Rotate the vector\
    \ by an angle specified in radians.\nrotate: function (angle) {\n  var vx = vec.vx;\n\
    \  vy = vec.vy;\n  cosVal = Math.cos(angle);\n  sinVal = Math.sin(angle);\n  vec.vx\
    \ = vx * cosVal - vy * sinVal;\n  vec.vy = vx * sinVal + vy * cosVal;\n},\n\n\
    // toString() is a utility function for displaying the vector as\n// a useful\
    \ debugging aid.\ntost: function () {\n  return '(' + vec.vx.toFixed(3) + ', '\
    \ + vec.vy.toFixed(3) + ')';\n}\nreturn vec;\n```\n\n# # A Cannon Simulation Using\
    \ Vectors\n\nNow we've defined the vector object, we can use it to develop a simple\
    \ cannon simulation (Figure 7-5). First, I should qualify the term \"simulation\"\
    : our goal is not to replace with absolute realism the physics of a cannon, but\
    \ rather to create a simulation that is realistic enough for applications like\
    \ games. Even the most advanced physics in games have to suspend reality somewhat.\
    \ For example, human characters in games do not simulate physics to remain upright\
    \ and walk, and aircraft in games do not simulate all the physics of flight to\
    \ remain airborne.\n\n![](img/a94409271b7a0212fea9cd6ea548a191_191_0.png)\n\n\
    Strictly speaking, for accurate simulations, you should factor the time elapsed\
    \ per frame into your calculations. However, for the purposes of this demonstration,\
    \ we'll assume a frame rate of 30 milliseconds. In actuality, timers on certain\
    \ browsers are not particularly accurate anyway, so the lack of time calculations\
    \ is no great loss."
