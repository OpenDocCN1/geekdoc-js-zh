    # Installing the Android SDK


    To download the Android SDK, visit http://developer.android.com/sdk/index.html.

    For Windows systems, the recommended file to download is the Windows installer
    version (installer_r10-windows.exe at this writing). This will install the base
    software tools for Android development, aka the Android SDK Manager (ASM). The
    ASM includes its tools for managing and installing updates of the Android platforms
    and other components (Figure 10-2). The full suite of Android platforms and components
    can take a while to download in the ASM, but you only need to do it once, downloading
    updates as when they become available.


    In addition to the regular Windows application you use, the ASM opens a command-line
    window (aka DOS box). No to panic; this is normal. The ASM is actually a convenient
    Windows wrapper for a suite of Android command-tools you can use if you need.
    In fact, all Android development can be done with a basic text editor and the
    Android command-line tools, but the Eclipse environment and associated extras
    make life a lot easier.


    If, when you try to install the ASM, it pops up a message saying that the Java
    JDK is not found (even though it definitely has been installed), click the back
    button in the message dialog and try again. This is a workaround for a bug in
    the ASM installer that can bring up the “JDK not found” message incorrectly.'
