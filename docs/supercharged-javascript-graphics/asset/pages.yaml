- img_proc: true
  md: 'Text format with custom scaling


    For positive or negative floating-point numbers with no range limits.


    # Simple encoding format


    A compact format where integer values 0–61 inclusive are represented by single
    characters.


    # Extended encoding format


    A compact format where integer values 0–4,095 inclusive are represented by combinations
    of two characters.


    Why are all these different formats offered? URLs are limited to 2 KB in size
    (assuming the URL is sent via the GET method). The two encoded formats allow for
    more compact representation of chart data, thus increasing more complex charts
    will fit within the 2 KB limit. The two nonencoded formats are easier to create
    and read, but are larger in size. A POST method is also supported that allows
    for 16 KB of data to be transferred via an HTML form. This method requires additional
    programming to post the chart data to the server and display the response.


    The range of values allowed for each data format dictates the resolution of the
    chart using that format. The extended encoding format provides ample resolution
    for most applications (4,096 distinct values), and even the simple encoding format,
    with its modest resolution of 62 values, is adequate for smaller charts. Larger
    charts will still work at this resolution, but you may notice inaccuracies imposed
    by the limited granularity.


    The JavaScript calculation to scale arbitrary data values into the available resolution
    is as:


    ```

    scaledValue = resolution * dataValue / maxData;

    ```


    maxValue is the chart limit above which none of the unscaled data values will
    pass. This value can simply be equal to the largest value in the set, but for
    certain types of chart, a larger maxValue may be more aesthetically pleasing.
    For example, if you''re using a data set that includes a maximum value of 185,
    then using a maxValue of 200 will ensure that the vertical axis is always slightly
    larger than the tallest bar in the case of vertical bar charts.


    # Basic text format


    Basic text format allows you to specify floating-point numbers 0–100 inclusive.
    Values below 0 are lost, and values above 100 are truncated.


    The syntax for basic text format is as follows:


    ```

    chd={val_1_1,val_1_2,val_1_3|val_2_1,val_2_2,val_2_3|...}

    ```


    Notice the use of the pipe character to separate the data series. Although this
    simple format is the easiest to create and use, it also takes a lot of space,
    so watch out that 2 KB limit.'
