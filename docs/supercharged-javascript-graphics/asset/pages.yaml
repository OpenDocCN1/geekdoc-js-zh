    Figure 6-15. A pseudo-3D graphical chat application using HTML5 Canvas and WebSockets


    # # The WebSockets Advantage


    Canvas has enjoyed its share of the HTML5 limelight, and another equally exciting
    (but possibly less well known) HTML5 element is WebSockets. Although this book
    is about graphics, it''s worth discussing why WebSockets are significant for modern
    web applications and how they can be integrated with Canvas.


    The Web typically transmits its data between servers and client browsers using
    the HTTP protocol, but HTTP has certain limitations (unlike shiny new WebSockets)
    that make it unsuitable for high-speed, bidirectional network communication:'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'It''s a one-way street


    The client web browser requests data from the server and the server then obliges.

    The server cannot "push" information to the client without being asked for it
    specifically.


    It carries significant overhead


    HTTP data carries a lot of baggage in the form of header information. Requesting

    just one byte of data can result in potentially hundreds of bytes of additional
    "invisible"

    header information also being sent. Among other things, the headers typically
    contain information about the nature of the data being transmitted, such as

    content type, caching, encoding, etc.


    Its connections are nonpersistent


    For each HTTP request, a connection has to be negotiated, the data sent, and the

    connection closed again. This is analogous to holding a telephone conversation\and
    having to call back after each sentence.


    You can improve HTTP performance by using programming techniques

    such as Comet/Long polling, which try to simulate the persistent, bidirectional
    connections of more efficient network sockets. Although these techniques can offer
    some

    im으로, there is a danger that the server will not be able to serve the high volume

    of HTTP connections required; server software Apache is not particularly

    efficient at handling such connections. Ultimately, you cannot make a milk pulse
    out of

    a cow''s ear: HTTP is too inefficient for the sort of network transmission required

    of multiplayer games and other fast-communication applications.


    WebSockets address these problems by allowing genuine, persistent, and bidirectional

    connections between client and server. The client can send data to the server
    at any

    time and vice versa. Also, there is very little data overhead, there are no headers

    once the connection is established. The data is simply preceded by a 0 byte (0x00)
    and

    termin by 0xff.


    # WebSockets Support and Security


    WebSockets are currently supported by Firefox 4, Google Chrome 4+, Opera 10.70+,\and
    Safari 5. Unfortunately, security issues surrounding the WebSockets communication

    protocol have been proposed by the developers of Firefox and Opera to disable
    default

    WebSocket functionality, and other browsers may consider the same course

    of action. You can find technical details of the security issues at http://www.ietf.org/

    mail-archive/web/hybib/current/msg04744.html.


    So, it looks like default WebSockets functionality is in a state of flux until
    a newer

    revision of the underlying protocol abates the security concerns. However, there
    is no

    reason to start experimenting with WebSockets in preparation for the protocol

    visions.'
