  md: '# CHAPTER 6


    # HTML5 Canvas


    One of HTML5’s tantalizing features is the Canvas element. Taking the form of
    a simple rectangular area within the page (similar to a div), Canvas allows you
    to draw sophisticated graphics inside it using JavaScript. It was initially developed
    by Apple for rendering user interface widgets and other imagery on the Mac operating
    system and by the Safari browser. Apple released its patents relating to Canvas
    under the World Web Consortium’s (W3C) royalty-free licensing terms. This means
    that Apple provides royalty-free licensing for Canvas when it appears within the
    context of W3C HTML recommendations.


    This chapter covers the basics of Canvas and uses it to implement various practical
    applications. A fully exhaustive coverage of the tag is beyond the scope of this
    book


    +   * Canvas Pocket Reference by David Flanagan (O’Reilly), http://oreilly.com/catalog/036920016045/

    * HTML5 Canvas by Steve Fulton and Jeff Fulton (O’Reilly), http://oreilly.com/cata/log/0369200133227


    Canvas is a low-level, immediate mode application programming interface (API):


    Low level

    Canvas provides a fast but fairly basic feature set. For instance, rectangles
    are the only native primitive shape. However, you can augment the feature via
    JavaScript programming.


    Immediate mode

    Canvas drawing instructions are executed the moment they are called; unlike SVG,
    Canvas has no intermediate data structure that stores a hierarchy of graphical
    objects. This means that drawing operations can be layered indefinitely with no
    degradation in performance—perfect for applications such as bitmap art packages
    or other elaborate “layered” effects.


    The following Canvas example displays a blue rectangle:'
  merge: -1
  pgno: 140
- img_proc: true
  md: "```\n<!DOCTYPE html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=utf-8\" />\n<script type=\"text/javascript\" src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js\"\
    ></script>\n<script>\n$(document).ready(function() {\n  var canvas = $(\"#a_canvas\"\
    )[0],\n  var ctx = canvas.getContext('2d');\n  ctx.fillStyle = \"rgb(0,0,255)\"\
    ;\n  ctx.fillRect(50, 25, 150, 100);\n});\n</script>\n</head>\n<body>\n<canvas\
    \ id=\"a_canvas\"></canvas>\n</body>\n</html>\n```\n\n(The use of jQuery depends\
    \ on personal preference.)\n\nCanvas's low-level nature makes it a neat and simple\
    \ system to use, and its speed is well suited to dynamic graphics applications.\
    \ Anyone who has programmed graphics on other systems will feel at home here with\
    \ Canvas.\n\n# Canvas Support\n\nThe Canvas element is supported in most popular\
    \ browsers, including Firefox, Chrome, Opera, and Safari. After much conjecture,\
    \ on July 1, 2010, via the Internet Explorer 9 (IE9) development blog, Microsoft\
    \ announced that its latest browser would support the Canvas element. Indeed,\
    \ the company went one better and augmented its Canvas support with hardware acceleration.\
    \ This relatively low-key announcement believes importance: Internet Explorer\
    \ still holds the lion's share of market, and its support of Canvas provided the\
    \ lynchpin to ensure developer use of the element. IE9 works only on Windows Vista\
    \ and Windows 7; it is not supported by Windows XP (still the most popular operating\
    \ system). It will come before the Canvas benefits of IE9 reach all Windows users.\n\
    \n# Bitmaps, Vectors, or Both?\n\nCanvas has a small well-chosen set of both vector\
    \ and bitmap commands that are suitable for a wide variety of applications. What's\
    \ the difference between the two?\n\nVector\n\nVector graphics are defined by\
    \ mathematical representations of lines and curves. You can fill vector shapes\
    \ with color and/or pick their outlines with a color stroke. The key advantage\
    \ of vector graphics is that they can be scaled to any size"
  merge: -1
  pgno: 141
- img_proc: true
  md: 'with loss of quality: edges and detail remain razor-sharp. Vectors are best
    suited for imagery that contains larger areas of solid or gradient color and low
    detail density—typically, charts, graphs, flags, road maps, and cartoon-style
    images. Because of their mathematical nature, vectors are perfect for manipulating
    JavaScript.


    # Bitmap


    Bitmap images (like the ubiquitous JPEG format) are defined by a grid of square
    pixels in varying colors. They do not scale very well, as the image becomes blocky
    (pixelated) when enlarged and fragmented from its original size. This is because
    individual pixels are either enlarged or lost. Some implementations of Canvas
    may minimize these undesirable effects by applying a blur filter. Bitmaps are
    best used for photographic-style imagery with significant areas of detail.


    ![](img/a94409271b7a0212fea9cd6ea548a191_142_0.png)


    The final viewable output from Canvas is always bitmap, regardless of how the
    image was generated. If you want to take advantage of sharp vector scaling, you
    need to redraw the image at any new scale using vector commands. Simply increasing
    the zoom using browser controls or enlarging the canvas with CSS will give exactly
    the same result as zooming a bitmap image: a blocky/blurry effect.


    # Canvas Limitations


    There are a few limitations to using Canvas, some of which come with the low-level
    territory it occupies:


    +   - The lack of data structure for visual elements means that you must create
    your own objects in JavaScript to update the positions and other attributes of
    nonstatic graphical items.

    - Related to the preceding point, you cannot apply events (like mouse clicks)
    to items drawn within Canvas, as they do not exist as tangible entities; they
    are just transient drawing operations. You must program such functionality.

    - You must have a good knowledge of JavaScript to fully exploit Canvas.


    # Canvas Versus SVG


    Some members of the web standards community had initial reservations about Apple
    creating another standard for browser graphics. Surely, Scalable Vector Graphics
    (SVG) had this base covered already? Superficially, SVG and Canvas appear to offer
    similar graphics capabilities, but there is a fundamental difference: SVG is a
    high-level XML-based markup language, where you draw by creating XML elements
    with attributes to define the image, whereas Canvas offers a drawing API that
    you access directly from JavaScript.'
