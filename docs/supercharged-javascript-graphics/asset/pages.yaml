- img_proc: true
  md: "# Data series\n\nA data series represents a set of related data values from\
    \ a table, and any chart will feature one or more data series. In Table 8-1, each\
    \ column represents one of three data series: Days, Cookie sales, and Cake sales.\n\
    \nTable 8-1. Tabular representation of bakery sales over a three-day period; each\
    \ column represents a data series\n\n| Day | Cookie sales | Cake sales |\n|---|---|--|\n\
    | Monday | 90 | 75 |\n| Tuesday | 40 | 65 |\n| Wednesday | 60 | 35 |\n\n# Axis\
    \ labels\n\nAxis labels are either text or numeric labels that run along the length\
    \ of each axis. The chart in Figure 8-4 features text labels along the horizontal\
    \ axis and numeric labels on the vertical axis. You can automatically generate\
    \ labels by specifying a range and step value. Depending on the kind of chart,\
    \ a data series may be used to create axis labels; notice how the Day series is\
    \ used to create labels for the horizontal axis.\n\n# Legend\n\nA legend describes\
    \ a data series in a chart. In Figure 8-4, there are two color-coded legends (Cookies\
    \ and Cakes) that describe the corresponding series in Table 8-1.\n\n# Image Charts\n\
    \nImage charts are designed to allow nonprogrammers with no JavaScript knowledge\
    \ to create impressive-looking chart images. In contrast to the interactive charts\
    \ API, if you know a little HTML, you can use image JavaScript libraries, as the\
    \ chart is requested from the Google servers with a regular URL request. Figure\
    \ 8-5 shows the results of the following HTML page:\n\n```\n<html>\n<body>\n \
    \ <img src='https://chart.googleapis.com/chart?cht=p3&chdt=60,40&chs=500x250&chl=Hello|World'\
    \ />\n</body>\n</html>\n```\n\nNot bad for such a simple piece of code. However,\
    \ constructing the URL can be a complicated and repetitive task. Frankly, if you\
    \ are using charts where the data set is static (unchanging values that are known\
    \ beforehand), Google has provided a free Chart Wizard that makes the process\
    \ of creating image charts a whole lot easier (Figure 8-6). You can find the Chart\
    \ Wizard at http://code.google.com/apis/docs/chart_wizard.html."
