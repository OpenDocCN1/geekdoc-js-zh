  md: '![](img/a94409271b7a0212fea9cd6ea548a191_211_0.png)


    Figure 8-1. Your accountant won''t appreciate a chart like this

    Interactive charts use a JavaScript API (loaded as an external library) to render
    all sorts of dynamic charts and graphics in the browser. While making use of interactive
    charts requires some programming skill, the biggest challenge is choosing from
    the vast array of options available. Figure 8-3 shows an interactive chart example.


    The first part of this chapter explores image charts, and the second explores
    interactive charts.


    # Limitations


    There are a few limitations to Google Chart Tools, mostly involving image charts,
    and you should consider them if you intend to be adventurous with the API:


    +   - Image charts are limited to a maximum pixel area of 300,000 pixels, with
    the longest edge being no longer than 1,000 pixels. In real terms, this is plenty
    for a reasonably large chart.'
