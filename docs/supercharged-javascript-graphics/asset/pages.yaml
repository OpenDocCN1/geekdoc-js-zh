  md: "# CHAPTER 7\n\n# # Vectors for Games and Simulations\n\nMost programmers will\
    \ agree that programming is a lot more fun than mathematics, but there are certain\
    \ circumstances where a little bit of math knowledge can go a long way. As a “value\
    \ added” math subject, vectors punch way above their weight in terms of useful\
    \ functionality. Mix together a few other math ingredients, and you have a versatile\
    \ vector toolkit that can be used for all sorts of applications. Don't worry if\
    \ math isn't your strong point; the JavaScript equivalents of equations will always\
    \ be provided. Although it can be a benefit if you understand the underlying mathematics,\
    \ it is not crucial.\n\nVectors are typically described as a quantity that has\
    \ both a magnitude (length) and direction. Exactly what does this mean? Some simple\
    \ examples illustrate the concept best.\n\n+   - Nonvectors:\n  - 2 miles\n  -\
    \ 12 inches\n  - 1 kilometer\n\n+   - Vectors:\n  - 2 miles north\n  - 12 inches\
    \ to the right\n  - 1 kilometer northeast\n\nWhy are vectors useful? Because they\
    \ make all sorts of movement and spacial behavior lot easier to understand and\
    \ implement in code. Vectors can be added, scaled, rotated, and pointed at them.\
    \ They also form the foundation of sophisticated programming subjects like physics\
    \ simulations. Most importantly, when you get the hang of them, they are huge\
    \ of fun.\n\nThe real-world distances and directions described in the preceding\
    \ lists are familiar and make sense; however, as JavaScript programmers, we are\
    \ more interested in measurements and directions that are relevant to our applications—not\
    \ miles and inches."
  merge: -1
  pgno: 184
- img_proc: true
  md: 'What units of measurement should we use? In fact, the actual units of measurement
    are irrelevant: as long as we stick to the same units for all calculations, we
    can convert them screen pixel positions at the end, ready for drawing.


    In our real-world examples, the direction part of the vectors are specified as
    compass directions and "to the right." These values aren''t practical for JavaScript,
    so we must represent a position in some other way. A length and direction (a vector)
    in 2D space (e.g., your computer screen) can be represented by horizontal (x)
    and vertical (y) components. Figure 7-1 shows four different vectors on a grid
    with their x and y components.


    ![](img/a94409271b7a0212fea9cd6ea548a191_185_0.png)


    Figure 7-1. Four direction vectors with their x and y components


    For this chapter''s examples, we will stick to the familiar CSS/bitmap screen
    coordinate system with the origin in the top left, an x-axis increasing to the
    right, and a y-axis increasing towards the bottom (aka Cartesian coordinate system).
    In this example, the vectors represent a direction and length, not a position.
    The positions on the grid are arbitrary and purely for illustration purposes.
    However, the x and y components can be used to represent a position, depending
    on how the vector is used in the application.


    In Figure 7-1, the directions have been specified with x and y components, but
    what about the length of the vectors? If a vector points in the same direction
    as any one axis, then the length is the length along that axis; for example, it''s
    fairly obvious that vector A has a length of 5 and vector B has a length of 4.
    But if the vectors aren''t parallel to any one axis, like vectors C and B? Things
    aren''t quite so obvious in this case, neither the x or y component represents
    the length of the vector.


    168 | Chapter 7: Vectors for Games and Simulations'
