- img_proc: true
  md: 'Although it is not an official recommendation, you''ll often see ctx used to
    refer to the drawing context in example Canvas code.


    ![](img/a94409271b7a0212fea9cd6ea548a191_147_0.png)


    There is also a 3D drawing context available that gives you access to the currently
    experimental WebGL interface. WebGL is based on the OpenGL ES 2.0 standard (a
    pared-down version of OpenGL) and provides 3d capabilities via JavaScript. It
    is available in development of most browsers. OpenGL is really a set of low-level
    functions that still require you to do a fair amount of work to create a 3D application.


    There was some initial doubt in the community about whether JavaScript was capable
    of managing the hierarchy of objects in a more than 3D scene; regardless of whether
    or not the objects are being drawn by WebGL, numerous other calculations are required
    to manage a 3D application or game. With the ongoing improvements in JavaScript
    performance, the language has inspired more confidence and various higher-level
    3D libraries have emerged that can simplify 3D application development. All of
    these libraries are built on top of WebGL:


    +   - O3d (originally a plug-in, but now a JavaScript library)

    - GLGE

    - C3DL

    - SpiderGL

    - SceneJS

    - Processing.js


    # Drawing Rectangles


    Canvas is not overly generous in its built-in shape-drawing offerings—in fact,
    we are limited to rectangles:


    ```

    // Draw a 100 by 150 pixel filled rectangle at coordinate (10,10).

    ctx.fillRect(10,10,100,150);

    ```


    ```

    // Draw a 100 by 150 pixel outlined rectangle at coordinate (10,10).

    ctx.strokeRect(10,10,100,150);

    ```


    ```

    // Clear a 100 by 150 pixel rectangle at coordinate (10,10).

    ctx.clearRect(10,10,100,150);

    ```


    The apparent bias toward rectangles isn''t a problem, though, because we can create
    all other shapes by using paths defined by combinations of lines and curves.


    # Drawing Paths with Lines and Curves


    A path defines a shape that can then be filled and/stro with an outline. Canvas
    includes the following functions to perform path drawing:'
  merge: -1
  pgno: 147
- img_proc: true
  md: '| Function | Description |

    | --- | --- |

    | beginPath() | Starts a new path |

    | moveTo() | Sets the current position of the path |

    | lineTo() | Defines a line from the current position |

    | arc() | Defines an arc (portions of a circle) |

    | arcTo() | Defines an arc from the current position |

    | quadraticCurveTo() | Defines a quadratic curve from the current position |

    | bezierCurveTo() | Defines a Bézier curve from the current position |

    | closePath() | Ends a path |

    | stroke() | Strokes a path with an outline |


    An important thing to note is that the drawing position where one "to" command
    (lineTo(), bezierCurveTo(), etc.) also defines where the next "to" command''s
    drawing position begins. It can be useful to use the "to" as drawing without a
    pencil without being able to lift it off. The moveTo() command allows you to lift
    off the pencil or position it somewhere else again.


    The following example uses lines to draw a filled triangle in the top left and
    a stroked triangle in the right (Figure 6-3), assuming a canvas size of 500 ×
    500 pixels:


    ```

    // Draw a filled triangle, top-left.

    ctx.beginPath();

    ctx.moveTo(20,20);

    ctx.lineTo(470,20);

    ctx.lineTo(20,470);

    ctx.fill();


    // Draw a stroked triangle, bottom-right.

    ctx.beginPath();

    ctx.moveTo(480,30);

    ctx.lineTo(480,480);

    ctx.lineTo(30,480);

    ctx.closePath();

    ctx.stroke();

    ```


    Notice you don''t need a closePath() command for the filled triangle, as fill()
    automatically closes the path.


    ![](img/a94409271b7a0212fea9cd6ea548a191_148_0.png)


    Canvas allows you to specify fractional pixel positions. You may find this odd
    at first glance, as pixels are unit elements and obviously cannot be subdivided.
    However, Canvas uses anti-aliasing techniques to give the illusion that fractional
    pixel positions exist. This allows for cleaner-looking edges and smoother movement,
    especially when shapes move slowly.'
