  md: 'Finally, we need to run the actual chat web page (the JavaScript) in the browser.
    The simplest way to do this is by specifying the filesystem location of the page
    in the browser, for example, file:///C:/professorcloud.com/book/canvas/canvas-websockets-chat.htm.


    Apache is not serving the chat page when we use the file:/// protocol, as the
    browser is directly accessing the HTML file.


    You can also test several instances of the chat web page by opening multiple browser
    windows and "chatting" with yourself.


    A more elaborate way to test the chat application is to serve the chat page and
    run the chat server on a computer (the web server) across a network. Here are
    the steps involved:


    +   * 1. On the web server, modify the Apache httpd.conf file to include a virtual
    host entry to map the web server''s IP address to the location of the chat application
    on the web server. The first virtual host defined will be the default one for
    the web server''s IP address.

    *2. Start Apache via the XAMPP control panel.

    Users of other computers on the network can connect to the chat application by
    entering the web server''s IP address into a suitable browser.


    You can find documentation on how to set up XAMPP for hosting here:


    +   * Windows: http://www.apachefriends.org/en/xampp-windows.html

    * Mac: http://www.apachefriends.org/en/xampp-macosx.html

    * Linux: http://www.apachefriends.org/en/xampp-linux.html


    # The camera


    The camera object determines the perspective view of the chat area. It contains
    three utility functions:


    ```

    setFOVAndPos()

    ```


    The field of view (FOV) and vertical position of the camera are passed in. Calculating
    the camera distance from the FOV allows you to change the canvas size without
    affecting the view presented (assuming the same aspect ratio is maintained). We
    use a value of 125 degrees FOV and a camera position of -128.


    ```

    worldToScreen()

    ```


    This calculates the screen coordinates from the world coordinates passed in. It
    uses a scale that can be applied to the avatars so they appear smaller the farther
    away they are, effectively simulating perspective.


    ```

    screenToWorld()

    ```


    The opposite of worldToScreen(). From a position on the canvas, the equivalent
    world coordinates are returned. screenToWorld() converts the mouse-click position
    into a new world position for the user''s avatar. We use the toFixed() method
    to'
