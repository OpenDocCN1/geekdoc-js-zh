    Total = 193 objects


    Performing a total of 442 collision tests per cycle is not good. This scenario
    could become exponentially if the collision system were used in another game with
    more lasers, bombs, and aliens, possibly resulting in thousands of tests being
    performed.


    We can further reduce the number of tests by eliminating redundant checks between
    objects that cannot possibly be colliding. A neat way of doing this is to create
    a grid, where each grid square contains a list of objects occupying it. An object
    needs to check collisions only against other objects in the same grid square,
    or any immediately surrounding squares (a total of nine squares). As long as the
    largest objects fit within a single grid square, this technique will work. In
    Orbit Assault, the grid square size is 32 pixels. Figure 5-4 illustrates how we
    can eliminate obviously noncolliding objects from checking by using this method.
    Only the five aliens on the left have any chance of touching the tank, and they
    will be checked; the three aliens on the right will be ignored.


    ![](img/a94409271b7a0212fea9cd6ea548a191_117_0.png)


    Figure 5-4. Game objects partitioned into a grid for collision detection purposes'
