  md: '+   - month

    - time

    - datetime

    - datetime-local


    Implementing these new input types is no different than implementing existing
    input types like `hidden`, text, or password:


    ```

    <input type=''date''>

    ```


    Although these HTML5 facilities are a step in the right direction for cross-browser
    form elements, there are some limitations:


    +   - Browser support is patchy, to say least, with unsupported elements being
    replaced by regular `<input>` tags.

    - Appearance and behavior will vary from browser to browser. This is important
    if you require a consistent look and feel for a website.


    **Figure 4-1** shows how an HTML date input element looks in Opera, Chrome, and
    Firefox. Opera shows a full calendar with various bells and whistles, whereas
    Chrome keeps things basic with up and down buttons to increase or decrease the
    date. Firefox shows nothing but a regular input.


