  md: '# Alien bombs


    The lowest alien in each column drop bombs on the player, although in practice
    only alien bomb is usually visible at a time. The alien bombs can be destroyed
    by laser bolts fired from the player''s tank. Alien bombs will damage the player''s
    protective shields piece by piece.


    # Shields


    The player''s tank is protected by four shields, although these gradually erode
    as they are damaged by both alien bombs and the tank''s laser. The shields are
    a double-edged sword: while they provide cover, they can also prevent the player''s
    laser from hitting aliens. One gameplay tip is to blast a narrow hole through
    the shields that will allow the tank''s laser to pass through but still offer
    protection. The shields in the original game were destroyed in small and irregular
    pixel stages, and this can be tricky to emulate using HTML. In our version of
    the game, each shield is split into 48 elements, which provides a fine enough
    resolution to provide an authentic feel, but is still sensible in terms of CPU
    utilization.


    # Player''s tank


    The tank moves horizontally under the player''s control and can be destroyed by
    a single hit from an alien bomb. It can fire single laser bolts at the aliens,
    and its movement extremes are limited to just beyond the left and right shields.
    The player starts with four available tanks, and an additional one is awarded
    every 5,000 points.


    # Tank''s laser


    The tank shoots laser bolts that will damage the protective shields, destroy aliens,
    and intercept alien bombs. Only one laser bolt can be deployed at a time, which
    makes the game more challenging: a missed shot that travels to the top of the
    play area results in a costly delay before the player can fire another.


    # Mystery saucer


    At random intervals, a flying saucer appears above the aliens and moves horizontally
    across the play area. Should the tank''s laser manage to hit the saucer, the player
    is awarded a random bonus score of 50, 100, or 150 points.


