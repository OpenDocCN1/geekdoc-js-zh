  md: 'Luckily, we can use the Pythagorean theorem to calculate the length of our
    vector based on the x and y components. The definition of the Pythagorean theorem
    is as follows:


    For a right-angled triangle, the square (area) of the hypotenuse is equal to the
    sum of the squares of the other two sides (Figure 7-2).


    ![](img/a94409271b7a0212fea9cd6ea548a191_186_0.png)


    Figure 7-2. Pythagorean theorem


    In Figure 7-2, the hypotenuse is the longest edge of the central triangle (in
    this instance, at the bottom of the triangle), opposite the right angle at the
    top. The theorem works regardless of which side the hypotenuse is. How does all
    of this relate to our vectors? Imagine that the two shorter edges of the triangle
    in Figure 7-2 are our x and y components. The length of the vector squared is
    simply the length of the hypotenuse squared:


    ```

    length² = x² + y²

    ```


    or in JavaScript:


    ```

    lengthSquared = {x*x + y*};

    ```


    The squared length of the vector can be useful, but we might want the actual length.
    We can calculate this using the square root of the squared length:'
