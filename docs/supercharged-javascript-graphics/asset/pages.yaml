  md: "![](img/a94409271b7a0212fea9cd6ea548a191_189_0.png)\n\nFigure 7-4. A radian\
    \ in all its glory\n\nRadians aren't particularly intuitive to work with and visualize,\
    \ but it's easy to convert to and from radians and degrees using these JavaScript\
    \ functions:\n\n```\n// Degrees to radians.\ndegToRad = function(deg) {\n  return\
    \ deg * (Math.PI/180);\n}\n```\n\n```\n// Radians to degrees.\nradToDeg = function(rad)\
    \ {\n  return rad * (180/Math.PI);\n}\n```\n\nOne difference between radians and\
    \ degrees is that 0 radians actually points along the horizontal axis to the right.\
    \ This is different from 0 degrees, which is usually assumed to be pointing straight\
    \ up along the vertical axis.\n\n# Dot Product\n\nA dot product gives the cosine\
    \ of the angle between two vectors, or to put it another way, tells us how similar\
    \ in direction two vectors are. The possible values range from -1 to 1 (assuming\
    \ the vectors are unit length). Here are examples of what the values mean:\n\n\
    +   - Vectors pointing in the same direction: dot product = 1\n- Vectors positioned\
    \ at 45 degrees to each other: dot product = 0.5\n- Vectors at right angles (90\
    \ degrees) to each other: dot product = 0\n- Vectors pointing in the opposite\
    \ direction: dot product = -1\n\nThe dot product is useful in situations where\
    \ we need to know to what extent objects are facing each other. For example, in\
    \ a game, we could determine the dot product whether two characters \"see\" each\
    \ other, or whether a particular side of a shape is pointing in a certain direction."
