  md: 'A reference to the style property of each tile is stored in an array, enabling
    you to quickly change properties such as background position.


    The background position of each tile index is stored as a string in an array in
    the following format: ''px 0px'', ''px 64px'', etc. You can then push these strings
    straight into the background position property one go instead of updating the
    left and top properties separately.


    Because you only ever add the visible tiles to the DOM once during viewport setup,
    the browser will not try to reflow the page content or perform any other time-consuming
    actions during scrolling.


    ![](img/a94409271b7a0212fea9cd6ea548a191_74_0.png)


    Browser reflow is the action that recalculates the positions and sizes of all
    the DOM elements when something changes the page flow. Absolute or fixed-position
    elements are taken out of the flow, and you can manipulate them with impunity
    without triggering a reflow.


    # Scrolling code


    The scrolling code is split into two main parts:


    +   * Initialization and precalculation

    * Drawing


    A single instance of tileScroller handles the scrolling within a single viewport.
    The setup parameters are passed in an object with the properties shown in Table
    3-1.


    | Property | Description |

    | $viewport | Viewport element in DOM |

    | tileWidth | Width of tiles, in pixels |

    | tileHeight | Height of tiles, in pixels |

    | wrapX | Whether to wrap map horizontally |

    | wrapY | Whether to wrap map vertically |

    | mapWidth | Width of map, in tiles |

    | mapHeight | Height of map, in tiles |

    | image | URL of single tileset image that contains individual tile images |

    | imageWidth | Width of tileset image, in pixels |

    | imageHeight | Height of tileset image, in pixels |

    | map | An array of tile index numbers |


    Table 3-1. Parameters passed to tileScroller


    Figure 3-6 shows the scrolling code in Example 3-3 in action with three layers.'
