  md: '# Bitwise Operators, Integers, and Binary Numbers


    In JavaScript, all numbers are represented in a floating-point format. In contrast
    to languages as C++ and Java, int and float types are not explicitly declared.
    This is a surprising omission, and a legacy of JavaScript''s early years as a
    simple language intended for web designers and amateurs. JavaScript''s single
    number type does help you avoid numeric type errors. However, integers are fast,
    CPU-friendly, and the preferred choice for many programming tasks in other languages.


    ![](img/a94409271b7a0212fea9cd6ea548a191_29_0.png)


    JavaScript''s number representation is defined in the ECMAScript Language Specification
    as "double-precision 64-bit format IEEE 754 values as specified in the IEEE Standard
    for Binary Floating-Point Arithmetic gives (a somewhat huge) range of numbers
    (±1.797693134862157 × 10³⁰⁸) or small numbers (±5 × 10⁻³²). Beware, floating-point
    numbers are subject to rounding errors; for example, alert(0.1 + 0.2) displays
    0.3000000000000004, not 0.3 as expected!


    A closer look at the ECMAScript Standard reveals that JavaScript has several internal
    operations to deal with integers:


    +   * ToInteger

    Converts to an integer

    * Int32

    Converts to a signed 32-bit integer

    * Uint32

    Converts to an unsigned 32-bit integer

    * ToInt16

    Converts to an unsigned 16-bit integer


    You cannot use these operations directly; rather, they are called under the hood
    to convert numbers into an appropriate integer type for JavaScript''s rarely used
    bitwise operators. Though sometimes incorrectly dismissed as slow and irrelevant
    to web programming, some of these possess quirky abilities that can be useful
    for optimization.


    ![](img/a94409271b7a0212fea9cd6ea548a191_29_1.png)


    Bitwise operators convert numbers into 32-bit integers, with a range of -2,147,483,648
    to 2,147,483,647. Numbers outside this range will be adjusted to fit.


    # A quick recap of binary numbers


    During the halcyon days of computing, when 16 KB of RAM was considered a lot,
    binary numbers were a programmer''s staple diet. The sort of low-level programming'
  merge: -1
