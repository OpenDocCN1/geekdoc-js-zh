  md: "JavaScript. In fact (cautiously sticking my neck out), I might suggest that\
    \ due to JavaScript's flexible and expressive nature, you can develop projects\
    \ in it more quickly than in other languages.\n\nLikely, most of JavaScript's\
    \ shortcomings can be mitigated, by forcibly contorting it into the ung own imitation\
    \ of another language, but by taking advantage of its inherent flexibility while\
    \ avoiding the troublesome bits. The class-based nature of other languages can\
    \ be prone to unwieldy class hierarchies and verbose clauses. JavaScript offers\
    \ other inheritance patterns that are quite useful, but lighter-weight.\n\nIf\
    \ there are many ways to skin a cat, there are probably even more ways to perform\
    \ inheritance in JavaScript, given its flexible nature. The following code uses\
    \ prototyp to create a Pet object and then a Cat object that inherits from it.\
    \ This kind of inheritance pattern is often found in JavaScript tutorials and\
    \ might be regarded as a “classic” JavaScript technique:\n\n```\n// Define a Pet\
    \ object. Pass a name and number of legs.\nvar Pet = function (name, legs) {\n\
    \  this.name = name; // Save the name and legs values.\n  this.legs = legs;\n\
    }\n```\n\n```\n// Create a method that shows the Pet's name and number of legs.\n\
    Pet.prototype.details = function () {\n  return this.name + ' ' + this.legs +\
    \ ' legs';\n}\n```\n\n```\n// Define a Cat object, inheriting from Pet.\nvar Cat\
    \ = function (name) {\n  Pet.call(this, name, 4); // Call the parent object's\
    \ constructor.\n}\n```\n\n```\n// This line performs the inheritance from Pet.\n\
    Cat.prototype = new Pet();\n```\n\n```\n// Augment Cat with an action method.\n\
    Cat.prototype.action = function () {\n  return 'Catch a bird';\n}\n```\n\n```\n\
    // Create an instance of Cat in petCat.\nvar petCat = new Cat('Felix');\n\ndetails\
    \ = petCat.details(); // Felix has 4 legs.\nvar action = petCat.action(); // 'Catch\
    \ a bird'\npetCat.name = 'Sylvester'; // Change petCat's name.\npetCat.legs =\
    \ 7; // Change petCat's number of legs!\ndetails = petCat.details(); // Sylvester\
    \ has 7 legs.\n```\n\nThe preceding code works, but it's not particularly elegant.\
    \ The use of the new statement makes sense if you're accustomed to other OOP languages\
    \ like C++ or Java, but the prototype keyword makes things more verbose, and there\
    \ is no privacy;"
