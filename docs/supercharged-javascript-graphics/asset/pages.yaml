    # Alien Invaders


    Probably the most memorable characteristic of the original Space Invaders is the
    hypnotic choreography of the aliens as they traverse the screen. Arranged in a
    grid of 5 rows and 11 columns, the aliens move horizontally until one touches
    the edge of the play area. At this point, they all descend slightly and reverse
    their horizontal direction. If any of the aliens reaches the bottom of the play
    area, the game ends.


    To destroy the aliens, the player fires laser bolts from his tank. The lowest
    alien in each column can drop bombs, which the player must dodge while trying
    to eliminate each row. The topmost aliens are the smallest and award 40 points
    when hit. The next two rows are slightly wider and award 20 points, while the
    largest aliens on the bottom two rows award 10 points.


    As the player eliminates each alien, the next wave begins lower than the previous
    one. One gameplay tip is to destroy the aliens on the extreme edges first, as
    this extends the time before an alien reaches the extents of the play area, making
    all the aliens descend.


    The original Space Invaders hardware was too slow to move all 55 aliens simultaneously,
    so each alien moved in every game cycle (about 1/60 of a second). This is the
    reason for the characteristic shimmering effect of the alien group''s movement,
    and it also produces an ingenious gameplay mechanic: the fewer aliens there are,
    the faster they move. This is merely a side effect of each alien''s turn becoming
    more frequent as the aliens are gradually eliminated. The final solitary alien
    moves very quickly, as it does not have to wait for its turn to move.


    One common mistake in Space Invaders remakes is having all the aliens move simultaneously
    as a solid group. This requires additional code to speed up the aliens depending
    on how many remain, and it also loses one of the most recognizable aspects of
    the original game.'
