  md: 'To learn more about the topic of JavaScript timers, read the following online
    articles:


    +   - http://ejohnn.org/blog/how-javascript-timers-work/

    - http://ejohnn.org/blog/javascript-in-chrome/


    The upshot is that an application should not run on timings over 15ms, or about
    1/64 of a second. Is this a major problem? In most cases, it''s unlikely that
    such a time-sensitive application would (or should) be running under JavaScript
    within a browser. Animations might run a little slower or faster than expected,
    and expectations like games might not give a perfectly consistent frame rate.
    If one were pedantic to scrutinize the cumulative effects of these inaccuracies
    over a period of time, there would be a noticeable deviation. However, under normal
    usage conditions, such as playing a game or watching a menu fade in, the deviations
    would be imperceptible.


    One area that you approach with caution, is the use of Date() to profile code.
    The following example will inaccurate results if the code executes too quickly:


    ```

    var startTime = new Date().getTime();

    *** Execute some code that has less than 15 milliseconds ***/

    var endTime = new Date().getTime();

    var elapsedTime = endTime - startTime;

    ```


    A better solution is to execute the code repeatedly over a longer period of time—one
    second—and then out the speed of execution from the number of iterations achieved
    within that time.


    # Achieving Consistent Speed


    One problem with the sprite implementation shown earlier—or, more specifically,
    the code that moves the sprites—is that different browsers will yield an inconsistent
    speed of animation or movement, or *frame rate*. For instance, on a 2.8GHz PC,
    a fast browser like Opera or Google Chrome will might have a hundred sprites at
    50 frames per second (FPS), whereas Firefox might manage 30 FPS, and Internet
    Explorer 8 just 25 FPS. Add different hardware into the mix, and you''ll see more
    frame-rate inconsistencies.


    This may not be an issue for cosmetic animations and effects, but for applications
    like games where a consistent speed of movement is important to playability, these
    variations are a problem.


    To combat this issue, you must modify the calculations used to move and animate
    the sprites to take into account frame rates, giving an apparently consistent
    speed in different hardware and software environments. For example, a sprite moving
    across the screen in two-pixel steps at 30 FPS will appear to move the same speed
    as a sprite moving across the screen in one-pixel steps at 60 FPS. The main discernible'
  merge: -1
