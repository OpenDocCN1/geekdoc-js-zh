    # # Installing Eclipse


    Eclipse is a popular IDE for many programming languages, and is the recommended
    choice for Android development. Augmented with the Eclipse Android plug-in, it
    provides all the tools to work with Android projects, including those using PhoneGap.


    Eclipse comes in several flavors for various programming languages and platforms.
    We are interested in the recommended version, Eclipse Classic (Figure 10-3), which
    is the Java development version and can be downloaded from http://www.eclipse.org/downloads/.


    Being a Java application itself, Eclipse will not create any Windows registry
    entries, program groups, or shortcut icons. It runs entirely from its installation
    directory via the eclipse.exe file. You can create your own shortcut icon to this
    executable if desired.


    If you are serious about full-blown application development or wish to augment
    PhoneGap with additional capabilities, there is a huge amount of resources relating
    to Eclipse development. The following link is a good starting point: http://www.eclipse.org/resources/'
