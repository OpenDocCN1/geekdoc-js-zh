    # # Installing Android Development Tools


    Eclipse would be nothing without its plug-ins, and virtually every programming
    language has an Eclipse plug-in. The plug-ins add language-specific functionality
    to Eclipse such as syntax highlighting, class browsing, debugging facilities,
    and much more.


    There is no reason why you couldn''t do Android development with the regular Java
    version of Eclipse, but the most efficient Android development environment is
    provided by the ADT plug-in.


    You can find further information about installing the ADT Eclipse plug-in at http://developer.android.com/sdk/eclipse-adt.html.


    The ADT is actually installed from within Eclipse rather than a separate application.
    There are a few steps involved to install the ADT:


    +   1. Start Eclipse, and select Help→Install New Software.

    2. Click the Add button.'
