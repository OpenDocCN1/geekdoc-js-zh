  md: '# CHAPTER 2


    # DHTML Essentials


    DHTML seems like a curiously old-fashioned term these days, especially within
    the context of more modern browser facilities such as HTML5 Canvas, SVG, and Flash.
    However, rather like the tortoise and the hare, DHTML will always be the more
    reliable (if slower) contender than the other, more exciting methods are not guaranteed
    to be available.


    Actually, in many cases you don''t need anything other than DHTML; the use of
    other methods can often be attributed to developer “wants” rather than “needs.”
    Casual games, image zones, and many other effects are perfectly feasible without
    resorting to the “power tools.” Libraries like jQuery can make implementation
    easier. A little thought and delicate manipulation of the DOM will ensure that
    DHTML graphics can move quickly and smoothly.


    In this chapter, we''ll develop a fast sprite system using vanilla JavaScript
    and DHTML. For the sake of compatibility, we''ll avoid the latest bleeding-edge
    developments in the language and instead focus on the effective of core JavaScript.


    # Creating DHTML Sprites


    In computer graphics, sprites are two-dimensional bitmap objects that can be moved
    around under software control. Until the advent of three-dimensional polygon graphics,
    video game consoles used almost exclusively for generating their characters. Mobile
    devices have prompted a resurgence in the use of sprite-like graphics for casual
    games and other user interface effects. We can emulate sprite functionality using
    DHTML. In the following section, we''ll create a DHTMLSprite object for use in
    a variety of applications. Although there are never and faster methods of creating
    sprite-like effects (such as the HTML5 Canvas element), regular DHTML provides
    solid cross-browser compatibility and in many situations it is a perfectly viable
    alternative to using plug-ins as Adobe Flash.


    > * http://en.wikipedia.org/wiki/The_Tortoise_and_the_Hare'
