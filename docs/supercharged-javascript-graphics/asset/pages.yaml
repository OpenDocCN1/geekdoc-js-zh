- img_proc: true
  md: 'Sprites in this context are subtly different from CSS sprites, a popular web
    design technique. CSS sprites refer to altering only the CSS background position
    of an HTML element, thus allowing the element to show a small portion of a larger
    background image for the purpose of animation effects. In graphics parlance, this
    is known as dynamic coordinates. For our purposes, a sprite maintains its original
    meaning of a movable object, although we will use the CSS sprite technique to
    change its image.


    Sprite should be versatile enough to use in a variety of applications, and offer
    the following capabilities:


    +   - Change its image (animation) with a simple function call and image index.

    - Manage its own DOM element internally.

    - Hide and show itself without altering the DOM.

    - Remove its DOM element and perform any cleanup.


    # Image Animation


    Sprites would be boring without animation, so we need a neat method of changing
    the image used for the sprite. Although using an image element for sprite drawing
    seems like an obvious choice, it involves loading a different image file for each
    animation frame. There is a more efficient way to handle multiple sprite images
    while also reducing the number of image files.


    The CSS background-position property allows HTML elements (a div, in this case)
    to show a small portion of a larger image. A single container image can therefore
    act as a repository for numerous smaller sprite images. To use these sprite images,
    we must define the horizontal and vertical offsets of the background-position
    property within the div, also as the width and height. Unfortunately, this can
    be a fiddly and nonintutive way of animating. It would be much better if we could
    reference the images with a index number. For example, in Figure 2-1, the five
    sprites that make up a cog animation are represented by indices 0, 1, 2, 3, and
    4. The first sprite is represented by index 5, and so on.


    We need to convert the index number into pixel offsets within the container image.
    One option is to manually create a table that references the sprite index numbers
    to the pixel offsets. Although this is a valid solution, it would be very tedious
    to enter the offsets manually and keep the table updated if the sprite images
    changed position. A more elegant solution is to calculate the offsets.


    Converting from an index number to horizontal and vertical pixel offsets involves
    some simple arithmetic. In Figure 2-1, the container image is 256 pixels wide,
    and each image within it (ignoring the small ones at the bottom) is 64 pixels
    square. The pixel offsets can be calculated in JavaScript:'
