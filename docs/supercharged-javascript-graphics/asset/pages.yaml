  md: "This kind of object partitioning within a simple collision test is called broad-phase\
    \ collision detection, and it is still a key element in maintaining speed in modern\
    \ arcade games. You can employ more sophisticated methods, such as data trees\
    \ (for optimized searching and sorting of objects), but the goal of eliminating\
    \ redundant tests remains the same. Typically, a modern 3D game will perform broad-phase\
    \ collision detection before applying more sophisticated geometric tests against\
    \ objects.\n\nOrbit Assault uses a collision manager, which returns collider objects.\
    \ Game objects use these collider objects to give them abilities. We reference\
    \ a game-wide collision manager in SYS_collisionManager as follows:\n\n```\nvar\
    \ collisionManager = function () {\n```\n\nNext, we declare variables, including\
    \ the grid itself and listIndex, which is used as a unique identifier for each\
    \ collider object placed in the grid. checklist maintains a list of collider objects\
    \ that need to check for collisions against others, while we use listIndex as\
    \ an identifier for the collider objects within checkList. gridwidth and gridheight\
    \ define the size of the grid, with each unit representing a 32-pixel-square area:\n\
    \n```\nvar listIndex = 0,\ngrid = [];\nlistIndex = 0,\nchecklist = {\ngridwidth\
    \ = 15,\ngridheight = 12;\n```\n\nThe grid is initialized with empty objects in\
    \ each grid square. These grid objects hold the list of collider objects in each\
    \ grid square, as a property of the grid object. We name the properties via the\
    \ unique listIndex variable. Why not use an array instead of an object? Unlike\
    \ an array, it's easy to remove properties of an object (our collider objects)\
    \ without affecting the indexing of the remaining properties within it. This is\
    \ very handy when collider objects are continually being added or removed as they\
    \ move around the grid:\n\n```\nfor (var i = 0; i < gridwidth * gridheight; i++)\
    \ {\n  grid.push(i);\n}\n```\n\nTheGridList() function accepts x and y coordinates\
    \ and returns the grid that corresponds to those coordinates. It returns undefined\
    \ if the coordinates are outside the bounds of the grid:\n\n```\nvar getGridList\
    \ = function (x, y) {\n  var idx = (Math.floor(y / 32) * gridWidth + Math.floor(x\
    \ / 32);\n  if (grid[idx] === undefined) {\n    return;\n  }\n  return grid[idx];\n\
    }\n```"
