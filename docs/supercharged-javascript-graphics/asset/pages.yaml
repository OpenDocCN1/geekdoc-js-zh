    or in JavaScript:


    ```

    length = Math.sqrt(x*x + y*y);

    ```


    Figure 7-3 shows a vector with components x = -3 and y = 3. Plug those figures
    into the Pythagorean theorem, and the length equals approximately 4.24.


    ```

    length = Math.sqrt(-3*-3 + 3*3); // length = 4.24.

    ```


    ![](img/a94409271b7a0212fea9cd6ea548a191_187_0.png)


    Figure 7-3. The Pythagorean theorem can calculate the length of a vector based
    on the x and y components


    # Operations on Vectors


    We can apply several useful operations to vectors, we and y, some of which are
    listed in the following sections along some potential applications.


    # Addition and Subtraction


    You can add vectors or subtract them from each other by adding or subtracting
    their x and y components. This works just like regular arithmetic, adding a vector
    to itself will double its length, and subtracting a vector from itself will result
    in a zero vector. Some examples include:


    +   - Adding a gravity vector to the vector of a ball in flight it drops

    - Adding the vectors of two colliding bodies together for a realistic collision
    response

    - Adding the thrust vector of a rocket engine to a spacecraft so it moves'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Scaling


    By multiplying the x and y components by a scale value, you can scale the length
    of the\vector up or down as required. Some examples include:


    +   - Repeatedly scaling a movement vector by a value slightly less than 1 so
    the object

    using the vector comes to rest very smoothly

    - Taking the direction vector of a cannon and scaling it up to give the initial
    vector

    of a cannonball fired from it


    # Normalization


    Sometimes it''s useful to make a vector unit length, or in other words, make its
    length

    one unit. This process is called normalization, and vectors of unit length are
    called

    unit vectors. You calculate the unit by dividing the x and y components by the

    length of the vector. Typically, we would do this when we are interested in the
    direction of

    a vector, but not its length. Unit vectors might represent:


    +   - The orientation of a directional jet

    - The incline of a slope

    - The elevation of a cannon


    Once we have the unit vector, we can scale it up to represent the thrust of the
    jet or the

    cannonball''s initial movement.


    # Rotation


    The ability to rotate a vector by an arbitrary angle is extremely useful, as it
    enables you

    to point a vector in any direction you desire. Examples include:


    +   - Making one object always point to another

    - Changing the "thrust" direction of a virtual jet engine

    - Changing the initial "launch" direction of a projectile based on the angle of
    the

    object that launched


    In JavaScript math functions (and more advanced mathematics in general), angles
    are

    sspecified in radians as opposed to the more familiar 360 degrees in a circle.
    A radian is

    an arc with the same length as the circle''s radius (Figure 7-4). A circle''s
    circumference

    can be calculated as 2πr, where r = radius. Hence, there are 2π radians in a circle

    (approximately 6.282).'
