  md: 'In reality, there is no “right” way of performing inheritance with JavaScript.
    Personally, I find functional inheritance a very natural way for JavaScript to
    do things. You and your application may prefer other methods. Look up “JavaScript
    inheritance” in Google for many online resources.


    One benefit of prototypal inheritance is efficient of memory; an object''s prototype
    properties and methods are stored only once, regardless of how many times it is
    inherited.


    Functional inheritance does not have this advantage; each new instance will create
    duplicate properties and methods. This may be an issue if you are creating many
    instances (probably thousands) of large objects and are worried about memory consumption.
    One solution is to store any large properties or methods in one object and pass
    this as an argument to the constructor functions. All instances can utilize the
    one object resource rather than creating their own versions.


    # Keeping It Fast


    The concept of “fast-moving JavaScript graphics” may seem like an oxymoron. Truth
    be, although the combination of JavaScript and a web browser is unlikely to produce
    the most cutting-edge software (at least for the time being), there is plenty
    of space for creating slick, fast-moving, and graphically rich applications, including
    games. The tools available are certainly not the quickest, but they are free,
    flexible, and easy to work with.


    As an interpreted language, JavaScript does not benefit from the many compile-time
    optimizations that apply to languages like C++. While modern browsers have improved
    their JavaScript performance enormously, there is still room to enhance the execution
    speed of applications. It is up to you, the programmer, to decide which algorithms
    to use, which to improve, and how to manipulate the DOM in effect ways. No robot
    optimizer can do that for you.


    A JavaScript application that processes the occasional mouse click or makes the
    odd AJAX call will not need optimization unless the code is horrendously bad.
    The nature of applications covered in this book requires efficient code to give
    the user a satisfactory experience—moving graphics don''t look good if they are
    slow and jerky.


    The rest of this chapter does not examine the improvement of page load times from
    the server; rather, it deals with the optimization of running code that executes
    after the server resources have loaded. More specifically, it covers optimizations
    that will be useful in JavaScript graphics programming.'
