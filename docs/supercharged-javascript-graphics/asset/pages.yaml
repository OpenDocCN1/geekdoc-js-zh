  md: '# Introduction to JavaScript Games


    On May 22, 2010, Google released its own version of the retro-classic, dot-chumping
    Pac-Man. The game, developed to celebrate Pac-Man''s 30th anniversary, appeared
    in place of the usual Google logo on the search engine''s home page (Figure 5-1).
    Many people initially assumed that this fun was created with HTML5, but a closer
    inspection revealed that it used nothing more than regular HTML (excluding the
    story). Continuing with the retro-classic theme, in this chapter we will develop
    our own HTML game: *Orbit Assault*, a variation of the legendary *Space Invaders*
    (Figure 5-2).


    ![](img/a94409271b7a0212fea9cd6ea548a191_108_0.png)


    Figure 5-1. Pac-Man was a surprise addition to Google''s home page


    Actually creating an entire game from scratch might seem like heavy going, but
    it''s the best way to introduce many of the concepts involved in game development.


    But why limit ourselves to HTML? Why not jump straight into something more powerful,
    like HTML5 Canvas? Think of it as high-altitude training; if we can create something
    good with just HTML, we are equipped to create something even better using Canvas.


    *Space Invaders* was released in 1978 by the Japanese Taito Corporation, and was
    developed by Tomohiro Nishikado. He not only designed and programmed the game,'
