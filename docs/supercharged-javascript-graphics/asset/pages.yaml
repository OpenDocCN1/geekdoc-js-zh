    Only one tileset image is used in the examples that follow, although Tiled allows
    you to manage multiple tilesets. Not only does this feature help you organize
    tileset images, but you could also use to group like-colored tiles together and
    save the images as smaller 8-bit (256-color) PNGs (millions of colors). This would
    reduce bandwidth, and you would hardly notice the lower color resolution due to
    the shared colors among the tiles.


