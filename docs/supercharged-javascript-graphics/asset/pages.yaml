  md: '+   Popular websites YouTube, Facebook, and CBS are now supplying their video
    content in HTML5-compatible formats (H.264 video).


    If there is one subject that provokes a lot of hot-headed reactions, it''s the
    HTML5 versus Flash debate. Veteran Flash developers with a vested interest in
    keeping Flash alive will naturally contest HTML5''s ability to supplant Flash.
    Proponents of an open Web will argue that HTML5 renders Flash redundant.


    In reality, it is unlikely that Flash will disappear anytime soon, at all; it
    is too ingrained in the Web to make a fast exit, and various aspects of HTML5
    are slow to be retarded. However, with the benefit of cross-browser support and
    familiar and free development tools, the most optimistic developers would ignore
    HTML5. One thing that is likely to happen sooner rather than the cessation of
    100%-Flash websites. With increased JavaScript performance and libraries like
    jQuery, along with facilities like Canvas, there are a few places to develop in
    this time.


    # Canvas Exporters


    Understanding JavaScript is a prerequisite for fully utilizing Canvas, as it is
    wholly controlled by the language. There is no markup-based way to access its
    capabilities. However, Canvas exporters and converters are emerging that can create
    the JavaScript required to render Canvas graphics created in applications. This
    is great news for designers with limited JavaScript abilities, and great news
    for programmers too, as creating vector art with manually entered Canvas commands
    is tedious and error-prone.


    Adobe Flash CS5+ (http://www.adobe.com/products/flash.html) Adobe Flash CS5+ has
    a Canvas exporter that allows a subset of Flash to be exported as JavaScript source
    code. This will benefit developers who want to cover both the Flash and Canvas
    bases. However, because this solution requires the purchase of the Flash tooling,
    it may not cost effective for those who want to develop solely using Canvas.


    Canvg (http://code.google.com/canvg/) Canvg (Figure 6-1) is a JavaScript library
    that translates SVG data and draws it using Canvas. Unfortunately, the JavaScript
    statements are not saved in any way, and hence you must include the Canvas library
    to draw the SVGs.


    SVG-to-Canvas (http://www.proforsource.com/svg-to-canvas/) This online utility
    statics SVG into a JavaScript Canvas function. It uses a modified version of the
    Canvas library.


    AI-Canvas (http://visitmix.com/labs/ai2canvas/) This sophisticated Adobe Illustrator
    plug-in (Figure 6-2) converts both static drawings and animations elements of
    the imagery that cannot be converted, rather the plug-in encounters elements it
    converts those elements into simple bitmaps.'
