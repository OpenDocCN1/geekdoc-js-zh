  md: 'Why would we want to do this?


    +   * It looks nice and adds visual interest.

    * Groups of images can take up less space.

    * It allows a varying number of images to occupy the same space.


    # Carousel specifications


    When developing a user interface element like this, we need to take into account
    the diversity of target browsers and circumstances under which the page may be
    viewed. For example:


    +   * What happens if JavaScript is turned off?

    * What happens if a text-only screen reader is used?

    * What happens on older browsers like IE6?


    The user should be presented with the regular images (or text equivalents for
    alt tags) if the carousel cannot be initialized. It is up to the carousel plug-in
    to take these normal images and turn them into something interesting if the browser
    environment facilitates this. It is unacceptable for them simply disappear in
    their entirety if the carousel cannot be initialized. Also, the semantics of HTML
    should not have to be compromised in terms of WC3 validation or semantics in order
    to use the carousel.


    It''s not one of our deliberate goals, the carousel should work with older browsers
    such as IE6/7. Although the popularity of these browsers is (thankfully declining),
    there is still a substantial minority of people still using them. According to
    Microsoft''s IE6 Countdown website (http://www.theie6countdown.com), a site designed
    to discourage usage of IE6, 11.4% of Internet users were using IE6 as of April
    2011.


    ![](img/a94409271b7a0212fea9cd6ea548a191_98_0.png)


    Although the carousel works with IE6, the PNG images used in the following example
    do not render correctly. If this is an issue, the fix is to use JPEG images, which
    render correctly on all browsers.


    There should be no limit to the number of carousels that can be seen on the page.
    This means we''ll need to develop the widget with nice encapsulated code that
    can be instantiated unlimited number of times. Implementing the carousel as a
    jQuery plug-in makes it easy to initialize multiple carousels. We just need to
    wrap the carousel images in elements that jQuery can identify, and apply the plug-in
    to them. For example, the following code initializes a carousel on all wrapping
    elements with a CSS class of .carousel3d:


    ```

    $(''.carousel3d'').Carousel();

    ```


    Creating UI Elements from Scratch | 81'
