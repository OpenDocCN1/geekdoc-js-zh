  md: "Add the following code into the file:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    \  <title>TilePic Test</title>\n  <script type=\"text/javascript\" charset=\"\
    utf-8\" src=\"phonegap.js\"></script>\n</head>\n<body>\n  <h1>TilePic Test</h1>\n\
    </body>\n</html>\n```\n\nClick the top-level TilePic folder in the Package Explorer,\
    \ and then right-click and select Run As→Android Application. Eclipse will now\
    \ run the application on either the emulator or, if connected, an actual Android\
    \ device. The application will display the text “TilePic Test.” Well done—you\
    \ have created your first PhoneGap Android application!\n\n# Testing the TilePic\
    \ Application\n\nTo run the full TilePic puzzle game as a native application,\
    \ copy all the TilePic web files to the assets/www folder. The index.html test\
    \ file created earlier will be overwritten with the TilePic index.html file. The\
    \ assets/www should contain the files and folders as shown in Figure 10-7.\n\n\
    Run and test TilePic by clicking the top-level TilePic folder in the Package Explorer,\
    \ then right-cliking and selecting Run As→Android Application."
