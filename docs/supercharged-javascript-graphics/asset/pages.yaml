    \ and tests take place along the vertical axis instead.\n\n```\n// When a tile\
    \ is clicked, the moveTiles() function will\n// move one or more tiles into the\
    \ empty space. This can be done\n// with without animation.\nvar moveTiles = function\
    \ (tile, animate) {\n    var clickPos, x, y, dir;\n    // If empty space is on\
    \ same vertical level as clicked tile,\n    // move(s) horizontally.\n    if (tile.gy\
    \ === empty()) {\n        clickPos = tile;\n        dir = tile.x < emptyX ? 1\
    \ : -1;\n        for (x = emptyX - dir; x != clickPos - dir; x -= dir) {\n   \
    \         t = tilesArray[tile.gy][x];\n            t.move(x + dir, tile.y, animate);\n\
    \        }\n        // Update position of empty tile.\n        emptyX = clickPos;\n\
    \    }\n    // move(s) vertically.\n    if (tile.gx === empty()) {\n        clickPos\
    \ = tile;\n        dir = tile.y < emptyY ? 1 : -1;\n        for (y = emptyY -\
    \ dir; y != clickPos - dir; y -= dir) {\n            t = tilesArray[y][tile.gx];\n\
    \            t.move(tile.x, y + dir, animate);\n        }\n        // Update position\
    \ of empty tile.\n        emptyY = clickPos;\n    }\n};\n```\n\n# Shuffling the\
    \ tiles\n\nThe shuffle() function chooses a random tile in either the same column\
    \ or row as the empty space, and then calls the moveTiles() function on it. Using\
    \ the modulo operator (%) ensures that the tile chosen is not the empty space\
    \ (a wasted shuffle), and is always a valid tile within the confines of the grid.\n\
    \n```\n// Randomly shuffle the tiles, ensuring that the puzzle\n// is solvable.\
    \ moveTiles() is called with no animation.\nvar shuffle = function () {\n    var\
    \ randIndex = Math.floor(Math.random() * (numTiles - 1));\n    if (Math.floor(Math.random()\
    \ * 2)) {\n        moveTiles(tilesArray[emptyY][(emptyY + 1 + randIndex) % numTiles],\
    \ false);\n    } else {\n        moveTiles(tilesArray[(emptyX + 1 + randIndex)\
    \ % numTiles][emptyY], false);\n    }\n};\n```"
