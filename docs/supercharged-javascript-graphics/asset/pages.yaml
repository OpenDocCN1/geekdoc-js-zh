  md: '![](img/a94409271b7a0212fea9cd6ea548a191_149_0.png)


    Figure 6-3. Filled and stroked triangles


    You can use the arc() command to draw circles, or portions of circles:

    arc(x, y, startAngle, endAngle, anticlockwise);


    The parameters are as follows:


    x,y

    The position of the center of the circle.


    radius

    The radius in pixels.


    startAngle, endAngle

    The drawing will "sweep" between these two angles. The angles are defined in radians,
    with 2π (approximately 6.282 radians equivalent to 360 degrees).


    anticlockwise

    The direction in which to draw the arc.


    Here are the calculations required to convert to and from radians:

    var radians = degrees * Math.PI / 180;


    And from radians to degrees:'
