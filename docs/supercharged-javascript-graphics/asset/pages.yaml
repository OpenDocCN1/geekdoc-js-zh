    # Creating UI Elements from Scratch


    Using UI libraries makes perfect sense in many applications, but there are times
    when only a completely custom-coded widget will do. Frameworks like jQuery make
    this sort of thing lot easier to develop, and you can tweak the element’s appearance
    and behavior in a completely free manner without having to worry about it “fitting
    in” with a UI framework.'
