  md: "# The New CanvasSprite Object\n\nCanvasSprite is a direct replacement for the\
    \ HTMLSprite object. All parameters the params object passed to it are the same\
    \ as before, apart from the inclusion of a Canvas context parameter (ctx):\n\n\
    ```\nvar CanvasSprite = function (params) {\n  // The drawing context is passed\
    \ in the params object.\n  var ctx = params.ctx,\n      width = params.width,\n\
    \      height = params.height,\n      imagesWidth = params.imagesWidth,\n    \
    \  vOffset = 0,\n      hOffset = 0,\n      hide = false,\n  // An Image is created,\
    \ and this will be used as the source\n  img = new Image();\n  img.src = params.images;\n\
    \n  return {\n    draw: function (x, y) {\n      if (hide) {\n        return;\n\
    \      }\n      // The canvasdrawImage function allows us to extract individual\n\
    \      // sprite images from a larger composite image.\n      ctx.drawImage(img,\
    \ hOffset, vOffset, width, height,\n        x >> 0, y >> 0, width, height);\n\
