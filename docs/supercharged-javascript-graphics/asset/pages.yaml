  md: '# About the Author


    Raffaele Cecco is a veteran software developer from the European video games industry.
    He served as Technical Director at London-based software studio, King of the Jungle
    Ltd., where he created software for clients such as Hasbro and Virgin. He has
    also worked with web technologies and retail e-commerce systems.


    # Colophon


    The animal on the cover of Supercharged JavaScript Graphics is a maned sheep,
    or Barbary sheep.


    The Barbary sheep (Ammotagus lervia) is a relatively large species of caprid,
    or goatelope. It is native to Northern Africa and can now be found in southeastern
    Spain, the southwestern US, and parts of Mexico. These desert-dwelling grazers
    are also known as aoudad or ouddan.


    The Barbary sheep is adapted to hot, dry, and barren areas. It takes in most of
    its water through the plants, but will drink and bathe in water if it is available
    in the hot, dry desert. Its large, curved horns in addition to its horns, the
    Barbary sheep is characterized by a sandy-brown, bristly coat and long hair on
    the chest, front legs and throat.


    Barbary sheep, like most desert-dwelling animals, seek shade during the day and
    are most active at dawn and dusk, when it''s cooler. They are expert climbers
    and jumpers and can ascend and descend extremely steep slopes; this ability to
    out-climb humans makes them difficult to hunt. Because they dwell in areas with
    little to cover, their coloring helps them evade predators. In North Africa, they
    were preyed upon by the caracal, Barbary lion, and Barbary leopard, but today,
    their main threat comes from humans.


    Despite their agility, hunting has depleted the Barbary sheep population in Africa;
    however, their introduction into the wild of the southwestern US in the 1950s
    led to a slight increase in population. The Barbary sheep is currently on the
    International Union for Conservation of Nature''s Red List of vulnerable species
    due to its population between 5,000 and 10,000 animals and due to a predicted
    10 percent population decline over the next 15 years (as a result of hunting and
    loss of habitat).


    The cover image is from Riverside Natural History. The cover font is Adobe ITC
    Garamond. The text font is Linotype Birka; the heading font is Adobe Myriad Condensed;
    and the code font is LucasFont''s TheSansMonoCondensed.'
