- img_proc: true
  md: 'difference between the two will be that the 30 FPS sprite does not move quite
    as smoothly as the 60 FPS sprite. However, they will still appear to traverse
    the screen at the same rate.


    A time coefficient must be calculated and used in the movement and animation code.


    Table 2-4. Example time coefficients


    | Goal FPS | Actual FPS | Time coefficient |

    | --- | --- | --- |

    | 60 | 30 | 2 |

    | 60 | 15 | 4 |

    | 30 | 40 | 0.75 |

    | 50 | 50 | 1 |


    It''s fairly obvious that you calculate the time coefficient by dividing the goal
    FPS by the actual FPS achieved.


    You calculate the FPS by making notice of the current time in milliseconds, using
    the JavaScript Date object (the start time). You then execute all application
    logic and take the again (the end time). Here is code:


    ```

    actualFPS = 1000 / (endTime - startTime);

    ```


    If the demands on the CPU are too much, the frame rate may become unacceptable.
    A slow moving across the screen in 10-pixel steps at 6 FPS will look very jerky,
    which is certainly not suitable for arcade games. As a useful of thumb, Table
    2-5 gives an idea of frame rates and perceived movement smoothness.


    Table 2-5. FPS and perceived movement smoothness


    | Frames per second | Perceived smoothness |

    | --- | --- |

    | Less than 15 | Rather jerky |

    | 15–20 | Just acceptable |

    | 20–30 | Reasonably smooth |

    | 30–40 | Smooth |

    | 40+ | Very smooth |


    This is not to say that a low frame rate of 10 FPS is useless. For animated puzzle-style
    games like Tetris, this might be quite acceptable.


