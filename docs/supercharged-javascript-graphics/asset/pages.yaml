  md: "# Canvas Drawing Basics\n\nThe basic Canvas drawing commands are straightforward\
    \ to implement and are discussed in the following sections.\n\n# The Canvas Element\n\
    \nInserting a Canvas element into a web page is no different than inserting any\
    \ other HTML element:\n\n```\n<canvas id='mycanvas' width = 512 height = 384>\n\
    \  Fallback content\n</canvas>\n```\n\nIf you don't specify any width or height\
    \ attributes, the default size will be 300 × 150 pixels. It is possible to change\
    \ the canvas size via CSS (e.g., `width:50%`), but it's not recommended; depending\
    \ on the browser implementation, the output may become distorted or scaled. However,\
    \ you can style the element with the usual borders, margins, and background colors,\
    \ although in this way without affecting the drawing of the canvas itself. The\
    \ coordinate system has its origin in the top left—coordinate (0,0)—so, for example,\
    \ something drawn at coordinate (10, 15) would be positioned 10 pixels from the\
    \ left and 15 pixels from the top.\n\nIf Canvas is not available to the browser,\
    \ the fallback content between the start and end tags is displayed. Ideally, this\
    \ should be the regular text or HTML representation of the data that was to be\
    \ displayed by Canvas. For example, where Canvas might have displayed a pie chart,\
    \ the fallback content would display a regular table. There are situations where\
    \ fallback content simply cannot replace Canvas; games and drawing applications\
    \ don't have non-Canvas equivalents. In these cases, the fallback content should\
    \ display a useful message explaining to the user that Canvas is not available\
    \ and the browser should be upgraded.\n\nSolely placing Canvas into a page gives\
    \ us no functionality; it must be controlled by JavaScript to do anything. You\
    \ will rarely see Canvas being used without an id attribute, as this identifies\
    \ it. Typically, JavaScript will get a \"handle\" variable to control Canvas like\
    \ this:\n\n```\nvar canvas = document.getElementById('mycanvas');\n// Or, using\
    \ jQuery;\nvar canvas = $('#mycanvas')[0];\n```\n\n# The Drawing Context\n\nWe\
    \ must obtain a \"drawing context\" from Canvas before we can use drawing commands:\n\
    \n```\nvar canvas = document.getElementById('mycanvas');\nvar ctx = canvas.getContext('2d');\n\
    ```"
  merge: -1
