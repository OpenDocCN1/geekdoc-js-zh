    # Creating and Testing a Simple Application


    We can create a simple web application to test on the emulator or an Actual Android
    device.


    Right-click the assets/www folder in the Package Explorer, select New→File, and
    create a file named index.html. Right-click index.html in the Package Explorer,
    and select Open With→Text Editor.'
