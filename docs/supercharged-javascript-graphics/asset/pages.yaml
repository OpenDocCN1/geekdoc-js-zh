  md: '![](img/a94409271b7a0212fea9cd6ea548a191_156_0.png)


    The three-parameter version of drawimage() is the easiest to use, and simply copies
    the image source to the point (x, y) on the canvas. The width and height of the
    bitmap are determined by the source bitmap:


    ```

    drawimage(source, x, y);

    ```


    The five-parameter version allows you to specify the destination width and height,
    enabling you to scale an image to the desired size:


    ```

    drawimage(source, x, y, width, height);

    ```


    The nine-parameter version allows you to copy a portion of the image source, where
    parameters 2–5 specify a rectangle within the source image, and parameters 6–9
    specify the destination rectangle within the canvas being drawn on:'
