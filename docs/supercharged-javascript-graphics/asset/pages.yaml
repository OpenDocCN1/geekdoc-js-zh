  md: '# Turning on WebSockets in Firefox 4 and Opera 11


    Luckily, Firefox and Opera users can turn on WebSockets functionality for development-purposes.


    For Firefox 4:


    +   1. Enter about:config in the browser''s address bar.

    2. Find and toggle the network.websocket.override-security-block flag.


    For Opera:


    +   1. Enter opera:config in the browser''s address bar.

    2. In the Preferences Editor, open the User Prefs section and turn on Enable Web-Sockets.


    # ## The Chat Application


    Our chat application is broadly composed of four main elements:


    +   * The socket server runs on the web server

    * Client avatars that move around and “chat"

    * The chat text itself

    * The text input area


    When a user connects to the chat page, an avatar is automatically created for
    him in a random color. The user can move the avatar around by clicking on the
    page and also enter text in the chat box. The avatar''s movement and chat text
    will be mirrored to all other connected users. Effectively everyone sees the same
    page, but each user can control only his own avatar.


    # The socket server


    The socket server is required to handle multiple connections and transmit information
    between the connected clients. It must run on a server that all clients can connect
    to.


    The choice of programming language for the socket server could be any one of the
    popular server-side languages such as PHP, Java, or Python. As a JavaScript program,
    you will be pleased by the existence of node.js, a server-based implementation
    of JavaScript and associated libraries that make it suitable for efficient network
    socket programming.


    For the chat application, I have chosen PHP for the socket server, as it enjoys
    near-ubiquitous preinstallation on Linux-based web hosting services.'
