    jQuery facilitates easy searching and manipulation of page elements to help you
    achieve the desired functionality of your web applications. You must create additional
    user interfaces from scratch, or by third-party plug-ins or extension libraries
    like jQuery UI Mobile has a higher-level approach: it takes clean, semantic HTML
    and turns it into a rich, mobile-optimized browsing experience with very little
    additional work on your part. In reality, it is a mobile user interface built
    on top of jQuery. Its extensive use of the HTML5 data- attribute to change the
    behavior and appearance of page elements. For example, the following simple code
    creates the button in Figure 9-1:


    ```

    <a href="#" data-role="button" data-icon="delete">Delete</</a>

    ```


    ![](img/a94409271b7a0212fea9cd6ea548a191_234_0.png)


    The HTML5 data-attribute allows you to attach arbitrary data to DOM elements,
    which is typically accessed in jQuery like this:


    ```

    value = $(''#myelement'').attr(''data-mydata''); // value = contents of data-myData.

    ```


    In the DOM, you specify an element using a data- attribute like this:


    ```

    <div id=''myelement'' data-myData=''99''></div>

    ```


    The data- attribute is becoming more popular, and this increases the possibility
    of namespace collisions, in which the same data attribute is used for different
    purposes (for example, in your own code and in an external library). A simple
    solution is to always use a unique identifier when using the data- attribute.
    For example, data-myunique-id will not clash with jQuery Mobile''s use of data-icon.


    The HTML5 data- attribute will validate with the WC3 validator only if you correctly
