  md: 'POST and GET are methods for sending data to the web server. What''s the difference
    between them? GET data is usually used for simple requests to the server, such
    as the URL in the browser address bar or the <img> tags (or an image chart URL).
    It is typically visible, either in the browser address bar or in a web page''s
    source code. POST is often used when more data is being sent to the server to
    be processed and saved. Examples of typical POST data include the contents of
    a form, such as credit card details or an email. The contents of POST data are
    not visible under normal circumstances.


    # Chart Glossary


    Regardless of the type of chart (meaning any image chart or visualization) you
    use, you should understand some common elements beforehand:


    Data table


    The data for a chart is stored internally as a table, and the goal of any chart
    is to make this table visually more meaningful than a basic grid of numbers and
    strings. A table has rows, columns, and cells. Each cell contains a single value
    in the table (a value may be a number, string, date, etc.). Rows and columns are
    numbered from 0, and a cell can be referenced by its row and column location.
    In Table 8-1, the cell at (0,2) has a value of 75, the cell at (0,0) has a value
    of Monday, and the cell at (2,2) has a value of 35. Figure 8-4 shows the same
    table represented as a column chart. I have deliberately used unique values so
    they are easier to pick out in code examples.


    ![](img/a94409271b7a0212fea9cd6ea548a191_213_0.png)


    Figure 8-4. Two data series represented as a bar chart'
