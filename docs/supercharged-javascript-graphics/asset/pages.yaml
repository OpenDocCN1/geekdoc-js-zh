  md: 'globalAlpha property to set an alpha value for all strokes and fills; the local
    alpha value will be multiplied by the globalAlpha property.


    In addition, you can draw bitmaps with varying levels of transparency via the
    globalAlpha property. The pixel alphas in the bitmap will be multiplied by the
    globalAlpha property. PNG images contain an alpha channel for transparency effects,
    so pixels in the image specified with an alpha of 0.5 and with a globalAlpha of
    0.5 will actually be drawn with an alpha of 0.25.


    ![](img/a94409271b7a0212fea9cd6ea548a191_158_0.png)


    Drawing items with an alpha value of less than 1 involves extra work for the browser,
    as it must perform additional calculations to display the final color for each
    pixel. This is regardless of whether or not the Canvas uses hardware acceleration.
    When designing your application, consider using alpha values is absolutely necessary,
    especially when drawing speed is important.


    If you specify via globalAlpha an alpha value of 0 (fully transparent), the browser
    may try to draw the item. This involves unnecessary work and can be a hidden source
    of performance issues. Avoid drawing items with 0 alpha if possible.


    We define colors in Canvas using CSS3 color identifiers. As of the following statements
    is valid for specifying a full of bright red:


    ```

    ctx.fillStyle = ''red''; // HTML4 color name.

    ctx.fillStyle = ''#f00''; // Hexadecimal RGB.

    ctx.fillStyle = ''#ff0000''; // Hexadecimal RGB.

    ctx.fillStyle = ''rgb(255, 0, 0)''; // Decimal integers (0-255)

    ctx.fillStyle = ''rgba(255, 0, 0, 0.5)''; // Decimal integers with 0.5 alpha.

    ctx.fillStyle = ''rgb(100%, 0%, 0%)''; // Percentages.

    ctx.fillStyle = ''rgba(100%, 0%, 0%, 0.5%)''; // Percentages with alpha.

    ctx.fillStyle = ''hsl(0, 100%, 100%)''; // Hue, saturation, luminance (HSL).

    ctx.fillStyle = ''hsl(0, 100%, 100%, 0.5)''; // HSL with alpha.

    ```


    As well as flat-flat colors and strokes, you can specify color gradients using
    the LinearGradient() or createRadialGradient() commands.


    Creating a createRadialGradient() requires some setup:


    +   1. Create a CanvasGradient object using createLinearGradient(). The four parameters
    define a line along which the gradient will be drawn.

    2. Add color stops along this line, where 0 specifies the beginning of the line
    and 1 specifies the end. You must have at least two color stops to define a gradient.

    3. Use the CanvasGradient object as fill or stroke style.'
