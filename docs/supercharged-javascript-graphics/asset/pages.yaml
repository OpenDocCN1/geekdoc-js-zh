  md: '![](img/a94409271b7a0212fea9cd6ea548a191_65_0.png)


    Figure 3-1. This simple but effective use of CSS in Retro Theater by Eric Rog
    creates a convincing scrolling cinema screen effect (http://www.csszengarden.com/?cssfile=202/202.css)


    ```

    min-height: 110px;

    max-height: 318px;

    background:url(''bas.png'') no-repeat 50% 0%;

    }

    ```


    The key to the effect lies in the **position:fixed** CSS rule, which ensures the
    div element stays at the same place relative to the window. In this case, the
    *div* is positioned to remain at the bottom of the window. There are a few additional
    rules to ensure that the element stays within a height range.


    Figure 3-2 shows a more elaborate example of CSS-only scrolling. In the Silverback
    website, you will notice three layers of leaves that hang from the top of the
    page. When the user resizes the browser window, the leaves move at different speeds
    to create a three-dimensional effect, with the layer in the foreground moving
    quickest and the farthest layer moving slower. This kind of effect is called *parallax
    scrolling* and is often used in two-dimensional video games and cartoon animation.
    In this instance, the entire width of the browser window is the viewport.


    The code in Example 3-1 uses a similar technique, creating the parallax effect
    shown in Example 3-3. The effect uses three images in 256-color PNG format (Figure
    3-4). Notice how a blurred effect has been used on the foremost grass image to
    further enhance the illusion of depth.'
