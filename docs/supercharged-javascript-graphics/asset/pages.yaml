    # Creating tile maps with Tiled


    Manually entering all the tile indexes for a map would be laborious and prone
    to error for anything but the most trivial case. Luckily, there are various tile
    map editors available that can make the process of designing tile maps significantly
    quicker. Arguably, the best of the bunch is Tiled (http://www.mapeditor.org/;
    shown in Figure 3-7), an excellent open source editor by Thorbjorn Lindeijer and
    other contributors. It is available for various operating systems, including Windows,
    Mac, and Linux.


    ![](img/a94409271b7a0212fea9cd6ea548a191_78_1.png)


    Figure 3-7. The Tiled tile map editor


