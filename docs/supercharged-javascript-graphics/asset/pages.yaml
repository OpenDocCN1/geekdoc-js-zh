  md: '# # Supercharged JavaScript Graphics


    With HTML5 and improved web browser support, JavaScript has become the tool of
    choice for creating high-performance web graphics. This fast-paced book shows
    you how to use JavaScript, jQuery, HTML, and HTML5''s Canvas element to create
    rich applications for desktop and mobile devices.


    By following real-world examples, experienced web developers learn and use useful
    approaches to arcade games, HTML effects, business dashboards, and other applications.
    This book serves complex subjects in easily digestible pieces, and covers each
    topic as a foundation for the next.


    +   - Tackle JavaScript optimization and understand how it impacts performance

    - Create fast-moving graphics by combining old-school HTML with jQuery

    - Learn advanced techniques using the jQuery UI and Ext JS libraries

    - Build games with collision detection, handling, and JavaScript scrolling techniques

    - Master HTML5 Canvas basics for drawings, fills, bitmaps, animation, and more

    - Create applications for the small screen with jQuery Mobile and PhoneGap

    - Google''s data visualization tools to create interactive dashboards


    > “Raffele Cecco definitely knows his craft. I came away from the book with a
    better understanding of how today''s popular web-based games and UI-intensive
    applications are crafted.” —Shelley Powers, JavaScript Cookbook and Painting the
    Web


    Raffele Cecco is a veteran software developer from the European video games industry.
    He served as Technical Director at London-based software studio, King of the Jungle
    Ltd., where he created software for clients like Hasbro and Virgin. Today, Raffaele
    is a web developer and likes to experiment on his website, www.professorcloud.com.


