    # Optimizing JavaScript\n\nStrictly speaking, any optimizations that can be applied\
    \ to JavaScript can be applied to any language. Going down to the CPU level, the\
    \ rule is to minimize work. In JavaScript, the CPU-level work is so abstracted\
    \ from the programmer that it can be difficult to ascertain how much work is actually\
    \ going on. If you use a few tried-and-tested methods, it is a safe bet that your\
    \ code will benefit, although only performing empirical tests will prove this\
    \ conclusively.\n\n# Lookup Tables\n\nComputationally expensive calculations can\
    \ have their values precalculated and stored in a lookup table. You can then quickly\
    \ pull the values out of the lookup table using a simple integer index. As long\
    \ as accessing a value from the lookup table is a cheaper operation than calculating\
    \ the value from scratch, an application will benefit from better performance.\
    \ JavaScript's trigonometry functions are a good example of how you can use lookup\
    \ tables to speed things up. In this section, the Math.sin() function will be\
    \ superseded by a lookup table, and we will build an animated graphical application\
    \ to utilize it.\n\nThe Math.sin function accepts a single argument: angle, measured\
    \ in radians. It returns a value of -1 and 1. The angle has an effective range\
    \ of 0 to 2π, or around 6.28318. This is not very useful for indexing into a lookup\
    \ table, as the range of six possible integer values is too small. The solution\
    \ is to dispense with radians completely and allow the lookup table to accept\
    \ integer indexes between 0 and 4,095. This granularity should be enough for most\
    \ applications, but you can make it finer by specifying a larger steps argument:\n\
    \n```\nvar fastSin = function (steps) {\n  var table = [];\n  ang = 0;\n  angStep\
    \ = (Math.PI * 2) / steps;\n  do {\n    table.push(Math.sin(ang));\n    ang +=\
    \ angStep;\n  } while (ang < Math.PI * 2);\n```"
