  md: '# Encapsulation and Drawing Abstraction (aka Hiding Stuff)


    Hiding all the DOM manipulation shenanigans within HTMLSprite away from the application
    using it allows for cleaner and more maintainable code; the application can focus
    on logic rather than the mechanics of drawing. Converting to another sprite drawing
    method such as the HTML5 Canvas class or SVG becomes simpler. Alternatively, the
    application could choose an appropriate drawing method based on the browser''s
    capabilities.


    # Minimizing DOM Insertion and Deletion


    Repeatedly adding, removing, and destroying DOM elements can have detrimental
    effects on performance, as well as forcing JavaScript''s garbage collector to
    work overtime. To mitigate these undesirable effects, maintain a list of initialized
    but hidden sprites. When a sprite is required, you can take it from the list and
    make it visible without actually inserting anything into the DOM. When the sprite
    is no longer needed, you can hide it and place it on the list. Providing a show
    and hide method within HTMLSprite will allow an application to implement this
    technique if needed.


    If a HTMLSprite to be permanently removed, it should remove its own DOM element
    and perform any other associated cleanup.


    # The Sprite Code


    Rather than passing several arguments to the sprite, we pass all setup parameters
    into a single object called params. As well as making the order of parameters
    noncritical, this also allows other objects inheriting from HTMLSprite to simply
    add their setup parameters inside params. Any object using params can ignore parameters
    not relevant to it. Table 2-1 shows the parameters passed within the params object.


    ```

    var HTMLSprite = function (params) {

    ```


    Table 2-1. HTMLSprite object parameters


    | Parameter | Description |

    |---|---|

    | images | Path to the images file |

    | imagesWidth | Pixel width of the images file |

    | width | Pixel width of sprite |

    | height | Pixel height of sprite |

    | $drawTarget | The element which the sprite will append its own div element |


    Here make local variable copies of the params properties. Accessing the parameters
    via local variables is quicker than accessing them as properties of the params
    object. Local variables like this are private and can be accessed only from methods
    within HTMLSprite.'
