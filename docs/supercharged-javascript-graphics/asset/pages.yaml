- img_proc: true
  md: 'Opera’s obviously the best attempt at a date input (although the presentation
    is less inspiring), while Chrome’s looks like an afterthought. This kind of inconsistency
    is frustrating, and until these new HTML5 inputs produce reasonably consistent
    results on a cross-browser basis, we have to rely on JavaScript to create the
    results we want. In reality, this is not a bad thing, as JavaScript offers more
    exciting possibilities than the standard browser offerings.


    The next section investigates popular JavaScript user interfaces, which you can
    use to create highly functional web applications that look just like (or even
    better!) traditional native desktop applications. Even if it is not possible to
    store a user’s data on a remote server, some modern browsers such as Google Chrome
    offer local database storage facilities as a viable alternative. You will need
    to keep an eye on the latest developments in this area, as support for local storage
    is not standardized and will be patchy.


    # Using JavaScript UI Libraries


    While HTML5 rich input might currently be a little too to use reliably, we can
    use JavaScript to provide attractive and consistent results across browsers. There
    are two approaches to doing this: use an existing JavaScript user interface library,
    or create user interface widgets from scratch


    In this section, I will give a brief overview of two of the most popular JavaScript
    user interface libraries, jQuery UI and Ext JS. Some people may see these two
    libraries as competing products (and there is invariably some overlap), but take
    a closer look and you’ll see they are (arguably) quite different in their intended
    uses. For example, if you are developing a web application, you might find the
    jQuery UI suitable for the frontend, customer-facing side, and Ext JS suitable
    for the complex backend, administration side. One big difference between the two,
    and an indicator of where these projects are going, is the size of the zipped
    downloads (including samples and documentation): jQuery UI weighs in at a lightweight
    1 MB, whereas Ext JS is nearly 13 MB.


    # Using jQuery UI for Enhanced Web Interfaces


    The jQuery UI library is built on top of jQuery to provide additional user interface
    elements. Certainly, anyone using jQuery is well advised to investigate jQuery
    UI, as a large chunk of the code itself—will already be loaded on the page. You
    can find jQuery UI at http://www.jqueryui.com.


    Figure 4-2 shows various jQuery UI elements styled with one of the attractive
    24 themes available. In this example, we use the Start theme. With a few minor
    variations, all of these elements will display correctly and consistently on virtually
    all browsers.'
