  md: 'A more effective solution is to use tile-based image scrolling. A set of image
    tiles of uniform size (say, 64 pixels square) is reused many times over the content
    area. The content area effectively becomes a uniform grid of tiles, or a “map”.
    The tiles are drawn and arranged within the map in such a way that they give the
    illusion of a massive, single bitmap used. Each tile is simply referenced by an
    index number, and the definition of the map is an array of these index numbers.
    So, a 2,048-pixel-square map using 64-pixel-square tiles would require 32 × 32,
    or 1,024, tiles to be stored. In many ways, the concept of using small repeating
    elements to create a much larger window is analogous to how a simple text file
    works: the text is stored as character indices (ASCII code), not as a huge map.


    One brute-force approach to getting this working working to create a div element
    as a “handle” and attach image elements to it, with each image element representing
    a tile in the map. By moving the handle element within a smaller viewport div,
    you achieve the scrolling effect. This actually works, but there are a couple
    of issues that could spoil this technique:


    +   - You have to insert lost tiles (image elements) into the DOM. A poor map
    might need thousands of tiles. Big DOMs can mean poor performance and increased
    memory consumption as the browser handles all of the image elements, even they
    might not be visible at all.

    - Each image element requires tiles to be loaded over the network. For a handful
    of unique tiles, this isn’t a problem; for hundreds of tiles, it can cause the
    page to load slowly.


    The second issue is easily solved. With the HTML sprites covered in Chapter 2,
    we can use div elements instead of image elements. divs can reference smaller
    portions of a single bitmap (or tileset) as their background image. This means
    fewer tiles to load over the network, and the ability to easily change the image
    within a tile just by changing its CSS background position.


    We significantly reduce the number of tiles required in the DOM by using the snapping
    technique described in the following section.


    # Snapping...


    We can solve the problem of having a large number of tiles in the DOM by ensuring
    that only the minimum number of tiles required to fill the viewport is used. Figure
    3-5 illustrates a viewport window that is 640 × 384 pixels in. The grid represents
    the visible area of the map, composed of 64-pixel-square tiles. There is a maximum
    of 11 horizontal tiles and 7 vertical tiles that can be displayed within a viewport
    of this size—77 tiles in total. This is irrespective of the size of the map, which
    can be huge. The calculation for determining the maximum number of tiles that
    can be displayed along a viewport is as follows (axisSize and tileWidth are measured
    in pixels):


    ```

    numTilesAxis = Math.ceil((axisSize + tileWidth) / tileWidth);

    ```'
