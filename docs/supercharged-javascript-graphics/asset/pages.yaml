  md: '# Drawing Bitmap Images


    We draw bitmap images via the drawImage() command. It comes in three-, five-,
    and nine-parameter flavors. In all cases, the first parameter specifies an image
    source that provides the pixel data for drawing. The image source can be an image
    loaded with Image(), a regular <img> tag, or even another Canvas or <video> tag.
    This flexibility in specifying an image source gives you great creative freedom:
    for example, Figure 6-7 shows a <video> tag used as the image source for "explode"
    effect on a video stream, whereas Figure 6-8 shows a random portion of a large
    source bitmap used to create natural-looking animated nebula clouds.


    If performance becomes an issue when you''re using drawImage(), it may be beneficial
    to ensure that the image source is another Canvas tag. This prevents any image
    conversion overhead on certain browsers. For example, the video "explode" effect
    shown in Figure 6-7 copies the video to a Canvas element splitting into small
    tiles with drawImage().


    ![](img/a94409271b7a0212fea9cd6ea548a191_155_0.png)


    Figure 6-7. Using a <video> tag as a bitmap image source for drawImage(); each
    small "exploded" tile has a portion of video playing inside it'
