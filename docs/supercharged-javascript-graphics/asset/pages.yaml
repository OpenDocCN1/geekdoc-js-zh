  md: 'There are other ways to add data to the data table, including an efficient
    object literal method, which can be faster for very large tables.


    The visualizations API can also use of visualizations data source to obtain data.
    A data source provides a URL to which the visualization can use GET requests to
    obtain data in the correct format. Typically, this comes from a database or file.
    You obtain the data source with the Google Visualization wire protocol, and the
    server software needs to use this protocol as well. Google provides libraries
    in server languages to facilitate use of the protocol, including parsers for the
    Google Visualization API Query Language.


    Consult the online documentation for information about adding data and using data
    sources.


    Creating a var chart = new google.visualization.ColumnChart(chartElement) This
    creates a chart object of the desired type (in this case, a column chart), ready
    to be drawn. chartElement specifies the page element (usually a <div>) into which
    the chart will be drawn.


    Drawing a chart (chart.draw(data, options)) This actually draws the chart into
    the chart element specified when the chart object was created. The options parameter
    is an object literal that contains both common (e.g., width and height) and visualization-specific
    options. Study the online documentation of the desired visualization to see the
    options available.


    # Interactive Charts


    You can add interactivity beyond what is built in to the visualizations by using
    events. Each visualization may trigger its own events that JavaScript can listen
    for and act on. Consult the online documentation for specific information about
    the events triggered by the different visualizations. Table 8-2 lists the available
    events for the column chart used previously.


    Table 8-2. Available events for the column chart visualization


    | Event name | Description | Values passed back |

    |---|---||

    | error | Triggered when an error occurs drawing the chart. | id, message |

    | onmouse over | Triggered when the mouse moves over a bar. | row, column |

    | onmouse out | Triggered when the mouse leaves a bar. | row, column |

    | ready | Triggered when the chart is ready for interaction. You might be able
    to interact with charts without waiting for this event, but behavior is not guaranteed.
    | none |'
