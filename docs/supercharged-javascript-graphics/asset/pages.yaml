  md: '# CHAPTER 1

    Code Reuse and Optimization


    JavaScript has an undeservedly dubious reputation. Many people have written about
    its limitations as an object-oriented programming (OOP) language, even questioning
    whether JavaScript is an OOP language at all (it is). Despite JavaScript''s apparent
    syntactic resemblance to class-based OOP languages like C++ and Java, there is
    no Class statement (or equivalent) in JavaScript, nor any obvious way to implement
    popular OOP methodologies such as inheritance (code reuse) and encapsulation.
    JavaScript is also very coupled, with no compiler, and offers very few errors
    or warnings when things are likely to go wrong. The language is forgiving in almost
    all instances, a trait that gives unsuspecting programmers a huge amount of freedom
    on one hand, and a mile of rope with which to hang themselves on the other.


    Programmers coming from more classic and strictly defined languages can be frustrated
    by JavaScript''s blissful ignorance of virtually every programming faux global
    functions and variables are the default behavior, and semicolons are perfectly
    acceptable (remember the rope mentioned in the previous paragraph?). Of course,
    their frustration is probably due to a misunderstanding of what JavaScript is
    and how it works. Writing JavaScript applications is much easier if programmers
    first accept a couple of foundational truths:


    +   - JavaScript is not a class-based language.

    - Class-based OOP is not a prerequisite for writing good code.


    Some programmers have attempted to mimic the class-based nature of languages like
    C++ in JavaScript, but this is analogous to forcing a square peg into a round
    hole: it can be done (sort of), but the end result feel coveted.


    No programming language is perfect, and one could argue that the perceived superiority
    of certain programming languages (or indeed, the perceived superiority of OOP
    itself) is a good example of the emperor''s new clothes.In my experience, software
    written in C++, Java, or PHP generates fewer bugs or problems projects created
    with


    > * http://en.wikipedia.org/wiki/Emperor%27s_new_clothes'
  merge: -1
  pgno: 18
