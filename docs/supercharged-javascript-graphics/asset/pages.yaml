  md: "The CSS in Example 3-1 defines three unique layer styles: back, middle, and\
    \ front. The key to the parallax effect is the percentage set for the horizontal\
    \ background positions for each layer. As the window changes, the layers keep\
    \ their horizontal background position relative to the window width, and here\
    \ to appear at different speeds. The width of the layers expand to the full width\
    \ of the window, and the image being repeated over the layer's length. The layers\
    \ use position:absolute so they appear on top of the other.\n\n# ## Scrolling\
    \ with JavaScript\n\nAlthough the CSS scrolling techniques described earlier give\
    \ some nice effects, the lack of control is frustrating; the parallax effects\
    \ work only when the browser window is resized, there is no guarantee that the\
    \ user will see the effect. However, with JavaScript, there are no limitations\
    \ to how and when scrolling effects can occur. In this section, we will examine\
    \ two types of JavaScript scrolling techniques: background image scrolling and\
    \ the sophisticated tiled-based image scrolling.\n\n# ## Background Image Scrolling\n\
    \nThe following section recreates the CSS effect in Figure 3-3, but this time,\
    \ the movement of the mouse over the controls the direction and speed of scrolling\
    \ via JavaScript. As the mice move to either the left or right of the page, the\
    \ scrolling will accelerate in the same direction, slowing to a pace the mouse\
    \ moves into the middle of the page, or stopping completely when the mouse leaves\
    \ the page.\n\nWith the CSS code shown earlier in Example 3-1, the background\
    \ image positions were specified as a percentage of the browser window size. In\
    \ Example 3-2, the background image positions are manipulated as pixel positions.\n\
    \n![](img/a94409271b7a0212fea9cd6ea548a191_68_0.png)\n\nFor convenience, jQuery\
