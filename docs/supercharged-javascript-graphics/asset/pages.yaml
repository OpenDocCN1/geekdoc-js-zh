- img_proc: true
  md: 'We need a method whereby only this calculated maximum number of tiles is ever
    created and manipulated, regardless of the map size.


    ![](img/a94409271b7a0212fea9cd6ea548a191_72_0.png)


    Imagine the scroll position is increasing rightward through the map, and hence
    the 77 tiles are scrolling to the left. What happens when the leftmost tiles are
    totally outside the viewport? There are no more map elements to the right of the
    viewport (even though the map extends to the right), so a blank area will be displayed—this
    is not what we want. The solution is to “snap” all the tiles to the right again,
    so that the maximum amount of scrolling is never more than one tile in size. We
    can employ the same method for all scrolling directions.


    > What is the map scroll position? Imagine the entire map is a single huge bitmap.
    The map scroll position refers to the “pixel” in this virtual-bitmap that appears
    in the top-left corner of the viewport.


    How is the snap position calculated? Divide the current map scroll position by
    the tile width and take the negative of the remainder, as follows:


    ```

    snapPos = -(scrollPos % tilewidth);

    ```


    If the tile width was 64 pixels and the horizontal scroll position increases by
    8 pixels each time (starting at 0), the snap positions would repeat as follows:


    +   - 0, -8, -16, -24, -32, -40, -48, -56, 0, -8, -16, -24, -32, -40, -48, -56,
    etc.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'The snap position is then used as either the left or top position (depending
    on vertical or horizontal scrolling) of the handle element that contains all the
    tiles. The same calculation will work for left and right and up and down movement.
    Snap positions are calculated separately for the horizontal and vertical axes.


    You may have realized that merely snapping all the tiles to the right will display
    the same part of the map again, and with a jerking motion as the scroll position
    increases; you may also change the tiles depending on the scroll position. To
    select the correct bitmap, you must extract the appropriate tile index number
    from the map. You calculate this as follows (remember, the map is just an array
    of tile index numbers), assuming positions and sizes are specified as whole tile
    units (as opposed to pixels):


    ```

    index = map[yPos * mapWidth + xPos];

    ```


    # ...and Wrapping


    One very useful feature that you can add to tile scrolling the ability to “wrap”
    a map infinitely. Without wrapping, when the map scrolls in a particular direction
    across the viewport, at some point the extreme edge of the map will come into
    view. There is nothing further to be displayed in that direction, empty space
    appears; in other words, we have reached the end of the map.


    With wrapping, where the extreme edge of the map is visible and the map ends,
    display the tiles from the opposite extreme edge of the map again. This allows
    the scrolling to continue infinitely in any direction, giving the illusion of
    a map that stretches forever. As long as the extreme edges of the map line up
    with each other when displayed side by side, it looks perfectly natural and there
    is no “end” to the map.


    Map wrapping is perfect for situations where you need a continuous moving background-effect—for
    example, a sky with clouds, a space background with stars and planets, or rolling
    hills.


    # Keeping things fast


    Even though we''ve drastically reduced the number of tiles using the snapping
    method, a three-layer parallax scroll within a viewport of 640 x 384 pixels would
    still 3 x 77, or 231 tiles. We could reduce this number by using a larger tile
    size. For example, if one of the parallax layers is a basic sky with a few clouds,
    we could probably use 128-pixel tiles, thus reducing the number of tiles for that
    layer from 77 to 24.


    Manipulating the tiles should be kept to an absolute minimum while scrolling to
    ensure a rapid frame rate: precalculate as much as you can, and leave the actual
    scrolling code to do as little as possible. The optimizations within the scrolling
    code loop include:


    +   - No function calls, especially jQuery, as the innocuous function can be doing
    a lot behind the scenes.


    +   - Just basic loops and arithmetic.'
