  md: "# CHAPTER 3\n\n# Scrolling\n\nBrowser scrolling is the typically mundane action\
    \ of moving scroll bars up and down or left and right. You use scrolling to move\
    \ a viewport over content that is too long to view in its entirety within the\
    \ confines of the browser window or designated browser element. In this chapter,\
    \ we will examine more graphically uses of scrolling, initially from a purely\
    \ CSS perspective, and then move on more advanced scrolling effects that JavaScript\
    \ makes possible.\n\nWhy even covering CSS scrolling in a book about JavaScript\
    \ graphics? One reason is to highlight the limitations of using just CSS versus\
    \ programmed effects in JavaScript. In addition, you can add some nice touches\
    \ with CSS, and those are worth investigating.\n\n# CSS-Only Scrolling Effects\n\
    \nCSS can provide some basic control of scrolling content, which you can use to\
    \ good effect. In the atmospheric Retro Theater sample on the CSS Zen Garden website\
    \ (Figure 3-1), the main website content within the cinema screen is surrounded\
    \ by div elements that contain the cinema architecture images. As the user moves\
    \ the browser's vertical scroll bar, the main website content within the cinema\
    \ screen (the viewport) is transformed into what appears to be black-and-white\
    \ movie credits that move vertically.\n\nHow is this effect created? Using the\
    \ bottom part of the theater with the seats as an example, the CSS reads as follows:\n\
    \n```\n#extraDiv3\n{\n  position:fixed !important;\n  position:absolute;\n  bottom:0;\n\
    \  left:0;\n  width:100%;\n  height:30% !important;\n  height:110px;\n```"
  merge: -1
  pgno: 64
