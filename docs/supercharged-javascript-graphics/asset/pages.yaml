  md: '# Preface


    Having been a game developer for many years and being being used to working with
    high-performance programming languages and hardware, I initially had modest expectations
    of graphics programming with JavaScript. What I actually found was an excellent
    and efficient programming language that is continually being leveraged with better
    browsers, performance enhancements, and exciting new facilities. Combined with
    features such as Canvas, JavaScript offers developers a truly viable alternative
    to plug-ins such as Adobe Flash, and features such as WebGL ensure a very bright
    future for graphics programming using JavaScript and a browser.


    This book is for those who have a good knowledge of JavaScript and would like
    to experiment with graphics programming that goes beyond simple hover effects
    or relying on the animation facilities of libraries such as jQuery. Within pages,
    I cover various graphics-related subjects, including:


    +   * Reusing and optimizing code, including inheritance techniques and performance
    tips

    * Taking advantage of the surprising graphics power of regular DOM manipulation
    (HTML)

    * Using the Canvas element for additional graphics power

    * Creating video games

    * Using math for creative graphics and animation

    * Presenting your data in creative ways with the Google Visualizations API and
    Google Chart Tools

    * Using jQuery effectively and developing oriented jQuery plug-ins

    * Creating rich web applications for mobile devices using jQuery Mobile

    * Using PhoneGap to create native Android applications from your web applications


    This fast-paced book will give you a broad kick-start into various graphics techniques,
    hopefully whetting your appetite for further exploration of the subjects covered.

    Experiment and have fun!'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Audience and Assumptions


    Readers of this book should have a good working knowledge of creating websites
    and web applications—and in particular, the use of JavaScript.


    I like jQuery because it speeds up development, and many of the code samples include
    this library by default. In general, any external libraries and associated files
    are included from a reliable content delivery network such as Google''s, thus
    avoiding the need to copy files to your own web space.


    Math has been kept to a minimum, although some of the examples use basic vectors
    and trigonometry.


    # Organization


    The book is fast paced, with the first graphics programming examples appearing
    in Chapter 1.


    In the subsequent chapters, I cover a variety of graphics-oriented topics, focusing
    primarily on subjects that can add impressive visual impact and interactivity
    to your web applications.


    No book about interactive graphics would be complete without a discussion of video
    games. We''ll explore this subject in depth by developing a full video game application,
    as well as examining features that are useful for games projects, such as sprites
    and scrolling.


    The topics covered in each chapter can be summarized as follows:


    +   Chapter 1, Code Reuse and Optimization


    +   Covers JavaScript object-oriented programming techniques as well as code optimizations
    (including jQuery optimizations) that are useful when performance is important
    in graphics-based applications. We''ll also discuss the little-used JavaScript
    binary operators and how you can use them for optimization.


    +   Chapter 2


    +   Shows how real DOM manipulation (DHTML) can be used for fast-moving graphics.
    We''ll develop a sprite system (useful for games and other effects) and see how
    it works within the context of a jQuery plugin-in.


    +   Chapter 3, Scrolling


    +   Covers basic scrolling techniques, including parallax effects. We''ll move
    on to JavaScript-controlled scrolling and finally to a fast, tile-based parallax
    scrolling system. I''ll introduce you to the powerful Tiled map editor, showing
    you how to create tile-based maps.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 4, Advanced UI


    Includes coverage of the user interface libraries jQuery UI and Ext JS. We''ll
    explore the differing approaches of the two libraries and their respective suability
    for various types of applications. In addition to using existing UI libraries,
    we''ll build a 3D carousel from scratch.


    # Chapter 5, Introduction to JavaScript Games


    Demonstrates how to build fun and playable games without resorting to external
    plug-ins as Flash. Subjects covered include collision detection and object handling.
    We''ll develop a full retro-style arcade game to illustrate in action techniques
    we''ve discussed.


    # Chapter 6, HTML5 Canvas


    Examines the Canvas element in depth, with numerous examples—how to develop a
    graphical chart application using Canvas and WebSockets. topics include an introduction
    to drawing strokes, fills, gradients, recursive drawing, bitmaps, and animation.


    # Chapter 7, Vectors for Games and Simulations


    Covers the myriad uses of 2D vectors in graphical applications and games, proving
    that a little bit of math can go a long way. Code examples include cannon and
    rocket simulations with realistic movement.


    # Chapter 8, Google Visualizations


    Explores Google Chart Tools, an expansive resource of data visualization tools
    that can put an exciting spin on most kinds of data. From bar charts to Google-O-Meter
    gauges, this chapter covers the implementation of both static and interactive
    charts and other graphical visualizations in your applications. It includes the
    crucial topic of formatting your data in the correct way for Chart Tools to use.


    # Chapter 9, Reaching the Small Screen with jQuery Mobile


    Describes jQuery Mobile, a framework built on top of jQuery to provide a unified
    user interface for mobile-targeted applications. jQuery turns regular HTML pages
    into an interactive and animated mobile experience. This chapter covers the development
    of a graphical sliding puzzle game specifically geared to the jQuery UI and mobile
    devices.


    # Chapter 10, Creating Android Apps with PhoneGap


    Want to create a native mobile application using your usual web development skills?
    PhoneGap comes to the rescue. This chapter explains how to install and configure
    PhoneGap. After we walk through installation and configuration, we''ll convert
    the sliding puzzle game we developed in Chapter 9 into a native app ready for
    deployment to mobile devices.'
  merge: -1
