  md: "Remember, Canvas is a low-level and immediate mode system: each loop iteration\
    \ simply draws another rectangle on the screen, on top of the previous iteration's\
    \ rectangle. This results in a bit smeared shape, not a moving rectangle. We need\
    \ to do a bit more work to create an animated square that moves across the page:\n\
    \n+   1. Store an initial position for the square (x, y).\n2. Clear the canvas.\n\
    3. Update the square's position by changing x, y, or both.\n4. Draw the square\
    \ at the new position.\n5. Wait a bit.\n6. Loop back to step 2.\n\nFundamentally,\
    \ all animated bitmap systems do something like this under the hood. Step 2 may\
    \ be optional in certain circumstances. For instance, if the background were being\
    \ completely filled with a solid color, gradient, or bitmap image, clearing it\
    \ is not. Step 5 is needed so the user has a chance to see the animation and give\
    \ the browser time to do other things; otherwise, the browser would freeze with\
    \ no delay. Typically, a delay of around 20–50 milliseconds works well for animation.\
    \ The following page shows an animated moving square in Canvas as expected:\n\n\
    ```\n<DOCTYPE html>\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=utf-8\" />\n  <script type=\"text/javascript\" src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js\"\
    ></script>\n  <script>\n    var canvas = $(\"#canvas\")[0];\n    ctx = a_canvas.getContext(\"\
    2d\");\n    p = 0;\n    // We use setInterval to create a delay between iterations.\n\
    \    setInterval(function() {\n      // Clear canvas.\n      ctx.clearRect(0,\
    \ 0, a_canvas.width, a_canvas.height);\n      // Change position, and restart\
    \ at top left if position reaches 451.\n      if (p++ > 450) {\n        p = 0;\n\
    \      }\n      // Draw a rectangle.\n      ctx.fillStyle = \"rgb(0,0,255)\";\n\
    \      ctx.fillRect(p, p, 50, 50);\n    }, 30);\n  </script>\n</head>\n<body>\n\
    \  <canvas id=\"a_canvas\" width=\"500\" height=\"500\">\n```\n\n# Chapter 6:\
    \ HTML5 Canvas"
  merge: -1
