  md: "# What and When to Optimize\n\nOf equal importance to optimization is knowing\
    \ when not to do it. Premature optimization can lead to cryptic code and bugs.\
    \ There is little point in optimizing areas of an application that are seldom\
    \ executed. It's a good idea to use the Pareto principle, or 80–20 rule: 20% of\
    \ the code use 80% of the CPU cycles. Concentrate on this 20%, 10%, or 5%, and\
    \ ignore the rest. Fewer bugs will be introduced, the majority of code will remain\
    \ legible, and your sanity will be preserved.\n\nUsing profiling tools like Firebug\
    \ will quickly give you a broad understanding of what functions are taking the\
    \ most time to execute. It's up to you to rummage around these functions and decide\
    \ which code to optimize. Unfortunately, the Firebug profiler is available only\
    \ in Firefox. Other browsers have profilers, although this is not necessarily\
    \ the case on older versions of the browser software.\n\nFigure 1-1 shows the\
    \ Firebug profiler in action. In the Console menu, select Profile to start profiling,\
    \ and then select Profile again to stop profiling. Firebug will then display a\
    \ breakdown of all the JavaScript functions called between the start and end points.\
    \ The information is displayed as follows:\n\n+   - Function\n  The name of the\
    \ function called\n- Percent\n  Percentage of total time spent in the function\n\
    - Call\n  How many times the function was called\n- Own time\n  Time spent within\
    \ a function, excluding calls to other functions\n- Time\n  Total time spent within\
    \ a function, including calls to other functions\n- Average\n  Average of Own\
    \ times\n- Min\n  Fastest execution time of function\n- Max\n  Slowest execution\
    \ time of function\n- File\n  The JavaScript file in which the function is located"
