    Exception thrown  :java.lang.ArrayIndexOutOfBoundsException: 3


    Out of the block


    ### Multiple catch Blocks


    The number of catch blocks after a try block is not limited to 1\. You can have
    any number of catch blocks following a try block. In real situations, you will
    have to write multiple catch blocks for efficient exception handling. The syntax
    for writing multiple catch blocks is given below.


    Syntax:


    try


    {


     //Protected code


    }catch(ExceptionType1 e1)


    {


     //Catch block


    }catch(ExceptionType2 e2)


    {


     //Catch block


    }catch(ExceptionType3 e3)


    {


     //Catch block


    }


    In this example there are three catch blocks after a try block, but you can have
    multiple catch blocks after a single try block. If there is an exception in the
    protected god, that will be thrown to the following catch block. If the exception
    thrown matches the data type ExceptionType1, the exception will be caught there.
    If the exception data type doesn''t match, it will be passed to the next catch
    block. This process continues till the thrown exception is caught or till all
    the catch blocks leave the exception. In such cases, the current method will stop
    the execution and the exception will then be thrown to the previous method on
    the call stack. Here is an example.


