  raw: '*   boolean after(Date date) – Will return true if the Date object that is
    invoking has a later date than the specified one. If not, it will return False


    *   boolean before(Date date) – Same as the above method


    *   Object clone( ) – Will duplicate the invoking Date object


    *   int compareTo(Date date) – Will compare the value of the invoking object with
    the value of Date. If the values are equal, it will return 0\. If the invoking
    object is before the Date object, False is returned, while True will be returned
    if it is later.


    *   int compareTo(Object obj) – Exactly the same as the above method, provide
    the obj is of the Date class. If not, a ClassCastException will be thrown up


    *   boolean equals(Object date) – Will return true if the invoking Date object
    has the same date and time as the specified one, otherwise false will be returned


    *   long getTime( ) – Will return the number of milliseconds that have passed
    by since January 1, 1970


    *   int hashCode( ) – Will return a hash code for the invoking object


    *   void setTime(long time) – Will set the date and time as specified by time,
    representing the time elapsed in milliseconds since midnight, January 1, 1970


    *   String toString( ) – Will convert the invoking object to a string and the
    return the result


    ### Getting the Current Date & Time


    This is very easy to do; all you need is a simple date object, together with the
    toString() method, as the example shows:


    *   import java.util.Date;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   // Instantiate a Date object


    *   Date date = new Date();


    *   // display time and date using toString()


    *   System.out.println(date.toString());


    *   }


    *   }


    This would give this result:


    *   on May 04 09:51:52 CDT 2009


    ### Date Comparison


    There are three ways in Java to compare dates:


    *   Use getTime() to find out the number of milliseconds that have passed since
    midnight on January 1, 1970\. E this for both objects and then compare the values


    *   Use the before(), after() and equals() methods. For example, because the 12th
    day of the month is before the 18th day, newDate(99, 2, 12).before(newDate (99,
    2, 18) would return true


    *   Use the compareTo() method


    ### Date Formatting using SimpleDateFormat


    SimpleDateFormat  is known as a concrete class for both formatting and parsing
    dates. It allows you to choose any pattern that is user-defined for date and time
    formatting, as such:


    *   import java.util.*;


    *   import java.text.*;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   Date dNow = new Date( );


    *   SimpleDateFormat ft =


    *   new SimpleDateFormat ("E yyyy.MM.dd ''at'' hh:mm:ss a zzz");


    *   System.out.println("Current Date: " + ft.format(dNow));


    *   }


    *   }


    Executing this would give this result:


    *   Current Date: Sun 2004.07.18 at 04:14:09 PM PDT


    ### Simple DateFormat format codes


    In order to specify a time format, you would use a time pattern string. All ASCII
    letters are reserved int his string as pattern letters and these are defined as
    such:


    | Character | Description | Example |


    | G | Era Designator | AD |


    | Y | Year in 4 digits | 2000 |


    | M | Month in the Year | May or 05 |


    | d | Day in the month | 11 |


    | h | Hour in the AM or PM (1-12) | 12 |


    | H | Hour in the day (0-23) | 21 |


    | m | Minute in the hour | 30 |


    | s | Second in the minute | 53 |


    | S | Millisecond | 258 |


    | E | Day in the week | Wednesday |


    | D | Day in the year | 342 |


    | F | Day of the week in the month | 2 (second Thursday in May) |


    | w | Week in the year | 25 |


    | W | Week in the month | 2 |


    | a | AM or PM marker | AM |


    | k | Hour in the day (1-24) | 22 |


    | K | Hour in the AM or PM (0-11) | 9 |


    | z | Time zone | GMT |


    | ‘ | Escape for text | Delimiter |


    | “ | Single quote | ‘ |


    ### Date Formatting using printf


    It is very easy to format the date and time with the printf method. All you do
    is use a wo-leer format that starts with t and ends in one of the letters above.
    For example:


    *   import java.util.Date;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   // Instantiate a Date object


    *   Date date = new Date();


    *   // display time and date using toString()


    *   String str = String.format("Current Date/Time : %tc", date );


    *   System.out.printf(str);


    *   }


    *   }


    Executing this code would give this result:


    *   Current Date/Time : Sat Dec 15 16:37:57 MST 2012


    To avoid having to give the date several times over to format each part, you can
    use a format string to indicate which index is to be formatted:


    The index has to follow the % and it has to be terminated by a $. For example:


    *   import java.util.Date;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   // Instantiate a Date object


    *   Date date = new Date();


    *   // display time and date using toString()


    *   System.out.printf("%1$s %2$tB %2$td, %2$tY",


    *   "Due date:", date);


    *   }


    *   }


    This would give this result


    *   Due date: February 09, 2004


    You could, if you wanted to, use the < flag, which indicates that the argument
    that was in the preceding format specification should be used again, for example:


    *   import java.util.Date;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   // Instantiate a Date object


    *   Date date = new Date();


    *   // display formatted date


    *   System.out.printf("%s %tB %<te, %<tY",


    *   "Due date:", date);


    *   }


    *   }


    And this would give this result:


    *   Due date: February 09, 2004


    ### Parsing Strings into Dates


    There are some other methods in the SimpleDateFormat class, most importantly parse(),
    which will parse a string going on the format that is stored in the object. For
    example:


    *   import java.util.*;


    *   import java.text.*;


    *   public class DateDemo {


    *   public static void main(String args[]) {


    *   SimpleDateFormat ft = new SimpleDateFormat ("yyyy-MM-dd");


    *   String input = args.length == 0 ? "1818-11-11" : args[0];


    *   System.out.print(input + " Parses as ");


    *   Date t;


    *   try {


    *   t = ft.parse(input);


    *   System.out.println(t);


    *   } catch (ParseException e) {


    *   System.out.println("Unparseable using " + ft);


    *   }


    *   }


    *   }


    If you ran the above code, you would get this result:


    *   $ java DateDemo


    *   1818-11-11 Parses as Wed Nov 11 00:00:00 GMT 1818


    *   $ java DateDemo 2007-12-01


    *   2007-12-01 Parses as Sat Dec 01 00:00:00 GMT 2007


    ### Sleeping for a Time


    You can set your program to sleep from one millisecond right up to the lifespan
    of the computer. The following example shows a program that would sleep for a
    period of 10 seconds


    *   import java.util.*;


    *   public class SleepDemo {


    *   public static void main(String args[]) {


    *   try {


    *   System.out.println(new Date( ) + "\n");


    *   Thread.sleep(5*60*10);


    *   System.out.println(new Date( ) + "\n");


    *   } catch (Exception e) {


    *   System.out.println("Got an exception!");


    *   }


    *   }


    *   }


    Running this program would produce this result:


    *   Sun May 03 18:04:41 GMT 2009


    *   Sun May 03 18:04:51 GMT 2009


    ### Measuring Elapsed Time


    On occasion, you might need to measure time in milliseconds, particularly point
    in time. The above example can be rewritten as:


    *   import java.util.*;


    *   public class DiffDemo {


    *   public static void main(String args[]) {


    *   try {


    *   long start = System.currentTimeMillis( );


    *   System.out.println(new Date( ) + "\n");


    *   Thread.sleep(5*60*10);


    *   System.out.println(new Date( ) + "\n");


    *   long end = System.currentTimeMillis( );


    *   long diff = end - start;


    *   System.out.println("Difference is : " + diff);


    *   } catch (Exception e) {


    *   System.out.println("Got an exception!");


    *   }


    *   }


    *   }


    And executing this would give this result:


    *   Sun May 03 18:16:51 GMT 2009


    *   Sun May 03 18:16:57 GMT 2009


    *   Difference is : 5993


