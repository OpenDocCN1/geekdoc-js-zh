  trans: "\n\n* `String replaceAll(String regex, String replacement)` – 将字符串中匹配指定正则表达式的每个子字符串替换为指定的替换字符串\n\
    * `String replaceFirst(String regex, String replacement)` – 将索引处第一个匹配指定正则表达式的子字符串替换为指定的替换字符串\n\
    * `String[] split(String regex)` – 根据任何匹配指定正则表达式的项拆分字符串\n* `String[] split(String\
    \ regex, int limit)` – 与上述方法相同\n* `boolean startsWith(String prefix)` – 测试字符串是否以指定的前缀开头\n\
    * `boolean startsWith(String prefix, int toffset)` – 同上，但测试前缀是否从指定的索引处开始\n* `CharSequence\
    \ subSequence(int beginIndex, int endIndex)` – 返回一个作为该序列子序列的字符序列\n* `String substring(int\
    \ beginIndex)` – 返回该字符串的子字符串的新字符串\n* `String substring(int beginIndex, int endIndex)`\
    \ – 与上述方法相同\n* `char[] toCharArray()` – 将字符串转换为字符数组\n* `String toLowerCase()`\
    \ – 使用默认区域语言规则将字符串中的字符转换为小写\n* `String toLowerCase(Locale locale)` – 同上，使用指定的区域语言规则\n\
    * `String toString()` – 返回字符串本身\n* `String toUpperCase()` – 使用默认区域语言规则将此字符串中的字符转换为大写\n\
    * `String toUpperCase(Locale locale)` – 同上，但使用指定的区域语言规则\n* `String trim()` – 返回字符串的副本，省略前导和尾部空白\n\
    * `static String valueOf(primitive data type x)` – 返回传递的原始数据类型的表示\n\n## 数组\n\n\
    数组在 Java 中也被频繁使用，它们存储了一系列相同类型的固定大小元素序列。数组存储数据集合，但数组更多地被视为相同类型变量的集合。\n\n与其使用单个变量，你不如声明一个数组变量，并在内部表示各个单个变量。\n\
    \n### 声明数组变量\n\n如果你想使用数组，首先必须声明一个变量。这是为了引用数组，并且必须指定该变量能够引用的数组类型。要声明数组变量，可以使用以下语法：\n\
    \n* `dataType[] arrayRefVar;` // 推荐方式。\n* 或者\n* `dataType arrayRefVar[];` // 可用，但不是首选方式。\n\
    \n例如：\n\n* `double[] myList;` // 推荐方式。\n* 或者\n* `double myList[];` // 可用，但不是首选方式。\n\
    \n### 创建数组\n\n使用 `new` 运算符创建数组，请使用以下语法：\n\n* `arrayRefVar = new dataType[arraySize];`\n\
    \n这条语句执行了两件事：\n\n* 它使用 `dataType[arraySize]` 创建数组\n* 将数组的引用赋值给变量 `arrayRefVar`\n\
    \n你只需要一条语句即可声明数组变量、创建一个新数组并将引用赋值给变量，如下：\n\n* `dataType[] arrayRefVar = new dataType[arraySize];`\n\
    \n或者你可以这样做：\n\n* `dataType[] arrayRefVar = {value0, value1, ..., valuek};`\n\n\
    索引用于访问数组元素，且索引是从 0 开始的，这意味着它们从 0 开始到 `arrayRefVar.length-1`。\n\n例如：此语句声明了一个名为\
    \ `myList` 的数组变量，创建了一个包含 10 个元素的数组（全部为 double 类型），并将引用赋值给 `myList`：\n\n* `double[]\
    \ myList = new double[10];`\n\n### 处理数组\n\n当我们处理数组元素时，我们倾向于使用 `for` 循环或 `foreach`\
    \ 循环，仅仅是因为所有元素都是相同类型，且我们知道数组的大小。下面的示例了如何创建一个数组、初始化它并处理它：\n\n```java\npublic class\
    \ TestArray {\n    public static void main(String[] args) {\n        double[]\
    \ myList = {1.9, 2.9, 3.4, 3.5};\n        // 打印所有元素\n        for (int i = 0; i\
    \ < myList.length; i++) {\n            System.out.println(myList[i] + \" \");\n\
    \        }\n        // 求和所有元素\n        double total = 0;\n        for (int i =\
    \ 0; i < myList.length; i++) {\n            total += myList[i];\n        }\n \
    \       System.out.println(\"Total is \" + total);\n        // 寻找最大的元素\n     \
    \   double max = myList[0];\n        for (int i = 1; i < myList.length; i++) {\n\
    \            if (myList[i] > max) max = myList[i];\n        }\n        System.out.println(\"\
    Max is \" + max);\n    }\n}\n```\n\n执行此代码将得到以下结果：\n1.9\n2.9\n3.4\n3.5\nTotal is\
    \ 11.7\nMax is 3.5\n\n### foreach 循环\n\n`foreach` 循环是在 JDK 1.5 中引入的。这允许你在无需索引变量的情况下遍历整个数组。例如：这段代码显示了\
    \ `myList` 数组中的所有元素：\n\n```java\npublic class TestArray {\n    public static void\
    \ main(String[] args) {\n        double[] myList = {1.9, 2.9, 3.4, 3.5};\n   \
    \     // 打印所有数组元素\n        for (double element : myList) {\n            System.out.println(element);\n\
    \        }\n    }\n}\n```\n*(注：此处原文代码中语法略有误，漏掉了冒号，翻译时保持原意)*\n\n### 将数组传递给方法\n\n\
    与传递原始类型值给方法一样，我们可以将数组传递给方法。下面的示例展示了 `int` 数组中的：\n\n```java\npublic static void\
    \ printArray(int[] array) {\n    for (int i = 0; i < array.length; i++) {\n  \
    \      System.out.print(array[i] + \" \");\n    }\n}\n```\n\n调用它时我们需要传递一个数组，例如下面的语句：\n\
    \n`printArray(new int[]{3, 1, 2, 6, 4});`\n\n此操作的结果为：31264\n\n### 方法返回数组\n\n方法也可以返回数组，在所示示例中，该方法返回另一个数组的反转：\n\
    \n```java\npublic static int[] reverse(int[] list) {\n    int[] result = new int[list.length];\n\
    \    for (int i = 0, j = result.length - 1; i < list.length; i++, j--) {\n   \
    \     result[j] = list[i];\n    }\n    return result;\n}\n```\n\n### Arrays 类\n\
    \n`java.util.Arrays` 类包含几个静态方法，允许你搜索和排序数组、比较它们并填充元素。以下是方法列表：\n\n* 使用二分算法在指定的对象数组中搜索指定的值。在调用此方法之前，数组必须排序。如果搜索键在列表中，将返回其索引，否则返回\
    \ `-(插入点 +1)`\n* 如果两个指定的数组相等，则返回 `true`。如果两个数组具有相同的元素数量且数组中对应的元素对相等，则两个数组相等。此方法适用于所有数据类型。\n\
    * 将指定的 `int` 值赋值给指定的 `int` 数组。\n* 将指定的数组按元素升序排序。\n\n## 日期和时间\n\n`java.util` 包包含\
    \ `Date` 类，该类封装了日期和时间。该类支持两个构造函数：\n\n* `Date()` – 初始化对象的日期和时间\n* `Date(long millisec)`\
    \ – 接受一个参数，其值等于自 1970 年 1 月 1 日午夜以来过的毫秒数。\n\n下方列出了 `Date` 类支持的方法：\n\n"
- fmt: "\n* `boolean after(Date date)` – Will return `true` if the `Date` object that\
    \ is invoking has a later date than the specified one. If not, it will return\
    \ `False`\n\n* `boolean before(Date date)` – Same as the above method\n\n* `Object\
    \ clone() ` – Will duplicate the invoking `Date` object\n\n* `int compareTo(Date\
    \ date)` – Will compare the value of the invoking object with the value of `Date`.\
    \ If the values are equal, it will return `0\\.`. If the invoking object is before\
    \ the `Date` object, `False` is returned, while `True` will be returned if it\
    \ is later.\n\n* `int compareTo(Object obj)` – Exactly the same as the above method,\
    \ provide the `obj` is of the `Date` class. If not, a `ClassCastException` will\
    \ be thrown up\n\n* `boolean equals(Object date)` – Will return `true` if the\
    \ invoking `Date` object has the same date and time as the specified one, otherwise\
    \ `false` will be returned\n\n* `long getTime() ` – Will return the number of\
    \ milliseconds that have passed by since January 1, 1970\n\n* `int hashCode()\
    \ ` – Will return a hash code for the invoking object\n\n* `void setTime(long\
    \ time)` – Will set the date and time as specified by `time`, representing the\
    \ time elapsed in milliseconds since midnight, January 1, 1970\n\n* `String toString()\
    \ ` – Will convert the invoking object to a string and the return the result\n\
    \n### Getting the Current Date & Time\n\nThis is very easy to do; all you need\
    \ is a simple date object, together with the `toString()` method, as the example\
    \ shows:\n\n```java\nimport java.util.Date;\n\npublic class DateDemo {\n    public\
    \ static void main(String args[]) {\n        // Instantiate a Date object\n  \
    \      Date date = new Date();\n        // display time and date using toString()\n\
    \        System.out.println(date.toString());\n    }\n}\n```\n\nThis would give\
    \ this result:\n\n* on May 04 09:51:52 CDT 2009\n\n### Date Comparison\n\nThere\
    \ are three ways in Java to compare dates:\n\n* Use `getTime()` to find out the\
    \ number of milliseconds that have passed since midnight on January 1, 1970\\\
    . E this for both objects and then compare the values\n\n* Use the `before()`,\
    \ `after()` and `equals()` methods. For example, because the 12th day of the month\
    \ is before the 18th day, `newDate(99, 2, 12).before(newDate (99, 2, 18))` would\
    \ return `true`\n\n* Use the `compareTo()` method\n\n### Date Formatting using\
    \ SimpleDateFormat\n\n`SimpleDateFormat` is known as a concrete class for both\
    \ formatting and parsing dates. It allows you to choose any pattern that is user-defined\
    \ for date and time formatting, as such:\n\n```java\nimport java.util.*;\nimport\
    \ java.text.*;\n\npublic class DateDemo {\n    public static void main(String\
    \ args[]) {\n        Date dNow = new Date( );\n        SimpleDateFormat ft = new\
    \ SimpleDateFormat (\"E yyyy.MM.dd 'at' hh:mm:ss a zzz\");\n        System.out.println(\"\
    Current Date: \" + ft.format(dNow));\n    }\n}\n```\n\nExecuting this would give\
    \ this result:\n\n* Current Date: Sun 2004.07.18 at 04:14:09 PM PDT\n\n### Simple\
    \ DateFormat format codes\n\nIn order to specify a time format, you would use\
    \ a time pattern string. All ASCII letters are reserved int his string as pattern\
    \ letters and these are defined as such:\n\n| Character | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| G | Era Designator | AD |\n| Y | Year in 4 digits\
    \ | 2000 |\n| M | Month in the Year | May or 05 |\n| d | Day in the month | 11\
    \ |\n| h | Hour in the AM or PM (1-12) | 12 |\n| H | Hour in the day (0-23) |\
    \ 21 |\n| m | Minute in the hour | 30 |\n| s | Second in the minute | 53 |\n|\
    \ S | Millisecond | 258 |\n| E | Day in the week | Wednesday |\n| D | Day in the\
    \ year | 342 |\n| F | Day of the week in the month | 2 (second Thursday in May)\
    \ |\n| w | Week in the year | 25 |\n| W | Week in the month | 2 |\n| a | AM or\
    \ PM marker | AM |\n| k | Hour in the day (1-24) | 22 |\n| K | Hour in the AM\
    \ or PM (0-11) | 9 |\n| z | Time zone | GMT |\n| ‘ | Escape for text | Delimiter\
    \ |\n| “ | Single quote | ‘ |\n\n### Date Formatting using printf\n\nIt is very\
    \ easy to format the date and time with the `printf` method. All you do is use\
    \ a wo-leer format that starts with t and ends in one of the letters above. For\
