    ## Catching Exceptions


    In Java, an exception can be caught by a method using the try and catch keywords.
    If there is a block of code that might give an exception, it will be placed inside
    the try/catch blocks. Any code that is placed between the try/catch blocks will
    be considered as protected code. The syntax for writing the try/catch blocks is
    given below.


    Syntax:


    try


    {


     //Protected code


    }catch(ExceptionName e1)


    {


     //Catch block


    }


    When writing a catch statement, the type of exception that you wish to catch should
    be declared. If there is an exception raised in the protected block of code, the
    catch block following the try block will be checked. If the exception type is
    it declared in the garage block, the exception that is passed to the garage block
    is like an argument that is passed to all method parameter. Here is an example.


    Example:


    The following program contains an array that has 2 elements. The code is trying
    to access the undeclared 3rd element making it throw an exception.


    // File Name : ExcepTest.java


