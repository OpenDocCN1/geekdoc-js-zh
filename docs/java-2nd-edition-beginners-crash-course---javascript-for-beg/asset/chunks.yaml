    ## Arrays


    Arrays are also used a lot in Java and these store a sequence of fixed-size elements
    that are all the same type. Arrays store data collections but it is more often
    that an array if thought of as a collection of variables that are the same type.


    Instead of individual variables, you would declare one array variable with individual
    variables represented inside.


    ### Declaring Array Variables


    If you want to use an array, you first have to declare a variable. This is to
    reference the array and you must specify which type of array the variable is able
    to reference. To declare an array variable, you would use this syntax:


    *   dataType[] arrayRefVar;   // preferred way.


    *   or


    *   dataType arrayRefVar[];  //  works but not preferred way.


    For example:


    *   double[] myList;         // preferred way.


    *   or


    *   double myList[];         //  works but not preferred way.


    ### Creating Arrays


    To create an array with the new operator, use this syntax:


    *   arrayRefVar = new dataType[arraySize];


    This statement is doing two things:


    *   It uses the dataType[arraySize] to create an array


    *   The reference of the array is assigned to the variable arrayRefVar


    You can declare an array variable, create a new array and assign the reference
    to the variable using just one statement, like this:


    *   dataType[] arrayRefVar = new dataType[arraySize];


    Or you can do this:


    *   dataType[] arrayRefVar = {value0, value1, ..., valuek};


    The index is used to access the array elements and the indices are 0-based, which
    means that they begin from 0 to arrayRefVar.length-1.


    For example:


    This statement shows an array variable being declared, called myList, an array
    consisting of 10 elements created, all of double type and the reference assigned
    to myList:


    *   double[] myList = new double[10];


    ### Processing Arrays


    When we process array elements, we tend to use the for loop or the foreach loop
    simply because all of the elements are the same type and we know what the array
    size is. The following example shows you how to create an array, initialize it
    and then process it:


    *   public class TestArray {


    *   public static void main(String[] args) {


    *   double[] myList = {1.9, 2.9, 3.4, 3.5};


    *   // Print all the array elements


    *   for (int i = 0; i < myList.length; i++) {


    *   System.out.println(myList[i] + " ");


    *   }


    *   // Summing all elements


    *   double total = 0;


    *   for (int i = 0; i < myList.length; i++) {


    *   total += myList[i];


    *   }


    *   System.out.println("Total is " + total);


    *   // Finding the largest element


    *   double max = myList[0];


    *   for (int i = 1; i < myList.length; i++) {


    *   if (myList[i] > max) max = myList[i];


    *   }


    *   System.out.println("Max is " + max);


    *   }


    *   }


    Executing this code would give this result:


    *   1.9


    *   2.9


    *   3.4


    *   3.5


    *   Total is 11.7


    *   ax is 3.5


    ### The foreach Loops


    The foreach loop came in with JDK 1.5\. This allows you to travel through the
    entire array in sequence without needing to resort to the use of an index variable


    For example:


    This code shows all of the elements that are in the myList array:


    *   public class TestArray {


    *   public static void main(String[] args) {


    *   double[] myList = {1.9, 2.9, 3.4, 3.5};


    *   // Print all the array elements


    *   for (double element: myList) {


    *   System.out.println(element);


    *   }


    *   }


    *   }


    Executing the code would give this result:


    *   1.9


    *   2.9


    *   3.4


    *   3.5


    ### Passing Arrays to Methods


    In the same way that we pass primitive data type values to methods, we can pass
    an array to a method. The following example is a method showing the elements that
    are in an int array:


    *   public static void printArray(int[] array) {


    *   for (int i = 0; i < array.length; i++) {


    *   System.out.print(array[i] + " ");


    *   }


    *   }


    To invoke it we would pass an array, for example, the statement in the example
    below would invoke the printArray method:


    *   printArray(new int[]{3, 1, 2, 6, 4, 2});


    The result of this would be:


    *   3, 1, 2, 6, 4, 2;


    ### Returning an Array from a Method


    Methods are also able to return arrays and, in the example shown below, the method
    returns an array that is simply the reversal of another one:


    *   public static int[] reverse(int[] list) {


    *   int[] result = new int[list.length];


    *   for (int i = 0, j = result.length - 1; i < list.length; i++, j--) {


    *   result[j] = list[i];


    *   }


    *   return result;


    *   }


    ### The Arrays Class


    In the jave.util.Arays class, there are several static methods that allow you
    to search and sort arrays, compare them and fill the elements. The following is
    a list of the methods:


    *   public static int binarySearch(Object[] a, Object key) – Will search for a
    specified value, in a specified object array, using the binary search algorithm.
    Before this call is made, the array must be sorted. The search key index will
    be returned, provided it is in the list, otherwise the return will be (-(insertion
    point +1)


    *   , public static boolean equals(long[] a, long[] a2), - Will return true if
    both of the specified arrays are equal to each other. Two arrays are equal if
    both have the same number of elements and the corresponding element pairs in the
    arrays are equal. This will return true if both arrays are equal. The same method
    can be used by all data types.


    *   public static void fill(int[] a, int val) – Will assign the int value that
    is specified to an array of ints that is also specified.


    *   public static void sort(Object[] a) – Will sort the specified array into ascending
    order, going by the ordering of the elements


    ## Date and Time


    The java.util package contains the Date class, which encloses the date and time.
    There are two constructors that are supported by the class:


    *   Date – initializes the object with the date and time


    *   Date (long millisec) – Accepts an argument that is equal to the number of
    milliseconds that have passed since midnight on January 1 1970.


    The list below details the methods supported by the Date class:'
