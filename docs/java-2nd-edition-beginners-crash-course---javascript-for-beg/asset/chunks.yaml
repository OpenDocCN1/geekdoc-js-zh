  trans: "\n\n*   通过输入 `rpm -jvh jre-7u7-linux-1586.rpm` 安装 java 包。\n*   如果你想节省一些磁盘空间，请删除\
    \ `.rpm` 文件。\n*   退出 Shell 启动 – 你不需要重启电脑。\n\n安装已完成，现在你需要前往“启用与配置”部分。\n\n# 启用与配置\n\
    \n## Firefox 浏览器\n\n*   如果 Firefox 浏览器已打开并运行，请将其关闭。\n*   移除任何之前的 Java 插件版本 – 你一次只能运行一个版本。如果你想运行不同的版本或不同的插件，你必须删除指向其他版本的符号链接，并为新版本创建一个新链接。\n\
    *   为 `libnpjp2.so` 创建符号链接 – 你可以在浏览器插件目录中找到它。\n*   通过输入 `cd <firefox installation\
    \ directory>/plugins` 查找安装目录下的子目录（输入正确的目录名称）。\n*   创建符号链接 - `ln -s <Java installation\
    \ directory>/lib/i386/libnpjp2.so`。\n\n如果你是从旧版本的 Java 升级，在创建新链接之前，必须删除现有的符号链接：\n\
    \n*   输入 `cd <Firefox installation directory>/plugins`\n*   `rm libjavaplugin_oji.so`\n\
    \n例如：\n\n*   如果 Firefox 安装在 `/usr/lib/<Firefox installation directory>`\n*   且\
    \ Java 位于 `/usr/java/<Java installation directory>`\n*   那么你将在终端窗口输入 `/usr/lib/<Firefox\
    \ installation directory>/plugins` 进入浏览器插件目录。\n*   要为 Firefox Java 插件创建符号链接，请输入\
    \ `ln -s /usr/java/<Java installation directory>/lib/i386/libnpjp2.so`。\n\n重启你的\
    \ Firefox 浏览器，并在地址栏中输入 `about: plugins` – 这将确认 Java 插件已加载。点击“工具”菜单确保 Java 控制台在其中。\n\
    \n# 如何在 Solaris 上安装 Java\n\n有两种方法可以将 Java 下载到 Solaris 系统上：\n\n*   适用于 32 位系统的\
    \ Solaris SPARC\n*   适用于 64 位系统的 Solaris SPARC\n\nJava 是一个自解压二进制文件，因此请确保你下载了适用于你系统的正确程序包。\n\
    \n与之前的教程一样，我在此使用了 `v7`，因此请确保在输入的任何命令中使用正确的版本号。\n\nJRE 存档二进制文件可以下载到任何你可以写入的位置，它不会取代\
    \ Oracle Solaris OS 提供的版本。\n\n如果你在允许使用 32 位 JVM 的 64 位系统上安装，该过程有两个步骤。首先，你必须安装\
    \ 32 位版本，然后是支持 64 位操作。文件名如下：\n\n在 SPARC 处理器上：\n\n*   `jre-7u7-solaris-sparc.tar.gz`\
    \ (32 位)\n*   `jre-7u7-solaris-sparcv9.tar.gz` (64 位)\n\n在 x64/EM64T 处理器上：\n\n\
    *   `jre-7u7-solaris-i586.tar.gz` (32 位)\n*   `jre-7u7-solaris-x64.tar.gz` (64\
    \ 位)\n\n如果你使用的是 32 位 Solaris，你只需要下载 32 位版本。\n\n*   打开 `http://java.com`\n*   点击“Free\
    \ Java Download”（免费下载 Java）\n*   你将看到一个包含“Manual downloads”（手动下载）的页面 – 下载相关的包。\n\
    \n如果你运行的是 32 位版本的 Oracle Solaris，你只需要下载并安装 32 位版本。\n\n注意 – `.tar.gz` 文件也称为 tarball，可以一次性解压缩并提取。\n\
    \n*   切换目录到 JRE 将要安装的位置：`cd <directory path name>`\n*   将以 `.tar.gz` 结尾的存档二进制文件移动到当前目录。\n\
    *   解压 tar 包并安装 Java：\n\n在 SPARC 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-sparc.tar.gz\
    \ | tar xf –`\n*   `gzip -dc jre-7u7-solaris-sparcv9.tar.gz | tar xf –`\n\n在 x64/EM64T\
    \ 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-i586.tar.gz | tar xf –`\n*   `gzip -dc\
    \ jre-7u7-solaris-x64.tar.gz | tar xf -`\n\nJava 将安装在当前目录下的 `jre1.7.0_<version>`\
    \ 目录中，辅助的 64 位文件将安装在与机器架构模型对应的目录中。这些文件位于版本目录内的多个位置，例如：\n\nSPARC 处理器 – `libjvm.so`\
    \ 文件（64 位 Java VM 库文件）。Java 安装在当前目录下的 `jre1.7.0_<version>` 目录中。\n\n## 启用与配置\n\n\
    一旦安装了 Java，是时候确保它已配置为可以在浏览器中运行 applet 了：\n\n*   通过输入 `cd <Firefox installation\
    \ directory>/plugins` 查找 Firefox 安装目录下的插件子目录。\n*   Java 安装在当前目录下的 `jre1.7.0_<version>`\
    \ 目录中。\n\n# 第 12 章：编写你的第一个程序\n\n既然你已经了解了 Java 并知道如何安装它，是时候开始编写程序了。记住，在 Java 中，所有工作都在文字处理器（Word\
    \ Processor）中完成，而不是在命令行中。打开文字处理器并输入：\n\n```java\nclass Pythagorean {\n    public\
    \ static void main(String[] args){\n\n    }\n}\n```\n\n让我解释一下你做了什么：\n\n每个类都在一个新类中打开。把类想象成一组指令，或者说一份食谱。有些食谱需要额外的食谱才能完成，而另一些像你写的这种则可以独立运行。假设你正在制作墨西哥鳄果酱（guacamole）；你的食谱将包含如何制作的逐步说明。这是一个单一类。现在，假设你想做一个墨西哥卷饼（burrito）而它需要鳄果酱。现在你有两个选择\
    \ – 写一个包含制作卷饼和鳄果酱说明的食谱，或者你可以写卷饼食谱，然后引用独立的鳄果酱食谱。这就是 Java 的做法。你可以让一个类引用另一个类，也可以让包含所有内容的类。这就是为什么\
    \ Java 是面向对象的 – 因为你可以根据喜好来编写。现在，让我们拆解你刚刚输入的内容：\n\n*   在这个例子中类名是 `Pythagorean`。所有的\
    \ Java 文件都必须保存为类名，后接 `.java`。\n*   类由第一个 `{` 打开。\n*   下一行 `public static void\
    \ main(String[] args)` 是在调用类的 main 方法。虽然这有点高级，但你应该记住它，因为你会经常使用它。\n*   `}` 括号关闭了程序分段。编写每个程序时必须做的一件事是确保每个开启括号都有对应的闭合括号。\n\
    \n在这个阶段，你的应用程序不会执行任何操作，但我们仍然需要保存它。\n\n接下来，我们要运行这个应用程序，即使它无所作为。这样做是为了让你养成这种习惯。你需要在每个阶段都运行应用程序进行测试。如下：\n\
    \nWindows：\n\n*   打开命令行\n*   找到你保存应用程序的位置\n*   现在在命令行输入类似以下的内容：`C:/java/samples>javac\
    \ Pythagorean.java`\n\n"
- fmt: "\n`/java/samples` is the directory that you are working in. In computer language,\
    \ `/name` signifies a folder. The final part is where you saved your application.\
    \ If you saved it to your desktop, for example, you would type `/desktop>javac\
    \ Pythagorean.java`\n\n`javac` means java compile and this is a process whereby\
    \ the application is transformed from readable words into computer language. This\
    \ is also where many errors, if there are any, will show up. These errors can\
    \ easily be corrected in the original application.\n\nOK, so if nothing happened\
    \ then you know your application worked, because it wasn’t meant to do anything.Locate\
    \ the folder that you saved your application in; you should now see a second file\
    \ that reads `Pythagorean.class`. If it is there, all well and good. If it isn’t,\
    \ you need to check the text in the application and on the command line to ensure\
    \ that you did everything right.\n\n### Mac\n\nThis is a similar process to Windows:\n\
    \n*   Open up `terminal.app`\n*   Locate where you saved your application\n* \
    \  Type in at the terminal `cd <name of directory>`\n*   Now type in something\
    \ along the same lines as you did with the Windows version - `C:/java/samples>javac\
    \ Pythagorean.java`\n\nThe next step is to make your application do something.\
    \ In your Word Processor window, type in the following (I have started from scratch\
    \ here but you can continue after what you type earlier, starting from the right\
    \ place:\n\n```java\nclass Pythagorean {\n    public static void main(String[]\
    \ args){\n        String greeting = “Hello. Welcome to the Pythagorean Theorem\
    \ Application. Today we will be computing the Pythagorean Theorem for you.\",\n\
    \        String prompt = \"Please enter a number for the first leg of a right\
    \ triangle, followed by pressing ENTER or RETURN, followed by the remaining leg.\
    \ Then hit ENTER or RETURN one more time.\";\n        System.out.println(greeting);\n\
    \        System.out.println(prompt);\n    }\n}\n```\n\nTo break that down:\n\n\
    *   A string is a line of text and this is known as a variable, which means it\
    \ can be varied\n*   `Prompt` and `greeting` are the string names so in the line\
    \ that starts `String greeting` you are making a string that is called `greeting`.\
    \ Note that the line ends with a semicolon – this is important – ALL JAVA STATEMENTS\
    \ MUST END IN A SEMICOLON otherwise you will get errors\n*   `=` is used to assign\
    \ a value to the variable, which is done like this: `String greeting = \"Hello.\
    \ Welcome to the Pythagorean Theorem Application. Today we will be computing the\
    \ Pythagorean Theorem for you.\";` , or, like this: `String greeting; greeting\
    \ = \"Hello. Welcome to the Pythagorean Theorem Application. Today we will be\
    \ computing the Pythagorean Theorem for you.\";`\n\nIn the latter case you are\
    \ both declaring and assigning value to the variable in two separate steps while,\
    \ in the first case, you are using just one step. Both work the same way. Keep\
    \ in mind that all of the text that goes into the variable must be enclosed in\
    \ quote mark – “””\n\nIn the line `System.out.println`, you are calling for the\
    \ system output to print the variable line. If you were to call `System.out.println(“HI”)`,\
    \ the word “HI” would be printed to your terminal. Note the quote marks here –\
    \ these indicate that what is in between them in text, not a variable name. If\
    \ you were to call `System.out.println(HI)`, without the quote marks, you would\
    \ get an error message because the program would be looking to print the value\
    \ of a variable called `HI` – there isn’t one. Commit this command to memory;\
    \ it is another that you will use constantly.\n\nNow we are going to change things\
    \ up a little and get a bit more complicated. Change the code you have written\
    \ so far to say this:\n\n```java\nimport java.util.Scanner;\nclass Pythagorean\
    \ {\n    public static void main(String[] args){\n        String greeting = \"\
    Hello. Welcome to the Pythagorean Theorem Application. Today we will be computing\
    \ the Pythagorean Theorem for you.\";\n        String prompt = \"Please enter\
    \ a number for the first leg of a right triangle, followed by pressing ENTER or\
    \ RETURN, followed by the remaining leg. Then hit ENTER or RETURN one more time.\"\
    ;\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
    \        float a;\n        float b;\n        Scanner myScanner = new Scanner(System.in);\n\
    \        a = myScanner.nextFloat();\n        b = myScanner.nextFloat();\n    \
    \    float a2 = a * a;\n        float b2 = b * b;\n        double c2 = a2 + b2;\n\
    \        double c = Math.sqrt(c2);\n        System.out.println(\"The square of\
    \ a is: \" + a2 + \" The square of b is: \" + b2 + \" The square of c is: \" +\
    \ c2 + \" C is: \" + c);\n    }\n}\n```\n\nNow, you are probably staring a bit\
    \ wide-eyed at that one, wondering what it’s all about so let’s break it down.\n\
    \nThe first line is different to what the original code read – what we are doing\
    \ here is telling your program that you want it to import `SCANNER`, which is\
    \ a Java utility. As you know, a scanner scans things and what it is going to\
    \ do here is to scan what you have input at the command line. With me so far?\n\
    \n`float a;` and `float b;` are both declaring variables. `Scanner myScanner =\
    \ new Scanner(System.in);` means that you have created a scanner and named it\
    \ its input comes from `System.in`. `a = myScanner.nextFloat();` is saying that\
    \ variable `a` should be assigned to the first floating point that the scanner\
    \ reads. `b = myScanner.nextFloat();` dos the same but with the next floating\
    \ number.\n\nNow, there is quite a lot of mathematics in that piece:\n\n*   `float\
    \ a2 = a * a;` is declaring a variable with the name `a2` and giving it a value\
    \ that is the sum of `a` multiplied by `a`\n*   `float b2 = b * b;` is the same\
    \ but with float `b`\n*   `double c2 = a2 + b2;` declared a double accuracy which\
    \ is simply a long decimal number, and gives it a value of `a2` plus `b2`\n* \
    \  `double c = Math.sqrt(c2);` takes the root of `c2` and then puts it in variable\
    \ `c`\n\nThe final line of the code simply prints it all out. Anything inside\
    \ the quote marks will be printed as text and `+` gets used to combine the output.\
    \ Anything that is not in the quotes will print the variable value\n\nI am going\
    \ to leave it there because, from here on it starts to get a lot more complicated\
    \ and first you need to learn some of the functions of Java.\n\n# \n\nChapter\
    \ 13: Java Functions\n\nTo understand what you are doing when you start to write\
    \ your Java code, you must first understand the functions of Java. I already talked\
    \ about some of the more basic earlier in this book so now it’s time to look at\
    \ some of the more advanced ones.\n\n## Loop Control\n\nOn occasion, you will\
    \ need to execute one block of code multiple times. As a rule, all statements\
    \ are executed in sequence, with the first in the function executed first, the\
    \ second being executed second and so on to the end. Most programming languages\
    \ have a number of control structures that allow you to have more complicated\
    \ execution commands and Java is no exception.\n\nLoop statements let you execute\
    \ a single statement or a group of statements several times. The following is\
    \ a list of the loops that Java provides to handle the looping requirements:\n\
    \n*   `while` loop will repeat a single or group of statements provided a given\
    \ condition is true. The condition is tested before the loop body is executed\n\
    *   `for` loop will execute a statement sequence a number of times and will abbreviate\
    \ the loop variable management code\n*   `do…while` loop – similar to the while\
    \ statement, but with this one the condition is tested at the end of the loop\
    \ body\n"
