    name with the result of getMessage(). |


    | 4 | public void printStackTrace()This method will print the result of the toString()
    combined with the stack tree to the error output stream System.err. |


    | 5 | public StackTraceElement [] getStackTrace()This method will return an array
    that contains every element on the given stack trace. The element present at the
    index 0 represents the starting on top of the given call stack while the method
    present at the bottom of a call stack will be represented by last element that
    is present in the array. |


    | 6 | public Throwable fillInStackTrace()With this method, the stack trace will
    be filled with this Throwable object with the current stack trace. With this previous
