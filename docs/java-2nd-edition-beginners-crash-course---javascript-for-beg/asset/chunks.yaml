    *   System.out.println( helloString );\n\n*   }\n\n*   }\n\nExecuting this code\
    \ would give this result:\n\n*   hello.\n\nBe aware that the String class is immutable.\
    \ This means that, once you have created it, you cannot change a String object.\
    \ If you find that you need to modify character strings, you would need to use\
    \ the classes, String Buffer and string Builder.\n\n### String Length\n\nWhen\
    \ you use a method to get information about an object, that method is called an\
