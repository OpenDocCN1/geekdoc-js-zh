    ### The throw/throws Keywords


    If the given method leaves the exception doesn''t handle the given checked exception,
    it must be declared with the keyword throws. This keyword will be used at the
    end of a given method''s signature.


    Using the throw keyword, newly instantiated exceptions or exceptions that were
    just caught can be handled. There is a difference between the throw and throws
    keywords.


    In the following example RemoteException will be thrown by the method.


    import java.io.*;


    public class className


    {


     public void deposit(double amount) throws RemoteException


     {


        // Method implementation


        throw new RemoteException();


     }


     //Remainder of class definition


    }


    A method can declare that it throws more than one exception, in which case the
    exceptions are declared in a list separated by commas. For example, the following
    method declares that it throws a RemoteException and an InsufficientFundsException:


    import java.io.*;


    public class className


    {


     public void withdraw(double amount) throws RemoteException,


                                InsufficientFundsException


     {


         // Method implementation


     }


     //Remainder of class definition


    }


    ### The finally Keyword


    The finally keyword is used to create a block of code that follows a try block.
    A finally block of code always executes, whether or not an exception has occurred.


    Using a finally block allows you to run any cleanup-type statements that you want
    to execute, no matter what happens in the protected code.


    A finally block appears at the end of the catch blocks and has the following syntax:


    try


    {


     //Protected code


    }catch(ExceptionType1 e1)


    {


     //Catch block


    }catch(ExceptionType2 e2)


    {


     //Catch block


    }catch(ExceptionType3 e3)


    {


     //Catch block


    }finally


    {


     //The finally block always executes.


    }


    Example:


    public class ExcepTest{


     public static void main(String args[]){


        int a[] = new int[2];


        try{


           System.out.println("Access element three :" + a[3]);


        }catch(ArrayIndexOutOfBoundsException e){


           System.out.println("Exception thrown  :" + e);


        }


        finally{


           a[0] = 6;


           System.out.println("First element value: " +a[0]);


           System.out.println("The finally statement is executed");


        }


     }


    }


    This would produce the following result:


    Exception thrown  :java.lang.ArrayIndexOutOfBoundsException: 3


    First element value: 6


    The finally statement is executed


    Note the following:


    ·        A catch clause cannot exist without a try statement.


    ·        It is not compulsory to have finally clauses whenever a try/catch block
    is present.


    ·        The try block cannot be present without either catch clause or finally
    clause.


    ·        Any code cannot be present in between the try, catch, finally blocks.


    Here are some more examples on exception handling.


    Example 1: Try- Catch blocks


    package com.myjava.exceptions;


    public class MyExceptionHandle {


      public static void main(String a[]){


          try{


              for(int i=5;i>=0;i--){


                  System.out.println(10/i);


              }


          } catch(Exception ex){


              System.out.println("Exception Message: "+ex.getMessage());


              ex.printStackTrace();


          }


          System.out.println("After for loop...");


      }


    }


    Output


    2


    2


    3


    5


    10


    Exception Message: / by zero


    java.lang.ArithmeticException: / by zero


          at com.myjava.exceptions.MyExceptionHandle.main(MyExceptionHandle.java:12)


    After for loop…


    Example 2: Throws Clause


    package com.myjava.exceptions;


    public class MyThrowsClause {


      public static void main(String a[]){


          MyThrowsClause mytc = new MyThrowsClause();


          try{


              for(int i=0; i<5; i++){


                  mytc.getJunk();


                  System.out.println(i);


              }


          } catch (InterruptedException iex){


              iex.printStackTrace();


          }


      }


      public void getJunk() throws InterruptedException {


          Thread.sleep(1000);


      }


    }


    Example 3: Throw clause


    package com.myjava.exceptions;


    public class MyExplicitThrow {


      public static void main(String a[]){


          try{


              MyExplicitThrow met = new MyExplicitThrow();


              System.out.println("length of DUKE is "+met.getStringSize("JUNK"));


              System.out.println("length of DUCATI is "+met.getStringSize("WRONG"));


              System.out.println("length of null string is "+met.getStringSize(null));


          } catch (Exception ex){


              System.out.println("Exception message: "+ex.getMessage());


          }


      }


      public int getStringSize(String str) throws Exception{


          if(str == null){


              throw new Exception("String input is null");


          }


          return str.length();


      }


    }


    Output:


    length of DUKE is 4


    length of DUCATI is 6


    Exception message: String input is null


    ## User-defined Exceptions


    You can create your own exceptions in Java. Keep the following points in mind
    when writing your own exception classes:


    ·        All exceptions must be a child of Throwable.


    ·        If you want to write a checked exception that is automatically enforced
    by the Handle or Declare Rule, you need to extend the Exception class.


    ·        If you want to write a runtime exception, you need to extend the RuntimeException
    class.


    We can define our own Exception class as below:


    class MyException extends Exception{


    }


    You just need to extend the Exception class to create your own Exception class.
    These are considered to be checked exceptions. The following InsufficientFundsException
    class is a user-defined exception that extends the Exception class, making it
    a checked exception. An exception class is like any other class, containing useful
    fields and methods.


    Example:


    // File Name InsufficientFundsException.java


    import java.io.*;


    public class InsufficientFundsException extends Exception


    {


     private double amount;


     public InsufficientFundsException(double amount)


     {


        this.amount = amount;


     }


     public double getAmount()


     {


        return amount;


     }


    }


    To demonstrate using our user-defined exception, the following CheckingAccount
    class contains a withdraw() method that throws an InsufficientFundsException.


    // File Name CheckingAccount.java


    import java.io.*;


    public class CheckingAccount


    {


     private double balance;


     private int number;


     public CheckingAccount(int number)


     {


        this.number = number;


     }


     public void deposit(double amount)


     {


        balance += amount;


     }


     public void withdraw(double amount) throws


                                InsufficientFundsException


     {


        if(amount <= balance)


        {


           balance -= amount;


        }


        else


        {


           double needs = amount - balance;


           throw new InsufficientFundsException(needs);


        }


     }


     public double getBalance()


     {


        return balance;


     }


     public int getNumber()


     {


        return number;


     }


    }


    In the following program BankDemo, the deposit() and withdraw() methods Will be
    invoked. They belong to the CheckingAccount.


    // File Name BankDemo.java


    public class BankDemo


    {


     public static void main(String [] args)


     {


        CheckingAccount c = new CheckingAccount(101);


        System.out.println("Depositing $500...");


        c.deposit(500.00);


        try


        {


           System.out.println("\nWithdrawing $100...");


           c.withdraw(100.00);


           System.out.println("\nWithdrawing $600...");


           c.withdraw(600.00);


        }catch(InsufficientFundsException e)


        {


           System.out.println("Sorry, but you are short $"


                                    + e.getAmount());


           e.printStackTrace();


        }


      }


