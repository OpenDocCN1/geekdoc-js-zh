- fmt: "\n`GregorianCalendar` is known as a concrete implementation of a class that\
    \ implements the familiar Gregorian calendar. Using the `getInstance()` method\
    \ in the `Calendar` class would return the `GregorianCalendar`, initialized with\
    \ the date and time in the time zone and default locale. There are two fields\
    \ defined in `GregorianCalendar` – `AD` and `BC`. These are representative of\
    \ the eras that are defined by the `GregorianCalendar`. There are a number of\
    \ constructs that are supported by `GregorianCalendar` objects:\n\n* `GregorianCalendar()`\
    \ – Constructs a Gregoriancalendar that uses the current time and the default\
    \ locale in the default time zone\n* `GregorianCalendar(int year, int month, int\
    \ date)` – Uses a specified date with the default locales and time zone\n* `GregorianCalendar(int\
    \ year, int month, int date, int hour, int minute)` – Does the same as above\n\
    * `GregorianCalendar(int year, int month, int date, int hour, int minute, int\
    \ second)` – Does the same as above\n* `GregorianCalendar(Locale aLocale)` – Uses\
    \ the current time with a specified locale in the default time zone\n* `GregorianCalendar(TimeZone\
    \ zone)` – Uses the current time in a specified time zone and the default locale\n\
    * `GregorianCalendar(TimeZone zone, Locale aLocale)` – Uses the current time in\
    \ a specified time zone and the specified locale\n\nBelow is a list of some of\
    \ the more useful support methods that the `GregorianCalendar` class provides:\n\
    \n* `void add(int field, int amount)` – Will add the specified time to the specified\
    \ field, using the rules of the calendar\n* `protected void computeFields()` –\
    \ Will convert UTC from milliseconds to time field values\n* `protected void computeTime()`\
    \ – Will override the `Calendar` and convert UTC from time field values to milliseconds\n\
    * `boolean equals(Object obj)` – Will make comparisons between the `GregorianCalendar`\
    \ and a specified object reference\n* `int get(int field)` – Will obtain the value\
    \ for a specified time field\n* `int getActualMaximum(int field)` – Will return\
    \ the maximum value possible for this field, going on the specified date\n* `int\
    \ getActualMinimum(int field)` – Will return the minimum value possible for the\
    \ filed using the current date\n* `int getGreatestMinimum(int field)` – Will return\
    \ the highest minimum value for the specified field if varies\n* `Date getGregorianChange()`\
    \ – Will get the `GregorianCalendar` to change date\n* `int getLeastMaximum(int\
    \ field)` – Will return the lowest of the maxmum values for the specified field\
    \ if varies\n* `int getMaximum(int field)` – Will return the maximum possible\
    \ value for the specified field\n* `Date getTime()` – Will get the current time\
    \ for the calendar\n* `long getTimeInMillis()` – Will return the current time\
    \ on the calendar as a long\n* `TimeZone getTimeZone()` – Will return the time\
    \ zone\n* `int getMinimum(int field)` – Will return the minimum value for a specified\
    \ field\n* `int hashCode()` – Will override the hash code\n* `boolean isLeapYear(int\
    \ year)` – Will determine if the specified year is a leap year\n* `void roll(int\
    \ field, boolean up)` – Will add or subtract a single time unit on the specified\
    \ field without making changes to larger fields\n* `void set(int field, int value)`\
    \ – Wil set the time field with the specified value\n* `void set(int year, int\
    \ month, int date)` – Will set the values for the year, month and date fields\n\
    * `void set(int year, int month, int date, int hour, int minute)` – Will set the\
    \ value for the year, month, date, hours and minutes fields\n* `void set(int year,\
    \ int month, int date, int hour, int minute, int second)` – Will set the values\
    \ for the year, month, date, hours, minutes and seconds fields\n* `void setGregorianChange(Date\
    \ date)` – Will set the `GregorianCalendar` to change date\n* `void setTime(Date\
    \ date)` – Will set the current time on the `Calendar` with the specified date\n\
    * `void setTimeInMillis(long millis)` – Will set the current time on the `Calendar`\
    \ from the specified long value\n* `void setTimeZone(TimeZone value)` – Will set\
    \ the time zone with the specified time zone value\n* `String toString()` – Will\
    \ return a string representation of the `Calendar`\n\nHere is the list of few\
    \ useful support methods provided by `GregorianCalendar` class:\n\n### Example\n\
    \n```java\nimport java.util.*;\n\npublic class GregorianCalendarDemo {\n    public\
    \ static void main(String args[]) {\n        String months[] = {\n           \
    \ \"Jan\", \"Feb\", \"Mar\", \"Apr\",\n            \"May\", \"Jun\", \"Jul\",\
    \ \"Aug\",\n            \"Sep\", \"Oct\", \"Nov\", \"Dec\"};\n        int year;\n\
    \        // Create a Gregorian calendar initialized\n        // with the current\
    \ date and time in the\n        // default locale and timezone.\n        GregorianCalendar\
    \ gcalendar = new GregorianCalendar();\n        // Display current time and date\
    \ information.\n        System.out.print(\"Date: \");\n        System.out.print(months[gcalendar.get(Calendar.MONTH)]);\n\
    \        System.out.print(\" \" + gcalendar.get(Calendar.DATE) + \" \");\n   \
    \     System.out.println(year = gcalendar.get(Calendar.YEAR));\n        System.out.print(\"\
    Time: \");\n        System.out.print(gcalendar.get(Calendar.HOUR) + \":\");\n\
    \        System.out.print(gcalendar.get(Calendar.MINUTE) + \":\");\n        System.out.println(gcalendar.get(Calendar.SECOND));\n\
    \        // Test if the current year is a leap year\n        if(gcalendar.isLeapYear(year))\
    \ {\n            System.out.println(\"The current year is a leap year\");\n  \
    \      } else {\n            System.out.println(\"The current year is not a leap\
    \ year\");\n        }\n    }\n}\n```\n\nIf you ran this program, it would produce\
    \ this result:\n\n* Date: Apr 22 2009\n* Time: 11:25:27\n* The current year is\
    \ not a leap year\n\n# Conclusion\n\nWith this, we have come to the end of this\
    \ handbook on learning Java. I sincerely hope you enjoyed this session and were\
    \ able to learn and understand the programming. As you can see, it looks complicated\
    \ to the untrained eye and the unpracticed mind. However, once you start and once\
    \ you understand the basics, you will find yourself programming the days away!\n\
    \nI thank you for choosing this book. Happy learning!\n"
