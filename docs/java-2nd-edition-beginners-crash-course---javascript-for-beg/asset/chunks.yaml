  trans: "\n\n在本示例中，此行将告诉编译器加载存在 `java_installation/java/io` 目录中的类。\n\n```java\nimport\
    \ java.io.*;\n```\n\n# 一个简单的案例研究\n\n在这里，我们将创建两个类 `Employee` 和 `EmployeeTest` 来进行案例研究。\n\
    \n*   打开记事本并编写下面提供的代码。你应该记住这是 `Employee` 类，并且它是一个公共类（public class）。\n*   将此文件保存为\
    \ `Employee.java`。\n\n`Employee` 类中存在四个实例变量，分别为 `name`、`age`、`designation` 和 `salary`。该类\
    \ true 一个显式定义的构造函数。该构造函数接受一个参数。\n\n示例：\n\n```java\nimport java.io.*;\n\npublic\
    \ class Employee{\n\n  String name;\n\n  int age;\n\n  String designation;\n\n\
    \  double salary;\n\n  // 这是 Employee 类的构造函数\n\n  public Employee(String name){\n\
    \    this.name = name;\n  }\n\n  /* 将 Employee 的年龄赋值给变量 age. */\n\n  public void\
    \ empAge(int empAge){\n    age =  empAge;\n  }\n\n  /* 将职位赋值给变量 designation. */\n\
    \  public void empDesignation(String empDesig){\n    designation = empDesig;\n\
    \  }\n\n  /* 将工资赋值给变量 salary. */\n  public void empSalary(double empSalary){\n\
    \    salary = empSalary;\n  }\n\n  /* 打印员工详情 */\n  public void printEmployee(){\n\
    \    System.out.println(\"Name:\"+ name );\n    System.out.println(\"Age:\" +\
    \ age );\n    System.out.println(\"Designation:\" + designation );\n    System.out.println(\"\
    Salary:\" + salary);\n  }\n\n}\n```\n\n如之前所述，程序的运行过程只有在 `main()` 方法之后才开始。因此，为了运行这个\
    \ `Employee` 类，应该有一个 `main` 方法以及几个对象。对于这些任务，将创建一个独立的类。\n\n下面是 `EmployeeTest` 类，它创建了两个属于\
    \ `Employee` 类的实例。这些对象调用每个对象的方法，并为所有变量赋值。\n\n将给定的代码保存到 `EmployeeTest.java` 文件中。\n\
    \n```java\nimport java.io.*;\n\npublic class EmployeeTest{\n\n  public static\
    \ void main(String args[]){\n    /* 使用构造函数创建两个对象 */\n    Employee empOne = new\
    \ Employee(\"James Smith\");\n    Employee empTwo = new Employee(\"Mary Anne\"\
    );\n\n    // 调用每个创建的对象的方法\n    empOne.empAge(26);\n    empOne.empDesignation(\"\
    Senior Software Engineer\");\n    empOne.empSalary(1000);\n    empOne.printEmployee();\n\
    \n    empTwo.empAge(21);\n    empTwo.empDesignation(\"Software Engineer\");\n\
    \    empTwo.empSalary(500);\n    empTwo.printEmployee();\n  }\n\n}\n```\n\n编译这两个类并运行\
    \ `EmployeeTest`，它将产生以下输出。\n\n```bash\nC :> javac Employee.java\nC :> vi EmployeeTest.java\n\
    C :> javac EmployeeTest.java\nC :> java EmployeeTest\nName:James Smith\nAge:26\n\
    Designation:Senior Software Engineer\nSalary:1000.0\nName:Mary Anne\nAge:21\n\
    Designation:Software Engineer\nSalary:500.0\n```\n\n# 第 6 章：Java 中的数据类型\n\n变量可以定义为用于存储值的内存位置的结果。当你创建一个变量时，你实际上是在系统上预留了内存空间。\n\
    \n操作系统将根据变量的数据类型分配内存。然后操作系统将决定在该预留的内存中存储什么。不同的数据类型可以分配给变量，允许你在这些预留的空间或变量中存储字符、整数。\n\
    \n在 Java 中，有两种数据类型可用。它们是：\n\n*   基本数据类型（Primitive Data Types）\n*   引用/对象数据类型（Reference/Object\
    \ Data Types）\n\n## 基本数据类型\n\nJava 支持八种基本数据类型。这些基本数据类型由关键字命名并已经预先定义。现在我们来看 Java\
    \ 中的这八种基本数据类型。\n\n### byte:\n\n*   `Byte` 数据类型是 8 位有符号补码整数。\n*   `byte` 的最小值为\
    \ `-128` (`-2⁷`)。\n*   `byte` 的最大值为 `127`（包含在内）（(`2⁷ -1`）。\n*   `byte` 的默认值为 `0`。\n\
    *   使用 `byte` 数据类型，可以为大数组节省空间，因为它是 `int` 的四分之一。\n*   示例：`byte x=20, byte y=-4`。\n\
    \n### short:\n\n*   `Short` 数据类型是 16 位有符号补码整数。\n*   `short` 可以存储的最小值为 `-32768`\
    \ (`-2¹⁵`)。\n*   `short` 可以存储的最大值为 `32767`（包含在内）（`2¹⁵ -1`）。\n*   `short` 数据类型的大小是\
    \ `int` 的一半，是 `byte` 的两倍。\n*   `short` 数据类型也用于节内存内存。\n*   `short` 的默认值为 `0`。\n\
    *   示例：`short p=15000, short q=-2000`。\n\n### int:\n\n*   `Int` 数据类型是 32 位有符号补码整数。\n\
    *   `int` 的最小值为 `-2147483648` (`-2³¹`）。\n*   `int` 的最大值为 `2147483647`（包含在内）（`2³¹\
    \ -1`）。\n*   `int` 的默认值为 `0`。\n*   使用 `int` 数据类型，可以在大数组中节省空间。\n*   示例：`int x=20,\
    \ int y=-4`。\n\n### long:\n\n*   `Long` 数据类型是 64 位有符号补码整数。\n*   `long` 的最小值为 `-9223372036854775808`\
    \ (`-2⁶³`)。\n*   `long` 的最大值为 `9223372036854775807`（包含在内）（`2⁶³ -1`）。\n*   `long`\
    \ 的默认值为 `0`。\n*   示例：`long x=20, long y=-4`。\n\n### float:\n\n*   `Float` 数据类型是\
    \ 32 位单精度 IEEE 754 浮点数。\n*   `float` 的最小值为 `1.4E-45`。\n*   `float` 的最大值为 `3.4E38`。\n\
    *   `float` 的默认值为 `0.0f`。\n*   示例：`float x=20.0f, float y=-4.0f`。\n\n### double:\n\
    \n*   `Double` 数据类型是 64 位双精度 IEEE 754 浮点数。\n*   `double` 的最小值为 `4.9E-324`。\n*\
    \   `double` 的最大值为 `1.8E308`。\n*   `double` 的默认值为 `0.0d`。\n*   示例：`double x=20.0d,\
    \ double y=-4.0d`。\n\n### boolean:\n\n*   `boolean` 数据类型表示一个位的信息。\n*   `boolean`\
    \ 数据类型只有两个值：true 或 false。\n*   该数据类型的默认值为 `false`。\n*   示例：`boolean one=false`。\n\
    \n### char:\n\n*   `char` 数据类型是单个 16 位 Unicode 字符。\n*   `char` 可以存储的最小值为 `\\u0000`（或\
    \ 0）。\n*   `char` 可以存储的最大值为 `\\uffff`（或 65535）。\n*   `char` 的默认值为 `'\\u0000'`。\n\
    *   示例：`char letterA='A'`。\n\n## 引用数据类型\n\n使用 Java 类的构造函数可以创建引用变量。\n\n*   引用变量用于访问对象。一旦声明了数据类型，就无法更改。例如：`Vehicle`、`Student`\
    \ 等。\n*   类对象和不同数组变量都是不同的数据类型。\n*   任何给定的引用变量的默认值为 `null`。\n*   任何声明的兼容对象都可以使用引用变量进行引用。\n\
    *   示例：`Vehicle vehicle=new Vehicle(\"hellcat\")`。\n\n"
- fmt: "\nThe data types `byte`, `short`, `int` and `long` can be expressed in decimal(base\
    \ 10), hexadecimal(base 16) or octal(base 8) number systems also.\n\nWe use `0`\
    \ as prefix for indicating an octal and `0x` for expressing the value in hexadecimal\
    \ when these number systems are used for Literals. Here is an example.\n\n```\n\
    int decimal = 100;\nint octal = 0144;\nint hexa = 0x64;\n```\n\nThe string literals\
    \ in Java are specified just like they are specified in other programming languages.\
    \ This is done by enclosing a set of characters inside a pair of double quotes.\
    \ Here are some examples on string Literals.\n\n```\n\"Hello World\"\n\"two\\\
    nlines\"\n\"\\\"This is in quotes\\\"\"\n```\n\nOnly Unicode characters can be\
    \ given to the string and `char` data types. For example:\n\n```java\nchar a =\
    \ '\\u0001';\nString a = \"\\u0001\";\n```\n\nJava also supports a few special\
    \ escape sequences for the `char` and string Literals. They are:\n\n| Notation\
    \ | Character represented |\n| :--- | :--- |\n| `\\n` | Newline (0x0a) |\n| `\\\
    r` | Carriage return (0x0d) |\n| `\\f` | Formfeed (0x0c) |\n| `\\b` | Backspace\
    \ (0x08) |\n| `\\s` | Space (0x20) |\n| `\\t` | tab |\n| `\\\"` | Double quote\
    \ |\n| `\\'` | Single quote |\n| `\\\\` | backslash |\n| `\\ddd` | Octal character\
    \ (ddd) |\n| `\\uxxxx` | Hexadecimal UNICODE character (xxxx) |\n\n# Chapter 7:\
    \ Variables\n\nWhen a variable is declared, it provides the user with a named\
    \ storage that the programs can later manipulate. In Java, every variable has\
    \ a specific type, which in turn determines the layout and size of that variable's\
    \ memory, the operations that can be performed on that variable and the maximum\
    \ and minimum values that can be stored within it.\n\nAlways remember that you\
    \ should declare the variables before using them. The basic variable declaration\
    \ form is given below.\n\n`data type variable [ = value][, variable [= value]\
    \ ...] ;`\n\nIn the example given above, the `data type` is the Java's data type\
    \ and the name of the variable is `variable`. If you wish to declare multiple\
    \ variables of the same data type, a comma ( `,` ) can be used to separate the\
    \ list.\n\nHere are a few examples on variable declaration and variable initialization.\n\
    \n```java\nint a, b, c;      // Declares three ints, a, b, and c.\nint a = 10,\
    \ b = 10;  // Example of initialization\nbyte B = 22;        // initializes a\
    \ byte type variable B.\ndouble pi = 3.14159; // declares and assigns a value\
    \ of PI.\nchar a = 'a';       // the char variable a is initialized with value\
    \ 'a'\n```\n\nIn this topic, we will look at the various variables that are available\
    \ in Java. In Java, there are three different types of variables.\n\n* Local variables\n\
    * Instance variables\n* Class/static variables\n\n## Local variables\n\n* Local\
    \ variables are the variables that are declared inside blocks, methods, or constructors.\n\
    * Local variables are only available as long as their block, method or constructor\
    \ is present. Once the block, method or constructor is exited, the local variable\
    \ will be destroyed.\n* We cannot use access modifier on local variables.\n* The\
    \ local variables can only be seen inside the block or method or constructor in\
    \ which they are declared.\n* Internally, the implementation of local variables\
    \ will be done at stack level.\n* As there are no default values that can be given\
    \ for local variables, a value should be assigned by declaring them before using\
    \ them.\n\nHere is an example in which we use local variables.\n\n**Example:**\n\
    Here, `age` is a local variable. This is defined inside `pupAge()` method and\
    \ its scope is limited to this method only.\n\n```java\npublic class Test{\n \
    \ public void pupAge(){\n    int age = 0;\n    age = age + 7;\n    System.out.println(\"\
    Puppy age is : \" + age);\n  }\n  public static void main(String args[]){\n  \
    \  Test test = new Test();\n    test.pupAge();\n  }\n}\n```\n\nThe above code\
    \ will produce the following output.\n`Puppy age is: 7`\n\n**Example:**\nIn the\
    \ following example, we are using the `age` variable without initializing it.\
    \ So during compilation this will give an error.\n\n```java\npublic class Test{\n\
    \  public void pupAge(){\n    int age;\n    age = age + 7;\n    System.out.println(\"\
    Puppy age is : \" + age);\n  }\n  public static void main(String args[]){\n  \
    \  Test test = new Test();\n    test.pupAge();\n  }\n}\n```\nThe following error\
    \ will be produced:\n`Test.java:4: variable age might not have been initialized`\n\
    \n## Instance variables\n\n* Instance variables are variables that are declared\
    \ inside a class but outside methods.\n* Any number of objects can be created\
    \ from an instance variable but there will be only one instance variable per object.\n\
    * Instance variables are stored in the heap.\n* When an object is created, instance\
    \ variables are allocated.\n* The visibility of instance variables depends on\
    \ access modifiers.\n* The default value for instance variables is 0, false for\
    \ booleans and NULL for object references.\n\nHere is an example.\n\n**Example:**\n\
    \n```java\nimport java.io.*;\n\npublic class Employee{\n  public String name;\n\
    \  private double salary;\n\n  public Employee(String empName){\n    name = empName;\n\
    \  }\n\n  public void setSalary(double empSal){\n    salary = empSal;\n  }\n\n\
    \  public void printEmp(){\n    System.out.println(\"name : \" + name);\n    System.out.println(\"\
    salary :\" + salary);\n  }\n\n  public static void main(String args[]){\n    Employee\
    \ empOne = new Employee(\"Ransika\");\n    empOne.setSalary(1000);\n    empOne.printEmp();\n\
    \  }\n}\n```\n\nThe program will produce the following output.\n`name : Ransika`\n\
    `salary :1000.0`\n\n## Class/static variables\n\n* Class variables are also called\
    \ as static variables. These variables are declared using the `static` keyword\
    \ inside a class but out of a block, constructor or method.\n* There is only one\
    \ class variable per class, regardless of how many objects are created.\n* Class\
    \ variables are stored in the static memory.\n* Class variables are created during\
    \ the starting up a program and they will be destroyed when the program ends.\n\
    * Class variables are mostly used for being declared as constants. A constant\
    \ is a variable that is declared as `static`, `public`/`private` and `final`.\n\
    * The default value for class variables is 0, false for Booleans and NULL for\
    \ object references.\n"
  raw: 'The data types byte, short, int and long can be expressed in decimal(base
    10), hexadecimal(base 16) or octal(base 8) number systems also.


    We use 0 as prefix for indicating an octal and ox for expressing the value in
    hexadecimal when these number systems are used for Literals. Here is an example.


    int decimal = 100;


    int octal = 0144;


    int hexa =  0x64;


    The string literals in Java are specified just like they are specified in other
    programming languages. This is done by enclosing a set of characters inside a
    pair of double quotes. Here are some examples on string Literals.


    "Hello World"


    "two\nlines"


    "\"This is in quotes\""


    Only Unicode characters can be given to the string and char data types. For example:


    char a = ''\u0001'';


    String a = "\u0001";


    Java also supports a few special escape sequences for the char and string Literals.
    They are:


    | Notation | Character represented |


    | \n | Newline (0x0a) |


    | \r | Carriage return (0x0d) |


    | \f | Formfeed (0x0c) |


    | \b | Backspace (0x08) |


    | \s | Space (0x20) |


    | \t | tab |


    | \" | Double quote |


    | \'' | Single quote |


    | \\ | backslash |


    | \ddd | Octal character (ddd) |


    | \uxxxx | Hexadecimal UNICODE character (xxxx) |


    # Chapter 7: Variables


    When a variable is declared, it provides the user with a named storage that the
    programs can later manipulate. In Java, every variable has a specific type, which
    in turn determines the layout and size of that variable''s memory, the operations
    that can be performed on that variable and the maximum and minimum values that
    can be stored within it.


    Always remember that you should declare the variables before using them. The basic
    variable declaration form is given below.


    data type variable [ = value][, variable [= value] ...] ;


    In the example given above, the data  type is the Java''s data type and the name
    of the variable is variable. If you wish to declare multiple variables of the
    same data type, a comma ( , ) can be used to separate the list.


    Here are a few examples on variable declaration and variable initialization.


    int a, b, c;         // Declares three ints, a, b, and c.


    int a = 10, b = 10;  // Example of initialization


    byte B = 22;         // initializes a byte type variable B.


    double pi = 3.14159; // declares and assigns a value of PI.


    char a = ''a'';        // the char variable a iis initialized with value ''a''


    In this topic, we will look at the various variables that are available in Java.
    In Java, there are three different types of variables.


    ·        Local variables


    ·        Instance variables


    ·        Class/static variables


    ## Local variables


    ·        Local variables are the variables that are declared inside blocks, methods,
    or constructors.


    ·        Local variables are only available as long as their block, method or
    constructor is present. Once the block, method or constructor is exited, the local
    variable will be destroyed.


    ·        We cannot use access modifier is on local variables.


    ·        The local variables can only be seen inside the block or method or constructor
    in which they are declared.


    ·        Internally, the implementation of local variables will be done at stack
    level.


    ·        As there are no default values that can be given for local variables,
    a value should be assigned by declaring them before using them.


    Here is an example in which we use local variables.


    Example:


    Here, age is a local variable. This is defined inside pupAge() method and its
    scope is limited to this method only.


    public class Test{


     public void pupAge(){


        int age = 0;


        age = age + 7;


        System.out.println("Puppy age is : " + age);


     }


     public static void main(String args[]){


        Test test = new Test();


        test.pupAge();


     }


    }


    The above code will produce the following output.


    Puppy age is: 7


    Example:


    In the following example, we are using the age variable without initializing it.
    So during compilation this will give an error.


    public class Test{


     public void pupAge(){


        int age;


        age = age + 7;


        System.out.println("Puppy age is : " + age);


     }


     public static void main(String args[]){


        Test test = new Test();


        test.pupAge();


     }


    }


    The following error will be produced by the code during compile time.


    Test.java:4:variable number might not have been initialized


    age = age + 7;


           ^


    1 error


    ## Instance variables


    *   Instance variables are variables that are declared inside a class but outside
    a constructor or a method or a block.


    *   An instance variable value will be created when some space is allocated in
    the heap memory for an object.


    *   Whenever we use the new keyword for creating a new object, an instance variable
    will be created along with the object and it will be destroyed along with the
    object.


    *   The values that an instance variable hold much be different set by multiple
    methods, block or constructor. If not, The essential parts of an object''s state
    should prevail throughout the class.


    *   You can declare instance variables at class level before use or after use.


    *   Instance variables can have access modifiers.


    *   In Java, instance variables can be seen by all blocks, constructors and methods
    that are present in the class. It is advised to make the instance variables private.
    However, by using access modifiers we can give visibility for the subclasses of
    these variables.


    *   The instance variables should be defined during declaration or inside a constructor.
    If the variables are not defined, the default values of these instance variables
    will be considered. The default value for numbers is 0, false for booleans and
    NULL for object references.


    *   By calling the name of the variable in a class, you can directly access instance
    variables.


    Here is an example.


    Example:


    import java.io.*;


    public class Employee{


     // this instance variable is visible for any child class.


     public String name;


     // salary  variable is visible in Employee class only.


     private double salary;


     // The name variable is assigned in the constructor.


     public Employee (String empName){


        name = empName;


     }


     // The salary variable is assigned a value.


     public void setSalary(double empSal){


        salary = empSal;


     }


     // This method prints the employee details.


     public void printEmp(){


        System.out.println("name  : " + name );


        System.out.println("salary :" + salary);


     }


     public static void main(String args[]){


        Employee empOne = new Employee("Ransika");


        empOne.setSalary(1000);


        empOne.printEmp();


     }


    }


    The program will produce the following output.


    name  : Ransika


    salary :1000.0


    Class/static variables:


    *   Class variables are also called as static variables. These variables are declared
    by using the static keyword inside a class but out of a block, constructor or
    method.


    *   Any number of objects can be created from a class variable but there will
    only be one class variable in a class.


    *   The class variables are mostly used for being declared as constants. A constant
    is a variable that is declared as static, public/private and final. As the name
    suggests, the value of the constant variables remains the same and cannot be changed.


    *   The class/static variables are stored in the static memory. These variables
    are rarely used as public or private constants.


    *   Class variables are created during the starting up a program and they will
    be destroyed when the program ends.


    *   The visibility of class variables is similar to the instance variables. However,
    the static variables are usually declared as public so that other users of that
    class can use them.


    *   The default value for numbers is 0, false for Booleans and NULL for object
    references.


    *   Values can be assigned to the static variables only during the declaration
    or inside the constructor. If you wish to add additional values, you can assign
    them by using the special static initializer blocks.'
