    \ – Will compare this string to object\n* `equalsIgnoreCase(String anotherString)`\
    \ – Will compare one string to another but ignore case\n* `byte getBytes()` –\
    \ Will encode the string into a byte sequence, making use of the default charset\n\
    * `byte[] getBytes(String charsetName)` – Does the same as the above method\n\
    * `void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)` – Will copy\
