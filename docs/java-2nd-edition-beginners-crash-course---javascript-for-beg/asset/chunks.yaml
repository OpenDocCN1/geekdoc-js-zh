    \  }\n}\n```\n\n程序将产生以下输出。\n\nDevelopment average salary:1000\n\n# 修饰符 (Modifiers)\n\
    \n在某些情况下，你可能需要更改某些定义的含义。在这种情况下，你可以使用修饰符。修饰符本质上是用于更改定义含义的关键字。在 Java 中，有很多修饰符，包括以下两种。\n\
    \n*   [Java 访问修饰符](http://www.tutorialspoint.com/java/java_access_modifiers.htm)\n\
    *   [非访问修饰符](http://www.tutorialspoint.com/java/java_nonaccess_modifiers.htm)\n\
    \n要使用修饰符，你应该在变量、方法或类的定义中包含关键字。修饰符应该像下面示例所示放在语句的开头。它们以*斜体*形式给出。\n\n```java\npublic\
    \ class className {\n  // ...\n}\n\nprivate boolean myFlag;\n\nstatic final double\
    \ weeks = 9.5;\n\nprotected static final int BOXWIDTH = 42;\n\npublic static void\
    \ main(String[] arguments) {\n  // 方法体\n}\n```\n\n## 访问控制修饰符 (Access Control Modifiers)\n\
    \n为了设置构造函数、变量、类和方法的访问级别，Java 为用户提供了一组访问修饰符。Java 中有四种访问级别。它们是：\n\n*   对包可见（默认）。不需要修饰符。\n\
    *   仅对类可见（`private`）。\n*   对所有人可见（`public`）。\n*   对包及所有子类可见（`protected`）。\n\n\
    ## 非访问修饰符 (Non Access Modifiers)\n\n在 Java 中，有很多非访问修饰符。\n\n*   `static` 修饰符用于创建类变量和方法。\n\
    *   为了对变量、类和方法进行最终化，我们使用 `final` 修饰符。\n*   你可以通过 `abstract` 修饰符创建抽象类和抽象方法。\n*\
    \   为了处理线程，我们使用 `volatile` 和 `synchronized` 修饰符。\n\n# 第 8 章：运算符 (Operators)\n\n\
    在编程过程中，你可能不断需要操作变量，为此，Java 为用户提供了一组运算符。所有运算符可以分为以下几组：\n\n*   算术运算符\n*   关系运算符\n\
    *   位运算符\n*   逻辑运算符\n*   赋值运算符\n\n## 算术运算符 (The Arithmetic Operators)\n\n算术运算符用于处理数学表达式。所有的算术运算符都列在下表中。\n\
    \n在这里，我们假设变量 `A` 的值为 5，变量 `B` 的值为 10。那么以下表达式将产生结果：\n\n| 运算符 | 说明 | 示例 |\n| :---\
    \ | :--- | :--- |\n| `+` | 加法 - 将运算符两边的值相加 | `A + B` 得到 15 |\n| `-` | 减法 - 从左操作数减去右操作数\
    \ | `A - B` 得到 -5 |\n| `*` | 乘法 - 将运算符两边的值相乘 | `A * B` 得到 50 |\n| `/` | 除法 - 将左操作数除以右操作数\
    \ | `B / A` 得到 2 |\n| `%` | 取模 - 将左操作数除以右操作数并返回余数 | `B % A` 得到 0 |\n| `++` | 增增\
    \ - 操作数的值加 1 | `B++` 得到 11 |\n| `--` | 递减 - 操作数的值减 1 | `B--` 得到 9 |\n\n## 关系运算符\
    \ (The Relational Operators)\n\nJava 支持以下关系运算符。\n\n假设变量 `A` 的值为 1，变量 `B` 的值为 2，那么：\n\
    \n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `==` | 该运算符将比较两个操作数并检查它们是否相等。如果相等则返回\
    \ true。 | `(A == B)` 为 false。 |\n| `!=` | 该运算符将比较两个操作数并检查它们是否相等。如果不相等则返回 true。\
    \ | `(A != B)` 为 true。 |\n| `>` | 该运算符将比较两个操作数并检查左操作数是否大于右操作数，如果满足条件，则返回 true。\
    \ | `(A > B)` 为 false。 |\n| `<` | 该运算符将比较两个操作数并检查左操作数是否小于右操作数，如果满足条件，则返回 true。\
    \ | `(A < B)` 为 true。 |\n| `>=` | 该运算符在比较左操作数时检查它是否大于等于右操作数。如果满足条件，则返回 true。 |\
    \ `(A >= B)` 为 false。 |\n| `<=` | 该运算符在比较左操作数时检查它是否小于等于右操作数。如果满足条件，则返回 true。 |\
    \ `(A <= B)` 为 false。 |\n\n## 位运算符 (The Bitwise Operators)\n\n位运算符对位执行操作。它们可以作用于\
    \ `byte`、`short`、`int`、`long` 和 `char` 类型。假设 `a=5`，`b=3`。\n\n| 运算符 | 说明 | 示例 |\n\
    | :--- | :--- | :--- |\n| `&` | 二位与运算符 - 如果两个操作数都存在该位则复制位 | `a & b` 得到 1 |\n|\
    \ `\\|` | 二位或运算符 - 如果任意一个操作数存在该位则复制位 | `a \\| b` 得到 7 |\n| `^` | 二位异异运算符 - 如果仅一个操作数存在该位则复制位\
    \ | `a ^ b` 得到 6 |\n| `~` | 二位取反运算符 - 一元运算符，效果是翻转位 | `~a` 得到 -6 |\n| `<<` | 二位左移运算符\
    \ - 左操作数向左移动指定的位数 | `a << 2` 得到 20 |\n| `>>` | 二位右移运算符 - 左操作数向右移动指定的位数 | `a >>\
    \ 2` 得到 1 |\n| `>>>` | 二位无符号右移运算符 - 左操作数向右移动指定的位数，且移位处补零 | `a >>> 2` 得到 1 |\n\n\
    ## 逻辑运算符 (The Logical Operators)\n\n这里是 Java 中所有的逻辑运算符列表。假设 `A` 和 `B` 是布尔变量。A\
    \ 为 true，B 为 false。那么：\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `&&` |\
    \ 逻辑与运算符 - 如果两个操作数都为非零值则返回 true | `(A && B)` 为 false。 |\n| `\\|` | 逻辑或运算符 - 如果任意一个操作数为为非零值则返回\
    \ true | `(A \\| B)` 为 true。 |\n| `!` | 逻辑非运算符 - 用于反转所用操作数的当前逻辑状态。如果条件返回 true，逻辑非将将其变为\
    \ false | `!(A && B)` 为 true。 |\n\n## 赋值运算符 (The Assignment Operators)\n\nJava\
    \ 支持的所有赋值运算符如表所示。\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `=` | 简单的赋值运算符，将右操作数的值赋值给左操作数。\
    \ | `C = A + B` 将 A + B 的值赋值给 C |\n| `+=` | 加赋值运算符 - 该运算符将两个操作数相加并赋值给左操作数。 | `C\
    \ += A` 等同于 `C = C + A` |\n| `-=` | 减赋值运算符 - 该运算符从左操作数中减去右操作数并赋值给左操作数。 | `C -=\
    \ A` 等同于 `C = C - A` |\n\n"
- fmt: "\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `*=` | This\
    \ is the multiply AND operand. This will multiply both the operands and the result\
    \ obtained will be assigned to the left operand. | `C *= A` is equivalent to `C\
    \ = C * A` |\n| `/=` | This is the divide AND assignment operator. This operator\
    \ divides the left operand with the right. The obtained result will then be assigned\
    \ to the left operand. | `C /= A` is equivalent to `C = C / A` |\n| `%=` | This\
    \ is the modulus AND operator. This operator takes the modulus of both the operands\
    \ and assigns the result to the left operand. | `C %= A` is equivalent to `C =\
    \ C % A` |\n| `<<=` | Left shift AND assignment operator | `C <<= 2` is same as\
    \ `C = C << 2` |\n| `>>=` | Right shift AND assignment operator | `C >>= 2` is\
    \ same as `C = C >> 2` |\n| `&=` | Bitwise AND assignment operator | `C &= 2`\
    \ is same as `C = C & 2` |\n| `^=` | bitwise exclusive OR and assignment operator\
    \ | `C ^= 2` is same as `C = C ^ 2` |\n| `|=` | bitwise inclusive OR and assignment\
    \ operator | `C |= 2` is same as `C = C | 2` |\n\n### Precedence of Java Operators\n\
    \nThe grouping of terms in a given expression will be determined by operator precedence.\
    \ Some operators will have higher precedence over other operators. For example,\
    \ the multiplication operator will always have a higher precedence when compared\
    \ to the addition operator. The operators which have higher precedence will be\
    \ executed first.\n\nThe lists of all the operators arranged in accordance to\
    \ their precedence are given below. The operators that have higher precedence\
    \ are placed on the top and they go down the table in decreasing order.\n\n| Category\
    \ | Operator | Associativity |\n| :--- | :--- | :--- |\n| Postfix | `() [] .`\
    \ (dot operator) | Left to right |\n| Unary | `++ - - ! ~` | Right to left |\n\
    | Multiplicative | `* / %` | Left to right |\n| Additive | `+ -` | Left to right\
    \ |\n| Shift | `>> >>> <<` | Left to right |\n| Relational | `> >= < <=` | Left\
    \ to right |\n| Equality | `== !=` | Left to right |\n| Bitwise AND | `&` | Left\
    \ to right |\n| Bitwise XOR | `^` | Left to right |\n| Bitwise OR | `|` | Left\
