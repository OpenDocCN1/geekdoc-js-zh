    import java.io.*;


    A Simple Case Study


    Here, we will create two classes Employee and EmployeeTest for case study.


    *   Open notepad and write the code given below. You should remember that this
    is the Employee class and it is a public class.


    *   Save this file with the name Employee.java.


    There are four instance variables present in the employee class namely name, age,
    designation and salary. This class has also got an explicitly defined constructor.
    This constructor takes a parameter.


    Example:


    import java.io.*;


    public class Employee{


     String name;


     int age;


     String designation;


     double salary;


     // This is the constructor of the class Employee


     public Employee(String name){


        this.name = name;


     }


     // Assign the age of the Employee  to the variable age.


     public void empAge(int empAge){


        age =  empAge;


     }


     /* Assign the designation to the variable designation.*/


     public void empDesignation(String empDesig){


        designation = empDesig;


     }


     /* Assign the salary to the variable                 salary.*/


     public void empSalary(double empSalary){


        salary = empSalary;


     }


     /* Print the Employee details */


     public void printEmployee(){


        System.out.println("Name:"+ name );


        System.out.println("Age:" + age );


        System.out.println("Designation:" + designation );


        System.out.println("Salary:" + salary);


     }


    }


    As previously mentioned, the process of the program starts only after the main()
    method. So there should be a main method and a few objects should be present for
    this Employee class to run. And for these tasks there will be a separate class
    created.


    The EmployeeTest class is given below and it creates two instances that belong
    to the Employee class. These objects invoke the methods for every object and they
    will assign values for all variables.


    Save the given code in the file EmployeeTest.java.


    import java.io.*;


    public class EmployeeTest{


     public static void main(String args[]){


        /* Create two objects using constructor */


        Employee empOne = new Employee("James Smith");


        Employee empTwo = new Employee("Mary Anne");


        // Invoking methods for each object created


        empOne.empAge(26);


        empOne.empDesignation("Senior Software Engineer");


        empOne.empSalary(1000);


        empOne.printEmployee();


        empTwo.empAge(21);


        empTwo.empDesignation("Software Engineer");


