  trans: "\n\n`byte`、`short`、`int` 和 `long` 数据类型也可以用十进制（基 10）、十六进制（基 16）或八进制（基 8）数制表示。\n\
    \n当这些数制用于字面量（Literals）时，我们使用 `0` 作为八进制的前缀，并使用 `0x` 表示十六进制值。以下是一个示例。\n\n```\nint\
    \ decimal = 100;\nint octal = 0144;\nint hexa = 0x64;\n```\n\nJava 中的字符串字面量规定方式与其他编程语言相同。这是通过在一对双引号内包含一组字符来实现的。以下是一些关于字符串字面量的示例。\n\
    \n```\n\"Hello World\"\n\"two\\nlines\"\n\"\\\"This is in quotes\\\"\"\n```\n\n\
    字符串和 `char` 数据类型只能赋入 Unicode 字符。例如：\n\n```java\nchar a = '\\u0001';\nString a\
    \ = \"\\u0001\";\n```\n\nJava 还为 `char` 和字符串字面量支持一些特殊的转义序列。它们是：\n\n| 符号 | 代表的字符\
    \ |\n| :--- | :--- |\n| `\\n` | 新行 (0x0a) |\n| `\\r` | 回车 (0x0d) |\n| `\\f` |\
    \ 进页符 (0x0c) |\n| `\\b` | 退格 (0x08) |\n| `\\s` | 空格 (0x20) |\n| `\\t` | 制表符 |\n\
    | `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n| `\\ddd` | 八进制字符 (ddd) |\n\
    | `\\uxxxx` | 十六进制 Unicode 字符 (xxxx) |\n\n# 第 7 章：变量\n\n当声明一个变量时，它为用户提供了一个命名的存储空间，程序随后可以对其操作。在\
    \ Java 中，每个变量都有特定的类型，这反过来决定了该变量内存的布局和大小、可以在该变量上执行的操作，以及可以在其中存储的最大值和最小值。\n\n始终记住，在使用变量之前应该先声明它们。基本的变量声明形式如下。\n\
    \n`data type variable [ = value][, variable [= value] ...] ;`\n\n在上面的示例中，`data\
    \ type` 是 Java 的数据类型，变量名是 `variable`。如果你想声明多个相同数据类型的变量，可以使用逗号（（`）来分隔列表。\n\n以下是几个关于变量声明和变量初始化的示例。\n\
    \n```java\nint a, b, c;      // 声明三个 int 类型：a, b 和 c。\nint a = 10, b = 10;  //\
    \ 初始化示例\nbyte B = 22;        // 初始化一个字节类型变量 B。\ndouble pi = 3.14159; // 声明并为 PI\
    \ 赋值。\nchar a = 'a';       // char 变量 a 被初始化为值 'a'\n```\n\n在本主题中，我们将查看 Java 中可用的各种变量。在\
    \ Java 中，有三种类型的变量。\n\n* 局部变量\n* 实例变量\n* 类变量/静态变量\n\n## 局部变量\n\n* 局部变量是在块、方法或构造函数内部声明的变量。\n\
    * 局部变量仅在其所属的块、方法或构造函数存在时才可用。一旦离开块、方法或构造函数，局部变量将被销毁。\n* 我们不能在局部变量上使用访问修饰符。\n* 局部变量仅在其定义的块、方法或构造函数内部可见。\n\
    * 在内部，局部变量的实现是在栈（stack）级别完成的。\n* 由于局部变量没有默认值，因此在使用它们之前应该通过声明它们来赋值。\n\n以下是一个使用局部变量的示例。\n\
    \n**示例：**\n在这里，`age` 是局部变量。它定义在 `pupAge()` 方法内部，其作用域仅限于此方法。\n\n```java\npublic\
    \ class Test{\n  public void pupAge(){\n    int age = 0;\n    age = age + 7;\n\
    \    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static void\
    \ main(String args[]){\n    Test test = new Test();\n    test.pupAge();\n  }\n\
    }\n```\n\n上述代码将产生以下输出。\n`Puppy age is: 7`\n\n**示例：**\n在接下来的示例中，我们在没有初始化的情况下使用了\
    \ `age` 变量。因此在编译期间这会产生错误。\n\n```java\npublic class Test{\n  public void pupAge(){\n\
    \    int age;\n    age = age + 7;\n    System.out.println(\"Puppy age is : \"\
    \ + age);\n  }\n  public static void main(String args[]){\n    Test test = new\
    \ Test();\n    test.pupAge();\n  }\n}\n```\n将产生以下错误：\n`Test.java:4: variable age\
    \ might not have been initialized`\n\n## 实例变量\n\n* 实例变量是在类内部但在方法外部声明的变量。\n* 可以从实例变量创建任意数量的对象，但每个对象将只有一个实例变量。\n\
    * 实例变量存储在堆（heap）中。\n* 当对象被创建时，实例变量会被分配。\n* 实例变量的可见性取决于访问修饰符。\n* 实例变量的默认值为 0，布尔类型为\
    \ false，对象引用为 NULL。\n\n以下是一个示例。\n\n**示例：**\n\n```java\nimport java.io.*;\n\npublic\
    \ class Employee{\n  public String name;\n  private double salary;\n\n  public\
    \ Employee(String empName){\n    name = empName;\n  }\n\n  public void setSalary(double\
    \ empSal){\n    salary = empSal;\n  }\n\n  public void printEmp(){\n    System.out.println(\"\
    name : \" + name);\n    System.out.println(\"salary :\" + salary);\n  }\n\n  public\
    \ static void main(String args[]){\n    Employee empOne = new Employee(\"Ransika\"\
    );\n    empOne.setSalary(1000);\n    empOne.printEmp();\n  }\n}\n```\n\n程序将产生以下输出。\n\
    `name : Ransika`\n`salary :1000.0`\n\n## 类变量/静态变量\n\n* 类变量也称为静态变量。这些变量在类内部使用 `static`\
    \ 关键字声明，但在块、构造函数或方法之外。\n* 无论创建了多少个对象，每个类都只有一个类变量。\n* 类变量存储在静态内存中。\n* 类变量在程序启动时创建，并在程序结束时被销毁。\n\
    * 类变量主要用于声明为常量。常量是声明为 `static`、`public`/`private` 和 `final` 的变量。\n* 类变量的默认值为 0，布尔类型为\
    \ false，对象引用为 NULL。\n\n"
- fmt: "\n*   By calling the static variables with their class name, you can access\
    \ them. Syntax: `ClassName.VariableName`.\n\nHere is an example using static variables.\n\
    \nExample:\n\n```java\nimport java.io.*;\n\npublic class Employee{\n\n  // salary\
    \ variable is a private static variable\n  private static double salary;\n\n \
    \ // DEPARTMENT is a constant\n  public static final String DEPARTMENT = \"Development\
    \ \";\n\n  public static void main(String args[]){\n    salary = 1000;\n    System.out.println(DEPARTMENT+\"\
    average salary:\"+salary);\n  }\n}\n```\n\nThe program will produce the following\
    \ output.\n\nDevelopment average salary:1000\n\n# Modifiers\n\nIn some situations\
    \ you might need to change the meaning of some definitions. In such cases you\
    \ can use modifiers. Modifier said nothing but keywords with which you can change\
    \ the meaning of a definition. In Java, there are a number of modifiers including\
    \ the below two.\n\n*   [Java Access Modifiers](http://www.tutorialspoint.com/java/java_access_modifiers.htm)\n\
    *   [Non Access Modifiers](http://www.tutorialspoint.com/java/java_nonaccess_modifiers.htm)\n\
    \nFor using the modifier you should include keywords within the definition of\
    \ a variable, method or class. The modifier should be placed in the beginning\
    \ of the statement as given in the examples below. They are given in italics.\n\
    \n```java\npublic class className {\n  // ...\n}\n\nprivate boolean myFlag;\n\n\
    static final double weeks = 9.5;\n\nprotected static final int BOXWIDTH = 42;\n\
    \npublic static void main(String[] arguments) {\n  // body of method\n}\n```\n\
    \n## Access Control Modifiers\n\nFor setting access levels for constructors, variables,\
    \ classes and methods, Java provides the users with a set of access modifiers.\
    \ There are four access levels in Java. They are.\n\n*   Visible to the package,\
    \ the default. No modifiers are needed.\n*   Visible to the class only (`private`).\n\
    *   Visible to the world (`public`).\n*   Visible to the package and all subclasses\
    \ (`protected`).\n\n## Non Access Modifiers\n\nIn Java there are a number of non-access\
    \ modifiers. \n\n*   The `static` modifier is used for creating class variables\
    \ and methods.\n*   For finalizing the implementation of variables, classes and\
    \ the methods we use the `final` modifier.\n*   You can create abstract classes\
    \ and abstract methods by using the `abstract` modifier.\n*   For dealing with\
    \ threads, we use the `volatile` and `synchronized` modifiers.\n\n# Chapter 8:\
    \ Operators\n\nWhile programming, you might constantly need to manipulate variables\
    \ and for that, Java provides the users with a set of operators. All the operators\
