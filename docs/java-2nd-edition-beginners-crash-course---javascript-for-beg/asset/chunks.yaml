    \ `\\f` - Puts a form feed in the text at the point marked\n* `\\'` - Puts a single\
    \ quote character in the text at the point marked\n* `\\\"` - Puts a double quote\
    \ character in the text at the point marked\n* `\\\\` - Puts a backslash character\
    \ in the text at the point marked\n\nWhen the compiler comes across an escape\
    \ sequence in a `rint` statement, it will interpret it as it is written.\n"
  raw: '### Loop Control Statements


    A loop control statement changes the execution sequence from its normal one As
    soon as the execution leaves a scope, all the automatic objects, created in the
    scope, will be destroyed. The following loop control statements are supported
    in Java:


    *   break statement – will terminate the switch or loop statement and execution
    will move to the statement that immediately follows it


    *   continue statement - makes the loop skip over the rest of the body and retest
    the condition before it starts again


    ### Enhanced for loop


    The enhanced for loop came in with Java 5 and is normally used to travel through
    a group of elements that may include arrays. The syntax used for the enhanced
    for loop is:


    *   for(declaration : expression)


    *   {


    *   //Statements


    *   }


    Declaration is a block variable that is newly declared and is of a type that is
    fully compatible with all of the elements of the array that you are accessing.
    The variable is in the for block and it will have a value that is identical to
    current element in the array.


    Expression is to evaluate to the array that you are looking to loop thorough and
    it can be either a method call that will return an array or it can be an array
    variable


    For Example


    *   public class Test {


    *   public static void main(String args[]){


    *   int [] numbers = {10, 20, 30, 40, 50};


    *   for(int x : numbers ){


    *   System.out.print( x );


    *   System.out.print(",");


    *   }


    *   System.out.print("\n");


    *   String [] names ={"James", "Larry", "Tom", "Lacy"};


    *   for( String name : names ) {


    *   System.out.print( name );


    *   System.out.print(",");


    *   }


    *   }


    *   }


    Executing this code would give you this result:


    *   10,20,30,40,50,


    *   James,Larry,Tom,Lacy


    ## Numbers Class


    In Java when we work with numbers, we normally use primitive data types, like
    double, int, byte, long, etc., for example:


    *   int i = 5000;


    *   float gpa = 13.65;


    *   byte mask = 0xaf;


    However, occasionally in the development side of things, you may come across a
    situation where you would need to make use of an object instead, to do this, Java
    has something called wrapper classes. The wrapper classes are:


    *   Integer


    *   Long


    *   Byte


    *   Double


    *   Float


    *   Short


    And they are subclasses of the main abstract number class.


    The wrapper class contains primitive data types that, respective of its name,
    i.e. the Long wrapper class would contain long data types. Converting these primitive
    types into objects is known as boxing and the compiler does this for you. So,
    if you are using a wrapper class, all you need to do is pass the value of the
    data type inside it to the wrapper class constructer. The wrapper object is converted
    back into a primitive data type, in a process known as unboxing.


    An example of boxing and unboxing would be:


    *   public class Test{


    *   public static void main(String args[]){


    *   Integer x = 5; // boxes int to an Integer object


    *   x =  x + 10;   // unboxes the Integer to a int


    *   System.out.println(x);


    *   }


    *   }


    Executing this would give this result:


    *   15


    In a case where x is assigned an integer value, the compiler will box the integer
    because it is an object. A bit later on, x will be unboxed so it can be added
    in as an integer.


    ### Number Methods


    The following is a list of the instance methods that are implemented by all of
    the Number class subclasses:


    *   xxxValue() – converts the value of the number objet into data type xxx and
    returns i


    *   compareTo() – Compares the number object with the argument


    *   equals() - Will determine if the number object is, in fact, equal to the argument


    *   valueOf() - Will return an integer object that holds the value of the primitive
    that is specified


    *   toString() - Will return a String object that represents the value of the
    int or integer that is specified


    *   parseInt() - Is used to get the primitive data type of a specified String


    *   abs() - Will return the absolute value of the specified argument


    *   ceil() - Will return the smallest int that is equal to or larger than the
    argument and it will be returned as a double


    *   floor() - Will return the biggest int that is equal to or less than the argument
    and it will be retuned as a double


    *   rint() - Will return the int that has the closest value to the argument, also
    returned as a double


    *   round() - Will return the closest int or long, indicated by the type of the
    method return, to the argument


    *   min() - Will return the smallest of a pair of arguments


    *   max() - Will return the biggest of a pair of arguments


    *   exp() - Will return the natural logarithm base, for example, to the power
    of the argument


    *   log() - Will return the natural logarithm of the specified argument


    *   pow() - Will return the value of the leading argument, raised to the power
    of the next one


    *   sqrt() - Will return the square root of the specified argument


    *   sin() - will return the sine of the double value specified


    *   cos() - Will return the cosine of the double value specified


    *   tan() - Will return the tangent of the double value specified


    *   asin() - Will return the arcsine of the double value specified


    *   acos() - Will return the arccosine of the double value specified


    *   atan() - Will return the arctangent of the double value specified


    *   atan2() - Will convert rectangular co-ordinates to polar co-ordinates and
    will return theta (polar)


    *   toDegrees() - Will convert the argument into degrees


    *   toRadians() - Will convert the argument into radians


    *   random() - Will return a random number


    ## Character Class


    When we work with characters in Java, we tend to use the primitive data type called
    char, for example,


    *   char ch = ''a'';


    *   // Unicode for uppercase Greek omega character


    *   char uniChar = ''\u039A'';


    *   // an array of chars


    *   char[] charArray ={ ''a'', ''b'', ''c'', ''d'', ''e'' };


    In the same way as we talked about with numbers, there is also a wrapper class
    called Character that allows you to use objects instead of the primitive data
    type char. There are a few very useful methods in the Character class that can
    be used for manipulation of characters and you can use the Character constructor
    to create a Character object, like this:


    *   Character ch = new Character(''a'');


    There are some circumstances under which the compiler will create the Character
    object for you, for example, if you were to pass a primitive char to a method
    that is expecting an object, the compiler would convert the char to a Character.
    This is known as auto boxing or, if the Character is converted to a char, it is
    known as unboxing.


    For example:


    *   // Here following primitive char ''a''


    *   // is boxed into the Character object ch


    *   Character ch = ''a'';


    *   // Here primitive ''x'' is boxed for method test,


    *   // return is unboxed to char ''c''


    *   char c = test(''x'');


    ### Escape Sequences


    If a character is preceded by a (\) backslash, it is known as an escape sequence
    and has a special meaning to the compiler. You will probably have seen this (\n)
    in some programs as well. This is the newline character and is used mostly in
    System.out.printIn() statements to move on to the next line after printing the
    string. The following are the escape sequences in java:


    *   \t - Puts a tab into the text at the point marked


    *   \b - Puts a backspace into the text at the point marked


    *   \n - Puts a newline in the text at the point marked


    *   \r - Puts a carriage return in the text at the point marked


    *   \f - Puts a form feed in the text at the point marked


    *   \'' - Puts a single quote character in the text at the point marked


    *   \" - Puts a double quote character in the text at the point marked


    *   \\ - Puts a backslash character in the text at the point marked


    When the compiler comes across an escape sequence in a rint statement, it will
    interpret it as it is written.'
