    }\n}\n\npublic int getIntValue(String num) {\n    return Integer.parseInt(num);\n\
    }\n\npublic URL getUrlObj(String urlStr) throws MalformedURLException {\n    return\
    \ new URL(urlStr);\n}\n\n```\n\n### The throw/throws Keywords\n\nIf the given\
    \ method leaves the exception doesn't handle the given checked exception, it must\
    \ be declared with the keyword `throws`. This keyword will be used at the end\
    \ of a given method's signature.\n\nUsing the `throw` keyword, newly instantiated\
    \ exceptions or exceptions that were just caught can be handled. There is a difference\
    \ between the `throw` and `throws` keywords.\n\nIn the following example `RemoteException`\
    \ will be thrown by the method.\n\n```java\nimport java.io.*;\n\npublic class\
    \ className {\n    public void deposit(double amount) throws RemoteException {\n\
    \        // Method implementation\n        throw new RemoteException();\n    }\n\
    \    //Remainder of class definition\n}\n```\n\nA method can declare that it throws\
    \ more than one exception, in which case the exceptions are declared in a list\
    \ separated by commas. For example, the following method declares that it throws\
    \ a `RemoteException` and an `InsufficientFundsException`:\n\n```java\nimport\
    \ java.io.*;\n\npublic class className {\n    public void withdraw(double amount)\
    \ throws RemoteException, InsufficientFundsException {\n        // Method implementation\n\
    \    }\n    //Remainder of class definition\n}\n```\n\n### The finally Keyword\n\
    \nThe `finally` keyword is used to create a block of code that follows a `try`\
    \ block. A `finally` block of code always executes, whether or not an exception\
    \ has occurred.\n\nUsing a `finally` block allows you to run any cleanup-type\
    \ statements that you want to execute, no matter what happens in the protected\
    \ code.\n\nA `finally` block appears at the end of the catch blocks and has the\
    \ following syntax:\n\n```java\ntry {\n    //Protected code\n} catch(ExceptionType1\
    \ e1) {\n    //Catch block\n} catch(ExceptionType2 e2) {\n    //Catch block\n\
    } catch(ExceptionType3 e3) {\n    //Catch block\n} finally {\n    //The finally\
    \ block always executes.\n}\n```\n\nExample:\n\n```java\npublic class ExcepTest{\n\
    \    public static void main(String args[]) {\n        int a[] = new int[2];\n\
    \        try {\n            System.out.println(\"Access element three :\" + a[3]);\n\
    \        } catch(ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    Exception thrown  :\" + e);\n        } finally {\n            a[0] = 6;\n    \
    \        System.out.println(\"First element value: \" +a[0]);\n            System.out.println(\"\
    The finally statement is executed\");\n        }\n    }\n}\n```\n\nThis would\
    \ produce the following result:\n```text\nException thrown  :java.lang.ArrayIndexOutOfBoundsException:\
    \ 3\nFirst element value: 6\nThe finally statement is executed\n```\n\nNote the\
    \ following:\n- A `catch` clause cannot exist without a `try` statement.\n- It\
    \ is not compulsory to have `finally` clauses whenever a `try/catch` block is\
    \ present.\n- The `try` block cannot be present without either `catch` clause\
    \ or `finally` clause.\n- Any code cannot be present in between the `try`, `catch`,\
    \ `finally` blocks.\n\nHere are some more examples on exception handling.\n\n\
    Example 1: Try- Catch blocks\n\n```java\npackage com.myjava.exceptions;\n\npublic\
    \ class MyExceptionHandle {\n    public static void main(String a[]) {\n     \
    \   try {\n            for(int i=5;i>=0;i--) {\n                System.out.println(10/i);\n\
    \            }\n        } catch(Exception ex) {\n            System.out.println(\"\
