  trans: "\n\n# 循环控制语句\n\n循环控制语句会改变其正常的执行顺序。一旦执行离开某个作用域，在该作用域中创建的所有自动对象都将被销。Java 支持以下循环控制语句：\n\
    \n* `break` 语句 – 将终止 `switch` 或循环语句，执行将移动到紧随其后的语句\n* `continue` 语句 - 使循环跳过主体的剩余部分，并在重新开始之前再次测试条件\n\
    \n## 增强型 for 循环 (Enhanced for loop)\n\n增强型 for 循环在 Java 5 中引入，通常用于遍历可能包含数组的元素组。增强型\
    \ for 循环使用的语法如下：\n\n```java\nfor(declaration : expression)\n{\n    //Statements\n\
    }\n```\n\n`Declaration` 是新定义的块变量，其类型与你正在访问的数组中的所有元素完全兼容。该变量位于 `for` 块中，它的值将与数组中的当前元素相同。\n\
    \n`Expression` 评估结果为你想要遍历的数组，它可以是一个返回数组的方法调用，也可以是一个数组变量。\n\n### 示例\n\n```java\n\
    public class Test {\n    public static void main(String args[]){ {\n        int\
    \ [] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers ){\n       \
    \     System.out.print( x );\n            System.out.print(\",\");\n        }\n\
    \        System.out.print(\"\\n\");\n        String [] names ={\"James\", \"Larry\"\
    , \"Tom\", \"Lacy\"};\n        for( String name : names ) {\n            System.out.print(\
    \ name );\n            System.out.print(\",\");\n        }\n    }\n}\n```\n\n\
    执行此代码将得到以下结果：\n\n* 10,20,30,40,50,\n* James,Larry,Tom,Lacy\n\n## Numbers 类\n\n\
    在 Java 中，当我们处理数字时，通常使用原始数据类型，如 `double`、`int`、`byte`、`long` 等，例如：\n\n* `int i\
    \ = 5000;`\n* `float gpa = 13.65;`\n* `byte mask = 0xaf;`\n\n然而在开发过程中，你可能会遇到需要使用对象而不是原始类型的情况。为了实现这一点，Java\
    \ 提供了称为包装类 (wrapper classes) 的机制。包装类包括：\n\n* `Integer`\n* `Long`\n* `Byte`\n*\
    \ `Double`\n* `Float`\n* `Short`\n\n它们都是主抽象类 `number` 的子类。\n\n包装类包含了原始数据类型，根据其名称，例如\
    \ `Long` 包装类将包含 `long` 数据类型。将这些原始类型转换为对象被称为**装箱 (boxing)**，编译器会自动为你完成这一操作。因此，如果你在使用包装类，你只需要将其内部数据类型的值传递给包装类的构造函数即可。包装对象被转换回原始数据类型，这一过程被称为**拆箱\
    \ (unboxing)**。\n\n装箱和拆箱的示例如下：\n\n```java\npublic class Test{\n    public static\
    \ void main(String args[]){\n        Integer x = 5; // 将 int 装箱为 Integer 对象\n\
    \        x = x + 10;  // 将 Integer 解箱为 int\n        System.out.println(x);\n \
    \   }\n}\n```\n\n执行此代码将得到此结果：\n\n* 15\n\n在 `x` 被赋值整数值的情况下，编译器会将该整数装箱，因为它是一个对象。稍后，`x`\
    \ 将被拆箱，以便作为整数进行加法。\n\n### Number 方法\n\n以下是所有 `Number` 类子类都实现的实例方法列表：\n\n* `xxxValue()`\
    \ – 将数字对象的值转换为数据类型 `xxx` 并返回 `i`\n* `compareTo()` – 将数字对象与参数进行比较\n* `equals()`\
    \ - 确定数字对象实际上是否与参数相等\n* `valueOf()` - 返回一个持有指定原始类型值的整数对象\n* `toString()` - 返回一个表示指定\
    \ `int` 或整数值的 `String` 对象\n* `parseInt()` - 用于获取指定 `String` 的原始数据类型\n* `abs()`\
    \ - 返回指定参数的绝对值\n* `ceil()` - 返回大于或等于参数的最小整数，并以 `double` 类型返回\n* `floor()` - 返回小于或等于参数的最大整数，并以\
    \ `double` 类型返回\n* `rint()` - 返回与参数值最接近的整数，同样以 `double` 类型返回\n* `round()` - 返回与参数最接近的\
    \ `int` 或 `long`（取决于方法的返回类型）\n* `min()` – 返回一对参数中的较值\n* `max()` – 返回一对参数中的最大值\n\
    * `exp()` – 返回自然对数底的幂，例如参数的次方\n* `log()` – 返回指定参数的自然对数\n* `pow()` – 返回第一个参数的以第二个参数为幂\n\
    * `sqrt()` – 返回指定参数的平方根\n* `sin()` - 返回指定的 `double` 值的正弦值\n* `cos()` - 返回指定的 `double`\
    \ 值的余弦值\n* `tan()` - 返回指定的 `double` 值的正切值\n* `asin()` - 返回指定参数的反正弦\n* `acos()`\
    \ - 返回指定参数的反余弦\n* `atan()` - 返回指定参数的正切\n* `toDegrees()` - 将参数转换为角度\n* `toRadians()`\
    \ - 将参数转换为弧度\n* `random()` - 返回一个随机数\n\n## Character 类\n\n我们在 Java 中处理字符时，倾向于使用原始数据类型\
    \ `char`，例如：\n\n* `char ch = 'a';`\n* // Unicode 大写希腊字母\n* `char uniChar = '\\\
    u39A';`\n* // 字符数组\n* `char[] charArray ={a', 'b', 'c', 'd'};`\n\n正如我们处理数字一样，还有一个名为\
    \ `Character` 的包装类，允许你使用对象而不是原始类型 `char`。`Character` 类有一些非常有用的方法可以操作字符，你可以使用 `Character`\
    \ 构造函数创建一个对象，例如：\n\n```java\nCharacter ch = new Character('a');\n```\n\n在某些情况下，编译器会自动为你创建\
    \ `Character` 对象，例如，如果你将原始 `char` 传递给一个需要对象的方法，编译器会转换 `char`。这被称为自动装箱；而如果 `Character`\
    \ 被转换为 `char`，则被称为拆箱。\n\n例如：\n\n```java\n// 这里将原始 char 'a' 装箱为 Character 对象\n\
    Character ch = 'a';\n\n#### 这里原始 'x' 装箱传递给方法 test，\n// 返回拆箱为 char 'c'\nchar c\
    \ = test('x');\n```\n\n### 转义序列\n\n如果字符前面有一个反斜杠 `\\`，它被认为转义序列，对编译器具有特殊含义。你可能在某些程序中也见过\
    \ `\\n`。这是一个换行符，主要用于 `System.out.println()` 语句在打印字符串后移动到下一行。以下是 Java 中的转义序列：\n\
    \n* `\\t` - 在标记处插入一个制表符\n* `\\b` - 在标记处插入一个退格符\n* `\\n` - 在标记处插入一个换行符\n* `\\r`\
    \ - 在标记处插入一个回车符\n* `\\f` - 在标记处插入一个换页符\n* `\\'` - 在标记处插入一个单引号\n* `\\\"` - 在标记处插入一个双端引号\n\
    * `\\\\` - 在标记处插入一个反斜杠字符\n\n当编译器在 `rint` 语句中遇到转义序列时，它将按照编写的方式进行解释。\n\n"
- fmt: "\nFor example, if you were to put quotes inside quotes, you would need to\
    \ use the `\\\"` escape sequence on the inside quotes:\n\n```java\npublic class\
    \ Test {\n    public static void main(String args[]) {\n        System.out.println(\"\
    She said \\\"Hello!\\\" to me.\");\n    }\n}\n```\n\nExecution of this would produce\
    \ this result:\nShe said \"Hello!\" to me.\n\n### Character Methods\n\nBelow is\
    \ a list of all the important instance methods that are implemented by the `Character`\
    \ class subclasses:\n\n* `isLetter()` – Will determine if the `char` value specified\
    \ is a letter\n* `isDigit()` – Will determine if the `char` value specified is\
    \ a digit\n* `isWhitespace()` – Will determine if the `char` value specified is\
    \ white space\n* `isUpperCase()` – Will determine if the `char` value specified\
    \ is uppercase\n* `isLowerCase()` - Will determine if the `char` value specified\
    \ is lowercase\n* `toUpperCase()` - Will return the specified `char` value in\
    \ uppercase form\n* `toLowerCase()` - Will return the specified `char` value in\
    \ lowercase form\n* `toString()` – Will return a `String` object that is a one-character\
    \ `String` that represents the character value that is specified\n\n### Strings\
    \ Class\n\n`Strings` are used a lot in Java and they are simply a sequence of\
    \ characters. `Strings` are known as objects in Java programming and the platform\
    \ has the `Strings` class to allow you to create strings and manipulate them.\n\
    \nThe easiest way to create a string is like this:\n\n```java\nString greeting\
    \ = \"Hello world!\";\n```\n\nWhenever the compiler comes across a string literal\
    \ written in your code, it will create a `String` object. In the case above, the\
    \ value is “Hello, World!”. Like any other object, `String` objects can be created\
    \ with a constructor and the `new` keyword. There are 11 constructors in the `String`\
    \ class and they all let you provide the starting value of the string through\
    \ different course, like a character array. For example:\n\n```java\npublic class\
    \ StringDemo{\n    public static void main(String args[]){\n        char[] helloArray\
    \ = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String helloString = new String(helloArray);\
    \ \n        System.out.println( helloString );\n    }\n}\n```\n\nExecuting this\
    \ code would give this result:\nhello.\n\nBe aware that the `String` class is\
    \ immutable. This means that, once you have created it, you cannot change a `String`\
    \ object. If you find that you need to modify character strings, you would need\
    \ to use the classes, `StringBuffer` and `StringBuilder`.\n\n### String Length\n\
    \nWhen you use a method to get information about an object, that method is called\
    \ an accessor method. One that you can use is the `length()` method, which will\
    \ return the number of characters that are inside the string object. For example:\n\
    \n```java\npublic class StringDemo {\n    public static void main(String args[])\
    \ {\n        String palindrome = \"Dot saw I was Tod\";\n        int len = palindrome.length();\n\
    \        System.out.println( \"String Length is : \" + len );\n    }\n}\n```\n\
    \nExecuting this code would produce this result:\nString Length is : 17\n\n###\
    \ Concatenating Strings\n\nThere is a method in the `String` class for concatenating\
    \ two strings:\n\n```java\nstring1.concat(string2);\n```\n\nThis will return a\
    \ string that is `string1` with `string2`. Whenever the compiler comes across\
    \ a string literal written in your code, it will create a `String` object. In\
    \ the case above, the value is “Hello, World!”. Like any other object, `String`\
    \ objects can be created with a constructor and the `new` keyword. There are 11\
    \ constructors in the `String` class and they all let you provide the starting\
    \ value of the string through different course, like a character array. For example:\n\
    \n```java\npublic class StringDemo{\n    public static void main(String args[]){\n\
    \        char[] helloArray = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String\
    \ helloString = new String(helloArray); \n        System.out.println( helloString\
    \ );\n    }\n}\n```\n\n### Creating Strings\n\nTo format strings, you can use\
    \ `format()` method. The `format()` method is similar to `printf()` but it returns\
    \ a formatted string instead of printing it to the console.\n\n```java\nString\
    \ s = String.format(\"Hello, %s!\", \"World\");\n```\n\n### String Methods\n\n\
    Below is a list of all the methods that the `String` class supports:\n\n* `charAt(int\
    \ index)` – returns the character at the index\n* `compareTo(Object o)` – Will\
    \ compare this string to object\n* `compareTo(String anotherString)` – Will compare\
