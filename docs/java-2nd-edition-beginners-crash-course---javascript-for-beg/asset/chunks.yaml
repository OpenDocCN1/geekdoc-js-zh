  trans: "\n\n`/java/samples` 是你当前所在的目录。在计算机语言中，`/name` 表示一个文件夹。最后一部分是你保存应用程序的地方。例如，如果你将它保存到桌面上，你会输入\
    \ `/desktop>javac Pythagorean.java`\n\n`javac` 意味着 java compile（Java 编译），这是一个将应用程序从可读词汇转换为计算机语言的过程。如果出现错误（如果有的话），错误也会在这里显示。这些错误可以在原始应用程序中轻松地修正。\n\
    \n好了，如果什么都没有发生，那么你就知道你的应用程序运行正常了，因为它原本就没打算执行任何操作。找到你保存应用程序的文件夹；你现在应该能看到一个读为 `Pythagorean.class`\
    \ 的第二个文件。如果它在那里，那就一切正常。如果不在那里，你需要检查应用程序内部以及命令行上的文本，以确保你的每一个操作都是正确的。\n\n### Mac\n\
    \n这个过程与 Windows 类似：\n\n*   打开 `terminal.app`\n*   找到你保存应用程序的位置\n*   在终端输入 `cd\
    \ <name of directory>`\n*   现在输入与你在 Windows 版本类似的内容 - `C:/java/samples>javac Pythagorean.java`\n\
    \n下一步是让你的应用程序执行某些操作。在你的文字处理器窗口中，输入以下内容（我在这里从零开始，但你可以在之前输入的内容之后继续，从正确的地方开始）：\n\n\
    ```java\nclass Pythagorean {\n    public static void main(String[] args){\n  \
    \      String greeting = “Hello. Welcome to the Pythagorean Theorem Application.\
    \ Today we will be computing the Pythagorean Theorem for you.\",\n        String\
    \ prompt = \"Please enter a number for the first leg of a right triangle, followed\
    \ by pressing ENTER or RETURN, followed by the remaining leg. Then hit ENTER or\
    \ RETURN one more time.\";\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
    \    }\n}\n```\n\n将其拆解如下：\n\n*   字符串（string）是一行文本，这被称为变量，意味着它是可以改变的\n*   `Prompt`\
    \ 和 `greeting` 是字符串名称，因此在以 `String greeting` 开头的这一行中，你正在创建一个名为 `greeting` 的字符串。注意，该行以分号结尾——这非常重要——所有的\
    \ JAVA 语句必须以分号结尾，否则你将得到错误\n*   `=` 用于给变量赋值，其方式如下：`String greeting = \"Hello. Welcome\
    \ to the Pythagorean Theorem Application. Today we will be computing the Pythagorean\
    \ Theorem for you.\";` 或者如下：`String greeting; greeting = \"Hello. Welcome to the\
    \ Pythagorean Theorem Application. Today we will be computing the Pythagorean\
    \ Theorem for you.\";`\n\n在后一种情况下，你分两个独立的步骤声明变量并为其赋值，而在第一种情况下，你只使用了一步。两者的工作方式相同。请记住，进入变量的所有文本必须包含在引号内——“”\n\
    \n在 `System.out.println`这一行中，你正在调用系统输出打印变量行。如果你调用 `System.out.println(“HI”)`，单词“HI”将打印到你的终端上。注意这里的引号——它们表示引号之间的内容是文本，而不是变量名。如果你调用\
    \ `System.out.println(HI)` 而不加引号，你将得到错误信息，因为程序将试图打印一个名为 `HI` 的变量的值——而并没有这个变量。请记住这个命令；它是另一个你会经常使用的命令。\n\
    \n现在我们要稍微做些改变，让它变得复杂一点。将你目前编写的代码修改为如下内容：\n\n```java\nimport java.util.Scanner;\n\
    class Pythagorean {\n    public static void main(String[] args){\n        String\
    \ greeting = \"Hello. Welcome to the Pythagorean Theorem Application. Today we\
    \ will be computing the Pythagorean Theorem for you.\";\n        String prompt\
    \ = \"Please enter a number for the first leg of a right triangle, followed by\
    \ pressing ENTER or RETURN, followed by the remaining leg. Then hit ENTER or RETURN\
    \ one more time.\";\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
    \        float a;\n        float b;\n        Scanner myScanner = new Scanner(System.in);\n\
    \        a = myScanner.nextFloat();\n        b = myScanner.nextFloat();\n    \
    \    float a2 = a * a;\n        float b2 = b * b;\n        double c2 = a2 + b2;\n\
    \        double c = Math.sqrt(c2);\n        System.out.println(\"The square of\
    \ a is: \" + a2 + \" The square of b is: \" + b2 + \" The square of c is: \" +\
    \ c2 + \" C is: \" + c);\n    }\n}\n```\n\n现在，你可能正瞪大眼睛看着这段代码，纳闷这到底是怎么回事，让我们来拆解一下。\n\
    \n第一行与原始代码不同——我们在这里做的目的是告诉你的程序你想让它导入 `SCANNER`，这是一个 Java 工具类。如你所知，scanner 的作用是扫描东西，它在这里要做的是扫描你在命令行输入的内容。我说得清楚吗？\n\
    \n`float a;` 和 `float b;` 都是在声明变量。`Scanner myScanner = new Scanner(System.in);`\
    \ 意味着你创建了一个扫描器并命名为 myScanner，它的输入来自 `System.in`。`a = myScanner.nextFloat();` 意味着变量\
    \ `a` 将被赋值为扫描器的第一个浮点数。`b = myScanner.nextFloat();` 则是对下一个浮点数执行操作。\n\n现在，这里包含了大量的数学运算：\n\
    \n*   `float a2 = a * a;` 声明了一个名为 `a2` 的变量，并赋值为 `a` 乘以 `a` 的值\n*   `float b2 =\
    \ b * b;` 同样是针对 float `b`\n*   `double c2 = a2 + b2;` 声明了一个 double 类型（长精度小数），并将其赋值为\
    \ `a2` 加上 `b2`\n*   `double c = Math.sqrt(c2);` 取 `c2` 的平方根并将其放入变量 `c` 中\n\n代码的最后一行直接将所有内容打印出来。引号内的任何内容将作为文本打印，而\
    \ `+` 用于组合输出。任何不在引号内的内容将打印变量的值。\n\n我就写到这里，因为从这里开始事情会变得复杂得多，你首先需要学习 Java 的函数。\n\
    \n# \n\n第 13 章：Java 函数\n\n为了在编写 Java 代码时理解你在做什么，你必须首先了解 Java 的函数。我在本书前面的部分已经讨论过了一些基础函数，现在是时候查看一些高级函数了。\n\
    \n## 循环控制\n\n在有时，你需要多次执行一段代码块。通常情况下，所有语句按顺序执行，函数中的第一个语句先执行，第二个后执行，以此类推直到结束。大多数编程语言都有许多控制结构允许你执行更复杂的执行指令，Java\
    \ 也不例外。\n\n循环语句允许你多次执行单条语句或一组语句。以下是 Java 提供的处理循环要求的循环列表：\n\n*   `while` 循环只要给定条件为真，就会重复执行单条或一组语句。条件在循环体执行之前进行测试\n\
    *   `for` 循环将按次数执行语句序列，并能简化循环变量的管理代码\n*   `do…while` 循环——与 `while` 语句类似，但这种循环是在循环体结束后进行测试\n\
    \n"
- fmt: "\n# Loop Control Statements\n\nA loop control statement changes the execution\
    \ sequence from its normal one. As soon as the execution leaves a scope, all the\
    \ automatic objects, created in the scope, will be destroyed. The following loop\
    \ control statements are supported in Java:\n\n* `break` statement – will terminate\
    \ the `switch` or loop statement and execution will move to the statement that\
    \ immediately follows it\n* `continue` statement - makes the loop skip over the\
    \ rest of the body and retest the condition before it starts again\n\n## Enhanced\
    \ for loop\n\nThe enhanced for loop came in with Java 5 and is normally used to\
    \ travel through a group of elements that may include arrays. The syntax used\
    \ for the enhanced for loop is:\n\n```java\nfor(declaration : expression)\n{\n\
    \    //Statements\n}\n```\n\n`Declaration` is a block variable that is newly declared\
    \ and is of a type that is fully compatible with all of the elements of the array\
    \ that you are accessing. The variable is in the `for` block and it will have\
    \ a value that is identical to current element in the array.\n\n`Expression` is\
    \ to evaluate to the array that you are looking to loop thorough and it can be\
    \ either a method call that will return an array or it can be an array variable.\n\
    \n### For Example\n\n```java\npublic class Test {\n    public static void main(String\
    \ args[]){ {\n        int [] numbers = {10, 20, 30, 40, 50};\n        for(int\
    \ x : numbers ){\n            System.out.print( x );\n            System.out.print(\"\
    ,\");\n        }\n        System.out.print(\"\\n\");\n        String [] names\
    \ ={\"James\", \"Larry\", \"Tom\", \"Lacy\"};\n        for( String name : names\
    \ ) {\n            System.out.print( name );\n            System.out.print(\"\
    ,\");\n        }\n    }\n}\n```\n\nExecuting this code would give you this result:\n\
    \n* 10,20,30,40,50,\n* James,Larry,Tom,Lacy\n\n## Numbers Class\n\nIn Java when\
    \ we work with numbers, we normally use primitive data types, like `double`, `int`,\
    \ `byte`, `long`, etc., for example:\n\n* `int i = 5000;`\n* `float gpa = 13.65;`\n\
    * `byte mask = 0xaf;`\n\nHowever, occasionally in the development side of things,\
    \ you may come across a situation where you would need to make use of an object\
    \ instead, to do this, Java has something called wrapper classes. The wrapper\
    \ classes are:\n\n* `Integer`\n* `Long`\n* `Byte`\n* `Double`\n* `Float`\n* `Short`\n\
    \nAnd they are subclasses of the main abstract `number` class.\n\nThe wrapper\
    \ class contains primitive data types that, respective of its name, i.e., the\
    \ `Long` wrapper class would contain `long` data types. Converting these primitive\
    \ types into objects is known as boxing and the compiler does this for you. So,\
    \ if you are using a wrapper class, all you need to do is pass the value of the\
    \ data type inside it to the wrapper class constructer. The wrapper object is\
    \ converted back into a primitive data type, in a process known as unboxing.\n\
    \nAn example of boxing and unboxing would be:\n\n```java\npublic class Test{\n\
    \    public static void main(String args[]){\n        Integer x = 5; // boxes\
    \ int to an Integer object\n        x = x + 10;  // unboxes the Integer to a int\n\
    \        System.out.println(x);\n    }\n}\n```\n\nExecuting this would give this\
    \ result:\n\n* 15\n\nIn a case where `x` is assigned an integer value, the compiler\
    \ will box the integer because it is an object. A bit later on, `x` will be unboxed\
    \ so it can be added in as an integer.\n\n### Number Methods\n\nThe following\
    \ is a list of the instance methods that are implemented by all of the `Number`\
    \ class subclasses:\n\n* `xxxValue()` – converts the value of the number objet\
    \ into data type `xxx` and returns `i`\n* `compareTo()` – Compares the number\
    \ object with the argument\n* `equals()` - Will determine if the number object\
    \ is, in fact, equal to the argument\n* `valueOf()` - Will return an integer object\
    \ that holds the value of the primitive that is specified\n* `toString()` - Will\
    \ return a `String` object that represents the value of the `int` or integer that\
    \ is specified\n* `parseInt()` - Is used to get the primitive data type of a specified\
    \ `String`\n* `abs()` - Will return the absolute value of the specified argument\n\
    * `ceil()` - Will return the smallest int that is equal to or larger than the\
    \ argument and it will be returned as a `double`\n* `floor()` - Will return the\
    \ biggest int that is equal to or less than the argument and it will be retuned\
    \ as a `double`\n* `rint()` - Will return the int that has the closest value to\
    \ the argument, also returned as a `double`\n* `round()` - Will return the closest\
    \ int or `long`, indicated by the type of the method return, to the argument\n\
    * `min()` - Will return the smallest of a pair of arguments\n* `max()` - Will\
    \ return the biggest of a pair of arguments\n* `exp()` - Will return the natural\
    \ logarithm base, for example, to the power of the argument\n* `log()` - Will\
    \ return the natural logarithm of the specified argument\n* `pow()` - Will return\
    \ the value of the leading argument, raised to the power of the next one\n* `sqrt()`\
    \ - Will return the square root of the specified argument\n* `sin()` - will return\
    \ the sine of the double value specified\n* `cos()` - Will return the cosine of\
    \ the double value specified\n* `tan()` - Will return the tangent of the double\
    \ value specified\n* `asin()` - Will return the arcsine of the double value specified\n\
    * `acos()` - Will return the arccosine of the double value specified\n* `atan()`\
    \ - Will return the arctangent of the double value specified\n* `atan2()` - Will\
    \ convert rectangular-ordinates to polar-ordinates\n* `toDegrees()` - Will convert\
    \ the argument into degrees\n* `toRadians()` - Will convert the argument into\
    \ radians\n* `random()` - Will return a random\n\n## Character Class\n\nWhen we\
    \ work with characters in Java, we tend to use the primitive data type `char`,\
    \ for example,\n\n* `char ch = 'a';`\n* // Unicode for uppercase Greek\n* `char\
    \ uniChar = '\\u039A';`\n* // an array of chars\n* `char[] charArray ={a', 'b',\
    \ 'c', 'd', 'e' };\n\nIn the same way as we talked about numbers, there is also\
    \ a wrapper class called `Character` that allows you to use objects instead of\
    \ primitive data type `char`. There are a few very useful methods in the `Character`\
    \ class that can be used for manipulation of characters and you can use the `Character`\
    \ constructor to create a `Character` object, like:\n\n```java\nCharacter ch =\
    \ new Character('a');\n```\n\nThere are some circumstances under which the compiler\
    \ will create the `Character` object for you, for example, if you were to pass\
    \ a primitive `char` to a method that is expecting an object, the compiler would\
    \ convert the `char` to a `Character`. This is known as auto boxing or, if the\
    \ `Character` is converted to a `char`, it is known as unboxing.\n\nFor example:\n\
    \n```java\n// Here following primitive char 'a'\n// is boxed into the Character\
    \ object\nCharacter ch = 'a';\n\n// Here primitive 'x' is boxed for method test,\n\
    // return is unboxed to char 'c'\nchar c = test('x');\n```\n\n### Escape Sequences\n\
    \nIf a character is preceded by a `\\` backslash, it is known as an escape sequence\
    \ and has a special meaning to the compiler. You will probably have seen this\
    \ `\\n` in some programs as well. This is the newline character and is used mostly\
    \ in `System.out.println()` statements to move on to the next line after printing\
    \ the string. The following are the escape sequences in java:\n\n* `\\t` - Puts\
    \ a tab into the text at the point marked\n* `\\b` - Puts a backspace into the\
    \ text at the point marked\n* `\\n` - Puts a newline in the text at the point\
