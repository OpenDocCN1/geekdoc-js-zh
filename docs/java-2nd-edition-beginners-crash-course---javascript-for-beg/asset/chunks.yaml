  raw: '*   By calling the static variables with their class name, you can access
    them. Syntax: ClassName.VariableName.


    Here is an example using static variables.


    Example:


    import java.io.*;


    public class Employee{


     // salary  variable is a private static variable


     private static double salary;


     // DEPARTMENT is a constant


     public static final String DEPARTMENT = "Development ";


     public static void main(String args[]){


        salary = 1000;


        System.out.println(DEPARTMENT+"average salary:"+salary);


     }


    }


    The program will produce the following output.


    Development average salary:1000


    ## Modifiers


    In some situations you might need to change the meaning of some definitions. In
    such cases you can use modifiers. Modifier said nothing but keywords with which
    you can change the meaning of a definition. In Java, there are a number of modifiers
    including the below two.


    ·       [ Java Access Modifiers](http://www.tutorialspoint.com/java/java_access_modifiers.htm)


    ·       [ Non Access Modifiers](http://www.tutorialspoint.com/java/java_nonaccess_modifiers.htm)


    For using the modifier you should include keywords within the definition of a
    variable, method or class. The modifier should be placed in the beginning of the
    statement as given in the examples below. They are given in italics.


    public class className {


     // ...


    }


    private boolean myFlag;


    static final double weeks = 9.5;


    protected static final int BOXWIDTH = 42;


    public static void main(String[] arguments) {


     // body of method


    }


    Access Control Modifiers:


    For setting access levels for constructors, variables, classes and methods, Java
    provides the users with a set of access modifiers. There are four access levels
    in Java. They are.


    ·        Visible to the package, the default. No modifiers are needed.


    ·        Visible to the class only (private).


    ·        Visible to the world (public).


    ·        Visible to the package and all subclasses (protected).


    Non Access Modifiers:


    In Java there are a number of non-access modifiers.


    *   The static modifier is used for creating class variables and methods.


    *   For finalizing the implementation of variables, classes and the methods we
    use the final modifier.


    *   You can create abstract classes and abstract methods by using the abstract
    modifier.


    *   For dealing with threads, we use the volatile and synchronized modifiers.


    # Chapter 8: Operators


    While programming, you might constantly need to manipulate variables and for that,
    Java provides the users with a set of operators. All the operators can be divided
    into the following groups.


    *   Arithmetic Operators


    *   Relational Operators


    *   Bitwise Operators


    *   Logical Operators


    *   Assignment Operators


    ## The Arithmetic Operators


    The arithmetic operators can be used for dealing with mathematical expressions.
    All the athletic operators are listed in the table given below.


    Here, we will assume that the variable A holds 5 and the variable B holds 10\.
    Then the following expressions will result:


    | Operator | Description | Example |


    | + | Addition - Adds values on either side of the operator | A + B will give
    15 |


    | - | Subtraction - Subtracts right hand operand from left hand operand | A -
    B will give -5 |


    | * | Multiplication - Multiplies values on either side of the operator | A *
    B will give 50 |


    | / | Division - Divides left hand operand by right hand operand | B / A will
    give 2 |


    | % | Modulus - Divides left hand operand by right hand operand and returns remainder
    | B % A will give 0 |


    | ++ | Increment - Increases the value of operand by 1 | B++ gives 11 |


    | -- | Decrement - Decreases the value of operand by 1 | B-- gives 9 |


    ## The Relational Operators


    Java supports the following relational operators.


    Assume variable A holds 1 and variable B holds 2, then:


    | Operator | Description | Example |


    | == | This operator will compare both the operands and check if they are equal
    or not. This will return a true if they are equal. | (A == B) is not true. |


    | != | This operator will compare both the operands and check if they are equal
    or not. This will return a true if they are not equal. | (A != B) is true. |


    | > | This operator will compare both the operands and checks if they left operand
    is greater than the right operand and if the condition is satisfied, this will
    return a true. | (A > B) is not true. |


    | < | This operator will compare both the operands and checks if they left operand
    is less than the right operand and if the condition is satisfied, this will return
    a true. | (A < B) is true. |


    | >= | This operator when compare the left operand and checks if it is greater
    than or equal to the right operand. This will return a true if the condition is
    satisfied. | (A >= B) is not true. |


    | <= | This operator when compare the left operand and checks if it is greater
    than or equal to the right operand. This will return a true if the condition is
    satisfied. | (A <= B) is true. |


    ## The Bitwise Operators


    There are several Bitwise operators in Java. These operators can be applied on
    byte, short, int, long and char data types.


    Bitwise operators perform bit by bit operations and work on bits. Let us assume
    that a=60 and b=13\. Their values in binary will be


    a = 0011 1100


    b = 0000 1101


    a&b = 0000 1100


    a|b = 0011 1101


    a^b = 0011 0001


    ~a  = 1100 0011


    Here is a list of all the Bitwise operators in Java.


    | Operator | Description | Example |


    | & | Binary AND Operator copies a bit to the result if it exists in both operands.
    | (A & B) will give 12 which is 0000 1100 |


    | &#124; | Binary OR Operator copies a bit if it exists in either operand. | (A
    &#124; B) will give 61 which is 0011 1101 |


    | ^ | Binary XOR Operator copies the bit if it is set in one operand but not both.
    | (A ^ B) will give 49 which is 0011 0001 |


    | ~ | Binary Ones Complement Operator is unary and has the effect of ''flipping''
    bits. | (~A ) will give -61 which is 1100 0011 in 2''s complement form due to
    a signed binary number. |


    | << | Binary Left Shift Operator. The left operands value is moved left by the
    number of bits specified by the right operan | A << 2 will give 240 which is 1111
    0000 |


    | >> | Binary Right Shift Operator. The left operands value is moved right by
    the number of bits specified by the right operand. | A >> 2 will give 15 which
    is 1111 |


    | >>> | Shift right zero fill operator. The left operands value is moved right
    by the number of bits specified by the right operand and shifted values are filled
    up with zeros. | A >>>2 will give 15 which is 0000 1111 |


    ## The Logical Operators


    Here is the list of all the logical operators in Java.


    Let us assume that A and B are Boolean variables. A holds true and B holds false.
    Then:


    | Operator | Description | Example |


    | && | This is call the AND operator and this will return a true if both the operands
    hold non-zero values. | (A && B) is false. |


    | &#124;&#124; | This is called the OR operator and this will return a true if
    any of the two operands hold a non-zero value. | (A &#124;&#124; B) is true. |


    | ! | This is called the logical NOT operator and it is used for reversing the
    current logical state of the operand on which it is used. If the condition returns
    a true, the logical NOT operator will make it a false. | !(A && B) is true. |


    ## The Assignment Operators


    The lists of all the assignment operators that are supported by Java are given
    in the table below.


    | Operator | Description | Example |


    | = | This is a simple assignment operator which assigns the value of the right
    operand to the left operand. | C = A + B will assign value of A + B into C |


    | += | This is the add AND operator. This operator will add both the operands
    and will assign the result to the left operand. | C += A is equivalent to C =
    C + A |


    | -= | This is the subtract AND operator. This operator will subtract the right
    operands from the left and  will assign the result to the left operand. | C -=
    A is equivalent to C = C - A |'
