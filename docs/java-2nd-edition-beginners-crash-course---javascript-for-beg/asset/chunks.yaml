  raw: 'Instance Variables - every object will have its own unique set of variables.
    These variables are called as instance variables. These instance variables will
    have values assigned to them and these are used for defining the state of an object.


    ## Basic Syntax:


    When programming in Java, the following points should always be followed.


    *   Case Sensitivity - The Java language is case-sensitive. So, one should be
    careful when writing programs in Java. The words Phoenix and phoenix are not the
    same and they have different meanings in Java


    *   Class Names - when writing a class name, the first letter should always be
    an uppercase letter. For example when Car, Bike, Laptop etc. If multiple words
    are used combine we as a class name, each of those words should be written with
    the first letter being an uppercase letter. Example class JavaExampleClass.


    *   Method Names - when calling a method, the name of that method should always
    start with a lowercase letter. If multiple words are used to name that method,
    the first letter of the method will be a lowercase letter and the first letter
    of the inner words should be in uppercase. Example: public void exampleJavaMethodName()


    *   Program File Name - The class name and the program file name should exactly
    be the same.


    *   Always remember to save the file using its class name and at the end of the
    name append ''.java''. For example, if the class name is ''BananaNutellaPancake'',
    the file should have the filename ''BananaNutellaPancake.java''


    *   Public static void main (String args[]) - The compiler will start processing
    the program from the main() method. So, without a main() method it is not possible
    to write programs in Java.


    # Chapter 3: Objects And Classes


    Among various types of languages that are present java is classified as an object
    oriented language. All object oriented languages support the following basic concepts


    Polymorphism: It is a case where one object can take up multiple forms. For example
    "+" can be used for addition as well as concatenation of strings.


    Inheritance: It is a case in which the child object gains the properties of its
    parents.


    Encapsulation: It is a case where the data is protected.


    Abstraction: It is a case where the class''s declaration is completely done but
    the functionality can be written in different ways using the variables and methods
    present in the abstract class.


    Classes: Objects are created using the class. Class consists of member variables
    and member functions. It can be considered as a blueprint.


    Objects: In object oriented programming objects play a vital role. Objects perform
    all the functions. They have states in which the variables are and behavior where


    the variables act in a certain way when they are put into certain methods.


    Instance: Instance can be considered as a variable that is declared inside the
    class but outside the methods of the class.


    Method: A method can be considered as a collection of statements that are written
    to perform a particular task.


    ## Knowing more about the Objects in Java


    Any physical thing that you see around you that has physical characteristics can
    be considered as an object. All these have states and behavior that can be noticed.


    All these objects have a state and behavior. These are real world objects now
    let us consider software objects that have similar states that are shown by variables
    and behavior that is shown via methods.


    Example of Classes in Java:


    public class Dog{


    String breed;


    int age;


    String color;


    void barking(){


    }


    void hungry(){


    }


    void sleeping(){


    }


    }


    There are multiple types of variables such as local variables, global variables,
    class variables, instance variables. Depending on the span of the variable''s
    span variables can be divided into local and global variables.


    Local variables are defined inside the functions and can be used only inside the
    functions. In other words local variables are destroyed as soon as the function
    is completed.


    Global variables are defined outside and their scope is last throughout the program.


    Instance variables: Instance variables are declared inside the class but outside
    of the methods. These can be used by all the methods that belong to that specific
    class only.


    Instance variables: Instance variables are variables within a class but outside
    any method. These variables are instantiated when the class is loaded.


    Class variables are variables that are similar to instance variables. The only
    difference is that they are declared with static keyword.


    A class can have multiple variables and methods.


    # Chapter 4: Constructors


    Constructors play a vital role when it comes to class. Constructors can be explicitly
    created while creating a class else the java compiler creates a constructor automatically.
    Every single time an object is created at least one constructor is invoked. A
    class can have more than one constructor. A constructor should have the same name
    as the class.  Every constructor must have a destructor.


    Example of a constructor:


    public class Puppy{


    public Puppy(){


    }


    public Puppy(String name)


    {


       // This constructor has one parameter, name.


    }


    }


    ### Creating an Object


    As mentioned previously, a class provides the blueprints for objects. So basically
    an object is created from a class. In Java, the new key word is used to create
    new objects.


    There are three steps when creating an object from a class:


    Declaration: A variable declaration with a variable name with an object type.


    Instantiation: The ''new'' key word is used to create the object.


    Initialization: The ''new'' keyword is followed by a call to a constructor. This
    call initializes the new object.


    Example of creating an object is given below:


    public class Puppy{


    public Puppy(String name)


    {


       // This constructor has one parameter, name.


       System.out.println("Passed Name is :" + name );


    }


    public static void main(String []args){


       // Following statement would create an object myPuppy


       Puppy myPuppy = new Puppy( "jimmy" );


    }


    }


    If we compile and run the above program, then it would produce the following result:


    Passed Name is :jimmy


    Accessing Instance Variables and Methods:


    Instance variables and methods are accessed via created objects. To access an
    instance variable the fully qualified path should be as follows:


    /* First create an object */


    ObjectReference = new Constructor();


    /* Now call a variable as follows */


    ObjectReference.variableName;


    /* Now you can call a class method as follows */


    ObjectReference.MethodName();


    Example:


    This example explains how to access instance variables and methods of a class:


    public class Puppy{


    int puppyAge;


    public Puppy(String name)


    {


       // This constructor has one parameter, name.


       System.out.println("Passed Name is :" + name );


    }


    public void setAge( int age ){


        puppyAge = age;


    }


    public int getAge( )


    {


        System.out.println("Puppy''s age is :" + puppyAge );


        return puppyAge;


    }


    public static void main(String []args){


       /* Object creation */


       Puppy myPuppy = new Puppy( "jimmy" );


       /* Call class method to set puppy''s age */


       myPuppy.setAge( 2 );


       /* Call another class method to get puppy''s age */


       myPuppy.getAge( );


       /* You can access instance variable as follows as well */


       System.out.println("Variable Value :" + myPuppy.puppyAge );


    }


    }


    # Chapter 5: Java Package


    In simple words, a Java package can be defined as a categorized set of interfaces
    and classes. Categorizing these classes and interfaces is a must in Java when
    developing applications as hundreds of interfaces and classes will be used. Categorizing
    these will make the job easier.


    ## Import statements


    A fully qualified name in Java, which contains the class name and the package
    is passed down to the compiler, the compiler can locate the classes or source
    code easily. By giving the import statement to the compiler, we are given the
    location of that particular class.'
