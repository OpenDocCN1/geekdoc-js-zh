    In simple words it can be defined as a problem occurred during the program''s
    execution. There are many reasons that cause an exception to occur. Some of them
    are:


    ·        Giving invalid data.


    ·        The Java virtual machine running out of memory.


    ·        Network connection termination during communication.


    ·        The required files cannot be found.


    Some exceptions are caused due to the human errors, others due to the programmer
    errors and the rest due to the failure of physical resources.


    In Java, there are three categories of exceptions. For you to understand the concept
    of exception handling you should know the type of exceptions. The different categories
    of exceptions are given below.


    ·        Checked exceptions: An exception can be defined as a checked exception
    if it can''t be foreseen by the programmer or if it is an typical user error.
    Checked exceptions cannot be ignored during compilation time.


    ·        Runtime exceptions: runtime exceptions can be defined as exceptions that
    could have probably been solved by the programmer. Runtime exceptions, unlike
    checked exceptions will be ignored during compilation time.


    ·        Errors: Errors can be defined as problems that an user or a programmer
    cannot control. These cannot be considered as exceptions. Errors are usually ignored
    as they cannot be solved. For example, an error will be raised in case of a stack
    overflow. This error will be ignored during the compilation of the program.


    The list of the most commonly seen exceptions, both checked and unchecked are
    given below. All these exceptions are a subset of the [Java''s Built-in Exceptions](http://www.tutorialspoint.com/java/java_builtin_exceptions.htm).


    ### Exceptions Methods


