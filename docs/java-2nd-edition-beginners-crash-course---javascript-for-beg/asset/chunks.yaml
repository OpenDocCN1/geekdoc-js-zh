    \ – Will return the index in the string of the first instance of the substring\n\
    * `indexOf(String str, int fromIndex)` – As above but beginning the search at\
    \ the index specified\n* `intern()` – Will return a canonical representation\n\
    * `lastIndexOf(int ch)` – Will return the index in the string with the last instance\
