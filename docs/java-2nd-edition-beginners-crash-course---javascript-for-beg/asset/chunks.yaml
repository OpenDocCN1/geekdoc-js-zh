  trans: "\n\n例如，如果你想在引号内部嵌套引号，则需要对内部的引号使用 `\\\"` 转义序列：\n\n```java\npublic class Test\
    \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
    She said \\\"Hello!\\\" to me.\");\n    }\n}\n```\n\n执行此代码将产生以下结果：\nShe said \"\
    Hello!\" to me.\n\n### 字符方法\n\n以下是 `Character` 类子类实现的所有重要实例方法列表：\n\n* `isLetter()`\
    \ – 确定指定的 `char` 值是否为字母\n* `isDigit()` – 确定指定的 `char` 值是否为数字\n* `isWhitespace()`\
    \ – 确定指定的 `char` 值是否为空白字符\n* `isUpperCase()` – 确定指定的 `char` 值是否为大写\n* `isLowerCase()`\
    \ - 确定指定的 `char` 值是否为小写\n* `toUpperCase()` - 返回指定的大写形式的 `char` 值\n* `toLowerCase()`\
    \ - 返回指定的小写形式的 `char` 值\n* `toString()` – 返回一个 `String` 对象，该对象是包含单个字符的 `String`，表示指定的字符值\n\
    \n### 字符串 类\n\n`Strings` 在 Java 中被广泛使用，它们仅仅是字符序列。在 Java 编程中，`Strings` 被称为对象，平台提供了\
    \ `Strings` 类允许你创建并对字符串进行操作。\n\n创建字符串最简单的方法如下：\n\n```java\nString greeting = \"\
    Hello world!\";\n```\n\n每当编译器遇到代码中编写的字符串字面量时，它都会创建一个 `String` 对象。在上面的例子中，值为“Hello,\
    \ World!”.像任何其他对象一样，可以使用构造函数和 `new` 关键字来创建 `String` 对象。`String` 类中有 11 个构造函数，它们都允许你通过不同的途径（例如字符数组）提供字符串的初始值。例如：\n\
    \n```java\npublic class StringDemo{\n    public static void main(String args[]){\n\
    \        char[] helloArray = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String\
    \ helloString = new String(helloArray); \n        System.out.println( helloString\
    \ );\n    }\n}\n```\n\n执行此代码将得到以下结果：\nhello.\n\n请注意，`String` 类是不可变的。这意味着一旦你创建了它，就无法更改\
    \ `String` 对象。如果你发现需要修改字符串，则需要使用 `StringBuffer` 和 `StringBuilder` 类。\n\n### 字符串长度\n\
    \n当你使用方法来获取有关对象的信息时，该方法被称为访问器方法（accessor method）。你可以使用的其中一个是 `length()` 方法，它将返回字符串对象内部的字符数量。例如：\n\
    \n```java\npublic class StringDemo {\n    public static void main(String args[])\
    \ {\n        String palindrome = \"Dot saw I was Tod\";\n        int len = palindrome.length();\n\
    \        System.out.println( \"String Length is : \" + len );\n    }\n}\n```\n\
    \n执行此代码将产生以下结果：\nString Length is : 17\n\n### 字符串拼接\n\n`String` 类中有一个方法用于拼接两个字符串：\n\
    \n```java\nstring1.concat(string2);\n```\n\n这将返回一个在 `string1` 后面加上 `string2` 的字符串。每当编译器遇到代码中编写的字符串字面量时，它都会创建一个\
    \ `String` 对象。在上面的例子中，值为“Hello, World!”.像任何其他对象一样，可以使用构造函数和 `new` 关键字来创建 `String`\
    \ 对象。`String` 类中有 11 个构造函数，它们都允许你通过不同的途径（例如字符数组）提供字符串的初始值。例如：\n\n```java\npublic\
    \ class StringDemo{\n    public static void main(String args[]){\n        char[]\
    \ helloArray = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String helloString =\
    \ new String(helloArray); \n        System.out.println( helloString );\n    }\n\
    }\n```\n\n### 创建字符串\n\n要格式化字符串，你可以使用 `format()` 方法。`format()` 方法与 `printf()` ，但它返回一个格式化后的字符串而不是将其打印到控制台。\n\
    \n```java\nString s = String.format(\"Hello, %s!\", \"World\");\n```\n\n### 字符串方法\n\
    \n以下是 `String` 类支持的所有方法列表：\n\n* `charAt(int index)` – 返回索引处的字符\n* `compareTo(Object\
    \ o)` – 将此字符串与对象进行比较\n* `compareTo(String anotherString)` – 按字典顺序比较字符串\n* `compareToIgnoreCase(String\
    \ str)` – 与字符串进行比较但忽略大小写差异\n* `concat(String str)` – 将字符串拼接到末尾\n* `contentEquals(StringBuffer\
    \ sb)` – 如果字符串与 `StringBuffer` 具有相同的序列则返回 true\n* `static copyValueOf(char[] data)`\
    \ – 返回一个表示字符的字符串\n* `static copyValueOf(char[] data, int offset, int count)` –\
    \ 与上述方法相同\n* `endsWith(String suffix)` – 测试字符串是否具有该后缀\n* `equals(Object anObject)`\
    \ – 将此字符串与对象进行比较\n* `equalsIgnoreCase(String anotherString)` – 将一个字符串与另一个比较但忽略大小写\n\
    * `byte getBytes()` – 将字符串编码为字节序列，使用默认字符集\n* `byte[] getBytes(String charsetName)`\
    \ – 与上述方法相同\n* `void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
    \ – 将字符从字符串拷贝到目标数组\n* `hashCode()` – 返回哈希码\n* `indexOf(int ch)` – 返回字符在字符串中第一次出现的索引\n\
    * `indexOf(int ch, int fromIndex)` – 与上相同，但将从指定的索引处开始搜索\n* `indexOf(String str)`\
    \ – 返回子串在字符串中第一次出现的索引\n* `indexOf(String str, int fromIndex)` – 与上相同，但从指定的索引处开始搜索\n\
    * `intern()` – 返回规范表示\n* `lastIndexOf(int ch)` – 返回字符在字符串中最后一次出现的索引\n* `lastIndexOf(int\
    \ ch, int fromIndex)` – 与上相同，但从指定的索引开始并向后搜索\n* `lastIndexOf(String str)` – 返回子串在字符串中最右侧的索引\n\
    * `lastIndexOf(String str, int fromIndex)` – 返回子串在字符串中最后一次出现的索引，但从指定的索引开始向前搜索\n\
    * `length()` – 返回字符串的长度\n* `matches(String regex)` – 字符串是否匹配指定的正则表达式\n* `regionMatches(boolean\
    \ ignoreCase, int toffset, String other, int ooffset, int len)` – 测试两个字符串区域是否相等\n\
    * `regionMatches(int toffset, String other, int ooffset, int len)` – 与上述方法相同\n\
    * `replace(char oldChar, char newChar)` – 返回一个新字符串，其结果是将所有 `oldChar` 实例替换为 `newChar`\n\
    \n"
- fmt: "\n* `String replaceAll(String regex, String replacement)` – Will replace each\
    \ substring of the string that matches a specified regular expression with a specified\
    \ replacement\n* `String replaceFirst(String regex, String replacement)` – Will\
    \ replace the first substring of the index that matches with a specified regular\
    \ expression with the specified replacement\n* `String[] split(String regex)`\
    \ – Will split the string around any matches of a specified regular expression\n\
    * `String[] split(String regex, int limit)` – Does the same as the above method\n\
    * `boolean startsWith(String prefix)` – Will test to see if the string begins\
    \ with the prefix specified\n* `boolean startsWith(String prefix, int toffset)`\
    \ – As above but tests to see if the prefix begins a specified index\n* `CharSequence\
    \ subSequence(int beginIndex, int endIndex)` – Will return a character sequence\
    \ that is a subsequence of the sequence\n* `String substring(int beginIndex)`\
    \ – Will return a new string that is a substring of the string\n* `String substring(int\
    \ beginIndex, int endIndex)` – Does the same as the above method\n* `char[] toCharArray()`\
    \ – Will convert the string into a character array\n* `String toLowerCase()` –\
    \ Will convert the characters in the string into lowercase, making use of the\
    \ default locale rules\n* `String toLowerCase(Locale locale)` – As above, using\
    \ the specified locale rules\n* `String toString()` – The string returns itself\n\
    * `String toUpperCase()` – This will convert the characters that are in this string\
    \ to upper case, making use of the default locale rules\n* `String toUpperCase(Locale\
    \ locale)` – As above but using the specified locale rules\n* `String trim()`\
    \ – Will return a copy of the string, omitting the leading and the trailing whitespace\n\
    * `static String valueOf(primitive data type x)` – Will return the representation\
    \ of the argument that is passed data type\n\n## Arrays\n\nArrays are also used\
    \ a lot in Java and these store a sequence of fixed-size elements that are all\
    \ the same type. Arrays store data collections but it is more often that an array\
    \ if thought of as a collection of variables that are the same type.\n\nInstead\
    \ of individual variables, you would declare one array variable with individual\
    \ variables represented inside.\n\n### Declaring Array Variables\n\nIf you want\
    \ to use an array, you first have to declare a variable. This is to reference\
    \ the array and you must specify which type of array the variable is able to reference.\
    \ To declare an array variable, you would use this syntax:\n\n* `dataType[] arrayRefVar;`\
    \ // preferred way.\n* or\n* `dataType arrayRefVar[];` // works but not preferred\
    \ way.\n\nFor example:\n\n* `double[] myList;` // preferred way.\n* or\n* `double\
    \ myList[];` // works but not preferred way.\n\n### Creating Arrays\n\nTo create\
    \ an array with the new operator, use this syntax:\n\n* `arrayRefVar = new dataType[arraySize];`\n\
    \nThis statement is doing two things:\n\n* It uses the `dataType[arraySize]` to\
    \ create an array\n* The reference of the array is assigned to the variable `arrayRefVar`\n\
    \nYou can declare an array variable, create a new array and assign the reference\
    \ to the variable using just one statement, like this:\n\n* `dataType[] arrayRefVar\
    \ = new dataType[arraySize];`\n\nOr you can do this:\n\n* `dataType[] arrayRefVar\
    \ = {value0, value1, ..., valuek};`\n\nThe index is used to access the array elements\
    \ and indices are 0-based, which means that they begin from 0 to `arrayRefVar.length-1`.\n\
    \nFor example: This statement shows an array variable being declared, called `myList`,\
    \ an array consisting of 10 elements created, all double type and the reference\
    \ assigned to `myList`:\n\n* `double[] myList = new double[10];`\n\n### Processing\
    \ Arrays\n\nWhen we process array elements, we tend to use `for` loop or `foreach`\
    \ loop simply because all elements are same type and we know what the array size\
    \ is. The following example shows how to create an array, initialize it and then\
    \ process it:\n\n```java\npublic class TestArray {\n    public static void main(String[]\
    \ args) {\n        double[] myList = {1.9, 2.9, 3.4, 3.5};\n        // Print all\
    \ the elements\n        for (int i = 0; i < myList.length; i++) {\n          \
    \  System.out.println(myList[i] + \" \");\n        }\n        // Summing all elements\n\
    \        double total = 0;\n        for (int i = 0; i < myList.length; i++) {\n\
    \            total += myList[i];\n        }\n        System.out.println(\"Total\
    \ is \" + total);\n        // Finding the largest element\n        double max\
