    \n# Introduction\n\nIn the year 1995, Sun Microsystems developed a high level\
    \ programming language called Java. James Gosling initiated the Java project and\
    \ released it as a core component of the Sun Microsystems' Java platform. It is\
    \ the first version of Java called the Java 1.0.\n\nThe Java code can work on\
    \ any device that has the Java virtual machine. Java guarantees its users with\
    \ the Write Once, Run Anywhere concept.\n\nThe Java programming language flexible\
    \ and its Object Oriented concepts are easy to use. Unlike many other programming\
    \ languages, which got outdated, Java is an ever-evolving language with additional\
    \ features being added with every new version.\n\nIn this tutorial we will be\
    \ discussing the core concepts and features of Java, with which anyone with a\
    \ basic knowledge on programming languages can learn Java. We’ll discuss the topics\
    \ step by step with examples making it easy to sink in.\n\nI hope you’ll find\
    \ this book helpful.\n\nHappy reading!!\n\n# Chapter 1: Java Overview\n\nThe main\
    \ features of Java that made it to stand apart from other programming languages\
    \ are.\n\n- **Object Oriented**: Everything in Java is considered as an object.\
    \ And because of its Object model it is easy to extend.\n- **Platform independent**:\
    \ When the Java code is compiled, it will be in a platform independent Byte code,\
    \ which is not the case with other programming languages. This Byte code will\
    \ be interpreted by the Java virtual machine on the platform where it is being\
    \ run.\n- **Simple**: Java is designed in such a way that it is easy to run. Java\
    \ can be mastered easily if you know the basic concepts of object-oriented programming.\n\
    - **Secure**: tamper free and virus free systems can be developed, thanks to Java\
    \ 's secure feature. Java uses the public key encryption for authentication techniques.\
    \ With Java's secure feature it enables to develop virus-free, tamper-free systems.\
    \ Authentication techniques are based on public-key encryption.\n- **Architecture-neutral\
    \ and Portable**: The files generated by the Java compiler are architecture neutral\
    \ object format files. These files can be executed on any processor that can run\
    \ a Java virtual machine. This makes Java a portable language.\n- **Robust**:\
    \ With like runtime checking and compile time checking, error prone situations\
    \ can be eliminated making Java a robust language.\n- **Multithreaded**: Java\
    \ supports the multi thread feature. With multiple threads, programs can smoothly\
    \ run different tasks at the same time. This helps the developers constructing\
    \ interactive applications.\n- **Interpreted**: The Java byte code can be translated\
    \ to the native machine language. This will not be stored anywhere. The linking\
    \ process is Java is a lightweight and incremental process making the development\
    \ process analytical and more rapid.\n- **High Performance**: Java ensures the\
    \ users with high performance with its Just-In-Time compilers.\n- **Distributed**:\
    \ The design of Java is in such a way that it can be used on the distributed environment\
    \ of the Internet.\n- **Dynamic**: The Java programs are capable of carrying extensive\
    \ amounts of information during runtime, which in turn can be used for the verification\
    \ and for resolving access of objects during run-time. This makes a dynamic programming\
    \ language.\n\n# Chapter 2: Java Basic Syntax\n\nIn this chapter we will learn\
    \ the basic syntax of methods, classes, objects etc. We know that Java is an object\
    \ oriented programming language, and a program in Java is nothing but a collection\
    \ of objects. These objects communicate with each other by invoking the other\
    \ objects methods. Now, we will see what an object, class, instances and methods\
    \ mean.\n\n- **Object**: Objects have states and behaviors. Example: A car has\
    \ states - color, name, model as well as behaviors - accelerating, braking, cruising.\
    \ An object can be defined as an instance of a class.\n- **Class**: A class in\
    \ computers can be defined as a blueprint or a template that describes the states\
    \ or behaviors that an object supports.\n- **Methods**: A method can basically\
    \ be defined as a behavior. The logic is written inside methods. A class can contain\
    \ any number of methods. All the actions and data manipulations are executed inside\
    \ methods.\n"
