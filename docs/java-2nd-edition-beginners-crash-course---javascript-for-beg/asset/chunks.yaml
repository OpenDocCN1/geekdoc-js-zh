    *   public class StringDemo {\n\n*   public static void main(String args[]) {\n\
    \n*   String palindrome = \"Dot saw I was Tod\";\n\n*   int len = palindrome.length();\n\
    \n*   System.out.println( \"String Length is : \" + len );\n\n*   }\n\n*   }\n\
    \nExecuting this code would produce this result:\n\n*   String Length is : 17\n\
    \n### Concatenating Strings\n\nThere is a method in the String class for concatenating\
    \ two strings:\n\n*   string1.concat(string2);\n\nThis will return a string that\
    \ is string1 with the addition of string2 on the end of it. The concat() method\
    \ can also be used with string literals, as such:\n\n*   \"My name is \".concat(\"\
    Zara\");\n\nNormally, we use the + operator to concatenate two strings:\n\n* \
