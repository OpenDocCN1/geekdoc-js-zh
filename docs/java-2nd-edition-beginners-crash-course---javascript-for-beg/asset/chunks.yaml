  trans: "\n\n# 实例变量\n\n每个对象都拥有自己的一组独特的变量。这些变量被称为实例变量（instance variables）。这些实例变量会被赋予值，并用于定义对象的状态。\n\
    \n## 基础语法\n\n在 Java 中编程时，应始终遵循以下几点。\n\n- 大小写敏感 - Java 语言对大小写敏感。因此，在编写 Java 程序时需要小心。`Phoenix`\
    \ 和 `phoenix` 之间是不相同的，它们在 Java 中具有不同的含义。\n- 类名 - 在编写类名时，第一个字母始终应该是大写字母。例如 `Car`、`Bike`、`Laptop`\
    \ 等。如果使用多个单词组合作为类名，则这些每个单词的首字母都应该大写。例如类 `JavaExampleClass`。\n- 方法名 - 在调用方法时，方法名应始终以小写字母开头。如果使用多个单词来命名该方法，方法的第一个字母将是小写，而内部单词的第一个字母应该大写。例如：`public\
    \ void exampleJavaMethodName()`。\n- 程序文件名 - 类名和程序文件名必须完全相同。\n- 始终记住使用类名保存文件，并在名称末尾添加\
    \ `.java`。例如，如果类名为 `BananaNutellaPancake`，则文件名应为 `BananaNutellaPancake.java`。\n\
    - `public static void main (String args[])` - 编译器将从 `main()` 方法开始处理程序。因此，没有 `main()`\
    \ 方法就无法在 Java 中编写程序。\n\n# 第 3 章：对象与类\n\n在存在的各种类型语言中，Java 被归类为面向对象的语言。所有面向对象的语言都支持以下基本概念：\n\
    \n- 多态（Polymorphism）：一个对象可以以多种形式存在的情况。例如，`+` 既可以用于加法，也可以用于字符串拼接。\n- 继承（Inheritance）：子对象获得其父类属性的情况。\n\
    - 封装（Encapsulation）：数据受到保护的情况。\n- 抽象（Abstraction）：类的声明已经完全完成，但可以使用抽象类中存在的变量和方法以不同的方式编写其功能。\n\
    - 类（Classes）：对象是使用类创建的。类由成员变量和成员函数组成。它可以被视为一个蓝图。\n- 对象（Objects）：在面向对象编程中，对象起着至关重要的作用。对象执行所有功能。它们拥有状态（变量所在的地方）和行为（变量在被放入特定方法时以特定方式运行）。\n\
    - 实例（Instance）：实例可以被视为声明在类内部但在类方法之外的变量。\n- 方法（Method）：方法可以被视为一组编写用于执行特定任务的语句。\n\
    \n## 更多关于 Java 中的对象\n\n你周围看到的任何具有物理特征的实体都可以被视为对象。所有这些都具有可以观察到的状态和行为。\n\n所有对象都具有状态和行为。这些是现实对象，现在让我们考虑软件对象，它们具有由变量显示的相似状态以及通过方法显示的行为。\n\
    \nJava 类的示例：\n\n```java\npublic class Dog{\n    String breed;\n    int age;\n\
    \    String color;\n    void barking(){\n    }\n    void hungry(){\n    }\n  \
    \  void sleeping(){\n    }\n}\n```\n\n有多种类型的变量，如局部变量、全局变量、类变量、实例变量。根据变量的作用范围，变量可以分为局部变量和全局变量。\n\
    \n- 局部变量定义在函数内部，且只能在函数内部使用。换句话说，局部变量在函数完成后就会销毁。\n- 全局变量定义在外部，其作用范围贯穿整个程序。\n- 实例变量：实例变量声明在类内部但在方法之外。它们只能被该特定类的所有方法使用。\n\
    - 实例变量：实例变量是类内部但在任何方法之外的变量。这些变量在类加载时实例化。\n- 类变量是类似于实例变量的变量。唯一的区别是它们使用 `static`\
    \ 关键字声明。\n\n一个类可以有多个变量和方法。\n\n# 第 4 章：构造函数\n\n构造函数在涉及类时起着至关重要的作用。创建类时可以显式地创建构造函数，否则\
    \ Java 编译器会自动创建一个。每当创建一个对象时，至少会调用一个构造函数。一个类可以有多个构造函数。构造函数的名称必须与类相同。每个构造函数都必须有一个析构函数。\n\
    \n构造函数的示例：\n\n```java\npublic class Puppy{\n    public Puppy(){\n    }\n    public\
    \ Puppy(String name) {\n        // 这个构造函数有一个参数，name。\n    }\n}\n```\n\n### 创建对象\n\
    \n如前所述，类为对象提供了蓝图。所以基本上对象是从类创建的。在 Java 中，使用 `new` 关键字来创建新对象。\n\n从类创建对象有三个步骤：\n\
    1. 声明：一个带有变量名和对象类型的变量声明。\n2. 实例化：使用 `new` 关键字创建对象。\n3. 初始化：在 `new` 关键字之后紧跟对构造函数的调用。该调用初始化了新对象。\n\
    \n创建对象的示例下所示：\n\n```java\npublic class Puppy{\n    public Puppy(String name) {\n\
    \        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is :\"\
    \ + name );\n    }\n    public static void main(String args){\n        // 下述语句将创建一个对象\
    \ myPuppy\n        Puppy myPuppy = new Puppy( \"jimmy\" );\n    }\n}\n```\n\n\
    编译并运行上述程序，将产生：\n`Passed Name is :jimmy`\n\n访问实例变量\n\n实例变量和方法通过创建的对象来访问。要访问实例变量，应使用全限定路径：\n\
    `/* 首先创建一个对象 */`\n`ObjectReference = new Constructor();`\n`/* 现在调用变量 */`\n`ObjectReference.variableName;`\n\
    `/* 现在你可以调用类方法 */`\n`ObjectReference.MethodName();`\n\n示例：此示例解释了如何访问类的实例变量和方法：\n\
    \n```java\npublic class Puppy{\n    int puppyAge;\n    public Puppy(String name)\
    \ {\n        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is\
    \ :\" + name );\n    }\n    public void setAge( int age ){\n        puppyAge =\
    \ age;\n    }\n    public int getAge( ) {\n        System.out.println(\"Puppy's\
    \ age is :\" + puppyAge );\n        return puppyAge;\n    }\n    public static\
    \ void main(String []args){\n        /* 对象创建 */\n        Puppy myPuppy = new Puppy(\
    \ \"jimmy\" );\n        /* 调用类方法设置狗的年龄 */\n        myPuppy.setAge( 2 );\n    \
    \    /* 调用另一个类方法获取狗的年龄 */\n        myPuppy.getAge( );\n        /* 你也可以这样访问实例变量\
    \ */\n        System.out.println(\"Variable Value :\" + myPuppy.puppyAge );\n\
    \    }\n}\n```\n\n# 第 5 章：Java 包\n\n简单来说，Java 包可以定义为一类分类好的接口和类。在开发应用程序时，对这些类和接口进行分类是必须，因为会使用大量的接口和类。分类可以使工作变得更容易。\n\
    \n## 导入语句\n\nJava 中的全限定名包含类名和包名，传递给编译器后，编译器可以轻松找到类或源代码。通过向编译器提供导入语句，我们提供了特定类的位置。\n\
    \n"
- fmt: "\nIn this example, this line will tell the compiler to load the classes present\
    \ in the `java_installation/java/io` directory.\n\n```java\nimport java.io.*;\n\
    ```\n\n# A Simple Case Study\n\nHere, we will create two classes `Employee` and\
    \ `EmployeeTest` for case study.\n\n*   Open notepad and write the code given\
    \ below. You should remember that this is the `Employee` class and it is a public\
    \ class.\n*   Save this file with the name `Employee.java`.\n\nThere are four\
    \ instance variables present in the `Employee` class namely `name`, `age`, `designation`\
    \ and `salary`. This class has also got an explicitly defined constructor. This\
    \ constructor takes a parameter.\n\nExample:\n\n```java\nimport java.io.*;\n\n\
    public class Employee{\n\n  String name;\n\n  int age;\n\n  String designation;\n\
    \n  double salary;\n\n  // This is the constructor of the class Employee\n\n \
    \ public Employee(String name){\n    this.name = name;\n  }\n\n  // Assign the\
    \ age of the Employee  to the variable age.\n\n  public void empAge(int empAge){\n\
    \    age =  empAge;\n  }\n\n  /* Assign the designation to the variable designation.*/\n\
    \  public void empDesignation(String empDesig){\n    designation = empDesig;\n\
    \  }\n\n  /* Assign the salary to the variable             salary.*/\n  public\
    \ void empSalary(double empSalary){\n    salary = empSalary;\n  }\n\n  /* Print\
    \ the Employee details */\n  public void printEmployee(){\n    System.out.println(\"\
    Name:\"+ name );\n    System.out.println(\"Age:\" + age );\n    System.out.println(\"\
    Designation:\" + designation );\n    System.out.println(\"Salary:\" + salary);\n\
    \  }\n\n}\n```\n\nAs previously mentioned, the process of the program starts only\
    \ after the `main()` method. So there should be a `main` method and a few objects\
    \ should be present for this `Employee` class to run. And for these tasks there\
    \ will be a separate class created.\n\nThe `EmployeeTest` class is given below\
    \ and it creates two instances that belong to the `Employee` class. These objects\
    \ invoke the methods for every object and they will assign values for all variables.\n\
    \nSave the given code in the file `EmployeeTest.java`.\n\n```java\nimport java.io.*;\n\
    \npublic class EmployeeTest{\n\n  public static void main(String args[]){\n  \
    \  /* Create two objects using constructor */\n    Employee empOne = new Employee(\"\
    James Smith\");\n    Employee empTwo = new Employee(\"Mary Anne\");\n\n    //\
    \ Invoking methods for each object created\n    empOne.empAge(26);\n    empOne.empDesignation(\"\
    Senior Software Engineer\");\n    empOne.empSalary(1000);\n    empOne.printEmployee();\n\
    \n    empTwo.empAge(21);\n    empTwo.empDesignation(\"Software Engineer\");\n\
    \    empTwo.empSalary(500);\n    empTwo.printEmployee();\n  }\n\n}\n```\n\nCompile\
    \ both of these classes and run the `EmployeeTest` and it will give the following\
    \ output.\n\n```bash\nC :> javac Employee.java\nC :> vi EmployeeTest.java\nC :>\
    \ javac EmployeeTest.java\nC :> java EmployeeTest\nName:James Smith\nAge:26\n\
    Designation:Senior Software Engineer\nSalary:1000.0\nName:Mary Anne\nAge:21\n\
    Designation:Software Engineer\nSalary:500.0\n```\n\n# Chapter 6: Data Types In\
    \ Java\n\nVariables can be defined as a result of memory locations that are used\
    \ for storing values. When you create a variable you're actually reserving memory\
    \ space on your system.\n\nThe operating system will allocate memory basing on\
    \ the datatype of the variable. The operating system will then decide what can\
    \ be stored in that memory reserved. Different data types can be assigned to variables\
    \ allowing you to store characters, integers in these reserved spaces or variables.\n\
    \nIn Java, there are two data types available. They are:\n\n*   Primitive Data\
    \ Types\n*   Reference/Object Data Types\n\n## Primitive Data Types\n\nJava supports\
    \ eight data types that are primitive. These primitive data types are named by\
    \ a keyword and are already predefined. Now we will have a look at these eight\
    \ primitive data types in Java.\n\n### byte:\n\n*   `Byte` data type is an 8-bit\
    \ signed two's complement integer.\n*   The minimum value of a `byte` is `-128`\
    \ (`-2^7`).\n*   The maximum value of a `byte` is `127` (inclusive)(`2^7 -1`).\n\
    *   The default value of a `byte` is `0`.\n*   With the `byte` data type, space\
    \ can be saved for large arrays as it is one fourth of an `int`.\n*   Example:\
    \ `byte x=20, byte y=-4`.\n\n### short:\n\n*   `Short` data type is a 16-bit signed\
    \ two's complement integer.\n*   The minimum value that can be stored in a `short`\
    \ is `-32768` (`-2^15`).\n*   The maximum value that can be stored in a `short`\
    \ is `32767` (inclusive) (`2^15 -1`).\n*   The `short` data type is half the size\
    \ of an `int` and twice that of `byte`.\n*   The `short` data type is also used\
    \ to save memory.\n*   Default value of the `short` is `0`.\n*   Example: `short\
    \ p=15000, short q=-2000`.\n\n### int:\n\n*   `Int` data type is a 32-bit signed\
    \ two's complement integer.\n*   The minimum value that can be stored in an `int`\
    \ is `-2147483648` (`-2^31`).\n*   The maximum value that can be stored in an\
    \ `int` is `2147483647` (inclusive) (`2^31 -1`).\n*   The `int` Data type is generally\
    \ used for storing values by default unless there is a concern about the memory\
    \ being allocated.\n*   The default value of an `int` is `0`.\n*   Example: `int\
    \ i=123000, int j=-15000`.\n\n### long:\n\n*   `Long` data type is a 64-bit signed\
    \ two's complement integer.\n*   The minimum value that can be stored in a `long`\
    \ is `-9223372036854775808` (`-2^63`).\n*   The maximum value that can be stored\
    \ in a `long` is `9223372036854775807` (inclusive) (`2^63 -1`).\n*   We use the\
    \ `long` data type in cases where the range of `int` is not sufficient.\n*   The\
    \ default value of a `long` is `0L`.\n*   Example: `long a=145600L, int b=-450000L`.\n\
    \n### float:\n\n*   `Float` data type is a single-precision 32-bit IEEE 754 floating\
    \ point.\n*   The `float` data type is mainly used for saving the memory in large\
    \ arrays where the floating Point numbers are used.\n*   The default value of\
    \ a `float` is `0.0f`.\n*   For storing precise values like currency values, the\
    \ `float` datatype is never used.\n*   Example: `float f1=213.5f`.\n\n### double:\n\
    \n*   `double` data type is a double-precision 64-bit IEEE 754 floating point.\n\
    *   For storing decimal values, the `double` datatype is generally the default\
    \ choice.\n*   The `double` datatype, just like the `float` data type, should\
    \ never be used for storing precise values.\n*   The default value of a `double`\
    \ is `0.0d`.\n*   Example: `double d1=1234.5`.\n\n### boolean:\n\n*   `boolean`\
    \ data type represents one bit of information.\n*   The `Boolean` data type has\
    \ only two possible values: True or False.\n*   This data type is used for true/false\
    \ conditions.\n*   The default value of this data type is `false`.\n*   Example:\
    \ `boolean one=false`.\n\n### char:\n\n*   `char` data type is a single 16-bit\
    \ Unicode character.\n*   The minimum value that can be stored in a `char` is\
    \ `\\u0000` (or 0).\n*   The maximum value that can be stored in a `char` is `\\\
    uffff` (or 65535).\n*   Any character can be stored in the `char` data type.\n\
    *   Example: `char letterA='A'`.\n\n## Reference Data Types\n\nUsing the defined\
    \ constructors the Java classes, reference variables can be created.\n\n*   Reference\
    \ variables are used for accessing objects. Once these are declared with a data\
    \ type they cannot be changed. For example: `Vehicle`, `Student` etc.\n*   The\
    \ class objects and different types of array variables are all different data\
    \ types.\n*   The default value for any given reference variable is `NULL`.\n\
    *   Any declared are compatible object can be referred using the reference variable.\n\
    *   Example: `Vehicle vehicle=new Vehicle(\"hellcat\")`.\n\n## Java Literals\n\
    \nA literal in Java can be defined as the representation of the source code of\
    \ a fixed value. Literals are directly represented without any computation in\
    \ the code.\n\nFor any given primitive type variable, Literals can be assigned.\
    \ For example:\n\n```java\nbyte a=68;\n\nchar a='A'\n```\n"
