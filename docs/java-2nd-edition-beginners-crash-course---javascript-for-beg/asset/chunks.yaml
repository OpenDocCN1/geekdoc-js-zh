    \ code inside it will be executed and none of the other `else if` or `else` statements\
    \ will be tested.\n\nSyntax:\nThe syntax of `if...else if...else` is:\n```\nif(Boolean_expression\
    \ 1){\n    //Executes when the Boolean expression 1 is true\n}\nelse if(Boolean_expression\
    \ 2){\n    //Executes when the Boolean expression 2 is true\n}\nelse if(Boolean_expression\
    \ 3){\n    //Executes when the Boolean expression 3 is true\n}\nelse {\n    //Executes\
    \ when none of the above condition is true\n}\n```\nExample:\n```java\npublic\
    \ class Test {\n  public static void main(String args[]){\n    int x = 30;\n \
    \   if( x == 10 ){\n      System.out.print(\"Value of X is 10\");\n    }else if(\
    \ x == 20 ){\n      System.out.print(\"Value of X is 20\");\n    }else if( x ==\
    \ 30 ){\n      System.out.print(\"Value of X is 30\");\n    }else{\n      System.out.print(\"\
    This is else statement\");\n    }\n  }\n}\n```\nThe above code will produce the\
    \ following output:\nValue of X is 30\n\n### Nested if...else Statement\n\nA nested\
    \ `if` or nested `else` statements are those which have another statement inside\
    \ them. A statement is said to be a nested `if` statement if it contains an `if`\
    \ statement inside an `if` statement. Similarly, the nested `else` is nothing\
    \ an `else` statement that has another `else` statement written in it. You can\
