    \ programmatic exceptions can be defined as the exceptions that are thrown by\
    \ the API or by the application. Example: `IllegalStateException`, `IllegalArgumentException`,\
    \ etc.\n\n# Chapter 11: How to Install Java\n\nNow that you know what Java consists\
    \ of, it’s time to install it on your computer and look at actually using it.\
    \ You will need a computer or laptop running Windows, Linux, OS X or Solaris for\
    \ this.\n\n## How to Install Java on Windows\n\nWith Windows you can download\
    \ and install Java both online or offline.\n\n### Online\n\nDownloading Java online\
    \ will result in an Install From The Web (IFTW) executable file being downloaded\
    \ and this requires the absolute minimum of intervention from you. Running this\
    \ program will allow all the required files to be pulled in from the web so it\
    \ is important that you stay connected to the internet throughout the installation\
    \ process.\n\n- You will require Administrative permissions in order to install\
    \ Java onto Microsoft Windows.\n- If you have any trouble with this method, try\
    \ the offline method, which I will detail after this one.\n\n### Installation\n\
    \n- For Windows 2008 Server, 7, 8/8.1, XP, Server 2012, Vista, Windows 10\n\n\
    Before you begin with the installation, disable your firewall. Some ae se to reject\
    \ any online or automatic installations, like Java and, if the firewall is on\
    \ or not configured correctly it can hold the download up or stop it altogether.\n\
    \n- Open the [Manual download](https://java.com/en/download/manual.jsp) page.\n\
    - Click Windows Online.\n- A window will appear with the option of running or\
    \ saving the file – click on Run if you want to go ahead with the installation\
    \ now – if you prefer to do it later, click on Save and make a note of where it\
    \ is saved.\n- If you click on Run now, the installation process will start straightaway.\n\
    - Click on Install to accept the licensing terms and to go on with the process.\n\
    - You may be presented with offers of various programs to install during the Java\
    \ installation – this is because of a partnership between Oracle and several other\
    \ companies. If you want to install any of them, make sure they are ticked and\
    \ click on Next.\n- Follow the on-screen directions to complete the installation\
    \ and, on the last dialog window, click on Close. This will finish the installation.\n\
    \nIntegrated into the installer is an Uninstall program. The idea of this is to\
    \ detect and remove older versions of Java that may be installed on your computer.\
    \ This works on both Windows 32 and 64-bit systems.\n\nThe installer will also\
    \ tell you if Java content has been turned off in your web browsers and will give\
    \ you instructions to follow on enabling it. If you chose to hide security prompts\
    \ for Java Web Start applications and applets, you will also be given instructions\
    \ on how to restore those prompts. You may need to reboot your computer if you\
    \ don’t restart a browser when requested to do so.\n\n### Offline\n\nThis method\
    \ involves the download of an executable file, which has all of the files that\
    \ you will need, so that you can install Java in your own time. You will not need\
    \ to be connected to the internet for the installation, only for the initial download.\
    \ You can also copy the file and then install it on another computer that isn’t\
    \ connected to the network.\n\nAgain, you do require Administrative permissions\
    \ to do this.\n\n- Open the [Manual download](https://java.com/en/download/manual.jsp)\
    \ page.\n- Click on Windows Offline.\n- A dialog window appears, click on Save.\n\
    - Make sure you save the file somewhere easy to locate, such as you desktop.\n\
    - Close down your browser and any other application that may be running.\n- When\
    \ you ae ready to install, double-click the file.\n- The process will begin, click\
    \ on Install to accept the terms and carry on with the installation.\n- Again,\
    \ you may be offered various other programs to install; choose the ones you want,\
    \ if any, and click on Next.\n- Follow the on-screen directions for completion,\
    \ clicking on Close on the las window to complete the installation.\n\nAs with\
    \ the online method, the uninstall tool will detect older versions of Java and\
    \ remove them and will also provide you with instructions to enable Java content\
    \ in your browsers if it has been previously disabled. Instructions will also\
    \ be given to enable to prompts for applets and Java Web Start applications.\n\
    \n## How to Install Java on Mac OS X\n\nJava can be installed on any Mac running\
    \ OS X 10.7.3 with a 64-bit browser – Firefox or Safari, for example. 32-bit browsers\
    \ are NOT supported. You will need Administrator permissions.\n\n- Download this\
    \ file – [jre-8u60-macosx-x64.dmg](http://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html)\
    \ – don’t forget to accept the license terms first.\n- Double click the file to\
    \ launch the installation wizard.\n- On the Welcome screen that appears, click\
    \ on Next.\n- Choose any, none of the optional programs that are presented to\
    \ you then click on Next.\n- Follow the on-screen directions to complete the installation.\n\
    - Click on Close on the final window to complete the installation.\n\nThe same\
    \ applies to Mac as it does to Windows – if you have disabled Java content in\
    \ your browsers and/or disabled the prompts for applets and Java Web Start applications,\
    \ instructions will be provided on how to enable them.\n\n## How to Download Java\
    \ on Linux\n\nThere are two packages to choose from:\n\n- **Linux platforms**:\
    \ an archive binary file that anyone can download, in any location that is writeable.\
    \ Only a ROOT USER can download to the system location though.\n- **RPM-based\
    \ Linux platforms**: for 32-bit RPM-based Linux platforms, which have an RPM binary\
    \ file in the system – this can only be done by ROOTERS.\n\nMake sure you choose\
    \ the package that matches your system and privileges. This will work on Linux\
    \ Red Hat, SUSE, Oracle, Enterprise and SLES.\n\n- Open [http://java.com](http://java.com).\n\
    - Click on Download.\n- Choose the right package to suit your requirements.\n\
    - Note the size of the file before you download and, once the download is complete,\
    \ check that the full package has downloaded.\n\n### Linux Platforms\n\nFor the\
    \ purposes of this, we are using v7 – make sure you use the version numbers that\
    \ correspond with what you have downloaded.\n\nOpen the terminal and change to\
    \ the relevant directory, the one you want to install Java to by typing:\n\n-\
    \ `cd <directoryName>`\n\n- Locate the `.tar.gz` archive binary and move it to\
    \ the new directory.\n- Unpack tarball and install Java – `tar zxvf jre-7u7-linux-1586.tar.gz`\n\
    \nYou will find the Java files in a directory named `jre1.7._.07`, which you will\
    \ find in the current directory.\n\n- Delete the file ending `.tar.gz` if you\
    \ want more disk space.\n\n### RPM-based Linux Platforms\n\nAgain, I am using\
    \ v7 so make sure you use the correct numbers for your particular version when\
