    \  }\n}\n```\n\nCompiling and running the program with various command line arguments\
    \ will give the following output.\n\n```bash\n$ java Test\nWell done\nYour grade\
    \ is a C\n$\n```\n\n# Chapter 10: Exceptions\n\nAn exception can be defined as\
