    ### Precedence of Java Operators


    The grouping of terms in a given expression will be determined by operator precedence.
    Some operators will have higher precedence over other operators. For example,
    the multiplication operator will always have a higher precedence when compared
    to the addition operator. The operators which have higher precedence will be executed
    first.


    The lists of all the operators arranged in accordance to their precedence are
    given below. The operators that have higher precedence are placed on the top and
    they go down the table in decreasing order.


    | Category | Operator | Associativity |


    | Postfix | () [] . (dot operator) | Left to right |


    | Unary | ++ - - ! ~ | Right to left |


    | Multiplicative   | * / % | Left to right |


    | Additive   | + - | Left to right |


    | Shift   | >> >>> <<   | Left to right |


    | Relational   | > >= < <=   | Left to right |


    | Equality   | == != | Left to right |


    | Bitwise AND | & | Left to right |


    | Bitwise XOR | ^ | Left to right |


    | Bitwise OR | &#124; | Left to right |


    | Logical AND | && | Left to right |


    | Logical OR | &#124;&#124; | Left to right |


    | Conditional | ?: | Right to left |


    | Assignment | = += -= *= /= %= >>= <<= &= ^= &#124;= | Right to left |


    | Comma | , | Left to right |


    # Chapter 9: Conditionals


    Java provides its users with two types of decision making statements. They are.


    *   if statements


    *   switch statements


    ### The if statement


    And if statement in Java consists of a Boolean statement. The Boolean statement
    will have one or multiple statements. These statements will get executed if the
    condition is satisfied.


    Here is the syntax for an if statement.


    Syntax:


    if(Boolean_expression)


    {


     //Statements will execute if the Boolean expression is true


    }


    The given block of code that is inside the if statement will only get executed
    if the Boolean expression returns true. If it returns a false, the control will
    go to the code that is present after the if statement. Here is an example:


    Example:


    public class Test {


     public static void main(String args[]){


        int x = 10;


        if( x < 20 ){


           System.out.print("This is if statement");


        }


     }


    }


    The program will give the following output.


    This is if statement


    ### The if...else Statement


    After an if statement, you can add an optional else statement. The code inside
    the else statement will be executed if the if statement is not satisfied. So,
    in simple terms, if the if statement returns a false, the code in the else statement
    will be executed.


    Syntax:


    Here is the syntax of an if...else statement.


    if(Boolean_expression){


     //Executes when the Boolean expression is true


    }else{


     //Executes when the Boolean expression is false


    }


    Example:


    public class Test {


     public static void main(String args[]){


        int x = 30;


        if( x < 20 ){


           System.out.print("This is if statement");


        }else{


           System.out.print("This is else statement");


        }


     }


    }


    This code will give the following output.


    This is else statement


    ### The if...else if...else Statement


    After an if statement, and optional else if.... else statement can be added. This
    statement proves to be useful in situations where various conditions are to be
    tested.


    There are a few points to remember when you are using the if, else if and else
    statements.


    *   And if condition can have any number of else conditions and the else condition
    should always be placed at the end.


    *   And if statement can be succeeded by any number of else if statements. These
    statements should always be before the else statement.


    *   Once the condition of an else if statement is satisfied, the code inside it
    will be executed and none of the other else if or else statements will be tested.


    Syntax:


    The syntax of an if...else is:


    if(Boolean_expression 1){


     //Executes when the Boolean expression 1 is true


    }else if(Boolean_expression 2){


     //Executes when the Boolean expression 2 is true


    }else if(Boolean_expression 3){


     //Executes when the Boolean expression 3 is true


    }else {


     //Executes when the none of the above condition is true.


    }


    Example:


    public class Test {


     public static void main(String args[]){


        int x = 30;


        if( x == 10 ){


           System.out.print("Value of X is 10");


        }else if( x == 20 ){


           System.out.print("Value of X is 20");


        }else if( x == 30 ){


           System.out.print("Value of X is 30");


        }else{


           System.out.print("This is else statement");


        }


     }


    }


    The above code will produce the following output.


    Value of X is 30


    ### Nested if...else Statement


    A nested if or nested else statements are nothing but which have another statement
    inside them. A statement is said to be a nested if statement if it contains an
    if statement inside an if statement. Similarly, the nested else is nothing but
    an else statement that has another else statement written in it. You can have
    any number of if or else statements inside each other.


    Syntax:


    The syntax for a nested if...else is as follows:


    if(Boolean_expression 1){


     //Executes when the Boolean expression 1 is true


     if(Boolean_expression 2){


        //Executes when the Boolean expression 2 is true


     }


    }


    You can nest else if...else in the similar way as we have nested if statement.


    Example:


    public class Test {


     public static void main(String args[]){


        int x = 30;


        int y = 10;


        if( x == 30 ){


           if( y == 10 ){


               System.out.print("X = 30 and Y = 10");


            }


         }


      }


    }


    This code will produce the following output.


    X = 30 and Y = 10


    ## The switch statement


    Switch statement can be used for testing the equality with a given list of values.
    Each of those values is called a case. The variable will be compared with each
    case and tested.


    Here is an example.


    switch(expression){


      case value :


         //Statements


         break; //optional


      case value :


         //Statements


         break; //optional


      //You can have any number of case statements.


      default : //Optional


         //Statements


    }


    The set of rules given below apply to a switch statement.


    *   The byte, short, int and char are the only variables that can be used in a
    switch statement.


    *   The number of case statements for a switch statement is not limited to one.
    It can have multiple case statements and there is no limit to it. Each case will
    have a value with which it will be compared and a colon at the end.


    *   The switch variable and the value of the case should be of the same data type.


    *   The switch variable and the case datatype should be literal or a constant.


    *   If the switch variable and the case are equal, the statement that are present
    after the case will continue to execute till the control finds a break statement.


    *   This switch terminates after the control reaching the break statement. The
    control now goes to the following line that is present after the switch statement.'
