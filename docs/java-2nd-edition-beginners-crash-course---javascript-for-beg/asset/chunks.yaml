    Salary:1000.0


    Name:Mary Anne


    Age:21


    Designation:Software Engineer


    Salary:500.0


    # Chapter 6: Data Types In Java


    Variables can be defined as a result of memory locations that are used for storing
    values. When you create a variable you''re actually reserving memory space on
    your system.


    The operating system will allocate memory basing on the datatype of the variable.
    The operating system will then decide what can be stored in that memory reserved.
    Different data types can be assigned to variables allowing you to store characters,
    integers in these reserved spaces or variables.


    In Java, there are two data types available. They are.


    ·        Primitive Data Types


    ·        Reference/Object Data Types


    Primitive Data Types:


    Java supports eight data types that are primitive. These primitive data types
    are named by a keyword and are already predefined. Now we will have a look at
    these eight primitive data types in Java.


    byte:


    ·        Byte data type is an 8-bit signed two''s complement integer.


    ·        The minimum value of a byte is -128 (-2^7)


    ·        The maximum value of a byte is 127 (inclusive)(2^7 -1)


    ·        The default value of a byte is 0


    ·        With the byte data type, space can be saved for a large arrays as it
    is one fourth of an int.


    ·        Example: byte x= 20, byte y= -46


    short:


    ·        Short data type is a 16-bit signed two''s complement integer.


    ·        The minimum value that can be stored in a short is  -32,768 (-2^15).


    ·        The maximum value that can be stored in a short is 32,767 (inclusive)
    (2^15 -1).


    ·        The short data type is half the size of an int and twice that of a byte.


    ·        The short data type is also used to save memory.


    ·        Default value of the short is 0.


    ·        Example: short p= 15000, short q= -12000.


    int:


    ·        Int data type is a 32-bit signed two''s complement integer.


    ·        The minimum value that can be stored in an int is -2,147,483,648.(-2^31).


    ·        The maximum value that can be stored in an int is 2,147,483,647(inclusive).(2^31
    -1).


    ·        The int Data type is generally used for storing integer values by default
    unless there is a concern about the memory being allocated.


    ·        The default value of an int is 0.


    ·        Example: int I= 123000, int j= -150000.


    long:


    ·        Long data type is a 64-bit signed two''s complement integer.


    ·        The minimum value that can be stored in a long is -9,223,372,036,854,775,808.(-2^63).


    ·        The maximum value that can be stored in a long is 9,223,372,036,854,775,807
    (inclusive). (2^63 -1).


    ·        We use the long data type in cases where the range of int is not sufficient.


    ·        The default value of a long is 0L.


    ·        Example: long a = 145600L, int b = -450000L


    float:


    ·        Float data type is a single-precision 32-bit IEEE 754 floating point.


    ·        The float data type is mainly used for saving the memory in large arrays
    where the floating Point numbers are used.


    ·        The default value of a float is 0.0f.


    ·        For storing precise values like currency values, the float datatype is
    never used.


    ·        Example: float f1 = 213.5f.


    double:


    ·        double data type is a double-precision 64-bit IEEE 754 floating point.


    ·        For storing decimal values, the double datatype is generally the default
    choice.


    ·        The double datatype, just like the float data type, should never be used
    for storing precise values.


    ·        The default value of a double is 0.0d.


    ·        Example: double d1 = 1234.5


    boolean:


    ·        boolean data type represents one bit of information.


    ·        The Boolean data type has only two possible values. True or False.


    ·        This data type is used for true/false conditions.


    ·        The default value of this data type is false.


    ·        Example: boolean one = false.


    char:


    ·        char data type is a single 16-bit Unicode character.


    ·        The minimum value that can be stored in a char is ''\u0000'' (or 0).


    ·        The maximum value that can be stored in a char is ''\uffff'' (or 65,535
    inclusive).


    ·        Any character can be stored in the char data type.


    ·        Example: char letterA =''A''


    ## Reference Data Types


    Using the defined constructors the Java classes, reference variables can be created.


    ·        Reference variables are used for accessing objects. Once these are declared
    with a data type they cannot be changed. For example: Vehicle, Student etc.


    ·        The class objects and different types of array variables are all different
    data types.


    ·        The default value for any given reference variable is NULL.


    ·        Any declared are compatible object can be referred using the reference
    variable.


    ·        Example: Vehicle vehicle = new Vehicle("hellcat");


    ## Java Literals


    A literal in Java can be defined as the representation of the source code of a
    fixed value. Literals are directly represented without any computation in the
    code.


    For any given primitive type variable, Literals can be assigned. For example:


    byte a = 68;


    char a = ''A'''
