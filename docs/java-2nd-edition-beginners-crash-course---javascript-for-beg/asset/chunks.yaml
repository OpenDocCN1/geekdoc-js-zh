    \ |\n| 关系 | `> >= < <=` | 从左到右 |\n| 等于 | `== !=` | 从左到右 |\n| 按位与 | `&` | 从左到右\
    \ |\n| 按位异或 | `^` | 从左到右 |\n| 按位或 | `|` | 从左到右 |\n| 逻辑与 | `&&` | 从左到右 |\n| 逻辑或\
    \ | `||` | 从左到右 |\n| 条件 | `?:` | 从右到左 |\n| 赋值 | `= += -= *= /= %= >>= <<= &= ^=\
    \ |=` | 从右到左 |\n| 逗号 | `,` | 从左到右 |\n\n# 第 9 章：条件语句\n\nJava 为用户提供了两种类型的决策语句。它们是：\n\
    - `if` 语句\n- `switch` 语句\n\n### if 语句\n\nJava 中的 `if` 语句由一个 `Boolean` 语句组成。该语句将一个或多个语句。如果满足条件，则这些语句将被执行。以下是\
    \ `if` 语句的语法。\n\n语法：\n```\nif(Boolean_expression)\n{\n    // 如果布尔表达式为真，则执行语句\n\
    }\n```\n`if` 语句内部给定的代码块只有在布尔表达式返回真时才会被执行。如果返回假，控制权将转移到 `if` 之后的代码。以下是一个示例：\n\n\
    ```java\npublic class Test {\n  public static void main(String args[]){\n    int\
    \ x = 10;\n    if( x < 20 ){\n      System.out.print(\"This is if statement\"\
    );\n    }\n  }\n}\n```\n程序将给出以下输出：\nThis is if statement\n\n### if...else 语句\n\
    \n在 `if` 语句之后，你可以添加一个可选的 `else` 语句。如果 `if` 语句不满足，则 `else` 语句中的代码将被执行。因此简单来说，如果\
    \ `if` 语句返回假，则 `else` 语句中的代码将被执行。\n\n语法：\n这里是 `if...else` 语句的语法。\n```\nif(Boolean_expression){\n\
    \    // 当布尔表达式为真时执行\n}\nelse{\n    // 当布尔表达式为假时执行\n}\n```\n示例：\n```java\npublic\
    \ class Test {\n  public static void main(String args[]){\n    int x = 30;\n \
    \   if( x < 20 ){\n      System.out.print(\"This is if statement\");\n    }\n\
    \    else{\n      System.out.print(\"This is else statement\");\n    }\n  }\n\
    }\n```\n这段代码将给出以下输出：\nThis is else statement\n\n### if...else if...else 语句\n\n\
    在 `if` 语句之后，可以添加可选的 `else if....` 语句。这种语句在需要测试各种条件的情况下被证明非常有用。在使用 `if`、`else if`\
    \ 和 `else` 语句时，有几点需要记住：\n- `if` 条件可以有任意数量的 `else if` 条件，且 `else` 条件应该始终放在最后。\n\
    - `if` 语句可以跟随着任意数量的 `else if` 语句。这些语句应该始终位于 `else` 语句之前。\n- 一旦 `if` 语句被满足，就不会再执行后续的\
    \ `else if` 语句。当 `else if` 语句满足后，其内部的代码将被执行。\n\n语法：\n`if...else if...else` 语句的语法如下：\n\
    ```\nif(Boolean_expression){\n    // 当布尔表达式为真时执行\n}\nelse if(Boolean_expression){\n\
    \    // 当布尔表达式为真时执行\n}\nelse{\n    // 当所有布尔表达式为假时执行\n}\n```\n示例：\n```java\npublic\
    \ class Test {\n  public static void main(String args[]){\n    int x = 30;\n \
    \   if( x < 20 ){\n      System.out.print(\"This is if statement\");\n    }\n\
    \    else if( x < 40 ){\n      System.out.print(\"This is else if statement\"\
    );\n    }\n    else{\n      System.out.print(\"This is else statement\");\n  \
    \  }\n  }\n}\n```\n这段代码将产生输出：\nThis is else if statement\n\n### 嵌套 if...else 语句\n\
    \n嵌套的 `if` 或 `else` 语句是指其内部包含另一个语句的语句。如果一个 `if` 语句的内部包含另一个 `if` 语句，则它被称为嵌套 `if`\
    \ 语句。同样，如果 `else` 语句内部包含另一个 `else` 语句，则它是嵌套 `else` 语句。\n\n语法：\n嵌套 `if...else`\
    \ 的语法如下：\n```\nif(Boolean_expression1){\n    // 当布尔表达式 1 为真时执行\n    if(Boolean_expression2){\n\
    \        // 当布尔表达式 2 为真时执行\n    }\n}\n```\n示例：\n```java\npublic class Test {\n\
    \  public static void main(String args[]){\n    int x = 30;\n    int y = 10;\n\
    \    if( x == 30 ){\n      if( y == 10 ){\n        System.out.print(\"X = 30 and\
    \ Y = 10\");\n      }\n    }\n  }\n}\n```\n这段代码将产生输出：\nX = 30 and Y = 10\n\n###\
    \ switch 语句\n\n`switch` 语句可以用于与给定的值列表进行等性测试。这些值中的每一个被称为 `case`。变量将与每个 `case` 进行比较并测试。\n\
    \n以下是一个示例：\n```\nswitch(expression){\n    case value :\n        //语句\n       \
    \ break; //可选\n    case value :\n        //语句\n        break; //可选\n    default\
    \ : //可选\n        //语句\n}\n```\n以下规则适用于 `switch` 语句：\n- `byte`、`short`、`int` 和\
    \ `char` 是可以用于 `switch` 语句的唯一变量。\n- `switch` 语句的 `case` 语句数量不受限制。它可以有多个 `case`\
    \ 语句，且没有限制。\n- `switch` 变量和 `case` 的值应该是相同的数据类型。\n- `switch` 变量和 `case` 数据类型应该是字面量或常量。\n\
    - 如果 `switch` 变量和 `case` 相等，则 `case` 之后的语句将继续执行，直到控制权找到 `break` 语句。\n- 控制权到达 `break`\
    \ 语句后，`switch` 终止。控制权现在转到 `switch` 语句之后的行。\n\n示例：\n```java\npublic class Test\
    \ {\n  public static void main(String args[]){\n    int x = 30;\n    switch(x){\n\
    \      case 10:\n        System.out.print(\"X is 10\");\n        break;\n    \
    \  case 20:\n        System.out.print(\"X is 20\");\n        break;\n      default:\n\
    \        System.out.print(\"X is not 10 or 20\");\n    }\n  }\n}\n```\n这段代码将产生输出：\n\
    X is not 10 or 20\n\n"
