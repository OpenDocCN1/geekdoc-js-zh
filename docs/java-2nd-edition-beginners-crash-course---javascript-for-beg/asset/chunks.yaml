    Your grade is a C\n$\n```\n\n# 第 10 章：异常\n\n异常可以定义为中断正常执行流的问题。简单来说，它可以被定义为程序执行过程中发生的问题。导致异常发生的原因有很多，其中包括：\n\
    \n- 提供无效数据。\n- Java 虚拟机内存耗尽。\n- 通信期间网络连接终止。\n- 找不到所需的文件。\n\n某些异常是由人为错误引起的，另一些是由程序员错误引起的，其余由于物理资源故障。\n\
    \n在 Java 中，异常分为三类。为了理解异常处理的概念，你应该了解异常的类型。异常的分类分类所示：\n\n- **检查异常 (Checked exceptions)**：如果一个异常无法被程序员预见，或者它是典型的用户错误，则可以定义为检查异常。检查异常在编译期间不能被忽略。\n\
    - **运行时异常 (Runtime exceptions)**：运行时异常可以定义为程序员可能已经解决的异常。与检查异常不同，运行时异常在编译期间会被忽略。\n\
    - **错误 (Errors)**：错误可以定义为用户或程序员无法控制的问题。这些不能被视为异常。错误通常会被忽略，因为它们是无法的。例如，在栈溢出的情况下会抛出一个错误。该错误在程序编译期间会被忽略。\n\
    \n下面列出了最常见的异常（包括检查异常和未检查异常）。所有这些异常都是 [Java 内置异常](http://www.tutorialspoint.com/java/java_builtin_exceptions.htm)\
    \ 的子集。\n\n### 异常方法\n\n下面列出了 `Throwable` 类提供的所有重要方法。\n\n| 序号 | 方法及描述 |\n| --- |\
    \ --- |\n| 1 | `public String getMessage()` 此方法将返回关于发生异常的详细信息，并在 `Throwable` 构造函数内部初始化。\
    \ |\n| 2 | `public Throwable getCause()` 此方法将返回导致异常的原因，这由一个 `Throwable` 对象表示。\
    \ |\n| 3 | `public String toString()` 此消息将返回类名与 `getMessage()` 结果的拼接。 |\n| 4 |\
    \ `public void printStackTrace()` 此方法将 `toString()` 的结果结合堆栈树打印到错误输出流 `System.err`。\
    \ |\n| 5 | `public StackTraceElement [] getStackTrace()` 此方法将返回一个包含给定堆栈轨迹上每个元素的数组。索引\
    \ 0 处的元素代表给定调用栈顶部的起始，而索引 0 处的方法... |\n| 6 | `public Throwable fillStackTrace()`\
    \ 通过此方法，堆栈轨迹将被填充 `Throwable` 对象。 |\n\n## 捕获异常\n\n在 Java 中，可以使用 `try` 和 `catch`\
    \ 关键字捕获异常。如果 `try` 块中出现异常，它将传递传递给 `catch` 块。\n\n语法：\n```java\ntry {\n    // 受保护的代码\n\
    } catch (Exception e) {\n    // catch 块\n}\n```\n\n示例：\n\n```java\nimport java.io.*;\n\
    \npublic class Test {\n  public static void main(String args[]){\n    try{\n \
    \     int a[] = new int[2];\n      System.out.println(a[3]);\n    } catch(ArrayIndexOutOfBoundsException\
    \ e){\n      System.out.println(\"Exception: \" + e);\n    }\n  }\n}\n```\n输出：\n\
    ```\nException: java.lang.ArrayIndexOutOfBoundsException: 3\n```\n\n### 多个 catch\
    \ 块\n\n`try` 块后的 `catch` 块数量不限于 1。为了高效地处理异常，你可以拥有任意数量的 `catch` 块。\n\n语法：\n```java\n\
    try {\n    // 受保护的代码\n} catch (Exception1 e1) {\n    // catch 块\n} catch (Exception2\
    \ e2) {\n    // catch 块\n} catch (Exception3 e3) {\n    // catch 块\n}\n```\n如果抛出的异常匹配\
    \ `Exception1`，它将在那里被捕获。如果异常类型不匹配，它将传递给下一个 `catch` 块。此过程一直持续，直到抛出的异常被捕获或所有的 `catch`\
    \ 块结束。\n\n示例：\n\n```java\ntry {\n    file = new FileInputStream(fileName);\n \
    \   x = (byte) file.read();\n} catch(IOException i) {\n    i.printStackTrace();\n\
