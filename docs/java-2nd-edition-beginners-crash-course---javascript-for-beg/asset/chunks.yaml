    is %s\", floatVar, intVar, stringVar);\n\nBut, instead of that, you could write:\n\
    \n*   String fs;\n\n*   fs = String.format(\"The value of the float variable is\
    \ \" +\n\n*   \"%f, while the value of the integer \" +\n\n*   \"variable is %d,\
    \ and the string \" +\n\n*   \"is %s\", floatVar, intVar, stringVar);\n\n*   System.out.println(fs);\n\
    \n### String Methods\n\nBelow is a list of all the methods that the String class\
    \ supports:\n\n*   char charAt(int index) – returns the character at the index\
    \ specified\n\n*   int compareTo(Object o) – Will compare the string to an object\n\
    \n*   int compareTo(String anotherString) – will compare to strings lexicographically\n\
    \n*   int compareToIgnoreCase(String str) – Will do the same as the above but\
    \ will ignore any differences in the case\n\n*   String concat(String str) – Will\
