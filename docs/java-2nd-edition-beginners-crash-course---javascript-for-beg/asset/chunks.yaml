  trans: "\n编译上述文件并运行 `BankDemo` 将带得到以下输出。\n\n```\nDepositing $500...\nWithdrawing\
    \ $100...\nWithdrawing $600...\nSorry, but you are short $200.0\nInsufficientFundsException\n\
    \       at CheckingAccount.withdraw(CheckingAccount.java:25)\n       at BankDemo.main(BankDemo.java:13)\n\
    ```\n\n## 常见异常\n\n在 Java 中我们有两种类型的错误和异常。它们是：\n\n- **JVM 异常 (JVM Exceptions)**：JVM\
    \ 异常仅仅是由 Java 虚拟机逻辑上或排他性抛出的异常。例如：`ArrayIndexOutOfBoundsException`、`NullPointerException`、`ClassCastException`\
    \ 等。\n- **程序异常 (Programmatic exceptions)**：程序性异常可以定义为由 API 或应用程序抛出的异常。例如：`IllegalStateException`、`IllegalArgumentException`\
    \ 等。\n\n# 第 11 章：如何安装 Java\n\n现在你已经知道了 Java 的组成部分，是时候在你的计算机上安装它并查看如何实际使用了。你需要一台运行\
    \ Windows、Linux、OS X 或 Solaris 的电脑或笔记本电脑。\n\n## 如何在 Windows 上安装 Java\n\n通过 Windows，你可以在线或离线下载并安装\
    \ Java。\n\n### 在线安装\n\n在线下载 Java 将下载一个从网络安装（IFTW）的可执行文件，这需要你进行最少的干预。运行此程序将允许从网络拉取所有所需的文件，因此在整个安装过程中保持网络连接非常重要。\n\
    \n- 在 Microsoft Windows 上安装 Java，你需要管理员权限。\n- 如果你使用此方法遇到任何问题，请尝试离线方法，我将在稍后详细介绍。\n\
    \n### 安装\n\n- 适用于 Windows 2008 Server、7、8/8.1、XP、Server 2012、Vista、Windows 10\n\
    \n在开始安装之前，禁用防火墙。某些可能会拒绝任何在线或自动安装（如 Java），如果防火墙开启或未正确配置，它可能会阻塞下载或完全停止下载。\n\n- 打开[手动下载](https://java.com/en/download/manual.jsp)\
    \ 页面。\n- 点击 Windows Online。\n- 将出现一个窗口，提供运行或保存文件的选项——如果你现在就想继续安装，点击“运行”；如果你喜欢以后再做，点击“保存”并记住它保存的位置。\n\
    - 如果你现在点击“运行”，安装过程将立即开始。\n- 点击“安装”以接受许可条款并继续。\n- 在 Java 安装期间，你可能会收到安装各种程序的提议——这是由于\
    \ Oracle 与其他几家公司之间的合作伙伴关系。如果你想安装其中任何一个，请确保它们已勾选并点击“下一步”。\n- 按照屏幕上的指示完成安装，并在最后一个对话框上点击“关闭”。这将完成安装。\n\
    \n安装程序程序集成了一个卸载程序。此此程序的意图是检测并移除计算机上可能安装的旧版本 Java。这在 Windows 32 位和 64 位系统上均有效。\n\
    \n安装程序还会告诉你你的网络浏览器是否禁用了 Java 内容，并提供让你遵循的说明以启用它。如果你选择了隐藏 Java Web Start 和 applet\
    \ 的安全提示，你也将获得如何恢复这些提示的说明。如果你在要求重启浏览器时没有重启，可能需要重启计算机。\n\n### 离线安装\n\n此方法涉及下载一个可执行文件，该文件包含了你需要的所有文件，因此你可以在自己的时间安装\
    \ Java。安装时不需要连接网络，仅初始下载时需要。你也可以复制该文件然后安装在另一台未连接网络的计算机上。\n\n再次，执行此操作你需要管理员权限。\n\
    \n- 打开[手动下载](https://java.com/en/download/manual.jsp) 页面。\n- 点击 Windows Offline。\n\
    - 出现一个对话框，点击“保存”。\n- 确保将文件保存在一个易于找到的地方，例如桌面。\n- 关闭浏览器以及任何可能运行的其他应用程序。\n- 当你准备好安装时，双击文件。\n\
    - 程序将开始，点击“安装”以接受条款并继续安装。\n- 再次，你可能会被提供安装其他各种程序；选择你想要的程序（如果有），并点击“下一步”。\n- 按照屏幕上的指示完成，在最后一个窗口上点击“关闭”以完成安装。\n\
    \n与在线方法一样，卸载工具将检测旧版本的 Java 并将其移除，如果之前被禁用，它还向向你提供在浏览器中启用 Java 内容的说明。还将提供有关启用 applet\
    \ 和 Java Web Start 应用程序提示的说明。\n\n## 如何在 Mac OS X 上安装 Java\n\nJava 可以安装在任何运行 OS\
    \ X 10.7.3 且带有 64 位浏览器（例如 Firefox 或 Safari）的 Mac 上。不支持 32 位浏览器。你需要管理员权限。\n\n-\
    \ 下载此文件——[jre-8u60-macosx-x64.dmg](http://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html)——不要忘记先接受许可条款。\n\
    - 双击文件启动安装向导。\n- 在弹出的欢迎界面上，点击“下一步”。\n- 选择任何可选程序（或都不选），然后点击“下一步”。\n- 按照屏幕上的指示完成安装。\n\
    - 在最后一个窗口上点击“关闭”完成安装。\n\nMac 的情况与 Windows 相同，如果你之前在浏览器中禁用了 Java 内容或禁用了 applet\
    \ 和 Java Web Start 应用程序的提示，将提供启用它们的说明。\n\n## 如何在 Linux 上下载 Java\n\n有两个包供选择：\n\n\
    - **Linux 平台**：任何人都可以下载到任何可写位置的归档二进制文件。下载到系统位置需要 root 用户。\n- **基于 RPM 的 Linux\
    \ 平台**：对于 32 位基于 RPM 的 Linux 平台，具有系统 RPM 二进制文件——这只能由 root 执行。\n\n确保选择符合你系统和权限的包。这适用于\
    \ Linux Red Hat、SUSE、Oracle 和 SLES。\n\n- 打开 [`java.com`](http://java.com)。\n-\
    \ 点击 Download。\n- 选择符合你要求的包。\n- 在下载前记录文件大小，下载完成后检查完整包是否已下载。\n\n### Linux 平台\n\n\
    出于这些目的，我们使用 v7——确保在输入命令时使用与下载内容对应的版本号。\n\n打开终端并切换到你想安装 Java 的相关目录：\n\n- `cd <directoryName>`\n\
    \n- 定位 `.tar.gz` 归档二进制文件并将其移动到新目录。\n- 解压并安装 Java —— `tar zxvf jre-7u7-linux-1586.tar.gz`\n\
    \n你将在名为 `jre1.7._.07` 的目录中找到 Java 文件，该目录位于当前目录下。\n\n- 如果你需要更多磁盘空间，请删除以 `.tar.gz`\
    \ 结尾的文件\n\n### 基于 RPM 的 Linux 平台\n\n再次，我使用的是 v7，因此在输入命令时请确保使用你特定版本的正确数字。\n\n-\
    \ 通过命令行运行 `su` 并输入超级用户密码以成为 root 用户。\n- 从计算机上移除任何旧版本的 Java —— `rpm -e <packageName>`。\n\
    - 切换到你安装 Java 的目录 —— `cd <directoryName>`。\n\n"
- fmt: "\n*   Install the java package by typing `rpm -jvh jre-7u7-linux-1586.rpm`\n\
    *   If you want to save a bit of disk space, delete the `.rpm` file.\n*   Exit\
    \ out of Shell boot – you do not need to reboot your computer.\n\nThe installation\
    \ is finished, now you need to head over to the Enable and Configure section.\n\
    \n# Enable and Configure\n\n## Firefox Browser\n\n*   Close down the Firefox browser\
    \ if it is open and running.\n*   Remove any previous Java plugin versions – you\
    \ can only run one version at a time. If you want to run a different version or\
    \ a different plugin, you have to remove the symbolic link to other versions and\
    \ create a new one to the new version.\n*   Create the symbolic link to `libnpjp2.so`\
    \ – you will find this in the browser plugin directory.\n*   Look for the sub-directory\
    \ under the installation directory by typing `cd <firefox installation directory>/plugins`\
    \ (type in the right name for the directory).\n*   Create the symbolic link -\
    \ `ln -s <Java installation directory>/lib/i386/libnpjp2.so`.\n\nIf you are upgrading\
    \ from an older Java version, you must remove the existing symbolic link before\
    \ you make a new one:\n\n*   Type in `cd <Firefox installation directory>/plugins`\n\
    *   `rm libjavaplugin_oji.so`\n\nFor example:\n\n*   If Firefox has been installed\
    \ at `/usr/lib/<Firefox installation directory>`\n*   And Java is at `/usr/java/<Java\
    \ installation directory>`\n*   Then you would type into the terminal window `/usr/lib/<Firefox\
    \ installation directory>/plugins` to go to the browser plugin directory.\n* \
    \  To create the symbolic link to the Firefox Java plug, type in `ln -s /usr/java/<Java\
    \ installation directory>/lib/i386/libnpjp2.so`.\n\nRestart your Firefox browser\
    \ and, in the Location bar, type in `about: plugins` – this will confirm that\
    \ the Java Plugin has been loaded in. Click on the Tools menu to make sure that\
    \ Java console is in there.\n\n# How to Install Java on Solaris\n\nThere are two\
    \ ways to download Java onto Solaris:\n\n*   Solaris SPARC for 32-bit systems\n\
    *   Solaris SPARC for 64-bit systems\n\nJava is a self-extracting binary file\
    \ so make sure you download the right package for your system.\n\nAs with the\
    \ previous tutorial, I am using `v7` for this so be sure that you use the correct\
    \ version number in any commands that you type.\n\nThe JRE archive binary can\
    \ be downloaded into any location that you can write to and it will not displace\
    \ the version that has been provided by Oracle Solaris OS.\n\nIf you are installing\
    \ this on a 64-bit system that allows the use of a 32-bit JVM, there are two steps\
    \ to the process. First, you must install the 32-bit version and then the support\
    \ for the 64-bit operations. File names are:\n\nOn SPARC processors:\n\n*   `jre-7u7-solaris-sparc.tar.gz`\
    \ (32-bit)\n*   `jre-7u7-solaris-sparcv9.tar.gz` (64-bit)\n\nOn x64/EM64T processors:\n\
    \n*   `jre-7u7-solaris-i586.tar.gz` (32-bit)\n*   `jre-7u7-solaris-x64.tar.gz`\
    \ (64-bit)\n\nIf you are on the 32-bit Solaris, you only have to download the\
    \ 32-bit version.\n\n*   Open `http://java.com`\n*   Click on Free Java Download\n\
    *   You will see a page with the Manual downloads on it – download the relevant\
    \ bundles.\n\nIf you are running a 32-bit version of Oracle Solaris, you only\
    \ need to download and install the 32-bit version.\n\nNote – the `.tar.gz` file\
    \ is also called a tarball and can be uncompressed and extracted in one go.\n\n\
    *   Change the directory to where the JRE is going to be installed: `cd <directory\
    \ path name>`\n*   Move the archive binaries ending `.tar.gz` to the current directory.\n\
    *   Unpack the tarball and install Java:\n\nOn a SPARC processor;\n\n*   `gzip\
    \ -dc jre-7u7-solaris-sparc.tar.gz | tar xf –`\n*   `gzip -dc jre-7u7-solaris-sparcv9.tar.gz\
    \ | tar xf –`\n\nOn an x64/EM64T processor\n\n*   `gzip -dc jre-7u7-solaris-i586.tar.gz\
    \ | tar xf –`\n*   `gzip -dc jre-7u7-solaris-x64.tar.gz | tar xf -`\n\nJava will\
    \ be installed into a directory called `jre1.7.0_<version>` within the current\
    \ directory and the supplemental 64-bit files will be installed in directories\
    \ with names that correspond to the machine architecture model. These will be\
    \ in a number of locations inside the version directory, for example;\n\nSPARC\
    \ processors – the `libjvm.so` file (64-bit Java VM library file). Java is installed\
    \ in a directory called `jre1.7.0_<version>` in the current directory.\n\n## Enable\
    \ and Configure\n\nOnce you have installed Java, it’s time to make sure it is\
    \ configured to run the applets in your browser:\n\n*   Look for the sub-directory\
    \ for the plugins in the Firefox installation directory by typing `cd <Firefox\
    \ installation directory>/plugins`.\n*   Java is installed in a directory called\
    \ `jre1.7.0_<version>` in the current directory.\n\n# Chapter 12: Writing Your\
    \ First Program\n\nSo, now that you know about Java and you know how to install\
    \ it, it’s time to start writing programs. Remember that with Java, all the work\
    \ is done in Word Processor, NOT at the command line. Open up the Word Processor\
    \ and type in:\n\n```java\nclass Pythagorean {\n    public static void main(String[]\
    \ args){\n\n    }\n}\n```\n\nLet me just explain what you have done:\n\nEach class\
    \ opens up inside a new class. Think of a class as a set of instructions or let’s\
    \ say a recipe. Some recipes will need additional recipes to be completed while\
    \ others, like the one you have written, will work on their own. Let’s say you\
    \ were making guacamole; your recipe would contain step-by-step instructions on\
    \ how to make. This is one single class. Now let’s assume that you wanted to make\
    \ a burrito and it needed guacamole. Now you have two options – write one recipe\
    \ that has instructions to make the burrito and the guacamole or you could write\
    \ the burrito recipe and then add a reference to the separate guacamole recipe.\
    \ This is what Java does. You can have one class that references another class\
    \ or you could have one class that contains everything you need. This is why Java\
    \ is object-oriented – because you write what suits your preference. So, let’s\
    \ break down what you just typed:\n\n*   The name of the class in this case is\
    \ `Pythagorean`. All Java has to be saved as the name of the class, followed by\
    \ `.java`.\n*   The class is opened up by the first `{`. own*   The next line,\
    \ `public static void main(String[] args)`, is calling the main method of the\
    \ class. Although is a little advanced, you should remember this because it is\
    \ something you will use a lot.\n*   The `}` bracket closes the program subdivision.\
    \ One thing you must do with every program is ensure that every opening bracket\
    \ has a corresponding closing bracket.\n\nAt this stage, your application isn’t\
    \ going to do anything but we need to save it anyway. All java applications should\
    \ be saved in plain text format.\n\nNext, we want to run this application, even\
    \ though it doesn’t do anything. The reason for this is to get you into the habit\
    \ of doing this. You run your application at each stage just to test it out. So:\n\
    \nWindows:\n\n*   Open the command line\n*   Find where you saved your application\n\
    *   Now type in to the command line something similar to this: `C:/java/samples>javac\
    \ Pythagorean.java`\n"
