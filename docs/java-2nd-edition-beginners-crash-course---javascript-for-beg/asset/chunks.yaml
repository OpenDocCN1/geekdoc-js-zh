    This is if statement\");\n    }\n  }\n}\n```\nThe program will give the following\
    \ output:\nThis is if statement\n\n### The if...else statement\n\nAfter an `if`\
    \ statement, you can add an optional `else` statement. The code inside the `else`\
    \ statement will be executed if the `if` statement is not satisfied. So, in simple\
    \ terms, if the `if` statement returns a false, the code in the `else` statement\
    \ will be executed.\n\nSyntax:\nHere is the syntax of an `if...else` statement.\n\
    ```\nif(Boolean_expression){\n    //Executes when the Boolean expression is true\n\
    }\nelse{\n    //Executes when the Boolean expression is false\n}\n```\nExample:\n\
    ```java\npublic class Test {\n  public static void main(String args[]){\n    int\
    \ x = 30;\n    if( x < 20 ){\n      System.out.print(\"This is if statement\"\
    );\n    }\n    else{\n      System.out.print(\"This is else statement\");\n  \
    \  }\n  }\n}\n```\nThis code will give the following output:\nThis is else statement\n\
    \n### The if...else if...else Statement\n\nAfter an `if` statement, optional `else\
    \ if....` statement can be added. This statement proves to be useful in situations\
