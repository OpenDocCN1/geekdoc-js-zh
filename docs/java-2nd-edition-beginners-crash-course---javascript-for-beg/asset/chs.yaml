  \n如果你是从旧版本的 Java 升级，在创建新链接之前，必须删除现有的符号链接：\n\n*   输入 `cd <Firefox installation directory>/plugins`\n\
  *   `rm libjavaplugin_oji.so`\n\n例如：\n\n*   如果 Firefox 安装在 `/usr/lib/<Firefox installation\
