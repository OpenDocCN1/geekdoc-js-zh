  \n重启你的 Firefox 浏览器，并在地址栏中输入 `about: plugins` – 这将确认 Java 插件已加载。点击“工具”菜单确保 Java 控制台在其中。\n\
  \n## 如何在 Solaris 上安装 Java\n\n有两种方法可以将 Java 下载到 Solaris 系统上：\n\n*   适用于 32 位系统的 Solaris\
