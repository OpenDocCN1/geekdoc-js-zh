  \ <directoryName>`。\n\n\n\n\n\n*   通过输入 `rpm -jvh jre-7u7-linux-1586.rpm` 安装 java\
  \ 包。\n*   如果你想节省一些磁盘空间，请删除 `.rpm` 文件。\n*   退出 Shell 启动 – 你不需要重启电脑。\n\n安装已完成，现在你需要前往“启用与配置”部分。\n\
