  \ 引言\n\n1995 年，太阳系统公司（Sun Microsystems）开发了一种名为 Java 的高级编程语言。詹姆斯·戈斯林（James Gosling）发起了\
  \ Java 项目并将其作为太阳系统公司 Java 平台的核心组件发布。这是 Java 的第一个版本，称为 Java 1.0。\n\nJava 代码可以在任何带有\
  \ Java 虚拟机的设备上运行。Java 为用户保证了“一次编写，到处运行”（Write Once, Run Anywhere）的概念。\n\nJava 编程语言非常灵活，其面向对象的概念也易于使用。与许多已经过时的编程语言不同，Java\
  \ 是一种不断演进的语言，每个新版本都会添加额外的功能。\n\n在本教程中，我们将讨论 Java 的核心概念和特性，任何具有编程语言基础知识的人都可以学习 Java。我们将逐步讨论这些主题，并结合示例使其易于理解。\n\
  \n我希望你会发现这本书对你有帮助。\n\n阅读愉快！！\n\n# 第 1 章：Java 概述\n\n让 Java 与其他编程语言脱颖出的主要特征是：\n\n\
  - **面向对象**：Java 中的所有内容都被视为一个对象。由于其面向对象的模型，它很容易扩展。\n- **平台无关性**：当 Java 代码被编译时，它将成为与平台无关的字节码（Byte\
  \ code），而其他编程语言并非如此。这种字节码将由运行所在平台上的 Java 虚拟机进行解释。\n- **简单**：Java 的设计易于运行。如果您了解面向对象编程的基本概念，就可以轻松掌握\
  \ Java。\n- **安全**：得益于 Java 的安全特性，可以开发出防篡改和无病毒的系统。Java 使用公钥加密进行身份验证。通过 Java 的安全特性，可以开发出无病毒、防篡改的系统。身份验证技术基于公钥加密。\n\
  - **架构中立且可移植**：Java 编译器生成的文件是架构中立的对象。这些文件可以在任何运行 Java 虚拟机的处理器上执行。这使得 Java 成为一种可移植的语言。\n\
  - **健壮**：通过运行时检查和编译时检查，可以消除错误倾向，使 Java 成为一种健壮的语言。\n- **多线程**：Java 支持多线程特性。通过多个线程，程序可以同时运行不同的任务。这有助于开发者构建交互式应用程序。\n\
  - **解释型**：Java 字节码可以翻译为机器语言。这不需要存储在任何地方。Java 是一个轻量且增量的过程，使得开发过程更加高效、快速。\n- **高性能**：Java\
  \ 通过其即时编译器（JIT）确保用户获得高性能。\n- **分布式**：Java 的设计适用于互联网的分布式环境。\n- **动态**：Java 程序能够在运行时携带大量信息，反过来用于验证和解析对象的访问。这使其成为一种动态语言。\n\
  \n# 第 2 章：Java 基础语法\n\n在本章中，我们将学习方法、类、对象等的基础语法。我们知道 Java 是一种面向对象的编程语言，Java 程序无非是对象的集合。这些对象通过调用其他对象的方法进行通信。现在，我们将查看对象、类、实例和方法的含义。\n\
  \n- **对象**：对象具有状态和行为。例如：汽车有颜色、名称、型号等状态，以及加速、刹车、巡航等行为。对象可以定义为类的实例。\n- **类**：计算机中的类可以定义为蓝图或模板，描述了对象所支持的状态或行为。\n\
  - **方法**：方法基本上可以定义为一种行为。逻辑写在方法内部。类可以包含任意数量的方法。所有的操作和数据处理都在方法内部执行。\n\n\n\n\n\n##\
  \ 实例变量\n\n每个对象都拥有自己的一组独特的变量。这些变量被称为实例变量（instance variables）。这些实例变量会被赋予值，并用于定义对象的状态。\n\
  \n## 基础语法\n\n在 Java 中编程时，应始终遵循以下几点。\n\n- 大小写敏感 - Java 语言对大小写敏感。因此，在编写 Java 程序时需要小心。`Phoenix`\
  \ 和 `phoenix` 之间是不相同的，它们在 Java 中具有不同的含义。\n- 类名 - 在编写类名时，第一个字母始终应该是大写字母。例如 `Car`、`Bike`、`Laptop`\
  \ 等。如果使用多个单词组合作为类名，则这些每个单词的首字母都应该大写。例如类 `JavaExampleClass`。\n- 方法名 - 在调用方法时，方法名应始终以小写字母开头。如果使用多个单词来命名该方法，方法的第一个字母将是小写，而内部单词的第一个字母应该大写。例如：`public\
  \ void exampleJavaMethodName()`。\n- 程序文件名 - 类名和程序文件名必须完全相同。\n- 始终记住使用类名保存文件，并在名称末尾添加\
  \ `.java`。例如，如果类名为 `BananaNutellaPancake`，则文件名应为 `BananaNutellaPancake.java`。\n\
  - `public static void main (String args[])` - 编译器将从 `main()` 方法开始处理程序。因此，没有 `main()`\
  \ 方法就无法在 Java 中编写程序。\n\n# 第 3 章：对象与类\n\n在存在的各种类型语言中，Java 被归类为面向对象的语言。所有面向对象的语言都支持以下基本概念：\n\
  \n- 多态（Polymorphism）：一个对象可以以多种形式存在的情况。例如，`+` 既可以用于加法，也可以用于字符串拼接。\n- 继承（Inheritance）：子对象获得其父类属性的情况。\n\
  - 封装（Encapsulation）：数据受到保护的情况。\n- 抽象（Abstraction）：类的声明已经完全完成，但可以使用抽象类中存在的变量和方法以不同的方式编写其功能。\n\
  - 类（Classes）：对象是使用类创建的。类由成员变量和成员函数组成。它可以被视为一个蓝图。\n- 对象（Objects）：在面向对象编程中，对象起着至关重要的作用。对象执行所有功能。它们拥有状态（变量所在的地方）和行为（变量在被放入特定方法时以特定方式运行）。\n\
  - 实例（Instance）：实例可以被视为声明在类内部但在类方法之外的变量。\n- 方法（Method）：方法可以被视为一组编写用于执行特定任务的语句。\n\n\
  ## 更多关于 Java 中的对象\n\n你周围看到的任何具有物理特征的实体都可以被视为对象。所有这些都具有可以观察到的状态和行为。\n\n所有对象都具有状态和行为。这些是现实对象，现在让我们考虑软件对象，它们具有由变量显示的相似状态以及通过方法显示的行为。\n\
  \nJava 类的示例：\n\n```java\npublic class Dog{\n    String breed;\n    int age;\n  \
  \  String color;\n    void barking(){\n    }\n    void hungry(){\n    }\n    void\
  \ sleeping(){\n    }\n}\n```\n\n有多种类型的变量，如局部变量、全局变量、类变量、实例变量。根据变量的作用范围，变量可以分为局部变量和全局变量。\n\
  \n- 局部变量定义在函数内部，且只能在函数内部使用。换句话说，局部变量在函数完成后就会销毁。\n- 全局变量定义在外部，其作用范围贯穿整个程序。\n- 实例变量：实例变量声明在类内部但在方法之外。它们只能被该特定类的所有方法使用。\n\
  - 实例变量：实例变量是类内部但在任何方法之外的变量。这些变量在类加载时实例化。\n- 类变量是类似于实例变量的变量。唯一的区别是它们使用 `static` 关键字声明。\n\
  \n一个类可以有多个变量和方法。\n\n# 第 4 章：构造函数\n\n构造函数在涉及类时起着至关重要的作用。创建类时可以显式地创建构造函数，否则 Java 编译器会自动创建一个。每当创建一个对象时，至少会调用一个构造函数。一个类可以有多个构造函数。构造函数的名称必须与类相同。每个构造函数都必须有一个析构函数。\n\
  \n构造函数的示例：\n\n```java\npublic class Puppy{\n    public Puppy(){\n    }\n    public\
  \ Puppy(String name) {\n        // 这个构造函数有一个参数，name。\n    }\n}\n```\n\n## 创建对象\n\
  \n如前所述，类为对象提供了蓝图。所以基本上对象是从类创建的。在 Java 中，使用 `new` 关键字来创建新对象。\n\n从类创建对象有三个步骤：\n1.\
  \ 声明：一个带有变量名和对象类型的变量声明。\n2. 实例化：使用 `new` 关键字创建对象。\n3. 初始化：在 `new` 关键字之后紧跟对构造函数的调用。该调用初始化了新对象。\n\
  \n创建对象的示例下所示：\n\n```java\npublic class Puppy{\n    public Puppy(String name) {\n\
  \        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is :\" +\
  \ name );\n    }\n    public static void main(String args){\n        // 下述语句将创建一个对象\
  \ myPuppy\n        Puppy myPuppy = new Puppy( \"jimmy\" );\n    }\n}\n```\n\n编译并运行上述程序，将产生：\n\
  `Passed Name is :jimmy`\n\n访问实例变量\n\n实例变量和方法通过创建的对象来访问。要访问实例变量，应使用全限定路径：\n`/* 首先创建一个对象\
  \ */`\n`ObjectReference = new Constructor();`\n`/* 现在调用变量 */`\n`ObjectReference.variableName;`\n\
  `/* 现在你可以调用类方法 */`\n`ObjectReference.MethodName();`\n\n示例：此示例解释了如何访问类的实例变量和方法：\n\
  \n```java\npublic class Puppy{\n    int puppyAge;\n    public Puppy(String name)\
  \ {\n        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is :\"\
  \ + name );\n    }\n    public void setAge( int age ){\n        puppyAge = age;\n\
  \    }\n    public int getAge( ) {\n        System.out.println(\"Puppy's age is\
  \ :\" + puppyAge );\n        return puppyAge;\n    }\n    public static void main(String\
  \ []args){\n        /* 对象创建 */\n        Puppy myPuppy = new Puppy( \"jimmy\" );\n\
  \        /* 调用类方法设置狗的年龄 */\n        myPuppy.setAge( 2 );\n        /* 调用另一个类方法获取狗的年龄\
  \ */\n        myPuppy.getAge( );\n        /* 你也可以这样访问实例变量 */\n        System.out.println(\"\
  Variable Value :\" + myPuppy.puppyAge );\n    }\n}\n```\n\n# 第 5 章：Java 包\n\n简单来说，Java\
  \ 包可以定义为一类分类好的接口和类。在开发应用程序时，对这些类和接口进行分类是必须，因为会使用大量的接口和类。分类可以使工作变得更容易。\n\n## 导入语句\n\
  \nJava 中的全限定名包含类名和包名，传递给编译器后，编译器可以轻松找到类或源代码。通过向编译器提供导入语句，我们提供了特定类的位置。\n\n\n\n\n\n\
  在本示例中，此行将告诉编译器加载存在 `java_installation/java/io` 目录中的类。\n\n```java\nimport java.io.*;\n\
  ```\n\n## 一个简单的案例研究\n\n在这里，我们将创建两个类 `Employee` 和 `EmployeeTest` 来进行案例研究。\n\n*  \
  \ 打开记事本并编写下面提供的代码。你应该记住这是 `Employee` 类，并且它是一个公共类（public class）。\n*   将此文件保存为 `Employee.java`。\n\
  \n`Employee` 类中存在四个实例变量，分别为 `name`、`age`、`designation` 和 `salary`。该类 true 一个显式定义的构造函数。该构造函数接受一个参数。\n\
  \n示例：\n\n```java\nimport java.io.*;\n\npublic class Employee{\n\n  String name;\n\
  \n  int age;\n\n  String designation;\n\n  double salary;\n\n  // 这是 Employee 类的构造函数\n\
  \n  public Employee(String name){\n    this.name = name;\n  }\n\n  /* 将 Employee\
  \ 的年龄赋值给变量 age. */\n\n  public void empAge(int empAge){\n    age =  empAge;\n  }\n\
  \n  /* 将职位赋值给变量 designation. */\n  public void empDesignation(String empDesig){\n\
  \    designation = empDesig;\n  }\n\n  /* 将工资赋值给变量 salary. */\n  public void empSalary(double\
  \ empSalary){\n    salary = empSalary;\n  }\n\n  /* 打印员工详情 */\n  public void printEmployee(){\n\
  \    System.out.println(\"Name:\"+ name );\n    System.out.println(\"Age:\" + age\
  \ );\n    System.out.println(\"Designation:\" + designation );\n    System.out.println(\"\
  Salary:\" + salary);\n  }\n\n}\n```\n\n如之前所述，程序的运行过程只有在 `main()` 方法之后才开始。因此，为了运行这个\
  \ `Employee` 类，应该有一个 `main` 方法以及几个对象。对于这些任务，将创建一个独立的类。\n\n下面是 `EmployeeTest` 类，它创建了两个属于\
  \ `Employee` 类的实例。这些对象调用每个对象的方法，并为所有变量赋值。\n\n将给定的代码保存到 `EmployeeTest.java` 文件中。\n\
  \n```java\nimport java.io.*;\n\npublic class EmployeeTest{\n\n  public static void\
  \ main(String args[]){\n    /* 使用构造函数创建两个对象 */\n    Employee empOne = new Employee(\"\
  James Smith\");\n    Employee empTwo = new Employee(\"Mary Anne\");\n\n    // 调用每个创建的对象的方法\n\
  \    empOne.empAge(26);\n    empOne.empDesignation(\"Senior Software Engineer\"\
  );\n    empOne.empSalary(1000);\n    empOne.printEmployee();\n\n    empTwo.empAge(21);\n\
  \    empTwo.empDesignation(\"Software Engineer\");\n    empTwo.empSalary(500);\n\
  \    empTwo.printEmployee();\n  }\n\n}\n```\n\n编译这两个类并运行 `EmployeeTest`，它将产生以下输出。\n\
  \n```bash\nC :> javac Employee.java\nC :> vi EmployeeTest.java\nC :> javac EmployeeTest.java\n\
  C :> java EmployeeTest\nName:James Smith\nAge:26\nDesignation:Senior Software Engineer\n\
  Salary:1000.0\nName:Mary Anne\nAge:21\nDesignation:Software Engineer\nSalary:500.0\n\
  ```\n\n# 第 6 章：Java 中的数据类型\n\n变量可以定义为用于存储值的内存位置的结果。当你创建一个变量时，你实际上是在系统上预留了内存空间。\n\
  \n操作系统将根据变量的数据类型分配内存。然后操作系统将决定在该预留的内存中存储什么。不同的数据类型可以分配给变量，允许你在这些预留的空间或变量中存储字符、整数。\n\
  \n在 Java 中，有两种数据类型可用。它们是：\n\n*   基本数据类型（Primitive Data Types）\n*   引用/对象数据类型（Reference/Object\
  \ Data Types）\n\n## 基本数据类型\n\nJava 支持八种基本数据类型。这些基本数据类型由关键字命名并已经预先定义。现在我们来看 Java\
  \ 中的这八种基本数据类型。\n\n### byte:\n\n*   `Byte` 数据类型是 8 位有符号补码整数。\n*   `byte` 的最小值为 `-128`\
  \ (`-2⁷`)。\n*   `byte` 的最大值为 `127`（包含在内）（(`2⁷ -1`）。\n*   `byte` 的默认值为 `0`。\n*  \
  \ 使用 `byte` 数据类型，可以为大数组节省空间，因为它是 `int` 的四分之一。\n*   示例：`byte x=20, byte y=-4`。\n\n\
  ### short:\n\n*   `Short` 数据类型是 16 位有符号补码整数。\n*   `short` 可以存储的最小值为 `-32768` (`-2¹⁵`)。\n\
  *   `short` 可以存储的最大值为 `32767`（包含在内）（`2¹⁵ -1`）。\n*   `short` 数据类型的大小是 `int` 的一半，是\
  \ `byte` 的两倍。\n*   `short` 数据类型也用于节内存内存。\n*   `short` 的默认值为 `0`。\n*   示例：`short\
  \ p=15000, short q=-2000`。\n\n### int:\n\n*   `Int` 数据类型是 32 位有符号补码整数。\n*   `int`\
  \ 的最小值为 `-2147483648` (`-2³¹`）。\n*   `int` 的最大值为 `2147483647`（包含在内）（`2³¹ -1`）。\n\
  *   `int` 的默认值为 `0`。\n*   使用 `int` 数据类型，可以在大数组中节省空间。\n*   示例：`int x=20, int y=-4`。\n\
  \n### long:\n\n*   `Long` 数据类型是 64 位有符号补码整数。\n*   `long` 的最小值为 `-9223372036854775808`\
  \ (`-2⁶³`)。\n*   `long` 的最大值为 `9223372036854775807`（包含在内）（`2⁶³ -1`）。\n*   `long`\
  \ 的默认值为 `0`。\n*   示例：`long x=20, long y=-4`。\n\n### float:\n\n*   `Float` 数据类型是\
  \ 32 位单精度 IEEE 754 浮点数。\n*   `float` 的最小值为 `1.4E-45`。\n*   `float` 的最大值为 `3.4E38`。\n\
  *   `float` 的默认值为 `0.0f`。\n*   示例：`float x=20.0f, float y=-4.0f`。\n\n### double:\n\
  \n*   `Double` 数据类型是 64 位双精度 IEEE 754 浮点数。\n*   `double` 的最小值为 `4.9E-324`。\n*  \
  \ `double` 的最大值为 `1.8E308`。\n*   `double` 的默认值为 `0.0d`。\n*   示例：`double x=20.0d,\
  \ double y=-4.0d`。\n\n### boolean:\n\n*   `boolean` 数据类型表示一个位的信息。\n*   `boolean`\
  \ 数据类型只有两个值：true 或 false。\n*   该数据类型的默认值为 `false`。\n*   示例：`boolean one=false`。\n\
  \n### char:\n\n*   `char` 数据类型是单个 16 位 Unicode 字符。\n*   `char` 可以存储的最小值为 `\\u0000`（或\
  \ 0）。\n*   `char` 可以存储的最大值为 `\\uffff`（或 65535）。\n*   `char` 的默认值为 `'\\u0000'`。\n\
  *   示例：`char letterA='A'`。\n\n## 引用数据类型\n\n使用 Java 类的构造函数可以创建引用变量。\n\n*   引用变量用于访问对象。一旦声明了数据类型，就无法更改。例如：`Vehicle`、`Student`\
  \ 等。\n*   类对象和不同数组变量都是不同的数据类型。\n*   任何给定的引用变量的默认值为 `null`。\n*   任何声明的兼容对象都可以使用引用变量进行引用。\n\
  *   示例：`Vehicle vehicle=new Vehicle(\"hellcat\")`。\n\n\n\n\n\n`byte`、`short`、`int`\
  \ 和 `long` 数据类型也可以用十进制（基 10）、十六进制（基 16）或八进制（基 8）数制表示。\n\n当这些数制用于字面量（Literals）时，我们使用\
  \ `0` 作为八进制的前缀，并使用 `0x` 表示十六进制值。以下是一个示例。\n\n```\nint decimal = 100;\nint octal =\
  \ 0144;\nint hexa = 0x64;\n```\n\nJava 中的字符串字面量规定方式与其他编程语言相同。这是通过在一对双引号内包含一组字符来实现的。以下是一些关于字符串字面量的示例。\n\
  \n```\n\"Hello World\"\n\"two\\nlines\"\n\"\\\"This is in quotes\\\"\"\n```\n\n\
  字符串和 `char` 数据类型只能赋入 Unicode 字符。例如：\n\n```java\nchar a = '\\u0001';\nString a =\
  \ \"\\u0001\";\n```\n\nJava 还为 `char` 和字符串字面量支持一些特殊的转义序列。它们是：\n\n| 符号 | 代表的字符 |\n\
  | :--- | :--- |\n| `\\n` | 新行 (0x0a) |\n| `\\r` | 回车 (0x0d) |\n| `\\f` | 进页符 (0x0c)\
  \ |\n| `\\b` | 退格 (0x08) |\n| `\\s` | 空格 (0x20) |\n| `\\t` | 制表符 |\n| `\\\"` | 双引号\
  \ |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n| `\\ddd` | 八进制字符 (ddd) |\n| `\\uxxxx` |\
  \ 十六进制 Unicode 字符 (xxxx) |\n\n# 第 7 章：变量\n\n当声明一个变量时，它为用户提供了一个命名的存储空间，程序随后可以对其操作。在\
  \ Java 中，每个变量都有特定的类型，这反过来决定了该变量内存的布局和大小、可以在该变量上执行的操作，以及可以在其中存储的最大值和最小值。\n\n始终记住，在使用变量之前应该先声明它们。基本的变量声明形式如下。\n\
  \n`data type variable [ = value][, variable [= value] ...] ;`\n\n在上面的示例中，`data type`\
  \ 是 Java 的数据类型，变量名是 `variable`。如果你想声明多个相同数据类型的变量，可以使用逗号（（`）来分隔列表。\n\n以下是几个关于变量声明和变量初始化的示例。\n\
  \n```java\nint a, b, c;      // 声明三个 int 类型：a, b 和 c。\nint a = 10, b = 10;  // 初始化示例\n\
  byte B = 22;        // 初始化一个字节类型变量 B。\ndouble pi = 3.14159; // 声明并为 PI 赋值。\nchar\
  \ a = 'a';       // char 变量 a 被初始化为值 'a'\n```\n\n在本主题中，我们将查看 Java 中可用的各种变量。在 Java\
  \ 中，有三种类型的变量。\n\n* 局部变量\n* 实例变量\n* 类变量/静态变量\n\n## 局部变量\n\n* 局部变量是在块、方法或构造函数内部声明的变量。\n\
  * 局部变量仅在其所属的块、方法或构造函数存在时才可用。一旦离开块、方法或构造函数，局部变量将被销毁。\n* 我们不能在局部变量上使用访问修饰符。\n* 局部变量仅在其定义的块、方法或构造函数内部可见。\n\
  * 在内部，局部变量的实现是在栈（stack）级别完成的。\n* 由于局部变量没有默认值，因此在使用它们之前应该通过声明它们来赋值。\n\n以下是一个使用局部变量的示例。\n\
  \n**示例：**\n在这里，`age` 是局部变量。它定义在 `pupAge()` 方法内部，其作用域仅限于此方法。\n\n```java\npublic class\
  \ Test{\n  public void pupAge(){\n    int age = 0;\n    age = age + 7;\n    System.out.println(\"\
  Puppy age is : \" + age);\n  }\n  public static void main(String args[]){\n    Test\
  \ test = new Test();\n    test.pupAge();\n  }\n}\n```\n\n上述代码将产生以下输出。\n`Puppy age\
  \ is: 7`\n\n**示例：**\n在接下来的示例中，我们在没有初始化的情况下使用了 `age` 变量。因此在编译期间这会产生错误。\n\n```java\n\
  public class Test{\n  public void pupAge(){\n    int age;\n    age = age + 7;\n\
  \    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static void main(String\
  \ args[]){\n    Test test = new Test();\n    test.pupAge();\n  }\n}\n```\n将产生以下错误：\n\
  `Test.java:4: variable age might not have been initialized`\n\n## 实例变量\n\n* 实例变量是在类内部但在方法外部声明的变量。\n\
  * 可以从实例变量创建任意数量的对象，但每个对象将只有一个实例变量。\n* 实例变量存储在堆（heap）中。\n* 当对象被创建时，实例变量会被分配。\n* 实例变量的可见性取决于访问修饰符。\n\
  * 实例变量的默认值为 0，布尔类型为 false，对象引用为 NULL。\n\n以下是一个示例。\n\n**示例：**\n\n```java\nimport\
  \ java.io.*;\n\npublic class Employee{\n  public String name;\n  private double\
  \ salary;\n\n  public Employee(String empName){\n    name = empName;\n  }\n\n  public\
  \ void setSalary(double empSal){\n    salary = empSal;\n  }\n\n  public void printEmp(){\n\
  \    System.out.println(\"name : \" + name);\n    System.out.println(\"salary :\"\
  \ + salary);\n  }\n\n  public static void main(String args[]){\n    Employee empOne\
  \ = new Employee(\"Ransika\");\n    empOne.setSalary(1000);\n    empOne.printEmp();\n\
  \  }\n}\n```\n\n程序将产生以下输出。\n`name : Ransika`\n`salary :1000.0`\n\n## 类变量/静态变量\n\n\
  * 类变量也称为静态变量。这些变量在类内部使用 `static` 关键字声明，但在块、构造函数或方法之外。\n* 无论创建了多少个对象，每个类都只有一个类变量。\n\
  * 类变量存储在静态内存中。\n* 类变量在程序启动时创建，并在程序结束时被销毁。\n* 类变量主要用于声明为常量。常量是声明为 `static`、`public`/`private`\
  \ 和 `final` 的变量。\n* 类变量的默认值为 0，布尔类型为 false，对象引用为 NULL。\n\n\n\n\n\n*   通过类名调用静态变量，可以访问它们。语法：`ClassName.VariableName`。\n\
  \n这里是一个使用静态变量的示例。\n\n```java\nimport java.io.*;\n\npublic class Employee{\n\n  //\
  \ salary 变量是一个私静态变量\n  private static double salary;\n\n  // DEPARTMENT 是一个常量\n\
  \  public static final String DEPARTMENT = \"Development \";\n\n  public static\
  \ void main(String args[]){\n    salary = 1000;\n    System.out.println(DEPARTMENT+\"\
  average salary:\"+salary);\n  }\n}\n```\n\n程序将产生以下输出。\n\nDevelopment average salary:1000\n\
  \n## 修饰符 (Modifiers)\n\n在某些情况下，你可能需要更改某些定义的含义。在这种情况下，你可以使用修饰符。修饰符本质上是用于更改定义含义的关键字。在\
  \ Java 中，有很多修饰符，包括以下两种。\n\n*   [Java 访问修饰符](http://www.tutorialspoint.com/java/java_access_modifiers.htm)\n\
  *   [非访问修饰符](http://www.tutorialspoint.com/java/java_nonaccess_modifiers.htm)\n\n\
  要使用修饰符，你应该在变量、方法或类的定义中包含关键字。修饰符应该像下面示例所示放在语句的开头。它们以*斜体*形式给出。\n\n```java\npublic\
  \ class className {\n  // ...\n}\n\nprivate boolean myFlag;\n\nstatic final double\
  \ weeks = 9.5;\n\nprotected static final int BOXWIDTH = 42;\n\npublic static void\
  \ main(String[] arguments) {\n  // 方法体\n}\n```\n\n## 访问控制修饰符 (Access Control Modifiers)\n\
  \n为了设置构造函数、变量、类和方法的访问级别，Java 为用户提供了一组访问修饰符。Java 中有四种访问级别。它们是：\n\n*   对包可见（默认）。不需要修饰符。\n\
  *   仅对类可见（`private`）。\n*   对所有人可见（`public`）。\n*   对包及所有子类可见（`protected`）。\n\n##\
  \ 非访问修饰符 (Non Access Modifiers)\n\n在 Java 中，有很多非访问修饰符。\n\n*   `static` 修饰符用于创建类变量和方法。\n\
  *   为了对变量、类和方法进行最终化，我们使用 `final` 修饰符。\n*   你可以通过 `abstract` 修饰符创建抽象类和抽象方法。\n*  \
  \ 为了处理线程，我们使用 `volatile` 和 `synchronized` 修饰符。\n\n# 第 8 章：运算符 (Operators)\n\n在编程过程中，你可能不断需要操作变量，为此，Java\
  \ 为用户提供了一组运算符。所有运算符可以分为以下几组：\n\n*   算术运算符\n*   关系运算符\n*   位运算符\n*   逻辑运算符\n*   赋值运算符\n\
  \n## 算术运算符 (The Arithmetic Operators)\n\n算术运算符用于处理数学表达式。所有的算术运算符都列在下表中。\n\n在这里，我们假设变量\
  \ `A` 的值为 5，变量 `B` 的值为 10。那么以下表达式将产生结果：\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :---\
  \ |\n| `+` | 加法 - 将运算符两边的值相加 | `A + B` 得到 15 |\n| `-` | 减法 - 从左操作数减去右操作数 | `A -\
  \ B` 得到 -5 |\n| `*` | 乘法 - 将运算符两边的值相乘 | `A * B` 得到 50 |\n| `/` | 除法 - 将左操作数除以右操作数\
  \ | `B / A` 得到 2 |\n| `%` | 取模 - 将左操作数除以右操作数并返回余数 | `B % A` 得到 0 |\n| `++` | 增增\
  \ - 操作数的值加 1 | `B++` 得到 11 |\n| `--` | 递减 - 操作数的值减 1 | `B--` 得到 9 |\n\n## 关系运算符\
  \ (The Relational Operators)\n\nJava 支持以下关系运算符。\n\n假设变量 `A` 的值为 1，变量 `B` 的值为 2，那么：\n\
  \n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `==` | 该运算符将比较两个操作数并检查它们是否相等。如果相等则返回\
  \ true。 | `(A == B)` 为 false。 |\n| `!=` | 该运算符将比较两个操作数并检查它们是否相等。如果不相等则返回 true。 |\
  \ `(A != B)` 为 true。 |\n| `>` | 该运算符将比较两个操作数并检查左操作数是否大于右操作数，如果满足条件，则返回 true。 | `(A\
  \ > B)` 为 false。 |\n| `<` | 该运算符将比较两个操作数并检查左操作数是否小于右操作数，如果满足条件，则返回 true。 | `(A <\
  \ B)` 为 true。 |\n| `>=` | 该运算符在比较左操作数时检查它是否大于等于右操作数。如果满足条件，则返回 true。 | `(A >= B)`\
  \ 为 false。 |\n| `<=` | 该运算符在比较左操作数时检查它是否小于等于右操作数。如果满足条件，则返回 true。 | `(A <= B)` 为\
  \ false。 |\n\n## 位运算符 (The Bitwise Operators)\n\n位运算符对位执行操作。它们可以作用于 `byte`、`short`、`int`、`long`\
  \ 和 `char` 类型。假设 `a=5`，`b=3`。\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `&`\
  \ | 二位与运算符 - 如果两个操作数都存在该位则复制位 | `a & b` 得到 1 |\n| `\\|` | 二位或运算符 - 如果任意一个操作数存在该位则复制位\
  \ | `a \\| b` 得到 7 |\n| `^` | 二位异异运算符 - 如果仅一个操作数存在该位则复制位 | `a ^ b` 得到 6 |\n| `~`\
  \ | 二位取反运算符 - 一元运算符，效果是翻转位 | `~a` 得到 -6 |\n| `<<` | 二位左移运算符 - 左操作数向左移动指定的位数 | `a\
  \ << 2` 得到 20 |\n| `>>` | 二位右移运算符 - 左操作数向右移动指定的位数 | `a >> 2` 得到 1 |\n| `>>>` | 二位无符号右移运算符\
  \ - 左操作数向右移动指定的位数，且移位处补零 | `a >>> 2` 得到 1 |\n\n## 逻辑运算符 (The Logical Operators)\n\
  \n这里是 Java 中所有的逻辑运算符列表。假设 `A` 和 `B` 是布尔变量。A 为 true，B 为 false。那么：\n\n| 运算符 | 说明 |\
  \ 示例 |\n| :--- | :--- | :--- |\n| `&&` | 逻辑与运算符 - 如果两个操作数都为非零值则返回 true | `(A &&\
  \ B)` 为 false。 |\n| `\\|` | 逻辑或运算符 - 如果任意一个操作数为为非零值则返回 true | `(A \\| B)` 为 true。\
  \ |\n| `!` | 逻辑非运算符 - 用于反转所用操作数的当前逻辑状态。如果条件返回 true，逻辑非将将其变为 false | `!(A && B)`\
  \ 为 true。 |\n\n## 赋值运算符 (The Assignment Operators)\n\nJava 支持的所有赋值运算符如表所示。\n\n|\
  \ 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `=` | 简单的赋值运算符，将右操作数的值赋值给左操作数。 | `C\
  \ = A + B` 将 A + B 的值赋值给 C |\n| `+=` | 加赋值运算符 - 该运算符将两个操作数相加并赋值给左操作数。 | `C += A`\
  \ 等同于 `C = C + A` |\n| `-=` | 减赋值运算符 - 该运算符从左操作数中减去右操作数并赋值给左操作数。 | `C -= A` 等同于\
  \ `C = C - A` |\n\n\n\n\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `*=` | 这是乘法赋值运算符。它将两个操作数都相乘，并将得到的结果赋值给左操作数。\
  \ | `C *= A` 等于 `C = C * A` |\n| `/=` | 这是一个除法赋值运算符。该运算符将左操作数除以右操作数。得到的结果将被赋值给左操作数。\
  \ | `C /= A` 等于 `C = C / A` |\n| `%=` | 这是取模赋值运算符。该运算符会取两个操作数的模，并结果结果赋值给左操作数。 |\
  \ `C %= A` 等于 `C = C % A` |\n| `<<=` | 左移赋值运算符 | `C <<= 2` 等于 `C = C << 2` |\n|\
  \ `>>=` | 右移赋值运算符 | `C >>= 2` 等于 `C = C >> 2` |\n| `&=` | 按位与赋值运算符 | `C &= 2` 等于\
  \ `C = C & 2` |\n| `^=` | 按位异或赋值运算符 | `C ^= 2` 等于 `C = C ^ 2` |\n| `|=` | 按位或赋值运算符\
  \ | `C |= 2` 等于 `C = C | 2` |\n\n### Java 运算符的优先级\n\n给定表达式中项的组合由运算符优先级决定。某些运算符的优先级高于其他运算符。例如，与加法运算符相比，乘法运算符的优先级总是更高的。优先级较高的运算符将先执行。\n\
  \n下面给出了按照优先级排序的所有运算符列表。优先级较高的运算符位于顶部，并按递减顺序向下排列表格。\n\n| 类别 | 运算符 | 结合性 |\n| :---\
  \ | :--- | :--- |\n| 后置 | `() [] .` (点运算符) | 从左到右 |\n| 一元 | `++ - - ! ~` | 从右到左\
  \ |\n| 乘法 | `* / %` | 从左到右 |\n| 加法 | `+ -` | 从左到右 |\n| 移位 | `>> >>> <<` | 从左到右 |\n\
  | 关系 | `> >= < <=` | 从左到右 |\n| 等于 | `== !=` | 从左到右 |\n| 按位与 | `&` | 从左到右 |\n| 按位异或\
  \ | `^` | 从左到右 |\n| 按位或 | `|` | 从左到右 |\n| 逻辑与 | `&&` | 从左到右 |\n| 逻辑或 | `||` | 从左到右\
  \ |\n| 条件 | `?:` | 从右到左 |\n| 赋值 | `= += -= *= /= %= >>= <<= &= ^= |=` | 从右到左 |\n\
  | 逗号 | `,` | 从左到右 |\n\n# 第 9 章：条件语句\n\nJava 为用户提供了两种类型的决策语句。它们是：\n- `if` 语句\n- `switch`\
  \ 语句\n\n### if 语句\n\nJava 中的 `if` 语句由一个 `Boolean` 语句组成。该语句将一个或多个语句。如果满足条件，则这些语句将被执行。以下是\
  \ `if` 语句的语法。\n\n语法：\n```\nif(Boolean_expression)\n{\n    // 如果布尔表达式为真，则执行语句\n}\n\
  ```\n`if` 语句内部给定的代码块只有在布尔表达式返回真时才会被执行。如果返回假，控制权将转移到 `if` 之后的代码。以下是一个示例：\n\n```java\n\
  public class Test {\n  public static void main(String args[]){\n    int x = 10;\n\
  \    if( x < 20 ){\n      System.out.print(\"This is if statement\");\n    }\n \
  \ }\n}\n```\n程序将给出以下输出：\nThis is if statement\n\n### if...else 语句\n\n在 `if` 语句之后，你可以添加一个可选的\
  \ `else` 语句。如果 `if` 语句不满足，则 `else` 语句中的代码将被执行。因此简单来说，如果 `if` 语句返回假，则 `else` 语句中的代码将被执行。\n\
  \n语法：\n这里是 `if...else` 语句的语法。\n```\nif(Boolean_expression){\n    // 当布尔表达式为真时执行\n\
  }\nelse{\n    // 当布尔表达式为假时执行\n}\n```\n示例：\n```java\npublic class Test {\n  public\
  \ static void main(String args[]){\n    int x = 30;\n    if( x < 20 ){\n      System.out.print(\"\
  This is if statement\");\n    }\n    else{\n      System.out.print(\"This is else\
  \ statement\");\n    }\n  }\n}\n```\n这段代码将给出以下输出：\nThis is else statement\n\n###\
  \ if...else if...else 语句\n\n在 `if` 语句之后，可以添加可选的 `else if....` 语句。这种语句在需要测试各种条件的情况下被证明非常有用。在使用\
  \ `if`、`else if` 和 `else` 语句时，有几点需要记住：\n- `if` 条件可以有任意数量的 `else if` 条件，且 `else`\
  \ 条件应该始终放在最后。\n- `if` 语句可以跟随着任意数量的 `else if` 语句。这些语句应该始终位于 `else` 语句之前。\n- 一旦 `if`\
  \ 语句被满足，就不会再执行后续的 `else if` 语句。当 `else if` 语句满足后，其内部的代码将被执行。\n\n语法：\n`if...else\
  \ if...else` 语句的语法如下：\n```\nif(Boolean_expression){\n    // 当布尔表达式为真时执行\n}\nelse\
  \ if(Boolean_expression){\n    // 当布尔表达式为真时执行\n}\nelse{\n    // 当所有布尔表达式为假时执行\n\
  }\n```\n示例：\n```java\npublic class Test {\n  public static void main(String args[]){\n\
  \    int x = 30;\n    if( x < 20 ){\n      System.out.print(\"This is if statement\"\
  );\n    }\n    else if( x < 40 ){\n      System.out.print(\"This is else if statement\"\
  );\n    }\n    else{\n      System.out.print(\"This is else statement\");\n    }\n\
  \  }\n}\n```\n这段代码将产生输出：\nThis is else if statement\n\n### 嵌套 if...else 语句\n\n嵌套的\
  \ `if` 或 `else` 语句是指其内部包含另一个语句的语句。如果一个 `if` 语句的内部包含另一个 `if` 语句，则它被称为嵌套 `if` 语句。同样，如果\
  \ `else` 语句内部包含另一个 `else` 语句，则它是嵌套 `else` 语句。\n\n语法：\n嵌套 `if...else` 的语法如下：\n```\n\
  if(Boolean_expression1){\n    // 当布尔表达式 1 为真时执行\n    if(Boolean_expression2){\n\
  \        // 当布尔表达式 2 为真时执行\n    }\n}\n```\n示例：\n```java\npublic class Test {\n \
  \ public static void main(String args[]){\n    int x = 30;\n    int y = 10;\n  \
  \  if( x == 30 ){\n      if( y == 10 ){\n        System.out.print(\"X = 30 and Y\
  \ = 10\");\n      }\n    }\n  }\n}\n```\n这段代码将产生输出：\nX = 30 and Y = 10\n\n### switch\
  \ 语句\n\n`switch` 语句可以用于与给定的值列表进行等性测试。这些值中的每一个被称为 `case`。变量将与每个 `case` 进行比较并测试。\n\
  \n以下是一个示例：\n```\nswitch(expression){\n    case value :\n        //语句\n        break;\
  \ //可选\n    case value :\n        //语句\n        break; //可选\n    default : //可选\n\
  \        //语句\n}\n```\n以下规则适用于 `switch` 语句：\n- `byte`、`short`、`int` 和 `char` 是可以用于\
  \ `switch` 语句的唯一变量。\n- `switch` 语句的 `case` 语句数量不受限制。它可以有多个 `case` 语句，且没有限制。\n- `switch`\
  \ 变量和 `case` 的值应该是相同的数据类型。\n- `switch` 变量和 `case` 数据类型应该是字面量或常量。\n- 如果 `switch`\
  \ 变量和 `case` 相等，则 `case` 之后的语句将继续执行，直到控制权找到 `break` 语句。\n- 控制权到达 `break` 语句后，`switch`\
  \ 终止。控制权现在转到 `switch` 语句之后的行。\n\n示例：\n```java\npublic class Test {\n  public static\
  \ void main(String args[]){\n    int x = 30;\n    switch(x){\n      case 10:\n \
  \       System.out.print(\"X is 10\");\n        break;\n      case 20:\n       \
  \ System.out.print(\"X is 20\");\n        break;\n      default:\n        System.out.print(\"\
  X is not 10 or 20\");\n    }\n  }\n}\n```\n这段代码将产生输出：\nX is not 10 or 20\n\n\n\n\
  \n\n- `case` 并不强制包含 `break`。如果没有提供 `break`，控制将继续穿透后续的 `case`，直到遇到 `break`。\n- 你可以为给定的\
  \ `switch` 语句添加一个可选的 `default` case。这个 `case` 选项应该是 `switch` 的最后一行。如果没有任何上述 `case`\
  \ 满足，则将执行此 `default` case。当使用 `default` case 时，你不需要添加 `break`。\n\n这是一个示例。\n\n示例：\n\
  \n```java\npublic class Test {\n\n  public static void main(String args[]){\n  \
  \  //char grade = args[0].charAt(0);\n    char grade = 'C';\n    switch(grade)\n\
  \    {\n        case 'A' :\n            System.out.println(\"Excellent!\");\n  \
  \          break;\n        case 'B' :\n        case 'C' :\n              System.out.println(\"\
  Well done\");\n              break;\n        case 'D' :\n              System.out.println(\"\
  You passed\");\n        case 'F' :\n              System.out.println(\"Better try\
  \ again\");\n              break;\n        default :\n              System.out.println(\"\
  Invalid grade\");\n    }\n    System.out.println(\"Your grade is \" + grade);\n\
  \  }\n}\n```\n\n使用各种命令行参数编译并运行该程序将得到以下输出。\n\n```bash\n$ java Test\nWell done\nYour\
  \ grade is a C\n$\n```\n\n# 第 10 章：异常\n\n异常可以定义为中断正常执行流的问题。简单来说，它可以被定义为程序执行过程中发生的问题。导致异常发生的原因有很多，其中包括：\n\
  \n- 提供无效数据。\n- Java 虚拟机内存耗尽。\n- 通信期间网络连接终止。\n- 找不到所需的文件。\n\n某些异常是由人为错误引起的，另一些是由程序员错误引起的，其余由于物理资源故障。\n\
  \n在 Java 中，异常分为三类。为了理解异常处理的概念，你应该了解异常的类型。异常的分类分类所示：\n\n- **检查异常 (Checked exceptions)**：如果一个异常无法被程序员预见，或者它是典型的用户错误，则可以定义为检查异常。检查异常在编译期间不能被忽略。\n\
  - **运行时异常 (Runtime exceptions)**：运行时异常可以定义为程序员可能已经解决的异常。与检查异常不同，运行时异常在编译期间会被忽略。\n\
  - **错误 (Errors)**：错误可以定义为用户或程序员无法控制的问题。这些不能被视为异常。错误通常会被忽略，因为它们是无法的。例如，在栈溢出的情况下会抛出一个错误。该错误在程序编译期间会被忽略。\n\
  \n下面列出了最常见的异常（包括检查异常和未检查异常）。所有这些异常都是 [Java 内置异常](http://www.tutorialspoint.com/java/java_builtin_exceptions.htm)\
  \ 的子集。\n\n### 异常方法\n\n下面列出了 `Throwable` 类提供的所有重要方法。\n\n| 序号 | 方法及描述 |\n| --- | ---\
  \ |\n| 1 | `public String getMessage()` 此方法将返回关于发生异常的详细信息，并在 `Throwable` 构造函数内部初始化。\
  \ |\n| 2 | `public Throwable getCause()` 此方法将返回导致异常的原因，这由一个 `Throwable` 对象表示。 |\n\
  | 3 | `public String toString()` 此消息将返回类名与 `getMessage()` 结果的拼接。 |\n| 4 | `public\
  \ void printStackTrace()` 此方法将 `toString()` 的结果结合堆栈树打印到错误输出流 `System.err`。 |\n|\
  \ 5 | `public StackTraceElement [] getStackTrace()` 此方法将返回一个包含给定堆栈轨迹上每个元素的数组。索引\
  \ 0 处的元素代表给定调用栈顶部的起始，而索引 0 处的方法... |\n| 6 | `public Throwable fillStackTrace()`\
  \ 通过此方法，堆栈轨迹将被填充 `Throwable` 对象。 |\n\n## 捕获异常\n\n在 Java 中，可以使用 `try` 和 `catch` 关键字捕获异常。如果\
  \ `try` 块中出现异常，它将传递传递给 `catch` 块。\n\n语法：\n```java\ntry {\n    // 受保护的代码\n} catch\
  \ (Exception e) {\n    // catch 块\n}\n```\n\n示例：\n\n```java\nimport java.io.*;\n\
  \npublic class Test {\n  public static void main(String args[]){\n    try{\n   \
  \   int a[] = new int[2];\n      System.out.println(a[3]);\n    } catch(ArrayIndexOutOfBoundsException\
  \ e){\n      System.out.println(\"Exception: \" + e);\n    }\n  }\n}\n```\n输出：\n\
  ```\nException: java.lang.ArrayIndexOutOfBoundsException: 3\n```\n\n### 多个 catch\
  \ 块\n\n`try` 块后的 `catch` 块数量不限于 1。为了高效地处理异常，你可以拥有任意数量的 `catch` 块。\n\n语法：\n```java\n\
  try {\n    // 受保护的代码\n} catch (Exception1 e1) {\n    // catch 块\n} catch (Exception2\
  \ e2) {\n    // catch 块\n} catch (Exception3 e3) {\n    // catch 块\n}\n```\n如果抛出的异常匹配\
  \ `Exception1`，它将在那里被捕获。如果异常类型不匹配，它将传递给下一个 `catch` 块。此过程一直持续，直到抛出的异常被捕获或所有的 `catch`\
  \ 块结束。\n\n示例：\n\n```java\ntry {\n    file = new FileInputStream(fileName);\n   \
  \ x = (byte) file.read();\n} catch(IOException i) {\n    i.printStackTrace();\n\
  \    return -1;\n} catch(FileNotFoundException f)\n```\n\n示例 2：\n\n```java\npackage\
  \ com.myjava.exceptions;\n\nimport java.net.MalformedURLException;\nimport java.net.URL;\n\
  \npublic class MyMultipleCatchBlocks {\n  public static void main(String a[]){\n\
  \    MyMultipleCatchBlocks mmcb = new MyMultipleCatchBlocks();\n    mmcb.execute(1);\n\
  \    mmcb.execute(2);\n  }\n  public void execute(int i){\n    try{\n      if(i\
  \ == 1){\n        getIntValue(\"7u\");\n      } else {\n        getUrlObj(\"www.junksite.com\"\
  );\n      }\n    } catch (NumberFormatException nfe){\n      System.out.println(\"\
  Inside NumberFormatException... \"+nfe.getMessage());\n    } catch (MalformedURLException\
  \ mue){\n```\n\n\n\n\n\n```java\nSystem.out.println(\"Inside MalformedURLException...\
  \ \"+mue.getMessage());\n} catch (Exception ex) {\n    System.out.println(\"Inside\
  \ Exception... \"+ex.getMessage());\n}\n}\n\npublic int getIntValue(String num)\
  \ {\n    return Integer.parseInt(num);\n}\n\npublic URL getUrlObj(String urlStr)\
  \ throws MalformedURLException {\n    return new URL(urlStr);\n}\n\n```\n\n### throw/throws\
  \ 关键字\n\n如果给定的方法没有处理给定的检查异常（checked exception），则必须使用 `throws` 关键字进行声明。该关键字将用于方法签的末尾。\n\
  \n使用 `throw` 关键字，可以处理新实例化的异常或刚刚捕获的异常。`throw` 和 `throws` 关键字之间存在区别。\n\n在下面的示例中，方法将抛出\
  \ `RemoteException`。\n\n```java\nimport java.io.*;\n\npublic class className {\n\
  \    public void deposit(double amount) throws RemoteException {\n        // 方法实现\n\
  \        throw new RemoteException();\n    }\n    // 类定义的剩余部分\n}\n```\n\n一个方法可以声明抛出多个异常，在这种情况下，异常将在用逗号分隔的列表中进行声明。例如，下面的方法声明了它抛出\
  \ `RemoteException` 和 `InsufficientFundsException`：\n\n```java\nimport java.io.*;\n\
  \npublic class className {\n    public void withdraw(double amount) throws RemoteException,\
  \ InsufficientFundsException {\n        // 方法实现\n    }\n    // 类定义的剩余部分\n}\n```\n\
  \n### finally 关键字\n\n`finally` 关键字用于创建一个跟在 `try` 块之后的代码块。无论是否发生异常，`finally` 代码块始终会被执行。\n\
  \n使用 `finally` 块允许你运行任何想要执行的清理类型语句，无论受保护的代码中发生了什么。\n\n`finally` 块出现在 `catch` 块的末尾，并具有如下语法：\n\
  \n```java\ntry {\n    // 受保护的代码\n} catch(ExceptionType1 e1) {\n    // 捕获块\n} catch(ExceptionType2\
  \ e2) {\n    // 捕获块\n} catch(ExceptionType3 e3) {\n    // 捕获块\n} finally {\n   \
  \ // finally 块始终执行。\n}\n```\n\n示例：\n\n```java\npublic class ExcepTest{\n    public\
  \ static void main(String args[]) {\n        int a[] = new int[2];\n        try\
  \ {\n            System.out.println(\"Access element three :\" + a[3]);\n      \
  \  } catch(ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  Exception thrown  :\" + e);\n        } finally {\n            a[0] = 6;\n      \
  \      System.out.println(\"First element value: \" +a[0]);\n            System.out.println(\"\
  The finally statement is executed\");\n        }\n    }\n}\n```\n\n这将会产生以下结果：\n\
  ```text\nException thrown  :java.lang.ArrayIndexOutOfBoundsException: 3\nFirst element\
  \ value: 6\nThe finally statement is executed\n```\n\n注意以下几点：\n- 没有 `try` 语句就没有\
  \ `catch` 子句。\n- 当存在 `try/catch` 块时，并不强制要求有 `finally` 子句。\n- `try` 块在没有 `catch`\
  \ 子句或 `finally` 子句的情况下不存在。\n- `try`、`catch`、`finally` 块之间不能存在任何代码。\n\n这里是关于异常处理的更多示例。\n\
  \n示例 1：Try- Catch 块\n\n```java\npackage com.myjava.exceptions;\n\npublic class MyExceptionHandle\
  \ {\n    public static void main(String a[]) {\n        try {\n            for(int\
  \ i=5;i>=0;i--) {\n                System.out.println(10/i);\n            }\n  \
  \      } catch(Exception ex) {\n            System.out.println(\"Exception Message:\
  \ \"+ex.getMessage());\n            ex.printStackTrace();\n        }\n        System.out.println(\"\
  After loop...\");\n    }\n}\n```\n输出：\n```text\n2\n3\n5\n10\nException Message:\
  \ / zero\njava.lang.ArithmeticException: / zero\nat com.myjava.exceptions.MyExceptionHandle.main(MyExceptionHandle.java:12)\n\
  After loop...\n```\n\n示例 2：Throws 子句\n\n```java\npackage com.myjava.exceptions;\n\
  \npublic class MyThrowsClause {\n    public static void main(String a[]) {\n   \
  \     MyThrowsClause mytc = new MyThrowsClause();\n        try {\n            for(int\
  \ i=0; i<5; i++) {\n                mytc.getJunk();\n                System.out.println(i);\n\
  \            }\n        } catch (InterruptedException ie) {\n            iex.printStackTrace();\n\
  \        }\n    }\n    public void getJunk() throws InterruptedException {\n   \
  \     Thread.sleep(1000);\n    }\n}\n```\n\n示例 3：Throw 子句\n\n```java\npackage com.myjava.exceptions;\n\
  \npublic class MyExplicitThrow {\n    public static void main(String a[]) {\n  \
  \      try {\n            MyExplicitThrow met = new MyExplicitThrow();\n       \
  \     System.out.println(\"length of DUKE is \"+met.getStringSize(\"JUNK\"));\n\
  \            System.out.println(\"length of DUCATI is \"+met.getStringSize(\"WRONG\"\
  ));\n            System.out.println(\"length of null string is \"+met.getStringSize(null));\n\
  \        } catch (Exception ex) {\n            System.out.println(\"Exception message:\
  \ \"+ex.getMessage());\n        }\n    }\n    public int getStringSize(String str)\
  \ throws Exception {\n        if(str == null) {\n            throw new Exception(\"\
  String input is null\");\n        }\n        return str.length();\n    }\n}\n```\n\
  输出：\n```text\nlength of DUKE is 4\nlength of DUCATI is 6\nException message: String\
  \ input is null\n```\n\n## 自定义异常\n\n你可以在 Java 中创建自己的异常。在编写自定义异常类时，请记住以下几点：\n- 所有异常必须是\
  \ `Throwable` 的子类。\n- 如果你想编写一个由“处理或声明规则”（Handle or Declare Rule）自动强制的检查异常，你需要扩展\
  \ `Exception` 类。\n- 如果你想编写一个运行时异常（runtime exception），你需要扩展 `RuntimeException` 类。\n\
  \n我们可以如下所示定义自己的 `Exception` 类：\n\n```java\nclass MyException extends Exception {\n\
  }\n```\n\n你只需要扩展 `Exception` 类来创建你自己的异常类。这些被视为检查异常。下面的 `InsufficientFundsException`\
  \ 类是一个扩展 `Exception` 类的自定义异常，使其成为检查异常。异常类与其他任何类一样，包含有用的字段和方法。\n\n示例：\n文件名：InsufficientFundsException.java\n\
  ```java\nimport java.io.*;\n\npublic class InsufficientFundsException extends Exception\
  \ {\n    private double amount;\n    public InsufficientFundsException(double amount)\
  \ {\n        this.amount = amount;\n    }\n    public double getAmount() {\n   \
  \     return amount;\n    }\n}\n```\n\n为了演示使用自定义异常，下面的 `CheckingAccount` 类包含一个抛出\
  \ `InsufficientFundsException` 的方法。\n\n文件名：CheckingAccount.java\n```java\nimport\
  \ java.io.*;\n\npublic class CheckingAccount {\n    private double balance;\n  \
  \  private int number;\n    public CheckingAccount(int number) {\n        this.number\
  \ = number;\n    }\n    public void deposit(double amount) {\n        balance +=\
  \ amount;\n    }\n    public void withdraw(double amount) throws InsufficientFundsException\
  \ {\n        if(amount <= balance) {\n            balance -= amount;\n        }\
  \ else {\n            double needs = amount - balance;\n            throw new InsufficientFundsException(needs);\n\
  \        }\n    }\n    public double getBalance() {\n        return balance;\n \
  \   }\n    public int getNumber() {\n        return number;\n    }\n}\n```\n\n在下面的程序\
  \ `BankDemo` 中，`deposit()` 和 `withdraw()` 方法将被调用。它们属于 `CheckingAccount`。\n\n文件名：BankDemo.java\n\
  ```java\npublic class BankDemo {\n    public static void main(String [] args) {\n\
  \        CheckingAccount c = new CheckingAccount(101);\n        System.out.println(\"\
  Depositing $500...\");\n        c.deposit(500.00);\n        try {\n            System.out.println(\"\
  \\nWithdrawing $100...\");\n            c.withdraw(100.00);\n            System.out.println(\"\
  \\nWithdrawing $600...\");\n            c.withdraw(600.00);\n        } catch(InsufficientFundsException\
  \ e) {\n            System.out.println(\"Sorry, but you are short $\" + e.getAmount());\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n编译上述文件并运行 `BankDemo`\
  \ 将带得到以下输出。\n\n```\nDepositing $500...\nWithdrawing $100...\nWithdrawing $600...\n\
  Sorry, but you are short $200.0\nInsufficientFundsException\n       at CheckingAccount.withdraw(CheckingAccount.java:25)\n\
  \       at BankDemo.main(BankDemo.java:13)\n```\n\n## 常见异常\n\n在 Java 中我们有两种类型的错误和异常。它们是：\n\
  \n- **JVM 异常 (JVM Exceptions)**：JVM 异常仅仅是由 Java 虚拟机逻辑上或排他性抛出的异常。例如：`ArrayIndexOutOfBoundsException`、`NullPointerException`、`ClassCastException`\
  \ 等。\n- **程序异常 (Programmatic exceptions)**：程序性异常可以定义为由 API 或应用程序抛出的异常。例如：`IllegalStateException`、`IllegalArgumentException`\
  \ 等。\n\n# 第 11 章：如何安装 Java\n\n现在你已经知道了 Java 的组成部分，是时候在你的计算机上安装它并查看如何实际使用了。你需要一台运行\
  \ Windows、Linux、OS X 或 Solaris 的电脑或笔记本电脑。\n\n## 如何在 Windows 上安装 Java\n\n通过 Windows，你可以在线或离线下载并安装\
  \ Java。\n\n### 在线安装\n\n在线下载 Java 将下载一个从网络安装（IFTW）的可执行文件，这需要你进行最少的干预。运行此程序将允许从网络拉取所有所需的文件，因此在整个安装过程中保持网络连接非常重要。\n\
  \n- 在 Microsoft Windows 上安装 Java，你需要管理员权限。\n- 如果你使用此方法遇到任何问题，请尝试离线方法，我将在稍后详细介绍。\n\
  \n### 安装\n\n- 适用于 Windows 2008 Server、7、8/8.1、XP、Server 2012、Vista、Windows 10\n\n\
  在开始安装之前，禁用防火墙。某些可能会拒绝任何在线或自动安装（如 Java），如果防火墙开启或未正确配置，它可能会阻塞下载或完全停止下载。\n\n- 打开[手动下载](https://java.com/en/download/manual.jsp)\
  \ 页面。\n- 点击 Windows Online。\n- 将出现一个窗口，提供运行或保存文件的选项——如果你现在就想继续安装，点击“运行”；如果你喜欢以后再做，点击“保存”并记住它保存的位置。\n\
  - 如果你现在点击“运行”，安装过程将立即开始。\n- 点击“安装”以接受许可条款并继续。\n- 在 Java 安装期间，你可能会收到安装各种程序的提议——这是由于\
  \ Oracle 与其他几家公司之间的合作伙伴关系。如果你想安装其中任何一个，请确保它们已勾选并点击“下一步”。\n- 按照屏幕上的指示完成安装，并在最后一个对话框上点击“关闭”。这将完成安装。\n\
  \n安装程序程序集成了一个卸载程序。此此程序的意图是检测并移除计算机上可能安装的旧版本 Java。这在 Windows 32 位和 64 位系统上均有效。\n\n\
  安装程序还会告诉你你的网络浏览器是否禁用了 Java 内容，并提供让你遵循的说明以启用它。如果你选择了隐藏 Java Web Start 和 applet 的安全提示，你也将获得如何恢复这些提示的说明。如果你在要求重启浏览器时没有重启，可能需要重启计算机。\n\
  \n### 离线安装\n\n此方法涉及下载一个可执行文件，该文件包含了你需要的所有文件，因此你可以在自己的时间安装 Java。安装时不需要连接网络，仅初始下载时需要。你也可以复制该文件然后安装在另一台未连接网络的计算机上。\n\
  \n再次，执行此操作你需要管理员权限。\n\n- 打开[手动下载](https://java.com/en/download/manual.jsp) 页面。\n\
