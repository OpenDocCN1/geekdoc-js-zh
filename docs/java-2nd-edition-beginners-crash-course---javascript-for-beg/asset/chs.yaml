  \ 32 位版本的 Oracle Solaris，你只需要下载并安装 32 位版本。\n\n注意 – `.tar.gz` 文件也称为 tarball，可以一次性解压缩并提取。\n\
  \n*   切换目录到 JRE 将要安装的位置：`cd <directory path name>`\n*   将以 `.tar.gz` 结尾的存档二进制文件移动到当前目录。\n\
  *   解压 tar 包并安装 Java：\n\n在 SPARC 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-sparc.tar.gz\
  \ | tar xf –`\n*   `gzip -dc jre-7u7-solaris-sparcv9.tar.gz | tar xf –`\n\n在 x64/EM64T\
  \ 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-i586.tar.gz | tar xf –`\n*   `gzip -dc\
  \ jre-7u7-solaris-x64.tar.gz | tar xf -`\n\nJava 将安装在当前目录下的 `jre1.7.0_<version>`\
  \ 目录中，辅助的 64 位文件将安装在与机器架构模型对应的目录中。这些文件位于版本目录内的多个位置，例如：\n\nSPARC 处理器 – `libjvm.so`\
  \ 文件（64 位 Java VM 库文件）。Java 安装在当前目录下的 `jre1.7.0_<version>` 目录中。\n\n## 启用与配置\n\n\
  一旦安装了 Java，是时候确保它已配置为可以在浏览器中运行 applet 了：\n\n*   通过输入 `cd <Firefox installation directory>/plugins`\
  \ 查找 Firefox 安装目录下的插件子目录。\n*   Java 安装在当前目录下的 `jre1.7.0_<version>` 目录中。\n\n# 第 12\
  \ 章：编写你的第一个程序\n\n既然你已经了解了 Java 并知道如何安装它，是时候开始编写程序了。记住，在 Java 中，所有工作都在文字处理器（Word\
  \ Processor）中完成，而不是在命令行中。打开文字处理器并输入：\n\n```java\nclass Pythagorean {\n    public\
  \ static void main(String[] args){\n\n    }\n}\n```\n\n让我解释一下你做了什么：\n\n每个类都在一个新类中打开。把类想象成一组指令，或者说一份食谱。有些食谱需要额外的食谱才能完成，而另一些像你写的这种则可以独立运行。假设你正在制作墨西哥鳄果酱（guacamole）；你的食谱将包含如何制作的逐步说明。这是一个单一类。现在，假设你想做一个墨西哥卷饼（burrito）而它需要鳄果酱。现在你有两个选择\
  \ – 写一个包含制作卷饼和鳄果酱说明的食谱，或者你可以写卷饼食谱，然后引用独立的鳄果酱食谱。这就是 Java 的做法。你可以让一个类引用另一个类，也可以让包含所有内容的类。这就是为什么\
  \ Java 是面向对象的 – 因为你可以根据喜好来编写。现在，让我们拆解你刚刚输入的内容：\n\n*   在这个例子中类名是 `Pythagorean`。所有的\
  \ Java 文件都必须保存为类名，后接 `.java`。\n*   类由第一个 `{` 打开。\n*   下一行 `public static void main(String[]\
  \ args)` 是在调用类的 main 方法。虽然这有点高级，但你应该记住它，因为你会经常使用它。\n*   `}` 括号关闭了程序分段。编写每个程序时必须做的一件事是确保每个开启括号都有对应的闭合括号。\n\
  \n在这个阶段，你的应用程序不会执行任何操作，但我们仍然需要保存它。\n\n接下来，我们要运行这个应用程序，即使它无所作为。这样做是为了让你养成这种习惯。你需要在每个阶段都运行应用程序进行测试。如下：\n\
  \nWindows：\n\n*   打开命令行\n*   找到你保存应用程序的位置\n*   现在在命令行输入类似以下的内容：`C:/java/samples>javac\
  \ Pythagorean.java`\n\n\n\n\n\n`/java/samples` 是你当前所在的目录。在计算机语言中，`/name` 表示一个文件夹。最后一部分是你保存应用程序的地方。例如，如果你将它保存到桌面上，你会输入\
  \ `/desktop>javac Pythagorean.java`\n\n`javac` 意味着 java compile（Java 编译），这是一个将应用程序从可读词汇转换为计算机语言的过程。如果出现错误（如果有的话），错误也会在这里显示。这些错误可以在原始应用程序中轻松地修正。\n\
  \n好了，如果什么都没有发生，那么你就知道你的应用程序运行正常了，因为它原本就没打算执行任何操作。找到你保存应用程序的文件夹；你现在应该能看到一个读为 `Pythagorean.class`\
  \ 的第二个文件。如果它在那里，那就一切正常。如果不在那里，你需要检查应用程序内部以及命令行上的文本，以确保你的每一个操作都是正确的。\n\n## Mac\n\n\
  这个过程与 Windows 类似：\n\n*   打开 `terminal.app`\n*   找到你保存应用程序的位置\n*   在终端输入 `cd <name\
  \ of directory>`\n*   现在输入与你在 Windows 版本类似的内容 - `C:/java/samples>javac Pythagorean.java`\n\
  \n下一步是让你的应用程序执行某些操作。在你的文字处理器窗口中，输入以下内容（我在这里从零开始，但你可以在之前输入的内容之后继续，从正确的地方开始）：\n\n\
  ```java\nclass Pythagorean {\n    public static void main(String[] args){\n    \
  \    String greeting = “Hello. Welcome to the Pythagorean Theorem Application. Today\
  \ we will be computing the Pythagorean Theorem for you.\",\n        String prompt\
  \ = \"Please enter a number for the first leg of a right triangle, followed by pressing\
  \ ENTER or RETURN, followed by the remaining leg. Then hit ENTER or RETURN one more\
  \ time.\";\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
  \    }\n}\n```\n\n将其拆解如下：\n\n*   字符串（string）是一行文本，这被称为变量，意味着它是可以改变的\n*   `Prompt`\
  \ 和 `greeting` 是字符串名称，因此在以 `String greeting` 开头的这一行中，你正在创建一个名为 `greeting` 的字符串。注意，该行以分号结尾——这非常重要——所有的\
  \ JAVA 语句必须以分号结尾，否则你将得到错误\n*   `=` 用于给变量赋值，其方式如下：`String greeting = \"Hello. Welcome\
  \ to the Pythagorean Theorem Application. Today we will be computing the Pythagorean\
  \ Theorem for you.\";` 或者如下：`String greeting; greeting = \"Hello. Welcome to the\
  \ Pythagorean Theorem Application. Today we will be computing the Pythagorean Theorem\
  \ for you.\";`\n\n在后一种情况下，你分两个独立的步骤声明变量并为其赋值，而在第一种情况下，你只使用了一步。两者的工作方式相同。请记住，进入变量的所有文本必须包含在引号内——“”\n\
  \n在 `System.out.println`这一行中，你正在调用系统输出打印变量行。如果你调用 `System.out.println(“HI”)`，单词“HI”将打印到你的终端上。注意这里的引号——它们表示引号之间的内容是文本，而不是变量名。如果你调用\
  \ `System.out.println(HI)` 而不加引号，你将得到错误信息，因为程序将试图打印一个名为 `HI` 的变量的值——而并没有这个变量。请记住这个命令；它是另一个你会经常使用的命令。\n\
  \n现在我们要稍微做些改变，让它变得复杂一点。将你目前编写的代码修改为如下内容：\n\n```java\nimport java.util.Scanner;\n\
  class Pythagorean {\n    public static void main(String[] args){\n        String\
  \ greeting = \"Hello. Welcome to the Pythagorean Theorem Application. Today we will\
  \ be computing the Pythagorean Theorem for you.\";\n        String prompt = \"Please\
  \ enter a number for the first leg of a right triangle, followed by pressing ENTER\
  \ or RETURN, followed by the remaining leg. Then hit ENTER or RETURN one more time.\"\
  ;\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
  \        float a;\n        float b;\n        Scanner myScanner = new Scanner(System.in);\n\
  \        a = myScanner.nextFloat();\n        b = myScanner.nextFloat();\n      \
  \  float a2 = a * a;\n        float b2 = b * b;\n        double c2 = a2 + b2;\n\
  \        double c = Math.sqrt(c2);\n        System.out.println(\"The square of a\
  \ is: \" + a2 + \" The square of b is: \" + b2 + \" The square of c is: \" + c2\
  \ + \" C is: \" + c);\n    }\n}\n```\n\n现在，你可能正瞪大眼睛看着这段代码，纳闷这到底是怎么回事，让我们来拆解一下。\n\
  \n第一行与原始代码不同——我们在这里做的目的是告诉你的程序你想让它导入 `SCANNER`，这是一个 Java 工具类。如你所知，scanner 的作用是扫描东西，它在这里要做的是扫描你在命令行输入的内容。我说得清楚吗？\n\
  \n`float a;` 和 `float b;` 都是在声明变量。`Scanner myScanner = new Scanner(System.in);`\
  \ 意味着你创建了一个扫描器并命名为 myScanner，它的输入来自 `System.in`。`a = myScanner.nextFloat();` 意味着变量\
  \ `a` 将被赋值为扫描器的第一个浮点数。`b = myScanner.nextFloat();` 则是对下一个浮点数执行操作。\n\n现在，这里包含了大量的数学运算：\n\
  \n*   `float a2 = a * a;` 声明了一个名为 `a2` 的变量，并赋值为 `a` 乘以 `a` 的值\n*   `float b2 = b\
  \ * b;` 同样是针对 float `b`\n*   `double c2 = a2 + b2;` 声明了一个 double 类型（长精度小数），并将其赋值为\
  \ `a2` 加上 `b2`\n*   `double c = Math.sqrt(c2);` 取 `c2` 的平方根并将其放入变量 `c` 中\n\n代码的最后一行直接将所有内容打印出来。引号内的任何内容将作为文本打印，而\
  \ `+` 用于组合输出。任何不在引号内的内容将打印变量的值。\n\n我就写到这里，因为从这里开始事情会变得复杂得多，你首先需要学习 Java 的函数。\n\n\
  # \n\n第 13 章：Java 函数\n\n为了在编写 Java 代码时理解你在做什么，你必须首先了解 Java 的函数。我在本书前面的部分已经讨论过了一些基础函数，现在是时候查看一些高级函数了。\n\
  \n## 循环控制\n\n在有时，你需要多次执行一段代码块。通常情况下，所有语句按顺序执行，函数中的第一个语句先执行，第二个后执行，以此类推直到结束。大多数编程语言都有许多控制结构允许你执行更复杂的执行指令，Java\
  \ 也不例外。\n\n循环语句允许你多次执行单条语句或一组语句。以下是 Java 提供的处理循环要求的循环列表：\n\n*   `while` 循环只要给定条件为真，就会重复执行单条或一组语句。条件在循环体执行之前进行测试\n\
  *   `for` 循环将按次数执行语句序列，并能简化循环变量的管理代码\n*   `do…while` 循环——与 `while` 语句类似，但这种循环是在循环体结束后进行测试\n\
  \n\n\n\n\n### 循环控制语句\n\n循环控制语句会改变其正常的执行顺序。一旦执行离开某个作用域，在该作用域中创建的所有自动对象都将被销。Java 支持以下循环控制语句：\n\
  \n* `break` 语句 – 将终止 `switch` 或循环语句，执行将移动到紧随其后的语句\n* `continue` 语句 - 使循环跳过主体的剩余部分，并在重新开始之前再次测试条件\n\
  \n### 增强型 for 循环 (Enhanced for loop)\n\n增强型 for 循环在 Java 5 中引入，通常用于遍历可能包含数组的元素组。增强型\
  \ for 循环使用的语法如下：\n\n```java\nfor(declaration : expression)\n{\n    //Statements\n\
  }\n```\n\n`Declaration` 是新定义的块变量，其类型与你正在访问的数组中的所有元素完全兼容。该变量位于 `for` 块中，它的值将与数组中的当前元素相同。\n\
  \n`Expression` 评估结果为你想要遍历的数组，它可以是一个返回数组的方法调用，也可以是一个数组变量。\n\n### 示例\n\n```java\n\
  public class Test {\n    public static void main(String args[]){ {\n        int\
  \ [] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers ){\n         \
  \   System.out.print( x );\n            System.out.print(\",\");\n        }\n  \
  \      System.out.print(\"\\n\");\n        String [] names ={\"James\", \"Larry\"\
  , \"Tom\", \"Lacy\"};\n        for( String name : names ) {\n            System.out.print(\
  \ name );\n            System.out.print(\",\");\n        }\n    }\n}\n```\n\n执行此代码将得到以下结果：\n\
  \n* 10,20,30,40,50,\n* James,Larry,Tom,Lacy\n\n## Numbers 类\n\n在 Java 中，当我们处理数字时，通常使用原始数据类型，如\
  \ `double`、`int`、`byte`、`long` 等，例如：\n\n* `int i = 5000;`\n* `float gpa = 13.65;`\n\
  * `byte mask = 0xaf;`\n\n然而在开发过程中，你可能会遇到需要使用对象而不是原始类型的情况。为了实现这一点，Java 提供了称为包装类 (wrapper\
  \ classes) 的机制。包装类包括：\n\n* `Integer`\n* `Long`\n* `Byte`\n* `Double`\n* `Float`\n\
  * `Short`\n\n它们都是主抽象类 `number` 的子类。\n\n包装类包含了原始数据类型，根据其名称，例如 `Long` 包装类将包含 `long`\
  \ 数据类型。将这些原始类型转换为对象被称为**装箱 (boxing)**，编译器会自动为你完成这一操作。因此，如果你在使用包装类，你只需要将其内部数据类型的值传递给包装类的构造函数即可。包装对象被转换回原始数据类型，这一过程被称为**拆箱\
  \ (unboxing)**。\n\n装箱和拆箱的示例如下：\n\n```java\npublic class Test{\n    public static\
  \ void main(String args[]){\n        Integer x = 5; // 将 int 装箱为 Integer 对象\n  \
  \      x = x + 10;  // 将 Integer 解箱为 int\n        System.out.println(x);\n    }\n\
  }\n```\n\n执行此代码将得到此结果：\n\n* 15\n\n在 `x` 被赋值整数值的情况下，编译器会将该整数装箱，因为它是一个对象。稍后，`x` 将被拆箱，以便作为整数进行加法。\n\
  \n### Number 方法\n\n以下是所有 `Number` 类子类都实现的实例方法列表：\n\n* `xxxValue()` – 将数字对象的值转换为数据类型\
  \ `xxx` 并返回 `i`\n* `compareTo()` – 将数字对象与参数进行比较\n* `equals()` - 确定数字对象实际上是否与参数相等\n\
  * `valueOf()` - 返回一个持有指定原始类型值的整数对象\n* `toString()` - 返回一个表示指定 `int` 或整数值的 `String`\
  \ 对象\n* `parseInt()` - 用于获取指定 `String` 的原始数据类型\n* `abs()` - 返回指定参数的绝对值\n* `ceil()`\
  \ - 返回大于或等于参数的最小整数，并以 `double` 类型返回\n* `floor()` - 返回小于或等于参数的最大整数，并以 `double` 类型返回\n\
  * `rint()` - 返回与参数值最接近的整数，同样以 `double` 类型返回\n* `round()` - 返回与参数最接近的 `int` 或 `long`（取决于方法的返回类型）\n\
  * `min()` – 返回一对参数中的较值\n* `max()` – 返回一对参数中的最大值\n* `exp()` – 返回自然对数底的幂，例如参数的次方\n\
  * `log()` – 返回指定参数的自然对数\n* `pow()` – 返回第一个参数的以第二个参数为幂\n* `sqrt()` – 返回指定参数的平方根\n\
  * `sin()` - 返回指定的 `double` 值的正弦值\n* `cos()` - 返回指定的 `double` 值的余弦值\n* `tan()` -\
  \ 返回指定的 `double` 值的正切值\n* `asin()` - 返回指定参数的反正弦\n* `acos()` - 返回指定参数的反余弦\n* `atan()`\
  \ - 返回指定参数的正切\n* `toDegrees()` - 将参数转换为角度\n* `toRadians()` - 将参数转换为弧度\n* `random()`\
  \ - 返回一个随机数\n\n## Character 类\n\n我们在 Java 中处理字符时，倾向于使用原始数据类型 `char`，例如：\n\n* `char\
  \ ch = 'a';`\n* // Unicode 大写希腊字母\n* `char uniChar = '\\u39A';`\n* // 字符数组\n* `char[]\
  \ charArray ={a', 'b', 'c', 'd'};`\n\n正如我们处理数字一样，还有一个名为 `Character` 的包装类，允许你使用对象而不是原始类型\
  \ `char`。`Character` 类有一些非常有用的方法可以操作字符，你可以使用 `Character` 构造函数创建一个对象，例如：\n\n```java\n\
  Character ch = new Character('a');\n```\n\n在某些情况下，编译器会自动为你创建 `Character` 对象，例如，如果你将原始\
  \ `char` 传递给一个需要对象的方法，编译器会转换 `char`。这被称为自动装箱；而如果 `Character` 被转换为 `char`，则被称为拆箱。\n\
  \n例如：\n\n```java\n// 这里将原始 char 'a' 装箱为 Character 对象\nCharacter ch = 'a';\n\n###\
  \ 这里原始 'x' 装箱传递给方法 test，\n// 返回拆箱为 char 'c'\nchar c = test('x');\n```\n\n### 转义序列\n\
  \n如果字符前面有一个反斜杠 `\\`，它被认为转义序列，对编译器具有特殊含义。你可能在某些程序中也见过 `\\n`。这是一个换行符，主要用于 `System.out.println()`\
  \ 语句在打印字符串后移动到下一行。以下是 Java 中的转义序列：\n\n* `\\t` - 在标记处插入一个制表符\n* `\\b` - 在标记处插入一个退格符\n\
  * `\\n` - 在标记处插入一个换行符\n* `\\r` - 在标记处插入一个回车符\n* `\\f` - 在标记处插入一个换页符\n* `\\'` - 在标记处插入一个单引号\n\
  * `\\\"` - 在标记处插入一个双端引号\n* `\\\\` - 在标记处插入一个反斜杠字符\n\n当编译器在 `rint` 语句中遇到转义序列时，它将按照编写的方式进行解释。\n\
  \n\n\n\n\n例如，如果你想在引号内部嵌套引号，则需要对内部的引号使用 `\\\"` 转义序列：\n\n```java\npublic class Test\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  She said \\\"Hello!\\\" to me.\");\n    }\n}\n```\n\n执行此代码将产生以下结果：\nShe said \"\
  Hello!\" to me.\n\n### 字符方法\n\n以下是 `Character` 类子类实现的所有重要实例方法列表：\n\n* `isLetter()`\
  \ – 确定指定的 `char` 值是否为字母\n* `isDigit()` – 确定指定的 `char` 值是否为数字\n* `isWhitespace()`\
  \ – 确定指定的 `char` 值是否为空白字符\n* `isUpperCase()` – 确定指定的 `char` 值是否为大写\n* `isLowerCase()`\
  \ - 确定指定的 `char` 值是否为小写\n* `toUpperCase()` - 返回指定的大写形式的 `char` 值\n* `toLowerCase()`\
  \ - 返回指定的小写形式的 `char` 值\n* `toString()` – 返回一个 `String` 对象，该对象是包含单个字符的 `String`，表示指定的字符值\n\
  \n### 字符串 类\n\n`Strings` 在 Java 中被广泛使用，它们仅仅是字符序列。在 Java 编程中，`Strings` 被称为对象，平台提供了\
  \ `Strings` 类允许你创建并对字符串进行操作。\n\n创建字符串最简单的方法如下：\n\n```java\nString greeting = \"\
  Hello world!\";\n```\n\n每当编译器遇到代码中编写的字符串字面量时，它都会创建一个 `String` 对象。在上面的例子中，值为“Hello,\
  \ World!”.像任何其他对象一样，可以使用构造函数和 `new` 关键字来创建 `String` 对象。`String` 类中有 11 个构造函数，它们都允许你通过不同的途径（例如字符数组）提供字符串的初始值。例如：\n\
  \n```java\npublic class StringDemo{\n    public static void main(String args[]){\n\
  \        char[] helloArray = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String helloString\
  \ = new String(helloArray); \n        System.out.println( helloString );\n    }\n\
  }\n```\n\n执行此代码将得到以下结果：\nhello.\n\n请注意，`String` 类是不可变的。这意味着一旦你创建了它，就无法更改 `String`\
  \ 对象。如果你发现需要修改字符串，则需要使用 `StringBuffer` 和 `StringBuilder` 类。\n\n### 字符串长度\n\n当你使用方法来获取有关对象的信息时，该方法被称为访问器方法（accessor\
  \ method）。你可以使用的其中一个是 `length()` 方法，它将返回字符串对象内部的字符数量。例如：\n\n```java\npublic class\
  \ StringDemo {\n    public static void main(String args[]) {\n        String palindrome\
  \ = \"Dot saw I was Tod\";\n        int len = palindrome.length();\n        System.out.println(\
  \ \"String Length is : \" + len );\n    }\n}\n```\n\n执行此代码将产生以下结果：\nString Length\
  \ is : 17\n\n### 字符串拼接\n\n`String` 类中有一个方法用于拼接两个字符串：\n\n```java\nstring1.concat(string2);\n\
  ```\n\n这将返回一个在 `string1` 后面加上 `string2` 的字符串。每当编译器遇到代码中编写的字符串字面量时，它都会创建一个 `String`\
  \ 对象。在上面的例子中，值为“Hello, World!”.像任何其他对象一样，可以使用构造函数和 `new` 关键字来创建 `String` 对象。`String`\
  \ 类中有 11 个构造函数，它们都允许你通过不同的途径（例如字符数组）提供字符串的初始值。例如：\n\n```java\npublic class StringDemo{\n\
  \    public static void main(String args[]){\n        char[] helloArray = { 'h',\
  \ 'e', 'l', 'l', 'o', '.'};\n        String helloString = new String(helloArray);\
  \ \n        System.out.println( helloString );\n    }\n}\n```\n\n### 创建字符串\n\n要格式化字符串，你可以使用\
  \ `format()` 方法。`format()` 方法与 `printf()` ，但它返回一个格式化后的字符串而不是将其打印到控制台。\n\n```java\n\
  String s = String.format(\"Hello, %s!\", \"World\");\n```\n\n### 字符串方法\n\n以下是 `String`\
  \ 类支持的所有方法列表：\n\n* `charAt(int index)` – 返回索引处的字符\n* `compareTo(Object o)` – 将此字符串与对象进行比较\n\
  * `compareTo(String anotherString)` – 按字典顺序比较字符串\n* `compareToIgnoreCase(String\
  \ str)` – 与字符串进行比较但忽略大小写差异\n* `concat(String str)` – 将字符串拼接到末尾\n* `contentEquals(StringBuffer\
  \ sb)` – 如果字符串与 `StringBuffer` 具有相同的序列则返回 true\n* `static copyValueOf(char[] data)`\
  \ – 返回一个表示字符的字符串\n* `static copyValueOf(char[] data, int offset, int count)` – 与上述方法相同\n\
  * `endsWith(String suffix)` – 测试字符串是否具有该后缀\n* `equals(Object anObject)` – 将此字符串与对象进行比较\n\
  * `equalsIgnoreCase(String anotherString)` – 将一个字符串与另一个比较但忽略大小写\n* `byte getBytes()`\
  \ – 将字符串编码为字节序列，使用默认字符集\n* `byte[] getBytes(String charsetName)` – 与上述方法相同\n* `void\
  \ getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)` – 将字符从字符串拷贝到目标数组\n\
  * `hashCode()` – 返回哈希码\n* `indexOf(int ch)` – 返回字符在字符串中第一次出现的索引\n* `indexOf(int\
  \ ch, int fromIndex)` – 与上相同，但将从指定的索引处开始搜索\n* `indexOf(String str)` – 返回子串在字符串中第一次出现的索引\n\
  * `indexOf(String str, int fromIndex)` – 与上相同，但从指定的索引处开始搜索\n* `intern()` – 返回规范表示\n\
  * `lastIndexOf(int ch)` – 返回字符在字符串中最后一次出现的索引\n* `lastIndexOf(int ch, int fromIndex)`\
  \ – 与上相同，但从指定的索引开始并向后搜索\n* `lastIndexOf(String str)` – 返回子串在字符串中最右侧的索引\n* `lastIndexOf(String\
  \ str, int fromIndex)` – 返回子串在字符串中最后一次出现的索引，但从指定的索引开始向前搜索\n* `length()` – 返回字符串的长度\n\
  * `matches(String regex)` – 字符串是否匹配指定的正则表达式\n* `regionMatches(boolean ignoreCase,\
  \ int toffset, String other, int ooffset, int len)` – 测试两个字符串区域是否相等\n* `regionMatches(int\
  \ toffset, String other, int ooffset, int len)` – 与上述方法相同\n* `replace(char oldChar,\
  \ char newChar)` – 返回一个新字符串，其结果是将所有 `oldChar` 实例替换为 `newChar`\n\n\n\n\n\n* `String\
  \ replaceAll(String regex, String replacement)` – 将字符串中匹配指定正则表达式的每个子字符串替换为指定的替换字符串\n\
  * `String replaceFirst(String regex, String replacement)` – 将索引处第一个匹配指定正则表达式的子字符串替换为指定的替换字符串\n\
  * `String[] split(String regex)` – 根据任何匹配指定正则表达式的项拆分字符串\n* `String[] split(String\
  \ regex, int limit)` – 与上述方法相同\n* `boolean startsWith(String prefix)` – 测试字符串是否以指定的前缀开头\n\
  * `boolean startsWith(String prefix, int toffset)` – 同上，但测试前缀是否从指定的索引处开始\n* `CharSequence\
  \ subSequence(int beginIndex, int endIndex)` – 返回一个作为该序列子序列的字符序列\n* `String substring(int\
  \ beginIndex)` – 返回该字符串的子字符串的新字符串\n* `String substring(int beginIndex, int endIndex)`\
  \ – 与上述方法相同\n* `char[] toCharArray()` – 将字符串转换为字符数组\n* `String toLowerCase()` –\
  \ 使用默认区域语言规则将字符串中的字符转换为小写\n* `String toLowerCase(Locale locale)` – 同上，使用指定的区域语言规则\n\
  * `String toString()` – 返回字符串本身\n* `String toUpperCase()` – 使用默认区域语言规则将此字符串中的字符转换为大写\n\
  * `String toUpperCase(Locale locale)` – 同上，但使用指定的区域语言规则\n* `String trim()` – 返回字符串的副本，省略前导和尾部空白\n\
  * `static String valueOf(primitive data type x)` – 返回传递的原始数据类型的表示\n\n## 数组\n\n数组在\
  \ Java 中也被频繁使用，它们存储了一系列相同类型的固定大小元素序列。数组存储数据集合，但数组更多地被视为相同类型变量的集合。\n\n与其使用单个变量，你不如声明一个数组变量，并在内部表示各个单个变量。\n\
  \n### 声明数组变量\n\n如果你想使用数组，首先必须声明一个变量。这是为了引用数组，并且必须指定该变量能够引用的数组类型。要声明数组变量，可以使用以下语法：\n\
  \n* `dataType[] arrayRefVar;` // 推荐方式。\n* 或者\n* `dataType arrayRefVar[];` // 可用，但不是首选方式。\n\
  \n例如：\n\n* `double[] myList;` // 推荐方式。\n* 或者\n* `double myList[];` // 可用，但不是首选方式。\n\
  \n### 创建数组\n\n使用 `new` 运算符创建数组，请使用以下语法：\n\n* `arrayRefVar = new dataType[arraySize];`\n\
  \n这条语句执行了两件事：\n\n* 它使用 `dataType[arraySize]` 创建数组\n* 将数组的引用赋值给变量 `arrayRefVar`\n\
  \n你只需要一条语句即可声明数组变量、创建一个新数组并将引用赋值给变量，如下：\n\n* `dataType[] arrayRefVar = new dataType[arraySize];`\n\
  \n或者你可以这样做：\n\n* `dataType[] arrayRefVar = {value0, value1, ..., valuek};`\n\n索引用于访问数组元素，且索引是从\
  \ 0 开始的，这意味着它们从 0 开始到 `arrayRefVar.length-1`。\n\n例如：此语句声明了一个名为 `myList` 的数组变量，创建了一个包含\
  \ 10 个元素的数组（全部为 double 类型），并将引用赋值给 `myList`：\n\n* `double[] myList = new double[10];`\n\
  \n### 处理数组\n\n当我们处理数组元素时，我们倾向于使用 `for` 循环或 `foreach` 循环，仅仅是因为所有元素都是相同类型，且我们知道数组的大小。下面的示例了如何创建一个数组、初始化它并处理它：\n\
  \n```java\npublic class TestArray {\n    public static void main(String[] args)\
  \ {\n        double[] myList = {1.9, 2.9, 3.4, 3.5};\n        // 打印所有元素\n      \
  \  for (int i = 0; i < myList.length; i++) {\n            System.out.println(myList[i]\
  \ + \" \");\n        }\n        // 求和所有元素\n        double total = 0;\n        for\
  \ (int i = 0; i < myList.length; i++) {\n            total += myList[i];\n     \
  \   }\n        System.out.println(\"Total is \" + total);\n        // 寻找最大的元素\n\
  \        double max = myList[0];\n        for (int i = 1; i < myList.length; i++)\
  \ {\n            if (myList[i] > max) max = myList[i];\n        }\n        System.out.println(\"\
  Max is \" + max);\n    }\n}\n```\n\n执行此代码将得到以下结果：\n1.9\n2.9\n3.4\n3.5\nTotal is\
  \ 11.7\nMax is 3.5\n\n### foreach 循环\n\n`foreach` 循环是在 JDK 1.5 中引入的。这允许你在无需索引变量的情况下遍历整个数组。例如：这段代码显示了\
  \ `myList` 数组中的所有元素：\n\n```java\npublic class TestArray {\n    public static void\
  \ main(String[] args) {\n        double[] myList = {1.9, 2.9, 3.4, 3.5};\n     \
  \   // 打印所有数组元素\n        for (double element : myList) {\n            System.out.println(element);\n\
  \        }\n    }\n}\n```\n*(注：此处原文代码中语法略有误，漏掉了冒号，翻译时保持原意)*\n\n### 将数组传递给方法\n\n\
  与传递原始类型值给方法一样，我们可以将数组传递给方法。下面的示例展示了 `int` 数组中的：\n\n```java\npublic static void printArray(int[]\
  \ array) {\n    for (int i = 0; i < array.length; i++) {\n        System.out.print(array[i]\
  \ + \" \");\n    }\n}\n```\n\n调用它时我们需要传递一个数组，例如下面的语句：\n\n`printArray(new int[]{3,\
  \ 1, 2, 6, 4});`\n\n此操作的结果为：31264\n\n### 方法返回数组\n\n方法也可以返回数组，在所示示例中，该方法返回另一个数组的反转：\n\
  \n```java\npublic static int[] reverse(int[] list) {\n    int[] result = new int[list.length];\n\
  \    for (int i = 0, j = result.length - 1; i < list.length; i++, j--) {\n     \
  \   result[j] = list[i];\n    }\n    return result;\n}\n```\n\n### Arrays 类\n\n\
  `java.util.Arrays` 类包含几个静态方法，允许你搜索和排序数组、比较它们并填充元素。以下是方法列表：\n\n* 使用二分算法在指定的对象数组中搜索指定的值。在调用此方法之前，数组必须排序。如果搜索键在列表中，将返回其索引，否则返回\
  \ `-(插入点 +1)`\n* 如果两个指定的数组相等，则返回 `true`。如果两个数组具有相同的元素数量且数组中对应的元素对相等，则两个数组相等。此方法适用于所有数据类型。\n\
  * 将指定的 `int` 值赋值给指定的 `int` 数组。\n* 将指定的数组按元素升序排序。\n\n## 日期和时间\n\n`java.util` 包包含\
  \ `Date` 类，该类封装了日期和时间。该类支持两个构造函数：\n\n* `Date()` – 初始化对象的日期和时间\n* `Date(long millisec)`\
  \ – 接受一个参数，其值等于自 1970 年 1 月 1 日午夜以来过的毫秒数。\n\n下方列出了 `Date` 类支持的方法：\n\n\n\n\n\n* `boolean\
  \ after(Date date)` – 如果调用的 `Date` 对象日期晚于指定的日期，则返回 `true`。否则，返回 `False`。\n\n* `boolean\
  \ before(Date date)` – 与上述方法相同。\n\n* `Object clone() ` – 复制用的 `Date` 对象。\n\n* `int\
  \ compareTo(Date date)` – 比较调用对象的值与 `Date` 的值。如果值相等，则返回 `0.`。如果调用的对象在 `Date` 对象之前，则返回\
  \ `False`；如果晚于后者，则返回 `True`。\n\n* `int compareTo(Object obj)` – 与上述方法完全相同，前提是 `obj`\
  \ 是 `Date` 类。如果不是，将抛出 `ClassCastException`。\n\n* `boolean equals(Object date)` –\
  \ 如果调用的 `Date` 对象与指定的日期和时间相同，则返回 `true`，否则返回 `false`。\n\n* `long getTime() ` – 返回自\
  \ 1970 年 1 月 1 日以来经过的毫秒数。\n\n* `int hashCode() ` – 返回调用对象的哈希值。\n\n* `void setTime(long\
  \ time)` – 将日期和时间设置为指定的 `time`，表示自 1970 年 1 月 1 日午夜以来的毫秒数。\n\n* `String toString()\
  \ ` – 将调用的对象转换为字符串并返回结果。\n\n### 获取当前日期和时间\n\n这非常简单；你只需要一个简单的日期对象，配合 `toString()`\
  \ 方法，如示例所示：\n\n```java\nimport java.util.Date;\n\npublic class DateDemo {\n    public\
  \ static void main(String args[]) {\n        // 实例化 Date 对象\n        Date date =\
  \ new Date();\n        // 使用 toString() 显示时间和日期\n        System.out.println(date.toString());\n\
  \    }\n}\n```\n\n这将得到如下结果：\n\n* on May 04 09:51:52 CDT 2009\n\n### 日期比较\n\n在 Java\
  \ 中有三种方法比较日期：\n\n* 使用 `getTime()` 获取自 1970 年 1 月 1 日午夜以来经过的毫秒数。对两个对象执行此操作然后比较值。\n\
  \n* 使用 `before()`、`after()` 和 `equals()` 方法。例如，因为某月的 12 号在 18 号之前，`newDate(99, 2,\
  \ 12).before(newDate (99, 2, 18))` 将返回 `true`。\n\n* 使用 `compareTo()` 方法。\n\n###\
  \ 使用 SimpleDateFormat 进行日期格式化\n\n`SimpleDateFormat` 是用于格式化和解析日期的具体类。它允许你选择任何用户定义的模式进行日期和时间格式化，如下：\n\
  \n```java\nimport java.util.*;\nimport java.text.*;\n\npublic class DateDemo {\n\
  \    public static void main(String args[]) {\n        Date dNow = new Date( );\n\
  \        SimpleDateFormat ft = new SimpleDateFormat (\"E yyyy.MM.dd 'at' hh:mm:ss\
  \ a zzz\");\n        System.out.println(\"Current Date: \" + ft.format(dNow));\n\
  \    }\n}\n```\n\n执行此代码将得到如下结果：\n\n* Current Date: Sun 2004.07.18 at 04:14:09 PM\
  \ PDT\n\n### SimpleDateFormat 格式化代码\n\n为了指定时间格式，你需要使用时间模式字符串。所有 ASCII 字母在此字符串中保留作为模式字母，其定义如下：\n\
  \n| 字符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| G | 纪元标识 | AD |\n| Y | 4 位年份 | 2000\
  \ |\n| M | 年中的月份 | May or 05 |\n| d | 月中的几几 | 11 |\n| h | 上午或下午的小时 (1-12) | 12 |\n\
  | H | 一天中的小时 (0-23) | 21 |\n| m | 小时内的分钟 | 30 |\n| s | 分钟内的秒 | 53 |\n| S | 毫秒 |\
  \ 258 |\n| E | 星期几 | Wednesday |\n| D | 年中的第几天 | 342 |\n| F | 月中的第几几 | 2 (五月的第二个星期四)\
  \ |\n| w | 年中的第几周 | 25 |\n| W | 月中的第几周 | 2 |\n| a | 上午或下午标记 | AM |\n| k | 一天中的小时\
  \ (1-24) | 22 |\n| K | 上午或下午的小时 (0-11) | 9 |\n| z | 时区 | GMT |\n| ‘ | 文本转义 | 分隔符\
  \ |\n| “ | 单引号 | ‘ |\n\n### 使用 printf 进行日期格式化\n\n使用 `printf` 方法格式化日期时间非常简单。你只需要使用以\
  \ `t` 开头并以上述字母之一结尾的格式化符。例如：\n\n```java\nimport java.util.Date;\n\npublic class DateDemo\
  \ {\n    public static void main(String args[]) {\n        // 实例化 Date 对象\n    \
  \    Date date = new Date();\n        // 使用 toString() 显示时间和日期\n        String str\
  \ = String.format(\"Current Date/Time : %tc\", date );\n        System.out.printf(str);\n\
  \    }\n}\n```\n\n执行此代码将得到如下结果：\n\n执行此代码将得到如下结果：\n\nCurrent Date/Time : Sat Dec\
  \ 15 16:37:57 MST\n\n\n\n\n\n\n`GregorianCalendar` 是一个实现了熟悉的格里哥利历的类的具体实现。使用 `Calendar`\
  \ 类中的 `getInstance()` 方法将返回一个 `GregorianCalendar` 对象，并使用特定时区和默认语言环境中的日期时间进行初始化。`GregorianCalendar`\
  \ 中定义了两个字段：`AD` 和 `BC`。它们代表了 `GregorianCalendar` 定义的时代。`GregorianCalendar` 对象支持许多构造函数：\n\
  \n* `GregorianCalendar()` – 构造一个使用当前时间和默认时区内默认语言环境的格里哥利历\n* `GregorianCalendar(int\
  \ year, int month, int date)` – 使用指定的日期以及默认语言环境和时区\n* `GregorianCalendar(int year,\
  \ int month, int date, int hour, int minute)` – 操作与上述相同\n* `GregorianCalendar(int\
  \ year, int month, int date, int hour, int minute, int second)` – 操作与上述相同\n* `GregorianCalendar(Locale\
  \ aLocale)` – 在默认时区内使用指定的语言环境当前时间\n* `GregorianCalendar(TimeZone zone)` – 在指定时区和默认语言环境使用当前时间\n\
  * `GregorianCalendar(TimeZone zone, Locale aLocale)` – 在指定时区和指定的语言环境使用当前时间\n\n以下是\
  \ `GregorianCalendar` 类提供的一些实用的支持方法列表：\n\n* `void add(int field, int amount)` –\
  \ 使用日历的规则向指定字段添加指定的时间\n* `protected void computeFields()` – 将 UTC 从毫秒数转换为时间字段值\n\
  * `protected void computeTime()` – 覆盖 `Calendar` 方法，将 UTC 从时间字段值转换为毫秒数\n* `boolean\
  \ equals(Object obj)` – 在 `GregorianCalendar` 和指定的对象引用之间进行比较\n* `int get(int field)`\
  \ – 获取指定时间字段的值\n* `int getActualMaximum(int field)` – 返回在指定日期下该字段可能的最大值\n* `int\
  \ getActualMinimum(int field)` – 返回当前日期下该字段可能的最小值\n* `int getGreatestMinimum(int\
  \ field)` – 如果指定字段存在变化，则返回该字段的最大最小值\n* `Date getGregorianChange()` – 获取更改 `GregorianCalendar`\
  \ 日期的日期\n* `int getLeastMaximum(int field)` – 如果指定字段存在变化，则返回该字段的最小极大\n* `int getMaximum(int\
  \ field)` – 返回指定字段可能的最大值\n* `Date getTime()` – 获取日历的当前时间\n* `long getTimeInMillis()`\
  \ – 以 long 形式返回日历的当前时间\n* `TimeZone getTimeZone()` – 返回时区\n* `int getMinimum(int\
  \ field)` – 返回指定字段的最小值\n* `int hashCode()` – 覆盖哈希码\n* `boolean isLeapYear(int year)`\
  \ – 确定指定的年份是否为闰年\n* `void roll(int field, boolean up)` – 在指定字段上增加或减少单个时间单位，而不改变更高级字段\n\
  * `void set(int field, int value)` – 使用指定的值设置时间字段\n* `void set(int year, int month,\
  \ int date)` – 设置年、月、日字段的值\n* `void set(int year, int month, int date, int hour,\
  \ int minute)` – 设置年、月、日、小时和分钟字段的值\n* `void set(int year, int month, int date, int\
  \ hour, int minute, int second)` – 设置年、月、日、小时、分钟和秒字段的值\n* `void setGregorianChange(Date\
  \ date)` – 设置 `GregorianCalendar` 更改日期的\n* `void setTime(Date date)` – 使用指定的日期设置\
  \ `Calendar` 的当前时间\n* `void setTimeInMillis(long millis)` – 使用指定的 long 值设置 `Calendar`\
  \ 的当前时间\n* `void setTimeZone(TimeZone value)` – 使用指定的时区值设置时区\n* `String toString()`\
  \ – 返回 `Calendar` 的字符串表示\n\n以下是 `GregorianCalendar` 类提供的几个实用支持方法：\n\n### 示例\n\n\
  ```java\nimport java.util.*;\n\npublic class GregorianCalendarDemo {\n    public\
  \ static void main(String args[]) {\n        String months[] = {\n            \"\
  Jan\", \"Feb\", \"Mar\", \"Apr\",\n            \"May\", \"Jun\", \"Jul\", \"Aug\"\
  ,\n            \"Sep\", \"Oct\", \"Nov\", \"Dec\"};\n        int year;\n       \
  \ // 创建一个格里哥利历，\n        // 使用默认语言环境和时区的\n        // 当前日期和时间进行初始化。\n        GregorianCalendar\
  \ gcalendar = new GregorianCalendar();\n        // 显示当前时间和日期信息。\n        System.out.print(\"\
  Date: \");\n        System.out.print(months[gcalendar.get(Calendar.MONTH)]);\n \
  \       System.out.print(\" \" + gcalendar.get(Calendar.DATE) + \" \");\n      \
  \  System.out.println(year = gcalendar.get(Calendar.YEAR));\n        System.out.print(\"\
  Time: \");\n        System.out.print(gcalendar.get(Calendar.HOUR) + \":\");\n  \
  \      System.out.print(gcalendar.get(Calendar.MINUTE) + \":\");\n        System.out.println(gcalendar.get(Calendar.SECOND));\n\
  \        // 测试当前年份是否为闰年\n        if(gcalendar.isLeapYear(year)) {\n            System.out.println(\"\
  The current year is a leap year\");\n        } else {\n            System.out.println(\"\
  The current year is not a leap year\");\n        }\n    }\n}\n```\n\n如果你运行这个程序，它将产生结果：\n\
  \n* Date: Apr 22 2009\n* Time: 11:25:27\n* The current year is not a leap year\n\
