  \n与之前的教程一样，我在此使用了 `v7`，因此请确保在输入的任何命令中使用正确的版本号。\n\nJRE 存档二进制文件可以下载到任何你可以写入的位置，它不会取代\
  \ Oracle Solaris OS 提供的版本。\n\n如果你在允许使用 32 位 JVM 的 64 位系统上安装，该过程有两个步骤。首先，你必须安装 32\
  \ 位版本，然后是支持 64 位操作。文件名如下：\n\n在 SPARC 处理器上：\n\n*   `jre-7u7-solaris-sparc.tar.gz`\
  \ (32 位)\n*   `jre-7u7-solaris-sparcv9.tar.gz` (64 位)\n\n在 x64/EM64T 处理器上：\n\n*\
  \   `jre-7u7-solaris-i586.tar.gz` (32 位)\n*   `jre-7u7-solaris-x64.tar.gz` (64 位)\n\
  \n如果你使用的是 32 位 Solaris，你只需要下载 32 位版本。\n\n*   打开 `http://java.com`\n*   点击“Free Java\
