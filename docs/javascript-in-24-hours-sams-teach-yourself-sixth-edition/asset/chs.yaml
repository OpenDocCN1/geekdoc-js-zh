  \ `href` 和链接文本。）\n\n## 十节 认识 JSON\n\n* * 本小时将学习：\n\n![Image](img/image00365.jpeg)\
  \ 什么是 JSON\n\n![Image](img/image00365.jpeg) 如何模拟关联数组\n\n![Image](img/image00365.jpeg)\
  \ 关于 JSON 和对象\n\n![Image](img/image00365.jpeg) 访问 JSON 数据\n\n![Image](img/image00365.jpeg)\
  \ 使用 JSON 进行数据序列化\n\n![Image](img/image00365.jpeg) 如何确保 JSON 安全\n\n* * *\n\n在书的早期，你学习了如何使用\
  \ `new Object()` 语法直接实例化对象。在本小时中，你将学习 JavaScript 对象表示法（JSON），正如其名称所示的那样，它提供了另一种创建实例的方法，并可以作为一种通用的数据交换语法。\n\
  \n* * *\n\n注意\n\nJSON 的官方网站是 [`json.org/`](http://json.org/)，那里还有指向网上各种 JSON 资源的链接。\n\
  \n* *\n\n### 什么是 JSON？\n\nJSON（读作“Jason”）是 JavaScript 对象的一种简单且紧凑的表示法。一旦以 JSON 格式表示，对象就可以很容易转换为字符串以便存储和传输（例如在网络上或应用程序之间）。\n\
  \n然而，JSON 真正的魅力在于，以 JSON 格式表示的对象实际上是用普通的 JavaScript 代码表示的。因此，你利用了 JavaScript 的“自动”解析；你只需要让\
  \ JavaScript 解析 JSON 字符串的内容即可，而不需要额外的解析器或转换器。\n\n\n\n\nJSON 数据表示为一系列参数和值对，每对都使用冒号字符来分隔参数和值。这些\
  \ `\"parameter\":\"value\"` 键对之间用逗号分隔：\n\n点击此处查看代码图像\n\n`\"param1\":\"value1\",\
  \ \"param2\":\"value2\", \"param3\":\"value3\"`\n\n最后，整个序列被包裹在大括号之间，形成一个表示你数据的 JSON\
  \ 对象：\n\n```javascript\nvar jsonObject = {\n    \"param1\":\"value1\",\n    \"param2\"\
  :\"value2\",\n    \"param3\":\"value3\"\n}\n```\n\n这里定义的对象 `jsonObject` 使用了标准 JavaScript\
  \ 表示法的子集——它是一小段有效的 JavaScript 代码。\n\n使用 JSON 符号编写的对象可以使用通常的点表示法直接访问其属性和方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nalert(jsonObject.param1); // 弹出 'value1'\n```\n\n但更通用地说，JSON 是一种用于以字符串格式交换数据的通用语法。不仅是对象，任何可以表示为一系列\
  \ `parameter:value` 对的数据都可以用 JSON 符号表示。随后，通过被称为“序列化”（serialization）的过程，很容易地将 JSON\
  \ 对象转换为字符串；序列化数据便于在网络中进行存储或传输。你将在本小时的稍后部分看到将如何序列化 JSON 对象。\n\n***\n\n### 注意\n作为一种通用数据交换语法，JSON\
  \ 的用法方式有点像 XML，尽管 JSON 对人类来说更易读。此外，解析大型 XML 文件可能是一个缓慢的过程，而 JSON 则为你的脚本提供了一个准备就用的\
  \ JavaScript 对象。\n\n***\n\nJSON 最近备受关注，因为它提供了几个重要的优势。JSON 具有\n\n![Image](img/image00365.jpeg)\
  \ 人人和计算机都易于阅读\n\n![Image](img/image00365.jpeg) 概念简单——一个 JSON 对象无非包裹在大括号内的一系列 `parameter:value`\
  \ 对\n\n![Image](img/image00365.jpeg) 很大程度上自文档化\n\n![Image](img/image00365.jpeg)\
  \ 创建和解析速度快\n\n![Image](img/image00365.jpeg) JavaScript 的子集，这意味着不需要特殊的解释器或其他额外的包\n\
  \n许多领先的在线服务和 API（包括 Flickr、Twitter 以及来自 Google 和 Yahoo! 的服务）现在都提供 JSON 符号编码的数据。\n\
  \n***\n\n### 注意\n有关 Flickr 如何支持 JSON 的详情，请参见 [`www.flickr.com/services/api/response.json.html`](http://www.flickr.com/services/api/response.json.html)。\n\
  \n***\n\n###  JSON 数据\n\n要恢复编码在 JSON 字符串中的数据，你需要某种方式将字符串转换回 JavaScript 代码。这通常被称为*反序列化*（deserializing）字符串。\n\
  \n#### 使用 eval()\n只有较新的浏览器才对 JSON 语法有原生支持（我们稍后会讨论使用原生浏览器支持）。然而，由于 JSON 语法是 JavaScript\
  \ 的子集，可以使用 JavaScript 函数 `eval()` 将 JSON 字符串转换为 JavaScript 对象。\n\n***\n\n### 注意\n\
  JavaScript 的 `eval()` 函数评估或执行作为参数的任何内容。如果参数是一个表达式，`eval()` 会评估该表达式；例如：\n\n```javascript\n\
  var x = eval(4 * 3); // x=12\n```\n\n如果参数包含一个或多个 JavaScript 语句，`eval()` 会执行这些语句：\n\
  \n点击此处查看代码图像\n\n```javascript\neval(\"a=1; b=2; document.write(a+b);\"); // 在页面上写入\
  \ 3\n```\n\n***\n\n`eval()` 函数使用 JavaScript 解释器解析 JSON 文本并生成 JavaScript 对象：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar myObject = eval ('(' + jsonObjectString + ')');\n\
  ```\n\n然后你可以在你的脚本中使用该 JavaScript 对象：\n\n点击此处查看代码图像\n\n```javascript\nvar user =\
  \ '{\"username\" : \"philb1234\",\"location\" : \"Spain\",\"height\" : 1.80}';\n\
  var myObject = eval ('(' + user + ')');\nalert(myObject.username);\n```\n\n***\n\
  \n## 注意事项\n字符串必须这样包裹在括号中，以避免陷入 JavaScript 语法中的歧义。\n\n***\n\n#### 使用原生浏览器支持\n所有最近的浏览器都对\
  \ JSON 提供原生支持，使得使用 `eval()` 变得必要。\n\n***\n\n### 注意\n原生支持 JSON 的浏览器包括\n\n![Image](img/image00365.jpeg)\
  \ Firefox (Mozilla) 3.5+\n\n![Image](img/image00365.jpeg) Internet Explorer 8+\n\
  \n![Image](img/image00365.jpeg) Google Chrome\n\n![Image](img/image00365.jpeg) Opera\
  \ 10+\n\n![Image](img/image00365.jpeg) Safari 4+\n\n***\n\n具有原生 JSON 支持的浏览器创建一个名为\
  \ `JSON` 的 JavaScript 对象来管理 JSON 编码解码。`JSON` 对象有两个方法：`stringify()` 和 `parse()`。\n\
  \n#### JSON.parse()\n你可以使用 `JSON.parse()` 解析 JSON，它接收一个 JSON 序列化字符串并将其拆分，创建一个属性与字符串中找到的值相对应的对象。\n\
  \n#### JSON.stringify()\n你可以使用 `JSON.stringify()` 方法创建对象的 JSON 字符串。\n\n\n\n\n\n\
  点击此处查看代码图像\n\n`myObject = JSON.parse(inString);`\n\n现在你可以通过遍历对象的方法来构建你的输出消息字符串：\n\
  \n点击此处查看代码图像\n\n```javascript\nfor (i in myObject) {\n    out += \"Property: \"\
  \ + i + \" = \" + myObject[i] + '\\n';\n}\n```\n\n最后，显示结果：\n\n```javascript\nalert(out);\n\
  ```\n\n输出消息应该像图 10.4 中所示。\n\n![Image](img/image00418.jpeg)\n\n**图 10.4** 通过解析 JSON\
  \ 字符串创建的对象\n\n刷新页面并尝试使用不同数量的 `\"parameter\":\"value\"` 键重新运行脚本。\n\n* *\n\n### JSON\
  \ 数据类型\n\n每个 `parameter:value` 对的参数部分必须遵循几条简单的语法规则：\n\n![Image](img/image00365.jpeg)\
  \ 它不能是 JavaScript 的保留关键字。\n\n![Image](img/image00365.jpeg) 它不能以数字开头。\n\n![Image](img/image00365.jpeg)\
  \ 它不能包含下划线或美元符号以外的特殊字符。\n\nJSON 对象中的值可以包含以下任何数据类型：\n\n![Image](img/image00365.jpeg)\
  \ 数字 (Number)\n\n![Image](img/image00365.jpeg) 字符串 (String)\n\n![Image](img/image00365.jpeg)\
  \ 布尔 (Boolean)\n\n![Image](img/image00365.jpeg) 数组 (Array)\n\n![Image](img/image00365.jpeg)\
  \ 对象 (Object)\n\n![Image](img/image00365.jpeg) null (空)\n\n* *\n\n### 注意\n\nJavaScript\
  \ 语法具有几种未包含在 JSON 标准中的类型，包括 `Date`、`Error`、`Math` 和 `Function`。这些数据类型必须表示为其他数据格式，且编码和解码程序需遵循相同的编码和解码规则。\n\
  \n* *\n\n### 模拟关联数组\n\n在第 6 小节“数组”中，我们讨论了 JavaScript 数组对象并查看它的各种属性和方法。\n\n你可能记得\
  \ JavaScript 数组中的元素具有唯一的数字标识：\n\n```javascript\nvar myArray = [];\nmyArray[0] =\
  \ 'Monday';\nmyArray[1] = 'Tuesday';\nmyArray[2] = 'Wednesday';\n```\n\n在许多其他编程语言中，可以使用文本键来增强数组的可描述性：\n\
  \n点击此处查看代码图像\n\n```javascript\nmyArray[\"startDay\"] = \"Monday\";\n```\n\n遗憾的是，JavaScript\
  \ 不直接支持这种所谓的关联数组。\n\n然而，使用对象很容易地模拟它们的行为。使用 JSON 记法使代码易于阅读和理解：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar conference = { \"startDay\" : \"Monday\",\n    \"nextDay\"  :\
  \ \"Tuesday\",\n    \"endDay\"  : \"Wednesday\"\n}\n```\n\n你现在可以像访问关联数组一样访问对象属性：\n\
  \n点击此处查看代码图像\n\n```javascript\nalert(conference[\"startDay\"]);  // 输出 \"Monday\"\
  \n```\n\n* *\n\n### 提示\n\n这之所以有效，是因为在 JavaScript 中，两种语法\n\n`object[\"property\"\
  ]`\n\n和\n\n`object.property`\n\n是等效的。\n\n* *\n\n* *\n\n### 注意\n\n记住，这并不是真正的关联数组，尽管它看起来像。如果你遍历该对象，除了这三个属性外，你还会获得任何分配给对象的方法。\n\
  \n* *\n\n### 使用 JSON 创建对象\n\n你可能还从第 6 小节记得，表示数组的一种方便方法是使用方括号：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar categories = [\"news\", \"sport\", \"films\", \"music\", \"comedy\"\
  ];\n```\n\nJSON 为我们提供了一种相似的定义 JavaScript 对象的简写。\n\n* *\n\n### 提示\n\n尽管 JSON 是为了描述\
  \ JavaScript 对象而开发的，但它是独立于任何语言或平台的。许多编程语言（包括 Java、PHP、C 等）都有 JSON 库和工具。\n\n* *\n\
  \n#### 属性\n\n正如你所看到的，要在 JSON 记法中表示对象，使用大括号而不是方括号包裹对象，并将对象属性列为 `\"property\":\"value\"\
  ` 对：\n\n```javascript\nvar user = {\n    \"username\" : \"philb1234\",\n    \"location\"\
  \ : \"Spain\",\n    \"height\" : 1.80\n}\n```\n\n* *\n\n### 提示\n\n你可能记得使用语句\n\n\
  `var myObject = new Object();`\n\n会创建一个没有任何属性或方法的“空”对象实例。JSON 记法中的等效写法不出意外是：\n\n\
  ```javascript\nvar myObject = {};\n```\n\n* *\n\n对象属性可以像通常一样立即可用：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar name = user.username;\n```\n\n#### 方法\n\n你可以通过在对象内部使用函数这种这样添加方法：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar user = {\n    \"username\" : \"philb1234\",\n\
  \    \"location\" : \"Spain\",\n    \"height\" : 1.80,\n    \"setName\":function(newName){\n\
  \        this.username = newName;\n    }\n}\n```\n\n然后你可以像通常一样调用 `setName` 方法：\n\
  \n```javascript\nuser.setName(prompt(\"Enter a username:\"));\n```\n\n虽然这种添加方法的方法在\
  \ JavaScript 上文中是行的，但在将 JSON 作为通用数据格式使用时是不允许的。请参见关于 JSON 安全的后续章节。\n\n* *\n\n####\
  \ 数组\n\n属性值本身可以是 JavaScript：\n\n点击此处查看代码图像\n\n```javascript\nvar listObject = {\n\
  \    \"booklist\": [\"Foundation\", \"Dune\", \"Eon\", \"2001 A Space Odyssey\"\
  , \"Stranger In A Land\"]\n};\n```\n\n在前面的示例中，对象有一个属性 `booklist`，其值是一个数组。你可以通过传递数组键来访问数组中的单独项（记住数组从零开始）：\n\
  \n```javascript\nvar book = listObject.booklist[2]; // 值 \"Eon\"\n```\n\n上一行代码将\
  \ `booklist` 数组中的第二个项赋值给变量 `book`。\n\n### 对象\n\nJSON 对象甚至可以包含其他对象。通过让数组元素本身成为 JSON\
  \ 对象，你可以使用点符号来访问它们。\n\n在下面的示例中，与属性 `booklist` 相关的值是一个对象数组。每个 JSON 对象都有两个 `\"parameter\"\
  :\"value\"` 对，分别持有相关书籍的标题和作者。\n\n像上一个示例所示获取书籍数组后，很容易访问 `title` 和 `author` 属性：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar bookListObject = {\n    \"booklist\": [{\"title\"\
  :\"Foundation\", \"author\":\"Isaac Asimov\"},\n    {\"title\":\"Dune\", \"author\"\
  :\"Frank Herbert\"},\n    {\"title\":\"Eon\", \"author\":\"Greg Bear\"},\n    {\"\
  title\":\"2001 A Space Odyssey\", \"author\":\"Arthur C. Clarke\"},\n    {\"title\"\
  :\"Stranger In A Land\", \"author\":\"Robert A. Heinlein\"}]\n};\n\n// 显示第三本书的作者\n\
  alert(bookListObject.booklist[2].author); // 显示 \"Greg Bear\"\n```\n\n`bookListObject`\
  \ 有一个属性 `booklist`，它是一个名为 `bookListObject` 的对象的数组。\n\n* *\n\n### 动手尝试：操作 JSON 对象\n\
  \n让我们采用之前的 JSON 对象 `bookListObject` 并构建一个用户消息，以易于阅读的格式列出书籍和作者。创建一个 HTML 文件并输入列表\
  \ 10.2 中的代码。你的 JSON 对象与之前的示例完全相同，但这次你将访问书籍数组，并使用循环对其进行遍历，在过程中通过追加书籍和作者来构建消息字符串。最后你向用户显示书籍信息。\n\
  \n\n\n\n\n# 列表 10.2 处理多级 JSON 对象\n\n点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Understanding JSON</title>\n    <script>\nvar booklistObject\
  \ = {\n        \"booklist\": [{\"title\":\"Foundation\", \"author\":\"Isaac Asimov\"\
  },\n              {\"title\":\"Dune\", \"author\":\"Frank Herbert\"},\n        \
  \      {\"title\":\"Eon\", \"author\":\"Greg Bear\"},\n              {\"title\"\
  :\"2001 A Space Odyssey\", \"author\":\"Arthur C. Clarke\"},\n              {\"\
  title\":\"Stranger In A Strange Land\", \"author\":\"Robert A. Heinlein\"}]\n  \
  \  }\n    // 一个用于存储我们用户消息的变量\n    var out = \"\";\n    // 获取数组\n    var books =\
  \ booklistObject.booklist;\n    // 遍历数组，逐个获取书籍\n    for(var i =0; i<books.length;i++)\
  \ {\n        var booknumber = i+1;\n        out += \"Book \"  + booknumber +\n \
  \             \" is: '\" + books[i].title +\n              \"' by \" + books[i].author\
  \ +\n              \"\\n\";\n    }\n    </script>\n</head>\n<body onload=\"alert(out)\"\
  >\n\n</body>\n</html>\n```\n\n* * *\n\n在设计好 JSON 对象后，你声明了一个变量并赋值一个空字符串。这个变量将在构建输出消息时存储该消息：\n\
  \n`var out = \"\";`\n\n现在你提取书籍数组，并将此数组赋值给新变量 `books`，以避免以后进行冗长的输入：\n\n点击此处查看代码图像\n\
  \n`var books = booklistString.booklist;`\n\n之后，你只需要遍历书籍数组，读取每个书籍对象的 `title` 和 `author`\
  \ 属性，并构造一个字符串追加到你的输出消息中即可：\n\n点击此处查看代码图像\n\n```javascript\nfor(var i =0; i<books.length;i++)\
  \ {\n    var booknumber = i+1; // 数组索引从零开始！\n    out += \"Book \"  + booknumber\
  \ +\n          \" is: '\" + books[i].title +\n          \"' by \" + books[i].author\
  \ +\n          \"\\n\";\n}\n```\n\n最后，将你的消息显示给用户：\n\n`alert(out);`\n\n运行此脚本的结果所示图\
  \ 10.5。\n\n![Image](img/image00419.jpeg)\n\n**图 10.5** 书籍信息已显示给用户\n\n* * *\n\n###\
  \ JSON 安全\n\n使用 JavaScript 的 `eval()` 函数可以执行任何 JavaScript 命令。这可能代表一个潜在的安全问题，特别是当处理来自不受信源的\
  \ JSON 数据时。\n\n使用带有原生 JSON 解析器的浏览器将 JSON 字符串转换为 JavaScript 对象会更安全。JSON 解析器只会识别 JSON\
  \ 文本，而不会执行脚本命令。原生 JSON 解析器通常比使用 `eval()` 更快。\n\n原生 JSON 支持在较新的浏览器以及最新的 ECMAScript\
  \ (JavaScript) 标准中实现。\n\n### 总结\n\n在这一小时中，你学习了 JSON 记法，这是一种简单的数据交换语法，也可以用于创建 JavaScript\
  \ 对象的实例。\n\n你学习了如何使用现代浏览器的原生 JSON 支持将对象序列化为 JSON 字符串，并将 JSON 字符串解析为 JavaScript 对象。\n\
  \n## 问答\n\n**Q. 我可以在哪里阅读官方的 JSON 文档？**\n\n**A.** JSON 语法在 RFC 4627 中有正式描述。你可以在 [`www.ietf.org/rfc/rfc4627`](http://www.ietf.org/rfc/rfc4627)\
  \ 阅读它。在 JSON 的官方网站 [`json.org/`](http://json.org/) 也有很多信息。\n\n**Q. 我如何知道我的浏览器是否原生支持\
  \ JSON？**\n\n**A.** 你可以像第 8 节“面向对象编程](#part0019.xhtml_ch08)”中描述的那样，使用 `typeof` 运算符检查\
  \ JSON 对象是否存在。\n\n点击此处查看代码图像\n\n```javascript\nif(typeof JSON == 'object') {\n \
  \   // 你拥有 JSON 对象\n} else {\n    // 你没有\n}\n```\n\n\n\n\nWeb 视频非常流行。然而，实现视频的方法通常是专有的，通过\
  \ Flash、Windows Media 和 Apple QuickTime 等插件进行播放。在某个浏览器中用于嵌入这些元素的标记，在其他浏览器中并不总是有效。\n\
  \nHTML5 包含一个新的 `<video>` 元素，其目标是能够嵌入任何及所有的视频格式。\n\n使用新的 `<video>` 标签，你可以这样实现你喜爱的\
  \ QuickTime 电影：\n\n```html\n<video src=\"video.mov\" />\n```\n\n到为止，关于视频元素应该支持哪些视频格式（解码器）一直存在着许多争议；在编写此本书时，人们仍在寻找一种不需要特殊许可条款的解码器，尽管\
  \ WebM ([`www.webmproject.org/`](http://www.webmproject.org/)) 目前看起来是首选。目前，通过引用多个源可以解决这个问题，并避免对浏览器嗅探的需求；目前有三种广泛支持的视频格式：MP4、WebM\
  \ 和 Ogg。\n\n点击此处查看代码图像\n\n```html\n<video id=\"vid1\" width=\"400\" height=\"300\"\
  \ controls=\"controls\">\n    <source src=\"movie.mp4\" type=\"video/mp4\" />\n\
  \    <source src=\"movie.ogg\" type=\"video/ogg\" />\n    <source src=\"movie.webm\"\
  \ type=\"video/webm\" />\n    <p>不支持 video 标签。</p>\n</video>\n```\n\n为 `<video>`\
  \ 元素包含 `width` 和 `height` 属性也是一种良好的做法。如果未设置高度和宽度，浏览器将不知道预留多大的屏幕空间，导致页面布局在视频加载时发生变化。\n\
  \n还建议您在 `<video>` 和 `</video>` 标签之间放置一些合适的文本，以便在不支持 `<video>` 标签的浏览器中显示。\n\n`<video>`\
  \ 标签的一些重要属性列在表 11.2 中。\n\n![Image](img/image0042.jpeg)\n\n**表 11.2 <video> 元素的一些属性**\n\
  \n注意，使用 `controls` 属性添加的控件的外将取决于所使用的浏览器，如图 11.1 所示。\n\n![Image](img/image0042.jpeg)\n\
  \n**图 11.1** 控件的外观在浏览器之间不同\n\n你可以像访问任何其他 JavaScript 或 DOM 对象一样访问这些属性。对于之前的视频定义，你可以使用：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myVideo = document.getElementById(\"vid1\").volume\
  \ += 0.1;\n```\n\n来略微增加音量，或者\n\n点击此处查看代码图像\n\n```javascript\nif(document.getElementById(\"\
  vid1\").paused) {\n    alert(message);\n}\n```\n\n向用户传递一条消息，指示视频播放当前已暂停。\n\n###\
  \ 使用 canPlayType() 测试格式支持\n\n你可以使用 JavaScript 方法检查对特定解码器的支持：\n\n```javascript\n\
  media.canPlayType(type)\n```\n\n在在前的示例中，`type` 是一个包含媒体类型的字符串，例如“video/webm”。如果浏览器知道它无法播放该内容，此方法必须返回一个空字符串。如果浏览器确定它可以支持该格式，该方法可能会返回“probably”，否则返回“maybe”。\n\
  \n### 控制播放\n\n也可以使用 `pause()` 和 `play()` 命令通过编程方式控制播放，如下代码段所示：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar myVideo = document.getElementById(\"vid1\").play();\nvar myVideo\
  \ = document.getElementById(\"vid1\").pause();\n```\n\n### 使用 <audio> 标签播放声音\n\n\
  之前关于 `<video>` 标签的所有内容几乎同样适用于 `<audio>` 标签。使用 `<audio>` 标签的简单方法如下：\n\n点击此处查看代码图像\n\
  \n```html\n<audio src=\"song.mp3\"></audio>\n```\n\n你可以添加更多属性以实现对播放的更多控制，例如 `loop`\
  \ 和 `autoplay`：\n\n点击此处查看代码图像\n\n```html\n<audio src=\"song.mp3\" autoplay loop></audio>\n\
  ```\n\n> **提示**\n> 不要滥用 `loop` 和 `autoplay`，否则你可能会发现你的许多网站访问者不再回来了！\n\n与早期的视频文件示例一样，你可以包含替代格式以帮助用户的浏览器能够找到一种它可以播放的格式，如下代码所示：\n\
  \n点击此处查看代码图像\n\n```html\n<audio controls=\"controls\">\n    <source src=\"song.ogg\"\
  \ type=\"audio/ogg\" />\n    <source src=\"song.mp3\" type=\"audio/mpeg\" />\n \
  \   您的浏览器不支持 audio 元素。\n</audio>\n```\n\nMP3、WAV 和 Ogg 通常是 `<audio>` 元素支持的文件格式。在\
  \ JavaScript 中控制音频文件使用与 `<video>` 标签相同的方法。\n\n要通过 JavaScript 添加并播放音频文件，你可以像处理任何其他\
  \ JavaScript 或 DOM 对象一样来处理它：\n\n点击此处查看代码图像\n\n```javascript\nvar soundElement =\
  \ document.createElement('audio');\nsoundElement.setAttribute('src', 'sound.ogg');\n\
  soundElement.play();\nsoundElement.pause();\n```\n\n`<audio>` 和 `<video>` 标签有许多可以通过\
  \ JavaScript 访问的有用属性。这里有几个实用的属性，其意义显而易见：\n\n```javascript\nmediaElement.duration\n\
  mediaElement.currentTime\nmediaElement.playbackRate\nmediaElement.muted\n```\n\n\
  例如，要跳转到歌曲第 45 秒处，你可能需要使用\n\n点击此处查看代码图像\n\n```javascript\nsoundElement.currentTime\
  \ = 45;\n```\n\n> **提示**\n> 你可以在 `http://www.whatwg.org/specs/web-apps/current-work/multipage/the-element.html`\
  \ 找到这些标签和方法的全面参考。\n\n### 使用 <canvas> 在页面上绘图\n\n新的 `<canvas>` 标签为你提供了这种功能：页面上的矩形空间，你可以在其中绘制形状和图形，还可以通过\
  \ JavaScript 加载图像文件并显示。使用 `<canvas>` 标签只需允许你通过设置 `width` 和 `height` 参数来定义区域；其他与创建图形内容相关的所有操作都通过\
  \ JavaScript 完成。有一套被称为 Canvas 2D API 的大量绘制方法。\n\n### 动手尝试：使用 <canvas> 移动球\n\n你将在\
  \ `<canvas>` 中制作一个简单的动画——一个在页面上圆形移动的红色圆盘（代表球）。\n\n页面主体中所需的 HTML 只有 `<canvas>` 元素：\n\
  \n点击此处查看代码图像\n\n```html\n<canvas id=\"canvas1\" width=\"400\" height=\"300\"></canvas>\n\
  ```\n\n所有的绘图和动画将在 JavaScript 中完成。\n\n> **提示**\n> 如果你不设置 `width` 和 `height` 参数，画布将默为\
  \ 300 像素宽、150 像素高。\n\n你首先需要指定*渲染上下文*。在编写此本书时，2D 是唯一广泛支持的上下文，尽管 3D 上下正在开发中。\n\n点击此处查看代码图像\n\
  \n```javascript\ncontext = canvas1.getContext('2d');\n```\n\n`<canvas>` 仅支持的原始形状是矩形：\n\
  \n点击此处查看代码图像\n\n```javascript\nfillRect(x,y,width,height); // 绘制填充矩形\nstrokeRect(x,y,width,height);\
  \ // 绘制轮廓矩形\nclearRect(x,y,width,height); // 清除矩形\n```\n\n所有其他形状必须通过使用一个或多个路径绘制函数来创建。由于画一个有颜色的圆盘，这就是你需要的。\n\
  \n`<canvas>` 提供了几种不同的路径绘制函数。\n\n移动到 x, y 而不绘制任何内容：\n\n```javascript\nmoveTo(x, y)\n\
  ```\n\n从当前位置画线到 x, y：\n\n```javascript\nlineTo(x, y)\n```\n\n绘制半径为 r、圆心为 x, y、从\
  \ `startAngle` 到 `endAngle` 的圆形圆弧。\n\n\n\n\n\n点击此处查看代码图像\n\n`arc(x, y, r, startAngle,\
  \ endAngle, anti)`\n\n将最后一个参数设置为布尔值 `true` 会使圆弧按逆时针绘制，而不是默认的顺时针绘制。\n\n要使用这些基本命令创建形状，你需要一些额外的方法：\n\
  \n点击此处查看代码图像\n\n```javascript\nobject.beginPath();\nobject.closePath();        //完成部分形状\n\
  object.stroke();          //绘制轮廓形状\nobject.fill();            //绘制填充形状\n```\n\n\
  ***\n\n### 提示\n如果你使用 `fill` 方法，开放的形状将自动关闭，你无需手动使用 `closePath()`。\n\n***\n\n让我们把生成的球变成一个实心圆。我们让它呈红色，半径为\
  \ 15，并居位于画布坐标 50, 50 处：\n\n点击此处查看代码图像\n\n```javascript\ncontext.beginPath();\ncontext.fillStyle=\"\
  #ff0000\";\ncontext.arc(50, 50, 15, 0, Math.PI*2, true);\ncontext.closePath();\n\
  ```\n\n要让球动起来，你需要使用定时器更改球心的 x 和 y 坐标。查看 `animate()` 函数：\n\n点击此处查看代码图像\n\n```javascript\n\
  function animate() {\n    context.clearRect(0,0, 400,300);\n    counter++;\n   \
  \ x += 20 * Math.sin(counter);\n    y += 20 * Math.cos(counter);\n    paint();\n\
  }\n```\n\n该函数通过 `setInterval()` 方法被重复调用。每次调用时，都会使用 `clearRect()` 方法根据整个画布元素的大小来清除画布。变量\
  \ `counter` 在每次循环中递增，然后使用其新值来重新定义圆盘中心的位置。\n\n完整代码列在 列表 11.1 中。\n\n**列表 11.1 使用 <canvas>\
  \ 移动球**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <title>HTML5\
  \ canvas</title>\n<script>\n    var context;\n    var x=50;\n    var y=50;\n   \
  \ var counter = 0;\n    function paint() {\n        context.beginPath();\n     \
  \   context.fillStyle=\"#ff0000\";\n        context.arc(x, y, 15, 0, Math.PI*2,\
  \ false);\n        context.closePath();\n        context.fill();\n    }\n    function\
  \ animate() {\n        context.clearRect(0,0, 400,300);\n        counter++;\n  \
  \      x += 20 * Math.sin(counter);\n        y += 20 * Math.cos(counter);\n    \
  \    paint();\n    }\n    window.onload = function() {\n        context= canvas1.getContext('2d');\n\
  \        setInterval(animate, 100);\n    }\n</script>\n</head>\n<body>\n    <canvas\
  \ id=\"canvas1\" width=\"400\" height=\"300\">\n        <p>Your browser doesn't\
  \ support the canvas element.</p>\n    </canvas>\n</body>\n</html>\n```\n\n***\n\
  \n创建此文件并将其加载到浏览器中。如果你的浏览器支持 `<canvas>` 元素，你应该看到一个红色圆盘沿着圆形路径运行，如图 1.2 所示。\n\n![Image](img/image0023.jpeg)\
  \ 图 1.2 使用 `<canvas>`\n\n***\n\n### 拖放\n\n拖放是 HTML5 标准的一部分。任何元素都可以变为可拖拽的。要使一个元素变为可拖拽，只需要将其\
  \ `draggable` 属性设置为 `true`：\n\n```html\n<img draggable=\"true\" />\n```\n\n然而，单单移动某些东西本身意义不大。为了使用拖拽对象来实现某些功能，你可能希望能够将其放置在某处。\n\
  \n要定义对象可以被放置的位置并控制拖放过程，你需要编写事件监听器来检测和控制拖放过程的各个部分。你可以利用以下事件来控制你的拖放：\n\n- `dragstart`\n\
  - `drag`\n- `dragenter`\n- `dragleave`\n- `dragover`\n- `drop`\n- `dragend`\n\n\
  为了控制拖放，你需要定义一个源元素（拖拽开始的地方）、数据载负载（拖拽的内容）和一个放置目标（接收掉落物品的区域）。\n\n***\n\n### 提示\n并不是所有项目都可以作为放置目标——例如，<img>`\
  \ 无法接受放置。\n\n***\n\n`dataTransfer` 属性包含拖放动作中发送的数据。`dataTransfer` 的值通常在 `dragstart`\
  \ 事件中设置，并在 `drop` 事件中读取/处理。调用 `setData(format, data)` 或 `getData(format, data)`\
  \ 将分别设置或读取这部分数据。\n\n***\n\n### 亲手尝试：HTML 中的拖放\n\n你将构建一个用于 HTML5 拖放界面的演示程序。打开你的编辑器并创建一个包含列表\
  \ 1.2 中列出的代码的文件。\n\n**列表 1.2 HTML5 拖放**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html\n<head>\n    <title>HTML5 Drag and Drop</title>\n    <style>\n  \
  \      body {background-color: #ddd; font-family: arial, sans-serif;}\n        #drop1\
  \ {width: 200px;height: 200px;border: 1px solid black;background-color:white}\n\
  \        #drag1 {width: 50px;height: 50px;}\n    </style>\n    <script>\n      \
  \  function allowDrop(ev) {\n            ev.preventDefault();\n        }\n     \
  \   function drag(ev) {\n            ev.dataTransfer.setData(\"Text\",ev.target.id);\n\
  \        }\n        function drop(ev) {\n            var data = ev.dataTransfer.getData(\"\
  Text\");\n            ev.target.appendChild(document.getElementById(data));\n  \
  \          ev.preventDefault();\n        }\n        window.onload = function() {\n\
  \            var dragged = document.getElementById(\"drag1\");\n            var\
  \ drophere = document.getElementById(\"drop1\");\n            dragged.ondragstart\
  \ = drag;\n            drophere.ondragover = allowDrop;\n            drophere.ondrop\
  \ = drop;\n        }\n    </script>\n</head>\n<body>\n    <div id=\"drop1\"></</div>\n\
  \    <p>Drag the image below into the box:</p>\n    <img id=\"drag1\" src=\"drag.gif\"\
  \ draggable=\"true\" />\n</body>\n</html>\n```\n\n\n\n\n\n加载的页面应该类似于图 11.3 所示所示；拖动小图像并将其释放到白色投放区域，你应该看到它“吸附”到\
  \ `<div>`元素中，如图所示。\n\n![Image](img/image00424.jpeg)\n\n**图 11.3** HTML5 拖放\n\n*\
  \ * *\n\n### 本地存储 (Local Storage)\n\nHTML5 可以在用户的浏览器中存储大量数据，而不会对网站性能产生任何负面影响。与 cookie\
  \ 相比，网络存储更安全、更快。与使用 cookie 类似，数据以键值对的形式存储，且网页只能访问自身存储的数据。\n\n在浏览器中本地存储数据的两个新对象是：\n\
  \n![Image](img/image00365.jpeg) `localStorage`——存储无到期日的数据\n\n![Image](img/image00365.jpeg)\
  \ `sessionStorage`——仅为当前会话存储数据\n\n如果你不确定浏览器对本地存储的支持情况，可以再次使用特性检测：\n\n点击此处查看代码图像\n\
  \n```javascript\nif(typeof(Storage)!==\"undefined\") {\n    ... 两个对象均可用 ...\n}\n\
  ```\n\n要存储一个值，你可以调用 `setItem` 方法，并传递一个键和一个值：\n\n点击此处查看代码图像\n\n```javascript\nlocalStorage.setItem(\"\
  key\", \"value\");\n```\n\n或者，你可以像使用关联数组一样使用 `localStorage` 对象：\n\n点击此处查看代码图像\n\n\
  ```javascript\nlocalStorage[\"key\"] = \"value\";\n```\n\n获取值也可以使用上述方法之一：\n\n点击此处查看代码图像\n\
  \n```javascript\nalert(localStorage.getItem(\"key\"));\n```\n\n或者\n\n```javascript\n\
  alert(localStorage[\"key\"]);\n```\n\n### 与本地文件交互\n\n最后，HTML 通过 HTML5 的 File API\
  \ 规范提供了一种与用户本地文件交互的标准方法。访问外部文件有多种方式：\n\n![Image](img/image00365.jpeg) `File` 提供包括名称、大小和\
  \ MIME 类型的信息，并提供文件句柄的引用。\n\n![Image](img/image00365.jpeg) `FileList` 是 `File` 对象的数组序列。\n\
  \n![Image](img/image00365.jpeg) `FileReader` 接口使用 `File` 和 `FileList` 异步读取文件。你可以检查读取进度、捕获任何错误并确定文件何时完全加载。\n\
  \n#### 检查浏览器支持\n\n再次，你可以通过常用的特性检测方法检查你的浏览器是否支持 File API：\n\n点击此处查看代码图像\n\n```javascript\n\
  if (window.File && window.FileReader && window.FileList) {\n    // 没问题\n}\n```\n\
  \n* * *\n\n### 尝试一下：与本地文件系统交互\n\n在这个示例中，你将修改之前的拖放示例，允许将文件列表从本地文件系统拖入网页中。为了实现这一点，你将使用\
  \ `FileList` 数据结构。\n\n查看修改后的 `drop(ev)` 函数：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ drop(ev) {\n    var files = ev.dataTransfer.files;\n    for (var i = 0; i < files.length;\
  \ i++) {\n        var f = files[i];\n        var pnode = document.createElement(\"\
  p\");\n        var tnode = document.createTextNode(f.name + \" (\" + f.type + \"\
  ) \" + f.size + \" bytes\");\n        pnode.appendChild(tnode);\n        ev.target.appendChild(pnode);\n\
  \    }\n    ev.preventDefault();\n}\n```\n\n在这里，包含拖动文件信息的类数组 `FileList` 从 `dataTransfer`\
  \ 对象中提取出来的：\n\n点击此处查看代码图像\n\n```javascript\nfiles = ev.dataTransfer.files;\n```\n\
  \n然后，通过遍历逐个处理每个文件：\n\n点击此处查看代码图像\n\n```javascript\nfor (var i = 0; i < files.length;\
  \ i++) {\n    var f = files[i];\n    ... 处理每个文件的语句 ...\n}\n```\n\n完整的列表显示在列表 1.3\
  \ 中。\n\n#### 列表 1.3 与文件系统交互\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
  <head>\n    <title>HTML5 本地文件</title>\n    <style>\n        body {background-color:\
  \ #ddd; font-family: arial, sans-serif;}\n        #drop1 {\n            width: 400px;\n\
  \            height: 200px;\n            border: 1px solid black;\n            background-color:\
  \ white;\n            padding: 10px;\n        }\n    </style>\n    <script>\n  \
  \      function allowDrop(ev) {\n            ev.preventDefault();\n        }\n \
  \       function drop(ev) {\n            var files = ev.dataTransfer.files;\n  \
  \          for (var i = 0; i < files.length; i++) {\n                var f = files[i];\n\
  \                var pnode = document.createElement(\"p\");\n                var\
  \ tnode = document.createTextNode(f.name + \" (\" + f.type + \") \" + f.size + \"\
  \ bytes\");\n                pnode.appendChild(tnode);\n                ev.target.appendChild(pnode);\n\
  \            }\n            ev.preventDefault();\n        }\n        window.onload\
  \ = function() {\n            var drophere = document.getElementById(\"drop1\");\n\
  \            drophere.ondragover = allowDrop;\n            drophere.ondrop = drop;\n\
  \        }\n    </script>\n</head>\n<body>\n    <div id=\"drop1\"></div>\n</body>\n\
  </html>\n```\n\n* * *\n\n在编辑器中创建此文件并将生成的页面加载到浏览器中后，你应该能够从本地系统将文件拖入投放区域，并看到列出的文件名、MIME\
  \ 类型和大小，如图 11.4 所示。\n\n![Image](img/image00425.jpeg)\n\n**图 11.4** 与本地文件接口\n\n*\
  \ * *\n\n### 总结\n\nHTML5 为 HTML 了一了一系列设施，使得这种标记语言能够更好地用于应用程序。在这一小时中，你快速地浏览了这些新功能，包括对其中一些功能的动手体验。\n\
  \n\n\n\n\n![Image](img/image00365.jpeg) 分离样式与内容\n![Image](img/image00365.jpeg) DOM\
  \ 样式属性\n![Image](img/image00365.jpeg) 获取样式\n![Image](img/image00365.jpeg) 设置样式\n\
  ![Image](img/image00365.jpeg) 使用 `className` 访问\n![Image](img/image00365.jpeg) DOM\
  \ `styleSheet` 对象\n![Image](img/image00365.jpeg) 在 JavaScript 中启用、禁用和切换样式表\n![Image](img/image00365.jpeg)\
  \ 更改鼠标光标\n\n在万维网早期，页面主要关注其文本内容。早期浏览器对图形效果的支持非常粗浅——某些甚至不支持图像。对网页进行样式设计在很大程度上是使用早期\
  \ HTML 允许的少数与样式相关的属性和标签。\n\n随着浏览器对级联样式表（CSS）支持的引入，有了显著改善，这使得页面的样式可以与其 HTML 标记分开处理。\n\
  \n在书前面的部分，你学习了如何使用 JavaScript 的 DOM 方法来编辑页面结构。然而，JavaScript 也可以用于访问和修改当前页面的 CSS\
  \ 样式。在本节中，你将学习如何做到。\n\n## 十分钟 CSS 入门教程\n\n如果你决定学习 JavaScript，那么很有可能你已经熟悉 CSS 样式设置了。以防万一错过了它，让我们复习一下基础知识。\n\
  \n### 分离样式与内容\n\n在 CSS 出现之前，HTML 页面大部分样式是使用 HTML 标签和/或其属性完成的。例如，为了更改文本的字体颜色，你可能会使用如下代码：\n\
  \n点击此处查看代码图像\n\n```html\n<p><font color=\"red\">这段文字是红色的！</font></p>\n```\n\n出于几个原因，这种做法非常糟糕：\n\
  \n![Image](img/image00365.jpeg) 页面中每一段想要显示为红色的文本都必须用这些额外的标签进行标记。\n\n![Image](img/image00365.jpeg)\
  \ 创建的样式无法传递到其他页面；它们也必须单独地使用额外的 HTML 进行标记。\n\n![Image](img/image00365.jpeg) 如果以后要更改页面样式，你必须编辑每一个页面并筛选\
  \ HTML，逐个更改每个与样式相关的标签和属性。\n\n![Image](img/image00365.jpeg) 有了所有这些额外标记，HTML 变得非常难以阅读和维护。\n\
  \nCSS 尝试将 HTML 元素的样式与该元素的标记功能分离。这是通过定义单独的`style declarations` 然后将其应用于 HTML 元素或元素集合来实现的。\n\
  \n你可以使用 CSS 来设置页面元素的视觉属性，如颜色、字体和大小，以及格式相关的属性，如定位、外边距、内边距和对齐。\n\n这种分离样式与内容的方法带来了许多好处：\n\
  \n![Image](img/image00365.jpeg) 样式声明可以应用于多个元素，甚至（当使用外部样式表时）应用于多个页面。\n\n![Image](img/image00365.jpeg)\
  \ 样式声明的更改会影响所有相关的 HTML 元素，使得更新网站样式更加准确、快速和高效。\n\n![Image](img/image00365.jpeg) 共享样式可以鼓励整个网站保持样式的一致。\n\
  \n![Image](img/image00365.jpeg) HTML 标记更易阅读和维护。\n\n### CSS 样式声明\n\nCSS 样式声明的语法与\
  \ JavaScript 函数并不相似。假设你想为页面中所有的段落元素声明一种样式，使段落内部字体颜色变为红色：\n\n```css\np {\n    color:\
  \ red\n}\n```\n\n你可以为你选定的元素或元素集合应用多个样式规则，并用分号将其隔开：\n\n```css\np {\n    color: red;\n\
  \    text-decoration: italic;\n}\n```\n\n由于你使用了选择器 `p`，之前的样式声明会影响页面上的每一个段落元素。要只选择一个特定的页面元素，你可以使用它的\
  \ ID。这样做时，你用于 CSS 样式声明的选择器不是 HTML 元素的名称，而是以井号 `#` 为前缀的 ID 值。例如，HTML 元素\n\n点击此处查看代码图像\n\
  \n```html\n<p id=\"para1\">这里有一些文本。</p>\n```\n\n可以通过以下样式声明进行样式设置：\n\n```css\n#para1\
  \ {\n    font-weight: bold;\n    font-size: 12pt;\n    color: black;\n}\n```\n\n\
  要使用相同的样式声明设置多个页面元素，只需用逗号将选择器隔开。以下样式声明影响页面上所有的 `div` 元素，以及任何 `id` 值为 `para1` 的元素：\n\
  \n```css\ndiv, #para1 {\n    color: yellow;\n    background-color: black;\n}\n```\n\
  \n或者，你可以选择共享特定 `class` 属性的所有元素，通过在类名前加加点 `.` 来形成选择器：\n\n点击此处查看代码图像\n\n```html\n\
  <p class=\"info\">欢迎访问我的网站。</p>\n<span class=\"info\">请使用下面的表单登录或注册。span>\n```\n\
  \n我们可以用一个声明为这些元素设置样式：\n\n点击此处查看代码图像\n\n```css\n.info {\n    font-family: arial,\
  \ verdana, sans-serif;\n    color: green;\n}\n```\n\n### 样式声明放置的位置\n\n与 JavaScript\
  \ 语句类似，CSS 样式声明可以出现在页面内部，也可以保存在外部文件中并在 HTML 页面中进行引用。\n\n要引用外部样式表，通常做法是在页面的 `<head>`\
  \ 中添加如下行：\n\n点击此处查看代码图像\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  style.css\" />\n```\n\n或者，你可以将样式声明直接放在页面的 `<head>` 中，`<style>` 和 `</style>` 标签之间：\n\
  \n```html\n<style>\n    p {\n        color: black;\n        font-family: tahoma;\n\
  \    }\n    h1 {\n        color: blue;\n        font-size: 22pt;\n    }\n</style>\n\
  ```\n\n最后，可以通过使用 `style` 属性直接将样式声明添加到 HTML 元素中：\n\n点击此处查看代码图像\n\n```html\n<p style=\"\
  color:red; font-size: 12px;\">请查看我们的服务条款。</p>\n```\n\n> **提示** 在外部样式表中定义的样式具有可以轻松应用于多个面的优势，而页面内部定义的样式则不能。\n\
  \n## DOM style 属性\n\n你在之前的章节中看到了浏览器如何将 HTML 页面表示为 DOM 树。DOM `nodes`——组成 DOM 树的单个叶子和分支——都是对象，每个对象都有自己的属性和方法。\n\
  \n你见过各种可以选择单个 DOM 节点或节点集合的方法，例如 `document.getElementById()`。\n\n每个 DOM 节点都有一个名为\
  \ `style` 的属性，它本身是一个包含其父节点 CSS 样式信息的对象。让我们来看来看：\n\n点击此处查看代码图像\n\n```html\n<div id=\"\
  id1\" style=\"width:200px;\">欢迎回到我的网站。</div>\n<script>\n    var myNode = document.getElementById(\"\
  id1\");\n    alert(myNode.style.width);\n</script>\n```\n\n在这种情况下，alert 将显示消息“200px.”\n\
  \n> **注意** 除了 `myNode.style.width` 语法，你也可以使用等效的 `myNode.style[\"width\"]`。这有时是必要的，例如当将属性名作为变量传递时：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myProperty = \"width\";\nmyNode.style[myProperty]\
  \ = \"200px\";\n```\n\n遗憾的是，虽然这种方法对于*内联*样式效果良好，但如果你通过页面头部的 `<style>` 元素或外部样式表为页面元素应用样式，DOM\
  \ 样式对象将无法访问它。\n\n\n\n\n\n在第 13 节“介绍 CSS3”中，你将学习另一种在 JavaScript 中访问样式属性的方法，这种方法可以避免仅适用于内联样式的限制。\n\
  \n然而，DOM `style` 对象并并不是只读的；你可以使用 `style` 对象设置样式属性的值，你通过这种方式设置的属性*会被* DOM `style`\
  \ 对象返回。\n\n**注意**\n\nCSS 包含许多名称中带有连字符的属性，例如 `background-color`、`font-size`、`text-align`\
  \ 等。由于 JavaScript 属性和方法名不允许包含连字符，我们需要修改这些属性的写法方式。在 JavaScript 中访问此类属性时，删除属性名中的连字符，并将随后的字符大写化，因此\
  \ `font-size` 变为 `fontSize`，`text-align` 变为 `textAlign`，依此类推。\n\n### 动手尝试：设置样式属性\n\
  \n让我们写一个函数，使用 DOM `style` 对象在页面元素的背景颜色和字体颜色两个值之间进行切换：\n\n点击此处查看代码图像\n\n```javascript\n\
  function toggle() {\n    var myElement = document.getElementById(\"id1\");\n   \
  \ if(myElement.style.backgroundColor == 'red') {\n        myElement.style.backgroundColor\
  \ = 'yellow';\n        myElement.style.color = 'black';\n    } else {\n        myElement.style.backgroundColor\
  \ = 'red';\n        myElement.style.color = 'white';\n    }\n}\n```\n\n`toggle()`\
  \ 函数首先找到页面元素当前的 `background-color` CSS 属性，然后将该颜色与 `red` 进行比较。\n\n如果 `background-color`\
  \ 属性当前的值为 `red`，它会将元素的样式属性设为在黄色背景上显示黑色文字；否则，它将样式值设为在红色背景上显示白色文字。\n\n我们使用此函数来切换 HTML\
  \ 文档中 `<span>` 元素的颜色。\n\n完整的列表显示在列表 12.1 中。\n\n**列表 12.1 使用 DOM style 对象进行样式设置**\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n    <title>设置页面元素的样式</title>\n\
  \    <style>\n        span {\n            font-size: 16pt;\n            font-family:\
  \ arial, helvetica, sans-serif;\n            padding: 20px;\n        }\n    </style>\n\
  \    <script>\n        function toggle() {\n            var myElement = document.getElementById(\"\
  id1\");\n            if(myElement.style.backgroundColor == 'red') {\n          \
  \      myElement.style.backgroundColor = 'yellow';\n                myElement.style.color\
  \ = 'black';\n            } else {\n                myElement.style.backgroundColor\
  \ = 'red';\n                myElement.style.color = 'white';\n            }\n  \
  \      }\n        window.onload = function() {\n            document.getElementById(\"\
  btn1\").onclick = toggle;\n        }\n    </script>\n</head>\n<body>\n    <span\
  \ id=\"id1\">Welcome back to my site.</span>\n    <input type=\"button\" id=\"btn1\"\
  \ value=\"Toggle\" />\n</body>\n</html>\n```\n\n在你的编辑器中创建该 HTML 文件并尝试运行。\n\n你应该发现，当页面最初加载时，文本是默认的黑色且没有背景颜色。这是因为这些样式属性最初没有在页面头部的\
  \ `<style>` 指令中设置，没有作为内联样式设置，也没有通过 DOM 设置。\n\n当点击按钮时执行的 `toggle()` 函数会检查 `<span>`\
  \ 元素的当前背景颜色。当发现其值当前不是 `red` 时，`toggle()` 将背景颜色设置为红色，文本颜色设置为白色。\n\n下一次点击按钮时，测试条件\n\
  \n点击此处查看代码图像\n\n```javascript\nif(myElement.style.backgroundColor == 'red')\n```\n\
  \n返回值为 `true`，导致颜色改为被设置为黄色背景上的黑色文字。\n\n图 12.1 显示了程序的运行情况。\n\n![图像](img/image00426.jpeg)\n\
  \n**图 12.1** 在 JavaScript 中设置样式属性\n\n### 使用 className 类\n\n在本节的早期，我们讨论了将样式与内容分离，以及这种分离可以带来的益处。\n\
  \n使用 JavaScript 编辑 `style` 对象的属性（如前面的练习所示）效果良好——但它带有破坏这种样式与内容分离的危险。如果你的 JavaScript\
  \ 代码经常更改元素的样式声明，那么页面样式的责任将不再稳固地留在 CSS 中。如果你以后决定更改 JavaScript 应用的样式，你将不得不回溯并编辑所有的\
  \ JavaScript 函数。\n\n幸运的是，我们有一种机制，可以让 JavaScript 在不覆盖单个样式声明的情况下重新设置页面。通过使用元素的 `className`\
  \ 属性，我们可以切换 `class` 属性的值，以及与之相关的元素样式声明。查看列表 12.2。\n\n**列表 12.2 使用 className 切换类**\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>使用 JavaScript\
  \ 切换类</title>\n    <style>\n        .classA {\n            width: 180px;\n     \
  \       border: 3px solid black;\n            background-color: white;\n       \
  \     color: red;\n            font-size: 16pt arial, helvetica, sans-serif;\n \
  \           padding: 20px;\n        }\n        .classB {\n            width: 180px;\n\
  \            border: 3px dotted white;\n            background-color: black;\n \
  \           color: yellow;\n            font-size: 24px \"Times Roman\", serif;\n\
  \            padding: 20px;\n        }\n    </style>\n    <script>\n        function\
  \ toggleClass() {\n            var myElement = document.getElementById(\"id1\");\n\
  \            if(myElement.className == \"classA\") {\n                myElement.className\
  \ = \"classB\";\n            } else {\n                myElement.className = \"\
  classA\";\n            }\n        }\n        window.onload = function() {\n    \
  \        document.getElementById(\"btn1\").onclick = toggleClass;\n        }\n \
  \   </script>\n</head>\n<body>\n    <div id=\"id1\" class=\"classA\"> An element\
  \ with a touch of class.</div>\n    <input type=\"button\" id=\"btn1\" value=\"\
  Toggle\" />\n</body>\n</html>\n```\n\n`<head>` 中的 `<style>` 列出了两个类 `classA` 和 `classB`\
  \ 的样式声明。JavaScript 函数 `toggleClass()` 使用了与列表 12.1 中早期的 `toggle()` 类似的逻辑，但 `toggleClass()`\
  \ 不作用元素的 `style` 对象。相反，`toggleClass()` 获取与 `<div>` 元素关联的类并在 `classA` 和 `classB`\
  \ 之间切换其值。\n\n图 12.2 显示了脚本的运行情况。\n\n![图像](img/image00427.jpeg)\n\n**图 12.2** 在 JavaScript\
  \ 中切换类\n\n### DOM styleSheets 对象\n\n`document` 对象的 `styleSheets` 属性包含了页面所有样式表的数组，无论这些样式表是包含在外部文件中并链接到页面头部，还是声明在页面头部的\
  \ `<style>` 和 `</style>` 标签之间。`styleSheets` 数组中的项按数字索引，从第一个样式表开始索引为 0。\n\n**提示**\n\
  \n你可以通过使用来获取页面上样式表的总数：\n\n\n\n\n\n`document.styleSheets.length`\n\n## 启用、禁用和切换样式表\n\
  \n数组中的每个样式表都有一个名为 `disabled` 的属性，其值为布尔值 `true` 或 `false`。这是一个可读写属性，因此我们能够在 JavaScript\
  \ 中有效地切换单个样式表的开启和关闭：\n\n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[0].disabled\
  \ = true;\ndocument.styleSheets[1].disabled = false;\n```\n\n上述代码段落“开启”了页面上的第二个样式表（索引\
  \ 1），同时“关闭”了第一个样式表（索引 0）。\n\n列表 12.3 包含了一个可以运行的示例。页面上的脚本首先声明了变量 `whichSheet`，并将其初始化为零：\n\
  \n```javascript\nvar whichSheet = 0;\n```\n\n该变量用于跟踪两个样式表中的哪一个当前处于激活状态。第二行代码最初禁用了页面上的两个样式表中的第二个：\n\
  \n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[1].disabled = true;\n```\n\n\
  函数 `sheet()` 在页面加载时附加到页面按钮的 `onClick` 事件处理程序，当按钮被点击时，它执行三项任务：\n\n![Image](img/image00365.jpeg)\
  \ 禁用索引存储在变量 `whichSheet` 中的样式表：\n\n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[whichSheet].disabled\
  \ = true;\n```\n\n![Image](img/image00365.jpeg) 在一和零之间切换变量 `whichSheet` 值：\n\n点击此处查看代码图片\n\
  \n```javascript\nwhichSheet = (whichSheet == 1) ? 0 : 1;\n```\n\n![Image](img/image00365.jpeg)\
  \ 启用与 `whichSheet` 新值对应的样式表：\n\n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[whichSheet].disabled\
  \ = false;\n```\n\n这些活动的组合效果是在页面的两个激活样式表之间进行切换。该脚本在 列表 12.3 和 图 12.3 中展示了运行效果。\n\
  \n![Image](img/image00428.jpeg)\n\n**图 12.3** 使用 `styleSheets` 属性切换样式表\n\n**列表 12.3\
  \ 使用 styleSheets 属性在样式表之间切换**\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>使用 JavaScript 切换样式表</title>\n    <style>\n        body {\n  \
  \          background-color: white;\n            color: red;\n            font:\
  \ normal 24px arial, helvetica, sans-serif;\n            padding: 20px;\n      \
  \  }\n    </style>\n    <style>\n        body {\n            background-color: black;\n\
  \            color: yellow;\n            font: italic bold 24px \"Times New Roman\"\
  , serif;\n            padding: 20px;\n        }\n    </style>\n    <script>\n  \
  \      var whichSheet = 0;\n        document.styleSheets[1].disabled = true;\n \
  \       function sheet() {\n            document.styleSheets[whichSheet].disabled\
  \ = true;\n            whichSheet = (whichSheet == 1) ? 0 : 1;\n            document.styleSheets[whichSheet].disabled\
  \ = false;\n        }\n        window.onload = function() {\n            document.getElementById(\"\
  btn1\").onclick = sheet;\n        }\n    </script>\n</head>\n<body>\n    使用下方的按钮切换我的样式表！<br\
  \ />\n    <input type=\"button\" id=\"btn1\" value=\"Toggle\" />\n</body>\n</html>\n\
  ```\n\n## 尝试自己：选择特定的样式表\n\n通过数字对样式表进行索引并不易于选择所需的样式表。如果你有一个函数允许你为样式表命名并通过它们的标题属性来选择它们，情况将会更加简单。\n\
  \n如果你请求一个不存在的样式表，你需要你的函数做出有用的响应；你希望它能保持之前的样式表并向用户发送消息。\n\n首先，声明几个变量并初始化它们的值：\n\n\
  ```javascript\nvar change = false;\nvar oldSheet = 0;\n```\n\n布尔变量 `change` 用于跟踪你是否找到了具有请求名称的样式表；一旦找到，你就会将其值更改为\
  \ `true`，表示你打算更改样式表。\n\n整数 `oldSheet` 初始设置为零，最终将赋值为当前激活样式表的编号；在没有找到与请求标题匹配的新样式表的情况下，你会在从函数返回之前将其重新设为激活状态。\n\
  \n现在，你需要遍历 `styleSheets` 数组：\n\n点击此处查看代码图片\n\n```javascript\nfor (var i = 0; i <\
  \ document.styleSheets.length; i++) {\n    ...\n}\n```\n\n对于每个样式表：\n\n![Image](img/image00412.jpeg)\
  \ 如果你发现它是当前激活的样式表，将其索引存储在变量 `oldSheet` 中：\n\n点击此处查看代码图片\n\n```javascript\nif(document.styleSheets[i].disabled\
  \ == false) {\n    oldSheet = i;\n}\n```\n\n![Image](img/image00412.jpeg) 在循环时，确保所有样式表都已被禁用：\n\
  \n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[i].disabled = true;\n```\n\n\
  ![Image](img/image00412.jpeg) 如果当前样式表的标题与请求的样式表相同，通过将其 `disabled` 值设置为 `false` 来使其启用，并立即将你的变量\
  \ `change` 设置为 `true`：\n\n点击此处查看代码图片\n\n```javascript\nif(document.styleSheets[i].title\
  \ == mySheet) {\n    document.styleSheets[i].disabled = false;\n```\n\n当你遍历完所有样式表后，可以根据变量\
  \ `change` 和 `oldSheet` 的状态判断你是否可以更改样式表。如果没有，将之前的样式表重新启用：\n\n点击此处查看代码图片\n\n```javascript\n\
  if(!change) document.styleSheets[oldSheet].disabled = false;\n```\n\n最后，函数返回变量 `change`\
  \ 的值——如果发生了更改返回 true，如果没有则返回 false。代码列在 列表 12.4。将此代码保存为 HTML 文件并在浏览器中加载。\n\n###\
  \ 列表 2.4 按标题选择样式表\n\n\n\n\n当页面加载时，小函数 `sheet()` 被添加到按钮的 `onClick` 事件处理程序中。每当点击按钮时，`sheet()`\
  \ 提示用户输入样式表的名称：\n\n点击此处查看代码图片\n\n```javascript\nvar sheetName = prompt(\"Stylesheet\
  \ Name?\");\n```\n\n然后它调用 `ssEnable()` 函数，并将请求的名称作为参数传递进去。\n\n如果函数返回 `false`，表示没有发生样式表的更改，你将通过消息向用户报警：\n\
  \n点击此处查看代码图片\n\n```javascript\nif(!ssEnable(sheetName)) alert(\"Not found - original\
  \ stylesheet retained.\");\n```\n\n该脚本在图 12.4 中演示运行。\n\n![Image](img/image00429.jpeg)\n\
  \n**图 12.4** 按名称选择新样式表\n\n* * *\n\n### 总结\n\n在本小时中，你学习了 JavaScript 应用于页面 CSS 样式的多种方法。你学习了如何使用页面元素的\
  \ `style` 属性，如何处理 CSS 类，以及如何操作整个样式表。\n\n## 问答\n\n**问：JavaScript 是否可以处理单独的 CSS 样式规则？**\n\
  \n**答：** 可以，但在编写本文时，这种方法的跨浏览器兼容性并不好。Mozilla 浏览器支持 `cssRules` 数组，而 Internet Explorer\
  \ 将等效数组称为 `Rules`。此外，不同浏览器对“规则（rule）”概念的解释也存在差异。希望未来的浏览器版本能解决这些差异。\n\n**问：是否可以在\
  \ JavaScript 中更改鼠标光标？**\n\n**答：** 可以的。`style` 对象有一个名为 `cursor` 的属性，它可以接受各种值。常用的光标包括以下：\n\
  \n![Image](img/image00365.jpeg) **Crosshair（十字准）**——指针呈现为对像枪准星一样的交叉线。\n\n![Image](img/image00365.jpeg)\
  \ **Pointer（指针）**——通常是一个指向的手指。\n\n![Image](img/image00365.jpeg) **Text（文本）**——文本输入光标。\n\
  \n![Image](img/image00365.jpeg) **Wait（等待）**——程序正在忙。\n\n### 习习\n\n在阅读后续的“答案”部分之前，尝试回答所有问题。\n\
  \n#### 测验\n\n**1。** 要将元素 `myElement` 的 `font-family` 属性设置为 Verdana，你应该使用：\n\n**a.**\
  \ `myElement.style.font-family = \"verdana\";`\n\n**b.** `myElement.style.fontFamily\
  \ = \"verdana\";`\n\n**c.** `myElement.style.font-family(\"verdana\");`\n\n**2。**\
  \ 属性 `className` 可以用于：\n\n**a.** 访问元素的 `class` 属性值\n\n**b.** 访问元素的 `name` 属性值\n\n\
  **c.** 为元素添加属性 `classname`\n\n**3。** 如何启用 `styleSheets` 数组中索引为 `n` 的样式表？\n\n**a.**\
  \ `document.styleSheets[n].active = true;`\n\n**b.** `document.styleSheets[n].enabled\
  \ = true;`\n\n**c.** `document.styleSheets[n].disabled = false;`\n\n#### 答案\n\n\
  **1。** b. `myElement.style.fontFamily = \"verdana\";`\n\n**2。** a. 访问元素的 `class`\
  \ 属性值。\n\n**3。** c. `document.styleSheets[n].disabled = false;`\n\n## 练习\n\n![Image](img/image00365.jpeg)\
  \ 修改示例 12.1 中的程序，以更改其他样式属性，如字体、装饰、元素边框、内边距和外边距。\n\n![Image](img/image00365.jpeg)\
  \ 修改示例 12.4 的程序，使某些样式表通过外部链接，而不是位于页面 `<head>` 中的 `<style>` 和 `</style>` 标签之间。一切运行正常吗？\n\
  \n## 第 13 小时。引入 CSS3\n\n* * *\n\n在本小时你将学习：\n\n![Image](img/image00365.jpeg) CSS3\
  \ 为 CSS 带来的一些新功能\n\n![Image](img/image00365.jpeg) 使用特定厂商的前缀和扩展\n\n![Image](img/image00365.jpeg)\
  \ CSS3 属性的跨浏览器设置\n\n![Image](img/image00365.jpeg) 在 JavaScript 中高效设置 CSS3 属性\n\n\
  * * *\n\n使用 CSS3，你可以轻松地实现许多酷炫的新效果，而无需使用大量的 JavaScript 代码和/或 Photoshop 等外部图形应用程序。你可以创建圆角边框、为框添加阴影、使用图像作为边框等。CSS3\
  \ 包含了几个新的背景属性，让你对背景元素有更多控制权，包括多个背景图像，而 CSS3 渐变允许你在两个或多个指定颜色之间显示平滑过渡。新的文本功能包括文本阴影和自动换行，以及方便使用网络字体。CSS3\
  \ 还让你能够轻松构建非常酷的过渡、变换和动画。\n\n在本小时中，你将了解 CSS3 能为你的网页做什么，并将看到如何使用 JavaScript 有效地控制\
  \ CSS3 的功能。\n\n### 特定厂商属性和前缀\n\nCSS 厂商前缀是浏览器公司在新的 CSS 功能成为正式 CSS3 规范之前对其支持的方法，或者实现尚未最终完成的功能。随着时间的推移，当这些功能通过标准的\
  \ CSS3 命名完全支持时，这些前缀通常就不再需要了。但为了确保你的页面在尽可能多的浏览器中按你想要的方式渲染，使用前缀是有价值的。\n\n你可能需要的 CSS3\
  \ 浏览器前缀出现在表 13.1 中。\n\n![Image](img/image0430.jpeg)\n\n**表 13.1 CSS3 厂商前缀**\n\n\
  在大多数需要前缀的情况下，你按照 CSS3 规范列出 CSS3 属性，并根据所使用的浏览器从 13.1 中添加相关前缀。例如，在本小时稍些时候你将读到关于 CSS3\
  \ 过渡的内容。你会发现，如果你想给页面添加 CSS3 过渡，你会使用带有前缀的 `transition` 属性：\n\n点击此处查看代码图片\n\n```css\n\
  -webkit-transition: background 0.5s ease;\n-moz-transition: background 0.5s ease;\n\
  -o-transition: background 0.5s ease;\ntransition: background 0.5s ease;\n```\n\n\
  用户的浏览器将响应它所理解的过渡功能版本，忽略其他版本。\n\n幸运的是，浏览器制造商正在努力完全实现所有 CSS3 功能，对于大多数现代浏览器，需要前缀的属性数量正在迅速减少。\n\
  \n* * *\n\n提示\n\n属性的前缀版本并不总是与 CSS3 规范中描述的属性相同。\n\n尽管特定厂商的扩展通常会避免冲突（因为每个厂商都有独特的前缀），但请记住，这些扩展可能会被厂商更改，因为它们并不是\
  \ CSS3 规范的一部分，尽管它们试图表现得像即将推出的 CSS3 属性。\n\n同样请记住，特定厂商的扩展几乎肯定无法通过 CSS 验证。\n\n* * *\n\
  \n在编写本文时，[`shouldiprefix.com/`](http://shouldiprefix.com/) 有关于哪些功能/浏览器组合需要前缀的非常有用的汇总。\n\
  \n关于特定浏览器和版本支持的功能频繁更新列表，请访问 [`www.w3schools.com/cssref/css3_browsupport.asp`](http://www.w3schools.com/cssref/css3_browsupport.asp)。\n\
  \n* * *\n\n注意\n\n属性的前缀版本可能并不与 CSS3 规范中描述的属性相同。\n\n### CSS3 边框\n\nCSS3 让你对边框进行一些非常酷的操作，而这些以前只能通过大量丑陋、难以维护的代码技巧来实现。\n\
  \n在本节中，我们将两个示例：框阴影和圆角。\n\n#### 创建框阴影\n\n\n\n\n\n`box-shadow` 属性允许你为页面的盒元素（box elements）添加投影效果。如表\
  \ 13.2\n\n**表格 13.2 box-shadow 属性参数**\n\n这里是一个示例，使用了一个 10px 宽的阴影，向向右下方延伸，在整个宽度上进行模糊处理，颜色为中灰色：\n\
  \n点击此处查看代码图像\n\n```css\n#div1 {\nbackground-color: #8080ff;\nwidth: 400px;\nheight:\
  \ 250px;\nbox-shadow: 10px 10px 10px #808080;\n-webkit-box-shadow: 10px 10px 10px\
  \ #808080;\n-moz-box-shadow: 10px 10px 10px #808080;\n}\n```\n\n在图 13.1 中，你可以看到这种样式应用于网页中\
  \ `<div>` 元素的示例。\n\n![Image](img/image00432.jpeg)\n\n**图 13.1** 一个 CSS3 盒投影\n\n\
  ## 使用 border-radius 属性实现圆角\n\n`border-radius` 属性允许你为页面元素添加圆角，而无需专门创建圆角图像，这可能是 CSS3\
  \ 新功能中最受欢迎的之一。\n\n`border-radius` 属性已经得到了广泛的浏览器支持，尽管 Mozilla Firefox 比某些竞争对手多在使用一段时间的\
  \ `-moz-` 前缀；因此，如果你需要支持之前的几个版本的 Firefox，应该考虑包含带前缀的版本：\n\n```css\n#div1 {\n-moz-border-radius:\
  \ 25px;\nborder-radius: 25px;\n}\n```\n\n在图 13.2 中，你可以看到一个带有圆角元素的 `<div>` 元素示例。\n\
  \n![Image](img/image00433.jpeg)\n\n**图 13.2** 一个 CSS3 圆角\n\n圆角可以使用单独属性 `border-bottom-left-radius`、`border-top-left-radius`、`border-bottom-right-radius`\
  \ 和 `border-top-right-radius`（注：原文此处有笔误）独立指定，也可以像我们在这里所做，使用 `border-radius` 属性在一个条语句中指定所有四个角。\n\
  \n## CSS3 背景\n\nCSS3 包含了几个新的背景属性，允许对背景元素进行更多控制。在本节中，你将学习 `background-size` 和 `background-origin`\
  \ 属性，以及如何使用多个背景图像。\n\n### background-size 属性\n\n`background-size` 属性为 CSS 增加了一项新功能，允许你使用长度、百分比或两个关键字\
  \ `contain` 或 `cover` 来设置背景图像的尺寸。\n\n使用长度和百分比指定背景大小的行为正如你预期的那样。对于每个背景图像，可以提供两个长度或百分比，分别对应宽度和高度。（当你使用百分比时，它们关系到背景可用空间，而不是背景图像的宽度和高度。）\n\
  \n`auto` 关键字可以代替宽度或高度值。如果你只为 `background-size` 指定一个值，该值将被假设为宽度。此时高度将默认为 `auto`。\n\
  \n点击此处查看代码图像\n\n```css\n#div1 {\nbackground-size: 400px;\nbackground-image: url(lake.png);\n\
  width: 400px;\nheight: 250px;\nborder-radius: 25px;\n}\n```\n\n在这里，我将背景宽度设置为 `<div>`\
  \ 元素的大小（为了保险起见，我也圆化了圆角）。结果如图 13.3\n\n**图 13.3** 在 CSS3 中设置背景大小\n\n### background-origin\
  \ 属性\n\n`background-origin` 属性用于设置盒中背景位置的计算方式。它接受三个值之一：`padding-box`、`border-box`\
  \ 或 `content-box`。\n\n当你提供 `padding-box` 值时，位置相对于内边距边缘的左上角。使用 `border-box` 时，相对于边框的左上角，而\
  \ `content-box` 意味着背景相对于内容的左上角定位。\n\n### 多背景图像\n\nCSS3 允许通过使用逗号分隔的列表为盒元素使用多个背景图像。列表的顺序非常重要，提供的第一个值代表最靠近用户的层，列表中的后续项目将依次渲染在在其后方的层中。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```css\n#div1 {\nwidth: 600px;\nheight: 350px;\nbackground-image:\
  \ url(boat.png), url(lake.png);\nbackground-position: center bottom, left top;\n\
  background-repeat: no-repeat;\n}\n```\n\n在这里，`boat.png` 是透明背景上的游艇画，而 `lake.png`\
  \ 是一张照片。在图 13.4 中，你可以看到应用于网页内 `<div>` 元素时的结果。\n\n![Image](img/image00435.jpeg)\n\
  \n**图 13.4** 在 CSS3 背景中使用多张图像\n\n浏览器对多背景功能的支持已经相当成熟，Mozilla Firefox (3.6+)、Safari/Chrome\
  \ (1.0/1.3+)、Opera (10.5+) 和 Internet Explorer (9.0+) 都提供了支持。\n\n## CSS3 渐变\n\n\
  CSS3 渐变允许你在两个或多个指定颜色之间生成平滑过渡，而以前你必须使用图像来实现这些效果。通过 CSS3 渐变，你可以减少这些图像会花费的下载时间、缓存内存和带宽消耗。CSS3\
  \ 渐变在缩放时性能更好，CSS3 提供了两种类型的渐变：线性渐变和径向渐变。\n\n### 线性渐变\n\n要在 CSS3 中创建线性渐变，你必须定义至少颜色作为端点。你还可以为渐变输入一个方向（例如，上到下、左到右或一个角度）。\n\
  \n```css\n#div1 {\nwidth: 600px;\nheight: 350px;\nbackground-image: -webkit-linear-gradient(red,\
  \ #6699cc);\nbackground-image: -o-linear-gradient(red, #6699cc);\nbackground-image:\
  \ -moz-linear-gradient(red, #6699cc);\nbackground-image: linear-gradient(red, #6699cc);\n\
  }\n```\n\n如果你没有为渐变指定方向，将使用默认的从上到下，如图 13.5 所示。\n\n![Image](img/image0436.jpeg)\n\n\
  **图 13.5** 一个 CSS3 线性渐变\n\n你也可以为渐变输入方向；例如，假设你希望渐变是从左到右而不是从上到下，如下：\n\n点击此处查看代码图像\n\
  \n```css\nbackground: linear-gradient(to right, red, #6699cc);\n```\n\n以下行定义了一个对角渐变：\n\
  \n点击此处查看代码图像\n\n```css\nbackground: linear-gradient(to bottom right, red, #6699cc);\n\
  ```\n\n如果你想完全控制渐变的方向，可以定义一个角度：\n\n点击此处查看代码图像\n\n```css\nbackground: linear-gradient(135deg,\
  \ red, #6699cc);\n```\n\n### 径向渐变\n\n径向渐变由其中心定义，并且像线性渐变一样，必须定义至少两种颜色作为渐变效果的端点：\n\
  \n点击此处查看代码图像\n\n```css\nbackground: radial-gradient(red, #6699cc);\n```\n\n这样指定的径向渐变显示如图\
  \ 13.6 所示。\n\n![Image](img/image00437.jpeg)\n\n**图 13.6** 一个 CSS3 径向渐变\n\n你还可以使用\
  \ `at` 关键字为径向渐变的中心设置位置参数：\n\n点击此处查看代码图像\n\n```css\nbackground: radial-gradient(at\
  \ top left, red, #6699cc);\n```\n\n结果如图 13.7 所示。\n\n\n\n\n\n## 图 13.7 移动径向渐变的中心点\n\
  \n***\n\n### 提示\nCSS3 渐变的功能比我在这里能描述的要得多，包括使用两种以上的颜色、透明度以及对渐变形状和大小的修改。你甚至可以在同一个元素上添加多个渐变。完整细节见\
  \ W3C 文档：[`www.w3.org/TR/2011/WD-css3-images-20110217/`](http://www.w3.org/TR/2011/WD-css3-images-20110217/)\n\
  \n***\n\n## CSS3 文本效果\nCSS3 包含了一些新功能来帮助你处理文本。\n\n### 文本阴影 (Text Shadow)\n在 CSS3\
  \ 中，`text-shadow` 属性应用于文本阴影的方式与块元素的 `box-shadow` 属性几乎相同。你可以指定水平和垂直阴影距离，以及模糊距离和阴影颜色：\n\
  \n点击此处查看代码图片\n\n```cssh3 {\n  text-shadow: 10px 10px 3px #333;\n  font-size: 26px;\n\
  }\n```\n\n你可以在图 13.8 中看到示例。\n\n![Image](img/image00439.jpeg)\n\n**图 13.8** CSS3\
  \ 文本阴影\n\n### 单词换行 (Word Wrap)\n如果一个单词太长，无法放入包含它的块元素中，它就会溢出容器。在 CSS3 中，你可以使用 `word-wrap`\
  \ 属性强制文本换行，即使必须在单词中间换行也可以：\n\n```cssp {\n    word-wrap: break-word;\n}\n```\n\n\
  ## CSS3 过渡、变换和动画\n传统上，程序员使用自定义 JavaScript 代码来创建页面元素的移动效果，这在跨浏览器实现上可能非常棘手。如果能有更简单的方法为页面上的元素添加简单效果将更好了。\n\
  \n这些功能目前正以过渡（transitions）、变换（transformations）和动画（animations）的形式引入 CSS3。大多数浏览器已经对它们提供了不同程度的支持。\n\
  \n在下面的简单示例中，我们添加了一个过渡效果（在支持它的浏览器中），以便在鼠标悬停在链接上时更改背景颜色。随着背景色的变化，过渡效果将平滑这种变换。\n\n\
  这里是我们的示例链接代码：\n\n点击此处查看代码图片\n\n```html\n<a href=\"somepage.html\" class=\"trans\"\
  \ id=\"link1\">Show Me</a></a>\n```\n\n以下是 CSS 声明，显示了原始背景颜色和悬停背景颜色，以及在不同浏览器中执行过渡效果的声明。请注意所需的不同前缀范围，正如在本节早些时候讨论的那样。最后一个不带前缀的声明将在该技术从实验阶段变为完成状态后成为所需的标准。\n\
  \n点击此处查看代码图片\n\n```css\na.trans {\n    background: #669999;\n    -webkit-transition:\
  \ background 0.5s ease;\n    -moz-transition: background 0.5s ease;\n    -o-transition:\
  \ background 0.5s ease;\n    transition: background 0.5s ease;\n}\na.trans:hover\
  \ {\n    background: #999966;\n}\n```\n\n***\n\n关于 CSS3 过渡、变换和动画的全面信息，可以在 [`css3.bradshawenterprises.com/all/`](http://css3.bradshawenterprises.com/all/)找到。\n\
  \n***\n\n## 在 JavaScript 中引用 CSS3 属性\nCSS3 与 JavaScript 的结合有望带来流畅性能、高可靠性和最小代码复杂性的效果。在本节中，我们将介绍如何在\
  \ JavaScript 代码中成功获取和设置 CSS3 属性的方法。\n\n### 将 CSS 属性名转换为 JavaScript\n正如我在第 12 节中提到的，“JavaScript\
  \ 和 CSS”，为了使 CSS 属性名称兼容 JavaScript 的命名规范，CSS 属性名需要从样式表中的格式进行细小的转换。\n\nJavaScript\
  \ 版本不再像 CSS 那样使用小写名称和连字符，而是删除了连字符并将后续字符大写化。因此，`border-radius` 变为 `borderRadius`。没有连字符的属性名（如\
  \ `width`）保持不变。\n\n你已经在第 12 节中看到如何使用这种命名规范结合 DOM `style` 属性来访问元素样式属性：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar bRad = document.getElementById(\"div1\").style.borderRadius;\n\
  ```\n\n正如我当时提到的，虽然这很有用，但它仅限于具有内联样式的元素；对于在页面头部 `<style>` 元素中或外部文件中分组定义了 CSS 声明的元素，它将不起作用。幸运的是，有一种更好的方法，我现在将讨论它。\n\
  \n### DOM getComputedStyle() 方法\n现在几乎所有浏览器都支持 DOM `getComputedStyle()` 方法，该方法可以访问元素的最终（即计算出的）样式。我们所说的最终样式是指浏览器在应用了所有与该元素相关的样式规则（无论是内联的、外部的还是继承自容器元素的）后，最终显示元素时的样式。\n\
  \n`getComputedStyle()` 方法返回一个包含各种方法的对象，包括 `getPropertyValue(property)`，它返回给定 CSS\
  \ 属性名称的当前值：\n\n点击此处查看代码图片\n\n```javascript\nvar myDiv = document.getElementById(\"\
  div1\");\nvar bRad = getComputedStyle(myDiv).getPropertyValue(\"borderRadius\");\n\
  ```\n\n***\n\n### 动手尝试：控制光照效果\n让我们创建一个小型应用程序，使用由 JavaScript 控制的 `box-shadow` 和 `radial-gradient`\
  \ 来在简单的 HTML 页面中控制光照效果。代码如列表 13.1 所示。\n\n**列表 13.1 控制 CSS3 效果**\n\n点击此处查看代码图片\n\n\
  ***\n\n```html\n<!DOCTYPE html>\n<html>\n  <title>Controlling CSS3 Effects</title>\n\
  <style>\n  #div1 {\n    width: 600px;\n    height: 350px;\n    background-color:\
  \ #6699cc;\n  }\n  #div2 {\n    background-color: #aaaaff;\n    width: 80px;\n \
  \   height: 80px;\n    padding: 20px;\n    position: relative;\n    left: 240px;\n\
  \    top: 20px;\n  }\n</style>\n<script>\n  window.onload = function() {\n    document.getElementById(\"\
  btn1\").onclick = function() {\n      document.getElementById(\"div1\").style.background\
  \ = \"radial-gradient(at left, white, #6699cc)\";\n      document.getElementById(\"\
  div2\").style.boxShadow = \"10px 10px 3px #333\";\n    }\n    document.getElementById(\"\
  btn2\").onclick = function() {\n      document.getElementById(\"div1\").style.background\
  \ = \"radial-gradient(at right, white, #6699cc)\";\n      document.getElementById(\"\
  div2\").style.boxShadow = \"-10px 10px 3px #333\";\n    }\n    document.getElementById(\"\
  btn3\").onclick = function() {\n      document.getElementById(\"div1\").style.background\
  \ = \"radial-gradient(at bottom, white, #6699cc)\";\n      document.getElementById(\"\
  div2\").style.boxShadow = \"0px -10px 3px #333\";\n    }\n  }\n</script>\n</head>\n\
  <body>\n  <div id=\"div1\">\n    <div id=\"div2\">\n      LIGHTS:\n      <input\
  \ type=\"button\" id=\"btn1\" value=\"Top Left\">\n      <input type=\"button\"\
  \ id=\"btn2\" value=\"Top Right\">\n      <input type=\"button\" id=\"btn3\" value=\"\
  Bottom\">\n    </div>\n  </div>\n</body>\n</html>\n```\n\n\n\n\n\n你可以在图 13.9 中查看实际效果。\n\
  \n![Image](img/image00440.jpeg)\n\n### 图 13.9 使用 JavaScript 控制 CSS3\n\n注意，这里没有使用图像来创建这些效果——这在\
  \ CSS3 之前是不可能实现的。\n\n***\n\n### 使用厂商前缀设置 CSS3 属性\n\n你已经了解了如何获取 CSS 属性，但当不同的浏览器支持该属性的不同变体（即具有不同的前缀）时，你如何使用\
  \ JavaScript *设置*一个 CSS3 属性呢？\n\n当浏览器支持特定的 CSS 属性时，当你从页面元素请求该属性时，它会返回一个字符串值（如果该属性尚未设置，将返回空字符串）。如果你的浏览器不支持该属性，则会返回\
  \ `undefined`。因此，你可以在设置 CSS3 属性之前轻松地进行测试，以确定支持哪种属性变体。\n\n让我们写一段代码，接收一个可能的 CSS3 属性数组，并返回浏览器支持的那个。\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction getCss3Property(properties){\n    // 遍历所有可能的属性名\n\
  \    for (var i=0; i<properties.length; i++) {\n        // 如果该元素存在此属性\n        if\
  \ (properties[i] in document.documentElement.style) {\n            // 返回关联的字符串\n\
  \            return properties[i];\n        }\n    }\n}\n```\n\n通过这种方式，我们可以返回功能的适当版本。\n\
  \n让我们看看这在本小时之前使用的过渡（transition）效果是如何工作的：\n\n点击此处查看代码图像\n\n```javascript\n// 获取正确的\
  \ CSS3 过渡属性\nvar myTrans = getCss3Property(['transition', 'MozTransition', 'WebkitTransition',\n\
  'msTransition', 'OTransition'])\n// 为 \"link1\" 设置 CSS 过渡\ndocument.getElementById(\"\
  link1\").style[myTrans] = \"background 0.5s ease\" ;\n```\n\n假设我正在使用的 Firefox 版本不支持\
  \ CSS3 的 `transition` 属性，但支持 Mozilla 自己的版本 `MozTransition`（对应于 `-moz-transition`）。\n\
  \n当调用时，`getCss3Property()` 函数开始遍历对应各种厂商类型的过渡属性列表。在对属性 `transition` 返回 `undefined`\
  \ 值（因为浏览器不支持它）后，它将在下一次循环中退出函数，并返回字符串值 `MozTransition`。现在我们已经知道在下一行代码中应该设置哪种版本的属性了。\n\
  \n### 总结\n\n在本小时中，你学习了 CSS3 为 Web 设计带来的一些新功能。你看到了不同的浏览器制造商如何通过自定义前缀来实现新的或实验性的 CSS3\
  \ 特性，并看到了如何使用 JavaScript 访问和设置这些自定义特性。\n\n## 问答\n\n**Q. 目前哪些浏览器支持 CSS3 过渡（transitions）、变换（transforms）和动画（animations）？**\n\
  \n**A.** 在编写期间，所有流行的浏览器都支持 2D 变换，而 3D 变换在 Safari、Chrome/Chromium 和 Firefox 中支持。过渡和\
  \ 3D 变换是在 IE10 中添加的。这些效果大部分都有良好的降级处理，因此使用不支持浏览器的用户仍然可以使用，但看不到带有动画的页面元素。\n\n**Q.\
  \ 为什么几个不同的浏览器厂商都使用 -webkit- 前缀？**\n\n**A.** WebKit 是用于在 浏览器中渲染网页的布局引擎。WebKit 引擎是许多流行浏览器的基础，包括\
  \ Safari、Chrome/Chromium 以及适用于桌面和移动平台的各种浏览器。\n\n## 工作坊\n\n在阅读后续的“答案”部分之前尝试回答所有问题。\n\
  \n#### 测验\n\n**1.** 下列哪项将正确指定从左下角到右上角的线性渐变？\n\n**a.** `linear-gradient(upper right,\
  \ #112244 , #6699cc);`\n\n**b.** `linear-gradient(top right, #112244 , #6699cc);`\n\
  \n**c.** `linear-gradient(to top right, #112244 , #6699cc);`\n\n**2.** 你如何在 JavaScript\
  \ 中引用 `text-shadow` 属性？\n\n**a.** `textShadow`\n\n**b.** `text-Shadow`\n\n**c.**\
  \ `text-shadow`\n\n**3.** 下列哪项将正确渲染多个背景图像，使 image cactus.png 显示在 image desert.jpg\
  \ 之前？\n\n**a.** `background-image: cactus.png, desert.jpg`\n\n**b.** `background-image:\
  \ url(cactus.png), url(desert.jpg);`\n\n**c.** `background-image: url(desert.jpg),\
  \ url(cactus.png);`\n\n#### 答案\n\n**1.** c. `linear-gradient(to top right, #112244\
  \ , #6699cc);`\n\n**2.** a. `textShadow`\n\n**3.** b. `background-image: url(cactus.png),\
  \ url(desert.jpg);`\n\n## 练习题\n\n![Image](img/image00365.jpeg) 使用单个属性 `border-bottom-left-radius`、`border-top-left-radius`、`border-bottom-right-radius`\
  \ 和 `border-bottom-right-radius`（注：此处原文重复），使用 JavaScript 设置 `<div>` 元素的样式为完全椭圆形。（提示：设置半径大小，使得元素的所有边界恰好位于某一个角的半径内。）在你的圆形\
  \ `<div>` 上使用 `getComputedStyle()`，将这些边界半径报告到控制台。\n\n![Image](img/image00365.jpeg)\
  \ 在本小时的“尝试试一下”部分中，你在编写代码时手动设置了阴影方向，以适应模拟的光线方向。你能够写一个 JavaScript 函数，根据检测到的背景渐变值来设置阴影属性吗？\n\
  \n# 第 V 部分：使用 JavaScript 库\n\n## 第 14 节：使用库\n\n***\n\n本小时你将学到：\n\n![Image](img/image00365.jpeg)\
  \ 为什么使用库是一个好主意\n\n![Image](img/image00365.jpeg) 库可以帮助你做的事情\n\n![Image](img/image00365.jpeg)\
  \ 用户社区提供的库扩展\n\n![Image](img/image00365.jpeg) 介绍一些流行的库\n\n![Image](img/image00365.jpeg)\
  \ prototype.js 快速概述\n\n***\n\n库是可重用的 JavaScript 代码集合，它们让你只需通过在程序中添加几行额外代码就能完成复杂的操作。\n\
  \n有许多免费的 JavaScript 库可以帮助你快速开发功能强大的跨浏览器应用程序。\n\n本节将介绍一些较流行的库。\n\n### 为什么要使用库？\n\n\
  你经常会看到 JavaScript 开发者表达观点（主要在互联网上），他们强烈主张编写自己的代码，而不是使用许多可用库之一。常见的反对意见包括：\n\n![Image](img/image00365.jpeg)\
  \ 你永远无法真正了解代码是如何运行的，因为你只是在使用他人的算法和函数。\n\n![Image](img/image00365.jpeg) JavaScript\
  \ 库包含了你永远用不到的代码，但你的用户必须下载它们。\n\n就像软件开发的许多方面一样，这些都是观点问题。我个人认为，在某些某些情况下使用库是有充分理由的：\n\
  \n![Image](img/image00365.jpeg) 为什么要发明别人已经写过的代码？流行的 JavaScript 库通常包含程序员经常需要的抽象——这意味着你可能也经常需要这些函数。最流行的库所产生的数千次下载和大量的在线评论，几乎可以保证它们包含的代码比你自己编写的代码经过更彻底的测试和调试。\n\
  \n![Image](img/image00365.jpeg) 从其他代码人员那里获取灵感。那里有很多*非常聪明*的程序员；借鉴他们的作品并以此改进你自己的工作。\n\
  \n\n\n\n\n![Image](img/image00365.jpeg) 使用编写良好的库确实可以消除许多编写跨浏览器 JavaScript 的烦恼。你无法始终让每个浏览器都处于可用状态，但库的作者以及他们的用户社区会在每个领先浏览器上进行测试。\n\
  \n![Image](img/image00365.jpeg) 大多数库的下载大小并不惊人。在需要极短下载时间的少数情况下，对于大多数你可以在“生产”网站中使用的流行库，都提供了压缩版本。此外，你还可以检查库代码并只提取你需要的部分。\n\
  \n## 库可以做什么？\n\n具体功能取决于涉及的库及其创建者的需求和意图。然而，大多数库都包含某些反复出现的主题：\n\n![Image](img/image00365.jpeg)\
  \ `封装 DOM 方法`——正如你稍后在本节中查看 `prototype.js` 时看到的，JavaScript 库可以提供极具吸引力的写法来选择和管理页面元素及元素组。\n\
  \n![Image](img/image00365.jpeg) `动画`——在第 7 节中，你学习了计时器的使用。计时器可以用于页面元素的动画，但编写此类代码可能很棘手，且生成的代码难以维护。许多流行库将此类操作封装成方便的函数，以跨浏览器的方式仅需几行代码即可让页面界面的部分实现滑动、淡入、抖动、压缩、折叠、吸附和脉冲效果。\n\
  \n![Image](img/image00365.jpeg) `拖放`——真正的跨浏览器拖放一直一直是为所有浏览器编写代码时最棘手的效果之一。库可以让它变得简单。\n\
  \n![Image](img/image00365.jpeg) `Ajax`——使用简单的方法更新页面内容，而无需担心实例化 `XMLHttpRequest`\
  \ 对象以及管理回调和状态码等细碎细节。\n\n## 一些流行库\n\n新的库不断涌现，而另一些库在多年中持续了持续开发。这绝不是一份完整的列表；它只是试图指出当前一些比较流行的参与者。\n\
  \n### Prototype Framework\n\nPrototype Framework ([`www.prototypejs.org`](http://www.prototypejs.org))\
  \ 已经存在多年，目前版本为 1.7。Prototype 的主要优势在于其对 DOM 的扩展和 Ajax 处理，尽管它还有许多锦囊，包括 JSON 支持以及帮助创建和继承类的方法。\n\
  \nPrototype 作为一个独立库分发，也作为大型项目（如 Ruby on Rails 和 `script.aculo.us` JavaScript 库）的一部分。\n\
  \n> 注意\n> 你将在本节的后半部分详细地查看 Prototype Framework，包括一些动手编码。\n\n### Dojo\n\nDojo ([`www.dojotoolkit.org/`](http://www.dojotoolkit.org/))\
  \ 是一个开源工具包，增强了 JavaScript 的功能以简化应用程序和用户界面的构建。它具有从额外的字符串和数学函数到动画和 AJAX 等功能。最新版本不仅支持所有主流桌面浏览器，还支持移动环境，包括\
  \ Apple iOS、Android 以及带有“Dojo Mobile”HTML5 移动 JavaScript 框架的 Blackberry。\n\n编写时，Dojo\
  \ 处于 1.7 版本。\n\n### Yahoo! UI Library\n\nYahoo! UI Library ([`developer.yahoo.com/yui/`](http://developer.yahoo.com/yui/))\
  \ 由 Yahoo! 开发，并根据开源许可提供给大家。它包含了动画、DOM 特性、事件管理以及易用的用户界面元素（如日历和滑块）。\n\n### MooTools\n\
  \nMooTools ([`mootools.net/`](http://mootools.net/)) 是一个紧凑、模块化的 JavaScript 框架，允许你使用易懂、文档良好的\
  \ API（应用程序编程接口）构建强大、灵活且跨浏览器的代码。\n\n### jQuery\n\njQuery ([`jquery.com/`](http://jquery.com/))\
  \ 是一个快速且紧凑的 JavaScript 库，简化了各种开发任务，包括 HTML 文档遍历、事件处理、动画和 Ajax 调用，用于快速开发交互式网站。\n\n\
  > 提示\n> 你将在接两个小时内深入了解 jQuery 库及其相关的用户界面库 jQueryUI。\n\n## 介绍 prototype.js\n\nSam\
  \ Stephenson 的 `prototype.js` 是一个流行的 JavaScript 库，包含一系列开发跨浏览器 JavaScript 应用程序所需的函数，并对\
  \ Ajax 有特定支持。稍后你将看到如何通过该库对 DOM 操作、HTML 表单和 `XMLHttpRequest` 对象的强大支持来简化你的 JavaScript\
  \ 代码。\n\n`prototype.js` 库的最新版本可以从 [`prototypejs.org/`](http://prototypejs.org/)\
  \ 下载。\n\n在你的 Web 应用中包含该库非常简单；只需在 HTML 文档的 `<head>` 部分包含以下行即可：\n\n```html\n<script\
  \ src=\"prototype.js\"></script>\n```\n\n`prototype.js` 库包含了广泛的函数，可以让编写 JavaScript\
  \ 代码更快，并使生成的脚本更整洁、更容易维护。\n\n该库包含了提供常规编程任务快捷方式的通用函数、HTML 表单的包装器、封装 `XMLHttpRequest`\
  \ 对象的对象、简化 DOM 任务的方法和对象等。\n\n让我们来看看这些工具。\n\n> 注意\n> 编写时，prototype.js 版本为 1.7.2。如果你下载了不同的版本，请检查文档以查看你的版本与此处描述的版本之间是否存在差异。\n\
  \n### $() 函数\n\n`$()` 本质上是 `getElementById()` DOM 方法的快捷方式。通常为了返回特定元素的值，你会使用如下表达式：\n\
  \n```javascript\nvar mydata = document.getElementById('someElementID');\n```\n\n\
  `$()`（不像 `getElementById()`）可以接受多个元素 ID 作为参数并返回关联元素的数组。考虑这行代码：\n\n```javascript\n\
  mydataArray = $('id1','id2','id3');\n```\n\n在此示例中：\n\n- `mydataArray[0]` 包含 ID 为\
  \ `id1` 的元素值。\n- `mydataArray[1]` 包含 ID 为 `id2` 的元素值。\n- `mydataArray[2]` 包含 ID\
  \ 为 `id3` 的元素值。\n\n### $F() 函数\n\n当输入元素或其 ID 作为参数传递时， `$F()` 函数返回表单输入字段的值。查看以下 HTML\
  \ 代码段：\n\n```html\n<input type=\"text\" id=\"input1\" name=\"input1\">\n<select\
  \ id=\"input2\" name=\"input2\">\n    <option value=\"0\">Option A</option>\n  \
  \  <option value=\"1\">Option B</option>\n    <option value=\"2\">Option C</option>\n\
  </select>\n```\n\n在这里，我们可以使用 `$F('input1')` 返回文本框中的值，使用 `$F('input2')` 返回选择框中当前选项的值。`$F()`\
  \ 函数在复选框和文本区域输入元素上同样有效，使得无论输入元素类型如何都能轻松返回元素值。\n\n### Form 对象\n\nprototype.js 定义了一个\
  \ `Form` 对象，具有多个实用的方法来简化 HTML 表单操作。\n\n\n\n\n\n你可以通过调用 `getElements()` 方法返回一个表单输入字段的数组：\n\
  \n点击此处查看代码图像\n\n```javascript\ninputs = Form.getElements('thisform');\n```\n\n`serialize()`\
  \ 方法允许将输入名称和值格式化为兼容 URL 的列表：\n\n点击此处查看代码图像\n\n```javascript\ninputlist = Form.serialize('thisform');\n\
  ```\n\n使用上一行代码，变量 `inputlist` 现在将包含一个序列化的参数和值对的字符串：\n\n点击此处查看代码图像\n\n```javascript\n\
  field1=value1&field2=value2&field3=value3...\n```\n\n`Form.disable('thisform')`\
  \ 和 `Form.enable('thisform')` 的作用分别与其名称完全一致。\n\n***\n\n## 尝试自己一下：使用 getElements()\
  \ 方法\n\n让我们使用 `getElements()` 方法收集一些关于 HTML 表单的信息。正如我之前提到的，该方法返回一个包含特定表单元素的数组。\n\
  \n以下是我们简单表单的代码：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n   <title>Prototype.js\
  \ example</title>\n</head>\n<body>\n    <form id=\"exampleForm\" action=\"#\" onsubmit=\"\
  return false\">\n        Username: <input type=\"text\" name=\"username\" /><br/>\n\
  \        Telephone: <input type=\"text\" name=\"telephone\" /><br/>\n        Message:\
  \ <input type=\"text\" name=\"message\" /><br/>\n    </form>\n    <input type=\"\
  button\" value=\"Result\" onclick=\"showFormFields();\"/>\n</body>\n</html>\n```\n\
  \n对于这个示例中，我们只有三个文本字段，如图 14.1 所示。\n\n![Image](img/image00441.jpeg)\n\n**图 14.1**\
  \ 简单的 HTML 表单\n\n在 HTML 的头部部分引入 prototype.js 后，我们需要编写一个函数，在点击表单按钮时执行。该函数将使用 `getElements()`\
  \ 方法构建一个表单元素数组。然后，它将通过 JavaScript 框从表单中读回名称和输入的值。\n\n代码如列表 14.1 所示。\n\n**列表 14.1\
  \ Prototype.js 示例表单**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>Prototype.js example</title>\n    <script src=\"prototype.js\"></script>\n\
  \    <script>\n    function showFormFields() {\n        var form = $('exampleForm');\n\
  \        var message = '';\n        var fields = form.getElements();\n        for(var\
  \ x=0; x<fields.length;x++)  {\n            message += \"Field Name : \" + fields[x].name\
  \ + \" Value : \" + fields[x].value + \"\\n\";\n        }\n        alert(message);\n\
  \    }\n    </script>\n</head>\n<body>\n  <form id=\"exampleForm\" action=\"#\"\
  \ onsubmit=\"return false\">\n        Username: <input type=\"text\" name=\"username\"\
  \ /><br/>\n        Telephone: <input type=\"text\" name=\"telephone\" /><br/>\n\
  \        Message: <input type=\"text\" name=\"message\" /><br/>\n  </form>\n  <input\
  \ type=\"button\" value=\"Result\" onclick=\"showFormFields();\"/>\n</body>\n</html>\n\
  ```\n\n在图 14.2 中，你可以看到运行示例并输入样本数据后的结果。\n\n![Image](img/image00442.jpeg)\n\n**图 14.2**\
  \ 使用 `getElements()` 获取的表单信息\n\n***\n\n### 总结\n\n在许多情况下，使用库编写 JavaScript 可以变得简单得多。此类库将许多常用的对象和方法封装成更易于用户的形式；你不再需要记住跨浏览器的方法，例如为了添加或移除事件监听器或访问表单元素。在这一小时里，你学习了一些比较流行的\
  \ JavaScript 库。\n\n## 问答\n\n**Q. 如何将第三方 JavaScript 库包含到我的页面中？**\n\n**A.** 过程根据库的不同略有差异。通常只需将一个或多个外部\
  \ .js 文件包含在网页页的 `<head>` 部分即可。具体细节请参阅所选库提供的文档。\n\n**Q. 我可以在同一个脚本中使用多个一个第三方库吗？**\n\
  \n**A.** 是的，理论上可以：如果这些库编写得良好且设计为互不干扰，那么合并它们就没有问题。在实践中，这取决于你需要的库以及它们是如何编写的。\n\n##\
  \ 工作坊\n\n在阅读后续的“答案”之前，尝试回答所有问题。\n\n### 测验\n\n**1.** 下列对象中哪个*不是* JavaScript 库？\n\n\
  **a.** MooTools\n**b.** Prototype\n**c.** Ajax\n\n**2.** 你如何自己扩展 jQuery？\n\n**a.**\
  \ jQuery 无法扩展。\n**b.** 通过编写服务器端脚本。\n**c.** 通过编写插件，或使用预先写的插件。\n\n**3.** script.aculo.us\
  \ 还采用了什么其他的 JavaScript 第三方库？\n\n**a.** Prototype\n**b.** Dojo\n**c.** jQuery\n\n\
  #### 答案\n\n**1.** c. Ajax 是一种编程技术，允许你的脚本使用托管在你服务器上的资源。有很多库可以帮助你使用 Ajax 功能，但 Ajax\
  \ 本身并不是库。\n\n**2.** c. jQuery 有一种详尽的方法来编写和使用插件。\n\n**3.** a. Script.aculo.us 使用\
  \ prototype.js 库。\n\n## 练习\n\n![Image](img/image00365.jpeg) 使用 Prototype 库编写一个简单的脚本，或者使用\
  \ Prototype 网站 [`www.prototypejs.org`](http://www.prototypejs.org) 上的样本脚本。\n\n![Image](img/image00365.jpeg)\
  \ 访问 Script.aculo.us 页面 [`script.aculo.us/`](http://script.aculo.us/) 并查看该库提供的完整效果列表。\n\
  \n## 第 15 小时。深入了解 jQuery\n\n***\n\n你将在这一小时学到：\n\n![Image](img/image00365.jpeg) 在你的页面中引入\
  \ jQuery\n![Image](img/image00365.jpeg) jQuery 的 `$(document).ready` 处理程序\n![Image](img/image00365.jpeg)\
  \ 选择页面元素\n![Image](img/image00365.jpeg) 操作 HTML 内容\n![Image](img/image00365.jpeg)\
  \ 显示和隐藏元素\n![Image](img/image00365.jpeg) 元素动画\n![Image](img/image00365.jpeg) 命令链式\n\
  ![Image](img/image00365.jpeg) 处理事件\n![Image](img/image00365.jpeg) 使用 jQuery 进行 Ajax\
  \ 应用\n\n***\n\n有许多 JavaScript 库可用，但 jQuery 无疑是最流行的且可扩展的。大量的开发者为 jQuery 贡献开源插件，你可以为任何可能的应用找到合适的插件。广泛的插件和简单的语法使得\
  \ jQuery 是一个非常棒的库。在这一小时中，你学习了 jQuery 的基础知识并体验了它的强大。\n\n### 在你的页面中引入 jQuery\n\n在使用\
  \ jQuery 之前，你需要将其包含在你的页面中。有两种主要方法，下文所示。\n\n#### 下载 jQuery\n\n你可以从官方网站 [`docs.jquery.com/Downloading_jQuery`](http://docs.jquery.com/Downloading_jQuery)\
  \ 下载 jQuery，在该处你可以找到压缩版本和未压缩版本的代码。压缩版本用于你的在线页面，因为它已压缩到最小文件大小以便最快速度下载。\n\n对于开发目的，请选择未压缩版本。得益于格式良好且注释过的源码，你可以阅读\
  \ jQuery 代码查看它是如何工作的。\n\n你需要使用 `<script>` 标签将 jQuery 库包含在页面的头部部分。简单的方法是将下载的 jquery.js\
  \ 文件放置与要使用的页面相同的目录中，然后按所示引用它：\n\n```html\n<script src=\"jquery-1.11.2.js\"></script>\n\
  ```\n\n\n\n\n\n当然，如果你将 `jQuery` 放在另一个目录中，你必须更改 `src` 属性值中的（相对或绝对）路径，以反映文件的所在位置。\n\
  \n## 注意事项\n\n实际文件名取决于你下载的版本。在编写本文时，`1.11.2` 是当前的发布版本。\n\n## 使用远程版本\n\n你不需要自己下载并托管\
  \ `jQuery`，可以从所谓的内容分发网络（CDN）中引入它。除了可以节省下载 `jQuery` 库的开销外，使用 CDN 版本还有一个进一步的优势：当用户访问你的页面且浏览器请求\
  \ `jQuery` 时，该文件很可能已经存在于他们的浏览器缓存中了。此外，CDN 通常会确保从从地理位置上距离用户最近的服务器提供文件，从而进一步缩短加载时间。\n\
  \n`jQuery` 官方网站目前列出了以下 CDN：\n\n![Image](img/image00365.jpeg) **Google Ajax API CDN**—[`ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js`](http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js)\n\
  \n![Image](img/image00365.jpeg) **Microsoft CDN**—[`ajax.aspnetcdn.com/ajax/jQuery/jquery-1.11.2.min.js`](http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.11.2.min.js)\n\
  \n![Image](img/image00365.jpeg) **jQuery CDN**—[`code.jquery.com/jquery-1.11.2.min.js`](http://code.jquery.com/jquery-1.11.2.min.js)\
  \ (压缩版), [`code.jquery.com/jquery-1.11.2.js`](http://code.jquery.com/jquery-1.11.2.js)\
  \ (源码版)\n\n然后你可以修改 `<script>` 标签以适应选择的 CDN，例如：\n\n点击此处查看代码图片\n\n```\n<script src=\"\
  https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js\"></script>\n\
  ```\n\n除非你有特殊理由要自己托管 `jQuery`，否则通常这是最好的方法。\n\n### 提示\n\n如果你想确保代码始终使用最新版本的 `jQuery`，只需链接到\
  \ [`code.jquery.com/jquery-latest.min.js`](http://code.jquery.com/jquery-latest.min.js)。\n\
  \n## jQuery 的 $(document).ready 处理器\n\n在本书的多个地方，你使用了 `window.onload` 处理器。`jQuery`\
  \ 有它自己的等效方法：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n  \
  \  // jQuery 代码写在这里\n});\n```\n\n你编写几乎所有的 `jQuery` 代码都将在这样的语句内部执行。\n\n与 `window.onload`\
  \ 类似，它主要实现了两个功能：\n\n![Image](img/image00365.jpeg) 它确保代码在 DOM 可用之前不运行——也就是说，代码可能尝试访问的任何元素已经存在——这样你的代码就不会返回任何错误。\n\
  \n![Image](img/image00365.jpeg) 它通过将代码与语义层（HTML）和表现层（CSS）分离，有助于使代码具有非侵入性。\n\n不过，`jQuery`\
  \ 版本相比 `window.onload` 事件有一个优势：它不会阻塞代码执行，直到整个页面加载完成（像 `window.onload` 那样）。使用 `jQuery`\
  \ 的 $(document).ready，代码在 DOM 树构建完成后就会开始执行，而无需等待所有图像和其他资源加载完成，稍微提升了性能。\n\n## 选择页面元素\n\
  \n`jQuery` 允许你通过将元素封装在 `jQuery` 包装器 `$(\"\")` 中来选择 HTML 中的元素元素。\n\n### 提示\n\n你也可以在包装函数中使用单引号，`$('')`。\n\
  \n以下是一些使用 `$` 操作符封装的页面元素集合示例：\n\n点击此处查看代码图片\n\n```javascript\n$(\"span\"); // 所有\
  \ HTML span 元素\n$(\"#elem\"); // id 为 \"elem\" 的 HTML 元素\n$(\".classname\"); //\
  \ 类名为 \"classname\" 的 HTML 元素\n$(\"div#elem\"); // ID 为 \"elem\" 的 <div> 元素\n$(\"\
  ul li a.menu\"); // 嵌套在列表项中类名为 \"menu\" 的锚点\n$(\"p > span\"); // 段落的直接子元素 span\n\
  $(\"input[type=password]\"); // 具有指定类型的 input\n$(\"p:first\"); // 页面上的第一个段落\n$(\"\
  p:even\"); // 所有偶数段落\n```\n\nDOM 和 CSS 选择器就介绍到这里。但 `jQuery` 还有它自己的自定义选择器，例如以下：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\":header\"); // 头部元素 (h1 到 h6)\n$(\":button\"\
  ); // 任何按钮元素（inputs 或 buttons）\n$(\":radio\"); // 单选按钮\n$(\":checkbox\"); // 复选框\n\
  $(\":checked\"); // 选中的复选框或单选按钮\n```\n\n前面的示例所示 `jQuery` 语句每个返回一个对象，该对象包含由包装函数内部表达式所指定的\
  \ DOM 元素数组。请注意，在之前的代码行中，你没有指定任何操作；你只是从 DOM 中获取所需的元素。在接下来的章节中，你将学习如何处理这些选定的元素。\n\n\
  ## 处理 HTML 内容\n\n`jQuery` 最实用的节省时间技巧之一是操作页面元素的内容。`html()` 和 `text()` 方法允许你获取和设置通过前面的语句选择的任何元素的内容，而\
  \ `attr()` 则允许获取和设置单个元素属性的值。让我们来看一些示例。\n\n### html()\n\n`html()` 方法获取任何元素或元素集合的\
  \ HTML。它的工作原理类似于 JavaScript 的 `innerHTML`：\n\n点击此处查看代码图片\n\n```javascript\nvar htmlContent\
  \ = $(\"#elem\").html();\n/* 变量 htmlContent 现在包含 id 为 \"elem\" 的\n页面元素内部的所有 HTML\
  \ \n（包括文本） */\n```\n\n使用类似的语法，你可以设置指定元素或元素集合的 HTML 内容：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#elem\").html(\"<p>这里有一些新内容。</p>\");\n/* id 为 \"elem\" 的页面元素\n其 HTML 内容已被替换*/\n\
  ```\n\n### text()\n\n如果你只需要元素或元素集合的文本内容而不包含 HTML，可以使用 `text()`：\n\n点击此处查看代码图片\n\n\
  ```javascript\nvar textContent = $(\"#elem\").text();\n/* 变量 textContent 包含 id 为\
  \ \"elem\" 的\n页面元素内部的所有文本 \n（但不包含 HTML）内容 */\n```\n\n再次，你可以更改指定元素（或元素）的文本内容：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(\"#elem\").text(\"这里有一些新内容.\");\n/* id 为 \"elem\"\
  \ 的页面元素\n其文本内容已被替换*/\n```\n\n如果你想向元素追加内容而不是替换它，可以使用以下方法：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#elem\").append(\"<p>这里有一些新内容。</p>\");\n/* 保留当前内容，但在末尾\n添加\n新内容 */\n```\n\n\
  同样地：\n\n点击此处查看代码图片\n\n```javascript\n$(\"div\").append(\"<p>这里有一些新内容。</p>\");\n\
  /* 为页面上所有的\n<div> 元素\n添加\n相同的内容 */\n```\n\n### attr()\n\n当传递单个参数时，`attr()` 方法获取指定属性的值：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar title = $(\"#elem\").attr(\"title\");\n```\n\n\
  如果应用于一组元素，它仅返回匹配集合中第一个元素的属性值。\n\n你也可以向 `attr()` 传递第二个参数来设置属性值：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"#elem\").attr(\"title\", \"这是新标题\");\n```\n\n## 显示和隐藏元素\n\n使用原生\
  \ JavaScript，显示和隐藏页面元素通常意味着操作元素 `style` 对象中 `display` 和 `visibility` 属性的值。虽然这种方法可行，但它会导致非常长的代码行：\n\
  \n点击此处查看代码图片\n\n```javascript\ndocument.getElementById(\"elem\").style.visibility\
  \ = 'visible';\n```\n\n\n\n\n\n你可以使用 jQuery 的 `show()` 和 `hide()` 方法来用较少的代码完成这些任务。正如你在下面的代码示例所示，jQuery\
  \ 方法还提供了一些实用的额外功能。\n\n### show()\n\n让元素或一组元素可见的简单方法是调用 `show()` 方法：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"div\").show(); // 让所有 <div> 元素可见\n```\n\n然而，你也可以添加一些额外的参数来让过渡效果更加丰富。\n\
  \n在下面的示例中，第一个参数 `\"fast\"` 决定了过渡的速度。作为 `\"fast\"` 或 `\"slow\"` 的替代方案，jQuery 乐意接受一个毫秒数作为此参数，即过渡所需的持续时间。如果没有设置任何值，过渡将立即发生，没有动画效果。\n\
  \n> **提示**\n> 值 `\"slow\"` 对应于 600ms，而 `\"fast\"` 等同于 200ms。\n\n第二个参数是一个作为回调运行的函数；也就是说，它会在过渡完成后执行执行一次：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").show(\"fast\", function() {\n    //\
  \ 元素显示后执行某些操作\n});\n```\n\n在这里我们使用了匿名函数，但具名函数同样可以工作。\n\n### hide()\n\n当然，`hide()`\
  \ 方法是 `show()` 的完全相反操作，允许你使用你在 `hide()` 中看到的相同可选参数来使页面元素不可见：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#elem\").hide(\"slow\", function() {\n    // 元素隐藏后执行某些操作\n});\n```\n\n## toggle()\n\
  \n`toggle()` 方法更改元素或元素集合的当前状态；它会将集合中任何当前隐藏的元素变为可见，并隐藏任何当前正在显示的元素。`toggle()` 同样可以使用相同的可选持续时间和回调函数参数。\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").toggle(1000, function() {\n    // 元素显示/隐藏后执行某些操作\n\
  });\n```\n\n> **提示**\n> 记住 `show()`、`hide()` 和 `toggle()` 方法可以应用于元素集合，因此集合中的元素将同时出现或消失。\n\
  \n## 元素动画\n\njQuery 提供的某些标准效果是非常强大的。页面元素的动画曾经必须通过使用 JavaScript 定时器编写复杂的手动编码程序来实现。现在，这些功能被整齐地封装在几个\
  \ jQuery 方法中，你可以为你的元素或元素集合调用它们。\n\n### 淡入淡出 (Fading)\n\n你可以让元素淡入或淡出，并可选设置过渡持续时间和添加回调函数。\n\
  \n淡出至不可见：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").fadeOut(\"slow\", function()\
  \ {\n    // 在 fadeOut 执行完毕后执行某些操作\n});\n```\n\n或者淡入：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#elem\").fadeIn(500, function() {\n    // 在 fadeIn 执行完毕后执行某些操作\n});\n```\n\n\
  你也可以让元素仅部分淡入或淡出：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").fadeTo(3000, 0.5,\
  \ function() {\n    // 在淡入效果完成后执行某些操作\n});\n```\n\n第二个参数（此处设置为 0.5）代表目标透明度（opacity）。它的值原理与\
  \ CSS 中设置不透明度值类似。无论在调用方法之前不透明度值是多少，元素将一直执行动画直到达到参数中指定的值。\n\n### 滑动 (Sliding)\n\n\
  你可以让元素或元素集合向上或向下滑动。jQuery 用于滑动的元素的方法是你刚刚看到的淡入淡出方法的直接推论，它们的参数遵循完全相同的规则：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#elem\").slideDown(150, function() {\n    // 在 slideDown 执行完毕后执行某些操作\n\
  });\n```\n\n以及向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").slideUp(\"slow\"\
  , function() {\n    // 在 slideUp 执行完毕后执行某些操作\n});\n```\n\n如果需要根据元素的当前状态向上或向下滑动元素，jQuery\
  \ 还提供了一个方便的 `slideToggle()` 方法：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").slideToggle(1000,\
  \ function() {\n    // 在向上/向下滑动完毕后执行某些操作\n});\n```\n\n### 动画 (Animation)\n\n要对元素执行动画，你可以通过使用\
  \ jQuery 指定该项目应该应用的 CSS 样式。jQuery 将强制应用新样式，但可以渐进地应用（而不是像纯 CSS/JavaScript 那样立即应用），从而创建动画效果。\n\
  \n你可以对广泛的数值型 CSS 属性使用 `animate()`。在示例示例中，元素的宽度和高度被动画化为 400 x 500 像素的大小；一旦动画完成，将使用回调函数将元素淡出至不可见：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").animate(\n    {\n        width: \"400px\"\
  ,\n        height: \"500px\"\n    }, 1500, function() {\n        $(this).fadeOut(\"\
  slow\");\n    }\n);\n```\n\n### 命令链 (Command Chaining)\n\njQuery 的另一个方便的特性是，大多数\
  \ jQuery 方法返回一个 jQuery 对象，该对象随后可以在你对另一个方法的调用中使用。你可以这样组合之前的两个示例：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"#elem\").fadeOut().fadeIn();\n```\n\n前面的代码将把所有选中的元素淡出，然后将它们重新淡入。你可以链式调的数量是任意的，允许多个命令连续作用在同一元素集合上：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").text(\"Hello from jQuery\").fadeOut().fadeIn();\n\
  ```\n\n### 动手尝试：一个简单的 jQuery 动画\n\n让我们利用目前学到的一些知识，用 jQuery 做一个简单的动画练习。\n\n你的 HTML\
  \ 页面最初将显示一个通过 CSS 设置的 `<div>` 元素，但没有内容。以下是页面的 HTML：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <style>\n        #animateMe {\n            position:\
  \ absolute;\n            width: 100px;\n            height: 400px;\n           \
  \ top: 100px;\n            left: 100px;\n            border: 2px solid black;\n\
  \            background-color: red;\n            padding: 20px;\n        }\n   \
  \ </style>\n</head>\n<body>\n    <div id=\"animateMe\"></div>\n</body>\n</html>\n\
  ```\n\n首先，你需要在页面中添加一个 `<script>` 元素来链接该库——在这种情况下，通过 CDN：\n\n点击此处查看代码图片\n\n```html\n\
  <script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n```\n\n要的第一的任务是使用\
  \ jQuery 的 `text()` 方法向 `<div>` 中添加一些文本：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#animateMe\"\
  ).text(\"Changing shape...\")\n```\n\n然后你可以调用 `animate()` 来改变元素的大小（从而改变形状）：\n\n\
  ```javascript\n$(\"#animateMe\").animate(\n    {\n        width: \"400px\",\n  \
  \      height: \"200px\"\n    }, 5000, function() {\n        // 回调函数\n    }\n);\n\
  ```\n\n当然，由于 `text()` 和 `animate()` 方法作用于同一个元素，你可以使用命令链将这两个者连接起来：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#animateMe\").text(\"Changing shape...\").animate(\n    {\n\
  \        width: \"400px\",\n        height: \"200px\"\n    }, 5000, function() {\n\
  \        // 回调函数\n    }\n);\n```\n\n\n\n\n当动画完成后，让我们更改元素中的文本，然后让该元素缓慢消失。我们将这两个命令链联起来，并使用上一次调用\
  \ `animate()` 方法的回调函数，在动画完成后执行这些额外命令：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#animateMe\"\
  ).text(\"Changing shape...\").animate(\n    {\n        width: \"400px\",\n     \
  \   height: \"200px\"\n    }, 5000, function() {\n        $(this).text(\"Fading\
  \ away ...\").fadeOut(4000);\n    }\n);\n```\n\n注意 `this` 的使用。因为你当前正在对 `$(\"#animateMe\"\
  )` 父元素执行方法，因此在代码块内部使用 `this` 指的就是该父元素。\n\n最后，你需要在 DOM 准备就绪时通过在 jQuery 的 `$(document).ready`\
  \ 处理程序中封装代码来执行所有操作。\n\n完整的列表如 Listing 15.1 所示。使用你的文本编辑器创建此页面，并将其加载到浏览器中。\n\n* *\
  \ *\n\n### 注意\n\n要使用存储在 CDN 上的 jQuery 版本，你的计算机需要连接到互联网。如果你没有 Internet 连接，则需要使用本地本地副本来尝试这些示例。\n\
  \n* * *\n\n### 列表 15.1 一个简单的 jQuery 动画\n\n点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <style>\n        #animateMe {\n            position:absolute;\n\
  \            width: 100px;\n            height: 400px;\n            top: 100px;\n\
  \            left: 100px;\n            border: 2px solid black;\n            background-color:\
  \ red;\n            padding: 20px;\n        }\n    </style>\n    <script src=\"\
  http://code.jquery.com/jquery-latest.min.js\"></script>\n    <script>\n        $(document).ready(function()\
  \ {\n            $(\"#animateMe\").text(\"Changing shape...\").animate(\n      \
  \          {\n                    width: \"400px\",\n                    height:\
  \ \"200px\"\n                }, 5000, function() {\n                    $(this).text(\"\
  Fading away ...\").fadeOut(4000);\n                }\n            );\n        });\n\
  \    </script>\n</head>\n<body>\n    <div id=\"animateMe\"></div>\n</body>\n</html>\n\
  ```\n\n* * *\n\n当页面加载后，你应该能看到一个带有黑色边框的红色 `<div>` 元素，其中包含“Changing shape....”字样。一旦动画到新的宽度和高度，文字将变为“Fading\
  \ away...,”，并且元素将淡出消失。图 15.1 显示了动画的过程。\n\n![Image](img/image00443.jpeg)\n\n**图 15.1**\
  \ 一个简单的 jQuery 动画\n\n* * *\n\n### 处理事件\n\n在 jQuery 中，你可以通过多种方式向元素或元素集合附加事件处理器。首先，你可以像这样直接添加事件处理器：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"a\").click(function() {\n    // 当任何锚点元素被点击时执行此代码\n\
  });\n```\n\n或者，你也可以使用命名函数，如下所示：\n\n点击此处查看代码图像\n\n```javascript\nfunction hello()\
  \ {\n    alert(\"Hello from jQuery\");\n}\n$(\"a\").click(hello);\n```\n\n在这两个示例中，当锚点被点击时将执行该函数。你在\
  \ jQuery 中可能使用的其他常用事件包括 `blur`、`focus`、`hover`、`keypress`、`change`、`mousemove`、`resize`、`scroll`、`submit`\
  \ 和 `select`。\n\n为了帮助你添加多个事件处理器，jQuery 以跨浏览器的方式封装了 JavaScript 方法 `attachEvent` 和\
  \ `addEventListener`：\n\n```javascript\n$(\"a\").on('click', hello);\n```\n\n`on()`\
  \ 方法可以用于附加到原始 HTML 页面中元素，也可以附加到动态添加到 DOM 的元素。\n\n* * *\n\n### 注意\n\n`on()` 方法在 jQuery\
  \ 1.7 中引入，是以前几个事件处理方法的推荐替代方案**，包括 `bind()`、`delegate()` 和 `live()`。请查看 jQuery 文档以获取完整细节。\n\
  \n* * *\n\n### 总结\n\njQuery 是一个功能丰富且非常流行的 JavaScript 库，具有易于使用的 API，并可以在大多数流行的浏览器中运行。在这一小时里，你对它进行了深入了解。\n\
  \n\n\n 标签内似乎不完整（在结尾处中断了），我根据您提供的格式和要求，为您翻译了已提供的文本部分。如下：\n\n[content]\n\n![Image](img/image00365.jpeg)\
