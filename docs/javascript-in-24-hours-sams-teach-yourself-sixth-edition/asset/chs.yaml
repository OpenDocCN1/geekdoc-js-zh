  \n## 第 17 节 使用 jQuery 的 Ajax\n\n* *\n\n本节将学到：\n\n![Image](img/image00365.jpeg) 什么是\
  \ Ajax 以及它如何帮助用户体验\n\n![Image](img/image00365.jpeg) 如何用原生 JavaScript 实现 Ajax\n\n\
  ![Image](img/image00365.jpeg) 如何使用 jQuery 流畅且简单地实现 Ajax\n\n* * *\n\nJavaScript 是一种客户端脚本语言，你到为止用过的所有示例都完全限于客户端编码。Ajax\
  \ 允许你在后台与服务器通信，并在页面上显示结果，而无需执行页面刷新。这使你能够创建出与用户交互更流畅的页面。\n\n在这一节中，你将学习支撑 Ajax 的技术基础，以及你如何使用\
  \ jQuery 让这整个过程变得流畅而简单。\n\n### Ajax 剖析\n\n到为止，我们只讨论了传统的基于页面的网站用户界面模型。\n\n当你与此类网站交互时，包含文本、图像、数据输入表单等的单个页面会逐个呈现给你。在导航到下一个页面之前，必须单独处理每个页面。\n\
  \n例如，你可能会完成表单的数据输入字段，根据需要反复编辑和重新输入条目，而知道在表单最终提交之前数据不会被发送到服务器。\n\n这种交互总结在图 17.1 中。\n\
  \n![Image](img/image00451.jpeg)\n\n**图 17.1** 传统的客户端-服务器交互\n\n在你提交表单或点击导航链接后，你必须等待浏览器屏幕刷新以显示由服务器交付的新或修订的页面。\n\
  \n遗憾的是，使用这种模型构建的界面有很多缺点。首先，在加载每个新页面或修订页面时，会有明显的延迟。这中断了我们作为用户所感知的应用程序“流”。\n\n此外，每次都必须加载*整个*页面，即使其大部分内容与上一个页面相同。网站上许多页面共有的项目（如页眉、页脚和导航部分）可能占页面中所含数据的很大比例。\n\
  \n这种不必要的数据下载浪费了带宽，并进一步加剧了加载每个新页面的延迟。\n\n上述问题的共同影响是，提供的用户体验远不如大多数桌面应用程序所提供的体验。在桌面上，你期望程序的显示内容保持可见，且界面元素继续响应你的指令，而计算过程在后台静静地进行。\n\
  \n#### 引入 Ajax\n\nAjax 允许你在你的 Web 应用程序界面中添加一些在桌面应用程序中更常见的功能。为了实现这一点，Ajax 在网页和服务器之间建立了一个额外的处理“层”。\n\
  \n这一层通常通常被称为 Ajax 引擎或 Ajax 框架，它拦截来自用户的请求，并在后台静静、不经干扰且*异步*地处理服务器通信。这意味着服务器请求和响应不再需要与特定的用户动作同步，而可以在用户方便以及应用程序正确运行的任何时间发生。浏览器不会冻结并等待服务器完成最后一个请求，而是让你在当前页面中继续滚动、点击和打字。\n\
  \n更新页面元素以反映从服务器接收的修订信息也由 Ajax 负责，这会在页面继续被使用期间动态地发生。\n\n图 17.2 表示了这些交互是如何发生的。\n\n\
  ![Image](img/image00452.jpeg)\n\n**图 17.2** Ajax 客户端-服务器交互\n\n#### XMLHttpRequest\
  \ 对象\n\n当你点击超链接或提交 HTML 表单时，你向服务器发送 HTTP 请求，服务器通过向你提供新或修订的页面来响应。然而，为了让你的 Web 应用程序异步工作，你必须有一种方法向服务器发送\
  \ HTTP 请求，而无需关联显示新页请求。\n\n我们可以通过 `XMLHttpRequest` 对象来实现。这个 JavaScript 对象能够连接到服务器并发布\
  \ HTTP 请求，而不需要关联页面加载。\n\n* * *\n\n提示\n\n作为安全措施，`XMLHttpRequest` 对象通常只能调用与调用页面相同域内的\
  \ URL，不能直接调用远程服务器。\n\n* * *\n\n#### 不同浏览器的不同规则\n\n\n\n由于你无法预知用户使用的是什么浏览器、版本或操作系统，你必须让你的代码动态调整其行为，以确保对象实例能够成功创建。\n\
  \n对于大多数支持 `XMLHttpRequest` 作为原生对象的浏览器（Firefox、Opera 以及其他浏览器，以及后续版本的 Internet Explorer），创建该对象的实例是简单的。下行代码创建了一个名为\
  \ `request` 的 `XMLHttpRequest` 对象：\n\n点击此处查看代码图像\n\n```javascript\nvar request =\
  \ new XMLHttpRequest();\n```\n\n要在某些较早版本的 Microsoft Internet Explorer 中实现等的效果，你需要创建一个\
  \ `ActiveX` 对象。以下是一个示例：\n\n点击此处查看代码图像\n\n```javascript\nvar request = new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n```\n\n再次，这为你的新对象分配了名称 `request`。\n\n为了让情况变得稍微复杂一点，某些较早版本的\
  \ Internet Explorer 安装了不同版本的 Microsoft XML 解析器；在这些情况下，你需要使用以下指令：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar request = new ActiveXObject(\"Msxml2.XMLHTTP\");\n```\n\n##\
  \ 方法与属性\n\n现在你已经创建了 `XMLHttpRequest` 对象的实例，让我们参考表 17.1 来看该对象的一些属性和方法。\n\n![Image](img/image00453.jpeg)\n\
  \n**表 17.1 XMLHttpRequest 对象与方法**\n\n在接下来的课程中，我们将检查这些方法和属性如何用于构建 Ajax 应用的基础函数。\n\
  \n### 与服务器通信\n\n在传统的网页模式中，当你通过超链接或表单提交服务器请求时，服务器接收该请求，执行任何所需的服务器端处理，随后向你提供与你的操作对应的新页面。\n\
  \n在此处理发生期间，你的用户界面会被冻结。当服务器完成任务时，你会通过新页面的出现得知。\n\n然而，对于异步服务器请求，此类通信是在后台进行的，且请求的完成并不与刷新或加载新页面同步。因此，你必须进行其他安排来获取请求的进度。\n\
  \n`XMLHttpRequest` 对象拥有一个方便的属性来报告服务器请求的进度。你可以使用 JavaScript 语句来检查服务器完成任务的时间点，并且结果供你使用。\n\
  \n因此，你的 Ajax 库必须包含一个监控请求状态的程序。我们将在稍后详细介绍这一点。\n\n### 服务器端发生了什么？\n\n对于服务器端脚本来说，`XMLHttpRequest`\
  \ 对象的通信只是另一个 HTTP 请求。Ajax 应用并不关心服务器存在什么语言或环境；只要客户端 Ajax 层接收到及时且格式正确的 HTTP 响应，一切运行正常。\n\
  \n### 处理服务器响应\n\n一旦异步请求成功完成，你就可以使用服务器返回的信息。\n\nAjax 允许以多种格式返回信息，包括 ASCII 文本和 XML\
  \ 数据。根据应用程序的性质，你可以在当前页面中翻译或处理这些信息。\n\n### 有更简单的方法吗？\n\n幸运的是，有很多 JavaScript 库可以将这些复杂的程序封装成易用的函数和方法。在本课程的剩余部分，你将看到\
  \ jQuery 库让编写 Ajax 变得简单。\n\n## 使用 jQuery 实现 Ajax\n\n你可能已经意识到从零编写 Ajax 可能很麻烦。幸运的是，jQuery\
  \ 为你解决了这个问题，让你只需几行代码即可编写 Ajax 程序。\n\n有很多 jQuery 方法可以向服务器执行 Ajax 调用；这里描述了常用的方法。\n\
  \n#### load()\n\n当你只是想从服务器获取文档并显示在页面元素中，`load()` 可能就是需要的。以下代码片段获取 `newContent.html`\
  \ 并将其内容添加到 `id=\"elem\"` 的元素中：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n\
  \    $(\"#elem\").load(\"newContent.html\");\n});\n```\n\n一个巧妙的技巧是在 URL 后面传递选择器，仅获取对应选择器的页面部分：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"#elem\").load(\"newContent.html\
  \ #info\");\n});\n```\n\n你在 URL 后添加了 jQuery 选择器，会导致 jQuery 返回选择器指定的内容；此处 ID 为 `info`\
  \ 的元素。当 `load()` 提供的控制有限时，jQuery 提供了发送 `GET` 和 `POST` 请求的方法。\n\n#### get() 和 post()\n\
  \n这两个方法相似，仅请求类型不同。你不需要选择 jQuery 对象（如页面元素或元素集合）；相反，你可以直接使用 `$.get()` 或 `$.post()`\
  \ 调用 `get()` 或 `post()`。在最简单的形式下，`get()` 或 `post()` 方法接受一个参数：目标 URL。\n\n你经常会想要使用\
  \ `get()` 或 `post()` 向服务器发送数据。此类数据以编码字符串对的形式发送。\n\n提示\n\n如果你从表单字段收集数据，jQuery 提供了方便的\
  \ `serialize()` 方法来汇表单数据：\n\n点击此处查看代码图像\n\n```javascript\nvar formdata = $('#form1').serialize();\n\
  ```\n\n大多数情况下，你想对返回的数据做些什么。为了这样做，你传递一个回调函数作为参数：\n\n点击此处查看代码图像\n\n```javascript\n\
  $.get(\"serverScript.php\",\n    {param1: \"value1\", param2: \"value2\"},\n   \
  \ function(data) {\n        alert(\"Server responded: \" + data);\n    });\n```\n\
  \n`post()` 的语法本质上相同：\n\n点击此处查看代码图像\n\n```javascript\n$.post(\"serverScript.php\"\
  ,\n    {param1: \"value1\", param2: \"value2\"},\n    function(data) {\n       \
  \ alert(\"Server responded: \" + data);\n    });\n```\n\n#### ajax()\n\n为了获得最大的灵活性，`ajax()`\
  \ 方法允许你设置 Ajax 调用的每一个方面以及如何处理响应。有关使用 `ajax()` 的完整信息，请参见文档 [`api.jquery.com/jQuery.ajax/`](http://api.jquery.com/jQuery.ajax/)。\n\
  \n### 尝试自己一下\n\n让我们用一个 jQuery 驱动的简单 Ajax 表单提交示例来结束本课程。\n\n我们将使用这个简单的 HTML 表单：\n\n\
  点击此处查看代码图像\n\n```html\n<form id=\"form1\">\n    Name<input type=\"text\" name=\"\
  name\" id=\"name\"><br />\n    Email<input type=\"text\" name=\"email\" id=\"email\"\
  ><br />\n    <input type=\"submit\" name=\"submit\" id=\"submit\" value=\"Submit\
  \ Form\">\n</form>\n```\n\n你将使用 jQuery 执行以下任务：\n\n![Image](img/image00412.jpeg)\
  \ 检查两个输入字段是否包含文本。\n\n![Image](img/image00412.jpeg) 通过 Ajax 使用 HTTP POST 提交表单。\n\n\
  ![Image](img/image00412.jpeg) 将服务器返回的数据打印到页面上的 <div> 元素中。\n\n为了检查两个字段都已输入数据，你使用一个简单的函数：\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```javascript\nfunction checkFields(){\n    return ($(\"\
  #name\").val() && $(\"#email\").val());\n}\n```\n\n为了函数返回布尔值 `true`，两个表单字段的 `value`\
  \ 属性必须包含某些文本数据；如果任一字段为空，则空白字段将被解释为“假（falsy）”，且逻辑与（`&&`）运算符将导致函数返回 `false`。\n\n接下来，应用\
  \ jQuery 的 `submit()` 事件处理程序来检测表单提交。如果你的函数 `checkFields()` 返回 `false`，默认行为将被取消，表单将不会提交；否则，jQuery\
  \ 将将数据序列化并向服务器脚本发送 `post()` 请求。\n\njQuery 的 `serialize()` 方法用于将表单信息收集并序列化为字符串，作为数据负载通过\
  \ Ajax 调用发送。\n\n对于此示例，服务器脚本 `test.php` 除了格式化接收到的信息并作为一小段 HTML 发回之外，什么都不做：\n\n点击此处查看代码图片\n\
  \n```php\n<?php\necho \"Name: \" . $_REQUEST['name'] . \"<br />Email: \" . $_REQUEST['email'];\n\
  ?>\n```\n\n最后，回调函数在页面上显示返回的信息：\n\n```javascript\nfunction(data){\n    $(\"#div1\"\
  ).html(data);\n}\n```\n\n代码如列表 17.1 所示。\n\n**列表 17.1 一个 Ajax 表单**\n\n点击此处查看代码图片\n\
  \n* *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Ajax Form Submission</title>\n\
  \    <script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n   \
  \ <script>\n        $(document).ready(function(){\n            function checkFields(){\n\
  \                return ($(\"#name\").val() && $(\"#email\").val());\n         \
  \   }\n            $(\"#form1\").submit(function(){\n                if(checkFields()){\n\
  \                    $.post(\n                        'test.php', $(\"#form1\").serialize(),\n\
  \                        function(data){\n                            $(\"#div1\"\
  ).html(data);\n                        }\n                    );\n             \
  \   }\n                else alert(\"Please fill in name and email fields!\");\n\
  \                return false;\n            });\n        });\n    </script>\n</head>\n\
  <body>\n    <form id=\"form1\">\n        Name<input type=\"text\" name=\"name\"\
  \ id=\"name\"><br />\n        Email<input type=\"text\" name=\"email\" id=\"email\"\
  ><br />\n        <input type=\"submit\" name=\"submit\" id=\"submit\" value=\"Submit\
  \ Form\">\n    </form>\n    <div id=\"div1\"></div>\n</body>\n</html>\n```\n\n*\
  \ *\n\n要运行此示例，你需要将列表 17.1 列出的文件以及服务器文件 `test.php` 上传到具有 PHP 支持的 Web 服务器上。\n\n尝试在留一个或两个输入字段为空的情况下提交表单，会导致脚本发出警告消息并阻止表单提交。\n\
  \n成功的表单提交应导致格式化后的数据显示在页面上，如图 17.3 所示。该图还显示了 Firebug Lite 显示 Ajax 调用和响应的。\n\n![Image](img/image00454.jpeg)\n\
  \n**图 17.3** 使用 jQuery 的 Ajax 表单\n\n* *\n\n### 总结\n\n在这一小时中，你深入了解了 Ajax 编程的基础知识，并学习了如何使用\
  \ jQuery 库让整个过程变得更加流畅和简单。\n\n## 问答\n\n**Q. Ajax 是如何命名的？**\n\n**A.** Ajax 是 Asynchronous\
  \ JavaScript And XML（异步 JavaScript 和 XML）的缩写。但在实践中，Ajax 绝不限于仅返回 XML 数据。\n\n**Q.\
  \ 除了 jQuery 之外，还有其他库实现 Ajax 吗？**\n\n**A.** 定的。有许多库和框架可以帮助你实现 Ajax，流行的包括 Dojo、MooTools\
  \ 和 Prototype。\n\n## 工作坊\n\n在阅读随后的“[答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.** 下列哪项将从服务器文件\
  \ `examples.html` 获取 `id=source` 的元素，并将其插入到 `id=target` 的页面元素中？\n\n**a.** `$(\"\
  #target\").load(\"examples.html #source\");`\n\n**b.** `$(\"#source\").load(\"examples.html\
  \ #target\");`\n\n**c.** `$(#source).load(\"examples.html #target\");`\n\n**2.**\
  \ 用于处理来自 Ajax 返回数据的函数称为：\n\n**a.** 匿名函数\n**b.** 回调函数\n**c.** Ajax 请求\n\n**3.** `serialize()`\
  \ 方法：\n\n**a.** 将一组元素编码为字符串。\n**b.** 将一组元素编码为对象。\n**c.** 将一组元素编码为数组。\n\n#### 答案\n\
  \n**1.** **a.** `$(\"#target\").load(\"examples.html #source\");`\n\n**2.** **b.**\
  \ 回调函数\n\n**3.** **a.** 将一组元素编码为字符串。\n\n## 练习题\n\n![Image](img/image00454.jpeg)\
  \ 将一些文本上传到 .txt 文件中。创建一个页面，使用 jQuery 的 `load()` 方法将其显示在页面的 `<div>` 中。\n\n![Image](img/image00454.jpeg)\
  \ 修改此“[此处试一下”的代码，如果任一数据字段为空或包含少于四个字符，则不允许提交。\n\n\n\n\n通常的原因是某些网站将 Cookie 作为广告系统的一部分，用于跟踪用户的在线活动，以便选择合适的广告。最好说明你为什么要使用\
  \ Cookie 以及你将如何使用它。\n\n## Cookie 的局限性\n\n你的浏览器对可以存储的 Cookie 数量可能会有限制——通常为几百个 Cookie\
  \ 或更多。通常，每个域名允许存储 20 个 Cookie。单个域名可以存储共 4KB 的 Cookie 信息。\n\n除了这些大小限制带来的潜在问题外，Cookie\
  \ 还会因为各种原因从硬盘中消失，例如 Cookie 到期、用户清除 Cookie 信息或切换了浏览器。因此，绝不应使用 Cookie 来存储关键数据，你的代码应该始终编写为处理无法获取预期的\
  \ Cookie 的情况。\n\n## document.cookie 属性\n\nJavaScript 中的 Cookie 通过使用 `document` 对象的\
  \ `cookie` 属性进行存储和检索。\n\n每个 Cookie 本质上是一个由名称和值对组成的文本字符串，如下所示：\n\n`username=sam`\n\
  \n当网页加载到你的浏览器时，浏览器会将该页面所有可用 Cookie 汇编成单个类似于字符串的属性，可以通过 `document.cookie` 访问。在 `document.cookie`\
  \ 内部，各个 Cookie 用分号分隔：\n\n点击此处查看代码图片\n\n`username=sam;location=USA;status=fullmember;`\n\
  \n### 提示\n我将 `document.cookie` 称为*类字符串*属性，因为 true 并不是真正的字符串——只是当你尝试提取 Cookie 信息时，它的行为就像字符串一样，正如你在本小时中看到的。\n\
  \n##数据的转义与反转义\n\nCookie 值可能不包含某些字符。那些被禁止的字符包括分号、逗号以及空格、制表符等空白字符。在将数据存储到 Cookie 之前，你需要对数据进行编码，以便能够正确存储。\n\
  \n你可以使用 JavaScript 的 `escape()` 函数在存储之前对值进行编码，并使用相应的 `unescape()` 函数稍后恢复原始 Cookie\
  \ 值。\n\n`escape()` 函数将字符串中的任何非 ASCII 字符转换为等效的两位或四位十六进制格式——因此空格转换为 `%20`，符号 (&) 转换为\
  \ `%26`。\n\n例如，以下代码段输出了变量 `str` 中保存的原始字符串，随后是应用 `escape()` 函数后的值：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar str = 'Here is a (short) piece of text.';\n\ndocument.write(str\
  \ + '<br />' + escape(str));\n```\n\n屏幕上的输出将是\n\n点击此处查看代码图片\n\nHere is a (short)\
  \ piece of text.\n\nHere%20is%20a%20%28short%29%20piece%20of%20text.\n\n注意空格已被替换为\
  \ `%20`，左括号被替换为 `%28`，右括号被替换为 `%29`。\n\n *, @, -, _, +, ., 和 / 之外，所有特殊字符都经过了编码。\n\
  \n## Cookie 的组成\n\n`document.cookie` 中的 Cookie 信息看起来可能是一个简单的名称和值对字符串，每个对的格式为\n\n\
  `name=value;`\n\n但实际上，每个 Cookie 都关联着某些其他信息，如下文节所示。\n\n## 注意事项\nCookie 的最终规范于 2011\
  \ 年作为 RFC6265 发布。你可以在 [`tools.ietf.org/html/rfc6265`](http://tools.ietf.org/html/rfc6265)\
  \ 读取它。\n\n### cookieName 和 cookieValue\n这些是 Cookie 字符串中每个 `name=value` 对可见的名称和值。\n\
  \n### domain\n`domain` 属性告诉浏览器 Cookie 哪个域名。该属性是可选的，当未指定时，其值默认为设置 Cookie 的页面域名。\n\
  \n`domain` 属性的目的是控制跨子域的 Cookie 操作。如果域名设置为 www.example.com，那么 code.example.com 等子域名上的页面将无法读取该\
  \ Cookie。然而，如果 `domain` 设置为 example.com，那么 code.example.com 中的页面将能够访问它。\n\n你不能将\
  \ `domain` 属性设置为包含你页面之外的任何域名。\n\n### path\n`path` 属性允许你指定 Cookie 可用的目录。如果你希望 Cookie\
  \ 仅对 `documents` 目录下的页面设置，请将路径设置为 `/documents`。`path` 属性是可选的，通常默认路径是 /，在这种情况下 Cookie\
  \ 对整个域名都有效。\n\n### secure\n可选且很少使用的 `secure` 标志表示浏览器在向服务器发送 Cookie 时应使用 SSL 安全性。\n\
  \n### expires\n每个 Cookie 都有一个 `expires` 日期，在此之后 Cookie 将被自动删除。`expires` 日期应该是 UTC\
  \ 时间（格林尼治时间，或 GMT）。如果未为 `expires` 设置值，Cookie 的有效期将持续当前浏览器会话，并在浏览器关闭时自动删除。\n\n###\
  \ 写入 Cookie\n\n要写入新 Cookie，只需为 `document.cookie` 赋值一个包含所需属性的值：\n\n点击此处查看代码图片\n\n\
  ```javascript\ndocument.cookie = \"username=sam;expires=15/06/2013 00:00:00\";\n\
  ```\n\n为了避免手动设置日期格式，我们可以使用 JavaScript 的 `Date` 对象完成相同的操作：\n\n点击此处查看代码图片\n\n```javascript\n\
  var cookieDate = new Date ( 2013, 05, 15 );\n\ndocument.cookie = \"username=sam;expires=\"\
  \ + cookieDate.toUTCString();\n```\n\n这产生了与上一个示例相同的结果。\n\n### 提示\n注意使用\n\n`cookieDate.toUTCString();`\n\
  \n而不是\n\n`cookieDate.toString();`\n\n因为 Cookie 日期始终需要以 UTC 时间设置。\n\n在实践中，你应该使用 `escape()`\
  \ 来确保没有被禁止的字符进入 Cookie 值：\n\n点击此处查看代码图片\n\n```javascript\nvar cookieDate = new Date\
  \ ( 2013, 05, 15 );\n\nvar user = \"Sam Jones\";\n\ndocument.cookie = \"username=\"\
  \ + escape(user) + \";expires=\" + cookieDate.toUTCString();\n```\n\n### 写入 Cookie\
  \ 的函数\n\n编写一个函数来写入 Cookie 是相当，将转义和可选属性的处理交给函数。此类函数的代码出现在 列表 18.1。\n\n**列表 18.1 写入\
  \ Cookie 的函数**\n\n点击此处查看代码图片\n\n```javascript\nfunction createCookie(name, value,\
  \ days, path, domain, secure) {\n    if (days) {\n        var date = new Date();\n\
  \        date.setTime(date.getTime() + (days*24*60*60*1000));\n        var expires\
  \ = date.toGMTString();\n    }\n    else var expires = \"\";\n    cookieString =\
  \ name + \"=\" + escape (value);\n    if (expires) cookieString += \"; expires=\"\
  \ + expires;\n    if (path) cookieString += \"; path=\" + escape (path);\n    if\
  \ (domain) cookieString += \"; domain=\" + escape (domain);\n    if (secure) cookieString\
  \ += \"; secure\";\n    document.cookie = cookieString;\n}\n```\n\n函数的操作简单。`name`\
  \ 和 `value` 参数组合成 `name=value` 字符串，并对 `value` 部分进行转义以避免禁用字符引起的错误。\n\n我们不是向函数传递日期字符串，而是要求传入过期前的天数。函数随后会处理转换为相应的日期字符串。\n\
  \n其余属性都是可选的，并且仅当它们作为参数存在时才被添加到字符串中。\n\n\n\n\n\n如果你尝试直接从本地机器将文件加载到浏览器，你的浏览器安全设置可能会阻止你尝试这些示例。要看到示例运行，你可能需要将文件上传到\
  \ Internet 上的 Web 服务器或本地局域网的其他地方。\n\n## 动手尝试：编写 Cookies\n\n让我们使用这个函数来设置某些 Cookie\
  \ 的值。我们简单页面的代码如列表 18.2 所示。创建一个名为 `testcookie.html` 的新文件，并输入列出的代码。你可以随地为存储在 Cookie\
  \ 中的键名和值对使用不同的值。\n\n**列表 18.2 写入 Cookies**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>Using Cookies</title>\n<script>\n    function createCookie(name,\
  \ value, days, path, domain, secure) {\n        if (days) {\n            var date\
  \ = new Date();\n            date.setTime(date.getTime() + (days*24*60*60*1000));\n\
  \            var expires = date.toGMTString();\n        }\n        else var expires\
  \ = \"\";\n        cookieString = name + \"=\" + escape (value);\n        if (expires)\
  \ cookieString += \"; expires=\" + expires;\n        if (path) cookieString += \"\
  ; path=\" + escape (path);\n        if (domain) cookieString += \"; domain=\" +\
  \ escape (domain);\n        if (secure) cookieString += \"; secure\";\n        document.cookie\
  \ = cookieString;\n    }\n    createCookie(\"username\",\"Sam Jones\", 5);\n   \
  \ createCookie(\"location\",\"USA\", 5);\n    createCookie(\"status\",\"fullmember\"\
  , 5);\n</script>\n</head>\n<body>\nCheck the cookies for this domain using your\
  \ browser tools.\n</body>\n</html>\n```\n\n如果你有 Internet 主机或本地局域网上的 Web 服务器，请将此\
  \ HTML 文件上传到那里。加载后的页面除了一行文本外什么都不显示：\n\n点击此处查看代码图像\n\n使用你的浏览器工具检查此域的 cookies。在 Chromium\
  \ 浏览器中，我可以使用 `Shift+Ctrl+I` 打开开发者工具——如果你使用不同的浏览器，请查看文档了解如何查看 cookie 信息。我的结果如图 18.1\
  \ 所示。\n\n![Image](img/image00455.jpeg)\n\n**图 18.1** 显示我们的 cookies\n\n> 注意，每次调用该函数时，它都会为\
  \ `document.cookie` 设置一个新值，但这个值并不会覆盖之前的值；而是将你的新 cookie 添加到已存在的 cookie 值中。正如我所说，`document.cookie`\
  \ 有时看起来像是一个字符串，但它实际上并不是字符串。\n\n### 读取 Cookie\n\n读取 Cookie 值的函数严重依赖于 JavaScript 的\
  \ `split()` 字符串方法，这是你在第 5 小节“数字与字符串”中学习过的。你可能记得 `split()` 接收一个字符串并将其分为项目数组，使用指定的字符来确定字符串应该分割的位置：\n\
  \n点击此处查看代码图像\n\n```javascript\nmyString = \"John#Paul#George#Ringo\";\nvar myArray\
  \ = myString.split('#');\n```\n\n前面的语句将字符串 `myString` 分分为一系列单独的部分，在每个哈希（`#`）字符出现的地方切断字符串；`myArray[0]`\
  \ 将包含“John”，`myArray[1]` 将包含“Paul”，依此类推。\n\n由于在 `document.cookie` 中各个 cookie 是用分号字符分隔的，因此该字符最初用于拆分\
  \ `document.cookie` 返回的字符串：\n\n点击此处查看代码图像\n\n```javascript\nvar crumbs = document.cookie.split(';');\n\
  ```\n\n你想搜索具有特定名称的 cookie，因此会在生成的数组 `crumbs` 中搜索任何具有适当 `name=` 部分的项目。结合 `indexOf()`\
  \ 和 `substring()` 方法来返回 cookie 的值部分，然后函数在通过 `unescape()` 移除任何编码后将其返回：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction getCookie(name) {\n    var nameEquals = name + \"=\";\n\
  \    var crumbs = document.cookie.split(';');\n    for (var i = 0; i < crumbs.length;\
  \ i++) {\n        var crumb = crumbs[i];\n        if (crumb.indexOf(nameEquals)\
  \ == 0) {\n            return unescape(crumb.substring(nameEquals.length, crumb.length));\n\
  \        }\n    }\n    return null;\n}\n```\n\n## 删除 Cookies\n\n要删除 cookie，只需要将其设置在当前日期之前的过期日期。浏览器会推断\
  \ cookie 已经过期并将其删除。\n\n```javascript\nfunction deleteCookie(name) {\n    createCookie(name,\"\
  \",-1);\n}\n```\n\n> **注意**：某些版本的某些浏览器即使你在脚本中删除了 cookie，也会保留它 直到你重启浏览器。如果你的程序依赖于删除操作一定发生，请对删除的\
  \ cookie 再次进行 `getCookie` 测试以确保它真的消失了。\n\n## 动手尝试：使用 Cookies\n\n让我们通过构建一些页面来测试 cookie\
  \ 操作，整合你目前为止学到的关于 cookie 的所有知识。首先，将函数 `createCookie()`、`getCookie()` 和 `deleteCookie()`\
  \ 收集到单个 JavaScript 文件中并保存为 `cookie.js`，使用列表 18.3 中的代码。\n\n**列表 18.3 cookies.js**\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction createCookie(name, value, days, path, domain,\
  \ secure) {\n    if (days) {\n        var date = new Date();\n        date.setTime(\
  \ date.getTime() + (days*24*60*60*1000));\n        var expires = date.toGMTString();\n\
  \    }\n    else var expires = \"\";\n    cookieString = name + \"=\" + escape (value);\n\
  \    if (expires) cookieString +=  \"; expires=\" + expires;\n    if (path) cookieString\
  \ += \"; path=\" + escape (path);\n    if (domain) cookieString += \"; domain=\"\
  \ + escape (domain);\n    if (secure) cookieString += \"; secure\";\n    document.cookie\
  \ = cookieString;\n}\n\nfunction getCookie(name) {\n    var nameEquals = name +\
  \ \"=\";\n    var crumbs = document.cookie.split(';');\n    for (var i = 0; i <\
  \ crumbs.length; i++) {\n        var crumb = crumbs[i];\n        if (crumb.indexOf(nameEquals)\
  \ == 0) {\n            return unescape(crumb.substring(nameEquals.length, crumb.length));\n\
  \        }\n    }\n    return null;\n}\n\nfunction deleteCookie(name) {\n    createCookie(name,\"\
  \",-1);\n}\n```\n\n此文件将包含在你测试页的 `<head>` 中，以便你的代码可以使用这三个函数。首一个测试页面 `testcookie.html`\
  \ 的代码如列表 18.4 所示，第二个测试页面 `testcookie2.html` 的代码如列表 18.5 所示。在文本编辑器中创建这两个页面。\n\n**列表\
  \ 18.4 testcookie.html**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Using Cookies</title>\n<script src=\"cookies.js\"></script>\n<script>\n \
  \   window.onload = function() {\n        var cookievalue = prompt(\"Cookie Value:\"\
  );\n        createCookie(\"myCookieData\", cookievalue);\n    }\n</script>\n</head>\n\
  <body>\n    <a href=\"testcookie2.html\">Go to Cookie Test 2</a>\n</body>\n</html>\n\
  ```\n\n**列表 18.5 testcookie2.html**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>Using Cookies</title>\n<script src=\"cookies.js\"></script>\n\
  <script>\n    window.onload = function() {\n        document.getElementById(\"output\"\
  ).innerHTML = \"Your cookie value: \" + getCookie(\"myCookieData\");\n    }\n</script>\n\
  </head>\n<body>\n    <a href=\"testcookie.html\">Back to Cookie Test 1</a><br/>\n\
  \    <div id=\"output\"></div>\n</body>\n</html>\n```\n\n\n\n\n\n`cookietest.html`\
  \ 中唯一可见的页面内容是指向第二个页面 `cookietest2.html` 的链接。然而，`window.onload` 事件被页面上的代码捕获并用于执行一个函数，该函数会在页面加载完成后立即弹出一个\
  \ `prompt()` 对话框。该对话框询问你一个要保存到 cookie 中的值，然后调用 `createCookie()` 设置一个名为 `myCookieData`\
  \ 值为你刚刚输入的内容 cookie。\n\n`cookietest.html` 页面的工作情况所示图 18.2。\n\n![Image](img/image00456.jpeg)\n\
  \n**图 18.2** 为你的 cookie 输入一个值。\n\n设置好 cookie 后，使用链接导航到 `cookietest2.html`。\n\n当此页面加载时，`window.onload`\
  \ 事件处理器会执行一个函数，该函数使用 `getCookie()` 获取存储的 cookie 值并将其写入页面，所示图 18.3。\n\n![Image](img/image00457.jpeg)\n\
  \n**图 18.3** 获取你 cookie 的值\n\n若要亲自尝试，你需要将文件 `cookietest.html`、`cookietest2.html`\
  \ 和 `cookies.js` 上传到互联网上的 Web 服务器（或者本地网络上的服务器，如果有），因为浏览器安全机制可能会阻止你在使用 `file://`\
  \ 协议查看本地电脑上的文件时设置 cookie。\n\n### 在单个 Cookie 中设置多个值\n\n每个 cookie 包含一个 `name=value`\
  \ 键对，因此如果你需要存储几条独立的数据（例如用户的姓名、年龄和会员号），你需要三个不同的 cookie。\n\n然而，通过一点小技巧，你可以通过将所需的值连接成单个字符串（该字符串将成为\
  \ cookie 存储的值），让你的 cookie 存储所有三个值。\n\n这样，你不需要为姓名、年龄和会员号准备三个独立的 cookie，而是只需要一个（可能命名为\
  \ `user`），其中包含这三部分数据。为了稍后分离细节，你可以在值字符串中放置一个称为*分隔符*（delimiter）的特殊字符，以分隔不同的数据部分：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar userdata = \"Sandy|26|A23679\";\ncreateCookie(\"\
  user\", userdata);\n```\n\n这里的 `|`（管道）字符充当了分隔符。当你稍后获取 cookie 值时，可以使用 `|` 分隔符将其拆分为各个独立的变量值：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myUser = getCookie(\"user\");\nvar myUserArray\
  \ = myUser.split('|');\nvar name = myUserArray[0];\nvar age = myUserArray[1];\n\
  var memNo = myUserArray[2];\n```\n\n存储多个值的 cookie 占用了某些浏览器允许的每个域名 20 个 cookie 的额额，但请记住，你对\
  \ cookie 的使用仍受到 cookie 信息 4KB 总限制的限制。\n\n### 注意\n这是序列化的另一个示例，你已经在第 10 小时 的“会见 JSON”中学习过。\n\
  \n### 总结\n在本节课中，你学习了 cookie，以及如何使用 JavaScript 设置、检索和删除它们。你还学习了如何将多个值合并到单个 cookie\
  \ 中。\n\n## 问答\n**问。在将多个值合并到单个 cookie 时，可以使用任何字符作为分隔符吗？**\n\n**答。你不能使用可能出现在你的转义数据中的任何字符（分隔符字符除外），也不能使用等号\
  \ (=) 或分号 (；)，因为这些字符用于在 `document.cookie` 中组合和拼接 `name=value` 键对。此外，cookie 可能不包含空格或逗号，因此它们自然不能用作分隔符。\n\
  \n**问。cookie 安全吗？**\n\n**答。人们经常对 cookie 的安全性提出质疑，但这种担忧很大是没有根据的。cookie *可以*帮助网站所有者和广告商跟踪你的浏览习惯，他们可以（并且确实）利用此类信息来在你访问的网页上选择广告和促销信息。然而，网站所有者和广告商无法仅仅通过使用\
  \ cookie 获取关于你的个人信息或访问你硬盘上的其他项目。\n\n## 工作坊\n在阅读随后的“答案”部分之前尝试回答所有问题。\n\n##### 测验\n\
  **1。** cookie 是存储在……的小文本信息\n\n**a.** 在用户的硬盘上\n**b.** 在服务器上\n**c.** 在用户的互联网服务提供商处\n\
  \n**2。** 使用以下方法对字符串进行编码以安全地存储在 cookie 中：\n\n**a.** `escape()`\n**b.** `unescape()`\n\
  **c.** `split()`\n\n**3。** 用于分隔单个 cookie 中多个值的字符被称为\n\n**a.** 转义序列\n**b.** 分隔符\n\
  **c.** 分号\n\n#### 答案\n**1。** cookie 存储在用户的硬盘上。\n**2。** 你可以使用 `escape()` 在 cookie\
  \ 中安全地存储。\n**3。** 分隔符。\n\n## 练习\n![Image](img/image00456.jpeg) 使用你喜欢的浏览器查看 cookie\
  \ 信息列表 18.4。\n\n![Image](img/image00456.jpeg) 重写 `cookietest.html` 和 `cookietest2.html`\
  \ 以将多个值写入 cookie，使用井号（#）作为你的分隔符。\n\n![Image](img/image00456.jpeg) 在 `cookietest.html`\
  \ 中添加一个按钮来删除 cookie。（提示：使用 `deleteCookie()`）。\n\n\n\n\n\n```javascript\nthis.make\
  \ = Make;\nthis.odometerReading = Miles;\n\n}\n\nsetOdometer(newMiles) {\n    this.odometerReading\
  \ = newMiles;\n}\n}\n```\n\n这种语法还允许你扩展类，创建一个继承父类属性的新类。这里有一个示例：\n\n点击此处查看代码图片\n\n\
  ```javascript\nclass Sportscar extends Car {\n    constructor(Color, Year, Make,\
  \ Miles) {\n        super(Color, Year, Make, Miles);\n        this.doors = 2;\n\
  \    }\n}\n```\n\n在这里，我在构造函数使用了 `super` 关键字，这允许我调用父类的构造函数并继承它的所有属性。事实上，这只是语法糖；所有使用类的代码都可以重写为函数和原型，就就像你在第\
  \ 8 小节中学习的那样。然而，它与其他流行的语言具有更好的兼容性，而且读起来也更容易一些。\n\n### 箭头函数\n\n箭头函数 (`=>`) 是匿名函数的简写语法。\n\
  \n点击此处查看代码图片\n\n```javascript\nparam => statements or expression\n```\n\n让我们再详细解释一下：\n\
  \n![Image](img/image00365.jpeg) `param`——参数或多个参数的名称。如果函数没有参数，则需要用 `()` 标明。如果只有一个参数，则不需要括号。\n\
  \n![Image](img/image00365.jpeg) `statements or expression`——多个语句需要括在花括号中。然而，单个表达式不需要括号。该表达式也是该函数的返回值。\n\
  \n点击此处查看代码图片\n\n```javascript\nvar overTen = x => x > 10 ? 10 : x;\n\noverTen(8);\
  \ // 返回 8\noverTen(12); // 返回 10\n```\n\n注意，`function` 关键字不是必须的，而且由于只有一个参数，括号可以省略。接下来的示例有两个参数：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar higher = (x, y) => {\n    if (x > y) {\n    \
  \    return x;\n    } else {\n        return y;\n    }\n}\n\nhigher(7, 9); // 返回\
  \ 9\nhigher(12, 3); // 返回 12\n```\n\n箭头函数不仅写起来更简单，它们还有一个特点，即会从容器继承 `this` 的值。这在在使用对象时非常有用。之前，我们需要将\
  \ `this` 赋值给变量以便将其传递给函数：\n\n点击此处查看代码图片\n\n```javascript\nfunction myObject() {\n\
  \    this.height = 13;\n    var self = this;\n    setTimeout(function fiveSecondsLater()\
  \ {\n        console.log(self.height);\n    }, 5000)\n}\n\nvar o = new myObject();\n\
  ```\n\n在前面的示例中，我们不能简单地使用\n\n```javascript\nconsole.log(this.height);\n```\n\n因为\
  \ `this` 将指向其直接容器，在这里是函数 `fiveSecondsLater()`。然而，通过使用箭头函数，可以避免使用像 `self` 这样的变量：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction myObject() {\n    this.height = 13;\n  \
  \  setTimeout(() => {\n        console.log(this.height); // 这里 'this' 指向 myObject\n\
  \    }, 5000)\n}\n\nvar o = new myObject();\n```\n\n### 模块\n\n随着 JavaScript 应用复杂性的增加，需要找到一种方法让在一个文件中声明的对象在其他文件中可用。通过这种方法，可以用模块化的方式编写大型项目。\n\
  \n默认情况下，你在一个文件中声明的任何内容在该文件外部都是不可用的。但在 ECMAScript 6 中，你可以使用 `export` 关键字让它可用。\n\n\
  这里有一个如何导出类的示例：\n\n点击此处查看代码图片\n\n```javascript\n// 此代码出现在 file1.js 中\nexport default\
  \ function Car(Color, Year, Make, Miles) {\n    this.color = Color;\n    this.year\
  \ = Year;\n    this.make = Make;\n    this.odometerReading = Miles;\n    this.setOdometer\
  \ = function(newMiles) {\n        this.odometerReading = newMiles;\n    }\n    //\
  \ 此对象可以被其他文件导入\n```\n\n在接收到的文件中：\n\n点击此处查看代码图片\n\n```javascript\n//  此代码出现在 file2.js\
  \ 中\nimport Car from 'file1';\n\nvar ferrari = new Car('red', 1986, 'Dino', 75500);\n\
  ```\n\n### 使用 let 和 const\n\n在 ECMAScript 6 之前，JavaScript 只有两种作用域——即函数作用域和全局作用域。（变量的作用域，正如你在第\
  \ 3 小节中学习的，“使用函数](#part0012.xhtml_ch03)”，取决于变量使用 `var` 关键字在代码中的声明位置。）\n\n令许多从其他语言转向\
  \ JavaScript 的开发者感到沮丧的是，JavaScript 缺乏所谓的“块作用域”，即定义变量仅在定义它的块内是可访问的。（块是一对花括号内部的所有内容。）\n\
  \n新关键字 `let` 允许你声明变量，同时将其作用域限制在声明它的块、语句或表达式上。\n\n相比之下，`var` 关键字定义的变量要么是全局的，要么是对于整个函数局部的，不考虑块作用域：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction myFunc() {\n    {\n        let x;\n    \
  \    if(y == 0) {\n            // 这是可以的，x 具有块作用域\n            let x = \"inner\"\
  ;\n        }\n        // 这是一个错误，x 已经在块中声明过了\n        let x = \"outer\";\n    }\n\
  }\n```\n\n`const` 声明创建一个常量——即一个只读的命名变量。常量的值不能通过重新赋值来更改，常量之后也不能重新声明。\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction myFunc() {\n    {\n        const x = \"foo\";\n      \
  \  // 这是一个错误，x 是常量，不能重新定义\n        x = \"bar\";\n    }\n}\n```\n\n***\n\n### 亲自尝试一下：查看\
  \ const\n\n让我们来看 `const` 是如何工作的。在编写时，它在大多数浏览器中都可以工作，但我将使用 Google Chrome。\n\n不要在文本文件中编写代码，而是打开你浏览器的\
  \ JavaScript 控制台。对于 Chrome 来说，可以通过 Ctrl+Shift+J 实现。\n\n首先，使用 `const` 关键字定义一个常量。你可以给它起任何名字，并选择任何值。我的常量叫\
  \ `MYCONST`，我给它赋值为 10（见图 19.1）。\n\n![Image](img/image0458.jpeg)\n**图 19.1** Chrome\
  \ 控制台\n\n控制台输出 undefined，这是因为 `const` 的声明没有返回值。\n\n在图 19.2 中，我尝试重新定义 `MYCONST` 的值。\n\
  \n![Image](img/image0459.jpeg)\n**图 19.2** 设置常量\n\n如你所见，常量 `MYCONST` 无法重新赋值。让我们尝试重新声明它（见图\
  \ 19.3）。\n\n![Image](img/image0460.jpeg)\n**图 19.3** 常量无法重新赋值\n\n不，我们不能那样做。最后，让我们尝试重新初始化它（见图\
  \ 19.4）。\n\n![Image](img/image0461.jpeg)\n**图 19.4** 重新声明常量无效\n\nJavaScript 报错。\n\
  \nJavaScript 报错。正如我们所见，使用 `const` 关键字声明的值不能重新初始化、重新声明或重新赋值。\n\n***\n\n### 模板字符串\n\
  \n模板字符串为构建字符串提供了帮助，类似于某些其他编程语言（如 Perl 和 Python）中的字符串插值功能。\n\n点击此处查看代码图片\n\n```javascript\n\
  var name = \"John\";\nvar course = \"Mathematics III\";\nvar myString = 'Hello ${name},\
  \ welcome to ${course}.';\n```\n\n你也可以替换更复杂的表达式：\n\n点击此处查看代码图片\n\n```javascript\n\
  var total = 20;\nvar tax = 4;\nmsg = 'Total is ${total} (or ${total + tax}, including\
  \ tax)';\nalert(msg); // \"Total is 20 (or 24, including tax)\"\n```\n\n### 使用 for-of\
  \ 访问数组\n\n\n\n\nJavaScript 提供了多种处理数组的方法，正如你在第 6 小中读到的“数组”。除了 `while` 和 `for` 循环外，你还可以使用\
  \ `for-in`。遗憾的是，这个循环会访问数组的所有命名属性，而不仅仅是实际数组值：\n\n点击此处查看代码图片\n\n```javascript\n\"\
  use strict\";\n\nlet arr1 = [ 6, 5, 7, 9 ];\n\narr1.greeting = \"hi\";\n\nfor (var\
  \ x in arr1) {\n    console.log(x); // 打印 \"0\", \"1\", \"2\", \"3\", \"greeting\"\
  \n}\n```\n\n为了解决这个问题，ECMAScript 6 引入了 `for-of` 结构，它只对属性值进行迭代：\n\n点击此处查看代码图片\n\n\
  ```javascript\nfor (var y of arr1) {\n    console.log(y); // 打印 \"6\", \"5\", \"\
  7\", \"9\"\n}\n```\n\n***\n\n注意\n\n注意前述代码段中使用了 `\"use strict\"` 指令。该指令在 ECMAScript\
  \ 5 中引入，表示 JavaScript 应该在严格模式下执行，这是一组更严格的解释器规则，并且目前使用某些 ECMAScript 6 特性是必要的。\n\n\
  ### 编译\n\n本节到目前为止的示例对于测试 ECMAScript 6 特性是可以的，但在编写时，它们尚未准备好用于生产代码。访问你网站的访客很少会使用支持强\
  \ ECMAScript 6 支持的浏览器。不过，你*可以*开始为未来做准备。\n\nTraceur 是 Google 的项目，旨在将 ECMAScript 6\
  \ 代码处理成与大多数使用默认设置浏览器兼容的 ECMAScript 5 代码。它并不支持所有的 ECMAScript 6 特性，但新特性正在不断添加。\n\n\
  你可以在 [`code.google.com/p/traceur-compiler/wiki/GettingStarted`](https://code.google.com/p/traceur-compiler/wiki/GettingStarted)\
  \ 了解该项目，并在 [`github.com/google/traceur-compiler`](https://github.com/google/traceur-compiler)\
  \ 下载代码进行亲自尝试。\n\n### 总结\n\n在本节中，你读了关于 ECMAScript 6 规范中 JavaScript 语言的一些重要新变化。\n\n\
  这些新语言特性使 JavaScript 语法与其他流行语言更加一致，同时也让代码更加简洁易读。\n\n浏览器厂商已经开始将这些和其他 ECMAScript 6\
  \ 特性实现到他们的产品中，未来的浏览器版本无疑将支持更多的规范内容。\n\n## 问答\n\n**Q. 我如何跟踪 ECMAScript 6 规范的进展？**\n\
  \n**A.** 可能是最好的在线资源是官方 ECMAScript wiki ([`wiki.ecmascript.org/`](http://wiki.ecmascript.org/))。\n\
  \n**Q. Ecma 是谁或什么？**\n\n**A.** Ecma 是一个国际、基于成员制的非营利标准组织，最初名为欧洲计算机厂商协会 (ECMA)。该组织成立于\
  \ 1961 年，旨在标准化整个欧洲的计算机系统。\n\n## 工作坊\n\n尝试在阅读随后的“答案”部分之前回答所有问题。\n\n#### 测验\n\n**1.**\
