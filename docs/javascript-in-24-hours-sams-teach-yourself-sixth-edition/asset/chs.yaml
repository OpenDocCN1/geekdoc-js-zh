  \n\n\n\n\nGoogle Chrome 和 Chromium 几乎是相同的浏览器，主要的区别在于它们的封装和分发方式。本质上，Google Chrome\
  \ 是由 Google 封装并分发的 `Chromium` 开源浏览器。\n\nChromium 给出的错误信息略显晦涩：“Uncaught syntax error:\
  \ Unexpected token ILLEGAL”，但它也会以可点击链接的形式给出行号，点击后会显示我出错的代码行。\n\n要打开 Internet Explorer\
  \ 的开发者工具，请按 `F12` 或从 `IE9 Tools` 中选择 `Developer Tools`。选择 `Console` 标签页查看 JavaScript\
  \ 返回的错误消息。\n\n### 提示\n了解你喜爱的浏览器中的调试工具是值得的，如果你特别偏好其他浏览器提供的工具，甚至可以考虑切换浏览器。如果你计划经常编写\
  \ JavaScript 代码，那么在一个让你感到舒适的开发环境中进行是有意义的，在那里你的效率会更高，也更少感到挫败。\n\n## 动手尝试：一个横幅轮播脚本\n\
  \n让我们利用这一个小时学到的部分知识，编写一个脚本来让页面上的图片循环播放。我确定你以前见过这种程序，可能是作为图片幻灯片，也可能是为了轮广告横幅。\n\n\
  首先，我想向你介绍两个新项目。第一个是你以前没见过的事件处理程序——`window` 对象的 `onLoad` 方法。它的操作简单：我们可以这样将其附加到 `<body>`\
  \ 元素上：\n\n点击此处查看代码图片\n\n```html\n<body onload=\"somefunction()\" >\n```\n\n当页面完全加载完成后，`onLoad`\
  \ 事件就会触发，事件处理程序中指定的代码就会运行。我们使用这个事件处理程序在页面加载后立即运行我们的横幅轮播器。\n\n其次，我们将使用 JavaScript\
  \ 的 `setInterval()` 函数。该函数允许我们重复运行一个 JavaScript 函数，并在连续执行之间设置预设延迟。\n\n`setInterval()`\
  \ 函数接受两个参数。第一个是我们想要运行的函数名称，第二个是函数连续执行之间的延迟（毫秒）。例如，这一行代码：\n\n```javascript\nsetInterval(myFunc,\
  \ 5000);\n```\n\n每五秒就会执行一次 `myFunc()` 函数。\n\n我们使用 `setInterval()` 按固定间隔轮换横幅图片。\n\
  \n创建一个名为 `banner.html` 的新文件，并输入来自 Listing 23.2 的代码。\n\n**列表 23.2 一个横幅轮播器**\n\n点击此处查看代码图片\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Banner Cycler</title>\n \
  \   <script>\n        var banners = [\"banner1.jpg\", \"banner2.jpg\", \"banner3.jpg\"\
  ];\n        var counter = 0;\n        function run() {\n            setInterval(cycle,\
  \ 2000);\n        }\n        function cycle() {\n            counter++;\n      \
  \      if(counter == banners.length) counter = 0;\n            document.getElementById(\"\
  banner\").src = banners[counter];\n        }\n    </script>\n</head>\n<body onload\
  \ = \"run();\">\n    <img id=\"banner\" alt=\"banner\" src=\"banner1.jpg\" />\n\
  </body>\n</html>\n```\n\n页面的 HTML 部分几乎不能更简单了——页面的主体只包含一个图片元素。这张图片将形成横幅，通过更改它的 `src`\
  \ 属性来对其“轮换”。\n\n现在让我们来看代码。\n\n`run()` 函数只包含一条语句，即 `setInterval()` 函数。该函数每两秒（2000\
  \ 毫秒）执行另一个函数 `cycle()`。\n\n每当 `cycle()` 函数执行时，我们都会执行三项操作：\n\n**1.** 递增计数器。\n```javascript\n\
  counter++;\n```\n\n**2.** 使用条件语句检查计数器是否达到了图片名称数组中的元素数量；如果是，则将计数器重置为零。\n\n点击此处查看代码图片\n\
  \n```javascript\nif(counter == banners.length) counter = 0;\n```\n\n**3.** 将显示图片的\
  \ `src` 属性设置为从图片文件名数组中选出的相应的文件名。\n\n点击此处查看代码图片\n\n```javascript\ndocument.getElementById(\"\
  banner\").src = banners[counter];\n```\n\n脚本的操作如图 图 23.5 所示。\n\n![Image](img/image00476.jpeg)\n\
