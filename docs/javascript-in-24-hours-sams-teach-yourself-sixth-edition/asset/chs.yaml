  \n[content]\n## 第 20 小节. 使用框架\n\n***\n\n在本节中你将学习到：\n- 什么是框架，以及它们为什么有用\n- 关于模型-视图-控制器\
  \ (MVC) 架构\n- 如何开始使用 Google AngularJS\n\n***\n\n如果你已经编写过许多应用程序，你很可能一直在重复解决相同的编码问题。减少这种重复造轮的技术之一就是使用*软件框架*。在本节中，你将学习一种被称为\
  \ MVC（模型-视图-控制器）的流行框架风格，并看到。\n\n### 软件框架\n\n框架的目的是提高你编写应用程序的效率，同时为你的应用程序增加一致性、质量和健壮性。选择一个良好的框架可以让你留更多时间关注应用程序独特的需求，而不是在基础设施上花费大量时间。\n\
  \n### 为什么要使用框架？\n\n框架帮助你重用已经构建并测试的代码，提高应用程序的可靠性并减少创建它所需的编码和测试工作。\n\n框架还可以促进更好的编程实践，因为它对你的应用程序施加了结构。\n\
  \n最后，框架通常为你提供了扩展功能的手段，使其更符合你应用程序的需求。\n\n\n\n\n视图（View）通过查询其模型来获取展示所需的数据。它也可以通过发送适当的命令来更改模型中的数据。此类查询和命令都必须在模型内部定义的语义中。\n\
  \n## 控制器\n\n控制器（Controller）构成了用户与应用程序之间的桥梁，负责安排视图在屏幕上的显示，或者通过展示菜单、输入字段、按钮或其他页面元素读取用户输入。控制器在将用户输入传递给一个或多个视图之前对其解释。\n\
  \nMVC 框架各个部分的操作见图 20.1。\n\n![Image](img/image0046.jpeg)\n\n**图 20.1** 模型-视图-控制器交互\n\
  \n***\n\n### 示例\n\n看电视可以类似于 MVC 框架。\n\n广播提供了各种频道，每个频道都包含不同的数据；这些频道可以被视为 MVC 系统的\
  \ `models`。\n\n`view` 由电视屏幕提供。\n\n你可以通过遥控器的 `control(ler)` 功能与电视交互。\n\n***\n\n##\
  \ 使用 MVC 框架开发 Web 应用\n\nMVC 架构非常适用于 Web 应用。\n\n![Image](img/image0065.jpeg) **模型**——页面内容存储在支撑应用程序的\
  \ `models` 中。技术细节可能有所不同——文本和图像可能存储在数据库、服务器文件或其他地方——但内容以及如何组合的规则被编码到框架的 `model` 部分。\n\
  \n![Image](img/image0065.jpeg) **视图**——HTML 和 CSS 为内容添加了一层或多个视觉显示层——我们赋予 Web 应用特定的外观和样式。我们可以在不更改存储在\
  \ `model(s)` 中的原始内容的情况下更改显示的内容。\n\n![Image](img/image0065.jpeg) **控制器**——控制器元素由链接到页面交互元素的代码组成，如表单字段、按钮和链接。\n\
  \n## AngularJS 框架\n\nAngularJS 是一个由 Google 开发的 MVC 框架，它让你构建构建结构良好、易于测试且易于维护的 JavaScript\
  \ 应用程序。它帮助你制作强大的单页应用程序。\n\n### AngularJS 概述\n\nAngularJS 是一个 MVC 框架，将 HTML 代码（对应\
  \ MVC 的 `views` 部分）绑定到 JavaScript 对象（MVC 的 `models` 部分）。\n\n在一个方向上，对 `models` 的任何更改都会更新页面。反之也是\
  \ true——例如，当关联文本字段的 `model` 内容发生变化时，字段会被更新。同样，对 `view` 的任何更改（例如用户在字段中输入信息或点击按钮）都会产生相应的\
  \ `model`。\n\n在后台，AngularJS 处理所有逻辑，因此你不需要编写代码来更新页面的 HTML 代码或响应用户事件。\n\n### 在页面中引入\
  \ AngularJS\n\n要使用 AngularJS，需要在页面中引入它。最简单的方法是通过 Google 的 CDN：\n\n点击查看代码\n\n```\n\
  <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.1/angular.min.js\"\
  ></script>\n```\n\n### 使用指令扩展 HTML\n\nAngularJS 使用许多指令帮助你将页面的 HTML 元素关联到 MVC 架构中的模型。这些指令都以\
  \ `ng-` 开头，并可以添加到任何元素上。页面包含的关键属性是 `ng-app`，它定义了 AngularJS 应用程序。你需要将其应用于页面的 `<body>`\
  \ 元素或包含应用程序的 `<div>` 元素：\n\n```html\n<body ng-app>\n```\n\nAngularJS 在页面加载时找到此元素并处理其子元素上的所有\
  \ `ng-` 指令。另外两个重要的 `ng-` 指令是 `ng-model` 和 `ng-bind`。`ng-model` 指令将输入字段、选择框、文本区域等\
  \ HTML 控件的值连接到存储在模型中的应用程序数据。`ng-bind` 指令将模型中的应用程序数据绑定到 HTML 视图中的元素。\n\n一个简单的示例见列表\
  \ 20.1。\n\n**列表 20.1 一个简单的 AngularJS 示例**\n\n点击查看代码\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>AngularJS Example</title>\n<style>\n #output {\n  font: 28px\
  \ helvetica, arial, sans-serif;\n  color: red;\n }\n</style>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body ng-app>\n  <p>Name: <input type=\"text\" ng-model=\"\
  name\"></p>\n  <span id=\"output\" ng-bind=\"name\"></span>\n</body>\n</html>\n\
  ```\n\n***\n\n网页一加载，AngularJS 就开始工作。`ng-app` 指令告诉 AngularJS 在这种情况下，包含 AngularJS\
  \ 应用程序的是 `<body>` 元素。`ng-model` 指令将字段包含的值绑定到变量 `name`。同样，`ng-bind` 指令将 `<span>`\
  \ 元素的 HTML 内容绑定到变量 `name`。通过这种方式，`<span>` 元素变成了我们 MVC 框架中的视图。\n\n现在，输入字段中的任何更改都会立即反映在\
  \ `<span>` 元素中，如图 20.2 所示。\n\n![Image](img/image00464.jpeg)\n\n**图 20.2** 一个简单的\
  \ AngularJS \n\n这就是全部。我们已经拥有了一个动态动态应用程序，我们不需要担心编写数据绑定和更新的代码，也不需要指定任何模型。事实上，我们还没有编写任何自己的\
  \ JavaScript！这个应用程序尽管简单，但因为 AngularJS 的设计已经运行了。\n\n### 作用域\n\n作用域（Scope）是一个将 DOM\
  \ 元素（MVC 架构的 `view` 部分）链接到控制器的对象；在 MVC 术中，该对象变成了 `model`。控制器和视图都可以访问作用域模型，因此它可以它们之间的通信。此作用域对象将存放视图中使用的数据和方法。所有的\
  \ AngularJS 应用程序都有 `$rootScope`。`$rootScope` 是顶级作用域，属于包含 `ng-app` 指令的 DOM 元素。当应用程序中没有设置式作用域时，这就是\
  \ AngularJS 用于绑定数据函数的作用域。这就是为什么前面的示例有效。为了更好地了解作用域的工作原理，让我们为特定的 DOM 元素附加控制器，为该元素创建一个作用域，然后与其交互。\n\
  \n### 指令\n\n你在上一个示例中看到了几个指令。在 AngularJS 中，`directive` 是附加到 DOM 元素的函数，具有运行方法、附加控制器和作用域对象以及操作\
  \ DOM 的能力。当 AngularJS 应用程序启动且 Angular 开始遍历 DOM（从具有 `ng-app` 属性的 DOM 元素开始）时，它将解析代码并收集和运行这些指令。\n\
  \n指令处理了使 AngularJS 应用程序动态化的所有困难工作。我们之前见过了一些指令示例，包括 `ng-model` 和 `ng-bind`：\n\n```html\n\
  <body ng-app>\n  <p>Name: <input type=\"text\" ng-model=\"name\"></p>\n  <span id=\"\
  output\" ng-bind=\"name\"></span>\n</body>\n```\n\n#### 表达式\n\n使用双大括号来包围一个表达式指令：\n\
  \n```html\n{{ expression }}\n```\n\n\n\n\n\nAngularJS 表达式与 JavaScript 表达式非常相似，它们都可以包含字面量、操作符和变量。以下都是有效的\
  \ AngularJS 表达式：\n\n点击此处查看代码图片\n\n```html\n{{ 3 + 9 }}\n{{ quantity * cost }}\n\
  {{ firstName + \" \" + lastName }}\n```\n\nAngularJS 表达式在编写表达式的精确位置被解释为数据。\n\n###\
  \ ng-init\n`ng-init` 指令在启动时运行，在 AngularJS 运行任何应用程序代码之前执行。通过它，你可以在运行其他函数之前设置默认变量。\n\
  \n### ng-click\n`ng-click` 指令在 DOM 元素上附加一个监听器。当元素被点击时，AngularJS 会执行指令中定义的表达式。\n\n\
  ### ng-repeat\n`ng-repeat` 指令遍历集合并为每个项目加载模板。它所复制的模板是带有 `ng-repeat` 属性的元素。\n\n```javascript\n\
  $scope.departments = [\n  { name: 'Sales'},\n  { name: 'Support'},\n  { name: 'Production'},\n\
  \  { name: 'Shipping'}\n];\n```\n\n你可以使用 `ng-repeat` 遍历它们：\n\n点击此处查看代码图片\n\n```html\n\
  <<ul>\n  <li ng-repeat=\"dept in departments\">{{ dept.name }}</li>\n</ul>\n```\n\
  \n在这里，`li` 元素将被克隆四次，生成发送到视图的列表。\n\n### 过滤器 Filters\n过滤器的作用是从数组中选择项目的子集并将其作为新数组返回。以下是你对数组进行的一些操作：\n\
  \n![Image](img/image00365.jpeg) 使用 `currency` 将数字格式化为货币格式。\n![Image](img/image00365.jpeg)\
  \ 使用 `filter` 从数组中选择子集。\n![Image](img/image00365.jpeg) 使用 `lowercase` 将字符串格式化为小写。\n\
  ![Image](img/image00365.jpeg) 使用 `orderBy` 根据表达式对数组进行排序。\n![Image](img/image00365.jpeg)\
  \ 使用 `uppercase` 将字符串格式化为大写。\n\n以下是 AngularJS 中过滤器的通用语法：\n\n点击此处查看代码图片\n\n`{{ filter_expression\
  \ | filter : comparator }}`\n\n假设你想要对某些数值数据应用 `currency` 过滤器：\n\n点击此处查看代码图片\n\n\
  ```html\n<div ng-app>\n  Total: <input type=\"number\" ng-model=\"netTotal\">\n\
  \  Tax: <input type=\"number\" ng-model=\"tax\">\n  <p>Invoice Total = {{ (netTotal\
  \ + tax) | currency }}</p>\n</div>\n```\n\n在这个示例中，表达式 `{{ netTotal + tax }}` 将被求值，结果将会被格式化为货币。\n\
  \n### 向指令中添加过滤器\n过滤器也可以通过管道符（`|`）后跟过滤器描述来添加到任何 `ng-` 指令中：\n\n点击此处查看代码图片\n\n```html\n\
  <ul>\n  <li ng-repeat=\"dept in departments | filter: uppercase\">{{ dept.name }}</li>\n\
  </ul>\n```\n\n此示例将以大写形式显示所有项目。\n\n### 构建 AngularJS 应用程序\n你现在已经有了足够的知识来组合一个基础应用程序。\n\
  \n### 动手尝试：一个基础应用程序\n我们将从一个基础 HTML 页面开始，该页面包含一个接受用户搜索字符串的文本输入框以及一个用于包含搜索结果列表的 `div`\
  \ 元素。列表 20.2 显示了该页面的基础 HTML，其中包含了 AngularJS 框架。\n\n**列表 20.2 应用程序的 HTML 代码**\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>AngularJS Example</title>\n \
  \ <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body>\n  <p>Search: <input type=\"text\"></p>\n  <div id=\"\
  list-container\">\n    <ul>\n      <li></li>\n    </ul>\n  </div>\n</body>\n</html>\n\
  ```\n\n接下来，我们将对页面应用必要的 `ng-` 指令：\n- 为 `body` 元素应用 `ng-app`，将其定义为应用程序的容器。\n- 为搜索字段应用\
  \ `ng-model`，将其定义为 MVC 框架中的模型。\n- 为搜索结果列表中的 `li` 元素应用 `ng-repeat`。`li` 元素将为每个结果重复。\n\
  \n我们还将使用 `ng-init` 来设置一些初始数据。在现实情况下，这些数据更有可能从外部源（如服务器端数据库）引入，但对于我们的示例已经足够。\n\n```javascript\n\
  ng-init=\"departments = [\n  { name: 'Sales', contact: 'Marsha Brown'},\n  { name:\
  \ 'Support', contact: 'Dave Price'},\n  { name: 'Production', contact: 'Grant Wales'},\n\
  \  { name: 'Service', contact: 'Sherry Dell'},\n  { name: 'Administration', contact:\
  \ 'Sally Bennett'},\n  { name: 'Accounting', contact: 'Kim Sutherland'},\n  { name:\
  \ 'Shipping', contact: 'Sandy Connell'}]\n```\n\n我们的初始数据包含一个虚构部门的数组，每个部门包含部门名称和负责该部门的员工名称。列表\
  \ 20.3 显示了修改后的 HTML，为了效果，它还包含了一点 CSS 样式。\n\n**列表 20.3 应用程序修改后的代码**\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title>AngularJS Example</title>\n  <style>\n\
  \    body {\n      background-color: #ddf;\n      font: 16px helvetica, arial, sans-serif;\n\
  \    }\n    input {\n      padding: 10px;\n    }\n    #list-container {\n      background-color:\
  \ white;\n      color: #448;\n      border-radius: 25px;\n      border: 1px solid\
  \ black;\n      padding: 25px;\n    }\n  </style>\n  <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body ng-app ng-init=\"departments = [\n  { name: 'Sales',\
  \ contact: 'Marsha Brown'},\n  { name: 'Support', contact: 'Dave Price'},\n  { name:\
  \ 'Production', contact: 'Grant Wales'},\n  { name: 'Service', contact: 'Sherry\
  \ Dell'},\n  { name: 'Administration', contact: 'Sally Bennett'},\n  { name: 'Accounting',\
  \ contact: 'Kim Sutherland'},\n  { name: 'Shipping', contact: 'Sandy Connell'}]\"\
  >\n  <p>Search Departments: <input type=\"text\" placeholder=\"Enter search string\"\
  \ ng-model=\"searchString\"></p>\n  <div id=\"list-container\">\n    <ul>\n    \
  \  <li ng-repeat=\"dept in departments\">{{ dept.name }}</li>\n    </ul>\n  </div>\n\
  </body>\n</html>\n```\n\n将此代码保存为 `.html` 文件并在浏览器中打开。你应该能在页面上看到列出的部门，看起来就像图 20.3\
  \ 所示。\n\n**图 20.3 准备就绪的应用程序**\n\n一切都很好，但目前搜索字段还没有任何作用。我们将通过在 `ng-repeat` 指令中添加过滤器来修复这个问题，基于搜索字段中输入的数据，如列表\
  \ 20.4 所示。\n\n**列表 20.4 最终确定的应用程序**\n\n\n\n\n\n```html\n  { name: 'Support', contact:\
  \ 'Dave Price'},\n  { name: 'Production', contact: 'Grant Wales'},\n  { name: 'Service',\
  \ contact: 'Sherry Dell'},\n  { name: 'Administration', contact: 'Sally Bennett'},\n\
  \  { name: 'Accounting', contact: 'Kim Sutherland'},\n  { name: 'Shipping', contact:\
  \ 'Sandy Connell'}]\n</div>\n<div id=\"list-container\">\n  <ul>\n    <li ng-repeat=\"\
  dept in departments | filter: searchString\">{{ dept.name + \" (\" + dept.contact\
  \ + \")\" }}</li>\n  </ul>\n</div>\n</body>\n</html>\n```\n\n这就是我们需要做的全部工作！AngularJS\
  \ 会处理数据绑定，因此过滤器会在用户输入时实时起作用（请参见 图 20.4）。\n\n**图 20.4** 过滤器指令在输入时起作用\n\n### 总结\n\n\
  在这一小时中，你学习了模型-视图-控制器（MVC）框架架构的基础知识，以及如何将其有效地应用于 Web 应用程序。\n\n你接触了 Google 的 AngularJS\
  \ 框架，并使用它在很少或无需额外代码的情况下构建了一个简单的 Web 应用程序。\n\n事实上，我们仅仅触及了 AngularJS 能力的皮毛。访问官方网站\
  \ [`angularjs.org/`](https://angularjs.org/) 了解更多信息。\n\n## 问答\n\n**Q. AngularJS\
  \ 的背景是什么？**\n\n**A.** AngularJS 由一家名为 Brat Tech LLC 的公司在 2009 年开发，最初是商业 JSON 存储服务的一部分。它后来作为开源库发布，由\
  \ Google 员工继续进行维护和支持。\n\n**Q. 我可以在哪里获取 AngularJS 的文档和帮助？**\n\n**A.** 官方网站 [`angularjs.org/`](https://angularjs.org/)\
  \ 提供了详尽文档、教程、开发者指南以及更多内容的链接。\n\n## 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n\
  **1。** MVC 框架中的 M 代表什么？\n\n**a.** Mirror（镜像）\n\n**b.** Managed（托管）\n\n**c.** Model（模型）\n\
  \n**2。** 在 AngularJS 应用中，`ng-` 指令被添加到：\n\n**a.** 文档头部（head）\n\n**b.** 页面元素中\n\n\
  **c.** 链接到文档的独立文件中\n\n**3。** `ng-init` 指令在何时运行：\n\n**a.** 在应用程序启动时，在 AngularJS 应用代码运行之前\n\
  \n**b.** 用户调用时\n\n**c.** 应用程序终止后\n\n#### 答案\n\n**1。** c. Model（模型）\n\n**2。** b.\
  \ 页面元素中\n\n**3。** a. 在应用程序启动时，在 AngularJS 应用代码运行之前\n\n## 练习\n\n修改“自己尝试一下”示例的代码，仅在部门名称内进行搜索，但在显示的列表中仍需报告部门名称和联系人名称。\n\
  \n查看 AngularJS API 文档 [`docs.angularjs.org/api`](https://docs.angularjs.org/api)，发现你还能用\
  \ AngularJS 做更多事情。\n\n## 第 21 小时 网页之外的 JavaScript\n\n你将在这一小时中学习到：\n\n一些应用程序示例。\n\
  \n如何编写。\n\n到目前，你已经学习了一系列。\n\n在这一小时中，你将尝试。\n\n### 编写 Chrome 扩展程序\n\n扩展是运行在浏览器内部的小程序，提供额外的服务并自定义用户体验。Chrome\
  \ 扩展程序本质上是一个包含文件（HTML、CSS、JavaScript 等）的 `.zip` 压缩包（尽管它被重命名为 `.crx` 文件）。\n\n###\
  \ 浏览器之外\n\n扩展程序可以与 页面交互。\n\n### 构建简单的扩展程序\n\n第一步是在你的计算机上创建一个文件夹来包含代码。\n\n每个扩展程序都有一个名为\
  \ `manifest.json` 的清单文件，它提供了重要信息。清单文件可以包含各种参数和选项，但在这里我们将从一个基础示例开始。在你的新文件夹中创建一个文本文件\
  \ `manifest.json` 并编辑如下：\n\n```json\n{\n  \"name\": \"My First Extension\",\n  \"\
  version\": \"1.0\",\n  \"manifest_version\": 2,\n  \"description\": \"Hello World\
  \ extension.\",\n  \"browser_action\": {\n    \"default_icon\": \"icon.png\",\n\
  \    \"default_popup\": \"popup.html\"\n  },\n  \"web_accessible_resources\": [\n\
  \    \"icon.png\",\n    \"popup.js\"\n  ]\n}\n```\n\n在同一文件夹中放入名为 `icon.png` 的图标——我使用了一个小的星形图形，但你可以使用任何喜欢的图片。创建列表\
  \ 21.1 中列出的 `popup.html` 文件并将其放入文件夹。\n\n**列表 21.1 popup.html Google Chrome 扩展程序**\n\
  \n\n\n\n\n```html\n<style>\n    body {\n        width: 350px;\n    }\n    div {\n\
  \        border: 1px solid black;\n        padding: 20px;\n        font: 20px normal\
  \ helvetica, verdana, sans-serif;\n    }\n</style>\n<script src=\"popup.js\"></script>\n\
  </body>\n</html>\n```\n\n***\n\n以下是 `popup.js` 中包含的 JavaScript 代码：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction sayHello() {\n    var message = document.createTextNode(\"\
  Hello World!\");\n    var out = document.createElement(\"div\");\n    out.appendChild(message);\n\
  \    document.body.appendChild(out);\n}\nwindow.onload = sayHello;\n```\n\n这一切的作用是在页面加载时，创建一个包含消息“Hello\
  \ World!”的 `<div>` 元素，并将其添加到 DOM 的 `<body>` 元素中。\n\n现在，点击设置图标并选择**更多工具 > 扩展程序**来显示\
  \ Chrome 扩展程序页面。\n\n点击“开发者模式”旁边的框框以显示更多信息。\n\n然后点击“加载已解的扩展程序”按钮。导航到包含你的扩展程序的文件夹并选择它。你应该能看到图\
  \ 21.1 所示的内容。\n\n![Image](img/image00467.jpeg)\n\n**图 21.1** 在扩展程序页面上显示的新扩展程序\n\n\
  通过勾选旁边的框框确保扩展程序已启用。现在可以通过点击工具栏上的图标来运行扩展程序，如图 21.2 所示。\n\n![Image](img/image00468.jpeg)\n\
  \n**图 21.2** 作为 Google Chrome 扩展程序的 Hello World\n\n### 调试扩展程序\n\n右键点击启动扩展程序的图标，你会看到一个内容菜单，其中包含启用和禁用扩展程序的选项，还有一个名为\
  \ `Inspect popup`检查弹出窗口）的选项。点击它，Chrome 开发者工具就会弹出，让你检查弹出窗口，如图 21.3](#part0035.xhtml_ch21fig03)所示。\n\
  \n![Image](img/image00469.jpeg)\n\n**图 21.3** 检查弹出窗口\n\n***\n\n### 动手尝试：一个获取机场信息的\
  \ Chrome 扩展程序\n\n这次你将创建一个稍微好用的 Chrome 扩展程序。在 jQuery 库的帮助下，你的弹出窗口将检索美国机场的当前信息。\n\n\
  ***\n\n### 提示\n\n如果你需要复习 jQuery 库，请参考第 15 小节，“深入了解 jQuery](#part0028.xhtml_ch15)”。\n\
  \n***\n\n为了实现这一点，你需要让代码对 `http://services.faa.gov/` 的信息源进行 Ajax 调用。为了演示该服务如何工作，请打开浏览器并导航到\
  \ `http://services.faa.gov/airport/status/SFO?format=application/json`。\n\n“SFO”是旧金国际机场的三个字母代码；你可以将上述\
  \ URL 中的替换为另一个美国机场的代码；例如，你可以使用 LAX 代表洛杉矶国际机场，或使用 SEA 代表西雅图-塔科马国际机场。\n\n***\n\n###\
  \ 提示\n\n你可以在 `http://www.fly.faa.gov/flyfaa/usmap.jsp` 读取机场代码并查看它们位置。\n\n***\n\n\
  `format` 参数告诉服务你想要以 JSON 字符串返回信息：\n\n点击此处查看代码图片\n\n```json\n{\n  \"name\":\"San\
  \ Francisco International\",\n  \"ICAO\":\"KSFO\",\n  \"state\":\"California\",\n\
  \  \"status\":\n    \"avgDelay\":\"\",\n    \"closureEnd\":\"\",\n    \"closureBegin\"\
  :\"\",\n    \"type\":\"\",\n    \"minDelay\":\"\",\n    \"trend\":\"\",\n    \"\
  reason\":\"No known delays for this airport.\",\n    \"maxDelay\":\"\",\n    \"\
  endTime\":\"\"\n  },\n  \"delay\":\"false\",\n  \"IATA\":\"SFO\",\n  \"city\":\"\
  San Francisco\",\n  \"weather\":\n    \"weather\":\"Partly Cloudy\",\n    \"meta\"\
  :\n      \"credit\":\"NOAA's National Weather Service\",\n      \"url\":\"http://weather.gov/\"\
  ,\n      \"updated\":\"1:56 AM Local\"\n    },\n    \"wind\":\"Southwest at 9.2mph\"\
  ,\n    \"temp\":\"44.0 F (6.7 C)\",\n    \"visibility\":\"10.00\"\n}\n```\n\n你的代码将解析返回的信息并使用它构建更用户友好的显示。\n\
  \n要开始项目，在你的计算机某处创建一个新目录并将其命名为“airport”。在此目录中，你需要三个文件，如上一个示例所示。\n\n#### 图标文件\n\n\
  选择一个显示在 Chrome 工具栏上并从中启动扩展程序的图标。我使用了一个名为 `plane.png` 的文件中 20 × 20 像素的飞机图标，但你可以使用你手头有的任何图标。\n\
  \n#### manifest.json 文件\n\n清单文件将与上一个示例非常相似，但有一个显著的添加：一个新参数 `permissions`。你将对 `services.faa.gov`\
  \ 发起 Ajax 调用以获取你所需的信息，而 Ajax 调用只能对调用者相同域的页面进行；添加 `permissions` 条目允许 Chrome 通过向服务器发送合适的标头来满足这一要求。`manifest.json`\
  \ 文件所示于列表 21.2。\n\n**列表 21.2 manifest.json 文件**\n\n点击此处查看代码图片\n\n***\n\n```json\n\
  {\n  \"name\": \"Airport Information\",\n  \"version\": \"1.0\",\n  \"manifest_version\"\
  : 2,\n  \"description\": \"Information on US airports\",\n  \"browser_action\":\
  \ {\n    \"default_icon\": \"plane.png\",\n    \"default_popup\": \"popup.html\"\
  \n  },\n  \"web_accessible_resources\": [\n    \"plane.png\",\n    \"popup.js\"\n\
  \  ],\n  \"permissions\": [\n    \"http://services.faa.gov\"\n  ]\n}\n```\n\n***\n\
  \n#### HTML 文件\n\n一旦 HTML HTML 文件将是 `popup.html`。只要你编辑 `manifest.json` 并适当设置值，你就可以将其命名为其他名称。\n\
  \n简单的页面如列表 21.3 所示。\n\n**列表 21.3 HTML**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \    <title>Airport Information</title>\n    <style>\n        body {\n         \
  \   width: 350px;\n            font: 20px normal helvetica, verdana, sans-serif;\n\
  \        }\n        #info {\n            border: 1px solid black;\n            padding:\
  \ 20px;\n        }\n    </style>\n</head>\n<body>\n    <h2>Airport Information</h2>\n\
  \    <input type=\"airportCode\" value=\"SFO\" size=\"6\" />\n    <input id=\"btn\"\
  \ type=\"button\" value=\"Get Information\" />\n    <div id=\"info\"></div>\n</body>\n\
  </html>\n```\n\n***\n\n除了一些简单的 CSS 样式外，页面只包含几个项目：一个接受机场代码的输入框（默认值为 SFO），一个用于获取数据的按钮，以及一个用于存放结果的\
  \ `<div>`。\n\n现在你需要向页面添加 JavaScript。\n\n你将使用 jQuery 来简化工作，所以首先你需要包含它。Google Chrome\
  \ 安全策略不允许使用内容分发网络，因此我们需要下载并包含 jQuery 库的副本：\n\n点击此处查看代码图片\n\n```html\n<script src=\"\
  jquery-1.11.2.min.js\"></script>\n```\n\n当页面加载后，你需要为“获取信息”按钮附加代码。按钮需要根据输入字段中的机场代码构建所需的\
  \ URL 并启动 Ajax 调用。由于远程服务可能需要一些时间才能响应，如果用户能收到一个指示程序运行的小消息会更好。\n\n以下是执行这些任务的代码：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n    $(\"#btn\").click(function(){\n\
  \        $(\"#info\").html(\"Getting information ...\");\n        var code = $(\"\
  #airportCode\").val();\n        $.get(\"http://services.faa.gov/airport/status/\"\
  \ + code + \"?format=application/json\",\n            '',\n            function(data){\n\
  \                displayData(data);\n            }\n        );\n    });\n});\n```\n\
  \n一旦页面加载，jQuery 会为按钮的 `onclick` 事件处理程序添加代码。\n\n\n\n\n\n首先，它使用 `jQuery` 的 `html()`\
  \ 方法向输出 `<div>` 元素添加一条用户消息。当接收到“真实”信息时，该消息将被覆盖。\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#info\").html(\"Getting information ...\");\n```\n\n接下来，从输入字段中获取所需的机场代码：\n\n\
  点击此处查看代码图片\n\n```javascript\nvar code = $(\"#airportCode\").val();\n```\n\n然后组合\
  \ Ajax 调用，这里使用了 `GET` 方法：\n\n点击此处查看代码图片\n\n```javascript\n$.get(\"http://services.faa.gov/airport/status/\"\
  \ + code + \"?format=application/json\",\n    '',\n    function(data){\n       \
  \ displayData(data);\n    }\n);\n```\n\n为 Ajax 调用指定的回调函数是 `displayData()`，它将格式化返回的数据并显示给用户。这里是\
  \ `popup.js` 的完整内容，包含了回调函数：\n\n点击此处查看代码图片\n\n```javascript\nfunction displayData(data)\
  \ {\n    var message = \"Airport: \" + data.name + \"<br />\";\n    message += \"\
  <h3>STATUS:\";\n    for (i in data.status) {\n        if(data.status[i] != \"\"\
  ) message += i + \": \" + data.status[i] + \"<br />\";\n    }\n    message += \"\
  <h3>WEATHER:\";\n    for (i in data.weather) {\n        if(i != \"meta\") message\
  \ += i + \": \" + data.weather[i] + \"<br />\";\n    }\n    $(\"#info\").html(message);\n\
  }\n\n$(document).ready(function(){\n    $(\"#btn\").click(function(){\n        $(\"\
  #info\").html(\"Getting information ...\");\n        var code = $(\"#airportCode\"\
  ).val();\n        $.get(\"http://services.faa.gov/airport/status/\" + code + \"\
  ?format=application/json\",\n            '',\n            function(data){\n    \
  \            displayData(data);\n            }\n        );\n    });\n});\n```\n\n\
  回想第 10 小，`JSON`，JSON 数据可以被解释为 JavaScript 对象的层次结构。`displayData(data)` 函数接收返回的 JSON\
  \ 对象，并提取 `data.name`（字符串）、`data.status` 和 `data.weather`（它们也是对象）来构建消息。\n\n提示 回顾几页前远程服务器返回的\
  \ JSON 数据，看看这些值是如何编码的。\n\n包含代码的完整 HTML 页面位于列表 21.4。\n\n### 列表 21.4 扩展程序完整的 popup.html\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Airport Information</title>\n\
  \    <style>\n        body {\n            width:350px;\n            font:12px normal,\
  \ verdana, sans-serif;\n        }\n        #info {\n            border: 1px solid\
  \ black;\n            padding: 10px;\n        }\n    </style>\n    <script src=\"\
  jquery-11.2.min.js\"></script>\n    <script src=\"popup.js\"></script>\n</head>\n\
  <body>\n    <h2>Airport Information</h2>\n    <input type=Text id=\"airportCode\"\
  \ value=\"SFO\" size=\"6\" />\n    <input id=\"btn\" type=\"button\" value=\"Get\
  \ Information\" />\n    <div id=\"info\"></</div>\n</body>\n</html>\n```\n\n在在分配的目录中组好所需的文件后，你可以像上一个例子一样将扩展程序添加到\
  \ Google Chrome 中。\n\n点击关联的图标会弹出一个小型表单，你可以在其中输入你选择的机场代码。点击“获取信息（Get Information）”按钮将使程序咨询远程服务，将返回的信息组合成可读的形式，并在弹出窗口中呈现出来。\n\
  \n图 21.4 显示了运行中的扩展程序。\n\n![Image](img/image00470.jpeg)\n\n**图 21.4** 机场信息扩展程序\n\n\
  ### 打包扩展程序\n\n当你完成扩展程序的开发后，点击扩展页面上的“打包扩展程序（Pack Extension）”按钮。你的扩展程序将被打包成一个 `.crx`\
  \ 文件。你可以从网页中提供该 `.crx` 文件，访问者可以在他们自己的 Google Chrome 中安装它。\n\n## 进阶\n\n本小时的练习仅仅触及了\
  \ Chrome 扩展程序能做的事情的皮毛。因为 Chrome 对 HTML5 和 CSS3 有很好的支持，你可以在扩展中使用最新的 Web 技术，如 `canvas`、`localStorage`\
  \ 和 CSS 动画，还可以访问外部 API 和数据源。你的扩展程序甚至为 Chrome 浏览器的用户界面添加按钮，或者创建浏览器窗口之外的弹出通知。\n\n\
  ### 总结\n\n在本小时中，你学习了 JavaScript 在 HTML 网页之外的一些应用。例如，你使用 JavaScript 为 Google Chrome\
  \ 浏览器编写了一个小型扩展程序。\n\n## 问与答\n\n**Q. 我可以用类似于此处描述 Chrome 扩展程序的方法编写 Firefox 扩展程序吗？**\n\
  \n**A.** Mozilla 创建扩展程序的方法稍微复杂一点；\n\n\n\n\n\n到本书为止，我一直提到了编码中的某些优点和坏处。在这一节中，我们将所有这些内容整合起来，为良好的编码实践制定一些通用指南。\n\
  \n### 不要过度使用 JavaScript\n\n你需要多少 JavaScript？人们往往倾向于在并不绝对或不建议的情况下加入 JavaScript 代码和增强交互效果。\n\
  \n![Image](img/image00365.jpeg) 务要记住，你的用户可能将大部分上网时间都花在了你以外的网站上。经验丰富的互联网用户已经习惯了菜单、面包屑导航和标签页浏览等流行的界面组件。这些元素之所以流行，广而言之是因为它们运行良好、可以做得美观，并且不需要用户先阅读手册。对一个网站操作的熟悉程度，是否可能比你那些全方位、酷炫的设计带来的潜在收益更能提高用户的生产力？\n\
  \n![Image](img/image00365.jpeg) 许多曾经需要用 JavaScript 代码的视觉效果，现在可以使用 CSS 完美地实现。在两种方法都可行的情况下（鼠标悬停效果和某些类型的菜单是立刻提到的例子），CSS\
  \ 通常是首选。它在浏览器中得到了良好的支持（尽管存在一些细微差异），而且不像那样经常被用户禁用。在 CSS 不支持的罕见情况下，页面将渲染为标准的 HTML，通常会留下一个至少功能完整的页面，即使它看起来并不漂亮。\n\
  \n![Image](img/image00365.jpeg) 世界上许多地区的用户仍在使用过时、性能不足的旧电脑，并且可能拥有缓慢和/或不可靠的网络访问。你那些不需要的代码所占据\
  \ CPU 周期对他们来说可能是宝贵的。\n\n![Image](img/image00365.jpeg) 在某些情况下，你可能会损失一定的搜索引擎页面排名，因为它们的爬虫并不总是能正确索引由\
  \ JavaScript 生成的内容，或需要它来完成导航的设计。\n\n如果使用得当且深思熟虑，JavaScript 可以成为一个强大的工具，但有时好过物得其反。\n\
  \n### 编写可读且可维护的代码\n\n无法预知某一天会有谁需要阅读并理解你的代码。即使那个人是你自己，可能也已经隔了几年和许多项目；在编写时你如此熟悉的代码，在日后可能会变得神秘莫。如果必须由他人来解释你的代码，他们可能不会认同你的编码风格、命名规范或专业领域，而且你可能无法为他们提供帮助。\n\
  \n#### 明智地使用注释\n\n在代码的关键位置选择恰当的注释，可以在这种情况下产生巨大的影响。注释是你为后来者提供的笔记和提示。技巧在于判断哪些注释可能是是有用的。这个主题经常引发争议，观点差异很大，因此接下来的内容很大程度上是我个人的观点。\n\
  \n假设最终阅读你代码的人对 JavaScript 有所了解或许是合理的，因此对语言本身工作原理的注释就有点过头了；JavaScript 开发者的风格和能力差异很大，但我们共同拥有的的一点就是语言语法！\n\
  \n阅读代码时更难解释的是代码运行背后的思维过程和算法。个人认为，阅读他人编写的代码时，看到以下内容非常有帮助：\n\n![Image](img/image00365.jpeg)\
  \ 任何包含超过几行简单代码的对象或函数的前序言。\n\n点击此处查看代码图像\n\n```javascript\nfunction calculateGroundAngle(x1,\
  \ y1, z1, x2, y2, z2) {\n    /**\n     * 计算两点之间的直线与\n     * 地面平面交叉时的弧度角。\n     *\
  \ @author Phil Ballard phil@www.example.com\n     */\n    if(x1 > 0) {\n       \
  \ .... more statements\n    }\n}\n```\n\n![Image](img/image00365.jpeg) 在代码可能会引起困惑或容易误解的地方添加内联注释。\n\
  \n点击此处查看代码图像\n\n```javascript\n// 出性能考虑，需要使用我们的自定义排序方法\nvar finalArray = rapidSort(allNodes,\
  \ byAngle) {\n    .... more statements\n}\n```\n\n![Image](img/image00365.jpeg)\
  \ 在原作者可以传递读者可能不知道的专业知识的地方添加注释。\n\n点击此处查看代码图像\n\n```javascript\n// 针对浏览器 X 版本 Y 中图像加载\
  \ bug 的变解决方案\nif(!loaded(image1)) {\n    .... more statements\n}\n```\n\n![Image](img/image00365.jpeg)\
  \ 常用代码修改的说明。\n\n点击此处查看代码图像\n\n```javascript\n// 你可以根据喜更改以下维度：\nvar height = 400px;\n\
  var width = 600px;\n```\n\n**提示**\n各种方案使用代码注释来帮助你为软件生成文档。例如，参见 http://code.google.com/p/.\n\
  \n#### 选择有用的文件、属性和方法名称\n\n通过使代码能够自注释，可以大大减少源代码所需的注释量。你可以通过为方法和属性选择有意义的名称向这一目标努力。\n\
  \nJavaScript 对方法（或函数）和属性（或变量）名称中允许字符有规定，但仍有很多创意空间。\n\n一种流行的约定是将常量名全大写：\n\n`MONTHS_PER_YEAR\
  \ = 12`\n\n对于普通的函数、方法和变量名，所谓的 `CamelCase`（驼峰命名法）是一个流行的选择；除了第一个单词外，由多个单词构造的名称：\n\n\
  `var surname = \"Smith\"`\n`var lastProcessed = 16`\n\n建议用于实例化对象的构造函数首字母大写：\n\n\
  点击此处查看代码图像\n\n```javascript\nfunction Car(make, model, color) {\n    .... statements\n\
  }\n```\n\n大写字母提醒人们需要使用 `new` 关键字：\n\n点击此处查看代码图像\n\n`var herbie = new Car('VW', 'Beetle',\
  \ 'white');`\n\n#### 在可能的地方复用代码\n\n通常情况下，代码模块化程度越高，就越好。看下这个函数：\n\n点击此处查看代码图像\n\n\
  ```javascript\nfunction getElementArea() {\n    var high = document.getElementById(\"\
  id1\").style.height;\n    var wide = document.getElementById(\"id1\").style.width;\n\
  \    return high * wide;\n}\n```\n\n该函数尝试返回特定 HTML 元素覆盖的屏幕面积。遗憾的是，它只能对 `id = \"\
  id1\"` 的元素起，这实际上没有任何帮助。\n\n我们可以通过传递要应用操作的元素 ID 作为参数，为函数提供*更高层次的抽象*，使其用途更通用：\n\n\
  点击此处查看代码图像\n\n```javascript\nfunction getElementArea(elementId) {\n    var elem\
  \ = document.getElementById(elementId);\n    var high = elem.style.height;\n   \
  \ var wide = elem.style.width;\n    return parseInt(high) * parseInt(wide);\n}\n\
  ```\n\n现在你可以为任何具有 ID 的元素调用你的函数了：\n\n点击此处查看代码图像\n\n```javascript\nvar area1 = getElementArea(\"\
  id1\");\nvar area2 = getElementArea(\"id2\");\n```\n\n### 不要假设\n\n在之前的函数中，当我们传递一个与页面上任何元素都不对应的\
  \ `elementId` 值时会发生什么？函数会导致错误，并且代码执行停止。\n\n\n\n\n\n错误在于假设 `elementId` 将被传入一个有效值。让我们编辑\
  \ `getElementArea()` 函数，以检查页面元素是否确实存在，并且它具有数值型的面积：\n\n点击此处查看代码图片\n\n```javascript\n\
  function getElementArea(elementId) {\n    if(document.getElementById(elementId))\
  \ {\n        var elem = document.getElementById(elementId);\n        var high =\
  \ elem.style.height;\n        var wide = elem.style.width;\n        var area = parseInt(high)\
  \ * parseInt(wide);\n        if(!isNaN(area)) {\n            return area;\n    \
  \    } else {\n            return false;\n        }\n    } else {\n        return\
  \ false;\n    }\n}\n```\n\n这是一个改进。现在，如果函数无法返回数值面积，它将返回 `false`，可能是因为找不到相关的页面元素，也因为该\
  \ ID 对应的页面元素没有可访问的 `width` 和 `height` 属性。\n\n### 优雅降级 (Graceful Degradation)\n\n\
  早期的网络浏览器中，有些甚至不支持在 HTML 中包含图像。当 `<img>` 元素引入时，需要一种方法来让这些纯文本浏览器在遇到此类不支持的标签时，能够向用户展示一些有用的内容。\n\
  \n在 `<img>` 标签的情况下，这种功能是由 `alt`（替代文本）属性提供的。网页设计师可以为 `alt` 分配一段字符串文本，纯文本浏览器将向用户显示这些文本而不是显示图像。根据页面设计者的意愿，`alt`\
  \ 文本仅仅是图片的标题、对图片应显示内容的描述，或者是对图形中承载信息的替代来源的建议。\n\n这是“优雅降级”的早期示例，这种过程是指：当用户的浏览器缺乏所需的技术功能来充分利用网页的设计（或者禁用了这些功能），他们仍然可以尽可能地从网站内容中受益。\n\
  \n让我们以 JavaScript 本身作为另一个例子。几乎每个浏览器都支持 JavaScript，而且很少用户会关闭它。那么你真的需要担心那些没有启用 JavaScript\
  \ 的访问者吗？答案可能是肯定的。你网站的频繁访问者之一无疑是来自某个搜索引擎的爬虫程序，它们正忙于索引网页页面。爬虫会尝试遵循页面上所有的导航链接，以建立网站内容的完整索引；如果这种导航需要\
  \ JavaScript 的服务，你可能会发现网站的某些部分没有被索引。结果是你的搜索排名可能会受到影响。\n\n另一个重要的例子在于可访问性（accessibility）。无论浏览器程序多么强大，总有一些用户面临着其他局限，例如可能无法使用鼠标，或者必须使用屏幕阅读软件。如果你的网站不迎合这些用户，他们就不可能再次回来。\n\
  \n### 渐进增强 (Progressive Enhancement)\n\n当我们谈论优雅降级时，很容易想象一个功能完备、带有各种花哨功能的网页，它为浏览器能力较弱的用户提供慈善式的帮助。\n\
  \n渐进增强的支持者则倾向于从相反的角度来看问题。他们倾向于构建一个稳定、可访问且功能齐全的网站，其内容可以被几乎任何想象中的用户和浏览器访问，随后他们为那些能够利用这些功能的用户添加额外的可用性层。\n\
  \n这确保了网站即使在最基础的浏览器设置下也能运行，而更高级的浏览器只需获得一些额外的增强。\n\n#### 分离样式、内容和代码\n\n采用渐进增强技术的网页，核心资源是内容。HTML\
  \ 提供了标记设施来允许你语义化地描述内容；标记标签本身将页面元素识别为标题、表格、段落等。我们可以将其称为语义层。\n\n这种语义层理想情况下*不应*包含任何关于页面应该如何外观显示的信息。你可以在之后使用\
  \ CSS 技术添加这些额外信息，以形成表现层。通过将外部 CSS 样式表链接到文档中，你避免了任何与外观相关的信息出现在 HTML 标记本身。然而，即使是完全理解\
  \ CSS 的浏览器，也可以访问并显示页面的所有信息，尽管它看起来可能并不漂亮。\n\n当你现在把 JavaScript 引入其中时，你将其作为另一个逻辑层引入的——你可能将其视为行为层（behavior\
  \ layer）。没有 JavaScript 的用户仍然可以通过语义化标记访问页面内容；如果他们的浏览器理解 CSS，他们也将受益于表现层增强后的外观。如果行为层的\
  \ JavaScript 应用得当，它将为那些可以使用它的人提供更多功能性，而不会损害之前层的能力。\n\n为了实现这一点，你需要编写非侵入式的（unobtrusive）JavaScript。\n\
  \n### 非侵入式 JavaScript (Unobtrusive JavaScript)\n\n非侵入式 JavaScript 并没有正式定义，但构建其基础的概念都涉及维护行为层与内容、表现层之间的分离。\n\
  \n#### 让 HTML 保持原样\n\n第一个可能也是最重要的考虑因素是从页面标记中移除 JavaScript 代码。JavaScript 的早期应用通过内联事件处理器使\
  \ HTML 变得杂乱无章，例如本例中的 `onClick` 事件处理器：\n\n点击此处查看代码图片\n\n```html\n<input type=\"button\"\
  \ style=\"border: 1px solid blue;color: white\" onclick=\"doSomething()\" />\n```\n\
  \n如前一个例子那样的内联样式属性会让情况变得糟糕。\n\n幸运的是，你可以有效地将样式信息移到样式层，例如，通过在 HTML 标签上添加 `class` 属性来引用外部\
  \ CSS 文件中相关的样式声明：\n\n点击此处查看代码图片\n\n```html\n<input type=\"button\" class=\"blueButtons\"\
  \ onclick=\"doSomething()\" />\n```\n\n在相关的 CSS 定义中：\n\n```css\n.blueButtons {\n\
  \    border: 1px solid blue;\n    color: white;\n}\n```\n\n**提示**：当然，你可以通过多种不同的选择器之一来为按钮定义样式规则，包括\
  \ `input` 元素或通过 `id` 而不是 `class` 属性。\n\n为了让你的 JavaScript 非侵入式，你可以采用与我们用于 CSS 类似的技术。通过在\
  \ HTML 标记中的页面元素中添加 `id` 属性，你可以在外部 JavaScript 代码内部挂载所需的 `onClick` 事件监听器，将其保持在 HTML\
  \ 标记之外。这是修改后的 HTML 元素：\n\n点击此处查看代码图片\n\n```html\n<input type=\"button\" class=\"\
  blueButtons\" id=\"btn1\" />\n```\n\n`onClick` 事件处理器是在 JavaScript 代码内部挂载的：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction doSomething() {\n    .... statements ....\n}\ndocument.getElementById(\"\
  btn1\").onclick = doSomething;\n```\n\n**注意**：记住在 DOM 可用之前你无法使用 DOM 方法，因此任何此类代码必须通过\
  \ `window.onload` 等方法挂载，以保证 DOM 的可用性。书中有许多例子。\n\n#### 仅将 JavaScript 作为增强\n\n秉着渐进增强的精神，你希望页面即使在\
  \ JavaScript 关闭时也能运行。JavaScript 可能为页面可用性增加的任何改进，都应被视为那些浏览器设置允许其运行的用户的额外奖励。\n\n\n\
  \n\n让我们想象你想要编写一些表单验证代码——这是 JavaScript 的常见用途。这里有一个 HTML 搜索表单：\n\n点击此处查看代码图片\n\n```html\n\
  <form action=\"process.php\">\n  <input id=\"searchTerm\" name=\"term\" type=\"\
  text\" /><br />\n  <input type=\"button\" id=\"btn1\" value=\"Search\" />\n</form>\n\
  ```\n\n你想编写一个例程，在搜索字段为空时防止表单被提交。你可能会编写这个函数 `checkform()`，将其绑定到搜索按钮的 `onClick` 处理程序上：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction checkform() {\n    if(document.forms[0].term.value\
  \ == \"\") {\n        alert(\"Please enter a search term.\");\n        return false;\n\
  \    } else {\n        document.forms[0].submit();\n    }\n}\n\nwindow.onload =\
  \ function() {\n    document.getElementById(\"btn1\").onclick = checkform;\n}\n\
  ```\n\n这运行起来应该良好。但当 JavaScript 被禁用时会发生什么？按钮现在什么都不做，用户无法提交表单。你的用户肯定更希望表单可以使用，尽管没有了输入检查的增强。\n\
  \n让我们稍微修改一下表单，使用 `type=\"submit\"` 的输入按钮而不是 `type=\"button\"`，并编辑 `checkform()`\
  \ 函数：\n\n点击此处查看代码图片\n\n```html\n<form action=\"process.php\">\n  <input id=\"searchTerm\"\
  \ name=\"term\" type=\"text\" /><br />\n  <input type=\"submit\" id=\"btn1\" value=\"\
  Search\" />\n</form>\n```\n\n这里是修改后的 `checkform()` 函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  function checkform() {\n    if(document.forms[0].term.value == \"\") {\n       \
  \ alert(\"Please enter a search term.\");\n        return false;\n    } else {\n\
  \        return true;\n    }\n}\n\nwindow.onload = function() {\n    document.getElementById(\"\
  btn1\").onclick = checkform;\n}\n```\n\n如果 JavaScript 激活状态，向提交按钮返回 `false` 值将阻止按钮的默认操作，从而防止表单提交。然而，如果没有\
  \ JavaScript，点击按钮时表单仍然会提交。\n\n### 特性检测\n\n在可能的情况下，尝试直接检测浏览器功能的存在或否，并让你的代码仅在功能可用时使用这些功能。\n\
  \n例如，让我们来看 `clipboardData` 对象，在编写本文时，它仅在 Internet Explorer 中支持。在你的代码中使用此对象之前，最好的做法是进行几次测试：\n\
  \n![Image](img/image00365.jpeg) JavaScript 是否识别该对象的存在？\n\n![Image](img/image00365.jpeg)\
  \ 如果是，该对象是否支持你想要的方法？\n\n以下函数 `setClipboard()` 尝试使用 `clipboardData` 对象直接将特定文本写入剪贴板：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction setClipboard(myText){\n    if((typeof clipboardData\
  \ != 'undefined') && (clipboardData.setData)){\n        clipboardData.setData(\"\
  text\", myText);\n    } else {\n        document.getElementById(\"copytext\").innerHTML\
  \ = myText;\n        alert(\"Please copy the text from the 'Copy Text' field to\
  \ your clipboard\");\n    }\n}\n```\n\n首先它使用 `typeof` 测试对象的存在性：\n\n点击此处查看代码图片\n\n\
  ```javascript\nif((typeof clipboardData != 'undefined') ....\n```\n\n* * *\n\n注意\n\
  \n`typeof` 运算符返回以下内容之一，取决于操作数的类型：\n\n`\"undefined\"`、 `\"object\"`、 `\"function\"\
  `、 `\"boolean\"`、 `\"string\"` 或 `\"number\"`\n\n* * *\n\n此外，该函数还要求 `setData()`\
  \ 方法必须可用：\n\n点击此处查看代码图片\n\n```javascript\n... && (clipboardData.setData)){\n```\n\
  \n如果任一测试测试失败，用户将获得一种替代的、不那么优雅的方法来获取文本到剪贴板；它会被写入页面，并邀请用户：点击此处查看代码图片\n\n```javascript\n\
  document.getElementById(\"copytext\").innerHTML = myText;\nalert(\"Please copy the\
  \ text from the 'Copy Text' field to your clipboard\");\n```\n\n代码在任何地方都没有显式检测浏览器是否为\
  \ Internet Explorer（或其他任何浏览器）；不应该这样做。\n\n### 良好地处理错误\n\n当你的程序遇到错误时，可能是向用户显示消息，或者简单地保持活动状态。这对于用户来说都不好，因为他们可能不知道发生了什么错误或者该做什么。\n\
  \n使用 try 和 catch\n\n拦截错误并整洁地处理它们的有用方法是使用 `try` 和 `catch` 语句。\n\n`try` 语句允许你尝试一段代码。如果发生错误，可以使用\
  \ `catch` 语句来处理它。\n\n语法如下：\n\n```javascript\ntry {\n    // code\n} catch (err) {\n\
  \    // error handling\n}\n```\n\n`err` 是在捕获到错误时创建的对象。它包含了关于错误的信息，例如，如果你想提醒用户错误的性质，你可以使用：\n\
  \n```javascript\ntry {\n    // code\n} catch (err) {\n    alert(err.description);\n\
  }\n```\n\n偶尔你可能会发现自己处于必须让代码不具侵入性的位置。让我们用列表 22 中编写的一些代码来这样做。\n\n### 将代码转换为非侵入式\n\n\
  目前，此脚本有许多可以改进的区域：[part0066.xhtml_p22a]\n\n**列表 22.1 一个侵入式脚本**\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>Current Date and Time</title>\n  <style>\n   \
  \ p {font: 14px arial, helvetica;}\n  </style>\n  <script>\n    function telltime()\
  \ {\n      var out = \"\";\n      var now = new Date();\n      out += \"<br />Date:\
  \ \" + now.getDate();\n      out += \"<br />Month: \" + now.getMonth();\n      out\
  \ += \"<br />Year: \" + now.getFullYear();\n      out += \"<br />Hours: \" + now.getHours();\n\
  \      out += \"<br />Minutes: \" + now.getMinutes();\n      out += \"<br />Seconds:\
  \ \" + now.getSeconds();\n      document.getElementById(\"div1\").innerHTML = out;\n\
  \    }\n  </script>\n</head>\n<body>\n  The current date and time are:<br/>\n  <div\
  \ id=\"div1\"></div>\n  <script>\n    telltime();\n  </script>\n  <input type=\"\
  button\" onclick=\"location.reload()\" value=\"Refresh\" />\n</body>\n</html>\n\
  ```\n\n* * *\n\n自己试一下：将代码转换为非侵入式\n\n目前，此脚本有许多可以改进的区域：\n\n![Image](img/image00112.jpeg)\
  \ JavaScript 语句放置在页面 `<script>` 和 `</script>` 标签之间；它们放在单独的文件中更好。\n\n![Image](img/image00412.jpeg)\
  \ 按钮具有内联事件处理程序。\n\n\n\n\n\n![Image](img/image00412.jpeg) 没有启用 JavaScript 的用户只会看到一个无法运行的按钮。\n\
  \n首先，我们将所有的 JavaScript 移动到一个单独的文件中并移除内联事件处理程序。我们还给按钮分配了一个 `id` 值，以便我们可以在 JavaScript\
  \ 中识别它，并通过代码添加所需的事件处理程序。\n\n接下来，我们需要处理未启用 JavaScript 的用户的问题。我们使用 `<noscript>` 元素，使得未启用\
  \ JavaScript 的用户看到的不是按钮，而是一条短消息，并包含一个指向替代时间来源的链接：\n\n点击此处查看代码图像\n\n```html\n<noscript>\n\
      您的浏览器不支持 JavaScript<br />\n    请咨询您的计算机操作系统以获取本地日期和\n时间信息，或点击 <a href=\"clock.php\"\
  \ target=\"_blank\">这里</a>a 来读取服务器时间。\n</noscript>\n```\n\n* * *\n\n### 提示\n\n`<noscript>`\
  \ 元素为禁用了脚本或不支持客户端脚本的浏览器用户提供了额外的页面内容。任何可以放入 HTML 页面 `<body>` 元素中的元素都可以放入 `<noscript>`\
  \ 元素中，如果用户的浏览器无法运行脚本，这些元素将自动显示。\n\n* * *\n\n修改后的 HTML 文件列在列表 22.2 中。\n\n**列表 22.2\
  \ 修改后的 HTML 页面**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
      <title>当前日期和时间</title>\n    <style>\n       p {font: 14px normal arial, verdana,\
  \ helvetica;}\n    </style>\n    <script src=\"datetime.js\"></script>\n</head>\n\
  <body>\n    当前日期和时间为：<br/>\n    <div id=\"div1\"></div>\n  <input id=\"btn1\" type=\"\
  button\" value=\"Refresh\" />\n  <noscript>\n       <p>您的浏览器不支持 JavaScript。</p>\n\
         <p>请咨询您的计算机操作系统以获取本地日期和时间信息或点击 <a href=\"clock.php\" target=\"_blank\">这里</a>来读取服务器时间。</p>\n\
    </noscript>\n</body>\n</html>\n```\n\n* * *\n\n在我们的 JavaScript 源文件 `telltime.js`\
  \ 中，我们使用 `window.onload` 为按钮添加事件监听器。最后，我们调用 `telltime()` 生成显示在页面上的日期和时间信息。JavaScript\
  \ 代码如列表 22.3 所示。\n\n**列表 22.3 datetime.js**\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\n\
  function telltime() {\n    var out = \"\";\n    var now = new Date();\n    out +=\
  \ \"<br />Date: \" + now.getDate();\n    out += \"<br />Month: \" + now.getMonth();\n\
      out += \"<br />Year: \" + now.getFullYear();\n    out += \"<br />Hours: \" +\
  \ now.getHours();\n    out += \"<br />Minutes: \" + now.getMinutes();\n    out +=\
  \ \"<br />Seconds: \" + now.getSeconds();\n    document.getElementById(\"div1\"\
  ).innerHTML = out;\n}\nwindow.onload = function() {\n    document.getElementById(\"\
  btn1\").onclick= function() {location.reload()}\n    telltime();\n}\n```\n\n* *\
  \ *\n\n在启用 JavaScript 后，脚本的运行方式与第 4 小节中相同。然而，在禁用 JavaScript 的情况下，用户看到的页面如图 22.1\
  \ 所示。\n\n![Image](img/image00471.jpeg)\n\n**图 22.1** 为没有 JavaScript 的用户提供的额外信息\n\
  \n* * *\n\n### 总结\n\n在本节中，我们总结并展示了编写 JavaScript 良好实践的各种示例。结合使用这些方法应该帮助你更快地交付代码项目，具有更高的质量并更易于维护。\n\
  \n## 问答\n\n**问. 为什么用户会关闭 JavaScript？**\n\n**答.** 请记住，浏览器可能是由服务提供商或雇主设置的，默认禁用了 JavaScript\
  \ 以提高安全性。这在像这样的环境中特别常见。\n\n\n\n\n\n![Image](img/image00365.jpeg) **运行时错误**（Runtime\
  \ errors）——当 JavaScript 解释器尝试执行它无法理解的操作时发生的错误。例如，尝试将字符串当作数值处理，或尝试将数字除以零。\n\n![Image](img/image00365.jpeg)\
  \ **程序逻辑错误**——这些错误并不总是生成错误信息——代码可能是完全有效的——但你的脚本并没有按照你的预期运行。这些通常是与脚本内部算法或逻辑流相关的问题。\n\
  \n## 选择程序员编辑器\n\n无论你在什么平台上工作，无论你选择哪种浏览器，拥有一个好用的代码编辑器都是有意义的。虽然在 Windows 记事本等简单程序中编写代码是完全可能的，但专用的编辑器会让生活变得方便得多。\n\
  \n有许多此类程序可供选择，通常根据开源或类似的许可免费提供。在这里，我列出了一些免费编辑器，但请自己寻找一个适合你的平台、工作风格和预算的编辑器。\n\n![Image](img/image00365.jpeg)\
  \ Notepad++ (Windows)\n\n![Image](img/image00365.jpeg) JEdit（应适用于任何安装了 Java 的平台）\n\
  \n![Image](img/image00365.jpeg) PSPad (Windows)\n\n![Image](img/image00365.jpeg)\
  \ JuffEd (Windows, Linux)\n\n![Image](img/image00365.jpeg) Geany (Windows, Linux)\n\
  \n编辑器提供了一系列功能和能力，但我建议至少寻找具备以下功能的编辑器：\n\n![Image](img/image00365.jpeg) **行号**——如果你将\
  \ JavaScript 存储在外部文件中，这尤为有用（这也是为什么在可行的情况下你应该这么做的另一个原因）。这样一来，浏览器调试器生成的任何错误信息的行号通常会与编辑器中打开的源文件行号匹配。\n\
  \n![Image](img/image00365.jpeg) **语法高亮**——当你熟悉了编辑器的语法高亮方案后，在很多情况下，你仅仅因为编辑器中的代码“看起来不对”就能发现编码错误。你习惯喜喜欢的编辑程序中关键字、变量、字符串字面量、对象等颜色的速度之快，令人惊讶。许多编辑器允许你根据自己的喜好更改语法高亮配色方案。\n\
  \n![Image](img/image00365.jpeg) **括号匹配**——作为一种寻找错误的“导弹”，括号匹配是无价的。良好的编辑器会显示所有类型的大括号、花括号和圆括号的匹配开启/闭合对。当你的代码中有几层嵌套的圆括号时，很容易数错。\n\
  \n![Image](img/image00365.jpeg) **代码补全或工具提示式语法帮助**——某些编辑器为命令函数和表达式提供弹出工具提示式的帮助。这可以节省你将视线从编辑器窗口移开去查找外部资料的时间。\n\
  \n## 使用 alert() 进行简单调试\n\n有时，你想要一种非常简单快速的方法来读取变量的值，或者跟踪代码执行的顺序。\n\n也许最简单的方法是在代码适当的位置插入\
  \ JavaScript `alert()` 语句。假设你想知道一个无响应的函数是否真的被调用了，如果是，带有什么参数调用的：\n\n```javascript\n\
  function myFunc(a, b) {\n    alert(\"myFunc() called.\\na: \" + a + \"\\nb: \" +\
  \ b);\n    // rest of function code ...\n}\n```\n\n当函数被调用时，`alert()` 方法会执行，产生一个如图\
  \ 23.1 所示的对话框（part038.xhtml_ch23fig1）。\n\n![Image](img/image00472.jpeg)\n**图 23.1**\
  \ 使用 JavaScript alert()\n\n记住在显示的消息中多包含一些信息，而不仅仅是一个变量值或一个单词的注释；在战斗激烈的时刻，你会忘记 `alert()`\
  \ 中的值指的是哪个变量或属性。\n\n## 更多调试方法\n\n在代码中放置 `alert()` 调用对于对短段代码进行快速而粗略的调试也许是可以接受的。然而，这种技术确实有一些严重的缺点：\n\
  \n![Image](img/image00365.jpeg) 你必须点击每个对话框的“确定”才能允许处理继续。这可能会让人倍受沮丧，尤其是在处理长循环时！\n\
  \n![Image](img/image00365.jpeg) 接收到的消息没有存储在任何地方，对话框清除后就会消失；你无法在以后回来查看报告了什么。\n\n\
  ![Image](img/image00365.jpeg) 在你的代码“上线”之前，你需要回到编辑器并删除所有的 `alert()` 调用。\n\n在本节中，我们将查看一些高级调试技术。\n\
  \n### 控制台\n\n幸运的是，大多数现代浏览器都提供 JavaScript 控制台，你可以更有效地利用它记录消息。打开控制台的方法因浏览器而异：\n\n\
