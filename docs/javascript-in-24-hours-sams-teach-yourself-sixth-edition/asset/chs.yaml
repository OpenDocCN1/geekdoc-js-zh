  \n### 如何在您的页面中引入 jQuery UI\n\n第一步是访问 [`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)\
  \  jQuery ThemeRoller 在线应用程序。\n\n#### 使用 ThemeRoller\n\njQuery UI CSS 框架是一组涵盖广泛用户界面需求的类。使用\
  \ `ThemeRoller` 工具，您可以构建自己的界面样式，可以从零开始，也可以基于 [`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)\
  \ 图库中提供的任何广泛示例示例。\n\n一旦您决定了样式，jQuery UI 就提供了一个下载构建器，仅会打包您所需的组件。它还会处理所选项目的的任何依赖关系，因此您不会在缺少所有所需辅助文件的情况下下载小部件或交互功能。您只需要下载并解压\
  \ zip 文件即可。\n\n一旦解压了下载的内容，您将拥有以下目录：\n\n`/css/`\n\n`/development-bundle/`\n\n`/js/`\n\
  \n`development-bundle` 目录包含 jQuery UI 的源代码、演示和文档。如果您不打算更改任何 jQuery UI 代码，可以安全地删除它。\n\
  \n通常，在任何要使用 jQuery UI 小部件和交互的页面上，您需要从剩余文件中引入您的主题、jQuery 和 jQuery UI：\n\n点击此处查看代码图像\n\
  \n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"jquery-ui.min.css\"\
  />\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n<script\
  \ src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n```\n\
  \n如果您使用标准图库主题之一，也可以链接到内容分发网络（CDN）上的所有所需文件：\n\n点击此处查看代码图像\n\n```html\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax_libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n<script\
  \ src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n```\n\
  \n### 交互\n\n让我们看看可以使用 jQuery UI 实现的一些事情，以改进页面元素与用户的交互方式。\n\n### 拖放\n\n使用 jQuery\
  \ UI 让元素变得可拖再不过简单了：\n\n```javascript\n$(\"#draggable\").draggable();\n```\n\n列表\
  \ 16.1 显示了您如何在 HTML 页面中实现这一点。\n\n**列表 16.1 让页面元素可拖**\n\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"http://ajax.googleapis.com/ajax_libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <style>\n        #dragdiv {\n            width: 100px;\n            height:\
  \ 100px;\n            background-color: #eeffee;\n            border: 1px solid\
  \ black;\n            padding: 5px;\n        }\n    </style>\n    <title>Drag and\
  \ Drop</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#dragdiv\").draggable();\n\
  \        });\n    </script>\n</head>\n<body>\n    <div id=\"dragdiv\"> Drag this\
  \ element around the page!</</div>\n</body>\n</html>\n```\n\n当页面加载后，元素 `<div id=\"\
  dragdiv\">` 变为可拖拽的：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"#dragdiv\"\
  ).draggable();\n});\n```\n\n然后，您可以通过点击元素任何部分的鼠标在页面上拖动该项目，如图 16.1 所示。\n\n![Image](img/image00444.jpeg)\n\
  \n**图 16.1** 拖动页面元素\n\n#### 尝试一下：使用 jQuery UI 进行拖放\n\n要让一个元素能够接收掉在其上面的另一个元素，您需要使用\
  \ `droppable()` 方法。该方法可以指定对各种事件执行操作，例如拖拽项目被掉落、悬停在可放置区域上方或离开可放置区域。\n\n您将修改列表 16.1\
  \ 中的代码，以添加另一个更大的 `<div>` 元素作为掉落区域：\n\n点击此处查看代码图像\n\n```html\n<div id=\"dropdiv\"\
  >This is the drop zone ...</</div>\n```\n\n除了让可拖拽项目变为可拖拽外，您还需要指定新的 `<div>` 元素是一个放置区域，如下所示：\n\
  \n```javascript\n$(\"#dropdiv\").droppable();\n```\n\n此外，您将通过向 `drop` 和 `out` 事件的处理器中添加方法，使可拖拽项目上的文本在被掉落或离开可放置区域时发生变化：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"#dropdiv\").droppable({\n    drop: function()\
  \ { $(\"#dragdiv\").text(\"Dropped!\"); },\n    out: function() { $(\"#dragdiv\"\
  ).text(\"Off and running again ...\"); }\n});\n```\n\n创建一个包含列表 16.2 代码的 HTML 页面。\n\
  \n**列表 16.2 使用 jQuery UI 进行拖放**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax_libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <style>\n        div {\n            font: 12px arial, helvetica;\n     \
  \   }\n        #dragdiv {\n            width: 50px;\n            height: 50px;\n\
  \            background-color: #eeffee;\n            border: 1px solid black;\n\
  \            padding: 5px;\n        }\n        #dropdiv {\n            position:\
  \ absolute;\n            top: 80px;\n            left: 100px;\n            width:\
  \ 300px;\n            height: 200px;\n            border: 1px solid black;\n   \
  \         padding: 5px;\n        }\n    </style>\n    <title>Drag and Drop</title>\n\
  \    <script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n   \
  \ <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n\
  \    <script>\n        $(function() {\n            $(\"#dragdiv\").draggable();\n\
  \            $(\"#dropdiv\").droppable({\n                drop: function() { $(\"\
  #dragdiv\").text(\"Dropped!\"); },\n                out: function() { $(\"#dragdiv\"\
  ).text(\"Off and running again ...\"); }\n            });\n        });\n    </script>\n\
  </head>\n<body>\n    <div id=\"dropdiv\">This is the drop zone ...</</div>\n   \
  \ <div id=\"dragdiv\">Drag this element around the page!</</div>\n</body>\n</html>\n\
  ```\n\n\n\n\n单击查看代码图片\n\n```javascript\n$(function() {\n    $(\"#dragdiv\").draggable();\n\
  \    $(\"#dropdiv\").droppable({\n        drop: function() { $(\"#dragdiv\").text(\"\
  Dropped!\"); },\n        out: function() { $(\"#dragdiv\").text(\"Off and running\
  \ again ...\"); }\n    }).resizable();\n});\n```\n\n### 排序\n\n拖放功能的进一步封装方法是 `sortable()`\
  \ 方法，你可以将它添加到列表项中，以使列表变得可排序：\n\n```javascript\n$(\"#sortMe\").sortable();\n```\n\
  \n列表 16.3 演示了你如何将此方法应用于无序列表元素。\n\n**列表 16.3 使元素可排序**\n\n单击查看代码图片\n\n* * *\n\n```html\n\
  <!DOCTYPE html>\n<html\n<head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
  http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <title>Sortable</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#sortMe\").sortable();\n\
  \        });\n    </script>\n</head>\n<body>\n    <ul id=\"sortMe\">\n        <li>One</li>\n\
  \        <li>Two</li>\n        <li>Three</li>\n        <li>Four</li>\n        <li>Five</li>\n\
  \    </ul>\n</body>\n</html>\n```\n\n* * *\n\n将元素拖动到列表中的新位置会导致列表进行排序，在完成放置时，列表会“吸附”到新的顺序，如图图\
  \ 16.4 所示。\n\n![Image](img/image0044.jpeg)\n\n**图 16.4** 排序列表\n\n### 使用小部件\n\n小部件是可以以极少的麻烦和复杂性放入应用程序的界面项。\n\
  \n#### 手风琴 (Accordion)\n\n手风琴小部件允许用户一次只展开一个 `<div>` 元素列表，而让其余元素收起为仅标题栏。\n\n首先，你需要在语义层中添加数据，使用标题和内容面板成对：\n\
  \n单击查看代码图片\n\n```html\n<div id=\"accordion\">\n    <h3><a href=\"#\">First header</a></h3>\n\
  \    <div>First content</div>\n    <h3><a href=\"#\">Second header</a></h3>\n  \
  \  <div>Second content</div>\n</div>\n```\n\n接下来，你可以通过对外部层容器元素调用 `accordion()` 方法来激活手风琴：\n\
  \n单击查看代码图片\n\n```javascript\n$(function() {\n    $(\"#accordion\").accordion();\n\
  });\n```\n\n列表 16.4 显示了一个示例应用程序，这里将餐厅菜单的午餐选项分成了手风琴的不同折叠层。\n\n**列表 16.4 使用手风琴小部件**\n\
  \n单击查看代码图片\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <title>Menu Choices</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#accordion\").accordion();\n\
  \        });\n    </script>\n</head>\n<body>\n    <h2>Choose from the following\
  \ menu options:</h2>\n    <div id=\"accordion\">\n        <h3><a href=\"#\">Starters</a></h3>\n\
  \        <div>\n            <ul>\n                <li>Clam Chowder</li>\n      \
  \          <li>Ham and Avocado Salad</li>\n                <li>Stuffed Mushrooms</li>\n\
  \                <li>Chicken Liver Pate</li>\n            </ul>\n        </div>\n\
  \        <h3><a href=\"#\">Main Courses</a></h3>\n        <div>\n            <ul>\n\
  \                <li>Scottish Salmon</li>\n                <li>Vegetable Lasagne</li>\n\
  \                <li>Beef and Kidney Pie</li>\n                <li>Roast Chicken</li>\n\
  \            </ul>\n        </div>\n        <h3><a href=\"#\">Desserts</a></h3>\n\
  \        <div>\n            <ul>\n                <li>Chocolate Sundae</li>\n  \
  \              <li>Lemon Sorbet</li>\n                <li>Fruit Salad</li>\n   \
  \             <li>Strawberry Cheesecake</li>\n            </ul>\n        </div>\n\
  \    </div>\n</body>\n</html>\n```\n\n\n\n\n上述所有内容都封装在一个 `id=\"tabs\"` 的 `div` 容器中，要激活标签页界面，你只需要对该容器元素调用\
  \ `tabs()` 方法即可：\n\n```\n$( \"#tabs\" ).tabs();\n```\n\n激活后，界面看起来就像图 16.7 所示。\n\n\
  ![Image](img/image0045.jpeg)\n\n**图 16.7** 标签页\n\n### 总结\n\n在这一节中，你学习了除了 jQuery\
  \ 之外，如何使用 jQuery UI 库来构建流畅的用户界面。你了解了如何快速地为页面添加交互和组件，以及如何使用 ThemeRoller 应用为你的界面项目设置整体样式。\n\
  \n## 问答\n\n**问：我可以进一步自定义这些界面元素吗？**\n\n**答：可以的。**由于本书空间有限，本节中演示的每个交互和组件都使用了默认设置。在实际上，每个组件都有一系列自定义选项，可以使其完全按照你想要的方式工作。你可以在\
  \ http://docs.jquery.com/UI/ 找到大量的文档和示例。\n\n**问：我如何让页面上的其他元素具有与 jQuery UI 生成的元素相同的样式？**\n\
  \n**答：当 jQuery UI 生成标记时，它会为新创建的标记应用类。这些类对应于 jQuery UI CSS 框架中的 CSS 声明。每个组件的完整细节列在\
  \ jQuery UI 文档中。\n\n## 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1。** 在页面中使用\
