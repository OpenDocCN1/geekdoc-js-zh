  \n## 第 24 小时：JavaScript 单元测试\n\n在本小时将学习：\n\n![Image](img/image00365.jpeg) 什么是单元测试以及为什么要使用它\n\
  \n![Image](img/image00365.jpeg) 如何让你的 JavaScript 代码更易测试\n\n![Image](img/image00365.jpeg)\
  \ JavaScript 测试套件的某些示例\n\n![Image](img/image00365.jpeg) 关于 `QUnit` 测试套件和 CommonJS\
  \ 单元测试规范\n\n通常，一个最初只有几行代码的 JavaScript 小技巧，随后会增长到十行、二十行，然后是五十行。与此同时，函数被不断调整以执行更多功能，条件语句增加了几个条件，或者创建了几个额外的变量。\n\
  \n当这样的应用程序（不可避免地）崩溃时，要理清代码并找到问题可能是一场噩梦。\n\n正如你在第 22 小时中读到的，“良好的编码实践](#part0037.xhtml_ch22)”，良好的编码实践可以帮助让你的代码更容易理解和维护，但你还有其他可以做的事。随着你的\
  \ JavaScript 应用程序规模、复杂性和程度的增加，编写易于测试的代码变得更加重要。\n\n在本小时中，你将学习一些编写代码以使其适用于单元测试的方法，以及如何编写和执行此类测试。\n\
  \n### 什么是单元测试？\n\n如果你不熟悉单元测试的概念，不用担心，它理解并不复杂。\n\n通常当人们考虑测试 JavaScript 应用程序时，他们想象的是测试整个系统以查看它是否按预期工作。这本质上是测试应用程序的各个部分是否能协同工作，通常被称为\
  \ `集成测试`。\n\n`单元测试` 是一种软件验证和确认方法，将应用程序拆分为最小的可测试部分，称为`单元`（units），然后对这些单元进行单独检查和测试以确保其运行正常。单元是应用程序最小的可测试部分，例如单个函数或方法。\n\
  \n单元测试可以手动进行，但这种测试通常是自动的。\n\n本质上，你为你代码的每个基本元素编写一系列测试，以测试该单元在所有可能的输入类型下的性能。如果所有这些测试都通过了，你就可以确认每个测试过的元素都是符合目的的。\n\
  \n## 动手尝试：一个自制的单元测试\n\n让我们直接开始，从零开始执行一个单元测试。\n\n在这个示例中，我们将编写一些测试，在示例单元上执行它们，并将结果摘要发送到浏览器控制台。\n\
  \n让我们看看我们在第 3 小时中编写的一个函数，“使用函数](#part0012.xhtml_ch03)”，用于按给定比例为净额加税并返回总金额：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction addTax(subtotal, taxRate) {\n    var total = subtotal\
  \ * (1 + (taxRate/100));\n    return total;\n}\n```\n\n这个函数构成了我们将进行测试的单元。\n\n我们将此函数保存在文件\
  \ `tax.js` 中，并将其包含在作为测试套件的 HTML 页面中。在现实世界中，`tax.js` 可能包含许多不同的函数，也许作为财务应用程序的一部分，但对于这个示例它足够了。HTML\
  \ 代码如列表 24.1 所示。\n\n**列表 24.1 测试套件的 HTML 代码**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>手动单元测试示例</title>\n  <script src=\"tax.js\"></script>\n\
  \  <script>\n  function test(amount, rate, expected) {\n      results.total++;\n\
  \      var result = addTax(amount, rate);\n      if (result !== expected) {\n  \
  \      results.failed++;\n        console.log(\"Expected \" + expected + \", but\
  \ instead got \" + result);\n      }\n  }\n  var results = {\n    total: 0,\n  \
  \  failed: 0\n  };\n  // 我们的单元测试\n  test(1, 10, 1.1);\n  test(5, 12, 5.6);\n  test(100,\
  \ 17.5, 117.5);\n  // 输出结果到控制台\n  console.log(results.total + \" tests carried out,\
  \ \" + results.failed + \" failed, \" +(results.total - results.failed) + \" passed.\"\
  );\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n在此页的 `<script>` 元素中，我定义了一个名为\
  \ `test()` 的函数，它接受三个参数。参数 `amount` 和 `rate` 是传递给函数的值，而 `expected` 是我们预期的值。函数会增加\
  \ `results.total`，调用 `addTax` 获取结果。如果结果不等于预期值，它会增加 `results.failed` 并在控制台打印错误信息。\n\
  \n*(注：由于您提供的原始文本在 HTML 之后包含了大量完全相同的段落，为了遵守“不要重复输出原文”的原则，我仅翻译了核心逻辑部分。)*\n\n\n\n将\
  \ JavaScript 代码收集到外部文件中并在以后链接到你的应用程序中，通常更容易测试。在理想情况下，包含在生产应用程序中的相同 JavaScript 文件可以简单地链接到你的测试用架中，以便执行这些测试。\n\
  \n## 保持函数和方法简单\n\n你试图在单个过程中执行的操作越多，你的测试用就会变得越复杂、数量越多，而且为了将该函数从周围的代码中解离出来进行测试也可能变得越困难。\n\
  \n### QUnit 测试套件\n\n上一个示例表明，你不需要大量的代码就可以运行实际的单元测试。然而，对于多于几个测试用例，使用专门设计的单元测试框架会效率高得多，该框架提供了更高级的工具来编写和运行你的测试。在本节中，我们将查看其中一个这样的框架，即\
  \ `QUnit`。\n\nQUnit 是一个强大的开源 JavaScript 单元测试框架。它由 jQuery 团队的成员编写，用于 jQuery、jQuery\
  \ UI 和 jQuery Mobile 项目。然而，`QUnit` 能够测试任何普通的 JavaScript 代码。\n\n### 安装 QUnit\n\n\
  QUnit 是一个自包含库，只需要一个 JavaScript 文件（`qunit.js`）和一个 CSS 文件（`qunit.css`），这两个文件都可以从 QUnit\
  \ 网站下载。或者，你可以使用托管在 CDN 上的版本，如下例所示。\n\n### 极简 QUnit 设置\n\n再次，我们的测试设置将是一个简单的 HTML\
  \ 页面，如列表 24.2 所示。这次，`QUnit` 是从 CDN 引入的。\n\n**列表 24.2 QUnit 测试套件代码**\n\n点击此处查看代码图像\n\
  \n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hello QUnit Example</title>\n\
  <link rel=\"stylesheet\" href=\"http://code.jquery.com/qunit/qunit-1.16.0.css\"\
  >\n</head>\n<body>\n<div id=\"qunit\"></div>\n<div id=\"qunit-fixture\"></</div>\n\
  <script src=\"http://code.jquery.com/qunit/qunit-1.16.0.js\"></script>\n<script\
  \ src=\"tests.js\"></script>\n</body>\n</html>\n```\n\n* * *\n\n注意此文件的布局，以及它与我们在上一节中使用的手动测试套件有多相似。然而，它们有几处不同：\n\
  \n![图像](img/image00365.jpeg) `QUnit` 不是向控制台记录信息，而是将格式化良好的结果输出到 ID 为 `#qunit` 的 `<div>`\
  \ 中。\n\n![图像](img/image00365.jpeg) 在需要设置测试期间使用的所谓 `mock DOM` 元素的实例中，需要 `#qunit-fixture`\
  \ 元素，这些通常是表单元素等内容。mock DOM 在每个单元测试后都会重置。`QUnit` 期望 mock DOM 位于 `#qunit-fixture`\
  \ 元素中。\n\n我们在 head 中包含了 CSS 文件，而 body 包含了 `QUnit` JavaScript 文件，随后是名为 `tests.js`\
  \ 的后续文件，该文件仅包含以下代码：\n\n点击此处查看代码图像\n\n```javascript\nQUnit.test( \"Hello QUnit test\"\
  , function( assert ) {\n    assert.ok( 1 == \"1\", \"Passed!\" );\n});\n```\n\n\
  让我们看看这里发生了什么。测试方法被调用，将测试名称作为第一个参数传递，并将一个函数作为第二个参数传递。正是这个函数将运行我们的测试。\n\n点击此处查看代码图像\n\
  \n```javascript\nassert.ok( 1 == \"1\", \"Passed!\" );\n```\n\n在这个平凡的示例中，测试将始终通过。`ok`\
  \ 方法是 `QUnit` 提供的几个 `assertions`（断言）之一，如果传递给它的第一个参数返回的内容本身评估为真，则它返回真值。\n\n* * *\n\
  \n## QUnit 断言\n\n`assertion`（断言）通过评估表达式为真或假。`QUnit` 的 `assert` 有许多可以可以使用的额外方法来构建你的测试。示例包括\
  \ `equal()`，意所当然，它测试相等性；`notEqual()`，它测试不相等性；以及 `strictEqual()`，它再次测试相等性，但这次是严格的类型和值比较。\n\
  \n在 [`api.qunitjs.com/category/assert/`](http://api.qunitjs.com/category/assert/)\
  \ 查看 `QUnit` 文档中的所有断言。\n\n* * *\n\n结果如图 24.2 所示。\n\n![图像](img/image00486.jpeg)\n\
  \n**图 24.2** 示例单元测试的结果\n\n### 重测我们的 addTax() 函数\n\n现在让我们修改前面的示例来重新测试我们的函数 `addTax()`，这次使用\
  \ `QUnit`。测试用架与之前类似，但它现在包含了 `tax.js` 文件：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>Test of addTax with QUnit</title>\n<link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/qunit/qunit-1.16.0.css\">\n<script src=\"tax.js\"\
  ></script>\n</head>\n<body>\n<div id=\"qunit\"></div>\n<div id=\"qunit-fixture\"\
  ></</div>\n<script src=\"http://code.jquery.com/qunit/qunit-1.16.0.js\"></script>\n\
  <script src=\"tests.js\"></script>\n</body>\n</html>\n```\n\n现在我们需要修改 `tests.js`\
  \ 以包含我们要运行的测试。在这里，我们使用了不同的断言 `equal`，如果传递给它的两个参数相等，则通过。第二个参数是我们的预期的结果：\n\n点击此处查看代码图像\n\
  \n```javascript\nQUnit.test( \"addTax\", function( assert ) {\n    assert.equal(addTax(1),\
  \ 10);\n});\n```\n\n当测试用架加载到浏览器时，输出如图 24.3 所示。\n\n![图像](img/image0487.jpeg)\n\n\
  **图 24.3** 测试我们的\n\n### 总结\n\n在本节中，你学习了测试 JavaScript 的方法。\n\n测试 JavaScript 通常需要对你的代码进行一些重要的更改，你了解了一些你可以采用的代码技巧。\n\
  \n你看到了如何使用自制的测试用架运行测试，然后用专门设计的 `QUnit` 框架替换了它。\n\n## 问答\n\n在阅读随后的“答案”部分之前尝试回答所有问题。\n\
  \n## 测验\n\n1.** 在单元测试中，“单元”（unit）一术指的是：\n\na. 应用程序中最小的可测试部分，例如单个函数或方法\nb. 单个网页上活动的所有\
  \ JavaScript 代码\nc. 网页 .js 文件中的所有 JavaScript 代码\n\n2.** 断言：\n\na. 总是声明一个测试表达式为真\n\
  b. 评估一个测试表达式为真或假\nc. 设置 JavaScript 变量的值\n\n3.** 重构你的 JavaScript 代码以使其更具测试性通常被称为：\n\
  \na. 重组你的代码 (restructuring)\nb. 重构你的代码 (refactoring)\nc. 编译你的代码 (recompiling)\n\n\
  \n\n\n# 1.** a. 应用中最小的可测试部分，例如单个函数或方法\n\n# 2.** b. 评估表达式的值为真或假\n\n# 3.** b. 重构你的代码\n\
  \n## 练习题\n\n![Image](img/image00365.jpeg) 修改“自制”的单元测试代码，将格式整齐的报告显示在 HTML 页面上，而不是记录到控制台中（如\
  \ QUnit 所做的那样\n\n![Image](img/image00365.jpeg) 从书中选取其他一些函数，并使用 QUnit 对它们进行单元测试。它们的运行方式都符合你的预期吗？\n\
  \n# 第九部分：附录\n\n## 附录 A. JavaScript 开发工具\n\nJavaScript 开发除了除了文本编辑器和浏览器外，不需要任何特殊的工具或软件。\n\
  \n大多数操作系统都自带了至少一种工具，在很多情况下，这些工具对于你编写代码来说已经足够了。\n\n然而，也有许多可选和额外的工具可用，其中一些在本文得到了介绍。\n\
  \n> 提示\n> 请确保检查各个网站和/或下载包中包含许可条款。\n\n### 编辑器\n\n选择编辑器程序是一项个人喜好，大多数程序员都有自己最喜爱的。接下来的章节列了一些你可以尝试的流行免费编辑器。\n\
  \n#### Notepad++\n\n如果你在 Windows 平台上开发，你可能已经在使用 Windows 通常捆带的记事本编辑器。`Notepad++`\
  \ ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/)) 是一个免费应用程序，旨在作为一个更强大的替代品，同时保持轻量和快速。\n\
  \n`Notepad++` 提供行号、语法和大括号高亮、宏、搜索和替换等等许多功能。\n\n#### jEdit\n\n`jEdit` 是一个用 Java 编写的免费编辑器。因此，它可以安装在任何可用\
  \ Java 虚拟机的平台上，例如 Windows、Mac OS X、OS/2、Linux 等。\n\n`jEdit` 本身就是一个功能完备编辑器，还可以通过\
  \ 200 多个可用插件进行扩展，例如成为一个完整的开发环境或高级 XML/HTML 编辑器。\n\n从 [www.jedit.org](http://www.jedit.org)\
  \ 下载 `jEdit`。\n\n#### SciTE\n\n`SciTE` 最初是作为 Scintilla 编辑组件的演示器开发的，现在已成为一个独立且实用的编辑器。\n\
  \nWindows 和 Linux 用户可以从 [www.scintilla.org/SciTE.html](http://www.scintilla.org/SciTE.html)\
  \ 下载 `SciTE` 的免费版本，而 Mac OS X 用户可以通过 Mac Apps Store 获得其商业版本。\n\n#### Geany\n\n`Geany`\
  \ ([www.geany.org/](http://www.geany.org/)) 是一个功能强大的编辑器，也可以作为基本的集成开发环境 (IDE) 使用。它的开发是为了提供一个小型而快速的\
  \ IDE，可以安装在几乎任何支持 GTK 工具包的平台上，包括 Windows、Linux、Mac OS X 和 FreeBSD。\n\n`Geany` 根据\
  \ GNU 公共许可许可证免费下载和使用。\n\n### 验证器\n\n为了确保你的页面无论用户的浏览器和操作系统如何都能按预期工作，始终建议检查你的 HTML\
  \ 代码是否符合标准。正如下文所述，有许多在线工具和设施可以帮助你。\n\n#### W3C 验证服务\n\n`W3C` 在 [`validator.w3.org/`](http://validator.w3.org/)\
  \ 提供了一个在线验证器，它可以检查 HTML、SMIL、MathML 和其他语言 Web 文档标记有效性。你可以输入要检查的页面 URL，或者直接将代码剪切粘贴到验证器中。`CSS`\
  \ 也可以类似地在 [`jigsaw.w3.org/css-validator/validator.en`](http://jigsaw.w3.org/css-validator/validator.en)\
  \ 进行验证。\n\n#### Web 设计小组 (WDG)\n\n`WDG` 也通过 [www.htmlhelp.com/tools/validator/](http://www.htmlhelp.com/tools/validator/)\
  \ 提供在线验证服务。这与 W3C 验证器类似，但在某些情况下提供的更多信息，例如关于有效但危险代码的警告，或者高亮未定义的引用而不是简单地将其列为错误。\n\n\
  #### 调试和验证工具\n\n在尝试追踪 JavaScript 代码中难以发现的问题时，调试工具可以为你节省数小时时间，并通过分析执行时间来帮助加速脚本。验证工具帮助你编写整洁、简洁、易读且无问题的代码。有很多调试和验证工具可用，包括以下：\n\
  \n#### Firebug\n\n`Firebug` 与 Firefox 浏览器集成，提供出色的调试、编辑和分析工具。访问 [`firebug.com/javascript`](http://firebug.com/javascript)。\n\
  \n#### JSLint\n\n`JSLint` ([`www.jslint.com/`](http://www.jslint.com/)) 由 Douglas\
  \ Crockford 编写，分析你的源代码并报告潜在问题，包括样式规范和错误。\n\n## 附录 B. JavaScript 快速参考\n\n本附录中的 `Table\
