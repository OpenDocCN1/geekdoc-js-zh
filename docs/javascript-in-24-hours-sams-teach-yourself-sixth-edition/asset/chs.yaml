  \n## 作者\n\nPhil Ballard 是多 *Sams Teach Yourself* 系列书籍的作者，他于 1980 年毕业于利兹大学，获得电子学荣誉学位。在早期作为一家跨国公司的研究科学家后，他曾担任了几年的软件工程顾问。他以“The\
  \ Whisperer”（`www.whisperer.co.uk`）的身份运营，近年来专注于为国际客户提供网页设计和开发。\n\n## 我们想听听你的声音\n\
  \n作为本书的读者，你是我们最重要的评论家。如果你对本书的某些地方感到喜欢或不喜欢，请发送电子邮件至 `feedback@sampublish.com` 或邮寄至\
  \ `feedback@sampublish.com`。我们重视你的意见，并想知道我们如何做得更好。\n\n## 读者服务\n\n访问我们的网站并在 [`www.informit.com/register`](http://www.informit.com/register)\
  \ 注册本书，以便方便获取任何更新、下载或错误说明。\n\n## 引言\n\n本引言将在你开始之前为你介绍一些基础知识，包括本书的读者群、编写原因、内容组织方式以及你需要的工具。\n\
  \n### 本书的读者\n\n如果你对学习 JavaScript 感兴趣，你可能已经对 HTML 和通用的网页设计有了基本的了解，并希望为你的页面添加一些交互性。如果你从未接触过\
  \ HTML，也没有做过任何计算机编程，那么在阅读本书之前，先浏览一遍 HTML 入门指南将会有帮助。不要担心——HTML 非常容易上手，你不需要成为该专家就可以开始尝试\
  \ JavaScript。\n\n### 本书的目标\n\n当 JavaScript 首次引入时，它的功能还相当有限。由于基础功能简单陋且对浏览器的支持相当零散，它在某些领域被认为是一种玩具或噱头。现在，由于浏览器对\
  \ W3C 标准的支持大大提高，以及近期浏览器中使用的 JavaScript 实现有所改进，JavaScript 终于被视为一种严肃的编程语言。\n\n许多在其他语言中使用的高级编程领域很容易应用于\
  \ JavaScript；例如，面向对象的编程促进了编写稳健、可读、可维护且可重用的代码。所谓的“非侵入式”脚本技术和 DOM 脚本的使用，重点在于为网页添加交互，同时保持\
  \ HTML 的易读性并与程序代码良好分离。\n\n本书旨在教授与当今 JavaScript 应用的所有重要方面相关的基础技能。在书中，你将从基础概念开始，逐渐学习根据当前网络标准编写\
  \ JavaScript 程序的最佳实践。\n\n### 使用的规范\n\n书中的所有代码示例均以 HTML5 编写。不过，在大多数情况下，代码避免了使用 HTML5\
  \ 特有的语法，因为在编写时，浏览器对其支持尚未普及。无论计算机类型或操作系统如何，代码示例都应该可以在任何近期的网络浏览器中正常运行。\n\n除了每课的正文外，你还会看到许多标记为“笔记”（Notes）”、“提示”（Tips）和“警告”（Cautions）的框。\n\
  \n笔记\n这些章节提供了额外的注释，可能帮助你理解文本和示例。\n\n提示\n\n\n\n\n这些区块提供了额外的提示、快捷方式或替代方案，以使编码变得更加简单。\n\
  \n***\n\n## 注意事项\n通过使用这些区块中的信息，避免常见的陷阱。\n\n***\n\n## 动手尝试\n每节课程至少包含一个章节，引导你完成实现自己的脚本的过程。这将帮助你根据所学的技巧，在编写自己的\
  \ JavaScript 代码方面建立信心。\n\n***\n\n### 问答、工作坊与练习\n在每节课程之后，你会发现三个末尾章节。\n\n![Image](img/image00365.jpeg)\
  \ “问答”部分尝试回答关于本节课程主题的几个常见问题。\n\n![Image](img/image00365.jpeg) “工作坊”部分包含一个测试，用于测试你对该节课程所知识的掌握情况。测试题的答案会紧随测试方便地提供。\n\
  \n![Image](img/image00365.jpeg) “练习”部分根据课程内容提供了进一步实验的建议，你可能想自己尝试。\n\n### 本书的结构\n\
  本书分为七部分，所教授技术的复杂程度逐渐增加。\n\n![Image](img/image00365.jpeg) 第一部分—JavaScript 初步\n\n\
  JavaScript 语言简介，以及如何使用该语言的常用函数编写简单的脚本。本书这部分主要针对几乎或没有编程知识、且不懂 JavaScript 语言的读者。\n\
  \n![Image](img/image00365.jpeg) 第二部分—代码编程\n\n在这里介绍了 JavaScript 的数据类型，例如数字、字符串和数组。还涵盖了更复杂的编程范式，如程序控制循环和定时器。\n\
  \n![Image](img/image00365.jpeg) 第三部分—对象\n\n本书这部分集中于对象的创建和处理，包括导航和编辑属于 `DOM`（文档对象模型）的对象。\n\
  \n![Image](img/image00365.jpeg) 第四部分—HTML 和 CSS\n\n在这里你更深入地学习 JavaScript 如何与 HTML（包括\
  \ HTML5）和 CSS（层叠样式表，包括最新的 CSS3 规范交互。\n\n![Image](img/image00365.jpeg) 第五部分—使用 JavaScript\
  \ 库\n\n在本书这部分，你学习如何使用 `jQuery` 等第三方库来简化跨浏览器开发。\n\n![Image](img/image00365.jpeg)\
  \ 第六部分—高级主题\n\n本书这部分涵盖了 Cookie 的读写，通过 ECMAScript 6 规范查看 JavaScript 的更新，引入了 `AngularJS`\
  \ 等框架的使用，并展示了网页之外使用 JavaScript 的示例。\n\n![Image](img/image00365.jpeg) 第七部分—职业技能\n\
  \n在最后一部分，你探索了专业 JavaScript 开发的方面，如良好的编码实践、JavaScript 调试和单元测试。\n\n### 你将需要的工具\n编写\
  \ JavaScript 不需要任何昂贵且复杂的工具，如集成开发环境 (IDEs)、编译器或调试器。\n\n书中的示例都可以在文本编辑器中创建，例如 Windows\
  \ 记事本。几乎每个操作系统都附带至少一个此类应用程序，通过互联网下载还有无许多免费或低成本的可用程序。\n\n***\n\n## 备注\n附录 A “JavaScript\
