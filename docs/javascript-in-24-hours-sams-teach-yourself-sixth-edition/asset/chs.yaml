  \ 提示\n我在这里仅仅对 Google Chrome/Chromium 中调试器的功能做了浅尝的介绍。要了解更多信息，有一个很好的教程 [`developer.chrome.com/devtools/docs/javascript-debugging`](https://developer.chrome.com/devtools/docs/javascript-debugging)\
  \ 可以帮助你入门。\n\n如果 Firefox 是你开发工作的首选浏览器，你最好安装流行的 Firebug 扩展，你可以在 [`getfirebug.com/javascript`](http://getfirebug.com/javascript)\
  \ 阅读关于它，它具有广泛相似的功能。\n\n使用 Microsoft Internet Explorer 的用户可以在此处找到 F12 开发者工具调试的良好信息：[`msdn.microsoft.com/en-us/library/ie/gg589512(v=vs.85).aspx`](https://msdn.microsoft.com/en-us/library/ie/gg589512(v=vs.85).aspx)。\n\
  \nOpera 包含了 Dragonfly 调试工具，你可以在 [`www.opera.com/dragonfly/documentation/`](http://www.opera.com/dragonfly/documentation/)\
  \ 阅读关于它。\n\n控制台提供了许多你可以在代码中使用的的方法来替代繁琐且受限的 `alert()` 调用，最广为人的是 `console.log()`：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction myFunc(a, b) {\n    console.log(\"myFunc()\
  \ called.\\na: \" + a + \"\\nb: \" + b);\n    // .. rest of function code here\n\
  }\n```\n\n`console.log()` 不会中断程序运行，它对用户来说是隐形的，除非他或她恰好查看控制台。图 23.8 显示了在安装了 Firebug\
  \ 扩展的 Firefox 中打开控制台运行上述代码的结果。\n\n![Image](img/image00479.jpeg)\n\n**图 23.8** 在控制台中记录的的消息\n\
  \n除了 `console.log()` 之外，你还可以利用 `console.warn()`、`console.info()` 和 `console.error()`。这些都会以略有不同的样式在控制台中记录消息，允许你构建出脚本运行情况的图景。\n\
  \n\n\n\n图 23.9 显示了 Firebug 的控制台如何显示每种消息；在其他浏览器中显示将略有不同。\n\n![Image](img/image00480.jpeg)\n\
  \n图 23.9 不同类型的控制台消息\n\n#### 消息分组\n\n将控制台调试消息分组可以使它们更具可读性。你可以根据需要为各个消息组进行命名：\n\n\
  点击此处查看代码图片\n\n```javascript\nfunction myFunc(a, b) {\n    console.group(\"myFunc\
  \ execution\");\n    console.log(\"Executing myFunc()\");\n    if(isNaN(a) || isNaN(b))\
  \ {\n        console.warn(\"One or more arguments non-numeric\");\n    }\n    console.groupEnd();\n\
  \    myOtherFunc(a+b);\n}\n\nfunction myOtherFunc(c) {\n    console.group(\"myOtherFunc\
  \ execution\");\n    console.log(\"Executing myOtherFunc()\");\n    if(isNaN(c))\
  \ {\n        console.info(\"Argument is not numeric\");\n    }\n    console.groupEnd();\n\
  \    // .. rest of function code here ...\n}\n```\n\n在这段代码段中，我定义了两个 `console.group()`\
  \ 部分，并对它们命名以便与执行它们的函数关联起来。每个组都以 `console.groupEnd()` 语句结束。当代码运行时，任何控制台消息都会分组分组显示，如图\
  \ 23.10 所示。\n\n![Image](img/image00481.jpeg)\n\n图 23.10 分组的消息\n\n#### 使用断点停止代码执行\n\
  \n随着脚本复杂性的增加，你可能会发现即使是使用控制台日志也不够让你进行有效的调试。\n\n为了进行更详细的调试，你可以在代码中感兴趣的地方设置所谓的断点（breakpoints）。当代码执行到达断点时，它会暂停；在时间保持冻结期间，你可以检查代码的运行情况、检查变量值、读取日志消息等。\n\
  \n在大多数流行的调试器中，设置断点需要进入“脚本”（Scripts）面板，你可以在那里看到列出的代码。点击行号（或仅行号左侧）即可在该行设置断点。在图 23.11\
  \ 中，代码的第 8 行设置了一个断点。执行在此处停止，你可以在右面板查看各个变量的当前值。你可以通过再次点击左侧边缘的断点图标来移除断点。\n\n![Image](img/image00482.jpeg)\n\
  \n图 23.11 在断点处停止执行\n\n#### 条件断点\n\n有时，仅在特定情况发生时中断代码执行是有帮助的。你可以通过右键点击左列中的断点图标并输入条件语句来设置条件断点。\n\
  \n你的代码将无中断地执行，直到条件满足，此时执行将恰刻停止。例如，在图 23.12 中，如果 `a` 和 `b` 之和小于 12，代码将停止。你可以通过右键点击一次断点来随时编辑表达式。\n\
  \n![Image](img/image00483.jpeg)\n\n图 23.12 条件断点\n\n当代码执行在断点处停止时，你可以选择继续执行，或使用执行按钮逐条语句逐步执行你的代码；这些按钮通常看起来像录像机控制键，并出现在调试器其中一个面板的顶部。在大多数调试器中，选项有：\n\
  \n- `Continue`（继续）：恢复执行并仅在再次/当再次暂停。\n- `Step Over`（单步跳过）：逐语句执行代码。\n- `Step Into`（单步进入）：进入函数。\n\
  - `Step Out`（单步跳出）：跳出当前函数。\n\n\n\n\n![Image](img/image00365.jpeg) 利用你对使用 `Math`\
  \ 对象生成随机数的知识，你能否重写横幅轮播脚本，以便在每次切换时显示随机横幅，而不是按顺序循环？请使用浏览器的内置调试工具来帮助自己。\n\n## 第 24\
  \ 小时：JavaScript 单元测试\n\n在本小时将学习：\n\n![Image](img/image00365.jpeg) 什么是单元测试以及为什么要使用它\n\
  \n![Image](img/image00365.jpeg) 如何让你的 JavaScript 代码更易测试\n\n![Image](img/image00365.jpeg)\
  \ JavaScript 测试套件的某些示例\n\n![Image](img/image00365.jpeg) 关于 `QUnit` 测试套件和 CommonJS\
  \ 单元测试规范\n\n通常，一个最初只有几行代码的 JavaScript 小技巧，随后会增长到十行、二十行，然后是五十行。与此同时，函数被不断调整以执行更多功能，条件语句增加了几个条件，或者创建了几个额外的变量。\n\
  \n当这样的应用程序（不可避免地）崩溃时，要理清代码并找到问题可能是一场噩梦。\n\n正如你在第 22 小时中读到的样，“良好的编码实践](#part0037.xhtml_ch22)”，良好的编码实践可以帮助让你的代码更容易理解和维护，但你还有其他可以做的事。随着你的\
  \ JavaScript 应用程序规模、复杂性和程度的增加，编写易于测试的代码变得更加重要。\n\n在本小时中，你将学习一些编写代码以使其适用于单元测试的方法，以及如何编写和执行此类测试。\n\
  \n### 什么是单元测试？\n\n如果你不熟悉单元测试的概念，不用担心，它理解并不复杂。\n\n通常当人们考虑测试 JavaScript 应用程序时，他们想象的是测试整个系统以查看它是否按预期工作。这本质上是测试应用程序的各个部分是否能协同工作，通常被称为\
  \ `集成测试`。\n\n`单元测试` 是一种软件验证和确认方法，将应用程序拆分为最小的可测试部分，称为`单元`（units），然后对这些单元进行单独检查和测试以确保其运行正常。单元是应用程序最小的可测试部分，例如单个函数或方法。\n\
  \n单元测试可以手动进行，但这种测试通常是自动的。\n\n本质上，你为你代码的每个基本元素编写一系列测试，以测试该单元在所有可能的输入类型下的性能。如果所有这些测试都通过了，你就可以确认每个测试过的元素都是符合目的的。\n\
  \n## 动手尝试：一个自制的单元测试\n\n让我们直接开始，从从开始执行一个单元测试。\n\n在这个示例中，我们将编写一些测试，在示例单元上执行它们，并将结果摘要发送到浏览器控制台。\n\
  \n让我们看看我们在第 3 小时中编写的一个函数，“使用函数](#part0012.xhtml_ch03)”，用于按给定比例为净额加税并返回总金额：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction addTax(subtotal, taxRate) {\n    var total = subtotal\
  \ * (1 + (taxRate/100));\n    return total;\n}\n```\n\n这个函数构成了我们将进行测试的单元。\n\n我们将此函数保存在文件\
  \ `tax.js` 中，并将其包含在作为测试套件的 HTML 页面中。在现实世界中，`tax.js` 可能包含许多不同的函数，也许作为财务应用程序的一部分，但对于这个示例它足够了。HTML\
  \ 代码如列表 24.1 所示。\n\n**列表 24.1 测试套件的 HTML 代码**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE\
  \ html>\n<head>\n  <title>手动单元测试示例</title>\n  <script src=\"tax.js\"></script>\n\
  \  <script>\n  function test(amount, rate, expected) {\n      results.total++;\n\
  \      var result = addTax(amount, rate);\n      if (result !== expected) {\n  \
  \      results.failed++;\n        console.log(\"Expected \" + expected + \", but\
  \ instead got \" + result);\n      }\n  }\n  var results = {\n    total: 0,\n  \
  \  failed: 0\n  };\n  // 我们的单元测试\n  test(1, 10, 1.1);\n  test(5, 12, 5.6);\n  test(100,\
  \ 17.5, 117.5);\n  // 将结果输出到控制台\n  console.log(results.total + \" tests carried\
  \ out, \" + results.failed + \" failed, \" +(results.total - results.failed) + \"\
  \ passed.\");\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n在此页的 `<script>`\
  \ 元素中，我定义了一个名为 `test()` 的函数，它接受三个参数。参数 `amount` 和 `rate` 是传递给函数的值，`expected` 是我们预期的值。函数会增加\
  \ `results.total`，调用 `addTax` 获取结果。如果结果不等于预期值，它会增加 `results.failed` 并在控制台打印信息。变量\
  \ `results` 包含 `total: 0` 和 `failed: 0`。然后是我们的单元测试：`test(1, 10, 1.1);`、`test(5,\
  \ 12, 5.6);`、`test(100, 17.5, 117.5);`。最后，将结果输出到控制台，显示执行的测试总数、失败次数和通过次数。\n\n在此页的\
