  \ Explorer、Mozilla Firefox、Opera、Safari 或 Google Chrome。建议将你的浏览器升级到最新的当前稳定版本。\n\n\
  本书的大多数示例不需要互联网连接即可运行。只需将源代码文件存储在计算机上方便的位置并用你选择的浏览器打开通常就足够了。例外是关于 Cookie 的节课程以及书中演示\
  \ Ajax 的示例；要探索所有示例代码将网络连接（或连接到局域网上的 Web 服务器）以及一些网络空间来发布示例代码。如果你做过 HTML 编码，你可能已经涵盖了这一点；如果没有，一个爱好级的虚拟主机账户费用非常低，对于尝试书中的示例完全足够。（如果你想尝试\
  \ 第五部分 中的 Ajax 示例，请检查你的 Web 主机是否允许运行用 `PHP` 语言编写的脚本。几乎所有的都支持。）\n\n# 第一部分：JavaScript\
  \ 初步\n\n## 第 1 节：引入 JavaScript\n\n***\n\n### 本节你将学到：\n![Image](img/image00365.jpeg)\
  \ 关于服务器端和客户端编程\n![Image](img/image00365.jpeg) JavaScript 如何改进你的网页\n![Image](img/image00365.jpeg)\
  \ JavaScript 的历史\n![Image](img/image00365.jpeg) 文档对象模型 (DOM) 的基础\n![Image](img/image00365.jpeg)\
  \ 什么是 `window` 和 `document` 对象\n![Image](img/image00365.jpeg) 如何使用 JavaScript 向你的网页添加内容\n\
  ![Image](img/image00365.jpeg) 如何使用对话框提示用户\n\n***\n\n现代 Web 与其最初的、纯文本的祖先关系不大。现代网页可以涉及音频、视频、动画图形、交互式导航等——而且在大多数情况下，JavaScript\
  \ 在实现这一切方面发挥了巨大的作用。\n\n在我们的第一节课程中，我们描述了 JavaScript 是什么，简要回顾了该语言的起源，并考虑了它可以改进你网页的各种类型。你还将直接上手编写一些可以运行的\
  \ JavaScript 代码。\n\n### Web 脚本基础\n既然你拿起了这本书，很有可能你已经熟悉了使用万维网，并且对使用某种 `HTML` 编写网页有基础的了解。\n\
  \nHTML（超文本标记语言）不是一种*编程*语言，而是（如名称所示）是一种*标记*语言；我们可以使用它来标记页面的部分，以指示浏览器这些部分应以特定的方式显示——例如粗体或斜体文本，或者作为标题、列表、排列成数据表格或使用许多其他标记选项。\n\
  \n一旦编写完成，这些页面从本质上来说是*静态的。它们无法响应用户操作、做出决策或修改其页面元素的显示。它们包含的标记每当用户访问时将始终以相同的方式被解释和显示。\n\
  \n正如你通过万维网所知，现代网站可以做得更多；我们经常访问的页面往往不是静态的。它们可以包含“实时”数据，例如股票价格或航班到达时间、带有颜色和字体变化的动画显示，或者交互功能，如点击浏览画廊或排序数据列。\n\
  \n这些巧妙的功能是由后台运行的程序（通常称为*脚本*）为用户提供的这些程序通过操作浏览器中显示的内容来提供功能。\n\n\n\n\n`script` 一词无疑借用自剧院和电视领域，在这些领域，`script`\
  \ 定义了主持人或表演者的动作。对于网页而言，主角是页面上的元素，而 `script` 则由脚本语言提供，在本例中为 `JavaScript`。对我们而言，`Program`\
  \ 和 `script` 几乎是可以互换的术语，`programming` 和 `scripting` 也是如此。你将在本书中发现这些词都将被使用。\n\n***\n\
  \n## 服务端编程与客户端编程\n\n向原本静态的 Web 内容中添加脚本有两种两种基本方法：\n\n![Image](img/image00365.jpeg)\
  \ 你可以由 Web 服务器在将页面交付给用户之前执行脚本。此类脚本可以定义发送到浏览器以供用户显示的信息——例如，从在线商店的数据库中检索产品价格，在用户登录网站私有区域之前检查其身份凭证，或者检索电子邮箱箱的内容。这些脚本通常在\
  \ Web 服务器生成请求的网页并将其提供给用户 `before` 运行。得知我们将其称为 `server-side scripting`（服务端脚本）你不会感到意外。\n\
  \n![Image](img/image00365.jpeg) 另一种是脚本本身不是在服务器上运行，而是随着页面代码一起交付给用户的浏览器。此类脚本随后由浏览器执行并在已交付的页面内容上操作。此类脚本可以执行的许多功能包括页面部分的动画、重新调整页面布局、允许用户在页面内拖放项目、验证表单上的用户输入、将用户重定向到其他页面等。你可能已经猜出这被称为\
  \ `client-side scripting`（客户端脚本），你是正确的。\n\n本书完全是关于 `JavaScript` 的，它是互联网上最常用的客户端脚本语言。\n\
  \n***\n\n## 注意事项\n\n事实上，有一种优雅的方法可以将服务端脚本的输出合入到你的客户端 `JavaScript` 程序中。我们将在第五部分 的“使用\
  \ JavaScript 库”中，在学习一种名为 `Ajax` 的技术时研究这一内容。\n\n***\n\n## JavaScript 概览\n\n***\n\n\
  ## 注意事项\n\n尽管名称相似，但 `JavaScript` 与 Sun Microsystems 开发的 `Java` 语言没有任何关系（如果真有关系的话）。这两种语言在语法上有一些共同之处，但它们与许多其他编程语言的共同点并不更多。\n\
  \n***\n\n用 `JavaScript` 编写的程序可以访问 Web 页面的元素以及运行它的浏览器窗口，并对这些元素执行操作，还可以创建新的页面元素。`JavaScript`\
  \ 能力的一些示例包括：\n\n![Image](img/image00365.jpeg) 打开具有指定大小、位置和样式的新窗口（例如，窗口是否有边框、菜单、工具栏等）\n\
  \n![Image](img/image00365.jpeg) 提供用户友好的导航辅助，如下拉菜单\n\n![Image](img/image00365.jpeg)\
  \ 验证输入到 Web 表单的数据，以确保在表单提交到 Web 服务器之前符合可接受的格式\n\n![Image](img/image00365.jpeg) 在发生特定事件时（如鼠标光标移动到其上方）更改页面元素的外观和行为\n\
  \n![Image](img/image00365.jpeg) 检测并利用特定浏览器支持的高级特性，例如第三方插件或对新技术的原生支持\n\n由于 `JavaScript`\
  \ 代码在用户的浏览器内部运行，页面倾向于快速响应 `JavaScript` 指令，从而增强用户体验并使应用程序看起来更像计算机的原生应用程序，而不仅仅是一个网页。此外，`JavaScript`\
  \ 可以检测并利用 `HTML` 无法实现的某些用户操作，例如单个鼠标点击和键盘操作。\n\n几乎每个常用的浏览器都支持 `JavaScript`。\n\n###\
  \ JavaScript 的来源\n\n`JavaScript` 的起源可以追溯到 20 世纪 90 年代中期，当时推出了 `Netscape Navigator`\
  \ 2.0 版本。\n\n欧洲计算机制造商协会 (`ECMA`) 加入了其中，定义了 `ECMAScript`，这是当前语言的祖父。同时，微软推出了 `jScript`\
  \ 作为其自己的语言版本，用于其 `Internet Explorer` 系列浏览器。\n\n***\n\n### 提示\n\n`ECMA` 继续发布 `ECMAScript`\
  \ 语言标准的更新版本。在编写时，`ECMAScript` 6 即将完成最终版本，在第六部分 的“高级主题”中，你可以很快了解到一些即将提供的新语言特性。\n\n\
  ***\n\n***\n\n## 注意事项\n\n`JavaScript`并不是唯一的客户端脚本语言。微软浏览器除了支持 `jScript`（微软版本的 `JavaScript`）外，还支持公司自己的\
  \ `Visual Basic` 语言的一个面向脚本的版本，称为 `VBScript`。\n\n然而，`JavaScript` 拥有更好的浏览器支持；几乎每个现代浏览器都支持\
  \ `JavaScript` 版本。\n\n***\n\n#### 浏览器大战\n\n20 世纪 90 年代后期，`Netscape Navigator` 4\
  \ 和 `Internet Explorer` 4 都声称在 `JavaScript` 实现方面比早期浏览器版本有了重大改进。\n\n遗憾的是，两组开发者走向了不同的方向，各自定义了对\
  \ `JavaScript` 语言的扩展以及它与网页交互的方式。\n\n这种荒谬的情况迫使开发者基本上为每个脚本编写两个版本，并使用一些笨拙且经常出错的程序来尝试判断在使用哪个浏览器查看页面，随后切换到最合适的\
  \ `JavaScript` 代码版本。\n\n***\n\n## 注意事项\n\n万维网联盟 (`W3C`)是一个国际社区，旨在开发开放标准以支持万维网的长期增长。其网站\
  \ [`www.w3.org/`](http://www.w3.org/) 是关于 Web 标准信息和工具的庞大资源库。\n\n谢幸的是，万维网联盟 (`W3C`)\
  \ 与各个浏览器制造商共同努力，通过文档对象模型 (`DOM`) 标准化网页的构建和操作方式。新的标准 `DOM` 1 级于 1998 年底完成，2 级于 2000\
  \ 年底完成。\n\n如果你不知道 `DOM` 是什么或它是做什么的，不要担心——你将在本小时晚些时候以及书中学习许多关于它的知识。\n\n### <script>\
  \ 标签\n\n每当用户请求页面时，其中包含的任何 `JavaScript` 程序都会随页面内容一起传递给浏览器。\n\n***\n\n## 注意事项\n\n\
  `JavaScript` 是一种*解释型*语言，而不是像 `C++` 或 `Java` 那样的*编译型*语言。`JavaScript` 指令以纯文本传递给浏览器并按顺序解释；它们不需要先“编译”成只有计算机处理器才能读取的机器码。这提供了巨大的优势，因为\
  \ `JavaScript` 程序易于阅读，可以快速编辑，并且通过在浏览器中重新加载网页即可重新测试其运行情况。\n\n***\n\n你可以通过在 HTML 代码中的\
  \ `<script>` 和 `</script>` 标签之间直接放置 `JavaScript` 语句将其包含在 HTML 中：\n\n点击查看代码图像\n\n\
  ```\n<script>\n\n    ... JavaScript 语句 ...\n\n</script>\n```\n\n\n\n\n\n书中的示例均编写为符合\
  \ HTML5 验证标准，在 HTML5 中，`<script>` 元素不需要强制性属性（`type` 属性在 HTML5 中是可选的，为了清晰起见，我们在本书的示例中排除了该属性）。然而，如果你编写\
  \ JavaScript 用于包含在 HTML 4.x 或 XHTML 页面，则应该为你的 `<script>` 元素添加 `type` 属性：\n\n点击此处查看代码图像\n\
  \n```html\n<script type=\"text/javascript\">\n    ... JavaScript statements ...\n\
  </script>\n```\n\n你偶尔还会看到 `<script>` 元素带有 `language=\"JavaScript\"` 属性。这早已被废弃（deprecated），因此除非你认为你需要支持像\
  \ Navigator 和 Mosaic 这样的古老浏览器，否则没有必要继续编写这样的代码。\n\n***\n\n**注意**\n\n`deprecated`（废弃）一词用于软件特性或实践，表示最好避免使用它们，通常是因为它们已经被取代了。\n\
  \n尽管为了提供向后兼容性仍然受到支持，但它们的 `deprecated` 状态通常意味着此类功能将在不久的将来被移除。\n\n***\n\n本节的示例将 JavaScript\
  \ 代码放置在文档的 `body` 部分，但 JavaScript 代码也可以出现在文档的其他地方；你也可以使用 `<script>` 元素加载保存在外部文件中的\
  \ JavaScript 代码。我们将在第 2 小节 “编写简单脚本”中详细地讨论如何在你的页面中包含 JavaScript。\n\n### 引入 DOM\n\n\
  文档对象模型（DOM）是一种将文档及其内容的概念化可视化方法。\n\n每当要求浏览器加载并显示页面时，它需要解释（我们通常使用“解析”一词）组成页面的 HTML\
  \ 文件中所包含源代码。作为解析过程的一部分，浏览器会根据加载的文档内容创建一种名为 DOM 表达式的内部模型。浏览器在渲染可见页面时会引用这个模型。你可以使用\
  \ JavaScript 访问并编辑 DOM 表达式的各个部分，同时改变用户查看和与视图页面交互的方式。\n\n在早期，JavaScript 对网页某些部分的访问相当初级。例如，JavaScript\
  \ 程序可以访问网页中包含的图像和表单；JavaScript 程序可以包含语句来选择“页面上的第二个表单”或“名为‘registration’的表单”。\n\n\
  Web 开发人员有时将其称为 DOM Level 0，这是对 W3C 后续 Level 1 DOM 定义的后兼容致敬。除了 DOM Level 0，你可能还会看到对\
  \ BOM（浏览器对象模型）的引用。从那时起，W3C 逐渐扩展并改进了 DOM 规范。W3C 更具野心的定义产生了一个不仅适用于网页和 JavaScript，还适用于任何编程语言和\
  \ XML（以及 HTML 文档）的 DOM。\n\n***\n\n**注意**\n\n在书中，我们专注于 W3C 的 DOM Level 1 和 Level\
  \ 2 DOM 定义。如果你对各种 DOM 级别的细节感兴趣，可以在 [`developer.mozilla.org/en/DOM_Levels`](https://developer.mozilla.org/en/DOM_Levels)\
  \ 找到良好的概览。\n\n***\n\n### W3C 与标准兼容性\n\n浏览器供应商在他们的最新版本中已经整合了大大改进的 DOM 支持。在编写本书时，Internet\
  \ Explorer 正在发布 11 版本，Netscape Navigator 已经重生为 Mozilla Firefox（当前版本为 35.0），市场上的其他竞争对手包括\
  \ Opera、Konqueror、Apple 的 Safari 以及 Google 的 Chrome 和 Chromium。所有这些都对 DOM 提供了优秀的支持。\n\
  \nWeb 开发人员的状况有了显著改善。除了少数恼人的特殊情况外，只要我们遵循 DOM 标准，现在我们很大程度上可以忘记为单个浏览器编写特殊代码了。\n\n***\n\
  \n**注意**\n\n如 Netscape Navigator（任何版本）和直到 5.5 版本的 Internet Explorer 等早期浏览器现在几乎已经消失了。本书关注的是兼容\
  \ DOM Level 1 或更高版本的现代浏览器，例如 Internet Explorer 9+、Firefox、Google Chrome、Apple Safari、Opera\
  \ 和 Konqueror。建议你将浏览器升级到最新的稳定版本。\n\n***\n\n### window 和 document 对象\n\n每当你的浏览器加载并显示页面时，它会在内存中创建该页面及其所有元素的内部表示，即\
  \ DOM。在 DOM 中，你网页的元素具有逻辑层级结构，像一棵相互连接的父子 `objects`（对象）树。这些对象及其相互连接形成了包含并显示该网页的浏览器的概念模型。每个对象都有一个描述它的\
  \ `properties`（属性）列表，以及若干个可以使用 JavaScript 来操作这些属性的 `methods`（方法）。\n\n在层级树的最顶端是浏览器的\
  \ `window` 对象。该对象是你页面 DOM 表示中其他所有内容的父或祖先。\n\n`window` 对象有各种子对象，其中一些在图 1.1 中可视化了。图\
  \ 1.1 中显示的第一个子对象，也是我们在书中最常用的对象，是 `document` 对象。任何加载到浏览器的 HTML 页面都会创建一个 `document`\
  \ 对象，包含组成显示页面的所有 HTML 和其他资源。所有这些信息可以通过 JavaScript 以父子层级结构的形式访问，每个对象都有自己的属性和方法。\n\
  \n![Image](img/image0036.jpeg)\n\n**图 1.1** `window` 对象及其部分子对象\n\n图 1.1 中可见的 `window`\
  \ 其他子对象是 `location` 对象（包含当前加载页面 URL 的详情）、`history` 对象（包含浏览器之前访问页面的详情）以及 `navigator`\
  \ 对象（存储浏览器类型、版本和功能详情）。我们将在第 4 小节 “DOM 对象和内置对象”中详细查看这些对象，并在书中多次再次使用它们，但现在让我们专注于 `document`\
  \ 对象吧。\n\n#### 对象表示法\n\n我们用于表示树内对象的表示法使用点（句号）：\n\n```\nparent.child\n```\n\n例如，参考图\
  \ 1.1，`location` 对象是 `window` 对象的子对象，因此在 DOM 中这样引用它：\n\n```\nwindow.location\n```\n\
  \n***\n\n**提示**\n\n这种表示法可以根据需要任意扩展，以表示树中的任何对象。例如\n\n```\nobject1.object2.object3\n\
  ```\n\n表示 `object3`，其父对象是 `object2`，而 `object2` 又是 `object1` 的子对象。\n\n***\n\n你 HTML\
  \ 页面的 `<body>` 部分在 DOM 中被表示为 `document` 对象的子元素；我们这样访问它：\n\n```\nwindow.document.body\n\
  ```\n\n序列中的最后一项也可以不是另一个对象，而是父对象的 `property`（属性）或 `method`（方法）：\n\n```\nobject1.object2.property\n\
  \nobject1.object2.method\n```\n\n例如，假设我们想要访问当前文档的 `title` 属性，如 HTML `<title>...</title>`\
  \ 标签指定的。我们可以直接使用\n\n```\nwindow.document.title\n```\n\n***\n\n**注意**\n\n如果对象层级结构和点表示法现在看起来还不清楚，请不要担心。你将在读书过程中看到很多示例的！\n\
  \n***\n\n***\n\n**提示**\n\n`window` 对象始终包含当前浏览器窗口，因此你可以引用 `window.document` 来访问当前文档。作为快捷方式，你也可以直接使用\
  \ `document` 代替 `window.document` ——这同样指向当前文档。\n\n\n\n\n\n如果你打开了多个窗口，或者正在使用框架集（frameset），那么每个窗口或框架都将有一个独立的\
  \ `window` 和 `document` 对象。要引用其中任何一个文档，你需要使用该窗口或框架所属的相关窗口名称和文档名称。\n\n### 与用户交互\n\
  \n让我们来看一些与 `window` 和 `document` 对象相关的方法。我们先从两个方法开始，每种方法都提供了一种与用户交互的手段。\n\n### `window.alert()`\n\
  \n即使你没有意识到，你在很多场合也已经见过 `window` 对象的 `alert` 方法产生的结果。你可能记得，`window` 对象位于 DOM 层次结构的顶端，代表了显示你页面的浏览器窗口。当你调用\
  \ `alert()` 方法时，浏览器会弹出一个对话框，显示你的消息以及一个 OK 按钮。这是一个示例：\n\n点击此处查看代码图像\n\n```\nwindow.alert(\"\
  Here is my message\");\n```\n\n这是我们关于点符号表示法（dot notation）的第一个运行示例。在这里，我们调用了 `window`\
  \ 对象的 `alert()` 方法，因此我们的 `object.method` 符号变为 `window.alert`。\n\n**提示**\n\n在实践中，你可以省略语句中的\
  \ `window.` 部分。因为 `window` 对象是 DOM 层次结构的顶端（它有时被称为 `global object`），任何在没有直接引用其父对象的情况下调用的方法都会被认为属于\
  \ `window.`。所以：\n\n点击此处查看代码图像\n\n```\nalert(\"Here is my message\");\n```\n\n效果同样很好。\n\
  \n注意括号内的文本行包含在引号中。这些引号可以是单引号或双引号，但它们必须存在，否则会产生错误。\n\n这行代码在浏览器中执行时，会弹出一个类似于图 1.2](#part010.xhtml_ch01fig2)所示的对话框。\n\
  \n![Image](img/image0367.jpeg)\n\n**图 1.2** 一个 `window.alert()` 对话框\n\n**提示**\n\n\
  图 1.2](#part010.xhtml_ch01fig2) 显示了在 Ubuntu 上运行的 Chrome 浏览器生成的警报。对话框的外观会根据你使用的特定浏览器、操作系统和显示选项发生细微变化，但它始终包含消息和一个\
  \ OK 按钮。\n\n**提示**\n\n在用户点击 OK 之前，他被阻止对页面进行任何其他操作。这种行为的对话框被称为 `modal`（模态）对话框。\n\n\
  ### `document.write()`\n\n你可能仅根据名称就能猜出文档对象的 `write` 方法的作用。该方法不是弹出对话框，而是直接将字符写入文档的\
  \ DOM 中，如图 1.3](#part010.xhtml_ch01fig3) 所示。\n\n点击此处查看代码图像\n\n```\ndocument.write(\"\
  Here is another message\");\n```\n\n![Image](img/image0368.jpeg)\n\n**图 1.3** 使用\
  \ `document.write()`\n\n**注意**\n\n事实上，`document.write` 是一种向页面写入内容的相当愚蠢的方法——无论在功能、编码风格还是可维护性方面，它都有局限性。在“严肃”的\
  \ JavaScript 编程中，它已很大被弃用。当你编写更高级的 JavaScript 程序时，你已经学习了使用 JavaScript 将内容放入页面的更好方法。然而，在第一部分](#part009.xhtml_part01)你熟悉一些基本原理期间，我们会经常使用\
  \ `document.write`。\n\n#### 动手尝试一下：JavaScript 中的“Hello World!”\n\n在介绍一种编程语言时，如果不介绍传统的“Hello\
  \ World”示例，似乎是很不礼貌的。看看列表 1.1](#part010.xhtml_ch01lis1) 中的简单 HTML 文档。\n\n**列表 1.1**\
  \ `alert()` 对话框中的“Hello World!”\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>Hello from JavaScript!</title>\n</head>\n<body>\n    <script>\n\
  \        alert(\"Hello World!\");\n    </script>\n</body>\n</html>\n```\n\n在你的文本编辑器中创建一个名为\
  \ `hello.html` 的文档，并输入上述代码。将它保存到计算机上方便的地方，然后用 浏览器打开它。\n\n**注意**\n\n某些文本编辑器程序可能会尝试为文件名添加\
  \ `.txt` 扩展名。确保你保存的文件具有 `.html` 扩展名，否则浏览器可能无法正确打开它。\n\n许多流行的操作系统允许你右键点击 HTML 文件的图标并选择“打开方式……”或类似的字样。或者，启动你选择的浏览器，并使用菜单栏上的**文件\
  \ > 打开** 选项导航到你的文件并将其加载到浏览器中。\n\n你会看到一个类似于图 1.2](#part010.xhtml_ch01fig2)的显示，但对话框中的消息是“Hello\
  \ World!”。如果你计算机上安装了多个浏览器，请尝试所有的浏览器并比较显示效果——对话框可能略有不同，但消息和 OK 按钮的操作应该是完全相同的。\n\n\
  **注意**\n\n某些浏览器的默认安全设置会导致它们在被要求打开本地内容（如你自己计算机上的文件）时显示安全警告。如果你的浏览器这样做，只需选择允许显示内容的选项即可。\n\
  \n### 读取 document 对象的属性\n\n你可能记得在这一小时早些时候，DOM 树中的对象具有属性和方法。你已经看到如何使用 `document`\
  \ 对象的 `write` 方法向页面输出文本——现在让我们尝试读取 `document` 对象的属性之一。我们将使用 `document.title` 属性，它包含了页面\
  \ HTML `<title>` 元素中定义的标题。\n\n在你的文本编辑器中编辑 `hello.html`，更改对 `window.alert()` 方法的调用：\n\
  \n```\nalert(document.title);\n```\n\n注意 `document.title` 现在没有包含在引号中——如果是那样，JavaScript\
  \ 将推断我们想要输出字符串“document.title”作为字面文本。如果没有引号，JavaScript 将 `document.title` 属性的值发送给\
  \ `alert()` 方法。结果所示图 1.4](#part010.xhtml_ch01fig4)。\n\n![Image](img/image369.jpeg)\n\
  \n**图 1.4** 显示 `document` 对象的属性\n\n### 总结\n\n在本节课程中，你接触了服务器端和客户端脚本的概念，并对 JavaScript\
  \ 和文档对象模型进行了简短的历史回顾。你概述了 JavaScript 用于增强网页和改进用户体验的各种功能。\n\n此外，你还学习了文档对象模型的基本结构，以及\
  \ JavaScript 如何访问特定对象及其属性，并使用这些对象的方法。\n\n在接下来的课程中，我们将基于这些基础概念，进入更高级的项目。\n\n## 问答\n\
  \n**Q. 如果我使用服务器端脚本（使用 PHP 或 ASP 等语言），我仍然可以在客户端使用 JavaScript 吗？**\n\n**A.** 绝对可以。事实上，服务器端脚本和客户端脚本的结合提供了一个强大的平台，能够产生强大的应用程序。Google\
  \ 的 Gmail 就是一个很好的例子。\n\n**Q. 我应该测试多少不同的浏览器？**\n\n**A.** 尽可能多地测试。编写符合标准的且避免使用浏览器特定功能的代码将有助于你的代码在不同浏览器中顺畅运行。然而，浏览器对某些功能的实现之间的细微差异可能一直存在。\n\
  \n**Q. 引入 JavaScript 代码会减慢页面的加载速度吗？**\n\n\n\n\n\n# A\n是的，尽管通常差异很小到无法察觉。如果你有一段特别大的\
  \ JavaScript 代码，你可能会觉得在用户可能连接的最慢连接上测试你的页面是值得的。除了极端情况外，这不太可能是一个严重的问题。\n\n## 工作坊\n\
  \n在阅读后续的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n**1.** JavaScript 是编译型语言还是解释型语言？\n\na. 编译型语言\n\
  \nb. 解释型语言\n\nc. 两者都不是\n\nd. 两者都是\n\n**2.** 在 HTML 页面必须添加哪些额外的标签来包含 JavaScript 语句？\n\
  \na. `<script>` 和 `</script>`\n\nb. `<type=\"text/javascript\">`\n\nc. `<!--` 和\
  \ `-->`\n\n**3.** DOM 层次结构的顶层被以下内容占据：\n\na. `document` 属性\n\nb. `document` 方法\n\n\
  c. `document` 对象\n\nd. `window` 对象\n\n#### 答案\n\n**1.** b. JavaScript 是解释型语言。程序代码以纯文本形式编写，语句被逐条读取并执行。\n\
  \n**2.** a. JavaScript 语句被添加在 `<script>` 和 `</script>` 标签之间。\n\n**3.** d. `window`\
  \ 对象位于 DOM 树的顶层，`document` 对象是它的子对象之一。\n\n## 练习\n\n![Image](img/image00365.jpeg)\
  \ 在本小时的“自己尝试一下”部分中，我们使用了行代码\n\n```\nalert(document.title);\n```\n\n来输出 `document`\
  \ 对象的 `title` 属性。尝试重写该脚本，改为输出 `document.lastModified` 属性，该属性包含网页最后修改的日期和时间。（注意——属性名对大小写敏感。注意大写的字母\
  \ M。）看看你是否可以修改代码，使用 `document.write()` 代替 `alert()`，将属性直接写入页面中，如图 1.3 在你所能使用的不同浏览器中尝试本小时的示例代码。你注意到示例页显示方式有什么不同？\n\
  \n## 第 2 小时。编写简单的脚本\n\n* *\n\n你将在本小时学到：\n\n![Image](img/image00365.jpeg) 在网页中包含\
  \ JavaScript 的各种方法\n\n![Image](img/image00365.jpeg) JavaScript 语句的基础语法\n\n![Image](img/image00365.jpeg)\
  \ 如何声明和使用变量\n\n![Image](img/image00365.jpeg) 使用数学运算符\n\n![Image](img/image00365.jpeg)\
  \ 如何为你的代码编写注释\n\n![Image](img/image00365.jpeg) 捕获鼠标事件\n\n* *\n\n你在第 1 小时“[介绍 JavaScript”中学习到，JavaScript\
  \ 是一种能够让网页更具交互性的脚本语言。\n\n在本小时中，你将学习更多关于如何将 JavaScript 添加到你的网页中，然后学习 JavaScript 程序的一些基础语法，如语句、变量、运算符和注释。你还将通过更多代码示例进行实践。\n\
  \n### 在你的网页中包含 JavaScript\n\n在上一小时中，我说 JavaScript 程序是与页面内容一起传递给浏览器的——我们如何实现这一点呢？实际上有两种基本方法可以将\
  \ JavaScript 代码与你的 HTML 页面关联，这两种方法都使用了第 1 小时引入的 `<script></script>` 元素。\n\n一种方法是将\
  \ JavaScript 语句直接包含在 HTML 文件中，就像我们在上一小时做的那样：\n\n点击查看代码图像\n\n```html\n<script>\n\
  \    ... 在这里编写 JavaScript 语句 ...\n</script>\n```\n\n第二种且通常更优优的方法是将你的 JavaScript\
  \ 保存到单独的文件，并使用 `<script>` 元素通过 `src`（源）属性按名称包含该文件：\n\n点击查看代码图像\n\n```html\n<script\
  \ src='mycode.js'></script>\n```\n\n前面的示例包含了 `mycode.js` 文件，其中包含我们的 JavaScript 语句。如果你的\
  \ JavaScript 文件与调用脚本不在同一个文件夹中，你也可以为它添加（相对或绝对的）路径：\n\n点击查看代码图像\n\n```html\n<script\
  \ src='/path/to/mycode.js'></script>\n```\n\n或者\n\n点击查看代码图像\n\n```html\n<script\
  \ src='http://www.example.com/path/to/mycode.js'></script>\n```\n\n将你的 JavaScript\
  \ 代码放在单独的文件中有一些重要的优势：\n\n![Image](img/image00365.jpeg) 当 JavaScript 代码更新时，更新将立即适用于任何使用相同\
  \ JavaScript 文件的页面。这在 JavaScript 库的情况下尤为重要，我们将在书中后面介绍它们。\n\n![Image](img/image00365.jpeg)\
  \ HTML 页面的代码保持更加整洁，因此更容易阅读和维护。\n\n![Image](img/image00365.jpeg) 性能略有提高，因为浏览器会缓存包含的文件；因此，当此页面或其他页面下次需要它时，内存中有一个副本。\n\
  \n* *\n\n**注意**\n\n习惯上为 JavaScript 代码文件赋予 `.js` 扩展名，如示例所示。然而，你包含的文件可以是任何扩展名，浏览器将尝试将内容解释为\
  \ JavaScript。\n\n* *\n\n* *\n\n**警告**\n\n外部文件中的 JavaScript 语句**不能**被 `<script>`\
  \ 标签围绕。\n\n* *\n\n列表 2.1 显示了我们在第 1 小时中使用的简单网页，但现在 `<body>` 部分包含了一个 JavaScript 文件。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>A Simple Page</title>\n</head>\n\
  <body>\n    <p>Some content ...</p>\n    <script src='mycode.js'></script>\n</body>\n\
  </html>\n```\n\n* *\n\n当 JavaScript 代码被添加到文档正文时，代码语句会在页面渲染时被解释并执行。在代码被读取和执行后，页面渲染将继续直到页面完成。\n\
  \n* *\n\n**提示**\n\n你并不局限于使用单个 `script` 元素——你可以在页面上放置任意数量的元素。\n\n* *\n\n* *\n\n**注意**\n\
  \n你有时会在 `script` 元素内部看到 HTML 风格的注释符号 `<!--` 和 `-->`，它们围绕着 JavaScript 语句，如下：\n\n\
  点击查看代码图像\n\n```html\n<script>\n    <!--\n    ... 在这里编写 JavaScript 语句 ...\n    -->\n\
  </script>\n```\n\n这是为了那些不识别 `<script>` 标签的老旧浏览器。这种 HTML “注释”语法防止了此类浏览器在屏幕上随页面内容一起显示\
  \ JavaScript 源代码。除非你有支持非常老浏览器的理由，否则这种技术不再需要了。\n\n* *\n\n### JavaScript 语句\n\nJavaScript\
  \ 程序是单个指令的列表，我们称之为*语句*。为了正确解释语句，浏览器期望找到每个语句都单独写在一行：\n\n```\nthis is statement 1\n\
  ```\n\n\n\n\n\n这是语句 2\n\n或者，也可以通过在每个语句末尾加上分号将它们合并在同一行：\n\n点击此处查看代码图片\n\n```javascript\n\
  this is statement 1; this is statement 2;\n```\n\n为了提高代码的可读性，并帮助防止难以发现的语法错误，良好的做法是结合以上方法：让每个语句单独占一行，并以分号结束：\n\
  \n```\nthis is statement 1;\n\nthis is statement 2;\n```\n\n## 为你的代码添加注释\n\n某些语句并不是为了让浏览器的\
  \ JavaScript 解释器执行，而是为了任何可能阅读这些代码的人提供便利。我们将此类行称为`注释（comments）`，并且在代码中添加注释有特定的规则。\n\
  \n只占单行代码的注释可以在行内容之前放置双正斜杠 `//` 来编写：\n\n```\n// This is a comment\n```\n\n* * *\n\
  \n### 注意\n\nJavaScript 也可以使用 HTML 注释语法来编写单行注释：\n\n```html\n<!-- this is a comment\
  \ -->\n```\n\n然而，这在 JavaScript 程序中并不常用。\n\n* * *\n\n要以此方式添加多行注释，我们需要在每一行注释前加上前缀：\n\
  \n```javascript\n// This is a comment\n\n// spanning multiple lines\n```\n\n在代码中输入多行注释更方便的方法是使用\
  \ `/*` 作为注释前缀，并用 `*/` 结束。使用这种语法编写的注释可以跨多行：\n\n```javascript\n/*  This comment can\
  \ span\n\n    multiple lines\n    without needing\n    to mark up every line  */\n\
  ```\n\n为代码添加注释确实是一件很好的事情，尤其是当你编写较大或更复杂的 JavaScript 应用时。注释可以作为你的提醒，也可以作为日后阅读你代码的其他人的指令和解释。\n\
  \n* * *\n\n### 注意\n\n诚然，注释会稍微增加 JavaScript 源文件的大小，这可能会对页面加载时间产生不利影响。通常，这种差异微小到几乎察觉不到，但如果真的很重要，你始终可以从\
  \ JavaScript 文件的“生产”版本中删除所有注释——即用于上线环境而非开发环境网站的版本。\n\n* * *\n\n### 变量\n\n变量可以被认为是一个命名的“鸽巢”，我们在其中存储特定的数据。此类数据可以采取许多不同的形式——整数或小数、字符字符串，或者在本节或后续章节中讨论的各种其他数据类型。我们可以为变量命名为任何名称，只要名称中只使用字母、数字、美元符号\
  \ `$` 或下划线 `_` 即可。\n\n* * *\n\n### 注意\n\nJavaScript 是大小写的——名为 `mypetcat` 的变量与 `Mypetcat`\
  \ 或 `MYPETCAT` 是不同的变量。\n\n许多 JavaScript 以及其他编程语言的程序员喜欢使用所谓的驼峰命名法（CamelCase，也称为混合\
  \ Case、BumpyCaps 以及其他各种名称）作为变量名。在 `CamelCase` 中，复合词或短语的元素在没有空格的情况下连接，每个元素的首字母大写，但第一个字母可以是大写也可以是小写。在这个例子中，变量将命名为\
  \ `MyPetCat` 或 `myPetCat`。\n\n* * *\n\n假设我们有一个名为 `netPrice` 的变量。我们可以通过一个简单的语句设置存储在\
  \ `netPrice` 中的值：\n\n```javascript\nnetPrice = 8.99;\n```\n\n我们称这为给变量*赋值*。注意，我们不需要在赋值之前像某些其他编程语言那样声明该变量的存在。然而，在\
  \ JavaScript 中通过使用 `var` 关键字是可以实现的，而且在大多数情况下是良好的编程习惯：\n\n```javascript\nvar netPrice;\n\
  \nnetPrice = 8.99;\n```\n\n或者，我们可以方便且易读地将这两个语句合并为一语句：\n\n```javascript\nvar netPrice\
  \ = 8.99;\n```\n\n要将一个*字符字符串*赋值为变量的值，我们需要将该字符串包含在单引号或双引号中：\n\n点击此处查看代码图片\n\n```javascript\n\
  var productName = \"Leather wallet\";\n```\n\n例如，我们可以写一行代码，将该变量中包含的值发送给 `window.alert`\
  \ 方法：\n\n```javascript\nalert(productName);\n```\n\n生成的对话框将评估变量并将其显示出来（这次在 Mozilla\
  \ Firefox 中），如图 2.1 所示。\n\n![Image](img/image0037.jpeg)\n\n**图 2.1** 显示变量 `productName`\
  \ 的值\n\n* * *\n\n### 提示\n\n选择可读的变量名。使用像 `productName` 和 `netPrice` 这样的变量名，比将相同的变量命名为\
  \ `var123` 和 `myothervar49` 使代码更容易阅读和维护，尽管后者名称是完全有效的。\n\n* * *\n\n### 运算符\n\n如果我们不能在计算中对它们进行操作，存储在变量中的值对我们来说就没有太大用。\n\
  \n#### 算术运算\n\n首先，JavaScript 允许我们使用标准的加、减、乘、除算术运算符执行操作。\n\n```javascript\nvar theSum\
  \ = 4 + 3;\n```\n\n正如你所猜想的，在执行此语句后，变量 `theSum` 将包含一个 7 的值。我们也可以在操作中使用变量名：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar productCount = 2;\n\nvar subtotal = 14.98;\n\nvar shipping\
  \ = 2.75;\n\nvar total = subtotal + shipping;\n```\n\n我们可以以类似的方式使用 JavaScript 进行减法\
  \ (`-`)、乘法 (`*`) 和除法 (`/`)：\n\n点击此处查看代码图片\n\n```javascript\nsubtotal = total – shipping;\n\
  \nvar salesTax = total * 0.15;\n\nvar productPrice = subtotal / productCount;\n\
  ```\n\n要计算除法的余数，我们可以使用 JavaScript 的*取模除*运算符。它用 `%` 字符表示：\n\n点击此处查看代码图片\n\n```javascript\n\
  var itemsPerBox = 12;\n\nvar itemsToBeBoxed = 40;\n\nvar itemsInLastBox = itemsToBeBoxed\
  \ % itemsPerBox;\n```\n\n在这个例子中，在最后一个语句完成后，变量 `itemsInLastBox` 将包含数字 4。\n\nJavaScript\
  \ 还有方便的运算符来递增 (`++`) 或自减 (`--`) 变量的值：\n\n```javascript\nproductCount++;\n```\n\n\
  这等同于语句\n\n点击此处查看代码图片\n\n```javascript\nproductCount = productCount + 1;\n```\n\n\
  同样，\n\n```javascript\nitems--;\n```\n\n等同于\n\n```javascript\nitems = items – 1;\n\
  ```\n\n* * *\n\n### 提示\n\n如果你需要将变量递增或减少除 1 以外的值，JavaScript 还允许将其他算术运算符与 `=` 运算符结合；例如，`+=`\
  \ 和 `-=`。\n\n以下两行代码是等价：\n\n```javascript\ntotal = total + 5;\n\ntotal += 5;\n```\n\
  \n这两个也是等价：\n\n```javascript\ncounter = counter - step;\n\ncounter -= step;\n```\n\
  \n我们可以将这种符号用于其他算术运算符，例如乘法除法：\n\n```javascript\nprice = price * uplift;\n\nprice\
  \ *= uplift;\n```\n\n* * *\n\nJavaScript 算术运算符更全面的列表出现在附录 B“JavaScript Quick Reference](#part0042.xhtml_app02)”。\n\
  \n#### 运算符优先级\n\n当同一个计算中使用多个运算符时，JavaScript 使用优先级规则来确定计算的顺序。例如，考虑语句\n\n```javascript\n\
  var average = a + b + c / 3;\n```\n\n如果正如变量名所暗示的那样，你试图计算平均值，这不会给出预期的结果；除法操作将在将 `a`\
  \ 和 `b` 的值加到结果之前对 `c` 执行。要正确地计算平均值，我们必须在语句中添加括号，如下：\n\n点击此处查看代码图片\n\n```javascript\n\
  var average = (a + b + c) / 3;\n```\n\n如果你对优先级规则有疑问，我建议你尽可能大量使用括号。这样做没有任何代价，它能让你的代码更容易读（对你以及日后需要编辑或解码代码的其他其他人来说），并确保优先级问题不会破坏你的计算。\n\
  \n\n\n\n\n### 注意\n\n如果你有 PHP 或 Java 等其他语言的编程经验，你会发现 JavaScript 的优先级规则与你所熟悉的规则几乎相同。你可以在\
  \ [`msdn.microsoft.com/en-us/library/z3ks45k7(v=vs.94).aspx`](http://msdn.microsoft.com/en-us/library/z3ks45k7(v=vs.94).aspx)\
  \ 找到关于 JavaScript 优先级的详细信息。\n\n## 在字符串中使用 + 运算符\n\n如果算术运算符操作的变量包含的是字符串而不是数值，那么这些运算符就没多大意义。例外是\
  \ `+` 运算符，JavaScript 将其解释为连接（顺序连接）两个或多个字符串的指令：\n\n点击此处查看代码图像\n\n```\nvar firstname\
  \ = \"John\";\nvar surname = \"Doe\";\nvar fullname = firstname + \" \" + surname;\n\
  // 变量 fullname 现在包含值 \"John Doe\"\n```\n\n 如果你尝试对两个变量使用 `+` 运算符，其中一个是字符串，另一个是数值，JavaScript\
  \ 会将数值转换为字符串并将两者连接：\n\n```\nvar name = \"David\";\nvar age = 45;\nalert(name + age);\n\
  ```\n\n图 2.2 显示了对字符串和数值值使用 `+` 运算符的结果。\n\n![Image](img/image00371.jpeg)\n\n**图 2.2**\
  \ 连接字符串和数值\n\n## 动手试试：将摄氏度转换为华氏度\n\n要将摄氏度温度转换为华氏度温度，我们需要乘以 9，除以 5，然后加上 32。让我们在 JavaScript\
  \ 中实现它：\n\n点击此处查看代码图像\n\n```\nvar cTemp = 100;  // 摄氏度温度\n// 让我们多用用一些括号吧\nvar hTemp\
  \ = ((cTemp * 9) /5 ) + 32;\n```\n\n事实上，我们可以省略此计算中的所有括号，它仍然可以正常工作：\n\n```\nvar hTemp\
  \ = cTemp*9/5 + 32;\n```\n\n然而，括号使代码更易理解，并有助于防止由运算符优先级引起的错误。\n\n让我们在网页中测试这段代码，如\
  \ 列表 2.2 所示。\n\n**列表 2.2 从摄氏度计算华氏度**\n\n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>Fahrenheit From Celsius</title>\n</head>\n<body>\n    <script>\n\
  \        var cTemp = 100;  // 摄氏度温度\n        // 让我们多用用一些括号吧\n        var hTemp =\
  \ ((cTemp * 9) /5 ) + 32;\n        document.write(\"Temperature in Celsius: \" +\
  \ cTemp + \" degrees\");\n        document.write(\"Temperature in Fahrenheit: \"\
  \ + hTemp + \" degrees\");\n    </script>\n</body>\n</html>\n```\n\n将此代码保存为文件 `temperature.html`\
  \ 并将其加载到浏览器中。你应该得到 图 2.3 所示的结果。\n\n![Image](img/image0372.jpeg)\n\n**图 2.3** 列表\
  \ 2.2 的输出\n\n修改几次文件以为 `cTemp` 使用不同的值，并检查一切运行正常。\n\n## 捕获鼠标事件\n\nJavaScript 的基本目的之一是帮助网页对用户更具交互性。为了实现这一点，我们需要一些机制来检测用户和程序在任何时刻做什么——鼠标在浏览器中的位置、用户是否点击了按钮或按了键盘、页面是否完全加载等。\n\
  \n我们将所有这些发生的情况称为“事件”，JavaScript 有多种工具来帮助我们处理它们。让我们看看使用 JavaScript 检测用户鼠标动作的某些方法。JavaScript\
  \ 通过所谓的“事件处理器”来处理事件。我们将研究其中三个：`onClick`、`onMouseOver` 和 `onMouseOut`。\n\n### onClick\
  \ 事件处理器\n\n`onClick` 事件处理器可以应用于页面上几乎所有的可见 HTML 元素。我们实现它的一种方法是向 HTML 元素添加另一个属性：\n\
  \n点击此处查看代码图像\n\n`onclick=\"some JavaScript code\"`\n\n注意：虽然直接在 HTML 元素中添加事件处理器是完全有效的，但今天这不被认为是良好的编程实践。它对于本书第一部分\
  \ 中的示例很有用，但在书的后面，你将学习使用更强大、更优雅的方法使用事件处理器。\n\n让我们来看一个例子；请看 列表 2.3。\n\n**列表 2.3 使用\
  \ onClick 处理器**\n\n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>onClick\
  \ Demo</title>\n</head>\n<body>\n    <input type=\"button\" onclick=\"alert('You\
  \ clicked the button!')\" value=\"Click Me\" />\n</body>\n</html>\n```\n\nHTML 代码在页面的\
  \ `<body>` 元素中添加了一个按钮，并为该按钮提供了 `onclick` 属性。赋予 `onclick` 属性的值是我们在点击 HTML 元素（在此例中为按钮）时想要运行的\
  \ JavaScript 代码。当用户点击按钮时，`onclick` 事件被激活（我们通常说事件已“触发”），并执行属性值中列出的 JavaScript 语句。\n\
  \n在这种情况下，只有一条语句：\n\n点击此处查看代码图像\n\n```\nalert('You clicked the button!')\n```\n\n\
  图 2.4 显示了点击按钮的结果。\n\n![Image](img/image00373.jpeg)\n\n**图 2.4** 使用 `onClick` 事件处理器\n\
  \n注意：你可能注意到我们把处理器命名为 `onClick`，但在将其添加到 HTML 元素中时，我们写的是小写的 `onclick`。这种习惯的出现是因为，尽管\
  \ HTML 不区分大小写，但 XHTML 是区分大小写的，并且要求所有 HTML 元素和属性名称必须用小写。\n\n### onMouseOver 和 onMouseOut\
  \ 事件处理器\n\n当我们只想根据某个特定页面元素检测鼠标指针在屏幕上的位置时，`onMouseOver` 和 `onMouseOut` 可以帮助我们做到。当用户的鼠标光标进入目标元素占据的屏幕区域时，`onMouseOver`\
  \ 事件被触发。正如你可能猜到的，当光标离开同一区域时，触发 `onMouseOut` 事件。\n\n列表 2.4 提供了 `onMouseOver` 事件的一个简单示例。\n\
  \n**列表 2.4 使用 onMouseOver**\n\n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  \    <title>onMouseOver Demo</title>\n</head>\n<body>\n    <img src=\"image1.png\"\
  \ alt=\"image 1\" onmouseover=\"alert('You entered the image!') />\n</body>\n</html>\n\
  ```\n\n运行脚本的结果如 图 2.5 所示。在代码中将 `onmouseover` 替换为 `onmouseout` 自然将会在鼠标离开图像时触发事件处理器——因此弹出警框对话框——而不是在进入时弹出。\n\
  \n![Image](img/image00374.jpeg)\n\n**图 2.5** 使用 `onMouseOver` 事件处理器\n\n\n\n\n\n\
  ```html\n</head>\n\n<body>\n    <img src=\"tick.gif\" alt=\"tick\" onmouseover=\"\
  this.src='tick2.gif';\" onmouseout=\"this.src='tick.gif';\" />\n</body>\n</html>\n\
  ```\n\n* * *\n\n你可能在我们在此处所用用的语法中发现了一些新东西。在 `onMouseOver` 和 `onMouseOut` 的 JavaScript\
  \ 语句中，我们使用了 `this` 关键字。\n\n在通过 HTML 元素的属性添加的事件处理器中使用 `this` 时，`this` 指的是 HTML 元素本身；在这种情况下，你可以将其理解为“这张图片”，而\
  \ `this.src` 则（使用我们已经学过的“点”表示法）指向该图像对象的 `src`（源）属性。\n\n在这个示例中，我们使用了两张图片：`tick.gif`\
  \ 和 `tick2.gif`——你可以使用手头有的任何图片，但如果这些图片大小相同且不过大，演示效果最好。\n\n使用你的编辑器创建一个 HTML 文件，并在其中包含代码列表\
  \ 2.5 中的代码。如果图片名称不同，可以将 `tick.gif` 和 `tick2.gif` 更改为你两张图片的名称；只需确保图片保存在与 HTML 文件相同的文件夹中。保存\
  \ HTML 文件并在浏览器中打开它。\n\n你应该能看到当鼠标指针进入时图片发生变化，离开时变回，如图 2.6 所示。\n\n![图像](img/image0037.jpeg)\n\
  \n**图 2.6** 使用 `onMouseOver` 和 `onMouseOut` 实现的鼠标悬停效果\n\n* * *\n\n### 注意\n\n曾有一段时间，鼠标悬停通常是这样实现的，但现在可以使用层级样式表（CSS）更高效地实现。尽管如此，这仍然演示\
  \ `onMouseOver` 和 `onMouseOut` 事件处理器用途的一种方便方法。\n\n* * *\n\n* * *\n\n### 总结\n\n这一小时内你涵盖了大量内容。\n\
  \n首先，你学习了在 HTML 页面中引入 JavaScript 代码的各种方法。\n\n你学习了如何在 JavaScript 中声明变量、为这些变量赋值以及使用算术运算符对它们进行操作。\n\
  \n最后，你接触了 JavaScript 的一些事件处理器，并学习了如何检测用户鼠标的某些动作。\n\n## 问答\n\n**Q. 一些列表和代码段将 `<script>`\
  \ 标签的开始和结束放在同一行；而有时它们是分分行的。这重要吗？**\n\n**A.** 空格（如空格字符）、制表符和空行完全会被 JavaScript 忽略。你可以使用此类空白（程序员通常称为*空白字符*）来布局代码，使其更具可读性且易于遵循。\n\
  \n**Q. 我可以使用同一个 `<script>` 元素既包含外部 JavaScript 文件又包含 JavaScript 语句吗？**\n\n**A.**\
  \ 不行。如果你使用 `src` 属性通过 `script` 包含外部 JavaScript 文件，就不能在 `<script>` 和 `</script>`\
  \ 之间包含 JavaScript 语句——该区域必须留空。\n\n## 工作坊\n\n在查看后面的“答案”之前，尝试回答以下问题。\n\n#### 测验\n\n\
  **1。** 什么是 `onClick` 事件处理器？**\n\n**a.** 一个用于检测浏览器中鼠标位置的对象\n\n**b.** 一个在响应用户点击鼠标时执行的脚本\n\
  \n**c.** 用户可以点击的 HTML 元素\n\n**2。** 页面上允许多少个 `<script>` 元素？**\n\n**a.** 无\n\n**b.**\
  \ 恰好一个\n\n**c.** 任意数量\n\n**3。** 关于变量，以下哪项不是正确的陈述？**\n\n**a.** 它们的名称对大小写敏感。\n\n**b.**\
  \ 它们可以包含数值或非数值信息。\n\n**c.** 它们的名称可以包含空格。\n\n#### 答案\n\n**1。** b. `onClick` 事件处理器是一个在用户点击鼠标时执行的脚本。\n\
  \n**2。** c. 你可以使用任意数量的 `<script>` 元素。\n\n**3。** c. JavaScript 中的变量名不能包含空格。\n\n##\
  \ 练习\n\n![图像](img/image00365.jpeg) 从代码列表 2.4 开始，从 `<img>` 元素中移除 `onMouseOver` 和\
  \ `onMouseOut` 处理器。相反，添加一个 `onClick` 处理器将图片的 `title` 属性设置为 `My New Title`。（提示：你可以使用\
  \ `this.title` 访问图片标题。）\n\n![图像](img/image00365.jpeg) 你能想出一个简单的方法来测试你的脚本是否正确设置了新的图片标题吗？\n\
  \n##第 3 小时。使用函数\n\n* * *\n\n这一小时你将学习：\n\n![图像](img/image00365.jpeg)\n- 如何定义函数\n\
  - 如何调用函数\n- 函数如何接收数据\n- 从函数返回值\n- 关于变量的作用域\n\n* * *\n\n通常，程序会重复执行相同的任务。为了避免反复编写相同的代码，JavaScript\
  \ 有手段将某些部分封装成可重用的模块，这些模块被称为函数。使用函数还让你的代码更易调试。假设你写了一个计算成本的函数；当费率变化时，你需要对其进行修改。函数是\
  \ JavaScript 的基本构建块之一，几乎出现在每一个脚本中。在这一小时中将看到如何创建和使用函数。\n\n## 通用语法\n\n创建一个函数类似于在你的脚本中创建一个你可以使用的新命令。以下是创建函数的基本语法：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction sayHello() {\n    alert(\"Hello\");\n  \
  \  // ... 在这里可以放置更多语句 ...\n}\n```\n\n你从关键字 `function` 开始，后面跟着你选择的函数名以及括号，然后是一对大括号\
  \ `{}`。大括号内部是组成函数的 JavaScript 语句。在前面的示例中，我们只有一行代码来弹出一个 `alert` 对话框，但你可以根据需要添加任意行代码！\n\
  \n* * *\n\n注意\n\n关键字 `function` 必须始终使用小写，否则会产生错误。\n\n* * *\n\n为了保持整洁，你可以将任意数量的函数收集在一个\
  \ `<script>` 元素中：\n\n```html\n<script>\n    function doThis() {\n        alert(\"\
  Doing This\");\n    }\n\n    function doThat() {\n        alert(\"Doing That\");\n\
  \    }\n</script>\n```\n\n### 调用函数\n\n封装在函数定义中的代码在页面加载时不会执行。相反，它会静静等待直到被调用。\n\n\
  要调用函数，你只需要在想要执行函数所包含语句的地方使用函数名（带括号）即可：\n\n```javascript\nsayHello();\n```\n\n例如，你可能想将你的新函数\
  \ `sayHello()` 的调用添加到按钮的 `onClick` 事件中：\n\n点击此处查看代码图像\n\n```html\n<input type=\"\
  button\" value=\"Say Hello\" onclick=\"sayHello()\" />\n```\n\n* * *\n\n提示\n\n函数名和变量名一样对大小写敏感。名为\
  \ `MyFunc()` 的函数与名为 `myFunc()` 的函数不同。同样，变量名，选择有意义的函数名对代码的可读性非常有帮助。\n\n\n\n\n\n你已经见过许多使用与\
  \ JavaScript 对象相关方法的示例，例如 `document.write()` 和 `window.alert()`。\n\n方法简单来说，就是“属于”特定对象的函数。在第\
  \ 4 小节“DOM 对象和内置对象”中你会学更多关于对象的知识。\n\n* * *\n\n### 将 JavaScript 代码放入页面的 <head> 中\n\
  \n到目前为止，我们的示例都将 JavaScript 代码放置在 HTML 页面的 `<body>` 部分。使用函数允许你采用更常见且通常更优的做法，即将你的\
  \ JavaScript 代码存储在页面的 `<head>` 中。包含在页面头部 `<script>` 元素中的函数，或者通过页面头部中 `<script>`\
  \ 元素的 `src` 属性包含的外部文件中的函数，可以在页面的任何地方调用。将函数放在文档的头部部分可以确保它们在任何尝试执行它们之前已经过定义。\n\n列表\
  \ 3.1 显示了一个示例。\n\n**列表 3.1 页面头部中的函数**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE\
  \ html>\n<html\n<head>\n    <title>Calling Functions</title>\n    <script>\n   \
  \     function sayHello() {\n            alert(\"Hello\");\n        }\n    </script>\n\
  </head>\n<body>\n    <input type=\"button\" value=\"Say Hello\" onclick=\"sayHello()\"\
  \ />\n</body>\n</html>\n```\n\n* * *\n\n在这个列表中，你可以看到函数定义本身被放置在页面头部的 `<script>` 元素中，但对函数的调用完全是从另一个不同的地方进行的——这一次，是从页面\
  \ `body` 部分中按钮的 `onClick` 事件处理程序调用的。\n\n点击按钮的结果如图图 3.1 所示。\n\n![Image](img/image0037.jpeg)\n\
  \n**图 3.1** 调用 JavaScript 函数\n\n### 向函数传递参数\n\n如果你的函数在每次被调用时只能以相同的方式运行（正如前面的示例所示），那样将是非常局限的。\n\
  \n幸运的是，你可以通过向函数传递数据来极大地扩展函数的功能。你在函数被调用时这样做，通过向它传递一个或多个*参数 (arguments)*：\n\n`functionName(arguments)`\n\
  \n让我们写一个简单的函数来计算数的立方并显示结果：\n\n```javascript\nfunction cube(x) {\n    alert(x * x\
  \ * x);\n}\n```\n\n现在我们可以调用函数，将变量 `x` 替换为数字。像如下所示调用函数将显示一个包含计算结果的对话框，在本例中为 27：\n\
  \n`cube(3);`\n\n当然，你同样可以将变量名作为参数。以下代码也会生成一个包含数字 27 的对话框：\n\n```javascript\nvar length\
  \ = 3;\ncube(length);\n```\n\n* * *\n\n注意\n\n你有时会看到或听到使用*参数 (parameters)* 来代替*参数\
  \ (arguments)*，它们的意思完全相同。\n\n* * *\n\n### 多参数\n\n函数并不局限于单个参数。当你想要向函数发送多个参数时，你只需要用逗号将它们隔开：\n\
  \n```javascript\nfunction times(a, b) {\n    alert(a * b);\n}\ntimes(3, 4); // 弹出\
  \ '12'\n```\n\n你可以使用任意数量的参数。\n\n* * *\n\n注意\n\n确保你的函数调用包含足够的参数值，以匹配函数定义中指定的参数。如果定义中的任何参数未留值，JavaScript\
  \ 可能会抛出错误，或者函数可能会运行不正常。如果调用函数时提供的参数过多，JavaScript 将忽略多余的参数。\n\n* * *\n\n需要注意的是，在函数定义中给参数指定的名称与传递给函数的任何变量名称无关。参数列表中的变量名充当调用函数时将传递的实际值的占位符。你赋予参数的名称仅用于函数定义内部以指定其工作方式。\n\
  \n我们将在本节稍后详细讨论这一点，即讨论变量*作用域 (scope)*。\n\n* * *\n\n### 尝试一下：输出用户消息的函数\n\n让我们利用本节目前学到的知识，创建一个函数，可以向用户发送关于其其刚刚点击的按钮的消息。我们将函数定义放在页面的\
  \ `<head>` 部分，并使用多个参数调用它。\n\n这是我们的函数：\n\n点击此处查看代码图像\n\n```javascript\nfunction buttonReport(buttonId,\
  \ buttonName, buttonValue) {\n    // 关于按钮 id 信息\n    var userMessage1 = \"Button\
  \ id: \" + buttonId + \"\\n\";\n    // 然后关于按钮名称\n    var userMessage2 = \"Button\
  \ name: \" + buttonName + \"\\n\";\n    // 以及按钮值\n    var userMessage3 = \"Button\
  \ value: \" + buttonValue;\n    // 用户\n    alert(userMessage1 + userMessage2 + userMessage3);\n\
  }\n```\n\n函数 `buttonReport` 接收三个参数，这些是被点击的按钮元素的 `id`、`name` 和 `value`。通过这三条信息中的每一个，构建出一个短消息。然后将这三条消息拼接成一个字符串，传递给\
  \ `alert()` 方法以弹出一个包含信息的对话框。\n\n* * *\n\n提示\n\n你可能注意到前两个消息字符串都追加了元素 `\"\\n\"`；这是一个“换行”字符，强制\
  \ alert 对话框中的消息换行。如果某些特殊字符出现在字符串中，必须在其前面加上前缀。这种字符被称为转义序列 (escape sequence)。\n\n\n\
  \n\n\n使用你的编辑器创建 `buttons.html` 文件并输入上述代码。你会发现它生成的输出消息如图 3.2 所示，但消息内容会根据你点击了哪个按钮而不同。\n\
  \n![Image](img/image0037.jpeg)\n\n**图 3.2** 使用函数发送消息\n\n* * *\n\n### 从函数返回值\n\n\
  好了，现在你已经知道如何将信息传递给函数，以便它们能够为你处理这些信息。但你如何从函数获取返回信息呢？你并不总是希望函数仅限于弹出对话框！\n\n幸运的是，有一种机制可以从函数调用中收集数据——返回值。让我们它是如何工作的：\n\
  \n```javascript\nfunction cube(x) {\n    return x * x * x;\n}\n```\n\n这次我们不像上一个例子那样在函数内部使用\
  \ `alert()` 对话框，而是在所需的结果前面加上了 `return` 关键字。要从函数外部访问此值，只需将函数返回的值赋值给变量即可：\n\n```javascript\n\
  var answer = cube(3);\n```\n\n变量 `answer` 现在将包含值 27。\n\n* * *\n\n注意\n\n函数返回的值不仅限于像本例中的数值。事实上，函数可以返回\
  \ JavaScript 支持的任何数据类型。我们将在第 5 小节中讨论数据类型。\n\n* * *\n\n* * *\n\n提示\n\n在函数返回一个值的地方，我们可以使用函数调用将返回值直接传递给代码中的另一个语句。例如，与其使用\n\
  \n```javascript\nvar answer = cube(3);\nalert(answer);\n```\n\n我们可以简单地使用\n\n```javascript\n\
  alert(cube(3));\n```\n\n从函数调用 `cube(3)` 返回的值 27 立即成为传递给 `alert()` 方法的参数。\n\n* *\
  \ *\n\n### 变量的作用域\n\n我们已经见过如何使用 `var` 关键字声明变量。在使用函数时，有一条黄金法则需要记住：\n\n“在函数内部声明的变量只在该\
  \ particular 函数内部存在。”\n\n这种限制被称为变量的作用域（scope）。让我们来看一个例子：\n\n点击查看代码图片\n\n```javascript\n\
  // 定义我们的函数 addTax()\nfunction addTax(subtotal, taxRate) {\n    var total = subtotal\
  \ * (1 + (taxRate/100));\n    return total;\n}\n\n// 现在让我们调用函数\nvar invoiceValue\
  \ = addTax(50, 10);\nalert(invoiceValue); // 正常工作\nalert(total);  // 不工作\n```\n\n\
  如果我们运行这段代码，首先会看到一个包含变量 `invoiceValue` 值的 `alert()` 对话框（该值应该是 55，但实际上可能是 55.000000001，因为我们没有要求\
  \ JavaScript 对结果进行舍入）。\n\n然而，我们随后不会看到包含变量 `total` 值的 `alert()` 对话。相反，JavaScript\
  \ 直接产生一个错误。你是否看到错误报告取决于你的浏览器设置——你将在书中后面学习更多关于错误处理的内容——但 JavaScript 将无法显示包含变量 `total`\
  \ 值的 `alert()` 对话。\n\n这是因为我们将变量 `total` 的声明放在了 `addTax()` 函数*内部*。在函数外部，变量 `total`\
  \ 根本不存在（或者用 JavaScript 的话说，“未定义”）。我们使用 `return` 关键字传回存储在变量 `total` 中的值，然后我们将该值存储在另一个变量\
  \ `invoice` 中。\n\n我们将函数定义内部内部声明的变量称为局部变量；即该函数的局部变量。在任何函数外部声明的变量被称为全局变量。为了增加一点困惑，局部变量和全局变量可以有相同的名称，但它们仍然是不同的变量！\n\
  \n变量定义的范围被称为变量的作用域——我们可以称一个变量具有局部作用域或全局作用域。\n\n* * *\n\n自己试一下：演示变量的作用域\n\n为了说明变量的作用域问题，请看以下代码：\n\
  \n点击查看代码图片\n\n```javascript\nvar a = 10;\nvar b = 10;\n\nfunction showVars() {\n\
  \    var a = 20; // 声明一个新的局部变量 'a'\n    b = 20;     // 修改全局变量 'b' 的值\n    return\
  \ \"Local variable 'a' = \" + a + \"\\nGlobal variable 'b' = \" + b;\n}\n\nvar message\
  \ = showVars();\nalert(message + \"\\nGlobal variable 'a' = \" + a);\n```\n\n在 `showVars()`\
  \ 函数内部，我们操作了两个变量 `a` 和 `b`。我们在函数内部定义的变量 `a` 是一个只在函数内部的局部变量，与我们在脚本开头定义的全局变量（也称为 `a`）完全分开。\n\
  \n变量 `b` 没有在函数内部声明；它是一个全局变量。\n\n列表 3.3 (#part0047.xhtml_p046pro01a) 在 HTML 页面中显示了上述代码。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Variable Scope</title>\n\
  </head>\n<body>\n<script>\n    var a = 10;\n    var b = 10;\n\n    function showVars()\
  \ {\n        var a = 20; // 声明一个新的局部变量 'a'\n        b = 20;     // 修改全局变量 'b' 的值\n\
  \        return \"Local variable 'a' = \" + a + \"\\nGlobal variable 'b' = \" +\
  \ b;\n    }\n\n    var message = showVars();\n    alert(message + \"\\nGlobal variable\
  \ 'a' = \" + a);\n</script>\n</body>\n</html>\n```\n\n* * *\n\n### 总结\n\n在本节中，你学习了什么是函数，以及如何在\
  \ JavaScript 中创建它们。你学习了如何从代码中调用函数，并以参数的形式向这些函数传递信息。你还发现了如何从函数返回信息到调用语句。最后，你学习了变量的局部或全局作用域，以及变量的作用域如何影响函数的工作。\n\
  \n## 问答\n\n**Q. 一个函数可以包含对另一个函数的调用吗？**\n\n**A.** 当然可以；事实上，这种调用可以根据需要无限深度地嵌套。\n\n\
  **Q. 函数名可以使用哪些字符？**\n\n**A.** 函数名必须以字母或下划线开头，并包含字母、数字和下划线的任意组合。它们不能包含空格、标点或其他特殊字符。\n\
  \n## 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.** 使用以下方式调用函数\na. `function`\
  \ 关键字\nb. `call` 命令\nc. 函数名，带括号\n\n**2.** 当函数执行 `return` 语句时会发生什么？\na. 生成错误消息。\n\
  b. 返回一个值并继续执行函数。\nc. 返回一个值并停止执行函数。\n\n**3.** 在函数定义内部声明的变量称为\na. 局部变量\nb. 全局变量\n\
  c. 参数\n\n#### 答案\n\n**1.** c. 使用函数名调用函数。\n\n**2.** c. 执行 `return` 语句后，函数返回一个值，然后停止函数执行。\n\
  \n**3.** a. 局部变量。\n\n\n\n\n\n3. a. 在函数内部定义的变量具有局部作用域。\n\n## 练习\n\n![Image](img/image00365.jpeg)\
  \ 编写一个函数，接收摄氏度值作为参数，并返回相应的华氏度值，基于第 2 小时中的代码。\n\n![Image](img/image00365.jpeg) 在\
  \ HTML 页面中测试你的函数。\n\n## 第 4 小时。DOM 对象和内置对象\n\n你将在本小时学习到：\n\n![Image](img/image00365.jpeg)\
  \ 使用 `alert()`、`prompt()` 和 `confirm()` 与用户交互\n![Image](img/image00365.jpeg) 使用\
  \ `getElementById()` 选择页面元素\n![Image](img/image00365.jpeg) 使用 `innerHTML` 访问 HTML\
  \ 内容\n![Image](img/image00365.jpeg) 如何使用浏览器的 `history` 对象\n![Image](img/image00365.jpeg)\
  \ 使用 `location` 对象重新加载或重定向页面\n![Image](img/image00365.jpeg) 通过 `navigator` 对象获取浏览器信息\n\
  ![Image](img/image00365.jpeg) 使用 `Date` 对象处理日期和时间\n![Image](img/image00365.jpeg)\
  \ 使用 `Math` 对象简化计算\n\n在第 1 小时中“介绍 JavaScript”中，我们简要讨论了 DOM 并引入了 DOM 树中的顶层对象——`window`\
  \ 对象。我们还查看了它的子对象之一 `document`。\n\n在本小时中，我们将介绍更多你可以在脚本使用的工具对象和方法。\n\n### 与用户交互\n\n\
  在属于 `window` 对象的方法中，有一些专门设计用于通过辅助信息的输入和输出来帮助你的页面与用户进行通信。\n\n#### alert()\n\n你已经使用过\
  \ `alert()` 方法为用户弹出一个信息对话框。你会记得，这个模态（modal）对话框仅显示你带有单个 OK 按钮的消息。*模态*一词意味着脚本执行会暂停，用户与页面的所有交互都会暂停，直到用户清除对话框。`alert()`\
  \ 方法接受一个消息字符串作为参数：\n\n```\nalert(\"This is my message\");\n```\n\n`alert()` 不返回值。\n\
  \n#### confirm()\n\n`confirm()` 方法与 `alert()` 类似，它们都会弹出一个带有用户信息的模态对话框。然而，`confirm()`\
  \ 对话框为用户提供了选择；用户不是只有一个 OK 按钮，而可以在 OK 和 取消之间进行选择，如图 4.1 所示。点击任一按钮都会清除对话框并允许调用脚本继续，但\
  \ `confirm()` 方法会根据点击了哪个按钮返回不同的值——点击 OK 时返回布尔值 `true`，点击 取消时返回 `false`。我们将在下一小时开始研究\
  \ JavaScript 的数据类型，但目前你只需要知道布尔变量只能取两个值之一：`true` 或 `false`。\n\n![Image](img/image00379.jpeg)\n\
  \n**图 4.1** `confirm()` 对话框\n\n调用 `confirm()` 方法的调用方式与 `alert()` 类似，将所需的消息作为参数传递：\n\
  \n点击此处查看代码\n\n```\nvar answer = confirm(\"Are you happy to continue?\");\n```\n\n\
  请注意，在这里我们把返回的 `true` 或 `false` 值传递给变量，以便我们稍后测试其值，并让脚本根据结果采取适当的操作。\n\n#### prompt()\n\
  \n`prompt()` 方法是另一种打开模态对话框的方式。在这种情况下，对话框邀请用户输入信息。\n\n`prompt()` 对话框的调用方式与 `confirm()`\
  \ 完全相同：\n\n点击此处查看代码\n\n```\nvar answer = prompt(\"What is your full name?\");\n\
  ```\n\n`prompt` 方法还允许一个可选的第二个参数，在用户在未输入任何内容的情况下点击 OK 时提供默认响应：\n\n点击此处查看代码\n\n```\n\
  var answer = prompt(\"What is your full name?\", \"John Doe\");\n```\n\n`prompt()`\
  \ 对话框的返回值取决于用户采取的选项：\n\n![Image](img/image00365.jpeg) 如果用户输入内容并点击 OK 或按回车，则返回用户输入的字符串。\n\
  \n![Image](img/image00365.jpeg) 如果用户在未向 prompt 对话框输入任何内容的情况下点击 OK 或按回车，方法将返回默认响应（如果有），这是在传递\
  \ `prompt()` 的第二个参数中可选指定的。\n\n![Image](img/image00365.jpeg) 如果用户关闭了对话框（即通过点击 取消或按\
  \ Escape 键），则 prompt 方法返回 `null`。\n\n注意\n\nJavaScript 在某些情况下使用 `null` 值来表示空值。当被视为数字时，它的值为\
  \ 0；当作为字符串使用时，它被评估为 \"\"；当作为布尔值使用时，它变为 `false`。\n\n上述代码生成的 `prompt()` 对话框如图 4.2\
  \ 所示。\n\n![Image](img/image00380.jpeg)\n\n**图 4.2** `prompt()` 对话框\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```\nalert(\"You've visited \" + history.length + \" web pages in this browser\
  \ session\");\n```\n\n`history` 对象有三个方法。\n\n`forward()` 和 `back()` 等同于点击浏览器上的“前进”和“后退”按钮；它们将用户带到历史列表中的下一页或上一页。\n\
  \n```\nhistory.forward();\n```\n\n还有一个名为 `go` 的方法，它接受单个参数。该参数可以是整数（正或负），它可以将用户带到历史列表中的相对位置：\n\
  \n点击此处查看代码图像\n\n```javascript\nhistory.go(-3);  // 后退 3 页\nhistory.go(2);  // 前进\
  \ 2 页\n```\n\n该方法也可以接受一个字符串，它使用该字符串在历史列表中查找第一个匹配的 URL：\n\n点击此处查看代码图像\n\n```javascript\n\
  history.go(\"example.com\");  // 跳转到历史列表中包含 'example.com' 的最近 URL\n            \
  \               //\n```\n\n### 使用 location 对象\n\n`location` 对象包含了关于当前加载页面 URL 的信息。\n\
  \n我们可以将页面 URL 视为一系列部分：\n\n`[protocol]//[hostname]:[port]/[pathname][search][hash]`\n\
  \n这里有一个示例 URL：`http://www.example.com:8080/tools/display.php?section=435#list`\n\
  \n`location` 对象的属性列表包含了有关 URL 各个部分的数据。属性列在表 4.1 中。\n\n![Image](img/image00381.jpeg)\n\
  \n**表格 4.1 location 对象的属性**\n\n#### 使用 location 对象进行导航\n\n使用 `location` 对象将用户带到新页面有两种方法。\n\
  \n首先，我们可以直接设置对象的 `href` 属性：\n\n点击此处查看代码图像\n\n```javascript\nlocation.href = 'www.newpage.com';\n\
  ```\n\n使用这种技术将用户传输到新页面会在浏览器的历史列表中保留原始页面，因此用户只需使用浏览器的后退按钮即可返回。如果你希望将发送页面从历史列表中移除并替换为新\
  \ URL，则可以使用 `location` 对象的 `replace()` 方法：\n\n点击此处查看代码图像\n\n```javascript\nlocation.replace('www.newpage.com');\n\
  ```\n\n这会在浏览器和历史列表中将旧 URL 替换为新 URL。\n\n#### 重新加载页面\n\n要将当前页面重新加载到浏览器中——等同于用户点击“刷新页面”按钮——可以使用\
  \ `reload()` 方法：\n\n```javascript\nlocation.reload();\n```\n\n* * *\n\n提示\n\n在不带任何参数的情况下使用\
  \ `reload()` 将从浏览器缓存中检索当前页面（如果可用的话）。为了避免这种情况并直接从服务器获取页面，可以带参数 `true` 调用 `reload`：\n\
  \n```javascript\ndocument.reload(true);\n```\n\n* * *\n\n### 浏览器信息—navigator 对象\n\
  \n虽然 `location` 对象存储了浏览器中加载的当前 URL 的信息，但 `navigator` 对象的属性包含了关于浏览器应用程序本身的数据。\n\n\
  * * *\n\n尝试自己做：使用 navigator 对象显示信息\n\n我们将编写一个脚本，让你发现 `navigator` 对象对你自己的浏览设置了解多少。使用你的编辑器创建文件\
  \ `navigator.html`，包含列表 4.1 中的代码。保存文件并在浏览器中打开它。\n\n**列表 4.1 使用 navigator 对象**\n\n\
  点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>window.navigator</title>\n\
  \    <style>\n        td{border: 1px solid gray; padding: 3px 5px;}\n    </style>\n\
  </head>\n<body>\n    <script>\n        document.write(\"<table>\");\n        document.write(\"\
  <tr><td>appName</td><td>\"+navigator.appName + \"</td></tr>\");\n        document.write(\"\
  <tr><td>appCodeName</td><td>\"+navigator.appCodeName + \"</td></tr>\");\n      \
  \  document.write(\"<tr><td>appVersion</td><td>\"+navigator.appVersion + \"</td></tr>\"\
  );\n        document.write(\"<tr><td>language</td><td>\"+navigator.language + \"\
  </td></tr>\");\n        document.write(\"<tr><td>cookieEnabled</td><td>\"+navigator.cookieEnabled\
  \ + \"</td></tr>\");\n        document.write(\"<tr><td>cpuClass</td><td>\"+navigator.cpuClass\
  \ + \"</td></tr>\");\n        document.write(\"<tr><td>onLine</td><td>\"+navigator.onLine\
  \ + \"</td></tr>\");\n        document.write(\"<tr><td>platform</td><td>\"+navigator.platform\
  \ + \"</td></tr>\");\n        document.write(\"<tr><td>No of Plugins</td><td>\"\
  +navigator.plugins.length + \"</td></tr>\");\n        document.write(\"</table>\"\
  );\n    </script>\n</body>\n</html>\n```\n\n* * *\n\n将你的结果与我的结果进行对比，如图 4.3 所示。\n\
  \n![Image](img/image00382.jpeg)\n\n**图 4.3** 来自 `navigator` 对象的浏览器信息\n\n哇，这里是怎么了？我在\
  \ Ubuntu Linux 电脑上的 Chromium 浏览器中加载了页面。为什么它报告的 `appName` 属性是 Netscape，`appCodeName`\
  \ 属性是 Mozilla？另外，`cpuClass` 属性返回的是 `undefined`；这到底是怎么回事？\n\n`navigator` 对象背后有许多历史和政治因素。结果是，该对象提供的关于用户平台的信息充其量是不可靠的。并不是所有浏览器都支持所有属性（因此在前面的示例中无法报告\
  \ `cpuClass` 属性），而且浏览器类型和版本报告的名称很少符合人们的直觉预期。图 4.4 显示了在 Internet Explorer 7 中加载的相同页面。\n\
  \n![Image](img/image0383.jpeg)\n\n**图 4.4** 来自 `navigator` 对象的浏览器信息\n\n我们现在有了 `cpuClass`\
  \ 的值，但 `language` 属性在 Internet Explorer 中不支持。尽管跨浏览器标准比几年前更接近了，但在某些情况下你仍然需要知道用户浏览器的能力。查询\
  \ `navigator` 对象几乎总是*错误*的处理方法。\n\n* * *\n\n注意\n\n在书的后面，我们将讨论*特性检测*（feature detection），这是一种更优雅的跨浏览器方式，可以让你的代码根据用户浏览器的能力做出决策。\n\
  \n* * *\n\n* *\n\n### 日期和时间\n\n`Date` 对象用于处理日期和时间。在 DOM 中没有预先创建好的 `Date` 对象（就像之前示例中的那样）。相反，我们在需要时会创建自己的\
  \ `Date` 对象。我们创建的每个 `Date` 对象都可以代表不同的日期和时间。\n\n#### 创建带有当前日期和时间的 Date 对象\n\n这是创建一个包含日期和时间信息的新\
  \ `Date` 对象的最简单方法：\n\n```javascript\nvar mydate = new Date();\n```\n\n变量 `mydate`\
  \ 是一个对象，包含了对象创建时的日期和时间信息。JavaScript 有许多长长的方法列表，用于检索、设置和编辑 `Date` 对象中的数据。让我们来看几个简单的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar year = mydate.getFullYear(); // 四位数年份，例如 2012\n\
  var month = mydate.getMonth(); // 月份数字 0 - 11；0 是 1 月，等\nvar date = mydate.getDate();\
  \ // 月份中的几 1 - 31\nvar day = mydate.getDay(); // 星期 0 - 6；星期日 = 0，等\nvar hours =\
  \ mydate.getHours(); // 时间的小时部分，0 - 23\nvar minutes = mydate.getMinutes(); // 时间的分钟部分，0\
  \ - 59\nvar seconds = mydate.getSeconds(); // 时间的秒部分，0 - 59\n```\n\n#### 创建给定日期时间的\
  \ Date 对象\n\n我们可以通过向 `Date()` 语句传递参数，轻松地创建代表任意日期和时间的 `Date` 对象。有几种方法：\n\n```javascript\n\
  new Date(milliseconds) // 自 1970 年 1 月 1 日以来的毫秒数\nnew Date(dateString)\n```\n\n\n\
  \n\n```\nnew Date(year, month, day, hours, minutes, seconds, milliseconds)\n```\n\
  \n这里有几个示例。\n\n使用日期字符串：\n\n点击此处查看代码图像\n\n```javascript\nvar d1 = new Date(\"October\
  \ 22, 1995 10:57:22\")\n```\n\n当我们使用单独的各个部分时，末尾参数是可选的；任何缺失的参数将被替换为零：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar d2 = new Date(95,9,22) // 1995 年 10 月 22 日 00:00:00\nvar d3\
  \ = new Date(95,9,22,10,57,0)  // 1995 年 10 月 22 日 10:57:00\n```\n\n## 设置和编辑日期\n\
  \n`Date` 对象有一系列广泛的方法，用于设置或编辑日期的各个部分：\n\n点击此处查看代码图像\n\n```javascript\nvar mydate\
  \ = new Date();  // 当前日期和时间\ndocument.write( \"Object created on day number \" +\
  \ mydate.getDay() + \"<br />\");\nmydate.setDate(15);     // 将日期更改为 15 号\ndocument.write(\"\
  After amending date to 15th, the day number is \" + mydate.getDay());\n```\n\n在前面的代码段中，我们最初创建了对象\
  \ `mydate` 表示创建时的日期和时间，但随后将日期更改为 15 号；如果我们在此操作前后获取星期几，我们会发现它已经正确地重新计算，以考虑已更改的日期：\n\
  \n点击此处查看代码图像\n\n```\nObject created on day number 5\nAfter amending date to 15th,\
  \ the day number is 0\n```\n\n因此，在这个示例中，该对象创建于星期五；而该月的 15 号对应于星期日。\n\n我们还可以进行日期和时间算术，让\
  \ `Date` 对象为我们完成所有的体力工作：\n\n点击此处查看代码图像\n\n```javascript\nvar mydate=new Date();\n\
  document.write(\"Created: \" + mydate.toDateString() + \" \" + mydate.toTimeString()\
  \ + \"<br/>\");\nmydate.setDate(mydate.getDate()+33); // 在“日期”部分增加 33 天\ndocument.write(\"\
  After adding 33 days: \" + mydate.toDateString() + \" \" + mydate.toTimeString());\n\
  ```\n\n前面的示例计算了 33 天后的日期，并根据需要自动修改日、期、月和/年。注意 `toDateString()` 和 `toTimeString()`\
  \ 的使用；这些是用于日期转换为可读格式的有用方法。前面的示例产生的输出如下：\n\n点击此处查看代码图像\n\n```\nCreated: Fri Jan 06\
  \ 2012 14:59:24 GMT+0100 (CET)\nAfter adding 33 days: Wed Feb 08 2012 14:59:24 GMT+0100\
  \ (CET)\n```\n\n用于操作日期和时间的方法集太大了，我们无法在这里探索所有的方法。`Date` 对象的方法的完整列表可以在附录 B“JavaScript\
  \ 快速参考”中找到。\n\n## 使用 Math 对象简化计算\n\n在执行经常发生的各种类型计算时，JavaScript 的 `Math` 对象可以为你节省大量工作量。\n\
  \n与 `Date` 对象不同，`Math` 对象在使用之前不需要创建；它已经存在了，你可以直接调用它的方法。\n\n可用方法的完整列表可以在附录 B 中找到，但表\
  \ 4.2 显示了一些示例。\n\n![Image](img/image00384.jpeg)\n\n**表 4.2 Math 对象的一些方法**\n\n让我们来看一些示例。\n\
  \n### 四舍五入\n\n`ceil()`、`floor()` 和 `round()` 方法对于截断数字的小数部分有用：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar myNum1 = 12.55;\nvar myNum2 = 12.45;\nalert(Math.floor(myNum1));\
  \  // 显示 12\nalert(Math.ceil(myNum1));  // 显示 13\nalert(Math.round(myNum1));  //\
  \ 显示 13\nalert(Math.round(myNum2));  // 显示 12\n```\n\n注意，当你使用 `round()` 时，如果数字的小数部分为\
  \ .5 或更大，数字将舍入到下一个整数。\n\n### 寻找最小值和最大值\n\n我们可以使用 `min()` 和 `max()` 从列表中挑选最大和最小的数字：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar ageDavid = 23;\nvar ageMary = 27;\nvar ageChris\
  \ = 31;\nvar ageSandy = 19;\ndocument.write(\"The youngest person is \" + Math.min(ageDavid,\
  \ ageMary, ageChris, ageSandy) + \" years old<br />\");\ndocument.write(\"The oldest\
  \ person is \" + Math.max(ageDavid, ageMary, ageChris, ageSandy) + \" years old<br\
  \ />\");\n```\n\n写入页面的输出看起来如下：\n\n点击此处查看代码图像\n\n```\nThe youngest person is 19 old\n\
  The oldest person is 31 old\n```\n\n### 随机数\n\n要生成随机数，我们可以使用 `Math.random()`，它会生成一个\
  \ 0 到 1 之间的随机数。通常我们喜欢指定数字可能的范围，例如，我们可能想要生成一个 0 到 100 之间的随机整数。由于 `Math.random()`\
  \ 生成 0 到 1 之间的随机数，因此将其封装在一个适用于我们需求的小函数中是有帮助的。以下函数接收 `Math` 对象生成的随机数，通过变量 `range`（作为参数传递给函数）对其放大，最后使用\
  \ `round()` 移除任何小数部分：\n\n点击此处查看代码图像\n\n```javascript\nfunction myRand(range) {\n\
  \  return Math.round(Math.random() * range);\n}\n```\n\n要生成一个 0 到 100 之间的随机整数，我们只需调用\
  \ `myRand(100);`。\n\n**注意**\n\n始终直接使用 `Math` 方法，例如 `Math.floor()`，而不是将其作为创建的对象的方法。换句话说，以下是错误的：\n\
  \n```javascript\nvar myNum = 24.77;\nmyNum.floor(); // 代码将引发 JavaScript 错误\n```\n\
  \n相反，你只需要使用 `Math.floor(myNum);` 了。\n\n### 数学常数\n\n各种经常使用的数学常数作为 `Math` 的属性可用。它们列在表\
  \ 4.3 中。\n\n![Image](img/image0385.jpeg)\n\n**表 4.3 数学常数**\n\n这些常数可以直接用于你的计算中：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar area = Math.PI * radius * radius; // 圆面积\nvar\
  \ circumference = 2 * Math.PI * radius; // 周长\n```\n\n### with 关键字\n\n虽然你可以对任何对象使用\
  \ `with` 关键字，但 `Math` 对象是一个用于示例的理想对象。通过使用 `with` 可以节省一些繁琐的工作。`with` 关键字接收一个对象作为参数，后面跟着大括号包裹的代码块。该代码块中的语句可以在不指定对象的情况下调用方法，JavaScript\
  \ 会假设这些方法属于传递作为参数的对象。\n\n这是一个示例：\n\n点击此处查看代码图像\n\n```javascript\nwith (Math) {\n\
  \  var myRand = random();\n  var biggest = max(3,4,5);\n  var height = round(76.35);\n\
  }\n```\n\n在这个示例中，我们通过直接使用方法来调用 `Math.random()`、`Math.max()` 和 `Math.round()`，因为代码块中的所有方法调用都与\
  \ `Math` 对象关联了。\n\n## 尝试一下：读取日期和时间\n\n我们通过创建一个脚本来实践本小时节中涵盖的内容，在页面加载时获取当前日期和时间。我们还实现了一个按钮来刷新页面，从而刷新时间和日期信息。\n\
  \n请查看列表 4.2。\n\n**列表 4.2 获取日期和时间信息**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Current Date and Time</title>\n    <style>\n        p\
  \ {font: 14px normal arial, verdana, helvetica;}\n    </style>\n    <script>\n \
  \       function telltime() {\n            var out = \"\";\n            var now\
  \ = new Date();\n```\n\n\n\n\n```javascript\nout += \"<br />Date: \" + now.getDate();\n\
  out += \"<br />Month: \" + now.getMonth();\nout += \"<br />Year: \" + now.getFullYear();\n\
  out += \"<br />Hours: \" + now.getHours();\nout += \"<br />Minutes: \" + now.getMinutes();\n\
  out += \"<br />Seconds: \" + now.getSeconds();\ndocument.getElementById(\"div1\"\
  ).innerHTML = out;\n}\n</script>\n</head>\n\n<body>\n    当前日期和时间为：<br/>\n    <div\
  \ id=\"div1\"></div>\n    <script>\n        telltime();\n    </script>\n    <input\
  \ type=\"button\" onclick=\"location.reload()\" value=\"刷新\" />\n</body>\n</html>\n\
  ```\n\n* * *\n\n`telltime()` 函数中的第一个语句创建了一个名为 `now` 的新 `Date` 对象。正如你所记得的，由于创建该对象时没有向\
  \ `Date()` 传递任何参数，它将拥有与创建瞬间当前日期和时间相关的属性。\n\n```javascript\nvar now = new Date();\n\
  ```\n\n我们可以使用 `getDate()`、`getMonth()` 以及类似的方法来访问时间和日期的各个部分。在操作过程中，我们将输出消息组装成字符串并存储在变量\
  \ `out` 中。\n\n点击此处查看代码图像\n\n```javascript\nout += \"<br />Date: \" + now.getDate();\n\
  out += \"<br />Month: \" + now.getMonth();\nout += \"<br />Year: \" + now.getFullYear();\n\
  out += \"<br />Hours: \" + now.getHours();\nout += \"<br />Minutes: \" + now.getMinutes();\n\
  out += \"<br />Seconds: \" + now.getSeconds();\n```\n\n最后，我们使用 `getElementById()`\
  \ 选择（初始为空的）`id=\"div1\"` 的 `<div>`元素，并使用 `innerHTML` 方法将变量 `out` 的内容写入其中。\n\n点击此处查看代码图像\n\
  \n```javascript\ndocument.getElementById(\"div1\").innerHTML = out;\n```\n\n`telltime()`\
  \ 函数由嵌入在页面 `<body>` 部分的一个小型脚本进行调用：\n\n```html\n<script>\n    telltime();\n</script>\n\
  ```\n\n要刷新日期和时间信息，我们只需要将页面重新加载到浏览器中。此时，脚本会再次运行，创建一个带有当前日期和时间的 `Date` 对象新实例。我们可以直接点击浏览器菜单上的“刷新”，但由于我们知道如何使用\
  \ `location` 对象重新加载页面，因此我们通过按钮的 `onClick` 方法中调用\n\n`location.reload()`\n\n图 4.5\
  \ 显示了脚本的运行情况。注意月份显示为 0。记住，JavaScript 从 0（一月）开始计数，到 11（十二月）结束。\n\n![图像](img/image00386.jpeg)\n\
  \n**图 4.5** 获取日期时间和信息\n\n* * *\n\n### 总结\n\n在这一节中，你查看了一些 JavaScript 内置或通过 DOM 可用的有用对象，以及它们的属性和方法如何帮助你更容易地编写代码。\n\
  \n你看到了如何使用 `window` 对象的模态对话框与用户交换信息。\n\n你学习了如何使用 `document.getElementById` 方法通过\
  \ ID 选择页面元素，以及如何使用 `innerHTML` 属性获取和设置页面元素内的 HTML。\n\n你处理了来自 `navigator` 对象的浏览器信息，以及来自\
  \ `location` 对象的页面 URL 信息。\n\n最后，你了解了如何使用 `Date` 和 `Math` 对象。\n\n## 问答\n\n**Q. Date()\
  \ 是否有处理时区的方法？**\n\n**A.** 是的。除了本节讨论的 `get...()` 和 `set...()` 方法（如 `getDate()`、`setMonth()`\
  \ 等）外，还有相同方法的 UTC（通用协调时间，以前称为 GMT）版本（`getUTCDate()`、`setUTCMonth()` 等）。你可以使用 `getTimezoneOffset()`\
  \ 方法来获取本地时间与 UTC 时间之间的差异。请参阅 Appendix B 获取完整的方法列表。\n\n**Q. 为什么 Date() 有名为 `getFullYear()`\
  \ 和 `setFullYear()` 的方法，而不是简单的 `getYear()` 和 `setYear()`？**\n\n**A.** `getYear()`\
  \ 和 `setYear()` 方法确实存在；它们处理的是两位数的年份，而不是 `getFullYear()` 和 `setFullYear()` 使用的四位数年份。由于跨越千年的日期可能存在问题，这些函数已被弃用。你应该改用\
  \ `getFullYear()` 和 `setFullYear()`。\n\n## 工作坊\n\n在阅读后续的“解答”部分之前，尝试回答所有问题。\n\n###\
  \ 测验\n\n**1.** 当用户点击确认对话框中的“确定”时会发生什么？\n\n**a.** 向调用程序返回一个 true 的值。\n\n**b.** 将显示的消息返回给调用程序。\n\
  \n**c.** 什么都没有。\n\n**2.** `Math()` 对象的哪个方法始终将数字向上取整到下一个整数？\n\n**a.** `Math.round()`\n\
  **b.** `Math.floor()`\n**c.** `Math.ceil()`\n\n**3.** 如果我加载的页面是 [`www.example.com/documents/letter.htm?page=2`](http://www.example.com/documents/letter.htm?page=2)，那么\
  \ `location` 对象的 `pathname` 属性将包含什么？\n\n**a.** `http`\n**b.** `www.example.com`\n\
  **c.** `/documents/letter.htm`\n**d.** `page=2`\n\n### 解答\n\n**1.** a. 点击“确定”时返回\
  \ true 的值。对话框被清空，控制权返回给调用程序。\n\n**2.** c. `Math.ceil()` 始终将数字向上取整到下一个更大的整数。\n\n\
  **3.** c. `location.pathname` 属性包含 `/documents/letter.htm`。\n\n## 练习\n\n![图像](img/image00386.jpeg)\
