  \n\n## 引言\n欢迎学习 *Learn HTML5 and JavaScript for Android*。本书将介绍 HTML5、JavaScript\
  \ 和 CSS3，帮助你为 Android 平台和浏览器制作极佳应用所需的必备技能。\n\n作者 Gavin Williams 将一步步引导你创建移动端 Web\
  \ 应用。你把所学的 HTML5、CSS3 和 JavaScript 技能立即付诸实践，获得宝贵的一手经验，这些经验将有助于你为 Android 智能手机、平板电脑和其他带有浏览器的设备开发你自己的\
  \ Android 版 Web 应用。\n\n本书将向你展示如何：\n- 使用 HTML5 和 CSS3 让你的 Web 应用外观精美且运行流畅\n- 使用 JavaScript\
  \ 生成更丰富的应用程序，能够响应各种事件\n- 采用并使用 Android 封装器 API\n- 通过 Canvas、Video 和 Audio 等 HTML5\
  \ API 为用户创建深层次的体验\n- 逐个案例、分层地为你的 Android 设备和目标受众构建 Web 应用\n\n翻开 *Learn HTML5 and\
  \ JavaScript for Android*，获取构建在 Android 设备及其浏览器上运行的响应式、动态且趣味的 HTML5 和 JavaScript\
  \ Web 应用所需的技能。\n\n### 本书适合人群\n本书适用于任何具有 Web 开发或原生移动应用开发经验，并希望掌握移动 Web 的人。\n\n###\
  \ 本书结构\n本书分为九章。\n- **第 1 章：入门**：本章将引导你搭建环境。\n- **第 2 章：为 Android 创建 Web 应用简介**：本章将带你了解移动\
  \ Web 的历史以及它与桌面 Web 站的区别。它将通过几个现有移动 Web 站的案例，说明如何改进或更改它们以提升用户体验。\n- **第 3 章：HTML5\
  \ 和 第 4 章：使用 HTML5 开始你的项目**：这些章节将介绍一些专门针对移动端的 HTML5 标签。本章还将教你如何使用 HTML5 嵌入视频和音频。完成\
  \ HTML5 章后，工作将带你构建 Web 应用的 HTML 基础。\n- **第 5 章：移动端 CSS3 和 第 6 章：奠定 CSS3 基础**：这些章节将向你展示一些\
  \ CSS3 移动兼容特性，如变换、动画、阴影和圆角。你还将学习使用 CSS3 预处理器 `SASS`。工作将带你使用 `SASS` 和最佳实践样式你的移动 Web\
  \ 应用。\n- **第 7 章：移动端 JavaScript 和 第 8 章：JavaScript：模型、视图与控制器**：这些章节将教你如何使用 JavaScript\
  \ 增强你的移动应用程序。本章不涉及 `jQuery`、`Sencha` 或 `jQuery Mobile` 等库。JavaScript 简介章节将教你如何使用原生\
  \ JavaScript 构建基础框架，并与画布和音频交互。工作将带你通过添加分页功能和通过 `JSONP` 与第三方 API 通信来增强 Web 应用。\n\
  - **第 9 章：测试和部署你的移动端 Web 应用**：本章将向你如何使用 `QUnit` 测试应用，并使用 `Capistrano` 部署应用。\n\n\
  ### 下载代码\n本书所示示例的代码可以在 Apress 网站 `www.apress.com` 获取。可以在书籍信息页的“Source Code/Downloads”标签下找到该链接。该标签位于“Related\
  \ Titles”部分下方。\n\n### 联系作者\n如果你有任何问题或建议——或者发现了认为我应该知道的错误——可以通过 `gavin@justanotherdeveloper.co.uk`\
  \ 联系作者，或在 Twitter 上关注 `@fishrodgavin`。\n\n\n\n\n\n[或访问 http://www.justanotherdeveloper.com.](http://www.justanotherdeveloper.com)\n\
  \n# xiii\n\n# 第 1 章：入门\n\n在 2008 年 9 月第一款 Android 手机发布以及更早的 2007 年 6 月发布第一款 iPhone\
  \ 手机之前，移动网络浏览器内部缺乏迫切的标准化驱动。播放视频需要 `Flash mobile` 或低质量的 `3GP` 视频版本。\n\n开发者会避开 `JavaScript`，因为\
  \ `JavaScript` 在大多数移动网络浏览器中默认是禁用的，而另一些浏览器则完全不支持 `JavaScript`。在 `stackoverflow.com`\
  \ 上，其中一位开发者评论道，使用 `JavaScript` 简直是一场“噩梦……就像在 90 年代使用 Web 浏览器，但要面对的是未来管理者的预期。”1\n\
  \n1 `Stackoverflow.com`, 由 `annakata` 发布，[`stackoverflow.com/questions/316876/using-javascript-in-mobile-web-application#316920`](http://stackoverflow.com/questions/316876/using-javascript-in-mobile-web-application#316920)\
  \ [application#316920.](http://stackoverflow.com/questions/316876/using-javascript-in-mobile-web-application#316920)\n\
  \n当时的移动网站仅仅是 `WAP` 时代在黑白移动手机（如 `Motorola V50`）上使用的 `无线标记语言` (`WML`) 页面，只不过增添了一抹色彩。从那时起并没有发生太大变化，大多数移动网站仍然保留了从上到下的相同线性信息流，而且交互性不强。这种设计风格有三个原因：\n\
  \n1. `WAP/GPRS` 和 `EDGE` 都是缓慢的协议，无法处理文件密集型网站，因此设计和内容受到限制，以便快速传送网站及其信息。\n2. 旧手机的分辨率和宽高比非常糟糕，以至于你几乎无法在屏幕上放任何任何内容。\n\
  3. 传统上使用方向键或按键在移动网站上导航。上下滚动似乎比左右滚动更自然。\n\n我们现在不再依赖于使用硬件控制按钮来浏览移动设备上的内容。随着每一款新款平板电脑和手机的发布，屏幕的尺寸、质量、分辨率、`像素密度/PPI`\
  \ 和色彩深度不断增加。我们看到桌面浏览器引擎（如 `WebKit` 和 `Geko`）被引入到网络浏览器中，例如我们移动设备上的 `Mobile Safari`、`Android\
  \ Browser` 和 `Firefox`。这帮助了开发者制作出惊艳的移动网站，它们在现在流行的 `Android` 和 `iOS` 手机和平板设备上视觉和感受都保持一致。\n\
  \n此外，最新的移动浏览器还支持 `GPU 加速`。这意味着移动 Web 应用可以更加精美和交互，因为大部分渲染工作现在可以卸交给图形处理器（这在几年前是闻所未闻）。\n\
  \n考虑到 `Adobe` 最近宣布取消 `Flash Mobile`，结合不断向移动设备中塞入更快的 `CPUs` 和 `RAM` 的竞争，现在是进入移动 Web，而且进入\
  \ `HTML5`、`CSS3` 和 `JavaScript` 的最佳时刻。\n\n作为一名移动 Web 开发者，你现在有机会制作接近原生的应用程序。不要被骗了；移动\
  \ Web 还有很长的路要走。因此，在整本书中，我将为你提供一些技巧，以避免常见的误区。\n\n如果你只能选择一个设备，请选择最新最强大的。设备本身可以使用一年多。如果你的目标是按一年为周期升级设备，你最终将拥有一组不错的旧设备用于测试，以及与你的用户使用的相同或相似的设备。\n\
  \n选择测试设备\n\n虽然不是必不可少的，但你应该选择购买一个用户未来会升级的设备。再次，这将帮助你针对设备进行测试。\n\n与其他操作系统不同，Android\
  \ 遭受着所谓的“碎片化”问题。设备碎片化由某些因素引起：\n\n- `加速度`\n- `GPS`\n- `陀螺仪`\n- `屏幕分辨率`\n- `像素密度 (PPI)`\n\
  - `CPU`\n- `RAM`\n\n\n\n\nAptana 基于 `Eclipse`，因此可以支持大多数（如果不是全部）`Eclipse` 插件；它将管理你的虚拟\
  \ Android 测试环境、执行代码补全、验证你的代码并为你部署。\n\n要下载 Aptana，请访问 [`aptana.com/`](http://aptana.com/)，你会看到图\
  \ 1-1 所示的下载选项。\n\n**图 1-1.** *Aptana 下载选项*\n\n如图 1-1 所示选择“Standalone Version”（独立版本），并点击下载按钮。安装它并继续安装\
  \ Android SDK。\n\n![Image 13](img/index-11_1.jpg)\n\n# 第 1 章：入门\n\n6\n\n> **注意:**\
  \ 你可以根据喜好更改 Aptana 中编辑器的外观（例如，你可能希望为 IDE 设置深色或亮色主题）。要此此，只需进入 `Preferences`。首选项窗口将打开。使用左上角的过滤器输入\
