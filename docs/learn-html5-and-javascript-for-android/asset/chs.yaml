  \ appModelActor(name, role){\n  /**\n  * 演员的实例变量\n  */\n  var _name,\n  _role,\n\
  \  _self = this;\n\n  /**\n  * 使用构造函数的参数设置实例变量\n  */\n  this.init = function(){\n\
  \    this.setName(name);\n    this.setRole(role);\n  }\n\n  /**\n  * getter 和 setter\n\
  \  */\n  /**\n  * 返回演员的全名\n  * @return {String}\n  */\n  this.getName = function(){\n\
  \    return _name;\n  }\n\n  /**\n  * 设置演员的全名\n  * @param {String} name 姓名\n  */\n\
  \  this.setName = function(name){\n    _name = name;\n  }\n\n  /**\n  * 获取演员与关联电影的\n\
