  \n# 矩形左上角 y 坐标相对于画布宽度的位置\n\n矩形的宽度\n矩形的高度\n\n要绘制一个 20px × 20px 的简单矩形，你会使用以下代码：\n\n\
  ```javascript\ncontext.fillStyle = '#000000';\ncontext.fillRect(0, 0, 20, 20);\n\
  ```\n\n这将产生一个与图 7-6 所示类似的矩形。\n\n![Image 97](img/index-200_1.jpg)\n\n**图 7-6.** *一个\
  \ 20px × 20px 的矩形*\n\n`context.fillStyle` 将将任何新闭合形状（如矩形或圆形）的填充颜色设置为黑色或 `#000000`。\n\
  \n在用于播放按钮上绘制停止符号矩形的代码中，你需要考虑停止符号相对于画布的位置。你希望将停止符号直接放置在画布中央。为了让停止符号居中，你需要计算停止符号左上角的\
  \ `x` 和 `y` 偏移量。为了计算这一点，你需要将画布的宽度和高度减半以得到偏移量。然后，你可以从形状的中心减去画布的中心得到 `x` 和 `y` 坐标。这种方法实际上是将要绘制形状的中心与画布的中心对齐。\n\
  \n以下代码将根据画布本身的大小将停止图标在画布居中。\n\n```javascript\napp.playButton = function(id, track){\n\
  \  ...\n  this.drawStop = function(){\n    var width = 20,\n    height = 20,\n \
  \   x = canvas.center.x - (width / 2),\n    y = canvas.center.y - (height / 2);\n\
  \    context.beginPath();\n    context.fillStyle = '#A0A0A0';\n    context.fillRect(x,\
  \ y, width, height);\n  };\n}\n```\n\n如你所示，你将停止图标的 `width` 和 `height` 声明为 `20`以便后续引用。你还通过获取画布中心\
  \ x 坐标减去矩形宽度的一半来计算 `x` 坐标。这将使停止图标水平居中。\n\n接下来，`y` 坐标的设置类似，通过将画布的高度（其中心）减半并减去停止图标高度的一半来设置。这会将停止图标垂直放置在画布中心，如图\
  \ 7-7 所示。将这两个计算结合起来将使停止图标在画布内完全居中。\n\n![Image 98](img/index-202_1.jpg)\n\n**图 7-7.**\
  \ *沿 x 轴和 y 轴居中停止图标*\n\n在开始 Canvas 中绘制新形状之前，调用 `context.beginPath()` 是一个好习惯。这会在上下文中创建一个新路径供你开始绘制。这相当于在纸上画一个新形状之前将笔抬离开纸。\n\
  \n接下来，你需要设置即将绘制的形状的 `fillStyle`。2D 上下文 API 有几种绘制方法。API 最基本的方法和属性如表 7-4 和表 7-5 所示。\n\
  \n### 表 7-4 基础 2D Context 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `context.fillStyle`\
  \ | 设置绘制形状的填充颜色。可以使用十六进制（`#000000`）、RGB 颜色（`rgb(0,0,0)`）或带透明道的颜色（`rgba(0,0,0,0.5)`）的实色。\
  \ |\n| `context.lineWidth` | 将设置此后绘制的任何线条的宽度。值可以是双点数，例如 `1.5`。 |\n| `context.lineCap`\
  \ | 将设置任何线条的端点样式。有效值为 `butt`、`round` 和 `square`。 |\n| `context.strokeStyle` | 这是上下文的描边样式。它设置设置此后绘制的任何线条的颜色。可以使用十六进制（`#000000`）、RGB\
  \ 颜色（`rgb(0,0,0)`）或带透明道的颜色（`rgba(0,0,0,0.5)`）的实色。 |\n\n### 表 7-5 基础 2D Context 方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `context.fillRect(x, y, width, height)` | 将创建一个具有指定属性的矩形。\
  \ |\n| `context.strokeRect(x, y, width, height)` | 将创建一个没有填充但具有指定属性描边的矩形。 |\n| `context.clearRect(x,\
  \ y, width, height)` | 将绘制一个具有指定属性的“白色”矩形。 |\n| `context.arc(x, y, center, start\
  \ angle, end angle, anticlockwise)` | 将使用指定属性绘制弧。起始和结束角度以弧度定义。`anticlockwise` 是一个布尔值，用于指定绘制圆弧的方向。\
  \ |\n\n### 绘制播放图标\n\n播放按钮稍微复杂一些。要绘制播放按钮，你需要使用路径。为了绘制路径，你使用 `moveTo` 和 `lineTo` 方法。这些方法允许你移动到某点而不画线，并在纸上画一个新形状之前移动画线。\n\
  \n```javascript\napp.playButton = function(id, track){\n  ...\n  this.drawPlay =\
  \ function(){\n    var width = 20,\n    height = 20,\n    x = canvas.center.x -\
  \ (width / 2),\n    y = canvas.center.y - (height / 2);\n    context.beginPath();\n\
  \    context.moveTo(x, y);\n    context.lineTo(x + width, y);\n    context.lineTo(x,\
  \ y + height);\n    context.closePath();\n    context.fillStyle = '#A0A0A0';\n \
  \   context.fill();\n  };\n}\n```\n*(注：由于您提供的待翻译文本中“Drawing the Play Icon”部分的描述与代码块内容不匹配，翻译严格遵循“不翻译代码块”原则，仅翻译了描述文字。)*\n\
  \nCanvas 的问题在于你无法对每个形状进行动画处理。移动或动画 Canvas 元素需要完全重绘整个\n\n\n\n\n在 Canvas 中实现动画需要通过\
  \ JavaScript 跟踪每个对象的状态，并在每次调用 `draw` 时对其进行渲染。这是一个漫长且耗力的过程，但通过正确的实现，可以减少时间消耗。\n\n\
  为了跟踪音轨的进度，你首先需要计算出它当前进度的百分比。\n\n# 第 7 章：移动端 JavaScript\n\n```javascript\napp.playButton\
  \ = function(id, track){\n  ...\n  this.draw = function(){\n    var percentage =\
  \ 100 - ((track.getCurrentTime() / track.getLength())\n    * 100);\n  };\n}\n```\n\
  \n其计算方法简单为 `(当前时间 / 长度) * 100`。这将为你提供一个 1 到 100 之间的可预测数字。你需要返回一个百分比，其中 100% 代表轨道开始，0%\
  \ 代表轨道结束。为了实现这一点，你只需要从 `100` 中减去已播放的百分比，即可得到剩余的百分比。\n\n下一步是根据剩余轨道的百分比（`percentage`）计算播放头的角度。你知道\
  \ `2 * π (PI)` 的结果将等于圆周的弧度角度。`0 * π (PI)` 将导致 `0`，从而产生一个空圆。\n\n```javascript\napp.playButton\
  \ = function(id, track){\n  ...\n  this.draw = function(){\n    var percentage =\
  \ 100 - ((track.getCurrentTime() / track.getLength()) *\n    100);\n    var endradians\
  \ = (percentage * (2 / 100)) * Math.PI;\n  };\n}\n```\n\n图 7-10 显示了 `PI` 计算的显著位置。\n\
  \n![图像 101](img/index-208_1.jpg)\n\n**图 7-10.** *n π 弧度*\n\n如你所示，`0` 从圆的正右侧开始，而\
  \ `2` 也产生相同的位置。如果你将弧的起始位置设置为 `0`，结束位置设置为 `2 * PI`，结果将无所产出，因为 `0°` 角度会导致圆圆没有周长。\n\
  \n你将定期重绘画布，因此在每次重绘时都需要清除画布，以防止在新的形状下方显示之前的上下文形状。这可以通过调用 `context.clearRect(0, 0,\
  \ canvas width, canvas height);` 实现。这本质上是在整个画布上绘制一个透明的矩形。你不需要担心矩形绘制后内存或形状的存在，因为内存中只保留当前的上下文。\n\
  \n```javascript\napp.playButton = function(id, track){\n  ...\n  this.draw = function(){\n\
  \    var percentage = 100 - ((track.getCurrentTime() / track.getLength()) *\n  \
  \  100);\n    var endradians = (percentage * (2 / 100)) * Math.PI;\n    context.clearRect(0,\
  \ 0, canvas.dimensions.width,\n    canvas.dimensions.height);\n  };\n}\n```\n\n\
  下一步是绘制作为播放按钮背景的圆。通过绘制一个完整的圆并将其填充黑色来实现这一目标。\n\n```javascript\napp.playButton = function(id,\
  \ track){\n  ...\n  this.draw = function(){\n    var percentage = 100 - ((track.getCurrentTime()\
  \ / track.getLength()) *\n    100);\n    var endradians = (percentage * (2 / 100))\
  \ * Math.PI;\n    context.clearRect(0, 0, canvas.dimensions.width,\n    canvas.dimensions.height);\n\
