  \ </li>\n</ul>\n```\n\n在 HTML5 中，你可以用 `href` 标签包裹块级元素。这使得将列表项的整个内容变成指向另一个资源的链接变得更容易。\n\
  \n# 第 5 章：用于移动端的 CSS3\n\n131\n\n以下代码示例显示了如何使用 `@font-face` 的完整声明。\n\n```css\n@font-face\
  \ {\n  font-family: \"My Font With Spaces\";\n  src: local(\"My Font With Spaces\"\
  ),\n       url(\"/path/to/fonts/my-font-with-spaces.woff\") format(\"woff\"),\n\
  \       url(\"/path/to/fonts/my-font-with-spaces.eot\") format(\"embedded-opentype\"\
  ),\n       url(\"/path/to/fonts/my-font-with-spaces.svg\") format(\"svg\"),\n  \
  \     url(\"/path/to/fonts/my-font-with-spaces.ttf\") format(\"truetype\");\n  font-style:\
  \ normal;\n  font-weight: normal;\n}\n```\n\n## text-shadow 和 text-stroke\n\n`text-shadow`\
  \ 允许你使用 CSS 在文字后创建不同量的阴影。`text-stroke` 允许你在文字的内边缘绘制轮廓。`text-shadow` 和 `text-stroke`\
  \ 也可以用于 `@font-face` 字体。\n\n若要在文字周围创建一个基础阴影，你只需要在 CSS 中添加 `text-shadow` 属性。该属性接受以下值和格式。\n\
  \n`text-shadow: horizontal-offset vertical-offset blur color;`\n\n例如，以下 CSS 样式将产生与图\
  \ 5-7 所示类似的结果。\n\n```css\nh1 {\n  text-shadow: 10px 10px 10px #000000;\n}\n```\n\
  \n你也可以对阴影的位置使用负数。这会让水平偏移使阴影向左移动，垂直偏移使阴影向顶部移动。\n\n你通过指定像素的描边宽度及其颜色来定义 `text-stroke`\
  \ 属性。`text-stroke` 属性接受以下值和格式。\n\n`text-stroke: width color;`\n\n它的用法与 `text-shadow`\
  \ 非常相似，如下面的代码段所示。\n\n```css\nh1 {\n  text-stroke: 1px #000000;\n}\n```\n\n![Image\
  \ 72](img/index-135_1.png)\n\n# 第 5 章：用于移动端的 CSS3\n\n132\n\n**图 5-7.** 文字阴影效果（左）和描边效果（右）\n\
  \n## 选择器\n\n选择器允许你使用 CSS 对 DOM 元素应用样式。通常有两种类型的选择器：普通的 CSS 类、、元素和 ID 选择器，例如 `.elementclass`、`#elementid`\
  \ 和 `element`。还有伪类器，例如 `:link`、`:visited`、`:hover` 和 `:active`。\n\nCSS3 引入了几个新选择器，允许你根据属性值、输入状态以及元素在\
  \ DOM 中的位置来选择元素。\n\n### 有用的表单选择器\n\n表单选择器将允许你根据状态或类型对表单输入应用样式。在 CSS3 之前，你需要手动为文本、复选框、单选按钮和提交字段以及按钮分配类，因为没有明确的方法为这些字段应用样式。这是因为它们都是\
  \ `<input />` 元素，所以任何为输入元素创建全局样式的尝试都会让所有类型的字段样式完全相同。\n\n有了 CSS3，你现在可以使用新的属性选择器对特定的输入类型应用样式。表\
  \ 5-3 给出了属性选择器的格式。\n\n# 第 5 章：用于移动端的 CSS3\n\n133\n\n**表 5-3.** 属性选择器\n\n| 选择器 |\
  \ 描述 |\n| :--- | :--- |\n| `element[attribute=\"value\"]` | 匹配属性完全等于 value 的元素。\
  \ |\n| `element[attribute*=\"value\"]` | 匹配属性包含 value 的元素并应用样式。 |\n| `element[attribute^=\"\
  value\"]` | 匹配属性以 value 开头的元素并应用样式。 |\n| `element[attribute$=\"value\"]` | 匹配属性以\
  \ value 结尾的元素并应用样式。 |\n\n# 第 5 章：用于移动端的 CSS3\n\n134\n\n## 替换 JavaScript 的有用选择器\n\
  \n使用 JavaScript 选择另一个元素的最后一个孩子并为其应用类以移除浮动元素的边距或内边距是很常见的。如果你有多行的三列布局，可以使用 JavaScript\
  \ 选择元素内的每第三个孩子并为其应用类。有了 CSS3，你不再需要这样做。你可以使用 `:last-child` 类选择元素的最后一个孩子。\n\n```css\n\
  ul li:last-child {\n  margin-right: 0px;\n}\n```\n\n你也可以用同样的方法选择任何元素的第 n 个孩子。使用\
  \ `:nth-child`、`:nth-last-child`、`:nth-of-type` 和 `:nth-last-of-type`，你可以根据子索引和子类型进行选择，如表\
  \ 5-5 所示。\n\n**表 5-5.** nth 选择器\n\n| 选择器 | 描述 |\n| :--- | :--- |\n| `:nth-child(index)`\
  \ | 选择位于父元素指定索引处的元素。 |\n| `:nth-last-child(index)` | 选择从父元素末尾开始位于指定索引处的元素。 |\n|\
  \ `:nth-of-type(index)` | 选择位于父元素指定索引处的同类型元素。 |\n| `:nth-last-of-type(index)` |\
  \ 选择从父元素末尾开始位于指定索引处的同类型元素。 |\n\n\n\n\n创建根据屏幕尺寸和方向进行缩放的渐变背景。CSS3 渐变目前是特定厂商的。每个厂商似乎都有自己自己的生成\
  \ CSS3 渐变的方法。本节将重点介绍 WebKit 的实现。\n\n在 CSS3 中你可以使用两种类型的渐变：线性（linear）和径向（radial）。\n\
  \n线性渐变将从屏幕的一侧流向另一侧，而径向渐变将从一个中心点向外散发，如图 5-8 所示。\n\n**图 5-8。** *线性（左）和径向（右）渐变*\n\n\
  ## 线性渐变\n\n线性渐变具有以下语法，必须使用 `background` 属性作为背景应用。\n\n```css\n.box {\n  background:\
  \ -webkit-linear-gradient(start, start-color, end-color);\n}\n```\n\n你可以将起始位置指定为单位置（`left`、`top`、`right`、`bottom`）或这些位置的组合。例如，要从左下角开始线性渐变，可以使用以下代码。\n\
  \n```css\n.box {\n  background: -webkit-linear-gradient(bottom left, green, red);\n\
  }\n```\n\n![Image 74](img/index-139_1.jpg)\n\n第 5 章：移动 CSS3\n136\n\n图 5-9 显示了此代码段的结果。\n\
  \n**图 5-9。** *以左下角为起始点的线性渐变*\n\n你也可以用角度指定渐变的起始点。例如，将起始点设置为 `45deg` 将产生将起始点设置为 `bottom\
  \ left` 相同的结果。\n\n```css\n.box {\n  background: -webkit-linear-gradient(45deg, green,\
  \ red);\n}\n```\n\n除了标准的双色渐变外，你还可以在渐变背景中使用多种颜色。你只需要在位置之后指定更多颜色即可。例如，以下代码将使用线性渐变创建一个爱尔兰旗，如图\
  \ 5-10 所示。\n\n```css\n.box {\n  background: -webkit-linear-gradient(left, green,\
  \ white, orange);\n}\n```\n\n![Image 75](img/index-140_1.jpg)\n\n第 5 章：移动 CSS3\n\
  137\n\n**图 5-10。** *使用 CSS3 渐变创建爱尔兰旗*\n\nCSS3 渐变还支持颜色停止点（color stops）。颜色停止点允许你指定渐变沿渐变线在哪里停止。例如，你可以使用停止点在\
  \ CSS3 中不使用任何渐变就创建一个真实的爱尔兰旗。为了实现这一点，你需要指定绿色在元素的 `33%`（三分之一）处停止，然后白色从 `33%` 处开始并在\
  \ `33%` 处停止。这将在绿色和白色之间创建一条立即的颜色线，而不是渐变。从这里开始，你将使用另一种白色并指定在屏幕的 `66%` 处停止；最后是橙色，它将在\
  \ `666%` 处停止，创建另一条颜色线。\n\n代码看起来类似于下面，你可以在图 5-11 中看到结果。\n\n```css\n.box {\n  background:\
  \ -webkit-linear-gradient(left, green 33.3%, white 33.3%, white 66.6%, orange 66.6%);\n\
  }\n```\n\n![Image 76](img/index-141_1.png)\n\n第 5 章：移动 CSS3\n138\n\n**图 5-11。**\
  \ *使用 CSS3 渐变颜色停止点创建爱尔兰旗*\n\n## 径向渐变\n\n径向渐变比线性渐变稍微复杂。你可以指定渐变的位置从哪里开始以及它的形状。径向渐变具有以下语法。\n\
  \n```css\n.box {\n  background: -webkit-radial-gradient(center, [circle|elipse]\
  \ [closest-side|closest-corner|farthest-side|farthest-corner|contain|cover], start-color,\
  \ stop-color);\n}\n```\n\n你可以用像素指定中心位置，或者百分比左和顶部位置。第二个参数接受形状关键字，可以是 `circle` 或 `ellipse`。第二个参数还接受尺寸关键字，这些是\
  \ `closest-side`、`closest-corner`、`farthest-side`、`farthest-corner`、`contain` 和\
  \ `cover`。最后，渐变还接受作为十六进制、关键字、RGB 或 RGBA 颜色的起始和停止颜色。\n\n例如，你可以使用以下代码用 CSS3 创建日本旗，其结果可以在图\
  \ 5-12 中看到。\n\n```css\n.box {\n  background: -webkit-radial-gradient(center, circle\
  \ contain, red, white);\n}\n```\n\n![Image 77](img/index-142_1.jpg)\n![Image 78](img/index-142_2.jpg)\n\
  \n第 5 章：移动 CSS3\n139\n\n**图 5-12。** *带有径向渐变的日本旗*\n\n你可以使用线性渐变示例中相同的颜色停止技术来移除径向渐变上的渐变并创建一个圆圆。你可以使用以下代码来实现这一点，图\
  \ 5-13 显示了结果。\n\n```css\n.box {\n  background: -webkit-radial-gradient(center, circle\
  \ contain, #C00C00 70%, white 70%);\n}\n```\n\n**图 5-13。** *移除了径向渐变的日本旗*\n\n第 5\
