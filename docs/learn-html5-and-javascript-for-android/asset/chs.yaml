  \ = function(role){\n    _role = role;\n  }\n\n  this.init();\n}\n```\n\n# Movie\
  \ 模型\n\nMovie 模型是应用中的一个模型，它与 Actor 和 Video 模型有关系。它包含电影的元数据，如标题、发布日期、评分等。在 `/js/app/models/`\
  \ 目录下创建一个 `movie.js` 文件。为了开始，你需要验证参数。\n\n**注意：** 只有部分 Rotten Tomatoes API 会被涵盖。关于\
  \ API，你可以访问 [`developer.rottentomatoes.com/`](http://developer.rottentomatoes.com/)。\n\
  \n以下代码片段展示了你需要创建 setter 的实例变量。\n\n```javascript\nvar app = app || {};\n\napp.model\
  \ = app.model || {};\n\n/**\n* 用于应用程序中电影的模型\n*\n* @alias app.model.movie\n* @constructor\n\
  * @param {String} title 标题\n* @param {String} rtid ID\n* @param {String} posterframe\
  \ 海报帧\n* @param {String} synopsis 简介\n*/\napp.model.movie = function appModelMovie(title,\
  \ rtid, posterframe, synopsis) {\n  /**\n  * 电影的实例变量\n  */\n  var _title,\n  _rtid,\n\
  \  _posterframe,\n  _synopsis,\n  _releaseDate,\n  _videos = [],\n  _actors = [],\n\
  \  _rating,\n  _favorite = false,\n  _self = this;\n}\n```\n\n### 验证\n\n遗憾的是，JavaScript\
  \ 不支持所谓的类型提示（type hinting）。类型提示是指定方法接受的参数类型的过程。在其他语言中，类型提示允许你在方法声明中指定类型。例如，在 PHP\
  \ 中，你可以像下面这样指定参数应该是数组或对象：\n\n```php\nfunction doSomething(MyObject $object, array\
  \ $myarray){\n/** 使用实现 **/\n}\n```\n\n这减少了执行大量验证以检查传递给方法的对象是否为特定类型的需求，因为如果不是，方法会自动抛出异常或错误。\n\
  \n为了解决这个问题，你需要对传递给 setter 的参数进行验证。\n\n常见的验证类型是验证类型。你可以检查值是否为对象、数组、数字或字符串。\n\n你可能会多次使用这些验证器，因此创建一个对象来存储所有的验证方法是值得的。为此，在\
  \ `js/app/utility` 目录下创建一个名为 `validator.js` 的 JavaScript 文件。\n\n你创建一个没有构造函数的对象。这允许你在无需实例化的情况下使用对象的方法。使用以下代码片段开始创建你的验证对象。\n\
  \n```javascript\nvar app = app || {};\n\napp.utility = app.utility || {};\n\n/**\n\
  * Validator 对象具有静态方法\n* 用于方便验证值\n*/\napp.utility.validator = {}\n```\n\n有了验证工具类，我们就可以开始创建验证方法了。\n\
  \n\n\n第一个简单的验证方法是检查一个值是否为空。在验证器中创建一个名为 `isEmpty` 的新方法，如下面的代码所示。\n\n```javascript\n\
  app.utility.validator = {\n  /**\n   * 检查一个值是否为空\n   * 如果为空则返回 true，否则返回 false\n\
  \   * @param {String|Object} value\n   * @return {Bool}\n   */\n  isEmpty: function(value){\n\
  \    return false;\n  }\n}\n```\n第 8 章节：JavaScript：模型、视图与控制器\n245\n\n如你所见，`isEmpty`\
  \ 方法接受一个参数，即为待验证的值。默认情况下，它会返回 `false`，除非后续实现返回 `true`。\n\n使用以下验证代码完成验证器。\n\n```javascript\n\
  app.utility.validator = {\n  /**\n   * 检查一个值是否为空\n   * 如果为空则返回 true，否则返回 false\n\
  \   * @param {String|Object} value\n   * @return {Bool}\n   */\n  isEmpty: function(value){\n\
  \    if(value == '' || value == null || value === false){\n      return true;\n\
  \    }\n    return false;\n  }\n}\n```\n从前面的实现中你可以看到，如果值为空字符串、`null` 或 `false`，则条件语句将返回\
  \ `true`。\n\n**注意：** 如你所见，我使用了 `===` 来将值与 `false` 进行比较。`==` 比较是松散的比较。例如，`0 == false`\
  \ 将返回 `true`。`0` 并不一定是一个空值，因此使用 `0 === false` 将返回 `false`，因为 `0` 和 `false` 是两个完全不同的类型。\n\
  \nisTypeOf\n\n下一个验证器将检查一个值是否为对象类型。这是一个相对简单的方法。它使用 `instanceof` 来检查一个对象是否是另一个对象的实例。该方法接受一个值和一个类型。然而，该类型不能是字符串，而必须是原始对象，如下代码段所示。\n\
  \n第 8 章节：JavaScript：模型、视图与控制器\n246\n\n```javascript\napp.utility.validator = {\n\
  \  ...\n  /**\n   * 检查一个值是否为对象类型\n   * 如果是则返回 true，否则返回 false\n   * @param {Object}\
  \ value\n   * @param {Object} type\n   * @return {Bool}\n   */\n  isTypeOf: function(value,\
  \ type){\n    if(value instanceof type){\n      return true;\n    }\n    return\
  \ false;\n  }\n}\n```\n这很棒，但当你想要检查布尔值、字符串和数字等原始类型时会发生什么？仅仅为了检查这些类型创建一个新方法会令人困惑且有些困恼。为了解决这个问题，你可以使用\
  \ `typeof` 运算符。它会检查变量的类型。由于字符串、数字和布尔值是原始类型，你可以通过允许类型参数接受字符串来检查这些类型。要做到这一点，只需添加以下代码。\n\
  \n```javascript\napp.utility.validator = {\n  ...\n  /**\n   * 检查一个值是否为对象类型\n  \
  \ * 如果是则返回 true，否则返回 false\n   * @param {Object} value\n   * @param {Object} type\n\
  \   * @return {Bool}\n   */\n  isTypeOf: function(value, type){\n    // 首先检查类型是否为字符串\n\
  \    if(typeof type == \"string\"){\n      // 如果是，我们可能正在检查一个原始类型\n      if(typeof\
  \ value == type){\n        return true;\n      }\n    } else {\n      // 我们正在处理对象比较\n\
  \      if(value instanceof type){\n        return true;\n      }\n      第 8 章节：JavaScript：模型、视图与控制器\n\
  247\n    }\n    return false;\n  }\n}\n```\n从前面的代码中可以看出，主要的更改是 `isTypeOf` 方法检查 `type`\
  \ 参数是否为字符串类型。如果它是字符串，则假设你想要检查原始类型；否则，你正在检查对象类型。如果原始类型与你要求的类型相同，它将返回 `true`。\n\n\
  这绝非不是一个万无一失的解决方案。目前有许多库可以进行更好的类型检查。其核心思想是，当你开始需要更多验证技术时，可以根据需要随时向验证对象中添加内容。如果你创建的验证方法不完全符合特定的边缘情况，你可以进行调整以补偿。有了这些措施，我们现在可以根据\
  \ UML 类图在模型的访问器方法中强制执行类型检查。\n\n## 在模型上应用验证\n\n当你对模型应用验证时，你有两个选择：要么在验证失败时静默失败，要么抛出异常并允许调用者处理它。我更倾向于后者。没有什么比更令人沮丧的，当你的应用程序发生严重问题而你却完全不知情，因此无法在代码中做出反应。\n\
  \n### 抛出和处理异常\n\n异常应该被认为是由用户代码抛出的关键错误。\n\n你不应该在你写的每部分代码中抛出异常，因为你必须在调用该代码的代码中使用 `try/catch`\
  \ 块来包裹该代码。\n\n未捕获的抛出异常将出现在控制台中。\n\n抛出异常相当简单。它由 `throw` 运算符以及字符串、整数或（你所信的）对象组成。\n\
  \n```javascript\n// 抛出字符串\nif(true !== false){\n  throw \"不等于 false\"\n}\n// 抛出对象\n\
  if(true !== false){\n  throw {\n    message: \"不等于 false\",\n第 8 章节：JavaScript：模型、视图与控制器\n\
  248\n    type: \"validation_exception\",\n    code: 1000\n  }\n}\n```\n如果你想知道抛出了什么类型的异常，下一步是捕获抛出的异常。为了测试这一点，你可以将条件语句封装在一个函数中并在\
  \ `try/catch` 块中调用它，以展示它在现实情况下的如何工作。\n\n```javascript\nfunction doSomething(){\n\
  \  if(true !== false){\n    throw {\n      message: \"不等于 false\",\n      type:\
  \ \"validation_exception\",\n      code: 1000\n    }\n  }\n}\n\ntry {\n  doSomething();\n\
  } catch (e){\n  alert(e.message);\n}\n```\n如果你尝试这段代码，你会发现异常被抛出了，`e.message` 将为你获取消息并将其显示。重要的是，异常应该只在你的代码块中没有其他处理方式时才使用。\n\
  \n### 强化模型\n\n下一节将带你通过强化模型，使得设置器在传递错误类型的值时抛出异常。为了方便阅读，省略了读取。\n\n新的验证规则（在下面的代码中**加粗**）简单地检查类型。如果值不是特定类型，它将抛出验证异常并跳出方法。这防止了实例变量被无效值设置。\n\
  \n此外，为了方便，`app.utility.validator` 对象已赋值给 `validator` 变量。这使得访问验证方法变得更容易，而无需不断输入极长的命名空间。因为它是一个实例变量，所以特权方法也可以访问。\n\
  \n```javascript\napp.model.videosource = function appModelVideoSource(url, format){\n\
  \  /**\n   * 视频源的实例变量\n   */\n  var _url,\n      _format,\n      _self = this,\n\
  \      validator = app.utility.validator;\n\n  ...\n\n  /**\n   * 设置视频源的 url\n \
  \  * @param {String} url\n   */\n  this.setUrl = function(url){\n    // 检查值是否为原始字符串类型\n\
  \    if(!validator.isTypeOf(url, \"string\")){\n      throw {\n        message:\
  \ \"videosource 模型中的 url 属性需要\n        'string' 类型\",\n        type: \"validation_exception\"\
  \n      }\n    }\n    return;\n  }\n}\n```\n\n\n\n\n```javascript\n_url = url;\n\
  \n}\n\n...\n\n/**\n* 设置视频源的 mime 类型\n* @param {app.type.format} format\n*/\nthis.setFormat\
  \ = function(format){\n  // 检查值是否为 app.type.format\n  if(!validator.isTypeOf(format,\
  \ app.type.format)){\n    throw {\n      // 第 8 章：JavaScript：模型、视图和控制器\n      //\
  \ 250\n      message: \"videosource 模型中的 format 属性需要一个 'app.type.format' 类型\",\n\
  \      type: \"validation_exception\"\n    }\n    return;\n  }\n  _format = format;\n\
  }\n\nthis.init();\n}\n```\n\n根据这个示例，你现在应该能够根据书中的代码注释，为你的设置器（setters）添加验证。可以自由地为每个模型添加这些验证。\n\
  \n### 创建新类型\n\nJavaScript 目前可用的类型非常棒。然而，有时你可能会发现处于这样一种情况：你想要向模型传递一个结构化对象，而该对象本身并不一定是一个模型。这些通常被称为类型（types），并在整个应用程序中具有相同的结构。例如，你可能想创建一个新的位置类型来存储位置信息，并以一种可预测的方式检索它。\n\
  \n从模型的注释中，你会看到应用程序中有两种自定义类型：`format` 和 `releaseDate`。`format` 仅允许你存储视频格式，以便于获取 mime\
  \ 类型、文件格式（如 `mp4`、`webm` 等）以及用于引用的格式名称。`releaseDate` 类型则简单地存储电影的院映日期和 DVD 发映日期。\n\
  \n要创建新类型，只需在 `js/app/type` 目录下创建两个名为 `format.js` 和 `releaseDate.js` 的新文件。（如果该目录不存在，你应该创建它。）\n\
  \n在 `format.js` 文件中，添加以下代码。\n\n```javascript\nvar app = app || {};\napp.type = app.type\
  \ || {};\n\n/**\n* 媒体类型，可用于\n* 定义对象的 mime 类型\n* @param {String} name\n* 第 8 章：JavaScript：模型、视图和控制器\n\
  * 251\n* @param {String} format\n* @param {String} mime\n*/\napp.type.format = function(name,\
  \ format, mime){\n  /**\n  * 媒体的实例变量\n  */\n  var _name,\n  _format,\n  _mime,\n\
  \  _self = this;\n\n  /**\n  * 使用构造函数的参数设置实例变量\n  */\n  this.setName(name);\n  this.setFormat(format);\n\
  \  this.setMime(mime);\n\n  /**\n  * 获取器和设置器\n  */\n  /**\n  * 获取媒体类型的名称\n  * @return\
  \ {String}\n  */\n  this.getName = function(){\n    return _name;\n  }\n\n  /**\n\
  \  * 设置媒体类型的名称\n  * @param {String} name\n  */\n  this.setName = function(name){\n\
  \    _name = name;\n  }\n\n  /**\n  * 获取媒体的格式（例如 webm, ogv）\n  * @return {String}\n\
  \  */\n  this.getFormat = function(){\n    return _format;\n  }\n\n  /**\n  * 第\
  \ 8 章：JavaScript：模型、视图和控制器\n  * 252\n  * 设置媒体的格式\n  * @param {String} format\n \
  \ */\n  this.setFormat = function(format){\n    _format = format;\n  }\n\n  /**\n\
  \  * 获取媒体的 mime 类型\n  * @return {String}\n  */\n  this.getMime = function(){\n \
  \   return _mime;\n  }\n\n  /**\n  * 设置媒体的 mime 类型\n  * @param {String} mime\n \
  \ */\n  this.setMime = function(mime){\n    _mime = mime;\n  }\n}\n```\n\n如你所见，只有三个名为\
  \ `mime`、`format` 和 `name` 的实例变量。通过访问器（accessors），这就是创建新类型所需的所有。你可以以同样的方式创建发布类型，只需向\
  \ `releaseDate.js` 中添加以下代码。\n\n```javascript\nvar app = app || {};\napp.type = app.type\
  \ || {};\n\n/**\n* 电影发行日期\n* 构造函数接收院映日期和 DVD 发映日期\n* @param {Date} cinema\n* @param\
  \ {Date} dvd\n*/\napp.type.releaseDate = function(cinema, dvd){\n  /**\n  * 发行日期实例变量\n\
  \  */\n  var _dvd,\n  _cinema;\n\n  /**\n  * 使用设置器设置实例变量\n  * 第 8 章：JavaScript：模型、视图和控制器\n\
  \  * 253\n  */\n  this.setDvd(_dvd);\n  this.setCinema(_cinema);\n\n  /**\n  * 获取\
  \ DVD 发映日期\n  */\n  this.getDvd = function(){\n    return _dvd;\n  }\n\n  /**\n\
  \  * 设置 DVD 发映日期\n  */\n  this.setDvd = function(dvd){\n    _dvd = dvd;\n  }\n\n\
  \  /**\n  * 获取院映日期\n  */\n  this.getCinema = function(){\n    return _cinema;\n\
  \  }\n\n  /**\n  * 设置院映日期\n  */\n  this.setCinema = function(cinema){\n    _cinema\
  \ = cinema;\n  }\n}\n```\n\n正如你所看到的，只有 `mime`、`format` 和 `name` 这三个实例变量。通过访问器，这就是创建新类型所需的所有。你可以以同样的方式创建发布类型，只需向\
  \ `releaseDate.js` 中添加以下代码。\n\n正如你所看到的，只有 `mime`、`format` 和 `name` 这三个实例变量。通过访问器，这就是创建新类型所需的所有。你可以以同样的方式创建发布类型，只需向\
  \ `releaseDate.js` 中添加以下代码。\n\n正如你所看到的，只有 `mime`、`format` 和 `name` 这三个实例变量。通过访问器，这就是创建新类型所需的所有。。\n\
  \n## 应用程序工具\n\n正如你所看到的，除了 `validator` 之外，还有三种工具。这些工具是：\n\n- `deck.js`：该工具用于管理卡片。\n\
  - `layout.js`：该工具允许你刷新页面。\n- `jsonp.js`：该工具允许你跨域请求。\n\n### 管理卡片（Deck）\n\n这种对象被用于显示和隐藏卡片。为了这种方法，你可能想使用\
  \ CSS3 动画来实现淡入淡出。在 `js/app/utility` 目录下创建一个名为 `deck.js` 的新文件，包含以下代码。\n\n```javascript\n\
  var app = app || {};\napp.utility = app.utility || {};\n\napp.utility.deck = (function(){\n\
  \  // 将所有卡片在局部作用域内\n  var _cards = document.getElementsByClassName('card');\n\n\
  \  // 返回一个对象\n  return {\n    // 通过添加 active 类显示卡片\n    showCard: function(id){\n\
  \      document.getElementById(id).classList.add('active');\n    },\n    // 通过移除\
  \ active 类隐藏卡片\n    hideCard: function(id){\n      document.getElementById(id).classList.remove('active');\n\
  \    },\n    /*\n    * 通过遍历列表列表并移除 active 类来隐藏所有卡片\n    */\n    hideAllCards: function(){\n\
  \      for(var i = 0; i < _cards.length; i++){\n        // 第 8 章：JavaScript：模型、视图和控制器\n\
  \        // 255\n        _cards[i].classList.remove('active');\n      }\n    }\n\
  \  }\n})();\n```\n\n该对象简单地暴露了向特定 ID 的元素添加或移除 active 类的方法。还有一个方便隐藏 deck 中所有卡片的方法。`_cards`\
  \ 实例变量持有 中所有卡片的列表。\n\n正如你看到的，而不是创建一个匿名函数，函数本身被括号括起来，函数本身返回一个带有方法的对象。这被称为揭示模块模式（revealing\
  \ module pattern）。它与 JavaScript 创建对象的普通方式不同，通过创建一个函数并使用 `this.methodName` 来创建方法。函数内部的代码在脚本加载时自动执行并返回一个对象。\n\
  \n```javascript\nvar myObject = (function(){\n  return {\n    sayHi: function(){\n\
  \      alert('Hi!');\n    }\n  }\n})();\n```\n\n这意味着你不需要使用 `new` 运算符来创建一个新对象。你只需通过使用分配的变量（在本例中为\
  \ `myObject`）来调用对象，因为构造函数已经执行完毕。你可以以任何对象的方式访问公共方法。\n\n```javascript\nmyObject.sayHi();\n\
  ```\n\n\n\n\n有时你可能需要从你自己的外部 Web 服务拉取数据。为了实现这一点，你通常会使用 `Ajax`。如果另一个服务器支持跨源资源共享（CORS），你将能够发送远程\
  \ Ajax 请求。遗憾的是，并不是所有的 Web 服务都支持此。\n\n为了解决这个问题，某些 Web 服务支持 `JSONP`。`JSONP` 允许你向 Web\
  \ 服务发送一个回调参数。通常，你会在 JSON 请求的一部分中接收到一个 JSON 对象，如下所示。\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\
  \n```json\n{\n  \" name\": \" Dave\",\n  \"occupation\": \" General Manager\"\n\
  }\n```\n\n使用 `JSONP` 时，由于创建请求的方法，这些数据变得无法访问。在 `Ajax` 请求中，你发送请求并创建一个回调方法作为事件监听器。而在\
  \ `JSONP` 中，你实际上是将请求作为 `<script />` 嵌入到 Web 页面中。作为脚本的一部分，你将追加一个回调方法。\n\n生成的 HTML\
  \ 看起来如代码片段所示：\n\n```html\n<script src=\"http://myservice.com/staff/101/?callback=showProfile\"\
  \ async=\"async\"></script>\n```\n\n这将加载脚本，Web 服务将结果封装在方法中，响应将如下所示：\n\n```javascript\n\
  showProfile({\n  \"name\": \"Dave\",\n  \"occupation\": \" General Manager\"\n});\n\
  ```\n\n随后 `showProfile` 函数将带有数据作为其参数进行执行。创建一个 `JSONP` 请求是一项繁琐的工作，而 `jsonp.js` 可以为你处理这项工作。首先在\
  \ `js/app/utility/` 内部创建一个名为 `jsonp.js` 的新 JavaScript 文件。添加以下代码：\n\n```javascript\n\
  var app = app || {};\napp.utility = app.utility || {};\napp.utility.jsonp = function(url,\
  \ callbackmethod){\n  /**\n   * 创建一个新的 _src 变量，将回调参数追加到 url\n   */\n  var _src =\
  \ url + '&callback=' + callbackmethod;\n\n  /**\n   * 创建脚本元素\n   */\n  var _script\
  \ = document.createElement('script');\n\n  /**\n   * 将脚本元素的源设置为与上面指定的相同\n   */\n\
  \  _script.src = _src;\n\n  /**\n   * 为了防止脚本阻塞其他请求，尽可能\n   * 异步加载它\n   */\n  _script.async\
  \ = \"async\";\n\n  /**\n   * 一旦脚本加载完成，函数将执行，\n   * 脚本标签可以从文档头中移除\n   */\n  _script.onload\
  \ = _script.onreadystatechange = function(load){\n    var script = document.head.removeChild(load.target);\n\
  \    script = null;\n  }\n\n  /**\n   * 这个特权方法将通过将脚本追加到\n   * DOM 来发送请求\n   */\n\
  \  this.send = function(){\n    document.head.appendChild(_script);\n  }\n}\n```\n\
  \n该工具本身并不复杂。它简单地创建一个脚本元素并将其嵌入文档中。脚本加载完成后，`onload` 事件监听器会自动将其从 DOM 中移除。要发送请求，只需调用：\n\
  \n```javascript\nvar request = new app.utility.jsonp(\"http://myservice.com/staff/101/\"\
  , \"showProfile\");\nrequest.send();\n```\n\n`JSONP` 的问题在于，与 `Ajax` 不同，你无法取消请求。因此，如果你经常为自动补全字段发送请求，可能会发现发送了多个请求，但它们返回的顺序并不是你预期的顺序。如何处理此将在本章后后部分的\
  \ `Movies Controller` 中介绍。\n\n## 控制布局和处理大小调整\n\n有时，你可能会发现仅用 CSS 无法产生你想要的布局。例如，页面上可能有三个高度不可预测的元素。使用\
  \ JavaScript 来处理这种情况真的应该被视为最后的手段，因为在你的页面加载和布局工具调整元素尺寸之间可能存在延迟。\n\n该工具的代码看起来与其他对象略有不同。它使用一个自执行函数，这样脚本一加载完成，它就会自动执行。在\
  \ `js/app/utility/` 内部创建一个名为 `layout.js` 的新文件，包含以下代码：\n\n```javascript\nvar app\
  \ = app || {};\napp.utility = app.utility || {};\napp.utility.layout = (function(){\n\
  \  /**\n   * 此方法将调整所有卡片（decks）的高度\n   * 以为顶部任务栏留出空间，\n   * 任务栏的高度是不可预测的\n   */\n\
  \  var fixdeckheight = function(){\n    /**\n     * 首先遍历每个卡片\n     */\n    [].forEach.call(document.getElementsByClassName('deck'),\
  \ function(el){\n      /**\n       * 通过从文档主体的高度中减去\n       * 任务栏的高度设置卡片的高度\n   \
  \    */\n      el.style.height = (document.body.offsetHeight – document.getElementById('taskbar').offsetHeight)\
  \ + 'px';\n    });\n  };\n\n  /**\n   * 创建超时变量，因为在某些浏览器中\n   * 新尺寸可能需要一些时间来更新\n\
  \   */\n  var timeout;\n\n  /**\n   * 为窗口添加事件监听器，这样当\n   * 它被调整大同时，它将清除超时\n   */\n\
  \  window.addEventListener('resize', function(){\n    /**\n     * 为了防止脚本阻塞其他请求，尽可能\n\
  \     * 异步加载它\n     */\n    clearTimeout(timeout);\n\n    /**\n     * 一旦脚本加载完成，函数将执行，\n\
  \     * 脚本标签可以从文档头中移除\n     */\n    timeout = setTimeout(function(){\n      fixdeckheight();\n\
  \    }, 100);\n  });\n\n  // 第一次调用 fixdeckheight\n  fixdeckheight();\n})();\n```\n\
  \n从注释中可以看出，自执行函数包含一个名为 `fixdeckheight` 的方法。它简单地将卡片的高度设置为窗口的大小，并考虑了任务栏。\n\n## 视图\n\
  \n当我第一次遇到 JavaScript 中的视图时，我假设视图只是 Web 页面上的 HTML，就像 PHP。我对视图的观点已经演变。我能对 JavaScript\
  \ 视图最好的解释是，它是应用程序内部复用的 HTML 片。视图可能包含一些逻辑，但不多。视图背后的想法是任何 HTML 都不会在模型或控制器中。基于此，视图是封装在\
  \ JavaScript 对象中的 HTML 片，并在渲染之前对其进行修改。控制器将创建一个新视图并将相应的变量传递给构造函数。视图示例如下：\n\n```javascript\n\
  var view = function(name){\n  /**\n   * 创建根元素。这允许你使用 innerHTML\n   * 添加内容，这样你就不需要为大量的\
  \ HTML\n   * 块手动创建 DOM 元素\n   */\n  var _rootElement = document.createElement('div');\n\
  \n  /**\n   * 你可以在这里向根元素添加内容。如你所见，\n   * 不是拼接很长的字符串，而是使用数组。\n   * 这比长字符串更整洁、更易读。.join('')\
  \ 用于\n   * 将数组合并为没有空格的字符串。\n   */\n  _rootElement.innerHTML = [\n    '<p>Hello,\
  \ my name is ', name, '</p>'\n  ].join('');\n\n  this.render = function(){\n   \
  \ return _rootElement;\n  }\n}\n```\n\n如你所示，构造函数接受一个名为 `name` 的参数。你可以有任何数量的参数，然后在视图本身中使用它们。第二行创建一个元素并将其赋值给实例变量\
  \ `_rootElement`。这很有用，因为对于添加到根元素中的任何新元素，都不需要 DOM 解析器来遍历 DOM。\n\n\n\n\n\n`join('')`\
  \ 用于将数组合并为字符串，以便 `innerHTML` 接收它。\n\n视图中唯一的特权方法是 `this.render`，它简单地返回 `_rootElement`。你可以在之后添加方法，在视图实例化后对其进行操作。要获取完整的视图，你可以在控制器中对该对象运行\
  \ `render` 方法，它将返回一个 DOM 对象。\n\n需要注意的是，视图并不非要是完整的卡片才能在牌组（deck）中使用；它们也可以是嵌套在其他视图中的部分视图。\n\
  \n例如，在 MoMemo 中，有两种类型的电影列表：收藏电影和电影搜索结果。\n\n列表本身的呈现方式可能有所不同，但由于单个电影行是相同的，因此为每个电影列表项重复\
  \ HTML 是没有意义的。这就是在视图中使用视图大派用用场的地方。我们的控制器不需要知道如何渲染每种列表；由视图负责即可。\n\n# 第 8 章：JavaScript：模型、视图和控制器\n\
  \n我们可以利用原始 HTML 文件中使用的 HTML 来为我们创建视图。\n\nMoMemo 应用中有三个视图：`movielistitem`、`movielist`\
  \ 和 `movie`。我们接下来将讨论这些。\n\n## 电影列表项视图 (Movie List Item View)\n\n电影列表项视图非常简单。与其以后为不同的电影列表创建相同的电影列表项，不如在不同的电影列表中使用该视图，以避免为每个视图重写\
  \ POSH。\n\n在 `js/app/view` 内部创建一个名为 `movielistitem.js` 的新文件。（如果文件夹不存在，请创建它。）\n\n\
  向该文件添加以下代码。\n\n```javascript\nvar app = app || {};\n\napp.view = app.view || {};\n\
  \n/**\n* 为电影列表项创建一个新视图\n* @param {app.model.movie} movie\n*/\napp.view.movielistitem\
  \ = function(movie){\n  var _movie = movie,\n  _rootElement = document.createElement('li');\n\
  \  _rootElement.innerHTML = [\n    '<a data-controller=\"movies\" data-action=\"\
  find'\n    data-params=\"{&quot;id&quot;: &quot;', movie.getRtid() ,'&quot;}\"\n\
  \    class=\"more\" href=\"movie/view/\", movie.getRtid() ,'\">',\n    '<div class=\"\
  preview-image\">',\n    '<img src=\"', movie.getPosterframe(), '\" alt=\"',\n  \
  \  movie.getTitle(), '\" height=\"82\" />',\n    '</div>',\n    '<h2>', movie.getTitle(),\
  \ '</h2>',\n    '<p>', movie.getSynopsis(), '</p>',\n    '</a>'\n  ].join('');\n\
  \n  this.render = function(){\n    return _rootElement;\n  }\n}\n```\n\n你可以看到，它遵循与普通视图相同的标准结构。根元素是一个列表项\
  \ (`li`)），视图接受一个 `movie` 模型。在 POSH 的数组中，你可以看到使用数组值分隔符（逗号）来分隔电影访问器和 POSH 本身。这比使用连接字符串更易阅读和维护。在电影的链接中，你可以看到创建了各种数据属性。\n\
  \n```html\n<a data-controller=\"movies\" data-action=\"find\"\ndata-params=\"{&quot;id&quot;:\
  \ &quot;', movie.getRtid() ,'&quot;}\"\nclass=\"more\" href=\"movie/view/\", movie.getRtid()\
  \ ,'\"> 参数将用于应用程序的事件委托，以触发控制器事件/动作并将参数传递给它们。\n```\n\n代码的其余部分非常简单，创建一个列表项来存放电影的标题、简介和预览图/海报帧。\n\
  \n## 电影列表视图 (Movie List View)\n\n电影列表视图简单地用于包含各种电影的无序列表。\n\n在此应用程序中，电影列表视图一次用于收藏列表，一次用于搜索结果列表。这再次概述了使用视图的益处。如果你不创建此视图，你将需要在应用程序中的两个地方创建并维护相同的\
  \ POSH。\n\n在 `js/app/view/` 文件夹中创建一个名为 `movielist.js` 的新文件并添加以下代码。\n\n```javascript\n\
  var app = app || {};\n\napp.view = app.view || {};\n\n/**\n* 根据搜索结果创建新视图\n* @param\
  \ {Array} results\n*/\napp.view.movielist = function(results){\n  var _results =\
  \ results,\n  _rootElement;\n  // 创建根 UL 元素\n  _rootElement = document.createElement('ul');\n\
  \  _rootElement.classList.add('list');\n  _rootElement.classList.add('movie-list');\n\
  \n  for(var i = 0; i < results.length; i++){\n    var itemView = new app.view.movielistitem(results[i]);\n\
  \    _rootElement.appendChild(itemView.render());\n  }\n\n  this.render = function(){\n\
  \    return _rootElement;\n  }\n}\n```\n\n你可以看到，视图构造函数接受结果数组。此视图内没有对数组中的每个模型进行错误检查，但你可以使用验证器工具来强制执行。从代码中可以看出，根元素是一个无序列表。\n\
  \n```javascript\n_rootElement = document.createElement('ul');\n_rootElement.classList.add('list');\n\
  _rootElement.classList.add('movie-list');\n```\n\n从这里开始，稍后会添加几个类。然后你遍历数组中的每个模型并创建一个新的\
  \ `movielistitem`。\n\n```javascript\nfor(var i = 0; i < results.length; i++){\n\
  \  var itemView = new app.view.movielistitem(results[i]);\n  _rootElement.appendChild(itemView.render());\n\
  }\n```\n\n结果是一个填充了电影的无序列表。\n\n## 电影视图 (Movie View)\n\n电影视图在用户点击其收藏或搜索中的电影时，用于持有电影的完整视图。它比其他视图稍微复杂，因为它可以滚动以便用户获取更多关于电影的信息。这是一个大视图，我们将逐行分析。\n\
  \n首先，在 `js/app/view/movie.js` 中使用以下代码创建标准视图对象布局。\n\n```javascript\nvar app = app\
  \ || {};\n\napp.view = app.view || {};\n\n/**\n* 为电影列表项创建一个新视图\n* @param {app.model.movie}\
  \ movie\n*/\napp.view.movie = function(movie){\n  var _rootElement = document.createElement('div');\n\
  \  _rootElement.innerHTML = [].join('');\n\n  this.render = function(){\n    return\
  \ _rootElement;\n  }\n}\n```\n\n\n\n你可以看到，根元素是一个 `div`。应该创建的第一部分是电影视图的头部。它包含了海报帧、电影标题、从收藏中移除电影的按钮以及电影发布日期。然而，有一个限制，因为添加太多块和无限滚动会让用户感到很痛苦。\n\
  \n```javascript\n_rootElement.innerHTML = [\n'<header class=\"movie-header\">',\n\
  '<img src=\"' + movie.getPosterframe() + '\" alt=\"' + movie.getTitle() + '\" class=\"\
  poster\" width=\"100%\" />',\n'<hgroup class=\"movie-title\">',\n// ... 头部其余部分\n\
  // data-params=\\'{\"id\": \"' + movie.getRtid() + '\\', \"title\": \"' + escape(movie.getTitle())\
  \ + '\\', \"synopsis\": \"' + escape(movie.getSynopsis()) + '\\', \"posterframe\"\
  : \"' + movie.getPosterframe() + '\"}\\'\n// ...\n'</hgroup>',\n'</header>',\n].join('');\n\
  ```\n\n\n\n\n\n接下来要创建的是电影内容区块。这些区块包含了电影信息，例如简介、演员表和视频。\n\n```javascript\napp.view.movie\
  \ = function(movie){\n\n...\n\n_rootElement.innerHTML = [\n\n...\n\n'<div class=\"\
  movie-content\">',\n'<div class=\"block-container span-three\">',\n'<section class=\"\
  block\" id=\"block-synopsis\">',\n'<div class=\"content\">',\n'<p>', movie.getSynopsis()\
  \ ,'</p>',\n'</div>',\n'</section>',\n'<section class=\"block\" id=\"block-cast\"\
  >',\n'<div class=\"content\">',\n'<h3>Cast List</h3>',\n'<ul class=\"list\"></ul>',\n\
  '</div>',\n'</section>',\n'<section class=\"block\" id=\"block-video\">',\n'<div\
  \ class=\"content\">',\n'<h3>Video Clips</h3>',\n'<ul class=\"list grid\"></ul>',\n\
  '</div>',\n'</section>',\n'</div>',\n'</div>',\n].join(‘’);\n\n...\n}\n```\n\n这一部分的\
  \ POSH 非常简单；它只是输出电影的简介。演员表和视频片段保持为空，因为这些稍后会被填充数据。\n\n最后，你需要创建一个页脚导航按钮以返回收藏页面。\n\n\
  ```javascript\napp.view.movie = function(movie){\n\n...\n\n_rootElement.innerHTML\
  \ = [\n\n...\n\n'<footer class=\"footer screenbar\">',\n'<a class=\"back\" href=\"\
  /\" data-controller=\"favorites\" data-action=\"list\">my favorites</a>',\n'</footer>'\n\
  ].join('');\n\n...\n\n}\n```\n\n接下来的几行代码将检查电影是否在用户的收藏中。如果是，它将更改收藏按钮中的的状态、数据属性和文本。\n\
  \n```javascript\napp.view.movie = function(movie){\n\n...\n\n// 检查电影是否在用户的收藏中\n\n\
  if(movie.isFavorite()){\n\nvar _favoriteButton = _rootElement.querySelector('a.btn-favorite');\n\
  _favoriteButton.setAttribute('data-action', 'remove');\n_favoriteButton.classList.remove('add');\n\
  _favoriteButton.classList.add('remove');\n_favoriteButton.textContent = 'un-favorite';\n\
  \n}\n\n...\n\n}\n```\n\n最后但同样重要的是，你需要遍历电影中的所有演员，并将他们添加到演员表列表中。\n\n```javascript\n\
  app.view.movie = function(movie){\n\n...\n\nfor(var i = 0; i < movie.getActors().length;\
  \ i++){\n\nvar actor = movie.getActor(i);\nvar element = document.createElement('li');\n\
  element.innerHTML = [\n\n'<p>', actor.getName(), '<br />',\n'<em>', actor.getRole(),\
  \ '</em></p>'\n].join('');\n\n_rootElement.querySelector('#block-cast ul.list').appendChild(element);\n\
  \n}\n\n...\n\n}\n```\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n## 引导程序（Bootstrap）与控制器\n\
  \n与其他 MVC 框架不同，JavaScript 中的控制器并不非要分配给路由或 URI/URL。在本书中，控制器也可以分配给事件。控制器管理数据在应用程序中的流转，将这些信息传递给视图，然后负责使用\
  \ DOM 操作将其渲染回用户。控制器还负责处理用户事件。在我之前尝试为 JavaScript 创建 MVC 框架时，事件是在控制器之外处理的，这导致了代码变得混乱。常见事件（例如绑定到链接以触发控制器操作）应该在一个地方处理；然而，其他独特事件（例如表单事件）应该由控制器本身绑定。虽然有更高效的方法来实现此，但对于本书所开发的应用程序而言，这样做是有意义的。其他替代方案包括使用一个名为\
  \ `Sammy.js` 的库，它可以基于哈希锚（hashbangs，例如 `index.html#/mypage`）创建 RESTful URL。`Sammy`\
  \ 可以获取这些 URL 并根据路由规则执行 JavaScript。如果你想了解更多关于 `Sammy.js` 的信息，请访问 `http://sammyjs.org`。\n\
  \n控制器的构建非常简单；它只是一个带有特权方法的对象，这些方法作为事件动作。控制器可以与应用程序中的特定实体相关联。在 `MoMemo` 中，有一个控制器来管理电影，另一个控制器来管理你的收藏。\n\
  \n## 引导程序（Bootstrap）\n\n引导程序是一个大对象，因为它处理将链接事件委托给应用程序的不同部分。它负责初始化所有控制器，并成为从其他其他访问控制器的唯一入口。\n\
  \n首先在 `js/` 目录下创建一个名为 `bootstrap.js` 的新文件，并写入以下代码。\n\n```javascript\nvar app = app\
  \ || {};\napp.bootstrap = (function(){\n\n})();\n```\n\n首先声明一个名为 `_controller` 的实例变量。\n\
  \n```javascript\nvar app = app || {};\napp.bootstrap = (function(){\n\n/**\n* 创建控制器对象\n\
  * 你显式声明了电影和收藏\n* 控制器\n*/\nvar _controller = {\nmovies: null,\nfavorites: null\n\
  }\n})();\n```\n\n这将持有控制器对象。显式创建这是一个好主意，这样你就知道应用程序中应该存在哪些控制器。\n\n下一步是创建一个控制器。（注意：此处原文似乎有重复，但请遵循提供的逻辑）。\n\
  \n```javascript\nvar app = app || {};\napp.bootstrap = (function(){\n...\n```\n\n\
  当你触碰屏幕上的某个项目时，事件监听器并不一定返回你点击的链接；它更有可能返回链接内部的元素。为了实现这一点，你需要向上遍历 DOM 树。这将目标赋值为当前目标的父元素。\n\
  \n```javascript\ndocument.addEventListener(\"click\", function(event){\n\nvar target\
  \ = event.target;\n/**\n* 从目标向上遍历 DOM 树，直到\n* 找到包裹该目标的链接\n*/\nwhile(target.nodeName\
  \ !== \"A\" && target.getAttribute('data-controller')\n== null && target.getAttribute('data-action')\
  \ == null){\n\n// 我们到达了 body 元素，停止！\nif(target.parentNode.nodeName == 'HTML'){\n\
  \ntarget = null;\n\nbreak;\n}\n\n// 将 target.parentNode 赋值给 target 变量\ntarget =\
  \ target.parentNode;\n}\n});\n```\n\n如果你有一个 `target`，现在需要调用控制器的动作并将参数（如果有）传递给它。\n\
  \n```javascript\nvar app = app || {};\napp.bootstrap = (function(){\n...\nif(target){\n\
  \n/**\n* 你已经有了目标链接，所以现在阻止\n* 链接继续跳转是有意义的\n* 这将允许任何 JavaScript 静默失败！\n*/\nevent.preventDefault();\n\
  }\n})();\n```\n\n\n\n\n\n```javascript\n// 从元素中获取 controller、action 和 params\n\n\
  var controller = target.getAttribute('data-controller'),\n\naction = target.getAttribute('data-action'),\n\
  \nparams = target.getAttribute('data-params');\n\n}\n\n...\n\n})();\n```\n\n随后，你需要验证\
  \ `controller` 和 `action` 是否存在。检查 `controller` 是否存在于 `_controller` 实例变量中，以及 `action`\
  \ 是否存在 `controller` 内部，如下面的条件语句所示。\n\n```javascript\nvar app = app || {};\n\napp.bootstrap\
  \ = (function(){\n\n...\n\n/**\n* 如果存在 target，则处理链接动作\n*/\nif(target){\n\n...\n\n\
  /*\n* 检查 controller 是否存在\n* bootstrap 中，以及 action 是否可用\n*/\nif(typeof _controller[controller]\
  \ === 'undefined'\n|| typeof _controller[controller][action] === 'undefined'){\n\
  \n// 如果它们不存在，则抛出异常\nthrow \"Action \" + action + \" for controller \" + controller\
  \ + \" doesn't appear to exist\";\n\nreturn;\n\n}\n}\n...\n\n})();\n```\n\n你可以像访问数组一样访问对象中的属性。不同之处不是传递索引，而是传递字符串或变量。例如：\n\
  \n`_controller[\"movie\"][\"show\"]`\n\n等同于调用\n\n`_controller.movie.show`\n\n只不过你现在可以在第一个示例的括号中使用变量来执行调用。\n\
  \n传递给 controller action 的参数需要从字符串转换为 JSON 对象。你可以使用 `JSON.parse()` 方法来实现这一点，如下面的代码所示。\n\
  \n```javascript\nvar app = app || {};\n\napp.bootstrap = (function(){\n\n...\n\n\
  /**\n* 如果存在 target，则处理链接动作\n*/\nif(target){\n\n...\n\n// 检查 params 是否存在\nif(params){\n\
  try {\n// 如果存在，则将其解析为 JSON\nparams = JSON.parse(params);\n\n} catch (e) {\n\n/*\n\
  * 如果发生解析异常，则将\n* params 设置为 null\n*/\nparams = null;\nreturn;\n}\n\n}\n}\n...\n\n\
  })();\n```\n\n如果 JSON 验证失败，`JSON.parse` 将抛出异常。你需要捕获此异常并将 `params` 设置为 null。\n\n\
  最后要做的是执行 controller action。\n\n```javascript\napp.bootstrap = (function(){\n\n...\n\
  \n/**\n* 如果存在 target，则处理链接动作\n*/\nif(target){\n\n...\n\n/**\n* 在 target 的上下文中执行\
  \ controller。\n* 这允许你从 controller action 访问\n* 原始元素。同时从 data-params\n* 属性中传递参数。\n\
  */\n_controller[controller][action].call(target, params);\n\n}\n\n...\n\n})();\n\
  ```\n\n由于应用程序使用了 `localStorage` 来存储电影收藏，你需要初始化本地存储变量。\n\n```javascript\napp.bootstrap\
  \ = (function(){\n\n...\n\n/**\n* 通过检查 favorites 节点是否存在\n* 来设置本地存储\n*/\nif(!localStorage.getItem('favorites')){\n\
  // 如果不存在，创建一个空数组并将其赋值给存储\nvar favorites = [];\nlocalStorage.favorites = JSON.stringify(favorites);\n\
  }\n})();\n```\n\n如前所述，你需要创建方法来访问这些 并初始化它们。\n\n`getController` 方法接受一个字符串参数，代表带有命名空间的\
  \ controller 名称。它将使用点（.）将字符串拆分成多个部分，然后遍历这些命名空间，逐步将其构建成对象。\n\n```javascript\napp.bootstrap\
  \ = (function(){\n\n...\n\nreturn {\n\n/**\n* 为 controller 创建一个访问器，\n* 它接受 controller\
  \ 命名空间的\n* 字符串表示\n*/\ngetController: function(name){\n/**\n* 使用 . 字符将字符串拆分成数组\n\
  */\nvar parts = name.split('.');\n/**\n* 最初将返回的 controller 设置为 null\n*/\nvar returnController\
  \ = null;\n\n/**\n* 如果部分数量大于 0\n*/\nif(parts.length > 0){\n/**\n* 将返回 controller\
  \ 设置为父对象\n*/\nreturnController = _controller;\n\n/**\n* 遍历每个部分，逐渐将 action\n* 赋值给\
  \ return controller\n*/\nfor(var i = 0; i < parts.length; i++){\nreturnController\
  \ = returnController[parts[i]];\n}\n}\n\n/**\n* 返回 controller\n*/\nreturn returnController;\n\
  },\n\n/**\n* 初始化所有的 controller。你可能不想\n* 自动这样做，因此可以使用 `initScripts` 方法来执行它。\n*/\n\
  initScripts: function(){\n_controller.movies = new app.controller.movies();\n_controller.favorites\
  \ = new app.controller.favorites();\n_controller.favorites.list();\n}\n}\n\n})();\n\
  ```\n\n\n\n\n\n```javascript\nreturnController = _controller;\n\n/**\n* 遍历每个部分，逐渐将操作分配给\n\
  * 返回控制器\n*/\nfor(var i = 0; i < parts.length; i++){\n  returnController = returnController[parts[i]];\n\
  }\n}\n```\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n```javascript\n/**\n* 返回控制器\n*/\nreturn\
  \ returnController;\n\n},\n\n/**\n* 初始化所有控制器。你可能不想自动执行\n* 这一点，因此你可以使用 initScripts\
  \ 方法执行它。\n*/\ninitScripts: function(){\n  _controller.movies = new app.controller.movies();\n\
  \  _controller.favorites = new app.controller.favorites();\n  _controller.favorites.list();\n\
  }\n}\n\n})();\n```\n\n## 电影控制器 (The Movies Controller)\n\n电影控制器相当复杂，因为它处理了通过 Rotten\
  \ Tomatoes API 搜索电影，并在用户输入字符时通过 JSONP 提供结果列表的功能。\n\n首先，在 `js/app/controller` 目录下创建一个名为\
  \ `movies.js` 的新控制器，并包含以下代码。\n\n```javascript\nvar app = app || {};\napp.controller\
  \ = app.controller || {};\napp.controller.movies = function(){\n  this.init = function(){}\n\
  \  this.init();\n}\n```\n\n所有控制器都包含一个 `init` 方法，该方法在对象结束时执行。你希望声明几个实例变量。\n\n- `_searchfield`-----包含搜索字段的\
  \ DOM 元素\n- `_searchform`-----包含搜索表单的 DOM 元素\n- `_searchresultcard`----包含搜索结果卡片的\
  \ DOM 元素\n- `_searchTimeout`----包含搜索超时计时器\n- `_viewScrolls`-----包含视图的 iScroll 对象\n\
  - `_searchScroll`----包含搜索结果的 iScroll 对象\n\n使用以下代码声明这些实例变量。\n\n```javascript\nvar\
  \ app = app || {};\napp.controller = app.controller || {};\napp.controller.movies\
  \ = function(){\n  var _self = this,\n  _searchfield = document.querySelector('#add-movie\
  \ input[name=\"query\"]'), _searchform = document.getElementById('add-movie'),\n\
  \  _searchresultscard = document.getElementById('card-movie_search_results'),\n\
  \  _searchTimeout,\n  _viewScrolls = [],\n  _searchScroll = null;\n  this.init =\
  \ function(){}\n  this.init();\n}\n```\n\n## 绑定搜索表单 (Binding the Search Form)\n\n\
  你将创建第一个方法是将事件监听器绑定到搜索表单。\n\n```javascript\nvar app = app || {};\napp.controller\
  \ = app.controller || {};\napp.controller.movies = function(){\n  ...\n  /**\n \
  \ * 绑定搜索表单\n  */\n  this.bindSearchForm = function(){\n  }\n  ...\n}\n```\n\n当用户聚焦于搜索字段时，如果文本框中有搜索查询内容，你将希望使用\
  \ deck 工具类向用户显示当前结果。\n\n```javascript\nvar app = app || {};\napp.controller = app.controller\
  \ || {};\napp.controller.movies = function(){\n  ...\n  /**\n  * 绑定搜索表单\n  */\n\
  \  this.bindSearchForm = function(){\n    /**\n    * 在这里你使用 focus 事件监听器为搜索字段\n \
  \   * 添加事件监听器。如果有值，则显示\n    * 结果。\n    */\n    _searchfield.addEventListener('focus',\
  \ function(){\n      if(this.value.length > 0){\n        app.utility.deck.showCard('card-movie_search_results');\n\
  \      }\n    });\n  }\n  ...\n}\n```\n\n你下一个需要绑定的事件是表单提交。这是为了防止用户意外按下 Android 键盘上的完成按钮并通过浏览器提交表单。相反，将执行搜索，且应用程序将不再等待输入超时。\n\
  \n```javascript\nvar app = app || {};\napp.controller = app.controller || {};\n\
  app.controller.movies = function(){\n  ...\n  /**\n  * 为表单的提交添加事件监听器。\n  * 这将防止表单被提交\n\
  \  * 并发送到另一个页面。相反，我们捕获\n  * 事件并触发搜索操作。\n  */\n  _searchform.addEventListener('submit',\
  \ function(e){\n    e.preventDefault();\n    // 清除 _searchTimeout 超时\n    clearTimeout(_searchTimeout);\n\
  \    var value = _searchfield.value;\n    if(value.length > 0){\n      _self.search(value);\n\
  \    }\n  });\n  ...\n}\n```\n\n最后，你将需要为实际输入字段绑定一个事件。这将从字段中获取值，清除搜索超时（如果已设置），检查值字符串的长度是否大于零，然后设置一个超时来执行搜索。\n\
  \n```javascript\nvar app = app || {};\napp.controller = app.controller || {};\n\
  app.controller.movies = function(){\n  ...\n  _searchfield.addEventListener('input',\
  \ function(){\n    /**\n    * 这是输入字段的值\n    */\n    var value = this.value;\n  \
  \  /**\n    * 这将清除搜索超时\n    */\n    clearTimeout(_searchTimeout);\n    /**\n   \
  \ * 你不希望在每次按键后\n    * 立即运行搜索。这将设置一个 1 秒的超时\n    * 在调用搜索函数之前。\n    */\n    if(value.length\
  \ > 0){\n      document.getElementById('taskbar').classList.add('searchactive');\n\
  \    } else {\n      document.getElementById('taskbar').classList.remove('searchactive');\n\
  \    }\n    _searchTimeout = setTimeout(function(){\n      _self.search(value);\n\
  \    }, 1000);\n  });\n  ...\n}\n```\n\n在输入字段上设置超时是为了防止用户每输入一个字母就发送请求，通过设置一秒的计时器可以避免在短时间内产生大量请求。bindSearchForm\
  \ 方法的完整代码如下所示：\n\n```javascript\n/**\n* 绑定搜索表单\n*/\nthis.bindSearchForm = function(){\n\
  \  /**\n  * 在这里你使用 focus 事件监听器为搜索字段\n  * 添加事件监听器。如果有值，则显示\n  * 结果。\n  */\n  _searchfield.addEventListener('focus',\
  \ function(){\n    if(this.value.length > 0){\n      app.utility.deck.showCard('card-movie_search_results');\n\
  \    }\n  });\n  /**\n  * 为表单的提交添加事件监听器。\n  * 这将防止表单被提交\n  * 并发送到另一个页面。相反，我们捕获\n\
  \  * 事件并触发搜索操作。\n  */\n  _searchform.addEventListener('submit', function(e){\n \
  \   e.preventDefault();\n    // 清除 _searchTimeout 超时\n    clearTimeout(_searchTimeout);\n\
