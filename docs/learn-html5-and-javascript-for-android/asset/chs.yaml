  \n压缩（minification）是指尽可能从代码中移除空白和注释的过程。这听起来很愚蠢，但这些额外的数据可能占你 JavaScript 文件大小很大比例。\n\
  \n# 第 8 章：JavaScript：模型、视图与控制器\n\n在 Aptana 中右键点击 `app.dev.js` 文件并选择 `Properties`（属性）来查看其大小。它大约是\
  \ 54,000 字节，即约 53KB。你可以通过运行压缩脚本来进一步减小生产环境的文件大小。\n\n与合并（concatenation）一样，你也可以在服务器端或使用\
  \ `YUI compressor` 自动压缩你的 JavaScript。对于书中的示例，你将使用位于 `http://jscompress.com/` 的在线\
  \ JavaScript 压缩工具。\n\n在 `js/` 文件夹内创建一个名为 `app.min.js` 的新文件。这将包含你生产环境所需的压缩代码。从 `app.dev.js`\
  \ 复制代码并粘贴到 `http://jscompress.com/` 上名为 `Javascript Code Input` 的文本框中，然后点击 `Compress\
  \ Javascript` 按钮。\n\n复制压缩后的输出并粘贴到 `app.min.js`。保存文件，然后在应用资源管理器中右键点击它并选择 `Properties`。你应该看到文件大小大幅缩小，从约\
  \ 54,000 字节减少到约 24,318 字节。文件大小缩减了大约一半。\n\n你还可以利用 `SASS` 的 `--style compress` 选项来压缩\
  \ CSS 文件。要这样做，从应用程序文件夹打开终端并输入以下命令：\n\n```bash\nsass ./css/*.scss ./css/mobile.min.css\
  \ --style compress\n```\n\n这将将 CSS 文件的压缩版本输出到 CSS 目录。要使用它，将 `index.html` `head`\
  \ 部分 CSS 样式表的 `href` 从 `mobile.css` 改为 `mobile.min.css`。你的新 `head` 现在应该看起来像下面的代码：\n\
  \n```html\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"\
  width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0; target-densitydpi=device-dpi;\"\
  />\n  <title>Mo Memo</title>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"\
  css/mobile.min.css\" />\n  <link href='http://fonts.googleapis.com/css?family=Arimo'\
  \ rel='stylesheet' type='text/css'>\n  <link rel=\"apple-touch-icon-precomposed\"\
  \ href=\"img/home-screen-icon.png\">\n</head>\n```\n\n## 缓存 (Caching)\n\n所有的文件保存技术对于减少应用程序每次页面加载占用的带宽都是完美的。现在，如果用户只需对那些偶尔变化一次的发送请求，那不是完美吗？你可以通过缓存清单（cache\
  \ manifest）来实现这一点。\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n我们在第 4 章中简要提到过这一点。缓存很有用，但当你需要清理它时也会很头疼。坦率地说，应用程序缓存有一个\
  \ JavaScript `API` 允许你动态清理它。\n\n你不仅可以缓存来自 Web 应用程序的文件，还可以缓存从外部网站引用的文件，例如用户的收藏电影图片。但请注意，在某些设备上，应用程序的缓存可能会受到限制。\n\
  \n打开你在第 4 章创建的 `momemo.cache` 文件。我们知道应用程序文件（如图像、JavaScript 文件和 CSS）需要缓存，因此更新 `momemo.cache`\
  \ 以使得以下文件被缓存：\n\n- `index.html`\n- `css/mobile.min.css`\n- `js/app.min.css`\n- `img/`\n\
  \n你的清单文件现在应该看起来像下面的代码：\n\n```text\nCACHE MANIFEST\n# 我们将使这些文件可缓存\nCACHE:\nindex.html\n\
  css/mobile.min.css\njs/app.min.js\nimg/highres/momemo.png\nimg/lowres/momemo.png\n\
  img/back.png\nimg/clear.png\nimg/loading.gif\nimg/search.png\n```\n\n你可以看到，每个需要缓存的文件都已显式地指定了。遗憾的是，你不能使用通配符，因为浏览器缓存会在页面加载之前缓存清单文件中的所有文件。它不知道你的服务器上存在哪些文件，所以使用通配符\
  \ `*` 将没有任何效果。\n\n我们缓存的是压缩后的 CSS 和 JS 文件，而不是未压缩的 JavaScript 和 CSS 文件。这可以防止在开发需要更改文件时感到沮丧，这样你就不需要手动更改清单文件来引入更改的文件。\n\
  \n通过缓存清单，你还可以指定哪些文件需要网络连接。我们绝对希望 Rotten Tomatoes 的 `API` 拥有最新数据。\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\
  \n要做到这一点，你必须在清单文件的 `NETWORK` 定义下放置文件的 URL 或位置。你的清单文件应该像下面所示：\n\n```text\nCACHE MANIFEST\n\
  # 我们将使这些文件可缓存\nCACHE:\nindex.html\ncss/mobile.min.css\njs/app.min.js\nimg/highres/momemo.png\n\
  img/lowres/momemo.png\nimg/back.png\nimg/clear.png\nimg/loading.gif\nimg/search.png\n\
  \n# 这些文件需要网络连接\nNETWORK:\nhttp://api.rottentatoes.com/\n```\n\n\n\n\n\n你甚至可以打开 JavaScript\
  \ 控制台并输入 JavaScript 代码，这些代码会直接影响手机上的页面，如图 8-11 和 8-12 所示。\n\n![Image 117](img/index-316_1.jpg)\n\
  ![Image 118](img/index-316_2.jpg)\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n**图 8-11.**\
  \ JavaScript 控制台\n\n**图 8-12.** Chrome 警框\n\n这是一个非常棒的工具。如果你想进行快速调试或快速测试 CSS 的更改，直接在浏览器中进行调整要比不断保存并重新加载你的移动\
  \ Web 应用要快得多。\n\n**注意：** 由于 Android 版 Chrome 仍处于 beta 阶段，你最终使用的调试方法可能会发生变化。要获取最新的指令，请访问\
  \ `https://developers.google.com/chrome/mobile/docs/debugging`。\n\n## 总结\n\n这一章深入探讨了在过程化语言世界之外，你使用\
  \ JavaScript 能够实现什么。\n\n现在你应该已经掌握了 MVC 以及如何使用它来提供一个坚固的框架进行工作。记住其背后的原理非常重要，因为这将帮助你进一步理解其他的\
  \ JavaScript 框架和设计模式，这些模式可以让你的生活变得简单得多。\n\n本章还带你介绍了如何将代码分组在工具对象中以减少代码重复。\n\n你还应该对\
  \ JavaScript 对象和作用域有更深入的理解，以及如何利用这些优势。\n\n# 第 9 章：测试与部署\n\n## 你的移动 Web 应用\n\n信不由，这是开发周期中最重要但也容易被忽视的方面之一。\n\
  \n最基本的测试和部署方法是使用 `FTP`（文件传输协议）客户端将你的移动 Web 应用上传到公开的 Web 服务器。通常情况下，你会在手机的 Web 浏览器中测试上传的应用，通过操作它来确保一切都运行正常。\n\
  \n如果出现任何问题，你就在本地机器上进行修改，进行测试，然后重新上传更改后的文件。\n\n这对于小型应用程序和极小团队有效；然而，随着你的应用程序和开发团队的扩大，彻底测试每个功能方面以及跟踪代码更改将变得非常耗时。\n\
  \n自然的“快速修复”演进方案是开始使用文件共享软件或服务，如 `AFP`（Apple 文件共享协议）、`Samba` 或 `Dropbox`，来管理小组代码并在开发团队之间共享项目。这最终会变得非常繁琐，因为熟悉这种技术的人都知道——文件冲突并不罕见，而且解决它们极其困难且费力。此外，没有代码所有权或归责机制。如果一个开发者破坏了某个功能，没有人可以指责，且代码修复或回滚需要更长的时间。\n\
  \n持续集成原理有助于解决这个问题。持续集成包含了用于团队内代码管理的 `SCM`（版本控制管理）、自动化测试、环境测试和自动化部署。\n\n这些原则中的某些可能看起来很陌生，但本章将进行全面介绍。没有任何项目或开发团队是大到或小到无法利用持续集成。\n\
  \n本章首先解释这些持续集成元素各是什么。然后你将得到一个实操练习，向你展示如何创建单元测试、与 `SCM` 系统 `Git` 工作，最后使用 `Capistrano`\
  \ 将你的应用程序部署到生产服务器。\n\n## 版本控制管理\n\n版本控制管理是持续集成的核心。到目前，有多种 `SCM` 实现，包括以下：\n\n* `Git`\n\
  * `SVN` (Apache Subversion)\n* `Mercurial`\n\n`SCM` 提供了一种存储源文件版本的方法。`SCM` 通过在初始提交/保存时存储原始文件来实现。随后，`SCM`\
  \ 仅存储后续提交中每个文件之间的更改/差异。这节省了磁盘空间和带宽，因为除非文件是新的，否则不需要每次提交都保存整个文件。\n\n当你使用 `SCM` 存储项目时，它们仍然可以从电脑访问，就像任何其他文件一样。区别在于，对于基于\
  \ `SCM` 项目，你可以提交任何文件更改（包括图像、视频等），以便它们可以进行版本化，并在需要时回滚或对比。\n\n要使用 `SCM` 提交更改，你需要一个\
  \ `SCM` 客户端，如 `Git` 或 `SVN`。`SCM` 系统通常还会作为项目的一部分存储额外文件。\n\n在使用过 `Git` 和 `SVN` 后，`Git`\
  \ 是我首选的 `SCM`，因为它只在根目录下存储单一的 `.git` 文件夹，可以轻松删除；相比之下，`SVN` 会在项目的每个文件夹中存储 `.svn` 文件夹，删除它们可能变得非常痛苦。\n\
  \n目前有两种类型的 `SCM`：集中式和分布式。集中式系统将所有代码存储在中央服务器上。当开发者进行提交时，更改在服务器上合并，而不是在开发机器上。`SVN`\
  \ 是一个集中式 `SCM` 系统。分布式系统没有中央服务器。提交可以在任何开发者的机器上进行。如果开发者想共享他的代码，另一个开发者可以将其仓库克隆到自己的机器上。\n\
  \n`Git` 是一个分布式 `SCM` 系统。通常，`Git` 仓库有一个主远程仓库，所有开发者都在那里推送和拉取更改。像 Git 等系统的优势是，你可以在没有网络的情况下进行项目，但仍然向本地仓库提交更改。一旦有了网络，你就可以拉取并合并任何更改，进行测试，然后将更改推送到远程仓库。这对于你有中央构建系统非常有帮助。\n\
  \n`SCM` 还允许为每次提交存储注释，这样当你查看项目提交历史时，可以看到谁对哪些文件进行了更改以及每次提交的原因。`Git` 等 `SCM` 系统默认要求提交注释，而\
  \ `SVN` 则不然。`Git` 在开发社区非常受欢迎，这就是为什么它是本章的重点。\n\n### 分支与标签\n\n大多数 `SCM` 系统遵循分支和标签的方法。`Git`\
  \ 中的 master 分支是主代码；它通常总是生产就绪的并包含了项目代码的最新版本。当需要添加新功能时，通常从主分支创建一个分支。这些分支通常有代名；有些开发团队使用流行动画片的名称（如\
  \ Peter、Meg 或 Stewie），另一些则使用行星名称（如 Saturn、Jupiter 或 Mars）。你可以使用任何你喜欢的命名规范，只要每个分支都有唯一的名称。重要的是你在创建分支时做的注释。必须清楚该分支的用途以及它应该包含的内容。\n\
  \n分支只是主分支的一个副本或快照，这样新功能就不会干扰生产就绪的代码。通常，主分支会定期合并到新分支。这样做是为了确保主库的更改与分支中的功能更改兼容。当新分支中的功能实现并测试后，它将合并到主分支，准备投入生产。\n\
  \n\n\n\n\n一个 `tag` 简单来说是你项目主分支的一个重要快照，你将其保留以备将来参考。这些通常是你的项目的重大版本。如果其他开发者不断在主分支上工作，而你又想进行一次可行的部署，这就会非常有用。\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n## 测试\n\n测试移动 Web 应用是新 Web 开发者开发中最容易被忽视的方面之一。大多数新的移动\
  \ Web 开发者简单地在移动设备上加载网站，然后通过操作来查看它是否正常工作。随着你添加更多功能，这可能会变得非常费力，而且你并不知道代码内部到底发生了什么。当你开始编写更多的面向对象代码时，你会看到应用程序的复杂性在增加（以一种组织的方式）。你可以根据输入的内容和预期的输出，对每个代码单元进行测试。\n\
  \n例如，在之前的章节中，你接触了创建模型来在应用程序中存储数据。你展示的完整性和应用程序背后的逻辑实际上取决于这些模型如何通过 `getters`、`setters`\
  \ 以及其他基于模型的方法接收和输出数据。你可以围绕每个代码单元，根据输入和预期的返回结果编写测试套件。这种测试方法被称为 `unit testing`（单元测试）。`Unit\
  \ testing` 允许你测试应用程序中的每个方法。你为项目的每个方面编写的单元测试越多，你就越应该相信应用程序将会正常工作。这被称为 `code coverage`（代码覆盖率）。请记住，单元测试只会覆盖你代码的一定比例，你的目标应该是至少达到\
  \ 80% 的 `code coverage`。\n\n通过创建单元测试，你可以一次性运行一系列测试，针对每一个目标 浏览器。这应该让你有信心你的代码正按预期工作。当发布新浏览器或新浏览器版本时，这特别有帮助，因为你可以通过在其中运行单元测试来确保你的\
  \ `JavaScript` 代码与新浏览器兼容。\n\n## 部署你的应用程序\n\n你的应用程序可以通过多种方式部署。最常见的方法是通过 `FTP`（文件传输协议）或\
  \ `SFTP`（安全文件传输协议）进行部署。通常情况下，你会拥有一个存放生产代码的生产服务器、一个测试最新集成代码的开发服务器，以及一个本地开发服务器。你可能还想创建其他环境，例如预生产服务器（它将模拟生产服务器的完全配置），你可能还想创建一个\
  \ `staging server`（阶段服务器），让客户或测试人员在最终代码投入生产之前进行测试。\n\n管理所有这些环境及其代码库可能会出现问题，每次提交时手动向多个环境部署代码更改可能会变得费力且容易出现人为错误。你可能还必须为每个环境执行任务，例如\
  \ `CSS` 预编译、`JavaScript` 和 `CSS` 压缩和合并等。\n\n你可以将此中的许多工作交给部署应用程序，例如 `Capistrano`。`Capistrano`\
  \ 允许你为每个环境编写部署脚本，并通过单个命令将应用程序部署到任何环境。`Capistrano` 还允许你将任何更改回滚到之前的可用版本，就像每次部署一样，`Capistrano`\
  \ 会存储每个版本的副本，以便你随时回滚。\n\n## 持续集成服务器\n\n将所有这些应用程序和实践结合在一起的胶水是良好的持续集成环境。持续集成环境会检测应用程序代码的变化，并自动构建和部署它，同时执行其他任务。这意味着你可以专注于生产世界级的\
  \ Web 应用程序并将重复性的部署和测试任务留给持续集成服务器。\n\n本书选择的持续集成服务器是 Atlassian 的 `Bamboo`。选择此产品是因为它易于安装、拥有许多插件、设置简单，并且与\
  \ Atlassian 其他流行的软件开发工具兼容，如 `JIRA`、`Crucible` 和 `FishEye`。\n\n## 你的第一个持续集成项目\n\n\
  第一次创建持续集成项目可能会相当费力。你首先将在 `Aptana Studio 3` 中创建一个新项目。要这样做，打开 `Aptana Studio` 并进入\
  \ `File ➤ New ➤ Web Project`。将项目命名为 `ci`。\n\n在项目内创建一个名为 `js` 的文件夹。在该内部创建两个名为 `app`\
  \ 和 `tests` 的文件夹。在 `app` 文件夹中，通过 `File ➤ New ➤ File` 创建一个名为 `calculator.js` 的空 JavaScript\
  \ 文件。你现在不需要向其添加任何内容。`TDD`（测试驱动开发）规定你必须先编写单元测试，以便它们在你编写代码之前先失败。这意味着你所有的预期结果都写在测试中，以便你的代码在编写时能够满足这些结果。这是一个良好的习惯。当你在单元测试中编写逻辑规则时，你如何实现最终代码并不重要，只要输出满足单元测试即可。\n\
  \n这种工作方法确实有助于你编写出更整洁的代码，因为你的代码现在是为了满足预期输出而编写的。\n\n## 编写你的第一个单元测试\n\n你可以选择编写自己的单元测试框架，也可以使用现成的框架。本书选择的是\
  \ `QUnit`。它由 `jQuery` 社区开发并有定期更新。不仅如此，它还可以从浏览器中运行，或者可选地使用名为 `PhantomJS` 的程序从命令行运行。\n\
  \n为 `calculator` 设置 `QUnit` 单元测试，首先在 `tests` 中创建一个名为 `calculator.html` 的新文件，包含以下\
  \ HTML：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-type\"\
  \ content=\"text/html; charset=utf-8\"/>\n<title>calculator unit tests</title>\n\
  <meta name=\"viewport\" content=\"width=device-width; initial-scale=1.0; maximum-scale=1.0;\
  \ user-scalable=0; target-densitydpi=device-dpi;\"/>\n<!-- Include the latest QUnit\
  \ JavaScript file -->\n<script src=\"http://code.jquery.com/qunit/qunit-git.js\"\
  ></script>\n<!-- Include calculator JavaScript file -->\n<script src=\"../app/calculator.js\"\
  ></script>\n<!-- Include the latest QUnit CSS file -->\n<link href=\"http://code.jquery.com/qunit/qunit-git.css\"\
  \ rel=\"stylesheet\" type=\"text/css\" />\n</head>\n<body>\n<h1 id=\"qunit-header\"\
  >calculator unit tests</h1>\n<h2 id=\"qunit-banner\"></h2>\n<div id=\"qunit-testrunner-toolbar\"\
  ></div>\n<h2 id=\"qunit-userAgent\"></h2>\n<ol id=\"qunit-tests\"></ol>\n<div id=\"\
  qunit-fixture\"><!-- If you have any DOM that needs to be manipulated as part of\
  \ any test, this is where it should go --></div>\n</body>\n</html>\n```\n\n这段代码代表了运行基础空单元测试所需的\
  \ HTML。如你所见，它不包含任何移动端标记。在 `body` 标签内，你可以看到带有 ID 的 HTML 元素。这些元素在表 9-1 中描述。\n\n表 9-1.\
  \ *HTML 测试元素*\n\n| 元素 | 描述 |\n| :--- | :--- |\n| qunit-header | 测试套件的标题或标题 |\n|\
  \ qunit-banner | 根据单元测试的状态改变颜色（绿色表示通过，红色表示失败） |\n| qunit-testrunner-toolbar | 包含允许显示或隐藏测试的控件\
  \ |\n| qunit-userAgent | 显示当前测试的浏览器信息 |\n| qunit-tests | 在运行后包含通过或失败的测试列表 |\n| qunit-fixture\
  \ | 如果在任何测试中需要操作 DOM，则使用此元素 |\n\n\n\n\n\n你需要在移动网络浏览器中运行测试。为了实现这一点，必须先配置 Aptana，使其内部服务器绑定到计算机的\
  \ IP 地址，而不是其本地 IP 地址 `127.0.0.1`。执行此操作，请前往 Aptana Studio 3 ➤ `Preferences` ➤ `Aptana\
  \ Studio` ➤ `Web Servers` ➤ `Built-in`。你将看到一个屏幕和一个下拉菜单，允许你选择内部 Web 服务器应该绑定的 IP 地址，如图\
  \ 9-1 所示。\n\n![Image 119](img/index-325_1.jpg)\n\n![Image 120](img/index-325_2.jpg)\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n324\n\n**图 9-1.** 内置服务器偏好\n\n选择与你的计算机 IP 地址匹配的一个（通常是顶部的），点击\
  \ `OK`，退出 Aptana Studio 并重新启动，使更改生效。\n\n在 Aptana 启动完成后，你可以通过右键点击 Aptana Studio App\
  \ 资源管理器中的 `calculator.html` 并选择 `Run As` ➤ `JavaScript Web Application` 在 浏览器中运行该应用程序。这将启动\
  \ Firefox。将 Firefox 地址栏中的 URL 输入到你移动设备的默认浏览器中。你应该能看到标题栏下方的条是绿色的，并且运行了 0/0 个测试，如图\
  \ 9-2 所示。现在是时候开始编写单元测试了。\n\n**图 9-2.** 在浏览器中运行 QUnit 测试\n\n# 第 9 章：测试和部署你的移动 Web\
  \ 应用\n\n325\n\n如果 `calculator.html`尚未打开，请在 Aptana Studio 中打开它。单元测试简单地运行几个断言，检查方法或属性的输出值是否与基于可预测输入的预期值。本章中的计算器示例非常简单，因为很容易预测出\
  \ `1+1` 应该始终等于 `2`。没有额外的变量会影响预期结果，因此 `2` 应该始终是预期结果。当结果不是 `2` 时，你就知道应用程序在某处出了问题。\n\
  \n在 `calculator.html` 中，在闭合的 `body` 标签之前创建一个新的 `script` 标签。\n\n```html\n<div id=\"\
  qunit-fixture\"><!-- 如果你有需要操作的 DOM，应该将其放在这里 --></div>\n\n<!-- 这是你新的 script 标签 -->\n\
  \n<script>\n\n</script>\n\n</body>\n\n</html>\n```\n\n在 `script` 标签内，你可以开始编写第一组单元测试。虽然计算器代码还没有编写，但你已经开始通过单元测试规定代码中应该存在哪些方法和属性，以及它们应该如何行为。一个基础计算器应该执行以下操作：\n\
  \n* 加法\n* 减法\n* 除法\n* 乘法\n\n计算器通常会取一个初始值来执行这些方法，并在每个方法上返回一个结果。你还能够清除计算器。基于此基础，应该实现以下方法：\n\
  \n* `add`\n* `subtract`\n* `divide`\n* `multiply`\n* `clear`\n* `getResult`\n\n\
  然后你可以将对应用程序的这些描述转换为单元测试。\n\n# 第 9 章：测试和部署你的移动 Web 应用\n\n326\n\n因此，为了创建相应的单元测试，请在你的\
  \ `<script />` 标签内结束以下代码和注释，作为关于构造函数的第一个单元测试。\n\n```javascript\ntest('calculator\
  \ constructor', function(){\n\n/**\n* 指定此测试将运行多少个断言\n* 如果断言由于任何原因未运行，\n* 此测试将失败\n\
  */\nexpect(1);\n\n/**\n* 你创建一个新的计算器实例并设置\n* 初始值为 10\n*/\nvar calculator = new app.calculator(10);\n\
  \n/**\n* 然后你断言 10 被保留为\n* 当前结果\n*/\nequal(calculator.getResult(), 10, 'the result\
  \ should equal 10 with no\noperation');\n});\n```\n\n如你所见，测试方法是 `QUnit` 的一部分，接受一个描述和一个回调函数。当测试执行时，会调用回调函数并执行测试。在测试内部，你可以看到几个方法。`expect()`\
  \ 指定了测试内将运行多少个断言。你还实例化了 `calculator` 类，以便在测试中使用它。每个测试按创建创建的变量都会被销毁，且不能在另一个测试中使用。然而，它们可以在测试内的任何断言中使用。最后，`equal()`\
  \ 是一个断言。断言简单地接收一个结果并检查产生或返回的值是否与预期值匹配。在此例中，`equal` 断言检查新计算器是否以 10 作为初始结果。\n\n单元测试就此结束。有多种断言可用。请参表\
  \ 9-2 的重要断言列表。\n\n# 第 9 章：测试和部署你的移动 Web 应用\n\n327\n\n**表 9-2.** QUnit 断言\n\n| 断言描述\
  \ | 描述 |\n| :--- | :--- |\n| `ok( *state*, *message*)` | 检查一个值 (`state`) 是否为真；如果为真，则断言通过。\
  \ |\n| `equal( *actual*, *expected*, *message*)` | 检查实际值是否等于预期值。 |\n| `notEqual(\
  \ *actual*, *expected*, *message*)` | 检查实际值是否不等于预期值。 |\n| `deepEqual( *actual*,\
  \ *expected*, *message*)` | 检查实际值是否等于预期值。当你想要比较实例化对象及其值时，此断言特别有用。 |\n| `strictEqual(\
  \ *actual*, *expected*, *message*)` | 检查实际值是否等于预期值。此断言特别有用。 |\n| `raises( *block*,\
  \ *expected*, *message*)` | 检查块内执行的代码是否抛出异常，以及该异常是否匹配预期值。 |\n\n![Image 121](img/index-329_1.jpg)\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n328\n\n如你所见，断言倾向于遵循具有实际值的模式。如果你现在通过刷新移动浏览器中的 Web 页面运行第一个测试，你可以看到绿色条现在应该变为红色，如图\
  \ 9-3 所示。\n\n**图 9-3.** 失败的单元测试\n\n如你所见，失败的测试还会告诉你测试在哪里失败以及为什么失败，这对于调试非常有帮助。\n\n\
  有了第一个断言，你现在可以跟随接下来的代码，完成计算器其余部分的单元测试。\n\n```javascript\ntest('calculator add', function(){\n\
  \n/**\n* 指定此测试将运行多少个断言\n* 如果断言由于任何原因未运行，\n* 此测试将失败\n*/\nexpect(2);\n\n/**\n* 创建一个新的计算器实例并设置初始值为\
  \ 10\n*/\n```\n\n\n\n\n\n```javascript\nvar calculator = new app.calculator(10);\n\
  \n/**\n* 断言操作的返回值和 getResult\n* 方法都返回 20\n */\nequal(calculator.add(10), 20, '10\
  \ + 10 should equal 20');\n\nequal(calculator.getResult(), 20, '10 + 10 should result\
  \ in 20');\n\n});\n\ntest('calculator subtract', function(){\n\n/**\n* 指定此单元测试将运行多少次断言。\n\
  * 如果由于任何原因没有运行断言，则此\n* 测试将失败\n */\nexpect(2);\n/**\n* 创建一个新的计算器实例并将初始值设置为 10\n */\n\
  var calculator = new app.calculator(10);\n\n/**\n* 断言操作的返回值和 getResult\n* 方法都返回\
  \ 5\n */\nequal(calculator.subtract(5), 5, '10 - 5 should equal 5');\nequal(calculator.getResult(),\
  \ 5, '10 - 5 should equal 5');\n});\n\ntest('calculator divide', function(){\n\n\
  /**\n* 指定此单元测试将运行多少次断言。\n* 如果由于任何原因没有运行断言，则此\n* 测试将失败\n */\nexpect(2);\n/**\n* 创建一个新的计算器实例并将初始值设置为\
  \ 10\n */\nvar calculator = new app.calculator(10);\n\n/**\n* 断言操作的返回值和 getResult\n\
  * 方法都返回 5\n */\nequal(calculator.divide(2), 5, '10 / 2 should equal 5');\nequal(calculator.getResult(),\
  \ 5, '10 / 2 should equal 5');\n});\n\ntest('calculator multiply', function(){\n\
  \n/**\n* 指定此单元测试将运行多少次断言。\n* 如果由于任何原因没有运行断言，则此\n* 测试将失败\n */\nexpect(2);\n/**\n\
  * 创建一个新的计算器实例并将初始值设置为 10\n */\nvar calculator = new app.calculator(10);\n\n/**\n\
  * 断言操作的返回值和 getResult\n* 方法都返回 20\n */\nequal(calculator.multiply(2), 20, '10 *\
  \ 2 should equal 20');\nequal(calculator.getResult(), 20, '10 * 2 should equal 20');\n\
  \n});\n</script>\n```\n\n如你所见，有很多断言，但这是为了确保应用程序的每一个方面都得到覆盖。你可以在单元测试中进行更深入的操作，例如确保在向方法传递字母等无效值时会抛出错误；然而，本章将不会涵盖这些内容。\n\
  \n单元测试完成后，现在是时候编写计算器的代码了。\n\n由于本节的重点是创建单元测试，因此不会对计算器的 JavaScript 代码进行详细解释。代码注释应该能帮助你稍微一下。\n\
  \n```javascript\nvar app = app || {};\n\napp.calculator = function(_initialValue){\n\
  \n/**\n* 计算器的当前结果\n */\nvar _result = _initialValue;\n\n/**\n* 获取计算器的当前结果\n */\n\
  this.getResult = function(){\nreturn _result;\n}\n\n/**\n* 在当前结果上加上一个值并返回新值\n */\n\
  this.add = function(value){\n_result = _result + value;\nreturn _result;\n}\n\n\
  /**\n* 从当前结果中减去一个值并返回新值\n */\nthis.subtract = function(value){\n_result = _result\
  \ - value;\nreturn _result;\n}\n\n/**\n* 将当前结果乘以一个值并返回新值\n![Image 122](img/index-333_1.jpg)\n\
  \ */\nthis.multiply = function(value){\n_result = _result * value;\nreturn _result;\n\
  }\n\n/**\n* 从当前结果中除以一个值并返回新值\n */\nthis.divide = function(value){\n_result = _result\
  \ / value;\nreturn _result;\n}\n}\n```\n\n现在，当你在移动浏览器中运行单元测试时，当你刷新移动网页浏览器时，结果栏应该变为绿色，如图\
  \ 9-4 所示。\n\n你可以点击任何单元测试结果来查看运行的断言。\n\n**图 9-4。** *通过的单元测试*\n\n单元测试就绪后，现在是时候为你的计算器项目创建一个本地\
  \ Git 仓库了。\n\n### 使用 Git 和 GitHub\n\n现在你的项目里有了几个文件，是时候时候创建一个本地仓库了。正如本章开头提到的，Git\
  \ 是一个分布式版本控制系统（SCM）。这允许你在没有网络连接的情况下提交到本地仓库，然后 ![Image 123] 将你的更改推送到远程仓库，例如托管在 `github.com`\
  \ 上的仓库。\n\n创建本地仓库很容易；只需点击 Aptana Studio 中 App Explorer 上方的 Commands（命令）图标，然后点击 Initialize\
  \ Git Repository（初始化 Git 仓库）。将在后台运行相应的命令 `git init`，这样你就可以开始提交文件了。\n\n**注意：** 记住\
  \ Git 作为一个系统不会提交空文件夹。要初始化 Git 仓库，请点击 Commands 图标。现在 Git 仓库已经初始化，你将在下拉菜单中看到几个新命令。滚动到\
  \ Commit 项并点击它。将弹出一个新窗口，如图 9-5 所示。\n\n**图 9-5。** *Git 提交窗口*\n\n![Image 124]\n\n\
  如图 9-5 所示，有四个主要的框：Commit 提交框（顶部）、Unstaged 未暂存框（左下）、Commit Message 提交信息框（底部中间）和 Staged\
  \ 已暂存框（右下）。Commit 框显示了 Unstaged 框中选中文件与仓库中当前版本之间的差异。Unstaged 框显示了自上次提交以来所有更改的文件。文件有三种状态：\n\
  - 白色：新文件\n- 红色：已删除文件\n- 绿色：已更改文件\n\n提交信息框允许你添加提交信息；每次提交都需要添加添加提交信息。Staged 框显示了将随当前提交一起提交的所有文件。为了提交文件，你必须将它们从\
  \ Unstaged 框移动到 Staged 框。通常情况下，你会想要提交所有的文件。点击 Unstaged 框旁边的 `>>` 按钮。这将自动移动所有文件到\
  \ Staged 框。输入提交信息并点击按钮。这将所有更改提交到本地仓库。\n\n当你在 Aptana Studio 中更改文件时，你会看到它们在 App Explorer\
  \ 中的颜色会发生变化，如图 9-6 所示。\n\n**图 9-6。** *App Explorer 中的更改文件*\n\n文件或文件夹旁边的星号 (`*`)\
  \ 表示有更改。根据你的 Aptana Studio 主题，文件的背景颜色也会改变以指示文件的当前状态。如果你想查看你特定主题中这些颜色的含义，请查看 Aptana\
  \ Studio 偏好设置中的 Themes（主题）偏好，并查找 Unstaged Files 和 Staged Files 元素，如图 9-7 所示。\n\n\
  **图 9-7。** *查看暂存/未暂存文件的颜色方案*\n\n![Image 125]\n\n文件现在已提交到本地仓库，现在是时候将其推送到远程仓库了。即使你只是为了自己开发一个项目，使用远程仓库也是个好习惯。这样做的主要原因是，如果你的电脑出了问题，你不仅拥有项目的备份，还有你之前所有提交和更改的备份。\n\
  \n\n\n\n首先，前往 github.com 注册一个免费账户，并创建一个名为 `ci` 的公共仓库。按照说明为你的本地机器设置 Git SSH 密钥。\n\
  \n- Mac: [http://help.github.com/mac-set-up-git/]\n- Windows: [http://help.github.com/win-set-up-git/]\n\
  - Linux: [http://help.github.com/linux-set-up-git/]\n\n在设置好 SSH 密钥并尝试通过终端登录 github.com\
  \ 成功完成测试后，返回你在 github.com 上的项目页面。你应该能看到类似于图 9-8 的内容。\n\n![Image 126](img/index-337_1.jpg)\n\
  ![Image 127](img/index-337_2.jpg)\n\n# 第 9 章：测试和部署你的移动 Web 应用\n\n336\n\n**图 9-8.**\
  \ 默认 GitHub 项目页面\n\n你可以不使用命令行将项目推送到 GitHub，而是使用 Aptana Studio 内置的 Git 客户端。要这样做，请复制项目的\
  \ GitHub 远程 URI。该地址类似于 `git@github.com:gavinwilliams-fishrod/ci.git`。它是“Next Steps”（后续步骤）部分倒数第二个个\
  \ URI。\n\n在 Aptana Studio 中，前往 `Commands` ➤ `More` ➤ `Add Remote...`，如图 9-9 所示。\n\
  \n**图 9-9.** 添加远程仓库\n\n![Image 128](img/index-338_1.jpg)\n![Image 129](img/index-338_2.jpg)\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n337\n\n将弹出一个对话框，如图 9-10 所示。将 GitHub 远程 URI 粘贴到 `Remote\
  \ URI` 框中并按下 OK 按钮。\n\n**图 9-10.** 添加 Git 远程对话框\n\n虽然 Aptana Studio 不会对它刚刚完成的操作给出太明显的提示，但它已经以\
  \ `origin` 为别名为你的项目添加了一个远程仓库。当你现在打开 `Commands` 菜单时，会有几项新的激活项目，如 `Push` 和 `Pull`，如图\
  \ 9-11 所示。\n\n**图 9-11.** 新的激活远程命令\n\n遗憾的是，Aptana Studio 中的 Git 客户端不会自动推送到新的远程仓库。为了绕过这个问题，你需要通过\
  \ Project Explorer（项目资源管理器）进行首次推送。前往 `Window` ➤ `Show View` ➤ `Project Explorer`。在\
  \ Project Explorer 中右键点击 `ci` 项目，前往 `Team` ➤ `Push to Remote` ➤ `Origin`。你的项目现在应该已经在\
  \ GitHub 上了，你现在可以使用 `Commands` 菜单中的 `Push` 和 `Pull` 命令了。尽可能多地提交（commit）并在工作日结束时推送你的更改是非常重要的。\n\
  \n前往 github.com 上的你的项目，你应该能看到项目已经推送到 GitHub 了。\n\n使用 Git 和 GitHub 可以做很多事情，以至于有许多关于如何真正利用该系统的文章和书籍。你可以在\
  \ [http://help.github.com/] 找到更多信息。\n\n现在你已经了解了使用 GitHub 的基础知识，是时候去熟悉 Capistrano\
  \ 了，它是目前日益受欢迎的 Web 应用部署平台。\n\n![Image 130](img/index-339_1.jpg)\n\n# 第 9 章：测试和部署你的移动\
  \ Web 应用\n\n338\n\n## 熟悉 Capistrano\n\nCapistrano 是一个部署平台，有助于消除一些重复的部署任务。对于一个小型移动\
  \ Web 应用，使用 Capistrano 可以被看作是使用大锤敲钉子。随着你的应用程序的增长，你最终需要在应用程序中配置更多的环境和细节时，Capistrano\
  \ 突然让你感到如沐春风。\n\n在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n本书首选的托管供应商是 theserve.com，首选服务器操作系统是\
  \ CentOS 5；但是，你可以自由使用任何提供 SSH 访问的托管主机。在遵循第 1 章的设置指南后，你应该已经安装了 Ruby。\n\nCapistrano\
  \ 是一个 Ruby gem。要安装它，从 App Explorer 访问 `Commands` ➤ `Open Terminal`。一个终端窗口将在窗口右侧打开。输入以下命令安装\
  \ Capistrano、Capistrano Rsync With Remote Cache 和 Capistrano Multistage：\n\n- Windows:\
  \ `gem install capistrano capistrano_rsync_with_remote_cache capistrano-ext`\n-\
  \ Mac/Linux: `sudo gem install capistrano capistrano_rsync_with_remote_cache capistrano-ext`\n\
  \n在 Capistrano 和所有需要的 gem 安装完成后，你现在可以对项目进行 `capify` 操作了。返回 App Explorer，确保没有选中/高亮任何项目，然后前往\
  \ `Commands` ➤ `Open Terminal`。一个终端窗口将打开，如图 9-12 所示。\n\n**图 9-12.** 终端窗口\n\n这将确保任何运行的命令都将在项目根目录下运行。要验证这一点，请确保图\
  \ 9-12 中显示了 `ci`。\n\n![Image 131](img/index-340_1.jpg)\n![Image 132](img/index-340_2.jpg)\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n339\n\n## 部署设置\n\n为了使用 Capistrano，你需要创建一组配置文件。Capistrano\
  \ 可以自动完成这些。在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n为了使用 Capistrano，你需要创建一组配置文件。Capistrano\
  \ 可以自动完成这些。在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n为了使用 Capistrano，你需要创建一组配置文件。Capistrano\
  \ 可以自动完成这些。在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n为了使用 Capistrano，你需要创建一组配置文件。Capistrano\
  \ 可以自动完成这些。在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n为了使用 Capistrano，你需要创建一组配置文件。Capistrano\
  \ 可以自动完成这些。在本节中，你将专注于如何使用 Capistrano 将你的应用程序部署到生产环境。\n\n\n\n位于底部，然后按住 `Shift + I`（插入）。到达底部后，将公钥粘贴到文件中，如图\
  \ 9-19 所示。\n\n![Image 137](img/index-343_1.jpg)\n\n![Image 138](img/index-343_2.jpg)\n\
  \n# 第 9 章：测试和部署你的移动 Web 应用\n\n**图 9-19.** 添加公钥\n\n你现在需要保存文件。按下键盘上的 `Esc` 键，然后按住\
  \ `Shift + :`。输入 `wq`（写入并退出），然后按下键盘上的 `Enter` 键。你应该看到与图 9-20 类似的内容。\n\n**图 9-20.**\
  \ 在 vi 中写入文件\n\n最后，你需要为新文件设置适当的权限。使用命令 `cd ../` 返回主目录。`.ssh` 文件夹需要所有者的读/写/执行权限。要执行此操作，运行命令：\n\
  \n```bash\nchmod 0700 ./.ssh\n```\n\n接下来，`authorized_keys` 文件需要所有者的读/写权限。要执行此操作，运行命令\
  \ `chmod 0600 ./ssh/authorized_keys`，如图 9-21 所示。\n\n![Image 139](img/index-344_1.jpg)\n\
  \n![Image 140](img/index-344_2.jpg)\n\n**图 9-21.** 设置 .ssh 文件夹的权限\n\n在命令行中执行 `exit`\
  \ 命令退出你的远程服务器。现在你应该能够无密码重新登录，如图 9-22 所示。\n\n**图 9-22.** 无密码 SSH\n\n设置好无密码 SSH 后，现在是时候配置\
  \ Capistrano 部署到生产服务器了。\n\n回到 Aptana Studio，双击 `config` 文件夹中新的 `deploy.rb` 文件。它包含了你项目的部署配置。它是用\
  \ Ruby 编写的，但你不一定了解很多 Ruby 就能理解并配置它。\n\n默认的 `deploy.rb` 文件是专为 Ruby 项目设置的，这并不是你想使用的。首先，删除文件内容。`deploy.rb`\
  \ 文件中的新第一行将是应用程序名称。可以使用以下 Ruby 代码进行配置：\n\n```ruby\nset :application, \"continuousintegration\"\
  \ # 应用程序名称\n```\n\n这在目前没有实际功能作用，但你可以在配置任务和选项中使用此变量。\n\n接下来，你需要使用以下 Ruby 代码引入 multistaging\
  \ 和 Capistrano-offroad 宝石：\n\n```ruby\nrequire 'capistrano/ext/multistage'\nrequire\
  \ 'capistrano-offroad'\n```\n\n这将包含适当的代码，允许你从单条命令行部署并控制多个环境。除了提供标准的、Web 友好的部署配置外，Capistrano-offroad\
  \ 还允许你在 Ruby 项目之外使用 Capistrano。\n\n接下来，你将使用以下代码行配置 Capistrano 多阶段：\n\n```ruby\n\
  set :stages, %w(production)\nset :default_stage, \"production\"\n```\n\n`stages`\
  \ 行决定了你想要部署到哪些环境。你可以拥有任意数量的环境，只要它们像下面所示用空格隔开即可：\n\n```ruby\nset :stages, %w(production\
  \ staging development testing preprod)\n```\n\n阶段环境的名称应该用作配置文件的文件名，如在本章稍后的部分所示，只要它只包含字母字符且没有空格或特殊字符，你就可以为环境命名为任何名称。`default_stage`\
  \ 变量设置了如果在执行 `cap` 命令时排除阶段名称，则默认阶段环境将是什么。\n\n接下来，你指定部署使用哪些 offroad 模块。`offroad_defaults`\
  \ 模块将覆盖许多默认的 Capistrano 钩子（hooks），例如创建 `capistrano` 在版本之间共享而不是覆盖的共享文件/文件夹定义。这对于日志、配置选项和用户数据通常非常有用。如果需要，你可以重新实现这些钩子，但对于没有服务器端代码的应用，包含这些是没有意义的。\n\
  \n```ruby\noffroad_modules 'defaults'\n```\n\n现在你必须配置 Git。Capistrano 将从 Git/GitHub\
  \ 检出指定的最新分支以便上传。`:repository` 变量是项目的 GitHub URI，用于从 GitHub 检出最新代码。\n\n```ruby\n\
  set :repository, \"git@github.com:gavinwilliams-fishrod/ci.git\" # git 仓库 URI\n\
  set :scm, :git # 告诉 capistrano 使用 GIT\nset :branch, \"master\" # 告诉 capistrano 使用哪个分支\n\
  ```\n\n`:scm` 变量只是告诉 Capistrano 将使用 Git 作为 SCM 系统。\n\n你可以通过修改 `:branch` 配置选项来指定使用哪个分支。例如，要使用名为\
  \ `special` 的分支，使用以下设置：\n\n```ruby\nset :branch, \"special\" # 告诉 capistrano 使用哪个分支\n\
  ```\n\n下一个变量将告诉 Capistrano 如何部署应用程序。在此例中，将使用 `rsync_with_remote_cache`。这将克隆 Git\
  \ 仓库并使用 `rsync` 将部署到生产服务器。如果你的服务器阻止入站流量，这会非常有用。\n\n```ruby\nset :deploy_via, :rsync_with_remote_cache\
  \ # 告诉 capistrano 通过 rsync 部署\n```\n\nrsync 是一个在远程服务器上比较并同步文件夹的应用程序。在编写时，rsync 有一个\
  \ bug 会阻止你同步带有空格的文件夹。为了解决这个问题，你需要指定一个替代临时位置：\n\n```ruby\nset :local_cache, '/tmp/ci/'\
  \ # 设置存储 rsync 缓存的目录\n```\n\n最后，以下 Capistrano 配置选项接收变量：\n\n```ruby\nrole :web, {\
  \ domain } #  HTTP 服务器，Apache 等\nrole :app, { domain } # 这可能与你的 Web 服务器相同\nrole\
  \ :db, { domain } # Rails 迁移运行在此\nset :keep_releases, 5 # 告诉 capistrano 保留多少版本\n\
  ```\n\n为了让你有一个概览，完整的配置文件应该如下所示：\n\n```ruby\nset :application, \"continuousintegration\"\
  \ # 应用程序名称\nrequire 'capistrano/ext/multistage'\nrequire 'capistrano-offroad'\n\n\
  set :stages, %w(production)\nset :default_stage, \"production\"\n\noffroad_modules\
  \ 'defaults'\n\nset :repository, \"git@github.com:gavinwilliams-fishrod/ci.git\"\
  \ # git 仓库 URI\nset :scm, :git # 告诉 capistrano 使用 GIT\nset :branch, \"master\" #\
  \ 告诉 capistrano 使用哪个分支\nset :deploy_via, :rsync_with_remote_cache # 告诉 capistrano\
  \ 通过 rsync 部署\nset :local_cache, '/tmp/ci/' # 设置存储 rsync 缓存的目录\n\nrole :web, { domain\
  \ } # HTTP 服务器，Apache 等\nrole :app, { domain } # 这可能与你的 Web 服务器相同\nrole :db, { domain\
  \ } # Rails 迁移在此运行\nset :keep_releases, 5 # 告诉 capistrano 保留多少版本\n```\n\n\n\n`set\
  \ :domain, \"ci.fishrod.co.uk\"` # 应用程序的域名。上一行代码设置了应用程序的域名，它将用于登录服务器。\n\n`set :deploy_to,\
  \ \"~/application/\"` # 部署应用程序的路径\n\n`:deploy_to` 设置应用程序部署到远程服务器上的路径。在本例中，SSH 用户的\
  \ Web 路径位于用户目录，因此使用了 `~`。如果你的 Web 路径在其他地方，你应该使用该路径。例如，在大多数空白服务器上，它将存在于 `/var/www/application/`\
  \ 下。首先，你需要在服务器上创建应用程序文件夹。\n\n![Image 142](img/index-348_1.jpg)\n\n# 第 9 章：测试和部署你的移动端\
  \ Web 应用\n\n347\n\n`set :user, \"ci.fishrod.co.uk\"` # 网站的 SSH 用户 `set :deploy_group,\
  \ \"ci.fishrod.co.uk\"`\n\n`set :use_sudo, false` # 告诉 Capistrano 不要以 root 身份运行命令\n\
  \n`:user` 将设置用于登录远程服务器的用户。`:deploy_group` 将设置 Capistrano 为任何上传的文件设置的权限组。\n\n`:use_sudo`\
  \ 将阻止 Capistrano 以 root 用户身份上传和更改文件。\n\n在完全配置 Capistrano 后，现在是时候为部署设置你的生产服务器了。\n\
  \n为了做到这一点，请再次登录你的远程服务器，然后进入 Web 服务器文档根目录的上一级文件夹。例如，你的根目录可能是 `/var/www/html`，所以你应该进入\
  \ `/var/www` 目录。如果你在共享主机上，你应该进入 `~`，这将是你的家目录。\n\n在该目录中创建一个名为 `application` 的新目录，并删除你的文档根文件夹，如图\
  \ 9-24 所示。你的文档根文件夹可能命名为 `htdocs`、`html` 或 `public_html`；在本章中，它将统称为 `public_html`。\n\
  \n**图 9-24。** *创建应用程序目录并删除文档根目录*\n\n在最终确定 Capistrano 配置之前，你需要在远程服务器上设置 Capistrano\
  \ 文件夹。要完成操作，返回 Aptana Studio 并打开终端视图。运行以下命令：\n\n```\ncap production deploy:setup\n\
  ```\n\n这将登录到你的远程服务器并为你创建适当的文件和文件夹。你将看到类似于图 9-25 中的输出内容。\n\n![Image 143](img/index-349_1.jpg)\n\
  \n![Image 144](img/index-349_2.jpg)\n\n# 第 9 章：测试和部署你的移动端 Web 应用\n\n348\n\n**图 9-25。**\
  \ *Capistrano deploy:setup 输出*\n\n现在你可以部署你的应用程序了。运行以下命令即可：\n\n```\ncap production\
  \ deploy\n```\n\n如果一切顺利，你将看到类似于图 9-26 所示的最终输出。\n\n**图 9-26。** *最终 Capistrano deploy\
  \ 输出*\n\n最后要做的是在 Web 根目录和当前发布版本之间创建一个符号链接。这允许你在服务器上保留代码版本，并并在部署过程中发生任何故障时让 Capistrano\
  \ 进行回滚。\n\n要执行此，返回连接到服务器的终端窗口（即用于创建应用程序文件夹和删除 `public_html` 文件夹的窗口），并运行以下命令：\n\n\
