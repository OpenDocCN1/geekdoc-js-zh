  };\n```\n\n**图 7-11.** *最终播放按钮*\n\n### 存储数据\n\n传统上，为了在移动 Web 应用程序中持久化数据（例如用户名），你会会将这些信息存储在\
  \ `cookie` 中。Cookie 的问题在于，虽然它们非常适合存储少量数据，但对于大量数据（例如 `JavaScript` 对象），它们很快就会变得难以管理。不过当你希望存储应用程序的当前状态时，这种方法是完美的，这样当用户返回时，他们可以从上次离开的地方继续，就像原生应用程序一样。\n\
  \n遗憾的是，`local storage` 不支持存储对象，只支持字符串值。\n\n你可以使用 `JSON.stringify` 将对象转换为字符串，并使用\
  \ `JSON.parse` 将它们转换回对象。\n\n使用 `local storage` 存储数据，只需使用 `localStorage` API。这些 API\
  \ 由表 7-6 所示的属性和方法组成。\n\n**表 7-6.** *本地存储方法与属性*\n\n| API 方法 | 说明 |\n| :--- | :---\
  \ |\n| `localStorage.clear()` | 清除本地存储中的所有数据 |\n| `localStorage.setItem(key, value)`\
  \ | 在本地存储中设置键值对 |\n| `localStorage.getItem(key)` | 根据键从本地存储中获取项目 |\n| `localStorage.key(0)`\
  \ | 根据索引值从本地存储中获取项目；可以通过调用 `localStorage.key(localStorage.length)` 获取本地存储中的最后一个项目\
  \ |\n| `localStorage.removeItem(key)` | 根据键从本地存储中移除项目 |\n| `localStorage.length`\
  \ | 返回本地存储中的项目数量 |\n\n例如，如果你想存储一个包含用户名、电子邮件地址和联系电话的对象，你可以创建如下内容的内容：\n\n```javascript\n\
  var user = {name: \"John Seagate\", email: \"john.seagate@hello.com\", contactNumber:\
  \ \"012345678910\"}\nlocalStorage.setItem('user', JSON.stringify(user));\n```\n\n\
  要检索该项目，你可以使用以下代码：\n```javascript\nvar user = JSON.parse(localStorage.getItem('user'));\n\
  ```\n\n# 用于移动端的 JavaScript 库\n\n`JavaScript` 库可以帮助完成任何前端开发中的繁重工作。它们可以帮助为从 `DOM`\
  \ 操作到包罗百代的任何功能提供一致的 API。本章将使用三个库作为示例。\n\n* `XUI`\n* `jQuery Mobile`\n* `Sencha Touch`\n\
  \n**图 7-12.** *jQuery Mobile（左侧）和 Sencha Touch（右侧）*\n\n## XUI\n\n`XUI` 专为移动端设计，并提供了类似于\
  \ `jQuery` 的语法和轻量级的 `DOM` 操作。它具有类似于 `jQuery` 的插件架构，因此你可以根据需要扩展 `XUI`。`XUI` 提供了一种更复杂且功能齐全的方法论。\n\
  \n## jQuery Mobile\n\n`jQuery Mobile` 和 `Sencha Touch` 都是重量级库；然而，你最终创建的是基于 `jQuery\
  \ mobile` 或 `Sencha` 思维的应用。`jQuery Mobile` 可以帮助你快速原型并皮肤。\n\n## Sencha Touch\n\n\
  `Sencha Touch` 提供了许多增强和组件，包括通过代理离线存储数据的功能。它为任何功能提供一致的 API。\n\n## 通用考量\n\n### 文件大小\n\
  \n确保任何库都具有较小的占用是非常重要的。遗憾的是，某些移动运营商不提供无限流量套餐，因此确保访问你的网站不会对用户的钱包产生巨大影响。同样必须记住，尽管 `3G`\
  \ 和 `LTE` 提供了较高的数据速度，但并非所有用户都能访问 `3G` 或 `LTE`。这会影响加载时间，因为一个 500KB 的库加上整个应用程序图像和\
  \ `CSS` 资源通过 `3G/LTE` 下载需要几秒钟；在 `EDGE` 上可能需要长时间。因此，请考虑最低标准，在这种情况下是 `EDGE`。\n\n###\
  \ 文件数量\n\n在目前，移动浏览器可以发起的请求数量有限。这意味着如果你有很多资源需要下载到浏览器，这会影响加载时间。通过确保你使用的 JavaScript\
  \ 库提供以下内容可以克服这个问题：\n\n* 源代码的压缩和合并版本\n* 用于图标和按钮等元素的精灵图\n* 库的 CDN（内容分发网络）托管版本\n\n\
  ### 活跃\n\n你应该检查该库最近更新是什么时候，以及多久发布一次新版本（发布周期）。这对你的开发有影响，如果你是一个热于跟进错误修复和重大版本发布的人，你可能会发现自己不断根据最新版本更新代码；更糟糕的是，如果该库被遗弃且不再维护，这意味着你必须学习一个新的库，或者维护那个被遗弃的库。\n\
  \n### CSS3 支持\n\n许多库现在正在更新代码，以利用 GPU 对 `CSS3` 动画和过渡支持的增强。\n\n\n\n\n检查你的库，以确保它支持或有关于\
  \ CSS3 过渡和动画的路线图，而非 JavaScript 动画和过渡。这将为你的应用程序提供性能增强。\n\n## 总结\n\n通过本章，你应该对 JavaScript\
  \ 通用以及移动带给你的新功能有更深入的理解。\n\n你应该能够区分过程式 JavaScript 和面向对象 JavaScript 之间的区别，并理解将对象互相传递比在全局命名空间调用函数好得多的概念和原则。\n\
  \n你还应该对 JavaScript 中的作用域有简要了解，以及如何通过闭包和使用 `_self = this` 在对象之间维持作用域。\n\n你还应该对如何在\
  \ JavaScript 中处理触控事件有简要了解，并意识到通过这一点，你可以开发出丰富丰富的应用程序。\n\n本章详细介绍了 Canvas。你应该理解 HTML5\
  \ Canvas 的工作原理，以及上下文（context）和绘图 API 背后的思想，例如 `arc`、`fillRect`，以及样式 API，如 `lineStyle`\
  \ 和 `fillStyle`。\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n有很多开发设计模式。其中一种非常脱颖而出且可以应用于几乎所有编程语言的模式是\
  \ MVC（模型-视图-控制器）。MVC 将应用程序应该如何结构划分为不同的责任层。\n\n作为开发者，我们非常常见的情况是直接跳进去开始做一个项目，而并不真正理解该项目最终将如何演变或增长。例如，我们使用\
  \ Ajax 从外部资源获取数据，然后简单地在同一个代码块的 HTML 中渲染这些数据。当你想要在应用程序的另一个部分使用相同的 HTML，但为了不同的目的并使用不同的数据源时，会发生什么？最快的方法是复制粘贴代码并修改变量。\n\
  \n当你开始以这种方式为你的应用程序堆载更多功能时，它看起来可能更像是用果冻和巧克力构建的应用程序，而不是代码和逻辑。虽然这听起来很美味，但点在于，如果你从一开始就按照这种构建应用程序，使其以后可以轻松扩展，那么将来添加更多功能将花费更少的时间和金。\n\
  \n实现这一点的部分是对应用程序的某些方面进行标准化或创建规则。这可能会让代码编写起来更长，但对于你以外的其他开发者更容易维护。通过采用 MVC，你采用了一种易于理解的工作方法。你的技能水平不应该决定你是否应该学习设计模式。你可以以任何喜欢的方式实现\
  \ MVC；然而，本章将向你展示在 JavaScript 中使用 MVC 的方法。\n\n通过本章，你将学习如何创建和实现自己的 MVC 框架。你将学习模型是什么，以及它们如何作为应用程序的命脉。你将学习控制器如何帮助绑定和管理应用程序中的事件，以及如何构建可重复的视图。\n\
  \n**注意：** 在开始之前，你需要一个 Rotten Tomatoes 开发者账户。要创建一个帐户，请访问 `http://developer.rottentomatoes.com`\
  \ 并按照步骤创建开发者账户并获取 API 密钥。\n\n## 清理你的代码\n\n在开始为本章编写任何代码之前，你需要清理为第 4 章创建的应用程序根目录下的\
  \ `index.html`。\n\n大部分 HTML（如收藏列表和电影预览列表）现在将使用 JavaScript 生成。我们在本章将涵盖很多内容；为了详细关注所有这些问题，寻找电影院和播放音频轨道将从最终功能列表中移除。\n\
