  \n# 第 9 章：测试和部署你的移动端 Web 应用\n\n349\n\n通过运行 `ls` 命令验证符号链接是否已创建，如图 9-27 所示。\n\n**图\
  \ 9-27。** *新的 public_html 符号链接*\n\n现在，使用以下 URL 访问远程服务器上的你的单元测试，当然，将 *yourdomain*\
  \ 替换为你自己的域名：\n\n`http://yourdomain*/js/tests/calculator.html`\n\n如你所见，Capistrano\
  \ 是一个强大的工具。它不仅可以用于部署，还可以用于在不直接登录服务器的情况下在远程服务器上运行命令。这对于重新编译 SASS 文件或合并和压缩 JavaScript\
  \ 文件非常有用。Capistrano 更棒的一点是，由于它是从命令行运行的，因此它可以集成到如 Hudson 或 Bamboo 之类的持续集成服务器中。\n\n\
  ## 总结\n\n通过本章，你应该对持续集成以及它如何影响你测试和部署应用程序有了基本的了解。\n\n尽管这本书本书没有介绍如何实现持续集成服务器，但这是一个值得追求的主题，即使是作为一个独立开发者也是如此。当你有最后时刻的代码更改时，你可以确信当你提交代码后，一旦它到达生产环境，它已经经过了充分测试。你也可以确信，由于自动化的存在，如果它第一次成功部署了，它应该再次成功、再次、再成功，除非你破坏了应用程序的某些元素。在这种情况下，你失败的测试将指出哪部分代码运行不符合预期。\n\
  \n仅通过这一章，你就应该真正掌握如何使用 QUnit 创建 JavaScript 单元测试的基础。市面上还有其他更先进的测试产品，例如 Test Swarm\
  \ ([`github.com/jquery/testswarm) 和 Jasmine`](https://github.com/jquery/testswarm)。\n\
