  \nActor 模型是另一个简单的对象，仅包含演员的名称和在电影中的角色。在 `/js/app/models/` 目录下创建一个名为 `actor.js` 的新文件。这里没什么好解释的，直接创建模型即可。\n\
  \n它应该有两个名为 `_name` 和 `_role` 的实例变量，通过构造函数设置。你的完整代码看起来如下。\n\n```javascript\nvar app\
  \ = app || {};\n\napp.model = app.model || {};\n\n/**\n* 演员对象处理电影的演员\n* 演员应该只出现在完整的电影列表中\n\
