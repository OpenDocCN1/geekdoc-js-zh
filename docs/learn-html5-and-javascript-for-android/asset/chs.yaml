  \ JavaScript 中创建可重用的 HTML 片段，称为“视图（views）”。这允许你将视图保持在应用程序主代码之外，并放在其独立的可维护文件中。\n\n\
  ## MVC 与 JavaScript 基础\n\nJavaScript 基于 ECMAScript 标准。我们在 20 世纪末见证了 JavaScript 普及的眷顾，当时\
  \ webdynamic.com 帮助将 JavaScript 推向了前沿。\n\n然后，就像几年前 Web 2.0 是流行 Web 技术（如 Ajax、JavaScript\
  \ 和 HTML）和概念（包括 API、RSS、社交媒体以及大规模内容生产与消费）的集合的术语一样，DHTML 是利用 JavaScript、DOM 操作和 CSS（例如，在网页上制作漂浮的雪花）的术语。\n\
  \n很快，JavaScript 变得非常流行，并且在具有 Java 和 C/C++ 等语言的企业软件开发经验的严肃开发人员手中，JavaScript 成熟了。然而，浏览器在实现上是不一致的；JavaScript\
  \ 开发者经常痛苦，因为知道其他浏览器对 Ajax/XMLHttpRequest 的实现与当时流行的 Internet Explorer 完全不同。即使是绑定事件或选择元素等简单任务也很麻烦，因为你需要为\
  \ Internet Explorer 编写一套，再为其他浏览器编写一套。\n\n我们后来获得了如 MooTools、DoJo、jQuery 和 YUI 等库来为我们分担许多繁重工作。例如，与其编写几行代码来创建一个兼容\
  \ Internet Explorer 和 Firefox 的 Ajax 请求，你可以使用 jQuery 一次性涵盖两者，如下：\n\n```javascript\n\
  $.ajax('/my/data/provider.json');\n```\n\n不幸的是，这给我们留下了一群新开发者，他们有理由认为 jQuery、DoJo、MooTools\
  \ 或 YUI 才是真正的 JavaScript。过程式 JavaScript 与库代码混合成为常态，而在 `$(document).ready(function(){});`\
  \ 中充斥意大利面代码对于不断增长的 Web 应用程序来说将变得难以维护。\n\n\n\n\n这些工具非常奇且强大，但你很容易依赖它们，而不理解它们究竟是如何运作的，以及为什么在移动端上应该或不应该使用其中某一个。如果你主要使用\
  \ `jQuery`，那太棒了。自 2007 年（1.1 版本）以来，我作为一个开发者一直在使用 `jQuery`，从 2005 年开始使用 `script.aculo.us`（尽管我不愿承认）。然而，我是先学习\
  \ `JavaScript` 的，并且在使用它们之前，我已经研究过 `jQuery` 和 `script.aculo.us` 的代码。\n\n这在移动端更为重要，因为库中找到大部分代码在你的移动\
  \ Web 应用中几乎不会被用到。至少，你可能会用到 DOM 选择器、遍历、事件绑定和 `Ajax`，这些只占了库代码的一小部分。尽管如此，在一个已经在供需平衡上挣扎扎的网络上下载整个工具包是不明智的。\n\
  \n![Image 104](img/index-224_1.jpg)\n\n# 第 8 章：JavaScript：模型、视图与控制器\n\n相反，有时自己编写一个微型的\
  \ `JavaScript` 库或框架实际上会更有利。你永远不会因为太像新手而无法学习如何这样做；事实上，现在就养成习惯其实更好。\n\n框架简单来说就是处理代码的方法、标准或实践。你创建框架是为了将应用程序的关键部分分离出来，以便在应用程序增长时更易于管理。框架还管理数据在应用程序中的流转方式。你将主要看到\
  \ `JavaScript` 对象从一个方法传递到另一个方法以进行展示。这些对象通常代表某种形式的实体，被称为模型（models）。\n\n模型通常会被传递给一个方法或函数，然后由其将其显示给用户。在\
  \ `MVC` 中，处理和操作模型以展示的方法被称为控制器（controller），而生成包含模型的 HTML 代码被称为视图（view）。图 8-1 显示了\
  \ `MVC` 框架的结构。\n\n**图 8-1.** JavaScript 的 MVC 图\n\n## 模型 (The Model)\n\n`MVC` 中的\
  \ `M` 代表模型（Model）。模型是应用程序决定如何处理不同类型数据的部分。模型就是一个简单的 `JavaScript` 对象，可以代表某种实体。例如，你可能会为应用程序中的用户创建一个模型，如下所示：\n\
  \n```javascript\nvar user = function user(){}\n```\n\n**提示：** 你会注意到我命名了该函数，并将其赋值给一个变量。这本质上创建了一个命名函数，而不是匿名函数。这在许多情况下非常有用，例如调试，因为你可以在栈跟踪中看到方法名。\n\
  \n用户通常会有属性，如姓名、密码和宠物。最好的做法是使用实例变量（只能从对象/模型内部访问的变量）创建这些属性，然后创建特有的访问器（getters）和设置（setters）来修改或检索这些值。这允许你围绕这些属性创建规则。例如，你可以为\
  \ `password` 创建一个 setter，接收明文密码，然后在对象内部对该值进行加密。通过省略 getter，你还可以防止其他代码从用户对象中获取用户的密码。接下来的代码展示了用户模型的演变。\n\
  \n```javascript\nvar user = function user(name, password, pet){\n  var _name = null,\n\
  \  _password = null,\n  _pet = null,\n  _self = this;\n  this.setName(name);\n \
  \ this.setPassword(password);\n  this.setPet(pet);\n  name = null;\n  password =\
  \ null;\n  pet = null;\n}\n\n/**\n* 返回用户的姓名\n */\nthis.getName = function(){\n \
  \ return _name;\n}\n\n/**\n* 设置姓名\n */\nthis.setName = function(name){\n  _name\
  \ = name;\n}\n\n/**\n* 设置密码\n */\nthis.setPassword = function(password){\n  _password\
  \ = password;\n}\n\n/**\n* 获取密码\n */\nthis.getPassword = function(){\n  return _password;\n\
  }\n\n/**\n* 设置宠物\n */\nthis.setPet = function(pet){\n  _pet = pet;\n}\n\n/**\n*\
  \ 获取宠物\n */\nthis.getPet = function(){\n  return _pet;\n}\n```\n\n你可以看到，创建一个模型模型是合理的。在在用户用户用户，，管理\
  \ `pets` 数组中在在宠物宠物。。在整个 `pets` 数组中。在在。。。。在。在在在在在在在在，在。在在。在在在。在 `，， ` ` ` 方法来清理 `。``。\
  \ ` ` ` ` ` ` `。。。 ` ` ``` 方式如下：\n\n```javascript\nvar user = function user(name,\
  \ password){\n  _name = null,\n  _password = null,\n  _pets = [], // 默认值现在是数组而不是\
  \ null\n  _self = this;\n  this.setName(name);\n  this.setPassword(password);\n\
  \  // favoritePet 不是构造函数的一部分了，所以不需要设置\n  name = null;\n  password = null;\n\n/**\n\
  * 现在既然你可以有多个宠物，将它添加到\n* 构造函数就有意义了\n*/\nthis.addPet = function(pet){\n  // 在添加到宠物数组之前可以添加对象验证\n\
  \  _pets.push(pet);\n}\n\n/**\n* 从数组中根据特定索引获取宠物\n */\nthis.getPet = function(index){\n\
  \  return _pets[index];\n}\n\n/**\n* 从数组中移除宠物\n */\nthis.removePet = function(index){\n\
