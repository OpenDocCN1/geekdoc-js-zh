  \n## 内容样式化\n\n即使你已经为 JavaScript 框架付出了这么多努力，Memo 看起来还是很丑。在第 6 章中，我们提到过使用 SASS 来创建一个基础框架。现在我们将把这些付诸实践，进一步为应用程序的各种元素设置样式。\n\
  \n我们将从设置电影列表开始，因为它是用户交互的第一个元素。\n\n\n\n\n电影列表将用于 `MoMemo` 应用程序中的两个地方。其中一个位于搜索结果中，另一个位于主屏幕的收藏列表中。由于有两个列表，你可能希望对它们进行不同的样式化处理。\n\
  \n# 第 8 章：JavaScript：模型、视图与控制器\n\n我们可以为列表提取出通用样式，例如每个列表项的大小及其公共子元素在“全局”列表类中的位置，这些样式可以使用特殊性（specificity）进行覆盖。\n\
  \n### 第一，创建列表的全局样式。\n\n```css\n.list {\n  margin: 0;\n  padding: 0;\n  li {\n  \
  \  padding: 10px;\n    overflow: hidden;\n    height: 82px;\n    display: block;\n\
  \    border-bottom: 1px solid #CCCCCC;\n    background: #FFFFFF;\n    .preview-image\
  \ {\n      float: left;\n      width: 60px;\n      height: 82px;\n      text-align:\
  \ center;\n      margin-right: 10px;\n    }\n  }\n}\n```\n\n`.list` 样式为所有列表提供了样式化的框架。如果你知道某个特定的设计组件可能会被多次使用，但不一定外观相同，那么这就是设计\
  \ Web 应用的一种良好方法。你可以只创建一个电影列表样式，然后使用特殊性来覆盖它，但新样式中可能包含某些你不希望保留的 CSS 样式，这意味着需要额外的代码来重置它们。将上一个代码片段中的\
