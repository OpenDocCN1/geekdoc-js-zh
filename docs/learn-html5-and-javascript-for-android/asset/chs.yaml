  \n![Image 62](img/index-115_1.jpg)\n\n**图 4-10.** 手机电影列表\n\n## 电影信息\n\nMoMemo 应用程序最后部分是电影信息部分。它包含几个子功能，包括电影简介、片段、演员表、原声带和最近的院。你可以将这些信息放在不同的卡片上，但在大屏幕设备（如平板电脑）上查看小区域（如简介）时，你会发现大量的空白。\n\
