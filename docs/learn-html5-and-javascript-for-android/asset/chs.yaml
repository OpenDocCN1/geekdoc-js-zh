  \n# 第 2 章：Android 移动 Web 应用开发简介\n\n36\n\n**图 2-9.** *Hello World!*\n\n## 总结\n\n\
  在本章中，你应该学习了三种不同类型的 Web 应用：基于任务的、社交类和娱乐类的。\n\n你应该理解用户可能如何与你的应用程序进行交互。在本书之外开发移动 Web\
  \ 应用时，你还应该理解如何考虑用户的潜在处境，以及这将如何影响你的功能、设计和用户体验。\n\n本章应该让你对 JavaScript 开发的最佳实践有了深入的了解，并对响应式设计有了初步接触。\n\
  \n最后，本章应该让你在项目方向上有所把握，即是作为原生、Web 还是多手机 Web 应用程序框架项目来启动你的项目。\n\n# 第 3 章\n\n## HTML5\n\
  \n随着对跨平台移动应用的需求，HTML5 对移动行业的重要性未曾如此重要。它是创建简单且功能丰富的应用程序的理想选择之一，这些应用程序只需构建和部署一次，即可支持目前所有的主流智能手机和平板电脑设备。\n\
  \n基于 HTML5 的应用程序的一个常见误区是它们运行速度缓慢、无响应，并且无法达到用户对原生移动应用所期望的速度和质量。这种说法只有部分正确，正如你在上一章中所看到的；这取决于所构建的应用程序类型。例如，App\
  \ Store 上的《Financial Times》应用看起来像是一个原生应用。然而，如果你仔细观察，会发现《Financial Times》应用仅仅是将《Financial\
  \ Times》移动 Web 应用 (app.ft.com) 封装在原生应用内的 `WebView` 中。\n\n如图 3-1 所示，iPhone 和 Android\
  \ 的两个应用看起来非常相似。抛开 UI 带来的若干特定平台增强功能不谈，它们实际上是同一个应用程序。\n\n**注意：** 使用诸如 `PhoneGap` 等多手机\
  \ Web 应用程序框架构建 Web 应用并将其推向各种应用市场并没有问题。这增加了你应用程序的曝光率，并让用户更容易获取。通过这种方式制作应用程序，当 App\
  \ Store 的条款和条件发生不利于你的变化时也能为你提供即时的解决方案。\n\n![Image 28](img/index-42_1.jpg)\n\n# 第\
  \ 3 章：HTML5\n\n38\n\n**图 3-1.** *Financial Times 应用（左）和 iOS 应用（右）*\n\n在在本章中，你将学习\
  \ HTML5 的基础知识。你还将学习如何使用 `header`、`footer`、`nav`、`section` 和 `article` 元素来表示内容。\n\
  \n## 有什么新？\n\nHTML5 相比 HTML4 有了巨大的飞跃。它引入了新的标签，如 `video`、`audio`、`canvas`、`svg`、`article`、`aside`、`details`、`figure`、`figcaption`、`header`、`mark`、`output`、`progress`、`time`、`video`\
  \ 和 `section`。\n\n本章将深入探讨如何使用这些新特性创建更好的移动 Web 应用。你还将学习新的 API，如 `geolocation`、`storage`、`web\
  \ workers` 和 `web sockets`。\n\n\n\n正如你从列表 3-2 中看到的，这种标记并没有真正的明显结构。有很多带有关联类（classes）的\
  \ `div` 标签；然而，创建这样一个像这样的文档并没有真正的标准。\n\n![Image 30](img/index-47_1.png)\n\n# 第 3\
  \ 章：HTML5\n\n43\n\n<aside />\n\n`<aside />` 元素可用于表示与网站主要内容无关的内容，例如推文、相关链接、标签和导航元素。这些内容通常出现在文档的左侧或右侧，如图\
  \ 3-3 所示。\n\n**图 3-3。** *带有 `<aside />` 元素的文档结构（用灰色突出显示）* 我们可以根据屏幕大小隐藏 `aside` 元素来在移动端使用它，并在用户点击按钮显示它时将其显示。这种设计模式可以在\
  \ Facebook 移动网页应用中找到，并将在第 4 章的工作坊中进行更深入的探讨。\n\n列表 3-3 显示了应该如何使用 `aside` 元素，列表 3-4\
  \ 显示了你可能在 HTML4 中是如何编写相同代码的。\n\n# 第 3 章：HTML5\n\n44\n\n**列表 3-3。** *HTML5 中 Aside\
  \ 的建议结构*\n\n```html\n<aside>\n<nav>\n<h2>要去的地方</h2>\n<ul>\n<li><a href=\"somewhere\"\
  >某处</a></li>\n<li><a href=\"somewhere-else\">其他地方</a></li>\n</ul>\n</nav>\n</aside>\n\
  <section class=\"content\">\n<!-- 你的内容放在此处 -->\n</section>\n```\n\n正如你从列表 3-3 中看到的，我们使用\
  \ `<aside />` 元素来容纳网站的导航，因为它位于由 `<section class=\"content\" />` 元素定义的区域之外。`<aside\
  \ />` 元素将浮动在内容的左侧。\n\n为 HTML4 编写的相同标记看起来就像列表 3-4 所示。\n\n**列表 3-4。** *HTML4 中 Aside\
  \ 的建议结构*\n\n```html\n<div class=\"sidebar\">\n<div class=\"navigation\">\n<ul>\n\
  <li><a href=\"somewhere\">某处</a></li>\n<li><a href=\"somewhere-else\">其他地方</a></li>\n\
  </ul>\n</div>navigation>\n</div>\n<div class=\"content\">\n<!-- 你的内容放在此处 -->\n</div>\n\
  ```\n\n# 第 3 章：HTML5\n\n45\n\n正如你所见，使用 `div` 代替有意义的标记使得内容初看时更难理解。\n\n<audio />\n\
  \n`<audio />` 元素用于在网页中嵌入音频内容。这是 HTML5 的新功能，在 HTML4 中不可用。对于不支持 HTML5 音频的浏览器，你可以在\
  \ `<audio />` 标签内提供 3gp 版本的音频文件的链接。列表 3-5 显示了如何嵌入音频文件。\n\n**列表 3-5。** *在 HTML5 中使用\
  \ Audio 标签*\n\n```html\n<audio controls=\"controls\">\n<source src=\"media/audio.oga\"\
  \ type=\"application/ogg\">\n<source src=\"media/audio.mp3\" type=\"audio/mpeg\"\
  >\n<p>\n您的浏览器不支持 HTML5 音频，\n<a href=\"media/audio.3gp\">点击此处下载</a>\n</p>\n</audio>\n\
  ```\n\n这将为手机渲染原生音频播放器。在 `<audio />` 标签内，你会看到几个 `<source />` 元素。这些用于为浏览器提供不同的音频格式，如\
  \ MP3、OGG 或 WAV。你应该指定音频文件的 mime 类型，以便浏览器选择正确的音频文件。\n\n图 3-4 显示了 `<audio />` 元素在\
  \ Android 4 中的外观观。\n\n![Image 31](img/index-50_1.jpg)\n\n# 第 3 章：HTML5\n\n46\n\n\
  **图 3-4。** *Android 4 三层冰中的 `<audio />` 元素* `<audio />` 标签还支持几个额外的媒体属性。\n\n表格 3-1\
  \ 显示了这些属性及其描述。\n\n**表格 3-1。** *HTML5 音频属性*\n\n| 属性 | 值 | 描述 |\n| :--- | :--- | :---\
  \ |\n| src | — | 用于指定单个音频文件，而不是使用 `<source />` 标签。 |\n| preload | none \\| metadata\
  \ \\| auto | 用于指定是否预加载音频文件。建议设置为 none 或 metadata。这将防止浏览器在用户不知情的情况下下载整个音频文件。 |\n\
  | autoplay | autoplay | 用于告诉浏览器自动播放音频文件。如果你不想让音频自动播放，请不要添加此元素。 |\n| loop | loop\
  \ | 用于指定音频是否连续循环。此属性不接受数字。如果你想让音频循环特定次数，可以使用 JavaScript 音频 API 实现。 |\n| muted |\
  \ muted | 将静音音频。注意，在 Android 浏览器中似乎不支持此项。 |\n| controls | controls | 用于告诉浏览器是否渲染默认控制控件。如果你为自己的音频播放器制作了\
  \ UI，这会非常有用。 |\n\n# 第 3 章：HTML5\n\n47\n\n## 支持的媒体格式\n\n并不是所有的媒体格式都能 Android 上运行。表格\
  \ 3-2 显示了应该在大多数（如果不是全部）手机上运行的格式。\n\n**表格 3-2。** *支持的 HTML5 音频格式*\n\n| 格式 | Mime\
  \ 类型 | 文件扩展名 |\n| :--- | :--- | :--- |\n| OGG | audio/ogg | .ogg |\n| MP3 | audio/mpeg\
  \ | .mp3 |\n| WAV | audio/wav | .wav |\n| 3GP | audio/3gp | .3gp |\n| MP4 | audio/m4a\
  \ | .m4a |\n| AAC | audio/aac | .aac |\n| WMA | audio/x-msw | .wma |\n\n\n\n\n列表\
  \ 3-10 显示了如何在 HTML4 中实现相同的功能。\n\n**列表 3-10.** *在 HTML4 中创建页脚*\n\n```html\n<div id=\"\
  footer\">\n</div>\n```\n\n图 3-6 显示了 `<footer />` 通常在 DOM 中被渲染的位置。\n\n![Image 33](img/index-54_1.png)\n\
  \n# 第 3 章：HTML5\n50\n\n**图 3-6.** *带有 <footer /> 元素的文档结构*\n\n```html\n<header />\n\
  ```\n\n## Header 元素\n\n`<header />` 元素可以用于在文档中创建页头。`<header />` 标签在文档中可以使用多次。它通常包含一个\
  \ Logo 和/或一组页头元素。`<header />` 元素最常见的用途是在页面顶部添加 Logo 和导航。列表 3-11 显示了如何操作。\n\n虽然不是强制性的，但你可以用\
  \ `<nav />` 元素包裹通常用于导航的 `<ul />` 元素。这会让阅读你代码的开发者清楚地这是一个导航元素。\n\n**列表 3-11.** *在\
  \ HTML5 文档中创建页头*\n\n```html\n<header>\n<img src=\"logo.png\" alt=\"My Company’s\
  \ Logo\" />\n<nav>\n<h2>CHAPTER 3: HTML5</h2>\n51\n<ul>\n<li><a href=\"/home.html\"\
  >首页</a>/</li>\n<li><a href=\"/about.html\">关于我们</a>/</li>\n<li><a href=\"/contact.html\"\
  >联系我们</a>/</li>\n</ul>\n</nav>\n</header>\n```\n\n使用列表 3-12 中的代码在 HTML4 中实现相同的结果。\n\
  \n**列表 3-12.** *在 HTML4 中创建页头*\n\n```html\n<div id=\"header \">\n<img src=\"logo.png\"\
  \ alt=\"My Company’s Logo\" />\n<ul class=\"navigation\">\n<li><a href=\"/home.html\"\
  >首页</a>/</li>\n<li><a href=\"/about.html\">关于我们</a>/</li>\n<li><a href=\"/contact.html\"\
  >联系我们</a>/</li>\n</ul>\n</div>\n<hgroup />\n```\n\n## Hgroup 元素\n\n`<hgroup />`\
  \ 元素可以将相关的标题分组在一起，例如用于标题的 `<h1 />` 元素和用于副标题的 `<h2 />` 元素。<hgroup />` 元素不应包含头部元素以外的任何元素（即\
  \ `<h1 />`、`<h2 />`、`<h3 />`、`<h4 />` 等）。\n\n`<hgroup />` 在文档中的级别由该 `<hgroup />`\
  \ 中排名头部元素定义。\n\n列表 3-13 显示了如何在 HTML5 中使用 `<hgroup />`，列表 3-14 显示你可能如何在 HTML4 中对标题分组。\n\
  \n# 第 3 章：HTML5\n52\n\n**列表 3-13.** *使用 Hgroup 在 HTML5 中定义页头*\n\n```html\n<hgroup>\n\
  <h1>我的页头</h1>\n<h2>我的副标题</h2>\n</hgroup>\n```\n\n**列表 3-14.** *在 HTML4 中定义一组页头*\n\
  \n```html\n<div class=\"header-grouping\">\n<h1>我的页头</h1>\n<h2>我的副标题</h2>\n</div>\n\
  <mark />\n```\n\n## Mark 元素\n\n`<mark />` 元素可以用于突出文档中的文本。列表 3-15 显示了如何在 HTML5 中使用它，列表\
  \ 3-16 显示了在 HTML4 中如何结合 CSS 和 HTML 实现它。\n\n**列表 3-15.** *在 HTML5 中使用 Mark 标签*\n\n\
  ```html\n<p>这是给 Inga Lyon 的一个 <mark>重要</mark>提醒</p>\n```\n\n**列表 3-16.** *在 HTML4\
  \ 中高亮文本*\n\n```html\n<p>这是给 Inga Lyon 的一个 <em class=\"highlight\">重要</em>提醒</p>\n\
  <style type=\"text/css\">\nem.highlight {\nbackground: yellow;\n}\n</style>\n```\n\
  \n## Nav 元素\n\n`<nav />` 元素可以定义页面内的导航链接。`<nav />` 元素应该只用于定义页面主要导航元素，例如主导航或侧边/子导航。你可以在\
  \ `<nav />` 元素中添加任何内容，只要它包含指向网站内部内容的链接。列表 3-17 显示了如何在 HTML5 中使用 `<nav />` 元素，列表\
  \ 3-18 显示你可能如何在 HTML4 中定义导航。\n\n**列表 3-17.** *在 HTML5 中创建 Nav*\n\n```html\n<nav>\n\
  <ul>\n<li><a href=\"/home.html\">首页</a>/</li>\n<li><a href=\"/about.html\">关于我们</a>/</li>\n\
  <li><a href=\"/contact.html\">联系我们</a>/</li>\n</ul>\n</nav>\n```\n\n**列表 3-18.**\
  \ *在 HTML4 中创建导航*\n\n```html\n<ul class=\"navigation\">\n<li><a href=\"/home.html\"\
  >首页</a>/</li>\n<li><a href=\"/about.html\">关于我们</a>/</li>\n<li><a href=\"/contact.html\"\
  >联系我们</a>/</li>\n</ul>\n```\n\n## Output 元素\n\n`<output />` 元素可以显示计算结果。`<output\
  \ />` 元素在显示表单结果时非常有用。**注意：**提交 `<output />` 标签不会发送计算结果。列表 3-19 显示了如何在 HTML5 中使用\
  \ `<output />` 元素，列表 3-20 显示你可能如何在 HTML4 中实现。\n\n**列表 3-19.** *在 HTML5 中使用 Output\
  \ 元素*\n\n```html\n<output for=\"calc\">结果</output>\n```\n\n**列表 3-20.** *创建类似 Output\
  \ 的*\n\n```html\n<span id=\"result\">结果</span>\n```\n\n# 第 3 章：HTML5\n53 到 57\n\n\
  ## Section 元素\n\n`<section />` 元素可以定义文档中的章节。一个误解是用 `<section />` 替换所有的 `<div>` 元素。如果你使用\
  \ `<section />` 是为了样式而不是创建语义文档，你应该使用带有类的 `<div>`。\n\n从列表 3-21 可以看出，你可以在 `<section\
  \ />` 元素中嵌套 `<article>` 元素。实际上，你可以在 `<section />` 中添加任何喜欢的 HTML 元素。\n\n**列表 3-21.**\
  \ *在 HTML5 中使用 Section 元素*\n\n```html\n<section>\n<article>\n<header>\n<h1>文章标题</h1>\n\
  <p>\n<h2>第 3 章：HTML5</h2>\n57\n由 Daniel Carpenter 创建于 <time pubdate=\"2012-03-15\"\
  >2012 年 3 月 15 日</time>\n</p>\n</header>\n<p>文章内容</p>\n<section class=\"comments\"\
  >\n<article id=\"comment-1\">\n<header>\n<p>\n来自 Becci，于 <time pubdate=\"2012-03-20\"\
  >2012 年 3 月 20 日</time>\n</p>\n</header>\n<p>这是一篇很棒的文章，Dan，可能需要改进一下 :D</p>\n</article>\n\
  </section>\n<footer>\n<address>\n<p>\n作者：<a rel=\"author\" href=\"mailto:daniel.carpenter@somewhere.com\"\
  >Daniel Carpenter</a>\n<br />\n在 Twitter 上关注他\n<a rel=\"author\" href=\"http://www.twitter.com/mrdanc\"\
  >Twitter</a>\n</p>\n</address>\n</footer>\n</article>\n</section>\n```\n\n\n\n\n\
  \n# HTML5\n\n`<video />` 元素可用于在页面嵌入视频。我将在本章稍后的“使用 HTML5 嵌入视频”部分介绍这一内容。\n\n`<video\
  \ />` 元素提供了一种使用 Flash 在 HTML 文档中嵌入视频的替代方案。它还具有几个 JavaScript API 来控制视频的播放。在 Android\
  \ 4（Ice Cream Sandwich）之前的版本的 Android 浏览器中，播放的视频会自动进入全屏，但在 Android 4 及以上版本中将保持在原位。\n\
  \n表 3-3 显示了 `<video />` 元素的可用属性。\n\n**表 3-3.** *HTML5 视频属性*\n\n| 属性 | 值 | 描述 |\n\
  | :--- | :--- | :--- |\n| `src` | — | 用于指定单个视频文件，而不是使用 `<source />` 标签。 |\n| `preload`\
  \ | `none \\| metadata \\| auto` | 用于指定是否预加载视频文件。建议将其设置为 `none` 或 `metadata`。这可以防止浏览器在用户不知的情况下下载整个视频文件。\
  \ |\n| `autoplay` | `autoplay` | 用于告诉浏览器自动播放视频文件。如果你不想让视频自动播放，请不要添加此元素。 |\n| `loop`\
  \ | `loop` | 用于指定视频是否连续循环。此属性不接受数字。如果你想音频循环特定次数，可以使用 JavaScript 视频 API 实现。 |\n|\
  \ `muted` | `muted` | 这将静音音频。注意，这在 Android 浏览器中似乎不受支持。 |\n| `controls` | `controls`\
  \ | 用于告诉浏览器是否渲染默认控件。如果你为自己的视频播放器制作了 UI，这会非常有用。 |\n| `height` | `像素单位的高度` | 指定视频元素的初始高度。\
  \ |\n| `width` | `像素单位的宽度` | 指定视频元素的初始宽度。 |\n| `poster` | `海报图 URL` | 这是视频播放前在视频图像\
  \ `tag` 标签内使用的图像路径。 |\n\n`<video />` 元素目前还支持大多数流行的视频容器和编码器。表 3-4 显示了 Android 浏览器目前支持的格式和\
  \ MIME 类型。如何为这些格式编码将在本章稍后介绍。\n\n**表 3-4.** *HTML5 视频支持的格式*\n\n| 容器 | 扩展名 | MIME\
  \ | 备注 |\n| :--- | :--- | :--- | :--- |\n| MPEG-1 | `.mpg, .mpeg, .mpv` | `video/mpeg`\
  \ | — |\n| MP4 | `.mp4` | `video/mp4` | — |\n| OGG | `.ogv, .ogg` | `application/ogg`\
  \ | — |\n| WebM | `.webm` | `video/webm` | 仅在 Android 4 (Ice Cream Sandwich) 中支持\
  \ |\n| MKV | `.mkv` | `video/x-matroska` | — |\n| Windows Media | `.wmv` | `video/x-ms-wmv`\
  \ | — |\n\n## 在 HTML5 中处理多媒体\n\n随着移动设备速度不断提高，移动网络浏览器支持越来越多的视频音频容器和编码器，现在是探索为移动 Web\
  \ 应用添加视频的最佳时机。\n\n在为移动网站添加视频时，有几点是你需要考虑的。遗憾的是，这并不是为特定的文件扩展名或格式编码视频音频那么简单。在为 HTML5\
  \ 编码视频音频时，有四点是你应该考虑的：\n\n- 设备支持的容器\n- 设备上支持的编码器和解码器\n- 最终视频和音频的质量\n- 最终视频和音频的文件大小\n\
  \n为了播放视频，你需要使用目标设备可以理解并播放的编码器对视频音频进行编码。\n\n**注意：** 编码器由两部分组成：编码器和解码器。当你使用特定编码器压缩视频时，需要相同的编码器来解压视频以准备播放。不同的编码器能够实现不同类型和质量的压缩（例如，`H.264`\
  \ 编码视频的方式与 `VP8` 不同）。由于压缩视频的方式不同，不同的编码器会对文件大小和质量产生影响。\n\n编码视频的质量取决于你设置的比特率；这也会直接影响文件大小。如果你有一个目标文件大小，可以计算视频的比特率应该是多少，并从此开始工作。以下公式可以帮助你计算：\n\
  \n```\n((video bitrate [kb/sec] + audio bitrate [kb /sec]) * length [seconds]) *\
  \ 0.125) = file size [Kb]\n```\n\n网络上有各种比特率计算器，它们可以根据许多其他因素帮助你计算视频或音频文件应该是什么比特率。这在使用如\
  \ `FFmpeg` 或 `Mencoder` 等命令行编码工具时非常有用。\n\n压缩/未解压缩的视频音频外部是一个容器。容器通常会提供关于视频多个轨道的详细信息。一条轨道将用于视频本身，第二条轨道将用于视频音频。容器并不一定描述视频或音频文件是如何编码的，但它可能会定义某种标准，规定如何为该特定容器编码视频。\n\
  \n在选择容器时，选择一个支持有限数量编码器的容器是重要的。这将编码变得简单得多，因为你不需要研究哪些编码器是可用的。例如，马特罗卡 (`MKV`) 容器支持几乎任何视频编码器，而\
  \ WebM 只支持 `VP8` 视频和 `Vorbis` 音频。为了避免混淆，表 3-5 显示了你应该支持的最流行的编码器和容器。\n\n**表 3-5.**\
  \ *HTML5 建议视频容器和编码器组合*\n\n| 容器 | 编码器 | 音频编码器 | MIME |\n| :--- | :--- | :--- | :---\
  \ |\n| MP4 | H.264 (Baseline) | AAC | `video/mp4` |\n| WebM | VP8 | Vorbis | `video/webm`\
  \ |\n\nAndroid 文档还根据质量建议了以下分辨率，见表 3-6。\n\n**表 3-6.** *HTML5 建议分辨率*\n\n| 质量 | 分辨率\
  \ | 每秒帧 (FPS) |\n| :--- | :--- | :--- |\n| SD (低质量) | 176 × 144px | 12 |\n| SD (高质量)\
  \ | 480 × 360px | 30 |\n| HD (并非所有设备) | 1280 × 720px | 30 |\n\n表 3-7 显示了安卓音频容器和编码器。\n\
  \n**表 3-7.** *HTML5 建议音频容器和编码器组合*\n\n| 容器 | 编码器 | MIME |\n| :--- | :--- | :--- |\n\
  | MP3 | MP3 | `audio/mpeg` |\n| OGG | Vorbis | `application/ogg` |\n\n支持这些容器和编码器应该能够满足所有\
  \ Android 设备，而无需进行大量的编码和测试。\n\n## 为移动 Web 优化视频\n\n现在你已经了解为 Web 编码视频的复杂性。有很多应用程序允许你为\
  \ Web 编码视频。其中一些是免费开源的桌面应用程序（例如适用于 Mac/Windows 的 `Easy HTML5 Video` 以及新的适用于 Mac/Windows\
  \ 的 `Miro Video Encoder`），另一些是托管的基于 Web 的解决方案，并提供在线托管视频的支持。你应该使用最适合你需求的编码解决方案。\n\
  \n### 托管解决方案\n\n托管解决方案对于按需编码，以及如果你希望将大量网站流量转移到另一个服务器来说是完美的。这些托管解决方案中最简单用的是 `bitsontherun.com`，虽然\n\
  \n\n\n\n\n`encoding.com` 和 `zencoder.com` 提供了更多关于视频编码的控制，如图 3-7 所示。\n\n![Image 34](img/index-66_1.jpg)\n\
  \n# 第 3 章：HTML5\n\n62\n\n**图 3-7.** *encoding.com 上的编码选项*\n\n如你所示，`bitsontherun.com`\
  \ 通过提供基本选项来创建编码设置要简单得多，如图 3-8 所示。如果你想对视频的压缩选项有更多的控制权，那么 `encoding.com` 和 `zencoder.com`\
  \ 将提供最佳选项。如果你只是想编码视频而不担心各种压缩选项，那么 `bitsontherun.com` 是最佳选择。如果你没有非常强大的机器并想要快速编码视频，或者你有大量的视频需要编码，那么托管式编码解决方案将提供最佳方案。托管解决方案中提供的预设也在不断地完善和调优。\n\
  \n使用托管解决方案的缺点是，你需要根据上传和下载的量付费，在 `zencoder.com` 的情况下，你根据编码的视频小时数付费。\n\n![Image 35](img/index-67_1.jpg)\n\
  \n第 3 章：HTML5\n\n63\n\n**图 3-8.** *bitsontherun.com 上的编码选项*\n\n### 桌面解决方案\n\n桌面编码解决方案非常适合小规模的编码运行。如果你有一台低配置电脑，请准备去最近的酒吧喝两瓶啤酒，同时在电脑旁边开个风扇防止它过热！\n\
  \n视频编码需要大量的处理能力，渲染单帧可能需要几秒钟。这个过程非常耗时。你电脑的处理器越好，编码时间就越短。\n\n使用命令行工具（如 `FFMPEG` 和\
  \ `Mencoder`）而不是提供界面的 GUI 会有其优势。例如，它让你能够从一个用 `Python`、`PHP` 或 `Ruby` 编写的服务器端脚本触发编码任务。你还可以将各种编码参数封装在\
  \ `bash` 脚本中。这允许你可能一次性批量编码整个装满视频的文件夹。\n\nWindows 和 Mac 上最简单的免费桌面解决方案是 `Miro Video\
  \ Converter`，如图 3-9 所示。\n\n![Image 36](img/index-68_1.jpg)\n\n第 3 章：HTML5\n\n64\n\
  \n**图 3-9.** *Mac 版 Miro Video Converter*\n\n如你所见，它有一个简单的拖放式 UI，并可以转换为多种不同的格式。为基于桌的\
  \ HTML5 网站编码视频时，`Miro` 是完美的；然而，你可能希望在不损害质量的情况下，尽可能为移动网页视频挤榨出更多空间。目前，`Miro` 不允许你调整任何输出设置。\n\
  \n正因如此，目前的最佳选项是使用 `bitsontherun.com` 为移动网页编码视频。\n\n![Image 37](img/index-69_1.jpg)\n\
  \n![Image 38](img/index-69_2.jpg)\n\n第 3 章：HTML5\n\n65\n\n### 使用 Bits on the Run\
  \ 编码视频\n\n首先要做的是访问 `www.bitsontherun.com` 并创建一个免费账户。免费账户每月将为你提供高达 1 小时的视频存储空间和 20\
  \ 小时的流媒体时间。这对于这本书来说足够了。如果你需要更多，可以随时升级到专业账户。\n\n创建账户后，你将为你的编码任务创建模板。模板允许你为视频和音频创建自定义的编码模板。你可以创建一个模板，并将其用于所有的视频和音频文件。\n\
  \n**注意：** 遗憾的是，如果你创建了模板，必须手动使用新模板重新编码任何视频。有一种通过 `Bits on the Run API` 规避这个问题的方法。\n\
  \n登录并进入账户页面，如图 3-10 所示。\n\n**图 3-10.** *bitsontherun.com 上的账户选项*\n\n点击账户页面上的 `properties`\
  \ 选项卡（同样如图 3-10 所示）。在账户属性下，点击 `Templates` 选项卡。\n\n从这里，你将创建两个模板。一个用于 `MP4 (H.264)`，另一个用于\
  \ `WebM (VP8)`。\n\n点击“Add new template”（添加新模板）按钮，你可以在页面底部找到它，如图 3-11 所示。\n\n**图\
  \ 3-11.** “添加新模板”按钮\n\nh\n\n![Image 39](img/index-70_1.jpg)\n\n第 3 章：HTML5\n\n66\n\
  \n随后你将看到一个与图 3-12 所示类似的“Create new template”（创建新模板）对话框。确保已设置以下设置：\n\n- Name: `HTML5\
  \ MP4`\n- Format: `MP4 (H.264/AAC)`\n\n点击。\n\n**图 3-12.** “创建新模板”对话框\n\n类似于图 3-13\
  \ 所示的“properties”页面将呈现在你面前。确保设置了以下选项：\n\n- Automate: Automatically apply this template\
  \ to new videos\n- Target Width: `480`\n- Upscaling: Always build this template,\
  \ even if the original is smaller\n- Video Quality: Good\n- Audio Quality: Good\n\
  - Watermark: No\n\n点击 `。\n\n点击 `Save`（保存）。\n\n你将需要为 `WebM` 重复此过程。在“Create new template”对话框中输入以下信息：\n\
  \n- Name: `HTML5 WebM`\n- Format: `WebM (VP8/Vorbis)`\n\n在“properties”页面上输入以下信息：\n\
  \n- Automate: Automatically apply this template to new videos\n- Target Width: `480`\n\
  - Upscaling: Always build this template, even if the original is smaller\n- Video\
  \ Quality: Good\n- Audio Quality: Good\n- Watermark: No\n\n点击 `Save`。\n\n你现在应该准备好向账户上传视频了。为了完成操作，进入\
  \ `videos` 选项卡，并点击右侧栏的“Upload video”，如图 3-10 所示。\n\n**图 3-13.** *属性*\n\n![Image\
  \ 40](img/index-71_1.jpg)\n\n![Image 41](img/index-71_2.jpg)\n\n第 3 章：HTML5\n\n\
  67\n\n你将看到一个与图 3-14 所示类似的“Upload video: Step 1”对话框。\n\n**图 3-14.** “上传视频：第一步”对话框\n\
  \n在字段中输入适当的信息。由于这是测试视频，你可以选择任何内容。从现在开始，“My Video”指的是你上传的视频。点击“Continue to upload”按钮。\n\
  \n你现在应该处于“Upload video”对话框的第 2 步。点击 `Browse` 按钮，如图 3-15 所示选择你想要作为示例的视频。确保选择的视频小于\
  \ 100 MB；否则你可能需要等待很长时间才能完成测试视频的上传。\n\n**图 3-15.** “上传视频：第二步”对话框\n\n上传完成后，Bits on\
  \ the Run 将开始编码过程。你的视频现在已准备好嵌入。你可以下载视频并将其复制到你的移动网页项目中，或者使用 `<video />` 元素的 `src`\
  \ 属性直接链接。下载视频的好处是，你不需要担心 Bits on the Run 在你达到限额时中断服务。\n\n### 使用 HTML5 嵌入视频\n\n在网页上嵌入视频曾是一个非常漫的过程。在\
  \ Flash 流行之前，所有的浏览器、电脑甚至同一操作系统的不同版本对编码器和容器的支持各不相同。当时没有真正的通用格式，你无法嵌入同一个视频的多种格式以便浏览器能够为用户选择正确的视频。\n\
  \nFlash 的出现解决了大部分这些问题。通过只需要一个插件就能播放所有格式，它成为了网络视频领域的“闪光骑士”。以至于几乎每个网站都使用它来向用户提供视频。\n\
  \n后来智能手机的出现让移动端 Flash 变成了一场噩梦。它需要大量的 CPU，这会消耗手机电池。\n\n\n\n\n就像吸血鬼一样。Flash 在几乎任何便携设备上的情况也是如此，它会消耗大量的\
  \ CPU 资源，这不仅影响了机器的性能，还会影响由于 CPU 散热和供电带来的电池消耗。时至今日，Flash 在 Mac 上仍然消耗大量的 CPU 资源。\n\
  \n此外，开发者在制作 Flash 内容时，往往并没有考虑手机终端。因此，当你在手机上观看针对桌面设备设计的视频时，你通常会得到一个 500 MB 的高清视频，而该视频并没有针对你的手机进行优化。这对于用户的钱包也有影响，因为每月\
  \ 500 MB 的流量计划在几分钟内就会被一个视频耗尽。\n\n`HTML5` 诞生了。终于，焦点转向了浏览器、标准和硬件加速，而不再需要第三方插件。\n\n\
  HTML5 带来了 HTML5 视频。HTML5 视频为浏览器提供在浏览器内支持视频解码的方法，无论平台支持何种解码器。这意味着，如果用户使用 Android\
  \ 浏览器，他们将绝对支持 `WebM` 或 `MP4`；如果他们使用 Safari 浏览器，他们将绝对支持 `MP4` 但不支持 `WebM`。不仅如此，HTML5\
  \ 视频还支持多种不同类型的视频源。这意味着你可以提供针对每个解码器和容器优化的视频文件。浏览器将从源列表中选择最佳解码器和容器，对其进行流式传输，并交付给用户的浏览器。\n\
  \n# 第 3 章：HTML5\n\nHTML5 规范的新特性还包括在视频源中支持媒体查询（media queries）。这可以确保如果你使用平板电脑设备，你可以获得分辨率更高的视频，而无需手动选择想要查看的媒体画质。如果你使用的是手机终端，你将获得针对手机优化且文件大小较小的视频，这样它就不会耗尽你所有的流量额度。\n\
  \n**注意：** HTML5 规范中确实存在视频媒体查询，但目前似乎还没有任何浏览器支持它。\n\n在 HTML5 中嵌入视频相对简单。你使用 `video`\
  \ 标签并指定视频的 `width` 和 `height` 属性。然后，你可以为视频指定 `poster`（海报）帧。封面帧是视频中的单幅静态图像，你可以在用户点击播放按钮之前将其显示给他们。\n\
  \n在 Aptana 中创建一个名为 `tutorials` 的新文件夹，并在其中创建一个名为 `video` 的文件夹。此文件夹将用于本次练习。在 `video`\
  \ 文件夹中，创建一个 `media` 文件夹。将你从 Bits on Run 编码并下载的视频和封面图像文件拷贝到 `media` 文件夹，并将其重命名如下：\n\
  \n- `video.webm`\n- `video.mp4`\n- `poster.jpg`\n\n在 `video` 文件夹中创建一个名为 `index.html`\
  \ 的新文件。你的文件夹结构应该如下：\n\n- `tutorials`\n- `video`\n- `media`\n    - `video.webm`\n\
  \    - `video.mp4`\n    - `poster.jpg`\n- `index.html`\n\n在 Aptana 中打开 `index.html`\
  \ 并输入列表 3-23 中的 HTML 代码。\n\n**列表 3-23。** *在 HTML5 中嵌入视频*\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, maximum-scale=1\">\n<title>练习视频</title>\n</head>\n<body>\n<video\
  \ controls width=\"480\" height=\"270\" poster=\"media/poster.jpg\">\n<source src=\"\
  media/video.mp4\" type=\"video/mp4\">\n<source src=\"media/video.webm\" type=\"\
  video/webm\">\n<p>\n您的浏览器不支持 HTML5 视频，<a href=\"media/video.mkv\">点击此处下载</a>\n</p>\n\
  </video>\n</body>\n</html>\n```\n\n保存并导出你的视频。在 Android 浏览器中打开该文件。URL 应该是 `http://<你的电脑\
  \ IP 地址>/tutorials/video/media/`。你应该看到一个与图 3-17 类似的屏幕。\n\n![Image 44](img/index-76_1.jpg)\n\
  \n**图 3-17。** *与内容内联的 HTML5 视频*\n\n点击播放按钮，视频将开始缓冲并播放。从 Android 4+ 开始，Android 浏览器将内联内容播放视频，而不是自动全屏。这带来了一个小问题，因为它导致新旧设备处理视频的方式不一致。解决方案是使用\
  \ JavaScript  API 自动将视频全屏。这将在第 7 章中介绍。\n\n## 为移动 Web 优化音频\n\n幸运的是，Bits on Run 也支持网页的音频编码和托管。然而，由于音频编码的\
  \ CPU 消耗远低于视频编码，你可以使用桌面软件来完成。最流行的免费跨平台音频应用程序是 `Audacity`。你可以从 Audacity 网站 `http://audacity.sourceforge.net/download/`\
  \ 下载并安装当前的稳定 Beta 版本。\n\n为移动 Web 编码音频时适用相同的规则：\n\n- 确保文件大小很小。\n- 确保最终音频的质量足以通过耳机和小型扬声器听到。\n\
  \n与视频编码一样，你需要在质量和文件大小之间找到平衡点。与用户必须同时关注质量和文件大小的视频不同，音频用户主要是在听音频，因此音频质量至关重要。这意味着必须更加小心地确保每个轨道都经过转码和压缩。\n\
  \n**注意：** 压缩有两种类型：无损（lossless）和有损（lossy）。无损压缩尝试以这种方式编码音频使其编码后具有更小的文件尺寸，但在解码时与之前相同。有损压缩将分析音频内容并移除可能听不到的部分。这意味着无论使用何种技术，有损压缩都会丢失信息。\n\
  \n### 使用 Audacity 编码音频\n\n使用 `Audacity` 编码音频是一个非常简单的过程。为了本示例，你需要下载一个未压缩的音频文件，因此前往\
  \ SoundCloud (`www.soundcloud.com`)。在 SoundCloud 上搜索你喜欢的任何音乐轨道，并确保如图 3-18 所示选择以下选项：\n\
  \n- 未压缩文件\n- 轨道应为：可下载\n- 仅搜索 Creative Commons 许可的轨道\n- 它们应该是：可商用\n\n![Image 45](img/index-78_1.jpg)\n\
  \n**图 3-18。** *soundcloud.com 搜索选项*\n\n选择任何具有高范围的歌曲（dubstep 类的歌曲是一个很好的选择）并下载它。这将给你一个可以实验的未压缩\
  \ WAV 或 AIFF 文件。\n\n我们对这段音乐轨道的目标是将其每分钟音频的文件大小控制在 0.5 MB 到 1 MB 之间。这意味着在 HSDPA 上加载\
  \ 1 分钟音频需要 4--8 秒，在 3G 上需要 1---2 秒。\n\n**表 3-8。音频平均下载时间**\n\n| 连接类型 | 平均下载速度 | 平均下载时间（每\
  \ MB） |\n| :--- | :--- | :--- |\n| 3G | 4 Mbps | 2 秒 |\n| HSDPA | 1 Mbps | 8 秒 |\n\
  \n\n\n\n\n本书使用的示例轨道是一个 `WAV` 文件，其设置如下：大小 86.1 MB，时长 4:59，平均每分钟 18.75 MB。该轨道在每种格式下的目标文件大小将在\
  \ 4 到 5 MB 之间。\n\n## 编码 OGG\n\n你将首先把音频文件编码为 `OGG` 格式。这是两种格式中较简单的，因为 Audacity 仅提供了一个选项进行配置。打开\
  \ Audacity，通过 `File -> Open` 打开文件并选择你刚刚下载的文件。如果显示图 3-19 所示的警告，请确保勾选了“编辑前创建文件的副本（更安全）”和“不再再次询问并始终使用我的上方选择”。\n\
  \n![Image 46](img/index-79_1.jpg)\n\n# 第 3 章：HTML5\n75\n\n**图 3-19. Audacity 的警告对话框**\n\
  \n当文件处理完成后，你将看到该文件的波形图，类似于图 3-20。\n\n你现在可以将音频文件导出为 `OGG Vorbis` 音频文件。转到 `File ->\
  \ Export`。在格式下，选择“Ogg Vorbis Files”，并点击选择右侧的“Options…”按钮。\n\n![Image 47](img/index-80_1.jpg)\n\
  ![Image 48](img/index-80_2.jpg)\n\n# 第 3 章：HTML5\n76\n\n**图 3-20 轨道的波形**\n\n你将看到一个类似于图\
  \ 3-21 的选项对话框。选择最低质量并点击 OK。Vorbis 是可变比特率（VBR）编码的一种。VBR 会根据每个段音频的复杂性在整个轨道中使用不同的比特率。与以固定比特率编码（质量相同由于音频复杂性导致文件大小大得多）的文件相比，这种方法可能会产生一个质量合理的非常小的文件。\n\
  \n**图 3-21. Ogg Vorbis 导出选项**\n\n这种编码的结果应该是一个音频轨道，听起来与原始 `WAV` 文件相似，但文件大小小于 3 MB。本书使用的测试轨道在\
  \ `OGG` 最低质量设置下编码时，结果文件大小为 2.5 MB，音质没有明显差异。\n\n![Image 49](img/index-81_1.jpg)\n\
  \n# 第 3 章：HTML5\n77\n\n## 编码 MP3\n\n编码 `MP3` 音频的过程与导出 Vorbis 音频类似。按照相同的步骤打开原始 `WAV`\
  \ 文件，并到 `File -> Export`。在格式下拉菜单中选择 `MP3 Files`（而不是 `Ogg Vorbis Files`）。点击 `Options…`\
  \ 按钮。你将看到一个与图 3-22 类似的导出对话框。\n\n`MP3 VBR` 编码的效果似乎没有 `OGG Vorbis` 好。即使在最高压缩设置下，音频文件的大小仍然\
  \ `OGG Vorbis` 压缩输出的两倍。使用 128 kbps 的平均比特率模式将为你提供与最低 `OGG Vorbis` 压缩选项相同或相似的质量，但文件大小更大，且仍处于每分钟音频\
  \ 0.5 到 1 MB 可接受的文件大小范围内。\n\n**图 3-22. MP3 导出选项**\n\n点击 OK 并保存。如果你想在下一个屏幕输入元数据，请继续输入；否则，再次点击\
  \ OK，音频文件将开始导出。\n\n## 在 HTML5 中嵌入音频\n\n使用 HTML5 嵌入音频非常简单。在 HTML5 之前，没有真正的标准方法来嵌入具有不同解码器的音频，尤其是在移动端。在移动端，首选方法是使用\
  \ Flash 或提供指向 `3GP` 文件的链接，这种格式被移动设备广泛支持。随着在移动设备上传输和播放高质量音乐的能力变得流行，`audio` 标签将开始被广泛使用。\n\
  \n在 HTML5 中嵌入音频的过程与嵌入视频类似。你使用 `audio` 标签并指定多个源，让浏览器选择正确的源。\n\n# 第 3 章：HTML5\n78\n\
  \n在 `tutorials` 文件夹创建一个名为 `audio` 的新文件夹，然后在 `audio` 文件夹中创建一个名为 `media` 的新文件夹，并创建一个名为\
  \ `index.html` 的新文件。将转换后的音频文件复制到 `media` 文件夹并将它们重命名为 `audio.ogg` 和 `audio.mpg`。你的你的文件夹结构看起来如下：\n\
  - tutorials\n- audio\n    - media\n        - audio.mp3\n        - audio.ogg\n  \
  \  - index.html\n\n打开 `index.html` 文件并使用列表 3-24 中的代码。\n\n**列表 3-24. 在 HTML5 中嵌入音频**\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1\">\n<title>Testing\
  \ Audio</title>\n</head>\n<body>\n<audio controls>\n<source src=\"media/audio.ogg\"\
  \ type=\"application/ogg\">\n<source src=\"media/audio.mp3\" type=\"audio/mpeg\"\
  >\n<p>\n您的浏览器不支持 HTML5 音频，<a href=\"media/audio.mp3\">点击此处</a>\n</p>\n</audio>\n\
  </body>\n```\n\n![Image 50](img/index-83_1.jpg)\n\n# 第 3 章：HTML5\n79\n\n```html\n\
  </body>\n```\n\n![Image 50](img/index-83_1.jpg)\n\n# 第 3 章：HTML5\n79\n\n**图 3-23.\
  \ HTML5 中的音频**\n\n## HTML5 移动端\n\n表单可能是很枯燥的话题，但请记住 HTML5 将在第 7 章介绍。处理表单需要考虑屏幕大小对标签和字段的影响。图\
  \ 3-24 显示了移动端和桌面端的差异。\n\n![Image 51](img/index-84_1.jpg)\n\n# 第 3 章：HTML5\n80\n\n\
  **图 3-24. 移动端（左）和桌面端（右）表单**\n\n## 不同类型的字段\n\n根据所需的字段类型和数据，可以使用不同的输入类型。表 3-9 显示 HTML5\
  \ 字段类型在 Android 浏览器中的支持情况。\n\n| 字段类型 | 支持 |\n| :--- | :--- |\n| color | no |\n|\
  \ datalist | no |\n| date | no |\n| datetime | no |\n| email | yes |\n| number |\
  \ yes |\n| range | no |\n| search | no |\n| tel | yes |\n| url | no |\n\n**表 3-9.\
  \ Android 浏览器支持的字段类型**\n\n# 第 3 章：HTML5\n81\n\n所示，Android 浏览器目前支持的字段类型只有 `email`、`number`\
  \ 和 `tel`。其他字段类型应该在未来的某个时刻实现。你可以现在实现它们并绕过不支持的问题，但在支持最终到来后可能会遇到问题。\n\n你可以通过在设备上测试这一点，在你的项目内创建一个名为\
  \ `forms` 的新文件夹。在该文件夹内创建一个名为 `index.html` 的文件。列表 3-25 显示了产生三种不同输入表单类型的代码。\n\n**列表\
  \ 3-25. 输入类型代码**\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>Form Fields</title>\n</head>\n<body>\n<form>\n<fieldset>\n<legend>HTML5\
  \ 输入类型</legend>\n![Image 52](img/index-86_1.jpg)\n<p>\n<label for=\"email\">Email</label>\n\
  <input type=\"email\" name=\"email\" placeholder=\"someone@somewhere.com\">\n</p>\n\
  <p>\n<label for=\"number\">Number</label>\n<input type=\"number\" name=\"number\"\
  >\n</p>\n<p>\n<label for=\"telephone\">Telephone</label>\n<input type=\"tel\" name=\"\
  telephone\" placeholder=\"+44012345678901\">\n</p>\n</fieldset>\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n\n# 第 3 章：HTML5\n\n这是一个标准的 HTML5 表单。你可能会注意到，某些字段上有一个名为 `placeholder`\
  \ 的属性。`placeholder` 属性允许你为表单输入显示实用的示例文本，帮助用户确定他们需要在表单字段中输入什么。当用户点击以填充表单字段时，`placeholder`\
  \ 文本将会消失。\n\n根据输入类型的不同，系统会呈现不同的键盘，帮助用户更快地输入信息。图 3-25 显示了用于支持的三种输入类型的不同键盘布局。\n\n\
  **图 3-25。** 数字（左）、电话（中）和电子邮件（右）的键盘布局。在你的手机浏览器中加载新网页进行测试。\n\n## 总结\n到此，Android 的\
  \ HTML5 学习宣告结束。通过本章，你应该已经获得了许多关于为网页和移动网络编码视频和音频的知识。你现在应该对编码媒体的不同方式有了基本的了解，并且知道你并不需要一台强大的机器来编码媒体，只需要一个快速的互联网连接即可。\n\
  \n本章带你学习了 Android 浏览器目前支持的所有新 HTML5 元素以及如何有效地使用它们。希望这一章能为你书中后续的内容做好准备，因为我们将开始更详细地探索交互性。HTML\
  \ 本身提供了基础，我们在书中后续将使用 CSS 进行展示，使用 JavaScript 进行交互，并在基础上进行构建。\n\n在下一章中，你将通过创建 HTML\
  \ 框架来关注移动 Web 应用的开端。在本书中，你将学习移动 Web 开发的一个特定方面，并使用这些知识来构建和增强你的应用程序。这被称为渐进增强（progressive\
  \ enhancement），是 Web 开发采用的一种实践，以确保你的应用程序无论功能如何都能在所有平台上运行。\n\n你还将学习移动 Web 的三种不同的展示解决方案，包括为应用程序的每个页面使用标准\
  \ HTML 页面、使用所有页面都位于单个 HTML 文件中的 `<div />` 容器的卡片系统，以及使用 Ajax 加载每个页面。\n\n下一章非常实用，所以打开\
  \ Aptana Studio 准备好编写代码吧！\n\n# 第 4 章：启动你的项目\n\n## 使用 HTML5\nHTML 为任何网络项目提供了一个良好的起点。它本质上为你提供了一个骨架，以便你使用\
  \ CSS（视觉样式）和 JavaScript（交互性）增强网页。对于书中的三个工作坊（HTML5、CSS 和 JavaScript），你将逐步增强一个名为 `MoMemo`\
  \ 的移动 Web 应用。`MoMemo` 将利用以下 HTML/HTML5 特性：\n\n* Canvas\n* JavaScript APIs\n* CSS3\
  \ 过渡\n* 媒体查询\n* HTML5 视频/音频\n* 离线存储\n\n在本章中，你将学习三种不同的网页布局方法，取决于你正在制作的移动 Web 应用类型。你还将开始在\
  \ HTML 中为 `MoMemo` 应用创建框架。在此之前，你将学习如何将移动应用从想法、需求收集、信息架构（IA），最后在 HTML5 中进行编码。你还将简要介绍应用程序缓存，该功能允许你指定哪些元素缓存在用户的移动设备上，以及在没有网络连接时如何退回到不应缓存的文件。\n\
  \n## 分页策略\n在 HTML 中创建页面的三种主要方法：\n\n* 标准 HTML：创建标准的 HTML 页面并链接到它们\n* 单页 Ajax：使用单个页面并使用\
  \ AJAX 加载后续页面\n* 单页容器：使用单个页面作为容器，将多个页面放在 `<div />` 容器中，并使用 JavaScript 在之间切换\n\n\
  每种方法都有其优缺点。例如，一个具有许多页面和资源（图像、CSS、JavaScript）的移动 Web 应用在使用单页容器方法时可能会遇到性能问题，因为所有资源和页面都会在首次加载页面时被加载。因此，Ajax\
  \ 或标准 HTML 方法可能提供更好的性能和加载速度。\n\n对于小型应用程序和原型设计，单页容器方法可能是首选。CSS3/JavaScript 可以处理页面之间的动画过渡，而且由于资源数量可能很小，它对页面加载不会产生很大影响。这可能是更优的，因为终端用户不需要等待通过\
  \ Ajax 或标准 HTML 方法加载页面。这创建了更像 App 的体验。\n\n对于更简单的应用程序，标准 HTML 方法可能是首选。然而，页面之间的动画可能变得不切实际，而且在页面间进行导航时，页面和资源的加载会有短暂的等待时间。\n\
  \n**注意：** 为了完成本章的练习，请在你的 Aptana 项目中创建一个名为 `exercises` 的新文件夹，并在其中创建一个名为 `chapter4`\
  \ 的文件夹。我们将在示例中将其称为“章节文件夹”。\n\n### 使用标准 HTML 进行分页\n创建标准 HTML 分页的方法非常简单。首先，在项目中的 `chapter\
  \ folder` 中创建一个名为 `standard` 的新文件夹，并创建两个基础的移动友好网页，命名为 `index.html` 和 `index2.html`，如列表\
  \ 4-1 所示。\n\n**列表 4-1。** 基础 HTML 移动网页\n```html\n<!DOCTYPE html>\n<html lang=\"en-GB\"\
  \ dir=\"ltr\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"\
  width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0; target-densitydpi=device-dpi;\"\
  />\n<title>Standard Paging</title>\n</head>\n<body>\n</body>\n</html>\n```\n这里没什么特别的，正如第\
  \ 1 章解释的那样，我们设置了 `charset` 和 `viewport` 标记以确保页面能够相应比例并防止用户用手指缩放。我们还为了起见设置了页面标题。在\
  \ `index.html` 的主体创建一个链接和标题，如列表 4-2 所示。\n\n**列表 4-2。** 在 index.html 中创建链接\n```html\n\
  <h1>Page 1</h1>\n<a href=\"./index2.html\">Page 2</a>\n```\n在 `index2.html` 的主体中创建另一个返回上一个页面的链接，如列表\
  \ 4-3 所示。\n\n**列表 4-3。** 在 index2.html 中返回 index.html\n```html\n<h1>Page 2</h1>\n\
  <a href=\"./index.html\">Page 1</a>\n```\n在你的手机浏览器中加载并测试。就是如此。链接到其他 HTML 页面并没有特别之处。\n\
  \n### 使用单页 Ajax 进行分页\n使用单页 Ajax 创建移动应用需要更多的思考和努力。Ajax 允许从用户所在的当前网页之外的文件或页面中动态拉取内容。这可以使应用程序更具扩展性，因为你不需要将多个页面放在单个页面中。相反，你可以在需要时拉取它们。这样做的好处是当用户移动页面时可以使用\
  \ CSS3 应用动画。列表 4-4 显示了通过 Ajax 加载 HTML 页面的基础知识。\n\n**列表 4-4。** 使用 Ajax 加载 HTML\n\
  ```html\n<div id=\"container\">\n<div id=\"card\">\n<h1>Page 1</h1>\n<a href=\"\
  index2.html\" data-method=\"xhr\">Page 2</a>\n</div>\n</div>\n\n<script>\n/**\n\
  * 此方法将绑定 ID 为 container 的 div 内部的所有链接。\n* 查询器还将匹配那些具有 data-method 属性且值为 xhr 的链接。\n\
  * 即：<a href=\"index2.html\" data-method=\"xhr\">Page 2</a>\n */\nfunction bindLinks(){\n\
  \n/**\n* 这将在查询选择器的上下文中调用 forEach。\n* 如果你熟悉 jQuery，它等同于\n```\n\n\n\n\n\n```javascript\n\
  $('#container a[data-method=\"xhr\"]).each(...);\n*/\n\n[].forEach.call(document.querySelectorAll('#container\
  \ a[data-method=\"xhr\"]'), function(el){\n  /**\n   * 对于每一个匹配的元素，此匿名方法都将被\n   *\
  \ 调用。forEach 方法的回调接受返回的\n   * 对象作为参数。在这种情况下，它将是当前\n   * 赋值给 el 的匹配元素。\n   */\n \
  \ /**\n   * 在这里你为对象添加一个事件监听器。有\n   * 几个触摸事件监听器，如 touchend、touchcancel \n   * 和 touchstart，它们在第\
  \ 5 章中都得到了解释。\n   */\n  el.addEventListener(\"touchend\", function requestCard(event){\n\
  \    /**\n     * 这调用 loadCard 方法，并将目标\n     * 链接位置作为参数（index2.html）。\n     */\n\
  \    loadCard(event.target.href);\n    /**\n     * 这可以防止链接的原始路径被\n     * 浏览器处理。\n\
  \     */\n    event.preventDefault();\n  });\n});\n}\n\n/**\n * 此方法将根据通过路径参数传递的\n\
  \ * 路径，从牌组中动态加载一个卡片。\n */\nfunction loadCard(path){\n  /**\n   * 这创建了一个新的 XMLHttpRequest\
  \ 请求。这\n   * 将用于使用 JavaScript 动态拉取 HTML 。\n   */\n  var xhr = new XMLHttpRequest();\n\
  \  /**\n   * 创建一个 GET 请求（可以是 POST 或 GET）。POST\n   * 请求用于发送大量数据；GET 请求应被\n   * 用于使用基于参数的\
  \ URI 从服务器获取信息。\n   * 第三个参数将请求设置为异步。\n   * 将其设置为 false 或不包含它将阻塞 UI \n   * 并阻止用户与应用程序交互。这不会\
  \ \n   * 立即发送请求。你必须调用 xhr.send()。\n   */\n  xhr.open(\"GET\", path, true);\n  /**\n\
  \   * 这为请求状态改变时设置回调。\n   * 状态可以通过 this.readyState 确定。在\n   * 此实例中，它是 event。不同的状态为：\n\
  \   *\n   * DONE – 请求完成\n   * LOADING – 请求加载中\n   * HEADERS_RECIEVED – 头部已加载但请求体未加载\n\
  \   * OPENED – open 方法已被调用\n   * UNSENT – XMLHttpRequest 对象已实例化\n   *\n   * 你可以使用\
  \ switch 语句为每个 readyState\n   * 创建条件。\n   */\n  xhr.onreadystatechange = function\
  \ contentLoaded(){\n    /** 在这里你检查请求状态 **/\n    if (this.readyState === this.DONE)\
  \ {\n      /**\n       * 在这里你选择将被\n       * 填充新内容的容器元素。\n       */\n      var container\
  \ = document.querySelector(\"#container\");\n      /**\n       * 这将检查响应状态，200 表示\
  \ OK。\n       * 你可以在此处找到各种 HTTP 状态码：\n       * [`www.w3.org/Protocols/HTTP/HTRESP.html`](http://www.w3.org/Protocols/HTTP/HTRESP.html)\n\
  \       */\n      if (this.status === 200) {\n        /**\n         * 在这里你创建一个 DOMParser\
  \ 对象，它\n         * 将解析返回的 HTML 以便对其\n         * 进行遍历。\n         */\n        var\
  \ domParser = new DOMParser(),\n        /**\n         * 目前，通过 XMLHttpRequest 获取的\
  \ HTML\n         * 返回为字符串。为了将其转换为\n         * 可遍历的 DOM 文档，需要对其\n         * 进行转换。\n\
  \         */\n        externalDocument = domParser.parseFromString(this.responseText,\
  \ 'text/html'),\n        /**\n         * 下一步工作是从 parseFromString\n         * 返回的\
  \ DOM 文档中选择卡片。\n         * DOMParser 允许使用 DOM 方法\n         * 遍历任何由 XMLHttpRequest\n\
  \         * 返回的 HTML。\n         */\n        card = externalDocument.querySelector(\"\
  #card\").outerHTML;\n        /**\n         * 接下来只需调用 setCardContent\n         *\
  \ 方法，它在下方定义，并将卡片\n         * 中的 HTML 以字符串的形式传入。\n         */\n        setCardContent(card);\n\
  \        /**\n         * 最后，你重新绑定所有链接，以便\n         * 任何新的内容链接都绑定\n         * XMLHttpRequest\
  \ 调用。\n         */\n        bindLinks();\n      } else {\n        /**\n        \
  \ * 如果请求失败，你只需设置 div\n         * 的内容以显示错误消息。\n         */\n        setCardContent('<div\
  \ id=\"card\"><h1>Oops</h1><p>Something went wrong!</p></div>');\n      }\n    }\n\
  \  }\n  /**\n   * 最后，发送请求。随着请求状态的改变，\n   * 回调方法将被调用。\n   */\n  xhr.send();\n}\n\n\
  /**\n * 这将容器的内容设置为请求的 HTML\n * 文件中的卡片。POSH 仅仅是 Plain Old Semantic HTML（纯语义 HTML）的缩写。\n\
  \ */\nfunction setCardContent(posh){\n  container.innerHTML = posh;\n}\n\n/**\n\
  \ * 最后，你调用 bindLinks()，它将绑定当前\n * 在页面上的链接。\n */\nbindLinks();\n/**\n * 遗憾的是，某些 Android\
  \ 浏览器不支持 DOMParser 的 text/html\n * 类型。下方的方法通过原型支持\n * text/html 类型。\n */\n/*\n *\
  \ DOMParser extension\n * 2012-02\n * Public domain.\n * NO WARRANTY EXPRESSED.\n\
  \ * USE AT YOUR OWN RISK.\n */\n(function(DOMParser) {\n  \"use strict\";\n  var\
  \ DOMParser_proto = DOMParser.prototype;\n  real_parseFromString = DOMParser_proto.parseFromString;\n\
  \n  try {\n    // Firefox/IE 对不支持的类型抛出错误\n    if ((new DOMParser).parseFromString(\"\
  \", \"text/html\")) {\n    }\n  } catch (ex) {\n    // WebKit 对不支持的类型返回 null\n \
  \   DOMParser_proto.parseFromString = function(markup, type) {\n      if (/^\\s*text\\\
  /html\\s*(?:;|$)/i.test(type)) {\n        var doc = document.implementation.createHTMLDocument(\"\
  \");\n        doc.documentElement.innerHTML = markup;\n        first_elt = doc.documentElement;\n\
  \        if (doc.childCount === 1 && first_elt.localName.toLowerCase() === \"html\"\
  ) {\n          doc.replaceChild(first_elt, doc);\n        }\n        return doc;\n\
  \      } else {\n        return real_parseFromString.apply(this, arguments);\n \
  \     }\n    };\n}(DOMParser));\n</script>\n```\n\n## 第 4 章：使用 HTML5 启动你的项目\n\n\
  列表 4-4 中的代码看起来可能有些复杂且冗长，但它允许你像处理普通文档一样加载并遍历 DOM。它还绑定了任何 `data-method` 属性设置为 `xhr`\
  \ 的链接。\n\n与使用 XML 或 JSON 相比，这样做的好处是，如果你想让 Web 应用程序用于不支持 JavaScript 的设备，你不需要创建一个视图，只需删除\
  \ JavaScript 代码即可切换页面。\n\n为了实现这一点，我们的第一项工作是设置如下所示的页面：\n\n```html\n<div id=\"container\"\
  >\n  <div id=\"card\">\n    <h1>页面 1</h1>\n    <a href=\"index2.html\" data-method=\"\
  xhr\">页面 2</a>\n  </div>\n</div>\n```\n\n这创建了一个容器来存放卡片。在容器内部，有一个包含标题和链接的基础卡片。HTML5\
  \ 允许我们使用数据属性在标记中设置自定义属性。\n\n接下来，你必须使用下面的代码将所有链接绑定到 JavaScript 方法：\n\n```javascript\n\
  function bindLinks(){\n  [].forEach.call(document.querySelectorAll(\"#container\
  \ a[data-method]\"), function(el){\n    if(el.getAttribute(\"data-method\") == \"\
  xhr\"){\n      el.addEventListener(\"click\", function requestCard(event){\n   \
  \     loadCard(this.href);\n        event.preventDefault();\n      });\n    }\n\
  \  });\n}\n```\n\n\n\n\n在查询返回的 `NodeList` 上下文中，使用对象的 `forEach` 方法。`forEach` 方法接受一个回调函数作为第一个参数。\n\
  \n该回调函数还接受以下三个参数：\n- 当前正在迭代的元素\n- 当前元素在数组中的索引\n- 实际数组\n\n你只需要当前元素，以便在回调函数中使用它；该元素被命名为\
  \ `el`。\n\n该方法中的第三行检查属性 `data-method` 是否存在，以及其值是否为 `xhr`。如果为真，它会在链接上添加一个事件监听器。这允许你手动指定哪些链接应该通过\
  \ Ajax 抓取。\n\n第四行为 `click` 事件添加了事件监听器。`click` 事件的作用与桌面端非常相似，不同之处在于，如果用户将手指移开链接，将取消该事件。你使用一个具名函数来执行此操作，以便在\
  \ Android 浏览器或 Android 版 Chrome 中进行调试时，可以在调用堆栈中对其进行追踪。\n\n在事件监听器函数内部，当用户点击链接时，会调用\
  \ `loadCard` 方法，并传入一个包含链接目标路径的参数 `event.target.getAttribute(\"href\")`。该路径是从链接的\
  \ `href` 属性获取的。\n\n`event.preventDefault()` 阻止浏览器跟随链接，并防止按通常方式加载下一个页面。\n\n下一个代码段中显示的\
  \ `loadCard` 函数将使用 `XMLHttpRequest` 从路径参数加载 html，获取页面内的卡片，并使用 `setCardContent` 方法用新内容替换当前页面上的卡片。完成后后，该方法将重新绑定事件处理程序到链接，以便所有后续页面都以相同的方式加载，因为新内容中的任何新链接都不会带上事件处理程序。\n\
  \n```javascript\nfunction loadCard(path){\n  var xhr = new XMLHttpRequest();\n \
  \ xhr.open(\"GET\", path, true);\n  xhr.onreadystatechange = function contentLoaded(){\n\
  \    if (this.readyState === this.DONE) {\n      var container = document.querySelector(\"\
  #container\");\n      if (this.status === 200) {\n        var domParser = new DOMParser(),\n\
  \          externalDocument = domParser.parseFromString(this.responseText, 'text/html'),\n\
  \        card = externalDocument.querySelector(\"#card\").outerHTML;\n        setCardContent(card);\n\
  \        bindLinks();\n      } else {\n        setCardContent('<div id=\"card\"\
  ><h1>Oops</h1><p>Something went wrong!</p></div>');\n      }\n    }\n  }\n  xhr.send();\n\
  }\n```\n\n该函数的第一行实例化了一个新的 `XMLHttpRequest` (`xhr`) 对象。第二行设置了 `xhr` 请求。`open` 方法接受以下五个参数：\n\
  - 方法：`GET`、`POST`\n- URL\n- 异步：`true`、`false`（默认为 `true`，并在调用 `send` 方法后将继续运行 JavaScript。如果设置为\
  \ `false`，它将在运行 `send` 方法后冻结浏览器直到请求完成）\n- 用户（如果请求受 HTTP 用户名和密码保护，你可以在此处输入用户名）\n\
  - 密码（如果请求受 HTTP 用户名和密码保护，你可以在此处输入密码）\n\n调用 `open` 不会导致 Ajax 请求。第四行设置了 `onreadystatechange`\
  \ 事件的处理器。\n\n## 使用单页容器进行分页\n\n使用单页容器进行分页允许你在单个 HTML 页面中在一个牌中创建一个一组卡片，并使用 JavaScript\
  \ 在它们之间导航。随着应用程序的增长，这在尝试管理包含多个卡片的众多部分/功能时可能会产生潜在问题。解决方案是将每个牌组或一组功能分成多个 HTML 页面。\n\
  \n在每个 HTML 页面中，将有一组与特定功能相关的卡片。为了在不同的牌组之间导航，你可以通过 Ajax 将它们抓取进来，或者使用标准 HTML 在它们之间跳转而无需动画。\n\
  \n创建一个单页容器移动端 Web 应用是简单的，其工作方式与 Ajax 方法类似。\n\n首先，在练习文件夹内创建一个名为 `container` 的文件夹。在该文件夹内，创建一个名为\
  \ `css` 的文件夹。创建一个名为 `mobile.css` 的新 CSS 文件，并添加列表 4-5 中的 CSS 代码。\n\n**列表 4-5. 单页容器的\
  \ CSS**\n\n```css\n/**\n* 设置 body, html 和 deck 元素的样式\n*/\nbody, html, #deck {\n\
  \  height: 100%; /** 将文档高度设置为视口的 100% **/\n  overflow: hidden; **/ 设置使所有流到外部的内容被隐藏\
  \ **/\n  margin: 0; /** body 的外边距通常不为 0，因此这移除了任何外边距 **/\n  position: realtive; /**\
  \ 卡片将相对于 deck 定位 **/\n}\n\n/**\n* deck 内部的卡片样式\n*/\n#deck .card {\n  overflow: auto;\
  \ /** 如果内容过多，这允许用户进行滚动 **/\n  height: 100%; /** 将卡片高度设置为 100% **/\n  position: absolute;\
  \ /** 允许卡片进行绝对定位 **/\n  left: -100%; /** 将默认位置设置为屏幕外（隐藏） **/\n  width: 100%; /**\
  \ 将卡片宽度设置为 deck 的宽度 **/\n}\n\n/**\n* 设置激活卡片的样式，以便当类被添加到它时它是可见的\n*/\n#deck .card.active\
  \ {\n  left: 0; /** 将卡片移回视图 **/\n}\n```\n\n\n\n\n如你从这段代码中看到的，卡片的 id 被设置为 `card-index`。\n\
  \n你使用 `card` 作为前缀来帮助牌组卡片命名。这可以防止你无意中在另一个 HTML 元素上 `index`（例如），从而导致分页问题。列表 4-9 显示了如何使用\
  \ JavaScript 来激活页面。\n\n**列表 4-9。** *在牌组内激活卡片*\n\n```javascript\n/**\n* 其工作原理与之前的方法非常相似。它将遍历所有匹配的\n\
  *元素并调用回调方法。\n*/\n[].forEach.call(document.querySelectorAll('.card a[data-method=\"\
  push\"]'), function(el){\n/**\n* 如你所见，回调方法是有命名的。我们没有使用 function(event){\n*而是使用了\
  \ function pushCard(event)。这有助于调试；例如，在\n* JavaScript 堆栈跟踪中，你可以看到函数名称而不是\n*匿名函数。\n\
  */\nel.addEventListener(\"click\", function pushCard(event){\n/**\n* 这获取链接中 href\
  \ 的哈希 (#card-second-page)元素\n* 并将其赋值给 pageid。href 对象具有各种\n*属性，所有属性可以在此处找到\n* http://www.w3.org/TR/html5-author/urls.html#url-decomposition-idl-\n\
  * attributes\n*/\nvar pageid = this.href.hash;\n/**\n* 这调用了 goToCard 方法，该方法将加载带有\n\
  * 指定 pageID 内容。\n*/\ngoToCard(pageid);\n\n/**\n* 这将阻止浏览器跟随 URL。\n*/\nevent.preventDefault();\n\
  });\n});\n```\n\n你使用与 Ajax 方法相同的 JavaScript 风格将事件绑定到带有 push-data 属性的链接。在事件监听器内部，你使用\
  \ `this.href.hash` 从链接中获取哈希。它被传递给列表 4-5 中的 `goToCard` 方法，该方法会移除可见卡片的 active 类，并将其添加到要显示给用户的卡片中。完整的代码示例可以在列表\
  \ 4-10 中看到。\n\n**列表 4-10。** *完整的单页容器示例*\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en-GB\" dir=\"ltr\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\"\
  \ content=\"width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;\
  \ target-densitydpi=device-dpi;\"/>\n<title>Single Page Container</title>\n<link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"css/mobile.css\" />\n</head>\n<body>\n\
  <div id=\"deck\">\n<section class=\"card active\" id=\"card-index\">\n<h1>Page 1</h1>\n\
  <a data-method=\"push\" href=\"#card-second-page\">Page 2</</a>\n</section>\n<section\
  \ class=\"card\" id=\"card-second-page\">\n<h1>Page 2</h1>\n<a data-method=\"push\"\
  \ href=\"#card-third-page\">Page 3</</a>\n</section>\n<section class=\"card\" id=\"\
  card-third-page\">\n<h1>Page 3</h1>\n<a data-method=\"push\" href=\"#card-index\"\
  >Page 1</</a>\n</section>\n</div>\n<script>\n[].forEach.call(document.querySelectorAll('.card\
  \ a[data-method=\"push\"]'), function(el){\nel.addEventListener(\"click\", function\
  \ pushCard(event){\nvar pageid = this.href.hash;\ngoToCard(pageid);\nevent.preventDefault();\n\
  });\n});\nfunction goToCard(to){\ndocument.querySelectorAll('.card.active')[0].classList.remove('active');\n\
  document.querySelectorAll(to)[0].classList.add('active');\n}\n</script>\n</body>\n\
  </html>\n```\n\n如你所见，移动端分页有几种实用的方法。虽然这些示例是分开的，但你可以将它们结合。例如，你可以将容器方法和 Ajax 方法结合，以分离应用程序的不同部分和功能。你还可以使用\
  \ `Ajax` 配合本章提到的任何方法使用 `JSON/XML` 动态加载内容和数据以生成新的动态视图。\n\n下一节将带你进入创建 MoMemo 应用的第一阶段。\n\
  \n## 创建应用\n\n创建一个可用的移动 Web 应用程序的关键在于规划。决定你的移动 Web 具有哪些核心功能，以及用户如何访问重要功能和数据，将帮助你决定如何使用分页技术、设计和\
  \ UI 来实现应用程序本身。如果你不喜欢规划，这可能是一项辛苦且无聊的任务，但它将帮助你在开始开发和设计之前解决问题。\n\n### 规划 MoMemo\n\n\
  此过程的第一步是用一句话定义该应用程序。在用一句话定义应用时，你应该尝试避免包含具体的功能或技术细节。句子应该简单地描述该应用及其目标。对于 MoMemo，应用定义如下：MoMemo\
  \ 是一个允许用户快速记录他们在电影院中看到的电影预告片，并在电影上映时提醒他们的应用程序。\n\n下一步是定义有助于满足应用程序主要目标的必须具备的功能。MoSCoW\
  \ 法（必须有、应该有、可以有、不包含）是定义应用功能和特性良好方法。\n\n- **必须有（Must have）**：\n    - 允许用户从个人列表中快速添加和删除电影\n\
  \    - 允许用户查看列表中的电影\n- **应该有（Should have）**：\n    - 在用户输入时提供电影建议列表\n    - 显示电影信息，包括简介、发行日期、演员表\n\
  - **可以有（Could have）**：\n    - 允许用户查看电影预告片\n    - 允许用户播放电影音频片段\n    - 允许用户将添加到列表的项目分享到社交网络\n\
  \    - 在查看备忘录时显示用户最近的电影院地图\n- **不包含（Won’t have）**：\n    - 在电影上映时向用户发送通知\n    - 允许用户在观看后对电影评分\n\
  \    - 允许用户邀请其他用户去电影院看电影\n\n\n\n\n\n\n104\n\n既然我们已经对应用程序目前应该如何运行有了清晰的认识，我们可以开始创建\
  \ UI 了。\n\n### 创建 UI 和 HTML\n\n如果你曾经专门为 Android 开发过应用（原生或 Web 端），你就会知道某些设计原则与你对其他移动操作系统（如\
  \ iOS 或 Windows Mobile）的预期的有所不同。例如，在 Google Galaxy Nexus 和 Samsung Galaxy Tab 上，系统栏（导航栏和组合栏）位于屏幕底部，并且在使用\
  \ Android 浏览器时它们始终处于激活或可见状态。一个良好的设计原则是不要将工具栏堆叠在系统栏之上；这可以防止用户在实际上想要与你的应用程序交互时，无意中触碰到系统按钮。\n\
  \n为了让用户方便使用此应用程序，为用户提供一种清晰的方式来添加和查看电影是有意义的，同时也要为你未来添加新功能留出空间。\n\nLinkedIn 提供了一个很好且清晰的示例。从图\
  \ 4-4 所示，可以明显看出，移动端 Web 应用的主要用途是搜索人员并查看最新更新。如果你想访问更多功能，搜索栏旁边“in”图标下方隐藏着一个工具栏。\n\n\
  如果你想更新你的 LinkedIn 状态，可以点击右上角的消息气泡图标。\n\n**图 4-4。** *LinkedIn 为整洁落地页/首页提供的解决方案*\n\
  \n![Image 57](img/index-108_1.jpg)\n\n## 第 4 章：使用 HTML5 启动你的项目\n\n105\n\n此顶部在应用程序的每个页面上都是可见的。在设计任何基于移动的网站时，你应该记住，它将在横屏或竖屏模式下的各种屏幕尺寸上显示。\n\
  \n**注意：** 截至目前，尚无已知方法可以将浏览器的方向锁定为横屏或竖屏。因此，当你设计移动 Web 应用时，应该考虑到方向发生变化。\n\n### 创建电影列表\n\
  \nMoMemo 应用程序的 UI 围绕屏幕顶部的搜索栏。图 4-5 和图 4-6 显示了应用程序的电影列表部分，包括适用于平板电脑和移动设备的任务栏。\n\n\
  **图 4-5。** *横屏平板电脑的电影列表*\n\n从图 4-5 所示，可以在浏览已添加到列表的电影时，访问搜索和添加电影的功能。对于用户来说也很清楚，这将向列表添加项目，而不是在现有列表中进行搜索，因为提交表单的按钮标记为\
  \ ADD 而不是搜索。\n\n![Image 58](img/index-109_1.jpg)\n\n## 第 4 章：使用 HTML5 启动你的项目\n\n\
  106\n\n图 4-6 以相同的方式呈现信息，但针对较小的屏幕；然而，列表项略大，以适应用户手指点击准确性可能较低的情况。虽然列表项聚集在一起，但用户必须点击以查看更多电影信息的目标仍然足够大。将任务栏放置在顶部还允许用户自然、轻松地翻阅其保存的电影列表，而不必过于担心意外激活应用程序的另一个部分。该应用程序的两个\
  \ UI 原型模型在 HTML 方面是相同的，但我们可以使用 CSS 媒体查询来针对特定的显示尺寸和方向。你还可以利用流式布局来确保应用程序能够对方向和屏幕尺寸的变化做出正确响应。\n\
  \n**图 4-6。** *竖屏移动设备的电影列表*\n\n## 第 4 章：使用 HTML5 启动你的项目\n\n107\n\n在 HTML 中进行这些标记非常简单。首先，在项目的根目录下创建一个名为\
  \ `application` 的文件夹。在该文件夹内，再创建三个名为 `css`、`img` 和 `js` 的文件夹。`css` 文件夹将存储你的 CSS/SASS，`img`\
  \ 将存储所有的图像和精灵图，`js` 将存储你所有的库和应用程序 JavaScript。\n\n你还需要在 `js` 中创建两个名为 `lib` 和 `app`\
  \ 的文件夹，在 `js/app/` 文件夹中创建一个名为 `bootstrap.js` 的文件，并在 `css` 文件夹中创建一个名为 `mobile.scss`\
  \ 的文件。\n\n在 `application` 文件夹中创建一个名为 `index.html` 的新文件；列表 4-11 中的代码将帮助引导应用程序。\n\n\
  **列表 4-11。** *初始 Bootstrap HTML*\n\n```\n<!DOCTYPE html>\n<html lang=\"en-GB\" dir=\"\
  ltr\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width;\
  \ initial-scale=1.0; maximum-scale=1.0; user-scalable=0; target-densitydpi=device-dpi;\"\
  />\n<title>Mo Memo</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/mobile.css\"\
  \ />\n<link rel=\"apple-touch-icon-precomposed\" href=\"img/home-screen-icon.png\"\
