  \ \"#FFFFFF\";\n    context.arc(canvas.center.x, canvas.center.y,\n    canvas.center.x\
  \ - 20, 0, endradians);\n    context.stroke();\n  };\n}\n```\n\n\n\n\n```javascript\n\
  };\n\nthis.drawStop = function(){\n  var width = 20,\n  height = 20,\n  x = canvas.center.x\
