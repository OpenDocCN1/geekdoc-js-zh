  \ Update Site*\n\n![Image 14](img/index-12_1.jpg)\n\n# 第 1 章：入门\n\n7\n\n[要为 Aptana\
  \ 安装 `ADT`，请访问 http://developer.android.com/sdk/eclipse-adt-](http://developer.android.com/sdk/eclipse-adt.html#downloading)[adt.html#downloading.](http://developer.android.com/sdk/eclipse-adt.html#downloading)\
  \ 按照说明操作。成功安装 `ADT` 后，`Aptana` 将重启，你将看到一个类似于图 1-3 的屏幕。\n\n**图 1-3.** *ADT 初始启动屏幕*\n\
