  ### 代码列表 A-1 [351]\n### 代码列表 A-2 [356]\n\n# 索引 [363]\n\n## 关于作者\n**Gavin Williams**\
  \ 从 14 岁就开始 Web 行业工作，当时他首选的编辑器是 `Microsoft Front Page` 或 `Notepad`。他主要使用 `HTML`、`PHP`\
  \ 和 `CSS` 工作。在完成计算机认证以及其他几项 A-level 后，他在进入大学前休息了一年，在 `Agency.com`担任 Web 开发人员。在这里，他服务过\
  \ `IKEA`、`英国航空`、`Channel 5` 和宝洁等等客户。\n\n随后，他进入大学学习交互媒体制作，在那里产生了对移动端和移动 Web 的热爱。他凭借\
  \ `WiDrive` 获得了英国交互媒体奖，这是一种仅使用 `iPhone` 即可通过 `WiFi` 控制的遥控汽车。不久后，他与大学的好友之一 Siobhan\
  \ Bentley 一起创立了 `Fishrod Interactive`，为 `British Sky Broadcasting`、`WWE`、`Johnson\
  \ & Johnson` 以及其他一些小型公司开发移动网站、应用程序和交互式装置，例如 `Soulcialize`（一家位于伦敦水晶宫的纸杯蛋糕公司）和 `Streetfit.tv`（一家街舞健身公司）。\n\
  \nGavin Williams 是一位全能型开发者，喜欢学习新技术并将其推向极致。好奇心是他的弱点，因为他很容易被开发世界中的新奇事物所分散注意力。\n\n\
  ## 关于技术评审员\n**James Graham** 于 1989 年毕业于德克萨斯农工大学，获得电子科学学士学位，专攻电信方向。在校期间，他的文章发表在国际通信协会\
  \ 1988 年的 `ICA Communique` 上（《快速数据包交换：理论与性能概述》）。他的工作经验包括：在伊利诺伊州芝加哥的 `Amoco Corporation`\
  \ `Network Design Group` 担任助理网络工程师；在佛罗里达州福特沃尔顿滩的 `Tybrin Corporation` 担任高级网络工程师；以及在`第\
