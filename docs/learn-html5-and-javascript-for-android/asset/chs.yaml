  \n最后，你定义了默认回调函数。\n\n```javascript\napp.track = function(length){\n  ...\n  this.callbacks\
  \ = {\n    didUpdateTime: function(time){},\n    didStartPlaying: function(){},\n\
  \    didPause: function(){},\n    didStop: function(){}\n  };\n};\n```\n\n如你所见，这些是空函数。这允许即使在这些函数没有被赋值的情况下调用它们。共有四个回调函数：`this.callbacks.didUpdateTime`、`this.callbacks.didStartPlaying`、`this.callbacks.didPause`\
  \ 和 `this.callbacks.didStop`。\n\n现在是时候开始创建播放按钮并研究 Canvas 了！在开始之前，重要的是理解 Canvas 到底是如何工作的。为了在画布上绘图，你需要获取它的上下文（context）。如果你不熟悉什么是上下文，它就像一个你可以在其中绘图的隐藏空间。在你完成在其上的绘图后，上下文将呈现给用户。目前\
  \ `Canvas API` 中只有一个上下文，所有的形状都绘制在其上面。在理想的世界中，你将会有几个上下文，将各个组件绘制在它们上面，并将每个上下文合并到一个单个上下文中。目前这是不可能的，在本章的后续部分进一步解释。\n\
  \nCanvas 上下文基于基于坐标的系统，0,0 起于左上角，如图 7-5 所示。\n\n![Image 96](img/index-195_1.jpg)\n\
  \n### 第 7 章：用于移动端的 JavaScript\n\n**图 7-5.** *Canvas 网格*\n\n要开始，你需要定义几个全局变量。\n\n\
  ```javascript\napp.playButton = function(id, track){\n  var canvas = document.getElementById(id),\n\
  \  context = canvas.getContext('2d'),\n  track = track,\n  _self = this;\n}\n```\n\
  \n如你所见，你通过 `getElementById` 获取 Canvas 元素。然后你通过 `canvas.getContext('2d')` 获取 Canvas\
  \ 上下文，这将为你返回一个 2d Canvas 上下文供你绘制。然后你显式声明 `track` 变量，并再次将 `_self` 定义为 `this` 以供任何回调方法使用。\n\
  \n你可以通过为 Canvas 元素创建新属性来更容易计算它的某些方面。这是通过以下代码实现的：\n\n```javascript\napp.playButton\
  \ = function(id, track){\n  ...\n  canvas.center = {\n    x: (canvas.offsetHeight\
  \ / 2),\n    y: (canvas.offsetHeight / 2)\n  };\n  canvas.dimensions = {\n    width:\
  \ (canvas.offsetWidth),\n    height: (canvas.offsetHeight)\n  };\n}\n```\n\n现在允许你快速检索画布的中心坐标以及宽度和高度，无需将它们存储在全局变量中。例如，你只需使用\
  \ `canvas.center.x` 来获取画布的中心 x 坐标。\n\n接下来，你需要为轨道更新计时器以及轨道暂停时分配回调函数。\n\n```javascript\n\
  app.playButton = function(id, track){\n  ...\n  track.callbacks.didUpdateTime =\
  \ function(time){\n    _self.draw();\n  };\n  track.callbacks.didPause = function(){\n\
  \    _self.draw();\n  }\n}\n```\n\n如你所见，两个回调都简单地调用了 `playButton` 类中的 `draw` 方法。\n\
  \n接下来，你需要创建播放控制方法。这将用于播放按钮播放和停止轨道。这也允许其他对象或函数通过播放按钮启动或停止轨道。\n\n```javascript\napp.playButton\
  \ = function(id, track){\n  ...\n  this.togglePlay = function(){\n    switch(track.getState()){\n\
  \      case track.state.STOPPED:\n      case track.state.PAUSED:\n        track.play();\n\
  \        break;\n      case track.state.PLAYING:\n        track.pause();\n     \
  \   break;\n    }\n  };\n\n  this.play = function(){\n    track.play();\n  };\n\n\
  \  this.stop = function(){\n    track.stop();\n  };\n}\n```\n\n如你所见，`togglePlay`\
  \ 方法使用 `track.getState()` 来切换播放和停止。\n\n现在是时候绘制停止按钮了。绘制方法在 `this.draw` 方法中被调用，上下文来自类中的私有变量。\n\
  \n### 绘制停止图标\n\n停止按钮是 20px × 20px，应该是一个填充矩形。为了绘制任何比例的矩形，你可以使用 `context.fillRect()`\
  \ 方法。`fillRect` 方法接受表 7-3 所示的四个参数。\n\n**表 7-3.** *fillRect 方法参数*\n\n| 参数 | 说明 |\n\
  | :--- | :--- |\n| x | 相对于画布放置放置矩形左上角 x 坐标 |\n| y | |\n\n\n\n\n\n# 矩形左上角 y 坐标相对于画布宽度的位置\n\
  \n矩形的宽度\n矩形的高度\n\n要绘制一个 20px × 20px 的简单矩形，你会使用以下代码：\n\n```javascript\ncontext.fillStyle\
  \ = '#000000';\ncontext.fillRect(0, 0, 20, 20);\n```\n\n这将产生一个与图 7-6 所示类似的矩形。\n\n\
  ![Image 97](img/index-200_1.jpg)\n\n**图 7-6.** *一个 20px × 20px 的矩形*\n\n`context.fillStyle`\
  \ 将将任何新闭合形状（如矩形或圆形）的填充颜色设置为黑色或 `#000000`。\n\n在用于播放按钮上绘制停止符号矩形的代码中，你需要考虑停止符号相对于画布的位置。你希望将停止符号直接放置在画布中央。为了让停止符号居中，你需要计算停止符号左上角的\
  \ `x` 和 `y` 偏移量。为了计算这一点，你需要将画布的宽度和高度减半以得到偏移量。然后，你可以从形状的中心减去画布的中心得到 `x` 和 `y` 坐标。这种方法实际上是将要绘制形状的中心与画布的中心对齐。\n\
  \n以下代码将根据画布本身的大小将停止图标在画布居中。\n\n```javascript\napp.playButton = function(id, track){\n\
  \  ...\n  this.drawStop = function(){\n    var width = 20,\n    height = 20,\n \
  \   x = canvas.center.x - (width / 2),\n    y = canvas.center.y - (height / 2);\n\
  \    context.beginPath();\n    context.fillStyle = '#A0A0A0';\n    context.fillRect(x,\
  \ y, width, height);\n  };\n}\n```\n\n如你所示，你将停止图标的 `width` 和 `height` 声明为 `20`以便后续引用。你还通过获取画布中心\
  \ x 坐标减去矩形宽度的一半来计算 `x` 坐标。这将使停止图标水平居中。\n\n接下来，`y` 坐标的设置类似，通过将画布的高度（其中心）减半并减去停止图标高度的一半来设置。这会将停止图标垂直放置在画布中心，如图\
  \ 7-7 所示。将这两个计算结合起来将使停止图标在画布内完全居中。\n\n![Image 98](img/index-202_1.jpg)\n\n**图 7-7.**\
  \ *沿 x 轴和 y 轴居中停止图标*\n\n在开始 Canvas 中绘制新形状之前，调用 `context.beginPath()` 是一个好习惯。这会在上下文中创建一个新路径供你开始绘制。这相当于在纸上画一个新形状之前将笔抬离开纸。\n\
  \n接下来，你需要设置即将绘制的形状的 `fillStyle`。2D 上下文 API 有几种绘制方法。API 最基本的方法和属性如表 7-4 和表 7-5 所示。\n\
  \n### 表 7-4 基础 2D Context 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `context.fillStyle`\
  \ | 设置绘制形状的填充颜色。可以使用十六进制（`#000000`）、RGB 颜色（`rgb(0,0,0)`）或带透明道的颜色（`rgba(0,0,0,0.5)`）的实色。\
  \ |\n| `context.lineWidth` | 将设置此后绘制的任何线条的宽度。值可以是双点数，例如 `1.5`。 |\n| `context.lineCap`\
  \ | 将设置任何线条的端点样式。有效值为 `butt`、`round` 和 `square`。 |\n| `context.strokeStyle` | 这是上下文的描边样式。它设置设置此后绘制的任何线条的颜色。可以使用十六进制（`#000000`）、RGB\
  \ 颜色（`rgb(0,0,0)`）或带透明道的颜色（`rgba(0,0,0,0.5)`）的实色。 |\n\n### 表 7-5 基础 2D Context 方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `context.fillRect(x, y, width, height)` | 将创建一个具有指定属性的矩形。\
  \ |\n| `context.strokeRect(x, y, width, height)` | 将创建一个没有填充但具有指定属性描边的矩形。 |\n| `context.clearRect(x,\
  \ y, width, height)` | 将绘制一个具有指定属性的“白色”矩形。 |\n| `context.arc(x, y, center, start\
  \ angle, end angle, anticlockwise)` | 将使用指定属性绘制弧。起始和结束角度以弧度定义。`anticlockwise` 是一个布尔值，用于指定绘制圆弧的方向。\
  \ |\n\n### 绘制播放图标\n\n播放按钮稍微复杂一些。要绘制播放按钮，你需要使用路径。为了绘制路径，你使用 `moveTo` 和 `lineTo` 方法。这些方法允许你移动到某点而不画线，并在纸上绘制新形状之前移动画线。\n\
  \n```javascript\napp.playButton = function(id, track){\n  ...\n  this.drawPlay =\
  \ function(){\n    var width = 20,\n    height = 20,\n    x = canvas.center.x -\
  \ (width / 2),\n    y = canvas.center.y - (height / 2);\n    context.beginPath();\n\
  \    context.moveTo(x, y);\n    context.lineTo(x + width, y);\n    context.lineTo(x,\
  \ y + height);\n    context.closePath();\n    context.fillStyle = '#A0A0A0';\n \
  \   context.fill();\n  };\n}\n```\n\n如你所示，你将停止图标的 `width` 和 `height` 声明为 `20`以便后续引用。你还通过获取画布中心\
  \ x 坐标减去矩形宽度的一半来计算 `x` 坐标。这将使停止图标水平居中。\n\n接下来，`y` 坐标的设置类似，通过将画布的高度（其中心）减半并减去停止图标高度的一半来设置。这会将停止图标垂直放置在画布中心，如图\
  \ 7-7 所示。将这两个计算结合起来将使停止图标在画布内完全居中。\n\n*(注：此处由于原文提供的代码块逻辑与描述有出入，翻译已严格遵循“不翻译代码块”原则，保留代码结构，仅对描述性文字进行翻译。)*\n\
