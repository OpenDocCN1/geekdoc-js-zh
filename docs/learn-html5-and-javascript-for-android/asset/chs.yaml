  \n第 5 章：移动 CSS3\n141\n\n**图 5-14。** *圆角*\n\n### 阴影 (box-shadow)\n\n`box-shadow`\
  \ 属性与 `text-shadow` 相同，如果你指定了负偏移值，阴影将渲染在屏幕的左侧和上方。`box-shadow` 具有以下格式：\n\n`box-shadow:\
  \ horizontal-offset vertical-offset blur spread color`\n\n`horizontal-offset` 和\
  \ `vertical-offset` 属性决定阴影的位置（像素），`blur` 设置模糊程度（像素），`spread` 设置扩散，`color` 设置阴影的颜色，`inset`\
  \ 设置阴影是在元素内部还是外部。例如，以下代码将产生类似于图 5-15 的效果：\n\n```css\n.box {\n  width: 100px;\n \
  \ height: 100px;\n  border: 1px solid #00000;\n  box-shadow: 10px 10px 20px 5px\
  \ #00000;\n}\n```\n\n\n\n\n\n`[max-|min-]device-aspect-` cm（用于打印）的宽高比，像素设备屏幕比例（基于\
  \ `device-width`、`device-height`）\n\n`[max-|min-]device-pixel-ratio` 设备的像素比例；它可以用于为高像素密度设备引入\
  \ `[max-|min-]-moz-device-pixel-ratio` 高分辨率图像；该属性也可能是 `-o-[max-|min-]device-vendor\
  \ specific pixel-ratio` `-webkit-[max-|min-]device-pixel-ratio`\n\n## 响应式网页设计\n\n\
  创建媒体查询（media queries）的理念并不一定是为了针对特定设备构建媒体查询（例如，不是专门针对平板电脑或手机），而是为了适应特定的屏幕尺寸并调整内容以适应它。\n\
  \n通过这种方式，你可以确保 CSS 应用于可用空间而不是目标设备。我们将其称为响应式网页设计。\n\nDaniel Vane 的网站 (`http://danielvane.com/`)\
  \ 展示了响应式网页设计的绝佳示例。通过为所有视口大小提供样式、为最大 `480px` 的显示提供样式以及为最大 `768px` 的显示提供样式，该网站能够对任何手机或平板电脑设备的可用空间做出适当响应，如图\
  \ 5-16 和图 5-17 所示。\n\n![Image 81](img/index-147_1.jpg)\n![Image 82](img/index-147_2.jpg)\n\
  \n**图 5-16.** 横屏下的 Daniel Vane 响应式网站（左侧为平板，右侧为手机）。**图 5-17.** 竖屏下的 Daniel Vane 响应式网站（左侧为平板，右侧为手机）。\n\
  \nAndy Clarke 和 Keith Clark 设计了一组媒体查询，你可以用来针对逐渐变大的显示器。其后的想法是使用颜色和字体对最小屏幕尺寸进行样式设计，然后按照特定的屏幕增量逐步增强网站，直到达到超过\
  \ `992px` 的屏幕尺寸。这组媒体查询还包含一个针对高像素密度显示器的媒体查询。\n\n<!-- 用于所有浏览器 -->\n```html\n<link\
  \ rel=\"stylesheet\" href=\"css/style.css\">\n<link rel=\"stylesheet\" media=\"\
  print\" href=\"css/print.css\">\n<!-- 用于逐渐变大的显示器 -->\n<link rel=\"stylesheet\" media=\"\
  only screen and (min-width: 480px)\" href=\"css/480.css\">\n<link rel=\"stylesheet\"\
  \ media=\"only screen and (min-width: 600px)\" href=\"css/600.css\">\n<link rel=\"\
  stylesheet\" media=\"only screen and (min-width: 768px)\" href=\"css/768.css\">\n\
  <link rel=\"stylesheet\" media=\"only screen and (min-width: 992px)\" href=\"css/992.css\"\
  >\n<!-- 用于 Retina 显示器 -->\n<link rel=\"stylesheet\" media=\"only screen and (-webkit-min-device-pixel-ratio:\
  \ 1.5), only screen and (-o-min-device-pixel-ratio: 3/2), only screen and (min-device-pixel-ratio:\
  \ 1.5)\" href=\"css/2x.css\">\n```\n\n你应该检查他们的 GitHub 项目以获取这组规则的更新，项目地址为 `https://github.com/malarkey/320andup/`。\n\
  \n## CSS 预处理器 (SASS)\n\n如果你过去有 CSS 经验，就会知道它的某些局限性。例如，你无法定义影响 CSS 呈现方式的变量，无法复用代码元素。随着应用程序的增长，在\
  \ CSS 中生成并维护很长的继承链也可能是非常痛苦的，如下代码所示，一个元素内部有多个元素需要相似的样式。\n\n```css\n/**\n* CSS 中为块设置样式的常用方法\n\
  **/\n.block {\n/** 在此处设置 block 样式 **/\n}\n.block h1.heading {\n/** 在此处设置 header\
  \ 样式 **/\n}\n.block ul.alternating {\n/** 在此处设置 block ul 样式 **/\n}\n.block ul.alternating\
  \ li {\n/** 在此处设置 alternating li 样式 **/\n}\n.block ul.alternating li a {\n/** 在此处设置\
  \ li 样式 **/\n}\n/** 继续 **/\n```\n\nSyntactically Awesome Stylesheets (SASS) 通过使用嵌套、变量、混合器（mixins）和选择器继承来帮助消除这些冗余。SASS\
  \ 并不是 CSS，需要编译器来将其编译为 CSS。\n\n如你从前面的 CSS 中看到的，很多代码都是重复的。遗憾的是，没有办法以浏览器可以识别的方式移除这些冗余，但有一种方法可以让你编写的\
  \ CSS 更易于维护和迁移。这在 SASS 中被称为嵌套（nesting）。\n\n在本节中，你将学习如何使用 SASS 生成组织化、可复用且具体的 CSS。你将学习\
  \ SASS 如何改进你的开发工作流并改变你对 CSS 的思考。\n\n你还将学习 SASS 如何消除整个样式表中使用相似 CSS 样式的大量重复工作，并为面向对象的\
  \ CSS 铺道路。\n\n### 嵌套\n\n嵌套允许你将 CSS 样式嵌套在彼此内部。例如，前面的 CSS 看起来如下：\n\n```css\n.block\
  \ {\n  /** 在此处设置 block 样式 **/\n  h1.heading {\n    /** 在此处设置 header 样式 **/\n  }\n\
  \  ul.alternating {\n    /** 在此处设置 block ul 样式 **/\n    li {\n      /** 在此处设置 alternating\
  \ li 样式 **/\n      a {\n        /** 在此处设置 li 样式 **/\n      }\n    }\n  }\n}\n```\n\
  \n这段代码要容易维护得多。如果你需要添加更多元素，只需要添加以下 SCSS 格式：\n\n```css\n.block {\n  /** 在此处设置 block\
  \ 样式 **/\n  h1.heading {\n    /** 在此处设置 header 样式 **/\n  }\n  ul.alternating {\n\
  \    /** 在此处设置 block ul 样式 **/\n    li {\n      /** 在此处设置 alternating li 样式 **/\n\
  \      a {\n        /** 在此处设置 li 样式 **/\n      }\n    }\n  }\n}\n```\n\n### 编译\n\
  \n前面的代码需要编译成 CSS 浏览器才能理解。你不需要直接将 SASS 文件链接到 HTML 文档中；相反，你链接的是生成的 CSS 文件。你可以使用 Aptana\
  \ Studio 的内置工具直接编译 SASS 文件。\n\n![Image 83](img/index-151.jpg)\n\n要在 Aptana Studio\
  \ 中编译 SASS 文件，请在项目中的任何位置创建一个名为 `mobile.scss` 的新文件（完成后可以删除它），并添加以下代码：\n\n```css\n\
  .test {\n  background: #000000;\n}\n.test2 {\n  background: #FFFFFF;\n}\n```\n\n\
  点击 `Commands Sass Compile`。这将在 SCSS 文件相同的位置生成一个新的 CSS 文件。你需要刷新资源管理器才能看到新文件。编译 SASS\
  \ 的快捷键是 `cmd + shift + r`（Windows 和 Linux 上为 `CTRL + Shift + r`）。当出现图 5-18 所示的对话框时按\
  \ `1`。\n\n**图 5-18.** 使用 cmd + shift + r 命令编译 SASS\n\n当新 CSS 文件出现后，打开它。你应该看到以下代码：\n\
  \n```css\n.test {\n  background: #000000; }\n.test .test2 {\n  background: #FFFFFF;\n\
  }\n```\n\n### 部分文件 (Partials)\n\n大型 SASS 文件可能会变得难以维护且滚动非常长！在 Aptana Studio 中，你可以使用代码折叠来显示和隐藏\
  \ SASS 样式以便浏览，如图 5-19 所示。\n\n![Image 84](img/index-152.jpg)\n\n**图 5-19. Aptana\
  \ 中 SCSS 文件的代码折叠**\n\n虽然这种方式很方便，但 SASS 也支持使用与普通 CSS 相同的 `@import` 语法从外部 SASS 文件导入部分样式表。SASS\
  \ 实现与普通样式表实现之间的区别在于，SASS 在编译时引入文件，而不是通过 HTTP 请求逐个加载普通 CSS 文件中的所有文件。这为在编译时导入特定对象或区域的部分文件提供了范围。\n\
  \n以下代码展示了一个示例。\n\n\n\n\n\n```scss\n/** mobile.scss **/\n\n@import \"partials/tablet\"\
  ;\n\n@import \"partials/phone\";\n\n/** partials/_tablet.scss **/\n\n.test-tablet\
  \ {\n  background: url('../themes/mytheme/common/logo.png') no-repeat top left\n\
  \  #FFFFFF;\n}\n\n/** partials/_phone.scss **/\n\n.test-phone {\n  background: url('../themes/mytheme/common/logo.png')\
  \ no-repeat top left\n  #FFFFFF;\n}\n```\n\n编译后，CSS 将看起来如下所示。\n\n```css\n.test-tablet\
  \ {\n  background: url(\"../themes/mytheme/common/logo.png\") no-repeat top left\
  \ white; }\n.test-phone {\n  background: url(\"../themes/mytheme/common/logo.png\"\
  ) no-repeat top left white; }\n```\n\n# 第 5 章：用于移动端的 CSS3\n\n从这个示例可以看出，每个部分文件的文件名应该以\
  \ `_`（下划线）为开头，并且 `import` 中的引用应该包含相对文件夹和部分名称，但不需要包含 `_` 前缀或 SCSS 文件名。你可能会注意到 SASS\
  \ 在编译后的 CSS 中将 `#FFFFF` 转换为 `white`。\n\n## 变量与插值\n\n你最终会编写基于颜色/主题的样式表（即，同一个样式表可能引用相同的图像，但来自不同的图像文件夹，或者具有不同的颜色主题）。传统上，你会使用\
  \ `PHP`、`Python` 或 `.NET` 来动态生成这些样式表。SASS 通过使用变量消除了这种需求。\n\nSASS 中的变量作用方式与任何其他语言非常相似。它们可以是任何类型（字符串、CSS\
  \ 属性值、整数、测量值如像素、em、% 等），并被添加到 SCSS 样式中，以便对你的样式表进行全局更改。\n\n例如，取 partials 部分示例中的代码，我们可以对其进行修改，这样就可以从主（移动端）样式表中更改主题文件夹和颜色。\n\
  \n```scss\n/** mobile.scss **/\n\n$theme: \"bentley\";\n\n$color: #000000;\n\n@import\
  \ \"partials/tablet\";\n\n@import \"partials/phone\";\n\n/** partials/_tablet.scss\
  \ **/\n\n.test-tablet {\n  background: url('../themes/#{$theme}/common/logo.png')\
  \ no-repeat top left\n  $color;\n}\n\n/** partials/_phone.scss **/\n\n.test-phone\
  \ {\n  background: url('../themes/#{$theme}/common/logo.png') no-repeat top left\n\
  \  $color;\n}\n```\n\n正如你在 `mobile.scss` 中看到的，你定义了一个字符串为 `\"bentley\"` 的主题变量。接着在下一行定义了黑色。然后使用\
  \ `@import` 导入这些部分。在每个部分内部，你会发现 `background` 声明已按如下修改。\n\n```css\nbackground: url('../themes/#{$theme}/common/logo.png')\
  \ no-repeat top left\n$color;\n```\n\n向 SASS 文件添加变量的方法有两种。要将变量作为 CSS 字符串的一部分（例如背景图像路径）添加，你使用以下语法：\n\
  \n`#{$myvariable}`\n\n这被称为“插值”，你也可以用它来更改 CSS 属性而不是其值。例如，`border-#{$position}-radius:`，其中\
  \ `position` 是变量定义的定义。\n\n第二种方法是简单重复变量名 `$myvariable`。当你定义 CSS 属性值（如 `color`、`width`\
  \ 或 `height`）时，应该使用这种方法。\n\n## Mixins（混合器）\n\nSASS 最受欢迎的功能之一是 Mixin。Mixin 允许你在一个地方定义一段代码，并在\
  \ SASS 样式表的任何地方使用它。例如，你可能有一个用于跨浏览器渐变的巨型 CSS 声明，如下代码所示。\n\n```css\n.myelement {\n\
  \  background: rgb(206,220,231);\n  background: -moz-linear-gradient(-45deg, rgba(206,220,231,1)\
  \ 0%,\n  rgba(89,106,114,1) 100%);\n  background: -webkit-gradient(linear, left\
  \ top, right bottom,\n  color-stop(0%,rgba(206,220,231,1)),\n  color-stop(100%,rgba(89,106,114,1)));\n\
  \  background: -o-linear-gradient(-45deg, rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1)\
  \ 100%);\n  background: -ms-linear-gradient(-45deg, rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1)\
  \ 100%);\n  background: linear-gradient(-45deg, rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1)\
  \ 100%);\n}\n```\n\n那是大量的代码。如果你想在其他地方使用它怎么办？最有效的方法是简单向你想使用它的定义中添加更多类。\n\n```css\n\
  .myelement, .mysecondelement {\n  background: rgb(206,220,231);\n  background: -moz-linear-gradient(-45deg,\
  \ rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1) 100%);\n  background: -webkit-gradient(linear,\
  \ left top, right bottom,\n  color-stop(0%,rgba(206,220,231,1)),\n  color-stop(100%,rgba(89,106,114,1)));\n\
  \  background: -o-linear-gradient(-45deg,\n  rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1)\
  \ 100%);\n  background: -ms-linear-gradient(-45deg,\n  rgba(206,220,231,1) 0%,\n\
  \  rgba(89,106,114,1) 100%);\n  background: linear-gradient(-45deg,\n  rgba(206,220,231,1)\
  \ 0%,\n  rgba(89,106,114,1) 100%);\n}\n```\n\n你可以使用 mixin 来定义渐变并使用以下代码包含包含样式中：\n\
  \n```scss\n@mixin specialgradient {\n  background: rgb(206,220,231);\n  background:\
  \ -moz-linear-gradient(-45deg,\n  rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1)\
  \ 100%);\n  background: -webkit-gradient(linear, left top, right bottom,\n  color-stop(0%,rgba(206,220,231,1)),\n\
  \  color-stop(100%,rgba(89,106,114,1)));\n  background: -o-linear-gradient(-45deg,\n\
  \  rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1) 100%);\n  background: -ms-linear-gradient(-45deg,\n\
  \  rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1) 100%);\n  background: linear-gradient(-45deg,\n\
  \  rgba(206,220,231,1) 0%,\n  rgba(89,106,114,1) 100%);\n}\n\n#my-first-element\
  \ {\n  @include specialgradient;\n}\n\n#my-second-element {\n  @include specialgradient;\n\
  }\n```\n\n然而，这将是一个坏主意，因为生成的 CSS 将在样式表中包含两次渐变，这增加了冗余，并不是我们想要的。这种情况下，选择器继承应该是首选。当你有一段会在其他\
  \ CSS 规则中重复的 CSS 时，或者更好，当你有贯穿整个样式表的重复 CSS 时（例如特定浏览器的样式，如渐变和边界图像，需要为每个浏览器多次定义相同的\
  \ CSS）。\n\n要实现这一点，你可以将参数传递到 mixins 中。现在你可以使用以下代码在 SASS 文件中的任何地方生成 CSS 渐变。\n\n```scss\n\
  @mixin gradient($start, $stop, $degrees) {\n  background: rgba($start, 1);\n  background:\
  \ -moz-linear-gradient($degrees, $start 0%, $stop 100%);\n  background: -webkit-gradient(linear,\
  \ left top, right bottom,\n  color-stop(0%, $start), color-stop(100%, $stop));\n\
  \  background: -o-linear-gradient($degrees, $start 0%,$stop 100%);\n  background:\
  \ -ms-linear-gradient($degrees, $start 0% $stop 100%);\n  background: linear-gradient($degrees,\
  \ $start 0%, $stop 100%);\n}\n\n#my-first-element {\n  @include gradient(rgba(206,220,231,0.5),\
  \ rgba(89,106,114,1), -45deg);\n}\n\n#my-second-element {\n  @include gradient(rgba(206,220,231,1),\
  \ rgba(89,106,114,1), -45deg);\n}\n```\n\n正如你看到的，你首先定义了一个名为 `gradient` 的 mixin，它接受三个参数：`$start`、`$stop`\
  \ 和 `$degrees`。在这个 mixin 内部，你首先为不支持渐变的设备定义标准背景。使用 `rgba` SASS 函数定义背景颜色的值。在这里，你显式地将背景颜色设置为无\
  \ alpha 透明度的起始颜色。通过使用以下行，你只需将起始颜色、停止颜色和角度传递给相应的厂商渐变声明。现在你可以在样式表的任何地方使用 `@include\
  \ gradient(start-color, finish-color, degrees);` 来调用带参数的渐变。生成的 CSS 如下所示。\n\n```css\n\
  #my-first-element {\n  background: #cedce7;\n  background: -moz-linear-gradient(-45deg,\
  \ rgba(206,220,231,0.5) 0%, #596a72 100%);\n  background: -webkit-gradient(linear,\
  \ left top, right bottom,\n  color-stop(0%, rgba(206,220,231,0.5)), color-stop(100%,\
  \ #596a72));\n  background: -o-linear-gradient(-45deg, rgba(206,220,231,0.5) 0%,\
  \ #596a72 100%);\n  background: -ms-linear-gradient(-45deg, rgba(206,220,231,0.5)\
  \ 0% #596a72 100%);\n}\n```\n\n\n\n\n\n```css\nbackground: linear-gradient(-45deg,\
  \ rgba(206, 220, 231, 0.5) 0%, #596a72 100%); }\n\n#my-second-element {\n  background:\
  \ #cedce7;\n  background: -moz-linear-gradient(-45deg, #cedce7 0%, #596a72 100%);\n\
  }\n```\n\n# 第 5 章：移动端 CSS3\n\n154\n\n```css\nbackground: -webkit-gradient(linear,\
  \ left top, right bottom, color-stop(0%, #cedce7), color-stop(100%, #596a72));\n\
  background: -o-linear-gradient(-45deg, #cedce7 0%, #596a72 100%);\nbackground: -ms-linear-gradient(-45deg,\
  \ #cedce7 0% #596a72 100%);\nbackground: linear-gradient(-45deg, #cedce7 0%, #596a72\
  \ 100%); }\n```\n\n注意观察 `#my-first-element` 中的 CSS，第一个描述符中的背景颜色是普通的十六进制颜色，而其余部分是\
  \ RGBA 颜色。此外，尽管在 mixin 调用中使用了 RGBA 设置了停止颜色，但它仍然是十六进制颜色，因为透明度被设置为 1，而起始颜色被设为 0.5。SASS\
  \ 将选择最高效的方式来输出你的颜色。\n\n## 选择器继承 (Selector Inheritance)\n\n当然，在整个 SASS 文件中使用 mixins\
  \ 是极具诱惑力的，尽管生成的 CSS 可能完全相同。选择器继承允许你在放置在 SASS 文件其他位置的规则中重用相同的 CSS 规则。例如，在 CSS 中你可以使用以下代码。\n\
  \n```css\n.my-element-one, .my-element-two, .my-element-three {\n  /** 在此处插入公共的\
  \ CSS 样式 **/\n}\n```\n\n虽然这种方法很高效，但很容易丢失哪些 CSS 规则与一组规则相关联。你可能必须在文档中处处寻找那组规则以及与它关联的元素、类和\
  \ ID。更令人困惑的是，样式可能位于不同的 CSS 文件中。\n\n选择器继承有助于克服这个问题。选择器继承允许你生成与上面所示相同的代码，但方式要对开发人员友好友好得多。\n\
  \n使用 mixins 部分的示例，你可以定义一种渐变，并在 SASS 文件中任何相关的规则地方使用它，而不会导致生成的渐变在 CSS 文件中生成多次。\n\n\
  ```scss\n.block {\n  @include gradient(rgba(206,220,231,0.5), rgba(89,106,114,1),\
  \ -45deg);\n}\n\n.sidebar-block {\n  border-radius: 10px;\n  @extend .block;\n}\n\
  ```\n\n如你所见，除了圆角框外，`.sidebar-block` 与 `.block` 规则相似。生成的 CSS 如下。\n\n第 5 章：移动端 CSS3\n\
  \n155\n\n```css\n.block, .sidebar-block {\n  background: #cedce7;\n  background:\
  \ -moz-linear-gradient(-45deg, rgba(206, 220, 231, 0.5) 0%, #596a72 100%);\n  background:\
  \ -webkit-gradient(linear, left top, right bottom, color-stop(0%, rgba(206, 220,\
  \ 231, 0.5)), color-stop(100%, #596a72));\n  background: -o-linear-gradient(-45deg,\
  \ rgba(206, 220, 231, 0.5) 0%, #596a72 100%);\n  background: -ms-linear-gradient(-45deg,\
  \ rgba(206, 220, 231, 0.5) 0% #596a72 100%);\n  background: linear-gradient(-45deg,\
  \ rgba(206, 220, 231, 0.5) 0%, #596a72 100%); }\n\n.sidebar-block {\n  border-radius:\
  \ 10px; }\n```\n\n你可以看到，`.sidebar-block` 与 `.block` 规则相似，除了圆角边框。\n\n你可以看到 SASS 将\
  \ `border-radius` 属性分离出来，并将其放在 `.sidebar-block` 独立的 CSS 规则中。\n\n你也可以为元素添加链式类，它将为\
  \ `.sidebar-block` 和 `.block` 规则同时生成边缘情况。\n\n```scss\n/**\n* mobile.scss\n*/\n.block\
  \ {\n  @include gradient(rgba(206,220,231,0.5), rgba(89,106,114,1), -45deg);\n}\n\
  \n.block.wide {\n  width: 100px;\n}\n\n.sidebar-block {\n  border-radius: 10px;\n\
  \  @extend .block;\n}\n\n/**\n* mobile.css\n */\n.block, .sidebar-block {\n  background:\
  \ #cedce7;\n  background: -moz-linear-gradient(-45deg, rgba(206, 220, 231, 0.5)\
  \ 0%, #596a72 100%);\n  background: -webkit-gradient(linear, left top, right bottom,\
  \ color-stop(0%, rgba(206, 220, 231, 0.5)), color-stop(100%, #596a72));\n  background:\
  \ -o-linear-gradient(-45deg, rgba(206, 220, 231, 0.5) 0%, #596a72 100%);\n  background:\
  \ -ms-linear-gradient(-45deg, rgba(206, 220, 231, 0.5) 0% #596a72 100%);\n  background:\
  \ linear-gradient(-45deg, rgba(206, 220, 231, 0.5) 0%, #596a72 100%); }\n\n.sidebar-block\
  \ {\n  border-radius: 10px; }\n```\n\n 总结\n\n通过本章，你应该掌握了 CSS3 的一些新特性以及如何使用它们。\n\n\
  \n\n\n\n![Image 86](img/index-162_1.jpg)\n\n# 第 6 章：奠 CSS3 基础\n\n159\n\n在编译 `mobile.scss`\
  \ 文件之前，你将需要创建相应的 SASS 文件。\n\n* `mixins/_animations.scss`\n* `mixins/_box-sizing.scss`\n\
  * `mixins/_gradient.scss`\n* `partials/_forms.scss`\n* `partials/_highres.scss`\n\
  * `partials/_layout.scss`\n* `partials/_reset.scss`\n* `partials/_typography.scss`\n\
  \n现在去创建这些文件吧，记住 SASS 部分文件（partials）的文件需要以 `_`（下划线）开头以便被识别并导入。\n\n你需要创建图 6-2 所示的空文件。\n\
  \n**图 6-2。** *SASS 部分文件*\n\n你会注意到有一个名为 `_reset.scss` 的文件。如果你熟悉 Eric Meyer 的重置 CSS\
  \ 文件，那么重置样式表用于为跨浏览器的 CSS 样式创建一个公平的运行环境。这是因为浏览器对某些元素（如不同的外边距、内边距和字体大小）可能会有不同的默认样式。重置样式表为最常用的\
  \ HTML 元素设置了新的可预测默认值。请注意，某些样式表（特别是 Eric Meyer 的）会重置字体，使其完全没有样式，这很有用，但你必须记住，对于具有默认字体样式的元素（如\
  \ `<pre />`），它们将具有 `<body />` 相同的字体族。\n\n# 第 6 章：奠 CSS3 基础\n\n160\n\n在 `mixins`\
  \ 文件夹中，你会看到几个看起来像应该是 CSS 属性的文件，例如 `_animation.scss` 和 `_gradient.scss`。这些文件的存在是为了通过混合入（mixins）创建属性的通用版本，从而避免某些厂商特定的\
  \ CSS 污染主 SASS 文件。你可以开始向这些文件中添加内容了。\n\n打开空的 `_animations.scss` 文件。这个混合入将用于创建动画并将其应用到所有厂商。如果创建了新的厂商特定动画属性，可以在一个地方添加它，而不是在你的\
  \ SASS 文件中多处添加。将以下代码添加到已打开的文件。\n\n```scss\n@mixin animation ($values) {\nanimation:\n\
  $values;\n-moz-animation:\n$values;\n-webkit-animation:\n$values;\n}\n```\n\n如你所见，它仅仅充当基于标准的、Mozilla\
  \ 和 webkit 动画属性的代理，接收一组属性并将它们传递给厂商特定的动画属性。保存并关闭文件。\n\n打开空的 `_box-sizing.scss` 文件。这个混合入提供了对盒盒模型（box-sizing）的支持。CSS\
  \ 弹性布局中最令人沮丧的问题之一是，当一个元素设置为 100% 宽（父元素的宽度）并带有内边距时，浏览器通常会将内边距添加到元素的宽度中，即使宽度指定为 100%\
  \ 也是如此，因此结果是你的元素会因为你添加的内边距而过度延伸，有时会将元素略微推出屏幕或超出其父元素。`box-sizing` 属性通过以下方式帮助解决这个问题：\n\
  \n* 使用 `content-box` 值时，从元素的宽度和高度中排除任何内边距、外边距或边框\n* 使用 `padding-box` 值时，将任何内边距包含在元素的宽度和高度中\n\
  * 使用 `border-box` 值时，将任何内边距和边框宽度包含在元素的宽度和高度中\n\n```scss\n@mixin box-sizing ($value)\
  \ {\n-moz-box-sizing: $value;\n-webkit-box-sizing: $value;\nbox-sizing: $value;\n\
  }\n```\n\n再次，这个混合入仅仅通过将值传递给属性来充当厂商特定属性的代理。\n\n最后，打开 `_gradient.scss` 文件并将其添加以下代码。\n\
  \n# 第 6 章：奠 CSS3 基础\n\n161\n\n```scss\n@mixin gradient($start, $stop, $degrees)\
  \ {\nbackground: rgba($start, 1);\nbackground: -moz-linear-gradient($degrees, $start\
  \ 0%, $stop 100%);\nbackground: -webkit-gradient(linear, left top, left bottom,\
  \ color-stop(0%,\n$start), color-stop(100%, $stop));\nbackground: -o-linear-gradient($degrees,\
  \ $start 0%,$stop 100%);\nbackground: -ms-linear-gradient($degrees, $start 0% $stop\
  \ 100%);\nbackground: linear-gradient($degrees, $start 0%, $stop 100%);\n}\n```\n\
  \n你可能在上一章中见过这个混合入。它仅仅是为厂商特定的渐变代码创建 CSS 渐变。它比其他混合入稍微复杂，因为在编写时，每个厂商都有自己的 CSS 渐变实现，这使得接受单个值并将其传递给厂商属性变得不可能。\n\
  \n 创建部分文件\n\n创建混合入后，现在是创建部分文件了。如前所述，部分文件将有助于将 CSS 的不同部分分离到不同的文件中，而不会通过在普通 CSS 文件中使用传统的\
  \ `@import` 来影响终端用户（这对加载时间有很大影响）。\n\n你可以从打开 `partials` 目录下的空 `_reset.scss` 文件开始。\n\
  \n你不需要手动在该 SASS 文件中输入以下代码，可以从 Eric Meyer 的网站 `http://meyerweb.com/eric/thoughts/2011/01/03/reset-revisited/`\
  \ 复制。\n\n# 第 6 章：奠 CSS3 基础\n\n162\n\n...（内容保持逻辑） ...\n\n# 第 6 章：奠 CSS3 基础\n\n163\n\
  \n```css\nbody {\n  font-size: 0.75em;\n  font-family: Arial, sans-serif;\n}\n\n\
  h1, h2, h3, h4 {\n  font-family: 'Arimo', sans-serif;\n  font-weight: bold;\n  margin-bottom:\
  \ 0.5em;\n  font-size: 1em;\n}\n\nh3 { font-size: 1.25em; }\nh2 { font-size: 1.5em;\
  \ }\nh1 { font-size: 1.9em; }\n```\n\n你使用 em 而不是像素作为字体大小。将 body 的字体设置为 0.75em 等同于\
  \ 12px，如上面的代码段所示，此处字体声明为 em。1em 等同于浏览器的默认字体大小，即 16px。要计算 10px 在 em 中是多少，你需要使用 10\
  \ / 16，结果等于 0.625，因此 10px 为 0.625em。em 很有用，因为值是相对的。例如，如果你将一个 div 的字体大小设置为 0.75em\
  \ (12px)，然后将该元素内的任何元素设置为 1em，那么该字体大小将相对于父元素的字体大小。因此，子元素中的 1em 变成了父元素的 0.75em。尝试弄出\
  \ em 的字体大小可能是一场噩梦，\n\n\n\n\n\n[http://riddle.pl/emcalc/] 有一个解决方案，允许你构建一个基于像素单位的字体大小\
  \ DOM 树，该 Web 应用将为你将它们转换为 em，并考虑父元素的字体大小。\n\n保存并关闭 `_typography.scss` 文件。打开 `_layout.scss`\
  \ 文件。`_layout.scss` 文件将控制应用程序内元素的定位、尺寸、颜色和整体布局。\n\n第一要工作是为应用程序的 `body`、`html`、`#shoe`\
  \ 和 `.deck` 元素设置样式。你在顶部对这些元素设置样式，以便在样式表的后部分对其进行覆盖。\n\n```css\nbody, html, #shoe,\
  \ .deck {\nheight: 100%;\nwidth: 100%;\noverflow: hidden;\nmargin: 0px;\n}\n```\n\
  \n如你所见，高度和宽度已设置为 100%，以便跨越整个屏幕的宽高。添加 `overflow: hidden;` 是为了让任何溢出元素的内容被截断且不影响布局；为了保险起见，还添加了\
  \ 0px 的外边距以防止元素之间出现任何间隙。\n\n# 第 6 章：奠定 CSS3 基础\n\n下一步的工作是为 `#card-movie_search_results`\
  \ 卡片设置样式。在搜索时，卡片应该显示在页面所有元素之上。你可以通过设置 `z-index` 来实现这一点。`z-index` 决定了元素在元素堆栈中的位置。设置一个高数值通常会将元素置于堆栈顶部。本例中使用了\
  \ 50。\n\n```css\n/**\n* 单个卡片样式\n*/\n#card-movie_search_results {\nz-index: 50;\n\
  }\n```\n\n下一步是设置 deck 和卡片的样式。如你所见，这里使用了 SASS 嵌套将不同的卡片状态嵌套在 deck 内部。当 SASS 文件渲染时，将生成相应的\
  \ CSS。你希望将 deck 的位置设置为 `relative`（相对）。这允许 deck 内部的绝对定位的卡片相对于父级 deck 进行定位，而不是相对于整个视口。\n\
  \n```css\n/**\n* Deck 样式\n*/\n.deck {\nposition: relative;\n}\n```\n\n你现在也需要为任何带有\
  \ `.card` 类的元素设置样式。每张卡片的宽度和高度应与 deck 相同，但位置应位于屏幕之外，以便用户最初无法看到它。当给任何 `.card` 元素添加\
  \ `.active` 类时，它应该被带回视野。这可以通过将初始左位置设置为负值来实现，该值等同于卡片的宽度，在本例中为 -100%。当你想要将卡片带回视野时，为\
  \ `.active` 样式设置了 0px 的位置。\n\n```css\n/**\n* Deck 样式\n*/\n.deck {\nposition: relative;\n\
  }\n.card {\nheight: 100%;\nwidth: 100%;\nleft: -100%;\nposition: absolute;\n}\n\
  .card.active {\nleft: 0px;\n}\n}\n```\n\n接下来要设置的元素是状态栏（screen bars）。状态栏将位于屏幕的顶部和底部。这些需要以统一的方式设置样式，以便用户能够轻松找到它们。如下所示，使用了渐变混合（mixin）来为该元素的背景创建一个\
  \ CSS3 渐变。\n\n```css\n/**\n* 头部任务栏样式\n*/\n.screenbar {\n@include gradient(#7D9DCE,\
  \ #ABC1E1, 90deg);\n}\n```\n\n任务栏相当复杂，因为它包含了应用程序的 Logo、搜索字段和一个清除按钮。任务栏的需要与屏幕等宽，搜索字段需要是灵活的，以便无论屏幕多大，它都能占据大部分空间。\n\
  \n从下面的代码可以看出，你将任务栏的字体颜色设置为白色，并将 `overflow` 设置为隐藏（hidden），以便它能包裹任何浮动元素。任务栏还有 10px\
  \ 的内边距和底部的红色边框。\n\n```css\nheader#taskbar {\ncolor: #FFFFFF;\noverflow: hidden;\n\
  padding: 10px;\nborder-bottom: 1px solid #BF2628;\n}\n```\n\n你现在可能想为应用程序的品牌/Logo\
  \ 设置样式。为了实现这一点，你可以使用一个 `header` (`h1`) 元素，然后使用图像替换技术来显示 Logo。这可以通过将 `h1` 的宽度和高度设置为与\
  \ Logo 相同的宽高来实现，将 `text-indent` 属性设置为一个很大的任意负值，使文本定位在屏幕外——在本例中使用了 -10000px。最后，将\
  \ Logo 的背景设置为 Logo 图片。`h1` 元素也浮动到任务栏的左侧，以便搜索表单占据剩余空间。\n\n```css\nheader#taskbar\
  \ {\n...\nh1.branding {\nmargin: 0px;\nfloat: left;\nwidth: 73px;\nheight: 32px;\n\
  text-indent: -10000px;\noverflow: hidden;\nbackground: url('../img/momemo.png')\
  \ no-repeat top left;\n}\n}\n```\n\n下一步工作是设置清除搜索链接。你使用与之前相同的图像替换技术来替换清除搜索链接。这次按钮浮动在右侧并隐藏，以确保它不显示。\n\
  \n```css\nheader#taskbar {\n...\nh1.branding {\n...\n}\n.clear-search {\nfloat:\
  \ right;\nwidth: 35px;\nheight: 35px;\ndisplay: none;\noverflow: hidden;\ntext-indent:\
  \ -10000px;\nbackground: url('../img/clear.png') 50% 50%;\n}\n}\n```\n\n最后添加到 `_layout.scss`\
  \ 的内容是 `searchactive` 覆盖。当你向 `header#taskbar` 添加该 CSS 类时，它将防止搜索按钮掉到新的一行。\n\n\n\n\
  \n以下代码仅对搜索字段进行样式处理。如你所见，`background-size` 在这里首次使用。`background-size` 属性允许你指定背景的大小，可以是像素，也可以是背景所添加元素的百分比。\n\
  \n```css\ninput.search {\n  padding-left: 30px;\n  background: url('../img/search.png')\
  \ 5px 50% no-repeat transparent;\n  background-size: auto 50%;\n  border: none;\n\
  \  border-bottom: 1px solid #BF2628;\n  color: #FFFFFF;\n  font-size: 1.5em;\n}\n\
  ```\n\n`background-size` 属性接受宽度和高度，两个属性都可以使用不同的单位。例如，在这个示例中，宽度被设置为 `auto`，高度被设置为\
  \ `50%`。这允许高度为元素高度的 `50%`，但宽度将根据背景图像的高度等比例调整，使其不会出现变形。\n\n以下样式使用了特定厂商的伪类。`-webkit-input-placeholder`\
  \ 和 `-moz-placeholder` 允许你对输入元素上使用的占位符文本进行样式设置。例如，在蓝色背景上搜索框的背景是透明的，因此默认的灰色几乎可见。文本需要是白色，所以占位符伪类允许你自定义占位符文本的呈现方式。\n\
  \n```css\ninput.search::-webkit-input-placeholder, input.search::-moz-placeholder\
  \ {\n  color: rgba(255, 255, 255, 0.5);\n}\n```\n\n虽然在 Android 4 上不会立即显示，但下面的样式会在后台搜索电影时在搜索框中加载加载。\n\
  \n```css\ninput.search.loading {\n  background-image: url('../img/loading.gif');\n\
  }\n```\n\n你的最终 SASS 文件应该看起来像下面的代码。\n\n```sass\ninput, select, textarea, button {\n\
  \  @include box-sizing(border-box);\n}\n\ninput[type=\"text\"] {\n  border: 1px\
  \ solid #000000;\n  padding: 5px;\n}\n\ninput.full-width {\n  width: 100%;\n}\n\n\
  form#add-movie {\n  margin-left: 80px;\n}\n\ninput.search {\n  padding-left: 30px;\n\
  \  background: url('../img/search.png') 5px 50% no-repeat transparent;\n  background-size:\
  \ auto 50%;\n  border: none;\n  border-bottom: 1px solid #BF2628;\n  color: #FFFFFF;\n\
  \  font-size: 1.5em;\n}\n\ninput.search::-webkit-input-placeholder, input.search::-moz-placeholder\
  \ {\n  color: rgba(255, 255, 255, 0.5);\n}\n\ninput.search.loading {\n  background-image:\
  \ url('../img/loading.gif');\n}\n```\n\n保存并关闭你的文件。最后，你需要打开 `_highres.scss` 文件。此文件将仅用于替换高分辨率器上的任何图形，以便它们看起来清晰。向文件中添加以下代码。\n\
  \n```css\nheader#taskbar {\n  h1.branding {\n    background-image: url('../img/highres/momemo.png');\n\
  \    background-size: 73px 32px;\n  }\n}\n```\n\n如你所见，这里需要使用 `background-size`，因为尽管高分辨率文件的分辨率是低分辨率图像的两倍，但\
  \ CSS 在作为背景图像使用时仍仍图像的原始尺寸。这将确保背景图像被缩放到正确的像素大小。不使用它和使用它之间的区别可以在下面的图 6-3 中所示。\n\n\
  ![Image 87](img/index-174_1.jpg)\n![Image 88](img/index-174_2.jpg)\n![Image 89](img/index-174_3.jpg)\n\
  \n**图 6-3. 高密度显示器上的高分辨率图像（下）与低分辨率图像（上）**\n\n### 在 Aptana 中自动编译 Sass\n\n到目前为止，你还没有在\
  \ Aptana Studio 中编译过任何 SASS。在上一章节中，你了解了如何使用 SASS 内置的 SASS 编译器命令来编译 SASS 文件。每当你想要修改\
  \ SASS 文件时，这可能会变得非常麻烦。你可以通过使用 SASS 命令行自动编译 SASS 文件来绕过这个问题。为了做到这一点，在 Aptana Studio\
  \ 的 App Explorer 中点击你的应用程序文件夹，然后点击 Commands 图标，它看起来像齿轮，如图 6-4 所示。\n\n**图 6-4. 命令菜单**\n\
  \n点击 Open Terminal 菜单项。这将打开一个类似于图 6-5 的终端视图。\n\n**图 6-5. 终端视图**\n\n![Image 90](img/index-175_1.jpg)\n\
  ![Image 91](img/index-175_2.jpg)\n\n在终端视图中，输入以下命令并按回车。\n\n```bash\nsass --watch\
  \ css/*.scss\n```\n\n这将查找你的 SASS 文件中的任何更改。你应该会看到类似于图 6-6 的内容。\n\n**图 6-6. sass --watch\
  \ 输出**\n\n**图 6-7. 使用 CSS 的 Momemo****\n\n### 面对象 JavaScript\n\nJavaScript 是处理和响应移动网站用户交互的极佳语言。与为桌面网页编写\
  \ JavaScript 的方式类似，你也可以在移动端使用相同的设计模式和编写方法。你可以通过两种方式编写 JavaScript。其中一种方法是过程式的，如下代码所示。\n\
  \n```javascript\nfunction sayHelloWorld(foo) {\n  alert(foo);\n}\n```\n\n第二种方法是面向对象的，如下所示。\n\
  \n```javascript\nvar World = function(){\n  this.say = function say(hello){\n  \
  \  alert(hello);\n  }\n}\n\nvar myworld = new World();\nmyworld.say('Hello');\n\
  ```\n\n如你所见，面向对象的方法可能需要编写更多的代码，但它有许多优点：\n\n* 面向对象的方法允许对代码进行扩展。\n* 面向对象的方法可以更有组织性。\n\
  * 面向对象的方法允许封装，这意味着对象内部的变量或属性可以是公共的或私有的。\n* 面向对象的方法允许你将对象传递给其他对象。这通常被对象对象依赖。\n\n\
  **注意：** 在 Java、Objective-C 和 PHP 等类语言中\n\n\n\n\n\n类（Class）在通过 `new ClassName` 实例化之前是一个对象。\n\
  \n对象（Object）是类在实例化后的一个实例。\n\nJavaScript 拥有创建对象的内置方法，遗憾的是，它原生并不完全支持封装、继承、抽象和接口。你可能需要创建自己的方法和实践来来实现这些功能。JavaScript\
  \ 也是一种基于对象的语言，因此尽管你觉得是在创建类，但实际上你是在代码中创建结构，让你的对象从中形成形态。\n\n```javascript\nvar World\
  \ = function(_name){\n  var name = _name;\n  this.greet = function(guest){\n   \
  \ alert('Hello ' + guest + ' my name is ' + name);\n  }\n}\n\nvar venus = new World('Venus');\n\
  var mars = new World('Mars');\nvenus.greet('Antony');\nvenus.greet('Dan');\n```\n\
  \n从上面的示例中，你可以看到在 JavaScript 中，创建一个对象像创建一个函数一样简单。通过使用函数的参数，你创建了一个所谓的 `constructor`（构造函数）。构造函数是一种在实例化时向对象传递参数的方法。这些参数通常用于将变量赋值给对象内部的属性。\n\
  \n在普通的面向对象编程中，属性可以被声明为公共或私有。在 JavaScript 中，属性没有此类此类声明。因此，属性既可以是实例变量（私有），也可以是公共属性（公共）。在此实例中，`name`\
  \ 属性是一个实例变量，这意味着你无法从对象外部（例如通过 `venus.name`）访问它。这通常被称为封装。对象的属性是一个变量，可以通过对象作用域内部的\
  \ `this.propertyname` 访问，也可以在对象外部通过 `object.propertyname` 访问。例如，如果你尝试从对象外部访问 `name`\
  \ 实例变量，你将得到输出 `undefined`。\n\n你还可以创建对象方法，这些函数可以通过对象内部的 `this` 访问，也可以在对象外部通过赋值给实例化对象的变量来访问。使用之前的示例，`this.greet`\
  \ 是一个公共对象方法，可以在对象外部被访问。\n\n从这里开始，你可以看到对象允许代码更具维护性。对象的属性存在于全局命名空间之外，因此你避免了特定对象的变量名冲突和其他细节问题。你还可以更进一步，为你的应用程序对象创建自定义的命名空间。这有助于避免其他\
  \ JavaScript 库可能覆盖它们。接下来的示例展示了为你的对象创建应用级命名空间的最基本方法。\n\n```javascript\nvar app =\
  \ app || {};\n\napp.world = function(_name){\n  var name = _name;\n  this.greet\
  \ = function(guest){\n    alert('Hello ' + guest + ' my name is ' + name);\n  }\n\
  }\n```\n\n这允许你在单独的文件创建属于你应用程序的类。上述代码样本的第一行在全局命名空间中声明变量 `app`，如果 `app` 全局变量已经存在，则将其赋值给它。如果不存在，它将创建一个空对象供你开始填充你的对象。如果你在开发过程中将对象组织为存储在单独的文件中，然后在生产环境中进行合并，这会非常有用。\n\
  \n你甚至可以进一步，根据功能对对象进行命名空间处理。这些是面向对象 JavaScript 的基础，现代移动浏览器支持这些。\n\n你这种方式编写代码（而不是创建\
  \ jQuery 插件），是因为它将你的应用程序代码与特定供应商的代码分离，并减少了对第三方代码的依赖。你可以更进一步，遵循模型-视图控制器（MVC）模式，将用户交互与领域逻辑（真实世界对象）以及呈现给用户的视图分离开来。\n\
  \n除了设计模式和面向对象之外，JavaScript 是一种事件驱动的语言。这意味着在应用程序某部分触发的事件可以在运行时触发应用程序完全不同部分的代码。在最简单的形式中，事件可以通过用户交互来触发。在移动端，这通常表现为触摸事件，用户通过手指通过浏览器与你的应用程序交互。浏览器注册该事件，然后将事件及其信息（例如事件源自元素）传递给应用程序中的任何订阅者。对于桌面环境，这些被称为鼠标事件。\n\
  \n### 处理触摸事件\n\nJavaScript 在处理桌面端事件方面并不逊色，移动端也是如此。事件可以由用户级事件（如触摸和拖拽）组成，也可以由设备级事件（如方向变化或设备位置变化）组成。最基本的事件是用户级事件。它们可以在任何\
  \ DOM 元素上进行跟踪。对于移动设备，有四个主要的触摸事件：\n\n- `touchstart`\n- `touchend`\n- `touchmove`\n\
  - `touchcancel`\n\n当用户触摸屏幕上的元素时，会触发 `touchstart` 事件。当用户在触摸屏幕上的元素后抬起手指时，会触发 `touchend`\
  \ 事件。`touchmove` 事件会跟踪用户的移动并在每次移动时触发事件。当用户通过移动目标边界并释放屏幕取消触摸事件时，会触发 `touchcancel`\
  \ 事件。这个事件似乎不可。\n\n为了响应事件，你必须使用 `element.addEventListener(event, callbackfunction)`\
  \ 为它们创建事件监听器。该方法接收事件名称（如 `touchstart`、`touchend` 等）和回调函数。有时，你可能希望防止事件的默认操作。例如，如果你在链接上添加事件监听器，你可能不希望在点击时打开新页面。要实现这一点，你必须为回调函数添加一个名为\
  \ `e` 的参数，并在函数末尾调用 `e.preventDefault()`。这还将防止元素滚动并干扰 `touchmove` 事件，如下代码片段所示。\n\n\
  ```html\n<div id=\"touch-plane\" style=\"width: 100%; height: 100%; background:\
  \ #000000; color: #FFFFFF;\">\n<span id=\"coordinates\">x: 0 y: 0</span> - <span\
  \ id=\"touching\">not touching</span>\n</div>\n```\n\n```javascript\n<script>\n\
  document.getElementById('touch-plane').addEventListener('touchmove', function(e){\n\
  \  document.getElementById('coordinates').innerText = 'x: ' + e.touches[0].clientX\
  \ + ' y: ' + e.touches[0].clientY;\n  e.preventDefault();\n});\n\ndocument.getElementById('touch-plane').addEventListener('touchstart',\
  \ function(e){\n  document.getElementById('touching').innerText = 'touching';\n\
  });\n\ndocument.getElementById('touch-plane').addEventListener('touchend', function(e){\n\
  \  document.getElementById('touching').innerText = 'not touching';\n});\n</script>\n\
  ```\n\n\n\n\n这段代码将屏幕填充为黑色，并用白色文字显示用户手指的当前坐标以及用户是否正在触摸屏幕。你可以通过访问传递给 `touchmove` 事件监听器的事件中的\
  \ `touches` 列表来获取当前坐标。你可以从列表中获取第一个触摸点，并使用 `clientX` 和 `clientY` 来获取 X 和 Y 坐标，如下：\n\
  \n```\ne.touches[0].clientX, e.touches[0].clientY\n```\n\n如你所见，你可以通过调用以下代码来防止文档滚动：\n\
  \n```javascript\ne.preventDefault();\n```\n\n另外两个事件监听器 `touchstart` 和 `touchend`\
  \ 会用户触摸屏幕和抬起手指时被调用。\n\n**图 7-1. 检测触摸和移动**\n\n# 第 7 章：用于移动端的 JavaScript\n\n### 获取用户位置\n\
  \n当你知道用户需要在应用程序中输入他们的当前位置时，获取用户的位置将非常方便。这对于寻找寻找和搜索他们周围的物品（如活动、地点和其他人）很有用。\n\n位置\
  \ API 非常简单，它利用了移动设备内置的 GPS 芯片。\n\n要获取用户的位置，可以使用以下代码。它是异步且非阻塞的，因此当设备搜索用户位置时，你可以继续在以前台或后台处理\
  \ JavaScript 事件。\n\n```javascript\nvar showCurrentPosition = function(position){\n\
  \  alert('Lat: ' + position.coords.longitude + ' Lon: ' + position.coords.latitude);\n\
  }\n```\n\n这是一个在移动设备获取用户位置后会被调用的函数。传递回调函数的参数是一个扩展了 `Coordinates` 接口的对象，具有表 7-1 所示的属性。\n\
  \n**表 7-1. Coordinates 对象属性**\n\n| 属性 |  |\n| :--- | :--- |\n| `Coordinates.timestamp`\
  \ | 获取位置的时间 |\n| `Coordinates.coords` | 坐标对象 |\n| `Coordinates.coords.accuracy`\
  \ | 经纬度结果的精度水平 |\n| `Coordinates.coords.altitude` | 如果可用，设备的高度（米制）；如果无法确定，则返回 null\
  \ |\n| `Coordinates.coords.altitudeAccuracy` | 高度结果的精度；如果无法确定，则返回 null |\n| `Coordinates.coords.heading`\
  \ | 设备的航向，或以度为单位的方向。如果无法确定航向，该属性的值为 null |\n| `Coordinates.coords.latitude` | 以十进制度表示的设备纬度\
  \ |\n| `Coordinates.coords.longitude` | 以十进制度表示的设备经度 |\n| `Coordinates.coords.speed`\
  \ | 水平移动速度（米/秒）；如果无法确定，则返回 null |\n\n若要获取设备的坐标，查询设备用户位置的简单用例如下：\n\n```javascript\n\
  navigator.geolocation.getCurrentPosition(showCurrentPosition);\n```\n\n如果用户尚未授权你的应用程序访问其位置，他们首先会被要求批准位置请求。图\
  \ 7-2 显示了该对话框的样子。\n\n![Image 93](img/index-185_1.jpg)\n\n**图 7-2. 位置请求**\n\n这带来了一个问题，因为你应该考虑到某些用户可能不想共享他们的当前位置并可能点击拒绝按钮；或者获取用户当前位置时可能存在问题。这可以使用错误事件处理器处理，它是\
  \ `getCurrentPosition()` 方法的第二个参数。为了处理获取用户当前位置时的错误，你必须创建一个错误处理器，它将接受错误对象。\n\n```javascript\n\
  var handleLocationError = function(error){\n  alert(error.message);\n}\n\nnavigator.geolocation.getCurrentPosition(showCurrentPosition,\
  \ handleLocationError);\n```\n\n错误对象是 `PositionError` 接口的一部分，具有表 7-2 所示的属性。\n\n\
  **表 7-2. PositionError 属性和常量**\n\n| 属性/常量 | 说明 |\n| :--- | :--- |\n| `PositionError.code`\
  \ | 错误返回的代码；使用以下常量来确定错误代码 |\n| `PositionError.PERMISSION_DENIED` | 用户拒绝了获取权限的请求\
  \ |\n| `PositionError.POSITION_UNAVAILABLE` | 由于其他设备问题无法确定位置 |\n| `PositionError.TIMEOUT`\
  \ | 由于请求超时，无法确定位置 |\n| `PositionError.message` | 错误的详细消息 |\n\n你应该使用 `PositionError`\
  \ 常量 `PERMISSION_DENIED`、`POSITION_UNAVAILABLE` 和 `TIMEOUT` 来妥善处理错误，而不是依赖错误消息或将错误代码与硬编码的整数进行比较。下一个代码示例显示了如何使用\
  \ `handleLocationError` 函数和 `switch` 语句处理错误。\n\n```javascript\nvar handleLocationError\
  \ = function(error){\n  switch(error.code){\n    case error.PERMISSION_DENIED:\n\
  \      /**\n       * 在处处理拒绝权限的响应，\n       * 可能向用户显示对话框\n       */\n      var confirmed\
  \ = confirm(\"我们确实需要您的位置!\");\n      if(confirmed){\n        navigator.getCurrentPosition(showCurrentPosition,\
  \ handleLocationError);\n      }\n      break;\n    case error.POSITON_UNAVAILABLE:\n\
  \      /**\n       * 在处处理位置不可用的响应，\n       * 可能向用户显示对话框并\n       * 让他们手动输入位置\n \
  \      */\n      var tryagain = confirm(\"抱歉，出了严重问题，你想重试一次吗？\");\n      if(tryagain){\n\
  \        navigator.getCurrentPosition(showCurrentPosition, handleLocationError);\n\
  \      }\n      break;\n    case error.TIMEOUT:\n      /**\n       * 对延迟表示歉并尝试\n\
  \       * 重新获取位置\n       */\n      navigator.getCurrentPosition(showCurrentPosition,\
  \ handleLocationError);\n      break;\n  }\n}\n```\n\n这些是非常简单的错误处理器，如果发生错误，可以扩展它们以为用户提供更好的体验。然后你可以将坐标传递给地图服务（如\
  \ Google Maps），以显示用户的当前位置。以下示例使用 Google Maps 静态 API 生成一张显示在移动设备上的用户位置图像。\n\n```html\n\
  <img src=\"/map.jpg\" id=\"map\" alt=\"Map\" />\n\n<script>\nvar showCurrentPosition\
  \ = function(position){\n  document.getElementById('map').src = 'http://maps.google.com/maps/api/staticmap?center='\
  \ + position.coords.latitude + ',' + position.coords.longitude + '&zoom=10&markers='\
  \ + position.coords.latitude + ',' + position.coords.longitude + '&size=' + window.innerWidth\
  \ + 'x' + window.innerHeight + '&sensor=true';\n}\n\nvar handleLocationError = function(error){\n\
  \  alert(error.message);\n}\n\nnavigator.geolocation.getCurrentPosition(showCurrentPosition,\
  \ handleLocationError);\n</script>\n```\n\n结果见图 7-3。当然，你也可以订阅用户当前位置的显著变化。你可以通过 `navigator.geolocation.watchPosition`\
  \ 方法来实现这一点。它会监听用户当前位置的重要变化，并在每次位置发生变化时调用回调函数。`watchPosition` 方法接受与 `getCurrentPosition`\
  \ 方法相同的参数。\n\n## 使用 Canvas 绘制\n\nHTML5 Canvas 允许你使用 JavaScript 绘制矢量形状。HTML5 Canvas\
  \ 元素本身不提供很多功能，但它提供了一个供你绘制对象的基础。你可以把它想象成设备上的白板。下一个练习将引导你如何创建画布、如何使用 JavaScript 开始绘制基础形状，以及如何让它们动起来。\n\
  \n\n\n首先，在本章节文件夹内创建一个名为 `canvas` 的新文件夹。在 `canvas` 目录根目录下创建一个 `js` 文件夹，其中包含一个名为 `canvas.js`\
  \ 的新 JavaScript 文件和一个 `index.html` 文件，其内容如下：\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"\
  width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0; target-densitydpi=device-dpi;\"\
  />\n<title>Canvas</title>\n<style type=\"text/css\" media=\"screen\">\nbody, html\
  \ {\nmargin: 0;\nheight: 100%;\nwidth: 100%;\n}\nCHAPTER 7: JavaScript for Mobile\n\
  187\n</style>\n</head>\n<body>\n<canvas id=\"play\" width=\"100\" height=\"100\"\
  ></canvas>\n<script src=\"js/canvas.js\"></script>\n</body>\n</html>\n```\n\n这将创建一个\
  \ `id` 为 `play` 的 `Canvas` 元素，宽度为 100 像素，高度为 100 像素。你不应尝试使用 CSS 为 `Canvas` 元素设置大小，因为无法达到预期的效果。此\
  \ HTML 还链接到 `canvas.js` 文件。\n\n打开 `canvas.js` 文件，它将用于控制你的画布。你将使用面向对象的 JavaScript\
  \ 来创建和控制播放按钮。\n\n在这个示例中，你需要两个对象：`track` 对象（用于模拟实际的音频轨道）和一个 `playButton` 对象（用于控制显示轨道进度以及播放/暂停轨道）。`track`\
  \ 对象应该负责以下工作：\n\n- 跟踪轨道的总长度\n- 维护轨道的当前状态（播放/暂停/停止）\n- 如果轨道正在播放，则维护轨道的当前时间\n- 播放、暂停和停止轨道\n\
  \n此示例中的 `playButton` 对象将负责以下工作：\n- 绘制绘制播放按钮\n- 显示播放进度\n- 显示轨道的播放状态\n- 通过显示播放或停止符号来表示轨道的状态\n\
  - 通过移动播放头来表示轨道的播放进度\n\n灵感来自如图 7-4 所示的 iTunes 播放控制，你将创建一个类似的东西。\n\n![Image 95](img/index-190_1.jpg)\n\
  \nCHAPTER 7: JavaScript for Mobile\n188\n**图 7-4.iTunes 预览播放控制**\n\n首先，在你的 `canvas.js`\
  \ 文件中创建这两个对象，如下代码段所示：\n\n```javascript\nvar app = app || {};\n\napp.playButton =\
  \ function(id, track){\n}\n\napp.track = function(length){\n}\n```\n\n如你所示，`playButton`\
  \ 的构造函数接收一个 `id`（这将是 `Canvas` 元素的 `ID`）和一个 `track`（这将是 `app.track` 类的实例）。`track`\
  \ 构造函数仅接收以秒为单位的轨道 `length`。\n\n由于 `track` 需要先实例化，你将从创建 `track` 类的代码开始。首先，在 `track`\
  \ 类中创建一个名为 `this.state` 的新属性，如下：\n\n```javascript\napp.track = function(length){\n\
  this.state = {\n  STOPPED: 0,\n  PLAYING: 1,\n  PAUSED: 2\n};\n}\n```\n\n`state`\
  \ 属性包含可以确定应用程序当前状态的变量。执行此操作的替代方案是将当前状态存储为字符串（例如：播放、暂停或停止）。当你向应用程序中添加更多状态或更改状态名称时，这可能会产生问题。通过这样做，更改应用程序的状态只需使用\
