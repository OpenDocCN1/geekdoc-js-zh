  \ 1);\n}\n```\n\n你可能想进一步允许用户拥有多个宠物。你可以通过在 `user` 模型中创建一个数组来实现。你需要几个新方法来管理 `pets`\
  \ 数组：\n\n- `addPet` 向 `pets` 数组添加单个宠物。\n- `getPet` 根据特定索引从数组获取单个宠物。\n- `removePet`\
  \ 使用索引从数组中移除单个宠物。\n- `setPets` 使用数组设置 `pets` 数组，覆盖现有的 `pets` 数组。\n- `gets` 获取分配给用户对象的所有宠物。\n\
  \n`user` 对象的更改如下：\n\n\n\n\n\n```javascript\nusing _pets = [];\n\n_pets.length =\
  \ 0;\n\n/**\n* 与其用新数组完全替换 pets 数组，\n* 每只宠物都应该通过 addPet 方法进行相同的验证。\n* 与其重复任何验证代码，更合理的方法是使用\
  \ for 循环\n* 为每只宠物调用 addPet 方法。\n*/\nfor(var i = 0; i < pets.length; i++){\n_self.addPet(pets[i]);\n\
  }\n\n}\n\n/**\n* 获取 pets 数组\n */\nthis.getPets = function(){\nreturn _pets;\n}\n\
  }\n```\n\n从前面的代码中看到，大多数方法都是自言易懂的，`setPets` 方法除外。从 `setPets` 的代码中你可以看到，你必须先使用 `_pets.length\
  \ = 0` 清空 pets 数组。然而，虽然这比使用 `_pets = [];` 为 `_pets` 变量分配一个新空数组要慢，但它只是简单地移除数组的所有元素，而不是创建一个新的空数组。我们没有将传递给方法的\
  \ pets 数组赋值给 pets 对象中的 `_pets` 数组，而是遍历新数组中的每只宠物并调用 `addPet` 方法。此此是为了确保任何新宠物都能通过用于向用户对象添加宠物的相同代码，这些代码可能包含验证或修改每个宠物对象。为了利用新代码，你可以编写类似下面的\
  \ JavaScript 代码的代码。\n\n```javascript\nvar user = new user('Suzanne', 'password');\n\
  var pet1 = new pet('Jack', 'dog');\nvar pet2 = new pet('Snoop', 'dog');\nuser.appPet(pet1);\n\
  user.addPet(pet2);\nvar message = user.name + ' has ' + user.getPets().length +\
  \ ' pets. ' +\nuser.name + ' has';\nfor(var i = 0; i < user.getPets().length; i++){\n\
  message += ' a ' user.getPet(i).getType() + ' called ' +\nuser.getPet(i).getName();\n\
  }\nalert(message);\n```\n\n这应该输出类似于“Suzanne has 2 pets. She has a dog called Jack\
  \ a dog called Snoop”的内容。\n\n记住，你的模型仅仅是 JavaScript 对象，因此你可以添加任何方法来操作它们内部的变量或以特定方式输出内容。\n\
  \nMoMemo 内部的模型并不多。解释模型之间如何相互作用的最佳方法是通过类图。\n\n尽管 JavaScript 是一种没有类的语言，但你仍然可以使用类的类比，通过在类对象内部创建构造函数、方法和实例变量来描述对象是如何构建的。类图显示了一个类将拥有哪些方法和属性，以及它们如何与其他类相互作用。\n\
  \n**注意：** 为了使本书的内容尽可能简单，我将只介绍如何阅读基础 UML 类图，包括属性、方法和常见的关联。如果你想了解更多关于 UML 和各种图表的知识，请随时查看\
  \ [www.agilemodeling.com/essays/umlDiagrams.htm](http://www.agilemodeling.com/essays/umlDiagrams.htm)。\n\
  \n![Image 105](img/index-231_1.png)\n\n图 8-2 显示了 MoMemo 的基础类图。\n\n**图 8-2.** *类图中的类*\n\
  \n从图 8-2 可以看到，每个框顶部都显示一个名称（例如，Movie、Actor 等），这代表每个类的名称。在框名称正下方是几行带有 `-` 符号的前缀线。这些是类的属性。属性名称前的符号决定了属性应该是公共的\
  \ (+) 还是私有的 (-)。在 UML 类图中，你还可以为属性指定类型和其他属性。\n\n在属性正下方，有一条线，后面跟着一个方法名。在图 8-2 的示例中，你可以看到\
  \ `Movie` 的唯一方法是 `isFavorite`，它返回一个布尔值并判断该电影是否收藏。\n\n类旁边的黑色菱形表示 `Movie` 类与 `Actor`\
  \ 和 `Video` 类之间存在关联。黑色菱形告诉你该关联是组合的（composite），意味着 `Movie` 类拥有 `Actor` 和 `Video`，并且在该应用程序的上下文中，如果没有\
  \ `Movie`，`Actor` 和 `Video` 就无法存在。组合关联还表示，如果父类（在本例中为 `Movie`）死亡，则子类（Actor/Video）也将停止存在。始终重要的是，在类之间创建关联时，这些关联是在应用程序的上下文中创建的。其他类型的关联列在表\
  \ 8-1 中。\n\n![Image 106](img/index-232_1.png)\n![Image 107](img/index-232_2.png)\n\
  ![Image 108](img/index-232_3.png)\n\n**表 8-1.** *不同的 UML 关联类型*\n\n| 符号 | 名称 |  |\n\
  | :--- | :--- | :--- |\n| | 组合 (Composite) | 父类拥有子类，子类没有父类无法存在。如果父类被毁，子类也会被毁。这被称为“包含”（contains\
  \ a）关系。 |\n| | 聚合 (Aggregate) | 父类不拥有子类，但子类没有父类也可以存在。如果父类被毁，子类仍然存在。这被称为“拥有”（has\
  \ a）关系。 | 关联 (Association) | 这是一种松散关联，意味着实体之间没有所有权，它们可以独立存在。每个实体可以关联多个实体。 | | 多重性\
  \ (Multiplicity) | 在关联线旁边你会看到 `1` 或 `0*`。这表示类之间关联的类型。`1` 表示只有一个对象，`0*` 表示零或多个对象。在图\
  \ 8-2 的示例中，`Actor` 只有一个 `Movie`，但 `Movie` 有零或多个 `Actors`。`Movie` 有零或多个 `Videos`，但\
  \ `Video` 只能有一个 `Movie`。 |\n\n通常，UML 图还会显示属性的 getter 和 setter。使用之前的模型，你可以开始创建 MoMemo\
  \ 的模型。\n\n### 视频源模型\n\n视频源模型是 MoMemo 中所有模型中最简单的。视频源模型用于存储视频的不同格式。与其在 `Video` 模型中添加\
  \ `webm`、`mp4` 和 `ogv` 属性，不如将视频与视频源关联更为合理。\n\n想象发布了一个新的网络浏览器，支持几种新格式。如果你想支持这些格式，你需要修改\
  \ `Video` 模型，这会对你的应用程序产生不利影响。通过与视频源关联，当新格式出现时你不需要担心修改代码，因为你只需为新格式创建实例，并将它们添加到 `Video`\
  \ 模型的关联中。为了更加方便，你可以在视图中（本文将详细讨论）创建一个循环，这样你不需要修改应用程序来支持新格式。\n\n首先，在 `js/app/model/`\
  \ 文件夹中为视频源模型创建一个名为 `videosource.js` 的新 JavaScript 文件。你现在可以使用以下代码定义你的模型结构。\n\n```javascript\n\
  var app = app || {};\n\napp.model = app.model || {};\n\n/**\n* 视频内部使用的视频源\n* 实例化后你必须将此对象添加到视频\n\
  * @param {String} url\n* @param {app.type.format} format\n*/\napp.model.videosource\
  \ = function appModelVideoSource(url, format){\n\n// 你的实现在这里\n\n}\n```\n\n你可以看到，模型的声明方式与\
  \ pets 模型相似，只是你对所有模型都使用了 `app.model` 命名空间。\n\n\n\n\n\n构造函数接收视频的 URL，以及一种可以是 `webm`、`ogv`、`mp4`\
  \ 等格式。\n\n接下来要做的工作是声明实例变量。回顾一下，实例变量是只存在于对象实例范围内的变量。在实例外部，无法访问或修改实例变量，除非为该实例变量创建了\
  \ getter（get 器）或 setter（Setter）。\n\n...\n\n```javascript\napp.model.videosource\
  \ = function appModelVideoSource(url, format){\n  /**\n  * 视频源的实例变量\n  */\n  var\
  \ _url,\n  _format,\n  _self = this;\n}\n```\n\n第 8 章：JavaScript：模型、视图与控制器\n\n233\n\
  \n如你所见，只有两个实例变量对应构造函数的参数。实例变量以下划线（`_`）开头，这样它们就不会与通过构造函数传递变量冲突。你还使用 `_self = this`\
  \ 对实例进行引用，因为 `this` 关键字引用的是特权方法而不是对象。\n\n接下来要做的工作是创建一个实例化方法，该方法会在模型的末尾被调用。代码如下：\n\
  \n```javascript\napp.model.videosource = function appModelVideoSource(url, format){\n\
  \  ...\n  /**\n  * 使用构造函数的参数设置实例变量\n  */\n  this.init = function(){\n    this.setUrl(url);\n\
  \    this.setFormat(format);\n  }\n  // 插入 getters 和 setters\n  this.init();\n}\n\
  ```\n\n如你所见，`init` 方法简单地调用了通过构造函数传递的属性的 setter。\n\n**注意：** 通过构造函数传递的变量位于构造函数以及包含在其中的的特权方法的范围内。这意味着构造参数可以在特权方法中使用并修改。当你在特权方法中创建新变量时，使用\
  \ `var` 声明它们是非常重要的，以防止特权方法修改构造函数参数。\n\n这防止了代码重复，因为当你从对象外部修改实例变量时，你可能会执行其他操作，例如错误检查或根据条件更改值。\n\
  \n你可能在想，为什么不直接像上一个代码示例那样，在 JavaScript 对象顶部不使用 `init` 方法包裹，而是直接调用 setter 呢？简单的答案是\
  \ setter 尚未声明，因此调用这些方法将产生 JavaScript 错误。\n\n当你在 JavaScript 中声明一个普通的命名函数时，解释器会在调用它时查找该函数，无论它位于脚本的哪个位置。\n\
  \n然而，当你函数赋值给变量时，你必须等到该赋值发生后才能调用该函数。\n\n为了解决这个问题，你要么将所有的初始化代码放在对象的末尾，要么将其封装在顶部的方法中并从底部调用它。我选择了后者，因为\
  \ getter 和 setter 往往会产生大量的“白噪音”，而为了找到主代码而滚动浏览大量感觉无意义的代码是有点让人心烦的。你可以看到，在上一个示例中，`init`\
  \ 方法是在对象的末尾被调用的。\n\n接下来要做的工作是创建 getter 和 setter。这是一个非常简单的任务。回顾一下，getter 返回实例变量，而\
  \ setter 则像对象外部的任何东西为实例变量赋值。getter 和 setter 无法从对象内部修改实例变量。getter 和 setter 所示：\n\n\
