  \n![Image 16](img/index-13_2.jpg)\n\n# 第 1 章：入门\n\n8\n\n**图 1-4.** *Aptana 中新的 Android\
  \ 菜单*\n\n进入 `Android SDK Manager`。你将看到一个需要下载的 `SDKs` 列表，如图 1-5 所示。确保勾选了以下选项：\n-\
  \ Google APIs by Google Inc.\n- SDK Platform by Samsung Electronics\n\n**图 1-5.**\
  \ *Android SDK Manager*\n\n![Image 17](img/index-14_1.jpg)\n\n# 第 1 章：入门\n\n9\n\n\
  现在 `ADT` 已安装，你可以安装所有的 `SDKs` 来测试你的 Android Web 应用程序。`Android ADT` 可以在 `Window` 菜单底部找到，如图\
  \ 1-4 所示。\n\n\n\n在这里，你将了解到受众如何影响你设计和布局移动端网站，如何确定内容的优先级，以及为你的目标受众提供最佳功能。\n\n## Web\
  \ 应用与原生应用\n如果你在决定开发纯原生应用、混合应用还是纯 Web 应用之间犹豫不决，那么本节将将带你了解每种解决方案的优缺点。\n\n## 第一行代码：Hello\
  \ World\n最后这一节将带你介绍应用程序的构建模块，例如设置用于自动部署的 `ANT`，构建并压缩 `SASS/CSS` 文件以及 `JavaScript`。\n\
  \n## 移动 Web 有何不同？\n为 3.654 亿永久在线用户的潜在受众提供服务，使得移动 Web 成为最令人兴奋的开发平台之一。\n\n为桌面环境创建\
  \ Web 应用程序可能是很有趣。然而，用户受限于单一指向设备和键盘与你的工作进行交互。移动 Web 带来了一个全新的可能世界。移动设备是交互式元素的空白画布，用户只需通过触摸即可进行交互。作为开发者，你可以通过接管整个屏幕并让他们沉浸在你的移动\
  \ Web 应用的世界中，从而与用户创造出更加亲密的体验。\n\n遗憾的是，尽管移动 Web 带来了许多现实世界的优势，但在平台不断发展的过程中，你将面临与桌面环境中相同的开发和用户体验障碍。\n\
  \n## 对象/特性检测\n移动 Web 上开发者可用的 API 碎片化问题可能会成为一个问题。修复跨浏览器 API 差异的最常用解决方案是使用 `JavaScript`\
  \ 检测浏览器或设备，并根据所使用的浏览器提供不同的样式表或执行特定的 `JavaScript` 代码。这种方法被称为用户代理（UA）嗅探或浏览器嗅探。列出的列表\
  \ 2-1 显示了一个常见的 UA 嗅探脚本。\n\n**列表 2-1.** 用于 UA 嗅探的 JavaScript 代码\n\n```javascript\n\
  // 获取用户代理字符串\nvar browser = navigator.userAgent;\n// 检查字符串中是否包含 Firefox\nif(browser.match(/Firefox/)\
  \ === null){\n  // 如果不是 Firefox，将用户重定向到另一个页面\n  window.location.href = \"sendstandardmessage.html\"\
  ;\n} else {\n  // 如果是，使用 Mozilla SMS API 发送短信\n  navigator.mozSms.send(\"01234567891\"\
  , \"My Message\");\n}\n```\n\nUA 嗅探可能会有什么问题？虽然你会为 Firefox 提供支持并为其他浏览器提供回退方案，但你无法支持可能具有\
  \ Firefox 相同 API 的浏览器。此特定 API 仅在 Firefox `11+` 中可用，因此你还需要确保 UA 嗅探脚本包含该版本。\n\n当你开始增加浏览器检测脚本的粒度时，你也降低了可维护性并增加了复杂性，因为必须不断更新嗅探代码以适应新的浏览器和版本。不知不觉，你的\
  \ `JavaScript` 库就变成了不可维护的条条代码。\n\n实现此点的更好方法是通过通过对象检测。改进后的代码见列表 2-2。首先，我们检查 `SMS\
  \ API` 是否存在。如果不存在，我们将用户引导到另一个页面；如果存在，我们就可以发送短信。\n\n**列表 2-2.** 用于对象检测的 JavaScript\
  \ 代码\n\n```javascript\n// 检查 navigator.mozSms 是否为对象（如果存在）\nif (typeof navigator.mozSms\
  \ === \"object\"){\n  // 如果存在，使用内置 SMS API 发送消息\n  navigator.mozSms.send(\"01234567891\"\
  , \"My Message\");\n} else {\n  // 如果不存在，将用户引导到另一个位置\n  window.location.href = \"\
  sendstandardmessage.html\";\n}\n```\n\n对象检测方法还允许我们为特定的浏览器 API 提供回退方案。Firefox `11`\
  \ 夜间版目前仅支持 `SMS API`，但未来可能有其他浏览器和其他设备通过不同的方法或类支持相同的实现。\n\n我们可以使用 `class` 将此转换为应用程序的一个特性。如列表\
  \ 2-3 所示，我们可以在方法内部委托消息的发送工作。在理论上，这应该允许我们使用自己的 API 在应用程序中发送消息。当浏览器厂商向其浏览器添加 `SMS\
  \ API` 时，我们只需要在一个位置添加该方法，而不需要在整个应用程序中进行查找和替换。\n\n**列表 2-3.** 使用委托通过我们自己的 Web 服务作为回退发送消息\n\
  \n```javascript\nvar Message = function Message(message, recipient){\n  this.message\
  \ = message;\n  this.recipient = recipient;\n  this.sendSMS = function sendSMS(recipient){\n\
  \    if(typeof navigator.mozSms === \"object\"){\n      // 使用用户的手机发送短信\n      navigator.mozSms.send(this.recipient,\
  \ this.message);\n    } else if (typeof navigator.otherSms === \"object\") {\n \
  \     // 使用另一个浏览器的 SMS 实现\n      navigator.otherSms.sendMessage(this.message, this.recipient);\n\
  \    } else {\n      // 如果无法通过用户的手机发送，\n      // 使用第三方 Web 服务发送消息\n      this.ajaxSend(this.recipient,\
  \ this.message);\n    }\n  }\n\n  function ajaxSend(recipient, message){\n    //\
  \ 通过 Ajax 使用基于 Web 的网关发送短信\n  }\n}\n\nvar messageInst = new Message(\"message!\"\
  , \"01234567891\");\nmessageInst.sendSMS();\n```\n\n从列表 2-3 可以看到，无论浏览能力如何，我们都可以使用对象检测来确保用户无论设备如何都能获得相同或相似的体验。使用\
  \ `JavaScript` 检测这些特殊特性很容易。但测试 CSS3 或 HTML5 特性并提供向后兼容性呢？名为 `Modernizr` 的 JavaScript\
  \ 库可以帮助实现这一点。它使用相同的对象检测方法来检测用户的 HTML/CSS/JavaScript 能力。它通过向 `HTML` 标签添加类来修改 `DOM`，从而为你的\
  \ CSS 和 JavaScript 特性检测提供钩子。图 2-1 显示了其在 haz.io 应用。将在第七章详细介绍。\n\n## 屏幕尺寸与像素密度\n在开发移动\
  \ Web 应用时，你可能希望创建一个在平板设备和移动设备上具有相同功能的应用程序，但呈现不同的视图或布局以利用额外的空间或方向。媒体查询可以帮助实现这一点。通过结合媒体查询和弹性设计，你可以产生响应于用户显示的视图，而不是检测用户的设备类型并为其提供视图。这被称为响应式\
  \ Web 设计。\n\n这种开发方法比根据用户使用的设备类型决定他们如何查看你的网站要优雅得多。相反，你关注的是可用的空间和像素密度。\n\n像素密度概念允许物理尺寸相同的移动设备根据每英寸像素数量的不同而具有不同的分辨率。Android\
  \ 设备分为三种像素密度类别：\n\n- 低\n- 中\n- 高\n\n这对你的移动 Web 应用有什么影响？当你制作图像时\n\n\n\n\n对于普通网站，你会生成单张图像，它不会缩放且无法适用于所有屏幕类型，因为布局会随图像本身缩放以适应固定宽度或弹性布局。\n\
  \n对于移动端网页，你通常会创建一个移动应用程序来适应整个视口，并且无论设备的像素密度如何，其尺寸都将保持相同。\n\n例如，如果你为低像素密度屏幕制作了一个宽度为\
  \ 500 px 的图像，它在高密度屏幕上显示将会更小。这是因为 500 px 在高密度屏幕上占据的空间没有在低密度屏幕上那么大。\n\n移动浏览器解决此问题的方案是根据目标密度来放大或缩小图像。例如，如果你为中等密度屏幕开发应用程序，浏览器将在低密度屏幕上缩小图像，并在高密度屏幕上放大图像。这会导致在向任一方向缩放时产生开销，并且在放大图像时会出现像素化，缩小图像时可能会出现失真。\n\
  \n为了解决这个问题，我们既可以专门为高密度屏幕创建应用程序，又允许移动端缩小图像。这在 CPU/GPU 消耗网络活动方面可能是非常昂贵的。这两个因素都会影响渲染时间，并可能因为下载不必要的资源而影响用户的钱包。或者，我们可以使用媒体查询来确保为正确的显示类型传递正确的内容。为了做到这一点，你必须将视口元标签的\
  \ `target-densitydpi` 属性设置为 `device-dpi`，并使用媒体查询导入特定像素密度的样式表，如列表 2-4 所示。\n\n# 第\
  \ 2 章：Android 移动 Web 应用简介\n\n## 列表 2-4. *使用媒体查询进行特定像素密度样式设置*\n\n```html\n// 设置视口以匹配设备的像素密度和宽度\n\
  <meta name=\"viewport\" content=\"target-densitydpi=device-dpi, width=device-width\"\
  \ />\n\n// 引入主样式表\n<link rel=\"stylesheet\" media=\"screen\" href=\"mobile.css\"\
  \ />\n\n// 引入高、中、低密度样式表以提供特定像素密度图像\n<link rel=\"stylesheet\" media=\"screen and\
  \ (-webkit-device-pixel-ratio: 1.5)\" href=\"hdpi.css\" />\n<link rel=\"stylesheet\"\
  \ media=\"screen and (-webkit-device-pixel-ratio: 1.0)\" href=\"mdpi.css\" />\n\
  <link rel=\"stylesheet\" media=\"screen and (-webkit-device-pixel-ratio: 0.75)\"\
  \ href=\"ldpi.css\" />\n```\n\n如列表 2-4 所示，每种显示类型的像素比例如下：\n* 低密度：0.75\n* 中密度：1.0\n\
  * 高密度：1.5\n\n我们使用通用的移动端样式表，以便在设备不匹配任何像素比例时提供回退图像（fallback images）。然后，我们使用每个像素密度类别的样式表来覆盖图像。\n\
  \n像素密度可能是一个棘手的问题，这意味着对于你在应用程序中使用的每张图像，你必须额外制作两个不同尺寸的图像。这也意味着，即使你为今天最高的像素密度创建了图形，明天你可能也要为另一个具有更高密度的显示器重新导出所有内容。在选择图形包创建你的移动\
  \ Web 设计时，务必记住这一点。\n\n## 迎合你的受众\n\n记住你在为谁编写应用程序与与他们将用什么与你的工作进行交互同样重要。第一步是确保你理解用户将用你的应用程序做什么。为了做到这一点，你必须对其进行分类。\n\
  \n对你的应用程序进行分类将帮助你根据同类别内其他应用程序的设计以及它们的功能来制定通用的交互规则。这听起来可能像抄袭，但它将帮助用户根据之前的经验快速、直观地发现如何使用你的应用程序，从而以最短的时间让其运行起来。\n\
  \n记住，你可以在这些规则的基础上进行构建，而不必受限于这些规则。只要你能让用户打开你的移动 Web 应用程序，玩几分钟，并立即说“我懂了”，你就完成了你的工作。\n\
  \n移动 Web 应用程序有很多种分类，但大多数属于以下几类：\n* 任务驱动型\n* 社交型\n* 娱乐型\n\n### 任务驱动型\n\n任务驱动型应用程序在本质上非常简单。它们被设计为用于日常使用的省时工具。这可以是从查找火车时刻到查找最近的酒吧或咖啡馆任何内容。\n\
  \n有时，我会站在伦敦沃特卢火车站中心，盯着火车时刻表，看起来迷茫且困惑，然后掏出手机启动“火车时刻表”App 以更快地找到车次。\n\n要记住的一点是，如果用户无法通过你的应用程序在最短时间内完成任务，他们就会关闭你的浏览器窗口，并寻找另一个可以更快完成相同任务的窗口。\n\
  \n对于任务驱动型应用程序，有两个基本信息可以帮助用户更快地完成任务：\n* 用户在哪里？\n* 他们正在使用什么设备？\n\n这两个关键信息对于你的应用程序来说是很容易获取的，了解它们将产生巨大差异。发现用户的物理位置以及他们在做什么，将帮助你预判他们访问你的移动\
  \ Web 应用程序时将要做。\n\n例如，如果你正在创建一个行程规划器，有几点关于用户的特征你应该考虑：\n* 用户在哪里？他们的连接是否受限（例如 3G 或）。\n\
  * 用户是否正在移动中？他们是否有时间用拇指输入数据来填写表单？\n\n这些因素不仅影响你如何展示交互元素（如输入表单），还影响你如何编写代码以减少用户完成任务所付出的努力。\n\
  \n#### 图 2-2. *TFL 移动网站用户路径*\n\n在图 2-2 中你可以 TFL 行程规划器的移动网站。上面的用户路径描述了一个最坏的情况。该用户正在移动中，容易产生数据输入错误。结果是用户必须通过两次页面加载并填写更多表单才能完成任务。增加两个额外的页面来帮助用户进行验证又有什么问题呢？两个额外的页面意味着在\
  \ 3G 网络下将产生 4 秒以上的加载时间。你还必须考虑到用户处理页面并做出响应的时间。\n\n#### 我们如何改进 TFL 移动网站？\n* 增加反馈循环。当用户输入出发地/目的地时，通过自动补全为他们提供建议。他们可以选择适合自己的建议来预填充行程规划器的表单字段。\n\
  * 我们可以使用用户的当前位置作为行程起点或终点的建议。\n* 如果我们使用本地存储，还可以向用户建议最近的目的地列表。例如，如果我们知道他们刚刚规划了去某地的行程，那么当他们再次打开移动\
  \ Web 应用程序时，很有可能想知道如何回去。\n\n#### 图 2-3. *BUSit 移动网站用户路径*\n\n\n\n\n图 2-3 展示了 `busitlondon.co.uk`\
  \ 的一个良好示例。首次启动移动 Web 应用时，它将尝试为您查找当前的当前位置。\n\n当用户输入起点和终点位置时，它将使用 `Google Maps API`\
  \ 和自动完成功能为用户提供可供选择的。你始终拥有选择用户当前位置的选项。\n\n在你规划好目的地后，它将向你推荐路线。所有这些信息都包含单个页面中，无需刷新页面。用户可以轻松更改或修改视图，而无需等待图形（地图瓦片除外）加载。这提供了更接近“原生应用程序”的外观和感受。\n\
  \n# 第 2 章：为 Android 创建移动 Web 应用简介 (26 页)\n\n## 社交\n\n社交应用的首要目标是促进与朋友或其他感兴趣的人建立联系和通信的能力。用户在社交移动\
  \ Web 应用上花费的时间通常远高于使用工具类应用的时间。\n\n社交媒体应用的主要目标通常有三点：\n\n- 用户访问是为了消费内容。\n- 用户访问是为了贡献内容。\n\
  - 用户访问是为了参与。\n\n这三条基本规则支撑了当今存在的几乎每一个社交移动应用。如果用户不贡献内容，就没有任何内容供其他用户消费和参与。\n\n仅仅因为用户在社交移动\
  \ Web 应用上花费的时间更多，并不意味着完成任务（如分享内容）的路径应该与任务型应用有任何不同。应该考虑到用户的情况。它应该既易于分享内容，又易于消费内容。\n\
  \n例如，`Twitter` 和 `Facebook` 在功能集方面是相径径的，但这两个应用在移动 Web 上的主要目标都是让用户轻松地消费、贡献和参与。\n\n\
  图 2-4 显示了 Facebook 触摸移动 Web 网站的三个屏幕（左侧）。登录后，你会看到 `Facebook` 消息送，因此你可以立即消费内容。你还会看到三个清晰且不同的按钮，用于分享内容，例如你的状态、照片和当前位置（签到）。你顶端还有一个工具栏，以模态菜单或弹出窗口的形式为你提供与你特别相关的的内容和更新（`好友请求`、`消息`和`通知`）。进一步的功能位于隐藏菜单中，这为添加更多次要功能和操作留了空间，而不会让应用程序的其他部分变得拥挤。\n\
  \n![Image 22](img/index-31_1.jpg)\n\n# 第 2 章：为 Android 创建移动 Web 应用简介 (27 页)\n\n\
  **图 2-4.** *Facebook 触摸和 Twitter 移动 Web 网站让分享和消费内容变得简单。*\n\n`Twitter` 的核心功能可以在顶部工具栏找到。一个清晰的内容分享按钮用蓝色突出显示，并带有独特的图标。登录后，如果用户用过\
  \ `Twitter` 网站，他们就知道这是一个分享内容的按钮。这种设计模式现在贯穿于 `Twitter` 的桌面端、移动和 Web 版本。\n\n## 娱乐\n\
  \n娱乐类应用的创建主要是为了满足克服某种形式无聊的需求。解决这一问题有多种形式，从显而易见的游戏到提供音乐和视频内容。娱乐应用通常设计为让用户沉浸在应用程序环境中。即使是今天移动\
  \ Web 上最基础的 `HTML5` 游戏也可以实现这一点。\n\n## Web 应用 vs 原生应用\n\n过去几年中引起巨大争论和讨论的原因之一是将项目构建为原生应用还是移动\
  \ Web 应用。两者都有优缺点。然而，重要的是，你选择的方案应该根据你特定项目的需求以及你作为开发人员的能力来选择。最重要的是，选择能最快完成你项目的方案！\n\
  \n有几个因素可以帮助你决定创建移动 Web 应用还是原生应用：\n\n- 你是否已经知道如何为目标平台开发\n- 你的应用程序是否依赖网络连接或存储在线的某些动态数据\n\
  - 你的应用程序依赖什么类型的设备功能（例如 `GPS`、`加速度计`、`陀螺仪`、`通讯录`、`日历`、密集 `CPU/GPU` 操作）\n- 你的项目现在或将来是否有将功能移植到其他平台的空间（例如\
  \ `iOS`、`Blackberry`、`Windows Phone`、桌面）\n- 你发布应用程序的频率，以及你如何处理用户不在设备上更新你的应用程序\n\
  - 时间和预算\n\n如果你已经如何使用 Web 标准开发，移动 Web 应用可能是最佳解决方案。但如果你已经可以为目标平台进行开发，那么制作原生应用可能会更有优势。然而，这会略微关闭制作可在其他平台上运行的应用的大门，除非你使用如\
  \ `Marmalade` 等跨平台应用框架，否则同一个应用需要为所有平台重新创建。\n\n创建移动 Web 应用可以在转换为原生之前，在所有平台上测试或原型化你的应用程序的一种成本效益方法。通过分析，你可以看到应该针对哪些平台使用原生应用。通过用户研究，你可以看到创建一个具有平台特定功能的原生应用是否对你的用户有利。\n\
  \n如果你的应用程序依赖无法通过 Web 浏览器访问的 `APIs`，例如`通讯录`、`日历`、`陀螺仪`或`加速度计`，那么移动 Web 应用可能是不可考虑的，因为这些\
  \ `APIs` 目前无法通过大多数移动 Web 浏览器。\n\n如果你的应用程序依赖动态数据，使用 Web 标准开发应用程序可能是一个明智的选择，因为你可以使用\
  \ `Ajax` 通过网络向应用程序快速交付内容。你还可以在移动 Web 应用中缓存和存储文件，以便应用程序在没有网络时仍。\n\n如果你频繁为移动应用程序提供更新，可能会遇到用户不按要求更新到最新版本的问题。通过创建移动\
  \ Web 应用，只需将更新推送到 Web 服务器，所有用户将立即获得应用程序的最新版本。\n\n![Image 23](img/index-33_1.jpg)\n\
  \n# 第 2 章：为 Android 创建移动 Web 应用简介 (29 页)\n\n在图 2-5 中，你可以看到 `Twitter` 原生应用（左）和移动\
  \ Web 应用（右）如何展示了社交应用作为原生应用和移动 Web 应用的区别。正如你所看到的，并没有真正的区别。移动 Web 应用丢弃的主要功能是使用第三方原生应用分享内容。`Twitter`\
  \ 也删除了移动 Web 应用上分享照片的功能。\n\n`对象/功能检测`可以提供在特定设备上传照片的能力。\n\n**图 2-5.** *Twitter 原生应用（左）和\
  \ Twitter 移动 Web 应用（右）* 本节目前收集的信息应该帮助你决定是原生还是移动 Web。\n\n然而，还有第三种选择。多种手机 Web 应用程序框架（如\
  \ `PhoneGap`、`Appcelerator` 和 `Rhomobile`）允许你使用 `XHTML/JavaScript` 和 `CSS` 构建应用程序，但利用可能仅适用于原生\
  \ Web 应用的 `APIs`。\n\n\n\n\n这些框架为你提供了一个视图，让你可以在其中开发应用，并通过使用 JavaScript 作为两者之间的桥梁，提供指向移动端\
  \ API 的代理。图 2-6 显示了多种手机 Web 应用程序框架的结构。\n\n![Image 24](img/index-34_1.jpg)\n\n# 第\
  \ 2 章：为 Android 创建移动 Web 应用简介\n\n**图 2-6.** 多种手机 Web 应用程序框架的结构\n\n我们知道在某个时刻，移动 Web\
  \ 浏览器将提供与第三方应用程序交互，并利用移动设备的硬件（如 CPU/GPU 和摄像头）。因此，继续为浏览器开发是有意义的。然而，手机 Web 应用程序框架有助于将原生应用程序可用的\
  \ API 和服务引入 Web 应用程序。\n\n通过这种方式构建应用程序，你可以实现一次编写并部署一个功能有限的移动 Web 应用。然后，你可以在手机 Web\
  \ 应用程序框架内通过对象/功能检测，将该应用作为原生应用进行渐进增强。这让你兼得两者的优势。\n\n## 第一行代码：Hello World\n\n现在该是你写下第一行代码了。在这个\
  \ Hello World 应用中，你只需创建一个包含“Hello World!”的 HTML 网页，并将其显示在 Android 虚拟设备上。\n\n###\
  \ 设置\n\n首先打开 Aptana Studio。你需要创建一个新项目，因此转到 `File`  `New`  `Web Project`。\n\n你将看到一个与图\
  \ 2-7 类似的屏幕。输入项目名称并点击 Finish。我选择了 Chapter-2 作为我的项目名。\n\n![Image 25](img/index-35_1.jpg)\n\
  \n**图 2-7.** Aptana 的 New Web Project 向导\n\n这将在 Aptana 中创建一个新的空项目。新项目将出现在左侧的 App\
  \ Explorer 面板中。\n\n### HTML\n\n为移动 Web 编写代码与为桌面 Web 编写代码相似。我们将从创建一个基础的 HTML5 文档开始。\n\
  \n以与创建文件夹相同的方式创建一个新文件，只需选择 `File` 而不是 `Folder`。将文件命名为 `index.html`。确保该文件存在于项目的根目录下非常重要。以下代码将构成我们\
  \ HTML 文件的基础。\n\n**列表 2-5.** Hello World! 的 HTML 源代码\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en-GB\" dir=\"ltr\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"\
  viewport\" content=\"width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;\
  \ target-densitydpi=device-dpi;\"/>\n<title>My First Mobile Web App</title>\n</head>\n\
  <body>\n<h1>Hello World!</h1>\n</body>\n</html>\n```\n\n如果你不熟悉列表 2-5 所示的某些 `HTML`\
  \ 元素，第一行是新的 HTML5 文档类型声明（doctype）。在 HTML5 中，你不需要指定 DTD，DTD 通常可以在 XHTML 1.1 页面中找到。列表\
  \ 2-6 显示了 XHTML 1.1 文档类型声明与 HTML5 文档类型声明之间的区别。\n\n**列表 2-6.** XHTML 1.1 文档类型声明与\
  \ HTML5 文档类型声明的区别\n\n```html\n<!-- HTML4 Doctype Decleration -->\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n\n<!-- HTML5 Doctype Decleration -->\n<!DOCTYPE html>\n```\n\n如你所见，现在不需要 Google\
  \ 或记忆 DTD 路径的位置，也不需要指定 HTML 版本。\n\n在 `html` 标签中，我添加了两个属性：`<html lang=\"en-GB\" dir=\"\
  ltr\">`。`lang` 将指定文档内使用的语言，`dir` 规定阅读方向。`dir` 已设置为 `ltr`（从左到右），`lang` 已设置为 `en-GB`（英语\
  \ - 英国）。\n\n进入 `head` 元素，有两个 `meta` 标签，如列表 2-7 所示。\n\n**列表 2-7.** 源代码中的 Meta \n\n\
  ```html\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width;\
  \ initial-scale=1.0; maximum-scale=1.0; user-scalable=no; target-densitydpi=device-dpi;\"\
  />\n```\n\n第一个 `meta` 标签指定了文档内使用的字符集。这通常应该是 `UTF-8`，它将涵盖大多数语言字符。\n\n第二个 `meta` 标签专门用于控制移动网站上的布局或视口（viewport）。通过这个\
  \ `meta` 标签，我们可以使用 `width` 属性将页面宽度设置为视口（浏览器屏幕的可视区域）相同、更小或更大。\n\n还可以使用 `initial-scale`\
  \ 和 `maximum-scale` 属性来控制用户对你的 Web 应用进行缩放程度。`user-scalable` 属性是一个标志，用于启用或禁用用户通过捏合或点击来对你的\
  \ Web 应用进行放大或缩小。最后，`target-densitydpi` 属性用于根据像素密度规定网页如何扩展。\n\n**列表 2-8.** 完整的视口定义\n\
  \n```html\n<meta name=\"viewport\" content=\"width=device-width; initial-scale=1.0;\
  \ maximum-scale=1.0; user-scalable=no; target-densitydpi=device-dpi;\"/>\n```\n\n\
  ![Image 26](img/index-38_1.jpg)\n\n**列表 2-9.** title 标签\n\n```html\n<title>My First\
  \ Mobile Web App</title>\n```\n\n**列表 2-10.** body 和 h1 标签\n\n```html\n<body>\n\
  <h1>Hello World!</h1>\n</body>\n```\n\n## 测试\n\n在继续之前，你应该使用 Aptana 中的 Android SDK\
