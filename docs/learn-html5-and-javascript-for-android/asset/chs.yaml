  \ 65](img/index-120_1.jpg)\n\n这结束了 MoMemo 的标记创建。任务栏对应用程序的响应将在第 8 章介绍。如果你看到与图 4-13\
  \ 所示类似的内容，请不要惊讶。你将在第 5 章中学习如何使用 SASS 生成模块化的 CSS。\n\n## 总结\n\n通过本章，你应该已经了如何在移动 Web\
  \ 应用中管理分页，以及根据项目需求选择合适的分页策略。你应该还理解如何开始构建应用程序——从想法到需求，从信息架构/线框到编写 HTML 基础代码，以及设备的方向和屏幕尺寸如何影响你对应用程序的设计。\n\
  \n\n\n\n在第 5 章中，你将接下来学习 CSS 如何改变你对移动 Web 应用的样式、动画处理和性能优化，以及 SASS 如何帮助组织你的 CSS 规则并生成结构化的\
  \ CSS 文件。\n\n# 第 5 章：用于移动端的 CSS3\n\n移动开发最令人兴奋的方面之一是通过最新智能手机浏览器对 CSS3 的支持。在 CSS3\
  \ 之前，我们依赖使用 JavaScript 来提供惊艳的动画和过渡效果，仅仅将样式应用于 DOM 元素，例如父元素内的最后一个元素或交替的表格行。\n\n在本章中，你将学习一些新的\
  \ CSS3 特性，例如动画和过渡。你将学习 CSS3 如何提供与最基础的动画概念——关键帧（keyframing）类似的功能。你将学习如何在移动 Web 应用中导入新字体，这将为你的观众提供更广泛的字体。你还将查看一些关键的\
  \ CSS3 特性，如文本阴影、选择器、渐变和新的边框属性。此外，你将简要接触 CSS 媒体查询，这将帮助你根据屏幕分辨率和像素密度应用样式。\n\n最后，你将看到\
  \ CSS 预编译器的威力，其形式为 Syntactically Awesome Stylesheets (SASS)，通过它将学习如何简化你的 CSS 工作流并减少编码时间。\n\
  \n## 厂商特定属性\n\n在编写本文时，许多 CSS3 属性（如 `border-radius` 和 `opacity`）已经标准化。然而，浏览器厂商可以开发新\
  \ CSS 属性的自己的实现。为了避免语法差异引起的冲突，尚未标准化的新 CSS 属性通常会有一个厂商前缀（vendor prefix）。例如，在 `border-radius`\
  \ 标准化之前，在 CSS3 中有几种声明方式：\n\n- `-moz-border-radius`\n- `-o-border-radius`\n- `-webkit-border-radius`\n\
  - `border-radius`\n\n如你所见，列表中的最后一个声明是现在的标准版本，而厂商特定的实现带有前缀：基于 Gecko 的浏览器（Firefox）使用\
  \ `-moz-`，Opera 使用 `-o-`，基于 Webkit 的浏览器（Chrome、Android 浏览器、Dolphin）使用 `-webkit-`。\n\
  \n虽然有更多特定的厂商特定前缀，但通常对于 Android 来说，`-moz-`、`-o-` 和 `-webkit-` 就足够了。始终包含标准实现是非常重要的。当你需要声明所有四个\
  \ CSS 属性时，有方法可以避免这样做，我将在本章稍后的“CSS 预编译器 (SASS)”章节中解释。\n\n## CSS 动画与过渡\n\nCSS3 为 DOM\
  \ 元素引入了 CSS 过渡（transitions）和变换（transforms）。你可以使用这些来取代传统的通过 JavaScript 中的定时器操纵其 CSS\
  \ 属性来为 DOM 元素制作动画的方法。你可能会问自己，为什么要用 CSS 做动画而不是 JavaScript？显然，CSS 应该用于样式，而 JavaScript\
  \ 应该用于交互。事实是，通过使用 CSS3 进行动画，你可以将许多通常通过 JavaScript 交给设备 CPU 的重负载任务转移到设备的 GPU（如果设备的话）。这可以让动画变得更加流畅。\n\
  \n### 过渡 (Transitions)\n\nCSS 过渡允许你在两种 CSS 样式之间创建过渡。你通过创建一个 CSS 样式并为其添加另一个样式来触发过渡。CSS\
  \ 过渡将处理两个状态之间的变化。\n\n在 CSS3 中创建过渡非常简单。首先，你创建一个 `div` 元素。\n\n```html\n<div class=\"\
  test\"></div\n```\n\n![Image 66](img/index-124_1.jpg)\n\n接下来，为 CSS 元素创建一个样式。在此样式中，你将\
  \ `width` 和 `height` 设置为 `100px`，并将 `position` 设置为 `absolute`，因为你要把元素移动到页面上的不同位置。你还可以通过将\
  \ `border-radius` 设置为 `50px` 将正方形变为圆形。你还显式地将 `top` 和 `left` 位置设置为 `0px`，并将 `background-color`\
  \ 设置为 `blue`。\n\n```css\n.test {\nwidth: 100px;\nheight: 100px;\nposition: absolute;\n\
  top: 0px;\nleft: 0px;\nborder-radius: 50px;\nbackground-color: blue;\n}\n```\n\n\
  这将渲染出类似于图 5-1 所示的内容。\n\n**图 5-1.** CSS 圆形的渲染\n\n现在你需要为小球设置下一个状态。这与创建一个具有不同属性的新样式一样简单。\n\
  \n```css\n.second-position {\nleft: 50%;\nbackground-color: yellow;\n}\n```\n\n\
  如你所见，新属性将圆形置在屏幕中间，且 `background-color` 设置为 `yellow`。将此 CSS 类添加到测试 `div` 中。\n\n![Image\
  \ 67](img/index-125_1.jpg)\n\n```html\n<div class=\"test second-position\"></div>\n\
  ```\n\n现在你将看到一个类似于图 5-2 所示的屏幕。\n\n**图 5-2.** 测试 div 的最终位置\n\n最后要做的工作是在 `.test` 类中添加过渡。这将决定如何以及哪些属性应该进行过渡，以及过渡的时间间隔。\n\
  \n`transition` 属性目前是厂商特定的，一如往常，包含所有厂商属性是一个良好的做法。以下代码将为测试元素的所有属性创建一个过渡。\n\n```css\n\
  .test {\nwidth: 100px;\nheight: 100px;\nposition: absolute;\ntop: 0px;\nleft: 0px;\n\
  border-radius: 50px;\nbackground-color: blue;\n}\n```\n（注：此处原文代码块似乎遗漏了 transition\
  \ 属性内容，根据下文推断应包含 transition 声明，此处按原文处理）\n\n为了让过渡生效，你需要动态添加 `second-position` 类。你可以使用\
  \ JavaScript。以下脚本将查找类名为 `test` 的元素并添加 `second-position` 类。\n\n```html\n<div class=\"\
  test\"></div>\n<script>\ndocument.getElementsByClassName('test')[0].classList.add('second-position');\n\
  </script>\n```\n\n当你在移动设备上加载时，圆形应该动画到屏幕中心并逐渐变为黄色。你还可以通过指定属性、持续时间和函数和延迟来控制哪些属性应该过渡，如下例所示：\n\
  \n`-moz-|-o-|-webkit-transition: property duration function delay`\n\n你可以使用这种简写方法指定尽可能多的的属性。表\
  \ 5-1 列出了可能的值。\n\n**表 5-1.** CSS 过渡属性\n\n| 属性 | 描述 | 值/选项 |\n| :--- | :--- | :---\
  \ |\n| `-moz-|-o-|-webkit-transition-property` | 要制作动画的 CSS 属性 | all, width, height,\
  \ opacity 等 |\n| `-moz-|-o-|-webkit-transition-duration` | 过渡的持续时间 | *X s 秒；默认为\
  \ 0 |\n| `-moz-|-o-|-webkit-transition-timing-function` | 使用的时间函数 | linear, ease,\
  \ ease-in, ease-out, ease-in-out, cubic-function bezier |\n| `-moz-|-o-|-webkit-transition-delay`\
  \ | 延迟过渡的秒数 | *X s |\n\n例如，你可能在颜色过渡开始五秒后开始过渡左位置，并平滑淡出。在这种情况下，你将使用以下代码。\n\n```css\n\
  .test {\nwidth: 100px;\nheight: 100px;\nposition: absolute;\ntop: 0px;\nleft: 0px;\n\
  border-radius: 50px;\nbackground-color: blue;\ntransition: left 5s ease-out 5s,\
  \ background-color 5s ease 0s;\n-moz-transition: left 5s ease-out 5s, background-color\
  \ 5s ease 0s;\n-webkit-transition: left 5s ease-out 5s, background-color 5s ease\
  \ 0s;\n-o-transition: left 5s ease-out 5s, background-color 5s ease 0s;\n}\n```\n\
  \n![Image 68](img/index-127_1.png)\n\n### 动画 (Animations)\n\n有时，你可能对动画有更多的控制需求。例如，\n\
  \n\n\n\n如果你可以从一个位置移动到另一个位置，同时在动画的特定点更改某些 CSS 属性，那不是很好吗？这被称为关键帧（keyframing）。如果你有\
  \ Flash 动画经验，你会对它更熟悉，即为在 Flash 时间轴上对对象进行重大更改，并在它们之间创建补间动画（tweens）。现在 CSS 中也支持关键帧。一如既往，在编写时这些属性是特定厂商的，因此请使用所有可用的厂商前缀以确保兼容性。在演示中，你将让屏幕上的圆形移动并让它跳动。\n\
  \n在深入创建跳动球动画之前，请看图 5-3 所示的预期动画。\n\n**图 5-3.** *预期的动画序列*\n\n从图 5-3 的动画序列可以看出，其意图是模拟一个跳动球。CSS\
  \ 关键帧功能允许你按百分比增量指定想要制作动画的 CSS 样式。我们可以利用图 5-3 显示的信息来创建关键帧规则。\n\n你首先使用 `@keyframes`\
  \ 规则和关键帧名称创建一个新的关键帧定义，如下代码所示。\n\n```css\n@keyframes bouncyball {\n\n}\n```\n\n接下来，你使用百分比标记和\
  \ CSS 样式指定动画关联的元素从哪里开始。\n\n```css\n@keyframes bouncyball {\n0% { top: 0px; left:\
  \ 0px; }\n}\n```\n\n在这里，你指定关联元素应从左上角开始。\n\n接下来，你指定动画中的各个分段。以图 5-3 为指导，存在 `0%`、`12.5%`、`25%`、`37.5%`、`50%`、`62.5%`、`75%`、`87.5%`\
  \ 和 `100%` 对应的 CSS 规则。\n\n```css\n@keyframes bouncyball {\n0% { bottom: 100%; left:\
  \ 0px; }\n12.5% { bottom: 0px; left: 12.5%; }\n25% { bottom: 50%; left: 25%; }\n\
  37.5% { bottom: 0px; left: 37.5%; }\n50% { bottom: 25%; left: 50%; }\n62.5% { bottom:\
  \ 0px; left: 62.5% }\n75% { bottom: 12.5%; left: 75% }\n87.5% { bottom: 0px; left:\
  \ 87.5% }\n100% { bottom: 0px; left: 100% }\n}\n```\n\n现在是时候为你的球创建一个新的 CSS 规则了。以下代码将正方形变为圆形，并将动画应用到该元素上。\n\
  \n```css\n.ball {\nbackground: black;\nwidth: 100px;\nheight: 100px;\nposition:\
  \ absolute;\nborder-radius: 50px;\nanimation: bouncyball 2s ease-in-out;\n-moz-animation:\
  \ bouncyball 2s ease-in-out;\n-webkit-animation: bouncyball 2s ease-in-out;\n}\n\
  ```\n\n示例中的 `animation` CSS 属性是以简写形式写的，并且再次是特定厂商的。表 5-2 列出了 `animation` 属性按顺序接受的参数。\n\
  \n**表 5-2.** *CSS 动画属性*\n\n| 属性 | 说明 | 数值/选项 |\n| :--- | :--- | :--- |\n| `[-moz-|-webkit-]animation`\
  \ | 应用于元素的动画名称 | name |\n| `[-moz-|-webkit-]animation` | 动画的持续时间 *X* 秒 | duration\
  \ |\n| `[-moz-|-webkit-]animation` | 使用的时间函数；linear, ease, ease-in, ease-out, ease-in-out,\
  \ cubic-bezier | timing-function (默认为 ease) |\n| `[-moz-|-webkit-]animation` | 转换延迟的秒数\
  \ *X* | delay |\n| `[-moz-|-webkit-]animation` | 动画重复的次数；默认为 1 | iteration-count\
  \ (整数) |\n| `[-moz-|-webkit-]animation` | 告诉动画是正常、交替还是不在交替周期中反向播放动画；例如，如果你指定 animation-iteration-count\
  \ 为 2，则动画将在第二次迭代时反向播放 | direction |\n| `[-moz-|-webkit-]animation` | 指定正在运行或暂停的动画是否正在播放；可以使用\
  \ JavaScript 修改 | play-state |\n\n当你在设备上加载动画时，它应该会自动播放。这并不是一个非常流畅的跳动球，但这仅仅是为了证明\
  \ CSS 是一个非常强大的动画工具，只需少少努力。你还可以使用 `JavaScript` 动态编写 CSS 动画。对于更复杂的动画，还有 HTML5 Canvas。\n\
  \n### 新的 CSS3 特性\n\n除了动画、变换（transforms）和过渡（transitions）之外，CSS3 规范中还有几个值得关注的新特性。在本节中，你将学习如何使用\
