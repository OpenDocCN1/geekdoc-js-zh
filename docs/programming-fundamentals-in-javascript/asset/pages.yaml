  md: '# Chapter 8. Repetition


    A computer programmer can cause a computer to repeat a series of statements by
    writing a loop in a computer program. Every loop includes a boolean condition.
    Each time the computer needs to decide if it should repeat the statements inside
    a loop, the computer evaluates the loop’s condition. If the condition evaluates
    to true, then the computer repeats the statements inside the loop. If the condition
    evaluates to false, the computer does not repeat the inside statements but instead
    continues executing the program starting with the statements after the loop.


    # Chapter Outcomes


    By the end of this chapter, you will:


    +   - Be able to distinguish between pre-test and post-test loops and between
    counting and sentinel controlled loops

    - Know when to use a pre-test or post-test loop and when to use a counting or
    sentinel controlled loop.

    - Be able to read and write while, for, and do-while loops that cause a computer
    to repeat a group of statements.

    - Know what the keyword break inside a loop causes a computer to do.


    # Pre-test and Post-test Loops'
