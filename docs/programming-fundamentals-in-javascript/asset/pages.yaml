  md: '# Appendix B. Robust Code


    There is an old computer programming joke that goes like this. A consultant went
    to a large company to teach the software engineers in the company. At the beginning
    of the class she said to the students, “If you got on an airplane and realized
    that your team had written the software that runs the airplane, how many of you
    would be afraid for your life and get off the plane?” Every student except one
    put his hand up. The consultant looked at the one who didn’t raise his hand and
    asked, “What does your team do differently so that you wouldn’t be afraid to ride
    on the airplane?”


    The student answered, “Ha! If my team had written the software, the plane would
    never even get off the ground. I’d be perfectly safe.”


    Below are some programming practices that if you will make your software more
    robust (fewer errors) and help you rest easy on a working airplane for which you
    and your team wrote the software.


    +   1. Turn on compiler warnings and never ignore them.

    2. Follow generally accepted coding standards and conventions, including naming
    conventions.

    3. Write and use assertions. Test primarily with assertions turned on.

    4. Write and execute unit tests and don’t ignore test failures.

    5. Whenever possible, write simple, straight forward code. For example, when writing
    in JavaScript, Java, C++, and C do not use the left shift operator (<<) to multiply'
