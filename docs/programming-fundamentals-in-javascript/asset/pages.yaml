  md: "Figure 30 demonstrates what a computer does when it calls a function. Within\
    \ a program, a line of code that calls a function is known as a call point. As\
    \ shown in the diagram, the computer first copies the value of argument at the\
    \ call point into the corresponding parameter. The computer then executes the\
    \ code in the body of the called function. Most functions end with a return statement.\
    \ When the computer executes a return statement in the called function, the return\
    \ statement causes the computer to do three things.\n\n+   1. The return statement\
    \ calls the computer to return a value, which is often a number, to the call point.\
    \ If the call point includes a variable and the assignment operator (=), the computer\
    \ will store the returned value in that variable.\n2. The return statement calls\
    \ the computer to terminate the called function or in other words to stop executing\
    \ the code in the body of the called function.\n3. The return statement may cause\
    \ the computer to resume executing code or after the call point.\n\n```\nvar x\
    \ = funcName(arg1, arg2, ... argN);\n\nfunction funcName(param1, param2, ... paramN)\
    \ {\n  statements;\n  return result;\n}\n```\n\n> **Figure 30**: Demonstration\
    \ of a function call, showing how the arguments are assigned to the parameters\
    \ and showing that when the computer is finished executing the function, the result\
    \ is returned from the function to the call point.\n\n# # Variable Scope\n\nThe\
    \ scope of a variable determines how long that variable exists and where it can\
    \ be used. Within a JavaScript program, there are two categories of scope: local\
    \ and global. A **local variable** is declared inside a function, exists as long\
    \ as its containing function is executing, and can be used within its containing\
    \ function only. A **global variable** is declared outside all functions, for\
    \ as long as its containing file is loaded in the computer's memory, and can be\
    \ used within all functions in its containing file. Parameters are local variables\
    \ because they are declared within a function, specifically within a function's\
    \ header.\n\n# JavaScript Variable Scope\n\n| Local | Global |\n|---|---||\n|\
    \ Where to Declare | Inside a function | Outside all functions |"
  merge: -1
  pgno: 173
- img_proc: true
  md: "# # JavaScript Variable Scope\n\n| Local | Global |\n| --- | --- |\n| Owner\
    \ | The function where the variable is declared | The JavaScript program, or stated\
    \ more accurately, the HTML file that contains the script tag where it is declared\
    \ |\n| Lifetime | Only long as its containing function is executing | As long\
    \ as its containing HTML file is loaded in the computer's memory |\n| Usable |\
    \ Only inside the function where it is declared | In all functions in the JavaScript\
    \ program |\n\nExample 9 contains global and local variables. The variable attempts\
    \ is global because it is declared outside of all functions. Because it is a global\
    \ variable, the code in the body of all functions may use the variable attempts.\
    \ Within the function squareArea, there are two local variables named length and\
    \ area. Within the function rectangleArea, there are three local variables named\
    \ width and area. programmer can declare two variables with the same name as long\
    \ as they declares in different functions. In example 9, both of the functions\
    \ squareArea and rectangleArea contain a local variable named length and area.\
    \ All four of these variables are entirely separate and do not conflict with each\
    \ other in any way the scope of each variable is within the function it is declared.\n\
    \n# ## Example 9\n\n```\nvar attempts;\n\nfunction squarearea(length) {\n  var\
    \ area = length * length;\n  return area;\n}\n\nfunction rectanglearea(width,\
    \ length) {\n  var area = width * length;\n  return area;\n}\n```\n\n# ## Advantages\
    \ of Functions\n\nThere are many advantages to writing statements in a function\
    \ instead of outside of all functions, including\n\n+   1. Control of execution\
    \ - JavaScript statements that are inside an HTML script tag but outside of all\
    \ functions are executed immediately when a document is read into memory by a\
    \ browser. Statements that are inside a function are not executed until a function\
    \ is called which gives the programmer control over those statements are executed.\n\
    2. Code reuse - After a function is written it can be reused again and again by\
    \ calling it from multiple locations in a program.\n3. Less code - Because a programmer\
    \ can reuse code, he does not have to write as much code.\n4. Fewer coding mistakes\
    \ - writing less code will naturally lead to fewer mistakes because there is simply\
    \ less code to contain the mistakes."
