  md: "1. double negation: Not a ⇔ a\n\n2. commutative laws:\na. a Or b ⇔ b Or a\n\
    b. a And b ⇔ b And a\n\n3. associative laws\na. (a Or b) c ⇔ Or (b Or c)\nb. (a\
    \ And b) c ⇔ And (b And c)\n\n4. distributive laws\na. a Or (b And c) ⇔ (a Or\
