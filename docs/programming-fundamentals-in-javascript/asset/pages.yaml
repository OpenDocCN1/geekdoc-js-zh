    >Total</button>\n<div id=\"total\"></div>\n</body>\n</html>\n```\n\n# Finding\
    \ a Value (Binary Search)\n\nIf the elements in an array are sorted, then the\
    \ computer can use a faster algorithm called binary search to find an element\
    \ within that array. The binary search algorithm works by comparing the key to\
    \ the middle element in the array. If the key is greater than the middle most\
    \ element, then the search is repeated in the last half of the array. If the key\
    \ is less than the middle most element, then the search is repeated in the first\
    \ half of the array. Of course, if the key is equal to the middle most element,\
    \ then the key has been found and the search is done. This process of comparing\
    \ the key to the middle most element of the current interval is repeated until\
    \ the key is found or the interval has shrunk to 1 element. If that one element\
    \ is not the same as the key, then the key is not present in the array, and the\
    \ function below returns a negative value."
