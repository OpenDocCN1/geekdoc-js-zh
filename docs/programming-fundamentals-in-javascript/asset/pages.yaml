    # Increment and Decrement Operators


    JavaScript includes two shortcut operators called the increment and decrement
    operators. The increment operator (++) simply adds one to the value of a variable.
    The decrement operator (--) subtracts one from the value of a variable.


    | Operator Name Example Equivalent |

    |---|---|---||

    | ++ | pre-increment | ++x; x += 1; x = x + 1; |

    | | post-increment | x++; | |

    | -- | pre-decrement | --t; t -= 1; t = t - 1; |

    | | post-decrement | t--; | |


    Both the increment and decrement operators can be written as a pre or post operator.
    If you write one of these before a variable name, such as ++, then it is a pre-increment,
    meaning the computer will perform the increment before the rest of the arithmetic
    in the same statement. If you write one of the operators after a variable'
