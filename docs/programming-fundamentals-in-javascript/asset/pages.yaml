    # Chapter Summary


    +   - Object oriented programming is a way of viewing the world and designing
    and implementing software that matches the world.

    - An object is anything in the world that has identity, data, behavior, and relationships
    to other objects.

    - A class is both a group of similar objects and a pattern for creating objects.

    - The Unified Modeling Language (UML) is a diagramming language that enables a
    software developer to draw classes and objects.

    - JavaScript includes several prototype objects including Array, Boolean, Data,
    String, and RegExp, that a programmer can use to create new objects.

    - To create a JavaScript object use the new keyword and the name of the prototype
    object: `var objectName = new PrototypeName();`

    - To read or write the value of an object’s attribute, use the name of the object
    and the name of the attribute separated by a period: `objectName.attributeName

    - To call a function that is part of an object, use the object’s name and function
    separated by a period: `objectName.funcName(arg1, arg2, ...);`'
