    # Quadratic Formula


    A quadratic equation of the form $y = ax^2 + bx + c$ has two solutions, also called
    roots, that may or may not be distinct and that may be real or complex. If you
    graph a quadratic equation, the roots are the locations where the equation crosses
    the x-axis. [Figure 23 contains the graph of three different quadratic equations.
    Notice that the first equation (on the left) crosses the x-axis twice and therefore
    has two real roots.


    ![](img/7ea917145c99e19be973d71c03bf910b_109_0.png)


    The second equation touches the x-axis only once and therefore has only one distinct
    root. The third equation does not cross the x-axis and so its two roots are complex
    meaning they contain the square root of -1. The square root of -1 does not exist,
    and mathematicians say it is imaginary.


    The roots of a quadratic equation can be found using the quadratic formula:


    ```

    x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}

    ```


