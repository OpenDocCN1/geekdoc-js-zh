    The rules for writing Roman numerals are


    +   a. Thousands, hundreds, tens, and ones are written separately.

    b. Thousands can be no larger than 3000 and are written as M, MM, or MMM, meaning
    1000, or 3000 respectively.

    c. The numbers 100 to 900 are written as C, CC, CCC, CD, DC, L, D, DCC, DCCC,
    CM

    d. The numbers 10 to 90 are written similarly, except X, L, and C are used: X,
    XX, XXX, XL, L, LX, LXX, LXXX, XC

    e. The numbers 1 to 9 are written similarly, except I, V, and X are used: I, II,
    III, IV, V, VI, VII, VIII, IX


    As an example, 1987 is MCMLXXVII (1000 = M, 900 = CM, 80 = LXXX, and 7 = VII).'
