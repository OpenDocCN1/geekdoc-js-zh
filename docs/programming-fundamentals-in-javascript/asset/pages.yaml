  md: '# Chapter 1. Computer Hardware


    # Chapter Outcome


    By the end of this chapter, you will have a basic understanding of computer hardware
    so that you can begin to program computers.


    # Semiconductors


    Many of the parts of a computer, including the CPU and main memory, are composed
    of millions or billions of microscopic semiconductors that are etched in silicon.
    The word semiconductor means these microscopic parts partially conduct or sometimes
    conduct electricity. There are many different types of semiconductors, and each
    type fulfills a specific purpose. Below is a list of common semiconductors and
    their purpose.


    +   1. Capacitor – a semiconductor that temporarily stores electricity.


    +   2. Diode – a semiconductor that allows electricity to flow in only one direction.


    +   3. LED – acronym for light emitting diode; a diode that emits light when electricity
    is flowing through it.


    +   4. Resistor – a semiconductor that resists the flow of electricity. A resistor
    is often used to protect other parts of a computer from surges in electricity.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '5. Transistor – a semiconductor with two inputs and one output called the drain.
    A small current on the center wire of the transistor controls a larger current
    that flows on the two outer wires. A transistor can be used as an amplifier or
    an automated switch with the small electric current input and output.


    a


    b


    c


    d


    e


    ![](img/7ea917145c99e19be973d71c03bf910b_16_0.png)


    > Figure 1: Photographs of common semiconductors: a) capacitor, b) diode, c) light
    emitting diode, d) resistor, and e) transistor.


    6. Integrated circuit – a circuit composed of many (possibly billions) semiconductors
    etched on a small piece of silicon; sometimes called a computer chip.


    # Parts of a Computer


    A modern computer is an electronic machine that is composed of two major parts:
    hardware and software. Computer hardware is the physical parts of a computer,
    such as the keyboard, mouse, CPU, hard drive, memory, monitor, and printer. An
    easy mnemonic to help you remember that hardware is the physical parts of a computer
    is that the physical parts are hard. If someone threw a piece of computer hardware
    at you, and it hit you, it would hurt. Of course, each part of a computer has
    its own specific purpose. Here is a list of common computer hardware parts.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   7. Power supply – an electric circuit that converts the electricity coming
    from an outlet in the wall, usually 115 volts, 60-Hertz alternating current (AC),
    into electricity that a computer can use, something like 3.3 volts direct current
    (DC).


    +   8. Keyboard – an input device that allows a user to enter data into a computer
    by pressing keys.


    +   9. Motherboard – the main circuit board to which the other parts of a computer
    are attached. Figure 2 shows a motherboard without a CPU, main memory, or other
    devices attached to it.


    ![](img/7ea917145c99e19be973d71c03bf910b_17_0.png)


    **Figure 2**: A computer motherboard.


    +   10. Bus – the wires and integrated circuits that transfer data across the
    motherboard from one component to another.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '11. BIOS – acronym for basic input and output system; usually flash memory
    installed on the motherboard that contains instructions the CPU executes when
    a computer is started.


    12. CPU – acronym for central processing unit; a relatively large and expensive
    integrated circuit where most calculations are done within a computer.


    ![](img/7ea917145c99e19be973d71c03bf910b_18_0.png)


    13. Cache – a small amount of fast memory that temporarily stores data and instructions
    and is often located on the CPU. The cache


    **Figure 3:** The top and bottom of an Intel Core i7 CPU. Picture is courtesy
    of Intel.


    contains a partial copy of the contents of main memory so when the CPU needs data
    for a calculation, the CPU can get the data from the cache and does not have to
    wait for the data to come over a bus from main memory. Cache memory is volatile
    which means when a computer is turned off or the electricity is removed, the contents
    of cache are lost.


    14. Main memory – integrated circuits that temporarily store data and instructions
    for the CPU; sometimes called random access memory (RAM). Main memory is volatile
    which means when a computer is turned off, the contents of main memory are lost.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Figure 4: Four gigabytes of DDR random access memory. Photo is courtesy of
    neweggg.com.


    +   15. Hard drive stores data semi-permanently usual on a spinning platter where
    microscopic spots have been magnetized


    ![](img/7ea917145c99e19be973d71c03bf910b_19_0.png)


    ![](img/7ea917145c99e19be973d71c03bf910b_19_1.png)


    Figure 5: A computer hard drive with its cover removed exposing the platter and
    the head that moves above the platter. Photo is courtesy of Evan-Amos at en.wikipedia.org

    store data. A hard drive is **non-volatile** which means when a computer is turned
    off, the contents of a hard drive are preserved. Figure 5 shows a hard drive with
    its cover removed to expose the platter and the head that moves'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'above the platter and magnetizes microscopic spots on the platter.


    +   16. CD or DVD drive – reads and writes data semi-permanently to a disc using
    a laser. Compact discs (CD''s) and digital versatile disks (DVD''s) are non-volatile.


    +   17. Jump, thumb, or flash drive – semi-permanent memory that can be read,
    written, and erased electrically. Jump drive, thumb drive, and flash drive are
    different names for the same type of memory device which stores data in flash
    memory. A solid state hard drive does not store data on a platter like a regular
    hard drive but instead stores data in flash memory. Flash memory is non-volatile.


    +   18. Monitor – an output device that displays messages, images, etc. for a
    user to see.


    # Data Sizes


    Each of the following terms is a measure of the amount of data that a computer
    can store or process.


    +   19. bit – an abbreviation for binary digit. A binary digit is a column in
    a binary number where either 0 or 1 can appear.


    +   20. nibble – four bits joined together to form a binary number. The name nibble
    is an inside computing joke because a nibble is half of a byte.


    +   21. byte – eight bits joined together to form a binary number.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '22. kilobyte – a true kilobyte is 1024 (2¹⁰) bytes and not just 1000 bytes.


    23. megabyte – a true megabyte is 1,048,576 (2²⁰) bytes and not just 1,000,000
    bytes.


    24. gigabyte – 2³⁰ bytes


    25. terabyte – 2⁴⁰ bytes


    26. petabyte – 2⁵⁰ bytes


    27. exabyte – 2⁶⁰ bytes


    # Clock Speeds


    The clock within a second is a small electrical circuit that repeatedly produces
    an electric signal that pulses, meaning its voltage rises and falls similar to
    Figure 6. This electric signal pulses many times a second, and a single core on
    a CPU is designed to complete one instruction at the end of each pulse. Clock
    speed is measured in hertz. A single hertz is one cycle per second. A cycle is
    from any point in the pulse to where the pulse repeats. In other words, a single
    cycle starts immediately after the electric voltage falls, includes the voltage
    rising, and ends when the voltage falls again. Here are the terms used to measure
    clock speeds:


    ![](img/7ea917145c99e19be973d71c03bf910b_21_0.png)


    28. hertz – a unit of frequency equal to one cycle per second'
  merge: -1
  pgno: 21
- img_proc: true
  md: '29. megahertz – one million cycles per second


    30. gigahertz – one billion cycles per second.


    Many modern computers have clock speeds of 2.5 gigahertz or higher which means
    a single core on a CPU is designed to complete 2.5 billion instructions per second.
    Many CPU''s have multiple cores. Each core performs calculations independently
    of the other cores. A quad core CPU with a clock speed of 2.5 gigahertz is designed
    to complete 10 billion (4 * 2.5 gigahertz) instructions per second. This is very
    fast.


    # Classes of Computers


    Computers can be classified according to their size and primary purpose. Here
    are some common computer classes.


    +   31. micro or personal computer – a computer designed to be used by only one
    person at a time, such as a smart phone, tablet computer, laptop computer, or
    desktop computer.


    +   32. workstation – a powerful computer designed to be used by one person at
    a time and used to perform engineering, scientific, and medical tasks such as
    designing airplane parts.


    +   33. mainframe – a very powerful computer designed to be used by many people
    at the same time to perform business or scientific tasks.


    # Categories of Software'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Computer hardware is really just a bunch of metal that electricity can flow
    through in well-defined paths. Computer hardware will not do anything without
    some instructions. The instructions are written by a computer programmer and are
    called software. Computer software is simply a list of instructions that the computer
    hardware executes. Computer software can be classified according to its purpose.


    +   34. Application – computer software that someone uses to accomplish a specific
    task, such as write a letter, balance an account, watch a movie, or play a game.
    Examples of applications include Microsoft Word and Excel, Google Chrome, and
    iTunes.


    +   35. Operating system – computer software that manages the hardware and isolates
    the applications from the hardware so that the applications do not have to interact
    directly with the hardware. Examples of computer operating systems include Microsoft
    Windows, Mac OS X, VMS, Linux, HP-UX, and Solaris.


    # Character Data


    Everything in a computer’s memory is stored as a number or set of numbers. Everything.
    Pictures, songs, text, instructions, everything. Each text symbol is stored in
    the computer’s memory as a number.


    +   36. ASCII – an acronym for American Standard Code for Information Interchange;
    a coding system (essentially a table) with 128 rows that assigns a number to each
    English letter and common punctuation symbol. See asciitable.com'
  merge: -1
  pgno: 23
- img_proc: true
  md: "37. Unicode – a very large coding system that includes ASCII and assigns a\
    \ number to symbols from many languages, such as English, Portuguese, Greek, Hebrew,\
    \ Arabic, and Tagalog. See unicode.org\n\n# Execution Example\n\nTo help you understand\
    \ how the parts of a computer work together, consider what happens when a user\
    \ double clicks on a Microsoft Word document file (a file with a filename suffix\
    \ of .docx).\n\n+   1. The operating system commands the hard drive to copy the\
    \ Microsoft Word Application (MS Word) into main memory.\n2. The hard drive copies\
    \ MS Word over a bus into main memory.\n3. After MS Word is in main memory, the\
    \ operating system executes MS Word and sends a command to MS Word telling it\
    \ to open the document that the user double clicked.\n4. MS Word requests the\
    \ operating system to read the document from the hard drive and to place it in\
    \ main memory.\n5. The operating system commands the hard drive to copy the document\
    \ file into main memory.\n6. The hard drive copies the document file over a bus\
    \ into main memory.\n7. For each character that is in the document\n   a. MS Word\
    \ reads the character's Unicode number from main memory and requests the operating\
    \ system to draw that character in a window.\n   b. The operating system finds\
    \ the Unicode number and its corresponding symbol in a table and draws the symbol.\n\
    \n# Review Questions"
