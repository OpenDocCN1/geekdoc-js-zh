  md: "It is interesting to consider the English equivalents of each of the logical\
    \ operators as shown in the following table.\n\n# JavaScript Logical Operators\n\
    \n| Operator | Name | English Equivalent |\n| --- | --- | --- |\n| && | Not And\
    \ | not and |\n| || | Inclusive Or | or |\n| ^ | Exclusive Or | either ... or\
    \ |\n\nOf the four logical operators taught in this chapter, Exclusive Or is the\
    \ only one doesn't have a single word, English equivalent. Of the four operators,\
    \ Exclusive Or is also the least commonly used. It is difficult to find non-trivial,\
    \ everyday examples of its use. One trivial example is this question and its answer:\n\
    \n\"Where is Jonas?\"\n\"He is at the library or the soccer field.\"\n\nOf course,\
    \ the person answering the question certainly did not imply that Jonas might be\
    \ at both the library and the soccer field at the same time. Rather the person\
    \ meant, means at either the library or the soccer field.\n\nBesides being rare\
    \ in the real world, examples of logical Exclusive Or are also rare in programs.\
    \ In fact, some programming languages, such as C++, it is possible to use the\
    \ Not logical operator (!=) in place of logical Exclusive Or. Here is a small\
    \ example using that this snippet of code is from a large program that includes\
    \ buttons in its user interface. This code is used to enable or disable a button.\n\
    \n```\nif (isEnabled == false && command == 'enable') {\n    // enable button\n\
    } else if (isEnabled == true && command == 'disable') {\n    // disable button\n\
    }\n```\n\nNotice that the code does nothing if a button is enabled and the command\
    \ is to enable the button. It also does nothing if the button is disabled and\
    \ the command is to disable it. It only does something if the state of the button\
    \ is different from the command. Because of this, it is possible to rewrite the\
    \ code to use logical Exclusive Or.\n\n```\nif (isEnabled == ^ command == 'enable')\
    \ {\n    // toggle button\n}\n```\n\n# Logical Equivalences\n\nA logical expression\
    \ can be written in many different ways that resolve to the same result. Two different\
    \ logical expressions that resolve the same result are said to be equivalent,\
    \ which is shown with a double ended arrow (=>). Two such expressions are not\
    \ the same and not equal but are equivalent. Here is a list of logical expressions\
    \ with an equivalent expression for each."
