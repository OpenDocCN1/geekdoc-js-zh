  md: 'All HTML 5 documents must begin with a document type declaration like this:
    <!DOCTYPE HTML>. It doesn’t matter whether you write this declaration in upper
    or lower case or a mix of the two. This declaration tells the computer what follows
    is an HTML 5 document. If you forget to put it at the top of an HTML document,
    your browser may recognize the document as an older version of HTML, and your
    browser may draw the document incorrectly.


    # Comments


    A comment in an HTML document is a note or documentation that a web designer writes
    for himself or other designers who will look at the HTML code. The computer ignores
    comments. A comment in HTML begins with the symbols less than, exclamation mark,
    and two dashes, like this: <!-- and ends with the symbols dashes and greater than,
    like this: -->.


    # HTML Elements


    An HTML document is composed of elements. An element is simply a part of an HTML
    document. Figure 7 shows an HTML element and all of its parts. Notice that an
    HTML element is composed of an opening tag, optional text, and a closing tag.
    A single tag begins with the less than symbol (<) and ends with the greater symbol
    (>). For example <div class="note"> or </div>. An opening tag contains a tag name
    and optionally some attributes. Each attribute is composed of a name and a value
    separated by an equal sign (=), such as id="high". A closing tag has the same
    name as the opening tag, but the name is preceded by a slash character (/).


