    # Chapter Summary


    +   * Selection is a control structure that allows the computer to execute one
    group of statements and skip another group of statements.

    * An if statement is a selection statement that begins with the JavaScript keyword
    if.

    * An if statement must have a condition in parentheses. The parentheses contain
    code to compare two values.

    * There are six comparison operators in JavaScript: equal to (==), not equal to
    (!), less than (<), less than or equal to (<=), greater than (>), greater than
    or equal to (>=).

    * A switch statement is a selection statement that begins with the JavaScript
    keyword switch and can be used instead of a long set of if ... else if ... else
    statements.


