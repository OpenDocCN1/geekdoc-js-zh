  md: '# Preface


    Learning to program a computer is a frustrating task for many students. In my
    teaching experience, I have found that much of this frustration comes because
    students are not shown enough programming examples. All of us learn by watching
    others, so why should learning to program a computer be any different? I wrote
    this book with minimal text but filled with computer programming examples and
    many hands on exercises to help begin students learn computer programming more
    efficiently and thoroughly with less frustration.


    # How to Use This Book


    You can use this book as a tutorial or a reference. When using it as a tutorial,
    you will find it helpful to step through the example code line by line as if you
    were a computer. Doing this is sometimes called a desk check because you are checking
    the code on paper or “at your desk” instead of running it on a computer. To aid
    you in desk checking the example code, I have provided desk check locations throughout
    the book. Each desk check location includes a list of all the variables in the
    corresponding example code and values for the input variables. To perform a desk
    check, step through the code as if you were the computer and change the value
    of each variable just as the computer would.


    # Conventions'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Within the text of this book the following fonts and font styles are used.


    +   - **Bolded text** is used to highlight an important term.

    - *Italicized text* emphasizes certain words that might be missed by casual reading.

    - _Underlined text_ indicates a hyperlink to a website.

    - Fixed width font is used to show computer code.

    - Menu font shows the words that appear in a computer menu or on a computer button.


    Chapters 5–12 include JavaScript code templates that use these fonts and symbols.


    +   - Fixed width font is used for JavaScript keywords that you must type exactly
    as they are shown in the template.

    - *Italicized text* is used for words that you should replace when you write code.

    - Any part of a template is written in `gray text` is optional.


    For example within the following template, var is a JavaScript keyword, `name`,
    `name2`, and `name3` should be replaced by names that you choose, and `name2`
    and `name3` are optional.


    ```

    var name, name2, name3;

    ```


    Several locations in this book use brackets and parentheses to specify an interval
    or range of numbers, like this [0, 25). A bracket means end of the interval is
    inclusive, or in other words includes the listed number. A parenthesis means that
    end of the interval is exclusive, or in other words excludes the listed number.
    For example, in this interval: [0, 25), 0 is included, but 25 is excluded.'
