    ;\nif (x < 2) {\n  if (y > 10) {\n    message = \"Hello\";\n  }\n} else {\n  message\
    \ = \"Goodbye\";\n}\nalert(message);\n```\n9. Given the following JavaScript code,\
    \ what will the computer output for the user to see?\n```\nvar x = 1, y = 7;\n\
    var message = \"Welcome\";\nif (x < 2) {\n  if (y > 10) {\n    message = \"Hello\"\
    ;\n  } else {\n    message = \"Goodbye\";\n  }\n}\nalert(message);\n```\n\n##\
    \ Programming Assignments\n\n1. Write a defining table and then a program that\
