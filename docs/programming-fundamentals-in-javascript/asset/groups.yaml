  mdcn: "\n\n循环可以根据布尔条件的位置进行分类。**预测试循环**（pre-test loop）条件位于循环的顶部。它被称为预测试循环，是因为在计算机执行循环内部语句之前（预）会对条件进行求值。**后测试循环**（post-test\
