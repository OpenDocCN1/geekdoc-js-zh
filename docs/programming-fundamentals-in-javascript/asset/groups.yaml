    When a new programmer first understands the post-increment operator, the most
    common question she asks “Why? Why would anyone ever use the post-increment operator
    to change the value of a variable *after* the other calculations in the same statement
    are done?” The answer is “to prepare the incremented variable (*a* in examples
    18 and 19) to be used later in the program.”


    When writing the increment or decrement operator, remember that it makes no difference
    whether you write the pre or post version of the operators if the operator is
    in a statement all by itself. For example:


    ```

    a++;

    ```


