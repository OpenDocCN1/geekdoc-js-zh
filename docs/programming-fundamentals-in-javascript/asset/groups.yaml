    # Chapter 1. Computer Hardware


    # Chapter Outcome


    By the end of this chapter, you will have a basic understanding of computer hardware
    so that you can begin to program computers.


    # Semiconductors


    Many of the parts of a computer, including the CPU and main memory, are composed
    of millions or billions of microscopic semiconductors that are etched in silicon.
    The word semiconductor means these microscopic parts partially conduct or sometimes
    conduct electricity. There are many different types of semiconductors, and each
    type fulfills a specific purpose. Below is a list of common semiconductors and
    their purpose.


    - 1. Capacitor – a semiconductor that temporarily stores electricity.

    - 2. Diode – a semiconductor that allows electricity to flow in only one direction.

    - 3. LED – acronym for light emitting diode; a diode that emits light when electricity
    is flowing through it.

    - 4. Resistor – a semiconductor that resists the flow of electricity. A resistor
    is often used to protect other parts of a computer from surges in electricity.

    - 5. Transistor – a semiconductor with two inputs and one output called the drain.
    A small current on the center wire of the transistor controls a larger current
    that flows on the two outer wires. A transistor can be used as an amplifier or
    an automated switch with the small electric current input and output.


    a

    b

    c

    d

    e


    ![](img/7ea917145c99e19be973d71c03bf910b_16_0.png)


    > Figure 1: Photographs of common semiconductors: a) capacitor, b) diode, c) light
    emitting diode, d) resistor, and e) transistor.


    - 6. Integrated circuit – a circuit composed of many (possibly billions) semiconductors
    etched on a small piece of silicon; sometimes called a computer chip.


    # Parts of a Computer


    A modern computer is an electronic machine that is composed of two major parts:
    hardware and software. Computer hardware is the physical parts of a computer,
    such as the keyboard, mouse, CPU, hard drive, memory, monitor, and printer. An
    easy mnemonic to help you remember that hardware is the physical parts of a computer
    is that the physical parts are hard. If someone threw a piece of computer hardware
    at you, and it hit you, it would hurt. Of course, each part of a computer has
    its own specific purpose. Here is a list of common computer hardware parts.


    - 7. Power supply – an electric circuit that converts the electricity coming from
    an outlet in the wall, usually 115 volts, 60-Hertz alternating current (AC), into
    electricity that a computer can use, something like 3.3 volts direct current (DC).

    - 8. Keyboard – an input device that allows a user to enter data into a computer
    by pressing keys.

    - 9. Motherboard – the main circuit board to which the other parts of a computer
    are attached. Figure 2 shows a motherboard without a CPU, main memory, or other
    devices attached to it.


    ![](img/7ea917145c99e19be973d71c03bf910b_17_0.png)


    **Figure 2**: A computer motherboard.


    - 10. Bus – the wires and integrated circuits that transfer data across the motherboard
    from one component to another.


    - 11. BIOS – acronym for basic input and output system; usually flash memory installed
    on the motherboard that contains instructions the CPU executes when a computer
    is started.

    - 12. CPU – acronym for central processing unit; a relatively large and expensive
    integrated circuit where most calculations are done within a computer.


    ![](img/7ea917145c99e19be973d71c03bf910b_18_0.png)


    - 13. Cache – a small amount of fast memory that temporarily stores data and instructions
    and is often located on the CPU. The cache


    **Figure 3:** The top and bottom of an Intel Core i7 CPU. Picture is courtesy
    of Intel.


    contains a partial copy of the contents of main memory so when the CPU needs data
    for a calculation, the CPU can get the data from the cache and does not have to
    wait for the data to come over a bus from main memory. Cache memory is volatile
    which means when a computer is turned off or the electricity is removed, the contents
    of cache are lost.


    - 14. Main memory – integrated circuits that temporarily store data and instructions
    for the CPU; sometimes called random access memory (RAM). Main memory is volatile
    which means when a computer is turned off, the contents of main memory are lost.


    Figure 4: Four gigabytes of DDR random access memory. Photo is courtesy of neweggg.com.


    - 15. Hard drive stores data semi-permanently on a spinning platter where microscopic
    spots have been magnetized


    ![](img/7ea917145c99e19be973d71c03bf910b_19_0.png)


    ![](img/7ea917145c99e19be973d71c03bf910b_19_1.png)


    Figure 5: A hard drive with its cover removed.


    - 16. CD or DVD drive – reads and writes data semi-permanently to a disc using
    a laser. Compact discs (CD''s) and digital versatile disks (DVD''s) are non-volatile.

    - 17. Jump, thumb, or flash drive – semi-permanent memory that can be read, written,
    and erased electrically. Jump drive, thumb drive, and flash drive are different
    names for the same type of memory device which stores data in flash memory. A
    solid state hard drive does not store data on a platter like a regular hard drive
    but instead stores data in flash memory. Flash memory is non-volatile.


    - 18. Monitor – an output device that displays messages, images, etc. for a user
    to see.


    # Data Sizes


    Each of the following terms is a measure of the amount of data that a computer
    can store or process.


    - 19. bit – an abbreviation for binary digit. A binary digit is a column in a
    binary number where either 0 or 1 can appear.

    - 20. nibble – four bits joined together to form a binary number. The name nibble
    is an inside computing joke because a nibble is half of a byte.

    - 21. byte – eight bits joined together to form a binary number.

