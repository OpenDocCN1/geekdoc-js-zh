    ## Chapter Summary


    - Before using a variable in JavaScript, you must declare it. To declare a variable,
    write the keyword var followed by the variable''s name.

    - Use the assignment operator (=) to assign a value to a variable.

    - Within a JavaScript program, use these operators: *, /, %, +, - to multiply,
    compute the remainder after division, add, and subtract.

    - The assignment operators (*=, /=, +=, -=) are shortcuts for performing arithmetic
    using the current value of a variable and storing the result into that variable.

    - To add one to the value of a variable, you can use the increment operator (++).
    You can use the decrement operator (--) to subtract one from the value of a variable.

    - Each of the arithmetic operators has a precedence. It is important that you
    understand precedence when writing formulas in JavaScript.

    - To program a computer to perform more advanced arithmetic, such as exponentiation,
    square root, and rounding, you must use the functions in the Math object.


