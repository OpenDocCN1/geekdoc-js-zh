    数据（Data）


    这些是对象的特征，通常为形容词。它们也被称为属性、特性性、字段、实例变量或结构。


    行为（Behavior）是对象执行的操作，通常为动词。它们也被称为方法、操作、函数或过程。


    关系（Relationships）是对象之间的链接或连接。


    类（Class）既是一组相似对象的集合，也是创建对象的模式。由于对象具有标识性、数据、行为和关系，而类是创建对象的模式，因此类也必须具备这四种要素。


    # 统一建模语言 (Unified Modeling Language)


    许多程序员使用图表来设计和记录程序中的类和对象。用于这些图表的最常用语言是统一建模语言（UML）。类图是其中一种图表。


    | Student | Course |

    | --- | --- |

    | -firstName | -number |

    | -lastName | -title |

    | -address | -description |

    | -phone | -location |

    | +changeName() | +open() |

    | +register() | +allowStudent() |

    | +attendClass() | +close() |

    | +withdraw() | |


    图 41：显示两个类的 UML 类图。图 41 显示了一个包含两个类的 UML 类图。在类图中，每个类都显示为一个矩形，通常分为三个部分。第一部分包含类名。第二部分包含由该类创建的所有对象将拥有的数据列表。第三部分包含由该类创建的所有对象将拥有的行为列表。


    # 关系 (Relationships)


    对象或类之间可以存在多种关系。类之间的关系通过连接到类的不同类型的线条表示。


    ### 聚合 (Aggregation)


    两个对象之间的关系，其中一个对象包含另一个对象。这有时被称为整体与部分的关系。为了在两个对象*整体*（whole）和*部分*（part）之间使用聚合，这两个英语短语中的一个必须通顺：*整体*包含*部分*或*整体*拥有*部分*。聚合的
    UML 符号是实线，末端连接到被包含类上的空心菱形：


    ![](img/7ea917145c99e19be973d71c03bf910b_228_0.png)


    ### 组合 (Composition)


    两个对象之间的关系，其中一个对象包含另一个对象，且被包含的对象可能不可共享。这也是一种整体与部分的关系，是聚合的强形式。为了在两个对象*整体*（whole）和*部分*（part）之间使用组合，这两个英语短语中的一个必须通顺：*整体*包含*部分*或*整体*拥有*部分*。组合的
    UML 符号是实线，末端连接到被包含类上的实心菱形：


    ![](img/7ea917145c99e19be973d71c03bf910b_228_1.png)


    ### 继承 (Inheritance)


    两个类之间的关系，导致子类自动拥有父类的所有内容（数据、行为和关系）。为了在两个对象*父类*（parent）和*子类*（child）之间使用继承，这两个英语短语中的一个必须通顺：*子类*是一种*父类*或*子类*是一个*父类*。继承的
    UML 符号是实线，末端连接到父类的空心三角形：


    | Parent | Child |

    | --- | --- |


    ### 依赖 (Dependency)


    两个对象之间的依赖关系，其中一个对象需要或使用另一个对象来完成任务。为了在两个对象 $x$ 和 $y$ 之间使用依赖，这两个英语短语中的一个必须通顺：$x$
    使用 $y$，$x$ 要求 $y$，或 $x$ 需要 $y$。依赖的 UML 符号是虚线，末端连接到所需类的空心箭头：


    | Needed | Needy |

    | --- | --- |


    ### 关联 (Association)


    对象之间的通用关系。当两个对象相关，但该关系不是聚合、组合、继承或依赖时，则使用关联。关联的 UML 符号是实线：


    | A | B |

    | --- | --- |


    # 多重性 (Multiplicities)


    多重性是关系的一端或两端的小数字和标点，用于限制关系。单数字多重性将关系限制为恰好该数量的对象。


    | Carton | Egg |

    | --- | --- |

    | 1 | 12,18 |


    **图 42：**显示带有多重性的两个类的 UML 类图。用逗号分隔的两个或多个数字将关系限制为这些数字中的任意一个。用两个点（..）分隔的两个数字将关系限制在一个对象范围内。例如，多重性可以用于显示如图
    42 所示，一个纸盒内有 12 个或 18 个鸡蛋。


    # 多重性示例 (Multiplicity Examples)


    | 多重性 | 含义 |

    | --- | --- |

    | 1 | 恰好一个 |

    | 4,8 | 恰好四个或恰好八个 |

    | 0,1 | 零或一个，也称为可选 |

    | 0..1 | 零或一个，也称为可选 |

    | 12..18 | 在 12 到 18 之间（包含边界） |

    | 0..* | 零或多个 |

    | * | 零或多个 |

    | 1..* | 一个或多个，也称为至少一个 |

    | 3..* | 三或多个，也称为至少三个 |


