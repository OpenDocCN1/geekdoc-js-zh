    Goodbye\";\n  }\n}\nalert(message);\n```\n\n## 编程作业\n\n1. 编写一个定义表，然后编写一个程序计算并输出用户输入的两个数字之间的绝对差。换句话说，你的程序应该始终显示正数差值。例如：\n\
