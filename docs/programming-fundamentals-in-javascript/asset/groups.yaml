    \ only one statement. This means that in the example below, if the first condition\
    \ (x < 2) is true and the second condition (y > 8) is false, the computer will\
    \ not change message to \"Hello\" or \"Goodbye\". In that situation, the computer\
    \ will display \"wave\".\n\n## Example 13\n\n```\nvar message = 'wave';\nif (x\
    \ < 2) {\n  if (y > 8) {\n    message = 'Hello';\n  }\n} else {\n  message = 'Goodbye';\n\
    }\ndocument.getElementById('outputDiv').innerHTML = message;\n```\n\n## Desk Check\n\
    \n## Common Mistakes\n\n### Forgetting parentheses around the condition\n| Incorrect\
    \ | Correct |\n|---|---|\n| if x < 7 { | if (x < 7) { |\n\n### Using assignment\
    \ instead of comparison\n| Incorrect | Correct |\n|---|---|\n| if (age = 18) {\
    \ | if (age == 18) { |\n\n### Placing a semicolon at the end of an if statement\n\
    | Incorrect | Correct |\n|---|---|\n| if (growth > 500); { | if (growth > 500)\
    \ { |\n\n### Placing a semicolon at the end of an else statement\n| Incorrect\
    \ | Correct |\n|---|---|\n| if (growth > 500) } else; { | if (growth > 500) }\
    \ else { |\n\n### Forgetting braces when there is more than one statement inside\
    \ an if statement\n| Incorrect | Correct |\n|---|---|\n| if (bal > 500)\nintr\
    \ = bal * 0.03;\nbal += intr; | if (bal > 500) {\n  intr = bal * 0.03;\n  bal\
    \ += intr;\n} |\n\n## Desk Check\n\n| x | message |\n|---|---|\n| 1 | 5 |\n| x\
    \ | y |\n\n## Adding a condition to an else statement\n| Incorrect | Correct |\n\
    |---|---|\n| if (gender == 'F') {\nelse (gender == 'M') { | if (gender == 'F')\
    \ {\nelse { | |\n\n## Unnecessary Comparisons\n| Incorrect | Correct |\n|---|---|\n\
    | if (age < 18) {\nelse (age >= 18) { | if (age < 18) {\nelse { } |\n\n## Chapter\
    \ Summary\n\n* Selection is a control structure that allows the computer to execute\
    \ one group of statements and skip another group of statements.\n* An if statement\
    \ is a selection statement that begins with the JavaScript if.\n* An if statement\
    \ must have a condition in parentheses. The parentheses contain code to compare\
    \ two values.\n* There are six comparison operators in JavaScript: equal to (==),\
    \ not equal to (!), less than (<), less than or equal to (<=), greater than (>),\
    \ greater than equal to (>=).\n* A switch statement is a selection statement that\
    \ begins with the JavaScript keyword switch and can be used instead of a long\
    \ set of if ... else if ... else statements.\n\n## Review Questions\n\n1. Write\
    \ an if statement to determine if the value in the variable age is greater than\
    \ 12.\n2. Write an if statement to check if the value in the variable x is not\
