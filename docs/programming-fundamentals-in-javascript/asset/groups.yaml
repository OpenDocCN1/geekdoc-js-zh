    # Example 1


    You work for a large construction company. Your boss has asked you to write a
    computer program that will read a list of window openings for a building and compute,
    and output the total cost of all the windows. The window openings are entered
    in inches with the width first and the height second. The cost of a window is
    computed by multiplying the area of the window in square feet by $35.


    | Input | Processing | Output |

    | --- | --- | --- |

    | A list of window openings For each window | For each window <br>- compute area
    in sq. ft.<br>- multiply area by $35<br>- add cost of this window to the total
    cost | total cost of all windows |

    | width in inches <br>- height in inches | |


    # Example 2


    You have been asked to write a program that will read from the keyboard the radius
    of a circle and will output to the monitor, diameter, circumference, and area
    of the circle.


    | Input | Processing | Output |

    | --- | --- | --- |'
