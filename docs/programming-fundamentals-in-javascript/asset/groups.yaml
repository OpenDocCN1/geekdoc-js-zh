    \ 吉赫或更高，这意味着 CPU 的单个核心设计为每秒完成 25 亿条指令。许多 CPU 拥有多个核心。每个核心都独立于其他核心进行计算。时钟频率为 2.5\
    \ 吉赫的四核 CPU 设计为每秒完成 100 亿次（4 * 2.5 吉赫）指令。这非常快。\n\n## 计算机分类\n\n计算机可以根据尺寸和主要用途进行分类。以下是一些常见的计算机类型。\n\
    \n- 31. 微型计算机或个人计算机（micro or personal computer）——设计为一次仅一人使用的计算机，例如智能手机、平板电脑、笔记本电脑或台式电脑。\n\
    \n- 32. 工作站（workstation）——强大的计算机，设计为一次一人使用，用于执行工程、科学和医学任务，例如设计飞机零件。\n\n- 33. 主机（mainframe）——非常强大的计算机，设计供多人同时使用，以执行业务或科学任务。\n\
    \n## 软件分类\n\n计算机硬件实际上只是一堆电流可以在良好定义的路径中流过的金属。如果没有指令，计算机硬件将什么也做不了。指令由计算机程序员编写，称为软件。计算机软件仅仅是计算机硬件执行的指令列表。计算机软件可以根据其用途进行分类。\n\
    \n- 34. 应用程序（Application）——人们用来完成特定任务的计算机软件，例如写信、平衡账目、看电影或玩游戏。应用程序示例包括 Microsoft\
    \ Word 和 Excel、Google Chrome 和 iTunes。\n\n- 35. 操作系统（Operating system）——管理硬件并将应用程序与硬件隔离的计算机软件，使应用程序不需要与硬件直接交互。计算机操作系统的示例包括\
    \ Microsoft Windows、Mac OS X、VMS、Linux、HP-UX 和 Solaris。\n\n##字符数据\n\n计算机内存中的一切内容都存储为一个数字或一组数字。一切。图片、歌曲、文本、指令，一切。每个文本符号都以数字的形式存储在计算机内存中。\n\
    \n- 36. ASCII——美国信息交换标准（American Standard Code for Information Interchange）的缩写；一种编码系统（本质上是一个表格），有128\
    \ 行，为每个英语字母和常用标点符号分配一个数字。见 asciitable.com\n\n- 37. Unicode——一种非常大的编码系统，包含 ASCII\
    \ 并为许多语言（如英语、葡萄牙语、希腊语、希伯来语、阿拉伯语和菲律宾语）的符号分配数字。见 unicode.org\n\n## 执行示例\n\n为了帮助你理解计算机部分是如何协同工作的，请考虑用户双击\
    \ Microsoft Word 文档文件（后缀名为 .docx 的文件）时发生了什么。\n\n1. 操作系统命令硬盘将 Microsoft Word 应用程序（MS\
