    ## Case Insensitive


    HTML 5 is not case sensitive. This means that <HTML> and <html> have the same
    meaning in HTML 5. However, the standard convention is to use all case for tags
    and attributes except for the DOCTYPE declaration, which is all uppercase. Most
    developers use lower case letters for at least two reasons:


    - Lower case letters are easier to read because they vary in size more than upper
    case letters.

    - If an HTML 5 document is ever converted to XHTML, which requires lower case
    tags and attributes, the conversion will be easier.


    ## Well Formed HTML


    An HTML document should be well formed which means:


    1. The document contains only the standard tags and attributes.

    2. Most opening tags have a matching closing tag. The opening tags that don''t
    require a closing tag are called void tags and include <meta>, <br> and <input>.

    3. Nested tags are ended before their enclosing tags are ended. For example:


    ```html

    <body>

    <p>Oregano is an important <i>culinary herb. It is used in Greek and Italian dishes
    especially tomato based sauces, fried vegetables, and grilled meats.</p>

    </body>

    ```


    You can check an HTML document to ensure that it is well formed by uploading it
    to the online validator at validator.w3.org.


    ## Required Elements


    Every HTML 5 document must start with a <!DOCTYPE> declaration and an opening
    <html> tag. Every HTML 5 document must have a head section and a body section,
    and the head section should have a <title> tag and a <meta> tag that states the
    document''s character encoding.


    ```html

    <!DOCTYPE HTML>

    <html lang="en-us">

    <head>

    <meta charset="utf-8">

    <title>Title</title>

    </head>

    <body>

    </body>

    ```


