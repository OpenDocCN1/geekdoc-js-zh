    # # Arithmetic Expressions


    The word computer comes from the ability these machines have to compute values
    or in other words to perform arithmetic. A programmer tells the computer to perform
    arithmetic by writing arithmetic expressions in a program. An arithmetic expression
    is composed of operands (numbers and variables) and operators (addition, multiplication,
    JavaScript, etc.).


    Arithmetic in JavaScript is written differently than it is written in algebra.
    For example in algebra, 3x means to multiply 3 times x. However, typing 3x in
    a JavaScript program will not cause the computer to multiply anything. Instead,
    it will simply cause an error. If you want multiplication in JavaScript, you must
    use the multiplication operator (*) like this: 3 * x.


    ![](img/7ea917145c99e19be973d71c03bf910b_71_0.png)


    # # Arithmetic Operators


    The five basic arithmetic operations that a computer can perform are multiplication,
    division, modulus, addition, and subtraction. As explained earlier in this chapter,
    a computer can also assign a value to a variable. A programmer making the computer
    perform these arithmetic operations by writing the corresponding operator (symbol)
    in a program. Here are the arithmetic operators available in JavaScript.


