    # JavaScript Arithmetic Operator Precedence Operator(s) Name(s) Precedence


    | Name(s) | Highest (evaluated first) |

    | --- | --- | --- |

    | () | parentheses | |

    | - | negation | |

    | * / % | multiplication, division, modulus | |

    | + | addition, subtraction | |

    | = | assignment | Lowest (evaluated last) |


    When an expression includes two operators with the same precedence, the computer
    evaluates them from left to right. For example, in the arithmetic expression x
    / y * c, the computer will first divide x by y then multiply that result by c.
    When writing an arithmetic expression, if you need a lower precedence operator
    evaluated before a higher precedence one, you can add parentheses to change the
    evaluation order. The computer will always evaluate arithmetic that is inside
    parentheses first regardless of the operator precedence.


