    \ Consider the function f with another x: f(x)=2x-1. We can substitute any number\
    \ for the x which completely determines the result of f. For example, substituting\
    \ 5 for x produces 9 as the result of the function: f(5)=2(5)-1=9. Functions in\
    \ a computer program work in a similar way, taking arguments and producing results.\n\
    \n# Chapter Outcomes\n\nBy the end of this chapter, you will:\n\n+   - Write functions\
