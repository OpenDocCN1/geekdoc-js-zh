    On all weekdays (Monday through Friday) that are not holidays, your program should
    output "Get Up! On all other days (weekends and holidays), your program should
    output "Sleep in." The three holidays that your program must check are January
    1 (New Year''s Day), July 4 (Independence Day), and December 25 (Christmas). You
    don''t need to include other holidays because they occur on a fixed date. Within
    your program, use this JavaScript code that will get the current month, day of
    the week from your customer''s clock:


    ```javascript

