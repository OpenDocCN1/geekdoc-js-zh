    \ 字节\n\n## 时钟频率\n\n一秒内的时钟是一个小型电路，它重复地产生脉冲式电信号，这意味着它的电压上升和下降，如图 6 所示。这种电信号每秒脉冲多次，CPU\
    \ 的单个核心设计为在每个脉冲结束时完成一条指令。时钟频率以赫兹（hertz）为单位。一个赫兹每秒一次循环。周期是从脉冲的任意一点到脉冲重复的地方。换句话说，一个周期在电压下降后立即开始，包括电压上升，并在电压再次下降时结束。以下是用于测量时钟频率的术语：\n\
    \n![](img/7ea917145c99e19be973d71c03bf910b_21_0.png)\n\n28. 赫兹（hertz）——频率单位，等于每秒一次循环\n\
