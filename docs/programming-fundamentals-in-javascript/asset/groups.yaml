    \n## Great Common Divisor\n\nThe greatest common divisor (gcd) of two non-zero\
    \ integers is the largest positive integer that divides both numbers without a\
    \ remainder. An efficient algorithm to compute the gcd was discovered by Euclid\
    \ and works like this. Given two integers, 102 and 18,\n\n- 1. 102 by 18 to get\
    \ a quotient of 5 and a remainder of 12,\n- 2. 18 by 12 to get a quotient of 1\
    \ and a remainder of 6,\n- 3. 12 by 6 to get a quotient of 2 and a remainder of\
    \ 0\n- 4. the remainder 0 means the greatest common divisor of 102 and 18 is 6.\n\
    \nEuclid's algorithm is written in the next example inside a JavaScript function\
    \ that has this header: function gcd(a, b). Notice from its header that the gcd\
    \ function requires two values as parameters. To call this a programmer must write\
    \ the name of the function, followed by an argument list with two arguments to\
    \ match the two, as shown in the testGCD function below.\n\n## Example 16\n\n\
    ```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>Greatest Common Divisor</title>\n</head>\n<script>\n// Input: No user\
    \ input\n* Processing: Determine the greatest common divisor of -24 and 472\n\
    * Output: The greatest common divisor\nfunction testGCD() {\n  var x = -24;\n\
    \  var y = 472;\n  var divisor = gcd(x, y);\n  document.getElementById('outputDiv').innerHTML\
    \ = divisor;\n}\n// Finds and returns the greatest common\n// divisor of two integers\
    \ a and b.\nfunction gcd(a, b) {\n// Ensure a and b are not negative.\n  a = Math.abs(a);\n\
    \  b = Math.abs(b);\n// Ensure a is greater than or equal to b.\nif (a < b) {\n\
    \  var swap = a;\n  a = b;\n  b = swap;\n}\n// Loop until the greatest common\
    \ divisor is found.\ndo {\n  var r = a % b;\n  a = b;\n  b = r;\n} while (b !=\
    \ 0);\n  return a;\n}\n```\n\n## Desk Check x y divisor\n\n| r | a | b | swap\
