    to complete 10 billion (4 * 2.5 gigahertz) instructions per second. This is very
    fast.


    # Classes of Computers


    Computers can be classified according to their size and primary purpose. Here
    are some common computer classes.


    +   31. micro or personal computer – a computer designed to be used by only one
    person at a time, such as a smart phone, tablet computer, laptop computer, or
    desktop computer.


    +   32. workstation – a powerful computer designed to be used by one person at
    a time and used to perform engineering, scientific, and medical tasks such as
    designing airplane parts.


    +   33. mainframe – a very powerful computer designed to be used by many people
    at the same time to perform business or scientific tasks.


    # Categories of Software'
  - '[PAGE 23]


    Computer hardware is really just a bunch of metal that electricity can flow through
    in well-defined paths. Computer hardware will not do anything without some instructions.
    The instructions are written by a computer programmer and are called software.
    Computer software is simply a list of instructions that the computer hardware
    executes. Computer software can be classified according to its purpose.


    +   34. Application – computer software that someone uses to accomplish a specific
    task, such as write a letter, balance an account, watch a movie, or play a game.
    Examples of applications include Microsoft Word and Excel, Google Chrome, and
    iTunes.


    +   35. Operating system – computer software that manages the hardware and isolates
    the applications from the hardware so that the applications do not have to interact
    directly with the hardware. Examples of computer operating systems include Microsoft
    Windows, Mac OS X, VMS, Linux, HP-UX, and Solaris.


    # Character Data


    Everything in a computer’s memory is stored as a number or set of numbers. Everything.
    Pictures, songs, text, instructions, everything. Each text symbol is stored in
    the computer’s memory as a number.


    +   36. ASCII – an acronym for American Standard Code for Information Interchange;
    a coding system (essentially a table) with 128 rows that assigns a number to each
    English letter and common punctuation symbol. See asciitable.com'
  - "[PAGE 24]\n\n37. Unicode – a very large coding system that includes ASCII and\
    \ assigns a number to symbols from many languages, such as English, Portuguese,\
    \ Greek, Hebrew, Arabic, and Tagalog. See unicode.org\n\n# Execution Example\n\
    \nTo help you understand how the parts of a computer work together, consider what\
    \ happens when a user double clicks on a Microsoft Word document file (a file\
    \ with a filename suffix of .docx).\n\n+   1. The operating system commands the\
    \ hard drive to copy the Microsoft Word Application (MS Word) into main memory.\n\
    2. The hard drive copies MS Word over a bus into main memory.\n3. After MS Word\
    \ is in main memory, the operating system executes MS Word and sends a command\
    \ to MS Word telling it to open the document that the user double clicked.\n4.\
    \ MS Word requests the operating system to read the document from the hard drive\
    \ and to place it in main memory.\n5. The operating system commands the hard drive\
    \ to copy the document file into main memory.\n6. The hard drive copies the document\
    \ file over a bus into main memory.\n7. For each character that is in the document\n\
    \   a. MS Word reads the character's Unicode number from main memory and requests\
    \ the operating system to draw that character in a window.\n   b. The operating\
    \ system finds the Unicode number and its corresponding symbol in a table and\
    \ draws the symbol.\n\n# Review Questions"
