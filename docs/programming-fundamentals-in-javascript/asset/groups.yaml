    6. The following if statement contains an error. Rewrite it so that it is correct.\
    \ Assume the variable age already exists and holds a valid number.\n`if (age >=\
    \ 30); {`\n7. The following if statement contains an error. Rewrite it so that\
    \ it is correct. Assume the variable age already exists and holds a valid number.\n\
    `if (age <= 55) {`\n8. Given the following JavaScript code, what will the computer\
