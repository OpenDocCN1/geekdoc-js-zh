    \ squarearea(length) {\n  var area = length * length;\n  return area;\n}\n\nfunction\
    \ rectanglearea(width, length) {\n  var area = width * length;\n  return area;\n\
    }\n```\n\n# ## Advantages of Functions\n\nThere are many advantages to writing\
    \ statements in a function instead of outside of all functions, including\n\n\
    +   1. Control of execution - JavaScript statements that are inside an HTML script\
