  mdcn: "\n\n## 定义表格\n\n| 输入 | 处理 | 输出 |\n|---|---|---|\n| | | |\n\n## 算法\n\n**算法**简单来说就是执行某些任务的步骤列表。食谱就是算法的一个例子，因为食谱列出了准备某些食物所需的步骤。这里有一份来自\
    \ allrecipes.com 的制作巧克力奇奇的食谱。请注意，这些说明是食谱与算法相似之处。\n\n## 配料\n\n- 1 杯黄油，已软化\n- 1\
    \ 杯白糖\n- 1 杯压紧的红糖\n- 2 个鸡蛋\n- 2 茶匙香草精\n- 3 杯通用面粉\n- 1 茶匙小苏打\n- 2 茶匙热水\n- 1/2 茶匙盐\n\
    - 2 杯半甜巧克力豆\n- 1 杯切碎的核桃\n\n## 制作步骤\n\n- 1. 将烤箱预热至 华氏 350 度（等约 175 摄氏度）。\n- 2.\
    \ 将黄油、白糖和红糖一起搅拌直到光滑。\n- 3. 逐个打入鸡蛋。\n- 4. 拌入香草。\n- 5. 将小苏打在热水中溶解。与盐一同加入面团。\n- 6.\
    \ 拌入面粉、巧克力豆和坚果。\n- 7. 用大勺一勺勺滴入未涂油的烤盘中。\n- 8. 在预热的烤箱中烘约约10 分钟，直到边缘变成金黄色。\n\n###\
    \ 示例 3\n\n这是一个用于从测试分数列表中计算平均分的小算法。请注意，它仅仅是执行该计算的逐步过程。一个大型计算机程序包含许多算法。\n\n- 1.\
    \ 将 *sum* 设置为 0\n- 2. 获取学生人数\n- 3. 对于每个学生\n    - a. 获取学生的测试分数\n    - b. 将学生的分数加到\
    \ *sum* 中\n- 4. 将 *sum* 除以学生人数\n\n### 示例 4\n\n写一个关于刷牙的算法。\n\n在你编写的算法中，步骤的顺序重要吗？是否存在某些步骤的顺序并不重要？\n\
    \n## 计算机程序\n\n计算机程序由数据和指令组成。计算机将数据临时存储在主内存中。它还将数据更永久地存储在硬盘、闪存或数字多功能光盘（DVD）上的文件中。计算机程序中的指令就像算法中的步骤。在像\
    \ JavaScript 这样的语言中，指令被称为语句（statements）。一个单一的语句等同于算法中的一个步骤或段落中的一个句子。语句告诉计算机如何处理数据。\n\
    \n## 计算机操作\n\n计算机可以执行七种基本操作，我们在编写计算机程序中的算法时，可以使用其中所有的所有操作。计算机可以执行以下操作：\n\n- 接收数据（输入）\n\
    \  输入设备：键盘、鼠标、麦克风、触摸屏、温度传感器、硬盘、优存器等。\n- 写出数据（输出）\n  输出设备：显示器、打印机、扬声器、灯、硬盘、优存器等。\n\
