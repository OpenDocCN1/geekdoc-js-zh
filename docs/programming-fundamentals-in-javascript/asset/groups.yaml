    \ 3.8. There is a value stored at index 3 and a value stored at index 4 but nothing\n\
    \n# Template\n\n```\narrayName[index]\n```\n\n# Example 8\n\n```\nvar data = new\
    \ Array(6);\ndata[0] = -4.3;\ndata[1] =\nparseFloat(document.getElementById('input1').value);\n\
    \  document.getElementById('output').innerHTML = data[4];\n  if (data[5] > 6.3)\
    \ {\n    document.getElementById('error').innerHTML =\n    'Data value is too\
    \ high!';\n  }\n```\n\n# Example 9\n\nWrite a statement to store the number 72.6\
    \ in an array named ranges at location 3.\n\n## Filling an Array\n\nIt is often\
    \ desirable to have the computer initialize all the elements in an array to some\
    \ value (usually zero). We do this by writing a statement that assigns a value\
    \ to one element in the array, and then put that assignment statement inside a\
    \ loop. If the array has n elements in it, then the loop causes the computer to\
    \ repeat the assignment statement n times, once for each element in the array.\n\
    \nExample 10 contains a function that fills an array with some value. In order\
    \ for the code in the function to be executed, a programmer must write code to\
    \ call the function similar to this:\n\n```\nvar list = new Array(8);\nfill(list,\
