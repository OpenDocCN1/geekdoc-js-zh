    ## 章节总结


    - 在 JavaScript 中使用变量之前，必须先声明它。要声明变量，请编写 `var` 关键字并后跟变量名。

    - 使用赋值运算符 (`=`) 给变量赋值。

    - 在 JavaScript 程序中，使用这些运算符：`*`, `/`, `%`, `+`, `-` 进行乘法、取余数、加法和减法。

    - 赋值运算符（`*=`, `/=`, `+=`, `-=`）使用变量当前值进行算术并将结果存储回该变量的快捷方式。

    - 要给变量的值加 1，可以使用自增运算符 (`++`)。可以使用自减运算符 (`--`) 从变量的值中减 1。

    - 每个算术运算符都有优先级。在 JavaScript 中编写公式时，理解优先级至关重要。

    - 要编写计算机执行更高级的算术（如幂、平方根和四舍五入），必须使用 `Math` 对象中的函数。


