    # Chapter 6. Selection


    In order for computer programs to be useful, a computer must be able to make decisions.
    The computer makes decisions by evaluating a condition and if the condition is
    true, selecting one set of statements to execute. If the condition evaluates to
    false, then the computer selects a different set of statements to execute. This
    decision making ability is known as selection because the computer is selecting
    either group of statements or another group of statements to execute. A selection
    statement is also called an if statement because most programming languages it
    starts with the keyword if.


    # Chapter Outcomes


    By the end of this chapter, you will be able to read and write:


    +   * if statements with a single condition

    * nested if statements

    * a set of if...else if...else statements

    * switch statements which can be used instead of a set of if...else if...else
    statements


    # Relational Operators


    A selection statement always has a condition, which is the test the computer uses
    to select one set of statements or the other. A condition always evaluates to
    true or false. Any expression that evaluates to true or false is called a boolean
    expression named after the British George Boole. There are six JavaScript relational
    operators, which test the relation between two values and yield only true or false.


    | Operator | Name | Example |

    | --- | --- | --- |

    | < | less than | if (i < 3) |

    | > | greater than | if (x > y) |

    | <= | less than or equal to | if (row <= end) |'
