    # Confusing the concepts of return and output


    Return means to return a value to the call point of a function. This is entirely
    internal to a program, and the user will not see anything of a return statement.
    To return a result from a JavaScript function, use the keyword return.


    Output means to show a value to the user. In JavaScript output is done by calling
    alert, document.write, or assigning a value to the innerHTML of a div (document.getElementById(''resultdiv'').innerHTML
    = x);


    # Chapter Summary


    +   - A module is a part of a program. The term module can refer to a very large
    part of a program, including many files and functions, or it can refer to a small
    part of a program as a single function.

    - A function is the smallest part of a program that performs actions and is sometimes
    called a method. A well written is a reusable part of a program that performs
    one task as calculating the average of numbers or the area of a triangle.

    - A function has a header and a body. The header is also known as the signature.

    - The header of a function includes the function''s parameters. Each parameter
    is a variable.

    - A call point of a function is a line of code in a program where that function
    is called or invoked.

    - The body of a function includes all the statements to perform a single task
    such as a calculation. The body normally ends with a return statement to return
    a calculated value to the call point.

    - A return statement causes a computer to stop executing the current function,
    to return a value to the call point of the current function, and to resume executing
    the code at after the call point.

    - To call a function, write the name followed by the arguments that the function
    will need to perform its task.

    - An argument is the value or variable that is passed from the call point into
    a function.

    - To store the value returned from a function write a variable name and the assignment
    operator (=) at the call point of the function.


