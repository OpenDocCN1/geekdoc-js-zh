  - "[PAGE 173]\n\nFigure 30 demonstrates what a computer does when it calls a function.\
    \ Within a program, a line of code that calls a function is known as a call point.\
    \ As shown in the diagram, the computer first copies the value of argument at\
    \ the call point into the corresponding parameter. The computer then executes\
    \ the code in the body of the called function. Most functions end with a return\
    \ statement. When the computer executes a return statement in the called function,\
    \ the return statement causes the computer to do three things.\n\n+   1. The return\
    \ statement calls the computer to return a value, which is often a number, to\
    \ the call point. If the call point includes a variable and the assignment operator\
    \ (=), the computer will store the returned value in that variable.\n2. The return\
    \ statement calls the computer to terminate the called function or in other words\
    \ to stop executing the code in the body of the called function.\n3. The return\
    \ statement may cause the computer to resume executing code or after the call\
    \ point.\n\n```\nvar x = funcName(arg1, arg2, ... argN);\n\nfunction funcName(param1,\
    \ param2, ... paramN) {\n  statements;\n  return result;\n}\n```\n\n> **Figure\
    \ 30**: Demonstration of a function call, showing how the arguments are assigned\
    \ to the parameters and showing that when the computer is finished executing the\
    \ function, the result is returned from the function to the call point.\n\n# #\
    \ Variable Scope\n\nThe scope of a variable determines how long that variable\
    \ exists and where it can be used. Within a JavaScript program, there are two\
    \ categories of scope: local and global. A **local variable** is declared inside\
    \ a function, exists as long as its containing function is executing, and can\
    \ be used within its containing function only. A **global variable** is declared\
    \ outside all functions, for as long as its containing file is loaded in the computer's\
    \ memory, and can be used within all functions in its containing file. Parameters\
    \ are local variables because they are declared within a function, specifically\
    \ within a function's header.\n\n# JavaScript Variable Scope\n\n| Local | Global\
    \ |\n|---|---||\n| Where to Declare | Inside a function | Outside all functions\
    \ |"
- md: "\n## JavaScript Variable Scope\n\n| Local | Global |\n| --- | --- |\n| Owner\
    \ | The function where the variable is declared | The JavaScript program, or stated\
    \ more accurately, the HTML file that contains the script tag where it is declared\
    \ |\n| Lifetime | Only long as its containing function is executing | As long\
    \ as its containing HTML file is loaded in the computer's memory |\n| Usable |\
    \ Only inside the function where it is declared | In all functions in the JavaScript\
    \ program |\n\nExample 9 contains global and local variables. The variable attempts\
    \ is global because it is declared outside of all functions. Because it is a global\
    \ variable, the code in the body of all functions may use the variable attempts.\
    \ Within the function squareArea, there are two local variables named length and\
    \ area. Within the function rectangleArea, there are three local variables named\
    \ width and area. A programmer can declare two variables with the same name as\
    \ long as they are declared in different functions. In example 9, both of the\
    \ functions squareArea and rectangleArea contain a local variable named length\
    \ and area. All four of these variables are entirely separate and do not conflict\
    \ with each other in any way; the scope of each variable is within the function\
    \ it is declared.\n\n## Example 9\n\n```\nvar attempts;\n\nfunction squarearea(length)\
    \ {\n  var area = length * length;\n  return area;\n}\n\nfunction rectanglearea(width,\
    \ length) {\n  var area = width * length;\n  return area;\n}\n```\n\n## Advantages\
    \ of Functions\n\nThere are many advantages to writing statements in a function\
    \ instead of outside of all functions, including:\n\n- 1. Control of execution\
    \ - JavaScript statements that are inside an HTML script tag but outside of all\
    \ functions are executed immediately when a document is read into memory by a\
    \ browser. Statements that are inside a function are not executed until a function\
    \ is called, which gives the programmer control over when those statements are\
    \ executed.\n- 2. Code reuse - After a function is written it can be reused again\
    \ and again by calling it from multiple locations in a program.\n- 3. Less code\
    \ - Because a programmer can reuse code, he does not have to write as much code.\n\
    - 4. Fewer coding mistakes - writing less code will naturally lead to fewer mistakes\
    \ because there is simply less code to contain the mistakes.\n- 5. Better organization\n\
    - 6. Easier to read and understand\n- 7. Easier to debug\n- 8. Faster execution\
    \ - Because a program with well-written functions contains less code, that program\
    \ will very likely load faster and execute faster.\n- 9. Variable name reuse -\
    \ Because variables declared inside a function are local to that function only,\
    \ a programmer can reuse variable names in different functions.\n\n## Pseudo Random\
    \ Integer\n\nThe following code example shows how to obtain a pseudo random integer\
    \ that is in the range min inclusive to max exclusive, in other words in the range\
    \ [min, max]. Notice that this code calls both the random and floor functions\
    \ from the Math object.\n\n## Example 10\n\n```\nvar r = min + Math.floor(Math.random()\
    \ * (max - min));\n```\n\n## Code Reuse\n\nThe most reusable functions are ones\
    \ that perform only calculations and do not perform input and output. Chapter\
    \ 6 contains code to determine if an integer is even or odd. Examples 11 and 12\
    \ contain the example code from chapter six: However, in both 11 and 12, the example\
    \ code is split into two functions: doOutput and setIs. The first function, getInputInput,\
    \ gets the user input, calls the second function, and displays the result to the\
    \ user. The first function is certainly useful in this program but not reusable\
    \ in another program because it requires a field with an id of \"number\" and\
    \ a div with an id of \"one\". The second function, setIs, does only one function\
    \ to determine if an integer is even or odd. Because the second function does\
    \ only calculations (it does not get user input nor display results to the user),\
    \ the second function is reusable in other programs. The second function can be\
    \ used in any program that determines if an integer is even or odd regardless\
    \ of where the input comes from, such as a user or a file or anywhere else.\n\n\
    ## Example 11\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Is Even</title>\n<script>\n/*\n* Input: An integer\n* Processing:\
    \ Determine if the integer is even or not\n* Output: A message stating if the\
    \ integer is even or not\n*/\nfunction doInputOutput() {\n  var number = parseInt(document.getElementById('numberInputBox').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ =\n    number + ' is even: ' + result;\n}\n```\n\nDesk Check\n| number | result\
    \ |\n| --- | --- |\n| 8 | |\n\n```javascript\n// Returns true if value is an even\n\
    // integer; otherwise returns false.\nfunction isEven(value) {\n    if ((value\
    \ % 2) == 0) {\n        return true;\n    }\n    else {\n        return false;\n\
    \    }\n}\n```\n\n| value | value % 2 | return |\n| --- | --- | --- |\n| | | |\n\
    \n```html\n</script>\n</head>\n<body>\nPlease enter an integer: <input type=\"\
    text\" id=\"numberInputBox\">\n<button type=\"button\" onclick=\"doInputOutput()\"\
    >Is Even?</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\nBecause\
    \ the isEven function returns a boolean value, you can write it without the statement\
    \ statement. Eliminating the statement makes the function easier to one possible\
    \ path instead of two.\n\n## Example 12\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Is Even</title>\n</head>\n<script>\n\
    /*\n* Input: An integer\n* Processing: Determine if the integer is even or not\n\
    * Output: A message stating if the integer is even or not\n*/\nfunction doInputOutput()\
    \ {\n  var number = parseInt(document.getElementById('numberInputBox').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ =\n    number + ' is even: ' + result;\n}\n```\n\n```javascript\n// Returns\
    \ true if value is an even\n// integer; otherwise returns false.\nfunction isEven(value)\
    \ {\n    if ((value % 2) == 0) {\n        return true;\n    }\n    else {\n  \
    \      return false;\n    }\n}\n```\n\n| value | value % 2 | return |\n| --- |\
    \ --- | --- |\n| | | |\n\n```html\n</script>\n</head>\n<body>\nPlease enter an\
    \ integer: <input type=\"text\" id=\"numberInputBox\">\n<button type=\"button\"\
    \ onclick=\"doInputOutput()\">Is Even?</button>\n<div id=\"outputDiv\"></div>\n\
    </body>\n</html>\n```\n\n## Area of a Triangle\n\nIf we know the sides of a triangle\
    \ as shown in figure 31, we can compute the area of that triangle using Heron's\
    \ formula which is a, b, and c are the sides of the triangle and s is the semi-perimeter\
    \ of the triangle defined by:\n\n```javascript\ns = (a+b+c)/2\narea = Math.sqrt(s*(s-a)*(s-b)*(s-c))\n\
    ```\n\n## Example 13\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>Triangle Area</title>\n</head>\n<script>\n/*\n\
    * Input: No input\n* Processing: Compute the area of the triangle\n* with side\
    \ lengths 4, 2, and 5\n* Output: The area of the triangle\n */\nfunction testTriangle()\
    \ {\n  var r = triangleArea(4, 2, 5);\n  document.getElementById('outputDiv').innerHTML\
    \ = r;\n}\n```\n\n```javascript\n// Computes and returns the area of\n// triangle\
    \ with lengths a, b, and c.\nfunction triangleArea(a, b, c) {\n  var s = (a+b+c)/2;\n\
    \  var area = Math.sqrt(s*(s-a)*(s-b)*(s-c));\n  return area;\n}\n```\n\n## Surface\
    \ Area of a Pyramid\n\nImagine designing one of the great pyramids. The stones\
    \ on the inside of the pyramids are very rough and basically filler. The stones\
    \ on the outside are finished smooth to reflect sunlight. If you were writing\
    \ the software to design a pyramid, your software would have to compute the surface\
    \ area of a pyramid so the builders would know how much finished stone they need\
    \ to cover the outside.\n\nFigure 32 shows a regular pyramid (the base is a square,\
    \ and all four sides are the same size) with edge length e, height h, and base\
    \ b. Since it is a regular pyramid, to compute the surface area your software\
    \ could compute the area of one of the pyramid's triangular faces and multiply\
    \ that by 4. If the builder of a regular pyramid specified the base length and\
    \ the height, then your software could use this formula for computing the edge\
    \ length:\n\n```javascript\ne = \\sqrt{(b^2/2) + h^2}\n```\n\n## Example 14\n\n\
    ```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>Surface Area of a Pyramid</title>\n</head>\n<script>\n/*\n* Input: No\
    \ user input\n* Processing: Compute the surface area of the triangular faces of\
    \ a regular pyramid\n* that has base 8 and height 7.\n* Output: The surface area\
    \ of the pyramid\n */\nfunction testPyramid() {\n  var b = 8;\n  var h = 7;\n\
    \  var e = Math.sqrt((Math.pow(b, 2)/2) + Math.pow(h, 2));\n  // simplified logic\
    \ for example\n  var area = triangleArea(e, e, b);\n  var surfaceArea = area *\
    \ 4;\n  document.getElementById('outputDiv').innerHTML = surfaceArea;\n}\n```\n"
  mdcn: "\n\n## JavaScript 变量作用域\n\n| 局部 (Local) | 全局 (Global) |\n| --- | --- |\n\
    | 所有者 | 声明变量的函数 | JavaScript 程序，或者更准确地说，包含声明该变量的 script 标签的 HTML 文件 |\n| 生命周期\
    \ | 仅在其包含函数执行时有效 | 只要包含它的 HTML 文件加载到计算机内存中就有效 |\n| 可用 | 仅在声明它的函数内部可用 | JavaScript\
    \ 程序中的所有函数均可用 |\n\n示例 9 包含了全局变量和局部变量。`attempts` 变量是全局的，因为它在所有函数之外声明。由于它是一个全局变量，所有函数体中的代码都可以使用\
    \ `attempts` 变量。在 `squareArea` 函数中，有两个名为 `length` 和 `area` 的局部变量。在 `rectangleArea`\
    \ 函数中，有三个名为 `width` 和 `area` 的局部变量。程序员可以声明两个同名的变量，只要它们在不同的函数中声明即可。在示例 9 中，`squareArea`\
    \ 和 `rectangleArea` 两个函数都包含名为 `length` 和 `area` 的局部变量。这四个变量完全相互独立的，不会以任何方式相互冲突；每个变量的作用域都在其声明的函数内部。\n\
    \n## 示例 9\n\n```\nvar attempts;\n\nfunction squarearea(length) {\n  var area =\
    \ length * length;\n  return area;\n}\n\nfunction rectanglearea(width, length)\
    \ {\n  var area = width * length;\n  return area;\n}\n```\n\n## 函数的优点\n\n在函数内部编写语句而不是在所有函数之外有很多优点，包括：\n\
    \n- 1. 执行控制 - 位于 HTML script 标签内部但在所有函数之外的 JavaScript 语句会在浏览器将文档读入内存时立即执行。函数内部的语句在调用函数之前不会执行，这让程序员可以控制这些语句的执行时机。\n\
    - 2. 代码复用 - 函数编写后，可以通过从程序中的多个位置调用它来反复复用。\n- 3. 代码量更少 - 因为程序员可以复用代码，所以不需要编写那么多的代码。\n\
    - 4. 编码错误更少 - 编写的代码少自然会导致错误减少，因为包含错误的代码本身变少了。\n- 5. 更好的组织结构\n- 6. 更易阅读和理解\n- 7.\
    \ 更易调试\n- 8. 运行速度更快 - 因为编写良好的函数包含的代码更少，该程序很可能加载更快、执行更快。\n- 9. 变量名复用 - 因为函数内部声明的变量仅局部于该函数，程序员可以在不同函数中复用变量名。\n\
    \n## 随机整数\n\n下面的代码示例展示了如何获取 `min`（包含）到 `max`（不包含）范围内的伪随机整数，换句话在 [min, max] 范围内。注意这段代码调用了\
    \ Math 对象中的 `random` 和 `floor` 函数。\n\n## 示例 10\n\n```\nvar r = min + Math.floor(Math.random()\
    \ * (max - min));\n```\n\n## 代码复用\n\n最具复用性的函数是那些只执行计算而不执行输入输出的函数。第6章包含了判断整数是偶还是奇的代码。示例\
