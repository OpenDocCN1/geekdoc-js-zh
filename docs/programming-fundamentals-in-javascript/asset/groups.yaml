    使其不使用 `*=` 运算符。提示：注意运算符优先级。


    ## 编程作业


    1. 编写一个定义表和一个 JavaScript 程序来计算并输出铁罐罐的体积。提示：使用本章给出的公式和 JavaScript 代码计算圆柱的体积。你的程序应正确处理实数。


