    ## 第5 章 变量与算术


    计算机程序由数据和指令组成。数据可以临时存储在计算机内存中，也可以更永久地存储在计算机的硬盘、DVD 或 U 盘上。当数据在计算机内存中时，它存储在变量中。**变量**具有名称、类型、值和作用域。变量一词源于变量的值可以改变或变化。


    ### 章节目标


    在本章结束时，你将能够：


    - * 声明变量并为该变量赋值。

    - 编写 JavaScript 代码将值从一个变量复制到另一个变量。

    - 编写代码执行计算并将结果存储在变量中。

    - 在算术表达式中使用递增和减运算符。

    - 使用 Math 对象中的数学函数。


    ### 声明变量


    在计算机程序中使用变量之前，你必须声明该变量。声明变量告诉计算机在主内存中为该变量留出空间。在 JavaScript 程序中声明变量，只需编写关键字和变量即可。变量名必须以字母、下划线或美元符号开头。变量名不能包含空格。变量名应该是有意义的，并描述变量存储的内容。变量具有名称、类型、值和作用域。


    ### 模板


    ```

    var name, name2, name3...

    ```


    ### 示例 1


    声明三个名为 x、balance 和 interest 的变量。


    ```

    var x;

    var balance, interest;

    ```


    ### 示例 2


    声明两个名为 roomNumber 和 occupants 的变量。


    ![](img/7ea917145c99e19be973d71c03bf910b_67_0)


    ### 变量类型


    每个变量都有一个类型，以便计算机知道可以存储什么类型的数据以及对变量执行哪些操作。变量的类型由存储在其中的数据决定。JavaScript 变量可以是以下类型之一。


    ### JavaScript 类型


    | 类型 | 目的 | 示例 |

    | --- | --- | --- |

    | 布尔 | 存储真或假 | true |

    | 数字 | 有或无小数点的数字 | 74.3 |

    | 字符串 | 文本字符串 | "San Diego" |

    | 函数 | 使用关键字创建程序部分 | function () { return 27; } |

    | 对象 | 如 Array 或 Date 等对象 | {name:"Sam", phone:"17"}


    ## 给变量赋值


    程序员可以在 JavaScript 程序的任何点使用赋值运算符（简单的等号 =）为变量赋值。赋值运算符从右向左工作，复制等号右侧的值并存储到等号左侧的变量或位置中。


    ### 模板


    ```

    name = value;

    ```


    ### 示例 3


    ```

    var price, discRate;

    var title;


    price = 12.95;

    discRate = 0.25;

    title = "A Poor wayfering Man of Grief";

    ```


    注意要在变量中存储文本，必须给文本加上引号（双引号或单引号）。例如：


    ```

    title = "A Poor wayfering Man of Grief";

    ```


    在 JavaScript 中，所有变量的默认值为 undefined。如果程序员没有使用等号 (=)为变量赋值，该变量的值将是 undefined，而不是
    0 或 null，而是字面上的 undefined。显然，undefined 不是数字，不能成功地作为计算的一部分。为了确保所有变量都有 undefined
    以外的值，JavaScript 语言允许程序员在声明变量时为其赋值。这有时被称为初始化变量，许多程序员都喜欢它，因为它节省了程序员多写一行代码的时间。


