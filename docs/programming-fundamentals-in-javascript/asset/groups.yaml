    \ 17 | 11 次及以上 | $5.00 |\n| 18 - 54 | 0 - 10 | $10.00 |\n| 18 - 54 | 11 次及以上 |\
    \ $8.00 |\n| 55 岁以上 | 0 - 10 | $8.00 |\n| 55 岁以上 | 11 次及以上 | $6.00 |\n\n这也可以使用嵌套的\
    \ if 语句解决，如下一个示例所示。\n\n## 示例 12\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\"\
    >\n<head>\n<meta charset=\"utf-8\">\n<title>Ticket Price</title>\n<script>\n/*\
    \ 输入：一个人的年龄以及该人\n * 参加的次数\n * 处理：确定向该人员收取的\n * 门票费用\n */\nfunction ticketPrice()\
    \ {\n  var age =\n  parseInt(document.getElementById('ageBox').value);\n  var\
    \ gamesAttended =\n  parseInt(document.getElementById('gamesBox').value);\n  var\
    \ price;\n  if (age < 18) {\n    if (gamesAttended < 6)\n      price = 8.0;\n\
    \    else if (gamesAttended < 11)\n      price = 6.0;\n    else\n      price =\
    \ 5.0;\n  } else if (age < 55) {\n    if (gamesAttended < 11)\n      price = 10.0;\n\
    \    else\n      price = 8.0;\n  } else {\n    if (gamesAttended < 11)\n     \
    \ price = 8.0;\n    else\n      price = 6.0;\n  }\n}\ndocument.getElementById('priceDiv').innerHTML\
    \ = price;\n</script>\n</head>\n<body>\nAge: <input type=\"text\" id=\"ageBox\"\
    \ size=\"3\"><br>\nNumber of games attended: <input type=\"text\" id=\"gamesBox\"\
    \ size=\"3\"><br>\n<button type=\"button\" onclick=\"ticketPrice()\">Ticket Price</button>\n\
    <div id=\"priceDiv\"></</div>>\n</body>\n</html>\n```\n\n## 手算检查\n\n| 年龄 参加场次\
    \ | 价格 |\n|---|---|\n| 38 | 10.0 |\n\n嵌套的 if 语句有时会有点棘手，如下例所示，它有两个 if 语句但只有一个 else。根据\
    \ JavaScript 的规则，else 只配有一个语句。这意味着在下面的示例中，如果第一个条件 (x < 2) 为真而第二个条件 (y > 8) 为假，计算机将不会将\
    \ message 改为 \"Hello\" 或 \"Goodbye\"。在这种情况下，计算机将显示 \"wave\"。\n\n##示例 13\n\n```\n\
    var message = 'wave';\nif (x < 2) {\n  if (y > 8) {\n    message = 'Hello';\n\
    \  }\n} else {\n  message = 'Goodbye';\n}\ndocument.getElementById('outputDiv').innerHTML\
    \ = message;\n```\n\n## 手算检查\n\n## 常见错误\n\n### 忘记括号\n| 错误 | 正确 |\n|---|---|\n\
    | if x < 7 { | if (x < 7) { |\n\n### 使用赋值代替比较\n| 错误 | 正确 |\n|---|---|\n| if (age\
    \ = 18) { | if (age == 18) { |\n\n### 在 if 语句末尾放置分号\n| 错误 | 正确 |\n|---|---|\n\
    | if (growth > 500); { | if (growth > 500) { |\n\n### 在 else 语句末尾放置分号\n| 错误 |\
    \ 正确 |\n|---|---|\n| if (growth > 500) } else; { | if (growth > 500) } else {\
    \ |\n\n### if 语句中有多个语句时忘记使用大括号\n| 错误 | 正确 |\n|---|---|\n| if (bal > 500)\nintr\
    \ = 0.03;\nbal += intr; | if (bal > 500) {\n  intr = 0.03;\n  bal += intr;\n}\
    \ |\n\n## 手算检查\n\n| x | message |\n|---|---|\n| 1 | 5 |\n| x | y |\n\n## 在 else\
    \ 语句中添加条件\n| 错误 | 正确 |\n|---|---|\n| if (gender == 'F') {\nelse (gender == 'M')\
    \ { | if (gender == 'F') {\nelse { | |\n\n## 不必要的比较\n| 错误 | 正确 |\n|---|---|\n\
    | if (age < 18) {\nelse (age >= 18) { | if (age < 18) {\nelse { } |\n\n## 本章总结\n\
    \n* 选择结构是一种控制结构，允许计算机执行一组语句并跳过另一组语句。\n* if 语句是以 JavaScript 关键字 if 开头的选择语句。\n*\
    \ if 语句必须在括号中有一个条件。括号内包含比较两个值的代码。\n* JavaScript 有六种比较运算符：等于 (==)、不等于 (!)、小于 (<)、小于等于\
    \ (<=)、大于 (>)、大于等于 (>=)。\n* switch 语句是以 JavaScript 关键字 switch 开头的选择语句，可以代替长长的\
    \ if ... else if ... else 语句。\n\n## 复习题\n\n1. 编写一个 if 语句判断变量 age 值是否大于 12。\n2.\
