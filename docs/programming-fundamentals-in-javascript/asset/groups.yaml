- md: "\n## Chapter 6. Selection\n\nIn order for computer programs to be useful, a\
    \ computer must be able to make decisions. The computer makes decisions by evaluating\
    \ a condition and if the condition is true, selecting one set of statements to\
    \ execute. If the condition evaluates to false, then the computer selects a different\
    \ set of statements to execute. This decision making ability is known as selection\
    \ because the computer is selecting either group of statements or another group\
    \ of statements to execute. A selection statement is also called an if statement\
    \ because most programming languages it starts with the keyword if.\n\n## Chapter\
    \ Outcomes\n\nBy the end of this chapter, you will be able to read and write:\n\
    \n- *if* statements with a single condition\n- nested if statements\n- a set of\
    \ if...else if...else statements\n- switch statements which can be used instead\
    \ of a set of if...else if...else statements\n\n## Relational Operators\n\nA selection\
    \ statement always has a condition, which is the test the computer uses to select\
    \ one set of statements or the other. A condition always evaluates to true or\
    \ false. Any expression that evaluates to true or false is called a boolean expression\
    \ named after the British George Boole. There are six JavaScript relational operators,\
    \ which test the relation between two values and yield only true or false.\n\n\
    | Operator | Name | Example |\n| --- | --- | --- |\n| < | less than | if (i <\
    \ 3) |\n| > | greater than | if (x > y) |\n| <= | less than or equal to | if (row\
    \ <= end) |\n\n## JavaScript Relational Operators\n\n| Operator | Name | Example\
    \ |\n| --- | --- | --- |\n| >= | greater than or equal to | if (age >= 8) |\n\
    | == | equal to | if (col == last) |\n| != | not equal to | if (col != last) |\n\
    \nThe relational operators are used inside the condition of selection statements.\
    \ Shown below are the different forms of selection statements available in JavaScript.\n\
    \n## if ... \n\nUse when:\n\n- A true choice exists and the false choice does\
    \ not exist\n\n### Template\n\n```\nif (condition) {\n  statements;\n}\n```\n\n\
    When the computer executes the condition, if the condition evaluates true, then\
    \ the computer executes the statements inside the body of if statement. Otherwise\
    \ the computer skips the statements in the body of the if statement.\n\n### Example\
    \ 1\n\n```\nif (balance > 500) {\n  var interest = balance * 0.03;\n  balance\
    \ += interest;\n}\ndocument.getElementById('outputDiv').innerHTML = balance;\n\
    ```\n\n| Desk Check | |\n| balance interest | |\n| 700 | |\n\nFigures 16 and 17\
    \ show the order in which the computer will execute the statements from example\
    \ 1. Figure 16 shows that when balance is greater than 500, the computer will\
    \ execute the statements inside the body of the if statement. Figure 17 shows\
    \ that when balance is not greater than 500, the computer will skip the statements\
    \ inside the body of the if statement.\n\n```\nif (balance > 500) {\n    var interest\
    \ = balance * 0.03;\n    balance += interest;\n}\n\ndocument.getElementById('outputDiv').innerHTML\
    \ = balance;\n\nDesk Check\nbalance interest\n\n| 700 | 21 |\n| 721 | |\n\n**Figure\
    \ 16:** When balance is greater than 500, the computer will execute the statements\
    \ inside the body of the if statement.\n\n```\nif (balance > 500) {\n    var interest\
