    An array is a collection of variables where each variable has the same data type,
    for example, an array of integers or an array of Student objects. Each variable
    in an array is called an element and has a unique index, also called the subscript,
    which denotes that element''s location within the array. One advantage of using
    arrays is that all the elements within an array can be declared, created, or passed
