    和 $c$ 已经存在且各持有一个值。在编写答案时，务必声明 $E$ 并使用上方给出的变量名。


    12. 边长为 $a, b$ 和 $c$ 的三角形半周长 $s$ 由公式 $s = \frac{a+b+c}{2}$给出。将此公式翻译成 JavaScript。假设变量
    $a, b$ 和 $c$ 已经存在且各持有一个值。在编写答案时，务必声明 $s$ 并使用上方给出的变量名。


    13. 将 $r = 2k + \frac{6-n}{3p^2}$ 翻译成 JavaScript。假设变量 $k, n$ 和 $p$ 已经存在且各持有一个值。在编写答案时，务必声明
    $r$ 并使用上方给出的变量名。


    14. 重写以下 JavaScript 语句：

    `z++ = x - 3 * y;`

    使其不使用 `+=` 运算符。


    15. 重写以下 JavaScript 语句：

