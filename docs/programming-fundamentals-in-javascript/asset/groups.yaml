    \    list[i] = high - i;\n  }\n}\n```\n\n| list | high | i |\n|---|---|---|\n\
    | [0] | [1] | [2] | [3] | [4] |\n\n## Reversing an Array\n\nReversing the order\
    \ of the elements in an array is not commonly used in computer programs. However,\
    \ it is an interesting operation and understanding it helps students to understand\
    \ more used array operations. One way to reverse the elements in an array is to\
    \ use two index variables, one index starts at the beginning of the array, and\
    \ the other starts at the end of the array. Then write a loop that repeats n/2\
    \ times where n is the number of elements in the array. Each time through the\
    \ loop, the computer switches one element in the left half of the array with one\
    \ element in the right half.\n\n# Example 13\n\n```\n// Reverses the contents\
    \ of the specified array.\nfunction reverse(list) {\n  var left = 0;\n  var right\
