- md: "\n## Infinite Loop\n\nWhat does the computer do if a programmer forgets to\
    \ write the update part of a loop? For example:\n\n```\n // warning! This is an\
    \ infinite loop.\nvar i = 0;\nwhile (i < 5) {\n  alert('Hello');\n}\n```\n\nOr\
    \ this example:\n\n```\n // warning! This is an infinite loop.\nfor (var i = 0;\
    \ i < 5; ) {\n  alert('Hello');\n}\n```\n\nNotice in both examples that after\
    \ the value of the counting variable i is initialized to zero (0), its value is\
    \ never changed. This means that i will start at the value zero, and each time\
    \ the computer evaluates the continuation condition (i < 5), i will be less than\
    \ 5. In other words, the continuation condition will always evaluate to true and\
    \ the computer will keep repeating the statements inside the loop forever or until\
    \ the user kills the program. This is called an infinite loop and is usually,\
    \ although not always, a mistake. Of course the way to fix both of the above infinite\
    \ loop examples is to add code to change the value of i within the body of the\
    \ loops. For example:\n\n```javascript\nvar i = 0;\nwhile (i < 5) {\n  alert('Hello');\n\
    \  i++;\n}\nfor (var i = 0; i < 5; i += 2) {\n  alert('Hello');\n}\n```\n\n##\
    \ Compound Interest\n\nMany bank accounts and other investments pay compound interest\
    \ on the money that is saved in the account. This means each time the bank pays\
    \ interest, the interest is added to the original money which is called the principal.\
    \ Then the next time the bank pays interest, it pays interest on the principal\
    \ and the previous interest. The balance of such an account and its compound interest\
    \ can easily be computed using a loop.\n\n## Example 10\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Compound\
    \ Interest</title>\n<script>\n/*\n* An amount to invest: balance\n* The annual\
    \ rate of growth: annualRate\n* The number of months to invest: numMonths\n* Processing:\
    \ use a loop to compute the balance of an account after\n* a bank has paid interest\
    \ for numMonths number of months.\n* Output: The balance after numMonths have\
    \ passed.\n*/\n\nfunction futureValue() {\n  var balance =\n  parseFloat(document.getElementById('balance').value)\n\
    );\n  var annualRate =\n  parseFloat(document.getElementById('annualRate').value);\n\
    \  var numMonths =\n  parseInt(document.getElementById('months').value);\n  var\
    \ monthlyRate = annualRate / 12;\n\n  // For each month, compute the interest\
    \ and\n  // add it to the balance.\n  for (var month = 1; month <= numMonths;\
    \ month++) {\n    // Compute the interest for a month.\n    var interest = balance\
    \ * monthlyRate;\n    // Round the interest to pennies.\n    interest = Math.round(interest\
    \ * 100) / 100;\n    // Add the interest to the balance.\n    balance += interest;\n\
    \  }\n  // Display the resulting balance for the user\n  document.getElementById('output').innerHTML\
    \ =\n  'Your balance after ' + numMonths + ' months is $' + balance;\n}\n</script>\n\
    </head>\n\n<body>\nBalance: <input type=\"text\" id=\"balance\" size=\"7\"><br>\n\
    Annual growth rate: <input type=\"text\" id=\"annualRate\" size=\"$\"><br>\nNumber\
    \ of months: <input type=\"text\" id=\"months\" size=\"3\"><br>\n<button type=\"\
    button\" onclick=\"futureValue()\">Future value</button>\n<div id=\"output\"></div>\n\
    </body>\n</html>\n```\n\n## Desk Check\n\n| annualRate | monthlyRate | numMonths\
    \ | month | interest | balance |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | 0.06 | 3 | 100 | | | |\n\n## break\n\nThe break keyword causes the computer\
    \ to end a loop prematurely. It is normally used inside an if statement that is\
    \ inside a loop. Here is a code example that reads 10 or fewer numbers from a\
    \ user and computes and outputs the sum of those numbers. The code stops reading\
    \ from the user after 10 numbers or after the user enters zero (0), whichever\
    \ comes first.\n\n## Example 11\n\n```javascript\n// Gets 10 or fewer numbers\
    \ from the user and adds them together.\nfunction sum10() {\n  var sum = 0;\n\
    \  for (var i = 0; i < 10; i++) {\n    var n = parseFloat(prompt('Please enter\
    \ a number'));\n    if (n == 0) {\n      break;\n    }\n    sum += n;\n  }\n \
    \ alert(sum);\n}\n```\n\nDesk Check\n| i | n | sum |\n|---|---|---|\n| | 17 |\
    \ |\n| | -3 | 14 | |\n\n## Prime Numbers\n\nA prime number is a positive integer\
    \ that is evenly divisible by only two integers, 1 and itself. The numbers 2,\
    \ 3, 5, and 7 are prime as are 91, 97, and 101. Prime numbers are very important\
    \ in computing, for example in hash code algorithms and data encryption. There\
    \ are many well-known algorithms, including the sieve of Eratosthenes, for determining\
    \ if a number is prime. The following code uses a naive and slow algorithm to\
    \ determine if a number is prime, but it works.\n\n## Example 12\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Prime\
    \ Number</title>\n<script>\n/*\n * Input: an integer\n * Processing: determine\
    \ if the given integer is prime or not.\n * Output: is prime or not prime.\n */\n\
    function isPrime() {\n  var candidate = parseInt(document.getElementById('integerBox').value);\n\
    \  var factorCount = 0;\n  for (var divisor = 1; divisor <= candidate; divisor++)\
    \ {\n    var remainder = candidate % divisor;\n    if (remainder == 0) {\n   \
    \   factorCount++;\n    }\n  }\n  // Determine the output and show it to the user.\n\
    \  var output;\n  if (factorCount == 2) {\n    output = candidate + ' is prime';\n\
    \  } else {\n    output = candidate + ' is not prime';\n  }\n  document.getElementById('output').innerHTML\
    \ = output;\n}\n</script>\n</head>\n\n<body>\nPlease enter an integer: <input\
    \ type=\"text\" id=\"integerBox\"><br>\n<button type=\"button\" onclick=\"isPrime()\"\
    >Is Prime</button>\n<div id=\"output\"></div>\n</body>\n</html>\n```\n\nDesk Check\n\
    \n| candidate | divisor | remainder | output |\n| :--- | :--- | :--- | :--- |\n\
    | 8 | 1 | 0 | |\n| 8 | 2 | 0 | |\n| 8 | 3 | 2 | |\n| 8 | 4 | 0 | |\n\nThe algorithm\
    \ used by the previous code is naive and slow. What improvements could we make\
    \ to the code to speed it up?\n\n1. The divisor loop begins at 2 instead of 1.\n\
    2. The divisor loop no longer counts factors but ends as soon as the computer\
    \ determines the candidate is not prime.\n3. In the case of a prime number, the\
    \ divisor loop does not count the way to the candidate but stops at the square\
    \ root of the candidate.\n\n## Example 13\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"\
    en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Prime Number</title>\n<script>\n\
    /*\n * Input: an integer\n * Processing: determine if the given integer is prime\
    \ or not.\n * Output: is prime or not prime.\n */\nfunction isPrime() {\n  var\
    \ candidate = parseInt(document.getElementById('integerBox').value);\n  var limit\
    \ = Math.sqrt(candidate);\n  var prime = true;\n\n  // Find the first integer\
    \ that evenly divides candidate.\n  for (var divisor = 2; divisor <= limit; divisor++)\
    \ {\n    var remainder = candidate % divisor;\n    if (remainder == 0) {\n   \
    \   prime = false;\n      break;\n    }\n  }\n\n  // Determine the output and\
    \ show it to the user.\n  var output;\n  if (prime) {\n    output = candidate\
    \ + ' is prime';\n  } else {\n    output = candidate + ' is not prime';\n  }\n\
    \  document.getElementById('output').innerHTML = output;\n}\n</script>\n</head>\n\
    \n<body>\nPlease enter an integer: <input type=\"text\" id=\"integerBox\"><br>\n\
    <button type=\"button\" onclick=\"isPrime()\">Is Prime</button>\n<div id=\"output\"\
    ></div>\n</body>\n</html>\n```\n\nDesk Check\n\n| candidate | limit | prime |\
    \ divisor | remainder |\n| :--- | :--- | :--- | :--- | :--- |\n| 8 | 2.82 | false\
    \ | 2 | 0 |\n\n## Repetitive Strings\n\nOccasionally we need the computer to produce\
    \ a string that has a repeating pattern. We can use a loop to cause the computer\
    \ to build such strings. Consider the string \"0, 2, 4, 6, 8, 10\" with the simple\
    \ pattern of counting by twos. Here is code that builds this string and displays\
    \ it to the user.\n\n## Example 14\n\n```javascript\nvar output = '0';\nvar i\
    \ = 2;\nwhile (i <= 10) {\n    output += ', ' + i;\n    i += 2;\n}\n```\n"
  mdcn: "\n\n## 无限循环\n\n如果程序员忘记编写循环的更新部分，计算机会发生什么？例如：\n\n```\n // warning! 这是一个无限循环。\n\
    var i = 0;\nwhile (i < 5) {\n  alert('Hello');\n}\n```\n\n或者这个示例：\n\n```\n //\
    \ warning! 这是一个无限循环。\nfor (var i = 0; i < 5; ) {\n  alert('Hello');\n}\n```\n\n\
    注意在这两个例子中，在计数变量 `i` 的值初始化为零 (0) 之后，它的值就从未被改变过。这意味着 `i` 将从零开始，并且每当计算机评估继续条件（`i\
    \ < 5`）时，`i` 都会小于 5。换句话说，继续条件将始终评估为 `true`，计算机将无限地重复循环内部语句，直到用户杀掉程序。这被称为无限循环，通常（尽管并非总是如此）是一个错误。当然，修复上述两个无限循环示例的方法是在循环体内部添加代码来改变\
    \ `i` 的值。例如：\n\n```javascript\nvar i = 0;\nwhile (i < 5) {\n  alert('Hello');\n\
    \  i++;\n}\nfor (var i = 0; i < 5; i += 2) {\n  alert('Hello');\n}\n```\n\n##\
    \ 复利\n\n许多银行账户和其他投资会对账户中保存的资金支付复利。这意味着每当银行支付利息时，利息会被加入原始资金（称为本金）中。下次银行支付利息时，它会对本金和之前的利息计算利息。此类账户的余额及其复利可以使用循环轻松计算。\n\
    \n## 示例 10\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>复利</title>\n<script>\n/*\n* 投资金额：balance\n* 年增长率：annualRate\n\
    * 投资月数：numMonths\n* 处理：使用循环计算在银行支付 numMonths 个月利息后的账户余额。\n* 输出：numMonths 个月后的余额。\n\
    */\n\nfunction futureValue() {\n  var balance =\n  parseFloat(document.getElementById('balance').value)\n\
    );\n  var annualRate =\n  parseFloat(document.getElementById('annualRate').value);\n\
    \  var numMonths =\n  parseInt(document.getElementById('months').value);\n  var\
    \ monthlyRate = annualRate / 12;\n\n  // 对于每个月，计算利息并\n  // 将加入余额中。\n  for (var\
    \ month = 1; month <= numMonths; month++) {\n    // 计算一个月的利息。\n    var interest\
    \ = balance * monthlyRate;\n    // 将利息四舍五入到分。\n    interest = Math.round(interest\
    \ * 100) / 100;\n    // 将利息加入余额。\n    balance += interest;\n  }\n  // 为用户显示结果余额\n\
    \  document.getElementById('output').innerHTML =\n  '您的余额在 ' + numMonths + ' 个月后为\
    \ $' + balance;\n}\n</script>\n</head>\n\n<body>\n余额: <input type=\"text\" id=\"\
    balance\" size=\"7\"><br>\n年增长率: <input type=\"text\" id=\"annualRate\" size=\"\
    $\"><br>\n月数: <input type=\"text\" id=\"months\" size=\"3\"><br>\n<button type=\"\
    button\" onclick=\"futureValue()\">未来价值</button>\n<div id=\"output\"></div>\n\
    </body>\n</html>\n```\n\n## 轨迹检查\n\n| annualRate | monthlyRate | numMonths | month\
    \ | interest | balance |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 0.06\
    \ | 3 | 100 | | | |\n\n## break\n\n`break` 关键字会导致计算机提前结束循环。它通常用于循环内部的 `if` 语句中。这里的代码示例从用户处读取\
    \ 10 个或更少的数字，并计算并输出这些数字的和。在读取 10 个数字后或用户输入零 (0) 后（以先者为准），代码停止从用户处读取。\n\n## 示例\
    \ 11\n\n```javascript\n// 从用户处获取10个或更少的数字并将它们相加。\nfunction sum10() {\n  var sum\
    \ = 0;\n  for (var i = 0; i < 10; i++) {\n    var n = parseFloat(prompt('请输入一个数字'));\n\
    \    if (n == 0) {\n      break;\n    }\n    sum += n;\n  }\n  alert(sum);\n}\n\
    ```\n\n轨迹检查\n| i | n | sum |\n|---|---|---|\n| | 17 | |\n| | -3 | 14 | |\n\n##\
    \ 质数\n\n质数是一个只能被两个整数（1 和自身）整除的正整数。数字 2、3、5 和 7 是质数，91、97 和 101 也是。质数在计算机科学中非常重要，例如在哈希码算法和数据加密中。有很多著名的算法（包括埃拉托斯特筛法）用于判断一个数是否为质数。以下代码使用了一种朴素且缓慢的算法来确定一个数是否为质数，但它是可以工作的。\n\
    \n## 示例 12\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>质数</title>\n<script>\n/*\n* 输入：整数\n* 处理：判断一个整数是否为质数。\n* 输出：是质数或不是。\n\
    */\n\nfunction isPrime() {\n  var candidate = parseInt(document.getElementById('integerBox').value);\n\
    \  var factorCount = 0;\n  for (var divisor = 1; divisor <= candidate; divisor++)\
    \ {\n    var remainder = candidate % divisor;\n    if (remainder == 0) {\n   \
    \   factorCount++;\n    }\n  }\n  // 为用户显示结果。\n  var output;\n  if (factorCount\
    \ == 2) {\n    output = candidate + ' 是质数';\n  } else {\n    output = candidate\
    \ + ' 不是质数';\n  }\n  document.getElementById('output').innerHTML = output;\n}\n\
    </script>\n</head>\n\n<body>\n输入一个整数: <input type=\"text\" id=\"integerBox\" size=\"\
    7\"><br>\n<div id=\"output\"></div>\n</body>\n</html>\n```\n\n轨迹检查\n\n| candidate\
    \ | divisor | remainder | output |\n| :--- | :--- | :--- | :--- |\n| 8 | 1 | 0\
    \ | |\n| 8 | 2 | 0 | |\n| 8 | 3 | 2 | |\n| 8 | 4 | 0 | |\n| 8 | 5 | 3 | |\n| 8\
    \ | 6 | 2 | |\n| 8 | 7 | 1 | |\n| 8 | 8 | 0 | |\n\n上述代码使用的算法是朴素且缓慢的。我们可以对代码做哪些改进来提高速度？\n\
    \n1. 循环从 2 开始而不是 1。\n2. 循环在确定该数不是质数时立即停止。\n3. 对于质数的情况，循环不再运行到数字本身，而是到它的平方根。\n\n\
    ## 示例 13\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>质数</title>\n<script>\n/*\n * 输入：整数\n * 处理：判断一个整数是否为质数。\n * 输出：是质数或不是。\n\
    \ */\nfunction isPrime() {\n  var candidate = parseInt(document.getElementById('integerBox').value);\n\
    \  var limit = Math.sqrt(candidate);\n  var prime = true;\n\n  // 找到第一个整除该数的整数。\n\
    \  for (var divisor = 2; divisor <= limit; divisor++) {\n    var remainder = candidate\
    \ % divisor;\n    if (remainder == 0) {\n      prime = false;\n      break;\n\
    \    }\n  }\n\n  // 为用户显示结果。\n  var output;\n  if (prime) {\n    output = candidate\
    \ + ' 是质数';\n  } else {\n    output = candidate + ' 不是质数';\n  }\n  document.getElementById('output').innerHTML\
    \ = output;\n}\n</script>\n</head>\n\n<body>\n输入一个整数: <input type=\"text\" id=\"\
    integerBox\" size=\"7\"><br>\n<div id=\"output\"></div>\n</body>\n</html>\n```\n\
    \n轨迹检查\n\n| candidate | limit | prime | divisor | remainder |\n| :--- | :--- |\
    \ :--- | :--- | :--- |\n| 8 | 2.82 | false | 2 | 0 |\n\n## 重复字符串\n\n有时我们需要计算机产生具有重复模式的字符串。我们可以使用循环让计算机构建此类字符串。考虑“0,\
    \ 2, 4, 6, 8, 10”这个字符串，它具有简单的2的计数模式。以下是构建此字符串并显示给用户的代码。\n\n## 示例 14\n\n```javascript\n\
    var output = '0';\nvar i = 2;\nwhile (i <= 10) {\n    output += ', ' + i;\n  \
    \  i += 2;\n}\n```\n\n"
