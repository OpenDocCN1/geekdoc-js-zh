    65% 到 85% 之间。编写一个定义表和一个程序询问人的年龄并计算所需的最低和最快速率。


    8. 编写一个定义表和一个 JavaScript 程序计算并输出税后工资。你的程序将从键盘读取员工工作的常规小时数和工资，然后计算该员工的税额。税为总工资的
    15%。


    9. 电缆的长度可以用此公式近似：

    $L = s + \frac{8d^2}{3s}$

    其中 $L$ 是电缆长度，$s$ 是电缆跨越的距离，$d$ 是电缆下垂的深度。编写一个定义表和一个程序，允许用户输入电缆跨越的距离和下垂深度。你的程序必须计算并输出电缆长度。


    10. 美国的轮胎尺寸用三个数字表示，例如 205/60R 15。第一个数字是以毫米为单位的轮胎宽度。第二个数字是厚扁比。第三个数字是轮胎匹配的轮毂英寸直径。编写一个定义表和一个程序，从键盘读取轮胎的这三个数字并计算并输出轮胎内部空间的体积。轮胎内部空间体积可以用此公式近似：

    $v = \pi w \frac{w(w^2a^2 + 2,540 wad)}{10,000,000}$

    其中 $v$ 是立方厘米为单位的体积，$w$ 是毫米为单位的轮胎宽度，$a$ 是轮胎的厚扁比，$d$ 是英寸为单位的轮毂直径。

