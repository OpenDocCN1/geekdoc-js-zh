    e. 拍字节 v. 1,125,899,906,842,624\nf. 艾字节 vi. 1,152,921,504,606,846,976\n\n- 5.\
    \ 假设一部电影占用硬盘上的 3 吉字节。以下哪项是存储电影的大小？\na. 500 兆字节\nb. 500 吉字节\nc. 太字节\nd. 拍字节\n\n\
    - 6. 考虑一个时钟频率为 2.5 吉赫的四核 CPU。理论上它每秒能完成多少指令？\na. 28 万\nb. 28 亿\nc. 112 亿\nd. 20\
