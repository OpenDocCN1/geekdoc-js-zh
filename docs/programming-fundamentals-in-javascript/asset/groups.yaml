    # Comments


    A comment in a JavaScript program is a note or documentation that a programmer
    writes for himself or other programmers who will look at his code. The computer
    ignores comments. There are two styles of comments in JavaScript: single line
    and multi-line. A single line comment begins with two forward slashes (/), and
    ends at the end of the line of text. A multi-line comment begins with a forward
    slash and an asterisk (*), and ends with an asterisk and a forward slash (*/).
    When writing a multi-line comment, many programmers start each line with an asterisk
