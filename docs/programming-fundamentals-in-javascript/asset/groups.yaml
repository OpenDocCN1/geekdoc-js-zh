    ```\n\n函数的第一行被称为头部（header）或签名（signature），它包括：\n\n1. 关键字 function\n2. 函数名\n3. 参数列表\n\
    \n函数名必须以字母、下划线（_）或美元符号（$）开头。名称其余部分必须由字母、数字（0–9）、下划线或美元符号组成。函数名不能包含空格。函数名应该是意义意义，并应该描述函数的功能。参数列表包含了存储在变量中的数据，函数内部需要完成其任务。\n\
    \n函数内部的语句包含你希望编写的任意数量语句。然而，将函数限制在 60 行以内是一个好主意。为了从函数返回结果以便该结果可以在程序的其他地方使用，只需输入关键字\
    \ `return`，后面跟着你想返回的任何值。\n\n# 示例 1\n\n为 `drawCircle` 函数编写头部，它接受三个参数：圆心的 x y 坐标以及半径（单位为像素）。\n\
    \n```javascript\nfunction drawCircle(centerX, centerY, radius)\n```\n\n# 示例 2\n\
    \n为 `getRate` 函数编写头部，它接受两个参数并返回结果。\n\n```javascript\nfunction getRate(a, b)\n\
    ```\n\n# 示例 3\n\n为 `average` 函数编写头部，它接受三个数字并返回平均值。\n\n```javascript\nfunction\
    \ average(a, b, c) {\n  let sum = a + b + c;\n  return sum / 3;\n}\n```\n\n# 示例\
    \ 4\n\n为 `calculateProduct` 函数编写头部，它接受两个数字并返回它们的乘积。\n\n```javascript\nfunction\
    \ calculateProduct(x, y) {\n  return x * y;\n}\n```\n\n# 调用函数\n\n调用函数会执行其代码。在程序中，调用函数的代码行被称为调用点（call\
    \ point）。如图所示，计算机首先将调用点处的参数值复制到参数中。然后计算机执行函数体内的代码。大多数函数以 return 语句结束。当计算机执行被调用函数中的\
    \ return 语句时，会发生以下情况：\n\n1. return 语句调用计算机向调用点返回一个值（通常是数字）。如果调用点包含变量和赋值运算符（=），计算机会将返回的值存储在变量中。\n\
