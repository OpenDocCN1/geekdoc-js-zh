    \n# 半导体\n\n计算机的许多部分（包括 CPU 和主内存）都是由数百万或数十亿个刻在硅片上的微型半导体组成的。半导体一词意味着这些微型部分部分导电，有时导电。有许多不同类型的半导体，每种类型都有其特定的用途。以下是常见半导体及其用途。\n\
    \n- 1. 电容器 – 一种临时存储电量的半导体。\n- 2. 二极管 – 一种允许电流向一个方向流的半导体。\n- 3. LED – 发光二极管的缩写；一种在电流通过时会发光的二极管。\n\
