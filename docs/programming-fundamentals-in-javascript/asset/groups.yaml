    var c = 15;

    `var d = -2.17;

    `var e = c + d;`


    7. 计算机执行以下 JavaScript 代码后，变量 `h` 将是什么数据类型并持有什么值？

    var f = "Her name is ";

    `var g = "Isabella";

    `var h = f + g;`


    8. 计算机执行以下 JavaScript 代码后，变量 `k` 将是什么数据类型？

