    # Increment and Decrement Operators


    JavaScript includes two shortcut operators called the increment and decrement
    operators. The increment operator (++) simply adds one to the value of a variable.
    The decrement operator (--) subtracts one from the value of a variable.


    | Operator Name Example Equivalent |

    |---|---|---||

    | ++ | pre-increment | ++x; x += 1; x = x + 1; |

    | | post-increment | x++; | |

    | -- | pre-decrement | --t; t -= 1; t = t - 1; |

    | | post-decrement | t--; | |


    Both the increment and decrement operators can be written as a pre or post operator.
    If you write one of these before a variable name, such as ++, then it is a pre-increment,
    meaning the computer will perform the increment before the rest of the arithmetic
    in the same statement. If you write one of the operators after a variable'
  - '[PAGE 80]


    name, such as x++, then it is a post-increment, meaning the computer will perform
    the increment after the rest of the arithmetic in the same statement. However,
    if you use the increment or decrement operator in a statement all by itself, then
    it makes no difference whether you use the pre or post version. The next two examples
    show how pre and post-increment work when written inside a larger statement.


    # Example 18


    ```

    var a = 4;

    var b = ++a * 3 + 2;

    ```


    | Desk Check |

    | a | b |

    | 4 | 17 |

    | 5 |


    # Example 19


    ```

    var a = 4;

    var b = a++ * 3 + 2;

    ```


    | Desk Check |

    | a | b |

    | 4 | 14 |

    | 5 |


    Notice in example 18, line 1 causes the computer to store the number 4 in the
    variable a. On line 2, because the increment operator is written as a pre-increment,
    the computer first adds 1 to the value of a, and then performs the rest of the
    calculations on line 2 which results in 17 stored in the variable b.


    In example 19, line 1 causes the computer to store the number 4 in the variable
    a. On line 2, because the increment operator is written as a post-increment, the
    computer first performs the other calculations on line 2 which results in 14 stored
    in b, and then increments the value of a from 4 to 5. Notice in example 19 incrementing
    a does not affect the value of b because the increment is a post-'
