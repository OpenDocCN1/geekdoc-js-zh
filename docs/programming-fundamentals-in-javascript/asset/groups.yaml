- md: "\n# Example 23\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n\
    <meta charset=\"utf-8\">\n<meta name=\"author\" content=\"Rex Barzee\">\n<title>Sort\
    \ Text</title>\n```\n\n```html\n<script>\n/* Input: A list of text items, each\
    \ item on a separate line.\n* Processing:\n* Split the text items into an array.\n\
    * Sort the array.\n* Join the array into a string.\n* Output: The sorted list\
    \ of text items\n*/\nfunction process() {\n  // Get the text entered by the user.\n\
    \  var text = document.getElementById('input').value;\n\n  // Split the text at\
    \ each new\n  // line into an array of strings.\n  var list = text.split('\\n');\n\
    ```\n\n![](img/7ea917145c99e19be973d71c03bf910b_212_0.png)\n\n```javascript\n\
    // Sort the array of strings.\nlist.sort();\n\n// Join the sorted array into a\
    \ string\n// of text separated by newline characters.\nvar output = list.join('\\\
    n');\n\n// display the string for the user to see.\ndocument.getElementById('output').value\
    \ = output;\n</script>\n</head>\n```\n\n```html\n<body>\n<textarea id=\"input\"\
    \ rows=\"16\" cols=\"20\"></textarea>\n<button type=\"button\" onclick=\"process()\"\
    >Sort</button>\n<textarea id=\"output\" rows=\"16\" cols=\"20\"></textarea>\n\
    </body>\n</html>\n```\n\n# Sorting Numbers\n\nBy default, the built-in sort function\
    \ in JavaScript sorts arrays lexicographically which essentially means alphabetically.\
    \ This causes problems if you wish to sort an array of numbers. For example, this\
    \ code will sort the numbers array in a surprising way.\n\n```javascript\nvar\
    \ numbers = [ 7, 10, 8, 16, 3, 35 ];\n// WARNING: this will sort the numbers array\n\
    // lexicographically and not numerically.\nnumbers.sort();\n```\n\nIn the previous\
    \ code, after the computer calls the sort function, the values in the array will\
    \ be [10, 16, 3, 35, 7, 8]. By default the built-in JavaScript sort function places\
    \ 10 and 16 before 3, 7, and 8 because 10 and 16 begin with 1 and lexicographically\
    \ 1 comes before 3, 7, and 8. To force JavaScript to sort an array according to\
    \ its numeric values, we have to pass a comparison function into the sort function.\n\
    \n# Example 24\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Compound Interest</title>\n<script>\n  * Input: No\
    \ user input\n  * Processing: Test the built-in JavaScript sort function\n  *\
    \ Output: The contents of an array after it is\n  * sorted, and the contents after\
    \ it is sorted.\n */\nfunction testSort() {\n  var numbers = [ 7, 10, 8, 16, 3,\
    \ 35 ];\n  document.getElementById('output').innerHTML = numbers +\n  '<br>';\n\
    \  numbers.sort(compareNumbers);\n  document.getElementById('output').innerHTML\
    \ += numbers;\n}\n// Compares two by subtracting the second\n// from the first\
    \ which will return a negative\n// number if the first number should be placed\n\
    // before the second, a zero if the two numbers\n// are equal, and a positive\
    \ number if the first\n// number should be placed after the second.\nfunction\
    \ compareNumbers(x, y) {\n  return x - y;\n}\n</script>\n</head>\n<body>\n<button\
    \ type=\"button\" onclick=\"testSort()\">Sort Array</button>\n<div id=\"output\"\
    ></div>\n</body>\n</html>\n```\n\nYou might be wondering how a sort function works.\
    \ There are many different, well known sort algorithms (selection, exchange, insertion,\
    \ heap, quick, etc.). They work by repeatedly comparing elements in an array to\
    \ other elements in the array and simply moving the elements around the array.\
    \ Below is JavaScript code to sort an array using the insertion sort algorithm.\
    \ Insertion sort is a simple and reasonably fast algorithm, although it is usually\
    \ not as fast as the quick sort algorithm.\n\n# Example 25\n\n```javascript\n\
    // sorts the contents of the specified array in\n// ascending order using the\
    \ insertion sort algorithm.\nfunction sort(list) {\n  var first = 0;\n  var last\
    \ = list.length - 1;\n  for (var i = last - 1; i >= first; i--) {\n    var swap\
    \ = list[i];\n    for (var j = i + 1; j <= last; j++) {\n      if (swap <= list[j])\
    \ {\n        break;\n      }\n      list[j - 1] = list[j];\n    }\n    list[j\
    \ - 1] = swap;\n  }\n}\n```\n\n# Desk Check\n\n| | i | swap | j | last |\n|---|---|---|---|---|\n\
    | 6 | -8 | 9 | 7 | 0 |\n| 6 | -8 | 9 | | |\n| 6 | -8 | | | |\n| 6 | | 0 | 7 |\
    \ 9 |\n| | | | 7 | 9 |\n| 0 | 1 | 2 | 3 | 4 |\n\n# Common Mistakes\n\n### Forgetting\
    \ that the first index in a JavaScript array is always 0\n\n- **Incorrect:**\n\
    ```javascript\nfor (var i = 1; i < a.length; i++) {\n  a[i] = 0;\n}\n```\n- **Correct:**\n\
    ```javascript\nfor (var i = 0; i < a.length; i++) {\n  a[i] = 0;\n}\n```\n\n###\
    \ Going beyond the end of an array\n\n- **Incorrect:**\n```javascript\nfor (var\
    \ i = 0; i <= a.length; i++) {\n}\n```\n- **Correct:**\n```javascript\nfor (var\
    \ i = 0; i < a.length; i++) {\n}\n```\n\n### Confusing an index with the value\
    \ stored at an index\n\n- **Incorrect:**\n```javascript\nvar sum = 0;\nfor (var\
    \ i = 0; i < a.length; i++) {\n  // wrong! i is the index. This code ignores\n\
    \  // values that are stored in the array and simply\n  // adds indices of the\
    \ array which are\n  // integers 0, 1, 2, ... (a.length - 1)\n  sum += i;\n}\n\
    ```\n- **Correct:**\n```javascript\nvar sum = 0;\nfor (var i = 0; i < a.length;\
    \ i++) {\n  // Right. a[i] is the value stored at index i.\n  // This code adds\
    \ the values that are\n  // stored in the array.\n  sum += a[i];\n}\n```\n\n#\
    \ Chapter Summary\n\n- An array is a collection of variables. variable in an array\
    \ is called an element and has a unique index which denotes that element's location\
    \ within the array\n- To declare an array, use the keyword `var`.\n- To create\
    \ an array which will reserve space in memory for the elements of the array, write\
    \ code that uses `new` and `Array`, like this:\n  `arrayName = new Array(size);`\n\
    - To create and populate an array with known values write code that uses square\
    \ brackets `[` and `]` like:\n  `arrayName = [value0, value1, ... valueN];`\n\
    - All arrays in JavaScript have an attribute named `length`, which is the number\
    \ of elements contained in the array.\n- To access a single element within an\
    \ array either to read or write the element's value, use bracket notation:\n \
    \ `arrayName[index]`\n- The first index in a JavaScript array is always 0.\n-\
    \ The last index in a JavaScript array is always the length of the array minus\
    \ 1:\n  `var lastIndex = arrayName.length - 1;`\n- To process all the elements\
    \ in an array, a programmer will usually write a loop that counts from zero to\
    \ the length of the array similar to:\n```javascript\nfor (var i = 0; i < arrayName.length;\
    \ i++) {\n  // Process each element of array using i as the index.\n}\n```\n-\
    \ JavaScript includes many built-in methods to process arrays, including: `concat`,\
    \ `indexOf`, `join`, `lastIndexOf`, `pop`, `push`, `reverse`, `shift`, and `sort`.\n\
    \n# Review Questions\n\n1. Given the following JavaScript statement what is the\
