  mdcn: "\n\n## 嵌套 if 语句\n\n在另一个 if 语句内部或 if 语句的 else 部分编写一个语句通常是有用的。考虑编写一个程序，从键盘读取销售人员的每周销售总额，然后根据下表输出该销售人员的佣金。\n\
    \n| a | b | c | discr | sq | root1 | root2 |\n|---|---|---|---|---|---|---|\n\
    | 1 | -4 | 3 | | | | |\n\n| 如果销售额大于或等于 | 且销售额小于 | 那么佣金率为 |\n|---|---|--|\n| $300\
    \ | $600 | 0% |\n| $600 | $1000 | 2.5% |\n| $1000 | ∞ | 3.0% |\n\n可以使用嵌套的 if 语句轻松编写，如下代码示例所示。注意嵌套在\
    \ else 语句内部的 if 语句。\n\n## 示例 10\n\n```\nvar sales = parseFloat(document.getElementById('salesInputBox').value);\n\
    var rate;\nif (sales < 300) {\n  rate = 0;\n}\nelse {\n  if (sales < 600) {\n\
    \    rate = 0.02;\n  }\n  else {\n    if (sales < 1000) {\n      rate = 0.025;\n\
    \    }\n    else {\n      rate = 0.03;\n    }\n  }\n}\nvar commission = sales\
    \ * rate;\nvar output = 'The employee earned ' + commission;\ndocument.getElementById('outputDiv').innerHTML\
    \ = output;\n```\n\n## 手算检查\n\n| 销售额 佣金 | 输出 |\n|---|---|\n| 850 | |\n\n虽然上一个示例是正确的，但可以通过像这样结合\
    \ else 和 if 语句以稍微更短的方式来编写。\n\n## 示例 11\n\n```\nvar sales =\nparseFloat(document.getElementById('salesInputBox').value);\n\
    var rate;\nif (sales < 300) {\n  rate = 0;\n} else if (sales < 600) {\n  rate\
    \ = 0.02;\n} else if (sales < 1000) {\n  rate = 0.025;\n} else {\n  rate = 0.03;\n\
    }\nvar commission = sales * rate;\nvar output = 'The employee earned ' + commission;\n\
    document.getElementById('outputDiv').innerHTML = output;\n```\n\n## 手算检查\n\n|\
    \ 销售额 佣金 | 输出 |\n|---|---|---|\n| 850 | |\n\n作为另一个例子，考虑一支运动队，它想要为学生和老年人提供折扣票，并根据下表奖励参加多次比赛的忠实粉丝。\n\
    \n| 年龄 | 参加场次 | 票价 |\n|---|---|---|\n| 0 - 17 | 0 - 5 | $8.00 |\n| 0 - 17 | 6\
