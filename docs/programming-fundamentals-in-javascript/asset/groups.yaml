    \ by a comma and a single space, for example “Reagan, Ronald” (without the quotation\
    \ marks). The function should extract and return the person’s given name, for\
    \ example “Ronald” (without the quotation marks).\n\n2. Write a function named\
    \ prefix that returns the common prefix of two strings. For example, the common\
    \ prefix of “disable” and “distasteful” is “dis”. This function takes two parameters\
    \ and returns the common prefix.\n\n3. Write a function named suffix that returns\
    \ the common suffix of two strings. For example, the common suffix of “swimming”\
    \ and “walking” is “ing”. This function takes two parameters and returns the common\
    \ suffix.\n\n4. Write a function named switchCase that receives a parameter named\
    \ s. This function must return a new string that contains the same characters\
    \ as s but with the case of every character switched. For example, if switchCase\
    \ were called like this: switchCase(\"Catch 22\"); it would return \"CATCH 22\"\
    \ (without the quotes).\n\n5. Write a function named titleCase with one parameter\
    \ named s. This function returns a copy of s but with the first letter of each\
    \ word capitalized.\n\n# Appendix A. Operator Precedence\n\nOperator precedence\
    \ determines the order in which the computer evaluates operators. Operators with\
    \ higher precedence are evaluated first. For example, $7 + 3 * 2$ is $13$ because\
    \ multiplication has a higher precedence than addition, so the computer performs\
    \ the multiplication before the addition.\n\n## Associativity\n\nOperator associativity\
    \ determines the order in which the computer evaluates operators of the same precedence.\
    \ There are two categories of associativity, left to right and right to left.\
    \ Consider the expression: $a\\ OP_1\\ b\\ OP_2\\ c$\n\n### Left to Right Associativity\n\
    \nIf $OP_1$ and $OP_2$ have the same precedence and left associativity (left to\
    \ right) then the computer will evaluate the expression as: $(a\\ OP_1\\ b)\\\
    \ OP_2 c$\nFor example, the computer evaluates $3 - 5 + 4$ as $(3 - 5) + 4$ which\
    \ is $2$.\n\n### Right to Left Associativity\n\nIf $OP_1$ and $OP_2$ have the\
    \ same precedence and right associativity (right to left) then the computer will\
    \ evaluate the expression as: $a\\ OP_1\\ (b\\ OP_2\\ c)$\n\nFor example, the\
    \ computer evaluates a = b = 5 as a = (b = 5) by first storing 5 in b, then storing\
    \ the value of b in a.\n\n# Precedence\n\nListed from highest precedence to lowest:\n\
    \n| Operator (s) | Name(s) | Associativity |\n| :--- | :--- | :--- |\n| ) | parentheses\
    \ | n/a |\n| [ ] | member | n/a |\n| ++, -- | increment, decrement | right to\
    \ left |\n| +, -, ~ | unary, plus, subtraction, negation | right to left |\n|\
    \ *, /, % | multiplication, division, modulus | left to right |\n| <<, >> | shift\
    \ | left to right |\n| >, <, <=, >= | relational | left to right |\n| ==, != |\
    \ equality | left to right |\n| & | bitwise and | left to right |\n| ^ | bitwise\
    \ or | left to right |\n| || | logical or | left to right |\n| ? : | conditional\
    \ | right to left |\n| *=, /=, +=, -=, <<=, >>=, |= | assignment | left to right\
    \ |\n\n# Appendix B. Robust Code\n\nThere is an old programming joke that goes\
    \ like this. A consultant went to a large company to teach the software engineers.\
    \ At the beginning of the class she said, “If you had written the software, how\
    \ many of you would be afraid for your life?” Every student except one put his\
    \ hand up. The consultant looked at the one who didn’t raise his hand and asked,\
    \ “What does you do to be safe?”\n\nBelow are some programming practices that\
    \ will make your software more robust:\n\n1. Turn on compiler warnings and never\
    \ ignore them.\n2. Follow generally accepted standards and conventions, including\
    \ naming conventions.\n3. Write and use assertions. Test primarily with assertions\
    \ turned on.\n4. Whenever possible, write simple, straight forward code. For example,\
    \ when writing in JavaScript, Java, C++ do not use the left shift operator (<<)\
    \ to multiply by power of two. Instead, use multiplication (*) and rely on the\
    \ compiler to generate fast code.\n5. Write each function to perform one and only\
    \ one task.\n6. Minimize the number of execution paths through your code (See\
    \ the section Finding a Range in chapter 10 of this book for an example of how\
    \ to do this.)\n7. Write each function with only one exit point (return statement).\n\
    8. Consider writing a tricky algorithm twice, once with a straight forward, slow\
    \ solution and once with a sophisticated, fast solution. In the debugging version\
    \ of your program, use the slow solution to verify the results of the fast solution.\n\
    9. When writing in a language that has exceptions, never return error codes from\
