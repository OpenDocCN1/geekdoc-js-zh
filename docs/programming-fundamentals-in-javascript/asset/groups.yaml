- md: "\n## Nested If Statements\n\nIt is often useful to write one statement inside\
    \ another if statement or inside the else part of an if statement. Consider the\
    \ problem to write a program that reads from the keyboard the total weekly sales\
    \ of a sales person and then outputs the sales person's commission according to\
    \ this table.\n\n| a | b | c | discr | sq | root1 | root2 |\n|---|---|---|---|---|---|---|\n\
    | 1 | -4 | 3 | | | | |\n\n| If the sales amount is greater than equal to | And\
    \ the sales amount is less than | Then the commission rate |\n|---|---|--|\n|\
    \ $300 | $600 | 0% |\n| $600 | $1000 | 2.5% |\n| $1000 | ∞ | 3.0% |\n\nThis can\
    \ be easily written using nested if statements as shown in the following code\
    \ example. Notice the if statements nested inside the else statements.\n\n## Example\
    \ 10\n\n```\nvar sales = parseFloat(document.getElementById('salesInputBox').value);\n\
    var rate;\nif (sales < 300) {\n  rate = 0;\n}\nelse {\n  if (sales < 600) {\n\
    \    rate = 0.02;\n  }\n  else {\n    if (sales < 1000) {\n      rate = 0.025;\n\
    \    }\n    else {\n      rate = 0.03;\n    }\n  }\n}\nvar commission = sales\
    \ * rate;\nvar output = 'The employee earned ' + commission;\ndocument.getElementById('outputDiv').innerHTML\
    \ = output;\n```\n\n## Desk Check\n\n| sales rate commission | output |\n|---|---|\n\
    | 850 | |\n\nAlthough the previous example is correct, it it can be written in\
    \ a slightly shorter way by combining the else and if statements like this.\n\n\
    ## Example 11\n\n```\nvar sales =\nparseFloat(document.getElementById('salesInputBox').value);\n\
    var rate;\nif (sales < 300) {\n  rate = 0;\n} else if (sales < 600) {\n  rate\
    \ = 0.02;\n} else if (sales < 1000) {\n  rate = 0.025;\n} else {\n  rate = 0.03;\n\
    }\nvar commission = sales * rate;\nvar output = 'The employee earned ' + commission;\n\
    document.getElementById('outputDiv').innerHTML = output;\n```\n\n## Desk Check\n\
    \n| sales rate commission | output |\n|---|---|---|\n| 850 | |\n\nAs another example,\
    \ consider a sports team that wants to provide discounted tickets to students\
    \ and senior citizens and that wants to reward loyal fans that attend multiple\
