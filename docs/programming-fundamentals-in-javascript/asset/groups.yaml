    # Prime Numbers


    A prime number is a positive integer that is evenly divisible by only two integers,
    1 and itself. The numbers 2, 3, 5, and 7 are prime as are 91, 97, and 101. Prime
    numbers are very important in computing, for example in hash code algorithms and
    data encryption. There are many well know algorithms, including the sieve of Eratosthenes,
    for determining if a number is prime. The following JavaScript code uses a naive
    and slow algorithm to determine if a number is prime, but it works. The code below
    increments a divisor from 1 to the candidate number, inclusive and repeatedly
    divides the candidate by the divisor. Each time the divisor divides the candidate
    without a remainder, then a factor count is incremented. After the divisor loop
    is finished, if the factor count is 2 (1 and the candidate itself), the candidate
    is prime, otherwise it is not prime.


