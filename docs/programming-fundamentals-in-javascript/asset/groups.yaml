    \n## Chapter 2. Algorithms and Computer Programs\n\n### Chapter Outcomes\n\nBy\
    \ the end of this chapter, you will:\n\n- Read a description of a problem and\
    \ write a defining table to help you understand it.\n- Develop an algorithm for\
    \ a common task.\n- Understand the basic operations that a computer can perform.\n\
    - Learn the three basic control structures: sequence, selection, and repetition,\
    \ and learn what they cause a computer to do.\n\n### Defining Table\n\nAn **algorithm**\
    \ is simply a list of steps to perform some task. A large computer program contains\
    \ many algorithms. Before creating an algorithm to solve a problem, you must be\
    \ sure that you understand the problem. If you don't, you will probably create\
    \ an algorithm that solves the wrong problem. A **defining table** is a useful\
    \ tool to help you understand a problem before you develop an algorithm to solve\
