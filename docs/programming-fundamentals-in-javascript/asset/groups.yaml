    \ 29 类似。你的程序必须使用循环来读取十个数字并计算这些数字之和。\n\n**图 29**：计算十个数字平均值的 HTML 文档和 JavaScript\
    \ 程序。\n\n11. 编写一个定义表和一个程序，构建并显示一个 12x12 的乘法表。\n\n# 第 9 章。函数\n\n由于大多数计算机程序都很大，计算机程序员会将程序分成若干部分。程序的一部分被称为模块（module）。在\
    \ JavaScript 中，执行操作的最小模块是函数，它有时被称为方法（method）。JavaScript 程序中的几乎语句都必须写在函数内部。\n\n\
    “函数”一词源于数学，它是一个概念名称，即一个值（函数的参数）完全决定另一个值（函数的结果）。考虑带有另一个 $x$ 的函数 $f$：$f(x)=2x-1$。我们可以用任何数字替换\
    \ $x$，这会完全决定 $f$ 的结果。例如，用 5 替换 $x$ 得到函数的结果为 9：$f(5)=2(5)-1=9$。计算机程序中的函数工作方式类似，接收参数并产生结果。\n\
    \n# 本章学习目标\n\n在本章结束时，你将：\n\n- 编写接受并使用参数的函数。\n- 编写从函数返回值到其调用点的代码。\n- 编写调用函数并向该函数传递参数的代码。\n\
