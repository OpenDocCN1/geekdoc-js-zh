    +   3. Assign a value to a variable or memory location


    +   4. Perform arithmetic Operators: – (negation), * (multiplication), / (division),
    % (modulus), + (addition), – (subtraction)


    +   5. Compare two values Relational operators: < (less than), <= (less than or
    equal), > (greater than), >= (greater than or equal), == (equal), != (not equal)


    +   6. Repeat a group of actions


    +   7. Call a function and return from that function


    You will study and use each of these basic computer operations in later chapters
    of this text.


    # Control Structures


    There are five different categories of control structures that you can use to
    control the order in which a computer executes the statements in your program.
    They are called control structures because they control the order in which the
    computer executes statements also called the flow of execution.


    sequence causes the computer to execute statements in the order they are written
    in a program, from top to bottom. This is the default control structure.


    selection causes the computer to select one group of statements to execute and
    another group or groups to skip. This is'
