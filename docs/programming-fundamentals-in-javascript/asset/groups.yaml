    \na\nb\nc\nd\ne\n\n![](img/7ea917145c99e19be973d71c03bf910b_16_0.png)\n\n> 图 1：常见半导体的照片：a)\
    \ 电容器，b) 二极管，c) 发光二极管，d) 电阻和 e) 晶体管。\n\n- 6. 集成电路 – 由刻在小硅片上的许多（可能数十亿）半导体组成的电路；有时被称为计算机芯片。\n\
    \n# 计算机的部件\n\n现代计算机是由两个主要部分组成的电子机器：硬件和软件。计算机硬件是计算机的物理部分，如键盘、鼠标、CPU、硬盘、内存、显示器和打印机。一个帮助你记住硬件是计算机物理部分的简单记忆法是：物理部分是“硬的”（hard）。如果有人向你扔一块计算机硬件并撞到了你，你会疼。当然，计算机的每个部分都有其特定的用途。以下是常见计算机硬件部分的列表。\n\
    \n- 7. 电源 – 一种电路，将来自墙上插座的电（通常是 115 伏、60 赫兹交流电 AC）转换为计算机可以使用的电（如 3.3 伏直流电 DC）。\n\
    - 8. 键盘 – 一种允许用户通过按键向计算机输入数据的输入设备。\n- 9. 主板 – 计算机其他部分连接在上面的主电路板。图 2 显示了一个没有连接\
    \ CPU、主内存或其他设备的主的主板。\n\n![](img/7ea917145c99e19be973d71c03bf910b_17_0.png)\n\n\
    **图 2**：计算机主板。\n\n- 10. 总线 – 在主板上将数据从一个组件传输到另一个组件的线路和集成电路。\n\n- 11. BIOS – 基本输入输出系统的缩写；通常是安装在主板上的闪存，包含了计算机启动时\
    \ CPU 执行的指令。\n- 12. CPU – 中央处理单元的缩写；一种在计算机内进行大部分计算的、昂贵的集成电路。\n\n![](img/7ea917145c99e19be973d71c03bf910b_18_0.png)\n\
    \n- 13. 缓存 – 一种临时存储数据和指令的快速内存，通常位于 CPU 上。当 CPU 需要计算数据时，它可以从缓存中获取数据，而不需要等待数据通过总线从主内存传输。缓存是易失性的，意味着当关闭计算机或移除电源时，缓存将会丢失。\n\
    \n**图 3**：Intel i7 CPU 的顶部和底部。图片由 Intel 提供。\n\n- 14. 主内存 – 为 CPU 临时存储数据和指令的集成电路；有时称为随机存存储器（RAM）。主内存是易失性的，意味着当关闭计算机时，主内存的内容将会丢失。\n\
    \n图 4：4 吉字节（GB）的 DDR 随机存存储器。照片由 neweggg.com 提供。\n\n- 15. 硬盘 将数据半永久地存储在旋转的盘片上，盘片上的微小斑点被磁化。\n\
    \n![](img/7ea917145c99e19be973d71c03bf910b_19_0.png)\n\n![](img/7ea917145c99e19be973d71c03bf910b_19_1.png)\n\
    \n图 5：去掉了盖子的硬盘。\n\n- 16. CD 或 DVD 驱动器 – 使用激光在磁盘上半永久地读写数据。紧光盘（CD）和数字多功能光盘（DVD）是非失性的。\n\
    - 17. 移动硬盘、U 盘或闪存盘 – 一种可以用电方式读取、写入和擦除半永久内存。移动硬盘、U 盘和闪存盘是同一种内存设备的不同名称，它们在闪存中存储数据。固态硬盘不像普通硬盘将数据存储在盘片上，而是存储在闪存中。闪存是非失性的。\n\
    \n- 18. 显示器 – 用于为用户显示消息、图像等的输出设备。\n\n# 数据大小\n\n以下每个术语都是计算机存储或处理的数据量的衡量。\n\n- 19.\
    \ 位（bit） – 二进制数字的缩写。二进制数字是二进制数中的一列，可以出现 0 或 1。\n- 20. 字节节（nibble） – 四个位组合成的二进制数。这个名称是计算机内部的笑话，因为一个字节节是一个字节的一半。\n\
    - 21. 字节（byte） – 八个位组合成的二进制数。\n\n"
