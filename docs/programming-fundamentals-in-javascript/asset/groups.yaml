    \n对于后测试循环，循环内部的语句至少会被执行一次，因为当计算机遇到循环时，它会先执行循环内部的语句，然后再评估循环条件。\n\n预测试循环的使用频率比后测试循环得多。事实上，所有的后测试循环都可以重写为预测试循环，因此在编程语言中后测试循环并不是严格必要的，但有时使用起来非常方便。\n\
