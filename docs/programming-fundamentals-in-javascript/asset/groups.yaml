    \ is false. |\n| || Inclusive Or (Or) | Binary operator that combines two conditions,\
    \ and the combined condition is true, if either both conditions are true, otherwise\
    \ the combined condition is false. |\n| ^ Exclusive Or (Or) | Binary operator\
    \ that combines two conditions, and the combined condition is true, if and only\
    \ one condition is true and the other is false, otherwise the combined condition\
    \ is false. |\n\nNotice that Inclusive Or is often abbreviated as Or, and Exclusive\
