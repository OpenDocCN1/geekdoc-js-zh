    var dayOfMonth = now.getDate();

    var dayOfWeek = now.getDay();

    ```


    If you use the above, the month will hold 0 if the current month is January, 1
    if February, and so on to 11 in December. The dayOfMonth will hold 1 for the first
    day of the month up to 28, 29, 30, or 31 for the last day of the month. The dayOfWeek
    will hold 0 if today is Sunday, 1 if today is Monday, and so on to 6 if Saturday.


