- md: "\n# Operator Precedence Revisited\n\nThe following table shows the precedence\
    \ for all the JavaScript arithmetic operators shown in this chapter.\n\n| Operator(s)\
    \ | Name(s) | Precedence |\n| --- | --- | --- |\n| ( ) | parentheses | Highest\
    \ (evaluated first) |\n| ++ -- | increment, decrement | |\n| * / % | multiplication,\
    \ division, modulus | |\n| + - | addition, subtraction | |\n| = += -- = * /= %=\
    \ | assignment operators | Lowest (evaluated last) |\n\nRemember that the pre-increment\
    \ is always executed before the rest of the arithmetic in the same statement,\
    \ and the post-increment, even though it has a higher precedence, is always executed\
    \ after the rest of the arithmetic in the same statement.\n\n# Math Object\n\n\
    The Math object is an object (see chapter 11) built into JavaScript that enables\
    \ a program to perform more advanced mathematical computations. It contains the\
    \ following mathematical constants and functions, all of which must be preceded\
    \ by \"Math.\" when you use them in a program.\n\n# Math Object Constants\n\n\
    ## Math Object Constant Algebraic Approximate Value\n\n| Constant | Description\
    \ | Algebraic Expression | Approximate Value |\n| --- | --- | --- | --- |\n| E\
    \ | Euler’s number | e | 2.71828 |\n| LN2 | Natural logarithm of 2 | ln 2 | 0.69315\
    \ |\n| LN10 | Natural logarithm of 10 | ln 10 | 2.30259 |\n| LOG2E | Base-2 logarithm\
    \ of Euler’s number | log₂e | 1.44270 |\n| LOG210 | Base-10 logarithm of Euler’s\
    \ number | log₁₀e | 0.43429 |\n| PI | Ratio of a circle’s circumference to its\
    \ diameter | π | 3.14159 |\n| SQRT1_2 | Square root of ½ | √½ | 0.70711 |\n| SQRT2\
    \ | Square root of 2 | √2 | 1.14121 |\n\n# Math Object Functions\n\n| Function\
    \ | Description |\n| --- | --- |\n| abs(x) | absolute value of x |\n| acos(x)\
    \ | arccosine of x in radians |\n| asin(x) | arcsine of x in radians |\n| atan(x)\
    \ | arctangent of x as a numeric value in the range [–n/2, n/2] radians |\n| atan2(y,\
    \ x) | arctangent of the quotient of its arguments |\n| ceil(x) | smallest integer\
    \ that is larger than or equal to x |\n| cos(x) | cosine of an angle x (x is in\
    \ radians) |\n| exp(x) | Euler’s number raised to the power of x ( eˣ ) |\n| floor(x)\
    \ | largest integer that is smaller than or equal to x |\n| log(x) | natural logarithm\
    \ of x (ln x) |\n| max(x, y, z...) | largest value of many numbers |\n| min(x,\
    \ y, z...) | smallest value of many numbers |\n| pow(y, x) | y raised to the power\
    \ of x ( yˣ ) |\n| random() | a pseudo random number in the range [0.0, 1.0) |\n\
    | round(x) | integer that is nearest x |\n| sin(x) | sine of an angle x (x is\
    \ in radians) |\n| sqrt(x) | square root of x |\n| tan(x) | tangent of an angle\
    \ x (x is in radians) |\n\n# Volume of a Cylinder\n\nIf we know the radius and\
    \ height of a cylinder, we can compute the volume of that cylinder using the formula:\
    \ $v = \\pi r^2 h$ where $v$ is the volume, $r$ is the radius, and $h$ is the\
    \ height of the cylinder. This formula can be written in JavaScript as shown in\
    \ the next example. Notice the use of the built-in JavaScript Math.PI.\n\n![](img/7ea917145c99e19be973d71c03bf910b_84_0.png)\n\
    \n# Example 23\n\n```\nvar v = Math.PI * r * r * h;\n```\n\n| Desk Check r | h\
    \ | v |\n|---|---|---|\n| 2.7 | 5 | |\n\n# Distance between Two Points\n\nWe can\
    \ compute the distance between two points $p_1$ and $p_2$ in two-dimensional Cartesian\
    \ space as shown in figure 15 with the formula:\n\n```\n$d = \\sqrt{(x_2 - x_1)^2\
    \ + (y_2 - y_1)^2}$\n```\n\n$d$ is the distance between the points, point $p_1$\
    \ has the coordinates $(x_1, y_1)$, and point $p_2$ has the coordinates $(x_2,\
    \ y_2)$.\n\nExample 24 contains a program that reads the $x$ and $y$ values for\
    \ two points from a user, and computes and outputs the distance between those\
    \ two points. Notice the code at line 14 combines into a single line, the code\
    \ to read text from a text field and the code to convert that text into a number.\
    \ In previous programs, these two steps were written separately like this:\n\n\
    ```\nvar text =\ndocument.getElementById('xInput').value;\nvar x1 =\nparseFloat(text);\n\
    ```\n\nIn example 24, these two steps are combined by wrapping parseFloat around\
    \ the code to get the input, like:\n\n```javascript\nvar text = parseFloat(document.getElementById('xInput').value);\n\
    ```\n\n![](img/7ea917145c99e19be973d71c03bf910b_85_0.png)\n\nCombining these two\
    \ steps into one line of code is convenient for the programmer and reduces the\
    \ number of lines. In fact, example 24, there are four lines of code, lines 14–17,\
    \ that combine the input step and the convert step.\n\n# Example 24\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Distance</title>\n\
    </head>\n<script>\n/* Input: x and y for two points: x1, y1, x2, y2\n * Processing:\
    \ Calculate the distance between the two points.\n * Output: the distance\n*/\n\
    function distance() {\n  // Get the coordinates for two points from the user.\n\
    \  var x1 = parseFloat(document.getElementById('x1Input').value);\n  var y1 =\
    \ parseFloat(document.getElementById('y1Input').value);\n  var x2 = parseFloat(document.getElementById('x2Input').value);\n\
    \  var y2 = parseFloat(document.getElementById('y2Input').value);\n\n  // Compute\
    \ the distance between the two points.\n  var dx = x2 - x1;\n  var dy = y2 - y1;\n\
