    \ of the day of the week for that date. For example, if the user entered “2016/05/22”,\
    \ your program would output “Sunday”. Hint: your program should create a Date\
    \ object and use the method Date.getDay().\n2. Write a program that allows a user\
    \ to enter two dates in the format YYYY/MM/DD and outputs the difference in days\
    \ between those two dates. Hint: your program should\n    a. create two Date objects\n\
    \    b. call the Date.getTime() method for both objects which will return the\
    \ number of milliseconds since January 1, 1970\n    c. subtract the millisecond\
    \ values\n    d. divide the difference by 86400000 (1000 * 60 * 60 * 24) to convert\
    \ from milliseconds to days\n3. Mother’s Day is celebrated in the United States\
    \ on the second Sunday of May. Write a program that allows a user to enter a year\
    \ and then outputs the date that Mother’s Day will be celebrated in that year.\
    \ For example, if the user entered 2018, your program would output “Sunday, May\
    \ 13, 2018” (without the quotes).\n4. Father’s Day is celebrated in the United\
    \ States on the third Sunday of June. Write a program that allows a user to enter\
    \ a year and then outputs the date that Father’s Day will be celebrated in that\
    \ year. For example, if the user entered 2018, your program would output “Sunday,\
    \ June 17, 2018” (without the quotes).\n\n# Chapter 12. Strings\n\nWithin a computer\
    \ program, the term string refers to a string of text or a group of characters\
    \ strung together. When writing JavaScript code, a good way to visualize a string\
    \ is as an array of individual characters inside an object with 0 as the index\
    \ of the first character.\n\n# Chapter Outcomes\n\nBy the end of this chapter,\
    \ you will be able to:\n\n- Create strings that include special characters as\
    \ escape sequences.\n- Use the length attribute of a string.\n- Access a single\
    \ character within a string.\n- Compare two strings.\n- Use the built-in string\
    \ methods.\n\n# Creating a String\n\nTo create a string you can use a string literal\
    \ inside single ('') or double (\") quotes or the new keyword.\n\n# Templates\n\
    \n```javascript\nvar name = 'any text here';\nvar name = \"any text here\";\n\
    var name = new String(thing);\n```\n\nwhere thing is any valid JavaScript expression\
    \ to be converted to a string.\n\n# Example 1\n\n```javascript\nvar title = 'Oh\
    \ Say, what is Truth?';\nvar other = \"Truth Reflects upon Our Senses\";\nvar\
    \ another = new String('Put Your Shoulder to the wheel');\n```\n\n# Example 2\n\
    \n```javascript\nvar x = 3;\nvar s = new String(x);\n```\n\n# String Concatenation\n\
    \nTo create a large string of text from smaller strings you can use the plus operator\
    \ (+). For example:\n\n# Example 3\n\n```javascript\nvar name = \"Samantha\";\n\
    var message = \"Hello, \" + name + \". How you today?\";\n```\n\n![](img/7ea917145c99e19be973d71c03bf910b_244_0.png)\n\
    \n# Escape Sequences\n\nOccasionally you will want to include single or double\
    \ quotes or other special characters in a string literal by placing a backslash\
    \ (\\) immediately before it. \n\n# Escape Sequences\n\n| Character | Description\
    \ |\n|---|---|\n| \\b | Backspace |\n| \\f | Form feed |\n| \\n | New line |\n\
    | \\r | Carriage return |\n| \\t | Horizontal tab |\n| \\v | Vertical tab |\n\
    | \\0 | Null character |\n| ' | Single quote |\n| \" | Double quote |\n| \\ |\
    \ Backslash |\n\n# Example 4\n\n```javascript\nvar quote = \"Never give in!\"\
    ;\nvar greek = 'The first letters of Greek alphabet are α, β, γ, δ';\n```\n\n\
    Within a string literal, the backslash at the end of a line allows the string\
    \ to continue on the next line. This includes characters other than English.\n\
    \n# Unicode Sequences\n\nBecause a JavaScript string is an object, each string\
    \ has several methods that you can call. The charat method does the same thing\
    \ as the bracket operators: retrieve the character at a given location.\n\n# Example\
    \ 5\n\n```javascript\nvar title = 'Carry On';\nvar c = title[4]; // the variable\
    \ c will hold 'y'\n```\n\n# Example 6\n\n```javascript\nvar title = 'Carry On';\n\
    var c = title.charAt(4); // displays length\n```\n\n# Reversing a String\n\nOccasionally\
    \ you will want to reverse the order of the characters in a string. This is easily\
    \ done with a loop and string concatenation.\n\n# Example 7\n\n```javascript\n\
    // Returns a new string that contains the\n// characters as the string s but in\
    \ reverse\norder.\nfunction reverse(s) {\n  var rev = '';\n  for (var i = s.length\
    \ - 1; i >= 0; i--) {\n    rev += s[i];\n  }\n  return rev;\n}\n```\n\n# Comparing\
    \ Strings\n\nTo compare strings in JavaScript, you can use the relational operators\
