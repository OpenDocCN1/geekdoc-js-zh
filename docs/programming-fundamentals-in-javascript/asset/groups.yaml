    a. ASCII\nb. Unicode\n\n## 第二章 算法与计算机程序\n\n### 目标\n\n在本章结束时，你能够：\n\n- 读取问题描述并编写定义表以帮助理解。\n\
    - 为常见任务开发算法。\n- 理解计算机可以执行的基本操作。\n- 学习三种基本的控制结构：顺序、选择和重复，并了解它们产生的结果。\n\n### 定义表\n\
    \n**算法**仅仅是执行某些任务的步骤列表。大型计算机程序包含许多算法。在创建解决问题的算法之前，你必须确定你理解了问题。如果不确定，你可能会创建一个解决错误的算法。**定义表**是在开发算法之前帮助你理解问题的有用工具。定义表有三个部分：输入、处理和输出。创建定义表，只需画一个带有三个部分的表格。然后当你阅读和反复阅读问题时，将问题的各个部分放入表格的相应区域。\n\
    \n### 示例 1\n\n你在一家大型建筑公司工作。你的老板让你写一个计算机程序，读取建筑的窗户列表，计算并输出所有窗口的总成本。窗户以英寸为单位输入，宽度在前，高度在后。窗口的成本计算方法是将其平方英尺面积乘以\
