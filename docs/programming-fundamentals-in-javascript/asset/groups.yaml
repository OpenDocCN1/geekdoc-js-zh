    # Preface


    Learning to program a computer is a frustrating task for many students. In my
    teaching experience, I have found that much of this frustration comes because
    students are not shown enough programming examples. All of us learn by watching
    others, so why should learning to program a computer be any different? I wrote
    this book with minimal text but filled with computer programming examples and
    many hands on exercises to help begin students learn computer programming more
    efficiently and thoroughly with less frustration.


    # How to Use This Book


    You can use this book as a tutorial or a reference. When using it as a tutorial,
    you will find it helpful to step through the example code line by line as if you
    were a computer. Doing this is sometimes called a desk check because you are checking
    the code on paper or “at your desk” instead of running it on a computer. To aid
    you in desk checking the example code, I have provided desk check locations throughout
    the book. Each desk check location includes a list of all the variables in the
    corresponding example code and values for the input variables. To perform a desk
    check, step through the code as if you were the computer and change the value
    of each variable just as the computer would.


    # Conventions'
