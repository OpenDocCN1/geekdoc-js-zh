    # # Chapter 2. Algorithms and Computer Programs


    # ## Chapter Outcomes


    By the end of this chapter, you will:


    +   - Read a description of a problem and write a defining table to help you better
    understand the problem.

    - Develop an algorithm for a common task.

    - Understand the basic operations that a computer can perform.

    - Learn the three basic control structures: sequence, selection, and repetition,
    and learn what they cause a computer to do.


    # ## Defining Table


    An **algorithm** is simply a list of steps to perform some task. A large computer
    program contains many algorithms. Before creating an algorithm to solve a problem,
    you must be sure that you understand the problem. If you don''t, you will probably
    create an algorithm that solves the wrong problem. A **defining table** is a useful
    tool to help you better understand a problem before you develop an algorithm to
    solve it. A defining table has three sections: input, processing, and output.
    To create a defining table, simply draw a table with the three sections. Then
    as you'
