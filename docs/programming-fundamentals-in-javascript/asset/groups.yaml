    \ age 已经存在且是一个有效的数字。\n`if (age >= 30); {`\n7. 下一个 if 语句有错误。请重写使其正确。假设变量 age 已经存在且是一个有效的数字。\n\
    `if (age <= 55) {`\n8. 给定以下 JavaScript 代码，计算机将向用户输出什么？\n```\nvar x = 1, y = 7;\n\
    var message = \"Welcome\";\nif (x < 2) {\n  if (y > 10) {\n    message = \"Hello\"\
    ;\n  }\n} else {\n  message = \"Goodbye\";\n}\nalert(message);\n```\n9. 给定以下 JavaScript\
