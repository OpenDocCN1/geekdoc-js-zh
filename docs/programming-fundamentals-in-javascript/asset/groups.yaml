    # Chapter 11. Objects


    When a programmer writes a large program, it is difficult for the programmer to
    keep all the code organized. One way to keep the code in a large program organized
    is to use object oriented programming. **Object oriented programming** is a way
    of viewing the world and designing and implementing software that matches the
    world.


    # Chapter Outcomes


    By the end of this chapter, you will:


    +   * Understand the terms object and class

    * Understand object-oriented relationships aggregation, composition, dependency,
    and association

    * Understand multiplicities applied to aggregation, composition, and association

    * Read a UML class diagram

    * Create a JavaScript object from a built-in prototype object

    * Add an attribute to a JavaScript object

    * Read the value of an attribute from a JavaScript object

    * Call a function from a JavaScript object

    * Use a JavaScript object as a dictionary

    * Store and retrieve data from the built-in localStorage object

    * Understand how to change HTML elements in the document object model (DOM)


    # Objects and Classes


    An **object** is anything in the world that has these four things:


    Identity


    a unique name or identification number'
- md: '

    Data


    These are characteristics of an object and are usually adjectives. These are also
    called attributes, properties, characteristics, fields, instance variables, or
    structure.


    Behavior are the things that an object does and usually verbs. These are also
    called methods, operations, functions, or procedures.


    Relationships links or connections between objects.


    A class is both a group of similar objects and a pattern for creating objects.
    Since an object has identity, data, behavior, and relationships and since a class
    is a pattern for creating objects, then a class must have those four things as
    well.


    # Unified Modeling Language


    Many programmers use diagrams to design and document the classes and objects in
    their programs. The most common language used for these is the Unified Modeling
    Language (UML). One type of diagram in the class diagram.


    | Student | Course |

    | --- | --- |

    | -firstName | -number |

    | -lastName | -title |

    | -address | -description |

    | -phone | -location |

    | +changeName() | +open() |

    | +register() | +allowStudent() |

    | +attendClass() | +close() |

    | +withdraw() | |


    Figure 41: A UML class diagram showing two classes. Figure 41 shows a UML class
    diagram with two classes. Within a class diagram, each class is shown as a rectangle
    usually with three sections. The first section contains the name of the class.
    The second section contains a list of the data all objects created from the class
    will have. The third section contains a list of the behaviors that all objects
    created from the class will have.


    # Relationships


    There are several different relationships that can exist between objects or classes.
    Relationships between classes are shown as different types of lines connected
    to the classes.


    ### Aggregation


    A relationship between two objects such that one object contains the other object.
    This is sometimes called a whole-part relationship. In order to use aggregation
    between two objects *whole* and *part*, one of these English phrases must make
    sense: *whole* contains *part* or *whole* has a part. UML symbol for aggregation
    is a solid line with an unfilled diamond connected to the containing class:


    ![](img/7ea917145c99e19be973d71c03bf910b_228_0.png)


    ### Composition


    A relationship between two objects such that one object contains the other object
    and the contained object may not be shared. This is also a whole-part relationship
    and a strong form of aggregation. In order to use composition between two objects
    *whole* and *part*, one of these English phrases must make sense: *whole* contains
    *part* or *whole* has a part. UML symbol for aggregation is a solid line with
    a filled diamond connected to the containing class:


    ![](img/7ea917145c99e19be973d71c03bf910b_228_1.png)


    ### Inheritance


    A relationship between two classes that causes the child class to automatically
    have everything (data, behavior, and relationships) that the parent class has.
    In order to use inheritance between two objects *parent* and *child*, one of these
    English phrases must make sense: *child* is a kind of parent or *child* is a *parent*.
    The UML symbol for inheritance is a solid line with an unfilled triangle connected
    to the parent class:


    | Parent | Child |

    | --- | --- |


    ### Dependency


    Dependency relationship between two objects such that one object requires or uses
    the other object to accomplish a task. In order to use dependency between two
    objects $x$ and $y$, one of these English phrases must make sense: $x$ uses $y$,
    $x$ requires $y$, or $x$ needs $y$. The UML symbol for dependency is a dashed
    line with an open arrow head connected to the required or needed class:


    | Needed | Needy |

    | --- | --- |


    ### Association


    Association general relationship between objects. When two objects are related
    but the relationship is not aggregation, composition, inheritance, or dependency,
    then use association. The UML symbol for association is a solid line:


    | A | B |

    | --- | --- |


    # Multiplicities


    Multiplicities are small numbers and punctuation at one or both ends of a relationship
    that constrain the relationship. A single number multiplicity constrains a relationship
    to exactly that number of objects.


    | Carton | Egg |

    | --- | --- |

    | 1 | 12,18 |


    **Figure 42:** A UML class diagram showing two classes with multiplicities. Two
    or more numbers separated by commas constrain a relationship to exactly one of
    those numbers of objects. Two numbers separated by two periods (..) constrain
    a relationship to a range of objects. For example, multiplicities may be used
    to show that one carton has either 12 or 18 eggs inside it as shown in figure
    42.


    # Multiplicity Examples


    | Multiplicity | Meaning |

    | --- | --- |

    | 1 | Exactly one |

    | 4,8 | Exactly four or exactly eight |

    | 0,1 | Zero or one, also known as optional |

    | 0..1 | Zero or one, also known as optional |

    | 12..18 | Between 12 and 18 inclusive |

    | 0..* | Zero or more |

    | * | Zero or more |

    | 1..* | One or more, also known as at least one |

    | 3..* | Three or more, also known as at least three |


    # Example 1


    Label the parts of this UML class diagram, including class, attributes, operations,
    aggregation, composition, inheritance, association, and multiplicities.


    ![](img/7ea917145c99e19be973d71c03bf910b_228_0.png)


    # Example 2


    The following diagram shows many of the elements of the JavaScript language and
    the relationships among them. The relationships are shown using UML symbols.


    ![](img/7ea917145c99e19be973d71c03bf910b_228_0.png)


    # JavaScript Built-in Objects


    | Object Name | Purpose |

    | --- | --- |

    | Array | Stores multiple values as a single variable |

    | Boolean | Stores either true or false |

    | Date | Stores a date and time |

    | Number | Stores a numeric value |

    | String | Stores text |

    | RegExp | Used to match patterns in text |


    # Other JavaScript Objects


    | Name | Purpose |

    | --- | --- |

    | Math | Contains constants and functions used in calculations |

    | window | An open window in a browser where an HTML document is |

    | document | The HTML document that is open in a window |


    # Declaring an Object


    Just like a variable must be declared before it can be used in a program, an object
    must also be declared. To declare an object in JavaScript, a programmer writes
    the keyword var followed by the object''s name, exactly the same as declaring
    a variable.


    ```

    var objName, objName2, ... objNameN;

    ```


    # Example 3


    ```

    var now;

    var s;

    ```


    # Creating an Object


    Declaring an object in JavaScript does not cause the computer to reserve space
    in memory for the attributes of the object. To do this, a programmer must also
    create the object. All objects are created in JavaScript using the keyword new.
    In many programming languages, a programmer must write the name of a class after
    the new keyword. However, JavaScript doesn''t have classes, but instead prototype
    objects. So, after writing the new keyword, a JavaScript programmer must write
    a prototype object''s name.


    ```

    objectName = new PrototypeName(arg1, arg2, ... argN);

    ```


    # Example 4


    ```

    now = new Date();

    s = new String();

    ```


    In the previous example, the first line of code causes the computer to create
    a Date object that will hold the date and time of the moment that it is created
    in the computer''s memory. The second line causes the computer to create an empty
    String object. It is possible to combine an object declaration and creation into
    a single statement.


    # Example 5


    ```

    var now = new Date();

    var date = new Date(''2015/04/25'');

    var s = new String();

    var n = new Number(103.7);

    ```


