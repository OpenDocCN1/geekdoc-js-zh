    # # Appendix A. Operator Precedence


    Operator precedence determines the order in which the computer evaluates operators.
    Operators with higher precedence are evaluated first. For example, $7 + 3 * 2$
    is $13$ because multiplication has a higher precedence than addition, so the computer
    performs the multiplication before the addition.


    # ## Associativity


    Operator associativity determines the order in which the computer evaluates operators
    of the same precedence. There are two categories of associativity, left to right
    and right to left. Consider the expression: $a\ OP_1\ b\ OP_2\ c$


    # ### Left to Right Associativity


    If $OP_1$ and $OP_2$ have the same precedence and left associativity (left to
    right) then the computer will evaluate the expression as: $(a\ OP_1\ b)\ OP_2
    c$

    For example, the computer evaluates $3 - 5 + 4$ as $(3 - 5) + 4$ which is $2$.


    # ### Right to Left Associativity


    If $OP_1$ and $OP_2$ have the same precedence and right associativity (right to
    left) then the computer will evaluate the expression as: $a\ OP_1\ (b\ OP_2\ c)$'
  - '[PAGE 266]


    For example, the computer evaluates a = b = 5 as a = (b = 5) by first storing
    5 in b, then storing the value of b in a.


    # Precedence


    Listed from highest precedence (evaluated first) to lowest precedence


    | Operator(s) | Name(s) | Associativity |

    |---|---|---|

    | ) | parentheses | n/a |

    | [ ] | member | left to right |

    | ++ | increment, decrement | n/a |

    | + - ! ~ | unary plus, negation, logical not, bitwise not | right to left |

    | * / % | multiplication, division, modulus | left to right |

    | - | addition, subtraction | left to right |

    | << >>> | bitwise shift | left to right |

    | > <= >= | relational | left to right |

    | == != | equality | left to right |

    | & | bitwise and | left to right |

    | ^ | bitwise exclusive or (xor) | left to right |

    | | | bitwise or | left to right |

    | && | logical and | left to right |

    | || | logical or | left to right |

    | ? : += - = | conditional | right to left |

    | *= /= %= | assignment operators | right to left |

    | <= >= >>> &= ^= |= | comma | left to right |'
