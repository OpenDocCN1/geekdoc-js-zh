    \ 4 | 8 |\n| 3 | 6 | 9 | 9 | 27 |\n\n10. Write a defining table and a program\
    \ that allows a user to enter ten numbers and then computes the average of those\
    \ numbers. The user interface should look similar to figure 29. Your program must\
    \ use a loop to read the ten numbers and compute the sum of those numbers.\n\n\
    **Figure 29**: An HTML document and JavaScript program that computes the average\
    \ of ten numbers.\n\n11. Write a defining table and a program that builds and\
    \ displays a 12 by 12 multiplication table.\n\n# Chapter 9. Functions\n\nBecause\
    \ most computer programs are very large, computer programmers divide their programs\
    \ into parts. A part of a program is called a module. In JavaScript the smallest\
    \ module that performs actions is a function, which is sometimes called a method.\
    \ Nearly all statements in a JavaScript program must be written inside a function.\n\
    \nThe term function comes from mathematics and is the name of the concept that\
    \ one value (the argument of the function) completely determines another value\
    \ (the result of the function). Consider the function $f$ with another $x$: $f(x)=2x-1$.\
    \ We can substitute any number for the $x$ which completely determines the result\
    \ of $f$. For example, substituting 5 for $x$ produces 9 as the result of the\
    \ function: $f(5)=2(5)-1=9$. Functions in a computer program work in a similar\
    \ way, taking arguments and producing results.\n\n# Chapter Outcomes\n\nBy the\
    \ end of this chapter, you will:\n\n- Write functions that accept and use parameters.\n\
    - Write code to return a value from a function to its call point.\n- Write code\
    \ to call a function and pass arguments to that function.\n- Write code to store\
    \ the result returned from a function in a variable.\n- Distinguish between a\
    \ parameter and an argument.\n- Distinguish between displaying output for the\
    \ user to see and returning a value to be used by the program.\n- Understand local\
    \ variable scope.\n\n# Writing a Function\n\nTo write a function in JavaScript,\
    \ simply type code that matches this template.\n\n# Template\n\n```javascript\n\
    functionName(param1, param2, ... paramN) {\n  statements;\n  return value;\n}\n\
    ```\n\nThe first line of a function is called the header or signature, and it\
    \ includes:\n\n1. the keyword function\n2. the function name\n3. the parameter\
    \ list\n\nThe function name must start with a letter, the underscore (_), or the\
    \ dollar sign ($). The rest of the name must be made of letters, digits (0–9),\
    \ the underscore, or the dollar sign. A function name cannot include spaces. A\
    \ function name should be meaningful and should describe curtly what the function\
    \ does. The parameter list contains data stored in variables that inside the function\
    \ needs to complete its task.\n\nThe statements inside a function are contain\
    \ as many statements as you wish to write inside it. However, it is a good idea\
    \ to limit functions to less than a page (60 lines). To return a result from a\
    \ function so that the result can be used elsewhere in your program, simply type\
    \ the keyword `return` followed by whatever value you want returned to the calling.\n\
    \n# Example 1\n\nWrite the header for function `drawCircle` that takes three parameters:\
    \ the x y values for the center of the circle and the radius of the circle, in\
