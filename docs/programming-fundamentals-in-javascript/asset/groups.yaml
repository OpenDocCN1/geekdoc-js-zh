- md: "\n```javascript\n// Code for females goes here.\n}\n```\n\nThe second code\
    \ statement, if (gender == 'F'), is unnecessary and simply clters the code and\
    \ makes more work for the computer. Instead that code example should be written\
    \ like this:\n\n```javascript\nif (gender == 'M') {\n  // Code for males goes\
    \ here.\n}\nelse {\n  // Code for females goes here.\n}\n```\n\nNotice that the\
    \ keyword else can be used by itself. When used in this way, the equivalent in\
    \ English is “everything else.” Consider this example code that gives a 40% discount\
    \ to minors, no discount to adults, and a 25% discount to senior citizens.\n\n\
    ```javascript\nrate:\nif (age < 18) {\n  // Code for minors goes here.\n  rate\
    \ = 0.4;\n} else if (age < 58) {\n  // Code for adults goes here.\n  rate = 0;\n\
    } else if (age < 100) {\n  // Code for senior citizens goes here.\n  rate = 0.25;\n\
    }\n```\n\nIn this age example, the third statement is not only unnecessary, it\
    \ is also awkward. What age should we write in the third statement? At advanced\
    \ age should the program stop considering someone senior citizen? There isn’t\
    \ a good answer to this question. Instead the correct way to write this code is\
    \ to remove the last if that statement and allow the else, by itself, to mean\
    \ “everyone else.”\n\n```javascript\nrate:\nif (age < 18) {\n  // Code for minors\
    \ goes here.\n  rate = 0.4;\n} else if (age < 57) {\n  // Code for adults goes\
    \ here.\n  rate = 0;\n}\nelse {\n    // Code for senior citizens goes here.\n\
    \    rate = 0.25;\n}\n```\n\n# switch\n\nUse when:\n\n- More than two choices\
    \ exist\n- Each choice is based on the same variable and uses equals (==)\n- Comparison\
    \ values are integer or string\n\n# Template\n\n```javascript\nswitch (variable)\
    \ {\n    case constValue1: statements; break;\n    case constValue2: statements;\
    \ break;\n    default: statements; break;\n}\n```\n\nA switch statement functions\
    \ like a group of connected if ... else if ... statements that all test one variable\
    \ for equality. When the computer executes a switch one at a time, it compares\
    \ the value of the variable in the parentheses with each case one at a time. The\
    \ computer skips statements for the cases that do not equal the value of the variable.\
    \ It executes the statements after the first case that equals the value of the\
    \ variable and continuing executing statements in the switch until it encounters\
    \ a break statement or the switch ends whichever happens first. If none of the\
    \ cases equals the value of the variable, the computer skips the statements in\
    \ all cases and executes the statements in the default case until it encounters\
    \ a break or the switch ends. The default case is optional.\n\n# Example 4\n\n\
    ```javascript\nvar registerDate;\nswitch (classStanding) {\n    case 'F':\n  \
    \      registerDate = \"Nov 23\";\n        break;\n    case 'S':\n      registerDate\
    \ = \"Nov 17\";\n      break;\n    case 'j':\n      registerDate = \"Nov 12\"\
    ;\n      break;\n    case 'N':\n      registerDate = \"Nov 6\";\n      break;\n\
    \    default:\n      registerDate = \"none\"\n      alert(\"unknown class standing\"\
    );\n      break;\n}\ndocument.getElementById('output').innerHTML = registerDate;\n\
    ```\n\n# Desk Check\n\n| classStanding | registerDate |\n| :--- | :--- |\n| |\
    \ 'j' |\n\n# Even Integers\n\nThe easiest way for a computer to determine if an\
    \ integer is even is to divide the number by two, and if the remainder of this\
    \ division is equal to zero, then the integer is even. The modulus operator performs\
    \ integer division and returns the signed remainder of the division. The code\
    \ example below uses the modulus operator to determine if an integer is even.\n\
    \n# Example 5\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Is Even?</title>\n<script>\n/* Input: An integer\n\
    \ * Processing: Determine if the integer is even or odd\n * Output: A message\
    \ that says the integer is even or odd\n */\nfunction isEven() {\n  // Get the\
    \ user input from a text field and convert to to a number.\n  var text = document.getElementById('integerInputBox').value;\n\
    \  var number = parseInt(text);\n\n  // choose a message.\n  var message;\n  if\
    \ ((number % 2) == 0) {\n    message = number + \" is an even integer\";\n  }\
    \ else {\n    message = number + \" is an odd integer\";\n  }\n\n  // display\
    \ the message to the user,\n  document.getElementById('outputDiv').innerHTML =\
    \ message;\n}\n</script>\n</head>\n<body>\nPlease enter an integer: <input type=\"\
    text\" id=\"integerInputBox\">\n<button type=\"button\" onclick=\"isEven()\">Is\
    \ Even?</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n# Desk\
    \ Check\n\n| text | number | number % 2 |\n| :--- | :--- | :--- |\n| \"8\" | |\
    \ |\n\n# Odd Integers\n\nBecause the result of the modulus operator is signed,\
    \ when determining if an integer is even or odd the result of the modulus operator\
    \ must always be compared to zero. Comparing the result to one will not work for\
    \ negative integers. Consider this JavaScript code and corresponding checks.\n\
    \n# Example 6\n\n```javascript\n// wrong! Doesn't work for negative integers!\n\
    if ((number % 2) == 1) {\n  document.getElementById('outputDiv').innerHTML = number\
    \ + \" is odd\";\n} else {\n  document.getElementById('outputDiv').innerHTML =\
    \ number + \" is even\";\n}\n```\n\n# Desk Check\n\n| number % 2 | output |\n\
    | :--- | :--- |\n| 5 | \"5 is odd\" |\n| -9 | \"-9 is even\" |\n\nNote that (number\
    \ % 2) == 1 works for positive integers whether they are even or odd. However,\
    \ in the desk check above it not work for negative integers. If you need to write\
    \ code that takes action only if an integer is odd, the correct way to write the\
    \ comparison is with not equal operator (!).\n\n# Example 7\n\n```javascript\n\
    // Correct check for integers\nif ((number % 2) != 0) {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + \" is odd\";\n}\n```\n\nSometimes a programmer will use bitwise (&)\
    \ operator to test if an integer is even as shown. Such code works but is a bad\
    \ solution for at least two reasons:\n\n- It is not as straight as using the modulus\
    \ operator.\n- It depends on the computer using two's complement representation\
    \ for integers. Admittedly, computers will continue to represent integers for\
    \ the foreseeable future.\n\n# Example 8\n\n```javascript\n// Correct, but poor\
    \ check for integers!\nif ((number & 1) == 0) {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + \" is even\";\n}\n```\n\nMany programmers write a test for even using\
    \ bitwise operator because it may execute faster than a test using the modulus\
    \ operator. However, the disadvantages of such code almost justify the very small\
    \ gain in execution speed, especially because modern compilers will automatically\
    \ optimize the compiled version of the statement using the modulus operator (number\
    \ % 2) == 0 to be the same as using bitwise operator ((number & 1)) == 0.\n\n\
    # Quadratic Formula\n\nA quadratic equation of the form $y = ax^2 + bx + c$ has\
    \ two solutions, also called roots, that may not be distinct and may be real or\
    \ complex. If you graph a quadratic equation, the roots are the locations where\
    \ the equation crosses the x-axis. Figure 2 contains the graph of three different\
    \ quadratic equations. Notice that the first equation (on the left) crosses the\
