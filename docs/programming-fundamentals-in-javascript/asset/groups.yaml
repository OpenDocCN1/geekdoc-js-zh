    \ statements inside the loop. A post-test loop has the condition at the bottom\
    \ of the loop. It is called a post-test loop because the condition is evaluated\
    \ after (post) the statements inside the loop are executed.\n\nWith a pre-test\
    \ loop, the statements inside the loop may never be executed. This is because\
    \ when the computer encounters the loop, the first thing the computer will do\
    \ is to evaluate the loop’s condition. If the condition evaluates to false, then\
    \ the statements inside the loop will not be executed.\n\nWith a post-test loop,\
    \ the statements inside the loop will always be executed at least once because\
    \ when the computer encounters the loop, it will first execute the statements\
    \ inside the loop, and then it will evaluate the loop’s condition.\n\nPre-test\
    \ loops are used much more frequently than post-test loops. In fact all post-test\
    \ loops can be rewritten as pre-test loops, so post-test loops are not strictly\
    \ necessary in a programming language, but they are sometimes convenient to use.\n\
    \n## Counting and Sentinel Controlled Loops\n\nLoops can also be categorized by\
