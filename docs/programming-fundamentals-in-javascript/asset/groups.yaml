    * 将数组合并为字符串。\n* 输出：排序后的文本项目列表\n*/\nfunction process() {\n  // 获取用户输入的文本。\n  var\
    \ text = document.getElementById('input').value;\n\n  // 将文本按每个新换行符\n  // 拆分为字符串数组。\n\
    \  var list = text.split('\\n');\n```\n\n![](img/7ea917145c99e19be973d71c03bf910b_212_0.png)\n\
    \n```javascript\n// 对字符串数组进行排序。\nlist.sort();\n\n// 将排序后的数组合并为由换行符分隔的字符串。\nvar\
    \ output = list.join('\\n');\n\n// 显示字符串供用户查看。\ndocument.getElementById('output').value\
    \ = output;\n</script>\n</head>\n```\n\n```html\n<<body>\n<textarea id=\"input\"\
    \ rows=\"16\" cols=\"20\"></textarea>\n<button type=\"button\" onclick=\"process()\"\
    >排序</button>\n<textarea id=\"output\" rows=\"16\" cols=\"20\"></textarea>\n</body>\n\
    </html>\n```\n\n# 数字的排序\n\n默认情况下，JavaScript 内置的 `sort` 函数按字典顺序对数组进行排序，这本质上是按字母顺序。如果你想对数字数组进行排序，就会出现问题。例如，这段代码将以一种意想不到的方式排序数字数组。\n\
    \n```javascript\nvar numbers = [ 7, 10, 8, 16, 3, 35 ];\n// 警告：这将按字典顺序而非数值顺序\n\
    // 对数字数组进行排序。\nnumbers.sort();\n```\n\n在之前的代码中，在计算机调用 `sort` 函数后，数组中的值将变为 [10,\
    \ 16, 3, 35, 7, 8]。默认情况下，JavaScript 内置的 `sort` 函数将 10 和 16 放在 3、7 和 8 之前，因为 10\
    \ 和 16 以 1 开头，且在字典顺序上 1 位于 3、7 和 8 之前。要强制 JavaScript 按照数值值对数组进行排序，我们必须向 `sort`\
    \ 函数传递一个比较函数。\n\n# 示例 24\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n\
    <head>\n<meta charset=\"utf-8\">\n<title>复利</title>\n<script>\n  * 输入：无用户输入\n\
    \  * 处理：测试 JavaScript 内置的 sort 函数\n  * 输出：数组在排序前的内容，\n  * 以及在排序后的内容。\n */\nfunction\
    \ testSort() {\n  var numbers = [ 7, 10, 8, 16, 3, 35 ];\n  document.getElementById('output').innerHTML\
    \ = numbers +\n  '<br>';\n  numbers.sort(compareNumbers);\n  document.getElementById('output').innerHTML\
    \ += numbers;\n}\n// 通过从第一个数减去第二个数来比较两个数，\n// 如果第一个数应该放在第二个数之前，\n// 则返回负数；如果两个数\n\
    // 相等，则返回零；如果第一个数应该\n// 放在第二个数之后，则返回正数。\nfunction compareNumbers(x, y) {\n  return\
    \ x - y;\n}\n</script>\n</head>\n<body>\n<button type=\"button\" onclick=\"testSort()\"\
    >排序数组</button>\n<div id=\"output\"></div>\n</body>\n</html>\n```\n\n你可能在想 `sort`\
    \ 函数是如何工作的。有很多不同的、众知的排序算法（选择排序、交换、插入、堆排序、快速排序等）。它们通过反复比较数组中的元素与数组中的其他元素，并简单地在数组中移动元素来工作。下面是使用插入排序算法对数组排序的\
    \ JavaScript 代码。插入排序是一种简单且相当快速的算法，尽管它通常没有快速排序算法快。\n\n# 示例 25\n\n```javascript\n\
    // 使用插入排序算法按升序\n// 指定数组的内容。\nfunction sort(list) {\n  var first = 0;\n  var last\
    \ = list.length - 1;\n  for (var i = last - 1; i >= first; i--) {\n    var swap\
