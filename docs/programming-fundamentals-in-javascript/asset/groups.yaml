    \ would see a sloping line, constantly increasing to the right as shown in Figure\
    \ 38.\n\n| list | x | i |\n|---|---|---|\n| [0] | [1] | [2] |\n| [3] | | |\n|\
    \ | | |\n| | | |\n\nFigure 38: A plot of constantly increasing values forming\
    \ a ramp.\n\n# Example 11\n\n```\n// Fills the specified array with constantly\
    \ increasing\n// values from 0 to list.length - 1, inclusive.\nfunction ramp(list)\
    \ {\n  // For each index in the array named list,\n  for (var i = 0; i < list.length;\
    \ i++) {\n    // store the value in i in the array.\n    list[i] = i;\n  }\n}\n\
    ```\n\n| list | i |\n|---|---|\n| [0] | [1] | [2] | [3] | [4] |\n\nOccasionally\
    \ we want to initialize an array to hold constantly decreasing values such as:\
    \ 5, 4, 3... This is known as a reverse ramp if you plotted the values in the\
    \ array, you would see a sloping line, constantly decreasing to the right as shown\
    \ in Figure 39.\n\n## Example 12\n\n```\n// Fills the specified array with constantly\
