    ## HTML Elements


    | Opening and Closing Tags | Purpose |

    | :--- | :--- |

    | `<!DOCTYPE HTML>` | The document type declaration that must appear at the top
    of all HTML 5 documents. Technically, this declaration is not a tag, so it has
    no closing tag. |

    | `<!-- a comment -->` | A comment or notes seen only by the developers and not
    the users of a page. A comment is not a true tag, so it has no closing tag. |

    | `<html lang="en-us"></html>` | Begins and ends an HTML document. These are the
    first and last tags of an HTML document. |

    | `<head></head>` | Marks the start and end of the HTML document head. Every HTML
    document must have one head. The head contains information such as the title and
    author of the document and most JavaScript code. |

    | `<meta>` | Provides information about a document, such as the author, descriptions,
    keywords, and the character encoding. (No closing tag.) |

    | `<title></title>` | Marks the title of a document. This tag should appear in
    the document head. |


    | Tag | Purpose |

    | :--- | :--- |

    | `<script>...</script>` | Marks the start and end of JavaScript code. You can
    place a <script> tag in the head or body of an HTML document, but they are normally
    placed in the head. |

    | `<body></body>` | Marks the start and end of the document body. Every HTML document
    must have one body. The body contains the main information of a document that
    the user will see. |

    | `<h1>...</h1>` | Marks the start and end of a level 1 heading. There are six
    different heading tags numbered from <h1> to <h6> with <h1> being the largest
