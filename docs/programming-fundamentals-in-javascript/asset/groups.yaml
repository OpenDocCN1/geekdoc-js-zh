    # 关于作者


    Rex A. Barzee 是杨百大学-爱达荷分校的计算机信息技术教授。他是两项美国专利的发明者，也是许多书籍的作者。他在杨百大学获得了计算机科学学士和硕士学位。在成为教授之前，他在工业界工作了八年，曾任职于西南研究院、惠普公司、Voyant
    Technologies 以及犹他州空间动力学实验室担任软件工程师。他曾参与过多个项目，包括 HP-UX 内核、HP-UX 标准 C 库、HP-UX OpenGL
    3D 图形库、全文索引、图像处理以及 VoiceXML 应用。您可以在 LinkedIn 上查看他的完整简介。


