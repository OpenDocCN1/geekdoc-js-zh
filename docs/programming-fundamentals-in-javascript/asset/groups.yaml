    | window | 浏览器中打开的窗口 |

    | document | 窗口中的 HTML 文档


    # 声明对象 (Declaring an Object)


    正如变量在使用之前必须声明一样，对象也必须声明。在 JavaScript 中声明对象，程序员编写 `var` 关键字后跟对象的名称。


    ```

    var objName, objName2, ... objNameN;

    ```


    # 示例 3


    ```

    var now;

    var s;

    ```


    # 创建对象 (Creating an Object)


    在 JavaScript 中声明对象不会导致计算机为属性留留空间。要这样做，程序员必须创建对象。所有对象都是使用 `new` 关键字创建的。在许多编程语言中，程序员在
    `new` 关键字之后编写类名。然而 JavaScript 没有类，而是原型对象。因此，在编写 `new` 关键字后，JavaScript 程序员必须编写原型对象的名称。


    ```

    objectName = new PrototypeName(arg1, arg2, ... argN);

    ```


    # 示例 4


    ```

    now = new Date();

    s = new String();

    ```


    在上一个示例中，第一行代码会导致计算机创建一个 Date 对象，存储其在内存中创建瞬间的日期和时间。第二行导致计算机创建一个空的 String 对象。可以将对象的声明和创建合并到一条语句中。


    # 示例 5


    ```

    var now = new Date();

    var date = new Date(''2015/04/25'');

    var s = new String();

    var n = new Number(103.7);

    ```


    也可以在一条 JavaScript 语句中声明、创建并初始化对象。

