    # About the Author


    Rex A. Barzee is a professor of Computer Information Technology at Brigham Young
    University – Idaho. He is an inventor of two United States patents and the author
    of numerous books. He earned a bachelor’s and a master’s degree in Computer Science
    from Brigham Young University. Before becoming a professor, he worked in industry
    for eight years as a software engineer for Southwest Research Institute, Hewlett-Packard
    Company, Voyant Technologies, and the Utah State Space Dynamics Laboratory. He
    worked on a variety of projects including the HP-UX kernel, the HP-UX standard
    C library, HP-UX OpenGL 3D Graphics Library, for full text indexing, image processing,
    and VoiceXML applications. You can see his full profile at LinkedIn.


