    |---|---|---|\n| 0 - 17 | 0 - 5 | $8.00 |\n| 0 - 17 | 6 - 10 | $6.00 |\n\n## Age\
    \ Games Attended Ticket Price\n\n| Age | Games Attended | Ticket Price |\n|---|---|---|\n\
    | 0 - 17 | 11 and up | $5.00 |\n| 18 - 54 | 0 - 10 | $10.00 |\n| 18 - 54 | 11\
    \ and up | $8.00 |\n| 55 and older | 0 - 10 | $8.00 |\n| 55 and older | 11 and\
    \ up | $6.00 |\n\nThis could also be solved using nested if statements as shown\
    \ in the next example.\n\n## Example 12\n\n```\n<!DOCTYPE HTML>\n<html lang=\"\
    en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Ticket Price</title>\n<script>\n\
    /* Input: A person's age and the number\n * of games that person has attended\n\
    \ * Processing: Determine the price to charge\n * that person for a ticket to\
    \ a game\n */\nfunction ticketPrice() {\n  var age =\n  parseInt(document.getElementById('ageBox').value);\n\
    \  var gamesAttended =\n  parseInt(document.getElementById('gamesBox').value);\n\
    \  var price;\n  if (age < 18) {\n    if (gamesAttended < 6)\n      price = 8.0;\n\
    \    else if (gamesAttended < 11)\n      price = 6.0;\n    else\n      price =\
    \ 5.0;\n  } else if (age < 55) {\n    if (gamesAttended < 11)\n      price = 10.0;\n\
    \    else\n      price = 8.0;\n  } else {\n    if (gamesAttended < 11)\n     \
    \ price = 8.0;\n    else\n      price = 6.0;\n  }\n}\ndocument.getElementById('priceDiv').innerHTML\
    \ = price;\n</script>\n</head>\n<body>\nAge: <input type=\"text\" id=\"ageBox\"\
    \ size=\"3\"><br>\nNumber of games attended: <input type=\"text\" id=\"gamesBox\"\
    \ size=\"3\"><br>\n<button type=\"button\" onclick=\"ticketPrice()\">Ticket Price</button>\n\
    <div id=\"priceDiv\"></div>\n</body>\n</html>\n```\n\n## Desk Check\n\n| age games\
    \ attended | price |\n|---|---|\n| 38 | 10.0 |\n\nSometimes nested if statements\
    \ can be a little tricky as shown in the following example which has two if statements\
