    \ you are checking. After the parenthesis is a *curly bracket* followed by some\
    \ lines of code and then an opposite *curly bracket*. Curly brackets are the way\
    \ that related code is grouped together in Javascript.\n\nCode between curly brackets\
    \ is often called a **block** of code. The block of code attached to the *if statement*\
    \ only runs if the statement is true.\n\n**If statements** only understand **true**\
