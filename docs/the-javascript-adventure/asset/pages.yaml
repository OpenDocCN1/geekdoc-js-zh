  md: '# Chapter 1: Hello World, Everybody’s First Program'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Computer programming is not hard, it just takes time. Don’t worry, it will
    be fun (most of the time). Enough talk, let''s get busy coding. All you need to
    start is a modern web browser and a basic text editor. Fortunately, most computers
    already have both of these installed.


    **Note:** For Windows we recommend using the **Notepad++** text editor. For Mac
    we recommend the **Text Wrangler** editor. **Google’s Chrome** is recommended
    for both platforms.


    Let’s write your first program.


    +   1. Open your browser and navigate to google.com (type "http://google.com"
    in the address bar and press enter).


    +   2. Right click on the page and select **Inspect element** from the context
    menu.


    ![](img/d20203a9468fea810d478d2b57511c96_9_0.png)


    The browser window should now be split. One part of the screen should still show
    the Google page and the other should have a bunch of technical options: **Network,
    Console, Elements** and so on. This is the **inspector**. The *inspector* is the
    main tool in the browser used for programming.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '3. In the Inspector look for a tab labeled Console and click on it. The console
    is where you make the programming magic happen.


    4. Typically somewhere in the console you will see > This is called the console
    prompt, or prompt for short.


    ![](img/d20203a9468fea810d478d2b57511c96_10_0.png)


    In computerese (the strange technical vocabulary of programming) the console is
    where you type commands, things you want the computers to do.


    5. Type this at the prompt and hit enter.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'alert("Hello World");


    If you typed everything correctly, a window should have popped up that said "Hello
    World".


    ![](img/d20203a9468fea810d478d2b57511c96_11_0.png)


    Congratulations! You have just written your first program. Let''s talk about what
    you just did.


    The console lives inside the inspector is the place where any valid commands will
    be executed. Anything that you type there that follows the rules of Javascript
    will be evaluated and performed.


    You basically told the browser to tell the user to show the message "Hello World".
    You did this by using the alert function. A function, sometimes called a method,
    is special code that tells the computer to do something. Functions are the verbs
    of computer languages. You may notice that there are parenthesis after the word
    alert. The parenthesis are a dead giveaway that you are using function. Whatever
    you put in the parenthesis can be used by the function. In computerese, the thing
    you put in the parenthesis is called a parameter or param for short.


    In the case of the alert function, you can put any words in the parenthesis and
    the browser will popup a window showing whatever you typed. In computerese, words
    are called strings. A string must begin and end with quotes. The quotes tell the
    computer to just read the text.


    In the console type:


    ```

    alert(Hello World);

    ```'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'When you hit enter you should see a nasty error. The browser is confused because
    it expected “Hello World” and got Hello World (no quotes).


    Lastly, you ended the command with a semicolon. In Javascript semicolon is like
    period at the end of a sentence. It tells the browser that the command statement
    is done. Semicolons are used to separate statements like periods separate sentences.


    We will explore functions and strings in detail later. For now get comfortable
    alerts. Did you know that you can type several alerts in a row to create a series
    of messages?


    ```

    alert(“Who''s afraid of the big bad wolf?");

    alert(“3 little piggies!");

    ```


    > **Note**: To type multiple line of code in the console without running them,
    you must hit SHIFT and ENTER together. This adds a new line and does not execute
    the code. Remember to press enter to run the code after you have finished typing!


    # Exercise


    Try writing a knock-knock joke with alerts.'
