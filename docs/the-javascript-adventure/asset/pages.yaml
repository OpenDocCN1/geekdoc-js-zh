- img_proc: true
  md: 'You could continue to write the game from top to bottom, but this would present
    some challenges that would be nearly impossible to overcome. In the last chapter,
    you learned how to make sure the player enters a name. This works great if they
    enter the name the second time, but if they don''t, then you have the exact same
    problem over and again.


    To overcome this, you can create a rule that says if the player doesn''t enter
    a name on the first or second try then she can''t play. The rule would look like
    this:


    ```

    /* Important game variable */

    varmyName = "Zultan Swack";

    var title = "The Legend of Princess Helga";

    var playerName = "";


    var screenText = "Please enter your name:";

    /* Show the game title." */

    alert(title);

    playerName = prompt(screenText);

    if (''playerName) {

    alert("You must enter a name");

    playerName = prompt(screenText);

    }

    if (''playerName) {

    alert("Sorry, you can''t play because you didn''t enter a name, game over.");

    }

    ```


    While you could technically do this, this is not a good idea because she made
    a mistake. Ideally, you''d like the player to enjoy the game simply because she
    made a mistake: to tell her she made a mistake and allow her to fix it so she
    can continue playing. The way we are coding now doesn''t allow this to happen.
    To make this possible we need to write some **functions**.


    You have seen built in *functions* like *alert* and *prompt*, but up until now
    we haven''t talked about writing your own. **Function** is a grouping or block
    of code that you want to reuse again and again. Functions are useful when you
    want to do the same thing in many different places. Instead of copying and pasting
    the same'
