  md: '![](img/d20203a9468fea810d478d2b57511c96_34_0.png)


    Several new things were introduced in the last example. Let''s looks at them one-by-one.


    A function is created or defined using the function keyword. This is followed
    by the name of the function. Functions can be named just anything that is not
    a keyword. The function''s name is followed by a pair of parenthesis. You can
    think of a function as a machine. Often, machines require you to put something
    inside of them to work. A lock needs a key, a car needs a driver and even a blender
    needs to work. The parenthesis are a way to provide a function with anything it
    may need to work. In the example above, it needs a string.


    The word inside of the function''s parenthesis is a special kind of variable called
    a parameter. You use these just like you a variable. The parameter can be used
    inside the function. That means, even if it has the same name as a regular variable,
    it is actually different.


    When you write the function''s name and pass it parameters (without the function
    keyword), this is known as calling the function. When you call the function, you
    tell the browser to do what is inside of its definition. In the example above
    you pass in some text to the myTest function when it is called. This function
    has one job to do; it shows a message to let you know if any text was put into
    the parameter. You already learned if statements; what is new here is the else
    statement.


    The else statement does what it says it does. It does something else if the else
    statement is related to it is false. Again, the curly brackets {} are how things
    like, if, else and function keep code separate. You can think of them as a code
    fence. Everything between a set of them belongs together.


    Functions will make more sense as you use them. Since you need the practice,'
