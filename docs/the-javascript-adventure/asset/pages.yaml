- img_proc: true
  md: 'with asterisk and and a slash. Comments are notes in the code for people to
    read and are ignored by the computer. Do not modify any of the code above this
    comment or any of the code below the comment that tells you such. These comments
    have the boundaries for you to write your code.


    **Note:** If you only have one line of comments you can use two slashes at the
    beginning of the line to create a comment.


    ```

    //This is a single line comment.

    ```


    Comments are important. Use them to describe what your code does. Comments serve
    another purpose too. You can use them to hide code from the computer.


    Below the comment above in the main.js file, type:


    ```

    /* alert("Hello World"); */

    ```


    Save the file and then grab the *index.html* file from the *mygame* folder and
    drop it onto the browser window.


    If you did things correctly, you should not see a "Hello World" alert box appear.
    The comment told the browser to ignore the code between asterisks.


    The *index.html* is a web page. Javascript needs a webpage to live inside. Before,
    when you were simply typing in the console, your Javascript was using the web
    page that was already in the browser.


    If you were to open the index.html page with your text editor, you would see a
    few lines of HTML, one of them something that looks like this:


    ```

    <script src="main.js"></script>

    ```


    This is a **script tag**. Tags are easy to spot as they all begin with < and end
    >. HTML uses tags to tell the browser what to do. In this case the index page
    is telling the browser to get all the code in the main.js file and load it.'
  merge: -1
