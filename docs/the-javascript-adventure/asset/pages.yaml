- img_proc: true
  md: 'We aren’t going to talk a bout HTML since most of the HTML needed for this
    project is already included in the game kit. HTML is only discussed in this book
    to make things seem less magical.


    Now that you know that dropping the HTML on the page will load it, you should
    know that once it is loaded, refreshing the page will show your new code changes.
    You can also bookmark the page so that you don''t have to drag and drop it every
    time you want to view your code changes.


    Note: You should know that if you bookmarked the index.html page, moving the files
    will break that bookmark. A bookmark is just an address that tells the browser
    where to find the file it wants to load.


    Sometimes browsers will not see new code changes when you refresh the page. If
    this happens, you may need to empty your browser cache. The cache is a place where
    the browser saves files so that it doesn''t expect to change. If you are using
    Chrome, you can type **chrome://history** in the address bar to open the history
    settings.


    On the left side of the browser click **history** and then click the button that
    says “Clear browsing data”. A Popup should appear with many options on it. Make
    sure that the box next to “Cached images and files” is checked and click the button
    that reads “Clear browsing data”.'
