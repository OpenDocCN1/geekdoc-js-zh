  md: 'tells the game engine the boss''s name and how many hearts boss has. The act
    variable holds a RAO with the goto set to 33. This assumes that the battle is
    still on and sends the player back to the fight option.


    The boss object is required by the attack method. This method when passed the
    boss object and a negative number will remove the amount of hearts specified.
    Attack returns the number of hearts the boss has left. If the boss doesn''t have
    any hearts, the player is sent to screen 39 to see a victory message. By specifying
    the goto in the RAO upfront, the code assumes the fight will continue. This means
    that we only have to write code to handle when the boss has no hearts and the
    fight is over. This technique can be used in many situations where there are only
    two outcomes. Just as easily you could have left act an empty object and created
    an else to set goto to 33 if the boss still has hearts.


