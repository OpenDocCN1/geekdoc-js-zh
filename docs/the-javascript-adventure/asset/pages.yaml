    alert(welcome);

    ```


    You should now see "Welcome back!" appear in the alert box. By typing welcome
    without the keyword var, you are reusing the welcome variable you created before.
    This time you are filling it with a different message. In computerese this is
    called reassignment.


    Now that you know about variables, the fun begins. With a little more work, we
    can build a game.'
