  md: '# Chapter 2: Variables AKA Boxes to Save Stuff for Later'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Variables are used in programming to store and organize things. In Javascript,
    you can put just about anything in a variable; things strings (text), numbers
    and more.


    If it is not open, open the console and let''s change up our first program a bit.


    In the console type:


    ```

    var welcome = "Welcome to my game";

    alert(welcome);

    ```


    If typed correctly, you should see a small window appear that says "Welcome to
    my game!"


    ![](img/d20203a9468fea810d478d2b57511c96_15_0.png)


    var is what is considered a keyword. Keywords are special words that programming
    languages use to determine what to do with the code next to them. In this case
    var tells the browser that welcome is the name of a new variable. To say this
    another way, you create variables by typing var followed by a name of your choosing.


    There are a lot of variable rules, but for the purposes of this book, just know
    that variables should not be named after keywords and variable names cannot contain
    spaces.


    You should typically keep variable names to words that describe the information
    they hold. In this case, the variable was named welcome since it held the message
    "Welcome to my game!"'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'You may notice that between the variable name ''welcome'' and the text "Welcome
    to my game! is an equal sign. In Javascript, the equal sign tells the browser
    to put the welcome message in the welcome variable. This in computerese is called
    assignment.


    It is often useful to translate code into plain English to understand what is
    going on.


    ```

    var welcome = "Welcome to my game!";

    ```


    In english it would be: create a variable named welcome and put "Welcome to my
    game!" inside of it.


    ```

    alert(welcome);

    ```


    In english this would be: show what is inside the welcome variable.


    It is also helpful to think of a variable as a box. When writing code, variables
    are great places to put things like strings. A big reason variables are used to
    hold information that will change.


    In the console type:


    ```

    alert(welcome);

    ```


    You should see "Welcome to my game!" appear. If you don''t see it, it was probably
    reset by a page refresh. If this is the case, retype this in the console:


    ```

    var welcome = "Welcome to my game!";

    alert(welcome);

    ```


    Now type:


    ```

    welcome = "Welcome back!";

    ```'
