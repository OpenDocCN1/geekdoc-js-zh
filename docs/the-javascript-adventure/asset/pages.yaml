    # Game Engine API (properties and methods)


    The game engine has a few methods and properties that are used to make building
    the game easier. This is known as the game engine API (Application Programming
    Interface). API is a fancy word that means the thing you use to program the game
    engine. The API handle the more common programming task. Below is a list of the
    available methods and properties.


    addToken: This method takes two strings parameters: token and meth. It adds the
    token to the tokens array and meth to the tokenHandlers array. This method can
    be used to add custom tokens to screens. See tokens for more information.


    adjust: This method has two parameters: name and val. The name is a string that
    identifies a game data property. The val is the amount that should be added or
    subtracted from the game data property. This is used by the game engine to do
    things like subtract hearts when the hero is damaged or add gems when the hero
    finds money.


    attack: This method has two parameters: target and damage. This method is used
    to reduce the hearts of game bosses or other enemies that have hearts.'
