  md: 'Open up the main.js file, remove the comment that contains the alert (do not
    remove any other code) and type:


    ```

    /* Important game variable */

    var userName = "Zultan Swack";


    var title = "The Legend of Princess Helga";

    var playerName = "";


    var screenText = "Please enter your name:";

    /* Show the game title. */

    alert(title);

    playerName = prompt(screenText);

    ```


    Run the code by saving your work and then refreshing the browser.


    You may have noticed that we introduced a new method called prompt. Think of prompt
    as a cousin to alert. While an alert box only shows a message, a prompt is an
    alert that has a textbox inside of it. This allows the player to input data. In
    this case, the data the player is putting in her name.


    A prompt does something else that an alert cannot. A prompt will return a useful
    value.


    One of the things that make functions special is that they can spit out data after
    they have done their job. This is called returning since it is giving back data.
    A value is simply one of the words used that means data. In its simplest forms,
    values are basically letters, words and/or numbers.


    We will talk more about data and return values later, but right now remember that
    if you give a prompt parameter, it will use that as the prompt message. If a player
    types their name in the prompt text box, it will be saved in playerName variable.


    If you wanted to see the value of the variable playerName, add the following to
    the end of your code:


    ```

    console.log(playerName);

    ```'
