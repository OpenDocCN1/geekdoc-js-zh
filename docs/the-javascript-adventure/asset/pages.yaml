- img_proc: true
  md: 'You have already learned a lot; so much in fact, that we can start building
    a game. The console is a great place to type simple statements and commands, but
    it is no place for a full program. To help you get started, download the game
    kit from here: https://github.com/orangemantis/gamekit/archive/master.zip


    Once the game kit has been downloaded save it someplace you will easily find it.
    The desktop or your documents folder would be a good place to put it. The game
    kit contains a bunch of useful resources and even sample code to help you if you
    get stuck. Many examples will be presented in this book. The code for these example
    can be found in the gamekit/mygame/snippets folder. The files are named after
    the examples.


    As a new coder it is common to really mess up a file when trying something new.
    If you ever need a fresh start with a game kit file, simply grab a fresh copy
    from the game kit archive and save it to your game directory (the mygame folder).
    The archive is just a copy of all of the initial game kit files. Make sure to
    never modify archive files!


    Open the gamekit folder and then open the mygame folder that is inside of it.


    Inside of the mygame folder,open the file named main.js using your text editor.


    The main.js file, as the name implies, is the main program for your game. The
    .js tells the computer that the main file contains Javascript code. You do not
    have to worry about the other files in this folder; they are included to make
    your life easier. Programmers often depend on utilizing code that someone else
    has written. Think of these pre-written files as a library. In fact, that is exactly
    what a collection of prewritten programming files is called, a library.


    Inside the main.js file you should see something that looks like this:


    ```

    /* Add your code below */

    ```


    This is called a comment. Comments begin with a slash and an asterisk and end'
  merge: -1
