  md: 'The HelgaJS game engine was created specifically to teach people how to write
    Javascript by building a text-based game. Text-based games are an excellent starter
    project since they don''t involve graphics and can be built using minimal resources.
    There are no complicated thumb bending combos to memorized. There are only decisions
    to make and puzzles to solve. To use HelgaJS you simply need a text editor and
    a modern web browser.


    # About the Legend of Helga


    The Legend of Helga demo game is a light hearted homage to many of the great adventure
    games that involved exploring temples and rescuing a princess. The premise of
    the game and the play are simple. You are a hero who is on a mission to rescue
    a princess from an evil king. You must explore a forest and ultimately a dungeiness
    temple to find and save Princess Helga.


    The hero begins the game with a pocket full of matches that burn out quickly as
    he searches for a lantern to guide him through a dark forest. If the hero runs
    out of matches before finding a lantern, the game is over. While on the quest
    the hero encounters enemies that threaten his survival. When the hero loses a
    battle his heart count goes down. When he wins, he is rewarded with gems. The
    hero can use the gems to buy things from the temple shop.


    The temple shop has all the items the hero needs to improve his chances of defeating
    the evil King Malvox. The friendly shopkeeper not only sells wares, but also offers
    a few words of wisdom. To check the hero''s equipment, the player can type "INVENTORY"
    or "STUFF" in the prompt. The hero must explores the temple in order to find treasure
    and the boss room. After the player finds the boss room and feels that she has
    equipped the hero well enough, the fight is on to save Princess Helga.


    The Legend of Helga game should feel familiar and play should be easy and intuitive.


    # Getting Started'
