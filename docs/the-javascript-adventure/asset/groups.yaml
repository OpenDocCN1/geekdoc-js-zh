    # Chapter 2: Variables AKA Boxes to Save Stuff for Later'
  - '[PAGE 15]


    Variables are used in programming to store and organize things. In Javascript,
    you can put just about anything in a variable; things strings (text), numbers
    and more.


    If it is not open, open the console and let''s change up our first program a bit.


    In the console type:


    ```

    var welcome = "Welcome to my game";

    alert(welcome);

    ```


    If typed correctly, you should see a small window appear that says "Welcome to
    my game!"


    ![](img/d20203a9468fea810d478d2b57511c96_15_0.png)


    var is what is considered a keyword. Keywords are special words that programming
    languages use to determine what to do with the code next to them. In this case
    var tells the browser that welcome is the name of a new variable. To say this
    another way, you create variables by typing var followed by a name of your choosing.


    There are a lot of variable rules, but for the purposes of this book, just know
    that variables should not be named after keywords and variable names cannot contain
    spaces.


    You should typically keep variable names to words that describe the information
    they hold. In this case, the variable was named welcome since it held the message
    "Welcome to my game!"'
- md: "\nYou may notice that between the variable name 'welcome' and the text \"Welcome\
    \ to my game!\" is an equal sign. In Javascript, the equal sign tells the browser\
    \ to put the welcome message in the welcome variable. This in computerese is called\
    \ assignment.\n\nIt is often useful to translate code into plain English to understand\
    \ what is going on.\n\n```\nvar welcome = \"Welcome to my game!\";\n```\n\nIn\
    \ english it would be: create a variable named welcome and put \"Welcome to my\
    \ game!\" inside of it.\n\n```\nalert(welcome);\n```\n\nIn english this would\
    \ be: show what is inside the welcome variable.\n\nIt is also helpful to think\
    \ of a variable as a box. When writing code, variables are great places to put\
    \ things like strings. A big reason variables are used is to hold information\
    \ that will change.\n\nIn the console type:\n\n```\nalert(welcome);\n```\n\nYou\
    \ should see \"Welcome to my game!\" appear. If you don't see it, it was probably\
    \ reset by a page refresh. If this is the case, retype this in the console:\n\n\
    ```\nvar welcome = \"Welcome to my game!\";\nalert(welcome);\n```\n\nNow type:\n\
    \n```\nwelcome = \"Welcome back!\";\n```\n\n```\nalert(welcome);\n```\n\nYou should\
    \ now see \"Welcome back!\" appear in the alert box. By typing welcome without\
    \ the keyword var, you are reusing the welcome variable you created before. This\
    \ time you are filling it with a different message. In computerese this is called\
    \ reassignment.\n\nNow that you know about variables, the fun begins. With a little\
    \ more work, we can build a game.\n\n# Chapter 3: Game Time\n\nYou have already\
