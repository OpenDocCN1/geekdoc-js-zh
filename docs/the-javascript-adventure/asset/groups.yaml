    Each screen is responsible for telling the game engine what to do. Below is a
    breakdown of what each property is for.


    - **id**: This property is not used by the game engine but it is used by the game
    developer. It is just an easy way for you to know what screen you are working
    on. This should represent the numerical order of the screen in the screens property
    array. While array positions begin with zero, for the sake of making the game
    easier to follow, the screen.id should always be array position + 1. The game
    engine does the math when you reference the screen. It know that screen 1 is really
    at position zero in the screens array.


    - **title**: The text in this property is displayed on the first line of the screen
    shown to the player.


    - **text**: The text in this property is shown below the title.


    - **a**: The text for choice “A”.


    - **b**: The text for choice “B”.


    - **c**: The text for choice “C”.


    - **d**: The text for choice “D”.


    - **e**: The text for choice “E”.


    - **hideStats**: This optional property if set to true will prevent the screen
