    \nTechnically, methods like alert and prompt belong to the window object. Typing:\n\
    \nwindow.alert(\"Hello\");\n\nis the same as typing:\n\nalert(\"Hello\");\n\n\
    Window is a special object that does not require you to type a dot to get to its\
