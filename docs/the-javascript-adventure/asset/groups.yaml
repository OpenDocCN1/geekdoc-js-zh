    \ 和 prompts 来编写一个完整但简单的游戏。\n\n## 第 4 章：冒险继续\n\n你可以从上到下继续编写这个游戏，但这会带来一些几乎无法克服的挑战。在上一章中，你学习了如何确保玩家输入名字。如果他们第二次输入了名字，这种方法非常好；但如果他们没有输入，你就会一遍又遇到同样的问题。\n\
    \n为了解决这个问题，你可以创建一个规则，规定如果玩家在第一次或第二次尝试都没有输入名字，那么她就不能玩。规则看起来如下：\n\n```javascript\n\
