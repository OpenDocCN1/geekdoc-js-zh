  mdcn: "\n控制台的 `log` 方法是一种在控制台中打印对象的简易方法。你可以用它在控制台中显示任何有效的 Javascript 代码。这是一个非常强大的功能。每当你想看一眼代码中发生了什么时，你都可以使用它。\n\
