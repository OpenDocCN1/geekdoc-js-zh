    \n在上面的代码中，我们使用了一个 **if 语句**来检查是否添加了名字。\n**if 语句**使用关键字 *if*，后面跟着一个括号，括号内包含你正在检查的条件。括号之后是一个*大括号*，后面跟着是几行代码，然后是另一个相反的*大括号*。大括号是\
    \ Javascript 中将相关代码分组在一起的方式。\n\n大括号之间的代码通常被称为代码**块**（block）。附加到 *if 语句*上的代码块只有在语句为真时才会运行。\n\
    \n**if 语句**只理解 **true**（真）或 **false**（假），Javascript 几乎将所有内容分为这两者之一。想象一下玩家在要求输入名字的框里输入了\
