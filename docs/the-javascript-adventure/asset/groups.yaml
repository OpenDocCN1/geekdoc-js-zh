    \ a bunch of useful resources and even sample code to help you if you get stuck.\
    \ Many examples will be presented in this book. The code for these examples can\
    \ be found in the gamekit/mygame/snippets folder. The files are named after the\
    \ examples.\n\nAs a new coder, it is common to really mess up a file when trying\
    \ something new. If you ever need a fresh start with a game kit file, simply grab\
    \ a fresh copy from the game kit archive and save it to your game directory (the\
    \ mygame folder). The archive is just a copy of all of the initial game kit files.\
    \ Make sure to never modify archive files!\n\nOpen the gamekit folder and then\
    \ open the mygame folder that is inside of it.\n\nInside of the mygame folder,\
    \ open the file named main.js using your text editor.\n\nThe main.js file, as\
    \ the name implies, is the main program for your game. The .js tells the computer\
    \ that the main file contains Javascript code. You do not have to worry about\
    \ the other files in this folder; they are included to make your life easier.\
    \ Programmers often depend on utilizing code that someone else has written. Think\
    \ of these pre-written files as a library. In fact, that is exactly what a collection\
    \ of prewritten programming files is called, a library.\n\nInside the main.js\
    \ file, you should see something that looks like this:\n\n```\n/* Add your code\
    \ below */\n```\n\nThis is called a comment. Comments begin with a slash and an\
    \ asterisk and end with an asterisk and a slash. Comments are notes in the code\
