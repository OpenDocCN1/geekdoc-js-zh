    a keyword. The function''s name is followed by a pair of parenthesis. You can
    think of a function as a machine. Often, machines require you to put something
    inside of them to work. A lock needs a key, a car needs a driver and even a blender
    needs to work. The parenthesis are a way to provide a function with anything it
    may need to work. In the example above, it needs a string.


    The word inside of the function''s parenthesis is a special kind of variable called
    a parameter. You use these just like you a variable. The parameter can be used
    inside the function. That means, even if it has the same name as a regular variable,
    it is actually different.


    When you write the function''s name and pass it parameters (without the function
