    the screen.id should always be array position + 1. The game engine does the math
    when you reference the screen. It know that screen 1 is really at position zero
    in the screens array.


    title: The text in this property is displayed on the first line of the screen
    shown to the player.


    text: The text in this property is shown below the title.'
