    Object properties are specified within the curly brackets. They can be pretty
    much like any valid string. The value of a property is declared after the name
    using a colon to separate the property name from the value. You can think of objects
    as super boxes that hold many other things. Properties are like variables that
    belong to the object they are created in. Objects help you organize code.


    Properties can hold anything that a variable can, including functions and even
    other objects. HelgaJS uses objects to organize code into smaller chunks that
    make it easy to write and move around. Objects will be discussed more later on
    in the text.


    The screens property of the game object is where all of the magic happens. The
    screens property is an array of screen object literals. In Javascript, an array
    is a simple list. Items in an array are separated by a comma. Arrays are great
    for keeping track of things that have a numeric order. When counting the position
    of items in an array, you start with zero.


    To create an array, type an opening square bracket followed by a closing one and
    assign it to a variable or object property.


    ```

    var foo = [];

    ```


    The following array has three different strings inside of it:


    ```

    var foo = ["alpha", "beta", "gamma"];

    ```


    The string alpha would be at array position 0, beta at 1, and gamma at 2. If you
    wanted to use any of the information in the array, you would get it using the
    numeric position.


    To see this at work type the following in the console:'
