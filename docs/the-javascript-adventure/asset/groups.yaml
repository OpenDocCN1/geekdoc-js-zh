- md: "\n# Screen 33\n\n![](img/d20203a9468fea810d478d2b57511c96_103_0.png)\n\nThis\
    \ screen handles the logic for all the boss fight options. First, variables are\
    \ set up to declare the RAO and a couple of dice rolls. Two dice rolls are used\
    \ in the screen to add even more randomness to the fight outcome.\n\nCase “A”\
    \ handles if the player wants to use her sword. If she rolls a 7 or greater, she\
    \ is sent to screen 34 where a success message will be shown and the boss will\
    \ sustain damage from the attack. If the player rolls 6 or less, she is sent to\
    \ screen 35 that shows a failure message and the hero sustains damage.\n\n```javascript\n\
    case \"A\":\nif (roll1 > 6) {\n  act.goto = 34;\n} else {\n  act.goto = 35;\n\
    }\nbreak;\n```\n\nCase “B” handles when the player opts to try a special attack.\
    \ Special attacks are rare and the code only allows a special attack to happen\
    \ when both rolls are added together equal 14. If either of these conditions met\
    \ the player is sent to screen 36 to inflict damage to the boss. It also lets\
    \ the player know that she got lucky with a special attack. If neither condition\
    \ is met, the player is sent to screen 37 where damage to the hero occurs. A message\
    \ is shown to let the player know that the special attack failed miserably.\n\n\
    ```javascript\ncase \"B\":\nif(roll1 == roll2 || (roll1 + roll2 == 14)) {\n  act.goto\
    \ = 36;\n} else {\n  act.goto = 37;\n}\n```\n\nCase “C” sends the player to screen\
    \ 38 to let her know that she cannot win the game by dodging.\n\nNote: You could\
    \ add some risk to the hero by adding an if/else block that use a dice roll to\
    \ determine if the dodge worked. This would add a condition of danger to an otherwise\
    \ safe option.\n\n# Screen 34\n\n![](img/d20203a9468fea810d478d2b57511c96_104_0.png)\n\
    \nThis screen creates a boss variable to hold the boss object retrieved from the\
    \ game data. The boss object is a package of information about a specific boss.\
    \ It tells the game engine the boss's name and how many hearts boss has. The act\
    \ variable holds a RAO with the goto set to 33. This assumes that the battle is\
    \ still on and sends the player back to the fight option.\n\nThe boss object is\
    \ required by the attack method. This method when passed the boss object and a\
    \ negative number will remove the amount of hearts specified. Attack returns the\
    \ number of hearts the boss has left. If the boss doesn't have any hearts, the\
    \ player is sent to screen 39 to see a victory message. By specifying the goto\
    \ in the RAO upfront, the code assumes the fight will continue. This means that\
    \ we only have to write code to handle when the boss has no hearts and the fight\
    \ is over. This technique can be used in many situations where there are only\
    \ two outcomes. Just as easily you could have left act an empty object and created\
    \ an else to set goto to 33 if the boss still has hearts.\n\n```javascript\nvar\
    \ act={goto: 33};\nvar boss = gd_currentBoss;\nvar bossHearts = ge.attack(boss,\
    \ -1);\n```\n\n```javascript\nif(!bossHearts) {\nact.goto = 39;\n}\nreturn act;\n\
    ```\n\n# Screen 35\n\n![](img/d20203a9468fea810d478d2b57511c96_105_0.png)\n\n\
    This screen lets the player know that she lost the current fight with the boss.\
    \ The action of this screen inflicts -2 hearts damage.\n\n# Screen 36\n\n![](img/d20203a9468fea810d478d2b57511c96_107_0.png)\n\
    \nThis screen handles the outcome of a successful special attack. The logic is\
    \ almost identical to screen 34 except that instead of 1 heart damage, the boss\
    \ loses 3 hearts in this type of attack.\n\n# Screen 37\n\n![](img/d20203a9468fea810d478d2b57511c96_107_1.png)\n\
    \nThis screen shows the message that lets the player know that the special attack\
    \ failed. The action tells the game engine to remove 2 hearts.\n\n# Screen 38\n\
    \n![](img/d20203a9468fea810d478d2b57511c96_108_0.png)\n\nThis screen tells the\
    \ player that she will not win the game by dodging the boss.\n\n# Screen 39\n\n\
    ![](img/d20203a9468fea810d478d2b57511c96_108_1.png)\n\nThis screen handles the\
    \ demise of the boss. The first line removes the current boss by setting _currentBoss\
    \ to null. The next line does something really special; it increase the hero's\
    \ total hearts by one. This is a useful feature for games that have more than\
    \ one level. Typically, game difficulty increases as the game progresses. Bumping\
    \ up the hero's hearts makes the hero strong enough to fight stronger bosses.\n\
    \nThe heartLimit property of the game data tells the engine the maximum number\
    \ of hearts the hero can have. This code bumps up the limit by using the adjustItem\
    \ method. The last line replenishes the hero’s hearts.\n\nThe ge.getItem('_heartLimit')\
    \ returns the value of the maximum number of hearts allowed for the hero. Another\
    \ way to do this is to put the return value of getItem in a variable and then\
    \ pass that variable to setItem. This code was written to show you that there\
    \ are many ways to do the same thing.\n\n```javascript\nge.setItem('_currentBoss',\
    \ null);\nge.getItem('_heartLimit', 1);\nge.getItem('hearts', ge.getItem('_heartLimit'));\n\
    ```\n\n# Screen 40\n\n![](img/d20203a9468fea810d478d2b57511c96_109_0.png)\n\n\
    This screen is used to display the inventory. The screenNum variable represents\
    \ the screen the player was on when he wanted to see the inventory. This is used\
    \ to send the player back to that screen when the inventory screen is dismissed.\n\
    \n```javascript\nvar screenNum = ge.getItem(\"_previousScreen\");\nreturn {goto:\
    \ screenNum};\n```\n\n# Screen 41\n\n![](img/d20203a9468fea810d478d2b57511c96_110_0.png)\n\
    \nThis screen displays the credits that are set in the game data credit property.\n\
    \n# Screen 42\n\n![](img/d20203a9468fea810d478d2b57511c96_110_1.png)\n\nThis screen\
    \ shows the game over message for when the hero dies.\n\n# Screen 43\n\n![](img/d20203a9468fea810d478d2b57511c96_111_0.png)\n\
    \nThis screen show the game over message for when the hero defeats the boss and\
    \ saves the princess.\n\n# Screen 44\n\n![](img/d20203a9468fea810d478d2b57511c96_111_1.png)\n\
    \nThis screen shows the message when a player decides to quit the game.\n\nYou\
    \ should now be equipped to create your own adventure game using the HelgaJS Engine.\
    \ Even more, you should now know enough about programming to explore some of your\
    \ own unique ideas. You have only just begun on your programming voyage. Hopefully\
    \ you will stick with it and produce something really cool.\n\nHappy coding!\n"
  mdcn: "\n\n# 第 33 页\n\n![](img/d20203a9468fea810d478d2b57511c96_103_0.png)\n\n此屏幕处理所有\
    \ Boss 战斗选项的逻辑。首先，设置变量来声明 RAO 和几次骰子掷。屏幕中使用了两次骰子掷，以为战斗结果增加更多的随机性。\n\n分支 “A”处理玩家想要使用她的剑的情况。如果她掷出的点数是\
    \ 7 或更高，她将被发送到第 34 屏幕，那里将显示成功信息，且 Boss 将受到攻击伤害。如果玩家掷出的点数为 6 或以下，她将被发送到第 35 屏幕，该屏幕显示失败信息且英雄受到伤害。\n\
    \n```javascript\ncase \"A\":\nif (roll1 > 6) {\n  act.goto = 34;\n} else {\n \
    \ act.goto = 35;\n}\nbreak;\n```\n\n分支 “B”处理玩家选择尝试特殊攻击的情况。特殊攻击非常稀有，代码仅允许在两次骰数之和等于\
    \ 14 时发生特殊攻击。如果满足其中一个条件，玩家将被发送到第 36 屏幕对 Boss 造成伤害。它还会让玩家知道她幸运获得了一个特殊攻击。如果两个条件都不满足，玩家将被发送到第\
    \ 37 屏幕，在那里英雄会受到伤害。将显示一条消息让玩家知道特殊攻击惨遭失败了。\n\n```javascript\ncase \"B\":\nif(roll1\
    \ == roll2 || (roll1 + roll2 == 14)) {\n  act.goto = 36;\n} else {\n  act.goto\
    \ = 37;\n}\n```\n\n分支 “C”将玩家发送到第 38 屏幕，让她知道无法通过闪避来赢得游戏。\n\n注意：你可以通过添加一个 if/else\
    \ 块并使用骰子掷来决定闪避是否成功，从而给英雄增加一些风险。这为一个原本安全的选项增加了一个危险条件。\n\n# 第 34 页\n\n![](img/d20203a9468fea810d478d2b57511c96_104_0.png)\n\
    \n此屏幕创建一个 Boss 变量来保存从游戏数据中获取的 Boss 对象。Boss 对象是一个关于特定 Boss 的信息包。它告诉游戏引擎 Boss 的名称以及\
    \ Boss 有多少颗心心。`act` 变量持有一个 `goto` 设置为 33 的 RAO。这假设战斗仍在进行，并将玩家送回战斗选项。\n\n`attack`\
    \ 方法需要 Boss 对象。当向该方法传递 Boss 对象和一个负数时，它将移除指定数量的血量。`attack` 返回 Boss 剩余的血量。如果 Boss\
    \ 不再有血量，玩家将被发送到第 39 屏幕查看胜利消息。通过预先在 RAO 中指定 `goto`，代码假设战斗将继续。这意味着我们只需要编写代码来处理 Boss\
    \ 没有血量且战斗结束的情况。这种技术可以用于许多只有两种结果的情况。你同样可以轻松将 `act` 留为空空对象，并创建一个 `else` 在 Boss 还有血量时将\
    \ `goto` 设置为 33。\n\n```javascript\nvar act={goto: 33};\nvar boss = gd_currentBoss;\n\
    var bossHearts = ge.attack(boss, -1);\n```\n\n```javascript\nif(!bossHearts) {\n\
    act.goto = 39;\n}\nreturn act;\n```\n\n# 第 35 页\n\n![](img/d20203a9468fea810d478d2b57511c96_105_0.png)\n\
    \n此屏幕让玩家知道她输了当前与 Boss 的战斗。该动作造成了 -2 点伤害。\n\n# 第 36 页\n\n![](img/d20203a9468fea810d478d2b57511c96_107_0.png)\n\
    \n此屏幕处理特殊攻击的结果。其逻辑与第 34 页几乎相同，除了这里不是造成 1 点伤害，而是 Boss 损失了 3 点血量。\n\n# 第 37 页\n\n\
    ![](img/d20203a9468fea810d478d2b57511c96_107_1)\n\n此屏幕显示消息，让玩家知道特殊攻击失败了。该动作让游戏引擎移除\
    \ 2 点血量。\n\n# 第 38 页\n\n![](img/d20203a9468fea810d478d2b57511c96_108_0)\n\n此屏幕告诉玩家她无法通过闪避赢得游戏。\n\
    \n# 第 39 页\n\n![](img/d20203a9468fea810d478d2b57511c96_108_1)\n\n此屏幕处理 Boss 的消亡。第一行通过将\
    \ `_currentBoss` 设置为 `null` 来移除当前的 Boss。下一行非常特殊；它增加了英雄的总血量。这对于超过一个等级的游戏非常有用。通常，随着游戏的进行难度会增加。增加英雄的血量使其战斗更强大的\
    \ Boss。游戏数据中的 `heartLimit` 属性告诉引擎英雄允许的最大血量。此代码通过使用 `setItem` 方法增加了限制。最后一行恢复了英雄的血量。实现此点的另一种方法是将\
    \ `getItem` 的返回值放入变量中，然后将该变量传递给 `setItem`。这段代码是为了向你展示有许多方法可以实现同样的事情。\n\n```javascript\n\
    ge.setItem('_currentBoss', null);\nge.setItem('_heartLimit', 1);\nge.setItem('hearts',\
    \ ge.getItem('_heartLimit'));\n```\n\n# 第 40 页\n\n![](img/d20203a9468fea810d478d2b57511c96_109_0.png)\n\
    \n此屏幕用于显示背包。`screenNum` 变量代表玩家想要查看背包时所在的屏幕。这用于在关闭关闭时将玩家送回之前的屏幕。\n\n```javascript\n\
    var screenNum = ge.getItem(\"_previousScreen\");\nreturn {goto: screenNum};\n\
    ```\n\n# 第 41 页\n\n![](img/d20203a9468fea810d478d2b57511c96_110_0.png)\n\n此屏幕显示设置在游戏数据\
    \ `credit` 属性中的制作名单。\n\n# 第 42 页\n\n![](img/d20203a9468fea810d478d2b57511c96_110_1.png)\n\
    \n此屏幕显示英雄死亡时的游戏结束消息。\n\n# 第 43 页\n\n![](img/d20203a9468fea810d478d2b57511c96_111_0.png)\n\
    \n此屏幕显示英雄击败 Boss 并拯救公主时的游戏结束消息。\n\n# 第 44 页\n\n![](img/d20203a9468fea810d478d2b57511c96_111_1.png)\n\
    \n此屏幕显示玩家决定退出游戏时的消息。\n\n现在，你已经准备好使用 HelgaJS 引擎创建你自己的冒险游戏了。此外，你现在应该已经足够的编程知识来探索你自己独特的想法了。你的编程之旅才刚刚开始。希望你能够坚持下去，并创作出非常酷的作品。\n\
    \n编码愉快！\n\n"
