    # Screen 5


    ![](img/d20203a9468fea810d478d2b57511c96_77_0.png)


    This screen also replaces the RESCUE token with the princess''s name. It also
    sets the text for the various options.


    The action for this screen is a typical example of how player decisions are handled.
    This screen uses a switch statement instead of if/else.


    Switch statements are great replacements for places where you need multiple statements.


    Switch takes a parameter and it uses case statements to manage if conditions.
    In the code we below pass the answer to the switch. A case has a block of code
    that does something if the switch parameter matches the case.


    In these cases (no pun intended), we handle if the player types A, B, C, D, STUFF,
    INVENTORY or anything else for that matter.'
  - '[PAGE 78]


    A case takes the form of case keyword, value to match and finally a colon.


    case “some value to match":


    This is then followed by lines of code that tell the game engine what it should
    do if the answer matches the values that follows the case keyword.


    This screen''s code sets goto to 7 if the answer is “A” and goto to 6 if the answer
    is “B”. Notice that the cases for A and B both contain break as the last line
    before the next case. This tells the switch to ignore any of the cases below it.
    If no break is specified, case below it will be applied if a match is found. This
    may seem odd at first but it can be useful as you will see with the “STUFF” case.


    To better understand how this works, imagine that switch is a factory conveyor
    belt and the cases are workers that pull items and work on them if they match
    the value case is responsible for.


    The worker for case “A” only pulls items that match “A”. Since this worker is
    instructed to break, this tells her to do her work (setting goto to 7) and then
    remove the item from the conveyor.


    The worker for case “B” similarly grabs any matching item, does her job and removes
    the item from the conveyor.


    The “STUFF” case worker is different though. When she sees something that matches
    “STUFF”, she does her job and leaves the item on the conveyor belt since there
    is no break. Since it hasn''t been removed, it stays there and is handled by other
    cases until it reaches a break or the end.


    In the code, “STUFF” flows into the INVENTORY case. This technique is used to
    handle multiple answers that should have the same outcome. Without a break in
    the “STUFF” case, allow the player to type “STUFF” or “INVENTORY” and have the
    same thing happen. When the players type “STUFF” or “INVENTORY” goto is set to
    the number of the inventory screen. Since the inventory screen may be used all
    over the game, instead of having to look it up every time you need to use, you
    set it as a game data property. This way you just have to remember the name of
    the property.'
