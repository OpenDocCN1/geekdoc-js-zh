    }\n\nvar answer = prompt(screen2Text);\ncheckAnswer(answer);\n\nplayScreen1();\n\
    ```\n\nThere seems to be a trend with these examples; more and more code gets\
    \ written every time!\n\nLet's break down what you just did.\n\nYou added four\
    \ new variables: templeKey, lantern, hearts and gems. In this game, variables\
    \ are the things that you use to remember if you have an item or not. When you\
