    This screens declares the RAO as the variable act. It then declares a lantern
    variable and sets it to the value of the them game data lantern property.


    The lantern, like many other items in the game, is one that you either have or
    do not have. If you have a lantern, the value of the lantern property is true,
    otherwise (like at the start of the game) it is false.


    A roll variable is declared and this uses the rollDice method to get a random
    number between 1 and 12.


    The matches variable holds the current number of matches available. The matches
    variable, unlike the lantern, is a number that can increase or decrease. You do
    not have any more when the number of matches reaches zero. If that happens the
    game is over.


    The forestKey variable gets the value of the forestKey game data property. This
    is a true or false (boolean) value like the lantern. You either have it or you
    don''t.'
- md: '

    The first if block tells the game engine to remove a match by setting the RAO
    matches property to -1. The game engine will add the number set here to the game
    data matches property. A negative number is used to effectively subtract one.
    If there is no lantern this action takes place after this screen is shown. The
    line that is commented out, is the manual way to remove a match immediately. You
    may need to do this manually if you have to add or remove items before the choices
    are processed.


    The next if block checks to see if the player has matches or a lantern. If the
    player doesn''t have a light, goto is set to screen 11, a special game over screen.
    The return in this block stops the action from proceeding any further. The RAO
    gets sent back to the game engine and the game is over.


    These actions happen before the player''s answer is considered.


    ```javascript

    var act = {};

    var lantern = ge.getItem(''lantern'');

    var roll = ge.rollDice();

    var matches = ge.getItem(''matches'');

    var forestKey = ge.getItem(''forestKey'');

    ```


    ```javascript

    if (!lantern) {

    //ge.adjustItem(''matches'', -1);

    act.matches = -1;

    }

    ```


    ```javascript

    //If there are no matches the game is over

    if(!matches && !lantern) {

    act.goto = 11;

    return act;

    }

    ```


    The switch statement handles the player''s answer. Answer "A" is to look for the
    lantern. If the player selects this, the first if statement of the "A" case checks
    to see if the player has a lantern. If she does, goto sends the player to screen
    10.


    The next if block only happens if the player does not have a lantern. It checks
    the roll variable and if the number rolled is greater than 6, the player is sent
    to screen 8 where she will be given a lantern.


    The else block handles if the player rolled 6 or less. This else block is contained
    inside another if/else block. This one says that if the player has any matches,
    she is sent to screen 9 to let her know that she has not yet found a lantern.
    Otherwise, she is sent to screen 11, the game over screen.


    ```javascript

    switch(answer) {

    case "A":

    if(lantern) {

    act.goto = 10;

    return act;

    }

    //Assume no lantern here

    if (roll > 6) {

    act.goto = 8;

    } else {

    if(matches) {

    act.goto = 9;

    }

    ```


    In the first statement of case "B" the code checks to see if the player has the
    forestKey. This is handled first to simplify the programming. If she has a key
    there is no need to do anything else. If she has one, goto is set to 17. This
    screen just tells the player that she already has one. This tells her that she
    cannot find another key. The return here is used to prevent the function from
    executing any logic below. It is a big stop sign for the function.


    Note: Remember, if you give a player an option, you have to let her know the result
    of her action even when she is not allowed to make it. Sometimes it is easier
    to give the player a choice and tell her that she cannot do it, and it is to remove
    the choice altogether.


    The next if block checks to see if the dice roll is greater than 6. If it is,
    goto is set to 12. This screen tells the player that she found a key. When you
