    ## Introduction


    This book was created to help people get started writing computer code. Every
    attempt was made to keep things as simple as possible. To do this, many concepts
    are not covered because frankly they make things too complicated. This is not
    a guide to teach all things programming. It is just a book that helps people get
    started.


    The concepts in this book are taught by showing you how to build a game. Just
    about every line you write will contribute to creating a simple text-based adventure
    game. All you will need to get started is a computer with Google''s Chrome browser,
    a text editor, an internet connection (to download the starter materials) and
    a bit of imagination.


    Chapters 1-6 of this book are designed with the beginner in mind. These sections
    teach the reader how to write game code from scratch. The examples found in the
    first six chapters introduce the Javascript language and many key programming
    concepts.


    Chapters 7-8 are for intermediate learners that have mastered the concepts introduced
    in the first part of the book. This part of the book breaks down how the included
    sample game works.


    ## A Note on Format


    The section below explains the text format of this book.


    **New technical terms, important concepts and things to remember are in bold.**


    *Technical terms and important concepts are italicized.*


    Code appears in this font.


    **New code that you must add is in this font and bold!**


    This is really all you need to know to get started. If you have a question, feel
    free to send me a tweet @mantisorange. Keep reading and within minutes you will
    have written your first program!


    ## Chapter 1: Hello World, Everybody’s First Program


    Computer programming is not hard, it just takes time. Don’t worry, it will be
    fun (most of the time). Enough talk, let''s get busy coding. All you need to start
    is a modern web browser and a basic text editor. Fortunately, most computers already
    have both of these installed.


    **Note:** For Windows we recommend using the **Notepad++** text editor. For Mac
    we recommend the **Text Wrangler** editor. **Google’s Chrome** is recommended
    for both platforms.


    Let’s write your first program.


    - 1. Open your browser and navigate to google.com (type "http://google.com" in
    the address bar and press enter).

    - 2. Right click on the page and select **Inspect element** from the context menu.


    ![](img/d20203a9468fea810d478d2b57511c96_0.png)


    The browser window should now split. One part should show **Network**, the other
    should have **Elements**.


    3. Look for a tab labeled **Console**.

    4. In the Console, you will see `>`.

    5. Type this and hit enter:


    ```javascript

    alert("Hello World");

    ```


    If typed correctly, a window should pop up that says "Hello World".


    ![](img/d20203a9468fea810d478d2b57511c96_0.png)


    You have written your first program!


    ## Chapter 2: Variables AKA Boxes to Save Stuff for Later


    Variables are used in programming to store and organize things. In Javascript,
    you can put just about anything in a variable; things strings (text), numbers
    and more.


    If it is not open, open the console and let''s change up our first program a bit.


    In the console type:


    ```javascript

    var welcome = "Welcome to my game";

    alert(welcome);

    ```


    If typed correctly, you should see a small window appear that says "Welcome to
    my game!"


    ![](img/d20203a9468fea810d478d2b57511c96_0.png)

