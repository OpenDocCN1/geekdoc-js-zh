    No adventure game can be complete without a battle. You may be wondering how a
    fight can take place when all you can do is type A, B and C. For this type of
    action you have to think less about video games and think more about traditional
    ones. Just for a moment forget about electronic games and think about board games.
    Think about an element of some board games that keeps play fun and unpredictable.


    If you guessed the dice, you would be right. Dice are central to many games because
    the outcome of a roll cannot be predicted. The game you are creating is also going
    to use dice; not the real thing but a dice function. While we won''t cover creating
    a dice function, you will use a prebuilt one.


    Included in the sample code is something called HelgaJS. HelgaJS is a bunch of
    pre-written Javascript code that provides convenience and structure to building
    this type of game. This is included in the index.html webpage. HelgaJS has a method
    called rollDice that returns a random number between 1 and 12.


    To see the rollDice method in action, load the index.html page and in the console
    type:


    ```

    ge.rollDice():

    ```


    Try the rollDice method several times to see the various numbers it produces.
    It should be really hard to produce the same number 3 times in a row.


    ![](img/d20203a9468fea810d478d2b57511c96_47_0.png)


    You might notice the ge. before the the rollDice method. That part is the object'
- md: "\nthat rollDice belongs to you. You can think of an object as a special variable\
    \ that can hold many other variables and functions. When a function belongs to\
    \ an object is called a method. This may be confusing, but that is just the way\
