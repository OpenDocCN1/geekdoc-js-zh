  \n考虑下面的代码示例，它演示了从给定 DOM 元素开始的基础遍历。该片段展示了如何访问父元素、遍历子节点以及在兄弟元素之间导航：\n\n```javascript\n\
  let listItem = document.getElementById(\"item-3\"); \n\n// Access the parent element\
  \ \nlet parentList = listItem.parentNode; \nconsole.log(\"Parent element tag:\"\
  , parentList.tagName); \n\n// Loop through child elements of the parent \nfor (let\
  \ i = 0; i < parentList.children.length; i++) { \n  console.log(\"Child element\
  \ \" + i + \" tag:\", parentList.children[i].tagName); \n} \n\n// Access sibling\
  \ elements \nlet nextSibling = listItem.nextElementSibling; \nlet prevSibling =\
  \ listItem.previousElementSibling; \nif (nextSibling) { \n  console.log(\"Next sibling\
  \ tag:\", nextSibling.tagName); \n}\n```\n\n\n\n\n```javascript\nconsole.log(\"\
  Previous sibling tag:\", prevSibling.tagName);\n}\n```\n\n这些传统方法非常有效，但现代 Web API（如\
  \ `querySelector` 和 `querySelectorAll`）也可以利用 CSS 选择器用于 DOM 遍历。这些方法允许开发者编写简洁且强大的查询，根据元素的类、ID、标签，甚至在\
  \ DOM 层次结构中的位置来定位目标元素。例如，要检索特定容器内的所有段落元素，你可能会使用：\n\n```javascript\nlet paragraphs\
