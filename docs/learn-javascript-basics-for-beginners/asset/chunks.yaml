  trans: "\n\n![](img/cover0007.jpeg)\n\n# 学习 JavaScript 基础：入门教程\n## 快速易地学习编程基础\n\
    JP TAM\n\n## JavaScript 教程\n这节 JavaScript 课程让初学者和专家都能轻松学习 JavaScript。\n\n### 什么是\
    \ JavaScript？它是如何工作的？\nJavaScript 是一种用于计算机的动态编程语言。它是一种轻量级的跨基于对象的脚本语言。\n通过 JavaScript，我们可以让网站更具活力和吸引力。\n\
    由 Netscape 员工 Brendan Eich 在 1995 年设计了它。这是一种用于创建交互式网站的编程语言。它最常用于：\n- 客户端验证。\n\
    - 下拉菜单是动态的。\n- 显示当前日期和时间。\n- 在数据传输到服务器之前，验证 HTML 表单中的用户输入。\n- 创建无需连接服务器即可响应用户输入的表单。\n\
    - 开启新窗口或帧并关闭它们。\n- 使用弹出窗口和对话框显示信息（例如：警报对话框、确认对话框或提示对话框）。\n- 创建短小但完整的客户端程序。\n-\
    \ 闹钟和其他计时器。\n- 移动设备的游戏和应用开发。\n\n### JavaScript 的特性\n- JavaScript 是一种基于对象的脚本语言。\n\
    - 该语言区分大小敏感。\n- 它是轻量级的。\n- 在 JavaScript 中，每个语句后面都必须跟一个分号（`;`）。\n\n### JavaScript\
    \ 的优势\n- JavaScript 是一种解释型脚本语言。不需要编译器，因为没有编译过程。JavaScript 被浏览器当作 HTML 标签进行解释。\n\
    - JavaScript 是一种简单的编程语言。对任何人来说都非常容易学习。它被用于创建动态且吸引人的网站。\n- 因为 JavaScript 在客户端运行，所以它降低了网站服务器的负载。\n\
    - 它包含了可以在网页中使用的条件检查、循环和分支功能。\n对于 对于终端用户来说，JavaScript 是相对快速。他们不需要等待页面加载来检查是否漏掉了某些内容。\n\
    - 网页现在拥有更多功能。为了给网站访问者提供更多功能，我们可以使用 JavaScript 包含拖放组件和滑块。\n\n## JavaScript 示例\n\
    ```html\n<h2>欢迎来到 JavaScript</h2>\n<script>\n  document.write(\"Hello JavaScript\
    \ by TutorialandExample\");\n</script>\n```\n**输出：**\n欢迎来到 JavaScript\nHello JavaScript\
    \ by TutorialandExample\n\n### JavaScript 示例\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <h2>欢迎来到 JavaScript</h2>\n  <script>\n  document.write(\"Hello Friends\"\
    );\n  </script>\n</body>\n</html>\n```\n**输出：**\n欢迎来到 JavaScript\nHello Friends\n\
    \n可以通过在代码中包含 JavaScript 语句来实现引入 JavaScript：`<script>...</script>`。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n  document.write(\"\
    Hello World\");\n  </script>\n</body>\n</html>\n```\n**输出：**\nHello World\n\n\
    在 JavaScript 中，代码可以写在三个地方：\n1. 在 HTML 的 `<body>`...`</body>` 标签之间。\n2. 在 HTML\
    \ 的 `<head>`...`</head>` 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\n#### 示例说明（body\
    \ 标签之间的代码）\n在下面的示例中，body 标签包含了 JavaScript 代码。\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script type=\"text/javascript\">\n  alert(\"Hello world\");\n  </script>\n\
    </body>\n</html>\n```\n\n#### 示例 2（head 标签之间的代码）\n我们将在下面的示例中创建函数 `msg()`。在 JavaScript\
    \ 中，你必须编写函数名来定义一个函数。要调用函数，我们必须先创建一个事件。在这种情况下，我们正在使用 `onclick` 事件来调用 `msg()` 函数。\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\">\n\
    \  function msg(){\n    alert(\"Hello world\");\n  }\n  </script>\n</head>\n<body>\n\
    \  <p>欢迎来到 JavaScript</p>\n  <form>\n    <input type=\"button\" value=\"click\"\
    \ onclick=\"msg()\"/>\n  </form>\n</body>\n</html>\n```\n\n#### 外部 JavaScript\n\
    我们可以创建一个 JavaScript 文件并将其包含在 HTML 文件中。由于单个 JavaScript 文件可以被多个 HTML 页面使用，因此它允许代码复用。提高了网页的性能。该文件必须具有\
    \ `.js` 扩展名。\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
    \ src=\"message.js\"></script>\n</head>\n<body>\n  <p>Hello world</p>\n  <form>\n\
    \    <input type=\"button\" value=\"click\" onclick=\"msg()\"/>\n  </form>\n</body>\n\
    </html>\n```\n\n## JavaScript 注释\nJavaScript 中的注释用于描述代码。它用于包含代码相关信息，例如警告或建议，以便终端用户可以理解它。\n\
    ### 类型\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n使用双正斜线 `//` 来表示单行注释。在程序运行时，双斜线之间的任何文本都会被忽略。\n\
    \n**例 1：在语句前添加注释：**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n  //\
    \ 单行注释\n  document.write(\"hello world\");\n  </script>\n</body>\n</html>\n```\n\
    \n**例 2：在语句后添加注释：**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n  var\
    \ a=10;\n  var b=20;\n  var c=a+b; //添加 a 和 b 变量的和\n  document.write(c); //打印\
    \ 10 和 20 的和\n  </script>\n</body>\n</html>\n```\n**输出：** 30\n\n### 多行注释\n单行和多行注释都可以通过多行注释来实现。跨多行的注释以\
    \ `/*` 开始，以 `*/` 结束。JavaScript 将忽略其中的文本。\n\n**示例：**\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script>\n  /* 这是多行注释。\n     不会显示 */\n  document.write (\"Example\
    \ of JavaScript line comment\");\n  </script>\n</body>\n</html>\n```\n\n## JavaScript\
    \ 变量\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。在使用变量之前必须先声明它。要声明变量，我们使用 `var` 关键字，如下：\n\
    `var name;`\n\n变量有 2 类：\n1. 局部变量\n2. 全局变量\n\n### 局部变量\n它定义在函数或块内部。\n**示例：**\n\
    ```javascript\n<script>\nfunction abc(){\n  var x=10; //局部变量\n}\n</script>\n```\n\
    \n### 全局变量\n它具有全局作用域，意味着它可以在 JavaScript 代码的任何地方定义。在函数外部声明变量。\n**示例：**\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n  var data =200; //全局变量\n  function\
    \ a(){\n    document.writeln(data);\n  }\n  function b(){\n    document.writeln(data);\n\
    \  }\n  a();//调用 javascript 函数\n  b();\n  </script>\n</body>\n</html>\n```\n\n\
