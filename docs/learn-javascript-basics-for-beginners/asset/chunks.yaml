  trans: "\n\n为了复用代码，我们多次调用 JavaScript 方法。\n\n### 优点 - JavaScript 函数\n\n1. **代码可重用性**：我们多次使用同一个方法来节省时间和代码量。\n\
    2. **更少的代码**：结果是我们的应用程序被压缩了。当我们执行常规任务时，不需要编写大量的代码。\n\n### 语法\n\n```javascript\n\
    function functionName(parameter or not) \n{\n  statements\n}\n```\n\n### 示例\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body\n<script>\nfunction msg() {\n  alert(\"\
    Hello! world\");\n}\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"\
    click here\"/>\n</body>\n</html>\n```\n\n### 输出\nHello world!\n\n### 带参数的函数\n\n\
    通过传递参数来调用函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<body\n<script>\nfunction getcube(number)\
    \ {\n  alert(number*number*number);\n}\n</script>\n<form>\n  <input type=\"button\"\
    \ value=\"click\" onclick=\"getcube(3)\"/>\n</form>\n</body>\n</html>\n```\n\n\
    #### 输出\n27\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\n\
    function getname() {\n  name=prompt(\"Enter the Name\");\n  alert(\"Welcome Mr/Mrs\
    \ \" + name);\n}\n</script>\n</body>\n<form>\n  <input type=\"button\" value=\"\
    Click\" onclick=\"getname()\"/>\n</form>\n</html>\n```\n\n### 带返回值的函数\n\n调用返回值的函数，并在程序中使用它。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body\n<script>\nfunction getInfo() {\n  return\
    \ \"Hello Raj! How are you?\";\n}\n</script>\n<script>\n  document.write(getInfo());\n\
    </script>\n</body>\n</html>\n```\n\n### 输出\nHello Raj! How are you?\n\n### Function()\
    \ 构造函数\n\n函数语句不仅用于定义新函数，还可以使用 `Function()` 构造函数和 `new` 运算符来动态定义函数。\n\n### 语法\n\
    \n```javascript\n<script>\n    var varilename = new Function(Arg1, Arg2..., \"\
    Function Body\" );\n</script>\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<script>\nvar func = new Function(\"a\", \"b\", \"return a+b;\");\nfunction\
    \ secondFunction(){\n  var result;\n  result = func(50,50);\n  document.write\
    \ ( result );\n}\n</script>\n</head>\n<body>\n  <p>点击按钮调用函数</p>\n  <form>\n  \
    \  <input type=\"button\" onclick=\"secondFunction()\" value=\"Call Function\"\
    >\n  </form>\n  <p>在函数内部使用不同的参数并尝试一下吧...</p>\n</body>\n</html>\n```\n\n### 函数字面量\
    \ (Function Literals)\n\n函数字面量的概念（构造函数的另一种方式）在 JavaScript 1.2 中被引入。它是一个表达式，定义了一个没有名字的函数。\n\
    \n函数字面量的语法与函数语句相似，不同之处在于被用作表达式而不是语句，并且不需要函数名。\n\n### 语法\n\n```javascript\n<script>\n\
    var variablename = function (Argument List){\n  Function Body\n};\n</script>\n\
    ```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func\
    \ = function(a,b){return a+b};\nfunction secondFunction(){\n  var result;\n  result\
    \ = func(10,20);\n  document.write ( result );\n}\n</script>\n</head>\n<body>\n\
    \  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Call Function\">\n  </form>\n  <p>在函数内部使用不同的参数并尝试一下吧...</p>\n</body>\n\
    </html>\n```\n\n### JavaScript 对象\n\n对象是一个包含状态和行为的实体。JavaScript 是一种专注于对象的脚本语言。虽然\
    \ JavaScript 更多基于模板而非基于类，但它允许我们创建对象。\n\n### 语法 - 添加属性 - 添加对象\n\n`objectName.objectProperty\
    \ = propertyValue;`\n\n我们使用 `write()` 方法来记录对象，以便在文档上写入任何内容。\n`document.write(\"\
    Hello world\")`\n\n### 示例 以下示例展示了如何创建一个对象。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>用户自定义对象</title>\n<script type=\"text/javascript\">\nvar book =\
    \ new Object(); // 创建了对象\nbook.subject = \"5 points someone\"; // 将属性赋值给对象\nbook.author\
    \ = \"Chetanagat\";\n</script>\n</head>\n<body>\n  <script type=\"text/javascript\"\
    >\n    document.write(\"Book Name is: \" + book.subject + \"<br>\");\n    document.write(\"\
    Book Author is: \" + book.author + \"<br>\");\n  </script>\n</body>\n</html>\n\
    ```\n\n### 输出\nBook Name is : 5 points someone\nBook Author is : Chetanagat\n\n\
    ### 对象的方法\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户自定义对象</title>\n\
    <script type=\"text/javascript\">\n// 定义作为方法的函数\nfunction addPrice(amount){\n\
    \  this.price = amount;\n}\nfunction book(title, author){\n  this.title = title;\n\
    \  this.author = author;\n  .addPrice = addPrice; // 将该方法作为属性\n}\n</script>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    var myBook = new book(\"\
    5 points\", \"Chetanagat\");\n    myBook.addPrice(150);\n    document.write(\"\
    Book Name is: \" + myBook.title + \"<br>\");\n    document.write(\"Book Author\
    \ is: \" + myBook.author + \"<br>\");\n    document.write(\"Book Price is: \"\
    \ + myBook.price + \"<br>\");\n  </script>\n</body>\n</html>\n```\n\n### 数组 (array)\n\
    \n数组用于表示单个单元或内存区域中的元素集合。元素从零开始唯一索引。我们通过索引存储数据。在 JavaScript 中，必须使用 `new` 关键字来声明数组。我们使用\
    \ `new` 来构造数组。数组中的槽的数量由 `n` 表示。\n\n### 语法\n\n```javascript\narray = new array(n);\n\
    ```\n注意：当我们在 JavaScript 中构建数组时不指定大小，我们会构造一个零大小的数组。\n\n### 示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\nvar i;\nvar emp = new Array();\nemp[0] = \"\
    Ajay\";\nemp[1] = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3] = \"Shipra\";\nfor(i=0;\
    \ i<emp.length; i++) {\n  document.write(emp[i] + \"<br>\");\n}\n</script>\n</body>\n\
    </html>\n```\n\n### 输出\nAjay\nAbhay\nArun\nShipra\n\n### 示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction array() {\n\
    \  num = new Array(5);\n  num[0] = 10;\n  num[1] = 20;\n  num[2] = 30;\n  num[3]\
    \ = 40;\n  num[4] = 50;\n  sum = 0;\n  for(i=0; i<num.length; i++) {\n    sum\
    \ = sum + num[i];\n  }\n  alert(sum);\n}\n</script>\n</head>\n<body>\n  <input\
    \ type=\"button\" onclick=\"array()\" value=\"click here\">\n</body>\n</html>\n\
    ```\n\n### 数组中使用的函数\n\n![](img/image00072.jpeg)\n\n"
