  md: 'You can find example implementation of these icons in the file peculiar-icons.
    html in the chapter6 folder. To implement the icons here, you need to download
    the Peculiar icon CSS and HTML from the URL provided earlier, and then copy all
    the HTML and CSS to your own files. For example, this where I Put the Home icon:


    +   <li>

    <a href="#">Home

    <div class="icon icon-home">

    <div class="icon-home-triangle"></div>

    <div class="icon-home-rectangle"></div>

    <div class="icon-home-line"></div>

    </div>

    </a>

    </li>


    You need to make sure the icon HTML is placed inside the container you want it
    to appear in (in this case the anchor) and that the container will display as
    a block-level element. In the case of your mine this works, because the anchors
    are already set to display: inline-block; to make the sizing work. Once all the
    Peculiar CSS is in place, you need to modify it a bit. For starters, the general
    icon needs some work:


    ```

    .icon {

    position: absolute;

    top: 16px;

    left: 48px;

    width:16px;

    height:16px;

    transform: scale(1.5);

    }

    ```'
