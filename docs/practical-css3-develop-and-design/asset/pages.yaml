    Figure 7.15 A schematic of the example grid.


    You can use nested grids if you like to create all kinds of complicated layouts,
    although if you consider doing this, your information architecture might need
    revisiting! I''m sure this simple example gives you a good idea of how powerful
    these grids can be, especially considering that you can create liquid grids as
    well as fixed grids, and you can place elements wherever you like on the grid
    regardless of source order and structure.


    # A REAL GRID EXAMPLE


    Now let''s look at a more complex example. Here you''ll go back and re-lay out
    "our-friends" in the wild example using CSS grids. As you follow along, you can
    look at the file our-friends-css-grids.html in the code download to find the right
    code if you go wrong at some point.


    As grids become more complex, it''s best to start drawing them out on paper (or
    some other medium) and then refer to the sketch you start placing your content.
    The grid you''ll use looks something like the one in Figure 7.15.


    EXPLORING GRIDS 273'
