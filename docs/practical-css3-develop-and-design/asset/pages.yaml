  md: "# A RESPONSIVE HEAVY METAL BANNER AD!\n\nAs promised earlier in the book, I'll\
    \ round off this chapter by returning to the heavy metal banner ad and making\
    \ it responsive. I'll make it pair down to the smaller \"large rectangle\" ad\
    \ size of 336 x 280 in devices with screens narrower than 800px and change it\
    \ to a narrow banner that spans 100 percent of the screen width in very narrow\
    \ devices (less than 480px). I'll also use the media attribute in my video <source>\
    \ to stop the video being served to narrow-screen devices and include a background\
    \ image in such cases. See the poster-responsive folder in the root of the code\
    \ download for the finished version.\n\n# FIRST ALTERNATIVE: 800PX OR LESS\n\n\
    The middle-sized ad is achieved via the following media query:\n\n```\n@media\
    \ all and (max-width: 800px) {\n  ...\n}\n```\n\nA fair amount of work was required\
    \ here to adjust all the styles and get the ad looking good at this narrower size.\
    \ I won't discuss all the CSS changes in the media query, because there is nothing\
    \ new here. To see all the new styles, for the preceding media query in the code\
    \ and check them out.\nNote that I didn't tweak the animations: When I tested\
    \ the narrow size in animation-supporting browsers, all the animations seemed\
    \ to still look fine.\n\n# SECOND ALTERNATIVE: 480PX OR LESS\n\nFor all of the\
    \ new styling in this section to work correctly, I used viewport to make mobile\
    \ browsers render at the real device width:\n\n```\n<meta name=\"viewport\" content=\"\
    width=device-width\">\n```\n\nHere is I set up the alternative styling for narrow-screen\
    \ browsers. Note that I've completely hidden the <video> to save on processing\
    \ in small-screen devices:\n\n```\n@media all and (max-width: 480px) {\n  video\n\
    \  display: none;\n}\n```"
