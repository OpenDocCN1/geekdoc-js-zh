  md: '**FIGURE 3.27** Contextual swashes (font is Nexus Serif from http://ie.microsoft.com/testdrive/Graphics/opentype/opentype-font/index.html).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_111_0.png)


    **FIGURE 3.28** Contextual alternatives (font is Mister K from http://ie.microsoft.com/testdrive/Graphics/opentype/opentype-font/index.html).


    +   - **csw.** Contextual swashes are similar to stylistic swashes except that
    flourishes are used only in certain contexts (**Figure 3.27**).

    - **calt.** Contextual alternatives are alternative letter forms available for
    use, an example of which is shown in **Figure 3.28.**


    # TIPS FOR FONT-FEATURE USAGE


    For more successful usage of advanced typographical font features, consider the
    following tips.


    # BUILD UP TEST FILES


    Missing from the typographical puzzle seems to be how to determine which fonts
    include the features I''ve been discussing in this section that you can use them.
    At this time, it will take a bit of trial and error. When looking for a font to
    use, my advice is to create a sample type template that includes all the potential
    letter sequences you might want, and then apply a simple stylesheet to it that
    includes all available ligatures and other font features. When trying different
    fonts to it and observe the results. A service like Fontdeck makes this very easy
    to do. In Firefox 8 or IE10, trying viewing the following example:http://people.opera.com/cmills/css3book/fontdeck_example.html.'
