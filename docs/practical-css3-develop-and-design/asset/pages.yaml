    Here are a few pseudo-classes to quickly consider:


    +   - only-child. Selects an only element if it is the only child of its parent—for
    example, article:only-child would not select anything in the preceding example
    because there is more than one <article> child.


    +   - only-of-type. Selects an only element if it is the only sibling of its type
    inside the parent element. For example, blockquote:only-of-type would select the
    <blockquote> in the preceding example because it is the only one of its type present.


    +   - empty. Selects an only element if it has no children whatsoever (including
    text nodes). For example, div:empty would select <div></div> but not <div>1</div>
    or <div><p>Hi!</p><div> .


