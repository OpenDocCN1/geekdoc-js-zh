  md: '# A PREFIXED NIGHTMARE?


    I put the prefixed properties in my example in the order they are in for two reasons.
    First, it looks aesthetically pleasing to have the widest prefix first and the
    narrowest last.


    Second, at the time of this writing, a number of non-WebKit browser makers were
    discussing adding support for -webkit- prefixed versions of some properties, as
    well as their own prefixed versions. By putting -webkit- first, we can make sure
    that if this happens, browsers will will end up with their own prefixed version
    if it is present, not -webkit-, because the others appear later in the cascade.


    Using the correct prefixed property will always be better and more accurate than
    relying on faked -webkit-, especially considering that in some cases you might
    feed the browsers different property values because of varying support. For example,
    when Opera does not yet support 3D transforms, so you could provide Opera with
    this 2D transform that would work:


    ```

    -webkit-transform: rotate3D(1,0,10deg);

    -o-transform: translateX(300px);

    ```


    Why other browsers considering adding -webkit- support? Because many developers
    have been boring an ill-conceived idea that WebKit is the only engine ever worth
    supporting. They were using lots of CSS3 features only with the -webkit- prefix,
    thereby making those features arbitrarily fail in browsers that support them.
    As far as users are concerned, it is the browsers that are at fault. The average
    visitors know nothing better, and neither should they be expected to. Messy as
    it is, non-WebKit browsers adding -webkit- support is a somewhat desperate measure
    to fix this browser support mess to some degree.


    To sum up, it is a nightmare having five different versions of the same property
    in such situations. A few people think that you shouldn''t vendor prefixes at
    all in production projects, and that they are only for testing purposes (this
    is the W3C''s official stance too). But don''t let that stop you. As you''ll discover
    throughout this book, it is easy to maintain an acceptable exception in browsers
    that don''t support those properties, as long as you give it a bit of foresight!


    If you want to use CSS3 features, please do so responsibly and use all the different
    prefixes for supporting browsers. And don''t make your sites dependent on a particular
    feature that doesn''t have crossbrowser support!


    This transition shorthand property tells the browser to smoothly transition every
    property that changes when the link''s state changes over a duration of 1 second
    (see Chapter 5 for more details). In this case it is the background color that
    changes. The aspect to focus on in this code is the fact that there are five copies
    of the transition property. The first four include vendor prefixes. At the time
    of


    GENERAL CSS3 FEATURES 15'
