  md: "CSS3 ATTRIBUTE SELECTORS\nCSS3 extends the basic attribute selector functionality\
    \ by allowing you to select elements based on strings within attribute values.\
    \ For example, you could select and style <img src=\"alert.gif\"> could also be\
    \ styled like this:\n\n```\nimg[src=\"alert\"] {\n  border: 1px solid #000000;\n\
    }\n```\n\nThe ^ character dictates that this selector should select <img> elements\
    \ only if they have the string 'alert' at the start of the src attribute value.\n\
    <img src=\"alert.gif\"> could also be styled like this:\n\n```\nimg[src$=\"gif\"\
    ] {\n  border: 1px solid #000000;\n}\n```\n\nThe $ character dictates that this\
    \ selector should select <img> elements only if they have the string 'gif' at\
    \ the end of the src attribute value. This is really useful for styling links\
    \ that point to specific types of resources: You could perhaps add specific icons\
    \ to different links depending on whether they link to PDFs, Word documents, and\
    \ so forth.\nYou could also style <img src=\"alert.gif\"> like this:\n\n```\n\
    img[src=\"ert\"] {\n  border: 1px solid #000000;\n}\n```\n\nThe * character dictates\
    \ that <img> elements with the string 'ert' anywhere within the src attribute\
    \ will be selected."
