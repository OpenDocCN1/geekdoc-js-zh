- img_proc: true
  md: '# LINEAR GRADIENT COLOR STOPS


    You can also add multiple color stops between the start and the end point by putting
    them between the start and end color stops, like this:


    ```

    background: linear-gradient(to right, #ff0000,#0000ff 40%, #000000 70%,#007700);

    ```


    The result is shown in Figure 4.15.

    The units specify the distance away from the start of the gradient. Note that
    the percentage values are optional: If you don''t specify them, the color stops
    will be evenly spaced along the gradient.


    Instead of percentages, you can use any units you like that would make sense in
    the circumstances. By default, the first and last values are at 0% and 100%, but
    you can alter their positions too. For example:


    ```

    background: linear-gradient(#ff0000 66px, #ffffff 67px, #ffffff 133px,#ff00ff
    134px);

    ```


    This effect creates three solid color bands to bring to life (Figure 4.16). The
    green color stop is set at 66px down from the top, and everything it adopts the
    same color. The red color stop is set at 134px, and everything after it adopts
    the same color. I also inserted two white color stops in the middle to force the
    middle band to be completely white. This technique is very useful, especially
    if you want to start creating more intricate and interesting repeating background
    patterns, as you''ll read later in the “Multiple Backgrounds” section.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_129_0.png)


    > FIGURE 4.16 Italiano, pasta, meatballs, Roma Roma (well, not quite).'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'FIGURE 4.17 RGBA colors provide great control over gradients while blending
    them into their surroundings.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_130_0.png)


    You can even use negative unit values if for some reason you want the linear gradient
    to start or end outside the container. (You might want to change the gradient
    over. Unfortunately, you can''t smoothly animate a gradient, at least not at the
    time of this writing. Believe me, I''ve tried.)


    Again, I''ll extol the awomeness of transparent colors by providing a very simple
    gradient with a vital difference (Figure 4.17):


    +   - background: linear-gradient(to top right,

    - rgba(0,0,0,0.6),rgba(0,0,0,0));


    background-color: #ff0000;


    Here the gradient is a transparency gradient overlaid onto a solid background
    to create the different gradient colors. This is a very powerful technique because
    it means you can control the look of an entire site just by varying the background
    color. It''s perfect if you want to vary the look of different pages on a site
    with minimum effort. Try it!


    TIP: It''s a good idea to include a suitable background color in a separate property
    alongside your gradient, even if the gradient is not transparent. It acts as a
    good fallback mechanism for a browser that doesn''t support CSS gradients, ensuring
    that content is still readable.'
  merge: -1
