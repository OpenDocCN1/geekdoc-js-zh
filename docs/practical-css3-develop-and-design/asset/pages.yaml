  md: 'So, what about site headers and footers? You would traditionally mark these
    up using something like this:


    ```

    <div id="header"></div>

    ```


    ```

    <div id="footer"></div>

    ```


    Pretty much every website or app has this. The header (or masthead) contains the
    site logo, title, and so on, and the footer contains site-wide content like copyright,
    accessibility statement, and so forth. The HTML5 recognized introduced the following
    unambiguous semantic elements to the job:


    ```

    <header>

    ```


    ```

    </footer>

    ```


    If you refer back to my sample blog pages, you''ll see some examples of <header>
    and <footer> usage. Note that there are some inside <article>s and <section>s.
    This is perfectly allowed: You can do this to specify headers and footers for
    subsections of your content rather than the whole site. You can therefore have
    multiple <header>s and <footer>s in a single document.


    # <aside>


    The <aside> element is really a special kind of <section>, specifically tasked
    with containing secondary information related to the main content of the site
    that doesn''t fit within the main flow. Good examples include a biography of the
    author of that page, a mini interview with the author, or a bibliography/references
    further reading. It can, however, also be secondary content on the site, a typical
    sidebar, a blogroll, or a list of other blog posts on the site related to the
    main content. (even if they are not posts related to the main content). The list
    of Tweets in my previous example is suitable as an <aside>.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'You can also quite happily use an <aside> element inside an <article> too,
    as long as it contains content tangentially related to just that article. A biography
    of the author of just that article or further reading to go on to after you''ve
    finished that article would be suitable. The element simply looks like this:


    ```

    <aside></aside>

    ```


    # <NAV>


    The <nav> element was created to house the document''s primary navigation, whether
    that is a standard "list-o-links" nav bar, a drop-down menu, or even a search
    box. It shouldn''t be used for secondary navigation bars, related reading links,
    and so on. You can put it anywhere you like in your markup that makes sense. In
    my main blog site example, it''s inside the <header>:


    ```

    <header>

    <nav>

    ..

    </nav>

    </header>

    ```


    There are many advantages to having the document''s primary navigation inside
    an unambiguous semantic element. For example, when browsers and screen readers
    start to recognize this element, it will make accessibility hacks like "skip to
    navigation" links a thing of the past.'
