  md: '# ADDING DEPTH WITH

    BOX-SHADOW


    FIGURE 4.5 A basic box

    shadow (left).


    FIGURE 4.6 Box shadow and

    rounded corners together

    (right).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_122_0.png)


    Next on the whistle-stop tour is box-shadow (also in www.w3.org/TR/css3

    -background), which allows you to add drop shadows to containers. This property

    is very useful for adding depth to a design, highlights, and user feedback when
    used

    in conjunction with pseudo-classes and transitions, as you''ll see in later examples

    (buttons, link highlights, etc.)

    The box-shadow syntax is as follows:


    ```

    box-shadow: 2px 2px 1px black;

    ```


    The first two values specify the horizontal and vertical offset of the shadow

    from the container. Positive values offset the shadow right and down, whereas

    negative values offset the shadow left and up. The third value specifies the

    amount of blur radius the shadow has (this is optional and defaults to 0 if not

    explicitly declared). Increase the value for blurry, spread-out shadows.

    The color is, as you''d expect, the color of the shadow.

    This shadow created the effect in Figure 4.5.

    Using a subtle shadow like this is ideal for implying just a bit of depth or texture,

    making the container look slightly raised.

    Now''s add some rounded corners into the mix:


    ```

    border-radius: 10px;

    box-shadow: 2px 2px 1px black;

    ```


    As you can see in Figure 4.6, the shadow follows the shape of the rounded

    ners, which is rather convenient.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'FIGURE 4.7 A more pronounced box shadow produces a nice lift (left).


    FIGURE 4.8 An RGBA color gives the box a natural-looking, more subtle shadow (right).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_123_0.png)


    Using more offset and blur produces a more striking effect:


    border-radius: 10px;


    box-shadow: 5px 5px 10px black;


    The box now looks like it has truly been lifted into the air (Figure 4.7):

    But something about the box just doesn''t look right. The shadow is rather unnatural.
    Usually, shadows have a tint of the color of whatever is below peeking through.
    But never fear; you can achieve this look easily using an RGBA color (Figure 4.8):


    border-radius: 10px;


    box-shadow: 5px 5px 10px rgba(0,0,0,0.5);'
  merge: -1
  pgno: 123
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_124_0.png)


    You next need to know that you can include multiple box shadows on a single container.
    You just write the different shadows you want one after another, delimited by
    commas:


    border-radius: 10px;

    box-shadow: 2px 2px 5px rgba(0,0,0,0.5),

    10px 10px 15px rgba(0,0,0,0.5),

    -1px -1px 30px rgba(0,0,0,0.2);


    This trio creates some immediate depth, plus the suggestion of multiple light
    sources (the very faint shadow is offset left and up using negative values) (**Figure
    4.9**).

    Now let''s look at inner box shadows. You can make any box shadow by adding the
    inset keyword at the start. For example:


    border-radius: 10px;

    box-shadow: 2px 2px 5px rgba(0,0,0,0.5),

    inset 5px 5px 8px rgba(0,0,0,0.5);


    **Figure 4.10** shows the result. This technique is useful for creating nice “button
    being pushed in” type thingamajigs (technical term).'
  merge: -1
  pgno: 124
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_125_0.png)


    Finally, let''s look at one more possible unit value you could include: spread.
    I''m not talking about middle-aged spread or marmalade but the fact that you can
    add a fourth unit value to specify an amount that the shadow size will increase
    by in all directions. It''s like "padding" for shadows. For example:


    ```

    border-radius: 10px;


    box-shadow: 5px 5px 10px rgba(0,0,0,0.5);

    ```


    See the effect in Figure 4.11. I''ve never found a use for adding a spread value,
    but probably will.


    > NOTE: Use box shadows responsibly! Used subtly they can produce a great effect
    and lift a design. However, if you use a lot on the same site and on large containers,
    they can make the site look cluttered and horrible. They can also cause a significant
    performance impact, especially if you combine them with animations. They are expensive
    to render in terms of processing power.


    # ADDING BOX SHADOW SUPPORT TO OL IE


    Adding CSS3PIE into the mix, as you did earlier, also adds box-shadow support
    for older versions of IE. But remember CSS3PIE''s limited support for RGBA: It
    is often better to provide an alternative style with a nontransparent color that
    might be effective. You could provide this in a conditional-commented stylesheet.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_125_1.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# BRING THE BLING WITH

    CSS GRADIENTS


    Gradients are one of the most anticipated features to become native to CSS.

    Gradients are vital for design in general to reproduce the effects of light falling
    on

    curved/shiny surfaces and create interesting patterns. The number of developers

    who use them in web design is staggering, if not surprising. A surprise

    until CSS3 comes along, web developers never had the ability to create gra-

    dients programmatically in any way that would work across browsers. SVG

    had gradients for a long time before that, but IE never supported SVG until IE9.


    All this time you''ve been stuck with either faking SVG in IE using a Polyfill

    solution like SVGWeb or using background images for gradients or

    repeating patterns you desired. This last technique is an inflex-

    ible pain and can become cumbersome very quickly, especially if your boss keeps

    changing his mind about the gradient colors (more playing with Photoshop; oh

    goody) or if you are trying to create any kind of complicated layered effect.


    Again, CSS3 comes to the rescue with linear and radial gradients, which are

    defined in the CSS Image Values and Replaced Content module http://devw3.org/

    csswg/css3-images). To see how flexible CSS gradients are, just have a good play

    with the examples in this section.


    Let''s review the two different gradient types separately.


    # LINEAR GRADIENTS


    Linear gradients are the simpler of the two types; these are smooth color progres-

    sions that start at one side or corner of an area and cycle smoothly between two

    or more color stops, ending at the other side or corner.


    In CSS they work the same. CSS gradients are basically a special kind of back-

    ground image. You can set them in place of an image in many places that it would

    sense to do so; for example, background-image and border-image (see the

    “Box Clever: border-image” section later in this chapter for more details)'
  merge: -1
  pgno: 126
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_127_0.png)


    The most common place you''ll want to use them is on standard, commonplace backgrounds.
    Here is a simple syntax example:


    ```

    background: linear-gradient(#ff0000, #007700);

    ```


    **Figure 4.12** shows the result, taken from an example file in the chapter4 download
    folder called linear-gradient-test.html. The two colors are the start color in
    the gradient and the end color, and by default the gradient runs from the top
    to the bottom of the container.


    LINEAR GRADIENT DIRECTION

    If you want to vary the direction of your gradient, you can add a direction value
    at the start of the gradient, like this:


    ```

    background: linear-gradient(to bottom right, #ff0000, #007700);

    ```


    This direction value makes the gradient travel from the top left to the bottom
    right (**Figure 4.13**).

    As you''d expect, you can use a whole range of logical keywords for gradient direction:
    to top, to top right, to right, to bottom right, to bottom, to left, to left,
    to top left.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# FIGURE 4.14 My gradient app allows you to quickly experiment with gradients.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_128_0.png)


    You can also specify the direction you want the gradient to travel in using angle.
    Zero degrees (deg) is the equivalent of right; as you increase the angle, it travels
    around counterclockwise. So the subsequent equivalents would be 90deg = to top,
    180deg = to left, 270deg = to bottom. Keep in mind that 315deg will not be the
    equivalent of top left (as you might expect) unless the container is a perfect
    square: The diagonal keywords will change the angle the gradient will always run
    from one corner to the other. As a result, you can choose keywords or angles,
    depending on the effect you want to create.


    Note: The spec states that 0deg is the equivalent of the keywords to top, but
    browsers won''t follow currently. This could change in the future.


    **NOTES:** if you look at the code for the linear gradient example, you''ll notice
    that I''ve included five lines for the gradient - a prefixless line and one for
    all four major engines (Opera, Chrome, Firefox, Safari, and IE all support linear
    and radial gradients with vendor prefixes).


    Check out my linear-gradient-app.html file in the chapter4 code download folder
    (which looks like a simple page I put together using some JavaScript that allows
    you to dynamically apply different gradients to the page, either by clicking the
    preset buttons or entering your own `linear-gradient(...)` value into the input
    field and clicking the Create! button. You need to include the semicolon, but
    you don''t need to include all the vendor prefixes--just one nonprefixed version
    is all you need.'
