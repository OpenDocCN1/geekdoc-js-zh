  md: 'CSS3 and associated, modern web design goodies offer specific features for
    making HTML form styling easier. Simply put, HTML forms are a total pain to get
    looking good, and looking the same across browsers. The reason is that they are
    rendered so differently across browsers—and that is before you start using the
    new HTML5 form controls, which as mentioned in Chapter 2 are not supported that
    well across browsers.


    # IMPROVING CONSISTENCY


    A great way to instantly level the playing field and improve consistency across
    browsers is to apply that useful normalize.css to your forms (you''ve seen this
    throughout this book). Normalize renders many elements more consistently across
    browsers, including form controls. If you want to see the effect it has, look
    at the demo page at http://necolas.github.io/normalize.css/demo.html Scroll down
    to the “Forms” section. This may not be exactly what you want straight away, but
    it is a great base to build upon.


    # CSS3 PSEUDO SELECTORS


    CSS3 provides a number of form-related pseudo-classes to help you style forms
    that contain valid and invalid data. They should be used along with the new HTML5
    required attribute:


    ```

    <input type="text" id="name" name="name" required>

    ```


    Keep in mind that form elements need to have a name attribute to be submitted
    as part of a form and to be validated. The pseudo-classes available to use with
    CSS are as follows:


    +   - **required** and **optional**. These pseudo-classes let you style controls
    based on whether or not they have a required attribute.

    - **valid** and **invalid**. These pseudo-classes apply styles to form controls
    based on whether the data contained inside them is valid or invalid.

    - **in-range** and **out-of-range**. These pseudo-classes work with controls that
    feature a min and/or max attribute, styling data based on whether it is inside
    or outside the allowed range.'
