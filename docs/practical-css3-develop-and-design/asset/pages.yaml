- img_proc: true
  md: 'Traditionally, the web was a very static place. Achieving animations was not
    possible in any sane way until JavaScript, animated GIFs, and Flash came along,
    at which point everyone rejoiced and applauded the ensuing slew of skip intros
    and horrible obtrusive animations that crashed onto the web.


    Using these newer technologies was all well and good, but there was still no way
    for nondevelopers to create animations using open standards—until now! With CSS3,
    you can animate elements of your web documents. As a result, standards-based web
    design has become even more fun!


    In this chapter you''ll learn how to create useful animated effects for your web
    pages using CSS3 Animations, Transforms, and Transitions.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_157_0.png)'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# BRINGING ANIMATION TO CSS


    Combined, the following four specs provide you with several possibilities for
    creating more responsive interfaces, animated effects, and presentational enhancements,
    which previously were only available through JavaScript:


    +   * CSS Transforms (www.w3.org/TR/css3-2d-transforms and www.w3.org/TR/css3-3d-transforms).
    These two specifications define mechanisms for transforming the size, position,
    and shape of elements in two and three dimensions, and are in the process of being
    superseded by a single updated spec; see http://dev.w3.org/csswg/css3-transitions.

    * CSS Transitions (www.w3.org/TR/css3-transitions). Transitions give you a way
    to smoothly animate changes in state, such as a change in link color. Transitioning
    changes in property is also very effective in many circumstances.

    * CSS Animations (www.w3.org/TR/css3-animations). CSS Animations are similar to
    Transitions but do not rely on state changes. Instead, you define property values
    using @keyframes that relate to different stages of an animation (e.g., color:
    at the start of the animation; color: blue at the end of it). You then apply these
    animations to any element you want; the browser then applies the starting property
    values to the element and smoothly cycles them to the end property values (so
    color: red at the beginning smoothly animates to color: blue at the end).


    Support for all four specs is good across modern browsers. In any case, for non-supporting
    browsers it is simple to provide alternative styling using the Modernizr library,
    which you''ll learn about in detail later in the "Providing Alternatives to Modernizr"
    section.


    So let''s explore these new features. You should experiment and with these features
    but also use them properly. You don''t want every website to turn into a crazy
    animated nightmare!


    > NOTE: The appearance of animations/transitions inside CSS has led a number of
    developers to complain about CSS-based animations breaking the "separation of
    structure, presentation, and behavior layers" best practice. They are technically
    right. However, you can spout all the religious arguments you want about animation
    belonging in the behavior layer rather than the presentation layer, but animation
    definitely falls in the realm of design.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_158_0.png)'
  merge: -1
  pgno: 158
- img_proc: true
  md: "# TRANSFORMS\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_159_0.png)\n\nLet's\
    \ first walk through CSS Transforms. The idea with transforms is that you can\
    \ change the shape and size of the area an element takes up. As a simple contextual\
    \ example, I used a skew transform to rotate the angle of the top-level header\
    \ in the Monty Python example, as illustrated in Figure 5.1.\nThe full code block\
    \ I used to achieve this follows:\n\nFigure 5.1 a skewed header created using\
    \ a CSS Transform.\n\n```\nbody>header {\n  ..\n  transform: skew(4deg, 6deg);\n\
    }\n```\n\nAs you can see, transforms take the form of the transform property with\
    \ a value consisting of a transform function (in this case skew) and associated\
    \ values in parentheses (in this case 4deg, 6deg)."
  merge: -1
  pgno: 159
- img_proc: true
  md: 'The two specs define two- and three-dimensional transforms. I''ll cover the
    features they offer in two separate sections and will be brief, because transforms
    are a lot more interesting when combined with animations and other effects. Browser
    support for transforms is summarized in Table 5.1. I''ve not broken them into
    detailed references because generally this data works for all properties associated
    with the 2D and 3D varieties of transforms.


    # TABLE 5.1 Browser Support for Transforms


    | BROWSER | 2D TRANSFORMS | 3D TRANSFORMS |

    |---|---|--|

    | Opera | 10.6 with -o- | No |

    | Firefox | 3.5 with -moz- | 10 with -moz- |

    | Safari | 3.1 with -webkit- | 4 with -webkit- |

    | Chrome | 4 with -webkit- | 12 with -webkit- |

    | Internet Explorer | 9 with -ms- | 10 with -ms- |

    | iOS | 3.2 with -webkit- | 3.2 with -webkit- |

    | Android | 2.1 with -webkit- | 3 with -webkit- |

    | Mobile Chrome | Since beta with -webkit- | Since beta with -webkit- |

    | Opera Mobile | 11 with -o- | No |

    | Opera Mini | No | No |


    Note that in IE10 platform preview 6, support for non-prefixed transform properties
    has been added.'
