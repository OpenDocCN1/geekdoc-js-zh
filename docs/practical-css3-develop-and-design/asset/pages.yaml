  md: '# ADDING BLING TO A BANNER AD


    To round off the chapter, let''s build an ad example using some of the cool properties
    you learned earlier. You''ll make it look good, albeit different across older
    browsers, and make it with a minimum of images (and a video). Later in the book
    you''ll explore how to make the ad responsive and add some cool animated effects.


    The ad will be for a fictional metal band called Dead Hamster. The band is making
    a comeback, and its management wants to move forward with an online advertising
    campaign that will get the band noticed! And what better way to get people to
    notice that using thrills, spills, moving pictures, and exciting content? OK,
    so they have Bieber or Jedward, but they would only serve to draw the wrong kind
    of attention.


    To make a big splash, the ad will work on mobile devices, so the poster needs
    to work at different sizes and on different devices. And the band also has a huge
    needs to work across less-capable rocks!


    Let''s rock!


    > NOTE: I get the idea for creating a responsive advertising example from Mark
    B''s rather interesting "Responsive advertising" article at www.markboulton.co.uk/journal/comments/responsive-advertising.


    # BASIC SETUP


    The basic idea is to create a ad size: the Internet Advertising Bureau (IAB) has
    standardized sizes for web ads, as you will see at http://en.wikipedia.org/wiki/Web_banner.
    Let''s start off this by creating 730 x 300 pixel "pop-under.ad."


    But let''s take it further and make an eye-catching ad to show that many of the
    tasks you used to do with Flash are now possible using only CSS3. In this chapter
    you''ll just build up the basic ad. (Animation will come in Chapter 5, and responsiveness
    in Chapter 8.) You''ll also learn how to provide a reasonable alternative in older
    browsers and what improvements you can and should make if you were to do something
    similar in a production environment.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_150_0.png)'
  merge: -1
  pgno: 150
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_151_0.png)


    The background of the entire advertisement is a short looping video clip that
    shows off the energy of the band. Over the top of this the most important information
    is displayed, and on hover/focus another pane of information is shown containing
    more info. The final product as it stands at this point is shown in Figure 4.42.

    The basic markup structure is as follows:


    ```

    <section id="ad">

    <video></video>

    <div id="video-frame"></div>

    <div id="frame1"></div>

    <div id="frame2"></div>

    </section>

    ```


    One section contains the entire ad and includes a <video> element to render the
    rocking Dead Hamster footage, a <div> to apply an effect over the top of the video
    (on this shortly), and then a couple <div>s to contain the two panes of information.


    > NOTE: JavaScript has been used to mute video: I fire the JavaScript on onloadmetadata
    event to make sure mute is fired before the content starts playing; otherwise,
    a clip of sound might be heard before the mute kicks in.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Most of the content is absolutely positioned so the layers stack on top of
    one another, and most of the containers are set to 720 x 300 px, the same dimensions
    as the outer container, to keep everything inside the ad working well. Most of
    the code should be pretty simple to understand for anyone with previous CSS experience,
    so I''ll just explain the CSS3 code. You can find my code in the poster folder
    in the code download.


    # ADDING THE CSS3 SPARKLE


    Let''s walk through the different layers of this example in turn so it''ll make
    more sense. You first have the video, and the video-frame div is positioned on
    top of it. This "superfluous" div is annoying to have to include, but it is necessary
    at the moment because currently border—image doesn''t work correctly across all
    browsers. Recall that in browsers except Chrome the middle slice is wrongly included,
    and you can''t get rid of it. If you could, you could add the ripped edges on
    border—image, but at present you can''t. So instead you''ll add the ripped edges
    on this div using multiple background images:


    ```

    #video-frame {

    width: 720px;

    height: 300px;

    background: url(left-edge.png) top left repeat-y,

    url(right-edge.png) top right repeat-y;

    }

    ```


    This is rather useful technique in many ways: Imagine you had lots of elements,
    as headers or articles, and you wanted them to have a background image at either
    end and have a flexible width and height. This code is all you''need.


    Next, you''ll set a uniform black text shadow on all text, apart from the flaming
    effect I''ve put on the word "hell": This is suitable for increasing the latent
    cheese factor to be appropriate for the average heavy metal band. This can be
    done like so—add this now to your text:'
  merge: -1
  pgno: 152
- img_proc: true
  md: "```\n#ad #hell {\nfont-size: 150%;\ntext-shadow: 0 0 4px white,\n  -5px 4px\
    \ #FFFF33,\n  2px -10px 6px #FF0D33,\n  2px -15px 11px #FF8800,\n  2px -25px 18px\
    \ #FF2200;\n}\n```\n\nAlso, you'll include a repeating radial gradient using various\
    \ transparent blacks\n a bit of background texture, plus a background color to\
    \ provide a faint blue tint:\n\n```\n#ad #frame1 {\nbackground-image: repeating-radial-gradient(top\
    \ left,\n  rgba(0,0,0,0) 9px,\n  rgba(0,0,0,0.05) 10px,\n  rgba(0,0,0,0.05) 15px,\n\
    \  rgba(0,0,0,0.1) 16px,\n  rgba(0,0,0,0.1) 20px);\nbackground-color: rgba(16,8,115,0.2);\n\
    }\n```\n\nAnd finally, you'll use cool, very metal web fonts! These all result\
    \ in a great set\nof components that blend well into one another.\n\n# SUPPORTING\
    \ OLDER BROWSERS\n\nTo support older browsers, instead of clever Polyfilling of\
    \ content, you'll\ninclude a simple image fallback for <video> supporting browsers:\n\
    \n```\n<img src=\"poster.jpg\" alt=\"\">\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: 'You''ll do this because Flash content tends to dominate the area of the page
    it is put on, so rollovers on top of the video content won''t work on a Flash
    fallback.


    In the end, let''s opt for the coward''s option of not displaying the hover effect
    in the second frame because IE6, 7, and 8 prove troublesome when you are trying
    to get hover effects to work on positioned content. You''ll use text-indent to
    push the text far off the screen, so it will still be available to screen readers.


    In addition, you''ll include some quick box model and positioning fixes for IE6
    and 7. The box shadows, text shadows, gradients, and RGBA colors all degrade well.


    # ADDING IMPROVEMENTS


    I think you''ve created a fairly effective ad in this example. The ad is all contained
    within a single container, so it is fairly easy to transplant the area whichever
    you want in, and then position it where you want it.


    But why not create the ad in Flash? It would be simpler to deal with, but the
    point is that you are trying to create components with open standards, which includes
    all the advantages they bring to the project, plus the text would not be accessible
    if you put it in a Flash video. The advantages open standards have Flash in this
    context will be even more obvious when you start to add animated effects in Chapter
    5.


    Of course, before you really use this ad, you might want to make a few improvements:


    +   - Optimize video files. The video files as they stand are a fairly heavy addition
    to a page, so you should optimize them.


    +   - Pare down fonts. The fonts are also quite heavy. In a production environment,
    you could use Fontforge (as mentioned in Chapter 3) to reduce the size of the
    font files and just include the glyphs you need.


    +   - Add a link. You should also wrap the final version in a link (HTML5 allows
    block-level linking) to click through to wherever you want the ad to lead to.'
