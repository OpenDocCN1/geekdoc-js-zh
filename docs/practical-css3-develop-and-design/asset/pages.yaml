  md: "# <ARTICLE> AND <SECTION>\n\nNow let's look at HTML5's improved semantics.\
    \ First up, HTML5 provides two elements—<article> and <section>—for separating\
    \ your main content distinct pieces on your sites. They are often misunderstood,\
    \ so let's tread carefully. Let's consider a blog site, which has a main content\
    \ column containing blog-post summaries and a secondary content column containing\
    \ the author's latest Tweets (see blog-site.html in the chapter folder for the\
    \ full code).\n\nYou would traditionally mark this up using something like the\
    \ following:\n\n```\n<div id=\"main\">\n  <div class=\"post-summary\">\n    <!--\
    \ post summary --\n  </div>\n  <div class=\"post-summary\">\n    <!-- post summary\
    \ --\n  </div>\n  <!-- etc. --\n</div>\n  <div id=\"tweets\">\n    <div class=\"\
    tweet\"> ... </div>\n    <div class=\"tweet\"> ... </div>\n    <div class=\"tweet\"\
    > ... </div>\n</div>\n</div>\n```"
  merge: -1
  pgno: 59
- img_proc: true
  md: "This is all well good, but all these <div> are semantically anonymous; the\
    \ browser doesn't see them as a main content column, different Tweets, and so\
    \ on. It just sees them as \"divs inside divs.\" You could upgrade this to HTML5,\
    \ like so:\n\n```\n<section id=\"main\">\n  <article>\n    <!-- post summary -->\n\
    \  </article>\n  <article>\n    <!-- post summary -->\n  </article>\n  <!-- etc.\
    \ -->\n</section>\n<section id=\"tweets\">\n  <article> ... </article>\n  <article>\
    \ ... </article>\n  <article> ... </article>\n</section>\n```\n\nA supporting\
    \ browser immediately knows that this contains two distinct sections of content.\
    \ Both contain distinct articles, which could quite sensibly syndicated separately,\
    \ for example, in an RSS feed. This gives you a hint as to the difference between\
    \ <section> and <article>. Both elements are containing content,\n\n+   - <section>\
    \ is for containing conceptually different areas of content within the page—for\
    \ example, stories about animals versus photos or stories about animals versus\
    \ stories underwear.\n- <article> is for containing distinct pieces of content\
    \ within a page or a <section>, whether they are new items, videos, Tweets, or\
    \ whatever. Each group of <article>s will have similar, related functionality\
    \ or purpose but will be self-contained entities. If you could happily take a\
    \ piece of content"
  merge: -1
  pgno: 60
- img_proc: true
  md: 'and sensibly syndicate it as an <article> in an RSS feed, it is probably a
    good candidate for an <article>. You shouldn''t think of <article>s as being "news
    articles," because they can contain other items of besides; think of them as being
    like "articles of clothing on a clothing rail" and you''ll have a better idea.


    One thing to note is that it is perfectly reasonable to use multiple <section>s
    nested inside a single <article>. After all, you may have pages on your size which
