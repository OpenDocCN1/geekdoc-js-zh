  md: '# JAVASCRIPT LIBRARY ROUNDUP


    You''ve done a lot so far in the chapter in terms of building up a template you
    can use to write HTML5 and CSS3 with confidence, and going on a quick tour of
    the new HTML5 elements available to you. Let''s now return to further building
    your toolkit for the coming events that unfold as you journey through the book.
    In this section you''ll look at the different JavaScript libraries you''ll be
    using to build in support for various CSS3 features that lack support in older
    browsers, most notably IE versions. These libraries are often referred to as Polyfills.


    NOTE: I suggest you consult the websites of these different projects, download
    the libraries so they are ready for you to start experimenting with (many of them
    have online copies that can be linked, but it is also useful to have available
    for offline experimentation), and check out the available documentation. I won''t
    include all of these in my default template, because you won''t need all of these
    in each project.


    # CSS3-MEDIAQUERIES-JS


    css3-mediaqueries-js is a nifty little library written by Wouter van der Graaf,
    which transparently adds support for Media Queries to browsers that don''t have
    them natively. The transition is a bit clunky when you trigger a media query by
    resizing a browser window; but don''t worry, users are very unlikely to ever do
    this or in fact know what a browser is (or care). For information about css3-mediaqueries-js,
    check out these sets:


    +   - Home. http://code.google.com/p/css3-mediaqueries-js

    - Download. http://code.google.com/p/css3-mediaqueries-js/downloads/list


    Respond.js, written by Scott Jehl, is another library for adding in Media Query
    support to nonsupporting browsers. It specifically adds support for min-width
    and max-width Media Queries. Find out more about it at its Github page:https://github.com/scottjehl/Respond.


