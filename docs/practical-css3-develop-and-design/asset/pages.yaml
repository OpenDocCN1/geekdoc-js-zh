    # ALTERNATIVE BROWSING DEVICES


    # DEBUGGING ENVIRONMENTS


    # A DECENT TEXT EDITOR


    To test sites on different screen sizes, resolutions, and control mechanisms,
    have at least one or two alternative browsing devices. Mobile phones and tablets
    are well-enabled TV would also be fun!


    When it comes to debugging environments, you have so many choices! Dragonfly on
    Opera, Firebug on Firefox, every tends to come with a respect-able environment.
    Be sure to become familiar with as many as possible so you''ll have the best chance
    at tracking down irksome bugs.


    A good text editor is all you need to write CSS and HTML. Coda on the Mac is awesome
    (http://panic.com/coda) but it is not free. Good alternatives are Notepad++ for
    Windows, Text Wrangler for Mac, and Bluefish for Linux. WYSIWY environments are
    not recommended, especially for learning. I''m a big fan of Jared Spool''s quip
    about them being more like "WYSI... WTF!'
