  md: "# MEDIA QUERIES\n\nThe Media Blitz example is looking good now, but it is still\
    \ not great. When you resize the screen less than 1024px in width, the <h1> wraps\
    \ onto two lines, and the media elements start to look tiny and insignificant.\
    \ This is unacceptable given that they are supposed to be the main content of\
    \ the site!\n\nWouldn't be great if you had a mechanism to dynamically alter the\
    \ layout of your site based on features such as width and height?\n\nWell, here's\
    \ the good news: The Media Queries spec (www.w3.org/TR/css3-mediaqueries) allows\
    \ you to do just that! In a nutshell, it extends the functionality of CSS3 media\
    \ types, which allow you to apply styles to markup based on whether it is onscreen,\
    \ being printed, and so on:\n\n```\n@media print {\n  /* print styles here */\n\
    }\n<link rel=\"stylesheet\" media=\"print\" href=\"print.css\">\n```\n\nMedia\
    \ queries go even further, allowing you to apply styles based on media types plus\
    \ the result of tests on the condition of media features, such as browser viewport\
    \ width, screen orientation, resolution, and more. Here is a simple example:\n\
    \n```\n@media screen (max-width: 800px) {\n  /* put your styles here */\n}\n```\n\
    \nThis code block specifies the following: For the screen media type only, if\
    \ the width of the browser window is 800 pixels or less, apply the styles within\
    \ the block. If these conditions aren't true, completely ignore the rules within\
    \ the block. You immediately see how powerful this feature is. It means you can\
    \ start applying different styles to your site depending on features like screen\
    \ width, so you can provide one layout for a wide viewport, for a narrow viewport,\
    \ and as many as you like!"
  merge: -1
  pgno: 305
- img_proc: true
  md: "If you want to apply your custom styles to any media type, you can use the\
    \ keyword all, or just omit the media type. The following are equivalent:\n\n\
    ```\n@media all and (max-width: 800px)\n@media (max-width: 800px)\n```\n\nYou\
    \ can use the not keyword to indicate that you want to apply your styles in any\
    \ case other than the one evaluated as true by the media query. For example:\n\
    \n```\n@media not screen and (max-width: 800px) {\n  /* put your styles here */\n\
    }\n```\n\nYou can chain further conditions onto the ends of your media queries\
    \ to enforce stricter conditions, for example:\n\n```\n@media screen and (max-width:\
    \ 800px) and (orientation: landscape) {\n  /* put your styles here */\n}\n```\n\
    \nIf you want to apply the same set of conditional styles when multiple conditions\
    \ are true, you can put the different sets of conditions on the same line, by\
    \ commas, like so:\n\n```\n@media screen and (max-width: 800px), print and (max-width:\
    \ 29.7cm) {\n  /* put your styles here */\n}\n```\n\nThe most common media features\
    \ you want to test are as follows:\n\n+   - min/max-width and min/max-height.\
    \ Apply styles depending on the width or height of your browser's viewport: the\
    \ part of the window that the web page is displayed in.\n- min/max-device-width\
    \ and min/max-device-height. Apply styles depending on the physical width or height\
    \ of the device rather than the viewport. The importance of this distinction will\
    \ become apparent later in the chapter."
  merge: -1
  pgno: 306
- img_proc: true
  md: "+   aspect-ratio/device-aspect-ratio. Apply styles based on aspect ratio or\
    \ device aspect ratio. The former is defined as the ratio of width over height,\
    \ and the latter is defined as the ratio of device-width over device-height.\n\
    \n+   orientation. Apply styles based on whether the target device is in portrait\
    \ or landscape mode. This feature is useful for targeting different layouts on\
    \ devices like iPads, Android phones, and other tablets and smartphones that change\
    \ between portrait and landscape when you change the you hold them.\n\n+   min/max-resolution.\
    \ Apply styles based on minimum and maximum device resolutions. This is useful\
    \ if you want to, for example, serve larger icons and increase text size on devices\
    \ with high resolutions, like iPhones with retina displays.\n\n+   min/max-device-pixel-ratio.\
    \ A proprietary Apple media feature that is similar to min- and max-resolution\
    \ but seems better supported currently.\n\nYou can find a list of media features\
    \ at www.w3.org/TR/css3-mediaqueries/#media.\n\n# APPLYING SOME MEDIA QUERIES\
    \ TO THE EXAMPLE\n\nLet's return to the Media Blitz example and improve it at\
    \ different screens using media queries. You can see the final result of these\
    \ additions in media-blitz-3-with-media-queries.html and media-blitz3.css. At\
    \ the bottom of this new CSS file, you'll find a series of @media blocks that\
    \ kick in when the screen decreases below certain thresholds. I won't cover every\
    \ ruleset in excruciating detail, because each is pretty obvious, but let's look\
    \ at the one of the first to help you get the idea:\n\n```\n@media all (max-width:\
    \ 1024px) {\nnav {\n  float: none;\n  width: 100%;\n  margin-left: 0;\n}\n```"
  merge: -1
  pgno: 307
