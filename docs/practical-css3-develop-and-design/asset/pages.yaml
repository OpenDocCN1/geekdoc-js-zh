  md: "# ALIGNING FLEXBOX CHILDREN\n\nFlexbox also rocks big time when you want to\
    \ align your flexbox children at the start, middle, or end of a column of content,\
    \ for example. You can use the justify-content property to align your children\
    \ along the main axis in whichever direction you've set to be. The possible values\
    \ are flex-start, flex-end, center, space-between, and space-around.\n\nI used\
    \ this to lay out the <header> content of my example. I wanted the content all\
    \ centered, horizontally and vertically. This kind of layout is usually quite\
    \ difficult to do, (because you can't rely on the old margin: auto trick for centering),\
    \ and you usually end up messing around with positioning and inaccurate measurements.\n\
    \nTo start with, you should set your <header> to be laid out like a flexbox in\
    \ a vertical column:\n\n```\nheader {\n  display: flex;\n  flex-flow: column;\n\
    }\n```\n\nBy default this will lay out your elements in a column aligned to the\
    \ left horizontally and sort of near the top vertically. Let's first align them\
    \ in a better position vertically:\n\n```\nheader {\n  display: flexbox;\n  flex-flow:\
    \ column;\n  justify-content: center;\n}\n```"
  merge: -1
  pgno: 269
- img_proc: true
  md: "![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_270_0.png)\n\n**FIGURE 7.11** Flexbox\
    \ makes centering and equally spacing elements inside their container very easy.\n\
    \nFlexbox also makes another property available—align-items, which aligns the\
    \ children along the cross axis, whichever direction that is at the time. You\
    \ can use this to center the child elements horizontally, like so:\n\n```\nheader\
    \ {\n  display: flex;\n  justify-content: center;\n  flex-pack: justify;\n  align-items:\
    \ center;\n}\n```\n\n**Figure 7.11** shows the result of this addition.\n\n> NOTES:\
    \ Possible values for align-items are flex-start, flex-end, baseline, and stretch.\n\
    \n> There is also a property, align-self, which takes the values as align-items.\
    \ align-self, when applied to individual children of a flexbox, can be used to\
    \ override behavior on all children by align-items."
  merge: -1
