    \ 1rem;\n}\n```\n\n> TIP: IE6 and IE7 don't resize text in pixels, so for accessibility's\
    \ sake, if you are planning on using rems for text sizing, you might want to consider\
    \ bumping up the text size just for these browsers using an IE conditional stylesheet\
    \ (see Chapter 2.2).\n\n# CSS3 SELECTORS\n\nCSS3 features an entire toolbox of\
    \ new selectors that allow you to select specific elements for styling while nullifying\
