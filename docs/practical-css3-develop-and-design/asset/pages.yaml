- img_proc: true
  md: 'HSL makes sense in a lot of ways; for example, you could select complementary
    shades of red to go with the preceding red color, just by varying the lightness,
    like this:


    ```

    hsl(0, 100%, 30%)

    ```


    ```

    hsl(0, 100%, 50%)

    ```


    ```

    hsl(0, 100%, 60%)

    ```


    HSLA works in the same way as RGBA. You just add the alpha channel value to the
    existing color like this: hsla(0, 100%, 50%, 0.5), which results in full red but
    is 50 percent transparent.


    # OPACITY


    A separate opacity property is available in CSS3. You can add it to any element
    to set a level of transparency for that entire element and everything within it,
    including all children elements. As you''d expect, it takes a value of o-1:


    ```

    opacity: 0;

    ```


    This property makes elements completely vanish!

    The is still available in the DOM, just invisible to sighted viewers (in contrast
    to other methods of hiding content, such as display: none; which renders the content
    inaccessible to screen-readers). I mainly find this useful for hiding certain
    content and then making it appear again when you mouse over/focus on a certain
    area of the document, as in pop-up information boxes and suchlike.


    > NOTE: Because old versions of IE do not support transparency

    CSS colors or opacity, you''ll need to make provisions for this by adding in support
    or alternatives. You''ll learn various ways of doing this throughout the book.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_26_0.png)'
