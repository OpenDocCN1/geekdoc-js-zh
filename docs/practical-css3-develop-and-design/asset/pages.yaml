  md: "```\nmedia.play();\n} else {\n  media.setAttribute(\"class\",\"paused\");\n\
    \  play.setAttribute(\"data-icon\",\"p\");\n  media.pause();\n}\n```\n\nI have\
    \ used a simple if ... else statement to specify that if the class on the media\
    \ element is blank or paused, it is paused or stopped; otherwise, it is playing.\
    \ If it is paused or stopped, you change the class on the media element to playing,\
    \ change the data-icon attribute value to \"u\" (a pause icon), and play the video\
    \ using the play() method of the media API. If you are playing, you change the\
    \ media's class attribute value back to paused, change the data-icon attribute\
    \ value on the Play button to \"P\" (a play icon), and pause the video using the\
    \ media API's pause() method.\n\nNext, you add the stopMedia() function, which\
    \ controls what happens the Stop button is pressed:\n\n```\nfunction stopMedia()\
    \ {\n  media.pause();\n  media.currentTime = 0;\n  media.setAttribute(\"class\"\
    ,\"\");\n  play.setAttribute(\"data-icon\",\"p\");\n}\n```\n\nThis is much simpler,\
    \ because it has only one state rather than two states that are toggled between.\
    \ There is no stop() method in the media API, instead you use the pause() method\
    \ to pause the media and put it back to the start using currentTime = 0. You also\
    \ make sure that the Play/Pause button is reset by putting those class and data-icon\
    \ attributes you were playing with earlier back to their default states."
