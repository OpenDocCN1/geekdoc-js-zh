  md: 'If you want to buy fonts outright and host them yourself, there are a number
    of different shops to visit, but the ones I''d recommend are:


    +   - Myfonts.com


    +   - Fontspring.com


    +   - Fontshop.com


    The three best options for commercial-hosted font services at the time of this
    writing are


    +   - Typekit (https://typekit.com). Started off as an independent company by
    some very clever folks in the United States and recently acquired by Adobe.


    +   - Fontdeck (http://fontdeck.com). Created by designers in the UK.


    +   - WebType (www.webtype.com). Another quality font service set up in collaboration
    between a number of experts.


    All the hosted font services work in the same way: You sign up for the service,
    specify domain(s) you want the fonts used on, paste some custom JavaScript and/or
    CSS into the <head> of the pages you want the fonts used on, and choose the fonts
    you use on the web interface of the service.


    You''ll then be given all the CSS you need; they are very easy to use. Another
    useful feature of all three is that you can test them to a certain degree. Fontdeck
    gives you full access to all font services free of charge, but only the first
    20 IP addresses that access your site will be your fonts. Typekit allows you to
    use a limited set of its fonts on one website with limited page views. WebType
    gives you a 30-day free trial with each font.


    When you start using these services, the benefits become very clear: You have
    access to high-quality fonts with full glyph sets and multiple weights and variants.
    For example, you can make proper use of the following and more:


    font-weight: 200;


    font-weight: 300;


    font-weight: light;


    font-weight: black;'
