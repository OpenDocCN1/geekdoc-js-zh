  md: '# ONLINE RESOURCES


    Throughout this book I use several third-party, online resources that include
    scripts and stylesheets, and I present and reference many examples that I wrote
    to illustrate the concepts in this book. The third-party resources are referenced
    where appropriate, so you''ll be able to find them when needed. To find my examples
    is even easier: You can download them all http://peachpit.com/practicalcss3.


    But that''s not all! Also available at http://peachpit.com/practicalcss3 are the
    following:


    +   * A bonus chapter. In Chapter 9, "Styling HTML5 Media and Forms," I discuss
    building custom-styled controls for your HTML5 <video> and <audio> elements, and
    styling form elements using the form-related pseudo-classes in CSS3.


    +   * A cheat sheet. This reference document details the syntax of all the new
    CSS3 features I use in this book and how they are supported in browsers. Print
    it out and hang it on your wall as an at-a-glance guide! I''ll update this reference
    as the data changes.


    Both are courtesy of your very generous author.'
  merge: -1
