  md: "Next, you add the setTime() function, which updates the time counter:\n\n```\n\
    function setTime() {\n  var minutes = Math.floor(media.currentTime / 60);\n  var\
    \ seconds = Math.floor(media.currentTime - minutes * 60);\n  var minuteValue;\n\
    \  var secondValue;\n  if (minutes<10) {\n    minuteValue = \"0\" + minutes;\n\
    \  } else {\n    minuteValue = minutes;\n  }\n  if (seconds<10) {\n    secondValue\
    \ = \"0\" + seconds;\n  } else {\n    secondValue = seconds;\n  }\n  var mediaTime\
    \ = minuteValue + \":\" + secondValue;\n  timer.innerHTML = mediaTime;\n}\n```\n\
    \nThis code is not as bad as it looks. The first part uses a bit of math to work\
    \ out what the minute and second values are from the raw seconds returned by the\
    \ currentTime method of the API. The second part checks whether the minute and\
    \ second values are less than 10 or not. If so, a o is appended to the value,\
    \ example, 09. If not, the o is not appended, the values will appear as, for example,\
    \ 10, not O10."
