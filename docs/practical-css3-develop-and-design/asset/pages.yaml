  md: "![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_214_0.png)\n\n# PROVIDING ALTERNATIVE\
    \ STYLES\n\nBy default, the card flip example relies on a 3D transform for sighted\
    \ viewers to be able to see both sides of the card. But this is no good for browsers\
    \ that don't support 3D transforms, like Opera (at the time of this writing).\
    \ Nonsupporting browsers will get a class of no-csstrforms appended to their <head>\
    \ classes, so you can provide alternative styling like so:\n\n```\n.no-csstrforms3d\
    \ #wrapper:hover #front, .no-csstrforms\n#wrapper:focus {\n  transform: rotate(-30deg)\
    \ translate(-50%,-100%);\n  transition: 0.8s ease-in;\n}\n```\n\nThe descendant\
    \ selector applies a 2D transform to the front face of the card only when it is\
    \ a descendant of .no-csstrforms3d. 3D rotation supporting browsers will ignore\
    \ this styling. In Opera this styling gives you access to the back of the card,\
    \ as shown in Figure 5.24."
  merge: -1
  pgno: 214
- img_proc: true
  md: "But what about browsers that don't support 2D transforms? Older browsers like\
    \ IE8 or Camino won't support rem units, gradients, transforms, or text shadow,\
    \ so what about them?\n\nModernizr won't help with rem units. The best way to\
    \ deal with them is to provide a pixel-size fallback next to the rem unit version\
    \ of your property, as discussed in Chapter 1:\n\nmargin-top: 5px;\nmargin-top:\
    \ 0.5rem;\n\nOlder browsers will just read the first one, whereas newer browsers\
    \ that support rem units will read both, but the latter will override the former\
    \ one.\n\nFor other CSS features, you'll need to include at least the following\
    \ CSS:\n\n```\n.no-csstrans #wrapper:hover #front,.no-csstrans\n  #wrapper:focus\
    \ #front {\n    margin-left: -350px;\n  }\n\n.no-cssgradients #front, .no-cssgradients\
    \ #back\n  background: #FF3500;\n}\n\n.no-cssgradients # p, .no-cssgradients back\
    \ p {\n  /* ideally should be .no-textshadow, but modernizr doesn't seem\n  to\
    \ provide this */\n  color: #000000;\n}\n```"
  merge: -1
