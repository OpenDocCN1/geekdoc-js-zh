- img_proc: true
  md: 'FIGURE 4.32 A rather interesting pattern created with multiple gradients and
    background-size


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_142_0.png)


    Another interesting effect to explore is combining a gradient effect with background-size
    to force it to repeat as a single, small, square unit (rather than along the gradient,
    as is the case with normal repeating gradients). You''ll see this in action later
    on in the book, too. Consider this example:


    background-size: radial-gradient(transparent 10px, #A60000 11px,

    > #A60000 12px),


    repeating-linear-gradient(transparent, transparent 20px,

    > rgba(255,0,0,1) 21px, rgba(255,0,0,1) 21px) 0 -10px,


    repeating-linear-gradient(left, transparent, rgba(255,0,0,1) 19px,

    > transparent 21px) 21px 0;


    background-size: 21px 21px, 100%;


    The effect is shown in Figure 4.32. This example is in the file gradient-background-size.html.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The radial gradient creates a simple, small, transparent circle with red on
    the outside. The background-size property was used to force this circle into a
    22-pixel square, which then repeats. A couple of simple line patterns are placed
    over the top and so they perfectly bisect the circle, horizontally and vertically.
    This is a rather complex bit of code for a simple repeating pattern, but it does
    show what is possible. You can find more aesthetically pleasing examples at Lea
    Verou''s fantastic CSS3 patterns gallery ahttp://lea.verou.me/css3patterns.


    # MULTIPLE BACKGROUNDS IN IE?


    Unfortunately, CSS3PIE''s supremacy collapses when you consider multiple background-support
    in past versions of IE. There isn''t a decent way to add support for multiple
    backgrounds to older IE versions without resorting to those nasty old nested <div>s.
    And you don''t want to go down that road!


    So, the only way around this limitation is to provide alternative styling, either
    via a conditional comment or via Modernizr, which you''ll explore in Chapter 5.


    > TIP: Providing multiple background image fallbacks is difficult if you need
    the flexibility the multiple backgrounds provide in a liquid layout, as in the
    Monty Python example. To make IE fallback styling easier to work out, it''s best
    to make the layout fixed in IE by serving a style in your IE-targeted CSS, such
    as: body { width: 1024px; }


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_143_0.png)'
  merge: -1
