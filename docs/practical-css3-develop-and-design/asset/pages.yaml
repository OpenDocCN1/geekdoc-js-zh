    \  box-shadow: inset 2px 2px 3px rgba(0,0,0,0.7);\n  background: linear-gradient(top,#fff,#ccc);\n\
    }\n```\n\n```\nlabel[id=\"required\"]:before {\n  content: \"*\";\n}\n```\n\n\
    ```\n#name:optional {\n  border: 1px grey dashed;\n  box-shadow: inset 2px 2px\
    \ 3px rgba(0,0,0,0.4);\n  opacity: 0.9;\n}\n```\n\nHere I've made the optional\
    \ input look a bit fain and less important than the required one, and also used\
