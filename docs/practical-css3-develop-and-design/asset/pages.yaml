  md: '# BORDER-RADIUS: GOD BLESS THOSE ROUNDED CORNERS


    **FIGURE 4.1** A simple container with equally rounded corners.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_118_0.png)


    Rounded corners are vital for street cred, critical for keeping with the Web 2.0
    cool school, and essential if you want to impress your significant other.


    These elements are such a commonly requested design feature that the spec writers
    added the border-radius property to the Borders and Backgrounds module (www.w3.org/TR/css3-background).
    The syntax is very simple to use (see border-radius-examples.html in the code
    download for many examples). You can specify a single value for the radius size
    of all the rounded corners. For example:


    ```

    border-radius: 10px;

    ```


    You can use pixels or any other CSS unit that makes sense. The preceding line
    of code results in corners like those in **Figure 4.1.**'
  merge: -1
  pgno: 118
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_119_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_119_1.png)


    As you''d logically expect, you can also specify two, three, or four values. For
    example:


    +   - border-radius: 0px 0px 20px 20px; These relate to top-left, top-right, bottom-right,
    and bottom-left values, respectively.

    - border-radius: 0px 10px 20px; These relate to the top-left value, top-right
    and bottom-left, and bottom-right values, respectively.

    - border-radius: 10px 20px; These relate to the top-left and bottom-right, and
    top-right and bottom-left values, respectively.

    - A couple of examples are shown in Figure 4.2.


    Using border-radius, you can also specify two sets of values separated by a forward
    slash to indicate horizontal and vertical corner radii. For example, the following
    line sets every horizontal radius to 10px and every vertical radius to 20px (Figure
    4.3):


    border-radius: 10px/20px;'
  merge: -1
