  md: "# MOBILE FIRST\n\nLet's turn now the media query example on its head by looking\
    \ at the Mobile First technique invented by Luke Wroblewski. This technique reverses\
    \ what you did in the preceding section. You create the mobile layout first as\
    \ the default layout, and then apply wider layouts as the browser width increases.\n\
    \nThe Media Blitz example is recreated using Mobile First in the file media-blitz-4-mobile-first.html.\
    \ I won't show all of the code here, but be sure to dig through the file so you\
    \ can appreciate the difference between media-blitz-3 and media-blitz. The former\
    \ starts with the wide-screen layout and layers suitable for narrower screens.\
    \ The latter starts with the narrow-screen layout and layers suitable for wider\
    \ screens. As a brief example, the <h1> is initially set to its smallest size.\n\
    \n```\nh1 {\n  font-family: 'Monoton', cursive;\n}\n```\n\nand then is increased\
    \ in size by subsequent media queries:\n\n```\n@media all and (min-width: 350px)\
    \ {\n  h1 {\n    font-size: 6rem;\n  }\n```\n\nThis reverse method has many advantages:\
    \ One of which is that it is easier to start by designing a simple, narrow (mobile)\
    \ layout and then add on complexity to work up to a richer wider-screen (desktop)\
    \ layout than it is to design a complex, all-singing wide-screen layout and then\
    \ try to factor down to an effective (uncluttered) narrow layout."
  merge: -1
  pgno: 314
- img_proc: true
  md: '# MEDIA QUERY POLYFILLS


    One problem with Mobile First is browsers that don''t support media queries will
    get a mobile layout rather than a desktop layout. To fix this, you could include
    a JavaScript polyfill in your page. The two worth checking out are css3-mediaqueries.js
    (http://code.google.com/p/css3-mediaqueries-js) and respond.js (https://github.com/scottjehl/respond).
    Both work in the same sort of way. You just include the JavaScript in your page
    after the CSS declarations. All my responsive examples from number 4 (media-blitz-4-mobile-first.html)
    on include the following:


    ```

    <script src="respond.min.js"></script>

    ```


    In terms of which one to use, css3-mediaqueries.js is larger in size but robust,
    whereas respond.js works only on width/height media queries.


    # FLASH: RESPONSIVE SHORTINGS


    Although the media query polyfills work well, one glaring problem is that the
    video fallback that comes into play when the Media Blitz example is loaded in
    IE6–8 is, well, Flash. When Flash is loaded into a browser, the browser allocates
    space for it and then handles control of that space over the Flash Player; the
    resulting content doesn''t play nicely with web standards.


    The Flash movie therefore can''t be reduced in size or otherwise manipulated using
    CSS (width, max-width, etc.), so the Flash video will stay the same size regardless
    of how the size of the rest of the page around it changes. In a responsive design,
    when the screen width gets too narrow, the layout will start to look look horrible
    as the Flash movie stomps all over it.


    Therefore, I''ve set my Flash Player fallback to a bit smaller than the HTML5
    <video> element inside one of my IE conditional comments so that the design is
    now fixed, eliminating the problem. It''s not perfect, but think of this way:
    Users of IE won''t be using a narrow-screen device anyway, and at least they get
    a layout they can use.


    MEDIA QUERY POLYFILLS 307'
  merge: -1
  pgno: 315
- img_proc: true
  md: "# SERVING IMAGES RESPONSIVELY\n\nAnother advantage of Mobile First is that\
    \ you can easily serve smaller background images to smaller devices, and then\
    \ swap them out for bigger images using rules in wider media queries. For example,\
    \ in simple-responsive-header-image.html, a background image spans the whole <header>,\
    \ which runs across 100 percent of the screen width. I've included it like this:\n\
    \n```\nheader {\n  ...\n  background: url(images/sunset.jpg) center;\n}\n```\n\
    \nSetting it to display in the center ensures the nice sun in the center of the\
    \ image will always display in the center of the header. But there's more you\
    \ can do here.\nTake a look at simple-responsive-header-image2.html. The original\
    \ 1024px wide image is 41 KB, which doesn't make much difference to a user with\
    \ a fast connection but could slow down response time somewhat for a mobile user\
    \ on a slow mobile network. To mitigate this, I've included a 480px version in\
    \ the default CSS:\n\n```\nheader {\n  ...\n  background: url(images/sunset-480.jpg)\
    \ center;\n}\n```"
  merge: -1
  pgno: 316
- img_proc: true
  md: "Therefore, narrow-screen browsers get a much smaller image. The full-size image\
    \ is then served up in a media query like so:\n\n```\n@media all and (min-width:\
    \ 481px) {\n  header {\n    background: url(images/sunset.jpg) center;\n  }\n\
    }\n```\n\nDevices that have a browser window width of 480px or less will only\
    \ load the small image, and devices with a browser window width of over 480px\
    \ will load the larger image.\n\nOf course, the preceding technique doesn't work\
    \ for images put on the page using `<img>`. This is a much harder problem to solve.\
    \ Fortunately, intelligent people have been thinking about this problem for years.\
    \ For a robust solution that relies on some server-side magic, check out Matt\
    \ Wilcox's excellent Adaptive Images technique. All you'll need is at http://24ways.org/2011/adaptive-images-for-responsive-designs."
  merge: -1
  pgno: 317
- img_proc: true
  md: "# RESPONSIVE VIDEO\n\nFor video, the solution to making it responsive is a\
    \ bit different. HTML5 <video> has a rather nifty responsive mechanism included—a\
    \ media attribute on the <source> element in which you can insert a media query\
    \ test. If the test is passed, the video source is the one loaded into the <video>\
    \ element, unless of another <source> element later in the source order overrides\
    \ it.\n\nIn media-blitz-5-responsive-video.html, you can see this in this action:\n\
    \n```\n<video controls>\n  <source src=\"videos/320/crystal320.mp4\" type=\"video/mp4\"\
    \n       media=\"all\" and (max-width: 480px)\">\n  <source src=\"videos/320/crystal320.webm\"\
    \ type=\"video/webm\"\n       media=\"all\" and (max-width: 480px)\">\n  <source\
    \ src=\"videos/720/crystal720.mp4\" type=\"video/mp4\"\n       media=\"all\" and\
    \ (min-width: 481px)>\n  <source src=\"videos/720/crystal720.webm\" type=\"video/webm\"\
    \n       media=\"all\" and (min-width: 481px)>\n\n  Your browser does not support\
    \ the video tag.\n\n</video>\n```\n\nWhen the screen width is 480px or less, the\
    \ 320 video is loaded; when the screen width is more than 480px, the 720 video\
    \ is loaded.\n\n> NOTE: I cheated slightly in media-blitz2.css. I set the <video>\
    \ element to width: 100%, max-width: 100%, so that the video will always span\
    \ the full width of the screen, even when the 320 video is displayed across the\
    \ full-screen at 321–480px. This is not a great idea, especially when the width\
    \ gets much bigger, because the video will start to look very grainy. You need\
    \ to be especially mindful of this on very high-resolution devices like the iPhone\
    \ 4."
  merge: -1
