  md: '# WELCOME TO CSS3


    CSS3 provides you with exciting new tools for your web development toolbox, allowing
    you to accomplish many styling tasks in a much easier, more flexible, and less
    hackish manner than you''ve been used to when working with CSS2. The following
    chapters will introduce you to the most useful, new CSS3 features and show you
    how to use them in real


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_8_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_8_1.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_8_2.png)


    # HTML AND CSS BASIC KNOWLEDGE


    # THE LATEST, GREATEST BROWSERS


    # OLDER, LESS-CAPABLE BROWSERS


    This book assumes you are well versed in basic HTML(4) and CSS(2) features and
    techniques. But just in case you need to look up any of the basics, keep some
    reference material to hand. A wealth of excellent tutorials is available on the
    W3C Web Community Wiki at www.w3.org/community/webed/wiki/Main_Page.


    Be sure to install the latest versions of desktop Opera, Firefox, Chrome, Safari,
    and Internet Explorer (IE). Ideally, you should have a testing environment available
    for all modern browsers; have as many as hand you can.


    Have older, less-capable browsers available for testing fallbacks, polyfills,
    and graceful degradation. Run older versions of IE on multiple virtual machines
    (Virtualbox is an acceptable, free option at www.virtualbox.org). Camino is a
    good option for a test Mac-based browser that doesn’t support most of the new
    CSS3/HTML5 features.'
  merge: -1
  pgno: 8
