    # SELECTIVIZR


    Written by Keith Clark, and mentioned in the previous chapter, Selectivizr is
    a small utility that sits on top of an existing JavaScript library, such as jQuery
    or MooTools, and adds support for CSS3 selectors/pseudo-classes to nonsupporting
    versions of IE (6–8). The Home/Download page is at http://selectivizr.com.'
