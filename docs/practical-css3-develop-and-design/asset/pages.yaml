- img_proc: true
  md: '# FIGURE 5.11 A visualization of how perspective works in CSS Transforms.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_175_0.png)


    As you can see, a small pixel value produces a very large perspective—this equates
    to your point of view being closer to the element—which possibly looks a bit over
    the top and unrealistic. A value of 800 pixels is very visible but a bit more
    realistic, and a value of 2000 pixels is much more subtle.


    So does perspective work?

    The perspective value defines how far away the viewpoint of the element is from
    the closest side of the element. OK, that might not make much sense, so I''ll
    use a diagram and provide more explanation. Imagine the element you are applying
    the transform to is being viewed by a big eyeball, like your own Eye of Sauron
    without the bad-ass attitude. Imagine that a giant eyeball sits on top of the
    element. The apex of the cone is right above the middle of the element, and the
    base of the cone sits on the flat plane of the element (Figure 5.11).'
  merge: -1
  pgno: 175
- img_proc: true
  md: "With no perspective applied, the Eye of Sauron will be right at the apex of\
    \ the cone looking directly toward the element, which will therefore be seen straight\
    \ on totally flat. If you apply perspective values, the Eye of Sauron still looks\
    \ directly at the element, but its position is shifted down the side of the cone.\
    \ The perspective value is the distance the Eye of Sauron is from that edge; therefore,\
    \ smaller values produce more dramatic distortions in the viewing of the element,\
    \ whereas bigger values produce more subtle effects.\n\nYou can use pretty much\
    \ any units that make sense for defining the amount of perspective, although pixels\
    \ provide the most exact control and are probably the best to use. If you don't\
    \ include any units, the units default to pixels.\n\nTIP: You need to put the\
    \ perspective transform before other transforms you want it applied. If you rotateX(10deg)\
    \ perspective(800px), for example, the perspective will have no effect.\n\nNow\
    \ let's turn to the perspective property: Look at the perspective-html file. In\
    \ this example I've added an extra wrapper <div> around the three <article> elements\
    \ identified with an ID of perspective-wrap and applied perspective to the whole\
    \ lot using the following:\n\n```\nperspective-wrap {\n  perspective: 800;\n}\n\
    \n#x, #y, #z {\n  transform: rotateX(30deg);\n}\n```\n\nLooking at the example\
    \ you'll see that the rotation transforms are applied to the <article> elements,\
    \ but the perspective is applied to all the children of the <div>, as if they\
    \ are all in the 3D space, even though all the child elements have the same amount\
    \ of rotation applied, they appear differently (Figure 5.12).\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_176_0.png)"
