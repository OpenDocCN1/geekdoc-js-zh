- img_proc: true
  md: 'You can use gt and gte (“greater than” and “greater than or equal to”) in the
    same way, but you will be much less likely to use these. Most likely, you’ll use
    IE conditional comments to:


    +   - Serve scripting only to specific IE versions, either to provide alternative
    mechanisms that will work in IE or to build support for HTML and CSS features
    that don’t have native support.


    +   - Serve CSS to fix IE-specific CSS bugs that threaten to make your lovingly
    crafted layout crumble. The most obvious fixes that spring to mind are serving
    older IE different width and height values to compensate from the broken box model
    and giving various layout features has to make those features behave properly
    in IE.


    +   - Display abusive messages to users of older IE versions while bullying them
    into upgrading their browser.


    Bruce Lawson has written a great article that expands this topic called “Supporting
    IE with conditional comments” (http://dev.opera.com/articles/view/supporting-ie-with-conditional-comments).
    There is also an article on MSDN called “About Conditional Comments” (http://msdn.microsoft.com/en-us/library/ms537512.aspx)
    that contains some dreadful outdated web development ideas but provides a good
    reference for all of the IE conditional syntax available.


    > NOTE: IE completely ignores conditional comments, so you can’t use them to direct
    code only to IE10. This isn’t as bad as it sounds: IE10 has really good standards
    support, worthy of a modern browser, so chances are you wouldn’t need conditional
    comments anymore.


    # WRAPPING UP


    After reading this chapter, you are up to speed to work on your markup structures
    and have built a toolkit you can rely on. Now you can stretch and relax a bit.


    When you’re ready to continue your work and start looking into CSS3 enhancements
    for text and fonts, turn the page when you hear the tone. (If you’ve not bought
    the interactive version of the book, invent your own tone and hum it to yourself.)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_77_0.png)'
