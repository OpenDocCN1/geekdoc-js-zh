  md: '# # 9

    # STYLING HTML5 MEDIA AND FORMS'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'Some HTML5 features not only provide new capabilities to allow you to create
    richer, better functionality more easily and natively, but they also bring with
    them new visual controls for your users to interact with. These include <video>
    and <audio>, as well as some new HTML5 form features. However, they present a
    host of styling problems: As with many older, less-nascent HTML features, the
    specs don''t dictate how they should be styled, so browsers have different default
    styling for such elements.


    It''s a pain to style such elements across browsers consistently, especially if
    you also need to consider styling fallbacks that might be written in Flash. The
    information in this chapter will ease your pain by providing you with techniques
    for cross-browser styling consistency.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_339_0.png)'
  merge: -1
  pgno: 339
- img_proc: true
  md: "# CUSTOMIZING <VIDEO> AND <AUDIO>\n\nFIGURE 9.1 The visuals of different browsers'\
    \ HTML media implementations are a real drag for designers.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_340_0.png)\n\
    \nThe HTML5 <video> and <audio> elements provide a great way to embed media onto\
    \ your page without having to use plug-in content like Flash; although, older\
    \ browser support you'll want to consider providing a Flash movie fallback.\n\n\
    One of the main points of the HTML5 media elements is that they look different\
    \ across browsers, as illustrated in Figure 9.1.\n\nTo remedy this, you can remove\
    \ the native controls provided by the attribute, create your own buttons using\
    \ HTML and CSS, and then use the HTMLMediaElement JavaScript API to wire those\
    \ buttons to the right functions. You'll learn how to do this in the next sections.\n\
    \n# CREATING SIMPLE CONTROL BUTTONS\n\nLet's start by creating some nicer-looking\
    \ video controls using your old friends HTML and CSS. You can do this in any way\
    \ you want, but here I've used HTML <button> elements to create Play/Pause, Stop,\
    \ Fast Forward, and Rewind buttons, and a timer. The HTML looks like:\n\n```\n\
    <div id=\"controls\">\n  <button id=\"play\" data-icon=\"P\"></button>\n  <button\
    \ id=\"stop\" data-icon=\"S\"></button>\n  <div id=\"timer\">00:00</</div>\n \
    \ <button id=\"rwd\" data-icon=\"B\"></button>\n  <button id=\"fwd\" data-icon=\"\
    F\"></button>\n</div>\n```"
  merge: -1
  pgno: 340
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_341_0.png)


    # ## STYLING YOUR CONTROL BUTTONS


    Styling your control buttons using the preceding code is nothing special, and

    You''ve already seen this CSS earlier in the book, so I won''t spell it all out
    in detail.

    The main items to note are that I''ve used a web font to create the icons for
    the

    buttons (the glyphs are from HTML5 data- attributes and are added to the

    page using generated content; you saw this in Chapter 6), and the different button

    depressing and depth effects have been made using various text shadows,

    box shadows, and gradients.


    The styling results in the visual effect shown in **Figure 9.2**—a much better

    cross-browser look!


    # ## HIRING THE BUTTONS WITH JAVASCRIPT


    Now it''s time to make your custom buttons actually do something. This is fairly

    simple, because HTML5 provides a convenient API you can use to give your con-

    trol real functionality. Let''s explore! Now I found my finished JavaScript in
    the

    file custom-player.js code download folder. You should first set up

