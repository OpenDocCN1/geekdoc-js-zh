  md: '# ADDED BANDWIDTH


    Web fonts have many advantages over image replacement in terms of flexibility
    and the power you have to control your designs. They can also result in a smaller
    file size, depending on your situation. But you really need to think carefully
    about using them, for example, you are only using a single font for a single heading
    at the top of your site.


    In Arthur''s blog I only used the Gensch Heyset font for the <h1> on each page.
    The EOT and TTF versions are 66 kb; the WOFF version is 41 kb; and the SVG version
    is a whopping 209 kb (although this is only needed by users of old versions of
    iOS). Some single font can range in size from 300 to 400 kb. And this is made
    worse by the fact that some browsers erroneously download more fonts than they
    need (the “Browser bugs” section later in this chapter).


    This problem will be mitigated as time goes—as old IE versions die out and all
    browsers support WOFF. But it won''t go away completely. Some fonts will just
    be very big, especially when you consider CJK (Chinese, Japanese, Korean) languages,
    which can feature thousands of characters; such fonts can weigh in several megabytes.


    NOTE: If font size is a problem in your situation, you could create a font file
    containing the characters you need using a program called Fontforge (http://fontforge.sourceforge.net).
    In addition, a property in the file unicode-range allows you to specify which
    characters you want to load from the font file, making the bandwidth problem even
    easier to solve. But at the time of this writing, unicode-range was only supported
    in WebKit, so I decided not to talk about it in detail.


    So determine whether you really need a web font or if you''d be better with image
    replacement, or even a web-safe font, such as Times New Roman. Just because you
    use web fonts doesn''t mean you have to!


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_88_0.png)'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# MY AFFABLE LITTLE TROLL


    # MY AFFABLE LITTLE TROLL


    Figure 3.3 A web-font example with the &lt;h1&gt; set to 48px in Firefox 8 on
    the Mac (top) and in IE6 (bottom). The IE6 rendering, as well as getting the sizing,
    so wrong it looks lot smaller, is more jagged and fuzzier.


    WINDOWS RENDERING PROBLEMS


    Another problem you''ll come across with web fonts fairly frequently is that web-font
    rendering can be pretty awful with certain fonts on certain browsers, especially
    IE on Windows.


    Windows uses a technology ClearType, which uses subpixel rendering to make font
    appear smoother. If this option is not enabled, the font will look worse on Windows,
    and it''s not something you can control. That said, this technology has been around
    forever (it is turned by default in most modern Windows systems but not XP, unfortunately),
    but it still doesn''t look appealing for larger-font rendering compared to Apple''s
    anti-aliasing on Mac OS X (**Figure 3.3**). On this rendering problem, be sure
    to read Jan Tan''s excellent post "Display type and the raster wars" (http://jontangerine.com/2008/11/display-type-and-the-raster-wars).


    Some modern browsers do font anti-aliasing as well, which can help when rendering.
    Chrome, IE, and Safari use the operating system default, whereas Firefox seems
    to use its own font-smoothing system. Opera doesn''t do any anti-aliasing of its
    own.


    There are so many variables, the only way to approach this rendering problem is
    to do a decent amount of testing across Windows XP, Vista, Windows 7 and later
    versions, including the full gamut of modern browsers, as well as IE6–8. See if
    the quality of the font rendering is acceptable to you and your clients, and explain
    the potential problems with Windows.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_90_0.png)


    **FIGURE 3.4** Glyphs that do not appear inside your web font will be rendered
    in the system default, if you''ve specified it as a fallback in your font stack.


    **FIGURE 3.5** There''s nothing worse than seeing horrible blank spaces in your
    text! Always specify a fallback font stack, even if it is the system default sans-serif
    or serif font!


    If your headings look ghastly, one potential solution is to set the heading font
    sizes in pixels just on the problem browsers. This has been known to help. You
    could do this via IE conditional comment or by using browser sniffing.

    Another tip is that when you generate your #font-face kit in Font Squirrel, as
    you saw earlier, you should click the Expert option, and then choose Rendering
    > Apply Hinting > Improve Win rendering.


    # QUALITY AND WIDESPREAD USAGE


    Free fonts are all well and good, but the really decent fonts are few and between.
    Many free fonts have a small range of glyphs included in them, which is not too
    bad if you are using the glyphs for headings that you can control, but can be
    disastrous if you are using them on user-generated content, like a blog. If you
    have specified a fallback font, the characters that don''t appear in your web
    font will appear in the fallback font. For example, in Figure 3.4 I''ve replaced
    the “K” in Knights in my example''s `<html>` with a registered trademark symbol
    that doesn''t appear in the GenzschHeYeseRegular font.


    If you don''t specify a fallback font stack, certain characters could be rendered
    as horrible little blank spaces or ugly squares (**Figure 3.5**), because the
    web font does not contain those glyphs.'
