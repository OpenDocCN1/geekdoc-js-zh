  md: '# FLEXIBLE LAYOUT TECHNIQUES


    FIGURE 8.3 A raw flexible layout.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_300_0.png)


    So far in this book, I''ve deliberately not considered responsive design very
    much because I wanted to dedicate this chapter to it! However, you''ve already
    seen the elements of responsive design without even knowing it, mainly the flexible
    techniques I''ll talk about in this section.


    # CONTAINERS THAT BREATHE


    The first important optimizing technique is sizing containers in percentages to
    allow your containers to breathe a little so the layout will still look OK and
    in slightly different screen sizes. This is demonstrated by the main example I''ll
    use in this chapter, which is a responsive media site called Media Blitz. You
    can find the finished version in the media Blitz folder in the code downloads.
    Hop on over to the chapter8 folder and open the file media-blitz-1-base-layout.html
    file to start. This file literally includes the raw container layout information
    (**Figure 8.3**).


    This layout was pretty easy to put together. If you know your basic CSS. Don''t
    worry about the height of the content right now. Instead, focus on the fact that
    you resize your browser window, the different blocks keep to the indicated proportions
    because the containers are all sized percentages.


    > NOTE: In the future when browser support is better, you''ll be able to create
    flexible layouts in a much easier way, with less markup, using some of the advanced
    layout techniques in Chapter 7. For now, I''ve just stuck to good ol floats.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_301_0.png)


    **Figure 8.4** The flexible layout with the content filled in. Love that retro
    reel!


    Now open the file media-blitz-2-with-content.html, which looks like **Figure 8.4**.
    This file is the same as the previous version but with some content filled in
    for you to work with.


    # RESPONSIVE MEDIA LAYOUTS


    The layout I''ve created so far looks perfectly reasonable. As you increase and
    decrease the width, it breathes. The sizes of the different containers change,
    and their relative proportions change, meaning that you can still see all of the
    layout.


    Text will reflow flawlessly in these situations, but you can soon run into problems
    with images and video. If an image or video overflows its bounds, the result will
    get ugly, as shown in **Figure 8.5.**'
  merge: -1
