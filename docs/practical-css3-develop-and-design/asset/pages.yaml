  md: "# # Visit my shop\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_165_0.png)\n\n\
    FIGURE 5.5 Scaling the example container — the smaller version over the top is\
    \ the original; the larger behind the scaled version.\n\nSCALE, SCALEY\nscale\
    \ allows you to grow your elements horizontally and vertically, in a similar manner\
    \ to width and height, except that it treats the element and its child content\
    \ as one static entity; text won't be reflowed and so on. In the transform-2scale.html\
    \ file in the chapters download folder, you'll find the following line:\n\ntransform:\
    \ scale(1.25,1.1);\n\nwhich produces the effect shown in Figure 5.5.\n line scales\
    \ the example by 25% horizontally and 10% vertically. scale takes unless values\
    \ called scale factors, which indicate the amount to grow or shrink. So, 1.1 means\
    \ “grow by 10%,” 1.25 means “grow by 25%,” 2 means “grow by 100%,” and so on.\n\
    You can use values less than 1 to shrink the affected element: 0.9 means “shrink\
    \ by 10%,” 0.4 means “shrink by 60%,” and so on. You can use negative values with\
    \ scale , which invert the elements they are applied to; all the points on the\
    \ element will and take a position on the opposite side from where they started.\n\
    In the previous example, two values are provided for scaling along the X and Y\
    \ axes. If you specify only one value, it will be applied to both dimensions,\
    \ example:\n\ntransform: scale(1.25);\n\nwould scale the element by a factor of\
    \ 1.25 horizontally and vertically.\n\nTRANSFORMS 157"
  merge: -1
  pgno: 165
- img_proc: true
  md: 'FIGURE 5.6 Skewing the example container.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_166_0.png)


    If you want to scale only in a single direction, you could set the direction you
    don''t want to scale to 1, for example:


    transform: scale(1.25,1);


    But it is more efficient and intuitive to specify a single value for scaling—either
    horizontally:


    transform: scaleX(1.25);


    or vertically:


    transform: scaleY(1.25);


    Try experimenting with different values to see the results!


    SKEW, SKEWX, SKEW skew is rather fun because you can use it to squash an element,
    changing it from a square or rectangular box into a rhombus or parallelogram.
    This transform is rather hasty if you want to transform certain elements to create
    some sort of perspective effect—for example, an isometric view—or fit text onto
    a background shape that isn''t flat.


    To see how this transform works, open the transform-2dskew.html example. In you''ll
    find the following line:


    transform: skew(10deg,3deg);


    which produces the effect shown in Figure 5.6.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'skew accepts the unit values as rotate, but it works in a different way.

    Instead of the whole element rotated but looking the same, it is deformed by three
    degrees horizontally and ten degrees vertically. In real terms, this might seem
    a bit illogical, because the three degrees x value is applied to the vertical
    sides (they are slanted three degrees off vertical) and the ten degrees y value
    is applied to the horizontal sides (they are slanted ten degrees off horizontal).
    Just think of it this way: The x and y values refer to the axes shape is distorted
    along.


    If you want to skew an element in one direction, use skewX or skewY. For example:


    ```

    transform: skewX(3deg);

    ```


    ```

    transform: skewY(10deg);

    ```


    > TIP: As you''d expect, you can use negative values to skew the element in the
    other direction, vertically/horizontal.


    MULTIPLE TRANSFORMS

    You can apply multiple transforms in the same rule by including them all in the
    same property separated by spaces.

    In the example file _2dtransform.html, you''ll find the following transform-line:


    ```

    transform: skew(-3deg,-10deg) translateX(-200px) scale(0.7)

    → rotate(10deg);

    ```


    The effect is shown in Figure 5.7.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_167_0.png)


    FIGURE 5.7 Applying multiple transforms to the example.'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'nI won''t discuss the matrix transform function in any great detail, because
    it is very complicated. If you have years of experience with SVG, and/or are you
    a math geek, you''ll be familiar with these so-called transform matrices: They
    take the form of algebraic expressions. For example, the equivalent of transform:
    rotate(30deg); as a matrix would be:


    ```

    transform: matrix(cos(30), sin(30deg), -sin(30deg), cos(30deg), 0, 0);

    ```


    Transform matrices are very powerful but you can effectively use a single matrix
    to apply multiple transforms at once. However, they are unreliable and overcomplicated.
    In my opinion, you are better off using multiple transform functions as explained
    in the previous section.


    > If you want to read more details on matrix transformations, read http://dev.opama.com/articles/view/understanding-the-css-transforms-matrix/
    by Tiffany Brown. The website www.w3.org/TR/SVG/coords.html#TransformMatrixDefined
    provides a pure matrix explanation.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_168_0.png)


    # 3D TRANSFORMS


    Let''s pop up from the flat world of 2D and look at transforms that work in three
    dimensions. These are slightly more limited in support (at the time of this writing,
    Opera does not yet support them), but it definitely won''t be long before you
    support across the full gamut of modern browsers!


    Let''s explore the properties you have to work with.


    TRANSL3D, TRANSLATE


    3D translations work in the same way as 2D translations (the earlier “translate,
    translateX, translateY” section for full details) except you can move elements
    along the Z axis as well—that is, in and out of scene. You would think that if
    you translate elements along the Z axis, they would move closer and further away
    from you, making them appear bigger and smaller.


    However, in practice it doesn''t quite work that way. Look at the transform-3dtranslate.html
    example. As in previous examples, this contains the container with a ghost. However,
    this two containers are inside a wrapper `<div>`.'
  merge: -1
