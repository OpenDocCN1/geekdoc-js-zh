- img_proc: true
  md: "I've styled the bars nicely and added a nifty little bit of JavaScript resizes\
    \ the height of the bars and their container to perfectly fill the screen when\
    \ the page loads and when the screen is resized, making for an ideal adaptive\
    \ example. (There's also a small media query to change the font size when the\
    \ height gets; Small 8 covers Media Queries in more detail.)\n\nHow did I do this?\
    \ The markup is again very simple (I've removed some of the <div>s for brevity;\
    \ there are seven in all):\n\n```\n<div id=\"wrapper\" tabindex=\"0\">\n  <div\
    \ id=\"timing1\"><p>linear</p></div>\n  <div id=\"timing2\"><p>ease</p></div>\n\
    </div>\n```\n\nNow on the CSS. I first selected the nested <div>s:\n\n```\ndiv\
    \ div {\n  height: 100px;\n  width: 25%;\n  background: linear-gradient(top,rgba(0,0,0,0),rgba(0,0,0,0.4))\n\
    \  → 70%;\n  box-shadow: inset 0 -10px 25px rgba(0,0,0,0.4);\n  transition-property:\
    \ width;\n  transition-duration: 3s;\n}\n```"
  merge: -1
  pgno: 192
- img_proc: true
  md: "I set a default height on the <div>s for the benefit of browsers that don't\
    \ support the JavaScript I've used (they probably won't support the transitions\
    \ anyway, but hey), a default width of 25%, some shadowing to make the bars look\
    \ good, and most important, I declared a transition of the width property over\
    \ 3 seconds.\n\nNext, I set the nested <div> widths to 90%, only when their wrapper\
    \ <div> is hovered over. Note that it is very powerful to use pseudo-classes in\
    \ descendant/child selector chains like:\n\n```\n#wrapper:hover div, #wrapper:focus\
    \ div {\n  width: 100%;\n}\n```\n\nFinally, I set each separate <div> to have\
    \ a different background-color and transition-timing-function, for example:\n\n\
    ```\n#timing1 {\n  background-color: blue;\n  transition-timing-function: linear;\n\
    }\n```\n\n```\n#timing2 {\n  background-color: red;\n  transition-timing-function:\
    \ ease;\n}\n```\n\n> TIP: Notice that I've used a negative number for the Y-position\
    \ of the first control handle in the cubic Bezier example: cubic-bezier(0.25,-0.5,0.75,1.1).\
    \ This causes a \"bounce effect\" where the transition goes below its beginning\
    \ value and then comes up again and on to the final value. This technique can\
    \ be very useful for effects, such as a toy boat bobbing up and down in the water\
    \ after being dropped.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_193_0.png)"
