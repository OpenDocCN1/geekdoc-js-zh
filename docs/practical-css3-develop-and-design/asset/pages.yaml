  md: "+   Generated content using :before and :after. You can use the :before and\
    \ :after pseudo-elements to specify what content should be inserted before and\
    \ after the element you are selecting. You then specify what content you want\
    \ to insert or generate. As a simple example, you can use the following rule to\
    \ insert a decorative image after every link on the page:\n\n```\na:after {\n\
    \  content: \" \"(flower.gif)\";\n}\n```\n\nYou can also use the attr() function\
    \ to insert the values of attributes of the elements after the element. For example,\
    \ you could insert the target of every link in your document in brackets after\
    \ each one you are following:\n\n```\na:after {\n  content: \" \"(attr(href))\"\
    ;\n}\n```\n\nThis is a great technique to use in a print stylesheet where you\
    \ want to just show the URLs in the document rather than having them hidden inside\
    \ links (useless on a printed page).\n\nCSS3 PSEUDO-ELEMENT DOUBLE-COLON SYNTAX\n\
    Note that the new CSS3 way of writing pseudo-elements is to use a double colon—for\
    \ example, a::after { ... }, to set them apart from pseudo-classes. CSS3, however,\
    \ still allows for single colon pseudo-elements for the sake of backward compatibility.\
