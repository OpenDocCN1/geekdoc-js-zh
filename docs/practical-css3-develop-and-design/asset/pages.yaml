  md: '# WRAPPING UP


    In this chapter you explored some of the new layout features contained among the
    CSS3 modules, including multi-col, flexbox, exclusions, and generated content
    for paged media.


    A significant number of these features are currently not supported across browsers,
    and unfortunately, some of them don''t degrade gracefully, causing layouts to
    completely break in browsers that don''t support them. However, browser vendors
    are working hard on adding support for them. In the meantime, you can provide
    alternative styling to nonsupporting browsers through tools like Modernizr, and
    you should be prepared for the revolution when it comes.'
  merge: -1
