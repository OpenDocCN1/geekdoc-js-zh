    # # HARDWARE ACCELERATION


    With many browsers, 3D animations are hardware accelerated; that is, they are
    rendered using the GPU of the device, not just the browser. To take advantage
    of the smoother rendering this produces, some developers have started using 2D
    transforms using 3D functions. For instance, look at the following example:


    ```

    transform: rotate(45deg);

    ```


    You could force the browser to use hardware acceleration for this by adding a
    3D function at the end of the transform list that does nothing to the element,
    like so:


    ```

    transform: rotate(45deg) translate3d(0,0,0);

    ```


    This is useful if animations are running slow on a certain device, for example,
    an Android phone or iPhone. However, be careful not to change all the prefixed
    versions of the property, because you might stop some browsers from using the
    property (for example, Opera doesn''t support 3D transforms at the time of this
    writing). So until support is more consistent, you could do this:


    ```

    -webkit-transform: rotate(45deg) translate3d(0,0,0);

    -o-transform: rotate(45deg);

    ```'
