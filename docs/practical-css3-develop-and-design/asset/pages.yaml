    \ If it returns true, the code changes the class value to form-in to animate offscreen.\
    \ If it returns false, the left property is returned to its original value—to\
    \ move offscreen in a less glamorous manner—and the form class is set to blank\
    \ again to return it to its original state.\n\nThe last part of the else block\
    \ changes the <h1> text back to what it was originally.\n\nNow on the second function,\
    \ rotateForm():\n\n```\nfunction rotateForm() {\n  if(Modernizr.cssanimations\
    \ && Modernizr.cstransforms(3d)) {\n    form.setAttribute(\"class\",\"form-rotate\"\
    );\n    form.style.left = \"0\";\n  } else {\n    back.style.zIndex = \"5\";\n\
    \  }\n}\n```\n\nIf, Modernizr.cssAnimations Modernizr.cstransforms3d are true,\
    \ I used set to set the <form>’s class attribute to form-rotate. This applies\
    \ the rotate animation to the form, making it rotate to reveal the “Thank You”\
    \ message. By setting the <form>’s class to form-rotate will override the class\
    \ of form-out set earlier, which would cause the form to move offscreen;"
