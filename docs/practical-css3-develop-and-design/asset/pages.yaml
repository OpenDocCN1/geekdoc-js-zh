  md: "# MULTIPLE BACKGROUNDS\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_140_0.png)\n\
    \n**FIGURE 4.30** Multiple backgrounds rock!\n\nCSS3 gives you the ability to\
    \ attach multiple backgrounds to a single element, which is très cool. For so\
    \ long, if you wanted to have multiple background images on a container, you had\
    \ to have a number of extraneous wrapper <div>s for the extra background images,\
    \ which was a very lame hack to have to.\n\nThe multiple backgrounds are simply\
    \ added in, comma-delimited list. Let's look at a simple example to illustrate\
    \ the point; you'll revisit multiple backgrounds a number of times throughout\
    \ the book.\n\nIf you again consult the Monty Python example in the king arthur\
    \ example folder, you'll find the following in the main-style.css file (multiple\
    \ vendor prefixed versions have been omitted here for brevity):\n\n```\nbody {\n\
    \  ...\n  background: url(../images/castle.png) top left no-repeat,\n  url(../images/clouds.png)\
    \ top right no-repeat,\n  linear-gradient(top right, #3B6498, #C1CDDB);\n  background-color:\
    \ #C1CDDB;\n}\n```\n\nNotice that I've used two background images here and a great\
    \ well. The ability to include CSS gradients in the list of multiple backgrounds\
    \ makes them even more awesome! I've also included a separate background color\
    \ as a fallback for nonsupport browsers (**Figure 4.30**)."
  merge: -1
  pgno: 140
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_141_0.png)


    **FIGURE 4.31** A great effect created with multiple gradients.


    The castle is positioned at the top left, the clouds are positioned at the top
    right so they flow nicely behind the castle, and a subtle blue gradient has been
    added both for the sky. If you resize the browser with this demo open, it will
    immediately become evident how awesome and flexible multiple backgrounds are!


    However, you need to bear in mind that the images later in the property value
    appear behind earlier on, which is rather contrary to the way CSS usually works.
    In CSS, elements drawn later appear on top of those drawn before, so you''d expect
    it to work the same way with background images. Occasionally, you''ll-wonder what
    the spec writers were thinking when they wrote certain parts of the spec.


    Multiple backgrounds are also very cool for using multiple gradients together
    to create complex background patterns. In the Monty Python example (full-post
    html/full-post.css), I''ve used positioning to lay the figure captions over the
    top of the images. I then used two gradients to apply a grainy texture to the
    images and added a highlight to each one (**Figure 4.31**).


    > NOTE 4.31. At the time of this writing, there are differences between browser
    implementations of multiple gradients, but these should be ironed out by the book''s
    release.'
  merge: -1
