  md: 'Here, the inner wrapper is used for the sizing and positioning, and the design
    work is applied to the two front and back &<div>&gt;s for the front and back of
    the card. The outer wrapper &<div>&gt; is there to add hover and other state change
    effects, so that you don''t get that unwanted behavior in some browsers that was
    discussed earlier (see the "Firefox Bad Hover?" sidebar). The &<div>&gt; contents
    are unimportant for the purposes of this example, although for a real business
    card you''d want to mark up the contact details in a more useful way by using
    an hCard microformat, for example.


    You''ll set a transition on the inner wrapper and then tell it to preserve the
    3D space:


    ```

    #inner-wrapper {


