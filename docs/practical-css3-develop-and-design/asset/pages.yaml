  md: "# SIZING TEXT USING REMS\n\nCSS3 introduces a few new size units (seewww.w3.org/TR/css3-values);\
    \ one in particular that seems stable and is getting good browser support is the\
    \ rem, or root em. This makes text styling a lot easier because all sizes defined\
    \ in rem are relative to the text size of the root element—html. Rem rid of the\
    \ complications caused by ems and percentages: They work relative to the sizing\
    \ of their parent elements. So, for nested elements, you'll often have to do all\
    \ kinds of weird calculations to work out what values to use to get the font size\
    \ you want. Consider the following example (see rem-example.html in the chapter\
    \ code folder):\n\n```\n<h1>Example rem/em> exploration</h1>\n```\n\n```\n<p>This\
    \ example is written to show why the new CSS3 rem is useful. It allows you to\
    \ much more easily size text and boxes, as rem sizing is always relative to the\
    \ size of the <code>&lt;html&gt;</code> element.</p>\n```\n\nYou can start off\
    \ by sizing your text so:\n\n```\nhtml {\n  font-size: 62.5%;\n}\n```\n\n```\n\
    h1 {\n  font-size: 3em;\n}\n```\n\n```\np {\n  font-size: 1.4em;\n}\n```\n\nThis\
    \ is simple CSS. You start with the tried and tested 62.5% font setting to take\
    \ the base font size for the whole document down to 10px (62.5% of 16px), the\
    \ standard default body text font size in all browsers). Then you set the <h1>\
    \ size"
  merge: -1
  pgno: 27
