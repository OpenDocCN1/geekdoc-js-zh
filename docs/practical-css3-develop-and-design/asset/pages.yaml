- img_proc: true
  md: "But this feels a bit dirty, a bit grubby, and a bit amoral. It is almost completely\
    \ semantically devoid, with nothing to let a browser or screen reader know this\
    \ is a figure and caption, and certainly nothing to associate the caption with\
    \ the figure! HTML5 offers a much better solution:\n\n```\n<figure>\n  <p><img\
    \ src=\"figure.png\" alt=\"This is a picture containing\n  important content\"\
    ></></p>\n  <figcaption>This is a very important picture.</figcaption>\n</figure>\n\
    ```\n\nThis code provides a consistent, semantic way of defining a figure and\
    \ associating a caption with it. Note that the figure—the image in this case—can\
    \ be anything you want. It could be a few images, videos, a <canvas>, or a combination\
    \ of content types.\n\ntime quite simply provides you with a decent semantic way\
    \ of marking up a date and time. Here's a simple example:\n\n```\n<time datetime=\"\
    1978-06-27\">27th June 1978</time>\n```\n\nThe datetime attribute contains an\
    \ ISO-standard date and time, which is unambiguous and machine-readable. The text\
    \ inside the tags, on the other hand, can be any representation of the time and\
    \ date you want and thus can be customized to suit the style of your site. You\
    \ could also write:\n\n```\n<time datetime=\"1978-06-27\">June 27 1978</time>\n\
    ```\n\n```\n<time datetime=\"1978-06-27\">My birthday</time>\n```\n\n```\n<time\
    \ datetime=\"1978-06-27\">Nineteen seventy-eight, June the twenty-seventh</time>\n\
    ```"
