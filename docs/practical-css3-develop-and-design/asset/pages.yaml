    \ at the best of times.\n\nThe path to the PIE.html file must be relative to the\
    \ HTML file the CSS is applied to, the CSS, if you are using an external CSS file.\
    \ This sounds very odd, but it is due to the way HTC file works: It alters the\
    \ behavior of the CSS after it is applied to the HTML!\n\nThe other major part\
    \ of using the CSS3PIE technique comes when you use it to add support for gradients.\
    \ To do so, you need a special -pie- prefixed version of the property. For example:\n\
    \n-pie-background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.2));\n\nYou'll\
    \ notice that using the -pie- prefix on a gradient, the prefix is on background,\
    \ not linear-gradient, which is where the prefix would go.\nThere is an added\
    \ complication: the limitation of CSS3PIE's RGB support.\nYou see, CSS3PIE will\
    \ support it, but it won't render the alpha. Instead, it will drop the alpha channel\
    \ and render the equivalent RGB color. This is certainly better than nothing and\
    \ probably not disastrous in many situations, but it could also cause content\
    \ to be unreadable or just look shocking, especially if you're relying on a color\
    \ with a low alpha value to just add a faint shadow or tint to a container on\
    \ your page. To remedy this problem, it is a good idea to change the -pie- prefixed\
    \ version of the property to a sensible fallback color or even remove it in some\
