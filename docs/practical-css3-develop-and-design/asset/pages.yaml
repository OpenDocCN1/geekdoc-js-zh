  md: "# THE NEGATION (NOT) PSEUDO-CLASS\n\nThe negation pseudo-class can be used\
    \ to explicitly apply styles to elements that are not selected by a simple selector.\
    \ Let's say you wanted to apply a specific width to a number of form elements\
    \ but not the submit. You could do this:\n\n```\ninput[type=\"text\"], input[type=\"\
    url\"], input[type=\"email\"],\n  -> select, textarea, etc, etc {\n    width:\
    \ 15em;\n}\n```\n\nThis code is a total messy pain. The :not selector allows you\
    \ to do this:\n\n```\ninput:not([type=\"submit\"])\n  width: 15em;\n```\n\nYou\
    \ can put multiple simple selectors inside the parentheses separated by commas,\
    \ like so:\n\n```\ninput:not([type=\"submit\"]], [type=\"file\"]\n```\n\n# CSS3\
    \ PSEUDO-CLASSES\n\nPseudo-classes don't select elements; they select elements\
    \ in certain states—for example, a :hover to select links, but then a:hover to\
    \ select links only when they are being hovered over the mouse.\n\nCSS3 introduces\
    \ some new pseudo-classes for you to sink your teeth into. My favorite, :target,\
    \ allows you to select elements that are the target of the current page URL. This\
    \ is very useful and for some cool effects, because it effectively lets set styles\
