  md: "# # 7\n CSS3 LAYOUT CHOPS"
  merge: -1
  pgno: 248
- img_proc: true
  md: 'Now comes the time to turn to the subject of using CSS to create layouts.

    Traditionally, users of CSS have been poorly served in this area, because the
    tools available to produce layouts have been limited. However, CSS3 provides a
    number of modules aimed at bridging that gap.


    In CSS2, all you really have for designing web page layouts in a serious way are
    floats and positioning. In many situations you must still rely on JavaScript to
    fix CSS layout limitations.


    CSS3 gives you layout abilities a real booster shot in the arm by offering many
    modules designed to fulfill specific needs. In this chapter you''ll explore those
    modules and learn how you can successfully use them now. Let''s get this carnival
    of content contortion started with a brief look at these new features.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_249_0.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# CSS3 LAYOUT MODULES IN BRIEF


    Although CSS3 has a number of layout-oriented modules, I''ll mainly focus on discussing
    the following modules because of reasonable current support, future importance,
    and limited page count:


    +   - CSS Multi-column layout (www.w3.org/TR/css3-multicol). Multi-col allows
    you to split a body of content into a number of different columns with column
    rules, column breaks, and more.


    +   - CSS Flexible box layout (www.w3.org/TR/css3-flexbox). This module defines
    new values for the display layout to allow for more layout techniques that control
    the ordering and spacing of the children of a container, which were previously
    very difficult to achieve without JavaScript. Vertically spacing multiple elements
    equally inside a parent container is a good case in point. This module has recently
    had an overhaul, and most browsers do not support the new syntax at the time of
    writing. However, implementation of this module should come quickly, because vendors
    are very interested in it.


    +   - CSS Grids (www.w3.org/TR/css3-grid). Grid systems are very popular for creating
    neat, consistent, balanced layouts, but traditionally you''ve had to build your
    own or use a third-party grid system of some kind. The CSS Grids module provides
    a standardized, native way to create grids. Again, current browser support is
    patchy, but more should follow soon.


    I''ll also cover the following modules briefly at the end of the chapter. They
    do not have browser support as of now, but they are coming and will be important
    in the future:


    +   - Regions (http://dev.w3.org/csswg/css3-regions). This module is intended
    to allow you to define a series of content regions in a document and an order
    in which content is placed into those regions as it fills up.


    +   - CSS3 Exclusions and Shapes Module Level 3 (http://dev.w3.org/csswg/css3-exclusions).
    Shapes allow you to define geometric shapes for content to flow around or inside,
    whereas exclusions allow you to flow content around those shapes. This module
    should allow for complicated magazine-style layouts.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '+   GCPM (www.w3.org/TR/css3-gcpm). The idea behind Generated Content for Paged
    Media is that you can make a container break into pages, which can be flicked
    between in a natural, book-like fashion.


    Table 7.1 summarizes the support for these features.


    # Table 7.1 Browser Support Matrix for CSS3 Layout Features


    | BROWSER | MULTI-COL | FLEXBOX | GRIDS | REGIONS | EXCLUSIONS | GCPM |

    |---|---|---|---|---|---||}{

    | Opera | Since 11.1 | No | No | No | No | Since 12**** |

    | Firefox | 2.0 with -moz-* | 2.0 with -moz*** | No | No | No | No |

    | Safari | 3.2 with -webkit-* | 3.1 with -webkit** | No | 6.0 with -webkit***
    | No | No |

    | Chrome | 4.0 with -webkit-* | 17 with -webkit- | No | 16 with -webkit*** | No
    | No |

    | Internet Explorer | 10 | 10 with -ms** | 10 with -ms- | 10 with -ms- | No |
    No |

    | iOS | 3.2 with -webkit-* | 5.0 with -webkit- | No | No | No | No |

    | Android | 2.1 with -webkit-* | 2.1 with -webkit** | No | No | No | No |

    | Mobile Chrome | Beta with -webkit-* | Beta with -webkit- | No | No | No | No
    |

    | Opera Mobile | Since 11.1 | No | No | No | No | Since 12**** |

    | Opera Mini | No | No | No | No | No | No |


    +   * Indicates multi-col support without support for break-before/after/inside.

    ** Indicates support for the old version of the Flexbox spec, which is deprecated
    (see the "Using Flexbox" section for details).

    *** Safari and Chrome at the time of this writing support regions with a different
    mechanism than that of IE10. See the "Regions" section for more details.

    **** At the time of this writing, GCPM was only supported to a limited extent
    in a special Opera Labs build. See the "GCPM" section for more details.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# MULTI-COL LAYOUTS


    The CSS Multi-column layout spec provides you with a small, focused set of tools
    for breaking a body of content into multiple columns. This isn''t just limited
    to text: You can create multi-col layouts with it if you like, and do smart tasks
    like images or other elements span more than one column. For example, you can''t
    specify different widths for individual columns.


    Without further ado, let''s look at a simple example. You can find my finished
    example in the file simple-multi-col.html in the chapter7 code download folder.
    In the file, note that the multi-col-related properties have been specified with
    prefixes for Firefox, and the WebKit browsers but not for IE and Opera, which
    supports them without prefixes. Also note that most of the properties are applied
    to the parent container of the actual content you want to split into columns,
    in this case the <section> element that contains the dummy content.'
  merge: -1
  pgno: 252
