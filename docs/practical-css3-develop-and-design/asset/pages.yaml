    <section id="part1">

    ...

    </section>


    <section id="part2">

    ...

    </section>


    </section>

    ...

    <section id="summary">

    ...

    </section>

    </article>

    ```


    For more details and examples covering these elements and other HTML5 semantics,
    read "New structural elements in HTML5" by Bruce Lawson and my bad self at http://dev.opera.com/articles/view/new-structural-elements-in-html5.'
