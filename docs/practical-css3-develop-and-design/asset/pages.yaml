  md: '# CSS3PIE


    CSS3PIE adds support for CSS3 “bling” features to older versions of IE that don''t
    support them. It part of Sencha Labs and was originally developed by Jason Johnston.
    The current feature support list includes:


    +   - border-radius

    - box-shadow

    - border-image

    - multiple background images

    - linear-gradient as background image


    Note that CSS3PIE includes a JavaScript version (read more http://css3pie.com/documentation/pie-js),
    but the basic version that you most likely use (at least) is an .htc (HTML component—an
    IE-specific script used to create custom display behaviors that can be applied
    to a page via CSS). Bizarrely, you need to refer to the .htc with a path relative
    to the HTML file, not the CSS file, even if you are including references to it
    in CSS that is contained in an external stylesheet


    For example, consider the directory structure shown in Figure 2.11.

    To apply the CSS styling to the HTML file, you obviously need to refer using the
    path css/style.css:


    ```

    <link rel="stylesheet" type="text/css" href="css/style.css">

    ```


    The .htc files work by being applied to the CSS properties you want to affect
    in the form of a behavior property. You''d think that you can do this by going
    up a level and then down level again to get from .css to :htc:

    behavior: url(../script/PIE.htc);


    But not then. The .htc file is referenced from the CSS but actually acts on the
    HTML file after the CSS has been applied to it, so you need to reference it as
    if you were being referenced from the HTML file, like so:

    behavior: url(script/PIE.htc);

    This confused me at first.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_74_0.png)


    **FIGURE 2.11** A typical, simple website directory structure.'
