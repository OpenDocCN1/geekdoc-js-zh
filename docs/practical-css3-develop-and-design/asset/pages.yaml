  md: '# TRANSITION SHORTHAND AND MULTIPLE TRANSITIONS


    Before moving on, you need to know about a couple more small but useful techniques.
    You can use the transition shorthand property to take the place of the other shorthand
    values, which can save you a lot of lines of code, especially when you have to
    write five different properties to include all the necessary browser prefixes:


    ```

    transition-property: opacity;

    ```


    ```

    transition-duration: 3s;

    ```


    ```

    transition-timing-function: ease-in;

    ```


    ```

    transition-delay: 1s;

    ```


    These four properties can be represented by the following single shorthand property:


    ```

    transition: opacity 3s ease-in 1s;

    ```


    In addition, if you want to specify multiple different transitions on the same
    ruleset, you can list them all on the same property separated by commas. This
    works for shorthand and longhand:


    ```

    transition: opacity 3s ease-in 1s, height 4s linear;

    ```


    ```

    transition-property: opacity, height;

    ```


    You must specify at least transition properties and durations for anything to
    animate, the other values are optional. If you don''t specify a delay, the default
    is 0s, and if you don''t specify a transition timing function, the default is
    ease.


    If you specify multiple longhand properties, different properties are looped through
    to make sure all transitions are assigned a value for each property. Let''s look
    at another example:


    ```

    transition-property: opacity, height, width, background-color;

    ```


    ```

    transition-duration: 3s;

    ```


    ```

    transition-timing-function: ease-in, ease, linear;

    ```'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'In this case, all four of the transition properties will be transitioned over
    a duration of 3 seconds, because that is the only value specified in the transition-duration
    property. Then for transition-timing-function, the first property is given ease-in,
    the second is given ease, and the third is given linear. But there is one more
    property. To give this a timing function, you cycle back to the start of the transition-timing-function
    list: the fourth property is therefore given the ease-in timing function.


    You can specify that you want all properties that change upon state change to
    transition by just writing transition-property: all:


    > NOTE: To be honest, I very rarely have to write such complicated transitions.
    I usually just write something like transition: 1s all; (the duration often varies).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_196_0.png)'
  merge: -1
