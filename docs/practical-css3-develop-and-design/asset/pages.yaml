  md: "# USING FLEXBOX\n\nFlexbox (www.w3.org/TR/css3-flexbox) is designed to facilitate\
    \ some complicated layout techniques including the spacing and ordering of child\
    \ containers of a box. It is actually a new type of box model. To lay out some\
    \ elements using Flexbox, you must set their parent container to use the new box\
    \ model by using a new value of the display property:\n\n```\nsection {\n  display:\
    \ flex;\n}\n```\n\nOr if you want your container to be inline, you'd use this:\n\
    \n```\nsection {\n  display: inline-flex;\n}\n```\n\nNow let's getting cooking\
    \ with some examples.\n\n# FLEXBOX SYNTAX CHANGES\n\nAt the time of this writing,\
    \ only Chrome Canary supported the new Flexbox syntax shown throughout this section.\
    \ And it may be different again by the time you read it; the spec has undergone\
    \ a lot of changes in the time I've been writing this. In fact, I had to rewrite\
    \ the Flexbox examples four times during the course of writing this book—such\
    \ is the folly of trying to write with nascent specs! In any case, the chapter\
    \ should still demonstrate the concepts of Flexbox.\n\nOther modern browsers support\
    \ Flexbox but with an older version of the syntax from 2009. You can see the new\
    \ and old versions of the syntax map at\nhttp://wiki.csswg.org/spec/flexbox-2009-201-spec-property-mapping.\n\
    \nTo solve the problem of different browsers supporting different versions of\
    \ Flexbox, if you are considering using Flexbox in a project, for now I'd recommend\
    \ that you feed browsers the newest syntax by default, and then feed alternative\
    \ styles to those that don't support the new syntax using Modernizr."
  merge: -1
  pgno: 263
