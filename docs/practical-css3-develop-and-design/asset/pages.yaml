    # LIGATURES AND DISCRETIONARY LIGATURES


    You''ve already met ligatures, but there are also discretionary ligatures—extra
    flourishes that can make your text look more attractive. These features are enabled
    so:


    +   -webkit-font-feature-settings: "liga" 1, "dlig" 1;

    -moz-font-feature-settings: "liga=1, dlig=1"

    -ms-font-feature-settings: "liga" 1, "dlig" 1;


    liga basically acts as a different way to enable ligatures using text-rendering,
    although at the time of this writing, the latter had better browser-port. dlig
    produces effects like those shown in Figure 3.18.


    # NUMERALS, FRACTIONS, AND ORDINALS


    OpenType fonts often contain some great features for numbers. Consider the following
    example:


    +   -webkit-font-feature-settings: "anum" 1, "tnum" 1, "frac" 1;

    -moz-font-feature-settings: "anum=1, tnum=1, frac=1"

    -ms-font-feature-settings: "anum" 1, "tnum" 1, "frac" 1;'
