  md: '# ANIMATIONS


    The next stop on this journey is CSS Animations. As discussed previously, animations
    differ from transitions in that transitions are triggered by state changes, whereas
    animations happen independently. I would argue that animations therefore have
    a wider scope and are more useful than transitions. For example, you could use
    JavaScript to apply a CSS Animation to any element you want, by attaching an animation
    to an ID selector and appending ID to the element when a specific event occurs.
    This makes it easier, for example, to allow users to click links to fire animations.


    You can also use CSS Animations with no JavaScript to create sequences of elements
    sliding into place or constant ambient background animations. Browser support
    for CSS Animations is shown in Table 5.3.


    **TABLE 5.3** Browser Support for Animations


    | BROWSER | ANIMATIONS |

    |---|---|

    | Opera | 12 with -o- |

    | Firefox | 5 with -moz- |

    | Safari | 4 with -webkit- |

    | Chrome | 4 with -webkit- |

    | Internet Explorer | 10 with -ms- |

    | iOS | 3.2 with -webkit- |

    | Android | 4 with -webkit- |

    | Mobile Chrome | Since Beta with -webkit- |

    | Opera Mobile | No |

    | Opera Mini | No |


    Note that in IE1 platform view 6, support for non-prefixed animation properties
    have been added.


    You''ll explore various animation uses throughout this section.'
  merge: -1
  pgno: 197
- img_proc: true
  md: "FIGURE 5.22 An animated menu (the animations, unfortunately, look like rubbish\
    \ on the printed page).\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_198_0.png)\n\
    \n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_198_1.png)\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_198_2.png)\n\
    \n# SETTING UP A BASIC ANIMATION\n\nAnimation has a few extra features compared\
    \ to transitions, but it also has many of the same features, such as timing functions,\
    \ delays, and so on. Therefore, if you've already mastered transitions, a segue\
    \ into animations should be fairly easy.\n\nLet's start looking at a simple example:\
    \ Load the animation-basics.html in the chapters code download folder to see a\
    \ little navigation menu that slides into the browser window when the page first\
    \ loads—in Apple website kind of way (Figure 5.22). When you mouse over/focus\
    \ one of the menu buttons, it doesn't just smoothly once; it glows smoothly for\
    \ the whole time it is focused. You couldn't do either of these tasks with transitions\
    \ (well, not without the aid of JavaScript).\n\nTo set up a CSS Animation, you\
    \ must first specify a set of keyframes for that animation. The animated menu\
    \ code contains two keyframe blocks:\n\n```\n@keyframes menu-move {\n    from\
    \ { transform: translateY(-200px); }\n    to { transform: translateY(0); }\n}\n\
    ```"
  merge: -1
  pgno: 198
- img_proc: true
  md: '```

    @keyframes button-glow {

    0% { color: #000;background-color: #E69EE0; }

    50% { color: #666;background-color: #FFFFEE; }

    100% { color: #000;background-color: #E69EE0; }

    }

    ```


    > TIP: Animation blocks and properties require vendor prefixes at the time of
    this writing; I''ve removed them for brevity. In the code example you''ll see
    that this is a lot of code, especially I had to add vendor-prefixed versions of
    all the animation blocks as well as the animation properties appearing in rulesets,
    which you''ll see later. You can write a vendor-prefixed at-rule in basically
    the same way as a vendor-fixed property—for example, @o-keyframes. Note that there''s
    a hyphen between the @ and the prefix and keyframes.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_199_0.png)


    The keyframes block is actually a specialized at-rule block. You start it by writing
    @keyframes, an identifying name of your choosing for the animation, and add a
    pair of curly braces. Inside the curly braces, you specify as many keyframes as
    you want to dictate what happens throughout the course of the animation in terms
    of what property you want to occur. The browser works out animations between the
    different keyframes.


    The two ways of specifying where the keyframes sit along the course of the animation
    are shown in the preceding code snippet. If you want to specify a keyframe frame
    only at the start and end of the animation (0% and 100% along), you can use the
    keywords from and to, as shown in the first block. Or you could use 0% and 100
    instead.


    As you can see, in the second block I''ve specified three different keyframes,
    denoting background-color changing to a different color and then back again. Because
    the first and last keyframes are the same, you could rewrite this code


    ```

    @keyframes button-glow {

    0%, 100% { color: #000;background-color: #E69EE0; }

    50% { color: #666;background-color: #FFFFEE; }

    }

    ```'
  merge: -1
  pgno: 199
- img_proc: true
  md: "But I wouldn't recommend this rewrite, especially not for complicated animations:\
    \ It is much easier to visualize the animation progression when the keyframes\
    \ are written out in the order in which they occur.\n\nYou can have as many keyframes\
    \ as you want and as many properties specified inside each keyframe as you want,\
    \ meaning that complex animations are possible. You can start your keyframes at\
    \ a value greater than 0%—for example, 50%, 60%, 100%. But nothing will happen\
    \ for the portion of the keyframes where nothing is specified.\n\n# APPLYING AN\
    \ ANIMATION TO AN ELEMENT\n\nSo you've learned how to declare an animation block,\
    \ but how on earth do you actually apply that animation to something on your page?\
    \ That's simple; you apply the element to any ruleset you like using the animation-name\
    \ property with the animation's identifying name as the property value:\n\n```\n\
    {\n  ...\n  animation-name: menu-move;\n}\n```\n\nThis is very useful because\
    \ it means you only have to define an animation once, and then you can apply it\
    \ to as many different rulesets as you want. You could have a whole bank of animation\
    \ classes set up, and then add them where you need them."
  merge: -1
  pgno: 200
- img_proc: true
  md: "# SETTING ANIMATION DURATION\n\nYour animation won't do anything yet: In a\
    \ similar manner to transitions, you have to tell it how long to last using animation-duration:\n\
    \n```\nul {\n  ...\n  animation-name: menu-move;\n  animation-duration: 2s;\n\
    }\n```\n\nThis property can take a value with any CSS time units, although you'll\
    \ likely use seconds.\n\n# SPECIFYING THE NUMBER OF TIMES TO RUN THE ANIMATION\n\
    \nThe menu-move animation will work as required. It will slide into view once,\
    \ and only once, because default animations will play only once. If you want them\
    \ to play more than once, you need to specify how many times using animation-iteration-count.\
    \ This property accepts a positive number value or the keyword infinite if you\
    \ want your animation to go to infinity and beyond (I tried that with a straight\
    \ face and failed).\n\nThe menu-move animation is required only once, on the other\
    \ hand, the button-glow animation, is not enough. You want the animation to carry\
    \ on until your site visitors hovering/focusing the buttons. Therefore, you should\
    \ use infinite:\n\n```\na:hover, a:focus {\n  ...\n  animation-name: button-glow;\n\
    \  animation-duration: 1.5s;\n  animation-iteration-count: infinite;\n}\n```\n\
    \n> NOTE: Setting decimal values for animation-iteration-count (e.g. 0.5) will\
    \ make the animation play only part of the way through.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_201_0.png)"
  merge: -1
  pgno: 201
- img_proc: true
  md: '# ALTERING THE ANIMATION RATE


    Again, similar to transitions, you can set different timing functions on animations
    to make the rate the animation occurs at vary from start to end. Only the property
    name is different: animation-timing-function. The timing functions are all the
    same. Here again is a list of the different timing functions:


    +   - linear. The animation happens at the same rate from beginning to end.


    +   - ease. The default value; the animation starts quickly and then gradually
    slows down.


    +   - ease-out. The animation starts quickly, stays quick for longer than ease,
    and slows down more abruptly at the end.


    +   - ease-in. The animation starts off slowly and then speeds up towards the
    end.


    +   - ease-in-out. The animation starts by accelerating, is quite fast for most
    of the duration, and decelerates towards the end.


    +   - steps(s). Instead of giving a smooth transition throughout, this value causes
    the transition to jump between a set number of steps placed equally along the
    transition. For example, steps(10) would make the jump along in ten steps. You
    can also set an optional second parameter with a value of start or end—for example,
    steps(10, start) or steps(10, end). This specifies whether the change in property
    value should happen at the start or end of each step. You won''t find much for
    this optional parameter, but it is worth mention.


    +   - cubic-bezier(). You can use cubic-bezier() to specify your own cubic-bezier
    curve to use for the animation. This function takes four arguments: the X and
    Y coordinates of the beginning control handle, and the X and Y coordinates of
    the end control handle. For example, cubic-bezier(0.25, 0.1, 0.25, 1.0) is equivalent
    to the ease preset. For more on cubic Bézier curves, see the "Cubic Bézier Curves"
    sidebar earlier in the chapter.'
  merge: -1
  pgno: 202
- img_proc: true
  md: "In this example, the glowing effect for the buttons was a bit too jerky using\
    \ the default ease timing function, so I changed it to linear for a smoother feel:\n\
    \n```\na:hover, a:focus {\n  \n  animation-name: button-glow;\n  animation-duration:\
    \ 1.5s;\n  animation-iteration-count: infinite;\n  animation-timing-function:\
    \ linear;\n}\n```\n\n# ADDING A DELAY\n\nYup, you guessed it, it is also possible\
    \ to add a delay before an animation starts by adding an animation-delay value.\
    \ This property is a lot more useful with animation than it is with transitions.\
    \ For instance, you could have an animated sequence occur on page load or after\
    \ a button is activated with multiple animations occurring at different times.\
    \ This type of result is not practical to achieve with transitions.\n\n> TIP:\
    \ You can give animation-delay a negative value to make the animation partly through\
    \ the specified animation-duration.\n\n# ANIMATION-DIRECTION: BACK AND FOR, SIR?\n\
    \nBy default, animations occur from the start and to the end of each iteration.\
    \ However, it is possible to change this behavior so that the animation will take\
    \ an alternative direction: the first iteration will go forward from 0% to 100%,\
    \ the second iteration will travel smoothly back from 100% to 0%, the third iteration\
    \ will go forward, the fourth will go back, and so on. This can be done by including\
    \ the following line on the element to be animated:\n\n```\nanimation-direction:\
    \ alternate;\n```"
  merge: -1
  pgno: 203
- img_proc: true
  md: "For example, because I wanted the button glow to run seamlessly, I specified\
    \ the button-glow animation like this:\n\n```\n@keyframes button-glow {\n  0%\
    \ { color: #000;background-color: #E69EE0; }\n  50% { color: #666;background-color:\
    \ #FFFEEE;\n  100% { color: #000;background-color: #E69EE0; }\n}\n```\n\nIf I\
    \ specified animation-direction: alternate; on a:hover,a:focus { } ruleset,I could\
    \ rewrite my keyframes as this:\n\n```\n@keyframes button-glow {\n  0% { color:\
    \ #000;background-color: #E69EE0;\n  100% { color: #666;background-color: #FFFEEE;\n\
    }\n```\n\nI can now have the animation-duration value, because each iteration\
    \ would now be half the button glow pulse. This is a more efficient way to write\
    \ this and any others where you want the animation to do something and return\
    \ to its original state. But not all animations will be like this.\n\nI've included\
    \ this updated version for you in the chapter5 download folder as animation-basics2.html.\n\
    \n# ANIMATION-FILL-MODE\n\nThe animation-fill-mode property allows you to specify\
    \ how the animated element is displayed after an animation ends or during an animation-delay\
    \ that occurs before the animation starts (i.e., no effect on negative animation\
    \ delays). The possible values of animation-fill-mode are as follows:\n\n+   *\
    \ none. This is the default value. When an animation ends, the element it applied\
    \ to go back to using its intrinsic styling. In addition, no styling from the\
    \ animation keyframes will be applied to the element during an animation delay."
  merge: -1
  pgno: 204
- img_proc: true
  md: '+   forwards. This value makes an element with an animation applied to it retain
    the styles defined by the properties in the final keyframe, after the animation
    ends. The final keyframe will usually be 100% or to. This value is rather useful
    if you want the animations to finish in the final, beginning, states—for example,
    when putting the building blocks of a layout into place upon page load.


    +   backwards. This property value causes styles defined in the first keyframe
    (usually 0% or from) to be applied to the element the animation is applied to
    during an animation-delay rather than the default styles.


    +   both. This value applies the combined effects of forwards and backwards to
    an element undergoing an animation.


    I won’t provide isolated examples for you to see now; instead, I’ll present some
    examples later in the chapter that use these values.


    # SHORTHAND AND MULTIPLE ANIMATIONS


    You need to write a lot of code for CSS Animations due to having to write keyframe
    blocks as well as include multiple properties to control how the animations are
    applied to elements. Fortunately, you can use a shorthand animation property to
    significantly reduce the amount of code needed.


    The following properties:


    ```

    animation-name: woosh;

    animation-duration: 10s;

    animation-timing-function: ease-in;

    animation-delay: 3s;

    animation-iteration-count: 25;

    animation-direction: alternate;

    animation-fill-mode: backwards;

    ```


    can be whittled down to this one line:


    ```

    animation: woosh 10s ease-in 3s 25 alternate backwards;

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'The spec is not very precise in defining the exact order property values should
    be included in the shorthand, but it''s best to stick with the preceding order
    to avoid potential browser bugs. Various sources indicate that this order fulfils
    the idiosyncrasies different browsers currently have.


    You need to explicitly include animation-name and animation-duration for the animation
    to do anything. If you don''t explicitly specify the other values, your default
    values will come into play, which are:


    +   - animation-timing-function: ease;

    - animation-delay: 0s;

    - animation-iteration-count: 1;

    - animation-direction: normal;

    - animation-fill-mode: none;


    You can also apply multiple animations in a single ruleset by including them in
    the same property separated by commas. This works for both longhand and shorthand
    values, for example:


    +   - animation: woosh 10s, zap 5s;

    - animation-name: woosh, zap;

    - animation-duration: 10s, 5s;


    If you''re using longhand properties with different numbers of values, you need
    to specify all the animation names to be applied. If any subsequent properties
    have fewer values than the number of animations specified, the values will be
    alternated to fill the gaps. For example, look at the following properties:


    +   - animation-name: woosh, zap, bang;

    - animation-duration: 10s, 5s;

    - animation-delay: 2s;


    The woosh animation will have a duration of 10 seconds, and the zap animation
    will have a delay of 5 seconds. The bang animation will have a delay of 10 seconds,
    because the duration values have run out, so they cycle around to the beginning
    again. All of the animations will have a delay of 2 seconds.'
  merge: -1
