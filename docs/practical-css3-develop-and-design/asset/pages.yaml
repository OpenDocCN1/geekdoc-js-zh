- img_proc: true
  md: 'FIGURE 3.25 Stylistic set examples (font is Majestic Mishmash Regular from
    Fontdeck—standard, sso1, and sso2).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_110_0.png)


    FIGURE 3.26 Stylistic swashes (font is Trilogy Fatface Regular from Fontdeck).


    # STYLISTIC SETS AND OTHER ASSORTED EFFECTS


    Here are a few stylistic sets and other text effects that I''ve lumped into one
    final section. Consider the following examples:


    ```

    -webkit-font-feature-settings: "ss01" 1, "swsh" 1, "cswh" 1, "calt" 1;

    -moz-font-feature-settings: "ss01=1, swsh=1, cswh=1, calt=1";

    -ms-font-feature-settings: "ss01" 1, "swsh" 1, "cswh" 1, "calt" 1;

    ```


    Explanations of the different declarations used here as follows:


    +   - **ss01.** Stylistic sets specify the usage of an alternative set of glyph
    styles for the standard glyphs (Figure 3.25).

    - **swsh.** Stylistic swashes specify the use of stylistic swashes where available,
    which are often similar to stylistic sets, although the latter tends to be more
    wide-ranging in terms of the kinds of changes they include (Figure 3.26).'
