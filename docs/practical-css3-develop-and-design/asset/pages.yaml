    # # Visit my shop


    Ladies and gentlemen, you are welcome to visit my shop and perhaps to eat. If
    you are ever able to find it You are stuck in times of need, and generally end
    up them the wrong thing, or something broken, or something in the imagination
    commonly selling out


    The more adventures of you, we also stock a range of ''Transforming'' plants that
    may give you one edge or edge. In a tricky situation, just let know what you need,
    or what were want, just get him.


    FIGURE 5.3 A 2d transform in action.


    #  2D TRANSFORMS


    Generally, websites are thought of as working in two dimensions, so to start this
    discussion, I''ll keep it flat and simple. The functions and properties you have
    for transforming elements in two dimensions are discussed in the following sections.


    In the chapters code download folder, you will find a series of transform-files
    demonstrating transforms applied to a simple container. You can find the example
    without any transforms applied to transform-template.html (Figure 5.2); the others
    are named intuitively.


    TRANSLATE, TRANSLATE, TRANSLATE


    translate implies moving the element by the amount you specify in the value. If
    you look at transform-2dtranslate.html, you''ll see the declaration applied to
    the container:


    ```

    transform: translate(200px, 100px);

    ```


    This makes the element 200 pixels to the right and 100 pixels down, as shown in
    Figure 5.3. Note that in each of these examples, I''ve included a "ghost" version
    of the element to show the original position, so it is easy to see exactly what''s
    happened.


    You can use any distance units that make sense; percentage values will be a percentage
    of the width or height of the container you are transforming, not its parent container.
    If you use negative units, you will translate the container instead of right and
    instead of down.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'If you want to move the container in only one direction, you could set the
    other value to o, for example; use the following line if you want to just move
    the container 200 pixels to the right:


    ```

    transform: translate(200px,0);

    ```


    or simply omit it altogether:


    ```

    transform: translate(200px);

    ```


    Be warned, however: If you specify only one value inside a translate transform,
    the browser will assume that it is an X transform and assume Y and Z are o. It
    is therefore better to be more explicit about the direction you want to translate,
    and use this:


    ```

    transformX: translate(200px);

    ```


    or this:


    ```

    transformY: translate(200px);

    ```


    if you want to move it along the vertical axis.


    # X, Y, AND AXES


    X, Y, and Z are talked about a lot in this chapter. They refer to the X, Y, and
    Z axes of the web page, which transforms, transitions, and animations move elements.
    X is the horizontal axis, moving from left to right on the page (a negative X
    value would mean movement from right to left). Y is the vertical axis, moving
    from top to bottom (a negative Y value would mean movement from bottom to top).
    The Z axis moves out of the screen “toward the viewer,” so further away to closer
    in distance; negative Z would do the opposite.'
