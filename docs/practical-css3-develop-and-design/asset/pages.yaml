    > ** The Viewport meta tag and @viewport aren''t relevant to nonmobile browsers.


    Optimizing one for different browsers/devices is the strategy mainly covered in
    this chapter. It is arguably the best and most future-proof way of optimizing
    your content for different browsers/devices. In reality, most modern sites will
    use a combination of this strategy and the preceding strategy—serving different
    sites to different devices—to provide a decent experience to various devices.
    Let''s move on and look at some groovialous, modern web-design techniques.'
