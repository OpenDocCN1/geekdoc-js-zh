  md: '# CSS3 TYPOGRAPHY


    Let''s turn our attention to the typographic control features detailed in the
    CSS3 Fonts module that''s starting to become available across browsers. The following
    features are not available everywhere yet, but I''m including them because none
    of them will cause any major disruption in browsers that don''t support them.
    You''ll also get to see some attractive flourishes in browsers that do! It is
    a breath of fresh air to see web browsers directly supporting the advanced features
    inside font files, although some would say it is long overdue. Table 3.3 shows
    browser support for the features detailed in this section.


    TABLE 3.3 Browser Support Matrix for CSS3 Text Features


    | BROWSER | TEXT-RENDERING: OPTIMIZELEGIBILITY | FONT-FEATURE-SETTINGS |

    |---|---|---|n| Opera | No | No |

    | Firefox | Since 8 | Since 8 with -moz- |

    | Safari | Since 5.1 | No |

    | Chrome | Since 13 | Since 17 with -webkit, only on Windows |

    | Internet Explorer | Since 10 | Since 10 with -ms-* |

    | iOS | No | No |

    | Android | No | No |

    | Chrome Mobile | Since beta | No |

    | Opera Mobile | No | No |

    | Opera Mini | No | No |


    *IE10 platform preview 6 saw the prefix removed


    **NOTE: Other properties support the CSS5 Fonts module program-creation and control
    of features like ligatures and kerning, but none of them seem to have any concrete
    browser support at the time of this writing (a recent Chrome Beta has support
    for font-variant-ligatures and font-kerning). At least this section of the chapter
    can act as a taster for things to come.'
