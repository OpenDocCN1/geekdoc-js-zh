  md: "Here, the combined widths would cause the containers to overflow their parent,\
    \ which would look horrible. Fortunately, a default negative flex value of 1 is\
    \ set on all of the children, which causes them to shrink by an equal amount of\
    \ the overflow, meaning that all is well. If you wanted one of the children to\
    \ be reduced by a larger amount than the others, you could set an explicit negative\
    \ flex value on it, for example:\n\n```\n#plot {\n  flex: 1 3 500px;\n}\n```\n\
    \nThe flexible boxes are shrunk in size until they no longer overflow their container.\
    \ Because the negative flex ratio #cast to #facts is 1:3, #cast will have 3/4\
    \ of the total width reduction applied to it, and #facts will have 3/4 of the\
    \ width reduction applied to it.\n\nThis would cause the Plot to be shrunk by\
    \ 1/4 of the overflow amount, and the other two to be shrunk by only 1/3—the shrinking\
    \ ratio is 1:1.\n\n# CROSS-BROWSER FLEXBOX WITH MODERNIZ\n\nAs you've seen, Flexbox\
    \ is very useful for solving some specific types of layout problems. The problem\
    \ with it right now is the lack of browser support. The new syntax you've seen\
    \ so far in this section is only supported in Chrome Canary at the time of this\
    \ writing.\n\nTo make it work across a wider range of browsers, you'll need to\
    \ feed others the now deprecated 2009 Flexbox syntax that was implemented by Firefox,\
    \ WebKit and IE.\n\n> NOTE: The site http://wiki.csswg.org/spec/flexbox-2009-2011-spec-property-mapping\
    \ provides a fairly useful table showing the mapping between the old and new syntaxes,\
    \ although this is now somewhat out of date. Peter Gasston, tech reviewer for\
    \ this book, has written a useful guide to the old syntax at www.netmagazine.com/tutorials/css3-flexible-box-model-explained.\n\
    \n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_275_0.png)"
