    \n# ADDING MODERNIZR TO YOUR PAGE\n\nTo Modernizr to your page, you first need\
    \ to perform two steps:\n\n+   1. Add a <script> element inside the <head> of\
    \ your page to include the Modernizr script, for example:\n\n<script src=\"modernizr-2.5.3\"\
    ></script>\n2. Add a class of no-js to your <html> tag:\n\n<html lang=\"en-gb\"\
    \ class=\"no-js\">\n\nNow you run your page and look at the code as it is rendered\
    \ (for example, in a debugging tool like Opera Dragonfly), you'll see Modernizr\
    \ has replaced your no-js class with a huge string of classes that look something\
    \ like those in Figure 53.\n\nThis string allows you to specify different styles\
    \ on a page based on what features are supported, using descendant selectors.\
    \ If JavaScript is not supported or turned off, you'll be left with the default\
    \ no-js class, and you can provide some kind of minimal styles that will properly\
    \ work everywhere in the absence of more granular information:\n\n```\n.no-js\
    \ p {\n  color: black;\n}\n```\n\nWhen JavaScript is supported and Modernizr is\
    \ able to give you that granular support information, you can start applying fallback\
    \ styles based on very specific support criteria. Let's look at what the card\
    \ 3D flip example required for wider-ranging browser support.\n\nFIGURE 5.23 Modernizr\
    \ classes to your <html> element to indicate which features your browser supports."
