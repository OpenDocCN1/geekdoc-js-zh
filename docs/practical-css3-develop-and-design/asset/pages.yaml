  md: '# ENABLING ADVANCED FONT FEATURES ON THE WEB WITH FONT-FEATURE-SETTINGS


    The web typography story does not end with "a bit more line-height" (commonly
    known as leading) or even some of the features explored earlier, like ligatures
    and hyphenation. Oh no! OpenType fonts contain many alternative letter forms,
    flourishes, fractional number glyphs, and other goodies that are just crying out
    to be utilized. Frequently these can be turned on in supporting browsers (at the
    moment IE10 and later, Chrome 17 and later on Windows, Firefox 8 and later, and
    currently only with vendor prefixes) using the font-feature-settings property,
    which takes as its value a comma-delimited series of features you want to use.
    For example, to specify that you want to use discretionary ligatures, and fractions
    in Firefox, you''d use:


    ```

    -moz-font-feature-settings: "dig=1, kern=1, frac=1";

    ```


    IE and Chrome use a slightly newer version of the syntax, which hopefully Mozilla
    and other browsers will adopt soon after this book is published:


    ```

    -webkit-font-feature-settings: "dig" 1, "kern" 1, "frac" 1

    ```


    ```

    -ms-font-feature-settings: "dig" 1, "kern" 1, "frac" 1;

    ```


    > NOTE: Microsoft''s "Use the whole font" provides some very good examples of
    font feature usage at http://ie.microsoft.com/testdrive/Graphics/opentype/Default.html.


    Fonts will often have different sets of the same feature available—for example,
    multiple styles of kerning. You can access these by changing the number after
    the declaration—for example, "dig" 0 (in some cases), "dig" 1, "dig" 2, "dig"
    3".


    With that, let''s go forward and explore the different font features available
    to you!


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_105_0.png)'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'FIGURE 3.18 Discretionary ligatures (font is Magneta Italic from Fontdeck).


