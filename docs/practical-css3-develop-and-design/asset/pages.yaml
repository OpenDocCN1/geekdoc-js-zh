    The child number 6 out of 9. If you used article:nth-child(2n) as the selector
    to select all the even-numbered children of the <div>, you''d select the <article>s
    in positions 2, 4, and 8. The <blockquote>(position number six) wouldn''t be selected
    because it is not an <article>.


    If used article:nth-of-type(2n) as your selector, you would select the <article>s
    in positions 2, 4, and 9. The reason is that this selects by the type of element,
    not the child position. In this case the <blockquote> is completely ignored and
    the even-numbered <article> are selected. Yes, two of them are odd numbered according
    to my original numbering scheme, because in reality the <blockquote> exists and
