  md: "to three times that, which results in a computed size of 30px. The <p> is set\
    \ to 1.4 times the size of the base font, or 14px.\n\nThe trouble starts when\
    \ you try to resize children of those elements. If you wanted to, say, size your\
    \ <code> element at 11px, how would you do that with ems? Well, 11em wouldn't\
    \ work, because it would be 1.1em of 14px (the size of its parent element). The\
    \ actual value you need is 11/14 = 0.786em. Extrapolate that to more complicated\
    \ and complicated designs, and you're looking at a whole load of complicated math\
    \ and hair pulling.\n\nRems make text sizing lot easier. If you instead used rems\
    \ for these text sizes, everything would need to be the font-size on the <html>.\
    \ So getting 11px code font would be a matter of using the following:\n\n```\n\
    code {\n  font-size: 1.1rem;\n}\n```\n\n**Table 1.2** shows the current state\
    \ of browser support for rem units.\n\n| BROWSER REM UNITS | |\n|---|---|\n| Opera\
    \ | Since 11.6 |\n| Firefox | Since 3.6 |\n| Safari | Since 5.0 |\n| Chrome |\
    \ Since 6.0 |\n| Internet Explorer | Since 9 |\n| iOS | Since 4.0 |\n| Android\
    \ | Since 2.1 |\n| Mobile Chrome | Since beta |\n| Opera Mobile | 12 |\n| Opera\
    \ Mini | No |"
