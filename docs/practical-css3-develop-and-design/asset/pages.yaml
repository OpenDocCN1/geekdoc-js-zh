    video/boatride.webm\" type=\"video/webm\">\n  <!-- fallback content here -->\n\
    </video>\n```\n\nThe <video> element includes:\n\n+   - **A controls attribute**,\
    \ which tells the browser to include the default controls for the video. If you\
    \ don't include this attribute, you can create your own controls instead using\
    \ the media elements API.\n- **A poster attribute**, which specifies the location\
    \ of an image to use as a poster to display before the video starts. If not included,\
    \ this defaults to the first frame of the video.\n- **width** and **height** attributes\
    \ to specify the width and height of the video. These work similarly to <img>\
    \ except that if you specify different values to the video's intrinsic values,\
    \ the video doesn't resize; instead, letterboxes.\n\nThe <source> attributes point\
    \ to the video files you want to play. You can instead use a single src attribute\
