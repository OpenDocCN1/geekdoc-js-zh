  md: "# THE BASICS OF ICON IMPLEMENTATION\n\nTo implement icons on a web page, arguably\
    \ the best method is to use CSS background images. Using the <img> tag is workable,\
    \ but not the best way, because icons are not really content; rather, they support\
    \ content, plus <img> elements affect content layout on the page and are more\
    \ fiddly to place where you want.\n\nLet's look at a quick example. You'll find\
    \ the full code for this in the file-icons.html in the chapter6 code download\
    \ folder. You first need to attach the images to the elements you want to appear\
    \ on:\n\n```\nul li:nth-of-type(1) a {\n  background-image: url(icons/home.png);\n\
    }\n```\n\n```\nul li:nth-of-type(2) a {\n  background-image: url(icons/file.png);\n\
    }\n```\n\n```\nul li:nth-of-type(3) a {\n  background-image: url(icons/circle_info.png);\n\
    }\n```\n\n```\nul li:nth-of-type(4) a {\n  background-image: url(icons/pencil.png);\n\
    }\n```"
  merge: -1
  pgno: 232
- img_proc: true
  md: "Figure 6.12 A simple icon implementation (icons are taken from www.freeiconsweb.com/Free-Downloads.asp?id=1729\
    \ and are published under creative commons unported).\n\nA bit more styling is\
    \ needed to finish this off:\n\n```\nli {\n  ...\n  background-image: linear-gradient(top,rgba(0,0,0,0),\n\
    \  rgba(0,0,0,0.4) 70%);\n}\nul {\n  background-repeat: no-repeat;\n  background-position:\
    \ 35% 45%;\n  padding-left: 5%;\n  background-color: #D660CC;\n  behavior: url(PIE.htc);\n\
    }\n```\n\nIn the first rule you're setting a gradient on the actual list item\
    \ to make the styling on the links more flexible. Then in the second rule you\
    \ not repeat, you only want to show it once, and setting a appropriate position\
    \ for the icons, you don't want to display in the default top-left corner. You're\
    \ also setting a bit of left padding to make space for the icon so it doesn't\
    \ clash with the text and setting a solid background color as a fallback for browsers\
    \ that don't support the CSS3 styling features also at work here. Some CSS3PIE\
    \ magic is also included here to provide support for IE6–8 for styling peace of\
    \ mind. Also, note that I've selected Selectivizr to the page to IE6–8 support\
    \ the CSS3 selectors I've used in this example, such as nth-of-type.\n\nFigure\
    \ 6.12 shows the result."
  merge: -1
  pgno: 233
- img_proc: true
  md: "# GENERATED CONTENT FOR ICONS\n\nYou could also implement your icons using\
    \ generated content, like so (see basic-icons-generated-content.html in the chapter6\
    \ code download folder):\n\n```\nul li:nth-of-type(1) a:before {\n  content: url(icons/home.png);\n\
    }\n```\n\n/* Other three icons included in the same way as the first one, but\
    \ omitted here for brevity */\n\n```\na:before {\n  position: relative;\n  right:\
    \ 4%;\n  top: 5px;\n}\n```\n\n```\nul a {\n  padding-left: 1%;\n  background-image:\
    \ linear-gradient(top,rgba(0,0,0,0),rgba(0,0,0,0.4) 70%);\n  background-color:\
    \ #D660CC;\n  behavior: url(PIE.htc);\n}\n```\n\nThis method is also a viable\
    \ option, although generated content is not supported as widely across browsers\
    \ (it won't work in IE6–7). You'll explore using generated content more in the\
    \ \"Web Fonts as Icons\" section."
  merge: -1
  pgno: 234
- img_proc: true
  md: "# CSS SPRITES\n\nThe preceding examples work, but what about implementing multiple\
    \ icons?\nHaving to pull in a separate image file for each icon introduces a whole\
    \ lot of HTTP requests: To make your code more efficient, you can use CSS sprites.\
    \ The idea is that you combine all of your images into a single file, and then\
    \ show the different icons by varying the background-position property. Your code\
    \ will look like this (see basic-icons-css-sprites.html):\n\n```\nul li:nth-of-type(1)\
    \ a {\n  background-image: url(icons/sprite-set.png);\n  background-position:\
    \ 35% 10px;\n}\n```\n\n```\nul li:nth-of-type(2) a {\n  background-image: url(icons/sprite-set.png);\n\
    \  background-position: 35% -40px;\n}\n```\n\n```\nul li:nth-of-type(3) a {\n\
    \  background-image: url(icons/sprite-set.png);\n  background-position: 35% -90px;\n\
    }\n```\n\n```\nul li:nth-of-type(4) a {\n  background-image: url(icons/sprite-set.png);\n\
    \  background-position: 35% -140px;\n}\n```\n\nIn each rule the background-position\
    \ has the same horizontal value but increasing vertical values; each increase\
    \ pushes the image farther and farther upwards, so that you only have to load\
    \ a single file but can display different icons"
  merge: -1
  pgno: 235
- img_proc: true
  md: "FIGURE 6.13 CSS sprites in action.\n\nas you are displaying a different part\
    \ of the image in each case. The result is shown in **Figure 6.13.**\n\n# MAKING\
    \ YOUR ICONS MORE BULLETPROOF\n\nIn the examples you've seen so far, you have\
    \ a solid implementation that works well. The only trouble at this point is that\
    \ if you are using percentages for container widths; the icon can start to look\
    \ misplaced or become too big for the containers when the screen gets narrower.\
    \ To remedy this, you can adopt a few different approaches, either separately\
    \ or in combination:\n\n+   **min-width** to limit the shrinking of the containers\
    \ to an acceptable amount.\n\n+   **Media Queries** to serve up some different\
    \ styling at smaller widths, for example, a smaller version of the image used\
    \ for the icon. You'll learn more about media queries in Chapter 8.\n\n+   **background-size**\
    \ to constrain the icon to a particular size, proportional to the container.\n\
    \nThe solution I considered for my icon set (see basic-icons-background-size.\
    \ html) incorporates a combination of min-width and background-size. Let's go\
    \ through it: You'll first set a min-width on the list:\n\n```\nul {\n  ...\n\
    \  min-width: 750px;\n}\n```"
  merge: -1
  pgno: 236
- img_proc: true
  md: "FIGURE 6.14 Using background-size to scale the icons proportionately to the\
    \ size of the menu buttons.\n\nThen you'll give the anchors a background-size:\n\
    \n```\nul a {\n  ...\n  background-size: 10% 50%;\n}\n```\n\nThe effect is shown\
    \ in Figure 6.14.\nSo, min-width ensures that the menu doesn't get too small and\
    \ break at narrower browser widths. Background-size not only forces all images\
    \ to adopt the same size, but also fixes that size to a percentage of the button\
    \ size, so they will adjust as the buttons smaller. This may or may not be the\
    \ behavior you want; it is useful to know it is available to you.\n\n# MULTIPLE\
    \ BACKGROUND IMAGES FOR MODIFIED ICONS\n\nSometimes you'll use a base icon and\
    \ add extra icons to modify the icon's meaning somewhat. For example, you could\
    \ add a plus sign to a document icon to create a \"New document\" icon or add\
    \ a down arrow to an application icon to mean \"Download update.\" You could do\
    \ this by creating each of these separate icons statically, but that would be\
    \ boring when you have CSS3 at your disposal! Instead, let's include the base\
    \ icon and the modifiers using multiple background images, and then size and place\
    \ them programmatically."
  merge: -1
  pgno: 237
- img_proc: true
  md: "**FIGURE 6.15** Multiple background images used to make additive icons.\n\n\
    The code to achieve this is very similar to what you used earlier, but it just\
    \ requires the use of additional multiple background images to include the modifiers.\
    \ You can see an example of this code in the file modified-icons.html in the chapter\
    \ 6 download folder. The code looks something like this (**Figure 6.15**) shows\
    \ the result:\n\n```\nul li:nth-of-type(1) a {\n  background-image: url(icons/plus.png),\
    \ url(icons/file.png);\n}\n```\n\n> /* Other three icons included in a very similar\
    \ way to the first one, but omitted here for brevity */\n\n```\na {\n  background-repeat:\
    \ no-repeat;\n  background-position: 72px 10px, 50px 10px;\n  background-size:\
    \ 13px 13px, 20px 25px;\n  }\n```\n\nAs you can see, you now have a set of two\
    \ background images for each icon: one for the modifier and one for the base icon.\
    \ Two background-positions and three background-sizes also go along with those\
    \ images."
  merge: -1
  pgno: 238
- img_proc: true
  md: "# WEB FONTS AS ICONS\n\nAnother option available to you is using web fonts\
    \ as icons. Using a single character for the icons and applying a web font to\
    \ them can give you the look you want. It is a good technique in many ways. The\
    \ text character will be infinitely scalable when zooming in, and there is a wide\
    \ variety of Dingbats-style fonts to create suitable icons. The downsides are\
    \ that browsers must support @font-face for their work, font files can be big,\
    \ and actually adding the character(s) into your HTML will pollute your content\
    \ and cause accessibility issues for those using screen readers.\n\nLet's review\
    \ these problems one by one. I've assembled an example for you to dissect in the\
    \ file web-font-icons.html in the chapter 6. To start, you'll find your fonts\
    \ using squirrel for the resources detailed in Chapter 3. I found my fonts at\
    \ www.fontquirrel.com/fonts/list/style/Dingbat.\n\nNext, you'll create the different\
    \ formats you need using the Font Squirrel @Font-Face Generator (www.fontquirrel.com/fontface/generator).\n\
    \nThen you'll import the fonts in your CSS in the usual way using the bulletproof\
    \ font syntax:\n\n```\n@font-face {\n  font-family: 'Heydings';\n  src: url('fonts/heydings_icons.eot');\n\
    \  src: url('fonts/heydings_icons.eot#iefix')\n    format('embedded-opentype'),\n\
    \  url('fonts/heydings_icons.woff') format('woff'),\n  url('fonts/heydings_icons.ttf')\
    \ format('truetype'),\n  url('fonts/heydings_icons.svg#SansensationRegular')\n\
    \    format('svg');\n  font-weight: normal;\n  font-style: normal;\n}\n```"
  merge: -1
  pgno: 239
- img_proc: true
  md: "Rather than using images or hardcoding your text characters into your HTML,\n\
    y'll create them on the fly using generated content:\n\n```\nul :nth-of-type(1)\
    \ a:before {\n  content: \"H\";\n}\nul :nth-of-type(2) a:before {\n  content:\
    \ \"D\";\n}\nul :nth-of-type(3) a:before {\n  content: \"i\";\n}\nul :nth-of-type(4)\
    \ a:before {\n  content: \"w\";\n}\n```\n\nThis avoids the problem of polluting\
    \ your markup with surplus characters.\nHowever, it can be a bit fiddly to work\
    \ out which text character corresponds\nto which icon you want to use. You could\
    \ install the font on your system and then, open a word processor and just type\
    \ out characters until you find them, or\nthe font in an app like Character Map\
    \ or Font Book and pick them out of there.\n\nIt seems that they are mapped to\
    \ intuitive characters in this case—“H\"\nhome, “i” for the information symbol,\
    \ and so on—so hopefully icon font\nauthors will follow suit and start to adhere\
    \ to some kind of ad hoc conventions."
  merge: -1
  pgno: 240
- img_proc: true
  md: "FIGURE 6.16 Icons made with web fonts.\n\nAll that remains to do now is apply\
    \ the font to your generated content and\nposition it appropriately:\n\n```\n\
    ul:before {\n  font-family: Heydings;\n  position: relative;\n  right: 4%;\n \
    \ top: 6px;\n}\n```\n\nBecause you are using fonts, the icons are very easy to\
    \ size, color, and even add\ndrop shadow effects to them. This is awesome!\n\n\
    ```\nul:before {\n  font-family: Heydings;\n  position: relative;\n  right: 4%;\n\
    \  font-size: 1.6em;\n  color: #333;\n  text-shadow: 1px 1px 1px 1px rgba(255,255,255,0.4);\n\
    }\n```\n\nFigure 6.16 shows the effect achieved.\n\n> TIP: To mitigate the issue\
    \ of large font file sizes add-ing significantly to page load, you could reduce\
    \ the font file using FontForge to include only the characters you need.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_241_0.png)"
  merge: -1
  pgno: 241
- img_proc: true
  md: "# HTML data- ATTRIBUTES FOR MORE EFFICIENT CSS\n\nWhen using the web font icon\
    \ solution, you'll need to include a separate ruleset for each icon. A way to\
    \ get around this and lessen the amount of code is to use the new HTML5 data-\
    \ attribute to store your text characters, like this:\n\n```\n<li><a href=\"#\"\
    \ data-icon=\"H\">Home</a>/</li>\n```\n\nYou can put anything you like after the\
    \ data-part, and store whatever you like in these custom attributes. Then you'll\
    \ have your text characters stored in your data-icon attributes; you can put them\
    \ all on the page using only a single CSS ruleset and eliminate the other four\
    \ that were present before:\n\n```\nul:before {\n  content: attr(data-icon);\n\
    \  ...\n}\n```\n\nYou can see my implementation in web-font-icons-data-attributes.html."
  merge: -1
  pgno: 242
- img_proc: true
  md: "# PURE CSS ICONS: PECULIAR?\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_243_0.png)\n\
    \nAs another alternative for implementing icons, I'll mention the idea of creating\
    \ icons from pure CSS. Lucian Marin pioneered this technique and created an icon\
