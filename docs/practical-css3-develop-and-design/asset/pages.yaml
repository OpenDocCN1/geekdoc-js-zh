    \ The book is then rotated in three dimensions using the following:\n\n```\n#wrapper\n\
    transform: perspective(1200px) rotateY(-9deg);\ntransform-style: preserve-3d;\n\
    }\n```\n\nThe pages are then moved into different positions in 3D space using\
    \ the following:\n\n```\n#front {\ntransform: translateZ(5rem);\n}\n```\n\n```\n\
    #p1 {\ntransform: translateZ(0rem); /* Explicitly setting this is\n  -> needed;\
