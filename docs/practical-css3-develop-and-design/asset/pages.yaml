    >\n    <div id=\"front\">\n    </div>\n    <div id=\"back\">\n    </div>\n  </div>\n\
    </div>\n```\n\n**TIP:** Adding the tabindex=\"0\" attribute is an old trick to\
    \ make any element appear in the page's tagging order and therefore be it keyboard\
