  md: '# ROTATEX, ROTATEY, ROTATEZ


    Moving on to 3D rotations, the rotateX, rotateY, and rotateZ properties are a
    bit confusing at first, because they produce quite different results than what
    you might expect. rotateX and rotateY rotate the element they are applied around
    the X and Y axes, respectively, which actually transform them in the Z axis direction!
    rotateZ rotates the element around the Z axis, which produces a similar effect
    to the 2D rotation you saw in the earlier "rotate" section!


    Let''s look at an example to smooth out this confusion: Open the transform-3drotate-x-y-z.html
    file in the chapter 5 code folder. In this file you''ll see three copies of an
    example with a 180 degree rotateX, rotateY, and rotateZ applied to them, respectively.
    I''ve also applied a basic transition to each one; so you hover over the example''s
    #wrapper <div>, each <article> will animate, so you can easily visualize the effects
    of these transforms. The rotation along the X axis looks like this:


    ```

    transform: rotateX(180deg);

    ```


    The Y axis rotation looks like this:


    ```

    transform: rotateY(180deg);

    ```


    The Z axis rotation looks like this:


    ```

    transform: rotateZ(180deg);

    ```


    I''ve not included images here, because it is much easier to see the full effects
    of these examples by viewing the code example in your browser.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'In the transform-3drotate-x-y-z.html example file I''ve applied the :hover:focus
    effects to the parent (e.g. <div>) but not the actual <article>, because some
    browsers (e.g., Firefox) will only continue to register the hover event when the
    mouse is over the actual element transitioned, not the space it originally occupied.


    Therefore, if you set the :hover effect on the actual <article>, it will stop
    as soon as the space taken up by the elements shrinks so that they move off the
    mouse pointer, producing a clumsy jarring effect. This is not a problem in most
    browsers. In Firefox, you should still put the :hover/:focus on the parent element
    wherever.


    This issue is explained better in an example, so try loading the transform-3drotate-bad-hover.html
    in Firefox, and you''ll see what I mean. Of course, this problem may be eliminated
    in the future. If you no longer see the problem, know it''s been fixed!


    # ROTATE3D


    I''ve included rotate3D in a separate section because it works in a different
    manner than the other 3D rotate functions. In the transform-3drotate3D.html file,
    you''ll see three copies of an example with the same rotations applied to them
    in the previous example! The difference is that this time I used rotate3D in each
    case, not rotateX, rotateY, and rotateZ. Let''s look at equivalents:


    +   - transform:rotateX(180deg); is equivalent to rotate3D(1,0,0,180deg);

    - transform:rotateY(180deg); is equivalent to rotate3D(0,1,0,180deg);

    - transform:rotateZ(180deg); is equivalent to rotate3D(0,0,1,180deg);


    So how do this work? Notice that the rotate3D function takes four arguments. The
    fourth one is the number of degrees (or radians) you want the element to rotate
    through. The first three unitless values specify a direction vector for the element
    to rotate around. So, 1,0,0 is one rotation along the X axis, and none in the
    Y or Z directions. So, in the first example, the element rotates around the X
    axis.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_172_0.png)


    **FIGURE 5.9** Visualizing direction vectors.


    Now it''s your turn: Try adjusting the vector values in this example to make the
    elements rotate in all sorts of weird and wonderful directions! For example, using
    a vector of 1,1,1 would cause the element to rotate around a line that travels
    downward at 45 degrees between the X, Y, and Z axes. A vector of 9,3,0 would cause
    the element to rotate around a line traveling down and right 30 degrees between
    the X axis and 60 degrees from the Y axis but not traveling at all in the Z direction.
    You can see visualizations of these values in Figure 5.9.


    Note that the individual numbers in the vector values don''t matter; it is the
    proportions that matter. So, for example, 78,78,78 will result in the same direction
    vector as 1,1,1. You can also use negative vectors to make your direction vector
    travel in the opposite direction. For example, -11,0 makes the element rotate
    around a line that is 45 degrees between the X and Y axes but runs left and up,
    not right and down, as positive values would produce.


    **NOTE:** Be clear on the way the axes travel! As I''ve said before, positive
    X is right; negative X is left. Positive Y is down; negative Y is up. Positive
    Z is out of the screen; negative Z is into the screen.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# SCALE3D, SCALEZ


    The scale3D and scaleZ transform functions don''t do much in real terms; they
    imply the ability to grow elements along the Z axis, for example, increasing their
    height. HTML elements intrinsically don''t have any thickness in this direction—they
    are wafer. In actual fact, scaleZ will act as a multiplier for the translateZ
    function; transform: translateZ(10px) scaleZ(20); would have the same effect as
    transform: translateZ(200px). But you''d be better off using translateZ or translate3D
    instead, as discussed earlier. If you want to give the impression of an element
    increasing in size and/or getting closer to the user, setting a simple 2D scale
    is often best.


    # MATRIX3D


    As discussed earlier in the "matrix" section, matrix transforms are very powerful
    but very complicated and pretty much not within the realms of understanding for
    designers and other nontechies! And 3D matrices are even more complicated: They
    have 16 values for each function, as opposed to six 2D matrices! Therefore, I
    won''t discuss this here (refer to the "matrix" section for links to more information).


    # PERSPECTIVE, TRANSFORM: PERSPECTIVE, AND PERSPECTIVE-ORIGIN


    The transforms you''ve learned so far can be used in a 3D space, but the elements
    exist on a flat plane, as if they all right in front of your eyes. In real life,
    this is not the case. You see objects in different positions around you in different
    perspectives. To simulate this a bit more accurately on the web, you can use the
    transform: perspective(); function, the perspective property, and the perspective-origin
    property to make your elements look more three dimensional, even if they don''t
    have other transforms applied.


    TRANSFORMS 165'
  merge: -1
  pgno: 173
