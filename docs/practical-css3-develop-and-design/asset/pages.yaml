    # ROTATE


    As you might expect, the rotate transform allows you to rotate an element. In
    the transform-2rotate.html file you will find the following line:


    ```

    transform: rotate(15deg);

    ```


    which produces the effect shown in Figure 5.4.


    As you can see from this example, a positive deg (degree) value rotates the element
    clockwise. You can use a negative deg value for counterclockwise rotations. For
    the mathematically minded, you can use radians instead of degrees (e.g., 1rad),
    although this is of limited use, there is no way to accurately represent PI in
    CSS values, which working with radians heavily relies on.


    Try altering the values to see what you get!


    TRANSFORMS 155'
