- img_proc: true
  md: '# STARTING WITH

    SEMANTIC HTML5


    The first part of your toolset for working with CSS3 will be clean, semantic HTML,
    also referred to as POSH (plain old semantic HTML). Not only is it advantageous
    in many ways (e.g., for search engine optimization, more accessible, easier coding
    and maintenance), but it is essential for success when you start applying advanced
    CSS techniques to your content. Trying to work out a system for using advanced
    selectors to style code or using multiple animations in a same fashion is more
    difficult if all you have to play with is horrible, old-fashioned spaghetti code
    (to see an example of horrible spaghetti code, look at the source of pretty much
    any CMS or Wiki page).


    And because one of this book''s goals is to provide a forward-facing approach
    to web design, you''ll use HTML5 for all the markup in this book.


    # WHY USE HTML5?


    Before jumping into HTML5, let''s consider HTML 4 for a minute. You''ll probably
    agree that it is a pretty good job of marking static documents that you can link
    between. This was the job it was originally written for. However, technology never
    stands still, and many developers quite decided that they weren''t happy just
    creating static documents. They wanted to start creating more dynamic sites that
    behaved like applications, and for such tasks, HTML 4 was missing a lot of native
    functionality. To implement video, animated graphics, and complicated form controls,
    developers turned to proprietary technologies like Flash, or complicated, inefficient
    kludges of HTML, CSS, and JavaScript if they wanted to create such functionality
    with open standards.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Originally termed "HTML" (dynamic HTML), such kludges have more recently handled
    in better ways using JavaScript libraries and the like. But the fact still remains
    that they are kludges for the following reasons:


    +   - No better semantic elements are available to use for implementing features
    like video and complex form controls. The markup for such things tends to consist
    of unsemantic nested <div>s and so forth. There is therefore no way for screen
    readers, engines, or other automated user agents to work out what these constructs
    are supposed to be (although WAI-ARIA can help mitigate problems), which is for
    SEO and accessibility.

    - Such implementations tend to add a significant amount of weight to the page.

    - These kludges used to create very common use cases: It seems ridiculous for
    you to have to resort to hacks and overcomplicated implementations to implement
    them.


    HTML5 comes to the rescue in these regards while maintaining backward compatibility.
    It includes all of the features already available in HTML 4, plus it defines previously
    missing details and adds several new features into the mix for creating applications,
    as as:


    +   - New semantic elements for defining page regions, such as headers, footers,
    primary navigation, distinct articles of content, figures, and so on.

    - <canvas> and its associated API for creating complex scripted graphics, like
    animations.

    - <audio>, <video>, and associated APIs for working with AV content.

    - Mechanisms for allowing applications to work offline.

    - Error handling to define what should happen when badly formed markup is used
    (missing closing tags, etc.)'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# HTML5 ERROR HANDLING


    Prior to HTML5, error handling was never defined in the specs, leaving browser
    vendors to decide how to handle markup errors. This has led to inconsistent error-handling
    implementations and different page rendering across browsers when errors are present.
    Now that more browsers are starting to get HTML5 parsers with consistent error
    handling as defined in the spec, lot of cross-browser compatibility issues should
    go away.


    It is really cool to have functionality like embedded video with native HTML rather
    than having to resort to Flash for a number of reasons:


    +   HTML plays nicely with other open standards, you can style your video or other
    features with CSS or directly enhance their functionality with JavaScript. With
    Flash, you''d have to access and open the .fla file and update the code directly,
    because it doesn''t communicate well with open standards. A Flash movie is just
    a black box as far as the browser is concerned: It doesn''t understand the individual
    components inside the movie.


    +   An open standards solution is more accessible, generally speaking, and for
    SEO. Text inside Flash can''t be read by many screen readers and search engine
    robots. Flash video players aren''t readily keyboard accessible, whereas keyboard
    accessibility is available out of the box with HTML5 <video>, at least in Opera,
    Firefox with JavaScript enabled, and IE (Safari and Chrome have some catching
    up to do).


    +   Having to download a Flash plug-in before you start using content is no big
    deal for tech-savvy geeks, but it can present a user-experience hurdle for someone
    like my grandmother.


    In addition, some of the important HTML5 features have good support across modern
    browsers, and you can provide alternatives and fallbacks for browsers in many
    cases. Therefore, much of HTML5 is usable now in real-world projects. What''s
    good enough for youtube.com is good enough for you, right? You''ll look at HTML5
    features in more detail later in the chapter.'
  merge: -1
  pgno: 48
- img_proc: true
  md: "# BUILDING A TEMPLATE\n\nAt this point, let's start building a simple template\
    \ that you can use to build your CSS3 examples in. Start creating a blank HTML\
    \ file (you can see the finished template in the example file template.html in\
    \ the chapter2 code download folder).\n\n# HTML5 DOCTYPE\n\nThe first line you\
    \ need to add, as always, is the DOCTYPE. The HTML5 DOCTYPE is a shorter proposition\
    \ than you'll traditionally be to use in HTML 4.01 and earlier. Get ready for\
    \ it, wait, go!\n\n```\n<!DOCTYPE html>\n```\n\n> Well, that was easy, wasn't\
    \ it? As you know, traditionally DOCTYPEs have long rambling strings containing\
    \ URLs, Klingen words, and other unmemorables. For example, look at the HTML 4\
    \ Strict DOCTYPE:\n\n```\n<!DOCTYPE HTML PUBLIC \"//WC//DTD HTML 4.01//EN\"\n\
    -> \"http://www.w3.org/TR/html4/strict.dtd>\n```\n\nWhy was it like this? Well,\
    \ as far as I know the W3C had various ideas about what DOCTYPE might empower\
    \ you and the browser to do. In the end all DOCTYPEs really did put to browsers\
    \ in standards mode when rendering a page of markup. The writers of HTML5 recognized\
    \ this and decided to whittle down the DOCTYPE to the shortest valid string of\
    \ characters that would put browsers in standards mode.\n\n# LANGUAGE AND BASIC\
    \ DOCUMENT OUTLINE\n\nNext, you'll add the basic document outline below the DOCTYPE:\n\
    \n```\n<html lang=\"en-gb\">\n<head>\n  <title>HTML5 template</title>\n</head>\n\
    <body>\n  ...\n</body>\n</html>\n```"
  merge: -1
  pgno: 49
- img_proc: true
  md: 'This should look familiar, although I want to draw your attention to the lang
    attribute on the <html> element. It is good practice to set an overall language
    for the entire document like this for accessibility purposes: Screen readers will
    handle various languages differently. For example, "six" is pronounced "six" in
    English and "sees" in French.


    You can also set the language of individual parts of the document by putting the
    lang attribute on any element that makes sense to do so. For example:


    ```

    <As the French say, <span lang="fr">c''est la vie</span></p>

    ```


    Notice the two parts to the first language you say: en-gb. The first part is called
    the primary language code, which unsurprisingly sets the overall language. You
    can find a full list of over 8000 of these codes in the IANA Language Subtag Registry
    at www.iana.org/assignments/language-subtag-registry. The optional part sets a
    dialect of the primary language. So, for example:


    +   - en-gb is British English


    +   - en-us is American English


    +   - en-ca is Canadian English


    You can set your own experimental languages using the x experimental primary code:


    ```

    <html lang="x-millsian-nonsense"></html>

    ```


    # DEFINING YOUR DOCUMENT’S CHARACTER SET


    You should also set a character set for your document, which specifies the range
    of text characters that can be used in your document: This has become much simpler
    in HTML5. Previously, the line you needed to use something like this:


    ```

    <meta http-equiv="content-type" content="text/html; charset="UTF-8" />

    ```


    In HTML5 this line has been reduced to the following, which older browsers will
    also understand: Add it just opening the <head> tag:


    ```

    <meta charset="utf-8">

    ```'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'All you are interested in the character set; hence, the HTML5 spec has been
    written to allow this version. You don''t need to specify that this is a content-type,
    and you don''t need to specify the mime-type if you are working with HTML5.


    NOTE: MIME-types specify what type of content file is for the benefit of browsers
    trying to understand what content they are dealing with: in this case, text/html
    for HTML.


    You just have specified UTF-8, a universal character set that allows all characters
    from all languages, or just about. It is best to stick to this character unless
    you have a very good reason not to.


    # XHTML AND CODING STYLES


    In the HTML5 era there are no separate XHTML and HTML DOCTypes. You just use the
    same DOCTYPE, and then you can really stick to whatever coding style suits you,
    be strict XML style or loose HTML style. It is possible to use XHTML-style syntax
    in HTML5 (called XHTML), as long as you use the correct mime-type, file extension,
    and so on. However this creates compatibility problems with older versions of
    Internet Explorer (IE), so I wouldn''t recommend using it.


    In terms of coding style for the book, I''ll use a style first customised in mind
    by fellow web education and awesome Swede, Lars Gunter. He recommends the following
    guidelines:


    +   - You''ll be sticking to some XHTML rules. You''ll be closing all elements
    using lowercase for all elements and attributes, and including quotes around most
    attribute values.


    +   - You don''t need to write out attribute values in full for attributes whose
    values are the same as the attribute name—example <input type="text" required>,
    not <input type="text" required="required">.


    +   - You don''t need to include trailing slashes to close empty elements, so
    you''ll use the format <meta charset="utf-8"> not <meta charset="utf-8" />.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: "# ADDING CROSS-BROWSER SUPPORT FOR\nHTML5 SEMANTIC ELEMENTS\n\nNow you need\
    \ to add some little helpers to be able to style unknown elements. Why? Older\
    \ browsers do not support the HTML5 semantic elements discussed later in the “Exploring\
    \ HTML5 Elements” section.\n\nThis problem will diminish as time goes on, but\
    \ for now you can add in support without too much trouble. To do this, you need\
    \ to think about how browsers handle unknown elements.\n\nBy default, an unknown\
    \ element is treated as an anonymous inline element. <section> and <footer>. You\
    \ could even stick <span>banana&gt;</span> and &lt;porcupine&gt; elements in your\
    \ page if you had a reason to do so.\n\nThe trouble is that the new HTML5 elements\
    \ you'll be using are block-level elements. They are mostly semantic containers\
    \ to replace the slew of <div> you've traditionally used to contain different\
    \ parts of your pages. Therefore, you need to force nonsupporting browsers to\
    \ treat them how you want. To do so, add the following inside your <head>:\n\n\
    ```\n<style>\n  article, aside, audio, canvas, datalist, details, figcaption,\n\
    \  figure, footer, header, hgroup, menu, nav, section, video {\n    display: block;\n\
    \  }\n</style>\n```\n\n> Note: Because the HTML5 spec is still not complete, it\
    \ may change to include or remove various elements; therefore, the HTML5 element\
    \ fix may well need to be updated to remove elements or include additional ones\
    \ in the future."
  merge: -1
  pgno: 52
- img_proc: true
  md: 'This ensures that IE browsers basically do what you want with your CSS—well,
    except for IE IE versions 6–8 need more help, because they won''t style unknown
    elements at all! For IE versions 6–8 to recognize unknown elements, you need to
    create an instance of each unknown element in the DOM. Something like this will
    do:


    ```

    <script>

    document.createElement(''abbr'');

    document.createElement(''article'');

    document.createElement(''aside'');

    document.createElement(''audio'');

    document.createElement(''mark'');

    // add more elements as required

    </script>

    ```


    Note here that you''re not dealing with block-level HTML5 elements, but are also
    dealing with inline HTML5 elements like <mark> and HTML 4 elements that simply
    aren''t supported in older versions of IE, such as <abbr>.

    If you need to add list of these elements, there is a better way to deal with
    your script. Replace the preceding script block with the following:


    ```

    <!--if lt IE 9>

    <script src="http://html5shiv.google.com/svn/trunk/html5.js"></script>

    <![endif]-->

    ```


    This applies the "HTML5 shiv to your code, which is a script written by the diminutively
    stated but hugehearted Remy Sharp and hosted at Google Code. It does the work
    of all the JavaScript described earlier, and more. Because it is hosted at Google
    Code, you just have to link to it: You don''t need to understand the contents
    or worry about hosting it yourself and upgrading to the latest version when it
    is updated.'
