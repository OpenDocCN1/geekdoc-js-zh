- img_proc: true
  md: 'Before starting any creative work with CSS3, you should build up a rock-solid
    markup template to structure your data in and provide mechanisms to allow your
    content and layout to work in older browsers to an acceptable degree. Recall the
    discussion of progressive enhancement in the previous chapter.


    Your resulting toolset will be akin to a cockroach—the sort of creature that could
    survive an ice age or a nuclear war.


    In the interests of adopting efficient modern markup and future proofing your
    work, HTML5 should be your markup language of choice. In this chapter you''ll
    explore the main features of HTML5 to ensure that you are up to speed. You''ll
    also learn about the different mechanisms you''ll use for enabling HTML5 and CSS3
    support across older browsers.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_45_0.png)'
  merge: -1
