    # SPECIFYING HOW THE COLUMNS ARE FILLED WITH CONTENT


    Another property you can specify, column-fill, can take two properties and balance.
    auto is the default, which just makes the columns fill up to right and down to
    a certain length. This can cause an uneven result, as shown on the left in Figure
    7.4. The better option is balance, which fills in the content as equally as possible
    across the columns, leaving uneasy gaps, as shown on the right in Figure 7.4.


    ```

    section {

    column-width: 20rem;

    column rule: 3px solid #8B2101;

    column-gap: 2rem;

    height: 85rem;

    column-fill: balance;

    }

    ```'
