- img_proc: true
  md: 'One of the biggest challenges faced by web developers and designers today is
    optimizing websites so that they look and perform well across a wide range of
    devices that differ significantly in screen size, processing power, and so on.
    You no longer just have to think about different browsers on a desktop or laptop.
    You now have to consider mobile phones (both modern smartphones and older feature
    phones), tablets, web-enabled TVs, and other devices.


    This may sound like a nightmare, and with more web-enabled devices no doubt appearing
    every year, you might think it''ll get worse. How on earth do you provide a good
    web experience across all these devices?


    In this chapter I''ll discuss high-level strategies and implementation options
    available for combatting such problems.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_291_0.png)'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# A BRIEF HISTORY OF

    WEB BROWSERS


    When the web was first introduced in the early to mid-90s, it was basically view-able
    using web browser software installed on personal computers (first desktops, and
    slightly later, laptops). These computers had monitors with resolutions of 640
    x 480 pixels, 800 x 600 pixels, and later on, 1024 x 768 pixels. This didn''t
    really change until the middle of the 2000s when mobile phones became powerful
    enough to run web browsers (OK, before that was a lame standard called WAP, but
    I won''t bother discussing it here; you can look it up if you are interested).

    Fast forward a few more years and a huge variety of devices are now capable of
    browsing the web:


    +   * Modern smart phones do a great job of rendering websites, for example, iPhones,
    Android-based devices, BlackBerry and Nokia phones running Opera Mobile, Mobile
    Chrome, Fennec, and other browsers.

    * Several varieties of tablets are available too, mainly iPads and a slew of Android-based
    devices, again running similar browsers to those described previously with larger
    screens.

    * TVs are increasingly becoming web-enabled: You can view the web on TVs (from
    companies like Sony, Samsung, Ikea) with built-in browsers and on games consoles
    run through TVs (like the Nintendo Wii and the PlayStation 3).

    * Portable game consoles like the Nintendo 3DS and Sony Vita all have web browsers
    as well.

    * Many people in the world still browse the web using feature phones that don''t
    have very good web browsers installed or use a proxy browser, such as Opera Mini
    to gain access to web content (see the "Opera Mini" sidebar).'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# OPERA MINI


    Opera Mini is a proxy-based browser that doesn''t work like a normal web browser.
    Usually, you install a browser on your device that has full rendering capabilities.
    When a web page is browsed to, the code, images, and other assets that make up
    that web page are downloaded to your device and interpreted and assembled into
    a web page by the browser for you to interact with. But Opera Mini does not have
    full rendering capabilities; it is merely a thin client that can display a static
    format similar to PDF called OBML (Opera Binary Markup Language). The web-page
    code and assets, when requested, are actually downloaded to a server to be assembled
    into the web page and compressed into this OBML format.


    The OBML page is then sent to the device to be displayed. This system has big
    advantages: First, OBML is a static, compressed size of the pages you are viewing
    can be reduced by up to 90 percent using this system, meaning much smaller downloads,
    which is great for those on slow networks and those paying for web access by the
    kilobyte. Second, rendering is done on the server, the Mini client is very small
    and simple; therefore, it can run on low-powered phones—pretty much anything with
    a JVM (Java Virtual Machine).


    Opera Mini has its disadvantages too. Rendering will not look as nice, because
    many styling features, such as box shadows and web fonts, are turned off to save
    bandwidth and processing power requirements. In addition, OBML just provides a
    static snapshot of the page you are viewing at the time it was rendered; therefore,
    animated content (CSS animations, JavaScript-animations, Flash, or even animated
    GIFs) won''t work, and background script operations, such as Ajax updates, won''t
    work either. This means that web applications that rely on heavy scripting may
    not perform well, depending on whether the developer responsible tested in Opera
    Mini and used progressive enhancement to still provide a working experience without
    JavaScript.


    But most websites work well on Opera Mini. The point is not to provide a perfect
    browsing experience, but to provide a fast, usable browsing experience that works
    on any device. It is worth installing Opera Mini on a high-powered device, such
    as an iPhone. If you are stuck on a slow, mobile phone network and desperately
    need to use the web, Opera Mini can be very useful.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# RESPONSIVE DESIGN STRATEGIES


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_294_0.png)


    **FIGURE 8.1** Graceful degradation of CSS3 bling in Opera 12 desktop (left) and
    in Opera Mini 6 (right).


    Broadly speaking, there are three main strategies for optimizing web content across
    different devices. Let''s look at each one in detail.


    # DO NOTHING SPECIAL


    Do nothing special sounds great, huh? The truth is that as long as you create
    content using open standards and best practices, as detailed in this book and
    other decent learning resources, your content will probably be accessible across
    most devices. The web is responsive; your content will cover 100 percent of the
    browser window width unless you tell it to. And if you use floats to arrange repeated
    content blocks in rows and size in percentages rather than absolute measurements,
    your layout will have some degree of flexibility as browser windows become narrower.


    In addition, many HTML5 and CSS3 features will degrade gracefully in nonsupporting
    browsers. As you can see in our CSS bling example in Opera 12 (**Figure 8.1**,
    left) and in Opera Mini 6 (figure, right), many of the bling effects don''t work
    in Opera Mini, but the content is still readable.


    > NOTE: The Opera Mini screen shot shown in Figure 8.1 is actually taken from
    the Opera Mini simulator, which is available at www.opera.com/developer/tools/mini.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_295_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_295_1.png)


    Mobile devices tend to display a zoomed-out version of web pages and provide zoom
    features to enable you to see different parts of the content more closely (Figure
    8.2).


    # SERVE DIFFERENT SITES TO DIFFERENT DEVICES


    So doing anything can make your content accessible on most browsers, but often
    you''ll want more control over how your content looks on different devices, and
    your client will want a more tailored approach. How many times has your client
    or boss said, "I want an awesome iPad app?" Also various browsing contexts often
    call for different content. Mobile phone users frequently want to just browse
    a website to quickly find times, look up a map, or play a little throwaway game
    because they are bored. They don''t want to see pages of staff bios or a giant
    mobile featuring your company''s CEO explaining your company history.


    It is therefore good idea to, for example, serve mobile users a different set
    of content by default—a mobile version of the site that contains the most important
    features a user might want to use on the move. Traditionally, this is done by
    detecting what user agent string a browser has and redirecting the browser to
    a mobile version of the website, perhaps at mysite.mobile instead of mysite.com.


    FIGURE 8.2 Most phone browsers have zoom functionality, as illustrated here in
    the Opera Mobile Emulator for desktop (available at www.opera.com/developer/tools/).'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'Although this might seem like a good idea, it is fraught with problems and
    you must be careful. First, you''ll have to publish and maintain two or more versions
    of your site (desktop version, mobile version, iPad app, TV app, etc.), which
    adds more time and cost to the project.


    Second, browser sniffing is error prone and shortsighted. If you are just detecting
    the iPad, for example, because you have a specific iPad app, it might not be so
    bad. But it usually makes sense to serve agent strings to develop sites that work
    across all devices, not just one. Also, user agent strings are deliberately ambiguous,
    because back in the early days of the web, developers used user agent sniffing
    to arbitrarily target browsers they wanted to support, leaving other browsers
    locked out, even if they could render those sites perfectly well. To get access
    to these sites, browsers started aping other vendors'' user agent strings, so
    you''d end up with user agents like this:


    ```

    Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US) AppleWebKit/525.13 -> (KHTMLHTML,
    like Gecko) Chrome/0.2.149.27 Safari/525.13

    ```


    And if your code is serving the right content to right browsers now, it may not
    in the future when new browsers come out that have different user agent strings.
    You''ll have to keep updating your code to take these new browsers into account!
    An example, when Opera hit 10, the user agent string was changed to include a
    version of 9.81, so many developers were using browser sniffing code that returned
    Opera 10+ as Opera 1, blocking browsers from accessing sites that would render
    them fine. Clarity ensured. Really.


    It is much more effective and less error prone to test whether browsers support
    the features you need, as you''ve been doing with Modernizr, rather than testing
    whether the browser is one of the ones you will support your code.


    > TIP: You should always provide a link to switch between site versions too, in
    case a mobile user wants to use the desktop version of the site instead. Users
    have having their choices taken!


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_296_0.png)'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# TERMINOLOGY CONFUSION!


    You were probably wowed when you first read the delicious buzzword-laden title
    of this chapter. I included both "responsive design" and "adaptive design" because
    you''ll probably hear these two terms and vari-ous word combinations to describe
    the techniques this chapter covers in your travels around the interwebs.


    In fact, I was confused about when to use which term. So, after a bit of research
    on the subject, the best distinction between "adaptive" and "responsive" that
    I came up is as follows:


    +   - Responsive design refers to the use of technologies like media queries and
    flexible units to create flex-ible web page layouts that are optimized to suit
    different-sized viewports.


    +   - Adaptive design is pretty much another term for "progressive enhancement,"
    which of course was defined in Chapter 1, and examples have been shown throughout
    the book. Adaptive design refers to any design that allows a website to adapt
    and provide an acceptable experience in browsers of different abilities. You could
    think of responsive design as a subset of adaptive design.


    You''ll also hear the term "mobile web" quite a lot, especially from manager types;
    it''s used to describe the web created for mobile devices, or some such thing.
    I recommend that you stay away from this term as much as possible.


    Designer and all-round "good bloke" Stephen Hay summed it up nicely when he said:
    "There is no mobile web. There is only the web, which we view in different ways.
    There is no desktop web. Or tablet web. Thank you.


    Creating different sites for different devices is not really the right way to
    think about accessing web content; you should strive to optimize the same content
    for different devices.


    A better way to think about "mobile" is a state of being rather than a device.
    When users are mobile, they are more likely to be using various devices to browse
    the web, have less bandwidth available, and inter-ested in different information
    and functionality. This leads to a separate set of requirements for people who
    are stationary and those who are on the move. Therefore, different versions of
    your site will require differ-ent UX work.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# OPTIMIZE ONE SITE FOR DIFFERENT BROWSERS/DEVICES


    The third method for optimizing web content across devices generally involves
    using responsive/adaptive design techniques to create a single set of content
    that will automatically change depending on features of the browser accessing
    it, such as screen width and height, resolution, and more.


    Usually these techniques involve:


    +   - **Feature detection** to see if a feature will work in a browser and serving
    fallback content if it doesn''t (e.g., using Modernizr).

    - **Using flexible layout techniques**, such as CSS multi-col and percentages
    for container widths, so that layouts we breathe and still look good on smaller
    screens and browser windows.

    - **Serving smaller images**, videos, and other media to smaller screen devices
    that don''t need the bigger versions and could really benefit from being saved
    some bandwidth.

    - **Using smart layout optimization** technologies, such as CSS media queries
    and viewport, to change how content is displayed on screen width, resolution,
    orientation, and other features of the browsing device.


    Support for the nu-school features discussed in this chapter is summarized in
    **Table 8.1.**'
  merge: -1
