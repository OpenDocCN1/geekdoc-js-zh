  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_71_0.png)


    This code creates a blank bitmap image, which you can draw on and manipulate using
    the Canvas API. The magic comes when you target the canvas using JavaScript via
    its ID:


    ```

    var c = document.getElementById(''canvas'');

    ```


    You then get the drawing context of the canvas—in this case a two-dimensional
    image—using the following line (you can also draw 3D images in <canvas> using
    WebGL);


    ```

    var context = c.getContext(''2d'');

    ```


    You can then start using properties of the context you''ve created to draw onto
    the canvas. For example:


    ```

    context.fillStyle = "rgb(0,0,200)";

    context.fillRect(100, 50, 100, 150);

    ```


    Here you select a blue color and draw a filled rectangle of color that is 100px
    by 50px at coordinates (100,150) on the canvas. The top-left corner of the canvas
    (0,0) is the origin Figure 2.10.


    > Canvas has many primitives available, such as full-text drawing capabilities
    and the ability to import images and video, among others. Covering more of these
    primitives is beyond the scope of this book. For more <canvas> tutorials, hop
    over to Mozilla''s "Canvas tutorial" page (https://developer.mozilla.org/en/Canvas_tutorial).
    For more on WebGL, a good place to start is Luz Caballero''s "An introduction
    to WebGL" (http://dev.opera.com/articles/view/an-introduction-to-webgl).'
