  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_103_0.png)


    **Figure 3.16** Compare the words on the left to those on the right.


    #  Ligatures

    It is common in typography to join the strokes of certain sequences of characters
    to make them more legible and pleasing to the eye. **Figure 3.16** shows some
    examples.

    These are called ligatures, and decent font files will contain separate glyphs
    to handle them. When a specific sequence of characters is found, such as "ffi,"
    the separate glyphs of the letters are replaced with the special glyphs containing
    the ligatures. In CSS this can be controlled using the text-rendering property
    (which was actually first defined in SVG—see www.w3.org/TR/SVG11/painting.html#TextRenderingProperty):

    text-rendering: optimizelig

    This turns on ligatures, which are very attractive but require a bit of extra
    processing power to render. Keep this in mind if you are desperate to tweak performance
    as much as possible.

    In terms of browser support, you''ll be able to see the ligatures in Safari 5.1+,
    Firefox 4.0+ (uses ligatures automatically anyway, regardless of this property),
    IE10+, and Chrome 13.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'FIGURE 3.17 Words rendered without ligatures (left) and with (right).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_104_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_104_1.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_104_2.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_104_3.png)


    **Figure 3.17** shows further examples. You can also see them http://people.opera.com/cssjbook/fontdeck_example.html.


    One detail to note is that the point of the text-rendering property is not just
    to control ligatures, but to dictate how special font features are rendered in
    the interests of legibility versus speed geometric precision. The intended values
    for text-rendering include:


    +   **optimizeLegibility.** Legibility is favored over speed and geometric precision.
    Ligatures and other font hints will be turned on.


    +   **optimizeSpeed.** Speed is favored most. Generally, ligatures and other font
    hints will be turned off. This has no effect in Firefox to do it using ligatures
    automatically.


    +   **geometricPrecision.** Geometric precision will be favored most. Ligatures
    and other font hints will be turned on, depending on what produces the best shape
    forms.


    +   **auto.** The browser makes the rendering decision, depending on the current
    rendering context (e.g., What device am I on? What processing power do I have
    available?).'
