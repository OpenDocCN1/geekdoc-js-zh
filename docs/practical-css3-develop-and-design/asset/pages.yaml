  md: "# OTHER MEDIA STYLING TIPS\n\nNative video is really rather nice because you\
    \ can style it in any way you want using CSS, and even create cool effects with\
    \ media using SVG and <canvas>. For example, a simple effect I've used in this\
    \ example is to hide the controls using opacity when you're not hovering over\
    \ the media:\n\n```\n#controls {\n  opacity: 0.5;\n  transition: is all;\n}\n\
    ```\n\nand then only reveal them in their full glory when you do hover over the\
    \ media:\n\n```\n#player:hover #controls, player:focus #controls {\n  opacity:\
    \ 1;\n}\n```\n\nYou could get a bit crazy with transforms and transitions if you\
    \ wanted to, but I'd advise against it. Animating video is so processor intensive\
    \ that it's best to avoid. Another tip concerns styling Flash fallbacks. You pretty\
    \ much can't. And even if you want to do something simple like making sure a <video>\
    \ is centered in its parent column, you need to include a wrapper <div> around\
    \ the video, and then for example:\n\n```\n#wrapper {\n  margin: 0 auto;\n}\n\
    ```"
