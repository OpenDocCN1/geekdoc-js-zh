- img_proc: true
  md: 'Icons are an essential part of creating web interfaces as familiar signposts,
    badges of honor, or notifications. They can draw attention to important parts
    of the page quickly, use less space than words, and can transcend languages. CSS3
    offers some useful new tricks to the icon arena; hence, this chapter on icons.
    After the comparatively heavy learning curve presented by CSS Animations in Chapter
    5, you can relax a bit here.


    In this chapter you''ll learn some slick ways to implement icons on a web page
    employing cutting-edge CSS and HTML features, such as multiple background images,
    web fonts, and data-attributes.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_227_0.png)'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# ICONS ROCK!


    FIGURE 6.1 Aren''t glad that conventions such as these exist the world over! Image
    courtesy of http://thenounproject.com/noun/unisex/#icon-NoSo.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_228_0.png)


    You''ll find icons everywhere, helping you find your way and get additional information
    about people, objects, services, and so on. Often, they are invisible and are
    used almost unconsciously due to the familiarity everyone has with recognized
    conventions, such as on/off switches, play and pause buttons, airports and train
    stations, and toilets (Figure 6.1) If you think carefully about icons, you''ll
    find that you use them more than you realize.


    Since the dawn of man, icons have been used for communication. cave dwellers painted
    on their caves to record details of meetings and food. And the most recent examples
    of Egyptian hieroglyphs and Chinese symbols most definitely fall under the moniker
    of icons.


    NOTE: I became interested in icons after serving as editor on fellow English gent
    Jon Hicks''s marvelous book, The Icon Design Handbook (Five Simple Steps, 2012).

    in fact, this chapter is influenced heavily by Jon''s wonderful work. I highly
    recommend that everyone purchase his book because it is a real joy to read and
    provides more in-depth information than I''ve assembled in this short account.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# USING ICONS ON WEBSITES


    Similarly to the real world, icons can fill many roles on websites or in applications.
    Most commonly, they act as signposts, giving users hints on how to get where to
    go and what they want to do. Icons can impart these hints quicker and more intuitively
    than textual descriptions, often due to the fact that they follow established
    conventions, which can break through the language barrier: Mail, home, and shopping
    basket icons are classic examples (Figure 6.2).


    If you need to use an icon to represent where no convention already exists, you
    need to choose an image that is as recognizable as possible, easy to depict in
    different sizes, and attractive enough to draw in the user. Web icons are typically
    monochrome with transparent backgrounds so they can be overlaid nearly on top
    of different backgrounds.


    Icons are loosely grouped into three different types:


    +   **Pictograms.** These icons convey a location or idea through a physical object,
    for example, a video record to represent "music" or a car to represent "car insurance"
    (Figure 6.3).


    +   **Ideograms.** More general than a pictogram, these icons represent ideas
    or actions, such as "search" or "write a comment" (Figure 6.4). Generally, (but
    not always) they will be intuitive to a certain degree of users'' familiarity
    with the real-world objects.


    +   **Arbitrary.** These icons are more abstract constructions that generally
    don''t directly relate to real-life objects or concepts. Because they are not
    world objects, they must be learned from scratch and are not immediately intuitive.
    Figure 6.5 provides a good example: This icon was set for the W3C as part of its
    effort to bring HTML5 and other cutting-edge technologies to raise interest and
    awareness (see www.w3.org/html/).


    I won''t go into a amount of detail on how to choose and draw icons in this chapter,
    but for those of you interested in finding ideas and inspiration, a Google images
    search always brings up many, and you can find a high number of free icons at
    thenounproject.com. The images in this section have been taken from the awesome
    dingbat set Modern Pictograms and Heydings Common Icons, available on Font Squirrel.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_229_0.png)


    FIGURE 6.2 Familiar web icons: mail, home, shopping basket.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_229_1.png)


    FIGURE 6.3 Pictogram examples.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_229_2.png)


    FIGURE 6.4 Ideogram examples.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_229_3.png)


    FIGURE 6.5 Arbitrary icons from the W3C''s HTML5 branding (released under creative
    commons license CC-BY).'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# WHEN USE ICONS


    FIGURE 6.6 Icons in a menu.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_230_0.png)


    FIGURE 6.7 Intuitive function-

    ality icons: play and zoom in.


    Icons are a great addition when used in the right contexts, and you should give
    this

    some careful thought when considering them. If they solve a problem along the

    lines of allowing icons to find what they want or where they want to go faster
    and

    consume less space, you have a good case for using an icon.

    But if you are just using icons everywhere with abandon, their effectiveness

    is greatly diminished, and you end up with a horrible Christmas-tree effect!

    Places to consider using icons include:


    | Online |

    | Away |

    | Do not disturb |

    | Invisible |

    | Offline |


    +   - **Navigation.** Icons can make great signposts to help direct users to where

    they want to go. For example, you''ll learn how to build the example

    in **Figure 6.6** in the next section "The Basics of Icon Implementation."

    - **Functionality.** Intuitive icons allow users to find functionality easily,
    for

    playing a video or zooming in (**Figure 6.7**).

    - **Status.** You only need to look at programs like Skype and messenger appli-

    c for good icon usage, for example, "I''m here," "I''m away," "I''m asleep.\ See
    **Figure 6.8** for some examples.

    - **Comparison.** Using icons to compare product features is a good way to give

    users-at-glance summaries (**Figure 6.9**).

    - **User feedback.** Form icons are the classic example for user feedback

    (**Figure 6.10**): "The format is incorrect," "Missing information," and so on.

    - **Emotion.** People use emoticons more and more in communications

    these days—in text messages, email, chat applications, IRC, and so forth

    (**Figure 6.11**).


    FIGURE 6.8 User status icons

    (taken from Skype).


    222 CHAPTER 6 USING CSS TO IMPLEMENT ICONS'
