    Negation selector input:not([type="submit"]) Styles the specified element if it
    isn''t selected by the simple selector(s) inside the parentheses. This is useful
    in cases where you have several similar elements and want to select them except
    for one of two. For example, when laying out a form you''ll want to give most
    of the inputs an equal width but not the submit or file inputs. You can include
    multiple selectors to negate inside-the comma-delimited list—for example, input:not([type="submit"],[type="file"]).
    Not IE8 or earlier.


    Language selector p:lang(en-US) Styles the specified element only if it has the
    language inside the parentheses set on it via the lang attribute. Not IE6 or earlier.


    Target selector article:target Styles the element only if it has the target of
    a link. It''s incredibly cool for making content appear at the click of a button,
    such as overlays, information boxes, or different tabs in a tabbed interface,
    without needing JavaScript. The main problem is that each state will be at a different
    URL, so it can break the expected Back button functionality. IE8 or earlier.'
