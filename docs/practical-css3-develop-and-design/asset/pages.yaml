    people.opera.com/cmil... C Google


    > FIGURE 8.11 This isn''t what was expected! Why aren''t the narrow-screen media
    queries being applied on mobile browsers?


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_319_0.png)


    +   VIDEO REEL

    Walking is a song by The Pet Shop Boys released in 1986 and covered by various
    bands including Radiohead in 1995. it

    * People are the same

    * West End Girls

    * Heart of- City

    * Release Me

    * Walking with my eyes closed you


    There is more to optimizing content for mobile devices using media queries than
    you might first think. If you view one of the media query examples you''ve seen
    so far in this chapter on a mobile phone, you''ll see the surprising result shown
    in Figure 8.11.


    NOTE: You might also get slightly odd positioning or other behavior of the video
    depending on the mobile device viewing the content, because some mobile browsers
    will play the video inside the browser, whereas others hand off the video playing
    to the device''s native player.


    The problem here is that mobile browsers lie. When a mobile browser renders the
    average site, it doesn''t render it at the actual browser width and display it
    as is. Instead, it renders the site at a higher assumed width—Opera Mobile, for
    example, uses 850px(and sometimes goes wider, depending on how wide the page being
    rendered is)—and shrinks the result to fit on the mobile screen.'
  merge: -1
  pgno: 319
- img_proc: true
  md: "You can understand why browser creators would do this. Historically, most sites\
    \ are not created with responsive techniques in mind; therefore, they would look\
    \ crappy if rendered at widths of 480px, 320px, or less. But in this responsive\
    \ world, you should override this behavior so that media queries behave like you\
    \ want them.\n\nYou could do this by changing your width/height media queries\
    \ to always test for the equivalent device-width/device-height as well. For example:\n\
    \n```\n@media all and (max-width: 800px), @media all and\n  (max-device-width:\
    \ 800px) {\n\n}\n```\n\n...\n\n\n\n}\n\nBut having to do this for every @media\
    \ block means a lot of extra typing and so, let's look at a better solution: viewport.\n\
    \n# <META NAME=\"VIEWPORT\">\n\nA better, less messy way to make media queries\
    \ behave themselves is to use the viewport meta tag. Invented by Apple to make\
    \ web apps display more reliably on iDevices, it was adopted by other browser\
    \ manufacturers because it is a jolly idea.\n\nTo get your media queries to behave\
    \ (Figure 8.12), you can add the following line into your HTML <head> (see media-blitz-6-with-viewport.html\
    \ in the code download folder):\n\n```\n<meta name=\"viewport\" content=\"width=device-width\"\
    >\n```\n\nThis makes the browser render the site at its true width, triggering\
    \ media queries as appropriate."
  merge: -1
  pgno: 320
- img_proc: true
  md: '# FIGURE 8.12 Viewport helps to better display content on a mobile device.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_321_0.png)


    The viewport meta tag is not just limited to forcing browsers to tell the truth
    about the site''s width or height. You can also do the following:


    +   - Set a specific width or height to render at. This is done using a number
    for the width or height value. For example,


    ```

    <meta name="viewport" content="width=320">

    ```


    +   - Set an initial zoom factor for your content. This is done using initial-scale
    and a zoom factor:


    ```

    <meta name="viewport" content="initial-scale=1.5">

    ```


    Such values work just like CSS scale transforms: 1.5 means "zoom in by 50%", 0.75
    means "zoom out to 75% of initial size," and so on.


    +   - Set the target pixel density. As you''ll see later in the "High-fidelity
    Devices" section, devices with high resolutions will often have multiple physical'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'device pixels for each pixel on your page (sometimes called CSS pixels). To
    alter how many or just set a CSS pixel to equal 1 device pixel, you can use target-densitydpi=device-dpi.
    For example:


    target-densitydpi=device-dpi or


    target-densitydpi=160.


    ```

    <meta name="viewport" content="target-densitydpi=device-dpi">

    ```


    +   Set a maximum and/or minimum allowed zoom factor for your content.

    If you want to limit how far your users can zoom in or out, you can use maximum-scale
    and minimum-scale, like so:


    ```

    <meta name="viewport" content="maximum-scale=2, minimum-scale=0.5">

    ```


    +   Turn off the ability to zoom. This is done using user-scalable=no:


    ```

    <meta name="viewport" content="user-scalable=no">

    ```


    > A very important accessibility feature for many users. You should really think
    carefully before you limit it or turn it off. A viable use case would be a game
    UI where you want it to remain full screen and don''t want it to be zoomed (in
    which case, you might want to provide an in-game zoom mechanism). Or, you might
    want to just limit zooming to acceptable levels that don''t make your app look
    too terrible at either end of the spectrum but still retain acceptable levels
    of zooming for low-vision users.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_322_0.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: "You might be thinking that this viewport thing smells like presentation rather\
    \ than content so should probably be handled using some kind of CSS construct\
    \ rather than an HTML meta tag. Some clever folks at Opera agree and have produced\
    \ the @viewport rule spec (http://dev.w3.org/csswg/css-device-adapter/#the-viewport-rule),\
    \ which defines the same functionality as Viewport meta tag but as a CSS construct.\
    \ The different options available in Viewport meta tag all have their equivalents\
    \ in @viewport, except target-densitydpi (hopefully, this will be added later):\n\
    \n```\n@o-viewport {\n  width: 320px;\n  zoom: 1.5;\n  max-zoom: 2;\n  min-zoom:\
    \ 0.5;\n  user-zoom: fixed;\n}\n```\n\nNote that @viewport currently works only\
    \ in Opera Mobile 11 and later, but in my opinion it is a better implementation\
    \ than Viewport meta tag, and should catch on in the future."
  merge: -1
  pgno: 323
- img_proc: true
  md: "As if the techniques you've looked at so far weren't complicated enough, many\
    \ devices from Apple, HTC, LG, Nokia, and more are now coming out with high-resolution\
    \ screens. For that reason, text and images are in danger of becoming illegally\
    \ small.\n\nTo compensate for this potential problem, mobile browsers on high-resolution\
    \ devices lie to twice. Not only do they render sites at a broader width than\
    \ the physical device, but they also apply a default zoom to the content. So a\
    \ CSS pixel can actually equal multiple pixels (yes, folks, bizarre enough). For\
    \ example, in Mobile running on an HTC Desire S, the zoom factor is 1.5, and in\
    \ the default browser on iOS 4, the zoom factor is 2.\n\nHow do you deal with\
    \ this extra level of complexity? It's not that much of an ordeal, because most\
    \ of the features on your web page will still look crisp when scaled. It's mainly\
    \ just images and video you need to worry about. If you are concerned about your\
    \ images not looking as crisp as you could, you could reference a slightly larger\
    \ image than required in your <img> element and then constrain the size, when\
    \ it is scaled up in high-resolution browsers, it stays crisp:\n\n```\n<img src=\"\
    images/tribal-sun-640px.jpg\" width=\"480\">\n```\n\nOr in the case of CSS background\
    \ images, you could check for a certain pixel via a media query and use additional\
    \ rules inside the media query to \"fix\" the issue in browsers that pass the\
    \ test.\n\nFor example, you could use background-size to cancel out the effects\
    \ of the device in the case of a background slice:\n\n```\n#wrap {\n  background:\
    \ url(images/wood.jpg);\n}\n\n@media screen and (min-device-pixel-ratio: 3/2)\
    \ {\n  #wrap {\n    background-size: 255px;\n    /* Original image is 1.5 times\
    \ this size - 383px */\n  }\n}\n```"
  merge: -1
  pgno: 324
- img_proc: true
  md: "Or dealing with icons, you could serve a larger background image to devices\
    \ with a higher pixel density, for example:\n\n```\nul li:nth-of-type(1) a {\n\
    \  background-image: url(icons/home-32.png);\n  border-radius: 20px 0 0 0;\n \
    \ background-position: 25px 50%;\n}\n```\n\n```\n@media screen (-o-min-device-pixel-ratio:\
    \ 3/2) {\n  ul li:nth-of-type(1) a {\n    background-image: url(icons/home-48.png);\n\
    \  }\n}\n```\n\nYou can see working examples of these techniques in the file high-resolution-example.html.\
    \ Note that the moment min-device-pixel-ratio is supported differently across\
    \ browsers: Opera Mobile uses ratio values, for example, 3/2, whereas WebKit-based\
    \ mobile browsers support it with decimals, such as 1.5. In the example you'll\
    \ see multiple versions of the media query with vendor prefixes used to serve\
    \ the different browsers values they recognize.\n\nIf you want to stop mobile\
    \ browsers from applying their default zoom, you can use the target-densitydpi\
    \ viewport feature to tell the browser, I really want to make 1 pixel equal 1\
    \ pixel; tell the whole truth, damn you like this:\n\n```\n<meta name=\"viewport\"\
    \ content=\"width=device-width,target-densitydpi=device-dpi\">\n```"
  merge: -1
