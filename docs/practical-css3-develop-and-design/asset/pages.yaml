  md: "To select list items, you'd do this, where n is a formula, number, or keyword:\n\
    li:nth-child(n)\n\nTo select just the odd or even list items, you'd do this (a\
    \ very easy way to create the infamous zebra-striped table effect):\nli:nth-child(odd)\n\
    li:nth-child(even)\n\nOr, you could use this:\nli:nth-child(2n+1)\nli:nth-child(2n)\n\
    \nTo create the same zebra stripes, let's look at some other formula examples:\n\
    \n+   - **li:nth-child(5)**. Selects the fifth adjacent item.\n- **li:nth-child(4n+1)**.\
    \ Selects every fourth item, and then adds 1 to each result. So numbers 5 and\
    \ 9.\n- **li:nth-child(3n-2)**. Selects every third item, and then subtracts 2\
    \ from each result. So numbers 1, 4, and 7.\n\nnth-child does the same thing as\
    \ nth-child, but it counts backward from the last element in the sequence.\nth-of-type\
    \ and nth-last-of-type are very similar but have one important difference: nth-of-type\
    \ ignores any rogue elements interspersed within the repeated sequence of elements\
    \ because the selection is done by type of element, not child number. For example:\n\
    \n```\n<div>\n  <article class=\"abstract\"> ... </article>\n  <article class=\"\
    abstract\"> ... </article>\n  <article class=\"abstract\"> ... </article>\n\n\
    ```"
