  md: '# # VALIDATING HTML5


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_55_0.png)


    As you know, it is always a good idea to validate your finished HTML5 structure
    before going further in your work to catch any DOM errors and the like that may
    cause when you apply script and style to your content.


    Henri Sisoni created an experimental but perfectly usable HTML5 (+ WA ARIA, SVG
    1 + MathML 2.0) validator, which you can use to validate your HTML5 documents
    regardless of the markup style used. You can find this validator at http://html5-validator.nu.
    Unfortunately, it doesn''t pick up on specific syntax styles—for example, the
    XPath I recommend in the book. It won''t pick up on missing attribute quotes,
    attribute values, or closing slashes because that''s all valid in HTML5!


    To mitigate this, I recommend you add an extra step to your validation for now
    until validators catch. Visit the HTML Lint site http://lint.brihten.com (**Figure
    2.1**) to check your markup against several options. To check against the style
    I recommend in this book, check the following options:


    +   - Never omit closing tags. All non nonempty elements must have a closing tag
    (empty elements don''t need the trailing slash).

    - Lowercase tags. All tags should be lowercase.

    - Quote attributes. All attribute values should be in quotes.

    - Lowercase attributes. All attributes and their values should be lowercase.

    - Simple booleans. Minimised attributes are allowed (those with the same as the
    attribute name can be shortened to the name: I showed the example required instead
    of required="required" earlier).


    **Figure 2.1** The HTML5 Validator and HTML Lint.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# # EXPLORING HTML5 ELEMENTS


    **FIGURE 2.2** A simple HTML5 video example (see simple-video.html in the chapter2
    folder).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_56_0.png)


    Let''s look at the HTML5 elements you''ll be using in this book, plus a few for
    good measure. An exhaustive treatment of HTML5 features is beyond the scope of
    this book because you''ll be working with CSS3 styling, most of the HTML5 APIs
    are pretty much relevant in this context. Yes, you could build a functional UI
    inside an <canvas> element, but you won''t be able to style it with CSS, and you''d
    be committing most of the same accessibility, usability, and SEO criteria that
