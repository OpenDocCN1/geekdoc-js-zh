    There is no single correct way to order the vendor prefixes in your code, and
    different people have different opinions about how it should be done. I''m just
    presenting my opinion of what I think works best.


    # CSS3 COLORS


    The new CSS3 Color units (www.w3.org/TR/css3-color) are most useful, particularly
    they allow you to programmatically define transparency for colors. This allows
    you to create advanced graphics and features that blend nicely into each other
    and their backgrounds without having to create loads of transparent PNGs at all
    time.


    Table 1.1 shows what current support looks like.


