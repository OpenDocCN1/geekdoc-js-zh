- img_proc: true
  md: 'CSS3, the new, modular version of the CSS3 spec, contains many awesome new
    features that will make your web design work easier, more flexible, and more interesting.
    What’s not to love? Browser support is not complete yet, but many of the features
    have enough support to be useful in a production environment, and you can work
    around nonsupporting browsers.


    In this chapter I''ll provide the rationale behind why the new version came about
    and gently preach a manifesto of modern web design to you. Then I''ll provide
    a brief roundup of the CSS3 modules before examining some of the general new features
    of CSS3 that are useful to explore as background knowledge before you go any further.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_11_0.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# WHY CSS3?


    CSS3 has been around for longer than you might think. In fact, work had started
    on the earliest parts of CSS3 at about the same time as the CSS2 spec was being
    finished in the late 1990s. CSS2 has many very powerful features, and you can
    do a lot with it, but it was clear all years ago that despite a number of features
    were missing from the spec. This was evidenced by the fact that web designers
    tried to do many tasks using weird and interesting hacks or unusual techniques,
    involving lots of nested <div> or other semantic backstubbery, images, or even
    proprietary technologies like Flash. Some examples that spring to mind include:


    +   - Font embedding. Downloading custom fonts for websites has been available
    in Internet Explorer (IE) since version 4 but wasn''t standardized until later
    years with CSS3 fonts. Before fonts gained popularity and cross-browser support,
    web developers used to rely on all kinds of weird replacement techniques, such
    as image replacement and siFR (Scalable Inman Flash Replacement—see http://en.wikipedia.org/wiki/Scalable_Inman_Flash_Replacement)
    if they wanted custom fonts in headings.


    +   - Bulletproof CSS. In the late 1990s and early 2000s a lot of pioneering techniques
    started to spring up for creating UI features that wouldn''t break if the text
    was resized. The text wouldn''t spill out of its containers; instead, the design
    would expand along with it. These techniques were referred to as “Bulletproof
    CSS,” and they worked well if done properly. Often they required a number of nested
    <div>, each with a single background image hung out. Bulletproof rounded corners
    on a container required four nested <div>! Such designs were inflexible. If you
    wanted to change the color of the background, you''d have to go back into your
    preferred graphics editor and update all the background images each time. This
    is exactly the problem of properties like border-radius were created to fix.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   Multiple column layouts. It is very common to use CSS floats to create
    multiple column layouts; everyone knows. But this is somewhat of a hack. Floats
    were never originally intended for this purpose. They were intended for simple
    magazine layout floats.


    +   Dynamic UIs. Many "dynamic UI features," such as layouts that automatically
    adapt to different screen widths and smooth animations and transitions for user
    feedback, have been traditionally done using JavaScript. There was no way to achieve
    this using CSS alone until recently; hence, the rise of DHTML in the late 1990s
    (yuck!) and more recently, the overwhelming popularity of JavaScript libraries,
    such as jQuery and Dojo.


    And the list goes on. CSS3 was created and not to give users a completely new
    set of features to play with and created "spingly web innovations" (a great design
    agency name if there was one), but to provide users with standardized, more flexible
    ways of solving existing problems.


    There are now more than 40 modules in CSS3 at various stages of completion and
    browser support. The modular system is beneficial in many ways. It makes CSS3
    easier to write by the spec teams and implement by the browser vendors: It is
    always easier to tackle small chunks than a single giant monolith. It also makes
    it easier for web designers and developers to get their heads around, and in my
    opinion, it makes it easier to "sell" to clients who may have issues about "unfinished"
    technologies in their sites (yes, CSS 2.1 was technically only finished in 2011,
    but hey).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# MODERN WEB DESIGN

    PHILOSOPHY


    FIGURE 1.1

    It''s highly impressive to be able to create web pages like this, just using open
    standards (see http://operasoftware.github.com/Emberwind and\http://helloracer.com/webgl).


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_14_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_14_1.png)


    I am a great supporter of CSS and the rest of the open standards landscape. The
    last couple of years have been very exciting for open standards. You''ve seen
    browsers leap forward in terms of rendering speed, feature support, and so on.
    New web technologies like CSS3 and HTML5/WebGL really allow you to create some
    amazing digital experiences (Figure 1.1).'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_15_0.png)


    > **FIGURE 1.2** "Best viewed in Google Chrome" sounds like a step back to the
    days of "Best viewed in IE4.\ Now, I''m not saying that all content should be
    accessible to all people: it is not always that simple. But you should make such
    allowances whenever possible.


    But everyone needs to take a step back when considering such innovations and not
    lose sight of the original qualities and best practices that made the web great,
    such as accessibility, usability, and graceful degradation.


    # ACCESSIBILITY COMES FIRST


    In terms of my perspective on web design, I am really "web 1.0" kinda guy. Innovative
    technologies are exciting, and you can fully appreciate their importance in the
    evolution of the web. But what is exciting is the universal nature of the web.
    It''s the fact that you can take the same content, style it in a million different
    ways, and still have it remain accessible to all web users the world regardless
    of how they use the web—be it on a mobile phone, using only keyboard controls,
    or via a screen reader.


    It is something designers and developers shouldn''t lose sight of, but often we
    do. Whenever an exciting new web technology comes to the forefront, too many sites
    tend to pop up that will go with the shiny and forget about the basics. Recently,
    you''ve seen a sad resurgence of "This site is viewed in..." messages, which should
    have been eliminated after the original rewards ended a decade or so. And what
    about important content rendered in <canvas>, which is therefore inaccessible?
    And how about CSS3 features could work across multiple browsers but don''t the
    designer have used the -webkit- prefixed version of the property? That designer
    might say, "Oooh, but it''s an app; therefore, it''s important to lock out anyone
    who isn''t using a device of the correct level of shininess" (Figure 1.2).'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# USABILITY NEXT!


    Once your users have managed to access your content and services, can they make
    sense of it and glean the information they wanted from it? This is a simple, perhaps
    obvious point to make, but I''ve lost count of the times I''ve gone to a company
    website and scratched my head in vain trying to find contact details, opening
    times, or an address. Instead, I find nothing useful amidst the sea of marketing
    BS, cheesy videos, and other propaganda being presented.


    Why do people think more about what information is most useful to people viewing
    their websites and how to present that information in an easily digestible way?
    A simple, well-written, and clearly available bit of copy is nearly always more
    effective than realms of flashy, whizzy, technical stuff.


    > My mantra for usability (and many other people''s, too) is "Don''t make me think."
    If you''ve already read it, Steve Krug''s book Don''t Make Me Think: A Common
    Sense Approach To Web Usability, 2nd Edition is essential reading.


    # GRACEFUL DEGRADATION AND PROGRESSIVE ENHANCEMENT


    Graceful degradation and progressive enhancement were two terms that first became
    popular (or at least notably) about a decade ago. Both were used when talking
    about what happens to content when the browser viewing it doesn''t support all
    the features used to create it.


    Graceful degradation means that the content falls back to something simpler but
    still perfectly accessible and usable. So, for example, if a content box is built
    and then styled lots of CSS3 glitz, older browsers should still be able to display
    the text in a readable form, even if it doesn''t look like nice.


    Progressive enhancement means that the base content is accessible by all, but
    then usability and stylistic enhancements are built on top of that base for those
    browsers that support those enhancements.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_17_0.png)


    FIGURE 1.3 Dan Cederholm said it best with this cheeky little site.


    These are design philosophies that I have always heard. They have not always been
    easy to uphold, because you often meet clients who are “obsessed with pixel perfection
    across all browsers” or some similar weird fetish. But they are certainly becoming
    cool again, especially with the CSS3 features to make use of and lots of mobiles
    and other alternative browsing devices to make your content work across. Oh, and
    IE6, 7, and 8 still have significant market share and often need to be supported.


    The wide variety of devices you have to support these days (mobile phones, tablets,
    TVs, etc.) actually makes things easier in terms of clients craving pixel across
    all devices: It is impossible for sites to look and function the same across desktop
    and mobiles, and indeed it doesn’t make sense (as hoped by dowbiesneedtolookexactlytheeverybrowser.com,
    seen in Figure 1.3). It is all about content. What makes sense on a standard desktop
    computer might provide a bad user experience on a touchscreen mobile device or
    tablet.


    The good news is that CSS3 is fairly easy to progressively enhance and gracefully
    degrade, and otherwise get to work OK across old browsers. Most of the features,
    if used in the right way, will degrade gracefully so that the base content will
    still be accessible in nonsupporting browsers. Also, there are mechanisms that
    allow you to build in support or provide alternative content if needed be.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# THOUGHT PROCESS FOR CONTENT


    A good thought process to go through when implementing shiny features on a website
    interface is as follows:


    +   1. Create a base of accessible HTML content. The styling and behavior you
    build on top of this content should, wherever possible, be usability and stylistic
    enhancements, and not essential for accessing the content.


    +   2. Consider whether you need to use all the cool, cutting-edge technologies
    or whether you just want to use because you''re a cool kid who wants to be with
    the in crowd.


    +   3. Check whether your proposed implementation will gracefully degrade while
    leaving the base content accessible.


    +   4. Test whether the content is accessible and OK looking across varying devices
    (e.g., different screen sizes, control mechanisms).


    +   5. In cases where the content is not accessible without the CSS3, WebGL or
    whatever, or not accessible to certain users, do your best to build in alternative
    mechanisms that will provide access to that content.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'You should constantly look at making content work for as many users as possible
    by:


    +   1. Keeping graceful degradation/progressive enhancement in mind.


    +   2. Providing alternatives for inaccessible content using built-in features
    (e.g., alt text, transcripts for video).


    +   3. Building in your own alternatives when no built-in mechanisms exist (e.g.,
    feature detection and provision of alternative styles using Modernizr).


    +   4. Using polyfills to provide support for features where none exist.


    The rule I used for deciding what to cover in this book was to include a CSS3
    feature only if it has support across at least two major browsers and if you can
    make designs employing it work in older browsers that don''t support it via polyfills,
    alternative content, graceful degradation, and so on. I''ve broken this rule a
    few times, only when I thought a feature was very significant and likely to have
    more implementations soon, and when nonsupport didn''t completely break sites.


    > TIP: A great site to consult for quick summaries of which CSS3 and HTML5 features
    are ready to use on production sites, and whether fallbacks and the like should
    be provided is http://htmlplease.us by Divya Manian, Paul Irish, et al.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# CSS3 MODULES IN THIS BOOK


    Let''s look at a brief rundown of the major CSS3 modules you''ll be utilising
    and their features. You can find more details on the latest status of each module
    at the W3C CSS Current Work page www.w3.org/Style/CSS/current-work.en.html. As
    you''ll see, many of the modules are not yet finished, but this shouldn''t stop
    you from using some of those features. Many such features are already supported
    in browsers, with vendor prefixes (see the section "Vendor Prefixes" for more
    details). The major CSS3 modules featured in this book include:


    +   - CSS Color (www.w3.org/TR/css3-color). CSS Color defines the ways to specify
    color in CSS3, including RGB (red, green, blue), HSL (hue, saturation, lightness),
    RGBA and HSLA (same as before but includes an alpha channel to specify transparency),
    and a separate opacity property to apply transparency to a whole selection of
    elements.


    +   - CSS Fonts Level 3 (www.w3.org/TR/css3-fonts). As well as containing the
    definitions for downloadable web fonts (previously in a separate module known
    as, you guessed it, CSS fonts), this module also contains definitions for other
    font-affecting properties, as font-settings. I won''t talk about many of these
    beyond web fonts, because many do not have browser support yet. You''ll mostly
    meet these in Chapter 3.


    +   - CSS Text Level 3 (www.w3.org/TR/css3-text). This goes in hand with CSS Fonts
    Level 3 to give you more power over your words! As well as familiar items from
    CSS2, such as letter-spacing and text-transform, CSS Text introduces new friends,
    such as hyphenation and text shadow.


    +   - Selectors Level 3 (www.w3.org/TR/css3-selectors). Selectors Level 3 defines
    a much more powerful, robust set of mechanisms for selecting the elements you
    want to apply styles to than what was available in CSS2. Pretty much all of these
    selectors have good support across modern browsers. These are discussed in the
    "CSS3 Selectors" section of this chapter.


    +   - Media Queries (www.w3.org/TR/css3-mediaqueries). The primary means by which
    you can now serve optimized layouts of the same content to widely browsing devices—for
    example, wide screen and narrow screen. You''ll mostly meet these in Chapter 8.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '+   - Backgrounds and Borders Level 3 (www.w3.org/TR/css3-background). Grounds
    and Borders define anything to do with background and borders, including rounded
    corners (border-radius), drop shadows (box-shadow), and fancy border effects (border-image).


    +   - CSS Multi-column layout (www.w3.org/TR/css3-multicol). CSS Multi-column
    layout defines an easy way to break up content into multi-column layouts that
    reflow nicely rather than having to hack it with imprecise floats. You''ll meet
    these in Chapter 7.


    +   - CSS transforms (www.w3.org/TR/css3-2d-transforms and www.w3.org/TR/css3-3d-transforms).
    These specifications define mechanisms for transforming the size, position, and
    shape of elements in two and three dimensions. I''ll mainly talk about these in
    Chapter 5.


    +   - CSS transitions (www.w3.org/TR/css3-transitions). CSS transitions give you
    a way to smoothly animate changes in state, such as a change in link color or
    an increase in banner size over. You''ll mainly see these in Chapter 5.


    +   - CSS animations (www.w3.org/TR/css3-animations). CSS animations allow you
    to implement Flash-style declarative animations using keyframes detailing different
    property values, which the browser “tweens” between. These are also covered in
    Chapter 5.


    +   - CSS Flexible box layout (www.w3.org/TR/css3-flexbox). Mainly intended for
    equally distributing the height or width of rows or columns, this module defines
    new values for the display property to allow more powerful layout techniques.
    This is supported to varying degrees across modern browsers, but it is worth mentioning.


    +   - CSS Image Values and Replaced Content Level 3 (www.w3.org/TR/css3-images).
    This module contains some useful features for controlling background images and
    replaced content, some of which is starting to be supported across browsers. I''ll
    cover linear and radial gradients among other features.'
