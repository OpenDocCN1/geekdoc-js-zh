  md: '# WRAPPING UP


    Hopefully, you''ve come away from this chapter with an understanding of the great
    new tools CSS3 offers for making your visuals less image-dependent and therefore
    more flexible and lightweight. Although having the ability to programmatically
    create web graphics does make web design easier for non-Photoshop ninjas (like
    me), I hope you''re committed to using those features in a responsible way rather
    than just spamming all the relevant properties onto every container on your site!


    And, you also now know how to get these CSS3 features working in a reasonable
    manner across older, less-capable browsers.'
