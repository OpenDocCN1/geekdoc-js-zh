  md: '# TRANSITIONS


    With a run-through of CSS3 Transforms complete, let''s now turn to pastures new,
    namely transitions. As you''ve seen in some of the transform examples, transitions
    allow you to smoothly animate properties that change upon a state change (for
    example, when a link is hovered over) rather than the usual on/off rollover that
    would occur otherwise.


    Table 5.2 summarizes the browser support for transitions.


    TABLE 5.2 Browser Support for Transitions


    | BROWSER | TRANSITIONS |

    |---|---|

    | Opera | 10.5 with -o- |

    | Firefox | 4 with -moz- |

    | Safari | 3.1 with -webkit- |

    | Chrome | 4 with -webkit- |

    | Internet Explorer | 10 with -ms- |

    | iOS | 3.2 with -webkit- |

    | Android | 2.1 with -webkit- |

    | Mobile Chrome | Since beta with -webkit- |

    | Opera Mobile | 10 with -o- |

    | Opera Mini | No |


    Note that in IE10 platform preview 6, support for non-prefixed transition properties
    has been added.


    > NOTE: it makes very little sense to try to demonstrate many in this section.
    Using static images, I''ll not include many in this section. I advise that you
    have the code download files close at hand while reading this section.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_187_0.png)'
  merge: -1
  pgno: 187
- img_proc: true
  md: "FIGURE 5.18 A simple, well-styled button.\n\n# SELECTING WHAT TO TRANSITION\n\
    \nTo demonstrate transition basics, let's walk through building a very simple\
    \ button example (see transition-button.html in the chapters/ folder). The button\
    \ is simply a link styled to produce depth and shadowing using a combination of\
    \ box shadow, linear gradients, text shadow, and more (Figure 5.18). There is\
    \ nothing remarkable here except perhaps to say that I've used an inset box shadow\
    \ to give a bit more shape.\n\nWhen the link is moved over or focused via the\
    \ keyboard, the background color changes (as dictated by the :hover/:focus states),\
    \ and the link is clicked/activated, another stronger, inset box shadow is applied\
    \ to give the button look of being pressed in. This is standard fare on the web,\
    \ but I'm sure you agree that the experience could be better if the state changes\
    \ were a bit smoother.\n\nYou can do this very easily by setting a transition\
    \ on the link, as follows:\n\n```\na {\n  ...\n  transition-property: background-color;\n\
    }\n```\n\nYou must set the transition on the element you want the transition to\
    \ occur on. transition-property takes its value as the property you want to transition\
    \ upon state change.\n\n> NOTES: Notice from the code examples in this section\
    \ that the transition properties currently need prefixes.\n\nNot all CSS properties\
    \ are animatable by CSS Transitions and Animations, but most of the ones you'd\
    \ conceivably want to animate. A list of animatable properties is available in\
    \ the CSS Transitions spec in the Animatable Properties section at www.w3.org/TR/css3-transitions/#animatable-properties."
  merge: -1
  pgno: 188
- img_proc: true
  md: "# SELECTING TRANSITION LENGTH\n\nSo far so good, but you need one addition\
    \ to get the basic example working: You need to set a duration over which the\
    \ transition will occur. This is done using the transition-duration property:\n\
    \n```\na {\n  ...\n  transition-property: background-color;\n  transition-duration:\
    \ 0.5s;\n}\n```\n\nThis property can take values with any CSS time units, but\
    \ you'll pretty much use seconds.\n\n# DELAYING TRANSITIONS\n\nIf you want to\
    \ set up a delay between the state changing on the element to be transitioned\
    \ and the transition occurring, you can use the transition-delay property, like\
    \ so:\n\n```\ntransition-delay: 2s;\n```\n\nThis property is useful if you want\
    \ to fire multiple transitions but want them to happen one after the other in\
    \ a staggered fashion.\n\n# ALTERING THE RATE OF TRANSITIONS\n\nBy default, transitions\
    \ occur at the same rate throughout their duration. This is OK for many uses,\
    \ but in some cases you'll want to vary the transition rate to emulate concepts\
    \ such as acceleration, friction, or gravity. To apply such variations to your\
    \ transitions, you can use the transition-timing-function property."
  merge: -1
  pgno: 189
- img_proc: true
  md: '# CUBIC BÉZIER CURVES


    Transition/animation timing functions are modeled on cubic Bézier curves (Figure
    5.19), which you''ll be familiar with if you have studied math(s) to a high level.
    For us nonmathematicians, the actual maths is complicated (see://en.wikipedia.org/wiki/Bezier_curve).
    But basically, in the context of transitions and animation, Bézier curves on the
    X axis control the start and end of the graph have control handles attached to
    them, which control the shape of the curve. Shallower parts of the curve equate
    to slow movement, and steeper parts produce faster movement.


    If this is to visualize, head over http://cubic-bezier.com by Lea Verou, which
    is a fantastic site that allows you to create your own curves by drawing the control
    handles around, playing sample animations to give you an idea of the effect these
    curves have, and importing, exporting, and sharing curves.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_190_0.png)


    The available values you can use (modeled on cubic Bézier curves):


    +   - linear. The transition happens at the same rate from beginning to end.


    +   - ease. The default value; the transition starts quickly and then gradually
    slows down.


    +   - ease-out. The transition starts quickly, stays quick for longer than ease,
    and then slows down more abruptly at the end.


    +   - ease-in. The transition starts off slowly and then speeds up towards the
    end.


    +   - ease-in-out. The transition starts off by accelerating, is is quite fast
    for most of the duration, and decelerates towards the end.


    FIGURE 5.19 A cubic Bézier curve'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# FIGURE 5.20 A funky animated bar graph that demonstrates the different transition-timing-functions.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_191_0.png)


    +   - steps(). Instead of giving a smooth transition throughout, this value causes
    the transition to jump between a set number of steps placed equally along the
    transition. For example, steps(10) would make the transition jump along in ten
    steps. You can also set an optional second parameter with a value of start or
    end—for example, steps(10, start) or steps(10, end). This specifies whether the
    change in property value should happen at the start or end of each step. You won''t
    find much for this optional parameter, or it is worth a mention.


    +   - cubic-bezier(). You can use cubic-bezier() to specify your own cubic Bézier
    curve to use for the transition. This function takes four arguments: the X and
    Y coordinates of the beginning control handle, and the X and Y coordinates of
    the end control handle. For example, cubic-bezier(0.25, 0.1, 0.2, 1.0) is equivalent
    to the ease preset value.


    To make the difference between these timing functions easier to appreciate, I''ve
    created an animated bar graph example that shows several different bars crossing
    the screen when the display is hovered over (Figure 5.20). Each one has a different
    timing function applied, so all will reach the end of their course at the same
    time, but their rates will vary. See the transition-timing-functions.html file
    in the chapters code download folder.


    > NOTE: The steps timing function doesn''t appear to work in Opera, but it should
    get there soon.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_191_1.png)'
