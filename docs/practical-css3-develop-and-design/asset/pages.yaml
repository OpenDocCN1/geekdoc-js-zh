    +   - **onom.** These are either ordinals—numbers that denote a position of ranking,
    for example, 1st or 3rd—old-style numerals, which are not always the same height
    and never always exactly on the baseline. (I''ve found websites that claim one
    or the other is true) (**Figure 3.20).


    +   - **frac.** When used, these fractions automatically allow you to use fraction
    glyphs instead of three separate characters—for example, 3/4 instead of 3/4. As
    **Figure 3.21** shows, this looks a lot more attractive and less clumpy.'
  merge: -1
