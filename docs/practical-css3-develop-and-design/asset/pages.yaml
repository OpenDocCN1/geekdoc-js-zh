  md: '# USING WEB FONTS


    For years, the lack of "web-safe fonts" available for web designers to use on
    their sites was a complete nightmare. Fonts like Times New, Arial, Courier New,
    and Georgia could go a long way, but for custom headings or logos, you had to
    resort to tricky techniques like image replacement or even siFR or Cofun (which
    replaced text using Flash movies or SVG custom fonts).


    Like a ray of sunshine, CSS2 introduced Web Fonts. Then it was dropped due to
    lack of agreement from browser vendors. Then it was reintroduced in the Web Fonts
    module, which was later subsumed into the Fonts module www.w3.org/TR/css3-fonts/
    This module contains functionality that allows you to specify custom font files
    to download with your website, and then use them in the same way as any other
    font. You first need to specify the font to download using a @font-face block,
    like so:


    ```

    @font-face {

    ```


    ```

    font-family: myfont;

    src: local("myfont"),url(myfont.ttf),url(myfont.woff);

    font-weight: bold;

    font-style: italic;

    ```


    ```

    }

    ```


    Inside the curly braces, you can include:


    +   - A font-family declaration to specify the name of your font, which is how
    you will refer to in your CSS. You can pretty much use any term you like here,
    as long as you use consistently throughout your CSS. Use font-family: ''monkey
    butt''; if you really think your boss or client will cool with it.


    +   - A src declaration to point to the actual font(s) you want to use. This can
    point to a single file or a comma-separated list of many different fonts as you
    want. The browser will go through the list until it can find a format it recognizes.
    The fonts can be local, such as local("foo"), or external downloadable fonts,
    such as url(http://example.com/path/to/foo.ttf).


    +   - A font-weight declaration to specify usage of a bold version of the font
    if it''s available. If the font file you are pointing to contains a bold version,'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'will be used; otherwise, setting bold will have no effect, and you should set
    it to normal instead or not include it.


    +   - **font-style** declaration to specify usage of an italic version of the
    font if it''s available. If the font you are pointing to contains an italic version,
    it will be used; otherwise, setting italic will have no effect, and you should
    set it to normal instead or not include it.


    Of course, nothing is ever this simple in web design. Those dastly browser vendors
    haven''t been able to agree on a single font format to support until recently,
    and you also need to think about older browsers. **Table 3.1** gives you an idea
    what current font format support looks like across browsers.


    # TABLE 3.1 Browser Support Matrix for Font Formats


    | BROWSER/FONT FORMAT | SUPPORT @ FONT-FACE | TRUETYPE (.TTF) | OPENTYPE (.OTF)
    | EMBEDDED OPENTYPE (.EOT) | SVG | WEB OPEN FORMAT (.WOFF) |

    |---|---|---|---|---|---|---|n| Opera | Since 10 | Yes | Yes | No | Yes | Yes
    |

    | Firefox | Since 3.5 | Yes | Yes | No | Yes | Yes |

    | Safari | Since 3.1 | Yes | Yes | No | Yes | Yes |

    | Chrome | Since 4 | Yes | Yes | No | Yes | Yes |

    | Internet Explorer | .eot since 4, .woff since 9 | No | No | Yes | No | Yes |

    | iOS | SVG up to 4.1 | Yes | Yes | No | Yes | Yes |

    | Android | Since 2.2 | Yes | Yes | No | Yes | No |

    | Chrome Mobile | Since beta | Yes | Yes | No | Yes | Yes |

    | Opera Mobile | Since beta | Yes | Yes | No | Yes | Yes |


    Fortunately, all vendors have now agreed on the support of the W3C WOFF standard
    (www.w3.org/TR/WOFF), which is a container/compression format for OpenType and
    TrueType fonts that can also contain licensing information and suchlike. It is
    a winner across ages, resulting in smaller file sizes and happier font foundries.
    It has been supported for ages in Firefox and Chrome, Safari since version 5.1,
    Opera since version 11, and Internet Explorer (IE) since version 9.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Older versions of most browsers don''t matter as much anymore because they
    tend to be updated regularly. However, older versions of IE still need to be supported;
    many IE installs won''t be updated soon (49 percent of the world''s computers
    still run Windows XP, which can only run IE version 8 and earlier).


    The good news is that IE has supported Microsoft''s proprietary Embedded OpenType
    format since version 4, meaning that old versions of IE can work with custom fonts
    quite well.


    # ADDING WEB FONTS TO THE EXAMPLE


    To chronicle the adventures of Arthur and the Camelot—and their fights against
    denizens as the Knights who Ni and The Temptresses of Castle Anthrax—I decided
    to try to find some old-world fonts to communicate the sort of look for a blog
    written by a medieval king. To find what I wanted, I looked at a few free sites:


    +   - dafont.com

    - myfonts.com

    - fontsquirrel.com


    I eventually settled on three from Font Squirrel that would work out for this
    demo:


    +   - Ugly Qua (www.fontsquirrel.com/fonts/UglyQua)

    - kells s0 (www.fontsquirrel.com/fonts/Kells-SD)

    - Genzsch Et Hesse (www.fontsquirrel.com/fonts/Genzsch-Et-Heyse)


    You might think that creating syntax and different formats to provide cross-browser
    support would be a nightmare, given what I said earlier. But Font Squirrel provides
    two features that will help you out here. The first one is the ready-made@font-
    face kits page (www.fontsquirrel.com/fontface), which contains all the font and
    code you''ll need to get fonts working cross-browser.

    But if you want to customize one of Font Squirrel''s fonts or make one of your
    own fonts work cross-browser? The second feature—the @font- face generator—will
    come to your rescue. Just follow these steps to create what you need.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '+   1. Download some fonts you want to use. Generally, they will be in .otf
    or .ttf format, but either will do.


    +   2. Go to the @font-face generator at @www.fontsquirrel.com/fontface/generator.


    +   3. Click the Add Fonts button, and select one of your fonts. Repeat this step
    until you''ve added all the fonts to the list.


    +   4. Select the "Yes, the fonts I''m uploading are legally eligible for web
    embedding" check box. The fonts I chose from Font Squirrel are free for commercial
    web use, but you''ll find many that are not, so be careful here.


    +   5. Click the Download Your Kit button, and save the resulting ZIP file to
    a location you''ll remember.


