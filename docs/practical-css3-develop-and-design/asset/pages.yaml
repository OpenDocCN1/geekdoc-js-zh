  md: "# GENERAL CSS3 FEATURES\n\nTo whet your appetite, let's now look at some general\
    \ CSS3 features. These features are grouped together because they are general\
    \ features that you'll meet time and time again throughout different chapters:\
    \ They are useful in many different circumstances.\n\n# VENDOR PREFIXES\n\nVendor\
    \ prefixes are not exactly CSS3 features, but at the time of this writing (and\
    \ for some time after), you'll meet them repeatedly when working with CSS3. The\
    \ reason is that before a CSS feature is completely \"finished\" (e.g., the spec\
    \ is not quite stable, and changes may be made before the final version), it can\
    \ still be implemented inside browsers. At this stage, browser vendors add their\
    \ own vendor prefix to support the start of the feature and use the prefixed version.\
    \  \n\nThe idea is that before a CSS feature is completely \"finished\" (e.g.,\
    \ the spec is not quite stable, and changes may be made before the final version),\
    \ it can still be implemented inside browsers. At this stage, browser vendors\
    \ add their own vendor prefix to support the start of the feature and use the\
    \ prefixed version. This allows vendor to support the feature inside its own \"\
    sandbox,\" as it were, so, if the spec changes and future versions work differently,\
    \ this won't result in a single property that works differently across different\
    \ browsers. As an example, CSS transitions are currently supported across browsers\
    \ with vendor prefixes. A sample block of code might look like this:\n\n```\n\
    a:link {\n  background-color: #666666;\n  -webkit-transition: 1 all;\n  -moz-transition:\
    \ 1 all;\n  -ms-transition: 1 all;\n  -o-transition: 1 all;\n  transition: 1 all;\n\
    }\n\na:hover {\n  background-color: #ffffff;\n}\n```"
