  md: 'Fonts and text have been pretty stable across browsers for a fairly long time
    in terms of CSS2 support, although the feature set has traditionally been a bit
    limited. But this is all changing, as you''ll see as you travel through this chapter.
    CSS3 provides more powerful features for bending type to your will.


    In this chapter you''ll learn how to apply custom fonts to your web documents
    in a variety of ways, from hosting free fonts on your own server to using professional
    paid services. You''ll also learn how to use some of the new CSS3 text features,
    such as controlling hyphenation and OpenType font features.


