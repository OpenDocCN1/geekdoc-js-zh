    |---|---|---||}{

    | Descendant | nav a | Selects the element on the right only if it is nested somewhere
    inside the element(s) to the left. You can chain more than two together—for example,
    nav li a. | All. |

    | Child | body>header | Selects the element on the right only if it is a direct
