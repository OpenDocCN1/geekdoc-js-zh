    \ element in the 3D space. translate3D produces a very similar effect to what\
    \ you've already seen with translation functions; however, translate3D allows\
    \ you to translate along the X, Y, and Z axes at the same time:\n\n```\ntransform:\
    \ translate3D(100px, 200px, 300px);\n/* 100 pixels along the X axis, 200 pixels\
    \ along Y, 300 pixels\n-> along Z */\n```"
