  md: '# PROVIDING ALTERNATIVES WITH MODERNIZR


    Using the Modernizr feature detection library, let''s look at an intelligent way
    to provide alternative styling for browsers that don''t support cutting-edge CSS3
    features.

    The tour of CSS Animations, Transitions and Transforms you''ve just read was deliberately
    kept simple, because there is lots of information to take in. But hopefully you''ve
    started to form some killer ideas about the cool effects you can achieve using
    these features. For more involved examples, I recommend going a Google search.
    My favorite examples are CSS3-man (the.optimum7.com/css3-man) and Pure CSS3 AT-AT
    (anthonycalzadilla/css3-ATAT/index.html), both by Anthony Calzadilla.

    The trouble is that the demos you''ll see give you much consideration to working
    in nonsupporting browsers. Perhaps it doesn''t matter in the case of throwaway
    demos, and maybe they degrade gracefully. For instance, look at the preceding
    animation-basics.html example, which works perfectly well the animations are not
    supported; you don''t get to see the fun animations. But about interfaces in which
    you rely on animations content?

    A way to deal with such eventualities is to use feature detection; that is, you
    can use JavaScript to detect whether the browser accessing the content supports
    the features you are using, and then serve different styles depending on the result.

    The easiest way to do this for noncode ninjas is to use a feature detection library;
    the best available is Modernizr (www.modernizr.com), created by Faruk,, Irish,
    Alex Sexton, and others. This uses JavaScript to detect pretty much CSS3 and HTML5
    features, and lets you selectively scripting and styles to use. As of version
    2, you can build and download your own custom version that just includes the tests
    you want, reducing bandwidth with www.modernizr.com/download). While you are experimenting
    at this point, you should just stick to using the full, uncompressed version of
    Modernizr (click the DEVELOPMENT download button on www.modernizr.com).

    Let''s run through adding some CSS detection magic to an example! To keep it simple
    and easy to follow, you''ll revisit the business card 3D flip example. Open the
    two-faced-cheek-modernizr.html file in the chapter 5 download folder for the finished
    example, or open the two-faced-cheek.html file for a starting point.'
  merge: -1
  pgno: 212
