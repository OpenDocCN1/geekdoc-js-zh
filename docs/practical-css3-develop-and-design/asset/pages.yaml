- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_131_0.png)


    **Figure 4.18** A simple repeating gradient.


    # # REPEATING LINEAR GRADIENTS


    Repeating linear gradients have a similar syntax to linear gradients. Look at
    the following example and the result in **Figure 4.18:**


    background: repeating-linear-gradient(to top right, rgba(0,0,0,0.4) 10px,rgba(0,0,0,0)
    20px, rgba(0,0,0,0.4) 30px);

    background-color: #ff0000;


    Only 30 pixels'' worth of gradient has been specified, but it is repeated over
    and again until the end of the container is reached.


    # UPDATED LINEAR GRADIENT SYNTAX


    The linear gradient syntax was updated at the time of this writing—the keywords
    used not to include the keyword, and mean the opposite direction. For example,
    to right used to be left. All browsers supported this at the time of publication,
    but you might come across an older browser that doesn''t support the new syntax
    at some point.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_132_0.png)


    # # RADIAL GRADIENTS


    Radial gradients work a bit differently than linear gradients. Instead of traveling
    across a container from one side to another, they radiate outwards from a single
    point. Here is a simple example:


    ```

    background: radial-gradient(50% 50%, 60%, rgb(75, 75, 255),

    → rgb(0, 0, 0));

    ```


    This produces the result in **Figure 4.19** (if you want to experiment with this
    code, download the radial-gradient-test.html file in the chapter4 folder).


    # UPDATEDIAL GRADIENT SYNTAX


    The syntax of radial gradients has also been recently changed in the spec. Although
    this new syntax is much further behind that of linear gradients—it has no current
    browser implementations—it may be well implemented in the not-to-distant future.
    Explore #dew3.org/csswg/css3-images/#radial-gradients for more details. As an
    example, the first example shown in this section would be rewritten as:


    ```

    background: radial-gradient(60% circle at 50%, 50%, rgb(75, 75, 255), rgb(0, 0,
    0));

    ```


    > NOTE: Radial-gradient-app.html is also included in the code download: This works
    in the same way as linear-gradient-app.html but with different radial gradient
    presets plugged in. Use it to play!'
  merge: -1
  pgno: 132
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_133_0.png)


    The syntax is a little different than that of linear gradients, so let''s go through
    the radial gradient step by step.


    # RADIAL GRADIENT POSITION


    The first two values in the syntax (50% 50% in the preceding code) dictate the
    location of the origin of the radial gradient. The first value is the horizontal
    position inside the container, and the second value is the vertical. In the preceding
    example, the radial gradient equates to 50% across the left side and 50% down
    from the top, which places slap bang in the middle of the container. As with linear
    gradients, you can use any unit values that make sense, even negative unit values.


    You can also use keywords in place of unit values in the same manner as you learned
    earlier with the addition of center if you want the horizontal or vertical position
    to be centered in the container (this doesn''t make sense for linear gradients,
    but it does for radial gradients). Figure 4.20 shows a few examples.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'FIGURE 4.21 background: radial-gradient(50% 50%, 100%, rgb(75, 75, 255), rgb(0,
    0, 0)); swamps the container.


    FIGURE 4.22 Creating an ellipse using different vertical and horizontal radius
    values. Neo''s amphetamine lunch?


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_134_0.png)


    # RADIAL GRADIENT SIZE AND SHAPE


    The second set of values in the radial gradient syntax (60% 60% in the example)
    dictates the size of the gradient—the horizontal and vertical radius. Because
    you are working with the radius rather than the diameter, 50% or 60% will produce
    a nice spread across a container. 100% would be double the width/height of the
    container, swamping it entirely, which may or not be the effect you want (Figure
    4.21).


    > NOTE: Firefox has never implemented size percentage values, so they won''t work
    in Firefox. For this reason, it is better to use keyword values.


    Again, to set these values, you can use any units that make sense. You can also
    use different values for the horizontal and vertical radii, for example:


    ```

    background: radial-gradient(50% 50%, 70% 40%, rgb(75, 75, 255) -> rgb(0, 0, 0);

    ```


    This effect is shown in Figure 4.22.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_135_0.png)


    But as usual, there are more ways to set the radii. CSS3 supplies several keywords
    for setting the radii, which need explaining because they are a bit confusing.
    Consider the following examples (**Figure 4.23**):


    +   background: -o-radial-gradient(30% 50%), circle closest-side,

    → rgb(75, 75, 255), rgb(0, 0, 0));

    background: -o-radial-gradient(30% 50%), ellipse closest-side,

    → rgb(75, 75, 255), rgb(0, 0, 0));


    So, what''s going on here? By using circle and ellipse, you specify that you want
    your gradient to be a circle or an ellipse, respectively. closest-side means that
    the shape will expand so that it touches the container side to the point of origin
    of the radius in the case of a circle and the horizontal and vertical container
    sides closest to the point of origin of the radius in the case of an ellipse.


    > TIP: You can use the keyword contain in place of closest-side.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_135_1.png)'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'FIGURE 4.24 The effects of circle closest-corner and ellipse closest-corner.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_136_0.png)


    FIGURE 4.25 The effects of circle farthest-side and ellipse farthest-side.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_136_1.png)


    Other keyword combinations available to you include:


    +   - **closest-corner** positions the gradient so that its edge touches the corner
    of the element closest to the origin (Figure 4.24).

    - **farthest-side** positions the gradient so that its edge touches the side of
    the farthest element from its centre in the case of a circle or the farthest horizontal
    and vertical sides in the case of an ellipse (Figure 4.25).

    - **farthest-corner** positions the gradient so that its edge touches the corner
    of the farthest element from the origin. You can use the keyword in place of farthest-corner
    (Figure 4.26).'
  merge: -1
  pgno: 136
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_137_0.png)


    I''ve not used these implicit shape values very much, preferring instead to control
    the shape using explicit unit values. But this doesn''t mean you won''t.


    # RADIAL GRADIENT COLOR STOPS


    Color stops work in the same way as the color stops in linear gradients except
    that the units you specify denote distance from the center of the gradient, not
    distance from the starting corner/edge.


    I encourage you to experiment with different color values with the examples I''ve
    provided and otherwise. Creating a sun''s rays or a shadow or flashlight moving
    across the top of your site. Again, use RGBA colors for the win! You''ll see more
    exciting examples throughout the book.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_138_0.png)


    FIGURE **4.27** A simple repeating radial gradient.


    # REPEATING-RADIAL-GRADIENT


    As with linear gradients, you can also create repeating radial gradients by adding
    repeating values into the syntax (**Figure 4.27**):


    ```

    background: -o-repeating-radial-gradient(50% 50%, 60% 60%,

    → rgba(75, 75, 255, 0.5) 10px, rgba(0, 0, 0.5) 20px);

    background-color: #ff0000;

    ```


    # PROVIDING GRADIENT SUPPORT FOR OLD VERSIONS OF IE


    CSS3PIE also supports for CSS gradients. But again, you need to be careful of
    its limited RGBA support. To use CSS3PIE, target a separate, nontparent gradient
    to IE using a special -pie- prefixed background property (bear in mind that CSS3PIE
    doesn''t add support for background-image, just the shorthand). Look at the following
    example from the Monty Python blog (I''ve removed all the less interesting and
    prefixed properties for brevity):'
