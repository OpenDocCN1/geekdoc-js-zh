  md: "The final two lines build the minute and second value into a timer readout,\
    \ for example, 09:43, and then that value is squirted into the timer <div> innerHTML.\n\
    \nThe last set of functions is for the rewind/fast forward functionality:\n\n\
    ```\nfunction mediaBackward() {\n  media.pause();\n  interval = setInterval('media.currentTime\
    \ \n  -> media.currentTime - 3', 200);\n}\nfunction mediaForward() {\n  media.pause();\n\
    \  interval = setInterval('media.currentTime \n  -> media.currentTime + 3', 200);\n\
    }\n```\n\n```\nfunction normalPlay() {\n  clearInterval(interval);\n  media.play();\n\
    }\n```\n\nThe first two functions use setInterval to add or subtract three to/from\
    \ the current time every fifth of a second while the mouse button is held down.\
    \ I also pause the video while this is happening so that it doesn't miss the process.\
    \ There is a setPlaybackRate() method, but I had to fake it like this as that\
    \ method doesn't work in Opera.\n\nWhen the mouse button is not longer pressed,\
    \ the normalPlay() removes the interval, and just starts the video playing as\
    \ normal."
