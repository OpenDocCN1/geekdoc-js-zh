- img_proc: true
  md: "**FIGURE 3.8** A simple text-shadow highlight.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_96_0.png)\n\
    \n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_96_1.png)\n\nThe syntax is pretty intuitive:\n\
    \n```\nh2 {\n  text-shadow: 1px 1px 1px white;\n}\n```\n\nThe first unit values\
    \ set the horizontal and vertical offset of the shadow from the original text,\
    \ respectively. Positive values move the shadow right and down, where negative\
    \ values move the shadow left and up. You can pretty much use any CSS units for\
    \ these values. But generally, using pixels is recommended, ems and percents can\
    \ make shadows move, and you probably won't want the effect varying with the font\
    \ size in most cases.\n\nThe third unit value sets the amount of blur applied\
    \ to the shadow. You can set this to a large value to produce an indistinct shadow\
    \ below the text or set it to 1px to just make it as an outline highlight (in\
    \ which you could just delete the third value altogether, because it defaults\
    \ to 1px when not specified explicitly). Let's run through a couple of examples.\
    \ The preceding code is used in my King Arthur blog example to give the `<h2>`\
    \ not appearing in a background a contrasting highlight to make them more visible\
    \ (Figure 3.8)."
