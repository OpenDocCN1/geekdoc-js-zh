  md: "# OTHER LAYOUT MODULES\nWORTHY OF MENTION\n\nA few other CSS3 layout modules\
    \ are also worth mentioning, although I'll just talk\nabout them briefly, because\
    \ their browser support and finished status is even more\nnonexistent than those\
    \ you've learned about already.\n\n# REGIONS\n\nThe CSS Regions Level 3 spec (http://devw3.org/csswg/css3-regions)\
    \ defines\na set of functionality for specifying different elements to flow content\
    \ into. This\nwas supported in IE10 and Chrome/Safari nationalities at this time\
    \ of writing. But\nat the time, the spec looked to be very much in flux and likely\
    \ to change—hence\nmy unwillingness to cover it in detail.\n\nHowever, for completeness\
    \ I'll walk you through it. See the file-regions-\nms.html in the chapter? code\
    \ download folder for an example that will work in\nIE10. Here you have a set\
    \ of <div> for laying out content into:\n\n```\n<section id=\"layout\">\n<div\
    \ id=\"region1\" class=\"region\"></div>\n<div id=\"region2\"><img src=\"images/sunset.jpg\"\
    \nalt=\"sunset image\"></div>\n<div id=\"region3\" class=\"region\"></div>\n<div\
    \ id=\"region4\" class=\"region\"></div>\n<div id=\"region5\" class=\"region\"\
    ></div>\n</section>\n```\n\nThe actual content is stored in a separate file—region-content.html—and\n\
    included at the bottom of the main page using an iFrame:\n\n```\n<iframe id=\"\
    region-content\" src=\"region-content.html\">\n```\n\nThe region's magics works\
    \ as follows: You identify the source of the content (in\nthis case, the iFrame)\
    \ by its ID and give it a keyword of your choosing:\n\n```\n#region-content {\n\
    \  -ms-flow-into: my-regions;\n}\n```"
  merge: -1
  pgno: 283
- img_proc: true
  md: "# Simple CSS regions example\n\nFIGURE 7.17 Using CSS regions to lay out content\
    \ into a grid.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_284_0.png)\n\nYou have\
    \ dictated where the content should flow by applying your keyword to the relevant\
    \ elements. In this case, I wanted to apply the content into the four divs that\
    \ have a class of region:\n\n```\n.region {\n  padding: 1rem;\n  background-color:\
    \ red;\n  border: 1px solid white;\n  -ms-flow-from: my-regions;\n}\n```\n\nThis\
    \ is how it currently works in IE10, and it produces the layout in Figure 7.17.\
    \ Indeed, you can lay out the page you want using a CSS grid. In any way you want,\
    \ and then put the content into elements of your choosing regions."
  merge: -1
  pgno: 284
- img_proc: true
  md: "Try resizing the browser window and note how the content keeps reflowing inside\
    \ the regions: The reason is that I've set the width of the grid rows using percentages.\
    \ The content starts to flow into the first region in the source order and then\
    \ continues to the second region when the first is filled, and so on.\n\nWebKit-based\
    \ browsers currently support regions but with a different syntax that isn't limited\
    \ to using an iFrame to contain the content:\n\n```\n#region-content {\n  content:\
    \ -webkit-from-flow(\"flow_name\");\n}\n.region {\n  -webkit-flow: \"flow_name\"\
    ;n}\n```\n\nAn example of this that will work in Chrome Canary (at the time of\
    \ this writing) can be seen in simple-regions-webkit.html. Be warned: to enable\
    \ CSS regions in this browser, you currently need to type about:flags in the Chrome\
    \ Canary URL, enable CSS Regions in the settings, and relaunch.\n\n> TIP: In the\
    \ same manner as multi-col, you can use break properties to specify where content\
    \ should and shouldn't break when it is nearing the edge of your regions. See\
    \ http://dev3.org/csswg/css3-regions/#region-flow-break for more details.\n\n\
    # EXCLUSIONS\n\nThe idea behind the CSS Exclusions and Shapes Module Level 3 (http://dev3.org/csswg/css3-exclusions)\
    \ is that you can define a shape or specify an element and then flow content around\
    \ that shape/element, thereby creating complicated layouts. You might see these\
    \ types of layouts in a magazine with text flowing around an image of a mountain\
    \ or a floated image halfway between two columns of text. You can think of exclusions\
    \ as a way to create more powerful flows. Indeed, CSS3 did have a feature called\
    \ positioned flows, which was invented by Microsoft, but this seems to have been\
    \ merged with the Exclusions spec now.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_285_0.png)"
  merge: -1
  pgno: 285
- img_proc: true
  md: "Exclusions aren't supported anywhere at the time of this writing, I'll at least\n\
    give you an idea of how they are supposed to work. To make a more interesting\n\
    float, you could have a simple section with a figure inside it, like this:\n\n\
    ```\n<section>\n  ...\n  <figure> ... </figure>\n  ...\n</section>\n```\n\nYou\
    \ should be able to absolutely position the figure inside the section, and then\n\
    turn it into an exclusion using the wrap-flow property:\n\n```\nfigure {\n  position:\
    \ absolute;\n  color: #fff;\n  top: 30%;\n  left: 40%;\n  wrap-flow: both;\n}\n\
    ```\n\nYou then give it padding and a margin, like so:\n\n```\nfigure {\n  position:\
    \ absolute;\n  color: #fff;\n  top: 30%;\n  left: 40%;\n  wrap-padding: 10px;\n\
    \  wrap-margin: 10px;\n}\n```"
  merge: -1
  pgno: 286
- img_proc: true
  md: 'wrap-flow specifies what side of the exclusion element, in this case the figure,
    you want the text to flow around. You can specify auto, start, end, both, maximum,
    or clear:


    +   - auto is the default: If you set this value, the surrounding text will not
    wrap around the exclusion; it will just sit underneath the exclusion element if
    it doesn''t exist.


    +   - start means that content will wrap around start of the exclusion, but the
    space after the end of it will be left empty of content.


    +   - end means that content will wrap around the end of the exclusion, but the
    space before the start of it will be left empty of content.


    +   - both means that content will wrap around the start and end of the exclusion.


    +   - maximum will cause content to wrap around the side of the exclusion that
    has the largest amount of space next to it.


    +   - clear means that content will only wrap around the top and bottom of the
    exclusion; the space to the left and right (start and end) of it will be left
    empty.


    wrap-margin specifies how much margin you want left between the exclusion element
    and the rest of the content.


    wrap-padding specifies how much padding you want left between the exclusion element
    and the rest of the content.


    If you have multiple exclusions interacting inside the same space, they should
    wrap around another in reverse order of how they are placed in the document. See
    http://dev.w3.org/csswg/css83-exclusions/exclusions-order for more details.


    If you want your content to flow around a more complicated shape, you can define
    the shape of the exclusion will be using the shapes part of the Exclusion spec:
    See http://dev.w3.org/csswg/css83-exclusions/#shapes. You''ll be able to create
    circles, ellipses, and so on to shape your exclusions or even base shapes on images.'
  merge: -1
  pgno: 287
- img_proc: true
  md: "# GCPM\n\nFinally, let's look at the CSS Generated Content for Paged Media\
    \ (GCPM) module (www.w3.org/TR/css3-gcm). This module is currently supported only\
    \ by the experimental \"Opera Reader\" technology, but it is lots of fun to play\
    \ with. You can set your whole web page (or a small part of it) to be paginated\
    \ using rulesets defined in a special paged at-rule:\n\n```\n@media -o-p {\n \
    \ ...\n}\n```\n\nTo set the whole page content, you can do this:\n\n```\n@media\
    \ -o-p {\n  html {\n    height: 100%;\n    overflow: -o-p-x;\n}\n```\n\nWhen you\
    \ load this page in a supporting browser, the whole page content will be paginated,\
    \ and you can flick through the pages by swiping left and right on a touch device,\
    \ and by using arrow keys on a non touch device.\n\nOpera Reader/GCPM has many\
    \ more features besides. See Håkon Wium Lie’s website at http://people.opera.com/howcome/2011/reader\
    \ for experimental builds and a more complete treatment."
  merge: -1
