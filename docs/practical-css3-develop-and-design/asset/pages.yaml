  md: "# EXPLORING GRIDS\n\nThe CSS Grid Positioning Module Level 3 (www.w3.org/TR/css3-grid)\
    \ is designed to allow web designers to lay out web pages neatly in a stable grid.\
    \ You most likely already do this, but usually you create your own grid system\
    \ or use a third-party framework, such as 960 (http://960.gs) or Blueprint CSS\
    \ (http://blueprintcss.org). CSS3 grids offer a native way of creating your own\
    \ grid system, which has to be a good thing.\n\nAt the time of this writing, CSS3\
    \ grids are only supported by IE10 and nightly builds of the WebKit browsers (with\
    \ --ms and --webkit- prefixes, respectively), so I won't cover them in depth.\
    \ However, with a solid example of how I will provide you with simple example\
    \ of how to use them, because they are bound to be important in the future.\n\n\
    In this example you'll put together a simple grid layout using these nu-schule-kool-toolz\
    \ (technical term).\n\n# DEFINING THE GRID STRUCTURE\n\nIn a similar fashion to\
    \ Flexbox, CSS3 grids work by using a custom value of the display property, grid,\
    \ to designate a container as an area of the page that will be laid out using\
    \ CSS3 grids (look at the file simple-grid.html in the chapter7 code download\
    \ folder to follow along with this first example:\n\n```\nbody {\n  display: grid;\n\
    }\n```"
  merge: -1
  pgno: 277
- img_proc: true
  md: "You then divide this container into columns and rows using the grid-columns\
    \ and grid-rows properties, like so:\n\n```\nbody {\n  display: grid;\n  grid-columns:\
    \ 30rem 40rem 30rem;\n  grid-rows: 1fr 1fr 1fr;\n}\n```\n\nThe grid-columns property\
    \ specifies three columns in the grid, and they are 30 rem wide, 40 rem wide,\
    \ and 30 rem wide, respectively. In this case, the grid-rows property is using\
    \ a new CSS unit called fr (fraction), which means I will be this many parts of\
    \ the total big. So in this case you have four rows that are all 1fr big for 4fr.\
    \ Therefore, each row spans 1/4 of the total height of the body.\n\nYou could\
    \ also use percentages, other CSS length units, or auto to specify columns:\n\n\
    ```\nbody {\n  display: grid;\n  grid-columns: 30% 40% 30%;\n  grid-rows: 1fr\
    \ 1fr 1fr;\n}\n```\n\nIn this alternative version, I've changed grid-columns so\
    \ that the columns are percentages (you can see this alternative example in simple-grid2.html).\
    \ Percentages work how you'd expect them to, although you need to be careful about\
    \ using weird combinations of percentages and absolute unit values: If they end\
    \ up as less than 100% in one or both dimensions, you'll waste space and produce\
    \ unexpected results. If they end up as more than 100%, your content may be cut\
    \ off."
  merge: -1
  pgno: 278
- img_proc: true
  md: "# FITTING YOUR CONTENT ONTO THE GRID\n\nNext, you need to start fitting your\
    \ content onto the grid. This is done by applying some special properties to the\
    \ child elements of the container that is set to display as a grid. In this simple\
    \ example, the children look like this:\n\n```\n<header>\n  <h1>Header</h1>\n\
    </header>\n<div id=\"block1\">Block 1</div>\n<div id=\"block2\">Block 2</div>\n\
    <div id=\"block3\">Block 3</div>\n<div id=\"block4\">Block 4</div>\n<footer>\n\
    \  <h2>Footer</h2>\n</footer>\n```\n\nYou can fit these elements to the grid you\
    \ defined earlier using the following properties:\n\n+   - **grid-column** specifies\
    \ the column the child element will be placed in, or start in, in the case of\
    \ children that span multiple columns.\n- **grid-column-span** specifies the number\
    \ of columns that the child element will span (optional).\n- **grid-row** specifies\
    \ the row the child element will be placed in, or start in, in the case of children\
    \ that span multiple rows.\n- **grid-row-span** specifies the number of rows that\
    \ the child element will span (optional)."
  merge: -1
  pgno: 279
- img_proc: true
  md: "FIGURE 7.14 A simple grid layout in action.\n\nSo, for example, you could lay\
    \ out your content like this:\n\n```\nheader {\n  grid-column: 1;\n  grid-column-span:\
    \ 3;\n  grid-row: 1;\n}\n\nfooter {\n  grid-column: 1;\n  grid-column-span: 3;\n\
    \  grid-row: 4;\n}\n\n#block1 {\n  background-color: blue;\n  grid-column: 1;\n\
    \  grid-row: 2;\n  grid-row-span: 2;\n}\n```\n\n/* And so on - look at the code\
    \ file for the rest of it **/\n\nThis simple grid layout is shown in Figure 7.14."
  merge: -1
