  md: "In media-blitz-3-with-media-queries.html, when the first media query kicks\
    \ in, the navigation menu moves to the bottom of the screen. This is the result\
    \ of the following two rulesets:\n\n```\nbody {\n  display: table;\n  table-layout:\
    \ fixed;\n  width: 100%;\n}\n```\n\n```\nnav {\n  display: table-caption;\n  caption-side:\
    \ bottom;\n}\n```\n\nThe table-related properties are CSS2. They were created\
    \ to allow web developers to lay out groups of elements with a tabular structure\
    \ without abusing table markup. An obvious application of CSS tables is to lay\
    \ out forms in an easier fashion (see the file form_csstables.html code download\
    \ in the chapter8 folder). This is basically achieved using markup like this:\n\
    \n+   <ul>\n  <li><label><input></label></li>\n  <li>\n</ul>\n\nand CSS like this:\n\
    \n```\nli {\n  display:table-row;\n}\n```\n\n```\nlabel {\n  display:table-cell;\n\
    }\n```\n\nThe technique I've used in my media query example is the only known\
    \ way to move the position of a child element from side to top to bottom reliably\
    \ without changing the source order. It is a useful technique to keep in mind,\
    \ although bear in mind that these properties don't work in IE7 and earlier."
  merge: -1
