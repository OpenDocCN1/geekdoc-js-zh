  md: "# WEB-FONT PROBLEMS\n\nUnfortunately, web fonts are not without their problems.\
    \ If you really want a professional look to youer your site's text, you need to\
    \ consider your font choices carefully and test them thoroughly. The following\
    \ problems need considerable thought.\n\n# FLASH OF UNSTYLED TEXT (FOUT)\n\nFOUT\
    \ refers to the way some browsers behave (namely Opera, Firefox earlier than version\
    \ 4, and IE earlier than version 10) when they encounter a web font; that is,\
    \ they first render the text without the font applied. Then they download the\
    \ font file and apply it to the text. This can create a jarring and unsightly\
    \ effect, which you've probably witnessed at some point.\n\nThere are a couple\
    \ of solutions to this problem. One solution is the webfont loader from Google\
    \ (http://code.google.com/apis/webfonts/docs/webfont_loader.html), which is a\
    \ JavaScript API with quite few features available. You can include it in your\
    \ page using the following script:\n\n```\n<script src=\"//ajax.googleapis.com/ajax/libs/webfont/1/\\\
    n-> webfont.js\"></script>\n```\n\nYou need to point to the fonts in question\
    \ by putting scripts like the following in your document's <head>; the scripts\
    \ need to be included before your style declarations:\n\n```\n<script>\nWebFont.load({\n\
    \  custom: {\n    families: ['MEgalopolisExtraRegular',\n    -> 'SensationRegular'],\n\
    \  }\n});\n</script>\n```"
  merge: -1
  pgno: 86
- img_proc: true
  md: "The JavaScript targets the fonts and the stylesheets that refer to them. It\
    \ adds classes to the document's `<html>` tag to indicate different stages of\
    \ web-font loading. Before a web font has loaded, the class wf-loading is included.\
    \ During this stage, you can hide the text using a descendant selector:\n\n```\n\
    .wf-loading h1, .wf-loading p {\n  visibility: hidden;\n}\n```\n\nWhen the font\
    \ has finished loading and is ready to be used, the wf-loading class is removed,\
    \ and by a series of -active classes are included instead. Now you can include\
    \ the fonts as desired, like so:\n\n```\n.wf-megalopolisextraregular-n4-active\
    \ h1 {\n  visibility: visible;\n  font-family: MEgalopolisExtraRegular, arial,\
    \ sans-serif;\n}\n```\n\n```\n.wf-sensationregular-n4-active p {\n  visibility:\
    \ visible;\n  font-family: SansationRegular, arial, sans-serif;\n}\n```\n\nIf\
    \ the font fails for some reason, a class of wf-inactive is included instead,\
    \ and you can point to a fallback font:\n\n```\n.wf-inactive body {\n  visibility:\
    \ visible;\n  font-family: sans-serif;\n}\n```\n\n> NOTE: Google also has a free\
    \ Fonts service at www.google.com/webfonts, which is worth checking out if you\
    \ are looking for some decent quality free fonts and want an easy-to-use service.\
    \ The fonts are also hosted by Google, so you'll save some bandwidth.\n\n![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_87_0.png)"
