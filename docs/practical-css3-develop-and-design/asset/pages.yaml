  md: '# GETTING ACROSS THE NEW BREED OF SELECTORS TO

    WORK ACROSS OLDER BROWSERS


    As you''ve gathered, many of the new selectors available don''t work in those
    older versions of IE that are still hanging around (like someone''s rhythmically
    challenged dad on the dance floor at a wedding reception). So what do you have
    of using these selectors in the real world?


    As luck would it, for situations in which you really need old IE support, JavaScript
    can come to the rescue in the shape of Keith Clark''s Selectivizr http://selectivizr.com.
    It sits on top of an existing JavaScript library and adds support to IE 6–8 for
    many of the new selectors.


    To add it in, download Selectivizr and apply it to your site. Then make sure you
    have one of the compatible libraries detailed on the Selectivizr site applied
    to your page (I''m using NWMatcher in my example). The code will look something
    this (again, check out my king author example in the chapter2 code download):


    ```

    <script src="http://s3.amazonaws.com/nwmapi/nwmatcher/

    -> nmatcher-1.2.5-min.js"></script>


    <!---if (ie 6)&(lte 8)>

    <script type="text/javascript" src="script/

    -> selectivizr-min.js"></script>


    <!endif-->

    ```


    And there you go! This CSS3 selector support for IE 6–8 works like a charm!


    > NOTE: Selectivizr works only on CSS contained in

    external stylesheets, not inline or internal CSS.


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_42_0.png)'
