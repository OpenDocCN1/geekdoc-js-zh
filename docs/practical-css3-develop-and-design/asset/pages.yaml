- img_proc: true
  md: "FIGURE 6.18 The menu using Peculiar icons.\n\nI've set the position to absolute\
    \ so that I can move the icons into position and moved them using top and left.\
    \ I've also used a transform to set the desired size of the icons. This was needed\
    \ because the icon shapes are dependent on the 16 x 16 width and height. If you\
    \ mess with those dimensions, the icons become distorted.\n\nThe only step left\
    \ is to set the icons' parent containers—the anchors—to be positioned, so that\
    \ the position I set on the icons earlier will happen relative to them, not the\
    \ `<body>` or another positioned ancestor:\n\n```\nul {\n  position: relative;\n\
    \  ...\n}\n```\n\n**Figure 6.18** shows the result.\nNow, this technique may seem\
    \ pretty damn complicated for producing a set of simple icons, but it does have\
    \ its advantages. Creating icons in pure CSS completely goes away with those extra\
    \ HTTP requests needed for downloading images or web fonts, and the file sizes\
    \ are very small.\n\nThey are infinitely scalable and manipulable (you can grab\
    \ each icon and change its size, shape, color, and so on to use the situation),\
    \ and are great for developers who don't like to use Photoshop very much. Creating\
    \ such icons requires using border-radius a lot, which doesn't work in IE 6-8,\
    \ but can be added via the use of your old friend CSS3IE, which I first met in\
    \ Chapter 4. The transform also won't work in old versions of IE, but the overall\
    \ result looks OK, albeit with smaller icons.\n\nI urge you to learn from these\
    \ icons and try your hand at creating your own! And please send Lucian Marin flowers\
    \ and cake, because it is truly a cool idea."
  merge: -1
