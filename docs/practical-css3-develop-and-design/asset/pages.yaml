    \n# CONTROLLING HYPHENATION\n\nHyphenation has long been a sore point on the web.\
    \ If you want a body of text\nto sit neatly in a containing box, the obvious solution\
    \ in print would be to justify\nthe text and hyphenate words as required to make\
    \ the column work without too\nmany long gaps. This is standard faire, especially\
    \ in newspapers and magazines.\n\nBut on the web, this treatment is difficult\
    \ to achieve: You can't just hyphen\nwords and add line breaks unless you control\
    \ the exact copy, font-\nsize, font, and so on. And this will almost never be\
    \ the case; it\nists't how the web works! Instead, you have to settle for left,\
    \ the case, or centred\ntext; text-align: justify usually looks terrible, especially\
    \ if you have lots of big\nwords in your copy. Figure 3.14 illustrates this perfectly.\n\
    \nCSS3 comes to the rescue with the hyphens property. The three possible ways\n\
    include:\n\n+   - none. No hyphenation occurs. This can be used to turn off inherited\n\
    hyphenation set on a parent element.\n\n+   - manual. Words are hyphenated onto\
    \ separate lines, only there are line-\nbreaking characters present within them\
    \ (like a hyphen character or a soft\nhyphen—for example, &shy);\n\n+   - auto.\
    \ Words are automatically broken at appropriate hyphenation points.\nto work successfully,\
    \ browsers need to recognize the language to be hyphen-\nated. Therefore, hyphens\
    \ only works on markup with a correct language\ndeclared on a parent element via\
    \ the lang attribute."
