    # ### SETTING THE COLUMNS


    To start, use the column-count property to specify the number of columns


    section {


    ```

    column-count: 3;

    ```


    }


    Specifying a number of columns equally divides your content into that number of
    columns across the horizontal space available. The effect shows shown in Figure
    7.1.


    You can immediately see why this is useful: it is so flexible and easy. Prior
    to the introduction of this method, you had to break the content into multiple
    child containers and let float; if content or layout requirements changed, you
    had to modify your markup.


    NOTE: In my code you''ll see to get that the columns some space around the edges
    and line up at the top, I had to apply some padding to the whole <section> and
    remove the top padding from the first main content <h2>. You need to think carefully
    about this kind of styling when trying to get multi-col layouts to look right.
    You''ll learn more about this in a more complicated example later in this chapter.


