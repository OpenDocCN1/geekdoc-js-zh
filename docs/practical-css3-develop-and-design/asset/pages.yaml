  md: 'FIGURE 3.22 Browser-calculated small caps are on the left; proper small caps
    are on the right and are much better! (Font is Magneta Book Italic from Fontdeck.)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_108_0.png)


    FIGURE 3.23 Petite caps (font is Ernestine from http://ie.microsoft.com/testdrive/Graphics/opentype-opentype-font/index.html).


    # SMALL CAPS AND PETITE CAPS


    You can use font-variant: small-caps and text-transform: uppercase to control
    capitalization of your text, but small caps tend to be shrunken capitals. Some
    fonts include dedicated small caps glyphs, which look better than just using text-transform.
    To use these in your page, you''d do this (the result in **Figure 3.22**):


    ```

    -webkit-font-feature-settings: "smcp" 1;

    -moz-font-feature-settings: "smcp=1";

    -ms-font-feature-settings: "smcp" 1;

    ```


    You can use another variant called "petite caps," which is basically more stylized
    capitals (**Figure 3.23**):


    ```

    -webkit-font-feature-settings: "pcap" 1;

    -moz-font-feature-settings: "pcap=1";

    -ms-font-feature-settings: "pcap" 1;

    ```'
  merge: -1
  pgno: 108
- img_proc: true
  md: '![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_109_0.png)


    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_109_1.png)


    FIGURE 3.24 Kerning

    (font is Magneta Book Italic from Fontdeck).


    # KERNING


    Kerning refers to altering the horizontal spacing between characters to make it
    look more even. Kerning is turned on using a single declaration:


    +   -webkit-font-feature-settings: "kern" 1;

    -moz-font-feature-settings: "kern=1"

    -ms-font-feature-settings: "kern" 1;


    The need for kerning is most evident when you have a curved capital with a compact
    lowercase letter and no ascender or descender follows it—for example, in the word
    “Woman” (Figure 3.24).'
  merge: -1
