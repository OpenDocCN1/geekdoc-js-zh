  md: "# CONTROLLING WHERE THE COLUMNS BREAK\n\nA number of properties defined in\
    \ multi-col are intended to allow you to set where columns will break. To illustrate\
    \ this, let's look at the file our-friends-multi-col. It is the same as the previous\
    \ version of this example you saw, but I've added <h3> elements into the mix and\
    \ an unordered list to experiment. As is, the situation isn't gray; you'll need\
    \ to get unsightly column breaks in places, as just after the <h3>s.\n\nTo remedy\
    \ this problem, you need to tell the browser where to break your columns! The\
    \ available break properties and their values are as follows:\n\n+   **break-before**.\
    \ Controls breaking before the element(s) being selected. Possible values are\
    \ auto, always, avoid, column, and avoid-column.\n\n+   **break-after**. Controls\
    \ breaking after the element(s) being selected. Possible values are auto, always,\
    \ avoid, column, and avoid-column.\n\n+   **break-inside**. Controls breaking\
    \ inside the element(s) being selected. Possible values are auto, always, avoid,\
    \ and avoid-column.\n\n> NOTE: There are other break property values besides those\
    \ listed, but they only apply to paging media: avoid-page, left, page, and right.\n\
    \nTo stop the columns from breaking after headings, you could use the follow-ing\
    \ rules:\n\n```\nh3 {\n  break-after: avoid-column;\n}\n```\n\nIt is also best\
    \ to always break columns before the <h3>s so they appear at the top of the columns.\
    \ This can be done like so:\n\n```\nh3 {\n  break-before: column;\n}\n```\n\n\
    ![](img/5d33e8fe2d698793ed90e54ed1c4b2d0_259_0.png)"
  merge: -1
  pgno: 259
- img_proc: true
  md: "# A REAL MULTI-COLUMN LAYOUT\n\nLet's finish off this section with a slightly\
    \ more complicated example—a more traditional multi-col layout with different\
    \ elements in each column rather than just a single body of text split into columns.\
    \ Check out the our-friends-multi-col. the first version of my parody Disney movie.\
    \ It contains more complicated content: six character bios. Each bio consists\
    \ of a heading, image, and paragraph:\n\n```\n<article>\n<h2>...</h2>\n<img src=\"\
    \" alt=\" \">\n<p>...</p>\n</article>\n```\n\nThe only multi-col property this\
    \ uses is column-width, which allows the number of columns to change at different\
    \ widths without modifying the content.\n\n```\nsection {\n  ...\n  column-width:\
    \ 36rem;\n}\n```\n\nTo get the columns to sit well, I set a fixed height on the\
    \ articles:\n\n```\narticle {\n  ...\n  height: 45rem;\n  ...\n}\n```\n\nYou are\
    \ now in possession of a useful little multi-column layout (Figure 7.6). This\
    \ layout is actually very quick to implement and is flexible, compared to using\
    \ floats."
