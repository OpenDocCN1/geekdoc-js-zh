  md: "Now that we have an idea of what the data should look like, we now need to\
    \ choose data structures for the implementation. To store volumes, we'll use a\
    \ simple JSON object. This data structure is analogous to a hash table in other\
    \ programming languages, and will allow for near-constant lookup time. In other\
    \ words, the time taken to retrieve an element remains roughly the same as the\
    \ size of the data structure grows. To store prices, I have adapted Marijn Haverbeke's\
    \ binary heap. No need for me to go into the technical details of the implementing\
    \ a binary heap because Marijn does an excellent job in his online book.⁶\n\n\
    > ### Objects as Hash Tables\n\nGuillermo Rauch has written an article about some\
    \ of the pitfalls of using an object as a hash.⁷ The main danger lies in potential\
    \ collisions that can occur when users are allowed to provide arbitrary input.\
    \ This does not apply in our case because the inputs to the object are strictly\
    \ under our control.\n\nWe will make two small modifications. First, we allow\
    \ the user to pass a flag indicating whether the heap is maximum or minimum (that\
    \ is, whether it starts at the largest value or smallest value). This is done\
    \ by transforming the original code:\n\n```\nthis.content.push(element);\n```\n\
    \n... into the following:\n\n```\nif (this.options.max) {\n    this.content.push(-element);\n\
    }\nelse\n    this.content.push(element);\n```\n\nIf users wish for a maximum heap,\
    \ all that they need do is reverse the sign of the number. Internally, the data\
    \ structure still finds the smallest number. However, the smallest negative number\
    \ when examining negative values ends up being the largest when considering the\
    \ absolute value."
  merge: -1
