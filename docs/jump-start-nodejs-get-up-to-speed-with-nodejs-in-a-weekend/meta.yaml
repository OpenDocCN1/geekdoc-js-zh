  md: "```\n    ,host = envHost != null ? envHost: 'localhost'\n    ,port = envPort\
    \ != null ? envPort: Connection.DEFAULT_PORT;\n\nvar db = new Db('nockmarket'\n\
    \    ,new Server(host, port, {})\n    ,{native_parser:false});\n```\n\nMost of\
    \ the setup code is standard import and initialization. The one new item here\
    \ is the **process** object, a way to interact with the native environment. It\
    \ can perform operations such as changing directories, inspecting memory usage,\
    \ and determining uptime.⁶\n\nHere we use it to inspect environment variables,\
    \ in particular hostname and port. In general, it's good practice to store configuration\
    \ details such as hostnames, port names, usernames, and passwords outside of source\
    \ code.\n\nImagine you have a production system and you wish to change the database\
    \ port. If this is stored in source code, you'll need to change the source code\
    \ and redeploy the system. In the meantime, a developer has sadly failed to follow\
    \ a test-driven design and has introduced a bug into the system. This bug will\
    \ be deployed into production just because we wanted to alter the port.\n\nSome\
    \ options for storing configuration details include:\n\n+   - plain-text configuration\
    \ files\n- database storage\n- environment variables\n\nIn all of these cases,\
    \ it is possible to alter the configuration without modifying source code. For\
