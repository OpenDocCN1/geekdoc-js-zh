  md: '# Chapter 5


    # The Real-time Web


    > "If everything seems under control, you’re not going fast enough." —Mario Andretti


    Welcome to arguably the most important chapter in the book. Here we will learn
    the basics of building a real-time chat website. This is made easy thanks to a
    package called Socket.IO,¹ or, if you like, “jQuery for sockets.” What this means
    is you only have to learn the Socket.IO API. Under the hood, the API might be
    using WebSockets, Flash, Comet, and, in the future, technology that is yet to
    exist! Socket.IO will seamlessly change protocols depending on the user’s browser
    capabilities without you having to write any additional code.


    By the end of this chapter, you’ll have written a real-time chat application with
    the ability to detect connecting and disconnecting users. You will have also connected
    Socket.IO to the stock-market simulator we built in Chapter 2 to stream real-time
    trades to a browser. Lastly, you’ll have seen how Socket.IO can be used as a replacement
    for Ajax and traditional forms.


    ¹ http://socket.io/'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'Jump Start Node.js


    # Let''s Chat


    Enter WebSocket.² In the words of the author, “The goal … is to provide a mechanism
    for browser-based applications that need two-way communication with servers that
    does not rely on opening multiple HTTP connections (for example, using `<iframe>`s
    or `XMLHttpRequest` and long polling).”


    WebSocket is a modern, bidirectional protocol that enables an interactive communication
    session between the browser and a server. Its main current drawback is that implementation
    is generally only available in the latest browsers. However, by using Socket.IO,
    this low level detail is abstracted away and you, as the programmer, are relieved
    of the need to write browser-specific code. Let us now see how we can incorporate
    this technology into our application.


    We’ll begin by building the prototypical chat application. Perhaps our users will
    wish to discuss with each other the merits of including more Apple stock in their
    portfolios, or the implications of the latest Federal Reserve meeting. Almost
    everybody is introduced to Socket.IO through a basic chat application. Although
    there are numerous examples of how to build such an application in very few lines
    of code, most of them are simplified, as they request that the user enter a display
    name. This removes the complication of connecting Socket.IO to an authorization
    system, which we’ll actually be learning how to do.


    Socket.IO is platform-agnostic and without built-in support for Express.js. There
    is some work involved in allowing Socket.IO access to the user ID session variable
    that we stored in Chapter 4. However, this step is crucial in using Socket.IO
    in a real-world environment.


    Let’s begin with an easier problem: building a front-end interface with our newly
    acquired Bootstrap skills. First, let’s modify **portfolio.ejs** to add a new
    **Chat** tab:


    ```

    chapter05/views/portfolio.ejs (excerpt)


    <li><a href="#tab2" data-toggle="tab">Nockmarket</a></li>

    <li><a href="#tab3" data-toggle="tab" id="chat-tab">Chat</a></li>

    ```


    ² http://tools.ietf.org/html/rfc6455'
