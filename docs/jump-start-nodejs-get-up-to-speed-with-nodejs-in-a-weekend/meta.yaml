- md: "## Jump Start Node.js\n\n```javascript\nchapter04/routes/nockroutes.js (excerpt)\n\
    },\n\nportfolio: function(req, res) {\n  res.render('portfolio');\n},\n\nlogin:\
    \ function(req, res) {\n```\n\nNow when you log in, you should see a similar sight\
    \ to that portrayed in Figure 4.5.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_104_0.png)\n\
    \nFigure 4.5. Time to diversify your portfolio\n\nThe tabs are functional so you\
    \ can click between them, even if the current content is a little sparse. Now\
    \ that we have our template, the last step is to write the front-end code to display\
    \ added stocks with their prices. Let’s start by adding our client-side JavaScript\
    \ to **portfolio.ejs**:\n\n```html\nchapter04/views/portfolio.ejs (excerpt)\n\n\
    <script type=\"text/javascript\" src=\"http://twitter.github.com/bootstrap/assets/js/bootstrap-tab.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"/js/portfolio.js\"></script>\n\
    </head>\n```\n\nNow create `/public/js/portfolio.js` as follows:\n\n```javascript\n\
    chapter04/public/js/portfolio.js\n\n$(document).ready(function() {\n  $('#add-stock').click(function(e)\
    \ {\n    $.ajax({\n      type: 'POST',\n      url: '/add-stock/',\n      data:\
    \ {stock: $('#stock').val()}\n    }).done(function(price) {\n      $('.stock-list').append('<tr><td>'\
    \ + $('#stock').val()\n          + '</td><td>' + price + '</td></tr>');\n    });\n\
    \  });\n});\n```\n\nHere we use the jQuery's ajax function to submit a POST request\
    \ to our Node.js server. Our server will return the stock price, at which point\
    \ we manually append the data to our table:\n\n```javascript\n$('.stock-list').append('<tr><td>'\
    \ + $('#stock').val()\n    + '</td><td>' + price + '</td></tr>');\n```\n\nThis\
    \ code is simply concatenating raw HTML with data. Although this is fine for simple\
    \ issues, more complicated problems are best managed through a framework, one\
    \ of which we'll explore in Chapter 6. Now as you begin adding stocks to your\
    \ portfolio, you should have a view resembling Figure 4.6.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_105_0.png)\n\
    \nFigure 4.6. Your portfolio with new stocks\n\nThe last task is to make the portfolio\
    \ display when the page initially loads. Currently, if you refresh the page the\
    \ stocks will no longer be displayed. First, we load the data in Node.js. Make\
