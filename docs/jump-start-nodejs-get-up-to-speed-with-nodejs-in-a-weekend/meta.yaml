    \ built on jQuery and available at Highcharts.¹¹ Place the following just below\
    \ the definition of app. It will be necessary to overwrite the previous “Hello\
    \ world” code for the / route.\n\n```\nchapter03/nockmarket.js (excerpt)\n\nvar\
    \ app = express.createServer();\napp.configure(function () {\n  app.set('views',\
    \ __dirname + '/views');\n  app.set('view engine', 'ejs');\n  app.use(express.static(__dirname\
    \ + '/public'));\n});\napp.set('view options', {\n  layout: false\n});\napp.get('/',\
    \ function(req, res) {\n  res.render('chart');\n});\n```\n\nIn the configure function,\
    \ we first define the template directory and then EJS (Embedded JavaScript) as\
    \ the templating engine. By specifying layout: false, we indicate that no default\
    \ layout is being used as a template. `express.static` is used to indicate the\
    \ directory where we'll store static files such as stylesheets and images. Lastly,\
    \ we modify the / route to display our chart template.\n\nPaste the code from\
    \ https://gist.github.com/3949958 into /views/chart.ejs.\n\nJust about all the\
    \ code is specifically related to the Highstock package, so I'll skip discussing\
    \ it. It is primarily Highstock-specific configuration.\n\nThe final result should\
    \ look like Figure 3.4 when you visit http://localhost:3000."
- md: "Figure 3.4. Visualizing our data\n\nCongratulations, you have now mastered\
    \ the basics of using MongoDB with Node.js. You now know how to insert and extract\
    \ arbitrary JSON from MongoDB. You can construct a REST API that can be consumed\
    \ by both internal and external clients. Finally, you have explored one way of\
    \ presenting this data to end users.\n\n## Summary\n\nIn this chapter, we have\
    \ covered the following:\n\n- an introduction to MongoDB and what differentiates\
    \ it from traditional relational database technology\n- MongoDB installation and\
    \ an overview of the two main drivers\n- basic inserting, finding, and sorting\n\
    - using the native process object and http module\n- using map to transform collections\n\
    - building a REST API\n- presenting JSON data to the user\n\n# Chapter 4\n\n##\
    \ Beautifying with Bootstrap\n\n> “When you’re a carpenter making a beautiful\
    \ chest of drawers, you’re not going to use a piece of plywood on the back, even\
    \ though it faces the wall and nobody will ever see it. You’ll know it’s there,\
    \ so you’re going to use a beautiful piece of wood on the back. For you to sleep\
    \ well at night, the aesthetic, the quality, has to be carried all the way through.”\n\
    \n—Steve Jobs\n\n## Introduction\n\nAs a budding server-side engineer, your primary\
    \ job is to make your application fast, make it work, and make it scalable. Making\
    \ it pretty is generally outside of your job description. Nonetheless, there are\
    \ now frameworks and toolkits available to make your web pages very presentable,\
    \ even if they lack the final polish that a professional designer can provide.\
    \ In this chapter, we’ll introduce one such framework, Bootstrap,¹ an open-source\
    \ project released by Twitter.\n\n¹ http://twitter.github.com/bootstrap/\n\nBy\
    \ the end of this chapter, you will have built a competent authentication system,\
    \ which will supersede the toy systems we’ve built in prior chapters. After building\
    \ a module that allows users to sign up and log in, we’ll then create a module\
    \ enabling users to add stocks to their portfolios. As icing on the cake, we’ll\
    \ retrieve live stock prices by adapting some of the code written in Chapter 2.\
    \ Aside from learning about Bootstrap, we’ll also build and extend upon some of\
    \ the basic MongoDB skills acquired in Chapter 3.\n\n## Sign Up, Sign In\n\nOur\
    \ first task is to revisit the authentication module. Since you now know the basics\
    \ of MongoDB, we’ll be able to build a real module, instead of a mock one. Using\
    \ Bootstrap, a basic well-designed web page is easy to construct. Once again,\
    \ we will build on the work from the prior chapter. Modify **nockmarket.js** to\
    \ replace the / route as follows:\n\n```\nchapter04/nockmarket.js (excerpt)\n\n\
    app.get('/', nockroutes.getIndex);\n```\n\nThis looks a lot simpler than our previous\
    \ routing code, and that’s the intention. At the moment, our **nockmarket.js**\
    \ does a few too many things: from setting up the Express.js server to doing order\
    \ submissions to performing some business logic. Handling multiple roles in a\
    \ single file works for simple applications, but quickly becomes unmanageable\
    \ as complexity increases. Modularization is one of the keys to managing complexity,\
    \ and here we will separate routing into another module.\n\nIt’s time to introduce\
    \ the concept of having separate, dedicated routing files. Create **routes/nockroutes.js**\
    \ as follows:\n\n```\nchapter04/routes/nockroutes.js\n\nmodule.exports = {\n \
    \ getIndex: function(req, res) {\n    res.render('index');\n  }\n}\n```\n\nHere\
    \ we use the familiar module.exports to expose a function that renders the index\
    \ template. To gain access to the routing file, we need an additional import in\
    \ nockmarket.js:\n\n```\nchapter04/nockmarket.js (excerpt)\n, nocklib = require('./lib/nocklib')\n\
    , nockroutes = require('./routes/nockroutes.js')\n, timeFloor = 500\n```\n\nWe\
    \ can create the landing page by placing the following code into index.ejs within\
    \ the views directory:\n\n```\nchapter04/views/index.ejs (excerpt)\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Nockmarket</title>\n\
    \  <meta name=\"viewport\"\n    content=\"width=device-width, initial-scale=1.0\"\
    >\n  <link href=\"http://twitter.github.com/bootstrap/assets/css/\n    bootstrap.css\"\
    \ rel=\"stylesheet\">\n  <link href=\"http://spbooks.github.com/nodejs1/docs.css\"\
    \n    rel=\"stylesheet\">\n  <script src=\"http://twitter.github.com/bootstrap/assets/js/\n\
    \    google-code-prettify/prettify.js\"></script>\n</head>\n<body>\n  <div class=\"\
    container\">\n    <div class=\"marketing\"><h1>Nockmarket</h1>\n      <p class=\"\
    marketing-byline\">Welcome to the Node.js\n        stockmarket</p>\n      <div\
    \ class=\"row offset2\">\n        <div class=\"span4\"><img\n          src=\"\
    http://twitter.github.com/bootstrap/assets/img/\n            glyphicons/glyphicons_079_podium.png\"\
    \ class=\"bs-icon\" alt=\"\">\n          <h2>Real Prices</h2>\n          <p>Here\
    \ you will be able to sign up for an account and\n            create a stock portfolio\
    \ with live prices. This will\n            combine the beauty of Bootstrap with\
    \ the performance of\n            Node.js to create a well designed, blazing fast\
    \ stock\n            tracking tool.\n</p>\n</div>\n<div class=\"span4\"><img\n\
    \    src=\"http://twitter.github.com/bootstrap/assets/img/\nglyphicons/glyphicons_266_book_open.png\"\
    \ class=\"bs-icon\" alt=\"\">\n    <h2>Live Data</h2>\n    <p>We will also construct\
    \ a dummy portfolio to show you how\n        to stream real-time data straight\
    \ into your browser. Once\n        you have mastered the basics you will be able\
    \ to stream\n        any type of data from tweets, to chat to auction data.\n\
    \    </p>\n</div>\n</div>\n</div>\n<header class=\"jumbotron masthead\">\n  <div\
    \ class=\"inner\">\n    <p class=\"download-info\">\n      <a data-toggle=\"modal\"\
    \ href=\"#\" class=\"btn btn-large\">Log In</a>\n      <a data-toggle=\"modal\"\
    \ href=\"#\"\n        class=\"btn btn-primary btn-large\">Sign Up</a>\n    </p>\n\
    \  </div>\n</header>\n</div>\n</body>\n</html>\n```\n\nThere is nothing fancy\
    \ about this code; it’s just plain old HTML. We’ll discuss some of the Bootstrap\
    \ features later. Now when you run node nockmarket and go to http://localhost:3000,\
    \ you should see the beautifully rendered page in Figure 4.1.\n\nIt’s much better-looking\
    \ than the plain vanilla forms we built in the first chapter! The effects you\
    \ see are the result of hard work by the talented designers at Twitter following\
    \ the principles of beautiful design. Bootstrap is a collection of well-designed\
    \ widgets, plus some supporting JavaScript for added color. In the remainder of\
    \ this chapter, we will see how we can combine this library with Node.js to build\
    \ software that possesses both function and form.\n\n## Nockmarket\n\nWelcome\
    \ to the Node.js stockmarket\n\n### Real Prices\n\nHere you will be able to sign\
    \ up for an account and create a stock portfolio with live prices. This will combine\
    \ the beauty of Bootstrap with the performance of Node.js to create a well designed,\
    \ blazing fast stock tracking tool.\n\n### Live Data\n\nWe will also construct\
    \ a dummy portfolio to show you how to stream real-time data straight into your\
    \ browser. Once you have mastered the basics you will be able to stream any type\
    \ of data from tweets, to chat to auction data.\n\nLog In\n\nSign Up\n\nFigure\
    \ 4.1. Our beautifully rendered landing page\n\nThe next step is to modify the\
    \ code to incorporate some **modal windows**. Modals are the widgets that will\
    \ allow users to enter their username and password. Bootstrap provides an implementation\
    \ of modals, which includes both the front-end design and the associated JavaScript.\
    \ We need to add the Bootstrap JavaScript code along with jQuery to **index.ejs**:\n\
    \n```\nchapter04/views/index.ejs (excerpt)\n<script src=\"http://twitter.github.com/bootstrap/assets/js/google-code-prettify/prettify.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/jquery.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-button.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-modal.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-transition.js\"\
    ></script>\n</head>\n```\n\nNote that for better performance, you may combine\
    \ and minify your Bootstrap files or use a content delivery network.² Next, we\
    \ add some HTML code for the modal, which can be found at https://gist.github.com/3968474:³\n\
    \n² http://www.bootstrapcdn.com/\n³ For more details on modals, the Bootstrap\
    \ site is an excellent reference [http://twitter.github.com/bootstrap/javascript.html#modals]"
  mdcn: "\n图 3.4. 数据可视化\n\n恭喜，你现在已经掌握了使用 MongoDB 和 Node.js 的基础知识。你已经知道如何从 MongoDB\
    \ 中插入和提取任意 JSON 数据。你可以构建一个可以被内部和外部客户端使用的 REST API。最后，你探索了一种向最终用户展示这些数据的方式。\n\n\
    ## 总结\n\n在本章中，我们涵盖了以下内容：\n\n-   MongoDB 简介及其与传统关系数据库技术的区别\n-   MongoDB 安装以及两个主要驱动程序的概述\n\
    -   基本的插入、查找和排序\n-   使用原生 process 对象和 http 模块\n-   使用 map 转换集合\n-   构建 REST API\n\
    -   向用户展示 JSON 数据\n\n# 第 4 章\n\n## 使用 Bootstrap 美化\n\n> “当你是一名木匠制作一个漂亮的抽屉柜时，你不会在背面使用一块胶合板，即使它面对着墙壁，没有人会看到它。你知道它在那里，所以你会在背面使用一块漂亮的木头。为了让你晚上睡个好觉，美学，品质，必须贯穿始终。”\n\
    \n—史蒂夫·乔布斯\n\n## 介绍\n\n作为一名新兴的后端工程师，你的主要工作是让你的应用程序快速、可用和可扩展。让它变得漂亮通常不在你的工作描述之内。尽管如此，现在有框架和工具包可以使你的网页非常美观，即使它们缺少专业设计师提供的最后润色。在本章中，我们将介绍这样一个框架——Bootstrap，¹\
    \ 这是由 Twitter 发布的一个开源项目。\n\n¹ http://twitter.github.com/bootstrap/\n\n到本章结束时，你将构建一个功能完备的身份验证系统，它将取代我们在前面章节中构建的玩具系统。在构建了允许用户注册和登录的模块之后，我们将创建一个允许用户将股票添加到其投资组合中的模块。作为锦上添花，我们将通过修改第\
    \ 2 章中编写的一些代码来获取实时股票价格。除了学习 Bootstrap 之外，我们还将基于第 3 章中获得的一些基本 MongoDB 技能进行构建和扩展。\n\
    \n## 注册，登录\n\n我们的第一个任务是重新审视身份验证模块。由于你现在了解了 MongoDB 的基础知识，我们将能够构建一个真实的模块，而不是一个模拟模块。使用\
    \ Bootstrap，构建一个基本设计良好的网页很容易。再一次，我们将基于前一章的工作进行构建。修改 **nockmarket.js** 以替换 / 路由，如下所示：\n\
    \n```\nchapter04/nockmarket.js (节选)\n\napp.get('/', nockroutes.getIndex);\n```\n\
    \n这看起来比我们之前的路由代码简单多了，这正是目的所在。目前，我们的 **nockmarket.js** 做的事情有点太多了：从设置 Express.js\
    \ 服务器到提交订单再到执行一些业务逻辑。在单个文件中处理多种角色对于简单的应用程序是可行的，但随着复杂性的增加，它很快就会变得难以管理。模块化是管理复杂性的关键之一，在这里我们将把路由分离到另一个模块中。\n\
    \n是时候引入拥有独立、专用路由文件的概念了。创建 **routes/nockroutes.js**，如下所示：\n\n```\nchapter04/routes/nockroutes.js\n\
    \nmodule.exports = {\n  getIndex: function(req, res) {\n    res.render('index');\n\
    \  }\n}\n```\n\n这里我们使用熟悉的 module.exports 来暴露一个渲染索引模板的函数。要访问路由文件，我们需要在 nockmarket.js\
    \ 中添加一个额外的导入：\n\n```\nchapter04/nockmarket.js (节选)\n, nocklib = require('./lib/nocklib')\n\
    , nockroutes = require('./routes/nockroutes.js')\n, timeFloor = 500\n```\n\n我们可以通过将以下代码放入\
    \ views 目录中的 index.ejs 来创建登陆页面：\n\n```\nchapter04/views/index.ejs (节选)\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Nockmarket</title>\n\
    \  <meta name=\"viewport\"\n    content=\"width=device-width, initial-scale=1.0\"\
    >\n  <link href=\"http://twitter.github.com/bootstrap/assets/css/\n    bootstrap.css\"\
