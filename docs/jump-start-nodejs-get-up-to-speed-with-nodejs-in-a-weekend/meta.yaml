  md: "# # Authentication\n\nLet's begin by modifying the front end to add a login\
    \ modal. We construct the modal by including the code at https://gist.github.com/3968470\
    \ in `index.ejs`:\n\n```\nchapter04/views/index.ejs (excerpt)\n\n</div>\n<!--\
    \ paste code here -->\n<div class=\"container\">\n```\n\nWe will now modify the\
    \ href value for the login button to trigger the modal:\n\n```\nchapter04/views/index.ejs\
    \ (excerpt)\n\n<div class=\"inner\">\n  <p class=\"download-info\">\n    <a data-toggle=\"\
    modal\" href=\"#loginModal\"\n       class=\"btn btn-large\">Log In</a>\n  </p>\n\
    </div>\n```\n\nAs a quick check at this point, refresh the page and click on **Log\
    \ In**. Now we can write a library function to authenticate the user. Add the\
    \ following to `nocklib.js`:\n\n```\nchapter04/lib/nocklib.js (excerpt)\n\nmodule.exports\
    \ = {\n  authenticate: function(username, password, callback) {\n    db.findOne('users',\
    \ {username: username}, function(err, user) {\n      if (user && (user.password\
    \ === encryptPassword(password)))\n        callback(err, user._id);\n      else\n\
    \        callback(err, null);\n    });\n  },\n  ...\n```\n\n+   1. Here we retrieve\
    \ the user from the database. First we check whether the user exists, and then\
    \ that the given password matches the encrypted password in the database.\n2.\
    \ If there is a match, we return the ID.\n3. Otherwise we return null."
