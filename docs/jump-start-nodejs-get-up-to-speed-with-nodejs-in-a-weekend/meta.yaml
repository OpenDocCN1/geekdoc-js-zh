    \ oldVolume;\nif (newVolume > 0)\n    orderBook.volumes[price] = newVolume;\n\
    ```\n\nLastly, we return all the data back from our function:\n\n```\nreturn cloned;\n\
    ```\n\n## A Little More Action\n\nSo now we're done. Just kidding. What's the\
