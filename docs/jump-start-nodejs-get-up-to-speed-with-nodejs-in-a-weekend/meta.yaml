  mdcn: "\n我有多次使用 Node.js 的经验，希望你在阅读本书以及使用 Node.js 解决实际问题时，也能获得同样的满足感。\n\n## 谁应该阅读本书\n\
    \n本书面向两类目标读者。你可能是一位对服务端开发感兴趣的前端工程师。即使你不熟悉某些服务端工程技术，已有的 JavaScript 知识也会大有裨益。请放心，到本书结束时，相关主题会被详细涵盖，足以让你知道如何将前端技能应用于后端问题。\n\
    \n第二类潜在读者是使用 PHP、Python、Ruby、Java 或 .NET 等其他语言的服务端工程师。你将获得的主要好处是，看到你已有的架构、设计和模式知识如何应用于\
    \ Node.js 的世界。你可能对 JavaScript 知之甚少甚至一无所知，但这不应构成大障碍。就设计而言，它是一门易于学习的语言，我们将在本书结束前涵盖许多关于其语法和独特特性的示例。\n\
    \n## 本书内容\n\n本书包含以下七章。\n\n-   第 1 章：*走近你的服务器*\n    介绍 Node.js，并解释其特性和优势。然后，我们构建一个简单的应用程序来引入\
    \ Node.js。该应用程序将表单数据发送到 MongoDB（一种 NoSQL 数据库）。\n\n-   第 2 章：*函数式编程*\n    本章介绍如何使用\
    \ Node.js 进行函数式风格的编程。我们将构建一个股票交易引擎，它能够接受订单并匹配交易。\n\n-   第 3 章：*持久化是值得的*\n    在这里，我们将探索\
    \ MongoDB。我会解释 MongoDB 的用例以及它与传统 SQL 数据库的比较。然后，我们将研究 MongoDB 查询语言，并展示如何将其集成到你的\
    \ Node.js 项目中。\n\n-   第 4 章：*用 Bootstrap 美化*\n    Bootstrap 是 Twitter 的一个前端框架，可以轻松构建具有专业外观的网站。我们将查看一些最常用的控件，并用它们构建一个登录界面和股票投资组合跟踪器。\n\
    \n-   第 5 章：*实时网络*\n    在本章中，我们将研究 Socket.IO。我们将看到，学习一个简单的 API 如何能够在各种项目中实现实时通信，而无需担心浏览器版本或通信协议。\n\
    \n-   第 6 章：*Backbone*\n    在本章中，我们将讨论框架在管理客户端 JavaScript 方面的作用。然后，我们将展示如何通过在浏览器中实时更新交易，将\
    \ Backbone.js 整合到你的项目中。\n\n-   第 7 章：*生产环境*\n    在最后一章，我们将审视开发环境和生产环境之间的主要区别。在部署应用程序并使其上线运行之前，我们将介绍各种部署选项。\n\
    \n## 在哪里获取帮助\n\nNode.js 代表了 Web 开发的一次范式转变，它提供了一种从前端到后端统一的语言。它在 GitHub 上的人气激增，因此很有可能在你阅读本书时，Node.js\
    \ 平台的某些小细节已经与本书中的描述有所不同。值得庆幸的是，SitePoint 拥有一个活跃的 JavaScript 开发者社区，如果你遇到困难，他们随时准备提供帮助，我们还为本书维护了一份已知勘误列表，你可以查阅以获取最新更新。\n\
    \n### SitePoint 论坛\n\nSitePoint 论坛¹ 是一个讨论论坛，你可以在这里提出任何与 Web 开发相关的问题。当然，你也可以回答问题。这就是讨论论坛网站的运作方式——有些人提问，有些人回答，而大多数人两者兼顾。分享你的知识既有益于他人，也能加强社区联系。那里聚集了许多有趣且经验丰富的网页设计师和开发者。这是学习新知识、快速获得问题解答以及享受乐趣的好方法。\n\
    \nJavaScript & jQuery 论坛² 可能是提出任何问题的最佳去处。\n\n### 本书网站\n\n本书的配套网站位于 http://www.sitepoint.com/books/nodejs1/，你将可以访问以下资源：\n\
    \n### 代码存档\n\n在你学习本书的过程中，你会注意到多处提及代码存档。这是一个可下载的 ZIP 压缩包，包含了本书印刷的每一行示例源代码。如果你想“作弊”（或者为了预防腕管综合征），那就尽管下载存档吧。³\n\
    \n### 更新与勘误\n\n没有一本书是完美的，我们期望细心的读者在本书结束前能发现至少一两个错误。本书网站上的勘误页面将始终提供有关已知印刷和代码错误的最新信息。\n\
    \n### SitePoint 新闻简报\n\n除了像本书这样的书籍，SitePoint 还发布免费的电子邮件新闻简报，如 *SitePoint*、*JSPro*、*PHPMaster*、*CloudSpring*、*RubySource*、*Design-Festival*\
    \ 和 *BuildMobile*。在这些简报中，你将阅读到有关 Web 开发各个方面的最新新闻、产品发布、趋势、技巧和技术。请在 http://www.sitepoint.com/newsletter/\
    \ 注册一份或多份简报。\n\n### 你的反馈\n\n如果你无法通过论坛找到答案，或者出于任何其他原因希望联系 SitePoint，最好的方式是写信至 books@sitepoint.com。我们拥有一套人员配备完善的电子邮件支持系统，用于跟踪你的咨询。如果我们的支持团队成员无法回答你的问题，他们会直接将问题转给我们。我们特别欢迎你提出改进建议，以及通知我们可能发现的任何错误。\n\
    \n### SitePoint 之友\n\n感谢你购买本书。我们真心感谢你的支持！我们现在将你视为“SitePoint 之友”，因此想邀请你访问我们专属的“SitePoint\
    \ 之友”页面。⁴ 在这里，你只需使用密码：**friends**，即可在一系列超酷的 SitePoint 产品上享受最高 43% 的优惠。\n\n###\
    \ 在线测验\n\n一旦你掌握了 Node.js，可以用我们的在线测验来测试自己。测验基于本书内容，只有真正的 Node.js 忍者才能获得满分。请前往 http://quizpoint.com/#categories/NODE.JS。\n\
    \n## 致谢\n\n我要感谢 SitePoint 的优秀团队，他们在我出版第一本书的过程中给予了我指导：感谢 Simon Mackie 耐心回答我所有的问题并让一切保持正轨；感谢\
