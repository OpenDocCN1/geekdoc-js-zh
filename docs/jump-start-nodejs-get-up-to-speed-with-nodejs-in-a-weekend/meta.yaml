    \ so this is another reasonable division. In JSON, this would resemble the following:\n\
    \n```json\nexchangeData: {\n  buys: {prices: ..., volumes: ...},\n  sells: {prices:\
    \ ..., volumes: ...}\n}\n```\n\n> **JavaScript Object Notation**\nCreated by Douglas\
    \ Crockford, **JSON** stands for JavaScript Object Notation.⁴ While derived from\
    \ the JavaScript syntax, it is very widely used as an all-purpose data exchange\
    \ format. It’s rapidly becoming the *lingua franca* for data interchange over\
    \ the Web⁵ and is adopted by titans of the industry such as Facebook and Twitter.\n\
    \n⁴ https://developer.mozilla.org/en-US/docs/JSON\n⁵ https://dev.twitter.com/docs/twitter-ids-json-and-snowflake\n\
    \nNow that we have an idea of what the data should look like, we now need to choose\
    \ data structures for the implementation. To store volumes, we'll use a simple\
    \ JSON object. This data structure is analogous to a hash table in other programming\
    \ languages, and will allow for near-constant lookup time. In other words, the\
    \ time taken to retrieve an element remains roughly the same as the size of the\
    \ data structure grows. To store prices, I have adapted Marijn Haverbeke's binary\
    \ heap. No need for me to go into the technical details of the implementing a\
    \ binary heap because Marijn does an excellent job in his online book.⁶\n\n###\
    \ Objects as Hash Tables\n\nGuillermo Rauch has written an article about some\
    \ of the pitfalls of using an object as a hash.⁷ The main danger lies in potential\
    \ collisions that can occur when users are allowed to provide arbitrary input.\
    \ This does not apply in our case because the inputs to the object are strictly\
    \ under our control.\n\nWe will make two small modifications. First, we allow\
    \ the user to pass a flag indicating whether the heap is maximum or minimum (that\
    \ is, whether it starts at the largest value or smallest value). This is done\
    \ by transforming the original code:\n\n```javascript\nthis.content.push(element);\n\
    ```\n\n... into the following:\n\n```javascript\nif (this.options.max) {\n   \
    \ this.content.push(-element);\n}\nelse\n    this.content.push(element);\n```\n\
    \nIf users wish for a maximum heap, all that they need do is reverse the sign\
    \ of the number. Internally, the data structure still finds the smallest number.\
    \ However, the smallest negative number when examining negative values ends up\
    \ being the largest when considering the absolute value.\n\n## 26 Jump Start Node.js\n\
    \nTo illustrate, suppose we have 1, 4, and 10. The unmodified implementation returns\
    \ the minimum number by default, which is 1. However, if we store the numbers\
    \ internally as −1, −4 and −10, the smallest number now becomes −10.\n\nAll we\
    \ need to do is remember to flip the sign back to a positive number before we\
    \ return the result:\n\n```javascript\nif (this.options.max)\n  return -result;\n\
    else\n  return result;\n```\n\nWe require both maximum and minimum heaps because\
    \ trades occur at the highest buy prices but the lowest sell prices. Our second\
    \ modification is to add a peek function that works similarly to pop, except without\
    \ removal:\n\n```javascript\npeek: function() {\n  if (this.options.max)\n   \
    \ return -this.content[0];\n  else\n    return this.content[0];\n}\n```\n\nThe\
    \ peek function is simple. Internally, the data structure is an array, so all\
    \ we need to do is return the first element of the array. We’ll flip the sign\
    \ if we’re dealing with a maximum heap.\n\nI will limit further observations to\
    \ noting that with the addition of this data structure, JavaScript is starting\
    \ to resemble much more closely some of the other languages you may have studied\
    \ in Algorithms 101. Perhaps you can begin to see that it’s not just a funny little\
    \ language for browser manipulation.\n\nDownload the full code available at https://gist.github.com/3949948\
    \ and copy it into **chapter02/lib/BinaryHeap.js**.\n\n## The Heart of the Engine\n\
    \nJavaScript is a language that’s generally read from top to bottom. This is also\
    \ how we’ll analyze the code for our trading engine, starting at the very first\
    \ line. Unless otherwise noted, you can simply enter the following code in the\
