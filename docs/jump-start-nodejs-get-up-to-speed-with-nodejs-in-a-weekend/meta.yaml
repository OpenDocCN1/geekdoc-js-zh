  - '[PAGE 161]


    That''s all that''s needed for Git installation. Before versioning our software,
    create the file .gitignore at the top level so that we can specify what files
    and directories will be omitted. For now, it should contain a single line: node_modules.


    There is no point checking in the modules directory. Heroku will automatically
    pull modules from the official repository whenever new code is checked in. Next,
    we create our Git repository as follows:


    ```

    git init

    ```


    Then we add files and directories:


    ```

    git add .

    ```


    This will add all files, directories, and subdirectories except for those specified
    in the ignore file. Now we can commit our files into a local repository with an
    initial message for documentation purposes:


    ```

    git commit -m "Initial check in"

    ```


    The above process creates a local repository. Each check-in is associated with
    a unique identifier. This allows us to revert to an arbitrary revision. Conceptually,
    we need to push this local repository to Heroku next. This process, along with
    a brief overview of Heroku, will be provided in the next section.


    # Heroku


    Heroku is a polyglot Platform as a Service (PaaS) provider. **Polyglot** means
    that it supports several languages. Originally conceived as a host for Ruby, it
    now supports Java, Node.js, Scala, and Clojure. Platform as a Service is a model
    whereby Heroku provides the network and servers as well as the Node.js-related
    infrastructure. Heroku conveniently provides a free option, allowing us to comprehensively
    trial the offering before deciding whether to choose it as our final production
    host.


    Because of Heroku''s origins, both Ruby and its package manager, RubyGems, will
    be required before installing Heroku. If this is yet to be installed on your operating
    system, you can install both packages using the following command:


    ```

    sudo apt-get install ruby-full rubygems

    ```'
