    \    <input type=\"password\" name=\"password\"/>\n  </div>\n  <div><input type=\"\
    submit\" value=\"Sign Up\"/></div>\n</form>\n```\n\n当你访问 http://localhost:3000/form\
    \ 时，你应该会看到你的表单在页面中渲染出来，如图 1.3 所示。\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_29_0.png)\n\
    \n和你想象中的 Web 2.0 样子不太一样？别担心，我们将在后面的章节中介绍如何美化你的页面。目前需要消化的内容已经够多了，暂时不必关心如何让你的页面元素闪闪发光。\n\
    \n当用户点击 **Sign Up** 按钮时，表单数据将被发送到 `/signup`。我们现在将在 Express 中设置一个处理器来处理这些表单数据。将以下代码复制到\
    \ **app.js** 文件中你上次离开的地方：\n\n```javascript\nchapter01/authentication/app.js (excerpt)\n\
    \napp.post('/signup', function(req, res) {\n  var username = req.body.username;\n\
    \  var password = req.body.password;\n  User.addUser(username, password, function(err,\
