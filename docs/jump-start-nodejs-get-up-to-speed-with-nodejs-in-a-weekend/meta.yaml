  md: "```\nchapter04/routes/nockroutes.js (excerpt)\n\nvar nocklib = require('../lib/nocklib');\n\
    \nmodule.exports = {\n  getIndex: function(req, res) {\n    res.render('index');\n\
    \  },\n  signup: function(req, res) {\n    nocklib.createUser(req.body.username\n\
    \      , req.body.email\n      , req.body.password, function(err, user) {\n  \
    \      console.log(user);\n        res.redirect('/portfolio');\n    });\n  }\n\
    }\n```\n\nRemember the import of nocklib as the first line, and the comma after\
    \ getIndex! One more task is to remove the ASCII logging as this will no longer\
    \ be required. In **nockmarket.js**, comment out `console.log(exch.getDisplay(exchangeData));`\
    \ and `console.log('order', ord);` with `//`. Both can be found within the function,\
