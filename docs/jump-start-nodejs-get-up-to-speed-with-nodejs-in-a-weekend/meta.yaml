    \n### 服务器上的 jQuery\n\nNode.js 的吸引力之一是“一门语言统御一切”的理念。在理想的世界里，我们将实现客户端和服务器端代码的无缝集成。目前，最佳实践仍在发展中，在将客户端代码引入服务器或将服务器代码引入客户端时，有时仍会存在摩擦。\n\
