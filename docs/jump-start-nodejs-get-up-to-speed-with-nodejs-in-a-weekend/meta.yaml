    \ the order is small enough for there to be zero price impact. Therefore, we set\
    \ a Boolean so that we know that no prices need to be changed later.\n\nIn the\
    \ second case, the order is large enough to remove at least one level on the opposite\
    \ side. This means any sell order of 100 units or more in our example, which will\
    \ completely consume the buy order of 100 units at $40, leaving 0 units remaining:\n\
    \n```\nelse {\n  if (bestOppVol == remainingVolume) ❶\n    storePrice = false;\
    \ ❷\n  cloned.trades.push(\n    {price:bestOppPrice\n    , volume:oppBook.volumes[bestOppPrice]});\
    \ ❸\n  remainingVolume =\n    remainingVolume - oppBook.volumes[bestOppPrice];\
    \ ❹\n  // Pop the best price from the heap\n  oppBook.prices.pop(); ❺\n  delete\
    \ oppBook.volumes[bestOppPrice]; ❻\n}\n```\n\n- 1. First, we need to test for\
    \ the edge case where the incoming order volume matches the existing order volume\
    \ exactly.\n- 2. In this case, the two orders will cancel each other out, so there's\
    \ no need to store a new price.\n- 3. Then, we generate the trade and push it\
    \ into the **trades** array.\n- 4. We adjust the volume by subtracting the entire\
    \ amount of the volume on the opposite side. By way of example, if we had 100\
    \ units at $40 and a sell order came in for 130 units at $40, we would have 30\
    \ units remaining (130 - 100).\n- 5. We then \"pop\" the price from the opposite\
    \ side as it has been removed by the incoming order.\n- 6. Similarly, we delete\
    \ volume information from the opposite side.\n\nMost of the hard work is done.\
    \ Now we just need to clean up and return the data:\n\n```\nif (!oldVolume &&\
    \ storePrice)\n    cloned[orderType].prices.push(price);\n\nvar newVolume = remainingVolume;\n\
    \n// Add to existing volume\nif (oldVolume) newVolume += oldVolume;\nif (newVolume\
