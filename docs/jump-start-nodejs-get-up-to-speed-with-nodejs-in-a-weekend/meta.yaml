    \ use only one- to two-character field names in their collections.\n\n# Creating\
    \ the Wrapper\n\nUsing the native driver directly in an application can be excessively\
    \ verbose. That's why we'll create a thin wrapper around the native driver to\
    \ abstract away some of the low-level details. First, we'll import some modules\
    \ and run some setup code. Place the following into **lib/db.js**:\n\n```\nvar\
    \ Db = require('mongodb').Db\n  ,Connection = require('mongodb').Connection\n\
    \  ,Server = require('mongodb').Server;\n\nvar envHost = process.env['MONGO_NODE_DRIVER_HOST']\n\
    \  ,envPort = process.env['MONGO_NODE_DRIVER_PORT']\n```"
  - "[PAGE 65]\n\n```\n    ,host = envHost != null ? envHost: 'localhost'\n    ,port\
    \ = envPort != null ? envPort: Connection.DEFAULT_PORT;\n\nvar db = new Db('nockmarket'\n\
    \    ,new Server(host, port, {})\n    ,{native_parser:false});\n```\n\nMost of\
    \ the setup code is standard import and initialization. The one new item here\
    \ is the **process** object, a way to interact with the native environment. It\
    \ can perform operations such as changing directories, inspecting memory usage,\
    \ and determining uptime.⁶\n\nHere we use it to inspect environment variables,\
    \ in particular hostname and port. In general, it's good practice to store configuration\
    \ details such as hostnames, port names, usernames, and passwords outside of source\
    \ code.\n\nImagine you have a production system and you wish to change the database\
    \ port. If this is stored in source code, you'll need to change the source code\
    \ and redeploy the system. In the meantime, a developer has sadly failed to follow\
    \ a test-driven design and has introduced a bug into the system. This bug will\
    \ be deployed into production just because we wanted to alter the port.\n\nSome\
    \ options for storing configuration details include:\n\n+   - plain-text configuration\
    \ files\n- database storage\n- environment variables\n\nIn all of these cases,\
    \ it is possible to alter the configuration without modifying source code. For\
    \ this example, we will ignore the environment variables, and therefore the host\
    \ will default to localhost and the port will default to the default port.\n\n\
    # Finding Data\n\nNext, we'll create some functions for searching collections\
    \ and add it to our code:"
  - "[PAGE 66]\n\n```\nchapter03/lib/db.js (excerpt)\n\nmodule.exports = {\n    find:\
    \ function(name, query, limit, callback) {\n        db.collection(name).find(query)\n\
    \            .sort({_id: -1})\n            .limit(limit)\n            .toArray(callback);\n\
    \    },\n    findOne: function(name, query, callback) {\n        db.collection(name).findOne(query,\
    \ callback);\n    },\n```\n\nHere we implement two find functions. The first one\
    \ finds all the documents matching a particular query. `db.collection(name)` selects\
    \ the relevant collection. A collection is analogous to a table in relational\
    \ database terminology. `find` is a function that executes the specified query.\
    \ We'll delve into the specifics of the query language a little further on, but\
    \ you'll probably be pleased to hear that syntactically it's based on JavaScript,\
    \ which is one less hurdle to clear on your way to mastery.\n\nAfter executing\
    \ the query, we sort by `_id` in reverse order:\n\n```\n.sort({_id: -1})\n```\n\
    \nThis retrieves the newest entries first. We then apply a specified limit to\
    \ avoid returning the entire database:\n\n```\n.limit(limit)\n```\n\nLastly, we\
    \ convert the result to an array and execute the callback function:\n\n```\n.toArray(callback);\n\
    ```\n\nNote how `limit` immediately follows `sort`, which immediately follows\
    \ `find`. This technique is called **chaining**, and it provides a nice way to\
    \ arbitrarily combine different operations.\n\n`findOne` is very similar to `find`,\
    \ except it will only return a single result; however, it's simpler because there's\
    \ no requirement to sort, limit, or convert to an array. Generally, it is used\
    \ to search by `_id`, which guarantees that there will only ever be"
  - "[PAGE 67]\n\na single match. If searching is performed on some other field and\
    \ multiple matches arise, only the first match will be returned.\n\n# Inserting\
    \ Data\n\nNow we'll move on to the insertion functions:\n\n```\nchapter03/lib/db.js\
    \ (excerpt)\n\ninsert: function(name, items, callback) {\n    db.collection(name).insert(items,\
    \ callback);\n},\ninsertOne: function(name, item, callback) {\n    module.exports.insert(name,\
    \ item, function(err, items) {\n        callback(err, items[0]);\n    });\n},\n\
    ```\n\nThe `insert` function takes an array of items and inserts it into the database.\
    \ The array consists of JSON objects, which can be of arbitrary form and have\
    \ no correlation with objects that precede or follow. This illustrates the nature\
    \ of schema-free databases well. If you wish to insert a financial transaction\
    \ followed by an employee record followed by a chicken soup recipe, it is possible\
    \ to do so (technically, at least). With MongoDB, the business rules that prevent\
    \ this type of design are shifted away from the database system and towards the\
    \ application.\n\n`insertOne` is a thin wrapper around `insert` that calls the\
    \ same function and returns the first item. It's a bit of **syntactic sugar**,\
    \ a term describing code that's functionally identical to another piece of code\
    \ but written in a more concise and elegant way.\n\nIn theory, `insertOne` is\
    \ unnecessary and could always insert and retrieve single items by treating everything\
    \ as an array of size one. This means that we'd access the result of the insert\
    \ using syntax such as `result[0]`. It would be nicer to simply use the result\
    \ because we know there will only be a single item. It may seem like a minor point,\
    \ but over an entire code base, judicious use of syntactic sugar can add to the\
    \ readability and maintainability of the code. Lastly, we add a small function\
    \ that opens up the connection to the database:"
- md: "# 50 Jump Start Node.js\n\n```javascript\nchapter03/lib/db.js (excerpt)\n\n\
    open: function(callback) {\n    db.open(callback);\n  }\n}\n```\n\nOur unit tests\
    \ are now ready to run. Add the following dependencies to **package.json**:\n\n\
    ```json\nchapter03/package.json (excerpt)\n\n{\n  :\n  , \"dependencies\": {\n\
    \    :\n    , \"ejs\" : \"0.7.1\"\n    , \"express\": \"2.5.8\"\n    , \"mongodb\"\
    : \"1.0.2\"\n  }\n}\n```\n\nAfter doing the customary `npm install` with the MongoDB\
    \ daemon running, all the database unit tests should now pass upon running `make\
    \ test`.\n\n## Storing the Data\n\nNow that we have set up some scaffolding, we\
    \ can modify **nockmarket.js** so that it stores orders in the database rather\
    \ than just printing them to the console. The first modification is to open the\
    \ connection to the database. To the list of imports, add `db = require('./lib/db')`.\
    \ Replace the existing `submitRandomOrder` function call with the following:\n\
    \n```javascript\nchapter03/nockmarket.js (excerpt)\n\ndb.open(function() {\n \
    \   submitRandomOrder();\n});\n```\n\nThe main aspect to note about this code\
    \ is the asynchronous style. We must ensure that the database is open before we\
    \ can start placing orders.\n\n## Persistence Pays\n\n51\n\n## Synchronous Code\n\
    \nUsing the same excerpt, synchronous style code would resemble the following:\n\
    \n```javascript\ndb.open();\nsubmitRandomOrder();\n```\n\nIn most languages, this\
    \ is the standard way to handle interrelated functions;\nhowever, in JavaScript,\
    \ this will end up submitting your order before opening a\nconnection to the database\
    \ because open is nonblocking.\n\nNext, we modify our submit function as follows:\n\
    \n```javascript\nchapter03/nockmarket.js (excerpt)\n\nfunction submitRandomOrder()\
    \ {\n  // order\n  var ord = nocklib.generateRandomOrder(exchangeData);\n  console.log('order',\
    \ ord);\n  if (ord.type == exch.BUY)\n    exchangeData = exch.buy(ord.price, ord.volume,\
    \ exchangeData);\n  else\n    exchangeData = exch.sell(ord.price, ord.volume,\
    \ exchangeData);\n\n  db.insertOne('transactions', ord, function(err, order) {\n\
    \    if (exchangeData.trades && exchangeData.trades.length > 0) {\n      var trades\
    \ = exchangeData.trades.map(function(trade) {\n        trade.init = (ord.type\
    \ == exch.BUY) ? 'b' : 's';\n        return trade;\n      });\n      db.insert('transactions',\
    \ trades, function(err, trades) {\n        pauseThenTrade();\n      });\n    }\n\
    \    else pauseThenTrade();\n  });\n\n  function pauseThenTrade() {\n    var pause\
    \ = Math.floor(Math.random() * timeRange) + timeFloor;\n    setTimeout(submitRandomOrder,\
    \ pause);\n    console.log(exch.getDisplay(exchangeData));\n  }\n}\n```\n\nThe\
    \ first new piece of code, `db.insertOne`, inserts our order into the database.\
    \ Once the order is inserted and returned, we check to see if there have been\
    \ any trades:\n\n```javascript\nif (exchangeData.trades && exchangeData.trades.length\
    \ > 0) {\n```\n\nIf so, we use the built-in map function to add a flag indicating\
    \ whether the trade was initiated by a buyer or a seller:\n\n```javascript\nvar\
    \ trades = exchangeData.trades.map(function(trade) {\n    trade.init = (ord.type\
    \ == exch.BUY) ? 'b' : 's';\n    return trade;\n```\n\nWe are introducing this\
    \ for two reasons. First, we want to demonstrate how easily MongoDB can handle\
    \ heterogeneous documents. The introduction of an additional field adds complications\
    \ to the relational database model. We have to either split the data into multiple\
    \ tables, or else keep the data in a single table and have null fields and redundant\
    \ data scattered across our data set. Neither is ideal. MongoDB does not need\
    \ any workarounds and can naturally house different types of documents within\
    \ the same collection.\n\nThe second reason for introducing this business rule\
    \ is that it allows us to demonstrate the usage of map. The concept of map is\
    \ to take a collection and transform it in some way. In this case, we use the\
    \ built-in JavaScript map method and provide it with a transformation function\
    \ that tells it how to transform an individual item in the collection.\n\n> **MapReduce**\n\
    \nMap is part of a very powerful programming paradigm known as MapReduce. It wouldn't\
    \ be an exaggeration to say that in many ways it forms the heart of Google's infrastructure.\
    \ The official blog describes how Google use MapReduce to sort one petabyte of\
    \ data.$^7$\n\nDepending on your particular programming background, the concept\
    \ of map may not be immediately intuitive. Here's a basic example to help explain\
    \ the concept. Start your read-eval-print (REPL) loop by typing `node`, and then\
    \ the following line of code:\n\n```javascript\n[1, 2, 3].map(function(x) { return\
    \ x * 2; });\n```\n\nYou should receive:\n\n```javascript\n[ 2, 4, 6 ]\n```\n\n\
    What this does is take the input array and apply a function to double each member\
    \ of the array. To understand just how useful map is, I recommend trying to write\
    \ functionally equivalent code without using map. You'll gain an appreciation\
    \ for how it can be used to provide elegant solutions to transformation problems.\n\
    \n## Before Express\n\nAlthough we'll be primarily using Express.js to build our\
    \ applications, it would be remiss to skip discussing the native http module briefly.\
    \ As a short side project, we'll build a remote authentication module. The actual\
    \ function will be physically located on a remote server, but can be called as\
    \ if it were residing locally. This is possible because of a package called dnode,\
    \ created by James Halliday.\n\nFirst, add the following dependency to **package.json**:\
    \ \"dnode\" : \"1.0.0\".\n\nNow run npm install and then create a directory called\
    \ **dnode**. Within the newly created **dnode** directory, create **auth.js**:\n\
    \n```javascript\nvar dnode = require('dnode');\ndnode(function(remote, conn) {\n\
    \  this.auth = function(user, pass, cb) {\n    var users = {\n      foo: 'bar'\n\
    \    };\n    var p = users[user];\n    if (p === pass) cb(null, 'AUTHORIZED!');\n\
    \    else cb('REMOTE ACCESS DENIED');\n  };\n}).listen(process.argv[2]);\n```\n\
    \nThis defines a simple authentication function that does a lookup of the users\
    \ JSON object (a production environment would look up the authentication details\
    \ in an actual database). The authentication function is wrapped within the dnode\
    \ function to make it accessible remotely.\n\nNow we'll define the web server\
    \ in the same folder, in **web.js**:\n\n```javascript\nvar dnode = require('dnode')\n\
    \  , http = require('http')\n  , qs = require('querystring');\n\nvar d = dnode.connect('localhost',\
    \ 8090);\nd.on('remote', function (remote) {\n  http.createServer(function(req,\
    \ res) {\n    if (req.url.match(/^\\/login/)) {\n      var param = qs.parse(req.url.split('?')[1]);\n\
    \      remote.auth(param.user\n        , param.pass, function (err, result) {\n\
    \          res.end(err ? err: result);\n      });\n    }\n  }).listen(process.argv[2]);\n\
    });\n```\n\nOnce again, everything is wrapped in a dnode function to provide remote\
    \ connectivity. The actual web server is created with http.createServer. We manually\
    \ check the URL against a regular expression to determine if the user is trying\
    \ to log in:\n\n```javascript\nif (req.url.match(/^\\/login/)) {\n```\n\nIf so,\
    \ we use the querystring built-in package to parse the username and password:\n\
    \n```javascript\nvar param = qs.parse(req.url.split('?')[1]);\n```\n\nWe then\
    \ call the remote authentication function and render the result:\n\n```javascript\n\
    remote.auth(param.user\n  , param.pass, function (err, result) {\n    res.end(err\
    \ ? err: result);\n});\n```\n\nRun the authentication server using `node auth\
    \ 8090` within the **dnode** folder, which starts the server and has it listen\
    \ on port 8090. Then start the web server using `node web 3000`, and go to `http://localhost:3000/login?user=foo&pass=bar`\
    \ in your browser. You should see the screen shown in Figure 3.1.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_0.png)\n\
    \nFigure 3.1. Consider yourself AUTHORIZED!\n\nIf you try to change the username\
    \ or password in the address bar, you should see what's depicted in Figure 3.2.\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_1.png)\n\nFigure 3.2. When the user\
    \ is unauthorized\n\nIn this case, we just happened to run the authentication\
    \ server and web server on the same machine; however, the same code can be used\
    \ for running a local web server with an authentication server on the other side\
    \ of the world. The only change would be to specify the IP address of the remote\
    \ server instead of using localhost. Now that we've built a basic web server using\
    \ the native http module, it's time to build the rest of our application using\
    \ Express.js.\n\n## Building an API\n\nWith some trades in our database, we will\
    \ build a small API to retrieve the data. To be more specific, we'll build a **REST\
    \ API**. REST stands for REpresentational State Transfer, which is the architecture\
    \ behind the Web. Rather than discussing the technical details, it would be more\
    \ illustrative to explain how the data moves from the database to the browser."
  mdcn: "\n# 50 快速入门 Node.js\n\n```javascript\nchapter03/lib/db.js (节选)\n\nopen: function(callback)\
    \ {\n    db.open(callback);\n  }\n}\n```\n\n我们的单元测试现在已准备就绪。将以下依赖项添加到 **package.json**\
    \ 中：\n\n```json\nchapter03/package.json (节选)\n\n{\n  :\n  , \"dependencies\":\
    \ {\n    :\n    , \"ejs\" : \"0.7.1\"\n    , \"express\": \"2.5.8\"\n    , \"\
    mongodb\": \"1.0.2\"\n  }\n}\n```\n\n在 MongoDB 守护进程运行的情况下，执行常规的 `npm install`\
    \ 后，现在运行 `make test`，所有数据库单元测试都应通过。\n\n## 存储数据\n\n既然我们已经搭建了一些基础框架，我们可以修改 **nockmarket.js**，使其将订单存储到数据库中，而不仅仅是打印到控制台。第一个修改是打开数据库连接。在导入列表中添加\
    \ `db = require('./lib/db')`。将现有的 `submitRandomOrder` 函数调用替换为以下内容：\n\n```javascript\n\
    chapter03/nockmarket.js (节选)\n\ndb.open(function() {\n    submitRandomOrder();\n\
    });\n```\n\n这段代码需要注意的主要方面是其异步风格。我们必须确保数据库已打开，然后才能开始下订单。\n\n## 持久化的价值\n\n51\n\n\
    ## 同步代码\n\n使用相同的代码片段，同步风格的代码将类似于以下形式：\n\n```javascript\ndb.open();\nsubmitRandomOrder();\n\
    ```\n\n在大多数语言中，这是处理相互关联函数的标准方式；然而，在 JavaScript 中，这将导致在打开数据库连接之前就提交了你的订单，因为 `open`\
    \ 是非阻塞的。\n\n接下来，我们按照如下方式修改提交函数：\n\n```javascript\nchapter03/nockmarket.js (节选)\n\
    \nfunction submitRandomOrder() {\n  // 订单\n  var ord = nocklib.generateRandomOrder(exchangeData);\n\
    \  console.log('order', ord);\n  if (ord.type == exch.BUY)\n    exchangeData =\
    \ exch.buy(ord.price, ord.volume, exchangeData);\n  else\n    exchangeData = exch.sell(ord.price,\
    \ ord.volume, exchangeData);\n\n  db.insertOne('transactions', ord, function(err,\
    \ order) {\n    if (exchangeData.trades && exchangeData.trades.length > 0) {\n\
    \      var trades = exchangeData.trades.map(function(trade) {\n        trade.init\
    \ = (ord.type == exch.BUY) ? 'b' : 's';\n        return trade;\n      });\n  \
    \    db.insert('transactions', trades, function(err, trades) {\n        pauseThenTrade();\n\
    \      });\n    }\n    else pauseThenTrade();\n  });\n\n  function pauseThenTrade()\
    \ {\n    var pause = Math.floor(Math.random() * timeRange) + timeFloor;\n    setTimeout(submitRandomOrder,\
    \ pause);\n    console.log(exch.getDisplay(exchangeData));\n  }\n}\n```\n\n第一段新代码\
    \ `db.insertOne` 将我们的订单插入数据库。一旦订单被插入并返回，我们检查是否发生了任何交易：\n\n```javascript\nif (exchangeData.trades\
    \ && exchangeData.trades.length > 0) {\n```\n\n如果是，我们使用内置的 `map` 函数添加一个标志，表明该交易是由买方还是卖方发起的：\n\
    \n```javascript\nvar trades = exchangeData.trades.map(function(trade) {\n    trade.init\
    \ = (ord.type == exch.BUY) ? 'b' : 's';\n    return trade;\n```\n\n我们引入这一点有两个原因。首先，我们想展示\
    \ MongoDB 处理异构文档是多么容易。在关系型数据库模型中，引入额外的字段会增加复杂性。我们必须将数据拆分到多个表中，或者将数据保存在单个表中，并在数据集中散布空字段和冗余数据。这两种方式都不理想。MongoDB\
    \ 不需要任何变通方法，可以自然地在同一集合中存储不同类型的文档。\n\n引入此业务规则的第二个原因是它允许我们演示 `map` 的用法。`map` 的概念是获取一个集合，并以某种方式对其进行转换。在这种情况下，我们使用内置的\
    \ JavaScript `map` 方法，并为其提供一个转换函数，该函数告诉它如何转换集合中的单个项目。\n\n> **MapReduce**\n\n`Map`\
    \ 是一种非常强大的编程范式（称为 MapReduce）的一部分。可以说它在许多方面构成了 Google 基础设施的核心，这并不夸张。官方博客描述了 Google\
    \ 如何使用 MapReduce 对 1 PB 数据进行排序。$^7$\n\n根据你特定的编程背景，`map` 的概念可能不会立即直观。这里有一个基本示例来帮助解释这个概念。通过输入\
    \ `node` 启动你的读取-求值-打印循环（REPL），然后输入以下代码行：\n\n```javascript\n[1, 2, 3].map(function(x)\
    \ { return x * 2; });\n```\n\n你应该会得到：\n\n```javascript\n[ 2, 4, 6 ]\n```\n\n它的作用是获取输入数组，并应用一个函数来将数组的每个成员加倍。为了了解\
    \ `map` 有多么有用，我建议尝试在不使用 `map` 的情况下编写功能等效的代码。你会体会到它如何为转换问题提供优雅的解决方案。\n\n## 在 Express\
    \ 之前\n\n虽然我们将主要使用 Express.js 来构建我们的应用程序，但简单地讨论一下原生 http 模块也是有益的。作为一个简短的小项目，我们将构建一个远程认证模块。实际的函数将物理上位于远程服务器上，但可以像调用本地函数一样被调用。这之所以可能，是因为一个名为\
    \ `dnode` 的包，由 James Halliday 创建。\n\n首先，将以下依赖项添加到 **package.json**：\"dnode\" :\
    \ \"1.0.0\"。\n\n现在运行 `npm install`，然后创建一个名为 **dnode** 的目录。在新创建的 **dnode** 目录中，创建\
    \ **auth.js**：\n\n```javascript\nvar dnode = require('dnode');\ndnode(function(remote,\
    \ conn) {\n  this.auth = function(user, pass, cb) {\n    var users = {\n     \
    \ foo: 'bar'\n    };\n    var p = users[user];\n    if (p === pass) cb(null, 'AUTHORIZED!');\n\
    \    else cb('REMOTE ACCESS DENIED');\n  };\n}).listen(process.argv[2]);\n```\n\
    \n这定义了一个简单的认证函数，它对用户 JSON 对象进行查找（生产环境会在实际数据库中查找认证详情）。认证函数被包装在 `dnode` 函数中，以使其可远程访问。\n\
    \n现在我们将在同一文件夹中定义 Web 服务器，文件为 **web.js**：\n\n```javascript\nvar dnode = require('dnode')\n\
    \  , http = require('http')\n  , qs = require('querystring');\n\nvar d = dnode.connect('localhost',\
    \ 8090);\nd.on('remote', function (remote) {\n  http.createServer(function(req,\
    \ res) {\n    if (req.url.match(/^\\/login/)) {\n      var param = qs.parse(req.url.split('?')[1]);\n\
    \      remote.auth(param.user\n        , param.pass, function (err, result) {\n\
    \          res.end(err ? err: result);\n      });\n    }\n  }).listen(process.argv[2]);\n\
    });\n```\n\n同样，所有内容都包装在一个 `dnode` 函数中以提供远程连接。实际的 Web 服务器使用 `http.createServer`\
    \ 创建。我们手动将 URL 与正则表达式进行匹配，以确定用户是否正在尝试登录：\n\n```javascript\nif (req.url.match(/^\\\
    /login/)) {\n```\n\n如果是，我们使用 `querystring` 内置包来解析用户名和密码：\n\n```javascript\nvar\
    \ param = qs.parse(req.url.split('?')[1]);\n```\n\n然后我们调用远程认证函数并渲染结果：\n\n```javascript\n\
    remote.auth(param.user\n  , param.pass, function (err, result) {\n    res.end(err\
    \ ? err: result);\n});\n```\n\n在 **dnode** 文件夹中使用 `node auth 8090` 运行认证服务器，这将启动服务器并使其监听\
    \ 8090 端口。然后使用 `node web 3000` 启动 Web 服务器，并在浏览器中访问 `http://localhost:3000/login?user=foo&pass=bar`。你应该会看到图\
    \ 3.1 所示的屏幕。\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_0.png)\n\n图 3.1. 认为自己已授权！\n\
    \n如果你尝试在地址栏中更改用户名或密码，你应该会看到图 3.2 中描绘的内容。\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_1.png)\n\
    \n图 3.2. 用户未授权时\n\n在这种情况下，我们恰好在同一个机器上运行了认证服务器和 Web 服务器；但是，相同的代码也可以用于在本地运行一个 Web\
    \ 服务器，而认证服务器在世界的另一端。唯一的改变是指定远程服务器的 IP 地址，而不是使用 localhost。既然我们已经使用原生 http 模块构建了一个基本的\
