    \ overhead.\n\nInstead, I recommend a package called “forever,” installed in the\
    \ standard way:\n\n```\nsudo npm install -g forever\n```\n\nStarting your application\
    \ is now as simple as:\n\n2 https://devcenter.heroku.com/articles/dynos#ephemeral-filesystem\n\
    \n```\nforever start nockmarket.js\n```\n\nAside from start, other common options\
