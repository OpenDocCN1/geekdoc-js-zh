  md: '# Nodejitsu


    The Node.js ecosystem is constantly evolving and improving, and one of the newer
    hosting offerings comes from the team at Nodejitsu. A tutorial was not provided
    in this book because the product is currently still in beta. As such, it''s not
    as battle-hardened as Heroku, and bugs and changes could potentially arise that
    would inconvenience you.


    However, it is worth keeping an eye on this product as it matures. Because the
    offering is Node.js-specific, it requires fewer tweaks and customizations to your
    code base and environment. As an example, Nodejitsu has full support for Web-Sockets,
    and installation of its tools can take place through the node package manager
    (npm).


    First, visit http://heroku.com and sign up for an account. Then execute the following
    command from your prompt:


    ```

    wget -qO- https://toolbelt.heroku.com/install-ubuntu.sh | sh

    ```


    This will install the Heroku toolbelt. Instructions for other operating systems
    are available at the official site.<sup>5</sup>


    The toolbelt is controlled from the command line. You can log in to Heroku using:


    ```

    heroku login

    ```


    # Configuration Tweaking


    If you receive an error message about "command not found," you may need to set
    your path as per the https://devcenter.heroku.com/articles/cli-command-not-found
    instructions.


    If you find that Heroku isn''t installed in the specified EXECUTABLE_DIRECTORY,
    you can install it through gem as follows:


    ```

    sudo gem install heroku

    ```'
