- img_proc: true
  md: "# 26 Jump Start Node.js\n\nTo illustrate, suppose we have 1, 4, and 10. The\
    \ unmodified implementation returns the minimum number by default, which is 1.\
    \ However, if we store the numbers internally as −1, −4 and −10, the smallest\
    \ number now becomes −10.\n\nAll we need to do is remember to flip the sign back\
    \ to a positive number before we return the result:\n\n```\nif (this.options.max)\n\
    \  return -result;\nelse\n  return result;\n```\n\nWe require both maximum and\
    \ minimum heaps because trades occur at the highest buy prices but the lowest\
    \ sell prices. Our second modification is to add a peek function that works similarly\
    \ to pop, except without removal:\n\n```\npeek: function() {\n  if (this.options.max)\n\
    \    return -this.content[0];\n  else\n    return this.content[0];\n}\n```\n\n\
    The peek function is simple. Internally, the data structure is an array, so all\
    \ we need to do is return the first element of the array. We’ll flip the sign\
    \ if we’re dealing with a maximum heap.\n\nI will limit further observations to\
    \ noting that with the addition of this data structure, JavaScript is starting\
    \ to resemble much more closely some of the other languages you may have studied\
    \ in Algorithms 101. Perhaps you can begin to see that it’s not just a funny little\
    \ language for browser manipulation.\n\nDownload the full code available at https://gist.github.com/3949948\
    \ and copy it into **chapter02/lib/BinaryHeap.js**.\n\n# The Heart of the Engine\n\
    \nJavaScript is a language that’s generally read from top to bottom. This is also\
    \ how we’ll analyze the code for our trading engine, starting at the very first\
    \ line. Unless otherwise noted, you can simply enter the following code in the\
    \ exact same order"
