  - "[PAGE 133]\n\n# # Chapter 6\n\n# ## Backbone\n\n> > “Chaos was the law of nature;\
    \ order was the dream of man.”\n> \n> —Henry B. Adams\n\nSoftware engineering\
    \ is about managing complexity; it's a theme to which we keep returning, but it\
    \ cannot be emphasized enough. So, far we have looked at a number of ways to manage\
    \ complexity on the server side; however, we've yet to discuss complexity management\
    \ on the client side. To date, we have been managing client-side code by annotating\
    \ HTML tags and then manipulating them through jQuery. While this works for smaller\
    \ projects, the ability to manage complexity rapidly breaks down as the size of\
    \ the code base increases.\n\nThere are many client-side frameworks built for\
    \ managing this type of problem. In this chapter, we'll look at one of the more\
    \ popular ones, Backbone.js.<sup>1</sup> Backbone loosely follows the **MVC**\
    \ model in which an application is split into models, views, and controllers.\
    \ We'll look at how Backbone can be combined with Node.js to present a real-time\
    \ graphical user interface to the end user showing orders and trades. While\n\n\
    <sup>1</sup> http://backbonejs.org/"
