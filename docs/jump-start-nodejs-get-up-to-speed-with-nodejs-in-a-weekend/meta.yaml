  md: "# Bootstrap Widgets\n\nBootstrap comes with a variety of widgets, all of which\
    \ have been meticulously crafted. Unfortunately, there’s no time to cover all\
    \ the different combinations in this book; however, once you have an example of\
    \ how to integrate the Bootstrap widgets with Node.js, it’s easy to take the principles\
    \ and apply it to any widget. In this particular example, we’ll use the tab interface.\
    \ First, let’s set up the head and body in **views/portfolio.ejs**:\n\n```\nchapter04/views/portfolio.ejs\
    \ (excerpt)\n\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    utf-8\">\n    <title>Nockmarket</title>\n    <meta name=\"viewport\"\n       \
