  md: "# Jump Start Node.js\n\n```\nvar tokens = data.split('\\r\\n');\nvar prices\
    \ = [];\ntokens.forEach(function(line) {\n  var price = line.split(\",\")[1];\n\
    \  if (price)\n    prices.push(price);\n});\ncallback(null, prices);\n```\n\n\
    There is a one-to-one correspondence between the elements in the stock array and\
    \ the elements in prices. Now we'll write a function that allows the user to add\
    \ a stock to the portfolio. First, we'll amend our database wrapper by editing\
    \ **lib/db.js**:\n\n```\nchapter04/lib/db.js (excerpt)\n\n{\n  push: function(name,\
    \ id, updateQuery, callback) {\n    db.collection(name).update({_id: id}\n   \
    \   , {$push: updateQuery}, {safe:true}, callback);\n  }\n}\n```\n\nWe will represent\
    \ the portfolio as an array of Strings within a user object. Here we're creating\
    \ a generic function to allow the application to push data into an array. MongoDB's\
    \ update function is combined with the $push modifier,^8 and we use {safe:true}\
    \ to ensure that the callback is only fired once the item is inserted into the\
    \ database. Without this, the callback function fires immediately.^9\n\n> **Modifiers**\n\
    \nMongoDB has a number of modifier operations that don't add any new functionality\
    \ as such. For instance, $push could be replicated by retrieving the object, manually\
    \ pushing an item into an array, and then saving the entire object. What's handy\
    \ about modifiers is that they can take place directly on the server, removing\
    \ the overhead of sending an object from the database to the application and back\
    \ again.\n\n^8 http://www.mongodb.org/display/DOCS/Updating/#Updating-%24push\n\
    ^9 http://mongodb.github.com/node-mongodb-native/markdown-docs/insert.html"
