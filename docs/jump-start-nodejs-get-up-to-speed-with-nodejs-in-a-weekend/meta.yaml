    # # Chapter 7


    # ## Production


    > > “Art is never finished, only abandoned.”

    > —Leonardo da Vinci


    This chapter is all about production. Once you’ve built your shiny new application,
    you need to know how to transfer it from your local machine to display it to the
    rest of the world. Fortunately, there are a multitude of hosting options out there,
    many of which are free. In this chapter, we will cover deploying with a specific
    provider, Heroku.


    We will cover some of the differences between a production deployment and a local
    development environment. Many of these production techniques will apply regardless
    of the environment you end up choosing. So if you decide to go with a provider
    other than Heroku, the knowledge acquired in this chapter will be applicable to
    your final choice. By the end of the book, you will have a live deployment.


    # ### Development versus Production


    Express.js supports both development and production settings. One of the differences
    between the two is in the way errors are handled. In development, it’s handy to'
