    +   - 🔥 **DEVELOP A DYNAMIC WORKING NODE.JS APPLICATION FROM START TO FINISH**

    - 🔥 **DEPLOY YOUR NEW APPLICATION TO A PRODUCTION SERVER**

    - 🔥 **SCALE YOUR PROJECTS QUICKLY AND CHEAPLY**


    PLUS discover how to use Twitter Bootstrap, MongoDB, and Backbone.js to dynamically
    create, extend, and update contemporary web apps.


    [sitepoint.com/jumpstart-nodejs](sitepoint.com/jumpstart-nodejs)


    # ## Don Nguyen


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_175_0.png)


    Don began programming with strongly typed, object-oriented languages such as Java
    and C++. He used his engineering training to build real-time trading systems designed
    to be scalable and fault tolerant.


    Don has programmed in a variety of web environments including ASP, PHP, and Python,
    but feels that Node.js is foremost at handling the modern demands of the real-time
    web.


