- md: "We use `req.xhr` to detect Ajax requests. In the event of Ajax, we construct\
    \ an array of data consisting of stock names and prices. We send back raw JSON\
    \ instead of HTML, as can be seen by the call to `res.json`. Note that we still\
    \ need to use Ajax for the initial data load. Information still has to get from\
    \ the server to the client! The advantage of the Backbone.js is that subsequent\
    \ changes can be performed on the client entirely, as long as no new information\
    \ is required.\n\n## A Backbone Model\n\nLet's see how Backbone deals with models.\
    \ First of all, we can define a basic model and collection in `public/js/portfolio.js`:\n\
    \n```javascript\n// chapter06/public/js/portfolio.js (excerpt)\n\n});\n\nvar PortfolioModel\
    \ = Backbone.Model.extend({\n});\n\nvar PortfolioCollection = Backbone.Collection.extend({\n\
    \    model: PortfolioModel,\n    url: '/portfolio'\n});\n\nvar PortfolioView =\
    \ Backbone.View.extend({\n```\n\nHere we define a basic model by extending the\
    \ stock Backbone model. We then define a collection by specifying our model and\
    \ a URL. `url` defines the path to our JSON API. We can then use our newly defined\
    \ components by modifying the `initialize` function:\n\n```javascript\n// chapter06/public/js/portfolio.js\
    \ (excerpt)\n\ninitialize: function() {\n    window.portfolioCollection = new\
    \ PortfolioCollection();\n    window.portfolioCollection.fetch({\n        success:\
    \ function() {\n            console.log(window.portfolioCollection.toJSON());\n\
    \        },\n        error: function() {\n            console.log('Error fetching\
    \ data for portfolio');\n        }\n    });\n},\nrender: function() {\n```\n\n\
    Here we initialize the collection and use the built-in `fetch` to retrieve the\
    \ data from the API. If there's an error, we print an error message. When successful,\
    \ we log the JSON data for now. There is still a bit of console clutter from Chapter\
    \ 5, so comment out the logging in **public/js/trades.js** as follows:\n\n```javascript\n\
    // chapter06/public/js/trades.js (excerpt)\n\nsocket.on('trade', function (data)\
    \ {\n    //console.log(data);\n});\n```\n\nNow when you restart the application,\
    \ you should have a similar view to Figure 6.2 printed to your console:\n\n![Console\
    \ output](img/89e83b9cba99d96b087ef2fbb3e7f632_138_0.png)\n\nNo Console, No Problems\n\
    \nIf you lack access to the console of your browser, don't worry. This is simply\
    \ an intermediate step; very soon, we'll have all the data back in the browser.\n\
    \n## From Model to View\n\nHow is the data from the model rendered into a view?\
    \ We'll look at that now. First, let's remove the template code that prints out\
    \ the list of stocks. This is the “old way” of rendering, and we'll be replacing\
    \ it with the Backbone approach. Modify **portfolio.ejs** as follows:\n\n```html\n\
    <tbody class=\"stock-list\">\n    <!-- delete everything here -->\n</tbody>\n\
    ```\n\nNow let's modify the success function in **portfolio.js** to call `render`,\
    \ instead of printing a message to the console:\n\n```javascript\nvar self = this;\n\
    window.portfolioCollection.fetch({\n    success: function() {\n        self.render();\n\
    \    },\n```\n\nTo those with limited JavaScript experience, `self = this` might\
    \ seem confusing code. We do this because in JavaScript, the keyword `this` is\
    \ contextual. A full explanation involves quite a lot of detail.³ Suffice to say,\
    \ we store the value of the PortfolioView instance in a variable called `self`\
    \ so that we can be sure about its value, no matter where it needs to be used.\
    \ We then modify `render` as follows:\n\n³ http://www.quirksmode.org/js/this.html\n\
    \n```javascript\n// chapter06/public/js/portfolio.js (excerpt)\n\nrender: function()\
    \ {\n    for (var i=0; i<window.portfolioCollection.models.length; i++) {\n  \
    \      var data = window.portfolioCollection.models[i];\n        var rowView =\
    \ new RowView({model: data});\n        $('.stock-list').append(rowView.render().el);\n\
    \    }\n}\n```\n\nHere we begin by iterating over all the models. We then feed\
    \ each model into a RowView, which we're about to define. We want a separate view\
    \ for individual table rows because it allows us maximum granularity when it comes\
    \ to controlling the presentation. We then define RowView as follows:\n\n```javascript\n\
    // chapter06/public/js/portfolio.js (excerpt)\n\n});\n\nvar RowView = Backbone.View.extend({\n\
    \    tagName: 'tr',\n    render: function() {\n        var template =\n      \
    \      _.template(\"<td><%=stock%></td><td><%=price%></td>\");\n        $(this.el).html(template(this.model.toJSON()));\n\
    \        return this;\n    }\n});\nnew PortfolioView();\n```\n\nThe `el` and `tagName`\
    \ variables may initially be slightly confusing. The official documentation describes\
    \ them thus:⁴\n\n> “All views have a DOM element at all times (the `el` property),\
    \ whether they've already been inserted into the page or not. In this fashion,\
    \ views can be rendered at any time, and inserted into the DOM all at once, in\
    \ order to get high-performance UI rendering with as few reflows and repaints\
    \ as possible. `this.el` is created from the view's `tagName`, `className`, `id`\
    \ and `attributes` properties, if specified. If not, `el` is an empty `div`.\n\
    \n—Backbone.js\n\nIn this particular case, `el` is the `tr` tag. When we call\
    \ `render`, the actual HTML content appears between `<tr></tr>` tags. We use Backbone's\
    \ sister library, Underscore, to construct a template:\n\n```javascript\nvar template\
    \ = _.template(...);\n```\n\nThen we convert the model into JSON:\n\n```javascript\n\
    this.model.toJSON()\n```\n\n... and feed it into the template, which will return\
    \ plain HTML. Once we have the HTML, we can append each row to the table body.\
    \ Now if you refresh the page, the original list of stocks and prices should once\
    \ again appear on the screen. That's a lot of work just to return to where we\
    \ were before. However, we will now add client-side filtering where the benefit\
    \ of Backbone will become more apparent.\n\n## Client Filters\n\nTo start, let's\
    \ modify `portfolio.ejs` and add a Bootstrap widget:\n\n```html\n// chapter06/views/portfolio.ejs\
    \ (excerpt)\n\n<button id=\"add-stock\" class=\"btn\">Add Stock</button><hr />\n\
    <input id=\"filter\" type=\"text\" class=\"input-medium search-query\" name=\"\
    filter\">\n<button class=\"add-filter btn\">Filter</button>\n```\n\nYou should\
    \ now have a **Filter** button just below your **Add Stock** button. First, we'll\
    \ change our model as follows:\n\n```javascript\n// chapter06/public/js/portfolio.js\
    \ (excerpt)\n\nvar PortfolioModel = Backbone.Model.extend({\n    defaults: {\n\
    \        visible: true\n    },\n    setVisible: function(visible) {\n        this.set({visible:\
    \ visible});\n    }\n});\n```\n\nOther than stock code and price, we add a visibility\
    \ property to our model, which will be used to control whether or not the data\
    \ is visible on the screen. We then modify PortfolioView as follows:\n\n```javascript\n\
    // chapter06/public/js/portfolio.js (excerpt)\n\nvar PortfolioView = Backbone.View.extend({\n\
    \  el: 'body',\n  events: {\n    'click .add-filter': 'filter'\n  },\n  filter:\
    \ function() {\n    var filterString = $('#filter').val();\n    var data = window.portfolioCollection.models;\n\
    \    for (var i=0; i<data.length; i++) {\n      if (data[i].toJSON().stock.toLowerCase()\n\
    \        .indexOf(filterString.toLowerCase()) == -1) {\n          data[i].setVisible(false);\n\
    \      }\n      else data[i].setVisible(true);\n    }\n  },\n  initialize: function()\
    \ {\n```\n\nWe set `el` to the body tag, and then add a single event:\n\n```javascript\n\
    'click .add-filter': 'filter'\n```\n\nThis means that when anybody clicks on an\
    \ element with the class `add-filter`, our `filter` function will be triggered.\
    \ In our `filter` function, we retrieve the search term and compare it to each\
