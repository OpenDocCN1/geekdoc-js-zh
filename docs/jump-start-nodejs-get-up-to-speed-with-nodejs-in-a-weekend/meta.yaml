    # Loading Trade Data


    Although the business problem is different, a lot of the concepts learned when
    building a client-side filter apply to the problem of real-time trades. Still,
    there are some differences that need to be addressed. First, the template is more
    complicated so it would be awkward to simply store it in a string. Create a new
