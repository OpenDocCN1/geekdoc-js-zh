  - '[PAGE 23]


    C10K problem,<sup>7</sup> which poses the dilemma of how to handle ten thousand
    or more concurrent connections for a web server. Some technology platforms are
    ill-equipped for managing this type of capacity and require various patches and
    workarounds. Node.js excels at this task because it''s based on a nonblocking,
    asynchronous architecture designed for concurrency.


    I hope I''ve whetted your appetite; it is now time to begin.


    > ### On Speed


    The book''s core project involves building a real-time stock market trading engine
    that will stream live prices into a web browser. The more inquisitive among you
    may ask, "Shouldn''t a stock market trading engine be built using a language such
    as C for faster-than-light, jaw-dropping speed?" If we were building a stock market
    engine for actual trading, my answer would be "Yes."


    The main goal of this book is to transfer the skill set rather than the actual
    project into the real world. There is a narrow domain of "hard" real-time applications
    such as a stock exchange where specialized software and hardware are required
    because microseconds count. However, there is a much larger number of "soft" real-time
    applications such as Facebook, Twitter, and eBay where microseconds are of small
    consequence. This is Node.js''s speciality, and you''ll understand how to build
    these types of applications by the end of this book.


    # In the Beginning


    Let''s run through installing Node.js, setting up a web framework, building a
    basic form page, and connecting to a database.


    # Installation


    It is possible to install Node.js from the raw source code, but it''s much simpler
    to install using a package manager.


    Go to https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager
    and follow the instructions for your particular distribution. There are currently
    instructions for Gentoo, Debian, Ubuntu, openSUSE and SLE (SUSE Linux Enterprises),'
