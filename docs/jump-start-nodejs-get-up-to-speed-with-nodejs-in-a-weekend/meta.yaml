    \ custom error message, the layout and content of which can be modified as desired.\n\
    \n## Hosting Options\n\nWhen it comes to hosting your application, there are several\
    \ options available—each with its own advantages and disadvantages. The option\
    \ that gives the most control is the dedicated server. Another possibility is\
    \ Infrastructure as a Service (IaaS), with the most popular choice being Amazon's\
    \ EC2. This option offers a number of conveniences over a dedicated server. The\
    \ option we'll be using is Platform as a Service (PaaS). This method offers the\
    \ highest level of abstraction. A platform provider will handle your Node.js installation,\
    \ as well as maintenance and upgrades, which allows you to devote full attention\
    \ to your core competency of writing software.\n\nAlthough an IaaS platform such\
    \ as EC2 allows a systems administrator to easily bring new machines online, the\
    \ actual setup and deployment of these machines can require a lot of scripting.\
    \ Using a platform provider such as Heroku, scaling can sometimes be as easy as\
    \ changing a configuration setting, with no need to reinstall either Node.js or\
    \ your web application.\n\nThe cost of all this convenience is the loss of control.\
    \ Often, you’ll be without administrative access, and the level of abstraction\
    \ is such that often you’ll not even be dealing with a server. Instead, you interface\
    \ with a platform through a custom-written set of tools. Your application will\
    \ have to conform to the rules of the provider, and sometimes this can be inconvenient.\
    \ For example, Heroku has an ephemeral file system, which means that any written\
    \ files are discarded upon restarting.2 Depending on the changes that are required,\
    \ provider-specific code may also reduce the portability of your application.\n\
    \n## Run It Forever\n\nFor those choosing to deploy on either a dedicated server\
    \ or EC2, it’s worth briefly visiting a more robust option than the humble `node\
    \ nockmarket`. Perhaps by now you’ve realized that the stock standard way of running\
