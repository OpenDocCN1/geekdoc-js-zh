- md: "## chapter04/views/index.ejs (excerpt)\n\n<script type=\"text/javascript\"\
    \ src=\"http://spbooks.github.com/nodejs1/bootstrap-transition.js\"></script>\n\
    <script type=\"text/javascript\" src=\"/js/nockclient.js\"></script>\n</head>\n\
    \nCreate a new file called **nockclient.js** in `/public/js/` as follows:\n\n\
    ## chapter04/public/js/nockclient.js (excerpt)\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('.uname').blur(function(e) {\n        $.ajax({\n            type: 'GET'\n\
    \            , url: '/api/user/' + $('.uname').val()\n        }).done(function(found)\
    \ {\n            if (found == '1') {\n                $('#imagePlaceHolder').html('<img\
