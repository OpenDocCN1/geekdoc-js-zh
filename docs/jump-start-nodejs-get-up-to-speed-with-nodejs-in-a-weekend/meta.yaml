    \ 替代表单和 AJAX\n\n# 第 6 章\n\n## Backbone\n\n> “混沌是自然的法则；秩序是人类的梦想。”\n> ——亨利·B·亚当斯\n\
    \n软件工程关乎管理复杂性；这是我们不断重申的主题，但怎么强调都不为过。到目前为止，我们已经探讨了在服务器端管理复杂性的多种方法；然而，我们还没有讨论客户端的复杂性管理。迄今为止，我们一直通过注释\
    \ HTML 标签，然后通过 jQuery 操作它们来管理客户端代码。虽然这对较小的项目有效，但随着代码库规模的增长，管理复杂性的能力会迅速失效。\n\n\
    为了管理这类问题，已经构建了许多客户端框架。在本章中，我们将了解其中一个更流行的框架：Backbone.js。¹ Backbone 大致遵循 **MVC**\
    \ 模型，其中应用程序被划分为模型、视图和控制器。我们将探讨 Backbone 如何与 Node.js 结合，为终端用户呈现一个实时的图形用户界面，展示订单和交易。虽然最初的学习曲线有点陡峭，但最终结果是一个优雅的客户端代码管理方案，可以根据需要扩展到更大的代码库。\n\
    \n¹ http://backbonejs.org/\n\n## 模型、视图、控制器和 Backbone.js\n\n全面探讨 MVC 和 Backbone\
    \ 本身就可以成为一本书。对于初学者来说，无需担心；本章专为那些初次接触 MVC 和 Backbone 的人设计。然而，对于那些希望进一步深入探索的人，这里列出了一些推荐资源：\n\
    \n**http://net.tutsplus.com/tutorials/other/mvc-for-noobs/**\n一篇关于 MVC 的简要介绍，以\
    \ PHP 为目标语言编写。这样做的好处是，读者可以纯粹专注于架构方面，而不会陷入语言细节的泥沼。\n\n**http://backbonejs.org/#FAQ-mvc**\n\
    这段来自 Backbone 官方文档的片段解释了传统的 MVC 如何与 Backbone 的方法契合。\n\n**https://github.com/addyosmani/backbone-fundamentals**\n\
    一本开源的书籍，致力于相当详细地解释 Backbone。\n\n**https://github.com/documentcloud/backbone/wiki/Tutorials%2C-blog-posts-and-example-sites**\n\
    一个全面的 Backbone 示例和教程库。\n\n## 提前预览\n\n在我们获得最终收益之前，还有相当多的概念需要涵盖。让我们快速构建一个最终产品的模型，因为它将提供一个方便的路线图来指导我们。我们将从一个简单的\
    \ Bootstrap 模型开始。\n\n代码是纯 HTML，可以在 https://gist.github.com/3949965 获取。复制代码并将其粘贴到\
    \ **portfolio.ejs** 中，如下所示：\n\n```html\nchapter06/views/portfolio.ejs (摘录)\n\n\
    <div class=\"tab-pane\" id=\"tab2\">\n  <!-- 将代码粘贴到这里 -->\n</div>\n```\n\n你的 **Nockmarket**\
    \ 选项卡现在应该类似于图 6.1。\n\n## 欢迎来到 Nockmarket\n\n在这里，你可以管理你的投资组合并查看实时价格。\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_135_0.png)\n\
    \n图 6.1. 显示价格的 **Nockmarket** 选项卡\n\n## 客户端过滤\n\n我们将实现一个过滤器，允许用户根据特定股票的代码过滤其投资组合。有几种方法可以实现这一点，效率最低的是传统的表单提交。这涉及到整个页面的刷新，包括我们知道将保持不变的页面部分。\n\
    \n一个更好的方法是使用 Ajax，因为它只会更改涉及新数据的页面部分。这将比完整的页面刷新更快，但仍然需要调用服务器，这可能会根据用户与你网站之间的连接情况导致体验迟缓。\n\
    \n通过将 jQuery 与 HTML 标签注释相结合，可以构建一种临时解决方案来处理客户端问题。Backbone 是一个轻量级的框架，它将强制采用始终如一的方法。使用这样的框架是首选，因为它将提高代码的可读性和可维护性。\n\
    \n我们的第一个任务是改变初始股票投资组合从服务器传输到客户端的方式。目前，用户发出请求，数据在服务器上组装，然后被输入模板并呈现给用户。\n\nBackbone\
    \ 的方法如下。与之前一样，用户发出请求。然后 Backbone 向服务器端 API 发出请求。数据被放置在客户端的模型中。随后的更改在模型上进行，绑定指定这些更改应如何反映在用户界面中。让我们继续一个具体的例子来帮助说明这个概念。修改\
