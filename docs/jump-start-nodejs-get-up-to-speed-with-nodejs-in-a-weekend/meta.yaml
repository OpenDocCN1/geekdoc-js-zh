    \ to represent which stock we're trading. Then, instead of using a single universal\
    \ `exchangeData`, we use separate `exchangeData` for each stock. We now modify\
    \ our order with a field `stock` to indicate which stock we're trading in:\n\n\
    ```javascript\n// chapter05/nockmarket.js (excerpt)\nvar ord = nocklib.generateRandomOrder(exchangeData);\n\
