    \ book.⁶\n\n> ### Objects as Hash Tables\n\nGuillermo Rauch has written an article\
    \ about some of the pitfalls of using an object as a hash.⁷ The main danger lies\
    \ in potential collisions that can occur when users are allowed to provide arbitrary\
    \ input. This does not apply in our case because the inputs to the object are\
    \ strictly under our control.\n\nWe will make two small modifications. First,\
    \ we allow the user to pass a flag indicating whether the heap is maximum or minimum\
    \ (that is, whether it starts at the largest value or smallest value). This is\
    \ done by transforming the original code:\n\n```\nthis.content.push(element);\n\
    ```\n\n... into the following:\n\n```\nif (this.options.max) {\n    this.content.push(-element);\n\
    }\nelse\n    this.content.push(element);\n```\n\nIf users wish for a maximum heap,\
    \ all that they need do is reverse the sign of the number. Internally, the data\
