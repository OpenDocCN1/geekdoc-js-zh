    \n这段代码的第一行与我们之前见过的类似，只是 `app.get` 被替换成了 `app.post`。接下来的两行从请求对象中提取用户名和密码。下一行 `User.addUser(username,\
    \ password, function(err, user)` 看起来有点神秘。`User` 从哪里来？它来自我们即将创建的 users 模块。Node.js\
    \ 附带了一个优秀的模块系统，允许程序员封装函数。关注点分离是管理复杂性的核心编程原则，而 Node.js 使得编写执行特定、定义明确任务的模块变得非常容易。添加用户后，我们重定向回表单页面。\n\
    \n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_30_0.png)\n\n### 真实世界开发\n\n在现实世界中，Express\
    \ 提供了许多有用的抽象。这意味着在未来，我们不需要以目前这种方式从磁盘读取文件。还要注意，默认情况下，Node.js 不支持代码的 \"热交换\"，这意味着只有在你重新启动\
    \ Node.js 时，更改才会生效。这过一会儿会变得很乏味，所以我建议你在某个时候安装 `node-supervisor`，以便在文件更改时自动重启系统。¹⁴\n\
    \n## 数据库\n\n为了创建用户模块，我们需要编写一个数据库模块。将以下代码放入一个名为 **lib** 的目录中一个名为 **db.js** 的文件中：\n\
    \n```javascript\n// chapter01/authentication/lib/db.js\nvar mongoose = require('mongoose');\n\
    var Schema = mongoose.Schema;\n\nmodule.exports.mongoose = mongoose;\nmodule.exports.Schema\
    \ = Schema;\n\n// Connect to cloud database\nvar username = \"user\"\nvar password\
    \ = \"password\";\nvar address = ' @dbh42.mongolab.com:27427/nockmarket';\nconnect();\n\
    \n// Connect to mongo\nfunction connect() {\n  var url = 'mongodb://' + username\
    \ + ':' + password + address;\n  mongoose.connect(url);\n}\nfunction disconnect()\
    \ {mongoose.disconnect()}}\n```\n\n连接到基于云的 NoSQL 提供商出乎意料地简单。你需要用你自己的个人信息替换 `username`、`password`\
    \ 和 `address`。例如，`var username = \"user\"` 可能会变成 `var username = \"bob927\"`。MongoLab\
    \ 提供了一个用户选项卡用于添加新用户，如图 1.4 所示。\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_31_0.png)\n\
    \n图 1.5 显示了可以获取数据库地址的位置。\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_31_1.png)\n\
    \n我们将使用 Mongoose 包，它允许从 Node.js 连接到 MongoDB。`module.exports` 是 Node.js 用于向其他模块暴露函数和变量的语法。我们将暴露\
    \ Mongoose 驱动程序以及 Mongoose Schema 对象。**Schema** 只是定义集合结构的一种方式。在这种情况下，我们的模式由一个用户名字符串和一个密码字符串组成。除此之外，我们定义了连接和断开数据库的函数。\n\
    \n下一步是定义用户模块。将此代码放入一个名为 **models** 的目录中一个名为 **User.js** 的文件中：\n\n```javascript\n\
    chapter01/authentication/models/User.js (excerpt)\n\nvar db = require('../lib/db');\n\
    \nvar UserSchema = new db.Schema({\n    username : {type: String, unique: true}\n\
    \    , password : String\n})\n\nvar MyUser = db.mongoose.model('User', UserSchema);\n\
    \n// Exports\nmodule.exports.addUser = addUser;\n\n// Add user to database\nfunction\
    \ addUser(username, password, callback) {\n    var instance = new MyUser();\n\
    \    instance.username = username;\n    instance.password = password;\n    instance.save(function\
    \ (err) {\n        if (err) {\n            callback(err);\n        }\n       \
    \ else {\n            callback(null, instance);\n        }\n    });\n}\n```\n\n\
    我们首先导入之前定义的数据库模块并定义一个简单的模式。然后我们可以实例化一个新用户，设置用户名和密码，并使用 **save** 函数保存到数据库。如果有错误，我们将其发送到回调函数。否则，我们返回实际的用户对象。\n\
    \n### 密码安全\n\n在这个例子中，我们以明文形式将密码存储在数据库中，这存在安全风险。通常，密码会被加密。还有其他基于对加密密码进行加盐以使其更能抵抗字典攻击的安全技术。\n\
    \n我们现在准备好将我们的用户模块与 Express 集成。这涉及向 **app.js** 文件添加一行额外的导入代码：\n\n```javascript\n\
    var express = require('express')\n, routes = require('./routes')\n, fs = require('fs')\n\
    , User = require('./models/User.js');\n```\n\n现在，如果你重启你的应用程序并提交你的表单，你应该会看到数据出现在\
    \ MongoLab 中，如图 1.6 所示。\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_33_0.png)\n\
    \n请注意，\"users\" 集合（可以粗略地理解为一张表）是自动创建的。构建你第一个支持云的 NoSQL 解决方案就是这么简单。如果你的下一个项目开始获得像\
    \ Facebook 或 Twitter 那样的流行度，你的基础设施将准备好进行扩展！\n\n¹⁴ [https://github.com/isaacs/node-supervisor](https://github.com/isaacs/node-supervisor)\n"
