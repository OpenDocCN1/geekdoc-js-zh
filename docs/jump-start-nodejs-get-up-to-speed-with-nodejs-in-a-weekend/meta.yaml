  md: "```\n3 tests complete (5ms)\n```\n\nIn testing (just as in finance), green\
    \ should rapidly become your favorite color.\n\n# What about the real thing?\n\
    \nI’m sure that some of you by now are wondering about real stock-market prices.\
    \ Stock-market data is among the most interesting data in the world; unfortunately,\
    \ the more interesting the data, the more expensive it is to access.\n\nThe freely\
    \ available data that we’re going to use is fairly pedestrian from both a finance\
    \ and technology perspective. It’s delayed data that contains only trade prices\
    \ with no volume and no order information available. The example we’ve been building\
    \ in this chapter, while simplified, still attempts to capture some of the richness\
    \ of real-world markets. This leads to much more interesting learning opportunities,\
    \ as we shall see in later chapters.\n\nTo prove how easy it is, we’ll write a\
    \ small module to retrieve real stock-market prices to finish off the chapter.\
