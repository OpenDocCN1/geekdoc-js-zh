    # Why MongoDB?


    In this chapter, we''ll learn to use MongoDB. MongoDB is a particular type of
    NoSQL database; specifically, it''s a document-oriented database system. The Node.js
    ecosystem has excellent support for many popular relational database systems such
    as PostgreSQL and MySQL. Relational databases are robust and time-tested, and
    would adequately serve the needs of many modern-day web applications. So why are
    we using MongoDB? Let''s now go over some of the main features of MongoDB to answer
    this question.


    One of the most prominent features about MongoDB is that it is document-oriented
    and schema-free. The document referred to in **document-oriented** is a BSON document.
    This stands for Binary JSON,¹ which is conceptually similar to a JSON object


    ¹ http://bsonspec.org/'
  merge: -1
  pgno: 59
- img_proc: true
  md: '42 Jump Start Node.js


    in JavaScript. **Schema-free** means that there''s no predefined structure. A
    simple way to consider MongoDB is as a giant array of JSON objects with fast and
    powerful insertion and searching capabilities.


    To a relational database purist, the concept of a schema-free database might be
    alien. However, there are certain use cases where MongoDB offers advantages over
    its relational counterpart.


    First of all, it''s well-suited to iterative development. Imagine we have a `Person`
    table and we wish to add a list of favorite movies. In a relational world, this
    would require an additional `Movie` table, and a joining table to store the relationships.
    In MongoDB, this could be done by simply adding an array of movies to the `Person`
    table, depending on the requirements. For a startup company with rapidly changing
    needs and an engineering team at capacity, the agility of MongoDB plays an important
    role.


    MongoDB is also appropriate for unstructured data. In the world of finance, the
    derivative is a complex instrument; there are thousands of types (for example,
    futures, options, and swaps), each with unique properties. Capturing this in a
    relational database would pose a number of challenges, but using MongoDB it''s
    as simple as representing the derivative in JSON and inserting it into the database.
    The derivatives can be of arbitrary complexity and sit side by side in a MongoDB
    collection.


    Furthermore, MongoDB was designed from the ground up for big data, which is supported
    through a mechanism known as **sharding**. The conventional book form of the Yellow
    Pages$^2$ is a simple example, where it is typically divided into two shards,
    A-K and L-Z. Searching is faster because you simply choose the appropriate shard—a
    smaller volume of data. Conceptually, this is how sharding works with databases,
    though implementation is more complex.


    Other use cases for MongoDB are discussed in detail on the official site.$^3$
    In addition, MongoDB is quickly becoming the de facto database for Node.js. Jason
    Hoffman, founder of Joyent, has given a presentation on Node.js and MongoDB as
    a modern stack for the real-time web,$^4$ replacing the traditional LAMP (Linux,
    Apache, MySQL,


    $^2$ http://www.yellowpages.com/

    $^3$ http://www.mongodb.org/display/DOCS/Use+Cases

    $^4$ http://www.10gen.com/presentations/mongosf-2012/n2m-nodejs-and-mongodb-as-the-modern-stack-for-the-real-time-web'
