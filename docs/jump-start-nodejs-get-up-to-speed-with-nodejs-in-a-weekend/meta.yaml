    \  return (BUY == orderType) ? price >= opp : price <= opp;\n}\nvar trade = isTrade();\n\
    ```\n\nFirst, we set up a small helper function, `getOpposite`. If it is a buy\
    \ order, we return `SELL`, and vice versa.\n\n> **Closures**\n\nNotice how `getOpposite`\
    \ \"knows\" about `orderType`, even though `orderType` was defined externally\
    \ to that function? This is an example of a programming technique known as closures.\
    \ Even though functional programming offers no support for the concept of objects,\
    \ closures allow us to represent states. In this case, our function can use the\
    \ order type even though it's not explicitly passed in as a parameter.\n\nFollowing\
    \ this, the logic for `isTrade` is simple. First, we obtain the maximum price.\
    \ For the case of a buy order, a trade occurs when the price is greater than or\
    \ equal to the smallest sell order. For example, if there's a new buy order at\
    \ a price of $40, a trade will occur if there's any existing sell order at $40\
    \ or less. In the case of a sell order, a trade occurs when the price is less\
