  - "[PAGE 98]\n\n# Jump Start Node.js\n\n```\nvar tokens = data.split('\\r\\n');\n\
    var prices = [];\ntokens.forEach(function(line) {\n  var price = line.split(\"\
    ,\")[1];\n  if (price)\n    prices.push(price);\n});\ncallback(null, prices);\n\
    ```\n\nThere is a one-to-one correspondence between the elements in the stock\
    \ array and the elements in prices. Now we'll write a function that allows the\
    \ user to add a stock to the portfolio. First, we'll amend our database wrapper\
    \ by editing **lib/db.js**:\n\n```\nchapter04/lib/db.js (excerpt)\n\n{\n  push:\
    \ function(name, id, updateQuery, callback) {\n    db.collection(name).update({_id:\
    \ id}\n      , {$push: updateQuery}, {safe:true}, callback);\n  }\n}\n```\n\n\
    We will represent the portfolio as an array of Strings within a user object. Here\
    \ we're creating a generic function to allow the application to push data into\
    \ an array. MongoDB's update function is combined with the $push modifier,^8 and\
    \ we use {safe:true} to ensure that the callback is only fired once the item is\
    \ inserted into the database. Without this, the callback function fires immediately.^9\n\
    \n> **Modifiers**\n\nMongoDB has a number of modifier operations that don't add\
    \ any new functionality as such. For instance, $push could be replicated by retrieving\
    \ the object, manually pushing an item into an array, and then saving the entire\
    \ object. What's handy about modifiers is that they can take place directly on\
    \ the server, removing the overhead of sending an object from the database to\
    \ the application and back again.\n\n^8 http://www.mongodb.org/display/DOCS/Updating/#Updating-%24push\n\
    ^9 http://mongodb.github.com/node-mongodb-native/markdown-docs/insert.html"
- md: "Many I/O operations deal with events that are dependent upon each other. A\
    \ typical example is to retrieve a user from the database based on ID and then\
    \ look up stock prices in the user's stock portfolio. In these scenarios, the\
    \ idiomatic Node.js technique for handling this is the **nested callback**, of\
    \ which you've seen many examples. Nested callbacks take the following form:\n\
    \n```javascript\ngetUser(id, function(err, user) {\n  getPrices(user.stocks, function(err,\
    \ prices) {\n    // handle prices\n  });\n});\n```\n\nIn this snippet, `getPrices`\
    \ will always run after `getUser`. This is by design and it makes sense because\
    \ we cannot know what prices to retrieve until the `user` object is returned from\
    \ the database.\n\nSuppose, however, that the events you're handling are independent,\
    \ such as adding a stock to the portfolio and retrieving the stock price from\
    \ Yahoo. When a user adds stock to the portfolio, two independent actions occur:\
    \ we add stock to the portfolio using MongoDB, and we retrieve the stock price\
    \ from Yahoo. Because of event independence, there's no need to run the events\
    \ serially. We want to run the events in parallel. Therefore we don't want to\
    \ use a nested callback.\n\nAssume that adding stock to the portfolio takes one\
    \ second, as does retrieving a price. Using a nested callback, the operation takes\
    \ two seconds because the second action needs to wait for the first to complete\
    \ before it can start. But if we were to run them in parallel, the total activity\
    \ would only take one second to complete.\n\nThe issue is that we're unaware which\
    \ event will finish first; so how do we determine where the callback should occur?\
    \ There are a number of libraries that abstract away this complication; however,\
    \ for this example, we'll avoid third-party libraries so that you can understand\
    \ the principles behind what is happening. Let us define a new function within\
    \ `nocklib.js`:\n\n```javascript\n// chapter04/lib/nocklib.js (excerpt)\nmodule.exports\
    \ = {\n  addStock: function(uid, stock, callback) {\n    var price;\n    module.exports.getStockPrices([stock]\n\
    \      , function(err, retrieved) {\n        price = retrieved[0];\n        doCallback();\n\
    \    });\n    db.push('users', new ObjectID(uid), {portfolio: stock}\n      ,\
    \ doCallback);\n  },\n  authenticate: function(username, password, callback) {\n\
    ```\n\n82 Jump Start Node.js\n\nHere we are defining a new function, `addStock`,\
    \ which will add a specified stock to the user's portfolio.\n\nThere are two additional\
    \ functions being called: `push` will add the stock to the user in the database,\
    \ while `getStockPrices` will retrieve the stock price using the function we've\
    \ just written. This function was written to handle multiple stocks, so it is\
    \ trivial to use it to retrieve a single price by sending in an array of size\
    \ one, and then retrieving the first element from the output.\n\nWe effectively\
    \ make both calls at the same time, but without knowing which one will return\
    \ first. This dilemma can be handled by having both events call the function `doCallback`,\
    \ which we define here:\n\n```javascript\n// chapter04/lib/nocklib.js (excerpt)\n\
    addStock: function(uid, stock, callback) {\n  function doCallback() {\n    counter++;\n\
    \    if (counter == 2) {\n      callback(null, price);\n    }\n  }\n  var counter\
    \ = 0;\n```\n\nWe use the variable `counter` to keep track of how many times the\
    \ callback function is called. In this way, it's of no consequence which function\
    \ returns first. We always ignore the first call and return the price on the second\
    \ call. There are libraries that elegantly abstract some of these details away;\
    \ a good choice is async. <sup>10</sup>\n\n<sup>10</sup> https://github.com/caolan/async/\n\
    \nNotice the use of `ObjectID` in our `addStock` function. It requires an additional\
    \ import:\n\n```javascript\n// chapter04/lib/nocklib.js (excerpt)\n, http = require('http')\n\
    , ObjectID = require('mongodb').ObjectID\n```\n\nTo use MongoDB Object IDs, it\
    \ is necessary to provide an actual `ObjectID` object. Avoid the mistake of sending\
    \ in a different format such as a `String`, as this will fail to work. The final\
    \ step is to add some routing to **nockmarket.js**:\n\n```javascript\n// chapter04/nockmarket.js\
    \ (excerpt)\napp.get('/api/user/:username', nockroutes.getUser);\napp.post('/add-stock',\
    \ nockroutes.addStock);\n```\n\n... and **nockroutes.js**:\n\n```javascript\n\
    // chapter04/routes/nockroutes.js (excerpt)\nmodule.exports = {\n  addStock: function(req,\
    \ res) {\n    if (req.xhr) { ❶\n      nocklib.addStock(req.session._id, req.body.stock\n\
    \        , function(err, price) { ❷\n          res.send(price); ❸\n      });\n\
    \    }\n  },\n\n  getIndex: function(req, res) {\n```\n\n1. First, we check that\
    \ the user is making an Ajax request.\n2. If so, we retrieve the ID from the session\
    \ with `req.session._id` and the stock code from the HTTP POST with `req.body.stock`.\
    \ Then we use our `addStock` function to add a stock to the portfolio and retrieve\
    \ the price.\n3. Lastly, we send the price back to the browser.\n\nThe back end\
    \ is now complete, so the next task is to connect it to the front end.\n\n## Bootstrap\
    \ Widgets\n\nBootstrap comes with a variety of widgets, all of which have been\
    \ meticulously crafted. Unfortunately, there’s no time to cover all the different\
    \ combinations in this book; however, once you have an example of how to integrate\
    \ the Bootstrap widgets with Node.js, it’s easy to take the principles and apply\
    \ it to any widget. In this particular example, we’ll use the tab interface. First,\
    \ let’s set up the head and body in **views/portfolio.ejs**:\n\n```html\n<!--\
    \ chapter04/views/portfolio.ejs (excerpt) -->\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Nockmarket</title>\n \
    \   <meta name=\"viewport\"\n          content=\"width=device-width, initial-scale=1.0\"\
    >\n    <link href=\"http://twitter.github.com/bootstrap/assets/css/bootstrap.css\"\
    \ rel=\"stylesheet\">\n    <link href=\"http://spbooks.github.com/nodejs1/docs.css\"\
    \ rel=\"stylesheet\">\n    <script src=\"http://twitter.github.com/bootstrap/assets/js/google-code-prettify/prettify.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/jquery.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-button.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-modal.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-transition.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://twitter.github.com/bootstrap/assets/js/bootstrap-tab.js\"\
    ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\nThis code is likely to be\
    \ very similar to any number of web pages you’ve set up in the past. Within the\
    \ header, we load our CSS and JavaScript. We then have an empty body, which we\
    \ begin to flesh out as follows:\n\n```html\n<!-- chapter04/views/portfolio.ejs\
    \ (excerpt) -->\n<body>\n  <div class=\"container\">\n    <div class=\"row\">\n\
    \    </div>\n  </div>\n</body>\n```\n\nFrom a design perspective, you can think\
    \ of a Bootstrap web page as being composed of a series of rows. Each row consists\
    \ of a number of columns; Bootstrap uses 12 columns by default. These can be constructed\
    \ as follows:\n\n```html\n<!-- chapter04/views/portfolio.ejs (excerpt) -->\n<div\
    \ class=\"row\">\n  <div class=\"offset2 span8\">\n  </div>\n</div>\n```\n\nHere\
    \ `offset2` specifies two empty columns. `span8` specifies that our actual content\
    \ takes eight columns. In total, we have now specified 10 columns worth of content;\
    \ the last two columns are empty. By having the same number of empty columns before\
    \ and after our content, we ensure that the content is centered. The next step\
    \ is to add the actual content from https://gist.github.com/3968465:\n\n```html\n\
    <!-- chapter04/views/portfolio.ejs (excerpt) -->\n<div class=\"offset2 span8\"\
    >\n  <!-- paste code here -->\n</div>\n```\n\nThis step is as simple as taking\
    \ the examples from the website and modifying the content accordingly. Then we\
    \ define some simple routes in **nockmarket.js**:\n\n```javascript\n// chapter04/nockmarket.js\
    \ (excerpt)\napp.get('/api/user/:username', nockroutes.getUser);\napp.get('/portfolio',\
    \ nockroutes.portfolio);\n```\n\nAs well as for **nockroutes.js**:"
  mdcn: "\n许多I/O操作处理相互依赖的事件。一个典型的例子是：先根据ID从数据库中检索用户，然后查询该用户股票投资组合中的股票价格。在这些场景中，Node.js处理此类任务的惯用技术是**嵌套回调**，你已经见过许多这样的例子。嵌套回调的形式如下：\n\
    \n```javascript\ngetUser(id, function(err, user) {\n  getPrices(user.stocks, function(err,\
    \ prices) {\n    // handle prices\n  });\n});\n```\n\n在这段代码中，`getPrices`总是在`getUser`之后运行。这是设计使然，并且合情合理，因为在`user`对象从数据库返回之前，我们无法知道应该检索哪些价格。\n\
    \n然而，假设你处理的事件是独立的，比如将股票添加到投资组合和从雅虎获取股票价格。当用户将股票添加到投资组合时，会发生两个独立的操作：我们使用MongoDB将股票添加到投资组合，并从雅虎获取股票价格。由于事件是独立的，没有必要串行执行它们。我们希望并行运行这些事件。因此，我们不想使用嵌套回调。\n\
    \n假设将股票添加到投资组合需要一秒钟，获取价格也需要一秒钟。使用嵌套回调，整个操作需要两秒钟，因为第二个操作需要等待第一个操作完成才能开始。但如果我们并行运行它们，整个活动只需一秒钟即可完成。\n\
    \n问题在于，我们不知道哪个事件会先完成；那么，我们应该在何处执行回调呢？有许多库可以抽象掉这种复杂性；然而，在这个例子中，我们将避免使用第三方库，以便你能理解背后发生的原理。让我们在`nocklib.js`中定义一个新函数：\n\
    \n```javascript\n// chapter04/lib/nocklib.js (excerpt)\nmodule.exports = {\n \
    \ addStock: function(uid, stock, callback) {\n    var price;\n    module.exports.getStockPrices([stock]\n\
    \      , function(err, retrieved) {\n        price = retrieved[0];\n        doCallback();\n\
    \    });\n    db.push('users', new ObjectID(uid), {portfolio: stock}\n      ,\
    \ doCallback);\n  },\n  authenticate: function(username, password, callback) {\n\
    ```\n\n82 Jump Start Node.js\n\n这里我们定义了一个新函数`addStock`，它将向用户的投资组合中添加指定的股票。\n\n\
    这里调用了两个额外的函数：`push`会将股票添加到数据库中的用户，而`getStockPrices`会使用我们刚刚编写的函数来获取股票价格。这个函数被设计用来处理多只股票，因此通过发送一个大小为1的数组，然后从输出中检索第一个元素，就可以轻松地用它来获取单只股票的价格。\n\
    \n我们有效地同时进行了这两个调用，但不知道哪个会先返回。这个难题可以通过让两个事件都调用`doCallback`函数来解决，我们在这里定义这个函数：\n\n\
    ```javascript\n// chapter04/lib/nocklib.js (excerpt)\naddStock: function(uid,\
    \ stock, callback) {\n  function doCallback() {\n    counter++;\n    if (counter\
    \ == 2) {\n      callback(null, price);\n    }\n  }\n  var counter = 0;\n```\n\
    \n我们使用变量`counter`来跟踪回调函数被调用的次数。这样，哪个函数先返回就无关紧要了。我们总是忽略第一次调用，而在第二次调用时返回价格。有一些库可以优雅地抽象掉这些细节；一个很好的选择是async库。<sup>10</sup>\n\
    \n<sup>10</sup> https://github.com/caolan/async/\n\n注意在`addStock`函数中使用了`ObjectID`。它需要额外的导入：\n\
    \n```javascript\n// chapter04/lib/nocklib.js (excerpt)\n, http = require('http')\n\
    , ObjectID = require('mongodb').ObjectID\n```\n\n要使用MongoDB对象ID，必须提供一个实际的`ObjectID`对象。避免发送不同格式（如`String`）的错误，因为这会导致失败。最后一步是向**nockmarket.js**添加一些路由：\n\
    \n```javascript\n// chapter04/nockmarket.js (excerpt)\napp.get('/api/user/:username',\
    \ nockroutes.getUser);\napp.post('/add-stock', nockroutes.addStock);\n```\n\n\
    ... 以及**nockroutes.js**：\n\n```javascript\n// chapter04/routes/nockroutes.js (excerpt)\n\
    module.exports = {\n  addStock: function(req, res) {\n    if (req.xhr) { ❶\n \
    \     nocklib.addStock(req.session._id, req.body.stock\n        , function(err,\
    \ price) { ❷\n          res.send(price); ❸\n      });\n    }\n  },\n\n  getIndex:\
    \ function(req, res) {\n```\n\n1.  首先，我们检查用户是否发起了Ajax请求。\n2.  如果是，我们使用`req.session._id`从会话中检索ID，并使用`req.body.stock`从HTTP\
    \ POST请求中获取股票代码。然后我们使用`addStock`函数将股票添加到投资组合并获取价格。\n3.  最后，我们将价格发送回浏览器。\n\n后端现已完成，因此下一项任务是将其连接到前端。\n\
    \n## Bootstrap小部件\n\nBootstrap附带了多种小部件，所有这些都经过精心制作。遗憾的是，本书没有时间涵盖所有不同的组合；然而，一旦你有了一个如何将Bootstrap小部件与Node.js集成的示例，就很容易将这些原则应用到任何小部件上。在这个特定的例子中，我们将使用标签页界面。首先，让我们在**views/portfolio.ejs**中设置head和body：\n\
    \n```html\n<!-- chapter04/views/portfolio.ejs (excerpt) -->\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Nockmarket</title>\n\
    \    <meta name=\"viewport\"\n          content=\"width=device-width, initial-scale=1.0\"\
    >\n    <link href=\"http://twitter.github.com/bootstrap/assets/css/bootstrap.css\"\
    \ rel=\"stylesheet\">\n    <link href=\"http://spbooks.github.com/nodejs1/docs.css\"\
    \ rel=\"stylesheet\">\n    <script src=\"http://twitter.github.com/bootstrap/assets/js/google-code-prettify/prettify.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/jquery.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-button.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-modal.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-transition.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"http://twitter.github.com/bootstrap/assets/js/bootstrap-tab.js\"\
    ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n这段代码可能与你过去设置的任何网页非常相似。在header中，我们加载CSS和JavaScript。然后我们有一个空的body，我们开始按照如下方式填充：\n\
    \n```html\n<!-- chapter04/views/portfolio.ejs (excerpt) -->\n<body>\n  <div class=\"\
    container\">\n    <div class=\"row\">\n    </div>\n  </div>\n</body>\n```\n\n\
    从设计角度来看，你可以认为Bootstrap网页是由一系列行组成的。每行由若干列组成；Bootstrap默认使用12列。这些可以如下构建：\n\n```html\n\
    <!-- chapter04/views/portfolio.ejs (excerpt) -->\n<div class=\"row\">\n  <div\
    \ class=\"offset2 span8\">\n  </div>\n</div>\n```\n\n这里`offset2`指定两个空白列。`span8`指定我们的实际内容占据八列。现在我们总共指定了10列的内容；最后两列是空的。通过在内容前后放置相同数量的空白列，我们确保内容居中。下一步是从\
    \ https://gist.github.com/3968465 添加实际内容：\n\n```html\n<!-- chapter04/views/portfolio.ejs\
    \ (excerpt) -->\n<div class=\"offset2 span8\">\n  <!-- paste code here -->\n</div>\n\
    ```\n\n这一步很简单，只需从网站获取示例并相应地修改内容即可。然后我们在**nockmarket.js**中定义一些简单的路由：\n\n```javascript\n\
