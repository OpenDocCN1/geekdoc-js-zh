    \ the user and then the stock prices for the user's portfolio. We send this into\
    \ the template in two variables, portfolio and prices. This requires us to add\
    \ getUserById in nocklib.js:\n\n```javascript\nchapter04/lib/nocklib.js (excerpt)\n\
    \ngetUserById: function(id, callback) {\n  db.findOne('users', {_id: new ObjectID(id)},\
    \ callback);\n},\n\ngetUser: function(username, callback) {\n```\n\nThe getUserById\
    \ function is similar to getUser, except that we search by _id instead of username.\
    \ Then we display the data in a template. Make the following modification to **portfolio.ejs**:\n\
    \n```html\nchapter04/views/portfolio.ejs (excerpt)\n\n<tbody class=\"stock-list\"\
    >\n  <% for (var i=0; i<portfolio.length; i++) { %>\n    <tr><td><%=portfolio[i]%></td><td><%=prices[i]%></td></tr>\n\
    \  <% } %>\n</tbody>\n```\n\nWe use a simple loop to display the data from the\
    \ array, and the functionality is now complete. To finish, there is just one last\
    \ piece to tidy up.\n\n## Password Protection\n\nAt the moment, the /portfolio\
    \ route can be accessed by anybody. Express.js provides middleware functionality,\
    \ which allows us to easily extend it with an access-checking mechanism. Define\
    \ the following function in nocklib.js:\n\n```javascript\nchapter04/lib/nocklib.js\
    \ (excerpt)\n\n},\n\nensureAuthenticated: function (req, res, next) {\n  if (req.session._id)\
    \ {\n    return next();\n  }\n  res.redirect('/');\n},\n\ngenerateRandomOrder:\
    \ function(exchangeData) {\n```\n\nWhen the user first logs in, we store the ID\
    \ in the session, which means that we check if the _id variable exists. If so,\
    \ we know that we have a logged-in user and the next function tells Express.js\
    \ to proceed as normal. If _id does not exist, we have a guest user whom we redirect\
    \ back to the home page.\n\nIn this function, we can perform checks of arbitrary\
    \ complexity. For example, rather than just checking for the existence of _id,\
    \ we could retrieve the entire user profile and ensure that administrator rights\
    \ exist before giving access to admin pages.\n\nProtecting the page is now ridiculously\
    \ easy:\n\n```javascript\nchapter04/nockmarket.js (excerpt)\n\napp.get('/portfolio',\
    \ nocklib.ensureAuthenticated,\n  nockroutes.portfolio);\n```\n\nNote how nocklib.ensureAuthenticated\
    \ appears to have been inserted into the middle of get. This feature of Express.js\
    \ allows it to be extensible and flexible. Now if you try to access /portfolio\
    \ without being signed in, you will be redirected to the home page.\n\n## Summary\n\
    \nIn this chapter, we've covered the following:\n\n- a basic introduction to Bootstrap\
    \ widgets\n- implementing a production authentication system and integrating this\
    \ with Bootstrap login and sign-up modals\n- providing faster and more interactive\
    \ experiences through Ajax\n- storing user data via sessions\n- using the Bootstrap-tabbed\
    \ interface to represent a stock portfolio\n- dynamically adding and displaying\
    \ stocks to the portfolio along with live prices\n- access control using Express.js\
    \ middleware\n\n## Chapter 5\n\n## The Real-time Web\n\n> \"If everything seems\
    \ under control, you’re not going fast enough.\" —Mario Andretti\n\nWelcome to\
    \ arguably the most important chapter in the book. Here we will learn the basics\
    \ of building a real-time chat website. This is made easy thanks to a package\
    \ called Socket.IO,¹ or, if you like, “jQuery for sockets.” What this means is\
    \ you only have to learn the Socket.IO API. Under the hood, the API might be using\
    \ WebSockets, Flash, Comet, and, in the future, technology that is yet to exist!\
    \ Socket.IO will seamlessly change protocols depending on the user’s browser capabilities\
    \ without you having to write any additional code.\n\nBy the end of this chapter,\
    \ you’ll have written a real-time chat application with the ability to detect\
    \ connecting and disconnecting users. You will have also connected Socket.IO to\
    \ the stock-market simulator we built in Chapter 2 to stream real-time trades\
    \ to a browser. Lastly, you’ll have seen how Socket.IO can be used as a replacement\
    \ for Ajax and traditional forms.\n\n¹ http://socket.io/\n\n## Jump Start Node.js\n\
    \n## Let's Chat\n\nEnter WebSocket.² In the words of the author, “The goal … is\
    \ to provide a mechanism for browser-based applications that need two-way communication\
    \ with servers that does not rely on opening multiple HTTP connections (for example,\
    \ using `<iframe>`s or `XMLHttpRequest` and long polling).”\n\nWebSocket is a\
    \ modern, bidirectional protocol that enables an interactive communication session\
    \ between the browser and a server. Its main current drawback is that implementation\
    \ is generally only available in the latest browsers. However, by using Socket.IO,\
    \ this low level detail is abstracted away and you, as the programmer, are relieved\
    \ of the need to write browser-specific code. Let us now see how we can incorporate\
    \ this technology into our application.\n\nWe’ll begin by building the prototypical\
    \ chat application. Perhaps our users will wish to discuss with each other the\
    \ merits of including more Apple stock in their portfolios, or the implications\
    \ of the latest Federal Reserve meeting. Almost everybody is introduced to Socket.IO\
    \ through a basic chat application. Although there are numerous examples of how\
    \ to build such an application in very few lines of code, most of them are simplified,\
    \ as they request that the user enter a display name. This removes the complication\
    \ of connecting Socket.IO to an authorization system, which we’ll actually be\
    \ learning how to do.\n\nSocket.IO is platform-agnostic and without built-in support\
    \ for Express.js. There is some work involved in allowing Socket.IO access to\
    \ the user ID session variable that we stored in Chapter 4. However, this step\
    \ is crucial in using Socket.IO in a real-world environment.\n\nLet’s begin with\
    \ an easier problem: building a front-end interface with our newly acquired Bootstrap\
    \ skills. First, let’s modify **portfolio.ejs** to add a new **Chat** tab:\n\n\
    ```html\nchapter05/views/portfolio.ejs (excerpt)\n\n<li><a href=\"#tab2\" data-toggle=\"\
    tab\">Nockmarket</a></li>\n<li><a href=\"#tab3\" data-toggle=\"tab\" id=\"chat-tab\"\
    >Chat</a></li>\n```\n\n² http://tools.ietf.org/html/rfc6455"
