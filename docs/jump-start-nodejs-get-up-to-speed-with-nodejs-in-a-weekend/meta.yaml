  md: '(PaaS). This method offers the highest level of abstraction. A platform provider
    will handle your Node.js installation, as well as maintenance and upgrades, which
    allows you to devote full attention to your core competency of writing software.


    Although an IaaS platform such as EC2 allows a systems administrator to easily
    bring new machines online, the actual setup and deployment of these machines can
    require a lot of scripting. Using a platform provider such as Heroku, scaling
    can sometimes be as easy as changing a configuration setting, with no need to
    reinstall either Node.js or your web application.


    The cost of all this convenience is the loss of control. Often, you’ll be without
    administrative access, and the level of abstraction is such that often you’ll
    not even be dealing with a server. Instead, you interface with a platform through
    a custom-written set of tools. Your application will have to conform to the rules
    of the provider, and sometimes this can be inconvenient. For example, Heroku has
    an ephemeral file system, which means that any written files are discarded upon
    restarting.² Depending on the changes that are required, provider-specific code
    may also reduce the portability of your application.


    # Run It Forever


    For those choosing to deploy on either a dedicated server or EC2, it’s worth briefly
    visiting a more robust option than the humble `node nockmarket`. Perhaps by now
    you’ve realized that the stock standard way of running Node.js is a little unstable.
    An exception has the potential to cause the entire application to crash. In Real-world
    Development, I recommended node-supervisor as a mechanism for facilitating automatic
    restarts upon file change. This has the added side benefit of automatically restarting
    your application upon any crash. Unfortunately, this is unsuitable for production
    because behind the scenes, there is some fairly intensive file monitoring taking
    place that can cause unnecessary overhead.


    Instead, I recommend a package called “forever,” installed in the standard way:


    ```

    sudo npm install -g forever

    ```


    Starting your application is now as simple as:


    > ² https://devcenter.heroku.com/articles/dynos#ephemeral-filesystem'
