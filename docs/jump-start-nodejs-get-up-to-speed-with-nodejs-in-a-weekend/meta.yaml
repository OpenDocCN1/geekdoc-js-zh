  md: "# # Jump Start Node.js\n\nNow we handle the case when there is a trade:\n\n\
    ```\nchapter02/lib/exchange.js *(excerpt)*\n:\nvar remainingVolume = volume;\n\
    var storePrice = true;\n\nif (trade) {\n  var oppBook = cloned[BUY]\n\n  if (orderType\
    \ == BUY)\n    oppBook = cloned[SELL]\n}\n```\n\n`remainingVolume` stores the\
    \ remaining volume after the trade. If a trade removes an entire level of the\
    \ order book, a new price will need to be stored and this is why we have `storePrice`.\n\
    \nOur first step is to store in `oppBook` the opposite side of the order book\
    \ to the current order. This is because a buy order interacts with the sell side\
    \ of the book, and vice versa. Then we have a while loop:\n\n```\nchapter02/lib/exchange.js\
    \ *(excerpt)*\n:\nwhile (remainingVolume > 0\n  && Object.keys(oppBook.volumes).length\
    \ > 0) {\n    var bestOppPrice = oppBook.prices.peek();\n    var bestOppVol =\
    \ oppBook.volumes[bestOppPrice];\n}\n```\n\nThe while loop checks to see that\
    \ there's still remaining volume, and that there are still orders on the other\
    \ side of the book. We use `Object.keys` to return all the own enumerable properties\
    \ in the object.<sup>8</sup> This lets us determine whether there are still orders\
    \ remaining. If so, we fetch the best price and volume available.\n\nThere are\
    \ now two possible cases for trading. We will illustrate with reference to the\
    \ original example, where we have a buy order of 100 units at $40 sitting in the\
    \ order book. The first case is too small to remove any levels of the order book.\
    \ In our example, this means any sell order of 99 units or fewer, as it will still\
    \ leave at least one unit remaining at $40:\n\n<sup>8</sup> https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/keys"
  merge: -1
