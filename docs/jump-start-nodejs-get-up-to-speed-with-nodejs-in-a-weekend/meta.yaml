- md: "## 68 Jump Start Node.js\n\n```javascript\nchapter04/views/index.ejs (excerpt)\n\
    <body>\n<!-- paste code here -->\n<div class=\"container\">\n```\n\nLastly, we\
    \ make a small modification to href for our **Sign Up** button:\n\n```html\nchapter04/views/index.ejs\
    \ (excerpt)\n<a data-toggle=\"modal\" href=\"#myModal\"\n    class=\"btn btn-primary\
    \ btn-large\">Sign Up</a>\n```\n\nWhen you refresh the page and click on **Sign\
    \ Up**, you should see a similar sight to Figure 4.2.\n\n![Figure 4.2. Sign Up\
    \ modal](img/89e83b9cba99d96b087ef2fbb3e7f632_86_0.png)\n\nFigure 4.2. **Sign\
    \ Up** modal\n\nThis concludes our whirlwind introduction to Bootstrap. For those\
    \ who wish to investigate in further detail, w3resource has an in-depth explanation\
    \ of all of the common widgets.⁴ I hope now you can see how easy it is to construct\
    \ a great-looking page. When we construct the user’s stock portfolio section,\
    \ we’ll flesh out some of the key Bootstrap features in further detail. It’s now\
    \ time to implement some of the back-end functionality.\n\n⁴ http://www.w3resource.com/twitter-bootstrap/tutorial.php\n\
    \n## A New User\n\nOur first task is to add a line of configuration to **nockmarket.js**\
    \ so that Express can parse form posts:\n\n```javascript\napp.configure(function\
    \ () {\n  app.use(express.bodyParser());\n  app.set('views', __dirname + '/views');\n\
    \  :\n});\n```\n\nNow let's modify **nocklib.js** by adding some functions to\
    \ help us create a new user. First, we'll need some new imports to be able to\
    \ encrypt the password and access our database library:\n\n```javascript\nvar\
    \ crypto = require('crypto')\n  , db = require('./db')\n  , exchange = require('./exchange')\n\
    ```\n\nNext, let's write a function to encrypt a plain-text password. Place the\
    \ following below the module.exports = { ... } code. It's unnecessary to expose\
    \ this to other libraries because they do not require access to our encryption\
    \ algorithm:\n\n```javascript\nfunction encryptPassword(plainText) {\n  return\
    \ crypto.createHash('md5').update(plainText).digest('hex');\n}\n```\n\nHere, we're\
    \ using the built-in **crypto** library. If some of the functions seem a little\
    \ opaque, don't worry too much about it. Understanding what **createHash** and\
    \ **digest** do behind the scenes is unimportant. For the perpetually curious,\
    \ there is some detailed documentation of the crypto library on the official site.⁵\n\
    \n> **Robust Password Security**\n\nMD5 is generally considered a weak mechanism\
    \ for storing passwords in production. bcrypt is a more secure alternative because\
    \ it takes a lot longer to attack by brute force.⁶ As you've come to expect, there\
    \ is a package available for handling bcrypt encryption.⁷ Because password functionality\
    \ is encapsulated in a single function, it's easy to experiment with different\
    \ hashing algorithms if you so desire.\n\nNow let's write a function to access\
    \ user data and import it into the database:\n\n```javascript\nchapter04/lib/nocklib.js\
    \ (excerpt)\n\nmodule.exports = {\n  createUser: function(username, email, password,\
    \ callback) {\n    var user = {username: username, email: email\n      , password:\
    \ encryptPassword(password)};\n    db.insertOne('users', user, callback);\n  },\n\
    \n  generateRandomOrder: function(exchangeData) {\n```\n\nHere we take the raw\
    \ form inputs and construct a JSON object to represent the user. We never store\
    \ the plain-text password; it is inserted into the database encrypted:\n\n```javascript\n\
    password: encryptPassword(password)\n```\n\nFinally, we use our `insertOne` function\
    \ to insert a new user. This is almost identical to the way we insert new transactions.\
    \ The only change is that we use a different collection name: `users` instead\
    \ of `transactions`. We now need to add a route to **nockmarket.js** in order\
    \ to accept form submissions from the browser:\n\n```javascript\nchapter04/nockmarket.js\
    \ (excerpt)\n\napp.get('/', nockroutes.getIndex);\napp.post('/signup', nockroutes.signup);\n\
    ```\n\nAll we do here is define the route. The remainder of the routing code goes\
    \ into **nockroutes.js**:\n\n```javascript\nchapter04/routes/nockroutes.js (excerpt)\n\
    \nvar nocklib = require('../lib/nocklib');\n\nmodule.exports = {\n  getIndex:\
    \ function(req, res) {\n    res.render('index');\n  },\n  signup: function(req,\
    \ res) {\n    nocklib.createUser(req.body.username\n      , req.body.email\n \
    \     , req.body.password, function(err, user) {\n        console.log(user);\n\
    \        res.redirect('/portfolio');\n    });\n  }\n}\n```\n\nRemember the import\
    \ of nocklib as the first line, and the comma after getIndex! One more task is\
    \ to remove the ASCII logging as this will no longer be required. In **nockmarket.js**,\
    \ comment out `console.log(exch.getDisplay(exchangeData));` and `console.log('order',\
    \ ord);` with `//`. Both can be found within the function, submitRandomOrder.\
    \ Soon we’ll be looking at much nicer ways to present the data.\n\nBecause we\
    \ added the body parser earlier (using `app.use(express.bodyParser())`), we can\
    \ retrieve the form parameters using `req.body.username`, `req.body.email`, and\
    \ `req.body.password`. We then send these parameters to our createUser function.\
    \ I’ve included some logging so that you receive some feedback when the new user\
    \ is created. The last step redirects to **/portfolio**.\n\nIf you now restart\
    \ the application and create a new user, you should see the following or similar\
    \ in your console:\n\n```json\n{ username: 'nockuser',\n  email: 'user@nockmarket.org',\n\
    \  password: 'ebb080afaac3a990ad3f1d0f21742fac',\n  _id: 501a16f5046680f873000003\
    \ }\n```\n\nWe know that a user has been successfully created because the _id\
    \ exists. It must have been created by the database because we’re unable to generate\
    \ it ourselves.\n\nNote that the password has been encrypted. You should be redirected\
    \ to /portfolio with the message:\n\n```\nCannot GET /portfolio\n```\n\nWe'll\
    \ be implementing this functionality a little later in the chapter.\n\n## There\
    \ Can Be Only One\n\nUsers can now register on our website, but there is still\
    \ one small problem. Duplicate registrations are allowed, which means that two\
    \ unique users can end up with the same username. We'll now put in an Ajax check\
    \ to inform the user whether their particular choice of username has already been\
    \ taken.\n\n> ### Why Ajax?\n>\n> Ajax stands for Asynchronous JavaScript and\
    \ XML. Ajax, via the XMLHttpRequest object, allows small pieces of information\
    \ to be transmitted back and forth between a browser and a web server. Prior to\
    \ this, even small changes to a page involved a full reload, leading to a sluggish\
    \ user experience. Ajax enables a snappier, more responsive and interactive experience,\
    \ as the following example demonstrates.\n\nFirst, let's write a small library\
    \ function to search by username. This can be done in a single line of business\
    \ logic. Add the following to **nocklib.js**:\n\n```javascript\nchapter04/lib/nocklib.js\
    \ (excerpt)\n\n},\n\ngetUser: function(username, callback) {\n    db.findOne('users',\
    \ {username: username}, callback);\n}\n}\n```\n\nThe query to search for a matching\
    \ username is basic:\n\n```javascript\n{username: username}\n```\n\nThis query\
    \ is in standard JSON syntax, which means that the left `username` refers to the\
    \ field name and the right `username` refers to the variable. Once actual data\
    \ is involved the query might resemble this: `{username: 'johnsmith'}`. We then\
    \ add the associated routing. Append this route to **nockmarket.js**:\n\n```javascript\n\
    chapter04/nockmarket.js (excerpt)\n\napp.get('/', nockroutes.getIndex);\napp.get('/api/user/:username',\
    \ nockroutes.getUser);\n```\n\nNote how a regular expression is used in the routing:\n\
    \n```\n/api/user/:username\n```\n\nThe `:username` portion means that we store\
    \ anything after `/api/user/` in a variable called `username`. For example, if\
    \ a person tries to access `/api/user/james`, the value 'james' will be stored\
    \ inside `req.params.username`.\n\nTo complete the routing, add the following\
    \ to **nockroutes.js**:\n\n```javascript\nchapter04/routes/nockroutes.js (excerpt)\n\
    \n},\n\ngetUser: function(req, res) {\n  nocklib.getUser(req.params.username,\
    \ function(err, user) {\n    if (user)\n      res.send('1');\n    else\n     \
    \ res.send('0');\n  });\n},\n\nsignup: function(req, res) {\n```\n\nOnce we use\
    \ this information in conjunction with our library to search for the user, the\
    \ logic is simple. If the user exists, we send back '1' to indicate to the client\
    \ that the user has been found. Otherwise, we send back '0'.\n\nThat's all we\
    \ need for the back end. Our last effort is to connect it to the front end using\
    \ jQuery. Import a new JavaScript source code file by editing **index.ejs**:\n\
    \n⁶ http://codahale.com/how-to-safely-store-a-password/\n⁷ https://github.com/ncb000gt/node.bcrypt.js"
  mdcn: "\n## 68 快速上手 Node.js\n\n```javascript\nchapter04/views/index.ejs（节选）\n<body>\n\
    <!-- 将代码粘贴在此处 -->\n<div class=\"container\">\n```\n\n最后，我们为**注册**按钮的 `href` 做一点小修改：\n\
    \n```html\nchapter04/views/index.ejs（节选）\n<a data-toggle=\"modal\" href=\"#myModal\"\
    \n    class=\"btn btn-primary btn-large\">注册</a>\n```\n\n刷新页面并点击**注册**按钮后，你应该会看到类似图\
    \ 4.2 的界面。\n\n![图 4.2. 注册模态框](img/89e83b9cba99d96b087ef2fbb3e7f632_86_0.png)\n\
    \n图 4.2. **注册**模态框\n\n至此，我们对 Bootstrap 的快速介绍就结束了。希望深入了解的朋友，可以参考 w3resource 上对所有常用部件的深入讲解。⁴\
    \ 我希望你现在能体会到构建一个外观精美的页面是多么简单。在构建用户股票投资组合部分时，我们将更详细地阐述一些关键的 Bootstrap 特性。现在，是时候实现一些后端功能了。\n\
    \n⁴ http://www.w3resource.com/twitter-bootstrap/tutorial.php\n\n## 新用户\n\n我们的第一个任务是向\
    \ **nockmarket.js** 添加一行配置，以便 Express 能够解析表单提交：\n\n```javascript\napp.configure(function\
    \ () {\n  app.use(express.bodyParser());\n  app.set('views', __dirname + '/views');\n\
    \  :\n});\n```\n\n现在，让我们修改 **nocklib.js**，添加一些函数来帮助我们创建新用户。首先，我们需要导入一些新的模块，以便能够加密密码并访问我们的数据库库：\n\
    \n```javascript\nvar crypto = require('crypto')\n  , db = require('./db')\n  ,\
    \ exchange = require('./exchange')\n```\n\n接下来，我们来编写一个函数，用于加密明文密码。将以下代码放在 `module.exports\
    \ = { ... }` 代码块之后。没有必要将此函数暴露给其他库，因为它们不需要访问我们的加密算法：\n\n```javascript\nfunction\
    \ encryptPassword(plainText) {\n  return crypto.createHash('md5').update(plainText).digest('hex');\n\
    }\n```\n\n这里，我们使用了内置的 **crypto** 库。如果有些函数看起来有点晦涩，请不必过于担心。理解 **createHash** 和 **digest**\
    \ 在幕后具体做什么并不重要。对于永远充满好奇的朋友，可以在其官方网站上找到 crypto 库的详细文档。⁵\n\n> **健壮的密码安全性**\n\nMD5\
    \ 在生产环境中通常被认为是一种用于存储密码的弱机制。bcrypt 是一种更安全的替代方案，因为通过暴力破解需要花费更长的时间。⁶ 如你所料，有一个现成的包可以处理\
    \ bcrypt 加密。⁷ 因为密码功能被封装在一个函数中，所以如果你想尝试不同的哈希算法，这将变得很容易。\n\n现在，让我们编写一个函数来访问用户数据并将其导入数据库：\n\
    \n```javascript\nchapter04/lib/nocklib.js（节选）\n\nmodule.exports = {\n  createUser:\
    \ function(username, email, password, callback) {\n    var user = {username: username,\
    \ email: email\n      , password: encryptPassword(password)};\n    db.insertOne('users',\
    \ user, callback);\n  },\n\n  generateRandomOrder: function(exchangeData) {\n\
    ```\n\n在这里，我们获取原始的表单输入并构造一个 JSON 对象来表示用户。我们从不存储明文密码；它在插入数据库时是经过加密的：\n\n```javascript\n\
    password: encryptPassword(password)\n```\n\n最后，我们使用 `insertOne` 函数插入一个新用户。这与我们插入新交易的方式几乎完全相同。唯一的变化是使用了不同的集合名称：`users`\
    \ 而不是 `transactions`。现在我们需要在 **nockmarket.js** 中添加一个路由，以便接收来自浏览器的表单提交：\n\n```javascript\n\
    chapter04/nockmarket.js（节选）\n\napp.get('/', nockroutes.getIndex);\napp.post('/signup',\
    \ nockroutes.signup);\n```\n\n我们在这里所做的只是定义路由。其余的路由代码放在 **nockroutes.js** 中：\n\n\
    ```javascript\nchapter04/routes/nockroutes.js（节选）\n\nvar nocklib = require('../lib/nocklib');\n\
    \nmodule.exports = {\n  getIndex: function(req, res) {\n    res.render('index');\n\
    \  },\n  signup: function(req, res) {\n    nocklib.createUser(req.body.username\n\
    \      , req.body.email\n      , req.body.password, function(err, user) {\n  \
    \      console.log(user);\n        res.redirect('/portfolio');\n    });\n  }\n\
    }\n```\n\n请记住第一行导入了 nocklib，以及 getIndex 后面的逗号！还有一项任务是移除 ASCII 日志记录，因为这将不再需要。在\
    \ **nockmarket.js** 中，使用 `//` 注释掉 `console.log(exch.getDisplay(exchangeData));`\
    \ 和 `console.log('order', ord);`。这两行都可以在 submitRandomOrder 函数中找到。很快我们将探讨更友好的数据呈现方式。\n\
    \n因为我们之前添加了 body 解析器（使用 `app.use(express.bodyParser())`），所以我们可以使用 `req.body.username`、`req.body.email`\
    \ 和 `req.body.password` 来获取表单参数。然后我们将这些参数发送给我们的 createUser 函数。我添加了一些日志记录，以便在创建新用户时你能获得一些反馈。最后一步是重定向到\
    \ **/portfolio**。\n\n如果你现在重启应用程序并创建一个新用户，你应该会在控制台中看到以下或类似的内容：\n\n```json\n{ username:\
    \ 'nockuser',\n  email: 'user@nockmarket.org',\n  password: 'ebb080afaac3a990ad3f1d0f21742fac',\n\
    \  _id: 501a16f5046680f873000003 }\n```\n\n我们知道用户已成功创建，因为 `_id` 存在。它一定是数据库创建的，因为我们无法自己生成它。\n\
    \n请注意密码已被加密。你应该会被重定向到 /portfolio，并显示消息：\n\n```\nCannot GET /portfolio\n```\n\n\
    我们将在本章后面实现这个功能。\n\n## 唯一性\n\n用户现在可以在我们的网站上注册，但还有一个小问题。允许重复注册，这意味着两个不同的用户最终可能拥有相同的用户名。我们现在将加入一个\
    \ Ajax 检查，以告知用户他们选择的用户名是否已被占用。\n\n> ### 为什么使用 Ajax？\n>\n> Ajax 代表异步 JavaScript\
    \ 和 XML。Ajax 通过 XMLHttpRequest 对象，允许在浏览器和 Web 服务器之间来回传输少量信息。在此之前，即使是页面的微小变更也需要完全重新加载，导致用户体验迟缓。Ajax\
    \ 能够提供更快速、响应更灵敏和更具交互性的体验，如下例所示。\n\n首先，让我们编写一个按用户名搜索的小库函数。这可以通过一行业务逻辑完成。将以下内容添加到\
    \ **nocklib.js**：\n\n```javascript\nchapter04/lib/nocklib.js（节选）\n\n},\n\ngetUser:\
    \ function(username, callback) {\n    db.findOne('users', {username: username},\
    \ callback);\n}\n}\n```\n\n搜索匹配用户名的查询很简单：\n\n```javascript\n{username: username}\n\
    ```\n\n此查询采用标准 JSON 语法，这意味着左边的 `username` 指字段名，右边的 `username` 指变量。一旦涉及实际数据，查询可能类似于：`{username:\
    \ 'johnsmith'}`。然后我们添加关联的路由。将此路由附加到 **nockmarket.js**：\n\n```javascript\nchapter04/nockmarket.js（节选）\n\
    \napp.get('/', nockroutes.getIndex);\napp.get('/api/user/:username', nockroutes.getUser);\n\
    ```\n\n注意路由中使用的正则表达式：\n\n```\n/api/user/:username\n```\n\n`:username` 部分意味着我们将\
    \ `/api/user/` 之后的任何内容存储在一个名为 `username` 的变量中。例如，如果有人尝试访问 `/api/user/james`，值\
    \ 'james' 将被存储在 `req.params.username` 中。\n\n要完成路由，请将以下内容添加到 **nockroutes.js**：\n\
    \n```javascript\nchapter04/routes/nockroutes.js（节选）\n\n},\n\ngetUser: function(req,\
    \ res) {\n  nocklib.getUser(req.params.username, function(err, user) {\n    if\
    \ (user)\n      res.send('1');\n    else\n      res.send('0');\n  });\n},\n\n\
    signup: function(req, res) {\n```\n\n一旦我们使用此信息结合我们的库来搜索用户，逻辑就很简单。如果用户存在，我们返回 '1'\
    \ 以告知客户端找到了该用户。否则，我们返回 '0'。\n\n这就是我们需要的全部后端功能。我们的最后一步是通过 jQuery 将其连接到前端。通过编辑 **index.ejs**\
    \ 导入一个新的 JavaScript 源代码文件：\n\n⁶ http://codahale.com/how-to-safely-store-a-password/\n\
    ⁷ https://github.com/ncb000gt/node.bcrypt.js\n"
