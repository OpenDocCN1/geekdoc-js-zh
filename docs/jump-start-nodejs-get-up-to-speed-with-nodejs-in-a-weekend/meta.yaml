    Our first step is to store in `oppBook` the opposite side of the order book to\
    \ the current order. This is because a buy order interacts with the sell side\
    \ of the book, and vice versa. Then we have a while loop:\n\n```javascript\nchapter02/lib/exchange.js\
    \ (excerpt)\n\nwhile (remainingVolume > 0\n  && Object.keys(oppBook.volumes).length\
    \ > 0) {\n    var bestOppPrice = oppBook.prices.peek();\n    var bestOppVol =\
    \ oppBook.volumes[bestOppPrice];\n}\n```\n\nThe while loop checks to see that\
    \ there's still remaining volume, and that there are still orders on the other\
    \ side of the book. We use `Object.keys` to return all the own enumerable properties\
    \ in the object.<sup>8</sup> This lets us determine whether there are still orders\
    \ remaining. If so, we fetch the best price and volume available.\n\nThere are\
    \ now two possible cases for trading. We will illustrate with reference to the\
    \ original example, where we have a buy order of 100 units at $40 sitting in the\
