    \      var options = {};\n      if (BUY == orderType) options.max = true;\n  \
    \    exchange[orderType].prices = createBinaryHeap(options);\n    }\n  }\n}\n\
    ```\n\nThis warrants further explanation. Why go to the trouble of cloning the\
    \ data? Why not just manipulate it directly as we might do in object-oriented\
    \ programming? In pure functional programming, functions have no side effects.\
    \ This means that if you pass a parameter into a function, you expect it to emerge\
    \ unchanged on the other side.\n\nThis makes a lot of sense. Imagine that you're\
    \ using a public API and you feed it some data, which then appears mangled in\
    \ the response. That piece of data is rendered effectively unusable because without\
    \ knowing the internal workings of the API, it's difficult to work out what has\
    \ changed.\n\nThat's why we clone the exchange data that has been passed in. If\
    \ somebody wishes to use it subsequently in a different context, they can do so\
    \ safe in the knowledge that their data has passed through untouched. Although\
    \ the following does not apply to single-threaded JavaScript, immutable data also\
    \ makes it easier to write multi-threaded applications because the data can be\
    \ used by multiple threads, safe in the knowledge that its value will never change."
  - "[PAGE 47]\n\n# The Perils of Mutation\n\nThe native MongoDB driver for Node.js\
    \ (to be discussed in Chapter 3) mutates inserted objects by adding an _id field.\
    \ Most of the time this is fine; however, there are some edge cases where trouble\
    \ can arise. For example, you will receive an error if you try to insert the same\
    \ object twice. The first insert will work but the second one will complain about\
    \ a duplicate ID.\n\nIt can be a source of confusion if you’re unaware of the\
    \ internal workings of the driver. In a purely functional language such as Haskell,\
    \ this isn’t an issue because you’re guaranteed the value will never change. While\
    \ it can sometimes be impractical to program in a purely functional style, I certainly\
    \ encourage adopting its principles wherever possible.\n\nThe second interesting\
    \ feature of the createExchange function code is that it contains another function\
    \ called init. JavaScript allows for the declaration of functions within functions.\
    \ Within init, we perform some basic initialization: if we receive empty exchange\
    \ data, we set up an empty object to represent volumes and a new binary heap to\
    \ indicate prices. As previously discussed, for buy orders we use a maximum binary\
    \ heap because trades occur at the highest buy prices.\n\n# The Meat of the Problem\n\
    \nNow we’ll build the core of the exchange. First, we’ll set up some support functions:\n\
    \n```\nchapter02/lib/exchange.js (excerpt)\n\n        exchange[orderType].prices\
