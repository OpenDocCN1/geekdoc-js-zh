    # 6 Jump Start Node.js


    Fedora, and RHEL/CentOS, as well as several other Linux distributions. Windows
    and Mac OS X instructions are also available.


    After installation, type node at the command line to bring up the read-eval-print
    loop (REPL). You can test your installation by typing:


    ```

    console.log(''Hello world'')

    ```


    You should receive:


    ```

    Hello world

    undefined

    ```


    If you did, congratulations! You have just written your first Node.js program.
    The console always prints out the return type. This is why Hello world is followed
    by undefined. Now that you''ve written the canonical Hello world program, I''m
    happy to inform you that it will be the first and last boring program you''ll
    see in this book. To prove my point, we''ll now jump straight in and build an
    authentication module to verify usernames and passwords using cloud-based NoSQL
    technology. (If you''re scratching your head and wondering what this means, don''t
    worry—all will be revealed shortly!)


    So what is **cloud-based NoSQL** technology, and why should you care? There''s
    been a lot of hype around cloud-based technology. For our purposes, cloud technology
    is useful because it allows our applications to scale: additional virtual servers
    can be brought online with just a few mouse clicks.


    The NoSQL movement is relatively recent and, as such, it is difficult to arrive
    at a comprehensive definition of what the technology encompasses. Broadly, it
    can be thought of as a family of database technologies built for handling large
    masses of unstructured and semi-structured data. Companies such as Google, Amazon,
    and Facebook make extensive use of NoSQL technology to house the vast quantities
    of data generated by their users.


    For this book, we will be using MongoDB as our NoSQL database for reasons that
    will be fleshed out in more detail in Chapter 3. MongoDB is a mature and scalable
    document-oriented database that has been deployed successfully in enterprise en-'
  - '[PAGE 25]


    vironmentments such as foursquare and craigslist.<sup>8</sup> A **document-oriented
    database** is a database where the traditional database row is replaced with a
    less structured document, such as XML or JSON. MongoDB allows ad hoc queries and
    so retains much of the flexibility that SQL offers. I''ve chosen MongoLab<sup>9</sup>
    as a cloud provider for our stock monitoring application because it has a generous
    free hosting plan in place.


    # Assembling the Pieces


    The first step is to go to MongoLab, seen in Figure 1.2, and sign up an account.
    Then click on **Create New** next to Databases. Leave the cloud provider as Amazon
    EC2 and select the free pricing plan. Choose a database name, a username, and
    password.


    Now we''ll set up the web framework. Node.js provides a built-in, bare-bones HTTP
    server. Built on top of this is Connect, a middleware framework that provides
    support for cookies, sessions, logging, and compression, to name a few.<sup>10</sup>
    On top of Connect is Express, which has support for routing, templates (using
    the Jade templating engine), and view rendering.<sup>11</sup> Throughout this
    book we''ll predominantly use Express.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_25_0.png)


    Express can be installed with the following command:


    ```

    sudo npm install -g express@2.5.8

    ```'
