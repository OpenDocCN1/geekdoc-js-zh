  - "[PAGE 32]\n\n# 14 Jump Start Node.js\n\nWe will expose the Mongoose driver as\
    \ well as the Mongoose Schema object. A **schema** is simply a way to define the\
    \ structure of a collection. In this case, our schema consists of a username string\
    \ and a password string. Other than that, we define functions to connect and disconnect\
    \ from the database.\n\nThe next step is to define the user module. Place this\
    \ code in a file called **User.js** in a directory called **models**:\n\n```\n\
    chapter01/authentication/models/User.js (excerpt)\n\nvar db = require('../lib/db');\n\
    \nvar UserSchema = new db.Schema({\n    username : {type: String, unique: true}\n\
    \    , password : String\n})\n\nvar MyUser = db.mongoose.model('User', UserSchema);\n\
    \n// Exports\nmodule.exports.addUser = addUser;\n\n// Add user to database\nfunction\
    \ addUser(username, password, callback) {\n    var instance = new MyUser();\n\
    \    instance.username = username;\n    instance.password = password;\n    instance.save(function\
    \ (err) {\n        if (err) {\n            callback(err);\n        }\n       \
    \ else {\n            callback(null, instance);\n        }\n    });\n}\n```\n\n\
    We begin by importing our previously defined database module and defining a simple\
    \ schema. We can then instantiate a new user, set the username and password, and\
    \ save to the database using the **save** function. If there's an error, we send\
    \ it to the callback function. Otherwise, we send back the actual user object."
