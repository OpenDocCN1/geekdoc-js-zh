    网站：www.sitepoint.com\n电子邮件：business@sitepoint.com\n\nISBN 978-0-9873321-0-3（印刷版）\n\
    ISBN 978-0-9873321-1-0（电子版）\n印刷和装订于美国\n\n## 关于作者\n\nDon 以强类型、面向对象的语言（如 Java 和\
    \ C++）开始他的编程生涯。他利用自己的工程培训构建了旨在具有可扩展性和容错性的实时交易系统。\n\n虽然他第一次接触函数式编程对系统来说有些冲击，但像\
    \ Python 和 Ruby 这样的弱类型动态语言的优雅和美感脱颖而出。Don 曾在多种 Web 环境中编程，包括 ASP、PHP 和 Python，但他觉得\
    \ Node.js 在处理实时 Web 的现代需求方面是首要的。\n\n## 关于专家评审\n\nGiovanni Ferron 是一位现居澳大利亚墨尔本的\
    \ Web 开发者。他曾为 MTV 和 DMG Radio Australia 等大型媒体公司工作，并与他人共同创立了 Stereomood.com 网站。¹\
    \ 几年前，他爱上了 Node.js，从此每晚都在 JavaScript 中编程。\n\n## 关于 SitePoint\n\nSitePoint 专注于为\
    \ Web 专业人士发布有趣、实用且易于理解的内容。访问 http://www.sitepoint.com/ 以访问我们的博客、书籍、通讯、文章和社区论坛。\n\
    \n*本书献给我的爸爸妈妈。*\n\n*给我的爸爸，感谢他无尽的耐心开车送我去划船、武术和网球训练，以及他永不停歇的支持。*\n\n*给我的妈妈，感谢她一只手做晚饭，另一只手勾勒出面向对象编程和数据库规范化的基本原理。*\n\
    \n## 目录\n\n- **前言** xii\n  - 谁应该读这本书 xii\n  - 这本书包含什么 xii\n  - 在哪里寻求帮助 xiii\n\
    \    - SitePoint 论坛 xiii\n    - 本书网站 xiv\n  - SitePoint 通讯 xiv\n  - 你的反馈 xiv\n\
    \  - SitePoint 之友 xv\n  - 在线测验 xv\n  - 致谢 xv\n  - 本书使用的约定 xvi\n    - 代码示例 xvi\n\
    \    - 提示、说明和警告 xvii\n- **第 1 章 来到你身边的服务器** 1\n  - 为什么选择 Node.js？ 1\n    - 优势与劣势\
    \ 4\n  - 从头开始 5\n    - 安装 5\n    - 组装各部分 7\n    - 基本表单 9\n    - 数据库 12\n  - 总结\
    \ 16\n- **第 2 章 让我们变得函数化**\n  - 简介\n  - 始终测试\n- 构建交易所\n  - 引擎的核心\n- 问题的关键\n  -\
    \ 逻辑核心\n  - 再来点行动\n  - 真正的交易呢？\n- 总结\n- **第 3 章 持久化有回报**\n  - 为什么选择 MongoDB？\n\
    \  - 安装\n  - 选择驱动程序\n  - 快速测试\n  - 创建包装器\n  - 查找数据\n  - 插入数据\n  - 存储数据\n  - 在\
    \ Express 之前\n  - 构建 API\n  - 绘制结果\n- 总结\n- **第 4 章 使用 Bootstrap 美化**\n  - 简介\n\
    \  - 注册，登录\n  - 新用户\n  - 只能有一个 72\n  - 身份验证 76\n  - 基本投资组合 78\n  - Bootstrap 小部件\
    \ 84\n  - 密码保护 89\n  - 总结 90\n- **第 5 章 实时 Web** 91\n  - 让我们聊天吧 92\n  - 聊天选项卡\
    \ 将 Express 与 Socket.IO 连接 93\n  - 客户端聊天代码 98\n  - 谁加入了？ 98\n  - 让他们说话 101\n \
    \ - 谁在线？ 102\n  - 实时交易 105\n  - 客户端上的交易 108\n  - 告别表单 109\n  - 总结 113\n- **第 6\
    \ 章 Backbone** 115\n  - 模型、视图、控制器和 Backbone.js 116\n  - 抢先看 116\n  - 客户端过滤 117\n\
    \  - Backbone 模型 119\n  - 从模型到视图 121\n  - 客户端过滤器 123\n  - 实时交易 125\n  - 加载交易数据\
    \ 129\n  - 你自己的市场 133\n  - 总结 136\n- **第 7 章 生产环境**\n  - 开发与生产 137\n  - 404 未找到\
    \ 139\n  - 托管选项 140\n  - 永久运行 141\n  - 总结 150\n  - 进一步资源 150\n- **索引**\n  - 索引\
    \ 151\n\n# 前言\n\n我尝试学习 Node.js 时遇到的困难之一是不知从何入手。我找到的参考资料要么涉及诸如数据报和事件发射器之类的准学术主题，要么狭隘地专注于某个主题而忽视大局。本书将带你完成在\
    \ Node.js 中构建应用程序的全过程。它从经典的“Hello World”示例开始，进而构建一个能够向数千个连接的客户端发送交易信息的实时 Web 应用程序。\n\
    \n是什么让 Node.js 与众不同？首先，它在后端和前端之间提供了统一的语言。这意味着你所有的思考都可以用一种语言进行，在从后端切换到前端时没有认知负担。此外，它还允许共享代码库和模板。这开辟了许多有趣的可能性，其表面才刚刚开始被充分探索。\n\
    \n其次，它很快。像 PHP、Python 和 Ruby 这样的解释型语言的一个常见抱怨是速度。Joyent 的首席技术官 Jason Hoffman 讨论了\
    \ Node.js 如何达到其性能可以压垮操作系统的程度。一个核心、不到 1GB 内存就能处理 10GB 的流量和一百万个连接端点。将 24 个这样的核心组合到一台机器中，产生的整体吞吐量超过了操作系统和\
    \ TCP/IP 协议栈的能力。换句话说，对于一个设计良好的应用程序来说，瓶颈不是 Node.js——而是你的操作系统。\n\n第三，它的非阻塞架构专为实时\
    \ Web 而生。选择 JavaScript 作为语言是因为它基于非阻塞回调，并且具有非常小的核心 API。这意味着可以围绕非阻塞包构建整个 Node.js\
    \ 生态系统，目前其数量已超过一万。最终结果是一个平台和生态系统，在架构上完美契合现代实时 Web 的需求。\n\n我相信到现在为止，你已经对 Node.js\
    \ 能为你的实时应用程序带来的可能性感到兴奋。在本书结束时，我确信你将具备开始剖析和解决除最深奥问题之外所有问题的技能。在软件领域，没有比解决一个复杂的任务并在结束时想到“这就是我需要做的一切！”更大的乐趣了。这是我多次经历过的\n"
