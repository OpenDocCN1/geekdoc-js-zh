    \ + \"\\n\";\n    }\n    return stringBook;\n}\n```\n\nIt is primarily an exercise\
    \ in manipulating text on the screen with no interesting aspects to comment upon.\
    \ Now within the **lib** directory, create **nocklib.js**:\n\n```\nchapter02/lib/nocklib.js\
    \ (excerpt)\n\n'use strict';\n\nvar exchange = require('./exchange')\n  , priceFloor\
    \ = 35\n  , priceRange = 10\n  , volFloor = 80\n  , volRange = 40;\n\nmodule.exports\
    \ = {\n  generateRandomOrder: function(exchangeData) {\n    var order = {};\n\
    \    if (Math.random() > 0.5) order.type = exchange.BUY\n    else order.type =\
    \ exchange.SELL\n\n    var buyExists = exchangeData.buys\n    && exchangeData.buys.prices.peek();\n\
    var sellExists = exchangeData.sells\n                && exchangeData.sells.prices.peek();\n\
    var ran = Math.random();\n\nif (!buyExists && !sellExists)\n    order.price =\
