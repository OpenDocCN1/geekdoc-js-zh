    Run the authentication server using `node auth 8090` within the **dnode** folder,
    which starts the server and has it listen on port 8090. Then start the web server
    using `node web 3000`, and go to `http://localhost:3000/login?user=foo&pass=bar`
    in your browser. You should see the screen shown in Figure 3.1.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_0.png)


    Figure 3.1. Consider yourself AUTHORIZED!


    If you try to change the username or password in the address bar, you should see
    what’s depicted in Figure 3.2.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_73_1.png)


    Figure 3.2. When the user is unauthorized


    In this case, we just happened to run the authentication server and web server
    on the same machine; however, the same code can be used for running a local web
    server with an authentication server on the other side of the world. The only
    change would be to specify the IP address of the remote server instead of using
    localhost. Now that we’ve built a basic web server using the native http module,
    it’s time to build the rest of our application using Express.js.


    # Building an API


    With some trades in our database, we will build a small API to retrieve the data.
    To be more specific, we’ll build a **REST API**. REST stands for REpresentational
    State Transfer, which is the architecture behind the Web. Rather than discussing
    the technical details, it would be more illustrative to explain how the data moves
    from the database to the browser.'
- md: "## Jump Start Node.js\n\nTo begin with, the user makes a request to our Express\
    \ server. From here within Express.js, we use the MongoDB native driver to make\
    \ an asynchronous call to the database. Once the data is returned, we can manipulate\
    \ it as desired to shift from the raw form to one that will be consumed by our\
    \ API clients. Finally, we send the data back to the browser in JSON. Once the\
    \ data returns to the browser, there are many applications and frameworks that\
    \ can render the data in a way that's presentable to the user. We'll explore a\
    \ way of doing this later in this chapter.\n\nThe first step is building the Express\
    \ application. In Chapter 1, we did this using the command line. This added several\
    \ lines of code, not all of which were explained or used. In this chapter, we'll\
    \ construct the application line by line to give you a deeper sense of what we're\
    \ doing and why. First, in **nockmarket.js**, import the express module as follows:\n\
    \n```\nchapter03/nockmarket.js (excerpt)\n\n, express = require('express')\n```\n\
    \nThen add the following just before db.open:\n\n```\nchapter03/nockmarket.js\
    \ (excerpt)\n\nvar app = express.createServer();\napp.get('/', function(req, res)\
    \ {\n  res.send('Hello world');\n});\n```\n\nHere we create the application and\
    \ send the canonical “Hello world” whenever a user tries to access the base URL.\n\
    \nAfter that, modify the db.open function as follows:\n\n```\nchapter03/nockmarket.js\
    \ (excerpt)\n\ndb.open(function() {\n  submitRandomOrder(); ❶\n  app.listen(3000);\
    \ ❷\n});\n```\n\nWe only start listening for requests after we're sure the database\
    \ is open. Now when you run node nockmarket with the MongoDB daemon running, two\
    \ things should happen:\n\n1. As in Chapter 2, the program should generate and\
    \ print random orders and the result. This time, the orders will also be stored\
    \ in the database.\n2. A web server should start up, listening on port 3000. When\
    \ you open in your browser http://localhost:3000, you should receive the “Hello\
    \ world” greeting.\n\nThe second item is of limited interest in and of itself;\
    \ however, we are about to make it more interesting by adding a new route, /api/trades,\
    \ which will retrieve recent trades from the database. Enter this into nockmarket.js,\
    \ just before db.open:\n\n```\napp.get('/api/trades', function(req, res) {\n \
    \ db.find('transactions'\n    , {init: {$exists: true}}\n    , 100, function(err,\
    \ trades) {\n    if (err) {\n      console.error(err);\n      return;\n    }\n\
    \    var json = [];\n    var lastTime = 0;\n    // Highstock expects an array\
    \ of arrays. Each\n    // subarray of form [time, price]\n    trades.reverse().forEach(function(trade)\
    \ {\n      var date = new Date(parseInt(trade._id\n        .toString()\n     \
    \   .substring(0,8), 16)*1000);\n      var dataPoint = [date.getTime(), trade.price];\n\
    \      if (date - lastTime > 1000)\n        json.push(dataPoint);\n      lastTime\
    \ = date;\n    });\n\n    res.json(json);\n  });\n});\n```\n\nLet's step through\
    \ it. The first line defines the route:\n\n```\napp.get('/api/trades', function(req,\
    \ res) {\n```\n\nThe next line defines the query that we perform on the database:\n\
    \n```\ndb.find('transactions'\n      , {init: {$exists: true}}\n      , 100, function(err,\
    \ trades) {\n```\n\nConveniently, MongoDB queries are in JSON format, so no new\
    \ syntax has to be learned. The main concepts to learn are the MongoDB operations.\
    \ Here, we're searching for documents where the `init` field exists. You'll recall\
    \ that only trades have the `init` field. We limit the number of results to 100.\
    \ For those familiar with SQL, there is an SQL-to-Mongo mapping chart available.\n\
    \n## Indexing\n\nThe query that we've presented will appear to run very quickly\
    \ because of the data set's small size. In a production system, it would be essential\
    \ to index certain fields to optimize search efficiency.\nAn everyday example\
    \ of indexes is the Yellow Pages. If you look up a particular name, the alphabetical\
    \ index enables a reasonably efficient search to find the desired entry rather\
    \ than sequentially scanning from first page to last.\nYou only need to create\
    \ an index once, and this can be done from a MongoDB shell completely outside\
    \ of any Node.js environment. Indexing is a detailed topic, so for further information,\
    \ a good source is the official documentation.\n\nThe database extraction is now\
    \ done. The rest of the function manipulates the returned array so that it's presented\
    \ in the desired format for the charting application we're about to introduce.\
    \ First, we reverse the array so that the timestamps appear in chronological order\
    \ using `trades.reverse()`.\n\nWe use `forEach` to iterate over each element of\
    \ the array. The graphical package that we'll be using expects data of the form\
    \ `[time, price]`. We must first extract the time, which is conveniently embedded\
    \ within `_id`. (Each MongoDB `_id` comes with an built-in timestamp.) We use\
    \ a combination of `.substring` and `parseInt` to generate a JavaScript Date object.\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_0.png)\n\n# Embedded Timestamps\n\
    \nThe Object ID specification states that the first four bytes of an Object ID\
    \ contain the timestamp.<sup>10</sup> To break down how this works, type `node`\
    \ into your console and then the following:\n\n```\nvar idString = '5015bd4d9d14890200000007';\n\
    ```\n\nThis will store an ID in string format. You can copy the above verbatim\
    \ or else use an ID directly from your own database. Then we extract the first\
    \ four bytes:\n\n```\nvar timestamp = idString.substring(0, 8);\n```\n\nLastly,\
    \ we parse the integer:\n\n```\nnew Date(parseInt(timestamp, 16)*1000);\n```\n\
    \n16 indicates that we're converting from hexadecimal, and we multiply by 1,000\
    \ to do a millisecond conversion. Your console should display similar to this:\n\
    \n```\nMon Jul 30 2012 08:46:37 GMT+1000 (EST)\n```\n\nWe check to make sure that\
    \ trades don't occur simultaneously. In the real world, multiple trades can happen\
    \ at exactly the same instance at multiple price steps. In practice, this causes\
    \ chart rendering issues. For simplicity, we will ensure a single trade for each\
    \ timestamp.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_1.png)\n\n# Mind the\
    \ Gap\n\nThe checking of simultaneous trades is purely a client-side check that\
    \ we perform at the very last step. It doesn't affect the underlying data and\
    \ so any portfolio calculations will be based on the correct data. We use this\
    \ small workaround because the charting software fails to render simultaneous\
    \ trades very well out of the box. Feel free to play around with the settings\
    \ to see if you can come up with a better solution.\n\nLast of all, we call res.json\
    \ to stream the data to the client. If you now visit http://localhost:3000/api/trades,\
    \ you should see output similar to the following:\n\n```\n[[1341838075000, 58],\
    \ [1341838078000, 58], [1341838080000, 57],\n...[1341838240000, 57], [1341838243000,\
    \ 59]]\n```\n\nCongratulations! You have now learned how to insert arbitrary documents\
    \ into MongoDB, extract them using a simple query, and create a basic REST API\
    \ to transform the data and present it back in JSON format—what Facebook and Twitter\
    \ use to present data. For an example, visit https://graph.facebook.com/19292868552\
    \ and you should see what’s in Figure 3.3.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_78_0.png)\n\
    \nIf your application goes viral and you need to provide an API for other clients\
    \ to access your data, you now understand the basics.\n\n## Charting the Result\n\
    \nWe've now finished learning about MongoDB, but it's unsatisfying to only see\
    \ the data in raw JSON format. There are many ways to present the results of JSON,\
    \ and here we'll explore Highstock, a library built on jQuery and available at\
    \ Highcharts.<sup>11</sup> Place the following just below the definition of app.\
    \ It will be necessary to overwrite the previous “Hello world” code for the /\
    \ route.\n\n```\nchapter03/nockmarket.js (excerpt)\n\nvar app = express.createServer();\n\
    app.configure(function () {\n  app.set('views', __dirname + '/views');\n  app.set('view\
    \ engine', 'ejs');\n  app.use(express.static(__dirname + '/public'));\n});\napp.set('view\
    \ options', {\n  layout: false\n});\napp.get('/', function(req, res) {\n  res.render('chart');\n\
    });\n```\n\nIn the configure function, we first define the template directory\
    \ and then EJS (Embedded JavaScript) as the templating engine. By specifying layout:\
    \ false, we indicate that no default layout is being used as a template. `express.static`\
    \ is used to indicate the directory where we'll store static files such as stylesheets\
    \ and images. Lastly, we modify the / route to display our chart template.\n\n\
    Paste the code from https://gist.github.com/3949958 into /views/chart.ejs.\n\n\
    Just about all the code is specifically related to the Highstock package, so I'll\
    \ skip discussing it. It is primarily Highstock-specific configuration.\n\nThe\
    \ final result should look like Figure 3.4 when you visit http://localhost:3000.\n\
    \n<sup>10</sup> http://www.mongodb.org/display/DOCS/Object+IDs\n<sup>11</sup>"
  mdcn: "\n## 快速启动 Node.js\n\n首先，用户向我们的 Express 服务器发送请求。在 Express.js 内部，我们使用 MongoDB\
    \ 原生驱动程序对数据库进行异步调用。一旦数据返回，我们就可以根据需要进行操作，将原始形式的数据转换为可供我们 API 客户端使用的形式。最后，我们以 JSON\
    \ 格式将数据发送回浏览器。当数据返回到浏览器后，有许多应用程序和框架可以以一种适合用户查看的方式呈现数据。我们将在本章后面探讨一种实现方式。\n\n第一步是构建\
    \ Express 应用程序。在第一章中，我们使用命令行完成了这项工作。这添加了几行代码，但并非所有代码都得到了解释或使用。在本章中，我们将逐行构建应用程序，以便让您更深入地了解我们正在做什么以及为什么这样做。首先，在\
    \ **nockmarket.js** 中，按如下方式导入 express 模块：\n\n```\nchapter03/nockmarket.js (excerpt)\n\
    \n, express = require('express')\n```\n\n然后在 `db.open` 之前添加以下代码：\n\n```\nchapter03/nockmarket.js\
    \ (excerpt)\n\nvar app = express.createServer();\napp.get('/', function(req, res)\
    \ {\n  res.send('Hello world');\n});\n```\n\n这里我们创建了一个应用程序，每当用户尝试访问根 URL 时，就会发送经典的\
    \ \"Hello world\"。\n\n之后，修改 `db.open` 函数如下：\n\n```\nchapter03/nockmarket.js (excerpt)\n\
    \ndb.open(function() {\n  submitRandomOrder(); ❶\n  app.listen(3000); ❷\n});\n\
    ```\n\n我们只在确保数据库打开后才开始监听请求。现在，当您在 MongoDB 守护进程运行的情况下执行 `node nockmarket` 时，应该会发生两件事：\n\
    \n1.  与第二章一样，程序应该会生成并打印随机订单及其结果。这一次，订单也会存储在数据库中。\n2.  应该会启动一个 Web 服务器，监听 3000\
    \ 端口。当您在浏览器中打开 http://localhost:3000 时，您应该会收到 \"Hello world\" 的问候语。\n\n第二点本身趣味有限；然而，我们即将通过添加一个新路由\
    \ `/api/trades` 来使其更有趣，该路由将从数据库中检索最近的交易记录。将此代码输入到 `nockmarket.js` 中，就在 `db.open`\
    \ 之前：\n\n```\napp.get('/api/trades', function(req, res) {\n  db.find('transactions'\n\
    \    , {init: {$exists: true}}\n    , 100, function(err, trades) {\n    if (err)\
    \ {\n      console.error(err);\n      return;\n    }\n    var json = [];\n   \
    \ var lastTime = 0;\n    // Highstock 期望一个数组的数组。每个\n    // 子数组的形式为 [time, price]\n\
    \    trades.reverse().forEach(function(trade) {\n      var date = new Date(parseInt(trade._id\n\
    \        .toString()\n        .substring(0,8), 16)*1000);\n      var dataPoint\
    \ = [date.getTime(), trade.price];\n      if (date - lastTime > 1000)\n      \
    \  json.push(dataPoint);\n      lastTime = date;\n    });\n\n    res.json(json);\n\
    \  });\n});\n```\n\n我们来逐步分析它。第一行定义了路由：\n\n```\napp.get('/api/trades', function(req,\
    \ res) {\n```\n\n下一行定义了我们对数据库执行的查询：\n\n```\ndb.find('transactions'\n      , {init:\
    \ {$exists: true}}\n      , 100, function(err, trades) {\n```\n\n方便的是，MongoDB\
    \ 查询采用 JSON 格式，因此无需学习新的语法。需要学习的主要概念是 MongoDB 操作。在这里，我们搜索存在 `init` 字段的文档。您会回想起只有交易记录才具有\
    \ `init` 字段。我们将结果数量限制为 100 条。对于熟悉 SQL 的人，有一个 SQL 到 MongoDB 的映射图表可供参考。\n\n## 索引\n\
    \n我们上面展示的查询由于数据集规模较小，运行速度看起来会非常快。在生产系统中，对某些字段建立索引以优化搜索效率是至关重要的。\n一个日常的索引例子是电话簿（黄页）。如果您查找一个特定的名字，字母顺序索引可以实现相当高效的搜索，以找到所需的条目，而不是从第一页到最后一页顺序扫描。\n\
    您只需要创建一次索引，这可以在 MongoDB shell 中完成，完全独立于任何 Node.js 环境。索引是一个详细的主题，因此要获取更多信息，一个好的资源是官方文档。\n\
    \n数据库提取现在完成了。函数的其余部分操作返回的数组，以便为我们即将介绍的图表应用程序以所需的格式呈现它。首先，我们使用 `trades.reverse()`\
    \ 反转数组，使时间戳按时间顺序排列。\n\n我们使用 `forEach` 来遍历数组的每个元素。我们将使用的图形包期望数据格式为 `[time, price]`。我们必须首先提取时间，时间方便地嵌入在\
    \ `_id` 中。（每个 MongoDB `_id` 都带有一个内置的时间戳。）我们组合使用 `.substring` 和 `parseInt` 来生成一个\
    \ JavaScript Date 对象。\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_0.png)\n\n\
    # 嵌入式时间戳\n\nObject ID 规范规定 Object ID 的前四个字节包含时间戳。<sup>10</sup> 要分解这是如何工作的，请在控制台中输入\
    \ `node`，然后输入以下内容：\n\n```\nvar idString = '5015bd4d9d14890200000007';\n```\n\n\
    这将以字符串格式存储一个 ID。您可以逐字复制上面的内容，也可以直接使用自己数据库中的 ID。然后我们提取前四个字节：\n\n```\nvar timestamp\
    \ = idString.substring(0, 8);\n```\n\n最后，我们解析整数：\n\n```\nnew Date(parseInt(timestamp,\
    \ 16)*1000);\n```\n\n16 表示我们正在从十六进制转换，并且我们乘以 1000 来进行毫秒转换。您的控制台应显示类似以下内容：\n\n\
    ```\nMon Jul 30 2012 08:46:37 GMT+1000 (EST)\n```\n\n我们检查以确保交易不会同时发生。在现实世界中，多个交易可以在完全相同的时刻以多个价格水平发生。在实践中，这会导致图表渲染问题。为简单起见，我们将确保每个时间戳只有一个交易。\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_1.png)\n\n# 注意间隔\n\n同时交易的检查纯粹是我们在最后一步执行的客户端检查。它不会影响底层数据，因此任何投资组合计算都将基于正确的数据。我们使用这个小技巧是因为图表软件默认情况下无法很好地渲染同时发生的交易。您可以随意调整设置，看看是否能找到更好的解决方案。\n\
    \n最后，我们调用 `res.json` 将数据流式传输到客户端。如果您现在访问 http://localhost:3000/api/trades，您应该会看到类似以下内容的输出：\n\
    \n```\n[[1341838075000, 58], [1341838078000, 58], [1341838080000, 57],\n...[1341838240000,\
    \ 57], [1341838243000, 59]]\n```\n\n恭喜！您现在已经学会了如何将任意文档插入 MongoDB、使用简单查询提取它们，以及创建一个基本的\
    \ REST API 来转换数据并以 JSON 格式将其呈现回去——Facebook 和 Twitter 就使用 JSON 来呈现数据。要查看示例，请访问\
    \ https://graph.facebook.com/19292868552 ，您应该会看到图 3.3 中的内容。\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_78_0.png)\n\
    \n如果您的应用程序变得非常受欢迎，您需要为其他客户端提供 API 来访问您的数据，那么您现在就理解了基础知识。\n\n## 图表展示结果\n\n我们现在已经完成了对\
    \ MongoDB 的学习，但只看到原始 JSON 格式的数据是令人不满意的。展示 JSON 结果有很多种方式，这里我们将探讨 Highstock，一个构建在\
    \ jQuery 上并可在 Highcharts 上获取的库。<sup>11</sup> 将以下代码放在 `app` 定义下方。需要覆盖之前的 \"Hello\
    \ world\" 代码以应用于 `/` 路由。\n\n```\nchapter03/nockmarket.js (excerpt)\n\nvar app\
    \ = express.createServer();\napp.configure(function () {\n  app.set('views', __dirname\
    \ + '/views');\n  app.set('view engine', 'ejs');\n  app.use(express.static(__dirname\
    \ + '/public'));\n});\napp.set('view options', {\n  layout: false\n});\napp.get('/',\
    \ function(req, res) {\n  res.render('chart');\n});\n```\n\n在 `configure` 函数中，我们首先定义模板目录，然后将\
    \ EJS（嵌入式 JavaScript）指定为模板引擎。通过指定 `layout: false`，我们表示不使用默认布局作为模板。`express.static`\
    \ 用于指示我们将存储静态文件（如样式表和图像）的目录。最后，我们修改 `/` 路由以显示我们的图表模板。\n\n将 https://gist.github.com/3949958\
    \ 中的代码粘贴到 `/views/chart.ejs`。\n\n几乎所有的代码都专门与 Highstock 包相关，因此我将跳过讨论它。它主要是 Highstock\
    \ 特定的配置。\n\n当您访问 http://localhost:3000 时，最终结果应如图 3.4 所示。\n\n<sup>10</sup> http://www.mongodb.org/display/DOCS/Object+IDs\n\
    <sup>11</sup>\n"
