  md: "The Socket.IO authorization mechanism comes with handshake data, which in turn\
    \ comes with header data.³ The header data will contain embedded cookie information,\
    \ and it is here that we will find the encrypted session ID. This line will produce\
    \ raw data similar to:\n\n```\nconnect.sid=CGHs801f32T7Vc4VqSKszgjH.TryCeIqQjAGH6DvvjX6PweNK\
    \ ...\n```\n\nWe extract the session ID and then retrieve from our session store\
    \ the actual session corresponding to the specified ID.\n\nWe return the session—if\
    \ we find it—to indicate successful authorization.\n\nIf not, we return `false`.\n\
    \nLastly, we handle the case where no cookie is found.\n\nThe configuration function\
