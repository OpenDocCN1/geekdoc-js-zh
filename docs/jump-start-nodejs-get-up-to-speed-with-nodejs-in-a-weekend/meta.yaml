  - '[PAGE 77]


    the time, which is conveniently embedded within `_id`. (Each MongoDB `_id` comes
    with an built-in timestamp.) We use a combination of `.substring` and `parseInt`
    to generate a JavaScript Date object.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_0.png)


    # Embedded Timestamps


    The Object ID specification states that the first four bytes of an Object ID contain
    the timestamp.<sup>10</sup> To break down how this works, type `node` into your
    console and then the following:


    ```

    var idString = ''5015bd4d9d14890200000007'';

    ```


    This will store an ID in string format. You can copy the above verbatim or else
    use an ID directly from your own database. Then we extract the first four bytes:


    ```

    var timestamp = idString.substring(0, 8);

    ```


    Lastly, we parse the integer:


    ```

    new Date(parseInt(timestamp, 16)*1000);

    ```


    16 indicates that we''re converting from hexadecimal, and we multiply by 1,000
    to do a millisecond conversion. Your console should display similar to this:


    ```

    Mon Jul 30 2012 08:46:37 GMT+1000 (EST)

    ```


    We check to make sure that trades don''t occur simultaneously. In the real world,
    multiple trades can happen at exactly the same instance at multiple price steps.
    In practice, this causes chart rendering issues. For simplicity, we will ensure
    a single trade for each timestamp.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_77_1.png)


    # Mind the Gap


    The checking of simultaneous trades is purely a client-side check that we perform
    at the very last step. It doesn''t affect the underlying data and so any portfolio
    calculations will be based on the correct data. We use this small workaround be-


    10 http://www.mongodb.org/display/DOCS/Object+IDs'
