    # Who Should Read This Book


    This book is aimed at two target audiences. You might be a front-end engineer
    who is interested in looking at server-side development. An existing knowledge
    of JavaScript will prove useful, even if you are unfamiliar with certain server-side
    engineering techniques. Rest assured that by the end of the book, the topic will
    be covered in sufficient detail for you to know how to apply your front-end skills
    to back-end problems.


    The second potential reader is the server-side engineer who uses another language
    such as PHP, Python, Ruby, Java, or .NET. The main benefit you’ll derive is seeing
    how your existing architectural, design, and pattern knowledge is applied to the
    world of Node.js. You may have little to no knowledge of JavaScript, but this
    should pose no big hindrance. By design, it’s an easy language to learn, and we
    will have covered many examples of both its syntax and idiosyncratic features
    by the end of the book.


    # What’s in This Book


    This book comprises the following seven chapters.


    +   Chapter 1: *Coming to a Server Near You*

    Node.js is introduced and its features and benefits explained. We then build a
    simple application to introduce Node.js. The application sends data from a form
    to MongoDB, a NoSQL database.


    Chapter 2: *Let’s Get Functional*

    This chapter introduces programming with Node.js in a functional style. We’ll
    build a stock exchange trading engine that’s capable of accepting orders and matching
    trades.


    Chapter 3: *Persistence Pays*

    Here we explore MongoDB. I’ll explain the use cases of MongoDB and how it compares
    to traditional SQL databases. We’ll then look at the MongoDB query language and
    show how it can be integrated with your Node.js projects.'
