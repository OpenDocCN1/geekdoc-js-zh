  md: '# 2 Jump Start Node.js


    I share. Node.js is a joy to work with, and I intend to share that with you through
    the code we''ll write throughout this book.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_20_0.png)


    Node.js is a server-side JavaScript platform that consists of a deliberately minimalist
    core library alongside a rich ecosystem. It runs atop the V8 JavaScript engine,
    which makes it very fast thanks to the talented engineers at Google. JavaScript
    is popular on the client side, but it was chosen as the target language primarily
    for engineering considerations, the details of which will be discussed as the
    chapter unfolds.


    The home page of Node.js describes it thus:


    > “Node.js is a platform built on Chrome’s JavaScript runtime for easily building
    fast, scalable network applications. Node.js uses an event-driven, non-blocking
    I/O model that makes it lightweight and efficient, perfect for data-intensive
    real-time applications that run across distributed devices.”


    —http://nodejs.org/


    This may seem cryptic to newcomers, but it succinctly summarizes some of the key
    strengths of Node.js and is worth exploring in more detail. People are often taken
    aback when they hear that JavaScript is the targeted programming language. That’s
    because there’s a perception in the programming community that JavaScript is not
    a “real” language such as C, C++, or Java. Yet JavaScript did have its genesis
    as an interpreted language for the browser; the “Java” part of the name was actually
    chosen to capitalize upon the perceived popularity of the Java programming language
    at the time.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Since its humble beginnings, JavaScript has proliferated and is now supported
    in every major web browser, including those on mobile devices. Not only is it
    a popular language, but the tools and frameworks currently available for it make
    it qualify as a powerful engineering tool. JavaScript as a server-side platform
    supports continuous integration, continuous deployment, connections to relational
    databases, service-oriented architecture, and just about every other technique
    available to its more well-established brethren.


    In conjunction with Google''s V8 JavaScript engine, it is now extremely fast;
    in fact, it''s several times faster than other scripted languages such as Ruby
    and Python. Against Python3, JavaScript V8 Engine has a median benchmark 13 times
    as fast with a roughly similar code size.<sup>3</sup> Against Ruby 1.9, the median
    benchmark is eight times as fast.<sup>4</sup> These are incredible benchmarks
    for a dynamic language, and are due in no small part to V8 optimizations such
    as compilation into machine code pre-execution.


    > On Benchmarking


    Benchmarking is an intricate topic,<sup>5</sup> and the numbers above should be
    taken with the proverbial grain of salt. Whenever any discussion of benchmarking
    arises, it is generally qualified with “it depends.” The main purpose of discussing
    the benchmark was to dispel any misconception of JavaScript being inherently slow.


    The official description talks about the event-driven, non-blocking I/O model.
    Traditionally, programming is done in a synchronous manner: a line of code is
    executed, the system waits for the result, the result is processed, and then execution
    resumes. Sometimes waiting for the result can take a long time; for example, reading
    from a database or writing to a network.


    In languages such as Java and C#, one solution is to spawn a new **thread**. A
    thread may be thought of as a lightweight process that performs tasks. Threaded
    programming can be difficult because multiple threads can be trying to access
    the same resource concurrently. Without dissecting the intricacies of multi-threaded
    programming, you can imagine it would be disastrous for one thread to be incrementing
    a counter while another thread is decrementing the counter at the same time.


    <sup>3</sup> http://shootout.alioth.debian.org/u32/benchmark.php?test=all&lang=v8&lang2=python3


    <sup>4</sup> http://shootout.alioth.debian.org/u32/benchmark.php?test=all&lang=v8&lang2=yarv


    <sup>5</sup> http://shootout.alioth.debian.org/dont-jump-to-conclusions.php'
  merge: -1
