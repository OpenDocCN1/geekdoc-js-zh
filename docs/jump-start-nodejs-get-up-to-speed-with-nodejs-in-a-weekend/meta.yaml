    2.  如果匹配，我们返回用户 ID。\n3.  否则，我们返回 `null`。\n\n我们返回 ID 而不是简单的 `true` 的原因是，用户 ID 是一个我们后续会反复使用的便捷字段。通过在身份验证函数中返回它，我们可以省去后续代码中额外的一次数据库调用。\n\
    \n最后一步是在 **nockmarket.js** 中将我们的库函数连接到一个路由：\n\n```javascript\napp.get('/api/user/:username',\
