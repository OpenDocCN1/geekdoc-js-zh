    - using Socket.IO as a replacement for forms and AJAX\n\n# Chapter 6\n\n## Backbone\n\
    \n> “Chaos was the law of nature; order was the dream of man.”\n> —Henry B. Adams\n\
    \nSoftware engineering is about managing complexity; it's a theme to which we\
    \ keep returning, but it cannot be emphasized enough. So far we have looked at\
    \ a number of ways to manage complexity on the server side; however, we've yet\
    \ to discuss complexity management on the client side. To date, we have been managing\
    \ client-side code by annotating HTML tags and then manipulating them through\
    \ jQuery. While this works for smaller projects, the ability to manage complexity\
    \ rapidly breaks down as the size of the code base increases.\n\nThere are many\
    \ client-side frameworks built for managing this type of problem. In this chapter,\
    \ we'll look at one of the more popular ones, Backbone.js.¹ Backbone loosely follows\
    \ the **MVC** model in which an application is split into models, views, and controllers.\
    \ We'll look at how Backbone can be combined with Node.js to present a real-time\
    \ graphical user interface to the end user showing orders and trades. While the\
    \ initial learning curve is a little steep, the end result is an elegant solution\
    \ to managing client-side code that will scale to a larger code base as needed.\n\
    \n¹ http://backbonejs.org/\n\n## Models, Views, Controllers, and Backbone.js\n\
    \nA comprehensive treatment of MVC and Backbone is a book in and of itself. For\
    \ the uninitiated, there’s no need to fret; this chapter’s designed to be followed\
    \ by those new to both MVC and Backbone. However, for those who wish to explore\
    \ them in further detail, some recommended resources are listed here:\n\n**http://net.tutsplus.com/tutorials/other/mvc-for-noobs/**\n\
    A brief introduction to MVC, it is written with PHP as the target language. This\
    \ is advantageous insofar as the reader can concentrate purely on the architectural\
    \ aspects without becoming mired in language considerations.\n\n**http://backbonejs.org/#FAQ-mvc**\n\
    This snippet from the official Backbone documentation explains how traditional\
    \ MVC fits in with the Backbone approach.\n\n**https://github.com/addyosmani/backbone-fundamentals**\n\
    An open-source book dedicated to explaining Backbone in considerable detail.\n\
    \n**https://github.com/documentcloud/backbone/wiki/Tutorials%2C-blog-posts-and-example-sites**\n\
    A comprehensive repository of Backbone examples and tutorials.\n\n## Sneak Preview\n\
    \nThere are quite a few concepts to cover before we reach the big payoff. Let’s\
    \ build a quick mockup of the final product that we’re working towards, as it\
    \ will provide a handy roadmap to guide us. We’ll start with a simple Bootstrap\
    \ mockup.\n\nThe code is plain HTML and can be retrieved at https://gist.github.com/3949965.\
    \ Copy the code and paste it into **portfolio.ejs** as follows:\n\n```html\nchapter06/views/portfolio.ejs\
    \ (excerpt)\n\n<div class=\"tab-pane\" id=\"tab2\">\n  <!-- Paste code here -->\n\
    </div>\n```\n\nYour **Nockmarket** tab should now resemble Figure 6.1.\n\n## Welcome\
    \ to the Nockmarket\n\nHere you can manage your portfolio and view live prices.\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_135_0.png)\n\nFigure 6.1. **Nockmarket**\
    \ tab showing prices\n\n## Client Filtering\n\nWe will implement a filter that\
    \ allows the user to filter their portfolio based on the code of a particular\
    \ stock. There are several approaches to this, the least efficient being a traditional\
    \ form submission. This involves an entire page refresh including portions of\
    \ the page that we know will stay the same.\n\nA better approach is to use Ajax,\
    \ as it will only change that part of the page that involves new data. This will\
    \ be quicker than a full page refresh, but there is still a call to the server,\
    \ which may cause a sluggish experience depending on the connection between the\
    \ user and your site.\n\nIt's possible to construct an ad hoc approach to solving\
    \ the client-side problem by combining jQuery with HTML tag annotations. Backbone\
    \ is a lightweight framework that will enforce a consistent approach all the way\
    \ through. Using a framework like this is preferred because it will promote code\
    \ readability and maintainability.\n\nOur first task is to change the way that\
    \ the initial stock portfolio is transmitted from the server to the client. At\
    \ the moment, the user makes a request, the data is assembled on the server, and\
    \ it is then fed into a template and rendered to the user.\n\nThe Backbone approach\
    \ is as follows. As before, the user makes a request. Backbone then makes a request\
    \ to a server-side API. The data is placed into a model on the client side. Subsequent\
    \ changes are made to the model and bindings specify how these changes should\
    \ be reflected in the user interface. Let's proceed with a concrete example to\
    \ help illustrate the concept. Modify **portfolio.ejs** as follows:\n\n118 Jump\
    \ Start Node.js\n\n```html\nchapter06/views/portfolio.ejs (excerpt)\n\n<script\
    \ type=\"text/javascript\" src=\"http://twitter.github.com/bootstrap/assets/js/bootstrap-tab.js\"\
    ></script>\n<script src=\"http://documentcloud.github.com/underscore/underscore-min.js\"\
    ></script>\n<script src=\"http://backbonejs.org/backbone-min.js\"></script>\n\
    ```\n\nBackbone relies on another small library called Underscore.² Both should\
    \ be placed just before we begin our own JavaScript. Now modify **public/js/portfolio.js**\
    \ as follows:\n\n```javascript\nchapter06/public/js/portfolio.js (excerpt)\n\n\
    \        $('.stock-list').append('<tr><td>' + $('#stock').val()\n            +\
    \ '</td><td>' + price + '</td></tr>');\n        });\n    });\n\n    var PortfolioView\
    \ = Backbone.View.extend({\n        initialize: function() {\n            this.render();\n\
    \        },\n        render: function() {\n            $('.stock-list').html('<tr><td>1</td><td>2</td></tr>');\n\
    \        }\n    });\n    new PortfolioView();\n});\n```\n\nThis is one of the\
    \ simplest Backbone applications possible. There is one function, **initialize**,\
