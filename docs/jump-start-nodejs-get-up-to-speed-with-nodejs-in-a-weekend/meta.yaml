  - "[PAGE 167]\n\n```\nchapter07/public/js/chat.js (excerpt)\n\nvar socket = io.connect(window.location.hostname);\n\
    ```\n\nLastly, Heroku currently has no support for the WebSocket protocol. As\
    \ discussed, one of the drawbacks of using PaaS is the need to conform to the\
    \ rules and regulations that they apply. Modify **nocklib.js** to specify the\
    \ transport mechanism:\n\n```\nchapter07/lib/nocklib.js (excerpt)\n\nio.configure(function\
    \ (){\n    io.set(\"transports\", [\"xhr-polling\"]);\n    io.set(\"polling duration\"\
    , 10);\n    io.set('authorization', function (handshakeData, callback) {\n```\n\
    \nThen we deploy the following to Heroku:\n\n```\ngit add .\ngit commit -a -m\
    \ \"Ready for production\"\ngit push heroku master\n```\n\npush is a git command\
    \ that will transmit your local repository to a remote location. In this instance,\
    \ we are pushing our local repository out to Heroku, at which point it will be\
    \ automatically deployed. In fact, Heroku is open-source, so you're free to poke\
    \ around the source code yourself to see how its deployment scripts run.⁹\n\n\
    > ## Idle Time\n\nBehind the scenes, Heroku runs on EC2 infrastructure. This is\
    \ not a cheap option, and so free accounts are “spun down” after a period of inactivity.\
    \ The first user who connects after the idle period may need to wait a little\
    \ longer while your application spins up. In practice, it's a minor issue, since\
    \ the free accounts are geared more toward prototypes and testing rather than\
    \ full-blown production systems. Paid accounts are not limited by this restriction.\n\
    \nIf you receive an error message such as the following:\n\n```\n'heroku' does\
    \ not appear to be a git repository\n```"
  - '[PAGE 168]


    # 150 Jump Start Node.js


    ... you can add the remote repository with this command:


    ```

    git remote add heroku git@heroku.com: mysterious-brook-2122.git

    ```


    Replace *mysterious-brook-2122* with your application name as assigned by Heroku.


    You should now have a live system deployed on the Internet! Before we close the
    final curtain, let''s add a personal touch. At the moment, the address is unfriendly.
    Having a personalized address is as simple as:


    ```

    heroku rename YOURNAME

    ```


    Your website''s new address should appear in the console. Email your friends and
    family to let them see the wonderful piece of software that you''ve built. Perhaps
    they''ll be inspired to implement that startup idea they''ve always dreamed of
    doing!


    # Summary


    Congratulations, you''ve finally done it! In this chapter, we''ve learned the
    following:


    +   - different options for hosting and some of the pros and cons for each

    - using environment variables to control production settings

    - how to handle 404 errors

    - remote database access using the Node.js native MongoDB driver

    - deploying to Heroku and the changes required for a production environment


