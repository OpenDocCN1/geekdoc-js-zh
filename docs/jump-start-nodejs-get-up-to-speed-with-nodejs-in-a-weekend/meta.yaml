    \ In our example, this means any sell order of 99 units or fewer, as it will still\
    \ leave at least one unit remaining at $40:\n\n<sup>8</sup> https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/keys"
  mdcn: "\n## 28 快速入门 Node.js\n\n```javascript\nchapter02/lib/exchange.js (摘录)\n\n\
    function createExchange(exchangeData) {\n  var cloned = $.extend(true, {}, exchangeData);\n\
    \  cloned.trades = [];\n  init(cloned, BUY);\n  init(cloned, SELL);\n  return\
    \ cloned;\n\n  function init(exchange, orderType) {\n    if (!exchange[orderType])\
    \ {\n      exchange[orderType] = {};\n      exchange[orderType].volumes = {};\n\
    \      var options = {};\n      if (BUY == orderType) options.max = true;\n  \
    \    exchange[orderType].prices = createBinaryHeap(options);\n    }\n  }\n}\n\
    ```\n\n这需要进一步解释。为什么要大费周章地克隆数据？为什么不直接操作它，就像在面向对象编程中那样？在纯函数式编程中，函数没有副作用。这意味着，如果你向函数传递一个参数，你期望它原封不动地从函数中返回。\n\
    \n这很有道理。想象一下，你正在使用一个公共 API，你向它发送了一些数据，然后在响应中这些数据变得面目全非。这片数据实际上变得无法使用，因为不了解 API\
    \ 的内部工作原理，很难弄清楚哪里发生了变化。\n\n这就是为什么我们要克隆传入的交易所数据。如果有人希望随后在不同上下文中使用它，他们可以放心地这样做，知道他们的数据在传递过程中未被触动。虽然以下内容不适用于单线程的\
    \ JavaScript，但不可变数据也使得编写多线程应用程序更容易，因为数据可以被多个线程安全地使用，知道其值永远不会改变。\n\n## 变异的风险\n\n\
    Node.js 的原生 MongoDB 驱动程序（将在第 3 章讨论）会通过添加一个 `_id` 字段来修改插入的对象。大多数情况下这没问题；然而，在一些边缘情况下可能会出现问题。例如，如果你尝试两次插入同一个对象，你会收到一个错误。第一次插入会成功，但第二次会抱怨\
    \ ID 重复。\n\n如果你不了解驱动程序的内部工作原理，这可能会造成困惑。在纯函数式语言如 Haskell 中，这不是问题，因为你保证值永远不会改变。虽然有时以纯函数式风格编程不切实际，但我肯定鼓励尽可能地采用其原则。\n\
    \ncreateExchange 函数代码的第二个有趣特点是它包含另一个名为 `init` 的函数。JavaScript 允许在函数内部声明函数。在 `init`\
    \ 内部，我们执行一些基本的初始化：如果我们收到空的交易所数据，我们设置一个空对象来表示交易量，以及一个新的二叉堆来表示价格。如前所述，对于买单，我们使用最大二叉堆，因为交易发生在最高买入价。\n\
    \n## 问题的核心\n\n现在我们将构建交易所的核心。首先，我们将设置一些辅助函数：\n\n```javascript\nchapter02/lib/exchange.js\
    \ (摘录)\n\n        exchange[orderType].prices = createBinaryHeap(options);\n  \
    \  }\n}\nmodule.exports = {\n    BUY: BUY,\n    SELL: SELL,\n    buy:function\
    \ (price, volume, exchangeData) {\n        return order(BUY, price, volume, exchangeData);\n\
    \    },\n    sell:function (price, volume, exchangeData) {\n        return order(SELL,\
    \ price, volume, exchangeData);\n    },\n    order: order\n}\n```\n\n`module.exports`\
    \ 是 Node.js 中用于向其他模块暴露函数的语法。`BUY` 和 `SELL` 是字符串常量，而 `buy` 和 `sell` 是 `order` 函数的轻量级包装器。\n\
    \n> **保持 DRY（不要重复自己）**\n> 一个简单的实现是编写一个 `buy` 函数，然后将其复制粘贴到 `sell` 函数并更改必要的部分。你永远不应该这样做，因为它违反了**不要重复自己（DRY）**的原则。DRY\
    \ 是一种编程哲学，它指出任何知识点都应该只有一个单一的表示。简单地说，如果你发现自己从其他地方复制代码，你很可能违反了 DRY 原则。\n\n注意 `module.exports`\
    \ 只是一段 JSON。虽然 JSON 通常用于传输数据，在这个例子中，我们可以看到它也用于存储函数定义。这说明了函数式编程的另一个重要原则：函数是一等公民。任何你可以使用变量的地方，你都可以使用函数。如果你通过输入\
    \ `node` 来启动你的 REPL，你会发现这是完全合法的：\n\n```javascript\nvar sayHello = function() {console.log('Hi');};\n\
    sayHello();\n```\n\n## 逻辑核心\n\n现在我们来处理最复杂的部分：订单处理。让我们在 `exchange.js` 文件中添加以下内容：\n\
    \n```javascript\nchapter02/lib/exchange.js (摘录)\n\nfunction order(orderType, price,\
    \ volume, exchangeData) {\n  // 初始化\n  var cloned = createExchange(exchangeData);\
    \ // 1\n  var orderBook = cloned[orderType]; // 2\n  var oldVolume = orderBook.volumes[price];\
    \ // 3\n```\n\n1. 我们以一些初始化开始函数。首先，如“引擎的核心”一节所述，我们克隆了数据。\n2. 然后根据 `orderType` 获取买单或卖单的订单簿。\n\
    3. 最后，我们检索指定价格下的所有交易量。`price` 会被自动转换为字符串。\n因为 `orderBook` 是一个 JSON 对象，它可以执行近似常数时间的查找，速度会非常快。我们用\
    \ `oldVolume` 来存储处理订单前指定价格下可用的交易量。\n\n接下来，我们确定是否发生了交易：\n\n```javascript\nchapter02/lib/exchange.js\
    \ (摘录)\n\nfunction getOpposite() {\n  return (BUY == orderType) ? SELL : BUY;\n\
    }\nfunction isTrade() {\n  var opp = cloned[getOpposite()].prices.peek();\n  return\
    \ (BUY == orderType) ? price >= opp : price <= opp;\n}\nvar trade = isTrade();\n\
    ```\n\n首先，我们设置一个小的辅助函数 `getOpposite`。如果是买单，我们返回 `SELL`，反之亦然。\n\n> **闭包**\n> 注意\
    \ `getOpposite` 如何“知道” `orderType`，即使 `orderType` 是在这个函数外部定义的？这就是一种称为闭包的编程技术的例子。即使函数式编程不支持对象的概念，闭包允许我们表示状态。在我们的例子中，函数可以使用订单类型，即使它没有作为参数显式传入。\n\
    \n随后，`isTrade` 的逻辑很简单。首先，我们获取最高/最低价格。对于买单的情况，当价格大于或等于最小的卖单时，交易发生。例如，如果有一个新的买单价格为\
    \ 40 美元，如果存在任何 40 美元或更低的卖单，交易就会发生。对于卖单，当价格小于或等于最大的买单时，交易发生。例如，如果有一个新的卖单价格为 40\
    \ 美元，如果存在任何 40 美元或更高的买单，交易就会发生。我们使用添加的 `peek` 函数来根据我们处理的是买单还是卖单来确定最高或最低价格。\n\n\
    ## 28 快速入门 Node.js\n\n现在我们处理发生交易的情况：\n\n```javascript\nchapter02/lib/exchange.js\
    \ (摘录)\n\nvar remainingVolume = volume;\nvar storePrice = true;\n\nif (trade)\
    \ {\n  var oppBook = cloned[BUY]\n\n  if (orderType == BUY)\n    oppBook = cloned[SELL]\n\
    }\n```\n\n`remainingVolume` 存储交易后剩余的交易量。如果交易移除了订单簿的整个价位层级，就需要存储一个新的价格，这就是我们有 `storePrice`\
    \ 的原因。\n\n我们的第一步是在 `oppBook` 中存储与当前订单相反一侧的订单簿。这是因为买单与订单簿的卖方交互，反之亦然。然后我们有一个 `while`\
    \ 循环：\n\n```javascript\nchapter02/lib/exchange.js (摘录)\n\nwhile (remainingVolume\
    \ > 0\n  && Object.keys(oppBook.volumes).length > 0) {\n    var bestOppPrice =\
    \ oppBook.prices.peek();\n    var bestOppVol = oppBook.volumes[bestOppPrice];\n\
    }\n```\n\n`while` 循环检查是否仍有剩余交易量，以及订单簿另一侧是否仍有订单。我们使用 `Object.keys` 来返回对象中所有可枚举的属性名。<sup>8</sup>\
    \ 这让我们确定是否还有剩余订单。如果有，我们获取可用的最佳价格和交易量。\n\n现在交易有两种可能的情况。我们将参考最初的例子来说明，其中订单簿中有一个\
    \ 40 美元 100 单位的买单。第一种情况是太小以至于无法移除订单簿的任何层级。在我们的例子中，这意味着任何 99 单位或更少的卖单，因为它仍然会留下至少一个单位在\
    \ 40 美元：\n\n<sup>8</sup> https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/keys\n"
