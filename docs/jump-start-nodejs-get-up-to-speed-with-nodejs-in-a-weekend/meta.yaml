    ><img\n    src=\"http://twitter.github.com/bootstrap/assets/img/\nglyphicons/glyphicons_266_book_open.png\"\
    \ class=\"bs-icon\" alt=\"\">\n    <h2>实时数据</h2>\n    <p>我们还将构建一个模拟投资组合，向你展示如何将实时数据直接流式传输到你的浏览器中。一旦你掌握了基础知识，你将能够流式传输任何类型的数据，从推文、聊天到拍卖数据。\n\
    \    </p>\n</div>\n</div>\n</div>\n<header class=\"jumbotron masthead\">\n  <div\
    \ class=\"inner\">\n    <p class=\"download-info\">\n      <a data-toggle=\"modal\"\
    \ href=\"#\" class=\"btn btn-large\">登录</a>\n      <a data-toggle=\"modal\" href=\"\
    #\"\n        class=\"btn btn-primary btn-large\">注册</a>\n    </p>\n  </div>\n\
    </header>\n</div>\n</body>\n</html>\n```\n\n这段代码没有什么特别之处；它只是普通的 HTML。我们稍后会讨论一些\
    \ Bootstrap 功能。现在当你运行 node nockmarket 并访问 http://localhost:3000 时，你应该会看到图 4.1\
    \ 中漂亮渲染的页面。\n\n它比我们在第一章构建的普通表单好看多了！你看到的效果是 Twitter 的才华横溢的设计师遵循优美设计原则努力工作的结果。Bootstrap\
    \ 是一系列精心设计的部件集合，加上一些支持性 JavaScript 以增添色彩。在本章的剩余部分，我们将看到如何将这个库与 Node.js 结合起来，构建兼具功能和形式的软件。\n\
    \n## Nockmarket\n\n欢迎来到 Node.js 股票市场\n\n### 实时价格\n\n在这里，你将能够注册一个账户，并使用实时价格创建股票投资组合。这将结合\
    \ Bootstrap 的美观性和 Node.js 的高性能，打造一个设计精良、速度极快的股票跟踪工具。\n\n### 实时数据\n\n我们还将构建一个模拟投资组合，向你展示如何将实时数据直接流式传输到你的浏览器中。一旦你掌握了基础知识，你将能够流式传输任何类型的数据，从推文、聊天到拍卖数据。\n\
    \n登录\n\n注册\n\n图 4.1. 我们漂亮渲染的登陆页面\n\n下一步是修改代码以包含一些**模态窗口**。模态是允许用户输入其用户名和密码的部件。Bootstrap\
    \ 提供了模态的实现，包括前端设计和相关的 JavaScript。我们需要将 Bootstrap JavaScript 代码和 jQuery 添加到 **index.ejs**：\n\
    \n```\nchapter04/views/index.ejs (节选)\n<script src=\"http://twitter.github.com/bootstrap/assets/js/google-code-prettify/prettify.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/jquery.js\"\
    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-button.js\"\
