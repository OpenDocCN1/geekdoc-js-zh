  md: "# The Perils of Mutation\n\nThe native MongoDB driver for Node.js (to be discussed\
    \ in Chapter 3) mutates inserted objects by adding an _id field. Most of the time\
    \ this is fine; however, there are some edge cases where trouble can arise. For\
    \ example, you will receive an error if you try to insert the same object twice.\
    \ The first insert will work but the second one will complain about a duplicate\
    \ ID.\n\nIt can be a source of confusion if you’re unaware of the internal workings\
    \ of the driver. In a purely functional language such as Haskell, this isn’t an\
    \ issue because you’re guaranteed the value will never change. While it can sometimes\
    \ be impractical to program in a purely functional style, I certainly encourage\
    \ adopting its principles wherever possible.\n\nThe second interesting feature\
    \ of the createExchange function code is that it contains another function called\
    \ init. JavaScript allows for the declaration of functions within functions. Within\
    \ init, we perform some basic initialization: if we receive empty exchange data,\
    \ we set up an empty object to represent volumes and a new binary heap to indicate\
    \ prices. As previously discussed, for buy orders we use a maximum binary heap\
    \ because trades occur at the highest buy prices.\n\n# The Meat of the Problem\n\
    \nNow we’ll build the core of the exchange. First, we’ll set up some support functions:\n\
    \n```\nchapter02/lib/exchange.js (excerpt)\n\n        exchange[orderType].prices\
    \ = createBinaryHeap(options);\n    }\n}\nmodule.exports = {\n    BUY: BUY,\n\
    \    SELL: SELL,\n    buy:function (price, volume, exchangeData) {\n        return\
    \ order(BUY, price, volume, exchangeData);\n    },\n    sell:function (price,\
    \ volume, exchangeData) {\n        return order(SELL, price, volume, exchangeData);\n\
    \    },\n    order: order\n}\n```"
