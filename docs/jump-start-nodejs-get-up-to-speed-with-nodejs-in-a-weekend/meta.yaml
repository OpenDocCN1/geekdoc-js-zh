    \ function (handshakeData, callback) {\n```\n\n然后我们将以下内容部署到 Heroku：\n\n```bash\n\
    git add .\ngit commit -a -m \"Ready for production\"\ngit push heroku master\n\
    ```\n\n`push` 是一个 git 命令，它将你的本地仓库传输到远程位置。在这个例子中，我们正在将本地仓库推送到 Heroku，届时它将自动部署。事实上，Heroku\
    \ 是开源的，因此你可以自由地研究其源代码，了解它的部署脚本是如何运行的。⁹\n\n## 空闲时间\n\nHeroku 在底层运行在 EC2 基础设施上。这不是一个廉价的选项，因此免费账户在一段时间不活跃后会被\"\
    休眠\"。在空闲期过后，第一个连接的用户可能需要等待稍长时间，让你的应用程序重新启动。实际上，这是一个小问题，因为免费账户更适用于原型和测试，而不是完整的生产系统。付费账户不受此限制。\n\
    \n如果你收到如下错误消息：\n\n```\n'heroku' does not appear to be a git repository\n```\n\n\
    ... 你可以使用以下命令添加远程仓库：\n\n```bash\ngit remote add heroku git@heroku.com:mysterious-brook-2122.git\n\
    ```\n\n请将 `mysterious-brook-2122` 替换为 Heroku 分配给你的应用程序名称。\n\n现在你应该已经有一个部署在互联网上的实时系统了！在我们落下最后的帷幕之前，让我们添加一点个性化。目前，这个地址不太友好。拥有一个个性化的地址非常简单：\n\
    \n```bash\nheroku rename YOURNAME\n```\n\n你的网站新地址应会显示在控制台中。给你的朋友和家人发邮件，让他们看看你构建的这个精彩软件。也许他们会受到启发，去实现他们一直梦想的那个创业想法！\n\
    \n## 总结\n\n恭喜，你终于完成了！在本章中，我们学习了以下内容：\n\n- 托管的不同选项及其各自的优缺点\n- 使用环境变量来控制生产设置\n-\
