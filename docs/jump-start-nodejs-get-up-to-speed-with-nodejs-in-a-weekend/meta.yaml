    \ function(chunk) {\n        data += chunk.toString();\n    })\n    .on('error',\
    \ function(err) {\n        console.err('Error retrieving Yahoo stock prices');\n\
    \        throw err;\n    })\n    .on('end', function() {\n        var tokens =\
    \ data.split('\\r\\n');\n        var prices = [];\n        tokens.forEach(function(line)\
    \ {\n            var price = line.split(',')[1];\n            if (price)\n   \
    \             prices.push(price);\n        });\n        callback(null, prices);\n\
    \    });\n});\n\ngetUser: function(username, callback)\n```\n\n该函数类似，它使用 `http`\
    \ 模块从雅虎获取价格。它首先接收一个股票数组，并将其转换为逗号分隔的列表：\n\n```javascript\nstocks.forEach(function(stock)\
    \ {\n    stockList += stock + ',';\n});\n```\n\n然后我们将这个列表发送到雅虎 API，类似于我们之前所做的。收到结果后，我们解析数据并返回一个数组：\n\
    \n## Jump Start Node.js\n\n```javascript\nvar tokens = data.split('\\r\\n');\n\
    var prices = [];\ntokens.forEach(function(line) {\n  var price = line.split(\"\
    ,\")[1];\n  if (price)\n    prices.push(price);\n});\ncallback(null, prices);\n\
    ```\n\n股票数组中的元素与价格数组中的元素之间存在一一对应的关系。现在，我们将编写一个函数，允许用户将一只股票添加到投资组合中。首先，我们将通过编辑\
    \ **lib/db.js** 来修改我们的数据库封装器：\n\n## chapter04/lib/db.js (摘录)\n\n```javascript\n\
    {\n  push: function(name, id, updateQuery, callback) {\n    db.collection(name).update({_id:\
    \ id}\n      , {$push: updateQuery}, {safe:true}, callback);\n  }\n}\n```\n\n\
    我们将投资组合表示为用户对象中的一个字符串数组。这里我们创建了一个通用函数，允许应用程序将数据推送到一个数组中。MongoDB 的 update 函数与 `$push`\
    \ 修改器结合使用，^8 我们使用 `{safe:true}` 来确保回调仅在数据项插入数据库后才触发。如果没有这个设置，回调函数会立即触发。^9\n\n\
    > **修改器**\n>\n> MongoDB 有许多修改器操作，它们本身并不增加任何新功能。例如，`$push` 可以通过检索对象、手动将项目推入数组、然后保存整个对象来复制。修改器的便利之处在于它们可以直接在服务器上执行，省去了将对象从数据库发送到应用程序再返回的开销。\n\
    \n^8 http://www.mongodb.org/display/DOCS/Updating/#Updating-%24push\n^9 http://mongodb.github.com/node-mongodb-native/markdown-docs/insert.html\n"
