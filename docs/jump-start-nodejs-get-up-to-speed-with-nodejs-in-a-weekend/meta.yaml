  md: "# 28 Jump Start Node.js\n\n```\nchapter02/lib/exchange.js (excerpt)\n\nfunction\
    \ createExchange(exchangeData) {\n  var cloned = $.extend(true, {}, exchangeData);\n\
    \  cloned.trades = [];\n  init(cloned, BUY);\n  init(cloned, SELL);\n  return\
    \ cloned;\n\n  function init(exchange, orderType) {\n    if (!exchange[orderType])\
    \ {\n      exchange[orderType] = {};\n      exchange[orderType].volumes = {};\n\
    \      var options = {};\n      if (BUY == orderType) options.max = true;\n  \
    \    exchange[orderType].prices = createBinaryHeap(options);\n    }\n  }\n}\n\
    ```\n\nThis warrants further explanation. Why go to the trouble of cloning the\
    \ data? Why not just manipulate it directly as we might do in object-oriented\
    \ programming? In pure functional programming, functions have no side effects.\
    \ This means that if you pass a parameter into a function, you expect it to emerge\
    \ unchanged on the other side.\n\nThis makes a lot of sense. Imagine that you're\
    \ using a public API and you feed it some data, which then appears mangled in\
    \ the response. That piece of data is rendered effectively unusable because without\
    \ knowing the internal workings of the API, it's difficult to work out what has\
    \ changed.\n\nThat's why we clone the exchange data that has been passed in. If\
    \ somebody wishes to use it subsequently in a different context, they can do so\
    \ safe in the knowledge that their data has passed through untouched. Although\
    \ the following does not apply to single-threaded JavaScript, immutable data also\
    \ makes it easier to write multi-threaded applications because the data can be\
    \ used by multiple threads, safe in the knowledge that its value will never change."
