  md: "82  Jump Start Node.js\n\n```\nmodule.exports.getStockPrices([stock]\n  , function(err,\
    \ retrieved) {\n    price = retrieved[0];\n    doCallback();\n});\ndb.push('users',\
    \ new ObjectID(uid), {portfolio: stock}\n  , doCallback);\n},\nauthenticate: function(username,\
    \ password, callback) {\n```\n\nHere we are defining a new function, addStock,\
    \ which will add a specified stock to the user's portfolio.\n\nThere are two additional\
    \ functions being called: push will add the stock to the user in the database,\
    \ while getStockPrices will retrieve the stock price using the function we've\
    \ just written. This function was written to handle multiple stocks, so it is\
    \ trivial to use it to retrieve a single price by sending in an array of size\
    \ one, and then retrieving the first element from the output.\n\nWe effectively\
    \ make both calls at the same time, but without knowing which one will return\
    \ first. This dilemma can be handled by having both events call the function doCallback,\
    \ which we define here:\n\n```\nchapter04/lib/nocklib.js (excerpt)\n\naddStock:\
    \ function(uid, stock, callback) {\n  function doCallback() {\n    counter++;\n\
    \    if (counter == 2) {\n      callback(null, price);\n    }\n  }\n  var counter\
    \ = 0;\n```\n\nWe use the variable counter to keep track of how many times the\
    \ callback function is called. In this way, it's of no consequence which function\
    \ returns first. We always ignore the first call and return the price on the second\
    \ call. There are libraries that elegantly abstract some of these details away;\
    \ a good choice is async. <sup>10</sup>\n\n<sup>10</sup> https://github.com/caolan/async/"
