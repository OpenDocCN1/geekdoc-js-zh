    The first line of this code listing is similar to what we''ve seen before except
    that `app.get` is replaced with `app.post`. The next two lines extract the username
    and password from the request object. The next line `User.addUser(username, password,
    function(err, user)` looks a little mysterious. Where does `User` come from? It
    comes from the users module, which we''ll create shortly. Node.js comes with an
    excellent module system that allows the programmer to encapsulate functions. Separation
    of concerns is a core programming principle for managing complexity, and Node.js
    makes it easy to write modules that perform specific, well-defined tasks. After
    adding the user, we redirect back to the form page.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_30_0.png)


    **Real-world Development**


    In the real world, Express provides a lot of useful abstractions. This means that
    in future it won''t be necessary to read files from the disk in the manner we
    are now. Note also that, by default, Node.js does not support "hot swapping" of
    code, meaning that changes are only reflected when you restart Node.js. This can
    become tedious after a while, so I suggest at some point you install `node-supervisor`
    to automatically restart the system upon changes to the file.¹⁴


    # The Database


    In order to create a users module, we''ll need to write a database module. Place
    the following code into a file called **db.js** in a directory called **lib**:


    ```

    // chapter01/authentication/lib/db.js

    var mongoose = require(''mongoose'');

    var Schema = mongoose.Schema;


    module.exports.mongoose = mongoose;

    module.exports.Schema = Schema;


    // Connect to cloud database

    ```


