    \ an array of users, we construct the list of users from scratch.\n\nThe final\
    \ step is to modify **portfolio.ejs** by adding a placeholder to display our users:\n\
    \n```\nchapter05/views/portfolio.ejs (excerpt)\n\n<p><button type=\"submit\" class=\"\
    btn btn-primary chat-widget\"\n  id=\"send-chat\">Send</button></p>\n<p><span\
