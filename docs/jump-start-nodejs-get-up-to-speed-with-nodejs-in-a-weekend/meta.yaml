    Let’s move on to some of the basics behind deployment.


    # Version Control


    Version control is a mechanism for controlling software changes. It is good practice
    to be using a version control system and absolutely mandatory if using Heroku.
    A number of popular version control systems exist, with the Node.js community
    very tightly intertwined with Git. Almost every single package is hosted on GitHub,
    an online provider of Git hosting services.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_160_0.png)


    # An Introduction to Git


    Git is a distributed version control system written by Linus Torvalds, the original
    developer of Linux. “Distributed” refers to the fact that you clone an entire
    repository, with the ability to make purely local changes before syncing to the
    main server. Every user has an entire backup of the full source code. Git also
    supports the concept of branching, which allows a developer to create branches
    for experimentation and new features. Other features are documented at the official
    site.³


    We will cover Ubuntu. While development can take place on Mac OS X, Windows, or
    Linux, a production deployment is invariably done on some flavor of Linux, with
    Ubuntu being one of the more popular deployment options. Installation instructions
    for other platforms are available from the official website.⁴


    Type the following at the command prompt:


    ```

    sudo apt-get install git-core

    ```


    ³ http://git-scm.com/about

    ⁴ http://git-scm.com/'
