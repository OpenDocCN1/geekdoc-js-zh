  md: "Note that the password has been encrypted. You should be redirected to /portfolio\
    \ with the message:\n\n```\nCannot GET /portfolio\n```\n\nWe'll be implementing\
    \ this functionality a little later in the chapter.\n\n# There Can Be Only One\n\
    \nUsers can now register on our website, but there is still one small problem.\
    \ Duplicate registrations are allowed, which means that two unique users can end\
    \ up with the same username. We'll now put in an Ajax check to inform the user\
    \ whether their particular choice of username has already been taken.\n\n> ##\
    \ Why Ajax?\n\nAjax stands for Asynchronous JavaScript and XML. Ajax, via the\
    \ XMLHttpRequest object, allows small pieces of information to be transmitted\
    \ back and forth between a browser and a web server. Prior to this, even small\
    \ changes to a page involved a full reload, leading to a sluggish user experience.\
    \ Ajax enables a snappier, more responsive and interactive experience, as the\
    \ following example demonstrates.\n\nFirst, let's write a small library function\
    \ to search by username. This can be done in a single line of business logic.\
    \ Add the following to **nocklib.js**:\n\n```\nchapter04/lib/nocklib.js (excerpt)\n\
    \n},\n\ngetUser: function(username, callback) {\n    db.findOne('users', {username:\
    \ username}, callback);\n}\n}\n```\n\nThe query to search for a matching username\
    \ is basic:\n\n```\n{username: username}\n```\n\nThis query is in standard JSON\
    \ syntax, which means that the left `username` refers to the field name and the\
    \ right `username` refers to the variable. Once actual data is"
  merge: -1
  pgno: 90
- img_proc: true
  md: "involved the query might resemble this: {username: 'johnsmith'}. We then add\
    \ the associated routing. Append this route to **nockmarket.js**:\n\n```\nchapter04/nockmarket.js\
    \ (excerpt)\n\napp.get('/', nockroutes.getIndex);\napp.get('/api/user/:username',\
    \ nockroutes.getUser);\n```\n\nNote how a regular expression is used in the routing:\n\
    \n```\n/api/user/:username\n```\n\nThe :username portion means that we store anything\
    \ after /api/user/ in a variable called username. For example, if a person tries\
    \ to access /api/user/james, the value 'james' will be stored inside req.params.username.\n\
    \nTo complete the routing, add the following to **nockroutes.js**:\n\n```\nchapter04/routes/nockroutes.js\
    \ (excerpt)\n\n},\n\ngetUser: function(req, res) {\n  nocklib.getUser(req.params.username,\
    \ function(err, user) {\n    if (user)\n      res.send('1');\n    else\n     \
    \ res.send('0');\n  });\n},\n\nsignup: function(req, res) {\n```\n\nOnce we use\
    \ this information in conjunction with our library to search for the user, the\
