    \nfunction getOpposite() {\n  return (BUY == orderType) ? SELL : BUY;\n}\nfunction\
    \ isTrade() {\n  var opp = cloned[getOpposite()].prices.peek();\n  return (BUY\
    \ == orderType) ? price >= opp : price <= opp;\n}\nvar trade = isTrade();\n```\n\
    \nFirst, we set up a small helper function, `getOpposite`. If it is a buy order,\
    \ we return `SELL`, and vice versa.\n\n> **Closures**\n> Notice how `getOpposite`\
