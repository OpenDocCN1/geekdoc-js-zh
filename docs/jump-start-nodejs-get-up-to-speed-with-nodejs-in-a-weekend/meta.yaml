    A naive implementation would be to write a buy function and then paste it to a\
    \ sell function and change the necessary parts. You should never do this, as it\
    \ violates the principle of **Don't Repeat Yourself (DRY)**. DRY is a programming\
    \ philosophy that states that any piece of knowledge should have only a single\
    \ representation. In simple terms, if you ever find yourself copying code from\
    \ other places, there's a good chance you have violated DRY.\n\nNote that module.exports\
    \ is just a piece of JSON. While JSON is often used to transport data, in this\
    \ example we can see that it's also used to store function definitions. This illustrates\
    \ another important principle of functional programming: functions are first-class\
    \ citizens. Anywhere that you can use a variable, you can use a function. If you\
