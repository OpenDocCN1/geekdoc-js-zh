    \ already taken');\n                $('.create-button').addClass('disabled')\n\
    \                    .attr('disabled', true);\n            }\n            else\
    \ {\n                $('#imagePlaceHolder').html('<img src=\"http://spbooks.github.com/nodejs1/tick.png\"\
    \ alt=\"tick\">');\n                $('.create-button').removeClass('disabled')\n\
    \                    .attr('disabled', false);\n            }\n        });\n \
    \   });\n});\n```\n\n❶ The call to `blur` is triggered when the uname field loses\
    \ focus.\n\n❷ When this happens, we use the jQuery `ajax` function to fire a GET\
    \ request to our Node.js server.\n\n❸ If the username is found, we display a cross\
    \ to indicate that it's unavailable.\n\nIf you restart your server, click on **Sign\
    \ Up**, and enter a username that's already taken, you should see a similar sight\
    \ to Figure 4.3 once the input loses focus.\n\n4. We also disable the **Create\
    \ Account** button so that the user is unable to submit the form with an invalid\
    \ username.\n\n5. If the username is available, we display a tick as in Figure\
    \ 4.4.\n\n6. Then we enable the **Create Account** button.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_93_0.png)\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_93_1.png)\n\nGo ahead and try the sign-up\
    \ in your own browser, making sure the output resembles this. We have now completed\
    \ the first part of the authentication process; namely, registering a new user.\
    \ It's time to allow them to log in.\n\n## Authentication\n\nLet's begin by modifying\
    \ the front end to add a login modal. We construct the modal by including the\
    \ code at https://gist.github.com/3968470 in `index.ejs`:\n\n## chapter04/views/index.ejs\
    \ (excerpt)\n\n```html\n</div>\n<!-- paste code here -->\n<div class=\"container\"\
    >\n```\n\nWe will now modify the `href` value for the login button to trigger\
    \ the modal:\n\n## chapter04/views/index.ejs (excerpt)\n\n```html\n<div class=\"\
    inner\">\n  <p class=\"download-info\">\n    <a data-toggle=\"modal\" href=\"\
    #loginModal\"\n       class=\"btn btn-large\">Log In</a>\n  </p>\n</div>\n```\n\
    \nAs a quick check at this point, refresh the page and click on **Log In**. Now\
    \ we can write a library function to authenticate the user. Add the following\
    \ to `nocklib.js`:\n\n## chapter04/lib/nocklib.js (excerpt)\n\n```javascript\n\
    module.exports = {\n  authenticate: function(username, password, callback) {\n\
    \    db.findOne('users', {username: username}, function(err, user) {\n      if\
    \ (user && (user.password === encryptPassword(password)))\n        callback(err,\
    \ user._id);\n      else\n        callback(err, null);\n    });\n  },\n  ...\n\
    ```\n\n1. Here we retrieve the user from the database. First we check whether\
    \ the user exists, and then that the given password matches the encrypted password\
    \ in the database.\n2. If there is a match, we return the ID.\n3. Otherwise we\
    \ return null.\n\nThe reason we return the ID instead of simply `true` is because\
    \ the user ID is a handy field that we'll utilize repeatedly. By returning it\
    \ as part of the authentication function, we can save a separate call to the database\
    \ further down the line.\n\nThe final step is to connect our library function\
    \ to a route in **nockmarket.js**:\n\n```javascript\napp.get('/api/user/:username',\
    \ nockroutes.getUser);\napp.post('/login', nockroutes.login);\n```\n\nWe flesh\
    \ out the body of the route in **nockroutes.js**:\n\n```javascript\n},\n\nlogin:\
    \ function(req, res) {\n  nocklib.authenticate(req.body.username,\n    req.body.password,\
    \ function(err, id) {\n      if (id) {\n        res.redirect('/portfolio');\n\
    \      }\n      else\n        res.redirect('/');\n  });\n},\n\nsignup: function(req,\
    \ res) {\n```\n\nIf the user is authenticated, we will redirect to the **/portfolio**\
    \ page. If either the user does not exist or the passwords fail to match, we'll\
    \ redirect to the home page. I'll leave it to you to redirect to a friendly error\
    \ message in the case of failed authentication. At this point, you should have\
    \ all the tools needed to accomplish this in a few lines of code.\n\nThere is\
    \ one more task to do. Once the user has logged in, how do we keep track of that\
    \ user in the future? One way is through the use of **sessions**, which is a way\
    \ of storing information about the user on the server. This is in contrast to\
    \ a cookie, which is used to store information about the user on the client device.\
    \ Note that sessions may still use an HTTP cookie to store the session token.\
    \ Therefore, cookies are required to store the session token even though other\
    \ information is handled on the server side. We can configure Express.js with\
    \ session support as follows:\n\n## chapter04/nockmarket.js (excerpt)\n\n```javascript\n\
    app.use(express.bodyParser());\napp.use(express.cookieParser());\napp.use(express.session({secret:\
    \ 'secretpasswordforsessions'}));\n```\n\nThis code will add support for sessions\
    \ and cookies. Then when the user logs in, we can store the ID in the session\
    \ variable. Modify **nockroutes.js** as follows:\n\n## chapter04/routes/nockroutes.js\
    \ (excerpt)\n\n```javascript\nif (id) {\n    req.session._id = id;\n    res.redirect('/portfolio');\n\
    }\n```\n\nOnce the user ID has been stored, it can be accessed in the future using\
    \ `req.session._id`. This will come in handy later when we use it to protect our\
    \ portfolio page. It's now time to enable users to add stocks to their portfolios.\n\
    \n## A Basic Portfolio\n\nWe'll now allow users to construct a basic portfolio.\
    \ Let's begin by adding a library function that allows the user to retrieve an\
    \ individual stock price. Inside **nocklib.js**, import the `http` module:\n\n\
    ## chapter04/lib/nocklib.js (excerpt)\n\n```javascript\n, exchange = require('./exchange')\n\
    , http = require('http')\n, priceFloor = 35\n```\n\nThen we make a small modification\
    \ to the function we wrote in Chapter 2:\n\n## chapter04/lib/nocklib.js (excerpt)\n\
    \n```javascript\n},\n\ngetStockPrices: function(stocks, callback) {\n    var stockList\
    \ = '';\n\nstocks.forEach(function(stock) {\n    stockList += stock + ',';\n});\n\
    \nvar options = {\n    host: 'download.finance.yahoo.com',\n    port: 80,\n  \
    \  path: '/d/quotes.csv?s=' + stockList + '&f=sl1c1d1&e=.csv'\n};\n\nhttp.get(options,\
    \ function(res) {\n    var data = '';\n    res.on('data', function(chunk) {\n\
    \        data += chunk.toString();\n    })\n    .on('error', function(err) {\n\
    \        console.err('Error retrieving Yahoo stock prices');\n        throw err;\n\
    \    })\n    .on('end', function() {\n        var tokens = data.split('\\r\\n');\n\
    \        var prices = [];\n        tokens.forEach(function(line) {\n         \
    \   var price = line.split(',')[1];\n            if (price)\n                prices.push(price);\n\
    \        });\n        callback(null, prices);\n    });\n});\n\ngetUser: function(username,\
    \ callback)\n```\n\nThe function is similar in that it uses the `http` module\
    \ to retrieve prices from Yahoo. It first takes an array of stocks and converts\
    \ it to a comma-delimited list:\n\n```javascript\nstocks.forEach(function(stock)\
    \ {\n    stockList += stock + ',';\n});\n```\n\nWe then send this list to the\
    \ Yahoo API, similar to what we did before. Upon getting the result, we parse\
    \ the data and return an array:\n\n## Jump Start Node.js\n\n```javascript\nvar\
    \ tokens = data.split('\\r\\n');\nvar prices = [];\ntokens.forEach(function(line)\
    \ {\n  var price = line.split(\",\")[1];\n  if (price)\n    prices.push(price);\n\
    });\ncallback(null, prices);\n```\n\nThere is a one-to-one correspondence between\
    \ the elements in the stock array and the elements in prices. Now we'll write\
    \ a function that allows the user to add a stock to the portfolio. First, we'll\
    \ amend our database wrapper by editing **lib/db.js**:\n\n## chapter04/lib/db.js\
    \ (excerpt)\n\n```javascript\n{\n  push: function(name, id, updateQuery, callback)\
    \ {\n    db.collection(name).update({_id: id}\n      , {$push: updateQuery}, {safe:true},\
    \ callback);\n  }\n}\n```\n\nWe will represent the portfolio as an array of Strings\
    \ within a user object. Here we're creating a generic function to allow the application\
    \ to push data into an array. MongoDB's update function is combined with the `$push`\
    \ modifier,^8 and we use `{safe:true}` to ensure that the callback is only fired\
    \ once the item is inserted into the database. Without this, the callback function\
    \ fires immediately.^9\n\n> **Modifiers**\n>\n> MongoDB has a number of modifier\
    \ operations that don't add any new functionality as such. For instance, `$push`\
    \ could be replicated by retrieving the object, manually pushing an item into\
    \ an array, and then saving the entire object. What's handy about modifiers is\
    \ that they can take place directly on the server, removing the overhead of sending\
    \ an object from the database to the application and back again.\n\n^8 http://www.mongodb.org/display/DOCS/Updating/#Updating-%24push\n\
    ^9 http://mongodb.github.com/node-mongodb-native/markdown-docs/insert.html"
