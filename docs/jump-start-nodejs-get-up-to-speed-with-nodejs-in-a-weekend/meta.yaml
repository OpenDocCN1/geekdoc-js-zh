    \ field exists. You'll recall that only trades have the `init` field. We limit\
    \ the number of results to 100. For those familiar with SQL, there is an SQL-to-Mongo\
    \ mapping chart available.\n\n## Indexing\nThe query that we've presented will\
    \ appear to run very quickly because of the data set's small size. In a production\
    \ system, it would be essential to index certain fields to optimize search efficiency.\n\
    An everyday example of indexes is the Yellow Pages. If you look up a particular\
    \ name, the alphabetical index enables a reasonably efficient search to find the\
    \ desired entry rather than sequentially scanning from first page to last.\nYou\
    \ only need to create an index once, and this can be done from a MongoDB shell\
    \ completely outside of any Node.js environment. Indexing is a detailed topic,\
    \ so for further information, a good source is the official documentation.\n\n\
    The database extraction is now done. The rest of the function manipulates the\
    \ returned array so that it's presented in the desired format for the charting\
    \ application we're about to introduce. First, we reverse the array so that the\
    \ timestamps appear in chronological order using `trades.reverse()`.\n\nWe use\
    \ `forEach` to iterate over each element of the array. The graphical package that\
    \ we'll be using expects data of the form `[time, price]`. We must first extract"
