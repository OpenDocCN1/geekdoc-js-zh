    \ on the database:\n\n```\ndb.find('transactions'\n      , {init: {$exists: true}}\n\
    \      , 100, function(err, trades) {\n```\n\nConveniently, MongoDB queries are\
    \ in JSON format, so no new syntax has to be learned. The main concepts to learn\
