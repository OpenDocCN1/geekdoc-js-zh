    \n首先，它使我们能够简化路由。迄今为止，我们一直使用路由作为粘合剂，将前端视图与后端业务逻辑绑定在一起。随着应用程序变得更大，路由文件不可避免地会变得杂乱，无论其结构组织得有多好。Socket.IO\
