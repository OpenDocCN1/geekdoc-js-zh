    Your **Nockmarket** tab should now resemble Figure 6.1.


    # Welcome to the Nockmarket


    Here you can manage your portfolio and view live prices.


    ![](img/89e83b9cba99d96b087ef2fbb3e7f632_135_0.png)


    Figure 6.1. **Nockmarket** tab showing prices


    # Client Filtering


    We will implement a filter that allows the user to filter their portfolio based
    on the code of a particular stock. There are several approaches to this, the least
    efficient being a traditional form submission. This involves an entire page refresh
    including portions of the page that we know will stay the same.


    A better approach is to use Ajax, as it will only change that part of the page
    that involves new data. This will be quicker than a full page refresh, but there
    is still a call to the server, which may cause a sluggish experience depending
    on the connection between the user and your site.


    It''s possible to construct an ad hoc approach to solving the client-side problem
    by combining jQuery with HTML tag annotations. Backbone is a lightweight framework
    that will enforce a consistent approach all the way through. Using a framework
    like this is preferred because it will promote code readability and maintainability.


    Our first task is to change the way that the initial stock portfolio is transmitted
    from the server to the client. At the moment, the user makes a request, the data
    is assembled on the server, and it is then fed into a template and rendered to
    the user.


    The Backbone approach is as follows. As before, the user makes a request. Backbone
    then makes a request to a server-side API. The data is placed into a model on
    the client side. Subsequent changes are made to the model and bindings specify
    how these changes should be reflected in the user interface. Let''s proceed with
    a concrete example to help illustrate the concept. Modify **portfolio.ejs** as
    follows:'
