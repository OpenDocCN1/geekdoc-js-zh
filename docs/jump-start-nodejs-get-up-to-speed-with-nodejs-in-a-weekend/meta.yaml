  md: "Many I/O operations deal with events that are dependent upon each other. A\
    \ typical example is to retrieve a user from the database based on ID and then\
    \ look up stock prices in the user's stock portfolio. In these scenarios, the\
    \ idiomatic Node.js technique for handling this is the **nested callback**, of\
    \ which you've seen many examples. Nested callbacks take the following form:\n\
    \n```\ngetUser(id, function(err, user) {\n  getPrices(user.stocks, function(err,\
    \ prices) {\n    // handle prices\n  });\n});\n```\n\nIn this snippet, `getPrices`\
    \ will always run after `getUser`. This is by design and it makes sense because\
    \ we cannot know what prices to retrieve until the `user` object is returned from\
    \ the database.\n\nSuppose, however, that the events you're handling are independent,\
    \ such as adding a stock to the portfolio and retrieving the stock price from\
    \ Yahoo. When a user adds stock to the portfolio, two independent actions occur:\
    \ we add stock to the portfolio using MongoDB, and we retrieve the stock price\
    \ from Yahoo. Because of event independence, there's no need to run the events\
    \ serially. We want to run the events in parallel. Therefore we don't want to\
    \ use a nested callback.\n\nAssume that adding stock to the portfolio takes one\
    \ second, as does retrieving a price. Using a nested callback, the operation takes\
    \ two seconds because the second action needs to wait for the first to complete\
    \ before it can start. But if we were to run them in parallel, the total activity\
    \ would only take one second to complete.\n\nThe issue is that we're unaware which\
    \ event will finish first; so how do we determine where the callback should occur?\
    \ There are a number of libraries that abstract away this complication; however,\
    \ for this example, we'll avoid third-party libraries so that you can understand\
    \ the principles behind what is happening. Let us define a new function within\
    \ `nocklib.js`:\n\n```\nchapter04/lib/nocklib.js (excerpt)\nmodule.exports = {\n\
    \  addStock: function(uid, stock, callback) {\n    var price;\n```"
