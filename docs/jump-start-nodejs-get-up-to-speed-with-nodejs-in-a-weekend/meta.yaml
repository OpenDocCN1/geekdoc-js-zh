  md: "# Jump Start Node.js\n\nMongoose is an object-to-document mapper, and was introduced\
    \ briefly in Chapter 1. It provides a way of specifying schemas in Node.js, which\
    \ are then translated into MongoDB BSON documents, and abstracts some of the lower-level\
    \ implementation details. There is an advantage because the abstraction allows\
    \ for rapid application development. The trade-off is decreased performance in\
    \ certain situations due to all the wizardry happening behind the scenes.\n\n\
    The other option is the native driver, which is the officially supported driver\
    \ from 10gen, the company behind MongoDB. The native driver forces you to deal\
    \ with lower-level operations such as opening asynchronous database connections.\
    \ You also need to determine how schemas should be handled at the application\
    \ level.\n\nThere is a close correspondence between MongoDB operations and native\
    \ driver operations, relieving developers of needing to learn too many idiosyncratic\
    \ features. Additionally, it offers the best performance, as mentioned. Both drivers\
    \ are excellent choices, but we'll use the native driver for the remainder of\
    \ this book. Once you understand the basics of the native driver, it is relatively\
