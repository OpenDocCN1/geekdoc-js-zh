    \ To my lifelong friend Chuong Mai-Viet: thanks for dragging me away from the\
    \ desk on bright and sunny days to keep my golf handicap down and my Vitamin D\
    \ intake up.\n\n## Conventions Used in This Book\n\nYou’ll notice that we’ve used\
