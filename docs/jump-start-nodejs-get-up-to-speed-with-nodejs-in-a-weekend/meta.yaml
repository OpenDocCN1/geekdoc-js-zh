    \ create the file .gitignore at the top level so that we can specify what files\
    \ and directories will be omitted. For now, it should contain a single line: node_modules.\n\
    \nThere is no point checking in the modules directory. Heroku will automatically\
    \ pull modules from the official repository whenever new code is checked in. Next,\
    \ we create our Git repository as follows:\n\n```\ngit init\n```\n\nThen we add\
    \ files and directories:\n\n```\ngit add .\n```\n\nThis will add all files, directories,\
    \ and subdirectories except for those specified in the ignore file. Now we can\
    \ commit our files into a local repository with an initial message for documentation\
    \ purposes:\n\n```\ngit commit -m \"Initial check in\"\n```\n\nThe above process\
    \ creates a local repository. Each check-in is associated with a unique identifier.\
    \ This allows us to revert to an arbitrary revision. Conceptually, we need to\
    \ push this local repository to Heroku next. This process, along with a brief\
    \ overview of Heroku, will be provided in the next section.\n\n## Heroku\n\nHeroku\
    \ is a polyglot Platform as a Service (PaaS) provider. **Polyglot** means that\
    \ it supports several languages. Originally conceived as a host for Ruby, it now\
    \ supports Java, Node.js, Scala, and Clojure. Platform as a Service is a model\
    \ whereby Heroku provides the network and servers as well as the Node.js-related\
    \ infrastructure. Heroku conveniently provides a free option, allowing us to comprehensively\
    \ trial the offering before deciding whether to choose it as our final production\
    \ host.\n\nBecause of Heroku's origins, both Ruby and its package manager, RubyGems,\
    \ will be required before installing Heroku. If this is yet to be installed on\
    \ your operating system, you can install both packages using the following command:\n\
    \n```\nsudo apt-get install ruby-full rubygems\n```\n\n## Nodejitsu\n\nThe Node.js\
    \ ecosystem is constantly evolving and improving, and one of the newer hosting\
    \ offerings comes from the team at Nodejitsu. A tutorial was not provided in this\
    \ book because the product is currently still in beta. As such, it's not as battle-hardened\
    \ as Heroku, and bugs and changes could potentially arise that would inconvenience\
    \ you.\n\nHowever, it is worth keeping an eye on this product as it matures. Because\
    \ the offering is Node.js-specific, it requires fewer tweaks and customizations\
    \ to your code base and environment. As an example, Nodejitsu has full support\
    \ for Web-Sockets, and installation of its tools can take place through the node\
    \ package manager (npm).\n\nFirst, visit http://heroku.com and sign up for an\
    \ account. Then execute the following command from your prompt:\n\n```\nwget -qO-\
    \ https://toolbelt.heroku.com/install-ubuntu.sh | sh\n```\n\nThis will install\
    \ the Heroku toolbelt. Instructions for other operating systems are available\
    \ at the official site.<sup>5</sup>\n\nThe toolbelt is controlled from the command\
    \ line. You can log in to Heroku using:\n\n```\nheroku login\n```\n\n## Configuration\
    \ Tweaking\n\nIf you receive an error message about \"command not found,\" you\
    \ may need to set your path as per the https://devcenter.heroku.com/articles/cli-command-not-found\
    \ instructions.\n\nIf you find that Heroku isn't installed in the specified EXECUTABLE_DIRECTORY,\
    \ you can install it through gem as follows:\n\n```\nsudo gem install heroku\n\
    ```\n\nEnter your email and password; choose “Y” if you're asked to generate a\
    \ public key.\n\n### Public Keys\n\nHeroku requires the use of public key encryption.\
    \ It's easy to check whether you have a public key, and to generate one if you\
    \ do not. The instructions are available at https://help.github.com/articles/generating-ssh-keys.\n\
    \nIf you need to generate your public key manually, add it to Heroku:\n\n```\n\
    heroku keys:add ~/.ssh/id_rsa.pub\n```\n\nNow we have to create a file called\
    \ **Procfile** in the top level containing the following:\n`web: node nockmarket.js`.\n\
    \nweb indicates that we are running a web application, which directly interfaces\
    \ with the user. Heroku also supports worker processes designed to perform in\
    \ the background. At this point, it's worth double-checking your **package.json**\
    \ file. It should resemble the following:\n\n```json\n{\n  \"name\": \"nockmarket\"\
    ,\n  \"version\": \"0.0.1\",\n  \"private\": true,\n  \"engines\": {\n    \"node\"\
    : \"0.8.8\",\n    \"npm\": \"1.1.49\"\n  },\n  \"dependencies\": {\n    \"cookie\"\
    : \"0.0.4\",\n    \"dnode\": \"1.0.0\",\n    \"ejs\": \"0.8.3\",\n    \"express\"\
    : \"2.5.9\",\n    \"jquery\": \"1.7.2\",\n    \"mocha\": \"1.0.1\",\n    \"mongodb\"\
    : \"1.1.7\",\n    \"should\": \"0.6.1\",\n    \"socket.io\": \"0.9.10\",\n   \
    \ \"underscore\": \"1.3.3\"\n  }\n}\n```\n\nNote that we specify both the Node.js\
    \ version<sup>6</sup> and the npm version.<sup>7</sup> Since Heroku provides the\
    \ platform, these versions are restricted to ones it officially supports.\n\n\
    Using the toolbelt, we can create the application with:\n\n```\nheroku create\n\
    ```\n\nIt should come up with http://mysterious-brook-2122.herokuapp.com or similar.\n\
    \nSo far so good, but now we have a problem. What do we do about the database?\
    \ While Heroku does provide Node.js hosting, MongoDB is unsupported.<sup>8</sup>\
    \ Remember the MongoLab account we created in the very first chapter? It is now\
    \ time to come full circle. While knowing how to install MongoDB from scratch\
    \ is a critical part of your Node.js journey, we’ll now revisit a hosted deployment\
    \ solution in order to provide compatibility with Heroku. So far, we’ve been connecting\
    \ to the database locally with no need for credentials. We have to modify our\
    \ database code to handle authentication. Modify **db.js** as follows:\n\n```javascript\n\
    chapter07/lib/db.js (excerpt)\n\nopen: function(callback) {\n  db.open(function(err,\
    \ data) {\n    if (process.env.MONGO_NODE_DRIVER_USER) {\n      data.authenticate(process.env.MONGO_NODE_DRIVER_USER\n\
    \      , process.env.MONGO_NODE_DRIVER_PASS\n      , function(err2, authData)\
    \ {\n        if(authData) { callback(); }\n        else {\n          console.log(err2);\n\
    \          return;\n        }\n      });\n    }\n    else { callback(); }\n  });\n\
    },\n```\n\n> <sup>6</sup> http://heroku-buildpack-nodejs.s3.amazonaws.com/manifest.nodejs\n\
    > <sup>7</sup> http://heroku-buildpack-nodejs.s3.amazonaws.com/manifest.npm\n\
    > <sup>8</sup> There is an add-on available, but this requires registration with\
    \ a credit card.\n\nHeroku supports the use of environment variables, and here\
    \ we look for the username and password in such variables. Depending on the version\
    \ of Heroku you use, it may be necessary to specify the application name as well.\
    \ If you receive an error message typing the following parameters into your console,\
    \ try including the application name (the part in square brackets). Replace the\
    \ *emphasized* parts with the parameters for your particular database:\n\n```\n\
    heroku config:add MONGO_NODE_DRIVER_HOST=XYZ.mongolab.com [--app mysterious-brook-2122]\n\
    heroku config:add MONGO_NODE_DRIVER_PORT=12345 [--app mysterious-brook-2122]\n\
    heroku config:add MONGO_NODE_DRIVER_USER=YOURUSER [--app mysterious-brook-2122]\n\
    heroku config:add MONGO_NODE_DRIVER_PASS=YOURPASS [--app mysterious-brook-2122]\n\
    ```\n\nThe parameters can be viewed and configured from your MongoLab account\
    \ page.\n\n## Using a Remote Database Locally\n\nWith the modified database code,\
    \ it is possible to run the database remotely if you do not wish to run a local\
    \ copy of MongoDB. All you have to do is set the relevant environment variables.\
    \ In Ubuntu, the command is as follows:\n\n```\nexport MONGO_NODE_DRIVER_HOST=...\n\
    export MONGO_NODE_DRIVER_PORT=...\nexport MONGO_NODE_DRIVER_USER=...\nexport MONGO_NODE_DRIVER_PASS=...\n\
    ```\n\nAfter each line has been added, you should see a message on the console\
    \ such as:\n\n```\nAdding config vars and restarting app... done, v5\n```\n\n\
    We also use an environment variable to specify the port in **nockmarket.js** as\
    \ follows:\n\n```javascript\nchapter07/nockmarket.js (excerpt)\n\ndb.open(function()\
    \ {\n    nocklib.createSocket(app);\n    var port = process.env.PORT || 3000;\n\
    \    app.listen(port);\n    for (var i = 0; i < stocks.length; i++) {\n      \
    \  submitRandomOrder(i);\n    }\n});\n```\n\nThis is necessary because Heroku\
    \ prohibits applications from running on arbitrary ports. Instead, transient ports\
    \ are used each time the application starts. `process.env.PORT` is actually set\
    \ by Heroku, not our own application. This is all transparent to end users, who\
    \ connect to our application the same way that they would connect to any other\
    \ website.\n\nOne other small change is to parse the port as a number in `db.js`:\n\
    \n```javascript\nchapter07/lib/db.js (excerpt)\n\n, host = envHost != null ? envHost:\
    \ 'localhost'\n, port = envPort != null\n    ? parseInt(envPort, 10) : Connection.DEFAULT_PORT;\n\
    ```\n\nWithout this modification, the environment variable is interpreted as a\
