    \ require('./BinaryHeap');\n\nvar BUY = \"buys\", SELL = \"sells\";\n\nfunction\
    \ createBinaryHeap(orderType) {\n    return new BinaryHeap(function (x) {\n  \
    \      return x;\n    }, orderType);\n}\n```\n\n1. First, we import the jQuery\
    \ library. Although jQuery is primarily a client-side library, we use it here\
    \ for its clone function, which is discussed in more detail shortly. $ is the\
    \ idiomatic way to refer to the jQuery library, and this is a convention to which\
    \ we'll adhere.\n2. Next we import the binary heap ...\n3. ... and define some\
    \ constants.\n4. Finally, we have a small helper function to create a new binary\
    \ heap.\n\n### jQuery on the Server\n\nOne of the appeals of Node.js is the concept\
    \ of \"one language to rule them all.\" In a perfect world, we would have seamless\
    \ integration of client-side and server-side code. As it currently stands, best\
    \ practices are still emerging, and there is still sometimes friction when bringing\
    \ client code to the server and vice versa.\n\nBringing jQuery to the server is\
    \ not a standard technique; some might even consider it slightly unorthodox. I\
    \ use it here to provide an example of what is possible. You should experiment\
    \ with various combinations to find out what works best for your particular project.\n\
    \nNext, there is a function that takes existing exchange data and clones it:"
