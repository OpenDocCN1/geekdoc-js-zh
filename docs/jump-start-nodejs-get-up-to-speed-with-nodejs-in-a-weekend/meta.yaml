    for a dynamic language, and are due in no small part to V8 optimizations such
    as compilation into machine code pre-execution.


    > On Benchmarking


    Benchmarking is an intricate topic,<sup>5</sup> and the numbers above should be
    taken with the proverbial grain of salt. Whenever any discussion of benchmarking
    arises, it is generally qualified with “it depends.” The main purpose of discussing
    the benchmark was to dispel any misconception of JavaScript being inherently slow.


    The official description talks about the event-driven, non-blocking I/O model.
    Traditionally, programming is done in a synchronous manner: a line of code is
    executed, the system waits for the result, the result is processed, and then execution
    resumes. Sometimes waiting for the result can take a long time; for example, reading
    from a database or writing to a network.


    In languages such as Java and C#, one solution is to spawn a new **thread**. A
    thread may be thought of as a lightweight process that performs tasks. Threaded
    programming can be difficult because multiple threads can be trying to access
    the same resource concurrently. Without dissecting the intricacies of multi-threaded
    programming, you can imagine it would be disastrous for one thread to be incrementing
    a counter while another thread is decrementing the counter at the same time.


    <sup>3</sup> http://shootout.alioth.debian.org/u32/benchmark.php?test=all&lang=v8&lang2=python3


    <sup>4</sup> http://shootout.alioth.debian.org/u32/benchmark.php?test=all&lang=v8&lang2=yarv


    <sup>5</sup> http://shootout.alioth.debian.org/dont-jump-to-conclusions.php'
  - '[PAGE 22]


    # 4 Jump Start Node.js


    JavaScript approaches the problem differently. There is only ever a single thread.
    When doing slow I/O operations such as reading a database, the program does not
    wait. Instead, it immediately continues to the next line of code. When the I/O
    operation returns, it triggers a callback function and the result can be processed.
    If the mechanics of this seems slightly counterintuitive, rest assured that by
    the end of the book it will be second nature, because we''ll be seeing this pattern
    over and over again. Node.js offers a simple, fast, event-driven programming model
    well-suited to the asynchronous nature of modern-day web applications.


    # Strengths and Weaknesses


    Node.js is not a panacea. There is a certain class of problems in which its strengths
    shine through. Computer programs can be generally classified according to whether
    they are CPU bound or I/O bound. **CPU bound** problems benefit from an increase
    in the number of clock cycles available for computation. Prime number calculation
    is a good example. Node.js, however, is not designed to deal with these CPU bound
    problems. Even before Node.js formally existed, Ryan Dahl proposed the following:⁶


    > “There is a strict requirement that any request calculates for at most, say,
    5ms before returning to the event loop. If you break the 5ms limit, then your
    request handler is never run again (request handlers will be tied to a certain
    path/method, I think). If your uploaded server-side JavaScript is stupid and is
    blocking (… it calculates the first 10,000 primes) then it will be killed before
    completion.


    …


    Web developers need this sort of environment where it is not possible for them
    to do stupid things. Ruby, Python, C++, [and] PHP are all terrible languages for
    web development because they allow too much freedom.”


    —Ryan Dahl


    **I/O bound** problems are alleviated by increased throughput in I/O such as disk,
    memory, and network bandwidth, and improved data caching. Many problems are I/O
    bound, and it''s in this domain that Node.js truly shines. Take, for example,
    the'
- md: "## C10K问题<sup>7</sup>\n\nC10K问题<sup>7</sup>提出了一个困境：如何为一个Web服务器处理一万个或更多的并发连接。一些技术平台在管理这种容量方面力不从心，需要各种补丁和变通方法。Node.js在处理这项任务上表现出色，因为它基于非阻塞、异步架构，专为并发设计。\n\
    \n我希望我已经激发了你的兴趣；现在是时候开始了。\n\n### 速度\n\n本书的核心项目是构建一个实时股票市场交易引擎，该引擎将实时价格流式传输到Web浏览器。更好奇的读者可能会问：“股票市场交易引擎难道不应该使用C语言等语言来构建，以获得快得惊人、令人惊叹的速度吗？”如果我们构建的是用于实际交易的股票市场引擎，我的回答是“是的”。\n\
    \n本书的主要目标是传授技能组合，而不是将实际项目移植到现实世界。存在一个狭窄的“硬”实时应用领域，例如股票交易所，因为微秒计时至关重要，所以需要专门的软件和硬件。然而，存在数量多得多的“软”实时应用，例如Facebook、Twitter和eBay，在这些应用中微秒的影响很小。这是Node.js的专长，到本书结束时，你将理解如何构建这类应用。\n\
    \n## 万事开头难\n\n让我们快速浏览一下如何安装Node.js、设置一个Web框架、构建一个基本表单页面以及连接到一个数据库。\n\n## 安装\n\n\
    可以从原始源代码安装Node.js，但使用包管理器安装要简单得多。\n\n访问 https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager\
    \ 并按照你特定发行版的说明进行操作。目前提供了Gentoo、Debian、Ubuntu、openSUSE和SLE（SUSE Linux Enterprises）、Fedora以及RHEL/CentOS的说明，以及其他几个Linux发行版。Windows和Mac\
    \ OS X的说明也可用。\n\n安装后，在命令行中键入 `node` 以启动读取-求值-打印循环（REPL）。你可以通过键入以下命令来测试你的安装：\n\n\
    ```\nconsole.log('Hello world')\n```\n\n你应该收到：\n\n```\nHello world\nundefined\n\
    ```\n\n如果你收到了，恭喜你！你刚刚写出了你的第一个Node.js程序。控制台总是打印出返回类型。这就是为什么Hello world后面跟着undefined。既然你已经编写了经典的Hello\
    \ world程序，我很高兴地通知你，它将是本书中你看到的第一个也是最后一个无聊程序。为了证明我的观点，我们现在将直接开始，构建一个使用基于云的NoSQL技术来验证用户名和密码的身份验证模块。（如果你挠着头想这意味着什么，别担心——一切很快就会揭晓！）\n\
    \n那么什么是**基于云的NoSQL**技术，你为什么要关心它？围绕基于云的技术已经有很多炒作。就我们的目的而言，云技术之所以有用，是因为它允许我们的应用程序扩展：只需点击几下鼠标，就可以启动额外的虚拟服务器。\n\
    \nNoSQL运动相对较新，因此很难得出一个关于该技术包含什么的全面定义。广义上，它可以被视为一族为处理大量非结构化和半结构化数据而构建的数据库技术。Google、Amazon和Facebook等公司广泛使用NoSQL技术来存储其用户产生的海量数据。\n\
    \n对于本书，我们将使用MongoDB作为我们的NoSQL数据库，原因将在第3章中详细阐述。MongoDB是一个成熟且可扩展的面向文档的数据库，已在企业环境中成功部署，例如foursquare和craigslist。<sup>8</sup>\
    \ **面向文档的数据库**是一种将传统数据库行替换为不太结构化的文档（如XML或JSON）的数据库。MongoDB允许临时查询，因此保留了SQL提供的大部分灵活性。我选择MongoLab<sup>9>作为我们股票监控应用的云提供商，因为它提供了一个慷慨的免费托管计划。\n\
    \n## 组装零件\n\n第一步是访问MongoLab（如图1.2所示）并注册一个账户。然后单击数据库旁边的**Create New**。将云提供商保留为Amazon\
    \ EC2，并选择免费定价计划。选择一个数据库名称、用户名和密码。\n\n现在我们将设置Web框架。Node.js提供了一个内置的、基础的HTTP服务器。在此之上是Connect，一个中间件框架，它提供了对cookie、会话、日志记录和压缩等支持。<sup>10</sup>\
    \ 在Connect之上是Express，它支持路由、模板（使用Jade模板引擎）和视图渲染。<sup>11</sup> 在整本书中，我们将主要使用Express。\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_25_0.png)\n\n可以使用以下命令安装Express：\n\n\
    ```\nsudo npm install -g express@2.5.8\n```\n\n我们使用 `-g` 开关来表示该包应全局安装，`@2.5.8`\
    \ 来表示我们将在本书中使用的版本。\n\n### 全局与本地\n\n在Node.js官方博客上，建议谨慎使用全局安装。指导原则是：如果该包需要在命令行中访问，则使用全局安装；如果需要在程序中访问，则使用本地安装。在某些情况下——例如Express，两者都需要——同时做两者是可以的。\n\
    \n可以使用此命令创建具有基本默认选项的应用程序：\n\n```\nexpress authentication\n```\n\n你应该看到类似于以下的输出：\n\
    \n```\ncreate : authentication\ncreate : authentication/package.json\n...\ndont\
    \ forget to install dependencies:\n$ cd authentication && npm install\n```\n\n\
    要解释最后一行（`$ cd authentication && npm install`），`npm install` 将根据 **package.json**\
    \ 中指定的依赖项安装包。这是一个纯文本文件，以JavaScript对象表示法指定包依赖项。对于这个项目，修改 **package.json** 以包含以下文本：\n\
    \n```\nchapter01/authentication/package.json (excerpt)\n\n{\n    \"name\": \"\
    authentication\"\n  , \"version\": \"0.0.1\"\n  , \"private\": true\n  , \"dependencies\"\
    : {\n      \"express\": \"2.5.8\"\n    , \"jade\": \"0.26.1\"\n    , \"mongoose\"\
    : \"2.6.5\"\n    }\n}\n```\n\n## 避免依赖地狱\n\n代替特定的版本号，可以指定“*”，这将从仓库检索最新版本。虽然总是使用最新版本可能很诱人，但你的应用程序与一个版本兼容，并不能保证它与下一个版本也兼容。我建议至少总是声明版本号。即使这样也不能保证正确性。如果你使用采用“*”语法的包，你会遇到类似的问题。为了一个更健壮的解决方案，我建议你研究Shrinkwrap。[^13]\n\
    \n然后可以通过切换到 **authentication** 目录（`cd authentication`）并键入 `npm install` 来安装这些依赖项。然后键入\
    \ `node app`，在浏览器中导航到 http://localhost:3000 后，你应该会看到消息“Welcome to Express”。很简单，不是吗？\n\
    \n## 基本表单\n\n下一步是创建一个基本表单，将数据发布到服务器。对于像Apache这样的Web服务器，你通常会将文件放入一个目录中，以提供给用户。Node.js故意设计得非常极简，自动完成的操作很少。如果你想从磁盘读取文件，你需要明确编程。终止你的应用程序，并在\
    \ **app.js** 的顶部添加 **fs** 依赖项以允许从文件系统读取。然后添加 **/form** 路由：\n\n```\nchapter01/authentication/app.js\
    \ (excerpt)\n\nvar express = require('express')\n  , routes = require('./routes')\n\
    \  , fs = require('fs');\n:\n// Routes\napp.get('/', routes.index);\n```\n\n[^13]\
    \ http://blog.nodejs.org/2012/02/27/managing-node-js-dependencies-with-shrinkwrap/"
