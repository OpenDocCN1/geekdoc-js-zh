  md: "# 104 Jump Start Node.js\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_122_0.png)\n\
    \nThe last undertaking is to appropriately handle user disconnections. Socket.IO\
    \ has a built-in disconnect mechanism for handling this. Add the following to\
    \ **nocklib.js**:\n\n```\nchapter05/lib/nocklib.js (excerpt)\n\nsocket.on('clientchat',\
    \ function (data) {\n  :\n});\nsocket.on('disconnect', function (data) {\n  var\
    \ username = socket.handshake.session.username;\n  var index = online.indexOf(username);\n\
    \  online.splice(index, 1); // 1\n  socket.broadcast.emit('disconnect', { username:\
    \ username}); // 2\n});\n```\n\nWhen the user disconnects we do two things.\n\n\
    +   1. First, we update the array containing all users to remove the disconnected\
    \ user. We do this by finding the index of the user, and then employing JavaScript's\
    \ built-in splice function.\n2. Second, we broadcast a 'disconnect' message to\
