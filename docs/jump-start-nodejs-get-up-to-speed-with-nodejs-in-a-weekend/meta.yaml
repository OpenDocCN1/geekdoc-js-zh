    \n## 构建交易所\n\n现在我们已经准备好了单元测试，这让我们对实现所需的内容有了相当深入的了解。让我们从交易所数据开始。这应该如何构建？直观地说，订单簿分为“买单”和“卖单”，所以这似乎是一个合乎逻辑的起点。买单和卖单两侧都有订单，每个订单都有价格和数量，因此这是另一个合理的划分。在\
    \ JSON 中，这类似于以下结构：\n\n```json\nexchangeData: {\n  buys: {prices: ..., volumes:\
