    \nThen we deploy the following to Heroku:\n\n```bash\ngit add .\ngit commit -a\
    \ -m \"Ready for production\"\ngit push heroku master\n```\n\n`push` is a git\
    \ command that will transmit your local repository to a remote location. In this\
    \ instance, we are pushing our local repository out to Heroku, at which point\
    \ it will be automatically deployed. In fact, Heroku is open-source, so you're\
    \ free to poke around the source code yourself to see how its deployment scripts\
    \ run.⁹\n\n## Idle Time\n\nBehind the scenes, Heroku runs on EC2 infrastructure.\
    \ This is not a cheap option, and so free accounts are \"spun down\" after a period\
    \ of inactivity. The first user who connects after the idle period may need to\
    \ wait a little longer while your application spins up. In practice, it's a minor\
    \ issue, since the free accounts are geared more toward prototypes and testing\
    \ rather than full-blown production systems. Paid accounts are not limited by\
    \ this restriction.\n\nIf you receive an error message such as the following:\n\
    \n```\n'heroku' does not appear to be a git repository\n```\n\n... you can add\
    \ the remote repository with this command:\n\n```bash\ngit remote add heroku git@heroku.com:mysterious-brook-2122.git\n\
    ```\n\nReplace `mysterious-brook-2122` with your application name as assigned\
    \ by Heroku.\n\nYou should now have a live system deployed on the Internet! Before\
    \ we close the final curtain, let's add a personal touch. At the moment, the address\
    \ is unfriendly. Having a personalized address is as simple as:\n\n```bash\nheroku\
    \ rename YOURNAME\n```\n\nYour website's new address should appear in the console.\
    \ Email your friends and family to let them see the wonderful piece of software\
    \ that you've built. Perhaps they'll be inspired to implement that startup idea\
    \ they've always dreamed of doing!\n\n## Summary\n\nCongratulations, you've finally\
