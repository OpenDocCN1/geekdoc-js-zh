    \n目前，`/portfolio` 路由任何人都可以访问。Express.js 提供了中间件功能，使我们能够轻松地为其扩展访问检查机制。在nocklib.js中定义以下函数：\n\
    \n```javascript\nchapter04/lib/nocklib.js (摘录)\n\n},\n\nensureAuthenticated: function\
    \ (req, res, next) {\n  if (req.session._id) {\n    return next();\n  }\n  res.redirect('/');\n\
    },\n\ngenerateRandomOrder: function(exchangeData) {\n```\n\n当用户首次登录时，我们将ID存储在会话中，这意味着我们检查\
    \ `_id` 变量是否存在。如果存在，我们就知道有一个已登录的用户，`next` 函数会告诉 Express.js 继续正常执行。如果 `_id` 不存在，我们有一个访客用户，我们将他重定向回主页。\n\
    \n在这个函数中，我们可以执行任意复杂性的检查。例如，我们不仅检查 `_id` 的存在，还可以检索整个用户配置文件，并确保在授予管理员页面访问权限之前存在管理员权限。\n\
