  md: '# About the Author


    Don began his programming career with strongly typed, object-oriented languages
    such as Java and C++. He used his engineering training to build real-time trading
    systems designed to be scalable and fault tolerant.


    While his first introduction to functional programming was somewhat of a shock
    to the system, the beauty and elegance of weakly typed dynamic languages such
    as Python and Ruby shone through. Don has programmed in a variety of web environments
    including ASP, PHP, and Python, but feels that Node.js is foremost at handling
    the modern demands of the real-time web.


    # About the Expert Reviewer


    Giovanni Ferron is a web developer currently living in Melbourne, Australia. He
    has worked for major media companies such as MTV and DMG Radio Australia, and
    co-founded the website Stereomood.com.¹ A couple of years ago, he fell in love
    with Node.js and has been spending his nights programming in JavaScript ever since.


