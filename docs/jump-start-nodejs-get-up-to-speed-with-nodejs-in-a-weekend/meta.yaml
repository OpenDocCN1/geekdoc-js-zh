    # Forms Begone


    To date, we have been handling user input either via forms or the more advanced
    Ajax. Socket.IO introduces some interesting possibilities. Why, you may ask, would
    we want to use Socket.IO for a purpose that is already served by existing technology?
    There are several reasons.


    First, it allows us to unclutter our routes. To date, we''ve been using routes
    as a glue to bind our front-end views to our back-end business logic. As applications
    become larger, the routing file inevitably becomes cluttered, no matter how well
    it''s structured. Socket.IO enables us to bypass the routing table entirely, essentially
    allowing the front-end view to communicate directly with the business logic.


    Second, Socket.IO uses a superior transport protocol. If available, it uses WebSocket,
    which incurs less overhead than XMLHttpRequest and has the added benefit of supporting
    bidirectional communication.


    Third, your application is future-proofed. It never directly deals with a specific
    protocol such as WebSocket; instead, it only uses the Socket.IO API. This means
    that whenever the next latest and greatest technology comes along, your application
    will be able to capitalize by simply upgrading the Socket.IO library. In contrast,'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# 110 Jump Start Node.js


    Ajax is tied to a specific implementation, namely XMLHttpRequest. To switch this
    across to another protocol would involve a nontrivial rewrite of code.


    > Socket.IO API Changes

    While we state that all you''ll need to do is upgrade your Socket.IO library to
    keep up to date with the latest technology, this only holds true as long as Socket.IO
    maintains its existing underlying API or architecture. Within the Node.js community,
    convention dictates that version numbers below 1.0 are considered to be betas,
    which means that end users should be prepared for API changes between versions.
    After 1.0, the product is generally more stable, and future releases tend to be
    backward-compatible.

    As of the time of writing, Socket.IO is currently at v0.9.x. The release of v1.0
    will mean that you as an end user will have considerably less concern over backward-compatibility
    compared to some of the less mature packages currently in use within the Node.js
    ecosystem.


