    \ 毫秒后执行。程序会立即继续执行，这就是为什么 `we will see` 会在 `first or second` 之前打印出来。\n\n在 Node.js\
    \ 中，一切都是异步设计的，因此只有你自己的代码才会阻塞进程。此代码示例中的第一行可以是任何 I/O 操作，包括从数据库和网络进行读写。在任何情况下，I/O\
    \ 相关操作都不会阻塞，你程序的其余部分将立即执行。这种范式起初可能会让人困惑，但一旦你开始熟悉它，你会发现它是一个非常优雅的解决方案。\n\n我们可以创建一个非常简单的\
