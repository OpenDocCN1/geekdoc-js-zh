    \ with your actual database name in the following line:\n\n```javascript\nchapter07/lib/db.js\
    \ (excerpt)\n\nvar db = new Db('nockmarket'\n```\n\nNow that we're deploying to\
    \ a web server, we must modify the Socket.IO client code to connect to the actual\
    \ web server. Modify `public/js/chat.js`:"
