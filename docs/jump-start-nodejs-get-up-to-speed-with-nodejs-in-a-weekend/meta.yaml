    ></script>\n<script type=\"text/javascript\" src=\"http://spbooks.github.com/nodejs1/bootstrap-transition.js\"\
    ></script>\n</head>\n```\n\n请注意，为了获得更好的性能，你可以合并和压缩你的 Bootstrap 文件或使用内容分发网络。² 接下来，我们为模态添加一些\
    \ HTML 代码，可以在 https://gist.github.com/3968474 找到：³\n\n² http://www.bootstrapcdn.com/\n\
