    \ {\n    if (Math.random() > 0.5)\n        order.price = exchangeData.buys.prices.peek();\n\
    \    else\n        order.price = exchangeData.sells.prices.peek();\n} else if\
    \ (buyExists) {\n    order.price = exchangeData.buys.prices.peek();\n} else {\n\
    \    order.price = exchangeData.sells.prices.peek();\n}\n\nvar shift = Math.floor(Math.random()\
    \ * priceRange / 2);\n\nif (Math.random() > 0.5) order.price += shift;\nelse order.price\
    \ -= shift;\norder.volume = Math.floor(Math.random() * volRange) + volFloor;\n\
    return order;\n}\n}\n```\n\nHere we're creating a library file, which at the moment\
    \ contains only a single function to generate a random order. The logic is fairly\
    \ simple. First, we randomly choose to buy or sell. If no data exists, we generate\
    \ a price and volume according to prespecified ranges. Otherwise, we start at\
    \ the best buy or sell price and shift the price randomly by a prespecified range\
    \ before setting the volume.\n\nAt last, we can start firing orders into the exchange.\
    \ In the root directory, place the following code into **nockmarket.js**:\n\n\
    ```\nchapter02/nockmarket.js (excerpt)\n\n'use strict';\n\nvar exchangeData =\
