  md: "The reason we return the ID instead of simply `true` is because the user ID\
    \ is a handy field that we'll utilize repeatedly. By returning it as part of the\
    \ authentication function, we can save a separate call to the database further\
    \ down the line.\n\nThe final step is to connect our library function to a route\
    \ in **nockmarket.js**:\n\n```\napp.get('/api/user/:username', nockroutes.getUser);\n\
    app.post('/login', nockroutes.login);\n```\n\nWe flesh out the body of the route\
    \ in **nockroutes.js**:\n\n```\n},\n\nlogin: function(req, res) {\n  nocklib.authenticate(req.body.username,\n\
    \    req.body.password, function(err, id) {\n      if (id) {\n        res.redirect('/portfolio');\n\
    \      }\n      else\n        res.redirect('/');\n  });\n},\n\nsignup: function(req,\
    \ res) {\n```\n\nIf the user is authenticated, we will redirect to the **/portfolio**\
    \ page. If either the user does not exist or the passwords fail to match, we'll\
    \ redirect to the home page. I'll leave it to you to redirect to a friendly error\
    \ message in the case of failed authentication. At this point, you should have\
    \ all the tools needed to accomplish this in a few lines of code.\n\nThere is\
    \ one more task to do. Once the user has logged in, how do we keep track of that\
    \ user in the future? One way is through the use of **sessions**, which is a way\
    \ of storing information about the user on the server. This is in contrast to\
    \ a cookie, which is used to store information about the user on the client device.\
    \ Note that sessions may still use an HTTP cookie to store the session token.\
    \ Therefore, cookies"
  merge: -1
  pgno: 95
- img_proc: true
  md: "are required to store the session token even though other information is handled\
    \ on the server side. We can configure Express.js with session support as follows:\n\
    \n```\nchapter04/nockmarket.js (excerpt)\n\napp.use(express.bodyParser());\napp.use(express.cookieParser());\n\
    app.use(express.session({secret: 'secretpasswordforsessions'}));\n```\n\nThis\
    \ code will add support for sessions and cookies. Then when the user logs in,\
    \ we can store the ID in the session variable. Modify **nockroutes.js** as follows:\n\
    \n```\nchapter04/routes/nockroutes.js (excerpt)\n\nif (id) {\n    req.session._id\
    \ = id;\n    res.redirect('/portfolio');\n}\n```\n\nOnce the user ID has been\
    \ stored, it can be accessed in the future using req.session._id. This will come\
    \ in handy later when we use it to protect our portfolio page. It's now time to\
    \ enable users to add stocks to their portfolios.\n\n# A Basic Portfolio\n\nWe'll\
