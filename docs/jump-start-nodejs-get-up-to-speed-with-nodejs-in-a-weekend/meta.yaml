  md: "# Jump Start Node.js\n\nmodule.exports is the Node.js syntax for exposing functions\
    \ to other modules. BUY and SELL are string constants, while buy and sell are\
    \ thin wrappers around the order function.\n\n> **Keep It DRY**\nA naive implementation\
    \ would be to write a buy function and then paste it to a sell function and change\
    \ the necessary parts. You should never do this, as it violates the principle\
    \ of **Don't Repeat Yourself (DRY)**. DRY is a programming philosophy that states\
    \ that any piece of knowledge should have only a single representation. In simple\
    \ terms, if you ever find yourself copying code from other places, there's a good\
    \ chance you have violated DRY.\n\nNote that module.exports is just a piece of\
    \ JSON. While JSON is often used to transport data, in this example we can see\
    \ that it's also used to store function definitions. This illustrates another\
    \ important principle of functional programming: functions are first-class citizens.\
    \ Anywhere that you can use a variable, you can use a function. If you start your\
    \ REPL by typing node, you'll find this is perfectly legal:\n\n```\nvar sayHello\
    \ = function() {console.log('Hi');};\nsayHello();\n```\n\n# The Logical Core\n\
    \nNow we arrive at the most intricate piece of the puzzle: order processing. Let's\
    \ add the following to our exchange.js file:\n\n```\nchapter02/lib/exchange.js\
    \ (excerpt)\n\nfunction order(orderType, price, volume, exchangeData) {\n  //\
    \ Init\n  var cloned = createExchange(exchangeData); // 1\n  var orderBook = cloned[orderType];\
    \ // 2\n  var oldVolume = orderBook.volumes[price]; // 3\n```\n\n1 We begin the\
    \ function with some initialization. First, we clone the data as explained in\
    \ the section called “The Heart of the Engine”.\n\n2 The order book of the buy\
    \ or sell transaction is then retrieved depending on orderType."
  merge: -1
  pgno: 48
- img_proc: true
  md: "Finally, we retrieve all volume at the given price. `price` is converted into\
    \ a string automatically.\n\nBecause `orderBook` is a JSON object, it can perform\
    \ near-constant time lookups, and will be extremely fast. We use `oldVolume` to\
    \ store the volume available at the specified price before processing the order.\n\
    \nNext, we determine whether a trade has occurred:\n\n```\nchapter02/lib/exchange.js\
    \ (excerpt)\n\n:\nfunction getOpposite() {\n  return (BUY == orderType) ? SELL:\
    \ BUY;\n}\nfunction isTrade() {\n  var opp = cloned[getOpposite()].prices.peek();\n\
    \  return (BUY == orderType) ? price >= opp : price <= opp;\n}\nvar trade = isTrade();\n\
    ```\n\nFirst, we set up a small helper function, `getOpposite`. If it is a buy\
    \ order, we return `SELL`, and vice versa.\n\n> **Closures**\n\nNotice how `getOpposite`\
    \ \"knows\" about `orderType`, even though `orderType` was defined externally\
    \ to that function? This is an example of a programming technique known as closures.\
    \ Even though functional programming offers no support for the concept of objects,\
    \ closures allow us to represent states. In this case, our function can use the\
    \ order type even though it's not explicitly passed in as a parameter.\n\nFollowing\
    \ this, the logic for `isTrade` is simple. First, we obtain the maximum price.\
    \ For the case of a buy order, a trade occurs when the price is greater than or\
    \ equal to the smallest sell order. For example, if there's a new buy order at\
    \ a price of $40, a trade will occur if there's any existing sell order at $40\
    \ or less. In the case of a sell order, a trade occurs when the price is less\
    \ than or equal to the largest buy order. For instance, if there's a new sell\
    \ order at a price of $40, a trade will occur if there's any existing buy order\
    \ at $40 or more. We use our added `peek` function to determine the highest or\
    \ lowest price depending on whether we're dealing with buys or sells."
