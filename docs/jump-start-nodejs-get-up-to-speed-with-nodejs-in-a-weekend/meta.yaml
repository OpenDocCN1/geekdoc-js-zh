- md: "## Directory Structures\n\nIt might seem a little convoluted to be storing\
    \ a single file in a separate directory, but as your code base grows larger, it\
    \ is necessary to group files together in a logical manner to enhance understandability\
    \ and maintainability. By convention, I put database models into a **models**\
    \ directory, and business logic and supporting functions into a **lib** directory.\n\
    \n## Summary\n\nIn this chapter, we've covered the following:\n\n- the philosophy\
    \ behind Node.js and what makes it different from other programming environments\n\
    - installing Node.js\n- executing programs from the console using the read-eval-print\
    \ loop\n- building a basic Express application\n- basic package management\n-\
    \ modularizing code and exporting functions\n- submitting data to a form\n- storing\
    \ data in MongoDB using the cloud platform from MongoLab\n\n## Chapter 2\n\n##\
    \ Let's Get Functional\n\n> “I have always wished for my computer to be as easy\
    \ to use as my telephone; my wish has come true because I can no longer figure\
    \ out how to use my telephone.”\n—Bjarne Stroustrup, creator of C++\n\n## Introduction\n\
    \nJavaScript is sometimes dismissed as a language used by developers who do a\
    \ search on the Web, grab a random script, and make a web page to perform a certain\
    \ task. In this chapter, we are going to dispel that myth once and for all. We'll\
    \ do this by building a stock exchange trading engine that's perfectly capable\
    \ of accepting orders and executing trades in a manner similar to NASDAQ or the\
    \ New York Stock Exchange. We will call our fictional exchange the nockmarket,\
    \ which is short for the Node.js stock market. Before you protest that your finance\
    \ or IT knowledge is incapable of absorbing the intricacies of such a task, rest\
    \ assured that it's simple once you break down the problem into the relevant components.\n\
    \nLet's start with a basic scenario, an empty stock exchange. Suppose you wish\
    \ to buy some Facebook stock for $40. You submit an order to the exchange to buy\
    \ 100 units of stock. As there are no sellers at this time, your order sits in\
    \ the book waiting for a matching offer as portrayed in Figure 2.1.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_0.png)\n\
    \nSuppose a second person comes along and wishes to sell 200 units of their stock\
    \ for $41. This is not quite the price you were asking for, and now both orders\
    \ are sitting in the book as shown in Figure 2.2.\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_1.png)\n\
    \nAt long last, a third person comes along wishing to sell 75 units for $40. The\
    \ price is right: 75 units will be traded at $40. Figure 2.3 shows what the order\
    \ book will look like once this transaction is completed: your remaining buy order\
    \ of 25 units at a price of $40 and the 200 untraded units belonging to person\
    \ number two at $41.\n\n**Trade, 75 @ $40**\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_2.png)\n\
    \nI trust this example is easy to follow. It comprises all the finance knowledge\
    \ you'll require to understand our example application.\n\n## Always Be Testing\n\
    \nThe next piece of the puzzle is transforming the aforementioned scenarios into\
    \ code. We will do this by following **test-driven development**. This means that\
    \ we write unit tests first, all of which will fail. We then write the implementation\
    \ until all the unit tests are working correctly.\n\nLet’s start with the simplest\
    \ possible scenario to flesh out a stock exchange API. First, we wish to buy some\
    \ stock, which suggests the existence of a buy function. In terms of its parameters,\
    \ price and volume are obvious components.\n\nTherefore, if we were buying 100\
    \ units at a price of $40, our first pass at an API might look like:\n\n```\n\
    exchange.buy(40, 100)\n```\n\nWhile this line of code may appear simple, it is\
    \ actually very close to the final product. What’s missing is the concept of **state**.\
    \ In other words, when processing an order, how do we know about all the orders\
    \ that have preceded it? There are two primary schools of thought. In **object-oriented\
    \ programming**, the state is generally stored internally to the `exchange` object.\
    \ The `exchange` object after an order differs to the `exchange` object before\
    \ an order due to a state change.\n\nIn **functional programming**, functions\
    \ generally have no side effects. This means that commonly we send inputs and\
    \ receive outputs in an **immutable** manner. The input remains unchanged and\
    \ the `exchange` object is exactly the same before and after an order. Both programming\
    \ styles are excellent paradigms, with JavaScript supporting both. For this book,\
    \ I have chosen to write code in a functional style, although object-oriented\
    \ would also have been a fine choice.\n\nProgramming in a functional style requires\
    \ that we add a third parameter to pass the state of the order book into our function.\
    \ This means that we modify the aforesaid example as follows:\n\n```\nexchange.buy(40,\
    \ 100, exchangeData)\n```\n\n`exchangeData` is an object that contains the full\
    \ state of the order book. Our function will process the order and return a new\
    \ object representing the new state of the order book.\n\nTime to translate this\
    \ into code. Throughout the book we'll use a testing framework called Mocha. Mocha\
    \ makes it easy to perform asynchronous unit tests and specifically supports the\
    \ test-driven paradigm that we've discussed. It can output results in a variety\
    \ of formats, making it easy to integrate with other testing tools.\n\nCreate\
    \ a new folder to house this chapter's project and within it create a subdirectory\
    \ called **test**. Within **test**, create a file called **exchange.test.js**\
    \ and enter the following:\n\n```\nchapter02/test/exchange.test.js (excerpt)\n\
    \ntest('buy should add a BUY nockmarket order', function(done) {\n});\n```\n\n\
    The first part of any test is to provide a plain English description of what the\
    \ test does. Therefore, even somebody completely unfamiliar with programming should\
    \ have an understanding of what the test is trying to accomplish. This way, when\
    \ unit tests fail it's easy to gain an understanding of what is failing without\
    \ having to mentally process large blocks of code.\n\nNow we can write the actual\
    \ test case:\n\n```\nchapter02/test/exchange.test.js (excerpt)\n\ntest('buy should\
    \ add a BUY nockmarket order', function(done) {\n  exchangeData = exchange.buy(40,\
    \ 100, exchangeData);  1\n  exchangeData.buys.volumes[40].should.eql(100);  2\n\
    \  done();  3\n});\n```\n\n1. First, we submit an order to the exchange using\
    \ our buy function.\n2. Then we check to see that, on the buy side, at a price\
    \ of $40 there are exactly 100 units available.\n\nshould.eql(100) may look understandable\
    \ while still mysterious. Understandable in the sense that it's evident what it\
    \ is checking for, but mysterious because it's not immediately obvious where it\
    \ comes from. Here, we're using the should.js assertion library, where you'll\
    \ find a more detailed description on the home page. I will cherry-pick a few\
    \ examples and include them here so that you can gain an understanding of the\
    \ syntax and how it should be used:\n\n```\n[].should.be.empty\n[1,2,3].should.eql([1,2,3])\n\
    user.age.should.be.within(5, 50)\n'test'.should.be.a('string')\nuser.age.should.not.be.above(100)\n\
    ```\n\nLastly, done is a callback function indicating to Mocha that we're ready\
    \ for the next test. Mocha runs **serially**, which means that each unit test\
    \ is fully completed before moving onto the next test. It's an elegant way of\
    \ handling the asynchronous nature of JavaScript. So far, we've not worried ourselves\
    \ with implementation details; we've just written the test. One of the benefits\
    \ of test-driven design is that it forces you to think more like a software architect.\
    \ When you write the tests, you imagine the API that clients might need to use\
    \ and then plan accordingly.\n\nThe sell case is analogous to the buy case:\n\n\
    ```\nchapter02/test/exchange.test.js (excerpt)\n\ntest('sell should add a SELL\
    \ nockmarket order', function(done) {\n    exchangeData = exchange.sell(41, 200,\
    \ exchangeData);\n    exchangeData.sells.volumes['41'].should.eql(200);\n    done();\n\
    });\n```\n\nFirst, we use our **sell** function to submit an order to sell 200\
    \ units at $41.\n\nThen we check to see that, on the sell side, there are 200\
    \ units available at the price of $41.\n\nTrading does involve some extra details:\n\
    \n```\nchapter02/test/exchange.test.js (excerpt)\n\ntest('sell should produce\
    \ trades', function(done) {\n    exchangeData = exchange.sell(40, 75, exchangeData);\n\
    \    exchangeData.trades[0].price.should.eql(40);\n    exchangeData.trades[0].volume.should.eql(75);\n\
    });\n```"
  mdcn: "\n## 目录结构\n\n将单个文件存储在单独的目录中可能看起来有点复杂，但随着代码库的扩大，有必要以合乎逻辑的方式将文件分组，以提高可理解性和可维护性。按照惯例，我将数据库模型放入**models**目录，将业务逻辑和支持函数放入**lib**目录。\n\
    \n## 总结\n\n在本章中，我们涵盖了以下内容：\n\n-   Node.js 背后的理念及其与其他编程环境的区别\n-   安装 Node.js\n\
    -   使用读取-求值-打印循环从控制台执行程序\n-   构建一个基本的 Express 应用程序\n-   基本的包管理\n-   模块化代码和导出函数\n\
    -   向表单提交数据\n-   使用 MongoLab 的云平台将数据存储在 MongoDB 中\n\n## 第 2 章\n\n## 让我们变得函数化\n\
    \n> “我一直希望我的电脑能像我的电话一样容易使用；我的愿望实现了，因为我再也搞不懂如何使用我的电话了。”\n—C++ 的创造者 Bjarne Stroustrup\n\
    \n## 引言\n\nJavaScript 有时被贬低为那些在网上搜索、抓取随机脚本并制作网页以执行特定任务的开发人员使用的语言。在本章中，我们将一劳永逸地消除这个误解。我们将通过构建一个股票交易引擎来实现这一点，该引擎完全有能力接受订单并以类似于纳斯达克或纽约证券交易所的方式执行交易。我们将我们虚构的交易所称为nockmarket，这是Node.js股票市场的简称。在你抗议你的金融或IT知识不足以吸收如此复杂任务的精髓之前，请放心，一旦你将问题分解为相关组件，它就很简单了。\n\
    \n让我们从一个基本场景开始，一个空的股票交易所。假设你想以40美元的价格购买一些Facebook股票。你向交易所提交订单，购买100股股票。由于此时没有卖家，你的订单就在账簿中等待匹配的报价，如图2.1所示。\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_0.png)\n\n假设第二个人来了，希望以41美元的价格卖出200股。这与你要的价格不符，现在两个订单都在账簿中，如图2.2所示。\n\
    \n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_1.png)\n\n终于，第三个人来了，希望以40美元的价格卖出75股。价格合适：将以40美元的价格交易75股。图2.3显示了此交易完成后订单簿的样子：你剩余的25股买单价格为40美元，以及第二个人未交易的200股，价格为41美元。\n\
    \n**交易，75股 @ $40**\n\n![](img/89e83b9cba99d96b087ef2fbb3e7f632_36_2.png)\n\n我相信这个例子很容易理解。它包含了理解我们的示例应用程序所需的所有金融知识。\n\
    \n## 总是测试\n\n下一个难题是将上述场景转化为代码。我们将通过**测试驱动开发**来完成。这意味着我们首先编写单元测试，所有测试都会失败。然后我们编写实现，直到所有单元测试都正确运行。\n\
    \n让我们从最简单的场景开始，以构建一个股票交易API。首先，我们希望购买一些股票，这暗示了购买函数的存在。就其参数而言，价格和数量是显而易见的组成部分。\n\
    \n因此，如果我们以40美元的价格购买100股，我们的第一版API可能如下所示：\n\n```\nexchange.buy(40, 100)\n```\n\n\
    虽然这行代码看起来很简单，但它实际上非常接近最终产品。缺少的是**状态**的概念。换句话说，当处理订单时，我们如何知道之前的所有订单？主要有两种思路。在**面向对象编程**中，状态通常存储在`exchange`对象内部。由于状态改变，订单后的`exchange`对象与订单前的`exchange`对象不同。\n\
    \n在**函数式编程**中，函数通常没有副作用。这意味着我们通常以**不可变**的方式发送输入和接收输出。输入保持不变，`exchange`对象在订单前后完全相同。这两种编程风格都是优秀的范式，JavaScript都支持。在本书中，我选择用函数式风格编写代码，尽管面向对象也是一个不错的选择。\n\
    \n以函数式风格编程要求我们添加第三个参数，将订单簿的状态传递给我们的函数。这意味着我们修改上述示例如下：\n\n```\nexchange.buy(40,\
    \ 100, exchangeData)\n```\n\n`exchangeData`是一个对象，包含订单簿的完整状态。我们的函数将处理订单，并返回一个代表订单簿新状态的新对象。\n\
    \n是时候将其转化为代码了。在整本书中，我们将使用一个名为Mocha的测试框架。Mocha使得执行异步单元测试变得容易，并特别支持我们讨论过的测试驱动范式。它可以以多种格式输出结果，使其易于与其他测试工具集成。\n\
    \n创建一个新文件夹来存放本章的项目，并在其中创建一个名为**test**的子目录。在**test**中，创建一个名为**exchange.test.js**的文件，并输入以下内容：\n\
    \n```\nchapter02/test/exchange.test.js (节选)\n\ntest('buy should add a BUY nockmarket\
    \ order', function(done) {\n});\n```\n\n任何测试的第一部分都是用通俗易懂的英语描述测试的功能。因此，即使完全不熟悉编程的人也应该能理解测试试图完成什么。这样，当单元测试失败时，无需在脑海中处理大段代码就能轻松理解失败的原因。\n\
    \n现在我们可以编写实际的测试用例：\n\n```\nchapter02/test/exchange.test.js (节选)\n\ntest('buy should\
    \ add a BUY nockmarket order', function(done) {\n  exchangeData = exchange.buy(40,\
    \ 100, exchangeData);  1\n  exchangeData.buys.volumes[40].should.eql(100);  2\n\
    \  done();  3\n});\n```\n\n1. 首先，我们使用购买函数向交易所提交订单。\n2. 然后我们检查在买方一侧，价格为40美元的股票是否恰好有100股可用。\n\
