- md: "## Jump Start Node.js\n\n```javascript\napp.get('/form', function(req, res)\
    \ { ①\n    fs.readFile('./form.html', function(error, content) { ②\n        if\
    \ (error) {\n            res.writeHead(500);\n            res.end();\n       \
    \ }\n        else {\n            res.writeHead(200, { 'Content-Type': 'text/html'\
    \ });\n            res.end(content, 'utf-8');\n        }\n    });\n});\n```\n\n\
    The above listing has several important features.\n\n- ① This line handles all\
    \ the routing to **/form**. Whenever anybody makes a request to http://localhost:3000/form,\
    \ Express captures the request and it is handled by the code within.\n- ② This\
    \ line attempts to read **form.html** from the file system and serve the HTML\
    \ file. If there's an error, a 500 response will be sent back to the browser.\n\
    \n### Callback Functions\n\nThis is the first time we've broached callback functions,\
    \ which might be tricky for those starting from other languages. As an example,\
    \ type the following into a file named **cb.js**:\n\n```javascript\nsetTimeout(function()\
    \ {console.log('first or second');}\n, 500);\nconsole.log('we will see');\n```\n\
    \nRun `node cb` and note the text order. The first line sets a timeout for a function\
    \ to be executed in 500ms. The program immediately resumes execution, which is\
    \ why `we will see` is printed before `first or second`.\n\nIn Node.js, everything\
    \ is asynchronous by design, so only your own code will block a process. The first\
    \ line in this code sample could be any I/O operation including reading and writing\
    \ from databases and networks. In every instance, nothing I/O-related will block\
    \ and the rest of your program will immediately execute. This paradigm can be\
    \ confusing at first, but you'll see it's quite an elegant solution once you start\
    \ to gain familiarity with it.\n\nWe can create a very simple **form.html** as\
    \ follows:\n\n```html\nchapter01/authentication/form.html\n\n<form action=\"/signup\"\
    \ method=\"post\">\n  <div>\n    <label>Username:</label>\n    <input type=\"\
    text\" name=\"username\"/><br/>\n  </div>\n  <div>\n    <label>Password:</label>\n\
    \    <input type=\"password\" name=\"password\"/>\n  </div>\n  <div><input type=\"\
    submit\" value=\"Sign Up\"/></div>\n</form>\n```\n\nWhen you visit http://localhost:3000/form,\
    \ you should see your form rendered in the page as in Figure 1.3.\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_29_0.png)\n\
    \nNot quite what you imagined Web 2.0 to look like? Never mind, we'll cover styling\
    \ your page in a subsequent chapter. There's enough to absorb at the moment without\
    \ concerning yourself with how to make your elements shine on the page.\n\nWhen\
    \ a user clicks on the **Sign Up** button, the form data will be posted to `/signup`.\
    \ We'll now set up a handler in Express to process the form data. Copy the following\
    \ code into **app.js** where you left off:\n\n```javascript\nchapter01/authentication/app.js\
    \ (excerpt)\n\napp.post('/signup', function(req, res) {\n  var username = req.body.username;\n\
    \  var password = req.body.password;\n  User.addUser(username, password, function(err,\
    \ user) {\n    if (err) throw err;\n    res.redirect('/form');\n  });\n});\n```\n\
    \nThe first line of this code listing is similar to what we've seen before except\
    \ that `app.get` is replaced with `app.post`. The next two lines extract the username\
    \ and password from the request object. The next line `User.addUser(username,\
    \ password, function(err, user)` looks a little mysterious. Where does `User`\
    \ come from? It comes from the users module, which we'll create shortly. Node.js\
    \ comes with an excellent module system that allows the programmer to encapsulate\
    \ functions. Separation of concerns is a core programming principle for managing\
    \ complexity, and Node.js makes it easy to write modules that perform specific,\
    \ well-defined tasks. After adding the user, we redirect back to the form page.\n\
    \n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_30_0.png)\n\n### Real-world Development\n\
    \nIn the real world, Express provides a lot of useful abstractions. This means\
    \ that in future it won't be necessary to read files from the disk in the manner\
    \ we are now. Note also that, by default, Node.js does not support \"hot swapping\"\
    \ of code, meaning that changes are only reflected when you restart Node.js. This\
    \ can become tedious after a while, so I suggest at some point you install `node-supervisor`\
    \ to automatically restart the system upon changes to the file.¹⁴\n\n## The Database\n\
    \nIn order to create a users module, we'll need to write a database module. Place\
    \ the following code into a file called **db.js** in a directory called **lib**:\n\
    \n```javascript\n// chapter01/authentication/lib/db.js\nvar mongoose = require('mongoose');\n\
    var Schema = mongoose.Schema;\n\nmodule.exports.mongoose = mongoose;\nmodule.exports.Schema\
    \ = Schema;\n\n// Connect to cloud database\nvar username = \"user\"\nvar password\
    \ = \"password\";\nvar address = ' @dbh42.mongolab.com:27427/nockmarket';\nconnect();\n\
    \n// Connect to mongo\nfunction connect() {\n  var url = 'mongodb://' + username\
    \ + ':' + password + address;\n  mongoose.connect(url);\n}\nfunction disconnect()\
    \ {mongoose.disconnect()}}\n```\n\nIt is surprisingly simple to connect to a cloud-based\
    \ NoSQL provider. You will need to replace `username`, `password`, and `address`\
    \ with your own personal details. For example, `var username = \"user\"` might\
    \ become `var username = \"bob927\"`. MongoLab provides a user tab for adding\
    \ new users, seen in Figure 1.4.\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_31_0.png)\n\
    \nFigure 1.5 shows where you can obtain the database address.\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_31_1.png)\n\
    \nWe will use the Mongoose package, which allows a connection from Node.js to\
    \ MongoDB. `module.exports` is the Node.js syntax for exposing functions and variables\
    \ to other modules. We will expose the Mongoose driver as well as the Mongoose\
    \ Schema object. A **schema** is simply a way to define the structure of a collection.\
    \ In this case, our schema consists of a username string and a password string.\
    \ Other than that, we define functions to connect and disconnect from the database.\n\
    \nThe next step is to define the user module. Place this code in a file called\
    \ **User.js** in a directory called **models**:\n\n```javascript\nchapter01/authentication/models/User.js\
    \ (excerpt)\n\nvar db = require('../lib/db');\n\nvar UserSchema = new db.Schema({\n\
    \    username : {type: String, unique: true}\n    , password : String\n})\n\n\
    var MyUser = db.mongoose.model('User', UserSchema);\n\n// Exports\nmodule.exports.addUser\
    \ = addUser;\n\n// Add user to database\nfunction addUser(username, password,\
    \ callback) {\n    var instance = new MyUser();\n    instance.username = username;\n\
    \    instance.password = password;\n    instance.save(function (err) {\n     \
    \   if (err) {\n            callback(err);\n        }\n        else {\n      \
    \      callback(null, instance);\n        }\n    });\n}\n```\n\nWe begin by importing\
    \ our previously defined database module and defining a simple schema. We can\
    \ then instantiate a new user, set the username and password, and save to the\
    \ database using the **save** function. If there's an error, we send it to the\
    \ callback function. Otherwise, we send back the actual user object.\n\n### Password\
    \ Security\n\nIn this example, we store the raw password in the database, which\
    \ presents a security risk. Normally, the password would be encrypted. There are\
    \ other secure techniques based on salting the encrypted password to make it more\
    \ resistant to dictionary attack.\n\nWe are now ready to integrate our user module\
    \ with Express. This involves adding one additional line of import code to our\
    \ **app.js** file:\n\n```javascript\nvar express = require('express')\n, routes\
    \ = require('./routes')\n, fs = require('fs')\n, User = require('./models/User.js');\n\
    ```\n\nNow if you restart your app and submit your form, you should see the data\
    \ appear in MongoLab, as in Figure 1.6.\n\n![图片](img/89e83b9cba99d96b087ef2fbb3e7f632_33_0.png)\n\
    \nNote that the collection “users” (which can loosely be thought of as a table)\
    \ was created automatically. That’s all there is to building your very first cloud-enabled\
    \ NoSQL solution. If your next project begins to take on the popularity of Facebook\
    \ or Twitter, your infrastructure will be ready to scale!\n\n¹⁴ [https://github.com/isaacs/node-supervisor](https://github.com/isaacs/node-supervisor)"
