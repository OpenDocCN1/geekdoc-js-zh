    \ solution to managing client-side code that will scale to a larger code base\
    \ as needed.\n\n# Models, Views, Controllers, and Backbone.js\n\nA comprehensive\
    \ treatment of MVC and Backbone is a book in and of itself. For the uninitiated,\
    \ there’s no need to fret; this chapter’s designed to be followed by those new\
