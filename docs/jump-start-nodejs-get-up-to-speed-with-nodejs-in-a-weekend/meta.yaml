  md: "# Object IDs\n\nAn Object ID is a field internally generated by MongoDB for\
    \ every document in a collection. It is unique even across multiple machines.\
    \ One handy feature is that the field contains an embedded date, so if you wish\
    \ to know the creation date, a separate field is unnecessary.\n\nTo test our find\
    \ function, we compare our randomly generated order to the order that has just\
    \ been inserted into the database. We have found a successful match if price and\
    \ volume are the same in the randomly generated order as they are in the newly\
    \ inserted order:\n\n```\norder.price.should.eql(insertedOrder.price);\norder.volume.should.eql(insertedOrder.volume);\n\
    ```\n\n# Naming Your Fields\n\nI encourage using expressive variable names. However,\
    \ one particular quirk of MongoDB is that field names are repeated uncompressed\
    \ in every single document. This means that if you have one million customer records\
    \ with a field named `isCustomerEligibleForDiscount`, that field name is repeated\
    \ a million times. Because there's no name compression, it's considered best practice\
    \ to use shorter field names for collections that contain a large number of documents.\
    \ Some companies use only one- to two-character field names in their collections.\n\
    \n# Creating the Wrapper\n\nUsing the native driver directly in an application\
    \ can be excessively verbose. That's why we'll create a thin wrapper around the\
    \ native driver to abstract away some of the low-level details. First, we'll import\
    \ some modules and run some setup code. Place the following into **lib/db.js**:\n\
    \n```\nvar Db = require('mongodb').Db\n  ,Connection = require('mongodb').Connection\n\
    \  ,Server = require('mongodb').Server;\n\nvar envHost = process.env['MONGO_NODE_DRIVER_HOST']\n\
    \  ,envPort = process.env['MONGO_NODE_DRIVER_PORT']\n```"
