  - '[PAGE 37]


    unit tests first, all of which will fail. We then write the implementation until
    all the unit tests are working correctly.


    Let’s start with the simplest possible scenario to flesh out a stock exchange
    API. First, we wish to buy some stock, which suggests the existence of a buy function.
    In terms of its parameters, price and volume are obvious components.


    Therefore, if we were buying 100 units at a price of $40, our first pass at an
    API might look like:


    ```

    exchange.buy(40, 100)

    ```


    While this line of code may appear simple, it is actually very close to the final
    product. What’s missing is the concept of **state**. In other words, when processing
    an order, how do we know about all the orders that have preceded it? There are
    two primary schools of thought. In **object-oriented programming**, the state
    is generally stored internally to the `exchange` object. The `exchange` object
    after an order differs to the `exchange` object before an order due to a state
    change.


    In **functional programming**, functions generally have no side effects. This
    means that commonly we send inputs and receive outputs in an **immutable** manner.
    The input remains unchanged and the `exchange` object is exactly the same before
    and after an order. Both programming styles are excellent paradigms, with JavaScript
    supporting both. For this book, I have chosen to write code in a functional style,
    although object-oriented would also have been a fine choice.


    Programming in a functional style requires that we add a third parameter to pass
    the state of the order book into our function. This means that we modify the aforesaid
    example as follows:


    ```

    exchange.buy(40, 100, exchangeData)

    ```


    `exchangeData` is an object that contains the full state of the order book. Our
    function will process the order and return a new object representing the new state
    of the order book.'
