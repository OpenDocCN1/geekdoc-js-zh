    the code from https://gist.github.com/3949967.


    > **Alternative Client-side Templates**

    Another common way to embed client-side templates is to put your template inside
    your main HTML page within <script type = "text/template"></script> tags. In this
    case, we have a peculiar scenario because we’re using the same templating syntax
    on both the server and the client. This presents an interesting challenge, because
    the server will throw an error as it tries to interpret the client-side tags.
    There are various workarounds you could use, such as changing template settings
    to using an alternative syntax. I will leave this for the curious reader to explore
    as an exercise.


    It’s a slightly unwieldy block of code that would have maintenance issues were
    we to embed it inside a JavaScript file. A dedicated template allows separation
    of presentation and business logic. If the size of the code appears intimidating,
    broken down it’s just a series of HTML td tags with some ids thrown in. It’s a
    slightly more elaborate version of the mockup we wrote in the section called “Sneak
    Preview”. To complete the HTML side, add a small annotation in **portfolio.ejs**
    as follows:'
