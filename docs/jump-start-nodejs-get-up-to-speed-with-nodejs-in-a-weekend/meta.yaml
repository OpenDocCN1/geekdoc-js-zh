    var sayHello = function() {console.log('Hi');};\nsayHello();\n```\n\n## The Logical\
    \ Core\n\nNow we arrive at the most intricate piece of the puzzle: order processing.\
    \ Let's add the following to our exchange.js file:\n\n```javascript\nchapter02/lib/exchange.js\
