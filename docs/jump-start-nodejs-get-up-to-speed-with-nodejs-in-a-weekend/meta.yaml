    Congratulations, you have now mastered the basics of using MongoDB with Node.js.
    You now know how to insert and extract arbitrary JSON from MongoDB. You can construct
    a REST API that can be consumed by both internal and external clients. Finally,
    you have explored one way of presenting this data to end users.


    # # Summary


    In this chapter, we have covered the following:


    +   - an introduction to MongoDB and what differentiates it from traditional relational
    database technology

    - MongoDB installation and an overview of the two main drivers

    - basic inserting, finding, and sorting

    - using the native process object and http module

    - using map to transform collections

    - building a REST API

    - presenting JSON data to the user'
