    \        callback(err, null);\n    });\n  },\n  ...\n```\n\n+   1. Here we retrieve\
    \ the user from the database. First we check whether the user exists, and then\
    \ that the given password matches the encrypted password in the database.\n2.\
    \ If there is a match, we return the ID.\n3. Otherwise we return null."
  - "[PAGE 95]\n\nThe reason we return the ID instead of simply `true` is because\
    \ the user ID is a handy field that we'll utilize repeatedly. By returning it\
