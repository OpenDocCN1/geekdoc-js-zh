  md: "```\n}\n```\n\n+   1. First, we need to test for the edge case where the incoming\
    \ order volume matches the existing order volume exactly.\n2. In this case, the\
    \ two orders will cancel each other out, so there's no need to store a new price.\n\
    3. Then, we generate the trade and push it into the **trades** array.\n4. We adjust\
    \ the volume by subtracting the entire amount of the volume on the opposite side.\
    \ By way of example, if we had 100 units at $40 and a sell order came in for 130\
    \ units at $40, we would have 30 units remaining (130 - 100).\n5. We then \"pop\"\
    \ the price from the opposite side as it has been removed by the incoming order.\n\
    6. Similarly, we delete volume information from the opposite side.\n\nMost of\
    \ the hard work is done. Now we just need to clean up and return the data:\n\n\
    ```\nchapter02/lib/exchange.js (excerpt)\n    :\n    if (!oldVolume && storePrice)\n\
