  md: "70 Jump Start Node.js\n\n> **Robust Password Security**\n\nMD5 is generally\
    \ considered a weak mechanism for storing passwords in production. bcrypt is a\
    \ more secure alternative because it takes a lot longer to attack by brute force.⁶\
    \ As you've come to expect, there is a package available for handling bcrypt encryption.⁷\
    \ Because password functionality is encapsulated in a single function, it's easy\
    \ to experiment with different hashing algorithms if you so desire.\n\nNow let's\
    \ write a function to access user data and import it into the database:\n\n```\n\
    chapter04/lib/nocklib.js (excerpt)\n\nmodule.exports = {\n  createUser: function(username,\
    \ email, password, callback) {\n    var user = {username: username, email: email\n\
    \      , password: encryptPassword(password)};\n    db.insertOne('users', user,\
    \ callback);\n  },\n\n  generateRandomOrder: function(exchangeData) {\n```\n\n\
    Here we take the raw form inputs and construct a JSON object to represent the\
    \ user. We never store the plain-text password; it is inserted into the database\
    \ encrypted:\n\n```\npassword: encryptPassword(password)\n```\n\nFinally, we use\
    \ our `insertOne` function to insert a new user. This is almost identical to the\
    \ way we insert new transactions. The only change is that we use a different collection\
    \ name: `users` instead of `transactions`. We now need to add a route to **nockmarket.js**\
    \ in order to accept form submissions from the browser:\n\n```\nchapter04/nockmarket.js\
    \ (excerpt)\n\napp.get('/', nockroutes.getIndex);\napp.post('/signup', nockroutes.signup);\n\
    ```\n\nAll we do here is define the route. The remainder of the routing code goes\
    \ into **nockroutes.js**:\n\n⁶ http://codahale.com/how-to-safely-store-a-password/\n\
    ⁷ https://github.com/ncb000gt/node.bcrypt.js"
