  md: "# Password Protection\n\nAt the moment, the /portfolio route can be accessed\
    \ by anybody. Express.js provides middleware functionality, which allows us to\
    \ easily extend it with an access-checking mechanism. Define the following function\
    \ in nocklib.js:\n\n```\nchapter04/lib/nocklib.js (excerpt)\n\n},\n\nensureAuthenticated:\
    \ function (req, res, next) {\n  if (req.session._id) {\n    return next();\n\
    \  }\n  res.redirect('/');\n},\n\ngenerateRandomOrder: function(exchangeData)\
    \ {\n```\n\nWhen the user first logs in, we store the ID in the session, which\
    \ means that we check if the _id variable exists. If so, we know that we have\
    \ a logged-in user and the next function tells Express.js to proceed as normal.\
    \ If _id does not exist, we have a guest user whom we redirect back to the home\
    \ page.\n\nIn this function, we can perform checks of arbitrary complexity. For\
    \ example, rather than just checking for the existence of _id, we could retrieve\
    \ the entire user profile and ensure that administrator rights exist before giving\
    \ access to admin pages.\n\nProtecting the page is now ridiculously easy:\n\n\
    ```\nchapter04/nockmarket.js (excerpt)\n\napp.get('/portfolio', nocklib.ensureAuthenticated,\n\
    \  nockroutes.portfolio);\n```\n\nNote how nocklib.ensureAuthenticated appears\
    \ to have been inserted into the middle of get. This feature of Express.js allows\
    \ it to be extensible and flexible. Now if you try to access /portfolio without\
    \ being signed in, you will be redirected to the home page."
