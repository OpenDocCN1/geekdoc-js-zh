    \      }\n      else\n        res.redirect('/');\n  });\n},\n\nsignup: function(req,\
    \ res) {\n```\n\n如果用户通过身份验证，我们将重定向到 **/portfolio** 页面。如果用户不存在或密码不匹配，我们将重定向到主页。至于在身份验证失败时重定向到一个友好的错误消息，我将把它留给你来实现。此时，你应该已经具备了用几行代码完成此功能的所有工具。\n\
    \n还有一项任务需要完成。一旦用户登录，我们如何在将来跟踪该用户？一种方法是使用 **sessions**，这是一种在服务器上存储用户信息的方式。这与 cookie\
    \ 不同，cookie 用于在客户端设备上存储用户信息。请注意，session 可能仍会使用 HTTP cookie 来存储会话令牌。因此，即使其他信息在服务器端处理，存储会话令牌仍需要\
    \ cookie。我们可以如下配置支持 session 的 Express.js：\n\n## chapter04/nockmarket.js (摘录)\n\
    \n```javascript\napp.use(express.bodyParser());\napp.use(express.cookieParser());\n\
    app.use(express.session({secret: 'secretpasswordforsessions'}));\n```\n\n这段代码将添加对\
    \ sessions 和 cookies 的支持。然后当用户登录时，我们可以将用户 ID 存储在 session 变量中。如下修改 **nockroutes.js**：\n\
    \n## chapter04/routes/nockroutes.js (摘录)\n\n```javascript\nif (id) {\n    req.session._id\
