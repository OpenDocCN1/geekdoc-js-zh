  md: "```\nchapter02/lib/exchange.js (excerpt)\n\n:\nif (bestOppVol > remainingVolume)\
    \ {\n  cloned.trades.push({price:bestOppPrice\n    , volume:remainingVolume});\
    \ ❶\n  oppBook.volumes[bestOppPrice] =\n    oppBook.volumes[bestOppPrice] - remainingVolume;\
    \ ❷\n  remainingVolume = 0; ❸\n  storePrice = false; ❹\n}\n```\n\nIn this case,\
    \ several things happen:\n\n+   ❶ There is a trade at the prevailing base price,\
    \ so we create a trade object in JSON format and add it to the trades array.\n\
    \n❷ From the existing volume, we subtract the order volume.\n\n❸ The submitted\
    \ order is completely filled, so the volume is set back to zero.\n\n❹ Lastly,\
    \ the order is small enough for there to be zero price impact. Therefore, we set\
    \ a Boolean so that we know that no prices need to be changed later.\n\nIn the\
    \ second case, the order is large enough to remove at least one level on the opposite\
    \ side. This means any sell order of 100 units or more in our example, which will\
    \ completely consume the buy order of 100 units at $40, leaving 0 units remaining:\n\
    \n```\nchapter02/lib/exchange.js (excerpt)\n\n:\nelse {\n  if (bestOppVol == remainingVolume)\
    \ ❶\n    storePrice = false; ❷\n  cloned.trades.push(\n    {price:bestOppPrice\n\
    \    , volume:oppBook.volumes[bestOppPrice]}); ❸\n  remainingVolume =\n    remainingVolume\
    \ - oppBook.volumes[bestOppPrice]; ❹\n  // Pop the best price from the heap\n\
    \  oppBook.prices.pop(); ❺\n  delete oppBook.volumes[bestOppPrice]; ❻\n}\n```"
