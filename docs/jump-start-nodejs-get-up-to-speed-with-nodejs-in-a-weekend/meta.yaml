- md: "# What about the real thing?\n\nI’m sure that some of you by now are wondering\
    \ about real stock-market prices. Stock-market data is among the most interesting\
    \ data in the world; unfortunately, the more interesting the data, the more expensive\
    \ it is to access.\n\nThe freely available data that we’re going to use is fairly\
    \ pedestrian from both a finance and technology perspective. It’s delayed data\
    \ that contains only trade prices with no volume and no order information available.\
    \ The example we’ve been building in this chapter, while simplified, still attempts\
    \ to capture some of the richness of real-world markets. This leads to much more\
    \ interesting learning opportunities, as we shall see in later chapters.\n\nTo\
    \ prove how easy it is, we’ll write a small module to retrieve real stock-market\
    \ prices to finish off the chapter. The entire module can be written in 20 lines\
    \ and is simple enough to analyze in one chunk. In the root directory, place the\
    \ following into priceFeed.js:\n\n```javascript\nchapter02/priceFeed.js\nvar http\
    \ = require('http');\nvar options = {\n    host: 'download.finance.yahoo.com',\n\
    \    port: 80,\n    path: '/d/quotes.csv?s=AAPL,FB,GOOG,MSFT&f=sl1c1d1&e=.csv'\n\
    };\nhttp.get(options, function(res) {\n    var data = '';\n    res.on('data',\
    \ function(chunk) {\n        data += chunk.toString();\n    })\n    .on('error',\
    \ function(err) {\n        console.err('Error retrieving Yahoo stock prices');\n\
    \        throw err;\n    })\n    .on('end', function() {\n        console.log(data);\n\
    \    });\n});\n```\n\nFirst, we use the built-in http module. `options` is a JSON\
    \ object, which we use to specify host, port, and path. When we receive a data\
    \ event, we convert from raw bytes to a string as follows:\n\n```javascript\n\
    res.on('data', function(chunk) {\n  data += chunk.toString();\n})\n```\n\nIf there\
    \ is an error, we print the message and then throw the error. Finally, 'end' indicates\
    \ that all the data has been received, at which point we print the prices. On\
    \ running the code (`node priceFeed.js`), you should receive rows of stock prices\
    \ similar to the following:\n\n```\n\"AAPL\",582.10,+4.43,\"6/22/2012\"\n```\n\
    \nWe'll make more use of this data in subsequent chapters, but that's all for\
    \ now.\n\n## Summary\n\nIn this chapter, you've learned the following:\n\n- an\
    \ introduction to test-driven development and basic should.js usage\n- how to\
    \ use the popular client-side jQuery library on the server\n- how to employ module.exports\
    \ and require to modularize your code\n- setTimeout as an example of asynchronous\
    \ programming\n- first-class functions, functions within functions, and closures\n\
    - how server-side JavaScript can be used in conjunction with classical computer-science\
    \ data structures and algorithms to build powerful programs\n- implementing business\
    \ logic—such as stock-exchange trading rules—in JavaScript\n- how to use the native\
    \ http module to retrieve real stock prices from Yahoo\n\n# Chapter 3\n\n## Persistence\
    \ Pays\n\n> “Beware of bugs in the above code; I have only proved it correct,\
    \ not tried it.”\n—Donald E. Knuth\n\n## Why MongoDB?\n\nIn this chapter, we'll\
    \ learn to use MongoDB. MongoDB is a particular type of NoSQL database; specifically,\
    \ it's a document-oriented database system. The Node.js ecosystem has excellent\
    \ support for many popular relational database systems such as PostgreSQL and\
    \ MySQL. Relational databases are robust and time-tested, and would adequately\
    \ serve the needs of many modern-day web applications. So why are we using MongoDB?\
    \ Let's now go over some of the main features of MongoDB to answer this question.\n\
    \nOne of the most prominent features about MongoDB is that it is document-oriented\
    \ and schema-free. The document referred to in **document-oriented** is a BSON\
    \ document. This stands for Binary JSON,¹ which is conceptually similar to a JSON\
    \ object in JavaScript. **Schema-free** means that there's no predefined structure.\
    \ A simple way to consider MongoDB is as a giant array of JSON objects with fast\
    \ and powerful insertion and searching capabilities.\n\nTo a relational database\
    \ purist, the concept of a schema-free database might be alien. However, there\
    \ are certain use cases where MongoDB offers advantages over its relational counterpart.\n\
    \nFirst of all, it's well-suited to iterative development. Imagine we have a `Person`\
    \ table and we wish to add a list of favorite movies. In a relational world, this\
    \ would require an additional `Movie` table, and a joining table to store the\
    \ relationships. In MongoDB, this could be done by simply adding an array of movies\
    \ to the `Person` table, depending on the requirements. For a startup company\
    \ with rapidly changing needs and an engineering team at capacity, the agility\
    \ of MongoDB plays an important role.\n\nMongoDB is also appropriate for unstructured\
    \ data. In the world of finance, the derivative is a complex instrument; there\
    \ are thousands of types (for example, futures, options, and swaps), each with\
    \ unique properties. Capturing this in a relational database would pose a number\
    \ of challenges, but using MongoDB it's as simple as representing the derivative\
    \ in JSON and inserting it into the database. The derivatives can be of arbitrary\
    \ complexity and sit side by side in a MongoDB collection.\n\nFurthermore, MongoDB\
    \ was designed from the ground up for big data, which is supported through a mechanism\
    \ known as **sharding**. The conventional book form of the Yellow Pages² is a\
    \ simple example, where it is typically divided into two shards, A-K and L-Z.\
    \ Searching is faster because you simply choose the appropriate shard—a smaller\
    \ volume of data. Conceptually, this is how sharding works with databases, though\
    \ implementation is more complex.\n\nOther use cases for MongoDB are discussed\
    \ in detail on the official site.³ In addition, MongoDB is quickly becoming the\
    \ de facto database for Node.js. Jason Hoffman, founder of Joyent, has given a\
    \ presentation on Node.js and MongoDB as a modern stack for the real-time web,⁴\
    \ replacing the traditional LAMP (Linux, Apache, MySQL, PHP) stack. Once you begin\
    \ building real-world projects, it's inevitable you will encounter MongoDB and\
    \ use the skills acquired from this book.\n\n¹ http://bsonspec.org/\n² http://www.yellowpages.com/\n\
    ³ http://www.mongodb.org/display/DOCS/Use+Cases\n⁴ http://www.10gen.com/presentations/mongosf-2012/n2m-nodejs-and-mongodb-as-the-modern-stack-for-the-real-time-web\n\
    \n## Installation\n\nWe will switch from hosted MongoDB to a locally installed\
    \ version. Installation is simple, and you can obtain the latest version from\
    \ the following address: http://www.mongodb.org/downloads. Once you have the link\
    \ for your specific platform, download and decompress the archive.\n\nThe following\
    \ instructions work for Debian and Ubuntu systems. For other platforms, you can\
    \ refer to the official documentation.⁵ Your commands should resemble the following:\n\
    \n```bash\nwget http://fastdl.mongodb.org/linux/mongodb-linux-x86_64-2.0.6.tgz\n\
    \ntar -xzvf mongodb-linux-x86_64-2.0.6.tgz\n```\n\nThe only piece of configuration\
    \ you have to do is to create `/data/db` as follows:\n\n```bash\nsudo mkdir /data\n\
    \nsudo mkdir /data/db\n```\n\nThe last step is running the MongoDB daemon:\n\n\
    ```bash\nsudo mongodb-linux-x86_64-2.0.6/bin/mongod\n```\n\nIf everything is successful,\
    \ you should see the following (or similar) in the console:\n\n```\n:\n[initandlisten]\
    \ waiting for connections on port 27017\n[websvr] admin web console waiting for\
    \ connections on port 28017\n```\n\n⁵ http://www.mongodb.org/display/DOCS/Quickstart/\n\
    \n## Choosing the Driver\n\nThere are many MongoDB modules available for Node.js.\
    \ The two most popular solutions are Mongoose and the native driver.\n\nMongoose\
    \ is an object-to-document mapper, and was introduced briefly in Chapter 1. It\
    \ provides a way of specifying schemas in Node.js, which are then translated into\
    \ MongoDB BSON documents, and abstracts some of the lower-level implementation\
    \ details. There is an advantage because the abstraction allows for rapid application\
    \ development. The trade-off is decreased performance in certain situations due\
    \ to all the wizardry happening behind the scenes.\n\nThe other option is the\
    \ native driver, which is the officially supported driver from 10gen, the company\
    \ behind MongoDB. The native driver forces you to deal with lower-level operations\
    \ such as opening asynchronous database connections. You also need to determine\
    \ how schemas should be handled at the application level.\n\nThere is a close\
    \ correspondence between MongoDB operations and native driver operations, relieving\
    \ developers of needing to learn too many idiosyncratic features. Additionally,\
    \ it offers the best performance, as mentioned. Both drivers are excellent choices,\
    \ but we'll use the native driver for the remainder of this book. Once you understand\
    \ the basics of the native driver, it is relatively simple to switch across to\
    \ Mongoose if this is a better fit for your business requirements.\n\n## A Quick\
    \ Test\n\nOur first objective for this chapter is to write a module that can:\n\
    \n- connect to MongoDB\n- insert a business transaction\n- retrieve a transaction\n\
    \nLet's begin the chapter with some unit tests, and extend what we built in the\
    \ previous chapter. All the following instructions should be executed in the same\
    \ directory that you've been using thus far. Place the following code into `test/db.test.js`:\n\
    \n```javascript\nchapter03/test/db.test.js (excerpt)\n\n'use strict';\n\nvar assert\
    \ = require('assert')\n  , db = require('../lib/db')\n  , nocklib = require('../lib/nocklib')\n\
    \  , should = require('should');\n```"
  mdcn: "\n# 那么真实情况如何呢？\n\n我相信你们中有些人现在正在思考真实的股票市场价格。股票市场数据是世界上最有趣的数据之一；不幸的是，数据越有趣，获取它的成本就越高。\n\
    \n我们将要使用的免费数据，从金融和技术的角度来看都相当普通。这是延迟数据，只包含交易价格，没有交易量，也没有订单信息。本章中我们一直在构建的示例，虽然经过简化，但仍然试图捕捉真实世界市场的一些丰富性。正如我们将在后续章节中看到的，这带来了更有趣的学习机会。\n\
    \n为了证明这有多容易，我们将编写一个小模块来获取真实的股票市场价格，以结束本章。整个模块可以用20行代码编写，足够简单，可以一次性分析。在根目录中，将以下内容放入`priceFeed.js`：\n\
    \n```javascript\nchapter02/priceFeed.js\nvar http = require('http');\nvar options\
    \ = {\n    host: 'download.finance.yahoo.com',\n    port: 80,\n    path: '/d/quotes.csv?s=AAPL,FB,GOOG,MSFT&f=sl1c1d1&e=.csv'\n\
    };\nhttp.get(options, function(res) {\n    var data = '';\n    res.on('data',\
    \ function(chunk) {\n        data += chunk.toString();\n    })\n    .on('error',\
    \ function(err) {\n        console.err('Error retrieving Yahoo stock prices');\n\
    \        throw err;\n    })\n    .on('end', function() {\n        console.log(data);\n\
    \    });\n});\n```\n\n首先，我们使用内置的http模块。`options`是一个JSON对象，我们用它来指定主机、端口和路径。当我们接收到数据事件时，我们按如下方式从原始字节转换为字符串：\n\
    \n```javascript\nres.on('data', function(chunk) {\n  data += chunk.toString();\n\
    })\n```\n\n如果出现错误，我们打印消息然后抛出错误。最后，'end'表示所有数据都已接收，此时我们打印价格。运行代码（`node priceFeed.js`）后，你应该会收到类似以下内容的股票价格行：\n\
    \n```\n\"AAPL\",582.10,+4.43,\"6/22/2012\"\n```\n\n我们将在后续章节中更多地使用这些数据，但目前就到这里。\n\
    \n## 总结\n\n在本章中，你学到了以下内容：\n\n-   测试驱动开发介绍和基本should.js用法\n-   如何在服务器端使用流行的客户端jQuery库\n\
    -   如何使用module.exports和require来模块化你的代码\n-   以setTimeout为例的异等编程\n-   一等函数、函数内函数和闭包\n\
    -   服务器端JavaScript如何与经典的计算机科学数据结构和算法结合使用以构建强大的程序\n-   用JavaScript实现业务逻辑——例如股票交易规则\n\
    -   如何使用原生http模块从Yahoo获取真实的股票价格\n\n# 第3章\n\n## 坚持有回报\n\n> “警惕上面代码中的错误；我只证明了它是正确的，但还没试过。”\n\
    —高德纳\n\n## 为什么选择MongoDB？\n\n在本章中，我们将学习使用MongoDB。MongoDB是一种特定类型的NoSQL数据库；具体来说，它是一个面向文档的数据库系统。Node.js生态系统对许多流行的关系统数据库系统（如PostgreSQL和MySQL）有出色的支持。关系数据库稳健且久经考验，足以满足许多现代Web应用程序的需求。那么我们为什么使用MongoDB呢？现在让我们概述一些MongoDB的主要特性来回答这个问题。\n\
    \nMongoDB最显著的特征之一是它是面向文档且无模式的。**面向文档**中提到的文档是BSON文档。这代表二进制JSON¹，在概念上类似于JavaScript中的JSON对象。**无模式**意味着没有预定义的结构。理解MongoDB的一个简单方法是把它看作一个巨大的JSON对象数组，具有快速而强大的插入和搜索能力。\n\
    \n对于关系数据库纯粹主义者来说，无模式数据库的概念可能很陌生。然而，在某些用例中，MongoDB比其关系对应产品具有优势。\n\n首先，它非常适合迭代开发。想象我们有一个`Person`表，并希望添加一个喜欢的电影列表。在关系数据库世界中，这需要一个额外的`Movie`表，以及一个存储关系的连接表。在MongoDB中，根据需求，这可以通过简单地向`Person`表添加一个电影数组来完成。对于需求快速变化且工程团队满负荷工作的初创公司来说，MongoDB的敏捷性起着重要作用。\n\
    \nMongoDB也适用于非结构化数据。在金融世界中，衍生品是一种复杂的工具；有数千种类型（例如期货、期权和掉期），每种都有独特的属性。在关系数据库中捕获这一点会带来许多挑战，但使用MongoDB则像用JSON表示衍生品并将其插入数据库一样简单。衍生品可以是任意复杂的，并排存在于MongoDB集合中。\n\
    \n此外，MongoDB从一开始就为大数据设计，这通过一种称为**分片**的机制来支持。传统的黄页²书籍形式是一个简单的例子，它通常被分为两个分片，A-K和L-Z。搜索更快，因为你只需选择适当的分片——一个更小的数据量。在概念上，这就是分片在数据库中的工作方式，尽管实现更为复杂。\n\
    \nMongoDB的其他用例在官方网站上有详细讨论。³ 此外，MongoDB正迅速成为Node.js的事实标准数据库。Joyent创始人Jason Hoffman曾做过一个关于Node.js和MongoDB作为实时网络的现代技术栈的演讲⁴，取代了传统的LAMP（Linux，Apache，MySQL，PHP）技术栈。一旦你开始构建现实世界项目，不可避免地会遇到MongoDB并使用从本书中获得的技能。\n\
    \n¹ http://bsonspec.org/\n² http://www.yellowpages.com/\n³ http://www.mongodb.org/display/DOCS/Use+Cases\n\
    ⁴ http://www.10gen.com/presentations/mongosf-2012/n2m-nodejs-and-mongodb-as-the-modern-stack-for-the-real-time-web\n\
    \n## 安装\n\n我们将从托管的MongoDB切换到本地安装版本。安装很简单，你可以从以下地址获取最新版本：http://www.mongodb.org/downloads。获取适合你特定平台的链接后，下载并解压缩存档。\n\
    \n以下说明适用于Debian和Ubuntu系统。对于其他平台，你可以参考官方文档⁵。你的命令应该类似于以下内容：\n\n```bash\nwget http://fastdl.mongodb.org/linux/mongodb-linux-x86_64-2.0.6.tgz\n\
    \ntar -xzvf mongodb-linux-x86_64-2.0.6.tgz\n```\n\n你需要做的唯一配置是按如下方式创建`/data/db`：\n\
    \n```bash\nsudo mkdir /data\n\nsudo mkdir /data/db\n```\n\n最后一步是运行MongoDB守护进程：\n\
    \n```bash\nsudo mongodb-linux-x86_64-2.0.6/bin/mongod\n```\n\n如果一切成功，你应该在控制台中看到以下（或类似）内容：\n\
    \n```\n:\n[initandlisten] waiting for connections on port 27017\n[websvr] admin\
    \ web console waiting for connections on port 28017\n```\n\n⁵ http://www.mongodb.org/display/DOCS/Quickstart/\n\
    \n## 选择驱动程序\n\nNode.js有许多可用的MongoDB模块。两个最受欢迎的解决方案是Mongoose和原生驱动程序。\n\nMongoose是一个对象-文档映射器，在第1章中简要介绍过。它提供了一种在Node.js中指定模式的方式，然后将这些模式转换为MongoDB\
    \ BSON文档，并抽象了一些底层实现细节。其优势在于抽象允许快速应用开发。代价是在某些情况下由于幕后发生的所有魔法而导致性能下降。\n\n另一个选择是原生驱动程序，这是MongoDB背后的公司10gen官方支持的驱动程序。原生驱动程序迫使你处理底层操作，例如打开异步数据库连接。你还需要确定如何在应用程序层面处理模式。\n\
    \nMongoDB操作和原生驱动程序操作之间存在密切对应关系，减轻了开发者学习太多独特特性的负担。此外，如前所述，它提供了最佳性能。两个驱动程序都是优秀的选择，但本书剩余部分我们将使用原生驱动程序。一旦你理解了原生驱动程序的基础知识，如果Mongoose更适合你的业务需求，切换到Mongoose相对简单。\n\
    \n## 快速测试\n\n本章的第一个目标是编写一个模块，能够：\n\n-   连接到MongoDB\n-   插入一笔业务交易\n-   检索一笔交易\n\
    \n让我们从一些单元测试开始本章，并扩展我们在前一章构建的内容。所有以下指令都应该在你迄今为止使用的同一目录中执行。将以下代码放入`test/db.test.js`：\n\
    \n```javascript\nchapter03/test/db.test.js (摘录)\n\n'use strict';\n\nvar assert\
    \ = require('assert')\n  , db = require('../lib/db')\n  , nocklib = require('../lib/nocklib')\n\
    \  , should = require('should');\n```\n"
