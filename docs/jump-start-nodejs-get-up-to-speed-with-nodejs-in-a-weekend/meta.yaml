    \ of application code was written. Remember: test early and test often!\n\n##\
    \ Building the Exchange\n\nNow that we have prepared our unit tests, it gives\
    \ us a fair degree of insight into what’s required for the implementation. Let’s\
    \ start with the exchange data. How should this be structured? Intuitively, the\
    \ order book is split into “buys” and “sells,” so this seems like a logical place\
