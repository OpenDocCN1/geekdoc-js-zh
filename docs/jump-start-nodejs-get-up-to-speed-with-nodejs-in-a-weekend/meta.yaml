    \ JSON 对象。这个数据结构类似于其他编程语言中的哈希表，将允许近乎恒定的查找时间。换句话说，随着数据结构规模的增长，检索元素所需的时间大致保持不变。为了存储价格（prices），我改编了\
    \ Marijn Haverbeke 的二叉堆（binary heap）。我不需要深入探讨实现二叉堆的技术细节，因为 Marijn 在他的在线书中已经做了很好的阐述。⁶\n\
    \n### 对象作为哈希表\n\nGuillermo Rauch 写了一篇关于将对象用作哈希表的一些陷阱的文章。⁷ 主要危险在于，当允许用户提供任意输入时，可能发生潜在的冲突。这不适用于我们的情况，因为输入到对象的数据严格受我们控制。\n\
    \n我们将进行两项小的修改。首先，我们允许用户传递一个标志，指示堆是最大堆还是最小堆（即，它是从最大值还是最小值开始）。这是通过修改原始代码来完成的：\n\n\
    ```javascript\nthis.content.push(element);\n```\n\n... 变成如下形式：\n\n```javascript\n\
    if (this.options.max) {\n    this.content.push(-element);\n}\nelse\n    this.content.push(element);\n\
    ```\n\n如果用户希望是最大堆，他们只需要反转数字的符号。在内部，该数据结构仍然查找最小的数字。然而，在检查负值时，最小的负数在考虑其绝对值时最终会成为最大的数。\n\
    \n## 26 Node.js 快速入门\n\n举例说明，假设我们有 1、4 和 10。未修改的实现默认返回最小数字，即 1。但是，如果我们在内部存储的数字是\
    \ −1、−4 和 −10，那么最小的数字现在变成了 −10。\n\n我们需要做的就是在返回结果之前记住将符号翻转回正数：\n\n```javascript\n\
    if (this.options.max)\n  return -result;\nelse\n  return result;\n```\n\n我们需要最大堆和最小堆，因为交易发生在最高买价和最低卖价上。我们的第二个修改是添加一个\
    \ `peek` 函数，它的工作方式类似于 `pop`，但不进行移除操作：\n\n```javascript\npeek: function() {\n \
    \ if (this.options.max)\n    return -this.content[0];\n  else\n    return this.content[0];\n\
