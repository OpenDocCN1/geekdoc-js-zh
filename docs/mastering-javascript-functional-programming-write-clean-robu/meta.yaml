    but then toCall gets the g value, implying that all future calls will execute
    g() instead. The very same example we looked earlier in this book would work:


    ```

    const squeak = (x: string) => console.log(x, "squeak!");

    const creak = (x: string) => console.log(x, "creak!");


    const makeSound = onceAfter2(squeak, creak);


    makeSound("door"); // "door squeak!"

    makeSound("door"); // "door creak!"

    makeSound("door"); // "door creak!"

    makeSound("door"); // "door creak!"

    ```


