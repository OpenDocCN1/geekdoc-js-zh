  md: '# Becoming Functional – Several Questions


    > On word origins

    If you wonder the word transpiler came from, it is a portanteau of translate and
    compiler. There are many combinations in technological speak: email (electronic
    and mail), emoticon (emotion and icon), malware (malicious and software), alphanumeric
    (alphabetic and numeric), and many more.


    Currently, the most common transpiler for JavaScript is Babel (babel.js/); years
    ago, we also had Tracer (github.com/google/traceur-compiler), but that''s not
    maintained anymore. Two other possibilities are SWC (swc.rs/) and Sucrase (sucrase.io/);
    in particular, the latter boasts a much faster speed.


    With tools like npm and webpack, it is easy to configure things that your code
    will get automatically transpiled and provided to users. You can also track transpilation;
    Figure 1.3 as an example of Babel''s online environment:


    ![](bbox=[0.142, 0.373, 0.857, 0.713])


    Figure 1.3 – The Babel transpiler converts ES13 code into compatible JS5 code


    There are specific ways of installing these tools for your programming environment,
    and usually, you won''t have to do it by hand; check out www.typescript.org/download
    for more information.'
