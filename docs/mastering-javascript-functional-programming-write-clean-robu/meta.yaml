  md: '# # Becoming Functional – Several Questions


    **Functional programming** (or FP) has been around since the earliest days of
    computing and is going through a sort of revival because of its increased use
    with several frameworks and libraries, most particularly in *JavaScript*.


    In this chapter, we shall do the following:


    +   - Introduce some concepts of FP to give a small taste of what it means

    - Show the benefits (and problems) implied by the usage of FP and why we should
    use it

    - Start thinking about why JavaScript can be considered an appropriate language
    for FP

    - Go over the language features and tools that you should be aware of to fully
    take advantage of everything in this book


    By the end of this chapter, you''ll have the basic tools that we''ll be using
    throughout this book, so let''s started by learning about FP.


    # ## What is functional programming?


    If you go back in computer history, you''ll find that the second oldest programming
    language still in use, Lisp, is based on FP. Since then, there have been many
    more functional languages, and FP has been applied more widely. Even so, if you
    ask people what FP is, you''ll probably get two widely dissimilar answers.


    > > A bit of trivia

    For trivia or history buffs, the oldest programming language still in use is Fortran,
    which appeared in 1957, a year before Lisp. Quite shortly after Lisp came another
    long-lived language, COBOL, for business-oriented programming.'
