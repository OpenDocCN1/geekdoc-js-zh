  md: "# Continuation-passing style\n\nThe preceding code, in which you call a function\
    \ but also pass another function to be executed when the input/output operation\
    \ is finished, can be considered something called continuation-passing style (CPS).\
    \ What is this technique of coding? One way of looking at it is by thinking about\
    \ the question: how would you program if using the return statement was forbidden?\n\
    \nAt first glance, this may appear to be an impossible situation. How can we get\
    \ out of our fix by passing a callback to the called function so that when procedure\
    \ is ready to return the caller, instead of returning it invokes the callback.\
    \ By doing this, the callback provides the called function with the way to continue\
    \ the process, hence the word continuation. We won't get into this, but in Chapter\
    \ 9, Designing Functions, we will study it in depth. In particular, CPS will help\
    \ us avoid any improper recursion structure, as we'll\n\nWorking out how to use\
    \ continuations is sometimes challenging, but always possible. An exciting advantage\
    \ of this coding is that by specifying how the process will continue, you can\
    \ go beyond all the usual structures (if, while, return, and so on) and implement\
    \ whatever mechanisms you want. This can be very useful in problems where the\
    \ process isn't necessarily linear. Of course, this could lead to a kind of control\
    \ structure far worse than the possible usage of GOTO that you might imagine!\
    \ Figure 3.1 shows the dangers of practice!\n\n![](bbox=[0.132, 0.477, 0.816,\
    \ 0.638])\n\nFigure 3.1 – What's the worst that could happen if you start messing\
    \ with the program flow? The XCD comic is available online at xcd.com/292/\n\n\
    You are not limited to passing a single continuation. As promises, you can provide\
    \ two or more alternative callbacks. And by this way, we can provide a solution\
    \ to the problem of how you would work with exceptions. If we simply allowed a\
    \ function to throw an error, it would be an implied return to the caller, and\
    \ we don't want this. The way out of this is to provide an alternative callback\
    \ (that is, a different continuation) to be used whenever an exception is thrown\
    \ (in Chapter 12, Building Containers, and we will find another solution using\
    \ monads:\n\n```\nfunction doSomething(a, b, c,\n  normalContinuation, errorContinuation)\
    \ {\n```"
