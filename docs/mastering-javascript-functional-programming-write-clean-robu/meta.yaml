    and all web pages, is the summing of all the elements of an array. So, to keep
    with tradition, let''s say precisely with this example!


    To reduce an array, you must provide a dyadic function (a function with two parameters;
    binary would be another name for that) and an initial value. In our case, the
    function will sum up its two arguments. Initially, the function will be applied
    to the provided initial value and the first element of the array. For us, the
    initial value to provide is a zero, and the first result will be the first element
    itself. Then,'
