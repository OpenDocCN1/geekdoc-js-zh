  md: "# Behaving Properly — Pure Functions\n\nLet's finish this section with a more\
    \ complex case: what happens with a function with multiple impurities? For instance,\
    \ we could be working on a backend calculateDebt() service that calculates a person's\
    \ debt, given their id. To do that, we could access a database, get the list of\
    \ the person's invoices, and then call some service to get the amount owed in\
    \ each invoice; the sum of amounts would be the calculated debt. A skeleton of\
    \ such a function could be as follows—and I'm using JavaScript to omit unnecessary\
    \ details:\n\n```\n// calculateDebt.js\n\nconst calculateDebt = async (id) =>\
    \ {\n  // access a database to get a list of invoices\n  const listOfInvoices\
    \ =\n    await mysql.query(/* SQL query to get invoices */);\n\n  // call a remote\
    \ service to learn what's owed for each\n  const owedAmounts =\n    await axios.get(/*\
    \ API call to get owed amounts */);\n\n  const calculatedDebt = owedAmounts.reduce(\n\
    \    (x, y) => x + y,\n    0\n  );\n\n  return calculatedDebt;\n};\n```\n\n(If\
    \ calculatedDebt = wedAmounts.reduce(...) is foreign to you, see the Summing array\
    \ section of Chapter 5, Programming Declaratively.)\n\nWe cannot easily test such\
    \ function because it depends on the availability of a database and another service.\
    \ To purify it, we need to inject two functions: one to get data from a database\
    \ and another to query a service. The purified function would become:\n\n```\n\
    // continued...\n\nconst calculateDebt2 = async (\n  id,\n{ getInvoices, getOwedAmounts\
    \ } =\n  { getInvoicesFromDB, getOwedAmountFromAPI }\n) => {\n  const listOfInvoices\
    \ = await getInvoices(id);\n\n```"
