  md: '# Pure functions


    To save execution time, the compiler is taking advantage of the fact that all
    mathematical expressions and functions are (by definition) referentially transparent.


    On the other hand, if the compiler cannot predict the output of a given expression,
    it won''t be able to optimize the code in any fashion, and the calculation will
    have to be done at runtime.


    (Typescript does a similar type analysis, and give the original const x = 1 +
    2 * 3 line, which would correctly decide that x is of type number.)


    Of lambdas and betas

    In lambda calculus, if you replace the value of an expression involving a function
    with the calculated value for the function, then operation is called a β (beta)
    reduction. Note that you can only do this safely with referentially transparent
    functions.


    All arithmetic expressions (involving both mathematical operators and functions)
    are referentially transparent: 22*9 can always be replaced by 198. Expressions
    involving I/O are not transparent, given that their results cannot be known until
    executed. For the same reason, expressions involving data and time-related functions
    or random numbers are also not transparent.


    Concerning JavaScript functions you can produce, it''s pretty easy to write some
    that won''t fulfill the transparency condition. In fact, a function is not even
    required to return a value, though the JavaScript interpreter will return undefined
    in situation.


    A matter of distinction

    Some languages distinguish between functions, which are expected to return a value,
    and procedures, which do not return anything, but that''s not the case with JavaScript.
    Some languages provide the means to ensure that functions are referentially transparent.


    If you wanted to, you could classify functions as follows:


    +   - **Pure functions**: These return a value that depends only on its arguments
    and have no side effects whatsoever.

    - **Side effects only**: These do not return anything (actually, in JavaScript,
    these functions return undefined, but that''s not relevant) but do produce some
    side effects.

    - **Functions with side effects**: This means they return a value that may not
    depend on the function arguments but also involve side effects.


    In FP, emphasis is put on the first group: referentially transparent functions.
    A compiler can reason about the program behavior (and thus be able to optimize
    the generated code), and the programmer can more easily reason about the program
    and the relationship between its components. This, in turn, can help prove the
    correctness of an algorithm or optimize the code by replacing a function with
    an equivalent one.'
