  md: '# How do we work with JavaScript?


    You can also use it to work with functions that expect separate parameters instead
    of an array. Common examples of this would be Math.min() and Math.max():


    ```

    // continued...


    const numbers = [2, 2, 9, 6, 0, 1, 2, 4, 5, 6];


    const minA = Math.min(...numbers); // 0


    const maxArray = (arr) => Math.max(...arr);


    const maxA = maxArray(numbers); // 9

    ```


    We are specifying that that .apply() method shall receive an array of numbers
    as an argument.


    You can also follow the equality since .apply() method requires an array of arguments,
    but .call() expects individual arguments, which you can get by spreading:


    ```

    someFn.apply(thisArg, arr) === someFn.call(thisArg, ...arr)

    ```


    # A mnemonic for arguments


    If you have problems remembering what arguments are required by .apply() and .call(),
    this mnemonic helps: A for Array, C is for Call. See developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply
    and developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call
    for more information.


    Using the spread operator helps with shorter, more concise code, and we will be
    taking advantage of it. We have seen all of the most important JavaScript features
    that we will be using. Let''s round off this chapter by looking at some tools
    that we will be working with.


    # How do we work with JavaScript?


    This is all well and good, as we mentioned before, it happens that the JavaScript
    version available almost everywhere is ES13, but the earlier JS. An exception
    to this is Node.js. It is based on Chrome''s V8 high-performance JavaScript engine,
    which already has ES13 features available. Nonetheless, the type of writing, ES3
    coverage is not 100% complete, and there are features that you will miss. (Check
    node.js/en/docs/es6/ for more node on Node.js and v8.) This is surely changing
    since Internet Explorer is fading away (support for it in June 2022), having been
    replaced with Microsoft''s Edge browser, which shares Chrome''s engine. In any
    case, we must still deal with older, less powerful engines.'
