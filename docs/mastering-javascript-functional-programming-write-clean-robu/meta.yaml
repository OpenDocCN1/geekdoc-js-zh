  md: "# Producing Functions - Higher-Order Functions\n\na memoize() function that\
    \ wraps any other function to apply memoization. For clarity, let's write with\
    \ JavaScript first and for functions with a single numeric parameter:\n\n```\n\
    // memoize.ts\nconst memoize = (fn) => {\n  const cache = {};\n  return (x) =>\
    \ {\n    x in cache ? cache[x] : (cache[x] = fn(x));\n  };\n};\n```\n\nHow does\
    \ this work? The returned function, for any given argument, checks whether the\
    \ argument was already retrieved; that is, whether it a key in the cache object.\
    \ (See Question 6.2 for an alternative implementation of the cache.) If so, there's\
    \ no need for calculation, and the cached value is returned. Otherwise, we calculate\
    \ the missing value and store it in the cache. (We use a closure to hide the cache\
    \ from external access). Here, we assume the memoized function receives only one\
    \ argument (x) and that it is a numeric value, which can be directly used as a\
    \ key value for the cache object; we'll consider other cases.\n\nNow we need to\
    \ go to TypeScript; here's the equivalent version of memoize(). The generic data\
    \ typing is along the same lines as we saw in the Logging in a functional way\
    \ section, with the only difference being that we work with functions that get\
    \ a single numeric argument:\n\n```\n// continued...\nconst memoize = <T extends\
    \ (x: number) => any>(\nfn: T\n): ((x: number) => ReturnType<T>) => {\n  const\
    \ cache = {} as Record<number, ReturnType<T>>;\n  return (x) =>\n    x in cache\
    \ ? cache[x] : (cache[x] = fn(x));\n};\n```\n\nIs memoization working? We'll have\
    \ to time it - and we happen to have a useful addTiming() function for that! First,\
    \ we time the original fib() function to time the complete calculation and not\
    \ each recursive call, so we use an auxiliary testFib() function, which is the\
    \ one we will time.\n\nWe repeat the timing operations and do an average, but\
    \ since we just want to confirm that memoizing works, we'll tolerate differences:\n\
    \n```\nconst testFib = (n: number) => fib(n);\naddTiming(testFib(45)); // 18,957\
    \ ms\n```"
