    ```


    ```

    const factorialByRange = (n: number): number =>

    range(1, n + 1).reduce(binaryOp2("*"), 1);

    ```


    We''ve looked at how binaryOp() is implemented yet, but the key notion is that
    instead of an infix operator (like we when we use 2+9), we now have a function
    (as if we could write our sum like +(22, 9), which certainly isn''t valid JavaScript).
    Let''s see how we can make this work.


