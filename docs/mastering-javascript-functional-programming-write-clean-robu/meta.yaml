  md: "# Programming Declaratively – A Better Style\n\nThe END FOREACH text appears\
    \ before the results of the API calls. What's happening? The answer is what we\
    \ mentioned before: methods forEach() and the like are meant to be used with standard,\
    \ sync function calls and behave strangely with async function calls.\n\nThe key\
    \ concept is that async functions return promises, so after getting the START\
    \ FOREACH, the loop actually creates promises (which will eventually be resolved\
    \ at some point), but without waiting for them, and our code goes on to the END\
    \ FOREACH text.\n\nThe problem is not only with forEach() but also affects all\
    \ other methods. Let's see how we can work around this situation and write async-aware\
    \ functions to let us keeping in a declarative fashion, and as we did earlier\
    \ in the chapter.\n\n# Async-ready looping\n\nIf we cannot directly use methods\
    \ as forEach(), map(), and the like, we'll have to develop new versions of our\
    \ own. Let's see how to achieve this.\n\n# Looping over async calls\n\nSince async\
    \ calls return promises, we can emulate forEach() with reduce() by starting with\
    \ a resolved promise and chaining it to the promises for each value in the array.\
    \ The then() methods will be called in the proper order, so the results will be\
    \ correct. The following piece of code manages to get the right results:\n\n```\n\
    // continued...\n\nconst forAsync = <T>(\n  arr: T[],\n  fn: (x: T) => any\n):\
    \ Promise<any> =>\n  arr.reduce(\n    promise: Promise<void>, value: T) =>\n \
    \     promise.then(() => fn(value)),\n    Promise.resolve()\n  );\n\n(async ()\
    \ => {\n  console.log(\"START FOREACH VIA REDUCE\");\n  await forAsync([1, 2,\
    \ 3, 4], async (n) => {\n    const x = await fakeAPI(n * 1000, n);\n    useResult(x);\n\
    \  });\n```"
