  md: '# The (easier) way out


    Some libraries, such as Lodash, already provide functions as .multiply() and .sum(),
    so that''s a more straightforward solution! You could quickly whip up your own
    and create your own mini-library of mathematical and essential functions.


    If you follow this train of thought, you may also define a unaryOp function, even
    though there are fewer applications for it. (I leave this implementation to you;
    it''s similar to what we already wrote.) In Chapter 7, Transforming Functions,
    we will look at an alternative way of creating this function by using a partial
    application.


    # A handler implementation


    Let''s get ahead of curry FP doesn''t always mean getting down to the simplest
    possible functions. For example, in an upcoming section of this book, we will
    need a function to check whether a number is negative, and we will consider (see
    the Converting to primitive style section of Chapter 8, Connecting Functions)
    using binaryOp2() to write it:


    ```

    const isNegative = curry (binaryOp2(">")) (0);

    ```


    Don''t worry about the curry() function for now (we''ll get to it, in the following
    chapter) – the idea is to fix the first argument to 0 so that our function will
    check for a given n number if n>0. The point is that the function we just wrote
    isn''t very clear. Could we do better if we defined a binary operation function
    that lets specify one of its parameters – the left or the right one – in addition
    to the operator to be used. Here, we can write the following couple of functions,
    which define the functions where the left or right operators are missing:


    ```

    // continued...

    const binaryLeftOp =

    (x: number, op: string) => (y: number) =>

    binaryOp2 (op, x, y);


    const binaryOpRight =

    (op: string, y: number) => (x: number) =>

    binaryOp2 (op, x, y);

    ```


    With these new, we could write either of the following definitions, though I think
    the second is clearer. I''d rather test whether a than whether 0 is greater than
    the number:


    ```

    const isNegative1 = binaryLeftOp(0, ">");

    const isNegative2 = binaryOpRight("<", 0);

    ```'
