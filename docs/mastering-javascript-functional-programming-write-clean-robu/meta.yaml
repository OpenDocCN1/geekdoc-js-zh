  md: "# Order of execution\n\nAnother way of looking at what we have been saying\
    \ in this chapter is to see pure functions as robust. You know that their execution—in\
    \ whichever order—won’t impact the system. This idea can be extended further:\
    \ you could evaluate pure functions in parallel, with the assurance that the results\
    \ won’t vary from what you get in a single-threaded execution. (JavaScript doesn't\
    \ provide Java-like threads, but we can make do, more or less, with workers. We'll\
    \ cover this topic in Chapter 5, Programming Declaratively.)\n\nAnother consideration\
    \ to keep in mind when you work with pure functions is that there’s no explicit\
    \ need to specify the order in which they should be called. If you work with mathematics,\
    \ an expression such as f(2) + f(5) is always the same as f(5) + f(2); this is\
    \ called the commutative property.\n\nHowever, when you deal with impure functions,\
    \ that can be false, as shown in the following purposefully written function:\n\
    \n```\n// tricky.ts\n\nlet mult = 1;\nconst f = (x: number): number => {\n  mult\
    \ = -mult;\n  return x * mult;\n};\n\nconsole.log(f(2) + f(5)); // 3\nconsole.log(f(5)\
    \ + f(2)); // -3\n```\n\nWith impure functions such as the previous one, you cannot\
    \ assume that calculating f(3) + f(3) would produce the same result as 2f(3) or\
    \ that f(4) - f(4) would actually be zero; check it out for yourself...Common\
    \ mathematical properties, down the drain!\n\nWhy should you care? When writing\
    \ code, willingly or not, you always keep in mind those properties you learned\
    \ about, such as the commutative property. So, while you might think that both\
    \ expressions should produce the same result and code accordingly, you may be\
    \ in for a surprise when using impure functions, with hard-to-find bugs that are\
    \ difficult to fix.\n\n# Memoization\n\nSince the output of a pure function for\
    \ a given input is always the same, you can cache the function results and avoid\
    \ a possibly costly recalculation. This process, which implies evaluating an expression\
    \ only the first time and caching the result for later, is called memoization."
  merge: -1
