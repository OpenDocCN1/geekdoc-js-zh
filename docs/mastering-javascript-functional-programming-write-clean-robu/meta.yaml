  md: "A possible solution would be as follows, and let's use plain JavaScript first\
    \ to focus on the implementation:\n\n```\n// logging.ts\n\nfunction addLogging(fn)\
    \ {\n  return (...args) => {\n    console.log(`entering ${fn.name}($${args})`);\n\
    \    const valueToReturn = fn(...args);\n    console.log(`exiting ${fn.name}=${valueToReturn}`);\n\
    \    return valueToReturn;\n  };\n}\n\n```\n\nThe function returned by addLogging()\
    \ behaves as follows:\n\n+   * The first console.log(...) line shows the original\
    \ function's name and its list of arguments.\n* Then, the original function, fn(),\
    \ is called, and the returned value is stored. The second console.log(...) shows\
    \ the function name (again) and its returned value.\n* Finally, the value that\
    \ fn() calculated is returned.\n\nA small comment: If you were entering a Node.js\
    \ application, you would probably opt for a better way of logging console.log()\
    \ using libraries such as Winston, Morgan, or Bunyan, depending on what you wanted\
    \ to log. However, our focus is on how to wrap the original function, and the\
    \ needed changes for using those libraries would be negligible.\n\nLet's turn\
    \ to a TypeScript implementation now:\n\n```\n// continued...\n\nfunction addLogging<T\
    \ extends (...args: any[]) => any>(\n  fn: T\n): (...args: Parameters<T>) => ReturnType<T>\
    \ {\n  return (...args: Parameters<T>) => ReturnType<T> => {\n    console.log(`entering\
    \ ${fn.name}($${args})`);\n    const valueToReturn = fn(...args);\n    console.log(`exiting\
    \ ${fn.name} => ${valueToReturn}`);\n    return valueToReturn;\n  };\n}\n}\n\n\
    ```"
  merge: -1
  pgno: 192
- img_proc: false
  md: "Our addLogging() function applies to a generic function T and returns a new\
    \ function of precisely the same type: its arguments (Parameters<T>) are also\
    \ of T, and its result (ReturnType<T>) is also the same type as T. We will be\
    \ using this kind of definition many times in this chapter and the rest of the\
    \ book.\n\nLet's have an example now. We can use addLogging() with the upcoming\
    \ functions—which are written, I, in an overly complicated way, just to have an\
    \ appropriate example! We'll have a function that accomplishes subtraction by\
    \ changing the sign of the second number and adding it to the first. And, just\
    \ to have an error case, we'll have the function throw an error if we attempt\
    \ to subtract zero. (Yes, of course you can subtract zero from another number!\
    \ But I wanted to have some kind of an error-thriving situation at any cost!)\
    \ The following code does:\n\n```\n// continued...\nfunction subtract(a: number,\
    \ b: number): number {\n  if (b === 0) {\n    throw new Error(\"We don't subtract\
    \ zero!\");\n  } else {\n    b = changeSign(b);\n    return a + b;\n  }\n}\n```\n\
