  md: "Let's look at a (somehow nonsensical) example. Assume that we have a list of\
    \ names, such as \"Winston Spencer Churchill\", \"Abraham Lincoln\", and \"Socrates\"\
    . Our rule is that if a name has several words, exclude the initial one (the first\
    \ name, we) and separate the rest (last names), but if a name is a single word,\
    \ drop it (assuming the person has no last name):\n\n```\n// continued...\nconst\
    \ names = [\n  \"Winston Spencer Churchill\",\n  \"Plato\",\n  \"Abraham Lincoln\"\
    ,\n  \"Socrates\",\n  \"Charles Darwin\",\n];\n\nconst lastNames = names.flatMap((x)\
    \ => {\n  const s = x.split(\" \");\n  return s.length === 1 ? [] : s.slice(1);\n\
    });\n\n// [ 'Spencer', 'Churchill', 'Lincoln', 'Darwin' ]\n```\n\nAs we can see,\
    \ the output has a different number of elements than the input array; just because\
    \ of this, we could consider flatMap() to be an upgraded version of map(), even\
    \ including some aspects of filter(), like when we excluded single names.\n\n\
    Let's move on to a simple example. Keeping with the Lincolnian theme from the\
    \ last section, let's count how many words are in Lincoln's Gettysburg address,\
