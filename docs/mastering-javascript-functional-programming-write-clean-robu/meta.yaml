  md: '# # 4 Behaving Properly

    – Pure Functions


    In Chapter 3, Starting Out with Functions, we considered functions as the critical
    elements in functional programming (FP), went into detail about arrow functions,
    and introduced some concepts, such as injection, callbacks, polyfilling, and stubbing.
    In this chapter, we''ll have the opportunity to revisit or apply some of these
    ideas.


    In this chapter, we will do the following:


    +   * Consider the notion of purity and why we should care about pure functions—and
    impure functions as well!

    * Examine the concept of referential transparency

    * Recognize the problems implied by side effects

    * Show some advantages of pure functions

    * Describe the main reasons behind impure functions

    * Discover ways to minimize the number of impure functions

    * Focus on ways of testing pure and impure functions


    # ## Pure functions


    Pure functions behave the same way as mathematical functions and provide various
    benefits. A function is pure if it satisfies these conditions:


    +   * Given the same arguments, the function always calculates and returns the
    same result: This should be true no matter how many times it''s invoked or under
    which conditions you call it. This result cannot depend on any outside information
    or state, which could change during'
  merge: -1
  pgno: 93
- img_proc: false
  md: 'the program execution and cause it to return a different value. Nor can the
    function result depend on I/O services, random numbers, some other external variable,
    or a value that is not directly controllable.


    +   - When calculating its result, the function doesn''t cause any observable
    side effects: This includes output to I/O devices, the mutation of objects, changes
    to a program''s state outside of the function, and so on.


    You can simply say that pure functions don''t depend on (and not modify) anything
    outside their scope and always return the same result for the same input arguments.


    Another word used in this context is idempotency, but it''s not exactly the same.
    An idempotent function can be called as many times as desired and will always
    produce the same result. However, this doesn''t imply that the function is free
    from side effects.


    Idempotency is usually mentioned in the context of RESTful services. Let''s see
    a simple example showing the difference between purity and idempotency. A PUT
    call would cause a database record to be updated (a side effect), but if you repeat
    the call, the element will not be modified, so the global state of the database
    won''t change anything.


    We might also invoke a software design principle and remind ourselves that a function
    should do one thing, only one thing, and nothing but that. If a function does
    something else and has hidden functionality, then dependency on the state will
    mean that we won''t be able to predict the function''s output and will make things
    harder for us as developers.


    Let''s look into these conditions in more detail.


    # Referential transparency


    In mathematics, referential transparency is the property that lets you replace
    an expression with its value without changing the results of whatever you are
    doing. The counterpart of referential transparency is, appropriately enough, referentially
    opaque function can guarantee that it will always produce the same result, even
    when called with the same arguments.


    To give a simple example, consider what happens with an optimizing compiler performs
    constant folding. Suppose you have a sentence like this:


    ```

    const x = 1 + 2 * 3;

    ```


    The compiler might optimize the code to the following by noting that 2*3 is a
    constant value:


    ```

    const x = 1 + 6;

    ```


    Even better, a new round of optimization could avoid the sum altogether


    ```

    const x = 7;

    ```'
