  md: "In this section, we saw how to check for a given Boolean condition. Let's finish\
    \ by seeing how to check a negative condition by inventing a method of our own.\n\
    \n# Checking negatives – none()\n\nIf you wanted, you could also define none ()\
    \ as the complement of every (). This new function would be true only if none\
    \ of the elements of the array satisfied the predicate. The simplest way of coding\
    \ would be by noting that if no elements satisfy the condition, then all elements\
    \ satisfy the negation of the condition:\n\n```\n// continued...\n\nconst none\
    \ = <T>(arr: T[], fn: (x: T) => boolean) => =\n  arr.every(v) => !fn(v));\n```\n\
    \nYou can turn it into a method by modifying the array prototype, as we saw earlier.\
    \ It's still a bad practice, but it's what we have until we start looking better\
    \ methods for composing and chaining functions, we will do in Chapter 8, Connecting\
    \ Functions:\n\n```\n// continued...\n\ndeclare global {\n  interface Array<T>\
    \ {\n    none(f: (x: T) => boolean): boolean;\n  }\n}\n\nArray.prototype.none\
    \ = function (fn) {\n  return this.every(v) => !fn(v));\n};\n```\n\nWe had to\
    \ use instead of arrow function for the same reasons we saw on earlier occasions:\
    \ we need this to be correctly assigned. We also had to add a global definition\
    \ when we use averages so that TypeScript wouldn't object the newly added none\
    \ () method. Other than that, it's simple coding, and we now have a none () method\
    \ available for all arrays. In Chapter 6, Producing Functions, we will see yet\
    \ other ways of negating a function by writing an appropriate HOF of our own.\n\
    \nIn this and the preceding section, we worked with everyday problems and saw\
    \ how to solve them declaratively. However, things change a bit when you start\
    \ working with async functions. We will see in the following section what new\
    \ solutions will needed."
