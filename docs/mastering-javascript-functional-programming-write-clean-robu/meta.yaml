  md: "# Closures\n\nClosures are a way to implement data hiding (with private variables),\
    \ which leads to modules and other nice features. The key concept of closures\
    \ is that when you define a function, it can refer to not only its local variables\
    \ but also to everything outside of the context of the function. We can write\
    \ a counting function that will keep its count using a closure:\n\n```\n// closure.js\n\
    \nfunction newCounter() {\n  let count = 0;\n  return function () {\n    count++;\n\
    \    return count;\n  }\n}\n\nconst nc = newCounter();\nconsole.log(nc()); //\
    \ 1\nconsole.log(nc()); // 2\nconsole.log(nc()); // 3\n```\n\nEven after newCounter()\
    \ exits, the inner function still has access to count, but that variable is not\
    \ accessible to any other parts of your code.\n\nThis isn't a very good example\
    \ of FP - a function (nc ), in this case isn't expected to return different results\
    \ when called with the same parameters!\n\nWe'll find several uses for closures,\
    \ such as memoization (see Chapter 4, Behaving Properly, and Chapter 6, Producing\
    \ Functions) and the module pattern (see Chapter 3, Starting Out With Functions,\
    \ and Chapter 11, Implementing Design Patterns), among others.\n\n# Arrow functions\n\
    \nArrow functions are just shorter, more succinct way of creating an (un) function.\
    \ Arrow functions can be used almost everywhere a classical function can be used,\
    \ except that they cannot be used as constructors. The syntax is either (parameter,\
    \ anotherparameter, ...etc) => { statements } or (parameter, anotherparameter,\
    \ ...etc) => expression. The first allows you to write as much code as you want,\
    \ while the second is short for { return expression }."
