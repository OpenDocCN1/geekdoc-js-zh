  md: '# Wrapping functions - keeping behavior


    ```

    addTiming(testFib(40); // 1,691 ms

    addTiming(testFib(35); // 152 ms

    ```


    Course, your times will depend on your specific CPU, RAM, and so on. However,
    the results seem logical: the exponential growth mentioned in Chapter 4, Behavior
    Properly, appears to be present, and times grow quickly. Now, let''s memoize fib().
    If we get shorter times... shouldn''t we?


    ```

    const testMemoFib = memoize((n: number) => fib(n);

    addTiming(testMemoFib(45); // 19,401 ms

    addTiming(testMemoFib(45); // 0.005 ms - good!

    addTiming(testMemoFib(40); // 2,467 ms ???

    addTiming(testMemoFib(35); // 174 ms ???

    ```


    Something''s wrong! The times have gone down, but they are just about the same.
    This is because of a common error, which I''ve even seen in some memoization and
    web pages. We are testing testMemoFib(), but nobody calls that function for timing,
    which only happens once! Internally, all recursive calls to fib(), which isn''t
    memoized. If we called testMemoFib(45) again, that would be cached, and it would
    return almost immediately, but that optimization doesn''t apply to the internal
    fib() calls. This is the reason why the calls for testMemoFib(40) and testMemoFib(35)
    weren''t optimized – when we did the calculation for testMemoFib(45), and that
    was the value that got cached.


    The correct solution is as follows:


    ```

    fib = memoize(fib);

    addTiming(testFib(45)); // 0.1481 ms

    addTiming(testFib(45)); // 0.0002 ms

    addTiming(testFib(40)); // 0.0019 ms

    addTiming(testFib(35)); // 0.0029 ms

    ```


    Now, when calculating fib(45), all the intermediate Fibonacci values (from fib(0)
    to fib(45) itself) are stored, so the forthcoming calls have no work to do.


    Now that we know how to memoize single-argument functions, let''s look at functions
    with more arguments.


    # Complex memoization


    What if we have to work with a function that receives two or more arguments, or
    can receive arrays or objects as arguments? Of course, like in the problem that
    we looked at in Chapter 2, Thinking Functionally, having a function to do only
    one job is unique, so we could simply go through the memoization process, otherwise,
    we don''t do anything!'
