  md: '# More maps available


    The Query provides a function, $.map(array, callback), that is similar to the
    map () method. Be careful, though, because there are important differences. The
    jQuery function processes the undefined values of the array, while map () skips
    them. Also, if the applied function produces an array as result, jQuery flattens
    it and adds each of its elements separately, map () just includes those arrays
    in the result. Underscore, and Ramda provide similar functions. Finally, JavaScript
    itself provides an alternative of doing map(): check the Array.from() method at
    developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/from
    and pay special attention to its content argument!


    What are the advantages of using map () over using a straightforward loop?


    +   - First, you don''t have to write any loops, so that''s one less source of
    bugs

    - Second, you don''t have to access the original array or the index position,
    even though they are there for you to use if you really need them

    - Lastly, a new array is produced, so code is pure (although, of course, if you
    really want to produce side effects, you can!)


    There are only two caveats when doing this:


    +   - Always return something from your mapping function. If you forget this,
    then you''ll produce an array filled with undefined values, because JavaScript
    always provides a default return for all functions

    - If the array elements are objects or arrays, and you include them in the output
    array, JavaScript will still allow the original elements to be accessed.


    Also, there''s restriction in JavaScript, map () is basically available for arrays
    (you can read more about this developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map/);
    however, in the Extending data types section in Chapter 12, Building Containers,
    we will learn how to make it available for other basic types, such as Numbers,
    Booleans, strings, and functions. Also, libraries like Lodash, Underscore, and
    Ramda, provide similar functionalities.


    As we did earlier with reduce (), let''s now look at some examples of the use
    of map () for common processes that you''ll appreciate its power and convenience.


