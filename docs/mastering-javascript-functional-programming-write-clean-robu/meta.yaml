  md: "Extracting the list of cities can be done by applying map () and flat () twice:\n\
    \n```\n// continued...\n\nconsole.log(\n  apiAnswer\n  .map(x => x.states)\n \
    \ .flat()\n  .map(y => y.cities)\n  .flat()\n);\n```\n\n```\n/* Results:\n { city:\
    \ 3846864, name: 'Lincoln' },\n { city: 2644487, name: 'Lincoln' },\n { city:\
    \ 5072006, name: 'Lincoln' },\n { city: 8531960, name: 'Lincolnia' },\n { city:\
    \ 4796908, name: 'Lincolnia' },\n { city: 4999311, name: 'Lincoln Park' },\n {\
    \ city: 5072006, name: 'Lincoln' },\n { city: 4899911, name: 'Lincoln Park' },\n\
    \ { city: 4899966, name: 'Lincoln Square' }\n*/\n```\n\nWe have seen how to use\
    \ flat () to flatten an array; let's see how to use flatMap(), and an interesting\
    \ mixture of flat () and map (), to further streamline our coding and even shorten\
    \ our preceding second solution! (If you think this exercise wasn't hard enough\
    \ and its output was sort of lame, try out Question 5.10 for a more challenging\
    \ version!)\n\n# Mapping and flattening – flatMap()\n\nBasically, flatMap() does\
    \ first apply a map () function and then apply flat () to the result of the mapping\
    \ operation. It is an interesting combination because it lets you produce a new\
    \ array with a different number of elements. (With the normal map() operation,\
    \ the output array would be precisely the same length as the input array). If\
    \ your mapping operation produces an array with two or more elements, the output\
    \ array will include many output values, and if you produce an empty array, the\
    \ output array will include fewer values."
