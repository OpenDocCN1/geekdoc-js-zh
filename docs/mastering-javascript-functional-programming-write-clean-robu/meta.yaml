  md: '# Becoming Functional – Several Questions


    +   - **Extensible**: It''s a fact that your program will someday require maintenance,
    possibly to add new functionality. These changes should impact the structure and
    data flow of the original code minimally (if at all). Small changes shouldn''t
    imply large, serious refactoring of your code.

    - **Reusable**: reuse has the goal of saving resources, time, and money, by taking
    advantage of previously written code. Some characteristics help with this, like
    **high cohesion** (all the pieces in a module belong together), **low coupling**
    (modules are independent of each other), **separation of concerns** (the parts
    of a program should overlap as little as possible), and **information hiding**
    (internal changes in a module shouldn''t affect the rest of the system).


    # What we get


    So, does FP give you the five characteristics we listed in the previous section?


    +   - In FP, the goal is to separate independent functions that are joined together
    to produce the final results.

    - Programs that are written in a functional style tend to be cleaner, shorter,
    and easier to understand.

    - Functions can be tested on one, and FP code has advantages in achieving this.

    - You can reuse functions in other programs because they stand on their own, not
    depending on the rest of the system. Most functional programs share common functions,
    several of which we''ll be considering in this book.

    - Functional code is free from side effects, which means you can understand the
    objective of a function by studying it without having to consider the rest of
    the program.


    Finally, once you get to the FP style of programming, code becomes more understandable
    and easier to extend. So, it seems that all five characteristics can be achieved
    with FP!


    | Why use FP?

    For a well-balanced look at the reasons to use FP, I''d suggest Why Functional
    Programming Matters, by John Hughes; it''s available online at www.cs.kent.ac.uk/people/staff/dat/mirisanda/whyfp90.pdf.
    It''s not geared toward JavaScript, but the arguments are easily understandable
    |


    # Not all is gold


    Now, let''s strive for a bit of balance. Using FP isn''t a silver bullet that
    will automatically make your code better. Some functions are tricky, and some
    developers greatly enjoy writing code and then asking, what does this do? If you''re
    not careful, your code may become write-only and practically impossible to maintain;
    there goes understandable, extensible, and reusable out the door!'
