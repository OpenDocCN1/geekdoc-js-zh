  md: "# Long-living pooled workers\n\nWorkers can stay uninterrupted and will be\
    \ able to receive new messages and reply to them. Messages get queued, so if you\
    \ need to use the same worker more than once at the same time, there will be a\
    \ logical delay; calls will go sequentially. If you need a worker and is free,\
    \ you can call it directly, but if you need it and is occupied, it makes sense\
    \ to create a new worker. We'll keep a pool of threads, and whenever a call comes\
    \ in, we'll check whether there's an available worker to deal with it or whether\
    \ we need to create a new worker first.\n\nLet's see how to do this. First, we'll\
    \ need a pool:\n\n```\n// workers/pool.ts\nimport { Worker } from \"worker_threads\"\
    ;n\ntype PoolEntry = {\n  worker: Worker;\n  filename: string;\n  value: any;\n\
    \  inUse: boolean;\n}\n\nconst pool: PoolEntry[] = [];\n```\n\nThe PoolEntry objects\
    \ will have the following:\n\n+   * The worker object.\n* The filename corresponding\
    \ to the path with which the worker was created.\n* The value with which it was\
    \ the last time we used this worker (just for logging: we can do without it).\n\
    * The inUse flag to show whether it's available or not. pool is an array of PoolEntry\
    \ objects.\n\nWe need a function that will allow us to call a worker; let's name\
    \ it workerCall(). We'll have to specify the function to call, and the value to\
    \ pass to it. The function will first see whether there's an appropriate free\
    \ worker (with the same filename and not in use) in a very declarative fashion;\
    \ if no worker of this kind is found, it will create a new one. Then, the worker\
    \ will be called by using a promise, as in the previous section, and when a result\
    \ comes, the worker will be marked as not in use, ready for a new call:\n\n```\n\
    // continued...\n```"
  merge: -1
