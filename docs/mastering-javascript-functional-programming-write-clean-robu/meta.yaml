  md: "# 64 Starting Out with Functions – A Core Concept\n\nNowadays, you would use\
    \ a module instead of an IIFE, as follows:\n\n```\n// ajax.module.ts\nlet getAjax\
    \ = null;\n\nif (window.XMLHttpRequest) {\n  // modern browsers; use XMLHttpRequest\n\
    \  getAjax = function () {\n    return new XMLHttpRequest();\n  };\n} else if\
    \ (window.ActiveXObject) {\n  // it's ActiveX for IE5 and IE6\n  getAjax = function\
    \ () {\n    new ActiveXObject(\"Microsoft.XMLHTTP\");\n  };\n} else {\n  getAjax\
    \ = function () {\n    throw new Error(\"No Ajax support!\");\n  };\n}\n\nexport\
    \ { getAjax };\n```\n\nThe code in the module is guaranteed to run only once.\
    \ Wherever you need to do an Ajax call, you would just import { getAjax } from\
