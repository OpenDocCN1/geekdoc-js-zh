  md: "# 134 Programming Declaratively - A Better Style\n\nFlattening an array to\
    \ a given level (not infinity; let's leave that for later) is easy if you can\
    \ first flatten an array one level. We can do this either by using spreading or\
    \ with reduce (). Let's write a flatOne() function that flattens just a single\
    \ level of an array. There are two versions of this; pick you prefer:\n\n```\n\
    // continued...\n\nconst flatOne = <T>(arr: T[]): T[] =>\n  ([] as T[]).concat(...arr);\n\
    \nconst flatOne2 = <T>(arr: T[]): T[] =>\n  arr.reduce((f, v) => f.concat(v),\
    \ [] as T[]);\n```\n\nUsing either of these functions, we can flatten an array\
    \ in two different ways. Our two versions of a flat() function use our previous\
    \ flatOne() and flatAll() functions, but the first one only uses standard looping,\
    \ while the second works in a fully recursive way. Which one do you prefer?\n\n\
    ```\n// continued...\n\nconst flat1 = <T>(arr: T[], n = 1): T[] => {\n  if (n\
    \ === Infinity) {\n    return flatAll(arr);\n  } else {\n    let result = arr;\n\
    \    range(0, n).forEach(() => {\n      result = flatOne(result);\n    });\n \
    \   return result;\n  }\n}\n```\n\n```\nconst flat2 = <T>(arr: T[], n = 1): T[]\
    \ => {\n  n === Infinity\n    ? flatAll(arr)\n    : n === 1\n    ? flatOne(arr)\n\
    \    : flat2(flatOne(arr), n - 1);\n}\n```"
