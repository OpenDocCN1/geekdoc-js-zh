  md: '# Becoming Functional – Several Questions


    The main advantage of TypeScript is the ability to add (optional) static type
    checks to JavaScript, which helps detect programming errors at compile time. But
    beware: with Babel, not all of ES13 will be available. However, it''s entirely
    sufficient for our purposes, allowing us to be more careful with coding.


    Most statistics about programming language popularity rank TypeScript in the top
    10: Figure 1.5 (from spectrum.ieee.org/top-programming-languages-2022) confirms
