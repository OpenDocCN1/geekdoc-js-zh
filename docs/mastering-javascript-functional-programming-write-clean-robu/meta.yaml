  md: "# Wrapping functions – keeping behavior\n\n```\nreturn some expression;\n}\n\
    ```\n\nIn this case, you would have to modify it to look like the following. Here,\
    \ we need to add auxValue variable to store the value that we want to log return:\n\
    \n```\nfunction someFunction(param1, param2, param3) {\n  console.log(\n    \"\
    entering someFunction: \",\n    param1,\n    param2,\n    param3\n  );\n  // do\
    \ something\n  // do something else\n  // and a bit more,\n  // and finally\n\
    \  const auxValue = ...someExpression...;\n  console.log(\"exiting someFunction:\
    \ \", auxValue);\n  return auxValue;\n}\n```\n\nIf the function can return several\
    \ places, you'll have to modify all the return statements to log the values to\
    \ be returned. And if you are just calculating the return expression on the fly,\
    \ you'll need an auxiliary variable to capture that value.\n\nIn the next section,\
    \ we'll learn about logging and some special cases, such as functions that throw\
    \ exceptions, and we'll work more purely.\n\n# Logging in a functional way\n\n\
    Logging by modifying your functions isn't difficult, but modifying code is always\
    \ dangerous and prone to accidents. So, let's put our FP hats on and think of\
    \ a new way of doing this. We have a function that performs some work, and we\
    \ want to log the arguments it receives and the value it returns.\n\nHere, we\
    \ can write an HOF that has a single parameter – the original function – and return\
    \ a new function that will do the following in sequence:\n\n+   1. Log the received\
    \ arguments.\n2. Call the original function, catching its returned value.\n3.\
    \ Log that value.\n4. Return it to the caller."
