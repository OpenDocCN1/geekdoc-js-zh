    \ that on your own!\n\n# # Polyfills\n\nBeing able to assign functions dynamically\
    \ (in the same way that you can assign different values to a variable) also allows\
    \ you to work more efficiently when defining polyfills.\n\n# # Detecting Ajax\n\
    \nLet's go a bit in time to Ajax started to appear. Given that different browsers\
