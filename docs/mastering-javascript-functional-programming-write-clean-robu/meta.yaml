  md: "the input value will be kept in the output (if the function returned true)\
    \ or if it will be skipped (if the function returned false). Also, similar to\
    \ map(), filter() doesn't alter the original array\n produces a new array with\
    \ the chosen items. You can read more on the filter() function\nat developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Array/filter.\n\
    \nSee Figure 5.4 for a diagram showing the input and output:\n\n![](bbox=[0.301,\
    \ 0.235, 0.702, 0.597])\n\nFigure 5.4 – The filter() method picks the elements\
    \ of an array that satisfy a given predicate\n\nThere are a couple of things to\
    \ remember when filtering an array:\n\n+   - Always return something from your\
    \ predicate: If you forget to include a return, the function will implicitly return\
    \ undefined, and since that's a falsy value, the output will be an empty array\n\
    - The copy that is made is shallow: If the input array elements are objects or\
    \ arrays, then the original elements will still be accessible\n\nLet's get into\
    \ more detail by seeing a practical example of filter() and then looking at how\
    \ we could implement that functionality by using reduce()."
