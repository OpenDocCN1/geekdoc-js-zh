  md: '# Parsing numbers tacitly


    Working with map() is usually safer and simpler than looping by hand, but some
    edge cases may trip you up. Say you received an array of strings representing
    numeric values and wanted to parse them into actual numbers. Can you explain the
    following?


    ```

    ["123.45", "67.8", "90"].map(parseFloat);

    // [123.45, 67.8, 90]


    ["123.45", "-67.8", "90"].map(parseInt);

    // [123, NaN, NaN]

    ```


    Let''s analyze the results. When we use parseFloat() to get floating-point results,
    everything was OK; however, when we wanted to truncate results to integer values
    with parseInt(), the output was array, and weird NaN values appeared. What happened?


    The answer lies a problem in tacit programming. (We have already seen some of
    tacit programming in An unnecessary mistake of Chapter 3, Starting Out with Functions,
    and we''ll see more in Chapter 8, Connecting Functions.) When you don''t explicitly
    show the parameters to a function, it''s there to be oversights. Look at the following
    code, which will lead us to the solution:


    ```

    ["123.45", "-67.8", "90"].map(x => parseFloat(x));

    // [123.45, -67.8, 90]


    ["123.45", "-67.8", "90"].map(x => parseInt(x));

    // [123, -67, 90]

    ```


    The reason for the unexpected behavior with parseInt() is that this function can
    also receive a second parameter—namely the radix to use when converting the string
    into a number. For instance, a call such as parseInt("100010100001", 2) will convert
    a binary string to 100010100001 into a decimal.


    > Note: You can read more about parseInt() at developer.mozilla.en/docs/Web/JavaScript/Reference/Global_Objects/parseInt,
    where the radix parameter is explained in detail. You should always provide it
    because browsers might interpret strings with a leading zero as zero, which would
    cause unwanted results.


    So, what happens when we provide parseInt() to map()? Remember that map() calls
    your mapping function with three parameters: the array value, its index, and the
    array itself. When parseInt receives these values, it ignores the radix but assumes
    that the provided index is actually a radix, and NaN values are produced since
    the original strings are not valid numbers in the given radix.'
