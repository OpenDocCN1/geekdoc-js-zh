  md: "# All about functions 55\n\nThe programming style is called pointfree (also\
    \ **point-free**) or tacit style, and its defining characteristic is that you\
    \ never specify the arguments for each function application. An advantage of this\
    \ way of coding is that it helps the writer (and the future readers of code) think\
    \ about the functions and their meanings instead of working at a low level, passing\
    \ data around, and working with it. In the shorter version of the code, there\
    \ are no extraneous or irrelevant details: if you know what the called function\
    \ does, you understand the meaning of the complete piece of code. We'll often\
    \ (but not necessarily) always work with this way in our text.\n\n# Old Unix style\n\
    Unix/Linux users are accustomed to this style because they work in a similar way\
    \ when they use pipes to pass the result of a command as input. When you write\
    \ something as `ls | grep | sort`, the output of ls is the input to grep, and\
    \ the latter's output is the input to sort — but arguments aren't written out\
    \ anywhere; they are implied. We'll come back to this in the **Pointfree** style\
    \ section of *Chapter 8, Connecting Functions.*\n\n# Working with methods\n\n\
    However, there is a case that you should be aware of: what happens if you call\
    \ an object's method?\nLook at the following code:\n\n```\nfetch(\"some/remote/url\"\
    ).then(function (data) {\nmyObject.store(data);\n});\n```\n\nIf your original\
    \ code had been written somewhere along the lines of the preceding code, then\
    \ the seemingly obvious code would be:\n\n```\nfetch(\"some/remote/url\").then(myObject.store);\
    \ // Fail!\n```\n\nWhy? Reason that in the original code, the called method is\
    \ bound to an object (myObject), but in the modified code, it is not bound and\
    \ is a free function. We can fix it by using bind():\n\n```\nfetch(\"some/remote/url\"\
    ).then(\nmyObject.store.bind(myObject)\n);\n```\n\nThis is a general solution.\
    \ When dealing with a method, you cannot just assign it; you must use bind() so\
    \ that the correct context will be available. Look at the following code:\n\n\
    ```\nconst someMethod = (someData) => {\n  return someObject.someMethod(someData);\n\
    }\n```"
