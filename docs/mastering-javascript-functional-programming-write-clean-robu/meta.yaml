  md: '# Questions


    2.1 No extra variables: Our functional implementation required using an extra
    variable, done to mark whether the function had already been called. Not that
    it matters, but could you do so without using any variables? Not that we''re telling
    you not to use any, it''s just a matter of not adding any ones, such as done,
    and only as an exercise!


    2.2 Alternating functions: In the spirit of onceAndAfter() function, you could
    write an alternator() higher-order function that gets two arguments and, on each
    call, alternatively calls one and another. The expected behavior should be as
    in the following example:


    ```

    const sayA = () => console.log("A");

    const sayB = () => console.log("B");

    ```


    ```

    const alt = alternator(sayA, sayB);


    alt(); // A

    alt(); // B

    alt(); // A

    alt(); // B

    alt(); // A

    alt(); // B

    ```


    2.3 Everything has a limit! As an extension of once(), that would let you call
    the fn() up to n times, thisManyTimes(fn,n), that would do nothing after? To give
    an example, once(fn) and thisManyTimes(fn, 1) would produce functions that behave
    the same way. Also write tests for it.


    2.4 Allow for crashing: Suppose we use once() to a function, and the first time
    that function gets called, it crashes. Here, we want to allow a second call to
    the function, hoping it wouldn''t crash again. We want an onceIfSuccess() function,
    that will get a function as a parameter and produce a new function that will run
