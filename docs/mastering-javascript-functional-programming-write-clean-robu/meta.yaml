  md: "Logical HOFs 137\n\n```\nimport { range } from \"./range\";\n\nconst fact4\
    \ = (n: number): number => {\n  let result = 1;\n  range(1, n + 1).forEach((v)\
    \ => (result *= v));\n  return result;\n};\n```\n\n```\nconsole.log(fact4(5));\
    \ // 120\n```\n\nThis definition of factorial matches the actual description:\
    \ it generates all the numbers from 1 to n includes and multiplies them—simple!\n\
    \nFor greater generality, consider expanding range () so it can generate ascending\
    \ and descending ranges of values, possibly stepping by a number other than 1.\
    \ This would allow you to replace all the loops in your code with forEach() loops.\n\
    \nAt this point, we have many ways of processing arrays to generate results, but\
    \ other objectives may be of interest, so let's move on to logical functions,\
    \ which will also simplify our coding needs.\n\n# Logical HOFs\n\nUp to now, we\
    \ have been using HOFs to produce new results. However, some other functions produce\
    \ logical results by applying a predicate to all elements of an array. (By the\
    \ way, we will see much more about HOFs in the next chapter.)\n\n> Many meanings\n\
    nA bit of terminology: the word predicate can be used in several senses (as in\
    \ predicate logic), but for us, in computer science, it has the meaning of a function\
    \ that returns true or false. OK, this isn't a very formal definition, but it's\
    \ enough for our needs. For example, saying that we will filter an array based\
    \ on a predicate that we get to decide which elements are included or excluded\
    \ depending on the predicate's result.\n\nUsing these functions implies that your\
    \ code will become shorter: you can get results corresponding to a whole set of\
    \ values with a single line of code.\n\n# Filtering an array\n\nWe will encounter\
    \ a common need to filter the elements of an array according to a specific condition.\
    \ The filter() method lets you inspect each element of an array in the same fashion\
    \ as map(). The difference is that instead of producing a new element, the result\
    \ of your function determines whether"
  merge: -1
