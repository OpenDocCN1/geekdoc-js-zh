  md: "We can work with events, but it would be better to wrap workers in promises\
    \ so we can apply the async functions we developed in the previous section.\n\n\
    # Events or promises?\nWorkers can send multiple messages to their caller. If\
    \ this is the case, a promise won't be a good idea because it will be resolved\
    \ after the first result, disregarding future messages. In most cases, a single\
    \ result is expected, so promises are OK, but keep in mind there are other possibilities.\n\
    \nA direct way to wrap a worker would be the following:\n\n```\n// workers/fib_worker_test_with_promise.ts\n\
    \\import { Worker } from \"worker_threads\";\n\nconst callWorker = (filename:\
    \ string, value: unknown) =>\n  new Promise((resolve) => {\n    const worker =\
    \ new Worker(filename);\n    worker.on(\"message\", resolve);\n    worker.postMessage(value);\n\
    \  });\n\nconsole.log(\"START\");\nconst result = await callWorker(\"./fib_worker.js\"\
    , 40);\nconsole.log(\"AWAITED\", result);\nconsole.log(\"END\");\n```\n\n```\n\
    /* Result:\nSTART\nAWAITED 102334155\nEND */\n```\n\nThe callWorker object creates\
    \ a promise that will resolve when the worker sends back a result. Results are\
    \ as expected: the START text, the AWAITED result from the worker, and the END\
    \ text. Note that we are using a point-free style for processing the message event.\n\
    \nThese code examples work well, but they have a performance issue: every time\
    \ you call them, a worker is created (meaning that its JavaScript code must be\
    \ read, parsed, and processed), so there will be delays. Let's think about ways\
    \ to avoid that."
  merge: -1
