  md: '# Side effects


    What are side effects? We can define these as a change in state or an interaction
    with outside elements (the user, a web service, another computer—whatever) that
    occurs during the execution of some calculations or a process.


    There’s a possible misunderstanding of the scope of this meaning. In everyday
    speech, when people speak of side effects, it’s a bit like talking about collateral
    damage—some unintended consequences for a given action; however, in computing,
    we include every effect or change outside the function. If you write a function
    to perform a `console.log()` call to display a result, that would be considered
    a side effect, even if it’s exactly what you intended the function to do in the
    first place!


    In this section, we will look at the following:


    +   - Common side effects in JavaScript programming

    - The problems that global and inner states cause

    - The possibility of functions mutating their arguments

    - Some functions that are troublesome


    # Usual side effects


    In programming, there are (too many!) things that are considered side effects.
    In JavaScript programming, including both front- and backend coding, the more
    common ones you may find include the following:


    +   - Changing global variables.

    - Mutating objects received as arguments.

    - Performing any I/O, such as showing an alert message or logging some text.

    - Working with, changing, the filesystem.

    - Querying or updating a database.

    - Calling a web service.

    - Querying or modifying the DOM.

    - Triggering any external process.

    - Just calling another function that produces a side effect of its own. You could
    say that impurity is contagious: a function that calls an impure function automatically
    becomes impure on its own!


    With this definition, let’s start looking at what can cause functional impurity
    (or referential opaqueness).'
