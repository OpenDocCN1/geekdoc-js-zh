  md: '# Contributors


    Federico Kereki is a Uruguayan systems engineer, with a master''s degree in education,
    and 30 years of experience as a consultant, system developer, and writer.


    He is taught a subject matter expert at Globant, where he gets to use a good mixture
    of development frameworks, programming tools, and operating systems. He is familiar
    with languages such as JavaScript and TypeScript; modern backend runtime environments
    as Node.js and Deno; frontend frameworks such as React, Vue, and Angular; and
    services, microservices, and cloud components for systems architecture.


    He has taught several computer science courses at Universidad de la República,
    Universidad ORT Uruguay, and Universidad de la Empresa. He has also written texts
    for these courses.


    He has written articles and booklets on programming, web development, security,
    and open source topics for blogs, magazines, and websites. He has also written
    several books, including Modern JavaScript Web Development Cookbook and the upcoming
    Data Structures and Algorithms in JavaScript.


    Kereki has given talks on functional programming at public conferences (such as
    JSCONF 2016 and Development Week Santiago 2019) and has used functional programming
    techniques to develop internet systems for businesses in Uruguay and abroad.


    His current interests tend toward software quality and software engineering –
    with Agile methodologies topmost – while on the practical side, he works with
    diverse languages, tools, and frameworks, and Free/Lib Open Source Software (FLOSS)
    wherever possible!


    He resides, works, and teaches in Uruguay, but he wrote the first edition of this
    book while working in India, and the second edition during a sojourn in Mexico;
    the third edition was the first actually completed in his homeland!'
