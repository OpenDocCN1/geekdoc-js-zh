  md: "# Programming Declaratively - A Better Style\n\n```\n// copy.ts\n\nconst objCopy\
    \ = <T>(obj: T): T => {\n  const copy = Object.create(Object.getPrototypeOf(obj));\n\
    \  Object.getOwnPropertyNames(obj).forEach((prop: string) =>\n    Object.defineProperty(\n\
    \      copy,\n      prop,\n      Object.getOwnPropertyDescriptor(obj, prop) as\
    \ string\n    )\n  );\n  return copy;\n};\n\nconst myObj = { fk: 22, st: 12, desc:\
    \ \"couple\" };\nconst myCopy = objCopy(myObj);\n\nconsole.log(myObj, myCopy);\n\
    // {fk: 22, st: 12, desc: \"couple\"}, twice\n```\n\nThe idea is: we create a\
    \ copy with the same prototype as the original object, and for each property in\
    \ the original, we define an equivalent property in the copy. The function's signature\
    \ makes clear that the input and output types are the same. One particular detail:\
    \ given the loop we are writing, we know for sure Object.getOwnPropertyDescriptor(obj,\
    \ prop) will be a string (and not undefined), yet TypeScript cannot tell; as string\
    \ solves this.\n\n# Shallow or deep?\n\nYes, of course we could have written myCopy={myObj},\
    \ but where's the fun in that? It would be better, but we need a example to use\
