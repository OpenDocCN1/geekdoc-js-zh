    You can now extend all classes as desired - but remember our advice about being
    very, very careful!


    # Finding the optimum


    Let''s end this section by creating an extension of the find () method. Suppose
    we want to find the optimum value - let''s suppose the maximum - of an array of
    numbers. We could make do with:


    ```

    // optimum.ts


    const findOptimum = (arr: number[]): number =>

    Math.max(...arr);


    const myArray = [22, 9, 60, 12, 4, 56];nconsole.log(findOptimum(myArray)); //
    60

    ```


    Now, is this sufficiently general? There are at least a pair of problems with
    this approach. First, are you sure that the optimum of a set will always be the
    maximum? If you were considering several mortgages, the one with the lowest interest
    rate would be the best, right? To assume that you always want the maximum of a
    set is too restrictive.


    > You could do a roundabout trick: if you change the signs of all the numbers
    in an array, find its maximum, and change its sign, you actually get the minimum
    of the array. In our case, -findOptimum(myArray.map ((x) => -x)) would correctly
    produce 4, but it''s not easily understandable code.


    Second, this way of finding maximum depends on each option having a numeric value.
    But how would you find the optimum if such a value didn''t exist? The usual way
    depends on comparing elements with each other and picking the one that comes on
    top:


    +   1. Compare the first element with the second and keep the best of those two.

