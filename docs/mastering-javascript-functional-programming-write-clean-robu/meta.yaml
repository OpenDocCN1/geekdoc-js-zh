  md: "# Transformations 135\n\nI think the recursive one is nicer and more aligned\
    \ with the theme of this book. Still, it's up to you, really—although you don't\
    \ feel comfortable with the ternary operator, then the recursive version is definitely\
    \ not for you!\n\nIf you wish to polyfill these functions (despite our suggestions\
    \ not to), it's not complex, and is similar to what we did with the average ()\
    \ previous method. I took care not to create any extra methods:\n\n```\n// continued...\n\
    \nif (!Array.prototype.flat) {\n  Array.prototype.flat = function (this, n): any[]\
    \ {\n    if (n === undefined || n === 1) {\n      return flatOne(this as any[]);\n\
    \    } else if (n === Infinity) {\n      return flatAll(this as any[]);\n    }\
    \ else {\n      return flatOne(this as any[]).flat(n - 1);\n    }\n  }\n}\n```\n\
    \nOur flatOneX() and flatAllX() methods are just copies of what we developed before,\
    \ and you'll recognize the code of our previous flat2() function at the end of\
    \ our implementation.\n\nFinally, emulating flatMap() is simple in itself, and\
    \ we can skip it because it's just a matter of applying map() first, and then\
    \ flat (); no big deal!\n\nWe have seen how to work with arrays in several ways,\
    \ but sometimes you need isn't really well served by the functions we have seen.\
    \ Let's move on to more general ways of looping, for greater power.\n\n# More\
    \ general looping\n\nThe preceding examples we've seen all through arrays, some\
    \ do that. However, sometimes, you need to load, but the required process doesn't\
    \ fit map () or reduce (). So, what can be done in such cases? There's a forEach()\
    \ method that can help. mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array/ForEach().\n\
    \nYou must provide a callback that will receive the value, the index, and the\
