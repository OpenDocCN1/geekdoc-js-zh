  md: "# Working with parallel functions 159\n\n![](bbox=[0.15, 0.1, 0.85, 0.365])\n\
    \nFigure 5.9 - The page remains responsive even as calculations take a long time\n\
    \nOK, using workers clearly helps if you have lots of calculations to perform\
    \ at the frontend; let's see a similar implementation for the backend.\n\n# A\
    \ backend worker\n\nLet's see a quick example of a backend worker, as we could\
    \ use Node.js or similar. The example will be very bare-bones; in real life, we'd\
    \ include route definitions and much more, but we want to focus on worker creation\
    \ and usage here.\n\nOur worker is similar to the web worker; the differences\
    \ are easy to understand:\n\n```\n// workers/fib_worker.ts\n\nimport { parentPort\
    \ } from \"worker_threads\";\n\nfunction fib(n: number): number {\n  return n\
    \ < 2 ? n : fib(n - 2) + fib(n - 1);\n}\n\nparentPort!.on(\"message\", (m: number)\
    \ => {\n  parentPort!.postMessage(fib(m))\n});\n```"
