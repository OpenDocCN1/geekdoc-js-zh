  md: '# # How do we work with JavaScript?


    ![](bbox=[0.135, 0.098, 0.862, 0.517])


    Figure 1.2 – Compatibility table specifically for Node.js


    So, what can you do if you want to code using the latest version, but the available
    one is an earlier, poorer one? Or what happens if most of your users are using
    older browsers, which don''t support the fancy features you''re keen on using?
    Let''s see some solutions for this.


    # Using transpilers


    To get out of availability and compatibility problem, there are a couple of transpilers
    you can use. Transpilers take your original ES13 code, which might use the most
    modern JavaScript features, and transforms it into equivalent JS5 code. It''s
    a source-to-source transformation, instead of source-to-object code that would
    be used in compilation. You can code using advanced ES13 features, but the user''s
    browsers will receive JS5 code. A transpiler will also keep you up with upcoming
    versions of the language, despite the time needed by browsers to adopt new standards
    across desktop and mobile devices.'
  merge: -1
