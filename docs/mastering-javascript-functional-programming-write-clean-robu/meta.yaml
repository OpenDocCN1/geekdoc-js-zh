  md: '# 6

    # Producing Functions

    # Higher-Order Functions


    In Chapter 5, Programming Declaratively, we worked with some declarative code
    so that we could gain understandability and more compact, shorter code. In this
    chapter, we will go further toward **higher-order functions (HOFs)** and develop
    our own. We can roughly classify the results that we are going to get into three
    groups:


    +   - Wrapped functions: These keep their original functionality while adding
    some kind of feature. In this group, we can consider logging (adding log production
    capacity to any function), timing (producing time and performance data for a given
    function), and memoization of functions and promises (caching results to avoid
    future rework).


    +   - Altered functions: These differ in some key points from their original versions.
    Here, we can include the `once()` function (we covered this in Chapter 2, Thinking
    Functionally), which changes the original function so that it only runs once;
    functions such as `not()` or `invert`, which alter what the function returns;
    arity-related conversions, which produce a new function with a fixed number of
    parameters; and throttling and debouncing for performance.


    +   - Other productions: These provide new operations, turn functions into promises,
    allow enhanced search functions, decouple methods from objects, transform them
    into plain functions, and the other way around, converting functions into methods.
    We shall leave a special case – *transducers* – for Chapter 8, Connecting Functions.


    # Wrapping functions – keeping behavior


    In this section, we will consider HOFs that provide a wrapper around other functions
    to enhance them in some way but without altering their original objective. In
    terms of design patterns (we''ll be revisiting **Chapter 11, Implementing Design
    Patterns**), we can also use of **decorators**. This pattern is based on the concept
    of adding some behavior to an object (in case, a function) without affecting other
    objects. The term decorator is also popular because of its usage in frameworks,
    such as Angular, or (in an experimental mode) for general programming in JavaScript.'
  merge: -1
  pgno: 189
