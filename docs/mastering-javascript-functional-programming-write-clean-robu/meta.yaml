    and the accumulated value.


    Why should you always try to reduce() or reduceRight() instead of hand-coded loops?
    The following points might answer this question:


    +   - All aspects of loop control are automatically taken care of, so you don''t
    even have the possibility of an off-by-one mistake

    - The initialization and handling of the result values are also implicit

    - Unless you work really hard at impuring and modifying the original array, your
    code will be free of side-effects


    Now that we can reduce() an array, let''s see some of its practical use cases.


    # Summing an array


