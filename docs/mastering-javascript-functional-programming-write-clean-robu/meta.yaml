  md: "Altering a function's behavior\n\nAll logic is as before, with a couple of\
    \ additional details:\n\n+   - We are now making explicit that the memoized function\
    \ returns a promise (Promise<A>) of some generic type A\n- If the promise is rejected,\
    \ we add code to delete the cached promise, so a future call will go out again\n\
    \nOur promiseMemoize() function can deal with errors, allowing future retries\
    \ of rejected calls; good! Now let's look at a different case, where we want to\
    \ change how a function actually works.\n\n# Altering a function's behavior\n\n\
    In the previous section, we considered some ways of wrapping functions so they\
    \ maintain their original functionality, even though they've been enhanced in\
    \ some way. Now, we'll turn to modifying what the functions do so that the new\
    \ results differ from their original ones.\n\nWe'll be covering the following\
    \ topics:\n\n+   - Revisiting the problem of having a function work, but just\
    \ once\n- Negating or inverting a function's result\n- Changing the arity of a\
    \ function\n- Throttling and debouncing functions for performance\n\nLet's get\
    \ started!\n\n# Doing things once, revisited\n\nIn Chapter 2, Thinking Functionally,\
    \ we went through an example of developing an FP-style solution for a simple problem:\
    \ fixing things so that a given function works only once. We defined once () with\
    \ an arrow function then; let's go with a standard function for variety:\n\n```\n\
    // once.ts\nfunction once<T extends (...args: any[])> => void(\n  f: T\n): (...args:\
    \ Parameters<T>) => void {\n  let done = false;\n\n  return (...args: Parameters<T>)\
    \ => {\n    if (!done) {\n      done = true;\n    }\n  }\n```"
