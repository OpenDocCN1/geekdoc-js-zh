  md: "Let's do another property test. Suppose we want to test a shuffling algorithm;\
    \ we might decide to implement the Fisher-Yates version along the lines of the\
    \ code. (For more on this algorithm—including some pitfalls for the unwary programmer—see\
    \ en.wikipedia.org/wiki/Fisher-Yates_shuffle.). As implemented, the algorithm\
    \ doubly impure: it doesn't produce the same result (obviously!) and it modifies\
    \ its input parameter:\n\n```\n// shuffle.test.ts\n\nconst shuffle = <T>(arr:\
    \ T[]): T[] => {\n  const len = arr.length;\n  for (let i = 0; i < len; i++) {\n\
    \    let r = Math.floor(Math.random() * (len - i));\n    arr[i], arr[i + r] =\
    \ [arr[i + r], arr[i]];\n  }\n  return arr;\n};\n\nconst xxx = [11, 22, 33, 44,\
    \ 45, 55, 66, 77, 88];\nconsole.log(shuffle(xxx));\n// [55, 77, 88, 44, 33, 11,\
    \ 22]\n```\n\nHow could you test this algorithm? Given that the result won't be\
    \ predictable, we can check for the properties of its output. We can call it with\
    \ a known array and then test some properties—see Question 4.13 for an important\
    \ detail:\n\n```\n// continued...\n\ndescribe(\"shuffleTest\", function () {\n\
    \  it(\"shouldn't change the array length\", () => {\n    const a = [22, 9, 60,\
    \ 12, 4, 56];\n    shuffle(a);\n    expect(a.length).toBe(6);\n  });\n\n  it(\"\
    shouldn't change the values\", () => {\n    const a = [22, 9, 60, 12, 4, 56];\n\
    \    shuffle(a);\n    expect(a.includes(22)).toBe(true);\n    expect(a.includes(9)).toBe(true);\n\
    \    expect(a.includes(60)).toBe(true);\n  });\n```"
