  md: "The idea is precisely the same; when the message event occurs, we call fib()\
    \ to calculate the corresponding Fibonacci number, and we use postMessage() to\
    \ send it to the caller.\nThe caller would be simple to:\n\n```\n// workers/fib_worker_test.ts\n\
    import { Worker } from \"worker_threads\";\nconst worker = new Worker(\"./fib_worker.js\"\
    );\n\nconsole.log(\"START\");\nworker.postMessage(40);\nconsole.log(\"END\");\n\
    \nworker.on(\"message\", (msg) => {\n  console.log(\"MESSAGE\", msg);\n  worker.terminate();\n\
    });\n```\n\nThe code is totally analogous to the frontend code. We create a worker\
    \ (with the new Worker() call), we post a message to it with postMessage(), and\
    \ listen to the worker's message event. When we receive the computed result, we\
    \ display it, and terminate() the worker. Running this code produces the following\
    \ simple result—the last line takes a while to appear\n\n```\nSTART\nEND\nMESSAGE\
    \ 102334155\n```\n\nWe have seen to use workers in event-oriented programming,\
    \ but this isn't particularly suited to our desired FP way of working; let's fix\
    \ that.\n\n# Workers, FP style\n\nWorkers are appropriate for FP programming for\
    \ the following reasons:\nWorkers run in separate contexts, they cannot interact\
    \ with the DOM or global variables.\nAll communication is done through messages;\
    \ otherwise, workers are separated from the caller.\n\n+   - Data passed to and\
    \ from workers is a copy; it is serialized before it is passed and deserialized\
    \ when received. Even if the worker were to modify the arguments it received,\
    \ that wouldn't cause any problem for the caller."
