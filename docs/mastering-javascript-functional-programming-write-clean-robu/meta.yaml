  md: '# Why use FP?


    +   - FP isn''t overly complex to learn: Some of the FP languages are different
    from JavaScript, but the differences are mostly syntactic. Once you learn the
    basic concepts, you''ll see that you can get the same results in JavaScript as
    with FP languages.


    It may also be relevant to mention that several modern frameworks, as the React
    and the Redux combination, include FP ideas.


    For example, in React, it''s said that the view (whatever the user gets to see
    at a given moment) is a function of the current state. You use a function to compute
    what HTML and CSS must be produced at each moment, in a black-box fashion.


    Similarly, in Redux, we have the concept that actions are processed by reducers.
    An action provides some data, and a reducer is a function that produces the new
    state for the application in a functional way out of the current state and the
    provided data.


    So, because of the theoretical advantages (we''ll be getting to those in the following
    section) and the practical ones (such as getting to use the latest frameworks
    and libraries), it makes sense to consider FP coding. Let''s get on with it.


    # Why use FP?


    Throughout the years, there have been many programming styles and fades. However,
    FP has proven resilient and is of great interest today. Why would you to use FP?
    Rather, the first question to ask be, what do you need? And only then, does FP
    get you that? We will answer these important questions in the following sections.


    # What we need


    We can certainly agree that the following list of concerns is universal. Our code
    should have the following qualities:


    +   - Modular: The functionality of your program should be divided into independent
    modules, each of which contains a part of the solution. Changes in a module or
    function shouldn''t affect the rest of the code.


    +   - Understandable: A reader of your program should be able to discern its components,
    functions, and relationships without undue effort. This is closely linked with
    the maintainability of your code; your code will have to be maintained in the
    future, whether to be changed or to have new functionality.


    +   - Testable: Unit tests try out parts of your program, verifying their behavior
    independently of the rest of the code. Your programming style should favor writing
    code that simplifies the job of writing unit tests. Unit tests are also like documentation
    in that they can help readers understand what the code is supposed to do.'
