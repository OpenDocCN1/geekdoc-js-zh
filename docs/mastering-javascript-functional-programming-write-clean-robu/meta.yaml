  md: "# Behaving Properly — Pure Functions\n\n```\ncurrentYear: number\n): boolean\
    \ => birthYear - 18;\n```\n\nObviously, we'll have to change all the calls to\
    \ provide the required currentYear argument (we could use partial application,\
    \ as we will see in Chapter 7, Transforming Functions). The responsibility for\
    \ the value of currentYear remains outside of the function, before, but we have\
    \ managed to avoid a defect:\n\n```\nconsole.log(isOldEnough(1960, 2022)); //\
    \ true\nconsole.log(isOldEnough(2010, 2022)); // false\n```\n\nWe can apply this\
    \ to our peculiar round() function. As you will, the function worked by accumulating\
    \ the differences by rounding and deciding whether to round up or down depending\
    \ on the sign of accumulator. We avoid using that state, but we can split off\
    \ the rounding part from the accumulating part. Our original code (with fewer\
    \ commits, no logging, and using arrows throughout) would be as follows:\n\n```\n\
    // roundFix.ts\n\nconst roundFix1 = (()) => {\n  let accum = 0;\n  return (n:\
    \ number): number => {\n    const nRounded =\n      accum > 0 ? Math.ceil(n) :\
    \ Math.floor(n);\n    accum += n - nRounded;\n    return nRounded;\n  };\n}}();\n\
    ```\n\nThe newer version (see Question 4.6 for more about this) would have two\
    \ parameters:\n\n```\n// continued...\n\nconst roundFix2 = (accum: number, n:\
    \ number) => {\n  const nRounded = accum > 0 ? Math.ceil(n) : Math.floor(n);\n\
    \  accum += n - nRounded;\n  return { accum, nRounded };\n};\n```"
