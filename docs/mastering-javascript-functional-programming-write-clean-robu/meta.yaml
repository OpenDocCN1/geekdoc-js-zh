  md: "# Programming Declaratively – A Better Style\n\n```\nEND\n*/\n```\n\nThe results\
    \ are previsible: we get the START text, then after 1 second (1,000 milliseconds)\
    \ later, the result of the fake API call (229), and finally the END text. What\
