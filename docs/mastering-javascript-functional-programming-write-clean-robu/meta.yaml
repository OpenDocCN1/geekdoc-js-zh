  md: "# Altering a function's behavior\n\n```\nfunction onceAndAfter<T extends (...args:\
    \ any[]) => any>(\n  f: T,\n  g: T\n): (...args: Parameters<T>) => ReturnType<T>\
    \ {\n  let done = false;\n\n  return ((args: Parameters<T>): ReturnType<T> =>\
    \ {\n    if (!done) {\n      done = true;\n      return f(...args);\n    } else\
    \ {\n      return g(...args);\n    }\n  }) as T;\n}\n```\n\nWe can rewrite this\
    \ if we remember that functions are first-order objects. Instead of a flag to\
    \ remember which function to call, we can use a toCall variable to directly store\
    \ whichever function needs to be called. Logically, that variable will be initialized\
    \ to the first function but will then change to the second one. The following\
    \ code implements that:\n\n```\n// continued...\n```\n\n```\nfunction onceAfter2<T\
    \ extends (...args: any[]) => any>(\n  f: T,\n  g: T\n): (...args: Parameters<T>)\
    \ => ReturnType<T> {\n  let toCall = f;\n\n  return ((args: Parameters<T>): ReturnType<T>\
    \ => {\n    let result = toCall(...args);\n    toCall = g;\n    return result;\n\
    \  }) as T;\n}\n```"
