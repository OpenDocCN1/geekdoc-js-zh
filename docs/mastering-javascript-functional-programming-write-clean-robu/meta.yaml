  md: '112 Programming Declaratively – A Better Style


    # Transformations


    The first set of operations that we are going to consider works on an array and
    processes it the in the base of a function to produce certain results. There are
    several possible results: a single value with the reduce () operation, a new array
    with map (), or just about any kind of result with forEach ().


    > Caring about inefficiency

    If you go around, you will find some articles declaring that these functions are
    efficient because a loop does be faster. This, while possibly true, is practically
    irrelevant. Unless your code really suffers from speed problems and you can determine
    that the slowness derives from using HOFs, trying to avoid them using longer code,
    with a higher probability of bugs, simply doesn''t make sense.


    Let’s start by considering the preceding list of functions in order, beginning
    with the most general of all, which as we’ll see, even be used to emulate the
    rest of the transformations in this chapter!


    # Reducing an array to a value


    Answer this question: how many times have you had to loop through an array, performing
    an operation (say, summing) to produce a single value (maybe the sum of all the
    array values) as a result? Probably many, many, many times. This kind of operation
    can usually be implemented functionally by applying reduce () and reduceRight
    (). Let’s start with the former!


    > To fold or not to fold

    Time for some terminology! In FP parlance, we speak of folding operations: reduce
    () is fold (for fold left) or just plain fold, reduceRight () is correspondingly
    known as fold. In category theory terms, both operations are catamorphisms: the
    reduction of all the values in a container down to a single result.


    The inner workings of the reduce () function are illustrated in Figure 5.1:'
