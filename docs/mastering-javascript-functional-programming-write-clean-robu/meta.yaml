    \ state as Redux. This kind of code wouldn't be possible if we couldn't handle\
    \ functions (storing and recalling them) as first-class objects.\n\n# An unnecessary\
    \ mistake\n\nThere is, however, a common (though, in fact, harmless) mistake that\
    \ is usually made. You often see code like this:\n\n```\nfetch(\"some/url\").then(function(data)\
    \ {\n  processResult(data);\n});\n```\n\n```\nfetch(\"some/url\").then((data)\
    \ => processResult(data));\n```\n\nWhat does this code do? The idea is that a\
    \ remote URL is fetched, and when the data arrives, a function is called - and\
    \ this function calls processResult with data as an argument. To say that, in\
    \ the .() part, we want a function that, given data, calculates processResult(data).\
    \ But we don't already have such a function?\n\nThere is a rule that you can apply\
    \ whenever you see something like the following:\n\n```\nfunction someFunction(someData)\
    \ {\n  return someOtherFunction(someData);\n}\n```\n\nThis rule states that you\
    \ can replace code replacing the preceding code with just someFunction. So, in\
    \ our example, we can directly write what follows:\n\n```\nfetch(\"some/url\"\
    ).then(processResult);\n```\n\nThis code is equivalent to the previous method\
    \ we looked at (although it is infinites quicker since you avoid one function\
    \ call), but it is simpler to understand?\n\nSome terminology\nIn lambda functions,\
    \ we are replacing λ.func x simply func - this is called an η (eta) conversion,\
    \ or more specifically, an η reduction. (If you were to do it the other way, it\
    \ would be an η abstraction.) In our case, it could be considered a (very, very\
    \ small!) optimization, but its main advantage is shorter, more compact code."
