    – A Core Concept


    In Chapter 2, Thinking Functionally, we discussed an example of FP thinking, but
    now, let''s look at the basics and review functions.


    In this chapter, we''ll do the following:


    +   - Discuss functions in JavaScript, including how to define them, with a particular
    focus on arrow functions

    - Learn about currying and functions as first-class objects

    - Explore several ways of using functions in an FP way


    After going through all this content, you''ll be up to date with the generic and
    specific concepts relating to functions, which are, after, at the core of FP!


    # ## All about functions


    Let''s start with a short review of functions in JavaScript and their relationship
    to FP concepts. We will begin with something that we mainly mentioned in the Functions
    as first-class objects section of Chapter 1, Becoming Functional, and then go
    in a couple of places in Chapter 2, Thinking Functionally, and then go on to several
    considerations about their usage in actual coding. In particular, we will be looking
    at the following:


    +   - Some basic concepts about lambda calculus, which is the theoretical basis
    for FP

    - Arrow functions, which are the most direct translation of lambda calculus into
    JavaScript

    - Using functions as first-class objects, a key concept in FP'
