  md: '# Programming Declaratively

    – A Better Style


    Up to now, we haven''t really been able to appreciate the possibilities of functional
    programming (FP) as it pertains to working in a higher-level, declarative fashion.
    We will correct this and start producing shorter, more concise, and easier-to-understand
    code, by using some higher-order functions (HOFs) — that is, functions that take
    functions as parameters, such as the following:


    +   - reduce() and reduceRight() to apply an operation to a whole array, reducing
    it to a single result

    - map() to transform one array into applying a function to each of its elements

    - flat() to make a single array out of an array of arrays

    - flatMap() to mix together mapping and flattening

    - forEach() to simplify writing loops by abstracting the necessary looping code


    We''ll also be able to perform searches and selections with the following:


    +   - filter() to pick some elements from an array

    - find() and findIndex() to search for elements that satisfy a condition

    - A pair of predicates, every() and some(), to check an array for a Boolean test


    Using these functions will let you work more declaratively, and you''ll see that
    your focus will shift to what you need to do and not how much it''s going to be
    done; the details are hidden inside your functions. Instead of writing a series
    of possibly nested loops, we''ll focus on functions as building blocks to pick
    your desired result.


    We will use these functions to work with events in a declarative style, as we
    will see in Chapter 11, Implementing Design Patterns, when we use the observer
    pattern. We will also be able to work in a fluent fashion, in which the output
    of a function becomes the input of the next one, a style we will look at later.'
