  md: "Reducing side effects is a good goal in FP, but we shouldn't go overboard!\
    \ So, let's think of how to avoid using impure functions, if possible, and how\
    \ to deal with them if not, looking for the best way to contain or limit their\
    \ scope.\n\n# Avoiding impure functions\n\nEarlier in this chapter, we saw the\
    \ most common reasons for using impure functions. Let's now consider how we can\
    \ reduce the number of impure functions, even when doing away with all of them\
    \ isn't really feasible. Basically, we'll have two methods for this:\n\n+   -\
    \ Avoiding the usage of state\n- Using a programming pattern, injection, to control\
    \ impurities\n\n# Avoiding the usage of state\n\nWith regard to the usage of the\
    \ global state—both getting and setting it—the solution is well known. The key\
    \ points to this are as follows:\n\n+   - Provide whatever is needed of the global\
    \ state to the arguments\n- If the function needs to update the state, it shouldn't\
    \ do it directly, but instead produce a new version of the state and return it\n\
    - It should be the caller's responsibility to take the returned state, if any,\
    \ and update the global state\n\nThis is the technique Redux uses for its reducers.\
    \ (We saw this in the What FP is not section of Chapter 1, Becoming Functional,\
    \ and the Functions as objects section of Chapter 3, Starting Out with Functions.)\
    \ The signature for a reducer is `(previousState, action) => newState`, meaning\
    \ that it takes a state as parameters and returns a new state as the result. Most\
    \ specifically, the reducer is not supposed to change the `previousState` argument,\
    \ which might remain untouched (we'll learn more about this in Chapter 10, Enuring\
    \ Purity).\n\nFor our first version of the `isOldEnough()` function, which used\
    \ a global `limitYear` variable, the change is simple enough: we provide `limitYear`\
    \ as a parameter for the function. With this change, it will become pure since\
    \ it will produce its result using only its parameters.\n\nEven better, we should\
    \ provide the current year and let the function do the math instead of forcing\
    \ the caller to do so. Our newer version of the usage age test could be as follows:\n\
    \n```\n// isOldEnough.ts\nconst isOldEnough3 = (\n  birthYear: number,\n```"
