  md: "# A higher-order solution\n\nIf we don't want to modify the original function,\
    \ we can create a higher-order function, which we'll (inspiringly!) name once().\
    \ This function will receive a function as a parameter and return a new function,\
    \ which will work only once. (As we mentioned previously, we'll be seeing of higher-order\
    \ functions later; in particular, see the Doing things once, revisited section\
    \ of Chapter 6, Producing Functions).\n\nMany solutions\nUnderscore and Lodash\
    \ already have a similar function, invoked as _once(). Ramda also provides R.once(),\
    \ and most FP libraries include similar functionality, so you wouldn't have to\
    \ program it on your own.\n\nOur once() may seem imposing at first, but as you\
    \ get accustomed to working in an FP fashion, you'll get used to this sort of\
    \ code and find it to be quite understandable:\n\n```\n// once.ts\nconst once\
    \ = <FNType extends (...args: any[]) => any>(\nfn: FNType\n) => {\n  let done\
    \ = false;\n\n  return (...args: Parameters<FNType>) => {\n    if (!done) {\n\
    \      done = true;\n      return fn(...args);\n    }\n  } as FNType;\n};\n```\n\
    \nLet's go over some of the finer points of this function:\n\n+   - Our once()\
    \ receives a function (fn) as its parameter and returns a new function, of the\
    \ same type. (We'll discuss this typing in more detail shortly.)\n- We define\
    \ an internal, private done variable, by taking advantage of closure, in Solution\
    \ 7. We opted not to call it clicked (as we did previously) because you don't\
    \ necessarily need to click on a button to call the function; we went for a more\
    \ general term. Each time you apply once() to some function, a new, distinct done\
    \ variable will be created and will be accessible only from the returned function."
