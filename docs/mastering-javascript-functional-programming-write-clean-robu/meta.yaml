    \ { key: string }; any }, F extends (arg0: any, ...args: T) => any>(obj: O, fn:\
    \ F) (\n  obj.prototype[fn.name] = function (\n    this: Parameters<F>[0],\n \
    \   ...args: T\n  ): ReturnType<F> {\n    return fn(this, ...args);\n  }\n)\n\
    ```\n\nLet's see the data types we added:\n\n+   - T is the generic type of the\
    \ parameters that we'll pass to our new methodized function\n- O is the object's\
