  md: '# Applying an operation – map()


    Processing lists of elements and applying some kind of operation to each of them
    is a quite common pattern in computer programming. Writing loops that systematically
    go through all the elements in an array or collection


    In mathematics, a map is a transformation of elements from a domain into its codomain,
    but also into numbers, or strings into strings: the important point is that you
    have a way to transform an element of the first kind or domain (think type) into
    an element of the second kind, or codomain. In our case, this will mean taking
    the elements of an array and applying a function to each of them to produce a
    new array. In more computer-like terms, the map () transforms an array of inputs
    into outputs.


    Names, names, names...\ Some terminology: we would say that an array is a functor
    because it provides a mapping operation with some specified properties, which
    we shall see later. And, in category theory, we''ll talk about a little in Chapter
    12, Building Better Containers, the mapping operation itself would be called a
    morphism.


    The inner workings of the map () operation can be seen in Figure 5.3:


    ![](bbox=[0.329, 0.563, 0.671, 0.863])


    Figure 5.3 – The map() operation transforms each element of the input array by
    applying a mapping function'
