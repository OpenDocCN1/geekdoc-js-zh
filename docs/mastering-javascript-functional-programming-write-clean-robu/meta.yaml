  md: "We could rewrite our earlier Ajax example as follows:\n\n```\n$.get(\"some/url\"\
    , data, (result, status) => {\n// check status, and do something\n// with the\
    \ result\n});\n```\n\nA new version of the factorial code could be like the following\
    \ code - the only difference is the usage of an arrow function:\n\n```\n// factorial.js,\
    \ continued...\n\nconst fact2 = (n) => {\nif (n === 0) {\n  return 1;\n} else\
    \ {\n  return n * fact2(n - 1);\n}\n}\n```\n\nFunctions, anonymous\nArrow functions\
    \ are usually called anonymous functions because of their lack of a name. If you\
    \ need to refer to an arrow function, you'll have to assign it to a variable or\
