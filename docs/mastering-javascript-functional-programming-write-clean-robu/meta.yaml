    Repeat Yourself (DRY), usual advice!


    We have now gone through multiple ways of solving our “do something only once”
    problem – as we''ve seen, they were not good! Let''s think about the problem functionally
    so that we get a more general solution.


    # A functional solution to our problem


    Let''s try to be more general; after all, requiring that some function or other
    be executed only once isn''t that outlandish, and may be required elsewhere! Let''s
    lay down some principles:


    +   - The original function (the one that may be called only once) should do whatever
    it is expected to do and nothing else

    - We don''t want to modify the original function in any way

    - We need a new function that will call the original one only once

    - We need a general solution that we can apply to any number of original functions


    > SOLID base

    The first principle listed previously is the single responsibility principle (the
    S in the SOLID acronym), which states that every function should be responsible
    for a single functionality. More on SOLID, check the article by Uncle Bob (Robert
    C. Martin, who wrote the few principles) at unclebob.com/ArticleS.UncleBob.PrinciplesOfOod.


    Can we do it? Yes, and we''ll write a higher-order function, which''ll be able
    to produce a new function that will work only once. Let''s see how! We will introduce
    higher-order functions in Chapter 6, Producing Functions. There, we''ll go about
    testing our functional solution, as well as making some enhancements to it.'
