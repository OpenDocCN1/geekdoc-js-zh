  md: "# Pure functions 85\n\nWe will return to this idea in Chapter 6, Producing\
    \ Functions, but let's look at an example done by hand. The Fibonacci sequence\
    \ is always used for this example because of its simplicity and hidden calculation\
    \ costs. This sequence is defined as follows:\n\n+   * For n=0, fib(n)=0\n* For\
    \ n=1, fib(n)=1\n* For n>1, fib(n)=fib(n-2)+fib(n-1)\n\n> Fibonacci who?\nFibonacci's\
    \ life actually comes from itali Bonacci or son of Bonacci. He is best known for\
    \ introducing the digits of 0-9 as we know them today, instead of the cumbersome\
    \ Roman numbers. He derived the sequence named after him as the answer to a puzzle\
    \ involving rabbits. You can read more about it, and Fibonacci's life in general,\
    \ at en.wikipedia.org/wiki/Fibonacci_number#History or plus.maths.org/content/life-and-fibonacci-numbers.\n\
    \nIf you run the sequence with 0, 1, and from that point onward, each term is\
    \ the sum of the previous two ones: 1 again, then 2, 3, 5, 8, 13, 21, 34, 55,\
    \ and so on. Programming this series using recursion is simple; we'll revisit\
    \ this example in Chapter 9, Designing Functions. The following code, a direct\
    \ translation of the definition, will—and see Question 4.4 for an alternative:\n\
    \n```\n// fibonacci.ts\\const fib = (n: number): number => {\n  if (n == 0) {\n\
    \    return 0;\n  } else if (n == 1) {\n    return 1;\n  } else {\n    return\
    \ fib(n - 2) + fib(n - 1);\n  }\n}\nconsole.log(fib(10)); // 55, a bit slowly\n\
    ```\n\nIf you try this for growing values of n, you'll realize that there is a\
    \ problem, and computation starts taking too much time. For example, I took timings\
    \ (measured in milliseconds) on my machine and plotted them on a graph. Since\
    \ the function is quite speedy, I had to run calculations 100 times for values\
    \ of n between 0 and 40. Even then, the times for small values of n were really\
    \ tiny; it was only from 25 onward that I got interesting numbers."
