  md: "This worked but implied that you would redo the Ajax fetch for every call,\
    \ even though the test results wouldn't ever change. There's a more efficient\
    \ way to do this, and it has to do with using functions as first-class objects.\
    \ We could define two different functions, test for the condition only once, and\
    \ then assign the correct function to be used later; study the following code\
    \ for such an alternative:\n\n```\n// continued...\n\n(function initializeAjax()\
    \ {\n  let myAjax = null;\n\n  if (window.XMLHttpRequest) {\n    // modern browsers?\
    \ use XMLHttpRequest\n    myAjax = function () {\n      return new XMLHttpRequest();\n\
    \    }\n  } else if (window.ActiveXObject) {\n    // it's ActiveX for IE5 and\
    \ IE6\n    myAjax = function () {\n      new ActiveXObject(\"Microsoft.XMLHTTP\\\
    n    }\n  } else {\n    myAjax = function () {\n      throw new Error(\"No Ajax\
    \ support!\");\n    }\n  }\n\n  window.getAjax = myAjax;\n})()\n```\n\nThis piece\
    \ of code shows two important concepts. We can dynamically assign a function:\
    \ when this code runs, window.getAjax (the global getAjax variable) will get one\
    \ of three possible values according to the current browser. When you later call\
    \ getAjax() in your code, the correct function will execute without needing to\
    \ do any further browser-detection tests.\n\nThe second interesting idea is that\
    \ we define the initializeAjax() function and immediately run it - this pattern\
    \ is called the immediately invoked function expression (IIFE), and we already\
    \ saw it in the Solution 7 - using a local flag section in Chapter 2, Thinking\
    \ Functionally. The function runs but cleans up all its variables as are local\
    \ and won't even exist after the function runs. We'll learn more about this in\
    \ this chapter."
