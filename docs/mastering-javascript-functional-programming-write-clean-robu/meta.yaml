    \ by value, except for arrays and objects, which are passed by reference. This\
    \ implies that any modification to the function's parameters will have an actual\
    \ modification of the original object or array. This can be further obscured by\
    \ the fact that several mutator methods change the objects by definition. For\
    \ example, you may use a function that would find the maximum element of an array\
    \ of strings (of course, if it were an array of numbers), you could use Math.max()\
    \ with no further ado. A short implementation could be as follows:\n\n```\n//\
    \ maxStrings.ts\n\nconst maxStrings = (a: string[]) => a.sort().pop();\n\nconst\
    \ countries = [\n  \"Argentina\",\n  \"Uruguay\",\n  \"Brasil\",\n  \"Paraguay\"\
    \n];\n```\n\n```\nconsole.log(maxStrings(countries)); // \"Uruguay\"\n```\n\n\
    The function does provide the correct result (and if you worry about foreign languages,\
    \ we already saw a way around that in the Injection - sorting out of Chapter 3,\
    \ Starting Out with Functions), and it has a defect. Let's see what happened with\
    \ the original array:\n\n```\nconsole.log(countries);\n// [\"Argentina\", \"Brasil\"\
    , \"Paraguay\"]\n```\n\nOops—the original array was modified; this is a side effect\
    \ by definition! (TypeScript would have helped this error if we had only written\
    \ a complete type definition for maxStrings(); see Question 4.2 for details.)\
    \ If you were to call maxStrings(countries) again, instead of returning the same\
