  md: "# Callbacks and promises\n\nProbably the most used example of functions passed\
    \ as first-class objects has to do with callbacks and promises. In Node.js, reading\
    \ a file is accomplished asynchronously with something like the following code:\n\
    \n```\nconst fs = require(\"fs\");\n\nfs.readFile(\"someFile.txt\", (err, data)\
    \ => {\n  if (err) {\n    // handle the error\n  } else {\n    // do something\
    \ with the received data\n  }\n});\n```\n\nThe readFile () requires a callback\
    \ - in this example, an anonymous function - that will get called when the file-reading\
    \ operation is finished.\n\nA better, more modern way is using promises; read\
    \ more at developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise.\
    \ With this, when performing an Ajax web call using the fetch() function, you\
    \ could write something along the lines of the following code:\n\n```\nfetch(\"\
    some/remote/url\")\n.then((data) => {\n  // do something with the received data\n\
    })\n.catch((error) => {\n  // handle the error\n});\n```\n\nFinally, you should\
    \ also look into async/await; read more about them at developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function\
    \ and developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await,\
    \ respectively."
