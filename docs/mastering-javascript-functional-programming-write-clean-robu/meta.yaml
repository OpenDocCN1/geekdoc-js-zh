  md: '# More function types


    JavaScript also allows us to define generator functions (as in function*...) {...}
    that return a Generator object and async functions that are a mix of generators
    and promises. You can read more about them at developer.mozilla.org/en/docs/Web/JavaScript/Reference/Statements/function
    and developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function,
    respectively.


    What''s the difference between these ways of defining functions, and why should
    we care? Let''s go over them by one:


    +   The first definition, function first(...) {...}, a standalone declaration
    starting with the function keyword, is probably the most used in JavaScript and
    defines a function named first (that is, first.name=="first"). Because of hoisting,
    this function is accessible everywhere in the scope where it is defined; we''ll
    touch this again later in the Functions object. (Of course, this happens if you
    use a var definition; with let or const, hoisting doesn''t apply. You can read
    more about hoisting at developer.mozilla.org/en-US/docs/Glossary/Hoisting. Remember
    that it applies only to initializations.)


    +   The second = function(...) {...} definition, which assigns a function to a
    variable, also produces an anonymous (that is, not named) one. However, many JavaScript
    engines can deduce what the name should be and will set second.name == "second".
    (Look at the following code, which shows a case where the anonymous function has
    no name.) Since the assignment is hoisted, the function will only be accessible
    after the assignment has been executed. Also, you''d prefer defining the variable
    with const rather than var, and prefer-const rules to enforce this: - take a look
    at the ESLint no-var and prefer


    ```

    var second = function() {

    console.log(second.name);

    // "second"

    ```


    ```

    var myArray = new Array(3);

    myArray[1] = function() {

    console.log(myArray[1].name);

    // " "

    ```


    +   The third definition, function someName(...) {...}, is the same as the second,
    except that the function now has its own name: third.name == "someName". The name
    of a function is relevant when you want to call it and is needed for recursive
    calls; we''ll return to this in Chapter 9, Designing Functions. If you just want
    a function for, say a callback, you can use one without a name. However, noted
    that named functions are more easily'
