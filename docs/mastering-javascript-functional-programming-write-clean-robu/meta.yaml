  md: '# How do we work with JavaScript?


    # Ignoring types?


    There’s a proposal that may go nowhere – be warned!) to allow JavaScript to process
    (by ignoring) types, so you would be able to run TypeScript directly, with no
    preprocessing or transpiling of any kind. For more, go to tc39.es/proposal-type-annotations.


    It should be clear that TypeScript is more than just a type check; it’s a language
    on its own (OK, it’s very similar to JavaScript, but still...). For example, it
    adds interfaces, enumerated types, and more to the language, so you can use such
    features that are typical in other languages. In any case, if you don’t care for
    TypeScript, you can just ignore the types-related syntax, and you’ll have JavaScript.


    TypeScript is available via online tools, and you can also test it on your playground
    (www.typescript.org/play/). You can set options to be more or less strict with
    type checks, and you can also run your code on the spot; see Figure 1.6 for more:


    ![](bbox=[0.125, 0.383, 0.872, 0.683])


    > Figure 1.6 – Using the Specifying data section to compile and transcribe code
    on TypeScript’s website


    Later in this book, in Chapter 12, *Building Better*, we will consider a formal
    type system for FP languages (not just JavaScript) and we will find out that your
    TypeScript work has formal-ed most difficulties.


    A final admission: at times, TypeScript may seem more of a hindrance than a help
    when you have to deal with complex data expressions. (Updating all the code in
    this book sometimes led me to doubt sanity in using it!) In the long, code written
    in TypeScript is less prone to bugs, because its static type checks detect and
    avoid many common errors.'
