    (x: number, y: number): number => x + y,

    0

    );

    ```


    In the *Working with ranges section of Chapter 5, Programming Declaratively*,
    we wrote this to calculate a factorial:


    ```

    const factorialByRange = (n: number): number =>

    range(1, n + 1).reduce((x, y) => x * y, 1);

    ```


    It would have been easier if we could just turn a binary operator into a function
    that calculates the same result. The preceding two examples could have been written
    more succinctly. Can you understand the change we made?


    ```

