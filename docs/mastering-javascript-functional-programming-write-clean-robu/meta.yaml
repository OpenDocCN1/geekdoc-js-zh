  md: '# Global state


    Of all the preceding points, the most common reason for side effects is the usage
    of nonlocal variables that share a global state with other parts of the program.
    Since pure functions, by definition, always return the output value given the
    same input arguments, if a function returns anything outside its internal state,
    it automatically becomes impure. Furthermore—this is a hindrance to debugging—to
    understand what a function does, you must understand how the state gets its current
    values, which means understanding all of the past history from your program: not
    easy!


    Let''s write a function to detect whether a person is a legal adult by checking
    whether they were born least 18 years old. (OK—that''s not precise enough because
    we are not considering the day and month of birth, but we are; the problem is
    elsewhere.) A version of isOldEnough function could be:


    ```

    // oldEnough.ts


    const limitYear = 2004; // only good for 2022


    const isOldEnough = (birthYear: number) =>

    birthYear <= limitYear;


    console.log(isOldEnough(1960)); // true

    console.log(isOldEnough(2010)); // false

    ```


    isOldEnough() correctly detects whether a person is at least 18 years old, but
    it depends on an external variable—a variable good for 2022 only! Even though
    the function works, the implementation isn''t the best that it could possibly
    be. You cannot tell what the function does unless you know about the external
    variable and how it got its value. Testing is also hard; you must remember to
    create the global limitYear variable, or all your tests will fail.


    There is an exception to this rule. Check out the following case: is the following
    circleArea() function, which calculates the area of a circle given its radius,
    pure or not?


    ```

    // area.ts


    const PI = 3.141592653589792;


    const circleArea = (r: number) => PI * r ** 2;

    ```


    Even though the function is accessing an external state, the fact that PI is a
    constant (and cannot be modified) would allow us to substitute it inside circleArea
    with no functional change, and the function will always return the same value
    for the same argument and fulfills our purity requirements.'
