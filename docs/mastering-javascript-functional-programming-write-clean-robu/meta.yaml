  md: "# Testing – pure versus impure\n\nWe have seen how pure functions are conceptually\
    \ better than impure ones, but we cannot set out on a crusade to vanquish all\
    \ impurities from our code. First, no one can deny that side effects can be useful,\
    \ or at least unavoidable: you will need to interact with the DOM or a web service,\
    \ and there are no ways to do this in a pure way. So rather bemoaning the fact\
    \ that you have to allow for impurity, try to structure your code to isolate the\
    \ impure functions and the rest of your code to be the best it can possibly.\n\
    \nWith this mind, you'll be able to write unit tests for all kinds of functions,\
    \ pure or impure. Writing unit tests is different, in terms of difficulty and\
    \ complexity, for pure and impure functions. While coding tests for the former\
    \ is usually quite simple and follows a basic pattern, the latter requires scaffolding\
    \ and complex setups. So, let's finish this chapter by seeing how to go about\
    \ testing both types of functions.\n\n# Testing pure functions\n\nGiven the characteristics\
    \ of pure functions that we have already described, most of your unit tests could\
    \ be the following:\n\n+   * Calling the function with a given set of arguments\n\
    * Verifying the results that match what you expected\n\nLet's start with a couple\
    \ of examples. Testing the isOldEnough() function would be more complex than we\
    \ needed for the version that required access to a global variable. On the other\
    \ hand, the last version, isOldEnough3(), which didn't require anything because\
    \ it received two parameters, is simple to test:\n\n```\n// isOldEnough.test.ts\n\
    \ndescribe(\"isOldEnough\", function () {\n  it(\"is false for people younger\
    \ than 18\", () => {\n    expect(isOldEnough3(2010, 2022)).toBe(false);\n  });\n\
    \n  it(\"true for people older than 18\", () => {\n    expect(isOldEnough3(1960,\
    \ 2022)).toBe(true);\n  });\n\n  it(\"true for people exactly 18\", () => {\n\
    \    expect(isOldEnough3(2004, 2022)).toBe(true);\n  });\n```"
