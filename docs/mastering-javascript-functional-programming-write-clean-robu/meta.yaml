  md: "# Producing Functions – Higher-Order Functions\n\nAPI calls go out for no reason,\
    \ harming performance and producing a bad user experience. Imagine, for instance,\
    \ a dashboard-style web page with several tabs. Whenever a user selects a tab,\
    \ several API calls go out to get the data the page needs. However, if the user\
    \ selects a different tab but later returns to the first one, the very same API\
    \ calls will go out. For many applications, data is basically constant, \"not\
    \ changing in real time.\" You don't need to re-send API calls; re-using previously\
    \ fetched data works.\n\nSome solutions are not practical: we could modify the\
    \ server to enable caching, but what if that's not possible? Or could we use a\
    \ cache, checking before every call whether that data was already fetched, but\
    \ that would entail-modifying every single API call to check the cache first!\
    \ We need a solution that requires no coding, and memoization to keep in mind.\n\
    \nAssume we have an async function that returns a promise. Given the memoize()\
    \ function we developed, we could memoize the async function, and it would be\
    \ a start. The first time you call the function with some arguments, the API call\
    \ will go out, and a promise will be returned (since that's what the function\
    \ returns). If you call the function again with the same arguments, the memoized\
    \ promise will be immediately returned. Great! Except there's a catch... what\
    \ would happen if the API call failed? We need to add some error-catching logic:\n\
    \n```\n// memoize.ts\nconst promiseMemoize = <\nA,\nT extends (...x: any[]) =>\
    \ Promise<A>\n>(n  fn: T\n): ((...args: Parameters<T>) => Promise<A>) => {\n \
    \ const cache = {} as Record<string, Promise<A>>;\n  return (...args) => {\n \
    \   const strX = JSON.stringify(args);\n    return strX in cache\n      ? cache[strX]\n\
    \      : (cache[strX] = fn(...args).catch((x) => {\n        delete cache[strX];\n\
    \        return x;\n      }))\n  };\n};\n```"
