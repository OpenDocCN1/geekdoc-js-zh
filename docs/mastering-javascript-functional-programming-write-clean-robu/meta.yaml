  md: "# Recursion\n\n**Recursion** is the most potent tool for developing algorithms\
    \ and a great aid for solving large classes of problems. The idea is that a function\
    \ can, at a certain point, call itself, and when *that* call is done, continue\
    \ working with whatever result it has received. This is usually quite helpful\
    \ for certain classes of problems or definitions. The most often quoted example\
    \ is the factorial function (the factorial of n is written as n!), defined for\
    \ nonnegative integer values:\n\n+   - If n is 0, then n! = 1\n- If n is greater\
    \ than 0, then n! = n * (n-1)!\n\n# Arranging things\n\nThe value of *n!* is the\
    \ number of ways you can arrange different elements in a row. For example, if\
    \ you place five boxes in line, one can pick any of the five for the first place,\
    \ and order the other four in every possible way, so 5! = 5!. To order those four,\
    \ you can pick any of them for the first place, and then order the other three\
    \ in every way, so 4! = 4!. If you continue to work on this example, you will\
    \ end up with 5! = 5*4*3*2*1=120, and in general, n! is the product of all numbers\
    \ up to n.\n\nThis can be immediately turned into code:\n\n```\n// factorial.js\n\
    nfunction fact(n) {\n  if (n === 0) {\n    return 1;\n  } else {\n    return n\
    \ * fact(n - 1);\n  }\n}\n\nconsole.log(fact(5)); // 120\n```\n\nRecursion will\
    \ be a great aid for designing algorithms. By recursion, you could do without\
    \ any while or for loops – not that we want to do that, but it's interesting that\
    \ we can! We'll be devoting the entirety of *Chapter 9, Designing Functions*,\
    \ to designing algorithms and writing functions recursively."
  merge: -1
  pgno: 31
