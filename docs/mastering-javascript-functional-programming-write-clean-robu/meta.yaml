  md: "# Functions - the lambda way\n\nIn lambda calculus, a function as x=>2*x would\
    \ be represented as λ2x. Although there are syntactical differences, the definitions\
    \ are analogous. Functions with more parameters are a bit more complicated; (x,y)=x+y\
    \ would be expressed as λx.λy.x+y. We'll learn more about this in Lambda and functions\
    \ in Chapter 3, Starting Out Functions, and in the Currying section of Chapter\
    \ 7, Transforming Functions.\n\nThere's one other thing to keep in mind: when\
    \ the arrow function has a single parameter, you can omit the parentheses. I usually\
    \ prefer leaving them, but I've applied a JavaScript beautifier, Prettier, to\
    \ the code, which removes them. It's really up to you whether to include them\
    \ or not! (For more on this tool, check out github.com/prettier/prettier.) By\
    \ the way, my options for formatting are --print-width 75 --tab-width 2 --no-bracket-spacing.\n\
    \n# Spread\n\nThe spread ... operator (see developer.mozilla.org/docs/Web/JavaScript/Reference/Operators/Spread_operator)\
    \ lets you expand an expression in places where you would otherwise require multiple\
    \ arguments, elements, or variables. For example, you can replace arguments in\
    \ a function call, as shown in the following code:\n\n```\n// sum3.js\nfunction\
    \ sum3(a, b, c) {\n  return a + b + c;\n}\n\nconst x = [1, 2, 3];\nconst y = sum3(...x);\
    \ // equivalent to sum3(1,2,3)\n```\n\nYou can also create or join arrays, as\
    \ shown in the following code:\n\n```\n// continued...\nconst f = [1, 2, 3];\n\
    const g = [4, ...f, 5]; // [4,1,2,3,5]\nconst h = [...f, ...g]; // [1,2,3,4,1,2,3,5]\n\
    ```\n\nIt works with objects too:\n\n```\n// continued...\nconst p = { some: 3,\
    \ data: 5 };\nconst q = { more: 8, ...p }; // { more:8, some:3, data:5 }\n```"
