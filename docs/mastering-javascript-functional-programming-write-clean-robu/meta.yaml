  md: '# Thinking Functionally – A First Example


    In Chapter 1, Becoming Functional, we went over how FP is, mentioned some advantages
    of applying it, and listed some tools we need in JavaScript. For now, let''s leave
    the theory behind and start by considering a simple problem and how to solve it
    in a functional way.


    In this chapter, we will do the following:


    +   * Look at a simple, e-commerce-related problem

    * Consider usual ways to solve it (with their associated defects)

    * Find a way to solve the problem by looking at it functionally

    * Devise a higher-order solution that can be applied to other problems

    * Work out how to carry out unit testing for functional solutions


    In future chapters, we will be returning to some of the topics listed here, so
    we won''t be going into much detail. We''ll just show how FP can give a different
    outlook on our problem and leave further details for later.


    After working through this chapter, you will have a first look at a common problem
    and at a way of solving it by thinking functionally, as a prelude for the rest
    of this book.


    # Our problem – doing something only once


    Let''s consider a simple common situation. You have developed an e-commerce site;
    the user can fill their shopping cart, and in the end, they must click on a Bill
    me button so that their credit card will be charged. However, the user shouldn''t
    click twice (or more), or they will be billed several times.'
