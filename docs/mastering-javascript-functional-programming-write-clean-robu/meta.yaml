  md: "# Programming Declaratively – A Better Style\n\n```\nconst delinquentIds2 =\
    \ serviceResult.accountsData\n  .filter((v) => v.balance < 0)\n  .map((v) => v.id);\n\
    ```\n\nFiltering is a very useful function, now, to get a better handle on it,\
    \ let's see how you can emulate it, which you could use as a base for more sophisticated,\
    \ powerful functions of your own.\n\n# Emulating filter() with reduce()\n\nAs\
    \ we did before with map(), we can also create our own version of filter() by\
    \ using reduce(). The idea is: loop through all elements of the input array, apply\
    \ the predicate to it, and if the result is true, add the original element to\
    \ the output array. When the loop is done, the output array will only have those\
    \ elements for which the predicate was true:\n\n```\n// continued...\n\nconst\
    \ myFilter = <T>(arr: T[], fn: (x: T) => boolean) =\n  arr.reduce(\n    (x: T[],\
    \ y: T) => (fn)(y) ? x.concat(y) : x,\n    []\n  );\n```\n\nOur function is generic;\
    \ it takes an array of elements of type T and a predicate that accepts a T-type\
    \ parameter and generates a new array of elements of type T. We can quickly see\
    \ that our function works as expected:\n\n```\nmyFilter(serviceResult.accountsData,\
    \ (v) => v.balance < 0);\n```\n\nThe output is the same pair of accounts that\
    \ we saw earlier in this section.\n\n# Searching in an array\n\nSometimes, instead\
    \ of filtering all the elements of an array, you want to find an element that\
    \ satisfies a given predicate. There are a couple of functions that can be used\
    \ for this, depending on your specific needs:\n\n+   * find() searches through\
    \ the array and returns the value of the first element that satisfies a given\
    \ condition, or undefined if no such element is found\n* findIndex() performs\
    \ a similar task, but instead of returning an element, it returns the index of\
    \ the first element in the array that satisfies the condition, or -1 if none were\
    \ found"
