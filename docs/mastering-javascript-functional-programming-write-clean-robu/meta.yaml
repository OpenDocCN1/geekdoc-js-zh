  md: "# Waiting for decorators\n\nDecorators are considered for general adoption\
    \ in JavaScript. Currently (as of December 2022), they are at Stage 3, Candidate\
    \ level, so it may still be while until they get to Stage 4 (Finished, meaning\
    \ \"officially adopted\"). You can read more about the proposal for decorators\
    \ at tc39.github.io/proposal-decorators/ and about the JavaScript adoption process,\
    \ called TC39, at tc39.process-document. You can see the Questions in Chapter\
    \ 11, Implementing Design Patterns, for more information.\n\nAs the term wrapper,\
    \ it's more important and pervasive than you might have thought; in fact, JavaScript\
    \ uses it widely. You already know that object properties and methods are accessed\
    \ through dot notation. However, you also know that you can write code like myString.length\
    \ or _22.toPrecision(5), where are those properties and methods coming from given,\
    \ that neither strings nor numbers are objects? JavaScript actually creates a\
    \ wrapper object around your primitive value. This object inherits all the methods\
    \ that are appropriate to the wrapper. As the needed evaluation has been done,\
    \ JavaScript throws away the just-created wrapper. We cannot do anything about\
    \ transient wrappers, but there is a concept we come back to regarding a wrapper\
    \ that allows methods to be called on things that are not of the appropriate type.\
    \ This is an interesting idea; see Chapter 12, Building Better Containers, for\
    \ more applications of that!\n\nIn this section, we'll look at three examples:\n\
    \n+   - Adding logging to a function\n- Getting timing information from functions\n\
    - Using caching (memoizing) to improve the performance of functions\n\nLet's get\
    \ to work!\n\n# Logging\n\nLet's start with a common problem. When debugging code,\
    \ you usually need to add some logging information to see whether a function was\
    \ called, with what arguments, what it returned, and so on. (Yes, of course, you\
    \ can simply use a debugger and breakpoints, but bear with me for this example!)\
    \ Normally working means that you'll have to modify the code of the function itself,\
    \ at both entry and exit, to produce some logging output. For example, your original\
    \ code could be something like the following:\n\n```\nfunction someFunction(param1,\
    \ param2, param3) {\n  // do something\n  // do something else\n  // and a bit\
    \ more,\n  // and finally\n```"
  merge: -1
  pgno: 190
