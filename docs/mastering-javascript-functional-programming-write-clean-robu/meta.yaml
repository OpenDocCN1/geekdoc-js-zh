  md: 'The similarity to includes() and indexOf() is clear; these functions search
    for a specific value instead of an element that satisfies a more general condition.
    We can easily write equivalent one-liners:


    ```

    arr.includes(value); // arr.find(v => v === value) arr.

    indexOf(value); // arr.findIndex(v => v === value)

    ```


    Going back to the geographic data we used earlier, we could easily find a given
    country using the find() method. For instance, let''s get data for Brazil ("BR");
    it just takes a single line of code:


    ```

    // search.ts


    import { markers } from "./average";


    const brazilData = markers.find((v) => v.name === "BR");

    // {name:BR, lat:-15.8, lon:-47.9}

    ```


    We can''t use the includes() method because we would have to delve into the object
    to get the field we wanted. If we wanted the position of the country in the array,
    we would have used findIndex():


    ```

    // continued...


    const brazilIndex = markers.findIndex(

    (v) => v.name === "BR")

    );

    // 2

    ```


    OK, this was easy! What about a special case, which could even be a trick interview
    question? Read on:


    # A special search case


    Suppose you have an array of numbers and want to run a sanity check, studying
    whether any of them were NaN. How would you do this? A tip: don''t try checking
    the types of the elements—even though NaN stands for not a number, typeof NaN
    is "number". You''ll get a surprising result if you try to search in this obvious
    way:


    ```

    [1, 2, NaN, 4].findIndex((x) => x === NaN); // -1

    ```


    What''s going on here? It''s a bit of interesting JavaScript trivia: NaN is the
    only value that isn''t equal to itself. To look for NaN, you''ll have to use the
    new isNaN() function as follows:


    ```

    [1, 2, NaN, 4].findIndex((x) => isNaN(x)); // 2

    ```'
