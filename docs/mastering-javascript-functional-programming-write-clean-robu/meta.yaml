  md: '# Altering a function''s behavior


    It goes without saying that it would be equally simple to define further binary()
    or ternary() functions, and others that would turn any function into an equivalent
    but restricted-arity version. Let''s not go overboard and just look at a couple
    of the possible functions – see Question 6.10 for more on this:


    ```

    // continued...


    const binary = fn = (...a) => fn(a[0], a[1]);


    const ternary = fn = (...a) => fn(a[0], a[1], a[2]);

    ```


    This works, but out all the parameters can become tiresome. We can get one better
    by using array operations and making a generic function to deal with all these
    cases, as follows:


    ```

    // continued...


    const arity = (n, fn) => (...a) => fn(...a.slice(0, n));

    ```


    With this generic arity() function, we can give alternative definitions for unary(),
    binary(), and so on. We can easily rewrite the earlier functions as:


    ```

    const unary = fn = arity(1, fn);

    const binary = fn = arity(2, fn);

    const ternary = fn = arity(3, fn);

    ```


    You might think there aren''t many cases in which you would want to add this kind
    of solution, but there are many more. JavaScript functions and methods, you can
    quickly produce a list starting with apply(), assign(), bind(), concat(), copyWith(),
    and many more! If you wanted to use any of these in a tacit way, you would probably
    need to fix their arity so that they would work with a fixed, non-variable number
    of parameters.


    # Under the sun


    If you want a list of JavaScript functions and methods, check developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions/developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Methods_Index.
    As tacit programming (or pointfree style), we''ll return to it in Chapter 8, Connecting
    Functions.


    There will be a problem with TypeScript, though. TypeScript deals with static
    typing, but the type of the result of a call to arity() is determined at runtime.
    The most we may manage is, by a series of overloads, to say that a given function
    with several parameters, the result of applying arity() will have zero, one, two,
    and so on on different possibilities – we won''t be able to do more.'
