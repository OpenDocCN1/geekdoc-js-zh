  md: "# Impure functions\n\n```\nconst namePart = new Array (NAME_LENGTH);\nfor (let\
    \ i = 0; i < NAME_LENGTH; i++) {\n  namePart[i] = randomLetterFunc();\n}\nreturn\
    \ namePart.join(\"\") + fileExtension;\n\n```\n\nYou can also decide using partial\
    \ application, as we will see in Chapter 7, Transforming Functions.\n\nThis hasn't\
    \ actually avoided the usage of impure functions. Normally, you'll getRandomFileName()\
    \ by providing it with the random generator we wrote, so it will behave as an\
    \ impure function. However, if for testing purposes you provide a function that\
    \ returns predefined (that is, not random) letters, you'll be able to test it\
    \ as it were pure much more easily.\n\nBut what about the original problem, getRandomLetter()?\
    \ We can apply the same trick and write a new version, such as the following,\
    \ which will have an argument that will produce random numbers:\n\n```\n// random.ts\n\
    \nconst getRandomLetter2 = (\n  getRandomNum: () => number = Math.random().bind(Math)\n\
    ): string => {\n  const min = \"A\".charCodeAt(0);\n  const max = \"Z\".charCodeAt(0);\n\
    \  return String.fromCharCode(\n    Math.floor(getRandomNum()) * (1 + max - min))\
    \ + min\n  );\n};\n\n```\n\nWe should change getRandomFileName3 to call getRandomLetter().\
    \ If it calls without providing any parameters, getRandom2 will behave in its\
    \ expected random ways. If we want to test whether getRandomFileName3 will behave\
    \ as we want, we can run it with an injected function that will return whatever\
    \ we decide, letting us test it thoroughly.\n\n# Bind them all\n\nFor the default\
    \ of getRandomNum, we wrote Math.random.bind(Math), as explained in the Working\
    \ with methods section of the previous chapter. The alternative (arguably clearer\
    \ for some people) is () => Math.random(); we'll use it in the Is your function\
    \ pure? section later in this chapter, just for variety."
