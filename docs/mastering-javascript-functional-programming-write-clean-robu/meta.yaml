    # Working with parallel functions


    JavaScript provides concurrency through async functions, meaning that several
    tasks can go on at the same time, even if a single CPU is doing all the jobs.
    Web workers (for the frontend) and worker threads (for the backend) allow processing
    in a different core, for better performance. This can offload work from the main
    thread and solve potential problems, in line with our FP approach.


    In this section, we''ll see how to avoid bottlenecks in frontend and backend programming
    by using workers in functional ways, along the lines of the previous sections
    in this chapter.


    # Unresponsive pages


