  md: '# Becoming Functional – Several Questions


    JavaScript has grown to be incredibly powerful. But, as with all power tools,
    it gives you a way to not only produce great solutions but also to do great harm.
    FP could be considered a way to reduce or leave aside some of the worst parts
    of the language and focus on working in a safer way; however, due to the immense
    amount of existing JavaScript, you cannot expect it to facilitate large reworkings
    of the language that would cause most sites to fail. You must learn to live with
    the good and the bad, and simply accept the latter part.


    In addition, the language has a broad variety of available libraries that complete
    or extend the language in many ways. In this book, we’ll be focusing on JavaScript
    on its own, but we will make references to existing, available code.


    If we ask whether JavaScript is functional, the answer will be, once again, “sorta”.
    It can be seen as functional because of several features, as first-class functions,
    anonymous functions, recursion, and closures – we’ll get back to this. On the
    other hand, it has plenty of non-FP aspects, such as side effects (imurity), mutable
    objects, and practical limits to recursion. So, when programming in a functional
    way, we’ll be taking advantage of all the relevant, appropriate language features,
    and will try to minimize the problems caused by the more conventional parts of
    the language. In this sense, JavaScript will not be functional, depending on your
    programming style!


    If you want to use FP, you should decide which language to use; however, opting
    for fully functional languages may not be so wise. Today, developing code is not
    as simple as just using a language; you will require frameworks, libraries, and
    other tools. If we can take advantage of all the provided tools at the same time
    to introduce FP of working in our code, we’ll get the best of both worlds, regardless
    of whether JavaScript is functional!


    # Going functional with JavaScript


    JavaScript has evolved through the years, and the version we’re using is (informally)
    called JS13, and (formally) ECMAScript 2022, usually shortened to ES2022 or ES13;
    this version was finalized in June 2022. The previous versions were as follows:


    +   - ECMAScript 1, 1997

    - ECMAScript 2, 1998, which was the same as the previous version, ECMAScript 3,
    December 1999, with several new functionalities

    - ECMAScript 5, December 2009 (and no, there was never an ECMAScript 4, because
    it was abandoned)\n- ECMAScript 5.1, June 2001

    - ECMAScript 6 (or ES6; renamed ES2015), June 2015 ECMAScript 7 (also ES7, or
    ES2016), June 2016 ECMAScript 8 (ES8 or ES2017), June 2017

    - ECMAScript 9 (ES9 or ES2018), June 2018

    - ECMAScript 10 (ES10 or ES2019), June 2019'
