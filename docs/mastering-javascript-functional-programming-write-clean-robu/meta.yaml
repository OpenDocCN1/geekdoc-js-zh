    What''s in a name?

    Part of the reason for the foldl name seen previously (at least, ending in l)
    should be clear: the reducing operation proceeds from left to right, from the
    first element to the last. You may wonder, how it would have been named if it
    had been defined by a right-to-left language (such as Arabic, Hebrew, Farsi, or
    Urdu)!


    This example is common and well known; let''s do something more complicated. As''ll
    find out, reduce () will be quite useful for many different objectives!


    # Calculating an average


    Let''s do bit more work. How do you calculate the average of a list of numbers?
    If you were explaining this to someone, your answer would surely be something
    as all the elements in the list and divide by the number of elements. In programming
    terms, this is not a procedural description (you don''t explain how to sum elements
    or traverse the array) but rather a declarative one you would say to do, not how.


    We can transform that calculation into an almost self-explanatory function (In
    the Averaging arrays section of the next chapter, we''ll extend arrays to include
    an averaging method, based on this code):


    ```

    // average.ts

    const myArray = [22, 9, 60, 12, 4, 56];

    const sum = (x: number, y: number): number => x + y;


    const average = (arr: number[]): number => arr.reduce(sum, 0) / arr.length;


    console.log(average(myArray)); // 27.1666666

    ```'
