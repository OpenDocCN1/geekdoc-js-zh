  md: "124 Programming Declaratively – A Better Style\n\nOK, some functions can lead\
    \ you astray when mapping, and you now know what to look for. Let's keep enhancing\
    \ the way we work by using ranges to write code that would usually require a hand-written\
    \ loop.\n\n# Working with ranges\n\nLet's now turn to a helper function, which\
    \ will be handy for many uses. We want a range (start, stop) function that generates\
