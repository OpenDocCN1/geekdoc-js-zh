    There are several points to note here:


    +   * To spy on a function (for instance, to count how many times it was called),
    we need to pass it as an argument to jest.fn(); we can apply tests to the result,
    which works exactly like the original function, but can be spied on.

    * When you spy on a function, jest intercepts its calls and registers that the
    function was called, with which arguments, and how many times it was called.

    * The first test only checks if we call the function several times, it gets called
    that number of times. This is trivial, but we doing something wrong if that didn''t
    happen!

    * In the second test, we apply once() to a (dummy) myFn() function, and we call
    the result (onceFn()) several times. We then check that myFn() was called only
    once, though onceFn() was called three times.'
