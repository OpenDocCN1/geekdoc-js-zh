  md: '# Transforming Functions

    – Currying and Partial Application


    In Chapter 6, Producing Functions, we saw several ways of manipulating functions
    to get new versions with some changes in their functionality. In this chapter,
    we will go into a particular kind of transformation, a sort of factory method
    that lets you produce new versions of any given function.


    We will be considering the following:


    +   * Currying: A classic FP theoretical function that transforms a function with
    many parameters into a sequence of unary functions

    * Partial application: Another time-honored FP transformation, which produces
    new versions of functions by fixing some of their arguments

    * Partial currying (a name of mine क्यों): Can be seen as a mixture of the two
    previous transformations


    The techniques in this chapter will provide you with a different way of producing
    functions from other functions. To be fair, we will also see that some of these
    techniques can be emulated, possibly with greater clarity, by simple arrow functions.
    However, since you are liable to find currying and partial application in all
    sorts of tests and web pages on FP, it is important that you know their meaning
    and usage, even if you opt for a simpler way out. We''ll look at several applications
    of the ideas in the following sections.


    # A bit of theory


    The concepts we''ll discuss in this chapter are very similar, and in others quite
    different. It''s common to find confusion about their real meanings, and plenty
    of web pages misuse them. You could even say that all the transformations in this
    chapter are roughly equivalent since they let you transform a function into another
    that fixes some parameters, leaving other parameters free, and eventually leading
    to the same result. Okay, I agree; this isn''t clear! let''s start clearing the
    air'
