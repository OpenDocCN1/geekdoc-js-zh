    \ of a constant as defined in the code (a better idea, by the way) the constant\
    \ cannot be changed, the function would remain pure.\n\nHere, we have dealt with\
    \ problems caused by the global state; let's move on to the inner state.\n\n#\
    \ Inner state\n\nThe notion is also extended to internal variables, in which a\
    \ local state is stored and used for future calls. The external state is unchanged,\
    \ but internal side effects imply future differences regarding what the function\
    \ will return. Let's imagine a roundFix() rounding function that considers whether\
