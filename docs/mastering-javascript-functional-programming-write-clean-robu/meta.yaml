  md: '# Becoming Functional – Several Questions


    Let''s see some examples of each one and find out why they be useful to us. Keep
    in mind, though, that there are more features of JavaScript that we will be using;
    the upcoming sections just highlight the most important features in terms of what
    we will be using for FP.


    # Functions as first-class objects


    Saying that functions are first-class objects (also called first-class entities
    or first-class citizens) means that you can do everything with functions that
    you can with other objects. For example, you can store a function in a variable,
    you can pass it to a function, you can print it out, and so on. This is really
    the key to doing FP; we will often be passing functions as parameters (to other
    functions) or returning a function as the result of a function.


    If you have been using Ajax Ajax, then you have already been using this feature:
    a callback is a function that will be called after the Ajax finishes and is passed
    as a parameter. Using jQuery, you could write something like the following:


    ```

    $get("some/url", someData, function(result, status) {

    // check status, and do something

    // with the result

    };

    ```


    The .get() function receives a callback function as a parameter and calls it after
    the result is obtained.


    > The way to go

    This is better solved, in a more modern way, by promises or async/await, but for
    the sake of our example, the old way is enough. We''ll be getting back to promises,
    though, in Chapter 12, Building Better Containers, when we discuss monads; in
    particular, see the Unexpected monads – promises section.


    Since functions can be stored in variables, you could also write something like
    the following. Pay attention to how we use the doSomething variable in the .get(...)
    call:


    ```

    var doSomething = function(result, status) {

    // check status, and do something

    // with the result

    };


    $get("some/url", someData, doSomething);

    ```


    We''ll be seeing more examples of this in Chapter 6, Producing Functions.'
