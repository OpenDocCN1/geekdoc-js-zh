    \ [2, 3, 4, 5, 6]\n```\n\nWhy fill(0)? Undefined array elements are keyed by map(),\
    \ so we need to fill them with something or our code will have no effect.\n\n\
    > Expanding your range\nLibraries such as Underscore and Lodash provide a more\
    \ powerful version of the range () function, letting us go in ascending or descending\
    \ order and specifying the step to use—as _.range(0, -8, -2), which produces [0,\
    \ -8, -4, -6]-but for our needs, the range we wrote is enough. Refer to the Questions\
    \ section at the end of this chapter.\n\nHow can we use it? In the following section,\
    \ we'll see some uses for controlled looping withEach(), but we can reduce our\
    \ factorial function by applying range() and then reduce(). The idea of this is\
    \ to generate all the numbers from 1 to n and then multiply them together:\n\n\
    ```\n// continued...\nconst factorialByRange = (n: number): number =>\nrange(1,\
    \ n + 1).reduce((x, y) => x * y, 1);\n```\n\nIt's important to check the border\
    \ cases, but the function also works for zero; can you see why? The reason for\
    \ this is that the produced range is empty; the call is range(1, 1), which returns\
    \ an empty array. Then, reduce () doesn't do any calculations and returns the\
    \ initial value (1), which is correct.\n\nIn Chapter 7, Transforming Functions,\
    \ we'll have the opportunity to use range() to generate source code; check out\
    \ the Currying with eval() and Partial application with eval() sections."
