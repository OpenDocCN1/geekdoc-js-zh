  md: '# A functional solution to our problem


    +   - The return statement shows that once() will return a function, with the
    same type of parameters as the original fn() one. We are using the spread syntax
    we saw in Chapter 1, Becoming Functional. With older versions of JavaScript, you''d
    have to work with the arguments object; see developer.mozilla.org/en/docs/Web/JavaScript/Reference/Function/arguments
    for. The modern way is simpler and shorter!


    +   - We assign done = true before calling fn(), just in case function throws
    an exception. Of course, if you don''t want to disable the function until it has
    successfully ended, you could move the assignment along the fn() call. (See Question
    2.4 in the Questions section for another on this.)


    +   - After setting done, we finally call the original function. Note the use
