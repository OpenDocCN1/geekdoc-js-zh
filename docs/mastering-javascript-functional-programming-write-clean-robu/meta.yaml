  md: '# # Of lambda and functions


    In lambda calculus terms, a function can look like λ*x. The understanding is that
    the variable λ (the Greek letter lambda in lowercase) is the parameter for the
    function, and the expression after the dot is where you would replace whatever
    value is passed as an argument. In this chapter, we will see that this particular
    example could be written as (x) => 2*x in JavaScript in arrow function form, as
    you can see, it is very similar.


    > An alliterative aid


    If you wonder about the difference between arguments and parameters, a mnemonic
    with some alliteration may help: Parameters are Potential, Arguments are Actual.
    Parameters are placeholders for potential values that will be passed, and arguments
    are the actual values passed to the function. In other words, when you define
    the function, you list its parameters, and when you call it, you provide arguments.


    Applying a function means provide an actual argument to it, which is written in
    the usual way, using parentheses. For example, (x^2)(3) would be calculated as
    6. What is equivalent of these lambda functions in JavaScript? That''s an interesting
    question! There are several ways of defining functions, and not all have the same
    meaning.


    In many ways can you define a function in JavaScript? The answer is probably in
    many ways than you thought! (A good article that shows the ways of defining functions,
    methods, and more is The Many Faces of Functions in JavaScript, by Leo Balter
    and Rick Waldron, at bocooup.com/blog/the-many-faces-of-functions-in-javascript
    - give it a look!) At the very least, you could write the following – and I use
    vanilla JavaScript because here types aren''t a concern:


    +   - A named function declaration: function first({...})

    - An anonymous function expression: var second = function(...) {...}

    - A named function expression: var third = function someName(...) {...}

    - An immediately-invoked expression: var fourth = (function() {; return function(...)
    })();

    - A function constructor: var fifth = new Function(...);

    - An arrow function: var sixth = (...) => {...};


    If you wanted, you could add object method declarations since they also imply
    functions, but the preceding list should be enough.'
