  md: "The reason for the increasing delays becomes obvious: for example, the calculation\
    \ for fib(2) was repeated on four different occasions, and fib(3) was itself calculated\
    \ three times. Given that our function is pure, we could have stored the calculated\
    \ values to avoid running the numbers and over again. A possible version, using\
    \ a cache array for previously calculated values, would be as follows:\n\n```\n\
    // continued...\nconst cache: number[] = [];\n\nconst fib2 = (n: number): number\
    \ => {\n  if (cache[n] === undefined) {\n    if (n === 0) {\n      cache[0] =\
    \ 0;\n    } else if (n === 1) {\n      cache[1] = 1;\n    } else {\n      cache[n]\
    \ = fib2(n - 2) + fib2(n - 1);\n    }\n  }\n  return cache[n];\n};\n\nconsole.log(fib2(10));\
    \ // 55, as before, but more quickly!\n```\n\nInitially, the cache array is empty.\
    \ Whenever we need to calculate the value of fib2(n), we check whether it is already\
    \ beforehand. If that's not, we do the calculation, but with a twist: instead\
    \ of immediately returning the value, we first store it in the cache and then\
    \ return it. This means that no calculation will be done twice: after we have\
    \ calculated fib2(n) for a particular value, future calls will not repeat the\
    \ procedure and will return the earlier result.\n\nA few short notes:\n\n+   -\
    \ We memoized the function by hand, but we can do it with a higher-order function.\
    \ We'll see this later in Chapter 6, Producing Functions. It is perfectly possible\
    \ to memoize a function without having to change or rewrite it.\n- Using a global\
    \ cache variable isn't a good practice; we could have used an IIFE and a closure\
    \ to hide cache from sight—do you see how? (Also, see Question 4.3 at the end\
    \ of this chapter). The myCamera() example in the Immediate invocation section\
    \ of Chapter 3, Starting Out with Functions, shows how."
