  md: '# Becoming Functional – Several Questions


    Depending on whom you ask, you''ll either learn that it is a modern, enlightened
    approach to programming that leaves every other paradigm behind or that it is
    mainly a theoretical thing, with more complications than benefits, that''s practically
    impossible to implement in the real world. And, as usual, the real answer is not
    in the extremes, but somewhere in between. Let''s start by looking at the theory
    versus practice and see how we use it FP.


    # Theory versus practice


    In this book, we''re not going to be about FP in a theoretical way. Instead, our
    point is to show you some of its techniques and tenets can be successfully applied
    to common, everyday JavaScript programming. But and this is important – we''re
    not going to be about dogmatically, but in a very practical way. We won''t avoid
    useful JavaScript constructs simply because they don''t fulfill the academic expectations
    of FP. Similarly, we avoid avoid JavaScript features just because our code will
    be a mixture of FP features, more imperative ones, and object-oriented programming
    (OOP).


    Be careful, though; we didn''t just mean that we''ll be leaving the theory by
    the side. We will be picky, and just learn the main points, learn some vocabulary
    and definitions, and explain core FP concepts, but we''ll always be keeping in
    sight the idea of producing actual, useful JavaScript code, rather than trying
    to meet some mental, dogmatic FP criteria.


    OOP has a way to solve the inherent complexity of large programs and systems,
    and developing clean, extensible application architectures; however, because the
    scale of today''s web applications, the complexity of all code bases is continuously
    growing. Also, the newer features of JavaScript make it possible to develop applications
    that wouldn''t been possible just a few years ago, mobile (hybrid) apps that are
    made with Ionic, Apache Cordova, or React Native or desktop apps that are made
    with Electron, Tauri, or NWjs, for example. JavaScript has also migrated to the
    backend with Node.js or Deno, so the scope of usage for the language has grown
    in a serious way that deals with all the added complexity of modern designs.


    # A different way of thinking


    FP is a way of writing programs and can sometimes be difficult to learn. In many
    languages, programming is done imperatively: a program is a sequence of statements,
    executed in a prescribed fashion, and the desired result is achieved by creating
    objects and manipulating them, which usually modifying the objects themselves.
    FP is based on producing the desired result by evaluating expressions built out
    of functions that are composed together. In FP, it''s common to pass functions
    around (such as passing parameters to other functions or returning functions as
    the result of a calculation), not use loops (opting for recursion instead), and
    skip side effects (such as modifying global variables).


    In other words, FP focuses on what should be done, rather than on how it should
    be done. Instead of worrying about loops or arrays, you at a higher level, considering
    what needs to be done. After'
