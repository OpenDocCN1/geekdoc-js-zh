  md: 'The initial accumulated value is -1 here, which will be the returned value
    if no element fulfils the predicate. Whenever the accumulated value is still -1,
    but when we find an element that satisfies the predicate, we change the accumulated
    value to the array index.


    OK, we are now down with searches: let''s move on to considering higher-level
    predicates that simplify testing arrays for a condition, but always in the declarative
    style we''ve been using so far.


    # Higher-level predicates – every() and some()


    The last functions we will consider generally simplifying arrays to tests for
    conditions. These functions are as follows:


    +   * every(), which is true if and only if every element in the array satisfies
    a given predicate

    * some(), which is true if at least one element in the array satisfies the predicate


    For example, we could quickly check our hypothesis about all the arrays having
    negative coordinates:


    ```

    // continued...


    markers.every(v) => v.lat < 0 && v.lon < 0); // false

    markers.some(v) => v.lat < 0 && v.lon < 0); // true

    ```


    If we want to find equivalents to these two functions in terms of reduce(), the
    alternatives show nice symmetry:


    ```

    arr.every(fn);

    arr.reduce((x, y) => x && fn(y), true);

    arr.some(fn);

    arr.reduce((x, y) => x || fn(y), false);

    ```


    The first operating evaluates fn(y) and ANDs the result with the previous tests;
    the only final result will be true if every test succeeds. The second folding
    operation is similar, but ORs the result with the previous tests and will produce
    true unless every fails.


    > Boolean duality

    In terms of Boolean algebra, the alternative formulations for every() and some()
    exhibit duality. This duality is the kind that appears in the x === true and x
    === || false expressions; if x is a Boolean value, and we change && to ||, and
    also true and false, then we transform one expression into the other, and both
    are valid.'
