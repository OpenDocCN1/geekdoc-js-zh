  md: "Working with parallel functions 163\n\n```\nexport const workerCall = (\n \
    \ filename: string,\n  value: any\n): Promise<any> => {\n  let available = pool\n\
    \  .filter((v) => v.inUse)\n  .find((x) => x.filename === filename);\n\n  if (available\
    \ === undefined) {\n    // console.log(\"CREATING\", filename, value);\n\n   \
    \ available = {\n    worker: new Worker(filename),\n    filename,\n    value,\n\
    \    inUse: true,\n    } as Pool;\n\n    pool.push(available);\n  } else {\n \
    \   // console.log(\"REUSING\", filename, available.value);\n  }\n\n  return new\
    \ Promise((resolve) => {\n    available!.inUse = true;\n    available!.worker.on(\"\
    message\", (x) => {\n      resolve(x);\n      available!.inUse = false;\n    \
    \  // console.log(\"RESOLVING\", filename, value, x);\n    });\n    available!.worker.postMessage(value);\n\
    \  });\n};\n```\n\nWe can see how this works with our previous Fibonacci worker,\
    \ plus a new random one that delays a while before returning a random number:\n\
    \n```\n// workers/random_worker.ts\n```"
