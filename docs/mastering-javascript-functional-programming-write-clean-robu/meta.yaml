    \ (at least in a visible way) causes some side effects because the user does\n\
    see a change: namely, the produced output.\n\nThis does imply we'll never be able\
    \ to write a program that requires random numbers, handles\ndates, performs I/O,\
    \ and uses pure functions? Not at all—but it does mean that some functions\n't\
    \ be pure, and they will have some disadvantages that we will have to consider;\
    \ we'll return to\nt in a bit.\n\n# Advantages of pure functions\n\nThe main advantage\
    \ of using pure functions is that they don't have any side effects. When you\n\
