  md: '# Preface


    In computer programming, paradigms abound. Some examples include imperative programming,
    structured (goto-less) programming, object-oriented programming (OOP), aspect-oriented
    programming, and declarative programming. Lately, there has been renewed interest
    in a particular paradigm that can be considered to be older than (if not all)
    of the cited ones—functional programming (FP). FP emphasizes writing functions
    and connecting them in simple ways to produce more understandable and more easily
    tested code. Thus, given the increased complexity of today''s apps, it’s logical
    to have a cleaner way of programming JavaScript.


    This interest in FP comes in hand with the evolution of JavaScript. Despite this
    hasty creation (reported achieved in 10 days in 1995, by Brendan Eich at Netscape),
    today JavaScript is a standardized and quickly growing language, with features
    more advanced than most similarly popular languages. The ubiquity of the language,
    which can now be found in browsers, servers, mobile phones, and whatnot, has propelled
    interest in better development strategies. Also, if JavaScript wasn''t conceived
    as a functional language, the fact that it provides all the features you''d need
    to work in that fashion, which is another plus.


    That said, we must also comment on advances in the language and related tools.
    The benefits of data typing are generally acknowledged, and in recent years, TypeScript
    has gained wide adoption and has been used for both frontend and backend coding.
    It makes sense, then, to also include its usage in this book. With, we feel, will
    make the examples clearer, and also simplify the adaption of the presented code
    for “real-life jobs.


    It must also be that FP hasn''t been generally applied in industry, possibly because
    it has a certain aura of difficulty, and it is thought to be theoretical rather
    than practical, even mathematical, and possibly vocabulary and concepts that are
    foreign to developers—for example, functors, monads, folding, and category theory.
    While learning all this theory will be of help, it can be argued that with zero
    knowledge of the previous terms, you can understand the tenets of FP, and see
    how to apply it to your programming.


    FP is not something that you have to do on your own, without any help. There are
    many libraries and frameworks that operate, to greater or lesser degrees, the
    concepts of FP. Starting with jQuery (which includes some FP concepts), passing
    through Underscore and its close relative, Lodash, and other libraries like Ramda,
    and getting to more complex web tools such as React and Redux, Angular, and Elm
    (a 100% functional language, which compiles into JavaScript), the list of functional
    aids for your coding is growing.


    Learning how to use FP can be a worthwhile investment, and even though you may
    not use all of its methods and techniques, just to apply some of them will pay
    dividends in better code. You need not to try all the concepts of FP from the
    start, and you need not try to abandon every non-functional feature in JavaScript
    either. JavaScript assuredly has some bad features, but it also has the'
  merge: -1
  pgno: 13
- img_proc: false
  md: '# xiv Preface


    several very good and powerful ones. The idea is not to throw away everything
    you''ve learned and use adopt a 100% functional way; rather, the guiding idea
    is evolution, not revolution. In that sense, it can be said that what we''ll be
    doing is not FP, but Sorta Functional Programming (SFP) aiming for a fusion of
    paradigms.


    A final comment about the style of the code in this book—is quite true that there
    are very good libraries that provide you with FP tools: Underscore, Lodash, and
    Ramda are counted among them. However, I preferred to eschew usage because I wanted
    to show how things really work. It''s easy to apply a generic function from some
    package or the other, but by coding everything out (van FP, if you wish), it is
    my belief that you get to understand things more deeply. Also, as I will comment
    in some places, because of the power and clarity of arrow functions and other
    features, the pure JavaScript versions can be even simpler to understand!


    # Who this book is for


    This book is geared towards programmers with a good working knowledge of JavaScript
    (or, better yet, TypeScript) working either on the client side (browsers) or the
    server side (Node.js), who are interested in applying techniques to be able to
    write better, testable, understandable, and maintainable code. Some background
    in computer science (including, for example, data structures) and good programming
    practices will also come handy. In this book, we''ll cover FP in a practical way,
    though, at times, we will mention some theoretical points.


    # What this book covers


    Chapter 1, Becoming Functional – Several Questions, discusses FP, gives reasons
    for its usage, and lists the tools that you''ll need to take advantage of the
    rest of the book.


    Chapter 2, Thinking Functionally – A First Example, will provide the first example
    of FP by considering a common web-related problem and going over several solutions,
    to finally focus on a functional solution.


    Chapter 3, Starting Out with Functions – A Core Concept, will go over the central
    concept of FP, that is, functions and the different options available in JavaScript.


    Chapter 4, Behaving Properly – Pure Functions, will consider the concept of purity
    and pure functions, and demonstrate how it leads to simpler coding and easier
    testing.


    Chapter 5, Programming Declaratively – A Better Style, will use simple data structures
    to show how to produce results that work not in an imperative way, but in a declarative
    fashion.


    Chapter 6, Producing Functions – Higher-Order Functions, will deal with higher-order
    functions, which receive other functions as parameters and produce new functions
    as results.


    Chapter 7, Transforming Functions – Currying and Partial Application, will explore
    some methods for producing new and specialized functions from earlier ones.'
