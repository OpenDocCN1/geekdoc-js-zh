  md: '# Pure functions 79


    Some comments regarding this function:


    +   * The console.log() call is just for the sake of this example; it wouldn''t
    be included in the real-world function. It lists the accumulated difference up
    to the point and the result it will return: the given number rounded up or down.

    * We are using the IFFE pattern from the myCounter example in the Immediate invocation
    section of Chapter 3, Starting Out with Functions, to get a hidden variable.

    * The nRounded call could also be written as Math [accum > 0 ? "ceil": "floor"]
    (n)—we test accum to see how to invoke("ceil" or "floor") and then use the Object["method"]
    notation to indirectly invoke Object.method(). The way we used it, however, is
    clearer, but I just wanted to give you a heads-up in case you happen to find this
    other coding style.


    Running this function with two values (recognize them?) shows that results are
    not always the same as an input. The result part of the console log shows how
    the value rounded, up or down:


    ```

    roundFix(3.14159); // accum 0.00000 result 3

    roundFix(2.71828); // accum 0.14159 result 3

    roundFix(2.71828); // accum -0.14103 result 2

    roundFix(3.14159); // accum 0.57815 result 4

    roundFix(2.71828); // accum -0.28026 result 2

    roundFix(3.14159); // accum 0.43802 result 3

    roundFix(2.71828); // accum 0.15630 result 3

    ```


    The first time around accum is zero, 3.14159 rounded down, and accum becomes 0.14159
    in our favor. The second time, since accum is positive (meaning that we have been
    rounding in our favor), 2.71828 gets rounded up to 3, and accum becomes negative.
    The third time, the same 2.71828 value gets rounded down to 2 because the accumulated
    difference was negativewe got different values for the same input! The rest of
    the example is similar; you can get the same value rounded up or down, depending
    on the accumulated differences, the function''s result depends on its inner state.


    # Why not OOP?


    This usage of the internal state is why many FP programmers think that using objects
    is potentially flawed. In OOP, we develop objects to storing information (attributes)
    and using them for future calculations; however, this usage is considered impure
    insofar as repeated method calls return different values, although the same arguments
    are being passed.


    We have now dealt with the problems caused by both global and inner states, but
    there are more possible side effects there. For example, what happens if a function
    changes the values of its arguments?

    Let''s consider this.'
