  md: "# Working with async functions\n\nAll the examples and code we studied in the\
    \ previous sections were meant to be used with common functions, specifically\
    \ meaning not async ones. When you want to do mapping, filtering, reducing, and\
    \ so on, the function that you are using is an async one, the results may surprise\
    \ you. To simplify our work and not deal with actual API calls, let's create a\
    \ fakeAPI(delay, value) function that will delay a while before returning the\
    \ given value:\n\n```\n// async.ts\n\nconst fakeAPI = <T>(delay: number, value:\
    \ T): Promise<T> =>\n  new Promise((resolve) =>\n    setTimeout(() => resolve(value),\
    \ delay)\n);\n```\n\nLet's also have a function to display what fakeAPI() returns\
    \ so that we can see that things are working as expected:\n\n```\n// continued...\n\
    \nconst useResult = (x: any): void =>\n  console.log(new Date(), x);\n```\n\n\
    We are using the modern async and await features from ES2017 to simplify our code,\
    \ and we are avoiding the top-level await:\n\n```\n// async.ts\n\n(async () =>\
    \ {\n  console.log(\"START\");\n  console.log(new Date());\n  const result = await\
    \ fakeAPI(1000, 229);\n  useResult(result);\n  console.log(\"END\");\n})();\n\n\
    /*\nSTART\n2022-10-29T01:28:12.986Z\n2022-10-29T01:28:13.989Z 229\n```"
