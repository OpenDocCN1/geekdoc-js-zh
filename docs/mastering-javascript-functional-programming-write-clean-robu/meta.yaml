  md: '# Producing Functions – Higher-Order Functions


    With these definitions, we can write a findBestHero() function to get the top
    hero:


    ```

    const findBestHero = findOptimum2(compareHeroes);


    console.log(findBestHero(codingLeagueOfAmerica));

    // Electrico is the top Card!

    ```


    Does order matter

    When you rank elements according to one-to-one comparisons, unexpected results
    may be produced. For instance, with our superhero comparison lists, you could
    find three heroes where the results show that the first beats the second, the
    second beats the third, but the third beats the first! In mathematical terms,
    the comparison function is not transitive, and you don''t have a total ordering
    for the set.


    With this, we have seen several ways of modifying functions to produce new variants
    with enhanced processing; of particular cases you might be facing and whether
    an HOF might help you.


    # Summary


    In this chapter, we learned how to write HOFs of our own that can either wrap
    another function to provide some new feature, alter a function''s objective so
    that it does something else, or provide totally new features, such as decoupling
    methods from objects or creating better finders. The main takeaway from this chapter
    is that you have a way of modifying a function''s behavior without actually modifying
    its code; HOFs can manage this in an orderly fashion.


    In Chapter 7, Transforming Functions, we will keep working with HOFs and learn
    how to produce specialized versions of functions with predefined arguments using
    currying and partial application.


