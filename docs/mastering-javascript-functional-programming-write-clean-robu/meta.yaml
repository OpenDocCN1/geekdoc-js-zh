  md: "# 204 Producing Functions – Higher-Order Functions\n\n```\nconst throttle =\
    \ <T extends (...args: any[]) => void>(n  fn: T,\n  delay = 1000\n) => {\n  let\
    \ timer: ReturnType<typeof setTimeout> | undefined;\n  return (...args: Parameters<T>):\
    \ void => {\n    if (!timer) {\n      timer = setTimeout(() => {\n        timer\
    \ = undefined;\n      }, delay);\n      fn(...args);\n    }\n  };\n};\",\n```\n\
    \nA throttled function is a new one, which you can call as often as desired, but\
    \ it will \"do its thing\" the first time and not again until a certain delay.\
    \ When you call the function, it first checks whether the timer is set; if so,\
    \ it will do nothing. If the timer is not set, a timeout will be set to clear\
    \ the timer after some delay, and the function will be called. We are using the\
    \ timer variable both for the timeout and as a flag \"are we waiting?\"\n\nSo\
    \ far, we have learned how to wrap functions while keeping their original behavior\
    \ or by altering them in some fashion. Now, let's consider some other ways of\
    \ modifying functions.\n\n# Changing functions in other ways\n\nLet's end this\
    \ chapter by considering other sundry functions that provide results, such as\
    \ new finders, decoupling methods from objects, and our examples will include:\n\
    \n+   - Turning operations (such as adding with the + operator) into functions\n\
    - Turning functions into promises\n- Accessing objects to get the value of a property\n\
    - Turning methods into functions\n- A better way of finding optimum values"
