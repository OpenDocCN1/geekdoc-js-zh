  \ instanceof Array` 也通过检查对象的原型链中是否存在 `Array.prototype` 来起作用。然而，`Array.isArray()`\
  \ 通常因其在不同执行上下文中的清晰性和可靠性而被优选。\n\n在 JavaScript 中以下操作的结果是什么？\n\n```\n\"10\" * 5\n```\n\
