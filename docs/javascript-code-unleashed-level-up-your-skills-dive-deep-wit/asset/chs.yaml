  \ JavaScript 中的 `?.` 运算符代表可选链。它允许你安全地访问对象的深度嵌套属性，而无需检查链中的每个引用是否为 `null` 或 `undefined`。如果引用为空值（`null`\
  \ 或 `undefined`），则表达式将短路并返回 `undefined`。\n\n以下代码演示了什么？\n\n```javascript\nasync function\
