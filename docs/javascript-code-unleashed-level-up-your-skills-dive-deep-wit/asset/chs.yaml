  \n解释：`Object.seal` 防止向对象添加新属性，并将所有现有属性设置为不可配置，这意味着你不能删除它们。然而，它仍然允许修改现有属性的值（除非它们被单独定义为只读），这与防止对对象进行任何更改的\
  \ `Object.freeze` 不同。\n\n关于 JavaScript 中的模板字符串（template literals），哪种描述是正确的？\n\n\
