  \ JavaScript 表达式，包括变量和操作，这使得模板字符串在创建动态字符串时非常强大。\n\nJavaScript 中 `Array.prototype.flatMap`\
  \ 方法的目的是？\n\nA) 将数组展平到指定的深度并使用提供的函数对其进行映射。\n\nB) 对数组的每个元素应用函数，而不改变数组的结构。\n\nC) 将每个元素映射到一个新数组，并将子数组合并成一个数组。\n\
