  \ scope\n\n**解析：** 代码段演示了 JavaScript 中的词法作用域（lexical scoping）。最内层的自执行函数修改了在其父级作用域（第一个自执行函数）中声明的变量\
  \ `x`，设置为 `'innermost scope'`。由于 `console.log(x);` 语句在修改 `x` 的同一作用域内执行，因此打印了 `innermost\
  \ scope`。外部的 `x` 变量被内部的 `x` 屏蔽并保持不变。\n\n如何在 JavaScript ES6 中实现模块封装？\n\nA) 使用 `module`\
