  \ 核心原理与基础\n\n在本节中，我们将深入探讨定义 JavaScript 成为一种动态且多功能编程语言的核心原理和特殊特性。从理解数据类型转换的复杂性，到掌握\
  \ ES6 引入的现代语法，我们的旅程将让你具备编写高效有效 JavaScript 代码的知识。每个概念都通过实际示例进行说明，确保你不仅学习了理论，还学习了如何在现实场景中应用它。\n\
  \n本节旨在为 JavaScript 建立下坚实的基础，同时涵盖了基础概念和 ES6 引入的高级特性。通过理解这些原理，你将更好地应对 JavaScript 动态且有时不可预测的本质，让你的\
  \ Web 开发之旅更加明智且充满自信。\n\n## Chrome DevTools\n\nChrome 开发者工具（通常称为 DevTools）是一套直接构建在\
  \ Google Chrome 浏览器中的 Web 开发者工具。它们为开发者提供了深度访问浏览器及其 Web 应用程序内部的能力。使用 DevTools，你可以实时编辑页面、快速诊断问题并更快地构建更好的网站。以下是关于如何使用\
  \ DevTools 的基础指南，特别关注控制台（Console）。\n\n![](img/image_rsrc61D.jpg)\n\n图片：在 Chrome\
  \ 中访问 DevTools\n\n### 访问 DevTools\n\n打开 DevTools：有几种方法可以打开 Chrome DevTools。\n\n\
  - 右键点击任何页面元素并选择“检查（Inspect）”。\n- 使用快捷键 `Ctrl+Shift+I`（Mac 上使用 `Cmd+Opt+I`）。\n- 从\
  \ Chrome 右上角的菜单中，转到“更多工具” > “开发者工具”。\n\n导航到控制台：打开 DevTools 后，你可以点击“Console（控制台）”标签切换到控制台视图。控制是一个强大的工具，允许开发者与当前页面的\
  \ JavaScript 上下文交互、运行脚本并记录信息。\n\n### 理解代码片段的输出\n\n在分析 JavaScript 代码片段以预测其输出时，考虑涉及的数据类型以及\
  \ JavaScript 如何解释它们是非常重要的。查看输出的最快方法是通过 `console.log()`，它允许你在 DevTools 控制台中查看结果。\n\
  \n例如：\n\n```\nconsole.log(1 + \"2\" + 3);\n```\n\n这段代码演示了类型转换，JavaScript 将数字 1 和\
  \ 3 转换为字符串，以便与 \"2\" 拼接，结果为字符串 \"123\"。\n\n![](img/image_rsrc61E.jpg)\n\n图片：显示来自\
  \ devTools 的 console log 输出。\n\n### 理解 console.log(1 + \"2\" + 3) 输出\n\n当你在控制台中运行\
  \ `console.log(1 + \"2\" + 3)` 时，它会执行以下操作：\n\n- 首先，它评估 `1 + \"2\"`，结果为 `\"12\"`。在\
  \ JavaScript 中，当你对数字和字符串使用 `+` 运算符时，数字会被转换为字符串并进行拼接。\n- 接着，它评估 `\"12\" + 3`，由于相同的原因，结果为\
  \ `\"123\"`。\n\n因此，`console.log(1 + \"2\" + 3)` 向控制台输出 `\"123\"`。\n\n关于 `undefined`\
  \ 输出：\n\n- 在执行完一条条语句后，控制台还会显示该语句的返回值。\n- `console.log()` 本身不返回值（或者在 JavaScript 术语中，它返回\
  \ `undefined`）。\n- 因此，在控制台打印 \"123\" 之后，它还会显示 `undefined`，以表示 `console.log()` 函数调用的返回值。\n\
  \n这种行为是控制台特有的。它的设计目的是提供关于执行语句返回值的即时反馈，这对于调试和交互式编码课程特别有用。\n\n要理解代码片段的输出，你需要运行它并观察结果。让我们考虑一个简单的例子：\n\
  \n```\nconsole.log(2 + 2);\n```\n\n输出：4\n\n## 解释表达式的结果\n\n在 JavaScript 中评估表达式可以根据所使用的运算符产生各种结果。\n\
  \n例如：\n\n```\n5 == \"5\"\n```\n\n该表达式评估结果为 `true`，因为 `==` 运算符执行了类型转换，允许在数据类型不同的情况下进行值比较。\n\
  \n评估表达式并解释其结果涉及理解所涉及值的类型以及操作如何影响它们。\n\n例如：\n\n```\nconsole.log(\"Hello \" + \"World!\"\
  );\n```\n\n输出：Hello World!\n\n## 解密 JavaScript 代码输出\n\n要预测 JavaScript 代码的输出，理解上下文和操作至关重要。例如：\n\
  \n```\nconsole.log(typeof NaN);\n```\n\n输出为 `number`，说明 `NaN`（不是数字）自矛盾地被归类为数字。\n\
  \n要解密代码输出，请考虑数据类型和操作。例如：\n\n```\nconsole.log(1 + \"2\");\n```\n\n输出：12（因为 \"2\"\
  \ 是字符串，`+` 运算符执行拼接而非相加）。\n\n### == 等等运算符的意义\n\nJavaScript 的 `==` 运算符执行类型转换，允许跨不同类型比较值，这与\
  \ `===` 运算符不同，后者要求值和类型都相同。\n\n```\nconsole.log('10' == 10); // 因为类型转换为 true\nconsole.log('10'\
  \ === 10); // 因为类型不同为 false\n```\n\n`==` 运算符在将两个操作数转换为公共类型后检查相等性。这种特性被称为类型转换，在比较不同数据类型时可能会导致意料之外的结果，强调了理解\
  \ JavaScript 类型转换的重要性。\n\n`==` 运算符在将两个操作数转换为相同类型后检查相等性。\n\n```\nconsole.log('1'\
  \ == 1);\n```\n\n输出：true（发生了类型转换，将数字 1 转换为字符串 \"1\"）。\n\n### == 与 === 的区别\n\n`==`\
  \ 运算符执行类型转换以比较值，可能会导致非直观的结果。相比之下，`===` 是严格相等运算符，它在不转换的情况下同时比较值和类型，提供了更准确的相等检查。\n\
  \n```\nconsole.log('1' == 1); // true\nconsole.log('1' === 1); // false\n```\n\n\
  ### typeof null 的返回值\n\n在 JavaScript 中，`null` 是一个对象，这可能会让人困惑。`null` 和 `undefined`\
  \ 都用于表示值的缺失，但上下文略有不同。\n\n`typeof null` 表达式有趣地返回 object，这是 JavaScript 的一个已知特性。这种行为被认为是\
  \ JavaScript 早期的一个 bug，但为了兼容性一直保留了下来。\n\n`typeof` 运算符返回一个指示未求值操作数类型的字符串。\n\n```\n\
  console.log(typeof null);\n```\n\n\n\n\n输出: object (这是一个长期的 JavaScript 标记)。\n\n\
  ```javascript\nlet notDefined;\n\nconsole.log(notDefined); // undefined\n\nconsole.log(null\
  \ === undefined); // false\n\nconsole.log(null == undefined); // true, 由于于类型转换\n\
  ```\n\n## 区分 null 和 undefined\n\nJavaScript 中的 `null` 和 `undefined` 都表示值的缺失，但在所处的语文中不同。`null`\
  \ 用于有意地表示变量没有值或未分配任何对象，而 `undefined` 则表示变量已经声明但尚未赋值。\n\n`null` 是一个表示“无值”的赋值值，而 `undefined`\
  \ 意味着变量已声明但未被赋值。\n\n```javascript\nlet a;\n\nconsole.log(a); // undefined\nconsole.log(null);\
  \ // null\n```\n\n### 将 Set 展开为数组\n\n扩展运算符 `...` 允许像 `Set` 这样的可迭代对象在期望零或多个参数（用于函数调用）或元素（用于数组字面量）的地方进行展开。\n\
  \n使用扩展运算符将 `Set` 转换为数组，展示了 ES6 特性在处理集合时的无缝集成。这种技术为从 `Set` 对象创建数组提供了一种简洁且有效的方法，利用了\
  \ `Sets` 的唯一属性。\n\n扩展语法允许像 set 这样的可迭代对象在期望零或多个参数或元素的地方展开。\n\n```javascript\nconst\
  \ mySet = new Set([1, 2, 3]);\n\nconst myArray = [...mySet];\n\nconsole.log(myArray);\
  \ // 输出: [1, 2, 3]\n```\n\n在 JavaScript 中，将将 set 展开为数组以便使用数组方法操作存储在 set 中的数据，或者当你需要确保数组中元素的唯一性时，这种方法会特别有用。以下是三个示例，展示了如何将\
  \ set 展开为数组：\n\n#### 示例 1：Set 的基础展开\n\n假设你有一个数字集合，并且你想要从该集合中创建一个数组。\n\n```javascript\n\
  const numberSet = new Set([1, 2, 3, 4, 5]);\nconst numberArray = [...numberSet];\n\
  \nconsole.log(numberArray); // 输出: [1, 2, 3, 4, 5]\n```\n\n#### 示例 2：将两个 Set 合并为一个数组\n\
  \n如果你有两个 set 并想将它们合并为一个单一且不重复的数组，可以在数组字面量中对两个 set 使用扩展运算符。\n\n```javascript\nconst\
  \ set1 = new Set([1, 2, 3]);\nconst set2 = new Set([3, 4, 5]);\nconst combinedArray\
  \ = [...set1, ...set2];\n\nconsole.log(combinedArray); // 输出: [1, 2, 3, 4, 5]\n\
  ```\n\n此示例合并了 `set1` 和 `set2`，因为 set 会自动去重，将它们展开为数组实现了不重复的合并。\n\n#### 示例 3：使用 Set\
  \ 移除数组中的重复项然后展开到新数组\n\n有时，你可能从一个包含重复项的数组开始并想要移除这些重复项。你可以将数组转换为 `set`（这会去重），然后将其展开回数组。\n\
  \n```javascript\nconst arrayWithDuplicates = [1, 2, 2, 3, 4, 4, 5];\nconst uniqueArray\
  \ = [...new Set(arrayWithDuplicates)];\n\nconsole.log(uniqueArray); // 输出: [1, 2,\
  \ 3, 4, 5]\n```\n\n此示例首先将 `arrayWithDuplicates` 转换为 `set` 以去重，然后将此 set 展开到一个新数组，得到一个包含唯一值的数组。\n\
  \n这些示例演示了扩展运算符配合 set 的多功能性，允许唯一组合、去重以及 set 与数组之间的转换。\n\n### JavaScript 中的提升 (Hoisting)\n\
  \n提升是 JavaScript 的一种行为，在编译阶段将变量和函数声明移动到其所在作用域的顶部。这允许在代码声明之前使用变量和函数。\n\n```javascript\n\
  console.log(x);\n\nvar x = 5;\n```\n输出: undefined（不是 ReferenceError，因为 `x` 的声明被提升了）。\n\
  \nJavaScript 中的提升概念是指在代码执行之前将变量和函数声明移动到其所在作用域顶部的行为。这意味着变量和函数可以在代码声明之前被引用。需要注意的是，只有声明会被提升，而初始化不会。\n\
  \n以下是三个展示 JavaScript 提升的示例：\n\n#### 示例 1：函数提升\n\n函数声明会被提升，允许它们在代码中定义之前被调用。\n\n```javascript\n\
  // 在声明之前调用函数\ngreet();\n\n// 函数声明\nfunction greet() {\n  console.log('Hello, world!');\n\
  }\n// 输出: \"Hello, world!\"\n```\n\n在此示例中，`greet` 函数在声明之前被调用了。由于函数提升，JavaScript\
  \ 在编译阶段将声明移动到顶部，使得此调用有效。\n\n#### 示例 2：使用 var 的变量提升\n\n使用 `var` 的变量声明（但不包括初始化）会被提升到作用域的顶部，这可能会导致意外的结果。\n\
  \n```javascript\nconsole.log(message); // 输出: undefined\n\nvar message = 'Hoisting\
  \ is here!';\n\n// 上述代码的行为就像这样写：\n// var message;\n// console.log(message);\n//\
  \ message = 'Hoisting is here!';\n```\n\n在此示例中，在声明之前访问 `message` 会输出 undefined，因为只有声明（`var\
  \ message;`）被到了顶部，而不是初始化（`message = 'Hoisting is here!';`）。\n\n#### 示例 3：let 和 const\
  \ 的提升限制\n\n用 `let` 和 `const` 的变量也会被提升，但它们不会被初始化。在声明之前访问它们会导致由于暂性死区（TDZ）引起的 ReferenceError。\n\
  \n```javascript\nconsole.log(name); // ReferenceError: Cannot access 'name' before\
  \ initialization\n\nlet name = 'JavaScript';\n```\n\n尽管 `let` 和 `const` 声明被提升，但在它们初始化之前无法被访问。这些示例演示了提升如何作用于函数和变量，以及行为如何取决于声明的类型。\n\
  \n### void 运算符的作用\n\n`void` 运算符评估表达式并返回 `undefined`。它对于实际上并不跳转的超链接有用。\n\n```javascript\n\
  void function() {\n  console.log(\"这将会运行，但返回 undefined\");\n}();\n```\n\n`void`\
  \ 运算符评估给定的表达式并返回 `undefined`。\n\n```javascript\nconsole.log(void(0)); // 输出: undefined\n\
  ```\n\n## 将数字保留两位小数\n\nJavaScript 提供了处理数字的方法，包括舍入和检查有限性。要将数字保留两位小数，可以使用 `toFixed()`\
  \ 方法，该方法将数字转换为字符串，并保留到指定的小数位数。\n\n将数字保留两位小数是各种编程任务中的常见需求，特别是在处理财务计算时。\n\n#### 示例：使用\
  \ toFixed()\n\n`toFixed()` 方法使用固定点计数法格式化数字，将数字舍入到指定的小数位数。\n\n```javascript\nconst\
  \ number = 2.34567;\nconst rounded = number.toFixed(2);\n\nconsole.log(rounded);\
  \ // 输出: \"2.35\"\n```\n\n需要注意的是 `toFixed()` 返回的是字符串。如果你需要结果为数字，可以使用 `parseFloat()`\
  \ 或 `Number()` 包裹 `toFixed()` 调用。\n\n```javascript\nconst roundedNumber = parseFloat(number.toFixed(2));\n\
  ```\n\n\n\n\n\n```javascript\n// const roundedNumber = Number(number.toFixed(2));\n\
  \nconsole.log(roundedNumber); // 输出: 2.35\n```\n\n## 示例 2：使用 `Math.round()`\n\n\
  如果你想使用数学舍入法将数字保留到两位小数，可以使用 `Math.round()` 配合倍数使用。\n\n```javascript\nconst number\
  \ = 2.34567;\n\nconst rounded = Math.round(number * 100) / 100;\n\nconsole.log(rounded);\
  \ // 输出: 2.35\n```\n\n这种方法通过将数字乘以 `100` 将小数点向右移动两位，进行四舍五入，然后除以 `100` 将小数点移回原始位置。\n\
  \n## 示例 3：使用自定义舍入函数\n\n对于更复杂的舍入场景，或者在你可能由于 `toFixed()` 的返回类型而不想依赖它的环境中，你可以创建一个自定义的舍入函数。\n\
  \n```javascript\nfunction roundToTwo(num) {\n\nreturn +(Math.round(num + \"e+2\"\
  ) + \"e-2\");\n\n}\n\nconst number = 2.34567;\n\nconst rounded = roundToTwo(number);\n\
  \nconsole.log(rounded); // 输出: 2.35\n```\n\n该函数使用科学计数法（e-notation）来对数字进行舍入。它向数字添加\
  \ `\"e+2\"` 以在舍入前将小数点向右移动两位，然后减去 `\"e-2\"` 移回，从而有效地将数字舍入到两位小数。开头的一元加（`+`）将字符串结果转换回数字。\n\
  \n这些示例提供了在 JavaScript 中将数字保留两位小数的不同方法，每种方法根据你项目的特定需求都有其适用场景。\n\n### 检查数字是否有限且非 NaN\n\
  \n要验证一个值是否为有限数字而非 `NaN`，你可以使用 `isFinite()` 函数，它对 `Infinity`、`-Infinity` 和 `NaN`\
  \ 返回 `false`，而对有限数字返回 `true`。\n\n```javascript\nconst num = 1 / 0;\n\nconsole.log(isFinite(num));\
  \ // false\n```\n\n`isFinite()` 函数判断一个数字是否是有限的合法数字。\n\n```javascript\nconsole.log(isFinite(2/0));\
  \ // false\n\nconsole.log(isFinite(20/5)); // true\n\nconsole.log(isFinite(NaN));\
  \ // false\n```\n\n### 检测用户的设备类型\n\n检测用户的设备类型对于响应式设计可能很有用。虽然 JavaScript 可以提供一些见解，但通常建议使用\
  \ CSS 媒体查询或库来确保准确性。\n\n在 JavaScript 中检测用户的设备类型通常涉及检查 `navigator.userAgent` 字符串，其中包含了有关浏览器和操作系统的信息。然而，为了获得更可靠的结果（特别是区分移动设备和桌面设备），请考虑使用库或基于\
  \ CSS 方法。\n\n你可以使用 `navigator.userAgent` 属性，但为了获得更准确的结果，请使用像 `Modernizr` 这样的库。\n\
  \n```javascript\nif(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))\
  \ {\n\nconsole.log(\"检测到移动设备.\");\n\n} else {\n\nconsole.log(\"检测到桌面设备.\");\n\n\
  }\n```\n\n### 使用 ES6 声明不可变变量\n\n在 ES6 中，`const` 关键字用于声明不能重新赋值的变量。这对于程序执行过程中应该保持不变的值是非常理想的。\n\
  \n`const` 关键字允许你声明值不可重新赋值的变量。\n\n在 ES6 (ECMAScript 2015) 中，`const` 关键字用于声明不应被重新赋值的变量。使用\
  \ `const` 声明变量使其在某种意义上是不可变的，即你不能将其重新赋值为不同的值。然而，重要的是，如果变量持有一个对象或数组，该对象或数组的内容仍然可以修改，除非你使用其他手段使它们变得不可变。以下是三个使用\
  \ `const` 在 JavaScript 中声明不可变变量的示例：\n\n```javascript\nconst PI = 3.14159;\n\n//\
  \ PI = 22/7; // TypeError: 赋值常量变量。\n\nconsole.log(PI);\n```\n\n#### 示例 1：声明原始值\n\
  \n```javascript\nconst pi = 3.14159;\n\nconsole.log(pi); // 输出: 3.14159\n\n// 尝试重新为\
  \ pi 赋值将导致错误\n\n// pi = 3.14; // TypeError: 赋值常量变量。\n```\n\n此示例展示了对原始值使用 `const`\
  \ 的基本用法。由于 `pi` 是一个常量，在初始声明后尝试更改其值会导致运行时错误。\n\n#### 示例 2：不可变数组（某种意义上）\n\n```javascript\n\
  const colors = ['red', 'green', 'blue'];\n\nconsole.log(colors); // 输出: ['red',\
  \ 'green', 'blue']\n\n// 你修改数组的内容\n\ncolors.push('yellow');\n\nconsole.log(colors);\
  \ // 输出: ['red', 'green', 'blue', 'yellow']\n\n// 但你不能重新赋值数组\n\n// colors = ['purple',\
  \ 'orange']; // TypeError: 赋值常量变量。\n```\n\n在此示例，`colors` 使用 `const` 声明，使得变量本身是不可变的。然而，数组的内容仍然可以修改（例如，可以添加、删除或更改项目）。`const`\
  \ 强制的不可变性仅适用于 `colors` 与其数组之间的绑定，而不是数组的内容。\n\n#### 示例 3：不可变对象（某种意义上）\n\n```javascript\n\
  const car = {\n\n  make: 'Toyota',\n\n  model: 'Camry'\n\n};\n\nconsole.log(car);\
  \ // 输出: { make: 'Toyota', model: 'Camry' }\n\n// 你可以修改属性\n\ncar.year = 2020;\n\n\
  console.log(car); // 输出: { make: 'Toyota', model: 'Camry', year: 2020 }\n\n// 但你不能重新赋值对象\n\
  \n// car = { make: 'Honda', model: 'Accord' }; // TypeError: 赋值常量变量。\n```\n\n与数组类似，使用\
  \ `const` 声明对象防止重新赋值变量。然而，对象的属性仍然可以添加或删除。对于对象的真正的不可变（防止任何更改），你需要使用如 `Object.freeze()`\
  \ 等功能或提供不可变数据结构的库。\n\n### 检查对象中的属性\n\n要检查对象是否具有某个属性，你可以使用 `hasOwnProperty()` 方法或\
  \ `in` 运算符。\n\n```javascript\nconst obj = { key: 'value' };\n\nconsole.log(obj.hasOwnProperty('key'));\
  \ // true\n\nconsole.log('key' in obj); // true\n```\n\n\n\n\n\n## 示例 3：使用可选链运算符\
  \ (?.) 和 undefined 检查\n\n虽然这不是直接检查属性是否存在，但可选链操作符 `?.` 允许你安全地访问嵌套对象的属性，而无需检查每一层嵌套。你可以将其与\
  \ `undefined` 检查结合，推断属性是否存在。\n\n```javascript\nconst car = {\n  specs: {\n    engine:\
  \ 'V6',\n    horsepower: 268\n  }\n};\n\nconsole.log(car.specs?.engine !== undefined);\
  \ // 输出: true\nconsole.log(car.specs?.mileage !== undefined); // 输出: false\n```\n\
  \n此示例检查了 `specs` 内部 `engine` 属性，该属性存在，因此输出为 true。它还检查了 `specs` 中的 `mileage` 属性，该属性不存在，因此输出为\
  \ false。\n\n这些示例展示了判断对象是否包含特定属性的不同方法，每种方法都根据检查属性存在和继承的要求在各种场景中大有用武。\n\n## 练习题：回答以下问题\n\
  \n- 在 JavaScript 中使用 `==` 运算符进行相等比较的意义是什么？\n- JavaScript 中 `typeof null` 表达式返回什么？\n\
  - 在 JavaScript 中尝试将 `Set` 展开到数组中的结果是什么？\n- JavaScript 中 `==` 和 `===` 之间的主要区别是什么？\n\
  - JavaScript 中的“提升”（hoisting）是指什么？\n- JavaScript 中的 `void` 运算符的作用是什么？\n- 如何在 JavaScript\
  \ 中将数字保留两位小数？\n- 如何检查一个数字是否是有限的且不是非数字？\n- 如何在 JavaScript 中检测用户的设备类型？\n- 在 ES6 中，使用哪个关键字来声明一个不可重新赋值的变量？\n\
  - 如何检查 JavaScript 对象 `obj` 是否具有属性键？\n\n## JavaScript 基础知识测试\n\n### 检查对象中的属性\n\n\
  如何检查对象 `person` 中是否存在属性 `age`？\n\nA) `person.age`\nB) `person.hasOwnProperty('age')`\n\
  C) `'age' in person`\nD) 选项 B 和 C 都对\n\n**答案：D**\n\n**解析：** `hasOwnProperty('age')`\
  \ 和 `'age' in person` 都是检查 `age` 是否存在于 `person` 中的正确方法。前者检查该属性是否为对象的直接属性，而后者则在对象及其原型链中进行检查。\n\
  \n### 检查数字是否有限且非 NaN\n\n使用哪个函数可以检查一个值是否是有限数字且非 NaN？\n\nA) `Number.isFinite(value)`\n\
  B) `isFinite(value)`\nC) `isNaN(value)`\nD) `Number.isNaN(value)`\n\n**答案：A**\n\n\
  **解析：** `Number.isFinite(value)` 在该值为有限数字时返回 `true`。与全局函数 `isFinite()` 不同，它不会强制将参数转换为数字，从而提供了更严格的检查。\n\
  \n### JavaScript 中的提升概念\n\nJavaScript JavaScript 中的提升意味着什么？\n\nA) 自动将变量声明移动到函数作用域或全局作用域的顶部。\n\
  B) 将函数声明提升到脚本文件的顶部以获得更好的可见性。\nC) 在运行时将变量值与其声明一同提升。\nD) 一种通过预加载函数来优化代码执行的技术。\n\n\
  **答案：A**\n\n**解析：** JavaScript 中的提升是指代码执行之前，将所有声明（变量和函数）移动到它们所在作用域（即声明它们的函数或全局作用域）顶部的默认行为。\n\
  \n### 解析 JavaScript 代码输出\n\n以下代码段的输出是什么？\n```javascript\nconsole.log(2 + '2');\n\
  ```\nA) 4\nB) 22\nC) '22'\nD) TypeError\n\n**答案：C**\n\n**解析：** JavaScript 执行了类型转换，将数字\
  \ `2` 转换为字符串并与另一个字符串 `'2'` 拼接，结果为 `'22'`。\n\n### 使用 ES6 声明不可变变量\n\nES6 中使用哪个关键字来声明不可变变量？\n\
  \nA) `var`\nB) `let`\nC) `const`\nD) `immutable`\n\n**答案：C**\n\n**解析：** ES6 中的 `const`\
  \ 关键字用于声明不可重新赋值的变量。请注意，用 `const` 声明的对象或数组的内部仍然可以被修改。\n\n### 检测用户的设备类型\n\n如何在 JavaScript\
  \ 中检测用户的设备是否为移动设备？\n\nA) 使用 `window.mobileCheck()`\nB) 检查 `navigator.userAgent`\
  \ 是否包含移动设备特征\nC) 使用 `document.isMobile`\nD) 在 JavaScript 中应用 CSS 媒体查询\n\n**答案：B**\n\
  \n**解析：** `navigator.userAgent` 可用于检查指示移动设备的字符串。这并非万无一失，但常用于简单的设备类型检查。\n\n## ==\
  \ 和 === 之间的区别\n\nJavaScript 中 `==` 和 `===` 的主要区别是什么？\n\nA) 没有区别；它们的功能完全相同。\nB) `==`\
  \ 执行类型转换，而 `===` 不执行。\nC) `===` 仅用于数值比较。\nD) `==` 可以比较对象，但 `===` 不可以。\n\n**答案：B**\n\
  \n**解析：** `==` 在将两个值转换为公共类型（类型转换）后进行比较，而 `===` 在不进行转换的情况下同时比较类型和值，从而实现严格相等比较。\n\n\
  ## 使用 == 运算符进行相等比较的意义\n\n为什么你可能使用 `==` 运算符而不是 `===`？\n\nA) 为了允许在比较时进行类型转换。\nB) 在比较相同的值时。\n\
  C) 为了确保严格相等。\nD) 总是应该使用 `===` 而不是 `==`。\n\n**答案：A**\n\n**解析：** `==` 用于在比较时进行类型转换，以确保在类型不同的情况下判断相等。\n\
  \n## null 和 undefined 的区别\n\n`null` 和 `undefined` 之间的区别是什么？\n\nA) `null` 表示值的缺失，而\
  \ `undefined` 表示未赋值。\nB) 它们是相同的类型。\nC) 没有区别。\nD) 表示一个空值。\n\n**答案：A**\n\n**解析：**\
  \ 在 JavaScript 中，`null` 是故意的空值，而 `undefined` 表示变量尚未被赋值。\n\n### 表达式结果的解析\n\n表达式!!\"\
  false\" == [] 在 JavaScript 中的结果是什么？\n\nA) true\nB) false\nC) TypeError\nD) undefined\n\
  \n**答案：A**\n\n**解析：** `\"false\"` 和 `[]` 都是真值。双重否定 `!!` 将它们转换为 `true`。由于两者为真，`==`\
  \ 的结果也是真。\n\n## 将数字保留两位小数\n\n哪个方法可以将数字保留两位小数并返回字符串？\n\nA) `Math.round(num, 2)`\n\
  B) `num.toFixed(2)`\nC) `Math.floor(num * 100) / 100`\nD) `Number(Math.round(num\
  \ + 'e2') + 'e-2')`\n\n**答案：B**\n\n**解析：** `num.toFixed(2)` 将数字转换为字符串并保留两位小数。其他方法（除了用法错误的\
  \ `Math.round(num, 2)`）返回的是数字。\n\n### 将 Set 展开到数组\n\n如何在 JavaScript 中将 `set` 转换为数组？\n\
  \nA) `Array.from(set)`\nB) `[...set]`\nC) `set.toArray()`\nD)  A 和 B 都对\n\n**答案：D**\n\
  \n**解析：** `Array.from(set)` 和展开语法 `[...set]` 都用于从 set 创建数组。\n\n\n\n\n\n哪种方法没有直接在对象的链中检查属性的性？\n\
  \nA) `obj.hasOwnProperty('prop')`\n\nB) `'prop' in obj`\n\nC) `obj.prop !== undefined`\n\
  \nD) `Object.keys(obj).includes('prop')`\n\n答案： C\n\n解释：表达式 `obj.prop !== undefined`\
  \ 检查属性是否具有除 `undefined` 以外的值，这并不是检查属性存在的直接方法。如果属性存在但其值为 `undefined`，它可能会产生假阴性结果。\n\
  \n## 检查数字是否有限且不是 NaN\n\n`Number.isFinite(Infinity)` 的输出是什么？\n\nA) `true`\n\nB) `false`\n\
  \nC) `NaN`\n\nD) `undefined`\n\n答案： B\n\n解释：`Number.isFinite(Infinity)` 返回 `false`，因为\
  \ `Infinity` 不是一个有限数字。\n\n## JavaScript 中的变量提升概念\n\n当使用 `const` 将函数赋值给变量时，在声明之前尝试使用该函数的结果是什么？\n\
  \nA) 函数正常执行。\n\nB) 抛出 `TypeError`。\n\nC) 抛出 `ReferenceError`。\n\nD) `undefined`。\n\
  \n答案： C\n\n解释：使用 `const` 赋值给变量的函数不会提升，因此在声明之前尝试使用它们会导致 `ReferenceError`。\n\n## 解密\
  \ JavaScript 代码输出\n\n以下代码的输出是什么？`console.log(typeof typeof 1);`\n\nA) `'number'`\n\
  \nB) `'string'`\n\nC) `'object'`\n\nD) `'undefined'`\n\n答案： B\n\n解释：内部的 `typeof\
  \ 1` 返回 `'number'`，而 `typeof 'number'` 返回 `'string'`，因为 `typeof` 运算符始终返回一个指示求值表达式类型的字符串。\n\
  \n## 使用 ES6 不可变变量\n\n关于 ES6 中使用 `const` 声明变量的陈述哪个正确？\n\nA) 使用 `const` 声明的变量可以重新声明。\n\
  \nB) 使用 `const` 声明的数组和对象不能修改其内容。\n\nC) `const` 需要初始化器且不能不初始化。\n\nD) `const` 声明被提升到块作用域的顶部。\n\
  \n答案： C\n\n解释：当你使用 `const` 声明变量时，必须在声明时对其进行初始化。与会被提升的 `var` 声明不同，`const` 声明在词法绑定被评估之前不会初始化。\n\
  \n## 检测用户设备类型\n\n除了简单的用户代理字符串检查外，可以使用什么 JavaScript 特性进行更详细的设备特性检测？\n\nA) `navigator.device`\n\
  \nB) `window.screen`\n\nC) `window.matchMedia`\n\nD) `document.detectDevice`\n\n\
  答案： C\n\n解释：`window.matchMedia` 可以从 JavaScript 查询 CSS 媒体特征，有助于对设备能力和特征进行更细致的检测，例如屏幕分辨率和方向。\n\
  \n## == 和 === 之间的区别\n\n比较 `0 == '0'` 的结果是什么？\n\nA) `true`\n\nB) `false`\n\nC) `TypeError`\n\
  \nD) `undefined`\n\n答案： A\n\n解释：`==` 运算符执行类型转换，将字符串 `'0'` 转换为数字后再与数字 `0` 进行比较，结果为\
  \ `true`。\n\n## 使用 == 运算符进行相等比较的意义\n\n在何种场景下 `==` 运算符可能特别有用？\n\nA) 比较两个对象的相等性时。\n\
  \nB) 比较不同类型的值时，且你希望进行类型转换。\n\nC) 需要严格类型相等时。\n\nD) 它永远没用；应该始终使用 `===` 代替。\n\n答案：\
  \ B\n\n解释：比较不同类型的值时，如果你希望 JavaScript 执行类型转换，`==` 运算符就是很有用的，例如比较一个数字和一个代表数字的字符串。\n\
  \n## 区分 null 和 undefined\n\n在比较 `null` 和 `undefined` 时，什么操作的结果为 `true`？\n\nA) `null\
  \ == undefined`\n\nB) `null === undefined`\n\nC) `null != undefined`\n\nD) `null\
  \ !== undefined`\n\n答案： A\n\n解释：`null == undefined` 为 `true` 是因为 `==` 执行类型转换，并在比较时将\
  \ `null` 和 `undefined` 视为相等，而 `===` 因为它们类型不同而认为它们不同。\n\n## 解释表达式的结果\n\n在 JavaScript\
  \ 中，表达式 `1 + 2 + '3'` 的值为什么？\n\nA) `'123'`\n\nB) `6`\n\nC) `'33'`\n\nD) `undefined`\n\
  \n答案： C\n\n解释：JavaScript 从左到右求值表达式。在这里，首先求值 `1 + 2` 结果为 `3`，然后执行 `3 + '3'`，由于类型转换，得到字符串\
  \ `'33'`。\n\n## 将数字保留两位小数\n\n如何使用 `toFixed()` 准确地将 `1.005` 保留两位小数？\n\nA) `(1.005).toFixed(2)`\n\
  \nB) `Number((1.005).toFixed(2))`\n\nC) `+(1.005).toFixed(2)`\n\nD) `Number(Math.round(1.005\
  \ + \"e+2\") + \"e-2\")`\n\n答案： D\n\n解释：由于浮点运算和 `toFixed()` 处理舍入的方式，直接使用 `toFixed(2)`\
  \ `1.005` 可能不会按预期进行舍入。使用 `Math.round(1.005 + \"e+2\") + \"e-2\"` 方法可以准确地保留两位小数。\n\
  \n# Async JavaScript\n\n- **Async/Await 语法**：`async` 和 `await` 的介绍，用于简化异步编程，增强可读性。\n\
  - **Promise.all 方法**：利用 `Promise.all` 高效处理多个异步操作，适用于并行数据获取。\n- **异步函数中的错误处理**：异步代码的健壮错误管理策略，关注\
  \ `try-catch` 块。\n- **事件循环与异步操作**：理解 JavaScript 的事件循环，以掌握异步操作及其模型。\n- **确保异步函数抛出异常**：确保异步函数正确抛出异常的技术。\n\
  \n## 异步 JavaScript 简介\n\n在 Web 开发领域，异步 JavaScript 是一个基石，它允许创建动态、响应且高效的应用程序。本节深入探讨了异步编程的核心方面，这种范式允许\
  \ Web 应用执行耗时操作（例如从服务器获取数据），而不阻塞主线程。通过详细的解释和代码示例，我们旨在让你掌握如何有效地管理和利用异步操作。\n\n通过探索这些主题，你将对\
  \ JavaScript 的异步编程有全面的理解，从简化异步代码的语法到启用非阻塞操作的底层机制。无论你是从 API 获取数据、处理文件系统，还是仅仅想提高 Web\
  \ 应用的响应速度，掌握这些概念都将增强你编写高效 JavaScript 代码的能力。\n\n## 简化异步代码 async/await\n\n现代 JavaScript\
  \ 中 `async/await` 语引入改变了开发者编写异步代码的方式，使其更具可读性且更容易管理。async 函数允许你编写看起来像同步但实际上异步运行的代码。当你在函数前面加上\
  \ `async` 时，意味着该函数将返回一个 `Promise`。在 async 函数内部使用 `await` 会暂停执行，直到被等待的 Promise 解析，从而简化了异步操作的处理。\n\
  \n```javascript\nasync function fetchData() {\n  try {\n    const response = await\
  \ fetch('https://api.example.com/data');\n    const data = await response.json();\n\
  \    console.log(data);\n  } catch (error) {\n    console.error(\"获取数据失败:\", error);\n\
  \  }\n}\n\nfetchData();\n```\n\nJavaScript 中的 `async` 和 `await` 关键字用于简化 Promise，使异步代码更容易编写和阅读，几乎就像同步代码一样。这里有三个演示如何使用\
  \ async 和 await 简化异步代码的示例。\n\n示例 1：从 API 获取数据\n\n\n\n\n\n没有 `async/await`，你可能需要\
  \ `.then()` 和 `.catch()` 方法来处理 `fetch` API 返回的 promise。使用 `async/await` 后，这个过程变得更加简洁。\n\
  \n```javascript\n// Without async/await\nfunction fetchData(url) {\n  fetch(url)\n\
  \    .then(response => response.json())\n    .then(data => console.log(data))\n\
  \    .catch(error => console.error(\"Fetching error: \", error));\n}\n\n// With\
  \ async/await\nasync function fetchDataAsync(url) {\n  try {\n    const response\
  \ = await fetch(url);\n    const data = await response.json();\n    console.log(data);\n\
  \  } catch (error) {\n    console.error(\"Fetching error: \", error);\n  }\n}\n\
  ```\n\n## 示例 2：链式异步操作\n\n当你需要顺序执行多个异步操作时，与使用 `.then()` 链式 promise 相比，`async/await`\
  \ 让代码更具读性且嵌套更少。\n\n```javascript\n// Without async/await\nfunction getUserAndFriends(userId)\
  \ {\n  getUser(userId)\n    .then(user => {\n      console.log(user);\n      return\
  \ getFriends(user.id);\n    })\n    .then(friends => {\n      console.log(friends);\n\
  \    })\n    .catch(error => console.error(\"Error: \", error));\n}\n\n// With async/await\n\
  async function getUserAndFriendsAsync(userId) {\n  try {\n    const user = await\
  \ getUser(userId);\n    console.log(user);\n    const friends = await getFriends(user.id);\n\
  \    console.log(friends);\n  } catch (error) {\n    console.error(\"Error: \",\
  \ error);\n  }\n}\n```\n\n## 示例 3：处理并行异步调用\n\n当你有多个可以并行执行的异步操作，并且希望等待它们全部完成时，`Promise.all`\
  \ 结合 `async/await` 提供了一个强大的解决方案。\n\n```javascript\n// Without async/await\nfunction\
  \ fetchMultipleUrls(urls) {\n  Promise.all(urls.map(url => fetch(url).then(resp\
  \ => resp.json())))\n    .then(results => {\n      console.log(results);\n    })\n\
  \    .catch(error => console.error(\"Error fetching URLs: \", error));\n}\n\n//\
  \ With async/await\nasync function fetchMultipleUrlsAsync(urls) {\n  try {\n   \
  \ const results = await Promise.all(urls.map(url => fetch(url).then(resp => resp.json())));\n\
  \    console.log(results);\n  } catch (error) {\n    console.error(\"Error fetching\
  \ URLs: \", error);\n  }\n}\n```\n\n这些示例演示了 `async/await` 如何简化异步操作的处理，使代码更简洁、直观且易于调试。这些关键字提供的语法糖抽象了许多与\
  \ promise 相关的样板代码，导致更简洁、更直接的异步代码。\n\n## Promise.all 的作用\n\n`Promise.all` 是一个强大的方法，它接收一个\
  \ `Promise` 实例的可迭代对象作为输入，并返回单一的 `Promise`。当所有输入的 `Promises` 都解析时，该 promise 将解析；一旦其中一个输入的\
  \ `Promise` 被拒绝，它就会立即被拒绝。该方法对于处理互不依赖以完成的多个异步操作特别有用。\n\n```javascript\nPromise.all([fetch('url1'),\
  \ fetch('url2')])\n  .then(responses => Promise.all(responses.map(res => res.json())))\n\
  \  .then(data => console.log(data))\n  .catch(error => console.error(\"Failed to\
  \ fetch:\", error));\n```\n\n当你有多个异步操作并希望等待它们全部完成时，就会使用 `Promise.all`。它接收一个 promise\
  \ 数组并返回一个在所有 promise 都解析后解析的单一 `Promise`。\n\n```javascript\nconst promise1 = Promise.resolve(3);\n\
  const promise2 = 42;\nconst promise3 = new Promise((resolve, reject) => {\n  setTimeout(resolve,\
  \ 100, 'foo');\n});\n\nPromise.all([promise1, promise2, promise3]).then(values =>\
  \ {\n  console.log(values); // [3, 42, \"foo\"]\n});\n```\n\n## 多异步操作后的代码\n\n为了确保代码在多个异步操作完成后才运行，你可以使用\
  \ `Promise.all`。这种方法在继续执行之前等待所有操作完成，非常适合协调多个异步任务。\n\n```javascript\nasync function\
  \ loadMultipleResources() {\n  const urls = ['url1', 'url2', 'url3'];\n  try {\n\
  \    const results = await Promise.all(urls.map(url => fetch(url)));\n    // 在此处处理结果\n\
  \  } catch (error) {\n    // 处理错误\n  }\n}\n```\n\n要确保代码仅在多个异步操作完成后运行，请根据你是需要等待所有\
  \ promise 成功，还是无论结果如何等待全部结束来使用 `Promise.all` 或 `Promise.allSettled`。\n\n```javascript\n\
  async function fetchMultipleData() {\n  try {\n    const [result1, result2] = await\
  \ Promise.all([\n      fetch('https://api.example.com/data1').then(response => response.json()),\n\
  \      fetch('https://api.example.com/data2').then(response => response.json())\n\
  \    ]);\n    console.log(result1, result2);\n  } catch (error) {\n    console.error(\"\
  Failed to fetch data:\", error);\n  }\n}\n```\n\n## 启用异步特性的 async 关键字\n\n`async`\
  \ 关键字在 JavaScript 中用于指示函数是异步的，允许它隐式返回一个 promise。通过 `await` 增强了处理 promise 的可读性，允许你编写看起来和行为上更像同步代码的异步代码。`async`\
  \ 关键字使函数变为异步，允许它通过事件循环操作。\n\n```javascript\nasync function getAsyncData() {\n  return\
  \ \"Hello World!\";\n}\n\ngetAsyncData().then(value => console.log(value));\n```\n\
  \n以下是使用 `async` 关键字启用异步特性的三种用法示例：\n\n### 示例 1：基础 async 函数\n\n此示例演示了 `async` 函数的简单用法，它解析一个值。\n\
  \n```javascript\nasync function greet(name) {\n  return `Hello, ${name}!`;\n}\n\n\
  greet(\"Alice\").then(console.log); // 输出: \"Hello, Alice!\"\n```\n\n在这种情况下，`greet`\
  \ 是一个立即解析为字符串的异步函数。尽管函数内部没有创建 promise 或 `await`，它仍然返回一个 promise。\n\n### 示例 2：带有\
  \ await 的异步函数\n\n此示例展示了如何在 `async` 函数内部使用 `await` 关键字等待 promise 解析。这一特性通过允许你编写类似于同步代码的异步代码，简化了\
  \ promise 操作。\n\n```javascript\nasync function fetchUserData(userId) {\n  const\
  \ response = await fetch(`https://api.example.com/users/${userId}`);\n  const data\
  \ = await response.json();\n  return data;\n}\n\nfetchUserData(1)\n  .then(data\
  \ => console.log(data))\n  .catch(error => console.error(\"Error fetching user data:\"\
  , error));\n```\n\n### 示例 3：async 函数中的错误处理\n\nasync 函数中的错误处理可以通过 `try/catch` 来实现，允许在异步代码中使用同步式的错误处理逻辑。\n\
  \n```javascript\nasync function getPostDetails(postId) {\n  try {\n    const response\
  \ = await fetch(`https://api.example.com/posts/${postId}`);\n    if (!response.ok)\
  \ {\n      throw new Error(\"Post not found.\");\n    }\n    const post = await\
  \ response.json();\n    return post;\n  } catch (error) {\n    console.error(\"\
  Error fetching post:\", error.message);\n  }\n}\n\ngetPostDetails(1).then(console.log).catch(console.error);\n\
  ```\n\n在此函数中，如果 fetch 请求失败或响应状态不是 OK，它将抛出一个错误并被 `catch` 块捕获。这种模式与传统的 try/catch 错误处理相似，但在这里它被用于处理异步错误。\n\
  \n\n\n\n\n## 被拒绝的 Promise 会抛出错误\n\n为了确保异步函数在它等待的任何一个 `Promises` 被拒绝（rejected）时抛出错误，你可以在函数内部使用\
  \ `try-catch` 块。当 `await` 关键字与被拒绝的 `Promise` 一起使用时，会抛出一个可以被 `catch` 块捕获的异常，从而对被拒绝的\
  \ Promise 进行错误处理。\n\n为了确保异步函数对被拒绝的 Promise 抛出错误，你可以使用 `try...catch` 语法捕获被拒绝的 Promise，并在需要时显式抛出错误。\n\
  \n```javascript\nasync function mayFail() {\n  try {\n    const response = await\
  \ fetch('https://api.example.com/might-not-exist');\n    const data = await response.json();\n\
  \    return data;\n  } catch (error) {\n    throw new Error(\"Failed to fetch data\"\
  );\n  }\n}\n\nmayFail().catch(error => console.error(error));\n```\n\n## 内部处理异步函数\n\
  \nJavaScript 使用事件循环处理 `setTimeout`、`fetch` 以及其他基于 Promise 的异步操作。事件循环允许 JavaScript\
  \ 通过在循环中执行任务、处理事件和解析 Promise 来执行非阻塞的异步操作。这种机制确保了 JavaScript 运行时可以在等待异步操作完成的同时继续执行其他任务，从而对像浏览器或\
  \ Node.js 等单线程环境进行高效利用。\n\n例如，当你使用 `setTimeout` 延迟函数调用时，指定的回调函数会在计时器结束后进入队列等待执行，但你代码的其他部分将继续运行：\n\
  \n```javascript\nconsole.log('Start');\nsetTimeout(() => console.log('This runs\
  \ after 2 seconds'), 2000);\nconsole.log('End');\n// 输出: Start, End, This runs after\
  \ 2 seconds\n```\n\n在内部处理异步函数时，确保使用 `async/await` 和 `try...catch` 进行适当的错误处理和流程控制，这使异步逻辑更加直观且易于调试。\n\
  \n```javascript\nasync function processUserData(userId) {\n  try {\n    const user\
  \ = await fetch(`https://api.example.com/users/${userId}`).then(res => res.json());\n\
  \    const posts = await fetch(`https://api.example.com/users/${userId}/posts`).then(res\
  \ => res.json());\n    console.log(`User: ${user.name}, Posts: ${posts.length}`);\n\
  \  } catch (error) {\n    console.error(\"Error fetching user data:\", error);\n\
  \  }\n}\n\nprocessUserData(1);\n```\n\n通过这些示例和解释，你可以看到异步 JavaScript 如何为处理可能需要未知时间完成的操作（例如\
  \ API 调用、文件读取或任何依赖于外部数据或资源的任务）提供强大的模式。通过掌握 `async/await`、`Promise.all` 并理解事件循环，你可以编写出更高效、可读且更易于维护的异步\
  \ JavaScript 代码。\n\n## 练习答案\n\n- `async/await` 语法如何帮助 JavaScript 中的异步代码？\n- `Promise.all`\
  \ 方法的作用是什么？\n- 在 JavaScript 中，如何确保某段代码在多个异步操作完成后运行？\n- `async` 关键字在 JavaScript 函数中启用了什么功能？\n\
  - 如何确保异步函数在它所等待的任何一个 `Promises` 被拒绝时抛出错误？\n- JavaScript 内部是如何处理 `setTimeout`、`fetch`\
  \ 以及其他基于 Promise 的异步函数的？\n\n## 异步 JavaScript 测验\n\n**当 `async` 关键字放在函数定义之前时，它的作用是什么？**\n\
  A) 让函数同步执行。\nB) 允许函数返回一个 promise。\nC) 防止函数返回任何内容。\nD) 自动捕获函数内的任何错误。\n**答案：B**\n\
  **解释：** `async` 关键字允许函数返回一个 promise，简化了异步操作的处理方式。\n\n**如何在异步函数内部等待 promise 的解析（resolve）？**\n\
  A) 使用 `pause` 关键字。\nB) 使用 `await` 关键字。\nC) 使用 `wait` 关键字。\nD) 使用 `yield` 关键字。\n\
  **答案：B**\n**解释：** `await` 关键字用于 `async` 函数内部，暂停执行，直到 promise 解析完成。\n\n**使用哪种方法并行执行多个\
  \ promise 并等待它们全部就绪（settle）？**\nA) `Promise.race()`\nB) `Promise.all()`\nC) `Promise.each()`\n\
  D) `Promise.resolve()`\n**答案：B**\n**解释：** `Promise.all()` 接收一个 promise 迭代器并返回一个单一\
  \ Promise，当所有 promise 都就绪时（每个可能解析或拒绝），该 Promise 就会解析。\n\n**如果异步函数内部发生错误且未被捕获会发生什么？**\n\
  A) 函数将返回 null。\nB) 函数将返回 undefined。\nC) 返回的 promise 将被拒绝。\nD) 错误将被忽略。\n**答案：C**\n\
  **解释：** 如果 `async` 函数中发生错误且未被捕获，函数返回的 promise 将带有该错误被拒绝。\n\n**以下哪种是处理 async/await\
  \ 语法中错误的正确方法？**\nA) `async` 函数内部的 `try-catch` 块。\nB) `await` 语句后的 `onError` 方法。\n\
  C) 仅使用 `finally` 块，不使用 try-catch。\nD) 在函数调用之前使用 `error` 关键字。\n**答案：A**\n**解释：**\
  \ `async` 函数中的错误可以使用 `try-catch` 块捕获，允许进行类似于同步代码的优雅错误处理。\n\n**JavaScript 事件循环的作用是什么？**\n\
  A) 暂停异步代码的执行。\nB) 直接执行间隔。\nC) 以非阻塞的方式处理异步回调。\nD) 防止任何异步操作。\n**答案：C**\n**解释：** 事件循环以非阻塞的方式处理异步回调。\n\
  \n**在什么场景下 `Promise.all()` 特别有用？**\nA) 当你需要顺序执行 promise 时。\nB) 当并行执行多个异步操作时。\nC)\
  \ 当你只需要最快解析的结果时。\nD) 当你需要处理单个异步操作时。\n**答案：B**\n**解释：** `Promise.all()` 适用于执行多个异步操作，因为它会等待全部就绪。\n\
  \n**如何强制异步函数抛出错误？**\nA) 返回 `Error`。\nB) 使用 `throw` 语句。\nC) 调用 `Promise.reject()`。\n\
  D) 在没有返回语句的情况下退出函数。\n**答案：B**\n**解释：** 在 `async` 函数中，使用 `throw` 语句会强制函数拒绝提供的错误。\n\
  \n**事件循环在 JavaScript 并发模型中的意义是什么？**\nA) 它允许 JavaScript 执行多线程。\nB) 它启用阻塞操作以阻止代码执行。\n\
  C) 它在不阻塞主线程的情况下促进异步执行。\nD) 它优先考虑同步任务而非异步回调。\n**答案：C**\n**解释：** 事件循环对于 JavaScript\
  \ 的并发模型至关重要，它在不阻塞主线程的情况下促进异步任务。\n\n**如果传递给 Promise.all() 的 promise 中有一个被拒绝了？**\n\
  A) `Promise.all()` 将等待其他 promise 就绪后拒绝。\nB) `Promise.all()` 将立即以第一个被拒绝 promise 的原因拒绝。\n\
  C) `Promise.all()` 将忽略拒绝并返回解析 promise 的值。\nD) `Promise.all()` 将重试被拒绝的 promise 直到解析。\n\
  **答案：B**\n**解释：** 如果传递给 Promise.all() 的任何 promise 被拒绝，Promise.all() 将立即以第一个被拒绝 promise\
  \ 的原因拒绝，忽略任何其他 promise 的结果。\n\n**关于 await 关键字的哪种说法是正确的？**\nA) 它只能在声明为 `async` 的函数内部使用。\n\
  B) 它会导致浏览器冻结直到 promise 就绪。\nC) 它可以与任何函数一起使用，无论其是否为异步。\nD) 如果 promise 解析为 null 值，它将抛出错误。\n\
  **答案：A**\n\n\n\n\n\n解析：`await` 关键字用于暂停 `async` 函数的执行，直到 promise 处于稳定状态（解析或拒绝），并且它只能在声明为\
  \ `async` 的函数内部使用。\n\n在使用 `Promise.all()` 时，处理错误的最佳实践是什么？\n\nA) 在将 promise 传递给 `Promise.all()`\
  \ 之前，将每个 promise 封装在 `try-catch` 块中。\nB) 在 `Promise.all()` 调用周围使用单个的 `try-catch`\
  \ 块。\nC) 在 `Promise.all()` 解析后检查每个 promise 的状态。\nD) `Promise.all()` 中的错误无法被捕获。\n\
  \n答案：B\n\n解析：将 `Promise.all()` 调用封装在 `try-catch` 块中是处理从传递给它的 promise 可能产生的任何错误的最佳实践。\n\
  \nJavaScript 在底层是如何处理异步操作的？\n\nA) 使用多线程执行并发操作。\nB) 通过在调用栈中对异步操作排序。\nC) 通过事件循环（event\
  \ loop），它与调用栈和回调队列协同工作。\nD) 通过阻塞主线程执行直到所有异步操作完成。\n\n答案：C\n\n解析：JavaScript 使用事件循环结合调用栈和回调队列来处理异步操作，使其能够高效地执行非阻塞操作。\n\
  \n在 `async` 函数中，表达式 `await Promise.resolve(5)` 返回什么？\n\nA) 5\nB) `Promise<5>`\n\
  C) `undefined`\nD) 它会导致运行时错误。\n\n答案：A\n\n解析：`await` 关键字会暂停 `async` 函数的执行，直到 promise\
  \ 解析，然后它返回解析后的值，在这种情况下该值为 5。\n\n`async/await` 在 Web 开发中的常见用例是什么？\n\nA) 同步操作 DOM。\n\
  B) 执行同步计算。\nC) 让异步 API 调用更具可读性。\nD) 不需要异步操作的 for 循环迭代。\n\n答案：C\n\n解析：`async/await`\
  \ 语法对于让异步 API 调用更具可读性和易于管理特别有用，其风格上非常类似于同步代码。\n\n在 `async` 函数中不当处理错误的潜在缺点是什么？\n\n\
  A) 浏览器可能会崩溃。\nB) 它可能导致未捕获的 promise 拒绝（uncaught promise rejections）。\nC) JavaScript\
  \ 引擎切换到同步模式。\nD) 所有随后的 JavaScript 代码被忽略。\n\n答案：B\n\n解析：`async` 函数中不当错误处理可能导致未捕获的\
  \ promise 拒绝，这可能导致应用程序在没有适当问题指示的情况下出现异常行为。\n\n关于使用 `async/await` 配合 `try-catch`\
  \ 进行错误处理，哪是正确的？\n\nA) 它显著降低了代码的可读性。\nB) 它仅适用于捕获语法错误。\nC) 它为异步代码中的错误处理提供了类似于同步的结构。\n\
  D) 捕获的错误总是 `SyntaxError` 类型。\n\n答案：C\n\n解析：使用 `async/await` 配合 `try-catch` 块进行错误处理允许异步代码以类似于同步代码的方式进行结构和处理，提高了可读性和可维护性。\n\
  \n在使用 `Promise.all()` 时，如何确保即使一个失败，也会尝试所有 promise？\n\nA) 在将它们传递给 `Promise.all()`\
  \ 之前，通过将每个 promise 封装在 `Promise.catch()` 方法中。\nB) 使用 `Promise.allSettled()` 代替 `Promise.all()`。\n\
  C) 使用 for 循环顺序执行每个 promise。\nD) 将 `Promise.all()` 封装在另一个 `Promise.all()` 内部。\n\n\
  答案：B\n\n解析：`Promise.allSettled()` 允许所有给定的 promise 执行完成（解析或拒绝），并在所有给定的 promise 都稳定后返回一个\
  \ promise，提供每个 promise 的结果。\n\n以下代码片段中 `console.log` 的输出是什么？\n\n```javascript\n\
  async function check() {\n  return await Promise.resolve(\"Hello, world!\");\n}\n\
  \nconsole.log(check());\n```\n\nA) \"Hello, world!\"\nB) `Promise {<resolved>: \"\
  Hello, world!\"}`\nC) `undefined`\nD) `Promise {<pending>}`\n\n答案：D\n\n解析：函数 `check`\
  \ 是 `async` 函数，返回一个 promise。当用 `console.log` 调用 `check()` 时，它记录的是 promise 对象，而不是\
  \ promise 的解析值。\n\nJavaScript 使用什么机制来处理异步操作的回调？\n\nA) 仅用调用栈。\nB) 回调队列和事件循环。\nC)\
  \ 为每个回调提供单独的线程。\nD) 堆内存。\n\n答案：B\n\n解析：JavaScript 使用回调队列和事件循环以非阻塞的方式管理和执行异步操作的回调。\n\
  \n如何让异步函数默认返回一个被拒绝的 promise？\n\nA) 省略 `return` 语句。\nB) 返回 `Promise.reject()`。\n\
  C) 在函数内部抛出错误。\nD) 显式返回 false。\n\n答案：C\n\n解析：在 `async` 函数内部抛出错误会导致函数返回一个被拒绝的 promise，并将抛出的错误作为原因。\n\
  \n在 `async` 函数内部 `await` 一个非 promise 值会发生什么？\n\nA) 函数立即抛出 `TypeError`。\nB) 非 promise\
  \ 值被封装在一个已解析的 promise 中。\nC) `async` 函数返回 `undefined`。\nD) 函数的执行被无限暂停。\n\n答案：B\n\
  \n解析：如果你 `await` 一个非 promise 值，它会自动封装在一个以该值解析的 promise 中，允许 `async` 函数将其视为 promise。\n\
  \nJavaScript 中事件循环的主要目的是什么？\n\nA) 执行所有 JavaScript 代码。\nB) 允许 JavaScript 代码在多线程上运行。\n\
  C) 在单线程环境中管理异步任务的执行。\nD) 将 JavaScript 编译为机器码。\n\n答案：C\n\n解析：事件循环的主要目的是在单线程环境中管理异步任务（如回调和\
  \ promise）的执行，确保顺畅运行。\n\n如何处理 promise 链中抛出的异常？\n\nA) 在链的末尾添加 `.catch()`。\nB) 在 `.then()`\
  \ 方法内部使用 `throw` 语句。\nC) 忽略它们，因为它们会自动处理。\nD) 在不加 catch 的情况下将 promise 链封装在 `try`\
  \ 块中。\n\n答案：A\n\n解析：在 promise 链末尾添加 `.catch()` 方法是捕获和处理链中发生的任何异常或拒绝 promise 的方法。\n\
  \n哪项准确描述了 async 函数的行为？\n\nA) 它总是暂停整个程序的执行直到完成。\nB) 它在单独线程中与其他 async 函数并行运行。\nC)\
  \ 它返回一个 promise，其执行可以通过 `await` 暂停。\nD) 它阻塞主线程直到所有 await 语句解析。\n\n答案：C\n\n解析：`async`\
  \ 函数返回一个 promise，函数内部的执行可以在 `await` 表达式处暂停以等待 promise 解析，而不会阻塞主线程。\n\n\n\n\n\n在\
  \ JavaScript 中，错误处理是编写健壮代码的关键方面，特别是在处理可能失败的操作时，例如从服务器获取数据或读取文件。`try-catch-finally`\
  \ 语句是错误处理的基石，它允许开发者以优雅的方式响应错误，同时确保无论是否发生错误，始终会执行某些清理操作。\n\n`finally` 块是 `try-catch-finally`\
  \ 语句的一部分，它在 `try` 和 `catch` 块完成执行后执行，无论结果如何。不无论 `try` 块是成功完成的，还是在 `catch` 块中捕获了错误，`finally`\
  \ 块都会运行。它的主要用途是执行 `try-catch` 序列之后所需的清理工作，例如关闭文件流或释放资源，确保关键的最后步骤不会遗漏。\n\n```javascript\n\
  try {\n  // 尝试执行可能会抛错误的代码\n  console.log('Trying...');\n  throw new Error('Something\
  \ went wrong');\n} catch (error) {\n  // 处理 try 块中抛出的任何错误\n  console.error('Caught\
  \ an error:', error);\n} finally {\n  // 这段代码无论 try/catch 结果如何执行\n  console.log('Cleaning\
  \ up...');\n}\n```\n\n![](img/image_rsrc61F.jpg)\n\n图片：上述代码的结果，显示了控制台中抛出的错误。\n\n\
  在 JavaScript 中，`finally` 块是 `try-catch` 错误处理的一部分。它在 `try` 和 `catch` 块执行之后、但在 `try...catch...finally`\
  \ 块之后的语句之前执行。无论是否抛出或捕获了异常，它总是执行的。\n\n```javascript\nfunction testFinally() {\n \
  \ try {\n    console.log(\"Inside try block\");\n    // throw new Error(\"An error\
  \ occurred\");\n  } catch (error) {\n    console.error(\"Caught an error:\", error.message);\n\
  \  } finally {\n    console.log(\"Finally block executed\");\n  }\n  console.log(\"\
  Code execution continues after finally block\");\n}\n\ntestFinally();\n```\n\n##\
  \ Promise 链中的 finally 子句\n\n`finally` 子句也用于 `Promises` 上文中，提供了一种在 `Promise` 被解析（resolved）或拒绝（rejected）后执行代码的方法。这对于在异步操作后执行清理或最终化操作特别有用，类似于它在\
  \ `try-catch` 块中的用法，但针对 `Promises` 的异步特性进行了定制。\n\n![](img/image_rsrc61G.jpg)\n\n\
  图片：接收数据后 `finally()` 的结果。\n\n```javascript\nfetch('https://api.example.com/data')\n\
  \  .then(response => response.json())\n  .catch(error => console.error('Error fetching\
  \ data:', error))\n  .finally(() => console.log('Fetch attempt finished.'));\n```\n\
  \n`finally` 子句也可以用于 promise 链，确保在 promise 被解析或拒绝后运行某些特定代码。这对于清理活动非常有用，例如无论 promise\
  \ 的结果如何都隐藏加载指示。\n\n```javascript\nfetch('https://api.example.com/data')\n  .then(response\
  \ => response.json())\n  .then(data => console.log(data))\n  .catch(error => console.error(\"\
  An error occurred:\", error))\n  .finally(() => console.log(\"Promise chain completed\"\
  ));\n```\n\n## Object.seal 对对象的影响\n\n JavaScript 对象本质上是动态的，允许在对象创建后添加、修改或删除属性。\n\
  \n然而，在某些情况下，锁定对象以防止进一步修改，同时允许更改现有属性是有益的。`Object.seal()` 是一个密封对象的方法，它会防止向对象中添加新属性，并将所有现有属性标记为不可配置的（non-configurable）。只要属性是可写的（writable），密封对象的属性仍然可以被修改。\n\
  \n```javascript\nconst sealedObject = { property: 'value' };\nObject.seal(sealedObject);\n\
  sealedObject.property = 'new value'; // 这是允许的\nsealedObject.newProperty = 'value';\
  \ // 这会被忽略，newProperty 不会被添加\ndelete sealedObject.property; // 这会被忽略，property 不会被删除\n\
  console.log(sealedObject); // 输出: { property: 'new value' }\n```\n\n`Object.seal()`\
  \ 方法在您想要在整个程序运行期间锁定对象结构时特别有用，确保确保在允许修改现有属性的同时，不会添加新属性。\n\nJavaScript 中的 `Object.seal`\
  \ 方法会密封对象，防止向其添加新属性，并将所有现有属性标记为不可配置。只要属性是可写的，密封对象的属性仍然可以更改。但是，你不能删除或向对象添加新属性。\n\n\
  ```javascript\nconst obj = {\n  property1: \"value1\",\n  property2: \"value2\"\n\
  };\nObject.seal(obj);\nobj.property1 = \"new value\"; // 这是允许的\nconsole.log(obj.property1);\
  \ // \"new value\"\nobj.newProperty = \"value3\"; // 这是不允许的\nconsole.log(obj.newProperty);\
  \ // undefined\n// 在密封对象中尝试删除属性是不允许的\ndelete obj.property2; // 这将不起\nconsole.log(obj.property2);\
  \ // \"value2\"\nconsole.log(Object.isSealed(obj)); // true\n```\n\n在 `Object.seal`\
  \ 的示例中，我们演示了对象密封后，其属性仍然可以修改，但不能添加新属性，且现有属性无法移除。这展示了 `Object.seal` 如何为对象提供某种不可变性，在需要在保持对象形状不变但允许修改现有属性值的情况下，它是一个非常有用的工具。\n\
  \n\n\n\n解析：`Object.seal()` 密封一个对象，防止向其添加新属性并防止删除现有属性，但它仍然允许修改现有属性的值。\n\n如何有效地使用错误处理中的\
  \ `finally` 块？\n\nA) 将错误日志记录到外部系统。\nB) 执行清理操作，例如关闭文件或释放资源。\nC) 根据捕获的异常抛出新错误。\nD)\
  \ 在捕获错误之前执行高优先级代码。\n\n正确答案：B) 执行清理操作，例如关闭文件或释放资源。\n\n解析：`finally` 块非常适合用于无论是否发生错误都需要执行的清理操作，以确保资源得到妥当管理。\n\
  \n如果 promise 后面跟一个 `finally` 子句并且它状态确定（settled），会发生什么？\n\nA) `finally` 子句被跳过。\n\
  B) `finally` 子句在 promise 状态确定之前执行。\nC) `finally` 子句执行，其返回值会影响 promise 的结果。\nD) 无论\
  \ promise 的结果如何，`finally` 子句都会执行。\n\n正确答案：D) 无论 promise 的结果如何，`finally` 子句都会执行。\n\
  \n解析：在 promise 链中，`finally` 子句在 promise 状态确定后运行，无论它是被完成（fulfilled）还是拒绝（rejected），都不会影响\
  \ promise 的结果。\n\n以下哪项是对对象使用 `Object.seal()` 的真实影响？\n\nA) 对象的原型可以被更改。\nB) 可以向对象中添加属性。\n\
  C) 如果属性是可写的（writable），仍然仍然更改属性值。\nD) 可以从对象中删除属性。\n\n正确答案：C) 如果属性是可写的（writable），仍然仍然更改属性值。\n\
  \n解析：`Object.seal()` 防止向对象添加或删除属性，但如果属性是可写的，则允许修改现有属性的值。\n\n在什么情况下，`try-catch-finally`\
  \ 语句中的 `finally` 块不会执行？\n\nA) 当 `try` 块中抛出错误时。\nB) 当 `catch` 块中捕获到错误时。\nC) 当 `try`\
  \ 或 `catch` 块中存在 `return` 语句时。\nD) 无论什么种情况，`finally` 块都会执行。\n\n正确答案：D) 无论什么种情况，`finally`\
  \ 块都会执行。\n\n解析：`finally` 块在 `try` 和 `catch` 块之后执行，无论这些块内部是否发生了 `return` 语句或错误。\n\
  \n在 promise 状态确定并使用 `finally` 子句后，我们可以对执行流说明什么？\n\nA) `finally` 子句中断了 promise 链并返回一个新的\
  \ promise。\nB) `finally` 子句确保不再执行后续的 `.then` 或 `.catch` 处理程序。\nC) `finally` 之后的\
  \ `.then` 或 `.catch` 处理器的执行依赖于 promise 的结果。\nD) `finally` 子句标记了 promise 执行的结束，防止后续的\
  \ `then` 或 `catch` 子句运行。\n\n正确答案：C) `finally` 之后的 `.then` 或 `.catch` 处理器的执行取决于 promise\
  \ 的结果。\n\n解析：`finally` 子句不影响 promise 的结果。根据 promise 是被完成还是拒绝，后续的 `.then` 或 `.catch`\
  \ 处理程序仍然可以运行。\n\n`Object.seal()` 不对对象做了什么？\n\nA) 防止添加新属性。\nB) 使所有属性变为不可配置的（non-configurable）。\n\
  C) 使所有属性变为不可可写的（non-writable）。\nD) 防止现有属性被删除。\n\n正确答案：C) 使所有属性变为不可可写的（non-writable）。\n\
  \n解析：`Object.seal()` 防止添加新属性和删除现有属性，但它不会使所有属性变为不可可写。可写属性仍然是可写的。\n\n哪种陈准确反映了 `finally`\
  \ 块的局限性？\n\nA) 它可以执行 `return` 语句来改变函数的结果。\nB) 它无法访问在 `try` 和 `catch` 块中定义的变量。\n\
  C) 它没有阻止错误传播的能力。\nD) 它仅限于同步操作，不能处理异步代码。\n\n正确答案：C) 它没有阻止错误传播的能力。\n\n解析：`finally`\
  \ 块用于清理，无论是否发生错误都会执行，但除非显式处理，否则它无法阻止错误的传播。\n\npromise 链中的 `finally` 子句与同步错误处理中的\
  \ `finally` 块有何不同？\n\nA) 它只在 promise 被拒绝（rejected）时执行。\nB) 它在 promise 状态确定后执行清理代码，无论结果如何。\n\
  C) 它可以改变 promise 链的结果。\nD) 它阻止了后续 `then` 或 `catch` 子句的执行。\n\n正确答案：B) 它在 promise\
  \ 状态确定后执行清理代码，无论结果如何。\n\n解析：与其同步对应的类似，promise 中的 `finally` 子句在 promise 状态确定后执行，无论它是被完成还是拒绝，且不会改变\
  \ promise 的结果。\n\n以下哪项最好描述了 `Object.seal()` 对对象配置性（configurability）的影响？\n\nA) 它使对象的所有属性变为可配置的。\n\
  B) 它防止现有属性的配置性被更改。\nC) 它允许添加新属性但不允许配置。\nD) 它自动使所有属性变为不可配置且可写。\n\n正确答案：B) 它防止现有属性的配置性被更改。\n\
  \n解析解析：`Object.seal()` 密封一个对象，使其现有属性变为不可配置，这意味着它们的配置性不能被更改。此操作防止了属性的添加或删除，但不会影响现有属性的可写性。\n\
  \n\n\n\n# 理解 JavaScript 闭包\n\n闭包允许函数在外部函数执行完毕后，仍然能够访问外部函数作用域中的变量，从而有效地“记住”创建它时的环境。\n\
  \n```javascript\nfunction createGreeting(greeting) {\n  return function(name) {\n\
  \    console.log(greeting + ', ' + name);\n  };\n}\n\nconst greetHello = createGreeting('Hello');\n\
  greetHello('Alice'); // 输出: Hello, Alice\n```\n\n这个示例演示了内部函数 `greetHello` 如何记住来自外部作用域的变量\
  \ `greeting`。\n\n在 JavaScript 中，当一个函数即使在词法作用域之外执行，能够记住并访问其词法作用域时，就发生了闭包。闭包是 JavaScript\
  \ 基础且强大的特性，能够实现数据私有和函数工厂等功能。它们在每次创建函数时（在函数创建时）被创建。\n\n```javascript\nfunction outer()\
  \ {\n  let counter = 0; // 变量是由 outer 创建的局部变量。\n  function inner() {\n    counter++;\n\
  \    console.log(counter);\n  }\n  return inner;\n}\n\nconst myFunction = outer();\n\
  myFunction(); // 1\nmyFunction(); // 2\n```\n\n在这个示例中，`inner` 是一个闭包，即使在 `outer`\
  \ 执行完成后，它仍然可以访问外部函数作用域中的变量 `counter`。\n\n闭包是 JavaScript 中的一个特性，内部函数可以访问外部（外层）函数的变量——即作用域链。\n\
  \n```javascript\nfunction outerFunction() {\n  let outerVariable = 100;\n  function\
  \ innerFunction() {\n    console.log(outerVariable);\n  }\n  return innerFunction;\n\
  }\n\nconst myInnerFunction = outerFunction(); // 即使 outerFunction 返回，其执行上下文也会被保留\n\
  myInnerFunction(); // 输出: 100\n```\n\n### 示例 1：基础闭包\n\n此示例演示了闭包如何允许函数访问其外部作用域的变量。\n\
  \n```javascript\nfunction outerFunction() {\n  let outerVariable = 'I am outside!';\n\
  \  function innerFunction() {\n    console.log(outerVariable);\n  }\n  return innerFunction;\n\
  }\n\nconst myInnerFunction = outerFunction();\nmyInnerFunction(); // 输出: I am outside!\n\
  ```\n\n解释：`innerFunction` 访问了 `outerVariable`，它是 `outerFunction` 词法作用域中的变量，即使在 `outerFunction`\
  \ 执行并返回 `innerFunction` 之后也是如此。这种访问之所以是因为闭包。\n\n### 示例 2：封装私有数据\n\n闭包可以创建只能通过返回的函数访问的私有变量，提供封装。\n\
  \n```javascript\nfunction createCounter() {\n  let count = 0;\n  return {\n    increment()\
  \ {\n      count++;\n      console.log(count);\n    },\n    decrement() {\n    \
  \  count--;\n      console.log(count);\n    }\n  };\n}\n\nconst counter = createCounter();\n\
  counter.increment(); // 输出: 1\ncounter.increment(); // 输出: 2\ncounter.decrement();\
  \ // 输出: 1\n```\n\n解释：从 `createCounter` 函数外部无法访问 `count` 变量。然而，`increment` 和 `decrement`\
  \ 方法对 `count` 形成了闭包，允许对其进行修改和访问。这使得 `count` 实际上变成了一个私有变量。\n\n### 示例 3：工厂函数\n\n闭包允许创建工厂函数，这些函数可以生成多个私有状态的实例。\n\
  \n```javascript\nfunction makeGreeting(greeting) {\n  return function(name) {\n\
  \    console.log(greeting + ', ' + name + '!');\n  };\n}\n\nconst sayHello = makeGreeting('Hello');\n\
  const sayGoodbye = makeGreeting('Goodbye');\nsayHello('Alice'); // 输出: Hello, Alice!\n\
  sayGoodbye('Bob'); // 输出: Goodbye, Bob!\n```\n\n解释：每次调用 `makeGreeting` 都会为参数 `greeting`\
  \ 创建一个新的闭包。返回的函数——`sayHello` 和 `sayGoodbye`——各自通过闭包访问它们自己的 `greeting` 变量，允许它们使用并记住创建时传递的问候值。\n\
  \n# 函数调防抖（Debouncing）\n\n防抖（Debouncing）是一种限制函数调用频率的技术。这对于处理窗口大小调整、滚动或按键等快速事件特别有用。\n\
  \n这是一个简单的防抖实现：\n\n```javascript\nfunction debounce(func, delay) {\n  let debounceTimer;\n\
  \  return function() {\n    const context = this;\n    const args = arguments;\n\
  \    clearTimeout(debounceTimer);\n    debounceTimer = setTimeout(() => func.apply(context,\
  \ args), delay);\n  };\n}\n\nwindow.addEventListener('resize', debounce(() => {\n\
  \  console.log('Resize event handler called after 300ms');\n}, 300));\n```\n\n防抖是一种限制函数执行频率的技术。这对于处理窗口大小调整、滚动或键盘输入等连续事件特别有用。\n\
  \n提供的示例展示了如何使用 `debounce` 函数来优化可能触发过于频繁的事件处理程序的性能。在在这种情况下，它被应用于窗口大小调整，这是一个每秒可能触发多次常见事件。通过使用\
  \ `debounce`，我们确保事件处理代码只在指定的空闲延迟后运行，从而减少了对浏览器的负载。\n\n以下是该示例工作原理的详细分解：\n\n```javascript\n\
  function debounce(func, delay) {\n  let debounceTimer;\n  return function() {\n\
  \    const context = this; // 捕获应用 debounce 的函数上下文\n    const args = arguments;\
  \ // 传递给防抖函数的参数\n    clearTimeout(debounceTimer); // 每次调用清除之前的定时器\n    debounceTimer\
  \ = setTimeout(() => func.apply(context, args), delay); // 设置新的延迟执行定时器\n  };\n}\n\
  \n// 在窗口调整大小时应用防抖\nwindow.addEventListener('resize', debounce(() => {\n  console.log('Resize\
  \ event handler called after 300ms');\n}, 300));\n```\n\n#### 工作原理：\n\n- **debounce\
  \ 函数**：它接收两个参数，`func`（要防抖的函数）和 `delay`（等待毫秒）。它返回一个新函数，该函数每次执行都会重置定时器。如果在 `delay`\
  \ 期间没有再次调用，则原始函数 `func` 将以正确的上下文（this）和参数（args）执行。\n- **在 `window.addEventListener`\
  \ 中使用**：此处对窗口调整事件使用了 debounce。防抖函数只有在事件发生空闲 300 毫秒后才会触发，显著减少了处理程序的调用次数。\n\n### 示例\
  \ 2 防抖\n\n防抖适用于需要限制函数执行频率的场景，特别是在响应频繁触发的事件时。\n\n```javascript\nfunction debounce(func,\
  \ wait) {\n  let timeout;\n  return function(...args) {\n    clearTimeout(timeout);\n\
  \    timeout = setTimeout(() => func.apply(this, args), wait);\n  }\n}\n\n// 滚动事件处理程序的示例用法\n\
  window.addEventListener('scroll', debounce(() => {\n  console.log('Scroll event\
  \ fired!');\n}, 250));\n```\n\n# 不同语境下的 `this` 关键字\n\n函数内部 `this` 的值取决于调用该函数的上下文。在全局上下文中或函数内部，`this`\
  \ 指向全局对象（浏览器中的 window，Node.js 中的 global）。\n\n在对象的方法中，`this` 指向该对象。\n\n```javascript\n\
  const person = {\n  name: 'John',\n  greet: function() { console.log('Hi, ' + this.name);\
  \ }\n};\n\nperson.greet(); // Hi, John\n```\n\n如果 `greet` 在一个未定义 `this.name` 的不同上下文调用，它将无法按预期工作。\n\
  \n**全局上下文**：在全局执行上下文中（任何函数之外），无论是否处于严格模式，`this` 均指向全局对象。\n\n\n\n\n\n```javascript\n\
  console.log(this === window); // 在浏览器环境中为 true\n```\n\n函数语境：在简单函数调用中，非严格模式下 `this`\
  \ 指向全局对象，在严格模式下为 `undefined`。\n\n```javascript\nfunction show() {\n  console.log(this\
  \ === window); // 非严格模式下为 true，严格模式下为 false\n}\nshow();\n```\n\n方法语境：当函数作为对象的方法被调用时，`this`\
  \ 指向调用该方法的对象。\n\n```javascript\nconst obj = {\n  method: function() {\n    console.log(this\
  \ === obj); // true\n  }\n};\nobj.method();\n```\n\n## 使用 bind 方法\n\n`bind` 方法创建一个新函数，该函数在被调用时，其\
  \ `this` 关键字将被设置为提供的值，并且在调用新函数时，会在任何提供的参数之前传入给定的参数序列。它主要用于确保函数具有正确的 `this` 值。\n\n\
  ```javascript\nconst person = {\n  name: 'John',\n  greet: function() { console.log('Hi,\
  \ ' + this.name); }\n};\nconst greet = person.greet.bind(person);\ngreet(); // Hi,\
  \ John\n```\n\n这确保了 `greet` 始终使用 `person` 作为其 `this` 语境。`bind` 方法允许你将一个 `this` 语境与函数永久关联。\n\
  \n```javascript\nconst person = {\n  name: 'John',\n  greet() {\n    console.log(`Hello,\
  \ ${this.name}`);\n  }\n};\nsetTimeout(person.greet.bind(person), 1000);\n```\n\n\
  `bind` 方法创建一个新函数，该函数在被调用时，其 `this` 关键字将被设置为提供的值。\n\n```javascript\nconst person\
  \ = {\n  firstName: \"John\",\n  lastName: \"Doe\",\n  fullName: function() {\n\
  \    return `${this.firstName} ${this.lastName}`;\n  }\n};\nconst unboundFullName\
  \ = person.fullName;\nconsole.log(unboundFullName()); // 在浏览器中返回 undefined undefined\n\
  const boundFullName = unboundFullName.bind(person);\nconsole.log(boundFullName());\
  \ // 返回 John Doe\n```\n\n### 示例 1：将语境绑定到函数\n\n此示例展示了如何使用 `bind` 来确保函数在从不同语境调用时，仍保留对象的语境。\n\
  \n```javascript\nconst person = {\n  name: 'John',\n  greet: function() {\n    console.log('Hello,\
  \ ' + this.name);\n  }\n};\nsetTimeout(person.greet, 1000); // 如果不使用 bind，这将记录 \"\
  Hello, \"，因为 'this' 将指向全局对象或在严格模式下的 undefined\nsetTimeout(person.greet.bind(person),\
  \ 1000); // 使用 bind 后，将正确记录 \"Hello, John\"\n```\n\n解释：使用 `bind` 方法是为了确保 `person.greet`\
  \ 在作为回调函数传递给 `setTimeout` 时，保留 `person` 作为其语境（`this` 值）。如果没有 `bind`，`this.name`\
  \ 将无法指向 `person` 对象的 name 属性。\n\n### 示例 2：部分函数应用\n\n`bind` 也可以用于部分函数应用，即一个函数接收多个参数，而你预填充其中的一些参数。\n\
  \n```javascript\nfunction multiply(a, b) {\n  return a * b;\n}\nconst double = multiply.bind(null,\
  \ 2); // 绑定 'null' 是因为在这种情况下我们不在乎 'this'，并将 '2' 作为 multiply 的第一个参数\nconsole.log(double(5));\
  \ // 输出: 10\n```\n\n解释：在这里，`multiply` 是一个接收两个参数的简单函数。`double`通过将 `multiply` 的第一个参数绑定到\
  \ `2` 创建的。当用单个参数调用 `double` 时，它会自动将第二个参数应用于 `multiply`。\n\n### 示例 3：将方法绑定到其对象\n\n\
  在将对象方法作为回调函数时（特别是传递给事件监听器或 `setTimeout`），通常会丢失原始对象的语境。`bind` 可以防止这种情况。\n\n```javascript\n\
  const dog = {\n  sound: 'woof',\n  speak: function() {\n    console.log(this.sound);\n\
  \  }\n};\ndocument.getElementById(\"myButton\").addEventListener('click', dog.speak.bind(dog));\
  \ // 确保 'speak' 内部的 this 指向 'dog'\n```\n\n解释：如果没有 `bind(dog)`，`speak` 方法在作为事件处理器被调用时将丢失其语境（这不会指向\
  \ `dog`，而是指向触发事件元素或全局对象）。将 `dog` 绑定到 `speak` 确保了 `this.sound` 正确指向 `dog` 的 sound\
  \ 属性。\n\n## 跨文档捕获点击事件\n\n在文档级别监听点击事件允许你处理全局交互。\n\n```javascript\ndocument.addEventListener('click',\
  \ function(e) {\n  console.log(`检测到点击坐标: (${e.clientX}, ${e.clientY})`);\n});\n\
  ```\n\n要捕获跨文档所有的点击事件（包括 `iframe` 内部的点击），你需要为文档和每个 `iframe` 添加事件监听器：\n\n```javascript\n\
  document.addEventListener('click', function(event) {\n  console.log('文档被点击');\n\
  });\nArray.from(document.getElementsByTagName('iframe')).forEach(iframe => {\n \
  \ iframe.contentWindow.document.addEventListener('click', function(event)) {\n \
  \   console.log('iframe 内部被点击');\n  });\n});\n```\n\n注意：跨源策略可能会限制访问。\n\n在文档级别监听点击事件允许你处理全局交互。\n\
  \n```javascript\ndocument.addEventListener('click', function(e) {\n  console.log(`检测到点击坐标:\
  \ (${e.clientX}, ${e.clientY})`);\n});\n```\n\n要捕获跨文档所有的点击事件（包括 `iframe` 内部的点击），你需要为文档和每个\
  \ `iframe` 添加事件监听器：\n\n```javascript\ndocument.addEventListener('click', function(event)\
  \ {\n  console.log('文档被点击');\n});\nArray.from(document.getElementsByTagName('iframe')).forEach(iframe\
  \ => {\n  iframe.contentWindow.document.addEventListener('click', function(event))\
  \ {\n    console.log('iframe 内部被点击');\n  });\n});\n```\n\n注意：跨源策略可能会限制访问。\n\n\n\n\
  \n\n## 单次事件监听器\n\n对于一次性事件监听器，你可以在 `addEventListener` 中使用 `{ once: true }` 选项。`addEventListener`\
  \ 中的 `{ once: true }` 选项确保事件监听器在调用一次后自动移除。\n\n```javascript\ndocument.addEventListener('click',\
  \ function(event) {\n  console.log('This will only log the first click.');\n}, {\
  \ once: true });\n```\n\n要添加一个只运行一次的事件监听器，你可以使用 `addEventListener` 中的 `{ once: true\
  \ }` 选项。\n\n```javascript\nelement.addEventListener('click', function(event) {\n\
  \  console.log('This will only be logged once.');\n}, { once: true });\n```\n\n\
  ## 在输入变化时运行 JavaScript\n\n为了响应用户输入执行 JavaScript，请为输入元素的 `input` 事件附加事件监听器。\n\n```javascript\n\
  document.getElementById('myInput').addEventListener('input', function() {\n  console.log(`Current\
  \ input value: ${this.value}`);\n});\n```\n\n当用户更改 `<input>` 元素的内容时，你可以使用 `onchange`\
  \ HTML 属性或为 `change` 事件添加事件监听器。\n\n```html\n<input type=\"text\" id=\"myInput\"\
  \ onchange=\"console.log('Input changed!')\">\n```\n\n或者：\n\n```javascript\ndocument.getElementById('myInput').addEventListener('change',\
  \ function(event) {\n  console.log('Input changed!');\n});\n```\n\n## 停止 setInterval()\n\
  \n使用 `clearInterval()` 停止通过 `setInterval()` 设置的重复操作。\n\n```javascript\nconst intervalID\
  \ = setInterval(() => console.log('This prints every 2 seconds'), 2000);\n// 6 秒后停止\n\
  setTimeout(() => clearInterval(intervalID), 6000);\n```\n\n要停止由 `setInterval()`\
  \ 设置的函数重复执行，你可以使用 `clearInterval()`。\n\n```javascript\nconst intervalId = setInterval(()\
  \ => {\n  console.log('This prints every 1000ms');\n}, 1000);\n// 停止定时\nclearInterval(intervalId);\n\
  ```\n\n### setInterval() 示例\n\n```javascript\nconst intervalId = setInterval(()\
  \ => {\n  console.log('This message is logged every second.');\n}, 1000);\n// 5\
  \ 秒后停止定时\nsetTimeout(() => {\n  clearInterval(intervalId);\n}, 5000);\n```\n\n这些解释和示例涵盖了与\
  \ JavaScript 函数和作用域相关的广泛功能，从创建闭包和管理此上下文文到控制函数的执行流。理解这些概念对于有效的 JavaScript 编程至关重要，可以确保你的代码高效、可读且行为符合预期。\n\
  \n## 练习题答案\n\n● 如何确保函数被调用的频率不会超过指定的周期间隔，即使它被调用了多次？\n● JavaScript 中 `bind` 方法的主要用例是什么？\n\
  ●  哪种方法可以确保函数在特定的 `this` 上下文中被调用？\n● 如何捕获文档中的所有点击事件，包括 iframe 内部的点击事件？\n● 如何在 JavaScript\
  \ 中确保函数 `myFunc` 在 500ms 延迟后执行？\n● 如何在 JavaScript 中为元素添加一个只运行一次的事件监听器？\n● 哪种 HTML\
  \ 事件属性可以在用户更改 `<input>` 元素的内容时运行 JavaScript 代码？\n● 如何在 JavaScript 中停止 `setInterval()`\
  \ 的继续执行？\n\n### 函数与作用域测验\n\n**什么是 JavaScript 中的闭包？**\nA) 循环的一种\nB) 一种错误处理机制\nC)\
  \ 一个与其词法环境结合的函数\nD) 发送 HTTP 请求的方法\n**正确答案：** C) 一个与其词法环境结合的函数\n**解释：** JavaScript\
  \ 中的闭包是一个即使在父函数关闭后仍能访问父级作用域的函数。这使得函数能够记住并访问其词法作用域中的变量。\n\n**JavaScript 中防抖（debouncing）的目的是什么？**\n\
  A) 提高函数的执行速度\nB) 限制函数执行的频率\nC) 确保函数按特定顺序执行\nD) 将 `this` 关键字绑定到函数\n**正确答案：** B) 限制函数执行的频率\n\
  **解释：** 防抖是一种用于限制函数执行频率的技巧。它特别适用于处理按键或滚动事件等快速触发的事件，从而提升性能和用户体验。\n\n**在全局上下文中 `this`\
  \ 关键字指向什么？**\nA) 当前函数\nB) 全局对象\nC) 文档对象\nD) 窗口对象\n**正确答案：** D) 窗口对象\n**解释：** 在全局上下文中，`this`\
  \ 关键字指向全局对象，在 浏览器中就是窗口对象（window）。\n\n**`bind` 方法如何影响 JavaScript 中的函数？**\nA) 删除函数\n\
  B) 复制函数\nC) 永久设置函数的 `this` 上下文\nD) 立即调用函数\n**正确答案：** C) 永久设置函数的 `this` 上下文\n**解释：**\
  \ `bind` 方法会创建一个新函数，当该函数被调用时，其 `this` 关键字将被设置为提供的值，并在调用新函数时在任何提供的参数之前跟上一个给定的参数序列。\n\
  \n**你会使用哪种方法来确保函数在事件处理期间只执行一次？**\nA) 带有 `{ once: true }` 的 `addEventListener`\n\
  B) `setInterval`\nC) `setTimeout`\n**正确答案：** A) 带有 `{ once: true }` 的 `addEventListener`\n\
  **解释：** `addEventListener` 中的 `{ once: true }` 选项确保事件监听器在调用一次后自动移除。\n\n**哪种函数可以在指定的延迟后执行\
  \ JavaScript 代码？**\nA) `setInterval`\nB) `setTimeout`\nC) `clearTimeout`\nD) `clearInterval`\n\
  **正确答案：** B) `setTimeout`\n**解释：** `setTimeout` 用于在指定的延迟后执行代码。\n\n**在 JavaScript\
  \ 中如何监听 `<input>` 元素的变化？**\nA) 使用 `onClick` 事件\nB) 使用 `onInput` 事件\nC) 使用 `onChange`\
  \ 事件\nD) 使用 `onUpdate` 事件\n**正确答案：** C) 使用 `onChange` 事件\n**解释：** `onChange` 事件在\
  \ JavaScript 中用于响应 `<input>` 元素的变化。\n\n**防抖函数对连续的调用会做什么？**\nA) 确保所有调用都执行\nB) 取消除最后一次之前的调用\n\
  C) 以固定延迟执行每次调用\nD) 每次调用增加延迟\n**正确答案：** B) 取消除最后一次之前的调用\n**解释：** 防抖通过在特定延迟内有新调用时取消之前的调用来限制执行频率，有效地确保只执行最后一次调用。\n\
  \n**在什么场景下会在 JavaScript 中使用 `bind`？**\nA) 当你需要定期重复执行函数时\nB) 防止函数被调用过于频繁\nC) 确保函数在作为回调传递时保留其\
  \ `this` 上下文\nD) 在调用一次后移除事件监听器\n**正确答案：** C) 确保函数在作为回调传递时保留其 `this` 上下文\n**解释：**\
  \ `bind` 用于将函数的 `this` 上下文设置为特定对象，确保即使函数作为回调传递时也能保留该上下文。\n\n**如何停止由 `setInterval`\
  \ 调度的函数？**\nA) 使用 `stopInterval` 函数\nB) 使用 `clearInterval` 函数\nC) 将间隔设为 null\nD)\
  \ 使用 `setTimeout` 函数\n**正确答案：** B) 使用 `clearInterval` 函数\n**解释：** `clearInterval`\
  \ 函数用于停止通过 `setInterval` 设置为定期运行的函数。\n\n**关于 JavaScript 中的闭包，哪种说法是正确的？**\nA) 它们只能访问全局变量\n\
  B) 它是封装私有数据的一种\nC) 它们阻止函数访问外部作用域变量\nD) 它们在创建后立即执行\n**正确答案：** B) 它是封装私有数据的一种\n\n\n\
  \n\n\n## 解析\n闭包（Closures）允许函数在外部函数执行完毕后仍然访问外部作用域中的变量，实现了数据封装和私有变量创建。\n\n### JavaScript\
  \ 中 `this` 关键字的哪种特性会导致混淆？\n\nA) 它的值始终是 `window` 对象\nB) 它不能在箭头函数中使用\nC) 它的值在运行时根据函数被调用的上下文确定\n\
  D) 在严格模式下它始终为 `undefined`\n\n**正确答案：** C) 它的值在运行时根据函数被调用的上下文确定\n\n**解析：** `this`\
  \ 关键字取决于上下文；它的值由函数如何以及何时被调用决定，而不是由定义的位置决定，这导致了开发者之间的困惑。\n\n### 在 Web 开发中，防抖（debouncing）解决了什么问题？\n\
  \nA) 防止内存泄漏\nB) 优化递归函数调用\nC) 减少服务器负载\nD) 通过限制快速触发的事件来提高性能\n\n**正确答案：** D) 通过限制快速触发的事件来提高性能\n\
  \n**解析：** 防抖通过限制函数执行的频率来提高 Web 应用程序的性能和体验，对于处理滚动或按键等快速触发的事件特别有用。\n\n### 在什么情况下你会使用\
  \ `apply` 方法而不是 `bind`？\n\nA) 当你想在一个特定的 `this` 上下文中立即调用函数时\nB) 当你需要为未来的执行调度函数时\n\
  C) 当你想将函数永久绑定到对象上时\nD) 当移除事件监听器时\n\n**正确答案：** A) 当你想在一个特定的 `this` 上下文中立即调用函数时\n\n\
  **解析：** `bind` 返回一个带有绑定 `this` 上下文的新函数以供以后执行，而 `apply` 则根据指定的 `this` 上下文和以数组形式提供的参数立即调用函数。\n\
  \n### 下列哪项是 JavaScript 中事件监听器的错误使用方法？\n\nA) 使用 `addEventListener` 为同一事件多次执行函数\n\
  B) 使用带有 `{ once: true }` 选项的 `addEventListener` 执行一次函数\nC) 使用 `removeEventListener`\
  \ 防止事件触发\nD) 使用 `addEventListener` 处理非 DOM 对象的事件\n\n**正确答案：** D) 使用 `addEventListener`\
  \ 处理非 DOM 对象的事件\n\n**解析：** `addEventListener` 是为 DOM 对象添加事件监听器的方法。它不能直接用于处理非 DOM\
  \ 对象（如普通 JavaScript 对象或原始类型）的事件。\n\n### JavaScript 中的 `setInterval` 函数的作用是什么？\n\n\
  A) 按指定的时间推迟函数的执行\nB) 在指定的延迟后仅执行一次函数\nC) 以固定的时间间隔重复执行函数\nD) 在新线程中立即执行函数\n\n**正确答案：**\
  \ C) 以固定的时间间隔重复执行函数\n\n**解析：** `setInterval` 调度函数按固定的间隔重复执行，直到使用 `clearInterval`\
  \ 停止其执行。\n\n### 表单元素中 `onChange` 事件的主要用途是什么？\n\nA) 在提交时验证表单数据\nB) 监控并响应输入值的变化\n\
  C) 防止默认的表单提交行为\nD) 在输入框中添加占位符文本\n\n**正确答案：** B) 监控并响应输入值的变化\n\n**解析：** `onChange`\
  \ 事件用于检测并响应输入元素值的变化，从而允许根据用户输入进行动态反馈和验证。\n\n### JavaScript 如何处理箭头函数中的 `this` 关键字？\n\
  \nA) 它将 `this` 绑定到全局对象\nB) 它允许通过 `bind` 动态设置 `this`\nC) 它根据周围环境进行词法绑定 `this`\nD)\
  \ 它将 `this` 设置为 `null`\n\n**正确答案：** C) 它根据周围环境进行词法绑定 `this`\n\n**解析：** 在箭头函数中，`this`\
  \ 是词法绑定的，这意味着它使用包含箭头函数的代码中的 `this`，与普通函数不同（普通函数的 `this` 由调用上下文决定）。\n\n### 在 JavaScript\
  \ 中使用 `clearTimeout` 的效果是什么？\n\nA) 停止由 `setInterval` 设置的重复间隔\nB) 防止由 `setTimeout`\
  \ 设置的函数执行\nC) 在指定时间内暂停函数的执行\nD) 立即执行延迟的函数\n\n**正确答案：** B) 防止由 `setTimeout` 设置的函数执行\n\
  \n**解析：** `clearTimeout` 用于取消通过 `setTimeout` 设置的超时器（timeout），防止被调度的函数被执行。\n\n###\
  \ 为什么你可能在 JavaScript 中使用 `call` 方法？\n\nA) 调度函数在延迟后运行\nB) 使用显式设置的 `this` 值和单个参数执行函数\n\
  C) 防止函数被调用\nD) 将函数永久绑定到对象上\n\n**正确答案：** B) 使用显式设置的 `this` 值和单个参数执行函数\n\n**解析：**\
  \ `call` 方法用于通过指定的 `this` 值和传递给函数的单个参数调用函数，允许灵活的函数调用。\n\n### 在什么情况下会创建 JavaScript\
  \ 闭包？\n\nA) 每当定义函数时\nB) 当函数作为参数传递给另一个函数时\nC) 当在另一个函数内部声明函数并访问外部函数的变量时\nD) 使用 `new`\
  \ 关键字执行函数时\n\n**正确答案：** C) 当在另一个函数内部声明函数并访问外部函数的变量时\n\n**解析：** 当内部函数可以在闭包函数外部访问，并保留对闭包函数作用域的访问时，闭包就形成了。这使得内部函数在外部函数执行完毕后仍然可以访问外部函数中定义的变量。\n\
  \n### 防抖技术防止了什么？\n\nA) 函数返回值\nB) 事件被捕获\nC) 响应高频事件频繁执行\nD) 事件的默认操作\n\n**正确答案：** C)\
  \ 响应高频事件频繁执行\n\n**解析：** 防抖是一种编程实践，用于确保耗时操作不会如此频繁地触发，对于缩放、滚动或按键等事件特别有用。它通过在一段时间后执行函数来实现这一点。\n\
  \n### 关于 `bind` 方法，哪种描述是正确的？\n\nA) 它用于按固定间隔重复执行函数\nB) 它创建一个新函数，在调用时将其 `this` 设置为提供的值\n\
  C) 它根据指定的延迟立即执行函数\nD) 使用 `setTimeout` 取消延迟的函数执行\n\n**正确答案：** B) 它创建一个新函数，在调用时将其\
  \ `this` 设置为提供的值\n\n**解析：** `bind` 方法创建一个新函数，该函数在执行时将其 `this` 关键字设置为提供的值，允许在不同的上下文中进行更可预测的函数执行。\n\
  \n### 在 JavaScript 中使用 `setInterval` 的主要原因是什么？\n\nA) 定期检查变量的值\nB) 在用户采取特定操作后延迟执行函数\n\
  C) 固定时间间隔重复执行函数\nD) 确保函数在指定时间后执行一次\n\n**正确答案：** C) 固定时间间隔重复执行函数\n\n**解析：** `setInterval`\
  \ 用于以固定的时间间隔重复执行函数或代码块。它常用于创建轮询、动画或任何重复操作。\n\n### `onChange` 事件如何提高 Web 表单的用户体验？\n\
  \nA) 每当输入值变化时重新加载页面\nB) 允许在用户与表单元素交互时提供实时反馈和验证\nC) 防止用户输入错误数据\n\n\n\n\n\nD) 当任何值发生变化时自动提交表单\n\
  \n正确答案：B) 允许在用户与表单元素交互时提供实时反馈和验证\n\n解释：`onChange` 事件可用于在用户填写表单时提供即时反馈或验证，通过实时响应变化而无需刷新页面或提交表单，从而增强了交互性和用户体验。\n\
  \n# 数据结构与类型\n\n-   **原型继承 (Prototype Inheritance)**：JavaScript 的一种机制，允许对象从其他对象继承特性，使得对象的属性和方法可以被共享。\n\
  -   **Set 对象 (Set Object)**：一种 JavaScript 对象，设计用于存储任何类型的唯一值，从而消除重复项。\n-   **数组去重\
  \ (Removing Duplicates from an Array)**：利用 `Set` 对象过滤掉数组中的重复值。\n-   **使用 Set 的优势\
  \ (Benefit of Using Set)**：`Set` 本生存储唯一值，简化了维护不同项目集合的过程，无需手动检查重复。\n-   **NaN**：代表“Not-a-Number”（不是数字），是一个特殊值，表示未定义或无法表示的数值结果。\n\
  -   **null vs. undefined**：`null` 是一个赋值值，表示有意地不存在任何对象值；而 `undefined` 表示变量已声明但尚未赋值。\n\
  -   **Array.prototype.reduce()**：该方法在数组的每个元素上执行还原器函数，最终产生单个输出值。\n-   **Array.prototype.flatMap()**：将\
  \ `map` 和 `flat` 合并为一个方法，它使用映射函数对每个元素进行映射，然后将结果平化为新数组。\n-   **Symbol.iterator**：一个指定对象默认迭代器的属性，用于需要对对象进行迭代的上下文（例如\
  \ `for...of` 循环）。\n-   **slice vs. splice**：`slice` 创建数组部分内容的浅拷贝且不修改原始数组；而 `splice`\
  \ 则通过添加、删除或替换元素来更改数组。\n-   **Array.prototype.every()**：检查数组中的所有元素是否通过由提供的函数定义的测试，并返回一个布尔值\
  \ (`Boolean`)。\n-   **Array.prototype.map()**：创建一个新数组，其元素是通过在调用数组的每个元素上调用提供的函数所得到的结果。\n\
  -   **Array.prototype.some()**：测试数组中至少有一个元素通过由提供的函数实现的测试，并返回一个布尔值 (`Boolean`)。\n\
  -   **合并两个数组 (Concatenating Two Arrays)**：使用 `concat` 方法或扩展运算符 (`...`) 将两个数组合并为一个。\n\
  -   **创建新的日期对象 (Creating a New Date Object)**：使用 `new Date()` 创建一个带有当前日期和时间的新日期对象。\n\
  -   **转换值并累加结果 (Transforming Values and Accumulating Results)**：`reduce` 方法最适合转换数组值并将其累加为单个结果。\n\
  \n## JavaScript 中的原型继承\n\n原型继承允许 JavaScript 对象从另一个对象继承属性和方法。我们使用原型为构造函数添加属性和方法。\n\
  \n```javascript\nfunction Person(firstName, lastName) {\n  this.firstName = firstName;\n\
  \  this.lastName = lastName;\n}\n\nPerson.prototype.fullName = function() {\n  return\
  \ `${this.firstName} ${this.lastName}`;\n};\n\nconst person1 = new Person('John',\
  \ 'Doe');\nconsole.log(person1.fullName()); // John Doe\n```\n\n原型继承是 JavaScript\
  \ 的核心概念，允许对象从另一个对象继承属性和方法。该机制基于原型链，JavaScript 在对象本身上不存在某个属性时，会在其原型中查找，如果在原型中未找到，则会在该原型的原型中查找，依此类推。\n\
  \n### 示例 1：基础原型继承\n\n此示例演示了对象如何通过原型链接从另一个对象继承属性和方法。\n\n```javascript\nfunction Animal(name)\
  \ {\n  this.name = name;\n}\n\nAnimal.prototype.speak = function() {\n  console.log(`${this.name}\
  \ makes a noise.`);\n};\n\nfunction Dog(name) {\n  Animal.call(this, name); // 使用\
  \ Dog 实例的上下文调用父构造函数\n}\n\nDog.prototype = Object.create(Animal.prototype); // 继承自\
  \ Animal\nDog.prototype.constructor = Dog; // 将构造函数指向 Dog\nDog.prototype.speak =\
  \ function() {\n  console.log(`${this.name} barks.`);\n};\n\nlet dog = new Dog('Rex');\n\
  dog.speak(); // 输出: Rex barks.\n```\n\n解释：`Dog` 构造函数通过将其原型设置为由 `Animal.prototype`\
  \ 创建的新对象来继承 `Animal`。这允许 `Dog` 的实例访问定义在 `Animal.prototype` 上的方法，随后通过覆盖提供了更具体的实现。\n\
  \n### 示例 2：在原型上添加方法\n\n此示例展示了如何向对象的原型添加方法，这些方法对该对象的所有实例都可用。\n\n```javascript\nfunction\
  \ Person(firstName, lastName) {\n  this.firstName = firstName;\n  this.lastName\
  \ = lastName;\n}\n\nPerson.prototype.fullName = function() {\n  return `${this.firstName}\
  \ ${this.lastName}`;\n};\n\nlet person1 = new Person('John', 'Doe');\nconsole.log(person1.fullName());\
  \ // 输出: John Doe\n```\n\n解释：`fullName` 方法被添加到 `Person.prototype`，使得所有 `Person`\
  \ 实例都可以使用该方法。\n\n### 示例 3：原型链\n\n此示例说明了更长的原型链，一个对象从另一个对象继承，而该对象又从另一个对象继承。\n\n```javascript\n\
  function Shape() {\n  this.type = 'shape';\n}\n\nShape.prototype.getType = function()\
  \ {\n  return this.type;\n}\n\nfunction Polygon(sides) {\n  Shape.call(this); //\
  \ 调用父构造函数\n  this.sides = sides;\n  this.type = 'polygon';\n}\n\nPolygon.prototype\
  \ = Object.create(Shape.prototype);\nPolygon.prototype.constructor = Polygon;\n\n\
  function Triangle() {\n  Polygon.call(this, 3); // 调用带有 3 边的父构造函数\n  this.type =\
  \ 'triangle';\n}\n\nTriangle.prototype = Object.create(Polygon.prototype);\nTriangle.prototype.constructor\
  \ = Triangle;\n\nlet triangle = new Triangle();\nconsole.log(triangle.getType());\
  \ // 输出: triangle\n```\n\n解释：在这里，`Triangle` 继承自 `Polygon`，而 `Polygon` 又继承自 `Shape`。这形成了原型链：`Triangle\
  \ -> Polygon -> Shape`。方法和属性可以沿着链链访问，演示了 JavaScript 的原型继承允许对象从其祖先继承。\n\n\n\n\n\n\
  `NaN` 代表 \"Not-a-Number\"不是数字），是一个在数值计算中表示未定义或不可表示值的特殊值。它的独特之处在于，它是 `JavaScript`\
  \ 中唯一不等于自身的值。\n\n```javascript\nconsole.log(NaN === NaN); // false\nconsole.log(isNaN(NaN));\
  \ // true\n```\n\n`NaN` 代表 \"Not-a-Number\"，是未定义或错误操作的结果。\n\n```javascript\nconsole.log(typeof\
  \ NaN); // \"number\"\nconsole.log(isNaN(NaN)); // true\nconsole.log(isNaN(\"Hello\"\
  )); // true, \"Hello\" 不是一个数字\n```\n\n## null 和 undefined 的区别\n\n在 JavaScript 中，`null`\
  \ 表示有意地缺席任何对象值，而 `undefined` 表示一个变量已经声明但尚未被赋值。两者都表示“空”值，但语境略有不同。\n\n```javascript\n\
  let a; // undefined\nlet b = null; // null\n```\n\n- `null` 是一个表示没有值的赋值值。\n- `undefined`\
  \ 意味着变量已声明但尚未赋值。\n\n```javascript\nlet nothing = null;\nlet something;\nconsole.log(nothing);\
  \ // null\nconsole.log(something); // undefined\n```\n\n## reduce() 方法\n\n`reduce()`\
  \ 方法对累加器和数组中的每个元素（从左到右）应用函数，以将其还原为单个值。\n\n```javascript\nconst numbers = [1, 2,\
  \ 3, 4];\nconst sum = numbers.reduce((accumulator, currentValue) => accumulator\
  \ + currentValue, 0);\nconsole.log(sum); // 10\n```\n\n`Array.prototype.reduce()`\
  \ 方法在数组的每个元素上执行还原器函数（reducer），产生一个单一输出值。它对于聚合或总结数组中的数据非常强大。\n\n```javascript\nconst\
  \ numbers = [1, 2, 3, 4];\nconst sum = numbers.reduce((accumulator, currentValue)\
  \ => accumulator + currentValue, 0);\nconsole.log(sum); // 10\n```\n\n## flatMap()\
  \ 方法\n\n`flatMap()` 方法首先使用映射函数对每个元素进行映射，然后将结果平坦化为一个新数组。\n\n```javascript\nconst\
  \ arr = [1, 2, 3, 4];\nconst result = arr.flatMap(x => [x, x * 2]);\nconsole.log(result);\
  \ // [1, 2, 2, 4, 3, 6, 4, 8]\n```\n\n`Array.prototype.flatMap()` 方法首先使用映射函数对每个元素进行映射，然后将结果平坦化为一个新数组。它本质等同于\
  \ `map` 后接深度为 1 的 `flatten`。\n\n### 示例 1：对二维数组进行平坦化和映射\n\n`flatMap` 方法可以同时用于使用映射函数映射每个元素，并将结果平坦化为新数组。\n\
  \n```javascript\nlet arr = [[1, 2], [3, 4], [5, 6]];\nlet flatMappedArr = arr.flatMap(subArray\
  \ => subArray.map(element => element * 2));\nconsole.log(flatMappedArr); // 输出:\
  \ [2, 4, 6, 8, 10, 12]\n```\n\n**解释：** 每个子数组都被映射到一个新数组，其中每个元素都乘以 2。然后 `flatMap`\
  \ 方法将这些映射后的数组平坦化为单个数组。\n\n### 示例 2：移除空位\n\n`flatMap` 方法可以移除数组中的空位，而 `map` 方法会保留这些空位。\n\
  \n```javascript\nlet arrWithEmptySlots = [1, 2, , 4, 5];\nlet result = arrWithEmptySlots.flatMap(element\
  \ => [element * 2]);\nconsole.log(result); // 输出: [2, 4, 8, 10]\n```\n\n**解释：**\
  \ `flatMap` 方法将每个元素映射到一个包含该元素乘以 2 值的数组，然后平坦化结果。空位在此过程中被移除了。\n\n### 示例 3：处理仅单层平坦化的嵌套数组\n\
  \n当你希望在应用变换的同时，只对嵌套数组平坦化一层层时，`flatMap` 特别有用。\n\n```javascript\nlet nestedArr = [[1],\
  \ [2, 3], [4, 5, 6]];\nlet flatMappedAndIncremented = nestedArr.flatMap(subArray\
  \ => subArray.map(number => number + 1));\nconsole.log(flatMappedAndIncremented);\
  \ // 输出: [2, 3, 4, 5, 6, 7]\n```\n\n**解释：** 此示例演示了如何使用 `flatMap` 将嵌套数组中的每个数字加 1，然后将嵌套数组平坦化一层。与使用\
  \ `map` 后接 `flat` 不同，`flatMap` 在一步内就完成了这一操作，可以提高性能并使代码更简洁。\n\n## Symbol.iterator\
  \ 属性的用例\n\n`Symbol.iterator` 使对象是可迭代的，并定义迭代行为，例如在 `for...of` 循环中如何遍历值。\n\n```javascript\n\
  const obj = {\n  start: 1,\n  end: 5,\n  [Symbol.iterator]() {\n    let currentValue\
  \ = this.start;\n    const self = this;\n    return {\n      next() {\n        if\
  \ (currentValue <= self.end) {\n          return { value: currentValue++, done:\
  \ false };\n        } else {\n          return { done: true };\n        } \n   \
  \   } \n    }\n  }\n};\n\nfor (const num of obj) {\n  console.log(num); // 1, 2,\
  \ 3, 4, 5\n}\n```\n\n`Symbol.iterator` 属性是定义对象默认迭代器的基础。它被 `for...of` 循环和其他期望数据是可迭代的结构使用。这允许自定义对象与循环结构和扩展操作符无缝集成。\n\
  \n\n\n\n\n`Array.prototype.map()` 方法创建一个新数组，其每个元素是通过对原数组的每个元素调用提供的函数得到的。它被广泛用于转换数组中的数据。\n\
  \n### 示例 1：数组中的数值翻倍\n\n`map` 方法创建一个新数组，其每个元素是通过对原数组的每个元素调用提供的函数得到的。\n\n```javascript\n\
  const numbers = [1, 2, 3, 4];\nconst doubled = numbers.map(number => number * 2);\n\
  console.log(doubled); // 输出: [2, 4, 6, 8]\n```\n\n解释：此示例演示了如何使用 `map` 方法遍历 `numbers`\
  \ 数组中的每个元素，并将每个值翻倍。结果是一个名为 `doubled` 的新数组，它包含了每个原始元素乘以 2 的结果。\n\n### 示例 2：将字符串转换为大写\n\
  \n`map` 方法也可以用于对字符串数组的操作，例如将数组中的每个字符串转换为大写。\n\n```javascript\nconst fruits = ['apple',\
  \ 'banana', 'cherry'];\nconst upperCasedFruits = fruits.map(fruit => fruit.toUpperCase());\n\
  console.log(upperCasedFruits); // 输出: ['APPLE', 'BANANA', 'CHERRY']\n```\n\n解释：在此示例中，`map`\
  \ 被应用于 `fruits` 数组，对每个字符串元素调用了 `toUpperCase` 方法。结果是一个新数组 `upperCasedFruits`，其中每个水果名称都已转换为大写，展示了\
  \ `map` 处理不同类型数据的多功能性。\n\n## some() 方法的用例\n\n`some()` 方法测试数组中是否至少有一个元素通过由提供的函数实现的测试。\n\
  \n`Array.prototype.some()` 方法测试数组中是否至少有一个元素通过由提供的函数实现的测试，返回一个布尔值。它用于检查数组中是否任意元素满足特定条件。\n\
  \n```javascript\nconst array = [1, 2, 3, 4, 5];\nconst even = (element) => element\
  \ % 2 === 0;\nconsole.log(array.some(even)); // true\n```\n\n### 示例 1：检查数组中是否存在正数\n\
  \n`some` 方法测试数组中是否至少有一个元素通过提供的函数实现的测试。它返回一个布尔值。\n\n```javascript\nconst array =\
  \ [-1, -2, -3, -4, 5];\nconst hasPositiveNumber = array.some(number => number >\
  \ 0);\nconsole.log(hasPositiveNumber); // 输出: true\n```\n\n解释：此示例检查 `array` 是否包含任何正数。`some`\
  \ 方法遍历每个元素并应用测试函数。由于至少有一个正数（5），该方法返回 `true`。\n\n### 示例 2：验证字符串数组中是否存在特定字符串\n\n你可以使用\
  \ `some` 方法来检查数组中包含包含符合特定标准的字符串，例如包含特定的子字符串。\n\n```javascript\nconst fruits = ['apple',\
  \ 'banana', 'mango', 'orange'];\nconst hasFruitWithA = fruits.some(fruit => fruit.includes('a'));\n\
  console.log(hasFruitWithA); // 输出: true\n```\n\n解释：在这种情况下，`fruits.some(hasFruitWithA)`\
  \ 检查 `fruits` 数组中的任何字符串是否包含子字符串 'a'。由于多个水果符合此标准（例如 \"apple\", \"banana\", \"mango\"\
  , \"orange\"），该方法返回 `true`，表示至少有一个名称中包含字母 'a' 的水果。\n\n## 合并数组\n\n你可以使用 `concat()`\
  \ 方法或扩展运算符来合并数组 ....\n\n```javascript\nconst array1 = ['a', 'b', 'c'];\nconst array2\
  \ = ['d', 'e', 'f'];\nconst array3 = array1.concat(array2);\nconsole.log(array3);\
  \ // ['a', 'b', 'c', 'd', 'e', 'f']\n\n// 或者使用扩展运算符\nconst array4 = [...array1,\
  \ ...array2];\nconsole.log(array4); // ['a', 'b', 'c', 'd', 'e', 'f']\n```\n\n在\
  \ JavaScript 中，你可以使用 `concat` 方法或扩展语法合并两个数组，两者都会返回一个新数组而不修改原始数组。\n\n## 创建新的 Date\
  \ 对象\n\n要在 JavaScript 中创建一个表示当前日期和时间的新日期对象，只需实例化一个新的 `Date` 对象而不传递任何参数。\n\n```javascript\n\
  const now = new Date();\nconsole.log(now.toString()); // 显示当前日期和时间\n```\n\n## 转换数组值并累加结果\n\
  \n转换数组值和累加结果都可以通过 `reduce()` 方法实现，允许执行复杂的操作，如求和或根据条件逻辑创建新数组。\n\n```javascript\n\
  const numbers = [1, 2, 3, 4];\nconst doubled = numbers.reduce((acc, cur) => {\n\
  \  acc.push(cur * 2);\n  return acc;\n}, []);\nconsole.log(doubled); // [2, 4, 6,\
  \ 8]\n```\n\n`reduce()` 方法最适合转换数组的值并将结果累加为单个值。它在累加数据方面提供了灵活性，无论是数字求和、字符串拼接还是对象聚合。\n\
  \n```javascript\nconst numbers = [1, 2, 3, 4];\nconst sum = numbers.reduce((accumulator,\
  \ currentValue) => accumulator + currentValue, 0);\nconsole.log(sum); // 10\n```\n\
