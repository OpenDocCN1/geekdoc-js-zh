  \ Web 应用程序。\n\n#### 拖放事件\n\n大多数主流浏览器包括 Android 2.1、Chrome 3、Firefox 3.5、Internet\
  \ Explorer 5 和 Safari 3 都提供了拖放支持。尽管现在 Opera 和 iOS 不支持拖放，但它们最终会支持，因为拖放是 HTML5 的一部分，而这两个浏览器厂商都支持\
  \ HTML5。\n\n### 实现拖放\n\n原生应用程序与网页相比，最基本的方面之一是移动对象的能力——即拖拽并释放它们。HTML5 通过 API 和几个新属性将该功能带到了\
  \ Web 应用程序。\n\n在计算机浏览器上，拖放是通过鼠标实现的。用户点击并按住对象，然后移动鼠标，通过鼠标移动对象。当用户释放鼠标按钮时，对象就会掉在新的位置。在\
  \ Android 设备上，拖放是当用户点击并按住对象，然后滑动到新位置并松开时发生的。\n\n实现拖放的两种方式通常被称为“旧派”和“新派”。新派是 HTML5\
  \ 拖放，而旧派使用 DHTML（动态 HTML）。许多使用 DHTML 的实现仅在一种特定浏览器中工作，或仅在特定的外部框架下工作。\n\n使用 HTML5\
  \ 拖放提供了一些切实的益处：\n\n• 你不会受限于任何特定的浏览器或框架，因为 HTML5 API 被广泛支持。\n• HTML5 拖放可以跨浏览器窗口、框架，甚至非\
  \ Web 应用程序。\n\n### 注意！浏览器差异\n\n浏览器支持确实存在一些问题。Internet Explorer 只会实现部分。在 Internet\
  \ Explorer 中，拖放是通过鼠标实现的。用户点击并按住对象，然后移动鼠标，通过鼠标移动对象。在 Firefox 3.5 中，拖放是复杂的。在 Chrome\
  \ 3 中，拖放是点击并按住对象然后移动鼠标。在 Safari 3 中，拖放是使用鼠标实现的。在 Android 2.1 中，拖放是点击并按住对象然后滑动到新位置并松开。\n\
  \n#### 拖放事件\n\n为了允许拖放运行，添加了 HTML5 事件和属性。\n\n- `dragstart`：拖拽开始时触发。\n- `drag`：在拖拽期间持续触发。\n\
  - `dragenter`：拖拽元素进入目标区域时触发。\n- `dragleave`：拖拽元素离开目标区域时触发。\n- `dragover`：拖拽元素位于目标区域上方时触发。\n\
  - `dragend`：拖拽结束时触发。\n- `drop`：元素被释放到目标区域时触发。\n\n不同浏览器处理这些事件的方式有所不同。你可以查看图 16.1\
  \ 中的示例。\n\n\n\n\n\n- `dataTransfer.clearData([format])`—从指定的格式删除数据，或者在未应用参数时删除所有数据。\n\
  - `dataTransfer.effectAllowed [= value]`—允许进行传输的操作类型。可能的值有 `none`、`copy`、`copyLink`、`copyMove`、`link`、`linkMove`、`move`、`all`\
  \ 和 `uninitialized`。\n- `dataTransfer.dropEffect [= value]`—允许的放置操作类型。可能的值有 `none`、`copy`、`link`\
  \ 和 `move`。\n- `dataTransfer.setDragImage(element, x, y)`—使用指定的图像元素代替浏览器默认，并将其放置在距离光标偏移\
  \ `x, y` 坐标处。\n- 将指定的指定的图像元素添加到渲染拖拽反馈的元素列表中。\n- `dataTransfer.types`—返回拖拽操作开始时设置格式列表。\n\
  - `dataTransfer.items`—返回带有拖拽数据的项目数组。\n- `dataTransfer.files`—返回正在拖拽的文件列表（如果有）。\n\
  \n最重要的对象是 `setData` 和 `getData` 对象。它们在被拖拽的对象和被放置的目标对象之间传递信息。\n\n#### 拖放属性\n\n之前列出的每个事件都有一个相关的事件属性，你可以使用它来启动脚本：\n\
  \n- `ondragstart`\n- `ondrag`\n- `ondragenter`\n- `ondragleave`\n- `ondragover`\n\
  - `ondrop`\n- `ondragend`\n\nHTML5 中用于拖放的其他新属性是 `draggable` 属性和 `dropzone` 属性。这些属性的设计用于告诉浏览器页面上的哪些项目是拖放接口的一部分。\n\
  \n#### 注意！`draggable` 和 `dropzone` 属性具有特殊性\n\n你应该养成使用 `draggable` 和 `dropzone` 属性来定义可拖拽对象和放置区域的习惯，但请记住它们对你的设计可能影响很小。Chrome\
  \ 会拖拽带有 `draggable` 属性的对象，但不会将其放置到带有 `dropzone` 属性的元素中。Firefox 在 `<<img>>` 或 `<a>`\
  \ 之外的任何元素上都需要 `draggable` 属性。否则，它会将拖拽视为选择。Internet Explorer 不需要这两个属性。Safari 会拖拽\
  \ `draggable` 元素，并显示带有 `dropzone` 属性的放置区域（但如果没有脚本将什么都不做）。如果没有 `draggable` 属性，所有浏览器都会将拖拽视为选择——尽管如果元素上附加了脚本，IE\
  \ 也会执行拖拽。\n\n这些属性在每个浏览器中并没有完全支持，正如你在“注意”中所看到的，它们的行为略有不同。但养成使用它们的习惯是个好主意，当这些属性获得全浏览器支持时，你的应用程序就准备就绪。\n\
  \n#### 有用的 CSS 扩展\n\n除了新属性之外，某些 CSS 扩展也可以让你的拖放操作看起来更平滑：\n\n- `-webkit-user-drag`—此属性标识\
  \ Safari 和 Chrome 中可以拖拽的元素。这也可以写成 `-khtml-user-drag`。它大部分被 HTML5 的 `draggable` 属性取代。\n\
  - `user-select`—指示项目在拖拽时是否应该选择它所经过的内容。该属性具有针对 Firefox、WebKit 和 Opera 的浏览器扩展：`-moz-user-select`、`-webkit-user-select`（以及\
  \ `-khtml-user-select`）和 `-o-user-select`。\n\n通过编写以下代码在文档中可拖拽的项目上设置这些扩展：\n\n```css\n\
  [draggable=true] {\n    -khtml-user-drag: element;\n    -webkit-user-drag: element;\n\
  \    -webkit-user-select: none;\n    -khtml-user-select: none;\n    -moz-user-select:\
  \ none;\n    -o-user-select: none;\n    user-select: none;\n}\n```\n\n### 构建拖放接口\n\
  \n构建 HTML5 拖放接口的六个步骤如下：\n\n1. 定义一个可拖拽对象。\n2. 在该对象上设置事件。\n3. 定义一个放置区域。\n4. 在放置区域上设置事件。\n\
  5. 在对象和放置区域之间传递信息。\n6. 定义拖放操作的效果。\n\n以下章节将详细讨论这些步骤。\n\n#### 定义可拖拽对象\n\n要定义一个可拖拽对象，向项目添加\
  \ `draggable=\"true\"` 属性。为了在 Internet Explorer 中获得最佳效果，你应该只让图像或链接可用。其他元素可能会导致意外结果。以下是让图像可拖拽的方法：\n\
  \n```html\n<img src=\"image.png\" draggable=\"true\">\n```\n\n#### 在可拖拽对象上设置事件\n\
  \n大多数拖拽事件在拖拽开始时立即设置。使用 `ondragstart`：\n\n```html\n<img src=\"image.png\" draggable=\"\
  true\" ondragstart=\"drag(event)\">\n```\n\n`drag()` 函数需要做一件事：设置 `dataTransfer`。你可以可靠使用的格式类型是\
  \ `text`。拖拽函数看起来如下：\n\n```javascript\nfunction drag(element) {\n    dataTransfer.setData(\"\
  Text\", element.id);\n}\n```\n\n你可以在拖拽时通过 `ondrag` 运行脚本，但并不常见。\n\n#### 定义放置区域\n\n\
  放置区域是拖拽项目应该放置的地方。使用 `dropzone` 属性定义放置区域：\n\n```html\n<div id=\"dropZone\" dropzone=\"\
  copy\">\n    <p>在此处放置项目</p>\n</div>\n```\n\n#### 顺便说：使用 CSS 高亮放置区域\n\nFirefox 引入了一个新的伪类：`-moz-drag-over`。该属性允许在对象拖过放置区域时让你的放置区域更加突出。该属性在除\
  \ Firefox 以外的任何浏览器都不支持。\n\n#### 在放置区域上设置事件\n\n放置区域有四个可以应用于它的事件：\n\n- `ondrop`\n\
  - `ondragover`\n- `ondragenter`\n- `ondragleave`\n\n#### 注意！不要忘记设置 dragover 事件\n\
  \n记住 `drop` 事件很容易，因为这是一个拖放操作。然而，也需要设置 `dragover` 事件。`dragover` 处理程序的默认行为是继续拖拽。为了允许你的对象被放置，你必须取消这种行为。如果不这样做，你的脚本将不起。\n\
  \n虽然你只需要设置 `ondrop` 和 `ondragover` 事件，但设置另外两个也是个好主意，这样浏览器就不会执行任何操作：\n\n```html\n\
  <div id=\"dropZone\"\n    ondrop=\"drop(this, event);\"\n    ondragenter=\"return\
  \ false;\"\n    ondragover=\"return false;\"\n    ondragleave=\"return false;\"\
  >\n</div>\n```\n\n`drop()` 函数有两个工作：首先从 `dataTransfer` 对象中收集被拖拽元素的数据，其次是在放置内容时关闭浏览器的默认行为：\n\
  \n```javascript\nfunction drop(target, e) {\n    var id = e.dataTransfer.getData('Text');\n\
  \    target.appendChild(document.getElementById(id));\n    e.preventDefault();\n\
  }\n```\n\n在 `e.preventDefault();` 这一行中阻止默认操作在 Firefox 中尤为重要。如果你漏掉这一行，浏览器将像通常解释那样解释拖拽的项目，因此对于图像，它将在新窗口中打开被拖拽的元素。\n\
  \n\n\n\n`dataTransfer` 对象用于在被拖动元素和放置区域之间传递信息。你可以在拖拽开始时设置数据，并在放置操作启动时获取数据。\n\n###\
  \ 为操作定义效果\n\n在 `dataTransfer` 对象上，你用于定义效果的两个方法是：\n\n- `dataTransfer.effectAllowed`\n\
  - `dataTransfer.dropEffect`\n\n**注意！**：不要将效果设置为“move”（移动）\n\n在 Windows 上的旧版本 Chrome\
  \ 和 Safari 中，如果 `effectAllowed` 或 `dropEffect` 被设置为“move”，它们将完全无法工作。这个 bug 已经修复，但可能仍影响使用早于\
  \ Safari 5 或 Chrome 10 版本的用户。\n\n这些方法在拖拽开始和放置时必须保持匹配。如果它们不匹配，则元素将无法放置到该放置区域中。例如，如果你有以下拖放函数，被拖动的元素将无法放置到放置区域中：\n\
  \n```javascript\nfunction drag(target, e) {\n    e.dataTransfer.effectAllowed =\
  \ \"copy\";\n    e.dataTransfer.setData(\"Text\", target.id);\n}\n\nfunction drop(target,\
  \ e) {\n    e.dataTransfer.dropEffect = \"move\";\n    var id = e.dataTransfer.getData('Text');\n\
  \    target.appendChild(document.getElementById(id));\n    e.preventDefault();\n\
  }\n```\n\n在上面的代码中，`dataTransfer.effectAllowed` 是 `copy`，而 `dataTransfer.dropEffect`\
  \ 是 `move`。因为它们不是都是 `copy` 或都是 `move`，所以拖放函数将不起。\n\n大多数情况下，你可以忽略这些效果。它们默认允许所有效果，这通常就是你需要的。\n\
  \n### 动手尝试：构建拼图拖放应用程序\n\n拖放是为用户构建简单游戏的棒方法。例如，你可以创建一个拼图，用户可以通过拖放碎片来拼成图片；只需按照以下步骤操作：\n\
  \n1. 取一张 600 × 800 像素的图片并将其切割成 12 个大小相同的正方形（200 × 200）。\n\n2. 构建一个 HTML 页面来显示拼图碎片和碎片的放置区域：\n\
  \n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Drag-and-Drop\
  \ Puzzle</title>\n    <link rel=\"stylesheet\" href=\"basic-styles.css\">\n    <script\
  \ src=\"jquery.min.js\"></script>\n</head>\n<body>\n    <h1>Drag-and-Drop Puzzle</h1>\n\
  \    <p>Drag the puzzle pieces into the puzzle frame</p>\n    <div id=\"pieces\"\
  >\n        <h2>Pieces</h2>\n    </div>\n    <div id=\"frameHolder\">\n        <h2>Frame</h2>\n\
  \        <div id=\"puzzle-frame\">\n            <div id=\"place1\"></div>\n    \
  \        <div id=\"place2\"></div>\n            <div id=\"place3\"></div>\n    \
  \        <div id=\"place4\"></div>\n            <div id=\"place5\"></div>\n    \
  \        <div id=\"place6\"></div>\n            <div id=\"place7\"></div>\n    \
  \        <div id=\"place8\"></div>\n            <div id=\"place9\"></div>\n    \
  \        <div id=\"place10\"></div>\n            <div id=\"place11\"></div>\n  \
  \          <div id=\"place12\"></div>\n        </div>\n    </div>\n</body>\n</html>\n\
  ```\n\n3. 向放置区域添加 `drop`、`dragenter` 和 `dragover` 事件：\n\n```html\n<div id=\"place1\"\
  \ ondrop=\"drop(this, event);\" ondragenter=\"return false;\" ondragover=\"return\
  \ false;\"></div>\n<div id=\"place2\" ondrop=\"drop(this, event);\" ondragenter=\"\
  return false;\" ondragover=\"return false;\"></div>\n<div id=\"place3\" ondrop=\"\
  drop(this, event);\" ondragenter=\"return false;\" ondragover=\"return false;\"\
  ></div>\n<div id=\"place4\" ondrop=\"drop(this, event);\" ondragenter=\"return false;\"\
  \ ondragover=\"return false;\"></div>\n<div id=\"place5\" ondrop=\"drop(this, event);\"\
  \ ondragenter=\"return false;\" ondragover=\"return false;\"></div>\n<div id=\"\
  place6\" ondrop=\"drop(this, event);\" ondragenter=\"return false;\" ondragover=\"\
  return false;\"></div>\n<div id=\"place7\" ondrop=\"drop(this, event);\" ondragenter=\"\
  return false;\" ondragover=\"return false;\"></div>\n<div id=\"place8\" ondrop=\"\
  drop(this, event);\" ondragenter=\"return false;\" ondragover=\"return false;\"\
  ></div>\n<div id=\"place9\" ondrop=\"drop(this, event);\" ondragenter=\"return false;\"\
  \ ondragover=\"return false;\"></div>\n<div id=\"place10\" ondrop=\"drop(this, event);\"\
  \ ondragenter=\"return false;\" ondragover=\"return false;\"></div>\n<div id=\"\
  place11\" ondrop=\"drop(this, event);\" ondragenter=\"return false;\" ondragover=\"\
  return false;\"></div>\n<div id=\"place12\" ondrop=\"drop(this, event);\" ondragenter=\"\
  return false;\" ondragover=\"return false;\"></div>\n```\n\n4. 将脚本添加到页面底部，紧接 `<body>`\
  \ 元素上方：\n\n```html\n<script src=\"drag-and-drop-puzzle.js\"></script>\n```\n\n5.\
  \ 打开脚本并对 iOS 操作系统进行检查，因为你需要一个单独的函数让它工作：\n\n```javascript\nvar iOS = !!navigator.userAgent.match('iPhone\
  \ OS') || !!navigator.userAgent.match('iPad');\n```\n\n6. 设置一些变量，并创建你的拼图碎片数组：\n\n\
  ```javascript\nvar images = [];\nvar piece = \"\";\nvar place = \"\";\nfor (i=0;\
  \ i<12; i++) {\n    j = i+1;\n    images[i] = \"puzzle-piece\" + j + \".png\";\n\
  }\n```\n\n7. 随机化碎片：\n\n```javascript\nimages.sort(function() {return 0.5 - Math.random()});\n\
  ```\n\n8. 循环遍历图片并将显示在页面上：\n\n```javascript\nfor (i=0; i<12; i++) {\n    $('#pieces').append(\"\
  <img src=/examples/images/\"+images[i]+\" id=\"+i+\" draggable=true ondragstart=\\\
  \"drag(this, event)\\\">\");\n}\n```\n\n9. 构建 iOS 对象和放置区域：\n\n```javascript\nif\
  \ (iOS) {\n    piece = \"piece\"+i;\n    place = \"place\"+i;\n    $(\"#piece\"\
  +i).css('float','left');\n    new webkit_draggable(piece, {revert : false, scroll\
  \ : true});\n    webkit_drop.add(place, {onDrop : function() {\n        $(\"#place\"\
  +i).append(piece);\n    }});\n}\n```\n\n10. 结束 `for` 循环。\n\n11. 添加 `drag` 函数：\n\n\
  ```javascript\nfunction drag(draggableitem, e) {\n    e.dataTransfer.setData(\"\
  Text\", draggableitem.id);\n}\n```\n\n12. 添加 `drop` 函数：\n\n```javascript\nfunction\
  \ drop(target, e) {\n    var id = e.dataTransfer.getData('Text');\n    target.appendChild(document.getElementById(id));\n\
  \    e.preventDefault();\n}\n```\n\n13. 为文档添加样式：\n\n```css\nbody { width: 85em;\
  \ }\n[draggable=true] {\n    -khtml-user-drag: element;\n    -webkit-user-drag:\
  \ element;\n    -webkit-user-select: none;\n    -khtml-user-select: none;\n    -moz-user-select:\
  \ none;\n    -o-user-select: none;\n    user-select: none;\n}\n#frameHolder {\n\
  \    width: 61em;\n    float: left;\n}\n#puzzle-frame {\n    border: solid black\
  \ 0.3em;\n    width: 60em;\n    height: 80em;\n}\n#puzzle-frame > div {\n    width:\
  \ 20em;\n    height: 20em;\n    float: left;\n}\n#pieces {\n    width: 20em;\n \
  \   float: left;\n    margin-right: 0.5em;\n}\n```\n\n你可以在 [www.html5in24hours.com/examples/drag-and-drop-puzzle.html](http://www.html5in24hours.com/examples/drag-and-drop-puzzle.html)\
  \ 查看此拼图的运行。\n\n注意的是，在移动设备上碎片不会像电脑那样吸附到位置。\n\n在 iOS 上不支持 `draggable` 函数看起来有效。相反，你必须为元素绑定\
  \ `touchStart`、`touchMove` 和 `touchEnd` 事件。iOS 设备将使用拖放元素的当前位置以及放置区域来判断元素是否放置在正确的位置。\n\
  \n你可以使用的库位于 GotProject ([www.gotproject.com/blog/post2.html](http://www.gotproject.com/blog/post2.html))。这是一个为\
  \ iOS 设备构建拖放界面的开源库。\n\n该库提供了三个新的 API：\n\n- `webkit_draggable()` 使元素变为可拖拽\n- `webkit_drop.add()`\
  \ 和 `webkit_drop.remove()` 添加和移除放置区域\n- `webkit_click()` 为可拖拽元素添加点击事件\n\n#### 在\
  \ iOS 中使元素可拖拽\n\n在 iOS 中实现拖放的第一步是通过将元素添加到 `webkit_draggable()` 方法中使其变为可拖拽：\n\n```javascript\n\
  var draggableItem = new webkit_draggable('id of draggable item', { options } );\n\
  ```\n\n你可以为该项目设置一些选项：\n\n\n\n\n\n- `revert`—这是一个布尔选项，如果设置为 `true`，则除非可移动元素被成功拖动到有效的放置区域外，否则它将返回到其起始位置。你也可以将其设置为\
  \ `always`，使得元素即使在成功放置后始终返回原位。默认值为 `false`。\n\n- `scroll`—如果此设置为 `true`，当可移动元素到达边缘时，它将导致窗口滚动。默认值为\
  \ `false`。\n\n- `onStart`—此函数应在拖拽事件开始时运行。\n\n- `onEnd`—此函数应在拖拽事件结束时运行。\n\n- `handle`—这是作为拖动句的元素\
  \ ID，用于拖动该元素。\n\n然后你可以使用 `set()` 方法更改可移动项的属性：\n\n```javascript\ndraggableItem.set(scroll:\
  \ true);\n```\n\n### 在 iOS 中将元素制作放置区域\n\n在 iOS 中要将元素制作放置区域，你需要使用 `webkit_drop.add()`\
  \ 方法：\n\n```javascript\nwebkit_drop.add('id of drop zone, { options }');\n```\n\n\
  你可以为放置区域添加多个选项：\n\n- `accept`—放置区域将接受的类数组。如果留空，则将接受所有类。\n\n- `hoverClass`—当可移动元素悬停在放置区域上时，该区域将拥有的类。\n\
  \n- `onDrop`—当放置事件触发时运行的函数。\n\n- `onOver`—当可移动元素带到放置区域上方时运行的函数。\n\n- `onOut`—当可移动元素移出放置区域时运行的函数。\n\
  \n***\n\n### 动手尝试：为 iPhone 或 iPad 构建拖放页面\n\n在 iOS 设备上包含拖放功能对于许多 Web 应用非常重要，这个“动手尝试”将向你展示如何实现它，即使没有\
  \ HTML5。\n\n1. 从 [www.gotproject.com/blog/files/dragdrop/webkitdragdrop.js](http://www.gotproject.com/blog/files/dragdrop/webkitdragdrop.js)\
  \ 下载 GotProject webkit 拖放库。\n\n2. 将脚本添加到你的网页中：\n\n```html\n<!DOCTYPE HTML>\n<html\n\
  <head>\n<meta charset=\"UTF-8\">\n<title>Drag-and-Drop Examples - on iOS</title>\n\
  <script src=\"webkitdragdrop.js\"></script>\n</head>\n```\n\n3. 关闭文档的 `<head>` 并开始\
  \ `<body>` 文本：\n\n```html\n</head>\n<body>\n<h1>Drag-and-Drop Examples&#8212;on\
  \ iOS</h1>\n```\n\n4. 添加一个可以拖动的框：\n\n```html\n<div id=\"redbox\" draggable=true></div>\n\
  ```\n\n5. 为框设置样式使其显示在页面上：\n\n```html\n<div class=\"width: 15em; height: 15em; background-color:\
  \ red;\" id=\"redbox\" draggable=true>\n</>\n```\n\n6. 添加并设置你的放置区域框：\n\n```html\n\
  <div id=\"redboxtarget\" style=\"width: 25em; height: 25em; border: dashed thin\
  \ red;\" dropzone=\"move\">\n<p>Drop Here</p>\n</div>\n```\n\n7. 添加一个 `<script>`\
  \ 元素：\n\n```html\n<script>\n</script>\n```\n\n8. 在 `<script>` 元素内部，添加拖放选项：\n\n```javascript\n\
  <script>\nvar redBox = new webkit_draggable('redbox', {revert : false} );\nwebkit_drop.add('redboxtarget');\n\
  </script>\n```\n\n9. 关闭你的 HTML。\n\n```html\n</body>\n</html>\n```\n\n你可以在 [www.html5in24hours.com/examples/drag-and-drop-examples-ios.html](http://www.html5in24hours.com/examples/drag-and-drop-examples-ios.html)\
  \ 查看此拖放操作的示例。\n\n***\n\n#### 总结\n\nHTML5 中的拖放功能是复杂的。有很多点需要记住。在这一小时里，你学习了事件、属性以及\
  \ `dataTransfer` 对象。你还学习了如何在桌面浏览器和 iOS 中都创建拖放操作，尽管 iOS 并不支持 HTML5 拖放技术。\n\n### 问答\n\
  \n**问：对于我的应用程序，我需要知道被拖动的元素落在了放置区域的哪个位置，就像在图像映射中获取点击坐标一样。这可能吗？**\n\n**答：你可以使用 `event.clientX`\
  \ 和 `event.clientY` 来报告坐标。例如：**\n\n```html\n<div id=\"dropZone\" dropzone=\"copy\"\
  \ ondrop=\"getCoords(event);\" ondragenter=\"return false;\" ondragover=\"return\
  \ false;\"></</div>\n```\n\n```javascript\n<script>\nfunction getCoords(e){\n  \
  \  alert(\n        \"clientX value: \" + e.clientX + \"\\n\"\n        + \"clientY\
  \ value: \" + e.clientY + \"\\n\"\n    );\n}\n</script>\n```\n\n**问：使用 HTML5 拖放文件是真的吗？**\n\
  \n**答：是的，这是真的。通过 HTML5 你可以拖放文件。**\n\n\n\n\n\n# HTML 元素\n\n- `<area>`—作为图像映射链接到其他文档。它定义了图像中一个可点击的区域，当点击该区域时，浏览器会打开新文档。\n\
  - `<link>`—链接到当前文档要使用或引用的其他文档。该元素常用于引用样式表，例如 `<link rel=\"stylesheet\" href=\"styles.css\"\
  >`。\n\n在大多数情况下，`<link>` 元素要么用于程序化处理（例如浏览器在看到样式表链接时如何加载样式表），要么用于信息性目的（例如当链接提供备用文档时）。\n\
  \n## `<a>` 属性的更改\n\nHTML5 对 `<a>` 元素的属性进行了一些改动：\n\n- `name` 属性现在已过时。如果你仍然喜欢，仍然可以使用它，但使用\
  \ `id` 属性来命名特定的锚点或超链接会更好。\n- `target` 属性不再被废弃。虽然框架（frames）已不再是 HTML5 规范的一部分，但 `iframes`\
  \ 仍然是，并且你可以使用 `target` 属性引用特定的 `iframes` 或窗口。\n- HTML5 还添加了 `media` 属性，用于通过媒体查询指示链接文档适用于哪些设备或媒体。\n\
  \n如果你想在之前的 HTML 版本中在网页上创建目录，你需要编写一个带有 `name` 的占位符链接，指向你文档中想要跳转的位置：\n\n```html\n\
  <a name=\"block\"></a>\n```\n\n然后你将使用带有哈希标记（hash tag）的链接到该位置：\n\n```html\n<a href=\"\
  #block\">链接块级元素</a>\n```\n\n但现代网页浏览器将 `id` 属性视为唯一标识符，因此你可以直接指向它们，而完全无需使用 `<a name>`\
  \ 元素：\n\n```html\n<a href=\"#block\">链接块级元素</a>\n<h2 id=\"block\">链接块级元素</h2>\n\
  ```\n\n> **注意！**：ID 在文档中应该是唯一的\n\n许多初学者 Web 开发者犯错的地方之一是使用 `id` 属性。该属性值在当前文档中应该是唯一的。如果不是唯一的，且你链接到一个非唯一的\
  \ ID，浏览器可能不会将你的用户带到你预期的位置。大多数浏览器将把用户带到重复 ID 的第一个实例。\n\n要理解 `target` 属性，你需要理解“浏览上下文”（browsing\
  \ context）这一术。这指的是内容所在的窗口或框架。它可以包括一个 `iframe`、通过脚本打开的新窗口或一个标准的浏览器窗口。`target` 属性对于链接到带有\
  \ `id` 的 `iframes` 以及其他浏览器窗口非常有用。你可以使用四个特殊关键字指向不同的窗口：\n\n- `_blank`—在全新的窗口（或标签页）中打开链接的文档\n\
  - `_self`—在当前窗口中打开链接的文档\n- `_parent`—在父浏览文中打开链接的文档\n- `_top`—在浏览上下文的顶层打开链接的文档\n\n\
  在大多数情况下，`_parent`、`_self` 和 `_top` 是同一个窗口，但通过 JavaScript 或 `iframes` 添加额外的浏览上下文是可能的。例如，你可以给\
  \ `iframe` 分配一个 `id`，然后通过目标链接更改其内部内容：\n\n```html\n<iframe src=\"simple-frame.html\"\
  \ id=\"simple\"></iframe>\n<p>这个 <a href=\"simple-frame.html#new\" target=\"simple\"\
  >链接</a>指向 `iframe` 文档中的某个位置。</p>\n```\n\n> **顺便说一下**：链接到命名框架或窗口中的任何文档\n\n当你使用 target\
  \ 链接到某些内容时，并不限于当前文档。当 target 指向一个不存在的 ID 时，将打开一个新窗口。\n\n## 链接块级元素\n\nHTML5 更改链接第一个地方是你可以用\
  \ `<a>` 元素包裹的内容。在 HTML 4 中，你不允许用链接包裹块级元素（如标题、段落或 `div`s）。如果你需要链接整个段落或标题以及周围的文本，你需要多次添加链接。\n\
  \n例如，在 HTML 4 中，为了将一个标题、一张图像和一段文本链接到同一个地方，你必须写写写：\n\n```html\n<h3><a href=\"garden.html\"\
  >来来看我们的新花园</a></h3>\n<a href=\"garden.html\"><img src=\"our-garden.jpg\" alt=\"\
  我们的新花园\"></a>\n<p><a href=\"garden.html\">我们的新花园非常漂亮，有很多花草和植物。来看看照片吧。</a></p>\n\
  ```\n\nHTML5 改变了这一点。现在你几乎可以通过用 `<a>` 元素包裹来链接任何内容。因此要在 HTML5 中编写该标题、图像和段落，你会写：\n\n\
  ```html\n<a href=\"garden.html\">\n  <h3>来来看我们的新花园</h3>\n  <img src=\"our-garden.jpg\"\
  \ alt=\"我们的新花园\">\n  <p>我们的新花园非常漂亮，有很多花草和植物。来看看照片吧。</p>\n</a>\n```\n\n> **你知道吗？**：曾有一个让所有内容都可链接的提案\n\
  \nHTML5 的一项提案是将 `href` 属性作为全局（或近全局）属性添加。该想法是，页面上显示的每个元素都可以是一个链接，添加 `href` 属性将使其变成链接。这个想法最终被拒绝了，因为它会降低页面的向后兼容性。然而，这是一个仍然经常出现的话题，也许有一天它会被添加到规范中。\n\
  \n这一变化反映了浏览器已经是如何实现链接的。浏览器已经支持这种链接方式。此更改产生的唯一影响是验证你的 HTML。以前，如果你验证一个像这样编写的页面，它会返回无效，但现在它是正确的。\n\
  \n## 占位符链接\n\n如 第 2 小时 所，““带有移动开发的新 HTML5 标签和属性](#ch02.html_ch02)”所述，HTML5 链接的另一个更改是创建了占位符链接。这些\
  \ `<a>` 元素没有 `href` 属性。它们通常用作尚未指向页面的链接的占位符，例如在设计稿中。\n\n> **注意！**：链接伪类在占位符链接上并不总是有效\n\
  \n当你为占位符链接样式时，`:link` 和 `:visited` 伪类将不起作用。这是很合理的，因为这两个类都需要先有一个可以链接或访问的 URL 才能生效。\n\
  \n在 HTML5 之前，`<a>` 元素需要 `href` 属性，因此为了制作占位符链接，大多数 Web 开发者会使用空的 `href` 或通过 `<a href=\"\
  #\">`指向同一页面。然而，空的 `href` 是无效的，它会让链接产生奇怪的行为，而指向哈希符号会在页面刷新时让用户困惑。占位符链接是不可点击的，但你可以通过专门对\
  \ `<a>` 元素设置样式（不使用任何伪类），使其看起来与网页上的其他链接一样。\n\n## HTML5 中的图像映射\n\nHTML5 仍然通过使用 `<map>`\
  \ 和 `<area>` 元素支持图像映射。`<map>` 元素没有显著变化，但 `<area>` 元素已更新，使其类似于 `<a>` 元素。\n\n在之前的\
  \ HTML 版本中，`<area>` 元素作为超链接的功能有些受限，因为它没有与 `<a>` 元素相同的属性。然而，HTML5 为 `<area>` 元素添加了以下属性：\n\
  \n- `rel`—此属性指示链接文档与当前文档的关系。\n- `media`—与 `<a>` 元素一样，此属性增加了媒体查询，指示链接文档适用于哪些媒体。\n\
  - `hreflang`—添加此属性是为了让你声明链接文档的语言。\n\n## HTML5 中的新全局属性\n\nHTML5 添加了一些新的全局属性，对链接特别有用：\n\
  \n- `hidden`—指示该元素尚未相关或不再相关。\n- `contextmenu`—为元素添加右键菜单（通常通过替代点击或右键操作访问）。\n\n\n\n\
  \n\n你可以使用 `hidden` 属性来隐藏页面中不相关的链接。这在维护大型链接库时非常有用，因为并不是每个链接在每个页面上都是相关的。你可以生成该链接库，然后使用脚本隐藏不相关的链接。图\
  \ 17.1 显示了以下 HTML 在 Chrome 中如何渲染的示例：\n\n```html\n<<ul>\n    <li><a href=\"/\">Home</a></li>\n\
  \    <li><a href=\"/category/examples/\">Examples</a></li>\n    <li><a href=\"/examples/\"\
  \ hidden>More Examples</a></li>\n</ul>\n```\n\n**图 17.1.** 在 Chrome 中显示的包含一个**隐藏**链接的列表。\n\
  \n![image](img/17fig01.jpg)\n\n使用此属性时要小心，因为 Safari 或 Firefox 不支持它，除非你为带有该属性的元素添加了\
  \ `display:none;` 样式。例如：\n\n```css\n[hidden] { display: none; }\n```\n\n`contextmenu`\
  \ 属性为 `<a>` 元素添加一个下拉菜单，该菜单可以在用户右键点击链接时出现。这使得 Web 应用程序运行更像桌面应用程序。此属性使用 `<menu>` 和\
  \ `<command>` 元素创建一个菜单，该菜单在激活上下文菜单（通常通过右键点击或选项点击）之前是隐藏的：\n\n```html\n<p><a href=\"\
  #attribs\" contextmenu=\"test-menu\">此链接有一个上下文菜单</a>\n<menu id=\"test-menu\">\n\
  \    <command label=\"Home\" onclick=\"window.location = '/'\">\n    <command label=\"\
  Examples\" onclick=\"window.location = '/category/examples/'\">\n</menu>\n```\n\n\
  该属性的问题在于，任何网络浏览器或用户代理都不支持它，而且在任何测试版本中似乎都没有发生变化。\n\n#### 链接类型与关系\n\nHTML5 链接包含的不只是超链接。虽然\
  \ `<link>` 元素没有发生太大变化，但这些链接的一个方面发生了很大变化：链接关系。\n\n你通过 `rel` 属性定义链接关系（同时针对超链接和外部文档链接）。你应该注意，`rev`\
  \ 属性在 HTML5 中已经过时了，部分原因是因为使用它的大多数 Web 开发人员使用方法不正确，而我们其他人根本没有使用它。相反，你应该使用具有相反类型的\
  \ `rel` 属性；例如，`prev` 和 `next` 就是相反的类型。\n\n不同的链接类型如下：\n\n- `alternate`——当前文档的备用表示\n\
  - `author`——指向当前文档作者的链接\n- `bookmark`——指向最近祖先节的永久链接（permalink）\n- `external`——指向不属于同一网站的链接\n\
  - `help`——指向上下文相关帮助的链接\n- `icon`——指向图标或收藏图标（favicon）的链接\n- `license`——指向文档版权许可的链接\n\
  - `next`——指向系列中下一个文档的链接\n- `nofollow`——表示该链接未获得当前文档作者的认可\n- `noreferrer`——告诉用户代理在用户跟随链接时不要发送\
  \ HTTP Referer 头部\n- `pingback`——当前文档的 pingback 服务器地址\n- `prefetch`——指示一个应该提前下载的文档\n\
  - `prev`——指向系列中上一个文档的链接\n- `search`——指向搜索当前文档及相关页面的链接\n- `sidebar`——指向意图在浏览器侧边栏中显示的文档\n\
  - `stylesheet`——指向要导入的样式表的链接\n- `tag`——指向适用于当前文档的标签地址的链接\n\n表 17.1 显示了不同类型与 `<a>`、`<area>`\
  \ 和 `<link>` 元素的关系。\n\n**表 17.1.** 链接类型及其对链接元素的影响\n\n![image](img/17tab01.jpg)\n\
  \n#### 使用新的链接类型\n\n许多 Web 开发人员从未使用 `rel` 属性来定义文档之间的关系，因为他们认为没有意义。尽管并不是所有的链接类型都得到了广泛支持，但其中某些类型提供了良好的信息，其使用频率比你想象的要多。\n\
  \n### 备用链接类型 (Alternate)\n\n`alternate` 链接类型是指示网站页面翻译的好方法。当与 `hreflang` 属性结合使用时，你可以为用户和搜索引擎提供网站结构的信息。例如，你通过以下代码链接页面的西班牙语版本：\n\
  \n```html\n<a href=\"http://es.html5in24hours.com/\" rel=\"alternate\" hreflang=\"\
  es\">\n```\n\n* * *\n\n**你知道吗**：Google 也支持 `canonical`（规范）类型\n\n尽管不是 HTML5 规范的一部分，但你也可以在链接时通过将其关系设置为\
  \ `canonical` 来将文档定义为页面的原始版本。例如，从西班牙语站点链接回英文站点，你会写：`<a href=\"http://www.html5in24hours.com/\"\
  \ rel=\"canonical\" hreflang=\"en\">`。\n\n* * *\n\n指示备用页面是非常重要的，因为许多搜索引擎会惩罚具有重复内容的网站。当你指示重复内容是有意作为备用方案时，搜索引擎会更加宽容。\n\
  \n你可以在文档中根据需要拥有多个 `<link rel=\"alternate\">` 链接，用于不同的语言和不同的格式（打印、音频等）。但请记住，链接越多，用户需要下载的内容就越多。\n\
  \n### 作者链接类型 (Author)\n\n你应该在任何文章的署名处放置 `author` 链接类型。如果你没有指向作者简介或作者电子邮件地址的链接，可以将\
  \ `<link>` 包含文档的 `<head>` 中。\n\n在作者链接中包含电子邮件地址不是一个好主意，因为这可能导致作者收到垃圾邮件。然而，Google\
  \ 和其他搜索引擎开始支持作者标记，以使用户能够连接到优秀内容的作者。要在你的页面上添加作者信息，你需要一个描述并识别作者的作者页面。然后你使用作者类型来标识该链接：\n\
  \n```html\n<a href=\"/bio/Jennifer-Kyrnin-5105.htm\" rel=\"author\">Jennifer Kyrnin</a>\n\
  ```\n\n### 书签与外部链接类型 (Bookmark and External)\n\n`bookmark` 和 `external` 链接类型识别关于页面或站点本身的链接。大多数博客使用\
  \ `bookmark` 类型来标识帖子或页面的永久链接。`external` 类型表示该链接是当前站点之外其他网站的链接。\n\n大多数浏览器对这些链接类型不做任何特殊处理。然而，为客户识别外部链接可能是很有用的。你还可以使用脚本通过此属性在新窗口打开外部链接。在\
  \ jQuery 中，只需为链接添加 `target=_blank` 属性即可：\n\n```javascript$(\"[rel=external]\").attr(\"\
  target\",\"_blank\");\n```\n\n### 帮助、许可、标签和搜索链接类型\n\n`help`、`license`、`tag` 和 `search`\
  \ 链接类型提供了关于页面的更多信息。这些类型没有被任何浏览器显式使用，但 Web 设计师可以使用它们在页面上提供更多信息。你将与其他链接类型相同的方式使用它们——通过为具有特定类型的链接添加\
  \ `type` 属性。例如，这里有一个搜索页面的链接：\n\n```html\n<a href=\"/search.htm\" rel=\"search\"\
  >搜索此站点</a>\n```\n\n* * *\n\n**注意！**：谨慎处理许可（Licenses）\n\n使用 `license` 类型时，记住你是在标识一个指向许可的**链接**，而不是描述页面本身的许可，这是重要的。大多数浏览器将此类型解释为整个页面的许可，而不仅仅是页面的特定部分。因此，如果你有其他页面元素（如图像）是在不同的许可下展示的，那么当机器看到这种链接类型时，这些信息将会丢失。使用\
  \ `rel=license` 属性保留最严格的许可是一项最佳实践。\n\n* * *\n\n#### 图标链接类型 (Icon)\n\n`icon` 链接类型被许多\
  \ Web 设计师用于向网页添加收藏图标或网站图标（favicon）。收藏图标随后被用于浏览器标签页、书签以及浏览器显示页面信息的地方。\n\n\n\n\n\n\
  您使用 `<link>` 元素链接图标：\n\n```html\n<link rel=\"icon\" href=\"/favicon.ico\">\n```\n\
  \n### 注意！请谨慎使用 `shortcuts` 关键字\n\nInternet Explorer 8 及更低版本要求在收藏夹图标链接中包含 `shortcuts`\
  \ 关键字：`<link rel=“shortcuts icon” href=“/favicon.ico”>`。这在技术上是不正确的，因为它创建了一个名为“shortcuts”的链接并指向图标。当你在\
  \ `<link>` 中添加类型“image/x-icon”时，即 `<link rel=“shortcuts icon” href=“/favicon.ico”\
  \ type=“image/x-icon”>`，IE9 即可正常工作。无论你的文件中是否有链接，大多数浏览器都会在 Web 服务器的根目录下查找名为 `favicon.ico`\
  \ 的文件。\n\n## Nofollow 和 Noreferrer 类型\n\n`nofollow` 类型告诉搜索引擎机器人不要跟踪该链接，或者即使跟踪了，也不要传递任何页面权重（page\
  \ rank）。然而，仅仅因为你在链接上添加了此属性，并不意味着搜索引擎找不到该页面。您应该在某些特定类型的链接上添加此属性：\n\n- **你不认可的内容**——尽管不包含你不认可的网站链接可能是更好的主意，但如果由于某些原因你必须允许这些链接（例如在评论或留言板条目中），为它们添加\
  \ `rel=nofollow` 表示它们不是你推荐的链接。\n- **付费链接**——广告应该始终应用 `rel=nofollow` 属性，因为大多数广告提供商对广告的自动点击有相关规定。\n\
  - **搜索引擎无法使用的页面**——搜索引擎无法登录或注册您的网站，因此在指向这些页面的链接上放置 `rel=nofollow` 有助于机器人更有效地爬取您的网站。\n\
  \n`noreferrer` 类型表示在点击链接时不应传递任何引用者（referrer）信息。如果您想隐藏发送到某些网站的链接（例如，如果您不想向广告网站发送您的引用者信息），那么此功能将非常有用。该类型在\
  \ Chrome、Opera 和 Safari 上有效。\n\n当可能通过引用者信息泄露隐私信息时，您应该使用 `noreferrer` 类型——例如，如果您运行一个约会网站或其他机密网站。此外，如果您链接到一个显示引用者数据的网站，您可能想要考虑阻止引用者数据。\n\
  \n您可以通过在 `rel` 属性中使用空格分隔多个类型来为一个链接添加多个类型，例如：\n\n```html\n<a href=\"http://spam.com\"\
  \ rel=\"nofollow noreferrer\">\n```\n\n## Pingback 类型\n\n`pingback` 类型提供了指向该页面 pingback\
  \ 服务器的链接。Pingback 服务器拥有接受 XML-RPC 连接的软件。Pingback 用于告诉一个网站另一个网站已经链接了它。\n\n您只能将此类型应用于\
  \ `<link>` 元素：\n\n```html\n<link rel=\"pingback\" href=\"pingback server\">\n```\n\
  \n## Prefetch 类型\n\n`prefetch` 链接类型告诉用户代理（浏览器），它应该提前下载链接的文档，因为用户将来可能需要它。预取的文档会在空闲时间下载。预取最适用于大型图像或文档，且这些内容位于通常在读者当前页面之后访问的页面上。\n\
  \n您只能将 prefetch 类型应用于 `<link>` 元素：\n\n```html\n<link rel=\"prefetch\" href=\"big-image.jpg\"\
  >\n```\n\n请记住，预取可能会让某些用户感到困扰，可能是因为他们的浏览器没有正确处理它，或者因为他们有流量费用。记住，大多数移动用户的服务套餐都有限制，预取他们从不使用的内容可能会消耗这些带宽。\n\
  \n## 上一个和下一个链接类型\n\n`prev` 和 `next` 链接类型定义了一个文档序列，例如目录中的顺序。大多数浏览器在您使用这些关系时不会执行任何操作，但它们可以帮助您为文档添加样式。只需使用特定的关系属性为链接设置样式，如下：\n\
  \n```css\n[rel=prev] { ... }\n```\n\nHTML 4 包含了序列中的其他几种关系，如 `start`、`index` 和 `contents`。这些关系没有专门包含在\
  \ HTML5 规范中，但如果您有代码预期或使用了它们，那么它们是可以使用的。\n\n## 侧边栏链接类型\n\n`sidebar` 链接类型目前仅支持 Firefox\
  \ 和 Opera。当 Firefox 用户点击带有 `rel=sidebar` 属性的链接时，它会在浏览器的侧边栏窗口中打开。图 17.2 显示了打开了侧边栏的\
  \ Firefox 页面。\n\n**图 17.2.** 在 Firefox 中打开了侧边栏的网页。\n\n![image](img/17fig02.jpg)\n\
  \nFirefox 以外的浏览器会将侧边栏链接作为标准 Web 页面打开。\n\n## Stylesheet 类型\n\n最常用的链接类型是 `rel=stylesheet`\
  \ 类型。它链接到一个样式表，供浏览器应用于网页。链接到外部样式表是简单的：\n\n```html\n<link rel=stylesheet href=styles.css>\n\
  ```\n\n#### 总结\n\nHTML5 对 `<a>` 元素进行了一些更改，使其更易使用，并符合浏览器已经显示的方式。在这一节中，您学习了现在可以链接块级元素，并可以使用空的\
  \ `<a>` 元素创建占位符链接。\n\n在链接方面，`<area>` 元素不再是二等公民。您学习了如何创建一个与标准 `<a>` 元素具有相同属性的图像映射。\n\
  \n您还学习了`<link>` 元素虽然没有重大变化，但现在有许多新的关系可以应用于它和其他链接元素上。这些关系使得您的页面更具语义化，并获得更多搜索引擎和浏览器的支持。\n\
  \n### 问答\n\n**Q. 您在列表中没有包含许多其他链接关系，例如版权、术语表、章节、附录等。它们在 Web 开发中处于什么位置？**\n\n**A.**\
  \ 我列出的关系是包含在 HTML5 规范中的关系。HTML 4 包含了另一组链接关系：\n\n- `alternate`\n- `appendix`\n- `bookmark`\n\
  - `chapter`\n- `contents`\n- `copyright`\n- `glossary`\n- `help`\n- `index`\n- `next`\n\
  - `prev`\n- `section`\n- `start`\n- `stylesheet`\n- `subsection`\n\n这些关系中的许多现在已使用语义化\
  \ HTML 定义，正如 第 9 节 “使用 HTML5 分节和语义化元素添加意义”所示。此外，它们中的大多数并没有被 Web 浏览器广泛支持。\n\n在适当的情况下这些关系是完全可以的，但严格的验证器可能会标记您的文档为无效。\n\
  \n**Q. 您提到 `name` 属性是过时的，那这意味着什么？**\n\n**A.** 在 HTML5 中，过时的特性是指可以使用但会触发验证器警告的功能。通常情况下，这意味着该功能正逐渐退出\
  \ HTML，W3C 建议不要使用。\n\n许多开发者已经习惯于使用 `<a name=>` 元素来定义跳转点，但这已不再需要。所有主流浏览器都识别 `id`\
  \ 属性为跳转点。因此，该属性的过期对您的页面设计产生没有任何影响。\n\n**Q. 当我点击标记为 rel=sidebar 属性的链接时，Firefox 和\
  \ Opera 要求我将其加入书签。为什么？**\n\nA. 这是 Firefox 和 Opera 支持侧边栏关系的方式。您添加一个勾选了侧边栏选项的书签，当您点击该书签时，它会在侧边栏中打开，而不是主浏览器窗口。您可以将任何书签设置为侧边栏书签。\n\
  \n### 练习\n\n练习包含练习题，帮助您处理本章学的知识。在阅读答案之前，尝试回答所有问题。答案见 附录 A，“练习题答案](#app01.html_app01)。”\n\
  \n#### 练习题\n\n**[1]. 添加 `<a>` 元素的新属性是什么？它有什么用途？**\n\n\n\n\n\n## 2.. 你编写什么可以使 `iframe`\
  \ 内部的链接在容器文档中打开？\n\n## 3.. 图像地图是如何变得更像标准的 `<a>` 链接的？\n\n## 4.. 你什么时候应该使用 `rel=nofollow`\
  \ 属性？\n\n### 练习题\n\n**1.** 为特定的媒体类型（如平板电脑或智能手机）构建一个页面，然后使用 `media` 属性和媒体查询创建该页面的链接，就像你在第\
  \ 4 小节 中学到的“检测移动设备和 HTML5 支持”那样。\n\n**2.** 为你网站上的所有作者构建作者页面，然后为他们添加作者链接。你可以使用富媒体摘要测试工具（Rich\
  \ Snippets Testing Tool）查看 Google 如何看待你的作者之间的关系：[www.google.com/webmasters/tools/richsnippets](http://www.google.com/webmasters/tools/richsnippets)。\n\
  \n### 第三部分：用于移动和 Web 应用的 HTML5\n\n## 第 18 小节：Web 应用 API 和数据集\n\n***本节你将学到：***\n\n\
  • 什么是 Web 应用和 API\n• Web 应用程序是如何改变 Web 的\n• 构成 HTML5 Web 应用的 API\n• 如何使用 `data-*`\
  \ 属性访问 Web 应用中的自定义数据\n\n脚本和编程是将网页转变为 Web 应用的关键。HTML5 有一些特定的 API 可以帮助你创建更交互性的应用程序。在本节中，你将更多地学习这些\
  \ API 以及如何在你的 HTML5 应用中使用它们。\n\nHTML5 还引入了一种在你的元素中包含自定义数据的新方法——数据集。本节将涵盖如何使用数据集和\
  \ `data-*` 属性创建使用自定义数据的应用程序。\n\n#### 创建 Web 应用\n\nWeb 应用运行在 Web 浏览器内部。它们像任何其他网页一样使用\
  \ HTML、CSS 和 JavaScript。然而，它们具有某些特性，使得它们更像桌面应用程序而不是网页，包括：\n\n• Web 应用程序使用脚本与用户交互。\n\
  • 功能保持在同一个窗口或屏幕中，而不是重新加载到新屏幕。\n• 界面控件在用户与其交互时改变屏幕的局部。\n• 用户交互是一个至关重要的部分——应用程序为用户提供的不仅仅是阅读文档的能力。\n\
  \n#### Web 应用 API\n\nAPI（应用程序编程接口）是一份关于如何编写不同程序的指令列表。Web 应用 API 是支持给定 API 的 JavaScript\
  \ 方法和函数。\n\n现代 Web 应用使用开放 Web 标准（Open Web Standard，包括 HTML5）来创建与桌面版一样功能强大的健壮应用程序。\n\
  \n开放 Web 标准包含许多许多 Web 应用 API，包括：\n\n• **脚本 (Scripting)**——这些机制导致代码在文档环境中运行。\n• **定时器\
  \ (Timers)**——你使用 `setTimeout()` 和 `setInterval()` 方法调度基于定时器的回调函数。\n• **用户提示 (User\
  \ prompts)**——这些是对话框和打印方法，允许应用程序与用户通信。\n• **系统信息**——这是应用程序可以使用的客户端信息，例如浏览器名称和版本。\n\
  \n### 脚本\n\n脚本是 Web 应用的重要组成部分，因为它是 Web 应用与用户交互的方式。脚本可以通过多种方式触发，包括：\n\n• 处理 `<script>`\
  \ 元素\n• 内联 `javascript:()` URL\n• 事件处理器\n• 使用具有自身脚本特性的 SVG 等技术\n\n有很多事件处理器可以供你的\
  \ Web 应用中使用。\n\n以下是可以放在所有 HTML 元素上的事件处理器：\n\n• `onabort`\n- `oncanplay`\n- `oncanplaythrough`\n\
  - `onchange`\n- `onclick`\n- `oncontextmenu`\n- `ondblclick`\n- `ondrag`\n- `ondragend`\n\
  - `ondragenter`\n- `ondragleave`\n- `ondragover`\n- `ondragstart`\n- `ondrop`\n\
  - `ondurationchange`\n- `onemptied`\n- `onended`\n- `onformchange`\n- `onforminput`\n\
  - `oninput`\n- `oninvalid`\n- `onkeydown`\n- `onkeypress`\n- `onkeyup`\n- `onloadeddata`\n\
  - `onloadedmetadata`\n- `onloadstart`\n- `onmousedown`\n- `onmousemove`\n- `onmouseout`\n\
  - `onmouseover`\n- `onmouseup`\n- `onmousewheel`\n- `onpause`\n- `onplay`\n- `onplaying`\n\
  - `onprogress`\n- `onratechange`\n- `onreadystatechange`\n- `onscroll`\n- `onseeked`\n\
  - `onseeking`\n- `onselect`\n- `onshow`\n- `onstalled`\n- `onsubmit`\n- `onsuspend`\n\
  - `ontimeupdate`\n- `onvolumechange`\n- `onwaiting`\n\n以下是可以放在除 `<body>` 之外的所有 HTML\
  \ 元素上的事件处理器：\n\n• `onblur`\n- `onerror`\n- `onfocus`\n- `onload`\n\n以下是可以放在如 `<body>`\
  \ 和 `<frameset>` 等 Window 对象上的事件处理器：\n\n• `onafterprint`\n- `onbeforeprint`\n- `onbeforeunload`\n\
  - `onblur`\n- `onerror`\n- `onfocus`\n- `onhashchange`\n- `onload`\n- `onmessage`\n\
  - `online`\n- `pagehide`\n- `pageshow`\n- `popstate`\n- `redo`\n- `resize`\n- `storage`\n\
  - `undo`\n- `unload`\n\n脚本是 Web 应用的重要部分，因为它是 Web 应用与用户交互的方式。脚本可以通过多种方式触发，包括：\n\n\
  • 处理 `<script>` 元素\n• 内联 `javascript:()` URL\n• 事件处理器\n• 使用如 SVG 等具有自身脚本特性的技术\n\n\
  有很多事件处理器可以供你的 Web 应用中使用。\n\n正如你在第 16 小节 中学到的，HTML5 增加了许多用于处理视频和音频的事件，例如 `oncanplay`\n\
  - `oncanplaythrough`\n- `ondurationchange`\n- `onemptied`\n- `onended`\n- `onloadeddata`\n\
  - `onloadedmetadata`\n- `onloadstart`\n- `onpause`\n- `onplaying`\n- `onprogress`\n\
  - `onratechange`\n- `onseeked`\n- `onseeking`\n- `onstalled`\n- `onsuspend`\n- `ontimeupdate`\n\
  - `onvolumechange`\n- `onwaiting`\n\n其他新的事件处理器响应用户的操作，例如 `onabort`、`oncontextmenu`\
  \ 和 `onshow`。\n\nHTML5 增加了许多新的拖放事件，例如 `ondrag`\n- `ondragend`\n- `ondragenter`\n\
  - `ondragleave`\n- `ondragover`\n- `ondragstart`\n- `ondrop`。\n\n还有一个错误事件：`onerror`，以及当表单提交不符合有效性约束时的事件：`oninvalid`。\n\
  \n#### iOS 的点击方式不同\n\n如果你正在创建一个使用脚本 API `onclick` 事件来触发操作的应用程序，你需要稍微修改你的脚本以处理 iOS。这是因为\
  \ iOS 不立即注册点击事件——存在延迟。它会立即注册触摸事件。\n\n为了解决这个问题，你可以使用如 jTouch（[www.jqtouch.com/](http://www.jqtouch.com/））之类的框架，或者可以在脚本中添加触摸处理器。这是一个你可以用于在\
  \ iOS 设备上将点击转换为的 jQuery 函数：\n\n```javascript\nfunction iosClicks() {\n  var iOS\
  \ = !!navigator.userAgent.match('iPhone OS') ||\n  navigator.userAgent.match('iPad');\n\
  \  if (iOS) {\n    ('[onclick]').each(function() {\n      var onclick = $(this).attr('onclick');\n\
  \      $(this).removeAttr('onclick'); // 移除 onclick 属性\n      $(this).bind(\"click\"\
  , function(e) {\n        e.preventDefault;\n      }); // 防止点击默认操作\n      $(this).bind('tap',\
  \ onclick); // 将触摸转换为点击\n    });\n  }\n}\n```\n\n#### 定时器\n\n定时器经常用于应用程序中以设置超时函数并定期运行函数。有几种方法可供使用：\n\
  \n• **`setTimeout()`**——该方法设置在一段时间后（毫秒）运行的 JavaScript 表达式。\n\n\n\n\n\n- `setInterval()`—类似于\
  \ `setTimeOut`，该方法设置一个时间（毫秒），在此时间后执行 JavaScript 表达式。区别在于，`setInterval` 在执行后会重新启动计时器以循环执行该表达式。\n\
  - `clearTimeout()`—此方法在时间到达之前取消定时表达式。\n- `clearInterval()`—此方法取消 `setInterval` 方法。\n\
  \n***\n\n### 动手实践：编写一个循环变换背景色的脚本\n\n此脚本将结合使用你可能已经熟悉的 `onclick` 事件处理程序和 `setInterval()`\
  \ 方法来更改 `div` 的背景颜色。\n\n**1.** 在编辑器中打开一个 HTML 文档，并在 `body` 中添加一个 `div`：\n\n```html\n\
  <div id=\"changeColorBox\">\n<p>在你点击 &#8220;开始&#8221;后，此框的背景颜色每隔 2 秒改变一次</p>\n</div>\n\
  ```\n\n**2.** 在文档的 `head` 部分为该 `div` 设置一些样式：\n\n```css\n#changeColorBox {\n    width:\
  \ 20em;\n    height: 20em;\n    padding: 0.25em;\n    border: solid black 0.1em;\n\
  }\n```\n\n**3.** 在 `div` 下方添加一个开始按钮和一个停止按钮：\n\n```html\n<button onclick=\"changeColor();\"\
  >Start</button>\n<button onclick=\"stopColorChange();\">Stop</button>\n```\n\n这两个按钮都有一个指向两个脚本运行的\
  \ `onclick` 事件处理程序。\n\n**4.** 在 HTML 的底部添加你的 `<script>` 元素：\n\n```html\n<script>\n\
  </script>\n```\n\n**5.** 在 `script` 元素内部，添加一个变量来保存你的间隔计时器：\n\n```javascript\nvar\
  \ intervalTimer;\n```\n\n**6.** 编写 `changeColor()` 函数：\n\n```javascript\nfunction\
  \ changeColor() {\n    intervalTimer = setInterval(bgColorChange, 2000);\n}\n```\n\
  \n这设置了每隔 2,000 毫秒运行一次 `bgColorChange` 函数。\n\n**7.** 编写 `stopColorChange()` 函数：\n\
  \n```javascript\nfunction stopColorChange() {\n    clearInterval(intervalTimer);\n\
  }\n```\n\n当点击“停止”按钮时，它会关闭颜色切换。\n\n**8.** 编写 `bgColorChange()` 函数：\n\n```javascript\n\
  function bgColorChange() {\n    var box = document.getElementById(\"changeColorBox\"\
  );\n    if (box.style.backgroundColor == 'red') {\n        box.style.backgroundColor\
  \ = 'orange';\n        box.style.color = 'black';\n    } else {\n        box.style.backgroundColor\
  \ = 'red';\n        box.style.color = 'white';\n    }\n}\n```\n\n你可以在 [www.html5in24hours.com/examples/timer-example.html](http://www.html5in24hours.com/examples/timer-example.html)\
  \ 查看此脚本的示例。\n\n***\n\n### 用户提示 (User Prompts)\n\n用户提示是与应用程序用户通信的一种方式。在网页中你有三种执行用户提示的方法：\n\
  \n- 简单提示\n- 打印\n- 模态对话框\n\n简单提示由用户代理本身生成，可以提供简单的信息（真/假或对一个问题的回答）。三个简单提示是：\n\n- `window.alert(message)`—此提示仅向用户显示消息并等待其将其关闭。\n\
  - `result = window.confirm(message)`—此提示要求用户确认或取消给的消息。如果用户点击“确定”，则返回 `true`；如果点击“取消”，则返回\
  \ `false`。\n- `result = window.prompt(message [, default])`—此提示显示带有文本框的消息，供用户输入回复。如果用户取消了提示，则返回\
  \ `null`。如果包含了 `default` 消息，则该值将作为默认答案（在回复框中），用户可以接受它或更改它。\n\n图 18.1 显示了在 iPad 上显示的这三种类型的提示。\n\
  \n**图 18.1.** iPad 上的三个简单提示。\n\n![image](img/18fig01.jpg)\n\n打印是许多 Web 应用程序开发者忘记的一种用户提示，但即使在平板和智能手机设备上这也是一种可能。调用\
  \ `window.print()` 方法会运行打印当前页的步骤。\n\n最有趣的用户提示类型是模态对话框。此框会在新窗口中打开一个单独页面。这使得 Web 应用程序的行为更像桌面应用程序。\n\
  \n***\n\n#### 注意！模态对话框在移动端并不好用\n\n移动设备对模态对话框的支持有限。如果你打算使用模态对话框，你需要在 Opera 和移动设备上以其他方式显示其中的信息。\n\
  \n***\n\n***\n\n### 动手实践：构建一个模态对话框\n\n绝大多数模态对话框是作为独立的网页构建的。正如这个动手实践示例所示，你随后通过脚本调用对话框。\n\
  \n**1.** 构建你的第一个网页，它将加载模态对话框：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta\
  \ charset=\"utf-8\">\n<title>方案估算</title>\n</head>\n<body>\n<h1>方案估算</h1>\n<p>完成所需的小时：<input\
  \ id=hours readonly>\n<button onclick=\"return calcHours();\">Calculate</button>\n\
  </body>\n</html>\n```\n\n**2.** 添加用于调用模态对话框的脚本：\n\n```html\n<script>\nfunction calcHours()\
  \ {\n    returnValue = window.showModalDialog('modal-hours.html');\n    var hours\
  \ = document.getElementById('hours');\n    hours.value = returnValue;\n}\n</script>\n\
  ```\n\n**3.** 为你的模态对话框构建第二个页面：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta\
  \ charset=\"UTF-8\">\n<title>模态</title>\n<script>\nfunction hours() {\n    var text\
  \ = document.getElementById(\"text\");\n    window.returnValue=text.value;\n   \
  \ window.close();\n}\n</script>\n</head>\n<body>\n估算小时：<input type=text id=text><br>\n\
  <input type=button value=\"close\" onclick=\"return hours();\">\n</body>\n</html>\n\
  ```\n\n你可以在 [www.html5in24hours.com/examples/modaldialog-examples.html](http://www.html5in24hours.com/examples/modaldialog-examples.html)\
  \ 查看模态对话框的运行效果。\n\n***\n\n### 系统信息\n\n本节涵盖的 Web 应用程序 API 最后方面是系统信息。你可以通过四种方法收集有关浏览器的信息：\n\
  \n- `window.navigator.appName`—返回浏览器名称\n- `window.navigator.appVersion`—返回浏览器版本\n\
  - `window.navigator.platform`—返回平台名称\n- `window.navigator.userAgent`—返回完整的用户代理处理程序\n\
  \n你可以直接在 HTML 中显示系统信息：\n\n```html\n<h1>收集系统信息</h1>\n<p>你正在使用：</p>\n<p id=\"browser\"\
  ><strong>浏览器：</strong></p>\n<p id=\"version\"><strong>版本：</strong></p>\n<p id=\"\
  platform\"><strong>平台：</strong></p>\n<p id=\"uaHandler\"><strong>完整用户代理：</strong><br></p>\n\
  ```\n\n```javascript\n<script>\n$(document).ready(function(){\n    var browser =\
  \ window.navigator.appName;\n    var version = window.navigator.appVersion;\n  \
  \  var platform = window.navigator.platform;\n    var uahandler = window.navigator.userAgent;\n\
  \n    $(\"#browser\").append(browser);\n    $(\"#version\").append(version);\n \
  \   $(\"#platform\").append(platform);\n    $(\"#uaHandler\").append(uahandler);\n\
  });\n</script>\n```\n\n你可以在 [www.html5in24hours.com/examples/system-information-examples.html](http://www.html5in24hours.com/examples/system-information-examples.html)\
  \ 查看此脚本的运行效果。\n\n***\n\n#### 顺便说，“浏览器嗅探”仍然不是好主意\n\n测试兼容性的旧方法是使用某些系统信息方法为不同的浏览器显示不同的功能。然而，测试当前浏览器是否支持你正在使用的技术会让你的网站更易维护。浏览器嗅探要求你对每个浏览器的功能保持\
  \ 100% 的更新。相反，可以将系统信息用于应用程序设计中的非关键元素，或者使用第 4 节中提到的“检测移动设备和 HTML5 支持”中的 Modernizr.js\
  \ 等工具。\n\n***\n\n### 数据集 (Datasets) 与 `data-*` 属性\n\n自定义数据属性是 HTML5 的新功能，可以极大地帮助你的\
  \ Web 应用程序。\n\n任何以 `data-` 开头的属性都被视为用户不可见数据的存储区域。这些数据不会影响页面的布局或呈现，但浏览器可以使用它们。\n\n\
  \n\n\n\n你可以使用 `data-` 之后的任何内容来表示你的数据（这正是 `*` 的含义）。该属性的优势是它可以完全根据你的网站进行自定义。唯一的规则是，属性名必须用字母和数字命名，因此\
  \ `data-jennifer` 是可以的，但 `data-jennifer!` 则不行。\n\n#### 顺便说：为什么数据集很重要\n数据集解决了一个长期以来困扰\
  \ JavaScript 开发者的问题——数据存储何处。这导致了一些通宜方法，其复杂程度从困难到近乎疯狂。有些开发者使用带有自定义 DTD 的 HTML 来涵盖额外的数据字段。另一些人使用\
  \ `class` 属性来存储数据以及样式信息。还有一些人使用带有命名空间的 XHTML 来定义额外字段。数据集允许你在 HTML 中包含数据，而不会使其变成无效标\
  \ HTML，也不会让你的样式变得变得混乱。\n\n当你使用数据集在 HTML 中存储数据时，你可以创建功能更丰富的应用程序，而无需调用数据库甚至无需重新加载现有的网页。\n\
  \n例如，在一个新的 HTML5 元素列表中，你可能想在 `data-*` 字段中包含对元素的描述，例如：\n\n```html\n<li data-desc=\"\
  Article section\">&lt;article&gt;</li>\n```\n\n这些数据不会显示在网页上，但你可以在脚本中访问它们，因此你可以创建一个脚本提供关于该元素的更多信息，并提取\
  \ `data-desc` 信息来显示详情：\n\n```javascript\n<script>\n$(document).ready(function(){\n\
  \    $(\"li\").hover(function() {\n        var data = $(this).attr('data-desc').valueOf();\n\
  \        $(this).addClass(\"highlight\");\n        $(\"#details\").html(\"<p>\"\
  +data);\n    })\n        .mouseout(function() {\n        $(this).removeClass(\"\
  highlight\");\n});\n});\n</script>\n```\n\n可以在 [www.html5in24hours.com/examples/datasets-examples.html](http://www.html5in24hours.com/examples/datasets-examples.html)\
  \ 查看此演示效果。\n\n此外，从 jQuery 1.4.3 开始，你可以使用 `$(this).attr('desc')` 代替 `$(this).attr('data-desc')`。\n\
  \n#### 你知道吗？所有浏览器都支持 `data-*` 属性\n`data-*` 属性最好的部分是，你可以在任何浏览器中使用它们。某些浏览器（如 IE 10、Firefox\
  \ 5、Opera 11、iOS 4.3 和 Android 3.0）不支持 `dataset` 属性，但你仍然可以通过 `getAttribute()` 获取\
  \ `data-*` 属性内部的数据。\n\n较早的示例是开始使用 `data-*` 属性的一种简单方法，它在所有现代浏览器中都有效。但这不是这些属性的设计意图使用方式。相反，你应该使用元素的\
  \ `dataset` 属性，它将返回一个包含所有所选元素 `data-*` 属性的对象。然后，你可以通过你给出的确切名称来引用自定义数据——省去 `data-`\
  \ 前缀。\n\n表 18.1 显示了标准的 JavaScript 方法和 dataset 替代方案。\n\n**表 18.1.** JavaScript 与数据集\n\
  \n![image](img/18tab01.jpg)\n\n#### 总结\n这一小时你学习了 Web 应用程序以及它们是如何与网页不同的构建的。Web 应用程序是带有某种脚本以使其具有交互性的网页。你学习了\
  \ HTML5 Web 应用程序 API 如何帮助你创建应用程序。你还学习了你可以使用的许多不同的事件处理程序，以触发应用程序中的交互事件。例如，其中一些新的事件包括：\n\
  \n• 用于播放媒体的事件，如 `oncanplay` 和 `onpause`\n• 由用户触发的事件，如 `onabort` 和 `oncontextmenu`\n\
  • 用于拖放操作的事件，如 `ondrag` 和 `ondrop`\n• 用于检测错误状态的事件，如 `oninvalid` 和 `onerror`\n\n你学习了如何使用用户提示符，通过在消息窗口和对话框中请求额外信息，让你的页面行为更像应用程序。此外，你甚至学习了如何从你的\
  \ Web 应用程序内部启动打印进程。\n\n最后，你学习了一个用于 Web 应用程序的价值工具：数据集。这些允许你向你的网页添加自定义数据，这样你就不需要为了获取静态信息而连接数据库或运行复杂的脚本。\n\
  \n### 问答\n**Q. 我如何使用如 `ononline` 或 `onstorage` 等的一些新的事件处理程序？**\n\n**A.** 事件处理程序\
  \ `ononline` 和 `onoffline` 都与离线 Web 应用程序 API 相关，将在 第 20 小 “离线 Web 应用程序”中详细讨论。`onstorage`\
  \ 事件处理程序指的是使用 Web 存储存储数据，这将在 第 21 小 “HTML5 中的 Web Storage”中涵盖。**\n\n**Q. 我看到可以使用事件处理程序在打印页面上添加时间戳或其他信息。这是如何工作的？**\n\
  \n**A.** HTML5 增加了 `onbeforeprint` 和 `onafterprint` 事件处理程序，允许你在打印任务运行之前之后触发事件。这些事件没有被浏览器广泛支持，因此请谨慎使用。\n\
  \n**Q. 我可以在 `data-*` 属性中放入任何想要的内容吗？**\n\n**A.** 技术上，你可以在 `data-*` 属性中放入任何你喜欢的内容，但你应该避免将这些属性用于\
  \ HTML 中已具有特定属性的数据，例如图像的高度或宽度。\n\n**Q. 如果我使用的插件或库与我的 HTML 中具有相同的 `data-*` 名称会怎样？这会导致问题吗？**\n\
  \n**A.** 会，可能会。防止这种情况最好的方法是在你的 `data-*` 属性中使用自定义字符串来标识这些属性归所有。例如，你可能会写 `data-jk-desc`\
  \ 而不仅仅是 `data-desc`。这将它与可能使用的任何使用 `desc` 作为数据属性的插件区分来。\n\n你还应该尝试避免为数据集使用非常通用的名称。例如，`height`\
  \ 和 `width` 非常通用，可以指代任何东西，但 `furnitureHeight` 和 `furnitureWidth` 则清楚地说明该数据引用的是什么。\n\
  \n### 工作坊\n工作坊包含测验题，帮助你处理在本章中学到的知识。在阅读答案之前，尝试回答所有问题。参见 附录 A “测验答案”获取。\n\n#### 测验\n\
  **1.** 区分 Web 应用程序和网页的两个点是什么？\n**2.** 列出在 Web 应用程序中触发脚本的四种方式。\n**3.** 从数据获取数据，使用\
  \ JavaScript 的 `getAttribute` 方法还是 `dataset` 方法更好？\n\n#### 练习\n**1.** 使用脚本构建一个简单的\
  \ Web 应用程序，将网页的背景颜色更改用户选择的颜色。\n**2.** 创建一个在数据集中存储额外信息的网页，然后编写一个脚本在用户请求时访问并显示该数据。\n\
  \n## 第 19 小时。WebSockets、Web Workers 和文件\n\n#### 你在本小时将学到：\n• 如何使用 WebSockets 加速网络通信\n\
  • 为什么 WebSockets 不被完全支持\n• 如何通过 Web Workers 对 JavaScript 进行多线程\n• 如何使用 File API\
  \ 将网页连接到用户文件\n• 如何构建一个拖放文件上传工具\n\nWebSockets、Web Workers 和 File APIs 是 HTML5 中非常有用的补充，因为它们为你提供了如异步连接之类的资源，并允许你在\
  \ Web 应用程序中后台运行脚本并处理文件。这三个 API 提供了大多数应用程序使用的许多后端功能。\n\n这一小时你将学习这三个 API 对 Web 应用程序的作用，关于如何使用它们的一些解释，以及使用它们的优缺点。\n\
  \n#### 使用 WebSockets 进行双向通信\n\n\n\n\n\nWebSockets 允许网页与远程主机之间进行双向通信。W3C 正在将 WebSockets\
  \ API 标准化，作为通过 浏览器与 WebSocket 服务器通信的一种。\n\nWebSockets 已在 Firefox 4、Chrome 4、Opera\
  \ 11 和 Safari 5 以及 iOS 4.2 中实现。它在 Internet Explorer 或 Android 中不可用。由于安全考虑，Firefox\
  \ 和 Opera 已经在其浏览器中禁用了该支持。如果 Firefox 和 Opera 用户确实需要，可以重新启用，但在解决安全问题之前，它们将无法使用。\n\n\
  ## WebSocket 安全考量\n\nFirefox 和 Opera 浏览器厂商对 WebSockets 的担忧是一个并非特定于浏览器的安全问题。问题在于，建立\
  \ WebSocket 连接的握手可能会被利用，通过缓存投毒运行恶意代码。\n\n* * *\n\n顺便说：即使存在安全考量，学习该 API 也是明智之举\n\n\
  许多网页开发者在理解围绕 WebSockets 的安全问题时遇到困难，是因为问题不在 API，而在于 socket 经过的中间工具。换句话说，用于连接 WebSocket\
  \ 服务器的方法并不是安全问题所在；服务器本身是不安全的。因此，即使你不计划在 Firefox 和 IE 支持之前实现 WebSockets，你仍然可以学习 API，以便在获得支持后做好准备。\n\
  \n* * *\n\nFirefox 和 Opera 决定在解决握手漏洞之前禁用对 WebSocket 的支持，但 Safari 和 Chrome 等浏览器仍然支持它，用户可能会受到攻击。尽管如此，Safari\
  \ 未来也可能禁用 WebSocket。WebSocket 协议的问题完全不在于 WebSocket 本身，而在于某些类型代理的实现。然而，当 Firefox\
  \ 和 Opera 禁用支持时，人们才注意到了这一点。事实上，对握手的利用首先在 Flash 和 Java 的原始 socket 中被发现，随后在 WebSockets\
  \ 中发现了相同的情况。\n\n最终，WebSockets 仍处于开发的早期阶段，因此通过学习此 API，你可以让你的网站处于前沿。大多数网页开发者将在 Firefox\
  \ 和 Internet Explorer 支持它之前跳过其使用。\n\n## WebSocket 的优势\n\n当网页浏览器通常访问一个页面时，它会向 Web\
  \ 服务器发送 HTTP 请求。主机服务器确认请求并返回响应。这意味着，如果服务器有新内容要告诉浏览器，在浏览器请求新数据之前，它无法共享这些内容。WebSocket\
  \ 允许服务器在任何新数据到达时立即通知浏览器。\n\n某些 Ajax 应用尝试解决此问题的两种方法是轮询（polling）和长轮询（long-polling）。轮询是浏览器按固定间隔向服务器发送\
  \ HTTP 请求，并由服务器响应。长轮询是浏览器向服务器发送请求，服务器将保持请求开启一段时间。如果在此期间收到响应，服务器将立即将其发送给浏览器。\n\n\
  问题是，这些方法仍然依赖于请求-响应机制。在轮询中，除非服务器在每个设定的时期都有新数据，否则某些请求将一无所获——导致不必要的请求。在长轮询中，如果消息量过大，你面临失控循环的风险。此外，由于轮询和长轮询方法仍然依赖\
  \ HTTP，它们必须在每个请求和响应中包含这些信息。\n\nWebSocket 在浏览器和服务器之间建立连接，然后数据可以随地向任何方向流动。这加速了通信，因为服务器可以在获取新信息时随时将其发送给客户端，而无需等待客户端请求。\n\
  \nWebSocket 让你无需额外的 HTTP 流量或延迟即可在网站上显示实时信息。你可以使用 WebSocket 的方式包括：\n\n• 股票和新闻滚动条，包括\
  \ Twitter Feed \n• 多人游戏\n• 聊天和即时消息\n\n## 建立 WebSocket\n\n使用 WebSocket 时首先需要的是一个服务器。你有几种方案来设置\
  \ WebSocket 服务器：\n\n• Alchemy WebSockets (`www.olivinelabs.com/index.php/projects/71-alchemy-websockets`)\n\
  • jWebSocket (`http://jwebsocket.org/`)\n• Kaazing HTML5 WebSocket Gateway (`www.kaazing.com/products/html5-edition.html`)\n\
  • phpwebsocket (`http://code.google.com/p/phpwebsocket/`)\n• pywebsocket (`http://code.google.com/p/pywebsocket/`)\n\
  \n设置好服务器后，你通过一个称为客户端的 Web 应用程序连接到它。在这种情况下，客户端仅仅是一个带有一些帮助连接到 WebSocket 服务器脚本的网页。\n\
  \n* * *\n\n注意！留意协议版本\n\n目前实现 WebSocket 的挑战之一是你的 socket 服务器必须不断更新。Chrome 6.4 停止了对协议版本\
  \ 75（及更低）的支持，Google 持续修改 Chrome 以仅支持最新且最安全的版本。\n\n* * *\n\n要使用 WebSocket，你需要了解四个事件：\n\
  \n• `onopen`—当 socket 打开时触发。\n• `onclose`—当 socket 关闭时触发。\n• `onmessage`—当接收消息时触发。\n\
  • `onerror`—当发生错误时触发。\n\nWebSocket 是一个新的 API，其功能仍然存在 Bug 难以设置。然而，如果你需要实时数据以及与 Web\
  \ 服务器的交互，WebSocket 是 HTML5 的一个重要新功能。\n\n在 WebSocket 被广泛支持之前，你可以使用如 Socket.IO (`http://socket.io/`)\
  \ 等工具。这个 JavaScript 工具和服务器端组件从 WebSocket、Flash 等可用机制中选择最佳机制，来与服务器建立实时连接。\n\n####\
  \ 使用 Web Workers 在后台运行脚本\n\nWeb Workers 是添加到 HTML5 的另一个 API。它是一个用于在后台运行且独立于用户界面的脚本的\
  \ API。这很重要，因为 JavaScript 本身只运行在一个线程中。这意味着 JavaScript 执行的每一件事都必须自己独立完成。如果脚本需要处理 UI\
  \ 输入、提交服务器查询并操作 DOM，这些操作中的每一个都会单独地、一个一个地发生。Web Workers 通过为 Web 应用程序添加后台线程解决了这个问题。\n\
  \n* * *\n\n顺便说：Workers 无法操作 DOM\n\nWorkers 在后台运行，没有任何后台线程可以操作网页的 `DOM`。因此，如果你需要因为\
  \ Web Worker 修改 `DOM`，你需要从 `Worker` 向创建者传递消息以完成操作。Workers 同样无法访问 `window` 对象、`document`\
  \ 对象或 `parent` 对象。\n\n* * *\n\n要向你的脚本添加新的 Worker，你只需写道：\n\n```javascript\nworker\
  \ = Worker(\"worker.js\");\n```\n\n然后你可以通过监听来自它的消息来与 Worker 通信：\n\n```javascript\n\
  worker.onmessage = function(e){\n  e.data\n};\n```\n\n并向它发送消息：\n\n```javascript\n\
  worker.postmessage(\"message\");\n```\n\nWorker 随后读取消息并返回结果：\n\n```javascript\n\
  worker.onmessage = function(e){\n  if ( e.data === \"start\" ) {\n    done()\n \
  \ }\n};\n\nfunction done(){\n  postMessage(\"done\");\n}\n```\n\n* * *\n\n注意！Workers\
  \ 会无声息地失败\n\n\n\n\n由于你的 Web Workers 存储在独立的 JS 文件中，存在找不到文件的情况（404 错误）。如果发生这种情况，服务器将不会提供任何反馈；Worker\
  \ 将不会执行其操作。如果你在 Worker 方面遇到问题，首先应该检查的是该文件是否存在于你的服务器上，以及你是否指向了正确的位置。\n\n要关闭 Worker，你可以在主页面中使用\
  \ `worker.terminate()`，或者在 Worker 脚本内部使用 `self.close();`。\n\n遗憾的是，Web Workers 在移动端仅支持\
  \ Opera Mobile 11。Internet Explorer 也不支持它。Web Workers 在其他桌面浏览器中得到了良好支持。\n\n## 尝试一下：使用\
  \ Web Workers 构建一个简单的计算器\n\n此脚本将使用 Web Workers 在后台进行简单的数学计算。\n\n**1.** 创建一个新的 JavaScript\
  \ 文件并将其命名为 `worker.js`。\n\n**2.** 为文件添加一个监听器，以监听调用 Worker 的事件：\n\n```javascript\n\
  // event listener\nthis.onmessage = function (event) {\n    var data = event.data;\n\
  \    switch(data.func) {\n        case 'add':\n            postMessage(addNumbers(data.one,\
  \ data.two));\n            break;\n        case 'subtract':\n            postMessage(subtractNumbers(data.one,\
  \ data.two));\n            break;\n        case 'multiply':\n            postMessage(multiplyNumbers(data.one,\
  \ data.two));\n            break;\n        case 'divide':\n            postMessage(divideNumbers(data.one,\
  \ data.two));\n            break;\n        default:\n            postMessage(\"\
  Error: Unknown operation\");\n    }\n};\n```\n\n**3.** 添加计算器支持的数学运算（加、减、乘、除），然后保存文件并将其上传到你的\
  \ Web 服务器：\n\n```javascript\nfunction addNumbers(one, two) {\n    return one + two;\n\
  }\nfunction subtractNumbers(one, two) {\n    return one-two;\n}\n\nfunction multiplyNumbers(one,\
  \ two) {\n    return one*two;\n}\n\nfunction divideNumbers(one, two) {\n    if (two\
  \ == 0) {\n        return \"no divide by zero\";\n    } else {\n        return one\
  \ / two;\n    }\n}\n```\n\n**4.** 创建一个新的 HTML 文档，并在 `<head>` 中包含 jQuery 脚本：\n\n\
  ```html\n<!DOCTYPE HTML>\n<html\n<head>\n<meta charset=\"UTF-8\">\n<title>Web Workers\
  \ Example</title>\n<script src=\"jquery.min.js\"></script>\n</head>\n<body>\n```\n\
  \n**5.** 构建你的计算器：\n\n```html\n<h1>A Calculator</h1>\n<p>\n<button id=one class=number>1</button>\n\
  <button id=two class=number>2</button>\n<button id=three class=number>3</button>\n\
  <button id=divide class=fx>/</button>\n<p>\n<button id=one class=number>4</button>\n\
  <button id=two class=number>5</button>\n<button id=three class=number>6</button>\n\
  <button id=multiply class=fx>*</button>\n<p>\n<button id=one class=number>7</button>\n\
  <button id=two class=number>8</button>\n<button id=three class=number>9</button>\n\
  <button id=subtract class=fx>-</button>\n<p>\n<button id=zero class=\"number\">0</button>\n\
  <button id=period class=number>.</button>\n<button id=add class=fx>+</button>\n\
  <p>\n<button id=clear>C</button>\n<button id=submit>=</button>\n```\n\n注意数字具有类 `number`，而运算符具有类\
  \ `fx`。这可以通过 `dataset` 实现，但使用类可以为数字设置不同的样式，使其区别于运算符。\n\n**6.** 为用于计算的数字添加三个文本字段：\n\
  \n```html\n<p>First Number</p>\n<input id=first readonly=numbers>\n<p>Second Number</p>\n\
  <input id=second readonly=numbers>\n<p>Result</p>\n<input id=result readonly=numbers>\n\
  ```\n\n注意所有文本字段都是只读的。这是因为你不希望用户填入自己的值——而是希望使用来自计算器的值。\n\n**7.** 在检查浏览器是否支持的脚本内部初始化你的\
  \ Web Worker：\n\n```javascript\nif (supportsWorkers() ) {\n    worker = new Worker(\"\
  worker.js\");\n    // Watch for messages from the worker\n    worker.onmessage =\
  \ function(e){\n        $(\"#result\").val(e.data);\n    };\n} else {\n    alert(\"\
  this calculator will not work in your browser, sorry\");\n}\n\nfunction supportsWorkers()\
  \ {\n    return !!window.Worker;\n}\n```\n\n**8.** 在 jQuery ready 函数内部，初始化变量并设置数字按钮被点击时的动作：\n\
  \n```javascript\n$(document).ready(function(){\n    var next, cur, func, one, two,\
  \ message;\n    $(\".number\").click(function() {\n        if (!next) {\n      \
  \      cur = $(\"#first\").val();\n            num = $(this).html();\n         \
  \   num = cur + num;\n            // input first number\n            $(\"#first\"\
  ).val(num);\n        } else {\n            cur = $(\"#second\").val();\n       \
  \     num = $(this).html();\n            num = cur + num;\n            $(\"#second\"\
  ).val(num);\n        }\n    });\n```\n\n除非 `next` 变量被激活，否则此函数会将数字附加到第一个字段。\n\n**9.**\
  \ 编写运算符按钮被点击时的函数：\n\n```javascript\n$(\".fx\").click(function() {\n    next = 1;\n\
  \    func = $(this).attr(\"id\");\n    one = parseFloat($(\"#first\").val());\n\
  });\n```\n\n这设置了 `next` 变量并将运算符赋值给 `func` 变量。\n\n**10.** 编写清空按钮的函数：\n\n```javascript\n\
  $(\"#clear\").click(function() {\n    $(\"input\").attr('value','');\n    next =\
  \ 0;\n});\n```\n\n这重置了 `next` 变量并清空三个字段。\n\n**11.** 编写等号被点击时的函数：\n\n```javascript\n\
  $(\"#submit\").click(function() {\n    two = parseFloat($(\"#second\").val());\n\
  \    message = {\n        'func' : func,\n        'one' : one,\n        'two' :\
  \ two\n    };\n    worker.postMessage(message);\n});\n```\n\n这里向 Worker 传递了用于计算的信息。\n\
  \n**12.** 结束 document ready 函数、脚本和 HTML：\n\n```html\n});\n</script>\n</body>\n</html>\n\
  ```\n\n图 19.1 显示了该页面在 Firefox 中运行。你可以在 `www.html5in24hours.com/examples/web-workers-examples.html`\
  \ 查看此计算器的示例。\n\n**图 19.1。** Firefox 中的计算器应用程序。\n\n![image](img/19fig01.jpg)\n\n\
  #### 使用 File API 处理客户端文件\n\nFile API 是一组方法，你可以用它们处理客户端的文件。最常见的情况是带有进度条的文件上传，以及在不使用\
  \ Flash 的情况下上传多个文件。\n\n### 顺便说一下：File API 仍然由用户驱动\n\nFile API 并不会突然让 Web 开发者访问用户的硬盘。你不能简单地访问本地文件。但是你可以将\
  \ File API 绑定到 `<input type=file>` 元素上，为你的文件上传器提供更好的功能，但用户仍然需要选择网页访问的文件。\n\nFile\
  \ API 包含了几个接口，包括：\n\n- `FileList`: 来自底层文件系统的文件数组。\n- `File`: 关于文件的只读信息，包括文件名和最后修改日期。\n\
  - `Blob`: 表示不可变的二进制数据。\n- `FileReader`: 读取 `File` 和 `Blob` 数据的方法。\n- `FileError`\
  \ 和 `FileException`: 定义错误条件。\n- `URI scheme`: 在 Web 应用程序中引用二进制数据。\n\nHTML5 File\
  \ API 允许你的 应用程序直接从计算机读取文件内容，而无需将其上传到服务器然后打开。\n\n### 什么是 BLOB？\n\n*blob* 一词源于数据库缩写\
  \ *BLOB*，意思是二进制大对象。它指的是必须以特殊方式处理的大文件，例如图像或声音文件。文件处理程序不需要知道文件是什么就能处理它；它只需要能够对其进行操作。\n\
  \n\n\n\n```javascript\n} else {\n    // file uploader script\n}\n\nfunction fileAPI()\
  \ {\n    return typeof FileReader != 'undefined';\n}\n```\n\n你需要完成几个步骤才能使用 File\
  \ API，这些步骤将在后续章节中介绍。\n\n## 构建输入字段\n\n要使用 File API，你必须使用 `<input type=file>` 设置一个文件输入框。例如：\n\
  \n```html\n<input type=file id=imageFile onchange=\"getImages(this.files);\">\n\
  ```\n\n> **注意！**: iOS 不支持文件上传\n\n如前所述，iOS 不支持 File API，但 iOS 设备也不支持文件上传输入类型。这是因为\
  \ iOS 没有对终端用户可见的文件系统——用户没有办法选择文件进行上传。你拥有的唯一选择是引导用户使用某个应用程序来上传图片，或者使用 PhoneGap 等工具将你的\
  \ HTML5 应用转换为原生 iPhone 应用。你可以使用的一个应用程序是 `iphone-photo-picker` ([`code.google.com/p/iphone-photo-picker/`](http://code.google.com/p/iphone-photo-picker/))。\n\
  \n如果你想允许人们选择多个文件，可以添加 `multiple` 属性：\n\n```html\n<input type=file id=imageFile multiple=true\
  \ onchange=\"getImages(this.files);\">\n```\n\n如果你想限制用户可以上传的文件类型（这是一个主意），你应该使用 `accept`\
  \ 属性，并带有你接受的 MIME 类型，类型之间用逗号分隔。\n\n要将字段限制为仅图片，请写：\n\n```html\n<input type=file id=imageFile\
  \ multiple=true accept=\"image/*\" onchange=\"getImages(this.files);\">\n```\n\n\
  ## 获取文件信息\n\n文件以 `FileList` 中文件数组的形式发送到应用程序。你可以遍历此数组以获取每个文件的名称、大小和 MIME 类型。\n\n\
  在示例中，`getImages()` 函数读取文件列表并在名为 `images` 的 `div` 中显示名称、大小和类型：\n\n```javascript\n\
  function getImages(files) {\n    var i, file;\n    $(\"#images\").html(\"<p>Number\
  \ of files: \"+files.length);\n    for (i=0; i<files.length; i++) {\n        file\
  \ = files[i];\n        $('<li/>', {\n            text: \"name: \"+file.name+\" size:\
  \ \"+file.size+\" type: \"+file.type\n        }).appendTo(\"#images\");\n    }\n\
  }\n```\n\n## 读取文件信息\n\n读取文件信息是 File API 真正大彩的地方。你可以直接读取用户硬盘上的文件，而无需上传它们。这意味着你可以创建图片的预览而不使用任何服务器资源。\n\
  \n如果你只是使用 `file.name` 调用来显示图片，顶只会显示损坏的图片。相反，你必须告诉用户代理读取文件。然后你可以将文件转换为数据 URL 并动态显示图片。\n\
  \n你打开一个新的 `FileReader`：\n\n```javascript\nvar reader = new FileReader();\n```\n\n\
  然后在读取器加载完成时运行一个函数：\n\n```javascript\nreader.onload = (function(theFile) { ... }\n\
  ```\n\n最后，你获取文件数据 URL：\n\n```javascript\nreader.readAsDataURL(file);\n```\n\n完整的\
  \ `getImages()` 函数创建图片的缩略图并添加到 `preview` 区域：\n\n```javascript\nfunction getImages(files)\
  \ {\n    var i, file;\n    $(\"#images\").html(\"<p>Number of files: \"+files.length);\n\
  \    for (i=0; i<files.length; i++) {\n        file = files[i];\n        // 确保它们只有图片类型\n\
  \        if (!file.type.match('image.*')) {\n            continue;\n        }\n\
  \        var reader = new FileReader();\n        reader.onload = (function(theFile)\
  \ {\n            return function(e) {\n                var span = document.createElement('span');\n\
  \                $('<span/>')\n                    .addClass(\"preview\")\n    \
  \                .html(\"<img src=\"+e.target.result+\" class=preview>\")\n    \
  \                .appendTo(\"#preview\");\n            };\n        })(file);\n \
  \       reader.readAsDataURL(file);\n    }\n}\n```\n\n获取文件后，你可以对它进行任何操作。使用 `XMLHttpRequest()`\
  \ 上传它，对其制作动画，或者将数据 URL 设置在 cookie 中作为头像。\n\n## 尝试一下：构建一个拖放上传器\n\n使用 File API 的最佳方法之一是创建一个上传器。通过此脚本，你将创建一个比其他文件脚本更容易使用的拖放上传器。\n\
  \n1. **打开一个新的 HTML 文件并链接到 jQuery 和 jQuery UI：**\n\n```html\n<!DOCTYPE HTML>\n<html\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>Drag and Drop Uploader</title>\n\
  \    <script src=\"jquery.min.js\"></script>\n    <link rel=\"stylesheet\" href=\"\
  jquery-ui-1.8.13.custom.css\">\n    <script type=\"text/javascript\" src=\"jquery-ui-1.8.13.custom.min.js\"\
  ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n2. **为你的放置区域和文件区域添加两个框：**\n\
  \n```html\n<div id=\"dropBox\" dropzone=\"copy\">\n    <p>Drop Images Here</p>\n\
  </div>\n<div id=\"preview\"></</div>\n```\n\n3. **添加一个进度条：**\n\n```html\n<div id=\"\
  progress\"></</div>\n```\n\n4. **按你喜欢的方式这些这些框。**\n\n5. **将你的 `<script>` 元素放在文档底部，就在\
  \ `</body>` 之上：**\n\n```html\n<script>\n</script>\n```\n\n6. **在 jQuery document\
  \ ready 函数中，为你的放置区域初始化事件处理程序并初始化进度条：**\n\n```javascript\n$(document).ready(function()\
  \ {\n    var dropbox = document.getElementById(\"dropBox\")\n    // 初始化事件处理\n  \
  \  dropbox.addEventListener(\"dragenter\", dragEnter, false);\n    dropbox.addEventListener(\"\
  dragleave\", dragExit, false);\n    dropbox.addEventListener(\"dragover\", dragOver,\
  \ false);\n    dropbox.addEventListener(\"drop\", drop, false);\n    // 初始化进度条\n\
  \    $(\"#progress\").progressbar();\n});\n```\n\n7. **防止 `dragenter`、`dragleave`\
  \ 和 `dragover` 的默认操作：**\n\n```javascript\nfunction dragEnter(e) {\n    e.preventDefault();\n\
  }\nfunction dragExit(e) {\n    e.preventDefault();\n}\nfunction dragOver(e) {\n\
  \    e.preventDefault();\n}\n```\n\n8. **在 drop 事件上，设置 `DataTransfer` 来传输被放置的文件：**\n\
  \n```javascript\nfunction drop(e) {\n    e.stopPropagation();\n    e.preventDefault();\n\
  \    var files = e.dataTransfer.files;\n    var count = files.length;\n    // 只有有文件时才执行上传函数\n\
  \    if (count > 0) {\n        uploadFiles(files);\n    }\n}\n```\n\n9. **运行 `uploadFiles`\
  \ 函数。务确保检查文件是你想要的类型和大小：**\n\n```javascript\nfunction uploadFiles(files) {\n    var\
  \ i, file;\n    for (i=0; i<files.length; i++) {\n        file = files[i];\n   \
  \     // 确保它们只有图片类型\n        if (!file.type.match('image.*')) {\n            continue;\n\
  \        }\n        // 确保它们不会太大\n        if (file.size > 30000) {\n            alert(file.name+\"\
  \ file size too large\");\n            continue;\n        }\n        var reader\
  \ = new FileReader();\n        // 进度条\n        reader.onprogress = function(e) {\n\
  \            if (e.lengthComputable) {\n                var loaded = (e.loaded /\
  \ e.total);\n                $(\"#progress\").progressbar({ value: loaded * 100\
  \ });\n            }\n        };\n        // 加载完成\n        reader.onloadend = function(e)\
  \ {\n            $(\"#progress\").progressbar({ value: 100 });\n            $(\"\
  #preview\").append(\"<img class=preview src=\"+e.target.result+\"\">\");\n     \
  \   };\n        // 开始读取操作\n        reader.readAsDataURL(file);\n    }\n    $(\"\
  #dropBox p\").html(\"Complete. Upload more?\");\n}\n```\n\n总结\n\n在这个小时里，你学习了三个属于\
  \ HTML5 的 API，但它们的支持范围不像本书书中涵盖的一些其他 API 那么广泛。这些是值得了解的工具，但如果你专注于移动应用程序，你可能还需要等待一段时间才能在移动领域获得广泛的支持。\n\
  \n\n\n\n\n你学习了如何使用 `WebSockets` API 创建与 Web 应用的双向连接。该 API 允许与 `WebSockets` 服务器连接，并为客户提供近乎实时的数据。\n\
  \n这一小时还涵盖了 `Web Workers`。`Web Workers` 允许脚本在后台运行，以便 `JavaScript` 可以多线程运行，提高应用程序的速度并提供更多功能。\n\
  \n最后，你学习了 `File API`。通过 `File API`，你对 `<input type=file>` 元素拥有比直接使用元素更多的控制权，从而可以创建更健壮的文件传输应用程序。当结合拖放功能时，`File\
  \ API` 让几乎任何使用上传文件的应用程序都感觉更像桌面应用程序。\n\n### 问答\n\n**Q. 你提到了几个 WebSockets 服务器——有你特别推荐的吗？**\n\
  \n**A.** `Kaazing` 服务器最容易设置和运行，但关于如何与该服务器交互的文档较少。其他服务器可能较难运行，但一旦运行，它们对标准 `WebSockets`\
  \ API 调响应比 `Kaazing` 更迅速。\n\n**Q. 这一小时创建的计算器完全可以用内联 JavaScript 完成。我为什么要在这个函数中使用\
  \ Web Worker？**\n\n**A.** `Web Workers` 将 `JavaScript` 的工作移到了页面加载和运行之外。如果你想象在一个更动态的页面上有相同类型的计算器，同时还有其他事情在发生，那么将脚本移动到独立的\
  \ `Worker` 中是有意义的。`Web Workers` 有助于加速页面，在包含大量 `JavaScript` 的应用程序中最为有效。\n\n**Q. 你的文件上传脚本并没有真正上传任何文件——我应该如何做？**\n\
  \n**A.** 要开始上传，你需要使用 `XMLHttpRequest()` 将文件信息发送到服务器。以下代码是一个文件上传函数，你可以用它代替 `uploadFiles()`\
  \ 函数来上传文件，而不是将其放入文档：\n\n```javascript\nfunction FileUpload(files) {\n    for (var\
  \ i=0; i<files.length; i++) {\n        var file = files[i];\n        // 确保它们仅为类型\n\
  \        if (!file.type.match('image.*')) {\n            continue;\n        }\n\
  \        // 构建文件列表\n        var reader = new FileReader();\n        var xhr = new\
  \ XMLHttpRequest();\n        this.xhr = xhr;\n        xhr.upload.addEventListener(\"\
  load\", function(e){\n            self.ctrl.update(100);\n            var canvas\
  \ = self.ctrl.ctx.canvas;\n            canvas.parentNode.removeChild(canvas);\n\
  \        }, false);\n        xhr.open(\"POST\", \"upload.php\");\n        xhr.overrideMimeType('text/plain;\
  \ charset=x-user-defined-binary');\n        reader.onload = function(evt) {\n  \
  \          xhr.sendAsBinary(evt.target.result);\n        };\n        reader.readAsBinaryString(file);\n\
  \    }\n}\n```\n\n你还需要在服务器上编写一个文件来接收上传的文件，在前面的示例中，它是 `upload.php`。\n\n### 工作坊\n\n\
