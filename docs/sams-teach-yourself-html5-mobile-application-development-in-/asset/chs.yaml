  <footer>© 2011</footer>\n</body>\n</html>\n```\n\n\n\n\n# CSS3\n\n对 CSS3 样式属性的支持并不总是像学习一系列新属性那么简单。大多数网络浏览器在添加新样式时，会在属性前加上一个关键词，以指示它是浏览器特定的属性。这些关键词是：\n\
  \n• `-moz`—Firefox（Firefox）和 Mozilla\n• `-ms`—Internet Explorer（IE）\n• `-wap`—WAP\
  \ 和 Opera\n• `-o`—Opera\n• `-webkit`—Chrome 和 Safari\n\n只要包含了相应的浏览器特定扩展，你现在就可以使用许多新的\
  \ CSS3 属性。\n\n## 圆角\n\nCSS3 中的圆角是通过名为 `border-radius` 的属性实现的。世界上几乎每一位设计师都在等待这种样式能有更好的支持，因为\
  \ CSS2 网页那种方方正正、盒式的外观已经变得枯燥了。事实上，在这种样式出现之前，设计师们被迫使用笨拙的 HTML 结构、图片甚至表格来实现圆角。\n\n\
  与之前讨论的 `font` 属性一样，你可以使用快捷属性 `border-radius` 为所有四个角设置样式，也可以通过为每个角设置样式来设定特定角的弧率：\n\
  \n• `border-bottom-left-radius`（左下圆角）\n• `border-bottom-right-radius`（右下圆角）\n• `border-top-left-radius`（左上圆角）\n\
  • `border-top-right-radius`（右上圆角）\n\n然而，你还需要包含 Firefox 和 WebKit 的浏览器扩展，才能让你的样式在这些浏览器中显示。WebKit\
  \ 扩展同样适用于 iOS 和 Android 设备，以及 Safari 和 Chrome。Opera 使用的是 CSS3 属性而不是任何扩展。表 3.1 显示了\
  \ CSS3 属性及其对应的浏览器特定扩展。务必在在你支持的浏览器中进行测试，因为最新版本的 Chrome、Firefox 和 Safari 不需要这些扩展。\n\
  \n**表 3.1.** Border-Radius 浏览器扩展\n\n![image](img/03tab01.jpg)\n\n要使用 `border-radius`\
  \ 样式，你需要设置边框半径的长度。你可以使用一个长度值创建一个圆角，使用两个值创建一个椭圆角。\n\n***\n\n### 亲手尝试一下：构建一个具有不同角样式的框\n\
  \n你可以使用圆角样式创建一个具有四种不同角样式的框。\n\n1. 打开一个 HTML5 文档并添加一个 `<div>`，在里面包含一段短文本：\n\n```html\n\
  <<div>\n    <p>Here is a short paragraph of text.</p>\n</>\n```\n\n2. 给你的 `<div>`\
  \ 标签分配一个 ID，以便用 CSS 对其进行唯一的样式设置：\n\n```html\n<div id=\"all-four\">\n```\n\n3. 创建一个新的样式表并为\
  \ `<div>` 设置背景颜色、边框、宽度和高度：\n\n```css\n#all-four {\n    background-color: yellow;\n\
  \    border: solid black 2px;\n    width: 200px;\n    height: 200px;\n}\n```\n\n\
  4. 将左上角样式为圆角，别忘记加上浏览器扩展：\n\n```css\nborder-top-left-radius: 25px;\n-moz-border-radius-topleft:\
  \ 25px;\n-webkit-border-top-left-radius: 25px;\n```\n\n5. 将右上角设置为正椭圆（这与圆角相同）：\n\n\
  ```css\nborder-top-right-radius: 65px 65px;\n-moz-border-radius-topright: 65px 65px;\n\
  -webkit-border-top-right-radius: 65px 65px;\n```\n\n6. 给两个下角设置不均匀的椭圆：\n\n```css\n\
  border-bottom-left-radius: 100px 50px;\n-moz-border-radius-bottomleft: 100px 50px;\n\
  -webkit-border-bottom-left-radius: 100px 50px;\nborder-bottom-right-radius: 135px\
  \ 25px;\n-moz-border-radius-bottomright: 135px 25px;\n-webkit-border-bottom-right-radius:\
  \ 135px 25px;\n```\n\n保存文档并在网页浏览器中查看。你的结果应该与图 3.4 相似。\n\n**图 3.4.** iPad 上一个具有不同类型圆角的\
  \ `div`。\n\n![image](img/03fig04.jpg)\n\n***\n\n## 阴影和文本阴影\n\n你可以使用 CSS3 属性 `text-shadow`\
  \ 和 `box-shadow` 为文本和框添加阴影。这些样式的格式为：\n\n```css\ntext-shadow: horizontal-offset vertical-offset\
  \ blur-radius color;\nbox-shadow: horizontal-offset vertical-offset blur-radius\
  \ color;\n```\n\n偏移（offsets）是阴影相对于原始元素的偏移量。模糊半径（blur radius）是要应用的模糊程度；颜色（color）是阴影的颜色。\n\
  \n## 透明颜色\n\nCSS 可以以 `rgb(r,g,b)` 格式显示颜色，其中 r、g、b 代表红、绿、蓝色的 0-255 数字。例如 `rgb(0,0,0)`。要使用透明度，在\
  \ 0 到 1 之间添加第四个数字：\n\n```css\nrgba(0,0,0,0.5)\n```\n\n## 在移动设备上使用 CSS3\n\n移动设备对\
  \ CSS3 的支持非常好，尤其是智能手机和平板。如果你正在构建 HTML5 应用，CSS3 是一个自然的补充。然而，旧版本的 IE 可能会遇到问题。\n\n\
  #### 总结\n\n在本节中，你学习了如何编写 CSS 样式、如何将这些样式添加到样式表中以及如何将其附加到 HTML 中。你还学习了如何设置网页的字体和布局，以及如何使用\
  \ CSS3 属性处理阴影、圆角和透明颜色。\n\n### 问答\n\n**我想在标题中使用特殊字体，由于我不确定客户是否安装了该字体，我应该直接用图片吗？**\n\
  \n每个网站都不同，但使用图片字体通常不是好主意。它们会增加页面加载时间，并且让阅读器难以处理。它们对搜索引擎也不友好。但你不应该放弃，有方法可以将你的特殊字体放到页面中。你可以使用图像替换技术或嵌入字体（在第\
  \ 11 章 中详细讨论）。但目前，你可以将该字体放在字体栈的第一位。\n\n**还有其他我可以使用的 CSS3 属性吗？**\n\n本书没有涵盖许多 CSS3\
  \ 属性，因为它们在现代浏览器中的支持并不完美。你可以使用某些属性通过 `columns` 创建杂志风格的布局。你可以使用 `border-image` 样式用图片创建边框。你可以使用\
  \ `transition` 属性创建过渡效果。如果你担心想要使用的属性在某些浏览器或设备上不支持，可以在“Can I use...”网站（[`caniuse.com/`](http://caniuse.com/)）查找兼容性表。\n\
  \n**听说 Internet Explorer 不正确处理 CSS Box 模型。我该如何处理？**\n\n这部分正确。Internet Explorer 5、6\
  \ 和 7 实现 CSS Box 模型的方式与其他更符合标准的浏览器略有不同。这些版本的 IE 会在你在元素内部浮动元素时双倍计算内边距，并将内边距计入元素宽度的一部分，而不是额外加上。你可以在网上找到修复这些问题的变通方法，但幸运的是，Internet\
  \ Explorer 8 和 9 都符合了标准，因此你可能只在旧版本的浏览器中遇到这些问题。\n\n\n\n\n\n本工作坊包含测验题，帮助你处理在本章中学的内容。在阅读答案之前，请尝试回答所有问题。请参附录\
  \ A“测验答案”获取答案。\n\n## 测验\n\n1.** 为网页添加样式的三种方法是什么？哪种是方法？\n\n2.** 什么是 CSS 选择器？\n\n\
  3.** 什么是浏览器扩展？`border-radius` CSS3 属性的浏览器扩展有哪些？\n\n## 练习\n\n**1.** 为你在第 1 节或第 2\
  \ 节中创建的 HTML 文档创建一个外部样式表。使用 `float` 并设置元素宽度为你的文档创建一个双栏布局。\n\n**2.** 使用创新的字体族、颜色和\
  \ `text-shadow` 或 `box-shadow` 创建一个华丽的标题。\n\n**3.** 确保访问 W3C CSS 网站（([www.w3.org/Style/CSS/learning](http://www.w3.org/Style/CSS/learning))了解更多关于\
  \ CSS 以及本节未涵盖的属性。\n\n## 第 4 小：检测移动设备和 HTML5 支持\n\n***在本节中你将学习：***\n\n当你在使用像 HTML5\
  \ 这样前沿的语言时，走极端之一是非常诱人的：\n\n• 或者你决定支持所有可能的内容，并倾向于忽略任何不起作用的东西。\n• 或者你决定在新的标准被整个浏览器生态系统广泛支持之前，先不支持任何新标准。\n\
  \n在本节中，你将学习如何走第三条路，即中庸之道。创建可以在大部分浏览器中运行的尖端 Web 应用程序，而不需要进行大量的重复工作，也不会遗漏大量的用户或技术，这是可能的。通过对支持什么做出明智的决策，然后优雅地处理不合规的情况，你将创建一个对许多人有效且用的\
  \ Web 应用程序。\n\n### 选择使用哪些 HTML5 元素\n\n许多网页设计师在使用 HTML5 和 CSS3 时面临的问题是，大多数浏览器并不支持它们。我说的大多数是指\
  \ Internet Explorer。Internet Explorer 9 仅于 2011 年初发布，之前的所有版本几乎没有 HTML5 支持，且 CSS3\
  \ 支持非常有限。\n\n此外，还有移动设备。市场上有成百上种移动设备。大多数手机都有某种网页浏览器，即使是智能手机和平板电脑，对现代标准的支持程度也不相同。\n\
  \n然而，“我如何检测 HTML5 支持？”这个问题也是错误的。首先，HTML5（就 CSS3 而言）并不真的是某一个“东西”。它是一个巨大的规范、标准和工具的集合，所有这些都被包含在\
  \ HTML5 这一标题下。因此，当一个浏览器“支持”HTML5 时，它实际上表达的是 HTML5 的某些功能和特性在该浏览器中可以运行。但截至本文写作，没有哪个网络浏览器支持所有的\
  \ HTML5 标准。事实上，许多标准仍在编写中。\n\n当你选择想要使用的 HTML5 部分时，请考虑你想要在网站上使用的特性，而不是你想要支持的浏览器和设备。这听起来可能像是在主张回到那个糟糕的年代——那时网站会给特定的浏览器用户写注释，建议他们去下载更好的浏览器——但我并不是那个意思。记住，有些机构和学校对可以使用和不能使用的浏览器及版本有规定，这些规定通常比大多数网页设计师喜欢的要旧得多。\n\
  \n正如你在本节中看到的，选择你想要支持的技术，而不让人们以及他们使用的浏览器和设备被冷落是可能的。\n\n### Android 和 iOS 对 HTML5\
  \ 的支持\n\n最新版本的 iOS 和 Android 的 HTML5 支持率分别为 47% 和 49%。Opera Mobile 的 HTML5 支持率为\
  \ 58%。与当前的桌面浏览器版本相比，这并不理想，如表 4.1 所示。\n\n**表 4.1.** 现代浏览器中的 HTML5 支持^(2,3,4)\n\n\
  ![image](img/04tab01.jpg)\n\n市场份额数据仅适用于前 10 个网页浏览器，因此部分数据不可用。\n\n然而，当你查看浏览器使用统计数据时，这呈现出一幅完全不同的景象。最新版本的\
  \ Chrome、Firefox、Opera 和 Safari 支持超过 60% 的 HTML5 特性，甚至 IE9 也支持 52% 的 HTML5。但当你看它们的市场份额时，问题就出现了。Chrome\
  \ 10 到 13 拥有最多的 HTML5 支持，但仅占浏览器市场的 17%。事实上，桌面市场中最大的份额仍然属于 Internet Explorer 8、7\
  \ 和 6，在 7 月份占比为 29.6%(1)。\n\n相比之下，iOS 和 Android 拥有近 40% 的市场，而 Opera 的渗透率接近三分之二。这些浏览器在使用最新操作系统的并不清楚，但\
  \ iOS 和 Android 至少有 25% 的 HTML5 支持。\n\n* *\n\n*注意！*Opera Mini 不擅长 HTML5\n\n与它的大兄弟\
  \ Opera Mobile 不同，Opera Mini 的 HTML5 支持并不好——事实上只有 15%。这是一个非常常用的移动浏览器。该浏览器是为非常小的手机（128\
  \ 像素或更小）编写的，表现不像智能手机浏览器。但在你的网页统计数据中，它看起来像 Opera Mobile。你不假设使用 Opera 的设备访问你页面的人都在使用\
  \ Opera Mobile。\n\n* *\n\n正如你在表 4.1 中看到的，人们不升级桌面浏览器，但他们会升级移动浏览器。这是因为他们购买新手机，获得新浏览器，而且许多人每年购买新手机。事实上，有人预测移动用户将在\
  \ 2014 年超过桌面互联网用户，甚至可能更早(5)。通过关注移动开发和 HTML5 应用程序，你将保持技能的竞争力并让你的网站面向未来。\n\n### 检测\
  \ HTML5 功能\n\n现在你已经知道移动设备是驱动 HTML5 开发的重要部分，你可能在想“那么我应该开始检测那些 Android、iOS 和 Opera\
  \ Mobile 浏览器”。但正如上述，检测浏览器或设备虽然诱人，但只会导致挫败。问题在于这些浏览器在编写时具有隐藏自身身份的功能。例如：\n\n• 有些浏览器发送的代理字符串暗示它们是不同的浏览器。\n\
  • 隐私软件可以掩盖代理字符串。\n• 浏览器功能可能会改变，而代理字符串保持不变。\n\n相反，你应该尝试检测你想要使用的 HTML5 功能。当你检测特性而非浏览器时，你永远不需要更新检测脚本。\n\
  \n* *\n\n*你知道吗？：HTML5 包含许多内容\n\nW3C 在 HTML5 技术中包含了八个独立领域，这些小组内存在超过 18 种不同的规范。HTML5\
  \ 仅仅是让所有这些不同标准共同运作的词汇。\n\n\n\n\n在你嗤之以鼻之前，请先思考一下。如果你决定在你的 Web 应用程序中使用地理定位（`第 24 小节`，“将\
  \ HTML5 应用转换为原生应用`”），你可以列出你所知道的所有支持地理定位的浏览器，然后编写或购买一个脚本来支持它们。这样，每当新版本的浏览器发布时，你都必须更新你的脚本。但如果你只是检测地理定位是否可用，那么任何带有地理定位功能的新浏览器都能与你的应用程序配合。\n\
  \n检测 HTML5 功能的四种基本方法是：\n\n- 在全局对象上检查属性\n- 在你创建的元素上检查属性\n- 检查方法是否返回了正确的值\n- 检查元素是否保留了某个值\n\
  \n### 在全局元素上检查属性\n\n每个 HTML5 文档都显示在一个`global element` 中。这通常被称为 `navigator` 或 `window`。\n\
  \n某些 HTML5 属性直接创建在这些全局元素上，如果它们存在，浏览器就可以使用它们。\n\n例如，为了测试离线 Web 应用，你会这样写：\n\n```javascript\n\
  if (window.applicationCache) {\n    document.write(\"是的，你的浏览器可以使用离线 Web 应用。\");\n\
  } else {\n    document.write(\"不，你的浏览器可以使用离线 Web 应用。\");\n}\n```\n\n如果你的浏览器看到了 `applicationCache`\
  \ 项目，它就可以使用离线 Web 应用。\n\n### 在你创建的元素上检查属性\n\n在你创建的元素上检查属性稍微复杂一些，因为你必须创建一个元素来对其测试。在你创建元素后，你可以查看浏览器文档对象模型（DOM）是否识别了它。\n\
  \n**顺带一提**：那个创建的元素并没有真正被创建\n\n你在 DOM 中创建一个元素时，实际上只是在浏览器的内存中创建了一个虚拟元素。你可以使用它进行检测，而它永远不会显示在页面上。\n\
  \n你必须这样这样做，因为你可以向 DOM 中添加任何元素。但如果你添加了一个浏览器不识别的元素，它会为该元素添加标准的全局属性，然后本质上忽略它。如果浏览器识别了它，它会向该元素添加特定于元素的属性。\n\
  \n例如，正如你将在第 10 小节“使用 HTML5 Canvas 元素绘图”中所中学到的，`<canvas>` 元素始终有一个 `context`。因此，如果你在\
  \ DOM 上创建一个 `canvas`，你可以检查是否存在 `context`；如果没有，你就知道浏览器不支持 `<canvas>`：\n\n```javascript\n\
  if (document.createElement('canvas').getContext) {\n    document.write(\"是的，你的浏览器可以使用\
  \ <code>canvas</code> 标签。\");\n} else {\n    document.write(\"不，你的浏览器可以使用 <code>canvas</code>\
  \ 标签。\");\n}\n```\n\n### 检查方法是否返回了正确的值\n\n你通过检查方法是否返回正确的值来验证像 `<video>` 和 `<audio>`\
  \ 元素，这些元素的编码支持方式不同。主要的编码是 WebM 和 H.264。\n\n**顺带一提**：WebM 还是 H.264？\n\n虽然[第 12 小节“HTML5\
  \ 中的音频和视频”将介绍更多细节，但当你使用`<video>` 标签构建 HTML5 页面时，你应该至少意识到两种视频编码：WebM 和 H.264。Safari\
  \ 和 Internet Explorer 不支持 WebM，但你可以为 IE 获取插件。Firefox 和 Opera 不支持 H.264。同时创建并测试这两种编码是重要的。\n\
  \n对于这些类型的元素，你应该首先检查该元素是否具有你预期的属性（如“在你创建的元素上检查属性”节中提到的），然后在假设元素正常的情况下，检查是否存在对所需方法的支持。\n\
  \n因此，要检查 `<video>` 标签对 H.264 的支持，首先检查 `video` 元素是否支持 `canPlayType` 方法：\n\n```javascript\n\
  return !!document.createElement('video').canPlayType;\n```\n\n然后，在支持 `<video>` 的情况下，检查\
  \ H.264 编码：\n\n```javascript\n!!video.canPlayType('video/mp4; codecs=\"avc1.42E01E,\
  \ mp4a.40.2\"')\n```\n\n**亲自尝试：在你的页面上检查 H.264 的支持**\n\n如果你打算在 Web 页面上使用 H.264 视频，你应该确保浏览器支持它，如果它们不支持，你就可以提供一个回退方案。\n\
  \n1. 在文档的 `<head>` 中创建一个脚本：\n```html\n<script>\n```\n2. 编写一个检查支持的函数：\n```javascript\n\
  function rangeCheck() {\n```\n等等，逻辑应该是：\n```javascript\nfunction rangeCheck() {\n\
  \    return !!document.createElement('video').canPlayType;\n}\n```\n3. 编写一个检查 H.264\
  \ 支持的函数：\n```javascript\nfunction h64Check() {\n    if (!rangeCheck()) {\n     \
  \   document.write(\"not\");\n        return;\n    }\n    var video = document.createElement('video');\n\
  \    if (!video.canPlayType('video/mp4; codecs=\"avc1.42E01E, mp4a.40.2\"')) {\n\
  // ...\n}\n\n\n\n条件注释是仅 IE 支持的注释。它们使用 `if` 语句来检查 IE 的特定版本。如果你在文档的 `<head>` 中使用它们，就可以只为需要的\
  \ IE 版本加载 `html5shiv` 脚本。\n\n为了在 IE 8、7 和 6 中支持 HTML5，请在你的 HTML5 文档的 `<head>` 中添加以下内容：\n\
  \n```html\n<!--[if lt IE 9]>\n<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n<![endif]-->\n```\n\n然后，只需添加任何新的 HTML5 标签并为它们应用一些样式即可。当你在旧版本的 Internet\
  \ Explorer 中测试时，新标签将拥有样式。\n\n***\n\n## 注意！`HTML5` 仅能让 IE 识别标签\n\n`HTML5shiv` 脚本告诉\
  \ Internet Explorer 将新的 HTML5 标签识别为 HTML。它并没有为标签添加功能。因此，通过该脚本，Internet Explorer\
  \ 8 会识别出它可以对 `<article>` 标签应用样式，但不会在 `<canvas>` 标签中画出一个圆。你仍然需要像本节之前的章节解释的那样去检测支持情况。\n\
  \n***\n\n### 优雅降级\n\n检测 HTML5 功能的技巧不在于它们工作时你做什么，而在于它们不起作用时你做什么。在完全无法使用的页面顶部看到“此页面仅在\
  \ Internet Explorer 中运行。请升级您的浏览器”这样的信息以前很常见。当然，大多数使用 Internet Explorer 之外浏览器的人通常已经认为自己的浏览器是一种升级了，并且不太可能为了看一个网站就切换到\
  \ IE。他们更有可能付一笑，再也不访问那个网站了。\n\n在 IE 占据大多数浏览器份额的时候，要求人们切换到 IE 几乎是可以理解的，但现在 IE 只是许多同样优秀的浏览器之一，按照事物变化的速度，IE\
  \ 在不久后可能甚至不再是最流行的了。\n\n如今，最好的方法是考虑你想包含哪些功能，然后对网站进行降级，使得功能较少的浏览器获得较少的功能，但仍获得一个可用的网站。这种做法被称为*优雅降级*（graceful\
  \ degradation），它是一种容错系统。\n\n优雅降级的核心思想是：即使系统的一个或多个组件故障，系统也应该继续运行。在 Web 设计中，这意味着即使浏览器没有完全支持\
  \ HTML5 组件，你的网页也应该能够继续工作。\n\n一个很好的例子是 `<video>` 标签。该标签需要对浏览器内置视频解码器的支持，以及对 `<video>`\
  \ 标签的支持。如果缺少任何一种支持，你的视频将无法播放。发生这种情况时，你有几种选择：\n\n• 忽略问题并显示任何内容或错误消息——无论浏览器决定做什么。\n\
  \n• 检测问题并告诉用户升级浏览器。\n\n• 检测问题并提供回退机制。\n\n最好的解决方案是检测问题并提供回退机制。通过这种解决方案，你意识到并不是所有的浏览器或用户都是相同的，并且你尝试通过提供替代方案来缓解问题。\n\
  \n记住，解决方案不必是完美的。首先，你希望让人们切换到更符合 HTML5 标准的浏览器是值得的，而通过用另一种语言创建你网站的完整副本，不仅违背了这一目的，还可能让你需要的工作量翻倍。\n\
  \n***\n\n### 亲自尝试一下：选择降级方案\n\n优雅降级的秘密在于做出正确的选择。\n\n**1.** 为最佳特性，选择你的 HTML5 应用将支持哪些技术。这是你的终极应用——只有尖端用户才能看到的应用。\n\
  \n**2.** 决定哪些功能对应用的功能是绝对关键的。这不应该与你在第一步中列出的列表相同。只选择那些绝对关键的功能。如果你发现很难决定，想一下你如何在 Twitter\
  \ 推文中描述这个应用——140 个字符或更少。这些功能就是你的核心功能。它们是你的应用为了让所有读者都能使用的最小功能。\n\n**3.** 为你的核心功能制定一份回退计划。根据你的用户是谁，你可能需要为这些功能的回退提供回退。记住，这些是为了让应用程序运行而*必须*保持运行的项目。\n\
  \n**4.** 最后，为你的最佳特性提供回退选项。因为这些功能是否完美运行并不那么关键，你可以对你的回退方案稍微松宽一些。\n\n目标是创建一个在尽可能多的平台上具有核心功能的应用程序。然后，随着你的读者改进他们的工具，他们也会认为你的应用程序也在改进。\n\
  \n***\n\n### 使用 CSS3 媒体查询检测移动浏览器\n\nCSS2 引入了依赖媒体的样式表，允许设计师为不同类型的媒体创建单独的样式表。例如，你可以为以下创建样式表：\n\
  \n• **all—**—所有媒体类型\n\n• **aural—**—语音合成器\n\n• **braille—**—盲文设备\n\n• **embossed—**—分页盲文打印机\n\
  \n• **handheld—**—小型设备（通常是单色的）\n\n• **print—**—纸张格式和“打印预览”\n\n• **projection—**—投影仪\n\
  \n• **screen—**—彩色计算机屏幕\n\n• **tty—**—具有固定等距字符网格的打字机\n\n• **tv—**—具有低分辨率、色彩和声音的电视设备\n\
  \n要在样式表上定义媒体类型，你可以将其添加到带有 `media` 属性的样式表中，例如：\n\n```html\n<style media=\"screen\"\
  >\n```\n\nCSS3 扩展了 `media` 属性，允许你根据各种条件检查用户代理。如果浏览器或设备满足这些条件，就会交付该样式表。例如，你可能想为小屏幕交付不同的样式表：\n\
  \n```html\n<link rel=\"stylesheet\" media=\"screen and (max-width:480px)\" href=\"\
  style.css\">\n```\n\n你可以针对以下媒体特性进行测试：\n\n• 屏幕宽度\n\n• 屏幕方向\n\n• 屏幕和设备的宽高比\n\n• 颜色数量、是否单色以及色彩位深\n\
  \n• 分辨率\n\n• 电视设备的扫描过程\n\n• 网格或位图设备\n\n#### 检测宽度和高度\n\n你可以检测设备的宽度和高度或可视区域的宽度和高度。换句话说，`width`\
  \ 关键字适用于可视区域，而 `device-width` 关键字适用于设备。`height` 和 `device-height` 关键字对于高度也是如此。\n\
  \n***\n\n## 注意！测试媒体查询可能会变得\n\n如果你将 `max-device-width` 设置为 480px 以向小屏幕显示不同的样式表，你无法通过调整浏览器大小来测试。`device-width`\
  \ 关键字知道你的浏览器具有更大的实际尺寸，即使你将其调整得很小。为了补偿，你也可以使用 `width` 关键字。\n\n***\n\n虽然你可以设置样式表仅适用于你寻找的精确宽度，但使用\
  \ `min-` 和 `max-` 扩展更为有效。\n\n***\n\n### 亲自尝试一下：为较小的移动设备附加样式表\n\n判断可能在使用移动设备的一种简单方法是看屏幕宽度。许多智能手机的屏幕宽度只有\
  \ 480px，所以为它们创建一个样式表是合理的。\n\n**1.** 编写你的样式表链接：\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"smartphone.css\">\n```\n\n**2.** 添加媒体类型：\n\n```html\nmedia=\"screen\"\n\
  ```\n\n**3.** 在你的链接中添加 `max-width` 和 `max-device-width` 关键字：\n\n\n\n\n\n```css\n\
  media=\"screen and (max-width: 480px), screen and (max-device-width: 480px)\"\n\
  ```\n\n**4.** 包含 `only` 关键字，以便你的样式表不会被旧版浏览器忽略：\n\n```css\nmedia=\"only screen and\
  \ (max-width: 480px), only screen and (max-device-width: 480px)\"\n```\n\n完成后的链接如下：\n\
  \n```html\n<link rel=\"stylesheet\" media=\"only screen and (max-width: 480px),\
  \ only screen and (max-device-width: 480px)\" href=\"smartphone.css\">\n```\n\n\
  ## 检查屏幕方向\n\n平板电脑和平某些智能手机在方向改变时会改变宽度。你可以使用 `orientation` 关键字来测试设备正在显示的是种种方向：\n\n\
  ```css\nonly screen and (orientation: landscape)\nonly screen and (orientation:\
  \ portrait)\n```\n\n## 检查宽高比例\n\n你可以使用 `aspect-ratio` 关键字为具有特定、最大或最小宽高比例的设备创建样式。该比例定义为\
  \ `device-width` 除以 `device-height`，并在数字之间加上斜杠。例如，你可能会看到的两种常见比例是 16:9 和 4:3。它们的写法为：\n\
  \n```css\nonly screen and (aspect-ratio: 16/9)\nonly screen and (aspect-ratio: 4/3)\n\
  ```\n\n## 检查颜色\n\n媒体查询允许你测试多种颜色选项：\n\n- `color`——测试颜色或每个颜色分量的位深度，例如 8 位色或 24 位色。\n\
  - `color-index`——测试媒体可以显示的颜色数量，例如 256 色显示器。\n- `monochrome`——测试单色显示器或单色显示中每个像素的位深度。\n\
  \n你可以在所有这些选项中使用 `min-` 和 `max-` 前缀进行测试。\n\n## 检查分辨率\n\n测试具有特定分辨率的设备很容易——只需使用 `resolution`\
  \ 关键字测试各种每英寸点数（dpi）。你还可以指定 `min-` 和 `max` 前缀来为低分辨率和高分辨率机器显示样式表。\n\n4G iPhone 和 iPod\
  \ touch 使用高定义 Retina 显示。你可以使用 WebKit 关键字进行测试：`-webkit-min-device-pixel-ratio`。要仅显示给\
  \ Retina 设备，你可以写：\n\n```css\nonly screen and (-webkit-min-device-pixel-ratio: 2)\n\
  ```\n\n## 检查电视和网格设备\n\n你可以使用 `scan` 和 `grid` 关键字来检查电视设备的扫描过程，或者 tty 或盲文设备是基于网格还是位图的：\n\
  \n```css\nonly tv and (scan: progressive)\nonly tty and (grid)\n```\n\n## 测试你的应用程序\n\
  \n测试应用程序（尤其是移动应用程序）可能是困难的。但是创建任何网页或应用程序的关键步骤。然而，你不需要为了测试去购买市场上的每一个平板电脑。\n\n以下是你测试移动应用程序时应该采取的步骤：\n\
  \n- 首先在桌面桌面浏览器中进行测试。如果你像大多数开发者一样，你有一个一直使用的喜爱的浏览器，但请务必下载其他浏览器进行测试。\n- 更改浏览器的大小。当你使用\
  \ CSS3 媒体查询时，浏览器窗口显示区域的宽度就可能影响页面的呈现。你可以通过调整浏览器窗口来实现。如果你使用 Firefox 或 Chrome，可以安装免费的\
  \ Web Developer 扩展（`chrispederick.com/work/web-developer/`，“将 Web 应用程序转换为移动端](#ch08.html_ch08)”讨论了更多关于如何使用模拟器。\n\
  - 检查你关心的任何回退浏览器。你可以在本地机器上（或在虚拟机中）或使用 Browsershots（http://browsershots.org/）等在线工具进行测试。\n\
  \n#### 总结\n\n在本节中，你学到了你不应该询问如何检测浏览器、设备或 HTML5。相反，你应该决定你的网站需要什么技术，并针对这些精确的支持进行检测。这样你就不再依赖于了解每个浏览器和设备的所有功能，也不需要测试你从未用过的\
  \ HTML5 Aspect。\n\n为了进行这种检测，你学习了测试 HTML5 技术的四种方法，以及如何使用 CSS3 媒体查询针对特定设备。你还学习了优雅降级或容错的重要性，以及如何确保你的网站在大多数用户代理中看起来良好。最后，你被给了五个测试应用程序的步骤，以确保你的检测脚本和查询正常工作。\n\
  \n### 问答\n\n**Q. 我注意到你没有确切告诉我应该支持和检测什么。你能给我关于我应该检测的 HTML5 最重要功能的一个线索吗？**\n\n**A.**\
  \ 如果你正在编写 HTML5 文档，你应该始终包含本文提到的 `HTML5shiv` 脚本和条件注释。这确保了 IE 6、7 和 8 有机会正常显示。但除此之外，这取决于你的应用程序。如果你不使用\
  \ `<canvas>` 标签，那么检测它是没有意义的。第 8 节涵盖了你可以安装在网站上的某些特定检测脚本。\n\n**Q. 我真的想检测特定的浏览器或设备，因为我知道我的网站不支持它们。我可以做什么？**\n\
  \n**A.** 你始终可以使用检测脚本来检测特定浏览器。但它们带来的麻烦可能大于收益。你可以在 Quirks Mode 找到一个好的：http://www.quirksmode.org/js/detect.html\n\
  \n**Q. 如果我想将用户重定向到一个完全不同的域名怎么办？我该如何做？**\n\n**A.** 实现此的一种方法是在移动设备上使用 `.htaccess`。在\
  \ Apache Web 服务器根目录下的 `.htaccess` 文件中添加以下内容：\n\n```apache\nRewriteCond %HTTP_USER_AGENT\n\
  \"android|blackberry|ipad|iphone|ipod|iemobile|opera mobile|palmos|webos|googlebot-mobile\"\
  \ [NC]\nRewriteRule ^(.*)$ http://m.yoursitename.com/ [L,R=302]\n```\n\n此脚本检查 Android、Blackberry、iPad、iPhone、iPod、Windows\
  \ Mobile、Opera Mobile、PalmOS、WebOS 和 Google 机器人，并将它们重定向到你的移动站点 http://m.yoursitename.com/。\n\
  \n## 练习\n\n练习包含了帮助你处理本内容的问题。在阅读答案之前，尝试回答所有问题。答案请参见附录 A](#app01.html_app01)，“问题解答](#app01.html_app01)”。\n\
  \n### 测验\n\n1. 在本文编写时，哪个桌面浏览器和哪个移动浏览器对 HTML5 的支持最高？\n\n2. 为什么你会编写一个检测脚本来检测你创建的元素的某个属性？\n\
  \n3. 为什么你应该关心优雅降级？\n\n### 练习题\n\n1. 写下你的容错计划。确保包含你的网站应该支持的最小和最大范围，以及每种情况下的回退方案。\n\
  \n\n\n\n\n## 2. 在你准备好备用方案后，请研究如何对可能需要备用选项的技术进行测试。一个极好的资源是 Mark Pilgrim 的检测几乎任何内容的指南)。\n\
  \n## 第 5 小时：JavaScript 和 HTML5 Web 应用\n\n***在本小时你将学到：***\n\n• 什么是 JavaScript 以及如何安装脚本\n\
  • 如何为文本和图像创建鼠标悬停效果（rollo）\n• 使用 `jQuery` 进行动态表单验证\n• 使用 `jQuery Mobile` 创建移动应用程序有多简单\n\
  \nWeb 设计由三部分组成：内容、样式和行为。在之前的几个小时中，你学习了 HTML（内容）和 CSS（样式）。JavaScript 就是行为。在你的设计中包含这三个层并保持它们相互分离是非常重要的。\n\
  \n在本小时中，你将学习 JavaScript 是什么以及如何将它添加到你的网页中。它还提供了一些脚本帮助你入门。\n\n接下来，本小时将向你介绍一个名为 `jQuery`\
  \ 的 JavaScript 框架。该框架让设计师和开发者能够轻松地为页面添加脚本。本小时还包含了几个 `jQuery` 脚本。\n\n最后，本小时将向你介绍一个移动框架——`jQuery\
  \ Mobile`。该框架让构建看起来和操作起来像移动应用的 HTML 文档变得简单。\n\n### 什么是 JavaScript？\n\nJavaScript\
  \ 是一种编程语言，你可以用它影响用户界面并创建动态网站。你可以用它影响文档对象模型（`DOM`）来控制页面上的元素，包括颜色、大小、位置，甚至是元素本身的可见性，并打开新的浏览器窗口。\n\
  \n要在网页中添加 JavaScript，你需要使用 `<script>` 标签。你可以将脚本放置在文档的 `<head>` 或 `<body>` 中。你还可以在任何事件属性中触发脚本函数，例如\
  \ `onmouseover` 或 `onload`。\n\n### 动手尝试：在页面上添加简单的脚本\n\n几乎每个程序员学习的第一个程序都是如何在屏幕上显示“Hello\
  \ World”。你也可以用 JavaScript 实现。\n\n**1.** 像往常一样创建你的网页：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Simple JavaScript</title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n**2.** 在页面的 `<head>` 中添加脚本标签：\n\n```html\n<script>\n</script>\n\
  ```\n\n**3.** 在脚本标签内添加 JavaScript 函数 `hello()`，在弹窗窗口中写入“Hello World”：\n\n```javascript\n\
  function hello() {\n    alert(\"Hello World\");\n}\n```\n\n**4.** 在文档的 `<body>`\
  \ 中添加一个链接来调用该脚本：\n\n```html\n<a href=\"#\" onclick=\"hello();\">Click Me</a>\n```\n\
  \n**5.** 在链接下方包含一个 `<noscript>` 标签，并提供备用文本：\n\n```html\n<noscript>\n<p>Hello World</p>\n\
  <p>This text is not written with JavaScript.</p>\n</noscript>\n```\n\n完整的 HTML 文档如下：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Simple JavaScript</title>\n\
  \    <script>\n        function hello() {\n            alert(\"Hello World\");\n\
  \        }\n    </script>\n</head>\n<body>\n    <a href=\"#\" onclick=\"hello();\"\
  >Click Me</a>\n    <noscript>\n        <p>Hello World</p>\n        <p>This text\
  \ is not written with JavaScript.</p>\n    </noscript>\n</body>\n</html>\n```\n\n\
  上一小时讨论了容错性。这适用于 JavaScript 就像适用于 HTML5 一样，但与 HTML5 不同，JavaScript 提供了一个内置的容错函数——`<noscript>`\
  \ 标签。\n\n`<noscript>` 标签可以包含任何你需要的为脚本内容提供替代方案的 HTML。那么，当人们在关闭 JavaScript 或使用不支持脚本的代理程序访问你的页面时，他们会看到\
  \ `<noscript>` 标签中的内容。\n\n一些最常见的网页脚本包括：\n\n• 鼠标悬停效果（Rollovers）\n• 验证表单数据\n• 打开新窗口\n\
  • 设置 cookie\n\n### 创建鼠标悬停效果\n\n鼠标悬停效果是与用户交互的一种很好的方法。它们为页面添加了某些交互性，而不会对无法查看 JavaScript\
  \ 的用户产生负面影响。\n\n创建悬停效果最简单的方法是在链接上使用 CSS 而不是 JavaScript。你只需要为标准链接添加样式，然后为悬停状态添加不同的样式。例如：\n\
  \n```css\na:link { color: blue; }\na:hover { color: purple; }\n```\n\n这创建了一个蓝色的链接，当鼠标悬停在其上方时，链接会变为紫色。\n\
  \n**注意！悬停效果与移动端不兼容**\n\n切勿在应用程序的关键功能中使用悬停效果，特别是如果你计划吸引移动端客户时。智能手机和平板电脑等移动设备没有悬停链接的方法。相反，它只会被被点击。如果你设置了诸如弹出窗口等内容，移动用户将永远看不到它们。\n\
  \n### 动手尝试：显示额外内容\n\n你可以用 JavaScript 和 CSS 添加额外的文本。\n\n**1.** 创建你的段落，并包含额外内容：\n\n\
  ```html\n<p>This is popup</p>\n```\n\n**2.** 在文本周围添加一个 `<span>` 标签并给它一个 ID 为 `\"\
  popup\"`：\n\n```html\n<span id=\"popup\">extra content</span>\n```\n\n**3.** 为 `#popup`\
  \ ID 设置样式，并确保包含 `display: none;`：\n\n```css\n#popup {\n    display: none;\n    width:\
  \ 100px;\n    position: relative;\n    background-color: #efef;\n    color: blue;\n\
  }\n```\n\n**你知道吗？Display 与 Visibility**\n\n当你用 CSS 隐藏内容时，可以使用两个属性：`display` 和 `visibility`。起初它们看起来一样，但了解它们的区别很重要。当你使用\
  \ `display: none;` 从页面移除一个元素时，你完全删除了它；就像它从未存在过一样。当你使用 `visibility: hidden;` 移除时，你只是隐藏了它。它仍然占据空间。\n\
  \n**4.** 在段落的 `onmouseover` 和 `onmouseout` 状态添加 JavaScript，以开启和关闭文本：\n\n`<p onmouseover='document.getElementById(\"\
  popup\").style=\"inline\"' onmouseout='document.getElementById(\"popup\").style=\"\
  none'\">`\n\n### 验证表单数据\n\n当你的网站上有一个表单时，你希望确保人们填写正确。这就是验证。JavaScript 允许你在数据发送到 Web\
  \ 服务器之前对其进行验证。\n\n在使用 JavaScript 验证表单数据时，你应该意识到绕过它非常简单。人们绕过验证只需要关闭 JavaScript、提交表单，然后重新开启。如果数据的正确性至关重要，你应该在服务器端进行验证。\n\
  \n你可以在网上找到许多预构建的用于验证各种表单数据的脚本，只需在你喜爱的搜索引擎中搜索“form validation”即可。\n\n\n\n\nCookies\
  \ 是存储在本地机器上的小段数据。它们允许 Web 开发人员在本地机器存储网站之外的数据。开发者可以在 Cookie 中存储从登录凭据到游戏信息等任何他们想要在以后使用的所有内容。JavaScript\
  \ 让设置、读取和删除 Cookie 变得简单。\n\nCookies 以 `name=value` 的对的形式保存，它们具有过期日期以及在服务器上可以从中读取的路径。以下是使用\
  \ JavaScript 写入 Cookie 的示例：\n\n```javascript\ndocument.cookie = 'name=value; expires=Day,\
  \ dd Mon yyyy hh:mm:ss UTC; path=/';\n```\n\n要读取 Cookie，你需要将 `document.cookie` 读取为字符串并解析它，寻找等号或分号。通过用分号分割\
  \ Cookie，你可以更方便地查看 name=value 节点。\n\n要删除 Cookie，你只需要将 Cookie 的值设置为 `-1`。\n\n这里有三个你可以用于设置、读取和删除\
  \ Cookie 的函数。此函数用于创建或“设置” Cookie：\n\n```javascript\nfunction createCookie(name,value,expireDays)\
  \ {\n    if (expireDays) {\n        var date = new Date();\n        date.setTime(date.getTime()+(expireDays*24*60*60*1000));\n\
  \        var expires = \"; expires=\"+date.toGMTString();\n    }\n    else var expires\
  \ = \"\";\n    document.cookie = name+\"=\"+value+expires+\"; path=/\";\n}\n```\n\
  \n此函数读取 Cookie：\n\n```javascript\nfunction readCookie(cookieName) {\n    var name\
  \ = cookieName + \"=\";\n    var ca = document.cookie.split(';');\n    for(var i=0;i\
  \ < ca.length;i++) {\n        var c = ca[i];\n        while (c.charAt(0)==' ') c\
  \ = c.substring(1,c.length);\n        if (c.indexOf(name) == 0) return c.substring(name.length,c.length);\n\
  \    }\n    return null;\n}\n```\n\n此函数删除 Cookie：\n\n```javascript\nfunction eraseCookie(cookieName)\
  \ {\n    createCookie(cookieName,\"\",-1);\n}\n```\n\n## 什么是 jQuery?\n\n以上关于 JavaScript\
  \ 的信息都很有趣，它们向你展示了 JavaScript 为网页可以做的一些事情。但你可能会注意到，当你从头编写 JavaScript 时，规划、设计和构建一个项目需要花费大量时间。\n\
  \n事实上，大多数开发者倾向于寻找可以根据自己的需求修改的预写脚本，而不是从头开始编写。\n\n但你可以使用比原生 JavaScript 更好的东西——jQuery。jQuery\
  \ 是一个 JavaScript 库，旨在帮助你尽可能地创建跨平台、多功能的 JavaScript 网站。\n\n***\n\n**顺便说**：不需要了解 JavaScript\n\
  \n学习编写 jQuery 的好处是，你不需要学习 JavaScript 就能使用它。事实上，即使你不知道 JavaScript，可能也能猜出这行 jQuery\
  \ 代码的作用：\n\n```javascript\n$(\".red\").css(\"background-color\", \"#f00\");\n```\n\
  \n如果你猜到它是在为所有类名为 `red` 的元素设置一个红色（`#f00`）背景，那么你是正确的。\n\n***\n\n## 尝试一下：开始学习 jQuery\n\
  \njQuery 非常容易使用，即使是不写任何代码的设计师也能读懂。按照以下步骤在点击链接时添加一个警告框（alert）。\n\n**1.** 获取一个 jQuery\
  \ 副本。你可以在 [`docs.jquery.com/Downloading_jQuery`](http://docs.jquery.com/Downloading_jQuery)\
  \ 下载最新版本的 jQuery。将此文件保存为 `.js` 文件并上传到你的 Web 服务器。你可以将其放在任何目录；只需记住你把它放在了哪里。\n\n**2.**\
  \ 编写一个基础网页并添加一个指向你的 `jquery.js` 文件的 `<script>` 标签：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Testing JQuery</title>\n    <script src=\"jquery.min.js\"\
  ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n**3.** 在你的 HTML 中写一个链接：\n\n\
  ```html\n<a href=\"#\">点击我</a>\n```\n\n**4.** jQuery 广泛泛地使用 DOM，因此你需要确保 DOM 已经准备好可以操作。以下代码被称为文档就绪处理程序（document-ready\
  \ handler）。将此添加到你的 jQuery 脚本下方的新脚本中：\n\n```javascript\n$(document).ready(function(){\n\
  });\n```\n\n**5.** 现在告诉 jQuery 要做什么以及什么时候做。在这种情况下，你希望在点击链接时打开一个警告框。将此添加到文档就绪处理程序中：\n\
  \n```javascript\n$(\"a\").click(function(event){\n    alert(\"Hello World\");\n\
  });\n```\n\n（注：原文后续部分存在大量重复的指令和代码，已根据要求在翻译中去除了重复的行和句落。）\n\n\n\n\n<label for=\"email\"\
  >邮箱：</label> <span id=\"emailInfo\">请使用有效的邮箱地址</span></span><br>\n\n<input type=\"\
  email\" size=\"30\" id=\"email\"><br>\n\n<label for=\"message\">留言：</label> <span\
  \ id=\"messageInfo\"></span><br>\n\n<textarea rows=\"5\" cols=\"27\" id=\"message\"\
  ></textarea><br>\n\n<button type=\"submit\" name=\"submit\">提交</button>\n\n</form>\n\
  \n注意，所有三个输入字段旁边都有一个`<span>`标签。虽然姓名和邮箱字段有文本，但 `textarea` 没有。这个标签为我们在需要时提供了一个添加错误代码的地方。\n\
  \n## 2. 编写你的 CSS 来设置表单字段、信息标签和错误类：\n\n```css\n#contactForm input, #contactForm textarea\
  \ {\n    width: 400px;\n    border-radius: 1em;\n    -moz-border-radius: 1em;\n\
  \    -webkit-border-radius: 1em;\n}\n#contactForm span {\n    color: #999;\n}\n\
  #contactForm span.error {\n    color: #C00;\n}\n#contactForm input.error {\n   \
  \ background-color: #465f82;\n}\n```\n\n## 3. 现在添加你的 jQuery；首先添加 jQuery 自身的链接，然后添加\
  \ document-ready 函数，你可以在其中放入其余脚本：\n\n```html\n<script src=\"jquery.min.js\"></script>\n\
  <script>\n$(document).ready(function(){\n};\n</script>\n```\n\n## 4. 添加几个变量，以便脚本更易读：\n\
  \n```javascript\nvar form = $(\"#contactForm\");\nvar name = $(\"#name\");\nvar\
  \ nameInfo = $(\"#nameInfo\");\n```\n\n## 5. 编写一个函数检查姓名字段是否已填写：\n\n```javascript\n\
  function requiredName() {\n    if (name.val().length < 1) {\n        name.addClass(\"\
  error\");\n        nameInfo.text(\"姓名是必填项\");\n        nameInfo.addClass(\"error\"\
  );\n        return false;\n    } else {\n        name.removeClass(\"error\");\n\
  \        nameInfo.text(\"你的全名是什么？\");\n        nameInfo.removeClass(\"error\");\n\
  \        return true;\n    }\n}\n```\n\n## 6. 当用户离开表单字段或切换出字段时，调用姓名字段验证：\n\n```javascript\n\
  name.blur(requiredName);\nname.keyup(requiredName);\n```\n\n## 7. 对表单中的邮箱和留言字段重复步骤\
