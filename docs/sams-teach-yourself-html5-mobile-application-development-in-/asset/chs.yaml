  \n## 附录 C：HTML5 和移动应用资源\n\n### 书籍\n### 网站\n### 本书的网站\n\n## 索引\n\n## 前言\n\n如今网页的变化非常快。新浏览器版本每几个月就会发布一次，而不是每几年一次，新设备不断进入市场。对于\
  \ Web 开发者来说，关注最新的趋势和技术非常重要，而现在的趋势技术就是 HTML5。\n\n事实上，一些新闻媒体声称 HTML5 和移动应用程序是就业机会增长最快的两个领域之一。根据\
  \ [Freelancer.com](http://Freelancer.com) 和 iTWire 的数据，2011 年第一季度对熟悉 HTML5 的自由职业者的需求增加了\
  \ 34%，而普通 HTML 工作的工作仅增长了 7%。他们还注意到，Android 相关工作增长了 20%，iPhone 相关工作增长了 9%。HTML5 和移动应用程序是机会所在，本书可以帮助你学习所有关于\
  \ HTML5 以及与其相关的应用程序编程接口（APIs）。在 24 小时后，你将能够构建复杂的 Web 应用程序并将它们转换为原生移动应用程序。\n\n##\
  \ HTML5 不仅仅是 HTML\n\n本书的内容不仅仅是 HTML 标签和属性。虽然这些是 HTML5 规范的基础，但当人们谈论 HTML5 时，他们通常包括\n\
  \n## 网页不仅仅是计算机\n\n如今网页的变化非常快。新浏览器版本每几个月就会发布一次，而不是每几年一次，新设备不断进入市场。对于 Web 开发者来说，关注最新的趋势和技术非常重要，而现在的趋势技术就是\
  \ HTML5。\n\n## 如何使用本书\n\n本书分为 24 小节。每节大约持续一小时。\n\n## 本书的结构\n\n本书分为三个部分：\n\n- 第一部分，使用\
  \ HTML5 构建网页` 教你 HTML5 的基础知识并向你展示如何构建应用程序。\n- 第二部分，学习 HTML5 核心要素` 涵盖了 HTML5 一一些重要的新特性，帮助你构建更好的应用程序。\n\
  - 第三部分，用于移动和 Web 应用的 HTML5` 描述了一些用于移动应用程序开发的实用 API 和工具。\n\n## 本书使用的规范\n\n代码示例在书正中使用`等宽字体`编写，而代码块则会单独列出，例如：\n\
