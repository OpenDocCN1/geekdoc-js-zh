  ## 第 20 小时：离线应用程序\n\n**本小时你将学习：**\n\n- 为什么要构建离线应用\n- 如何使用缓存\n- 如何检测在线状态\n\n桌面计算机和移动设备之间的一个关键区别是，移动设备会离线。\n\
  \n### 构建离线应用和转换应用\n\n为移动设备创建 Web 应用的困难之一是用户经常离线。\n\n### 注意！你必须存储用户数据\n\n离线 Web 应用程序规范没有提供访问应用程序收集的数据。如果你的应用程序保存状态或存储任何数据，你需要使用\
  \ Web 存储在用户离线时本地存储这些数据，并在他们回来时与服务器同步。\n\n几个新功能可以帮助你构建离线应用程序：\n\n- `window.navigator.onLine`——这是文档对象模型（DOM）中的一个标志，用于指示用户代理是否在线。值为\
  \ `true` 或 `false`。\n- `checking`——当用户代理正在检查更新时触发此事件。\n- `noupdate`——如果清单（manifest）没有更改，则触发此事件。\n\
  - `downloading`——当用户代理首次下载更新的清单或清单列出的资源时触发此事件。\n- `progress`——当用户代理下载清单中列出的事件时触发的进度事件。\n\
  - `cached`——当应用程序的所有文件下载完成时触发此事件。\n- `updateready`——当文件已重新下载且脚本可以使用 `swapCache()`\
  \ 方法切换到新缓存时触发此事件。\n- `obsolete`——当清单出现 404 或 410 错误时触发此事件，应用程序缓存将被删除。\n- `error`——当清单为\
  \ 404 或 410、引用清单的页面下载失败、获取文件时发生致命错误或在运行更新运行时清单发生变化时触发此事件。\n\n\n\n\n\n离线 Web 应用几乎支持\
  \ Internet Explorer 9 以及 Opera Mini 5 和 6 以外每一个浏览器。它被 Android 2.1+、iOS 3.2+、Opera、Chrome、Safari\
  \ 4+ 以及 Firefox 完全支持。\n\n你只需要做几件事就可以将应用程序转换为离线应用：\n\n1. 创建一个缓存清单（cache manifest），其中包含应用程序使用的每个文件（包括图像、CSS\
  \ 和 JavaScript）。\n2. 在每个 HTML 文件中通过 `<html manifest=offline.manifest>` 添加缓存清单。\n\
  \n完成这两项工作后，你的应用程序就变成离线应用了。本节接下来的时间将教你具体如何执行这两个步骤。\n\n## 缓存清单\n\n缓存清单是驱动你的离线 Web\
  \ 应用的文件。它列出了应用程序在断开网络连接时需要访问的所有文件和资源。\n\n*顺便一下*：确保你的清单具有正确的 MIME 类型\n\n缓存清单必须以内容类型\
  \ `text/cache-manifest` 提供，否则它将无法工作。你可以在 Web 根目录下的 `.htaccess` 文件中对 Apache 服务器进行设置，包含此行：`AddType\
  \ text/cache-manifest .manifest`。然后，你需要确保所有的清单文件都以 `.manifest` 结尾。\n\n缓存清单分为三个部分：\n\
  \n- **显式（Explicit）—**：定义要缓存的文件。\n- **在线白名单（Online whitelist）—**：定义不应被缓存的项目。\n- **回退（Fallback）—**：定义无法缓存的在线资源的替代方案。\n\
  \n### 使用缓存清单文件\n\n要使用缓存清单，你需要在 `<html>` 元素中添加 `manifest` 属性。例如：\n\n```html\n<html\
  \ manifest=\"offline.manifest\">\n```\n\n任何想要离线存储的文件指向缓存清单。当用户代理访问该页面时，用户代理会将该页面添加到缓存中。某些用户代理会自动执行，而另一些会询问用户是否想要缓存应用程序，如图\
  \ 20.1 所示。\n\n**图 20.1.** Firefox 询问缓存应用程序。\n\n![image](img/20fig01.jpg)\n\n###\
  \ 编写缓存清单\n\n简单的缓存清单仅包含显式部分，列出应缓存的文件。这是一个缓存三个页面的有效缓存清单示例：\n\n```\nCACHE MANIFEST\n\
  pets.html\npets-auto.html\npets-mckinley.html\n```\n\n第一行*始终*是 `CACHE MANIFEST`。如果该文件的第一行不是它，清单将无法工作。\n\
  \n接下来的三行是显式部分——即三个被缓存的文件：`pets.html`、`pets-auto.html` 和 `pets-mckinley.html`。你也可以通过在这三个文件上方添加\
  \ `CACHE:` 单词来指示这是显式部分。例如：\n\n```\nCACHE MANIFEST\nCACHE:\npets.html\npets-auto.html\n\
  pets-mckinley.html\n```\n\n文件是相对于缓存清单文件的位置列出的。由于没有目录信息，你知道这些文件与缓存清单在同一个目录。。你也可以使用完整的\
  \ URL，例如：\n\n`http://www.html5in24hours.com/examples/pets-cache-manifest-example.html`\n\
  \n或者你可以使用其他目录下的 URL，例如：\n\n`images/pets/mckinley1.jpg`\n\n唯一的注意事项是 URL 必须解析到有效文件。\n\
  \n*注意！*：缓存安全页面\n\n如果你有通过加密连接（如 SSL 或 https）提供的页面，并且希望它们可以被缓存，你需要从同一个安全域提供清单和所有文件。你不能在安全清单中包含来自另一个域的文件。\n\
  \n在线白名单部分定义了网站中不应缓存的区域。你使用单词 `NETWORK:` 定义在线白名单的区域。例如：\n\n```\nCACHE MANIFEST\n\
  pets.html\npets-auto.html\npets-mckinley.html\nNETWORK:\nonline-only-page.html\n\
  ```\n\n这告诉用户代理 `online-only-page.html` 文件不应被缓存，并且只有在用户在线时才可用。这对于确实需要在线的文件非常好，例如跟踪脚本、多人游戏等。\n\
  \n默认的在线白名单是 `*`，这意味着网站上的每个文件都应该在时可用。你可以这样为网站上的每个页面设置白名单：\n\n```\nNETWORK:\n*\n```\n\
  \n*顺便一下*：为什么要显式地为整个网站设置白名单？\n\n当你使用 `*` 为整个网站设置白名单时，有助于你的网站在用户在线时表现得更正常。这是因为在启用离线的应用程序中，缓存具有优先级。如果没有通配符标记，如果你添加了来自另一个域（如\
  \ `CDN`）的图像或视频，即使用户在线，它也不会加载。\n\n回退部分为你提供了一种方法，指定当页面离线状态不可用时用户代理应该做什么。回退部分如下：\n\n\
  ```\nFALLBACK:\n/ /offline.html\n```\n\n该行的第一部分是一个模式，描述了哪些文件应该应用回退。在前面的示例中，斜杠（`/`）意味着服务器上的每个文件（从根目录开始）如果在离线状态不可用，都应该提供\
  \ `/offline.html` 文件。\n\n你可以为离线回退指定多个选项。因此，如果你希望网站的一个部分接收一个回退页面，而其他部分接收另一个，你可以这样写：\n\
  \n```\nFALLBACK:\n/ /main-offline.html\n/examples/ /examples/example-offline.html\n\
  ```\n\n此清单告诉用户代理将整个网站的回退设置为 `/main-offline.html`，然后将 `/examples/` 目录的回退设置为 `/example-offline.html`。\n\
  \n### 尝试一下：设置一个懒性离线应用\n\n如果你有一个包含许多 HTML 页面的大型应用程序，创建清单可能会很困难，因为你必须在 `CACHE:` 部分显式列出每个文件才能使其自动缓存。但你也可以构建一个存储它看到的每个文件的缓存——这被称为*懒性*（lazy）缓存。\n\
  \n你可以按照以下步骤设置应用程序，缓存读者为了离线使用的任何页面：\n\n1. 创建你的缓存清单文件并将其保存为根目录下的 `offline.manifest`：\n\
  \n```\nCACHE MANIFEST\n```\n2. 为未缓存的页面编写一个回退 Web 页面并命名为 `fallback.html`。将其保存在根目录下。\n\
  3. 在你的缓存清单中添加回退部分，将未缓存的页面发送到该回退页面：\n\n```\nFALLBACK:\n/ /fallback.html\n```\n4.\
  \ 在缓存清单中设置在线白名单通配符标记：\n\n```\nNETWORK:\n*\n```\n5. 在每个你想离线使用的页面上，为 `<html>` 元素添加缓存清单：\n\
  \n```html\n<html manifest=\"/cache.manifest\">\n```\n\n然后，每当用户访问应该离线存储的页面时，它会被缓存，因为它引用了清单，但指向未访问过的页面的链接将显示\
  \ `fallback.html` 页面。\n\n### 使用 DOM 事件和属性处理离线应用\n\n在处理离线 Web 应用时，浏览器按特定顺序处理缓存。你可以使用\
  \ DOM 事件来跟踪：\n\n1. 当浏览器在 `<html>` 元素上看到 `manifest` 属性时，触发 `checking` 事件。此事件每次都会发生。\n\
  2. 如果缓存清单是新的，触发 `downloading` 事件，浏览器开始下载清单。在下载期间，`progress` 事件会定期触发，指示已下载了多少文件以及还剩多少文件。所有内容下载完成后，触发\
  \ `cached` 事件，表示应用程序已完全缓存并准备好离线运行。\n3. 如果浏览器之前见过此清单（无论是在此页面上还是其他页面上），它将检查清单是否发生了变化。\n\
  \n如果清单没有变化，触发 `noupdate` 事件，进程结束。\n\n\n\n\n\n如果清单（manifest）发生了变化，它将开始下载清单中的每个资源，并触发\
  \ `downloading` 和 `progress` 事件，这与步骤 2 中一样。然而，触发的不是 `cached` 事件，而是 `updateready`\
  \ 事件。\n\n***\n\n### 顺便说：`updateready` 意味着版本尚未未使用\n\n`updateready` 事件意味着新版本已经下载完成，但尚未在使用。只有当用户刷新页面或你手动调用\
  \ `window.applicationCache.swapCache()` 方法时，新版本才会投入使用。\n\n***\n\n另一个实用的工具是 `navigator.onLine`\
  \ 属性。该属性报告用户的在线或离线状态。了解这一点非常重要，这样可以避免在浏览器离线时尝试访问在线资源。例如，当用户在线时，你可以将数据保存到在线数据库；但当用户离线时，这些数据需要存储在本地，并在用户重新在线时保存到数据库。\n\
  \n***\n\n### 动手实践练：构建一个监听缓存变化的应用程序\n\n此应用程序将加载一个由 PHP 动态生成的当前目录下每个文件的清单。在加载文件时，你可以观察从应用程序缓存返回的消息。只需按照以下步骤操作：\n\
  \n**1. 构建 `manifest.php` 文件以读取当前目录并列出所有 PHP 和 HTML 文件（清单本身）：**\n\n```php\n<?php\n\
  \    header('Content-Type: text/cache-manifest');\n    echo \"CACHE MANIFEST\\n\"\
  ;\n    echo \"#revision 6\\n\";\n    if ($handle = opendir('.')) {\n        while\
  \ (false !== ($file = readdir($handle))) {\n            if (\n                !preg_match(\"\
  /examples-list\\.php/i\", $file) &&\n                !preg_match(\"/manifest\\.php/i\"\
  , $file) &&\n                (\n                    preg_match(\"/\\.html/i\", $file)\
  \ ||\n                    preg_match(\"/\\.php/i\", $file)\n                )\n\
  \            ) {\n                echo \"$file\\n\";\n            }\n        }\n\
  \    }\n?>\n```\n\n**2. 使用 jQuery 构建一个 HTML 文件：**\n\n```html\n<!DOCTYPE HTML>\n\
  <html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Listening for Cache Events</title>\n\
  <meta name=\"viewport\" content=\"width=device-width\"/>\n<script src=\"jquery.min.js\"\
  ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n**3. 添加 HTML 元素，包括一个重新检查缓存的按钮和一个用于显示事件的区域：**\n\
  \n```html\n<h1>Offline Web Apps—Listening for Cache Events</h1>\n<h2><span id=\"\
  status\">Online</span> — <span id=\"time\"></span></h2>\n<p>\n<button id=\"checkCache\"\
  >Check for Cache Update</button>\n<h2>Application Cache Events</h2>\n<div id=\"\
  events\"></div>\n``` //此处补全了结束标签\n\n**4. 在页面底部、紧接 `</body>` 标签上方放置一个 `script` 元素：**\n\
  \n```html\n<script>\n</script>\n```\n\n**5. 在脚本内部添加 document ready 函数，并设置在线状态和当前时间：**\n\
  \n```javascript\n$(document).ready(function(e) {\n    $(window).bind(\"online offline\"\
  , function(e) {\n        $(\"#status\").text(navigator.onLine ? \"Online\" : \"\
  Offline\");\n    });\n    $(\"#time\").text(getTime());\n});\n```\n\n**6. 在 document\
  \ ready 函数内部，为 `applicationCache` 属性设置变量，然后将所有事件绑定到它：**\n\n```javascript\nvar appCache\
  \ = window.applicationCache;\n$(appCache)\n    .bind(\"checking\", function(e) {\n\
  \        writeEvent(\"Checking if manifest is available\");\n    })\n    .bind(\"\
  noupdate\", function(e) {\n        writeEvent(\"No updates to cache\");\n    })\n\
  \    .bind(\"downloading\",function(e) {\n        writeEvent(\"Downloading to cache\"\
  );\n    })\n    .bind(\"progress\", function(e) {\n        writeEvent(\"File downloaded\"\
  );\n    })\n    .bind(\"cached\", function(e) {\n        writeEvent(\"All files\
  \ downloaded—Offline Use Ready\");\n    })\n    .bind(\"updateready\", function(e)\
  \ {\n        writeEvent(\"New cache available\");\n        $(this).swapCache();\n\
  \    })\n    .bind(\"obsolete\", function(e) {\n        writeEvent(\"Manifest not\
  \ found\");\n    })\n    .bind(\"error\", function(e) {\n        writeEvent(\"An\
  \ error occurred\");\n    });\n```\n\n**7. 你应该做的最后件事是在检查缓存按钮被点击时绑定点击操作。将此添加到 document\
  \ ready 函数中：**\n\n```javascript\n$(\"#checkCache\").click(function(e) {\n    e.preventDefault();\n\
  \    appCache.update();\n});\n```\n\n**8. 在 document ready 函数外部添加 `getTime()` 函数，以友好易读的格式获取当前时间：**\n\
  \n```javascript\nfunction getTime() {\n    var time;\n    var currentTime = new\
  \ Date();\n    var hours = currentTime.getHours();\n    var minutes = currentTime.getMinutes();\n\
  \    if (minutes < 10){\n        minutes = \"0\" + minutes\n    }\n    time = hours\
  \ + \":\" + minutes + \" \";\n    if(hours > 11){\n        time += \"PM\";\n   \
  \ } else {\n        time += \"AM\";\n    }\n    return time; // 原文此处漏了返回\n}\n```\n\
  \n**9. 你应该做的最后件事是在检查缓存按钮被点击时绑定点击操作。将此添加到 document ready 函数中：**\n\n```javascript\n\
  function writeEvent(msg) {\n    $(\"#events\").append(\"<p>\" + msg + \"</p>\");\n\
  }\n```\n\n**10. 当你完成应用程序后，将清单添加到 `<html>` 标签中：**\n\n```html\n<html manifest=manifest.php>\n\
  ```\n\n\n\n\n\n你还学习了可能发生的问题，以及调试离线应用有多么困难。在调试时，你学会了寻找以下问题的答案：\n\n- 缓存清单（cache manifest）的格式是否正确，并使用了正确的\
  \ MIME 类型进行传输？\n- 清单是否被服务器或浏览器缓存？\n- 清单文件是否发生了变化？\n- 你是否切换了缓存的新版本？\n- 你是否监听了可能影响缓存的事件？\n\
  \n使用离线 Web 应用缓存是提高用户访问网站速度的极佳方法，并让他们在离线时也能访问网站。\n\n### 问答\n\n**Q. 我需要在缓存清单中列出主页吗？它不是已经缓存了标记？**\n\
  \n**A.** 你应该在缓存清单中列出你应用程序的每一个页面，并在每个页面的 `<html>` 元素中引用该清单。虽然不需要在清单中包含当前页面，但如果你漏掉了它，并且有人从内部页面进入你的应用程序，他将无法缓存主页。\n\
  \n**Q. 有方法使用通配符来在缓存清单中创建我的显式部分（explicit section）？**\n\n**A.** 虽然某些浏览器可能支持通配符来定义缓存文件，但事实是，这并不是规范的一部分，大多数浏览器并不支持它们。如果你需要将大量文件放入清单中，最好的办法是创建一个动态清单文件，通过它读取目录中的文件。\n\
  \n**Q. 清单中可以包含的文件数量有限制吗？**\n\n**A.** 清单文件的限制不同，这取决于哪种浏览器正在下载内容。Firefox 的默认限制为 500MB，用户可以根据喜好增加或减少限制。Chrome\
  \ 和 Safari（包括桌面版和 iOS 版）有 5MB 的限制，且较易更改。\n\n如果你想在 Firefox 中更改离线缓存大小，请前往 `about:config`\
  \ 并搜索 `browser.cache.offline.capacity`。默认值为 `512000` (500MB)；将其更改更大或更小的数值即可改变你的离线缓存大小。\n\
  \n**Q. 如果我正尝试缓存动态内容呢？我该如何做？**\n\n**A.** 动态内容旨在根据网络接收到的信息发生变化。因此，动态内容不应该被缓存。相反，你应该将应用程序的这些页面放在缓存清单的\
  \ `NETWORK:` 部分。\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理本章学习的内容。在阅读答案之前，尝试回答所有问题。请参见附录 A 中的“测验答案”获取答案。\n\
  \n#### 测验\n\n- **1.** 当应用程序被缓存以便离线使用时，可以触发三个事件有哪些？\n- **2.** 标识缓存清单中显式（explicit）、在线白名单（online\
  \ whitelist）和回退（fallback）部分的关键字是什么？\n- **3.** 缓存清单的第一行是什么？必须以什么 MIME 类型提供服务？\n-\
  \ **4.** 回退（fallback）部分和白名单（whitelist）部分的作用分别什么？\n\n#### 练习\n\n- **1.** 为一个拥有许多页面的网站构建一个缓存清单。当用户访问这些页面时，所有页面都应被加入缓存，但不必显式列在缓存清单中。不要忘记包含一个回退页面。\n\
  - **2.** 将一个应用程序从仅在线改为离线。务必监听事件，并在应用程序准备好离线使用时提醒用户。\n\n## 第 21 小节：HTML5 中的 Web 存储\n\
  \n**在本节中将学习：**\n\n- 如何使用本地存储（local storage）\n- 如何检测对本地存储的支持\n- 何时使用本地存储而非 cookie\n\
  - 如何使用 Web SQL 和 Indexed DB 添加本地数据库\n- 如何构建使用本地存储的应用程序\n\n在 HTML5 之前，你存储信息的唯一方法将其添加到\
  \ DOM（文档对象模型）中或使用 cookie。但这两者都有缺点。\n\n在 HTML 中存储数据相当容易的，但它需要 JavaScript，并且只有在浏览器打开并处于该应用程序时才能存储数据。一旦用户会话结束，这些数据就会丢失。此外，存储在\
  \ HTML 中的数据对任何人都是可见的。\n\nCookie 的限制大约在 4KB 左右，对于存储信息来说，这个空间并不大。此外， cookie 会随着每个\
  \ HTTP 请求发送，这可能会减慢你的应用程序。Cookie 是未加密的，除非你的整个应用程序运行在 SSL（安全套字层）连接上，否则以此存储的数据可能会被嗅探。SSL\
  \ 也会降低页面速度。\n\n在本节中将学习 Web 存储以及如何利用用户硬盘上的空间来存储偏好、运行状态等信息。HTML5 本地存储为你提供了与用户代理关联的空间，并且只有当应用程序请求时才会与服务器进行传输。\n\
  \n然而，Web 存储不仅仅是本地存储。你还有两种创建本地数据库并在其中存储信息的方法：Web SQL 和 Indexed Database 或 Indexed\
  \ DB。本节将向你详细介绍这两个规范以及你如何使用它们。\n\n### 什么是 Web 存储？\n\nWeb 存储是一个独立的 API，最初是 HTML5 规范的一部分，但现在是\
  \ HTML5 体系下的一个独立文档。根据浏览器厂商的不同，它有时被称为 *Local Storage*（本地存储）或 *DOM Storage*（DOM 存储）。\n\
  \n**顺便说：可以使用多个插件创建持久化存储**\n\n浏览器厂商和插件编写者已尝试创建多种形式的持久化存储。Microsoft 创建了 `userData`\
  \ ([`msdn.microsoft.com/en-us/library/ms531424(VS.85).aspx`](http://msdn.microsoft.com/en-us/library/ms531424(VS.85).aspx))。Adobe\
  \ 在 Flash 中创建了 Local Shared Objects ([www.adobe.com/products/flashplayer/articles/lso/](http://www.adobe.com/products/flashplayer/articles/lso/))。Dojo\
  \ Toolkit 集成了 `dojox.storage` ([`dojotoolkit.org/api/1.6/dojox/storage/manager`](http://dojotoolkit.org/api/1.6/dojox/storage/manager))。Google\
  \ Gears、Adobe AIR 等也提供了形式的本地持久化存储，但所有这些都需要特定的浏览器或插件人们才能使用。\n\nWeb 存储允许 Web 开发人员以键值对的形式在用户的本地机器上存储\
  \ Web 应用的数据。即使用户离开应用程序、关闭浏览器或关闭电脑，这些数据仍然存在。当用户返回 Web 应用程序时，这些 Web 存储数据对应用程序仍然可用。\n\
  \n存储数据对许多 Web 应用程序很有用。最简单的应用程序使用 Web 存储存储用户数据，以便用户在返回网站时可以从上次离开的地方继续。另一种使用 Web 存储的方法是在用户离线时在本地存储通常会存储在服务器上的数据（参见第\
  \ 20 小节，“离线 Web 应用”）。\n\n#### Web 存储与 Cookie 的区别\n\n许多人犯了一个错误，认为 Web 存储和 cookie\
  \ 是同一个东西，只是空间更大。虽然 Web 存储提供的空间比 cookie 大得多，但也存在其他差异：\n\n- Web 存储仅在客户端请求时才交付给 Web\
  \ 页面，而 cookie 会随着每个 HTTP 请求发送。\n- Web 存储只能由客户端（`JavaScript`）访问，而 cookie 可以被 `PHP`\
  \ 等服务器脚本以及 `JavaScript` 访问。\n- Cookie 特定于浏览器和域名，但不区分同一浏览器中的不同窗口，而 Web 存储（特别是 `session\
  \ storage`）会区分窗口以及浏览器和域名。\n\n\n\n\n\n记住，Web 存储（web storage）不仅仅是更好的 Cookie。Cookie\
  \ 有其特定的用途，你应该继续使用它们。例如，Cookie 有两个标记：`HttpOnly` 和 `secure`，它们有助于提高 Cookie 的安全性。`HttpOnly`\
  \ 标记告诉浏览器此 Cookie 不应对客户端脚本可用。`secure` 标记要求 Cookie 仅通过安全（SSL）连接传输。\n\n你应该只在至少设置了\
  \ `HttpOnly` 最好设置了 `secure` 标记的 Cookie 中存储会话数据，因为黑客可以使用会话信息获取有关你客户的信息。\n\n将 Web\
  \ 存储被视为存储应用程序偏好、非敏感用户信息以及保存游戏和保存内容等的地方是最好的。此外，Web 存储并不像 Cookie 那样广泛支持。浏览器自 1995\
  \ 年以来一直支持 Cookie。现代浏览器都支持 Web 存储，但仅支持特定版本：\n\n* Android 2.0\n* Chrome 4\n* Firefox\
  \ 3.5\n* Internet Explorer 8.0\n* iOS 2.0\n* Opera 10.5\n* Safari 4.0\n\n## 会话存储\
  \ (Session Storage) 和本地存储 (Local Storage)\n\nWeb 存储规范中的两种不同的 Web 存储类型是本地存储和会话存储。\n\
  \n`Local storage` 是存储在本地磁盘上的键值对。每个网站都有一个独立的存储区域。使用户离开网站或关闭网络浏览器，存储在该区域的数据也会持久存在。数据仅对添加它的域可用，并且只有当该域的客户端请求时才会发送该数据。\n\
  \n### **你知道吗？**: Web 存储将所有数据都存储为字符串\n\n当你向 Web 存储存储数据时，它将以字符串的形式存储。这意味着如果你有结构化数据（如数据库信息）或数字（整数和浮点），你需要将它们转换为字符串以便存储在\
  \ Web 存储中。在检索数据时，忘记使用 `parseInt()` 和 `parseFloat()` 方法将整数和浮点数转换回来。\n\n本地存储最适合存储占用大量空间的非敏感数据。它适用于跨会话保存的数据，以便用户返回网站时可以访问它们。\n\
  \n`Session storage` 是存储在本地磁盘上的键值对，持续时间为页面会话。会话存储会将存储的数据传递给存储数据时相同域且相同窗口中的用户代理。在该窗口关闭后（某些情况除外），存储的数据将被删除。如果打开同一网站的新标签页或窗口，将创建一个新的会话存储实例。\n\
  \n### **你知道吗？**: 会话存储可以在刷新后生存\n\n如果浏览器支持在刷新后恢复会话，那么会话存储也可以被保存。例如，在 Firefox 中，如果浏览器崩溃，Firefox\
  \ 将重启并提供恢复之前的会话。Chrome、Opera 和 Safari 具有类似的功能，可以使用插件为 IE 添加此功能。在这些浏览器中，存储在会话存储中的数据也将恢复。\n\
  \n创建会话存储是为了解决 Cookie 存在的问题。如果你访问使用 Cookie 存储数据的网站，然后在第二个窗口中打开该网站，就可以访问第一个窗口的 Cookie\
  \ 数据并污染第二个窗口的 Cookie 数据。\n\n会话存储对于临时数据最有用，如果浏览器会话意外刷新，这些数据应该被保存和恢复。与本地存储一样，你不应该在会话存储中存储敏感数据。\n\
  \n## 使用 Web Storage\n\n与所有新的 HTML5 特性一样，你应该检查浏览器是否支持 Web 存储。为了做到，你可以使用第 4 节中提到的\
  \ Modernizr，或者“检测移动设备和 HTML5 支持”，或者你可以使用此函数：\n\n```javascript\nfunction supportsWebStorage()\
  \ {\n    try {\n        return 'localStorage' in window && window['localStorage']\
  \ !== null;\n    } catch (e) {\n        return false;\n    }\n}\n```\n\n使用 Web 存储时，你第一件事是定义一个存储对象。这告诉用户代理你正在使用本地存储还是会话存储。\n\
  \n### 动手尝试一下：在电子商务中保存状态\n\n在在线环境中，用户可能会意外离开或关闭窗口并丢失选择。这个“动手尝试一下”展示了如何在刷新时使用 `sessionStorage`。\n\
  \n1. 添加一个复选框和一个用于保存状态的 `div`：\n```html\n<label><input type=\"checkbox\" id=\"gift>This\
  \ is a gift</label>\n<p><button id=\"checkGift>Check Status</button>\n<div id=\"\
  istaGift\"></div>\n```\n\n2. 在底部的 `<script>` 元素中放置一个检查脚本：\n```javascript\n<script>\n\
  function supportsWebStorage() {\n    try {\n        return 'localStorage' in window\
  \ && window['localStorage'] !== null;\n    } catch (e) {\n        return false;\n\
  \    }\n}\n</script>\n```\n\n3. 在 jQuery ready 函数内部，添加 `if` 语句：\n```javascript\n\
  $(document).ready(function(e) {\n    if (supportsWebStorage()) {\n        // web\
  \ storage\n    } else {\n        // fallback\n    }\n});\n```\n\n4. 在 Web 存储区域，当用户点击复选框时，添加\
  \ `sessionStorage`：\n```javascript\n$(\"#gift\").click(function() {\n    if ($(this).attr('checked'))\
  \ {\n        sessionStorage.setItem(\"gift\", \"yes\");\n    } else {\n        sessionStorage.setItem(\"\
  gift\", \"no\");\n    }\n});\n```\n\n5. 当用户点击按钮时添加一个函数检查 Web 存储：\n```javascript\n\
  $(\"#checkGift\").click(function() {\n    var giftStatus = sessionStorage.getItem(\"\
  gift\");\n    if (giftStatus == \"yes\") {\n        $(\"#istaGift\").html(\"<p>This\
  \ item is a gift.\");\n        $(\"#gift\").attr(\"checked\", \"checked\");\n  \
  \  } else {\n        $(\"#istaGift\").html(\"<p>This item is not a gift.\");\n \
  \       $(\"#gift\").removeAttr(\"checked\");\n    }\n});\n```\n\n要检查此代码是否有效，点击复选框然后刷新页面。浏览器应该清除复选框，但如果你点击按钮，它将用正确的状态更新页面。你可以在线查看\
  \ [www.html5in24hours.com/examples/web-storage-example.html](http://www.html5in24hours.com/examples/web-storage-example.html)\
  \ 会话存储示例。\n\n之前的“动手尝试一下”部分向你展示了如何使用 Web 存储接口四种方法中的两种。这些方法是：\n\n* `getItem(`*key`*)`——该方法从存储器中获取由\
  \ `key` 标识的项目的值。\n* `setItem(`*key, value`*)`——该方法在存储器中创建由 `key` 标识的项目，并将值设置为 `value`。\n\
  * `removeItem(`*key`*)`——该方法从存储器中移除由 `key` 标识的项目。\n* `clear()`——该方法完全清空当前对象存储器中的所有项目。\n\
  * `key(`*n`*)`——该方法遍历所有当前存储的键，并获取存储区域中值的总数。你也可以用此通过索引值 (`n`）来调用 `key`。\n\n存储对象还有一个\
  \ `length` 属性，调用它时会返回与对象关联的键/值对的数量。\n\n\n\n\n\n与 cookie 类似，如果你的网站没有防止跨站脚本（XSS）攻击，网络存储也可能被破解。你存储在本地存储中的任何项目名称都以明文形式写入你的\
  \ JavaScript 中，因此黑客可以轻松利用 XSS 来收集这些数据。为了保护你的读者，你应该在页面顶部的任何文本之前使用 `<meta charset>`\
  \ 元素。不要将网络存储用于会话 ID；请使用 session storage 而不是 local storage，并且不要在本地存储中存储敏感数据。\n\n\
  * *\n\n如果你调用 `setItem()` 方法时使用的 `key` 已经存在，数据将被新值覆盖。如果你调用 `getItem()` 方法且没有存储相应的\
  \ `key`，浏览器将返回 `null`。\n\nWeb Storage API 还提供了一个事件来跟踪存储区域的变化：`storage`。该事件会创建一个\
  \ `StorageEvent` 对象，该对象具有以下属性：\n\n- `key`—被添加、删除或修改的具名键\n- `oldValue`—项目之前的旧值（包括\
  \ `null`）\n- `newValue`—项目的新值（如果项目被删除，则为 `null`）\n- `url`—调用触发更改方法的页面\n\n关于 `storage`\
  \ 事件你应该知道的最后一点是它是无法被取消的。这只是一个告诉你在浏览器中发生了什么。\n\n#### Web SQL 和 Indexed DB\n\n网络存储的一个缺点是它只提供键值对的存储。你无法保存结构化数据。然而，现在有两个\
  \ API 允许你存储复杂的关系数据并使用 SQL 查询这些数据：Web SQL 和 Indexed DB。\n\n#### Web SQL Database\n\
  \nWeb SQL Database 是一种允许你在客户端进行 SQL 调用并存储 SQL 数据库的规范。它基于 `SQLite`。Android、Chrome、iOS、Opera\
  \ 和 Safari 等浏览器支持 Web SQL。\n\n* *\n\n**注意！**：Web SQL 已停止维护\n\n2010 年 11 月 18 日，W3C\
  \ 决定停止 Web SQL 规范的开发。它仍然被某些浏览器支持，未来可能会被重新考虑，但目前没有对其进行开发，也没有任何开发计划。\n\n* *\n\n首先，你应该检测浏览器是否支持\
  \ Web SQL DB：\n\n```javascript\nfunction hasWebSql() {\n    return !!window.openDatabase;\n\
  }\n```\n\n然后你可以打开数据库。要创建一个 Web SQL 数据库，请使用 `openDatabase()` 方法。如果数据库不存在，Web SQL\
  \ DB 将创建它。该方法接受五个属性：\n\n- 数据库的名称\n- 数据库的版本号\n- 文本描述\n- 数据库以字节为单位的估计大小\n- 创建回调脚本\n\
  \n你可以这样打开数据库：\n\n```javascript\nvar db = openDatabase(\"addressBook\", \"0.1\",\
  \ \"an online address book\", 2000000);\n```\n\n记住版本号（上述示例中的 `0.1`）是必须的，要打开已存在的数据库，必须使用相同的版本号。此外，尽管存在\
  \ `changeVersion()` 方法，但它并没有被广泛支持。\n\n创建回调是在数据库创建时运行的可选脚本。大多数情况下，你不需要这个选项，在前面的示例中也没有包含它。\n\
  \nWeb SQL DB 的美之处在于它是一个非常简单的 API。在你打开数据库后，你使用该数据库上的 `transaction()` 方法配合 `executeSql()`\
  \ 方法来执行 SQL 命令。`executeSql()` 方法接收 SQL 命令。如果你不知道 SQL，应该从查看其官方网站（[http://sqlite.org/]）上的\
  \ `SQLite` 文档开始。要添加一个表和两个条目，你可以写道：\n\n```javascript\ndb.transaction(function(tx)\
  \ {\n    tx.executeSql('CREATE TABLE IF NOT EXISTS names (id unique text)');\n \
  \   tx.executeSql('INSERT INTO names (id, text) VALUES (1, \"Joe\")');\n    tx.executeSql('INSERT\
  \ INTO names (id, text) VALUES (2, \"Sarah\")');\n});\n```\n\n* *\n\n**注意！**：SQLite\
  \ 忽略数据类型\n\n当你使用 Web SQL 向数据库插入数据时，你实际上是将其插入 `SQLite` 数据库中，而 `SQLite` 会忽略数据类型。它只使用简单的字符串。因此，你应该始终进行数据验证，以确保你插入的数据是你想要的数据类型——例如日期、整数、浮点数等。\n\
  \n* *\n\n如果你想添加外部数据（例如来自表单），你需要先检查是否存在恶意代码（如 SQL 注入），然后变量传递给 `executeSQL` 方法。你可以这样输入动态值：\n\
  \n```javascript\ntx.executeSql('INSERT INTO names (id, text) VALUES (?,?)' [uniqueId,\
  \ username]);\n```\n\n`uniqueId` 和 `username` 是映射到查询的变量。\n\n然后，如果你想从数据库获取数据，请使用\
  \ SQL `SELECT` 函数：\n\n```javascript\ndb.transaction(function(tx) {\n    tx.executeSql('SELECT\
  \ * FROM addr', [], function(tx, names) {\n        var len = names.row.length, i;\n\
  \        alert(len + \" names found\");\n    });\n});\n```\n\n#### Indexed Database\
  \ API\n\nIndexed Database API（或 `IndexedDB` 或 `IDB`）暴露了对象存储。它可以包含记录和字段的数据库，你可以像使用数据库一样使用它们，但不是通过\
  \ SQL 调用访问，而是使用对象存储上的方法。Firefox 4 和 Chrome 11 支持 `IndexedDB`。\n\n和往常一样，首先检测对 IndexedDB\
  \ 的支持：\n\n```javascript\nfunction hasIndexedDb() {\n    return !!window.indexedDB;\n\
  }\n```\n\n然后你使用 `open()` 方法打开数据库：\n\n```javascript\nvar req = window.indexedDB.open(\"\
  addressBook\", \"an online address book\");\n```\n\n* *\n\n**注意！**：IndexedDB 需要浏览器前缀\n\
  \n尽管规范将 `window.indexedDB.open()` 为打开 indexedDB 数据库的方法，但你需要使用特定浏览器的前缀才能使其可靠地工作。Firefox\
  \ 3 及以下版本使用 `moz_`（带下划线），而 Firefox 4 及以上版本使用标准名称。\n\n* *\n\n亲自动试：为 iOS 和 Android\
  \ 构建一个生日应用程序\n\n\n\n\n\n此应用程序允许 iOS 和 Android 用户在本地 Web SQL 数据库中存储和检索亲友的生日。注意，此应用程序无法在\
  \ Firefox 中运行，因为该程序使用了 Web SQL，而 Firefox 只支持 `IndexedDB`。它在 Internet Explorer 中无法运行，因为\
  \ `IE` 不支持任何网络数据库。\n\n## 1. 在你的 HTML5 文档中，编写表单以输入生日数据并显示每月生日：\n\n```html\n<article>\n\
  \  <hgroup>\n    <h1>Birthday List</h1>\n  </hgroup>\n  <p>Store and retrieve birthdays\
  \ of friends and family.</p>\n  <h3>\n    <button id=\"prev\">&lt; Previous</button>\n\
  \    Birthdays in <span id=\"thisMonth\">this Month</span>\n    <button id=\"next\"\
  >Next &gt;</button>\n  </h3>\n  <table id=\"birthdays\"></table>\n</article>\n\n\
  <section id=\"input\">\n  <h3>Store a Birthday</h3>\n  <p>Name: <input id=\"fullname\"\
  \ placeholder=\"full name\" required pattern=\"[A-Z,a-z, ]+\"> (仅允许字母和空格)</p>\n\
  \  <p>Birthday:\n  <select id=\"birthdayMonth\" required>\n    <option value=\"\
  0\">January</option>\n    <option value=\"1\">February</option>\n    <option value=\"\
  2\">March</option>\n    <option value=\"3\">April</option>\n    <option value=\"\
  4\">May</option>\n    <option value=\"5\">June</option>\n    <option value=\"6\"\
  >July</option>\n    <option value=\"7\">August</option>\n    <option value=\"8\"\
  >September</option>\n    <option value=\"9\">October</option>\n    <option value=\"\
  10\">November</option>\n    <option value=\"11\">December</option>\n  </select>\n\
  \  <input type=\"number\" id=\"birthdayDay\" min=\"1\" max=\"31\" size=\"4\" step=\"\
  1\" required>\n  <p><button id=\"addBirthday\">Store Birthday</button></p>\n</section>\n\
  \n<section id=\"output\">\n  <table id=\"submitted\"></table>\n</section>\n```\n\
  \n## 2. 添加通用函数和 Web SQL 特定函数的脚本文件链接：\n\n```html\n<script src=\"birthday-list-websql.js\"\
  ></script>\n<script src=\"birthday-list.js\"></script>\n```\n\n## 3. 在 `birthday-list.js`\
  \ 文件中，检查对 Web SQL 的支持情况，并在设备不支持时添加代码显示消息：\n\n```javascript\nif (hasWebSql()) {\n\
  \    //打开或创建 web SQL 数据库\n    var db = openWebSqlDb();\n    //初始化数据库\n    initWebSqlDb(db);\n\
  } else {\n    // 使用普通的 web 存储\n    $(\"hgroup\").append(\"<h2 id=warning>This Application\
  \ Requires Web SQL.</h2>\");\n}\n\n// 开始通用函数\nfunction hasWebSql() {\n    return\
  \ !!window.openDatabase;\n}\n```\n\n## 4. 在 `birthday-list-websql.js` 文件中，编写 `openWebSqlDb`\
  \ 和 `initWebSqlDb` 函数：\n\n```javascript\nfunction openWebSqlDb() {\n    var db=openDatabase('MyBirthdayDb','1.0','my\
  \ birthdays app', 2 * 1024 * 1024);\n    return db;\n}\n\nfunction initWebSqlDb(db)\
  \ {\n    db.transaction(function(tx) {\n        tx.executeSql('CREATE TABLE IF NOT\
  \ EXISTS birthdays(id integer primary key autoincrement, fullname, birthdayMonth,\
  \ birthdayDay)');\n    });\n    //加载当前月的生日\n    var thisMonth = new Date().getMonth();\n\
  \    window.onload = listBirthdaysWebS(thisMonth);\n}\n```\n\n## 5. 加载时，脚本将加载数据库中存储的任何生日，因此将\
  \ `listBirthdaysWebS` 函数添加到 `birthday-list-websql.js` 文件中：\n\n```javascript\nfunction\
  \ listBirthdaysWebS(month) {\n    db.transaction(function(tx) {\n        tx.executeSql('SELECT\
  \ * FROM birthdays', [], function(tx, results) {\n            var len=results.rows.length,\
  \ i;\n            for(i=0; i<len; i++) {\n                if(results.rows.item(i).birthdayMonth\
  \ == month) {\n                    var prettyMonth = getMonthName(parseInt(results.rows.item(i).birthdayMonth));\n\
  \                    createTableRow(results.rows.item(i).id, results.rows.item(i).fullname,\
  \ prettyMonth, results.rows.item(i).birthdayDay,\"birthdays\");\n              \
  \  }\n            }\n        });\n    });\n}\n```\n\n## 6. 你还需要在 `birthday-list.js`\
  \ 文件中写入表格行和月份名的函数：\n\n```javascript\nfunction createTableRow (insertId,inputFullName,inputBirthdayMonth,inputBirthdayDay,tableId)\
  \ {\n    var birthdayRow = $(\"<tr id=\"+insertId+\">\");\n    var id = $(\"<td>\"\
  +insertId+\"</td>\");\n    var fullname = $(\"<td>\"+inputFullName+\"</td>\");\n\
  \    var birthdayMonth_td = $(\"<td>\"+inputBirthdayMonth+\"</td>\");\n    var birthdayDay_td\
  \ = $(\"<td>\"+inputBirthdayDay+\"</td>\");\n    // 如果你添加了 indexeddb 部分\n    //\
  \ 你需要为它创建一个单独的删除按钮\n    var removeButton = $('<td><p><button onclick=\"removeBirthdayS('\
  \ + insertId + ')\">Delete</button></td>');\n    birthdayRow.append(fullname).append(birthdayMonth_td).append(birthdayDay_td).append(removeButton);\n\
  \    $(\"#\"+tableId).append(birthdayRow);\n}\n\nfunction getMonthName(month) {\n\
  \    month = parseInt(month);\n    switch(month) {\n        case 0: month = \"January\"\
  ; break;\n        case 1: month = \"February\"; break;\n        case 2: month =\
  \ \"March\"; break;\n        case 3: month = \"April\"; break;\n        case 4:\
  \ month = \"May\"; break;\n        case 5: month = \"June\"; break;\n        case\
  \ 6: month = \"July\"; break;\n        case 7: month = \"August\"; break;\n    \
  \    case 8: month = \"September\"; break;\n        case 9: month = \"October\"\
  ; break;\n        case 10: month = \"November\"; break;\n        case 11: month\
  \ = \"December\"; break;\n    }\n    return month;\n}\n```\n\n## 7. 最后进入 `birthday-list.js`\
  \ 的是 `document ready` 函数。在其中使用 jQuery 将 `this Month` 更改为当前月份名称：\n\n```javascript\n\
  $(document).ready(function(){\n    var monthNum = new Date().getMonth();\n    var\
  \ thisMonthIs = getMonthName(monthNum);\n    $(\"#prev\").attr(\"class\", monthNum);\n\
  \    $(\"#next\").attr(\"class\", monthNum);\n    $(\"#thisMonth\").html(thisMonthIs);\n\
  });\n```\n\n## 8. 在 `document ready` 函数中添加对“下一个”和“上一个”按钮的支持：\n\n```javascript\n\
  $(\"#prev\").click( function(e) {\n    var curMonth = $(this).attr(\"class\");\n\
  \    var newMonth = parseInt(curMonth) -1;\n    if (curMonth == \"0\") {\n     \
  \   newMonth = \"11\";\n    }\n    $(\"#prev\").attr(\"class\", newMonth);\n   \
  \ $(\"#next\").attr(\"class\", newMonth);\n    $(\"#birthdays tr\").remove();\n\
  \    $(\"#thisMonth\").html(getMonthName(newMonth));\n    listBirthdaysWebS(newMonth);\n\
  }); // 上个月结束\n\n$(\"#next\").click( function(e) {\n    var curMonth = $(this).attr(\"\
  class\");\n    var newMonth = parseInt(curMonth) +1;\n    if (curMonth == \"11\"\
  ) {\n        newMonth = \"0\";\n    }\n    $(\"#next\").attr(\"class\", newMonth);\n\
  \    $(\"#prev\").attr(\"class\", newMonth);\n    $(\"#birthdays tr\").remove();\n\
  \    $(\"#thisMonth\").html(getMonthName(newMonth));\n    listBirthdaysWebS(newMonth);\n\
  }); // 下个月结束\n```\n\n## 9. 向你的 `birthday-list-websql.js` 文件添加添加和删除生日的功能：\n\n```javascript\n\
  function addBirthdayWebS(db,inputFullName,inputBirthdayMonth,inputBirthdayDay) {\n\
  \    var prettyMonth = getMonthName(parseInt(inputBirthdayMonth));\n    var curMonth\
  \ = $(\"#next\").attr(\"class\");\n    db.transaction(function(tx) {\n        tx.executeSql('INSERT\
  \ INTO birthdays( fullname,birthdayMonth,birthdayDay) VALUES (?,?,?)', [inputFullName,inputBirthdayMonth,inputBirthdayDay],\
  \ function(tx, results) {\n            createTableRow(results.insertId,inputFullName,prettyMonth,inputBirthdayDay,\"\
  submitted\");\n            if (!$('#stored').length) {\n                $(\"#submitted\"\
  ).before(\"<h3 id=stored>Stored</h3>\");\n            }\n            // 将当前月的添加项添加到当前生日列表中\n\
  \            if (inputBirthdayMonth == curMonth) {\n                createTableRow(results.insertId,inputFullName,\
  \ prettyMonth,inputBirthdayDay,\"birthdays\");\n            }\n        });\n   \
  \ });\n}\n\nfunction removeBirthdayWebS(id) {\n    db.transaction(function(tx) {\n\
  \        tx.executeSql('DELETE FROM birthdays WHERE id=?', [id], function() {\n\
  \            // 从列表中动态删除该生日\n        });\n    });\n}\n```\n\n\n\n\n\n```javascript\n\
  $(\"#b\"+id).remove();\n\n});\n\n});\n\n}\n```\n\n10. 最后，在文档就绪函数中，当用户点击文档“添加生日”按钮时调用\
  \ `addBirthday` 函数：\n\n```javascript\n$(\"#addBirthday\").click( function(e) {\n\
  \    var inputFullName=$(\"#fullname\").val();\n    var inputBirthdayMonth=$(\"\
  #birthdayMonth\").val();\n    var inputBirthdayDay=$(\"#birthdayDay\").val();\n\
  \    addBirthdayWebS(db,inputFullName,inputBirthdayMonth,inputBirthdayDay);\n});\
  \ // end addBirthday\n```\n\n你可以在 [www.html5in24hours.com/examples/birthday-list.html](http://www.html5in24hours.com/examples/birthday-list.html)\
  \ 查看此应用程序的示例。\n\n***\n\n#### 总结\n\n在本节中，你学习了 Web 存储以及如何在客户端存储比 cookie 更多的数据。Web\
  \ 存储包括本地存储（local storage）和会话存储（session storage）。\n\n本地存储允许你以名称=值对的形式存储大量数据，这些数据存储在本地硬盘上。即使关闭浏览器或关闭电脑，存储在此区域的项也会被保留。\n\
  \n会话存储允许你在会话期间以名称=值对的形式存储数据。会话存储特定于打开它的窗口，因此如果用户为你的网站打开两个窗口，就会打开两个不同的会话存储实例。\n\n\
  本节还涵盖了存储更多结构化数据的方法。这些是 Web SQL（使用 `SQLite` 存储数据）和 IndexedDB（使用 JavaScript API 存储数据）。\n\
  \n## 常见问答\n\n**Q. 如果所有主流浏览器都支持 Web 存储，我难道应该直接使用它而不是 cookie 吗？**\n\n**A.** 如本节所述，cookie\
  \ 仍然具有有效用途。它们可以更安全，因此将它们用于处理会话 ID 是重要的。此外，cookie 对大多数开发者来说更熟悉，因此更容易实现。而且，用户可以删除本地存储（就像可以删除\
  \ cookie 一样），如果占用空间过多，他们可能可能会删除它。\n\n**Q. 使用 Web SQL 和 IndexedDB 必须知道 SQL 吗？**\n\
  \n**A.** 因为 Web SQL 使用 `SQLite` 来选择和查询数据库，所以你需要编写 SQL 调用来创建和查询数据库。`IndexedDB` 更容易使用，因为它不需要你学习\
  \ SQL。\n\n**Q. 如果 Web SQL 数据库在 2010 年已经停止了，为什么我现在还要使用它？它不会过时吗？**\n\n**A.** 有些浏览器支持\
  \ Web SQL 数据库，而且并不是所有浏览器都支持其他的客户端数据库选项。此外，它是熟悉客户端数据库概念的好方法。\n\n你还应该记住，Web SQL 是目前移动设备上支持的唯一数据库。如果你的应用程序需要在移动设备上运行，那么你应该使用它而不是\
  \ `IndexedDB`。最终，你应该使用最适合你用户的技术。\n\n**Q. 有没有简单的方法创建结构化数据并存储在本地存储中？**\n\n**A.** 许多开发者使用\
  \ `JSON.stringify` 和 `JSON.parse` 将 JavaScript 字符串对象从 JavaScript 转换（stringify）并还原（parse）。\n\
  \n**Q. 我可以使用相同的存储 API 访问不同的数据存储吗？**\n\n**A.** 数据存储的保护方式与 cookie 类似。如果你的脚本与存储位于同一域，那么你就可以访问它（即使是从不同的网页），但你无法访问由另一个域设置的数据存储。\n\
  \n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。参见 附录 A “测验答案”获取答案。\n\n###\
  \ 测验\n\n**1.** Web 存储和 cookie 之间三个三个区别？\n\n**2.** 本地存储和会话存储之间的区别是什么？\n\n**3.** 使用\
  \ Web SQL 或 IndexedDB 代替 Web 存储有什么好处？\n\n**4.** 如何检测对 Web SQL 或 IndexedDB 的支持？\n\
  \n### 练习题\n\n**1.** 为你构建的生日列表应用程序添加搜索功能。让用户按名称或月份进行搜索。\n\n**2.** 为生日列表应用程序添加 `IndexedDB`\
  \ 功能。这将使应用程序能够在 Firefox 中运行。为不支持 Web SQL 或 IndexedDB 的浏览器添加基于基础 Web 存储的回退支持（fallback\
  \ support）。\n\n**3.** 将你在 第 14 节 “使用 HTML5 编辑内容和用户交互”中创建的待办列表转换为可以将数据保存到本地硬盘的待办列表。项应该存储在持久性存储中，并在用户返回页面时检索。\n\
  \n## 第 22 节. 使用 History API 控制浏览器历史\n\n***\n\n***在本节中你将学到：***\n\n• 如何控制浏览器历史\n•\
  \ 如何向历史中添加页面，以便为动态网站添加前进和后退导航\n• 遍历历史的方法\n• 如何使用 `History API` 从历史中添加和删除页面\n\n***\n\
  \n任何浏览过网页的人都熟悉浏览器历史，即用户访问过的页面序列，每个人都使用后退按钮（可能是网页浏览器上最常用的按钮）跳回历史中的上一个页面。\n\n在过去，网页开发者可以使用\
  \ JavaScript 引导用户在历史中导航，但在不刷新浏览器并将用户移动到页面的情况下，无法更改浏览器历史中列出的页面（或浏览器窗口中显示的 URL）。\n\
  \n在本节中，你将学习如何创建具有许多动态部分的应用程序（例如使用 Ajax 构建的应用程序），以及如何通过 `History API` 操作 Web 浏览器的历史栈为它们提供唯一的\
  \ URL。\n\n#### 为什么要控制浏览器历史？\n\n`History API` 给了你更改用户浏览器中历史的机会。通过 `History API`，你可以更改已在历史中的页面标题和\
  \ URL，还可以添加和移除已存在的页面。\n\n虽然你可以更改历史来玩游戏或折腾浏览器，但操作浏览器历史最重要的原因是为你的读者提供一种在你的应用程序中导航的方法。在\
  \ `History API` 出现之前，可能会发生这种情况：\n\n**1.** 用户来到你的 Ajax 照片库。\n**2.** 他浏览了 14 个页面，然后必须离开。\n\
  **3.** 他收藏了 URL 以便稍后回来。\n**4.** 稍后，当他返回书签时，他不在第 14 页，而是在第一页，因为 URL 指向第一页。\n\n发生这种情况的原因是\
  \ Ajax 只更新照片和描述，而不更新页面的 URI（统一资源标识符）。当用户返回时，书签指向主页，而那里正是他所在地。\n\n***\n\n*注意！*：History\
  \ API 不会创建页面\n\n仅仅因为你在历史中创建了一个 URL，并不意味着该页面突然出现在你的网站上。如果用户收藏了你通过 `History API` 生成的\
  \ URL 之一，你应该有一个回退方案，告诉浏览器在直接访问该页面时显示什么。最简单的方法是手动创建该页面。\n\n***\n\n使用 `History API`，你可以为照片库中的每张照片提供一个唯一的、可以被收藏和访问的\
  \ URL。当你的用户离开并返回时，他将处于第十四页而不是第一页，尽管 HTML 文档仍然是原始文档。在普通的 Web 应用程序中，如果 URL 不发生变化，收藏它只会收藏第一页。\n\
  \n`History API` 还可以帮助你的应用程序加载更快，因为你可以使用 Ajax 只刷新页面发生变化的部分，而不需要为了获取新 URL 而刷新页面。更少的\
  \ HTTP 请求会导致更快的运行速度。\n\n\n\n\n\n当你的应用程序包含一系列事件时（例如文档中的页面或相册），History API 会变得非常有效。然而，每当你使用\
  \ Ajax 来控制页面状态时，你都可以使用 History API，在不刷新页面的情况下为用户提供一个新的 URL。\n\n在很多方面，History API\
  \ 是非常无聊的。它只是让浏览器执行用户期望它执行的操作。当应用程序的某些部分发生变化时，用户期望能够收藏并分享该新状态。通过使用 History API 将\
  \ URL 添加到历史记录中，这种书签现在变得可行。\n\n#### History API 方法\n\n你应该已经熟悉这三个历史方法：\n\n- `history.back()`—让用户返回历史记录中的上一步。\n\
  - `history.forward()`—让用户在历史记录中前进一步。\n- `history.go()`—允许用户相对于当前页面（索引 `0`）向前向后移动。要允许用户后退一页（如\
  \ `back()` 方法），你可以编写 `history.go(-1)`。要让用户前进一页（如 `forward()` 方法），你可以编写 `history.go(1)`。\n\
  \n**你可能知道？**: Internet Explorer 允许在 `go()` 方法中使用字符串。\n\n如果你的受众仅使用 Internet Explorer，你可以在\
  \ `go()` 方法中放入 URL 字符串并通过 URL 遍历历史。然而，这种方法在其他浏览器中不支持——它们使用整数。\n\nHTML5 History API\
  \ 添加了两个新方法来帮助你控制历史记录，而是导航：\n\n- `pushState()`—将新的 URI 分配给浏览器窗口中的当前状态。\n- `replaceState()`—用新项目替换历史记录中的当前项目，同样使用浏览器窗口中的当前状态。\n\
  \n在处理历史记录时，还可以使用三个对象：\n\n- `history.length`—显示此浏览器窗口完整历史记录中的条目数。\n- `history.state`—返回当前状态对象。\n\
  - `window.onpopstate`—这是窗口对象上的新事件，当历史记录发生变化时触发。\n\n#### 使用 History API\n\nHistory\
  \ API 目前支持 Android 2.2、Chrome 8+、Firefox 4+、iOS 4.2.1+、Opera 11.5+ 以及 Safari 5+。然而，Safari\
  \ 和 iOS 的支持存在 Bug，因此在发布之前，你应该在 iOS 和 Safari 上对你的应用程序进行广泛测试。此外，当你使用 History API 时，需要为\
  \ Internet Explorer 和旧浏览器准备备用方案。\n\n检查是否支持 History API：\n\n```javascript\nif (hasHistoryApi())\
  \ {\n    // 在此处编写你的脚本\n} else {\n    // 备用方案\n}\n\nfunction hasHistoryApi() {\n\
  \    return !!(window.history && history.pushState);\n}\n```\n\n一个很好的备用方案是 GitHub\
  \ 上的 `history.js` 脚本 ([`github.com/balupton/History.js/`](https://github.com/balupton/History.js/))。\n\
  \n**你可能知道？**: History API 让无限滚动可以收藏。\n\n你可能见过像 Twitter 和 Facebook 等网站，当你向下滚动页面时会出现更多内容。虽然这些网站在滚动时没有改变\
  \ URL 栏，但通过 History API，它们可以轻松地做到。这样做的好处是允许用户收藏滚动到的页面位置，甚至将该位置分享给其他人。可以在 Warpspire\
  \ Experiments 查看此方面的绝佳示例 ([`warpspire.com/experiments/history-api/`](http://warpspire.com/experiments/history-api/))。\n\
  \n## 使用 History API 保存当前位置\n\n许多 Ajax 驱动的网站在不访问服务器的情况下重新加载页面，这提高了速度。然而，如果读者收藏了页面或将\
  \ URL 发送给他人，他将返回到首页，而不是被收藏时的页面样子。\n\n例如，以下 HTML 构建了一个文章列表（存储在 `articles.js` 中），该列表每十页分页一次。如果你浏览了文章并随机收藏了其中一个，当你返回该书签时，你会被回到首页。\n\
  \n```html\n<!DOCTYPE HTML>\n<html\n<head>\n<meta charset=\"UTF-8\">\n<title>History\
  \ API Examples</title>\n<meta name=\"viewport\" content=\"width=device-width\"/>\n\
  <script src=\"jquery.min.js\"></script>\n<link rel=\"stylesheet\" href=\"basic-styles.css\"\
  >\n<style>\nul { width: 75%; }\nli {\n    list-style: none;\n    margin: 0 0 0 -2em;\n\
  \    padding: 0.5em;\n}\nli:nth-child(even) { background-color:#dfdfdf; }\n#prev\
  \ {\n    background: url(images/arrow_left.png) no-repeat;\n    padding-left: 1.8em;\n\
  }\n#next {\n    background: url(images/arrow_right.png) no-repeat 3em;\n    padding-right:\
  \ 1.8em;\n}\n</style>\n</head>\n<body>\n<h1>History API Examples</h1>\n<h2>A Listing\
  \ of my Articles on About.com</h2>\n<p>\nI have written-在 About.com 上写了数百篇关于网页设计和\
  \ HTML 的文章。\n这里是前三年的部分。\n</p>\n<p id=\"pageNum\"></p>\n<p id=\"total\"></p>\n<ul\
  \ id=\"articles\"></ul\n<button id=\"prev\">&lt; Prev</button>\n<button id=\"next\"\
  >Next &gt;</button>\n<script src=\"history-api-data.js\"></script>\n<script>\n$(document).ready(function(e)\
  \ {\n    var page = $.getUrlVar('page');\n    $(\"#total\").html(\"Articles: \"\
  +articles.length);\n    if (!page) {\n        page =\"1\";\n    }\n    getArticleList(page);\n\
  \    $(\"button#prev\").click(function(e) {\n        page--;\n        getArticleList(page);\n\
  \        e.preventDefault();\n    });\n    $(\"button#next\").click(function(e)\
  \ {\n        page++;\n        getArticleList(page);\n        e.preventDefault();\n\
  \    });\n});\nfunction getArticleList(page) {\n    var length = articles.length;\n\
  \    var counter = (parseInt(page)-1)*10 +10;\n    var index = (parseInt(page) -1)\
  \ *10;\n    // set page\n    $(\"#pageNum\").html(\"Page number: \"+page);\n   \
  \ if (page == \"1\") {\n        $(\"#prev\").attr('disabled', 'disabled');\n   \
  \ } else {\n        $(\"#prev\").removeAttr('disabled');\n    }\n    if (counter\
  \ > length) {\n        $(\"#next\").attr('disabled', 'disabled');\n    } else {\n\
  \        $(\"#next\").removeAttr('disabled');\n    }\n    // 10 articles per page\n\
  \    $(\"#articles\").empty();\n    for (var i=index; i<lastItem; i++) {\n     \
  \   $(\"#articles\").append('<li><a href=\"'+articles[i][0]+'\">'+articles[i][2]+'</a>\
  \ Written: '+articles[i][1]);\n    }\n}\n</script>\n</body>\n</html>\n```\n（注：提供的源代码中的逻辑包含了一些语法错误，例如\
  \ `page—` 和未定义的 `lastItem` 变量；这些错误已经过清理，以表示代码块的标准逻辑，同时保持了原始结构。）\n\n\n\n\n\n`window.history.pushState(state\
  \ object, title, url)`\n\n***\n\n* * *\n\n### 顺带一提：状态对象大部分被忽略了\n\n大多数浏览器目前忽略第一个属性，即\
  \ `state object`。Firefox 将状态对象存储在磁盘中，以便在重启后恢复页面。状态对象有一个 `640KB` 的限制，你应该将其写为 JSON\
  \ 的表示形式。\n\n***\n\n此应用不需要数据状态（data state），所以你可以将其留空；大多数浏览器也不使用标题，所以你也可以把标题留空。这个简单的函数（在点击上一个和下一页按钮时调用）将增强应用程序的可用性：\n\
  \n```javascript\nfunction changeURL(page) {\n    var baseUrl = \"http://www.html5in24hours.com/examples/history-api-examples.html\"\
  ;\n    var newUrl = page != \"1\" ? baseUrl+ \"?page=\"+page : baseUrl;\n    if\
  \ (hasHistoryApi()) {\n        history.pushState(null, null, newUrl);\n    }\n}\n\
  ```\n\n为了让这在 Firefox 中更具功能性，你可以将数据或状态对象设置为 JSON 格式，包含任何你的信息。例如，你可能想包含页面名称和作者信息：\n\
  \n```javascript\nvar stateObject = {\n    title: 'History API Examples - Page '+page,\n\
  \    createdOn: date,\n    author: 'Jennifer Kyrnin'\n};\n```\n\n然后你在调用 `pushState`\
  \ 时包含该变量：\n\n```javascript\nhistory.pushState(stateObject, null, newUrl);\n```\n\
  \n***\n\n### 顺带一提：标题被无例外忽略了\n\n`pushState` 和 `replaceState()` 方法中的第二个参数是标题。然而，该参数目前被每个浏览器所忽略。你可以为页面包含一个标题，或者将其留为\
  \ `null`。随着浏览器开始支持它，包含标题可能会让你的脚本更具未来性。\n\n***\n\n此应用的一点是，上一个和下一页按钮都设置了 URL，因此后退按钮将继续有效。然而在大多数情况下，告诉浏览器在点击后退按钮时应该做什么是一个好主意。换句话说，告诉浏览器当点击后退按钮时，它应该伪“向后移动”到上一个\
  \ URL，同样不需要 HTTP 请求。你通过在 `window` 元素上添加一个 `popstate` 监听器来实现：\n\n```javascript\n\
  window.addEventListener(\"popstate\", action);\n```\n\n以下是你如何为文章应用添加 `popstate`\
  \ 监听器：\n\n```javascript\n$(window).bind(\"popstate\", function(e) {\n    page =\
  \ $.getUrlVar('page');\n    if (!page) {\n        page =\"1\";\n    }\n    getArticleList(page);\n\
  });\n```\n\n***\n\n### 亲自尝试：使用 History API 创建照片库\n\n在这次“亲自尝试”中，你将创建一个无论是否有 JavaScript\
  \ 或 History API 都能运行的图片库库。你将为你的照片库创建一个索引文件，并为每张照片创建隐藏文件。\n\n**1. 构建你的隐藏数据文件。** 将它们放在名为\
  \ `photogallery` 的目录中，并为每张照片构建一个文件。这些文件仅包含将照片添加到应用程序所需的 HTML：\n\n```html\n<article\
  \ id=\"photogallery\">\n    <h1>Shasta</h1>\n    <figure>\n        <img src=\"/images/pets/shasta1.jpg\"\
  \ alt=\"Shasta\">\n        <figcaption>\n            <p>Couch potato</p>\n     \
  \   </figcaption>\n    </figure>\n    <nav id=\"gallerynav\">\n        <p><a href=\"\
  mckinley1.html\" rel=\"next\" id=\"next\">Next</a>\n        <a href=\"rambler1.html\"\
  \ rel=\"prev\" id=\"prev\">Previous</a>\n    </nav>\n</article>\n```\n\n将它们保存在 `photogallery`\
  \ 目录中，文件名使用你在上一个和下一个链接中使用的名称。\n\n**2. 构建 `index.html` 页面并预加载你的第一张照片：**\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Photogallery</title>\n\
  <meta name=\"viewport\" content=\"width=device-width\"/>\n<script src=\"jquery.min.js\"\
  ></script>\n</head>\n<body>\n<div id=\"decimal\"></div>\n<article id=\"photogallery\"\
  >\n    <h1>Shasta</h1>\n    <figure>\n        <img src=\"/images/pets/shasta1.jpg\"\
  \ alt=\"Shasta\">\n        <figcaption>\n            <p>Couch potato</p>\n     \
  \   </figcaption>\n    </figure>\n    <nav id=\"gallerynav\">\n        <p><a href=\"\
  mckinley1.html\" rel=\"next\" id=\"next\">Next</a>\n        <a href=\"rambler1.html\"\
  \ rel=\"prev\" id=\"prev\">Previous</a>\n    </nav>\n</article>\n<script src=\"\
  /photogallery/photogallery.js\"></script>\n</body>\n</html>\n```\n\n**3. 创建 `photogallery.js`\
  \ 文件。**\n\n**4. 添加一个 `switchPhoto` 函数来处理图片：**\n\n```javascript\nfunction switchPhoto(href)\
  \ {\n    var req;\n    if (href.split(\"/\").pop() == \"index.html\") {\n      \
  \  req = \"/photogallery/shasta.html\";\n    } else {\n        req = \"/photogallery/\"\
  \ + href.split(\"/\").pop();\n    }\n\n    $.get(req, {},function() {\n        $(\"\
  #photogallery\").html(req.responseText);\n    });\n}\n```\n\n**5. 使用 `buildLinks()`\
  \ 函数来处理点击：**\n\n```javascript\nfunction buildLinks() {\n    $(\"#prev,#next\").click(function(e)\
  \ {\n        e.preventDefault();\n        var newURL = \"/photogallery/\" + $(this).attr(\"\
  href\");\n        history.pushState(null,null,newURL);\n    });\n}\n```\n\n**6.\
  \ 检查是否支持 History API，然后在应用程序准备就绪运行时 `buildLinks()`：**\n\n```javascript\n$(document).ready(function()\
  \ {\n    if (!hasHistoryApi()) { return; }\n    buildLinks();\n});\n\nfunction hasHistoryApi()\
  \ {\n    return !!(window.history && history.pushState);\n}\n```\n\n**7. 在 `window`\
  \ 上绑定 `popstate` 监听器，以便后退按钮有效：**\n\n```javascript\n$(window).bind(\"popstate\",\
  \ function(e) {\n    switchPhoto(location.pathname);\n});\n```\n\n***\n\n### History\
  \ API 的危险与烦扰\n\nHistory API 为 Web 应用程序增加了许多有用功能，但它可能引起问题。如果你意识到潜在的问题，你就可以创建比不使用\
  \ History API 更用户用户的 Web 应用程序。\n\n#### History API 仅在同域下工作\n\n如果你在多个域名的网站上工作，History\
  \ API 可能会很讨厌，因为它只允许你更改与页面相同域名的 URL。\n\nHistory API 有这种安全机制。当你尝试将历史更改到一个新域名时，什么都不会发生。换句话说，假设你的应用程序位于\
  \ `http://www.html5in24hours.com/`。现在你尝试将 URL 更改另一个域名；例如：\n\n```javascript\nhistory.replaceState(null,null,\"\
  http://webdesign.about.com/\");\n```\n\n如果你这样做，什么都不会发生。\n\n#### 使用 History API 的钓鱼计划\n\
  \n某些网站可能会受到 History API 的负面影响——特别是那些有大量贡献者的网站。例如，大多数大学都有大型网站，其中包含同域名的某些区域，学生可以在那里放置自己的页面和应用程序。\n\
  \n\n\n\n\n恶意学生可以编写一个看起来像标准登录页的页面，并设置钓鱼计划以收集学生的用户名和密码，然后通过 `replaceState()` 方法更改\
  \ URL，让用户认为他们正在填写正确的登录页面。\n\n如果你正在运行一个拥有有不可信贡献者的大型网站，你应该考虑将他们移动到单独域名以使用 History\
  \ API，或者完全为这些用户禁用脚本功能。\n\n你可以在我的 [About.com](http://About.com) 网站上看到此问题的简单示例。我没有进行任何钓鱼活动，但我更改页面的\
  \ URL：[`webdesign.about.com/library/bl-testing-history-api.htm`](http://webdesign.about.com/library/bl-testing-history-api.htm)。如果你在\
  \ URL 改变后刷新页面，你将被带到我网站上的一个完全不同的页面。如果之后你再次刷新页面，你将进入那个新页面。\n\n## 烦人的动画 URL\n\nHistory\
  \ API 的另一个不那么危险但更烦人的方面是，它赋予了开发者让 URL 的能力。你可以在这里尝试一下：[www.html5in24hours.com/examples/history-api-examples-scroller.html](http://www.html5in24hours.com/examples/history-api-examples-scroller.html)。\n\
  \n让 URL 动画化（除了这种动画很烦人之外）是，如果你在 Macintosh 上使用 WebKit 浏览器（Chrome 和 Safari），你无法离开该页面。Safari\
  \ 会允许你导航到书签离开，但 Chrome 甚至会忽略该请求。在 Mac Chrome 中离开页唯一方法是刷新页面（这通常会导致 404 错误）、关闭浏览器窗口或点击页面上的某个链接。\n\
  \n如果你必须为 URL 制作动画，请为你的用户提供关闭它的方法，例如页面上的按钮或链接。即使他们的浏览器没有阻止他们离开页面，动画功能仍然非常分散注意力。\n\
  \n#### 总结\n\n这小时你学到的第一点是，History API 并不会为应用程序添加很多华丽的效果。事实上，如果你使用得当，大多数人甚至不会意识到发生了什么奇妙的事情。最多，他们可能只会认为你的页面加载得更快了。\n\
  \n你学会了如何使用 History API 让应用程序运行得对用户几乎是不可见的，这正是 History API 如此重要的原因。使用无法书签的应用程序对用户来说不是好的体验，因此在这一小时中，你学会了解决\
  \ Ajax Web 页面中当前状态无法被书签的常见问题。最后，你了解了 History API 可能导致的一些问题以及如何处理它们。\n\n### 问答\n\n\
  **Q. 我使用 Ajax 构建 Web 应用程序的原因之一是当我不需要创建网站上的所有页面。但你似乎在说我需要创建添加到历史记录中的页面，以便如果有人书签了它们，他们就能访问。我真的必须那样做吗？**\n\
  \n**A.** 确保任何添加到历史记录的 URL 都可以从你的网站进行访问是一个好主意。你可以通过许多方法实现这一点，而无需维护几十个额外的页面。一些有效的方法包括：\n\
  \n- `htaccess`——使用 `.htaccess` 脚本重定向你在历史记录中创建的页面\n- JavaScript——使用 JavaScript 和查询字符串（正如本节在“使用\
  \ History API 更改 URL”节中所的那样）指向同一个页面并用脚本更新它\n- PHP 或或其他服务器语言——使用 PHP、ASP 或另一种服务器端脚本语言读取查询字符串并更新页面\n\
  \n**Q. 为什么 `pushState()` 方法中有 state 对象和 title，如果它们没有被使用呢？**\n\n**A.** 将它们包含在规范中是为了未来的功能扩展。state\
  \ 对象允许你随更改的 URL 传递结构化数据。title 则允许你定义更改的内容是什么。\n\n**Q. 使用 location.hash 又是怎样的——我仍然需要在我的\
  \ Ajax 页面中用它吗？**\n\n**A.** 许多 Ajax 作者习惯了使用 `location.hash` 为其应用程序的不同部分分配唯一的 URL。这种替代方案仍然可行，并可以作为不支持\
  \ History API 的浏览器的备用方案。\n\n要使用 `location.hash`，你可以通过只更改 URL 的 hash 部分（## 符号之后的所有内容）来更改\
  \ URL。你可以在不刷新页面的更改 hash，从而为该新文档添加唯一的 URL：\n\n```\nwindow.location.hash = newHash;\n\
  ```\n\n你可以在 Ajax Patterns 网站上找到更多关于此主题的信息（[`ajaxpatterns.org/Unique_URLs`](http://ajaxpatterns.org/Unique_URLs)**\n\
  \n### 工作坊\n\n工作坊包含练习题，帮助你处理在本章中学到的知识。在阅读答案之前，尝试回答所有问题。请参阅附录 A，“测验答案](#app01.html_app01)”获取答案。\n\
  \n### 测验\n\n**1.** 五个 History API 方法是什么？哪些是新的？它们是如何工作的？\n\n**2.** 正或错：使用 `pushState()`\
  \ 更改 URL 会创建一个新的 Web 页面。\n\n**3.** `onpopstate` 事件的作用是什么，它为什么很重要？\n\n**4.** 正或错：`replaceState()`\
  \ 方法只有一个参数。\n\n**5.** 正或错：你可以在 state 对象参数中包含任何想要的数据。\n\n**6.** 正或错：你可以将浏览器历史记录更改为你想要的任何\
  \ URL。\n\n### 练习\n\n**1.** 使用 state 对象重写相册库，以便 Firefox 等浏览器在发生崩溃时可以保存状态。你应该更改 state\
  \ 对象以反映页面名称和日期。\n\n**2.** 在相册库中添加回退功能，以便不支持 History API 的浏览器仍然可以使用它。最好的方法是更改 URL\
  \ 以包含下一个文件名的哈希。\n\n**3.** 将相册库应用程序转换为单页应用程序（SPA），并在用户向下滚动查看更多图像时更改 URL。你需要为每张照片分配一个唯一的\
  \ ID，以便你可以在 URL 的 hash 中使用它。\n\n## 第 23 小时：使用 Geolocation 添加位置检测\n\n***\n\n**这小时你将学到：**\n\
  \n- 如何使用 Geolocation API 检测位置数据\n- 如何处理与定位相关的隐私问题\n- 如何使用 API 处理位置数据\n\nGeolocation（地理定位）允许\
  \ Web 设计师请求用户的物理位置，然后根据其位置向他们提供信息。该功能的显而易见的用途是地图和路线，但你也可以将其基于人们位置的游戏或促销。\n\n在这一小时中，你将学习如何从用户处获取位置数据，并在获得这些数据后获得如何使用这些数据的建议。你将了解到\
  \ API 本身是如何缓解隐私问题的。你还学了如何使用两个不同的地图 API 构建应用程序。\n\n### 什么是 Geolocation？\n\nGeolocation\
  \ API 允许用户与他们信任的网站共享其位置数据。浏览器从许多不同的源获取这些信息，包括：\n\n- IP 地址\n- 无线网络连接\n- 手机正在使用的基站\n\
  - 设备中的专用全球定位系统 (GPS)\n\n需要注意的是，API 并不关心这些信息是如何接收的。它并不要求用户具有启用 GPS 设备，只要他们使用的浏览器能够以某种方式确定位置即可。\n\
  \n\n\n\n\nIP 地址提供了准确性最低的地理定位形式。通常，它只能精确到城市级别。智能手机网络浏览器通常使用无线网络来获取精度为 20 米的定位。通过基站进行三角定位的精度大约为\
  \ 100 米。嵌入 GPS 的设备在美国的精度通常大约在 10 米左右，但这种精度可能会根据定义最大精度的当地法律而变化。某些国家出于国家安全考虑，要求 GPS\
  \ 精度较低。\n\n## 注意！地理定位的并不总是准确的\n\n在构建应用程序时，请记住地理定位的准确性可能波动很大。我在台式电脑上进行测试时，发现大多数浏览器能将我的位置定位在距离我所在地约\
  \ 61 米的地方。然而，Internet Explorer 9 将我的位置放在了所在地以西至少一英里处。第二天，在同一台电脑上，Chrome 将我的位置放在了正北\
  \ 5 英里处。\n\n浏览器对 Geolocation API 的支持非常好。它可以在以下及更高版本的浏览器运行：\n\n• Android 2.0\n• Chrome\
  \ 5.0\n• Firefox 3.5\n• Internet Explorer 9\n• iOS 3.0\n• Opera 10.6\n• Safari 5.0\n\
  \n该 API 为页面上的 JavaScript 提供经纬度，JavaScript 可以将其传递给服务器脚本以进行地图绘制或提供有关本地业务或其他的信息。\n\n\
  ## 地理定位的用途\n\n起初这似乎并不十分有用，但你可以通过许多方式使用地理定位为用户提供更多信息。你可以使用地理定位的一些方式包括：\n\n• **地图**——地图和路线是最常见的用途。地理定位让你精确确定用户的位置，并引导他们到达想去的地方。\n\
  • **照片定位**——识别照片位置是一个很有的功能。许多移动设备和相机在照片中包含位置数据，这些数据也可以用于 Web 应用程序。\n• **欺诈检测**——使用位置数据的欺诈检测使互联网更安全。在线银行应用程序可以使用位置数据帮助验证用户身份。\n\
  • **精准广告**——通过投放本地选项，可以让广告与用户更相关，从而更可能被点击。\n• **游戏**——许多在线游戏已经使用位置数据来签到并收集积分和奖励。\n\
  \n关于地理定位对隐私和安全的影响，存在许多合理的担忧。然而，有越来越多的人选择允许网站查看和使用位置数据。当看起来有趣或实用的应用程序越多时，选择加入的用户就会越多。\n\
  \n## 使用 Geolocation API\n\nGeolocation API 提供了一个新的全局 `navigator` 对象：`navigator.geolocation`。因此，要检测对地理定位的支持，只需检测浏览器是否拥有该对象：\n\
  \n```javascript\nfunction supports_geolocation() {\n    return !!navigator.geolocation;\n\
  }\n```\n\n你可以使用 Geolocation API 的三种方法：\n\n• **`getCurrentPosition()`**——此方法返回你的当前位置。它接受两个回调函数\
  \ `success` 和 `failure` 以及选项参数。\n• **`watchPosition()`**——此方法的作用与上一个类似，但会持续轮询以确定你的位置是否发生变化。它接受与\
  \ `getCurrentPosition()` 属性，并返回一个可以使用来停止监听位置的 ID 数字。\n• **`clearWatch()`**——这是你用来停止监听位置的方法。你将来自\
  \ `watchPosition()` 方法的数字传递给它。\n\n调用 `getCurrentPosition()` 或 `watchPosition()`\
  \ 会创建一个 `position` 对象。`position` 对象上有八属性：\n\n• **`coords.latitude`**——十进制度表示的位置纬度。该属性将始终位于对象上\n\
  • **`coords.longitude`**——十进制度表示的位置经度。该属性将始终位于对象上\n• **`coords.accuracy`**——以米为单位的位置精度。该属性将始终位于对象上\n\
  • **`coords.altitude`**——位置距离海平面的高度（米）\n• **`coords.altitudeAccuracy`**——位置高度的精度（米）\n\
  • **`coords.heading`**——与上一个位置相比，位置相对于正北顺时针方向的角度变化\n• **`coords.speed`**——位置变化的速度（米/秒）\n\
  • **`timestamp`**——返回的位置日期和时间，例如 JavaScript `Date()` 对象\n\n## 顺便说：地理距离使用的是公制\n\n\
  当你从 Geolocation API 接收位置数据时，它将以米和米/秒交付。如果你的应用程序使用英尺或英里，你需要进行转换。\n\n除了始终返回三个属性（`latitude`、`longitude`\
  \ 和 `accuracy`）外，你可能根据设备的能力及其通信的定位服务器的能力接收其他属性。\n\n如果在收集地理定位数据时出错，还有一个 `positionError`\
  \ 对象，它返回一个告知发生了什么的数字代码。代码如下：\n\n• **`PERMISSION_DENIED (1)`**——当用户拒绝你的应用程序访问数据时\n\
  • **`POSITION_UNAVAILABLE (2)`**——当网络中断或无法联系卫星时\n• **`TIMEOUT (3)`**——当网络正常但计算位置所需时间过长\n\
  • **`UNKNOWN_ERROR (0)`**——当发生其他导致位置无法计算和交付的情况时\n\n要使用 `getCurrentPosition()` 方法，你在函数中调用它，并带有成功和失败的回调方法：\n\
  \n```javascript\nfunction getLocation() {\n    navigator.geolocation.getCurrentPosition(mapIt,\
  \ locationError);\n}\n```\n\n然后，成功方法（上一行中的 `mapIt()`）以某种方式使用位置对象：\n\n```javascript\n\
  function mapIt(position) {\n    var lat = position.coords.latitude;\n    var lon\
  \ = position.coords.longitude;\n    alert(\"你位于纬度 \"+ + lat + \"，经度 \"+ + lon +\
  \ \"。\");\n}\n```\n\n而错误方法（较之前代码段中的 `locationError()`）对收到的任何错误提供反馈：\n\n```javascript\n\
  function locationError(error) {\n    switch(error) {\n        case 1:\n        \
  \    alert(\"定位服务被拒绝\");\n            break;\n        case 2:\n            alert(\"\
  无法连接定位服务网络或卫星\");\n            break;\n        case 3:\n            alert(\"定位服务超时\"\
  );\n            break;\n        default:\n            alert(\"无法确定位置。\");\n    }\n\
  }\n```\n\n`watchPosition()` 方法使用与 `getCurrentPosition()` 方法相同的结构，但它返回一个数字。这个数字就是你用\
  \ `clearWatch()` 方法停止监听位置的数字。因此，要使用 `watchPosition()` 方法，你带有成功和错误回调调用它：\n\n```javascript\n\
  var watch;\nfunction getLocation() {\n    watch = navigator.geolocation.watchPosition(mapIt,\
  \ locationError);\n}\n```\n\n如果你想停止监听该用户的位置变化，可以使用该数字调用 `clearWatch()`：\n\n```javascript\n\
  function clearLocation() {\n    navigator.geolocation.clearWatch(watch);\n}\n```\n\
  \n## 使用其他位置数据选项\n\n你可以为 `getCurrentPosition()` 和 `watchPosition()` 方法设置另外三个选项。这些选项放置在方法的第三个参数——`positionOptions`\
  \ 对象中。选项有：\n\n• **`enableHighAccuracy`**——一个布尔属性，决定数据需要多精确。默认值为 `false`。\n• **`timeout`**——以毫秒为单位的数字，表示方法停止尝试位置数据的时间。\n\
  • **`maximumAge`**——以毫秒为单位的数字，表示当前位置数据需要多新。\n\n\n\n\n\nAndroid 和 iOS 设备都支持两种确定位置的方法：手机塔三角测量法和使用设备专用\
  \ GPS 硬件。三角测量法速度快，但提供的数据并不准确。GPS 硬件精确得多，但提供位置数据的速度可能比三角测量慢得多。此外，如果设备在室内或无法访问卫星，它无法无法。\n\
  \n***\n\n## 移动设备与 GPS 或手机硬件\n\n*顺带一提*：并非所有移动设备都具备 GPS 或手机硬件\n\n市场上绝大多数 Android 设备都同时手机和\
  \ GPS，但新的 Android 平板电脑正在推出仅支持 Wi-Fi 的型号，这些型号没有手机硬件，且可能没有 GPS 硬件。iPod 和某些 iPad 型号这两者也没有。这些设备的大部分位置服务都使用来自\
  \ Apple IP 地址数据库的 IP 地址映射。\n\n如果你对地理定位不需要极高的精确度，可以将 `enableHighAccuracy` 属性设置为 `false`（或保持默认值），这样你的应用程序加载速度会更快。请记住，对于逐路导航等功能，高精度非常重要；而显示附近的披萨店位置则不需要那么准确的结果。\n\
  \n要启用高精度，你需要编写以下代码：\n\n```\ngetCurrentPosition(mapIt, locationError, {enableHighAccuracy:\
  \ true});\n```\n\n超时在用户允许你的应用程序获取位置数据后开始。达到该超时后，位置方法将返回错误代码 `3`。没有默认值，所以如果你不设置超时，你的应用程序将不断尝试，直到用户放弃或用户代理放弃。要设置一分半（90,000\
  \ 毫秒）的超时，请编写：\n\n```\ngetCurrentPosition(mapIt, locationError, {timeout: 90000});\n\
  ```\n\n`maximumAge` 属性用于指示位置数据对应用程序的有效期。该属性通过仅在达到最大年龄限制时才向设备请求信息，来加速应用程序。因此，如果你在下午\
  \ 3 点请求数据，而最大年龄为两分钟，如果你在 3:01 再次查询，设备就不会重新计算位置，而是直接返回之前的数据。将最大年龄设置为两分钟（120,000 毫秒），请编写：\n\
  \n```\ngetCurrentPosition(mapIt, locationError, {maximumAge: 120000});\n```\n\n\
  你也可以将所有选项组合在一个变量中，并以这种方式传递：\n\n```\nvar positionOptions = {\n    enableHighAccuracy:\
  \ true,\n    timeout: 90000,\n    maximumAge: 120000\n};\n\ngetCurrentPosition(mapIt,\
  \ locationError, positionOptions);\n```\n\n你可以在 `watchPosition()` 方法中使用这些相同的选项。\n\
  \n### 旧版浏览器的回退选项\n\n尽管现代移动设备对地理定位有良好的支持，但 Internet Explorer 8 和其他旧版浏览器并不支持它。\n\n\
  ***\n\n## 旧款移动设备\n\n*注意！*：旧款移动设备具有特定设备的地理定位\n\n尽管现代移动设备很好地支持 Geolocation API，但 Blackberry、Nokia、Palm\
  \ 和 OMTP BONDI 等旧手机构建并支持了自己的 Geolocation API。如果你需要支持这些旧设备，你也需要为它们提供回退选项。\n\n***\n\
  \nGoogle 和 MIT 提供了一个解决方案，不仅针对 Internet Explorer，还针对可能支持位置功能但不支持 Geolocation API\
  \ 的旧功能手机和智能手机。它被称为带有 Google Gears 的 `geo.js` ([`code.google.com/p/geo-location-javascript/`](http://code.google.com/p/geo-location-javascript/))。Google\
  \ Gears 内置了地理定位功能，并作为 `geo.js` 的回退选项之一。截至目前，`geo.js`（带有 Gears）支持：\n\n* iOS\n* Android\n\
  * Opera Mobile\n* Blackberry\n* Internet Explorer\n* Nokia\n* Opera Mobile\n* webOS\n\
  * Windows Mobile\n* 以及其他\n\n要使用 `geo.js`，你需要下载 `geo.js` 并在文档底部安装 Google Gears 和\
  \ `geo.js`：\n\n```\n<script src=\"http://code.google.com/apis/gears/gears_init.js\"\
  ></script>\n<script src=\"geo.js\"></script>\n```\n\n然后，你使用 `geo_position_js.init()`\
  \ 方法检查来自任何源的位置服务。如果浏览器能够通过 Geolocation API 或 Gears 提供位置服务，则将返回 `true`。\n\n```\n\
  if(geo_position_js.init()) {\n    geo_position_js.getCurrentPosition(success_callback,error_callback);\n\
  }\n```\n\n如你在前面的代码所示，`getCurrentPosition()` 方法的调用方式与在 Geolocation API 中的调用方式相同，带有成功和错误回调。\n\
  \n在成功回调中，你可以像在 HTML5 API 中那样获取位置坐标：\n\n```\nfunction success_callback(position)\
  \ {\n    var lat = position.coords.latitude;\n    var lon = position.coords.longitude;\n\
  \    alert('You are at:\\nLat: '+lat+' Long: '+lon);\n}\n```\n\n记住 `geo.js` 不支持\
  \ `watchPosition()` 方法，所以如果你需要获取连续的位置数据，你需要在应用程序中手动轮询 `getCurrentPosition()`。\n\n\
  #### 隐私与地理定位\n\n关于告诉网站和应用程序它们所在的位置，人们非常关注隐私，如果未获得用户访问其位置的显式许可，Geolocation API 将无法工作。\n\
  \n***\n\n*注意！*：你可以通过其他方式获取位置数据\n\n如果你最近访问过网页，可能看到过与你居住地相关的广告。这些广告并不是使用地理定位来获取你的位置，而是使用你的\
  \ IP 地址。许多公司为 Web 开发人员提供了 IP 地址与物理位置关联的数据库访问。这些可能没有真实的地理定位那么准确，但可以作为绕过拒绝位置服务的方法。\n\
  \n***\n\nWeb 浏览器永远不会强制向远程服务器暴露位置。当用户第一次访问想要使用 Geolocation API 的页面时，浏览器必须提示用户询问是否可以。图\
  \ 23.1 显示了 Android、Chrome、Firefox、Internet Explorer 和 iOS 如何请求使用 Geolocation API\
  \ 的权限。\n\n**图 23.1.** Android、Chrome、Internet Explorer、Firefox 和 iOS（从上到下）请求跟踪用户位置权限。\n\
  \n![image](img/23fig01.jpg)\n\n此提示具有几个有趣的特性，你在构建位置感知应用程序时应该了解：\n\n* 用户可以通过切换标签页或点击“了解更多...”链接从提示切换到新窗口，以获取更多信息。\n\
  * 提示是无条件的，每当网站尝试使用位置服务时，都会出现，直到用户选择共享或不共享。\n* 提示会阻塞 API 直到获得答案，因此在用户选择共享之前，你无法获取位置数据。\n\
  * 用户可以选择不再再针对你的网站询问，甚至完全关闭位置服务。\n\n如果用户选择拒绝你访问其位置，作为一名有道德的 Web 设计师，你最好的反应是尊重这一选择并告诉他应用程序将对他无法工作。如前所述，你可以通过其他方式从\
  \ IP 地址获取通用位置数据，但某些人可能认为认为是不道德的，特别是当用户拒绝了访问时。数据并不总是那么准确，但它可以为你提供通用数据，例如 IP 所在的城市、州和国家。\n\
  \n一个提供通过 IP 地址免费地理定位的站点是 [`hostip.info/`](http://hostip.info/)。例如，你可以通过以下内容获取此书配套网站服务器的位置：\n\
  \nhttp://api.hostip.info/get_html.php?ip=69.164.199.170&position=true\n\n***\n\n\
  *你知道吗？*：关闭位置服务非常简单\n\n\n\n\n\nAndroid 和 iOS 都能轻松地开启和关闭位置服务。在 Android 上，你使用 `Location\
  \ & Security`（位置与安全）下的 `Settings` 。在 iOS 上，你使用 `Location Services` 下的 `Settings`。在\
  \ iOS 中，你可以关闭所有服务，也可以选择你想要允许或禁止的应用。这不会关闭由 IP 地址生成的位置数据。\n\n***\n\n如前所述，通过 IP 地址进行地理定位是不可靠的。此外，你的用户还可以通过代理服务器和匿名系统故意阻止这些信息。\n\
  \n### 创建移动地理定位应用程序\n\n地理定位最常见的用途是为位置之间提供地图和路线。但你可能没有可以接入的自己的地图服务。因此，你需要使用地图 API。你可以从几个地图\
  \ API 中选择，包括：\n\n• **Bing Maps API**—Bing Maps API 较新，但它为移动和 Web 应用提供了许多功能（[www.microsoft.com/maps/developers/web.aspx](http://www.microsoft.com/maps/developers/web.aspx)）。\n\
  \n• **Google Maps JavaScript API**—可能是最著名的地图 API，Google Maps JavaScript API 允许你为桌面和移动设备创建解决方案（[`code.google.com/apis/maps/documentation/javascript/`](http://code.google.com/apis/maps/documentation/javascript/)）。\n\
  \n• **MapQuest Open API**—该服务使用 OpenStreetMap 数据生成静态地图、路线、海拔信息等（[`open.mapquestapi.com/`](http://open.mapquestapi.com/)）。\n\
  \n• **OviMaps API**—这是来自诺基亚的地图 API，它是于 2011 年底将关闭的 Yahoo! Maps API 的推荐替代方案（[`api.maps.ovi.com/`](http://api.maps.ovi.com/)）。\n\
  \n***\n\n### 动手尝试：构建一个简单的地图映射应用程序\n\n这个“动手尝试”将向你展示如何使用 Bing Maps API 创建一个映射用户当前位置的应用程序。\n\
  \n**1.** 确保你有一个 Bing Maps 开发者密钥。登录 [www.bingmapsportal.com/](http://www.bingmapsportal.com/)\
  \ 并进入“Create or View Keys”（创建或查看密钥）来创建一个新密钥。\n\n**2.** 使用 jQuery 创建一个标准的 HTML5 页面：\n\
  \n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Untitled\
  \ Document</title>\n    <meta name=\"viewport\" content=\"width=device-width\"/>\n\
  \    <script src=\"jquery.min.js\"></script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n**3.** 在 `<head>` 中添加以下内容以链接到 Bing Maps API：\n\n```html\n<script charset=\"\
  UTF-8\" type=\"text/javascript\"\nsrc=\"http://ecn.dev.virtualearth.net/mapcontrol/mapcontrol.ashx?v=7.0\"\
  >\n```\n\n**4.** 对于 HTML 部分，创建一个区域来指示对地理定位的支持：\n\n```html\n<section>\n<h2>你现在在哪里？</h2>\n\
  <p id=\"supports\">您的浏览器不支持地理定位</p>\n</section>\n```\n\n**5.** 你还应该包含一个部分来显示地图、地图选项以及获取地图的触发器：\n\
  \n```html\n<section id=\"getMapInfo\">\n<h3>Map Options</h3>\n<p>缩放级别:\nOrbit (1)\n\
  <input id=\"zoomLvl\" value=\"11\" type=\"range\" min=\"1\" max=\"20\">\n你的庭院 (20)\n\
  <p><button id=\"getGeo\">获取我的位置</button></p>\n<div id=\"map\"></div>\n</section>\n\
  ```\n\n**6.** 在页面底部的 `<script>` 元素中，编写检查地理定位的函数并将其添加到文档就绪函数中：\n\n```javascript\n\
  $(document).ready(function(e) {\n    if (supportsGeoLocation()) {\n        $(\"\
  #supports\").html(\"您的浏览器支持地理定位。 \");\n    } else {\n        $(\"#supports\").html(\"\
  您的浏览器不支持地理定位。 \");\n        $(\"#getMapInfo\").hide(); //隐藏按钮和地图部分\n    }\n});\n\
  \nfunction supportsGeoLocation() {\n    return !!navigator.geolocation;\n}\n```\n\
  \n**7.** 为按钮添加一个 `click` 函数来启动映射过程：\n\n```javascript\n$(\"#getGeo\").click(function(e)\
  \ {\n    getLocation();\n    return false;\n});\n```\n\n**8.** 添加 `getLocation()`\
  \ 函数：\n\n```javascript\nfunction getLocation() {\n    navigator.geolocation.getCurrentPosition(mapIt,\
  \ locationError);\n}\n```\n\n**9.** 添加错误回调函数 `locationError()` 以提供发生什么错误的信息：\n\n\
  ```javascript\nfunction locationError(error) {\n    switch(error) {\n        case\
  \ 1:\n            alert(\"位置服务被拒绝\");\n            break;\n        case 2:\n   \
  \         alert(\"无法连接位置服务网络或卫星\");\n            break;\n        case 3:\n     \
  \       alert(\"位置服务超时\");\n            break;\n        default:\n            alert(\"\
  无法确定位置。\");\n    }\n    $(\"#getMapInfo\").hide();\n    $(\"#supports\").append(\"\
  \ 映射您的位置时出现问题，请稍后再试。\");\n}\n```\n\n**10.** 编写 `mapIt()` 函数。在这里你使用 Bing Maps API\
  \ 密钥或其他选择的其他地图 API：\n\n```javascript\nfunction mapIt(position) {\n    var lat =\
  \ position.coords.latitude;\n    var lon = position.coords.longitude;\n    var zoom\
  \ = parseInt($(\"#zoomLvl\").val());\n    var map, mapOptions, center, pin, pinOptions;\n\
  \    // 显示来自 Bing 的地图\n    mapOptions = {\n        credentials: 'YOUR BING MAPS\
  \ KEY',\n        center: new Microsoft.Maps.Location(lat, lon),\n        zoom: zoom\n\
  \    };\n    map = new Microsoft.Maps.Map(document.getElementById('map'), mapOptions);\n\
  \    $(\"#supports\").after('<h3 class=\"You are Here\">你在这里</h3>');\n}\n```\n\n\
  **11.** 你可能还想在地图上添加自定义大头，这样你就能看到它居中何处。在 `map = new Microsoft.Maps.` 行之后添加这些行：\n\n\
  ```javascript\ncenter = map.getCenter();\npinOptions = {\n    icon: \"/images/house.png\"\
  ,\n    width: 16,\n    height: 16,\n    draggable: true\n};\npin = new Microsoft.Maps.Pushpin(center,\
  \ pinOptions);\nmap.entities.push(pin);\n```\n\n请确保将凭更改更改你的 Bing Maps 密钥。\n\n图 23.1\
  \ 显示了 Safari 中的此应用程序。你可以在 [`www.html524hours.com/examples/geolocation.html`](http://www.html524hours.com/examples/geolocation.html)\
  \ 尝试此应用程序。\n\n图 23.2 Safari 使用地理定位 API 获取位置。\n\n![image](img/23fig.jpg)\n\n另一种根据位置数据为你的网站添加静态地图的简单方法是使用\
  \ MapQuest Open API。此选项仅使用带有参数的图像。\n\n要设置静态地图，你创建一个指向以下参数的图像：\n\n- **`center`**—地图中心的经纬度（`center=latitude,longitude`*）\n\
  - **`zoom`**—缩放级别（`zoom=14`）\n- **`size`**—地图的宽度和高度（`size=400,400`）\n\n例如：\n\n```html\n\
  <img src=\"http://open.mapquestapi.com/staticmap/v3/getmap?center=40.0378,-76.305801&size=400,400&zoom=12\"\
  >\n```\n\n所有的地图 API 还提供了许多功能，例如提供路线和方向；在你显示的地图上添加多个大头；以及以鸟视图、航空卫星地图或普通街道地图等视图显示地图。找到你最喜欢的\
  \ API 并学习如何使用它。\n\n#### 总结\n\n本节你学习了 Web 浏览器可以通过许多方式收集位置数据。某些方法（例如智能手机中的 GPS 工具）可能非常准确，而其他一些方法（例如\
  \ IP 地址数据映射）可能不准确，显示的是 IP 提供商的位置而非设备或计算机的真实位置。但正如你在本节中所学到的，访问地理定位 API 的浏览器和设备可以为你的\
  \ Web 应用程序提供这些信息。\n\n\n\n\n你学习了导航器对象 `navigator.geolocation` 以及用于获取用户代理程序当前位置的三个方法（`getCurrentPosition()`、`watchPosition()`\
  \ 和 `clearWatch()`）。你还了解到，当你获取位置时，会获得设备或计算机的纬度和经度，可能还会传输海拔、速度和航向等信息。\n\n在这一小时中，你还学习了有关地理定位的一些隐私考量。许多人不希望让未知的网站查看自己的位置。Geolocation\
  \ API 意识到了这一点，在用户选择允许访问其位置之前，它不会提供这些信息。\n\n最后，在这一小时的结束时，你学习了如何使用两个不同的地图 API 创建一个简单的地图应用程序。虽然\
  \ Geolocation API 会以经纬度的形式返回位置数据，但如果如果没有其他程序将这些数据转换为有用的信息，使用它们可能会很困难。地图 API 将位置数据转换为地图。\n\
  \n## Q&A\n\n**Q. 为什么传输的位置数据如此不准确？为什么我没有移动，它仍然在波动？**\n\n**A.** 数据不准确是因为数据收集方式的原因。当通过\
  \ IP 地址确定位置时，位置的准确性通常取决于关联 IP 地址与位置的数据库有多准确。由于互联网服务商动态分配 IP 地址，保持位置数据库的准确可能是困难的。一旦分配了新的\
  \ IP 地址，更新之前生成的任何位置数据都会再次变得正确的。\n\n手机基站使用三角测量法来设定位置。虽然这比 IP 地址更准确，但如果基站间距很远，或者一次只能探测两个基站，准确性就会降低。\n\
  \n无线网络的定位数据越来越准确，因为网络提供者使用了来自 Skyhook ([www.skyhookwireless.com/]) 等公司的工具，这些工具有精确定位的方法。目前有多种竞争协议可用于确定用户位置。\n\
  \n即使是 GPS 设备，如果设备在室内、天气极其阴云、树木遮挡严重或轨道上只有两颗卫星可见，准确性也会波动。和手机基站一样，它们使用三角测量法来确定位置，可以看到设备的卫星越多，位置数据就越准确（达到法律规定的最高准确度）。\n\
  \n**Q. `navigator.geolocation` 对象的作用是什么？**\n\n**A.** 仅仅引用 `geolocation` 对象并不会提取位置数据。该对象存在于支持\
  \ Geolocation API 的浏览器中，是定位方法挂载的对象。你必须引用这两个方法中的一个来请求位置数据。\n\n**Q. 我不想要经纬度的位置数据，我想要地址格式的。有什么办法可以获取这些信息吗？**\n\
  \n**A.** 将地址转换为经纬度的过程被称为地理编码（geocoding）。相反的过程被称为反向地理编码。如果你对地理编码感兴趣，Google 提供了一个\
  \ Geocoding API，支持反向地理编码（http://code.google.com/apis/maps/documentation/geocoding/）。\n\
  \n## Workshop\n\n工作坊包含了一些测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。答案请参见 附录 A，“测验答案](#app01.html_app01).”\n\
  \n### Quiz\n\n**1.** 你应该寻找什么来检测浏览器是否支持地理定位？\n\n**2.** `position` 对象上始终存在哪三个属性？\n\
  \n**3.** `position` 对象上可能还存在哪些属性？\n\n**4.** 什么原因会导致错误代码 1、2 和 3？\n\n**5.** 你在什么时候会使用\
  \ `enableHighAccuracy` 属性，又是如何使用它的？\n\n### Exercises\n\n**1.** 将你在这一小时中创建的应用程序转换为使用\
  \ `geo.js` 作为备用系统。\n\n**2.** 构建一个应用程序，定期轮询位置并用新的位置数据更新地图。\n\n**3.** 访问另一个地图 API\
  \ 网站，并使用它重新构建应用程序。\n\n## 第 24 小时。将 HTML5 应用转换为原生应用\n\n**在本小时中你将学到：**\n\n• 原生应用与\
  \ HTML5 应用之间的区别\n• 原生应用和 HTML5 应用的优势\n• 如何将 HTML5 应用转换为原生应用\n• 如何为你的移动应用程序创建图标\n\
  • 如何在设备上测试你的应用程序\n• 如何在应用商店中销售你的应用\n\n使用 HTML5 创建移动应用程序是很棒的，但如果你想它们在 Android 的各种应用商店或\
  \ iTunes 市场上出售呢？为此，你需要一个用 Objective C 或 Java 编写的原生应用。\n\n真的是如此吗？\n\n在本小时，你将学习原生应用和\
  \ HTML5 应用的某些不同，以及你如何将你的 HTML5 应用转换为原生应用并在在线市场上销售。你还将了解为什么你可能想或不想转换你的 HTML5 应用。\n\
  \n#### 比较原生应用与 HTML5 应用的区别\n\nHTML5 应用运行在 Web 服务器上，通常在 Web 浏览器中运行。原生应用是直接运行在 Android\
  \ 和 iOS 设备上的程序，并从相关的应用商店购买或下载。HTML5 应用与原生应用的主要区别在于，原生应用使用编程语言，例如 iOS 设备的 Objective\
  \ C 或 Android 设备的 Java。通过这些语言，你可以访问设备特定的选项，如摄像头或推送通知。\n\n作为网页设计师或网页开发者，你已经熟悉了 HTML、CSS\
  \ 和 JavaScript。然而，你需要学习 Objective C 或 Java 或两者，才能为 iOS 和 Android 编写原生应用。\n\n事实上，这种学习曲线通常是应用程序只针对\
  \ iOS 或 Android 构建而不是针对两个平台构建的原因。你需要用越多的语言来编写程序，该程序的构建成本就越高。此外，你不仅必须考虑构建问题，还要考虑维护问题。\n\
  \n**注意！用户想要全平台**\n\n如果你访问几乎任何一家软件公司的网站，你会看到客户提出的常见问题之一是：“你们打算什么时候为我的平台发布版本？”Macintosh\
  \ 用户想要 Windows 游戏。Android 用户想要 iPhone 应用，以此此类推。如果你创建了一个只在 Android 上运行的原生应用，只要它获得任何人气，你就会开始收到要求在\
  \ iOS 上构建它的请求（然后是 Blackberry 和 WebOS 等）。\n\n### 原生应用的优势\n\n原生应用相比 HTML5 应用最大的优势是它们通常更快。HTML5\
  \ 应用具有网页中固有的所有速度问题，这主要意味着它们通过 HTTP 运行并使用请求/响应机制。每发送一次 HTTP 请求，都会为应用程序增加更多时间，等待请求发出并返回。\n\
  \n然而，原生应用还提供其他优势：\n\n• **推送通知**——这些是通过始终开启的 IP 连接发送到 iOS 设备应用程序的通知。Android 有一个类似的功能，称为\
  \ Cloud to Device Messaging。\n\n\n\n\n- **访问设备硬件**——大多数移动设备都拥有硬件，如摄像头（或两个）、全球定位系统（GPS）、加速度计等。虽然\
  \ GPS 是通过 `Geolocation API`（在第 23 节 中的“使用 Geolocation 添加位置检测”中讨论），但目前 HTML5 应用还没有摄像头、加速度计或其他设备硬件的\
  \ API。\n- **文件上传**——原生应用在 Android 中可以访问文件系统，在 iOS 中可以访问某些文件，但 HTML5 `File API` 在这两个操作系统上还无法工作。\n\
  - **访问设备文件**——原生应用可以与设备上的文件（如照片和联系人）交互，但这些文件对 HTML5 应用是隐藏的。\n- **比 HTML5 更好的图形**——HTML5\
  \ 拥有 `Canvas`，但它无法创建完整的 3D 体验（随着 WebGL 的普及，这可能会改变现状）。\n- **应用内购买和广告**——可以可以说，在 HTML5\
  \ 应用中构建应用内商店和广告是可能的，但原生应用由应用商店（如 iTunes）预装了这些功能。此外，在应用商店出售应用是很容易的，但 HTML5 应用只是网页，更难销售。\n\
  - **离线访问**——正如你在第 20 节中“离线 Web 应用”中所学的那样，HTML5 支持离线 Web 应用。但原生应用已经存储在本地，因此用户无需访问网络即可开始使用。\n\
  \n原生应用还有一个经常被忽视的优点：信任。许多用户觉得在使用从应用商店下载的应用比使用网页更让他们放心。大多数用户如果正在寻找执行某事的工具，他们更有可能去应用商店寻找，而不是去搜索引擎。\n\
  \n## HTML5 应用的优势\n\n当然，使用 HTML5 应用也有好处。使用 HTML5 的最大好处是，创建一个运行在各种设备上的应用程序相对容易。这使得\
  \ HTML5 应用的开发比原生应用开发便宜得多。你不需要学习新语言，因此开发速度也会快得多。许多开发者将 HTML5 视为一种“一次编写，随运行”的应用语言。虽然\
  \ HTML5 的功能还没有那么强大，但与原生应用开发相比，它确实更接近仅通过一个 HTML 版本就能在任何地方运行。\n\n然而，你不应该仅仅因为构建 HTML5\
  \ 应用比构建原生应用简单就去构建它。如果原生应用运行得比 HTML5 应用更好，那么你有责任为客户构建这类类型的应用。但是，原生应用运行得更好这一点并不完全准确。有几个原因使得\
  \ HTML5 应用运行得与原生应用一样好甚至更好：\n\n- **用户无法区分区别**——在很多情况下，用户无法判断他们是在使用 HTML5 应用、混合 HTML5-原生应用，还是完全原生的应用。\n\
  - **你可以为设备调整样式**——HTML5 应用可以在任何带有网络浏览器的设备上查看，通过 `CSS3` 媒体查询，你可以将应用样式化为你想要的任何样子。HTML5\
  \ 应用可以使用相同的代码看起来像一个网页，也可以像一个应用程序。\n- **功能正在到来**——HTML5 可能不支持设备上的每一个功能，但它正在完善中。每天都有越来越多的\
  \ API 被提出来，让网页能够访问设备硬件和软件。此外，正如你在前面的章节中中学到的，许多 API 已经可以用于离线网页、Web 存储、本地数据库、拖放等。更多功能将不断涌现。\n\
  - **HTML5 应用性能正在提高**——随着越来越多的 Web 开发者学习加速网页的技巧，这些技术也被应用于移动 HTML5 应用中。此外，许多应用（如新闻应用、邮件、计时器和数据库）并不一定需要比现在的速度更快。\n\
  - **HTML5 不依赖设备**——正如前面提到的，HTML5 既可以在桌面浏览器中运行，也可以在移动设备上运行，但这对于不仅仅是开发目的很重要。尽管移动设备很流行，但桌面和笔记本电脑的用户远多于移动用户，如果你想你的应用被广泛使用，你就应该针对桌面市场以及移动市场进行设计。\n\
  - **你没有受限于应用商店**——Android 有许多不同的应用商店，如果你想出售应用，你需要尝试让你的应用进入尽可能多的商店。然而，对于 HTML5 应用，你不会受限于某个应用商店。你创建应用，然后像对待任何其他网页一样对其进行营销。\n\
  \nHTML5 是原生应用的替代方案，尽管在某些情况下（例如你正在构建一个大型图形游戏）原生应用更好。然而，HTML5 让 Web 开发者能够为移动设备创建应用，而无需学习新语言。\n\
  \n你还可以创建混合应用，它是 HTML5 和原生应用的结合。混合应用采用原生功能（例如拍摄和使用照片），并将其嵌入到 HTML5 框架中用于控制和用户界面。许多原生应用只是修改后放入应用程序内的网站。\n\
  \n#### 转换为原生应用\n\n你可以选择用 HTML5 构建应用，然后将其转换为原生应用。这种选项兼具 HTML5 应用和原生应用的大多数优点。\n\n\
  你可以使用一些工具将 HTML5 应用转换为原生应用。其中两个最著名的是：\n\n- PhoneGap ([www.phonegap.com/](http://www.phonegap.com/))\n\
  - Appcelerator ([www.appcelerator.com/](http://www.appcelerator.com/))\n\n***\n\n\
  *顺便说一下*:并非所有设备都是平等的\n\n当你构建 HTML5 应用时，你必须考虑浏览器，当你将应用转换为原生应用时也是如此。iOS 和 Android 有不同的规范，支持不同的功能，并可能导致不同的头疼问题。在进行转换时请记住这一点。\n\
  \n***\n\n注意，Appcelerator 将 HTML5 应用转换为原生应用比 PhoneGap 困难得多，因为这不是它的主要功能，它的主要功能是用 Java\
  \ 编写原生应用。PhoneGap 是专门为了将 HTML5 应用转换为原生应用而构建的。\n\n### 开始转换所需的物品\n\n无论你使用 PhoneGap\
  \ 还是 Appcelerator，你都需要一些东西来开始将你的 HTML5 应用转换为原生应用。\n\n构建 iOS 应用你需要：\n\n- **Macintosh\
  \ 电脑**——Apple 要求你在 Macintosh 上构建 iOS 应用，且该软件不会在其他任何设备上运行。\n- **Xcode**——这是你需要在 iPhone\
  \ 或 iPad 模拟器中构建和测试应用程序所需的软件。\n\n你可以通过加入 Apple iOS 开发者计划 ([`developer.apple.com/programs/ios/`](http://developer.apple.com/programs/ios/))\
  \ 每年支付 99 美元来获取 `Xcode`。如果你计划将应用放入 Apple App Store，就应该加入开发者计划。该开发者计划还允许你将应用放在你自己的\
  \ iPhone 和 iPad 设备上进行额外的测试。\n\n***\n\n*你知道吗？*: 你可以单独购买 Xcode\n\n`Xcode` 可以在 Apple\
  \ App Store ([`itunes.apple.com/us/app/xcode/id422352214?mt=12`](http://itunes.apple.com/us/app/xcode/id422352214?mt=12))\
  \ 以 4.99 美元的价格购买。在 App Store 购买它可以让你在提交 99 美元的年度费用加入开发者计划之前，先开始构建你的应用并在模拟器中进行测试。然而，你不能用它将应用发布到你的设备上或上传到应用商店。\n\
  \n***\n\n构建 Android 应用你还需要几样东西：\n\n\n\n\n\n- **Eclipse Classic IDE**—这是一个你用于管理 Android\
  \ 应用的开发环境（[www.eclipse.org/downloads/](http://www.eclipse.org/downloads/)）。\n- **Android\
  \ SDK**—SDK 是构建 Android 应用的开发工具包（[`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)）。\n\
  - **ADT Plug-in**—此插件扩展了 Eclipse 以构建 Android 应用程序。你可以在 Eclipse 内部安装它（[`developer.android.com/sdk/eclipse-adt.html#installing`](http://developer.android.com/sdk/eclipse-adt.html#installing)）。\n\
  \n请注意，你可以仅通过命令行使用 SDK 构建 Android 应用程序，但带有 ADT 插件的 Eclipse 会让过程变得简单得多，这也是 Google\
  \ 推荐你构建应用程序的方式。\n\n## 使用 PhoneGap 原生应用\n\n使用 PhoneGap 构建原生应用的巨大优势之一是，你只需要将 HTML\
  \ 直接导入 SDK 中，剩下的工作由 PhoneGap 完成即可。如果你已经构建了一个可以在 Android 和 iOS 上运行的应用程序，那么使用 PhoneGap\
  \ 将其转换为原生应用应该是可行的。\n\n### 顺带一提：另一个 PhoneGap 选项即将推出\n\n截至本文编写，PhoneGap 正在测试一种更简单的方法将你的\
  \ HTML5 转换为原生应用程序。它被称为 `PhoneGap:Build` ([`build.phonegap.com/`](https://build.phonegap.com/))。通过此工具，你可以像往常一样创建\
  \ HTML5 应用，然后将其上传到 `PhoneGap:Build`。随后 `PhoneGap:Build` 将你的应用程序转换为适用于 iOS、Android\
  \ 以及其他几种移动设备的应用商店可用应用。\n\n## 亲自尝试：在 PhoneGap 中构建简单的 iOS 应用程序\n\n在 PhoneGap 中构建应用程序只需要几步。如果你不想，不需要知道\
  \ Objective C 甚至不需要使用 JavaScript。\n\n1. 下载并安装 `Xcode` 和最新的 PhoneGap。\n2. 在 PhoneGap\
  \ iOS 目录中，运行安装包安装 PhoneGap。\n3. 打开 `Xcode` 并创建一个新的 PhoneGap 项目。\n4. 为你的项目命名并提供一个公司标识符（Company\
  \ Identifier）。你希望公司 ID 采用反向 URL 格式：`com.companyname`。这将为你创建一个包标识符（bundle identifier）。\n\
  5. 当你的应用程序在 `Xcode` 中打开后，右键点击项目名称并选择 `Show in Finder`。\n6. Finder 将显示一个名为 `www`\
  \ 的文件夹。你需要将该文件夹从 Finder 拖入 `Xcode` 的项目中。\n7. 对于任何添加的文件夹，选择 `Create Folder References`，并点击\
  \ Finish。\n8. 打开 `www` 文件夹并编辑 `index.html` 文件。你可以使用任何想要的 HTML 来进行编辑，但如果你想添加 JavaScript，请遵循注释说明。\n\
  9. 将停止按钮（Stop）旁边的下拉菜单更改为你想要在上面进行测试的模拟器版本。\n10. 点击 `Run` 在 iPhone 或 iPad 模拟器中查看你的应用。\n\
  \n如你所见，在 PhoneGap 中构建 iOS 应用程序非常简单。在你的应用程序内部有了 `www` 文件夹后，你可以编辑该文件夹中的 HTML 来进行你想做的任何操作。\n\
  \n### 顺带一提：PhoneGap 已集成在 Dreamweaver 中\n\nDreamweaver CS5.5 内置了 PhoneGap 连接功能。因此，如果你已经在使用\
  \ Dreamweaver，直接在熟悉的软件中将 Web 应用程序转换为原生应用是很简单的。\n\n构建 Android 应用程序并不像构建 iOS 应用那样简单，因为没有包安装器来构建你所需的应用程序目录和文件。然而，构建\
  \ Android 应用仍然相当简单。\n\n## 亲自尝试：在 PhoneGap 中构建简单的 Android 应用程序\n\nPhoneGap 也可以帮助你构建\
  \ Android 应用程序。它比构建 iOS 应用多几个步骤，但你只需要了解 HTML。\n\n1. 下载并安装 `Eclipse Classic` ([www.eclipse.org/downloads/](http://www.eclipse.org/downloads/))、`Android\
  \ SDK` ([`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html))\
  \ 以及最新版本的 PhoneGap。\n2. 在安装并运行 `Eclipse` 后，进入 Help（帮助）菜单并选择 `Install New Software`。这将打开可用软件（Available\
  \ Software）窗口。\n3. 从选项选择此处 URL 的 `ADT Plug-in`：`https://dl-ssl.google.com/android/eclipse/`。\n\
  4. 安装插件后，从 File（文件）菜单打开一个新的 Android 项目。你可能需要为项目类型选择 `Other`（其他）并搜索 Android。\n5.\
  \ 为你的项目命名并选择你想要针对的 Android 版本，然后点击 Finish。\n6. 在项目根目录下创建两个新目录：\n   - `/libs`\n \
  \  - `/assets/www`\n7. 从 PhoneGap 安装目录中的 Android 目录，将 `phonegap.js` 文件复制到 `/assets/www`，并将\
  \ `phonegap.jar` 文件复制到 `/libs`。\n8. 在 `/src` 目录下找到 `App.java` 文件并进行一些更改：\n   - 将\
  \ `public class` 行更改为 `public class appName extends DroidGap`。\n   - 将 `setContentView();`\
  \ 替换为 `super.loadUrl(\"file:///android_asset/www/index.html\");`。\n   - 在 `import\
  \ android.os.Bundle;` 下添加 `import com.phonegap.*;`。\n9. 右键点击 `/libs` 文件夹并选择 `Build\
  \ Path`，选择 `Configure Build Path`。刷新项目（按 `F5`）。\n10. 使用文本编辑器编辑 `AndroidManifest.xml`，并在\
  \ `android:versionName=\"1.0\">` 之后添加以下内容：\n\n```xml\n<supports-screens\nandroid:largeScreens=\"\
  true\"\nandroid:normalScreens=\"true\"\nandroid:smallScreens=\"true\"\nandroid:resizeable=\"\
  true\"\nandroid:anyDensity=\"true\"\n/>\n<uses-permission android:name=\"android.permission.CAMERA\"\
  \ />\n<uses-permission android:name=\"android.permission.VIBRATE\" />\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_LOCATION_EXTRA_COMMANDS\" />\n<uses-permission\
  \ android:name=\"android.permission.READ_PHONE_STATE\" />\n<uses-permission android:name=\"\
  android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.RECEIVE_SMS\"\
  \ />\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<uses-permission\
  \ android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n<uses-permission\
  \ android:name=\"android.permission.READ_CONTACTS\" />\n<uses-permission android:name=\"\
  android.permission.WRITE_CONTACTS\" />\n<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
  \ />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"\
  \ />\n```\n\n11. 在 `<activity>` 元素中添加：\n    `android:configChanges=\"orientation|keyboardHidden\"\
  `\n12. 在 `/assets/www` 文件夹中创建一个名为 `index.html` 的新文件并将其编辑为：\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>PhoneGap</title>\n<script\
  \ charset=\"utf-8\" src=\"phonegap.js\"></script>\n</head>\n<body>\n<h1>Hello World</h1>\n\
  </body>\n</html>\n```\n\n13. 右键点击项目，选择 `Run As`（运行方式），并点击 `Android Application`。\n\
  14. 选择虚拟设备，如果没有合适的设备，你将创建一个。你的应用程序将在 Android 模拟器中运行。\n\n\n\n\n\n#### 创建应用图标\n\n\
  原生应用与 HTML5 应用之间的一个区别特征是用于表示它们的图标。为了让你的 HTML5 应用准备好在设备上进行测试并最终部署到应用商店，你需要拥有代表应用程序的图标。\n\
  \nApple 部署到应用商店需要三种不同的图像和图标，以及一个推荐使用的图标：\n\n- `Application icon`（应用图标）——它在设备上以及\
  \ App Store 内部代表应用程序。\n- `App Store icon`（App Store 图标）——较大的图标，用于在 App Store 显示。此图标必须能够识别为你的应用图标，但可以更详细。\n\
  - `Launch image`（启动图像）——此图像在应用程序启动后立即出现，并一直加载直到应用程序完全准备可用。\n- `Spotlight search\
  \ icon`（搜索图标）——这是一个用于搜索结果和设置的小图标。此图标不是强制要求的，但创建它是个好主意，可以让你的应用程序在搜索中渲染得更有效。\n\nAndroid\
  \ 部署到商店只需要两种类型的图标：\n\n- `Launcher icon`（启动器图标）——此图标在主屏幕和启动器窗口中代表你的应用程序。\n- `Console\
  \ icon`（控制台图标）——这种高分辨率图标用于在线市场中的各个位置。\n\n在制作图标时，请记住以下几点：\n\n- 图标应该看起来很现代，尽可能避免陈词滥调。\n\
  - 图标是人们看到你的应用程序时所想的，因此它们应该代表代表你的应用。\n- 尽可能使用矢量图形来创建图标，以便它们根据需要进行缩放。\n\n在提交图像和图标时，你需要了解确切的文件大小。表\
  \ 24.1 详细列出了你 iOS 应用所需的不同图像和图标的文件大小。\n\n**表 24.1.** Apple 图标和图像尺寸\n\n![image](img/24tab01.jpg)\n\
  \nApple 对创建你的图像也有一些规则：\n\n- 图标必须保存为 24 位 PNG 格式。\n- 图标必须具有 90° 的直角。\n- 图标不能有光泽或高光效果。\n\
  - 图标不能有 Alpha 通透明度。\n\n如果你遵循了这些规则，你的应用程序图标将自动获得圆角、投影投影和反射光泽。\n\n***\n\n*你知道吗？*：你可以防止\
  \ Apple 图标的自定义\n\n你可以通过向 `Info.plist` 文件中添加 `UIPrerenderedIcon` 键，以防止 Apple 对圆角、投影和反射光泽进行自定义。对于\
  \ Web 应用，你可以将图标文件命名为 `apple-touch-icon-precomposed.png` 以防止这些自定义。\n\n***\n\n访问 Apple\
  \ iOS 开发者库 ([`developer.apple.com/`](https://developer.apple.com/)) 获取更多关于设计良好的\
  \ iOS 图标的帮助。\n\n你应该创建三个版本的 Android 图标，以适用于高、中、低密度屏幕。表 24.2 详细列出了所需的 Android 图标的文件大小。\n\
  \n**表 24.2.** Android 图标尺寸\n\n![image](img/24tab02.jpg)\n\nAndroid 对启动器图标有一些规则：\n\
  \n- 图标必须是现代、极简、哑光、触感且有纹理的。\n- 图标必须具有有限的调色板，并且面向且顶部照明。\n\n访问 Android 开发者网站获取有关制作良好的\
  \ Android 图标的更多信息 ([`developer.android.com/guide/practices/ui_guidelines/icon_design.html`](http://developer.android.com/guide/practices/ui_guidelines/icon_design.html))。\n\
  \n# 测试你的应用程序\n\n在模拟器中测试你的应用程序之后，你应该在实际设备上进行测试。在模拟器上测试很容易，甚至有在线模拟器供你使用。第 8 小节将 Web\
  \ 应用转换为移动应用](#ch08.html_ch08)” 解释了更多关于模拟器的信息。在设备本身上测试可能会困难一些。\n\n在考虑将应用程序部署到应用商店之前，你应该在你将要支持的设备上进行测试。测试将让你看到响应速度有多快、点击项目大小是否存在点击问题，以及模拟器中不包含的功能（如\
  \ GPS）。当你将应用程序传输到设备时，甚至可能会发现一个无法解决的 bug，从而决定不再部署。\n\n如前所述，在 iOS 设备上进行测试需要 Apple\
  \ iOS 开发者账户，每年费用 99 美元。你还需要一个从 Apple 配置描述网站（provisioning portal）获取的 App ID。\n\n\
  ***\n\n### 动手尝试：将你的应用程序放在你的 iOS 设备上\n\n此“动手尝试”中的步骤将帮助你从 Apple 配置描述网站获取 App ID，并将你的应用程序从计算机传输到你的\
  \ iOS 设备进行测试。\n\n**1.** 通过访问 [`developer.apple.com/ios/manage/devices/index.action`](http://developer.apple.com/ios/manage/devices/index.action)\
  \ 并点击“Add Devices”，将你的设备添加到配置描述网站。\n\n**2.** 通过访问 [`developer.apple.com/ios/manage/overview/index.action`](http://developer.apple.com/ios/manage/overview/index.action)\
  \ 并点击“Launch Assistant”，为你的应用程序创建一个配置文件（provisioning profile）。\n\n**3.** 在 `Xcode`\
  \ 中打开你的应用程序。\n\n**4.** 在应用程序的 `Info` 标签页中，确保你的应用使用 app ID 作为 bundle identifier。\n\
  \n**5.** 确保你的 iOS 设备已连接到计算机，并从顶部下拉菜单中选择它。\n\n**6.** 点击 `Run`，应用程序将在你的设备上运行。\n\n\
  将应用程序移动到 iOS 设备后，你可以断开连接并像使用设备上的任何其他应用程序一样使用它。图 24.1 显示了一个名为 Birthday List 的应用程序在\
  \ iPad 上进行测试。\n\n**图 24.1.** 在 iPad 上测试 Birthday List 应用程序。\n\n![image](img/24fig01.jpg)\n\
  \n***\n\nAndroid 应用不需要 app ID 或配置文件，但在 Android 设备上尝试测试它们仍然可能令人困惑，因为 `Eclipse` 和\
  \ SDK 中的所有内容似乎只用于在模拟器中运行。下面的“动手尝试”解释了如何使用 `Eclipse` 在 Android 设备上测试你的应用程序。\n\n***\n\
  \n### 动手尝试：将你的应用程序放在你的 Android 设备上\n\n在此“动手尝试”中，你使用 `Eclipse` 连接设备并在那里测试你的应用程序。这个示例展示了一个你可以让应用程序在设备上运行的技巧。\n\
  \n**1.** 将你的 Android 设备插入计算机，然后在 `Eclipse` 中打开你的应用程序。\n\n**2.** 在 `Run` 菜单中，打开 `Run\
  \ configurations` 并切换到 `Target` 标签页。\n\n**3.** 将目标更改为 `Manual` 并点击 `Run`。应用程序将在你的设备上打开。\n\
  \n与 iOS 测试不同，在断开连接后，应用程序将从你的 Android 设备上移除。然而，你可以在保持连接时测试它的运行情况。\n\n***\n\n# 在应用商店销售你的应用\n\
  \n将应用程序部署到应用商店是销售（或免费提供）原生应用程序的最后一步。要在 Apple App Store 销售应用，你需要申请 Apple 的批准。销售 Android\
  \ 应用稍微一点，因为不需要批准，但你必须选择在哪些商店出售你的应用。两个平台都要求你签署法律文件并支付费用以列出你的应用程序。\n\n要将应用程序提交到 Apple\
  \ App Store，你需要准备提交应用程序、与 Apple 完成财务信息、收集截图、设置家长控制分和关键词，然后将应用添加到 `iTunes Connect`。如果你的应用程序包含应用内购买，你还需要与\
  \ Apple 签署合同。你可以在 App Store 资源中心了解更多关于此过程以及如何开始的信息([`developer.apple.com/appstore/resources/submission/`](http://developer.apple.com/appstore/resources/submission/))。\n\
  \n\n\n\n\n要将应用部署到 Android 市场，你需要在 Android 商店上创建一个开发者配置。你还需要支付 25 美元的注册费并同意分发协议。请在\
  \ Android 商店 ([`market.android.com/publish/signup`](https://market.android.com/publish/signup))\
  \ 登录以了解更多信息。Android 应用还必须使用你持有私钥的证书进行数字签名。这会将你标识为作者。你可以使用 Eclipse 导出向导对你的应用程序进行签名。更多信息可以在\
  \ Android 开发者网站 ([`developer.android.com/guide/publishing/app-signing.html#releasemode`](http://developer.android.com/guide/publishing/app-signing.html#releasemode))\
  \ 上找到。\n\n编写 Android 应用的一个益处是存在多个应用商店。另一个流行的市场是 Amazon Appstore。要加入，请访问 Appstore\
  \ 开发者门户 ([`developer.amazon.com/welcome.html`](https://developer.amazon.com/welcome.html))\
  \ 并创建开发者账户。该计划收取 99 美元的年度计划费用。\n\n## 转换为原生应用以外的其他选项\n\n虽然将你的 HTML5 应用转换为原生应用现在可能很有吸引力，但这并不是让人们发现并使用你的\
  \ HTML5 应用的唯一方法。此外，创建原生应用所需的工作（和成本）可能是巨大的。\n\n你可以通过其他方式让你的应用对移动用户更有吸引力，而无需转换为原生应用：\n\
  \n- 保持应用为 HTML5，并使用搜索引擎优化 (SEO)和其他营销技术获取曝光。\n- 鼓励用户将你的应用程序保存到桌面。如果你在 meta 标签中定义了应用程序图标，应用程序看起来和运行起来就像原生应用一样。\n\
  - 使用应用框架，例如 SenchaTouch 或 jQuery Mobile（如 第 5 节 中“JavaScript 和 HTML5 Web 应用”所述），让你的应用程序在移动用户看起来更熟悉。\n\
  - 使用封装应用（wrapper app）打开你的 HTML5 应用。封装应用是一个重定向到网页的原生应用。你可以在 PhoneGap 应用内部使用简单的 meta\
  \ 刷新标签来实现这一点。\n\n#### 总结\n\n本节讨论了如何将 HTML5 应用转换为原生 Android 和 iOS 应用。你还学习了两种类型应用的优处，以便能够明智地决定是否要转换为原生应用。\n\
  \n你了解到大多数原生应用速度更快，可以访问推送通知、应用内购买和应用内广告等技术，并且比 HTML5 应用更容易直接使用设备内置的硬件和软件（摄像头、加速度计、日历和联系人）。然而，你也了解到在大多数情况下，大多数用户无法分辨他们是在使用\
  \ HTML5 应用还是原生应用（即使存在速度差异），而且 HTML5 应用让你接触到比仅仅移动设备用户更广阔的市场。\n\n本节还带你学习了使用 PhoneGap\
  \ 和 Appcelerator 工具将应用从 HTML5 转换为原生应用的步骤。\n\n你学习了将应用程序提交到 Android 和 Apple App Store\
  \ 所图像和图标。你还学习了在个人设备上测试应用程序所需的步骤，以及将其部署到商店并销售你的作品。\n\n### 问答\n\n**Q. 我最近读了许多相互矛盾的文章，说原生应用是未来的趋势，而\
  \ HTML5 将杀死所有原生应用。你认为哪种是正确的？**\n\n**A.** 真相介于两者之间。原生应用总会有某种市场，因为人们喜欢经过审核程序的应用程序所具有的安全性。然而，随着\
  \ HTML5 获得越来越广泛的支持，这些应用程序将变得越来越普及。\n\n**Q. 我读到 Apple App Store 不允许使用 PhoneGap 等应用。这是真的吗？**\n\
  \n**A.** 根据 PhoneGap FAQ ([www.phonegap.com/faq](http://www.phonegap.com/faq))，使用\
  \ `PhoneGap` 0.8 及以上版本制作的应用没有违反 App Store 的条款。这并不是说你的应用可能因为其他原因被拒绝，但不会是因为你使用了 `PhoneGap`\
  \ 来构建它。\n\n**Q. 你解释了如何在我的个人设备上测试应用程序，但是否可以将我的测试版应用发送给其他人，看看他们是否喜欢以及在他们的设备上运行如何？**\n\
  \n**A.** 是的，这不仅可行，而且是一个非常好的主意，可以确保你的应用尽可能地可用。\n\n对于 Apple，你需要将你的测试测试者的设备添加到你的配置方案门户中。你的账户最多可以添加\
  \ 100 台设备。要做到这一点，告诉你的测试人员使用 iTunes App Store 中提供的名为 `Ad Hoc Helper` 的应用程序向你发送他们的\
  \ `UDID`。你可以将他们的设备添加到配置方案门户中的设备列表中。创建一个名为 `Ad Hoc` 的配置方案并将你的应用添加到其中。最后，在 `Xcode`\
  \ 中构建用于分发的应用程序并发送给测试人员。他们可以使用 iTunes 安装。访问 Apple 开发者中心获取更多信息。名为 `TestFlight` 的公司\
  \ ([`testflightapp.com/`](https://testflightapp.com/)) 也可以帮助你为 iOS 应用设置 Beta 测试。\n\
  \nAndroid 没有这些限制。你只需将项目压缩并让你的测试人员以你相同的方式安装即可。\n\n第 8 节 详细介绍了你的应用程序进行 Beta 测试。\n\n\
  ### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。答案请参见 附录 A 中的“测验答案”。\n\n###\
  \ 测验\n\n**1.** Android 和 iOS 应用是用什么编程语言编写的？\n\n**2.** 原生应用相比于 HTML5 应用的三个优势是什么？\n\
  \n**3.** 无论你使用什么开发工具，构建 iOS 应用或 Android 应用需要什么？\n\n**4.** 你可以使用哪两个程序将 HTML5 应用转换为原生应用？\n\
  \n**5.** 部署 iOS 和 Android 应用需要哪些图像和图标？\n\n### 练习题\n\n**1.** 重新改写 第 21 节 中“HTML5\
  \ 中的 Web 存储”的生日列表应用程序，并进行应用设计。使用如 `jQuery Mobile` (第 5 节) 等框架让它看起来像一个移动应用，或者进行你自己的设计。\n\
  \n**2.** 使用 `PhoneGap` 将练习 1 中的应用程序转换为 Android 或 iOS 应用。务必在模拟器中进行测试。\n\n### 第四部分：附录\n\
  \n## 附录 A. 测验答案\n\n本附录提供了每节中测验题的答案。\n\n### 第 1 节，“通过 HTML5 改进移动 Web 应用开发”\n\n**1.**\
  \ HTML5 是由一组浏览器制造商、网页设计者和开发者发起的。他们开始定义一个新版本的 HTML，考虑到他们创建 Web 应用的需求、提供更多样式钩子以及更多浏览器功能。他们脱离\
  \ W3C，是因为 W3C 决定将 HTML 变为一种基于 XML 的语言——XHTML。成立的小组被称为 `WHATWG`（网页超文本应用技术工作组）。\n\n\
  **2.** HTML5 文档的第一行是文档类型声明，内容为：`<!doctype html>`\n\n**3.** iOS 和 Android 设备上的默认网络浏览器都基于\
  \ `WebKit`，它对 HTML5 有强大的支持。随着更多使用这些浏览器的手机和平板购买，HTML5 将被更广泛的使用。\n\n### 第 2 节，“移动开发中的新\
  \ HTML5 标签和属性”\n\n\n\n\n\n## 1. HTML5 中有许多新标签可以用于布局。它们包括 `<article>`, `<aside>`,\
  \ `<figcaption>`, `<figure>`, `<footer>`, `<header>`, `<hgroup>`, `<nav>` 和 `<section>`。\n\
  \n2. `<section>` 标签是语义化的。它是一种用于指示所包含内容含义的标签。`<section>` 标签封装了文档中某个特定部分的内容。\n\n3.\
  \ 既有新的事件属性，也有有助于拖放操作的全局属性。新的事件属性有 `ondrag`、`ondragend`、`ondragenter`、`ondragleave`、`ondragstart`\
  \ 和 `ondrop`。新的全局属性有 `draggable` 和 `dropzone`。\n\n### 第 3 小时，“使用 CSS3 为移动页面设置样式”\n\
  \n1. 为网页添加样式的三种方法是通过直接在标签中编写内联样式、在文档的 `<head>` 中嵌入样式，以及在 `<head>` 中使用 `<link>` 标签附加外部样式表。最佳的类型是使用外部样式表，因为它允许你为整个网站在某处定义样式，而且由于它是缓存的，网站页面的显示速度会加快。\n\
  \n2. CSS 选择器是 CSS 样式中选择对 HTML 文档中哪些元素设置样式的部分。典型的样式选择器可能是元素选择器，例如 `p`，用于为文档中所有的 `<p>`\
  \ 标签设置样式。\n\n3. `border-radius` 属性有两个浏览器扩展：`-moz-border-radius` 和 `-webkit-border-radius`。浏览器扩展是特定浏览器的属性版本，必须使用它们以确保在相应浏览器中支持这些属性。\n\
  \n### 第 4 小时，“检测移动设备和 HTML5 支持情况”\n\n1. 在本书编写时，Google Chrome 10 和 11 都支持 84% 的 HTML5，而\
  \ Opera Mobile 支持 58%。\n\n2. 使用脚本向 DOM 添加元素是很容易的，但如果浏览器不支持这些元素，它将只会给它们默认属性，而无其他功能。通过检查元素的\
  \ HTML5 特有属性，你可以判断浏览器是否支持该元素。\n\n3. 当你编写一个能够优雅降级（degrades gracefully）的应用程序时，它将在更多浏览器中运行（功能会减少）。这增加了你的受众。此外，当用户升级浏览器时，你的应用程序看起来也会有所改进，而你无需承担额外工作。\n\
  \n### 第 5 小时，“JavaScript 和 HTML5 Web 应用程序”\n\n1. 正确。`<script>` 标签在 HTML 文档的 head\
  \ 和 body 中都是有效的。\n\n2. `:link` 和 `:hover` 伪类允许你对文本链接设置样式，并在鼠标悬停在其上方时让该样式发生变化。\n\n\
  3. `visibility: hidden;` 属性保留了元素占据的空间。这是因为元素只是变得不可见。此功能在某些希望有时显示文本但不希望布局发生变化的情况下非常有用。`display:\
  \ none;` 属性则将元素从文档中完全移除（尽管它在源代码中仍然可见）。\n\n4. 你需要在脚本标签中链接 jQuery，然后包含 `document.ready`\
  \ 处理器：\n\n```html\n<script src=\"jquery.min.js\"></script>\n\n$(document).ready(function(){\n\
  \n});\n```\n\n### 第 6 小时，“构建移动 Web 应用程序”\n\n1. “SMART”目标是一个具体的（Specific）、可衡量的（Measurable）、可实现的（Achievable）、现实的（Realistic）且限时间的（Time-bound）目标。设定这些这些标准的目标使它们更有可能完成。\n\
  \n2. 一个 em 等于当前的字体大小。在大多数计算机上，这是 16px。\n\n3. `apple-touch-startup-image` 指定了一个用于作为你的\
  \ Web 应用程序启动屏幕的图像。你在文档的 head 中通过 `<link rel=\"apple-touch-startup-image\" href=\"\
  startup.png\">` 标签来指定它。\n\n4. 你应该遵循许多最佳实践，包括：\n- 提供视图选项的选择并记住用户的选择。\n- 保持数据输入无痛感。\n\
  - 记住保持内容精简。\n- 使用移动端特定的函数。\n- 最小化感知等待时间。\n- 优化图像并使用对比良好的颜色。\n- 尺寸上使用 em 或百分比。\n\
  - 保持你的内容清晰。\n- 警惕可能会失效的技术。\n- 避免确实会失效的技术。\n\n### 第 7 小时，“将网站升级到 HTML5”\n\n1. Internet\
  \ Explorer 5 和 6 对标准的支持很差，这种缺乏支持通过“兼容模式”延续到了 7 和 8 版本。\n\n2. 迭代设计是一个过程，你对网站的设计和功能进行细微更改，并测试它们如何影响你的网站目标。你应该考虑对网站进行迭代更改，以便你的客户能够逐渐适应这些变化，而不是每隔几年就要重新学习如何使用你的网站。迭代设计还确保更改不会损害你的销售或页面访问量。\n\
  \n3. 新的 `doctype`、meta `charset` 标签、简化脚本和样式标签、块级链接、新的表单输入类型、视频和音频标签以及语义化 HTML 标签和属性现在都可以工作。\n\
  \n4. `contenteditable` 属性和拖放功能均在 IE 5.5 版本中被添加到 IE。IE 6 也支持了一些 Ruby 注释。\n\n### 第\
  \ 8 小时，“将 Web  应用转换为移动端”\n\n1. 在移动设备上测试现有页面可以让你了解需要什么。专门针对移动端测试应用程序可以确保它们按照你的预期工作。智能手机和电脑浏览器可以处理更大的页面，但页面越小加载越快。30KB–50KB\
  \ 仍然是一个值得努力的范围。\n\n2. 设计的五个元素是颜色、方向、线条、形状和纹理。\n\n3. 移动设计模式使你的设计对移动用户来说更加熟悉，因此更易使用。\n\
  \n4. 你可以通过向朋友或家人借用设备、租设备或使用模拟器在设备上测试移动应用程序。\n\n### 第 9 小时，“通过 HTML5 分区和语义化元素添加含义”\n\
  \n1. 四个新的分区元素是 `<article>`, `<aside>`, `<nav>` 和 `<section>`。\n\n2. 图像和一段文本在 `<figure>`\
  \ 内部都是有效的。\n\n3. 正确。你可以使用 `<aside>` 元素来标记侧边栏。\n\n4. 错误。你不应该仅仅将 `<section>` 元素作为样式的钩子。请使用\
  \ `<div>` 代替。\n\n5. 错误。分区根元素可以有自己的大纲，但它不会将其内容贡献给其祖先的大纲。\n\n6. 正确。`<footer>` 不是一个分区元素。它定义了紧邻的前一个分区元素的页脚。\n\
  \n7. HTML5 中新的非分区语义元素有 `<mark>`, `<meter>`, `<progress>` 和 `<time>`。\n\n### 第 10\
  \ 小时，“使用 HTML5 Canvas 元素绘图”\n\n1. 当你在 HTML 中编写 `<canvas>` 元素时，在用脚本在上面绘图之前，它是不会显示的。\n\
  \n2. `clearRect()` 方法创建一个空透明的矩形。\n\n3. 错误。你可以在 `strokeStyle` 属性上使用 RGBA 透明度。\n\n\
  4. A. 线段端的默认样式是 `butt`。\n\n5. 正确。在 `<canvas>` 元素上使用弧度绘制圆。\n\n6. 正确。你无法对在 `<canvas>`\
  \ 上绘制的文本设置盒模型样式（如外边距和内边距）。\n\n7. 将图像文件绘制到画布上，需要在 HTML 或 JavaScript 中引用该图像文件，然后使用\
  \ `drawImage()` 方法将其绘制到画布。\n\n8. B 和 C。Flash 和 SVG 是基于矢量的。Canvas 是一个位图绘图工具。\n\n\
  ### 第 11 小时，“HTML5 中的字体与排版”\n\n\n\n\n\n1. 六种通用字体族为 `serif`、`sans-serif`、`monospaced`、`fantasy`、`cursive`\
  \ 和 `script`。\n\n2. 排版中的六个间隔元素是字间距（kerning）、行距（leading）、字间距（tracking）、长度（measure）、对齐（alignment）和连字（ligatures）。\n\
  \n3. 错误。当你可以通过输入 `&copy;` 使用 `©` 符号时，不应该在版权声明中使用简写代码。不使用该实体会让你的文本看起来不专业。\n\n4. 网络字体的五种格式是\
  \ EOT、TTF、OTF、SVG 和 WOFF。\n\n5. 你使用 `@font-face` 规则来嵌入字体：\n\n```css\n@font-face\
  \ {\n    font-family: FontName;\n    src: url(URL);\n}\n```\n\n### 第 12 小时，“HTML5\
  \ 中的音频视频”\n\n1. 三种常用的音频编码器是 MP3、Vorbis 和 WAV。\n\n2. Internet Explorer 9 支持 MP4 和\
  \ WebM（带扩展名）视频编码器。Android 3.0 支持所有三种——MP4、ogg/Theora 和 WebM——但 Android 2.3 不支持 4。\n\
  \n3. 你可以在 `<video>` 元素上使用 `src` 属性或使用 `<source>` 元素来添加视频源。\n\n4. 错误。`loop` 属性可以同时用于\
  \ `<video>` 和 `<audio>`。\n\n5. `type` 属性的格式为 `type='MIME type; codecs=\"video codec,\
  \ audio codec\"'`。\n\n6. `<audio>` 元素中除 `<source>` 和 `<track>` 之外的任何内容都被视为回退内容。支持\
  \ HTML5 音频的浏览器应该忽略这些内容，不支持的浏览器将忽略它们无法识别的 HTML5 标签。因此，要在 `<audio>` 元素中添加回退内容，你需要像在\
  \ HTML 4 中那样添加 `<object>` 来嵌入 WAV 文件。\n\n### 第 13 小时，“HTML5 表单”\n\n1. HTML5 增加了\
  \ `autofocus`、`placeholder` 和 `autocomplete` 属性以及新的 `<datalist>` 元素，使表单更具可用性。\n\n\
  2. 新的日期和时间输入类型为 `date`、`datetime`、`datetime-local`、`month`、`week` 和 `time`。\n\n\
  3. `<input type=search>` 字段在 WebKit 中设有非常特定的样式，难以覆盖。它们包括内边距、字体大小、字体族、边框和背景颜色。\n\n\
  4. `<output>` 元素用于显示计算结果。\n\n5. HTML5 三个用于表单验证的新属性：`novalidate`、`required` 和 `pattern`。\n\
  \n### 第 14 小时，“使用 HTML5 编辑内容和用户交互”\n\n1. `contenteditable` 属性受所有主流浏览器和版本的支持，包括 IE\
  \ 5.5、Firefox 3、Safari、Chrome 和 Opera 9。唯一不支持它的是 iOS 和 Android 上的移动浏览器。\n\n2. `contenteditable`\
  \ 属性是一个全局属性，适用于 HTML 中的所有元素。\n\n3. 你需要 `contenteditable` 属性和 `designmode` 属性来创建一个富文本编辑器。\n\
  \n4. 当你尝试检测 `contenteditable` 时，Android 和 iOS 报告它们在 DOM 中有该元素，但它们并不支持它。检测它的唯一方法是对\
  \ iOS 和 Android 设备进行浏览器嗅探。\n\n### 第 15 小时，“微格式和微数据”\n\n1. 你可以使用微数据标记几乎任何具有标准格式的内容。书中提到的一些示例包括：事件、联系信息、食谱、评论、简历和地理位置。\n\
  \n2. `itemprop` 属性用于命名元素所代表的属性。它的功能与微格式中的 `class` 属性相同。\n\n3. RDFa 代表属性中的资源描述框架（Resource\
  \ Description Framework in attributes）。\n\n### 第 16 小时，“使用 HTML5 拖放功能”\n\n1. 适用于拖放的两个最佳元素是\
  \ `<a href=\"\">` 和 `<img>` 元素。它们最可靠，因为无论是否设置了 `draggable` 属性，Internet Explorer\
  \ 都会将它们识别为可拖动。使用其他元素可能会导致 IE 行为异常。\n\n2. `preventDefault()` 方法告诉用户代理不要对该事件执行默认操作。当将图像拖入浏览器窗口时，默认操作是在新窗口中打开该图像。`preventDefault()`\
  \ 方法会停止这一操作。\n\n3. 创建拖放应用的六个步骤是：定义可拖拽对象、在该对象上设置事件、定义一个落点区域、在落点区域上设置事件、在拖拽对象和落点区域之间传递信息，以及定义拖放操作的效果。\n\
  \n4. 拖放效果必须匹配，拖放操作才能成功。一个只有“复制”效果的拖拽元素将无法落到具有“移动”效果的落点区域上。\n\n### 第 17 小时，“HTML5\
  \ 链接”\n\n1. `<a>` 元素有一个全新的属性——`media` 属性。该属性添加媒体查询，告诉用户代理该链接用于何种媒体。`target` 属性在技术上不是新属性，但它从\
  \ HTML 4 开始就未被废弃，用于标识链接应该打开的窗口或帧。\n\n2. 要让 iframe 内部的链接在容器文档中打开，你应该添加属性 `target=_parent`。\n\
  \n3. 图像映射元素 `<area>` 现在可以像 `<a>` 一样使用 `rel`、`media` 和 `hreflang` 属性。\n\n4. 使用 `rel=nofollow`\
  \ 属性可以防止爬虫访问某些链接。\n\n### 第 18 小时，“Web 应用 API 和数据集”\n\n1. Web 应用使用脚本进行交互，且在不刷新页面的情况下保持部分内容更新。\n\
  \n2. 应用程序被缓存时可以触发的事件包括处理 `<script>` 元素；内联 `javascript:` URL 以及事件处理程序。\n\n3. 目前 `dataset`\
  \ 方法尚未广泛支持，使用 `getAttribute` 方法查看数据集更安全。\n\n### 第 19 小时，“WebSocket、Worker 和文件”\n\
  \n1. WebSockets 协议存在一些安全问题，Firefox 和 Opera 浏览器制造商认为在修复这些问题后才会支持该功能。具体来说，某些版本的协议存在黑客利用缓存污染攻击用户的风险。\n\
  \n2. 通过编写 JavaScript 文件并在主脚本中调用它来添加 Worker：\n\n```javascript\nnew Worker(\"worker.js\"\
  );\n```\n\n通过消息与其通信：\n\n```javascript\nworker.onmessage = function(e){\n    e.data\n\
  };\nworker.postmessage(\"message\");\n```\n\n它向脚本发送消息：\n\n```javascript\nonmessage\
  \ = function(e){\n    if ( e.data === \"start\" ) {\n        done()\n    }\n};\n\
  function done(){\n    postMessage(\"done\");\n}\n```\n\n3. 最简单的方法是在 `<input>` 元素上添加两个属性——`multiple=true`\
  \ 和 `accept=\"text/*\"`。然而，并非所有浏览器都支持 `accept` 属性，因此你应该在脚本中检查上传的文件是否是你需要的类型。\n\n\
  ### 第 20 小时，“离线 Web 应用”\n\n1. 当应用程序被缓存时可以触发的事件有 `checking`、`noupdate`、`downloading`、`progress`、`cached`、`updatady`、`obsolete`\
  \ 和 `error`。\n\n2. 关键字 `CACHE:` 表示显式部分，`NETWORK:` 表示在线白名单，`FALLBACK:` 指回退信息。\n\n\
  3. 缓存清单的第一行必须是：\n\n```text\nCACHE MANIFEST\n```\n\n此外，缓存清单的服务器类型必须为 `text/cache-manifest`。\n\
  \n4. 回退部分标识了文件未缓存时应该交付的页面。白名单部分告诉浏览器网站上的哪些页面应该始终在线服务。\n\n\n\n\n\n## 1. Web 存储与 cookies\
  \ 的不同之处在于：\n\n- 在 Web 存储中，数据仅在请求时才被存储和检索，而 cookies 会随着每个 HTTP 请求发送。\n- Web 存储只能通过\
  \ JavaScript 访问，而 cookies 也可以通过服务器端脚本访问。\n- Web 存储可以针对特定的窗口，也可以针对浏览器和域名。\n\n## 2.\
  \ Local storage（本地存储）是持久的，即使在浏览器或计算机关闭后也可以访问。Session storage（会话存储）特定于它存储的窗口。它不是持久的，每个窗口都会创建一个新实例——即使在相同的域名和网页上也是如此。\n\
  \n## 3. Web SQL 和 IndexedDB 提供结构化数据存储。Web 仅是一系列名称=值对。\n\n## 4. 要检测 Web SQL，请创建一个返回\
  \ `openDatabase` 值的函数。要检测 IndexedDB，请创建一个返回 `window.indexedDB` 值的函数。例如：\n\n```javascript\n\
  function hasWebSql() {\n    return !!window.openDatabase;\n}\n\nfunction hasIndexedDb()\
  \ {\n    return !!window.indexedDB;\n}\n```\n\n## 第 22 小时，“使用 History API 控制浏览器历史”\n\
  \n## 1. History API 中的三个旧方法是 `history.back()`、`history.forward()` 和 `history.go()`。HTML5\
  \ 了两个新方法：`history.pushState()` 和 `history.replaceState()`。`pushState()` 方法向历史列表添加新条目，而\
  \ `replaceState()` 方法会更改当前条目。\n\n## 2. 错误。这两个新方法都不会创建新的网页；它们只是会更改浏览器地址栏和历史列表中的 URL。\n\
  \n## 3. 当点击后退或前进按钮时，会触发 `onpopstate` 事件。该事件允许你控制点击这些导航按钮时发生的情况，以便你的页面能够正确加载。\n\n\
  ## 4. 错误。`replaceState()` 方法与 `pushState()` 方法具有相同的三个参数：状态对象、标题和 URL。\n\n## 5. 正确。只要你的数据不超过\
  \ 640KB 的限制，你就可以在其中包含任何想要包含的内容。\n\n## 6. 错误。你只能将 URL 更改为当前域名上的位置。\n\n## 第 23 小时，“使用地理定位添加位置检测”\n\
  \n## 1. 你检测 `navigator.geolocation` 对象是否存在。\n\n## 2. `position` 对象始终具有 `coords.latitude`、`coords.longitude`\
  \ 和 `coords.accuracy`。\n\n## 3. `position` 对象可能还有这些属性：`coords.altitude`、`coords.altitudeAccuracy`、`coords.heading`、`coords.speed`\
  \ 和 `timestamp`。\n\n## 4. 当用户拒绝访问位置数据时，`positionError` 对象抛出错误代码 1；当网络中断或卫星不可用获取位置数据时抛出\
  \ 2；当超过设置的超时时间时抛出 3。\n\n## 5. `enableHighAccuracy` 属性是可以在 `getCurrentPosition()`\
  \ 和 `watchPosition()` 方法设置的位置选项。。你需要位置数据尽可能准确时（例如用于逐段驾驶导航），将其设置为 `true`。要使用它，你可以写：\n\
  \n```javascript\ngetCurrentPosition(success_callback, error_callback, {enableHighAccuracy:\
  \ true});\n```\n\n或者：\n\n```javascript\nwatchPosition(success_callback, error_callback,\
  \ {enableHighAccuracy: true});\n```\n\n## 第 24 小时，“将 HTML5 应用转换为原生应用”\n\n## 1. Android\
  \ 应用使用 Java 编写，iOS 应用使用 Objective C 编写。\n\n## 2. 原生应用具有推送通知、设备硬件访问权限、文件上传、设备文件访问、比\
  \ HTML5 更好的图形，以及应用内购买和广告。它们在离线状态下也能工作，而且人们倾向于更信任原生应用而非网页。\n\n## 3. 开发 iOS 应用需要一台\
  \ Macintosh 计算机和 Xcode。开发 Android 应用需要 Eclipse Classic、Android SDK 以及适用于 Eclipse\
  \ 的 ADT 插件。你可以仅使用 SDK 来构建 Android 应用，但那样做要困难得多。\n\n## 4. PhoneGap 和 Appcelerator\
  \ Titanium 是你可以用来将 HTML5 应用转换为原生应用的两个程序。\n\n## 5. iOS 应用需要两个图标和一个图像：应用程序图标、App Store\
  \ 图标和启动图像。Android 应用需要两个强制图标：启动器图标和控制台图标。\n\n## 附录 B. HTML 元素和属性\n\nHTML 元素和属性是\
  \ Web 应用的构建模块。本附录将对它们进行简要说明，并指出哪些是 HTML5 中新增的。你应该意识到，在编写本文时 HTML5 规范仍在开发中，如果你有任何问题，应参考\
  \ W3C HTML5 规范以获取最新信息（[`dev.w3.org/html5/markup/elements.html`](http://dev.w3.org/html5/markup/elements.html)）。\n\
  \n### HTML5 元素\n\nHTML5 元素大部分与 HTML 4.01 中的元素相同。也有一些新元素。以下列表显示了 HTML5 元素及其用途。\n\n\
