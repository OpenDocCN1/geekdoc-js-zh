  \n### HTML5 属性\n\nHTML5 属性是进一步定义上表列 HTML5 元素的项目。它们被添加在起始标签空格后的元素之后。例如：`<div accesskey=a>`。\n\
  \n#### 全局属性\n\n全局属性是可以应用于任何 HTML5 元素的属性。\n\n![image](img/app-b-tab07.jpg)\n\n###\
  \ 事件处理器属性\n\n事件处理器属性用于定义当浏览器中发生事件时应该执行的操作。\n\n![image](img/app-b-tab08.jpg)![image](img/app-b-tab09.jpg)![image](img/app-b-tab10.jpg)\n\
  \n## 附录 C. HTML5 和移动应用资源\n\n如何使用 HTML5 和相关的 API 有很多东西要学。有很多书籍和网站供你学习更多。\n\n### 书籍\n\
  \n以下书籍可以让你学习很多关于 HTML 通用的知识，以及某些 HTML5 API。\n\n- *Sams Teach Yourself HTML and CSS\
  \ in 24 Hours*，Julie C. Meloni 和 Michael Morrison 著，Sams，2010。ISBN 978-067233097。\n\
  - *Introducing HTML5*，Bruce Lawson 和 Remy Sharp 著，New Readers，2010。9971。\n- *HTML5:\
  \ Up and Running*，Mark Pilgrim 著，O’Reilly，2010。ISBN 978-0596806026。\n- *HTML5 for\
  \ Web Designers*，Jeremy Keith 著，A Book Apart，2010。978-098442508。\n- *HTML5 & CSS3\
  \ For The Real World*，Estelle Weyl、Louis Lazaris 和 Alexis Goldstein 著，SitePoint，2011。ISBN\
  \ 978-98044694。\n- *Sams Teach Yourself CSS 3 in 24 Hours*，Kynn Bartlett 和 Chris\
  \ Montoya 著，Sams，2010。ISBN9978-067231022。\n- *Designing with Web Standards*，Jeffrey\
  \ Zeldman 著，New Readers，2009。ISBN 978-032161951。\n- *HTML5 Canvas*，Steve Fulton\
  \ 著，O’Reilly，2011。978-1449393908。\n- *The Definitive Guide to HTML5 Video*，Silvia\
  \ Pfeiffer 著，Apress，2010。ISBN 978-1430230908。\n- *HTML5 Geolocation*，Anthony T.\
  \ Holdener 著，O’Reilly，2011。978-1449304720。\n- *Programming the Mobile Web*，Maximiliano\
  \ Firtman 著，O’Reilly，2010。ISBN 978-059680778。\n\n### 网站\n\n以下网站将帮助你学习更多 HTML5 和相关\
  \ API：\n\n- **W3C** (`[www.w3.org/](http://www.w3.org/))——W3C 是更新 HTML5 规范的地方。它拥有关于规范的最新信息。当你对网络标准有疑问时，应该去那里。W3C\
  \ 还有一个验证器，你可以用它检查你的 HTML5 应用并确保它们编写正确。另见 `www.w3.org/TR/html5/`(http://www.w3.org/TR/html5/)\
  \ 和 `http://validator.w3.org/`(http://validator.w3.org/)。\n\n\n\n\n\n- **HTML5 Rocks\
  \ ([www.html5rocks.com/](http://www.html5rocks.com/))**—HTML5 Rocks 提供了一个尝试新标准的平台，还有更新的教程、信息以及一系列示例，向你展示如何在自己的网站中使用\
  \ HTML5。\n- **HTML5 Doctor ([`html5doctor.com/`](http://html5doctor.com/))**—HTML5\
  \ Doctor 将帮助你入门 HTML5。该网站定期发布关于 HTML5 中不同元素的文章，以及所有元素的索引，以便你了解更多关于规范特定部分的内容。\n-\
  \ **The HTML5 Gallery ([`html5gallery.com/`](http://html5gallery.com/))**—HTML5\
  \ Gallery 展示了使用 HTML5 的网站。它是获取灵感和关于如何使用 HTML5 建议的绝佳场所。\n- **Web Design and HTML\
  \ at [About.com](http://About.com) ([`webdesign.about.com/`](http://webdesign.about.com/))**—About.com\
  \ 上的 Web 设计与 HTML 是我维护的一个网站，我在上面编写关于 HTML5、网页设计、CSS 和网络标准的文章。你可以学习 HTML 的基础知识，也可以深入更高级的话题。另请参\
  \ [`webdesign.about.com/od/html5/qt/html-5-information.htm`](http://webdesign.about.com/od/html5/qt/html-5-information.htm)。\n\
  \n## 本书网站\n\n在本书网站上，你可以找到书中列出的所有示例和样例代码，以及书籍的更新以及获取更多 HTML5 信息的地方：\n\n[www.html5in24hours.com/](http://www.html5in24hours.com/)\n\
