  \ {\n    if (requiredName() && requiredEmail() && requiredMessage())\n        return\
  \ true;\n    else\n        return false;\n});\n```\n\n当用户填写表单但留下一个字段为空时，会出现错误消息。这种验证在移动设备上同样运行良好，正如图\
  \ 5.2 所示。\n\n**图 5.2.** 在 iPad 上使用 jQuery 验证表单。\n\n![image](img/05fig02.jpg)\n\n\
  ***\n\n### 使用 jQuery 开发 Web 应用\n\njQuery 对于构建 Web 应用非常有用，因为它非常易于使用。然而，构建 Web 应用时，易用性并不是唯一的考虑因素，有很多\
  \ JavaScript 库可以选用。\n\n对于 Web 应用开发者来说，学习 jQuery 是一个好主意，原因有很多，包括：\n\n-\n\n**jQuery\
  \ 压缩了 JavaScript——** 大约五行 jQuery 等同于五倍的 JavaScript，但 Web 应用（尤其是移动应用）必须保持小巧敏捷。\n\
  -   **jQuery 具有强大的浏览器支持——** jQuery 开发者不断更新库，以确保在最广泛的浏览器中获得支持，因此 Web 开发人员不需要了解跨浏览器脚本的所有不同实现规则。\n\
  -   **jQuery 使用熟悉的语法——** 如果你熟悉 CSS 选择器，那么你就能理解 jQuery。\n-   **jQuery 包含了内置动画——**\
  \ 窗口可以通过淡入或滑出打开和关闭，文本可以滚动，图像可以放入幻灯片中。所有这些都增强了 Web 应用的效果，使其看起来更像传统的应用程序。\n-   **jQuery\
  \ 不影响内容——** 所有内容都写在 HTML 中，即使客户端未启用 JavaScript，内容也不会消失。这提供了一个内置的备用机制。\n\n### 使用\
  \ jQuery Mobile\n\n与 jQuery 本身一样，jQuery Mobile 的设计是为了在许多平台上运行。这里是一个使用 jQuery 的示例文档：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<label for=\"email\">邮箱：</label> <span\
  \ id=\"emailInfo\">请使用有效的邮箱地址</span></span><br>\n\n<input type=\"email\" size=\"\
  30\" id=\"email\"><br>\n\n<label for=\"message\">留言：</label> <span id=\"messageInfo\"\
  ></span><br>\n\n<textarea rows=\"5\" cols=\"27\" id=\"message\"></textarea><br>\n\
  \n<button type=\"submit\" name=\"submit\">提交</button>\n</form>\n\n注意，所有三个输入字段旁边都有一个`<span>`标签。虽然姓名和邮箱字段有文本，但\
  \ `textarea` 没有。这个标签为我们在需要时提供了一个添加错误代码的地方。\n\n2. 编写你的 CSS 来设置表单字段、信息标签和错误类：\n\n\
  ```css\n#contactForm input, #contactForm textarea {\n    width: 400px;\n    border-radius:\
  \ 1em;\n    -moz-border-radius: 1em;\n    -webkit-border-radius: 1em;\n}\n#contactForm\
  \ span {\n    color: #999;\n}\n#contactForm span.error {\n    color: #C00;\n}\n\
  #contactForm input.error {\n    background-color: #465f82;\n}\n```\n\n3. 现在添加你的\
  \ jQuery；首先添加 jQuery 自身的链接，然后添加 document-ready 函数，你可以在其中放入其余脚本：\n\n```html\n<script\
  \ src=\"jquery.min.js\"></script>\n<script>\n$(document).ready(function(){\n};\n\
  </script>\n```\n\n4. 添加几个变量，以便脚本更易读：\n\n```javascript\nvar form = $(\"#contactForm\"\
  );\nvar name = $(\"#name\");\nvar nameInfo = $(\"#nameInfo\");\n```\n\n5. 编写一个函数检查姓名字段是否已填写：\n\
  \n```javascript\nfunction requiredName() {\n    if (name.val().length < 1) {\n \
  \       name.addClass(\"error\");\n        nameInfo.text(\"姓名是必填项\");\n        nameInfo.addClass(\"\
  error\");\n        return false;\n    } else {\n        name.removeClass(\"error\"\
  );\n        nameInfo.text(\"你的全名是什么？\");\n        nameInfo.removeClass(\"error\"\
  );\n        return true;\n    }\n}\n```\n\n6. 当用户离开表单字段或切换出字段时，调用姓名字段验证：\n\n```javascript\n\
  name.blur(requiredName);\nname.keyup(requiredName);\n```\n\n7. 对表单中的邮箱和留言字段重复步骤\
  \ 4 到 6。\n\n8. 最后，在提交表单时也检查所有必填字段是否都已填写：\n\n```javascript\nform.submit(function()\
  \ {\n    if (requiredName() && requiredEmail() && requiredMessage())\n        return\
  \ true;\n    else\n        return false;\n});\n```\n\n*顺便说*：使用云脚本保持页面快速\n\n从互联网位置（例如此处\
  \ HTML 中的 [`code.jquery.com/jquery-1.5.2.min.js`](http://code.jquery.com/jquery-1.5.2.min.js)）链接脚本库是使用内容分发网络\
  \ (CDN)的一种方法。当许多开发者链接到同一个位置时，该脚本更有可能被读者的浏览器缓存并加快加载。\n\n\n\n此外，你的浏览器对特定主机名的并发连接数限制可能仅为两个，因此这会向单独的域名发送请求，从而提高速度。\n\
  \n\n\n\n\n- 开启新窗口\n- 设置、读取和删除 cookie\n\n在这一小时中，你还学习了可以使用 `JavaScript` 和 `jQuery`\
  \ 完成所有这些操作。`jQuery` 是一个框架，它让为你的网站安装和使用脚本变得简单。\n\n安装好 `jQuery` 之后，你还可以使用 `jQuery\
  \ Mobile` 让你的网页看起来更像移动端应用程序。\n\n如果你对学习更多 `JavaScript`、`jQuery` 和 `jQuery Mobile`\
  \ 感感兴趣，请参考附录 B 和 C 中列出的资源。\n\n### 问答\n\n**Q. 我注意到你在这 script 标签和 style 标签上从不包含 `type=\"\
  application/x-javascript\"` 或 `type=\"text/css\"` 属性。这是为什么？**\n\n**A.** 如果脚本或样式是浏览器期望的标准格式，HTML5\
  \ 不再需要这些属性了。你总是添加 `JavaScript` 以外的脚本语言或 `CSS` 以外的样式表语言，但那时你需要指定类型。\n\n**Q. 我听过 `jQuery`\
  \ 只是做动画的——这是真的吗？**\n\n**A.** `jQuery` 确实让为文档添加动画变得简单，由于它应用非常广泛，许多人认为它仅此此功能。但 `jQuery`\
  \ 的功能远不止于。了解 `jQuery` 能为你做一切的最佳方法是阅读 [jquery.com](http://jquery.com) 上的文档（[`docs.jquery.com/Main_Page`](http://docs.jquery.com/Main_Page)）。\n\
  \n**Q. 我不喜欢 jQuery Mobile 自带的样式——有办法更改这些样式吗？**\n\n**A.** `jQuery Mobile` 内置了几个主题，你可以使用它们来更改应用程序的颜色，或者你可以自己调整样式。目前还有主题滚轮器（theme\
  \ roller）的计划，以便你可以创建自己的主题。\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。你可以在附录\
  \ A 中的“测验答案”找到答案。\n\n#### 测验\n\n**1.** 判断对错：你可以将 `<script>` 标签放在文档的 `<head>` 和 `<body>`\
  \ 中。\n\n**2.** 你可以使用哪些样式选择器来创建文字悬停效果（rollovers）？\n\n**3.** 为什么要使用属性 `visibility:\
  \ hidden;` 而不是 `display: none;`？\n\n**4.** 将 `jQuery` 命令插入你的文档时编写的代码是什么？\n\n####\
  \ 练习题\n\n**1.** 构建一个带有悬停文字的 `jQuery` 页面。当鼠标悬停在段落上时，更改其颜色和背景图片。\n\n**2.** 使用 `jQuery\
  \ Mobile` 创建网站。在网站上添加至少四个页面，并在页面之间使用不同的切换效果。在 [`jquerymobile.com/`](http://jquerymobile.com/)\
  \ 了解更多关于 `jQuery Mobile` 的信息。\n\n## 第 6 小时。构建移动 Web 应用程序\n\n***在本小时你将学习到：***\n\n\
  - 如何创建一个移动端友好的网站或 应用程序\n- 如何规划一个新的移动 Web 应用程序\n- 如何使用 `HTML` 和 `CSS` 将你的计划付实践\n\
  - 创建移动 Web 应用程序的最佳实践\n\n在本小时中，你将学习创建移动 Web 应用程序的最佳方法。你将看到如何规划应用程序，使其同时适用于移动设备和非移动设备。\n\
  \n你还将学习如何将之前的小时中学到的 `HTML`、`CSS` 和任何 `jQuery` 组合在一起，创建一个简单应用程序的开头。\n\n最重要的是，你将学习一些已用于构建移动设备\
  \ Web 应用的最佳实践。你将发现哪些布局最有效，以及其他针对移动端的优化技巧。\n\n### 构建适用于所有设备的站点\n\n设计出色的移动端网页和应用程序的关键在于*不要*专门为移动设备设计——至少不要有针对性地设计。W3C\
  \ 将此称为“为单一 Web 设计”。^(1)与其只为桌面浏览器、只为智能手机设计或只为平板电脑设计，不如尝试设计考虑到所有这些设备的应用程序和网站。\n\n\
  做到这一点，你应该：\n\n- 确保显示在移动设备上的内容与显示在非移动设备上的内容具有相同的含义（即使不是完全相同的字句）。\n- 为你的页面添加增强功能，以反映用户代理（user\
  \ agents）的能力。\n- 使用优雅降级（graceful degradation）帮助旧且功能较弱的浏览器查看你的内容。\n- 在尽可能找到的所有设备和浏览器上测试你的页面。\n\
  \n顺便说：使用渐进式增强\n\n*渐进式增强*（Progressive enhancement）是优雅降级的替代方案。它不是从构建网站的尖端功能并创建回退方案开始，而是从构建更广泛支持的功能开始，然后为那些支持它的浏览器使用尖端功能来增强网站。最终，最佳解决方案是两者的结合——为你的尖端功能创建回退方案，为你的更主流的功能创建尖端增强。\n\
  \n当你规划网站时，很可能从桌面版本开始，然后处理移动端站点。但如果你反过来开始呢？\n\n如果你计划构建移动端应用程序，请从移动设备开始你的规划。在你设计好站点后，你再对其进行改进。\n\
  \n### 决定你想要的应用程序类型\n\n规划对于网站以及移动 Web 应用程序都是关重要的。当你开始构建网站或应用程序时，你可能急于编写 `HTML` 或设计样式和脚本。然而，花时间规划你的应用程序会让你更清楚你需要什么以及如何实现。\n\
  \n### 尝试一下：创建计划\n\n回答以下问题以制定应用程序计划。写下你的答案是最好的，以便以后参考。\n\n**1. 这个 Web 应用程序目的是目的是？**\n\
  \n这是应用程序的概述。用几句话描述你的应用程序将做什么，以及它如何比现有的任何网站或应用程序做得更好。\n\n**2. 应用程序的目标是什么？**\n\n考虑个人目标以及应用程序本身的目标。创建可操作的目标最好。这些有时被称为“SMART”目标，因为它们是特定的（Specific）、可衡量的（Measurable）、可操作的（Actionable）、现实的（Realistic）和有时的（Time-bound）。目标越具体，实现的可能性越大。\n\
  \n**3. 应用程序的客户或用户是谁？**\n\n尽可能具体地描述你认为的目标市场。你可以有多个目标，但应该包括性别、年龄、教育程度、职业行业、爱好和收入等细节。一个好主意是画像，甚至给他们命名并放照片，帮助你可视化你的客户和潜在客户。\n\
  \n**4. 应用程序的竞争者是谁？**\n\n记住跳出应用程序领域进行思考。仅仅你是第一个想到创建这种移动端应用程序的人，并不意味着在实体空间、零售或公共部门没有竞争对手。\n\
  \n对你潜在的竞争对手进行尽可能多的研究。他们从竞争产品中赚了多少钱？市场份额是多少？他们的优缺点是什么？\n\n你对竞争对手了解越多，就越能定位你的应用程序，利用他们的弱点并发挥你的优势。\n\
  \n**5. 还有哪些风险可能会影响应用程序的成功？**\n\n\n\n\n竞争对手并不是任何新创业务的唯一风险。你需要更多资金来启动吗？你的应用程序是否依赖于可能需要付费的外部数据？应用市场如何？你的目标客户愿意为服务付费吗，还是他们更倾向于免费并由广告支持？如果是后者，广告带来的收益是否足够让应用程序盈利？\n\
  \n不要忘记考虑如你在编程或设计方面的知识，以及提供帮助的承包人员的可用性。取决于你的应用程序，甚至天气也可能是一个风险。\n\n## 6. 应用开发的时间线是怎样的？\n\
  \n写下你理想的时间表，以及你认为完成应用程序各个部分需要多少时间。请记住，如果你为应用程序的某些部分聘请外部承包商，你需要了解他们的可用性，以及你自己的可用性。不要忘记包含测试、修订以及用户测试和反馈的时间。\n\
  \n在你对应用程序想要实现的功能有了计划后，你将开始考虑应用程序应该看起来什么样。我喜欢在纸上或在图形程序中绘制简单的原型图（mockups），以感受我心中应用程序或页面可能的外观。图\
  \ 6.1 显示了一个简单的原型图，展示了你可能希望应用程序在智能手机（如 iPhone）和平板电脑（如 iPad）上的样子。\n\n**图 6.1** 平板电脑和智能手机谜题应用的原型图。\n\
  \n![image](img/06fig01.jpg)\n\n你可以看到，初步的原型图不需要花哨。事实上，你甚至不需要颜色或图像。你只需要对页面想要想要的样子有一个大致的感受。\n\
  \n### 使用 HTML 构建应用程序\n\n在对功能和你的视觉需求有了基本计划后，你可以开始构建布局。我喜欢先构建手机布局，因为通常是单列的，且 HTML\
  \ 非常直观。\n\n### 动手试试：为谜题应用程序构建 HTML\n\n这个谜题应用程序将允许人们在线编写简单的文字谜题，并保存它们供他人解决。构建此应用程序你至少需要四个页面：\n\
  \n- 首页\n- 谜题列表页\n- 谜题创建页\n- 谜题解答页\n\n以下是构建谜题应用程序的步骤。\n\n#### 1. 首先为首页编写 HTML：\n\n\
  ```html\n<!doctype html>\n<<html>\n<head>\n    <title>Puzzles</title>\n</head>\n\
  <body>\n    <section id=\"container\">\n        <header id=\"header\">\n       \
  \ <h1>Puzzles</h1>\n        </header>\n        <section id=\"intro\">\n        \
  \    <p>这是我的谜题首页的介绍文字。</p>\n            <p>Duis aute irure dolor ut enim ad minim\
  \ veniam, ut aliquip ex ea commodo consequat. Sed do eiusmod tempor incididunt velit\
  \ esse cillum dolore in reprehenderit in voluptate. Eu fugiat nulla pariatur. Duis\
  \ aute irure dolor mollit anim id est laborum. Qui officia deserunt lorem ipsum\
  \ dolor sit amet, velit esse cillum dolore.</p>\n        </section>\n        <section\
  \ id=\"login\">\n            <h2>Login</h2>\n            <form action=\"#\">\n \
  \               <label for=\"username\">Username:</label><br>\n                <input\
  \ type=\"text\" name=\"username\" size=\"12\"><br>\n                <label for=\"\
  password\">Password:</label><br>\n                <input type=\"password\" name=\"\
  password\" size=\"12\"><br>\n                <input type=\"submit\" value=\"Login\"\
  >\n            </form>\n            <p><<a>>Lost password</a> <a>Register</a></p>\n\
  \        </section>\n        <footer>\n            <h3>&copy;2011 My Site</h3>\n\
  \        </footer>\n    </section>\n</body>\n</html>\n```\n\n所有后续页面将具有相似的 `HTML`\
  \ 格式。注意，所有的框都被放置在 `section` 中，以便于用 `CSS` 和 `JavaScript` 进行调整。\n\n#### 2. 对于后续页面，为每个页面上的额外元素创建\
  \ `section`，例如谜题输入和数据。首先，创建一个提供供用户选择的可用谜题列表的 `section`：\n\n```html\n<section id=\"\
  puzzle-list\">\n    <h2>Puzzles List</h2>\n    <table>\n        <tr>\n         \
  \   <th>Name</th>\n            <th>Author</th>\n            <th>Category</th>\n\
  \            <th>Difficulty</th>\n            <th>Completed?</th>\n        </tr>\n\
  \        <tr>\n            <td>Puzzle1</td>\n            <td>Author1</td>\n    \
  \        <td>Category1</td>\n            <td>Easy</td>\n            <td>No <a>Try\
  \ Now</a></td>\n        </tr>\n    </table>\n</section>\n```\n\n#### 3. 接下来，提供一个允许用户创建新谜题的\
  \ `section`：\n\n```html\n<section id=\"create-puzzle\">\n    <h2>Create a New Puzzle</h2>\n\
  \    <form method=\"post\" action=\"#\">\n        <label for=\"pname\">Puzzle Name:</label><br>\n\
  \        <input type=\"text\" name=\"pname\" size=\"50\"><br>\n        <label for=\"\
  pquestion\">Puzzle Question:</label><br>\n        <textarea name=\"pquestion\" rows=\"\
  5\" cols=\"50\"></textarea></br>\n        <label for=\"panswer\">Puzzle Answer</label>\n\
  \        ...\n    </form>\n</section>\n```\n\n#### 4. 最后，创建一个用户可以完成谜题的区域：\n\n```html\n\
  <section id=\"solve-puzzle\">\n    <h2>Solve a Puzzle</h2>\n    <h3>Puzzle Name</h3>\n\
  \    <p class=\"question\">Q:</p>\n    <form method=\"post\" action=\"#\">\n   \
  \     <label for=\"panswer\">Answer:</label>\n        <textarea name=\"panswer\"\
  \ rows=\"5\" cols=\"50\"></textarea><br>\n        <input type=\"submit\" value=\"\
  Submit\">\n    </form>\n</section>\n```\n\n这些页面看起来很丑，但通过使用 `CSS` 可以让它们变得更好看。当你对应用程序的功能有了计划后，你将开始考虑应用程序应该看起来什么样。\n\
  \n\n\n\n\n使用 em 指定行高也是一个好主意。为了获得最佳的文本效果，在行之间保持良好的宽间是明智的。这会让页面更易读。我通常会在字号基础上增加 5\
  \ 到 7 像素作为行高。所以对于 10px 的基础字号，行高大约是在字号基础上增加了 `0.5 em`。请务必尝试调整，正如你在前面的代码中看到的，行高只在字号基础上增加了\
  \ `0.4 em`。\n\n字体族是一个很有趣的尝试方向。正如第 3 章中提到的“使用 CSS3 样式化移动页面”所说，你应该使用字体族栈（font stack），以确保至少有一个字体是用户机器上拥有的字体。但除此之外，你选择什么字体完全取决于你自己。\n\
  \n* * *\n\n**注意！**：不要在字体上迷失\n\n大多数移动设备，即使是现代智能手机和平板电脑，安装的字体也不多。Android 自带了三个：`Droid\
  \ Sans`、`Droid Mono` 和 `Droid Serif`，但用户可以下载更多。iOS 自带的超过三个，但仍然远不及普通电脑的字体。\n\n* *\
  \ *\n\n有一点你不需要太担心无衬线字体（sans serif）与衬线字体（serif）的区别。以前的观点是，无衬线字体在网上更容易阅读，因为低分辨率显示器会导致像素化问题。在字号较小时，衬线往往会连在一起。但现在大多数人都有拥有相当高分辨率的显示器，可以清晰地显示衬线和无衬线字体，而没有太大困难。\n\
  \n你应该将页面限制在两个或三个不同的字体以内。对于正文和标题，你应该限制只使用衬线字体和无衬线字体（而不是使用更专业的脚本字体、幻化字体和等宽字体）。对于拼图应用，标题使用衬线字体，而正文使用无衬线字体：\n\
  \n```css\nh1, h2, h3, h4, h5, h6 {\n    font-family: \"Palatino Linotype\", \"Book\
  \ Antiqua\", Palatino, serif;\n}\n\np {\n    font-family: \"Trebuchet MS\", Arial,\
  \ Helvetica, sans-serif;\n}\n```\n\n* * *\n\n**注意！**：段落不是唯一的文本\n\n记住，当你给 `body`\
  \ 标签设置基础字体字号时，那是所有未设置样式字体将采用的大小。10 像素大小的字体可能非常阅读，因此请务必为其他纯文本元素（如 `<li>`、`<dd>` 和\
  \ `<dt>`）添加样式，或者确保所有的文本都封装在段落标签 `<p>` 中中。\n\n* * *\n\n### 添加颜色和背景图片\n\n你可以通过许多不同的方式为你的应用程序或网站选择颜色。有些人只是从喜欢的颜色开始，或者你可以从一张照片中提取调色板。如果你不知道想用什么颜色，网站\
  \ ColourLovers ([www.colourlovers.com/](http://www.colourlovers.com/)) 可以提供灵感。他们有一个专门针对网页调色板、图案和颜色的板块。\n\
  \n对于拼图应用，以蓝色作为基色，并在设计中加入白色以及其他几种颜色。以下是用于应用程序的配色方案：\n\n- `#3c6ac4`—你开始使用的蓝色\n- `#3c3cc3`—用于点缀的深蓝色\n\
  - `#c3963c`—用于高亮的棕褐色\n- `#000000`—用于文本的黑色\n- `#ffffff`—用于背景的白色\n\n应用程序还有一个拼图碎片 区域的图片。准备多个版本的图片是一个好主意，这样你最终可以定期更换它们。\n\
  \n你可以使用 `color` 属性更改字体颜色，如下：\n\n```css\ncolor: #000000;\n```\n\n如果你想更改背景颜色，使用 `background-color`\
  \ 属性，如下：\n\n```css\nbackground-color: #3c6ac4;\n```\n\nCSS 还允许你通过 `background-image`\
  \ 属性在设计中设置背景图片。你通过指向一个 URL 来设置图片：\n\n```css\nbackground-image: url('background.png');\n\
  ```\n\n这会让背景中的图片平铺。为了防止平铺，你可以使用 `background-repeat` 属性。然后你应该使用 `background-position`\
  \ 属性定义图像应该显示的位置。你也可以用一个属性设置背景图片、颜色、平铺和位置：`background`。\n\n要在白色背景上添加一张不重复的背景图片，并放在容器元素左上角向下\
  \ 1 em、向左 1 em 的位置，你可以写：\n\n```css\nbackground: #fff url(background.png) no-repeat\
  \ 1em 1em;\n```\n\n### 设计布局样式\n\n从图 6.1 中的原型图中你可以看到，对于 iPad 和更大的屏幕，你将创建一个通常被称为“大页脚”（fat\
  \ footer）的双列布局。这意味着页脚包含额外信息，并且通常比严格需要的要得多。这在设计上的处是增加了页面底部的权重，引导眼睛向下，有助于鼓励用户阅读整个页面。\n\
  \n但这种布局真正有趣的部分是它如何处理移动端和非移动页面。你希望可视窗口小于 480 像素的设备只看到一列，而较大的窗口将显示一列。图 6.2 显示了三种方式——在智能手机、iPod\
  \ touch 和 Android 平板。\n\n**图 6.2** 智能手机、iPod touch 和 Android 平板上的相同页面。\n\n![image](img/06fig02.jpg)\n\
  \n* * *\n\n**你知道吗？**：不要重复所有设备通用的 CSS\n\n当你使用 CSS3 媒体查询时，可以省略跨设备保持的样式。主样式表应将媒体类型设置为\
  \ `all` 或 `screen`，这样所有设备都会读取它。然后你只使用媒体查询样式表来修改它。\n\n* * *\n\n* * *\n\n动手尝试：为网页添加\
  \ CSS3 媒体查询\n\n学习如何为你的网页应用添加媒体查询，以支持功能手机、智能手机、平板电脑和浏览器。在这个示例中，平板电脑和浏览器使用相同的样式表，但你可以专门为平板创建一个。\n\
  \n1. 在文档的 `<head>` 中像往常一样链接主样式表。\n2. 在样式表下方，添加针对小于 320 像素的功能手机媒体查询样式表：\n\n```html\n\
  <link rel=\"stylesheet\" href=\"styles-320.css\" media=\"only screen and (max-width:320px)\"\
  >\n```\n\n3. 添加针对 320 到 480 像素之间的智能手机的媒体查询样式表：\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"styles-480.css\" media=\"only screen and (min-width:320px) and (max-width:480px)\"\
  >\n```\n\n你可以通过调整网页浏览器宽度至小于 320 像素以及在 320 到 480 像素之间来测试你的样式表的效果。当你重新加载时，页面应该发生变化。\n\
  \n\n\n\n\n如果你按照之前的说明创建了网站的移动版本，你可能会发现，在 iPhone 等现代智能手机上进行测试时，单列布局并没有出现。这是因为媒体查询（media\
  \ queries）向浏览器请求宽度，而 iPhone（以及 `Android` 手机）会根据其分辨率报告宽度。这意味着在你的 iPhone 或 iPod touch\
  \ 上，你看到的不是像图 6.2 所示的布局，而是如图 6.3 所示的完整双列布局。\n\n**图 6.3** iPod touch 上的双列布局。\n\n![image](img/06fig03.jpg)\n\
  \n这种布局对小屏幕来说并不友好。诚然，在 iOS 和 Android 上你可以手动对布局进行缩放，但这多了一个额外步骤。相反，你可以使用 meta 标签来告诉浏览器将宽度视为设备宽度，而不是\
  \ DPI 宽度。你可以通过视口 meta 标签来实现这一点：\n\n```html\n<meta name=\"viewport\" content=\"width=device-width\"\
  >\n```\n\n你可以使用多个 meta 标签来帮助你的 Web 应用程序对移动设备更加友好：\n\n• `mobileOptimized`—此 meta\
  \ 标签为 Pocket IE 创建。对于内容，你以像素为单位指定宽度。当此标签存在时，浏览器将强制布局为单列。\n\n• `handheldFriendly`—AvantGo\
  \ 和 Palm 最初使用此 meta 标签指示不应在移动设备上进行缩放的内容。对于移动页面内容为 true，对于非移动页面则为 false。\n\n• `viewport`—此\
  \ meta 标签控制 iOS、Android、webOS、Opera Mini、Opera Mobile 和 Blackberry 中浏览器窗口的尺寸和缩放。该标签将在本节稍后的部分详细介绍。\n\
  \n• `apple-mobile-web-app-capable`—如果 meta 标签的 content 属性为“yes”，则 Web 将在全屏模式下运行。如果是“no”，则不会。\n\
  \n• `apple-mobile-web-app-status-bar-style`—如果你的应用程序处于全屏模式，你可以将 iOS 设备上的状态栏更改为“black”（黑色）或“black-translucent”（半透明黑色）。\n\
  \n• `format-detection`—此 meta 标签开启或关闭对可能电话号码的自动检测。content 值可以为 `telephone=no`。默认是\
  \ `telephone=yes`。\n\n• `apple-touch-startup-image`—这不是一个 meta 标签。它是一个 `<link>`，允许你指定在\
  \ Web 应用程序启动时显示的启动图像。否则，iOS 将使用该 Web 应用程序上次使用的截图。通过向文档添加 `<link rel=\"apple-touch-startup-image\"\
  \ href=\"/startup.png\">` 来设置 320 × 460 像素的启动图像。\n\n• `apple-touch-icon` 和 `apple-touch-icon-precomposed`—这些也不是\
  \ meta 标签。但如果你在文档中添加 `<link rel=\"apple-touch-icon\" href=\"/icon.png\">`，你可以指定用于将应用程序保存到主屏幕的图标。在末尾添加\
  \ `-precomposed` 将帮助它在 Android 1.5 和 1.6 上运行，并移除 iOS 上图标的效果。将你的图标保存为 PNG ，尺寸至少为\
  \ 57 × 57 像素。\n\n***\n\n### 注意！Android 并不总是支持所有的 meta 标签\n\n某些 Android 版本（1.5、1.6、2.1\
  \ 等）不能可靠地支持上述所有的 meta 标签。由于安全 (https) 网站的 SSL 证书过期，触摸图标可能会混乱，某些 HTC 制造的手机（如 Evo）显示得异常。其他的\
  \ `apple-*` meta 标签可能支持，也可能不支持。如果这些标签对你的应用程序至关重要，请务必在 Android 上进行测试。\n\n***\n\n\
  在大多数情况下，你需要向应用程序添加的唯一 meta 标签是 `viewport` meta 标签。实现此点的最佳方法是将应用程序宽度设置为设备宽度。这可以防止你的应用程序在浏览器内进行缩放，并防止用户必须手动缩放才能查看你的应用程序。\n\
  \n使用 `viewport` meta 标签时，你可以调整几个属性：\n\n• `width`—视口以像素为单位的宽度。默认值为 980。你可以设置为 200\
  \ 到 10,000 之间的数字。\n\n• `height`—视口以像素为单位的高度。默认值根据设备的宽度和宽高比计算。你可以将其设置为 223 到 10,000\
  \ 之间的数字。\n\n• `initial-scale`—应用程序启动时的缩放比例。用户随后可以从该起点进行放大和缩小。\n\n• `minimum-scale`—视口的最小缩放值。默认值为\
  \ 0.25。你可以将其设置为 0 到 10.0 之间。\n\n• `maximum-scale`—视口的最大缩放值。默认值为 1.6。你可以将其设置为 0 到\
  \ 10.0 之间。\n\n• `user-scalable`—你可以设置用户是否可以在你的应用程序中进行放大和缩小。默认是“yes”。如果你不想这样做，请设置为“no”。\n\
  \n***\n\n### 注意！在禁用用户缩放时要小心\n\n尽管你可以通过 `viewport user-scalable` 属性进行一些操作（例如关闭缩放功能），但这可能会导致内容被隐藏。如果你禁用了缩放，用户可能会离开。\n\
  \n***\n\n使用 `viewport` 标签时，还可以使用两个值：`device-width` 和 `device-height`。这些会将宽度和高度设置为设备可用值。你可以通过逗号在\
  \ meta 标签中设置多个 选项。例如：\n\n```html\n<meta name=\"viewport\" content=\"device-width,device-height\"\
  >\n```\n\n移动用户的需求与桌面和笔记本电脑用户有所不同，部分是因为他们的屏幕较小且通常有带宽限制。因此，为了确保你的网站针对移动端进行了优化，你应该记住以下最佳实践：\n\
  \n• **保持设计简单**：设备越小，设计应该越简单。最简单的布局是单列。\n\n• **永远不要使用水平滚动**：某些手机不支持水平滚动，因此内容对它们来说完全不可。即使在\
  \ iPad 上，滚动条在用户尝试滚动之前也不会总是出现，因此水平滚动也会隐藏你的内容。\n\n• **使用大按钮**：将许多微小的链接挤在一个地方对移动用户来说非常恼人。Android\
  \ 和 iOS 都处理得很好点击，但不要创建那些需要像两岁小孩手指那样的链接。如果你禁用了页面缩放，这一点尤为重要。\n\n• **始终提供查看网站的选择**：你可以尽力优化网站以便其在移动设备上运行良好，但有时人们想查看完整网站，你应该允许他们这样做。\n\
  \n***\n\n### 注意！不要简单地重定向到你的移动主页\n\n当用户从其他来源（例如 Google）点击链接时，许多网站会将用户从他想的页面重定向到移动友好的主页。在大多数情况下，除非用户本来就打算访问你的主页，否则这种做法比帮助更有害，特别是如果他想访问的链接在主页上不可见。这是一个失去移动用户的有效方法。\n\
  \n***\n\n• **记住用户偏好**：在你知道用户喜欢在 iPad 或 Xoom 上查看网站完整版本后，你应该使用 cookie 始终为他们显示该版本，当然，如果他们需要，也可以切换回来。\n\
  \n• **让数据输入尽可能轻松**：即使是在 Xoom 这样的大平板电脑上，数据输入也比在计算机上困难。自动登录功能、保存数据以及使用相关的 `<input>`\
  \ 类型来获得更好的输入字段，都能让在移动设备上填写表单变得更容易。\n\n\n\n\n\n- **保持应用程序轻量化**——在应用程序的各个阶段都关注带宽，从图像和内容到通过\
  \ Web 服务器的 `HTTP` 请求，再到压缩文件。记住，大多数智能手机都有流量限制，因此你的页面越小，对限制的影响就越小。\n\n- **添加移动端特定功能**——通过使用内置的\
  \ `GPS` 和电话等设备功能，你的应用程序将感觉更像一个原生应用程序。此外，这些功能是为移动设备设计的，因此比任何非移动对应的功能都更容易使用。\n\n***\n\
  \n*你你知道吗？*: 使用点击拨号（Click-to-Call）\n\n点击拨号或点击通话通话是在网页和应用程序中添加链接的方法，这些链接直接指向电话号码。这使得支持此功能的浏览器用户只需点击链接的号码即可拨打电话或发送短信。你只需要编写\
  \ `<a href=\"tel:14255025366\">` 作为你的电话号码链接即可。图 6.4 显示了这可能是如何工作的。\n\n**图 6.4** iPhone\
  \ 上的点击通话链接。\n\n![image](img/06fig04.jpg)\n\n***\n\n- **减少对等待时间的感知**——使用技术让等待时间看起来不那么漫长，例如将你的脚本放在\
  \ `HTML` 的底部，使用加载图标和进度条显示程序正在运行，以及预加载图像和数据以利用缓存。\n\n- **优化所有图像**——避免使用大型高分辨率图像，在\
  \ `HTML` 中指定图像尺寸，并始终使用替代文本（alt text）。\n\n- **使用可读的颜色**——前景和背景之间的良好对比对于确保网站在小屏幕上可读至关重要。\n\
  \n- **不要使用像素测量**——像素和绝对测量在小屏幕上的渲染效果不好。请改用 `ems` 或百分比。\n\n- **保持内容尽可能清晰**——你所有的页面都应该有一个简短且描述性的页面标题。你页的内容应该是清晰并使用直接的语言。\n\
  \n- **注意可能在某些设备上失效的技术**——某些现代技术在较旧的移动设备上的支持并不良好。确保为 cookie、嵌入对象、表格、样式表、字体和颜色等提供回退方案（fallback）。\n\
  \n- **避免已知在移动设备上失效的技术**——这包括弹出窗口、嵌套表格、用于布局的表格、用于间距和布局的图形、框架和图像映射。\n\n构建移动 Web 应用的许多实践对于非移动设备同样重要。如果你设计的应用程序适用于“单一网络”（换句话说，适用于尽可能多的设备和浏览器），那么你的应用程序将更加健壮，并获得更满意的客户。\n\
  \n#### 总结\n\n在这一小时中，你学习了如何创建一个既支持移动端又支持非移动端的网站和应用程序。你学习了如何为“单一网络”（one web）进行设计。\n\
  \n你学习了如何创建网站规划，这对于创建一个满足所有用户需求的应用程序或网站至关重要。这包括：\n\n- 确定应用程序的目的和目标\n- 识别客户、竞争对手和风险\n\
  - 为应用程序准备时间表\n\n你还学习了如何使用 `HTML` 和 `CSS` 开始构建 Web 应用，以及如何使用 `CSS3` 媒体查询和移动端元标签（meta\
  \ tags）让你的设计在不同设备上有效显示。\n\n最后，你学习了许多针对移动设备优化网站的技巧。\n\n### 问答\n\n**Q. 在第 4 小节中你讨论了优雅降级（graceful\
  \ degradation），但在这一小时中你讨论了渐进增强（progressive enhancements）。我应该用哪一个？**\n\n**A.** 如果可能，请同时使用两种方法。这样，当用户拥有更强大的浏览器时，你的网站似乎会得到改进，但你仍然可以设定一个你会完全支持的最低浏览器标准。这会让你的工作稍微轻松一些，因为你不需要完全支持存在的每一个浏览器和移动设备，但你可以为你的网站添加那些有趣的、前沿的功能。\n\
  \n**Q. 我注意到你的 HTML 对 IE 8 及更低版本支持有限，但我需要支持这些浏览器。我该怎么办？**\n\n**A.** 支持 `IE 8` 及更低版本的最好方法是将你的\
  \ `HTML5` 标签包裹在带有 ID 的 `<<div>>` 标签中。例如，本节提供的 `HTML` 包含了名为 `<section id=\"container\"\
  >` 的部分。你可以在前面放一个 `<<div>>` 并将 `ID` 移动到那里：`<div id=\"container\"><section>`，这样你的样式即使在\
  \ `IE 8` 中也能正常工作。\n\n**Q. 我可以在哪里学习更多关于移动端元标签的知识？**\n\n**A.** Apple `iOS` 开发者中心 ([`developer.apple.com/devcenter/ios/index.action`](http://developer.apple.com/devcenter/ios/index.action))\
  \ 是一个很好的起点。它提供了许多关于为 `iOS` 构建应用程序的文章、指南和参考资料。Android 开发者页面 ([`developer.android.com/index.html`](http://developer.android.com/index.html))\
  \ 也是一个非常好的资源。\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学的内容。在阅读答案之前，尝试回答所有问题。请参见附录 A 中的“测验答案”。\n\
  \n#### 测验\n\n**1.** 什么是“SMART”目标？\n\n**2.** 一个 `em` 有多大？\n\n**3.** `apple-touch-image`\
  \ 元标签的作用是什么？你如何安装它？\n\n**4.** 构建移动应用程序时，你应该遵循的三个最佳实践是什么？\n\n#### 练习\n\n1. 根据你在本小时读到的信息为应用程序编写一个计划。\n\
  2. 在 [`puzzles.kyrnin.com/`](http://puzzles.kyrnin.com/) 查看你在本小时开始构建的应用程序的 HTML\
  \ 源代码。\n3. 构建一个网页并使用元标签关闭缩放。如果你操作得当，你不应该能够重新调整页面大小。\n\n## 第 7 小节：将网站升级到 HTML5\n\n\
  ***\n\n***在这一小时你将学到：***\n\n- 关于 `HTML 4` 以及你认为支持它的浏览器的事实\n- 如何跳转到 `HTML5`——这并没有你想象的那么困难\n\
  - 如何评估访问你网站的浏览器\n- 你现在可以使用哪些 `HTML5` 功能\n- 哪些功能可以在风险最小的情况下使用\n\n***\n\n构建网站是一项具有挑战性的工作。其中之一最大的挑战是决定将现有网站更新到新技术。这一小时将向你展示如何决定转向新技术是一个好主意。\n\
  \n你将学习更多关于 `HTML5` 和 `HTML 4` 之间的差异，以及哪些浏览器支持哪些功能。\n\n### 决定何时以及如何从 HTML4 升级\n\n\
  `HTML 4` 或 `HTML 4.01` 自 20 世纪 90 年代以来就被许多浏览器支持。它在 1998 年被制定标准。使用既定标准的优点是浏览器支持几乎通用，至少应该是这样。\n\
  \n但在你考虑长期使用 `HTML 4` 之前，你应该考虑以下几点：\n\n- 浏览器对 `HTML 4` 的支持并没有你想象的那么广泛。事实上，今天一些流行的浏览器并没有遵循该标准。\n\
  - 许多设备的浏览器不支持所有的 `HTML 4`，或者只提供部分支持。\n- 许多设备也拥有对 `HTML5` 支持良好的浏览器，且其使用量正在增长。\n\n\
  \n\n\n归而言之，如果你计划在未来几年内担任网页设计师，那么仅仅固守 `HTML 4` 将是一个糟糕的职业选择。`HTML5` 相比 `HTML 4` 提供了更多特性和功能，而且使用这些技术的设备正变得流行。\n\
  \n## 当前标准的流行浏览器支持\n\n截至 2011 年 4 月底，`Internet Explorer 6` 占据了 2.86% 的浏览器市场.^(1)\
  \ 这看起来可能并不多，但如果推算到整个网络，那是一个巨大的数字。事实上，`IE 6` 仍然是最受欢迎的 10 浏览器之一。\n\n问题在于 `IE 6` 存在大量的漏洞，这使得它的设计变得非常困难。最为人知的漏洞是\
  \ `IE 6` 处理浮动边距（floated margins）的方式。如果你使用标准的 `CSS` 为内部带有浮动元素的框添加外边距，`IE 6` 会将该边距加倍，如\
  \ 图 7.1 所示。\n\n**图 7.1.** 一个著名的 `IE 6` 漏洞表示，其中边距加倍。\n\n![image](img/07fig01.jpg)\n\
  \n还存在许多其他类似的漏洞，`Internet Explorer 6` 无法正确支持 `HTML` 和 `CSS` 标准。然而，它仍然非常流行的浏览器。\n\n\
  当然，随后 `IE 7` 面世并修复了这个问题——但并没有完全解决。你要知道，微软担心许多网页是使用黑科技（hacks）来支持 `IE 6` 的，因此在 `IE\
  \ 7` 和 `8` 中添加了“兼容模式”。这种模式强制浏览器表现得像充满漏洞的 `IE 5` 和 `IE 6` 版本。\n\n许多设计师认为，在大多数浏览器支持\
  \ `HTML5` 和 `CSS3` 特性之前，他们无法从 `HTML 4` 迁移到 `HTML5`（或从 `CSS2` 迁移到 `CSS3`）。兼容模式意味着即使人们升级到现代\
  \ `IE` 版本，这些版本仍然不支持 `HTML5` 和 `CSS3`。\n\n在许多方面，`Internet Explorer` 凭借其 `5` 和 `6`\
  \ 版本对标准的糟糕支持以及 `7` 和 `8` 版本中“兼容模式”的实现，单手阻碍了网页设计。由于兼容模式，网页设计师被迫继续支持各种黑科技和通变方案，以确保他们的页面可以被最常用的浏览器\
  \ `Internet Explorer` 查看。\n\n***\n\n*顺便说一下*：即使微软也希望 `IE 6` 灭亡\n\n微软有一个名为“Internet\
  \ Explorer 6 倒计时”的网站（[www.theie6countdown.com/default.aspx](http://www.theie6countdown.com/default.aspx)），旨在帮助人们远离这种旧浏览器。公司正在倒计时\
  \ `Internet Explorer 6` 不再被使用的那一天，并鼓励公司和个人放弃这个浏览器版本。微软甚至提供了一个横幅，你可以仅向 `IE 6` 用户显示以鼓励他们升级（[www.theie6countdown.com/join-us.aspx](http://www.theie6countdown.com/join-us.aspx)）。\n\
  \n***\n\n其他流行的浏览器包括 `Firefox`、`Chrome` 和 `Safari`。流行的移动浏览器有 `Opera`、`Android` 和\
  \ `iOS Safari`。移动浏览器在 `HTML5` 支持方面的进展没有那么快，但它们比 `IE 6`、`7` 或 `8` 支持得更好。\n\n在桌面浏览器，`Firefox\
  \ 4`、`Safari 5`、`Chrome 5` 和 `Opera 11` 对 `HTML5` 特性都有良好的支持。这些浏览器支持 `HTML5` 规范中\
  \ 60% 或以上的特性。移动浏览器的支持没有桌面浏览器那么好，Android 3.0` 和 `Opera mobile 11.5` 支持 60% 或以上的特性。`iOS`\
  \ 和 `Android 2.3` 支持略于 50% 的 `HTML5` 特性。\n\n因此，当你使用 `HTML5` 设计页面时，通常你只需要担心的浏览器就是\
  \ `Internet Explorer`。\n\n## 逐渐转向 HTML5\n\n与其等待所有浏览器都支持 `HTML5` 标准的遥将来，你应该使用渐进增强（progressive\
  \ enhancement）和优雅降级（graceful degradation）来推动你的网站发展。这可以保持你的技能和网站与时同步，并给你的用户一个升级的理由。\n\
  \n升级网站的最佳方法是逐步进行。这被称为*迭代设计*（iterative design）。迭代设计是一个缓慢、逐渐并经过大量测试对网站进行更改的过程。与其发布一个完全全新且不同的网站，不如使用迭代设计来添加客户几乎察觉不到的小改动。\n\
  \n***\n\n*你知道吗？*：一些流行的网站使用了迭代设计\n\n如果你仍然不确定是否应该对网站进行渐进变化以从 `HTML 4` 迁移到 `HTML5`，那么你会很欣慰地知道许多许多网站正是以这种方式进行更改的。[Amazon.com](http://Amazon.com)\
  \ 作为一个流行的电子商务网站，使用迭代设计来逐步对其页面添加更改。事实上，它的许多更改都进行得非常缓慢，以至于客户甚至没有意识到它的发生。这给客户带来的干扰极小，因此对公司收入的干扰也最小。\n\
  \n***\n\n当你考虑升级到 `HTML5` 时，你应该考虑诸如下因素：\n\n- 用户使用哪些浏览器访问你的网站\n- 访问你网站的浏览器数量\n- 你的网站升级到\
  \ `HTML5` 能获得什么种益处\n- 在进行更改时，从访问量最少的页面开始，这样如果发生了巨大的问题，影响的人就较少。\n\n为了将哪些添加到 `HTML5`，你可以通过*分流测试*（部分用户看到旧版本，部分看到新版本）来对比新功能的性能。你可以使用\
  \ Google Website Optimizer ([www.google.com/websiteoptimizer/index.html](http://www.google.com/websiteoptimizer/index.html))\
  \ 对网站进行测试。\n\n## 评估访问你网站的浏览器\n\n在决定升级网站时，你首先应该考虑的是哪些浏览器支持你正在考虑的技术。你可能会想查看 [W3Counter.com](http://W3Counter.com)\
  \ 这样的网站，注意到 `Internet Explorer` 仍然拥有最大的市场份额，并在此放弃 `HTML5`。正如前面提到的，许多设计师都这样做。\n\n\
  但 [W3Counter.com](http://W3Counter.com) 仅显示它追踪的网站统计数据。这是一个很大的数字，但每个网站都是不同的。例如，考虑\
  \ [Apple.com](http://Apple.com)。虽然存在 `Internet Explorer` 用户访问 `Apple.com` 的这种可能性，但\
  \ `IE` 在 [W3Counter.com](http://W3Counter.com) 上的浏览器份额是不可能的。另一个网站的 `Firefox` 用户比例可能高达\
  \ 76%。该网站的设计师应该避免关注 `Internet Explorer`。\n\n\n\n\n在你了解了目前访问你网站的 10 种最流行的桌面和移动浏览器后，就可以开始考虑想要为网站添加哪些\
  \ HTML5 特性了。\n\n## 亲自尝试一下：在 Google Analytics 中查看用户的浏览器\n\n如果你在网站上安装了 Google Analytics，你可以快速查看访问网站的浏览器概览。\n\
  \n1. 登录你的 Google Analytics 账户（[www.google.com/analytics/](http://www.google.com/analytics/)）。\n\
  2. 查看你的报告并进入“访客”（Visitors）部分。\n3. 点击“浏览器功能”（Browser Capabilities），然后点击“浏览器”（Browsers）。\n\
  4. 点击浏览器名称以查看访问你网站的版本。请务必排除你在测试期间可能添加的页面浏览，以免将其包含在内。\n\n## 移动网络浏览的上升趋势\n\n在了解哪些浏览器访问了你的网站后，你可能想为了迎合这些浏览器而构建网站。但浏览器的使用情况一直在变化。事实上，仅仅因为现在你的网站移动端使用量不多，并不意味着未来不会增加。2010\
  \ 年 12 月发现，20% 的美国和英国互联网用户仅通过移动设备浏览网页。在非洲和亚洲，这个数字接近 50%。有更多人在移动端进行定期的网页浏览，随着 iPad\
  \ 等平板电脑普及度的提高，这一事实变得更加明显。第一代 iPad 在前几周的销售额就达到了数百万，分析师估计 iPad 2 在前三天内售出了 40 万到 80\
  \ 万台。对于所有网站来说，移动端的使用量在未来可能会继续增长。如果你开始编写支持移动端的页面，你的网站将领先于潮流。\n\nHTML5 能够很好地支持移动设备。iOS\
  \ 和 Android 设备日益流行，随着它们的普及，人们会越来越明显地发现，基于可在两类设备上运行的标准的应用更具成本效益。HTML5 作为一个已经在这些平台获得获得支持的标准，是一个自然的演进。\n\
  \n## 现在就可以使用的 HTML5 特性\n\n如果你在纠结从哪里开始学习 HTML5，那么你应该从那些现在就可以使用的特性开始。这里所说的“现在”，是指它们要么在大多数现代浏览器和设备中确实有效，要么被现代浏览器忽略，因此不会在不支持特性的浏览器中破坏原有功能。\n\
  \n要将现有的页面从 HTML 4.01 转换为 HTML5，请遵循以下步骤：\n\n1. 将你的文档类型更改为新的 HTML5 类型：`<!doctype html>`。这完全不会损坏任何浏览器。如果它们不识别该文档类型，将直接忽略它。最坏的情况下，IE\
  \ 8 及更低版本可能会进入兼容模式。通过将文档类型更改为新的 HTML5 类型，你实际上是在宣布你打算采用这一即将成为标准的规范。新的文档类型也更短，有助于减少用户需要下载的字符数。\n\
  2. 使用新的字符集元标记：`<meta charset=utf-8>`。所有主流浏览器已经支持了此特性。\n\n### 注意！始终声明字符编码\n\n即使你从未计划使用任何非英语字符，也应该在\
  \ HTML 的 `<head>` 中指定字符集。如果不这样做，你的网站可能会受到跨站脚本攻击。\n\n3. 简化 `<script>` 和 `<style>`\
  \ 标签。你不再需要 JavaScript (ECMAScript) 或层样式表使用 `type` 属性。省略此属性有助于简化你的 HTML。\n4. 链接整个块而非仅链接其中的文本。如果你在\
  \ `<p>` 标签周围放置 `<a>` 标签，浏览器是没有问题的，而且链接整个段落比点击其中的一两个单词更容易点击。这还包括段落块内的所有元素。\n5. 使用表单输入类型。如果你请求电话号码，请使用\
  \ `type=tel`；对于电子邮件地址，使用 `type=email`。不支持这些特性的浏览器将正常显示文本框，而支持这些特性的浏览器将提供额外功能。第 13\
  \ 小节 “HTML5 表单”更多地讨论了这个话题。\n6. 使用 `<video>` 和 `<audio>` 标签处理视频和音频，并为旧浏览器提供备用方案。第\
  \ 12 小节 “HTML5 中的音频和视频”详细讨论了如何实现这一点。\n7. 即使你不使用 HTML5 标签，也可以将区块元素作为文档中的类名。例如，你可以使用\
  \ `<div class=\"header\">` 而不是 `<header>`。这有时被称为 POSH 或纯语义化 HTML（Plain Old Semantic\
  \ HTML）。\n8. 最后，在适当的地方使用新的语义化标签。如 `<mark>` 和 `<time>` 等标签提供了关于内容的额外信息。不支持这些特性的浏览器将直接忽略它们。\n\
  \n即使上述步骤代表了你目前觉得可以胜任的所有 HTML5 操作，你已经在改进你的网站了。如果你想进入前沿技术，请查看你想要添加哪些特性。\n\n## HTML5\
  \ 的支持现状\n\n在因为 Internet Explorer 不支持 HTML5 而对其否定它之前，你应该意识到 IE 8 支持部分 HTML5 内容。例如：\n\
  \n- `contenteditable`：这是一个新的 HTML5 属性，Internet Explorer 从第 5 版本开始支持它。然而，任何移动浏览器都不支持该属性。第\
  \ 14 小节 “使用 HTML5 编辑内容和交互”更多讨论了这一点。\n- 拖放：这是另一个由微软开发的实现，IE 从第 5 版本开始支持。目前 Opera\
  \ 或 iOS 不支持。第 16 小节 “使用 HTML5 拖放功能”更多讨论了这一点。\n- 数据集和 `data-*` 属性：这在 Chrome 和 Opera\
  \ 11 上有很好的支持，但在 IE、Safari、Android、iOS 和 Opera 上支持有限。第 17 小节 “HTML5 链接)”涵盖了这些。\n\n\
  HTML5 还有许多 IE 8 不支持但 IE 9 支持的内容：\n\n- `canvas`：IE 9 以及所有其他浏览器都可以显示 `canvas` 标签。事实上，唯一不支持它的浏览器是\
  \ Opera Mini。[第 10 小节 “使用 HTML5 Canvas 元素绘图”涵盖了 `canvas` 元素。\n- `video`：音频的支持与视频相同。第\
  \ 12 小节 也涵盖了它。\n- `audio`：该特性 IE 9 支持，但在 iOS 和 Android 上有良好的移动端支持，在 Firefox、Safari、Opera\
  \ 和 Chrome 上也有良好的支持。第 21 小节 “HTML5 中的网络存储”提供了更详细的内容。\n\n但这些并不是 HTML5 中可用特性的全部。其他特性在各种浏览器中都有支持：\n\
  \n- 新的语义元素：这些新元素在当前的浏览器版本中都受支持。IE 8 不支持它们，但有解决方法。第 9 小节 “通过 HTML5 区块和语义元素添加含义”涵盖了这些元素。\n\
  \n\n\n\n\n- **Ruby 注释**——尽管目前没有浏览器能完全支持 Ruby 注释，但 IE 从 6 版本起已提供部分支持。Chrome 从 8 版本起已支持。Safari\
  \ 5 和 Android 3 也有部分支持。在第 14 节“使用 HTML5 编辑内容和用户交互”中了解更多信息。\n- **历史记录管理**——当前版本的\
  \ Chrome、Android 和 Firefox 都支持历史 API。Safari 和 iOS 有部分支持。第 22 节“使用 History API 控制浏览器历史”可以教你所有关于历史\
  \ API 的知识。\n\n### 将 HTML5 功能作为额外内容添加到你的网站\n\n向你的网站添加 HTML5 的一种方法是将其作为额外内容添加，这样如果浏览器忽略了它们，用户也不会丢失任何内容。但如果浏览器支持这些功能，用户将获得额外的奖励。\n\
  \n以下是你现在就可以添加到页面中的一些 HTML5 元素：\n\n- `figure` 和 `figcaption`——这些标签允许你将文档的章节定义为自包含的内容块。\n\
  - `mark`——通过 `mark` 标签，你可以突出显示一段文本以便引用。\n- `small`——这个 HTML 4 标签在 HTML5 中变得更具语义化。现在它指的是细则字体，而不仅仅是使用较小字体写的文本。\n\
  - `time`——`time` 标签同时定义了日期和时间。\n\n第 9 节 详细介绍了这些章节元素和语义化元素。\n\n使用上述元素并不是你通过 HTML5\
  \ 改进网站的唯一方法。例如，HTML5 有一些更宽松的语法规则，它们将帮助你的页面加载得更快：\n\n- 你不需要给属性加引号。如果你的属性中没有空格，就可以省略引号。这简化了你的\
  \ HTML 并且减少了需要下载的字符数。\n- 使用新的文档类型：`<!doctype html>`。它更短、容易记忆，并且完全不会影响浏览器性能。\n\n\
  *顺带提一下*：使用新的文档类型是趋势\n\n即使是 [Google.com](http://Google.com) 也使用新的文档类型，而 Google 拥有互联网上最高的访问量。如果\
  \ Google 可以使用新的文档类型，它对你的网站也不会有害。\n\n- 你不需要担心大小写。HTML5 不要求你担心标签和属性的大小写。我建议你仍然坚持使用全小写，但这是强制性的。\n\
  \n如果浏览器不支持某些表单功能，它们也会忽略它们。但支持这些功能的浏览器会让你的表单更有效。以下是一些可以为你的表单增加值的 HTML5 表单功能：\n\n\
  - **使用 placeholder 属性。**占位符文本是显示如何填写表单字段极极方法。\n- **定义必填字段。**始终在服务器端和客户端同时验证必填字段。不支持\
  \ `required` 属性的浏览器会忽略它。\n- **设置自动聚焦。**自动聚焦（autofocus）将光标直接放在第一个表单元素中。你可能已经在用 JavaScript\
  \ 这样做了，所以添加 `autofocus` 属性也不会有任何影响。\n- **查看本地存储选项。**本地存储通过为数据提供更多空间来改进你的表单和应用程序。\n\
  \n第 13 节 详细介绍了表单元素。你可以在第 21 节中学习更多关于本地存储的知识。\n\n有些新功能技术上并不是 HTML5，但它们也可以为你的网站增添色彩：\n\
  \n- **CSS3**——层级样式表 3 在许多浏览器中都支持，并且它的大部分一直受到支持。使用它是改进你网站的好方法。参见第 3 节“使用 CSS3 为移动页面样式”。\n\
  - **SVG**——可缩矢量图形被 Android 2.3 之外的所有 Web 浏览器当前版本支持。第 10 节 讨论更多 SVG 的内容。\n\n### 让你的网站变成强大的移动应用的\
  \ HTML5 功能\n\nHTML5 不仅仅改进电脑浏览器网站的方法。HTML5 的某些功能似乎几乎是为移动设备身定制的：\n\n- **地理定位**——定位是一个独立的\
  \ API，通常包含在 HTML5 工具集中，它是移动应用程序的完美工具。位置服务对于移动中的移动设备非常有用。你将在第 23 节“使用 Geolocation\
  \ 添加位置检测”中学习如何使用 Geolocation API。\n- **离线应用程序**——移动设备会移动，它们并不总是在线。离线应用程序对于移动设备来说是完美的，因为无论是否有互联网连接它们运行。你将在第\
  \ 20 节“离线 Web 应用”中学习更多关于这些应用。\n- **语音识别**——HTML5 为表单标签添加了 `speech` 属性。对着手机说话比输入要容易得多。\n\
  - **新的输入类型**——新的表单输入类型让移动设备填写表单变得容易得多。第 13 节\n- **Canvas**——`canvas` 标签是为移动应用添加动画、图像的极佳方法。你将在第\
  \ 10 节学习如何使用 `<canvas>`。\n- **视频和音频**——这两个标签在 Android 和 iOS 上都得到了良好支持。你将在第 12 节学习如何使用它们。\n\
  - **移动事件**——如 `touchstart` 和 `touchmove` 等特定事件是为触摸设备创建的。第 16 节 详细介绍了这些事件。\n\n####\
  \ 总结\n\n在本节中你发现 HTML 4 并不是完美版本。在现代浏览器中运行它需要许多黑科技和替代方案。你学会了关注现代浏览器。你还学会了许多现在可以做但对你的网站没有影响的事情。你可能对\
  \ HTML5 的部分功能在 IE 5.5 中就能支持感到惊讶。最后，你了解了一些为网站增加值的 HTML5 功能。\n\n### 问答\n\n**Q. *决定何时停止支持某个浏览器的良好界限标准是什么？***\n\
  \n**A.** 这是一个很难回答的问题，因为每个网站都不同。但一个通用的规则是考虑你目前的访问量，然后将其与使用旧浏览器的用户百分比进行比较。对于每天有百万唯一访客的网站，1%\
  \ 可能太高了，因为这意味着有 10,000 名用户获得了较差的体验。但对于每天有 1,000 个访客的网站，10% 可能是可以的。你必须评估你的网站和你的舒适度。\n\
  \n**Q. *我讨厌丢失任何客户的主意。没有什么方法可以使用 HTML5 而不把他们赶走吗？***\n\n**A.** 你不应该试图赶走客户。记住，HTML5\
  \ 的许多新功能并不会让你的网站对旧浏览器不可用；只是它们无法获得所有功能。此外记住，网站主一直在这样做了。许多网站没有提供 Flash 的替代方案，所以 iPad\
  \ 和 iPhone 用户被完全排除在外。如果无法访问视频，访问可能不会离开，因为你的其他内容仍然有用，但如果你的整个网站是空白的，他们可能再也不会回来了。\n\
  \n**Q. *即使许多访问我网站的用户使用的是不支持这些功能的浏览器，我该做什么才能尽早使用更多 HTML5 移动功能？***\n\n\n\n\n\n# A.\
  \ 你可以为网站添加 HTML5 移动功能，同时通过多种方式支持兼容性较差的浏览器。使用像 `Modernizr` 这样的检测脚本正如你在第 8 小中所学到的，“将\
  \ Web 应用转换为移动端](#ch08.html_ch08)”，是第一步。但你还可以使用媒体查询来调整设计以适应特定设备（在第 4 小中讨论过“检测移动设备和\
  \ HTML5 支持”），并使用 polyfills（填充）作为其他 HTML5 API 和功能的备选方案。你可以在 Modernizr 的 wiki 上找到一个非常优秀的备选方案和\
  \ poly 列表（[`github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills`](https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills)）。\n\
  \n# Q. 如果使用现代浏览器有这么多优势，为什么人们不升级呢？\n\n# A. 人们不升级浏览器有很多原因：\n\n- 他们不知道有新版本可以升级。\n-\
  \ 他们担心升级会导致某些功能崩溃。\n- 他们使用的插件或网站在新版浏览器中无法运行。\n- 他们的组织对浏览器版本有特定要求，他们不被允许升级。\n\n直到最近，大多数网络浏览器还没有内置对新版本的检查功能，即使有，也可以被不想升级的用户轻松地取消。\n\
  \n## 工作坊 (Workshop)\n\n工作坊包含了一些测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。答案请参阅附录 A“测验答案”。\n\
  \n### 测验\n\n**1.** Internet Explorer 是如何阻碍基于标准的网页的发展的？\n\n**2.** 什么是迭代设计？你为什么应该使用它？\n\
  \n**3.** HTML5 的哪些功能是目前可以直接使用的？\n\n**4.** 远在版本 5.5 或 6 的 IE 支持哪些 HTML5 功能？\n\n###\
  \ 练习题\n\n**1.** 如果你的网站上还没有 Google Analytics 或其它数据分析包，你应该立即安装一个。安装完成后，按照本节提供的说明，查看访问你网站的浏览器分布情况。\n\
  \n**2.** 访问你现有的其中一个网站，添加目前可以直接使用的 HTML5 功能。更改文档类型声明（doctype）和字符集标签，并简化你的脚本和样式。你还应该查看哪里可以移除属性周围的引号并进一步简化你的\
  \ HTML。\n\n**3.** 在你的网站上选择一个访问量少于大多数页面的页面，开始对其进行迭代更改，使其更符合 HTML5 标准。添加语义化标签，并思考你可能如何使用一些新的\
  \ HTML5 功能来增强文档。\n\n## 第 8 小节。将 Web 应用转换为移动端\n\n***\n\n**在本节中将学到：***\n\n- 如何让移动设计尽可能简单\n\
  - 哪些工具可以帮助你构建移动应用程序\n- 如何寻找看起来具有移动感的图像和设计\n- 在不购买几十部手机的情况下可用于测试的工具\n- 如何确保兼容性较差的浏览器看起来依然良好\n\
  \n***\n\n创建 HTML5 Web 应用程序需要大量的精力和精力。正如几节讨论过的，设计移动应用程序最重要的部分是创建一个尽可能通用的网站或应用程序——即为“单一网络”（one\
  \ web）构建。但这并不意味着你需要重新发明移动端的轮子。你可以使用许多软件工具和开发技能来帮助你构建移动应用程序，或将你现有的网站转换为移动站点。\n\n\
  在本节中，你将学习帮助测试现有文档是否支持移动端的工具。你还将学习使用设计的基本元素来设计移动应用程序所需的技能。然后，你将了解到一些可以使用的脚本，帮助检测\
  \ HTML5 支持，甚至为旧版浏览器中的标签添加一些有限的支持。本节还将向你展示在哪里可以找到仿真器和在线模拟器等工具，以便在你不拥有的设备上检查你的应用程序。你将学习如何从移动用户的角度来评估你的现有网站，以及如何将这些页面转换为移动友好型设计。\n\
  \n### 选择网页编辑器\n\n你的网页编辑器是你开发移动 Web 应用时最重要的工具。虽然可以使用仅如 `Notepad` 这样的文本编辑器创建 Web 应用，但专业的网页编辑器或集成开发环境\
  \ (`IDE`) 可以为你提供许多额外的功能，这些功能完全物有所值。\n\n专业的网页编辑器和 IDE 提供以下功能：\n\n- 代码验证\n- 浏览器预览\n\
  - 网站文件管理\n- 项目管理\n- 脚本调试\n- 与其他工具集成\n\n一些用于移动应用程序的最佳网页编辑器有\n\n- **Dreamweaver**—`Dreamweaver`\
  \ CS5.5 包含了与 `PhoneGap` 的集成，你将在本节稍些时候学习更多关于它的信息，并在第 24 小节“将 HTML5 应用转换为原生应用](#ch24.html_ch24)”中再次学习。你可以从\
  \ Adobe 网站（[www.adobe.com](https://www.adobe.com)）获取 `Dreamweaver` 的试用版。\n- **Komodo\
  \ IDE**—`Komodo IDE` 支持多种语言，它是构建应用程序的良好选择。你可以从其网站获取名为 `Komodo Edit` 的免费版本（[www.activestate.com/komodo-ide](https://www.activestate.com/komodo-ide)）。\n\
  - **TopStyle**—`TopStyle`（[www.topstyle.com](https://www.topstyle.com)）是一款 Windows\
  \ 上的 CSS 编辑器，同时也处理大量的 HTML。\n- **SiteSpinner Pro**—`SiteSpinner Pro`（[www.mechanics.com/products/spinnerpro/index.html](https://www.mechanics.com/products/spinnerpro/index.html)）是一款\
  \ Windows 上的所见即所得编辑器，同时也提供移动设备预览。\n\n你可以选择多种网页编辑器来构建你的移动应用程序或转换现有网站。如果你已经在使用其中一种，没有必要更换，但如果你仍在使用并非专门用于\
  \ HTML 的文本编辑器（如 `TextEdit`）构建网页，那么寻找一个新的网页编辑器会让你的开发工作更快速、更流畅。\n\n### 测试你的应用程序\n\n\
  测试应用程序的第一步是查看你的应用程序在移动支持方面的现状如何。在尽可能多的移动设备上为你的设计截图——即使只有一个也比没有好。![图 8.1 显示了在 iPod\
  \ touch 上这本书的网站。虽然网站针对移动设备做了一些调整，但你一眼看出它并不像可以那么友好。**图 8.1.** 在 iPod touch 上查看网站。![image](img/08fig01.jpg)\n\
  \n以下是导致该网站对移动设备不友的一些问题：\n\n- 标题有点小。\n- 移动网站不应该有两层导航。\n- 巨大的“文章”标题占据了太多空间。\n- 颜色不是最初设计选择的颜色。\n\
  \n测试网页和应用程序的最佳工具之一是*验证器*（validator）。有很多类型的 Web 应用验证器可用，包括：\n\n- **HTML 验证器**——用于测试你的\
  \ HTML 是否正确。\n- **无可访问性验证器**——测试网页能够被屏幕阅读器读取的程度。\n\n\n\n\n\n- **代码验证器**——这些工具会检查你的脚本、CSS\
  \ 和 API 的准确性。这些工具的另一个名称是 `lint`；例如，`JS lint` 工具会检查 JavaScript。\n- **移动端验证器**——这些验证器会提供关于如何改进移动设备页面的建议。它们通常也兼当模拟器的角色。\n\
  \n使用验证器进行测试可以确保你看到的任何问题都不是由无效代码引起的。\n\n前面的列表并不是你需要的所有测试。现在有很多工具可以评估你的网站，看看它对移动用户有多友好。一个很好的工具是位于\
  \ [`validator.w3.org/mobile/`](http://validator.w3.org/mobile/) 的 `W3C mobileOK\
  \ Checker`。另一个好工具是位于 [`ready.mobi/`](http://ready.mobi/) 的 `mobiReady`。`W3C mobileOK\
  \ Checker` 和 `mobiReady` 都会查看互联网上的在线页面，然后提供一份关于它们在移动设备上性能的报告。\n\n***\n\n**注意！**不要盲目遵循任何验证器的建议\n\
  \n`W3C mobileOK Checker`是一个非常有价值的工具，但你不应该盲目地执行它建议的所有指南。许多移动端检查器和验证器是在 HTML5 在智能手机市场流行之前构建的。`W3C\
  \ validator` 根据 `XHTML Basic` 检查你的站点。此外，如果你没有使用 `XHTML mobile profile`，`mobiReady`\
  \ 会给你低分，而 `HTML5` 比 `XHTML Basic` 或 `XHTML mobile profiles` 都更先进。\n\n***\n\n这些工具可以让你在适配移动应用程序时，对应该关注的问题有一个良好的了解。你应该考虑的一些（并且这些测试套件会警告你的）事项包括：\n\
  \n- **页面大小**——保持移动页面大小尽可能小，以便它们快速加载。一个通用的规则是，将移动页面大小（包括所有图像、脚本和 CSS）为功能手机保持在 20KB\
  \ 以下，为智能手机和电脑浏览器保持在 30KB–50KB 之间。\n- **图形尺寸**——你应该为较小设备上的用户提供更窄的图形。对于可以浏览网页的手机来说，200\
  \ 像素宽大约就是图像的理想宽度。这些手机通常被称为 `feature phones`（功能机），因为它们提供的功能比标准手机多，但没有智能手机那么强大。\n\
  - **脚本和样式表**——许多功能手机对脚本或 CSS 的支持并不很好，如果你预计大量的网站访问者使用这些手机，就应该确保你的内容不依赖它们。\n- **表单**——记住在手机手机上向表单字段输入字是很困难的。尽可能使用单选按钮或复选框是一个很好的替代方案。\n\
  - **访问键**——在链接上放置访问键或键盘快捷键将让功能手机用户更容易点击。\n\n### 评估你的内容\n\n在了解你的网站在移动设备上的样子之后，你需要进行一些内容评估。移动内容的创建比标准网站内容需要不同的技能。在第\
  \ 4 节 的“检测移动设备和 HTML5 支持”中，你学习了如何使用 `CSS3` 媒体查询根据查看网站的浏览器来更改网站的外观，但你也应该通过这些媒体查询来更改内容。\n\
  \n移动内容应该是：\n\n- **简短**——设备越小，一次下载的内容应该越少。因此，你可能会完整交付给 iPad 或桌面电脑的全页文章应该被拆分成碎片，或者只为功能手机交付标题。\n\
  - **直接**——在较小的设备上，你必须立即抓住读者的注意力。你应该删除所有与内容主点即使稍微无关的内容。\n- **易于使用**——在功能手机上按返回键比填写表单要容易得多。你希望让你的移动内容（特别是对于非常小的设备）尽可能简单且实用。\n\
  - **客户所希望的**——设备越小，你就越应该专注于只提供客户想要的最基本的功能。\n\n然而，不要只关注要删除哪些内容。你还应该考虑可以向页面添加哪些功能，以让移动客户执行任务更轻松。你可以在你的移动页面上添加的一些内容包括：\n\
  \n- **回到顶部链接**——在智能手机或电脑浏览器上，向导航或页面顶部添加链接并不总是，但这可以让网站在功能手机上变得更容易使用。\n- **电子邮件链接**——添加允许观众将页面部分通过电子邮件发送给自己或其他人的链接。这既推广了你的页面，又帮助你的移动读者更有效地使用它，因为在电脑上阅读网站比在功能手机上要容易得多。\n\
  - **额外服务**——指向如 `Mobilizer`、`Read It Later` 或 `Instapaper` 等服务的链接允许你的移动读者保存你的内容，以便在他们方便时阅读。\n\
  \n#### 为移动端更改视觉设计\n\n移动设计有许多共同点，但遗憾的是，很多时候，移动设计最常见的特征是它有多么丑。这是因为大多数人阅读了像本节之前提供的这类建议，并将其解释为“为最低公约数设计”。\n\
  \n但这绝对不是你应该做的。\n\n相反，回看第 4 节，那里谈到了优雅降级。你视觉设计的目标不应该是让你的网站在每种情况下看起来都一样。目标应该是让它在大多数设备上具有功能，并且对你的目标观众是卓越的。\n\
  \n你应该设计一件恰好可以在功能手机上查看的艺术品——而不是在 iPad 和功能手机上看起来一样的平庸画作。\n\n#### 利用设计元素创建出色的移动应用程序\n\
  \n你必须首先学习设计元素：\n\n- 颜色\n- 方向\n- 线条\n- 形状\n- 纹理\n\n显然，颜色指的是用于网页的那些颜色。颜色也存在于黑白之间，带有灰色调。\n\
  \n***\n\n**顺便说一下**：即使是黑色区块也有颜色\n\n当你看带有大块文本的网页时，这些文本块会混合在一起，使页面看起来更亮更白或更深更黑。图形设计师将其称为文本的“颜色”。你可以通过\
  \ `line-height` CSS 样式属性影响你文本块的相对深度或浅度（“颜色”）。文本行之间的空间越宽，该文本块看起来就越亮。\n\n***\n\n你通过\
  \ `color`、`background-color` 和 `border-color` 样式属性为你的设计添加颜色。\n\n大多数移动设计使用颜色来突出文本和标题。事实上，移动设计最常见的样式之一是在顶部有一个带有颜色背景的标题，样式如下：\n\
  \n```\n<style>\nh1 {\n     background-color: #c16f5b;\n     color: #000;\n}\n</style>\n\
  ```\n\n<h1>站点</h1>\n\n这看起来就像图 8.2 中的设计。\n\n**图 8.2.** iPod touch 上的简单标题样式。\n\n![image](img/08fig02.jpg)\n\
  \n***\n\n**你知道吗？**Android 平板电脑在横屏模式下效果最好\n\n\n\n\n\n虽然 iPad 和 Android 平板电脑都可以竖屏或横屏模式显示应用，但大多数\
  \ Android 平板电脑的屏幕比例设计为 16:9。这意味着高清 电影在横屏模式下可以占据整个屏幕。但也意味着在竖屏模式下，屏幕可能会显得非常长很窄。一个合理的假设是，大多数\
  \ Android 平板用户仍然会在竖屏模式下浏览网页，但你应该准备好会有更多人在横屏模式下浏览。\n\n***\n\n线条是另一个在移动设计中被广泛使用的设计元素。你可以使用\
  \ `<hr>` 标签添加水平线。你也可以使用线条为元素添加边框。\n\n如图 8.3 所示，线条可以帮助区分文本，但它们也会导致人们停止阅读，因为它们提供了一个自然的断开点。\n\
  \n**图 8.3.** 在 iPod touch 的子标题上方添加一条线。\n\n![image](img/08fig03.jpg)\n\n你通常通过图像添加形状，但如果你想添加矩形和正方形形状，可以直接使用\
  \ CSS 和 HTML。`<canvas>` 标签允许你在页面中添加更多具创性的形状，而且通过 CSS3 甚至还可以在文档中添加圆形。\n\n***\n\n\
  ### 尝试一下：将正方形 DIV 转换为圆形\n\n网页设计中最令人烦恼的部分之一就是所有元素都是方块状。但 CSS3 正在改变这一点。你可以将一个通常是正方形的\
  \ `<div>` 转换为圆形。\n\n**1.** 在你的文档中添加一个 `<div>`：\n\n```html\n<div>\n    点击我！\n</div>\n\
  ```\n\n**2.** 给它一个名为 `circle` 的类：\n\n```html\n<div class=\"circle\">\n```\n\n**3.**\
  \ 添加样式表并创建一个新的 `circle` 类：\n\n```html\n<style>\n.circle {\n}\n</style>\n```\n\n\
  **4.** 为 `circle` 类设置一个背景颜色：\n\n```css\nbackground-color: blue;\n```\n\n**5.** 为\
  \ `circle` 类设置相等的高宽：\n\n```css\nheight: 10em;\nwidth: 10em;\n```\n如果高度和宽度是偶数，创建圆形是最简单的。\n\
  \n**6.** 将圆角设置为高度的一半：\n\n```css\nborder-radius: 5em;\n```\n\n**7.** 包含浏览器扩展以获得最大支持：\n\
  \n```css\n-moz-border-radius: 5em;\n-webkit-border-radius: 5em;\n```\n\n**8.** 将文本居中在圆形的中间：\n\
  \n```css\ntext-align: center;\nline-height: 10em;\n```\n注意，将 `line-height` 设置为框的高度会将一行文本居中在圆形中间，但如果你有多行文本，请小心，因为它们可能会超出圆形的边界。\n\
  \n***\n\n纹理可能是网页设计师最难掌握的设计元素之一，因为纹理是你能感受到的，而网页是用来看到的，而不是感到的。网页设计中的纹理是视觉纹理的感觉。网页设计中的大多数纹理都是通过颜色和图像实现的。\n\
  \n即使是简单的条纹图案也可以为设计增加纹理。图 8.4 显示了一个可以作为网页背景的斜条纹图案。条纹比纯白色或灰色更有趣，并让背景看起来有纹理感。\n\n**图\
  \ 8.4.** 模仿纹理的条纹图案。\n\n![image](img/08fig04.jpg)\n\n#### 移动设计模式\n\n移动设计利用了一些通用模式，你可以应用这些模式来帮助用户使用你的网页应用程序。使用这些模式可以让你的网页应用程序让用户立即熟悉，并且更容易使用：\n\
  \n*   **简单设计**——特别是在为功能手机设计时，尽量减少图像数量。提供单列内容，并包含足够的内容，让用户不需要频繁点击进入新页面。\n*   **按钮**——屏幕顶部的按钮（通常位于标题旁边）可以帮助移动用户导航。按钮可以指向下一页（通常放在右侧）或上一页（在左侧）、更多信息、信息分类或任何可以为当前页面增加价值的内容。\n\
  *   **列表**——在带有小屏幕的移动设备上，列表比段落更易阅读。然而，请保持它们短小，功能手机最多三到五个单词，智能手机五到十个单词。\n*   **预告（Teasers）**——这是一个非常常见的移动模式。通常显示的只有标题、可能还有一段简短的单行介绍和一个指向阅读全文的箭头链接。当你想在较小区域展示许多项目时，此功能非常棒。\n\
  *   **菜单**——移动端的菜单可以随你的需要变得复杂，但常见的菜单模式是单列项目（通常只有一到两个单词长），点击后会展开到第二层。\n*   **分页**——由于大多数网站将移动端内容分成多个页面，你需要一种方法方便地在这些页面之间移动。在内容底部看到水平数字列表是最常见的。当前页加粗且不是链接，数字两侧由“上一页”和“下一页”包围。即使你有超过三到五个页面需要显示，你也应该只在列表中显示三到五个页码。\n\
  *   **无限页**——当用户滚动到页面底部时，无限页会不断变长。这加快了浏览速度。\n*   **标签页（Tabs）**——标签页是桌面端和移动端通用的模式。\n\
  *   **切换内容（Toggle content）**——通过切换按钮隐藏内容，你可以获取更多信息。\n*   **智能加载（Smart loading）**——设计你的移动页面，以便内容在广告之前加载。\n\
  *   **一致性（Consistency）**——让你的移动设计与电脑设计完全相同至关重要，但它们应该相似。标志、颜色和版权信息应该保持一致。\n\n有数以千计的设计模式可供你使用。附录\
  \ C，“HTML5 和移动应用程序资源”提供了你可以使用的更多资源。\n\n### 检查 HTML5 和 CSS3\n\n构建 HTML5 网站或应用程序的最佳工具之一是\
  \ Modernizr ([www.modernizr.com/](http://www.modernizr.com/))。它是一个小型 JavaScript\
  \ 库，用于检查对 CSS3 和 HTML5 的支持，并为不支持这些功能的浏览器提供替代方案。\n\n***\n\n### 尝试一下：开始使用 Modernizr\n\
  \n学习使用 Modernizr 的是方法并尝试。\n\n1. 从 [www.modernizr.com/](http://www.modernizr.com/)\
  \ 下载 `modernizr-x.x.min.js` 脚本。\n\n2. 将文件移动到你的网站目录。\n\n3. 在文档头部添加脚本：\n\n```html\n\
  <script src=\"modernizr-#.#.min.js\"></script>\n```\n\n4. 给你的 HTML 元素添加 `no-js`\
  \ 类：\n\n```html\n<html class=\"no-js\">\n```\n\n随后，Modernizr 将自动加载并测试 40 多种不同的 CSS3\
  \ 和 HTML5 功能。你甚至可以为 Modernizr 目前未测试的功能添加新的测试。\n\n***\n\n然而，Modernizr 无法检测所有内容。对于某些功能，你需要进行标准的浏览器嗅探、浏览器推断（例如，如果存在特定功能如\
  \ `document.all`，则查看页面的浏览器必须是特定的浏览器），或者为每个浏览器提供回退机制，以确保万见。\n\n\n\n\n\nModernizr\
  \ 无法检测的一些内容包括：\n\n* Web 表单中的日期选择和颜色选择器（在第 13 节 “HTML5 表单”中讨论过）\n* iOS 和 Android\
  \ 移动设备无法使用 `contenteditable` 属性进行编辑（在第 14 节 “使用 HTML5 编辑内容和用户交互”中介绍）\n* 音频和视频对 `preload`\
  \ 属性的支持（第 12 节 “HTML5 中的音频和视频”解释了该属性）\n* 对软连字符（`&shy;`）和 `<wbr>`标签的支持（第 11 节 “HTML5\
  \ 中的字体与排版”涵盖了连字符处理）\n* HTML 实体的一致性渲染\n* PNG Alpha 透明度\n\n其他可能无法检测的内容列在 Modernizr\
  \ 的 wiki 上：[`github.com/Modernizr/Modernizr/wiki/Undetectables`](https://github.com/Modernizr/Modernizr/wiki/Undetectables)。\n\
  \n#### 支持多设备\n\n计划支持“单一 Web”（正如 W3C 希望我们做的那样）是一回事，但现实情况是，如果你想让你的应用程序在多个设备上运行，就必须对现各种设备和浏览器进行适配。\n\
  \n解决方案是使用框架。框架将复杂的技术整合为一组对象供你使用。HTML 框架通常为你提供一个网格来布局页面、排版以及对象（如导航、表单和链接）。\n\n有几个\
  \ HTML5 移动框架旨在帮助你创建可以在 iOS 和 Android 设备上运行的 HTML5 应用程序。你可以尝试的一些 HTML5 移动框架包括：\n\n\
  * **Sencha Touch**—Sencha Touch ([www.sencha.com/products/touch/](http://www.sencha.com/products/touch/))\
  \ 是 JavaScript 框架，帮助你构建在 iOS、Android 和 Blackberry 上看起来像原生应用的应用。它是一个非常强大的框架，内置了许多对触摸事件（如捏指缩放和滑动）的支持。但\
  \ Sencha Touch 是基于 JavaScript 构建的，而不是 HTML 和 CSS。如果你不擅长写 JavaScript，这个框架将很难使用。\n\
  * **jQuery Mobile**—jQuery Mobile ([`jquerymobile.com/`](http://jquerymobile.com/))\
  \ 基于 jQuery，为 iOS、Android、Blackberry、WebOs 和 Windows phone（以及其他平台）创建页面。在本文期间，jQuery\
  \ Mobile 仍处于 alpha 阶段，因此它并不足够健壮。然而，它是基于 HTML 构建的，因此更容易实现。\n* **Jo**—Jo ([`joapp.com/`](http://joapp.com/))\
  \ 是一个 JavaScript 框架，可以帮你将你在 Safari 或 Chrome 上构建的 HTML5 应用程序转换为 iOS、Android、WebOS\
  \ 和 Symbian。它提供了 Sencha Touch 和 jQuery Mobile 具备的所有动画效果和原生应用设计功能。\n* **PhoneGap**—PhoneGap\
  \ ([www.phonegap.com/](http://www.phonegap.com/)) 不仅仅是一个框架。它是一个帮助你创建移动应用的工具，也可以将\
  \ HTML5 应用程序转换为原生移动应用。通过 PhoneGap，你可以使用上述任何框架，然后将它们转换为可以在 Android 和 Apple 应用商店中销售的应用。如果你只想获取一个框架，PhoneGap\
  \ 是你的首选。第 24 节 讨论了如何使用 PhoneGap 创建原生应用。\n\n### 在其他设备上评估完成的应用\n\n测试你的应用程序是开发过程中的重要部分，但你可能没有无限的资金去购买市场上的每一种设备。因此，如前所述，你首先在你拥有的设备上进行测试，当你准备好交付时，然后在其他设备上进行测试。\n\
  \n如果你没有在某个设备上测试过，那么为该设备交付应用程序并不是好主意。你可以通过三种方式在非设备上测试应用程序：\n\n* 购买或租赁设备\n* 请他人帮你测试\n\
  * 使用模拟器\n\n如前所述，购买设备对于大多数设计师来说并不是真正的可行方案，但有些公司会租赁 iPhone 以及其他手机和平板电脑。[Rentacomputer.com](http://Rentacomputer.com)\
  \ 网站提供 iPad 和 Android 平板的租赁。你还可以请求拥有设备的朋友或同事帮忙测试。你也可以在网上招募测试人员。还有一些提供移动应用测试的公司，如\
  \ uTest ([www.utest.com/](http://www.utest.com/))。\n\n然而，没有实际设备测试应用程序最简单的方法是使用模拟器。\n\
  \n**注意！** 模拟器无法捕捉所有问题\n\n虽然模拟器是一个很好的备选，但它们无法与真实设备测试相比。例如，与实际设备相比，Android 手机和平板器非常缓慢。此外，在模拟器上测试某些手机特定功能（如多点触）是非常困难。\n\
  \n#### 桌面模拟器\n\n最好的模拟器是直接运行在你桌面电脑上的。你可以获取以下模拟器：\n\n* Android (`http://developer.android.com/tools/emulator`)\n\
  * iOS (`https://developer.apple.com/`)\n* Blackberry (`http://developer.blackberry.com/`)\n\
  * WebOS (`http://developer.webos.com/`)\n* Windows (`https://developer.microsoft.com/`)\n\
  \n#### 在线模拟器\n\n在线模拟器并不像桌面模拟器那样有效，但使用起来可能更快。一些在线模拟器包括：\n\n* Opera Mini (`www.opera.com/`)\n\
  * dotMobi (`mt.mobi/`)\n* DeviceAnywhere (`www.tryphone.com/`)\n* BrowserCam (`www.browsercam.com/`)\n\
  \n### 让应用程序在旧浏览器上运行\n\n人们不想学习 HTML5 和 CSS3 的主要原因之一是旧浏览器（尤其是 Internet Explorer 8\
  \ 及以下版本）不支持它们。关于提高技能的重要性，创建旧浏览器所需的页面和应用程序仍然可能的。\n\n旧版 Internet Explorer 的问题在于它们不认为新的\
  \ HTML5 标签是 HTML 标签。当它们看到不认识的标签时，会直接忽略它。图 8.5 网页在兼容浏览器中显示不同。但从图中可以看到，IE 忽略了它并显示白色背景。你可以通过访问\
  \ [www.html5in24.com/examples/testing-in-ie.html](http://www.html5in24.com/examples/testing-in-ie.html)\
  \ 自己测试。\n\n**图 8.5.** Internet Explorer 中忽略各种标签的简单 HTML5 页面。\n\n![image](img/08fig05.jpg)\n\
  \nHTML 看起来像：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\"\
  >\n<title>Testing HTML5 in Internet Explorer</title>\n<style>\n    header {\n       background-color:\
  \ #CCC;\n    }\n    section {\n       background-color: #9CF;\n    }\n    footer\
  \ {\n       background-color: #CFF;\n    }\n</style>\n</head>\n<body>\n<header>\n\
      <h1>Testing HTML5 in Internet Explorer</h1>\n</header>\n<section>\n    <article>\n\
         <p>This is an article. 如果 IE 支持 HTML5，此页面上所有的文本将\n```\n\n\n\n\n页面将具有背景颜色。\n\
  \n<p>Ut enim ad minim veniam, in reprehenderit in voluptate consectetur adipisicingicing\
  \ elit. Excepteur sint occaecat lorem ipsum dolor sit amet, qui officia deserunt.\
  \ Mollit anim id est laborum.</p>\n<p>Velit esse cillum dolore duis aute irure dolor\
  \ ut aliquip ex ea commodo consequat. Eu fugiat nulla pariatur. Ut labore et dolore\
  \ magna aliqua.</p>\n<p>In reprehenderit in voluptate qui officia deserunt mollit\
  \ anim id est laborum. Ullamco laboris nisi consectetur adipisicing elit. Velit\
  \ esse cillum dolore lorem ipsum dolor sit amet, quis nostrud exercitation. Ut aliquip\
  \ ex ea commodo consequat.</p>\n\n</article>\n</section>\n<footer><p>这里是页脚</p></footer>\n\
  </body>\n\n如你所见，这里有一些被 Internet Explorer 忽略的 CSS。为了让 IE 识别这些标签，你需要使用 JavaScript\
  \ 将它们添加到 DOM 中。这里有一个你可以使用的简单脚本：\n\n```javascript\n(function(){\n    var html5elmeents\
  \ = \"address,article,aside,audio,canvas,command,datalist,details,dialog,figure,figcaption,footer,header,hgroup,keygen,mark,meter,menu,nav,progress,ruby,section,time,video\"\
  .split(',');\n    for(var i = 0; i < html5elmeents.length; i++){\n        document.createElement(html5elmeents[i]);\n\
  \    }\n}();\n```\n\n这个脚本不会让 Internet Explorer 突然通过 `<video>` 标签播放视频，或在 `<canvas>`\
  \ 标签中显示矢量图形。但它能让 IE 显示元素的内容和样式，如 图 8.6 所示。\n\n**图 8.6.** 带有帮助 Internet Explorer\
  \ 8 脚本的简单 HTML5 页面。\n\n![image](img/08fig06.jpg)\n\n你也可以使用专门为此目的编写的脚本。在本节之前已经讨论过\
  \ Modernizr，但如果该脚本超出了你的需求，你也可以使用其他的：\n\n*   **HTML5Shiv**——这个 JavaScript 文件为浏览器添加了新的\
  \ HTML5 元素。它已在第 4 节 中讨论过。在条件注释中将此脚本添加到文档的头部：\n\n```html\n<!-- [if lt IE 9] -->\n\
  <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n<!--\
  \ [endif] -->\n```\n\n*   **IE6 Universal CSS**——Andy Clarke 为 Internet Explorer\
  \ 6 设计了一套几乎无懈可的样式表。关键部分是向 IE6 隐藏你所有的其他样式表，使其只应用通用 CSS：\n\n```html\n<!-- [if ! lte\
  \ IE 6] -->\n<!-- 非 IE6 浏览器的样式表 -->\n<!-- [endif] -->\n<!-- [if lte IE 6] -->\n\
  <link href=\"http://universal-ie6-css.googlecode.com/files/ie6.1.1.css\" media=\"\
  screen, projection\" rel=\"stylesheet\">\n<!-- [endif] -->\n```\n\n*   **Selectivizr**——它与多个\
  \ JavaScript 库配合，在 Internet Explorer 6 到 8 中模拟 CSS3 伪类和属性选择器。你需要先链接到如 jQuery 这样的库才能使用它：\n\
  \n```html\n<script src=\"jquery.min.js\"></script>\n<!-- [if lt IE 9] -->\n<script\
  \ src=\"selectivizr-min.js\"></script>\n<!-- [endif] -->\n```\n\n它不会添加 HTML5 属性，因此你可能像\
  \ Modernizr 或 HTML5Shiv 这样的工具。你可以在 [`selectivizr.com/`](http://selectivizr.com/)\
  \ 获取 Selectivizr。\n\n使用 HTML5 的关键在于前进并使用它。尽管你应该考虑网站的浏览器统计，但你的网站和应用程序并不需要在每个浏览器中看起来完全相同。等到\
  \ Internet Explorer 9 占据大多数市场份额意味着你将等待很久。记住，Internet Explorer 6 已经有 10 年的历史了，但它仍然占据相当的市场份额。\n\
  \n使用先进技术也比担心旧浏览器的支持更有趣。\n\n#### 总结\n\n在本节中，你学习了如何评估现有的 HTML5 页面，以确定为了改进移动体验需要做哪些工作。你学习了许多测试工具来检查你的页面并查看它们在移动设备上的外观。这些工具可以是在线或桌面模拟器，或者仅仅是提供网站衡量情况报告的在线脚本。\n\
  \n本节涵盖了在将网站转换为移动端或从零创建移动网站时应考虑的几件事，例如如何设置页面和图形的大小，以及使用脚本、样式表、表单和访问键。你还学习了如何以对功能手机也友的方式使用这些内容。本节教了你如何评估网站设计，使其以在移动设备上运行的方式使用设计的的基本元素。本节还涵盖了一些基本的移动设计模式，这些模式将帮助你的应用程序更受移动用户欢迎。\n\
  \n\n\n\n\n2. 在 Internet Explorer 8、7 或 6 中访问该同一页面。如果你使用的是 Mac，则需要运行一个带有 Windows\
  \ 的虚拟机。如果你已经升级到 IE 9，请使用如 [Browsershots.org](http://Browsershots.org) 等工具在旧版本的 IE\
  \ 中打开该页面。评估页面的显示效果并记录任何意外之处。\n\n3. 在其中一个 HTML5 文档中添加 HTML5Shiv，然后再次在 IE 6、7 或 8\
  \ 中访问该页面。页面的显示方式发生变化了吗？\n\n### 第二部分：学习 HTML5 基础\n\n## 第 9 小时：使用 HTML5 分节元素和语义化元素添加含义\n\
  \n***\n\n***你将在小时内学到：***\n\n• 如何定义 HTML5 文档的分节\n• 四个主要的分节元素\n• 理解 `<figure>` 和 `<details>`\
  \ 等元素\n• 使用多种语义化元素\n• 使用语义化元素提供含义\n\n***\n\nHTML5 中的许多新元素与内容在网页上的组织方式有关。这些被称为分节元素和标题元素。在本小时中，你将学习更多这些元素，以及一些帮助你更精确地定义网页的新类型语义化标签。\n\
  \n你将学习对页面进行语义化标记的价值，以及一些你可能没有使用的新、旧语义化元素。\n\n### 什么是分节元素？\n\nHTML5 添加了分节元素，以帮助网页设计师组织内容。这些元素创建了文档的逻辑部分，每个部分都以一个标题元素开头，并通常以一个页脚元素结束。\n\
  \nHTML5 中的四个分节元素是：\n\n• `<article>`\n• `<aside>`\n• `<nav>`\n• `<section>`\n\n这两个新元素虽然不是明确的分节元素，但它们是分节根：\n\
  \n• `<details>`\n• `<figure>`\n\n其他几个新元素也可以被视为分节元素。这些新元素与分节元素和分节根配合工作：\n\n• `<header>`\n\
  • `<footer>`\n• `<hgroup>`\n\n需要记住，分节元素和语义化元素本身不会对网页的内容产生任何视觉变化。它们用于为 HTML 文档提供计算机可以读取的结构。这允许计算机创建下文描述的大纲，或以以程序的方式与文档进行交互。如果你希望这些元素在页面中具有视觉样式，你需要为它们附加\
  \ CSS 样式。\n\n### 使用新的分节元素\n\n你应该记住的一点是，分节元素 `<article>`、`<aside>`、`<nav>` 和 `<section>`\
  \ 各与头部和页脚元素配合使用，创建文档的一个部分。在文档中紧随每个这些元素之后如 `<h1>` 之类的标题标签应该是可能的。通过这些标题标签，你的 HTML5\
  \ 文档将拥有大纲。\n\n#### 使用分节元素创建大纲\n\nHTML5 在 HTML 规范中引入了一个新概念：大纲。HTML5 大纲通过查看文档的结构，使用分节元素和标题元素来标记大纲部分。这些大纲类似于文字处理程序可能创建的大纲。\n\
  \n分节元素的目的是通过头部和页脚创建大纲。具体来说，大纲可以通过算法创建。大纲之所以重要，是因为它们增加了网页的可访问性。辅助用户代理（如屏幕阅读器）可以使用大纲确定哪些部分是对用户展示最重要的。\n\
  \n一个 HTML5 文档可能像这样：\n\n```html\n<section>\n    <h1>第一部分：构建网页</h1>\n    <section>\n\
  \        <h1>第一章：HTML</h1>\n        <p>在本节中，你将学习如何编写 HTML</p>\n    </section>\n\
  \    <section>\n        <h1>第二章：CSS</h1>\n        <p>这一节将教你 CSS</p>\n        <section>\n\
  \            <h1>CSS1</h1>\n            <p>...</p>\n        </section>\n    </section>\n\
  </section>\n<section>\n    <h1>第二部分：发布网页</h1>\n    ...\n</section>\n```\n\n这创建了一个如下所示的大纲：\n\
  \nI. 第一部分：构建网页\n    I.1 第一章：HTML\n    I.2 第二章：CSS\n        I.2.i CSS1\nII. 第二部分：发布网页\n\
  \nHTML 4 没有分节元素，因此网页设计师通常使用 `<div>` 标签在文档中创建人工部分。虽然这些标签有效，但它们在网站之间并不一致，因此辅助设备无法识别。\n\
  \n***\n\n### 顺便说一下：测试分节元素的正确使用\n\n测试你是否正确使用分节元素的一种方法是看它们在不同浏览器中的渲染情况。\n\n***\n\n\
  #### `<article>` 元素\n\n`<article>` 元素代表可以独立的内容。如果你在分发内容，你知道它是页面的一部分。文章可能是：\n\n•\
  \ 杂志或报纸\n• 博客文章\n• 论坛帖子\n• 任何独立项目\n\n思考什么内容应该包含在文章中的最简单方法是问自己它是否可以出现在 RSS 馈送中。以下是简单的\
  \ `<article>` 可能的样式（假设它有多得的内容）：\n\n```html\n<article>\n    <h1>我的宠物</h1>\n    <p>我一直喜欢动物，我一直有很多……</p>\n\
  </article>\n```\n\n#### `<aside>` 元素\n\n`<aside>` 元素被定义为与文档主要内容间接或松散相关的内容。然而，它也可以是网页上的侧边栏，提供与整个网站相关的信息，而不一定是页面上的文章。\n\
  \n确定你正在使用哪种类型的 `<aside>` 取于该 `<aside>`所在。如果 `<aside>` 位于 `<article>` 标签内部，则它定义与文章本身的内容，例如词汇表或相关文章列表。如果\
  \ `<aside>` 位于 `<article>` 标签之外，则它定义与整个网站相关的内容。例如侧边元素，如博客列表或广告。\n\n***\n\n#### 顺便说一下：分节元素没有定义的页面位置\n\
  \n很容易认为 `<aside>` 元素会出现在网页侧面，而 `<footer>` 元素会出现在底部。但这些元素在网页上的位置仅由 CSS 定义，而不是通过标签。你可以将\
  \ `<footer>` 内容放在页面的最顶部，如果你认为语义上这些内容是通常在页脚处的信息，或者 `<aside>` 元素中的内容可以出现在页面的主列。这些元素仅是语义化的，这意味着它们定义了内容是什么，而不是它们应该显示在哪里或应该做什么。\n\
  \n***\n\n以下是两种类型 `<aside>` 元素的示例。这是一个 `<article>` 内部的 `<aside>`，表示它与页面上的内容特别相关：\n\
  \n```html\n<article>\n    <h1>我的宠物</h1>\n    <aside>\n        此侧边栏与文章相关。\n    </aside>\n\
  </article>\n```\n\n\n\n\n\n我一直很喜欢动物，而且养过很多宠物....\n\n<aside>\n# 我的宠物照片\n<ul>\n  <li>Shasta</li>\n\
  \  <li>Suni</li>\n  <li>...</li>\n</ul>\n</aside>\n\n这个 `<aside>` 位于 `<article>`\
  \ 之外，因此它与网站整体内容相关，但不是专门针对某篇文章的：\n\n<aside>\n# 我最喜欢的网站\n<ul>\n  <li>狗狗</li>\n  <li>猫</li>\n\
  \  <li>马</li>\n</ul>\n</aside>\n\n***\n\n## 你知道吗？为什么会有这么多 `<h1>` 元素？\n\n你可能已经注意到的一点是，每个章节都使用\
  \ `<h1>` 元素作为标题。在 HTML 4 中，`<h1>` 到 `&lt;h6;` 标签是设计者拥有的几乎唯一的大纲选项，因此建议只使用一个 `<h1>`\
  \ 标签——用于页面标题。然而，HTML5 添加了所有额外的分段元素，现在的建议是使用 `<h1>` 作为每个章节的第一个标题。这意味着 `<h1>` 标题是*该章节内*最重要的标题，而将\
  \ `<h2>` 到 `&lt;h6;` 标题留作该章节的子标题。你可能会发现旧浏览器对这种习惯的反应比较生硬，特别是在禁用 CSS 的情况下，如果是这样，你可以继续使用\
  \ `<h2>` 作为二级标题，依此类推，但 W3C 建议在任何新章节中使用 `<h1>` 作为第一个标题。\n\n***\n\n## `<nav>` 元素\n\
  \n`<nav>` 元素定义了内容的一个部分，该部分链接到网站的其他页面或区域。你不需要将页面上的每一个链接列表都封装在 `<nav>` 元素中。它仅用于页面的主要导航。\n\
  \n大多数网页设计人员在放入带有 ID 为 `\"nav\"` 或 `\"navigation\"` 的 `<div>` 或 `<ul>` 时，已经在使用某种形式的\
  \ `<nav>` 元素，例如：\n\n```html\n<ul id=\"nav\">\n    <li>首页</li>\n    <li>产品</li>\n\
  \    <li>服务</li>\n    <li>关于我们</li>\n</ul>\n```\n\n如果你在网页上有像那样的章节，你只需要在它外围添加 `<nav>`\
  \ 元素即可。\n\n```html\n<nav>\n<h1>导航</h1>\n<ul id=\"nav\">\n    <li>首页</li>\n    <li>产品</li>\n\
  \    <li>服务</li>\n    <li>关于我们</li>\n</ul>\n</nav>\n```\n\n使用 `<nav>` 元素的最佳方法是将其用于主要导航，因为这通常是大多数用户关心的唯一导航。然而，什么是主要导航取决于网站本身以及网站的开发者。有些网站只有一个主要导航章节，其他导航元素只是网站内的链接。其他网站可能会有三个或四个\
  \ `<nav>` 元素。例如，我在 [About.com](http://About.com) ([`webdesign.about.com/`](http://webdesign.about.com/))\
  \ 上的网站有几种形式的导航：\n\n* 顶部的面包屑导航\n* 站点名称下方的四个标签\n* “必读”部分\n* “浏览主题”链接\n* 甚至是页面底部的“探索网页设计\
  \ / HTML”部分\n\n这些内容大部分可以被视为主要导航，但如果我将此页面转换为 HTML5，我会在四个标签和“浏览主题”链接周围添加 `<nav>` 元素，因为它们提供了穿于网站的最佳导航。在规范对这一话题给出明确说明之前，任何解决方案都可以的——将所有导航标记为\
  \ `<nav>`，或仅标记主要导航都是可以的。\n\n除了网站上的主导航栏外，你可能还会使用 `<nav>` 元素的地方包括：\n\n* 目录\n* 上一个和下一个页链接\n\
  * 面包屑导航\n\n你应该小心不要将 `<nav>` 元素与 `<menu>` 元素混淆。`<menu>` 元素实际上是一个命令列表。它可以是一个导航列表，其中每个项目指向不同的位置——类似于跳转列表。如果菜单是主要导航元素的列表，你可以把它放在\
  \ `<nav>` 元素内部，但它不应该取代 `<nav>` 元素。\n\n## `<section>` 元素\n\n`<section>` 元素可能是新分段元素中最令人困惑的。大多数使用它的设计者倾向于错误地使用。它最常见的用法是为样式设置页面划分，这是错误的用法。你应该使用\
  \ `<div>` 元素为你的布局设置样式。\n\n如果你一直错误地使用 `<section>` 元素，不要感到抱歉。很多人都是这样做。事实上，你可以在许多教授\
  \ HTML5 的网站上找到它的错误用法。\n\n根据 W3C 的规定，“section 元素不是一个通用的容器元素。当为了样式目的或为了脚本方便而需要元素时，鼓励作者使用\
  \ div 元素代替。”\n\n以下是你可以使用的几种方法来判断是否应该使用 `<section>`：\n\n* 该章节是否有自然的标题？如果没有，使用 `<section>`。\n\
  * 该章节会是页面的自然部分吗？如果不是，使用 `<section>`。\n* 该章节的用途是否不仅仅是样式？如果是，请使用 `<div>` 元素。\n* 该章节是否符合\
  \ `<article>`、`<aside>` 或 `<nav>` 的标准？如果是，请使用 `<section>`。\n\n你可能使用 `<section>`\
  \ 元素的一个地方是在 `<aside>` 中用于博客。例如：\n\n<aside>\n<section>\n<h1>博客列表</h1>\n<ul>\n  <li><a\
  \ href=\"http://diveinto5/\">深入 HTML5</a></li>\n  <li><a href=\"http://html5gallery.com/\"\
  >HTML5 Gallery</a></li>\n  <li><a href=\"http://dev.w3.org/html5/spec.html\">HTML5\
  \ 规范 (W3C)</a></li>\n</ul>\n</section>\n<section>\n<h1>分类</h1>\n<ul>\n  <li>...</li>\n\
  </ul>\n</section>\n</aside>\n\n## 顺便说：何时使用 `<div>`\n\n多年来，`<div>` 元素一直是标准设计者设计和布局的备用方案，但现在有了\
  \ HTML5，这种用法应该减少。事实上，只有在没有其他元素可用时，你才应该使用 `<div>` 元素。目前，你可能希望继续结合分段标签使用（即 `<div id=\"\
  article\"><article>`），但只有在你的页面显示遇到困难时才应该这样做。\n\n## 分段根元素\n\n分段根元素是 HTML5 中的元素，它们有自己的大纲，但不会对其祖先的大纲做出贡献。这些元素是：\n\
  \n* `<blockquote>`\n* `<body>`\n* `<details>`\n* `<fieldset>`\n* `<figure>`\n* `<td>`\n\
  \n你应该已经熟悉 `<body>`、`<blockquote>`、`<fieldset>` 和 `<td>` 元素。HTML5 中的新元素是 `<details>`\
  \ 和 `<figure>`。\n\n你使用 `<details>` 元素来隐藏和显示内容的额外信息。它有一个相关的元素——`<summary>`。`<summary>`\
  \ 元素是 `<details>` 元素内部可选元素，代表 `<details>` 元素的说明或摘要。\n\n使用这些元素为你的文档添加对内容并非重要的信息。例如，你可以在\
  \ `<details>` 元素中为表单字段添加信息，如果人们需要更多帮助，就可以打开：\n\n```html\n<input id=\"phone-number\"\
  \ type=\"phone\">\n<details>\n<summary>格式</summary>\n<p>(xxx) xxx-xxxx</p>\n</details>\n\
  ```\n\n\n\n\n你使用 `<figure>` 元素来定义自包含的内容单元。最常见的情况下，figure 是一个图像，但它也可以任何可以独立存在的内容类型。相关的元素\
  \ `<figcaption>` 为 figure 提供图例或说明。\n\n一些常见的 figure 包括：\n* 图像或图像组\n* 代码块\n* 诗歌或引言\n\
  * 图表和条形图\n\n当你决定是否将内容放入 `<figure>` 中时，你需要确定该内容对于页面的内容是否是至关重要的。如果它是至关重要的，且在内容中的具体位置并不至关重要，那么\
  \ `<figure>` 元素就是一个很好的选择。\n\n你可以像这样写一个简单的 `<figure>`：\n\n```html\n<figure>\n  <img\
  \ src=\"shasta.jpg\" alt=\"Shasta\">\n  <figcaption>\n    <p>我的狗 Shasta 的照片。</p>\n\
  \  </figcaption>\n</figure>\n```\n\n记住，你不需要在页面上的每张图像周围都使用 `<figure>` 。横幅和广告与页面内容无关，因此它们不是\
  \ figure。\n\n# 标题、页眉和页脚元素\n\n标题、页眉和页脚元素在技术上并不是分节元素，因为它们对网站大纲没有贡献，但大多数网页设计师都将它们视为分节元素，因为它们用于定义\
  \ Web 文档的语义布局。\n\n标题元素包括 `<hgroup>` 和所有的标题标签：从 `<h1>` 到 `<h6>`。使用 `<hgroup>` 元素将一组或多个标题元素分组，以便它们在文档大纲中作为一个元素被收集。例如：\n\
  \n```html\n<h1>This is a Headline</h1>\n<h2>This is a Sub-Head</h2>\n<section><h1>And\
  \ this is a Sub-section</h1></section>\n```\n\n这具有以下大纲：\n1. This is a Headline\n\
  \   1. This is a Sub-Head\n   2. And this is a Sub-section\n\n假设你将 `<h1>` 和 `<h2>`\
  \ 组合在 `<hgroup>` 中：\n\n```html\n<hgroup>\n  <h1>This is a Headline</h1>\n  <h2>This\
  \ is a Sub-Head</h2>\n</hgroup>\n<section><h1>And this is a Sub-section</h1></section>\n\
  ```\n\n那么你得到了如下大纲：\n1. This is a Headline\n   1. And this is a Sub-section\n\n你可以像以前在\
  \ HTML 中使用 `<div id=\"header\">` 和 `<div id=\"footer\">` 一样使用 `<header>` 和 `<footer>`\
  \ 元素。但是，除非你真的在组建多个一个标题标签，否则不要使用 `<hgroup>` 元素。编写以下内容是多余且错误的：\n\n```html\n<hgroup><h1>My\
  \ Headline</h1></hgroup>\n```\n\n此外，尽管在本文编写时 `<hgroup>` 元素是有效的，但关于它是否应该保留在 HTML5\
  \ 规范中仍然存在争议，它可能会被排除在最终的 HTML5 规范之外。\n\n`<header>` 可以包含章节的标题，以及介绍该章节的额外信息，例如目录、日期行或相关图标。理解的关键点是，尽管大多数时候你会在文档顶部使用\
  \ `<header>` 元素，但你也可以在任何分节元素的开头包含 `<header>` 元素，例如 `<article>`、`<aside>` 或 `<nav>`。\n\
  \n`<footer>` 元素的作用就像 `<header>` 元素，只是它位于章节的末尾。footer 包含关于该章节的信息，例如是谁写的、版权数据，甚至是相关的链接。就像\
  \ `<header>` 元素一样，你可以在任何分节元素中包含 `<footer>`，它不会创建一个新章节。\n\n***\n\n**顺便说一下：不要纠结“Footer（页脚）”这个名称**\n\
  \n尽管 footer 最常见的位置是页面的底部或脚，但你不需要在设计中将其放在那里。例如，在博客文章中，如文章发布日期和作者姓名等信息可以被视为 footer\
  \ 信息，但如果你希望它在设计中出现在顶部，你可以将该 footer 放在文章的顶部。\n\n***\n\n如果你在 footer 中留有文章作者或页面的联系信息，你应该将其封装在\
  \ `<address>` 元素中。然后你可以将 `<address>` 放在 `<footer>` 中。\n\n开始正确构建分节的 HTML5 文档时，有很多东西要学。但通过练习，你将开始理解每个分节元素的用途，从而能够自己构建一个正确分节的文档。\n\
  \n***\n\n# 尝试一下：使用 HTML5 分节元素构建博客\n\n博客通常具有标准的页面元素，如文章、评论、导航等。通过遵循这些步骤，你可以创建一个包含两篇文章、留有评论空间、网站导航、侧边栏以及网站页眉和页脚的博客页面。\n\
  \n**1.** 像往常一样开始你的 HTML5 文档：\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>My Blog</title>\n    <script src=\"\
  modernizr-1.7.min\"></script>\n</head>\n<body class=\"no-js\">\n</body>\n</html>\n\
  ```\n\n**2.** 在 `<body>` 标签内添加一个容器 `<div>`，以便为你的 CSS 提供一个钩子：\n\n```html\n<body class=\"\
  no-js\">\n  <div>\n</div>\n```\n\n**3.** 像以前在 HTML 中可能使用 `<div id=\"header\">` 和\
  \ `<div id=\"footer\">` 一样使用 `<header>` 和 `<footer>` 元素。但是，除非你真的在组建多个一个标题标签，否则不要使用\
  \ `<hgroup>` 元素。编写以下内容是多余且错误的：\n\n```html\n  <header>\n```\n\n**4.** 在 `<header>`\
  \ 之后添加 `<article>`，包含章节标题：\n\n```html\n<article>\n  <header>\n    <h1>Post #1</h1>\n\
  \  </header>\n```\n\n**5.** 在 `<header>` 之后放置文章内容：\n\n```html\n  <p>This is my first\
  \ post. It includes a photo of my dog.</p>\n  <figure>\n    <img src=\"shasta.jpg\"\
  \ alt=\"Shasta\">\n  </figure>\n```\n```\n\n**6.** 在 `<article>` 内部添加 `<footer>`，包含你的名字和日期：\n\
  \n```html\n  <footer>\n    <p>By: <address><a href=\"mailto:me@url.com\">Jennifer</a>a></address></p>\n\
  \    <p>Date: <time datetime=\"2011-05-12\">May 12, 2011</time></p>\n  </footer>\n\
  \n```\n\n**7.** 在文章 `<article>` 内部的第二个 `<article>` 中放置评论：\n\n```html\n<article>\n\
  \  <h1>Comments</h1>\n  <p><a href=\"#\">Post</a> your comments or <a href=\"#\"\
  >read</a> other comments</p>\n</article>\n```\n\n**8.** 在文章 `<article>` 外部但仍在 `<div>`\
  \ 内部放置 `<aside>` 以包含网站侧边栏：\n\n```html\n  <aside>\n    <h1>Learn More</h1>\n    <section>\n\
  \      <h1>Recent Comments</h1>\n      <p>None</p>\n    </section>\n    <section>\n\
  \      <h1>Stay in Contact</h1>\n      <p><a href=\"#\">RSS</a> or <a href=\"#\"\
  >Newsletter</a></p>\n    </section>\n  </aside>\n</div>\n```\n\n**9.** 最后，在文档底部添加一个包含版权信息的\
  \ `<footer>`：\n\n```html\n<footer>\n  <p>Copyright &copy; 2011 Jennifer Kyrnin</p>\n\
  </footer>\n```\n\n\n\n\niOS 和 Android 移动端对分段和语义化元素的支持非常好。Android 从 2.1 版本就开始支持这些元素，iOS\
  \ 在 3.2 版本中提供了部分支持，并在 4.0 及更高版本中提供了完全支持。\n\n事实上，你在这些元素上遇到的大部分问题来自于第 9 版之前的 Internet\
  \ Explorer。如果你想支持这些浏览器，可以使用第 8 章中提到的脚本或“将 Web 应用程序转换为移动端”。\n\n#### HTML 4 语义化元素\n\
  \nHTML 4 规范中的许多元素都是语义化的：\n\n• `<abbr>`—缩写（Abbreviations）\n\n***\n\n*顺便一下*：`<acronym>`\
  \ 元素已过时\n\n`<acronym>` 标签是 HTML 4 的，用于定义首字母词——即本身构成单词的缩写，例如 NASA、FAQ 或 SCUBA。但由于缩写（abbreviations）和首字母词（acronyms）之间的混淆，加上首字母词本身也是缩写，该元素在\
  \ HTML5 中已被废弃。\n\n***\n\n• `<code>`—代码示例（Code samples）\n\n• `<del>`—删除文本（Deleted\
  \ text）\n\n• `<dfn>`—术语的定义实例（Defining instance of a term）\n\n• `<em>`—强调语气（Emphatic\
  \ stress）\n\n• `<ins>`—插入强调（Inserted stress）\n\n• `<kbd>`—键盘输入（Keyboard input）\n\
  \n• `<samp>`—示例输出（Sample output）\n\n• `<strong>`—强强调（Strong importance）\n\n• `<var>`—变量或占位符文本（Variable\
  \ or placeholder text）\n\n#### 新的 HTML 4 元素\n\n若干 HTML 元素在 HTML 4 中并不是语义化的，但在 HTML5\
  \ 中它们的重点发生了变化，变得语义化：\n\n• `<b>`—这以前表示粗体文本，但现在它代表通常以加粗显示但没有额外强调的文本。\n\n• `<hr>`—这以前表示水平线，但现在它代表内容中的主题分段（thematic\
  \ break）。\n\n• `<i>`—这以前表示斜体文本，但现在它代表通常以斜体显示但没有额外强调的文本。\n\n• `<s>`—这以前表示带有删除线的文本（strikeout），但现在代表不再准确且已从文档中被“划掉”的内容。\n\
  \n• `<small>`—这以前是比周围文字打印更小的文本，但现在它代表“小字”（small print），例如法律术语。\n\n• `<u>`—这以前是带有划线的文本，但现在它代表通常带有下划线显示的文本。\n\
  \n***\n\n*顺便一下*：强调指的是朗读的内容\n\n在提到需要强调或不需强调的文本时，通常指的是屏幕阅读器如何读取这些文本。书名会设为斜体，但在大声读时，不会对斜体做任何特殊区分，因为它仅仅是一个书名。在书面形式中，文本看起来可能更突出，但使用\
  \ `<i>` 和 `<b>` 等元素时，在朗读时不会被特别出来。\n\n***\n\n#### HTML5 中的新语义化元素\n\nHTML5 中的几个新语义化元素允许你进一步定义内容的含义：`<mark>`、`<meter>`、`<progress>`\
  \ 和 `<time>`。\n\n你使用 `<mark>` 元素来指示为了引用而应该高亮或突出的文本。每当你使用搜索引擎时，都能看到被标记的文本。你搜索的词在结果文本中会被高亮（通常是加粗），如图\
  \ 9.1 所示。\n\n**图 9.1.** 在 Bing 上搜索“HTML5 mark”，结果加粗。\n\n![image](img/09fig01.jpg)\n\
  \n每当你想引起对文档中某些部分的注意时，都应该使用 `<mark>` 元素，例如图 9.1 中的搜索词，或者高亮部分原本不会被高亮的文本。它与 `<strong>`\
  \ 和 `<em>` 元素不同，因为 `<mark>` 没有给文本添加额外的强调或重要性，它仅仅是高亮显示。\n\n你使用 `<meter>` 元素来指示范围内的标量测量，例如评论中的星级评分、考试中的等级、百分比或分数。\n\
  \n`<meter>` 元素有六个属性：\n\n• `value`—计量器显示的测量值。例如，纸面成绩可以写成 `<meter value=\"91\">A-</meter>`。此属性是必须的，但可以是元素中编写的内容。例如，`<meter>3\
  \ out of 15</meter>`。值是“3”，最大值是“15”，因为这是元素中编写的内容。\n\n• `min`—范围的最小值。\n\n• `max`—范围的最大值。例如，`<meter\
  \ value=\"91\" min=\"0\" max=\"100\">A-</meter>`。\n\n• `low`—标记计量器“低值”部分上边界的点。\n\
  \n• `high`—标记计量器“高值”部分下边界的点。配合 `low` 使用，`high` 允许你将计量器范围分为三部分，例如 `<meter value=\"\
  5\" low=\"3\" high=\"7\">1 to 10</meter>`。\n\n• `optimum`—标记计量器最佳点的点。\n\n***\n\n\
  *注意！*：Meter 不是用于（物理）测量\n\n虽然在事物周围加上 `<meter>` 很有吸引力，但请使用 `datetime` 属性来指定单位。\n\n\
  `<progress>` 元素目前支持有限。但你可以为不兼容的浏览器使用填充程序（polyfill）。像这样检测 `<progress>`：\n\n```javascript\n\
  return 'value' in document.createElement('progress');\n```\n\n`<time>` 元素指示日期或时间。你用它来标记文档中的时间和日期。你可以添加\
  \ `datetime` 属性来给出精确的日期时间。你还可以添加 `pubdate` 属性来指示该时间为 `<article>` 元素或整个文档的发布日期。\n\
  \n`datetime` 属性可以包含日期、时间或两者。它根据 RFC339 ([tools.ietf.org/html/rfc339](http://tools.ietf.org/html/rfc339))\
  \ 的格式编写：\n\n• **date**—`YYYY-MM-DD`。\n\n• **time**—`HH:MM:SS.` 使用 24 小时制；秒可选。\n\n\
  • **带时区的时间**—`HH:MM:SS+Zone.` 时区范围从 –12:00 到 +14:00。\n\n• **UTC 时间**—`HH:MM:SSZ`\
  \ Z 等于协调世界时 (UTC)，或 +00:00。\n\n• **时间和日期**—`YYYY-MM-DDTHH:MM:SS+Zone.` 中间的 T 只是一个\
  \ T，用于分隔日期和时间。你的 `<time>` 元素中的文本不需要显示完整的日期或时间。这里是一些示例：\n\n```html\n<time datetime=\"\
  1940-10-04\">October 4, 1940</time>\n<time datetime=\"1940-10-04\">Oct 4</time>\n\
  <time datetime=\"00:00:00-08:00\">Midnight</time>\n```\n\n需要记住的一点是，`<time>` 元素无法为公元前日期设置特定的\
  \ `datetime` 值。你也无法编码不精确的日期，例如“2008 年 3 月”。为了指示这类日期，你需要使用微格式，在第 15 章“微格式和元数据”中有详细讨论。\n\
  \n\n\n\n这一小时你学习了 HTML5 中所有新的语义化元素。你学习了如何使用分区域元素创建可以生成大纲的语义化标记，以及 HTML5 中新增和更改的语义化元素。\n\
  \n大纲对某些设计师来说可能看起来并不重要，但任何在设计时考虑可访问性的人都知道，大纲有助于屏幕阅读器更轻松地使用文档。使用分区域元素良好标记的文档可以创建易读的大纲。\n\
  \n语义化元素可能看起来也不重要，但通过指示文本语义来提供额外信息也无害处。此外，你可能会对它有多大的帮助感到惊讶。\n\n### Q&A\n\n**Q. 我必须在创建的每个文档中都使用每一个分区域元素吗？**\n\
  \n**A.** 不，当然不用。像所有其他语义化元素一样，你应该在文档中使用符合其逻辑的分区域元素。如果你没有侧性的文本，那么就不应该使用 `<aside>`。同样，如果你没有无法其他分区域元素定义的章节，那么就不需要\
  \ `<section>` 元素。\n\n**Q. 为什么你将某些元素称为“过时（obsolete）”？我以为那个术语是“弃用（deprecated）”。**\n\
  \n**A.** HTML 4 是一个主要为浏览器厂商编写的标准。`deprecated` 术语旨在告诉他们未来不再需要支持该项内容。HTML5 更多是为 Web\
  \ 作者编写的，因此 `obsolete` 被认为是一个更清晰的术语。\n\n**Q. 如果我使用的 `<meter>` 元素的值在最小值或最大值之外会怎样？**\n\
  \n**A.** 虽然存在未来浏览器可能会在你这样做时显示某种错误消息的可能性，但机会微乎其微。与所有语义化元素一样，你应该尝试正确地使用这些元素。\n\n###\
  \ Workshop\n\n工作坊包含测验题，帮助你处理在本章中学的内容。在阅读答案之前，尝试回答所有问题。答案请参见附录 A，“测验答案](#app01.html_app01).”\n\
  \n#### Quiz\n\n**1.** HTML5 中四个新的分区域元素分别什么？\n\n**2.** 下列哪些在 `<figure>` 内部是有效的？\n\
  \n**a.** 一幅图像\n\n**b.** 一段文本\n\n**c.** 两者都是\n\n**3.** 正确或错误。`<aside>` 应该用于标记网站侧边栏。\n\
  \n**4.** 正确或错误。`<section>` 应该仅作为样式的钩子。\n\n**5.** 正确或错误。分区域根元素将其内容贡献给整个网站的大纲。\n\n\
  **6.** 正确或错误。`<footer>` 不是一个分区域元素。\n\n**7.** HTML5 中新的、非分区域的语义化元素是哪些？\n\n#### Exercises\n\
  \n**1.** 编写一个具有正确分区域元素的 HTML 文档。在 HTML5 大纲生成器 ([`gsnedders.html5.org/outliner/`](http://gsnedders.html5.org/outliner/))\
  \ 中检查你的大纲。如果你有任何未标题的章节，请检查你是否需要该章节，如果需要，请使用 `<h1>` 元素添加标题。\n\n**2.** 检查现有的网页，你自己的或在线的。看看你是否能找到适合\
  \ `<mark>`、`<meter>`、`<progress>` 和 `<time>` 元素的地方。如果你正在检查自己的页面，添加这些元素使你的页面更具语义化。\n\
  \n## 第 10 小节：使用 HTML5 Canvas 元素绘图\n\n* * *\n\n***在本小时你将学到：***\n\n• 如何使用 `<canvas>`\
  \ 元素在网页上绘图\n• 如何在画布上创建线条、矩形和圆\n• 如何将图像作为画布的一部分或作为图案\n• 哪些移动设备支持 `<canvas>`\n• canvas\
  \ 与 Flash 和 SVG 有何不同\n\n* * *\n\nHTML5 `<canvas>` 元素允许你使用 JavaScript 直接在网页中绘制形状、添加图像并创建动画。它不是用不同的语言（如\
  \ SVG）完成的，也不使用插件（如 Flash）。\n\n在本小时中，你将学习 `<canvas>` 元素是什么，以及你如何使用它在浏览器内部直接创建形状并添加图像和文本。这一小时作为使用\
  \ `<canvas>` 元素的起点——你还有更多可以用它做的事情。限制你的的只有你的想象力。\n\n#### 使用 Canvas 元素\n\n简而言之，HTML5\
  \ `<canvas>` 元素允许你使用 JavaScript 在网页上绘制你想要的任何内容。你可以用它来添加图像、创建幻灯片、显示动画，甚至构建游戏。\n\n\
  `<canvas>` 元素是可以编写脚本的。这意味着你可以创建一个根据用户输入而改变的画布。虽然大多数 canvas 应用都专注于游戏，但你可以将它用于其他事情，包括：\n\
  \n• 动态图表（如股票指数）\n• 相库\n• 花哨的字体\n• 在线视觉工具，如思维导图和图像编辑器\n\n任何你可以绘制或制作动画的内容都可以在 `<canvas>`\
  \ 元素中实现。然而，像 HTML5 的每个部分一样，你应该合理使用它。\n\n*(注：原文中存在大量重复段落，此处已按要求进行去重处理)*\n\n\n\n将你的脚本命名为\
  \ `onclick` 是让形状更具交互性的方法，但如果你需要在页面加载时绘制画布，你应该通过在 body 标签中调用它并在 body 加载时绘制：`<body\
  \ onload=\"drawSquare();\">`。\n\n这会在名为“canvas1”的画布上画一个蓝色正方形。你在文档的 `<canvas>` 元素上调用该函数：\n\
  \n```html\n<canvas id=\"canvas1\" width=\"200\" height=\"200\" onclick=\"drawSquare();\"\
  ></canvas>\n```\n\n本节开头的脚本（“在 <Canvas> 元素上绘制形状”）执行了四件事：\n\n- **第 1 行—** 在你的文档中找到“canvas1”元素\n\
  - **第 2 行—** 将上下文设置为二维\n- **第 3 行—** 将填充颜色定义为蓝色\n- **第 4 行—** 绘制一个四边相等的矩形——正方形\n\
  \n### 注意！你必须设置上下文\n\n要在 `<canvas>` 元素上画图，你必须向 `getContext()` 方法传递字符串“2d”。否则，你的 `<canvas>`\
  \ 元素将不会显示任何内容。这样，当其他上下文可用时，你就能对你的画布元素执行不同的操作。\n\n然后你可以通过设置宽度或高度来清除整个画布。你不需要更改宽度或高度，只需将其设置为其本身，正如接下来的“自己试一下”中描述的那样。\n\
  \n### 自己试一下：让正方形出现并消失\n\n你可以修改之前的脚本来让正方形出现和消失。\n\n**1.** 在你的文档中添加 `<canvas>` 元素：\n\
  \n```html\n<canvas id=\"canvas1\" width=\"200\" height=\"200\" style=\"border: solid\
  \ 1px black;\" onclick=\"drawSquare();\"></canvas>\n```\n\n**2.** 编写 JavaScript\
  \ 代码，在点击 `<canvas>` 元素时绘制正方形：\n\n```javascript\nfunction drawSquare() {\n    var\
  \ canvas = document.getElementById(\"canvas1\");\n    var context = canvas.getContext(\"\
  2d\");\n    context.fillStyle = \"rgb(13, 118, 208)\");\n    context.fillRect(30,\
  \ 30, 140, 140);\n}\n```\n\n**3.** 在 JavaScript 中创建一个擦除函数：\n\n```javascript\nfunction\
  \ eraseSquare() {\n    var canvas = document.getElementById(\"canvas1\");\n    canvas.width\
  \ = canvas.width;\n}\n```\n\n**4.** 在 `<canvas>` 元素上双击时调用擦除函数：\n\n```html\nondblclick=\"\
  eraseSquare();\"\n```\n\n### 绘制矩形\n\n矩形和正方形是用 `<canvas>` 元素绘制的最简单的形状，因为有几个函数专门为构建它们设计的。绘制矩形的三个函数是：\n\
  \n- `fillRect`— 用于绘制填充的矩形\n- `strokeRect`— 用于绘制矩形轮廓\n- `clearRect`— 用于创建一个空透明的矩形形状\n\
  \n图 10.1 显示了这三个函数在同一个画布上的用法。黑色框是两个 `fillRect` 函数，一个先填充了整个画布，另一个最后填充内部空间。白色框是通过 `clearRect`\
  \ 函数创建的，使 `<canvas>` 元素恢复到默认颜色（白色）。细黑线是用 `strokeRect` 函数绘制的。\n\n**图 10.1.** 画布上画有四个矩形。\n\
  \n![image](img/10fig01.jpg)\n\n要绘制矩形，你可以使用这三个函数中的任何一个并传入 `x`、`y`、`width` 和 `height`\
  \ 值。`x` 和 `y` 指定画布上的位置，其中 `0,0` 是左上角。`x` 让点在水平面上向右移动，`y` 让点在垂直面上向下移动。`width` 和 `height`\
  \ 是矩形的大小。\n\n如果你在画布上绘制两个形状，它们将相互层叠，脚本中最后编写的将位于最上。\n\n除非设置了样式，否则 `<canvas>` 元素只以黑白色绘制。你可以通过两个属性设置填充颜色和线条颜色：\n\
  \n- `fillStyle`— 填充颜色\n- `strokeStyle`— 边框颜色\n\n你可以使用颜色名称、十六进制颜色代码、RGB 颜色值以及带有 Alpha\
  \ 透明度的 RGB 颜色值。通过 Alpha 透明度，你可以通过层叠来调整颜色。例如，以下脚本将在页面左上角创建一个红色框，在右下角创建一个淡蓝色框，重叠部分为紫色：\n\
  \n```javascript\ncontext.fillStyle = \"#ff0000\";\ncontext.fillRect(10,10, 300,300);\n\
  context.fillStyle = \"rgba(0,0,255,0.5)\";\ncontext.fillRect(190,190, 300,300);\n\
  ```\n\n使用 `<canvas>` 元素并不限于纯色。你还可以创建渐变并使用它们来设置填充和描边。渐变的两种类型是线性和径向的。要创建渐变，你需要使用三个属性：\n\
  \n- `createLinearGradient`— 接收四个参数。\n- `createRadialGradient`— 接收六个参数。\n- `addColorStop`—\
  \ 你可以拥有任意数量的停止点。\n\n\n\n\n你可以在 [www.html5in24hours.com/examples/canvas-circles.html](http://www.html5in24hours.com/examples/canvas-circles.html)\
  \ 查看此代码的运行效果。\n\n## 绘制多边形和线条\n\n要在 `<canvas>` 元素中绘制其他形状，可以使用线条或路径。用于绘制和使用路径的五个方法是：\n\
  \n- `beginPath()`—此方法在画布中创建路径。\n- `closePath()`—此方法从当前点到起点画一条直线。当路径已经关闭或路径上只有一个点时，它将不会产生任何作用。\n\
  - `stroke()`—这会绘制路径的轮廓。\n- `fill()`—这会填充路径的形状。\n- `moveTo()`—它不绘制任何内容，但会将绘制位置移动到画布上的新位置。\n\
  \n始终先用 `moveTo()` 命令指定路径的起始位置。无论实际使用的是什么方法，`<canvas>` 元素都会以这种方式处理你的第一个构造结构，这可以防止意外结果出现。\n\
  \n将光标移动到起始位置后，使用 `lineTo()` 方法来画线。`lineTo()` 方法接受两个参数：线条应该绘制的 x 和 y 坐标。画线时你可以写道：\n\
  \n```javascript\ncontext.beginPath();\ncontext.moveTo(0,0);\ncontext.lineTo(60,60);\n\
  context.stroke();\n```\n\n### 顺便说：填充会关闭路径\n\n如果你不关闭路径而选择填充形状，该形状将自动通过一条从路径上最后一个点到第一个点的直线来关闭。你不需要用\
  \ `closePath()` 方法来关闭路径。\n\n绘制一个三角形，你可以写道：\n\n```javascript\ncontext.beginPath();\n\
  context.moveTo(20,30);\ncontext.lineTo(500,100);\ncontext.lineTo(250,300);\ncontext.fill();\n\
  ```\n\n你可能需要通过 `width` 和 `height` 属性增加画布的大小，以便让此示例能够容纳。\n\n### 动手试试：绘制八边形\n\n在这个练习中，你将使用线条来绘制八边形的边缘。这不会画出一个完美的八边形，但会创建一个八边图形。\n\
  \n1. 开始你的路径并将绘制点移动到 200,0：\n```javascript\ncontext.beginPath();\ncontext.moveTo(200,0);\n\
  ```\n2. 画线到 400,0：\n```javascript\ncontext.lineTo(400,0);\n```\n3. 再画七条线到 600,200；600,400；400,600；200,\
  \ 600；0,400；以及 0,200：\n```javascript\ncontext.lineTo(600,200);\ncontext.lineTo(600,400);\n\
  context.lineTo(400,600);\ncontext.lineTo(200,600);\ncontext.lineTo(0,400);\ncontext.lineTo(0,200);\n\
  ```\n4. 关闭你的路径：\n```javascript\ncontext.closePath();\n```\n5. 将填充颜色改为红色：\n```javascript\n\
  context.fillStyle = \"#ff0000\";\n```\n6. 填充你的八边形：\n```javascript\ncontext.fill();\n\
  ```\n\n如果你构建的八边形太大，你可能需要增加画布的大小来适应。\n\n你还可以使用 `lineWidth`、`lineCap`、`lineJoin` 和\
  \ `miterLimit` 属性来调整路径线条的宽度、线端的形状以及这些线条的连接方式。\n\n`lineWidth` 属性将宽度从默认的 1 单位（网格标记之间的空间——本质上是一个像素）更改为你需要的任何正数。宽度以路径为中心。要画一条\
  \ 2 宽的线，你可以写道：\n\n```javascript\ncontext.lineWidth = \"2\";\n```\n\n`lineCap` 属性改变线条端点的绘制方式。有三个值：`butt`、`round`\
  \ 和 `square`。默认值是 `butt`。图 10.4 显示了三条具有不同端点的线条。细线显示了路径开始的网格线。你可以看到，`square` 和 `round`\
  \ 样式延伸过了那条网格线。\n\n**图 10.4.** 三种线端点样式：butt、square 和 round。\n\n![image](img/10fig04.jpg)\n\
  \n`butt` 直接到达路径开始的网格线。`square` 在网格线之外增加了线宽宽度的一半。`round` 在网格线之外增加了一个半径为线条宽度一半的半圆。\n\
  \n`lineJoin` 属性改变形状中线条的连接方式。三个可能的值是 `round`、`bevel` 和 `miter`。默认值是 `miter`。图 10.5\
  \ 显示了线条连接的三种方式。默认的 `miter` 产生一个尖角，`bevel` 切掉顶端，而 `round` 则使其变得更圆润。\n\n**图 10.5.**\
  \ 三种线连接样式：miter、bevel 和 round。\n\n![image](img/10fig05.jpg)\n\n### 动手试试：构建具有三种连接类型的线条\n\
  \n你可以用用一种连接类型构建线条，然后将其切换为其他类型，以看看它们看起来是什么样。按照以下步骤创建一个“W”字形，并给角部赋予不同的连接形状：\n\n1.\
  \ 设置线条宽度并开始路径：\n```javascript\ncontext.lineWidth = 15;\ncontext.beginPath();\n```\n\
  2. 将起始点移动到画布内部稍微的位置并画线：\n```javascript\ncontext.moveTo(10,20);\ncontext.lineTo(150,200);\n\
  ```\n3. 再画三条线来创建一个“W”字形：\n```javascript\ncontext.lineTo(290,20);\ncontext.lineTo(430,200);\n\
  context.lineTo(570,20);\n```\n4. 改变线条连接样式：\n```javascript\ncontext.lineJoin = \"\
  round\";\n```\n5. 描路径：\n```javascript\ncontext.stroke();\n```\n\n观察你的画布查看 `miter`\
  \ 的默认样式。将线条连接样式改为 `round` 和 `bevel`，观察角部是如何变化的。\n\n`miterLimit` 属性定义了连接处斜角有多尖锐或多钝。miter\
  \ 限制越高，你的斜角连接就可以越尖锐。对于较小的限制，当连接达到该限制时，会变为斜角（bevel）。\n\n## 绘制圆\n\n要在 `<canvas>` 元素中绘制圆，使用\
  \ `arc` 方法。要理解如何绘制圆，你必须想象你正在用圆规物理地绘制圆。你将圆规的顶点放在圆的中心，弯曲角度使笔位于半径处，从某一点开始画，并在第二一点抬起笔。你可以按顺时针或逆时针方向绘制圆。\n\
  \n`<canvas>` 元素以相同的方式绘制圆。你设置圆心的 x 和 y 坐标、半径、圆上的起点（弧度）、圆上的终点（弧度），最后是绘制方向，顺时针（`true`）或逆时针（`false`）。该方法看起来如下：\n\
  \n```javascript\narc(x,y,radius,startAngle,endAngle,true);\n```\n\n### 顺便说：如何找到圆和弧的起点与终点\n\
  \n`<canvas>` 中的弧是以弧度为单位的，而不是角度。弧度的起点与角度相同（在角度中是 0，但在弧度中不是）。但由于大多数人发现用角度思考更容易，拥有转换工具会有帮助。在\
  \ JavaScript 中，你可以通过以下表达式将角度转换为弧度：`var radians = (Math.PI/180)*degrees`。\n\n绘制一个圆，写道：\n\
  \n```javascript\nvar startPoint = (Math.PI/180)*0;\nvar endPoint = (Math.PI/180)*360;\n\
  context.beginPath();\ncontext.arc(200,200,100,startPoint,endPoint,true);\ncontext.fill();\n\
  ```\n\n### 动手试试：绘制半圆\n\n使用绘制圆或圆弧的 `arc` 方法用半圆构建波浪图案。\n\n1. 决定圆的直径，并将定义为其的一半：\n```javascript\n\
  var radius = 125/2;\n```\n2. 根据半径定义第一个圆的 x 和 y 坐标：\n```javascript\nvar y = radius+10;\n\
  var x1 = radius;\n```\n3. 根据半径定义后续圆的坐标：\n```javascript\nvar x2 = 3*radius;\nvar\
  \ x3 = 5*radius;\nvar x4 = 7*radius;\n```\n4. 使用 `Math.PI` 作为你的终点值绘制第一个半圆以得到一个半圆：\n\
  ```javascript\ncontext.beginPath();\ncontext.arc(x1,y,radius,0,Math.PI,true);\n\
  context.stroke();\n```\n5. 绘制第二个圆，仅改变方向为逆时针：\n```javascript\ncontext.beginPath();\n\
  context.arc(x2,y,radius,0,Math.PI,false);\ncontext.stroke();\n```\n6. 在画布上重复你需要的数量的圆：\n\
  ```javascript\ncontext.beginPath();\ncontext.arc(x3,y,radius,0,Math.PI,true);\n\
  context.stroke();\ncontext.beginPath();\ncontext.arc(x4,y,radius,0,Math.PI,false);\n\
  context.stroke();\n```\n\n\n\n\n\n图 10.6 显示了如果你添加 `lineWidth` 来使线条加粗，它会是什么样子。\n\n\
  **图 10.6.** 由半圆组成的波浪形图案。\n\n![image](img/10fig06.jpg)\n\n如果你正在填充圆形，或者想在中间画一条线连接所有圆，可以移除多余的\
  \ `beginPath()` 和 `stroke()` 方法（除了第一个 `beginPath()` 和最后一个 `stroke()`）。\n\n* * *\n\
  \n### 在画布上绘制字体和文本\n\n要在画布上绘制文本，请使用 `fillText()` 方法来定义绘制的内容和位置：\n\n```\ncontext.fillText(\"\
  Hello World\", 250, 100);\n```\n\n这会将文本“Hello World”放置在 x 和 y 坐标 250, 100 处。\n\n\
  画布上的文本是绘制出来的，而不是显示在 CSS 盒模型内部。你无法定义浮动、外边距、内边距或自动换行。你只需要设置字体大小、族、粗细、变体和行高，然后在画布上绘制它。你可以使用多个属性来绘制文本：\n\
  \n• `font`——这是任何你会放入 CSS 字体属性中的内容，例如字体族、大小、粗细、变化和行高。\n\n• `textAlign`——这控制你文本的对齐方式，类似于\
  \ CSS 的 `text-align` 属性。它使用的值为 `start`、`end`、`left`、`right` 和 `center`。\n\n• `textBaseline`——这控制文本相对于起始位置的绘制位置。它接受的值\
  \ `top`、`hanging`、`middle`、`alphabetic`、`ideographic` 和 `bottom`。\n\n* * *\n\n**注意！**:\
  \ 非英语文本的基线\n\n对于英文文本，你的 `textBaseline` 值可以保持 `top`、`middle` 或 `bottom`，但如果你要编写其他语言，你需要注意它们的锚定点在哪里，以便使用正确的基线。\n\
  \n* * *\n\n你可以像在 CSS 中样式化文本一样样式化你的文本。如果你更改了字体族，你应该像在 CSS 中那样定义多个字体族。用逗号分隔它们，并按偏好顺序排列。最后应该以通用字体类型结束，如\
  \ `serif`、`sans-serif` 或 `monospace`。记住，如果你的用户设备上没有该字体，`<canvas>`元素将无法为他们提供。你将在第\
  \ 11 小时，“HTML5 中的字体与排版”中学习更多关于自定义字体知识。\n\n这是一个向 `<canvas>` 元素添加自定义文本的示例：\n\n```\n\
  context.font = \"bold 3em/3.5em 'Palatino Linotype', 'Book Antiqua', Palatino, serif\"\
  ;\ncontext.textAlign = \"center\";\ncontext.textBaseline = \"middle\";\ncontext.fillStyle\
  \ = \"#f93\";\ncontext.fillText(\"Hello World!\", 250, 250);\n```\n\n如你所示，你通过 `fillStyle`\
  \ 属性更改颜色，因为你正在使用 `fillText` 方法填充文本。\n\n* * *\n\n**顺便说一下**: 使用 CSS 样式化画布字体\n\n在 `<canvas>`\
  \ 元素的 CSS 中设置字体大小会影响文本的大小。然而，其他 CSS 样式可能不会生效。在应用可能继承的属性时要小心，因为你的画布文本看起来可能与你预期的不同。\n\
  \n* * *\n\n你可以使用四个属性为图形添加阴影：\n\n• `shadowOffsetX`——阴影在 x 轴上延伸的距离。负值将阴影向左移动。\n\n\
  • `shadowOffsetY`——阴影在 y 轴上延伸的距离。负值将阴影向上移动。\n\n• `shadowBlur`——模糊效果的大小。默认值为 0。\n\
  \n• `shadowColor`——阴影的颜色。默认是完全透明的黑色（`rgba(0,0,0,0)`）。\n\n* * *\n\n### 动手尝试：为文本添加阴影\n\
  \n使用阴影属性为 `canvas`元素中的文本块添加文本投影。\n\n**1.** 为画布添加一些文本：\n\n```\ncontext.font = \"\
  bold 3em/3.5em 'Palatino Linotype', 'Book Antiqua', Palatino, serif\";\ncontext.textAlign\
  \ = \"center\";\ncontext.textBaseline = \"middle\";\ncontext.fillStyle = \"#f93\"\
  ;\ncontext.fillText(\"Hello World!\", 250, 250);\n```\n\n**2.** 在文本上方，设置阴影的 x 和\
  \ y 偏移量：\n\n```\ncontext.shadowOffsetX = -2;\ncontext.shadowOffsetY = 2;\n```\n\n\
  **3.** 定义模糊：\n\n```\ncontext.shadowBlur = 2;\n```\n\n**4.** 选择阴影颜色：\n\n```\ncontext.shadowColor\
  \ = \"rgba(0,0,0,0.5)\";\n```\n\n将 `fillText` 行放在代码的最后是重要的，否则阴影和填充颜色将不会显示。你可以在 [www.html5in24hours.com/examples/canvas-text.html](http://www.html5in24hours.com/examples/canvas-text.html)\
  \ 查看示例。\n\n* * *\n\n#### 显示图像\n\n要在`<canvas>`元素内部显示图像，你需要引用图像对象作为源文件，然后使用 `drawImage`\
  \ 方法将图像绘制到画布上。\n\n```javascript\nvar img = new Image();\nimg.src = \"graphics/10fig06.jpg\"\
  ;\nimg.onload = function() {\n    context.drawImage(img, 10, 10);\n};\n```\n\n####\
  \ 缩放与裁剪\n\n你可以做的不仅仅是在画布上显示图像。缩放涉及使用宽度和高度参数使图像变大或变小。\n\n裁剪图像比缩放复杂一些，但它为图像创建一个了一个。裁剪图像需要指定显示区域的坐标、宽度和高度。\n\
  \n如图 10.7 所示，每个图像添加了一些文本，但此图只显示了一个绘制在画布上的图像。记住，缩放是由浏览器完成的，没有质量控制。图像如果放大太多会模糊，如果缩小太多会有颗粒感。\n\
  \n#### 添加图案\n\n你可以使用画布方法 `createPattern()` 用图像创建图案。你告诉它你想使用哪个图像以及如何在画布上进行图案化：\n\n\
  `context.createPattern(image, repeat-x)`\n\n你可以将图案设置为 `repeat-x`（水平）、`repeat-y`（垂直）、`repeat`（平铺）和\
  \ `no-repeat`（不重复）。\n\n* * *\n\n### 动手尝试：在画布绘制装饰边框\n\n在这个练习中，你使用单个图像作为重复图案在画布外部创建一个边框。\n\
  \n**1.** 为你的图案创建一个新的图像对象：\n\n```javascript\nvar pattern = new Image();\npattern.src\
  \ = \"images/leaf-icon.png\";\n```\n\n**2.** 当图像加载时打开一个函数：\n\n```javascript\npattern.onload\
  \ = function() {\n```\n\n**3.** 创建一个新的图案：\n\n```javascript\nvar ptn = context.createPattern(pattern,\"\
  repeat-y\");\n```\n\n**4.** 将填充样式设置为图案：\n\n```javascript\ncontext.fillStyle = ptn;\n\
  ```\n\n**5.** 构建一个矩形并用图案填充：\n\n```javascript\ncontext.fillRect(0,0,500,500);\n```\n\
  \n**6.** 关闭函数：\n\n```javascript\n};\n```\n\n\n\n\n图 10.8 展示了如何仅使用图像和 `canvas` 元素创建一个叶子边框。\n\
  \n**图 10.8.** Canvas 上的边框图案。\n\n![image](img/10fig08.jpg)\n\n***\n\n### Canvas 与\
  \ SVG 或 Flash 有何不同？\n\n`<canvas>` 元素与 SVG 或 Flash 最大的区别在于 `<canvas>` 是一个 HTML 元素，因此内置于浏览器和网页中。这使得脚本和动态\
  \ Web 应用访问 `<canvas>` 元素的内容变得简单。\n\nSVG 是一种用 XML 编写的完全独立的语言，而 Flash 是用 SWF 编写的。虽然大多数现代浏览器和移动设备都支持\
  \ SVG，但 Flash 不支持 iOS，且 Android 2.3 和 Internet Explorer 8 不 SVG。表 10.1 显示了 Canvas、SVG\
  \ 和 Flash 的某些特性。\n\n**表 10.1.** Canvas、SVG 和 Flash 的不同特性\n\n![image](img/10tab01.jpg)\n\
  \n#### 总结\n\n`<canvas>` 元素是构建矢量图形图像的强大工具。在本节中，你学习了如何使用路径和矩形绘制正方形、多边形、线条和圆形。\n\n\
  你还学习了如何向画布添加文本和图像，以及为绘图添加阴影、为填充添加渐变，并操作在画布上绘制的图像。\n\n本节还讨论了 `<canvas>` 元素、Flash\
  \ 和 SVG 之间的一些差异。你还了解了每个工具的优势，以便能够有效地使用它们。\n\nHTML5 `<canvas>` 元素是一个非常复杂的元素，你仍然有很多可以学习的内容。本节提供了一个良好的概述，但它只触及了使用\
  \ HTML5 `<canvas>` 元素可以实现的表面内容。你还可以：\n\n• 为你的画布制作动画\n• 缩放和变换你的绘图\n• 使用裁剪路径组合多个绘图\n\
  • 添加交互性\n• 构建复杂的游戏\n\nCanvas 是 HTML5 中一个非常有趣且令人兴奋。附录 C 中列出的 HTML5 和移动应用资源”资源可以帮助你学习更多关于它的知识。\n\
  \n### 问答\n\n**Q. 我看到你只提到了二维画布（2d context）。是否存在三维画布（3d context）？**\n\n**A.** 目前对于\
  \ `<canvas>` 元素上的三维上下文还没有被接受的标准。它最终将会有的，但目前你只能创建二维绘图。\n\n在 Chrome、Firefox 4 和 Internet\
  \ Explorer 9 中启用了一个实验性上下文以支持三维上下文：`WebGL`。你使用 `\"experimental-webgl\"` 来启用此上下文。\n\
  \n**Q. 当我用路径画直线时，它们不像我想要的那样锐利，这是为什么？**\n\n**A.** 这是因为画布上网格的工作方式。`x` 和 `y` 坐标形成网格中的线，但当这些线绘制在屏幕上时，它们实际上绘制在网格线*之间*的空间内。当你绘制偶数厚度的线条时，线条会跨越两个完整的像素；但当绘制奇数厚度的线条时，它会绘制在线上，一边一半，另一边一半。由于计算机显示器无法将一个像素一分为半，它们通过对两侧的像素进行抗锯齿来补偿。\n\
  \n要解决这个问题，你需要将线条的位置移动到两个网格标记之间的中间。因此，与其从 `3,0` 到 `3,6` 绘制一条 1 像素宽的线，你应该从 `3.5,0`\
  \ 到 `3.5,6` 绘制。这将线条放置在网格线之间并消除抗锯齿。\n\n**Q. 你可以在文本以外的任何内容添加阴影吗？**\n\n**A.** 是的，你可以为所有画布形状添加阴影，但如果你对应用了渐变填充的绘图添加阴影，阴影将不会显示。这是一个已被标记为修复的浏览器\
  \ Bug，但似乎仍然是一个问题。截至本文编写，为渐变填充的形状添加阴影在 Firefox 4 中有效，但在 Chrome 或 Safari 中无效。\n\n\
  ### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的知识。在阅读答案之前，尝试回答所有问题。请参见 附录 A “测验答案”。\n\n#### 测验\n\
  \n**1.** 当你在 HTML 中编写 `<canvas>` 元素时，浏览器中显示什么？\n\n**2.** `clearRect()` 方法执行以下哪项：\n\
  \n**a.** 创建一个空、透明的矩形\n**b.** 删除现有的矩形\n**c.** 从画布上移除所有矩形\n\n**3.** 正确或错误：你不能在 `strokeStyle`\
  \ 属性中使用透明颜色。\n\n**4.** 以下哪项是线条的默认端点样式：\n\n**a.** 平圆 (Butt)\n**b.** 方圆形 (Square)\n\
  **c.** 圆形 (Round)\n\n**5.** 正确或错误：你不能在画布上设置字体。\n\n**6.** 正确或错误：你可以在画布上设置排版。\n\n\
  **7.** 图像需要做哪两件事？\n\n**8.** 以下三个中哪个是基于的：\n\n**a.** Canvas\n**b.** Flash\n**c.**\
  \ SVG\n\n#### 练习\n\n**1.** 构建一个画布，对角线上有至少七种颜色的彩虹渐变。\n**2.** 制作一个页面，尽可能使用大量的 `<canvas>`\
  \ 特性。\n\n## 第 11 节 HTML5 中的字体与排版\n\n***\n\n***本节你将学到：***\n\n• HTML5 对排排的改变\n• 用于字体的新\
  \ CSS3 属性\n• 如何使用 CSS3 进行连字符\n• 选择排版实体\n• 什么是 Open Font Format (WOFF) 标准\n• 如何在你的\
  \ `@font-face` 定义中使用 WOFF\n\n***\n\n本节将教你如何在网页页面上使用排版。排版以前很难实现精确控制，但正如你在本节中看到的，HTML5\
  \ 和 CSS3 添加了新工具使其变得更加容易。\n\n#### 定义排版元素\n\n排版是通信中字体的设计和使用。它包括使用的字体、文本在页面上的显示方式，甚至是实体或特殊字符。从\
  \ HTML 4 到 HTML5，网页排版的规则没有变化；HTML5 只是提供了更多的工具来实现良好的排版。\n\n在设计页面和应用程序时，你应该考虑排版的几个元素：\n\
  \n• 字体族\n• 间距\n• 连字符\n• 对齐\n• 孤行与寡行\n\n#### 字体族\n\n*字体* 是大多数人所谓的“字体”，但实际上是“家族”。例如，Arial\
  \ 字体族包括 Arial、Arial Black 等。在 Arial 字体族中，你可以有粗体、斜体、小型大写等。字体涉及的不仅仅是类型所属的家族。字体还包括粗细、斜体、字体变体和大小。\n\
  \n在使用 HTML 和 CSS 进行设计时，你应该养成使用标准 CSS 字体属性定义字体所有方面的习惯：\n\n\n\n\n\n* `font-family`—一组用于设置文本样式的字体族优先级列表。最终名称应该是一个通用族名称，如\
  \ `serif`、`sans-serif`、`monospaced`、`cursive`、`fantasy` 和 `script`；例如：\n\n```css\n\
  font-family: Geneva, Arial, Helvetica, sans-serif;\n```\n\n* `font-style`—定义字体是\
  \ `italic`（斜体）还是 `normal`（正常），如下：\n\n```css\nfont-style: italic;\n```\n\n* `font-weight`—定义字重。你可以使用数字（`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`\
  \ 或 `900`）——数字越小权重越轻，400 为正常权重；相对值（`bolder` 或 `lighter`），使字体相对于父值加粗或变细；或者关键字 `bold`\
  \ 和 `normal`：\n\n```css\nfont-weight: bold;\n```\n\n* `font-variant`—定义文本为 `small-caps`（小型大写字母）或\
  \ `normal`。例如：\n\n```css\nfont-variant: small-caps;\n```\n\n* `font-size`—定义字体大小。你可以将大小定义为浏览器指定的绝对大小（`xx-small`、`x-small`、`small`、`medium`、`large`、`x-large`、`xx-large`），其中\
  \ `medium` 是默认值。你也可以使用相对字体（`smaller` 和 `larger`）、带有单位的长度（in、`cm`、`mm`、`pt`、`pc`、`em`、`ex`\
  \ 或 `px`）或百分比。例如：\n\n```css\nfont-size: 80%;\n```\n\n* `line-height`—定义字体行高。你可以将其定义为倍数数字、特定长度（带有测量单位）或字体大小的百分比：\n\
  \n```css\nline-height: 110%;\n```\n\n* `font`—一个简写属性，按以下格式描述字体样式、变体、权重、大小、行高和字体族：`font:\
  \ font-style font-variant font-weight font-size/line-height font-family;`。例如：\n\n\
  ```css\nfont: italic small-caps bold 1em/1.3em Geneva, sans-serif;\n```\n\n***\n\
  \n### 你知道吗？设置基础字体大小\n\n在为移动设备设计时，使用相对字体（如 `em` 或百分比）是最好的，这样你的设计根据屏幕大小进行缩放。然而，你应该设置基础字体大小，以便\
  \ `1 em` 等于一个你可以测量的值。在大多数显示器上，基础字体大小（或“medium”大小）是 `16px`，这很难使用。因此，你可以将正文设置为 `62.5%`\
  \ 或 `10px`（`16 × 62.5% = 10`），然后当你将字体设置为 `1.2em` 时，你就知道它将以 `12px` 显示。\n\n***\n\n\
  CSS3 中还添加了一些新的字体属性：\n\n* `font-stretch`—允许你从字体族中选择正常、紧凑或扩展的字体。你可以使用绝对关键字，如 `ultra-condensed`、`extra-condensed`、`condensed`、`semi-condensed`、`normal`、`semi-expanded`、`expanded`、`extra-expanded`\
  \ 和 `ultra-expanded`。你也可以使用相对关键字 `wider` 和 `narrower` 将字体向上扩展或收缩一级，直到达到极限；例如：\n\n\
  ```css\nfont-stretch: wider;\n```\n\n* `font-size-adjust`—允许你调整字体大小，以便在首选字体不可用时增加可读性。要使用它，将其设置为首选字体的宽高比例值。如果该字体不可用，则使用的字体将具有与你的首选字体相同的宽高比例值。一些常见的字体比例值列在\
  \ [www.webspaceworks.com/resources/fonts-web-typography/43/](http://www.webspaceworks.com/resources/fonts-web-typography/43/)。例如：\n\
  \n```css\nfont-size-adjust: 0.54;\n```\n\n* `font-effect`—使用关键字 `emboss`（压凸）、`engrave`（雕刻）、`outline`（轮廓）和\
  \ `none`（无）设置文本看起来像压凸、雕刻或轮廓：\n\n```css\nfont-effect: outline;\n```\n\n* `font-smooth`—对文本应用抗锯齿或将其关闭。默认情况下（`auto`），字体将根据系统默认进行平滑，否则你可以将其设置为\
  \ `none`、`always` 或绝对大小或长度。对于大小和长度，字体平滑将应用于该大小或更大的字体，否则不应用：\n\n```css\nfont-smooth:\
  \ 12px;\n```\n\n* `font-emphasize-style`—对于某些语言（如中文和日语），你可以使用符号来强调字符。此属性允许将符号设置为\
  \ `none`、`accent`、`dot`、`circle` 或 `disc`：\n\n```css\nfont-emphasize-style: accent;\n\
  ```\n\n* `font-emphasize-position`—此属性允许强调符号的位置，`before`（之前）或 `after`（之后）：\n\n```css\n\
  font-emphasize-position: after;\n```\n\n* `font-emphasize`—这是两个强调属性的简写属性。使用 `font-emphasize`。\n\
  \n\n\n\n\n如果你想通过 CSS 影响字间距，可以使用 `word-spacing` 属性。该属性在单词周围添加空间，类似于 `letter-spacing`\
  \ 在字母周围添加或删除空间的方式。\n\n行间距（Leading）受 `line-height` 属性影响。设置行间距或行高的一个良好通用规则是在字体大小的基础上增加\
  \ 20%。这为字体留出了一些呼吸空间。行距较小的文本通常看起来很拥挤，而行距过大则可能难以阅读，因为人们无法轻松追踪到下一行。\n\n你可以通过更改包含文本的元素的\
  \ `width` 来影响文本的行宽（measure）。这通常在布局本身中完成。如果文本太宽或太窄，阅读起来就会变得困难，但你可以通过更改行距来改善这一点。在行宽宽的文本中，增大行距以提高文本的可读性；对于行宽窄的文本，则减小行距。\n\
  \n对齐是通过 CSS2 属性 `text-align` 完成的。你可以将对齐设置为 `left`（默认值）、`right`、`center` 和 `justify`（两端对齐）。\n\
  \n连字（Ligatures）是 CSS 最难影响的间距。如果可能，获取一个包含连字的字体会更好，但网页排版尚未达到自动添加连字的程度。相反，你需要使用特殊字符（如\
  \ `&aelig;`）来写 æ，或者使用 `letter-spacing` 通过将两个字母靠在一起来伪造连字。\n\n你还可以找到一些 JavaScript\
  \ 库，例如 `Lettering.js` ([`letteringjs.com/`](http://letteringjs.com/))，来帮助处理网页上的行距、字间距（kerning）和其他排版问题。\n\
  \n### 连字符\n\nHTML 有两种类型的连字符：普通连字符和软连字符（soft hyphen）。普通连字符只是一个字符，浏览器在看到它时会渲染为 `-`，无论它出现在行的什么位置。软连字符写为\
  \ `&shy;` 或 `&#173;`，按理只在行末时显示。图 11.2 显示了完全两端对齐的文本块中的软连字符。\n\n**图 11.2.** 对齐文本中的软连字符。\n\
  \n![image](img/11fig02.jpg)\n\n***\n\n*你知道吗？*: 什么是软连字符？\n\n有些人将 HTML 中的软连字符称为“酌情连字符”（discretionary\
  \ hyphen），因为它只根据用户代理的意愿出现在文本中。在 HTML 3.2 中，它的定义不同：它是一个后面可以换行的连字符，而不是后面永远不会有换行的“硬”连字符\
  \ `-`。这就是为什么某些非常老旧浏览器在文本中写 `&shy;` 时会显示该字符。\n\n***\n\n虽然在文档每个多音节单词内部添加软连字符是可能的，但除非你有自动连字符系统，否则对于长文档或大型网站来说这是不可行的。相反，你应该在两个地方使用它：\n\
  \n- 当文本块宽度小于四五个单词时，为较长的单词添加软连字符可以让文本块看起来不那么琐碎。\n- 当你有一个超过四五个音节的单词时，在音节处添加软连字符可以确保它不会行末产生巨大的空格。\n\
  \n许多设计师避免使用 `&shy;` 字符，因为它在各种旧版浏览器中会产生奇怪的结果。然而，情况不再如此了。所有现代浏览器都支持此字符，包括 Internet\
  \ Explorer 以及 iOS 和 Android 移动浏览器。\n\n在处理连字符时，你还应该考虑何时你不希望单词断开。例如，如果你写了“X-Windows”，你永远不希望“X-”出现在行末，但由于该单词中有一个连字符字符，浏览器可能会在那里进行换行。为了防止这种情况，你应该使用\
  \ CSS 规则 `white-space: nowrap;`，并将需要保持整体的单词放在带有该类的 `span` 标签中：\n\n```css\n.nobreak\
  \ { white-space: nowrap; }\n```\n\n...\n\n<span class=\"nobreak\">X-Windows</span></span>\n\
  \nCSS3 还提供了几个新的连字符样式属性：\n\n- `hyphens`—**此属性控制文本块中是否允许连字符。默认值是 `manual`，但你可以将其更改\
  \ `none`、`auto` 或 `all`：**\n```css\nhyphens: auto;\n```\n- `hyphenate-character`—**在连字符部分之间显示的字符字符串：**\n\
  ```css\nhyphenate-character: \"\\2010\";\n```\n- `hyphenate-limit-zone`—**这是一个百分比或长度，规定在发生连字符之前行中可以留的最大未填充空间：**\n\
  ```css\nhyphenate-limit-zone: 3%;\n```\n- `hyphenate-limit-chars`—**连字符单词中的字符数以及（可选的）连字符前后所需的最小字符数：**\n\
  ```css\nhyphenate-limit-chars: auto 3;\n```\n- `hyphenate-limit-lines`—**元素中连续连字符行的最大数量。指定\
  \ `no-limit` 则不对连续连字符行的数量进行限制：**\n```css\nhyphenate-limit-lines: 5;\n```\n- `hyphenate-limit-last`—**定义元素末尾如何进行连字符化。值可以是\
  \ `none`、`always`、`column`。如果值为 `all`，则不应发生连字符化：**\n```css\nhyphenate-limit-last:\
  \ all;\n```\n- `@hyphenate-resource`—**用于指定连字符点的字典资源列表：**\n```css\n@hyphenate-resource:\
  \ url(\"hyphen.dic\");\n```\n\n***\n\n*注意！*：务必测试连字符属性\n\n`hyphens` 属性某些浏览器支持，但其他属性的支持并不完善，并可能从规范中移除。\n\
  \n***\n\n#### 参差对（Rag）\n\n参差是指文本未对齐一侧的边缘。在英语中，参差位于右侧。你应该关注由参差产生的形状。行末的大大间隙会使你的文本变得难以阅读。\n\
  \n虽然没有特定的标签或属性可以用来定义文本的参差，但你可以通过连字符、字体大小甚至文本宽度来改善它。你甚至可以编辑文本本身来填补这些空间。\n\n#### 孤行（Widows）和孤节（Orphans）\n\
  \n孤行和孤节是指遗留在列末或行首的单词。这些孤立的单词会让文本难以阅读，甚至可能改变含义。考虑这个标题：\n\n“我走过了一片\n\n海洋”\n\n像参差一样，没有特定的标签或属性可以处理孤行和孤节，但你可以使用文本宽度或字体大小来尝试消除它们。有时，最简单的方法是在内容中删除或添加文本。\n\
  \n***\n\n*顺便说一下：不要混淆 CSS 属性与网页排版\n\nCSS 有两个属性 `widows` 和 `orphans`，它们经常与排版术语 *widows*\
  \ 和 *orphans* 混淆。这些 CSS 属性仅适用于分页媒体（如打印输出），而不适用于 Web 应用程序或网页。它们定义了页面顶部（孤行）或底部（孤节）应该显示的行数。\n\
  \n\n\n\n但你不能直接从 Word 文档中复制粘贴这些引号；这些引号无法正常显示，并可能导致你的文档出现异常字符或小黑框。相反，你应该使用字符实体（character\
  \ entities）。你可以使用几种用于引号的实体，列在表 11.1 中。\n\n**表 11.1.** 引号类型 HTML 实体\n\n![image](img/11tab01.jpg)\n\
  \n### 商业标记 (Business Marks)\n\n大多数网页设计师会在某些时候使用几类的商业标记。看到它们以简写形式渲染（例如用 (c) 表示版权而不是使用正确的符号）是常见现象。表\
  \ 11.2 显示了这些实体的正确代码。\n\n**表 11.2.** 商业字符 HTML 实体\n\n![image](img/11tab02.jpg)\n\n\
  ### 高级标点符号\n\n还有许多其他的排版实体可以使用——在书中多到无法列不尽。但如果你关注排版，请注意几个在网页上经常被错误使用的标点符号实体。学会正确编写表\
  \ 11.3 中的实体，你的文档将拥有更好的视觉排版效果。\n\n**表 11.3.** 标点符号 HTML 实体\n\n![image](img/11tab03.jpg)\n\
  \n花时间使用正确的字符实体而不是更易于使用的替代方案，似乎是一件小事，但这样做可以使你的文本更清晰、更易读。\n\n#### 理解网络开放字体格式 (WOFF)\n\
  \n网络开放字体格式 (WOFF) 是一种用于压缩字体数据以供 CSS 中的 `@font-face` 使用的草案标准。它是 EOT、TTF、OTF 和 SVG\
  \ 等等字体选项。\n\n在 `@font-face` 和网络字体广泛采用之前，设计师被迫采用变通方法将自定义字体引入他们的网页中。有许多技术可用，包括：\n\n\
  • 使用图像代替文本\n• 使用复杂的图像替换技术用图像替换文本\n• 仅使用“网络安全”字体\n\n* * *\n\n*你知道吗？*：对于字体而言，“网络安全”是一个误名\n\
  \n`web safe fonts` 一词源于 `web safe colors`。网络安全颜色是 216 种颜色的子集，在仅有 256 色显示的 Macintosh\
  \ 和 Windows 显示器上显示效果是相同的。网络安全字体被认为存在于网上绝大多数计算机上。然而，与显示器的色彩深度不同，客户可以在自己的计算机上更改、添加和删除字体。因此，网络安全字体更多的是一种近似值而非事实。\n\
  \n* * *\n\n使用 WOFF 字体的优势是：\n\n• WOFF 字体经过了压缩，这意味着与原始的 TrueType 或 OpenType 格式相比，它们的下载速度更快。\n\
  • WOFF 包含了告知字体来源的信息，而无需数字版权管理 (DRM) 或特定的域名标记。\n\n当然，WOFF 字体也有一些缺点，主要集中在浏览器支持方面：\n\
  \n• Internet Explorer 直到 9 版本才支持 WOFF。9 之前的所有版本都不支持，你必须使用 EOT。\n• Safari 5 不支持 WOFF，尽管预计\
  \ Safari 6 将支持它。\n• 目前唯一支持它的移动平台是 Opera Mobile。iOS 和 Android 都不支持 WOFF。\n\n由于这些缺点，许多设计师对使用\
  \ WOFF 犹豫不决，但对这项技术的支持正在增长，接下来的章节涵盖了替代方案，你可以在 WOFF 被完全支持之前将其作为备选方案。\n\n#### 使用 `@font-face`\
  \ 使用 WOFF\n\nCSS `@font-face` 特性从第 2 版本开始就存在 CSS 中，并且长期以来受到浏览的支持。Internet Explorer\
  \ 在 5 版本中加入了它，Firefox 在 3.5，Safari 在 3.2，Chrome 至少从 8 版本开始，Opera 则从 10 版本开始。移动浏览器也支持\
  \ `@font-face`。iOS 3.2 到 4.1 支持有限，4.2 和 4.3 完全支持。Android 在 3.0 和 2 版本中支持有限，而 Opera\
  \ Mobile 完全支持。\n\n但尽管有这些支持，仍极少数设计师使用 `@font-face` 将自定义字体添加到他们的网页设计中。然而，使用 `@font-face`\
  \ 自定义字体非常简单。\n\n要在样式表中添加自定义字体脸，你需要：\n\n• 一种获得网络字体使用许可并以网络字体格式（EOT、OTF、SVG、TTF 或\
  \ WOFF）保存的字体\n• 一张样式表\n\n* * *\n\n*注意！*：字体受版权保护\n\n世界上有成千上万字体，但大多数并不是免费的。在将 TTF\
  \ 文件上传到网络服务器之前，你应该查询该字体的许可类型。确保你有权在网页上使用该字体。确保字体可以合法商业用途也是一个好主意——有些公司甚至将网站上的广告视为商业行为。\n\
  \n* * *\n\n`@font-face` 属性的语法如下\n\n```css\n@font-face {\n    font-family: FontName;\n\
  \    src: url(URL);\n}\n```\n\n`FontName` 可以是你任何想要的名称，它是你在 CSS 字体规则中将引用的名称。\n\n\
  * * *\n\n### 尝试一下：为你的页面添加自定义字体\n\n使用 `@font-face` 为你的网页添加自定义字体是简单的。按照以下步骤操作：\n\n\
  1. 将字体文件上传到目录。如果你认为有很多字体，创建一个 `/fonts` 目录。\n2. 编辑你的样式表并添加 `@font-face` 规则：\n```css\n\
  @font-face {\n```\n3. 将新字体的名称定义为 `font-family`：\n```css\nfont-family: 'LemonRegular';\n\
  ```\n4. 指向字体文件作为源：\n```css\nsrc: url('fontsfont.woff') format('woff');\n```\n5.\
  \ 为了清晰起见，包含字体权重样式并关闭 `@font-face`：\n```css\nfont-weight: normal;\nfont-style: normal;\n\
  }\n```\n6. 像使用任何字体族一样创建一个样式：\n```css\nh1 {\n    font: 3em LemonRegular, sans-serif;\n\
  }\n```\n7. 在你的 HTML 中引用该样式：\n```html\n<<h1>>此标题使用了 LemonRegular</h1>\n```\n\n确保在支持你使用的网络字体类型的浏览器中测试页面。\n\
  \n* * *\n\n### 使用 WOFF 的替代方案\n\nWOFF 的问题在于并非所有浏览器都支持它。因此，如果你想显示你的特殊字体，你需要定义多个源文件并多版本上传字体文件：\n\
  \n• **EOT**—Internet Explorer 8\n• **OTF 和 TTF**—Chrome, Firefox, IE 9, Opera, Safari,\
  \ iOS 4.2, Android 2.2\n• **SVG 字体**—Chrome, Opera, Safari 3.2, iOS, Android 3.0•—Chrome,\
  \ Firefox, IE 9, Opera\n\n为了确保字体在尽可能多的设备上显示，你应该以每格式上传字体。如果你没有每种格式的字体，你应该联系字体供应商获取其他格式。然后你可以在\
  \ `@font-face` 规则中为每种格式定义源：\n\n```css\nsrc: url('font.eot');\nsrc: url('font.eot?#iefix')\
  \ format('embedded-opentype'),\n    url('font.woff') format('woff'),\n    url('font.ttf')\
  \ format('truetype'),\n    url('font.svg#font') format('svg');\n```\n\n* * *\n\n\
  *顺便说一句*：那个问号很重要\n\n\n\n\n使用多个源文件的问题之一是，Internet Explorer 会下载它识别的所有文件。这增加了页面的下载时间。Paul\
  \ Irish 创建了一种名为“防弹语法”（Bulletproof Syntax）的解决方案，通过在 URL 前使用命令 `local()` 实现。这强制 IE\
  \ 加载 EOT 文件而不是加载其他文件，而其他浏览器会加载它们所需的内容——Android 除外。随后，Fontspring 提出了 Fontspring @Font-Face\
  \ 语法。通过在第一个 `src` URL 中添加一个问号（例如，`font.eot```?`#iefix`），IE 就会认为字符串的其余部分是 URL 查询字符串并忽略它，只加载\
  \ EOT 文件。\n\n如你所见，你需要上传四个版本的字体文件，但这种技术可以确保你的字体在 Android 2.2、Chrome 8、Firefox 3.6、IE\
  \ 6、iOS 3.2、Opera 10.5 以及 Safari 3.2 的所有后续版本上显示。\n\n如果所有这些仍然让你感到困惑，你可以使用 Font Squirrel\
  \ @Font-Face 生成器（[www.fontsquirrel.com/fontface/generator](http://www.fontsquirrel.com/fontface/generator)）将字体转换为只需上传到你网站的工具包。\n\
  \n#### 总结\n\n这一节课带你学习了一些较新的 CSS3 字体属性，例如：\n\n• `font-stretch`\n• `font-size-adjust`\n\
  • `font-effect`\n• `font-smooth`\n• `font-emphasize`\n\n你还学习了如何控制排版的其他元素，包括间距、连字符、不对齐（rag）、孤行（widows）和孤字（orphans）。你学习了如何使用正确的排版实体，以确保你的页面看起来不杂乱。\n\
  \n这一节课还带你学习了如何在 `@font-face` 规则中使用新的 HTML5 网络字体格式 WOFF。有了这些工具，你再也不需要使用那些无聊的“网络安全”字体了。\n\
  \n### 问答\n\n**Q. 为什么我应该关注排版？**\n\n**A.** 排版正日益成为优秀网站与糟糕网站拉开差距的方式。当你花时间管理网页上的排版时，你就是在花时间确保它们对你的客户易于阅读且有用。你的普通客户可能察觉不到直引号和弯引号之间的区别，但他们会注意到你的网站更容易读了，即使这只是潜意识里的。\n\
  \n此外，排版很有趣！\n\n**Q. 你在这一节课中列出了许多排版实体，但并没有列出所有的。有什么地方可以找到其他的排版实体吗？**\n\n**A.** 我在\
  \ [About.com](http://About.com) 网站上有一个 HTML 实体列表：[`webdesign.about.com/library/bl_htmlcodes.htm`](http://webdesign.about.com/library/bl_htmlcodes.htm)。你也可以在任何搜索引擎中搜索“HTML\
  \ entities”来查找更多。\n\n**Q. 在 Web 应用中嵌入自定义字体数量有限制吗？**\n\n**A.** 没有，没有物理限制。但你应该记住，每个嵌入的字体都是网站访问者必须下载的另一个文件。为了减少\
  \ HTTP 请求的数量，你可以使用 `data:` URL（指向数据块并用 `data:` 代替 `http:` 引用的 URL）并以这种方式嵌入字体。\n\n\
  从设计的角度来看，避免在任何单个网页上使用超过三个或四种字体（包括广告和图像中的文字）是一个良好的通用规则。页面上的字体类型越多，看起来就越杂乱，使用也越困难。\n\
  \n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前，尝试回答所有问题。请参阅 附录 A，“测验答案](#app01.html_app01)”。\n\
  \n#### 测验\n\n**1.** 六种通用字体族是什么？\n\n**2.** 列出排版中至少三种间距元素。\n\n**3.** 正确或错误。在文档正文中使用\
  \ (c) 表示版权声明是可以的。\n\n**4.** 列出五种网络字体格式中的四种。\n\n**5.** 嵌入字体的语法是什么？\n\n#### 练习\n\n\
  **1.** 浏览一个现有的网页（你自己的或网络上的）并寻找排版错误。寻找诸如错误的实体、糟糕的间距、字体过多等问题。决定你将如何修正这些问题，如果你正在处理自己的页面，请进行修正。\n\
  \n**2.** 在 Font Squirrel ([www.fontsquirrel.com](http://www.fontsquirrel.com)) 上找到一个你喜欢的字体并将其添加到网页中。\n\
  \n## 第 12 小：HTML5 中的音频和视频\n\n**本节课你将学习：**\n\n• 为什么 `<video>` 和 `<audio>` 标签很重要\n\
  • 新型多媒体元素提供哪些支持\n• 如何在 HTML 中添加可用的视频和音频\n• 如何强制旧版浏览器显示你的多媒体\n• 如何为多媒体创建自定义控件\n\n\
  HTML5 最著名的特性之一是 `<video>` 元素，此外新的 `<audio>` 元素。\n\n在这一节课中，你将学习如何使用它们在网页中放置视频和音频。你还将开始理解这些标签的原因以及它们与多媒体的关系。\n\
  \n#### 为什么使用 HTML5 而不是 Flash 处理音频视频\n\nHTML5 标准了 `<audio>` 和 `<video>` 元素，允许网页设计师以标准化的方式放置视频和音频。你可以将其想象为音频和视频就像图像文件一样。你可以用\
  \ `<img>` 元素在 HTML 中嵌入图像，现在你可以用 `<audio>` 和 `<video>` 嵌入音视频。\n\n关于 HTML5 视频是否会“击败”Flash\
  \ 有很多讨论，人们提供了许多应该（或不应该）的理由。使用 HTML5（而不是 Flash）处理媒体元素的优点包括：\n\n• 使用这些标签添加媒体更语义化。用户代理立即知道\
  \ `<audio>` 文件是声音。它必须进行更多分析才能确定 `<embed>` 或 `<object>` 元素中的声音文件是什么。\n• 你不受限于使用一个供应商来播放电影音频。\n\
  • 用户不需要插件即可播放电影音频。\n• 因为这些元素是 DOM 的一部分，你可以通过脚本和 CSS 对它们进行更多控制。\n• iOS 设备没有 Flash。\n\
  • 向网页添加音频简单得多。\n\n但使用 HTML5 也有一些缺点，主要是浏览器支持问题：\n\n• 与大多数其他 HTML5 功能一样，Internet Explorer\
  \ 8 和更低版本不支持 HTML5 `<video>` 和 `<audio>` 元素。\n• 你必须以至少两种或三种不同的格式对视频进行编码。HTML5 视频的问题并不是\
  \ HTML5 本身，而是编码器——视频为了查看而编码的方式。用户代理支持三种格式：\n\n• MP4 或 H.264\n• ogg/Theora\n• WebM\n\
  \nChrome 和 Android 支持所有三种。Firefox 和 Opera 支持 ogg/Theora 和 WebM。IE 9 支持 MP4 和 WebM（通过插件）。Safari\
  \ 和 iOS 支持 MP4。\n\n\n\n\n尽管如此，如果你认真地想要为移动设备创建带有视频和音频的 Web 应用程序，那么你不能仅使用 Flash。Flash\
  \ 作为桌面用户的备选方案是可以接受的，但对于移动端，你至少应该使用 `H.264` 和 `WebM` 进行编码。\n\n### 选择视频格式以获得最佳兼容性\n\
  \n如上一节所示，你应该使用主要的视频编码器（加上用于备选的 Flash）：`MP4` 或 `H.264`、`ogg/Theora` 以及 `WebM`。表 12.1\
  \ 显示了浏览器对这些视频编码器的支持现状。\n\n**表 12.1.** 视频编码器的浏览器支持\n\n![image](img/12tab01.jpg)\n\
  \n***\n\n**注意！** 检查你的服务器 MIME 类型\n\n如果你在 Web 服务器显示视频时遇到问题，可能是 MIME 类型未设置正确。如果你有访问\
  \ Apache `httpd.conf` 文件的权限，添加以下三行并重启服务器：\n\n```\nAddType video/mp4 .mp4\nAddType\
  \ video/ogg .ogv\nAddType video/webm .webm\n```\n\n如果你无法自行添加这些行，请联系你的主机提供商。\n\n\
  ***\n\n### MP4 或 H.264\n\n`H.264` 是主要由微软和苹果支持的编码器。`H.264` 文件具有 `.mp4` 扩展名。通过它，你可以创建质量良好且体积较视频。此外，有很多程序可以编码\
  \ `H.264` 视频。事实上，Flash 使用的就是 `H.264` 视频。\n\n问题是 `H.264` 编码器并不是免费的。它是由 `MPEG LA`\
  \ 拥有的许可产品。他们表示，只要该视频对终端用户免费，他们就不会对使用其编码器的互联网视频收取版税。但 Mozilla 组织（Firefox 的开发者）表示，由于专利问题以及他们对开源软件的关注，Firefox\
  \ 永远不会支持 `H.264` 视频。\n\n然而，如果你希望视频在 iPhone 和 iPad 上播放，你需要使用这种格式，因为 iOS 不支持任何其他格式。\n\
  \n这种格式的优点（除 iOS 支持外）是它可以创建较小且高质量的视频，并且有许多程序可以创建这种格式的视频。\n\n### ogg/Theora\n\n`Ogg/Theora`\
  \ 是 Firefox 支持的一种视频编码开放标准。`Ogg/Theora` 文件使用 `.ogg` 扩展名。它能生成高质量的视频，但它们通常比相同 `H.264`\
  \ 格式的视频体积大得多。`ogg/Theora` 视频可能比相同的 `H.264` 视频大 40%–50%。\n\n除了文件大小大，`ogg/Theora`\
  \ 的另一个问题是很难找到可以进行这种格式编码的良好程序。如 `Premiere` 和 `Final Cut Pro` 等专业级视频软件在不使用插件的情况下不支持它。\n\
  \n`ogg/Theora` 的优点是它是开源的且免费使用。\n\n### WebM\n\n`WebM` 使用谷歌拥有的 `VP8` 编码器。`WebM` 文件使用\
  \ `.webm` 扩展名。它具有非常好的压缩率并能创建高质量的视频。谷歌声称其质量比 `H.264` 好，但独立测试显示其与其相当或仅略优（根据《Streaming\
  \ Media》杂志 [www.streamingmedia.com/Articles/Editorial/Featured-Articles/WebM-vs.-H.264-A-Closer-Look-68594.aspx](http://www.streamingmedia.com/Articles/Editorial/Featured-Articles/WebM-vs.-H.264-A-Closer-Look-68594.aspx)）。\n\
  \n和 `ogg/Theora` 一样，`WebM` 可能很难编码，因为 `Premiere` 和 `Final Cut Pro` 等程序在不使用插件的情况下不支持它。\n\
  \n然而，也像 `ogg/Theora` 一样，`WebM` 是开源且免费使用的。\n\n### 选择音频编码器获得广泛支持\n\n与视频类似，你可以使用几种编码器来为网页创建音频：`MP3`、`Vorbis`\
  \ 和 `WAV`。表 12.2 显示了浏览器对这些音频编码器的支持现状。\n\n**表 12.2.** 音频编码器的浏览器支持\n\n![image](img/12tab02.jpg)\n\
  \n### MP3\n\n`MP3` 因为高压缩率和高质量而成为流行的声音格式。这些文件具有 `.mp3` 扩展名。也有许多编码器可以为你的音频文件创建这种格式。\n\
  \n然而，由于该格式与专利相关，在专利于 2017 年或之后过期之前，Firefox 等 Mozilla 浏览器将不会支持它。\n\n### Vorbis\n\n\
  `Vorbis` 也称为 `Ogg Vorbis`，是一种开源音频编码器。这些文件具有 `.ogg` 扩展名。它生成的高质量音频文件其体积比其他音频编码器小得多。\n\
  \n寻找可以将文件转换为 `Vorbis` 的商业程序可能很困难，但有很多在线转换器可以为你完成工作。\n\n### WAV\n\n`WAV` 是由微软和 IBM\
  \ 设计的编码器。`WAV` 文件具有 `.wav` 扩展名。它被广泛支持，但 `WAV` 文件通常是不压缩的，体积很大。\n\n### HTML5 媒体元素\n\
  \nHTML5 有几几个新元素你可以使用：\n\n- `<video>`——用于视频。\n- `<audio>`——用于音频。\n- `<source>`——用于媒体。\n\
  - `<track>`——用于轨道。\n\n以下是添加音频的方式：\n\n```html\n<audio>\n  <source src=\"sound.mp3\"\
  >\n</audio>\n```\n\n以下是添加视频的方式：\n\n```html\n<video>\n  <source src=\"movie.webm\"\
  >\n</video>\n```\n\n`<audio>` 和 `<video>` 元素的用处在于你不受限于一个 `<source>`。因此，即使 Firefox\
  \ 支持 WebM，你也可以添加多个 `<source>`：\n\n```html\n<video>\n  <source src=\"movie.mp4\"\
  >\n  <source src=\"movie.ogv\">\n  <source src=\"movie.webm\">\n</video>\n```\n\n\
  ***\n\n**注意！** iOS 与 HTML5 视频的问题\n\n如果你使用 `poster` 属性，iOS 3.2 将无法识别视频。`poster` 属性指向在视频未播放时显示的图像。如果你有大量的\
  \ iOS 3.2 用户，应该避免这样做。iOS 3.2 只会注意到第一个视频，所以如果你不将 MP4 列在第一个，视频将无法播放。这些错误在 4.0 版本中得到了修复，但没有升级的用户仍会遇到这些问题。\n\
  \n***\n\n如果你有字幕，你可以就可以包含 `<track>` 元素：\n\n```html\n<audio>\n  <source src=\"sound.mp3\"\
  >\n  <source src=\"sound.ogg\">\n  <source src=\"sound.wav\">\n  <track kind=\"\
  captions\" src=\"captions.srt\" srclang=\"en\">\n</audio>\n```\n\n***\n\n**你知道吗？**\
  \ 时间轨道格式没有标准\n\n字幕、说明和视频描述都是可以存储在 `<track>` 元素中的信息。但截至目前，不存在基于时间的数据的标准格式。正在考虑的格式包括\
  \ `SRT`、`WebVTT` 以及许多其他。在这些格式确定之前（可能通过浏览器实现），为你的媒体文件添加字幕或其他时间轨道将非常困难。\n\n***\n\n\
  最后，你可以为不支持媒体元素的浏览器包含备用文本和链接。这是一个为不支持 `<video>`元素的浏览器使用备用内容的示例：\n\n```html\n<video>\n\
  \  <source src=\"movie.mp4\">\n  <source src=\"movie.ogv\">\n  <source src=\"movie.webm\"\
  >\n  <track kind=\"subtitles\" src=\"subtitles.srt\"></track>\n  <p>如果你的浏览器不支持视频播放，请下载视频：<a\
  \ href=\"movie.mp4\">MP4</a>、<a href=\"movie.ogv\">ogg/Theora</a>、<a href=\"movie.webm\"\
  >WebM</a></p>\n</video>\n```\n\n\n\n\n\n每当你使用媒体标签时，你都应该考虑使用的属性是 `controls`。该属性为用户提供了控件，他们可以使用这些控件来启动、停止、快进和回退你的视频和音频文件，还可以关闭音量：\n\
  \n```html own<audio controls>\n```\n\n***\n\n### 注意！Android 的 HTML5 视频支持问题\n\n2.3\
  \ 之前的 Android 版本不喜欢在 `<source>` 元素上看到 `type` 属性。为了解决这个问题，请务必确保你的 H.264 视频以 `.mp4`\
  \ 扩展结尾。此外，2.2 及以下版本的 Android 不支持 `controls` 属性。有大量使用 2.2 及更低版本的用户，你需要包含自己的界面控件。这些\
  \ Bug 在 2.3 版本中已经修复。\n\n***\n\n***\n\n***\n\n### 动手实践：在你的 HTML 中添加音乐文件\n\n使用 `<audio>`\
  \ 元素向网页添加音乐非常简单。在本次练习中，你会将音乐保存为 MP3、WAV 和 Vorbis 格式，以便获得良好的浏览器支持。\n\n1. 录制你的音频文件并将其保存为\
  \ MP3 文件。\n2. 将其转换为 WAV 和 Vorbis。\n3. 将所有三个音频文件上传到你的 Web 服务器。\n4. 在你的 HTML 中添加 `<audio>`\
  \ 元素：\n\n```html\n<audio controls>\n```\n\n5. 包含三个指向每个文件的 `<audio>` 元素：\n\n```html\n\
  <source src=\"Slap Happy.mp3\">\n<source src=\"Slap Happy.ogg\">\n<source src=\"\
  Slap Happy.wav\">\n```\n\n6. 为不支持 `<audio>` 的浏览器添加备用文本：\n\n```html\n<p>您的浏览器不支持音频播放，请下载文件：\n\
  <a href=\"Slap Happy.mp3\">MP3</a></a>,\n<a href=\"Slap Happy.ogg\">Vorbis</a></a>,\n\
  <a href=\"Slap Happy.wav\">WAV</a></a>\n```\n\n7. 添加一个 Modernizr 脚本，仅为不符合标准的浏览器显示该文本：\n\
  \n```javascript\n<script>\nif (!Modernizr.audio) {\n    document.write('<p>您的浏览器不支持音频播放，\n\
  下载文件 <a href=\"Slap Happy.mp3\">MP3</a></a>,\n<a href=\"Slap Happy.ogg\">Vorbis</a></a>,\n\
  <a href=\"Slap Happy.wav\">WAV</a></a>');\n}\n</script>\n```\n\n8. 关闭 `<audio>`\
  \ 元素：\n\n```html\n</audio>\n```\n\n不要忘记在尽可能多的浏览器中进行测试。\n\n***\n\n### 扩展媒体功能的实用属性\n\
  \n到目前，你使用的唯一属性是 `<video>` 和 `<audio>` 上的 `controls` 属性，以及 `<source>` 元素上的 `src`\
  \ 属性。然而，你可以使用许多其他属性来更深入地控制你的视频。\n\n#### 音频和视频属性\n\n几个属性可以同时用于 `<audio>` 和 `<video>`\
  \ 元素：\n\n• **`autoplay`—**这会告诉浏览器在流数据足够播放而无需停止时就开始播放歌曲或视频。这是一个没有值的属性，但如果你在编写 XHTML，你会写成\
  \ `autoplay=\"autoplay\"`。\n\n***\n\n### 注意！自动播放会赶走你的用户\n\n让用户在不阅读或购买任何东西的情况下离开页面的快速方法之一，就是让他们进入页面时音乐或视频自动开始。记住，他们可能已经开启了音乐，或者可能正处于声音不恰当的环境中。请极其谨慎地使用\
  \ `autoplay` 属性。\n\n***\n\n• **`preload`—**`preload` 属性允许向用户代理提供关于应该尝试进行什么类型预加载的提示。值为\
  \ `none`、`metadata` 和 `auto`。`none` 属性告诉浏览器不要尝试预加载；`metadata` 告诉它获取时长、轨道列表、尺寸和其他元信息；`auto`\
  \ 则建议尝试预加载整个流。留空值等同于编写 `preload=auto`。\n\n• **`controls`—**提供用于控制流的用户界面。该属性没有值。\n\
  \n• **`loop`—**`loop` 属性告诉浏览器在到达末尾时重启流。该属性没有值。\n\n• **`mediagroup`—**这告诉用户代理将几个流（音频、视频或两者）链接在一起。例如，一个视频可能有一个独立的音频轨道和一个手语翻译。通过赋予它们相同的\
  \ `mediagroup` 标识符可以将它们链接起来。\n\n• **`src`—**如果你的流只有一个数据源，这是 `<source>` 元素的替代方案。\n\
  \n#### 视频\n\n`<video>` 元素还有几个你可以用于改进视频的其他属性：\n\n• **`poster`—**这是一个在没有视频可用时显示的图像\
  \ URL。此选项是提供视频预览以诱导人们观看的极佳方法。否则，他们只会看到空白或黑色的屏幕。\n\n• **`height` 和 `width`—**以 CSS\
  \ 像素设置视频的高度和宽度。你可以使用这些控件来调整视频的大小，但你将无法更改宽高比例。\n\n• **`muted`—**这允许你将音频默认状态设置为静音。该属性最近才被添加到规范中，许多浏览器还不支持它。\n\
  \n#### 源属性\n\n`<source>` 元素有三个属性：`src`、`media` 和 `type`。`src` 属性是言自自明的。`media` 和\
  \ `type` 属性较为复杂。`type` 属性为浏览器提供了更多关于视频类型的信息。如果浏览器根据你列出的类型认为无法加载文件，它将不会下载该文件，从而提高页面速度。\n\
  \n`type` 属性具有以下格式：\n\n`type='MIME 类型; codecs=\"视频编码器,音频编码器\"'`\n\nMP4、Ogg 和 WebM\
  \ 的 MIME 类型为\n\n• **H.264 或 MP4—**`video/mp4`\n• **ogg/Theora—**`application/ogg`,\
  \ `video/ogg`\n• **WebM—**`video/webm`\n\n以下是为三种格式视频编写 `<source>`元素的方式：\n\n```html\n\
  <source src=\"video.mp4\" type='video/mp4; codecs=\"vc1.42E01E, mp4a.40.2\"'>\n\
  <source src=\"video.ogv\" type='video/ogg; codecs=\"theora, vorbis\"\n\n<source\
  \ src=\"video.webm\" type='video/webm; codecs=\"vp8, vorbis\"'>\n```\n\n#### 轨道属性\n\
  \n`<track>` 元素使用属性来确定轨道文件的源、轨道文件类型等：\n\n• **`src`—**轨道文件的 URL。\n• **`srclang`—**字幕轨道的语言。\n\
  • **`label`—**轨道的易读标题。\n\n\n\n\n\n- `default`—该属性定义了当用户偏好没有指定其他轨道时，应启用的备用轨道。该属性没有值。\n\
  - `kind`—五种不同类型的定时轨道如下：`subtitles`（字幕），提供对话的翻译；`captions`（说明字幕），提供视频声音和对话的转录，包括音效和音乐提示；`descriptions`（描述），对视频视觉组件的文本描述；`chapters`（章节），用于章节标题；以及\
  \ `metadata`（元数据），用于视频中脚本点的元内容。\n\n## 为 Internet Explorer 创建回备方案\n\n大多数开发者抵制使用新的\
  \ `<video>` 和 `<audio>` 元素的首要原因是 IE 8 及更低版本不支持这些元素。为了让你的声音和电影在这些浏览器中播放，你需要某种回备方案。\n\
  \n通过在`<video>` 或 `<audio>` 元素内部包含 `<object>` 元素，你可以为不支持这些元素的浏览器提供回备，因为它们会忽略无法识别的元素，而是直接播放对象文件。支持\
  \ `<video>` 和 `<audio>` 元素的浏览器会找到可以播放的源，并忽略 `<object>`。如果你仍然遇到问题，可以将 `<object>`\
  \ 包裹在 Modernizr 脚本中以检查对 HTML5 支持。\n\n对于视频，可以使用任何喜欢的 Flash 视频播放器。Flowplayer ([`flowplayer.org/`](http://flowplayer.org/))是一个很好的选择，因为它简单易且只需要三个额外的文件。对于音频，你可以使用已经创建的\
  \ WAV 文件；只需将其嵌入 `<object>` 元素中（将 `FILE.wav` 更改为你的文件名）：\n\n```html\n<object>\n  \
  \  <param name=\"autostart\" value=\"false\">\n    <param name=\"src\" value=\"\
  FILE.wav\">\n    <param name=\"autoplay\" value=\"false\">\n    <param name=\"controller\"\
  \ value=\"true\">\n    <embed src=\"FILE.wav\" controller=\"true\" autoplay=\"false\"\
  \n          autostart=\"false\" type=\"audio/wav\">\n</object>\n```\n\n## 尝试一下：添加带有\
  \ Flash 回备的视频文件\n\n在网页中添加视频非常简单，在这个尝试中，你将学习如何为不支持 HTML5 视频的浏览器包含 Flash 回备选项。\n\n\
  1. 创建视频并将其转换为四种格式：MP4、ogg/Theora、WebM 和 FLV。\n2. 将它们保存到你的 Web 目录并全部到到 Web 服务器。\n\
  3. 在页面中添加 HTML5 视频：\n```html\n<video controls height=\"600\" width=\"800\">\n```\n\
  \n4. 为 MP4、Ogg 和 WebM 添加源文件——确保 MP4 放在第一个：\n```html\n<source src=\"Shasta.mp4\"\
  >\n<source src=\"Shasta.theora.ogv\">\n<source src=\"Shasta.webm\">\n```\n\n5. 在你的网站上安装\
  \ Flowplayer（访问 [`flowplayer.org/download/index.html`](http://flowplayer.org/download/index.html)\
  \ 下载）。\n6. 将你的 Flowplayer 文本指向你创建的 FLV 文件：\n\n```html\n<!-- fallback to Flowplayer:\
  \ -->\n<a\n    href=\"Shasta.flv\"\n    style=\"display:block;width:800px;height:600px\"\
  \n    id=\"player\">\n</a\n<script>\n    flowplayer(\"player\", \"flowplayer/flowplayer-3.2.7.swf\"\
  );\n</script>\n```\n\n7. 不要忘记将 Flowplayer 脚本添加到文档的 head 部分：\n```html\n<script src=\"\
  flowplayer/flowplayer-3.2.6.min.js\"></script>\n```\n\n8. 为你的视频添加文本链接，以便即使是旧版浏览器仍然下载该文件：\n\
  ```javascript\n<script>\nif (!Modernizr.video) {\n    document.write('<p>您的浏览器不支持视频播放，\n\
  下载视频：\n<a href=\"Shasta.mp4\">MP4</a>, <a href=\"Shasta.theora.ogv\">ogg/Theora</a>,\
  \ <a href=\"Shasta.webm\">WebM</a>');\n}\n</script>\n```\n\n9. 关闭视频元素：\n```html\n\
  </video>\n```\n\n你可以在 [www.html5in24hours.com/examples/media-examples.html](http://www.html5in24hours.com/examples/media-examples.html)\
  \ 看到此视频的运行效果。\n\n#### 使用 API 方法创建自定义控件\n\n在你开始测试视频后，你会发现默认控件在每个浏览器和设备上看起来都不同。图 12.1\
  \ 显示了同一个视频在四个不同浏览器中的控件。如你所见，控件在每个浏览器中看起来都不同，如果你尝试跨浏览器保持统一的外观，这可能会显得很突兀。\n\n**图 12.1.**\
  \ Chrome、Safari、Firefox 和 IE 9 中同一个视频的控件（从上到下）。\n\n![image](img/12fig01)\n\n但通过\
  \ DOM API，你可以编写自己的控件：\n- `play()`—播放媒体\n- `pause()`—暂停媒体\n\n要使用 play 和 pause，你需要从媒体元素中移除\
  \ `controls` 属性并使用 JavaScript：\n\n```html\n<video height=\"600\" width=\"800\">\n\
  ```\n\n要使用 play 和 pause，你需要监听 `play()` 和 `pause()` 事件。记住用户可以通过点击以下内容来播放或暂停：\n\n\
  ```javascript\n<script>\nvar video = document.getElementsByTagName('video')[0];\n\
  video.onpause = video.onplay = function(e) {\n    playPause.value = video.paused\
  \ ? 'Play' : 'Pause';\n}\n\nfunction playPause() {\n    if (video.paused || video.ended)\
  \ {\n        video.play();\n    } else {\n        video.pause();\n    }\n}\n</script>\n\
  ```\n\n```html\n<button value=\"Play/Pause\" id=\"playPause\" onclick=\"playPause()\"\
  >\n    <img src=\"images/PlayPause.png\" width=\"26\" height=\"28\" alt=\"Play/Pause\"\
  >\n</button>\n```\n\n你可以利用视频功能做更多事情。你可以添加音量和静音按钮、快进等。然而，在页面上获取自定义视频播放器最简单的方法是使用预制的视频播放器。有很多免费的播放器可供选择。Philip\
  \ Bräunlich 有份播放器列表([`praegnanz.de/html5video/index.php`](http://praegnanz.de/html5video/index.php))，提供了许多详细信息，如许可证、使用的\
  \ JavaScript 库、是否具有 Flash 回备、是否支持 iOS 和全屏等。他还充分评估了每个工具集成和主题化的难易性。\n\n\n\n\n\n答.\
  \ 如果你知道该解码器的 MIME 类型，你就可以将其作为源文件包含在媒体中。不过，你应该意识到，无法保证浏览器或用户代理会知道如何处理它。\n\nQ. 我真的有必要将我的视频保存成许多格式吗？\n\
  \n答. 这是在使用 HTML5 的 `<video>` 和 `<audio>` 元素时最常见的反对之一。但事实是，如果你想让你的视频看起来很专业，你就必须创建多个版本。例如，当你访问\
  \ Apple 电影预告片网站时，每个预告片都提供几种不同的尺寸。访问者可以选择他们想要查看的一个。但通过 HTML5 和媒体查询，你可以帮助用户获取适用于其浏览器的最佳视频，而他们除了点击“播放”之外无需进行任何操作。他们不需要猜测；你只需为他们提供正确的版本即可。但如果你只有一个选项，你就无法做到这一点。\n\
  \n### 工作坊\n\n本工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前，请尝试回答所有问题。请参阅附录 A“测验答案”获取答案。\n\n####\
  \ 测验\n\n1.** 三种常用的音频解码器是哪些？\n\n2.** Internet Explorer 9 支持哪些视频解码器？Android 呢？\n\n\
  3.** 写出在 HTML 中包含视频源的两种方法。\n\n4.** 正或错。`loop` 属性仅对 `<video>` 元素有效。\n\n5.** `<source>`\
  \ 元素的 `type` 属性的格式是什么？\n\n6.** `<audio>` 元素上的回备方案是如何工作的？\n\n#### 练习\n\n1. 在网页中添加音频文件。确保它能在尽可能多的浏览器中播放。\n\
  \n2. 选择一个视频播放器（也许可以来自 [`praegnanz.de/html5video/index.php`](http://praegnanz.de/html5video/index.php)），并为你的应用程序添加一些\
  \ HTML5 视频。测试确保它在 iOS 和 Android 上都能播放。\n\n## 第 13 小时. HTML5 表单\n\n#### 学习内容\n- 如何在表单字段中包含提示文本\n\
  - 如何添加简单属性使表单更易用\n- 如何为表单字段创建内容列表\n- 如何处理新的输入类型\n- 针对不支持 HTML5 表单的浏览器的选项\n- 如何让浏览器验证表单\n\
  - 如何构建、样式化和管理 HTML5 表单\n\nHTML 表是任何网站的重要部分，在 Web 应用程序中，它们通常是让应用具有交互性的部分。然而，HTML\
  \ 表单可能很难构建也难以用用。HTML5 试图解决这个问题。\n\n在这一小时中，你将学习 HTML5 表单的一些新功能，这些功能使它们变得更易用。你将学习更多关于你现在就可以用来改进表单的输入类型。此外，你将学习帮助你确保传递的数据有效且格式正确的\
  \ HTML5 属性。\n\n在本小时的最后一部分，你将学习创建、设计和管理 HTML5 表单的步骤。\n\n### HTML5 表单的新可用性功能\n\nHTML5\
  \ 的优点之一是它充分考虑了表单给设计者和用户带来的困难。HTML5 表单的许多功能是你已经可以通过脚本实现的，但现在它们被内置在 HTML 中，这减少了页面加载时间并使构建表单变得更容易。\n\
  \n让表单对用户更容易两个新功能是 `placeholder text` 和 `autofocus`。将 `autocomplete` 结合 `datalists`\
  \ 有助于让表单传递的数据更加一致和准确。\n\n#### Placeholder Text\n\n占位文本是表单中一个非常有用的功能。它提供了有关表单字段或数据格式格式的信息，但不会干扰表单字段中的输入内容。图\
  \ 13.1 显示了带有占位文本三个表单字段。文本为浅灰色，当字段获得焦点时，文本会消失。\n\n**图 13.1.** iPad 上表单中的占位文本。\n\n\
  ![image](img/13fig01.jpg)\n\n#### 顺便说：使用 Placeholder 代替字段标签\n\n你可以使用占位文本的一种方法是作为表单字段标签。你只需在占位文本中放入每个字段名称。你可以在\
  \ [www.html5in24hours.com/examples/form-placeholder-labels.html](http://www.html5in24hours.com/examples/form-placeholder-labels.html)\
  \ 看到此示例。\n\n要在表单字段中添加占位文本，请向元素添加 `placeholder` 属性，并将你想作为占位的文本作为值：\n\n```html\n<input\
  \ type=\"text\" id=\"name\" placeholder=\"Fill in your full\">\n```\n\n对于不支持 `placeholder`\
  \ 属性的浏览器，你可以使用 JavaScript 来模拟。最简单的方法是使用以下代码：\n\n```html\n<input type=\"text\" value=\"\
  Fill in your full\" onfocus=\"if(this.value=='Fill in your full'){this.value=''}\"\
  \ onblur=\"if(this.value==''){this.value='Fill in your full'}\">\n```\n\n\n\n`autofocus`\
  \ 属性可能会让你很想在网站上的每个表单上都加上它，但这样做可能会在不增加任何价值的情况下引起读者的反感。你应该只在页面主要关注点的表单上使用 `autofocus`——例如联系页面。不要将该属性添加到网站网站每个页面都出现的表单中，例如时事订阅或搜索框。\n\
  \n***在你设置好一个带有 `autofocus` 的字段后，确保它即使在不支持该属性的浏览器中也能聚焦是非常简单的：\n\n```html\n<input\
  \ type=\"text\" id=\"name\" autofocus>\n```\n\n...\n\n```html\n<script>\nif (!Modernizr.input.autofocus)\
  \ {\n    document.getElementById('name').focus();\n}\n</script>\n```\n\n`autofocus`\
  \ 属性在 `<button>`、`<input>`、`<keygen>` 和 `<select>` 中有效。它在 Chrome 3、Firefox 4、Opera\
  \ 10 和 Safari 4 中可以工作。\n\n## 自动完成与数据列表 (Autocomplete and Datalists)\n\n`autocomplete`\
  \ 属性和 `<datalist>` 元素对用户和 Web 开发人员都很有用。当用户有一个选择列表可以开始选择时，他们可以更容易填写表单字段，而开发者获得的数据也更一致，因为选择列表有助于限制选项。此外，这些类型的表单字段取代了\
  \ HTML 4 表单中的两个字段：一个带有“其他，请说明”最终选择的下拉列表（`<select>` 元素）和一个用于收集其他数值的文本输入字段。使用带有选项的\
  \ `<datalist>`，如果用户想要的选项不在其中，他们可以直接在字段中输入它。图 13.2 显示了数据列表在文本字段上的外观。\n\n**图 13.2.**\
  \ 带有数据列表的简单文本字段。\n\n![image](img/13fig02.jpg)\n\n`autocomplete` 属性是一个开关。如果在一个字段上设置了它（无论是只写为\
  \ `autocomplete` 还是 `autocomplete=yes`），那么字段选项会在用户输入时进行自动完成。如果你将其设置为 `autocomplete=no`，则字段在用户输入时将不会自动完成。\n\
  \n带有自动完成功能的数据列表包含三个部分：\n\n- 带有 `list` 和 `autocomplete` 属性的输入字段\n- `<datalist>` 元素\n\
  - `<datalist>` 内部的 `<option>` 元素\n\n这是一个用户输入时将自动完成的数据列表示例：\n\n```html\n<input type=\"\
  text\" id=\"animal\" list=\"animals\" autocomplete>\n\n<datalist id=\"animals\"\
  >\n    <option value=\"bees\">\n    <option value=\"birds\">\n    <option value=\"\
  cats\">\n    <option value=\"cows\">\n    <option value=\"dogs\">\n    <option value=\"\
  fish\">\n    <option value=\"horses\">\n    <option value=\"snakes\">\n</datalist>\n\
  ```\n\n对于大多数开发者来说，`autocomplete` 和 `<datalist>` 的问题在于它们仅在 Opera 中有效。但通过使用 jQuery\
  \ UI ([`jqueryui.com/`](http://jqueryui.com/))，你可以为不支持它的浏览器创建一个回退方案。\n\n***\n\n\
  ### 动手尝试一下：使用 jQuery UI 作为自动完成数据列表的回退方案\n\njQuery UI 许多许多功能可以作为 HTML5 表单的回退选项，因此了解如何使用它是一项重要的工具。要使用它，请遵循以下步骤：\n\
  \n1. 构建你的 jQuery UI 并从 [`jqueryui.com/download`](http://jqueryui.com/download) 下载。\n\
  \n2. 将脚本和 CSS 添加到你的 HTML 中：\n\n```html\n<link rel=\"stylesheet\" href=\"jquery-ui-1.8.13.custom.css\"\
  >\n<script type=\"text/javascript\" src=\"jquery-ui-1.8.13.custom.min.js\">\n</script>\n\
  ```\n\n3. 编写自动完成的 jQuery 脚本并将其放在 HTML 的底部：\n\n```html\n<script>\n$(document).ready(function(){\n\
  if (!Modernizr.input.autocomplete) {\n    var data = [\"bees\", \"birds\", \"cats\"\
  , \"cows\", \"dogs\", \"fish\", \"horses\", \"snakes\" ];\n    $(\"#animal\").autocomplete({\n\
  \        source: data\n    });\n}\n});\n</script>\n```\n\n注意，自动完成函数被 Modernizr 检查包中。因此，该脚本只有在浏览器不支持\
  \ `autocomplete` 属性时才会激活。\n\n你可以在 `<form>` 和 `<input>` 上使用 `autocomplete` 属性。如果它位于\
  \ `<form>` 元素上，那么该表单中的所有适用字段将进行自动完成（或不）。\n\n***\n\n#### HTML5 输入类型\n\nHTML5 为 `<input>`\
  \ 元素增加了 13 种新类型。这些类型很棒的地方在于，即使没有回退选项，它们也会每个支持表单的浏览器中运行。如果浏览器不识别该类型，它将显示为文本输入字段，因此使用这些表单元素没有任何损失。\n\
  \n### 数字类型 (Number Types)\n\n现在，如果你需要从用户那里收集数字，你有三种方法：\n\n- `<input type=number>`\n\
  - `<input type=range>`\n- `<input type=tel>`\n\n`number` 类型正如你想象的那样。然而，在 Web 表单中要求数字比你想象的要复杂。例如，17、−6、4\
  \ 1/8 和 π 都是数字，但如果你想让某选择 0 到 100 之间 3 的倍数呢？使用标准的文本输入框，他们可以输入之前列出的任何数字，你必须使用 JavaScript\
  \ 或服务器端代码对其进行验证，以确保他们提交的是你想要的。\n\n使用 `<input type=number>` 字段，你可以指定最小值、最大值和值之间的步长：\n\
  \n```html\n<input type=number id=\"multi3\" min=0 max=100 step=3 value=33>\n```\n\
  \n正如图 13.3 所示，移动设备不会像桌面浏览器那样显示带有 `min`、`max` 和 `step` 属性的 `number` 类型，但在移动设备上填写数字要容易得多，因为浏览器在数字字段中默认显示数字键盘。\n\
  \n**图 13.3.** Android Galaxy Tab 10.1（顶部）和 Safari（底部）上的数字字段。\n\n![image](img/13fig03.jpg)\n\
  \n***\n\n**注意！**：不要跳过验证\n\n当你使用新的输入类型时，请记住在大多数情况下，用户输入错误的值仍然可能的。如果你需要值始终一致，你需要在提交之前对表单进行验证。你应该将这些输入字段视为帮助用户提交正确值的提示，而不是强制执行的规则。这也能帮助你处理显示文本字段而不是新功能的浏览器。\n\
  \n***\n\n如果你需要一个数字，但它不需要精确呢？与其使用 `number` 类型，你可以使用 `range` 类型。这在屏幕上放置了一个滑块供读者选择数字，但没有精确的刻度。图\
  \ 13.4 显示了如下所示范围输入字段：\n\n**图 13.4.** Safari 中的范围字段。\n\n![image](img/13fig03.jpg)\n\
  \n你有多喜欢冰淇淋？<br/>\n\n没有比<input type=range id=\"icecream\" min=0 max=10 value=5>任何东西\n\
  \n最后一个数字输入类型是 `tel` 类型，它允许你收集电话号码。在桌面浏览器中，这种类型不会更改字段的外观，但在移动设备上非常有用。正如图 13.5 所示，`tel`\
  \ 类型在手机上会打开数字盘，使得输入电话号码更容易。这样编写电话字段（添加了占位符文本以使示例更好看）：\n\n```html\n<input type=tel\
  \ id=phonenumber placeholder=\"(xxx) xxx-xxxx\">\n```\n\n**图 13.5.** iPod touch\
  \ 上的电话字段。\n\n![image](img/13fig05.jpg)\n\n正如前面提到的，你可以在没有任何回退方案的情况下使用这些输入类型，它们在所有不受支持的浏览器中都会正常显示为文本框。然而，如果你想获得数字计数器或范围滑块，将需要使用脚本。对于电话号码，你应该验证给出的数字是否符合电话格式，这将在本章稍后的“表单验证”部分进行讨论。Nettuts+\
  \ 有一个关于如何构建具有范围滑块和数字计数器回退的跨浏览器表单的精彩教程。\n\n\n\n\n日期和时间是 Web 表单常见的字段，HTML5 提供了六种特定的输入类型来收集这些信息：\n\
  \n- `<input type=datetime>`\n- `<input type=datetime-local>`\n- `<input type=date>`\n\
  - `<input type=month>`\n- `<input type=week>`\n- `<input type=time>`\n\n`date`、`month`、`week`\
  \ 和 `time` 类型是非常自言自明的。日期以以下格式存储：\n\nYYYY-MM-DD\n\n月份格式相同，只是没有了日期：\n\nYYYY-MM\n\n\
  周以年份的形式发送，后面紧跟周数：\n\nYYYY-W##\n\n时间以以下格式发送：\n\nHH:MM\n\n`datetime` 和 `datetime-local`\
  \ 类型提供了更具体的日期，包括日期和时间。两者唯一的区别在于，`datetime` 包含了时区信息，而 `datetime-local` 假设使用本地时区，因此不包含该部分信息。这些类型的数据格式为：\n\
  \n- `datetime` (`YYYY-MM-DDTHH:MMZ+00:00`)\n- `datetime-local` (`YYYY-MM-DDTHH:MM`)\n\
  \n这些输入类型最令人沮丧的方面是，目前虽然 Safari 5 会创建一个将日期按这些格式放置的选择器，但唯一提供真实日期选择器的浏览器是 Opera 9。图\
  \ 13.6 显示了 Opera 日期选择器的样式。\n\n**图 13.6.** Opera 中的日期选择器。\n\n![image](img/13fig06.jpg)\n\
  \n不过，你可以使用 jQuery UI 作为非常棒的替代方案。在按照“自动完成和数据列表”章节详细将 jQuery UI 添加到你的页面后，只需将以下脚本添加到\
  \ HTML 的底部即可：\n\n```html\nif (!Modernizr.inputtypes.date) {\n    $(function() {\n\
  \        $( \"#d\" ).datepicker({ dateFormat: 'yy-mm-dd' });\n    });\n}\n```\n\n\
  将 `#d` 更改为你日期输入字段的 ID。你可以在 [`jqueryui.com/demos/datepicker/`](http://jqueryui.com/demos/datepicker/)\
  \ 了解更多关于 jQuery UI 日期选择器的信息。\n\n## 电子邮件、URL、颜色和搜索框类型\n\n剩余四个类型涵盖了其他标准表单字段：\n\n-\
  \ `<input type=email>`\n- `<input type=url>`\n- `<input type=color>`\n- `<input\
  \ type=search>`\n\n`email` 和 `url` 字段看起来和普通文本字段没有太大，除非你在移动设备上查看它。移动浏览器会更改输入键盘以反映请求的输入类型。图\
  \ 13.7 显示了移动设备上的 URL 输入字段。对于电子邮件输入，`@` 字符和句号更加明显。对于 URL 输入，iOS 添加了一个用于输入 “.com”\
  \ 加上斜杠的按钮，这通常是深层两级的结构，位于最前面。\n\n**图 13.7.** iPad 上的 URL 字段。\n\n![image](img/13fig07.jpg)\n\
  \nURL 和电子邮件字段在移动设备上极其有用。不识别这些字段的浏览器只会显示文本字段，这看起来与兼容浏览器上的 URL 和电子邮件字段没有区别。但兼容的浏览器会执行诸此类操作，例如验证文本是否为电子邮件地址或\
  \ URL，并且移动设备会更改键盘以便于添加电子邮件地址和 URL。如果你正在将 HTML 4 表单转换为 HTML5，添加 URL 和电子邮件字段应该是你的首要任务。\n\
  \n`color` 类型为支持它的浏览器添加了颜色选择器。目前，只有 Opera 支持。表单会交付六位 RGB 颜色数字。图 13.8 显示了 Opera 上的颜色选择器。\n\
  \n**图 13.8.** Opera 中的颜色选择器。\n\n![image](img/13fig08.jpg)\n\n`search` 类型将字段更改得看起来更像典型的搜索框，具有圆角、内嵌边框、内边距等。图\
  \ 13.9 显示了一个搜索类型字段。\n\n**图 13.9.** Safari 中带有结果（由放大镜指示）和自动保存功能的搜索字段。\n\n![image](img/13fig09.jpg)\n\
  \n### 你知道吗？显示搜索结果\n\nWebKit 浏览器一个未记录说明的特性是 `<input type=search>` 字段上的 `results`\
  \ 属性。当你使用它时，Chrome、Safari、Android 和 iOS 浏览器将显示一个小放大镜，并下拉显示之前的搜索记录。通过添加值 `results=5`\
  \ 可以限制结果数量。你使用 `autosave` 属性来跨页面加载保存值。\n\n### WebKit 和搜索字段样式\n\n当你创建一个 `<input type=search>`\
  \ 字段时，WebKit 浏览器会有许多自动添加到你的搜索字段中的样式，例如：\n\n- 圆角\n- 内嵌边框\n- 字体字体类型的取消按钮\n\n事实上，WebKit\
  \ 是如此严格，以至于即使使用 `!important` 也无法更改某些样式。你无法轻易更改：\n\n- 内边距\n- 字体族\n- 字体大小\n- 边框\n\
  - 背景颜色\n\n如果你更改了这些样式，你的搜索框在非 WebKit 浏览器（包括 iPad 等浏览器）中看起来将完全不同。因此，保持这些样式不变是一个好主意。如果你想关闭搜索外观，可以使用一些\
  \ WebKit 特有的样式：\n\n```css\ninput[type=search] {\n    -webkit-appearance: none;\n\
  }\n\ninput[type=\"search\"]::-webkit-search-decoration,\ninput[type=\"search\"]::-webkit-cancel-button\
  \ {\n    display: none;\n}\n```\n\n### 其他新表单元素\n\nHTML5 提供了其他表单元素，包括 `<meter>`、`<progress>`、`<keygen>`、`<output>`、`<menu>`\
  \ 和 `<command>`。`<meter>` 和 `<progress>` 元素被认为是关联元素。[使用 HTML5 添加语义化 ch09.html) 讨论了它们如何为内容提供额外的含义。\n\
  \n#### 密钥生成表单字段\n\n`<keygen>` 并不是输入类型，但它是一个新的表单字段，可以使用它生成密钥对并提交公钥。当提交带有 `<keygen>`\
  \ 元素的表单时，私钥存储在本地存储器中，公钥会被打包。\n\n你可以使用这个简单的表单测试它：\n\n```html\n<form>\n    <keygen\
  \ name=\"pubkey\" challenge=\"random-characters\">\n    <input type=\"submit\" name=\"\
  createcertificate\" value=\"Generate\">\n</form>\n```\n\n该元素支持除 IE 外的所有主流浏览器。微软可能永远不会实现\
  \ `<keygen>` 支持。如果你需要处理安全的密钥对且不需要支持 IE，这个元素是有用的。\n\n#### 表单输出元素\n\n`<output>` 元素提供计算结果。虽然它可以是字面计算，但它最有效的用法是在页面内显示动态结果。例如，一个常见的动态表单字段显示文本框中输入的字符数。在\
  \ HTML5 之前，这些字符会被放置在 `<div>` 或 `<span>` 或另一个 `<input>` 字段中。然而，你可以这样使用 `<output>`\
  \ 元素：\n\n```html\n<form>\n    <textarea id=\"ta\"></textarea>\n    <output id=\"\
  chars\" onforminput=\"characterCount('ta','chars');\"></output>\n</form>\n\n<script>\n\
  function characterCount(inputFieldId, infoBlockId) {\n    var characters = document.getElementById(inputFieldId).value.length;\n\
  \    document.getElementById(infoBlockId).innerHTML = characters;\n}\n</script>\n\
  ```\n\n遗憾的是，这个元素仅在 Chrome 11 和 Opera 11 中有效。如果你希望它在其他浏览器中使用，你需要退回到使用 `<span>` 或\
  \ `<input>` 等解决方案。\n\n#### 命令菜单列表\n\n在 HTML 4 中，`<menu>` 元素被用来创建列表，但它的用法就像 `<ul>`\
  \ 元素一样，因此被废弃了。但在 HTML5 中它被重新引入用于在右键菜单、工具栏和表单控件中创建命令列表。简单的菜单看起来如下：\n\n```html\n<form>\n\
  \    <menu label=\"my tools\" type=\"context\">\n        <li><input type=\"checkbox\"\
  \ value=\"1>1</li>\n        <li><input type=\"checkbox\" value=\"2>2</li>\n    </menu>\n\
  </form>\n```\n\n\n\n```html\n<li><input type=checkbox value=3>3\n</menu>\n</form>\n\
  ```\n\n你可以创建三种类型的 `<menu>`：`list`（默认）、`context`（上下文菜单）和 `toolbar`（工具栏）。在列表中，你可以包含\
  \ `<li>` 或 `<command>` 元素。\n\n`<command>` 元素代表命令。类型的 `<command>` 元素为：\n\n- `<command\
  \ type=command>` 或 `<command>`\n- `<command type=checkbox>`\n- `<command type=radio>`\n\
  \n`command` 类型表示带有关联操作的命令。`checkbox` 类型提供一个可以开启和关闭的选项。`radio` 则允许在一组项目从中选择其中一个。\n\
  \n目前没有任何浏览器支持 `<command>` 元素。`<menu>` 元素的行为仍然像 `<ul>` 列表一样。\n\n#### 表单验证\n\nHTML5\
  \ 表单最实用的功能之一就是验证。现在，你可以为必填字段设置规则，甚至检查格式是否有效（例如数字字段中的数字、有效的电子邮件地址等）。\n\n当然，使用脚本来检查电子邮件地址等内容几乎是徒劳且令人沮丧的。要编写一个既能匹配所有可能的电子邮件地址格式，又不匹配非电子邮件地址内容的正则表达式是非常困难的。事实上，官方标准正则表达式（`RFC\
  \ 2822`）长度为 426 个字符。\n\n相反，通过 HTML5，你可以让浏览器为你完成这项工作，顺便让浏览器验证 URL 和数字。\n\n在 Opera\
  \ 9、Firefox 4 和 Chrome 10 中，只需添加电子邮件或 URL 字段，这些浏览器就会验证电子邮件地址和 URL，无需你进行任何其他操作。\n\
  \n但在某些表单中，你不想进行验证，可能是因为正在测试或其他原因。这时 `novalidate` 属性派上用场了。只需将其添加到 `<form>` 元素中，表单就不会验证：\n\
  \n```html\n<form novalidate>\n```\n\n最常见的表单验证类型是必填字段。在 HTML5 中，标记字段为必填需要添加 `required`\
  \ 属性：\n\n```html\n<input type=text id=name required>\n```\n\n**注意！**：始终要在服务器端也进行验证\n\
  \n在浏览器内部进行本地验证是一个好主意，但用户可以通过许多方法规避，并发送无效甚至是恶意数据。最好的做法是在将任何数据添加到数据库或对其进行信任之前，在 Web\
  \ 服务器上进行验证。\n\n[图 13.10] 显示了当提交时必填字段留空时，自动出现的 Chrome 警告框。\n\n**图 13.10。** Chrome\
  \ 中的必填字段。\n\n![image](img/13fig10.jpg)\n\n然而，必填字段仅在 Chrome 10、Firefox 4 和 Opera\
  \ 9 中，因此你仍然需要使用 JavaScript 进行一些验证。使用 `Modernizr`，你可以在运行验证脚本之前检查对 `required` 的支持情况：\n\
  \n```javascript\nif (!Modernizr.input.required){ ... }\n```\n\n但 HTML5 的验证并不仅于此——你现在还可以使用输入字段上的\
  \ `pattern` 属性来验证字段内容。你只需放置一个正则表达式，详细说明该字段应该使用的模式。\n\n例如，假设你想验证信用卡号。虽然你可以使用 `<input\
  \ type=number>` 字段，但这并没有太大价值。相反，让用户在标准文本字段中输入数字，但通过模式要求其恰好为 16 位长度且只能是数字：\n\n```html\n\
  <input id=ccnum placeholder=\"Please use only numbers\" pattern=\"[0-9]{16}\">\n\
  ```\n\n[图 13.11] 显示了 Firefox 如何验证信用卡字段。在页面的某个处描述格式是一个好主意，因为如你所见，验证信息非常通用。\n\n**图\
  \ 13.11。** 在 Firefox 中验证模式。\n\n![image](img/13fig11.jpg)\n\n`pattern` 属性受 Chrome\
  \ 10、Firefox 4 和 Opera 9 支持。\n\n### 动手尝试：创建一个 HTML5 表单\n\n将所有功能整合进一个连贯且良好的 HTML5\
  \ 表单可能是挑战性的。仅仅因为你使用了新的 HTML5 特性，并不意味着你应该忽略 `<fieldset>`、`<label>` 和 `<legend>` 等标准表单功能来帮助改进和样式化样式。与所有表单一样，你必须编写某些脚本让它们工作。要创建一个\
  \ HTML5 表单，请遵循以下步骤：\n\n1. **决定你想收集什么数据。**\n2. **使用标准 HTML 构建表单：**\n\n```html\n<form>\n\
  <p>Name:<br>\n<input type=text id=name>\n<p>Email:<br>\n<input type=text id=email>\n\
  <p>Phone:<br>\n<input type=text id=phone>\n<p>URL:<br>\n<input type=text id=URL>\n\
  <p>Job Description:<br>\n<textarea id=description></textarea>\n<p>Need response\
  \ by:<br>\n<input type=text id=replyBy>\n<p>How much can you spend?<br>\n$<input\
  \ type=text id=budget>\n<p>\n<input type=submit value=\"Submit Request\">\n</form>\n\
  ```\n\n3. **将文本字段转换为特定的字段类型：**\n\n```html\n<input type=email id=email>\n<input type=url\
  \ id=URL>\n```\n\n4. **标记必填字段：**\n\n```html\n<input required>\n```\n\n5. **添加模式、最小值或最大值：**\n\
  \n```html\n<input pattern=\"[0-9]{16}\">\n```\n\n6. **为表单添加 action：**\n\n```html\n\
  <form action=\"get\">\n```\n\n7. **为 fieldsets 和 legends 设置样式：**\n\n```css\nfieldset\
  \ {\n  border: rgba(0,0,250,.2) double 0.4em;\n  background-color: #fff;\n  border-radius:\
  \ 1em;\n}\nlegend {\n  font: 1.8em \"Palatino Linotype\", \"Book Antiqua\", Palatino,\
  \ serif;\n}\n```\n\n8. **最后，添加脚本进行验证，并为诸如占位符文本和日期选择器的内容添加备用方案。**\n\n\n\n\n\n这一小时涵盖了大量关于\
  \ HTML5 表单的信息，包括新属性、输入类型以及你可以在表单使用的元素。你现在应该理解如何通过 `autofocus`、`autocomplete` 和 `placeholder`\
  \ 属性让你的表单更具可用性。\n\n你学习了 13 种新的输入类型，如 `email`、`number` 和 `date`。你还学习了四种新元素，当这些元素得到更好的支持后，将使你的表单更加实用。\n\
  \n你还学习了如何使用新的 HTML5 属性对表单中的必填字段以及特定模式进行验证，以确保数据的有效性。\n\n### 问答\n\n**Q. 我应该把 `<datalist>`\
  \ 元素放在 HTML 的什么位置？**\n\n**A.** 你可以把它放在任何你想的地方。`id` 属性允许你在文档的任何地方引用它。最佳位置是将其放在 HTML\
  \ 的底部，这样它就不会影响其他页面元素的加载时间。如果不支持标准的用户代理程序显示了它或为其分配了空间，也不会影响页面的设计。\n\n**Q. 你描述了一些未广泛支持的元素，如\
  \ `<menu>`、`<output>` 和 `<command>`。我仍然应该使用这些元素吗？**\n\n**A.** 我建议现在不要过度担心 `<menu>`\
  \ 和 `<command>` 元素。它们没有被广泛支持，并且对移动应用程序没有额外价值。然而，`<output>` 元素将获得浏览支持，它通过为计算创建一个语义化区域并为动态应用提供一致的工具，确实增加了价值。\n\
  \n**Q. 我注意到你在示例中使用了 mailto 表单，但当我尝试时它不起作用。还有其他选项吗？**\n\n**A.** HTML5 表单与之前的 HTML\
  \ 表单一样，它们需要一个 `action` 属性才能真正执行任何操作。对于联系表单，你可以使用 PHP、ASP 或任何你熟悉的服务器端语言编写表单转邮件脚本。对于\
  \ Web 应用程序，许多表单将通过 JavaScript 激活。\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章节中学到的内容。在阅读答案之前，尝试回答所有问题。请参见\
  \ 附录 A，“测验答案](#app01.html_app01)”。\n\n### 测验\n\n**1.** 哪四个新的 HTML5 功能有助于提高表单的可用性？\n\
  \n**2.** 新的日期和时间输入类型有哪些？\n\n**3.** 列举一些在 WebKit 浏览器的 `<input type=search>` 字段中难以更改的样式。\n\
  \n**4.** `<output>` 元素是做什么用的？\n\n**5.** 你可以使用哪些属性在 HTML5 中进行表单验证？\n\n### 练习题\n\n\
  **1.** 找到一个现有的表单（你自己的或网站上的），并为其添加可用性功能以改进其工作方式。\n\n**2.** 创建一个收集至少四种类型数据的调查表单。确保包含\
  \ `email`、`url` 以及日期或时间类型。\n\n### 第 14 小时：使用 HTML5 编辑内容和用户交互\n\n***你将在这一小时学到：***\n\
  \n• 如何使用 `contenteditable` 在线编辑内容\n• 如何使用 `execCommand` 创建富文本编辑器\n• 如何在表单中检查拼写\n\
  • 如何使用 HTML5 UI 的新功能\n\n网页不再仅仅由构建它们的设计师来编辑。HTML5 引入了一项新功能，允许任何可以在浏览器中打开它的人对其进行编辑。\n\
  \n事实上，`contenteditable` 属性的设计是为了让 Web 设计师能够直接在网页中嵌入富文本编辑器。在这一小时，你将学习如何使用这项 HTML5\
  \ 功能，该功能自 Internet Explorer 5.5 和 Firefox 3 (2007) 起就受到了浏览支持。\n\n你还将学习另一个用于编辑的属性——`spellcheck`。因此，在这一小时之后，你将能够让读者通过富文本编辑器编辑你网页的部分内容，并验证表单元素及其所编辑区域的拼写。\n\
  \n你还将学习 HTML 的用户交互功能在 HTML5 中发生了哪些变化和改进。现在点击几乎任何内容都是可能的。\n\n#### 新的 `contenteditable`\
  \ 属性\n\n`contenteditable` 属性是一个全局元素，你可以将其用于 HTML5 中的每一个元素，以便使页面的部分区域可以在线进行编辑。`contenteditable`\
  \ 属性并不是新的。长期以来，它一直受到每个主流桌面浏览器的支持，包括 Chrome、Firefox 3、Internet Explorer 5.5、Opera\
  \ 9 和 Safari 3。\n\n要使用此属性，只需将其添加到你想要在浏览器中可以编辑的元素上：\n\n```html\n<div id=edit contenteditable=true></div>\n\
  ```\n\n你可以使用 `true` 或 `false` 值编写 `contenteditable` 属性。你也可以让它为空，这等同于 `contenteditable=true`：\n\
  \n```html\n<div id=edit contenteditable></div>\n```\n\n*顺便说*：设计模式与 HTML5\n\n`designmode`\
  \ 属性不是 HTML5 标准的一部分；它是微软为 Internet Explorer 创建的。它的工作方式与 `contenteditable` 有不同，因为当你开启设计模式时，整个文档都是可编辑的。\n\
  \n### 尝试一下：创建一个简单的 WYIG 编辑器\n\n“所见即所得”（WYIG）编辑器易于使用，因为它们显示的是样式而不是 HTML。在本次尝试中，你把一个\
  \ `<div>` 变成一个 WYIG 编辑器。\n\n**1.** 添加一个 `<div>` 元素并对其设置 `contenteditable` 和 `designmode`：\n\
  \n```html\n<div id=edit contenteditable=true designmode=on></div>\n```\n\n**2.**\
  \ 为 `<div>` 设置样式，以便有编辑空间：\n\n```css\n#edit {\n  width: 30em;\n  height: 20em;\n\
  \  border: solid #000;\n  overflow: auto;\n}\n```\n\n**3.** 为你的编辑器添加一些按钮：\n\n```html\n\
  <input type=button id=bold>\n<input type=button id=italic>\n<input type=button id=underline>\n\
  ```\n\n**4.** 在文档中引入 jQuery：\n```html\n<script src=\"jquery.min.js\"></script>\n\
  ```\n\n**5.** 在页面底部添加脚本来激活你的按钮：\n\n```javascript\n$(document).ready(function(){\n\
  \  function doExec(fx, extra) {\n    document.execCommand(fx, false, extra);\n \
  \ }\n\n  $(\"#bold\").click(function() {\n    doExec(\"bold\", \"\");\n  });\n\n\
  \  $(\"#italic\").click(function() {\n    doExec(\"italic\", \"\");\n  });\n\n \
  \ $(\"#underline\").click(function() {\n    doExec(\"underline\", \"\");\n  });\n\
  \n  $(\"#createlink\").click(function() {\n    var xtra = prompt(\"输入 URL:\", \"\
  http://\");\n    doExec(\"createlink\", xtra);\n  });\n});\n```\n\n*顺便说一下*：False\
  \ 关闭用户界面\n\n你可能想知道 `execCommand()` 方法中的“false”是做什么用的。这告诉用户代理不要显示界面。由于 `execCommand()`\
  \ 中使用的大多数命令都不支持用户界面，因此你应该始终将“false”作为第二个参数。\n\n#### `execCommand` 方法\n\n脚本中的 `execCommand()`\
  \ 方法是驱动编辑器的。你可以使用几十种命令。表 14.1 列出了命令、其值及其作用。\n\n**表 14.1.** `execCommand` 支持的命令\n\
  \n\n\n\n\n要使用这些命令，请将它们作为第一个值放在 `execCommand` 函数中。第二个值应为 `false`。第三第三个值包含任何所需的属性。\n\
  \n例如，下面是一个不带任何值的命令：\n\n```\ndocument.execCommand(\"bold\", false, \"\");\n```\n\n\
  以下命令包含一个值：\n\n```javascript\ndocument.execCommand(\"formatblock\", false, \"<p>\"\
  );\n```\n\n***\n\n# 注意！浏览器对编辑器的解释方式不同\n\n支持 `contenteditable` 属性和 `execCommand`\
  \ 函数的浏览器方式略有不同。例如，Internet Explorer 将所有字段应用到选中的文本上。如果没有文本或未选中任何内容，它将不会应用任何操作。此外，Firefox\
  \ 不会在 `formatblock` 中显示 `<blockquote>` 或 `<div>` 元素。在发布之前，请确保对任何使用 `contenteditable`\
  \ 和 `execCommand` 的页面进行测试。\n\n***\n\n你还可以使用其他命令来处理可编辑内容：\n\n• `document.queryCommandEnabled()`—指示命令是否可以在文档上执行。\n\
  • `document.queryCommandState()`—指示命令是否已在对象上执行。\n• `document.queryCommandIndeterm()`—指示命令是否处于不确定状态。\n\
  • `document.queryCommandSupported()`—指示当前命令是否受支持。\n• `document.queryCommandValue()`—返回给定命令的文档或选择的当前值。\n\
  \n这些方法允许你获取有关编辑内容中项目的的更多信息。\n\n***\n\n# 动手尝试：构建一个简单的待办列表\n\n在这次动手尝试中，你将使用无序列表、`contenteditable`\
  \ 和本地存储创建一个待办列表（本地存储在 第 21 节 中的“HTML5 中的 Web 存储”中进行了详细讨论）。\n\n### 1. 为你的文档添加一个 `<ul>`\
  \ 元素：\n\n```html\n<ul id=myToDoList>\n    <li>\n    </li>\n</ul>\n```\n\n### 2.\
  \ 为 `<ul>` 添加 `contenteditable` 属性：\n\n```html\n<ul id=myToDoList contenteditable=true>\n\
  ```\n\n当然，这个待办列表并不好用，因为你一离开页面，它就会消失。因此，添加一个 jQuery 脚本将其保存到本地存储（同样涵盖在 第 21 节 中），并在页面重新加载时恢复它。\n\
  \n### 3. 将 jQuery 添加到文档的头部（head）中：\n\n```html\n<script src=\"jquery.min.js\"></script>\n\
  ```\n\n### 4. 启动文档就绪函数：\n\n```html\n<Script>\n$(document).ready(function(){\n});\n\
  </script>\n```\n\n### 5. 在文档就绪函数内部将待办列表保存到本地存储：\n\n```javascript\n$(document).ready(function(){\n\
  \    $(\"#myToDoList\").blur(function() {\n        localStorage.setItem('myToDoData',\
  \ this.innerHTML);\n    });\n});\n```\n\n### 6. 在页面加载时从本地存储加载待办列表。也将此放在文档就绪函数中：\n\
  \n```javascript\nif ( localStorage.getItem('myToDoData') ) {\n    $(\"#myToDoList\"\
  ).html(localStorage.getItem('myToDoData'));\n}\n```\n\n你可以在 [www.html5in24hours.com/examples/to-do-list-1.html](http://www.html5in24hours.com/examples/to-do-list-1.html)\
  \ 查看此脚本的运行。\n\n***\n\n#### 为网页添加拼写检查\n\nHTML5 提供了全局属性 `spellcheck`，指示元素的内容将接受拼写检查和语法检查。此全局属性可以放在任何元素上，但在表单元素和\
  \ `contenteditable` 元素上的支持最好。与 `contenteditable` 属性一样，你只需要在表单元素中添加 `spellcheck=true`，如下：\n\
  \n```html\n<textarea spellcheck=true></textarea>\n```\n\n你可以使用 true 或 false 值编写此属性，也可以将其写成空元素，这与\
  \ `spellcheck=true` 相同：\n\n```html\n<textarea spellcheck></textarea>\n```\n\n`spellcheck`\
  \ 属性的挑战在于浏览器支持。Internet Explorer、Safari、iOS 和 Android 不支持 `spellcheck` 属性。然而，除 IE\
  \ 之外，它们都提供了浏览器内置的替代方案。Chrome、Opera 10 和 Firefox 2 支持该属性，但即使它们的支持也不同：\n\n• Opera\
  \ 对其编写所在的精确表单元素应用拼写检查；将其应用于 `<form>` 元素会影响所有子表单元素。它在输入时检查 `contenteditable` 字段，但不检查现有内容。\n\
  • Chrome 在测试拼写检查时返回正，但仅在输入时检查拼写，而不检查表单的现有值。它在输入时检查 `contenteditable` 字段，但不检查现有内容。\n\
  • Firefox 始终检查 `<textarea>` 元素，除非你显式关闭它们的检查。只有当父 `<form>` 元素开启拼写检查或 `spellcheck`\
  \ 属性直接应用于 `<input>` 元素时，它才会检查 `<input>` 元素。它会在输入时检查 `contenteditable` 字段以及现有内容。\n\
  \n就像新的 `input` 类型一样，为你的元素添加 `spellcheck` 属性不会产生任何副作用。事实上，除了 Internet Explorer，大多数浏览器都提供了拼写检查功能。\n\
  \n#### 隐藏元素\n\n全局属性 `hidden` 表明元素不受拼写检查和语法检查。此全局属性可以放在任何元素上，但在表单元素和 `contenteditable`\
  \ 元素上的支持最好。与 `contenteditable` 属性一样，你只需要在表单元素中添加 `hidden=true`，如下：\n\n```html\n\
  <textarea spellcheck=true></textarea>\n```\n\n你可以使用 true 或 false 值编写此属性，也可以将其写成空元素，这与\
  \ `spellcheck=true` 相同：\n\n```html\n<textarea spellcheck></textarea>\n```\n\n`spellcheck`\
  \ 属性的挑战在于浏览器支持。Internet Explorer、Safari、iOS 和 Android 不支持 `spellcheck` 属性。\n\n[其他\
  \ UI 组件]\n\n`onemptied`—`video` 或 `audio` 元素返回未初始化状态。\n`onended`—到达 `video` 或 `audio`\
  \ 元素的结束。\n`onerror`—元素加载不当。\n`oninvalid`—元素（通常是表单字段）未满足有效性约束。\n`onloadeddata`—用户代理可以首次渲染\
  \ `video` 或 `audio` 元素。\n`onloadedmetadata`—用户代理已确定 `video` 或 `audio` 元素的时长和尺寸。\n\
  `onloadstart`—用户代理开始为 `video` 或 `audio` 元素查找媒体数据。\n`onpause`—用户暂停了 `video` 或 `audio`\
  \ 元素的播放。\n\n\n\n\n\n- `onplay`—用户代理开始播放 `video` 或 `audio` 元素。\n- `onplaying`—`video`\
  \ 或 `audio` 元素的播放开始。\n- `onprogress`—用户代理正在为 `video` 或 `audio` 元素获取媒体数据。\n- `onratechange`—`video`\
  \ 或 `audio` 元素上的 DOM 属性 `defaultPlaybackRate` 或 DOM 属性 `playbackRate` 已更新。\n- `onreadystatechange`—元素及其所有子元素已加载。\n\
  - `onseeked`—`video` 或 `audio` 元素上的跳转操作结束。\n- `onseeking`—跳转操作持续时间足够，足以触发 `video`\
  \ 或 `audio` 元素上的 `seeking` 事件。\n- `onshow`—用户请求将元素作为上下文菜单显示。\n- `onstalled`—用户代理正尝试为\
  \ `video` 或 `audio` 元素获取媒体数据，但未成功。\n- `onsuspend`—用户代理当前没有获取媒体数据，但尚未下载完整的音频或视频。\n\
  - `ontimeupdate`—`video` 或 `audio` 元素的当前播放位置已改变。\n- `onvolumechange`—`video` 或 `audio`\
  \ 元素上的 DOM 属性 `volume` 或 DOM 属性 `muted` 已改变。\n\n最有用的变化是将 `tabindex` 作为全局属性。这使得你的页面导航变得容易得多，因为你可以在标题甚至单个段落上设置标签页索引数字。图\
  \ 14.1 显示了一个具有 `tabindex` 为 1 的段落在在 Safari 中通过标签页键进入。浏览器会同时高亮该标签页元素并将焦点带到其上，你可以通过文本周围的轮廓以及滚动条完全在底部可以看到这一点。你可以在\
  \ [www.html5in24hours.com/examples/ui-examples.html](http://www.html5in24hours.com/examples/ui-examples.html)\
  \ 在查看此示例。\n\n**图 14.1.** 在 Safari 中标签到段落。\n\n![image](img/14fig01.jpg)\n\n#### 浏览器对\
  \ UI 和编辑功能的支持\n\n`contenteditable` 属性的优点之一是它的支持非常广泛。IE 从 5.5 版本开始就支持它，所有其他桌面浏览器也跟进了相当标准的实现。\n\
  \n**你可能知道？**: Internet Explorer 领先一步\n\n微软和 IE 在在浏览器窗口内实现所见即所得（WYSIWYG）编辑器方面是先驱。如今，几十个甚至数百个富文本编辑器都是构建在该基础之上的。如\
  \ TinyMCE ([`tinymce.moxiecode.com/index.php`](http://tinymce.moxiecode.com/index.php))\
  \ 和 YUI 富文本编辑器 ([`developer.yahoo.com/yui/editor/`](http://developer.yahoo.com/yui/editor/))\
  \ 都是在 IE 开始的基础上构建的。\n\n然而，在移动应用程序中编辑内容是不可能的。目前没有任何移动浏览器支持 `contenteditable` 属性。相反，你需要使用\
  \ `<textarea>` 元素并提供纯 HTML（而非富文本）的替代方案。\n\n像往常一样，检测你需要的 HTML5 功能比检测特定的浏览器更好。检测对\
  \ `contenteditable` 的支持很容易：\n\n```javascript\nif ('isContentEditable' in document.createElement('p')\
  \ == false) {\n    alert('browser does not support contenteditable attribute');\n\
  }\n```\n\n这检查 DOM 以查看新创建的 `<p>` 元素上是否有可用 `contenteditable` 属性。你不应该在前面的 `if` 语句中使用\
  \ alert，而是应该放入你的 `<textarea>` 和表单。\n\n当然，这种方法仍然不起作用，因为 iOS 和 Android 报告它们拥有该属性，但它们并不支持。这是你必须检查浏览器版本的情况之一：\n\
  \n```javascript\nvar iOS = !!navigator.userAgent.match('iPhone OS') ||\n!!navigator.userAgent.match('iPad');\n\
  \nvar Android = !!navigator.userAgent.match('Android');\n```\n\n然后你将这些变量用于创建一个 `if`\
  \ 语句，以检测这些浏览器（iOS 和 Android）：\n\n```javascript\nvar iOS = !!navigator.userAgent.match('iPhone\
  \ OS') ||\n!!navigator.userAgent.match('iPad');\nvar Android = !!navigator.userAgent.match('Android');\n\
  \nif (!('isContentEditable' in document.createElement('p')) || (iOS || Android))\
  \ {\n    alert('browser does not support contenteditable attribute');\n}\n```\n\n\
  **注意！**: 小心处理“假”值\n\n所有这些属性（`contenteditable`、`spellcheck` 和 `hidden`）都是布尔属性。因此，它们意味着\
  \ true 和 false 的值——属性存在时为 true，不存在时为 false。但许多网页浏览器无论值是什么，都将属性的存在视为“true”，所以如果你写了\
  \ `contenteditable=false`，你可能会得到错误的结果。\n\n你可以用同样的方法检查对 spellcheck 的支持：\n\n```javascript\n\
  if ('spellcheck' in document.createElement('textarea') == false) {\n    alert('browser\
  \ does not support spellcheck');\n}\n```\n\n如前所述，使用此属性不会产生任何副作用。如果你想检查 `hidden`\
  \ 属性，可以使用：\n\n```javascript\nif ('hidden' in document.createElement('p') == false)\
  \ {\n    // 你你可以使用 jQuery 来隐藏它\n    $(\"[hidden]\").hide();\n}\n```\n\nUI 功能具有良好的浏览器支持，因为它们已经在规范中存在了很长时间。然而，仍存在一些例外：\n\
  \n- 移动浏览器通常没有在元素之间进行标签切换的方法，因此设置 `tabindex` 对 iOS 或 Android 没有影响。\n- 平板电脑和智能手机使用触摸和多点触摸界面来代替点击。\n\
  \n#### 总结\n\nHTML5 让与用户的交互变得简单得多。它提供了一系列事件处理器以及新功能。此外，HTML5 形式化了一个已存在一段时间的功能——`contenteditable`。在这一小时中，你学习了如何在你的浏览器窗口内制作简单的文本编辑器，然后为这些可编辑区域添加拼写检查功能。你还学习了新的\
  \ UI 属性 `hidden`，它可以放置在任何元素上将其从视图隐藏。\n\n### 问答\n\n**Q. 如果 contenteditable 已经存在这么久，为什么我现在才听说它？**\n\
  该属性是由浏览器制造商（微软）创建的，尽管许多此类功能最终会被添加到规范中，但其标准之一是使用率。\n\n**Q. 如果我想检查另一种语言的拼写怎么办？有办法指定用于检查拼写检查的字典吗？**\n\
  这通常是只有用户才能控制的浏览器功能。但你可以提供自定义字典的链接，让他们下载并安装。\n\n**Q. 你说我不应该将 hidden 属性用于标签页和内容，但如果我不应该使用它，他们为什么要把它加入规范呢？**\n\
  并不是说你永远不应该使用这个属性，而是你应该思考你使用它的原因。如果你隐藏内容是为了稍后通过标签页等导航选择进行显示，那么使用 CSS `display: none;`\
  \ 会更合适。如果你隐藏内容是因为它对整个文档无关，并且你希望在语义上应用该信息，那么 `hidden` 属性就是合适的。\n\n### 工作坊\n\n\n\n\
  \n\n本工作坊包含测试题，帮助你处理在本章中学习的内容。在阅读答案之前，请尝试回答所有问题。答案请参见附录 A“测验答案”。\n\n## 测验\n\n**1.**\
  \ 哪些浏览器支持 `contenteditable`？\n\n**2.** 哪些元素可以使用 `contenteditable` 属性？\n\n**3.**\
  \ 在浏览器中创建富文本编辑器需要什么种属性？\n\n**4.** 在检测 `contenteditable` 时有一个“坑”（gotcha）——是什么？\n\n\
  ## 练习\n\n**1.** 构建一个包含项目富文本编辑的待办列表。务必包含粗体和颜色，以便突出显示最重要的项目。\n\n**2.** 为你的带有 `textarea`\
  \ 元素的表单添加拼写检查，帮助读者提交拼写正确的表单。一个很好的开始点是你拥有的任何注释字段。\n\n## 第 15 小时。微格式 (Microformats)\
  \ 和微数据 (Microdata)\n\n***在此小时你将学到：***\n\n• 如何使用不仅仅是 HTML 元素对 HTML 进行语义化标记\n• 为什么语义化标记很重要\n\
  • RDFa、microdata 和 microformats 之间的区别\n• 如何在 microformats 和 microdata 之间选择\n\n在本小时你将更多地学习两种并非特定属于\
  \ HTML5 但有助于创建更具语义化文档的技术——微格式和微数据。\n\n微格式和微数据是两个竞争标准，它们试图在不影响页面可见内容的情况下，让计算机也能读取人类可读的网页。在本小时中，你将学习如何使用微格式让你的\
  \ HTML 更具语义化。你还将学习微数据以及最流行的微数据词表：`RDFa`。\n\n#### 使用微格式\n\n微格式是一组简单的、人类可读的格式，被添加到\
  \ HTML 中以赋予 HTML 更多含义。当你使用微格式时，你向文档添加了标记来定义可识别的数据项。\n\n微格式既是你用于为 HTML 添加含义的词表，也是添加这些信息的方法。例如，`hCard`\
  \ 是一个微格式词表，你可以将其添加到页面中以定义联系信息（姓名、地址、电话号码等）。然后你可以使用 HTML 元素上的 `class` 属性在页面中包含 `hCard`\
  \ 信息——这是使用微格式（由 [Microformats.org](http://Microformats.org) 定义）插入这些信息的方法。\n\n你可以用微格式标记的一些内容包括：\n\
  \n• 使用 `hCalendar` 的事件——通过 `hCalendar`，你可以指示事件的开始日期时间、结束日期时间和以及位置。\n• 使用 `hCard`\
  \ 的联系信息——`hCard` 微格式允许你在页面上添加 `vcard`（一种联系信息的文件格式）标记，以定义人的姓名、地址和联系信息。\n• 使用 `hRecipe`\
  \ 的食谱——Google 已经在使用 `hRecipe` 微格式存储食谱，以指示配料、说明甚至是食谱的评分。\n• 使用 `hReview` 的评论——`hReview`\
  \ 格式也被 Google 用于显示产品和服务的评论，包括星级评分、优缺点和评论文本。\n• 使用 `geo` 的地理位置——`geo` 格式识别文档中的经纬度，以便\
  \ GPS 等设备使用或用于地理位置定位。\n• 任何具有标准且可识别格式的内容——你可以在微格式网站了解许多其他微格式（[`microformats.org/wiki/Main_Page`](http://microformats.org/wiki/Main_Page)）。\n\
  \n微格式旨在获取现有数据（如在 HTML 文档中的数据），并添加人类可读的属性以提供关于数据的更多信息。\n\n在 HTML 中，大多数微格式是通过 `<span>`\
  \ 标签和这些 `<span>` 标签上的 `class` 属性添加的，以定义不同的数据部分。例如，你可以这样用 `hCard` 格式标记姓名：\n\n```html\n\
  <span class=\"fn\">Jennifer Kyrnin</span></span></span>\n```\n\n`class=\"fn\"` 表示“Jennifer\
  \ Kyrnin”是一个全名。\n\n由于你使用的是标准的 HTML 元素（如 `<span>`）和属性，你可以获取一段 HTML 并用微格式对其标记，而完全不会影响\
  \ HTML 的显示方式，除非你想这样做。\n\n例如，这里有一个没有使用微格式用 HTML 编写的简单书评：\n\n```html\n<article>\n\
  \  <h3><a href=\"...\">Dopplegangster</a> by Laura Resnick</h3>\n  <h4>一个有趣的、快速的阅读</h4>\n\
  \  <p>评分: 3/5 星</p>\n  <p>评论日期: <time datetime=\"2010-12-15\">2011 年 12 月 15 日</time></p>\n\
  \  <article>\n    <h1>Jennifer Kyrnin&#8217; 的评论：</h1>\n    ...\n  </article>\n\
  </article>\n```\n\n当你阅读这篇评论时，你知道哪些部分是书名、作者和评分，但计算机将完全不知道。没有什么合理的方法可以将这些评论信息获取到包含多个评论的数据库中，以保持信息的一致。\n\
  \n*顺便提一下*：微格式不是\n\n微格式不是一种规范，而是一组用于标记不同类型数据的指令。微格式不是解决每个问题的方案。\n\n* * *\n\n你可以使用\
  \ `hReview` 微格式来标记整个评论，以便其被共享和复用：\n\n```html\n<article class=\"hreview\">\n  <h3><a\
  \ href=\"...\" class=\"fn url\">Dopplegangster</a> by Laura Resnick</h3>\n  <h4\
  \ class=\"summary\">一个有趣的、快速的阅读</h4>\n  <p>评分: <span class=\"rating\" title=\"3\"\
  >3</span> 满分 5 星</p>\n  <p>评论日期: <time datetime=\"2010-12-15\" class=\"dtreed\"\
  >2011 年 12 月 15 日</time></p>\n  <article class=\"description\">\n    <h1><span class=\"\
  reviewer vcard\"><span class=\"fn\">Jennifer Kyrnin</span></span>&#8217; 的评论：</h1>\n\
  \    ...\n  </article>\n</article>\n```\n\n你可以在 [`html524hours.com/examples/microformats-html`](http://html524hours.com/examples/microformats-html)\
  \ 看到完整的示例。\n\n微格式结合语义化 HTML 可以帮助你创建广泛使用的文档。\n\n### 微格式的益处\n\n微格式将人类和机器都有用的数据添加到\
  \ HTML 文档中。虽然使用微格式标记的 HTML 文档看起来并不那么有用，但微格式标记的内容越多，文档就越有用。\n\n例如，在 Goodreads 上你可以找到\
  \ *Dopplegangster* 的 150 条评论。在 [Amazon.com](http://Amazon.com) 上你可以找到 18 条评论，在 Google\
  \ 图书上有 40 条评论，平均评分分别为 3.59、4.33 和 3.5（近似）。\n\n如果所有评论都使用了 `hReview` 微格式，你可以将所有评论合并到一个集合中以查看平均分。任何带有\
  \ `hReview` 标记的评论都可以有效地共享和复用。\n\n微格式还让将数据放入应用程序成为可能。例如，`vcard` 可以以 `hCard` 微格式保存，以便人们将你的联系信息保存到联系人中。存储在\
  \ `hCalendar` 格式中的事件可以添加到 Outlook、Google 日历、iCal 或任何其他日历程序。\n\n*你知道吗？*hCard 格式被广泛支持\n\
  \n使用 hCard 格式微格式的一个很大理由是它已经有了大量的支持。Apple 和 Windows 会将带有 `hCard` 标记的文本添加到联系人中，iOS\
  \ 和 Android 也是如此。\n\n#### 使用微格式的原则\n\n在使用微格式时，你应该记住几个原则：\n\n• 从解决特定问题开始。\n• 保持你的解决方案尽可能简单。\n\
  • 专注于保持标签的人类可读性。\n\n\n\n\n\n# 使用 HTML。\n\n在添加微格式（microformats）时，避免向你的 HTML 中添加新元素，除非它们至关重要。即使必须添加元素，也请添加诸如\
  \ `<span>` 这样不影响文档显示的元素。\n\n## 已经在使用的某些微格式\n\n网络上已有许多微格式在广泛使用，包括：\n\n- `hCalendar`—用于标记事件并将其添加到日历中\n\
  - `hCard`—用于为通讯录创建 vcard 文档\n- `hRecipe`—用于描述制作食物的步骤\n- `hReview`—用于对产品、企业、事件等撰写评论\n\
  - `rel-nofollow`—告诉搜索引擎不要为该链接赋予额外的权重\n- `XHTML Friends Network (`XFN`)`—代表链接内部的人际关系\n\
  \n`hCard` 和 `hCalendar` 在操作系统中都得到了广泛支持，允许你的用户快速方便地将地址和事件添加到通讯录和日历中。正如图 15.1 所示，Windows\
  \ 支持 `hCard` 微格式，并将其添加到你的 Windows 联系人中。\n\n**图 15.1.** Windows 从网站导入 vcard。\n\n\
  ![image](img/15fig01.jpg)\n\nGoogle 的食谱搜索使用 `hRecipe` 在搜索结果中提供“富摘要”（rich snippets）。这让你的食谱更有吸引力，让读者想要点击。Google\
  \ 同样使用 `hReview` 在搜索评论时提供更好的结果。\n\n基础微格式 `rel-nofollow` 被想要减缓博客垃圾信息的网页设计师广泛使用。它之所以被称为基础微格式，是因为它是仅有一个属性或元素的格式——在本例中为\
  \ `rel=nofollow`。微格式 `XFN` 或 XHTML Friends Network 可以整合到许多使用 WordPress 的博客中。\n\n\
  ***\n\n## 动手尝试：为你的网站添加 `hCard`\n\n开始学习微格式最简单的方法是在你的网站上添加 `hCard` 微格式。`hCard` 让人们能够将你的联系信息添加到他们的通讯录中。按照以下步骤添加\
  \ `hCard`：\n\n1. 打开你网站上的联系页面。\n\n2. 如果联系区域没有完全包含在如 `<address>` 等块级元素中，你需要添加一个：\n\
  \n```html\n<address id=\"address\">\n  <h2>Contact Me</h2>\n  <h3>Jennifer Kyrnin</h3>\n\
  \  <p>\n    Work: (425) 555-1211<br>\n    Fax: (425) 555-1213<br>\n    Email: <a\
  \ href=\"mailto:jennifer@example.com\">jennifer@example.com</a>\n  </p>\n  <p>\n\
  \    Address:<br>\n    123 Fake Street<br>\n    Anytown, ST 99999<br>\n    USA\n\
  \  </p>\n</address>\n```\n\n3. 在容器元素上添加 `vcard` 类：\n\n```html\n<address class=\"\
  vcard\">\n```\n\n4. 用 `fn` 类包围名称（你的名字或公司名称）。该字段在 `hCard` 格式是强制性的：\n\n```html\n<h3\
  \ class=\"fn\">Jennifer Kyrnin</h3>\n```\n\n5. 通过在类型和数字周围添加 `span` 元素来定义电话号码：\n\n\
  ```html\n<span class=\"tel\"><span class=\"type\">Work</span>:<span class=\"value\"\
  >(425) 555-1211</span></span><br>\n<span class=\"tel\"><span class=\"type\">Fax</span>:<span\
  \ class=\"value\">(425) 555-1213</span></span>\n```\n\n***\n\n### 注意！正确设置电话号码类型\n\
  \n当你定义电话号码的类型时，你需要使用 `hCard` 指令中列出的类型之一：home, work, pref, fax, cell, voice, video,\
  \ pager, car, msg, modem, bbs, isdn, 或 pcs。由于这些类型不区分大小写，因此 `Home` 与 `home` 是一样的。\n\
  \n***\n\n6. 使用 `email` 类定义邮箱地址：\n\n```html\n<a href=\"mailto:jennifer@example.com\"\
  \ class=\"email\">jennifer@example.com</a>\n```\n\n7. 为地址添加元素，以便你可以添加 `hCard` 类：\n\
  \n```html\n<h4>Address:</h4>\n<p class=\"adr\">\n  <span class=\"street-address\"\
  >123 Fake Street</span><br>\n  <span class=\"locality\">Anytown</span>,\n  <span\
  \ class=\"region\">ST</span> <span class=\"postal-code\">99999</span><br>\n  <span\
  \ class=\"country-name\">USA</span>\n</p>\n```\n\n8. 添加一个“添加到通讯录”链接：\n\n```html\n\
  <p>\n  <a href=\"http://h2vx.com/vcf/Your URL\">Add to Address Book</a>\n</p>\n\
  ```\n\n将文本 `Your URL` 修改为你发布地址 `hCard` 的页面的完整 URL。\n\n***\n\n## 使用 Microdata（微数据）\n\
  \nMicrodata 是 HTML5 的扩展，提供了另一种向文档嵌入机器可读数据的方法。microdata 规范包含了几个扩展 HTML5 的属性：\n\n\
  - `itemprop`—代替 `class` 来定义字段名\n- `itemscope`—定义字段的布尔属性\n- `itemref`—用于引用页面中的其他项目\n\
  - `itemtype`—定义项目的类型\n- `itemid`—项目的唯一标识符\n\nMicrodata 的用法与使用 `class` 类似，但使用 `itemscope`、`itemtype`\
  \ 和 `itemprop` 属性来标记内容。\n\n\n\n\n\n如你所见，除了将 `class` 属性更改为 microdata 属性外，`hCard`\
  \ 标记是相同的。\n\n### 使用 RDFa\n\nRDFa（属性中的资源描述框架）是另一种帮助弥合人类可读和机器可读内容差距的语言。\n\n你在 RDFa\
  \ 中使用的主要属性有：\n\n- `about` 或 `src`——元数据所描述的资源\n- `rel`——与另一个资源的关系\n- `rev`——与另一个资源的反向关系\n\
  - `href` 或 `resource`——资源的 URL\n- `property`——元素内容的特征\n\n要在 RDFa 中标记地址，你需要使用 VCARD-RDF\
  \ 规范。你还需要在 `<html>` 标签中添加命名空间：\n\n```html\n<html xmlns:contact=\"http://www.w3.org/2001/vcard-rdf/3.0#\"\
  >\n```\n\n然后，你在元素周围添加元标记（meta tags），并使用你定义的定义的命名空间：\n\n```html\n<div property=\"\
  contactinfo\" about=\"#me\">\n  <h2>联系我</h2>\n  <h3><meta property=\"contact:fn\"\
  >Jennifer Kyrnin</meta></h3>\n  <p>\n    <meta property=\"contact:tel\"><meta property=\"\
  contact:type\">Work</meta>:<meta property=\"contact:value\">(425) 555-1211</meta></meta><br>\n\
  \    <meta property=\"contact:tel\"><meta property=\"contact:type\">Fax</meta>:<meta\
  \ property=\"contact:value\">(425) 555-1213</meta></meta><br>\n    Email: <a href=\"\
  mailto:jennifer@example.com\" property=\"contact:email\">jennifer@example.com</a></a></a>>\n\
  \  </p>\n  <h4>地址：</h4>\n  <p>\n    <meta property=\"contact:adr\">\n      <meta\
  \ property=\"contact:street-address\">123 Fake Street</meta><br>\n      <meta property=\"\
  contact:locality\">Anytown</meta>,\n      <meta property=\"contact:region\">ST</meta>\n\
  \      <meta property=\"contact:postal-code\">99999</meta><br>\n      <meta property=\"\
  contact:country-name\">USA</meta\n    </meta>\n  </p>\n  <p>\n    <a href=\"http://h2vx.com/vcf/YOUR\
  \ URL\">添加到地址簿</a>\n  </p>\n</div>\n```\n\n#### 决定使用哪种格式\n\nMicroformats（微格式）、microdata\
  \ 或 RDFa 都可以让你的页面标记更具语义。然而，每种格式都有优缺点。\n\nMicroformats 易于使用，并使用现有的 HTML 属性（如 `class`），因此你的\
  \ HTML 将继续通过验证。然而，如果你已经使用了属于 microformat 规范的类，你的页面设计可能会受到影响。Microformats 已经在很多地方得以实现。\n\
  \nRDFa 基于 RDF，学习起来可能比较复杂。但是，有很多工具可以向文档中添加 RDF 和 RDFa。RDFa 与 XHTML 的配合效果最好，而不是严格性较小的\
  \ HTML，并且在学术界非常流行。\n\nMicrodata 是最新的工具。它比 microformats 更具扩展性，并且因为它添加了新属性，完全不会影响\
  \ HTML 文档的设计。它比 RDFa 容易学习，但比 microformats 复杂。Microdata 是 W3C 规范，从长远来看，这可能赋予它在商业领域更大的影响力。此外，Bing、Google\
  \ 和 Yahoo! 等搜索引擎提供商已经在其搜索结果中使用 microdata。\n\n归根结底，使用哪一种并不重要，只要你使用其中一种即可。\n\n###\
  \ 移动设备与 Microformats\n\nAndroid 和 iOS 的内置浏览器对这些系统的任何支持都非常有限。当你考虑到其他可能功能较简单的功能手机（如\
  \ Treo、Sony Ericsson W810i 和 Nokia S60）可以处理 vcards，而且 Treo 还可以处理 `hCalendar` 数据时，这非常有趣。\n\
  \n**顺便说一下**：检测 Microformats 的实用工具\n\nMicroformat 网站（[www.microform.at/](http://www.microform.at/)）会检测网站上的\
  \ microformats，然后将其转换为可下载的链接。它甚至可以将它们转换为 QR 代码，你的移动用户可以进行扫描。\n\n### 为什么要费力使用 Microformats\
  \ 或 Microdata？\n\n如果现代智能手机不支持 microformats 或 microdata，你可能会认为使用它们没有意义。然而，通过用这些信息标记你的内容，你为以后它们开始支持这些格式做好了准备。此外，如前所述，功能手机如\
  \ Sony Ericsson W810i 也支持它们，因此智能手机很快就会支持它们。\n\nmicroformats 和 microdata 为移动设备带来的首要收益是可用性。点击一个链接来填充地址簿，比费力地输入联系人的姓名、地址和电话号码容易得多。\n\
  \n许多智能手机拥有 GPS 等功能，可以将 GPS 坐标连接到地图。通过使用 microformats 标记这些坐标，手机可以根据用户的当前位置生成逐段导航指令。是的，手机在没有\
  \ microformats 的情况下也可以这样做，但有了它们，用户就不需要做任何操作了。手机只需知道该数据（带有 microformat 代码）是地图上的坐标。\n\
  \n### 两种不那么正式的 Microformats\n\n移动设备使用两种 microformats：nanoformats 和 picoformats。这些是使用极少字符的\
  \ microformats。\n\n- `@username`——用于提及另一个用户 own 的内容。\n- `#category`——标签（Meshtags）是提供更多搜索相关性的方法。\n\
  \nPicoformats 比 nanoformats 更短，用于短信或聊天。\n\n#### 总结\n\nMicroformats 为你的网页添加了有用信息，并帮助元素更具语义化。你可以标记活动、食谱和简历等内容。microformats\
  \ 真正很棒的一点是它们可以完美地融入你的 HTML 文档中。\n\n在 microformats、microdata 和 RDFa 之间做出决定可能很困难，但归结如下：\n\
  \n- Microformats 最容易使用。\n- RDFa 有大量的支持。\n- Microdata 是 W3C 标准。\n\n最小的 microformats——nanoformats\
  \ 和 picoformats——让你用极少的字符标记文本并仍然提供更多信息。\n\n### 问答\n\n**Q. *为什么具有人类可读或机器可读的内容很重要？***\n\
  \n**A.** 通过让你的文档尽可能语义化，你创建了一个对阅读文档的人类和解析文档的计算机都有用的应用程序。这意味着你的应用程序将被更广泛地看到和理解。\n\n\
  **Q. *使用 microdata 似乎会为我的 HTML 添加很多字符——这不会减慢页面渲染吗？***\n\n**A.** 在标记中添加 microdata\
  \ 似乎增加了很多需要下载的内容，但你必须记住这些内容是有用的。包含公司地址的 vcard 可以快速地添加到用户的地址簿中。用 `hCalendar` 标记的活动可以添加到用户的日历中，这样他们就不会忘记参加。仅仅因为内容对用户来说直接可见，并不意味着它没有用。\n\
  \n**Q. *我的 iPod touch 似乎支持 vCards，但你说 iOS 不支持它。***\n\n\n\n\n\nA. 这是 iPhone 市场的讽刺之处之一。iPod\
  \ 和 iPad 对微格式的支持比 iPhone 好，但这种情况可能会发生变化。这三类设备在某种程度上都能识别地址和联系信息，而不需要微格式标记。\n\n##\
  \ Q. 元数据（Microdata）和微格式（microformats）看起来很复杂——如何确保我正确添加了它们？\n\nA. 你可以使用验证器来检查你的微格式和元数据。W3C\
  \ 有一个 RDF 验证器（[www.w3.org/RDF/Validator/](http://www.w3.org/RDF/Validator/)），而 Google\
  \ 有一个测试你元数据的工具（[www.google.com/webmasters/tools/richsnippets](http://www.google.com/webmasters/tools/richsnippets)）。\n\
  \n## 工作\n\n工作包含测验题，帮助你处理在本章中学的内容。在阅读答案之前，尝试回答所有问题。请参见附录 A，“测验答案](#app01.html_app01)”。\n\
  \n### 测验\n\n1. 你可以用微格式标记的三种内容是什么？\n\n2. 元数据中的 `itemprop` 属性是做什么用的？\n\n3. RDFa 代表什么？\n\
  \n### 练习\n\n1. 查找 `hResume` 的规范，然后编写或编辑你的在线简历以包含这些属性。你可以使用微格式，也可以使用元数据。\n\n2. 为你自己或你的业务创建一个活动日历，并使用\
  \ `hCalendar` 对进行标记。你可以使用 `hCalendar` 创建器（[`microformats.org/code/hcalendar/creator`](http://microformats.org/code/hcalendar/creator)）寻求帮助。\n\
  \n## 第 16 小时。使用 HTML5 拖放功能\n\n在本小时中你将学习到：\n\n• 为什么拖放对于 Web 应用程序很重要\n• 如何在大多数现代浏览器中使用拖放\n\
  • 如何使用用于拖放的新事件和属性\n• 创建拖放界面的六个步骤\n\nHTML5 拖放为你提供了一种在 Web 应用程序中创建拖放功能的标准化方法。这使得你的应用程序运行得更像原生桌面应用程序。\n\
  \n在本小时中，你将学习为了允许拖放运行所需的 HTML5 事件和属性。你还将学习使用 HTML5 实现拖放的步骤。\n\n如果你以前在网页上实现过拖放功能，你就知道这有多么棘手。但\
  \ HTML5 让这个过程变得更加简单，随着更好的浏览器支持，你可以创建在大多数设备和浏览器中运行的应用程序。\n\n### 实现拖放\n\n原生应用程序与网页相比，最基本的方面之一是移动对象的能力——即拖拽并释放它们。HTML5\
  \ 通过 API 和几个新属性将该功能带到了 Web 应用程序。\n\n在计算机浏览器上，拖放是通过鼠标实现的。用户点击并按住对象，然后移动鼠标，通过鼠标移动对象。当用户释放鼠标按钮时，对象就会掉在新的位置。在\
  \ Android 设备上，当用户点击并按住对象，滑动到新位置并松开时就会发生拖放。\n\n实现拖放的两种方式通常被称为“旧派”和“新派”。新派是 HTML5\
  \ 拖放，而旧派使用 DHTML（动态 HTML）。许多使用 DHTML 的实现仅在一种特定浏览器中工作，或仅在特定的外部框架下工作。\n\n使用 HTML5\
  \ 拖放提供了一些切实的益处：\n\n• 你不会受限于任何特定的浏览器或框架，因为 HTML5 API 被广泛支持。\n• HTML5 拖放可以跨浏览器窗口、框架，甚至非\
  \ Web 应用程序。\n\n大多数主流浏览器都提供了拖放支持，包括 Android 2.1、Chrome 3、Firefox 3.5、Internet Explorer\
  \ 5 和 Safari 3。iOS 或 Opera 不支持。尽管现在 Opera 和 iOS 不支持拖放，但它们最终会支持，因为拖放是 HTML5 的一部分，而这两个浏览器厂商都支持\
  \ HTML5。\n\n### 注意！浏览器差异\n\n浏览器支持确实存在一些问题。Internet Explorer 只会实现部分。在 Internet Explorer\
  \ 中，拖放是通过鼠标实现的。用户点击并按住对象，然后移动鼠标，通过鼠标移动对象。在 Firefox 3.5 中，拖放是复杂的。在 Chrome 3 中，拖放是点击并按住对象然后移动鼠标。在\
  \ Safari 3 中，拖放是使用鼠标实现的。在 Android 2.1 中，拖放是点击并按住对象然后滑动到新位置并松开。\n\n实现拖放的两种方式通常被称为“旧派”和“新派”。新派是\
  \ HTML5 拖放，而旧派使用 DHTML（动态 HTML）。许多使用 DHTML 的实现仅在一种特定浏览器中工作，或仅在特定的外部框架下工作。\n\n使用\
