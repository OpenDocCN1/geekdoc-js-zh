  \n### 第一部分：使用开放 Web 标准构建网页和应用程序\n\n## 第 1 小时：使用 HTML5 改进移动 Web 应用开发\n\n**在本小时中，你将学到：**\n\
  \n• HTML 自发明以来经历了怎样的增长和变化\n• HTML5 在其他版本的 HTML 中处于什么位置\n• 什么是开放 Web 标准（Open Web\
  \ Standard），它如何与 HTML5 关联\n• Web 应用与典型网页有何不同\n• 如何构建一个非常简单的 HTML5 网页\n• 为什么你想在移动端应用中使用\
  \ HTML5\n\nHTML5 是 HTML 的最新版本，尽管在 Internet Explorer 等桌面浏览器上的采用速度缓慢，但移动设备正以空前的速度加入这一浪潮。今天销售的几乎每部智能手机和平板设备都支持\
  \ HTML5，而且这些数字还在不断增长。\n\n在本小时中，你将学习 HTML5 是如何诞生的，它是如何改变 Web 设计师、开发者以及查看你页面客户的格局的。你将学习构建一个简单的\
  \ HTML5 文档，并了解如果你想设计和开发移动应用，为什么 HTML5 是你应该掌握的语言。\n\n### 理解我们是如何到达 HTML5 的\n\n1989\
  \ 年 3 月，蒂姆·伯纳斯-李爵（Sir Tim Berners-Lee）写了一份提案，建议在网络上使用超文本将相关文档连接在一起。在与欧洲核研究组织（CERN）的其他同事合作后，超文本最终变成了\
  \ HTML 或超文本标记语言（Hypertext Markup Language）。\n\nHTML 基于一种已经用于标记文档的语言——`SGML`（标准通用标记语言）。1991\
  \ 年 9 月，互联网上开始了关于 Web 和 HTML 应该如何演进的讨论。\n\n直到 1993 年左右，唯一可浏览器是一个名为 `Lynx` 的纯文本浏览器。随后\
  \ Mosaic 问世，引入了图像、嵌套列表和表单等功能。如今的设计师大多认为这些是理所当然的，但在 20 世纪 90 年代初，很多人黑白的纯文本环境中浏览网页。直到\
  \ 1994 年 `IETF`（互联网工程任务组）才成立了 HTML 工作组。同年 7 月，`W3C`（即世界 Web 联盟）在麻理工学院成立。`HTML 3`\
  \ 于 1995 年作为草案发布，`HTML 3.2` 于 1997 年被认可为标准。`HTML 4` 于 1999 年作为建议发布。\n\n#### XML\
  \ 和 XHTML\n\n1999 年之后情况开始发生变化。`W3C` 不再认为 HTML 应该保持原样。相反，他们希望它更具机器可读性、更一致，且严格得多。因此，他们没有开发新版本的\
  \ HTML，而是开始将 HTML 转换为一种名为 `XHTML` 的严格标记语言。\n\n`XHTML` 是 `HTML 4.01` 的一个版本，用 `XML`（可扩展标记语言）重写。`XHTML`\
  \ 创建于 1998 年，旨在创建机器可读的标记语言。`XHTML` 文档必须是良好格式且有效的。事实上，`W3C` 希望所有浏览器停止渲染页面。\n\n`XML`\
  \ 仍被许多公司使用。例如，许多内容管理系统（CMS）在后端使用 `XML` 来管理大型网站；许多书籍使用 `DocBook` 编写（一种用于出版的 XML 语言）；电子书则使用\
  \ `XML` 创建。\n\n*顺带一下：良好格式（Well-Formed）与有效（Valid）*\n\n良好格式的文档在顶部有声明——包括规范、所有属性都用引号括起来、所有元素都关闭，且只有一个根元素。有效的文档是指通过规范检查且没有错误的文档。\n\
  \n#### HTML5 的诞生\n\n`XHTML` 因为基于 `XML`，具有与 `XML` 相同的严格要求，这使得编写 `XHTML` 非常困难。尽管大多数\
  \ Web 设计师承认创建有效 HTML 的重要性，但归根结底，最重要的 HTML 在读者的浏览器中运行。每个曾经验证过页面的初级 Web 设计师都知道，页面无效并不意味着浏览器无法显示它。事实上，浏览器对于显示技术上无效的\
  \ HTML 没有问题。\n\n由于这些困难，一群 Web 设计师、开发者以及浏览器制造商和其他人在 2004 年聚集在一起，形成了 Web 超文本应用技术工作组（`WHATWG`）。他们开始构建\
  \ HTML5 规范，以满足设计师、开发者和浏览器制造商的需求。最后，在 2008 年，`W3C` 放弃开发 `XHTML`，转而与 HTML5 社区整合，并将\
  \ `HTML 5` 规范纳入 `W3C` 框架。\n\n### 学习 HTML5 有何不同\n\n`HTML 4` 是 `W3C` 独立开发的最后一个建议标准。目前大多数网页都是用\
  \ `HTML 4` 构建的，因为它被网络浏览器和编辑器广泛支持。\n\n\n\n\n\nXHTML 是通过将 HTML 4.01 规范重写为 XML 创建的，这意味着所有标签都必须关闭，XHTML\
  \ 标签必须全部小写，所有属性都必须加引号，且标签必须嵌套而不能交叉。\n\n## 正确嵌套标签\n\n当你嵌套两个 HTML 标签时，你应该将它们想象成一叠碗——一个套在另一个里面。始终先关闭嵌套标签，然后再关闭外部标签。\n\
  \n**错误示例：**\n\n```\nThis text is <em>italic, and this is <strong>bold and italic</em></strong>\n\
  ```\n\n**正确示例：**\n\n```\nThis text is <em>italic, and this is <strong>bold and italic</strong></em>\n\
  ```\n\n## HTML5 vs. XHTML\n\nHTML5 回到了一个限制较少的 HTML 版本。所有元素都不再需要闭合标签，你可以写大写或小写，而且属性并不总是需要加引号。\n\
  \nHTML5 还增加了许多新元素，包括一个简化的文档类型声明（或 DTD——即你 HTML 文档的第一行。它告诉浏览器该文档是一个 HTML5 文档）、分节元素、许多新的表单功能，以及对拖放和其他创建\
  \ Web 应用程序有用的功能的支持。\n\n### 你知道吗？新的 HTML5 文档类型\n\nHTML5 有一个新的极其简化的文档类型声明，非常容易记忆——`<!doctype\
  \ html>`。不需要其他内容。它甚至不需要全大写。\n\n## 定义 Web 应用程序\n\n应用程序是在本地计算机上用于执行各种任务的软件程序。最常用的应用程序是\
  \ 浏览器（如 Internet Explorer 或 Firefox）、文档编辑器（如 Word）和电子邮件客户端（如 Outlook 或 Thunderbird）。这些程序彼此非常，因为它们都运行在相同的操作系统上。它们具有如下特征：\n\
  \n• 相似的外观和感受，例如顶部的菜单\n• 功能，如拖放、保存到硬盘和交互性\n\nWeb 应用程序是试图看起来和运行像桌面应用程序的网页。它们被编写在浏览器内部运行，而不是直接运行在计算机上。这意味着它们受限于\
  \ 浏览器能够做和不能做的功能：\n\n• Web 应用程序依赖 浏览器来实现否则必须编码的功能（例如后退按钮、页面渲染等）。\n• Web 应用程序受到的限制与浏览器相同。它们不能将数据保存到硬盘，脚本功能有限，并且无法直接与计算机操作系统进行交互。\n\
  \n与桌面应用程序不同，Web 应用程序并不局限于一个操作系统。Web 应用程序运行在浏览器中，因此任何浏览器可以运行的地方，Web 应用程序就能运行。\n\n\
  ## 使用开放 Web 标准\n\nHTML5 的编写主要是作为一种开发更好、更高效的 Web 应用程序的方法，它是开放 Web 标准下开发的一系列 API 和规范的一部分。开放\
  \ Web 标准或开放 Web 平台是一系列启用 Web 的免版技术集合。\n\n许多人认为 HTML5 包含的内容比实际的要。事实上，诸如 `History\
  \ API`（在第 22 节，“使用 History API 控制浏览器历史](#ch22.html_ch22)”讨论）、本地存储（第 21 节，“HTML5\
  \ 中的 Web Storage](#ch21.html_ch21)”）和地理定位（第 23 节，“使用地理定位添加位置检测](#ch23.html_ch23)”）都是都是独立的规范，它们与\
  \ HTML5 配合工作，创建了一套你可以用来构建网页、Web 应用程序、移动应用程序等的工具。这些都是开放 Web 标准的一部分。\n\n该标准中的某些规范包括：\n\
  \n• HTML5\n• CSS3\n• Web Fonts\n• HTML Canvas\n• SVG\n• Web storage\n• Geolocation\n\
  \n通过为你的 Web 应用程序使用基于标准的规范，你知道你的页面和应用程序将适用于更广泛的受众，并且你的页面和应用程序将持续更久。\n\n## 动手尝试：构建你的第一个\
  \ HTML5 文档\n\nHTML5 的核心是 HTML，也就是你用来构建网页的工具。因此，在开始学习后续章节中要开发的应用程序之前，你需要知道如何构建网页。\n\
  \n你从编写一些 HTML 开始，这非常容易。你只需要一个文本编辑器。\n\n### 你知道吗？找到你计算机的文本编辑器\n\n如果你可以使用计算机，你就可以使用编写\
  \ HTML 的文本编辑器。在 Windows 上，在开始菜单的搜索程序和文件搜索框中输入 `Notepad`。在 Macintosh 上，在 Spotlight\
  \ 中输入 `TextEdit`。在 Linux 计算机上使用 `vi` 或 `Emacs` 命令。\n\n启动并运行文本编辑器后，你就可以开始编写你的 HTML\
  \ 了，它由写在小于（`<`）和大于（`>`）符号内部的标签定义。\n\n**1.** 打开你的文本编辑器并输入以下内容：\n\n```html\n<!doctype\
  \ html>\n<html>\n    <head>\n        <title>This is my first HTML5 page</title>\n\
  \    </head>\n    <body>\n        <h1>My First Document</h1>\n        <p>This is\
  \ my HTML5 document.</p>\n    </body>\n</html>\n```\n\n**2.** 将你的文件保存为 `mypage.html`。\n\
  \n### 注意！检查该文件扩展名\n\n确保在文件系统中检查你的 HTML 文件的扩展名。如果你不小心，`Notepad` 经常会将其转换为 `.txt` 文件。如果是这样，只需关闭\
  \ `Notepad` 并将 `.txt` 替换为 `.html`。\n\n## 在 iOS 和 Android 上使用 HTML5\n\n许多设计师不愿意在他们的网页上开始使用\
  \ HTML5，因为 Internet Explorer 对它的支持相对较。事实上，只有 Internet Explorer 9 具有良好的 HTML5 支持。其他计算机浏览器，如\
  \ Firefox、Chrome、Opera 和 Safari，对 HTML5 都有良好的支持。\n\n### 注意！测试至关重要\n\n如果你计划为 iOS\
  \ 和 Android 设备以及桌面浏览器创建页面和应用程序，请务必在 Internet Explorer 8 中测试你的文档。这个浏览器（以及 IE 7）仍然占据着大部分市场份额，如果你的页面或应用程序无法运行，那么你的页面或应用程序对大多数人来说无效。如果你没有\
  \ Windows 机器，可以使用在线工具如 `Browshots` (`http://browsershots.org/`) 来在 Internet Explorer\
  \ 和其他浏览器中测试。\n\n但是运行 Android 和 iOS 上的移动设备（如 Xoom 平板电脑或 iPad）呢？它们都开箱即用 HTML5，因为它们各自运行基于\
  \ WebKit 的浏览器（iOS 上的 Safari 和 Android 上的 Chrome），WebKit 对 HTML5 有极佳的支持。\n\n## 编写移动网站\n\
  \n在某些方面，为移动设备编写网站比以前容易得多。虽然出现了更多设备，包括智能手机和非智能手机、平板电脑、互联网电视设备，甚至是一些画框，但这些设备在支持的 HTML5\
  \ 功能上正在趋同，甚至在尺寸和形状上也是如此（在某种程度上）。\n\n\n\n\n\n当你创建一个移动端网站时，首先要记住，移动端网站本质上就是一个网站。最好的网站是为每个浏览器和操作系统构建的，或者尽可能适配尽可能多的设备。\n\
  \n然而，在构建一个针对移动设备的网站时，你仍然应该考虑一些基础问题：\n\n• 移动设备的屏幕尺寸和分辨率是多少？\n• 你的移动用户需要什么内容？\n• 你的\
  \ HTML、CSS 和 JavaScript 是否有效且紧凑？\n• 你的网站是否应该为移动用户准备一个独立的域名？\n• 你的移动网站需要哪些测试？\n\n\
  ## 移动设备的屏幕尺寸和分辨率是什么\n\n当你处理移动设备时，屏幕尺寸显然比桌面电脑要小。通常情况下，对于智能手机，你必须为几种标准尺寸准备：\n\n• `128\
  \ × 160 pixels`——例如富士通 DoCoMo F504i 等手机\n• `176 × 220 pixels`——例如 HP iPAQ 510 等手机\n\
  • `240 × 320 pixels`——例如 Blackberry 8100 或 HTC Elf 等智能手机\n• `320 × 480 pixels`——例如\
  \ Garmin-AsusA50 或 Palm Pre 等 PDA\n\n平板电脑的加入增加了复杂性，它们不仅屏幕更大，而且查看方式也多样。例如，大多数平板电脑（以及某些智能手机）都可以在竖屏或横屏模式下查看。这意味着你有时需要处理一个\
  \ `1024-pixels-wide` 宽的屏幕，而其他时候只有 `800 pixels` 或更宽。\n\n然而，通常情况下，平板电脑在移动设备上提供了更多的屏幕空间供你发挥。你可以假设大多数平板设备的尺寸大约为\
  \ `1024–1280 pixels` 乘 `600–800 pixels`。\n\n在 `iPad` 上以标准格式浏览大多数网站是很容易的，因为浏览器像电脑显示器一样清晰且易用。此外，由于\
  \ `iOS` 和 `Android` 都具有缩放功能，将较小且难以阅读的区域放大很容易。\n\n## 移动用户需要什么内容？\n\n当你为移动设备设计网站时，请记住用户并不总是想访问与在桌面端浏览时相同的内容。\n\
  \n例如，移动端客户往往处于“移动中”状态。换句话说，他们可能在途中，或者远离家或办公室，在访问你的网站时有非常特定的需求或欲望。例如，当在手机上访问餐厅网站时，一位坐在汽车里的用户可能需要快速找到餐厅的位置和电话号码。如果移动网站没有将电话号码和位置放在显目位置，用户可能会迅速放弃该网站。\n\
  \n### 注意！不要限制内容\n\n移动网站经常犯的一个错误是从网站的移动版中删减内容。调整内容以确保对移动端用户最重要的信息能够易于获取是至关重要的。但如果他们需要的内容不在移动网站上，你必须允许用户有机会在完整版网站上查找这些内容。\n\
  \n然而，移动端网站的内容不应受到限制。事实上，W3C 建议“……在合理范围内，无论用户使用何种设备，都为他们提供相同的信息和力。”\n\n这并不意味着你不能更改内容的格式或位置，但在移动设备上获取与电脑上相同的内容应该是应该是可行的。\n\
  \n## 你的 HTML、CSS 和 JavaScript 是否有效且紧凑？\n\n你不必担心为移动设备编写良好的 `XHTML`，但坚持正确、基于标准的 `HTML`、`CSS`\
  \ 和 `JavaScript` 可以确保你的页面能被尽可能多的设备看到。此外，通过验证你的 `HTML`，你会知道它是正确的。\n\n### 你知道吗？W3C\
  \ 验证器\n\nW3C 在 `http://validator.w3.org/` 提供了一个验证器，你可以用它检查 `HTML`、`XHTML` 和其他标记语言。但你也可以通过该网站验证\
  \ `CSS` 和 `RSS`，甚至找到页面上的断链。不要害怕定期在验证器中检查你的网站，你可能会对发现感到惊讶。\n\n除了编写有效的 `HTML` 之外，如果你为移动设备编写网页，应该考虑避免以下几点：\n\
  \n• `HTML tables`——由于屏幕较小，在移动布局中尽可能避免使用表格是最好的，因为水平滚动非常困难会让表格难以阅读。\n• 用于布局的 `HTML\
  \ tables`——通常情况下你不应该使用 `HTML tables` 进行网页布局，但在移动设备上，它们会让页面加载变慢且看起来很难看，尤其是当表格不适应浏览器窗口时。此外，当你使用表格进行布局时，几乎总是会使用嵌套表格，这会让页面加载变慢，并且移动设备渲染困难得多。\n\
  • `Pop-up windows`（弹出窗口）——弹出窗口通常很烦人，但在移动设备上它们可能让网站变得不可用。某些移动浏览器不支持它们，另一些则会以意想不到的方式打开（通常是通过关闭当前窗口来打开新窗口）。\n\
  • 用于布局的 `Graphics`（图形）——就像使用表格布局一样，添加隐藏图形来增加空格并影响布局通常会导致许多旧款移动设备卡死或错误显示页面。此外，它们会增加下载时间。\n\
  • `Frames and image maps`（框架和图像映射）——许多移动设备不支持这些功能。事实上，`HTML5` 不再将 `frames`（`iframe`\
  \ 之外）作为规范的一部分。\n\n### 顺便说：iOS 和 Android 的限制\n\n虽然在移动页面中避免表格、`popup windows` 和 `image\
  \ maps` 是最好的，但如果你专注于 `iOS` 或 `Android` 的移动页面，你可以放心。这两者都能很好处理。然而，框架并不属于 `HTML5` 的一部分，你不应该依赖\
  \ `iOS` 或 `Android` 对它们的支持。\n\n另外请记住，移动用户通常需要为带宽付费，所以你的网页应该尽可能越小（以 `KB` ）。你使用的 `HTML`\
  \ 标签、`CSS` 属性以及服务器请求越少，移动用户的浏览体验就越好。\n\n## 你的网站是否应该为移动用户准备一个独立的域名？\n\n许多网站为其移动站点准备了独立的子域名。这使得移动用户无需费心主域名就能轻松找到移动站点。这些域名通常形如\
  \ `m.example.com`。\n\n拥有独立的移动域名有几个优势：\n\n• 它让你的移动网站更容易被找到。\n• 你可以单独投放移动 URL，获得更广泛的触达范围。\n\
  • 独立的移动域名让平板电脑或智能手机用户可以通过切换域名来进入完整站点。\n• 检测移动用户并将其重定向到独立域名比为移动用户编写 `CSS` 脚本要简单得多。\n\
  \n在决定如何处理你的移动网站版本时，请考虑你将如何维护网站。你可以手动为移动域名创建完全独立的页面，也可以使用内容管理系统。第 4 小“检测移动设备和 HTML5\
  \ 支持”将详细介绍这一话题。\n\n\n\n\n\n你可能没有无限的预算来购买手机（以及相关的手机套餐），那么你该怎么办呢？这里有一些建议：\n\n- **使用模拟器—**\
  \ 许多不同的移动设备都有在线和离线模拟器可用。大多数模拟器都是免费的，并且它们至少可以让你开始在在移动设备上测试你的网站。\n- **租用设备时间—** 市场上上有某些服务，允许你租用多部手机的时间。通过感受手机如何处理你的应用程序，你可以让这笔开支变得合理。\n\
  - **买一些手机—** 这看起来可能是一个昂贵的选项，但如果你计划进行大量的移动 Web 开发，那么这可能是一项合理的投资。\n- **向朋友和同事寻求帮助—**\
  \ 这是测试网站最便宜的方法之一——只需向你认识的人借手机或平板电脑。你只需要将你的网站部署在在线 Web 服务器上即可。\n\n归结底，如果你打算进行移动开发，你应该至少有一个可以可以直接测试页面的移动设备。测试的设备越多，你的网站就会越好。\n\
  \n#### 总结\n\n在这一小时中，你学习了 HTML 是如何开始的以及从 HTML 变为 XHTML 再变为 HTML5 的原因。你了解了 HTML 4、XHTML\
  \ 1 和 HTML5 之间的基本区别，以及什么是 Web 应用程序以及它们与开放 Web 标准（Open Web Standard）的关系。你学习了如何编写基础\
  \ HTML Web 页面，以及为什么 HTML5 与移动设备如此匹配。你还学习了一些构建移动 Web 页面的强大技巧。\n\n这一小时最需要记住的重点是为移动用户构建网站的最佳实践：\n\
  \n- 首先专注于为每个用户构建网站或应用程序，而不仅仅是移动用户。\n- 确定你的移动用户是谁以及他们在寻找什么，并优先向他们展示这些内容，但不仅仅是这些内容。\n\
  - 构建使用基于标准的技术的网站，以便你的应用程序更具未来性。\n- 尽可能在更多的 Web 浏览器和设备上测试你的网站和应用程序。\n\n### 问答\n\n\
  **Q. 我熟悉 HTML，担心构建 HTML5 应用程序会遇到困难。在学习 HTML5 之前，我需要知道 HTML 4 吗？**\n\n**A.** 虽然了解\
  \ HTML 4 会让你后续进展更加顺利，但学习 HTML5 是一个非常直接的过程。尽管此书主要关注 HTML5，但通过复制提供的代码示例并查看配套网站（`www.html5in24hours.com/`）的源代码，你应该能够学会的。\n\
  \n**Q. 我已经有一个网站了，我想确保移动用户能够充分利用它。我该如何确保我提供了移动用户需要的内容？**\n\n**A.** 做到此最好的方法是询问他们。调查客户如何访问你的网站以及哪些部分对他们最有用，是了解他们需求的良好指标。但你也可以查看你的\
  \ Web 统计数据。如果你的网站没有分析工具，我建议安装一个，如 `Google Analytics` 或 `Piwik` 来跟踪人们在网站上查看的内容。在知道哪些热门页面之后，你可以确保这些页面在移动版本中易于访问。\n\
  \n你还可以使用 Web 分析工具查看哪些浏览器（`Firefox`、`IE`、`Chrome` 等）访问了你的网站，以及客户如何使用网站（他们点击的页面、离开的地方等）。通过这种方法，即使无法获得直接的客户反馈，你看到他们正在使用哪些功能并据此调整你的网站。\n\
  \n**Q. 你提到使用内容管理系统来维护移动网站。你有什么推荐的吗？**\n\n**A.** 我使用 `WordPress` 配合 `WordPress Mobile\
  \ Pack` 来维护许多针对移动用户和非移动用户的网站。\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学到的内容。在阅读答案之前尝试回答所有问题。答案请参见附录\
  \ A，“练习答案](#app01.html_app01)”。\n\n#### 测验\n\n**1.** 谁决定发起 HTML5，原因又是什么？\n\n**2.**\
  \ HTML5 文档的第一行是什么？\n\n**3.** 为什么 HTML5 如此适合移动应用程序开发？\n\n#### 练习\n\n**1.** 创建一个 HTML5\
  \ 页面。你的页面应该包含一个标题、大标题以及至少两或三段文本，以及 HTML5 doctype。第 3 小节，“使用 CSS3 为移动页面样式](#ch03.html_ch03)”涵盖了更多关于如何使用\
  \ CSS 为你的页面布局和外观设置样式的内容。\n\n**2.** 开始规划你的移动网站。列出你拥有的特别适合移动用户的内容。列出你需要为移动用户和非移动用户创建的内容。问问自己是否有资源来维护一个完全独立的移动网站，或者你是否将使用内容管理系统来维护它。\n\
  \n## 第 2 小节 用于移动开发的新 HTML5 标签和属性\n\n***\n\n***你将在这一小时中学到：***\n\n- 如何使用 HTML5 中的许多新标签和属性\n\
  - HTML5 的其他变化\n- 对 HTML5 的移动支持\n- 使用 HTML5 的原因\n\n***\n\nHTML5 有许多你可以用于移动设备的新标签和属性。在这一小时中，你将学习许多新标签以及它们的工作原理。新的智能手机和平板电脑正在推动\
  \ HTML5 的采用，本章将告诉你你可以做什么来参与这场革命。\n\n### 新的 HTML5 标签\n\nHTML5 为 HTML 规范添加了许多新功能，但最容易理解的是那些全新的标签。\n\
  \n#### 新的布局标签\n\n这些新标签大部分被称为“分节”（sectioning）元素，它们为 HTML 文档的布局提供了语义化。第 9 小节，“使用 HTML5\
  \ 分节和语义元素添加意义](#ch09.html_ch09)”更详细介绍了这些内容。\n\n这些标签是：\n\n- `<article>`: 文档或站点的`独立`部分。\n\
  - `<aside>`: 与页面或站点主体部分间要的内容。\n- `<figcaption>`: 图表的注说明文字。\n- `<figure>`: 从文本流中提取的插图或引用。\n\
  - `<footer>`: 文档或章节的页脚。\n- `<header>`: 文档或章节的页头。\n- `<hgroup>`: 标题组。\n- `<nav>`:\
  \ 导航区域。\n- `<section>`: 无法由上述任何类型定义的通用区块。\n\n你使用这些标签来定义 HTML 文档的特定区域。它们为你提供了附加 CSS\
  \ 样式（通常称为 CSS 钩子）的方法，并为你的页面部分提供了一些语义。\n\n***\n\n顺便说：使用语义标签提供意义\n\n语义标签告诉浏览器或用户代理（解析\
  \ Web 页面的工具的术语）关于标签内容的信息。换句话说，不仅仅定义文本块在页面流中的出现位置，语义标签（如 `<article>`）还告诉浏览器这些内容是独立文章的一部分。\n\
  \n***使用这些新的布局标签非常简单。事实上，许多网页已经使用 `<div>` 标签来实现了与这些标签相同的功能。例如，在许多网页设计中，你可能会看到页面的\
  \ `<div id=\"header\">`。现在使用 HTML5，你只需要写 `<header>`。\n\n***\n\n自己试试：转换为新的布局标签\n\n\
  你可能有很多 Web 页面的标记类似于下面：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01\
  \ Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<html lang=\"en\"\
  >\n<head>\n    <title>我的 HTML 4 双栏页面</title>\n```\n\n\n\n\n\n```html\n<link type=\"\
  text/css\" href=\"styles.css\">\n</head>\n<body>\n    <div id=\"main\">\n      \
  \  <div id=\"header\">\n            <h1>我的 HTML 4 双栏布局页面</h1>\n        </div>\n\
  \        <div id=\"nav\">\n            <ul>\n                <li><a href=\"#\">首页</a></li>\n\
  \                <li><a href=\"#\">产品</a></li>\n            </ul>\n        </div>\n\
  \        <div id=\"contents\">\n            <p>Lorem ipsum dolor sit amet, consectetuer\
  \ adipiscing elit, nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat.\
  \ Ut minim veniam, quis nostrud exerci tation ullamcorper suscipit lobortis nisl\
  \ ea commodo consequat. Duis autem vel eum iriure dolor in hendrerit in esse molestie\
  \ consequat, vel illum dolore eu feugiat nulla facilisis at accumsan et iusto odio\
  \ dignissim qui blandit praesent luptatum zzril dolore te feugait nulla facilisi.</p>\n\
  \        </div>\n    </div>\n    <div id=\"footer\">\n        <p>&copy; 2011 J Kyrnin</p>\n\
  \    </div>\n</body>\n</html>\n```\n\n如你所见，页面有一个页眉 `<div id=\"header\">`、一个页脚 `<div\
  \ id=\"footer\">`、一个导航区域 `<div id=\"nav\">` 以及一个页面主体内容区域 `<div id=\"contents\">`。\n\
  \n你可以轻松地将这些 `<div>` 标签转换为 HTML5 分段内容标签：\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n    <title>我的 HTML 4 双栏布局页面</title>\n    <link type=\"text/css\"\
  \ href=\"styles.css\">\n</head>\n<body>\n    <section id=\"main\">\n        <header>\n\
  \            <h1>我的 HTML 4 双栏布局页面</h1>\n        </header>\n        <nav>\n     \
  \       <ul>\n                <li><a href=\"#\">首页</a></li>\n                <li><a\
  \ href=\"#\">产品</a></li>\n            </ul>\n        </nav>\n        <section id=\"\
  contents\">\n            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing\
  \ elit, nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat. Ut\
  \ minim veniam, quis nostrud exerci tation ullamcorper suscipit lobortis nisl ea\
  \ commodo consequat. Duis autem vel eum iriure dolor in hendrerit in esse molestie\
  \ consequat, vel illum dolore eu feugiat nulla facilisis at accumsan et iusto odio\
  \ dignissim qui blandit praesent luptatum zzril dolore te feugait nulla facilisi.</p>\n\
  \        </section>\n    </section>\n    <footer>\n        <p>&copy; 2011 J Kyrnin</p>\n\
  \    </footer>\n</body>\n</html>\n```\n\n## 顺带一下：使用 `id` 属性\n\n你需要注意的一点是，新的 HTML5\
  \ 元素 `<header>`、`<footer>`、`<nav>` 代表的不仅仅是面的页眉、页脚和导航。页面可以包含多个此类元素，因此添加 `id` 属性（例如\
  \ `<nav id=\"mainNav\">`）通常有助于设置文档样式。第 9 小节 更加详细地描述了这些元素。\n\n### 额外的语义化元素\n\n你可以使用\
  \ HTML5 中的多个语义化元素来定义文档中的特定项目。语义化元素让浏览器或用户代理知道标签的内容具有文本含义之外的特定含义。第 9 小节 涵盖了这些标签。以下是\
  \ HTML5 中的新标签：\n\n- `<details>`：用于添加更多信息的控件。\n- `<figcaption>`：插图的说明。\n- `<figure>`：从文本流中提取的插图或引用。\n\
  - `<mark>`：被高亮或标记的内容。\n- `<meter>`：标量量表。\n- `<output>`：脚本或表单的结果。\n- `<progress>`：进度指示器。\n\
  - `<summary>`：`details` 元素的摘要或图例。\n- `<time>`：日期或时间。\n- `<wbr>`：可选换行。\n\n最容易理解的语义化元素之一是\
  \ `<time>` 元素。该标签表示内部的任何内容都是时间或日期。列出时间和日期允许用户代理执行如添加日历链接等操作。虽然目前没有浏览器支持 `<time>`\
  \ 标签，但图 2.1 显示了该标签可能如何使用。\n\n图 2.1. iPad 评估邮件中日期元素的示例。\n\n![image](img/02fig01.jpg)\n\
  \n### 注意！语义化标签可能没有任何作用\n\n对语义化标签的常见投诉之一是它们没有产生任何作用。这些标签旨在提供有关内容的额外信息，用户代理可能会选择直接对其置不管。这并不意味着标签是没用的。它们为\
  \ CSS 更高效地设置页面样式提供了钩子，并允许用户代理在未来对它们进行某种处理的可能性。此外，虽然你的浏览器可能对该标签不做任何操作，但另一个浏览器可能会广泛使用它。\n\
  \n不要仅仅为了使用语义化标签而添加内容。相反，当你看到文档中具有语义含义的部分时，请将其封装在该标签中。\n\n### 新的多媒体标签\n\nHTML5 中最受讨论的新标签之一是多媒体标签。以下标签允许你添加多媒体元素：\n\
  \n- `<audio>`：音频。\n- `<canvas>`：画布。\n- `<embed>`：嵌入内容。\n- `<source>`：音频或视频的源。\n\
  - `<track>`：音频或视频的轨道。\n- `<video>`：视频。这些标签允许你直接在 HTML 中添加多媒体元素，正如你使用 `<img>` 标签添加图像一样。`<canvas>`\
  \ 标签允许你在 HTML 内部绘制矢量图形、创建简单的游戏、动画化矢量图形，并在 HTML 内部控制所有这些内容。你不需要插件或额外的 XML 文件。正如图\
  \ 2.2 所示，iOS 浏览器已经支持 `<canvas>` 标签。\n\n图 2.2. 在 Android 平板上使用 `<canvas>` 标签创建一个蓝色正方形。\n\
  \n![image](img/02fig02.jpg)\n\n图 2.2 的 HTML 仅需一行：\n\n```html\n<canvas id=\"simple-square\"\
  \ width=\"800\" height=\"800\"></canvas>\n```\n\n在 `<head>` 中添加一些 JavaScript 来创建正方形：\n\
  \n```javascript\n<script type=\"text/javascript\">\n    function drawSquare () {\n\
  \        var canvas = document.getElementById('simple-square');\n        if (canvas.getContext)\
  \ {\n            var context = canvas.getContext('2d');\n            context.fillStyle\
  \ = \"rgb(13, 118, 208)\";\n            context.fillRect (2,2,798,798);\n      \
  \  } else {\n            // 为不支持 canvas 的浏览器放置代码\n            alert(\"此页面需要支持 HTML5\
  \ 的浏览器才能正常渲染。其他浏览器可能看不到任何内容\")\n        }\n    }\n</script>\n```\n\n### 注意：不要忘记加载脚本\n\
  \n如果你使用先的脚本为网页添加 `<canvas>` 正方形，请忘记修改你的 `<body>` 标签以加载脚本 `<body onload=\"drawSquare\"\
  >`。否则，`<canvas>` 将保持为空。\n\n第 10 小节 “使用 HTML5 Canvas 元素绘图](#ch10.html_ch10)”更详细地涵盖了\
  \ `<canvas>` 标签。\n\n\n\n\n\nHTML5 多媒体的伟大之处在于它的灵活性。你可以使用`<video>`和`<audio>` 标签来嵌入保存在计算机上的任何类型的视频或音频文件。并不是所有类型都能在浏览器中原生播放，但这种灵活性意味着当格式改进时，你的网页不需要更改为新的标签。\n\
  \n***\n\n在第 12 节，“HTML5 中的音频和视频](#ch12.html_ch12)”中，将详细介绍 HTML5 对视频和音频的支持。\n\n##\
  \ 新表单功能\n\nHTML5 表单的功能比 HTML 4 表单得多。你现在可以收集许多不同类型的表单字段数据，而标准的文本字段、下拉菜单以及 HTML 4\
  \ 表单常见的类型。\n\n通过 HTML5，你可以设置表单`<command>`标签为多个表单元素定义单个操作。你可以在 datalist>` 标签中提供预定义数据。通过`<keygen>`\
  \ 标签你可以生成公钥对来保持表单的安全。最棒的是`<input>` 标签现在有了 13 种新类型用于收集特定数据：\n\n• `<input type=color>`\n\
  • `<input type=date>`\n• `<input type=datetime>`\n• `<input type=datetime-local>`\n\
  • `<input type=email>`\n• `<input type=month>`\n• `<input type=number>`\n• `<input\
  \ type=range>`\n• `<input type=search>`\n• `<input type=time>`\n• `<input type=tel>`\n\
  • `<input type=url>`\n• `<input type=week>`\n\n这些新的输入类型将在每一个浏览器中工作。即使它们对标签没有执行任何特殊处理，所有浏览器都会显示一个用于收集数据的表单文本字段。正如在图\
  \ 2.3 所示，浏览器的支持仍在增长，但使用`<input type=\"tel\">`等类型将为那些支持它的浏览器和用户代理提供额外功能。\n\n**图 2.3.**\
  \ 左侧是 Safari 中的表单，右侧是 iPod touch 上相同的表单（放大后）。\n\n```\n![image](img/02fig03.jpg)\n\
  ```\n\n你将在第 13 节，“HTML5 表单](#ch13.html_ch13)”中学习更多关于 HTML5 表单的知识。\n\n## 改进国际化支持\n\
  \nHTML5 中的五个新标签有助于提高对非英语文档的支持。这些标签是：\n\n• `<bdi>`\n• `<meta charset>`\n• `<rp>`\n\
  • `<rt>`\n• `<ruby>`\n\n`<bdi>`标签允许你更改 HTML 中编写的文本方向。所以如果你有一份用英语编写的文档（从左到右的语言），并且你想添加一些希伯来语（从右到左的语言），你可以用`<bdi>`标签包裹希伯来语，以指示该段文本的方向发生了改变。\n\
  \n`<meta charset>`标签允许你定义网页正在使用的字符编码。例如，要定义你的 HTML 使用`utf-8`字符集，你会写道：\n\n```\n<meta\
  \ charset=\"utf-8\">\n```\n\n最后，如果你用双字节语言（如中文和日语）编写 HTML，你可能已经熟悉 ruby 字符（注音字）。这些是放置在字符旁的小注释，通常用于指示读音。`<ruby>`标签指示\
  \ ruby 字符范围，并可以包含用于 ruby 文本的`<rt>`和用于 ruby 文本周围括号的`<rp>`。这里有一个使用伪代码的示例：\n\n```\n\
  <ruby><rp><rt>ruby text</rt></rp></ruby>\n```\n\n## 新的 HTML5 属性\n\nHTML5 中的许多新属性扩展了它们关联的标签。一组新的事件属性允许你在网页上发生更多操作时将脚本与操作相关联。此外，你还可以使用适用于所有\
  \ HTML5 元素的新全局属性。\n\n属性写在 HTML 中，位于标签名后面，用空格分隔，并位于大于号和小于号之间。如果属性可以有值，则该值通过等号连接到属性上。如果值中存在空格，则你应该用引号包裹整个值。例如：\n\
  \n```\n<elementname attributename=value>\n```\n\n或者：\n\n```\n<element name=\"value\
  \ value\">\n```\n\nHTML5 中还有不需要值的布尔属性（Boolean attributes）。相反，如果这些属性存在，则应用该属性；如果它们不存在，则不应用该属性。以下是一个示例：\n\
  \n```\n<elementname attribute>\n```\n\nHTML 4 中广为人知的布尔属性是复选框上的`checked`属性：\n\n```\n\
  <input type=checkbox checked>\n```\n\n事件属性指示页面加载时可能发生的事件。新的 HTML5 事件属性包括：\n\n• `onabort`—在操作被中止时触发。\n\
  • `onbeforeonload`、`onbeforeonunload`和`onunload`—在元素加载或卸载之前以及元素卸载时触发。\n• `oncontextmenu`—在触发右键菜单时触发。\n\
  • `ondrag`、`ondragend`、`ondragenter`、`ondragleave`、`ondragstart`和`ondrop`—这些在发生各种拖放操作时触发。\n\
  • `onerrror`和`onmessage`—在触发错误或消息时触发。\n• `onscroll`—在用户滚动时触发。\n• `onresize`—在元素调整大小时触发。\n\
  \n你可以在几乎每个元素上使用这些事件属性。HTML5 还增加了新的全局属性。全局属性是：\n\n• `contenteditable`\n• `contextmenu`\n\
  • `draggable`\n• `hidden`\n• `spellcheck`\n\n### 对 HTML 4 标签和属性的更改\n\n对现有标签和属性进行了许多更改，以赋予它们更广泛的功能或更改其功能，更清晰地定义其含义和范围，或提供语义定义。\n\
  \n例如，在 HTML 4 中没有语义特征的一些标签在 HTML5 中被赋予了语义含义，包括：\n\n• `<b>`—通常显示为粗体的文本。\n• `<i>`—通常显示为斜体的文本。\n\
  • `<hr>`—文本中的段落级主题分隔符。\n• `<s>`—不再准确或相关的的内容。\n• `<small>`—法律文件中的细小字字体。\n\n一些标签的含义也发生了变化，或增加了新的用途：\n\
  \n• 你现在可以编写不带属性的`<a>`标签。在这种情况下，它被视为链接的占位符。\n• `<address>`标签现在是区块内容的一部分（参见第 9 节）。\n\
  • `<cite>`标签现在表示作品标题，但你不能用它来标记姓名。\n• 使用`<menu>`标签你可以创建工具栏和上下文菜单。\n\n一些元素的功能或描述也发生了更改或删除。\n\
  \n\n\n\n\n- `<dl>` 标签现在是一组键值对列表，不应被用于显示类似脚本执行的对话框。\n- 在显示 `<label>` 元素时，用户代理不应将焦点从标签移动到控件，除非该操作是平台的标准行为。\n\
  - `<strong>` 元素现在表示“重要”而非“强强调”。\n- 你不能在`<head>` 元素中包含`<object>` 元素了。\n\n大多数 HTML\
  \ 4 属性保持不变，但你不再必须在`<script>` 和 `<style>` 标签上编写 `type` 属性，除非你正在使用非标准的脚本（即非 JavaScript）或样式表（即非\
  \ CSS）。\n\n存在某些属性，虽然它们是被允许的，但 HTML5 强烈建议你针对以下情况寻找替代方案，如后文所示：\n\n- 如果你在 `<img>` 标签上包含\
  \ `border` 属性来关闭边框，你必须将其赋值为“0”。使用 CSS（例如 `img {border: none;}`）替代会更好。\n- 如果你在 `<script>`\
  \ 标签上使用 `language` 属性，它必须写为“javascript”（不区分大小写），且不能与 `type` 属性冲突。简单地省略此属性更好，因为它没有实际用途。\n\
  - 如果你在 `<a>` 标签上使用 `name` 属性，你应该将其改为使用 `id` 属性，因为 `name` 属性已经过时。\n- 如果你编写复杂的表格并想使用\
  \ `summary` 属性提供摘要，你仍然可以。然而，将该摘要放在周围的文本中、表格的 `<caption>` 内部、标题内部 `<details>` 元素，或者表格所属的\
  \ `<figure>` 或 `<figcaption>` 内部会更好，因为这样更具可访问性。\n- 如果你使用带有 `width` 属性的图像，不能再使用百分比作为宽度了。\n\
  \n此外，你不应再使用某些元素和属性；它们在 HTML5 中被视为过时。本节不会详细介绍所有这些内容，但如果你考虑使用的元素或属性不在 附录 B 的 HTML5\
  \ 元素和属性列表中，你应该考虑使用其他选项。\n\n最明显的遗漏是：\n\n- `<frame>`、`<frameset>` 和 `<noframes>`——框架（Frames）不再存在于\
  \ HTML5 中，因此你无法使用它们。\n- `<basefont>`、`<big>`、`<center>`、`<font>`、`<strike>`、`<tt>`\
  \ 和 `<u>`——这些标签已被移除，因为它们纯粹用于演示，其功能可以通过 CSS 更好地处理。\n- `<acronym>`——该标签被移除是因为它容易引起混淆。请使用\
  \ `<abbr>` 代缩写。\n- `<applet>`——该标签已过时，取而代之的是 `<object>`。同样，`<dir>` 标签已被 `<ul>` 取代。这些移除是因为替代元素更具可访问性或更容易使用。\n\
  \n## HTML5 中 HTML 语法的更改\n\nHTML5 相比 HTML 4 并没有大量的语法变化。你仍然使用大于号和小于号字符包围标签，仍然以 doctype\
  \ 开始文档，并且仍然将文档内容封装在标签内部。\n\n大多数人会注意到的最大变化是 doctype。正如第一节中提到的“通过 HTML5 改进移动 Web 应用开发”那样，它已经过彻底的简化。你只需要写：\n\
  \n```html\n<!doctype html>\n```\n\n此外，它可以全小写、全大写，甚至根据你的喜好混合大小写。\n\n如果你使用无法使用短 doctype\
  \ 的 HTML 生成器，可以在 doctype 中添加一个旧版本字符串，如下：\n\n```html\n<!DOCTYPE html SYSTEM 'about:legacy-compat'>\n\
  ```\n\n与 HTML 4（而非 XHTML）一样，你可以以任何大小写编写标签。`<html>` 标签与 `<HTML>` 和 `<hTmL>` 相同。大多数设计师使用小写，因为更容易阅读。除非值中存在空格，否则你不需要为属性加引号。但是，如果你认为以后会将\
  \ HTML 转换为 XHTML，请考虑使用小写标签名和属性，并继续为所有属性加引号。\n\n## HTML5 标签和属性的移动支持\n\n旧移动设备（如非智能手机和旧\
  \ PDA）不支持 HTML5，而且可能永远不支持。但现实是，移动设备正以惊人的速度超越这些设备。\n\n今天面的大多数智能手机和平板都具有良好的（尽管并非完美）HTML5\
  \ 支持。Android 和 iOS 设备（以及诺基亚、Palm 和 Rim 的手机和平板电脑）都使用基于 WebKit 浏览浏览器，该浏览器具有良好的 HTML5\
  \ 支持，并且每天都在改进。\n\n有趣的是，Windows 移动设备是这一类别中的落后者。直到 2010 年 8 月，微软还表示不会在其 Windows 7\
  \ 移动设备上支持 HTML5。但这种情况在 2011 年 3 月发生了变化，当时微软表示 HTML5 浏览器正计划在其移动平台上发布。\n\n遗憾的是，设计一个网页或应用程序，在一个浏览器中进行测试，并期望它在所有设备上运行是不可能的。但移动设备（尤其是\
  \ Android 和 iOS）将驱动 HTML5 的开发。这些设备已经对 HTML5 有广泛的支持，并且支持不断增加。\n\n## HTML5 对移动 Web\
  \ 开发的益处\n\n记住，并不是每个移动 Web 浏览器都支持 HTML5。如前提到的，旧设备、非智能手机和平板电脑没有良好的 HTML5 支持。但对于那些支持的设备，转向\
  \ HTML5 进行移动开发有许多极佳的理由。\n\n### HTML5 包含了良好的 API\n\nHTML5 引入了应用程序接口（即 `APIs`），用于视频、音频、Web\
  \ 应用程序、页面内容编辑、拖放以及暴露浏览器历史。这些在移动设备上运行良好良好，因为这意味着移动浏览器不需要插件或加载项即可获得这些功能。如果浏览器符合 HTML5\
  \ 标准，它将支持这些 `APIs`。本书将在其他章节中介绍如何使用某些 `APIs`。\n\n此外，HTML5 和开放 Web 标准提供了地理定位、Web 存储和离线\
  \ Web 应用程序的 `APIs`，非常适合移动设备。大多数智能手机和平板都有 GPS 或其他确定位置的方法可以使用地理定位功能。Web 存储有助于将网页转换为带有保存数据的应用程序，当手机未连接互联网时，离线应用程序至关重要。事实上，移动设备比大多数桌面电脑更需要离线功能。\n\
  \n### HTML5\n\n进入移动开发可能看起来很高。对于普通 Web 开发者来说，Objective C 几乎无法理解。但开发者已经熟悉 HTML 4、CSS\
  \ 和 JavaScript，通过这三种语言，你可以使用 HTML5 和开放 Web 标准构建稳健的应用程序。\n\n这意味着如果你以前构建过任何网页，你可以在短时间内（实际上是\
  \ 24 小时或更短）上手移动应用程序，因为你已经了解了相关语言的基础。\n\n### 客户更偏好 Web 应用程序\n\n在 2010 年底的一项研究中，在调查的几乎每一个类别中（游戏、音乐和社交媒体除外），人们更倾向于使用移动浏览器而不是独立的\
  \ App。¹\n\n虽然应用程序变得越来越流行是事实，但 Web 应用程序提供了兼者的优点。你可以创建一个在移动浏览器中运行的 HTML5 Web 应用程序，让用户对其进行书签并使用熟悉的工具，但它同时也包含了典型应用程序的功能和特性。\n\
  \n\n\n\n此外，当你为移动设备构建 HTML5 Web 应用程序时，该程序也可以在非移动设备的 HTML5 浏览器上运行。取决于你编写代码的方式，你可能不需要为标准\
  \ Web 浏览器和移动设备创建额外的样式表。维护这种样式表比为每一个新出的平台都创建一个独立的应用程序要容易得多。\n\n#### 总结\n\n在这一小时中，你学习了新的\
  \ HTML5 标签和属性，以及在 `HTML5` 中发生变化的 HTML 4 标签和属性。你还学习了 HTML5 添加的语法变化。新标签是 HTML5 语言变化的主要部分，你已经学习了将它们添加到文档中的基础知识。\n\
  \n本章还涵盖了 HTML5 适用于移动设备的一些原因，包括添加到标准中的 API、这些变化如何影响 HTML 应用程序的，以及客户在移动设备上（以及设备外）的使用模式。\n\
  \n### 问答\n\n**Q. 我可以去哪里学习更多关于新的 HTML5 标签和属性？**\n\n**A.** 本书的许多新标签和属性将在随后的章节中讨论。但你随时可以访问\
  \ W3C 网站 `[www.w3.org/](http://www.w3.org/)` 获取最新的信息。\n\n**Q. 我现在就想开始使用 HTML5 标签，如果浏览器不支持它们，我该如何判断我写得是否正确？**\n\
  \n**A.** Web 浏览器的支持长期以来一直是大多数 Web 开发者的困扰，HTML5 也没有改变这种情况。但 W3C 提供了一个实验性的 HTML5 合规性检查器（`[`validator.w3.org/`](http://validator.w3.org/)`），你可以在\
  \ [`http://html5.validator.nu/](http://html5.validator.nu/)` 找到另一个高度实验性的验证器。使用验证器并不等同于测试，但它会告诉你你使用标签是否正确。\n\
  \n**Q. 如果有很多客户使用 Internet Explorer 8 或更早版本怎么办？这些新的 HTML5 标签在他们的浏览器中能用吗？**\n\n**A.**\
  \ Internet Explorer 8 是唯一不支持 HTML5 标签的现代浏览器。如果你需要支持此浏览器，请考虑使用 HTML Shiv 等变通方案。要使用它，可以将此代码段添加到文档的\
  \ `<head>` 中：\n\n```\n<!—[if lt IE 9]>\n<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n<![endif]—>\n```\n\n### 工作坊\n\n工作坊包含测验题，帮助你处理在本章中学学的内容。在阅读答案之前，尝试回答所有问题。请参阅\
  \ 附录 A，“测验答案](#app01.html_app01)”获取答案。\n\n#### 测验\n\n**[1].** HTML5 中包含哪些新的布局标签？\n\
  \n**[2].** 什么让 `section` 标签具有语义化，或者它根本没有语义化？（等一下，原文是`<section>`，我将其视为标签：`<section>`）\n\
  \n**[3].** 哪些是允许拖放操作的新属性？\n\n#### 练习题\n\n**1.** 创建一个包含本章讨论的分节元素的 HTML 页面。包含至少一个\
  \ `<section>`，`<header>`,`<nav>` 和 `<article>`。\n\n**2.** 在移动设备上打开你的 HTML5 页面。最简单的方法是将页面上传到\
  \ Web 服务器上，然后在手机或平板电脑上访问它。如果你同时拥有 Android 和 iOS 设备，尝试在两个设备上查看，以养成测试的习惯。\n\n## 第\
  \ 3 小时 使用 CSS3 为移动页面设置样式\n\n***在本小时你将学习：***\n\n• 如何创建 CSS 样式表\n• 使用 CSS3 开发应用程序的强大特性\n\
  • 根据设备属性更改样式的媒体查询\n• 如何使用特殊的元标签来让移动页面更美观\n\n层叠样式表（CSS）是移动 Web 开发的重要部分。在这一小时中，你将学习如何编写\
  \ CSS 并使用它为移动页面设置样式，包括使用 `media-queries` 为特定设备构建样式表。你还将学习一些会影响移动设备显示内容的元标签（meta\
  \ tags）。\n\n### CSS 快速介绍\n\n你使用层叠样式表（CSS）来定义 HTML 文档的外观。你可以为打印、网页甚至特定的移动设备为 HTML\
  \ 设置样式。相同的 HTML 内容在这些地方中也可以以完全不同的方式显示。\n\nCSS 已经存在了 10 多年，并被大多数浏览器和移动设备广泛支持。因此，理解如何使用\
  \ CSS 定义你的 Web 应用程序外观是非常重要的。\n\n### 创建 CSS 样式表\n\nCSS 由一个或多个带有样式属性的选择器（selectors）组成。例如，要更改段落的颜色，你可以写：\n\
  \n```\np {\n    color: red;\n}\n```\n\n选择器是 `p`，样式属性（在大括号内）是 `color: red;`。\n\n\
  要添加第二个选择器，只需用逗号将其隔开：\n\n```\np, .redText {\n    color: red;\n}\n```\n\n完成样式后，你可以通过三种方式之一将其应用于\
  \ Web 页面：\n\n• 内联在标签本身中\n• 嵌入在页面的 head 中\n• 作为外部样式表放在单独的文档中\n\n最简单的方法是内联。内联的样式仅对它们所在的页面有效。例如，要给段落的文字上色，你可以写：\n\
  \n```\n<p style=\"color: red;\">\n```\n\n内联样式的问题是它们只作用于所在的页面。如果你在另一个页面中需要相同的样式，就必须将它们复制并粘贴到每个面的\
  \ head 中。将内联样式仅用于测试以及应用于单个页面的微小更改是最佳做法。\n\n嵌入样式位于文档的 `<head>` 中。你使用`<style>` 标签并如之前所述编写你的样式。例如，这里有一个带有嵌入样式的简单页面：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>嵌入样式示例</title>\n    <style>\n\
  \        p {\n            color: red;\n        }\n    </style>\n</head>\n<body>\n\
  \    <p>这个段落中的文字将是红色的。</p>\n    <p>这个段落也是如此。</p>\n</body>\n</html>\n```\n\n将样式添加到文档的最佳方法是使用外部样式表。创建外部样式表：\n\
  \n**1.** 打开新文档。\n**2.** 像之前的嵌入样式示例一样编写样式，但不要包含周围的`<style>`标签。\n**3.** 将该文件保存为具有\
  \ `.css` 名的样式表，例如 `styles.css`。\n\n这是一个包含额外样式以及红色段落的样式表：\n\n```css\nhtml, body {\n\
  \    margin:0;\n    padding:0;\n    border:0;\n}\n\nbody {\n    font: 1em/1.25 Arial,\
  \ Helvetica, sans-serif;\n}\n\np {\n    color: red;\n}\n```\n\n编写样式表文档是不够的；你还需要将其附加到\
  \ Web 页面。要做到这一点，在文档的 head 中添加一个指向该样式表的`<link>` 标签。例如：\n\n```\n<link href=\"styles.css\"\
  \ rel=\"stylesheet\">\n```\n\n*顺便说*：外部样式表可以加快你网站的下载速度。\n\n\n\n\n只要你的 HTML 文件与样式表文件位于同一个文件夹中，当页面加载时，它就会加载所有的样式。\n\
  \n## 使用 CSS 更改字体\n\n大多数网页设计师最初想要调整的内容之一就是网页上使用的字体，特别是标题的字体。正如你从图 3.1 所示，`<h1>` 标题虽然是网页的重要部分，但在未设置样式的情况下，它们往往是又大、又粗且难看的。\n\
  \n**图 3.1。** 在 Android 平板电脑上显示带有 `<h1>` 标题的示例网页。\n\n![image](img/03fig01.jpg)\n\n\
  你可以使用多种样式属性来对页面上的标题和其他文本的字体和文本进行样式化，包括：\n\n- `font-family`—字体族\n- `font-size`—字体大小\n\
  - `font-weight`—使字体加粗或不加粗\n- `font-style`—使字体倾斜或不倾斜\n- `font-variant`—设置小型大写字母\n\
  - `font`—一种快捷样式，可在一行内设置上述任何或所有样式\n\n虽然上述所有属性都值得了解，但你应该关注的是 `font` 属性。正如提到的，这允许你通过一个属性对大多数字体样式进行样式化。\n\
  \n使用 `font` 属性的语法为：\n\n`font: font-style font-variant font-weight font-size/line-height\
  \ font-family;`\n\n大多数字体样式都是直观的。如果你想让文本变为倾斜，只需将 `font-style` 设置为 `italic`（斜体）；如果你想让文本加粗或高度为\
  \ 12 像素，可以通过 `font-weight`（bold）或 `font-size` 样式属性添加。然而，许多初学者在 `font-family` 样式属性上会遇到困难。\n\
  \n当你为 HTML 文档选择字体时，必须依赖客户机器上的字体库。换句话说，如果你想使用来自 [FontSquirrel.com](http://FontSquirrel.com)\
  \ 的免费字体等花字体，你必须希望客户也下载了该字体。否则，浏览器将选择字体，这可能会导致不符合预期的结果。\n\n为了确保你的网页看起来像你想要的样子，你可以使用你想要显示的字体列表，并按照你希望使用的顺序进行排列。这被称为字体栈（font\
  \ stack）。你可以在字体栈中根据需要列出尽可能或尽可能少的字体，但你应该始终以通用字体族结束列表，如下：\n\n- cursive\n- fantasy\n\
  - monospace\n- sans serif\n- serif\n\n**你知道吗？** 始终包含常用字体\n\n大多数计算机上都可以找到一些常用字体。即使你不将这些字体作为字体栈中的首选，至少使用一或两个也是一个好主意。常用字体包括\
  \ Arial、Helvetica、Comic Sans、Courier、Georgia 和 Times New Roman。\n\n网页排版不仅仅涉及字体，第\
  \ 11 小节“HTML5 中的字体与排版”更详细地介绍了新的 HTML5 网页排版功能。\n\n## 使用 CSS 进行布局\n\nCSS 是网页布局不可比拟的工具，你的布局选择很大程度上取决于你的想象力。使用\
  \ CSS 进行布局的两种基本方法是浮动（floating）和绝对定位（absolute positioning）。*浮动*依赖于 CSS 属性 `float`\
  \ 将具有定义宽度的元素并排放，而*绝对定位*则是将元素放置在页面上的精确位置。\n\n为了布局你的网页，你必须理解网页是如何构建的。文档中的每个元素都是正方形的，即使你看不见。事实上，看到这一点最简单的方法是使用\
  \ `border` 样式属性在元素周围画一个框，如下所示：\n\n```css\nborder: 1px solid black;\n```\n\nCSS 布局的一个大部分是围绕元素创建的框。事实上，它是如此重要，以至于\
  \ CSS 盒模型（box model）。网页上的每个框都有内容区域、内边距（padding）、框（border）和外边距（margin）。在图 3.2 中，你可以看到这些部分是如何组合的。通过\
  \ CSS，你可以影响它们的所有宽度或厚度。\n\n**图 3.2。** CSS 盒模型。\n\n![image](img/03fig02.jpg)\n\n要使用\
  \ CSS 更改盒模型，可以使用这些样式属性：\n\n- `margin`\n- `padding`\n- `border`\n- `height`\n- `width`\n\
  \n在网页元素上定义了盒模型后，你可以使用 CSS 浮动将元素放置在页面上的任何位置。\n\n## 尝试自己：布局 HTML5 网页\n\n当你构建 HTML5\
