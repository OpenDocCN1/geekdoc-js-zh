    # # BONE CATCHER


    In this game, the player moves a dog left and right to catch a bone as it drops
    down the screen. Arrow key presses make the dog move left and right. The game
    uses some of the same functions as the previous program to set coordinates and
    create random numbers. Both the bone and dog move at intervals of 50 pixels. The
    complete code for the game is listed on page 29.


    # ## STEP 1 – PLANNING


    The score is shown in an HTML paragraph element.


    A timer will move the bone every 200 milliseconds.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_27_0.png)


    It then checks if the dog and bone coordinates match. If they do, this means the
    dog has caught the bone, making the score increase.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_27_1.png)


    Variables count the score, number of lives left, and x and y coordinates of the
    dog and the bone.


    When there are no lives left, the game ends.


    Pressing the left and right arrow keys will change the dog''s x coordinates, and
    therefore the position of the dog.


    Game over! You scored: 5


    Click **OK** to play again.


    # ## STEP 2 – FIND AN IMAGE


    Find an image of a dog and an image of a bone to use. Save them in the same folder
    as your HTML file as **dog.png** and **bone.png**.


    +   - Go online and search for a suitable image.

    - Right-click one image.

    - Click **Save Image As...**

    - Navigate to your Documents folder, then click **Save**.'
