  md: '# STEP 5 - START THE SCRIPT


    ⇒ Now that we have defined the elements that go on the page, we need to begin
    the JavaScript. At the start of this game we need to:


    +   - create the variables we need

    - define some functions to get and set coordinates

    - define a simple function to generate random numbers

    - start a timer.


    ```

    <script>

    var score=0, lives=3, dogX=6, dogY=10, boneX=8, boneY=0;

    function setLeft(id,x){document.getElementById(id).style.left=x+"px";}

    function setTop(id,y){document.getElementById(id).style.top=y+"px";}

    function randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}

    var gameTimer=window.setInterval(moveBone, 200);

    document.onkeydown=handleKeys;

    ```


    Start the Javascript section.


    Create variables to store the score, number of lives, and dog and bone coordinates.


    Define functions to set any element''s coordinates.


    Define a function that returns a random number between two values.


    Set the timer to run a function called **moveBone** every 200 milliseconds (5
    times per second).


    Run a function called **handleKeys**, whenever a key is pressed on the keyboard.


    # LISTENING TO THE KEYBOARD


    In this game, the dog will move when the arrow keys are pressed on the keyboard.
    To do this, we need to set up something called an event listener, which will “listen”
    to the keyboard and run some code if a key is pressed. This is similar to the
    **onclick** event listener explained on page 12. Look at line 14:


    ```

    document.onkeydown=handleKeys;

    ```


    The event that the program is waiting (listening) for. Other keyboard events include
    **onkeyup** and **onkeypress**.


    The name of the function to run when the event takes place.


    > Remember, the asterisk * is used to mean “multiply by.” The mathematical symbol
    for this is x.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_29_0.png)'
