    # WHY USE JAVASCRIPT INSIDE HTML CODE?


    Although we are coding with JavaScript, we need to put our file inside some HTML
    code to make it work.

    HTML stands for HyperText Markup Language and is the language used to build web
    pages.


    HTML is used to describe what objects, or *elements*, are shown on a web page.
    If you are creating a simple game, you need to use HTML to add an image and some
    text to show the score. However, HTML can''t make the image move or the score
    change.


    JavaScript is added to tell the image to move around when different keys are pressed,
    or when the mouse is clicked. It can also be used to display the score and make
    it change. We need to use both HTML and JavaScript to make an interesting game.
    JavaScript was designed to be added to HTML pages to make them more interactive.


    You will learn about using different elements of HTML with JavaScript as you work
    through the programs in this book.'
