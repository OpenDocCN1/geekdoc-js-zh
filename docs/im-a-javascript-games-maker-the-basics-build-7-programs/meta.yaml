    # INTRODUCTION


    Learn how to code your own fun games using *JavaScript*. JavaScript is a language
    originally used to make web pages more interactive. It is now used to create online
    games that will run on both computers and mobile devices. Enjoy creating the simple
    programs in this book and you will be on your way to becoming a JavaScript expert!


    > TIPS TO REDUCE BUGS


    *   If you are making your own web page, spend time drawing a diagram and planning
    it before you start. Try changing values if things don''t work, and don''t be
    afraid to start again—you will learn from it.

    *   Bugs are errors or mistakes in your code that stop your program from working
    properly. Looking for those errors is called *debugging*! Make a very simple web
    page and get a friend to change one line of code while you''re not looking. Can
    you fix it?

    *   When things are working properly, stop and look through your code so you understand
    each line. Experiment and change your code, and try out different values. To be
    good at debugging, you need to understand what each line of your code does and
    how it works.


    ```

    mygame.html

    1 <script>

    2 alert(''Press any key to start'')

    3 </script>

    ```


    You could use a plain text editor to create your code.


    This will work fine but can be quite touchy, because the software won''t give
    you any help.


    The best thing to use for the activities in this book is an offline *HTML* editor.
    This will support you as you type your code, but also give you the opportunity
    to learn the JavaScript code.


    There are two separate windows that you''ll be using:


    ```

    Sublime Text

    1 <script>

    2 var score=0;

    3 var seconds=0;

    4 function moveIt(){

    5 score++;

    ```


    The text editor to enter your JavaScript code.


    ```

    Web Browser

    SCORE: 7

    ```


    The browser to view the program.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_6_0.png)


    There are many different browsers you can use. We recommend using Google Chrome
    for the activities in this book. Make sure you have the latest version installed
    on your computer before you start.


    You will also learn some HTML in this book. HTML is the language used to build
    web pages. JavaScript is the language that brings those pages to life!


    **Note:** Words in *italics* appear in the glossary on page 30.'
  - '[PAGE 7]


    # > GETTING STARTED


    You need a text editor to start coding in JavaScript. There will probably be a
    simple text editor already on your computer, called Notepad (if you have Windows)
    or TextEdit (on a Mac). This will be sufficient for you to get started, but it
    will be much easier to create JavaScript if you download a more powerful text
    editor. In this book, we will use a text editor called Sublime Text. There are
    many others you could download, such as Brackets or Notepad++. All of these are
    free for you to try out.


    # STEP 1 - FIND THE SUBLIME TEXT WEBSITE


    Open your web browser and visit www.sublimetext.com


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_0.png)


    # STEP 2 - START THE DOWNLOAD


    Click the Download button near the top of the web page.

    Choose which version of Sublime Text you need. If you are not sure, then ask an
    adult to help you find the correct version. If you are using a Mac, click the
    Apple menu, then About. On a PC, click the Start menu, select System, and click
    About.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_1.png)


    # STEP 3 - INSTALL THE SOFTWARE


    Some web browsers will then ask you to run the installation program. Choose Run.

    If this does not happen, don''t panic. The installer file should have been downloaded
    to your computer. Look in your Downloads folder for it. Double-click it to start
    installing your new text editor. You should get a big white or gray box giving
    you instructions on what to do next. Follow these instructions to complete the
    installation.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_2.png)'
- md: "# STEP 4 – RUN SUBLIME TEXT\n\n**On a PC:**\n- Click Start > Programs > Sublime\
    \ Text. Or, just click Sublime Text if it appears in the Recently added section.\n\
    \n**On a Mac:**\n- Click Finder.\n- Click Applications.\n- Make a shortcut by\
    \ dragging Sublime Text from Finder onto your dock at the bottom of the Desktop.\n\
    - Click the Sublime Text icon.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_0.png)\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_1.png)\n\n# STEP 5 – SAY HELLO\n\n\
    Carefully type this into lines 1, 2, and 3 of your text editor. Sublime Text should\
    \ automatically indent lines for you, but if it doesn't, make sure you indent\
    \ lines of code exactly as shown.\n\n```\n1  <script>\n2      alert(\"Hello\"\
    )\n3  </script>\n```\n\nMark the start of a JavaScript section.\nShow a message\
    \ box saying **Hello**. The code will automatically indent.\nMark the end of the\
    \ JavaScript section.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_2.png)\n\n\
    # STEP 6 – SAVE YOUR CODE\n\n- Click **File > Save**.\n- Save to your **Documents**\
    \ folder.\n- Type **hello.html** as the filename.\n\n# STEP 7 – VIEW YOUR PAGE\n\
    \n- Open your **Documents** folder.\n- Find the **hello.html** file and double-click\
    \ it.\n- Your web page should now load in your normal web browser.\n- You should\
    \ get a message saying **Hello**.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_3.png)\n\
    \n# WHY USE JAVASCRIPT INSIDE HTML CODE?\n\nAlthough we are coding with JavaScript,\
    \ we need to put our file inside some HTML code to make it work. HTML stands for\
    \ HyperText Markup Language and is the language used to build web pages.\n\nHTML\
    \ is used to describe what objects, or *elements*, are shown on a web page. If\
    \ you are creating a simple game, you need to use HTML to add an image and some\
    \ text to show the score. However, HTML can't make the image move or the score\
    \ change.\n\nJavaScript is added to tell the image to move around when different\
    \ keys are pressed, or when the mouse is clicked. It can also be used to display\
    \ the score and make it change. We need to use both HTML and JavaScript to make\
    \ an interesting game. JavaScript was designed to be added to HTML pages to make\
    \ them more interactive.\n\nYou will learn about using different elements of HTML\
    \ with JavaScript as you work through the programs in this book.\n\n# MATH QUIZ\n\
    \nNow let's code a simple math quiz. This will be a chance for you to get to know\
    \ JavaScript a little better. If you've done some coding before, you will be familiar\
    \ with the idea of *variables* and IF statements. We will look at how to use these\
    \ concepts in JavaScript.\n\n> The syntax is very important in JavaScript. Syntax\
    \ means making sure all the commands and symbols are typed correctly.\n\n# STEP\
    \ 1 – START YOUR TEXT EDITOR\n\n**On a PC:**\n- Click Start > Programs > Sublime\
    \ Text.\n\n**On a Mac:**\n- Click the Sublime Text icon (see page 5 for help).\n\
    \n# STEP 2 – ENTER THE CODE\n\nCarefully type in your math quiz questions. For\
    \ the question \"What is 8 x 8?\" (Answer: 64), add the following code into your\
    \ text editor for lines 1 to 6:\n\n```\n<script>\nanswer=prompt(\"What is 8 x\
    \ 8?\");\nif(answer==64){\n    alert(\"Correct!\");\n}\n</script>\n```\n\nStart\
    \ JavaScript.\nAsk a question.\nIf the answer is 64, then: Show a message box\
    \ saying **Correct!**\nEnd JavaScript.\n\nYour text editor may indent your lines\
    \ of code automatically. If it does not, make sure that you indent your lines\
    \ of code as shown in the examples. Just as you end a sentence with a period,\
    \ you should end JavaScript statements with a semicolon(;).\n\n# STEP 3 – SAVE\
    \ YOUR CODE\n\n- Click File > Save and type **quiz.html** as the filename.\n-\
    \ Make sure you save it in your **Documents** folder.\n\n# STEP 4 – VIEW YOUR\
    \ WORK\n\n- Open your **Documents** folder and double-click the **quiz.html**\
    \ file. Your program should run in your web browser.\n- Test your page by answering\
    \ correctly. You should get the \"Correct!\" message. Then, refresh your page\
    \ and give the wrong answer. You should not receive the message.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_10_0.png)\n\
    \n# STEP 5 – RANDOMIZE!\n\n- Change your code, in the following way, so *random\
    \ numbers* are picked for the question:\n\n```\nvar a = Math.round(Math.random()\
    \ * 10);\n```\n\n```\n1 <script>\n2     var a=Math.round(Math.random()*10);\n\
    3     var b=Math.round(Math.random()*10);\n4     answer=prompt(\"what is \"+a+\"\
    \ x \"+b+\"?\");\n5     if(answer==a*b){\n6         alert(\"Correct!\")\n7   \
    \  }\n8 </script>\n```\n\nMake variable a using the code example above. Following\
    \ the first example, make a variable **b**.\nUse the + sign to join the string\
    \ \"what is\" to the value stored in the variable a.\nCheck to see if the answer\
    \ entered is the same as a multiplied by (*) b.\n\n# STEP 6 – SAVE AND REFRESH\n\
    \n- Save your new code.\n- **Refresh** your browser to see the changes. Each time\
    \ you refresh it, you should get a new random question.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_10_1.png)\n\
    \n# KEY CONCEPTS\n\n## VARIABLES\n\nVariables are part of a program that stores\
    \ information. Each variable is given a name that is used to point to a part of\
    \ the computer's memory. A value is then stored in that part of the memory. In\
    \ this quiz, variables are used to store the random numbers and the user's input.\n\
    \n## IF STATEMENTS\n\nNormally, each line of code works one after the other. An\
    \ IF statement works differently. It checks if a particular condition, such as\
    \ the correct answer, is true before running a certain piece of code.\n\n# CUSTOMIZE\n\
    \n- Change your code so it asks harder questions using bigger numbers.\n\n# RANDOM\
    \ COLORS\n\nIn this activity, we will make a simple program that randomly sets\
    \ the color of the screen.\n\n## STEP 1 – PLANNING\n\n- Make a list of four colors\
    \ to choose from.\n- Start a timer that changes the color every 1000 milliseconds\
    \ (which is every one second).\n- To change the color:\n  - pick a random number\
    \ from 0 to 3. In this program, 0 is a number.\n  - use the random number to pick\
    \ one of the colors\n  - set the background color to the chosen color.\n- Make\
    \ a special section of code called a function that will follow the steps above\
    \ to change the color. By giving the function a name—changeColor()—you will create\
    \ a new command that will carry out the steps whenever changeColor() is typed.\n\
    \n> BRACKETS!\nSquare brackets ([]) are used in JavaScript to show the start and\
    \ end of a list. Coders call this sort of list an array. If the array contains\
    \ string (words or symbols), each one needs double quotation marks around it.\
    \ Curly brackets ({}) are used to show the start and end of a function.\n\n##\
    \ STEP 2 – START A NEW HTML FILE\n\n- Start your text editor, or click File >\
    \ New.\n\n## STEP 3 – ENTER THIS CODE\n\nType this code in very carefully, using\
    \ exactly the same spelling, symbols, and upper case letters. Remember that if\
    \ Sublime Text does not indent automatically, you need to indent the lines of\
    \ code as shown here.\n\n```\n1 <script>\n2   colors=[\"red\",\"green\",\"blue\"\
    ,\"yellow\"];\n3   var timer=window.setInterval(changeColor, 1000);\n4   function\
    \ changeColor(){\n5     var n=Math.round(Math.random()*4);\n6     document.body.style.backgroundColor=colors[n];\n\
    7   }\n8 </script>\n```\n\nMake the list of colors.\nCreate a timer that will\
    \ run the changeColor function every second.\nDefine the changeColor function.\n\
    Create a variable called n and give it a random value from 0 to 3.\nSet the background\
    \ color.\nEnd the function.\n\n# STEP 4 – SAVE YOUR CODE\n\n- Click **File > Save**\
    \ and type **colors.html** as the filename. Make sure you save it in your **Documents**\
    \ folder.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_0.png)\n\n# STEP 5 –\
    \ VIEW YOUR WORK\n\n- Open your **Documents** folder. Double-click the **colors.html**\
    \ file. Your program should run in your web browser. The screen should change\
    \ color every second.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_1.png)\n\n\
    # STEP 6 – ARRANGE YOUR SCREEN\n\nAs you start to develop more complex programs,\
    \ you will need to see your code and the browser at the same time. Many programmers\
    \ set up their screen so their code is on the left-hand side and their web page\
    \ is shown on the right.\n\n- Resize your text editor and browser windows so your\
    \ screen looks like this:\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_2.png)\n\
    \n```\n<script>\ncolors=[\"red\", \"green\", \"blue\", \"yellow\"];\nvar timer=window.setInterval(changeColor,\
    \ 1000);\nfunction changeColor(){\n  var n=Math.round(Math.random()*4);\n  document.body.style.backgroundColor=colors[n];\n\
    }\n</script>\n```\n\n- Add more colors to the list. Make sure you put double quotation\
    \ marks around each color word, and separate them with a comma.\n- To pick a color\
    \ from your new list, you will need to change the random number chosen. Edit the\
    \ number at the end of line 5 to match the length of the list.\n- Change how often\
    \ a new color is chosen by editing the end of line 3 (choosing a very low value\
    \ will result in flashing colors).\n\n# CUSTOMIZE\n\n# KEY CONCEPTS\n\n## ARRAY\n\
    \nAn array is a list of items stored as some data. Lists are similar to variables,\
    \ but they can store multiple items of information. In our program, line 2 contains\
    \ a list of colors.\n\n## FUNCTION\n\nA function is a section of code combining\
    \ a number of commands. The name of the function becomes a new command that runs\
    \ the whole section. Lines 4 to 7 contain the function definition."
  mdcn: "\n# 第四步 – 运行 Sublime Text\n\n**在 PC 上：**\n- 点击开始 > 程序 > Sublime Text。或者，如果\
    \ Sublime Text 出现在“最近添加”部分，直接点击它即可。\n\n**在 Mac 上：**\n- 点击访达。\n- 点击应用程序。\n- 将 Sublime\
    \ Text 从访达拖放到桌面底部的程序坞上，以此创建一个快捷方式。\n- 点击 Sublime Text 图标。\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_0.png)\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_1.png)\n\n# 第五步 – 说你好\n\n在文本编辑器的第\
    \ 1、2 和 3 行仔细输入以下内容。Sublime Text 应该会自动为你缩进代码行，但如果它没有，请确保你按照所示精确缩进代码行。\n\n```\n\
    1  <script>\n2      alert(\"Hello\")\n3  </script>\n```\n\n标记 JavaScript 代码段的开始。\n\
    显示一个写有 **Hello** 的消息框。代码将自动缩进。\n标记 JavaScript 代码段的结束。\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_2.png)\n\
    \n# 第六步 – 保存你的代码\n\n- 点击 **文件 > 保存**。\n- 保存到你的 **文档** 文件夹。\n- 输入 **hello.html**\
    \ 作为文件名。\n\n# 第七步 – 查看你的页面\n\n- 打开你的 **文档** 文件夹。\n- 找到 **hello.html** 文件并双击它。\n\
    - 你的网页现在应该会在你的常规网页浏览器中加载。\n- 你应该会看到一个写着 **Hello** 的消息。\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_8_3.png)\n\
    \n# 为什么在 HTML 代码中使用 JavaScript？\n\n尽管我们使用 JavaScript 进行编码，但我们需要将文件放在一些 HTML 代码中才能使其工作。HTML\
    \ 代表超文本标记语言，是用于构建网页的语言。\n\nHTML 用于描述网页上显示哪些对象或*元素*。如果你正在创建一个简单的游戏，你需要使用 HTML 添加图像和一些文本来显示分数。但是，HTML\
    \ 无法使图像移动或分数改变。\n\n添加 JavaScript 是为了告诉图像在按下不同键或点击鼠标时四处移动。它也可以用于显示分数并使其改变。我们需要同时使用\
    \ HTML 和 JavaScript 才能制作一个有趣的游戏。JavaScript 被设计成可以添加到 HTML 页面中，使其更具交互性。\n\n在本书的程序学习中，你将了解如何将\
    \ HTML 的不同元素与 JavaScript 结合使用。\n\n# 数学测验\n\n现在让我们来编写一个简单的数学测验程序。这将是你更好地了解 JavaScript\
    \ 的一个机会。如果你以前做过一些编码，你可能会熟悉*变量*和 IF 语句的概念。我们将探讨如何在 JavaScript 中使用这些概念。\n\n> 语法在\
    \ JavaScript 中非常重要。语法意味着确保所有命令和符号都输入正确。\n\n# 第一步 – 启动你的文本编辑器\n\n**在 PC 上：**\n\
    - 点击开始 > 程序 > Sublime Text。\n\n**在 Mac 上：**\n- 点击 Sublime Text 图标（如需帮助，请参见第 5\
    \ 页）。\n\n# 第二步 – 输入代码\n\n仔细输入你的数学测验问题。对于问题 “8 x 8 等于多少？”（答案：64），将以下代码添加到你的文本编辑器的第\
    \ 1 到 6 行：\n\n```\n<script>\nanswer=prompt(\"What is 8 x 8?\");\nif(answer==64){\n\
    \    alert(\"Correct!\");\n}\n</script>\n```\n\n启动 JavaScript。\n提出一个问题。\n如果答案是\
    \ 64，那么：显示一个写着 **Correct!** 的消息框。\n结束 JavaScript。\n\n你的文本编辑器可能会自动缩进代码行。如果没有，请确保你按照示例所示缩进代码行。就像用句号结束句子一样，你应该用分号(;)结束\
    \ JavaScript 语句。\n\n# 第三步 – 保存你的代码\n\n- 点击文件 > 保存，并输入 **quiz.html** 作为文件名。\n-\
    \ 确保你将其保存在 **文档** 文件夹中。\n\n# 第四步 – 查看你的作品\n\n- 打开你的 **文档** 文件夹并双击 **quiz.html**\
    \ 文件。你的程序应该在网页浏览器中运行。\n- 通过正确回答来测试你的页面。你应该会收到 \"Correct!\" 消息。然后，刷新页面并给出错误答案。你不应该收到消息。\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_10_0.png)\n\n# 第五步 – 随机化！\n\n- 按以下方式更改你的代码，以便为问题选取*随机数*：\n\
    \n```\nvar a = Math.round(Math.random() * 10);\n```\n\n```\n1 <script>\n2    \
    \ var a=Math.round(Math.random()*10);\n3     var b=Math.round(Math.random()*10);\n\
    4     answer=prompt(\"what is \"+a+\" x \"+b+\"?\");\n5     if(answer==a*b){\n\
    6         alert(\"Correct!\")\n7     }\n8 </script>\n```\n\n使用上面的代码示例创建变量 a。按照第一个示例，创建一个变量\
    \ **b**。\n使用 + 号将字符串 \"what is\" 与存储在变量 a 中的值连接起来。\n检查输入的答案是否与 a 乘以 (*) b 相同。\n\
    \n# 第六步 – 保存并刷新\n\n- 保存你的新代码。\n- **刷新**浏览器以查看更改。每次刷新时，你都应该会得到一个新的随机问题。\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_10_1.png)\n\
    \n# 关键概念\n\n## 变量\n\n变量是程序中用于存储信息的部分。每个变量都有一个名称，该名称用于指向计算机内存中的某个部分。然后在该内存部分中存储一个值。在此测验中，变量用于存储随机数和用户的输入。\n\
    \n## IF 语句\n\n通常，代码行是逐行执行的。IF 语句的工作方式不同。它在运行特定代码段之前，检查特定条件（例如正确答案）是否为真。\n\n# 自定义\n\
    \n- 更改你的代码，使其使用更大的数字提出更难的问题。\n\n# 随机颜色\n\n在这个活动中，我们将创建一个简单的程序，随机设置屏幕颜色。\n\n##\
    \ 第一步 – 规划\n\n- 列出四种可供选择的颜色。\n- 启动一个计时器，每 1000 毫秒（即每秒）改变一次颜色。\n- 要更改颜色：\n  - 从\
    \ 0 到 3 中随机选取一个数字。在此程序中，0 是一个数字。\n  - 使用随机数字选择其中一种颜色。\n  - 将背景颜色设置为所选颜色。\n- 创建一个称为函数的特殊代码部分，它将按照上述步骤来更改颜色。通过给函数一个名称——changeColor()——你将创建一个新命令，每当键入\
    \ changeColor() 时，该命令将执行这些步骤。\n\n> 括号！\n方括号 ([]) 在 JavaScript 中用于表示列表的开始和结束。程序员将这种列表称为数组。如果数组包含字符串（单词或符号），则每个字符串都需要用双引号括起来。花括号\
    \ ({}) 用于表示函数的开始和结束。\n\n## 第二步 – 启动新的 HTML 文件\n\n- 启动你的文本编辑器，或点击文件 > 新建。\n\n##\
    \ 第三步 – 输入此代码\n\n非常仔细地输入此代码，使用完全相同的拼写、符号和大写字母。请记住，如果 Sublime Text 没有自动缩进，你需要按照这里所示的方式缩进代码行。\n\
    \n```\n1 <script>\n2   colors=[\"red\",\"green\",\"blue\",\"yellow\"];\n3   var\
    \ timer=window.setInterval(changeColor, 1000);\n4   function changeColor(){\n\
    5     var n=Math.round(Math.random()*4);\n6     document.body.style.backgroundColor=colors[n];\n\
    7   }\n8 </script>\n```\n\n创建颜色列表。\n创建一个计时器，它将每秒运行一次 changeColor 函数。\n定义 changeColor\
    \ 函数。\n创建一个名为 n 的变量，并赋予它一个 0 到 3 之间的随机值。\n设置背景颜色。\n结束函数。\n\n# 第四步 – 保存你的代码\n\n\
    - 点击 **文件 > 保存** 并输入 **colors.html** 作为文件名。确保你将其保存在 **文档** 文件夹中。\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_0.png)\n\
    \n# 第五步 – 查看你的作品\n\n- 打开你的 **文档** 文件夹。双击 **colors.html** 文件。你的程序应该在网页浏览器中运行。屏幕应该每秒改变一次颜色。\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_1.png)\n\n# 第六步 – 调整你的屏幕\n\n随着你开始开发更复杂的程序，你需要同时查看代码和浏览器。许多程序员会设置他们的屏幕，使代码位于左侧，网页显示在右侧。\n\
    \n- 调整文本编辑器和浏览器窗口的大小，使你的屏幕看起来像这样：\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_12_2.png)\n\
    \n```\n<script>\ncolors=[\"red\", \"green\", \"blue\", \"yellow\"];\nvar timer=window.setInterval(changeColor,\
    \ 1000);\nfunction changeColor(){\n  var n=Math.round(Math.random()*4);\n  document.body.style.backgroundColor=colors[n];\n\
    }\n</script>\n```\n\n- 向列表中添加更多颜色。确保你用双引号将每个颜色单词括起来，并用逗号分隔。\n- 要从你的新列表中选择一种颜色，你需要更改所选的随机数。编辑第\
    \ 5 行末尾的数字以匹配列表的长度。\n- 通过编辑第 3 行末尾来更改选择新颜色的频率（选择一个非常低的值会导致颜色闪烁）。\n\n# 自定义\n\n\
    # 关键概念\n\n## 数组\n\n数组是存储为某些数据的项目列表。列表类似于变量，但它们可以存储多个信息项。在我们的程序中，第 2 行包含一个颜色列表。\n\
    \n## 函数\n\n函数是结合了许多命令的代码段。函数的名称成为一个运行整个代码段的新命令。第 4 到 7 行包含函数定义。\n"
