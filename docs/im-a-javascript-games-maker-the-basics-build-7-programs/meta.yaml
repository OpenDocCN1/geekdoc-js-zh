    # # OCTOPUS CATCHER


    In this game, the player will have to catch Otto the octopus as many times as
    possible within 30 seconds. A timer will make Otto move every second. An **onmousedown**
    event will be used to check when Otto is clicked. Variables will be used to store
    the score and the time left. The complete code for the game is listed on page
    17.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_17_0.png)


