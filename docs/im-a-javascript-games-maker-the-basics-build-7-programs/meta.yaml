    Start the JavaScript section. Create a timer that runs the **moveGhost** function
    every 1000 milliseconds. Define the **moveGhost** function. Move the ghost to
    a new random position by setting its left and top style properties. End the **moveGhost**
    function. End JavaScript.


    # KEY CONCEPTS


    # COORDINATES


    Move elements, such as images, by setting their left and top style properties,
    or coordinates. Add **px** on the end of the value to measure in *pixels*. The
    coordinates (0,0) will always be in the top left of the browser. The maximum coordinates
    will depend on the size of the browser window.


    # TAGS


    In HTML, all elements have an opening tag. Tags always start with < and end with
    >.


    # ATTRIBUTES


    Attributes provide extra information about an HTML element, such as its size and
    color.'
