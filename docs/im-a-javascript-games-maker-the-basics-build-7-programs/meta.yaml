    The score is shown in an HTML paragraph element.

    A timer will make Otto move every second.

    An **onmousedown** event is used to check when Otto is caught.

    (**onmousedown** will trigger before the **onclick** event.)


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_17_1.png)


