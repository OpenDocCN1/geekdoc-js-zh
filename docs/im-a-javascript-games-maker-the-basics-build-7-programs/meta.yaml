    \n# 接骨头\n\n在这个游戏中，玩家左右移动一只狗，以接住从屏幕上方掉落的骨头。按下方向键使狗左右移动。这个游戏使用了与前一个程序相同的函数来设置坐标和生成随机数。骨头和狗都以50像素的间隔移动。游戏的完整代码列在第29页。\n\
