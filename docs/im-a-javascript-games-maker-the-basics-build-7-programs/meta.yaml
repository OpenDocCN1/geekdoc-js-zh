  - "[PAGE 11]\n\n# # RANDOM COLORS\n\nIn this activity, we will make a simple program\
    \ that randomly sets the color of the screen.\n\n# ## STEP 1 - PLANNING\n\n+ \
    \  - Make a list of four colors to choose from.\n- Start a timer that changes\
    \ the color every 1000 milliseconds (which is every one second).\n- To change\
    \ the color:\n  - pick a random number from 0 to 3. In this program, 0 is a number.\n\
    \  - use the random number to pick one of the colors\n  - set the background color\
    \ to the chosen color.\n- Make a special section of code called a function that\
    \ will follow the steps above to change the color. By giving the function a name—changeColor()—you\
    \ will create a new command that will carry out the steps whenever changeColor()\
    \ is typed.\n\n> BRACKETS!\nSquare brackets ([]) are used in JavaScript to show\
    \ the start and end of a list. Coders call this sort of list an array. If the\
    \ array contains string (words or symbols), each one needs double quotation marks\
    \ around it. Curly brackets ({}) are used to show the start and end of a function.\n\
    \n# ## STEP 2 - START A NEW HTML FILE\n\n+   - Start your text editor, or click\
    \ File > New.\n\n# ## STEP 3 - ENTER THIS CODE\n\nType this code in very carefully,\
    \ using exactly the same spelling, symbols, and upper case letters. Remember that\
    \ if Sublime Text does not indent automatically, you need to indent the lines\
    \ of code as shown here.\n\n```\nSublime Text\n1 <script>\n2   colors=[\"red\"\
    ,\"green\",\"blue\",\"yellow\"];\n3   var timer=window.setInterval(changeColor,\
    \ 1000);\n4   function changeColor(){\n5     var n=Math.round(Math.random()*4);\n\
    6     document.body.style.backgroundColor=colors[n];\n7   }\n8 </script>\n```\n\
    \nMake the list of colors.\nCreate a timer that will run the changeColor function\
    \ every second.\nDefine the changeColor function.\nCreate a variable called n\
    \ and give it a random value from 0 to 3.\nSet the background color.\nEnd the\
    \ function."
