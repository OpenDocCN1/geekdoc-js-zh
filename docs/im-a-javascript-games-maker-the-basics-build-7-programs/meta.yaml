- md: "## ON THE MOVE\n\nTo start coding our own games, we need to use some new techniques.\
    \ First, we need to add images to the screen. We also need to be able to position\
    \ the images in particular places, then make the images move. To make all this\
    \ work, we will use some HTML code, as well as the JavaScript.\n\n### STEP 1 –\
    \ FIND AN IMAGE\n\nFirst of all, you need to find an image to use. It needs to\
    \ be placed in the same folder as your HTML file. ➔ Go online and search for some\
    \ clipart to use (see page 31). For this program, we will use a ghost image.\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_13_0.png)\n\n➔ Right-click on your\
    \ chosen ghost image. Use a **png** image.\n➔ Click **Save Image As...**\n➔ Name\
    \ the image **ghost.png**. Navigate to your **Documents** folder, then click **Save**.\n\
    \n### STEP 2 – CHECK!\n\n➔ Open your **Documents** folder and check that the picture\
    \ file is there. It will be called **ghost.png**. If it is not there, go back\
    \ to step 1 and try again, making sure you select the **Documents** folder.\n\n\
    | Files | |\n|---|---|\n| \U0001F4C2 Desktop | \U0001F4C4 colors.html |\n| \U0001F4C2\
    \ Documents | \U0001F4C4 hello.html |\n| \U0001F4C2 Downloads | \U0001F4C4 quiz.html\
    \ |\n| \U0001F4C2 Photos | \U0001F5BC️ ghost.png |\n\n➔ Find your image and remember\
    \ its exact filename.\n\n### STEP 3 – START A NEW FILE\n\n➔ Carefully type this\
    \ code into your text editor. We are going to use some HTML code to set the background\
    \ color using the **\\<body\\>** tag. We will add an image, using the **\\<img\\\
    >** tag.\n\n```\n1 <html>\n2   <body style=\"background-color:darkblue\">\n3 \
    \    <img id=\"ghost\" style=\"position:absolute;\" src=\"ghost.png\">\n4   </body>\n\
    5 </html>\n```\n\nStart the HTML.\nSet the background color using the body tag.\n\
    Use the filename (**ghost.png**) for the image from step 3.\nEnd the body tag.\n\
    End the HTML.\n\n## THE HTML IMAGE TAG:\n\nThe **id** is a name we give to identify\
    \ the image.\n\n**position:absolute** allows the image to be located using coordinates.\n\
    \n```\n<img id=\"ghost\" style=\"position:absolute;\" src=\"ghost.png\">\n```\n\
    \nWe add an image to the page.\n\nThe **style** attribute is used to set things\
    \ such as the size and color of an HTML element. Remember to add a set of double\
    \ quotes.\n\nType the filename of the image into the **src** (source) attribute.\n\
    \n### STEP 4 - SAVE YOUR FILE\n\n### STEP 5 - VIEW YOUR PAGE\n\n⇒ Click **File**\
    \ > **Save** and type **ghost.html** as the filename. Make sure you save it in\
    \ your **Documents** folder.\n\n⇒ Open your **Documents** folder. Double-click\
    \ the file and you should see it appear in your web page.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_14_0.png)\n\
    \n### STEP 6 - MAKE IT MOVE!\n\n⇒ We can use the timer technique from the color-changing\
    \ program to make the image move. Instead of changing the screen color, we will\
    \ change the position of the ghost every second.\n\n⇒ Add to your original code\
    \ by inserting a `<script>` section at line 5.\n\n```\nSublime Text\n1 <html>\n\
    2 <body style=\"background-color:darkblue\">\n3 <img id=\"ghost\" style=\"position:absolute;\"\
    \ src=\"ghost.png\">\n4 </body>\n5 <script>\n6 var timer=window.setInterval(moveGhost,\
    \ 1000);\n7 function moveGhost(){\n8 document.getElementById(\"ghost\").style.left=Math.random()*900+\"\
    px\";\n9 document.getElementById(\"ghost\").style.top=Math.random()*600+\"px\"\
    ;\n10 }\n11 </script>\n12 </html>\n```\n\nStart the JavaScript section. Create\
    \ a timer that runs the **moveGhost** function every 1000 milliseconds. Define\
    \ the **moveGhost** function. Move the ghost to a new random position by setting\
    \ its left and top style properties. End the **moveGhost** function. End JavaScript.\n\
    \n## KEY CONCEPTS\n\n## COORDINATES\n\nMove elements, such as images, by setting\
    \ their left and top style properties, or coordinates. Add **px** on the end of\
    \ the value to measure in *pixels*. The coordinates (0,0) will always be in the\
    \ top left of the browser. The maximum coordinates will depend on the size of\
    \ the browser window.\n\n## TAGS\n\nIn HTML, all elements have an opening tag.\
    \ Tags always start with < and end with >.\n\n## ATTRIBUTES\n\nAttributes provide\
    \ extra information about an HTML element, such as its size and color.\n\n## >\
    \ GET CLICKING\n\nAll computer games need the player to interact with the computer\
    \ or device. To do this, we need to use mouse and keyboard *events*. Events are\
    \ special parts of code that \"listen\" to the mouse or keyboard and wait for\
    \ certain things to happen, before running some other code.\n\n**EVENTS**\nWe\
    \ can use the **onclick** event to make some code run when an image is clicked.\n\
    \nThe event that the program is listening for.\n\n```\n<img id=\"ghost\" onclick=\"\
    hideMe()\" src=\"ghost.png\">\n```\n\nThe name of the function to run when the\
    \ event takes place.\n\nAs well as the **onclick** event, there are lots of other\
    \ events including:\n- **onmousedown** ⇨ triggered the moment the mouse button\
    \ is pressed down.\n- **onmousemove** ⇨ triggered every time the mouse is moved\
    \ over an element.\n- **onmouseup** ⇨ triggered the moment the mouse button is\
    \ released.\n- **onkeydown** ⇨ triggered when keys on the keyboard are pressed.\n\
    \n### STEP 1 – START A NEW FILE\n\n⇨ Carefully add this code into your text editor.\n\
    \n```\nSublime Text\n1 <html>\n2   <img id=\"ghost\" onclick=\"hideMe()\" src=\"\
    ghost.png\">\n3   <script>\n4     function hideMe(){\n5       document.getElementById(\"\
    ghost\").style.display=\"none\";\n6     }\n7   </script>\n8 </html>\n```\n\nUse\
    \ the filename for the ghost image from page 10.\nWhen it is clicked, run the\
    \ function called **hideMe**.\n\nDefine the function called **hideMe**.\n\nHide\
    \ the ghost when the function is run.\n\nEnd the function.\n\n### STEP 2 - SAVE\
    \ AND VIEW YOUR FILE\n\n* Click **File** > **Save** and type **events.html** as\
    \ the filename.\n* Make sure you save it in your **Documents** folder.\n\nOpen\
    \ your **Documents** folder. Double-click the **events.html** file. You should\
    \ see your image.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_16_0.png)\n\nClick\
    \ the image to make it disappear.\n\n## HIDING HTML ELEMENTS\n\nSet the **style.display**\
    \ property of an element to **none** to make it disappear. Set it to **block**\
    \ to make it appear again.\n\nSelect the element to hide (the ghost), by using\
    \ its identification (id).\n\nThe value you are giving to the property.\n\n```\n\
    document.getElementById(\"ghost\").style.display=\"none\";\n```\n\nThe property\
    \ you want to change.\n\n### STEP 3 - RUNAWAY!\n\nWe are going to use the **onmouseenter**\
    \ event in the next example. This is triggered as the mouse is moved over an element.\
    \ It doesn't wait for the mouse to be pressed. When you move the mouse over the\
    \ ghost, it will jump to a new random position.\n\nEdit your code from page 12.\n\
    \nRemember to set **position:absolute**.\n\n```\n1 <html>\n2   <img id=\"ghost\"\
    \ style=\"position:absolute;\" onmouseenter=\"runAway()\"\n        src=\"ghost.png\"\
    >\n3   <script>\n4     function runAway(){\n5       document.getElementById(\"\
    ghost\").style.left=Math.random()*900+\"px\";\n6       document.getElementById(\"\
    ghost\").style.top=Math.random()*600+\"px\";\n7     }\n8   </script>\n9 </html>\n\
    ```\n\nAs soon as someone tries to move the mouse over the ghost, it will run\
    \ the function called **runAway**.\n\nDefine the function called runAway. Move\
    \ the ghost to a new random position by setting its left and top style properties.\
    \ End the function.\n\n> Elements are the items that make up a web page, such\
    \ as images. HTML uses tags to identify elements. <img> is the start of an image\
    \ tag.\n\n### STEP 4 - SAVE AND REFRESH\n\n* Save your code, then refresh your\
    \ browser to see the changes.\n\nTry to move your mouse over the ghost. Every\
    \ time your mouse moves over it, it should move away to a new position.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_16_1.png)\n\
    \n## OCTOPUS CATCHER\n\nIn this game, the player will have to catch Otto the octopus\
    \ as many times as possible within 30 seconds. A timer will make Otto move every\
    \ second. An **onmousedown** event will be used to check when Otto is clicked.\
    \ Variables will be used to store the score and the time left. The complete code\
    \ for the game is listed on page 17.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_17_0.png)\n\
    \n### STEP 1 - PLANNING\n\nThe score is shown in an HTML paragraph element.\n\
    A timer will make Otto move every second.\nAn **onmousedown** event is used to\
    \ check when Otto is caught.\n(**onmousedown** will trigger before the **onclick**\
    \ event.)\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_17_1.png)\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_17_2.png)\n\
    \nVariables count the score and how long the game has been running.\nAfter 30\
    \ seconds, the game ends and the score is shown.\nClick **OK** to play again.\n\
    \n### STEP 2 - FIND AN IMAGE\n\n1. Find an image of an octopus to use. It needs\
    \ to be saved into the same folder as your HTML file. Use a png image. Name the\
    \ file **octopus.png**.\n2. Search for some clipart.\n3. Right-click one image.\n\
    4. Click **Save Image As...**\n5. Navigate to your **Documents** folder then click\
    \ **Save**.\n\n### THE HTML PARAGRAPH TAG\n\nSet the **style.display** property\
    \ of an element to **none** to make it disappear. Set it to **block** to make\
    \ it appear again.\nThe id is a name we give to the paragraph.\nThis is called\
    \ the **closing tag**. It marks the end of the paragraph.\nIf we want to change\
    \ the color of the paragraph, we can add a style attribute the way that we have\
    \ done with the body element, and set its color property.\nWe are adding a paragraph\
    \ to the page.\nThe text we want shown in the paragraph element is typed here:\
    \ between the opening <p> tag and the closing </p> tag.\n\n```\n<p id=\"scoreText\"\
    >Score: 0</p>\n```"
  mdcn: "\n## 运动起来\n\n要开始编写我们自己的游戏，我们需要使用一些新技术。首先，我们需要将图像添加到屏幕上。我们还需要能够将图像定位在特定的位置，然后让图像移动起来。为了让所有这些功能正常工作，我们将使用一些HTML代码以及JavaScript。\n\
    \n### 第1步 – 找一张图片\n\n首先，你需要找一张要使用的图片。它需要与你的HTML文件放在同一个文件夹中。➔ 上网搜索一些可用的剪贴画（参见第31页）。在这个程序中，我们将使用一个幽灵图片。\n\
    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_13_0.png)\n\n➔ 右键点击你选择的幽灵图片。请使用**png**格式的图片。\n\
    ➔ 点击**图片另存为...**\n➔ 将图片命名为**ghost.png**。导航到你的**文档**文件夹，然后点击**保存**。\n\n### 第2步\
    \ – 检查！\n\n➔ 打开你的**文档**文件夹，检查图片文件是否在那里。它的名字应该是**ghost.png**。如果不在，请返回步骤1重试，确保你选择了**文档**文件夹。\n\
    \n| 文件 | |\n|---|---|\n| \U0001F4C2 桌面 | \U0001F4C4 colors.html |\n| \U0001F4C2\
    \ 文档 | \U0001F4C4 hello.html |\n| \U0001F4C2 下载 | \U0001F4C4 quiz.html |\n| \U0001F4C2\
    \ 图片 | \U0001F5BC️ ghost.png |\n\n➔ 找到你的图片并记住它的确切文件名。\n\n### 第3步 – 新建一个文件\n\n\
    ➔ 将此代码仔细输入到你的文本编辑器中。我们将使用一些HTML代码，通过**\\<body\\>**标签来设置背景颜色。我们将使用**\\<img\\>**标签添加一张图片。\n\
    \n```\n1 <html>\n2   <body style=\"background-color:darkblue\">\n3     <img id=\"\
    ghost\" style=\"position:absolute;\" src=\"ghost.png\">\n4   </body>\n5 </html>\n\
    ```\n\n开始HTML。\n使用body标签设置背景颜色。\n使用第3步中图片的文件名（**ghost.png**）。\n结束body标签。\n结束HTML。\n\
    \n## HTML图像标签：\n\n**id**是我们用来标识图像的名称。\n\n**position:absolute**允许使用坐标来定位图像。\n\n\
    ```\n<img id=\"ghost\" style=\"position:absolute;\" src=\"ghost.png\">\n```\n\n\
