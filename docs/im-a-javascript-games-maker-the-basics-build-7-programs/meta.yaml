    - `position:absolute:` – allows an element, such as an image, to be moved around
    by changing left and top properties.

    - `left` – sets how far across the screen an element is.

    - `top` – sets how far down from the top of the screen an element is.

    - `height` – sets the height of an element (e.g., 20px means 20 pixels high).

    - `width` – sets the width of an element.

    - `-webkit-transition` – sets how quickly an element changes its properties.


