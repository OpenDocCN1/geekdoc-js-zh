    \ the right.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_26_1.png)\n\n# BONE CATCHER\n\
    \nIn this game, the player moves a dog left and right to catch a bone as it drops\
    \ down the screen. Arrow key presses make the dog move left and right. The game\
    \ uses some of the same functions as the previous program to set coordinates and\
