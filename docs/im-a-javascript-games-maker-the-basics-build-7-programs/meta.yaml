    position:absolute; width:50px; top:0px; left:0px; -webkit-transition: all 0.2s;\"\
    \ src=\"bone.png\">\n<p id=\"scoreTB\" style=\"position:absolute; left:50px; color:yellow;\
    \ font-size:28px; font-family:Arial;\">Score: 0</p>\n<p id=\"livesTB\" style=\"\
    position:absolute; right:50px; color:yellow; font-size:28px; font-family:Arial;\"\
    >Lives: 3</p>\n</body>\n```\n\nSet the background color.\n\nAdd the image of the\
