    \ . . . . . . . . . . . . . . . 6\n- RANDOM COLORS . . . . . . . . . . . . 8\n\
    - ON THE MOVE . . . . . . . . . . . . . . 10\n- GET CLICKING . . . . . . . . .\
    \ . . . . . 12\n- OCTOPUS CATCHER . . . . . . . . . . . 14\n- BALLOON POPPER .\
    \ . . . . . . . . . . . 18\n- BONE CATCHER . . . . . . . . . . . . . 24\n- GLOSSARY\
    \ . . . . . . . . . . . . . . . . 30\n- COMMAND LIST . . . . . . . . . . . . .\
    \ . 31\n- INDEX . . . . . . . . . . . . . . . . . . . . 32\n\n# RESPECTING COPYRIGHT\n\
    \nCopyright means the legal ownership of something. You need to think about who\
    \ owns the images or sound files you are linking to or downloading in your apps.\
    \ There shouldn't be any major issues unless you try to make an app available\
    \ to the public. Check with an adult to make sure.\n\nAn alternative is to find\
    \ a free-to-use image or sound file. Search for an image or sound, then look for\
    \ the **Settings** button on the website results page. Click **Advanced search**,\
    \ then look for **usage rights**. On that menu, choose **free to use share or\
    \ modify, even commercially**.\n\n# INTRODUCTION\n\nLearn how to code your own\
    \ fun games using *JavaScript*. JavaScript is a language originally used to make\
    \ web pages more interactive. It is now used to create online games that will\
    \ run on both computers and mobile devices. Enjoy creating the simple programs\
    \ in this book and you will be on your way to becoming a JavaScript expert!\n\n\
    > TIPS TO REDUCE BUGS\n\n- If you are making your own web page, spend time drawing\
    \ a diagram and planning it before you start. Try changing values if things don't\
    \ work, and don't be afraid to start again—you will learn from it.\n- Bugs are\
    \ errors or mistakes in your code that stop your program from working properly.\
    \ Looking for those errors is called *debugging*! Make a very simple web page\
    \ and get a friend to change one line of code while you're not looking. Can you\
    \ fix it?\n- When things are working properly, stop and look through your code\
    \ so you understand each line. Experiment and change your code, and try out different\
    \ values. To be good at debugging, you need to understand what each line of your\
    \ code does and how it works.\n\n```\nmygame.html\n1 <script>\n2 alert('Press\
    \ any key to start')\n3 </script>\n```\n\nYou could use a plain text editor to\
    \ create your code.\n\nThis will work fine but can be quite touchy, because the\
    \ software won't give you any help.\n\nThe best thing to use for the activities\
    \ in this book is an offline *HTML* editor. This will support you as you type\
    \ your code, but also give you the opportunity to learn the JavaScript code.\n\
    \nThere are two separate windows that you'll be using:\n\n```\nSublime Text\n\
    1 <script>\n2 var score=0;\n3 var seconds=0;\n4 function moveIt(){\n5 score++;\n\
    ```\n\nThe text editor to enter your JavaScript code.\n\n```\nWeb Browser\nSCORE:\
    \ 7\n```\n\nThe browser to view the program.\n\nThere are many different browsers\
    \ you can use. We recommend using Google Chrome for the activities in this book.\
    \ Make sure you have the latest version installed on your computer before you\
    \ start.\n\nYou will also learn some HTML in this book. HTML is the language used\
    \ to build web pages. JavaScript is the language that brings those pages to life!\n\
    \n**Note:** Words in *italics* appear in the glossary on page 30.\n\n# GETTING\
    \ STARTED\n\nYou need a text editor to start coding in JavaScript. There will\
    \ probably be a simple text editor already on your computer, called Notepad (if\
    \ you have Windows) or TextEdit (on a Mac). This will be sufficient for you to\
    \ get started, but it will be much easier to create JavaScript if you download\
    \ a more powerful text editor. In this book, we will use a text editor called\
    \ Sublime Text. There are many others you could download, such as Brackets or\
    \ Notepad++. All of these are free for you to try out.\n\n## STEP 1 - FIND THE\
    \ SUBLIME TEXT WEBSITE\n\nOpen your web browser and visit www.sublimetext.com\n\
    \n## STEP 2 - START THE DOWNLOAD\n\nClick the Download button near the top of\
    \ the web page.\nChoose which version of Sublime Text you need. If you are not\
    \ sure, then ask an adult to help you find the correct version. If you are using\
    \ a Mac, click the Apple menu, then About. On a PC, click the Start menu, select\
    \ System, and click About.\n\n## STEP 3 - INSTALL THE SOFTWARE\n\nSome web browsers\
    \ will then ask you to run the installation program. Choose Run.\nIf this does\
    \ not happen, don't panic. The installer file should have been downloaded to your\
    \ computer. Look in your Downloads folder for it. Double-click it to start installing\
    \ your new text editor. You should get a big white or gray box giving you instructions\
    \ on what to do next. Follow these instructions to complete the installation."
