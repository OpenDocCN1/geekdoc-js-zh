    \ The complete code for the game is listed on page 29.\n\n## STEP 1 – PLANNING\n\
    \nThe score is shown in an HTML paragraph element.\n\nA timer will move the bone\
    \ every 200 milliseconds.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_27_0.png)\n\
    \nIt then checks if the dog and bone coordinates match. If they do, this means\
    \ the dog has caught the bone, making the score increase.\n\n![](img/828a4e7c3a4c484a54a67d683e790ef1_27_1.png)\n\
    \nVariables count the score, number of lives left, and x and y coordinates of\
