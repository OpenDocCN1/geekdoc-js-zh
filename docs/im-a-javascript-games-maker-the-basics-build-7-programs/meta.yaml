    \n![](img/828a4e7c3a4c484a54a67d683e790ef1_28_0.png)\n\n## COLOR GRADIENTS\n\n\
    In the games we have created so far, we have set the background to be a solid\
    \ color. However, we can create some great effects by using something called color\
    \ gradients. Color gradients use two colors and blend them together gradually.\
    \ Experiment with the following code from line 2:\n\n```\n<body style=\"background:\
    \ -webkit-linear-gradient(blue, green);\">\n<body style=\"background: -webkit-linear-gradient(red,\
    \ yellow);\">\n```\n\n## STEP 5 - START THE SCRIPT\n\n⇒ Now that we have defined\
    \ the elements that go on the page, we need to begin the JavaScript. At the start\
