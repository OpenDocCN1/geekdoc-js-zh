  md: '# > GETTING STARTED


    You need a text editor to start coding in JavaScript. There will probably be a
    simple text editor already on your computer, called Notepad (if you have Windows)
    or TextEdit (on a Mac). This will be sufficient for you to get started, but it
    will be much easier to create JavaScript if you download a more powerful text
    editor. In this book, we will use a text editor called Sublime Text. There are
    many others you could download, such as Brackets or Notepad++. All of these are
    free for you to try out.


    # STEP 1 - FIND THE SUBLIME TEXT WEBSITE


    Open your web browser and visit www.sublimetext.com


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_0.png)


    # STEP 2 - START THE DOWNLOAD


    Click the Download button near the top of the web page.

    Choose which version of Sublime Text you need. If you are not sure, then ask an
    adult to help you find the correct version. If you are using a Mac, click the
    Apple menu, then About. On a PC, click the Start menu, select System, and click
    About.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_1.png)


    # STEP 3 - INSTALL THE SOFTWARE


    Some web browsers will then ask you to run the installation program. Choose Run.

    If this does not happen, don''t panic. The installer file should have been downloaded
    to your computer. Look in your Downloads folder for it. Double-click it to start
    installing your new text editor. You should get a big white or gray box giving
    you instructions on what to do next. Follow these instructions to complete the
    installation.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_7_2.png)'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# STEP 4 – RUN SUBLIME TEXT


    +   **On a PC:**

    - Click Start > Programs > Sublime Text. Or, just click Sublime Text if it appears
    in the Recently added section.

    **On a Mac:**

    - Click Finder.

    - Click Applications.

    - Make a shortcut by dragging Sublime Text from Finder onto your dock at the bottom
    of the Desktop.

    - Click the Sublime Text icon.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_8_0.png)


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_8_1.png)


    # STEP 5 – SAY HELLO


    Carefully type this into lines 1, 2, and 3 of your text editor. Sublime Text should
    automatically indent lines for you, but if it doesn''t, make sure you indent lines
    of code exactly as shown.


    ```

    1  <script>

    2      alert("Hello")

    3  </script>

    ```


    Mark the start of a JavaScript section.

    Show a message box saying **Hello**. The code will automatically indent.

    Mark the end of the JavaScript section.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_8_2.png)


    # STEP 6 – SAVE YOUR CODE


    +   - Click **File > Save**.

    - Save to your **Documents** folder.

    - Type **hello.html** as the filename.


    # STEP 7 – VIEW YOUR PAGE


    +   - Open your **Documents** folder.

    - Find the **hello.html** file and double-click it.

    - Your web page should now load in your normal web browser.

    - You should get a message saying **Hello**.


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_8_3.png)


    # WHY USE JAVASCRIPT INSIDE HTML CODE?


    Although we are coding with JavaScript, we need to put our file inside some HTML
    code to make it work.

    HTML stands for HyperText Markup Language and is the language used to build web
    pages.


    HTML is used to describe what objects, or *elements*, are shown on a web page.
    If you are creating a simple game, you need to use HTML to add an image and some
    text to show the score. However, HTML can''t make the image move or the score
    change.


    JavaScript is added to tell the image to move around when different keys are pressed,
    or when the mouse is clicked. It can also be used to display the score and make
    it change. We need to use both HTML and JavaScript to make an interesting game.
    JavaScript was designed to be added to HTML pages to make them more interactive.


    You will learn about using different elements of HTML with JavaScript as you work
    through the programs in this book.'
