  md: '# POSITIONING THE DOG AND BONE


    The dog''s coordinates are stored in **dogX** and **dogY**, and the bone''s coordinates
    are in **boneX** and **boneY**.


    To make sure the dog has a chance to catch the bone, we will make each of them
    move on an invisible grid. Each square in the grid will be 50 pixels wide and
    50 pixels high. To set the left position of the dog, we multiply **boneX** by
    50. To set the top value, we multiply **boneY** by 50.


    If **dogX** is 2, and **dogY** is 3, then this is what would happen:


    ![](img/828a4e7c3a4c484a54a67d683e790ef1_30_0.png)


    The dog is 2 * 50 = 100 pixels in from the left.


    The dog is 3 * 50 = 150 pixels down from the top.


    # STEP 6 – PRESS ANY KEY


    ⇒ When a key is pressed by the player, we need to move the dog left or right.
    The direction moved depends on which key is pressed. We need to add a special
    type of variable called a **parameter** to our function. The parameter will store
    information about the key that has been pressed. Type **(e)** after the function
    name to add the parameter. Each key on the keyboard has a specific code linked
    to it. The left arrow has a code of 37, and the right arrow''s code is 39. The
    code for the key pressed will be stored in **e.keyCode**.


    ```

    15  function handleKeys(e){

    16      if(e.keyCode==37){dogX--;}

    17      if(e.keyCode==39){dogX++;}

    18      setLeft("dog", dogX*50);

    19      setTop("dog", dogY*50);

    20  }

    ```


    Define a function called **handleKeys**. Information about the key press event
    will be put into the variable called **e**.


    Make **dogX** go down by 1 (**dogX--** means subtract 1 from the value in **dogX**),
    if the code for the left arrow key has been sent.


    Make **dogX** go up by 1 (**dogX++** means add 1 to **dogX**), if the code for
    the right arrow key has been passed to the function.


    Set the new position for the dog.


    # STEP 7 – MOVE THE BONE


    ⇒ The bone gets moved by the timer every 200 milliseconds. Although this means
    it only moves 5 times a second, it will look quite smooth because we have used
    the **-webkit-transition** property. The timer runs this function.


    ```

    21  function moveBone(){

    22      boneY=boneY+=1;

    23      setLeft("bone", boneX*50);

    24      setTop("bone", boneY*50);

    25      if(boneY>dogY+5){missedBone();}

    26      if((dogX==boneX) && (dogY==boneY)){caughtBone();}

    27  }

    ```


    Define the function.


    Make the **boneY** variable go up by one (you could type this code as **boneY++**
    if you want to save time!).


    Set the new position for the bone. (**boneX** only changes if it has been caught
    or missed).


    Run the **missedBone** function, if the bone has been missed and has fallen below
    the dog.


    Run the **caughtBone** function, if the bone has been caught by the dog and they
    both have the same x and y coordinates.


    <27>'
