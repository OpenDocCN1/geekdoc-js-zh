  \n我们将详细介绍 Yahoo! 提供的关于网络搜索和音乐的服务。随后，我们将描述如何基于 JavaScript 语言在 Web 应用程序中使用它们。\n\n\
  ### 互联网搜索服务\n\nYahoo! 提供的主要服务是使用 Yahoo! 搜索引擎进行互联网搜索。该服务的文档可在 `http://developer.yahoo.com/search/web/V1/webSearch.html`\
  \ 获取。它描述了可以使用的各种参数以及响应中包含的数据结构。该服务的调用参数汇总在表 14.2 中。\n\n**表 14.2 互联网搜索服务参数**\n\n\
  | 属性 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| adult_ok | - | 指定结果中是否允许成人内容。空值（默认值）禁止，而值\
  \ 1 则允许。 |\n| appid | 字符串 | 对应使用服务的应用程序的标识符。此参数是必选的。 |\n| callback | 字符串 | 指定用于传递数据的回调函数名称。\
  \ |\n| country | ISO 代码 | 指定搜索页面的所在国家。空值（默认）允许所有国家。否则，必须使用国家 ISO 代码，如法语使用 fr。 |\n\
  \n\n\n\n\n### type\n指定对应搜索的文件类型。默认情况下，考虑所有类型（值为 `any`）。可以指定的文件类型：`msword` (Microsoft\
  \ Word)、`pdf`、`ppt` (Microsoft PowerPoint)、`rss` (分发文件)、`txt` (文本文件) 和 `xls` (Microsoft\
  \ Excel)。\n\n### language\nISO 代码\n指定结果对应的语言。不提供值（默认）允许所有语言。否则，必须使用语言 ISO 代码，例如代表法语的\
  \ `fr`。\n\n### license\n-\n指定所搜索内容的一个或多个 Creative Commons 许可协议。可能的值有 `any`、`cc_any`、`cc_commercial`\
  \ 或 `cc_modifiable`。\n\n### output\n字符串\n指定期望的数据返回格式。默认值为 `xml`（即 `xml` 格式）。支持通过值\
  \ `json` 使用 `JSON` 格式。\n\n### query\n字符串\n指定搜索字符串。该字符串必须使用 UTF-8 编码。\n\n### region\n\
  ISO 代码\n指定要使用的区域搜索引擎。对于法国，必须使用 `fr`（引擎 `http://fr.search.yahoo.com/`）。默认值为 `us`。\n\
  \n### results\n整数\n指定要返回的结果数量。\n\n### similar_ok\n-\n指定结果中是否允许包含相似的内容。不提供值（默认值）禁止，而值\
  \ `1` 则允许。\n\n### site\n字符串\n指定搜索页面的域名。不提供值（默认）不限制搜索。可以通过 `&` 字符连接域名来指定多个域名。\n\n\
  ### start\n整数\n指定数据中的起始位置。\n\n### subscription\n值\n指定搜索是否针对特定的内容源，例如*华尔街日报*源 (`wsj`)。这些源完整列表可以在\
  \ `http://developer.yahoo.com/search/subscriptions.html` 获取。\n\n### type\n值列表\n\
  指定要提交的搜索类型：\n- `all`，用于匹配所有搜索词的结果；\n- `any`，用于匹配至少一个词的结果；\n- `phrase`，用于包含完整短语的结果。\n\
  \n下链接允许在 Yahoo! 搜索引擎中搜索单词“JavaScript”并显示其前两个结果：\n`http://api.search.yahoo.com/WebSearchService/V1/webSearch?appid=YahooDemo&query=JavaS-cript&results=2`\n\
  \n返回的数据默认为 XML 格式，其基础标签为 `ResultSet`。该标签拥有 `totalResultsAvailable`、`totalResultsReturned`\
