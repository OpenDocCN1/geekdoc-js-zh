  \n## 集合方法\n\n### `pluck`\n属性名（接收值和索引作为参数）。\n允许返回一个包含指定属性值的集合，适用于初始集合中的所有元素。\n\n\
  ### `reject`\n回调函数（接收值和索引作为参数）。\n允许根据传入的函数向集合添加不符合条件的元素。\n\n### `select`\n回调函数（接收值和索引作为参数）。\n\
  `findAll` 方法的别名。\n\n### `sortBy`\n无或（接收回调函数作为参数）。允许根据 `Array` 类的 `sort` 方法对集合进行排序。\n\
  \n### `toArray`\n无。\n允许将集合转换为数组。\n\n### `zip`\n多个集合。允许将多个集合合并为一个包含子数组的单一集合。\n\n\
  我们将展示这些最重要方法的实现。由于 `Enumerable` 类可以作为子类使用，我们将使用数组作为集合。\n\n## 库的原型方法\n\n`each` 方法允许遍历集合。它接收一个回调函数作为参数，该函数为集合中的每个元素执行，接收值和索引，如下代码所示：\n\
  \n```javascript\nvar collection = [ \"element1\", \"element2\", \"element3\" ];\n\
  collection.each(function(value, index) {\n  alert(\"索引为 \"+index+\" 的值是 \"+value);\n\
  });\n```\n\n`collect` 方法允许从集合构建数组。对于每个元素，值由回调函数决定，如下代码所示，这增加了集合的所有值：\n\n```javascript\n\
  var collection = [ 1, 2, 3 ];\nvar resultat = collection.collect(function(value,\
  \ index) {\n  return value+1;\n});\n// resultat 包含 [ 2, 3, 4 ]\n\n\n`grep` 方法允许根据正则表达式构建集合。除非指定了回调函数，否则存储的是初始集合的值。以下代码展示了\
  \ `grep` 的实现：\n\n```javascript\nvar collection = [\"test method\", \"grep\", \"\
  a test\" ]; var resultat = collection.grep(\"^test\");\n/* 结果包含以 \"test\" 开头的方法字符串\
  \ */\n```\n\n`invoke` 方法允许执行集合中的对象的方法并将返回值放入数组。第一个参数对应于传递给不同方法的参数。以下代码展示了 `invoke`\
  \ 的实现：\n\n```javascript\nvar collection = [];\nvar objet1 = new Object();\nobjet1.methode\
  \ = function(parametre) {\n  return \"Method 1:\"+parametre;\n};\ncollection[0]\
  \ = objet1;\nvar objet2 = new Object();\nobjet2.methode = function(parametre) {\n\
  \  return \"Method 2:\"+parametre;\n};\ncollection[1] = objet2;\nvar resultat =\
  \ collection.invoke(\"methode\",\"parametre\");\n/* 结果包含 \"Method 1:parameter\"\
  \ 和 \"Method 2:parameter\" */\n```\n\n### `pluck`\n`pluck` 方法允许从集合对象中提取数据以构建另一个。数据是通过方法的参数属性名提取的。以下代码给出了\
  \ `pluck` 的用法：\n\n```javascript\nvar collection = [];\nvar objet1 = new Object();\n\
  objet1.propriete = \"Object 1 property\";\ncollection[0] = objet1;\nvar objet2 =\
  \ new Object();\nobjet2.propriete = \"Object 2 property\";\ncollection[1] = objet2;\n\
  var resultat = collection.pluck(\"propriete\");\n/* 结果包含 \"Object 1 property\" 和\
  \ \"Object 2 property\" */\n```\n\n### `sortBy`\n`sortBy` 方法允许根据 `Array` 类的 `sort`\
  \ 方法对集合元素进行排序。该方法接收一个函数来指定要排序并添加到新集合中的值。以下代码展示了 `sortBy` 方法的使用：\n\n```javascript\n\
  var collection = [ \"first word\", \"second word\", \"third word\", \"fourth word\"\
  \ ];\nvar resultat = collection.sortBy(function(value,index) {\n  return value;\n\
  });\n/* 结果按以下顺序包含：“first word”，“fourth word”，“second word”和“third word”*/\n```\n\
  \n### `toArray`\n`toArray` 方法允许将集合转换为数组，如下：\n\n```javascript\nvar collection = (...);\n\
  var resultat = collection.toArray();\n```\n\n### `zip`\n`zip` 方法允许合并集合。结果数组的长度与原始数组相同，但每个元素都是一个子数组。这些子数组包含给定索引的所有数组元素。以下代码给出了\
  \ `zip` 方法的用法：\n\n```javascript\nvar resultat = [1,2,3].zip([4,5,6],[7,8,9]);\n\
  // 结果包含 [ [1,4,7], [2,5,8], [3,6,9] ]\n```\n\n## Array 类的扩展\n\n`Array` 类是 JavaScript\
  \ 语言提供的对象。该库通过 `Enumerable` 类、`ObjectRange` 类以及 `$H` 对象对其进行了增强，我们将在后面的章节中进行详细说明。\n\
  \n### 表 6.4 Array 类的扩展方法\n\n| 方法 | 参数 |  |\n| :--- | :--- | :--- |\n| `each` | 接收一个代表值和索引的对象的回调函数\
  \ | 用于 `Enumerable` 类扩展的扩展。它从索引 0 到长度减 1 遍历集合。 |\n| `clear` | 无 | 允许通过清空来重置数组。 |\n\
  | `compact` | 无 | 返回一个除了所有 `undefined` 或 `null` 元素的列表。 |\n| `first` | 无 | 返回数组的第一个元素。\
  \ |\n| `flatten` | 无 | 返回一个将数组元素平坦化后的数组。 |\n| `indexOf` | 在数组中搜索的对象 | 确定数组元素的位置。如果不存在，方法返回\
  \ -1。 |\n| `last` | 无 | 返回数组的最后一个元素。 |\n| `reverse` | 布尔值，指定是否反转数组元素的顺序 | 返回一个顺序与原始数组反转的数组。\
  \ |\n| `shift` | 无 | 允许返回数组的第一个元素。该元素随后从数组中删除，所有元素向左移动。数组元素数量也减一。 |\n| `without`\
  \ | 要排除的元素列表 | 返回列表中不在参数列表中的所有元素。 |\n\n\n\n\n\n```javascript\nvar collection = [\
  \ \"element1\",\"element2\",\"element3\",\"element4\" ]; var premierElement = collection.first();\n\
  \nvar dernierElement = collection.last();\n\n// premierElement contient \"element1\"\
  \ et dernierElement \"element4\"\n```\n\n`reverse` 方法允许反转数组元素的顺序，如下代码所示：\n\n```javascript\n\
  var collection = [ \"element1\",\"element2\",\"element3\",\"element4\" ]; var resultat\
  \ = collection.reverse();\n\n/* 结果包含 [ \"element4\",\"element3\",\"element2\",\"\
  element1\" ]*/\n```\n\n`shift` 方法允许获取数组的第一个元素同时将其从中删除并将所有元素向左移动，如下代码所示：```javascript\n\
  var collection = [ \"element1\",\"element2\",\"element3\",\"element4\" ]; var resultat\
  \ = collection.shift();\n\n/* 结果包含 \"element1\" 且 collection [ \"element2\",\"element3\"\
  ,\"element4\" ] */\n```\n\nLivreGougeon 第 137 页 2006 年 11 月 28 日 周二 4:23 16\n\n\
  # Prototype 库\n\n**137**\n\n*第 6 章*\n\n## `Hash` 类\n\n`Hash` 类简化了 JavaScript 中哈希表的操控和遍历。\n\
  \n该类仅能通过增强 JSON 格式的键值对集合来使用。此功能通过 `$H` 方法实现，其用法将在在本章随后的部分描述。\n\n表 6.5 汇总了 `Hash`\
  \ 类的方法。\n\n### 表 6.5 `Hash` 类的方法\n\n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n|\
  \ `each` | 回调函数，其参数接收一个代表数组元素键和值的对象 | 由添加到 `Hash` 类的 `Enumerable` 类的方法使用。它遍历结构的键并构建一个包装对象。\
  \ |\n| `keys` | - | 返回哈希表键的集合。 |\n| `merge` | 哈希表 | 允许向哈希表添加键值对。 |\n| `toQueryString`\
  \ | - | 允许从哈希表构建 HTTP 参数字符串。字符串格式为：`parametre1=valeur1&parametre2=valeur2`。 |\n\
  | `values` | - | 返回哈希表值的集合。 |\n\n我们将阐述这些主要方法的实现。\n\n`keys` 和 `values` 方法允许获取包含哈希表键和值的集合，如下代码所示：\n\
  \n```javascript\nvar hash = $H({ \"cle1\": \"valeur1\", \"cle2\": \"valeur2\" });\
  \ var cles = hash.keys();\n\nvar valeurs = hash.values();\n\n/* 集合 cles 包含 \"cle1\"\
  \ 和 \"cle2\"，而集合 valeurs 包含 \"valeur1\" 和 \"valeur2\"。 */\n```\n\n`merge` 方法将一个哈希表的元素添加到另一个哈希表，如下代码所示：\n\
  \n```javascript\nvar hash = $H({ \"cle1\": \"valeur1\", \"cle2\": \"valeur2\" });\
  \ hash.merge({ \"cle3\": \"valeur3\", \"cle4\": \"valeur4\" });\n\n/* 哈希表包含键为 \"\
  cle1\", \"cle2\", \"cle3\" 和 \"cle4\" 的元素 */\n```\n\n`toQueryString` 方法允许从哈希表轻松地构建\
  \ HTTP 参数字符串，如下代码所示：\n\n```javascript\nvar hash = $H( \"cle1\": \"valeur1\", \"\
  cle2\": \"valeur2\" }); var queryString = hash.toQueryString();\n\n// queryString\
  \ 包含 cle1=valeur1&cle2=valeur2\n```\n\n## `ObjectRange` 类\n\n`ObjectRange` 类允许对通过构造函数参数指定的数字范围（`start`\
  \ 为起始索引，`end` 为结束索引）进行循环。构造函数还接受 `exclusive` 参数，以指定结束索引是否应被包含。\n\n该类继承自 `Enumerable`\
  \ 类。因此，后者的类的所有方法都可以使用。\n\n`ObjectRange` 类特有的方法是 `include`。它允许确定一个值是否在值范围内，如下代码所示：\n\
  \n```javascript\nvar value = (...);\n\nvar range = new ObjectRange(0, 10, true);\n\
  \nvar resultat = range.include(value);\n\n/* 如果值在范围内，resultat 等于 true，否则为 false。\
  \ */\n```\n\n该方法也可以用于实现 `each` 循环，如下代码所示：\n\n```javascript\nvar range = new ObjectRange(0,\
  \ 10, true);\n\nrange.each(function(value) {\n\n  (...)\n\n});\n```\n\n## DOM 支持\n\
  \nPrototype 库提供了一个函数用于搜索 DOM 树中所有匹配给定 CSS 样式的元素。\n\n此功能通过 `getElementsByClassName`\
  \ 方法实现。该方法作为方法添加到 `document` 对象。它接收一个 CSS 类名以及可选的 DOM 树节点作为参数。该参数可以省略。在这种情况下，方法使用\
  \ HTML 文档的 `body` 节点作为搜索元素。\n\n以下代码演示了在 HTML 页面中使用该方法：\n\n```html\n<html>\n<head>\n\
  \  (...)\n  <script type=\"text/javascript\">\n    function executer() {\n     \
  \ var elements = document.getElementsByClassName(\"maClasse\"); // ❶\n      // elements\
  \ 包含下方的 div 和 p 标签\n      (...)\n    }\n  </script>\n</head>\n<body onLoad=\"executer()\"\
  >\n  <div id=\"monDiv\" class=\"maClasse\"> <!-- ❷\n    (...)\n    <p class=\"maClasse\"\
  >(...)</p> <!-- ❷ -->\n  </div>\n</body>\n</html>\n```\n\nLivreGougeon 第 139 页 2006\
  \ 年 11 月 28 日 周二 4:23 16\n\n# Prototype 库\n\n**139**\n\n*第 6 章*\n\n标记 ❶ 表示使用该方法在数组中获取与\
  \ maClasse 匹配的元素列表。标记 ❷ 表示相应的标签。\n\n## Ajax 支持\n\nPrototype 库提供了若干功能用于实现 Ajax。它特别允许通过\
  \ HTTP 通道与服务器进行透明通信，既可以是同步的也可以异步的。为此，prototype 使用一个发送对象来交换数据。\n\n### 执行 Ajax 请求\n\
  \n使用 Ajax 支持进行发送发送和接收基于 `AjaxRequest` 类。该类支持同步和异步通信。它会根据浏览器自动检测用于传输的对象。允许此通信的对象存储在\
  \ `AjaxRequest` 类实例的 `transport` 变量中。\n\n### 传输对象\n\n传输对象对应于发送请求和接收其响应的 JavaScript\
  \ 实体。尽管 `XMLHttpRequest` 对象正在被 W3C 标准化，但并非所有浏览器都支持它。然而，这些浏览器提供了类似的对象来实现 Ajax。通过\
  \ `Ajax` 对象的 `getTransport` 方法，prototype 库返回对应浏览器的对象。\n\n`Ajax.Request` 类的实现方式如下：\n\
  \n```javascript\nvar url = \"http://localhost/testAjax.html\";\n\nvar options =\
  \ { (...) };\n\nvar ajaxRequest = new Ajax.Request(url, options);\n```\n\n类的构造函数允许指定地址以及发送选项。它还允许初始化用于浏览器的传输对象。一旦该对象初始化，在异步请求的情况下，构造函数会定位指定的回调函数并发送请求。\n\
  \n\n\n\n\n# 表 6.6 `Ajax.Request` 类的初始化选项\n\n| 选项 | 值 | 说明 |\n| :--- | :--- | :---\
  \ |\n| asynchronous | true (默认) 或 false | 指定请求的执行模式（同步或异步）。 |\n| method | get 或\
  \ post (默认) | 指定发送 Ajax 请求使用的方法。 |\n| onException | 具有两个参数的函数 | 指定在处理 Ajax 请求过程中发生异常时使用的回调函数。第一个参数为\
  \ `Ajax.Request` 类型，第二个为 `Object` 类型。 |\n| onFailure | 具有两个参数的函数 | 指定在请求失败时使用的回调函数。其判断取决于传输对象的\
  \ `status` 属性。此选项仅在异步模式下可用。第一个为 `XMLHttpRequest` 类型，第二个为 `Object` 类型。 |\n| onSuccess\
  \ | 具有两个参数的函数 | 指定在请求成功时使用的回调函数。其判断取决于传输对象的 `status` 属性。此选项仅在异步模式下可用。第一个为 `XMLHttpRequest`\
  \ 类型，第二个为 `Object` 类型。 |\n| onXXX | 具有两个参数的函数 | 指定对 Ajax 请求生命周期中不同事件的观察者。此机制仅在异步模式下可用。XXX\
  \ 的值可以是 `Uninitialized`, `Loading`, `Loaded`, `Interactive` 和 `Complete`。第一个为 `XMLHttpRequest`\
  \ 类型，第二个为 `Object` 类型。 |\n| parameters | 默认 « » | 使用 HTTP `get` 方法时，指定用于请求的参数。字符串必须符合格式\
  \ `param1=valeur1&param2=valeur2`。 |\n| postBody | undefined (默认) | 使用 HTTP `post`\
  \ 方法时，指定用于请求正文字符串。 |\n| requestHeaders | undefined (默认) | 以数组形式指定请求头。 |\n\n在同步调用的情况下，`asynchronous`\
  \ 选项必须设置为值 `false`。此时不能使用回调函数，必须直接使用 `transport` 属性以便通过其 `responseText` 或 `responseXML`\
  \ 属性访问响应内容。\n\n以下代码提供了一个同步 Ajax 请求的实现示例：\n\n```javascript\nvar url = \"http://localhost/testAjax.html\"\
  ;\nvar parametres = \"id=10&langue=FR\";\nvar ajaxRequest = new Ajax.Request(\n\
  \  url,\n  {\n    \"method\": 'get',\n    \"parameters\": parametres,\n    \"onComplete\"\
  : afficherReponse,\n    \"asynchronous\": false,\n    \"onSuccess\": traiterSucces,\n\
  \    \"onFailure\": traiterEchec\n  }\n);\nvar reponseText = ajaxRequest.transport.responseText;\n\
  ```\n\n## Prototype 库\n\n在异步调用的情况下，可以省略 `asynchronous` 选项，因为它的默认值为 `true`。相反，应当定义应用程序需要处理的请求生命周期事件。该机制通过回调函数在请求选项中进行配置。所支持的事件汇总如表\
  \ 6.7 所示。\n\n### 表 6.7 异步 Ajax 请求的生命周期事件\n\n| 事件 | 代码 | 选项键 | 说明 |\n| :--- | :---\
  \ | :--- | :--- |\n| Uninitialized | 0 | onUninitialized | 对应传输对象的初始状态。 |\n| Loading\
  \ | 1 | onLoading | 在传输对象上调用 `open` 方法后触发一次。 |\n| Loaded | 2 | onLoaded | 在请求正确发送后触发。\
  \ |\n| Interactive | 3 | onInteractive | 当传输对象正在接收数据时触发。 |\n| Complete | 4 | onComplete\
  \ | 当请求执行结束时触发，无论成功或失败。 |\n| - | - | onSuccess | 当请求执行完成且请求成功时触发。 |\n| - | - | onFailure\
  \ | 当请求执行完成且请求失败时触发。 |\n| - | - | onException | 在请求执行过程中发生异常时触发。 |\n\n以下代码说明了如何使用\
  \ Prototype 库以异步方式实现 Ajax：\n\n```javascript\nfunction traiterReponse(request,json)\
  \ {\n  var reponseText = request.responseText;\n  (...)\n}\n\nvar url = (...);\n\
  var parametres = (...);\nvar ajaxRequest = new Ajax.Request(\n  url,\n  {\n    \"\
  method\": 'get',\n    \"parameters\": parametres,\n    \"onComplete\": traiterReponse\n\
  \  }\n);\n```\n\n`traiterReponse` 函数的 `request` 参数对应于执行请求的传输对象。\n\n当 HTTP 头指定接收到的数据为\
  \ JSON 格式时，这些数据将被评估并以 JavaScript 对象的形式通过上述 `traiterReponse` 函数的 `json` 参数传递给回调函数。\n\
  \n## JavaScript 库的基础\n\n在异步 Ajax 使用中，Prototype 库提供了为所有请求定义全局回调方法的可能性。这基于 `Ajax.Responders`\
  \ 对象及其 `register` 方法，如代码代码所示：\n\n```javascript\nvar rappelsGlobaux = {\n  onCreate:\
  \ function(){\n    alert(\"onCreate global\");\n  },\n  onComplete: function() {\n\
  \    alert(\"onComplete global\");\n  }\n};\n\nAjax.Responders.register(rappelsGlobaux);\n\
  \nfunction traiterReponse(request,json) {\n  var reponseText = ajaxRequest.transport.responseText;\n\
  \  (...)\n}\n\nvar url = (...);\nvar parametres = (...);\nvar ajaxRequest = new\
  \ Ajax.Request(\n  url,\n  {\n    \"method\": 'get',\n    \"parameters\": parametres,\n\
  \    \"onComplete\": traiterReponse\n  }\n);\n```\n\n标记 ❶ 指明了要使用的回调函数的指定。标记 ❷ 指明了为\
  \ Ajax 请求 全局指定这些函数的方法。\n\n尽管 Prototype 库提供了发送 Ajax 请求并接收其响应的支持，但它让 JavaScript 应用程序负责构建请求结构并提取响应数据。\n\
  \n## HTML 元素的更新\n\nPrototype 库提供了支持，可以通过 Ajax 请求的响应直接更新 HTML 块的内容。当响应返回 HTML 内容时，这种机制特别有用。`Ajax.Updater`\
  \ 类遵循与 `Ajax.Request` 类相同的原理，可以实现这种机制。\n\n以下代码是其使用示例：\n\n```javascript\nvar url\
  \ = (...);\nvar parametres = (...);\nvar htmlDiv = \"monDiv\";\n\nvar ajaxUpdater\
  \ = new Ajax.Updater(\n  htmlDiv,\n  url,\n  {\n    \"method\": 'get',\n    \"parameters\"\
  : parametres,\n    \"onComplete\": traiterReponse\n  }\n);\n```\n\n上述示例将收到的 HTML\
  \ 代码添加到 ID 为 `monDiv` 的网页标签中。包含该标签的网页页面代码如下：\n\n```html\n<html>\n  (...)\n  <body>\n\
  \    (...)\n    <div id=\"monDiv\"></</div>\n    (...)\n  </body>\n</html>\n```\n\
  \n`prototype` 扩展了前述类，以周期性地更新 HTML 页面上的某个元素。这种机制可以通过 `Ajax.PeriodicalUpdater` 类实现。\n\
  \n以下代码是其使用示例：\n\n```javascript\nvar url = (...);\nvar parametres = (...);\nvar htmlDiv\
  \ = \"monDiv\";\n\nvar ajaxUpdater = new Ajax.PeriodicalUpdater(\n  htmlDiv,\n \
  \ url,\n  {\n    \"method\": 'get',\n    \"parameters\": parametres,\n    \"onComplete\"\
  : traiterReponse,\n    \"frequency\": 2\n  }\n);\n```\n\n\n\n\n\n上述示例将收到的 HTML 块添加到标识为\
  \ `monDiv` 的页面标签中。该标签的内容将每两秒刷新一次。\n\n以下代码描述了之前 HTML 页面的新结构，并包含一个收到的 HTML 块示例（标记为\
  \ ❶）：\n\n```html\n<html>\n(...)\n<body>\n(...)\n<div id=\"monDiv\">\n<h1>对 Ajax\
  \ 请求的响应。</h1> **¨** ❶\n<p>响应内容。</p>\n</div>\n(...)\n</body>\n</html>\n```\n\n---\n\
  \n## JavaScript 库的基础知识\n\n表 6.8 总结了 `Ajax.Updater` 和 `Ajax.PeriodicalUpdater` 类中可使用的额外选项。\n\
  \n### 表格 6.8 `Ajax.Updater` 和 `Ajax.PeriodicalUpdater` 类的额外选项\n\n| 选项 | 值 | 描述 |\n\
  | :--- | :--- | :--- |\n| decay | 数字 | 允许在收到的响应与之前收到的响应相同时，指定刷新周期的延展因子。 |\n| evalScripts\
  \ | 布尔值 | 允许指定是否需要评估 Ajax 响应中的 JavaScript 块。 |\n| frequency | 数字 | 允许指定刷新周期。 |\n\
  | insertion | 子类 | 允许指定相对于特定元素插入内容的位置。可能的值有 `Insertion.Before`、`Insertion.Top`、`Insertion.Bottom`\
  \ 和 `Insertion.After`。 |\n\n## 快捷写\n\n编写 JavaScript 脚本通常繁琐，某些表达式和语法反复出现，增加了代码的负担。Prototype\
  \ 库为最常见的表达式提供了“快捷写”。\n\n对于使用 HTML 页面 DOM 元素的脚本，通过标识在 DOM 树中搜索元素是常见的。`$` 函数允许获取标识与函数参数匹配的元素。它基于\
  \ HTML 页面 `document` 对象的 `getElementById` 方法。$` 函数可以接受一个或多个标识作为参数。相应的返回值可以是元素或元素数组。\n\
  \n以下代码演示了此快捷写的使用：\n\n```javascript\n// 查找标识为 \"monIdentifiant\" 的元素\n// 等同于 document.getElementById(\"\
  monIdentifiant\") ;\nvar element = $(\"monIdentifiant\");\n\n// 查找标识为 \"monIdentifiant1\"\
  , \"monIdentifiant2\", \"monIdentifiant3\" 的元素\nvar elements = $(\"monIdentifiant1\"\
  , \"monIdentifiant2\", \"monIdentifiant3\");\n```\n\n在 1.5 版本中，Prototype 库通过 `$$`\
  \ 函数对 `getElementsByClassName` 方法支持相同的机制。它接受一个 CSS 格式的语法作为参数，如下代码所示：\n\n```javascript\n\
  // 查找具有 monStyle 的元素\nvar elements = $$(\"monStyle\") ;\n```\n\n对于表单管理，`$F` 函数允许通过其标识作为参数直接引用表单中的字段。以下代码演示了其用法：\n\
  \n```javascript\nvar element = $F(\"monIdentifiant\") ;\n```\n\n## Prototype 库\n\
  \n变量 `element` 引用下方代码中描述且标识为 `monIdentifiant` 的表单字段：\n\n```html\n<html>\n<body>\n\
  (...)\n<form (...)>\n<input type=\"text\" id=\"monIdentifiant\" value=\"Ma valeur\"\
  />\n</form>\n(...)\n</body>\n</html>\n```\n\n关于数组，Prototype 提供了一个非常有趣的快捷写，即 `$A`\
  \ 函数，它允许自动对简单数组（类数组）应用 `Enumerable` 类的行为，如下代码所示：\n\n```javascript\nvar tableau =\
  \ $A($(\"monDiv\").childNodes);\ntableau.each(function(element) {\n  alert(\"element\
  \ : \"++element);\n});\n```\n\n这种快捷写在处理基于 HTML 页面 DOM 树的操作时特别有用。事实上，一个节点通常有多个子节点，遍历它们往往是必要的。Prototype\
  \ 还允许通过 `$H` 函数非常方便地创建哈希表，以下代码演示了其实现：\n\n```javascript\nvar hashTable = $H({\n \
