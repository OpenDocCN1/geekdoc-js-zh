  \ |\n| Geocode | 允许根据地址返回地点的坐标。执行地址：`http://api.local.yahoo.com/MapsService/V1/geocode`。文档：`http://developer.yahoo.com/maps/rest/V1/geocode.html`\
  \ |\n| Web Search | 基于 Yahoo! 搜索引擎执行互联网搜索。执行地址：`http://api.search.yahoo.com/WebSearchService/V1/webSearch`。文档：`http://developer.yahoo.com/search/web/V1/webSearch.html`\
  \ |\n| Artist Search | 根据各种信息（名称等）搜索艺术家。执行地址：`http://api.search.yahoo.com/AudioSearchService/V1/artistSearch`。文档：`http://developer.yahoo.com/search/audio/V1/artistSearch.html`\
  \ |\n| Album Search | 根据各种信息（名称等）搜索音乐专辑。执行地址：`http://api.search.yahoo.com/AudioSearchService/V1/albumSearch`。文档：`http://developer.yahoo.com/search/audio/V1/albumSearch.html`\
