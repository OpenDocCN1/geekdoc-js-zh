  \n这种技术同样可以用于调用之前描述的 Yahoo! 服务。\n\n### 总结\n\n与 Yahoo!一样，Amazon 也提供了许多访问其信息系统数据的服务。这些数据可以通过\
  \ REST 架构轻松地访问。虽然返回的数据只能以 XML 格式结构化，但 Amazon 提供了使用 XSL 技术对这些数据结构进行转换的可能性。\n\n通过这种技术，可以访问\
  \ JSON 格式的数据，这种格式与 JavaScript 语言更容易配合。也可以在 Web 浏览器内部使用特定的 JavaScript 库进行转换。\n\n\
  ## 结论\n\n在本章中，我们回顾了将通过 REST 架构提供的外部服务数据集成到 JavaScript 应用中的各种技术。与此类服务的交互基于第 5 章中描述的某些\
  \ Ajax 技术，这些技术提供了向其他域站点发送请求的能力。\n\n我们以 Yahoo! 和 Amazon 公司的服务为例，它们选择向公众公开其信息系统的数据。尽管这两种情况下的调用机制是相似的，但在处理接收到的数据时存在某些特殊性。Yahoo!\
  \ 返回 XML 和 JSON 格式的数据，而 Amazon 则提供了进行转换的可能性，以便将数据转换为应用程序可以处理的格式。\n\n## 第六部分：辅助工具\n\
  \n本部分介绍了一些有助于实现 JavaScript 应用以及验证其在不同 Web 浏览器中运行正常情况的工具。\n\n**第 15 章** 讨论了如何使用 `JsUnit`\
  \ 工具和对象模拟（*mock objects*）实现在 JavaScript 应用中的单元测试。其目标是自动化验证 JavaScript 组件的正常运行。\n\
  \n**第 16 章** 描述了开源社区提供的各种用于开发、调试和记录 JavaScript 应用的工具。这些工具对于缩短开发时间和提高应用程序的健壮性提供了宝贵的帮助。本章还讨论了减小\
  \ JavaScript 脚本体积的问题。\n\n## 15 JavaScript 应用测试\n\n在之前的章节中，我们描述了如何使用该语言以及 JavaScript\
  \ 库来开发先进的 Web 2.0 应用。\n\n在本章中，我们关注如何实现 JavaScript 应用测试，旨在检测回归问题并验证应用在不同浏览器中的良好运行情况。我们将看到\
  \ `JsUnit` 工具可以轻松地自动化这些测试的执行。检测到的错误可能是全局的，也可能是特定浏览器的，因为每个浏览器都有解释 JavaScript 的特定方式。\n\
  \n### 单元测试\n\n本节处理了如何使用开源工具 `JsUnit` 实现单元测试。在详细介绍工具的安装方法后，我们描述了测试用例的结构以及可用的 API，用于验证处理的有效性、创建测试集以及加载特定的测试数据。\n\
  \n### JsUnit 实现\n\n`JsUnit` 是一个用 JavaScript 和 Java 编写的开源框架，其创建者是 Edward Hieatt。它属于\
  \ `xUnit` 框架的长列表，其目标是针对特定的技术或问题进行应用程序测试。\n\n`JsUnit` 对应 Java 应用测试工具 `JUnit` 的移植版，其开发始于\
  \ 2001 年。它的目标是适配 `JUnit` 的各种概念，以测试 JavaScript 应用。\n\n正如我们在本章中将看到的，它既提供了单元测试的开发框架，也提供了在不同环境和浏览器中执行测试的工具。该工具位于\
  \ `http://www.jsunit.net`。\n\n在下载并解压 2.2 alpha 11 版本到目录后，我们得到了图 15.1 所示的发行版结构。\n\
  \n**图 15.1：JsUnit 发行版结构**\n\n在发行版的 `jsunit/` 目录中包含了 HTML 测试启动器的主文件，以及 `JsUnit` 的\
  \ Ant 任务，这些元素将在随后详细说明。\n\n`app/` 目录及其子目录包含了 `JsUnit` 的各种 JavaScript 库，以及 HTML 启动器使用的各种\
  \ HTML 文件和样式。`css/` 和 `images/` 目录也包含了这些使用的元素。\n\n`bin/` 目录包含了在不同操作系统上启动和关闭浏览器的脚本。`java/`\
  \ 目录包含了 `JsUnit` 服务器的源代码及其单元测试。最后，`tests/` 目录包含了基于 `JsUnit` 的 JavaScript 单元测试示例。\n\
  \n为了正常运行，`JsUnit` 需要支持 JavaScript 版本高于或等于 1.4 的浏览器。根据工具的文档，`JsUnit` 支持表 15.1 中列出的所有浏览器。\n\
  \n为了使用其服务器和 Ant 任务，该工具需要版本高于或等于 1.4 的 Java 虚拟机。\n\n\n\n\n\n# 版本与操作系统\n\nInternet\
