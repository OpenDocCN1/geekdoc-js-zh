  \n**186** \n\n*第二部分*\n\n### 响应格式\n\ndojo 原生支持不同的响应格式。因此，它可以在将收到的数据传递给回调函数之前进行处理。\n\
  \n`mimetype` 属性允许为 dojo 指定期望的数据格式。\n\n这样，库就知道如何处理 Ajax 请求响应中收到的数据。\n\n表格 7.21 汇总了支持的响应格式。\n\
  \n**表格 7.21 `dojo.io.bind` 函数支持的响应格式**\n\n| 格式 | 描述 |\n| :--- | :--- |\n| text/plain\
  \ | 对应文本格式。在这种情况下，dojo 在向回调函数提供内容之前不会进行任何处理。 |\n| text/javascript | 对应包含 JavaScript\
  \ 代码的格式。dojo 会评估该代码并将结果对象提供给回调函数。 |\n| text/xml | 对应 XML 格式。在这种情况下，dojo 以 XML 文档的形式向回调函数提供内容。\
  \ |\n| text/json | 对应 JSON 格式。在这种情况下，dojo 根据该格式构建与收到的数据对应的 JavaScript 对象。 |\n\n\
  以下代码描述了 `text/json` 格式的实现：\n\n```javascript\nvar proprietes = {\n  url: \"monUrl\"\
  ,\n  mimetype: \"text/json\",\n  load: function(type, donnees, transport) {\n  \
  \  for( var element in donnees ) {\n      dojo.debug(element, \":\", donnees[element]);\n\
  \    }\n  }\n};\n\ndojo.io.bind(proprietes);\n```\n\n该示例根据下描述的响应内容显示如下结果：\n\n`DEBUG:\
  \ now : Wed Aug 23 2006 15:44:19 GMT+0200`\n`DEBUG: element1 : Valeur de l’élément\
  \ 1`\n`DEBUG: element2 : Valeur de l’élément 2`\n\n收到的响应内容对应以下文本：\n\n```json\n{\n\
  \  now: new Date(),\n  element1: \"Valeur de l’élément 1\",\n  element2: \"Valeur\
  \ de l’élément 2\"\n}\n```\n\nLivreGougeon 第 187 页 2006 年 11 月 28 日 星期二 4:23 16\n\
  \n### dojo 库的基础\n\n**187** \n\n*第 7 章*\n\n### 可用的传输类\n\n尽管 dojo 库提供了一个唯一的函数 `dojo.io.bind`，但它实现了不同的内部机制来实现\
  \ Ajax。这些实现并非都基于 `XMLHttpRequest` 类，它们允许解决特殊问题，例如由于该类的安全限制（它阻止了调用另一个域的地址）。\n\n表格\
  \ 7.22 汇总了由 dojo 提供的主要传输层：\n\n**表格 7.22 dojo 提供的主要传输层**\n\n| 传输层 | 描述 |\n| :---\
  \ | :--- |\n| IframeTransport | 基于隐藏的 iframe 用于实现。 |\n| ScriptTransport | 基于动态生成的\
  \ script 元素。 |\n| XMLHTTPTransport | 基于 `XMLHttpRequest`。dojo 自动检测最合适的实现。但是可以通过\
  \ `dojo.io.bind` 函数中的 `transport` 属性显式地指定它。 |\n\n以下代码描述了该传输层的使用：\n\n```javascript\n\
  var proprietes = {\n  url: \"monUrl\",\n  mimetype: \"text/plain\",\n  transport:\
  \ \"XMLHTTPTransport\"\n};\n\ndojo.io.bind(proprietes);\n```\n\n### RPC 支持\n\ndojo\
  \ 提供了以标准化方式调用远程服务。该库支持包括 JSON-RPC 在内的多种协议。\n\ndojo 不是每次都实现服务调用机制，而是通过关联数组来描述服务的特征。该数组的格式被称为\
  \ SMD（简单方法描述）。这种机制允许对代码中描述的处理进行泛化：\n\n```javascript\nfunction traiterResultats(type,\
  \ data, event) {\n  (...)\n}\n\nvar methodeService = function(parametre1, parametetre2)\
  \ {\n  var parametresRequete = { \n    parametre1: parametetre1,\n    parametre2:\
  \ parametetre2 \n  };\n\n  dojo.io.bind({\n    url: \"monUrl\",\n    load: traiterResultats,\n\
  \    mimetype: \"text/plain\",\n    content: parametresRequete\n  });\n};\n\n//\
  \ 执行服务\nmethodeService(\"parametre1\", \"parametre2\");\n```\n\n使用 SMD 语法，上述服务的描述如下如下：\n\
  \n```json\n{\n  \"serviceType\": \"JSON-RPC\",\n  \"serviceURL\": \"monUrl\",\n\
  \  \"methods\": [\n    {\n      \"name\": \"methodeService\",\n      \"parameters\"\
  : [\n        { \"name\": \"parametre1\" },\n        { \"name\": \"parametre2\" }\n\
  \      ]\n    }\n  ]\n}\n```\n\n为了实现 JSON-RPC，dojo 提供了 `dojo.rpc.JsonService` 类，它考虑了前面的描述。该类扩展了通用类\
  \ `dojo.rpc.RpcService`，后者包含了解释服务描述格式的所有逻辑。\n\n\n\n\n\n以下代码描述了 `dojo.rpc.JsonService`\
  \ 类的实现：\n\n```javascript\n// 描述内容对应上面的 JSON 代码\n\nvar description = \"maDescriptionDeService.smd\"\
  ;\n\nvar monService = dojo.rpc.JsonService(description);\n\nmonService.methodeService(\"\
  parametre1\", \"parametre2\");\n```\n\n为了接收请求的响应，服务方法的调用会返回对象，可以通过 `addCallback`\
  \ 方法在这些对象上注册观察者。当收到请求响应时，这些观察者将收到通知。\n\n此外，观察者方法将响应中包含的结果作为参数。\n\n以下代码描述了该方法的实现：\n\
  \n```javascript\nfunction traiterResultats(resultat) {\n  (...)\n}\n```\n\n```javascript\n\
  var reception = monService.methodeService(\"parametre1\", \"parametre2\"); reception.addCallback(traiterResultats);\n\
  ```\n\n我们在第 14 章中详细介绍了如何使用 `dojo.rpc.YahooService` 类来访问 Yahoo! 提供的服务。\n\n### 表单提交\n\
  \ndojo 库提供了使用 Ajax 请求透明地发送表单数据的可能性。\n\n该功能的实现非常简单，因为它基于 `formNode` 选项，该选项引用了相应的表单节点。库负责确定表单元素并使用它们来构建\
  \ Ajax 请求中包含的数据。\n\n以下代码描述了该功能的实现：\n\n```javascript\nvar proprietes = {\n  url:\
  \ \"monUrl\",\n  mimetype: \"text/plain\",\n  formNode: dojo.byId(\"monFormulaire\"\
  ),\n  load: function(type, data) {\n    // 文本数据处理\n    (...)\n  }\n};\n\ndojo.io.bind(proprietes);\n\
  ```\n\n上述代码基于下方描述的 HTML 页面表单：\n\n```html\n<html>\n  (...)\n  <body>\n    (...)\n\
  \    <form id=\"monFormulaire\">\n      <input type=\"hidden\" name=\"champ1\" value=\"\
  valeur1\"/>\n      <input type=\"text\" name=\"champ2\" value=\"valeur2\"/>\n  \
  \  </form>\n    (...)\n  </body>\n</html>\n```\n\n### 总结\n\ndojo 库在其对 Ajax 技术的支持上强调了使用的简便性。因此，该支持的核心函数\
  \ `dojo.io.bind` 隐藏了 Ajax 实现的所有复杂性，并集成了根据上下文自动确定要用算法的机制。\n\n在本节中，我们详细介绍了 `dojo.io.bind`\
  \ 函数的基本功能，例如发送 Ajax 请求、处理响应、错误管理或对接收到的数据类型的支持。\n\n该函数提供了通过回调函数管理浏览器“上一步”和“下一个”按钮的功能。它还允许在\
  \ Ajax 请求后更新 HTML 页面的地址，以便实现历史记录。\n\n### 应用日志\n\ndojo 库提供了一个管理应用程序日志的通用工具。它定义在 `dojo.logging.Logger`\
  \ 模块中，必须通过 `dojo.require` 方法引入。\n\n引入该模块会创建一个 `dojo.log` 对象，允许写入特定级别的日志。\n\n表 7.23\
  \ 汇总了该对象用于写入应用程序日志的不同可用方法。这些方法都接受一个字符串形式的消息作为参数。\n\n**表 7.23 应用程序日志实现方法**\n\n| 方法\
  \ | 描述 |\n| :--- | :--- |\n| `dojo.log.debug` | 添加一条 debug 级别的应用程序日志。 |\n| `dojo.log.info`\
  \ | 添加一条 info（信息）级别的应用程序日志。 |\n| `dojo.log.warn` | 添加一条 warn（警告）级别的应用程序日志。 |\n|\
  \ `dojo.log.err` | 添加一条 err（错误）级别的应用程序日志。 |\n| `dojo.log.crit` | 添加一条 crit（严重错误）级别的应用程序日志。\
  \ |\n| `dojo.log.exception` | 添加一条针对异常抛出的应用程序日志。 |\n\n调试模式的激活通过 `djConfig` 对象及其属性\
  \ `isDebug` 实现。如果该属性的值为 `true`，则所有应用程序日志都将显示。否则，只显示致命性消息，例如与异常抛出相关的消息。\n\n以下代码描述了显示日志的配置：\n\
  \n```html\n<html>\n  <head>\n    (...)\n    <script>djConfig = { isDebug: true }</script>\n\
  \    <script language=\"JavaScript\" type=\"text/javascript\" src=\"../../dojo.js\"\
  >\n    ➥</script>\n    <script language=\"JavaScript\" type=\"text/javascript\"\
  >\n      dojo.require(\"dojo.logging.Logger\");\n      (...)\n    </script>\n  </head>\n\
  \  (...)\n  </body>\n</html>\n```\n\n该支持的使用只需通过表 7.23 汇总的方法来实现，如下代码所示：\n\n```html\n\
  <html>\n  <head>\n    (...)\n    <script>djConfig = { isDebug: true }</script>\n\
  \    <script language=\"JavaScript\" type=\"text/javascript\" src=\"../../dojo.js\"\
  ></script>\n    <script language=\"JavaScript\" type=\"text/javascript\">\n    \
  \  dojo.require(\"dojo.logging.Logger\");\n      dojo.addOnLoad(function() {\n \
  \       var message1 = \"使用 dojo.log.debug() 显示\";\n        dojo.log.debug(message1);\n\
  \        var message2 = \"使用 dojo.log.info() 显示\";\n        dojo.log.info(message2);\n\
  \        var message3 = \"使用 dojo.log.warn() 显示\";\n        dojo.log.warn(message3);\n\
  \        var message4 = \"使用 dojo.log.err() 显示\";\n        dojo.log.err(message4);\n\
  \        var message5 = \"使用 dojo.log.crit() 显示\";\n        dojo.log.crit(message5);\n\
  \        var message6 = \"使用 dojo.log.exception() 显示\";\n        try{\n        \
  \  dojo.raise(\"une exception\");\n        } catch(err) {\n          dojo.log.exception(message6,\
  \ err, true);\n        }\n      });\n    </script>\n  </head>\n  <body>\n    <p>dojo\
  \ 日志工具的测试页...</p>\n  </body>\n</html>\n```\n\ndojo 提供了根据其严重性过滤日志的可能性。以下代码给出了实现示例：\n\
  \n```javascript\n// 设置所需的级别\ndojo.log.setLevel(dojo.log.getLevel(\"WARNING\"));\n\
  \n// 写入应用程序日志\ndojo.log.info(\"信息应用程序日志。\");\ndojo.log.warn(\"警告应用程序日志。\");\n```\n\
  \n在上述代码中，只有第二条消息会被显示。\n\n注意存在 `dojo.debug.Firebug` 模块，它允许在 Firefox 调试工具的控制台中写入日志。\n\
  \n### 性能测量\n\ndojo 库提供了一个有趣的模块，用于测量函数或对象方法的执行时间。该支持位于 `dojo.profile` 模块中。\n\n如下代码所示，在使用和导入它之前（标记\
  \ ❷），应用程序必须重置（标记 ❶）现有的执行时间记录：`delete dojo[\"profile\"];` `dojo.require(\"dojo.profile\"\
  );`。\n\n随后，为了记录处理的执行时间，以下代码指示了支持如何提供 `start`（标记 ❶）和 `end`（标记 ❷）方法来界定记录的开始和结束，同时为其分配逻辑名称（标记\
  \ ❶）：\n\n```javascript\nfunction fonction1() { (...) }\ndojo.profile.start(\"fonction1\"\
  );\nfonction1();\ndojo.profile.end(\"fonction1\");\n```\n\n\n\n\n\n# 193\n## 第 7\
  \ 章\n\n请注意 `dojo.profile` 对象在包含模块时已自动实例化。\n\n在以下代码中，`dojo.profile` 对象提供了 `dump`\
  \ 方法（标记 ❶）以便将结果显示在 Web 上：\n\n(...)\n\n```\ndojo.profile.start(\"fonction1\");\n\
  fonction1();\ndojo.profile.end(\"fonction1\");\n```\n\n(...)\n\n```\ndojo.profile.dump(true);\
  \ ❶\n\n请注意，`dump` 方法接受一个参数，用于指定是否自动将结果表格插入 Web 页面中（值为 `true`）。如果参数值为 `false`，则必须手动将方法返回的表格添加到页面中。\n\
  \n以下代码通过一个完整的示例提供了该模块的实现示例：\n\n```javascript\n// 重置记录\ndelete dojo[\"profile\"];\n\
  \n// 导入模块\ndojo.require(\"dojo.profile\");\n\nfunction fonction1() {\n  var nombre\
  \ = 0;\n  for(var cpt=0;cpt<100;cpt++) {\n    nombre = nombre % 5 + cpt;\n  }\n\
  }\n\nfunction fonction2() {\n  var chaine = \"\";\n  var motif = \"element,\";\n\
  \  for(var cpt=0;cpt<1000;cpt++) {\n    chaine = chaine + motif;\n  }\n}\n\n// 测量函数\
  \ fonction1 的执行时间\ndojo.profile.start(\"fonction1\");\nfonction1();\ndojo.profile.end(\"\
  fonction1\");\n\n// 测量函数 fonction2 的执行时间\ndojo.profile.start(\"fonction2\");\nfonction2();\n\
  dojo.profile.end(\"fonction2\");\n\n// 显示测量的执行时间\ndojo.profile.dump(true);\n```\n\
