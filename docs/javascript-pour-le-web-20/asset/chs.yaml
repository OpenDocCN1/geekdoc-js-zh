  \ 页 2006 年 11 月 28 日星期二 4:23 16\n\n### dojo 库的图形支持\n**311**\n\n*第 11 章*\n\n### 基于\
  \ HTML 的方法\n\ndojo 提供了基于 HTML 结构化图形组件的可能性。默认情况下，dojo 会遍历页面上的所有标签以检测并实例化图形组件。\n\n\
  ```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n    djConfig = {\n\
  \      parseWidgets: false, <!-- ¨ ❶ -->\n      searchIds: [\"conteneurComants\"\
  , \"monComposant\"] <!-- ¨ ❷ -->\n    };\n  </script>\n</head>\n<body>\n  <div id=\"\
  conteneurComants\"> <!-- ¨ ❸ -->\n    ...\n  </div>\n  <div id=\"monComposant\"\
  dojoType=\"...\">...</div> <!-- ¨ ❹ -->\n</body>\n</html>\n```\n\n尽管如此，这种行为可以通过\
  \ HTML 属性（标记 ❶）使用 `dojoType` 来禁用。在这种情况下，该属性在 HTML 级别没有意义，但用于为图形组件指定初始化参数。\n\n```html\n\
  <div dojoType=\"Dialog\" id=\"fenetre\" bgColor=\"white\" bgOpacity=\"0.9\" toggle=\"\
  fade\" toggleDuration=\"250\"></div>\n```\n\n### 基于编程的方法\n\ndojo 库提供了通过编程指定和加载图形组件的可能性，这是基于\
  \ `dojo.widget.createWidget` 函数的。\n\n该函数接收图形组件的类型、一个包含其不同属性的关联数组以及一个可选的与组件链接的节点。\n\
  \n```javascript\n// 获取绑 div 标签\nvar monDiv = dojo.byId(\"monDiv\");\n\n// 创建图形组件\n\
  var proprietes = {\n  title: \"我的窗口标题\"\n};\n\nvar monComposant = dojo.widget.createWidget(\
  \ // ¨ ❶ -->\n  \"FloatingPane\", proprietes, monDiv);\n```\n\n\n\n随后，可以通过 `addChild`\
  \ 方法将组件连接起来。该方法接收一个图形组件作为参数，从而通过提供添加子组件的能力来管理嵌套组件。\n\n以下代码描述了如何使用 `addChild` 方法（标记\
  \ ❶）将组件连接起来：\n\n```javascript\n// 获取挂载的 div 标签\nvar monDiv = dojo.byId(\"monDiv\"\
  );\n\n// 创建根图形组件\nvar composantRacine = dojo.widget.createWidget(\n\"LayoutContainer\"\
  , {}, monDiv);\n\n// 创建子组件\nvar proprietes = {\n  layoutAlign: \"left\"\n};\nvar\
  \ composantEnfant = dojo.widget.createWidget(\n\"ContentPane\", proprietes);\n\n\
  // 将组件添加到根组件中\ncomposantRacine.addChild(composantEnfant); // ❶\n```\n\n# 图形组件的操作\n\
  \n现在我们已经说明了如何定义图形组件，现在可以详细述引用它们的方法，以便对其进行操作并为其关联处理逻辑。\n\n## 使用组件管理器\n\ndojo 库基于\
  \ `dojo.widget.manager` 对象来存储图形组件。该对象由 `dojo.widget.Manager` 模块自动实例化。\n\n表格 11.12\
  \ 汇总了该对象可用的主要方法。\n\n### 表 11.12 `dojo.widget.manager` 对象的主要方法\n\n| 方法 | 参数 | 描述\
  \ |\n| :--- | :--- | :--- |\n| `add` | 组件实例 | 将图形组件添加到管理器的组件列表中。 |\n| `destroyAll`\
  \ | - | 销毁管理器的所有组件。 |\n| `getAllWidgets` | - | 返回一个包含管理器中所有图形组件的数组。 |\n| `getImplementation`\
  \ | 组件名称、传递给构造函数的对象、属性和方法的关联数组以及一个命名空间 | 根据 `getImplementationName` 方法获取其对象后，实例化一个图形组件。\
  \ |\n| `getImplementationName` | 组件名称和命名空间 | 根据组件名称和命名空间返回图形组件的构造函数。 |\n| `getWidgetById`\
  \ | 组件标识符 byId | 根据标识符返回图形组件的实例。 |\n| `getWidgetByNode` | DOM 节点 byNode | 返回与传入参数节点对应的管理器图形组件。\
  \ |\n| `getWidgetsPackageList` | - | 返回已注册的图形组件包列表。 |\n| `getWidgetsByFilter` |\
  \ 过滤函数和标志位 byFilter | 根据过滤函数返回管理器图形组件的子集。如果标志位包含 `true`，则只返回第一个匹配的组件。 |\n| `getWidgetsByType`\
  \ | 组件类型 byType | 返回管理器中指定类型的所有图形组件。 |\n| `registerWidgetPackage` | 包名 | 将名称注册为图形组件包。默认注册了\
  \ `dojo.widget` 包。 |\n| `remove` | 索引 | 根据组件在管理器组件数组中的索引销毁图形组件。 |\n| `removeById`\
  \ | 组件标识符 | 根据组件标识符销毁图形组件。 |\n\n这些方法基于 `widgets` 和 `widgetIds` 属性来存储图形组件，这两个属性均对应于数组。同样注意存在\
  \ `topWidgets` 属性，它是一个关联数组，用于存储顶层（即无父组件的）图形组件。\n\n表格 11.12 中描述的大多数方法可以通过 `dojo.widget`\
  \ 对象的方法直接访问。这些方法在组件管理器的上下文中自动执行，管理器可以通过 `dojo.widget.manager` 对象访问。\n\n表格 11.13\
  \ 通过描述它们与组件管理器方法的对应关系对其进行了汇总。\n\n### 表 11.13 与组件管理器相关的 `dojo.widget` 对象主要方法\n\n\
  | 函数 | 描述 |\n| :--- | :--- |\n| `addWidget` | 对应 `dojo.widget.manager` 对象的 `add`\
  \ 方法。 |\n| `all` | 对应 `dojo.widget.manager` 对象的 `getAllWidgets` 方法。 |\n| `destroyAllWidgets`\
  \ | 对应 `dojo.widget.manager` 对象的 `destroyAll` 方法。 |\n| `getImplementation` | 对应\
  \ `dojo.widget.manager` 对象的 `getWidgetImplementation` 方法。 |\n| `getImplementationName`\
  \ | 对应 `dojo.widget.manager` 对象的 `getWidgetImplementationName` 方法。 |\n| `getWidgetById`\
  \ 和 `byId` | 对应 `dojo.widget.manager` 对象的 `getWidgetById` 方法。 |\n| `getWidgetsByFilter`\
  \ 和 `byFilter` | 对应 `dojo.widget.manager` 对象的 `getWidgetsByType` 方法。（注：原文此处可能可能有误）\
  \ |\n| `getWidgetsByType` 和 `byType` | 对应 `dojo.widget.manager` 对象的 `getWidgetsByType`\
  \ 方法。 |\n| `registerWidgetPackage` | 对应 `dojo.widget.manager` 对象的 `registerWidgetPackage`\
