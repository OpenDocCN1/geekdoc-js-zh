  \ 函数，以便图形组件注册事件观察者。\n\n## 文本框与自动补全\n\n文本框图形组件在任何 Web 应用中都是至关重要的，因为它为用户提供了在区域输入信息的能力。本节介绍的组件为此类类型的组件添加了一个非常有趣的额外功能，即输入时的自动补全。\n\
