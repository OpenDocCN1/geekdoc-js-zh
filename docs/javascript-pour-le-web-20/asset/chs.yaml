  \ ❷\n      <Argument Name=\"Service\" Value=\"AWSECommerceService\"/>\n      <Argument\
  \ Name=\"SearchIndex\" Value=\"Books\"/>\n      <Argument Name=\"SubscriptionId\"\
  \ Value=\"Votre_ID_ici\"/>\n      <Argument Name=\"Keywords\" Value=\"Spring par\
  \ la pratique\"/>\n      <Argument Name=\"ResponseGroup\" Value=\"Medium\"/>\n \
