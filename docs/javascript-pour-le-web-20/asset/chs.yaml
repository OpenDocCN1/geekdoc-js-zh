  \ 库提供了实现自动补全的支持。\n\n这种机制使得输入字段能够根据已输入的字符提供选项。这种功能通常用于 Web 邮件界面，以方便电子邮箱地址的输入。\n\n\
  图 10.3 展示了一个支持自动补全的字段示例。\n\n**图 10.3**\n\n*使用自动补全的字段示例*\n\n确定要显示的元素列表有两种方法。第一种是根据页面中包含的\
  \ JavaScript 数组在本地构建此列表。第二种是基于 Ajax 技术。\n\n第一种方法使用 `Autocompleter.Local` 类，其构造函数接受四个参数：\n\
  \n* 输入字段的 ID；\n* 用于显示自动补全结果的区域 ID；\n* 包含用于补全数据的数组；\n* 选项。\n\n该方法支持的选项汇总于表 10.17。\n\
  \nLivreGougeon 第 279 页 2006 年 11 月 28 日星期二 4:23 16\n\n### 轻量级图形库\n\n**279**\n\n\
  第 10 章\n\n### 表 10.17 `Autocompleter.Local` 类构造函数的选项\n\n| 选项 | 默认值 | 描述 |\n| :---\
  \ | :--- | :--- |\n| choices | - | 指定在自动补全列表中显示的选项数量。 |\n| fullSearch | false |\
  \ 在字符串数组的任何位置进行搜索。 |\n| ignoreCase | true | 搜索忽略大小写。 |\n| partialChars | 2 | 自动补全生效前需要输入的字符数。\
  \ |\n| partialSearch | true | 仅对数组字符串的开头进行搜索。 |\n\n以下代码描述了一个准备使用的 `script.aculo.us`\
  \ 自动补全输入区域。\n\n它包含一个区域标签（标记 ❶）、一个 ID 输入字段（标记 ❷）以及一个初始隐藏的用于显示自动补全结果的区域（标记 ❸）：\n\n\
  ```html\n<p>\n<label for=\"recherche\">搜索字段:</label> **¨** ❶\n<br />\n<input id=\"\
  recherche\" autocomplete=\"off\" size=\"40\" type=\"text\" value=\"\" /> **¨** ❷\n\
  </p>\n<div class=\"recherche_auto_complete\" id=\"liste_recherche\" style=\"display:none\"\
  >\n➥\n</div> **¨** ❸\n```\n\n以下 JavaScript 代码允许对 `recherche` ID 输入区域应用自动补全机制：\n\n\
  ```javascript\nfunction initialiser() {\n  var donnees = [ \"un texte\", \"un autre\
  \ texte\" ];\n  var options = { partialChars : 3};\n  new Autocompleter.Local(\"\
  recherche\", \"liste_recherche\", donnees, options);\n}\n\nEvent.observe(window,\"\
  load\",initialiser);\n```\n\n基于 Ajax 技术的第二方法通过 `Ajax.Autocompleter` 类实现。该类的构造函数与\
  \ `Autocompleter.Local` 类接受相同的参数，不同之处第三个参数现在是一个地址，该地址负责返回补全结果。\n\n当在字段中输入内容时，会向指定地址发送一个\
  \ POST 类型的 HTTP 请求。它包含一个与输入字段 ID 对应的参数，其值为所输入的文本。请求的响应包含要在随后出现的区域中显示的补全 HTML 内容。它必须符合如下格式化的列表：\n\
  \n```html\n<<ul>>\n  <li>Premier 结果（第一个结果）</li>\n  <li>Second 结果（第二个结果）</li>\n</ul>\n\
  ```\n\n```\n\nLivreGougeon 第 280 页 2006 年 11 月 28 日星期二 4:23 16\n\n# JavaScript 图库\n\
  \n**280**\n\n第四部分\n\n使用这种方法，可以使用表 10.18 和 10.19 汇总的选项和回调函数。\n\n### 表 10.18 `Ajax.Autocompleter`\
  \ 类构造函数的选项\n\n| 选项 | 默认值 | 描述 |\n| :--- | :--- | :--- |\n| frequency | 0.4 | 发送\
  \ Ajax 请求的频率 |\n| indicator | null | 执行请求时显示的元素。 |\n| minChars | 2 | 自动补全生效前需要输入的字符数。\
  \ |\n| paramName | | 发送请求时使用的 ID |\n| tokens | [] | 允许选择的字符列表 |\n\n如果我们回到示例，输入区域的结构是等价的。然而，现在的配置变为：\n\
  \n```javascript\nfunction initialiser() {\n  var options = {paramName: \"value\"\
  , minChars: 2};\n  new Ajax.Autocompleter(\"recherche\", \"liste_recherche\", \"\
  /autocomplete\", options);\n}\n\nEvent.observe(window,\"load\",initialiser);\n```\n\
  \n### 总结\n\n`script.aculo.us` 库提供了不同的功能，其中最有趣的功能是在应用程序中添加视觉效果。这些效果通过图形通知以及区域和结果的渐进式赋予了应用程序更高的易用性。\n\
  \n`script.aculo.us` 还提供了一个框架用于实现拖放以及支持自动补全的输入区域。\n\n需要指出，与 `prototype` 库配合使用，`script.aculo.us`\
  \ 是 Ruby on Rails 框架 JavaScript 模块的基础。\n\nLivreGougeon 第 281 页 2006 年 11 月 28 日星期二\
  \ 4:23 16\n\n### 轻量级图形库\n\n**281**\n\n第 10 章\n\n## 结论\n\n本章描述的库非常有意义，因为它们很轻量级且实现了有限的功能。这种简单性并没有阻止它们通过让\
  \ Web 应用受益于 Web 2.0 功能来提供确定的附加价值。\n\n这些库的目标是通过隐藏语言的某些复杂性来简化 JavaScript 开发，通过清晰分离不同的关注点来改进应用的结构，并提供复杂的组件和图形效果。\n\
  \n我们刻意只讨论了此类中主要的 JavaScript 库。互联网还提供了许多其他各方面具有价值的库。\n\n所有这些轻量级库也适用于希望通过 Web 2.0\
  \ 行为丰富界面的经典 Web 应用。\n\nLivreGougeon 第 282 页 2006 年 11 月 28 日星期二 4:23 16\n\nLivreGougeon\
  \ 第 283 页 2006 年 11 月 28 日星期二 4:23 16\n\n# 11\n\n## 图形支持\n\nde dojo 库\n\n\n\n\n\n\
  我们在书的第二部分已经看到，`dojo` 库提供了一个开发高级 JavaScript 应用的框架。该框架允许对模块进行结构化和按需加载。该库基于这一机制提供了从集合到\
  \ Ajax 技术的各种支持。\n\n除了第 7 章中描述的模块外，`dojo` 库还提供了开发图形应用程序的功能。这些功能由一组实用模块组成，它们通过 `DOM`\
  \ 技术方便对 HTML 页面的结构进行操作，并基于 `CSS` 方便对其外观进行操作。\n\n`dojo` 库还整合了一些强大的功能，以便优化的方式实现 Web\
  \ 页面中的事件管理。这些事件对应于 `DOM` 事件以及由对象方法触发的事件。\n\n`dojo` 库在浏览器的特殊性之上提供了一个抽象层，并提供了一个用于实现和使用图形组件的框架。该库的方法是混合的：它允许\
  \ HTML 页面与图形组件的 JavaScript 类以及它们的 HTML 和 CSS 代码进行精细的交互，同时提供了通过编程操作这些组件的可能性。\n\n\
  ## 图形 JavaScript 库\n\n## 基础 HTML 模块\n\n`dojo` 库提供了基础模块，特别允许对样式的操作和效果的管理，同时集成了不同浏览器的特殊性。\n\
  \n这些模块实际上是 `dojo.html` 模块的子模块，在表 11.1 中进行了汇总。\n\n### 表 11.1 与 dojo HTML 支持相关的模块\n\
  \n| 模块 |  |\n| :--- | :--- |\n| `dojo.html.color` | 允许管理颜色。 |\n| `dojo.html.common`\
  \ | 包含 `dojo` 的基础 HTML 函数。 |\n| `dojo.html.display` | 包含与显示相关的函数。 |\n| `dojo.html.iframe`\
  \ | 允许管理 HTML 页面内部的 `iframe`。 |\n| `dojo.html.layout` | 处理 HTML 元素的定位。 |\n| `dojo.html.selection`\
  \ | 包含与选择 HTML 元素相关的函数。 |\n| `dojo.html.style` | 允许管理 HTML 元素的样式。 |\n| `dojo.html.util`\
  \ | 包含实用函数。 |\n\n主要模块即 `dojo.html.common`、`dojo.html.style` 和 `dojo.html.display`\
  \ 在后续章节中进行了详细介绍。\n\n### 基础函数\n\n`dojo` 通过 `dojo.html.common` 模块提供了各种与 HTML 技术相关的基础函数。为了使用这些函数，必须通过\
  \ `dojo.require` 函数导入该模块。\n\n表 11.2 汇总了该模块的不同函数。\n\n### 表 11.2 `dojo.html.common`\
