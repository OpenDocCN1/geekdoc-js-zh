  \ de cet outil est disponible sur le site du projet `rialto`, à l’adresse [`http://rialto.application-servers.com/wiki/rialtostudio:video`](http://rialto.application-servers.com/wiki/rialtostudio:video)\
  \ tandis qu’une version en ligne est utilisable à l’adresse [`http://rialto.application-servers.com/rialto/rialtoStudio/`](http://rialto.application-servers.com/rialto/rialtoStudio/).\n\
  \n# Bibliothèques JavaScript graphiques \n\n## Conclusion\n\nLa bibliothèque `rialto`\
  \ offre d’intéressants mécanismes afin de mettre en œuvre des applications de gestion\
  \ aux interfaces Web riches. La bibliothèque propose ainsi une importante collection\
  \ de composants graphiques permettant de créer des formulaires et de les positionner\
  \ sur l’interface graphique. Des composants plus complexes sont également fournis\
  \ afin de créer des arbres et des tableaux.\n\nLa plupart de ces composants possèdent\
  \ un ensemble de fonctionnalités très riches, dont la mise en œuvre se réalise simplement\
  \ par le biais de paramètres de configuration. Ces fonctionnalités vont de l’édition\
  \ de lignes de tableaux au glisser-déposer, offrant ainsi la possibilité de développer\
  \ simplement des interfaces graphiques riches, efficaces et très interactives.\n\
  \nCette bibliothèque facilite l’utilisation des techniques `Ajax` afin de soumettre\
  \ les données de formulaires. Ces techniques sont complètement masquées par le composant\
  \ de formulaire, mais elles restent néanmoins utilisables directement si nécessaire.\n\
  \n# Partie V : Utilisation de services externes\n\nAprès avoir décrit la façon de\
  \ structurer ses applications `JavaScript` avec des bibliothèques telles que `dojo`\
  \ ou `rialto`, nous allons voir qu’une application `JavaScript` peut intégrer et\
  \ interagir avec un outil ou un service externe en se fondant sur une API `JavaScript`\
  \ ou les techniques d'Ajax`.\n\nLe chapitre 13 décrit la façon d’utiliser des API\
  \ `JavaScript` externes. Après avoir présenté les mécanismes de fonctionnement de\
  \ `Google Maps`, nous détaillons l’utilisation des API fournies par cet outil de\
  \ cartographie dans des applications `JavaScript`.\n\nLe chapitre 14 se penche sur\
  \ l’utilisation de services externes accessibles par l’intermédiaire de l’architecture\
  \ `REST`. Les services fournis par `Yahoo!` et `Amazon` sont utilisés à titre d’exemple.\n\
  \n## CHAPITRE 13 : Google Maps\n\nDéveloppé par `Google`, société emblématique du\
  \ Web 2.0, l’outil `Google Maps` permet d’implémenter des fonctionnalités de cartographie\
  \ dans une application `JavaScript`. Cette intégration est très poussée, et l’application\
  \ et l’outil peuvent interagir de manière très fine en se fondant sur des événements.\n\
  \n`Google Maps` a réussi la gageure d’offrir des fonctionnalités évolues tout en\
  \ gardant une API de programmation simple, avec, de surcroît, la possibilité de\
  \ l’étendre.\n\n### Description et fonctionnement\n\nAvant d’aborder la mise en\
  \ œuvre de `Google Maps`, nous allons décrire le fonctionnement de cet outil fondé\
  \ sur un service cartographique de `Google`, accédé par l’intermédiaire d’une API\
  \ `JavaScript` fournie librement par cette société.\n\nLes cartes sont décomposées\
  \ en éléments unitaires désés par le terme `tile`. L’API `JavaScript` de `Google\
  \ Maps` construit la carte en se fondant sur ces éléments, accessibles depuis des\
  \ serveurs de `Google`. L’image visible de la carte correspond à un assemblage de\
  \ différents éléments calculés par un serveur de cartographie.\n\nLa figure 13.1\
  \ illustre ce principe.\n\nL’outil offre la possibilité d’enrichir les cartes avec\
  \ différents éléments graphiques afin de fournir des informations relatives à une\
  \ localisation ou de signaler une localisation particulière. Dans ce cas, l’API\
  \ `JavaScript` de `Google Maps` assemble des images avec le fond de carte de façon\
  \ à afficher la carte enrichie.\n\nLa figure 13.2 illustre ce mécanisme.\n\n`Google`\
  \ met en outre à disposition un service structuré en différents éléments afin de\
  \ répondre aux requêtes cartographiques.\n\n![](img/index-413_1.jpg)\n\n**Figure\
  \ 13.1**\n*Construction de la carte affichée*\nPortions de carte - **Zone affichée**\n\
  \n**Figure 13.2**\n*Assemblage de composants d’affichage*\n\nLa figure 13.3 les\
  \ constituants de ce service.\nAPI `JavaScript` `Google Maps` : **Satellite**, **Carte**,\
  \ Serveurs de portions, Serveurs de calcul d’images de carte.\n\n**Figure 13.3**\n\
  *Constituants du service cartographique*\n\n## Mise en œuvre\n\nL’API `JavaScript`\
  \ fournie par `Google Maps` s’appuie sur différentes classes, que nous allons décrire\
  \ tout long de cette section. Ces classes permettent d’intégrer des cartes évoluées\
  \ dans des applications `JavaScript`.\n\nNous détaillerons en outre la façon d’installer\
  \ l’outil dans une page Web de l’utiliser et montrerons comment enrichir les cartes\
  \ en leur ajoutant diverses informations.\n\nNous indiquerons enfin les façons de\
  \ faire interagir l’application avec les cartes afin de réagir à des actions de\
  \ l’utilisateur.\n\n### Installation\n\nAvant tout chose, une clé gratuite doit\
  \ être obtenue à partir de l’adresse [`http://www.google.com/apis/maps/signup.html`](http://www.google.com/apis/maps/signup.html)\
  \ afin de pouvoir utiliser l’outil.\n\nUne fois la clé obtenue, la page Web doit\
  \ importer le code `JavaScript` de l’application. L’adresse contenue dans l’attribut\
  \ `src` doit inclure la clé précédemment récupérée.\n\nComme le montre le code suivant,\
  \ cette opération est réalisée par l’intermédiaire d’une balise `script` (repère\
  \ 1) :\n\n```html\n<html>\n<head>\n  <script src=\"http://maps.google.com/maps?file=api&v=2&key=Votre_ID_ici\"\
  \ type=\"text/javascript\"></script>\n  (...)\n</head>\n(...)\n</html>\n```\n\n\
  Comme nous pouvons le constater, l’adresse n’est pas un fichier `JavaScript` statique\
  \ mais une ressource `JavaScript` calculée dynamiquement en fonction des paramètres\
  \ suivants :\n\n- `file` : type de fichier `JavaScript` à retourner. Dans notre\
  \ cas, il s’agit des API. La valeur de la propriété est donc `api`.\n- `v` : version\
  \ de l’API `Google Maps` utilisée, actuellement la 2.\n- `key` : clé d’utilisation\
  \ de l’outil `Google Maps`.\n\nPour pouvoir utiliser des éléments vectoriels tels\
  \ que les tracés de lignes dans les cartes, il est recommandé d’ajouter l’espace\
  \ de nommage `VML` ainsi qu’un style `CSS`. Ces ajouts sont indispensables pour\
  \ le bon fonctionnement de cette fonctionnalité dans Internet Explorer.\n\n\n\n\n\
