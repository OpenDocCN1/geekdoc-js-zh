  \ les paramètres du constructeur de cette classe ainsi que les propriétés de son\
  \ tableau associatif.\n\n### Tableau 12.23 Paramètres du constructeur de la classe\
  \ `rialto.widget.Form`\n\n| Paramètre | Type | Description |\n| :--- | :--- | :---\
  \ |\n| `name` | Une chaîne de caractères | Correspond au nom du formulaire. |\n\
  | `url` | Un nombre entier | Correspond au positionnement horizontal du composant.\
  \ |\n| `parent` | Un objet | Correspond à un composant rialto ou un conteneur HTML\
  \ classique auquel est rattaché le composant. |\n| `parameters` | Un tableau associatif\
  \ | Contient les propriétés récapitulées au tableau 12.24. |\n\n### Tableau 12.24\
  \ Propriétés du tableau associatif `parameters` du constructeur de la classe `rialto.widget.Form`\n\
  \n| Propriété | Type | Description |\n| :--- | :--- | :--- |\n| `boolAsynch` | Un\
  \ booléen | Spécifie si le formulaire doit être soumis de manière classique (valeur\
  \ false) ou en se fondant sur les techniques Ajax (valeur true). |\n| `boolIframe`\
  \ | Un booléen | Dans le cas d’une requête Ajax, especifie si la technique fondée\
  \ sur les iframes doit être utilisée. Si la valeur de cette propriété est false,\
  \ une requête Ajax fondée sur la classe `XMLHttpRequest` est réalisée. |\n| `boolWithFenWait`\
  \ | Un booléen | Spécifie si une fenêtre d’attente doit être affichée pendant l’exécution\
  \ de la requête Ajax de soumission. Ne peut être activée lors d’une soumission classique\
  \ de formulaire. |\n| `canBeCancel` | Un booléen | Spécifie si la requête Ajax peut\
  \ être annulée durant son exécution. |\n| `imgBtonSubmit` | Une instance d’un bouton\
  \ | Correspond au bouton permettant de déclencher la soumission du formulaire. |\n\
  | `method` | Une chaîne de caractères | Correspond à la méthode HTTP utilisée afin\
  \ de soumettre le formulaire. |\n| `onSuccess` | Une référence à une fonction |\
  \ Correspond à la fonction de rappel utilisée lors de l’utilisation d’une requête\
  \ Ajax fondée sur la classe `XMLHttpRequest`. |\n\n# La bibliothèque rialto\n\n\
  Ce composant permet d’envoyer les données du formulaire de manière classique sans\
  \ recour aux techniques Ajax. L’adresse spécifiée dans le paramètre `url` est alors\
  \ utilisée afin de soumettre le formulaire. L’interface graphique de la page est\
  \ remplacée par celle construite par la ressource accédée. Cette approche se configure\
  \ en spécifiant la valeur false pour la propriété `boolAsynch`.\n\nCe composant\
  \ offre également la possibilité de soumettre le formulaire en se fondant sur les\
  \ techniques Ajax. Deux approches sont en ce cas envisageables. La première se fonde\
  \ sur la classe `XMLHttpRequest` et une fonction de rappel afin de traiter la réponse\
  \ à la soumission. La seconde consiste à utiliser une iframe cachée.\n\nAvec la\
  \ première approche, les propriétés `boolAsynch` (repère ❸) et `boolIframe` (repère\
  \ ❹) doivent respectivement contenir les valeurs true et false tandis que la propriété\
  \ `onSuccess` (repère ❺) doit référencer la fonction de rappel (repère ❶) à utiliser\
  \ pour traiter la réponse.\n\nL’adresse de la requête doit toujours être spécifiée\
  \ dans le paramètre `url` (repère ❷).\n\nCette fonction de rappel accepte en paramètre\
  \ l’instance de la classe `XMLHttpRequest` utilisée afin d’exécuter la requête.\
  \ Pour plus de détails sur l'utilisation de la classe `XMLHttpRequest`, le code\
  \ suivant donne un exemple de mise en œuvre :\n\n```javascript\nfunction traiterRequete(requete)\
  \ {\n  try {\n    eval(requete.responseText);\n  } catch (err) {\n    alert(err.message);\n\
  \  }\n}\n\nvar formulaire = new rialto.widget.Form(\"/ajax/test.js\", {\n  method:\
  \ \"POST\",\n  boolAsynch: true,\n  boolIframe: false,\n  boolWithFenWait: false,\n\
  \  canBeCancel: true,\n  onSuccess: traiterRequete,\n  imgBtonSubmit: null\n});\n\
  ```\n\nLe 代码 ci-dessus définit les paramètres du formulaire afin d’utiliser les\
  \ techniques Ajax (repère ❸) et particulièrement la classe `XMLHttpRequest` (repère\
  \ ❹). La réponse à la soumission est traitée par une fonction de rappel (repère\
  \ ❶). Le composant `rialto.widget.Form` offre également la possibilité de soumettre\
  \ le formulaire de manière Ajax en se fondant sur une iframe cachée. Dans ce cas,\
  \ la valeur de la propriété `boolIframe` est true et aucune fonction de rappel n'est\
  \ nécessaire.\n\n## Positionnement\n\nLes composants de ce type sont des conteneurs\
  \ permettant de positionner les composants dans une page Web. Ces conteneurs peuvent\
  \ s’imbriquer de manière récursive afin de mettre en œuvre des positionnements complexes.\n\
  \nLa figure 12.5 illustre les classes relatives à la mise en œuvre des composants.\n\
  \n```text\nAbstractComponent\n+moveTo()\n+setLeft()\n+setTop()\n+setWidth()\n\n\
  AbstractContainer\n+setHeight()\n+setVisible()\n+setDraggable()\n+add()\n+setPosition()\n\
  +removeContents()\n+setStyle()\n+getHtmlCont()\n+placeIn()\n+remove()\n+getHtmlExt()\n\
  +getHtmlImp()\n+getHtmlDD()\n+getHtmlRZ()\n\nTab\n+addTabItem()\n+fixeProp()\n+setDisplay()\n\
  +closeFen()\n+removeTabItem()\n+setTitle()\n+activeFen()\n\nSplitter\n+activeTab()\n\
  +onSetDisplay()\n+setVisible()\n\nFrame\nSimpleWindow\n+setVisible()\n+setTitle()\n\
  ```\n**Figure 12.5**: *Classes relatives au positionnement*\n\nCe support permet\
  \ de définir les différentes zones affichées dans un navigateur et de les positionner\
  \ en se fondant sur un gestionnaire de positionnement redimensionable ou des onglets.\n\
  \n### Panel\n\nLa bibliothèque rialto offre la possibilité de définir des panels\
  \ en fondant sur la classe `rialto.widget.SimpleWindow`. Ces panels peuvent par\
  \ la suite être rattachés à une balise HTML `div`. Cette dernière peut bien correspondre\
  \ à une balise définie en dehors de rialto qu’à une balise `div` interne d’un composant\
  \ graphique de cette bibliothèque, telle une zone d’un gestionnaire de positionnement.\n\
  \n### Affichage des composants de type `rialto.widget.SimpleWindow`\n\nLa bibliothèque\
  \ n’autorise l’affichage que d’un seul composant de ce type dans une page Web. L’application\
  \ ne peut donc mettre en œuvre les composants qu’en prenant en compte cet aspect.\
  \ Il sera possible dans les prochaines versions de la bibliothèque d’en afficher\
  \ plusieurs simultanément.\n\nLe constructeur de ce composant graphique prend en\
  \ paramètre un tableau associatif contenant les propriétés récapitulées au tableau\
  \ 12.25.\n\n### Tableau 12.25 Propriétés utilisables par le constructeur de la classe\
  \ `rialto.widget.SimpleWindow`\n\n| Propriété | Type | Description |\n| :--- | :---\
  \ | :--- |\n| `icone` | Une chaîne de caractères | Correspond à l’icône associée\
  \ au panel. |\n| `parent` | Un objet | Correspond à un composant rialto ou un conteneur\
  \ HTML classique auquel est rattaché le composant. |\n| `title` | Une chaîne de\
  \ caractères | |\n\n\n\n\n\n对应面板的标题。\n\n以下代码实现了一个此类组件（标记 ❶），包含输入表单的区域（标记 ❷）：\n\n\
