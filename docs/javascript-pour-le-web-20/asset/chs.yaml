  \ `xml` 属性（标记 ❷）。否则，它将尝试使用 `XMLSerializer` 类（如果存在）来将节点转换为 XML（标记 ❸）。\n\n## DOM 树的操作\n\
  \n对页面 DOM 树的操作是基于 DOM 技术提供的功能实现的（见第 4 章）。这些功能特别允许通过页面的 `document` 对象访问一个或一组节点，并操作其不同的节点（添加、修改和删除属性）以及\
  \ DOM 树的结构（添加和删除节点）。\n\nDOM 树的操作处理必须在它加载后进行。此类位于 `head` 标签中的处理处理将基于 Web 页面的 `load`\
  \ 事件。\n\n以下代码展示了如何基于 `initialiser` 函数（标记 ❶）实现这一原理，该函数在页面 DOM 树初始化后（标记 ❷）被调用：\n\n\
  ```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction initialiser()\
  \ { ¨ ❶\n  var monDiv = document.getElementById(\"monDiv\");\n  /* 变量 monDiv 已填充了标识符为\
  \ monDiv 的节点 */\n  (...) \n}\n</script>\n</head>\n<body onload=\"initialiser();\"\
  > ¨ ❷\n<div id=\"monDiv\">(...)</div>\n</body>\n</html>\n```\n\n请注意，在 `script` 标签块末尾且位于页面头部（`head`\
  \ 标签）直接调用函数 `initialiser` 会产生错误，因为标识符为 `monDiv` 的标签尚未初始化。\n\n### 事件管理\n\nJavaScript\
  \ 语言提供了 Web 页面 DOM 结构上事件发生的可能性。这些事件既可以对应用户的操作，也可以对应对该结构的修改。\n\n### 工作原理\n\n为了更好地理解事件管理，了解它们在\
  \ Web 页面中的处理流很重要，页面通常由按层级排列的标签组成。在元素上触发的事件会沿着其祖先或后代的链逐级传递。\n\n如表 8.4 所示，存在两种事件传播模式。\n\
  \n**表 8.4 事件传播模式**\n\n| 模式 | 描述 |\n| :--- | :--- |\n| 上升 (Ascendant) | 事件从低层元素向高层元素传播。这种模式被称为\
  \ *bubbling*（冒泡），最初由 Internet Explorer 浏览器实现。 |\n| 下降 (Descendant) | 事件从高层元素向低层元素传播。这种模式被称为\
  \ *capturing*（捕获），最初由 Netscape 浏览器实现。 |\n\nW3C 财团标准化了这种机制，引入了双方向的传播。正如图 8.2 所示，事件首先在树结构中向下触发，然后向上。\n\
  \n\n\n\n\n注意，冒泡阶段通常用于处理事件。\n\n可以根据 HTML 标签的某些属性将事件与其关联。这些属性的名称以 `on` 为前缀，后跟事件的名称。\n\
  \n它们的值允许指定当事件发生时要执行的 JavaScript 处理。\n\n以下代码展示了基于页面的 `load` 事件（标记为 ❶）和按钮的 `click`\
  \ 事件（标记为 ❷）实现该机制的示例：\n\n```html\n<<html>\n<head>\n<script type=\"text/javascript\"\
  >\nfunction traitementIntialisationPage() { // ❶\n(...)\n}\nfunction traitementClicBouton()\
  \ { // ❷\n(...)\n}\n</script>\n</head>\n<body onload=\"traitementIntialisationPage();\"\
  > // ❶\n(...)\n<input type=\"button\" value=\"Cliquer sur le bouton\"\nonclick=\"\
  traitementClicBouton();\"/> // ❷\n(...)\n</body>\n</html>\n```\n\n当 Web 页面加载时，调用\
  \ `traitementIntialisationPage` 函数；当点击按钮时，调用 `traitementClicBouton` 函数。\n\n注意，这种技术存在\
  \ HTML 或 xHTML 标记语言代码与 JavaScript 脚本语言混合的问题。这不利于 Web 页面的理解和可维护性。\n\n幸运的是，还有另一种解决方案可以在通过标签属性将事件监听器关联到\
  \ HTML 标签。这种解决方案使用了 DOM 技术，Internet Explorer 浏览器除外，它提供了一种特定的方法。\n\n## DOM 级 2 支持\n\
  \nDOM 技术支持根据名称分类的各种事件。表 8.5 汇总了这些类别。\n\n### 表 8.5 DOM 级 2 支持的事件类别\n\n| 类别 | 类型 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| 事件 | Events | 涵盖所有类型的事件。 |\n| HTML 相关事件 | HTMLEvents\
  \ | 对应 `abort`, `blur`, `change`, `focus`, `error`, `load`, `reset`, `scroll`, `select`,\
  \ `submit`, `unload` 等事件。 |\n| 用户界面相关事件 | UIEvents | 对应与用户界面相关的事件（`DOMActivate`,\
  \ `DOMFocus`, `DOMFocusOut`）以及由键盘触发的事件（`keydown`、`keypress` 和 `keyup`）。在 DOM 级 3\
  \ 中，键盘事件在 `KeyboardEvents` 类型中处理。 |\n| 鼠标事件 | MouseEvents | 对应由鼠标触发的事件，如 `click`,\
  \ `mousedown`, `mousemove`, `mouseout`, `mouseover` 和 `mouseup`。 |\n| 变变事件 | MutationEvents\
  \ | 定义影响模型逻辑结构的事件。 |\n\nDOM 技术提供了多种方法来处理事件。这些方法基于监听器，监听器可以针对各种事件注册和注销。\n\n## 事件监听器\n\
  \n事件监听器对应于对象的一个函数或方法，当 HTML 页面元素的事件触发时，该方法会被调用。为此，它必须针对事件进行注册。当监听器不再被使用时，必须将其注销。\n\
  \n`addEventListener` 和 `removeEventListener` 方法允许管理这些监听器的注册和注销。它们应用于 DOM 节点，参数为事件名称、事件发生时要调用的函数以及定义在何种传播阶段处理事件的标志位。值\
  \ `true` 对应捕阶段，`false` 对应冒泡阶段。\n\n以下代码说明了这两个方法（标记为 ❷ 和 ❸）用于注册和注销一个函数（标记为 ❶）作为监听器的实现：\n\
  \n```javascript\n// 定义监听器\nfunction traitementEvenement(evenement) { // ❶\n(...)\n\
  }\nvar monNoeud = document.getElementById(\"monNoeud\");\n// 注册监听器\nmonNoeud.addEventListener(\"\
  click\", traitementEvenement, false); // ❷\n(...)\n// 注销监听器\nmonNoeud.removeEventListener(\"\
  click\", traitementEvenement, false); // ❸\n```\n\n在调用监听器函数时（标记为 ❶），DOM 将触发事件作为参数提供。该实例对应于\
  \ `Event` 类的一个实例，其属性和方法分别在表 8.6 和 8.7 中进行了汇总。\n\n### 表 8.6 `Event` 类的属性\n\n| 属性\
  \ | 类型 | 描述 |\n| :--- | :--- | :--- |\n| bubbles | 布尔值 | 表示事件是否处于冒泡传播阶段。 |\n| cancelable\
  \ | 布尔值 | 表示事件是否可以被取消。 |\n| currentTarget | EventTarget | 对应于分配事件处理程序的节点。 |\n| eventPhase\
  \ | 整数 | 对应于指示事件被拦截时阶段的数字。可能值为 `CAPTURING_PHASE`（值 1）、`AT_TARGET`（值 2）和 `BUBBLING_PHASE`（值\
  \ 3）。 |\n| target | EventTarget | 对应于触发事件的节点。 |\n| timeStamp | 整数 | 对应事件发生的时间。 |\n\
  | type | 字符串 | 对应事件类型。 |\n\n注意，`Event` 类的所有属性都是只读的。\n\n### 表 8.7 `Event` 类的方法\n\n\
  | 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| initEvent | 事件类型两个标志位 | 允许初始化通过编程触发的事件。参数中的标志位允许指定事件是否可以冒泡或取消。\
  \ |\n| preventDefault | - | 允许取消事件。不执行与事件关联的默认处理。 |\n| stopPropagation | - | 允许在捕获或冒泡阶段停止事件的传播。\
  \ |\n\n以下代码说明了在事件处理函数中 `Event` 类的主要属性和方法的实现：\n\n```javascript\n// 定义监听器\nfunction\
  \ traitementEvenement(evenement) {\n// 显示事件类型\nalert(\"Type: \"+ evenement.type);\n\
  // 取消事件\nevenement.preventDefault();\n}\n```\n\n`MouseEvent` 类扩展了之前的 `Event` 类，以便添加与鼠标触发的事件相关的信息。表\
  \ 8.8 汇总了该类的额外属性。\n\n### 表 8.8 `MouseEvent` 类的额外属性\n\n| 属性 | 类型 | 描述 |\n| :--- |\
  \ :--- | :--- |\n| altKey, ctrlKey, metaKey, shiftKey | 布尔值 | 分别表示触发事件时是否按了 Alt、Ctrl、Meta\
  \ 或 Shift 键。 |\n| button | 整数 | 对应触发事件的鼠标按钮。 |\n| clientX, clientY | 整数 | 对应浏览器显示区域（窗口或框架）中的鼠标坐标。\
  \ |\n| relatedTarget | - | 允许存储另一个由事件实现的另一个元素。它通常在鼠标移动事件（mouseover, mouseenter 和\
  \ mouseout）中填充。 |\n\n\n\n\n\n`screenX`, `screenY`\n\n整数\n\n对应鼠标在屏幕上的坐标。\n\n以下代码展示了鼠标触发事件观察者如何使用该类的示例：\n\
  \n```javascript\n// 定义观察者\nfonction traitementEvenement(evenement) {\n  // 显示事件的坐标\n\
  \  alert(\"Coordonnées du pointeur de la souris: \"\n  +evenement.clientX+\",\"\
  +evenement.clientY);\n  alert(\"Coordonnées de l’offset de la souris: \"\n  +evenement.screenX+\"\
  ,\"+evenement.screenY);\n}\n```\n\n## Internet Explorer 浏览器支持\n\nInternet Explorer\
  \ 浏览器没有实现 DOM 2 层技术，并且具有特定的事件处理方式。虽然与其他浏览器相似，但观察者的实现方式有所不同。\n\n因此，`attachEvent`\
  \ 和 `detachEvent` 方法允许管理事件观察者的注册和注销。它们应用于 DOM 节点上，并接收事件名称和当事件发生时要调用的函数作为参数。\n\n\
  ## 事件名称\n\n传递给 `attachEvent` 和 `detachEvent` 方法的事件名称与 DOM 2 级使用的名称并不完全对应。Internet\
  \ Explorer 强制在它们前面加上前缀 `on`。因此，在该浏览器中的 `onclick` 事件对应于 DOM 2 级的 `click` 事件。\n\n\
  这两个方法的使用方式与前一节中的类似方法相同，如下代码所示：\n\n```javascript\n// 定义观察者\nfonction traitementEvenement()\
  \ { \n  var evenement = window.event;\n  (...)\n}\n\nvar monNoeud = document.getElementById(\"\
  monNoeud\");\n// 注册观察者\nmonNoeud.attachEvent(\"onclick\", traitementEvenement);\
  \ \n(...)\n// 注销观察者\nmonNoeud.detachEvent(\"onclick\", traitementEvenement);\n```\n\
  \n尽管观察者的注册和注销（分别见标记 ❸ 和 ❹）的实现方式与 DOM 类似，但在处理函数（标记 ❶）中获取事件（标记 ❷）是特定于浏览器的。\n\n事实上，既可以通过\
  \ HTML 页面中 `window` 对象的 `event` 属性来访问事件，也可以通过观察者函数的参数（如果已指定的话）来访问。\n\n此外，Internet\
  \ Explorer 中表示事件的类并不具有与 DOM 2 级相同的属性和方法。该类包含了有关事件管理和鼠标指针的信息。\n\n因此，`srcElement`\
  \ 属性对应于 `Event` 类的 `target` 属性。`pageX` 和 `pageY` 属性不再存在，但可以通过 `clientX` 和 `clientY`\
  \ 属性加上滚动值来模拟这些属性本应具有。\n\n增加了 `offsetX` 和 `offsetY` 属性，它们对应于鼠标指针相对于触发事件元素的坐标。\n\n\
  以下代码展示了鼠标触发事件观察者如何使用该类的示例：\n\n```javascript\n// 定义观察者\nfonction traitementEvenement(evenement)\
  \ {\n  // 显示事件的坐标\n  alert(\"Coordonnées du pointeur de la souris: \"\n  +evenement.clientX+\"\
  ,\"+evenement.clientY);\n  alert(\"Coordonnées de l’offset de la souris: \"\n  +evenement.offsetX+\"\
  ,\"+evenement.offsetY);\n}\n```\n\n最后，Internet Explorer 中表示事件的类不支持 `preventDefault`\
  \ 和 `stopPropagation` 方法。尽管如此，这些方法的功能可以通过各自的 `returnValue` 和 `cancelBubble` 属性在该浏览器中实现。\n\
  \n以下代码展示了如何在 Internet Explorer 浏览器中实现这些机制：\n\n```javascript\n// 定义观察者\nfonction\
  \ traitementEvenement(evenement) {\n  // 停止事件传播\n  evenement.cancelBubble = true;\n\
  \  // 取消事件\n  evenement.returnValue = false;\n}\n```\n\n## 事件类型\n\n在浏览器中可以使用的不同类型事件中，我们首先可以区分与图形界面相关的事件。后者允许检测界面的状态变化及其组件状态的变化。\n\
  \n表 8.9 总结了这些不同的事件类型。\n\n### 表 8.9 图形界面事件\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `contextmenu`\
  \ | 当用户尝试打开页面右键菜单时发生。 |\n| `focus`, `blur` | 分别在元素获得和失去焦点时发生。 |\n| `load` | 当 Web\
  \ 页面完全加载时发生。 |\n| `resize` | 当浏览器窗口调整大时发生。 |\n| `scroll` | 当 Web 页面滚动时发生。 |\n| `unload`\
  \ | 当 Web 页面卸载时发生。 |\n\n鼠标触发的事件既可以响应鼠标移动，也可以响应鼠标按钮。表 8.10 总结了这些不同的事件类型。\n\n### 表\
  \ 8.10 鼠标触发事件\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `click` | 在对元素上点击鼠标时发生。 |\n| `dblclick`\
  \ | 在对元素上双击鼠标时发生。 |\n| `mousedown`, `mouseup` | 分别在鼠标按键被按下和释放时发生。 |\n| `mousemove`\
  \ | 当鼠标指针移动时发生。 |\n| `mouseover`, `mouseout` | 分别在鼠标指针进入和离开元素对应的区域时发生。 |\n\n各种事件可以在表单元素上发生，以检测字段值的变化，也可以在表单提交时发生在表单本身。表\
  \ 8.11 总结了这些不同的事件类型。\n\n### 表 8.11 表单触发事件\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `change`\
  \ | 当表单元素发生变化时发生。该事件在大多数情况下仅被浏览器部分支持。 |\n| `reset` | 当用户重置表单时发生时发生。 |\n| `select`\
  \ | 当用户在输入框中选择文本时发生。 |\n| `submit` | 当用户提交表单时发生。 |\n\n当用户按下和释放一个或多个键盘键时，会触发键盘事件。表\
  \ 8.12 总结了这些不同的事件类型。\n\n### 表 8.12 键盘触发事件\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `keydown`,\
  \ `keyup` | 分别在键盘键被按下和释放时发生。 |\n| `keypress` | 当键盘键被按下时发生。该事件并非对所有按键都会发生，特别是箭头键以及\
  \ Alt、Ctrl 和 Shift 键。 |\n\n\n\n\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\nfunction traiterEvenementsClavier(evenement) {\n// 显示事件的坐标\nalert(\"Touche (keyCode):\
  \ \"+evenement.keyCode);\nalert(\"Touche (charCode): \"+evenement.charCode);\n}\n\
  \ndocument.addEventListener(\"keydown\",\ntraiterEvenementsClavier, false);\n\n\
  document.addEventListener(\"keypress\",\ntraiterEvenementsClavier, false);\n</script>\n\
  </head>\n<body>\n(...)\n</body>\n</html>\n```\n\n请注意，当对同一个元素同时处理了 `keydown` 和 `keypress`\
  \ 事件时，`keyup` 事件将不会触发。反之，如果这两个事件中没有一个一个被处理，或者只有其中一个被处理了，则会触发 `keyup`。\n\n## 手动触发事件\n\
  \nJavaScript 提供了通过编程手动模拟用户事件的可能性。\n\nDOM 2 级技术允许基于 `createEvent`、`initMouseEvent`\
  \ 和 `dispatchEvent` 方法来触发鼠标事件。\n\n第一个对应于 页面 `document` 对象的一个方法，并接收所需的事件类型作为参数。它允许创建一个待触发的事件实例。\n\
  \n第二个对应于所创建事件的方法，用于初始化该事件。它接收事件的各种特征作为参数。\n\n表 8.13 按照这些参数出现的顺序汇括了该方法的参数。\n\n###\
  \ 表 8.13 `MouseEvent` 类的 `initMouseEvent` 方法参数\n\n| 参数 | 类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| typeArg | 字符串 | 指定事件类型。 |\n| canBubbleArg | 布尔值 | 指定事件是否可以冒泡。 |\n\
  | cancelableArg | 布尔值 | 指定事件是否可以取消。 |\n| viewArg | AbstractView | 指定与事件关联的视图。通常使用\
  \ `window` 对象作为此参数。 |\n| detailArg | 整数 | 指定事件中考虑的鼠标点击次数。 |\n| screenXArg | 整数 |\
  \ 对应事件的 `screenX` 值。 |\n| screenYArg | 整数 | 对应事件的 `screenY` 值。 |\n| clientXArg |\
  \ 整数 | 对应事件的 `clientX` 值。 |\n| clientYArg | 整数 | 对应事件的 `clientY` 值。 |\n| ctrlKeyArg\
  \ | 布尔值 | 指定 Ctrl 键是否被视为按下。 |\n| altKeyArg | 布尔值 | 指定 Alt 键是否被视为按下。 |\n| shiftKeyArg\
  \ | 布尔值 | 指定 Shift 键是否被视为按下。 |\n| metaKeyArg | 布尔值 | 指定 Meta 键是否被视为按下。 |\n| buttonArg\
  \ | 整数 | 指定被视为按下的鼠标按钮。 |\n| relatedTargetArg | EventTarget | 对应事件的 `relatedTarget`\
  \ 属性。 |\n\n只有 `dispatchEvent` 方法真正触发网页 DOM 树节点上的事件。它接收之前创建的事件作为参数。\n\n以下代码提供了一个基于\
  \ DOM 2 级实现 `createEvent`（标记 ❶）、`initMouseEvent`（标记 ❷）和 `dispatchEvent`（标记 ❸）方法的示例，以模拟对复选框（标记\
  \ ❹）的点击：\n\n```html\n<html>\n<head>\n<script type=\"text/javaScript\">\nfunction\
  \ simulerClic(){\nvar elt = document.getElementById(\"coche\");\n// 创建事件\nvar evt\
  \ = document.createEvent(\"MouseEvents\"); // ❶\n// 初始化事件\nevt.initMouseEvent(\"\
  click\",true,true,window, // ❷\n0,0,0,0,0,false,false,\nfalse,false,0,null);\n//\
  \ 触发事件\nelt.dispatchEvent(evt); // ❸\n}\n</script>\n</head>\n<body>\n(...)\n<input\
  \ type=\"checkbox\" id=\"coche\"/> // ❹\n(...)\n</body>\n</html>\n```\n\n与前几节描述的机制类似，此功能必须专门针对\
  \ Internet Explorer 浏览器进行实现。\n\n在该浏览器中，它基于 `createEventObject` 和 `fireEvent` 方法。\n\
  \n第一个方法提供了获取一个空白事件实例的可能性。随后必须直接使用其不同的属性对其进行初始化。\n\n`fireEvent` 方法允许使用之前创建的实例来指定要触发的事件类型。\n\
  \n以下代码是之前代码的适配版本，使用了 `createEventObject`（标记 ❶）和 `fireEvent`（标记 ❷）方法，以便在 Internet\
  \ Explorer 浏览器中运行：\n\n```html\n<html>\n<head>\n<script type=\"text/javaScript\"\
  >\nfunction simulerClic(){\nvar elt = document.getElementById(\"coche\");\n// 创建事件\n\
  var evt = document.createEventObject(); // ❶\n// 初始化事件\nevt.screenX = 0;\nevt.screenY\
  \ = 0;\nevt.clientX = 0;\nevt.clientY = 0;\n// 触发事件\nelt.fireEvent(\"onclick\",\
  \ evt); // ❷\n}\n</script>\n</head>\n<body>\n(...)\n<input type=\"checkbox\" id=\"\
  coche\"/>\n(...)\n</body>\n</html>\n```\n\n## 样式操作\n\n如前所述，样式元素通过 `id`、`class` 和\
  \ `style` 等名称连接到页面结构上。\n\n### 更改标签的类\n\n基于 DOM 的便利性，JavaScript 提供了修改各种样式相关元素的可能性。\n\
  \n利用 DOM，JavaScript 语言提供了修改与标签关联的类及其本身的可能性。\n\n以下代码提供了一个基于 DOM 2 级实现此技术的示例：\n\n\
  ```javascript\nfunction modifierClasse(identifiantNoeud, nomClasse) {\nvar balise\
  \ = document.getElementById(identifiantNoeud);\nbalise.setAttribute(\"class\", nomClasse);\n\
  }\n\nmodifierClasse(\"monNoeud\", \"maNouvelleClasse\");\n```\n\n### 在 Firefox 中修改标签的\
  \ CSS 类\n\nFirefox 浏览器允许修改与标签关联的类，但不会正确应用新类的 CSS 属性。为了规避这个问题，建议使用标签的 `style` 属性来定义的样式。我们将在下一节中详细介绍这种技术。\n\
  \n### 更改标签的样式属性\n\n当通过 `style` 属性为标签定义样式时，JavaScript 语言提供了访问其值并可能通过 DOM 支持对其进行修改的可能性。\n\
  \n此时，可以提供一种仅修改一种样式属性的处理方式，如下代码所示，基于 HTML 页面节点的 `style` 属性（标记 ❶）进行操作：\n\n```javascript\n\
  function modifierProprieteStyle(identifiantNoeud, nomPropriete, valeurPropriete)\
  \ {\n```\n\n\n\n\n```javascript\nvar balise = document.getElementById(identifiantNoeud);\n\
  \nbalise.style[nomPropriete] = valeurPropriete; ❶\n\n}\n```\n\n`modifierProprieteStyle(\"\
  monNoeud\", \"background\", \"red\");` 某些如 dojo 这样的库提供了样式操作函数，这些函数考虑了不同浏览器的特殊性。dojo\
  \ 中关于这方面的模块将在本书的第 11 章进行详细介绍。\n\nLivreGougeon Page 222 Mardi, 28\\. novembre 2006\
  \ 4:23 16\n\n# 使用 JavaScript 进行 Web 图形编程\n**222**\n\n### 第三部分 高级概念\n\n现在我们已经描述了让\
  \ HTML 和 CSS 与 JavaScript 交互的各种技术，我们将讨论各种良好的实现实践，以及关于在 HTML 页面中使用 XML 和 XSLT 技术的高级概念。\n\
  \n### 事件管理\n\n我们之前已经描述了如何使用 JavaScript 管理事件。该概念的良好实现实践是将其提取到 HTML 标签之外。这种技术可以最大限度地减少\
  \ HTML 和 JavaScript 语言的混合。\n\n为此，必须实现一个通用的事件监听器注册和注销 API，以便处理不同浏览器的特殊性。\n\n### 通用\
  \ API\n\n如前所述，浏览器不允许以统一的方式注册和注销监听器。大多数 JavaScript 库都提供了通用的 API 来集成并隐藏这些特殊性。\n\n\
  以下代码提供了该原则的实现示例：\n\n```javascript\n// 通用监听器注册函数\nfunction enregistrerObservateur(element,\
  \ evenement, fonction, capture) {\n  capture = capture || false;\n  if( element.addEventListener\
  \ ) {\n    element.addEventListener(evenement, fonction, capture);\n  } else if(\
  \ element.attachEvent ) {\n    element.attachEvent(\"on\"+evenement, fonction);\n\
  \  }\n}\n\n// 通用监听器注销函数\nfunction desenregistrerObservateur(element, evenement,\
  \ fonction, capture) {\n  if( element.removeEventListener ) {\n    element.removeEventListener(evenement,\
  \ fonction, capture);\n  } else if( element.detachEvent ) {\n    element.detachEvent(\"\
  on\"+evenement, fonction);\n  }\n}\n```\n\n使用 `enregistrerObservateur`（标记 ❶）和 `desenregistrerObservateur`（标记\
  \ ❷）函数的方法如下：\n\n```javascript\n// 定义监听器\nfonction traitementEvenement(evenement)\
  \ {\n  (...)\n}\n```\n\nLivreGougeon Page 223 Mardi, 28\\. novembre 2006 4:23 16\n\
  \n# Web 图形界面基础\n**223**\n\n### 第 8 章\n\n```javascript\nvar monNoeud = document.getElementById(\"\
  monNoeud\");\n\n// 注册监听器\nenregistrerObservateur(monNoeud, \"click\", traitementEvenement);\
  \ ❶\n\n(...)\n\n// 注销监听器\ndesenregistrerObservateur(monNoeud, \"click\", traitementEvenement);\
  \ ❷\n```\n\n## 作为监听器的对象方法\n\n我们之前描述的各种技术仅允许对函数的注册和注销。因此，不支持直接使用对象方法。\n\n然而，通过 JavaScript\
  \ `Function` 类的 `call` 和 `apply` 方法可以很容易实现此功能。此时必须用一个函数封装该方法，以便在其关联对象的上下文中执行它。随后，在注册和注销时应使用该函数。\n\
  \n以下代码提供了通过 `enregistrerObservateurObjet`（标记 ❷）和 `desenregistrerObservateurObjet`（标记\
  \ ❸）函数实现此功能的示例，这些函数基于 `call` 函数（标记 ❶）以及之前过的 `enregistrerObservateur` 和 `desenregistrerObservateur`\
  \ 函数：\n\n```javascript\nfunction convertirMethode(objet, methode) {\n  return function(evenement)\
  \ {\n    return methode.call(objet, evenement || window.event); ❶\n  }\n}\n\nfunction\
  \ enregistrerObservateurObjet(element, evenement, objet, methode, capture) { ❷\n\
  \  var fonction = convertirMethode(objet, methode);\n  enregistrerObservateur(element,\
  \ evenement, fonction, capture);\n}\n\nfunction desenregistrerObservateurObjet(element,\
  \ evenement, objet, methode, capture) { ❸\n  var fonction = convertirMethode(objet,\
  \ methode);\n  desenregistrerObservateur(element, evenement, fonction, capture);\n\
  }\n```\n\n## XML 和 XSLT 技术的使用\n\nJavaScript 语言提供了在 Web 页面实现 XML 和 XSLT 技术的能力。目标是创建空的\
  \ XML 文档并对 XML 文档进行格式转换。\n\n### 创建 XML 文档\n\n浏览器对 XML 技术的支持并不统一，特别是在内存中创建 XML 文档以及将文本转换为\
  \ XML 方面。\n\n因此，应该实现各种函数以整合这些特殊性。\n\nLivreGougeon Page 224 Mardi, 28\\. novembre\
  \ 2006 4:23 16\n\n# 使用 JavaScript 进行 Web 图形编程\n**224**\n\n### 第三部分\n\n以下函数允许在 Firefox\
  \ 浏览器（标记 ❶）和 Internet Explorer（标记 ❷）中创建一个空的 XML 文档：\n\n```javascript\nfunction creerDocumentXML()\
  \ {\n  if( document.implementation && document.implementation.createDocument) {\
  \ ❶\n    var documentXML = document.implementation.createDocument(\"\",\"\", null);\n\
  \    documentXML.async = false;\n    return documentXML;\n  } else if( window.ActiveXObject\
  \ ) { ❷\n    var documentXML = new ActiveXObject(\"Microsoft.XMLDOM\");\n    documentXML.async\
  \ = false;\n    return documentXML;\n  }\n}\n```\n\n请注意，上述代码中使用了 `async` 属性，它指示整个文档应以同步或异步方式加载到内存中。在第二情况下，必须注册一个\
  \ `load` 事件的监听器，以便在文档加载完成后对其进行处理。\n\n### Internet Explorer 浏览器中的 DOM ActiveX 组件\n\
  \n根据 Internet Explorer 浏览器的版本，提供了不同的 ActiveX 组件。\n\n创建 XML 文档的良好实践是检测最新的 ActiveX\
  \ 组件。\n\n以下函数提供了一个来自 dojo 库类型函数的实现示例：\n\n```javascript\nfunction getActiveXImpl(activeXArray)\
  \ {\n  for (var i=0; i < activeXArray.length; i++) {\n    try {\n      var testObj\
  \ = new ActiveXObject(activeXArray[i]);\n      if (testObj) {\n        return activeXArray[i];\n\
  \      }\n    } catch (e) {}\n  }\n}\n```\n\n与 DOM 的 ActiveX 组件如下（从新到旧）：`Msxml2.DOMDocument.5.0`、`Msxml2.DOMDocument.4.0`、`Msxml2.DOMDocument.3.0`、`MSXML2.DOMDocument`、`MSXML.DOMDocument`、`Microsoft.XMLDOM`。\n\
  \n一旦创建了基础文档，就可以 `load` 方法（标记 ❶）通过 XML 文件对其进行初始化，如下代码所示：\n\n```javascript\nvar document\
  \ = creerDocumentXML();\ndocument.load(\"fichier.xml\"); ❶\n```\n\nLivreGougeon\
  \ Page 225 Mardi, 28\\. novembre 2006 4:23 16\n\n# Web 图形界面基础\n**225**\n\n### 第\
  \ 8 章\n\n在 `async` 属性在文档加载前被设置为 `true` 的情况下，有必要注册一个加载事件的监听器（标记 ❶）。\n\n以下代码提供了在 Firefox\
  \ 中实现该原则的示例：\n\n```javascript\nvar document = creerDocumentXML();\ndocument.addEventListener(\"\
  load\", function() { ❶\n  // 处理 XML 文档的数据\n  (...)\n}, false);\ndocument.load(\"\
  fichier.xml\");\n```\n\n为了在 Internet Explorer 中运行此代码，可以将 `addEventListener` 方法替换为\
  \ `attachEvent` 方法，如在关于事件实现的章节中所示。\n\n\n\n\n\n从字符串创建 XML 文档在 Firefox 和 Internet\
  \ Explorer 浏览器中的实现方式不同，如下代码所示：\n\n```javascript\nfunction parserChaine(chaineXML)\
  \ {\nif( typeof DOMParser!=\"undefined\" ) {\nvar parser = new DOMParser(); // ¨\
  \ ❶\nreturn parser.parseFromString(chaineXML, \"text/xml\");\n} else {\nvar document\
  \ = creerDocumentXML();\ndocument.loadXML(chaineXML); // ¨ ❷\nreturn document;\n\
  }\n}\n```\n\n`var chaineXML = \"<donnees><donnee id='1'>Valeur</donnee></donnees>\"\
  ;` `var document = parserChaine(chaineXML);`\n\n第一种处理方式适用于 Firefox，依赖于 DOM 解析器（标记\
  \ ❶），而第二种适用于 Internet Explorer，它使用了前文描述的 XML 文档的 `loadXML` 方法（标记 ❷）。\n\n## XSLT\
  \ 实现\n\nJavaScript 允许实现 XSLT 技术，以便根据 XSL 样式表转换 XML 文档。\n\n与 XML 类似，浏览器对 XSLT 技术的支持并不统一，特别是在创建转换实体以及转换本身方面。\n\
  \nXSLT 的实现依赖 XML 来创建必要的 XML 文档。\n\nLivreGougeon 第 226 页 2006 年 11 月 28 日 星期二 4:23\
  \ 16\n\n## 使用 JavaScript 进行 Web 图形编程\n\n**226**\n\n第三部分\n\n### XSLT (扩展样式表语言转换)\n\
  \n在 XSL 标准中描述，XSLT 是一种 XML 转换语言。它允许将任何 XML 文档转换为任何其他类型的文档。获得的格式通常是文本。转换在一个 XML 文件中完成，该文件描述了如何使用输入\
  \ XML 文档来生成输出格式。该文件作为参数传递给 XSLT 引擎，由其执行转换。不同的语言都有相应的实现，包括 JavaScript。规范可以在地址 `http://www.w3.org/TR/xslt`\
  \ 获取。\n\n在本节中，我们使用下代码描述的 XSL 样式表 `feuille.xsl`：\n\n```xml\n<?xml version=\"1.0\"\
  ?>\n<xsl:stylesheet xmlns :xsl=\"http://www.w.org/TR/WD-xsl\">\n<xsl:output method=\"\
  xml\"/>\n<xsl:template match=\"/\">\n<valeur><xsl:value-of select=\"/donnees/donnee[@id='1']\"\
  /></valeur>\n</xsl:template>\n</xsl:stylesheet>\n```\n\n该样式表使用如下形式的 XML 文件 `fichier.xml`：\n\
  \n```xml\n<donnees>\n<donnee id=\"1\">Une valeur</donnee>\n<donnee id=\"2\">Une\
  \ autre valeur</donnee>\n</donnees>\n```\n\n以生成以下 XML 输出格式：\n\n```xml\n<valeur>Une\
  \ valeur</valeur>\n```\n\nFirefox 浏览器基于前一节描述的 XML 技术支持以及 `XSLTProcessor` 类。由于从文件加载与转换相关的元素是异步进行的，因此转换必须在相对于加载的回调函数中执行。\n\
  \n以下代码提供了在 Firefox 浏览器中实现 XSLT 技术的示例：\n\n```javascript\nfunction parserChaine(chaineXML)\
  \ {\nif( typeof DOMParser!=\"undefined\" ) {\nvar parser = new DOMParser();\nreturn\
  \ parser.parseFromString(chaineXML, \"text/xml\");\n}\n}\n\nvar xsltDocument = creerDocumentXML();\n\
  var xsltProcessor = null;\nxsltProcessor = new XSLTProcessor(); // ¨ ❶\nxsltDocument.load(fichierXSLT);\
  \ // ¨ ❷\n/* 指定 XSLT 引擎要使用的样式表规范 */\nxsltProcessor.importStylesheet(xsltDocument);\
  \ // ¨ ❸\n// 加载要转换的文档\nvar documentXML = parserChaine(\"<donnees><donnee id='1'>Valeur</donnee></donnees>\"\
  ); // ¨ ❹\n// 执行转换\nvar documentResultat = xsltProcessor.transformToDocument(documentXML);\
  \ // ¨ ❺\n```\n\n此代码实例化（标记 ❶）转换引擎，然后加载要使用的样式表（标记 ❷）。随后使用上述样式表对引擎进行配置（标记 ❸），然后利用之前加载的\
  \ XML 文档（标记 ❹）完成转换（标记 ❺）。\n\n可以使用 `transformToFragment` 函数代替 `transformToDocument`\
  \ 函数。后者接收第二个参数，指定转换结果文档应添加到哪个节点下。\n\n如果与转换相关的元素是从字符串加载的，则不需要任何回调函数的实现。\n\n在 Internet\
  \ Explorer 浏览器中，必须使用各种 ActiveX 控件来实现 XSLT 转换。在这种情况下，XML 部分中介绍的 ActiveX 控件并不适用，因为它们是多线程的，必须使用对应的非线程版本。\n\
  \n以下代码调整了前文描述的 `creerDocumentXML` 函数，以便在实现 XSLT 时考虑这一因素（标记 ❶）：\n\n```javascript\n\
  function creerDocumentXML() {\nif( document.implementation && document.implementation.createDocument)\
  \ {\nvar documentXML = document.implementation.createDocument(\"\",\"\", null);\n\
  documentXML.async = false;\nreturn documentXML;\n} else if( window.ActiveXObject\
  \ ) {\nvar documentXML = new ActiveXObject(\"MSXML2.FreeThreadedDOMDocument.3.0\"\
  ); // ¨ ❶\ndocumentXML.async = false;\nreturn documentXML;\n}\n}\n```\n\n为了实现转换，必须从\
  \ XSLT 组件初始化 XSLT 转换引擎。该引擎通过包含样式表的 XML 文档初始化，如下代码所示：\n\n```javascript\nfunction\
  \ creerSLTProcessor(fichierXSLT) {\n// 加载 XSL 样式表\nvar xsltDocument = creerDocumentXML();\n\
  xsltDocument.async = false;\nxsltDocument.load(fichierXSLT);\n// 创建并初始化转换引擎\nvar\
  \ xslt = creerXslt();\nxslt.stylesheet = xsltDocument;\nreturn xslt.createProcessor();\n\
  }\n```\n\n基于该引擎，在指定输入 XML 文档（标记 ❶）和输出 XML 文档（标记 ❷）后，可以实现下代码中的转换（标记 ❸）：\n\n```javascript\n\
  function realiserTransformation(xsltProcessor, documentXML) {\nif( window.ActiveXObject\
  \ ) {\nxsltProcessor.input = documentXML; // ¨ ❶\nvar documentXMLTransforme = creerDocumentXML();\n\
  documentXMLTransforme.async = false;\nxsltProcessor.output = documentXMLTransforme;\
  \ // ¨ ❷\nxsltProcessor.transform(); // ¨ ❸\nreturn documentXMLTransforme;\n}\n\
  }\n```\n\nLivreGougeon 第 227 页 2006 年 11 月 28 日 星期二 4:23 16\n\n## 使用 JavaScript\
  \ 进行 Web 图形编程\n\n**228**\n\n第三部分\n\n### Internet Explorer 浏览器中关于 XSLT 的 ActiveX\
  \ 控件\n\n根据 Internet Explorer 浏览器的版本提供了不同的 ActiveX 组件。\n\n为了创建 XML 文档或加载样式表以实现 XSL\
  \ 转换，最佳实践是检测最新的 ActiveX 组件。\n\n非线程的 DOM ActiveX 控件如下（从新到旧）：`Msxml2.FreeThreadedDOMDocument.5.0`、`MSXML2.FreeThreadedDOMDocument.4.0`、`MSXML2.FreeThreadedDOMDocument.3.0`。\n\
  \n加载 XSL 样式表的 ActiveX 控件如下（从新到旧）：`Msxml2.XSLTemplate.5.0`、`Msxml2.XSLTemplate.4.0`、`MSXML2.XSLTemplate.3.0`。\n\
  \n\n\n\n\n该技术也可以用于修改页面的 DOM 树结构，从而改变页面的外观。\n\n请注意，如 `dojo` 等 JavaScript 库在它们对 DOM\
  \ 和 `XML` 的支持中已经考虑了这些特性。其他库，如 `Sarissa` 或 `xmljs`（分别可通过地址 [`sarissa.sourceforge.net`](http://sarissa.sourceforge.net)\
  \ 和 [`xmljs.sourceforge.net`](http://xmljs.sourceforge.net) 获取），专门用于实现 `XML` 和 `XSLT`。\n\
  \n# 第 8 章：Web 图形界面的基础\n\n## 结论\n\n在本章中，我们描述了 Web 页面使用的各种语言以及它们之间相互作用的方式。我们此介绍了与\
  \ `HTML` 和 `CSS` 语言相关的机制。应当特别注意将这些语言的实现良好分离。\n\n联合使用 `HTML`（或 `xHTML`）、`CSS` 和 `JavaScript`\
  \ 可以让 Web 页面更具交互性、随时间推移自我修改，并在视觉上更加丰富。本章为这些机制奠定了基础。在本书的后续部分，我们将详细介绍如何通过 `JavaScript`\
  \ 库来实现它们。\n\n在处理这些原则的同时，我们描述了事件处理的良好实践，以及在 Web 页面中使用 `XML` 和 `XSLT` 技术的方法。\n\n随着\
  \ `JavaScript` 处理变得越来越复杂（特别是在 Web 页面的图形方面），`JavaScript` 脚本必须增强结构化，以便于维护和演进。第 9 章将描述用于使用\
  \ `JavaScript` 结构化图形组件的技术。\n\n# 第 9 章：图形组件的实现\n\n在上一章描述了 Web 图形界面的基本机制后，我们在本章介绍了如何基于图形组件来结构化\
  \ Web 页面的图形元素。\n\n首先，我们将定义图形组件的角色，并描述它们的结构和设计方法。我们将详细介绍在 Web 页面中实现这些组件的不同方法。最后，我们将提供文本区域和选择列表等功能的具体实现示例。\n\
  \n## 图形组件概述\n\n图形组件通过提供用户可以交互的元素，使得构建应用程序图形界面成为可能。图形组件也可以称为控件（controls），因为它们负责处理界用户的操作。\n\
  \n一个图形组件由其**结构**定义（结构定义了它所实现的各种图形元素）、其**外观**定义（外观指定了结构中定义元素的图形属性）以及其面对用户操作的**行为**定义（行为基于组件支持的事件而触发）。\n\
  \n### 表 9.1 常用图形组件\n\n| 组件 | 描述 |\n| :--- | :--- |\n| 树 (Tree) | 实现树形结构以定义层级结构。\
  \ |\n| 元素 (Element) | 实现表单，如按钮、输入字段或选择列表表单。 |\n| 窗口 (Window) | Web 页面内部的窗口，出现在页面其他元素之上，分为两种类型：可以在页面内移动的浮窗和阻止访问窗口下方内容的静态模态窗口。\
  \ |\n| 管理器 (Manager) | 基于可缩放定位区域或标签页组织图形组件的布局。 |\n| 菜单 (Menu) | 上下文菜单或工具栏。 |\n|\
  \ 表格 (Table) | 实现支持数据过滤和排序机制的复杂表格。 |\n\n图 9.1 展示了一个实现上述主要图形组件的屏幕。在其中我们看到了 Web 页面内部窗口，该窗口包含一个菜单管理器、一个输入表单、一个标签页管理器和一个选择树。\n\
  \n**图 9.1：Web 页面中的图形组件示例**\n\n## 图形组件的实现\n\n此图说明了在 Web 环境中实现高级图形组件以实现丰富 Web 界面的可能性。图形组件在构建这些界面以及它们的结构化和考虑浏览器特性方面起着至关重要的作用。在本章的后续部分，我们将描述\
  \ Web 应用程序背景下的图形组件。\n\n### 图形组件的目标\n\n使用图形组件简化了 Web 图形界面的实现，因为相关的处理被模块化到了基于 `JavaScript`\
  \ 语言的实体中。\n\n该实体还负责整合 `JavaScript` 语言和 `CSS` 语言层面的浏览器特性。因此，图形组件在所有浏览器中的实现是相同的。\n\
  \n使用图形组件还可以产生在人体工程学上的应用程序。所有图形元素在视觉上以相同的形式呈现，并对用户操作做出相同的反应。\n\n使用基于 `JavaScript`\
  \ 的图形组件可以满足复杂的人体工程需求，例如让重量客户端在人体工程上接近重量客户端，以便方便使用。\n\n### 图形组件之间的关系\n\n为了简单地使用 `JavaScript`\
  \ 编写的图形组件，良好的组织至关重要。与 Web 页面中的 `HTML` 标签一样，图形组件是层级化组织的。图 9.2 展示了图 9.1 中使用的图形组件组织的层级视图。\n\
  \n我们可以区分两种图形组件：对应于可以包含其他组件的容器组件（例如图 9.2 中的菜单和标签页管理器），以及不能包含其他组件的简单组件（如按钮和文本区域）。\n\
  \n在容器类型组件的情况下，关系既可以基于 `HTML` 语言定义，也可以基于组件的方法定义。\n\n**图 9.2：图形组件的层级组织**\n\n### 图形组件的结构化\n\
  \n\n\n\n\n为了结构化图形组件，我们使用了 JavaScript 中实现面向对象编程的机制。这种这种，我们可以管理它们的外观、应用于它们的通用处理以及处理其事件的方式。\n\
  \n# 第 9 章：面向对象设计\n\n为了使图形组件的使用更具模块化，利用 JavaScript 语言的面向对象编程机制至关重要。每个类型的图形组件都由其自己的\
  \ `classe`（类）定义，该类通过方法实现图形组件特有的所有处理。某些功能，如控件的视觉构建、事件管理或控制方法，必须在每个组件中实现。\n\n以下代码提供了一个图形组件类的实现示例：\n\
  \n```javascript\nfunction MonComposant(noeud) {\n  this.noeudComposant = noeud;\n\
  }\n\nMonComposant.prototype.construire = function() {\n  var champ = document.createElement(\"\
  input\");\n  (...)\n  this.noeudComposant.appendChild(champ);\n}\n```\n\n在网页中使用图形组件可以按照以下方式实现：\n\
  \n```html\n<html\n<head>\n  <script type=\"text/javaScript\">\n    function initialiser\
  \ () {\n      // 创建一个类型为 MonComposant 的组件\n      var monDiv = document.getElementById(\"\
  monDiv\");\n      var monComposant = new MonComposant(monDiv); // ❶\n      monComposant.contruire();\n\
  \    }\n  </script>\n</head>\n<body onload=\"initialiser()\">\n  <div id=\"monDiv\"\
  ></</div> <!-- ❷ -->\n</body>\n</html>\n```\n\n`MonComposant` 类（标记 ❶）使用标识符标签 `monDiv`（标记\
  \ ❷）作为参数进行实例化，从而允许在该标签中创建组件。我们将看到，可以实现多种方法以便在网页中使用图形组件。\n\n使用 JavaScript 类允许从继承的概念受益。因此，JavaScript\
