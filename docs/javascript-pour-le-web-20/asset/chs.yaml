  \ndojo 允许在页面内实现各种窗口。在这些页面内部，这些窗口允许在上方显示信息。\n\n### 模态窗口\n\n这种类型的窗口位于页面内容上方并居中位置，同时防止对其进行操作。尽管如此，内容仍然可以保持可见，但不可修改。dojo\
  \ 库基于 `dojo.widget.Dialog` 类实现了此功能，该类的使用依赖于一个 `div` 标签，用于界定其包含的元素。表 11.16 汇总了该类支持的各种属性。\n\
  \n**表 11.16 *dojo.widget.Dialog* 类的属性**\n\n| 属性 |  |\n| :--- | :--- |\n| `bgColor`\
  \ | 用于遮盖页面内容的颜色。 |\n| `bgOpacity` | 用于遮盖页面内容的透明度。 |\n| `toggle` | 用于显示和隐藏窗口的特效。\
  \ |\n| `toggleDuration` | 前述特效的持续时间。 |\n\n此类窗口的实现通过以下方式完成，即指定其属性（标记 ❶）以及其内容（标记 ❷）：\n\
  \n```html\n<!-- 定义窗口及其属性 -->\n<div dojoType=\"Dialog\" id=\"maFenetreModale\" bgColor=\"\
  white\"\n  bgOpacity=\"0.5\" toggle=\"fade\" toggleDuration=\"250\">  ❶\n  <!--\
  \ 定义窗口内容 -->\n  该区域是一个包含表单的模态窗口。  ❷\n  <br/><br/>\n  <form onsubmit=\"return false;\"\
  >\n    <table>\n      <tr>\n        <td>第一个字段:</td>\n        <td><input type=\"\
  text\"></td>\n      </tr>\n      <tr>\n        <td>第二个字段:</td>\n        <td><input\
  \ type=\"text\"></td>\n      </tr>\n    </table>\n  </form>\n  要关闭它，请点击<a href=\"\
  javascript:void(0)\" id=\"fermeture\">这里</a>。\n</div>\n```\n\nLivre-Gougeon Page\
