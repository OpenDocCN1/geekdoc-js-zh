  \ Wysiwyg 编辑器。\n\n### 表格\n\ndojo 提供了基于图形组件 `FilteringTable` 和 `SortableTable` 实现表格的可能性。\n\
  \n前者允许定义一个显示内容可以根据过滤器进行排序和修改的表格。后者对应一个可以按列进行排序的表格。\n\n`FilteringTable` 类型组件的实现基于\
  \ `<table>` 标签，它特别允许定义表格的表头。表格数据可以在该标签中指定，也可以通过编程基于 JSON 结构加载。以下代码提供了一个此类表格的实现示例：\n\
  \n```html\n<table dojoType=\"FilteringTable\" id=\"monTableau\"\nheadClass=\"fixedHeader\"\
  \ tbodyClass=\"scrollContent\"\nenableAlternateRows=\"true\"\nrowAlternateClass=\"\
  alternateRow\"\nmultiple=\"false\" alternateRows=\"true\" maxSortable=\"2\"\ncellpadding=\"\
  0\" cellspacing=\"0\" border=\"0\">\n```\n\n\n\n\n上述代码首先在表格表头中定义了与标识符和类型相关的信息（`field`\
  \ 和 `dataType` 属性，标记 ❶），以及表格列的标签（`th` 标签体）。\n\n随后，表格的各个行均以 HTML 的方式进行定义。然而，请注意行级\
  \ `tr` 标签中存在 `value` 属性（标记 ❷），这使得特别是在进行行选择时能够识别它们。\n\n![](img/index-350_1.jpg)\n\
