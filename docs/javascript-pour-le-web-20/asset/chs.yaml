  \n**树的支持**\n\nrialto 库提供了基于 `rialto.widget.Tree` 和 `rialto.widget.TreeNode` 类来实现树的可能性。`rialto.widget.Tree`\
  \ 类的构造函数通过关联数组接受表格 12.32 中总结的不同参数。\n\n**表格 12.32 *rialto.widget.Tree* 类构造函数的参数**\n\
  \n| 参数 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| `boolSelActive` | 布尔值 | 指定节点在被选中时样式是否改变\
  \ . |\n| `draggableNode` | 一个布尔值 | |\n\n\n\n\n\n指定节点是否可以根据拖放机制进行移动。\n\n### `height`\n\
  字符串\n对应组件的高度。可以以数字字符或百分比的形式表示。\n\n### `left`\n整数\n对应组件的水平位置。\n\n### `name`\n字符串\n\
  对应树的名称。\n\n### `parent`\n对象\n对应挂载组件的 rialto 组件或经典的 HTML 容器。\n\n### `rootOpen`\n\
