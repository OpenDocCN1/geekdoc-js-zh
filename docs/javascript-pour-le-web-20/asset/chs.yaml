  | `dojo.html.toggleVisibility` | 一个节点 | 根据 `visibility` 属性反转节点的显示值。 |\n\n\n\n\n\n\
  节点的可见性样式。\n\n`dojo.html.show` 和 `dojo.html.hide` 函数分别用于在 Web 页面显示（标记 ❶）和隐藏（标记 ❷）DOM\
