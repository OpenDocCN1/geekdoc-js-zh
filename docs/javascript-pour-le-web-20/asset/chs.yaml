  \ |\n| `dojo.html.hasAttribute` | 一个节点和属性名 | 确定节点是否存在某个属性。 |\n| `dojo.html.isTag`\
  \ | 一个节点和标签名列表 | 确定节点是否对应列表中的某个标签名。 |\n\n`dojo.html.getAttribute` 和 `dojo.html.hasAttribute`\
  \ 函数提供了访问与 `DOM` 节点属性相关的信息，而 `dojo.html.isTag` 函数则相对于标签类型。\n\n我们将根据下面代码描述的 `div`\
  \ 标签来详细说明这些函数的实现：\n\n```html\n<div id=\"monDiv\" unAttribut=\"Une valeur\"></div>\n\
  ```\n\n前两个函数分别允许返回属性关联的值并确定节点是否存在某个属性。`dojo.html.isTag` 函数确定节点是否匹配传递参数的列表中包含的类型。\n\
  \n以下代码说明了这些不同方法的实现：\n\n```javascript\nvar noeud = dojo.byId(\"monDiv\");\nvar unAttribut\
  \ = \"\";\nif( dojo.html.hasAttribute(noeud, \"unAttribut\") ) {\n    unAttribut\
  \ = dojo.html.getAttribut(noeud, \"unAttribut\");\n}\nvar unAutreAttribut = \"\"\
  ;\nif( dojo.html.hasAttribut(noeud, \"unAutreAttribut\") ) {\n    unAutreAttribut\
  \ = dojo.html.getAttribut(noeud, \"unAutreAttribut\");\n}\n/* 变量 unAttribut 包含 div\
  \ 标签属性 unAttribut 的内容而变量 unAutreAttribut 包含空字符串 */\nvar retour = dojo.html.isTag(noeud,\
  \ \"span\", \"div\", \"p\");\n/* 变量 retour 包含值 div，因为它是 div 类型 */\n```\n\n请注意，使用\
  \ `dojo.html.hasAttribute` 和 `dojo.html.getAttribute` 函数处理相对于 `CSS` 的属性是不建议的，而应使用\
  \ `dojo.html.style` 模块来实现此。\n\n`dojo.html.getScroll` 和 `dojo.html.getViewport` 函数分别允许确定滚动源和显示区域的大小。\n\
  \n```javascript\n// 计算滚动源（顶部和左）\nvar scroll = dojo.html.getScroll();\nvar scrollHaut\
  \ = scroll.top;\nvar scrollGauche = scroll.left;\n/* 变量 scrollHaut 和 scrollGauche\
  \ 对应滚动坐标 */\n\n// 计算浏览器显示区域的尺寸\nvar viewport = dojo.html.getViewport();\nvar largeurAffichage\
  \ = viewport.width;\nvar hauteurAffichage = viewport.height;\n/* 变量 largeurAffichage\
  \ 和 hauteurAffichage 对应显示区域高度 */\n```\n\n`dojo.html.getCursorPosition` 函数根据 DOM\
  \ 事件确定鼠标指针坐标，该事件作为函数的参数传递。因此该函数用于事件观察者的实现，如下代码所示：\n\n```javascript\nfunction fonctionObservateur(evenement)\
  \ {\n    var pointeur = dojo.html.getCursorPosition(evenement);\n    var pointeurX\
  \ = pointeur.x;\n    var pointeurY = pointeur.y;\n}\n```\n\n### 样式管理\n\n`dojo` 通过\
  \ `dojo.html.style` 模块提供了各种 `CSS` 样式的管理和操作函数。为了使用这些函数，必须通过 `dojo.require` 函数导入该模块。\n\
  \n表 11.3 汇总了该模块的不同函数。\n\n该模块一组函数相对于将 `CSS` 类与 `DOM` 节点关联。这些函数基于其 `class` 属性包含的值。\n\
  \n请注意，该属性无法通过 `dojo` 相关的 `DOM` 标准功能进行操作。\n\n\n\n\n\n以下代码展示了 `dojo.html.getClass`\
  \ 和 `dojo.html.hasClass` 函数实现的示例，用于获取 DOM 节点（标记 ❶）的 `class` 属性值，并检查该值是否包含某个类名（标记\
  \ ❷）：\n\n```javascript\nVar monDiv = dojo.byId(\"monDiv\");\n\n/* 获取 ID 为 monDiv\
  \ 的节点的 class 属性值 */\nvar classe = dojo.html.getClass(monDiv); // ❶\n\n/* 检查 ID 为\
  \ monDiv 的节点的 class 属性值中是否包含类名 maClasse */\nif( dojo.html.hasClass(monDiv, \"maClasse\"\
  ) ) { // ❷\n\n(...)\n}\n```\n\n### dojo 库的图形支持\n\n## 第 11 章\n\n### 表格 11.3 `dojo.html.style`\
  \ 模块的样式管理函数\n\n| 函数 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| `dojo.html.addClass`\
  \ | 一个节点和一个 CSS 类 | 允许向传递参数的节点类列表末尾添加 CSS 类。 |\n| `dojo.html.copyStyle` | 源节点和目标节点\
  \ | 将一个节点的样式复制到另一个节点。 |\n| `dojo.html.getClass` | 一个节点 | 返回传递参数节点 `class` 属性对应的值。\
  \ |\n| `dojo.html.getClasses` | 一个节点 | 返回传递参数节点 `class` 属性中包含的 CSS 类。 |\n| `dojo.html.getElementsByClass`\
  \ | 一个 CSS 类、一个节点、一个节点类型、一个匹配类型和一个标记 | 返回符合传递参数标准的节点列表。这些标准可以是 CSS 类匹配、搜索父节点、节点类型，或一个指示不应使用\
  \ XPath 的标记。匹配类型列在 `dojo.html.class-MatchType` 结构中：– ContainsAll：所有的 CSS 类都与该节点相关联。–\
