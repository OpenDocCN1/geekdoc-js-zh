  \ `addData` 和 `removeData` 方法实现。\n\n## 结论\n\n正如我们在本中所看到的，`dojo` 库的图形支持极其丰富。它首先由一组实用模块组成，这些模块允许操作\
  \ Web 页面的各种组成部分、管理事件、效果以及拖放操作。\n\n这些模块在解决这些不同问题的同时，整合了不同浏览器的特性。这一特性使得它们的处理在所有浏览器中都具有可移植性。\n\
  \n请注意，正在开发中的 `dojo.i18n` 模块旨在解决网页中 JavaScript 应用程序国际化相关的问题。\n\n`dojo` 的图形支持更进了一，人们在结构化和实现图形组件方面付出了巨大努力。在此框架下，该库表现出特别的活性，因为它既提供了基于页面\
  \ HTML 结构的方法，也提供了基于编程的方法。\n\n基于这种结构，`dojo` 库提供了一系列丰富的图形组件，从基础组件到更复杂的组件（如树和表格）。\n\
  \n`dojo` 库简化了第 7 章描述的模块的使用。这一特点在涉及 Ajax 技术的模块中尤为明显，因为使用这些技术发送和接收数据已集成到某些组件中，例如与\
  \ HTML 表单相关的组件。\n\n## rialto 库\n\n与 `dojo`一样，`rialto` 库提供了基于一套图形组件开发丰富 Web 应用的可能性。\n\
  \n然而，该库更多地关注通过各种专用组件和机制用于管理信息学的 Web 应用。\n\n本章详细介绍了如何使用该库以及如何使用其图形组件开发应用程序。\n\n###\
  \ 历史\n\n在详细介绍库及其用法之前，我们将简要回顾该项目的历史，并详细说明其不同的子项目及其目标。\n\n由于本书的背景是 JavaScript 技术，我们在这里只介绍\
  \ `rialto JavaScript` 子项目。其他子项目提供了结合不同服务器技术使用 JavaScript 库核心的功能。\n\n`rialto` 库最初位于朱维伊（Villejuif）的古斯塔·鲁西研究所（IGR），这是欧洲第一个癌症防治中心。它构建了一个可以通过\
  \ Web 访问的患者档案查询应用程序，目前已被 IGR 的所有医疗人员使用。\n\n该项目的主要目标是实现一个让医院内部以及在其他场地的医生能够方便查询的 Web\
  \ 应用，以便让他们访问患者的所有信息。\n\n### 图形 JavaScript 库\n\n`rialto` 的第二个目标是为用户提供他们在已经在该地部署的客户端/服务器模式管理应用中所习惯的丰富交互体验。\n\
  \n在 2002 年应用程序开发之初，人们还没有谈论 Ajax，也没有任何此类类型的框架可用。\n\n#### 附属项目\n\nJavaScript 子项目位于\
  \ `rialto` 项目的核心，因为它实现了丰富图形组件的实例化。尽管如此，还有其他子项目，其目标是方便在不同服务器技术下使用 JavaScript 库。它们本质上是将\
  \ JavaScript 类封装在用服务器端语言编写的组件中。\n\n表格 12.1 汇总了所有的 `rialto` 子项目。\n\n**表 12.1 rialto\
  \ 子项目**\n\n| 子项目 |  |\n| :--- | :--- |\n| rialto JavaScript | 项目核心，提供基础支持和图形组件的各种\
  \ JavaScript 类 |\n| rialto Taglib | 一组 taglibs，方便在 J2EE 环境中使用 JavaScript 库 |\n|\
  \ rialto JSF | 基于 JSF (JavaServer Faces) 技术实现 JavaScript 组件，以便将其作为 Java 对象进行操作 |\n\
  | rialto PHP | 用 PHP 实现 JavaScript 组件，以便与该技术配合使用 |\n| rialto Python | 用 Python 实现\
  \ JavaScript 组件，以便与该技术配合使用 |\n| rialto .Net | 使用 .Net 技术实现 JavaScript 组件，以便与该技术配合使用\
  \ |\n\n在本章的后续内容中，我们将 `rialto` 库称为相对于 JavaScript 组件的子项目。\n\n### 安装\n\n安装 `rialto`\
