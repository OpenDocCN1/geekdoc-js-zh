  \n在以下代码中，`byId` 方法（标记 ❶）允许根据标识符引用组件：\n\n```javascript\n// 引用标识为“monComposant”的图形组件\n\
  var monComposant = dojo.widget.byId(\"monComposant\"); // ❶\n```\n\n注意，无论组件如何如何创建，都可以使用此函数。其他方法如\
