  \    <TotalResults>1</TotalResults> ❸\n    <TotalPages>1</TotalPages> ❹\n    <Item>(...)</Item>\
  \ ❺\n  </Items>\n</ItemSearchResponse>\n```\n\nLivreGougeon 第 434 页 2006 年 11 月\
