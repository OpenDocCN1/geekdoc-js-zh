  , \"red\"); // ❶\n/* 将 ID 为 monAutreBalise 的标签样式复制到 ID 为 maBalise 的标签 */\nvar monAutreBalise\
  \ = dojo.byId(\"monAutreBalise\");\ndojo.html.copyStyle(maBalise, monAutreBalise);\
  \ // ❷\n```\n\n### 显示管理\n\ndojo 通过 `dojo.html.display` 模块提供了各种管理 Web 页面元素显示的函数。要使用这些函数，必须通过\
