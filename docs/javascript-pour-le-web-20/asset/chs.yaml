  \nPrototype 库提供了一种独立于浏览器的机制，用于注册和注销事件观察者。\n\n该库还集成了一种当 HTML 页面销毁时自动释放事件观察者的机制。这种机制在\
  \ Internet Explorer 或基于 Gecko 的浏览器中特别有意义，因为它可以防止内存泄漏。\n\n表 10.2 总结了添加到 `Event` 类（事件支持的基类）的不同方法。\n\
  \n### 表 10.2 Event 对象的方法\n\n| 方法 | 参数 | 说明 |\n| :--- | :--- | :--- |\n| `element`\
  \ | 事件 | 返回生成事件元素。 |\n| `findElement` | 事件和一个标签名 | 返回位于事件触发元素下方、且名称与参数中匹配的第一个元素。\
  \ |\n| `isLeftClick` | 事件和一个标签名 | 如果事件是由鼠标左键点击触发的，则返回 true。 |\n| `observe` | 元素\
  \ ID、名称、可选的布尔值说明 | 在元素上为某个事件注册观察函数，该函数响应观察者并必须被观察者捕获，不应冒泡到 DOM 树。不建议使用匿名函数，因为这无法通过\
  \ `stopObserving` 方法注销观察者。 |\n| `pointerX` | 事件 | 返回鼠标指针在浏览器窗口中的水平位置。 |\n| `pointerY`\
  \ | 事件 | 返回鼠标指针在浏览器窗口中的垂直位置。 |\n| `stop` | 事件 | 停止事件默认行为的执行并挂起传播。此方法等同于 `preventDefault`\
  \ 方法。 |\n| `stopObserving` | 元素 ID、名称、可选的布尔值说明 | 注销元素上针对某个事件的观察函数，该函数响应观察者。调用该方法时使用的参数必须与注册时\
  \ `observe` 方法使用的参数相同。 |\n\n`Event` 类的两个主要方法是 `observe` 和 `stopObserving`。它们分别允许为事件注册和注销观察者。\n\
  \n### ` 代码展示了为 ID 为 `monBouton` 的标签（代表一个按钮）注册观察者：\n\n```javascript\nfunction monObservateur(event)\
  \ {\n(...)\n}\nEvent.observe(\"monBouton\",\"click\",monObservateur);\n```\n\n要注销观察者，必须调用\
  \ `stopObserving` 方法，并传入与注册观察者时相同的参数。以下代码展示该方法的实现：\n\n```javascript\nEvent.stopObserving(\"\
  monBouton\",\"click\",monObservateur);\n```\n\n未提供任何将对象的方法注册为观察者的方法。仅支持注册函数。\n\n\
  `Event` 类提供了对应键盘事件代码的常量。这些常量总结在表 10.3。\n\n### 表 10.3 Event 类常量\n\n| 常量 | 事件代码 |\
  \  |\n| :--- | :--- | :--- |\n| `KEY_BACKSPACE` | 8 | 退格键 |\n| `KEY_TAB` | 9 | 制表键\
  \ |\n| `KEY_RETURN` | 13 | 回车键 |\n| `KEY_ESC` | 27 | 逸出键 |\n| `KEY_LEFT` | 37 |\
  \ 左箭头键 |\n| `KEY_UP` | 38 | 上箭头键 |\n| `KEY_RIGHT` | 39 | 右箭头键 |\n| `KEY_DOWN` |\
  \ 40 | 下箭头键 |\n| `KEY_DELETE` | 46 | 删除键 |\n\n除了 `Event` 类外，prototype 还提供一组针对不同类型元素的预定义观察者。表\
  \ 10.4 总结了相应的类。\n\n### 表 10.4 prototype 库提供的观察者类\n\n| 类 |  |\n| :--- | :--- |\n\
  | `Form.Element.Observer` | 用于检测表单元素值的修改 |\n| `Form.Observer` | 用于检测表单元素值的修改 |\n\
  | `Form.Element.EventObserver` | 用于处理表单元素的不同事件 |\n| `Form.EventObserver` | 用于处理表单元素的不同事件\
  \ |\n\n表中的前两个观察者继承自抽象类 `Abstract.TimeObserver`，正如其名称所示，它会定期检查元素或表单的值。该间隔通过 `Form.Element.Observer`\
  \ 和 `Form.Observer` 类构造函数的第二个参数指定。如果检测到修改，则会调用观察者函数。\n\n后者使用两个参数，其中第一个对应触发事件的元素。第二个参数返回元素的值（`Form.Element.Observer`）或字符串形式的表单序列化结果（`Form.Observer`）。\n\
  \n以下代码展示了如何实现两种类型的 `Form.Element.Observer`（标记 ❶）和 `Form.Observer`（标记 ❷）观察者，以检测 ID\
  \ 为 `monFormulaire` 的表单（标记 ❸）发生的修改：\n\n```html\n<html>\n<head>\n(...)\n<script type=\"\
  text/javascript\">\nfunction observateurChamp2(element, valeur) { // ❶\n(...)\n\
  }\n\nfunction observateurMonFormulaire(element, valeur) { // ❷\n(...)\n}\n\nfunction\
  \ enregistrerObservateurs() {\nnew Form.Element.Observer(\"champ2\", 1, observateurChamp2);\
  \ // ❶\nnew Form.Observer(\"monFormulaire\", 1, observateurMonFormulaire); // ❷\n\
  }\n</script>\n</head>\n<body onload=\"enregistrerObservateurs();\">\n<form id=\"\
  monFormulaire\"> // ❸\n<input type=\"hidden\" id=\"champ1\" name=\"champ1\" value=\"\
  valeur1\"/>\n</form>\n</body>\n</html>\n```\n\n\n\n\n\n```html\n<input type=\"text\"\
  \ id=\"champ2\" name=\"champ2\" value=\"valeur2\"/>\n<input type=\"text\" name=\"\
  champ3\" value=\"valeur3\"/>\n</form>\n</body>\n</html>\n```\n\nLors de la modification\
  \ du champ d’identifiant `champ2`, la fonction `observateurChamp2` est appelée.\
  \ De même, lorsqu’une modification se produit au sein du formulaire `monFormulaire`\
  \ par le biais des champs `champ2` ou `champ3`, la fonction `observateurMonFormulaire`\
  \ est exécutée.\n\nLes deux derniers observateurs du tableau 10.4 héritent de la\
  \ classe abstraite `Abstract.EventObserver`, qui, comme son nom l’indique, repose\
  \ sur les événements. Ils permettent d’observer différents événements des éléments\
  \ d’un formulaire.\n\nLes deux événements supportés dans la version actuelle sont\
  \ les suivants :\n* clic sur un bouton radio ;\n* changement de sélection dans une\
  \ liste multiple.\n\nSi l'élément passé en paramètre du constructeur de ces observateurs\
  \ est un formulaire, les observateurs sont enregistrés pour tous les éléments de\
  \ ce formulaire. Si un élément de formulaire est spécifié, les observateurs s’appliquent\
  \ uniquement à cet élément.\n\nLes observateurs fonctionnent de la même manière\
  \ que précédemment.\n\nLe code suivant illustre la mise en œuvre de deux observateurs\
  \ de types `Form.Element.EventObserver` (repère ❶) et `Form.EventObserver` (repère\
  \ ❷) afin de détecter les modifications survenues dans le formulaire `monFormulaire`\
  \ (repère ❸) :\n\n```html\n<html\n<head>\n(...)\n<script type=\"text/javascript\"\
  >\nfunction observateurChamp2(element, valeur) { // ❶\n(...)\n}\n\nfunction observateurMonFormulaire(element,\
  \ valeur) { // ❷\n(...)\n}\n\nfunction enregistrerObservateurs() {\n  new Form.Element.EventObserver(\"\
  champ2\", observateurChamp2); // ❶\n  new Form.EventObserver(\"monFormulaire\",\
  \ observateurMonFormulaire); // ❷\n}\n</script>\n</head>\n<body onload=\"enregistrerObservateurs();\"\
  >\n<form id=\"monFormulaire\"> // ❸\n<input type=\"hidden\" id=\"champ1\" name=\"\
  champ1\" value=\"valeur1\"/>\n<input type=\"radio\" id=\"champ2\" name=\"champ2\"\
  \ value=\"valeur radio 1\"/>\n<input type=\"radio\" id=\"champ2\" name=\"champ2\"\
  \ value=\"valeur radio 2\"/>\n<input type=\"text\" name=\"champ4\" value=\"valeur4\"\
  />\n</form>\n(...)\n</body>\n</html>\n```\n\nDès lors que l’utilisateur change la\
  \ sélection pour les boutons radio (identifiant `champ2`), les fonctions `observateurChamp2`\
  \ et `observateurMonFormulaire` sont exécutées.\n\nSi les événements fournis par\
  \ standard sont insuffisants, la modification de la méthode `registerCallback` de\
  \ la classe abstraite `Abstract.EventObserver` peut toujours être envisagée pour\
  \ supporter d’autres types d’éléments.\n\n## Support des formulaires HTML\n\nprototype\
  \ metet en œuvre l’objet `Form` pour gérer les informations et l’apparence des formulaires\
  \ HTML. Le tableau 10.5 récapitule ses différentes méthodes.\n\n### Tableau 10.5\
  \ Méthodes de l’objet Form\n\n| Méthode | Paramètre | Description |\n| :--- | :---\
  \ | :--- |\n| `disable` | L’identifiant du formulaire | Permet de désactiver tous\
  \ les éléments d’un formulaire. La méthode spécifie la valeur `true` pour leur attribut\
  \ `disabled`. |\n| `enable` | L’identifiant du formulaire | Permet d’activer tous\
  \ les éléments d’un formulaire. La méthode spécifie la valeur « », correspondant\
  \ à la chaîne de caractères vide, pour leur attribut `disabled`. |\n| `findFirstElement`\
  \ | L’identifiant du formulaire | Retourne le premier élément du formulaire non\
  \ caché, actif et dont la balise est `input`, `select` ou `textarea`. |\n| `focusFirstElement`\
  \ | L’identifiant du formulaire | Positionne le curseur sur le premier élément du\
  \ formulaire, élément déterminé par l’intermédiaire de la méthode `findFirstElement`.\
  \ |\n| `getElements` | L’identifiant du formulaire | Permet de récupérer sous forme\
  \ de tableau tous les éléments du formulaire. Les éléments du tableau correspondent\
  \ à des éléments de l’arbre DOM. |\n| `getInputs` | L’identifiant du formulaire,\
  \ le type et son nom | Retourne un tableau contenant les champs de saisie du formulaire\
  \ correspondant au type et au nom spécifiés en paramètres. |\n| `reset` | L’identifiant\
  \ du formulaire | Réinitialise toutes les valeurs des éléments du formulaire. |\n\
  | `serialize` | L’identifiant du formulaire | Permet de construire une chaîne de\
  \ caractères à partir des différents éléments du formulaire. Les valeurs des éléments\
  \ sont séparées par le caractère `&`. |\n\nLa méthode `getElements` offre la possibilité\
  \ d’avoir accès rapidement à tous les éléments d’un formulaire, cette méthode renvoyant\
  \ les éléments DOM correspondants.\n\nDans le code suivant, la fonction `traiterValeursFormulaire`\
  \ (repère ❶) est mise en œuvre pour récupérer les différentes valeurs des champs\
  \ du formulaire `monFormulaire` (repère ❷) :\n\n```html\n<html\n<head>\n(...)\n\
  <script type=\"text/javascript\">\n(...)\nfunction traiterValeursFormulaire () {\
  \ // ❶\n  var elements = Form.getElements(\"monFormulaire\");\n  var valeurs = {};\n\
  \  for( int cpt=0; cpt<elements.length; cpt++) {\n    var element = elements[cpt];\n\
  \    valeurs[element.name] = element.value;\n  }\n  /* valeurs est équivalent au\
  \ tableau associatif suivant:\n  { \"champ1\": \"valeur1\",\n  \"champ2\": \"valeur2\"\
  ,\n  \"champ3\": \"valeur3\" }*/\n(...)\n}\n</script>\n</head>\n<body>\n<form id=\"\
  monFormulaire\"> // ❷\n<input type=\"hidden\" name=\"champ1\" value=\"valeur1\"\
  />\n<input type=\"text\" name=\"champ2\" value=\"valeur2\"/>\n<input type=\"text\"\
  \ name=\"champ3\" value=\"valeur3\"/> (...)\n</form>\n(...)\n</body>\n</html>\n\
  ```\n\nLa méthode `getInputs` offre un accès rapide à des éléments d’un formulaire\
  \ dont le nom de la balise est `input`. Cette méthode prend en paramètre le nom\
  \ du formulaire, le type de la balise ainsi que son nom.\n\nLe code suivant illustre\
  \ la mise en œuvre de cette méthode afin de récupérer le champ caché du formulaire\
  \ `monFormulaire` de l’exemple précédent :\n\n```javascript\nvar listeChamps = Form.getInputs(\"\
  monFormulaire\", \"hidden\", \"champ1\");\nvar champCache = listeChamps[0];\nvar\
  \ valeurChampCache = champCache.value;\n// valeurChampCache contient « valeur1 »\n\
  ```\n\nLa méthode `serialize` construit une chaîne de caractères avec les diverses\
  \ valeurs des éléments du formulaire. Cette chaîne contient les différents couples-valeur\
  \ séparés par le caractère `&`.\n\nLe code suivant se fonde sur le formulaire utilisé\
  \ dans l’exemple relatif à la méthode `getElements` et décrit l’utilisation de la\
  \ méthode `serialize` :\n\n```javascript\nvar chaineValeurs = Form.serialize(\"\
  monFormulaire\");\n/* chaineValeurs contient « champ1=valeur1&champ2=valeur2&champ3=valeur3\
  \ » */\n```\n\nL’objet `Form` se fonde sur l’objet `FormElement`, mais il est également\
  \ possible d’utiliser ce dernier directement. Il met pour disposition les méthodes\
  \ `serialize` et `getValue`, qui permettent respectivement d’encoder et de récupérer\
  \ la valeur d’un champ de formulaire.\n\nLe code suivant illustre l’utilisation\
  \ de la méthode `getValue` :\n\n```javascript\nvar valeurChamp1 = Form.Element.getValue(\"\
  champ1\");\n// valeurChamp1 contient la valeur « valeur1 »\n```\n\n## En résumé\n\
  \nLa bibliothèque prototype propose d’intéressantes fonctionnalités afin de développer\
  \ des pages comprenant des traitements graphiques JavaScript évolués.\n\n\n\n\n\
  Une bonne pratique de développement Web consiste à bien séparer le code JavaScript\
  \ du code HTML des pages Web. Le fait que le HTML permette de définir les événements\
  \ associés à des balises HTML directement dans leur définition par le biais d’attributs\
  \ particuliers nuit grand à la lisibilité des pages, puisque cela revient à mélanger\
  \ diverses concerns.\n\nLivreGougeon Page 267 Mardi, 28\\. novembre 2006 4:23 16\n\
  \n# Bibliothèques graphiques légères\n**267**\n\n*CHAPITRE 10*\n\nLa bibliothèque\
  \ `behaviour` offre un mécanisme intéressant afin de rattacher des événements JavaScript\
  \ aux balises par l’intermédiaire de styles CSS. De sorte, aucun code JavaScript\
  \ n’est défini au niveau des balises HTML.\n\nLa bibliothèque offre ainsi une alternative\
  \ au code HTML suivant, qui spécifie les événements directement dans les attributs\
  \ des balises (repère ❶) :\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\nfunction traiterEvenement(evenement) {\n(...)\n}\n</script>\n</head>\n<body>\n\
  (...)\n<input type=\"button\" onclick=\"traiterEvenement();\" value=\"Un bouton\"\
  / > **¨** ❶\n(...)\n</body>\n</html>\n```\n\n## Installation et mise en œuvre de\
  \ la bibliothèque behaviour\n\nLa bibliothèque se compose d'un fichier JavaScript\
  \ nommé `behaviour.js`. Celui-ci doit être ajouté à la page Web souhaitant utiliser\
  \ la bibliothèque, comme dans le code suivant :\n\n```html\n<html>\n<head>\n(...)\n\
  <script type=\"text/javascript\" src=\"behaviour.js\"></script> (...)\n</head>\n\
  (...)\n</html>\n```\n\nL’étape suivante consiste à définir un tableau associatif\
  \ permettant de mettre en relation des sélecteurs CSS avec des fonctions. Les fonctions\
  \ doivent comporter un paramètre correspondant à un élément de l’arbre DOM de la\
  \ page.\n\nLe code suivant montre comment mettre en œuvre ce tableau :\n\n```javascript\n\
  var regles = {\n  'div.maClasse': function(element) {\n  (...)\n  },\n  '#monIdentifiant\
  \ b': function(element) {\n  (...)\n  }\n};\n```\n\nLivreGougeon Page 268 Mardi,\
  \ 28\\. novembre 2006 4:23 16\n\n# Bibliothèques JavaScript graphiques\n**268**\n\
  \n*PARTIE IV*\n\nLes clés du tableau associatif correspondent à des sélecteurs CSS\
  \ permettant d’identifier les balises impactées.\n\nDans la page HTML suivante,\
  \ les règles `div.maClasse` et `#monIdentifiant b` décrites dans le code ci-dessus\
  \ permettent d’indexer respectivement les balises `div` (repère ❶) et `b` (repère\
  \ ❷) :\n\n```html\n<html>\n(...)\n<body>\n<div class=\"maClasse\">(...)</div> **¨**\
  \ ❶\n<p id=\"monIdentifiant\">\n<b>Un texte en gras.</b> **¨** ❷\n</p>\n</body>\n\
  </html>\n```\n\nUne fois le tableau précédent appliqué à la page, la bibliothèque\
  \ appelle les fonctions pour les éléments correspondant aux sélecteurs CSS lors\
  \ du chargement de la page. Dans l’exemple ci-dessus, la première fonction est appelée\
  \ avec l’élément correspondant à la balise `div` et la seconde avec celui de la\
  \ balise `b`.\n\nDes événements peuvent, dès lors, être associés aux éléments par\
  \ l’intermédiaire du DOM.\n\nLe code suivant décrit la façon d’ajouter l’événement\
  \ `mouseover` à la balise `div` (repère ❶) et `click` à la balise `b` (repère ❷)\
  \ :\n\n```javascript\nvar regles = {\n  'div.maClasse': function(element) {\n  \
  \  element.onmouseover= function() { **¨** ❶\n    alert(\"La souris est sur la balise\
  \ div \");\n    }\n  },\n  '#monIdentifiant b': function(element) {\n    element.onclick\
  \ = function() { **¨** ❷\n    alert(\"L’utilisateur a cliqué sur le texte\");\n\
  \    }\n  }\n};\n```\n\nLa façon d’enregistrer les observateurs d’événements n’est\
  \ pas imposée par `behaviour`. Il est ainsi parfaitement possible d’utiliser l’approche\
  \ précédemment décrite pour la bibliothèque `prototype`. Les règles définies ci-dessus\
  \ doivent être appliquées à la page HTML.\n\nPour gérer l’application de ces règles,\
  \ la bibliothèque fournit l’objet `Behaviour`. Cet objet contient une méthode `register`,\
  \ qui permet d’appliquer des règles lors de l’initialisation d’une page Web.\n\n\
  LivreGougeon Page 269 Mardi, 28\\. novembre 2006 4:23 16\n\n# Les bibliothèques\
  \ graphiques légères\n**269**\n\n*CHAPITRE 10*\n\nLe code suivant illustre la mise\
  \ en œuvre de cette méthode (repère ❶) :\n\n```html\n<html>\n<head>\n(...)\n<script\
  \ type=\"text/javascript\">\nvar regles = (...)\nBehaviour.register(regles); **¨**\
  \ ❶\n</script>\n(...)\n</head>\n</html>\n```\n\nAjoutons que si les règles doivent\
  \ être modifiées pour prendre en compte des éléments de l’arbre DOM ajoutés après\
  \ le chargement de la page, la méthode `apply` suivante (repère ❶) de l’objet `Behaviour`\
  \ est utilisée :\n\n```javascript\n<script type=\"text/javascript\">\nfunction appliquerRegles()\
  \ {\n  var regles = {\n  };\n  Behaviour.register(regles);\n  Behaviour.apply();\
  \ **¨** ❶\n}\n</script>\n```\n\n## En résumé\n\nLa bibliothèque `behaviour` offre\
  \ une solution intéressante et élégante afin de mettre en œuvre la gestion des événements\
  \ en se fondant sur la technologie CSS. Cette bibliothèque de petite taille permet\
  \ de bien structurer et séparer les différents traitements JavaScript des éléments\
  \ HTML d’une page. L’initialisation de traitements relatifs à ces éléments, tels\
  \ que l’enregistrement d’observateurs d’événements, peut être réalisée simplement\
  \ par le biais d’un tableau.\n\n\n\n构造函数的最后一个参数不是强制性的，可以用于指定选项或通过回调函数注册对效果执行过程的观察者。\n\
  \n基础效果的不同选项以及效果观察者分别汇总在表 10.8 和 10.9 中。\n\n### 表 10.8 基础效果的主要配置选项\n\n| 参数 | 默认值\
  \ | 说明 |\n| :--- | :--- | :--- |\n| direction | center | 转换方向。可以使用以下值：`top-left`,\
  \ `top-right`, `bottom-left`, `bottom-right`, `center`。 |\n| duration | 1.0 | 效果持续时间，以秒为单位\
  \ |\n| fps | 25 | 每秒帧数 |\n| from | 0.0 | 效果作用属性的起始值，例如元素的透明度值。 |\n| to | 1.0 | 效果作用属性的结束值。\
  \ |\n| transition | `Effect.Transitions.sinoidal` | 使用的过渡类型。共有五种类型：`Effect.Transitions.sinoidal`、`Effect.Transitions.linear`、`Effect.Transitions.reverse`、`Effect.Transitions.wobble`\
  \ 和 `Effect.Transitions.flicker`。 |\n\n### 表 10.9 基础效果的回调函数\n\n| 函数 | 参数 | 说明 |\n\
  | :--- | :--- | :--- |\n| afterFinish | 完成的效果实例 | 在效果完成最后一次显示刷新后调用。 |\n| afterUpdate\
  \ | 完成的效果实例 | 在效果完成的每次显示刷新后调用。 |\n| beforeStart | 完成的效果实例 | 在效果开始的第一次显示刷新前调用。 |\n\
  | beforeUpdate | 完成的效果实例 | 在效果开始的每次显示刷新前调用。 |\n\n接下来的代码描述了 `Effect.Opacity` 效果（标记\
  \ ❶）的实现，该效果使文本（标记 ❷）逐渐消失：\n\n```html\n<html>\n<head>\n(...)\n<script type=\"text/javascript\"\
  >\nfunction jouerEffet() { // ¨ ❶\nvar element = document.getElementById(\"monParagraphe\"\
  );\nnew Effect.Opacity(element,{\nduration: 2.0,\ntransition: Effect.Transitions.linear,\n\
  from: 1.0,\nto: 0});\n}\n(...)\n</script>\n</head>\nLivreGougeon Page 272 Mardi,\
  \ 28. novembre 2006 4:23 16\n图形 JavaScript 库\n272\n第四部分\n<body>\n<p id=\"monParagraphe\"\
  >Une texte.</p> // ¨ ❷\n</body>\n</html>\n```\n\n所有这些基础效果都可以组合使用，以实现远为复杂的效果。这些复杂效果的类汇总在表\
  \ 10.10 中。\n\n### 表 10.10 script.aculo.us 库中的复杂效果类\n\n| 类 |  |\n| :--- | :--- |\n\
  | `Effect.Apear`, `Effect.Fade` | 使元素出现或消失。 |\n| `Effect.BlindDown`, `Effect.BlindUp`\
  \ | 卷起或向上卷起一个元素，使其分别出现或消失。 |\n| `Effect.DropOut` | 通过移动元素的同时改变其透明度来使其消失。 |\n| `Effect.Fold`\
  \ | 将元素向向上折叠，然后向左侧折叠。 |\n| `Effect.Grow` | 通过放大元素使其从底部出现。 |\n| `Effect.Pulsate`\
  \ | 以心跳效果使元素出现和消失。 |\n| `Effect.Puff` | 使元素像烟雾一样消失。 |\n| `Effect.Shake` | 允许“摇晃”一个元素。\
  \ |\n| `Effect.Shrink` | 前一个效果的反向效果 |\n| `Effect.SlideDown`, `Effect.SlideUp` |\
  \ 卷起或向上卷起一个元素，使其分别出现或消失。 |\n| `Effect.Squish` | 将元素压缩至左上角。 |\n| `Effect.SwitchOff`\
  \ | 产生像电视开关一样让元素消失的幻觉。 |\n| `Effect.toggle` | 允许反转效果。它仅适用于 `Effect.Apear`/`Effect.Fade`、`Effect.BlindDown`/`Effect.BlindUp`\
  \ 以及 `Effect.SlideDown`/`Effect.SlideUp` 效果对。它可以分别接受 `appear`、`slide` 和 `blind`\
  \ 作为参数。 |\n\n显然，可以使用这五个基础效果来丰富这些效果列表。\n\n我们不再逐一详细列述上述不同元素，而是将描述一个来自 script.aculo.us\
  \ 网站提供的简单输入字段实现示例。通过使用效果隐藏和显示不同的 div 元素，我们发现图形界面变得容易易用得多。\n\n该示例允许输入一个句子以执行搜索。该句子必须包含至少三个字符。如果不是，将向用户弹出警报。搜索结果将出现在当前页面上方、搜索区域下方，以节省图形界面空间。\n\
  \n该示例分为四个区域：\n\n- 第一个对应于输入和触发搜索的区域。它允许显示搜索的高级配置区域。\n- 第二个区域初始隐藏，当搜索字符数不足时提供错误信息的显示。\n\
