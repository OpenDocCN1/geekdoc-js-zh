  \ `$R` 用于定义一个值范围。它基于之前描述的 `ObjectRange` 类。以下代码提供了一个判断值是否在范围内的示例：\n\n```javascript\n\
  var value = (...);\nvar resultat = $R(0, 10, true).include(value);\n/* 如果值在范围内，resultat\
  \ 为 true，否则为 false. */\n```\n\n## 结论\n\nPrototype 库提供了许多有趣的机制，旨在简化并减轻 JavaScript\
  \ 应用程序的编写。所实现的机制范围从语言提供的类扩展（如 `Object`、`String` 或 `Number`）到对 Ajax 的支持以及通过$` 前缀方法实现的快捷写。\n\
  \n该库还利用了 JavaScript 的高级概念，如对象字面量、回调函数和闭包，以便开发者能够编写更简洁、更易读的 JavaScript 代码。\n\n我们将在第\
  \ 10 章看到 Prototype 提供了实现事件管理和方便在 HTML 页面中使用元素的功能。Prototype 库被广泛应用于 JavaScript 应用程序中，甚至作为其他框架（如\
  \ Ruby on Rails）的基础。\n\n## Dojo 库的基础知识\n\nDojo 库是一个开源工具箱，旨在方便 JavaScript 和 DHTML\
  \ 技术的使用。它在 Alex Russell 和 Dylan Schiemann 的推动下，基于 `nWidgets`、`burstlib` 和 `f(m)`\
