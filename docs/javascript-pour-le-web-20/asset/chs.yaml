  );\n```\n\n\n\n\ndojo 库提供了通过相应的 `dojoAttachPoint` 和 `dojoAttachEvent` 属性绑定元素和事件，使\
  \ HTML 模板与 JavaScript 类进行交互的可能性。\n\n由于声明中包含的标签必须自动添加到备忘录主体中，因此包含备忘录主体的 div 标签必须链接到类的\
  \ `containerNode` 属性（标记 ❶），如下代码所示：\n\n```html\n<div class=\"memo\">\n  <div class=\"\
  titre\">一个标题</div>\n  <div class=\"fermeture\">X</div>\n  <div class=\"corps\"dojoAttachPoint=\"\
