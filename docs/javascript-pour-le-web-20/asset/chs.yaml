  dojo.io.bind(proprietes);\n```\n\n### 错误处理\n\n尽管 `handle` 回调函数允许处理 Ajax 请求过程中发生的错误，但也可以实现\
  \ `error` 回调函数来专门处理这些错误，类似于 `load` 函数。\n\n`error` 函数接收参数：当前状态以及发生的错误。\n\n以下代码描述了用于处理请求发生错误的\
  \ `error` 回调函数的实现：\n\n```javascript\nvar proprietes = {\n  url: \"monUrl\",\n  mimetype:\
  \ \"text/plain\",\n  error: function(type, error) {\n    (...)\n  }\n};\n\ndojo.io.bind(proprietes);\n\
