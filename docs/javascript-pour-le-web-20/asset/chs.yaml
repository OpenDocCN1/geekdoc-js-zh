  ### 封装与可见性\n正如我们所见，类对应一个拥有属性和方法的实体。并不一定需要从类外部访问这些元素。封装是指禁止对类的某些元素的访问，以保护其状态和运行机制。\n\
  大多数情况下，类属性不应直接暴露在类外部。这就是为什么实现访问器（accesseurs）和修改器（mutateurs）是一种良好的设计实践。\n为了实现封装，大多数对象语言提供了支持，允许通过语言元素控制属性和方法的可见性。\n\
