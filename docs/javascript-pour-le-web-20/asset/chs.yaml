  \ `+setWidth()`, `+setHeight()`, `+setVisible()`, `+setDraggable()`, `+setPosition()`,\
  \ `+setStyle()`\n- **Button**: `+placeIn()`, `+remove()`, `+getHtmlExt()`, `+setEnable()`,\
  \ `+setLimReac()`, `+getHtmlImp()`, `+setTitle()`, `+setVisible()`, `+getHtmlDD()`,\
  \ `+onclick()`, `+setEnable()`\n- **Image**: `+getHtmlRZ()`, `+setImageReference()`,\
  \ `+setImages()`, `+setAlt()`, `+onclick()`\n- **Label**: `+setText()`, `+displayMessage()`\n\
  - **Text**: `+addItem()`, `+setEnable()`, `+setCheck()`, `+setVisible()`, `+hasChanged()`\n\
  - **Combo**: `+setEnable()`, `+setCheck()`, `+getCheck()`\n- **Checkbox**: `+setEnable()`,\
  \ `+setEnable()`, `+setVisible()`, `+getCheck()`, `+onclick()`\n- **Radio**: `+getValue()`,\
  \ `+selFirst()`, `+onclick()`, `+setEnable()`, `+setValue()`, `+selLast()`, `+showAsRequired()`,\
  \ `+selInd()`, `+setFocus()`, `+getText()`, `+onblur()`, `+onclick()`, `+onfocus()`,\
  \ `+getSelText()`, `+removeAsRequired()`, `+getSelValue()`, `+selWithText()`, `+selWithValue()`\n\
  \n表格 12.11 总结了 `rialto` 库提供的基础图形组件的不同类。\n\n**表 12.11 rialto 库的基础图形组件**\n\n| 组件 |\
