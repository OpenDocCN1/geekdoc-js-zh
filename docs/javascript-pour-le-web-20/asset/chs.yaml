  Url\":\"(...)\",\n          \"Height\":59,\n          \"Width\":60\n        }\n\
  \      }\n    ]\n  }\n}\n```\n\n我们在本章后续部分将使用此响应结构来实现该服务。\n\n## 服务的使用\n\n由于使用了 JavaScript\
  \ 语言，对 Yahoo! 服务的调用是通过我们之前讨论过的 Ajax 技术实现的。\n\n由于 Yahoo! 服务与调用者不在同一域，必须使用第 5 章中介绍的“绕过限制”章节中的机制。\n\
  \n注意我们该服务使用了 JSON 格式的响应。\n\n**图 14.1** 调用 Yahoo! 服务的实现机制\n\n\n\n\n\n```javascript\n\
  alert(result[\"id\"]+\": \"+result[\"Title\"]);\n}\n\nvar adresse = [\"http://api.search.yahoo.com/AudioSearchService/V1/albumSearch\"\
  ];\n\nvar parametres = {\n  appid: \"YahooDemo\",\n  artistid: \"XXXXXXP000064565\"\
  ,\n  album: \"Like\",\n  output: \"json\",\n  results: \"2\"\n};\n\nexecuterRequete(adresse,\
  \ parametres, \"fonctionDeRappel\");\n```\n\n## 对 Dojo 库的支持\n\n`dojo` 库通过其 `dojo.rpc.YahooService`\
  \ 模块支持 Yahoo! 的各种服务。支持的服务描述在 `yahoo.smd` 文件中，该文件位于 dojo 发行版的 `src/rpc` 目录下。\n\n\
  通过以下代码导入 `dojo.rpc.YahooService` 模块：\n\n```javascript\ndojo.require(\"dojo.rpc.YahooService\"\
  );\n```\n\n## Yahoo! 和 Amazon 提供的服务\n\n### 第 14 章\n\n此文件允许服务与方法关联并指定不同的关联参数。\n\n\
  表格 14.6 汇总了与 Yahoo! 服务相关的方法。\n\n### 表格 14.6 与 Yahoo! 服务相关的方法\n\n| 方法 | 关联服务 |\n\
  | :--- | :--- |\n| albumSearch | 专辑搜索 |\n| artistSearch | 艺术家搜索 |\n| geocode | 地理编码\
  \ |\n| mapImage | 地图图像 |\n| newsSearch | 新闻搜索 |\n| songSearch | 歌曲搜索 |\n| webSearch\
  \ | 网页搜索 |\n\n调用 Yahoo! 服务非常简单，如下下面的代码所示，该代码基于 Yahoo! 进行互联网搜索：\n\n```javascript\n\
  function executerRechercheYahoo() { // ❶\n  var service = new dojo.rpc.YahooService();\n\
  \  var retour = service.webSearch({\"query\":\"javascript\"}); // ❷\n  retour.addCallback(traiterResultatRecherche);\
  \ // ❸\n}\n\nfunction traiterResultatRecherche(donnees) { // ❹\n  var typeRecherche\
  \ = donnees[\"type\"];\n  var resultats = donnees[\"Result\"];\n  for(var cpt=0;cpt<resultats.length;cpt++)\
  \ { // ❺\n    var resultat = resultats[cpt];\n    var titre = resultat[\"Title\"\
  ];\n    var resume = resultat[\"Summary\"];\n    alert(titre+\": \"+resume);\n \
  \ }\n}\n```\n\n`executerRechercheYahoo` 函数（标记 ❶）包含了所有的服务调用逻辑。它基于 dojo 的 `dojo.rpc.YahooService`\
  \ 类，并通过其 `webSearch` 方法（标记 ❷）调用服务。通过 `addCallback` 方法（标记 ❸）为调用关联了一个回调函数。\n\n当接收到响应时，该响应（标记\
  \ ❹）将被调用，并带有 JSON 格式的响应数据作为参数。这些数据可以根据 JavaScript 提供的功能作为对象进行遍历（标记 ❺）。我们没有在任何时候指定用以执行请求的用用技术。在这种情况下，`dojo`\
  \ 通过一个 `script` 标签实现了 Ajax。\n\n## 使用外部服务\n\n### 第五部分 - 总结\n\nYahoo! 提供了许多允许在网页中添加内容的服务。这些服务可以通过\
  \ REST 架构访问。它们返回的数据既可以结构化为 XML 格式，也可以为 JSON 格式。\n\n由于 Yahoo! 服务领域与其网页领域不同，无法使用 `XMLHttpRequest`\
  \ 类。因此，必须实施第 5 章中描述的绕过技术。如 `dojo` 等库提供了隐藏了访问这些服务所需机制的 API。\n\n### Amazon\n\nAmazon\
  \ 是一家电子商务公司，其最著名的专长是销售书籍。它还允许购买各种类型的文化产品，特别是音乐和电影，以及最近的硬件设备。\n\n该公司成立于 1995 年，但直到\
  \ 2004 年才真正开始盈利。它的独特之处在于它没有任何实体销售机构，并利用其网站用户的选择为他们提供针对性的商品选择。\n\n与 Yahoo! 类似，Amazon\
  \ 提供了通过互联网上的搜索服务访问其目录中所有元素的可能。Amazon 还提供了许多其他服务，我们在本章中未详细列述。\n\n该搜索服务通过 REST 架构提供，但与\
  \ Yahoo! 不同，数据仅以 XML 格式结构化。不过，`XSLT` 服务允许将数据转换为任何格式。\n\n### ECS 服务\n\nAmazon 提供的唯一服务是\
  \ `ECS`（电子商务服务），它允许访问 Amazon 不同网站的大部分信息。这些信息包括：\n\n- 产品数据；\n- 用户输入的商品评论；\n- 卖家信息；\n\
  - `zShops` 和 `Marketplace` 的产品列表；\n- 购物车。\n\n该服务使得相对于这些数据的各种操作成为可能。\n\n### 表格 14.7\
  \ ECS 服务的主要操作\n\n| 操作 | 描述 |\n| :--- | :--- |\n| CustomerContentLookup | 允许获取与客户相关的信息。\
  \ |\n| CustomerContentSearch | 允许进行客户搜索。 |\n| ItemLookup | 允许根据标识符获取与产品相关的信息。 |\n\
  | ItemSearch | 允许根据不同的标准进行产品搜索。 |\n| SellerLookup | 允许获取与卖家相关的信息。 |\n\n该服务的文档可以通过地址访问：`http://docs.amazonwebservices.com/AWSEcommerceService/2005-03-23/index.html`\n\
  \n为了使用该服务的不同操作，需要在 Amazon 的地址 `http://www.amazon.com/gp/aws/registration/registration-form.html`\
  \ 进行注册。随后会在账户 `http://aws-portal.amazon.com/gp/aws/developer/account/index.html?action=access-key`\
  \ 提供访问密钥。在调用提供的不同操作时，必须指定此密钥。\n\n## 服务通用参数\n\nAmazon 服务提供了适用于所有操作的不同参数组：\n\n- 强制参数：每次使用操作时必须存在。\n\
  - 通用参数：指定请求来源以及返回数据的类型。\n- XSL 参数：指定 Amazon XSLT 引擎所需的信息。\n- XML 格式化参数。\n- 用于方便开发和调试的参数。\n\
  \n表格 14.8 到 14.10 汇总了强制性、通用和 XSL 参数。\n\n### 表格 14.8 ECS 服务强制参数\n\n| 参数 | 描述 |\n\
  | :--- | :--- |\n| Operation | 指定使用的操作。 |\n| Service | 指定使用的服务名称。在本例中必须始终使用 `AWSECommerceService`。\
  \ |\n| SubscriptionId | 指定服务用户的订阅标识符。 |\n\n\n\n\n\n指定与应用程序相关的标识符。此参数允许确定应用程序相对于\
  \ Amazon 服务生成的数据流。\n\n`ResponseGroup`\n\n指定操作返回的数据。此参数允许详细控制操作响应的量和内容。\n\n### 表格\
  \ 14.10 ECS 服务的 XSL 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `ContentType` | 指定样式表生成的格式类型。\
  \ |\n| `Style` | 指定应用于以 XML 格式返回的数据的样式表。 |\n\n现在我们详细介绍如何使用 Amazon ECS 服务的各项操作。\n\
  \n### 操作\n\n在本节中，我们仅详细介绍产品搜索和产品信息检索的功能，分别对应 `ItemSearch` 和 `ItemLookup` 操作。\n\n\
  Amazon 服务的每个操作除了上一节描述的通用参数外，都 own 特定的参数需要使用。\n\n对于 `ItemSearch` 操作，必须通过 `SearchIndex`\
  \ 参数指定执行搜索的产品集，并可能通过 `Keywords` 参数指定一组关键词。\n\n以下链接可以搜索字符串“Spring par la pratique”（实战\
  \ Spring）对应的书籍：\n\n`http://webservices.amazon.fr/onca/xml?Service=AWSECommerceService&SubscriptionId=Votre_ID_ici&Operation=ItemSearch&SearchIndex=Books&Keywords=Spring%20par%20la%20pratique`\n\
  \n对于 `ItemLookup` 操作，只需通过 `ItemId` 参数指定产品 ID。\n\n以下链接可以加载书籍“Spring par la pratique”的信息：\n\
  \n`http://webservices.amazon.fr/onca/xml?Service=AWSECommerceService&SubscriptionId=Votre_ID_ici&Operation=ItemLookup&ItemId=2212117108`\n\
  \n### 数据\n\nECS 服务操作返回的数据结构化处理特别适用于 `ItemSearch` 和 `ItemLookup` 操作。\n\n这些数据通过 XML\
  \ 进行结构化处理。响应的基础标签是 `ItemSearchResponse`，它包含了与已执行的操作有关（子标签 `OperationRequest`）以及结果的信息（子标签\
  \ `Items`）。\n\nLivreGougeon 第 433 页 2006 年 11 月 28 日 星期二 4:23 16\n\n在下面的代码示例中，`OperationRequest`\
  \ 标签（标记 ❶）包含了为操作指定的所有参数（标记 ❷）以及技术信息（标记 ❸），例如请求的执行时间：\n\n```xml\n<ItemSearchResponse>\n\
  \  <OperationRequest> ❶\n    <HTTPHeaders> ❸\n      <Header Name=\"UserAgent\" Value=\"\
  Mozilla/5.0 (Windows; U; Windows NT 5.1; fr; rv:1.8.0.6) Gecko/20060728 Firefox/1.5.0.6\"\
