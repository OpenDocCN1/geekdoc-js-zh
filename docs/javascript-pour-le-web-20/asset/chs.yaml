- "# Web 2.0 JavaScript 入门指南\n\n\n\n![](img/cover.jpeg)\n\n![](img/index-1_1.jpg)\n\
  \n![](img/index-1_2.jpg)\n\n![](img/index-1_3.jpg)\n\n![](img/index-1_4.jpg)\n\n\
  ![](img/index-1_5.jpg)\n\n\n\n\n\n\nThierry Templier 毕业于 ESIGETEL，是 Web 2.0 架构师，也是曼芒一家\
  \ IT 服务公司的 J2EE 专家。\n\n# Ajax 和 Web 2.0 揭出的 JavaScript 威力\n\n长期以来，JavaScript 一直是一个潜力被低估、不受开发者欢迎且往往难以掌握的语言。直到\
  \ Ajax 和 Web 2.0 的出现，才展现了这种语言所提供的惊叹且意想不到的可能性。\n\n本书的目标是带您超越对 Java/J2EE 框架（如 `Prototype`、`Dojo`、`Script.aculo.us`、`Rialto`\
  \ 等）的常规基础用法，向您展示如何高效开发高性能且易于维护的 Web 2.0 应用。在回顾语言基础语法后，您将深入研究语言及其环境的各种高级方面：面向对象编程、DOM\
  \ 高级使用、利用 `XMLHttpRequest` 进行异步 HTTP 交换、与 (X)HTML 和 CSS 的交互、图形组件的创建等。\n\n## 通过案例研究说明的\
  \ Web 2.0 开发最佳实践\n\n### Arnaud Gougeon\n\n本书的大部分专注于不可或缺的 JavaScript 库，通过这些库您将节省开发时间并提高质量，同时为您的应用程序丰富复杂的图形组件。您还将学习如何通过\
  \ `REST` 协议集成 Google Maps、Yahoo! 或 Amazon 等网站提供的 Web 服务。\n\n全书中重点强调了 JavaScript\
  \ 开发的最佳实践：(X)HTML、CSS 和 JavaScript 的代码分离、组件实现、单元测试等。\n\n这种方法通过一个详细的案例研究进行了说明，该案例调用了\
  \ `Dojo` 库和 Google Maps 服务，其源代码在 `jsweb2.sourceforge.net` 开放。\n\n\n\n\n\n\n\n\n\
  ---\n\n\n我们感谢 Eyrolles 出版总监 Éric Sulpice 和 Olivier Salvatori 的多次校对和建议。\n\n最后，感谢所有能够支持并为我们校对的人，特别是\
  \ Jean-Philippe Retaillé 和 Stéphane Labbé。\n\n感谢 `Rialto` 库的创建者和开发者 Cyril Balit\
  \ 和 François Lion，他们在该库相关章节提供的宝贵帮助。\n\nArnaud Gougeon：\nThierry Templier：\n\n\n\n\
  \n\n本书从描述 `JavaScript` 的基本概念和机制开始。随后，它探讨了使用该语言进行图形化编程的机制，并结合了 `HTML`、`xHTML` 和 `CSS`\
  \ 语言。书中介绍并实现了多种便于使用上述机制的库。\n\n\n\n* 第二部分涉及基础的 `JavaScript` 库，其目标是方便使用第一部分涉及的各种语言机制。书中因此介绍了\
  \ `prototype`（一个轻量且流行的 `JavaScript` 库）和 `dojo`（一个非常全面的库）的基础。\n* 为了使用 `JavaScript`\
  \ 语言开发图形化应用，必须考虑并掌握许多方面。互联网上有许多 `JavaScript` 库可以隐藏这些问题，并提供现用且移植的图形化机制和组件。\n* 在 Web\
  \ 2.0 的哲学中，Web 对应于真正的平台。第五部分探讨了基于 `JavaScript` 语言的网页中与外部服务进行集成和交互的问题。书中特别介绍了 `Google\
  \ Maps`（Google 的地图工具）以及如何通过 `REST` 架构使用来自 `Yahoo!` 和 `Amazon` 网站的服务数据。\n* 第六部分描述了与\
  \ `JavaScript` 语言相关的各种工具，旨在提高 `JavaScript` 处理的质量以及开发效率。书中涵盖了使用 `JsUnit` 进行单元测试以及用于编写和实现此类处理的可用工具。\n\
  \n\n\n案例研究——一个遗址管理应用，是使用 `JavaScript` 语言、`dojo` 库和 `Google Maps` 工具的具体示例。它让读者直观地看到书中介绍的各种机制和技术如何协同工作，以开发出一个丰富且交互式的\
  \ Web 应用。\n\n该应用不仅仅是一个简单的示例，它作为一个原型，为一家法国大学的考古数据管理应用奠定了基础。案例可以在本书对应的 `SourceForge`\
  \ 网站页面上进行演示，地址为 `http://jsweb2.sourceforge.net/`。\n\n\n本书适用于任何想要发现或重新发现 `JavaScript`\
  \ 语言的 Web 开发人员。重点在于语言的基础机制，以及在 Web 2.0 精神下为网页中开发简单或高级处理提供的可能性。\n\n无需成为所介绍技术的专家。每章都会清晰地介绍每种技术，然后展示\
  \ `JavaScript` 语言如何实现它或与之交互。`HTML`、`xHTML` 和 `CSS` 等不同语言以及在网页中实现的各种也经过了详尽说明。\n\n\
  关于本书的任何问题，您可以通过 Eyrolles 网站的专用页面联系作者，地址为 `www.editions-eyrolles.com/`，或者通过本书的网站地址\
