  \ binding）的机制：\n\n```javascript\nvar monInstance = new Object();\n\nObject.prototype.maFonction\
  \ = function() {\n  return \"test de late binding\";\n};\n\nvar retour = monInstance.maFonction();\n\
  ```\n\n## 类创建技术\n\n使用 JavaScript 语言，可以基于函数和闭包的特性以及 `this` 关键字和 `prototype` 属性创建类。\n\
  \n在 JavaScript 中有多种创建的方法。为了描述它们的实现，我们将使用 `StringBuffer` 类，它提供了拼接字符串的能力。\n\n类可以仅基于函数、闭包和\
  \ `this` 关键字来定义。类通过一个名称与类名相同的函数来定义。该函数对应构造函数。它可以包含以 `var` 关键字开头的局部变量，以及带有 `this`\
  \ 前缀的类变量（对应属性）。这些变量既可以对应属性（标记 ❶），也可以对应方法（标记 ❷），如下所示：\n\n```javascript\nfunction\
  \ StringBuffer() {\n  this.chainesInternes = []; **¨** ❶\n  this.append = function(chaine)\
  \ { **¨** ❷\n    this.chainesInternes.push(chaine);\n  };\n  this.clear = function()\
  \ { **¨** ❷\n    this.chainesInternes.splice(0,\n    this.chainesInternes.length);\n\
  \  };\n  this.toString = function() { **¨** ❷\n    return this.chainesInternes.join(\"\
  \");\n  };\n}\n```\n\n该类的使用方式如下：\n\n```javascript\nvar sb = new StringBuffer();\n\
  sb.append(\"première chaîne\");\nsb.append(\" et \");\nsb.append(\"deuxième chaîne\
  \ \");\nvar resultat = sb.toString();\n//resultat 包含 « première chaîne et deuxième\
  \ chaine »\n```\n\n这种方法方法的问题是每个方法的代码在每次实例化时都会复制。如之前所述，`prototype` 属性可以解决这个问题。然而，这里描述的技术仅在类实例较少使用或需要实现私有属性或方法时才能使用。\n\
  \nLivreGougeon 第 68 页 2006 年 11 月 28 日 星期二 4:23 16\n\n## JavaScript 基础\n**68**\n\
  \n*第一部分*\n\n良好的实践是使用 `StringBuffer` 类的 `prototype` 属性（标记 ❶）来定义上一个类的方法。\n\n因此，类的代码现在如下：\n\
  \n```javascript\nfunction StringBuffer() {\n  this.chainesInternes = [];\n}\n\n\
  StringBuffer.prototype.append = function(chaine) { **¨** ❶\n  this.chainesInternes.push(chaine);\n\
  };\n\nStringBuffer.prototype.clear = function() { **¨** ❶\n  this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n};\n\nStringBuffer.prototype.toString = function()\
  \ { **¨** ❶\n  return this.chainesInternes.join(\"\");\n};\n```\n\n由于属性不被类的不同实例共享，因此它们始终定义在构造函数中，构造函数负责专门这些实例进行特定的初始化。然而，通过\
  \ `prototype` 属性定义它们允许为它们分配默认值。\n\n这种使用 `prototype` 属性定义类的方法是常用的。它的主要缺点是没有在构造函数中定义整个类。\n\
  \n可以对其进行改进，以便在第一次调用构造函数时在 `prototype` 属性上指定方法。\n\n为此我们使用构造函数的一个属性（标记 ❶），如下代码所示：\n\
  \n```javascript\nfunction StringBuffer() {\n  this.chainesInternes = [];\n  if(\
  \ typeof StringBuffer.initialized == \"undefined\" ) { **¨** ❶\n    StringBuffer.prototype.append\
  \ = function(chaine) {\n      this.chainesInternes.push(chaine);\n    };\n    StringBuffer.prototype.clear\
  \ = function() {\n      this.chainesInternes.splice(0, this.chainesInternes.length);\n\
  \    };\n    StringBuffer.prototype.toString = function() {\n      return this.chainesInternes.join(\"\
  \");\n    };\n    StringBuffer.initialized = true; **¨** ❶\n  }\n}\n```\n\n还可以通过一个对象来初始化\
  \ `prototype` 属性。后者可以用字面量形式定义，正如我们在有关 JSON 的章节中看到的。。我们还将看到某些继承的实现技术基于这一原理。\n\nLivreGougeon\
  \ 第 69 页 2006 年 11 月 28 日 星期二 4:23 16\n\n## JavaScript 与面向对象编程\n**69**\n\n*第 3 章*\n\
  \n## 类与可见性\n\n如之前所示，公共可见性级别是 JavaScript 语言完全支持的。\n\n尽管如此，在某些情况下也可以支持私有可见性级别。在 JavaScript\
  \ 中，私有属性和方法必须定义在类的构造函数中。为了让公共方法可以使用它们，整个类定义在它的构造函数中是必不可的。\n\n根据上一节，有两种方法验证了这一条件。\n\
  \n第一种没有使用 `prototype` 属性，直接在构造函数中定义属性和方法。此时，私有方法是构造函数的内部方法，没有附加到类的属性上。私有属性被定义为构造函数的简单局部变量。\n\
  \n以下代码说明了带有私有属性和方法的 `StringBuffer` 实现：\n\n```javascript\nfunction StringBuffer()\
  \ {\n  var chainesInternes = []; **¨** ❶\n}\n```\n\n\n\n\n\n```javascript\nfunction\
  \ addInInternalTable(chaine) { //¨ ❷\n  chainesInternes.push(chaine);\n}\n\nfunction\
  \ clearInternalTable() { //¨ ❷\n  chainesInternes.splice(0, this.chainesInternes.length);\n\
  }\n\nthis.append = function(chaine) { //¨ ❸\n  addInInternalTable(chaine);\n};\n\
  \nthis.clear = function() { //¨ ❸\n  clearInternalTable();\n};\n\nthis.toString\
  \ = function() { //¨ ❹\n  return chainesInternes.join(\"\");\n};\n}\n```\n\n标记 ❶\
  \ 标识了类的私有属性，因为它通过关键字 `var` 被定义为类的构造函数的变量。标记 ❷ 指明了私有方法，因为它们仅通过关键字 `function` 定义，且没有赋值给带有\
  \ `this` 前缀的变量。被标记 ❸ 标识的方法是公共的，并且使用了一个私有方法。被标记 ❹ 标识的方法是公共的，并且使用了一个私有属性。\n\n第二种方法依赖于原型（prototype）属性，但其初始化是在类的构造函数中完成的。\n\
  \n上述代码的适配如下：\n\n```javascript\nfunction StringBuffer() {\n  var chainesInternes\
  \ = []; //¨ ❶\n  function addInInternalTable(chaine) { //¨ ❷\n    chainesInternes.push(chaine);\n\
  \  }\n  function clearInternalTable() { //¨ ❷\n    chainesInternes.splice(0, this.chainesInternes.length);\n\
  \  }\n  if( typeof StringBuffer.initialized == \"undefined\" ) {\n    StringBuffer.prototype.append\
  \ = function(chaine) { //¨ ❸\n      addInInternalTable(chaine);\n    };\n    StringBuffer.prototype.clear\
  \ = function() { //¨ ❸\n      clearInternalTable();\n    };\n    StringBuffer.prototype.toString\
  \ = function() { //¨ ❹\n      return chainesInternes.join(\"\");\n    };\n    StringBuffer.initialized\
  \ = true;\n  }\n}\n```\n\n这些标记与之前的描述相同。\n\n最后，我们需要注意到，在构造函数外部使用原型属性的技术无法正确实现具有公共可见性之外的元素。在这种情况下，公共方法将无法调用私有方法。\n\
  \n## 字面量对象与 JSON\n\n由于 JavaScript 将对象视为包含值、对其他对象的引用或函数的元素集合，因此对象可以通过 JSON 结构来定义。后者对应于对象的字面量表示。\n\
  \nJSON 在语言标准中是被支持的，并可以直接在 JavaScript 程序中使用。\n\n### JSON (JavaScript 对象表示法)\n\nJSON\
  \ 是一种独立于任何编程语言的文本数据交换格式，它包含了 JavaScript 语言规范的一部分。该格式的文档可以在 `http://www.json.org/`\
  \ 获取。JSON 易于人类读写，也易于程序解析和生成。\n\nJSON 定义了两种数据结构。第一种通过有序的键值列表定义对象，其格式如下：\n\n```json\n\
  {\n  cle1: valeur,\n  cle2: function() { (...) }\n}\n```\n\n第二种通过有序的值列表定义数组，其其格式如下：\n\
  \n```json\n[\n  valeur,\n  function() { (...) }\n]\n```\n\n以下代码演示了如何从 JSON 结构创建对象：\n\
  \n```javascript\nvar monInstance = {\n  maMethode: function() { (...) }\n};\nmonInstance.maMethode();\n\
  ```\n\n这种技术允许以更简洁的方式定义类原型属性的内容。因此，上一节中的 `StringBuffer` 类可以写成如下形式：\n\n```javascript\n\
  function StringBuffer() {\n  this.chainesInternes = [];\n}\nStringBuffer.prototype\
  \ = {\n  append : function(chaine) {\n    this.chainesInternes.push(chaine);\n \
  \ },\n  clear : function() {\n    this.chainesInternes.splice(0, this.chainesInternes.length);\n\
  \  },\n  toString : function() {\n    return this.chainesInternes.join(\"\");\n\
  \  }\n};\n```\n\n这种写法在 `prototype` 和 `dojo` 等库中很常见。\n\n## JavaScript 基础原理\n\n###\
  \ 类继承\n\n与创建类类似，JavaScript 语言并没有定义特定的关键字（例如 `extends`）来实现类继承。因此，有多种方法可以让一个类继承另一个类，其中某些方法允许实现多重继承。\n\
  \n正如我们在上一节中看到的，类的元素定义在两个级别：\n- 构造函数层面的属性，因为它们的值是特定于实例的。它们的默认值可以在原型属性中指定。\n- 构造函数层面或原型属性层面的方法，具有前述的影响。\n\
  \n由于 JavaScript 将对象理解为非有序列表，类属性和方法的继承对应于对这些类的拷贝。\n\n#### 调用父类构造函数\n\n在 JavaScript\
  \ 中实现类继承的第一种技术是依靠父类的构造函数来初始化子类。它依赖于 `this` 关键字的功能，`this` 引用被调用的对象。我们可以将父类的构造函数赋值给子类的任何方法。\n\
  \n以下代码演示了这种机制的实现：\n\n```javascript\nfunction StringBuffer() {\n  this.chainesInternes\
  \ = [];\n}\nStringBuffer.prototype.append = function(chaine) {\n  this.chainesInternes.push(chaine);\n\
  };\nStringBuffer.prototype.clear = function() {\n  this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n};\nStringBuffer.prototype.toString = function()\
  \ {\n  return this.chainesInternes.join(\"\");\n};\nfunction ExtendedStringBuffer()\
  \ {\n  this.parent = StringBuffer; //¨ ❶\n  this.parent();\n  delete this.parent;\n\
  \  (...)\n}\n```\n\n标记 ❶ 标识了父类构造函数的使用。注意，应该释放包含父类构造函数的变量，因为它不属于子类的元素。该变量在之后不再被使用。在上面的示例中，一旦调用了\
  \ `parent` 方法，`ExtendedStringBuffer` 类拥有一个名为 `chainesInternes` 的属性。\n\n这种技术麻烦且不自然。使用函数的\
  \ `call` 和 `apply` 方法变得更有意义，因为它们提供了在执行时定义被调用方法的对象的可能性。\n\n上述代码可以按如下方式改进：\n\n```javascript\n\
  function StringBuffer() {\n  this.chainesInternes = [];\n}\n(...)\nfunction ExtendedStringBuffer()\
  \ {\n  StringBuffer.call(this); //¨ ❶\n  (...)\n}\n```\n\n标记 ❶ 依然标识了父类构造函数的使用。如果\
  \ `StringBuffer` 类的方法是通过原型属性在构造函数外部定义的，那么这些方法将无法通过这种技术被继承。\n\n#### 使用父类的原型\n\n使用原型属性来实现继承可以通过两种方式实现：\n\
  \n\n\n\n\n-   通过父类实例覆盖子类 `prototype` 属性的内容；\n-   通过将父类 `prototype` 属性的元素复制到子类的 `prototype`\
  \ 属性中。\n\n第一种技术对应于原型链，它使用父类实例来初始化子类的 `prototype` 属性。它允许将父类中包含的所有元素分配给子类的 `prototype`\
  \ 属性。然而，它不支持多重继承。\n\n以下代码展示了其实现方式：\n\n```javascript\nfunction StringBuffer() {\n\
  \  this.chainesInternes = [];\n}\n\nfunction ExtendedStringBuffer() {\n  (...)\n\
  }\n\nExtendedStringBuffer.prototype = new StringBuffer();\n```\n\n不同处理操作的顺序对子类的方法可能产生重要影响。事实上，在重置之前添加到\
  \ `prototype` 属性的子类方法最终将不再存在。\n\n以下代码展示了这个问题：\n\n```javascript\nfunction StringBuffer()\
  \ {\n  this.chainesInternes = [];\n}\n\nfunction ExtendedStringBuffer() {\n  (...)\n\
  }\n\nExtendedStringBuffer.prototype.uneMethode = function() {\n  (...)\n}\n\nExtendedStringBuffer.prototype\
  \ = new StringBuffer();\n// 方法 uneMethode 不再存在于原型中\n```\n\n第二种技术通过手动将父类 `prototype`\
  \ 属性中的元素复制到子类的 `prototype` 属性中。\n\n以下代码展示了这一原理的实现：\n\n```javascript\nfunction StringBuffer()\
  \ {\n  this.chainesInternes = [];\n}\n\n(...)\n\nfunction ExtendedStringBuffer()\
  \ {\n  (...)\n}\n\nfor( element in StringBuffer.prototype ) {\n  ExtendedStringBuffer.prototype[element]\
  \ = StringBuffer.prototype[element];\n}\n```\n\n这种技术无法让子类继承在父类构造函数中定义的类元素。因此，恰地将基于父类构造函数的方法与基于\
  \ `prototype` 属性的方法结合起来。\n\n### 两种技术的结合\n\n为了在 JavaScript 中有效地实现类继承，将上述两种技术结合起来是必要的。\n\
  \n以下代码给出了一个实现示例：\n\n```javascript\n// 定义父类\nfunction StringBuffer() {\n  this.chainesInternes\
  \ = [];\n}\n\n// 指定父类方法\nStringBuffer.prototype.append = function(chaine) {\n  this.chainesInternes.push(chaine);\n\
  };\n\nStringBuffer.prototype.clear = function() {\n  this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n};\n\nStringBuffer.prototype.toString = function()\
  \ {\n  return this.chainesInternes.join(\"\");\n};\n\n// 定义子类\nfunction ExtendedStringBuffer()\
  \ {\n  StringBuffer.call(this); // ❶\n}\n\n// 复制父类方法\nfor( var element in StringBuffer.prototype\
  \ ) { // ❷\n  ExtendedStringBuffer.prototype[element] = StringBuffer.prototype[element];\n\
  }\n\n// 指定子类方法\n// 注意：原文包含一个重复的 append\nExtendedStringBuffer.prototype.append =\
  \ function(chaine) {\n  this.chainesInternes.push(chaine);\n};\n```\n\n父类构造函数的调用在子类构造函数中完成（标记\
  \ ❶）。将父类 `prototype` 属性的元素复制到子类 `prototype` 属性的操作在标记 ❷ 完成。\n\n这种实现还不完全完美，因为不同类的代码没有分组在各自的构造函数中。通过在构造函数中指定\
  \ `prototype` 属性值的技术，继承的指定更加简洁。\n\n由于此操作只需要执行一次，我们使用一个绑定在构造函数上的属性来检测其是否已经执行。\n\n\
  以下代码展示了该机制的实现：\n\n```javascript\n// 定义父类\nfunction StringBuffer() {\n  this.chainesInternes\
  \ = [];\n  // 指定父类方法\n  if( typeof StringBuffer.initialized == \"undefined\" ) {\n\
  \    StringBuffer.prototype.append = function(chaine) {\n      this.chainesInternes.push(chaine);\n\
  \    };\n    StringBuffer.prototype.clear = function() {\n      this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n    };\n    StringBuffer.prototype.toString = function()\
  \ {\n      return this.chainesInternes.join(\"\");\n    };\n    StringBuffer.initialized\
  \ = true;\n  }\n}\n\n// 定义子类\nfunction ExtendedStringBuffer() {\n  // 调用父类构造函数\n\
  \  StringBuffer.call(this);\n  // 指定子类方法\n  if( typeof ExtendedStringBuffer.initialized\
  \ == \"undefined\" ) { // ❷\n    // 复制父类方法\n    for( var element in StringBuffer.prototype\
  \ ) { // ❶\n      ExtendedStringBuffer.prototype[element] = StringBuffer.prototype[element];\n\
  \    }\n    ExtendedStringBuffer.prototype.append = function(chaine) {\n      this.chainesInternes.push(chaine);\n\
  \    };\n    ExtendedStringBuffer.initialized = true; // ❷\n  }\n}\n```\n\n现在，将父类\
  \ `prototype` 属性的元素复制到子类属性的操作是在后者的构造函数中完成的（标记 ❶）。\n\n### 多重继承\n\n多重继承可以用与简单相同的方法在\
  \ JavaScript 中实现。只需注意在实现继承继承不要覆盖 `prototype` 属性。\n\n良好的做法是将父类 `prototype` 属性中包含的不同元素复制到子类的\
  \ `prototype` 属性中。\n\n以下代码展示了 `ExtendedStringBuffer` 的多重继承实现，其父类为 `StringBuffer`\
  \ 和 `StringSpliter`：\n\n```javascript\nfunction StringBuffer() { // ❶\n  this.chainesInternes\
  \ = [];\n  // 指定父类方法\n  if( typeof StringBuffer.initialized == \"undefined\" ) {\n\
  \    StringBuffer.prototype.append = function(chaine) {\n      this.chainesInternes.push(chaine);\n\
  \    };\n    StringBuffer.prototype.clear = function() {\n      this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n    };\n    StringBuffer.prototype.toString = function()\
  \ {\n      return this.chainesInternes.join(\"\");\n    };\n    StringBuffer.initialized\
  \ = true;\n  }\n}\n\nfunction StringSpliter() { // ❷\n  if( typeof StringSpliter.initialized\
  \ == \"undefined\" ) {\n    StringSpliter.prototype.split = function(chaine) {\n\
  \      this.chainesInternes = chaine.split(\" \");\n    };\n    StringSpliter.initialized\
  \ = true;\n  }\n}\n\nfunction ExtendedStringBuffer() { // ❸\n  StringBuffer.call(this);\
  \ // ❹\n  StringSpliter.call(this); // ❹\n  if( typeof ExtendedStringBuffer.initialized\
  \ == \"undefined\" ) { // ❹\n    // 复制第一个父类方法\n    for( var element in StringBuffer.prototype\
  \ ) {\n      ExtendedStringBuffer.prototype[element] = StringBuffer.prototype[element];\n\
  \    }\n    // 复制第二个父类方法\n    for( var element in StringSpliter.prototype ) {\n\
  \      ExtendedStringBuffer.prototype[element] = StringSpliter.prototype[element];\n\
  \    }\n    ExtendedStringBuffer.prototype.append = function(chaine) {\n      this.chainesInternes.push(chaine);\n\
  \    };\n    ExtendedStringBuffer.initialized = true;\n  }\n}\n```\n\n标记 ❶、❷ 和 ❸\
  \ 分别指向父类 `StringBuffer`、`StringSpliter` 以及子类 `ExtendedStringBuffer` 的定义。标记 ❹ 指向构造函数的调用和初始化检查。\n\
  \n\n\n\n展示了对父类构造函数的调用，以及如何根据父类的属性初始化子类的 `prototype` 属性。\n\n需要提醒的是，多重继承必须谨慎使用，因为在某些情况下它可能会引入问题。\n\
  \n### 总结\n\nJavaScript 语言允许实现对象编程的基本原则。然而，它并没有提供专门的语言元素来定义类及其继承关系。为了弥补这一缺陷，可以使用基于函数和\
  \ `closures`（闭包）机制以及 `this` 关键字和 `prototype` 属性的各种方法。\n\n这些不同的技术并不是等等的，可能会对应用程序的产生影响。\n\
  \nLivreGougeon 第 78 页 2006 年 11 月 28 日 周二 4:23 16\n\n## JavaScript 基础\n\n**78**\n\
  \n*第一部分*\n\n### 深入探讨\n\n正如我们在本章中所指出的，JavaScript 没有定义一种统一、标准且集成在语言中的机制来实现面向对象编程概念。该语言也不支持该范式的所有机制。\n\
  \n因此，有必要对处理进行模块化，以丰富现有的类并实现继承。某些技术还可以模拟如 `packages`（包）之类的机制。\n\n理解 JavaScript 解释器对内存的管理对于最小化使用该语言开发的应用程序的内存消耗以及避免内存泄漏至关重要。\n\
  \n## 丰富现有类\n\nJavaScript 提供了许多预定义对象，如 `String` 和 `Number`。通过 `prototype` 属性，可以在不修改其代码的情况下丰富现有类。这种简单的机制就是向该属性添加方法。\n\
  \n为此，可以创建如下的 `extends` 函数：\n\n```javascript\nfunction extends(destination, source)\
  \ {\n  for( property in source ) {\n    destination.prototype[property] = source[property];\n\
  \  }\n  return destination;\n}\n```\n\n以下代码演示了如何使用该函数为 JavaScript 的 `String` 类添加方法：\n\
  \n```javascript\nextends(String, {\n  maMethode: function(_param) {\n    return\
  \ (...);\n  },\n  monAutreMethode: function() {\n    return (...);\n  }\n})\n\n\
  var maChaine = new String(\"ma chaine\");\nmaChaine.maMethode(\"mon parametre\"\
  );\n```\n\n注意，`prototype` 库中的 `Object.extends` 方法实现了这种机制来复制属性和方法。在使用对象的 `prototype`\
  \ 属性时建议遵循这种用法。\n\nLivreGougeon 第 79 页 2006 年 11 月 28 日 周二 4:23 16\n\n## JavaScript\
  \ 与面向对象编程\n\n**79**\n\n*第 3 章*\n\n### 确定对象的类型\n\n我们在上一节中看到，在使用对象时 `typeof` 关键字的用处不大，因为无论对象的类型是什么，它返回的都是\
  \ `object` 值。\n\nJavaScript 语言提供了 `instanceof` 关键字来判断一个实例是否匹配某种类型。\n\n以下代码是其在 `String`\
  \ 类中使用的示例：\n\n```javascript\nString chaine = \"Ceci est un test\";\n// 显示 « object\
  \ »\nalert(\"typeof chaine : \"+(typeof chaine));\n\n// 显示 « true »\nalert(\"chaine\
  \ instanceof String : \"+(chaine instanceof String));\n```\n\n在不同类之间存在继承的情况下，该关键字还可以用于判断一个类是否是父类的实例。然而，只有当继承是通过使用父类构造函数初始化\
  \ `prototype` 属性来实现时，此功能才有效。\n\n以下代码演示了在继承框架下使用 `instanceof` 关键字的情况： \n\n```javascript\n\
  function StringBuffer() {\n  (...)\n}\n\nfunction ExtendedStringBuffer() {\n  (...)\n\
  }\n\nExtendedStringBuffer.prototype = new StringBuffer();\nvar sb = new ExtendedStringBuffer();\n\
  \n// 显示 « true »\nalert(\"sb instanceof StringBuffer : \"+(sb instanceof StringBuffer));\n\
  \n// 显示 « true »\nalert(\"sb instanceof ExtendedStringBuffer : \"+(sb instanceof\
  \ ExtendedStringBuffer));\n```\n\n在从父类复制方法到子类的情况下，`instanceof` 关键字无法使用，如以下代码所示：\n\
  \n```javascript\nfunction StringBuffer() {\n  (...)\n}\n\nfunction ExtendedStringBuffer()\
  \ {\n  (...)\n}\n\nfor( var element in StringBuffer.prototype ) {\n  ExtendedStringBuffer.prototype[element]\
  \ = StringBuffer.prototype[element];\n}\n\nvar sb = new ExtendedStringBuffer();\n\
  \n// 显示 « false »\nalert(\"sb instanceof StringBuffer : \"+(sb instanceof StringBuffer));\n\
  \n// 显示 « true »\nalert(\"sb instanceof ExtendedStringBuffer : \"+(sb instanceof\
  \ ExtendedStringBuffer));\n```\n\n由于 `instanceof` 关键字的结果随其实现方式的不同而不同，因此在继承框架下使用时必须谨慎。\n\
  \n## JavaScript 库的支持\n\n在 JavaScript 中实现面向对象编程概念并不直观，需要良好理解某些机制。\n\n借助库可以减少这种复杂性。例如，`prototype`\
  \ 库提供了一种创建类的不同风格。我们将在第 6 章和第 7 章更详细地返回 `extend`、`declare` 和 `inherits` 等工具。其文档可以在作者\
  \ Bob Clary 的网站上找到，地址为 http://bclary.com/log/2002/14\n\n## 包结构化\n\n由于 JavaScript\
  \ 不支持包，可以使用类名来模拟这种机制。\n\n以下代码展示了如何为之前描述的 `StringBuffer` 类指定包 `lang`：\n\n```javascript\n\
  function lang.StringBuffer() {\n  this.chainesInternes = [];\n}\n\nlang.StringBuffer.prototype.append\
  \ = function(chaine) {\n  this.chainesInternes.push(chaine);\n};\n\nlang.StringBuffer.prototype.clear\
  \ = function() {\n  this.chainesInternes.splice(0, this.chaineseseslengthlength\n\
  };\n\nlang.StringBuffer.prototype.toString = function() {\n  return this.chainesInternes.join(\"\
  \");\n};\n```\n\nLivreGougeon 第 81 页 2006 年 11 月 28 日 周二 4:23 16\n\n## JavaScript\
