  \n**图 12.14**\n*树的外观*\n\n**rialto 库**\n**385**\n*第 12 章*\n\n可以在树的 `onclick` 方法（标记\
  \ ❷）上注册一个全局观察者，以便在选择这些节点时执行处理（标记 ❶）。\n\n以下代码展示了如何实现这一机制：\n\n```javascript\nfunction\
