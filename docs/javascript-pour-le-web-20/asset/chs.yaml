  ### 动态加载 (487)\n\n\n\n接下来，我们将通过研究该语言如何集成到 HTML 页面的组成元素中，来探讨它如何构成 Web 2.0 应用的基础构建。\n\
  ## JavaScript 语言\n在 `JavaScript`、`JScript` 和 `ECMAScript` 术语之间存在某种误解。此外，与它们名称可能暗示的相反，`JavaScript`\
  \ 和 `Java` 之间几乎没有相似之处，仅源于它们的共同父级语言 `C`，且仅限于基础语法。\nLivreGougeon 第 2 页 2006 年 11 月\
  \ 28 日 星期二 4:23 16\n## 用于 Web 2.0 的 JavaScript\n### 历史\n`JavaScript` 语言由 Brendan\
  \ Eich 为 `Netscape Communications Corporation` 创建。1996 年 11 月，它成为了第一版 `ECMA-262`\
  \ 标准的基础，该标准描述了 `ECMAScript` 语言。因此，`JavaScript` 对应该标准的一种方言，并在之后独立发展。\n### ECMA（欧洲计算机制造商协会）\n\
  `ECMA` 成立于 1961 年，并自 1994 年起具有国际化愿景，是一个信息和通信系统的标准化组织。其目标是开发和推广各种标准，以促进信息通信技术的使用。截至目前，`ECMA`\
  \ 已发布了 370 多个标准和技术报告，其中二之三被作为国际标准采用，并负责 `C++`、`C#`、`Eiffel` 和 `ECMAScript` 语言的相关标准。\n\
  面对 `JavaScript` 作为网页脚本语言的成功，微软于 1996 年 8 月推出了 `JScript` 语言，它与 `JavaScript` 相似，同样对应于\
  \ `ECMAScript` 语言的一种方言。\n因此，每个浏览器都通过自己的方言支持 `ECMAScript`。由于语言习惯用，所有这些方言统称为 `JavaScript`。\n\
  表格 1.1 和 1.2 总结了 `ECMAScript` 规范版本与其主要方言 `JavaScript` 和 `JScript` 之间的兼容级别。\n###\
  \ 表格 1.1 ECMAScript 与 JavaScript 之间的兼容级别\n| JavaScript 版本 | ECMAScript 版本 |\n| 1.0\
  \ (Netscape 2.0, 1996 年 3 月) | - |\n| 1.2 (Netscape 4.0, 1997 年 6 月) | - |\n| 1.4\
  \ (Netscape Server) | - |\n| 1.6 (Gecko 1.8 和 Firefox 1.5, 2005 年 11 月) | 版本 3 以及对\
  \ E4X、数组扩展以及泛型字符串和数组的支持 |\n\n\n| :--- | :--- |\n| 2.0 (Internet Explorer 3.0, 1997\
  \ 年 1 月) | - |\n\n\n\n\n\n| :--- | :--- |\n| 5.0 (Internet Explorer 5.0, 1999 年\
  \ 3 月) | - |\n| 5.5 (Internet Explorer 5.5, 2000 年 7 月) | 版本 3 (1999 年 12 月) |\n\
  | .Net (ASP.NET) | - |\n下一节将详细介绍 `ECMAScript` 规范，其目标是描述 `JavaScript` 语言的核心。\n###\
  \ ECMAScript\n`ECMAScript` 基于 `ECMA-262` 规范，是一种解释型语言，其目标是允许操作宿主应用程序提供的对象。该规范描述了以下元素：\n\
  • 语法和关键字；\n• 类型和类型转换；\n• 表达式和控制结构；\n• 原生对象。\n这种语言还实现了原型（prototype）概念。这是一种缺失“类”概念的面向对象编程风格。不同版本的\
  \ `ECMAScript` 如表格 1.4 所示。\n### 表格 1.4 ECMAScript 规范版本\n| 版本 | 日期 | 描述 |\n| 1 |\
  \ 1997 年 6 月 | Netscape 的初始版本 |\n| 3 | 1999 年 12 月 | 可能引入了关键字 |\n\n\n\n\n• E4X:\
  \ [`www.ecma-international.org/publications/ecma-357.html`](http://www.ecma-international.org/publications/ecma-357.html)\n\
  \n\nJavaScript 提供了不同的机制，允许网页中用 HTML、xHTML 和 CSS 语言编写的元素与 JavaScript 脚本进行交互。\n##\
  \ HTML 和 xHTML\n`HTML`（超文本标记语言）是一种用于实现包含包含链接和图形元素的网页的标记语言。这些页面被设计用于在 Web 浏览器中显示。\n\
  `xHTML`（可扩展超文本标记语言）被定位为 `HTML` 的继任者，是一种不同的语言，它对 `HTML` 进行了重新制定。因此，使用 `xHTML` 的网页必须符合\
  \ XML 规范。所有标签必须正确关闭，且属性必须由字符“``”或“'”进行界定。\n## CSS\n`CSS`（级联样式表）解决了 HTML 页面的显示问题。其目标是允许通过\
  \ `HTML` 或 `xHTML` 语言实现的页面结构与通过 `CSS` 描述的视觉呈现之间清晰分离。\n浏览器首先从网站加载页面。该页面对应于一个包含 `HTML`\
  \ 或 `xHTML` 元素的文件。它还可能包含或引用各种异构块。例如，JavaScript 脚本和 `CSS` 样式可能存在其中。\n所有这些元素允许浏览器初始化网页，涵盖其结构、图形界面和处理逻辑层面。\n\
  浏览器使用 `HTML` 或 `xHTML` 元素来初始化内存中的页面结构。该结构基于 `DOM`（文档对象模型）技术，它是页面的层次分级对象表示。\n浏览器依赖\
  \ `CSS` 样式为页面提供图形表示。请注意，页面的 `HTML` 或 `xHTML` 结构也会影响这种表示。\nJavaScript 脚本允许为页面添加处理逻辑。这些逻辑可以在页面加载时执行，也可以在响应各种事件。\n\
  ## 用于 Web 2.0 的 JavaScript\n图 1.2 展示了网页的不同组成部分及其相互作用。\n### 图 1.2：网页不同组成部分之间的交互\n\
  ```\n  HTML 页面\n    结构与表示\n    页面初始化（初始化）\n    定位\n    操作\n    与结构的交互（内存中 CSS 事件流的结构观察者属性）\n\
  \    页面处理逻辑\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n这些处理始终是可能的，但可以在页面内完成，无需重新加载页面或操作其图形界面。此外，现在可以交换数据而非相应的网页内容。\n\
  这里所实现的技术通常缩写为 `AJAX`（异步 JavaScript 和 XML）。它们基于 JavaScript，以便在网页中执行 HTTP 请求并以同步或异步的方式处理其响应。\n\
  实现这一目标有多种方法。其中一种方法依赖于 JavaScript 类 `XMLHttpRequest`，该类存在于绝大多数现代浏览器中，并正在由 `W3C` 进行标准化。该类提供了执行\
  \ HTTP 请求并管理响应的能力。这种方法完全基于 JavaScript 语言。\n### W3C (世界维网联盟)\nW3C 是一个非营利组织，其目标是促进\
  \ Web 技术（HTML、xHTML、XML、CSS 等）。该机构不发布标准，而是发布代表标准的建议（reations）。\n还可以使用 HTML 和 xHTML\
  \ 语言的标签来实现另外两种方法。当上述类不可用或为了突破其局限性时，应当使用这些方法。\n在任何情况下，JavaScript 都使用 `DOM` 技术根据响应中接收到的数据更新图形界面的一个或多个部分。基于\
  \ Ajax 的通信机制如图 1.3 所示。我们将在第 5 章详细介绍与 Ajax 相关的各种技术。\n```\n网站托管主机\nHTML 页面\n执行 Ajax\
  \ 请求（不刷新页面）并处理结果\n```\n## 第 1 章：浏览器\n**网站托管主机**\n**图 1.3：基于 Ajax 的通信机制**\n## 应用程序结构\n\
  随着 JavaScript 在 Web 2.0 应用中变得越来越普及，根据所实现的技术及其集成的处理对网页进行良好的结构化是至关重要的。这种结构可以在不同级别完成。\n\
  ### 语言隔离\n由于网页可能使用不同的语言，因此良好地分离它们的使用并处理好它们的交互非常重要。`CSS` 样式应尽可能从页面中外部化。`HTML`、`xHTML`\
  \ 和 `CSS` 之间的关系应主要基于 `CSS` 选择器。在定义样式时，应尽可能避免使用 `HTML` 和 `xHTML` 标签的 `style` 属性。\n\
  同样，JavaScript 代码应尽可能从 `HTML` 和 `xHTML` 标签中外部化。因此，将 JavaScript 处理连接到 `HTML` 和 `xHTML`\
  \ 标签的操作应尽可能地限制在相关的事件属性中，并尽可能利用 `DOM` 技术对事件的支持。这些方法允许很好地分离网页中包含的不同处理和语言，以便于维护和演进。\n\
  ### JavaScript 处理结构化\n可以实现多种机制来结构化 JavaScript 应用程序的处理。它们主要基于 JavaScript 函数，这些函数特别允许实现面向对象编程的概念。\n\
  目标是将处理逻辑模块化到 JavaScript 实体中，以避免代码重复并促进处理的重用。实现和使用 JavaScript 库允许针对特定问题使用各种函数集合，并以透明的方式处理浏览器的特殊性。大多数图形库都提供了一系列即插用的图形组件和效果，以及一个用于\
  \ JavaScript 开发 Web 应用程序的通用框架。\n我们将在本书的第三部分详细介绍 `HTML`、`xHTML`、`CSS` 和 `JavaScript`\
  \ 技术这些最佳实践的实现。在第四部分中，我们将介绍解决网页图形问题的各种 JavaScript 库的实现。\n## 结论\nJavaScript 是一种脚本语言，其核心由\
  \ `ECMA-262` 规范标准化。后者描述了 `ECMAScript` 语言，JavaScript 可以被视为其一种变言，正如 `JScript` 一样。习惯上，JavaScript\
  \ 实际上指的是所有这些变言。\n作为一种解释型语言，JavaScript 特别允许在网页中实现脚本。它提供了与网页中使用的不同语言和技术交互的可能性。通过借助\
