  \ == \"http:\"){\n    rialtoConfig.isFilePath=false;\n    rialtoConfig.pathRialtoE\
  \ = \"rialtoEngine/\"; // ❷\n  }\n}\n```\n\n\n\n\n\n尽管 `rialto` 库主要侧于于 HTML 页面中实现图形功能，但它也提供了方便基于\
  \ JavaScript 语言处理和 Ajax 技术的功能。\n\n# 图形 JavaScript 库\n\n*第四部分*\n\n## 基础支持\n\n在详细介绍\
  \ `rialto` 为开发图形应用提供的各种机制和组件之前，我们将先描述该该库的基础模块。\n\n表 12.2 汇总了与基础支持相关的对象。\n\n### 表\
