  \ 一个对象 | 允许克隆对象。标记决定是否进行递归克隆。 |\n\n`dojo.extend` 函数允许使用不同的方法扩展类。根据其实现，该函数不支持多重继承。以下代码描述了如何在类实例使用该函数：\n\
  \n```javascript\nfunction StringBuffer() {\n    this.chainesInternes = [];\n}\n\n\
  dojo.extend(StringBuffer, {\n    append: function(chaine) {\n        this.chainesInternes.push(chaine);\n\
  \    },\n    clear: function() {\n        this.chainesInternes.splice(0);\n    },\n\
  \    toString: function() {\n        return this.chainesInternes.join(\"\");\n \
  \   }\n});\n\nvar sb = new StringBuffer();\nsb.append(\"première chaîne\");\nsb.append(\"\
  deuxième chaîne\");\nvar resultat = sb.toString(); // resultat 包含 “première chaîne\
  \ et deuxième chaîne”\n```\n\n`dojo.inherits` 函数允许一个类继承另一个类。以下代码通过重复第三章定义的类描述了该函数的使用：\n\
  \n```javascript\nfunction StringBuffer() {\n    // ... (同上文)\n}\n\nfunction ExtendedStringBuffer()\
  \ {\n    // ...\n}\n\ndojo.inherits(ExtendedStringBuffer, StringBuffer);\n```\n\n\
  dojo 库还通过 `dojo.lang.declare` 函数提供了更深的面对象编程支持，该函数稍后详细介绍。\n\n### 表格\n\ndojo 库提供了不同的函数，方便使用和操作简单数组和关联数组。表格\
  \ 7.6 汇总了这些函数。\n\n| 函数 | 参数 | 说明 |\n| :--- | :--- | :--- |\n| `dojo.lang.every`\
  \ | 一个数组，一个回调函数 | 判断数组中的所有元素是否符合某个标准。该检查通过传递给参数的回调函数进行。回调函数的执行在最后一个参数对应的对象上下文中进行。\
  \ |\n| `dojo.lang.filter` | 一个数组，一个回调函数 | 允许通过回调函数过滤数组元素。回调函数的执行在最后一个参数对应的对象上下文中进行。\
  \ |\n| `dojo.lang.find` | 一个数组，一个元素，一个标记 | 返回数组中第一个与参数元素标识和确定标记匹配的元素的索引。如果没有匹配的元素，则返回\
  \ -1。数组从末尾向开头遍历。 |\n| `dojo.lang.findLast` | 一个数组，一个元素，一个标记 | 返回数组中最后一个与参数元素标识和确定标记匹配的元素的索引。如果没有匹配的元素，则返回\
  \ -1。 | |\n| `dojo.lang.forEach` | 一个数组和一个回调函数 | |\n\n\n\n\n通过回调函数来遍历数组。该函数在每次迭代时接收当前元素、其索引以及所遍历的数组作为参数。\n\
  \n### `dojo.lang.has`\n关联数组和一个名称\n判断关联数组是否具有参数传递的名称的属性。\n\n### `dojo.lang.inArray`\n\
  一个数组和一个元素\n判断一个元素是否存在于数组中。\n\n### `dojo.lang.indexOf`\n一个数组、一个元素、一个标志\n等同于标识性函数\
  \ `dojo.lang.find`，该标志决定了数组是从尾部向头部遍历。\n\n### `dojo.lang.isEmpty`\n一个数组\n判断数组是否为空。此函数同时支持普通数组和关联数组。\n\
  \n### `dojo.lang.lastIndexOf`\n一个数组、一个元素和一个标识标志\n等同于 `dojo.lang.findLast` 函数。\n\n\
  ### `dojo.lang.map`\n一个数组、一个对象和一个回调函数\n允许根据回调函数从另一个数组构建新数组。该函数负责返回要插入到新数组中的对象。回调函数的执行在最后一个参数对应的对象的上下文中进行。\n\
  \n### `dojo.lang.some`\n一个数组、一个回调函数和一个对象\n判断数组是否至少有一个元素符合某个标准。该检查通过传递参数的回调函数进行。回调函数的执行在最后一个参数对应的对象的上下文中进行。\n\
  \n### `dojo.lang.toArray`\n一个类数组对象和一个起始索引\n允许将类数组对象转换为数组。\n\n### `dojo.lang.unnest`\n\
  简单元素或相互嵌套的数组\n允许从嵌套数组构建一个简单数组。\n\nLivreGougeon 第 160 页 2006 年 11 月 28 日 周二 4:23\
  \ 16\n**JavaScript 库基础**\n**160**\n\n*第二部分*\n\n由于 JavaScript 将对象视为关联数组，因此适用于这些数组的\
  \ 7.6 函数可以与对象配合。\n\n`dojo.lang.isEmpty` 函数判断参数中的数组是否包含元素，如下代码所示：\n\n```javascript\n\
  var monTableau1 = [ \"élément1\",\"élément2\",\"élément3\" ]; var monTableau2 =\
  \ [];\nvar tableau1Vide = dojo.lang.isEmpty(monTableau1);\n// tableau1Vide 包含 false\n\
  var tableau2Vide = dojo.lang.isEmpty(monTableau2);\n// tableau2Vide 包含 true\n```\n\
  \n该函数可以与关联数组一起使用，如下所示：\n\n```javascript\ndojo.require(\"dojo.lang.*\");\nvar monTableauAssociatif1\
  \ = { \"clé1\": \"valeur1\" };\nvar monTableauAssociatif2 = {};\nvar tableauAssociatif1Vide\
  \ = dojo.lang.isEmpty(monTableauAssociatif1);\n// tableauAssociatif1Vide 包含 false\n\
  var tableauAssociatif2Vide = dojo.lang.isEmpty(monTableauAssociatif2);\n// tableauAssociatif2Vide\
  \ 包含 true\n```\n\n`dojo.lang.forEach` 函数允许通过回调函数遍历数组。该函数在循环的每次迭代中被调用，传入当前元素、其索引以及所遍历的数组。\n\
  \n以下代码描述了该函数的实现：\n\n```javascript\nvar monTableau = [ \"élément1\",\"élément2\"\
  ,\"élément3\" ]; dojo.lang.forEach(monTableau, function(element, indice, tableau)\
  \ {\n  alert(indice+\" : \"+element);\n});\n```\n\n上面的示例显示了不同的元素及其对应的索引：\"élément1\"\
  \ 为 0，\"élement2\" 为 1，\"élément3\" 为 2。\n\n还提供了多个函数来测试元素是否存在于数组中。例如下文所示的类似函数 `dojo.lang.has`\
  \ 以及 `dojo.lang.inArray`：\n\n```javascript\nvar monTableau = [ \"élément1\",\"élément2\"\
  ,\"élément3\" ]; var indiceElement = dojo.lang.has(\"élément2\");\n```\n\n`dojo.lang.find`\
  \ 和 `dojo.lang.findLast` 查找数组中第一个与参数指定值匹配的元素的索引。这两个函数分别从头到尾和反之地遍历数组。\n\n它们接收数组和要查找的元素作为参数。第三个参数允许通过基于\
  \ `===` 运算符来指定元素比较是否是严格的（不进行类型转换）。如果没有找到任何元素，则返回值为 -1。\n\nLivreGougeon 第 161 页 2006\
  \ 年 11 月 28 日 周二 4:23 161\n**dojo 库基础**\n**161**\n\n*第 7 章*\n\n以下代码描述了这些函数的实现：\n\
  \n```javascript\nvar monTableau = [ \"élément\",\"élément2\",\"élément\" ];\nvar\
  \ indiceElement1 = dojo.lang.find(\"élément\");\n// indiceElement1 包含 0\nvar indiceElement2\
  \ = dojo.lang.findLast(\"élément\");\n// indiceElement2 包含 2\n```\n\n`dojo.lang.indexOf`\
  \ 和 `dojo.lang.lastIndexOf` 函数与上述描述对应。\n\n`dojo.lang.some` 和 `dojo.lang.every` 函数允许判断数组元素是否符合某个标准。该标准通过传递参数的回调函数实现。\n\
  \n这些函数的机制是遍历数组，并对每个元素调用回调函数。在 `dojo.lang.some` 函数的情况下，如果数组中至少有一个元素的回调函数返回值为 `true`，则返回\
  \ `true`。这样，数组中至少有一个元素符合标准。\n\n以下代码描述了 `dojo.lang.some` 函数的实现：\n\n```javascript\n\
  var monTableau = [ \"élément\",\"élément2\",\"élément\" ];\nvar retourSome = dojo.lang.some(monTableau,\
  \ function(element, indice, tableau) {\n  if( element==\"élément\" ) {\n    return\
  \ true;\n  } else {\n    return false;\n  }\n});\n// retourSome 包含 true\n```\n\n\
  变量 `retourSome` 的值为 `true`。如果数组中没有值为 \"élément\" 的元素，则该变量的值为 `false`。\n\n在 `dojo.lang.every`\
  \ 函数的情况下，如果数组中所有元素的回调函数返回均为 `true`，则返回 `true`。这样，数组中的所有元素都符合标准。\n\n以下代码描述了 `dojo.lang.every`\
  \ 函数的实现：\n\n```javascript\nvar monTableau = [ \"élément\",\"élément2\",\"élément\"\
  \ ];\nvar retourEvery = dojo.lang.every(monTableau, function(element, indice, tableau)\
  \ {\n  if( element==\"élément\" ) {\n    return true;\n  } else {\n    return false;\n\
  \  }\n});\n// retourEvery 包含 true\n```\n\n变量 `retourEvery` 的值为 `true`。如果数组中包含一个值不是\
  \ \"élément\" 的元素，则该变量的值为 `false`。\n\n\n\n\n关联数组中存在的所有方法都会被添加到类的原型上，因此被该类的所有实例共享。\n\
  \n### 类初始化\n\n`dojo` 支持构造函数概念，我们称之为*初始化器*（initializer），其目标是初始化特定于实例的元素。初始化器可以通过初始化函数或通过名为\
  \ `initializer` 的类方法来实现。\n\n这些方法的目的是允许对类的实例特定元素（如属性）进行初始化。\n\n上一节中描述的关联数组不应用于初始化实例特定元素（如属性）。相反，它可以用于实现静态属性，即所有实例共享的属性，如下代码所示：\n\
  \n```javascript\ndojo.lang.declare(\"lang.StringBuffer\", null, {\n  attributStatique:\
  \ \"valeur\"\n});\n\nvar sb1 = new lang.StringBuffer();\nvar sb2 = new lang.StringBuffer();\n\
  sb1.attributStatique = \"autre valeur\";\n\n/* sb1.attributStatique 和 sb2.attributStatique\
  \ 都包含值“autre valeur” */\n```\n\n第一种方法简单地在名为 `initializer` 的方法中（标记为 ❶）指定初始化处理，如下代码所示：\n\
  \n```javascript\ndojo.lang.declare(\"lang.StringBuffer\", null, {\n  initializer:\
  \ function(chaine) { // ❶\n    this.chainesInternes.push(chaine);\n  },\n  chainesInternes:\
  \ [],\n  append: function(chaine) {\n    this.chainesInternes.push(chaine);\n  },\n\
  \  clear: function() {\n    this.chainesInternes.splice(0, this.chainesInternes.length);\n\
  \  },\n  toString: function() {\n    this.chainesInternes.join(\"\");\n  }\n});\n\
  ```\n\n第二种方法基于初始化函数（标记为 ❶），使用了 `dojo.declare` 方法的第二个参数，如下代码所示：\n\n```javascript\n\
  dojo.lang.declare(\"lang.StringBuffer\", null, function(chaine) { // ❶\n  this.chainesInternes\
  \ = [];\n  this.chainesInternes.push(chaine);\n}, {\n  append: function(chaine)\
  \ {\n    this.chainesInternes.push(chaine);\n  },\n  clear: function() {\n    this.chainesInternes.splice(0,\
  \ this.chainesInternes.length);\n  },\n  toString: function() {\n    this.chainesInternes.join(\"\
  \");\n  }\n});\n```\n\n### 继承支持\n\n`dojo.declare` 方法允许其第二个参数来实现继承。\n\n下面的代码描述了基于该方法实现的\
  \ `StringBuffer` 类（标记为 ❶）及其子类 `ExtendedStringBuffer`（标记为 ❷）：\n\n```javascript\n\
  dojo.lang.declare(\"lang.StringBuffer\", null, { // ❶\n  initializer: function(args)\
  \ {\n    this.chainesInternes = [];\n  },\n  append: function(chaine) {\n    this.chainesInternes.push(chaine);\n\
  \  },\n  clear: function() {\n    this.chainesInternes.splice(0, this.chainesInternes.length);\n\
  \  },\n  toString: function() {\n    return this.chainesInternes.join(\"\");\n \
  \ }\n});\n\ndojo.lang.declare(\"lang.ExtendedStringBuffer\", lang.StringBuffer,\
  \ { // ❷\n  initializer: function() {\n  },\n  append: function(chaine) {\n    this.chainesInternes.push(\"\
  tests: \"+chaine);\n  },\n});\n```\n\n`dojo.declare` 方法提供了分别管理当前类方法以及父类方法的能力。因此可以通过\
  \ `this.inherited` 方法（标记为 ❶）调用父类方法，如下代码所示：\n\n```javascript\ndojo.lang.declare(\"\
  java.lang.ExtendedStringBuffer\", java.lang.StringBuffer, {\n  initializer: function()\
  \ {\n  },\n  append: function(chaine) {\n    this.inherited(\"append\",chaine);\
  \ // ❶\n  },\n});\n```\n\n当调用 `ExtendedStringBuffer` 类的构造函数时，两个类的 `initializer`\
  \ 方法会被连续调用。\n\n### 字符串及其派生类型\n\n`dojo` 提供了管理字符串及其派生支持。这些包括字符串本身（使用 `dojo.string`\
  \ 模块）、日期（使用 `dojo.date` 模块）以及正则表达式（使用 `dojo.regexp` 模块）。\n\n#### 字符串\n\n提供字符串操作函数的\
  \ `dojo` 模块是 `dojo.string`。在该模块中，函数名带有 `dojo.string` 前缀。\n\n| 函数 | 参数 | 描述 |\n|\
  \ :--- | :--- | :--- |\n| `capitalize` | - | 将字符串中每个单词的首字母大大写。 |\n| `endsWith` |\
  \ - | 判断字符串末尾是否与参数指定的字符串匹配。一个标志位可以指定比较是否区分大小写。 |\n| `has` | - | 判断传入参数的字符串集合是否包含在字符串中。\
  \ |\n| `isBlank` | - | 如果字符串仅由空格组成则返回 `true`，否则返回 `false`。 |\n| `normalize` | -\
  \ | 根据代表换行符的字符串统一字符串中所有的换行符。 |\n| `pad` | - | 在字符串前或后添加指定的字符，以达到参数指定的指定字符串长度。如果未指定字符，则使用字符\
  \ 0。添加方向可以是 1 表示在字符串开头添加（默认），-1 表示在字符串末尾添加。 |\n| `padLeft` | - | 在字符串前添加指定的字符，以达到参数指定的指定字符串长度。如果未指定字符，则使用字符\
  \ 0。 |\n| `padRight` | - | 在字符串后添加指定的字符，以达到参数指定的指定字符串长度。如果未指定字符，则使用字符 0。 |\n| `repeat`\
  \ | - | 通过重复指定次数的字符串来构建字符串。可以使用分隔符来分隔重复的字符串。 |\n| `startsWith` | - | 判断字符串开头是否与参数指定的字符串匹配。一个标志位可以指定比较是否区分大小写。\
  \ |\n| `escape` | - | 为指定的内容类型转换并编码字符串。支持的类型包括用于 HTML 语言的 `html`、`xhtml` 用于 XHTML\
  \ 语言、`sql` 用于 SQL 语言、`regexp` 用于正则表达式、`js` 用于 JavaScript 以及 `ascii` 用于 ASCII 编码。\
  \ |\n\n\n\n\n\n确定字符串的开头是否匹配参数指定的比较字符串列表中的一个。\n\n# JavaScript 库基础\n## 第二部分 - 166\n\
  \n### 表 7.7 `dojo.string` 模块函数（续）\n\n| 函数 | 参数 | 说明 |\n| :--- | :--- | :--- |\n\
  | `dojo.string.summary` | 字符串和长度 | 如果参数字符串超过了指定的长度，则构建一个以“…”结尾的子字符串。否则，返回该字符串本身。\
  \ |\n| `dojo.string.trim` | 字符串 | 移除参数字符串周围的空格。 |\n| `dojo.string.trimEnd` | 字符串\
  \ | 移除参数字符串末尾的空格。 |\n| `dojo.string.trimStart` | 字符串 | 移除参数字符串开头的空格。 |\n\n第一组函数提供了检查字符串是否符合某个条件的功能。例如\
  \ `dojo.string.startsWith`、`dojo.string.startsWithAny`、`dojo.string.endsWith` 和\
  \ `dojo.string.endsWithAny` 函数，它们分别用于确定字符串是否以另一个字符串开始或结束。\n\n以下代码描述了前两个函数的实现，而后两个函数的用法相同：\n\
  \n```javascript\nvar chaine1 = \"Ceci est une chaîne de test\";\nvar chaine2 = \"\
  Une autre chaîne de test\";\nvar test1Chaine1 = dojo.string.startsWith(chaine1,\
  \ \"Ceci\");\n// test1Chaine1 包含值 true\nvar test2Chaine1 = dojo.string.startsWithAny(chaine1,\
  \ \"Test\", \"Ceci\", \"Un\");\n// test2Chaine1 包含值 true\nvar test1Chaine2 = dojo.string.startsWith(chaine2,\
  \ \"Ceci\");\n// test1Chaine2 包含值 false\nvar test2Chaine2 = dojo.string.startsWithAny(chaine2,\
  \ \"Test\", \"Ceci\", \"Un\");\n// test2Chaine2 包含值 true\n```\n\n`dojo.string.has`\
  \ 函数确定一个字符串是否包含在另一个中，如下代码所示：\n\n```javascript\nvar chaine1 = \"Ceci est une chaîne\
  \ de test\";\nvar chaine2 = \"Une autre chaîne de test\";\nvar testChaine1 = dojo.string.has(chaine1,\
  \ \"Ceci\");\n// testChaine1 包含值 true\nvar test1Chaine2 = dojo.string.has(chaine2,\
  \ \"test\");\n// test1Chaine2 包含值 true\nvar test2Chaine2 = dojo.string.has(chaine2,\
  \ \"Test\");\n// test2Chaine2 包含值 false\n```\n\n# dojo 库基础\n## 167\n### 第 7 章\n\n\
  另一组函数提供了对字符串进行操作的可能性。特别是 `dojo.string.trim` 及其变体，用于移除字符串“周围”的空格；以及 `dojo.string.pad`\
  \ 及其变体，用于在字符串前后添加相同数量的字符。\n\n以下代码描述了 `dojo.string.trim` 函数的实现，用于移除字符串开头和结尾的空格：\n\
  \n```javascript\nvar chaine = \" Ceci est une chaîne de caractères \";\nvar nouvelleChaine\
  \ = dojo.string.trim(chaine);\n/* nouvelleChaine 包含字符串“Ceci est une chaîne de caractères”\
  \ */\n```\n\n以下代码描述了 `dojo.string.pad` 函数的实现，用于在字符串开头和结尾添加三个空格：\n\n```javascript\n\
  var chaine = \"Ceci est une chaîne de caractères\";\nvar chainePad = dojo.string.pad(chaine,\
  \ chaine.length+3, \" \", 1);\nchainePad = dojo.string.pad(chainePad, chainePad.length+3,\
  \ \" \", -1);\n/* chainePad 包含字符串“Ceci est une chaîne de caractères” */\n```\n\n\
  `dojo.string.capitalize` 函数允许将字符串中单词的首字母大写化，如下代码所示：\n\n```javascript\nvar chaine\
  \ = \"Ceci est une chaîne de caractères\";\nvar chaineCapitalisee = dojo.string.capitalize(chaine);\n\
  /* chaineCapitalisee 包含字符串“Ceci Est Une Chaîne De Caractères” */\n```\n\n`dojo`\
  \ 还提供了 `dojo.string.Builder` 类来构建字符串。该类等同于 Java 语言提供的 `StringBuffer` 类。\n\n以下代码描述了该类的实现：\n\
  \n```javascript\nvar builder = new dojo.string.Builder();\nbuilder.append(\"Ceci\
  \ est\");\nbuilder.append(\" une chaîne de test\");\nvar chaine = builder.toString();\n\
  /* chaine 包含字符串“Ceci est une chaîne de test” */\n```\n\n## 日期\n提供日期处理函数的 dojo 模块是\
  \ `dojo.date`。在该模块中，函数名称带有 `dojo.date` 前缀。表 7.8 汇总了该模块的主要函数。\n\n# JavaScript 库基础\n\
  ## 168 - 第二部分\n\n### 表 7.8 `dojo.date` 模块主要函数\n\n| 函数 | 参数 | 说明 |\n| :--- | :---\
  \ | :--- |\n| `dojo.date.add` | 日期、单位和数量 | 为日期添加一段时间。所选单位可以指定该时间是以秒、分钟、小时、天还是月表示。\
  \ |\n| `dojo.date.compare` | 两个日期和一个比较选项 | 比较两个日期。选项可以指定比较是仅针对日期、时间还是两者。 |\n| `dojo.date.format`\
  \ | 日期和格式 | 根据格式将日期转换为字符串。 |\n| `dojo.date.getDayName` | 日期 | 返回指定日期的星期几名称。 |\n\
  | `dojo.date.getDayShortName` | 日期 | 返回指定日期的星期几缩写名称。 |\n| `dojo.date.getDaysInMonth`\
  \ | 日期 | 返回指定日期所在月份的天数。 |\n| `dojo.date.getMonthName` | 日期 | 返回指定日期的月份名称。 |\n| `dojo.date.getMonthShortName`\
  \ | 日期 | 返回指定日期的月份缩写名称。 |\n| `dojo.date.getTimezoneName` | 日期 | 返回指定日期的时区名称。 |\n\
  | `dojo.date.getWeekOfYear` | 日期和可能的年初第一 | 返回指定日期在年份中的周数。 |\n| `dojo.date.isLeapYear`\
  \ | 日期 | 确定指定日期年份是否为闰年。 |\n| `dojo.date.setDayOfYear` | 日期和数字 | 设置并返回指定日期在年份中的天数。\
  \ |\n| `dojo.date.toRelativeString` | 日期 | 确定当前日期与指定日期之间的差距。 |\n\n表 7.8 中的主要函数可分为两组。第一组允许获取和设置日期信息。第二组对应于日期处理、测试和格式化的函数。\n\
  \n`dojo.date.isLeapYear` 函数允许确定日期的年份是否为闰年，如下所示：\n\n```javascript\nvar date1 = new\
  \ Date();\ndate1.setYear(2006);\nvar date1Bissextile = dojo.date.isLeapYear(date1);\n\
  /* date1Bissextile 包含 false 因为 2006 年不是闰年 */\n\nvar date2 = new Date();\ndate2.setYear(2007);\n\
  var date2Bissextile = dojo.date.isLeapYear(date2);\n/* date2Bissextile 包含 false\
  \ 因为 2007 年不是闰年 */\n\nvar date3 = new Date();\ndate3.setYear(2008);\nvar date3Bissextile\
  \ = dojo.date.isLeapYear(date3);\n/* date3Bissextile 包含 true 因为 2008 年是闰年 */\n```\n\
  \n## 169\n### 第 7 章\n`dojo.date.format` 函数提供了根据格式将日期转换为字符串的可能性。该格式使用不同的元素来指定日期元素在字符串中的位置。\n\
  \n\n\n\n\nLe tableau 7.9 récapitule les principaux de ces éléments.\n\n### Tableau\
  \ 7.9 Éléments du format de date de la fonction `dojo.date.format`\n\n| Élément\
  \ | Description |\n| :--- | :--- |\n| `%a` et `%A` | Correspond aux noms abrégé\
  \ et complet du jour pour le paramètre de localisation. |\n| `%b` et `%B` | Correspond\
  \ aux noms abrégé et complet du mois pour le paramètre de localisation. |\n| `%d`\
  \ | Correspond au jour dans le mois courant. |\n| `%H` et `%I` | Correspond à l’heure\
  \ courante, respectivement sur 24 heures et 12 heures. |\n| `%j` | Correspond au\
  \ numéro du jour de l’année courante. |\n| `%m` | Correspond au numéro du mois de\
  \ l’année courante. |\n| `%M` | Correspond à la minute courante. |\n| `%S` | Correspond\
  \ à la seconde courante. |\n| `%y` | Correspond à l’année sur quatre caractères.\
  \ |\n\nLe code suivant décrit la mise en œuvre de cette fonction de formatage de\
  \ dates :\n\n```javascript\n// Définition de la date: 10/09/2006 à 12h30min30s\n\
  var date = new Date();\ndate.setFullYear(2006);\ndate.setMonth(08);\ndate.setDate(10);\n\
  date.setHours(12);\ndate.setMinutes(30);\ndate.setSeconds(30);\nvar format = \"\
  %d/%m/%y, %H:%M:%S\";\nvar chaineDate = dojo.date.format(date,format);\n// chaineDate\
  \ contient la valeur « 10/09/2006, 12:30:30 »\n```\n\nLa fonction `dojo.date.compare`\
  \ permet de comparer deux dates. Elle renvoie la valeur 0 si les deux dates sont\
  \ égales, 1 si la première est supérieure à la seconde et -1 dans le cas contraire.\
  \ Elle offre en outre la possibilité d’utiliser une option de comparaison afin de\
  \ spécifier le type de comparaison : comparaison des dates ou des heures uniquement\
  \ ou des deux.\n\nLe code suivant décrit la mise en œuvre de cette fonction :\n\n\
  ```javascript\n/* date1 correspond à la date courante dont la valeur des heures\
  \ est 0 */\nvar date1=new Date();\ndate1.setHours(0);\n\n/* date2 correspond à la\
  \ date courante dont les valeurs de l’année et des heures\nsont respectivement 2005\
  \ et 12 */\nvar date2=new Date();\ndate2.setFullYear(2005);\ndate2.setHours(12);\n\
  \nvar comparaison1 = dojo.date.compare(date1, date1);\n/* comparaison1 contient\
  \ 0 car les dates sont égales */\n\nvar comparaison2 = dojo.date.compare(date1,\
  \ date2, dojo.date.compareTypes.DATE);\n/* comparaison2 contient 1 car la date de\
  \ date1 est supérieure\nà celle de date2 */\n\nvar comparaison3 = dojo.date.compare(date2,\
  \ date1, dojo.date.compareTypes.DATE);\n/* comparaison3 contient -1 (test inverse)\
  \ */\n\nvar comparaison4 = dojo.date.compare(date1, date2, dojo.date.compareTypes.TIME);\n\
  /* comparaison4 contient -1 car l’heure de date1 est inférieure à\ncelle de date2\
  \ */\n\nvar comparaison5 = dojo.date.compare(date1, date2, dojo.date.compareTypes.DATE|dojo.date.compareTypes.TIME);\n\
  /* comparaison5 contient 1 (test inverse) */\n```\n\nLa fonction `dojo.date.add`\
  \ offre la possibilité d’ajouter une période à une date. Elle est très pratique\
  \ pour déterminer la date obtenue après un nombre de jours, par exemple.\n\nCette\
  \ période peut être spécifiée en jours, comme dans le code suivant：\n\n```javascript\n\
  // Définition de la date: 29/09/2006 à 12h30min30s\nvar date = new Date();\ndate.setFullYear(2006);\n\
  date.setMonth(08);\ndate.setDate(29);\ndate.setHours(12);\ndate.setMinutes(30);\n\
  date.setSeconds(30);\nvar dateObtenue = dojo.date.add(date, dojo.date.dateParts.DAY,\
  \ 5);\n// dateObtenue correspond à la date: 04/10/2006 à 12h30min30s\n```\n\nLa\
  \ fonction `dojo.date.add` se fonde sur la structure `dojo.date.dateParts` afin\
  \ de définir l’unité de temps de la période ajoutée. Cette structure inclut l’année,\
  \ le mois, le jour, l’heure, la minute, la seconde et la milliseconde.\n\n### Expressions\
  \ régulières\n\nLe module `dojo.regexp` de dojo fournit des fonctions implémentant\
  \ diverses expressions régulières afin de vérifier suivant des critères précis et\
  \ de formater une chaîne de caractères passée en paramètre. Dans ce module, les\
  \ noms des fonctions sont préfixés par `dojo.regexp`.\n\nLe tableau 7.10 récapitule\
  \ ces différentes fonctions.\n\n### Tableau 7.10 Fonctions du module `dojo.regexp`\n\
  \n| Fonction | Paramètre | Description |\n| :--- | :--- | :--- |\n| `currency` |\
  \ Un objet | Retourne une valeur monétaire. |\n| `emailAddress` | Un objet | Vérifie\
  \ une adresse d'e-mail valide. |\n| `emailAddressList` | Un objet | Vérifie une\
  \ liste d'adresses d'e-mail. |\n| `host` | Un objet | Vérifie un nom d'hôte valide.\
  \ |\n| `integer` | Un objet | Vérifie si la chaîne est un nombre entier. |\n| `ipaddress`\
  \ | Un objet | Vérifie une adresse IP valide. |\n| `numberFormat` | Un objet | Vérifie\
  \ le format de nombre. |\n| `realNumber` | Un objet | Vérifie si la chaîne est un\
  \ nombre réel. |\n| `time` | Un objet | Vérifie le format de l'heure. |\n| `url`\
  \ | Un objet | Vérifie une URL valide. |\n| `us.state` | Un objet | Vérifie l'abréviation\
  \ d'un État des États-Unis. |\n\nUn premier ensemble de fonctions se fondent sur\
  \ un objet de configuration spécifiant différentes options afin de créer les expressions\
  \ régulières. C’est le cas des fonctions `dojo.regexp.emailAddress` et `dojo.regexp.emailAddressList`,\
  \ qui vérifient la validité d’adresses e-mail.\n\nLe code suivant décrit leur mise\
  \ en œuvre :\n\n```javascript\n// Vérification d’adresses email\nvar chaineEmail1\
  \ = \"email@eyrolles.com\";\nvar chaineEmail2 = \"email_eyrolles.com\"\nvar reAdresseEmail\
  \ = new RegExp(dojo.regexp.emailAddress());\nvar chaineEmail1Correcte = reAdresseEmail.test(chaineEmail1);\n\
  // chaineEmail1Correcte contient la valeur true\nvar chaineEmail2Correcte = reAdresseEmail.test(chaineEmail2);\n\
  // chaineEmail2Correcte contient la valeur false\n\n// Vérification de listes d’adresses\
  \ email\nvar chaineListeEmail1 = \"email@eyrolles.com,email1@eyrolles.com\";\nvar\
  \ chaineListeEmail2 = \"email_eyrolles.com,email1_eyrollescom\"\nvar reListeAdresseEmail\
  \ = new RegExp(dojo.regexp.emailAddressList());\nvar chaineEmail1Correcte = reListeAdresseEmail.test(chaineListeEmail1);\n\
  // chaineEmail1Correcte contient la valeur true\nvar chaineEmail2Correcte = reListeAdresseEmail.test(chaineEmail2);\
  \ // Note: correction de variable cohérente avec le texte original\n```\n\nUn autre\
  \ ensemble se fondent sur des formats afin de vérifier le format d’une chaîne de\
  \ caractères. Les fonctions de ce type offrent la possibilité de vérifier le format\
  \ de chaînes utilisant des nombres, telles que les heures et les numéros de téléphone.\n\
  \nLa première vérification est mise en œuvre par la fonction `dojo.regexp.time`.\
  \ Un format doit être spécifié en paramètre, format se fondant sur les éléments\
  \ récapitulés au tableau 7.11.\n\n### Tableau 7.11 Éléments du format de la fonction\
  \ `dojo.regexp.time`\n\n| Élément | Description |\n| :--- | :--- |\n| `h` | Correspond\
  \ à la valeur des heures de 0 à 12. Cette valeur n’est pas précédée de zéro dans\
  \ le cas d’une valeur inférieure à 10. |\n| `H` | |\n\n\n\n\n对应 0 到 24 之间的小时值。当值小于\
  \ 10 时，该值前面不前导零。\n\n`hh`\n\n对应 0 到 12 之间的小时值。当值小于 10 时，该值必须前导零。\n\n`HH`\n\n对应 0\
  \ 到 24 之间的小时值。当值小于 10 时，该值必须前导零。\n\n`m`\n\n对应分钟值。当值小于 10 时，该值前面不前导零。\n\n`mm`\n\n\
  对应分钟值。当值小于 10 时，该值必须前导零。\n\n`s`\n\n对应秒值。当值小于 10 时，该值前面不前导零。\n\n`ss`\n\n对应秒值。当值小于\
  \ 10 时，该值必须前导零。\n\n`t`\n\n对应大写或小写的“AM”或“PM”。\n\n第二次检查基于 `dojo.regexp.numberFormat`\
  \ 函数，该函数通过通过参数传递的格式使用字符 `#` 来指定数字在待检查字符串中的位置。也可以使用字符 `?` 来指定可选的数字。因此，格式可以如下所示：`var\
  \ format1 = \"(+###) ## ## ## ## ##\";`\n\n```javascript\n// 对于带有区区的电话号码： (+033)\
  \ 01 02 03 04 05\nvar format2 = \"###-######\";\n\n// 对于类型为：342-54303 的字符串\nvar\
  \ format3 = \"### ##### ##???\";\n\n// 对于类型为 435 58394 455 或 435 58394 45532 的字符串\n\
  ```\n\n以下代码描述了 `dojo.regexp.time`（标记 ❶）和 `dojo.regexp.numberFormat`（标记 ❷）函数的实现：\n\
  \n```javascript\nvar chaineHeureCorrecte = \"13:45:22\";\nvar chaineHeureIncorrecte\
  \ = \"1:45:22 PM\";\n\nvar reHeure = new RegExp(dojo.regexp.time({ ❶\n  format:\
  \ \"HH:mm:ss\"\n}));\n\nvar heureCorrecte = reHeure.test(chaineHeureCorrecte);\n\
  // heureCorrecte 包含值 true\n\nvar heureIncorrecte = reHeure.test(chaineHeureIncorrecte);\n\
  // heureIncorrecte 包含值 false\n\nvar chaineNombre = \"4353-756398\";\nvar reChaineNombre\
  \ = new RegExp(dojo.regexp.numberFormat({ ❷\n  format: \"####-######\"\n}));\n\n\
  var chaineNombreCorrecte = reChaineNombre.test(chaineNombre);\n// chaineNombreCorrecte\
  \ 包含值 true\n```\n\n# dojo 库基础\n\n## 集合支持\n\n`dojo` 实现了不同类型的集合，以便实现高级数据结构，如列表、树、队列、栈和哈希表。本节详细介绍了由\
  \ `dojo` 提供的主要集合以及 `dojo` 用于遍历这些集合的支持。\n\n### 基础集合\n\n`dojo` 库通过 `dojo.collections.ArrayList`\
  \ 和 `dojo.collections.Dictionnary` 等类实现了不同的列表和哈希表实现。\n\n第一个实现了一个非排序列表，类似于 Java 提供的\
  \ `ArrayList` 类。它提供了多种方法来插入和删除元素、查找元素以及遍历列表。表 7.12 总结了 `dojo.collections.ArrayList`\
  \ 类的各种方法。\n\n#### 表 7.12 `dojo.collections.ArrayList` 类方法\n\n| 方法 | 参数 | 描述 |\n\
  | :--- | :--- | :--- |\n| `add` | 要添加的元素 | 向列表中添加一个元素。 |\n| `addRange` | 包含元素的数组\
  \ | 向列表中添加一个元素列表。 |\n| `clear` | - | 移除列表中包含的所有元素。 |\n| `clone` | - | 返回列表的副本。 |\n\
  | `contains` | 要查找的元素 | 确定参数元素是否包含在列表中。 |\n| `forEach` | 回调函数以及可选的执行上下文 | 允许基于回调函数遍历集合。该函数必须接收当前元素、其索引以及一个表示列表的数组作为参数。\
  \ |\n| `getIterator` | - | 返回一个迭代器以遍历列表。 |\n| `indexOf` | 元素 | 返回参数元素在列表中的位置。如果不存在，则返回值\
  \ `-1`。 |\n| `insert` | 元素以及插入索引 | 在给定位置插入一个元素。 |\n| `item` | 索引 | 返回与参数指定位置对应的元素。\
  \ |\n| `remove` | 元素 | 从列表中移除参数的元素。 |\n| `removeAt` | 索引 | 从列表中移除索引为参数传递的元素。 |\n\
  | `reverse` | - | 反转列表元素的顺序。 |\n| `setByIndex` | 索引和元素 | 在列表的指定索引处插入一个元素。 |\n| `sort`\
  \ | - | 对列表的元素进行排序。 |\n| `toArray` | - | 将列表转换为数组。 |\n| `toString` | 无或分隔符 | 返回列表的字符串形式的表示形式。\
  \ |\n\n以下代码描述了如何使用此类来创建列表、添加元素并遍历其内容：\n\n```javascript\nvar liste = new dojo.collections.ArrayList();\n\
  liste.add(\"élément1\");\nliste.add(\"élément3\");\nliste.setByIndex(1, \"élément2\"\
  );\n\n// 显示上面插入的列表不同元素\nliste.forEach(function(element, indice, tableau) {\n  alert(indice+\"\
  : \"+element);\n});\n```\n\n在上述代码中，`element` 包含遍历列表时当前元素的值，而 `indice` 是一个与其位置对应的整数。\n\
  \n第二个类对应于哈希表，即键-值对。它提供了多种方法来插入和删除元素、查找元素以及遍历表。表 7.13 总结了 `dojo.collections.Dictionary`\
  \ 类的各种方法。\n\n#### 表 7.13 `dojo.collections.Dictionary` 类方法\n\n| 方法 | 参数 | 描述 |\n\
  | :--- | :--- | :--- |\n| `add` | 键和值 | 在哈希表中添加一个键及其对应的值。 |\n| `clear` | - | 移除哈希表中包含的所有元素。\
  \ |\n| `clone` | - | 返回哈希表的副本。 |\n| `contains` | 键 | 确定表中是否包含参数指定的键。 |\n| `containsValue`\
  \ | 值 | 确定表中是否包含参数指定的值。 |\n| `entry` | 键 | 返回与参数键对应的包含键和值的条目。 |\n| `forEach` | 回调函数以及可选的执行上下文\
  \ | 允许基于回调函数遍历集合。该函数必须接收当前元素、其索引以及一个表示列表的数组作为参数。 |\n| `getIterator` | - | 返回一个迭代器以遍历哈希表。\
  \ |\n| `getKeyList` | - | 返回哈希表的键列表。 |\n| `getValueList` | - | 返回哈希表的值列表。 |\n| `remove`\
  \ | 键 | 根据键从哈希表中移除元素。 |\n| `item` | 键 | 返回表中与参数键对应的值。 |\n\n以下代码描述了如何使用此类来创建哈希表、添加元素并遍历其内容：\n\
  \n```javascript\nvar tableHachage = new dojo.collections.Dictionary();\ntableHachage.add(\"\
  clé1\", \"élément1\");\ntableHachage.add(\"clé2\", \"élément2\");\n```\n\n\n\n\n\
  \n```javascript\ntableHachage.add(\"clé3\", \"élément3\");\n\nvar listeCles = tableHachage.getKeyList();\n\
  \n/* listeCles correspond au tableau [ \"clé1\", \"clé2\", \"clé2\" ] */\n\nvar\
  \ listeValeurs = tableHachage.getValueList();\n\n/* listeValeurs correspond au tableau\
  \ [ \"élément1\", \" élément2\", \" élément3\" ] */\n\n// Affiche les différents\
  \ éléments de la table, insérés ci-dessus\n\ntableHachage.forEach(function(element,\
  \ indice, tableau) {\n\nalert(indice+\": \"+element.key+\", \"+element.value);\n\
  \n});\n```\n\n在上述代码中，`element` 包含了哈希表在遍历过程中当前元素的键-值对（分别对应 `key` 和 `value` 属性），而\
  \ `indice` 是一个对应其位置的整数。\n\n我们将在本章的后部分看到，这些类可以使用迭代器类的支持进行遍历。\n\n# 高级数据结构\n\ndojo\
  \ 提供的高级数据结构对应队列（Queues）、栈（Stacks）、图（Graphs）和二叉树（Binary Trees）。在本节中，我们仅详细介绍前两种结构的实现。\n\
  \n第一种由 `dojo.collections.Queue` 类实现。该结构对应于队列，或称 FIFO（先进先出），第一个添加的元素是第一个弹出的元素。这种结构的实已经在第\
  \ 2 节中基于 JavaScript 数组讨论过。\n\n表 7.14 总结了 `dojo.collections.Queue` 类的方法。\n\n## 表\
  \ 7.14 `dojo.collections.Queue` 类的方法\n\n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n\
  | `clear` | - | 删除队列中包含的所有元素。 |\n| `clone` | - | 返回队列的副本。 |\n| `contains` | 一个值\
  \ | 确定队列中是否包含指定键的元素。 |\n| `copyTo` | 一个数组和一个索引 | 从指定位置将传入参数的数组内容复制到队列中。 |\n| `dequeue`\
  \ | - | 返回队列的下一个元素并从队列中删除。 |\n| `enqueue` | 一个元素 | 在队列末尾添加一个元素。 |\n| `forEach` |\
  \ 回调函数 | 允许根据回调函数以及可选的执行上下文遍历集合。该函数必须接收当前元素、其索引、执行上下文以及一个表示列表的数组作为参数。 |\n| `getIterator`\
  \ | - | 返回用于遍历队列的迭代器。 |\n| `peek` | - | 返回队列的下一个元素而不修改其内容。 |\n| `toArray` | - |\
  \ 返回列表的数组形式表示。 |\n\n以下代码描述了该类的实现，以便基于队列处理数据：\n\n```javascript\nvar queue = new dojo.collections.Queue();\n\
  \nqueue.enqueue(\"élément1\");\n\nqueue.enqueue(\"élément2\");\n\nqueue.enqueue(\"\
  élément3\");\n\nvar premierElementSansRetrait = queue.peek();\n\n// premierElementSansRetrait\
  \ 包含值 \"élément1\"\n\nvar elementExtrait = queue.dequeue();\n\n// elementExtrait\
  \ 包含值 \"élément1\"\n\nelementExtrait = queue.dequeue();\n\n// elementExtrait 包含值\
  \ \"élément2\"\n\nelementExtrait = queue.dequeue();\n\n// elementExtrait 包含值 \"\
  élément3\"\n```\n\n第二种结构由 `dojo.collections.Stack` 类实现。它对应于栈，或称 LIFO（后进先出），其中最后一个添加的元素是第一个弹出的元素。这种结构的实现同样在第\
  \ 2 节中基于 JavaScript 数组讨论过。\n\n表 7.15 总结了 `dojo.collections.Stack` 类的方法。\n\n## 表\
  \ 7.15 `dojo.collections.Stack` 类的方法\n\n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n\
  | `clear` | - | 删除栈中包含的所有元素。 |\n| `clone` | - | 返回栈的副本。 |\n| `contains` | 一个值 |\
  \ 确定栈中是否包含指定键的元素。 |\n| `copyTo` | 一个数组和一个索引 | 从指定位置将传入参数的数组内容复制到栈中。 |\n| `forEach`\
  \ | 回调函数 | 允许根据回调函数以及可选的执行上下文遍历集合。该函数必须接收当前元素、其索引、执行上下文以及一个表示列表的数组作为参数。 |\n| `getIterator`\
  \ | - | 返回用于遍历栈的迭代器。 |\n| `peek` | - | 返回栈的下一个元素而不修改其内容。 |\n| `pop` | - | 返回栈顶部的下一个元素并从栈中删除。\
  \ |\n| `push` | 一个元素 | 在栈顶添加一个元素。 |\n| `toArray` | - | 返回栈的数组形式表示。 |\n\n以下代码描述了该类的实现，以便基于栈处理数据：\n\
  \n```javascript\nvar pile = new dojo.collections.Stack();\n\npile.push(\"élément1\"\
  );\n\npile.push(\"élément2\");\n\npile.push(\"élément3\");\n\nvar premierElementSansRetrait\
  \ = pile.peek();\n\n// premierElementSansRetrait 包含值 \"élément3\"\n\nvar elementExtrait\
  \ = pile.pop();\n\n// elementExtrait 包含值 \"élément3\"\n\nelementExtrait = pile.pop();\n\
  \n// elementExtrait 包含值 \"élément2\"\n\nelementExtrait = pile.pop();\n\n// elementExtrait\
  \ 包含值 \"élément1\"\n```\n\n# 迭代器\n\ndojo 提供了不同的类来遍历前节描述的集合。这些类对应于迭代器，即可以在集合中逐步移动的实体。\n\
  \n第一个通过 `dojo.collections.Iterator` 类实现，提供了遍历如 `dojo.collections.ArrayList` 和 `dojo.collections.SortedList`\
  \ 等实现的列表的可能性。\n\n表 7.16 总结了该类的可用方法。\n\n## 表 7.16 `dojo.collections.Iterator` 类的方法\n\
  \n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| `atEnd` | - | 确定迭代器是否位于集合遍历的末尾。 |\n\
  | `get` | - | 返回迭代的当前元素。 |\n| `map` | 回调函数 | 根据回调函数以及可选的执行上下文返回一个填充数组。 |\n| `reset`\
  \ | - | 将迭代器重置到集合遍历的开始。 |\n\n以下代码描述了该类的实现，以便遍历基于 `dojo.collections.ArrayList` 的列表：\n\
  \n```javascript\nvar liste = new dojo.collections.ArrayList();\n\nliste.add(\"élément1\"\
  );\n\nliste.add(\"élément2\");\n\nliste.add(\"élément3\");\n\nfor(var iterateur\
  \ = liste.getIterator(); !iterateur.atEnd(); ) {\n\nvar element = iterateur.get();\n\
  \nalert(\"Element: \"+element);\n}\n```\n\ndojo 还提供了 `dojo.collections.DictionaryIterator`\
  \ 类，用于遍历如 `dojo.collections.Dictionary` 类实现的哈希表。它提供了与 `dojo.collections.Iterator`\
  \ 类相同的方法。\n\n该类的 `get` 方法返回的元素现在是一个包含哈希表中条目键和值的结构。该结构是通过 `dojo.collections.DictionaryEntry`\
  \ 类来实现的。\n\n以下代码描述了该类的实现，以便遍历基于 `dojo.collections.Dictionary` 的列表：\n\n```javascript\n\
  var tableHachage = new dojo.collections.Dictionary();\n```\n\n\n\n\n```javascript\n\
  tableHachage.add(\"clé1\", \"élément1\");\ntableHachage.add(\"clé2\", \"élément2\"\
  );\ntableHachage.add(\"clé3\", \"élément3\");\n\n// 显示上面插入的表中的不同元素\n\nfor(var i\
  \ = tableHachage.getIterator(); !i.atEnd(); ) {\n    var element = i.get();\n  \
  \  alert(\"Element: \" + element.key + \", \" + element.value);\n}\n```\n\n```content\n\
  \n## DOM 支持\n\ndojo 库提供了两个函数用于访问 HTML 页面的 DOM 树元素。使用这些函数无需指定任何模块，因为它们属于 dojo 的核心函数。\n\
  \n`dojo.byId` 函数根据标识符（ID）返回一个 DOM 元素。它封装了 HTML 页面 `document` 对象的 `getElementById`\
  \ 方法。\n\n`dojo.byTag` 函数根据标签名返回一个 DOM 元素数组。它封装了 HTML 页面 `document` 对象的 `getElementsByTagName`\
  \ 方法。\n\n为了详细说明 dojo 对 DOM 的支持，我们将在本节中恢复第 4 章使用的示例：\n\n```html\n<div id=\"maZone\"\
  >\n    <span id=\"monTexte\"><b>一段文本</b></span>\n    <div id=\"monAutreZone\">\n\
  \        <p>另一个文本</p>\n    </div>\n</div>\n```\n\n下面的示例描述了基于上述 HTML 片段的 `dojo.byId`\
  \ 和 `dojo.byTag` 函数实现：\n\n```javascript\nvar zone = dojo.byId(\"maZone\");\n// zone\
  \ 包含对第一个标签的引用\n\nvar listeBalises = dojo.byTag(\"div\");\n// listeBalises 包含所有名称为\
  \ div 的不同标签\n```\n\n除了这两个函数外，dojo 还提供了一个通过其 `dojo.dom` 模块操作 Web 页面 DOM 树的支持。该模块提供了一组为此目的常量和函数。\n\
  \n表 7.17 汇总了与 DOM 节点类型相关的主要常量。\n\n### 表 7.17 DOM 节点类型相关的主要常量\n\n| 常量 | 值 | 描述 |\n\
  | :--- | :--- | :--- |\n| `dojo.dom.ELEMENT_NODE` | 1 | 对应元素节点。 |\n| `dojo.dom.ATTRIBUTE_NODE`\
  \ | 2 | 对应属性节点。 |\n| `dojo.dom.TEXT_NODE` | 3 | 对应文本节点。 |\n| `dojo.dom.CDATA_SECTION_NODE`\
  \ | 4 | 对应 CDATA 类型节点。 |\n| `dojo.dom.ENTITY_NODE` | 6 | 对应 XML 实体节点。 |\n| `dojo.dom.COMMENT_NODE`\
  \ | 8 | 对应注释节点。 |\n| `dojo.dom.DOCUMENT_NODE` | 9 | 对应 XML 文档的根节点。 |\n\n该模块还提供了不同的实用函数，以便方便操作\
  \ DOM 元素。表 7.18 汇总了这些函数。\n\n### 表 7.18 DOM 元素操作函数\n\n| 函数 | 参数 | 描述 |\n| :--- |\
  \ :--- | :--- |\n| `dojo.dom.copyChildren` | 源节点、一个目标节点和一个标志位 | 将源标签的所有子元素复制到目标标签。如果第三个参数的值为\
  \ `true`，则删除所有文本类型的子元素。 |\n| `dojo.dom.createDocument` | - | 创建一个文档类型的节点。 |\n| `dojo.dom.createDocumentFromText`\
  \ | - | 创建一个文档类型的节点，并根据字符串中包含的 XML 代码对其初始化。 |\n| `dojo.dom.firstElement` | 节点和一个标签名\
  \ | 返回节点中类型为 `dojo.dom.ELEMENT_NODE` 的第一个子元素。如果指定了标签名，该函数返回第一个匹配的元素。 |\n| `dojo.dom.getAncestors`\
  \ | 节点、一个回调函数和一个标志位 | 通过应用可能的过滤返回节点的父先节点列表。过滤通过回调函数实现。如果未指定，则不进行任何过滤。如果第三个元素的值为\
  \ `true`，则只返回第一个匹配的元素。 |\n| `dojo.dom.getAncestorsByTag` | 节点、标签名和一个标志位 | 返回符合指定标签名的父先节点列表。如果第三个元素的值为\
  \ `true`，则只返回第一个匹配的元素。 |\n| `dojo.dom.getFirstAncestorByTag` | 节点和一个标签名 | 返回符合指定标签名的节点的第一个父节点。\
  \ |\n| `dojo.dom.getUniqueId` | - | 生成一个唯一标识符。 |\n| `dojo.dom.hasParent` | 节点 |\
  \ 确定一个节点是否是另一个节点。 |\n| `dojo.dom.innerXML` | 节点 | 对应 XML 格式的节点内容。 |\n| `dojo.dom.insertAfter`\
  \ | 引用节点、要插入的节点和一个标志位 | 在要插入的引用节点同级且之后添加一个节点。如果参数中的两个节点相等，或者要插入的节点已与引用节点存在，则仅当标志位为\
  \ `true` 时才添加节点。 |\n| `dojo.dom.insertAtIndex` | 要插入的节点、一个节点和一个索引 | 在目标节点的子列表中添加一个节点。如果插入索引的值大于节点子元素的数量，则将其添加到最后位置。\
  \ |\n| `dojo.dom.insertAtPosition` | 引用节点、要插入的节点和位置 | 在与引用节点同级的位置添加一个节点。插入节点的位置取决于位置参数，该参数可以取\
  \ `before`、`after`、`first` 或 `last` 等值。 |\n| `dojo.dom.insertBefore` | 引用节点、要插入的节点和一个标志位\
  \ | 在引用节点同级且之前添加一个节点。如果参数中的两个节点相等，或者要插入的节点已与引用节点存在，则仅当标志位为 `true` 时才添加节点。 |\n| `dojo.dom.isDescendantOf`\
  \ | 节点、一个父节点和一个标志位 | 确定一个节点是否是另一个节点的后代。如果第三个元素的值为 `true`，则执行严格的后代检查（注：此处原文意指对后代关系的的逻辑判断）。\
  \ |\n| `dojo.dom.isNode` | DOM 树的元素 | 确定参数是否为节点。 |\n| `dojo.dom.isTag` | 节点和多个标签名\
  \ | 确定节点是否符合传入的多个标签名之一。如果是，则返回对应的名称。 |\n| `dojo.dom.lastElement` | 节点和一个标签名 | 返回节点中类型为\
  \ `dojo.dom.ELEMENT_NODE` 的最后一个子元素。如果指定了标签名，该函数返回最后一个匹配的元素。 |\n| `dojo.dom.moveChildren`\
  \ | 源节点、一个目标节点和一个标志位 | 将源标签的所有子元素移动到目标标签。如果第三个参数的值为 `true`，则删除所有文本类型的子元素。 |\n| `dojo.dom.nextElement`\
  \ | 节点和一个标签名 | 返回节点中类型为 `dojo.dom.ELEMENT_NODE` 的下一个子元素。如果指定了标签名，该函数返回下一个匹配的元素。\
  \ |\n| `dojo.dom.prependChild` | 要插入的节点和一个目标节点 | 在另一个目标节点的子列表第一个位置添加一个节点。 |\n| `dojo.dom.prevElement`\
  \ | 节点和一个标签名 | 返回节点中类型为 `dojo.dom.ELEMENT_NODE` 的上一个子元素。如果指定了标签名，该函数返回上一个匹配的元素。\
  \ |\n| `dojo.dom.removeChildren` | 节点 | 删除节点的所有子元素。 |\n| `dojo.dom.removeNode` |\
  \ 节点 | 从其父节点中删除指定的节点。 |\n| `dojo.dom.replaceChildren` | 源节点和一个要添加的节点 | 删除节点的所有子元素，并为其添加第二个参数指定的节点。\
  \ |\n\n\n\n\n\n对应于 `setAttributNS` 方法的实现、DOM 2 级命名、一个名称以及一个属性值。\n\n### dojo.dom.textContent\n\
  一个节点以及可能对应于 DOM 3 `textContent` 属性的实现。一个字符串。\n\n### dojo.dom.moveChildren\n`dojo.dom.moveChildren`\
  \ 函数允许将一个节点的所有子节点移动到另一个节点。 \n`dojo.dom.moveChildren` 函数允许将一个节点的所有子节点移动到另一个节点。以下代码描述了如何使用该函数将\
  \ ID 为 `monTexte` 的 `span` 标签的元素移动到 ID 为 `monAutreZone` 的 `div` 标签中：\n\n```javascript\n\
  var parentSource = dojo.byId(\"monTexte\");\nvar parentCible = dojo.byId(\"monAutreZone\"\
  );\ndojo.dom.moveChildren(parentSource, parentCible, false);\n```\n\n该代码修改页面内存中的\
  \ DOM 树，以获得以下结果：\n\n```html\n<div id=\"maZone\">\n  <span id=\"monTexte\"></span>\n\
  \  <div id=\"monAutreZone\">\n    <b>Un texte</b> ¨ ❶\n    <p>Un autre texte</p>\n\
  \  </div>\n</div>\n```\n\n标记 ❶ 突出了通过 `dojo.dom.moveChildren` 函数移动的块。\n\n### dojo.dom.removeChildren\n\
  `dojo.dom.removeChildren` 函数提供了删除一个节点的所有子节点的功能。以下代码允许删除 ID 为 `monTexte` 的 `span`\
  \ 标签的所有内容：\n\n```javascript\nvar source = dojo.byId(\"monTexte\");\ndojo.dom.removeChildren(source);\n\
  ```\n\n上述代码可以在页面内存中获得以下 DOM 树：\n\n```html\n<div id=\"maZone\">\n  <span id=\"monTexte\"\
  ></span> ¨ ❶\n  <div id=\"monAutreZone\">\n    <p>Un autre texte</p>\n  </div>\n\
  </div>\n```\n\n标记 ❶ 突出了通过 `dojo.dom.removeChildren` 函数删除了子节点的块。\n\n### dojo.dom.insertBefore\
  \ 和 dojo.dom.insertAfter\n其他函数，如 `dojo.dom.insertBefore` 和 `dojo.dom.insertAfter`，允许在页面的\
  \ DOM 树的不同位置插入元素。这些函数分别在引用节点之前和之后添加节点。以下代码实现了在加粗文本（`b` 标签）之前和之后添加斜体文本（`i` 标签）：\n\
  \n```javascript\nvar baliseItaliqueAvant = document.createElement(\"i\");\nvar texteItalique\
  \ = document.createTextNode(\"Italique\");\nbaliseItaliqueAvant.appendChild(texteItalique);\n\
  var baliseItaliqueApres = baliseItaliqueAvant.clone(true);\nvar source = dojo.byId(\"\
  monTexte\");\nvar baliseGras = source.childNodes[0];\ndojo.dom.insertBefore(baliseItaliqueAvant,\
  \ baliseGras);\ndojo.dom.insertAfter(baliseItaliqueApres, baliseGras);\n```\n\n\
  上述代码可以在页面内存中获得以下 DOM 树：\n\n```html\n<div id=\"maZone\">\n  <span id=\"monTexte\"\
  >\n    <i>Italique</i> ¨ ❶\n    <b>Un texte</b> ¨ ❷\n    <i>Italique</i> ¨ ❸\n \
  \ </span>\n  <div id=\"monAutreZone\">\n    <p>Un autre texte</p>\n  </div>\n</div>\n\
  ```\n\n标记 ❶ 和 ❸ 分别突出了通过 `dojo.dom.insertBefore` 和 `dojo.dom.insertAfter` 函数在标记 ❷\
  \ 块之前和之后添加的块。\n\n在上面的 JavaScript 代码中，使用了 DOM 的 `dojo.createElement` 和 `createTextNodeNode`\
  \ 函数来创建要插入的节点。这些函数已第 4 章讨论过。\n\n`dojo.dom.prependChild` 函数作为上述两个函数的补充，用于向节点添加子节点，即使该节点还没有子节点。\n\
  \n### 树导航\n最后，不同的函数提供了相对于某个节点访问 DOM 树不同节点的能力。因此，`dojo.dom.firstElement`、`dojo.dom.lastElement`、`dojo.dom.prevElement`\
  \ 和 `dojo.dom.nextElement` 分别允许获取节点集的第一个、最后一个节点，以及某个节点的前后节点。\n\n以下代码描述了这些函数在本节使用的\
  \ HTML 片段上的实现：\n\n```javascript\nvar element = dojo.byId(\"maZone\");\nvar premierElement\
  \ = dojo.dom.firstElement(element);\n// premierElement 对应元素\nvar dernierElement\
  \ = dojo.dom.lastElement(element);\n// dernierElement 对应“monTexte”\nvar precedentElement\
  \ = dojo.dom.prevElement(element);\n// precedentElement 为空\nvar suivantElement =\
  \ dojo.dom.nextElement(element);\n// suivantElement 对应“monAutreZone”\n```\n\n###\
  \ Ajax 技术支持\nDojo 库提供了实现各种 Ajax 技术的功能。在本节中，我们将讨论 `dojo.io.bind` 函数，它允许通过异步请求进行通信。\n\
  \n#### dojo.io.bind 函数\n`dojo.io.bind` 对应于异步 Ajax 的支持。以下代码描述了 `dojo.io.bind` 的用法示例：\n\
  \n```javascript\nvar proprietes = {\n  url: \"monUrl\",\n  mimetype: \"text/plain\"\
  ,\n  load: function(type, data) {\n    // 处理数据\n  }\n};\ndojo.io.bind(proprietes);\n\
  ```\n\n表 7.19 总结了 `dojo.io.bind` 支持的主要属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| content\
  \ | 以关联数组形式的请求内容 |\n| formNode | 对应的提交的表单元素 |\n| method | 用于发送请求的 HTTP 方法 |\n| mimetype\
  \ | 资源返回的内容类型。函数以不同方式处理不同类型。 |\n| multipart | 指定请求是否为 `multipart`，即是否包含多个部分，用于提交表单。此功能并非所有传输层都支持。\
  \ |\n| sync | 指定请求是否为同步。可能值为 true 或 false。 |\n| timeoutSeconds | 等待响应的最长时间。 |\n\
  | transport | 显式指定使用的传输层。 |\n| url | 资源的 URL |\n| useCache | 指定是否应实现缓存。 |\n\n表 7.20\
  \ 总结了 `dojo.io.bind` 管理的回调函数。\n\n| 回调 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| error\
  \ | 事件类型和发生的错误 | 在发送请求时发生错误时调用。 |\n| handle | 事件类型、数据和 | 通用回调函数。当未指定 `error` 和 `load`\
  \ 方法时，在请求成功或失败时均调用。 |\n| load | 事件类型、数据和 | 在请求成功且接收响应结果时调用。 |\n| timeout | | 在指定的特定等待时间内未收到响应时调用。\
  \ |\n\n```\n\n\n\n\n传递给请求的参数允许指定回调函数，以处理返回的数据。在请求成功的情况下，dojo 提供了使用 `handle` 或 `load`\
  \ 回调函数的可能。\n\n`load` 函数专门用于处理执行成功的请求。该函数接收参数：当前状态、数据以及可选的与事件对应的实例。\n\n以下代码描述了该回调函数的实现方式，用于处理请求后收到的数据：\n\
