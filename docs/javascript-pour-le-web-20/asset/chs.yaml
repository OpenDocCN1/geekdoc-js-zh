  \ 整数 | 指定要返回的结果数量。默认值为 10，最大为 50。 |\n| start | 整数 | 指定数据中的起始位置。 |\n| type | 自由文本\
  \ | 指定搜索类型。可能的值有 `all`（基于所有词）、`any`（基于一个或多个词）和 `phrase`（基于短语）。 |\n\n以下链接允许搜索歌手 Madonna\
  \ 的专辑，其 ID 为 `XXXXXXP000064565`，包含单词“Like”，并显示其前两个搜索结果：\n\n`http://api.search.yahoo.com/AudioSearchService/V1/albumSearch?appid=YahooDemo&artis-tid=XXXXXXP000064565&album=Like&results=2`\n\
  \n返回的数据默认为 XML 格式，其根标签为 `ResultSet`。\n\n该标签拥有属性 `totalResultsAvailable`、`totalResultsReturned`\
  \ 和 `firstPositionResult`，它们分别对应符合搜索条件的专辑总数、返回的数量以及搜索结果中第一个元素的位置。该服务支持 JSON 格式。\n\
  \n该服务可以通过 `Result` 标签分隔的块返回多个元素。该标签具有 `id` 属性，对应专辑的 ID。\n\n表 14.5 汇总了这些元素中包含的各种字段。\n\
  \n### 表格 14.5 搜索服务返回的字段\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Album | 专辑描述 |\n| Artist\
  \ | 歌手信息（ID 和名称） |\n| Publisher | 专辑发行公司 |\n| RelatedAlbums | 与当前专辑相关的专辑列表 |\n|\
  \ ReleaseDate | 专辑发行日期 |\n| Thumbnail | 专辑封面图像相关的信息（地址和大小） |\n| Title | 专辑标题 |\n\
  \n以下代码给出了调用该服务时，针对歌手 Madonna 标题包含“like”单词的专辑接收到的 XML 格式数据示例：\n\n```xml\n<ResultSet\
