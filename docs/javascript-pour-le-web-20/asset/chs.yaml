  \ | 在指定的索引处将参数传递的元素插入数组。 |\n| `remove` | 一个数组和一个对象 | 如果数组包含参数传递的元素，则从数组中删除该元素。 |\n\
  | `sort` | 一个数组 | 按字母降序对数组元素进行排序。 |\n\n### JavaScript 图形化库\n\n以下代码提供了 `add` 和 `indexOf`\
