  \n### 自定义组件的实现\n\n在上一节中，我们描述了图形组件的基础类及其通用机制。现在，我们将展示如何基于这些类来实现一个自定义的图形组件。\n\n我们将详细说明一个用于在网页中实现备忘录（memo）的图形组件。备忘录对应于可以隐藏的文本显示区域。\n\
  \n图 11.5 展示我们将开发的组件外观。\n\n![](img/index-324_1.png)\n\n**图 11.5**\n*代表备忘录的图形组件外观*\n\
  \n## 模板\n\n在开发 JavaScript 组件之前，我们需要基于 HTML 和 CSS 语言设计图形组件的外观。\n\n在描述组件 HTML 结构的代码中，图形组件包含三个元素：备忘录标题（标记\
  \ ❶）、用于关闭它的按钮（标记 ❷）以及它的文本（标记 ❸）：\n\n```html\n<div class=\"memo\">\n<div class=\"\
  titre\">Un titre</div\n<div class=\"fermeture\">X</</div>\n<div class=\"corps\"\
  >Le texte du memo</div\n</div>\n```\n\n上述代码基于 CSS 类 `titre` 用于标题区域，`fermeture` 用于关闭按钮，`corps`\
  \ 用于备忘录文本。`memo` 类处理备忘录的整体外观。\n\n以下代码描述了使用的各种 CSS 类：\n\n```css\n.memo {\nbackground:\
  \ yellow;\nfont-family: cursive;\nwidth: 10em;\n}\n.titre {\nfont-weight: bold;\n\
  text-decoration: underline;\nfloat: left;\n}\n.fermeture {\nfloat: right;\nbackground:\
  \ yellow;\ncolor: black;\nfont-size: x-small;\ncursor:pointer;\n}\n.corps {\nclear:both;\n\
  font-style: italic;\n}\n```\n\n现在我们已经实现了组件的结构，可以创建它的 JavaScript 类并将其与 HTML 和 CSS\
  \ 模板。\n\n## JavaScript 类\n\n必须实现 `dojo.widget.defineWidget` 函数以定义组件的 JavaScript\
  \ 类。它将类名、父类及其属性和方法作为参数。\n\n`templatePath` 和 `templateCssPath` 属性允许将上一节创建的模板与 JavaScript\
  \ 类关联。请注意，我们将这些文件存储在 dojo 分发版的 `src/widget/templates` 目录下，这些文件命名为 `Memo.html` 和\
  \ `Memo.css`。\n\n以下代码提供了组件 JavaScript 类骨架的实现示例：\n\n```javascript\ndojo.provide(\"\
