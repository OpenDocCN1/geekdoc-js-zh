  \ opacite); // ❶\n}\n\nfunction retablirOpacite(identifiantNoeud) {\n  var noeud\
  \ = document.getElementById(identifiantNoeud);\n  dojo.html.clearOpacity(noeud);\
  \ // ❷\n}\n```\n\nLivreGougeon 第 290 页 2006 年 11 月 28 日星期二 4:23 16\n\n**图形 JavaScript\
  \ 库**\n**290**\n*第四部分*\n\n请注意，透明度级别从 1.0（不透明显示）到 0.0（透明显示）不等。\n\ndojo 提供了基于以 `toggle`\
  \ 开头的函数来反转节点显示状态的可能。以下代码实现了 `dojo.html.toggleShowing` 函数，用以隐藏已显示的节点，反之亦然：\n\n```javascript\n\
  function inverserAffichage(identifiantNoeud) {\n  var noeud = document.getElementById(identifiantNoeud);\n\
  \  dojo.html.toggleShowing(noeud);\n}\n```\n\n**事件管理**\n\n与 prototype 库类似，dojo 提供了良好的机制来用于注册和注销事件观察者并管理它们。\n\
  \n然而，dojo 库提供了更通用的支持，因为它允许拦截任何方法调用以触发处理过程。我们稍后将看到这种机制对于处理 dojo 图形组件的事件非常有用，这些事件并不一定基于\
  \ DOM。\n\n事件的实现通常在页面初始化后完成。正如我们稍后看到的，该库不允许在页面的 `load` 事件上注册观察者。因此，这些处理必须通过 `dojo.addOnLoad`\
  \ 函数来完成。\n\n**页面初始化处理**\n\n为了初始化图形组件，dojo 会在页面加载时（`load` 事件）自动添加处理过程。因此，无法为该事件指定观察者，因为该事件只能指定一个观察者。此时，dojo\
  \ 提供了通过 `dojo.addOnLoad` 函数在页面加载时添加处理的可能性。同样，也可以实现 `dojo.addOnUnload` 函数用于页面卸载。\n\
  \n***基础函数***\n\n事件支持的基础方法位于标识为字符串 `dojo.event.*` 的模块中，必须导入其中的不同元素。\n\n该支持基于 `dojo.event`\
  \ 对象，该对象在导入相关事件模块时自动实例化，并提供了多个方法，其中主要方法是 `connect` 和 `disconnect` 用于注册和注销事件观察者。\n\
  \n这种支持支持 DOM 事件，也支持执行 JavaScript 对象方法后触发的事件。\n\nLivreGougeon 第 291 页 2006 年 11 月\
  \ 28 日星期二 4:23 16\n\n**dojo 库的图形支持**\n**291**\n*第 11 章*\n\n**注册事件观察者**\n\n基础方法 `connect`\
  \ 用于注册事件观察者。在 dojo 的事件支持中，事件并不一定对应于用户的操作（即 DOM 事件）。该库还允许将对象的的方法调用视为事件，从而允许在该层级定义观察者。\n\
  \n要实现一个用于检测对象方法调用的观察者，必须使用 `connect` 方法并结合表 11.5 汇总的参数。\n\n**表 11.5 *connect* 方法的参数**\n\
  \n**在观察对象方法的情况下**\n\n| 参数 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `srcFunc` | 字符串\
  \ | 对应触发事件的前一个对象的方法名。 |\n| `srcObj` | 对象 | 对应注册观察者的方法的对象。 |\n| `adviceFunc` | 字符串\
  \ | 对应处理事件的方法名。 |\n| `adviceObjet` | 对象 | 对应包含方法的对象。 |\n\n使用此方法对对象或其名称没有影响。\n\n\
  以下代码提供了一个使用 `connect` 方法为对象方法（标记 ❶）注册（标记 ❸）一个观察者（标记 ❷）的实现示例：\n\n```javascript\n\
  // 被观察方法的对象\nvar monObjet = { // ❶\n  maMethode: function() {\n    (...)\n  }\n\
  };\n\n// 观察者对象\nvar monObservateur = { // ❷\n  traiterEvenement: function() {\n\
  \    (...)\n  }\n};\n\n// 在对象上注册观察者\ndojo.event.connect(monObjet, \"maMethode\"\
  , // ❸\nmonObservateur, \"traiterEvenement\");\n\n/* 在此此方法后，traiterEvenement 方法被调用\
  \ */\n```\n\nLivreGougeon 第 292 页 2006 年 11 月 28 日星期二 4:23 16\n\n**图形 JavaScript\
  \ 库**\n**292**\n*第四部分*\n\n这种机制也可以用于未挂载到任何对象的观察函数。在这种情况下，`connect` 方法仅接收表 11.6 汇总的三个参数。\n\
  \n**表 11.6 *connect* 方法的参数** **在函数的情况下**\n\n| 参数 | 类型 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `srcFunc` | 字符串 | 对应触发事件的前一个对象的方法名。 |\n| `srcObj` | 对象 | 对应注册观察者的方法的对象。 |\n\
  | `adviceFunc` | 字符串 | 对应处理事件的观察函数名。 |\n\n以下代码提供了一个使用 `connect` 方法为对象方法（标记 ❶）注册（标记\
  \ ❸）一个观察函数（标记 ❷）的实现示例：\n\n```javascript\n// 被观察方法的对象\nvar monObjet = { // ❶\n  maMethode:\
  \ function() {\n    (...)\n  }\n};\n\n// 观察\nvar monObservateur = { // ❷\n  traiterEvenement:\
  \ function() {\n    (...)\n  }\n};\n\n// 在对象上注册观察者\ndojo.event.connect(monObjet,\
  \ \"maMethode\", // ❸\nmonObservateur, \"traiterEvenement\");\n\n/* 在调用此方法后，traiterement\
  \ 函数被调用 */\n```\n\n节点 DOM 事件的观察者注册方式与之前相同。`dojo.event.connect` 函数的第一个和第二个参数分别对应节点和所观察的事件名称。\n\
  \n然而请注意，在使用函数时，事件名称必须加上 `on` 前缀。\n\n以下代码给出了为 ID 为 `monNoeud` 的 DOM 节点 `onclick`\
  \ 事件注册观察者的实现示例：\n\n```javascript\nvar monObservateur = {\n  traiterEvenement: function()\
  \ {\n    (...)\n  }\n};\n\nvar monNoeud = dojo.byId(\"monNoeud\");\ndojo.event.connect(monNoeud,\
  \ \"onclick\",\nmonObservateur, \"traiterEvenement\");\n```\n\n\n\n\n\n```\ndojo.event.connect(monNoeud,\
  \ \"onclick\", \"traiterEvenement\");\n```\n\n### dojo 库的图形支持\n\n## 第 11 章\n\n请注意，`connect`\
  \ 方法提供了对多个相同观察者注册的支持。这些观察者通过此函数仅会被注册一次。\n\ndojo 库还提供了 `kwConnect` 方法，该方法基于关联数组作为参数。\n\
  \n以下代码调整了之前的示例，以使用该函数（标记为 ❶）：\n\n```javascript\n// 被观察的方法的对象\nvar monInstance =\
  \ {\n  maMethode: function() {\n    (...)\n  }\n};\n\n// 观察者对象\nvar monObservateur\
  \ = {\n  traiterEvenement: function() {\n    (...)\n  }\n};\n\n/* 在对象 monObjet 上注册观察者\
  \ monObservateur */\ndojo.event.kwConnect({ ❶\n  srcObj: monInstance,\n  srcFunc:\
  \ \"maMethode\",\n  adviceObj: monObservateur,\n  adviceFunc: \"traiterEvenement\"\
  \n});\n\nmonInstance.maMethode();\n/* 调用此方法后，对象 monObservateur 的方法 traiterEvenement\n\
  \ 将被调用 */\n```\n\n## 取消事件观察者的注册\n\ndojo 库提供了一种优雅的方式，基于 `disconnect` 方法来移除为 DOM 事件或方法注册的观察者。\n\
  \n为了取消注册观察者，调用此方法时使用的参数必须与使用 `connect` 方法注册时使用的参数相同。\n\n以下代码给出了取消注册对象方法（标记为 ❶）的观察者（标记为\
  \ ❷）的示例（标记为 ❹），该观察者之前是基于 `connect` 方法（标记为 ❸）注册的：\n\n```javascript\nvar monInstance\
  \ = { ❶\n  maMethode: function() {\n    (...)\n  }\n};\n\nvar monObservateur = {\
  \ ❷\n  traiterEvenement: function() {\n    (...)\n  }\n};\n\ndojo.event.connect(monInstance,\
  \ \"maMethode\", ❸\nmonObservateur, \"traiterEvenement\");\n\nmonInstance.maMethode();\n\
  /* 调用此方法后，对象 monObservateur 的方法 traiterEvenement\n 将被调用 */\n\ndojo.event.disconnect(monInstance,\
  \ \"maMethode\", ❹\nmonObservateur, \"traiterEvenement\");\n\nmonInstance.maMethode();\n\
  /* 调用此方法后，对象 monObservateur 的方法 traiterEvenement\n 不再被调用 */\n```\n\nDOM 事件的取消注册以相同的方式实现，始终基于\
  \ `dojo.event.disconnect` 函数。\n\n## 解耦\n\n在 JavaScript 应用中，如果想要很好地分离网页中包含的不同元素（HTML、CSS\
  \ 和 JavaScript），实现事件管理是一项真正的挑战。\n\ndojo 库实现了一种基于主题（*topics*）的机制，该机制允许触发器与事件观察者之间解耦。为此，该库实现了信息交换通道，观察者注册到这些通道上，以便在向给定通道发送事件时接收通知。\n\
  \n这些通道的管理和使用涉及到 `dojo.event.topic` 对象，该对象由 dojo 在包含事件相关的模块（由字符串 `dojo.event.*` 标识的模块）时进行实例化。\n\
  \n表 11.7 汇总了该实例的方法。\n\n### 表 11.7 `dojo.event.topic` 对象的方法\n\n| 方法 | 参数 | 描述 |\n\
  | :--- | :--- | :--- |\n| `destroy` | 主题名称 | 根据名称销毁主题。 |\n| `getTopic` | 主题名称 |\
  \ 根据名称返回代表主题的对象。返回的对象类型为 `dojo.event.topic.TopicImpl`。 |\n| `publish` | 主题名称 | 向主题发送消息。\
  \ |\n| `registerPublisher` | 主题名称、对象和触发器方法名 | 将对象的一个方法定义为主题的触发器。当该方法被调用时，将向该主题发送消息。\
  \ |\n| `subscribe` | 主题名称、对象和观察者方法名 | 为给定主题注册观察者。 |\n| `unsubscribe` | 主题名称、对象和观察者方法名\
  \ | 取消给定主题的观察者注册。 |\n\ndojo 库在内部基于 `dojo.event.topic.TopicImpl` 类管理主题。\n\n## 向主题注册观察者\n\
  \n观察者的注册是通过 `dojo.event.topic` 对象的 `subscribe` 方法实现的。观察者用于处理事件的方法必须拥有一个参数以便接收与事件相关的消息。该参数的类型随触发事件而异。\n\
  \n与 `dojo.event` 对象的 `connect` 方法一样，`subscribe` 方法支持以函数形式或对象方法形式使用观察者。\n\n以下代码提供了该方法的实现示例（标记为\
  \ ❸），其中观察者通过对象方法（标记为 ❶）和函数（标记为 ❷）实现：\n\n```javascript\nvar monObservateur = { ❶\n\
  \  traiterEvenement: function(message) {\n    (...)\n  }\n};\n\nfunction traiterEvenement(message)\
  \ { ❷\n  (...)\n}\n\ndojo.event.topic.subscribe(\"monSujet\", ❸\nmonObservateur,\
  \ \"traiterEvenement\");\n\ndojo.event.topic.subscribe(\"monSujet\", \"traiterEvenement\"\
  ); // ❸\n```\n\n## 向主题发布消息\n\n消息的发布可以通过两种方式实现。第一种直接基于代表主题的对象及其 `sendMessage` 方法，而第二种是将对象的一个方法配置为事件触发器。\n\
  \n以下代码给出了向主题 `monSujet` 发送消息的第一种方式的实现示例：\n\n```javascript\nvar monSujet = dojo.event.topic.getTopic(\"\
  monSujet\");\nmonSujet.sendMessage(\"mon message\");\n```\n\n在这种情况下，注册的观察者收到的是包含“mon\
  \ message”的字符串。这种方法是侵入性的，因为它强制使用了 dojo 库的对象。\n\n使用第二种方式，必须使用 `dojo.event.topic`\
  \ 对象的 `registerPublisher` 方法，如下代码所示：\n\n```javascript\nvar monDeclencheur = {\n\
  \  declencher: function() {\n    (...)\n  }\n};\n\ndojo.event.topic.registerPublisher(\"\
  monSujet\",\nmonDeclencheur, \"declencher\");\n```\n\n当调用 `monDeclencheur` 对象的 `declencher`\
  \ 方法时，向主题 monSujet 发送事件。在这种方法下，注册的观察者收到的消息为空。\n\n与之前描述的 `dojo.event` 对象的 `connect`\
  \ 方法类似，`registerPublisher` 方法可以实现使用 DOM 事件作为触发器。以下代码在 `onclick` 事件发生时向主题 monSujet\
  \ 发送消息：\n\n```javascript\nvar monBouton = dojo.byId(\"monBouton\");\ndojo.event.topic.registerPublisher(\"\
  monSujet\",\nmonBouton, \"onclick\");\n```\n\n在这种情况下，注册的观察者收到的消息对应于发生的 DOM 事件。\n\
