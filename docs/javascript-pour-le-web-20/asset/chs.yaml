  \n`dojo.delayEach` 函数提供了一种按指定间隔执行函数的有趣机制。它基于 JavaScript 的 `setTimeout` 方法。它还允许指定在每次调用之前执行的回调函数以及在所有函数之后执行的。\n\
  \n以下代码描述了其实现：\n\n```javascript\ndojo.delayEach([\n  function() {\n    alert(\"appel\
  \ de la première méthode\");\n  },\n  function() {\n    alert(\"appel de la seconde\
  \ méthode\");\n  },\n  function() {\n    alert(\"appel de la troisième méthode\"\
  );\n  }\n], 10);\n```\n\n此示例中的指定函数以十秒为间隔被调用。\n\n注意 `dojo.lang.setTimeout` 和 `dojo.lang.clearTimeout`\
  \ 函数的存在，它们允许对 `setTimeout` 函数进行封装。\n\n以下代码描述了 `dojo.lang.setTimeout` 的实现：\n\n```javascript\n\
  dojo.lang.setTimeout(function() {\n  alert(\"Execution de la fonction de rappel\
  \ après 10 secondes\");\n}, 10000);\n```\n\n***类型检查***\n\ndojo 提供了基础 JavaScript\
