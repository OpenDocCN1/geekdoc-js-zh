  \ 方法将传递的参数字符串添加到其内部字符串数组的末尾。\n- 如果实例 `sb` 的 `toString` 方法返回一个由内部数组中的字符串拼接而成的字符串。\n\
  \n### 测试执行上下文\n\n在 JsUnit 中，上下文对应于为测试函数初始的对象集合。这些对象在执行测试函数之前实例化并初始化，并在之后释放。\n\n\
  测试用例通常集中于应用程序的一个或多个特定类。因此，可以定义一个或多个变量以便在用例的一个或多个测试函数中使用。这些变量的集合即为测试执行上下文。上下文对于所有测试函数必须是相同的。为此，JsUnit\
  \ 提供了在执行这些函数前后添加处理的功能，以便对其进行管理并确保测试之间的独立性。\n\n### 上下文与 JsUnit\n\n与允许 Java 中进行单元测试的\
  \ JUnit 不同，上下文并没有那么封闭，因为它的元素对于执行测试的页面是全局的。因此，在编写测试时需要格外小心，使其尽可能相互独立。此外，很好地释放为测试初始化的对象也非常重要。\n\
  \n通过两个命名的函数可以管理上下文：用于初始化的 `setUp` 函数和用于释放的 `tearDown` 函数。`setUp` 在执行前被调用，而 `tearDown`\
  \ 在每个测试函数执行结束被调用。\n\n以下代码说明了在之前的示例中使用这两个函数的方法：\n\n```html\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
  >\n<html\n<head>\n(...)\n<script language=\"JavaScript\" type=\"text/javascript\"\
  >\nvar sb = null;\nfunction setUp() {\n  sb = new StringBuffer();\n}\nfunction tearDown()\
  \ {\n  sb = null;\n}\nfunction testAppend() {\n  sb.append(\"param1\");\n  sb.append(\"\
  \ - \");\n  sb.append(\"param2\");\n  assertEquals(sb.chainesInternes.length,3);\n\
  \  assertEquals(sb.chainesInternes[0],\"param1\");\n  assertEquals(sb.chainesInternes[1],\"\
  \ - \");\n  assertEquals(sb.chainesInternes[2],\"param2\");\n}\n\nfunction testToString()\
  \ {\n  sb.append(\"param1\");\n  sb.append(\" - \");\n  sb.append(\"param2\");\n\
  \  assertEquals(sb.toString(),\"param1 – param2\");\n}\n</script>\n</head>\n<body>\n\
  <h1>Tests JsUnit: StringBuffer</h1>\n<p>Cette page contient les tests relatifs à\
  \ la classe StringBuffer.</p>\n</body>\n</html>\n```\n\n\n\n\n\nJsUnit 此外定义了 `setUpPage`\
  \ 函数，它在测试页面加载时且测试执行之前被调用。当该函数的处理完成且全局变量 `setUpPageStatus` 的值等于 `complete` 时，测试开始执行。\n\
  \n以下代码说明了在上述示例如何 much 该函数：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01 Transitional//EN\"\n[\"http://www.w3.org/TR/html4/loose.dtd\">>\n<html>\n\
  <head>\n(...)\n<script language=\"JavaScript\" type=\"text/javascript\">\nvar sb\
  \ = null;\nfunction setUpPage() {\nsb = new StringBuffer();\nsetUpPageStatus = \"\
  complete\";\n}\nfunction setUp() {\nsb.clear();\n}\nfunction tearDown() {\n}\n//之前的代码方法保持不变\n\
  (...)\n</script>\n</head>\n(...)\n</html>\n```\n\n## 断言与失败\n\n在 xUnit 家族工具中，断言（assertions）允许指定字段或函数返回预期值。如果实际值与预期值不符，则会抛出一个错误。此时，测试函数的执行将被中断，该测试被视为失败。\n\
  \n所有此类类型的函数都以 `assert` 为前缀并定义在 JavaScript 文件 `jsUnitCore.js` 中，该文件位于 JsUnit 发布包的\
  \ `app/` 目录下。\n\n根据操作元素的类型，可以区分若干类函数。\n\n首先，JsUnit 定义了针对原始数据类型的断言函数：\n`function\
  \ assert(obtenu)` // 等于 `assertTrue`\n\n```javascript\nfunction assertTrue(obtenu)\n\
  function assertFalse(obtenu)\nfunction assertEquals(attendu,obtenu)\nfunction assertNotEquals(attendu,obtenu)\n\
  ```\n\n前三个函数检查参数中的值或表达式是否等于 `true` 或 `false`。接下来的两个函数作用于原始类型以检查它们的相等性。最后两个函数均不允许用于操作\
  \ JavaScript 对象。\n\n为了实现这一点，应使用以下函数：\n\n```javascript\nfunction assertObjectEquals(objetAttendu,objetObtenu)\n\
  function assertArrayEquals(objetAttendu,objetObtenu)\n// 等于 assertObjectEquals\n\
  ```\n\n另一种类型的函数允许检查变量的有效性或非空性：\n```javascript\nfunction assertNull(attendu);\nfunction\
  \ assertNotNull(attendu);\nfunction assertUndefined(attendu);\nfunction assertNotUndefined(attendu);\n\
  function assertNaN(attendu);\nfunction assertNotNaN(attendu);\n```\n\n注意这些用于测试变量是否在\
  \ JavaScript 意义上未定义（`undefined`）以及数字是否无效（`NaN`，例如除以 0 的结果）的函数。\n\n这些函数也可以带参数使用，以便更精确地描述错误。如果使用该参数，则必须始终放在第一个位置。\n\
  \n以下代码给出了使用示例：\n\n```javascript\nvar maVariable = (...);\nassertEquals(\"La valeur\
  \ de la variable ne correspond pas\", \"valeur attendue\", maVariable);\n```\n\n\
  最后，值得注意的是存在 `fail` 函数，它允许显式地使测试失败。它可以不带参数使用，也可以带消息使用，特别用于在执行通过未授权的块时使测试失败。\n\n以下代码是该函数的用法示例：\n\
  \n```javascript\ntry {\nvar monInstance = (...);\nmonInstance.execute();\nfail(\"\
  Une exception doit être levée\");\n} catch(err) {\n(...)\n}\n```\n\n## 测试用例集\n\n\
  为了能够连续执行多个测试，xUnit 家族工具定义了测试用例集（suite de tests）的概念。由于测试用例集本身也是测试，因此可以通过不同的启动器进行执行。这种技术允许轻松地自动执行一组测试的执行。\n\
  \nJsUnit 为此实现了 `jsUnitTestSuite` 类。请注意，该类需要包含 JavaScript 文件 `jsUnitCore.js`，该文件位于工具包的\
  \ `app/` 目录下。\n\n### addTest 方法\n\n`addTest` 方法允许根据地址将测试 HTML 文件添加到测试用例集中。随后，该文件中被识别为测试函数的所有函数都将执行执行。\n\
  \n下面的代码给出了其实现示例：\n\n```javascript\nvar myTestSuite = new top.jsUnitTestSuite();\n\
  myTestSuite.addTestPage(\"tests/jsUnitAssertionTests.html\");\n```\n\n注意，此代码中的 `jsUnitTestSuite`\
  \ 类带有关键字 `top` 前缀。该关键字用于解析在 `jsUnitTestSuite.js` 文件中定义的类名，该文件被导入到 `testRunner.html`\
  \ 中，而不是测试 HTML 文件中。\n\n### addTestSuite 方法\n\n`addTestSuite` 方法允许将一个测试用例集添加到另一个测试用例集中。这样，包含在用例集中的所有测试函数都将被执行。\n\
  \n下面的代码给出了其实现示例：\n\n```javascript\nfunction maSuiteDeTests() {\nvar maSuiteTests\
  \ = new top.jsUnitTestSuite();\nmaSuiteTests.addTestPage(\"tests/jsUnitAssertionTests.html\"\
  );\nreturn maSuiteTests;\n}\nvar testSuite = new top.jsUnitTestSuite();\ntestSuite.addTestSuite(maSuiteDeTests());\n\
  ```\n\n### 测试用例集的实现\n\n为了在测试用例中使用 way 用例集，应实现 `suite` 函数，该函数返回一个 `jsUnitTestSuite`\
  \ 类型的对象并允许构建所需的测试用例集。\n\n以下代码给出了该机制的实现示例：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01 Transitional//EN\"\n[\"http://www.w3.org/TR/html4/loose.dtd\">>\n<html\n\
  <head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n\
  <title>Tests JsUnit: suite</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  css/jsUnitStyle.css\"/>\n<script language=\"JavaScript\" type=\"text/javascript\"\
  \ src=\"app/jsUnitCore.js\"/>\n<script language=\"JavaScript\" type=\"text/javascript\"\
  >\nfunction suite() {\nvar maSuite = new top.jsUnitTestSuite();\nmaSuite.addTestPage(\"\
  testStringBuffer.html\");\nreturn maSuite;\n}\n</script>\n</head>\n(...)\n</html>\n\
  ```\n\n## 测试数据的加载\n\nJsUnit 支持从不同格式的文件加载数据。该功能的实现使用了框架测试管理器的 `documentLoader` 属性。\n\
  \n第一步是使用 `setUpPage` 函数加载文件数据，该函数调用 `documentLoader` 属性的 `load` 方法。\n\n以下代码说明了从文件名在变量\
  \ `uri` 中指定的文件（标记 ❶）加载数据。该名为 `data.xml` 的文件在 `setUpPage` 函数中加载（标记 ❷）。\n\n```html\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n[\"http://www.w3.org/TR/html4/loose.dtd\"\
  >>\n<html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n<title>Tests JsUnit: documentLoader</title>\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"css/jsUnitStyle.css\"/>\n<script language=\"JavaScript\" type=\"\
  text/javascript\" src=\"app/jsUnitCore.js\"/>\n<script language=\"JavaScript\" type=\"\
  text/javascript\">\nvar uri = \"tests/datas.xml\"; // ❶\nfunction setUpPage() {\n\
  setUpPageStatus = 'running';\ntop.testManager.documentLoader.callback = setUpPageComplete;\n\
  top.testManager.documentLoader.load(uri); // ❷\n}\nfunction setUpPageComplete()\
  \ {\nif (setUpPageStatus == 'running')\n```\n\n\n\n\n```javascript\nsetUpPageStatus\
  \ = 'complete';\n\n}\n\n(...)\n\n</script>\n\n</head>\n\n(...)\n\n</html\n```\n\n\
  # JavaScript 应用测试\n\n## 第 15 章\n\n一旦数据加载，就可以通过 `documentLoader` 的 `buffer` 属性使用存储结构。该结构提供了一个\
  \ `document` 属性以便通过 DOM 机制遍历这些数据，如下代码所示：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01 Transitional//EN\"\n[\"http://www.w3.org/TR/html4/loose.dtd\"]](http://www.w3.org/TR/html4/loose.dtd)\n\
  \n<html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n<title>JsUnit Tests: documentLoader </title>\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"css/jsUnitStyle.css\"/>\n<script language=\"JavaScript\" type=\"\
  text/javascript\" src=\"app/jsUnitCore.js\"/>\n<script language=\"JavaScript\" type=\"\
  text/javascript\">\n(...)\n\nfunction testDocumentLoader() {\n// 数据的根元素\nvar root\
  \ = top.testManager.documentLoader. documentElement;\n// 数据中包含的标签列表\nvar buffer\
  \ = top.testManager.documentLoader.buffer();\nvar elms = buffer.document.getElementsByTagName(\"\
  *\");\n}\n(...)\n</script>\n</head>\n(...)\n</html\n```\n\n## 执行测试\n\n使用 `JsUnit`\
  \ 执行测试需要其发行版中的组件。这些组件由不同的启动器组成。在运行 `JsUnit` 服务器模块的情况下，必须安装 Java 任务执行工具 `Ant` 以及\
  \ Java 虚拟机。\n\n[`Ant` 可以在 `http://ant.apache.org/`](http://ant.apache.org/) 获取，而\
  \ [`Java`](http://ant.apache.org) 可以在 [`http://java.sun.com/`](http://java.sun.com/)\
  \ 获取]`。我们在此不详细说明其安装过程（更多信息请参阅各自网站上的可用文档）。\n\n### 测试运行器 (Test Runner)\n\nJsUnit 提供了一个对应\
  \ HTML 页面的 Web 启动器，允许根据页面名称按需执行单元测试。该启动器采用了 Java 世界中各种 `JUnit` 启动器的图形界面。此页面对应工具发行包根目录下的\
  \ `testRunner.html` 文件。\n\n![](img/index-471_1.jpg)\n![](img/index-471_2.jpg)\n\n\
  ## 其他工具\n\n### 第六部分\n\n当所有测试都正确执行时，会显示一条绿色水平条（图 15.2 中为浅灰色）。\n\n**图 15.2**\n*当所有测试都正确执行时的\
  \ JsUnit 图形界面*\n\n当一个或多个测试失败时，会显示一条红色水平条（图 15.3 中为深灰色）。\n\n**图 15.3**\n*当一个或多个测试失败时的\
  \ JsUnit 图形界面*\n\n![](img/index-472_1.jpg)\n\n界面包含四个部分。第一部分允许指定测试 HTML 文件并启动其执行。第二部分允许指定相关设置，特别是关于跟踪级别和测试超时设置。\n\
  \n第三部分显示已执行测试的结果以及相关的统计数据。最后一部分提供了提供了有关测试失败的额外信息。可以通过选择列表中的错误并显示其详情（`Show selected`\
  \ 和 `Show all`）来访问这些信息。\n\n### 集成在 Eclipse 中的 JsUnit 启动器\n\nJsUnit 还提供了一个集成在 `Eclipse`\
  \ 中的启动器，允许直接从该开发环境执行测试 HTML 页面。\n\n在 `Eclipse` 中安装后，需要配置启动器的安装目录以及要使用的各种浏览器可执行文件。图\
  \ 15.4 展示了 `Eclipse` 中启动器的配置窗口。该窗口可以通过工具菜单中的 `Preferences…`（首选项）项访问。\n\n**图 15.4**\n\
  *Eclipse JsUnit 插件的配置窗口*\n\n![](img/index-473_1.jpg)\n![](img/index-473_2.jpg)\n\
  \n要执行测试 HTML 页面，必须使用 `Eclipse` 的内部执行支持。因此，可以通过右键菜单 `JsUnit Test Page` 执行页面。\n\n\
  如果执行成功，窗口将显示绿色条（图 15.5 中为浅灰色），并描述每个测试页面执行的测试函数列表。\n\n**图 15.5**\n*集成在 Eclipse 中的\
  \ JsUnit 视图（测试执行成功）*\n\n如果测试出现错误，窗口将显示红色条（图 15.6 中为深灰色），错误的测试将用交叉号标记。\n\n**图 15.6**\n\
  *集成在 Eclipse 中的 JsUnit 视图（测试执行中出现错误）*\n\n现在让我们详细介绍 `JsUnit` 工具提供的用于在一个或多个浏览器中自动执行测试的支持。\n\
  \n### 使用 JsUnit Server 和 Ant 实现测试自动化\n\n`JsUnit Server` 是一个非常有用的工具，它允许进一步实现 JavaScript\
  \ 单元测试执行的自动化。这种自动化基于 `Ant` 工具提供的便利，同时通过 `JsUnit` 特定的任务进行增强。这种自动化的主要意义在于自动检查不同浏览器中\
  \ JavaScript 应用的故障和回归问题。这样就不需要手动一个一个运行它们。\n\n`JsUnit` 服务器与 `JsUnit` 的 `Ant` 任务结合可以实现以下功能：\n\
  \n- 类似于 `JUnit`，将 `JsUnit` 测试结果存储在 XML 文件中。\n- 在不同的 Web 浏览器上本地执行 `JsUnit` 测试。\n\
  - 在远程机器上执行 `JsUnit` 测试（此处不介绍此功能）。\n\n#### Ant 工具\n\n该工具在 Java 世界中常用于自动化重复任务。得益于其功能、可扩展性以及大量的可用任务，`Ant`\
  \ 能够快速轻松地实现复杂的处理。此外，该工具允许指定任务链。因此，可以轻松实现以下处理链：从 CVS 获取源码、编译、二进制文件打包或执行单元测试。该开源工具可以在\
  \ [`http://ant.apache.org/`](http://ant.apache.org/) 获取。\n\n为了实现这些功能，必须使用位于 `JsUnit`\
  \ 发行包根目录下的 Ant 脚本 `build.xml`。它由不同的任务组成，在配置脚本变量后可以直接。此文件不是可执行文件，但它允许配置 `Ant` 的执行。该工具默认使用执行目录下的同名文件。以下代码演示了在命令行执行\
  \ `Ant`：\n\n```bash\n<JSUNIT_HOME>\\jsunit > ant maTache\n\nBuildfile: build.xml\n\
  \nmaTache:\n\n(...)\n\nBUILD SUCCESSFUL\nTotal time: 1 second\n\n<JSUNIT_HOME>\\\
  jsunit >\n```\n\n表格 15.2 和 15.3 总结了脚本中包含的各种属性和任务。\n\n**表格 15.2 JsUnit build.xml\
  \ 文件的属性**\n\n| 属性 | 说明 |\n| :--- | :--- |\n| browserFileNames | |\n\n\n\n\n\n对应用于测试的浏览器可执行文件列表。此属性仅在通过\
  \ `standalone_test` 任务执行独立且本地测试时使用。可以指定多个浏览器。它们的可执行文件名称必须用逗号分隔，例如：`c:\\program files\\\
  internet explorer\\iexplore.exe,c:\\program files\\netscape\\netscape7.1\\netscp.exe`。\n\
  \n### `closeBrowsersAfterTestRuns`\n确定 JsUnit 是否应在测试执行后尝试关闭浏览器。其默认值为 `true`。\n\n\
  ### `description`\n允许定义 JsUnit 服务器的描述。\n\n### `ignoreUnresponsiveRemoteMachines`\n\
  在实施分布式测试时，如果某台机器没有响应，则忽略该机器的测试。如果值为 `true`，未响应的机器不会被视为错误。否则（值为 `false`），则会将错误添加到错误列表中。\n\
  \n### `logsDirectory`\n允许指定存储测试结果的地方。该值可以是相对路径，也可以是绝对路径。如果省略此属性，文件将存储在 `resourceBase`\
  \ 属性值的子目录 `logs/` 下。\n\n### `port`\n允许定义 JsUnit 服务器使用的端口。默认值为 `8080`。\n\n### `remoteMachineURLs`\n\
  允许指定要使用的测试机器列表。地址必须是有效的 HTTP 地址，并指定协议 (`http`)、机器名以及使用的端口。如果使用多台机器，它们的地址必须用逗号分隔，例如：`http://machine1.company.com:8080,http://localhost:8080`。\n\
  \n### `resourceBase`\n允许指定 JsUnit 服务器的根目录。此属性不是强制的。如果省略，则使用当前目录。\n\n### `timeoutSeconds`\n\
  允许指定测试执行不应的最长时长（秒）。默认值为 `60`。\n\n### `url`\n允许定义执行单元测试的地址。此属性对于独立测试是必须的，并且必须是一个有效地址，例如\
  \ `file:///c:/jsunit/testRunner.html?testPage=c:/jsunit/tests/jsUnitTestSuite.html`。执行通过\
  \ `TestRunner.html` 工具完成。\n\n#### 表 15.3 JsUnit 文件 `build.xml` 中的 Or Ant 任务\n\n\
  | 任务 | 依赖于 | 描述 |\n| :--- | :--- | :--- |\n| `_compile_source` | | JsUnit 工具 Java\
  \ 源码编译任务 |\n| `_compile_tests` | | JsUnit 工具 JUnit 测试编译任务 |\n| `_create_jar` | `_compile_source`\
  \ | 创建 `jsunit.jar` 文件的任务 |\n| `_generateJsUnitPropertiesSample` | | 生成 `jsunit.properties.sample`\
  \ 文件的任务 |\n| `_run_all_tests` | `_create_jar`, `_compile_tests` | 执行 JsUnit 单元测试的任务\
  \ |\n| `_run_unit_tests` | `_compile_tests` | 执行 JsUnit Java 单元测试的任务 |\n| `create_distribution`\
  \ | `_create_jar` | 创建 JsUnitset（JsUnit 服务器和 Ant 任务）的任务 |\n| `distributed_test`\
  \ | `_run_unit_tests` | 在一台或多台远程机器上执行测试 |\n| `standalone_test` | | 在本地执行测试 |\n|\
  \ `start_farm_server` | | 启动多个 JsUnit 服务器 |\n| `start_server` | | 启动一个 JsUnit 服务器\
  \ |\n| `stop_server` | | 停止 JsUnit 服务器 |\n\n现在我们已经详细说明了 JsUnit 工具提供的各种 Ant 任务，让我们让我们详细说明如何实现上述前两个功能，即测试结果的\
  \ XML 存储以及在不同浏览器中配置测试执行。\n\n### 测试结果的 XML 存储\n为了以 XML 格式生成测试执行结果，必须使用 Ant 任务 `standalone_test`。它允许启动一个或多个\
  \ 浏览器，在其中执行测试并获取结果，将其保存为 XML 格式的文件。\n\n图 15.7 展示了这些机制。\n\n**图 15.7 JsUnit 中的测试执行**\n\
  (Ant -> 启动 `testRunner.html` 实例 -> 包含测试的 HTML  -> `standalone_test` 或 `distributed_test`\
  \ -> 嵌入 JsUnit HTTP 服务器 -> 发送结果 -> 写入结果 -> XML 文件)\n\n### 工具\n必须设置以下 Ant 脚本变量：\n\
  - `browserFileNames`：定义浏览器执行的位置。可以设置多个值以便在多个浏览器中进行测试。\n- `logsDirectory`：定义结果 XML\
  \ 文件的写入位置。\n- `url`：指定 JsUnit 启动器的地址以及包含单元测试的页面。\n\n包含要执行测试文件路径的变量 `url` 格式如下：`file:///<JSUNIT_HOME>/jsunit/testRunner.html?testPage=<TESTS_HOME>/jsUnitMesTests.html`。以下代码说明包含测试结果的\
  \ XML 文件结构：\n\n```xml\n<browserResult id=\"1146827481781\" time=\"5.594\">\n  <properties>\n\
  \    <property name=\"browserFileName\" value=\"C:/applications/firefox/firefox.exe\"\
  \ />\n    <property name=\"browserId\" value=\"0\" />\n    <property name=\"jsUnitVersion\"\
  \ value=\"2.2\" />\n    <property name=\"userAgent\" value=\" Mozilla/5.0 (Windows;\
  \ U; Windows NT 5.1; fr; rv:1.8.0.2) Gecko/20060308 Firefox/1.5.0.2\" />\n    <property\
  \ name=\"remoteAddress\" value=\"127.0.0.1\" />\n    <property name=\"url\" value=\"\
  file://<TESTS_HOME>/jsUnitMesTests.html\" />\n  </properties>\n  <testCases>\n \
  \   <testCase name=\"file:///<TESTS_HOME>/jsUnitStringBuffer.html:testAppend\" time=\"\
  1.375\">\n      <failure>Expected <param1> (String) but was <param11> (String) Stack\
  \ trace follows: > JsUnitException > _assert > assertEquals > testGetParam1</failure>\n\
  \    </testCase>\n    <testCase name=\"file:///<TESTS_HOME>/jsUnitMesTests.html:testToString\"\
  \ time=\"1.156\">\n  </testCases>\n</browserResult>\n```\n\n请注意，文件包含了一些关于执行测试浏览器的信息。这些信息位于\
  \ `property` 标签中。在上面的文件中，测试是使用 Firefox 浏览器通过 `jsUnitStringBuffer.html` 文件在本地执行的。\n\
  \n最后注意，JsUnit 目前尚未提供从结果 XML 文件生成文档的工具。由于使用的 XML 格式与 JUnit 工具的格式不匹配，无法使用 JUnit 的\
  \ Ant 任务 `junitreport`。然而，预计后续版本将支持该工具。\n\n### 在不同浏览器中配置测试执行\n测试的执行按照上一节描述的方式进行。唯一变化的是\
  \ `browserFileNames` 变量，它现在必须包含多个用逗号分隔的值。\n\n为了在 Firefox 和 Internet Explorer 中连续执行测试，变量值格式如下：\n\
  \n```xml\n<property name=\"browserFileNames\" value=\"C:/Program Files/Internet\
  \ Explorer/IEXPLORE.EXE,C:/applications/firefox/firefox.exe\"/>\n```\n\n\n\n\n在这种情况下，`JsUnit`\
  \ 的 Ant 任务会在不同的浏览器中连续执行测试，如图 15.8 所示。\n\n- 启动一个\n- 执行\n- 实例\n- 多个测试\n- 浏览器\n- `testRunner.html`\n\
  - `Ant`\n- 任务\n- HTML 页面\n- 启动一个\n- 包含测试的\n- `standalone_test` 或\n- 执行\n- 实例\n-\
  \ `JsUnit` \n- 多个测试\n- 浏览器\n- `testRunner.html`\n- HTTP 服务器\n- 发送结果\n- 嵌入的\n- 发送结果\n\
  - 写入结果\n- XML 文件\n- XML 文件\n- 包含\n- 包含包含\n- 测试结果\n\n**图 15.8**\n*在多个浏览器中执行测试*\n\n\
  在 `JsUnit` Ant 任务的这种用例中，会生成多个 XML 结果文件，与配置的浏览器数量对应。其内容的结构与上一节描述的相似。\n\n# 对象模拟（Mock\
  \ Objects）\n\n虽然 `JsUnit` 提供了实现测试、验证其有效性以及以不同方式执行测试的功能，但它并不能将测试组件与其所依赖的对象隔离开。为此，可以使用对象模拟对象（mock\
  \ objects）。它们允许提供替代对象，以验证方法是否被正确调用、参数是否符合预期，并强制设定它们的返回值。\n\n通过这种技术，可以测试该对象的调用者方法以及它们与模拟对象的交互方式。在\
  \ JavaScript 中实现对象模拟相对简单，因为该语言不是强类型类型，且对象被视为属性和函数的简单数组。\n\n对象模拟的实现包括从另一个对象初始化一个空对象。该对象的方法与引用对象具有相同名称，但必须是空的。在执行模拟之前，测试会为模拟对象参数，设置将被调用的不同方法的预期结果。尽管\
  \ JavaScript 的模拟实现还不够完善，但有两个实现值得详细介绍。\n\n## 简单模拟的实现\n\n`jpspan` 网站在它的 wiki 上提供了一种\
  \ JavaScript 对象模拟的简单实现。\n\n该实现的代码可以在此处获取：`http://web.archive.org/web/20050205085833/http://jpspan.sourceforge.net/wiki/doku.php?id=javascript:mock`。\n\
  \n它的目标是记录一个 JavaScript 对象方法调用的次数。\n\n在一切之前，需要从一个类初始化模拟对象，如下代码所示：\n\n```javascript\n\
  function testSimulacreSimple() {\n  var simulacre = MockCreate(StringBuffer);\n\
  \  (...)\n}\n```\n\n从这一刻起，模拟对象包含了与初始类相同的方法，但这些方法不返回任何值。因此，必须配置模拟对象以指定所需的返回值。以下代码说明了这种配置：\n\
  \n```javascript\nfunction testToString() {\n  var simulacre = MockCreate(StringBuffer);\n\
  \  simulacre.setReturnValue(\"toString\",\"Mon résultat\");\n  (...)\n}\n```\n\n\
  此后可以在模拟对象上调用 `toString` 方法，它现在会返回值 \"Mon résultat\"。此外，该实现还提供了获取与被调用方法相关信息，如下代码所示：\n\
  \n```javascript\nfunction testToString() {\n  var simulacre = MockCreate(StringBuffer);\n\
  \  simulacre.setReturnValue(\"toString\",\"Mon résultat\");\n  simulacre.toString();\n\
  \  alert(\"La méthode maMethode a été appelée \"\n  + simulacre.getCallCount(\"\
  toString\")+\" fois\");\n  alert(\"L’argument du dernier appel de la méthode est\
  \ \"\n  + simulacre.getLastCallArgs(\"toString\")[0]);\n}\n```\n\n## 基于 JsUnit 的模拟实现\n\
  \n第二种实现正在集成到 `JsUnit` 框架中，更为先进。然而，它的缺点是使用了该框架的函数，因此没有它就无法使用。\n\n该实现的代码和文档可以通过地址\
  \ `http://micampe.it/bzr/jsmock/` 和 `http://micampe.it/wiki/JavascriptMockObjects`\
  \ 获取。\n\n与之前的实现一样，必须使用目标类初始化模拟对象。该实现通过 `_expect` 方法指定对象将被调用的方法参数和返回值。以下代码说明了这种配置：\n\
  \n```javascript\nfunction testToString() {\n  var simulacre = MockCreate(StringBuffer);\n\
  \  simulacre._expect(\"toString\",\n  [\"Mon parametre\"], \"Mon resultat\");\n\
  \  (...)\n}\n```\n\n一旦完成配置，就可以对模拟对象执行不同的方法调用。模拟对象的 `_verify` 方法允许验证执行情况是否符合预期结果，如下代码所示：\n\
  \n```javascript\nfunction testToString() {\n  var simulacre = MockCreate(StringBuffer);\n\
  \  simulacre._expect(\"toString\",\n  [], \"Mon resultat\");\n  var resultat = simulacre.toString();\n\
  \  simulacre._verify();\n  assertEquals(resultat, \"Mon resultat\");\n}\n```\n\n\
  该实现还提供了 `_expectThrows` 方法，以便在调用给定方法时抛出异常。以下代码说明了该方法的使用：\n\n```javascript\nfunction\
  \ test() {\n  var simulacre = MockCreate(StringBuffer);\n  simulacre._expectThrows(\"\
  toString\",\n  [\"Mon parametre\"], \"Une exception\");\n  try {\n    var resultat\
  \ = simulacre.toString(\"Mon parametre\");\n    fail(\"Pas d’exception levée\");\n\
  \  } catch(err) {}\n  simulacre._verify();\n}\n```\n\n# 测试的\n\n在上一节中，我们描述了 `JsUnit`\
  \ 的工作原理，这些原理与 Java 世界中的 `JUnit` 类似。现在我们将关注如何在 JavaScript 应用程序中实现测试，以便检测可能的错误并提高它们的健壮性和质量。\n\
  \n为了描述实现 `JsUnit` 的方法，我们将以 `dojo` 库中的图形组件 `SortableTable` 为例。\n\n让我们从创建一个包含通过 `SortableTable`\
  \ 组件生成的表格的测试页面开始：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
  \ \"http://www.w3.org/TR/html4/loose.dtd\">\n<html\n<head>\n(...)\n<script language=\"\
  JavaScript\" type=\"text/javascript\">\nvar djConfig = {isDebug: true, debugAtAllCosts:\
  \ true };\n</script>\n<script type=\"text/javascript\" src=\"<DOJO_HOME>/dojo.js\"\
  ></script>\n<script language=\"JavaScript\" type=\"text/javascript\">\ndojo.require(\"\
  dojo.widget.SortableTable\");\ndojo.hostenv.writeIncludes();\n</script>\n<style\
  \ type=\"text/css\">\n(...)\n</style>\n</head>\n<body>\n<div class=\"tableContainer\"\
  >\n<table widgetId=\"testTable\" dojoType=\"SortableTable\" headClass=\"fixedHeader\"\
  \ tbodyClass=\"scrollContent\" enableMultipleSelect=\"true\" enableAlternateRows=\"\
  true\" rowAlternateClass=\"alternateRow\" cellpadding=\"0\" cellspacing=\"0\" border=\"\
  0\">\n<thead>\n<tr>\n<th field=\"Id\" dataType=\"Number\">Id</th>\n<th field=\"\
  Name\" dataType=\"String\">Name</th>\n<th field=\"Description\" dataType=\"String\"\
  \ sort=\"asc\">Description</th>\n</tr>\n</thead>\n```\n\n\n\n\n\n| # | 城市 | 描述 |\n\
  | :--- | :--- | :--- |\n| 1 | 南特 | 卢大西洋省首府 |\n| 2 | 巴黎 | 法国首都 |\n| 3 | 圣纳代 | 卢大西洋省副县\
  \ |\n\n现在我们的组件已经就绪，我们可以开始实现测试结构，首先需要指定 JsUnit 所需 JavaScript 文件的位置：\n\n```html\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n[\"http://www.w3.org/TR/html4/loose.dtd\"\
  ](http://www.w3.org/TR/html4/loose.dtd)\n<<html>\n<head>\n(...)\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"file://<JSUNIT_DIR>/jsunit/css/jsUnitStyle.css\">\n<script\
  \ language=\"JavaScript\" type=\"text/javascript\" src=\"file://<JSUNIT_DIR>/jsunit/app/jsUnitCore.js\"\
  ></script>\n<script language=\"JavaScript\" type=\"text/javascript\">\nvar djConfig\
  \ = {isDebug: true, debugAtAllCosts: true };\n</script>\n<script type=\"text/javascript\"\
  \ src=\"../../../dojo.js\"></script>\n<script language=\"JavaScript\" type=\"text/javascript\"\
  >\ndojo.require(\"dojo.widget.SortableTable\");\ndojo.hostenv.writeIncludes();\n\
  function testExistenceTableau() {\n(...)\n}\nfunction testChargementDonneesTableau()\
  \ {\n(...)\n}\nfunction testTriDonneesTableau() {\n(...)\n}\n</script>\n</head>\n\
  <body>\n<div class=\"tableContainer\">\n(...)\n</div>\n</body>\n</html>\n```\n\n\
  接下，我们实现这三个测试函数。第一个函数 `testExistenceTableau` 检查图形组件是否已正确创建，以及是否可以通过 `dojo.widget.byId`\
  \ 方法引用它。第二个函数 `testChargementDonneesTableau` 检查表格数据是否已由组件正确加载。第三个函数 `testTriDonneesTableau`\
  \ 检查表格渲染是否根据创建表格时指定的最后一列进行了正确排序。\n\n第一个测试函数简单地检查 `dojo` 库的 `dojo.widget.byId` 方法是否返回了组件的实例：\n\
  \n```javascript\nfunction testExistanceTable() {\nvar monTableau = dojo.widget.byId(\"\
  monTableau\");\nassertNotUndefined(monTableau);\nassertNotNull(monTableau);\n}\n\
  ```\n\n第二个函数依赖于表格数据的内部存储结构，以检查所有指定的数据是否存在。由于组件是按照定义的方式存储数据，因此我们不需要担心可能的排序问题。由于组件定义了不同列的类型，我们在验证这些值时必须考虑到这一点。由于组件以对象的形式管理数据，因此必须使用\
  \ `assertObjectEquals` 函数：\n\n```javascript\nfunction testLoadTable() {\nvar monTableau\
  \ = dojo.widget.byId(\"monTableau\");\nvar donnees = monTableau.data;\nassertEquals(donnees.length,3);\n\
  // 第一行\nvar donneesPremiereLigne = donnees[0];\nassertObjectEquals(donneesPremiereLigne[\"\
  Id\"],1);\nassertObjectEquals(donneesPremiereLigne[\"Name\"],\"Nantes\");\nassertObjectEquals(donneesPremiereLigne[\"\
  Description\"], \"Préfecture de Loire-Atlantique\");\n// 第二行\nvar donneesSecondeLigne\
  \ = donnees[1];\nassertObjectEquals(donneesSecondeLigne[\"Id\"],2);\nassertObjectEquals(donneesSecondeLigne[\"\
  Name\"],\"Paris\");\nassertObjectEquals(donneesSecondeLigne[\"Description\"], \"\
  Capitale de la France\");\n// 第三行\nvar donneesTroisiemeLigne = donnees[2];\nassertObjectEquals(donneesTroisiemeLigne[\"\
  Id\"],3);\nassertObjectEquals(donneesTroisiemeLigne[\"Name\"], \"Saint-Nazaire\"\
  );\nassertObjectEquals(donneesTroisiemeLigne[\"Description\"], \"Sous-préfecture\
  \ de Loire-Atlantique\");\n}\n```\n\n最后一个测试函数直接依赖组件的 DOM 树来验证排序功能（排序仅在通过渲染方法 `render`\
  \ 进行显示时完成）：\n\n```javascript\nfunction testTriDonneesTableau() {\nvar monTableau=dojo.widget.byId(\"\
  monTableau\");\nvar dom = monTableau.domNode;\nassertEquals(dom.rows.length,4);\n\
  // 第一行\nvar premiereLigne = dom.rows[1];\nassertObjectEquals(premiereLigne.cells[0],\"\
  2\");\nassertObjectEquals(premiereLigne.cells[1],\"Paris\");\nassertObjectEquals(premiereLigne.cells[2],\
  \ \"Capitale de la France\");\n// 第二行\nvar secondeLigne = dom.rows[2];\nassertObjectEquals(secondeLigne.cells[0],\"\
  1\");\nassertObjectEquals(secondeLigne.cells[1],\"Nantes\");\nassertObjectEquals(secondeLigne.cells[2],\
  \ \"Préfecture de Loire-Atlantique\");\n// 第三行\nvar troisiemeLigne = dom.rows[3];\n\
  assertObjectEquals(troisiemeLigne.cells[0],\"3\");\nassertObjectEquals(troisiemeLigne.cells[1],\"\
  Saint-Nazaire\");\nassertObjectEquals(troisiemeLigne.cells[2], \"Sous-préfecture\
  \ de Loire-Atlantique\");\n}\n```\n\n## JavaScript 单元测试的局限性\n\n测试的实现并不总是可能的，因为某些机制（例如\
  \ Ajax 的异步机制）增加了实现的复杂性。此外，Ajax 还施加了安全限制。例如，使用该技术的调用只能从加载页面的机器发起。在这种情况下，`JsUnit`\
  \ 的 HTML 启动器必须在 HTTP 服务器上运行测试页面。该服务器也必须是测试 Ajax 用的目标。\n\n尽管如此，单元测试可以测试 JavaScript\
  \ 应用程序在事件触发方面的正常运行，因为该语言允许对其进行模拟。然而，这种模拟是特定于浏览器的。\n\n例如，Firefox 允许为此使用 DOM 2 级的功能。`document`\
  \ 对象的 `createEvent` 方法创建事件，然后通过调用 `initMouseEvent` 方法初始化由鼠标触发的事件。最后，通过 `dispatchEvent`\
  \ 方法触发该事件。\n\n以下代码展示了在 Firefox 中对该技术的实现：\n\n```javascript\nvar traiterEvenementAppelee\
  \ = false;\nfunction traiterEvenement(evenement) {\ntraiterEvenementAppelee = true;\n\
  }\nfunction testSimulationEvenementsFirefox() {\nvar elt = document.getElementById(\"\
  monId\");\nvar evt = document.createEvent(\"MouseEvents\");\nevt.initMouseEvent(\"\
  click\", true, true, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);\n\
  elt.dispatchEvent(evt);\nif( !traiterEvenementAppelee ) {\nfail();\n}\n}\n}\n```\n\
  \n## 结论\n\n单元测试并不仅适用于 Java、C++ 或 .Net 等“高级”语言。通过使用 `JsUnit`（一种 xUnit 家族的工具），可以对\
  \ JavaScript 应用程序进行测试，以增强健健性并验证它们在不同浏览器中的运行情况。\n\n\n\n\n遗憾，JsUnit 目前不支持格式化测试结果，也不支持\
  \ Java 世界中 `JUnit` 工具的 `Ant junitreport` 任务。\n\n然而，必须意识到，由于 JavaScript 使用了不同的机制（特别是\
  \ Ajax 的异步机制），测试的实现并不总是是轻而易举的。\n\n# 第 16 章：工具\n\n本章介绍了多种工具，旨在为实现 JavaScript 应用程序提供一个友好且高效的环境。我们首先从\
  \ JavaScript 代码的开发和调试工具开始，最后介绍用于优化基于 JavaScript 语言的 Web 应用程序的元素。\n\n本章并非要穷尽详举，仅考虑了作者认为不可或缺的某些工具。\n\
  \n## 开发工具\n\n顾其名，JavaScript 是一种脚本语言。因此，一个简单的文本编辑器就足以编写基于该语言的程序。带有语法高色的文本编辑器可以提高代码的可读性，但无法提供一个友好且高效的开发环境。\n\
  \n文本编辑器很快就会达到其局限性，因为它没有提供任何自动输入辅助功能，更不用说能够调试脚本的功能了。`Eclipse` 的插件 `ATF` 通过提供一个用于\
  \ JavaScript 应用编码和调试的完整环境，为这些困难提供了切实的解决方案。\n\n## 辅助工具\n\n### ATF (Ajax Toolkit Framework)\n\
  \n开源工具 `ATF` 为 `Eclipse` 提供了一个扩展，以便为 Web 应用程序开发提供完整的环境。\n\n#### Eclipse\n\n`Eclipse`\
  \ 是一个开源开发平台，通过添加插件可以扩展和适应。该开发环境旨在通用的，因为它具有集成各种功能的能力。`Eclipse` 的子项目 `WTP`（Web Tools\
  \ Platform）添加了一组与 Web 相关的功能，特别是 HTML 编辑器、CSS 样式表编辑器和 JavaScript 编辑器。\n\n`ATF` 丰富了\
  \ `WTP`（Web Tools Platform）分发的功能，因此安装 `ATF` 的前提是拥有 `WTP` 环境，可以在地址 `http://www.eclipse.org/webtools/`\
  \ 下载。一旦安装了 `WTP`，只需安装 `ATF`，它可以在 `http://www.eclipse.org/atf/` 获取。\n\n#### 基础功能\n\
  \n`ATF` 提供了一个完整的 JavaScript 开发环境，包括输入过程中的语法检查功能。它还提供了代码自动补全，通过为给对象提供可用方法或属性为代码输入提供帮助。\n\
  \n在本节中，我们只讨论与 JavaScript 语言相关的功能，但 `ATF` 提供了一整系列功能，允许编写 HTML 页面并实现 CSS 样式。\n\n`ATF`\
  \ 允许直接在工具中测试 Web 应用程序，无需借助外部浏览器。这一功能的实现是通过集成 `Mozilla` 浏览器实现的。\n\n同样，JavaScript\
  \ 脚本的调试可以直接在工具中进行，不需要外部调试器。对 `DOM` 树的检查（允许可视化 页面在内存中的表示）也基于这一原理。\n\n图 16.1 展示了 `ATF`\
  \ 在 `Eclipse` 开发环境中提供的图形界面。\n\n![](img/index-490_1.jpg)\n\n**图 16.1：ATF 工具的图形界面**\n\
  \n我们可以看到与 JavaScript 语言相关的主要输入辅助，以及通过包含可用方法的框架来显示 `DOM` 对象方法的辅助。包含语法错误的行会被下划线标记。\n\
  \n#### JavaScript 库支持\n\n除了 JavaScript 语言的语法高亮、自动补全和输入语法检查外，`ATF` 还提供了一组用于生成代码助手。它提供了用于生成\
  \ `dojo` 库周围骨架的助手，特别允许创建新的 `dojo` 图形组件。\n\n![](img/index-491_1.jpg)\n\n**图 16.2：dojo\
  \ 图形组件生成助手**\n\n图 16.2 展示了最后一个助手的实现。该助手允许生成定义 `dojo` 图形组件的不同元素，特别是模板、样式表以及包含小部件结构的\
  \ JavaScript 类。\n\n以下代码详细说明了基于 `dojo` 助手生成的图形组件的 JavaScript 类：\n\n```\ndojo.provide(\"\
  dojo.widget.monWidget\");\ndojo.require(\"dojo.event.*\");\ndojo.require(\"dojo.widget.*\"\
  );\ndojo.require(\"dojo.graphics.*\");\ndojo.require(\"dojo.fx.html\");\ndojo.require(\"\
  dojo.style\");\ndojo.widget.monWidget = function(){\n    dojo.widget.HtmlWidget.call(this);\n\
  \    this.templatePath = dojo.uri.dojoUri(\"src/widget/templates/monWidget.html\"\
  );\n    this.templateCssPath = dojo.uri.dojoUri(\"src/widget/templates/monWidget.css\"\
  );\n    // 继承的属性\n    this.isContainer = true;\n    this.widgetType = \"monWidget\"\
  ;\n    /*\n    * 修改 HTML 模板\n    */\n    this.fillInTemplate = function(args, frag){\n\
  \    };\n}\ndojo.inherits(dojo.widget.monWidget, dojo.widget.HtmlWidget);\ndojo.widget.tags.addParseTreeHandler(\"\
  dojo:monWidget\");\n```\n\n名为 `snippets` 的其他助手允许在 HTML 页面中添加 `dojo` 图形组件。这些助手提供了各种对话框来配置图形组件。\n\
  \n图 16.3 展示了用于配置 `FloatingPane` 图形组件的对话框。该图形组件是一个可以移动的窗口。\n\n**图 16.3：用于 FloatingPane\
  \ 属性输入的对话框**\n\n在对话框中选择 `Insert` 按钮会产生以下 HTML 代码：\n\n```html\n<div dojoType=\"FloatingPane\"\
  \ widgetId=\"floatingPaneId\" title=\"Pane Title\" constrainToContainer=\"1\" style=\"\
  width: 100px; height: 100px; left: 10px; top: 10px;\">\n</div>\n```\n\n尽管如此，请注意该工具非常面向\
  \ Java/J2EE，并且强制要求 J2EE 服务器来调试 JavaScript 应用程序。此外，`ATF` 支持许多 JavaScript 库，但还没有 `dojo`\
  \ 的 0.3 版本。\n\n![](img/index-493_1.jpg)\n\n\n\n这些工具避免了基于警报消息（`alert` 函数）的调试，这种方法很快就会达到其局限性并变得繁琐。\n\
  \n## Firefox JavaScript 控制台\n\nFirefox 浏览器配备了一个 JavaScript 控制台，用于收集所有的错误、警告或 JavaScript\
  \ 消息。该控制台可以通过“工具”菜单访问。\n\n一旦发生错误，控制台就会出现一行，显示错误的发生上下文、文件名以及行号。根据这些信息，可以相对容易地识别执行过程中的错误。\n\
  \n在脚本的调试阶段，我们建议始终打开此控制台以检查其运行是否正常。\n\n图 16.4 展示了控制台的界面。\n\n**图 16.4**\n*Firefox\
  \ JavaScript 控制台*\n\nJavaScript 控制台会保留在访问过的网页中产生的所有错误。然而，它并不允许针对特定的网页或脚本过滤错误。若要查看单个页的错误，必须先通过“清除”按钮清理控制台。\n\
  \n## 用于 Firefox 的 FireBug\n\n在 Firefox 中进行 JavaScript 调试需要安装该浏览器的扩展。由于本章的目的并非详尽介绍所有可用扩展，因此我们重点介绍了\
  \ FireBug 扩展作为示例。\n\nFireBug 由 Joe Hewitt 开发，地址为 `https://addons.mozilla.org/fire-fox/1843`\
  \ (`fox/1843/`)。安装后，可以通过“工具/FireBug”菜单访问调试功能。\n\n该扩展允许通过跟踪方法调用来逐步调试 JavaScript 脚本，并以此视觉化所存在对象的值。控制台功能提供了仅查看当前页面错误的功能。开发者可以借此最好地定位错误发生的位置。\n\
  \n通过 FireBug，可以现场执行 JavaScript 代码，从而在 HTML 页面的执行上下文中触发任何方法。\n\nDom 检查器（inspecteur\
  \ Dom）允许详细查看网页的 DOM 树。当 Dom 树在 JavaScript 中被被修改时，此功能显得尤为适用。\n\n最后，FireBug 还提供了一个分析与\
  \ Ajax 交换流的模块，特别是通过 `XMLHttpRequest` 类进行的交互。\n\n为了说明此调试器的工作原理，我们来看以下源代码：\n\n```html\n\
  <html\n<head>\n<title>FireBug</title>\n<script type=\"text/javaScript\">\n// 包含错误代码的函数\n\
  function fonctionEnErreur(){\nAlErt(\"test console\"); // ❶\n}\n\n// 实现 Dom 检查器\n\
  function utilisationInspecteurDom(){\nvar zone = document.getElementById(\"maZone\"\
  );\nvar lbl = document.createElement(\"label\"); // ❷\nvar txt = document.createTextNode(\"\
  libellé\");\nlbl.appendChild(txt);\nzone.appendChild(lbl);\n}\n\n// 使用逐步调试器\nfunction\
  \ calcul(){\nvar i=0;\nfor (i=0; i < 10; i++){\nj = j + 2;\n}\n}\n</script>\n</head>\n\
  <body onload=\"fonctionEnErreur()\">\n<div id=\"maZone\">\n</div>\n<input type=\"\
  button\" onclick=\"utilisationInspecteurDom()\" value=\"inspecteur DOM\">\n<input\
  \ type=\"button\" onclick=\"calcul()\" value=\"Calcul\"/>\n</body>\n</html>\n```\n\
  \n上述代码在标记 ❶ 处故意包含了一个语法错误。当打开此示例时，控制台会如图 16.5 所示显示出该错误。\n\n**图 16.5**\n*在 FireBug\
  \ 控制台中显示错误*\n\n请注意 FireBug 定位语法错误的精确度。现在我们将使用 DOM 检查器来查看 label 标签的动态创建（标记 ❷）。\n\n\
  点击 DOM 检查器按钮可以触发页面上标签的添加。DOM 检查器（`Inspector` 标签页）显示了 `label` 标签的添加，如图 16.6 所示。\n\
  \n**图 16.6**\n*FireBug 的 DOM 检查器*\n\nDOM 检查器允许查看 HTML 页面的整个内存结构，以及样式表或脚本。如前所述，调试器允许跟踪代码的逐步执行，并在执行过程中评估变量。\n\
  \n像所有调试器一样，它的使用依赖于设置断点（points d’arrêt）。这些断点告诉调试器我们希望在哪些指令处停止执行以便分析代码。\n\nFireBug\
  \ 调试器可以通过 `Debugger` 标签页访问，它在打开时会显示页面的源代码。在此阶段，添加断点只需点击某行即可。它们在视觉上用红圆圈表示。\n\n如果我们在之前的代码中通过点击\
  \ `calcul` 函数的第一行来该函数设置一个断点，那么当通过点击页面上的“Calcul”按钮调用该函数时，高亮行将指示执行已在该处停止。\n\n图 16.7\
  \ 展示了这种实现。\n\n**图 16.7**\n*FireBug 中的逐步调试*\n\n现在，可以通过 `Debugger` 标签页底部的命令按钮逐步执行代码。在指令推进期间，不同变量的值如图\
  \ 16.8 所示呈现。\n\n**图 16.8**\n*FireBug 调试过程中的变量可视化*\n\n正如我们所看到的，FireBug 扩展提供了许多对于调试和修复在\
  \ Firefox 浏览器中编写的 JavaScript 脚本的重要功能。\n\n## Internet Explorer 中的调试\n\n在 Internet\
  \ Explorer 浏览器中也可以通过 Microsoft Script Debugger 工具进行脚本调试。该工具从 Microsoft 下载中心获取，允许查看\
  \ JavaScript 代码以设置断点并逐步执行代码。\n\nScript Debugger 提供了命令行窗口查看并修改变量，并查看调用堆栈。此功能允许跟踪方法调用的链。\n\
  \n\n\n一旦设置了断点，只需点击网页上的“计算”按钮即可到达第一个断点。随后，使用功能键 F8 可以逐行执行指令。\n\n与 FireBug 不同，变量的值不会被显示，其可视化仍需由用户通过控制台窗口主动发起的。\n\
  \n![](img/index-499_1.jpg)\n\n### 辅助工具\n\n图 16.10 展示了我们示例中变量 `j` 的可视化。\n\n**图 16.10**\n\
  在 Internet Explorer 中单步执行执行时的变量可视化。Internet Explorer 脚本调试器提供了调试 JavaScript 脚本的主要功能，但\
  \ DOM 浏览器除外，尽管 DOM 浏览器对于实现 JavaScript 应用非常有用。\n\n### 使用 dojo 进行调试\n\n由于 dojo 模块是动态加载的，在该库中进行调试变得棘手。\n\
  \n由于脚本是通过 Ajax 请求按需加载，然后通过 `eval` 函数进行动态评估，因此不允许进行调试。为了实现这一功能，必须修改脚本的加载策略。\n\ndojo\
  \ 配置（`djCOfig` 对象）中的 `debugAtAllCosts` 属性允许通过在网页头部动态添加 `<script>` 标签来加载不同的脚本。\n\n\
  ### 工具集\n\n以下代码提供了一个配置 dojo 库时激活调试（标记 ❶）的示例：\n\n```javascript\ndjConfig = {\n  isDebug:\
  \ true,\n  debugAtAllCosts: true // ❶\n};\n```\n\n`debugAtAllCosts` 属性应仅在调优或查找故障的阶段激活，绝对不能在生产环境中使用，因为它对性能的影响不容忽视。\n\
  \n### 内存泄漏检测\n\nJavaScript 语言依赖垃圾回收机制（garbage collector）来管理内存。\n\n当一个对象不再被引用时，垃圾回收器就会将其从内存中移除。如果一个对象仍然被引用，内存就无法被释放，导致内存泄漏。\n\
  \n在 JavaScript 开发中，内存泄漏通常发生在以下情况：\n- 全局变量意外引用了不再使用的对象。\n- 未清除的定时器（如 `setTimeout`\
  \ 或 `setInterval`）。\n- 未解绑的事件监听器。\n- 闭包引用的外部变量。\n\n为了检测这些内存泄漏，开发者可以使用浏览器提供的调试工具（如\
  \ Chrome 开发者工具中的“内存”面板）。通过获取内存快照（Snapshot），可以分析哪些对象在持续增长。\n\n\n\n\n多种工具可以通过删除空格、注释和换行符来压缩脚本。\n\
  \ndojo 社区提供了一种更强大的工具，它通过更短的名称对变量进行重命名。\n\nLivreGougeon 第 487 页 2006 年 11 月 28 日\
  \ 周二 4:23 16\n\n## 工具\n\n**487**\n\n# 第 16 章\n\ndojo 压缩工具以可下载的 Java 程序的的形式提供，地址为\
  \ [`dojotoolkit.org/docs/compressor_system.html`](http://dojotoolkit.org/docs/compressor_system.html)。它基于\
  \ `Rhino` 引擎，允许解释 `JavaScript` 脚本并缩短变量名的长度。\n\n其运行至少需要一个 Java `1.4` 版本的虚拟机。\n\n\
  在上一节介绍的示例上运行压缩工具，得到如下结果：\n\n```javascript\nfunction Utilisateur(){\nthis.getClassName=function(){\n\
  };\n}\n\nUtilisateur.prototype.getNom=function(){\n};\n\nUtilisateur.prototype.setNom=function(_1){\n\
  this.nom=_1;\n};\n\nUtilisateur.prototype.getAge=function(){\n};\n\nfunction Administrateur(){\n\
  }\n```\n\n注意，注释已被删除，且 `setNom` 方法的参数 `nom` 被替换为参数 `_1`。该 `JavaScript` 脚本的大小从 1068\
  \ 字节减少到了 237 字节。\n\n### 动态加载\n\n在 `JavaScript` 中使用类通常涉及为每个类创建一个相应的 `JavaScript`\
  \ 源文件。这种方法允许接近 `Java` 语言中类的存储方式。这些类（更准确地说说是脚本文件）随后由浏览器按需加载。\n\n`dojo` 库使用这一概念进行类拆分。类的动态加载通过\
  \ `Ajax` 请求按需执行，将脚本文件内容带回浏览器并进行求值。\n\n这种加载模式所需的 `Ajax` 调用次数等于需要加载的类数量。然而，重要的是，调用大量的\
  \ `Ajax` 请求会严重影响响应时间。每一个 `Ajax` 请求本质上都是一个 `HTTP` 请求。\n\n为了限制这些请求的数量并优化网页加载时间，最好将最常用的类合并到同一个\
  \ `JavaScript` 文件中。这样，大量微小的 `Ajax` 请求将被替换为几个大型 `Ajax` 请求，从而缩短 `JavaScript` 脚本的加载时间。\n\
