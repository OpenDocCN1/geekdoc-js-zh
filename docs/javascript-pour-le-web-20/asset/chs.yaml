  \ true 值使用 `visible`，对 false 值使用 `hidden`。 |\n| `dojo.html.setOpacity` | 一个节点和一个数字\
  \ | 设置节点的透明度值。可能的值范围在 0.0 到 1.0 之间，分别对应透明显示和不透明显示。 |\n| `dojo.html.setShowing` |\
  \ 一个节点和一个标记 | 根据标记调用 `dojo.html.show` 或 `dojo.html.hide` 函数。 |\n| `dojo.html.setVisibility`\
  \ | 一个节点和一个字符串或布尔值 | （与 `dojo.html.setDisplay` 相同的描述） |\n| `dojo.html.show` | 一个节点\
