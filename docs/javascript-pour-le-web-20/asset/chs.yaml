  \ | 从传递参数的节点 CSS 类列表中删除一个 CSS 类。标记指定名称是否必须与类名精确匹配。 |\n| `dojo.html.replaceClass`\
  \ | 一个节点、要替换的类和新类 | 为传递参数的节点将一个 CSS 类替换为另一个。 |\n| `dojo.html.setClass` | 一个节点和一个字符串\
  \ | 将一个字符串设置为传递参数节点的 `class` 属性值。 |\n| `dojo.html.setStyle` | 一个节点、一个 CSS 选择器和一个值\
  \ | 设置节点的某个样式属性。 |\n\n由于 Web 浏览器并不总是良好地处理标签类的修改，我们建议使用 `style` 属性来修改 DOM 节点的样式属性。\n\
  \n## 第四部分：图形 JavaScript 库\n\n如下代码所示，`dojo.html.getElementsByClassName` 函数提供了访问 Web\
