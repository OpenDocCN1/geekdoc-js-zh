  \ | 一个日期 | 返回参数传递的日期所在年份的周数。 |\n| `getYYYYMMDD` | 一个日期 | 返回参数传递的日期的字符串表示。该方法基于 `YYYY/MM/DD`\
  \ 格式，其中缩写 `DD`、`MM` 和 `YYYY` 与之前的元素相同。 |\n| `isBissextile` | 一个整数 | 判断某年份是否为闰年。\
  \ |\n| `isDate` | 一个字符串 | 判断一个字符串是否为 `DD/MM/YYYY` 格式。缩写 `DD`、`MM` 和 `YYYY` 与之前的元素相同。\
  \ |\n| `setDateFromYYYYMMDD` | 一个字符串 | 返回一个基于 `YYYY/MM/DD` 格式的参数日期字符串初始化的日期。缩写 `DD`、`MM`\
  \ 和 `YYYY` 与之前的元素相同。 |\n| `toDay` | - | 返回当前日期的对象。 |\n| `YYYYMMDDfromDDMMYYYY` |\
  \ 一个字符串 | 将字符串转换为 `YYYY/MM/DD` 格式的参数，代表 `DD/MM/YYYY` 格式的日期。缩写 `DD`、`MM` 和 `YYYY`\
  \ 与之前的元素相同。 |\n\n### rialto 库\n\n`rialto.date` 对象提供了多种方法用于将日期转换为字符串反之亦然。以下代码说明了\
  \ `getDDMMYYYY`（标记 ❶）和 `setDateFromYYYYMMDD`（标记 ❷）方法的实现，以完成此类类型转换：\n\n```javascript\n\
  var date = new Date(2006, 8, 10);\n// date 对应 2006 年 9 月 10 日\nvar chaine = rialto.date.getDDMMYYYY(date);\
  \ // ❶\n// chaine 包含值 10/09/2006 \nvar uneAutreDate = rialto.date.setDateFromYYYYMMDD(\"\
  20060910\"); // ❷\n// uneAutreDate 对应 2006 年 9 月 10 日\n```\n\n而 `add` 方法允许向日期添加时长，如后续代码所示：\n\
  \n```javascript\nvar date = new Date(2006, 8, 10);\nvar nouvelleDate = rialto.date.add(\"\
  month\", date, 1);\n/* nouvelleDate 对应在当前基础上增加一个月后的日期 */\n```\n\n`rialto.url` 对象提供了访问\
  \ Web 地址包含信息的方法。表 12.8 汇总了这些不同的方法。\n\n### 表格 12.8 `rialto.url` 对象的方法\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `getArrayParameter` | 返回一个包含当前页面不同参数的数组。其每个元素都对应一个包含参数键和值的数组。\
  \ |\n| `getObjectParameter` | 返回一个包含当前页面不同参数的对象。对象的属性对应于属性名。 |\n| `getSearch` |\
  \ 返回格式如下的当前页面参数字符串：`parametre1=valeur1&parametre2=valeur2`。 |\n| `getUrl` | 返回当前页面的地址。\
  \ |\n\n以下代码实现了表 12.8 中的各种方法，以便访问与页面地址相关的信息（标记 ❶）以及通过字符串访问页面参数字符串（标记 ❷）：\n\n```javascript\n\
  /* 浏览器中输入的页面地址为：\n   http://localhost/jsweb2.0/test.html?param1=valeur1&param2=valeur2\n\
  */\nvar adressePage = rialto.url.getUrl(); // ❶\n/* 变量 adressePage 包含值 \"http://localhost/jsweb2.0/test.html?param1=valeur1&param2=valeur2\"\
  \ */\nvar parametresPage = rialto.url.getSearch(); // ❷\n/* 变量 parametresPage 包含值\
  \ \"param1=valeur1&param2=valeur2\" */\n```\n\n### Ajax 技术支持\n\nrialto 库提供了 `rialto.io.AjaxRequest`\
  \ 类，以便实现基于 `XMLHttpRequest` 类的 Ajax 技术。`rialto.io.AjaxRequest` 类封装了此类异步请求的所有机制和周期。表\
  \ 12.9 汇总了 `rialto.io.AjaxRequest` 类构造函数的不同参数。\n\n### 表格 12.9 `rialto.io.AjaxRequest`\
  \ 类构造函数的参数\n\n| 参数 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `callBackObjectOnFailure`\
  \ | 一个对象 | 对应在失败时执行回调函数的对象。 |\n| `callBackObjectOnSuccess` | 一个对象 | 对应在成功时执行回调函数的对象。\
  \ |\n| `canBeCancel` | 一个布尔值 | 指定请求在执行过程中是否可以取消。 |\n| `method` | 一个字符串 | 对应执行请求的\
  \ HTTP 方法。 |\n| `onFailure` | 一个函数 | - |\n\n\n\n\n\n对应于请求失败时调用的回调函数。\n\n`onSuccess`\n\
  函数\n对应于请求成功时调用的回调函数。\n\n`url`\n字符串\n对应执行请求的资源地址。\n\n`withWaitWindow`\n布尔值\n指定执行请求时是否显示等待窗口。\n\
  \n请求的执行通过 `load` 方法实现，该方法接受一个包含输入数据的字符串作为参数。\n\n以下代码展示了如何基于该类初始化（标记 ❶）然后执行（标记 ❹）一个\
  \ Ajax 请求的示例：\n\n```javascript\nfunction traiterDonnees(requete) { (...) }\n\nfunction\
  \ traiterErreurs(requete) { (...) }\n\nvar requete = new rialto.io.AjaxRequest({\
  \ ❶\n  url:\"/ajax.html\",\n  method: \"get\",\n  withWaitWindow:true,\n  onSuccess:\
  \ traiterDonnees, ❷\n  onFailure: traiterErreurs ❸\n});\n\nvar parametres = \"parametre1=valeur1&parametre2=valeur2\"\
  ;\n\nrequete.load(parametres); ❹\n```\n\n此代码基于类的构造函数来初始化请求成功（标记 ❷）和失败（标记 ❸）时的回调函数。这些函数接受一个类型为\
  \ `XMLHttpRequest` 的当前请求对象作为参数。\n\n# rialto 库\n\n让我们以一个回调函数为例，其作用是获取响应中包含的信息。该函数基于\
  \ JSON 格式的响应，其内容由以下代码描述：\n\n```json\n{\n  \"donnees\": {\n    \"donnee1\": \"valeur1\"\
  ,\n    \"donnee2\": \"valeur2\"\n  }\n}\n```\n\n以下代码给出了如何实现回调函数以获取 JSON 格式响应中包含信息的示例：\n\
  \n```javascript\nfunction traiterDonnees(request){\n  eval(\"var objetReponse=\"\
  +request.responseText);\n  var donnees = objetReponse.donnees;\n  // 获取响应数据\n  var\
  \ donnee1 = donnees.donnee1;\n  // donnee1 包含值“valeur1”\n  var donnee2 = donnees.donnee2;\n\
  \  // donnee2 包含值“valeur2”\n}\n```\n\n请注意，`rialto` 库还提供了基于隐藏 iframe 实现 Ajax 技术的能力。\n\
  \n## 图形组件\n\n现在我们已经讨论了 `rialto` 库的基础知识，包括它的基础工具对象和对 Ajax 技术的支持，我们将重点关注它的图形支持。\n\n\
  ### 组件的结构化\n\n`rialto` 的图形组件对应一个 JavaScript 类，该类操作页面的内存结构以定义其结构以及外观，后者基于 CSS 样式。\n\
  \n`rialto` 库基于两个抽象基类来结构化图形组件：`AbstractComponent` 类和 `AbstractContainer` 类。\n\n第一个对应于\
  \ `rialto` 所有类型图形组件的基类。它提供了与组件尺寸、位置和外观相关的各种属性。\n\n第二个类扩展了第一个类，用于定义可以包含其他组件的基类。为此，它增加了添加和删除嵌套组件的方法。\n\
  \n图 12.1 展示了这两个类之间的关系及其不同的方法。\n\n**图 12.1 AbstractComponent**\n**AbstractComponent**\n\
  - `+moveTo()`\n- `+setLeft()`\n- `+setTop()`\n- `+setWidth()`\n\n**AbstractContainer**\n\
  - `+setHeight()`\n- `+setVisible()`\n- `+setDraggable()`\n- `+add()`\n- `+setPosition()`\n\
  - `+removeContents()`\n- `+setStyle()`\n- `+getHtmlCont()`\n- `+placeIn()`\n- `+remove()`\n\
  - `+getHtmlExt()`\n- `+getHtmlImp()`\n- `+getHtmlDD()`\n- `+getHtmlRZ()`\n\n基于这两个类，`rialto`\
  \ 提供了一组预定义的图形组件，其目标是实现复杂的 Web 图形界面。这些组件能够解决此类应用的主要问题。\n\n表格 12.10 总结了 `rialto` 库提供的不同组件族。\n\
  \n**表 12.10 rialto 库的图形组件族**\n\n| 族 | 描述 |\n| :--- | :--- |\n| 基础组件 | 对应表单的元素组件，如输入字段、选择框或按钮。\
  \ |\n| 表单管理 | 对应表单的支持，以便普通请求或 Ajax 请求提交数据。 |\n| 位置管理 | 对应实现区域并允许在网页中对其进行定位的组件。 |\n\
  | 窗口 | 对应允许在网页中显示窗口的图形组件。 |\n| 复杂组件 | 对应实现表格和树的组件。 |\n\n我们将详细介绍这些不同组件的特性以及如何在 JavaScript\
  \ 应用程序中实现它们。请注意，`rialto` 项目网站提供了 `rialto` JavaScript 库的在线演示应用。\n\n该应用可用地址为 [`rialto.application-servers.com/demoRialto.jsp`](http://rialto.application-servers.com/demoRialto.jsp)。\n\
  \n## 基础组件\n\n`rialto` 库的基础组件对应于表单的基础元素，如标签、输入区域和选择框，允许在网页中实现各种输入界面。\n\n图 12.2 展示了与此类组件实现的不同类。\n\
