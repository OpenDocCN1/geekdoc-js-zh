  \ `addMethods` | 一个对象和一个数组 | 允许向对象添加一组函数。 |\n| `extendObject` | 一个类和一个数组 | 允许向类的原型上添加一组函数。（或使用\
  \ `extend`）。 |\n| `isArray` | 一个对象 | 判断参数是否为数组。 |\n| `isBoolean` | 一个对象 | 判断参数是否为布尔值。\
