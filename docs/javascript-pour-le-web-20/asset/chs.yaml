  \ | 布尔值 | 指定节点初始是否为打开状态。 |\n| `reload` | 布尔值 | 指定节点是否可以根据 `url` 参数的值重新加载。 |\n| `text`\
  \ | 字符串 | 对应节点显示的文本。 |\n| `url` | 字符串 | 对应用于获取节点新值的地址。 |\n\n### 表 12.34 `rialto.widget.TreeNode`\
  \ 类的方法\n\n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| `addNode` | `rialto.widget`\
  \ 类型的节点 | 允许添加节点。 |\n| `existChild` | 字符串 | 如果存在与参数传递标识符对应的子节点，则返回 `true`。 |\n|\
