  sb.append(\"première chaîne\");\nsb.append(\" et \");\nsb.append(\"deuxième chaîne\
  \ \");\nvar resultat = sb.toString();\n```\n\n### 属性和方法的作用\n\nJavaScript 中变量的作用遵循非常精确的规则。\n\
  \n例如，使用 `var` 关键字定义的变量在它的整个块内以及声明之后都是的。在块之外使用它会产生错误，如下代码所示：\n\n```javascript\nfunction\
  \ test() {\n  var maVariable = \"test\";\n  alert(maVariable); //显示变量的内容\n}\n\n\
  test()\n\nalert(maVariable); //产生错误\n```\n\n如果未指定 `var` 关键字，我们可能会认为它是脚本的全局变量。实际上，JavaScript\
  \ 总是会将这种类型的变量绑定到对象上。\n\n\n\n\n\n如果没有特别说明，变量将自动绑定到 HTML 页面的 `window` 对象上。\n\n以下代码说明了这种机制：\n\
  \n```javascript\nmaVariable = \"une variable\";\nalert(maVariable);\nalert(window.maVariable);\n\
  ```\n\n实体 `maVariable` 和 `window.maVariable` 都是定义的并且包含相同的值。\n\nJavaScript 还提供了一个非常有趣的功能，允许将代码块中的所有变量绑定到一个对象上。这种机制可以通过\
  \ `with` 关键字来实现，如下所示所示：\n\n```javascript\nvar monInstance = new Object();\nwith(monInstance)\
  \ {\n  monAttribut = \"Un attribut\";\n}\nalert(\"monAttribut : \"+monInstance.monAttribut);\
  \ // 显示属性值\nalert(\"monAttribut : \"+monAttribut); // 产生错误\n```\n\n在不使用实例前缀访问属性的情况下，使用此功能可以简化\
  \ JavaScript 代码的编写。\n\nLivreGougeon 第 82 页 2006 年 11 月 28 日星期二 4:23 16\n\n## JavaScript\
  \ 基础\n\n**82**\n\n*第一部分*\n\n请注意，`with` 只能用于属性，而不能用于方法，如下代码所示：\n\n```javascript\n\
  var monInstance = new Object();\nwith(monInstance) {\n  maMethode = function() {\n\
  \    return \"Une valeur\";\n  }\n}\nalert(\"methode : \"+monInstance.maMethode());\
  \ // 产生错误\n```\n\n## 内存泄漏问题\n\n开发者必须意识到使用 `new` 关键字可以分配内存。与 Java 语言类似，JavaScript\
  \ 也拥有一种释放未使用内存的机制。该机制通过垃圾回收器（garbage collector）实现。它检测不再被任何对象引用的内存区域并释放它们。\n\n这种机制提供了一种不再需要管理内存的假象。事实并非如此。内存泄漏仍然发生，因为应用程序可能会间接影响解释器管理内存。\n\
  \n与 Java 不同，JavaScript 拥有 `delete` 关键字，允许强制释放对象分配的内存。\n\n两个常见问题是内存泄漏。第一个源于使用页面全局变量的类。这些变量可能是当前页面\
  \ DOM 树的元素。在这种情况下，这些类在页面关闭时才会释放。\n\n以下代码提供了该问题的示例：\n\n```javascript\nfunction MaClasse()\
  \ {\n  this.elementDOM = document.getElementById(\"monId\");\n  // (...)\n}\n```\n\
  \n第二个问题可能特定于浏览器。例如，Internet Explorer 在其垃圾回收器中存在 Bug，阻止了通过 `closures` 形成循环引用的页面对象的释放。\n\
  \n对象的循环引用对应于对自身的间接引用。\n\n例如，对象 `objet1` 引用对象 `objet2`，而 `objet2` 又引用自己 `objet1`。\n\
  \n当应用程序结合使用事件和闭包时，这种故障很容易发生。\n\n以下代码给出了在 Internet Explorer 中产生内存泄漏的示例（`fireOnLoad`\
  \ 函数绑定到 HTML 页面的加载事件）：\n\nLivreGougeon 第 83 页 2006 年 11 月 28 日星期二 4:23 16\n\n##\
  \ JavaScript 与面向对象编程\n\n**83**\n\n*第三章*\n\n```javascript\nfunction fireOnLoad()\
  \ {\n  var bouton = document.getElementById(\"monBouton\");\n  bouton.onClick =\
  \ function() { // ❶\n    alert(\"Valeur du bouton : \"+this.getValue());\n  };\n\
  }\n```\n\n内存泄漏发生在标记 ❶ 处。实例 `bouton` 引用一个匿名函数，该函数是一个 `closure`，并且它通过 `this` 关键字引用\
  \ `bouton` 实例。\n\n在这种情况下，建议不要使用 `closures`，或者正确取消与对象相关的所有事件引用。\n\n以下代码使用第一种方法来修复问题：\n\
  \n```javascript\nfunction handleClick() {\n  alert(\"Valeur du bouton : \"+this.getValue());\n\
  }\n\nfunction fireOnLoad() {\n  var bouton = document.getElementById(\"monBouton\"\
  );\n  bouton.onClick = handleClick;\n}\n```\n\n接下来说明了如何正确释放事件处理函数（`fireOnUnLoad`\
  \ 函数绑定到 HTML 页面的卸载事件）：\n\n```javascript\nfunction fireOnUnLoad() {\n  var bouton\
  \ = document.getElementById(\"monBouton\");\n  bouton.onClick = null;\n}\n```\n\n\
  ## 结论\n\nJavaScript 语言并不是面向对象的语言。虽然它允许使用对象并拥有原生对象，但它没有提供支持这种范式的语言元素。然而，它可以通过基于函数和闭包（`closures`）、`this`\
  \ 关键字以及函数的 `prototype` 属性来模拟面向对象编程的不同原则。\n\n多种技术可以实现类、对象以及继承。这些技术并非完全对等，并且在不同程度上支持面向对象编程的概念。\n\
  \n\n\n\n\nLe DOM niveau 2, publié en 2000, apporte de nouvelles fonctionnalités,\
  \ notamment l’ajout de vues filtrées, la gestion des événements et de feuilles de\
  \ style et de nouvelles méthodes de parcours de l’arbre. Ce niveau correspond à\
  \ la dernière version finalisée de la spécification.\n\nLe DOM niveau 3 est en cours\
  \ de spécification. Il ajoute une interface permettant les opérations de chargement\
  \ et de sauvegarde du document sous forme XML. Il offre également la possibilité\
  \ d’utiliser des expressions XPath afin d’exécuter des requêtes de recherche dans\
  \ l’arbre. Il supporte en outre les espaces de nommage de XML.\n\n### Support par\
  \ les navigateurs Web\n\nLes navigateurs Web sont apparus bien avant la normalisation\
  \ du DOM. De ce fait, leur support du DOM prend plus ou moins en compte les niveaux\
  \ des spécifications et comporte généralement des extensions propriétaires non normalisées.\n\
  \nPour des raisons de portabilité des applications, l’appel des méthodes des extensions\
  \ propriétaires est déconseillé. Il est cependant parfois inévitable lors du développement\
  \ de certaines fonctionnalités. Dans ce cas, il est préférable d’utiliser une couche\
  \ d’abstraction afin de garantir le portage et de ne plus avoir à se soucier des\
  \ problèmes d’incompatibilité entre navigateurs.\n\nLe tableau 4.1 récapitule le\
  \ support du DOM par les principaux navigateurs HTML.\n\n**Tableau 4.1 Support des\
  \ spécifications du DOM par les navigateurs**\n\n| Navigateur | Description |\n\
  | :--- | :--- |\n| Internet Explorer 5+ | Support partiel du niveau 1 |\n| Mozilla/Firefox\
  \ | Support des niveaux 1 et 2 et partiel du niveau 3 |\n| Opera 7+ | Support des\
  \ niveaux 1 et 2 et partiel du niveau 3 |\n| Safari | Support des niveaux 1 et 2\
  \ |\n\n### Structure du DOM\n\nPour détailler la structure d’un arbre DOM ainsi\
  \ que ses entités de base, nous nous appuyons sur les fonctionnalités présentes\
  \ dans les niveaux 1 et 2 du DOM.\n\nTout langage de balises possède une structure\
  \ logique arborescente dont la représentation objet correspond au DOM. Cette dernière\
  \ fournit des méthodes permettant de parcourir cet arbre et éventuellement de le\
  \ modifier.\n\nAfin de détailler la structure du DOM, nous recourons tout au long\
  \ des sections suivantes à un exemple simple de fragment HTML, qui comprend une\
  \ balise racine div contenant deux blocs HTML, l’un délimité par la balise span\
  \ et l’autre par une autre balise div :\n\n```html\n<div id=\"maZone\">\n  <span><b>Un\
  \ texte</b></span>\n  <div id=\"monAutreZone\">\n    Un autre texte\n  </div>\n\
  </div>\n```\n\nCe fragment de code HTML correspond à la structure hiérarchique illustrée\
  \ à la figure 4.1. L’objet `document` en est la racine. Les balises HTML sont reliées\
  \ entre elles par des relations parent ou enfant.\n\n**Figure 4.1 : Structure de\
  \ l’arbre DOM du code HTML**\n\nAvec le DOM, chacune des balises HTML possède une\
  \ représentation objet correspondant à son nom. Dans l’exemple ci-dessus, la balise\
  \ `div` est représentée par un objet de type `HTMLDivElement` et la balise `span`\
  \ par `HTMLSpanElement`.\n\nNous pouvons remarquer que les nœuds peuvent être de\
  \ différents types. Dans notre exemple, le deuxième nœud représente une balise et\
  \ le cinquième un attribut de cette dernière.\n\n### La classe Node\n\nLa classe\
  \ centrale représentant un nœud DOM est `Node`. Elle définit différentes propriétés\
  \ afin de donner accès aux informations relatives au nœud.\n\nLe tableau 4.2 récapitule\
  \ les principales propriétés.\n\n**Tableau 4.2 Propriétés de Node**\n\n| Propriété\
  \ | Description |\n| :--- | :--- |\n| `attributes` | Attributs du nœud |\n| `nodeName`\
  \ | Nom du nœud |\n| `nodeType` | Type du nœud *(voir la section suivante)* |\n\
  | `nodeValue` | Valeur du nœud |\n| `ownerDocument` | Référence le document dans\
  \ lequel se trouve le nœud |\n\nDans notre exemple, la balise identifiée par `maZone`\
  \ est une `div`. Sa `nodeType` est 1.\n\n### Types des nœuds\n\nUn arbre DOM regroupe\
  \ un ensemble de nœuds représentant différentes entités. Comme la classe `Node`\
  \ est générique, elle contient une propriété `nodeType` dont la valeur est un entier.\n\
  \nAfin de faciliter l’utilisation de cette propriété, la classe `Node` définit les\
  \ constantes récapitulées au 4.3.\n\n**Tableau 4.3 Constantes de la classe Node\
  \ définissant les types de nœuds**\n\n| Constante | Valeur | Description |\n| :---\
  \ | :--- | :--- |\n| `ATTRIBUT_NODE` | 2 | Attribut d’une balise de l’arbre |\n\
  | `COMMENT_NODE` | 8 | Balise de commentaire |\n| `DOCUMENT_FRAGMENT_NODE` | 11\
  \ | Nœud racine d’un fragment d’arbre |\n| `DOCUMENT_NODE` | 9 | Nœud racine de\
  \ l’arbre. Il s’agit du type de l’objet document. |\n| `ELEMENT_NODE` | 1 | Balise\
  \ de l’arbre |\n| `TEXT_NODE` | 3 | Nœud texte de l’arbre |\n\n### Manipulation\
  \ des éléments\n\nNous allons à présent détailler les différentes API permettant\
  \ de manipuler les éléments d’un arbre. Toutes les techniques décrites dans cette\
  \ section correspondent au niveau 1 de la spécification.\n\n#### Accès direct aux\
  \ éléments\n\nPour accéder au nœud d’un document afin de pouvoir le manipuler par\
  \ la suite, une méthode simple consiste à identifier ce nœud par un attribut id.\
  \ La méthode `getElementById` de l’objet `document` peut ensuite se fonder sur ce\
  \ dernier pour récupérer l’instance correspondante.\n\n```javascript\nvar zone =\
  \ document.getElementById(\"maZone\");\n```\n\n\n\n\n\n# JavaScript\n\n`getElementsByTagName`\
  \ 方法允许根据标签名获取节点列表，该名称对应于前述的 `Node` 类中 `nodeName` 属性的值。\n\n`getElementsByTagName`\
  \ 方法可以应用于 `document` 对象或某个节点对象，如下文代码所示：\n\n```javascript\nvar balisesDiv = document.getElementsByTagName(\"\
  div\");\n```\n\n这段代码允许以节点列表（`NodeList`）的形式获取文档中所有的 `div` 标签。可以使用值 `*` 作为参数来获取文档中的所有节点，如下文代码所示：\n\
  \n```javascript\nvar elements = document.getElementsBytagName(\"*\");\n```\n\n`getElementsByName`\
  \ 方法返回一个节点列表，列表中的节点其 `name` 属性等于参数中指定的值。该方法在处理 HTML 表单的单选按钮（radio button）时特别别用，如下例所示：\n\
  \n```html\n<form method=\"post\" id=\"monFormulaire\">\n<input type=\"radio\" name=\"\
  couleur\" value=\"rouge\"/>红色<br/> ❶\n<input type=\"radio\" name=\"couleur\" value=\"\
  bleu\"/>蓝色<br/> ❶\n<input type=\"radio\" name=\"couleur\" value=\"jaune\"/>黄色<br/>\
  \ ❶\n</form>\n```\n\n以下 JavaScript 代码允许通过该方法的支持直接引用三个 `input` 标签（前述代码中的标记 ❶）：\n\n\
  ```javascript\nvar elementsInput = document.getElementsByName(\"couleur\");\n```\n\
  \n`getElementsByTagName` 和 `getElementsByName` 方法允许在完整的层级结构中获取节点列表。这些方法会从某个节点开始递归地遍历整个树结构。\n\
  \n## 从节点访问元素\n\n`Node` 类允许相对于某个特定节点遍历 DOM 树。为此，它拥有一些特定的属性，允许引用当前节点周围的节点。下表 4.4 汇总了这些属性。\n\
  \n### 表 4.4 `Node` 类中关于派生节点的属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `childNodes` |\
  \ 以 `NodeList` 对象的形式表示子节点列表。`hasChildNodes` 方法用于判断节点是否具有子节点。`childNodes` 属性不包含节点的属性。\
  \ |\n| `firstChild` | 引用第一个子节点，对应 `childNodes` 列表中的第一个节点。 |\n| `lastChild` | 引用最后一个子节点，对应\
  \ `childNodes` 列表中的最后一个节点。 |\n| `nextSibling` | 指向具有相同父节点的下一个节点。如果该节点是最后一个孩子，则其值为\
  \ `null`。 |\n| `parentNode` | 引用父节点。 |\n| `previousSibling` | 指向具有相同父节点的上一个节点。如果该节点是第一个孩子，则其值为\
  \ `null`。 |\n\n为止，我们看到访问节点是在 `NodeList` 对象内部进行导航。`firstChild`、`lastChild`、`previousSibling`\
  \ 和 `nextSibling` 属性允许通过直接引用某些节点来跳出这种导航。\n\n以下代码提供了一个如何访问这些节点的示例：\n\n```javascript\n\
  var zone = document.getElementById(\"maZone\");\nvar span = zone.firstChild; //\
  \ ❶\nvar div = zone.lastChild; // ❷\n```\n\n标记 ❶ 的变量引用 `span` 标签，标记 ❷ 的变量引用 `div`\
  \ 标签。使用 `previousSibling` 和 `nextSibling` 属性提供了遍历 DOM 树的可能性，如下文代码所示：\n\n```javascript\n\
  var zone = document.getElementById(\"maZone\");\nvar element = zone.firstChild;\n\
  while( element!=null ){\n    // (...)\n    element = element.nextSibling;\n}\n```\n\
  \n`childNodes` 属性允许引用节点的各个直接子节点。以下代码指示了如何获取我们 HTML 片段中 ID 为 `maZone` 的节点的所有孩子：\n\
  \n```javascript\nvar zone = document.getElementById(\"maZone\");\nvar enfants =\
  \ zone.childNodes;\n```\n\n在这个示例中，变量 `enfants` 包含了相对于 `span` 和 `div` 标签的节点，这些标签位于\
  \ ID 为 `maZone` 的 `div` 标签内。\n\n### Firefox 中使用 `childNodes` 属性的特殊性\n在 Firefox 浏览器中，`childNodes`\
  \ 属性会将 HTML 标签之间的所有空格以文本类型节点（`nodeType=TEXT_NODE`）的形式返回。因此，在处理时必须注意这些文本节点。\n\n##\
  \ 节点操作\n\nDOM 定义了允许创建、添加、替换或删除任何类型节点的方法。这些方法由 `document` 对象提供，该对象为所有类型的节点提供了创建方法。\n\
  \n以下代码提供了一个创建标签、文本节点和 HTML 注释的示例：\n\n```javascript\nvar element = document.createElement(\"\
  label\");\nvar elementTexte = document.createTextNode(\"mon texte\");\nvar commentaire\
  \ = document.createComment(\"mon commentaire\");\n```\n\n一旦创建了节点，只需使用 `appendChild`\
  \ 或 `insertBefore` 方法将其附加到现有节点。\n\n以下代码基于我们的示例，在页面加载后动态添加一个 `label` 标签：\n\n```javascript\n\
  var zone = document.getElementById(\"maZone\");\nvar label = document.createElement(\"\
  label\");\nvar texte = document.createTextNode(\"mon texte\");\nzone.appendChild(label);\n\
  ```\n\n这段代码产生如下结果：\n\n```html\n<div id=\"maZone\">\n    <span>...</span>\n    <div\
  \ id=\"monAutreZone\">Un texte</div>\n    <label>mon texte</label>\n</div>\n```\n\
  \n请注意，`appendChild` 方法不允许指定节点添加的位置。它总是被添加到列表的末尾。当我们希望在两行之间插入一行时，则需要 `insertBefore`。在之前的示例中，该方法允许将\
  \ `label` 标签插入到 ID 为 `maZone` 的 `div` 标签下方：\n\n```javascript\nvar zone = document.getElementById(\"\
  maZone\");\nvar autreZone = document.getElementById(\"monAutreZone\");\nvar label\
  \ = document.createElement(\"label\");\nvar texte = document.createTextNode(\"mon\
  \ label\");\nlabel.appendChild(texte);\nzone.insertBefore(autreZone, label);\n```\n\
  \n这个示例产生如下的 DOM 树：\n\n```html\n<div id=\"maZone\">\n    <span>...</span>\n    <label>mon\
  \ label</label>\n    <div id=\"monAutreZone\">Un texte</div>\n</div>\n```\n\n为止，我们创建的所有新节点都使用了\
  \ `Document` 类的各种 `create` 方法。也可以通过克隆现有节点来获取新节点，使用 `cloneNode` 方法。该方法的的第一个参数是一个布尔值，用于指示是仅克隆节点还是节点及其所有孩子都要克隆。\n\
  \n以下代码提供了 `cloneNode` 方法的使用示例：\n\n```javascript\nvar zone = document.getElementById(\"\
  maZone\");\nvar zoneClone = zone.cloneNode(true); // 完全克隆\nvar zonePartielle = zone.cloneNode(false);\
  \ // 仅克隆 div 标签\n```\n\n`removeChild` 方法允许删除节点。以下代码提供了删除 ID 为 `monAutreZone` 的 `div`\
  \ 标签的示例：\n\n```javascript\nvar zone = document.getElementById(\"maZone\");\nvar\
  \ autreZone = document.getElementById(\"monAutreZone\");\nzone.removeChild(autreZone);\n\
  ```\n\n\n\n\n\n# 树片段（Tree Fragments）的使用\n\n树片段允许对树的某部分进行操作。它们由 `DocumentFragment`\
  \ 对象表示，该对象可以被看作一个轻量级的 `Document` 对象。它实现了 `Node` 类的所有方法。\n\n以下代码可以创建一个新的树片段：\n\n\
  ```\nvar fragment = document.createDocumentFragment();\n```\n\n当需要向 DOM 树添加新部分时，树片段非常有用。\n\
  \n假设我们想在示例的 `div` 中添加七个包含星期名称的段落。这七个段落可以在树片段中创建。然后，该片段可以添加到 `div` 标签之下。\n\n以下代码提供了使用\
  \ `DocumentFragment` 对象创建段落的示例：\n\n```javascript\nvar zone = document.getElementById(\"\
  maZone\");\nvar fragment = document.createDocumentFragment();\nvar jours = [\"Lundi\"\
  , \"Mardi\", \"Mercredi\", \"Jeudi\", \"Vendredi\", \"Samedi\", \"Dimanche\"]; \n\
  for (var i=0; i < jours.length; i++){\n    var paragraphe = document.createElement(\"\
  P\");\n    var texte = document.createTextNode(jours[i]);\n    paragraphe.appendChild(texte);\n\
  \    fragment.appendChild(paragraphe);\n}\nzone.appendChild(fragment);\n```\n\n\
  此代码可以获得如下的 DOM 树：\n\n```html\n<div id=\"maZone\">\n  <p>Lundi</p>\n  <p>Mardi</p>\n\
  \  <p>Mercredi</p>\n  <p>Jeudi</p>\n  <p>Vendredi</p>\n  <p>Samedi</p>\n  <p>Dimanche</p>\n\
  </div>\n```\n\n当此示例中的片段插入到 `div` 标签下时，它的子节点会被插入，但片段本身不会。片段仅用作容器，一旦插入到 DOM 树中，它就不再作为片段存在了。\n\
  \n此示例的结果也可以不使用树片段来获得。在这种情况下，`p` 标签会在其创建时立即通过 `appendChild` 逐个插入到 `div` 标签下。DOM 树中的每次插入都会导致页面的完全刷新。在我们的情况下，页面会被刷新七次。\n\
  \n如果使用树片段，页面仅在片段插入 DOM 时刷新一次。在构建片段期间，节点仅存在于内存中，不会显示。只有在将片段添加到页面 DOM 的瞬间，它们才会被真正显示。\n\
  \n使用树片段显著提高了插入多个节点时的性能，因为它减少了所显示的 HTML 文档的重绘次数。\n\n# 属性的操作\n\n任何 `NODE_ELEMENT`\
  \ 类型的元素都可以包含允许其添加信息的属性。一个属性拥有一个键和一个值，该键的值对于该元素必须是唯一的。\n\n以下代码在我们的 HTML 示例片段中实现了属性：\n\
  \n```html\n<div id=\"maZone\">\n  <span><b>Un texte</b></span>\n  <div id=\"monAutreZone\"\
  >\n    Un autre texte\n  </div>\n</div>\n```\n\n`id` 是 `div` 标签的一个属性。`Node` 类提供了\
  \ `attributes` 属性用以列出它的不同属性。该属性的类型是前述描述的 `NamedNodeMap`。\n\n`Node` 类还提供了如表 4.5 所示汇总的所有方法。\n\
  \n### 表 4.5 Node 类的属性操作方法\n\n| 方法 | 参数 | 说明 |\n| :--- | :--- | :--- |\n| `getAttribute`\
  \ | 属性标识符 | 使用其标识符引用元素的属性。 |\n| `hasAttribute` | 属性标识符 | 判断元素是否存在某个属性。 |\n| `removeAttribute`\
  \ | 属性标识符 | 删除元素的某个属性。 |\n| `setAttribute` | 属性标识符及其值 | 为元素创建属性或替换元素已有的属性。 |\n\n\
  `setAttribute` 方法提供了为标签添加属性的可能性。以下代码给出了使用此技术为我们 HTML 片段中的第一个 `div` 标签添加类型标识属性的示例：\n\
  \n```javascript\nvar zone = document.getElementById(\"maZone\");\nzone.setAttribute(\"\
  type\", \"UnType\");\n```\n\n`getAttribute` 方法提供了对属性值的访问。在这种情况下，可以获取属性值。以下代码给出了获取属性值的示例：\n\
  \n```javascript\nvar zone = document.getElementById(\"maZone\");\nvar type = zone.getAttribute(\"\
  type\");\n```\n\n如果需要检查属性是否存在，可以使用 `hasAttribute` 方法。以下代码示例：\n\n```javascript\n\
  var zone = document.getElementById(\"maZone\");\nif (zone.hasAttribute(\"type\"\
  )) {\n    // 属性存在\n}\n```\n\n如果需要删除属性，可以使用 `removeAttribute` 方法。以下代码示例：\n\n```javascript\n\
  var zone = document.getElementById(\"maZone\");\nzone.removeAttribute(\"type\");\n\
  ```\n\n\n\n\n以下代码展示了我们初始 HTML 片段的完整遍历示例：`var zone = document.getElementById(\"maZone\"\
  );`\n\n```javascript\nvar parcours = document.createNodeIterator(zone, NodeFilter.SHOW_ELEMENT,\
  \ null, false); var sortie ;\n\nvar nœud = parcours.nextNode();\n\nwhile (nœud){\n\
  \n  sortie += noeud.nodeName + \" \" ;\n\n  noeud = parcours.nextNode();\n}\n```\n\
  \n# DOM 编程\n**第 4 章**\n\n变量 `sortie` 包含字符串 `SPAN B DIV P P DIV B`。\n\n到为止，我们还没有使用过\
  \ `NodeFilter` 类。该类允许添加一个额外的过滤器，以便在遍历树时排除某些节点。该类由一个单一方法 `acceptNode` 定义。该方法的返回值决定了在\
  \ `NodeIterator` 中丢弃或保留该节点。\n\n创建一个 `NodeFilter` 对象非常简单，如下代码所示：\n```javascript\n\
  var oFilter = new Object() ;\n\noFilter.acceptNode = function (oNode){}\n```\n`acceptNode`\
  \ 函数必须返回值 `NodeFilter.FILTER_REJECT` 或 `NodeFilter.FILTER_ACCEPT`，以指示作为参数传递的节点应包含在\
  \ `NodeIterator` 中。\n\n从我们的 HTML 代码段开始，可以在 `NodeIterator` 中仅保留 `p` 标签，如下代码所示：\n\
  ```javascript\nvar oFilterP = new Object();\n\noFilterP.acceptNode = function (oNode){\n\
  \n  if (oNode.nodeName == \"P\" ){\n    return NodeFilter.FILTER_ACCEPT;\n  } else\
  \ {\n    return NodeFilter.FILTER_REJECT;\n  }\n}\n```\n\n现在只需根据此过滤器创建一个 `NodeIterator`\
  \ 了：\n```javascript\nvar parcours = document.createNodeIterator(zone, NodeFilter.SHOW_ALL,\
  \ oFilterP, false);\n```\n同样，可以使用 `TreeWalker` 类来遍历 DOM 树。该类提供了与 `NodeIterator`\
  \ 类相同的功能，但包含了额外的移动方法。\n\n`document` 对象的 `createTreeWalker` 方法允许创建一个 `TreeWalker`（该创建方法的签名与其同类的\
  \ `CreateNodeIterator` 相同）：\n```javascript\nvar walker = document.createTreeWalker(zone,\
  \ NodeFilter.SHOW_ELEMENT, null, false);\n```\n\n在 `TreeWalker` 中导航的方法列在表 4.8 中。\n\
  \n### 表 4.8 TreeWalker 类的导航方法\n\n| 方法 |  |\n| :--- | :--- |\n| `firstChild` | 返回当前节点的第一个元素。\
  \ |\n| `lastChild` | 返回当前节点的最后一个元素。 |\n| `nextNode` | 返回下一个节点（与 `NodeIterator.nextNode`\
  \ 相同）。 |\n| `nextSibling` | 返回父节点与当前节点相同的下一个元素。 |\n| `parentNode` | 返回当前节点的父节点。\
  \ |\n| `previousNode` | 返回上一个节点（与 `NodeIterator.previousNode` 相同）。 |\n| `previousSibling`\
  \ | 返回父节点与当前节点相同的上一个元素。 |\n\n# JavaScript JavaScript\n**第一部分**\n\n以下代码提供了这些方法的用法示例：\n\
  ```javascript\nvar walker = document.createTreeWalker(zone, NodeFilter.SHOW_ELEMENT,\
  \ null, false);\n\nvar monSpan = walker.firstChild(); // ❶\nvar divMonAutreZone\
  \ = walker.nextSibling(); // ❷\nvar premierP = walker.firstChild();\n```\n标记为 ❶\
  \ 的行允许获取 `span` 标签。带有标识 `monAutreZone` 的 `div` 标签在标记 ❷ 处被获取。\n\n`NodeIterator` 和\
  \ `TreeWalker` 类通过提供两个级别的过滤简化了 DOM 树的遍历。第一层 `whatToShow` 是对节点类型的过滤，第二层 `NodeFilter`\
  \ 是一个通过编程定义的过滤器。请注意，这些类不支持 Internet Explorer。\n\n## innerHTML 属性\n\n尽管存在于 DOM 树节点上的\
  \ `innerHTML` 属性未被 W3C 规范化，但本书有必要对其进行介绍。事实上，该属性允许用字符串中指定的内容完全替换元素的内容。\n\n以下代码提供了使用\
  \ `innerHTML` 属性的示例，用于替换章节开头定义的 `span` 标签的内容为一组 HTML 标签：\n```javascript\nvar zone\
  \ = document.getElementById(\"maZone\");\nvar span = zone.getElementsByTagName(\"\
  span\")[0];\n\nspan.innerHTML = \"<p><b>mon texte</b></p>\";\n```\n此代码允许修改页面内存中的\
  \ DOM 树，以获得以下结果：\n```html\n<div id=\"maZone\">\n  <span><p><b>Un texte</b></p></span>\
  \ <!-- ❶ -->\n  <div id=\"id=\"monAutreZone\">\n    Un autre texte\n  </div>\n</div>\n\
  ```\n标记 ❶ 突出了被修改的块。我们发现我们在 `b` 标签周围添加了一个 `p` 标签。\n\n在元素上使用 `innerHTML` 属性特别具有吸引力，因为避免了多次调用\
  \ `appendChild` 方法以及相应数量的新节点创建。然而，它迫使你必须构建包含一组标签及其属性（事件、样式等）的字符串，这些字符串是以多次字符串拼接的形式呈现的。然而，这些字符串损害了\
  \ JavaScript 代码的可维护性，并可能导致无效的 HTML 语法。此外，使用这种方法破坏了 DOM 规范中定义的结构化。\n\n考虑到这些因素，只有在某些特殊情况下才建议使用这种方法，千万不要滥用。\n\
  \n可以调用 `innerHTML` 属性来解决因添加大量节点导致的性能问题。这种性能问题也可以通过使用树片段（fragments）来解决。在几乎所有的 Web\
  \ 浏览器中，使用 `innerHTML` 属性的性能远高于 `appendChild` 方法。\n\n我们将说明这两种方法的使用。第一种对应于使用 DOM 方法来动态创建一个由一百行行的表格：\n\
  ```javascript\nvar nbLigne = 3000;\nvar zone = document.getElementById(\"maZone\"\
  );\nvar elementTableau = document.createElement(\"table\");\nvar elementTBody =\
  \ document.createElement(\"tbody\");\nelementTableau.appendChild(elementTBody);\n\
  \nvar elementTr = document.createElement(\"tr\");\nvar elementTd = document.createElement(\"\
  td\");\nvar elementDonnees = document.createTextNode(\"Mes données\");\n\nfor (var\
  \ cpt=0; cpt<nbLigne; cpt++){\n  var tmpElementTr = elementTBody.appendChild(elementTr.cloneNode(true));\n\
  \  var tmpElementTd = tmpElementTr.appendChild(elementTd.cloneNode(true));\n  tmpElementTd.appendChild(elementDonnees.cloneNode(true));\n\
  }\n\nzone.appendChild(elementTableau);\n```\n第二种对应于使用 `innerHTML` 属性来实现相同的功能：\n\
  ```javascript\nvar nbLigne = 3000;\nvar zone = document.getElementById(\"maZone\"\
  );\nvar html = new Array();\n\nhtml.push(\"<table><tbody>\");\n\nfor (var cpt=0;\
  \ cpt<nbLigne;cpt++){\n  html.push(\"<tr>\");\n  html.push(\"<td>Mes données</td>\"\
  );\n  html.push(\"</tr>\");\n}\n\nhtml.push(\"</tbody></table>\");\n\nzone.innerHTML\
  \ = html.join(\"\");\n```\n使用 `innerHTML` 时表格显示的响应速度要快得多。\n\n## DOM level 0 使用\n\
  \n如前所述，DOM level 0 并没有被 W3C 规范化。它对应于浏览器对 HTML 文档对象的首种实现。这种 DOM level 0 允许通过 `document`\
  \ 对象的属性访问 HTML 文档的不同元素。例如，`forms` 属性允许获取 Web 页面中包含的所有 `form` 标签。\n\n以下代码指示如何使用 `forms`\
  \ 属性：\n\n\n\n\n\n```javascript\nvar mesFormulaires = document.forms;\n\nfor (var\
  \ i=0 ; i < mesFormulaires.length ; i++){\n  var formulaire = mesFormulaires[i];\n\
  }\n```\n\n同样地，文档中的所有图像都可以通过 `images` 属性访问：\n\n```javascript\nvar mesImages = document.images;\n\
  \nfor (var i=0 ; i < mesImages.length ; i++){\n  var image = mesImages[i];\n}\n\
  ```\n\n`links` 属性允许获取文档中的所有链接（`a` 标签）。\n\n尽管 0 级 `DOM` 尚未标准化，但最新版本的浏览器已经部分实现了对其属性的访问。然而，建议不要使用这些属性，而是优先使用\
  \ `getElementsByTagName` 方法。\n\n`document.forms` 和 `documents.images` 属性可以用以下代码替换：\n\
  \n```javascript\nvar mesFormulaires = document.getElementsByTagName(\"form\");\n\
  \nvar mesImages = document.getElementsByTagName(\"img\");\n```\n\n## 在加载时修改 DOM\
  \ 树\n\n正如我们在此为止所看到的，`DOM` 允许操作 HTML 页面的结构。但必须记住，只有当页面完全加载后，才能访问 `DOM`。因此，对 DOM 树的操作必须在\
  \ `document` 的 `onload` 事件触发后进行，以确保所有元素都存在。\n\n`DOM` 还可以用于在页面加载后修改 HTML 页面的内容。这一功能对于根据页面中的描述构建组件（widgets）被证明是特别用的。\n\
  \n为了更好地理解加载时修改 DOM 树，我们将通过一个具体的示例来说，在这个示例中，我们希望将 `input` 标签定义的标准替换为 `div` 标签，以提高按钮的视觉效果。\n\
  \n以下示例展示了如何在页面加载时替换按钮：\n\n```html\n<html>\n<head>\n<script language=\"text/javaScript\"\
  >\nfunction remplaceBouton(){\n  var oInputs = document.getElementsByTagName(\"\
  input\");\n  for (var i=0; i < oInputs.length; i++){\n    var oInput = oInputs.item(i);\n\
  \    if (oInput.getAttribute(\"type\") == \"button\"){\n      // 构建新按钮\n      var\
  \ oDiv = document.createElement(\"div\");\n      oDiv.style.border = \"1px solid\
  \ blue\";\n      var t = document.createTextNode(oInput.value);\n      oDiv.appendChild(t);\n\
  \      // 修改现有节点\n      oInput.parentNode.replaceChild(oDiv, oInput);\n    }\n \
  \ }\n}\n</script>\n</head>\n<body onload=\"remplaceBouton()\">\n<h1>用 div 替换按钮</h1>\n\
  <input type=\"button\" value=\"mon action\"/> **❶**\n</body>\n</html>\n```\n\n在这段代码中，`remplaceBouton`\
  \ 方法在页面完全加载后执行。它获取所有类型为 `button` 的 `input` 标签，并将其替换为 `div` 标签。\n\n页面加载后，标记 ❶ 的标签变为：\n\
  \n`<div style=\"border : 1px solid blue\">mon action</div>`\n\n这个在加载时修改 `DOM` 的示例是最简单的。更复杂的情况可以用相同的方式处理。特别是可以使用不被\
  \ Web 浏览器解释的标签来描述构成人机界面（UI）的图形元素。这些元素在页面完全加载后会被考虑，以获得图形组件的视觉渲染。\n\n`dojo` 库正是利用这一原理来构建其组件的。以下代码示例在页面加载时构建了一个表格类型的组件：\n\
  \n```html\n<div widgetType=\"grid\">\n<column title=\"Nom\" style=\"width:40%\"\
  />\n<column title=\"Prénom\" style=\"width:60%\"/>\n</div>\n```\n\n在上述 HTML 标签中，`widgetType`\
  \ 属性允许将 `div` 标签定义为在加载时需要修改的元素。`column` 标签允许定义表格的列。\n\n以下代码在页面加载后运行，允许解析带有 `widgetType`\
  \ 属性的所有标签：\n\n```javascript\nfunction buildWidget(){\n  var nodes = document.getElementsByTagName(\"\
  *\");\n  for (var i=0; i < nodes.length; i++){\n    var node = nodes[i];\n    if\
  \ (node.nodeType == 3){\n      var widgetType = node.getAttribute(\"widgetType\"\
  );\n      if (\"grid\" == widgetType){\n        constructGrid(node);\n      } else\
  \ if (\"onglet\" == widgetType){\n        (...)\n      }\n      (...)\n    }\n \
  \ }\n}\n```\n\n`buildWidget` 函数遍历 DOM 树上的所有标签，当标签包含 `widgetType` 属性时，触发特定的处理，在此例中是负责构建表格的\
  \ `constructGrid` 函数：\n\n```javascript\nfunction constructGrid(baseNode){\n  //\
  \ 构建碎片\n  var grid = document.createDocumentFragment();\n  var oTable = document.createElement(\"\
  table\");\n  var oTbdy = document.createElement(\"tbody\");\n  oTable.appendChild(oTbdy);\n\
  \  var oEntete = document.createElement(\"tr\");\n  oTbdy.appendChild(oEntete);\n\
  \  // 解析 column 标签\n  var columns = baseNode.getElementsByTagName(\"column\");\n\
  \  for (var i = 0 ; i < columns.length; i++){\n    var column = columns[i];\n  \
  \  var titre = column.getAttribute(\"title\");\n    var oTd = document.createElement(\"\
  td\");\n    oTd.style.cssText = column.style.cssText;\n    var txt = document.createTextNode(titre);\n\
  \    oTd.appendChild(txt) ;\n    oEntete.appendChild(oTd);\n    (...)\n  }\n  baseNode.appendChild(grid);\n\
  }\n```\n\n`constructGrid` 函数解析 `column` 标签以创建表格的不同列。此示例中的代码显然不完整，但它能让我们意识到加载时修改\
  \ `DOM` 的潜力。\n\n## 结论\n\n`DOM` 标准化了一个 API，用于提供层级文档结构的对象表示，这种表示在大多数情况下基于标记语言。它还提供了操作和遍历结构的支持。\n\
  \n在本章中，我们描述了逻辑 `DOM` 树的不同对象。我们实现了这些对象，以便与 HTML 页面的 `DOM` 树进行交互。`DOM` API 提供了遍历此树并动态修改修改它的可能，即使在\
  \ HTML 页面加载后也是如此。\n\n`DOM` 非常适合直接操作 `DOM` 树来实现图形组件。\n\n然而，并不是所有的 Web 浏览器都实现了所有的\
  \ `DOM` 规范。因此，通常需要抽象层（库、框架、工具箱等）来解决实现问题。\n\n\n\n\n图 5.1（下一页）插图了这种机制。\n\n现在我们将基于\
  \ `XMLHttpRequest` 类详细阐述 Ajax 的实现。\n\nLivreGougeon 第 106 页 2006 年 11 月 28 日 周二 4:23\
  \ 16\n\n# JavaScript 基础原理\n**106**\n\n*第一部分*\n\n**浏览器**\n**网站托管服务器**\n- 从网站加载页面（HTML\
  \ 页面）\n- 运行网站或 Web 应用程序\n- 执行 Ajax 请求（不刷新页面）\n- Ajax 请求及结果处理\n\n**图 5.1**\n*Ajax\
  \ 的通用工作原理*\n\n## XMLHttpRequest 类\n\n在 浏览器中实现 Ajax 的基础实体是 JavaScript 类 `XMLHttpRequest`。\n\
  \n该类并不是新产物，因为它最初由微软以 ActiveX 控件的形式开发，并从 1998 年起集成到 Internet Explorer 5.0 中。随后，它逐渐在主流浏览器中实现为原生\
  \ JavaScript 对象，如表 5.1 所示。\n\n### 表 5.1 主流浏览器对 `XMLHttpRequest` 类的支持情况\n\n| 浏览器及版本\
  \ | 支持日期 |\n| :--- | :--- |\n| Internet Explorer 5.0 | 1998 |\n| Mozilla 1.0 | 2002\
  \ 年 5 月 |\n| Safari 1.2 | 2004 年 2 月 |\n| Konqueror 3.4 | 2005 年 3 月 |\n| Opera\
  \ 8.0 | 2005 年 4 月 |\n\n自 2006 年以来，`XMLHttpRequest` 类一直是 W3C 联盟规范的对象，其进展可以在地址 `http://www.w3.org/TR/XMLHttpRequest/`\
  \ 查看。\n\n由于该类在不同浏览器（尤其是 Internet Explorer）中的支持方式不同，必须实现一个函数来根据所使用的浏览器管理其创建和配置。\n\
  \nLivreGougeon 第 107 页 2006 年 11 月 28 日 周二 4:23 16\n\n# Ajax 的实现\n**107**\n\n*第\
  \ 5 章*\n\n以下代码提供了该函数的通用实现示例：\n\n```javascript\nfunction getXMLHttpRequest() {\n\
  \  if (window.XMLHttpRequest) {\n    var xmlHttpReq = new XMLHttpRequest();\n  \
  \  // 避免 Safari 浏览器的 bug\n    if (xmlHttpReq.overrideMimeType) {\n      xmlHttpReq.overrideMimeType(\"\
  text/xml\");\n    }\n    return xmlHttpReq;\n  } else if (window.ActiveXObject)\
  \ {\n    try {\n      return new ActiveXObject(\"Msxml2.XMLHTTP\");\n    } catch\
  \ (err) {}\n    try {\n      return new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
  \    } catch (err) {}\n  }\n  throw new Error(\"无法为浏览器创建对象\" + \"XMLHttpRequest\"\
  );\n}\n```\n\nJavaScript 库（特别是 prototype 和 dojo）在其对 Ajax 技术的支持中集成了这种机制。\n\n表 5.2\
  \ 和 5.3 分别总结了该类的属性和方法。\n\n### 表 5.2 `XMLHttpRequest` 类的属性\n\n| 属性 |  |\n| :--- |\
  \ :--- |\n| `onreadystatechange` | 允许设置回调函数，该函数在发生 `readyStatechange` 事件时被调用。该事件在异步模式下受支持，对应请求处理过程中的状态变化。\
  \ |\n| `readyState` | 对应对象在请求和响应处理期间所处状态的代码。 |\n| `responseText` | 以文本形式接收的响应 |\n\
  | `responseXML` | 以 XML 形式接收的响应 |\n| `status` | 对应响应的 HTTP 状态码。只有在收到请求响应后才可读取。 |\n\
  | `statusText` | 对应响应的 HTTP 状态文本。只有在收到请求响应后才可读取。 |\n\n### 表 5.3 `XMLHttpRequest`\
  \ 类的方法\n\n| 方法 | 参数 | 描述 |\n| :--- | :--- | :--- |\n| `abort` | - | 取消当前请求并重置对象。\
  \ |\n| `getAllResponseHeaders` | - | 以字符串形式返回响应中所有的 HTTP 头部。该方法只有在对象的 `readyState`\
  \ 属性等于 3 或 4（Receiving 或 Loaded 状态）时才能使用。 |\n| `getResponseHeader` | 头部名称 | 返回参数指定的头部值。可以在与上一个方法相同的情况下使用。\
  \ |\n| `open` | 要使用的 HTTP 方法和 | 初始化对象用于请求。它指定了 URL、HTTP 方法（GET 或 POST）以及可选的异步模式。\
  \ |\n| `send` | | 允许向指定地址带安全文档发送请求。如果是同步模式，则调用将阻塞直到接收到数据。 |\n| `setRequestHeader`\
  \ | 头部名称及其值 | 为请求设置 HTTP 头部。 |\n\nLivreGougeon 第 108 页 2006 年 11 月 28 日 周二 4:23\
  \ 16\n\n# JavaScript 基础原理\n**108**\n\n*第一部分*\n\n## 交换管理\n\n与其名称可能暗示的相反，Ajax 并不一定以异步方式处理响应，因为它同时支持同步和异步模式。\n\
  \n在同步实现的情况下，响应的接收是顺序进行的，如下代码所示：\n\n```javascript\nvar transport = getXMLHttpRequest();\n\
  transport.open(\"get\", \"data.js\", false);\ntransport.send(null);\nvar texte =\
  \ transport.responseText;\n```\n\nLivreGougeon 第 109 页 2006 年 11 月 28 日 周二 4:23\
  \ 16\n\n# Ajax 的实现\n**109**\n\n*第 5 章*\n\n在异步实现的情况下，接收通过回调函数完成。该函数通过使用 `XMLHttpRequest`\
  \ 类的属性 `onreadystatechange` 指定。\n\n以下代码描述了一个简单的异步请求的实现：\n\n```javascript\nvar transport\
  \ = getXMLHttpRequest();\n\nfunction changementEtat() {\n  if( transport.readyState\
  \ == 4 ) {\n    var texte = transport.responseText;\n  }\n}\n\ntransport.onreadystatechange\
  \ = changementEtat;\ntransport.open(\"get\", \"data.js\", true);\ntransport.send(null);\n\
  ```\n\n### 表 5.4 `XMLHttpRequest` 类实例在异步模式下的状态\n\n| 值 | 状态 | 描述 |\n| :--- | :---\
  \ | :--- |\n| 0 | Uninitialized | 初始状态 |\n| 1 | Open | `open` 方法执行成功。 |\n| 2 | Sent\
  \ | 请求已成功发送，但尚未接收任何数据。 |\n| 3 | Receiving | 正在接收数据。 |\n| 4 | Loaded | 请求处理完成。 |\n\
  \n\n\n\n\n请注意，只有当对象状态为 4 (Loaded) 时，传输对象才能访问响应数据。\n\n尽管 `XMLHttpRequest` 类支持同步模式，但应优先使用异步模式，因为\
  \ JavaScript 处理不会在等待请求响应时被阻塞。\n\n另外请注意，某些库（如 `dojo`）即使在同步模式下也依赖于回调函数。这些方法使得两种模式的使用趋于一致，两者的选择现在仅通过参数来完成。\n\
  \n## 数据交换\n\n`XMLHttpRequest` 类为交换各种类型的数据提供了许多有趣的可能性。在本节中，我们将看到交换的数据格式并不一定是 XML。\n\
  \n### 交换的数据\n\n在发送请求时，有两种方式指定数据。\n\n第一种方法是将参数直接放置在服务器的资源地址中。这种技术基于 HTTP 协议的 `GET`\
  \ 方法。以下代码描述了这种方法的实现：\n\n```\nvar transport = getXMLHttpRequest();\nvar parametre1\
  \ = \"valeur1\";\nvar parametre2 = \"valeur2\";\nvar adresse = [ \"donnees.js\"\
  \ ];\nadresse.push(\"?parametre1=\");\nadresse.push(parametre1);\nadresse.push(\"\
  &parametre2=\");\nadresse.push(parametre2);\ntransport.open(\"get\", adresse.join(\"\
  \"), true);\ntransport.send(null);\n```\n\n第二种方法是发送数据块，这只有通过 HTTP 协议的 `POST` 方法才能实现。`XMLHttpRequest`\
  \ 类的 `send` 方法可以通过参数指定此数据块。以下代码描述了这种方法的实现：\n\n```javascript\nvar transport = getXMLHttpRequest();\n\
  var parametre1 = \"valeur1\";\nvar parametre2 = \"valeur2\";\nvar parametres = [\
  \ ];\nparametres.push(\"{ parametre1: \\\"\");\nparametres.push(parametre1);\nparametres.push(\"\
  \\\", parametre2: \\\"\");\nparametres.push(parametre2);\nparametres.push(\"\\\"\
  \ }\");\ntransport.open(\"post\", \"/ajax/data.js\", true);\ntransport.send(parametres.join(\"\
  \\n\"));\n```\n\n在最后一种情况下，数据可以文本或 XML 文档提供，因为 `send` 方法接受这两种数据格式。\n\n### GET 请求地址的结构\n\
  \n为了发送参数，`GET` 请求必须构造如下结构：`http://<HOTE>:<PORT>/ressource?parametre1=valeur1&parametre2=valeur2...`\n\
  \n`<HOTE>` 和 `<PORT>` 必须分别替换为使用的主机和端口值。如果省略端口，则默认指定端口 80。以下示例允许执行基于 Google 搜索引擎的请求：`http://www.google.fr/search?hl=fr&q=javascript&btnG=Recherche+Google&meta=`\n\
  \n## Ajax 的实现\n\n相反，获取请求响应中包含的数据只有一种方式。它基于 `XMLHttpRequest` 类实例的 `responseText`\
  \ 和 `responseXML` 属性，分别对应文本格式和 XML 格式的响应。\n\n这些属性在接收到响应时（Loaded ）赋值。以下代码提供了使用这些属性的示例（标记\
  \ ❶ 和 ❷）：\n\n```javascript\nvar transport = getXMLHttpRequest();\n//(...)\n// 在响应为文本格式的情况下\n\
  var reponse = transport.reponseText; // ❶\n// 在响应为 XML 格式的情况下\nvar reponseXML =\
  \ transport.reponseXML; // ❷\n```\n\n因此，响应中接收到的数据既可以用文本形式也可以以 XML 文档的形式进行处理。\n\n\
  除了应用数据外，还可以在传输层级作为 HTTP 请求头指定数据。这些数据的设置基于 `setRequestHeader` 方法，其获取基于 `getResponseHeader`\
  \ 和 `getAllResponseHeaders` 方法。\n\n以下代码提供了使用这些方法的示例（标记 ❶ 和 ❷）：\n\n```javascript\n\
  var transport = getXMLHttpRequest();\n//(...)\ntransport.open(\"post\", \"/ajax/data.js\"\
  , true);\ntransport.setRequestHeader(\"Content-type\", \"application/x-www-form-urlencoded\"\
  ); // ❶\ntransport.send(null);\n//(...)\nvar typeServeur = transport.getResponseHeader(\"\
  Server\"); // ❷\n```\n\n### 交换数据的的结构\n\nAjax 技术可以使用不同的数据格式。甚至可以使用文本格式，但在这种情况下，JavaScript\
  \ 中没有提供可用的支持来访问数据中包含的信息。\n\n#### XML 格式\n\n`XMLHttpRequest` 类通过其 `send` 方法和 `responseXML`\
  \ 属性原生支持对 XML 的使用，这两个者分别接收并返回 XML 文档。这种方法在结构化数据的同时，使其对用户可读。\n\n此外，由于这种格式在应用程序中经常使用，大多数开发者都精通它。它主要的缺点在于编写数据遍历处理时的编写繁琐。\n\
  \n在 JavaScript 环境中，必须实现 DOM 技术来处理请求和响应。\n\n以下代码在 `XMLHttpRequest` 类中于发送端（标记 ❷）和接收端（标记\
  \ ❶）使用了 XML 格式：\n\n```javascript\nvar transport = getXMLHttpRequest();\n//(...)\n\
  function changementEtat() {\nif( transport.readyState == 4 ) {\nvar donneesXML =\
  \ transport.responseXML; // ❶\n// donnees 对应响应标签\nvar donnees = donneesXML;\n//\
  \ 处理接收到的数据\nvar differentesDones = donnees.childNodes;\nfor(var cpt=0; cpt<differentesDones.length;\
  \ cpt++) {\nvar donnee = differentesDones[cpt];\n//(...)\n}\n}\n}\ntransport.onreadystatechange\
  \ = changementEtat;\ntransport.open(\"get\", \"donnees.xml\", true);\n// 构建用于发送的\
  \ XML 数据\nvar parametres = document.createElement(\"parametres\");\nvar parametre1\
  \ = document.createElement(\"parametre\");\nparametre1.setAttribute(\"nom\",\"parametre1\"\
  );\nvar texteParametre1 = document.createTextNode(\"valeur1\");\nparametre1.appendChild(texteParametre1);\n\
  parametres.appendChild(parametre1);\ntransport.send(parametres); // ❷\n```\n\n####\
  \ HTML 格式\n\n可以直接接收 HTML 代码块，特别是用于刷新网页的某部分。然而，在代码块嵌入页面中时，这种方法的使用可能会变得复杂，特别是对于样式管理。以下代码提供了在\
  \ HTML 页面中交换这种格式的实现示例：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\nfunction getXMLHttpRequest() {\n//(...)\n}\nfunction changementEtat() {\nif(\
  \ transport.readyState == 4 ) {\nvar html = transport.responseText;\nvar div = document.getElementById(\"\
  conteneurReponse\");\ndiv.innerHTML = html; // ❶\n}\n}\nfunction executerRequete()\
  \ { // ❷\nvar transport = getXMLHttpRequest();\ntransport.onreadystatechange = changementEtat;\n\
  transport.open(\"get\", \"donnees.html\", true);\ntransport.send(null);\n}\n</script>\n\
  </head>\n<body>\n//(...)\n</body>\n</html>\n```\n\n\n\n\n\n<div id=\"conteneurReponse\"\
  ></div> ¨❸\n\n此示例提供了通过 `executerRequete` 函数（标记 ❷）将 HTML 格式的响应内容添加（标记 ❶）标识为 `conteneurReponse`\
  \ 的 `div` 标签（标记 ❸）中的功能。\n\n接收到的 HTML 数据如下：\n\n<p>示例段落</p>\n\n## JSON 格式\n\n第 3 章描述的\
  \ JSON 格式允许表示 JavaScript 字面量对象。该格式的使用对于响应来说特别有用。\n\nJavaScript 中存在相应的支持来将这些结构评估为\
  \ JavaScript 对象。然后可以像访问任何 JavaScript 对象一样通过引用访问它们。其主要缺点是对用户来说不直观。\n\n在 Ajax 技术中使用\
  \ JSON 格式，需要进行 JavaScript 评估或使用 JSON 解析器对接收到的文本数据进行遍历。\n\n## JavaScript 基础\n\n在下面的代码中，第一种方法通过\
  \ `eval` 关键字（标记 ❶）实现：\n\n```javascript\nvar transport = getXMLHttpRequest();\n\n\
  function changementEtat() {\n  if( transport.readyState == 4 ) {\n    var contenuReponse\
  \ = transport.reponseText;\n    eval(\"var reponse = \"+contenuReponse); ¨❶\n  \
  \  var differentesDonnees = reponse.donnees;\n    for(var cpt=0; cpt<differentesDonnees.length;\
  \ cpt++) {\n      var donnee = differentesDonnees[cpt];\n      //(...)\n    }\n\
  \  }\n}\n\ntransport.onreadystatechange = changementEtat;\ntransport.open(\"get\"\
  , \"/ajax/data.json\", true);\ntransport.send(null);\n```\n\n在上面的示例中，接收到的 JSON 结构如下：\n\
  \n```json\n{ \"donnees\": [\n  { nom: \"donnee1\", valeur: \"valeur1\" }\n] }\n\
  ```\n\n### 总结\n\n与其名称可能让人产生的想法相反，Ajax 技术提供了使用多种类型格式交换数据的可能性。`XMLHttpRequest` 类原生支持文本和\
  \ XML 格式。\n\n在响应方面，HTML、`xHTML` 和 `JSON` 格式可以基于文本格式轻松实现。此时，应用程序负责执行转换。\n\n## 绕过限制\n\
  \n使用 `XMLHttpRequest` 类的主要限制在于它不允许对使用它的 HTML 页面之外的域执行请求。\n\n图 5.2 展示了一个托管在 `sourceforge.net`\
  \ 域的网站，它尝试基于 `XMLHttpRequest` 类向 `yahoo.com` 域执行一个 Ajax 请求。如果基于该类访问外部服务是不可能的，则各种绕过方法允许使用另一个域的服务。\n\
  \n## Ajax 的实现\n\n图 5.2：在不同域上执行 Ajax 请求\n\n### 服务器端代理\n\n在这种用例中，代理对应于充当 Ajax 请求中继的软件组件。请求不再尝试直接到达服务，而是通过代理进行，代理的地址现在处于同一个域中。由代理调用服务并将响应返回给\
  \ HTML 页面。\n\n代理没有与 `XMLHttpRequest` 类相同的限制，因为它是在服务器端执行的。此外，它可以使用 `Java` 或 `PHP`\
  \ 等语言实现。\n\n图 5.3：基于服务器端代理的绕过方法的工作原理\n\n### 隐藏 iframe\n\n`iframe` 是一种可以嵌入 HTML 页面中的标签，以便在其框架内加载另一个页面。对于加载页面的域没有施加任何限制。\n\
  \n这种机制允许绕过 `XMLHttpRequest` 类的限制，并可以在大多数支持 iframe 的现代浏览器中使用。`iframe` 由一个名为 `iframe`\
  \ 的 HTML 标签组成。与任何 HTML 标签一样，可以为其关联样式。此外，该元素支持 `onload` 事件，该事件对应于框架内页加载。\n\n以下代码提供了在\
  \ HTML 页面中使用隐藏 iframe 的示例：\n\n```html\n<html>\n(...)\n  <body>\n  (...)\n    <iframe\
  \ id=\"iframeCachee\" ¨❶ name=\"iframeCachee\" style=\"width:0px; height:0px; display:\
  \ ''\" ¨❷ frameborder=\"0\">¨❸</iframe>\n  (...)\n  </body>\n</</html>\n```\n\n\
  为了使 `iframe` 标签（标记 ❶）不可见，使用了 CSS 样式（标记 ❷），其中包含 `width`（宽度）、`height`（高度）和 `display`（显示）属性。`frameborder`\
  \ 属性也必须指定值为 0（标记 ❸）。\n\n## CSS 样式\n\n`CSS`（层叠样式表）技术允许通过不同的属性设置标签的外观。每个 HTML 标签都支持一组图形属性，CSS\
  \ 样式可以在这些属性上作用以修改其外观。我们将在第 8 章详细介绍该技术的工作原理。\n\n由于 `DOM` 的支持，此 `iframe` 可以动态地添加和删除。因此，可以完全隐藏这种技术的使用。\n\
  \n## 发送信息\n\n使用 iframe 提供了发送 `GET` 和 `POST` 类型 HTTP 请求的可能性。\n\n`src` 属性可以用于指定要加载的页面地址。这种技术允许发送\
  \ `GET` 类型请求，且使用的地址可以直接包含参数，如下代码所示，它基于之前描述的 iframe：\n\n```javascript\nfunction executerRequeteGet(adresse,\
  \ parametres) {\n  var requete = [];\n  // 指定请求的地址\n  requete.push(\"http://test.org/monAdresse\"\
  );\n  // 指定请求参数\n  var premierParametre = true;\n  for( parametre in parametres\
  \ ) {\n    if( premierParametre ) {\n      requete.push(\"?\");\n    } else {\n\
  \      requete.push(\"&\");\n    }\n    requete.push(parametre);\n    requete.push(\"\
  =\");\n    requete.push(parametres[parametre]);\n    premierParametre = false;\n\
  \  }\n  // 发送请求\n  var iframe = document.getElementById(\"iframeCachee\");\n  iframe.src\
  \ = requete.join(\"\");\n}\n```\n\n也可以实现 POST 请求。在这种情况下，必须使用 HTML 表单。该表单可以动态添加，并且必须通过其\
  \ `target` 属性与 iframe 关联。请注意，该属性的值引用的是 iframe 的 `name` 属性而不是其 `id` 属性。\n\n\n\n\n\
  \n```javascript\n// 页面中已存在“monFormulaire”表单\n\nvar formulaire = document.createElement(\"\
  form\"); **¨** ❶\n\nformulaire.setAttribute(\"id\",\"monFormulaire\"); **¨** ❷\n\
  \nformulaire.setAttribute(\"name\",\"monFormulaire\"); **¨** ❷\n\nformulaire.setAttribute(\"\
  action\",adresse); **¨** ❷\n\nformulaire.setAttribute(\"method\",\"POST\"); **¨**\
  \ ❷\n\nformulaire.setAttribute(\"target\", identifiantIframe); **¨** ❸\n\n// 将表单添加到页面\n\
  \ndocument.body.appendChild(formulaire); **¨** ❹\n\n// 在表单中动态添加字段\n\nfor( parametre\
  \ in parametres ) { **¨** ❺\n\nvar champ = document.createElement(\"input\");\n\n\
  champ.setAttribute(\"type\", \"hidden\");\n\nchamp.setAttribute(\"name\", parametre);\n\
  \nchamp.setAttribute(\"value\", parametres[parametre]);\n\nformulaire.appendChild(champ);\n\
  \n}\n\n// 发送请求\n\nformulaire.submit(); **¨** ❻\n\n// 移除表单\n\ndocument.body.removeChild(formulaire);\
  \ **¨** ❼\n\n}\n```\n\n# JavaScript 基础原理\n\n上述 `executerRequetePost` 函数首先创建一个表单，并为其指定各种参数（标记\
  \ ❷），如其名称和标识符、数据提交地址以及所使用的 HTTP 方法。`target` 参数（标记 ❸）不能省略，因为它允许基于 `iframe` 实现表单的提交。\n\
  \n创建的表单随后被添加到页面中（标记 ❹），然后为不同的参数添加了 `input` 类型的字段（标记 ❺）。此后，该表单可以被提交（标记 ❻），然后从页面中移除（标记\
  \ ❼）。\n\n## 获取信息\n\n可以采用多种技术来获取返回的信息。然而，其中某些技术可能会影响响应的结构。\n\n第一种技术要求响应必须包含 JavaScript\
  \ 代码。该代码负责调用包含 `iframe` 的 HTML 页面中的一个函数，以便使用响应的内容。\n\n`iframe` 通过 `parent` 关键字访问其包含的页面。一种做法是调用该页面的一个\
  \ JavaScript 函数，并向其传递相对于 `iframe` 的 `document` 对象的引用。\n\n以下代码提供了这种类型回调函数（标记 ❶）的实现示例：\n\
  \n```html\n<html>\n\n<head>\n(...)\n<script type=\"text/javascript\">\nfunction\
  \ fonctionDeRappel(documentIFrame) { **¨** ❶\n\nvar tableau =\n\ndocumentIFrame.getElementById(\"\
  donnees\");\n\n(...)\n\n}\n</script>\n</head>\n\n<body>\n(...)\n<iframe id=\"iframeCachee\"\
  \nname=\"iframeCachee\"\nstyle=\"width: 0px; height: 0px; display: ''\"\nframeborder=\"\
  0\">\n\n</iframe>\n(...)\n</body>\n</html>\n```\n\n以下代码给出了从 `iframe` 接收到的响应内容调用回调函数（标记\
  \ ❶）的示例：\n\n```html\n<html>\n<head>(...)</head>\n<body>\n<table id=\"donnees\">\n\
  (...)\n</table>\n<script type=\"text/javascript\">\nparent.fonctionDeRappel(document);\
  \ **¨** ❶\n</script>\n</body>\n</html>\n```\n\n请注意，响应必须能够获知要调用的 JavaScript 函数的名称。该名称可以作为相应请求的参数进行指定。\n\
  \n最后一种技术是将 JavaScript 函数与 `iframe` 中的页面加载事件关联，如下方的代码所示：\n\n```html\n<html>\n<head>\n\
  (...)\n<script type=\"text/javascript\">\nfunction traiterPage() { **¨** ❶\n\nvar\
  \ iframe =\ndocument.getElementById(\"iframeCachee\");\nvar contenuRequete =\nextraireDonneesIframe(iframe);\
  \ **¨** ❷\n\n(...)\n\n}\n</script>\n</head>\n\n<body>\n(...)\n<iframe id=\"iframeCachee\"\
  \nname=\"iframeCachee\"\nstyle=\"width=0px;height=0px;display=''\"\nonload=\"traiterPage();\"\
  > **¨** ❶\n\n</iframe>\n(...)\n</body>\n</html>\n```\n\n这种关联是通过 `iframe` 标签的 `onload`\
  \ 属性实现的（标记 ❶）。每当有页面加载到 `iframe` 中时，`traiterPage` 函数就会被调用一次。\n\n正如我们在第 8 章将看到的，建议通过事件与\
  \ JavaScript 函数之间的关联将 HTML 标签外部化。\n\n`traiterPage` 函数基于 DOM 技术来访问响应内容。在上述代码中，`extraireDonneesIframe`\
  \ 函数（标记 ❷）允许提取 `iframe` 中 `body` 标签的数据。\n\n后者整合了不同浏览器的特殊性，如下代码所示：\n\n```javascript\n\
  function extraireDonneesReponse(iframe) {\nif( iframe.contentDocument ) {\n  return\
  \ iframe.contentDocument.body.innerHTML;\n} else if( iframe.contentWindow ) {\n\
  \  return iframe.contentWindow.document.body.innerHTML;\n} else if( iframe.contentWindow\
  \ ) {\n  return iframe.document.body.innerHTML;\n}\n}\n```\n\n总之，这种技术构成了支持 `iframe`\
  \ 标签的浏览器对 `XMLHttpRequest` 类局限性的有趣绕过方法。该技术还提供了管理已执行的各种 Ajax 请求历史的可能性。\n\n## script\
  \ 标签的动态使用\n\n正如我们在第 2 章所看到的，`script` 标签允许将 JavaScript 集成到 HTML 页面中。我们将描述的技术是基于动态添加此类标签来实现\
  \ Ajax。以下代码提供了这种技术的实现示例：\n\n```javascript\nfunction ajouterBaliseScript(adresse)\
  \ { **¨** ❶\n\nvar script = document.createElement(\"script\"); **¨** ❷\nscript.setAttribute(\"\
  type\",\"text/javascript\"); **¨** ❸\nscript.setAttribute(\"src\",adresse);\nscript.setAttribute(\"\
  id\",\"scriptId\");\nvar head = document.getElementsByTagName(\"head\")[0];\nhead.appendChild(script);\
  \ **¨** ❹\n}\n\nfunction supprimerBaliseScript() { **¨** ❺\n\nvar head = document.getElementsByTagName(\"\
  head\")[0];\nvar script = document.getElementById(\"scriptId\");\nhead.removeChild(script);\n\
  }\n\nfunction executerRequete(adresse, parametres, fonctionDeRappel) { **¨** ❻\n\
  \nvar requete = [];\n\n// 指定请求地址\nrequete.push(adresse);\n\n// 指定请求参数\nvar premierParametre\
  \ = true;\nfor( parametre in parametres ) { **¨** ❼\n\nif( premierParametre ) {\n\
  requete.push(\"?\");\n} else {\nrequete.push(\"&\");\n}\n\nrequete.push(parametre);\n\
  requete.push(\"=\");\nrequete.push(parametres[parametre]);\npremierParametre = false;\n\
  }\n\nif( !premierParametre ) {\nrequete.push(\"&\");\n} else {\nrequete.push(\"\
  ?\");\n}\n\n// 指定回调函数\nrequete.push(\"&callback=\"+fonctionDeRappel); **¨** ❽\n\n\
  // 执行请求\najouterBaliseScript(requete.join(\"\"));\n\n// 移除使用的标签\nsupprimerBaliseScript();\n\
  }\n```\n\n在上述代码中，`ajouterBaliseScript` 函数（标记 ❶）提供了在 HTML 页面中动态创建（标记 ❷）、配置（标记 ❸）和添加（标记\
  \ ❹）`script` 标签的可能性。因此，它实现了针对指定地址的请求执行。\n\n\n\n\n`supprimerBaliseScript` 函数（标记 ❺）用于删除为了执行请求而创建的标签。`executerRequete`\
  \ 函数（标记 ❻）基于这两个函数，负责使用不同的参数构建请求地址（请求 ❼）。其中一个参数对应于响应将使用的回调函数（标记 ❽）。\n\n收到的代码格式如下：\n\
  \n```javascript\nfonctionDeRappel({ donnees: [ ❶\n{ nom: \"donnee1\", valeur: \"\
  valeur1\" }\n{ nom: \"donnee2\", valeur: \"valeur2\" }\n] });\n```\n\n在 HTML 页面中，必须定义一个名为\
  \ `fonctionDeRappel` 的函数。\n\n该函数由响应调用，并将响应数据作为参数传入（标记 ❶）。\n\n请注意，当收到的内容无法被作为 JavaScript\
  \ 求值时，会发生错误。此外，这种技术不支持 POST 类型的请求。\n\n# JavaScript 基础知识\n\n### 总结\n\n我们已经看到，某些限制阻碍了使用\
  \ `XMLHttpRequest` 类来实现 Ajax 技术。尽管如此，仍然存在一些通通方法，允许基于 Ajax 访问其他域的服务。\n\n尽管这些技术可以解决\
  \ `XMLHttpRequest` 类的局限性，但它们不支持该类的所有功能。\n\n表格 5.5 汇总了本节介绍的各种技术所支持的功能。\n\n### 表格\
  \ 5.5 通用方法支持的功能\n\n| 功能 | XMLHttpRequest | 带有代理的 XMLHttpRequest | iframe | Script\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 浏览器支持 | 仅限最新浏览器 | 仅限最新浏览器 | 仅某些 | 是\
  \ |\n| 请求限制在 HTML 页面域 | 是 | 是 | 否 | 否 |\n| 支持 GET 和 POST 方法 | 是 | 是 | 是 | 否 |\n\
  | 访问请求和响应的 HTTP 状态 | 是 | 是 | 否 | 否 |\n| 访问 HTTP Header | 是 | 是 | 否 | 否 |\n| 支持的数据格式\
  \ | 文本、XML | 文本、XML、JavaScript | 文本、XML、JSON | JavaScript 和 JSON |\n| 请求的异步处理 |\
  \ 是 | 是 | 是 | 否 |\n\n某些 JavaScript 库（如 `dojo`）将这些不同的技术直接集成到它们对 Ajax 支持中。\n\n我们将在第\
  \ 14 章详细介绍如何使用基于 script 标签的通用方法来访问 Amazon 和 Yahoo! 服务。\n\n## 结论\n\nAjax 开启了有趣的视角，因为\
  \ HTML 页面现在可以获取数据以更新其某些部分。因此，现在可以实现更高级、图形界面更交互的 Internet 应用程序。\n\n尽管 `XMLHttpRequest`\
  \ 类（或其等效物之一）正在标准化并且已被大多数大多数浏览器支持，但它仍存在局限性，特别是在调用其他域的服务时。\n\n可以实现通用方法来解决这些问题，但这些解决方案并不被所有浏览器支持。这些通用方法基于\
  \ `script` 和 `iframe` 等 HTML 标签的使用，同时也基于服务器应用程序层面的软件组件实现。\n\n# 第二部分：JavaScript 库的基础\n\
  \n本部分介绍了 JavaScript 库（如 `prototype` 和 `dojo`）的基础知识。\n\n这些基础由允许使用语言元素、基本类型和集合的功能组成。它们还提供了实现面向对象编程、DOM\
  \ 技术以及 Ajax 的支持。\n\n- 第 6 章介绍了 `proto-type` 库的非图形功能，这是一种特别用于 Ruby on Rails 框架的轻量级\
  \ JavaScript 库。\n- 第 7 章描述了 `dojo` 库的工作模式以及基础支持，这是一个非常全面的 JavaScript 库，依赖于一套复杂的模块管理机制。\n\
  \n与这些库相关的图形问题支持将在第四部分讨论，该部分专门介绍图形 JavaScript 库。\n\n## 6. prototype 库\n\nprototype\
  \ 库提供了非常实用的机制来方便 JavaScript 的使用。它由 Sam Stephenson 开发，是多个 JavaScript 框架的基础，特别是用 Ruby\
  \ 编写的 Ruby on Rails，该框架允许用最少的代码行和配置简单地实现 Web 应用程序。\n\nprototype 网站可以通过 `http://prototype.conio.net/`\
  \ 访问，遗憾的是，它提供的文档非常少。\n\nprototype 库处理了 JavaScript 语言的不同方面，从语言的基本元素到集合和 Ajax 的支持。我们在本章中详细介绍了\
  \ prototype 的基础功能。我们将在第 10 章介绍针对 HTML 页面图形元素的功能。\n\n请注意，该库的名称与第 3 章描述的用于 JavaScript\
  \ 对象编程的 `prototype` 属性无关。\n\n要使用此库，只需导入包含所需版本的 `prototype.js` 文件（标记 ❶），该文件包含了库的实现。\n\
  \n以下代码说明了这种实现：\n\n```html\n<html\n<head>\n<script type=\"text/javascript\" src=\"\
  prototype-1.4.0.js\"></script> <!-- ❶\n(...)\n</head>\n(...)\n</html>\n```\n\n##\
  \ JavaScript 基础元素的支持\n\nprototype 库方便了 JavaScript 语言基础机制的使用，使得应用程序的代码更加结构化和鲁健性。\n\
  \n### 对类的支持\n\n首先，它对面向对象的概念提供了内置支持，允许开发者关注它们的使用而非其实现（参见第 3 章）。它在此基于 `Class` 对象及其\
  \ `create` 方法来创建类。该类必须实现 `initialize` 方法，其目标是初始化类，就像构造函数一样。它还提供了调用构造函数时传递的参数。\n\n\
  以下代码说明了在 prototype 库支持下第 3 章描述的 `StringBuffer` 实现：\n\n```javascript\nvar StringBuffer\
  \ = Class.create();\nStringBuffer.prototype = {\ninitialize : function() {\n   \
  \ this.chainesInternes = [];\n},\nappend : function(chaine) {\n    this.chainesInternes.push(chaine);\n\
  },\nclear : function() {\n    this.chainesInternes.splice(0,\n    this.chainesInternes.length);\n\
  },\ntoString : function() {\n    return this.chainesInternes.join(\"\");\n}\n}\n\
  var sb = new StringBuffer();\nsb.append(\"première chaîne\");\nsb.append(\" et \"\
  );\nsb.append(\"deuxième chaîne \");\nvar resultat = sb.toString();\n//resultat\
  \ contient « première chaîne et deuxième chaine »\n```\n\n`prototype` 并没有真正简化 JavaScript\
  \ 中类的实现，而是提供了另一种实现方式。此外，我们还可以从上面的代码中注意到 `prototype` 属性仍然仍然在使用。\n\n\n\n\n\n`prototype`\
  \ 还通过其 `Object.extend` 方法方便继承的实现。该方法允许将属性和方法从一个类复制到另一个类，而无需实现第 3 章中介绍的继承机制。\n\n\
  # prototype 库\n\n以下代码说明了该方法的使用，并使用了第 3 章中过的 `StringBuffer` 和 `ExtendedStringBuffer`\
  \ 类：\n\n```javascript\nvar StringBuffer = Class.create();\n\nStringBuffer.prototype\
  \ = {\n  initialize : function() {\n    this.chainesInternes = [];\n  },\n  this.append\
  \ = function(chaine) {\n    this.chainesInternes.push(chaine);\n  },\n  this.clear\
  \ = function() {\n    this.chainesInternes.splice(0,\n    this.chainesInternes.length);\n\
  \  },\n  this.toString = function() {\n    return this.chainesInternes.join(\"\"\
  );\n  }\n}\n\nvar ExtendedStringBuffer = Class.create();\n\nExtendedStringBuffer.prototype\
  \ = {\n  initialize : function() {\n    StringBuffer.call(this);\n  },\n  uneMethode\
  \ : function() {\n    (...)\n  }\n}\n\nObject.extend(ExtendedStringBuffer.prototype,\
  \ StringBuffer.prototype);\n```\n\n`prototype` 还规范了类对 `inspect` 方法的使用。该方法允许以字符串形式获取对象内容的可读描述。此时，类必须实现此方法。此外，`Object.inspect`\
  \ 方法封装了对传入参数的对象的该方法的调用。\n\n如果对象不存在 `inspect` 方法，它将允许在对象上调用 `toString` 方法，同时处理未定义和空对象。\n\
  \n以下代码说明了其用法：\n\n```javascript\nvar sb = new StringBuffer();\nvar description =\
  \ Object.inspect(sb);\n// description 包含 « [object Object] »\n```\n\n## 函数尝试\n\n\
  由于 JavaScript 是一种解释型语言，错误会在脚本执行时被检测到。当发生错误时，它会被应用程序拦截，或者被浏览器的 JavaScript 解释器拦截。\n\
  \n`prototype` 提供了一个有趣的函数 `Try.these`，它允许连续尝试多个函数，直到其中一个正常工作为止。该函数特别方便了特定浏览器特定功能的实现。\n\
  \n以下代码说明了其用法：\n\n```javascript\nfunction maFonction() {\n  return Try.these(\n \
  \   function() {\n      alert(\"appel de la première méthode\");\n      return test1();\
  \ // 错误因为方法不存在\n    },\n    function() {\n      alert(\"appel de la seconde méthode\"\
  );\n      return test2(); // 错误因为方法不存在\n    },\n    function() {\n      alert(\"\
  appel de la troisième méthode\");\n      return \"par défaut\"; // 实际返回的元素\n   \
  \ }\n  );\n}\n```\n\n## 函数支持\n\nprototype 库通过 `bind` 或 `bindAsEventListener` 两个方法增强了\
  \ `Function` 类。这种机制在将一个对象的方法赋值给另一个对象时非常有用。在这种情况下，执行时的上下文不再是原来的了。\n\n因此，`this` 关键字不再指向同一个对象，这可能会导致错误。\n\
  \n以下代码说明了这个问题：\n\n```javascript\nvar monInstance1 = new Object();\nmonInstance1.maVariable\
  \ = \"test\";\nmonInstance1.maMethode = function() {\n  alert(\"Valeur de maVariable\
  \ : \"+this.maVariable);\n}\n\nvar monInstance2 = new Object();\nmonInstance2.uneAutreMethode\
  \ = monInstance1.maMethode;\nmonInstance2.uneAutreMethode(); // 产生错误，因为 monInstance2\
  \ 上没有\n// maVariable 字段\n```\n\n`bind` 方法允许保留方法相对于原始对象的执行上下文。\n\n以下代码调整了前述示例以消除错误：\n\
  \n```javascript\nvar monInstance1 = new Object();\nmonInstance1.maVariable = \"\
  test\";\nmonInstance1.maMethode = function() {\n  alert(\"Valeur de maVariable :\
  \ \"+this.maVariable);\n}\n\nvar monInstance2 = new Object();\nmonInstance2.uneAutreMethode\
  \ = monInstance1.maMethode.bind(monInstance1);\nmonInstance2.uneAutreMethode();\
  \ // 正确显示 maVariable 的值\n```\n\n第二种方法 `bindAsEventListener` 为 JavaScript 事件观察方法实现了相同的机制，且这种实现独立于浏览器的。事实上，Internet\
  \ Explorer 强制要求使用 `window.event` 来访问事件，而其他浏览器则将其作为参数传递。\n\n该方法的使用方式如下：\n\n```javascript\n\
  var observateur = new Object();\nobservateur.traiterEvenement = function(event)\
  \ {\n  alert(\"Evénement déclenché : \"+event);\n}\n\nvar monDiv = document.getElementById(\"\
  monDiv\");\nmonDiv.onclick = observateur.traiterEvenement.bindAsEventListener(observateur);\n\
  ```\n\n得益于 `bindAsEventListener` 方法，如果代码在 Internet Explorer 中执行，`prototype` 会自动将\
  \ `window.event` 作为参数传递给 `traiterEvenement` 方法。\n\n## 触发器\n\nprototype 库通过 `PeriodicalExecuter`\
  \ 类提供了触发周期处理的支持。\n\n`initialize` 方法允许指定周期触发的函数以及时间间隔。以下代码说明了如何配置该类以便每十秒调用一次 `declencherTraitements`\
  \ 函数：\n\n```javascript\nfunction declencherTraitements() {\n  (...)\n}\n\nvar pe\
  \ = new PeriodicalExecuter();\npe.initialize(declencherTraitements, 10);\n```\n\n\
  我们将在 Ajax 相关部分看到 `prototype` 允许定期刷新 HTML 页面的元素，例如表单元素。\n\n## 基础类支持\n\nprototype\
  \ 库通过向基础类 `String` 和 `Number` 添加方法来增强它们，旨在方便它们的使用。\n\n### 字符串\n\n`prototype` 通过对\
  \ JavaScript 语言提供的 `String` 类进行增强，提供了字符串管理的支持。\n\n表 6.1 汇总了添加到 `String` 类的各种方法。\n\
  \n### 表 6.1 String 类扩展方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `camelize` | 允许按以下方式转换字符串中由连字符分隔的文本块：“une-chaine”被转换为“uneChaine”。\
  \ |\n| `escapeHTML` | 允许对 HTML 特殊字符编码（如 `<` 和 `>`）。后者分别变为 `&lt;` 和 `&gt;`。 |\n|\
  \ `evalScripts` | 允许评估字符串中位于`<script>` 和 `</script>` 标签之间的所有脚本块。 |\n| `extractScripts`\
  \ | 允许返回一个包含字符串中所有`<script>` 和 `</script>` 标签之间块的数组。 |\n| `parseQuery` | 与 `toQueryParams`\
  \ 相同。 |\n| `stripScripts` | 允许删除字符串中所有位于 `<script>` 和 `</script>` 标签之间的块。 |\n| `stripTags`\
  \ | 允许删除字符串中所有的 HTML 或 XML 标签。 |\n| `toArray` | 返回一个包含字符串不同字符的数组。 |\n| `toQueryParams`\
  \ | 允许从格式为：`param1=valeur1&param2=valeur2…` 的字符串中提取不同的元素到关联数组中。因此允许从 HTTP 参数字符串中提取数据。\
  \ |\n| `unescapeHTML` | 执行 `escapeHTML` 方法的逆向操作。 |\n\n我们将实现此表中汇总的主要方法。\n\n`stripTags`\
  \ 方法允许删除字符串中所有的 HTML 或 XML 标签。\n\n\n\n\n以下代码展示了该函数的用法：\n\n```javascript\nvar chaineInitiale\
  \ = \"<p>Ceci est un paragraphe.</p>\"\n+ \"<br/><p>Un autre.</p>\";\n\nvar chaineFinale\
  \ = chaineInitiale.stripTags();\n\n//chaineFinale contient « Ceci est un paragraphe.Un\
  \ autre. »\n```\n\n`escapeHTML` 方法提供了将字符串中的特殊字符编码为 HTML 的可能，而 `unescapeHTML` 方法则执行相反的操作。\n\
  \n以下代码展示了该函数的用法：\n\n```javascript\nvar chaineInitiale = \"<p>Un paragraphe.</p>\"\
  ;\n\nvar chaineFinale = chaineInitiale.escapeHTML();\n\n//chaineFinale contient\
  \ « &lt;p&gt;Un paragraphe.&lt;/p&gt; »\n```\n\n`parseQuery` 方法特别用于解码 HTTP 请求的参数字符串并将其存储在关联数组中，如下代码所示：`var\
  \ chaineInitiale = \"parametre1=valeur1&parametre2=valeur2\";`\n\n```javascript\n\
  var parametres = chaineInitiale.parseQuery();\n\n/* 变量 parametres 等同于\nvar parametres\
  \ = { \"parametre1\": \"valeur1\", \"parametre2\": \"valeur2\" }; */\n```\n\n# Prototype\
  \ 库\n\n## 131\n### 第 6 章\n\n`camelize` 方法允许转换由连字符分隔的字符串，如下代码所示：\n\n```javascript\n\
  var chaineInitiale = \"ma-variable et ma-méthode\";\n\nvar chaineFinale = chaineInitiale.camelize();\n\
  \n//chaineFinale contient « maVariable et maMéthode »\n```\n\n## 数字\n\n`Number`\
  \ 类的扩展比上一节描述的 `String` 类要重要得多。表格 6.2 总结了添加到该类方法列表。\n\n### 表格 6.2 `Number` 类的扩展方法\n\
  \n| 方法 |  |\n| :--- | :--- |\n| `succ` | 返回下一个数字。在迭代中特别有用。 |\n| `times` | 允许根据数字的值执行相应次数的迭代。\
  \ |\n| `toColorPart` | 返回数字的十六进制表示。对于计算 HTML 页面中颜色的 RGB 表示特别有用。 |\n\n我们将提供一个 `times`\
  \ 方法的使用示例。与其实现一个基于 `for` 关键字的循环（如下所示）：\n\n```javascript\nvar maximum=10;\nfor(var\
  \ cpt=0; cpt<maximum; cpt++) {\n  (...)\n}\n```\n\n`times` 方法接受一个回调函数作为参数，该函数在每次迭代时被调用。此回调函数必须接收一个与当前计数器对应的数字参数。\n\
  \n以下代码展示了支持 `times` 方法后的代码适配：\n\n```javascript\nvar maximum=10;\nmaximum.times(function(cpt)\
  \ {\n  (...)\n});\n```\n\n## 集合管理\n\nPrototype 库通过 `Enumerable` 和 `Hash` 类以及 `Array`\
  \ 类的扩展方法，为 JavaScript 集合的使用支持。\n\n## 132\n### 第二部分\n\n### Enumerable 类\n\nPrototype\
  \ 首先引入了 `Enumerable` 类以便遍历数据结构。由于它不能直接使用，因此必须用来扩展现有的类，例如 `Array` 类。\n\n基础方法是 `each`，它依赖于\
  \ `_each` 方法。后者可以被认为是抽象的。事实上，它不应该定义在类本身中，而是在它所扩展的类中定义。\n\n`_each` 方法的参数是一个闭包，用于封装一个回调函数和一个计数器。后者由回调函数管理，回调函数在每次调用时都会递增。\n\
  \n### 回调函数\n\nJavaScript 函数可以赋值给变量，从而作为对象方法的参数传递。这些函数可以在这些方法的体内调用，以便对其处理进行参数化：\n\
  \n```javascript\nfunction testFonctionRappel(param) {\n  for(var cpt=0;cpt<;cpt++)\
  \ {\n    param(cpt);\n  }\n}\n\ntestFonctionRappel(function(value) {\n  alert(\"\
  Valeur: \"+value);\n});\n```\n\n回调函数必须预先知道调用它时的参数数量。表格 6.3 总结了 `Enumerable` 类的方法。\n\
  \n### 表格 6.3 `Enumerable` 类的方法\n\n| 方法 | 参数 |  |\n| :--- | :--- | :--- |\n| `all`\
  \ | 值和索引（回调函数） | 通过一个函数测试集合中的元素。一旦该函数返回 false、null 或无，遍历就会停止。在这种情况下，`all` 方法返回 false，否则返回\
