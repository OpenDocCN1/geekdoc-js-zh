  \ KDE 3.0.1 (Linux) 版本 5+\n\nMozilla\n所有操作系统上的版本 0.9.4+（包括所有基于 Gecko 的浏览器，如 Firefox\
  \ 0.9+ 和 Netscape 6.2.3+）\n\n## 测试用例\n\n现在详细介绍测试用例的实现方式，包括其结构层面以及执行上下文的管理方式。\n\n\
  ### 测试用例的结构\n\n为了实现一个单元测试，我们将实现一个 `StringBuffer` 类，其功能是拼接字符串。它继承了 Java 中同名类的原则，但要简单得多，因为只实现了\
  \ `append`、`clear` 和 `toString` 方法。\n\n以下代码定义了该类的结构：\n\n```javascript\nfunction\
  \ StringBuffer() {\n  this.chainesInternes = [];\n}\n\nStringBuffer.prototype.append\
  \ = function(chaine) {\n  this.chainesInternes.push(chaine);\n};\n\nStringBuffer.prototype.clear\
  \ = function() {\n  this.chainesInternes.splice(0, this.chainesInternes.length);\n\
  };\n\nStringBuffer.prototype.toString = function() {\n  return this.chainesInternes.join(\"\
  \");\n};\n```\n\n我们的测试用例必须定义在一个标准的 HTML 页面中，其骨架如下，以便导入 `JsUnit` 框架并提供测试描述：\n\n```html\n\
