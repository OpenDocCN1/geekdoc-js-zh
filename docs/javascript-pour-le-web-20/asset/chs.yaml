  \ null，用于指定函数的执行上下文。\n\n## 面对象编程支持\n\ndojo 库提供了各种实用工具函数，允许对对象执行基本操作。表格 7.5 汇总了这些函数。\n\
  \n### 表格 7.5 对象管理函数\n\n| 函数 | 参数 |  |\n| :--- | :--- | :--- |\n| `dojo.inherits`\
  \ | 两个函数 | 允许一个类继承另一个类，通过将子类的原型属性初始化为父类的属性来实现。 |\n| `dojo.extend` | 一个对象 | 在构造函数的原型属性上添加方法。\
