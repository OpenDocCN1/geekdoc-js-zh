  \ 11.12**\n*菜单栏的外观*\n\n## 工具栏\n\n工具栏在 dojo 库中是基于图形组件 `dojo.widget.ToolbarContainer`、`dojo.widget.Toolbar`、`dojo.widget.ToolbarButtonGroup`\
  \ 和 `dojo.widget.ToolbarSelect` 实现，它们分别对应工具栏容器、工具栏本身以及这些各种元素。\n\n工具栏的创建必须通过之前描述的\
  \ `dojo.widget.createWidget` 函数通过编程来实现。各个组件通过它们的 `addChild` 方法相互添加。\n\n工具栏结构的创建实现方式如下：\n\
  \n```javascript\n// 创建容器\nvar conteneur = dojo.widget.createWidget(\"ToolbarContainer\"\
  );\n// 创建工具栏\nvar barreOutils = dojo.widget.createWidget(\"Toolbar\", {\nid: \"\
  barreOutils\" });\nconteneur.addChild(barreOutils);\n\n// 将工具栏添加到页面\ndocument.body.insertBefore(conteneur.domNode,\n\
  document.body.firstChild);\n```\n\n从此，该工具栏就可以通过按钮和按钮组、分隔符和输入列表进行丰富，如以下代码所示：\n\n\
