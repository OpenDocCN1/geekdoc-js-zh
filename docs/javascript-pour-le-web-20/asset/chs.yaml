  \ | 布尔值 | 通过删除相应的行和数据初始化表格。 |\n| `insertOneLine` | 包含数据和行索引的数组 | 根据提供的数据在表格的指定位置添加一行。\
  \ |\n| `isCell` | DOM 节点 | 如果节点是单元格则返回 true。 |\n| `isLine` | DOM 节点 | 如果节点是行则返回\
