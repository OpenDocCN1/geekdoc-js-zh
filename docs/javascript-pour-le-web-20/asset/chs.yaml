  carte\"), options);\ncarte.setCenter(new GLatLng(47.2228, -1.5682), 11);\n```\n\n\
  图 13.4 展示了该代码在浏览器中显示的地图。\n\n![](img/index-417_1.jpg)\n\nLivreGougeon 第 400 页 2006\
  \ 年 11 月 28 日周二 4:23 16\n\n# 外部服务的使用\n\n第五部分\n\n图 13.4\n*带有 Google Maps 的简单地图*\n\
  \n我们将使用不同的元素来增强地图，以实现交互功能。\n\n## 界面增强\n\n正如前面提到的，Google Maps 允许通过各种控件来增强地图。\n\n\
  ## 导航实体\n\n某些导航工具被称为控件，旨在提供与地图的交互。它们在表 13.2 中汇总。\n\n### 表 13.2 地图控件\n\n| 控件 | 描述\
  \ |\n| :--- | :--- |\n| GLargeMapControl | 用于调整缩放的放大控件。 |\n| GMapTypeControl | 用于切换地图类型（平面/卫星等）的控件。\
  \ |\n| GOverviewMapControl | 提供缩略图视图。 |\n| GScaleControl | 显示地图比例尺的控件。 |\n| GSmallMarkerControl\
  \ | 在地图上显示标记的控件。 |\n| GSmallZoomControl | 用于调整缩放的小控件。 |\n\n添加和删除控件元素分别通过 `addControl`\
  \ 和 `removeControl` 方法实现。这两个方法都接收控件实例作为参数。`addControl` 方法支持一个额外参数来指定控件的位置。如果省略，方法将基于\
  \ `GControl.getDefaultPosition()` 返回的值。\n\n\n\n\nGoogle Maps 提供了定义标记和信息窗口的功能，允许对地图进行注释并并通过补充信息来丰富地图。该工具还允许在地图上绘制轨迹。所有这些元素都扩展了\
  \ `GOverlay` 类。元素的添加和删除分别通过 `GMap2` 或 `GMarker` 类的 `addOverlay` 和 `removeOverlay`\
  \ 方法实现。\n\n`GMarker` 类允许实现标记，以便在地图上图形指示某个位置。该类有一个构造函数，其参数为它指向的坐标以及可选属性。\n\n表格 13.3\
  \ 汇总了这些不同的属性。\n\n### 表格 13.3 `GMarker` 类构造函数的属性\n\n| 属性 | 类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `bounceGravity` | Number | 对应在拖放操作结束时弹回时使用的重力。其默认值为 1。 |\n| `bouncy`\
  \ | Boolean | 指定标记在拖放操作结束时是否弹回。 |\n| `clickable` | Boolean | 指定标记是否可点击。默认值为 true。\
  \ |\n| `draggable` | Boolean | 指定标记是否可以通过拖拽移动。默认值为 false。 |\n| `icon` | `GIcon`\
  \ | 指定标记使用的图标。默认值对应常量 `G_DEFAULT_ICON` 的值。 |\n| `title` | String | 指定当鼠标悬停在标记上时显示的描述文本（提示框）。\
  \ |\n\n以下代码演示了简单标记的实现：\n\n```javascript\nvar divCarte = document.getElementById(\"\
  carte\");\nvar carte = new GMap2(divCarte);\n(...)\nvar point = new GLatLng(47.2228,\
  \ -1.5682); // ❶\nvar marqueur = new GMarker(point,{draggable: true}); // ❷\ncarte.addOverlay(marqueur);\n\
  ```\n\n在前面的示例中，一个标记被放置在南特市中心（标记 ❶）。由于其 `draggable` 属性值为 true，该标记可以通过拖放进行移动（标记 ❷）。\n\
  \n可以实现自定义标记以使用自己的图像而不是提供的默认图标。还必须实现一个与图标阴影对应的图像。\n\n以下代码给出了这种自定义的实现示例：\n\n```javascript\n\
  // 自定义图标的基础图标\nvar iconeBase = new GIcon();\niconeBase.shadow = \"http://www.google.com/mapfiles/shadow50.png\"\
  ;\niconeBase.iconSize = new GSize(50, 70);\niconeBase.shadowSize = new GSize(37,\
  \ 34);\niconeBase.iconAnchor = new GPoint(9, 34);\niconeBase.infoWindowAnchor =\
  \ new GPoint(42, 50);\niconeBase.infoShadowAnchor = new GPoint(18, 25);\n\n// 自定义图标\n\
  var icone = new GIcon(iconeBase);\nicone.image = \"iconePersonalisee.png\";\nicone.shadow\
  \ = \"ombreIconePersonalisee.png\";\nicone.shadowSize = new GSize(70, 70);\n\n//\
  \ 使用自定义图标的标记\nvar marqueur = new GMarker(carte.getCenter(), icone);\n```\n\n###\
  \ 使用外部服务\n\n信息窗口可以附加到不同的元素，例如地图本身或标记。Google Maps 提供的各种窗口类型在表格 13.4 中汇总。\n\n### 表格\
  \ 13.4 Google Maps 提供的窗口类型\n\n| 类型 | 描述 |\n| :--- | :--- |\n| HTML | 以 HTML 为内容，通过地图或标记的\
  \ `openInfoWindowHtml` 方法实现。该方法接受一个包含 HTML 代码的字符串作为参数。 |\n| 带标签页的 HTML | 以与前一种类型相同的方式，通过\
  \ `openInfoWindowTabsHtml` 方法实现。 |\n| 文本 | 对应最简单的类型。通过地图或标记的 `openInfoWindow` 方法实现。该方法接受一个文本类型的\
  \ XML 节点作为参数。 |\n| 带标签页的文本 | 实现一个带有标签页的窗口。这些标签包含文本，并通过 `GInfoWindowTab` 类定义，其构造函数接受标签名称及其内容作为参数。窗口通过地图或标记的\
  \ `openInfoWindowTabs` 方法实现，该方法接受一个标签数组作为参数。 |\n\n我们将实现一个包含 HTML 代码的窗口，使用 `GMap2`\
  \ 类的 `openInfoWindowHtml` 方法将其添加到地图上，如下代码所示：\n\n```javascript\nvar divCarte = document.getElementById(\"\
  carte\");\nvar carte = new GMap2(divCarte);\n(...)\ncarte.openInfoWindowHtml(carte.getCenter(),\
  \ \"Une fenêtre d'<b>information</b>\");\n```\n\n如果窗口需要附加到标记，则 `GMarker` 类中有一个同名方法，如下代码所示：\n\
  \n```javascript\n(...)\nvar point = new GLatLng(47.2228, -1.5682);\nvar marqueur\
  \ = new GMarker(point,{draggable: true});\ncarte.addOverlay(marqueur);\n(...)\n\
  marqueur.openInfoWindowHtml(\"Une fenêtre d'<b>information</b>\");\n```\n\n请注意，这些信息窗口的打开可以通过事件完成，无论是地图还是标记。\n\
  \nGoogle Maps 还提供了通过 `GPolyline` 类在地图上绘制点轨迹的功能。该类接受一个轨迹点数组作为参数，如下代码所示：\n\n```javascript\n\
  var divCarte = document.getElementById(\"carte\");\nvar carte = new GMap2(divCarte);\n\
  (...)\nvar points = [...];\nvar trace = new GPolyline(points);\ncarte.addOverlay(trace);\n\
  ```\n\n\n\n允许将对象的方法注册为 DOM 事件，即该 DOM 事件的观察者实例。该方法返回该观察者及其方法，并返回一个代表已注册观察者的对象。\n\n\
  ### `clearInstanceListeners`\n源实例允许删除为特定地图实例注册的所有观察者。\n\n### `clearListeners`\n\
  源实例和代码允许删除为地图实例的特定事件注册的所有观察者。\n\n### `removeListener`\n代表观察者的对象允许使用已注册的对象的来移除观察者。该已注册的对象是在注册观察者时，通过\
  \ `addListener`、`addDomListener`、`bind` 和 `bindDom` 方法返回的。\n\n### `trigger`\n源实例和代码允许为特定地图实例触发特定事件，并可选传入额外参数。此方法对于测试使用\
  \ Google Maps 的应用程序特别有用。\n\n源实例对应于添加事件观察者的实例。因此，它并不一定对应地图实例，例如，它可以是一个标记（marker）的实例。\n\
  \n以下代码说明了如何使用 `addListener`、`bind` 和 `removeListener` 方法分别为 `moveend` 事件注册（标记 ❶）和注销观察者（标记\
  \ ❷）：\n\n```\nvar divCarte = document.getElementById(\"carte\");\n\nvar carte =\
  \ new GMap2(divCarte);\n\n(...)\n\n// 定义并注册第一个观察者\n\nvar observateur1 = GEvent.addListener(carte,\
  \ \"moveend\", function() { //¨ ❶\n\n(...)\n\n});\n\n// 定义类 GestionnaireCarte\n\n\
  function MonGestionnaireCarte() {\n\n};\n\nMonGestionnaireCarte.prototype.traiterEvenement\
  \ = function() {\n(...)\n\n};\n\nvar gestionnaire = new MonGestionnaireCarte();\n\
  \n// 定义并注册第二个观察者\nvar observateur2 = GEvent.bind(carte, \"moveend\",\n\nMonGestionnaireCarte,\
  \ gestionnaire.traiterEvenement); //¨ ❶\n\n(...)\n\n// 取消之前注册的观察者\n\nGEvent.removeListener(observateur1);\
  \ //¨ ❷\n\nGEvent.removeListener(observateur2); //¨ ❷\n```\n\n当应用程序用户完成在地图上的移动时，观察者的函数和方法会被调用。\n\
  \n地图支持不同的事件，可以通过 `addListener` 和 `bind` 方法注册观察者。表 13.6 汇总了这些事件的名称。\n\n**表 13.6 地图支持的事件**\n\
  \n| 代码 | 观察者参数 | 说明 |\n| :--- | :--- | :--- |\n| addmaptype | 地图类型 | 已添加了一种地图类型。\
  \ |\n| addoverlay | Overlay | 地图上添加了一个覆盖层。 |\n| clearoverlays | - | 地图上的所有覆盖层已删除。\
  \ |\n| click | Overlay, 点 | 用户点击了地图。 |\n| drag | - | 用户正在地图上进行拖放操作。 |\n| dragend\
  \ | - | 用户完成了在地图上的拖放操作。 |\n| dragstart | - | 用户开始在地图上进行拖放操作。 |\n| infowindowclose\
  \ | - | 地图上的信息窗口已关闭。 |\n| infowindowopen | - | 地图上的信息窗口已打开。 |\n| load | - | 地图加载完成，`isLoaded`\
  \ 方法返回 true。尽管如此，地图图像可能仍在加载中。 |\n| maptypechanged | - | 地图类型已更改。 |\n| mousemove\
  \ | 光标位置 | 用户在地图上移动鼠标光标。 |\n| mouseout | 光标位置 | 用户将鼠标光标移出地图区域。 |\n| mouseover |\
  \ 光标位置 | 用户将鼠标光标移入区域。 |\n| move | - | 用户正在移动地图。 |\n| moveend | - | 用户完成了地图移动。 |\n\
  | movestart | - | 用户开始移动地图。 |\n| removemaptype | 地图类型 | 已删除了一种地图类型。 |\n| removeoverlay\
  \ | Overlay | 地图上的一个覆盖层已删除。 |\n| zoomend | 旧和新的缩放级别 | 用户完成了地图缩放比例值的更改。 |\n\n事件处理函数或方法的参数根据事件的不同而不同。在之前的示例中，`moveend`\
  \ 事件要求一个无参数的函数或方法。接下来的示例描述了 `zoomend` 事件观察者的实现：\n\n```\nvar divCarte = document.getElementById(\"\
  carte\");\n\nvar carte = new GMap2(divCarte);\n\n(...)\n\n// 定义观察者\nfunction traitementZoomend(ancienZoom,\
  \ nouveauZoom) { //¨ ❶\n\nalert(\"旧缩放值: \"+ ancienZoom);\nalert(\"新缩放值: \"+ nouveauZoom);\n\
  }\n\n// 注册观察者\nGEvent.addListener(carte, \"zoomend\", traitementClick);\n```\n\n\
  观察者函数现在拥有两个参数（标记 ❶），其中第一个对应旧的缩放值，第二个对应新的值。\n\n`click` 事件遵循相同的机制，并允许检测是否在地图或标记上执行了点击操作，如下代码所示：\n\
  \n```\nvar divCarte = document.getElementById(\"carte\");\n\nvar carte = new GMap2(divCarte);\n\
  \n(...)\n\n// 添加一个标记\nvar point = new GLatLng(47.2228, -1.5682);\ncarte.addOverlay(new\
  \ GMarker(point));\n\n// 定义并注册观察者\nfunction traitementClic(marqueur, position) {\
  \ //¨ ❶\n\nalert(\"点击了标记: \"+ marqueur);\nalert(\"点击位置: \"+ position);\n}\n\nGEvent.addListener(carte,\
  \ \"click\");\n```\n\n在用户点击标记的情况下，`traitementClic` 函数的参数 `marqueur`（标记 ❶）不为空，且包含被点击标记的实例。该函数的相同参数\
  \ `position`（标记 ❶）则为空。\n\n标记还支持不同的事件，可以在这些事件上注册观察者。如果标记是静态的（`clickable` 和 `draggable`\
  \ 属性的值为 `false`），则不会触发以下任何一个事件。表 13.7 汇总了这些事件的名称。\n\n**表 13.7 标记支持的事件**\n*(注：原文此处未提供表\
  \ 13.7 的具体内容，仅有描述性文字)*\n\n\n\n\n通过 `GMap2` 类的 `removeOverlay` 和 `clearOverlays`\
  \ 方法可以从地图上删除标记。\n\n标记的监听器注册方式与地图相同，通过 `GEvent` 类实现。以下代码实现了对 `click` 和 `mouseover`\
  \ 事件的监听注册：\n\n```javascript\nvar divCarte = document.getElementById(\"carte\");\n\
  \nvar carte = new GMap2(divCarte);\n\n(...)\n\n// 添加标记\n\nvar point = new GLatLng(47.2228,\
  \ -1.5682);\n\nvar marqueur = new GMarker(point)\n\ncarte.addOverlay(marqueur);\n\
  \n// 定义并注册监听器\nGEvent.addListener(marqueur, \"dblclick\", function() {\n  alert(\"\
  Déclenchement de l’événement dblclick\");\n});\n\nGEvent.addListener(marqueur, \"\
  mouseover\", function() {\n  alert(\"Déclenchement de l’événement mouseover\");\n\
  });\n```\n\n标记可以检测信息窗口关闭对应的事件。该事件通过关闭按钮或调用 `GMap2` 或 `GMarker` 类的 `closeWindowInfo`\
  \ 方法触发。\n\n## 使用外部服务\n\n以下代码说明了该机制的实现：\n\n```javascript\nvar divCarte = document.getElementById(\"\
  carte\");\n\nvar carte = new GMap2(divCarte);\n\n(...)\n\n// 添加标记\nvar point = new\
  \ GLatLng(47.2228, -1.5682);\n\nvar marqueur = new GMarker(point)\n\ncarte.addOverlay(marqueur);\n\
  \n// 添加信息窗口\nmarqueur.openInfoWindowHtml(\"Une fenetre d'information\");\n\n// 定义并注册监听器\n\
  GEvent.addListener(marqueur, \"infowindowclose\", function() {\n  alert(\"Déclenchement\
  \ de l’événement infowindowclose\");\n});\n```\n\n## 扩展\n\n有多种扩展可以丰富 Google Maps\
  \ 的功能。Make Williams 的网站提供了非详尽的列表，地址为：`http://www.econym.demon.co.uk/googlemaps/extensions.htm`。\n\
  \n在本节中，我们仅详细介绍允许基于透明图像自定义区域形状的扩展。\n\n### EInsert 扩展\n\nMake Williams 为 Google Maps\
  \ 提供了一个非常有用的扩展，允许在地图上使用自定义形状。其目标是能够将任何图形以透明图像的形式用于地图上。\n\n`EInsert` 扩展及其文档可以在 `http://www.econym.demon.co.uk/googlemaps/einsert.htm`\
  \ 访问。该扩展通过标准的 `script` 标签直接安装到页面中，如下代码所示：\n\n```html\n<html>\n<head>\n(...)\n<script\
  \ type=\"text/javascript\" src=\"einsert.js\"></script> (...)\n</head>\n(...)\n\
  </html>\n```\n\n我们将实现一个用于界定点周围圆形区域的形状。以下代码展示了该功能的实现：\n\n```javascript\nvar carte\
  \ = new GMap2(document.getElementById(\"carte\"));\n\n(...)\n\ncarte.setCenter(new\
  \ GLatLng(47.21257, -1.54769), 11);\n\nvar centreForme = new GLatLng(47.21257, -1.54769);\n\
  var imageForme = \"circle.png\";\nvar tailleForme = new GSize(800,800);\nvar zoomForme\
  \ = 13;\n\nvar zoneCirculaire = new EInsert(centreForme, imageForme, tailleForme,\
  \ zoomForme);\n\ncarte.addOverlay(zoneCirculaire);\n```\n\n表 13.8 汇总了上述代码中使用的 `EInsert`\
  \ 类构造函数（标记 ❶）的不同参数。\n\n### 表 13.8 EInsert 类的构造函数参数\n\n| 参数 | 描述 |\n| :--- | :---\
  \ |\n| `centreZone` | 指定形状中心的位置。在上面的示例中，形状中心位于南特市中心（标记 ❷）。 |\n| `imageZone` | 指定存储形状的文件路径。在上面的示例中，区域形状存储在一个对应圆形的透明图像中（标记\
  \ ❸）。 |\n| `tailleZone` | 指定形状显示的大小。在上面的示例中，图像使用的时宽度和高度均为 800（标记 ❹）。 |\n| `zoomZone`\
  \ | 指定形状显示时的缩放级别（标记 ❺）。 |\n| `zindexZone` | 指定形状的堆叠顺序。该参数可以取以下值：– -1：形状位于其他 Google\
  \ Maps 形状之下。– 1：形状位于其他 Google Maps 形状之上。– 0：基于调用 `addOverlay` 方法的顺序。– 其他：允许指定不同\
  \ `EInsert` 类实例之间的堆叠顺序。 |\n\n`EInsert` 类提供了 `hide` 和 `show` 方法，分别用于隐藏和显示形状。图 13.7\
  \ 展示了该扩展的实现。\n\n## dojo 中的 Google Maps 支持\n\ndojo 库通过图形组件 `dojo.widget.GoogleMap`\
  \ 提供对 Google Maps 的支持。该库完全隐藏了包含工具接口的 JavaScript 文件链接规范。该组件会自动添加一个 `script` 标签以访问此\
  \ API。\n\n以下代码说明了如何在 HTML 页面中实现该支持。使用密钥在 `djConfig` 对象级别指定（标记 ❶）。组件的导入通过 `dojo.require`\
  \ 方法（标记 ❷）完成：\n\n```html\n<html>\n<head>\n(...)\n<script type=\"text/javascript\"\
  >\nvar djConfig={\n  iDebug: true,\n  googleMapKey:\"maCle\"\n};\n</script>\n<script\
  \ type=\"text/javascript\" src=\"../../dojo.js\"></script>\n<script type=\"text/javascript\"\
  >\ndojo.require(\"dojo.widget.GoogleMap\");\n</script>\n</head>\n(...)\n</html>\n\
  ```\n\ndojo 的 `dojo.widget.GoogleMap` 模块允许在网页中插入地图。它的工作方式与第 11 章描述的相同，可以使用相同的技术对其进行操作。\n\
  \n以下代码描述了该模块的使用：\n\n```html\n<html>\n(...)\n<body>\n(...)\n<div dojoType=\"googlemap\"\
  \ id=\"carte\" class=\"carte\" controls=\"smallmap\"></div>\n(...)\n</body>\n</html>\n\
  ```\n\n该组件提供了通过其 `controls` 属性指定地图不同控制元素的机会。\n\n要定义地图的宽度、高度以及边界，必须通过其 `class` 属性为地图指定\
  \ CSS 样式。上述地图的样式如下：\n\n```css\n.carte{\n  width:100%;\n  height:400px;\n  border:1px\
  \ solid black;\n}\n```\n\n此外，该组件还允许基于简单的 HTML 表格为地图加载标记。组件与数据关联通过 `datasrc` 属性实现，该属性引用表格的\
  \ ID。以下代码描述了该功能的实现：\n\n```html\n<div dojoType=\"googlemap\" id=\"carte\" class=\"\
  carte\" datasrc=\"mesDonnees\"></div>\n<table id=\"mesDonnees\">\n  <thead>\n  \
  \  <tr>\n      <th>Lat</th>\n      <th>Long</th>\n      <th>Icon</th>\n      <th>Description</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>47.18737</td>\n      <td>-1.54701</td>\n\
  \      <td></td>\n      <td><div>Commune de Rezé.</div></td>\n    </tr>\n    <tr>\n\
  \      <td>47.17011</td>\n      <td>-1.47834</td>\n      <td></td>\n      <td><div>Commune\
  \ de Vertou.</div></td>\n    </tr>\n  </tbody>\n</table>\n```\n\n\n\n\n表格的标题列允许指定标记（标记\
  \ ❷）的经纬度数据在表格中的位置，分别对应 `Long` 和 `Lat` 代码（标记 ❶），以及通过 `Description` 代码（标记 ❸）与之关联的提示气泡文本（标记\
  \ ❹）。\n\n组件包含的地图可以通过类型为 `GMap2` 的 `map` 属性进行访问。基于此实例，之前章节中描述的所有功能均适用。为了实现这些功能，建议使用\
  \ dojo 的功能来扩展组件。\n\n## 使用外部服务\n\n### 案例研究\n在本节中，我们将详细介绍如何在 Google Maps 地图上通过标记和提示气泡，对地图显示的地理范围内的站点进行定位。稍后我们还将看到如何指定站点的位置。\n\
  \n### 站点的地理搜索\n该功能的目标是显示位于地图所示地理范围内的所有站点或特定类型的站点。这种机制可以避免对位置不在地图显示区域内的站点进行标记，从而减轻应用程序的内存消耗。\n\
  \n该功能通过 `AfficherSites` 类实现。该类基于地图并注册为观察者来监听 `moveend` 事件（对应地图移动结束）和 `zoomend` 事件（对应缩放级别修改结束）。后者观察者可以防止地图过载，因为只有当地图缩放级别大于\
  \ 10 时才会显示站点。\n\n该类的实例必须使用使用的地图以及过滤条件输入表单实例进行初始化，该实例本身负责显示地图上对应站点位置标记。\n\n以下代码描述了\
  \ `AfficherSites` 类的实现：\n\n```javascript\nfunction AfficherSites(carte, formulaire)\
  \ {\n  this.carte = carte;\n  this.formulaire = formulaire;\n  this.marqueursSites\
  \ = {};\n  this.fenetreInformationOuverte = false;\n  this.zoomCourant = 0;\n  this.initialisation();\n\
  }\n\nAfficherSites.prototype = {\n  initialisation: function() {\n    GEvent.bind(this.carte,\
  \ \"click\", this, this.gestionCliqueCarte);\n    this.affichageCarteModifie();\n\
  \  },\n  gestionCliqueCarte: function(marqueur, point) {\n    if( marqueur!=null\
  \ ) {\n      this.fenetreInformationOuverte = true;\n      var siteMarqueur = this.marqueursSites[marqueur.getPoint().toString()];\n\
  \      marqueur.openInfoWindowHtml(siteMarqueur.nom+\"\\ ➥<br/>\"+siteMarqueur.descriptionCourte);\n\
  \    }\n  },\n  miseAJourFormulaire: function(extremiteBasseGauche, extremiteHauteDroite)\
  \ {\n    (...)\n  },\n  recupererSitesRappel: function(type, sites) {\n    this.afficherSites(sites);\n\
  \  },\n  recupererSites: function() {\n    (...)\n  },\n  afficherSites: function(sites)\
  \ {\n    if( this.fenetreInformationOuverte==true ) {\n      return;\n    }\n  \
  \  this.carte.clearOverlays();\n    var zoom = this.carte.getZoom();\n    if( zoom<10\
  \ ) {\n      return;\n    }\n    for(var cpt=0; cpt<sites.length; cpt++) {\n   \
  \   var site = sites[cpt];\n      var localisation = new GLatLng(site.x, site.y);\n\
  \      var marqueur = new GMarker(localisation);\n      GEvent.addListener(marqueur,\
  \ \"infowindowclose\", function() {\n        this.fenetreInformationOuverte = false;\n\
  \      });\n      this.carte.addOverlay(marqueur);\n      this.marqueursSites[marqueur.getPoint()]\
  \ = site;\n    }\n  },\n  affichageCarteModifie: function () {\n    var extremites\
  \ = this.carte.getBounds();\n    var extremiteBasseGauche = extremites.getSouthWest();\n\
  \    var extremiteHauteDroite = extremites.getNorthEast();\n    this.miseAJourFormulaire(extremiteBasseGauche,\
  \ extremiteHauteDroite);\n    this.recupererSites();\n  },\n  zoomCarteModifie:\
  \ function (ancienZoom, nouveauZoom) {\n    if( zoom<10 ) {\n      this.carte.clearOverlays();\n\
  \    }\n  }\n}\n```\n\n当用户移动显示的地理范围时，会调用前一个类的 `affichageCarteModifie` 方法（标记 ❶）。它首先计算新的的地图边界（标记\
  \ ❷），以便通过 `miseAJourFormulaire` 方法（标记 ❸）更新条件表单。\n\n随后，它依赖 `recupererSites` 和 `recupererSitesRappel`\
  \ 方法（标记 ❹）执行一个包含该表单信息的 Ajax 请求，以获取坐标位于所显示地理范围内的站点列表。Ajax 请求的异步特性要求使用 `recupererSitesRappel`\
  \ 回调方法。为了可读性，我们省略了该方法的实现。\n\n最后，调用 `afficherSites` 方法（标记 ❺）来为 Ajax 请求返回的站点构建并添加标记。`PositionnerSite`\
  \ 类支持为已定位的标记打开和关闭信息窗体。\n\n请注意 `zoomCarteModifie` 方法（标记 ❻） 的存在，它允许在缩放级别过低时删除所有标记。这种机制可以防止在地图上显示过多的标记。\n\
  \n该类在应用程序中的实现方式如下：\n\n```javascript\nvar carte = (...)\nvar formulaireCriteres =\
  \ document.getElementById(\"criteres\");\nvar afficher = new AfficherSites(carte,\
  \ formulaireCriteres);\nGEvent.bind(carte, \"moveend\", afficher, afficher.affichageCarteModifie);\n\
  GEvent.bind(carte, \"zoomend\", afficher, afficher.zoomCarteModifie);\n```\n\n###\
  \ 站点定位\n基于 Google Maps，可以很容易地通过地图上的标记来实现站点位置信息的输入。我们将此功能结构化为一个类，并将其命名为 `PositionnerSite`。该类基于地图，并注册为地图\
  \ `click` 事件的观察者，以及已定位标记的 `dragend` 事件的观察者。\n\n该类的实例必须使用使用的地图以及站点实例进行初始化，以便定位站点。该实例将通过其\
  \ `miseAJourPosition` 方法被其位置发生了变化。\n\n以下代码描述了 `PositionnerSite` 类的实现：\n\n```javascript\n\
  function PositionnerSite(carte, site) {\n  this.carte = carte;\n  this.marqueurPositionne\
  \ = false;\n  this.site = site;\n  this.marqueurCourant = null;\n}\n\nPositionnerSite.prototype\
  \ = {\n  positionnerSite: function (marqueur, point) {\n    if( marqueur==null &&\
  \ this.marqueurPositionne==false ) {\n      this.marqeurCourant = new GMarker(point,\
  \ {draggable: true});\n      this.carte.addOverlay(this.marqeurCourant);\n     \
  \ GEvent.bind(this.marqeurCourant, \"dragend\", this, this.deplacerMarqueur);\n\
  \      this.marqueurPositionne=true;\n      this.site.miseAJourPosition(point.x,\
  \ point.y);\n    } else {\n      this.carte.removeOverlay(marqueur);\n      GEvent.clearListeners(marqueur,\
  \ \"dragend\");\n      this.marqueurCourant = null;\n      this.marqueurPositionne=false;\n\
  \      this.site.miseAJourPosition(0, 0);\n    }\n  },\n  deplacerMarqueur: function()\
  \ {\n    var point = this.marqeurCourant.getPoint();\n    this.site.miseAJourPosition(point.x,\
  \ point.y);\n  }\n}\n```\n\n\n\n\n该类防止在此项功能上使用多个标记。其 `marqueurPosition` 属性可以确保这一点（参考标记\
  \ ❶）。如果不存在，则将为当前位置添加标记（参考标记 ❷）。\n\n`draggable` 属性允许通过拖放进行移动。点击标记可以将其删除（参考标记 ❸）。\n\
  \n每当标记位置发生变化以及在创建和删除时，网站都会使用新坐标进行更新（参考标记 ❹）。\n\n该类在应用中的实现方式如下：\n\n```javascript\n\
  var carte = new GMap2(document.getElementById(\"carte\"));\n\n(...)\n\nvar site\
  \ = (...)\n\nvar positionnement = new PositionnerSite(map,site);\n\nGEvent.bind(map,\
  \ \"click\", positionnement, positionnement.positionnerSite);\n```\n\n## 结论\n\n\
  Google Maps 是一个强大的 JavaScript 工具，允许为 JavaScript 应用程序添加许多有趣的地图功能。应用程序与该工具之间的交互非常细致，因为应用程序可以感知到用户在显示的地图上进行的任何细微操作。\n\
  \n该工具的开发者致力于提供一个简单、可扩展且易于使用的编程 API。\n\n## 外部服务的使用\n\nGoogle Maps 的使用允许我们描述一个在 JavaScript\
  \ 应用程序中使用外部 JavaScript API 的示例。许多其他工具也提供了类似的 API 以访问相关服务。\n\n### Yahoo! 和 Amazon\
  \ 提供的服务\n\nYahoo! 和 Amazon 等公司向外部应用程序提供访问其信息系统数据的服务，这些通过 REST（表示状态转移）架构实现。\n\n这些服务允许以\
  \ XML 和 JSON 等格式交换数据，从而使其能够直接在 JavaScript 应用程序中使用。\n\n在这种情况下，必须实现 Ajax 技术来调用这些服务并获取返回的数据。\n\
  \n本章详细说明了在 JavaScript 应用程序中使用此类可通过访问的服务时需要实现的机制。\n\n### Yahoo!\n\nYahoo! 提供了多种免费和付费在线服务。Yahoo!\
  \ 创建于 1995 年，最初是一个网站目录，其人气使得新网站不断加入目录，使其逐渐转变为门户网站。这些服务包括电子邮件（网页版和即时）、邮件列表托管以及各种信息门户。\n\
  \nYahoo! 在互联网上提供了多种服务，特别涉及地图、网络搜索、音乐和通过 REST 架构提供的信息。目标是为应用程序提供与这些服务交互的能力。\n\n表\
  \ 14.1 汇总了 Yahoo! 的主要服务及其执行地址和文档地址。\n\n**表 14.1 Yahoo! 提供的主要服务**\n\n| 名称 | 描述 |\n\
