  \ 第六部分\n\n## 结论\n\n本章介绍了不同的工具，这些工具在使用 `JavaScript` 语言的开发、调试和故障排除阶段提高效率。\n\n`jsDoc`\
  \ 工具表明，生成良好的文档也是可能的。这些文档经常被忽视，但它们对于维护包含 `JavaScript` 的应用程序至关重要。然而，`jsDoc` 的使用取决于此前是否付出了大量的注释工作。\n\
  \n本章最后讨论的几提供了优化脚本加载时间的改进建议。这既可以在 `JavaScript` 脚本的大小上实现，也可以通过加载方式实现。\n\nLivreGougeon\
