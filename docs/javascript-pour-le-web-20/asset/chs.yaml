  \ 类型，可以通过实例化该类来显式创建。随后，必须通过其 `addNode` 方法添加到树中。\n\n表格 12.33 和 12.34 汇总了该类的构造函数参数及其不同的方法。\n\
  \n### 表 12.33 `rialto.widget.TreeNode` 类的构造函数参数\n\n| 参数 | 类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `icon` | 字符串 | 对应为节点显示的图像路径。 |\n| `icon2` | 字符串 | 对应节点打开时显示的图像路径。\
