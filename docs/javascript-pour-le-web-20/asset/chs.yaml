  \ `userAgent` 属性值的完整列表。\n\n### Web 图形界面的基础\n\n在第 2 章中讨论的概念——正则表达式可以用于根据此属性检测浏览器。也可以通过检查属性或方法是否存在来实现检测，这种方法可以检测当前浏览器是否支持该机制。\n\
