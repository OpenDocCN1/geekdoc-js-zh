  \ | 对应 `dojo.widget.manager` 对象的 `removeById` 方法。 |\n\n在以下代码中，`addWidget` 方法（标记\
  \ ❶）允许将组件添加到组件管理器：\n\n```javascript\n// 获取挂载的 div 标签\nvar monDiv = dojo.byId(\"\
