  var typeComposant = \"ContentPane\";\nvar composants = dojo.widget.byType(typeComposant);\n\
  ```\n\n第二个函数根据传入的过滤函数返回一个元素或元素列表。以下代码给出了如何访问特定 DOM 节点的图形组件的示例：\n\n```javascript\n\
