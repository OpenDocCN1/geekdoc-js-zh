  md: '# SEEING WHAT TEXT LOOKS LIKE WITHOUT HTML


    Markup languages, like HTML, were invented in order to give documents (such as
    letters, books, or essays) structure that a computer can understand and do things
    with.


    Here''s a simple list that a person can understand with no problem:


    +   - Things I Need

    - carrots

    - spinach


    As a human, you see this list and understand it. But to a computer, this list
