- img_proc: true
  md: 'Some colors can be named using color words. These include the names that you’re
    familiar with such as red, blue, pink, and yellow. There are also more exotic
    and interesting colors available, and they have names like HoneyDew, HotPink,
    and LemonChiffon (yum!).


    Even the full list of color names in CSS doesn''t come close to describing every
    color you might want to use. Fortunately, CSS also lets us specify colors using
    a code called RGB notation. RGB notation uses different amounts of red, green,
    and blue to make every possible color. RGB colors are made up of three numbers,
    ranging from 0 to 255. The color red is made up of all red, no green, and no blue,
    so it''s written as (255, 0, 0). The color black is made up of no color at all,
    so it''s written as (0, 0, 0). The color blue is all blue, no red, and no green,
    and its RGB code is (0, 0, 255). Can you figure out how to make purple?


    Table 4-2 lists some color names you can use in HTML, as well as their RGB codes.


    # TABLE 4-2 STANDARD COLOR NAMES


    | Color Name | RGB Value | Color Swatch |

    |---|---|-|

    | Aqua | (0, 255, 255) | |

    | Black | (0, 0, 0) | |

    | Blue | (0, 0, 255) | |

    | Fuchsia | (255, 0, 255) | |

    | Gray | (128, 128, 128) | |

    | Green | (0, 255, 0) | |'
  merge: -1
