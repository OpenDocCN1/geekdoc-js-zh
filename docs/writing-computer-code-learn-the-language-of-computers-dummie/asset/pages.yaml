  md: '# PROJECT 3 BUILDING YOUR ROBOT''S BODY


    # CHANGING HTML USING JAVASCRIPT


    Douglas the Robot is pretty cool already, but we want to be able to interact with
    him and give him commands to make him do things. JavaScript makes it possible
    to program Douglas to respond to your commands.


    Let''s write some code to change the message on Douglas''s shirt dynamically,
    using JavaScript!


    +   1 Type the following into the JavaScript pane:


    ```

    var myMess = prompt("What should my shirt say?");

    document.getElementById("message")

    innerHTML=myMess;

    ```


    The final code should look like Figure 3-11.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_69_0.png)


    Figure 3-11: The final code for Douglas the Robot.


    +   2 Click Run.


    A popup window appears, asking you to type in a new message.'
  merge: -1
  pgno: 69
