  md: '# PROJECT 3 BUILDING YOUR ROBOT''S BODY


    The job of this command is to look at the HTML and find an element by its unique
    ID. In this case, it''s looking for the element with the ID of message.


    ```

    getElementByIdById("message")

    ```


    This command searches and finds this HTML element:


    ```

    <p id="message">I love to Code!</</p>

    ```


    The next command tells JavaScript that we want to change the HTML and what to
    change it to:


    ```

    .innerHTML=myMess

    ```


    The “inner” HTML is this part of the HTML element:


    ```

    I Love to Code!

    ```


