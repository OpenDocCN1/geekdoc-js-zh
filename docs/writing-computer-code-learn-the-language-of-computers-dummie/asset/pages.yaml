  md: "# PROJECT 5 ANIMATING YOUR ROBOT\n\nAfter JavaScript has located the element\
    \ to change, you tell JavaScript what part of that element you want to change.\n\
    \nIn Chapter 3, order to tell JavaScript to change the HTML, we used .innerHTML:\n\
    \n```\ndocument.getElementById(\"message\").innerHTML = \n\"Coding is Fun!\";\n\
    ```\n\nThe inner HTML of an element is everything between the starting and ending\
    \ tags.\n\nJust as elements have inner HTML, which you can changing using .innerHTML,\
    \ elements also have style, which you can change using .style.\n\n```\ndocument.getElementById(\"\
    lefteye\").style\n```\n\nAfter you've told JavaScript that that you want to change\
    \ a style, you need to tell JavaScript what property you want to change.\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_93_0.png)\n\
    \n> CSS properties let you things like the size, color, font, and position of\
    \ HTML elements.\n\nTo change the background color of Douglas's left eye, you\
    \ use the backgroundColor property:\n\n```\ndocument.getElementById(\"lefteye\"\
    )\n.style.backgroundColor\n```\n\nYou then tell it what the new value of the property\
    \ should be. To change the style property of backgroundColor to the value of purple,\
    \ we use this code:\n\n```\ndocument.getElementById(\"lefteye\")\n.style.backgroundColor\
    \ = \"purple\";\n```\n\nJavaScript style properties are not always spelled the\
    \ same as CSS style properties. JavaScript style use camelCase capitalization\
    \ instead of dashes to separate multiple words.\n\nTable 5-1 shows some common\
    \ CSS properties along with their JavaScript counterparts."
