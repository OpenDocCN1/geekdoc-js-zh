  md: "**ID selectors:** The id attribute of an HTML element is how you can uniquely\
    \ identify an element. Think of an id attribute as being like an element's name.\
    \ If your teacher wants to call on a single student in your class, she can do\
    \ that by using the student's name. Using an ID selector works the same way.\n\
    \nDouglas has two eyes, which know are both part of the \"eye\" class. But we\
    \ also need to be able to style, move, blink, and wink his eyes separately. To\
    \ make this possible, we gave each eye its own unique name. The right eye is called\
    \ (appropriately enough) \"righteye\" and the left eye is called \"lefteye\",\
    \ as you can see in the HTML for his eyes:\n\n```\n<div class=\"eye\" id=\"righteye\"\
    ></div>\n<div class=\"eye\" id=\"lefteye\"></div>\n```\n\nID selectors start with\
    \ a hash symbol (#) and select elements using the element's unique name, or ID\
    \ attribute.\n\nFor example, Douglas's left eye and right eye have separate ID\
    \ attributes (see Figure 4-4).\n\n```\n#righteye {\n  position: absolute;\n  left:\
    \ 20%;\n  top: 20%;\n}\n\n#lefteye {\n  position: absolute;\n  left: 60%;\n```\n\
    \n![](img/1e031b40c08e37dffac2e4567cc3504c_78_0.png)\n\nFigure 4-4: Douglas's\
    \ eyes have separate IDs.\n\nID selectors are useful when you need to select a\
    \ single element in an HTML document."
  merge: -1
  pgno: 78
