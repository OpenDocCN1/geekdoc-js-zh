  md: '# PROJECT 1 BECOMING A PROGRAMMER


    ![](img/1e031b40c08e37dffac2e4567cc3504c_10_0.png)


    COMPUTERS CAN''T DO THINGS ON THEIR OWN. They need a computer program to tell
    them what to do, and they need people to write those computer programs. The people
    who write the code to make computers do all sort of things are called computer
    programmers.


    # WHAT IS PROGRAMMING?


    A computer program is a group of instructions that can be understood and followed
    by a computer. Another name for a computer program is *software*. Computer programming,
    also known as *coding*, is what we call it when we write these instructions.


    Figure 1-1 shows a computer code.


    Right now, this computer code may look confusing, but after you''ve read this
    book, you''ll understand how to read it and even write it yourself!'
  merge: -1
  pgno: 10
