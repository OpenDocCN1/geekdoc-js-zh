    ![](img/1e031b40c08e37dffac2e4567cc3504c_70_0.png)


    Now let''s take a closer look at this JavaScript code:


    ```

    var myMess = prompt("What should my shirt say?");

    document.getElementById("message")

    .innerHTML=myMess;

    ```


    This code is made up of two statements. This first statement tells JavaScript
    to ask you a question. Another name for a question is a prompt.


    ```

    var myMess = prompt("What should my shirt say?");

    ```


    After you''ve answered this question, your answer gets put into your variable,
    var myMess, where it will be stored and used by the next statement.


    The next statement has a command:


    ```

    getElementById

    ```'
