    # NESTING HTML TAGS


    Writing HTML is pretty easy once you know a few things about how tags are put
    together. The first thing to know is that most HTML documents share a very similar
    basic structure, and they all must follow a few basic rules.


    The first rule of writing HTML is that tags need to be opened and closed in the
    right order. One way to remember this is *FILO*, which stands for *First In, Last
    Out*


    Notice that the grocery list earlier starts with the `<html>` tag and ends with
    the `</html>` tag. This is how every HTML document should start and end. All the
    other tags in a web page are “inside” the `html` tags, and they’re closed according
    to FILO.'
  merge: -1
  pgno: 57
- img_proc: true
  md: "For example, the `<head>` element is inside of `<html>`. Therefore, the closing\
    \ `head` tag must come before the closing `html` tag:\n\n```\n<html>\n  <head>\n\
    \  </head>\n</html>\n```\n\nThe `<ol>` tag comes after the `<body>` tag, so `<ol>`\
    \ is inside of `<body>` and you have to put the `</ol>` tag before the `</body>`\
    \ tag:\n\n```\n<html>\n  <head>\n  </head>\n  <body>\n    <ol>\n    </ol>\n  </body>\n\
    </html>\n```\n\nHTML elements are put together in a similar way to Russian nesting\
    \ dolls (see Figure 3-3). One element goes inside of another. Another word for\
    \ the way HTML tags fit inside of each other is nesting.\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_58_0.png)\n\
    \nFigure 3-3: HTML tags nest in the same way that Russian nesting dolls do."
  merge: -1
  pgno: 58
- img_proc: true
  md: '# PROJECT 3 BUILDING YOUR ROBOT''S BODY


    Another rule when writing HTML is that documents always have a head element and
    a body element:


    +   The head element: The head element is like the brain of your web page. JavaScript
    code often goes into the head element, but it doesn''t display in the web browser
    window.


    In the grocery list, we have only a title tag in the head. The title is what displays
    at the top of the browser window or in your browser''s tab when you''re on a web
    page. Whatever you put inside the title tag is usually what shows up as a link
    in search results, too.


    +   The body element: The body element is where everything you want to display
    in the web browser goes. In the grocery list, we have several elements in the
    body:


    +   The h1 element: The h1 element can be used to identify the most important
    header on your web pages. Headers typically identify sections of documents or
    web pages. For example, if this chapter were a web page, the first h1 element
    would come right after the chapter introduction and would read "Writing HTML."


    +   The ol element: Following the h1 element, we have an ol element. ol stands
    for ordered list. An ordered list is a list of items that are numbered or lettered
    in a particular order. HTML also lets you make unordered lists, by using the ul
    (for unordered list) tag. Unordered list will display with a dot, or bullet, to
    the left of each item.


    +   The li element: Following the ol element, we have an li element. Inside of
    either an ol or ul element, you can use any number of li elements (li stands for
    list item) to create the individual list items in your list.


    # WRITING YOUR FIRST HTML DOCUMENT


    Now that you''ve seen the basic rules of HTML, you''re ready to build your first
    HTML document.'
