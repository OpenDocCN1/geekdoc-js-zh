  md: '# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    ![](img/1e031b40c08e37dffac2e4567cc3504c_34_0.png)


    # JUST AS SPOKEN LANGUAGES HAVE RULES (CALLED GRAMMAR), COMPUTER PROGRAMMING LANGUAGES
    HAVE RULES (CALLED SYNTAX).


    When you understand the basic rules of speaking JavaScript, it actually looks
    similar to English.


    If you think that your teacher correcting you when you say “ain’t” is strict,
    wait until you see how strict JavaScript is! It won’t even listen to a thing you
    say if you make certain kinds of syntax errors.


    When you write in a human language, your sentences are made up of different parts,
    such as nouns and verbs (see Figure 2-1).


    In JavaScript, sentences are called statements. Statements are made up of different
    parts, such as operands (which are like nouns) and operators (which are like verbs).'
  merge: -1
