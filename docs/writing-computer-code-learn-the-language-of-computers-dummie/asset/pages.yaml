  md: "# PROJECT 5 ANIMATING YOUR ROBOT\n\nThis variable declaration creates a shortcut\
    \ for us to refer to the right eye. Now that this has been created, every time\
    \ you need to refer to Douglas's right eye in the rest of the program, you can\
    \ just use the variable named rightEye.\n\nTell JavaScript to listen for mouse\
    \ clicks on the right eye with this statement:\n\n```\nrightEye.addEventListener(\"\
    click\", moveUpDown);\n```\n\nThis statement is what's called an event listener.\
    \ Here's how it works.\n\nFirst, it locates an element — in this case, the rightEye,\
    \ with the ID of \"righteye\"\n\n```\nvar rightEye = document.getElementById(\"\
    righteye\");\n```\n\nOnce it knows what element you're talking about, it adds\
    \ an event listener to that element. The job of an event listener is to wait until\
    \ something happens and then take an action. In this case, it's waiting for you\
    \ to click your mouse on the selected element (rightEye).\n\nOnce it detects that\
    \ you've clicked the rightEye element, it will take an action. In this case, the\
    \ action it will take is called moveUpDown. We've already created the moveUpDown\
    \ action, which you can see in the JavaScript window.\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_101_0.png)\n\
    \n> Another name for an action is function. Just like a toaster has an action\
    \ it can do (toast bread), Douglas has a function he can do, which is called moveUpDown.\n\
    \nHere's the JavaScript code for Douglas's moveUpDown function:\n\n```\nfunction\
    \ moveUpDown(e) {\n  var robotPart = e.target;\n  var top = 0;\n\n  var id = setInterval(frame,\
    \ 10) // draw every 10ms\n```\n\n*"
