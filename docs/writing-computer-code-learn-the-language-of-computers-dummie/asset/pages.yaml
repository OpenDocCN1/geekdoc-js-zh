  md: '# PROJECT 4 GIVING YOUR ROBOT STYLE


    EVERYONE HAS HIS OR HER OWN INDIVIDUAL STYLE. Your style might be similar to your
    best friend''s style, or it might be totally different. You may feel most comfortable
    in jeans and a T-shirt, and your best friend might prefer being dressed up. Styles
    also come and go: What''s in style today might look silly ten years from now.
    If you don''t believe us, ask your parents to see a photograph of what they looked
    like in high school. When you''re done laughing, read on.


    You can change the way you look by changing your clothes. But what makes you who
    you are, doesn''t change when you change your clothes. In the same way, it''s
    possible to change the way HTML looks without changing its content and structure.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# PROJECT 4 GIVING YOUR ROBOT STYLE


    The language used to change HTML’s style is called Cascading Style Sheets (CSS).
    In this chapter, we show you what CSS is and how you can use it to give your robot
    some style.


    CSS dresses up your robot by adding colors, borders, backgrounds, and varying
    sizes to elements. CSS can change where elements are positioned on your screen,
    and it can even control special effects such as animation!


    # GIVING DOUGLAS STYLE


    In the last chapter, we built Douglas’s HTML skeleton. We can tell that it’s Douglas,
    but his looks are a bit boring! Sure, he’s got some nice blue eyes, and “I Love
    to Code!” T-shirt is pretty cool. But he doesn’t look like the fun and goofy robot
    that we know Douglas to be, so let’s give him a unique style all his own!


    To get started, open your web browser and log into your JSFiddle account. Then
    go to the public dashboard at www.jsfiddle.com/open/fiddles and follow these steps:


    +   Find the fiddle called Chapter 4 – Styling Douglas, and click the title to
    open it.


    You’ll see a screen with HTML in the HTML panel and some CSS in the CSS panel,
    as shown in Figure 4-1.


    +   Click Fork in the top menu to make a copy of the fiddle in your own JSFiddle
    account.


    Now you’re ready to start giving Douglas some style!'
  merge: -1
  pgno: 73
- img_proc: true
  md: "![](img/1e031b40c08e37dffac2e4567cc3504c_74_0.png)\n\n# GETTING THE BASICS\
    \ OF CSS\n\nTake a look at the first three lines in the CSS pane:\n\n```\nbody\
    \ {\n  font-family: Arial;\n}\n```\n\nThese three lines form a CSS rule. A CSS\
    \ rule consists of two main components:\n\n+   **Selector:** The selector indicates\
    \ what parts of the HTML we're going to be styling. In this case, it's the body\
    \ element. In other words, the styles that we set will apply to everything that\
    \ comes between <body> and </body> in the HTML."
  merge: -1
  pgno: 74
- img_proc: true
  md: '# PROJECT 4 GIVING YOUR ROBOT STYLE


    **Declaration block:** The declaration block contains one or more CSS declarations,
    which indicate how to style the selected element(s). In this example, we have
    just one declaration: `font-family: Arial;`. This declaration will change the
    look, or font, of all the text that appears in the Result pane.


    The HTML body element is where everything that will display in your document goes.
    Even though you don''t need to type it into JSFiddle, it''s still there, because
    JSFiddle puts it into the Result pane for you.


    # CSS SELECTORS


    The selector is the part of the CSS rule that comes before the { . CSS selectors
    tell the web browser which HTML elements a style should apply to.


    The official name for the { and } characters are curly braces or curly brackets.
    You can also call them mustaches, though, because they look like fancy mustaches
    turned on their sides. Figure 4-2 shows Douglas sporting a curly brace mustache.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_75_0.png)


    Figure 4-2: Douglas demonstrating that curly braces look like mustaches.'
  merge: -1
  pgno: 75
- img_proc: true
  md: "![](img/1e031b40c08e37dffac2e4567cc3504c_76_0.png)\n\nWhen you select an element\
    \ to apply a style to, that same style is applied to every element inside the\
    \ selected element. \n\nCSS selectors have a number of different ways to select\
    \ elements. Let's look at three of these while working with Douglas the Robot:\n\
    \n+   **Element selectors:** Take a look at the first two rules in the CSS panel:\n\
    \n```css\nbody {\n  font-family: Arial;\nnp {\n  font-size: 1em;\n}\n```\nThese\
    \ are both examples of element selectors. Element selectors select HTML-elements\
    \ using the name of the element.\n\nTo use an element selector, just type the\
    \ name of the element you want to select. In these cases, we're selecting the\
    \ body element (which uses `<body>` and `</body>` tags) and the p element (which\
    \ uses `<p>` and `</p>` tags).\n\n+   **Class selectors:** Class selectors are\
    \ ideal for times when you need to apply the same style to multiple elements.\n\
    nYou can think of them like a class in school — many kids are all in the same\
    \ class and that class has a name (like History or Math). All the students in\
    \ the class are unique, but they're all learning the same subject because they're\
    \ all part of the same class."
  merge: -1
  pgno: 76
- img_proc: true
  md: "# PROJECT 4 GIVING YOUR ROBOT STYLE\n\nNow take a look at the third CSS rule\
    \ in the JavaScript CSS pane:\n\n```\n.eye {\n  background-color: blue;\n  width:\
    \ 20%;\n  height: 20%;\n  border-radius: 50%;\n}\n```\n\nThe class selector starts\
    \ with a period (.), followed by the name of the class.\n\nIn this case, we're\
    \ selecting all the elements that have class=\"eye\". If you look in the HTML\
    \ pane, you can see that there are two elements with class=\"eye\". These are\
    \ used to make Douglas's eyes.\n\n> When you put text like something=\"something\"\
    \ inside a starting tag in HTML, that's called an attribute. For example, in the\
    \ tag <p class=\"myText\">, class is an attribute and its value is myText.\n\n\
    The same style is applied to both of Douglas's eyes. They're both blue, and they're\
    \ the same size (see Figure 4-3).\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_77_0.png)\n\
    \nFigure 4-3: Douglas's eyes are styled with class selectors."
  merge: -1
