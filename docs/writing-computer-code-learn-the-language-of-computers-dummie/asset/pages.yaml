  md: '# PROJECT 1 BECOMING A PROGRAMMER


    ![](img/1e031b40c08e37dffac2e4567cc3504c_17_0.png)


    # WRITING NUMBERS IN BINARY CODE


    Do you want to learn to count like a computer? We''ll show you how to write any
    number between 0 and 255 in binary code. For this example, we''ll write the number
    150 in binary code.


    +   Write the following numbers horizontally at the top of a piece of paper:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    These numbers are your binary cheat sheet.


    +   Underneath these numbers, write the number that you want to convert to binary,
    which is 150.


    +   Start with the first number you wrote on your paper, 128. If this number fits
    inside of 150, write a 1 under it. If it doesn''t fit inside of 150, write a 0
    under it.


    Because 128 can fit inside of 150, put a 1 under the 128.


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    +   Subtract the number 128 from the number you''re writing in binary code (150):
    150 - 128 = 22. Cross out the 150 that you wrote down and write down 22.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   5 Compare the remainder to the next number in your binary cheat sheet,
    64. Does 64 fit inside of 22? It doesn''t, so write a 0 under 64 and move on to
    the next next number in the cheat sheet, 32.


    +   6 Because 32 doesn''t fit inside of 22, write a 0 under the 32, and move on
    to the next number, which is 16.


    +   7 Ah ha! 16 fits inside 22! Write a 1 under the 32 and then subtract 16 from
    22: 22 - 16 = 6. Cross out the 22 and write down 6.


    +   8 Take a look at the next number. Does 8 fit inside of 6? It doesn''t, so
    write down a 0 and move on to the next number.


    Continue doing these steps until you reach the last number of the binary cheat
    sheet. In the end, you should have the following:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    |---|---|---|---|---|---|---|-|

    | 1 | 0 | 0 | 1 | 0 | 1 | 1 | 0 |


    Now you know that 10010110 is the binary code for 150.


    A typical small computer program might contain anywhere from a couple kilobytes
    to a couple megabytes of instructions, images, and other data. You don''t have
    enough time in your busy day to type out thousands of ones and zeros. Because
    computers can''t understand what you mean when you speak your language, if you
    want to tell a computer what to do, you need to learn to write in languages that
    computers can understand.'
  merge: -1
