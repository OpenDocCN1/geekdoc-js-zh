    to turn on, and each possible obstacle would need to be described in detail.


    All these instructions need to be written as individual JavaScript commands, or
    statements.


    # MAKING A STATEMENT


    In English, we talk in sentences. In computer code, a single instruction to the
    computer is called a statement. Like a sentence, statements are made up of different
    parts and have rules that they must follow in order to be understood. A computer
    program can be made up of many statements, or even of just one statement.


    The following statement causes a web browser to open up a popup alert with the
    sentence “Coding is Fun!”


    ```

    alert("Coding is Fun!")

    ```


    If you type this statement into the JavaScript pane in JSFiddle and press Run,
    you''ll see something like Figure 2-2.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    Create a new fiddle JS


    ![](img/1e031b40c08e37dffac2e4567cc3504c_37_0.png)


    Figure 2-2: The result of a JavaScript alert statement.


    Notice that the statement contains a keyword (alert), some symbols (parentheses
    and quotes), and some text (Coding is Fun!), and ends with a semicolon (;).


    Just as an infinite number of sentences can be written using English, an infinite
    number of statements can be written with JavaScript.


    The word alert is an example of a JavaScript keyword. Many JavaScript statements
    begin with keywords, but not all of them do.


    > The semicolon is what separates one statement from another, just as a period
    separates one sentence from another. Every statement should end with a semicolon.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# FOLLOWING THE RULES


    JavaScript has several rules that must be obeyed if you want your computer to
    understand you. Here are the most important rules:


    +   - Spelling counts.


    +   - Capitalization counts.


    +   - Spacing doesn''t count.


    Coding languages are very picky about spelling. They''re picky, in fact, they
    don''t even like it when you capitalize something wrong, for example, by typing
    Alert instead of alert.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_38_0.png)


    When a programming language cares about capitalization, we call it case sensitivity.
    This name comes from the fact that it''s so sensitive about whether you use uppercase
    or lowercase letters.


    The only time when this strictness doesn''t apply is when text is surrounded by
    double quotes ("") or single quotes (''''). When that happens, spelling errors
    won''t cause problems. You can type whatever you want!


    In our “Coding is Fun!” example, you can replace the words inside the double quotes
    with anything you want! For example, you can add your name like this: "My name
    is Eva, and I think coding is fun!"


    ![](img/1e031b40c08e37dffac2e4567cc3504c_38_1.png)


    If you type anything outside the quotes, you have to follow the rules; otherwise,
    your program may not run at all.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    # GIVING AND RECEIVING DATA


    Programs come in many different sizes and have many different purposes. Here are
    three things all computer programs have in common:


    +   - All computer programs have a way to receive information from a user.

    - All computer programs have a way to give information back to a user.

    - All computer programs have a way to store and work with the information.


    Information, or data, that a program receives from a user is called input. What
    the program gives back to a user is called output (see Figure 2-3).


    What is your name?


    ![](img/1e031b40c08e37dffac2e4567cc3504c_39_0.png)


    Figure 2-3: Computers use input to create output.


    In the real world, when you want to store something, give something away (as a
    gift, for example), move something, or organize something, you often put it in
    a box.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'Computers don''t care about heart-shaped boxes of chocolates or shoeboxes with
    the latest sneakers inside them. What computers love is data. And to store and
    move around data, computers use a special kind of box called variable. A variable
    is a box you can assign a name to. This name will represent all the information
    contained in that box, or variable.


    Variables make it possible for one program to work with a variety of different
    input and produce different output.


    Follow these steps to create and use variables:


    +   1 Click the JSFiddle icon in the upper-left corner of JSFiddle to open a new
    fiddle.


    +   2 Click the following into the JavaScript pane to create a variable called
    myBook.


    ```

    var myBook = "Writing Computer Code";

    ```


    +   3 Click Run.


    If you did everything correctly, nothing will seem to have happened.


    +   4 Type the following on the next line in the JavaScript pane:


    ```

    alert(myBook);

    ```


    +   5 Click Run.


    A popup window will appear containing the words Writing Computer Code (see Figure
    2-4).


    As you can see, creating a variable in JavaScript is pretty simple! To create
    a variable, you use the var keyword, followed by the name of the variable, like
    this:


    ```

    var myBook

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    ![](img/1e031b40c08e37dffac2e4567cc3504c_41_0.png)


    Figure 2-4: Creating a variable and an alert.


    Notice how we separate words in variable names by using capital letters for every
    word after the first one. Variable names can''t contain spaces, so programmers
    have created several other ways to separate words. This particular style is called
    camelCase. Can you guess why it has that name?


    ![](img/1e031b40c08e37dffac2e4567cc3504c_41_1.png)


    As a programmer, you have a lot of freedom in naming your variables. You can get
    very creative when you name your variables, but you don''t want to get too crazy.
    Most important, your variable names should describe what you store inside of them.


    The following variables have good and descriptive names:


    ```

    var firstName

    var favoriteFood

    var birthday

    var timeOfDay

    ```


    Just by looking at these variable names, you can probably guess what kind of information
    is stored inside them.


    After looking at these examples, what would you name variables for storing the
    following information?'
  merge: -1
  pgno: 41
- img_proc: true
  md: '+   » Your pet’s name

    » Your favorite school subject

    » The name of your best friend

    » Your street address


    Here’s what we might call these variables:


    +   » myPetName

    » myFavoriteSchoolSubject

    » bestFriendName

    » myStreetAddress


    In addition to the rule that variable names must not contain spaces, there are
    several other rules that you must follow:


    +   » Variable names must begin with a letter, an underscore (_), or a dollar
    sign ($).


    +   » Variable names can contain only letters, underscores, or dollar signs.


    +   » Variable names are case sensitive (capitalization matters!).


    +   » Certain words may not be used as variable names, because they have other
    meanings within JavaScript. These so-called reserved words are as follows:


    ```

    break    class   catch

    const   continue debugger default

    delete   do       else     export

    extends finally for      function

    if       import  instanceof

    let      new      return super

    switch   this    throw    try

    typeof   var      void     while

    with     yield

    ```'
