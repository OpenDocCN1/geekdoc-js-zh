  md: "# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT\n\nThe dog jumped over\
    \ the fence\n\nFigure 2-1: Sentences are made up of different parts.\n\nIn this\
    \ chapter, you learn the basics of JavaScript syntax, and discover how operands\
    \ and operators work in JavaScript programs.\n\n# SAYING WHAT YOU MEAN\n\nAs a\
    \ programmer, your job is to think about what you want your program to do, and\
    \ then to break it down into small steps that the computer can do without making\
    \ any mistakes. If you wanted to ask a robot to go downstairs and make you a sandwich,\
    \ you might start your instructions like this:\n\n+   1 Rotate head toward stairs.\n\
    2 Use visual sensors to look for obstacles.\n3 If an obstacle is found, figure\
