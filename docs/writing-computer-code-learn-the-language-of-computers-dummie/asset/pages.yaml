  md: '# PROJECT 6 CREATING A JAVCRIPT WORD GAME


    Follow these steps to begin creating your own version of the word game:


    +   Open a new browser tab by selecting New Tab from the Chrome menu or pressing
    Cmd+C (Mac) or Ctrl+C (Windows) and go to http://jsfiddle.net/ in the new tab.


