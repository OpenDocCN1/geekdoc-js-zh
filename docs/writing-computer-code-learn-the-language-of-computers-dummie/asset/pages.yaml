- img_proc: true
  md: "```\nline-height: 2em;\ntext-transform: uppercase;\nmargin-top: 8px;\n}\n```\n\
    \nHere's what each of the properties in these rules does\nto the list:\n\n+  \
    \ - The list-style-type property removes the dot\n(bullet) from the left of each\
    \ item in the list.\n\n+   - Setting the padding and margin to 0px makes the list\n\
    left aligned with the other text on the page.\n\n+   - Setting the line-height\
    \ of the <li> creates more\nspace between list items. Without this property, the\n\
    elements would be uncomfortably close to each other.\n\nThe text-transform property\
    \ of the <li> element causes all\nthe input field labels underneath the input\
    \ field to display as\nal capital letters.\n\nThe margin-top property creates\
    \ yet more space between\nlist items.\n\nWith these new CSS rules in place, click\
    \ Run to see the\nlated version of the game.\n\nThe next few styles apply some\
