  md: '# PROJECT 1 BECOMING A PROGRAMMER


    ![](img/1e031b40c08e37dffac2e4567cc3504c_11_0.png)


    The computers of today are much more powerful than ever before. It used to take
    a whole room of computers to do what we can now do with even the smallest computer.
    One thing all computers have in common, no matter how powerful, is that they need
    computer programs to do anything and they need computer programmers to write these
    programs.


    Computer programs help people to do many things, including the following:


    +   - Playing music and videos

    - Performing scientific experiments

    - Designing cars

    - Inventing machines

    - Playing games

    - Controlling robots'
