  md: 'There are some really good books on HTML, such as Beginning HTML5 & CSS3 For
    Dummies, by Ed Tittel and Chris Minnick (Wiley). You can also find a complete
    list of every HTML element online. Our favorite online resource is at https://developer.mozilla.org/en-US/docs/Web/HTML/Element.


    Table 3-1 lists the most commonly used HTML elements, along with descriptions
    of what they are used for.


    # TABLE 3-1 THE MOST COMMON HTML ELEMENTS


    | Element | Name | Description |

    |---|---|--|

    | <h1> through <h6> | Heading levels 1 through 6 | The heading for a section |

    | <p> | Paragraph | A paragraph |

    | <em> | Emphasis | Adds emphasis to word(s), often displayed as *italics* |

    | <strong> | Strong | Adds strong importance, usually displayed as **bold** |

    | <a> | Anchor | A link |

    | <ul> | Unordered list | A bulleted list |

    | <ol> | Ordered list | A numbered list |

    | <li> | List item | An item in an unordered or ordered list |

    | <img> | Image | An image |

    | <hr> | Horizontal rule | A horizontal line on a page |

    | <div> | Division | A way to separate a document into different parts |'
