    # GATHERING YOUR TOOLS


    Every task you complete requires a set of tools, and writing computer code requires
    some special tools as well. Instead of things like hammers and pencils, JavaScript
    programmers use tools that are found on the Internet. You''ll only need a web
    browser and an Internet connection to complete all the projects in this book.


    Let''s move on and get your toolbox organized.


    # GETTING YOUR BROWSER READY


    The one essential tool that you need for working with JavaScript is a web browser.
    You have many different web browsers to choose from, and nearly all of them will
    do a great job running JavaScript. You probably already have a web browser on
    your computer.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The most widely used web browsers today are Mozilla Firefox, Apple Safari,
    Google Chrome, and Microsoft Internet Explorer. For this book, we''ll be using
    Chrome, which is currently the most popular web browser and has a number of great
    tools for working with JavaScript.


    If you don''t already have Chrome installed, you''ll need to download and install
    it. You can install Chrome by opening any other web browser and going to www.google.com/chrome/desktop.
    Follow the instructions found on that page (shown in Figure 1-8) to install Chrome
    on your computer. When you have Chrome installed, start it up.


