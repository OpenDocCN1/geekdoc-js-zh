  md: '# INTRODUCTION


    Here’s what you need to do the projects in this book:


    +   - A computer running the Windows, Mac OS X, or Linux operating system


    +   - A web browser, like Chrome, Firefox, or Safari


    +   - An Internet connection


    As you work through each project, keep in mind the following:


    +   - Code and web addresses are in monofont. If you’re reading this as an ebook,
    you can click web addresses, like www.dummies.com, to visit that website.


    +   - When you’re getting started, the best way to learn is to see how other people
    do it. For this reason, we’ve included pictures for every important step in the
    book, and all our examples are online at http://jsfiddle.net/user/watzthisthis/fiddles.
    If you want to check your work, or just copy ours, be sure to look at both of
    these.


    +   - Every project wraps up with a last look at the project’s big ideas in coding.
    The big ideas consist of codes and concepts you’ll find useful for future projects.


    +   - Coding isn’t that hard, but it does come with a lot of technical details.
    If you don’t feel like reading all the explanations, just skip ahead to the next
    code example and try it out.


    # ABOUT YOU


    We already know that you’re ready and willing to code. Because you’re reading
    this, we know you’re fully qualified and able to get started right away. We don’t
    make many assumptions, but here are the things we wanted to mention upfront:


    +   - You should be comfortable with using a web browser to visit websites, and
    with typing on a keyboard. The'
