- img_proc: true
  md: '# PROJECT 1 BECOMING A PROGRAMMER


    JSFiddle lets you write and experiment with code from within your web browser.
    You can use it to try out code, get feedback on your code, share your code, and
    even work on programs with your friends!


    JSFiddle is what we''ll be using throughout this book to experiment with HTML,
    CSS, and JavaScript. It''s called JSFiddle because you can use it to “fiddle”
    with code. So, let the fiddling begin!


    To get started with JSFiddle, open your Chrome web browser and type http://jsfiddle.net
    into the address bar. You''ll see a screen that looks like Figure 1-9.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_25_0.png)


    Figure 1-9: The JSFiddle home page, your new playground.


    JSFiddle is made up of three panes where you can enter each of the three types
    of web code: HTML, CSS, and JavaScript. The fourth pane is the Result pane, where
    you can see the results of what you type inside the other boxes. The toolbar on
    the left lets you add a title and description to your project and has some other
    advanced features we won''t worry about for this book. The top toolbar has buttons
    for running, saving, and cleaning up your code.'
  merge: -1
