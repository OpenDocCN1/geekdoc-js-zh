  md: '# PROJECT 1 BECOMING A PROGRAMMER


    Here are some helpful questions to think about before you begin coding:


    +   - What will my program do?

    - Who will use my program?

    - Why will they use my program?

    - Where will they use my program?

    - How will they use my program?


    # HOW CAN YOU TALK TO COMPUTERS?


    Every computer program is written using a computer programming language. Programming
    languages allow you to write instructions that can be translated (or compiled)
    into machine language. These programming languages are eventually turned into
    binary codes, which use zeros and ones to form letters, numbers, and symbols that
    can be put together to perform tasks.


    At the heart of every computer is a central processing unit (CPU), shown in Figure
    1-2.


    The CPU is made up of millions of tiny, very fast switches (transistors) that
    can be on or off. The position of these switches determines what the computer
    will do. Software, written by programmers, tells these switches when to turn on
    or off by using binary codes.


    Every single thing that a computer does is the result of a different combination
    of many zeros and ones. For example, to represent a lowercase letter a, computers
    use the following binary code:


    ```

    0110 0001

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/1e031b40c08e37dffac2e4567cc3504c_16_0.png)


    **Figure 1-2**: At the heart of every computer is a CPU.


    Each zero or one in a binary number is called a *bit*, and a combination of eight
    bits is called a *byte*. When you hear the words *kilobyte, megabyte, and gigabyte*
    used to tell how big a file is, what that means is the number of bytes it takes
    to store the file.


    Table 1-1 lists the most common storage sizes.


    # TABLE 1-1 HOW MANY BYTES IS THAT?


    | Name | Number of Bytes | What It Can Store |

    | --- | --- | --- |

    | Kilobyte (KB) | 1,024 | Two to three paragraphs of text |

    | Megabyte (MB) | 1,048,576 | 800 pages of a book |

    | Gigabyte | 1,079,741,824 | 1,000 books |

    | Terabyte | 1,099,511,627,776 | 1 million books |

    | Petabyte (PB) | 1,125,899,906,842,624 | Several copies of every book ever written!
    |'
  merge: -1
