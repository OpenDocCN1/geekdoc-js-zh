    for your new program.


    +   Click Save in the top menu.


    Now you''re ready to get started with the HTML for the program!


    # WRITING THE HTML


    Our word replacement game has three main areas, or sections:


    > The question area: This is the input area where you enter words.


    > The button area: This is the area at the bottom of the questions that contains
    the Replace It button that will add your words into the story.


    > The story area: This is the area where the user input and the story appear together
    after the Replace It button is clicked.


    The first thing we''ll do is to create these three areas. We''ll create each section
    using a <div> element.


    +   Enter two <div> elements into the HTML pane.


    Each <div> will have a unique ID attribute that names its purpose. Our first <div>
    will have an ID of inputWords.'
