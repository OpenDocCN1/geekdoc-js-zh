  md: "Follow these steps to apply CSS styles to the word game:\n\n+   To change the\
    \ typeface of all the text in the document, apply a font-family style to the body\
    \ element.\n\nWe're going to use the super-fun Comic Sans typeface:\n\n```\nbody\
    \ {\n  font-family: \"Comic Sans MS\";\n}\n```\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_117_0.png)\n\
    \nFor a list of other common font families, visit www.w3schools.com/cssref/css_websafe_fonts.asp.\n\
    \n+   Style the section containing the input fields with the following rule:\n\
    \n```\n#inputWords {\n  float: left;\n  width: 45%;\n}\n```\n\nThe float:left\
    \ property in this rule causes the <div> to be placed along the left edge of its\
    \ container (which is the document’s body element in this case). Other elements\
    \ will flow around it.\n\nIn practice, what float:left will do is to cause the\
    \ <div> containing the input questions to be placed to the side of the <div> that\
    \ will contain the finished story, rather than above it.\n\n+   Style the list\
    \ using the following two rules:\n\n```\nul {\n  list-style-type: none;\n  padding:\
    \ 0px;\n  margin: 0px;\n}\n {\n```"
  merge: -1
