  md: '# PROJECT 4 GIVING YOUR ROBOT STYLE


    Every ID attribute must be unique within your HTML page.


    Table 4-1 is a handy guide to everything you need to know about CSS selectors
    and how to use them.


    # TABLE 4-1 THE BASICS OF CSS SELECTORS


    | Selector Name | Selector Symbol | Example |

    | --- | --- | --- |

    | element | (none) | p {} selects <p></p> |

    | class | . (period) | .red{} selects <p class="red"></p> |

    | id | # | #best{} selects <p id="best"></p> |


    Now that you know how to select what element or elements you want to style, let''s
    talk about how to go about styling them and all the great things you can do with
    CSS declarations.


    # CSS DECLARATIONS


    CSS declarations go inside the curly braces following CSS selectors. Each declaration
    must end with a semicolon (;). You can have as many declarations between the curly
    braces as you need to get the job done.


    Declarations are made up of two parts:


    +   * Property: The property part of a declaration should be modified. For example,
    you can change the color, width, or location of an element.


    CSS contains many different properties, and we''ll show you how to use some of
    them shortly!


    The property must be followed by a colon (:).'
  merge: -1
  pgno: 79
