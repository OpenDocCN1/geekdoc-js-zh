  md: '# WHAT LANGUAGES WILL YOU LEARN?


    People have created hundreds of different computer languages. In this book, we
    focus on the three languages that make the World Wide Web work: HTML, CSS, and
    JavaScript. Together, these three languages can be used for so many different
    things, including building apps for an iPhone; making super cool, interactive
    websites; and even designing videogames that you can play on your computer!


    In the early days of the Internet, web pages only included plain text. Some of
    the text varied in size, and sometimes there were links between different web
    pages. This was made possible by a computer language called HTML.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_19_0.png)


    > HTML stands for Hypertext Markup Language, which is a fancy way of saying that
    HTML can be used to turn text into links, but it can also do much more, as you''ll
    soon see.


    In those early days, there weren''t different fonts or pretty layouts. We barely
    had any pictures, and there certainly wasn''t any animation! Figure 1-3 is an
    example of one of the first web pages.


    We aren''t complaining, though. When the web was new, it was really exciting to
    click from one page to another and discover new things. Even more was exciting
    how easy it was for anyone to publish things and have anyone else on the Internet
    be able to read it!


    Pictures, colors, forms, and many other features were introduced very quickly
    after this. CSS was invented to make web pages look prettier (see Figure 1-4)!


    ![](img/1e031b40c08e37dffac2e4567cc3504c_19_1.png)


