  md: "```\nfunction frame() {\n  robotPart.style.top = top + '%';\n  top++;\n  if\
    \ (top == 20) {\n    clearInterval(id);\n  }\n}\n```\n\nWe'll tell you how this\
    \ function works in a minute, but first let's talk about how animation works.\n\
    \n# CREATING ANIMATIONS WITH JAVASCRIPT\n\nComputer animation, like film and video\
    \ animation, is a trick. The trick is to show a series of pictures very quickly\
    \ so that the images appear to move.\n\nSome of the very first uses of animation\
    \ were called flipbooks or kinesographs (see Figure 5-7), and they first became\
    \ popular in 1886. Flipbooks are made by drawing a slightly different picture\
    \ near the edge of each page of a notebook or a stack of springy pieces of paper.\
    \ You can then flip through the book to see a cartoon.\n\nIf you have a stack\
    \ of index cards or a notebook, you can make your own flipbook. Figure 5-8 shows\
    \ a picture of a flipbook animation that we made of Douglas the Robot dancing.\n\
    \nToday's animation works the same way as flipbooks, but we use computers and\
    \ programming to create each picture instead of stacks of paper.\n\nEach single\
    \ picture in an animation is called a frame. The way Douglas's eye-bounce animation\
    \ works is by showing his eye in a slightly different place, every 10 milliseconds\
    \ (one-tenth of a second). When you click your eye, it jumps to the top of his\
    \ head and floats back down to its starting point."
