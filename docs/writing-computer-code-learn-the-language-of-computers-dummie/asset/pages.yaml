  md: '+   * Guiding satellites and spaceships


    # THE WOMEN WHO INVENTED PROGRAMMING


    Electronic computers were first invented in the 1930s. But it was in the middle
    of the 1800s when the first computer program — a set of instructions designed
    to be carried out by a machine was written.


    The author of the first computer program — and the world''s first computer programmer
    — was a woman Ada Lovelace. She was a mathematician who lived in England Ada imagined
    that computers would be able to do all the things we use computers for today,
    including working with words, displaying pictures, and playing music. Her unique
    understanding earned her the nickname The Enchantress of Numbers We''re guessing
    your nickname isn''t as rad as that.


    The computer that Ada Lovelace wrote programs for didn not look anything like
    the computers of today. Instead of a plug or battery, it had a crank! Check out
    this photograph of Charles Babbage''s Difference Engine, one of the very first
    computers.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_12_0.png)


    (continued)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# PROJECT 1 BECOMING A PROGRAMMER


    (continued)


    ![](img/1e031b40c08e37dffac2e4567cc3504c_13_0.png)


    In order for computer programs to be converted into machine language, we need
    to use compilers. Compilers are programs used to convert programming languages
    into machine language. The very first compiler was created by Grace Murray Hopper
    in 1944. Her invention led to computer programs being able to run on different
    types of computers, and eventually gave birth to JavaScript. Grace Hopper is also
    the inventor of the term debugging, for fixing problems in computer programs.
    This term was inspired by the removal of an actual moth from an early computer.
    Grace Hopper became known as ''The Queen of Software'' or ''Amazing Grace'' for
    her contributions to modern computing. (What can we say? Nicknames were just cooler
    back then.)'
  merge: -1
  pgno: 13
