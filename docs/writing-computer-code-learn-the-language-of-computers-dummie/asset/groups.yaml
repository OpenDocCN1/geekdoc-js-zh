    +   » Your pet’s name

    » Your favorite school subject

    » The name of your best friend

    » Your street address


    Here’s what we might call these variables:


    +   » myPetName

    » myFavoriteSchoolSubject

    » bestFriendName

    » myStreetAddress


    In addition to the rule that variable names must not contain spaces, there are
    several other rules that you must follow:


    +   » Variable names must begin with a letter, an underscore (_), or a dollar
    sign ($).


    +   » Variable names can contain only letters, underscores, or dollar signs.


    +   » Variable names are case sensitive (capitalization matters!).


    +   » Certain words may not be used as variable names, because they have other
    meanings within JavaScript. These so-called reserved words are as follows:


    ```

    break    class   catch

    const   continue debugger default

    delete   do       else     export

    extends finally for      function

    if       import  instanceof

    let      new      return super

    switch   this    throw    try

    typeof   var      void     while

    with     yield

    ```'
