    ## PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    ## GIVING AND RECEIVING DATA


    Programs come in many different sizes and have many different purposes. Here are
    three things all computer programs have in common:


    - All computer programs have a way to receive information from a user.

    - All computer programs have a way to give information back to a user.

    - All computer programs have a way to store and work with the information.


    Information, or data, that a program receives from a user is called input. What
    the program gives back to a user is called output (see Figure 2-3).


    What is your name?


    ![](img/1e031b40c08e37dffac2e4567cc3504c_39_0.png)


    Figure 2-3: Computers use input to create output.


    In the real world, when you want to store something, give something away (as a
    gift, for example), move something, or organize something, you often put it in
    a box.


    Computers don''t care about heart-shaped boxes of chocolates or shoeboxes with
    the latest sneakers inside them. What computers love is data. And to store and
    move around data, computers use a special kind of box called variable. A variable
    is a box you can assign a name to. This name will represent all the information
    contained in that box, or variable.


    Variables make it possible for one program to work with a variety of different
    input and produce different output.


    Follow these steps to create and use variables:


    - 1 Click the JSFiddle icon in the upper-left corner of JSFiddle to open a new
    fiddle.

    - 2 Click the following into the JavaScript pane to create a variable called myBook.


    ```

    var myBook = "Writing Computer Code";

    ```


    - 3 Click Run.


    If you did everything correctly, nothing will seem to have happened.


    - 4 Type the following on the next line in the JavaScript pane:


    ```

    alert(myBook);

    ```


    - 5 Click Run.


    A popup window will appear containing the words Writing Computer Code (see Figure
    2-4).


    As you can see, creating a variable in JavaScript is pretty simple! To create
    a variable, you use the var keyword, followed by the name of the variable, like
    this:


    ```

    var myBook

    ```


    ## PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    ![](img/1e031b40c08e37dffac2e4567cc3504c_41_0.png)


    Figure 2-4: Creating a variable and an alert.


    Notice how we separate words in variable names by using capital letters for every
    word after the first one. Variable names can''t contain spaces, so programmers
    have created several other ways to separate words. This particular style is called
    camelCase. Can you guess why it has that name?


    ![](img/1e031b40c08e37dffac2e4567cc3504c_41_1.png)


    As a programmer, you have a lot of freedom in naming your variables. You can get
    very creative when you name your variables, but you don''t want to get too crazy.
    Most important, your variable names should describe what you store inside of them.


    The following variables have good and descriptive names:


    ```

    var firstName

    var favoriteFood

    var birthday

    var timeOfDay

    ```


    Just by looking at these variable names, you can probably guess what kind of information
    is stored inside them.


    After looking at these examples, what would you name variables for storing the
    following information?


    - Your pet’s name

    - Your favorite school subject

    - The name of your best friend

    - Your street address


    Here’s what we might call these variables:


    - myPetName

    - myFavoriteSchoolSubject

    - bestFriendName

    - myStreetAddress


    In addition to the rule that variable names must not contain spaces, there are
    several other rules that you must follow:


    - Variable names must begin with a letter, an underscore (_), or a dollar sign
    ($).

    - Variable names can contain only letters, underscores, or dollar signs.

    - Variable names are case sensitive (capitalization matters!).

    - Certain words may not be used as variable names, because they have other meanings
    within JavaScript. These so-called reserved words are as follows:


    ```

    break class catch

    const continue debugger

    delete do else

    extends finally for function

    if import instanceof

    let new return

    switch this throw

    typeof var void

    with yield

    ```


    ## PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    When creating your variables, you only need to type var when you create and name
    them. When you want to use or change what''s inside your variable, you only need
    to use that variable''s name.


    When you have stored data in a variable, you can recall it at any time during
    your program by typing the variable name. So, when you use the variable name myFavoriteFood,
    it''s exactly the same as saying "tacos".


    Let''s try it out!


    - After the last statement you typed, type the following:

    `myBook = "JavaScript Kids";`

    - On the next line, type this:

    `alert(myBook);`

    - Click Run.

    The first popup will appear, just as before with the title Writing Code.

    - Close the first popup by clicking OK.

    A second popup will appear, containing the title JavaScript Kids (see Figure 2-5).


    Notice that the same alert statement was used to pop up two different titles.
    This is just one of the many things that possible using variables.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_43_0.png)


    The data inside a variable can also be called the value of variable.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_44.png)


    ## KNOWING OPERANDS AND OPERATORS


    In JavaScript, when a piece of code causes something to happen, such as adding
    two numbers together to get another number, we call this piece of code an expression.
    For example:


    1 + 1 = 2


    Expressions are made up of operands (like the number 1) and operators (such as
    = or +).


    Operands can be words or numbers or even variables.


    When a variable contains a value, it can be used anywhere you would normally use
    that value.


    An operator is a symbol that performs a task (or an operation) using the operands.


    Figure 2-6 shows the different parts of a JavaScript statement.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_45_0.png)


    JavaScript has many different operators that handle many different needs. Instead
    of showing you a list of all the operators, we wrote a program that lets you choose
    operators and operands and then see the results!


    Meet the Super-Calculator! It can work with words and letters, as well as numbers.


    ## INTRODUCING THE SUPER-CALCUL


    You''ve never seen a calculator like this before. This calculator can do addition,
    subtraction, multiplication, and even division!


    That''s not all! This Super-Calculator can take words and stick them together!
    Let''s say you have the word Java and you have the word Script and you want to
    somehow glue them together. Impossible, you say? Not with the Super-Calculator!


    How does this amazing Super-Calculator work? How can you get one? We''re about
    to tell you, and your world will never be the same again!


    ## FORKING THE SUPER-CALCUL


    We''ve created this lovely calculator in JSFiddle. Simply follow these steps to
    open and create your own version of it:


    - Open your web browser and log in at http://jsfiddle.net.

    - Go to our public dashboard at http://jsfiddle.net/user/wimnis/fiddles and locate
    the program called Chapter 2 - Super-Calculator.


    The Super-Calculator fiddle opens (see Figure 2-7).


    ![](img/1e031b40c08e37dffac2e4567cc3504c_46_0.png)


    Figure 2-7: The JS Super-Calculator.


    - Click the Fork button in the top menu to make a copy of the Super-Calculator
    in your own JSFiddle account.

    - Use the Fiddle Options in the left menu to change the name of your Super-Calculator
    to Your Name''s Super-Calculator.

    - Click Update in the top menu, and then click Set as Base.


    ## PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT


    Now you have your own version of the Super-Calculator! You''re ready to start
    learning how it works and using it to learn about operands and operators.


    ## USING THE SUPER-CALCUL


    The Super-Calculator allows you to see the result of using different operators.
    It features two places where you can put in operands, each with a drop-down menu
    where you can select the type of data you entered (number or text), and radio
    buttons for selecting an operator to use.


    > Radio button is the name that HTML uses to refer to the circular buttons that
    can be grouped together. They''re different from check boxes because you can only
    select one button in a group of radio buttons, but you can select multiple boxes
    in a group of check boxes. We think they''re called radio buttons because they
    work in the same way as car radio station selection buttons. Pressing one button
    sets the station to that choice and deselects the others.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_47_0.png)


    To get started with the Super-Calculator, take a look at the settings that are
    in the Result window when you first open it.


    > You may want to resize the windows in JSFiddle to make your Result Pane as large
    as possible.


    The input area at the top, shown in Figure 2-8, contains a single value, the number
    1. The input type drop-down menu is set to Number.


    Under the input area for the first operand is where you select an operator. The
    operators are divided into two groups: arithmetic operators and text operators.
    Notice that the first operator in the group of arithmetic operators, +, is selected,
    as shown in Figure 2-9. This is the addition operator.

