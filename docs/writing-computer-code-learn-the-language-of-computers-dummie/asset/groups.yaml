    # PROJECT 4 GIVING YOUR ROBOT STYLE


    **Declaration block:** The declaration block contains one or more CSS declarations,
    which indicate how to style the selected element(s). In this example, we have
    just one declaration: `font-family: Arial;`. This declaration will change the
    look, or font, of all the text that appears in the Result pane.


    The HTML body element is where everything that will display in your document goes.
    Even though you don''t need to type it into JSFiddle, it''s still there, because
    JSFiddle puts it into the Result pane for you.


    # CSS SELECTORS


    The selector is the part of the CSS rule that comes before the { . CSS selectors
    tell the web browser which HTML elements a style should apply to.


    The official name for the { and } characters are curly braces or curly brackets.
    You can also call them mustaches, though, because they look like fancy mustaches
    turned on their sides. Figure 4-2 shows Douglas sporting a curly brace mustache.


