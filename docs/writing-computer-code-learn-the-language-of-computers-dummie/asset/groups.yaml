    \ 动画。\n\n# 使用第二个动画\n\n除了眼睛跳动，Douglas 至少还有一种舞蹈。他称之为“手臂扫描”（arm sweep）。这涉及到左臂横跨身体向左的平滑移动。在创建手臂扫描之前，我们将进行一些\
    \ CSS 修改，让 Douglas 的左臂伸出而不是仅仅挂在侧边。\n\n- 1 在 CSS 块中找到左臂的样式块。它看起来是：\n\n```css\n\
