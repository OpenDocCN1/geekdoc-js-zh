    \ 2 收集构建机器人的零件\n\n## 数据的发送与接收\n\n程序有许多不同的尺寸，许多许多用途。以下是所有计算机程序的共同点：\n\n- 所有的计算机程序都有一种从用户那里接收信息的方法。\n\
    - 所有的计算机程序都有一种向用户返回信息的方法。\n- 所有的计算机程序都有一种存储和处理信息的方法。\n\n程序从用户那里接收的信息或数据被称为**输入**。程序返回给用户的信息被称为**输出**（见图\
    \ 2-3）。\n\n你叫什么名字？\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_39_0.png)\n\n图\
    \ 2-3：计算机使用输入创建输出。\n\n在现实世界中，当你想要存储某东西、送出某东西（例如礼物）、移动某东西或整理某东西时，你通常会把它放在盒子里。\n\
    \n计算机并不在乎心形的巧克力盒，也不在乎装有最新运动鞋的鞋盒。计算机喜爱的是数据。为了存储和移动数据，计算机使用一种特殊的盒子，称为**变量**。变量是一个你可以为其命名的盒子。这个名字将代表该盒子（或变量）中包含的所有信息。\n\
    \n变量使得一个程序能够处理各种不同的输入并产生不同的输出。\n\n按照以下步骤创建和使用变量：\n\n- 1 点击 JSFiddle 左上角的 JSFiddle\
    \ 图标打开一个新 fiddle。\n- 2 将以下内容点击到 JavaScript 板格中，创建一个名为 `myBook` 的变量。\n\n```\nvar\
    \ myBook = \"Writing Computer Code\";\n```\n\n- 3 点击 Run（运行）。\n\n如果你操作得完全正确，似乎什么都没有发生。\n\
    \n- 4 在 JavaScript 板格的下一行输入以下内容：\n\n```\nalert(myBook);\n```\n\n- 5 点击 Run（运行）。\n\
    \n将出现一个弹窗窗口，其中包含“Writing Computer Code”的字样（见图 2-4）。\n\n如你所见，在 JavaScript 中创建一个变量非常简单！要创建一个变量，你使用\
    \ `var` 关键字，后面跟着变量名，如下所示：\n\n```\nvar myBook\n```\n\n## 项目 2 收集构建机器人的零件\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_41_0.png)\n\
    \n图 2-4：创建一个变量和一个警报。\n\n注意我们如何通过对第一个单词后的每个单词使用大字母来分离变量名中的单词。变量名不能包含空格，因此程序员创建了其他方法来分离单词。这种风格被称为**驼峰命名法**（camelCase）。你能猜出它为什么叫这个名字吗？\n\
    \n![](img/1e031b40c08e37dffac2e4567cc3504c_41_1.png)\n\n作为一个程序员，你在命名变量时有很大的自由度。在命名变量时可以充分发挥创意，但你不希望搞得太疯狂。最重要的是，你的变量名应该描述你存储在它们内部的内容。\n\
    \n以下变量具有良好且具描述性的名称：\n\n```\nvar firstName\nvar favoriteFood\nvar birthday\nvar\
    \ timeOfDay\n```\n\n仅仅通过这些变量名，你可能就能猜出里面存储了什么类型的信息。\n\n在看了这些示例之后，你会为存储以下信息命名变量呢？\n\
    \n- 你的宠物名字\n- 你最喜欢的学校科目\n- 你最好的朋友的名字\n- 你的街道地址\n\n以下我们可能这样命名这些变量：\n\n- myPetName\n\
    - myFavoriteSchoolSubject\n- bestFriendName\n- myStreetAddress\n\n除了变量名不能包含空格的规则外，还有其他你必须遵循的规则：\n\
    \n- 变量名必须以字母、下划线（_）或美元符号（$）开头。\n- 变量名只能包含字母、下划线或美元符号。\n- 变量名区分大小写（大小写很重要！）。\n\
    - 某些单词不能作为变量名，因为它们在 JavaScript 中有其他含义。这些所谓的**保留字**如下：\n\n```\nbreak class catch\n\
    const continue debugger\ndelete do else\nextends finally for function\nif import\
    \ instanceof\nlet new return\nswitch this throw\ntypeof var void\nwith yield\n\
    ```\n\n## 项目 2 收集构建机器人的零件\n\n在创建变量时，你只需要在创建和命名它们时输入 `var`。当你想要使用或更改变量内部的内容时，你只需要使用该变量名。\n\
    \n当你将数据存储在变量中时，可以在程序的任何时候通过输入变量名来召回它。所以，当你使用变量名 `myFavoriteFood` 时，它和说“tacos”完全一样。\n\
    \n让我们试一下！\n\n- 在你输入的最后语句之后，输入以下内容：\n`myBook = \"JavaScript Kids\";`\n- 在下一行，输入此：\n\
    `alert(myBook);`\n- 点击 Run。\n第一个弹窗将会出现，就像之前一样，标题为“Writing Code”。\n- 点击 OK 关闭第一个弹窗。\n\
    第二个弹窗将会出现，标题为“JavaScript Kids”（见图 2-5）。\n\n注意，使用了同一个 `alert` 语句弹出了两个不同的标题。这只是使用变量可以实现的许多功能之一。\n\
