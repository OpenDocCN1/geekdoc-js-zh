    \ 1-12: Highlighting the full-screen URL.\n\n# 3 Open a new browser window tab\
    \ (by pressing Command+T [Mac] or Ctrl+T [Windows]) and paste the full-screen\
    \ address into the address bar.\n\nThe bubbles display onscreen without the code\
    \ panes.\n\n> If the Bubbles demo doesn't work for you in full-screen mode, try\
    \ changing the https in the browser address bar to http and press Return or Enter.\n\
    \n![](img/1e031b40c08e37dffac2e4567cc3504c_33_0.png)\n\nIf you want to return\
    \ to the original Bubbles program, you can do so by going back to our public dashboard\
    \ at https://jsfiddle.net/user/forks/fiddles.\n\n# SUMMARY\n\nIn this chapter,\
    \ you learned what computer programmers do and experimented with writing some\
    \ code in JSFiddle. In the next chapter, we explore the language of JavaScript\
    \ and show you the special rules of writing in JavaScript.\n\n# PROJECT 2 GATHERING\
    \ THE PARTS TO BUILD YOUR ROBOT\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_34_0.png)\n\
    \n# JUST AS SPOKEN LANGUAGES HAVE RULES (CALLED GRAMMAR), PROGRAMMING LANGUAGES\
    \ HAVE RULES (CALLED SYNTAX).\n\nWhen you understand the basic rules of speaking\
    \ JavaScript it actually looks similar to English. If you think that your teacher\
    \ correcting you when you say \"ain't\" is strict, wait until you see how strict\
    \ JavaScript is! It won't even listen to a thing you say if you make certain kinds\
    \ of syntax errors. When you write in human language, your sentences are made\
    \ up of different parts, such as nouns and verbs (see Figure 2-1). In JavaScript,\
    \ sentences are called statements. Statements are made up of different parts,\
    \ such as operands (which are like nouns) and operators (which are like verbs).\n\
    \n# PROJECT 2 GATHERING THE PARTS TO BUILD YOUR ROBOT\n\nThe dog jumped over the\
    \ fence Figure 2-1: Sentences are made up of different parts.\n\nIn this chapter,\
    \ you learn the basics of JavaScript syntax, and discover how operands and operators\
    \ work.\n\n# SAYING WHAT YOU MEAN\n\nAs a programmer, your job is to think about\
    \ what you want your program to do, and then break it down into small steps the\
    \ computer can do without making mistakes. If you wanted to ask a robot to go\
    \ downstairs and make a sandwich, you might start your instructions like:\n\n\
    1. Rotate head toward stairs.\n2. Use visual sensors to look for obstacles.\n\
    3. If an obstacle is found, figure out what it is.\n4. If the obstacle is a cat,\
    \ try to lure the cat away from the top of the stairs by\n   - Throwing a toy\
    \ down the hall\n   - Speaking the cat's name\n   - Gently nudging the cat with\
    \ your hand until it walks\n5. If there is no obstacle, rotate left foot in the\
    \ direction of the stairs.\n6. Place left foot in front of right foot.\n7. Look\
    \ for an obstacle.\n8. Determine whether you're at the top of the stairs.\n9.\
    \ If you're not at the top of the stairs, rotate right foot in the direction of\
    \ the stairs.\n10. Place right foot in front of left foot.\n11. Repeat steps 1\
    \ through 10 until you're at the top of the stairs.\n\nYou've already written\
    \ 11 instructions and the robot hasn't even begun to walk down the stairs! A real\
    \ computer program to tell a robot to go downstairs and make a sandwich would\
    \ need much more instructions than the ones shown. At each step along the way,\
    \ each motor would need to be told exactly how to turn, each possible obstacle\
    \ would need to be described in detail. All these instructions need to be written\
    \ as individual commands, or statements.\n\n# MAKING A STATEMENT\n\nIn English,\
    \ we talk in sentences. In computer code, a single instruction to the computer\
    \ is called a statement. Like a sentence, statements are made up of different\
    \ parts and have rules that they must follow in order to be understood. A computer\
    \ program can be made up of many statements, or even of just one statement. The\
    \ following statement causes a web browser to open up a popup with the sentence\
    \ \"Coding is Fun!\"\n\n```\nalert(\"Coding is Fun!\")\n```\n\nIf you type this\
    \ statement into the JavaScript pane in JSFiddle and press Run, you'll see something\
    \ like Figure 2-2.\n\n# Create a new fiddle\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_37_0.png)\n\
    \nFigure 2-2: The result of a JavaScript alert statement.\n\nNotice that the statement\
    \ contains a keyword (alert), some symbols (parentheses and quotes), and some\
    \ text (Coding is Fun!), and ends with a semicolon (;).\n\nJust as an infinite\
    \ number of sentences can be written using English, an infinite number of statements\
    \ can be written with JavaScript. The word alert is an example of a JavaScript\
    \ keyword. Many JavaScript statements begin with keywords, but not all of them\
    \ do.\n\n> The semicolon is what separates one statement from another, just as\
    \ a period separates one sentence from another. Every statement should end with\
    \ a semicolon.\n\n# FOLLOWING THE RULES\n\nJavaScript has several rules that must\
    \ be obeyed if you want your computer to understand you. Here are the most important\
    \ rules:\n\n- Spelling counts.\n- Capitalization counts.\n- Spacing doesn't count.\n\
    \nCoding languages are very picky about spelling. They're picky, in fact, they\
    \ don't even like it when you capitalize something wrong, for example, by typing\
    \ Alert instead of alert.\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_38_0.png)\n\
    \nWhen a programming language cares about capitalization, we call it case sensitivity.\
    \ This name comes from the fact that it's so sensitive about whether you use uppercase\
    \ or lowercase letters.\n\nThe only time when this strictness doesn't apply is\
    \ when text is surrounded by double quotes (\"\") or single quotes (''). When\
    \ that happens, spelling errors won't cause problems. You can type whatever you\
    \ want!\n\nIn our \"Coding is Fun!\" example, you can replace the words inside\
    \ the double quotes with anything you want! For example, you can add your name\
    \ like this: \"My name is Eva, and I think coding is fun!\"\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_38_1.png)\n\
    \nIf you type anything outside the quotes, you have to follow the rules; otherwise,\
    \ your program may not run at all.\n"
