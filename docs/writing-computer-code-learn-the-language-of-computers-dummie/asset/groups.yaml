    \n# 使用 JAVASCRIPT 创建动画\n\n计算机动画就像电影和视频动画一样，是一种技巧。这种技巧的在于非常快速地显示一系列图片，使得这些图像看起来像是在移动。\n\
    \n动画最早的用途之一被称为翻页书（flipbooks）或活动记录机（kinesographs）（见图 5-7），它们在 1886 年首次流行起来。翻页书的制作方法是在笔记本的每一页边缘，或者在一叠有弹性的纸张的每一页边缘，画出一幅略有不同的图片。然后你可以翻动书籍来看到一个动画片。\n\
    \n如果你有一叠索引卡或一个笔记本，就可以制作自己的翻页书。图 5-8 展示了我们制作的机器人 Douglas 跳舞的翻页书动画。\n\n今天的动画工作原理与翻页书相同，但我们使用计算机和编程来创建每幅图片，而不是纸张。\n\
    \n动画中的每一幅单独图片被称为“帧”（frame）。Douglas 眼睛跳动动画的工作原理是每隔 10 毫秒（十分分之一秒）显示他的眼睛处于略微不同的位置。当你点击他的眼睛时，它会跳到他的头顶，然后浮回起始点。\n\
    \n# 项目 5：让你的机器人动起来\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_103_0.png)\n\n\
    图 5-7：动画的早期形式。\n\n来源：https://\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_103_1.png)\n\
    \n图 5-8：我们制作的机器人 Douglas 跳舞的翻页书动画。\n\n图 5-9 显示了眼睛在动画过程中不同点的位置。\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_104_0.png)\n\
    \n图 5-9：Douglas 眼睛在动画中不同点的位置。\n\n现在让我们仔细观察 `moveUpDown` 函数的代码，看看它是如何创建的。第一行给该函数命名：\n\
    \n```javascript\nfunction moveUpDown(e) {\n```\n\n下一行创建了一个语句，用于找出点击了机器人（或元素）的哪个部分：\n\
    \n```javascript\nvar robotPart = e.target;\n```\n\n它将该元素的信息存储在一个名为 `robotPart`\
    \ 的新变量中。\n\n接下来的语句创建一个名为 `top` 的新变量并赋值赋值为 0：\n\n```javascript\nvar top = 0;\n\
    ```\n\n这个 `top` 变量就是我们用来改变动画每一帧中眼睛的位置。\n\n下一行使用名为 `setInterval` 的命令来让动画发生：\n\n\
    ```javascript\nvar id = setInterval(frame, 10);\n```\n\n`setInterval` 命令让 JavaScript\
    \ 重复执行某些操作。它执行重复动作的速度通过一个数字来设置——在这种情况下，数字是 10。\n\n这个数字是在再次执行该操作之前等待的毫秒数（秒的千分之一）。一千毫秒等于一秒。这个数字越大，动画看起来移动得越慢。\n\
    \n# 项目 5：让你的机器人动起来\n\n接下来，我们创建了一个属于 Douglas `moveUpDown` 函数的新函数。这个新函数的目的是创建动画的每一帧，因此我们将函数命名为\
    \ `frame`：\n\n```javascript\nfunction frame() {\n```\n\n如果你想深入了解 `frame` 函数，请访问\
    \ https://jsfiddle.net/warms66/fiddly 并阅读 JavaScript 面板的内容。\n\n# 让另一个元素动画\n\n\
    现在我们已经写了让一只眼睛动动的 `moveUpDown` 函数，让另一只眼睛只需添加另一个事件监听器。\n\n- 1 点击 Update 保存到为止的工作。\n\
