    # USING HTML: IT''S ALL ABOUT THE TAGS


    HTML is made up of tags. The tags on clothes give you information about what the
    clothes are made of and how to wash them. Similarly, tags in HTML give you information
    about the content inside of them.


    Tags are made up of keywords inside angle brackets (< and>) and they come in two
    basic types: a beginning tag and an ending tag. Here''s an example of a beginning
    tag:


    ```

    <p>

    ```


    The p tag is how you mark up text in a document as a paragraph.


    Most beginning tags also have matching ending tags. The only difference between
    a beginning tag and an ending tag is that an ending tag has a / before the name
    of the tag. For example, here''s the ending p tag:


    ```

    </p>

    ```


    To use tags, just put the thing that you want to mark up (such as text, images,
    or even other tags) between the beginning and ending tags. For example, here''s
    how you would mark up a paragraph of text in HTML:


    ```

    <p>This is a paragraph of text. A paragraph has a line break before and after
    it in order to separate it from the other paragraphs of text in a document.</p>

    ```


    HTML has a bunch of tags that you can use to label different parts of a document.
    Examples of tags include <p> for paragraph, <img> for image, <audio> for audio
    clips, <video> for video clips, <header> for the top of a web page, and <footer>
    for the bottom of a web page.


    When you have a beginning tag, an ending tag, and stuff in those tags, we call
    the whole thing an HTML element. Here are some more examples of HTML elements.
