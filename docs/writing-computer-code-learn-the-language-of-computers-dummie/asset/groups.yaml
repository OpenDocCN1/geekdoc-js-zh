    \nIf you look at the CSS color table in Figure 4-8, or if you examine parts of\
    \ Douglas's CSS, you'll also find another way to make colors in CSS. This method\
    \ uses letters and numbers that start with a hash symbol. This method is called\
    \ hexadecimal.\n\n## CHANGING COLORS\n\nNow let's use our new color knowledge\
    \ to make some changes to Douglas's parts. You already played around with changing\
    \ the color of Douglas's eyes. What about changing the color of his mouth? In\
    \ the CSS pane, find the ID selector and declaration for Douglas's mouth. It looks\
    \ like this:\n\n```css\n#mouth {\n  position: absolute;\n  width: 65%;\n  height:\
    \ 15%;\n  left: 20%;\n  top: 70%;\n  background-color: red;\n}\n```\n\nNow, you\
    \ have the color for Douglas's mouth set to red. To use one of the RGB colors\
    \ in Table 4-1, you first need to tell the program that you're using RGB color;\
    \ then add the RGB code of the color you want to use. If you wanted to change\
    \ the color of Douglas's mouth to teal, you would write it like this:\n\n```css\n\
    #mouth {\n  position: absolute;\n  width: 65%;\n  height: 15%;\n  left: 20%;\n\
    \  background-color: rgb(0,128,128);\n}\n```\n\nThe result is shown in Figure\
    \ 4-9. Try changing the color of Douglas's mouth in your own CSS. Directly above\
    \ the mouth declaration, there is the declaration for Douglas's nose. You can\
    \ change the color of Douglas's nose in the same way you changed his mouth:\n\n\
    ```css\n#nose {\n  position: absolute;\n  left: 45%;\n  top: 50%;\n  height: 10%;\n\
    \  background-color: rgb(255,0,0);\n}\n```\n\nThe result is shown in Figure 4-10.\
    \ Next let's change Douglas's shirt body. Find the declaration for his body, and\
