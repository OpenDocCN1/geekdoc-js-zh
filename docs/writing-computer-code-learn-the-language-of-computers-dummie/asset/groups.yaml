    \nFor example, the `<head>` element is inside of `<html>`. Therefore, the closing\
    \ `head` tag must come before the closing `html` tag:\n\n```\n<html>\n  <head>\n\
    \  </head>\n</html>\n```\n\nThe `<ol>` tag comes after the `<body>` tag, so `<ol>`\
    \ is inside of `<body>` and you have to put the `</ol>` tag before the `</body>`\
