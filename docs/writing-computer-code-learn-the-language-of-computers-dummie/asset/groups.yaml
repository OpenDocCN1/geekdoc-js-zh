    # # PROJECT 5 ANIMATING YOUR ROBOT


    ![](img/1e031b40c08e37dffac2e4567cc3504c_92_0.png)


    **IN CHAPTER 3, YOU LEARNED HOW YOU CAN USE JAVASCRIPT TO CHANGE HTML.** You can
    also use JavaScript to change CSS styles. And the process is very similar.


    In this chapter, we''ll use CSS and JavaScript to make Douglas dance!


    # ## CHANGING CSS WITH JAVASCRIPT


    The first step in changing CSS using JavaScript is to locate the element you want
    to change. In Chapter 3, we showed how to give an HTML element an id attribute
    and how to locate that unique ID using `getElementById`. For example, to select
    Douglas''s left eye, you can use the following code:


    ```

    document.getElementById("lefteye")

    ```


    This code searches the HTML to locate the element with the ID of lefteye that
    we created in Chapter 3:


    ```

    <div class="eye" id="lefteye"></div>

    ```'
- md: "\n## PROJECT 5 ANIMATING YOUR ROBOT\n\nAfter JavaScript has located the element\
    \ to change, you tell JavaScript what part of that element you want to change.\n\
    \nIn Chapter 3, in order to tell JavaScript to change the HTML, we used .innerHTML:\n\
    \n```javascript\ndocument.getElementById(\"message\").innerHTML = \n\"Coding is\
    \ Fun!\";\n```\n\nThe inner HTML of an element is everything between the starting\
    \ and ending tags.\n\nJust as elements have inner HTML, which you can change using\
    \ .innerHTML, elements also have style, which you can change using .style.\n\n\
    ```javascript\ndocument.getElementById(\"lefteye\").style\n```\n\nAfter you've\
    \ told JavaScript that you want to change a style, you need to tell JavaScript\
    \ what property you want to change.\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_93_0.png)\n\
    \n> CSS properties let you change things like the size, color, font, and position\
    \ of HTML elements.\n\nTo change the background color of Douglas's left eye, you\
    \ use the backgroundColor property:\n\n```javascript\ndocument.getElementById(\"\
    lefteye\")\n.style.backgroundColor\n```\n\nYou then tell it what the new value\
    \ of the property should be. To change the style property of backgroundColor to\
    \ the value of purple, we use this code:\n\n```javascript\ndocument.getElementById(\"\
    lefteye\")\n.style.backgroundColor = \"purple\";\n```\n\nJavaScript style properties\
    \ are not always spelled the same as CSS style properties. JavaScript style use\
    \ camelCase capitalization instead of dashes to separate multiple words.\n\nTable\
    \ 5-1 shows some common CSS properties along with their JavaScript counterparts.\n\
