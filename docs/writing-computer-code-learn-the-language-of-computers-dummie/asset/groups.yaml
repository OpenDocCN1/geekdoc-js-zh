    \ STYLE\n\n```css\n#body {\n  position: absolute;\n  left: 25%;\n  top: 35%;\n\
    \  width: 45%;\n  height: 55%;\n  background-color: rgb(255,255,0);\n  text-align:\
    \ center;\n  padding-top: 30px;\n}\n```\n\nThe result is shown in Figure 4-11.\n\
    \n![](img/1e031b40c08e37dffac2e4567cc3504c_89_0.png)\n\nFigure 4-11: Making Douglas's\
    \ shirt yellow.\n\n## CUSTOMIZING YOUR OWN ROBOT\n\nNow it's your turn! See how\
    \ many of the following CSS challenges you can complete.\n\nIn order to figure\
    \ out the color codes for some of these, use the online color chart at www.rapidtables.com/web/color/RGB_Color.htm.\n\
    \n- Make Douglas's left arm blue.\n- Make Douglas's right arm medium sea green.\n\
    - Change the color of the message on Douglas's shirt to white, and make his shirt\
    \ black.\n- Make the size of the message on Douglas's shirt larger.\n\nFigure\
    \ 4-12 shows what our robot looked like after we made all these changes!\n\nWhat\
    \ does yours look like? If you want to share him with us or with your friends,\
    \ just click Update to save your fiddle and then copy the web address and send\
    \ it!\n\n## SUMMARY\n\nIn this chapter, you learned how to use CSS to change the\
    \ style of HTML elements and you learned how to resize and position elements using\
    \ CSS. In the next chapter, you'll learn how to make Douglas dance!\n\n## PROJECT\
    \ 4 GIVING YOUR ROBOT STYLE\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_91_0.png)\n\
    \nFigure 4-12: The style we designed for Douglas.\n\n## PROJECT 5 ANIMATING YOUR\
    \ ROBOT\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_92_0.png)\n\n**IN CHAPTER\
    \ 3, YOU LEARNED HOW YOU CAN USE JAVASCRIPT TO CHANGE HTML.** You can also use\
    \ JavaScript to change CSS styles. And the process is very similar.\n\nIn this\
    \ chapter, we'll use CSS and JavaScript to make Douglas dance!\n\n## CHANGING\
    \ CSS WITH JAVASCRIPT\n\nThe first step in changing CSS using JavaScript is to\
    \ locate the element you want to change. In Chapter 3, we showed how to give an\
    \ HTML element an id attribute and how to locate that unique ID using `getElementById`.\
    \ For example, to select Douglas's left eye, you can use the following code:\n\
    \n```javascript\ndocument.getElementById(\"lefteye\")\n```\n\nThis code searches\
    \ the HTML to locate the element with the ID of lefteye that we created in Chapter\
    \ 3:\n\n```html\n<div class=\"eye\" id=\"lefteye\"></div>\n```\n"
