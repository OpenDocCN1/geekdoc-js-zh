  mdcn: "\n\n# 项目 3 构建你的机器人身体\n\n图 3-2 显示了当你用网络浏览器查看它时的样子。这样好得多，对吧？\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_57_0.png)\n\
