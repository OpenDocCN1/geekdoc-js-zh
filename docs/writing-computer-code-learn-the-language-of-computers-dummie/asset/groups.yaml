    Each zero or one in a binary number is called a *bit*, and a combination of eight
    bits is called a *byte*. When you hear the words *kilobyte, megabyte, and gigabyte*
    used to tell how big a file is, what that means is the number of bytes it takes
    to store the file.


    Table 1-1 lists the most common storage sizes.


    ## TABLE 1-1 HOW MANY BYTES IS THAT?


    | Name | Number of Bytes | What It Can Store |

    | --- | --- | --- |

    | Kilobyte (KB) | 1,024 | Two to three paragraphs of text |

    | Megabyte (MB) | 1,048,576 | 800 pages of a book |

    | Gigabyte | 1,079,741,824 | 1,000 books |

    | Terabyte | 1,099,511,627,776 | 1 million books |

    | Petabyte (PB) | 1,125,899,906,842,624 | Several copies of every book ever written!
    |


    ## PROJECT 1 BECOMING A PROGRAMMER


    ![](img/1e031b40c08e37dffac2e4567cc3504c_17_0.png)


    ## WRITING NUMBERS IN BINARY CODE


    Do you want to learn to count like a computer? We''ll show you how to write any
    number between 0 and 255 in binary code. For this example, we''ll write the number
    150 in binary code.


    - Write the following numbers horizontally at the top of a piece of paper:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    These numbers are your binary cheat sheet.


    - Underneath these numbers, write the number that you want to convert to binary,
    which is 150.


    - Start with the first number you wrote on your paper, 128. If this number fits
    inside of 150, write a 1 under it. If it doesn''t fit inside of 150, write a 0
    under it.


    Because 128 can fit inside of 150, put a 1 under the 128.


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    - Subtract the number 128 from the number you''re writing in binary code (150):
    150 - 128 = 22. Cross out the 150 that you wrote down and write down 22.


    - Compare the remainder to the next number in your binary cheat sheet, 64. Does
    64 fit inside of 22? It doesn''t, so write a 0 under 64 and move on to the next
    next number in the cheat sheet, 32.


    - Because 32 doesn''t fit inside of 22, write a 0 under the 32, and move on to
    the next number, which is 16.


    - Ah ha! 16 fits inside 22! Write a 1 under the 16 and subtract 16 from 22: 22
    - 16 = 6.


    - Because 8 doesn''t fit inside of 6, write a 0 under the 8, and move on to the
    next number, which is 4.


    - Because 4 fits inside 6, write a 1 under the 4 and subtract 4 from 6: 6 - 4
    = 2.


    - Because 2 fits inside 2, write a 1 under the 2 and subtract 2 from 2: 2 - 2
    = 0.


    - Because 1 doesn''t fit inside of 0, write a 0 under the 1.


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | ---|---|---|---|---|---|---|---|

    | 0 | 0 | 0 | 1 | 0 | 1 | 1 | 0 |

