    # 正就像口语语言有规则（称为语法），编程语言也有规则（称为语法）。


    当你理解了说 JavaScript 的基本规则时，它实际上与英语相似。如果你认为老师在纠正你说 "ain''t" 时很严格，那么等你看到 JavaScript
