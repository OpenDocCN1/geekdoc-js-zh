    # A technology book for kids!


    Learning how to code can be like learning a foreign language. This book serves
    as an excellent guide to help you start writing in the odd-looking languages that
    make the web work. Follow simple steps as you work with real code to build your
    own web robots.


    - Create your robot—write code that builds your robot’s body and structure

    - Give your robot some style—add code lines that customize your robot’s color
    and shape

    - Get your robot moving—finish off your robot with code that teaches it how to
    dance


    Technology Requirements:

    Hardware — PC or tablet with Internet connection running Windows*7 or higher or
    Mac with Internet connection running Mac OS X*10.7 or higher

    Software — Web browser to access JSFiddle.net: Google Chrome*, Mozilla Firefox*,
    Apple Safari*, Microsoft Edge*, or Microsoft Internet Explorer* version 9.0 or
    higher


    > Chris Minnick and Eva Holland are experienced web developers, tech trainers,
    and coauthors of JavaScript For Kids For Dummies. Together they founded WatzThis?,
    a company focused on training and course development.


