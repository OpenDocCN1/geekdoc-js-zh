    \n如果你查看图 4-8 中的 CSS 颜色表，或者检查 Douglas 的 CSS，你还会发现另一种在 CSS 中制作颜色的方法。这种方法使用以 # 开头的字母和数字。这种方法被称为十六进制。\n\
    \n## 修改颜色\n\n现在让我们使用新知识对 Douglas 的部分进行一些更改。你已经尝试过更改 Douglas 眼睛的颜色。那么更改他的嘴的颜色呢？在\
