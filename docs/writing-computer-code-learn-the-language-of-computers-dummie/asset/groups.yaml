    \ of paper. You can then flip through the book to see a cartoon.\n\nIf you have\
    \ a stack of index cards or a notebook, you can make your own flipbook. Figure\
    \ 5-8 shows a picture of a flipbook animation that we made of Douglas the Robot\
    \ dancing.\n\nToday's animation works the same way as flipbooks, but we use computers\
    \ and programming to create each picture instead of stacks of paper.\n\nEach single\
    \ picture in an animation is called a frame. The way Douglas's eye-bounce animation\
    \ works is by showing his eye in a slightly different place, every 10 milliseconds\
    \ (one-tenth of a second). When you click your eye, it jumps to the top of his\
    \ head and floats back down to its starting point."
