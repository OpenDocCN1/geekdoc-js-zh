    在本章中，你学习了 JavaScript 语法的基础知识，并发现了操作数和运算符是如何运作的。


    # 表达你的意图


    作为一名程序员，你的工作是思考你想让程序做什么，然后将其拆解为计算机可以执行且不会出错的小步骤。如果你想让机器人下楼去做一个三明治包，你可能会这样开始你的指令：


    1. 将头部转向楼梯。

    2. 使用视觉传感器寻找障碍物。

    3. 如果发现障碍物，弄清楚它是什么。

    4. 如果障碍物是一只猫，尝试引诱它。

    5. 当没有障碍物时。

    6. 当发现障碍物时。

    7. 寻找障碍物。

    8. 确定你是否发现了障碍物。

    9. 如果你发现了障碍物，就检查它。

    10. 如果没有发现障碍物。

    11. 重复步骤 1 到 10。


    # 表达你的意图


    作为一名程序员，你的工作是思考你想让程序做什么，然后将其拆解为计算机可以执行且不会出错的小步骤。如果你想让机器人下楼去做一个三明治包，你可能会这样开始你的指令：


    1. 将头部转向楼梯。

    2. 使用视觉传感器寻找障碍物。

    3. 如果发现障碍物，弄清楚它是什么。

    4. 如果障碍物是一只猫，尝试引诱它。

    5. 当没有障碍物时。

    6. 当发现障碍物时。

    7. 寻找障碍物。

    8. 确定你是否发现了障碍物。

    9. 如果你发现了障碍物，就检查它。

    10. 如果没有发现障碍物。

    11. 重复步骤 1 到 10。


    # 制作语句


    在英语中，我们通过句子交流。在计算机代码中，单个指令被称为语句。就像句子一样，语句由不同的部分组成，并遵循规则。


    以下语句会让 Web 浏览器弹出一个窗口显示“Coding is Fun!”。


    ```

    alert("Coding is Fun!")

    ```


    如果你将此语句输入 JSFiddle 的 JavaScript 面板并点击 Run，你会看到类似图 2-2 所示的结果。


    # 创建


    注意该语句包含一个关键字（alert）、一些符号（括号和引号）以及一些文本（Coding is Fun!），并以分号（;）结尾。


    就像可以用英语编写无限语句一样，可以用 JavaScript 编写语句。单词 alert 是 JavaScript 关键字的示例。许多 JavaScript
    语句以关键字开头，但并不是所有都是如此。


    > 分号用于分隔语句，就像句号分隔句子。每个语句都应该以分号结尾。


    # 遵循规则


    如果你想让计算机理解你，JavaScript 有几个规则必须遵守。以下是最重要的规则：


    - 拼写很重要。

    - 大写很重要。

    - 间距并不。


    编码语言对拼写非常挑剔。它们非常挑剔，事实上，它们不喜欢你错误地大写，例如使用 Alert 而不是 alert。


    ![](img/1e031b40c08e37dffac2e4567cc3504c_38_0.png)


    当一种编程语言区分大小写时，我们称之为大小写敏感（case sensitivity）。这个名字源于它对你使用大写字母还是小写字母非常敏感。


    这种严格性唯一不适的情况是文本被双引号（""）或单引号（''''）包围。在这种情况下，拼写错误不会引起问题。你可以输入任何内容！


    在我们“Coding is Fun!”的示例中，你可以将双引号内的单词替换为任何你内容！例如，你可以这样加上你的名字：“My name is Eva, and
    I think coding is fun!”


    ![](img/1e031b40c08e37dffac2e4567cc3504c_38_1.png)


    如果你在引号之外输入任何内容，你都必须遵循规则；否则，你的程序可能无法运行。


