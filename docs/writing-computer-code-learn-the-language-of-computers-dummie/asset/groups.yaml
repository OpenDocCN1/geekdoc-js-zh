  mdcn: "\n\n# 引言\n\n所以，你想开始编写真正的计算机代码了！也许你以前玩过拖放式编程语言，或者在《我的世界》中制作过模组，现在你准备好进入更高级阶段了。太棒了！目前有\
    \ 500 多种不同的计算机编程语言（考虑到世界上大约有 6500 种人类语言，这并不算多！）。你即将学习全球数百万编码人员正在使用的最流行的编程语言。\n\
    \n# 关于本书\n\n在书中，你将学习使用 HTML5、CSS3 和 JavaScript 来创建计算机程序。使用这三种计算机编程语言的人比人类以来发明的任何其他编程语言都多得多。事实上，你访问的每一个网站都使用了这三门语言。这就是为什么我们认为，你通过学习《编写计算机代码》来开启你的编程之旅是一个非常明智的决定。\n\
    \n计算机代码既有趣又易于学习。只要有足够的决心和丰富的想象力，你很快就能创建出你自己的计算机程序！\n\n就像成为伟大的运动员或音乐家的唯一途径是练习、练习、再练习一样，成为计算机程序员的唯一途径就是编写代码、编写代码、再编写代码！\n\
    \n本书由一系列项目组成，每个项目都包含了从开始到结束的构建步骤。项目之间环环相扣，因此当你读完本书时，你将拥有一个可以用鼠标控制的动画机器人，并在完成所有项目很久以后，还可以继续对其进行修改和改进。\n\
    \n# 引言\n\n完成书中的项目，你需要以下条件：\n\n- 一台运行 Windows、Mac OS X 或 Linux 操作系统的计算机\n- 一个网页浏览器，如\
    \ Chrome、Firefox 或 Safari\n- 一个互联网连接\n\n在学习每个项目时，请记住以下几点：\n\n 代码 代码和网页地址使用等宽字体（monofont）。如果你正在阅读电子书，可以点击像\
    \ www.dummies.com 这样的网页地址来访问该网站。\n\n- 当你开始时，最好的学习方法是观察别人是如何做的。出于这个原因，我们在书中的每一个重要步骤都包含了图片，并且我们所有的示例都可以在\
    \ http://jsfiddle.net/user/watzthisthis/fiddles 查看。如果你想检查自己的工作，或者直接复制我们的示例，请务必同时查看这两个地方。\n\
    \n- 每个项目在结束时都会对项目中的编程核心思想进行回顾。这些核心思想包含了你在未来的项目中发现非常有用的代码和概念。\n\n- 编程并不困难，但它确实涉及很多技术细节。如果你不想阅读所有的解释，只需跳到下一个代码示例并尝试一下即可。\n\
    \n# 关于你\n\n我们已经知道你准备好并愿意编写代码了。因为你正在阅读这些，我们知道你完全完全并可以立即开始。我们没有很多假设，但这里有我们想提前提到的几点：\n\
    \n- 你应该能够熟练地使用浏览器访问网站，并在键盘上打字。书中的项目可能无法在没有键盘的手机或平板电脑上运行。\n\n- 你熟悉非常基础的数学。我们说的是加、减、乘、除法。我们完全不需要任何非常高级的内容，但基础数学是编程的一个重要部分。\n\
    \n- 你有耐心和专注力去坚持下去并排除故障（bugs）。我们保证编程可以非常有趣，但也保证当你必须追踪那个导致整个程序无法运行的单个拼写错误或遗漏的命令时，它可能会令人沮丧。坚持下去！\n\
    \n其实就这些了。如果你卡住了，请记住，编写计算机代码时发生的很多问题仅仅是因为拼写错误或你输入的计算机无法理解的单词。缓慢、谨慎地进行，你会表现得很出色的！\n\
    \n# 关于图标\n\n当你阅读书中的项目时，你会看到几个图标。这些图标指向不同的内容：\n\n注意！警告（Warning）图标标记了重要信息，你可以利用这些信息来避免编码时常见的陷阱。\n\
    \n![](img/1e031b40c08e37dffac2e4567cc3504c)\n\n记住（Remember）图标标记了你以前遇到过应该记住的概念。\n\
    \n提示（Tip）图标标记了对你有帮助的建议和技巧。\n\n# 引言\n\n![](img/1e031b40c08e37dffac2e4567cc3504c)\n\
    \n代码乐趣（Fun with Code）图标描述了你在编码时使用的代码。\n\n![](img/1e031b40c08e37dffac2e4567cc3504c)\n\
    \n数学乐趣（Fun with Math）图标描述了你使用的数学。\n\n# 第一步\n\n![](img/1e031b40c08e37dffac2e4567cc3504c)\n\
    \n一旦你迈出第一步，世界将向你敞开。祝贺你迈出了第一步！\n\n# 第一个项目：成为程序员\n\n![](1e031b40c08e37dffac2e4567cc3504c)\n\
    \n# 什么是编程？\n\n计算机程序是一组计算机可以理解的指令。计算机程序的另一个名称是*软件*。计算机编程，也称为*编码*（coding），是我们编写这些内容时的称呼。图\
