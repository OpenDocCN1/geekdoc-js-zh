    \ most important header on the page.\n\nAnother very useful HTML tag is the `<p>`\
    \ tag, which marks paragraphs. To insert a `<p>` tag, follow these steps:\n\n\
    - After the `</h1>`, press Return (Mac) or Enter (Windows) to move to the next\
    \ line.\n- Type `<p>` and then type any message that you want to display.\n\n\
    JSFiddle automatically creates your closing `</p>` tag.\n- Click Run to see your\
    \ message appear in the Result pane.\n\nThe JavaScript pane, in the lower-left\
    \ part of JSFiddle, is where really interesting things happen.\n\n- In the JavaScript\
    \ pane, find the line that reads max = 36 and change it to max = 80.\n- Click\
    \ Run.\n\nMany of the bubbles, but not all of them, are now larger than they were\
    \ before.\n\nBased on the behavior of the bubbles when you changed the value of\
    \ max, can you guess what will happen if you change the line that reads min =\
    \ 12? Try it out and see if your guess is correct! If you guessed that max controls\
    \ the maximum size of the bubbles and min controls the minimum size of the bubbles,\
    \ you're absolutely right.\n\nThe next two lines in the JavaScript pane are bubbles\
    \ = 100 and timerDelay = 8000.\n\nTry changing both of these values and see what\
    \ happens. By playing around with these values (or maybe just by guessing), you'll\
    \ discover that bubbles = 100 tells how many bubbles there should be, and timerDelay\
    \ has something to do with how fast the bubbles rise.\n\n# SHARING YOUR FIDDLE\n\
    \nNow that you've created your own personalized version of the Bubbles demo, it's\
    \ time to show your friends!\n\n- Click the Share button in the top toolbar.\n\
    \nYou'll see the options to copy the address for your Bubbles demo, to view the\
    \ program in full-screen mode, and to share your program on Facebook or Twitter.\n\
    \nIf you want to share your programs on Facebook or Twitter, remember to tag us\
    \ (@watzthisco on Twitter or www.facebook.com/watzthisco), and we'll check out\
    \ your creations!\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_32_0.png)\n\n- Highlight\
    \ the full-screen URL in the Share menu, as shown in Figure 1-12, and copy it\
    \ by pressing Command+C (Mac) or Ctrl+C (Windows) or by choosing Edit Copy in\
