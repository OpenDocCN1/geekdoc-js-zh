    \n编写 HTML 的第一个规则是标签需要按照正确的顺序打开和关闭。记住这一点的一种方法是 *FILO*，代表“后进先出”（First In, Last Out）。\n\
    \n注意，之前的购物列表以 `<html>` 标签开始，以 `</html>` 标签结束。这是每个 HTML 文档开始和结束的方式。网页中的所有其他标签都在\
