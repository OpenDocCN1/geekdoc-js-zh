    # PROJECT 4 GIVING YOUR ROBOT STYLE


    EVERYONE HAS HIS OR HER OWN INDIVIDUAL STYLE. Your style might be similar to your
    best friend''s style, or it might be totally different. You may feel most comfortable
    in jeans and a T-shirt, and your best friend might prefer being dressed up. Styles
    also come and go: What''s in style today might look silly ten years from now.
    If you don''t believe us, ask your parents to see a photograph of what they looked
    like in high school. When you''re done laughing, read on.


    You can change the way you look by changing your clothes. But what makes you who
    you are, doesn''t change when you change your clothes. In the same way, it''s
    possible to change the way HTML looks without changing its content and structure.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_72_0.png)'
