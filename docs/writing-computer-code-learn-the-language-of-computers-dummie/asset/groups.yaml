  mdcn: "\n## 项目 5 让你的机器人动起来\n\n在 JavaScript 定位到要更改的元素后，你告诉 JavaScript 你想更改该元素的哪个部分。\n\
    \n在第 3 章中，为了告诉 JavaScript 修改 HTML，我们使用了 `.innerHTML`：\n\n```javascript\ndocument.getElementById(\"\
    message\").innerHTML = \n\"Coding is Fun!\";\n```\n\n元素的内部 HTML 是起始标签和结束标签之间的所有内容。\n\
    \n就像元素具有内部 HTML（你可以使用 `.innerHTML` 来更改）一样，元素也具有样式（你可以使用 `.style` 来更改）。\n\n```javascript\n\
    document.getElementById(\"lefteye\").style\n```\n\n当你告诉 JavaScript 你想更改某种样式后，你需要告诉\
    \ JavaScript 你想要更改哪个属性。\n\n![](img/1e031b40c08e37dffac2e4567cc3504c_93_0.png)\n\
    \n> CSS 属性允许你更改 HTML 元素的尺寸、颜色、字体和位置等。\n\n要更改 Douglas 左眼的背景颜色，你使用 `backgroundColor`\
    \ 属性：\n\n```javascript\ndocument.getElementById(\"lefteye\")\n.style.backgroundColor\n\
    ```\n\n然后你告诉它该属性的新值应该是什么。要将 `backgroundColor` 属性的值改为紫色，我们使用以下代码：\n\n```javascript\n\
    document.getElementById(\"lefteye\")\n.style.backgroundColor = \"purple\";\n```\n\
    \nJavaScript 样式属性的拼写并不总是与 CSS 样式属性相同。JavaScript 样式使用驼峰命名法（camelCase）而不是连字符来分隔多个单词。\n\
    \n表 5-1 显示了一些常见的 CSS 属性及其对应的 JavaScript 属性。\n\n## 表 5-1 CSS 属性与 JavaScript 样式属性\n\
