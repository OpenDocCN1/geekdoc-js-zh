    \nFigure 3-3: HTML tags nest in the same way that Russian nesting dolls do.\n\n\
    # PROJECT 3 BUILDING YOUR ROBOT'S BODY\n\nAnother rule when writing HTML is that\
    \ documents always have a head element and a body element:\n\n- **The head element**:\
    \ The head element is like the brain of your web page. JavaScript code often goes\
