    要开始使用 JSFiddle，打开你的 Chrome 网络浏览器，并在地址栏中输入 http://jsfiddle.net。你会看到一个像图 1-9 样的屏幕。


    ![](img/1e031b40c08e37dffac2e4567cc3504c_25_0.png)


    图 1-9：JSFiddle 首页，你的新乐场。


    JSFiddle 由三个窗格组成，你可以在每个窗格中输入三种 Web 代码之一：HTML、CSS 和 JavaScript。第四个窗格是结果窗（Result），你可以在那里看到在其他框中输入的内容。左侧的工具栏允许为你的项目添加标题和描述，并包含一些我们在书中不会涉及的其他高级功能。顶部工具栏具有运行、保存和清理代码的按钮。


    # 创建 JSFiddle 账户


    JSFiddle 让任何人创建账户并在公共仪表板中分享程序——许多优秀且丰富的程序员！


    当程序员在 JSFiddle 上分享他们的程序时，他们同意任何想要的人都可以复制作品进行修改并重新发布。然而，借用代码时注明原作者总是有礼貌的。


    学习不需要创建 JSFiddle 账户，但它会让查看和分享你的工作变得更容易。


    按照以下步骤创建 JSFiddle 账户：


    - 点击屏幕右上角的登录/注册链接。

    - 点击登录表单下的注册链接。

    - 填写创建账户表单并点击创建账户。

    - 显示个人信息页面。

    - 如果你愿意，可以在此处进行更改并保存。

    - 当你准备好开始摆弄时，点击屏幕顶部的编辑器（Editor）链接。


