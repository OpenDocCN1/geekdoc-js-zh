    \n![](img/1e031b40c08e37dffac2e4567cc3504c_41_1.png)\n\n作为一个程序员，你在命名变量时有很大的自由度。在命名变量时可以充分发挥创意，但你不希望搞得太疯狂。最重要的是，你的变量名应该描述你存储在它们内部的内容。\n\
    \n以下变量具有良好且具描述性的名称：\n\n```\nvar firstName\nvar favoriteFood\nvar birthday\nvar\
    \ timeOfDay\n```\n\n仅仅通过这些变量名，你可能就能猜出里面存储了什么类型的信息。\n\n在看了这些示例之后，你会为存储以下信息命名变量呢？\n\
    \n- 你的宠物名字\n- 你最喜欢的学校科目\n- 你最好的朋友的名字\n- 你的街道地址\n\n以下我们可能这样命名这些变量：\n\n- myPetName\n\
    - myFavoriteSchoolSubject\n- bestFriendName\n- myStreetAddress\n\n除了变量名不能包含空格的规则外，还有其他你必须遵循的规则：\n\
    \n- 变量名必须以字母、下划线（_）或美元符号（$）开头。\n- 变量名只能包含字母、下划线或美元符号。\n- 变量名区分大小写（大小写很重要！）。\n\
    - 某些单词不能作为变量名，因为它们在 JavaScript 中有其他含义。这些所谓的**保留字**如下：\n\n```\nbreak class catch\n\
    const continue debugger\ndelete do else\nextends finally for function\nif import\
    \ instanceof\nlet new return\nswitch this throw\ntypeof var void\nwith yield\n\
    ```\n\n## 项目 2 收集构建机器人的零件\n\n在创建变量时，你只需要在创建和命名它们时输入 `var`。当你想要使用或更改变量内部的内容时，你只需要使用该变量名。\n\
    \n当你将数据存储在变量中时，可以在程序的任何时候通过输入变量名来召回它。所以，当你使用变量名 `myFavoriteFood` 时，它和说“tacos”完全一样。\n\
