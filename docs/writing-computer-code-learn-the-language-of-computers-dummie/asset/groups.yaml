    \ = top + '%';\n    top++;\n    if (top == 20) {\n      clearInterval(id);\n \
    \   }\n  }\n}\n```\n\n```javascript\nfunction moveRightLeft(e) {\n  var robotPart\
    \ = e.target;\n  var left = 0;\n  var id = setInterval(frame, 10) // 每 10 毫秒绘制一次\n\
    \  function frame() {\n    robotPart.style.left = left + '%';\n    left++;\n \
    \   if (left == 70) {\n      clearInterval(id);\n    }\n  }\n}\n```\n\n# 项目 5：让你的机器人动起来\n\
    \n现在轮到你享受让 Douglas 跳舞的乐趣了！从播放一些音乐并随着节奏点击他的眼睛和手臂开始！接下来，尝试添加一些新的事件监听器来让 Douglas\
