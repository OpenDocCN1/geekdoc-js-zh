    # GATHERING YOUR TOOLS


    Every task you complete requires a set of tools, and writing computer code requires
    some special tools as well. Instead of things like hammers and pencils, JavaScript
    programmers use tools that are found on the Internet. You''ll only need a web
    browser and an Internet connection to complete all the projects in this book.


    Let''s move on and get your toolbox organized.


    # GETTING YOUR BROWSER READY


    The one essential tool that you need for working with JavaScript is a web browser.
    You have many different web browsers to choose from, and nearly all of them will
    do a great job running JavaScript. You probably already have a web browser on
    your computer.


    The most widely used web browsers today are Mozilla Firefox, Apple Safari, Google
    Chrome, and Microsoft Internet Explorer. For this book, we''ll be using Chrome,
    which is currently the most popular web browser and has a number of great tools
    for working with JavaScript.


    If you don''t already have Chrome installed, you''ll need to download and install
    it. You can install Chrome by opening any other web browser and going to www.google.com/chrome/desktop.
    Follow the instructions found on that page (shown in Figure 1-8) to install Chrome
    on your computer. When you have Chrome installed, start it up.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_24_0.png)


    Figure 1-8: Installing the Chrome web browser is easy!


    # WORKING WITH JSFIDLE


    We''d like to introduce you to our favorite JavaScript playground: JSFiddle. Instead
    of swings and slides, you''ll be playing with JavaScript statements, HTML tags,
    and CSS styles.


    # PROJECT 1 BECOMING A PROGRAMMER


    JSFiddle lets you write and experiment with code from within your web browser.
    You can use it to try out code, get feedback on your code, share your code, and
    even work on programs with your friends!


    JSFiddle is what we''ll be using throughout this book to experiment with HTML,
    CSS, and JavaScript. It''s called JSFiddle because you can use it to “fiddle”
    with code. So, let the fiddling begin!


    To get started with JSFiddle, open your Chrome web browser and type http://jsfiddle.net
    into the address bar. You''ll see a screen that looks like Figure 1-9.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_25_0.png)


    Figure 1-9: The JSFiddle home page, your new playground.


    JSFiddle is made up of three panes where you can enter each of the three types
    of web code: HTML, CSS, and JavaScript. The fourth pane is the Result pane, where
    you can see the results of what you type inside the other boxes. The toolbar on
    the left lets you add a title and description to your project and has some other
    advanced features we won''t worry about for this book. The top toolbar has buttons
    for running, saving, and cleaning up your code.


    # CREATING A JSFiddle ACCOUNT


    JSFiddle lets anyone create an account and share their programs in a public dashboard
    — and many excellent and very experienced programmers!


    When programmers share their programs on JSFiddle, they agree that anyone who
    wants to can make a copy of their work change it, and republish it. However, it''s
    always polite to give the original author credit when you borrow code.


    Creating a JSFiddle account isn''t required in order to proceed with the book,
    but it will make viewing and sharing your work easier.


    Follow these steps to create a JSFiddle account:


    - Click the Login/Sign Up link in the upper-right corner of the screen.

    - Click the Sign Up link under the login form.

    - Fill out the Create an Account form and click Create an Account.

    - The Edit Your Profile page appears.

    - If you would like, you can make changes here and save them.

    - When you''re ready to start fiddling, click the Editor link at the top of the
    screen.


    ![](img/1e031b40c08e37dffac2e4567cc3504c_26_0.png)


    # PROJECT 1 BECOMING A PROGRAMMER


    You can resize any of the panes in JSFiddle by clicking and dragging the border
    that separates them.


    For now, we''re going to focus on the JavaScript pane. Follow these steps to run
    your first JSFiddle program:


    - 1 Click inside the JavaScript pane.

    - 2 Type the following:

    ```javascript

    alert("Hello, world!");

    ```

    - 3 Click Run.


    Congratulations! You just wrote your first program!


    But that''s not the only thing JavaScript can do. In this book, you''ll learn
    how to use JavaScript to create interactive websites, games, and much more.


    Are you ready to get started? Let''s dive in!

