  \n![更详细的登录信息](img/login-vuex-plugin.png) \n\n如果到此为止一切运行正常，请继续下一步。\n\n## 订阅房间\n\n\
  现在我们已经成功验证了登录功能可以工作，我们需要将用户重定向到 `ChatDashboard` 视图。代码 `this.$router.push('chat');`\
  \ 为我们完成了这一操作。然而，我们的 action `login` 需要返回一个布尔值，以确定何时可以导航到 `ChatDashboard` 视图。我们还需要从\
  \ ChatKit 服务获取实际数据来填充 `RoomList` 和 `UserList` 组件。\n\n更新 `src/chatkit.js` 如下：\n\n\
  ```javascript\n//...\nimport moment from 'moment'\nimport store from './store/index'\n\
  \n//...\nfunction setMembers() {\n  const members = activeRoom.users.map(user =>\
  \ ({\n    username: user.id,\n    name: user.name,\n    presence: user.presence.state\n\
  \  }));\n  store.commit('setUsers', members);\n}\n\nasync function subscribeToRoom(roomId)\
  \ {\n  store.commit('clearChatRoom');\n  activeRoom = await currentUser.subscribeToRoom({\n\
  \    roomId,\n    messageLimit: MESSAGE_LIMIT,\n    hooks: {\n      onMessage: message\
  \ => {\n        store.commit('addMessage', {\n          name: message.sender.name,\n\
  \        });\n      },\n      presenceChanged: () => {\n        setMembers();\n\
  \      },\n      userTyping: user => {\n        store.commit('setUserTyping', user.id);\n\
  \      },\n      stoppedTyping: () => {\n        store.commit('setUserTyping', null);\n\
  \      }\n    }\n  });\n  setMembers();\n  return activeRoom;\n}\n\nexport default\
  \ {\n  connectUser,\n  subscribeToRoom\n}\n```\n\n\n\n\n```javascript\nimport {\
  \ mapState, mapActions } from 'vuex'\n//...\nexport default {\n  //...\n  methods:\
  \ {\n    ...mapActions([\n      'changeRoom'\n    ]),\n    onChange(room) {\n  \
  \    this.changeRoom(room.id)\n    }\n  }\n}\n```\n\n如果你还记得，我们已经在 `-b-list-group-item-`\
  \ 元素中定义了 ``@click=\"onChange(room)\"``。让我们通过点击 `RoomList` 组件中的项目来测试这个新功能。\n\n![切换聊天室](img/change-room.png)\
  \ \n\n每当你点击房间时，你的 UI 都应该会更新。`MessageList` 和 `UserList` 组件应该显示所选房间的正确信息。在下一节中，我们将一次性实现多个功能。\n\
  \n## 页面刷新后重新连接用户\n\n你可能已经注意到，当你对 `store/index.js` 进行一些更改或刷新页面时，你会收到以下错误：`Cannot\
  \ read property 'subscribeToRoom' of null`。这种发生是因为你的应用程序状态被重置了。幸运的是，`vuex-persist`\
  \ 包通过将状态保存在浏览器的本地存储中，在页面重新加载之间维护了我们的 Vuex 状态。\n\n遗憾的是，连接我们应用和 ChatKit 服务器的引用被重置为\
  \ null。要修复这个问题，我们需要执行重连接操作。我们还需要一种方法告诉应用程序刚刚发生了页面刷新，我们的程序需要重新连接以继续正常运行。我们将在 `src/components/ChatNavbar.vue`\
  \ 中实现这段代码。按如下更新脚本部分：\n\n```javascript\n<script>\nimport { mapState, mapActions,\
  \ mapMutations } from 'vuex'\n\nexport default {\n  name: 'ChatNavBar',\n  computed:\
  \ {\n    ...mapState([\n      'user',\n       'reconnect'\n    ])\n  },\n  methods:\
  \ {\n    ...mapActions([\n      'logout',\n      'login'\n    ]),\n    ...mapMutations([\n\
  \      'setReconnect'\n    ]),\n    onLogout() {\n      this.$router.push({ path:\
  \ '/' });\n      this.logout();\n    },\n    unload() {\n      if(this.user.username)\
  \ { // 用户尚未注销\n      this.setReconnect(true);\n      }\n    }\n  },\n  mounted()\
  \ {\n    window.addEventListener('beforeunload', this.unload);\n    if(this.reconnect)\
  \ {\n      this.login(this.user.username);\n    }\n  }\n}\n</script>\n```\n\n让我来分解一下事件序列，以便你理解重新连接到\
  \ ChatKit 服务的逻辑：\n\n1. `unload`。当发生页面刷新时，此方法会被调用。它首先检查 `user.username` 状态是否已设置。如果是，意味着用户尚未注销。状态\
  \ `reconnect` 将被设置为 true。\n\n2. `mounted`。每当 `ChatNavbar.vue` 完成渲染时，此方法就会被调用。它首先为在页面卸载之前调用的事件监听器分配了一个处理程序。它还会检查\
  \ `state.reconnect` 是否已设置为 true。如果是，则执行登录程序，从而将我们的聊天应用程序重新连接回 ChatKit 服务。\n\n我还添加了\
  \ `Logout` 功能，我们稍后会介绍。\n\n在做出这些更改后，尝试刷新页面。你会看到页面自动更新，因为它在后台执行重连接过程。当你切换房间时，它应该运行得完美无。\n\
  \n## 发送消息、检测用户输入和注销\n\n让我们通过在 `src/chatkit.js` 中添加以下代码开始实现这些功能：\n\n```javascript\n\
  //...\nasync function sendMessage(text) {\n  const messageId = await currentUser.sendMessage({\n\
  \    text,\n    roomId: activeRoom.id\n  });\n  return messageId;\n}\n\nexport function\
  \ isTyping(roomId) {\n  currentUser.isTypingIn({ roomId });\n}\n\nfunction disconnectUser()\
  \ {\n  currentUser.disconnect();\n}\n\nexport default {\n  connectUser,\n  subscribeToRoom,\n\
  \  sendMessage,\n  disconnectUser\n}\n```\n\n虽然函数 `sendMessage` 和 `disconnectUser`\
  \ 将封装在 ChatKit 的模块导出中，但 `isTyping` 函数将单独导出。这是为了允许 `MessageForm` 直接发送输入事件，而不必涉及 Vuex\
  \  store。\n\n对于 `sendMessage` 和 `disconnectUser`，我们需要更新 store 以适应错误处理和加载状态通知等情况。进入\
  \ `src/store/actions.js` 并在 `changeRoom` 函数之后插入以下代码：\n\n```javascript\nasync sendMessage({\
  \ commit }, message) {\n  try {\n    commit('setError', '');\n    commit('setSending',\
  \ true);\n    const messageId = await chatkit.sendMessage(message);\n    return\
  \ messageId;\n  } catch (error) {\n    handleError(commit, error)\n  } finally {\n\
  \    commit('setSending', false);\n  }\n},\nasync logout({ commit }) {\n  commit('reset');\n\
  \  chatkit.disconnectUser();\n  window.localStorage.clear();\n}\n```\n\n对于 `logout`\
  \ 函数，我们调用 `commit('reset')` 将我们的 store 重置为原始状态。这是一个基础的安全功能，用于从浏览器缓存中移除用户信息和消息。\n\
  \n让我们从更新 `MessageForm.vue` 中的表单输入开始，通过添加以下指令发送输入事件：\n\n```html\n<b-form-input id=\"\
  message-input\"\n              type=\"text\"\n              v-model=\"message\"\n\
  \              @input=\"isTyping\"\n              placeholder=\"Enter Message\"\n\
  \              autocomplete=\"off\"\n              required></b-form-input>\n```\n\
  \n更新 `MessageForm.vue` 的脚本部分以处理发送和发射事件如下：\n\n```javascript\n<script>\nimport { mapActions,\
  \ mapState, mapGetters } from 'vuex'\nimport { isTyping } from '../chatkit.js'\n\
  \nexport default {\n  name: 'message-form',\n  data() {\n    return {\n      message:\
  \ ''\n    }\n  },\n  computed: {\n    ...mapState([\n      'user',\n      'sending',\n\
  \      'error',\n      'activeRoom'\n    ]),\n    ...mapGetters([\n      'hasError'\n\
  \    ])\n  },\n  methods: {\n    ...mapActions([\n      'sendMessage',\n    ]),\n\
  \    async onSubmit() {\n      const result = await this.sendMessage(this.message);\n\
  \      if(result) {\n        this.message = '';\n      }\n    },\n    async isTyping()\
  \ {\n      await isTyping(this.activeRoom.id);\n    }\n  }\n}\n</script>\n```\n\n\
  在 `MessageList.vue` 中：\n\n```javascript\nimport { mapState } from 'vuex'\n\nexport\
  \ default {\n  name: 'message-list',\n  computed: {\n    ...mapState([\n      'messages',\n\
  \      'userTyping'\n    ])\n  }\n}\n```\n\n发送消息功能现在应该可以工作了。为了显示另一个用户正在输入的通知，我们需要在\
  \ `MessageList.vue` 的模板部分 `message-group` div 之后添加元素：\n\n```html\n<div class=\"\
  user-typing\">\n  <small class=\"text-muted\" v-if=\"userTyping\">@{{ userTyping\
  \ }} is typing....</small>\n</div>\n```\n\n测试此功能，只需使用另一个浏览器登录并开始输入。你会在另一个用户的聊天窗口上看到一个通知。\n\
  \n![另一个用户聊天窗口中的通知](img/send-message-user-type.png) \n\n让我们通过实现最后一个功能 `logout` 来完成本教程。我们的\
  \ Vuex store 已经有了处理注销过程的代码。我们只需要更新 `src/components/ChatNavbar.vue`。只需将 `Logout`\
  \ 按钮与之前指定的函数处理程序 `onLogout` 链接即可：\n\n```html\n<b-nav-item href=\"#\" @click=\"onLogout\"\
  \ active>Logout</b-nav-item>\n```\n\n就是这样。你现在可以注销并作为另一个用户重新登录。\n\n![切换成员账户](img/logout-login.png)\
  \ \n\n## 总结\n\n我们现在到了本教程的结束。ChatKit API 使使我们能够在短时间内快速构建出一个聊天应用程序。如果我们从零开始构建类似的应用程序，我们需要几个周的时间，因为我们还需要完善后端。这个解决方案的奇妙之处在于，我们不需要处理托管、数据库管理和其他基础设施问题。我们只需要构建前端代码并部署到\
  \ Web、Android 和 iOS 平台的客户端设备上。\n\n\n\n\n请务必查看文档，因为在这个教程中，我有很多无法向你展示的后端功能。如果时间允许，你可以轻松构建一个功能完备的聊天应用程序，足以竞争\
  \ Slack 和 Discord 等热门聊天产品。\n\n# 第 4 章：为无头 CMS 构建 Vue 前端\n\n## 作者：Michael Wanyoike\n\
  \n在本指南中，我们将学习如何使用 Vue.js 和 [GraphCMS](https://graphcms.com/)（一个无头 CMS 平台）来构建一个现代博客网站。\n\
  \n如果你想今天就开始启动一个博客，我的建议是直接使用 WordPress。\n\n但如果你是一个媒体巨头，并希望尽可能快地将内容传输到多个设备上呢？你可能还需要将内容与广告和其他第三方服务集成。嗯，你可以用\
  \ WordPress 实现这些，但你会遇到该平台的一些问题。\n\n1. 你需要安装插件来来实现额外功能。安装的插件越多，你的网站运行得越慢。\n2. 与大多数\
  \ JavaScript 框架相比，PHP 相当慢。从开发者的角度来看，在 JavaScript 驱动的前端实现自定义功能要容易且快速得多。\n\n[JavaScript\
  \ 在浏览器加载测试中的性能优于 PHP](https://www.hostingadvice.com/blog/comparing-node-js-vs-php-performance/)。此外，现代\
  \ JavaScript 及其生态系统在快速构建新 Web 体验方面提供了更愉快的开发体验。\n\n因此，**无头 CMS (headless CMS)** 解决方案一直在增长——它们仅仅是用于管理内容的后端。通过这种方法，开发者可以使用他们选择的\
  \ JavaScript 框架专注于构建快速且具有交互性的前端。自定义 JavaScript 驱动的前端比在 WordPress 站点上进行更改要容易得多。\n\
  \nGraphCMS 与大多数无头 CMS 平台不同之处在于，它不是通过 REST 交付内容，而是通过 GraphQL。这项新技术优于 REST，因为它允许我们在单个请求中构建涉及多个模型数据的查询。\n\
  \n请考虑以下模型架构：\n\n**Post（文章）**\n* id: Number\n* title: String\n* content : String\n\
  * comments : Comments 数组\n\n**Comment（评论）**\n* id: Number\n* name: String\n* message:\
  \ String\n\n上述模型具有一对多（Post 到多多个 Comments）的关系。让我们看看如何获取一个带有所有关联 Comment 记录的单个 Post\
  \ 记录。\n\n如果数据在关系型数据库中，你必须构建一个低效的 SQL 语句，或者使用两个 SQL 语句来清晰地获取数据。如果数据存储在 NoSQL 数据库中，你可以使用现代\
  \ ORM 如 [Vuex ORM](https://vuex-orm.github.io) 为你轻松获取数据，如下：\n\n```\nconst post =\
  \ Post.query()\n  .with('comments')\n  .find(1);\n```\n\n非常简单！你可以轻松通过 REST 将此数据传递给目标客户端。但问题在于：每当客户端的数据需求发生变化时，你都被迫回到后端代码要么更新现有的\
  \ API 端点，要么创建一个提供所需数据集的新端点。这种往来处理的过程既疲惫又重复。\n\n如果，在客户端级别，你只需要请求所需的数据，而后端就会为你提供，而无需你做额外的工作呢？嗯，这就是\
  \ GraphQL 的作用。\n\n## 前提条件\n\n在开始之前，我想指出这是一份面向中级和高级用户的指南。我将不会复习基础知识，而是将向你展示如何使用 GraphCMS\
  \ 作为后端快速构建一个 Vue.js 博客。你需要精通以下领域：\n* ES6 和 ES7 JavaScript\n* Vue.js（使用 CLI 版本 3）\n\
  * GraphQL\n\n这就是你开始此教程所需的所有知识。此外，具备使用 REST 的背景将非常有帮助，因为我会经常引用它。如果你想复习一下，这篇文章可能会帮助：“REST\
  \ 2.0 来了，它的名字叫 GraphQL](https://www.sitepoint.com/rest-2-0-graphql/)”。\n\n## 关于项目\n\
  \n我们将构建一个带有基础评论系统的简单博客应用程序。以下是你可以访问以查看已完成项目的链接：\n* [CodeSandbox.io 演示](https://codesandbox.io/s/01zo6v221p)\n\
  * [GitHub 仓库](https://github.com/sitepoint-editors/vue-axios-graphcsms)\n\n请注意，演示中使用了一个只读（READ-ONLY）令牌，因此评论系统无法工作。你需要按照教程中的说明提供你的开放权限令牌和端点才能使其工作。\n\
  \n## 创建 GraphCMS 项目数据库\n\n访问 [GraphCMS](https://graphcms.com/) 网站并点击“免费开始”（Start\
  \ Building for Free）按钮。你将被带到注册页面。\n\n![注册 GraphCMS](img/graphcms-signup.png)\n\n\
  使用你偏好的方法注册。一旦完成账户身份验证和验证过程，你应该能够访问主仪表板。\n\n![GraphCMS 主仪表板](img/graphcms-dashboard.png)\n\
  \n在上面的示例中，我已经创建了一个名为“BlogDB”的项目。继续创建一个新的，并用你喜欢的任何名称命名。输入名称后，你可以留空其他部分。\n\n![GraphCMS\
  \ 主仪表板](img/graphcms-dashboard.png)\n\n\n\n接下来，你需要从仪表板的 `Settings` 页面获取 GraphCMS\
  \ 项目的 API 端点（endpoint）和令牌。你需要创建一个新令牌。对于权限级别，请使用 `OPEN`，这将允许工具对你的 GraphCMS 数据库执行\
  \ `READ`（读取）和 `WRITE`（写入）操作。创建一个名为 `.env` 的文件并将其放在项目根目录下：\n\n```\nENDPOINT=<在此处输入\
  \ api endpoint>\nTOKEN=<在此处输入带有 OPEN 权限的 token>\n```\n\n接下来，你可能需要用自己的数据填充 `data`\
  \ 文件夹中的 CSV 文件。以下可以使用的一些示例数据：\n\n```csv\n// Categories.csv\nname\nFeatured\nFood\n\
  Fashion\nBeauty\n\n// Posts.csv\ntitle,slug,content,categories\nFood Post 1,food-post-1,Breeze\
  \ through Thanksgiving by making this Instant Pot orange cranberry sauce,Food|Featured\n\
  Food Post 2,food-post-2,This is my second food post,Food\nFood Post 3,food-post-3,This\
  \ is my last and final food post,Food\nFashion Post 1,fashion-post-1,This is truly\
  \ my very first fashion post,Fashion|Featured\nFashion Post 2,fashion-post-2,This\
  \ is my second fashion post,Fashion\nFashion Post 3,fashion-post-3,This is my last\
  \ and final fashion post,Fashion\nBeauty Post 1,Beauty-post-1,This is truly my very\
  \ first Beauty post,Beauty|Featured\nBeauty Post 2,Beauty-post-2,This is my second\
  \ beauty post,Beauty\n```\n\n如果你愿意，可以更改内容。请确保不要触动第一行，否则你会更改字段名称。请注意，在 `categories`\
  \ 列中，我使用了管道符 `|` 作为分隔符。\n\n要将 CSV 数据上传到你的 GraphCMS 数据库，请按以下顺序执行这些命令：\n\n```bash\n\
  npm run categories\nnpm run posts\n```\n\n每个脚本都将输出成功上传的记录。我们先上传 `categories` 的原因是为了让\
  \ `posts` 记录能够成功链接到现有的 `category` 记录。\n\n如果你想清理数据库，可以运行以下命令：\n\n```bash\nnpm run\
  \ reset\n```\n\n此脚本将删除你所有的模型内容。你将得到一个报告，显示每个模型删除了多少条记录。\n\n我希望你会觉得这个工具很好用。回到仪表板确认\
  \ `Posts` 和 `Categories` 的数据已成功上传。\n\n后端处理完毕后，让我们开始构建前端博客界面。\n\n## 使用 Vue.js 构建博客前端\n\
  \n如前所述，我们将构建一个由 GraphCMS 数据库后端驱动的非常简单的博客应用程序。启动终端并导航到你的工作空间。\n\n如果你还没有安装 Vue CLI，请现在安装：\n\
  \n```bash\nnpm install -g @vue/cli\n```\n\n然后创建一个新项目：\n\n```bash\nvue create vue-graphcms\n\
  ```\n\n选择手动选择功能，然后选择以下选项：\n\n* 功能（Features）： Babel, Router\n* 路由历史模式（Router History\
  \ Mode）：Y\n* 仅带错误预防的 ESLint\n* 保存时检查（Lint on save）\n* 配置文件位置（Config file placement):\
  \ 专用配置文件\n* 保存预设（Save preset）：你的选择\n\n一旦项目创建过程完成，进入项目目录并安装以下依赖：\n\n```bash\nnpm\
  \ install bootstrap-vue axios\n```\n\n要在我们的项目中设置 `Bootstrap-Vue`，只需打开 `src/main.js`\
  \ 并添加以下代码：\n\n```javascript\nimport BootstrapVue from \"bootstrap-vue\";\nimport\
  \ \"bootstrap/dist/css/bootstrap.css\";\nimport \"bootstrap-vue/dist/bootstrap-vue.css\"\
  ;\n\nVue.config.productionTip = false;\nVue.use(BootstrapVue);\n```\n\n接下来，我们需要开始搭建项目结构。在\
  \ `src/components` 文件夹中，删除现有文件并创建这些新文件：\n\n* `CommentForm.vue`\n* `CommentList.vue`\n\
  * `Post.vue`\n* `PostList.vue`\n\n在 `src/views` 文件夹中，删除 `About.vue` 并创建一个名为 `PostView.vue`\
  \ 的新文件。如演示所示，我们将几个分类页面，每个页面显示按分类过滤的文章列表。从技术上讲，只有一个页面会根据激活的路由名称显示不同的文章列表。`PostList`\
  \ 组件将根据当前路由过滤文章。\n\n让我们先设置路由。打开 `src/router.js` 并将现有代码替换为内容：\n\n```javascript\n\
  import Vue from \"vue\";\nimport Router from \"vue-router\";\nimport Home from \"\
  ./views/Home.vue\";\nimport Post from \"./views/PostView.vue\";\n\nVue.use(Router);\n\
  \nexport default new Router({\n  mode: \"history\",\n  base: process.env.BASE_URL,\n\
  \  linkActiveClass: \"active\",\n  routes: [\n    {\n      path: \"/\",\n      name:\
  \ \"Featured\",\n      component: Home\n    },\n    {\n      path: \"/food\",\n\
  \      name: \"Food\",\n      component: Home\n    },\n    {\n      path: \"/fashion\"\
  ,\n      name: \"Fashion\",\n      component: Home\n    },\n    {\n      path: \"\
  /beauty\",\n      name: \"Beauty\",\n      component: Home\n    },\n    {\n    \
  \  path: \"/post/:slug\",\n      name: \"Post\",\n      component: Post\n    }\n\
  \  ]\n});\n```\n\n现在我们已经有了路由，让我们设置路由。打开 `src/router.js` 并将现有代码替换为：\n\n```javascript\n\
  import Vue from \"vue\";\nimport Router from \"vue-router\";\nimport Home from \"\
  ./views/Home.vue\";\nimport Post from \"./views/PostView.vue\";\n\nVue.use(Router);\n\
  \nexport default new Router({\n  mode: \"history\",\n  base: process.env.BASE_URL,\n\
  \  linkActiveClass: \"active\",\n  routes: [\n    {\n      path: \"/\",\n      name:\
  \ \"Featured\",\n      component: Home\n    },\n    {\n      path: \"/food\",\n\
  \      name: \"Food\",\n      component: Home\n    },\n    {\n      path: \"/fashion\"\
  ,\n      name: \"Fashion\",\n      component: Home\n    },\n    {\n      path: \"\
  /beauty\",\n      name: \"Beauty\",\n      component: Home\n    },\n    {\n    \
  \  path: \"/post/:slug\",\n      name: \"Post\",\n      component: Post\n    }\n\
  \  ]\n});\n```\n\n现在我们已经有了路由，让我们设置导航栏。打开 `App.vue` 并将现有代码替换为：\n\n```html\n<template>\n\
  \  <div id=\"app\">\n    <b-navbar toggleable=\"md\" type=\"dark\" variant=\"info\"\
  >\n      <b-navbar-toggle target=\"nav_collapse\"></b-navbar-toggle>\n      <b-navbar-brand\
  \ href=\"#\">GraphCMS</b-navbar-brand>\n      <b-collapse id=\"nav_collapse\" nav>\n\
  \        <b-nav>\n          <b-nav-item link to=\"/\" exact>Home</b-nav-item>\n\
  \          <b-nav-item link=\"/food\">Food</b-nav-item>\n          <b-nav-item link=\"\
  /fashion\">Fashion</b-nav-item>\n          <b-nav-item link=\"/beauty\">Beauty</b-nav-item>\n\
  \        </b-nav>\n      </b-collapse>\n    </b-navbar>\n\n    <b-container>\n \
  \     <router-view/>\n    </b-container>\n  </div>\n</template>\n```\n\n这将网站顶部添加一个带有分类链接的导航栏。保存文件并更新以下文件：\n\
  \n**src/views/Home.vue**\n\n```vue\n<script>\nimport PostList from \"@/components/PostList.vue\"\
  ;\n\nexport default {\n  name: \"home\",\n  components: {\n    PostList\n  }\n};\n\
  </script>\n```\n\n**src/components/PostList.vue**\n\n```html\n<template>\n  <section\
  \ class=\"post-list\">\n    <h1>{{ category }} 文章</h1>\n    <hr/>\n    <p>在此处放置文章列表!</p>\n\
  \  </section>\n</template>\n\n<script>\nexport default {\n  name: \"PostList\",\n\
  \  data() {\n    return {\n      category: \"\"\n    };\n  },\n  created() {\n \
  \   this.category = this.$route.name;\n  },\n  watch: {\n    $route() {\n      this.category\
  \ = this.$route.name;\n    }\n  }\n};\n</script>\n```\n\n注意，在 `PostList` 组件中，我们使用自定义监听器根据当前\
  \ URL 更新我们的 `category` 数据属性。\n\n现在我们准备好进行快速测试以确认路由正常。使用命令 `npm run serve` 启动 Vue.js\
  \ 服务器。在浏览器中打开 [localhost:8080](http://localhost:8080) 并测试每个链接。`category` 属性将输出我们在路由名称属性中定义的相同。\n\
  \n![应用页面视图](img/vue-scaffold.png)\n\n## 从 GraphCMS 获取数据\n\n现在我们的路由代码已经可以运行，让我们看看如何从我们的\
  \ GraphCMS 后端提取信息。在项目根目录下，创建一个 `env.local` 文件并填充以下字段的值：\n\n```\nVUE_APP_ENDPOINT=\n\
  VUE_APP_TOKEN=\n```\n\n请注意，Vue.js 单页应用只加载以 `VUE_APP` 开头的自定义环境变量。你可以从 GraphCMS 仪表板设置页面获取\
  \ API 端点和令牌。接下来，创建文件 `src/graphcms.js` 并复制以下代码：\n\n\n\n```javascript\nimport axios\
  \ from \"axios\";\n\nexport const ENDPOINT = process.env.VUE_APP_ENDPOINT;\nconst\
  \ TOKEN = process.env.VUE_APP_TOKEN;\n\nconst headers = {\n  \"Content-Type\": \"\
  application/json\",\n  Authorization: `Bearer ${TOKEN}`\n};\n\nexport const apiClient\
  \ = axios.create({\n  headers\n});\n\nexport const POSTS_BY_CATEGORY_QUERY = `\n\
  \  query PostsByCategory($category: String!){\n    category(where: {\n      name:\
  \ $category\n    }\n    ){\n      name,\n      posts {\n        id\n        slug\n\
  \        title\n        content\n        categories {\n          name\n        }\n\
  \      }\n    }\n  }\n`;\n\nexport const POST_BY_SLUG_QUERY = `\n  query PostBySlug($slug:\
  \ String!){\n    post(where: {\n      slug: $slug\n    })\n    {\n      id\n   \
  \   title\n      content\n      categories {\n        name\n      }\n      comments\
  \ {\n        name\n        message\n      }\n    }\n  }\n`;\n\nexport const CREATE_COMMENT_MUTATION\
  \ = `\n  mutation CreateComment($post: PostWhereUniqueInput!, $name: String!, $message:\
  \ String!){\n    createComment(data: {\n      name: $name,\n      message: $message,\n\
  \      post: {\n        connect: $post\n      },\n      status: PUBLISHED\n    })\n\
  \    {\n      id\n      name\n      message\n    }\n  }\n`;\n```\n\n我们刚刚创建的辅助文件提供了两个主要功能：\n\
  \n* 它创建了一个 `axios` 实例，该配置用于向你的 GraphCMS 后端执行授权请求。\n* 它包含了项目中使用的 GraphQL 查询和变异。这些变异负责获取文章（按分类或按\
  \ slug），以及创建新评论。如果你想了解更多关于 GraphQL 查询和变异，[请参阅 GraphQL 文档](https://graphql.org/learn/queries/)。\n\
  \n你还可以使用项目仪表板中的 API 探索器来测试这些查询和变异。要此操作，请从上面的代码复制查询或变异并粘贴到 API 探索器的顶部窗口。在下方的窗口中输入任何查询变量，然后点击\
  \ `Play` 按钮。你应该会在右侧的新窗格中看到结果。\n\n这里是一个查询示例：\n\n![GraphCMS 查询示例](img/graphms-query-example.png)\
  \ \n\n这是一个变异示例：\n\n![GraphCMS 变异示例](img/graphcsms-mutation-example.png) \n\n## 在模板中显示数据\n\
  \n现在，让我们在 `src/components/PostList.vue` 中创建一个 HTML 模板，以整洁的方式显示文章列表。我们还将添加 `axios`\
  \ 代码，从我们的 GraphCMS 数据库中拉取 `posts` 数据：\n\n```html\n<template>\n  <section class=\"\
  post-list\">\n    <h1>{{ category }} 文章</h1>\n    <hr/>\n    <b-row v-if=\"loading\"\
  >\n      <b-col class=\"text-center\">\n        <div class=\"lds-dual-ring\"></</div>\n\
  \      </b-col>\n    </b-row>\n    <div v-if=\"!loading\" >\n      <b-card tag=\"\
  article\" v-for=\"post in posts\" :key=\"post.id\" :title=\"post.title\" :sub-title=\"\
  post.categories.map(cat => cat.name).toString()\">\n        <p class=\"card-text\"\
  >\n          {{ post.content }}\n        </p>\n        <router-link class=\"btn\
  \ btn-primary\" :to=\"'post/' + post.slug\">\n          阅读文章\n        </router-link>\n\
  \      </b-card>\n    </div>\n  </section>\n</template>\n\n<script>\nimport { ENDPOINT,\
  \ POSTS_BY_CATEGORY_QUERY } from \"../cms.js\";\n\nexport default {\n  name: \"\
  PostList\",\n  data() {\n    return {\n      category: \"\",\n      loading: false,\n\
  \      posts: []\n    };\n  },\n  methods: {\n    async fetchPosts() {\n      try\
  \ {\n        this.loading = true;\n        const response = await apiClient(ENDPOINT,\
  \ {\n          query: POSTS_BY_CATEGORY_QUERY,\n          variables: {\n       \
  \     category: this.category\n          }\n        });\n\n        const body =\
  \ response.data;\n        this.posts = body.posts;\n        this.loading = false;\n\
  \      } catch (error) {\n        console.log(error);\n      }\n    }\n  },\n  created()\
  \ {\n    this.category = this.$route.name;\n    this.fetchPosts();\n  },\n  watch:\
  \ {\n    $route() {\n      this.category = this.$route.name;\n      this.fetchPosts();\n\
  \    }\n  }\n};\n</script>\n\n<style>\nh1{\n  margin-top: 25px;\n}\n.lds-dual-ring\
  \ {\n  display: inline-block;\n  width: 64px;\n  height: 64px;\n  border: 5px solid\
  \ #ccc;\n  border-color: #ccc;\n  border-radius: 50%;\n  animation: lds-dual-ring\
  \ 1.2s linear infinite;\n}\n@keyframes lds-dual-ring {\n  0% {\n    transform: rotate(0deg);\n\
  \  }\n  100% {\n    transform: rotate(360deg);\n  }\n}\n</style>\n```\n\n## 显示单篇文章\n\
  \n确保顶部主导航按预期工作。现在让我们处理 `Post` 组件。它将有自己的 `fetchPost()` 函数，通过 `slug` 进行查询。如果你在想 `slug`\
  \ 参数从哪里来，让我提醒你我们在 `router.js` 中放入的这段代码：\n\n```javascript\n//...\n{\n  path: '/post/:slug',\n\
  \  name: 'Post',\n  component: Post\n},\n//...\n```\n\n这意味着 `/post/` 之后的任何内容都可以作为\
  \ `this.$route.params.slug` 用于组件。\n\n`post` 组件是 `CommentForm` 和 `CommentList` 组件的父组件。`comments`\
  \ 数据将从文章记录作为 props 传递给 `CommentList` 组件。现在为 `src/components/CommentList.vue` 插入代码：\n\
  \n```html\n<template>\n  <section class=\"comment-list\">\n    <hr/>\n    <h4 class=\"\
  text-muted\">评论</h4>\n    <b-card v-for=\"comment in comments\" :title=\"comment.name\"\
  \ title-tag=\"h5\" :key=\"comment.id\">\n      <p class=\"card-text text-muted\"\
  >{{ comment.message }}</p>\n    </b-card>\n    <p v-if=\"comments.length === 0\"\
  \ class=\"text-center text-muted\">暂无评论！</p>\n  </section>\n</template>\n\n<script>\n\
  export default {\n  name: \"CommentsList\",\n  props: [\"comments\"]\n};\n</script>\n\
  ```\n\n除非通过 GraphCMS 仪表板手动输入了评论，否则现在不要期望看到任何结果。让我们为 `src/components/CommentForm.vue`\
  \ 添加代码，使用户能够为博客文章添加评论。\n\n\n\n\n\n<template>\n  <section class=\"comment-form\"\
  >\n    <h4 class=\"text-muted\">评论表</h4>\n    <b-form @submit.prevent=\"onSubmit\"\
  >\n      <b-form-group label=\"姓名\">\n        <b-form-input id=\"input-name\" type=\"\
  text\" v-model=\"name\" placeholder=\"输入您的姓名\" required></b-form-input>\n      </b-form-group>\n\
  \       <b-form-group label=\"消息\">\n         <b-form-textarea id=\"input-message\"\
  \ v-model=\"message\" placeholder=\"输入您的评论\" :rows=\"3\" :max-rows=\"6\" required>\n\
  \         </b-form-textarea>\n      </b-form-group>\n      <b-button type=\"submit\"\
  \ variant=\"primary\">提交</b-button>\n    </b-form>\n  </section>\n</template>\n\n\
  <script>\nimport { apiClient, ENDPOINT, CREATE_COMMENT_MUTATION } from \"../graphcms.js\"\
  ;\n\nexport default {\n  name: \"CommentForm\",\n  props: [\"post\"],\n  data()\
  \ {\n    return {\n      name: \"\",\n      message: \"\"\n    };\n  },\n  methods:\
  \ {\n    async onSubmit() {\n      const formattedComment = {\n        name: this.name,\n\
  \        message: this.message,\n        post: {\n          id: this.post.id\n \
  \       }\n      };\n      try {\n        const response = await apiClient.post(ENDPOINT,\
  \ {\n          query: CREATE_COMMENT_MUTATION,\n          variables: formattedComment\n\
  \        });\n\n        const body = await response.data.data;\n        const newComment\
  \ = body.createComment;\n        this.post.comments.push(newComment);\n        this.name\
  \ = \"\";\n        this.message = \"\";\n      } catch (error) {\n        console.log(error);\n\
  \      }\n    }\n  }\n};\n</script>\n\n<style>\n  .comment-form {\n    margin-top:\
  \ 35px;\n  }\n</style>\n```\n\n现在我们有了一个基础的评论表单，能够向我们的 GraphQL 后端系统提交新评论。一旦新评论被保存，我们将获取返回的对象并将其添加到\
  \ `post.comments` 数组中。这应该触发 `CommentList` 组件来显示新添加的 `Comment`。\n\n现在让我们构建 `src/components/Post.vue`\
  \ 组件：\n\n```javascript\n<template>\n  <section class=\"post\">\n    <b-row v-if=\"\
  loading\">\n      <b-col>\n        <div class=\"lds-dual-ring text-center\"></div\n\
  \      </b-col>\n    </b-row>\n   <b-row v-if=\"!loading\">\n     <b-col>\n    \
  \  <h1>{{post.title}}</h1>\n      <h4 class=\"text-muted\">{{post.categories.map(cat\
  \ => cat.name).toString()}}</h4>\n      <hr>\n      <p>{{ post.content }}</p>\n\
  \     </b-col>\n   </b-row>\n   <!-- 评论列表 -->\n   <b-row v-if=\"!loading\">\n  \
  \   <b-col>\n       <CommentList :comments=\"post.comments\" />\n     </b-col>\n\
  \   </b-row>\n   <!-- 评论表单 -->\n    <b-row v-if=\"!loading\">\n     <b-col>\n  \
  \    <CommentForm :post=\"post\" />\n     </b-col>\n   </b-row>\n  </section>\n\
  </template>\n\n<script>\nimport { ENDPOINT, apiClient, POST_BY_SLUG_QUERY } from\
  \ \"../graphcms.js\";\nimport CommentList from \"@/components/CommentList\";\nimport\
  \ CommentForm from \"@/components/CommentForm\";\n\nexport default {\n  name: \"\
  Post\",\n  components: {\n    CommentList,\n    CommentForm\n  },\n  data() {\n\
  \    return {\n      loading: false,\n      slug: \"\",\n      post: {}\n    };\n\
  \  },\n  methods: {\n    async fetchPost() {\n      try {\n        this.loading\
  \ = true;\n        const response = await apiClient.post(ENDPOINT, {\n         \
  \ query: POST_BY_SLUG_QUERY,\n          variables: {\n            slug: this.slug\n\
  \          }\n        });\n\n        const body = await response.data.data;\n  \
  \      this.post = body.post;\n        this.loading = false;\n      } catch (error)\
  \ {\n        console.log(error);\n      }\n    }\n  },\n  created() {\n    this.slug\
  \ = this.$route.params.slug;\n    this.fetchPost();\n  }\n};\n</script>\n```\n\n\
  最后，这是用于 `src/views/PostView.vue` 的代码，将所有内容整合在一起：\n\n```javascript\n<template>\n\
  \  <div class=\"post-view\">\n    <Post/>\n  </div>\n</template>\n\n<script>\nimport\
  \ Post from \"@/components/Post.vue\";\n\nexport default {\n  name: \"PostView\"\
  ,\n  components: {\n    Post\n  }\n};\n</script>\n```\n\n你现在应该已经了 Posts 的以下视图。请注意\
  \ URL `localhost:8080/post/fashion-post-1` 结尾的 `:slug`：\n\n![Post comments]()\n\n\
  \n\n\n最后，让我们安装扩展。打开 Chrome 并在地址栏中输入 `chrome://extensions/`。你会看到一个显示已安装扩展的页面。\n\n\
  由于我们要从文件安装扩展（而不是从 Chrome 网上商店），我们需要使用页面右上角的开关启用 *Developer mode*。这应该添加一个带有 *Load\
  \ unpacked* 选项的额外菜单栏。点击此按钮并选择你之前创建的 `hello-world-chrome` 文件夹。点击 *Open*，你就能就能看到扩展已安装并出现一个“Hello,\
  \ World!”弹出窗口。\n\n![Hello World Extension](img/chrome-ext-1.jpg)\n\n恭喜！你刚刚制作了一个\
  \ Chrome 扩展。\n\n## 覆盖 Chrome 的新标签页\n\n下一步是让我们的扩展在我们打开新标签页时欢迎我们。我们可以通过使用 [Override\
  \ Pages API](https://developer.chrome.com/extensions/override) 来实现。\n\n### 禁用其他扩展\n\
  \n在继续之前，请确保禁用任何其他覆盖 Chrome 新标签页页的扩展。一次只能有一个扩展更改此行为。\n\n我们将开始创建一个显示以代替新标签页的页面。我们称其为\
  \ `tab.html`。它应该位于与你的清单文件和后台脚本相同的文件夹中：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
  >\n<head>\n  <meta charset=\"UTF-8\">\n  <title>My New Tab Page!</title>\n</head>\n\
  <body>\n  <h1>My New Tab Page!</h1>\n  <p>You can put any content here you like</p>\n\
  </body>\n</html>\n```\n\n接下来，我们需要告诉扩展关于此页面。我们可以通过在清单文件中指定 `chrome_url_overrides`\
  \ 键来实现，如下所示：\n\n```\n\"chrome_url_overrides\": {\n  \"newtab\": \"tab.html\"\n}\n\
  ```\n\n最后，你需要重新加载扩展以使更改生效。你可以通过点击 Chrome 扩展页面上 Hello World 扩展的 *reload* 图标来执行。\n\
  \n![Reload the extension](img/chrome-ext-2.jpg)\n\n现在，当你打开新标签页时，你应该受到你的自定义消息的欢迎。\n\
  \n\n\n这里没有什么特别的内容。这是一个简单的 HTML 页面，将用于存放我们的 Vue 实例。\n\n接下来，在 `tab.js` 中添加：\n\n```javascript\n\
  import Vue from 'vue';\nimport App from './App';\n\nnew Vue({\n  el: '#app',\n \
  \ render: h => h(App)\n});\n```\n\n在这里我们导入了 `Vue`，传递了一个我们想要用我们的应用程序来替换的元素选择器，然后告诉它渲染我们的\
  \ `App` 组件。\n\n最后，在 `App.vue` 中：\n\n```html\n<template>\n  <p>{{ message }}</p>\n\
  </template>\n\n<script>\nexport default {\n  data () {\n    return {\n      message:\
  \ \"My new tab page\"\n    }\n  }\n}\n</script>\n\n<style scoped>\np {\n  font-size:\
  \ 20px;\n}\n</style>\n```\n\n在使用这个新标签页页之前，我们需要更新 manifest 文件：\n\n```json\n{\n  \"\
  name\":\"new-tab-page\",\n  ...\n  \"chrome_url_overrides\": {\n    \"newtab\":\
  \ \"tab/tab.html\"\n  }\n}\n```\n\n我们还需要样板代码编译我们的文件并将它们复制到 `dist` 文件夹中，以便扩展程序可以使用。\n\
  \n如下所示修改 `webpack.config.js`，同时更新 `entry` 和 `plugins` 键：\n\n```javascript\nentry:\
  \ {\n  'background': './background.js',\n  'popup/popup': './popup/popup.js',\n\
  \  'tab/tab': './tab/tab.js'\n},\n```\n\n```javascript\nplugins: [\n  ...\n  new\
  \ CopyWebpackPlugin([\n    { from: 'icons', to: 'icons', ignore: ['icon.xcf'] },\n\
  \    { from: 'popup/popup.html', to: 'popup/popup.html', transform: transformHtml\
  \ },\n    { from: 'tab/tab.html', to: 'tab/tab.html', transform: transformHtml },\n\
  \    ...\n  })\n```\n\n你需要重启 `npm run watch:dev` 任务才能使这些更改生效。完成后，重新加载扩展并打开新标签页。你应该看到显示“My\
  \ new tab page”。\n\n![My new tab page](img/chrome-ext-3.jpg)\n\n## 获取并显示笑话\n\n好了，我们已经覆盖了\
  \ Chrome 的新标签页，并将其替换为一个微 Vue 应用。现在让我们它做得比显示消息更多。\n\n如下修改 `src/tab/App.vue` 中的模板部分：\n\
  \n```html\n<template>\n  <div>\n    <div v-if=\"loading\">\n      <p>Loading...</p>\n\
  \    </div>\n    <div v-else>\n      <p class=\"joke\">{{ joke }}</p>\n    </div>\n\
  \  </div>\n</template>\n```\n\n将 `<script>` 部分更改为如下：\n\n```javascript\n<script>\n\
  import axios from 'axios';\n\nexport default {\n  data () {\n    return {\n    \
  \  loading: true,\n      joke: \"\",\n    }\n  },\n  mounted() {\n    axios.get(\n\
  \      \"https://icanhazdadjoke.com/\",\n      { 'headers': { 'Accept': 'application/json'\
  \ } }\n    )\n      .then(res => {\n        this.joke = res.data.joke;\n       \
  \ this.loading = false;\n      });\n  }\n}\n</script>\n```\n\n最后，将 `<style>` 部分更改如下：\n\
  \n```css\n<style>\nbody {\n  height: 98vh;\n  text-align: center;\n  color: #353638;\n\
  \  font-size: 22px;\n  line-height: 30px;\n  font-family: Merriweather,Georgia,serif;\n\
  \  background-size: 200px;\n  display: flex;\n  align-items: center;\n  justify-content:\
  \ center;\n}\n\n.joke {\n  max-width: 800px;\n}\n</style>\n```\n\n如果你正在运行 `npm run\
  \ watch:dev` 任务，扩展程序会自动重新加载，每当你打开新标签页时，你都应该看到一个笑话。\n\n![How does a French skeleton\
  \ say hello? Bone-jour](img/chrome-ext-4.jpg)\n\n一旦你验证它运行正常，让我们花时间理解一下我们做了什么。\n\n\
  在模板中，我们使用 [v-if](https://vuejs.org/v2/guide/conditional.html) 块根据 `loading` 属性的状态来显示加载消息或笑话。初始情况下，它被设置为\
  \ `true`（显示加载消息），然后我们的脚本将触发一个 Ajax 请求来获取笑话。一旦 Ajax 请求完成，`loading` 属性将设置为 `false`，导致组件重新渲染并显示我们的笑话。\n\
  \n在`<script>` 部分中，我们导入了 `axios`，然后声明了几个数据属性——上述的 `loading` 属性和一个用于存放笑话的 `joke` 属性。我们随后使用了\
  \ `mounted` [生命周期钩子](https://vuejs.org/v2/guide/instance.html#Instance-Lifecycle-Hooks)，它会在我们的\
  \ Vue 实例挂载后触发一次，向 [笑话 API](https://icanhazdadjoke.com/api) 发起 Ajax 请求。请求完成后，我们更新了两个数据属性，导致组件重新渲染。\n\
  \n到目前为止一切顺利。\n\n## 将笑话持久化到 Chrome 存储中\n\n接下来，让我们添加一些按钮，允许用户收藏笑话并列出收藏的笑话。由于我们将使用\
  \ [Chrome 存储 API](https://developer.chrome.com/extensions/storage) 来持久化笑话，可能值得添加第三个按钮从存储中删除所有收藏的笑话。\n\
  \n首先，在 `manifest.json` 的底部添加以下：\n\n```json\n\"permissions\": [ \"storage\" ]\n```\n\
  \n这让扩展程序获得了访问 `chrome.storage` API 的权限。\n\n重新加载扩展，然后在 `v-else` 块中添加按钮：\n\n```html\n\
  <div v-else>\n  <p class=\"joke\">{{ joke }}</p>\n\n  <button @click=\"likeJoke\"\
  \ :disabled=\"likeButtonDisabled\">Like Joke</button>\n  <button @click=\"logJokes\"\
  \ class=\"btn\">Log Jokes</button>\n  <button @click=\"clearStorage\" class=\"btn\"\
  >Clear Storage</button>\n</div>\n```\n\n没什么特别的。注意我们通过 `disabled` 属性绑定到 Vue 实例的状态，以便用户在收藏后无法再次点击。\n\
  \n接下来，在脚本中添加 `likeButtonDisabled` ：\n\n```javascript\nexport default {\n  data ()\
  \ {\n    return {\n      loading: true,\n      joke: \"\",\n      likeButtonDisabled:\
  \ false\n    }\n  },\n  methods: {\n    likeJoke(){\n      chrome.storage.local.get(\"\
  jokes\", (res) => {\n        if(!res.jokes) {\n          res.jokes = [];\n     \
  \   }\n        res.jokes.push(this.joke);\n        chrome.storage.local.set({jokes:\
  \ res.jokes});\n        this.likeButtonDisabled = true;\n      });\n    },\n   \
  \ logJokes(){\n      chrome.storage.local.get(\"jokes\", (res) => {\n        if(res.jokes)\
  \ {\n          res.jokes.forEach(joke => console.log(joke));\n        }\n      });\n\
  \    },\n    clearStorage(){\n      chrome.storage.local.clear();\n    }\n  },\n\
  \  mounted() { ... }\n}\n```\n\n在这里我们定义了处理三个新按钮的方法。\n\n`likeJoke` 方法在 Chrome 存储中查找\
  \ `jokes` 属性。如果不存在（即用户尚未收藏过笑话），我们将其初始化为空数组。然后将当前的笑话推入该数组并保存回存储。最后，我们将 `likeButtonDisabled`\
  \ 数据属性设置为 `true`，从而禁用收藏按钮。\n\n`logJokes` 方法同样在 Chrome 存储中查找 `jokes` 属性。如果找到，它将遍历所有的条目并将其打印到控制台。\n\
  \n希望 `clearStorage` 方法的作用是清空。\n\n去扩展程序中尝试此新功能，并确认它工作正常。\n\n## 为扩展程序添加一些装饰\n\n好了，这些看起来可以工作，但按钮很难看，页面也很单调。让我们通过给扩展程序添加一些装饰来结束本节。\n\
  \n下一步，安装 [vue-awesome](https://www.npmjs.com/package/vue-awesome) 库。这将允许我们在页面中使用一些\
  \ Font Awesome 图标，并让那些按钮看起来好一点：\n\n```bash\nnpm install vue-awesome\n```\n\n在 `src/tab/tab.js`\
  \ 中为我们的 Vue 应用注册该库：\n\n```javascript\nimport Vue from 'vue';\nimport App from './App';\n\
  import \"vue-awesome/icons\";\nimport Icon from \"vue-awesome/components/Icon\"\
  ;\n\nVue.component(\"icon\", Icon);\n\nnew Vue({\n  el: '#app',\n  render: h =>\
  \ h(App)\n});\n```\n\n现在如下所示修改模板：\n\n\n\n\n\n```html\n<template>\n  <div>\n    <div\
  \ v-if=\"loading\" class=\"centered\">\n      <p>加载中...</p>\n    </div>\n    <div\
  \ v-else>\n      <p class=\"joke\">{{ joke }}</p>\n\n      <div class=\"button-container\"\
  >\n        <button @click=\"likeJoke\" :disabled=\"likeButtonDisabled\" class=\"\
  btn\"><icon name=\"thumbs-up\"></icon></button>\n        <button @click=\"logJokes\"\
  \ class=\"btn\"><icon name=\"list\"></icon></button>\n        <button @click=\"\
  clearStorage\" class=\"btn\"><icon name=\"trash\"></icon></button>\n      </div>\n\
  \    </div>\n  </div>\n</template>\n```\n\n最后，让我们给按钮添加一些样式，并包含一张[大家最喜爱的老爸](https://knowyourmeme.com/memes/trolldad)的照片：\n\
  \n```css\n<style>\nbody {\n  height: 98vh;\n  text-align: center;\n  color: #353638;\n\
  \  font-size: 22px;\n  line-height: 30px;\n  font-family: Merriweather,Georgia,serif;\n\
  \  background: url(\"https://dab1nmslvvntp.cloudfront.net/wp-content/uploads/2018/12/1544189726troll-dad.png\"\
  ) no-repeat 1% 99%;\n  background-size: 200px;\n  display: flex;\n  align-items:\
  \ center;\n  justify-content: center;\n}\n\n.joke {\n  max-width: 800px;\n}\n\n\
  .button-container {\n  position: absolute;\n  right: 0px;\n  top: calc(50% - 74px);\n\
  }\n\n.btn {\n  background-color: #D8D8D8;\n  border: none;\n  color: white;\n  padding:\
  \ 12px 16px;\n  font-size: 16px;\n  cursor: pointer;\n  display: block;\n  margin-bottom:\
  \ 5px;\n  width: 50px;\n}\n\n.btn:hover {\n  background-color: #C8C8C8;\n}\n\n.btn:disabled\
  \ {\n  background-color: #909090;\n}\n</style>\n```\n\n扩展程序应该重新加载。尝试打开新标签页，你应该能看到这样的界面。\n\
  \n![完成的扩展程序](img/chrome-ext.jpg)\n\n## 将扩展程序上传到 Chrome 商店\n\n如果你想让其他人可以使用你的扩展程序，可以通过\
  \ [Chrome 商店](https://chrome.google.com/webstore) 完成。完成此操作首先需要一个 Google 账号，可以用它登录[开发者中心](https://chrome.google.com/webstore/dashboard)。系统会提示你输入开发者详细信息，在发布第一个应用之前，你必须支付一次性\
  \ 5 美元的费用（通过信用卡）。\n\n接下来，你需要为你的应用创建一个 ZIP 文件。你可以在本地运行 `npm run build-zip` 来实现。这将在项目根目录下创建一个\
  \ `dist-zip` 文件夹，其中包含一个准备好上传到商店的 ZIP 文件。对于一个简单的扩展程序，这就是你需要做的一切。然而，在上传任何内容之前，值得阅读官方的[在\
  \ Chrome 商店发布](https://developer.chrome.com/webstore/publish)指南。\n\n## 结论\n\n到这里，我们就结束了。在这个教程中，我强调了\
  \ Chrome 扩展程序的主要部分，并展示了如何使用 [vue-web-extension](https://github.com/Kocal/vue-web-extension)\
  \ 模板来使用 Vue.js 构建扩展程序。我们最后查看了如何将扩展程序上传到商店以及相关内容。我希望你喜欢这个教程，并可以使用它来构建你自己的 Chrome\
  \ 扩展程序。如果你做了什么酷酷的东西，请告诉我（https://twitter.com/chibbard）。\n\n# 第 6 章：使用 Nuxt.js 和\
  \ kindergarten 构建你自己的链接分享网站\n\n作者：Nilson Jacques\n\n在教程中，我们将创建一个自己的链接分享网站，类似于 [Echo\
  \ JS](https://echojs.com/) 或 [Hacker News](https://news.ycombinator.com/)，并配有评论和点赞功能。我们将使用的技术栈包括\
  \ Vue.js、Nuxt.js 框架以及一个名为 `vue-kindergarten` 的访问控制/授权库。本指南并非旨在对所使用的任何库进行“深度解析”。相反，目标是让你接触这些工具，以及它们如何协作来创建一个真实的应用程序。\n\
  \n## Node 和 npm\n\n为了跟上教程，你需要安装较新版本的 Node.js，并且你的 npm 版本需要 >= 5.2.0。\n\n## GitHub\
  \ 仓库\n\n这里有一个包含完成代码的 GitHub 仓库（https://github.com/sitepoint-editors/vue-news-site-demo）。\n\
  \n## 安装 Nuxt.js\n\n我们将在此项目中使用 [Nuxt.js](https://nuxtjs.org/)。虽然它以服务端渲染（SSR）而闻名，但我们实际上不会使用\
  \ Nuxt 的这部分。相反，我们将利用 Nuxt 的“约定优于配置”的方法来减少我们需要编写的模板代码。打开终端创建一个文件夹：\n\n```\nmkdir\
  \ yans && cd yans\n```\n\n### 命令\n\n这些命令适用于 Linux，在 macOS 上同样有效。Windows 用户需要相应操作！\n\
  \n通过 npm 启动 Nuxt.js 安装程序启动项目：\n\n```\nnpx create-nuxt-app\n```\n\n`npx` 工具将下载并运行安装程序，你将遇到一系列问题。这不是关于\
  \ Nuxt 的深度教程，所以我不会详细介绍这些。以下是跟随本指南需要进行的选择：\n\n1. *Project name*（你的选择）\n2. *Project\
  \ description*（你的选择）\n3. *Use a custom framework* (“none”）\n4. *Use a UI framework*\
  \ (“bulma”）\n5. *Choose rendering mode* (“Single Page”)\n6. *Use axios module* (“yes”）\n\
  7. *Use eslint*（你的选择）\n8. *Use prettier*（你的选择）\n9. *Author name*（你的选择）\n10. *Choose\
  \ a package manager*（你的选择）\n\n### Lint 与代码样式\n\n如果你安装了 ESLint 和 Prettier（就像我一样），安装后需要运行\
  \ `npm run lint --fix`，否则你的 Nuxt 项目将编译。\n\n教程中的代码格式反映了默认配置。如果这困扰了你，可以根据喜好更改设置（Prettier\
  \ 会帮你加上分号！）或完全跳过。\n\n安装完成后，是进入新创建的 `client` 文件夹并开始构建网站了！\n\n## 布局与样式\n\n我们将使用 [Bulma\
  \ CSS 框架](https://bulma.io) 为我们的新闻网站设置样式。Nuxt 贴心地提供了从安装程序中添加它的选项，但我们还需要引入 [Font\
  \ Awesome](https://fontawesome.com/) 来获取图标。最直接的方法是编辑 Nuxt 配置文件并添加 CDN CSS 链接。\n\n\
  **client/nuxt.config.js**\n\n```javascript\n/*\n ** 页面头部\n */\nhead: {\n   title:\
  \ pkg.name,\n   meta: [\n     { charset: 'utf-8' },\n     { name: 'viewport', content:\
  \ 'width=device-width, initial-scale=1' },\n     { hid: 'description', name: 'description',\
  \ content: pkg.description }\n   ],\n   link: [\n     { rel: 'icon', type: 'image/x-icon',\
  \ href: '/favicon.ico' },\n     {\n       rel: 'stylesheet',\n       href: 'https://use.fontawesome.com/releases/v5.6.3/css/all.css'\n\
  \     }\n   ]\n },\n```\n\n\n\n\n```html\n<template>\n  <div>\n    <nav\n      class=\"\
  navbar is-info\"\n      role=\"navigation\"\n      aria-label=\"main navigation\"\
  \n    >\n      <div class=\"navbar-brand\">\n        <nuxt-link\n          class=\"\
  navbar-item\"\n          to=\"/\"\n        >\n          YANS!\n        </nuxt-link>\n\
  \n        <a\n          role=\"button\"\n          class=\"navbar-burger burger\"\
  \n          aria-label=\"menu\"\n          aria-expanded=\"false\"\n          data-target=\"\
  navbarBasicExample\"\n        >\n          <span aria-hidden=\"true\"/>\n      \
  \    <span aria-hidden=\"true\"/>\n          <span aria-hidden=\"true\"/>\n    \
  \    </a>\n      </div>\n\n      <div class=\"navbar-menu\">\n        <div class=\"\
  navbar-start\">\n          <nuxt-link\n            to=\"/\"\n            class=\"\
  navbar-item\"\n          >首页</nuxt-link>\n          <nuxt-link\n            to=\"\
  /new\"\n            class=\"navbar-item\"\n          >最新</nuxt-link>\n         \
  \ <nuxt-link\n            to=\"/submit\"\n            class=\"navbar-item\"\n  \
  \        >提交</nuxt-link>\n        </div>\n\n        <div class=\"navbar-end\">\n\
  \          <div class=\"navbar-item\">\n            <div class=\"buttons\">\n  \
  \            <nuxt-link\n                to=\"/register\"\n                class=\"\
  button is-primary\"\n              >\n                **注册**\n              </nuxt-link>\n\
  \              <nuxt-link\n                to=\"/login\"\n                class=\"\
  button is-light\"\n              >登录</nuxt-link>\n            </div>\n         \
  \ </div>\n        </div>\n      </div>\n    </nav>\n    <nuxt/>\n  </div>\n</template>\n\
  ```\n\n导航栏的基础标记源自 Bulma 官方文档，但我们将锚点标签（`<a>` tags）替换为 Nuxt 自己的 `<nuxt-link>` 组件，这允许我们与它所使用的\
  \ Vue Router 实例进行交互。此外，注意在模板的底部，我们有一个 `<nuxt/>` 元素，这样路由就知道了在哪里显示我们的内容。\n\n如你所见，我们的菜单栏包含\
  \ `首页`（按投票数排序的帖子）、`最新`（最近的文章）和 `提交`（提交新链接的表单）的链接。\n\n## 模拟后端\n\n我们不会介绍构建网站后端（这个主题最好留给单独的指南），而是将创建一个伪造的\
  \ API 服务器。通常对于这类任务，我会使用 [json-server](https://www.sitepoint.com/mock-rest-apis-using-json-server/)，它在将\
  \ JSON 文件转换为 RESTful 模拟 API 方面表现非常出色，但我们还需要支持身份验证。\n\n幸运的是，有一个名为 [json-server-auth](https://github.com/jeremyben/json-server-auth)\
  \ 的模块，它基于 json-server 构建，添加了 JWT 身份验证和访问控制。让我们安装它并将其设置为我们的模拟后端。\n\n从 `client` 文件夹切换到父目录。创建一个名为\
  \ `server` 的新文件夹并进入，然后初始化一个新的 `package.json` 文件：\n\n```bash\ncd ..\nmkdir server\
  \ && cd server\nnpm init -y\n```\n\n同时安装 `json-server-auth` 包：\n\n```bash\nnpm i\
  \ json-server-auth\n```\n\n如果你对原始的 `json-server` 包不熟悉，它的工作原理是：你创建一个 JSON 文件作为模拟\
  \ API 的数据存储。该文件包含一个对象，其键为你希望 API 拥有的每个端点（例如“users”）。\n\n我们的文件看起来如下。\n\n**server/db.json**\n\
  \n```json\n{\n  \"users\": [],\n  \"posts\": [],\n  \"comments\": []\n}\n```\n\n\
  这是我们新闻网站所需的基础结构。你可以在[项目仓库](https://github.com/sitepoint-editors/vue-news-site-demo/blob/master/server/db.json)中找到预填充了示例数据的\
  \ `db.json` 副本。\n\n在通常情况下，这足够启动并运行一个模拟后端了。然而，由于我们将使用 Nuxt 社区的 Auth 模块，我们需要先进行一些自定义。\n\
  \n在 Auth 模块成功完成身份验证请求后，它会向“user”端点发送请求，并期望返回一个代表已登录用户的 JSON 对象。\n\njson-server-auth\
  \ 模块并没有开箱提供此功能，因此我们将手动添加。创建一个名为 `index.js` 的新文件，并添加以下代码。\n\n**server/index.js**\n\
  \n```javascript\nconst jsonServer = require('json-server')\nconst auth = require('json-server-auth')\n\
  \nconst app = jsonServer.create()\nconst router = jsonServer.router('db.json')\n\
  \nconst { rewriter } = require('json-server-auth/dist/guards')\n\nconst rules =\
  \ rewriter({\n  user: 660\n})\n\napp.use(rules)\n\napp.db = router.db\n\napp.use(auth)\n\
  app.get('/user', (req, res, next) => {\n  const { email } = req.claims\n  const\
  \ { db } = req.app\n  const user = Object.assign({}, db.get('users').find({ email\
  \ }))\n  res.json(user)\n})\n\napp.listen(3001, () => {\n  console.log('JSON server\
  \ running on port 3001')\n})\n```\n\n大部分代码来自 json-server 文档，但我们启动运行在 3001 端口的 API\
  \ 服务器。\n\n我们在 `/user` 端点添加了：\n\n```javascript\napp.get('/user', (req, res, next)\
  \ => {\n  const { email } = req.claims\n  const { db } = req.app\n  const user =\
  \ Object.assign({}, db.get('users').find({ email }))\n  res.json(user)\n})\n\napp.use(router)\n\
  \napp.listen(3001, () => {\n  console.log('JSON server running on port 3001')\n\
  })\n```\n\n## 身份验证\n\n正如之前提到的，我们将使用 Nuxt 的 [Auth 模块](https://auth.nuxtjs.org/)。通过一些配置，该模块为我们提供了与服务器进行身份验证的有用方法，以及用于限制路由的\
  \ Nuxt 中间件。\n\n我们需要的第一件事是从 npm 安装该模块（在此步骤之前忘记切换回 `client` 文件夹！）：\n\n```bash\nnpm\
  \ i @nuxtjs/auth\n```\n\n下载完成后，我们需要再次打开 Nuxt 配置并添加一些设置。\n\n**client/nuxt.config.js**\n\
  \n```javascript\n/*\n** Nuxt.js modules\n*/\nmodules: [\n  '@nuxtjs/auth',\n  //\
  \ Doc: https://github.com/nuxt-community/axios-module#usage\n  '@nuxtjs/axios',\n\
  \  // Doc:https://github.com/nuxt-community/modules/tree/master/packages/bulma\n\
  \  '@nuxtjs/bulma'\n],\n```\n\n首先，我们需要告诉 Nuxt 关于该插件，通过在上述 `modules` 数组中添加模块名称。\n\
  \n在 `modules` 部分下方，让我们添加一个 auth 模块设置的新键。\n\n\n\n\n```javascript\nauth: {\n  strategies:\
  \ {\n    local: {\n      endpoints: {\n        login: {\n          url: '/api/login',\n\
  \          method: 'post',\n          propertyName: 'accessToken'\n        },\n\
  \        logout: false,\n        user: { url: '/api/user', method: 'get' }\n   \
  \   }\n    }\n  }\n},\n```\n\n`auth` 模块允许你配置不同的 `strategies`（即不同的认证方法），我们想要设置一个支持\
  \ JWT 认证的 `local` 策略。\n\n在策略的配置中，我们需要指定 `login`、`logout` 和 `user` 端点的详情，以便模块向其发送请求，以及它如何获取身份验证令牌。请注意，我们将\
  \ `logout` 设置为 `false`，因为我们的认证 API 不支持此方法。该模块将只删除缓存的令牌并恢复到未登录状态。\n\n为了让模块运行，我们需要做做的另一件事是准备一个\
  \ `Vuex` store，因为它使用它来存储认证状态和登录用户。我们也将在应用程序中使用 `Vuex`，所以让我们先将其设置为为一个空的 store。\n\n\
  **client/store/index.js**\n\n```javascript\nimport Vuex from 'vuex'\n\nconst createStore\
  \ = () => {\n  return new Vuex.Store({\n    state: {},\n    getters: {},\n    actions:\
  \ {},\n    mutations: {}\n  })\n}\n\nexport default createStore\n```\n\n由于 SSR 功能的工作机制，Nuxt\
  \ 要求我们的 store 导出为一个工厂函数，除此之外除此之外，这是一个普通的 `Vuex` store。\n\n我们还需要几个页面来处理注册和登录。让我们接下来创建它们。\n\
  \n### 注册\n\n首先，在 `pages` 文件夹中创建一个名为 `register.vue` 的新文件。在添加脚本块之前，我们先来看模板部分。\n\n\
  **client/pages/register.vue**\n\n```javascript\n<template>\n  <section class=\"\
  section\">\n    <div class=\"container\">\n\n      <div class=\"field\">\n     \
  \   <label class=\"label\">Username</label>\n        <div class=\"control\">\n \
  \         <input\n            v-model=\"username\"\n            class=\"input\"\n\
  \            type=\"text\"\n            autofocus\n          >\n        </div>\n\
  \      </div>\n\n      <div class=\"field\">\n        <label class=\"label\">Email</label>\n\
  \        <div class=\"control\">\n          <input\n            v-model=\"email\"\
  \n            class=\"input\"\n            type=\"text\"\n          >\n        </div>\n\
  \      </div>\n\n      <div class=\"field\">\n        <label class=\"label\">Password</label>\n\
  \        <div class=\"control\">\n          <input\n            v-model=\"password\"\
  \n            class=\"input\"\n            type=\"password\"\n          >\n    \
  \    </div>\n      </div>\n\n      <div class=\"field\">\n        <div class=\"\
  control\">\n          <button\n            :disabled=\"isSaving\"\n            class=\"\
  button is-link\"\n            @click=\"registerUser\"\n          >Register</button>\n\
  \        </div>\n      </div>\n    </</div>\n  </section>\n</template>\n```\n\n\
  这里我们只有三个基本的输入字段，它们通过 `v-model` 连接到组件上的数据属性。当提交按钮被点击时，它将调用组件中的 `registerUser` 方法。\n\
  \n现在是代码：\n\n```javascript\n<script>\nimport { mapActions } from 'vuex'\n\nexport\
  \ default {\n  data: () => ({\n    isSaving: false,\n    username: null,\n    email:\
  \ null,\n    password: null\n  }),\n  methods: {\n    ...mapActions(['saveUser']),\n\
  \    async registerUser() {\n      this.isSaving = true\n\n      await this.saveUser({\n\
  \        username: this.username,\n        email: this.email,\n        password:\
  \ this.password\n      })\n\n      this.$auth.login({\n        data: {\n       \
  \   email: this.email,\n          password: this.password\n        }\n      })\n\
  \n      this.$router.push('/')\n    }\n  }\n}\n</script>\n```\n\n`registerUser`\
  \ 方法非常直观。我们将 `isSaving` 标记设为 `true`，这防止了在处理过程中时表单被重复提交。然后，我们派发了一个 `Vuex` action\
  \ `saveUser`，传入三个输入值并等待它完成。最后，我们使用相同的值调用 auth 模块的 `login` 方法来登录新注册的用户，并跳转到主页。\n\n\
  使用 Nuxt 的好处之一是，我们不需要为页面手动创建路由。在 `pages` 文件夹中创建的任何组件都会自动生成一个同名的路由。\n\n我们目前在 store\
  \ 中还没有 `saveUser` action，所以让我们现在来写它。\n\n**client/store/index.js**\n\n```javascript\n\
  actions: {\n  async saveUser(context, { username, email, password }) {\n    const\
  \ data = {\n      id: uuid(),\n      username,\n      email,\n      password,\n\
  \      timestamp: new Date().getTime()\n    }\n\n    try {\n      await this.$axios.post('/api/register',\
  \ data)\n    } catch (error) {\n      console.error(error)\n    }\n  }\n}\n```\n\
  \n这个 action 接收传入的 `email`、`username` 和 `password` 并构建一个新的对象。我们需要通过 `npm` 安装生成 UUID\
  \ 的模块，并在 store 顶部导入它：\n\n```bash\nnpm i uuid\n```\n\n**client/store/index.js**\n\
  \n```javascript\nimport Vuex from 'vuex'\nimport uuid from 'uuid/v4'\n```\n\n`axios`\
  \ 模块使得 `this.$axios` 在 store 中可用，方便向服务器发送 `POST` 请求。我们现在会将任何错误记录到控制台，但你可能希望通知用户（例如使用\
  \ toast 模块）。\n\n完成后的页面应该是这样的：\n\n![注册页面](img/register.png)\n\n### 登录\n\n让我们处理登录页面。在\
  \ `pages` 文件夹中 `login.vue` 并添加以下模板。\n\n**client/pages/login.vue**\n\n```javascript\n\
  <template>\n  <section class=\"hero\">\n    <div class=\"hero-body\">\n      <div\
  \ class=\"container has-text-centered\">\n        <div class=\"column is-4 is-offset-4\"\
  >\n          <h3 class=\"title has-text-grey\">Login</h3>\n          <p class=\"\
  subtitle has-text-grey\">请登录以继续。</p>\n          <div class=\"box\">\n          \
  \  <form @submit.prevent=\"onSubmit\">\n              <div class=\"field\">\n  \
  \              <div class=\"control\">\n                  <input\n             \
  \       v-model=\"email\"\n                    class=\"input\"\n               \
  \     type=\"email\"\n                    placeholder=\"您的邮箱\"\n               \
  \     autofocus\n                  >\n                </div>\n              </div>\n\
  \n              <div class=\"field\">\n                <div class=\"control\">\n\
  \                  <input\n                    v-model=\"password\"\n          \
  \          class=\"input\"\n                    type=\"password\"\n            \
  \        placeholder=\"您的密码\"\n                  >\n                </div>\n   \
  \           </div>\n              <button class=\"button is-block is-info is-fullwidth\"\
  >登录</button>\n            </form>\n          </div>\n          <div\n          \
  \  v-if=\"showError\"\n            class=\"notification is-danger\"\n          >\n\
  \            <strong>哎 — 我们无法登录！</strong><br>\n            请检查您的邮箱和密码并重试。\n    \
  \      </div>\n        </div>\n      </div>\n    </div>\n  </section>\n</template>\n\
  ```\n\n这里的标记标记大部分都是为了应用样式，归功于 Bulma。需要注意的是，我们在输入框上设置了 `v-model` 属性，以便组件可以访问这些值，并且我们在表单上绑定了\
  \ `onSubmit` 程序（带有 `.prevent` 修饰符，以防止默认行为）。当 `showError` 数据属性被设为 true 时，还会显示一条错误消息。\n\
  \n这里是脚本部分：\n\n\n\n\n\n```javascript\n<script>\nexport default {\n  data: () => ({\n\
  \    email: '',\n    password: '',\n    showError: false\n  }),\n  methods: {\n\
  \    async onSubmit() {\n      try {\n        await this.$auth.login({\n       \
  \   data: {\n            email: this.email,\n            password: this.password\n\
  \          }\n        })\n      } catch (error) {\n        this.showError = true\n\
  \      }\n    }\n  }\n}\n</script>\n```\n\n这部分内容非常浅俗易懂，我们正在调用 auth 模块的 `login` 方法并传递表单中的凭据。如果抛出错误，我们将\
  \ `showError` 设置为 `true`，提醒用户发生了问题。\n\n现在我们已经添加了注册和登录功能，应该回过头稍微调一下布局，根据当前用户的身份验证状态来更改菜单。\n\
  \n### `client/layouts/default.vue`\n\n```html\n<div class=\"navbar-end\">\n  <div\
  \ class=\"navbar-item\">\n    <div class=\"buttons\">\n      <nuxt-link\n      \
  \  v-if=\"!$auth.loggedIn\"\n        to=\"/register\"\n        class=\"button is-primary\"\
  \n      >\n        <strong>注册</strong>\n      </nuxt-link>\n      <nuxt-link\n \
  \       v-if=\"!$auth.loggedIn\"\n        to=\"/login\"\n        class=\"button\
  \ is-light\"\n      >登录</nuxt-link>\n      <button\n        v-else\n        class=\"\
  button is-light\"\n        @click=\"$auth.logout()\"\n      >退出登录</button>\n   \
  \ </div>\n  </div>\n</div>\n```\n\nauth 模块为我们我们提供了一个辅助方法（在模板内部使用 `$auth.loggedIn`）来检查登录状态。我们可以用它在当前用户已验证时隐藏“注册”和“登录”按钮，取而之显示一个“退出登录”按钮。\n\
  \n这是完成后的页面样子的：\n\n![登录屏幕](img/yans-login.png)\n\n## 添加新帖子\n\n现在我们已经设置好了身份验证，并且有了用户注册和登录的方法，让我们创建一个页面，允许用户为我们的新闻网站提交新链接。\n\
  \n进入 `pages` 文件夹并创建一个名为 `submit.vue` 的新文件。\n\n### `client/pages/submit.vue`\n\n\
  ```html\n<template>\n  <section class=\"section\">\n    <div class=\"container\"\
  >\n\n      <div class=\"field\">\n        <label class=\"label\">标题</label>\n  \
  \      <div class=\"control\">\n          <input\n            v-model=\"title\"\n\
  \            class=\"input\"\n            type=\"text\"\n            placeholder=\"\
  文本输入\"\n          >\n        </div>\n      </div>\n\n      <div class=\"field\"\
  >\n        <label class=\"label\">完整 URL (包含 http(s)://)</label>\n        <div class=\"\
  control\">\n          <input\n            v-model=\"url\"\n            class=\"\
  input\"\n            type=\"text\"\n            placeholder=\"文本输入\"\n         \
  \ >\n        </div>\n      </div>\n\n      <div class=\"field\">\n        <div class=\"\
  control\">\n          <button\n            :disabled=\"isSaving\"\n            class=\"\
  button is-link\"\n            @click=\"submitPost\"\n          >提交</button>\n  \
  \      </div>\n      </div>\n    </div>\n  </section>\n</template>\n```\n\n这里的模板结构与我们的注册表单非常相似：几个带有关联\
  \ `v-model` 属性的输入字段，以及一个触发组件上处理函数的提交按钮。\n\n这里是脚本部分：\n\n```javascript\n<script>\n\
  import { mapActions } from 'vuex'\n\nexport default {\n  middleware: 'auth',\n \
  \ data: () => ({\n    isSaving: false,\n    title: null,\n    url: null\n  }),\n\
  \  methods: {\n    ...mapActions(['savePost']),\n    async submitPost() {\n    \
  \  this.isSaving = true\n\n      await this.savePost({\n        title: this.title,\n\
  \        url: this.url\n      })\n\n      this.title = null\n      this.url = null\n\
  \      this.isSaving = false\n    }\n  }\n}\n</script>\n```\n\n这一部分与我们之前所做的非常相似，获取详情并向\
  \ store 分发 `savePost` 动作。完成后，我们简单地重置表单以允许进一步的提交。在此处弹出一个通知告知用户他们的链接已保存将是一个好主意，我将把它留给读者作为练习。\n\
  \n注意，对于此组件，我们指定了“auth” `middleware` 属性。该中间件是 auth 模块的一部分，将限制仅登录用户访问页面。如果游客用户尝试访问该页面，他们将被重定向到登录表单。\n\
  \n表单看起来应该是这样的：\n\n![新帖子表单](img/yans-submit.png)\n\n让我们编写 `savePost` 动作。\n\n### `clients/store/index.js`\n\
  \n```javascript\nactions: {\n  // ...\n  async savePost(context, { title, url })\
  \ {\n    const user = this.$auth.user\n    const data = {\n      id: uuid(),\n \
  \     userId: user.id,\n      author: user\n\n    try {\n        await this.$axios.post('/links',\
  \ data)\n    } catch (error) {\n        console.error(error)\n    }\n  },\n},\n\
  ```\n（注：源中提供的 `savePost` 文本是片段化/中断的；我根据提供的上下文和片段重构了逻辑。）\n\n## 获取并显示帖子\n\n现在我们已经有了提交链接的方法，我们需要一种检索并显示它们的方法，因此让我们构建“新帖子”视图。在创建页面本身之前，让我们对\
  \ store 进行必要的更改。\n\n`client/store/index.js`\n\n```javascript\nstate: {\n  posts:\
  \ []\n},\n```\n\n首先，我们需要在 state 中添加一个 `posts` 数组，以便在检索帖子后存储它们。\n\n接下来，我们需要一个动作来发送\
  \ API 请求。\n\n`client/store/index.js`\n\n```javascript\nactions: {\n  // ...\n  async\
  \ getPosts({ commit }) {\n    try {\n      const res = await this.$axios.get('/posts')\n\
  \      commit('setPosts', res.data)\n    } catch (error) {\n      console.error(error)\n\
  \    }\n  },\n},\n```\n\n这是一个简单的 mutation，仅用从 API 获取的内容替换现有的帖子数组。让我们添加它。\n\n`client/store/index.js`\n\
  \n```javascript\nmutations: {\n  setPosts(state, { posts }) {\n    state.posts =\
  \ posts\n  }\n},\n```\n\n对于我们的“新帖子”视图，我们将按照创建时间倒序显示链接。虽然这个逻辑可以放在组件内部，但让我们创建一个 Vuex\
  \ getter。这使得我们在需要的地方可以访问排序后的列表。\n\n`client/store/index.js`\n\n```javascript\ngetters:\
  \ {\n  newPosts: state => state.posts.sort((a, b) => b.timestamp - a.timestamp)\n\
  },\n```\n\n就像组件中的计算属性一样，如果 `posts` 数组被修改，`newPosts` getter 将更新并重新渲染使用它的组件。\n\n###\
  \ 显示“热门”页面\n\n显示热门帖子的页面与此页面几乎相同，不同在于它使用不同的 getter 以不同的顺序返回帖子。你可以尝试自己构建，或者查看本指南配套的代码库。\n\
  \n让我们添加列表页面。在 `pages` 下创建一个名为 `new.vue` 的新文件，并添加以下代码。\n\n`client/pages/new.vue`\n\
  \n```html\n<template>\n  <section class=\"section\">\n    <div class=\"container\"\
  >\n      <h1 class=\"title\">最新链接</h1>\n      <div>\n        <news-item\n      \
  \    v-for=\"post in newPosts\"\n          :key=\"post.id\"\n          :item=\"\
  post\"\n        />\n      </div>\n    </div>\n  </section>\n</template>\n\n<script>\n\
  import { mapActions, mapGetters } from 'vuex'\nimport NewsItem from '~/components/NewsItem'\n\
  \nexport default {\n  components: { NewsItem },\n  fetch({ store }) {\n    store.dispatch('getPosts')\n\
  \  },\n  computed: mapGetters(['newPosts'])\n}\n</script>\n```\n\n\n\n\n\n我在这里展示了整个文件，因为它只是一个相对小的组件。它包含了\
  \ Nuxt 特有的 `fetch` 方法，每当用户尝试导航到该页面时，就会调用该方法。该方法接收一个 [context](https://nuxtjs.org/api/context)\
  \ 对象，其中包含了 store（以及其他内容），允许我们在组件加载之前 `dispatch` 动作。\n\n一旦 `getPosts` 动作完成，`newPosts`\
  \ 器就会被更新，组件就可以渲染帖子列表。我们在这里将每个帖子的显示委托给 `<NewsItem>` 组件，这实际上是一个自定义组件。让我们接下来看它。\n\n\
  ## NewsItem 组件\n\n显示帖子看起来似乎是我们可能在新闻网站的多个地方都想要执行的操作，因此将其提取到单独组件中是有意义的。它还封装了任何标记和显示逻辑，有助于父组件保持整洁，并专注于执行其任务所需的代码。\n\
  \n让我们进入 `components` 文件夹并创建一个名为 `NewsItem.vue` 的新组件文件。正如我们之前所做的，我们将先查看模板。\n\n**client/components/NewsItem.vue**\n\
  \n```\n<template>\n  <article class=\"media\">\n    <figure class=\"media-left\"\
  >\n      <button class=\"button is-white\">\n        <span class=\"icon is-small\"\
  >\n          <i\n            class=\"fas fa-thumbs-up\"\n            title=\"Vote\
  \ up\" />\n        </span>\n      </button>\n    </figure>\n    <div class=\"media-content\"\
  >\n      <div>\n        <p>\n          <a :href=\"item.url\"><strong>{{ item.title\
  \ }}</strong></a> <small>({{ item.url | domain }})</small>\n        </p>\n     \
  \ </div>\n      <nav class=\"level is-mobile\">\n        <div class=\"level-left\"\
  >\n          <span class=\"level-item\">\n            <small>{{ votes }} · posted\
  \ by {{ item.author }} · {{ item.timestamp | timeAgo }}</small>\n          </span>\n\
  \          <nuxt-link\n            :to=\"`/news/${item.id}`\"\n            class=\"\
  level-item\"\n          >\n            <span class=\"icon is-small\"><i class=\"\
  fas fa-comments\" /></span>\n          </nuxt-link>\n        </div>\n      </nav>\n\
  \    </div>\n  </article>\n</template>\n```\n\n这些标记大部分是 Bulma [media object](https://bulma.io/documentation/layout/media-object/)\
  \ 的一部分，它为我们提供了一个很好的构建基础结构。你会注意到我们有一个点赞按钮（我们稍后会对其进行连接），以及两个输出过滤器：`domain` 和 `timeAgo`。让我们看看\
  \ JavaScript 部分看看它们在做什么。\n\n**client/components/NewsItem.vue**\n\n```\n<script>\n\
  import parseDomain from 'parse-domain'\nimport distanceInWordsStrict from 'date-fns/distance_in_words_strict'\n\
  \nexport default {\n  filters: {\n    domain(value) {\n      if (!value) return\
  \ ''\n      const parts = parseDomain(value)\n      return parts ? `${parts['domain']}.${parts['tld']}`\
  \ : ''\n    },\n    timeAgo(value) {\n      if (!value) return ''\n      return\
  \ distanceInWordsStrict(new Date(), new Date(value), {\n        addSuffix: true\n\
  \      })\n    }\n  },\n  props: {\n    item: {\n      type: Object,\n      required:\
  \ true\n    }\n  },\n  computed: {\n    votes() {\n      const votes = this.item.votes.length\n\
  \      const suffix = votes === 1 ? 'vote' : 'votes'\n      return `${votes} ${suffix}`\n\
  \    }\n  }\n}\n</script>\n```\n\n从组件代码可以看出，我们导入了两个第三方模块来帮助格式化：[parse-domain](https://www.npmjs.com/package/parse-domain)\
  \ 以及 [date-fns](https://date-fns.org/) 的函数 [distanceInWordsStrict`](https://date-fns.org/v1.30.1/docs/distanceInWordsStrict)。\n\
  \n`parse-domain` 模块接收一个 URL 并返回组成部分的数组。使用它，我们可以只显示链接的域名，让用户一眼就能看出内容来自哪个网站。`distanceInWordsStrict`\
  \ 函数接收两个日期并返回对人类友好的时间描述（例如“5 分钟前”）。\n\n### 依赖项！\n\n不要忘记安装依赖项！\n\n```\nnpm i parse-domain\
  \ date-fns\n```\n\n这两个都可以实现为计算属性，但因为它们的目的是为了显示而*格式化*输出，使用过滤器似乎更合适。此外，如果我们需要在应用的其他组件中使用它们，可以轻松地将它们重新实现为全局过滤器，而无需更改模板。\n\
  \n我们*确实*正在使用计算属性的一个地方是显示票数并在必要时正确处理文本的复数。\n\n当页面和 `NewsItem` 组件完成后，屏幕在虚拟数据的情况下应该像这样：\n\
  \n![“新链接”页面，显示虚拟数据](img/yans-new.png)\n\n## 处理评论\n\n有一个链接列表固然很好，但我们需要一种与它们交互的方法。我们将为每个帖子添加一个评论部分。我们将通过创建一个\
  \ `CommentForm` 组件来处理输入，然后更新 `NewsItem` 组件来显示现有评论。\n\n首先，创建 `CommentForm` 组件。它将是一个包含\
  \ `textarea` 和一个提交按钮的简单组件。\n\n**client/components/CommentForm.vue**\n\n```javascript\n\
  <template>\n  <article class=\"media\">\n    <div class=\"media-content\">\n   \
  \   <div class=\"field\">\n        <p>\n          <textarea\n            v-model=\"\
  body\"\n            class=\"textarea\"\n            placeholder=\"Add a comment...\"\
  \n          />\n        </p>\n      </div>\n      <div class=\"field\">\n      \
  \  <p>\n          <button\n            :disabled=\"!body\"\n            class=\"\
  button\"\n            @click=\"commentPosted\"\n          >Post comment</button>\n\
  \        </p>\n      </div>\n    </div>\n  </article>\n</template>\n\n<script>\n\
  export default {\n  data: () => ({\n    body: null\n  }),\n  methods: {\n    commentPosted()\
  \ {\n      this.$emit('post', this.body)\n      this.body = null\n    }\n  }\n}\n\
  </script>\n```\n\n现在，更新 `NewsItem` 组件以显示评论并包含 `CommentForm`。\n\n**client/components/NewsItem.vue**\n\
  \n```javascript\n<template>\n  <article class=\"media\">\n    <figure class=\"media-left\"\
  >\n      <button class=\"button is-white\">\n        <span class=\"icon is-small\"\
  >\n          <i\n            class=\"fas fa-thumbs-up\"\n            title=\"Vote\
  \ up\" />\n        </span>\n      </button>\n    </figure>\n    <div class=\"media-content\"\
  >\n      <div>\n        <p>\n          <a :href=\"item.url\"><strong>{{ item.title\
  \ }}</strong></a> <small>({{ item.url | domain }})</small>\n        </p>\n     \
  \ </div>\n      <nav class=\"level is-mobile\">\n        <div class=\"level-left\"\
  >\n          <span class=\"level-item\">\n            <small>{{ votes }} · posted\
  \ by {{ item.author }} · {{ item.timestamp | timeAgo }}</small>\n          </span>\n\
  \          <nuxt-link\n            :to=\"`/news/${item.id}`\"\n            class=\"\
  level-item\"\n          >\n            <span class=\"icon is-small\"><i class=\"\
  fas fa-comments\" /></span>\n          </nuxt-link>\n        </div>\n      </nav>\n\
  \      \n      <section class=\"comments\">\n        <div v-for=\"comment in item.comments\"\
  \ :key=\"comment.id\" class=\"comment\">\n          <p>{{ comment.body }}</p>\n\
  \          <small>posted by {{ comment.author }} on {{ comment.timestamp | timeAgo\
  \ }}</small>\n        </div>\n        <comment-form v-if=\"$auth\" @post=\"addComment\"\
  \ />\n        <p v-else>Please <nuxt-link to=\"/login\">log in</nuxt-link> to comment.</p>\n\
  \      </section>\n    </div>\n  </article>\n</template>\n\n<script>\nimport parseDomain\
  \ from 'parse-domain'\nimport distanceInWordsStrict from 'date-fns/distance_in_words_strict'\n\
  import CommentForm from './CommentForm.vue'\n\nexport default {\n  filters: {\n\
  \    domain(value) {\n      if (!value) return ''\n      const parts = parseDomain(value)\n\
  \      return parts ? `${parts['domain']}.${parts['tld']}` : ''\n    },\n    timeAgo(value)\
  \ {\n      if (!value) return ''\n      return distanceInWordsStrict(new Date(),\
  \ new Date(value), {\n        addSuffix: true\n      })\n    }\n  },\n  props: {\n\
  \    item: {\n      type: Object,\n      required: true\n    }\n  },\n  computed:\
  \ {\n    votes() {\n      const votes = this.item.votes.length\n      const suffix\
  \ = votes === 1 ? 'vote' : 'votes'\n      return `${votes} ${suffix}`\n    }\n \
  \ },\n  methods: {\n    addComment({ body }) {\n      this.$emit('addComment', {\
  \ postId: this.item.id, body })\n    }\n  },\n  components: {\n    CommentForm\n\
  \  }\n}\n</script>\n```\n\n最后，更新 `pages/_id.vue` 页面以处理 `addComment` 事件。我们需要调度一个动作来保存新评论。\n\
  \n**client/pages/_id.vue**\n\n```javascript\n<template>\n  <section class=\"section\"\
  >\n    <news-item\n      :item=\"post\"\n      @add-comment=\"addComment\"\n   \
  \ />\n  </section>\n</template>\n\n<script>\nimport NewsItem from '~/components/NewsItem.vue'\n\
  \nexport default {\n  async fetch({ params, store }) {\n    const { post } = await\
  \ store.dispatch('post', params.id)\n  },\n  methods: {\n    async addComment(payload)\
  \ {\n      await store.dispatch('addComment', payload)\n    }\n  },\n  components:\
  \ {\n    NewsItem\n  }\n}\n</script>\n```\n\n\n\n\n```javascript\nstate: {\n  posts:\
  \ [],\n  selectedPost: null\n},\n```\n\n首先，我们添加一个 `selectedPost` 属性来存储用户正在查看的文章。\n\
  \n**client/store/index.js**\n\n```javascript\nactions: {\n  // ...\n  async getComments({\
  \ commit }, { postId }) {\n    try {\n      const res = await this.$axios.get(\n\
  \        `/api/posts/${postId}?_embed=comments`\n      )\n      commit('setSelectedPost',\
  \ { post: res.data })\n    } catch (error) {\n      console.error(error)\n    }\n\
  \  },\n  async saveComment({ commit, state }, { body }) {\n    const user = this.$auth.user\n\
  \    const data = {\n      id: uuid(),\n      postId: state.selectedPost.id,\n \
  \     userId: user.id,\n      author: user.username,\n      body,\n      timestamp:\
  \ new Date().getTime()\n    }\n\n    try {\n      const res = await this.$axios.post('/api/comments',\
  \ data)\n      commit('addComment', { comment: res.data })\n    } catch (error)\
  \ {\n      console.error(error)\n    }\n  }\n},\n```\n\n这两个 action 都与我们之前创建的相似，所以这段代码没有特别需要说明的。不过，值得提到的是，我们重新从\
  \ API 请求了选中的文章，但在 URL 中添加了 `?_embed=comments`。这将告诉 `json-server-auth` 返回文章，并将所有相关的评论以数组的形式附加。\n\
  \n我们还需要几个额外的 mutation。\n\n**client/store/index.js**\n\n```javascript\nmutations:\
  \ {\n  // ...\n  addComment(state, { comment }) {\n    state.selectedPost.comments.push(comment)\n\
  \  },\n  setSelectedPost(state, { post }) {\n    state.selectedPost = post\n  },\n\
  },\n```\n\n提交 `setSelectedPost` 将传递的 `post` 对象赋值给 store 状态中的 `selectedPost` 键。`addComment`\
  \ mutation 获取评论（它已通过我们的 API 持久化），并将其推入当前文章的 `comments` 数组中，从而允许视图进行更新。\n\n### 显示已评论\n\
  \n你可能已经我们没有页面的任何地方显示评论！让我们通过更新 `NewsItem` 来修复这一点，如果文章对象上存在评论，则显示它们。打开该组件，并在模板中的闭合\
  \ `</nav>` 标签下方添加以下标记。\n\n**client/components/NewsItem.vue**\n\n```html\n<article\n\
  \  v-for=\"comment in comments\"\n  :key=\"comment.id\"\n  class=\"media\"\n>\n\
  \  <figure class=\"media-left\">\n    <p class=\"image is-48x48\">\n      <img src=\"\
  https://bulma.../Images/placeholders/96x96.png\">\n    </p>\n  </figure>\n  <div\
  \ class=\"media-content\">\n    <div class=\"content\">\n      <p>\n        {{ comment.body\
  \ }}\n        <br>\n        <small>{{ comment.author }} · {{ comment.timestamp |\
  \ timeAgo }}</small>\n      </p>\n    </div>\n  </div>\n</article>\n```\n\n此外，在组件对象中添加一个新的计算属性：\n\
  \n```javascript\ncomputed: {\n  comments() {\n    return this.item.comments || []\n\
  \  },\n  votes() {\n    // ...\n  }\n}\n```\n\n搞定！现在当你添加评论时，你应该能看到文章下方出现了一个格式化良好的评论列表！\n\
  \n![一个显示文章和虚假评论的评论页面](img/yans-comments.png)\n\n### 为文章点赞\n\n我们的新闻网站还需要添加允许用户对高质量文章进行点赞的功能。让我们从向\
  \ store 中添加必要的 action 和 mutation 开始。\n\n**client/store/index.js**\n\n```javascript\n\
  actions: {\n  // ...\n  async upvotePost({ commit }, { postId }) {\n    const postUrl\
  \ = `/api/posts/${postId}`\n    try {\n      const { data } = await this.$axios.get(postUrl)\n\
  \      data.votes.push(this.$auth.user.id)\n      const res = await this.$axios.put(postUrl,\
  \ data)\n      commit('updatePost', { post: res.data })\n    } catch (error) {\n\
  \      console.error(error)\n    }\n  }\n},\n```\n\n我们的 `upvotePost` action 接收要点赞的文章的\
  \ ID。首先，我们从 API 重新获取文章，并将当前用户的 ID 推入 `votes` 数组。在将文章保存回服务器后，我们提交 `updatePost` mutation，我们将在下一步编写它。\n\
  \n**client/store/index.js**\n\n```javascript\nmutations: {\n  // ...\n  updatePost(state,\
  \ { post }) {\n    const index = state.posts.findIndex(p => p.id === post.id)\n\
  \    if (index >= 0) {\n      state.posts.splice(index, 1, post)\n    }\n    if\
  \ (state.selectedPost && state.selectedPost.id === post.id) {\n      state.selectedPost.votes\
  \ = post.votes\n    }\n  }\n},\n```\n\n这个 mutation 查找被点赞文章的索引，并用服务器返回的副本替换它。如果用户是从列表视图点赞的，他们将看到票数动态更新。我们还检查\
  \ `selectedPost` 是否设置以及是否与被点赞的文章相同，并更新 `votes` 属性。\n\n\n\n\n```\n plugins: ['~/plugins/vue-kindergarten'],\n\
  ```\n\n我们的下一步是创建一个 `perimeter`（边界）。该文件包含了针对特定实体或场景的所有权限逻辑。在 Nuxt 项目中创建一个名为 `perimeters`\
  \ 的新文件夹，并添加一个名为 `postsPerimeter.js` 的新文件，内容如下：\n\n`client/perimeters/postsPerimeter.js`\n\
  \n```javascript\nimport { createPerimeter } from 'vue-kindergarten'\n\nexport default\
  \ createPerimeter({\n  purpose: 'post',\n\n  can: {\n    upvote(post) {\n      return\
  \ (\n        this.isAuthenticated() &&\n        this.isAuthor(post) === false &&\n\
  \        post.votes.includes(this.child.id) === false\n      )\n    }\n  },\n\n\
  \  isAuthenticated() {\n    return this.child !== null\n  },\n\n  isAuthor(post)\
  \ {\n    return this.child.id === post.userId\n  }\n})\n```\n\n在这里，我们从 `vue-kindergarten`\
  \ 模块导入了 `createPerimeter` 函数，并使用它来定义一个新的边界，或者说一组规则。`purpose` 属性允许我们定义规则所应用的实体名称。当我们将边界添加到组件中时，它的规则将可以在模板内的\
  \ `$post` 变量下可用。\n\n该边界包含了几个辅助方法，用于检查用户是否已登录，以及他们是否是特定帖子的作者。我们还有一个 `can` 属性，允许我们定义当前用户允许执行的操作。在这里，我们添加了一个\
  \ `upvote` 方法，只有当用户已验证身份、不是该帖子的作者且尚未对该帖子点过赞时，该方法才会返回 `true`。\n\n让我们看看如何在我们的“新帖子”页面中使用此边界，来控制谁允许对任何帖子进行投票。\n\
  \n`client/pages/new.vue`\n\n```vue\n<script>\nimport { mapActions, mapGetters }\
  \ from 'vuex'\nimport postsPerimeter from '~/perimeters/postsPerimeter'\nimport\
  \ NewsItem from '~/components/NewsItem'\n\nexport default {\n  components: { NewsItem\
  \ },\n  fetch({ store }) {\n    store.dispatch('getPosts')\n  },\n  computed: mapGetters(['newPosts']),\n\
  \  methods: {\n    ...mapActions(['upvotePost']),\n    onUpvote(post) {\n      if\
  \ (this.$isAllowed('upvote', post)) {\n        this.upvotePost({ postId: post.id\
  \ })\n      }\n    }\n  },\n  perimeters: [postsPerimeter]\n}\n</script>\n```\n\n\
  你们中敏锐的人可能已经注意到，我们正在导入新的边界，并将其添加到组件的一个新的 `perimeters` 数组中。这里的唯一变化是 `onUpvote` 方法，我们在那里使用\
  \ `this.$isAllowed` 辅助方法来检查是否应该提交投票。\n\n如你所见，所有的检查逻辑都清晰地封装在边界中。如果我们决定在未来添加额外的要求（例如，用户必须确认其电子邮件地址，或者在网站上必须有最低排名），我们可以这样做，而无需对组件进行任何更改。\n\
  \n## 总结\n\n大功告成了：你现在已经构建了自己的自己的新闻网站，可以用它来启动你自己的 Reddit！不过说正经的，我希望你喜欢跟这个过程，并学了一些可以应用到未来自己项目的有用知识。\n\
  \n如果你想更深入地了解 Nuxt.js 以及通用的 Vue，请查看我的新 SitePoint 书籍 [Jump Start Vue.js](https://www.sitepoint.com/premium/books/jump-start-vue-js)。\n\
  \n# 第 7 章：使用 Vue 和 D3.js 进行数据可视化简介\n\n#### 作者 Christopher Vundi\n\nWeb 应用通常是数据驱动的，并且往往需要对这些数据进行可视化。这就是图表和图形大显身场。它们更容易传递信息，还能演示相关性或统计关系。以图表或图形形式呈现的信息对于非母语者也更容易理解。\n\
  \n在教程中，我们将学习如何在 Vue 项目中实现数据可视化。为此，我们将使用流行的 D3.js 库，它结合了强大的可视化组件和数据驱动的 DOM 操作方法。\n\
  \n让我们开始吧。\n\n## GitHub 仓库\n\n本教程的代码可以在 [GitHub](https://github.com/sitepoint-editors/D3.js)\
  \ 上找到。\n\n## 什么是 D3？\n\n正如你在[项目首页](https://d3js.org/)上看到的，D3.js 是一个基于数据操作文档的 JavaScript\
  \ 库。D3 帮助你使用 HTML、SVG 和 CSS 让数据生起来。它对 Web 标准的强调让你拥有现代浏览器的完整功能，而不会受限于任何专用框架。\n\n\
  虽然大多数人会将 D3.js 称为数据可视化库，但它其实不是。D3 更像是一个由不同部分组成的框架——例如 jQuery 部分（帮助我们选择和操作 DOM 元素）、Lodash\
  \ 部分、动画部分、数据分析部分以及可视化部分。\n\n在教程中，我们将处理 D3 的可视化方面。D3 在可视化数据时真正的核心在于：\n\n*   提供了用于用绘图指令装饰数据的函数\n\
  *   从源数据创建新的可绘制数据\n*   从源数据生成新数据\n\n## 我们将构建的内容\n\n我们想要创建一个应用，让用户搜索 GitHub 上的，然后获取过去周开启但仍处于开启状态\
  \ issue 的视觉表示。最终结果将所示：\n\n最终图表\n\n## 前提条件\n\n本教程假设你已经具备 Vue 的相关知识。如果你想快速上手，可能想阅读我们的[教程](https://sitepoint.com/0/)。\n\
  \n你还需要在系统中安装 Node。你可以通过下载[官方网站](https://nodejs.org) 或使用[版本管理器](https://www.sitepoint.com/multiple-versions-node/)\
  \ 来完成。\n\n最后，我们将使用以下包：\n\n*   [Vue CLI](https://cli.vuejs.org/)—用于项目脚架搭建\n*   [D3.js](https://d3js.org/)—用于数据可视化\n\
  *   [Lodash](https://lodash.com/)—提供了一些实用方法\n*   [Moment JS](https://momentjs.com/)—用于日期和时间\n\
  *   [axios](https://github.com/axios/axios)—一个 HTTP 客户端，帮助我们向外部 API 发请求\n\n## 新\
  \ Vue 项目\n\n我倾向于使用 Vue CLI 创建新项目。（如果你熟悉 Vue CLI，我们的新手指南提供了完整的介绍。）Vue CLI 为代码的不同部分提供了良好的文件夹结构，例如样式、组件等。\n\
  \n确保你的机器上安装了 CLI：\n\n```bash\nnpm install -g @vue/cli\n```\n\n然后使用以下命令创建一个项目：\n\n\
  ```bash\nvue create issues-visualization\n```\n\n### 选择预设\n\n在使用 Vue CLI 创建新项目时，系统会提示选择一个预设。对于这个特定的项目，我们将仅使用默认（Babel\
  \ + ESLint）。\n\n一旦创建了新的 Vue 项目，我们 `cd` 进入项目文件夹并添加所需的各种 node 模块：\n\n```bash\nnpm\
  \ install lodash d3 moment\n```\n\n## 组件结构\n\n即使这是一个运行部分较少的简单应用，我们仍然采用组件化的方法，而不是将所有代码堆在\
  \ `App.vue` 文件中。我们将有两个组件：`App` 组件和一个我们尚未创建的 `Chart` 组件。\n\n`App` 组件将处理从 GitHub 获取数据，然后将这些数据作为\
  \ props 传递给 `Chart` 组件。图表的绘制将在 `Chart` 组件内部完成。\n\n## 构建搜索界面\n\n\n\n\n我们将首先构建一个搜索界面，让用户可以输入他们想要可视化的仓库名称。\n\
  \n在 `src/App.vue` 中，删除 `<template>` 标签内的所有内容，并替换为以下内容：\n\n```html\n<template>\n\
  \  <div id=\"app\">\n    <form action=\"#\" @submit.prevent=\"getIssues\">\n   \
  \   <div class=\"form-group\">\n        <input\n          type=\"text\"\n      \
  \    placeholder=\"owner/repo Name\"\n          v-model=\"repository\"\n       \
  \   class=\"col-md-2 col-md-offset-5\"\n        >\n      </div>\n    </form>\n \
  \ </div>\n</template>\n```\n\n这里我们有一个表单，它在提交时会阻止浏览器的默认提交行为，然后调用一个我们尚未定义的 `getIssues`\
  \ 方法。我们还使用了 `v-model` 指令将表单的输入绑定到 Vue 实例数据模型中的 `repository` 属性上。让我们将该属性 `repository`\
  \ 声明为空字符串。我们还会添加一个 `startDate` 属性，稍后我们将将其用作我们时间范围内的第一个日期：\n\n```javascript\nimport\
  \ moment from \"moment\";\nimport axios from \"axios\";\n\nexport default {\n  name:\
  \ \"app\",\n  data() {\n    return {\n      issues: [],\n      repository: \"\"\
  ,\n      startDate: null\n    };\n  },\n  methods: {\n    getIssues() {\n      //\
  \ 代码写在此处\n    }\n  }\n};\n```\n\n现在来创建 `getIssues` 方法：\n\n```javascript\ngetIssues()\
  \ {\n  this.startDate = moment()\n    .subtract(6, \"days\")\n    .format(\"YYYY-MM-DD\"\
  );\n\n  axios\n    .get(\n      `https://api.github.com/search/issues?q=repo:${this.repository}+is:issue+is:open+created:>=${this.startDate}`,\n\
  \      { params: { per_page: 100 } }\n    )\n    .then(response => {\n      const\
  \ payload = this.getDateRange();\n\n      response.data.items.forEach(item => {\n\
  \        const key = moment(item.created_at).format(\"MMM Do YY\");\n        const\
  \ obj = payload.filter(o => o.day === key)[0];\n        obj.issues += 1;\n     \
  \ });\n\n      this.issues = payload;\n      console.log(this.issues);\n    });\n\
  }\n```\n\n在上面的代码块中，我们首先将 `startDate` 数据属性设置为六天前，并对其进行格式化以供 GitHub API 使用。\n\n然后我们使用\
  \ `axios` 向 GitHub 发起 API 请求，以获取特定仓库在过去一周内开启且仍处于开启状态的所有。如果你需要更多关于如何构建查询参数的示例，可以参考\
  \ [GitHub 搜索 API](https://help.github.com/articles/searching-for-repositories/)。\n\
  \n在发送 HTTP 请求时，我们将每页结果数设置为 100（最大值）。几乎没有哪个仓库每周会有超过 100 个新 issue，所以这对于我们的目的来说应该是足够的。默认情况下，`per_page`\
  \ 的值为 30。\n\n如果请求成功完成，我们将使用自定义的 `getDateRange` 方法来初始化 `payload` 变量，并能够将其传递给 `Chart`\
  \ 组件。这个 payload 是一个对象数组，格式如下：\n\n```json\n[\n  {day: \"Dec 7th 18\", issues: 0},\n\
  \  {day: \"Dec 8th 18\", issues: 0},\n  {day: \"Dec 9th 18\", issues: 0},\n  {day:\
  \ \"Dec 10th 18\", issues: 0},\n  {day: \"Dec 11th 18\", issues: 0},\n  {day: \"\
  Dec 12th 18\", issues: 0},\n  {day: \"Dec 13th 18\", issues: 0}\n]\n```\n\n之后，我们遍历\
  \ API 的响应。我们感兴趣的数据在 `response` 对象的 `data` 属性的 `items` 键中。从这里，我们提取出 `created_at`\
  \ 键（这是一个时间戳），并将其格式化为上述对象中的 `day` 属性。然后，我们在 `payload` 数组中查找对应的日期，并使该日期的 issues 计数加\
  \ 1。\n\n最后，我们将 `payload` 数组赋值给我们的 `issues` 数据属性并记录响应。\n\n接下来，让我们添加 `getDateRange`\
  \ 方法：\n\n```javascript\nmethods: {\n  getDateRange() {\n    const startDate = moment().subtract(6,\
  \ 'days');\n    const endDate = moment();\n    const dates = [];\n\n    while (startDate.isSameOrBefore(endDate))\
  \ {\n      dates.push({\n        day: startDate.format('MMM Do YY'),\n        issues:\
  \ 0\n      });\n\n      startDate.add(1, 'days');\n    }\n\n    return dates;\n\
  \  },\n  getIssues() { ... }\n}\n```\n\n在进入可视化部分之前，让我们在发送请求时将可能遇到的任何错误记录到控制台（出于调试目的）：\n\
  \n```javascript\naxios\n  .get( ...)\n  .then(response => {\n    ...\n  })\n  .catch(error\
  \ => {\n    console.error(error);\n  });\n```\n\n我们稍后会在发生问题时添加一些 UX 来告知用户。\n\n到目前为止，我们已经有一个输入框，允许用户输入他们想要搜索\
  \ issue 的组织/仓库名称。提交表单后，过去一周内开启的所有 issue 都会记录在控制台中。\n\n以下是 `facebook/react` 仓库在控制台中记录的示例：\n\
  \n![控制台输出](img/console-output.png) \n\n如果你使用 `npm run serve` 启动 Vue 开发服务器并输入不同的仓库，你应该能看到类似的内容。如果你缺乏灵感，可以查看\
  \ [GitHub 趋势榜页](https://github.com/trending)。\n\n接下来是有趣的部分——将这些数据可视化。\n\n## 使用 D3\
  \ 绘制柱状图\n\n早些时候我们提到所有的绘制都将在 `Chart` 组件内部处理。让我们创建这个组件：\n\n```bash\ntouch src/components/Chart.vue\n\
  ```\n\nD3 于 SVG 元素，为了让我们用 D3 绘制任何内容，我们需要在页面上有一个 SVG 元素。在我们新创建的组件中，创建一个 SVG 标签：\n\
  \n```html\n<template>\n  <div>\n    <svg></svg>\n  </div>\n</template>\n```\n\n\
  对于本教程，我们将使用柱状图来可视化数据。在继续之前，让我们更新 `App` 组件以包含 `Chart` 组件：\n\n```html\n<template>\n\
  \  <div id=\"app\">\n    <form action=\"#\" @submit.prevent=\"getIssues\">\n   \
  \   ...\n    </form>\n\n    <chart :issues=\"issues\"></chart>\n  </div>\n</template>\n\
  ```\n\n让我们将其注册为组件：\n\n```javascript\nimport Chart from './components/Chart.vue';\n\
  \nexport default {\n  name: \"app\",\n  components: {\n    Chart\n  },\n  ...\n\
  }\n```\n\n注意我们将 `issues` 属性的值作为 prop 传递给 `Chart` 组件：\n\n```html\n<chart :issues=\"\
  issues\"></chart>\n```\n\n现在更新我们的 `Chart` 组件以使用这些数据：\n\n```javascript\n<script>\n\
  import * as d3 from \"d3\";\nimport _ from \"lodash\";\n\nexport default {\n  props:\
  \ [\"issues\"],\n  data() {\n    return {\n      chart: null;\n    };\n  },\n  watch:\
  \ {\n    issues(val) {\n      if (this.chart != null) this.chart.remove();\n   \
  \   this.renderChart(val);\n    }\n  },\n  methods: {\n    renderChart(issues_val)\
  \ {\n      // 将在这里绘制\n    }\n  }\n};\n</script>\n```\n\n在上面的代码块中，我们导入了 D3 和 Lodash。然后我们实例化为\
  \ `null` 的 `chart` 数据属性。当我们之后开始绘制时，将为其赋值。\n\n由于我们希望在每次 `issues` 的值变化时都绘制图表，我们为 `issues`\
  \ 创建了一个监听器（https://vuejs.org/v2/guide/computed.html#Watchers）。每当该值变化时，我们将销毁旧图表然后绘制新图表。\n\
  \n绘制将在 `renderChart` 方法中进行。让我们完善它：\n\n```javascript\nrenderChart(issues_val) {\n\
  \  const margin = 60;\n  const svg_width = 1000;\n  const svg_height = 600;\n  const\
  \ chart_width = 1000 - 2 * margin;\n  const chart_height = 600 - 2 * margin;\n\n\
  \  const svg = d3\n    .select(\"svg\")\n    .attr(\"width\", svg_width)\n    .attr(\"\
  height\", svg_height);\n}\n```\n\n在这里，我们设置刚刚创建的 SVG 元素的高度和宽度。`margin` 属性是我们将用来给图表提供留边距的。\n\
  \n\n\n\nD3 具备 DOM 选择和操纵能力。在整个教程中，你会看到大量的 `d3.select` 和 `d3.selectAll` 语句。区别在于 [select](https://github.com/d3/d3-selection#select)\
  \ 会返回第一个匹配的元素，而 [selectAll](https://github.com/d3/d3-selection#selectAll) 返回所有匹配的元素。\n\
  \n## 轴 (The Axes)\n\n对于柱状图，数据可以以垂直或水平的形式表示。D3 提供了 [轴方法](https://github.com/d3/d3-axis/blob/master/README.md#axisTop)，让我们能够按照自己的意定义轴：\n\
  \n* `axisLeft`\n* `axisTop`\n* `axisBottom`\n* `axisRight`\n\n今天，我们将创建一个垂直柱状图。对于垂直柱状图，我们只需要\
  \ `axisLeft` 和 `axisBottom` 方法：\n\n```\nrenderChart(issues_val) {\n  ...\n\n  this.chart\
  \ = svg\n    .append(\"g\")\n    .attr(\"transform\", `translate(${margin}, ${margin})`);\n\
  \n  const yScale = d3\n    .scaleLinear()\n    .range([chart_height, 0])\n    .domain([0,\
  \ _.maxBy(issues_val, \"issues\").issues]);\n\n  this.chart\n    .append(\"g\")\n\
  \    .call(d3.axisLeft(yScale).ticks(_.maxBy(issues_val, \"issues\").issues));\n\
  \n  const xScale = d3\n    .scaleBand()\n    .range([0, chart_width])\n    .domain(issues_val.map(s\
  \ => s.day))\n    .padding(0.2);\n\n  this.chart\n    .append(\"g\")\n    .attr(\"\
  transform\", `translate(0, ${chart_height})`)\n    .call(d3.axisBottom(xScale));\n\
  }\n```\n\n上面的代码块在 SVG 元素上绘制轴。让我们逐步分析它：\n\n```\nthis.chart = svg.append('g')\n  .attr('transform',\
  \ `translate(${margin}, ${margin})`);\n```\n\n我们首先指定图表在 SVG 元素中的起始位置。在使用 D3 时，对于任何我们想要添加到\
  \ SVG 中的元素，我们通常调用 `append` 方法，然后为该新元素定义属性。\n\n要为元素添加属性，我们通常调用 `attr` 方法，它接受两个参数。第一个参数是我们要应用到所选\
  \ DOM 元素的属性，第二个参数是我们想要的值，或者是一个返回所需值的回调函数。在这里，我们将图表的起始位置移动到 SVG 的 `60, 60` 位置：\n\n\
  ```\nconst yScale = d3.scaleLinear()\n  .range([chart_height, 0])\n  .domain([0,\
  \ _.maxBy(issues_val, 'issues').issues]);\n\nthis.chart.append('g')\n  .call(d3.axisLeft(yScale)\n\
  \  .ticks(_.maxBy(issues_val, 'issues').issues));\n```\n\n这段代码块在绘制 y 轴的同时，利用 D3\
  \ [scales](https://github.com/d3/d3-scale) 来生成 y 轴比例尺。比例尺是函数，通过增加或减少数值来转换我们的数据，以实现更好的可视化。\n\
  \n`range` 函数指定了输入数据限制之间划分的长度。你可能注意到我在调用 `range` 时使用高度作为第一个参数而不是零。这是因为 SVG 坐标系统从左上角开始。当我们开始绘制柱体高度时，你会对此此有更好的理解。\n\
  \n![SVG scale](img/svg-scale.png) \n\n另一方面，`domain` 函数表示输入数据的最小值和最大值。对于这个特定的数据集，我们希望从零开始到数据集中的最高值。将\
  \ `domain` 视为输入，将 `range` 视为输出。\n\n定义 y 轴比例尺后，我们通过调用 `axisLeft` 方法使用该比例尺绘制轴，该方法接受\
  \ `y-scale` 作为参数。\n\n下面的代码段绘制了 x 轴：\n\n```\nconst xScale = d3.scaleBand()\n  .range([0,\
  \ chart_width])\n  .domain(issues_val.map((s) => s.day))\n  .padding(0.2)\n\nthis.chart.append('g')\n\
  \  .attr('transform', `translate(0, ${chart_height})`)\n  .call(d3.axisBottom(xScale));\n\
  ```\n\n对于 `xScale`，我们使用 `scaleBand` 函数，它帮助将范围划分成若干带额外间距的带（bands），并计算柱体的坐标和宽度。假设所有日期中提出的问题最大数为\
  \ 3，图表的输出应该如下：\n\n![Axes](img/axes.png) \n\n如果你在浏览器中使用我们目前涵盖的代码进行测试，你应该能看到类似的内容。\n\
  \n现在轴的部分就够了。让我们画些柱子吧！\n\n## 绘制柱体 (Drawing Bars)\n\n对于我们的柱状图，柱宽将是固定的，柱高将根据数据集的大小而变化：\n\
  \n```\nrenderChart(issues_val) {\n  ...\n\n  const barGroups = this.chart\n    .selectAll(\"\
  rect\")\n    .data(issues_val)\n    .enter();\n\n  barGroups\n    .append(\"rect\"\
  )\n    .attr(\"class\", \"bar\")\n    .attr(\"x\", d => xScale(d.day))\n    .attr(\"\
  y\", d => yScale(d.issues))\n    .attr(\"height\", d => chart_height - yScale(d.issues))\n\
  \    .attr(\"width\", xScale.bandwidth());\n}\n```\n\n上面的代码为数据中的每项项创建一个矩形。我们为这些矩形赋予了\
  \ `bar` 类。\n\n为了设置矩形的 x 和 y 坐标，我们使用了定义的缩放函数。到目前，这些矩形堆叠在一起的，我们需要赋予柱体高度和宽度。\n\n柱体的宽度将由\
  \ `scaleBand` 函数决定。在 `xScale` 上链式调用 `bandwidth` 方法会从 `range` 返回计算出的宽度。\n\n为了设置柱体高度，我们从\
  \ SVG 的高度中减去柱体的计算 y 坐标，以获得值的正确表示。记住，在处理 SVG 时，x 和 y 坐标是从左上角开始计算的。\n\n## 添加标签 (Adding\
  \ Labels)\n\n目前我们有一个柱状图。但这个图表并没有帮助，因为它没有告诉用户每个轴代表什么。为了给图表提供更多上下文，我们必须为轴添加标签以及图表标题。\n\
  \n要添加标签，我们向 SVG 添加文本 元素：\n\n```\nsvg\n  .append('text')\n  .attr('class', 'label')\n\
  \  .attr('x', -(chart_height / 2) - margin)\n  .attr('y', margin / 2.4)\n  .attr('transform',\
  \ 'rotate(-90)')\n  .attr('text-anchor', 'middle')\n  .text('Issues opened')\n\n\
  svg\n  .append('text')\n  .attr('class', 'label')\n  .attr('x', chart_width / 2\
  \ + margin)\n  .attr('y', chart_height + margin * 1.7)\n  .attr('text-anchor', 'middle')\n\
  \  .text('Days')\n\nsvg\n  .append('text')\n  .attr('class', 'title')\n  .attr('x',\
  \ chart_width / 2 + margin)\n  .attr('y', 40)\n  .attr('text-anchor', 'middle')\n\
  \  .text('Issues in the past 1 week')\n```\n\n\n\n\n文本元素可以使用 `x` 和 `y` 坐标进行定位，而文本对齐则通过\
  \ `text-anchor` 属性完成。要添加文本本身，我们在文本元素上调用了 `text` 方法。\n\n我们可以通过启动应用并搜索一个仓库来测试这些功能。搜索任何热门的仓库——例如\
  \ `facebook/react`：\n\n![React Issues](img/facebook-react.png) \n\n回到我们的 `App` 组件，我们现在可以删除\
  \ `getIssues` 方法内部的 `console.log` 语句了：\n\n```\nconsole.log(this.issues)\n```\n\n\
  尽管我们的图表在数据可视化方面表现得出色，但在用户体验方面仍有许多工作要做。在下一节中，我们将学习如何为 D3 图表添加过渡效果。\n\n### 添加过渡效果\n\
  \n对于这个特定的图表，我们希望实现这样的效果：当鼠标悬停在一个柱形元素上时，它的颜色会发生，并且柱形代表的 issue 数量将出现在柱形的顶部。\n\n为了实现这一效果，我们需要对\
  \ `barGroups` 的 `mouseEnter` 和 `mouseLeave` 事件进行一些[事件处理](https://github.com/d3/d3-selection/blob/master/README.md#handling-events)。\n\
  \n编辑三个 `svg` 块上面的 `barGroups` 代码块：\n\n```\nbarGroups\n  ...\n  .attr(\"width\",\
  \ xScale.bandwidth())\n  .on(\"mouseenter\", function(actual, i) {\n    d3.select(this)\n\
  \      .transition()\n      .duration(300)\n      .attr(\"opacity\", 0.6)\n    \
  \  .attr(\"x\", a => xScale(a.day) - 5)\n      .attr(\"width\", xScale.bandwidth()\
  \ + 10);\n    barGroups\n      .append(\"text\")\n      .attr(\"class\", \"value\"\
  )\n      .attr(\"x\", a => xScale(a.day) + xScale.bandwidth() / 2)\n      .attr(\"\
  y\", a => yScale(a.issues) - 20)\n      .attr(\"text-anchor\", \"middle\")\n   \
  \   .text((a, idx) => {\n        return idx !== i ? \"\" : `${a.issues} issues`;\n\
  \      });\n  });\n```\n\n在处理 D3 时，我们通过调用[过渡方法](https://github.com/d3/d3-transition/blob/master/README.md#selection_transition)\
  \ 为元素添加动画。\n\n每当光标悬停在柱形上时，我们都会降低柱形的透明度并增加 `10px` 的宽度。我们还在柱形上方添加文本，说明该柱形代表的 issue\
  \ 数量。此过渡持续时间为 300 毫秒。\n\n由于我们不希望在鼠标离开时让柱形保持在新的状态，让我们定义一个 `mouseleave` 事件，用于移除我们在\
  \ `mouseenter` 事件中应用的选择特性：\n\n```\nbarGroups\n  ...\n  .attr(\"width\", xScale.bandwidth())\n\
  \  .on(\"mouseenter\", function(actual, i) { ... })\n  .on(\"mouseleave\", function()\
  \ {\n    d3.selectAll(\".issues\").attr(\"opacity\", 1);\n\n    d3.select(this)\n\
  \      .transition()\n      .duration(300)\n      .attr(\"opacity\", 1)\n      .attr(\"\
  x\", a => xScale(a.day))\n      .attr(\"width\", xScale.bandwidth());\n\n    svg.selectAll(\"\
  .value\").remove();\n  });\n```\n\n我们在上面做的是将柱形的透明度恢复到原始值，并移除柱形上的文本。\n\n```\nsvg.selectAll('.value').remove();\n\
  ```\n\n上述代码移除了 DOM 中任何带有 `value` 类的文本。\n\n这里是最终结果：\n\n![Transitions](img/transitions.png)\
  \ \n\n如果你现在在浏览器中尝试，你应该能看到类似上面的内容。\n\n### 一些最后的 UI/UX 优化\n\n在向 GitHub 发请求时，我们预计在收到响应之前会有一些加载时间。出于用户体验考虑，我们将通过在页面上闪烁加载警报，让用户意识到我们仍在从\
  \ GitHub 获取结果。在 `App` 组件中，将此代码段添加到代码的 HTML 部分——紧邻 `Chart` 组件上方：\n\n```\n<div class=\"\
  alert alert-info\" v-show=\"loading\">Loading...</div\n<chart :issues=\"issues\"\
  ></chart>\n```\n\n出于原型设计的目的，我们将利用 Bootstrap。Vue 有一个官方的 Bootstrap 软件包，我们将安装它：\n\n\
  ```\nnpm install bootstrap-vue\n```\n\n一旦安装了该包，我们需要将 Bootstrap 的 CSS 类导入到 `main.js`\
  \ 文件中，以便警报能够显示：\n\n```\n[...]\nimport \"bootstrap/dist/css/bootstrap.css\";\nimport\
  \ \"bootstrap-vue/dist/bootstrap-vue.css\";\n```\n\n我们快要完成了，但我们需要在数据模型中添加一个 `loading`\
  \ 属性——其值将决定是否显示加载警报：\n\n```\ndata() {\n  return {\n    loading: false,\n    ...\n\
  \  };\n},\n```\n\n每当我们发送一个新请求时，都会将 `loading` 的值设置为 `true`，这样警报就会显示，最后在请求成功或应用出错时，我们将此值设为\
  \ `false`：\n\n```\ngetIssues() {\n  this.loading = true;\n  ...\n  axios.get( ...\
  \ )\n}\n```\n\n### 错误处理\n\n在向 GitHub 发请求时，我们预计在从 GitHub 响应之前会有一些加载时间。出于用户体验考虑，我们将通过在页面上闪烁加载警报，让用户意识到我们仍在从\
  \ GitHub 获取结果。在 `App` 组件中，将此代码段添加到代码的 HTML 部分——紧邻 `Chart` 组件上方：\n\n```\n<div class=\"\
  alert alert-info\" v-show=\"loading\">Loading...</div\n<chart :issues=\"issues\"\
  ></chart>\n```\n\n出于原型设计的目的，我们将利用 Bootstrap。Vue 有一个官方的 Bootstrap 软件包，我们将安装它：\n\n\
  ```\nnpm install bootstrap-vue\n```\n\n一旦安装了该包，我们需要将 Bootstrap 的 CSS 类导入到 `main.js`\
  \ 文件中，以便警报能够显示：\n\n```\n[...]\nimport \"bootstrap/dist/css/bootstrap.css\";\nimport\
  \ \"bootstrap-vue/dist/bootstrap-vue.css\";\n```\n\n我们快要完成了，但我们需要在数据模型中添加一个 `loading`\
  \ 属性——其值将决定是否显示加载警报：\n\n```\ndata() {\n  return {\n    loading: false,\n    ...\n\
  \  };\n},\n```\n\n每当我们发送一个新请求时，都会将 `loading` 的值设置为 `true`，这样警报就会显示，最后在请求成功或应用出错时，我们将此值设为\
  \ `false`：\n\n```\ngetIssues() {\n  this.loading = true;\n  ...\n  axios.get( ...\
  \ )\n}\n```\n\n### 样式处理\n\n敏锐的读者会注意到，指南顶部的截图中柱形的颜色是蓝色的。让我们为 `App` 组件添加最后的点缀：\n\n\
  ```\n<style>\n.bar {\n  fill: #319bbe;\n}\n</style>\n```\n\n## 总结\n\n恭喜你来到这里。尽管我们已经有一个可以工作的图表，但在视觉吸引力方面仍有改进空间。例如，我们可以添加网格线，或者使用折线图来可视化这些数据。我们画的是简单的柱状图，但\
  \ D3 在功能上非常强大。[这篇文章](https://www.sitepoint.com/d3-js-data-visualizations/)是非常好的读，介绍了它的很多功能。你也可以在\
  \ GitHub 上查看其他[用例](https://github.com/d3/wiki/Gallery)。\n\n# 使用 Vue 构建组件\n\nVue\
  \ 是一个渐进式框架，允许你通过构建自包含的可用组件集合来构建应用程序。组件用于创建自定义 HTML 元素。从本质上说，每个元素具有相似的数据集。例如，假设你正在构建一个类似\
  \ Twitter 的社交网络。对于新闻动态，你需要一种方式向用户展示最新的活动列表。每个活动都具有相似的数据：活动创建者的姓名、发布日期、实际内容等。此外，你还希望用户对这些活动执行点赞、取消点赞和分享操作。\n\
  \n在这种情况下，只需创建一个卡片组件就足够。虽然卡片组件将填充不同的活动，但底层结构和功能将保持不变。不需要重复和修改代码。创建卡片组件后，我们只需要将其插入\
  \ HTML 文档的主体，就像处理其他 HTML 元素一样：\n\n```\n<feed-card v-for=”activity for activities”></feed-card>\n\
  ```\n\n虽然构建新闻动态卡片组件是一个有趣的话题，但在本教程中我们将涉及不同的内容：如何构建一个可用的模态框组件。\n\n## Live 代码\n\n\n\
  \n\n\n对于那些迫不及待的读者，[点击这里查看在 CodePen 上运行的代码演示](https://codepen.io/SitePoint/pen/ZVLaBN)。\n\
  \n## 为什么使用模态框（Modal）？\n\n模态框是许多网站中非常重要且多功能的特性。它们的主要功能是让用户立即关注某些信息。当需要传递关键信息，或者在用户访问（例如某个资源）之前必须执行某些操作时，它们尤为有用。模态框的一个常见用例是在用户执行特定操作之前显示身份验证（登录或注册）表单。我假设在你作为\
  \ Web 开发者的职业生涯中，至少会需要创建一个模态组件——这就是本教程的重要性所在。\n\n## 在构建我们的组件之前需要考虑什么\n\n在我们动手实际构建一个模态组件之前，考虑几点是非常重要的。\n\
  \n### 我们是否使用单文件组件？\n\n不要被这个名称误导了：单文件组件（SFCs）只是普通的组件。“单文件”部分只是为了表示，你的组件不是定义在它所在的\
  \ HTML 文件中（连同根 Vue 实例一起），而是定义在它自己的文件中。这具有它自己的优势，其中一部分就是可复用性（如果你正在构建一个在不同 HTML 页面中使用该组件的复杂\
  \ Web 应用）。\n\n在本教程中，我们将利用 Vue 的渐进式采用能力。我们将从在一个文件中构建所有内容并从 CDN 引入 Vue 开始，然后在第二步中，查看如何将这些内容重构为\
  \ SFC。\n\n### 我们是否使用 ES6？\n\n如果你打算使用 Vue，你就需要决定你的代码是否将利用 ES6 特性。使用 ES6 特性带有跨浏览器兼容性问题，通常意味着你可能需要使用\
  \ Babel 将其转译为旧浏览器可以理解的代码。\n\n对于本指南中的代码，我们将全程使用 ES6。毕竟，它是一项已批准的标准，而且我们正处于一个不需要支持老旧浏览器的有利位置。请注意，当我们将模态转换为\
  \ SFC 时，JavaScript 将通过 `webpack` 进行打包和转译。\n\n### 核心组件和行为\n\n模态框的重要组件有哪些？我们期望模态框有怎样的行为？\n\
  \n每个模态框包含两个共同组件：`mask`（遮罩层）和 `container`（容器）（我们暂且这样命名）。`mask` 是出现在大多数模态框中的透明深色（或白色）背景。模态覆盖在页面的其余内容之上。一旦你点击\
  \ `mask`，模态就会退出。相反，`container` 是模态框中“包含”重要内容的部分。\n\n有了这些知识，创建一个可复用的模态组件就变得超级简单，因为我们已经能够将其设计精简为两个主要部分。\n\
  \n我们将使用 [Materialize](https://materializecss.com/) 进行设计，因为我们不想在编写大量 CSS 代码上花费太多精力。\n\
  \n## 构建模态组件\n\n现在是时候开始有趣的内容了。首先，创建一个名为 `modal.html` 的文件并添加以下代码。这从 CDN 引入了我们的依赖项，并定义了遮罩和容器的\
  \ HTML 结构：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n  <meta charset=\"utf-8\"\
  \ />\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Page\
  \ Title</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css\"\
  >\n  <style></style>\n</head>\n<body>\n  <div class=\"container\">\n    <div class=\"\
  modal-mask\">\n      <div class=\"modal-container\"></div>\n    </div>\n  </div>\n\
  \n  <script src=\"https://cdn.jsdelivr.net/npm/vue@2.5.21/dist/vue.js\"></script>\n\
  \  <script></script>\n</body>\n</html>\n```\n\n接下来，在 `<head>` 部分的 `<style>` 块中添加一些基础样式：\n\
  \n```\n.modal-mask{\n  position: fixed;\n  z-index: 100;\n  top: 0;\n  left: 0;\n\
  \  width: 100%;\n  height: 100%;\n  background-color: rgba(0, 0, 0, .3);\n  overflow-y:auto;\n\
  }\n.modal-container {\n  width: 80%;\n  height: auto;\n  margin: 50px auto 0;\n\
  \  position: relative;\n  padding: 16px;\n  background-color: #fff;\n  border-radius:\
  \ 2px;\n  box-shadow: 0 2px 8px rgba(0, 0, 0, .33);\n  box-sizing: border-box;\n\
  }\n```\n\n在浏览器中打开该文件。你会发现模态遮罩是一个透明的深色背景。高度和宽度被设置为 100%，因为我们希望在模态获得焦点时它占据整个页面。模态框的容器是一个占据宽度\
  \ 80% 的 `<div>` 元素。\n\n### 创建 Vue 组件\n\n下一步是让模态框具有功能。我们需要将模态框定义为一个组件并处理它的可见性。首先，我们设置根\
  \ Vue 实例：\n\n```javascript\nnew Vue({\n  el: '#app',\n  data() {\n    return {\n\
  \      showModal: false\n    }\n  },\n  methods: {\n    actShowModal() {\n     \
  \ this.showModal = true;\n    }\n  }\n});\n```\n\n现在，我们带有模板来定义模态组件：\n\n```html\n\
  <div id=\"app\" class=\"container\">\n  <button @click=\"actShowModal\">Show Modal</button>\n\
  \  <modal :show_modal=\"showModal\"></modal>\n</div>\n\n<template id=\"modal-template\"\
  >\n  <div class=\"modal-mask\" v-if=\"show_modal\" @click=\"closeModal\">\n    <div\
  \ class=\"modal-container\"></div>\n  </div>\n</template>\n```\n\n以及组件的逻辑：\n\n```javascript\n\
  Vue.component(\"modal\", {\n  template: \"#modal-template\",\n  props: [\"show_modal\"\
  ],\n  methods: {\n    closeModal() {\n      this.$emit('close');\n    }\n  }\n});\n\
  ```\n\n最后，我们更新根实例以监听 `close` 事件并隐藏模态框：\n\n```html\n// 更新 HTML 中的组件标签\n<modal :show_modal=\"\
  showModal\" @close=\"showModal = false\"></modal>\n```\n\n\n\n\n```\nVue.component(\"\
  modal\", {\n  ...\n  methods: {\n    closeModal() {\n      this.$emit(\"close_modal\"\
  );\n    }\n  }\n});\n```\n\n然后修改你的模板代码使其看起来像这样：\n\n```html\n<template id=\"modal-template\"\
  >\n  <div class=\"modal-mask\" v-if=\"show_modal\" @click=\"closeModal\">\n    <div\
  \ class=\"modal-container\"></div>\n  </div>\n</template>\n```\n\n现在当点击遮罩层时，模态组件会触发一个\
  \ `close_modal` 事件。我们在根 Vue 实例中捕获该事件，并将模态的显示状态切换为 `false`：\n\n```html\n<modal :show_modal=\"\
  showModal\" @close_modal=\"actCloseModal\"></modal>\n```\n\n还有：\n\n```javascript\n\
  methods: {\n  actShowModal(){ ... },\n  actCloseModal(){\n    this.showModal = false;\n\
  \  }\n},\n```\n\n现在，点击遮罩层时模态框应该关闭——这太棒了。但还有另一个问题：点击模态框的容器也会关闭模态框。\n\n对此一个简单的解释是点击事件会传播（冒泡）。为了停止这种传播，让我们使用\
  \ Vue 停止此类传播的方法，[`@click.stop` 事件修符](https://vuejs.org/v2/guide/events.html#Event-Modifiers)：\n\
  \n```html\n<template id=\"modal-template\">\n  <div class=\"modal-mask\" v-if=\"\
  show_modal\" @click=\"closeModal\">\n    <div class=\"modal-container\" @click.stop></div>\n\
  \  </div>\n</template>\n```\n\n搞定了！我们的模态框现在按照预期方式工作了。花些时间运行我们目前的代码，并确保它运行正常。\n\n\
  ## 创建身份验证模态框\n\n目前，我们的模态容器是空的。让我们改变这一点，并编写一些代码来构建一个登录表单嵌入到这个容器中。\n\n让我们先将登录表单加入其中。记住，将使用\
  \ Materialize 框架，所以不需要太担心 HTML 类的定义：\n\n```html\n<template id=\"modal-template\"\
  >\n  <div class=\"modal-mask\" v-if=\"show_modal\" @click=\"closeModal\">\n    <div\
  \ class=\"modal-container clearfix\" @click.stop>\n      <h4 class=\"blue-text\"\
  >Login</h4>\n      <form class=\"col s12\">\n        <div class=\"input-field col\
  \ s12\">\n          <input v-model=\"email\" id=\"email_address\" type=\"text\"\
  >\n          <label for=\"email_address\">邮箱地址</label>\n        </div>\n       \
  \ <div class=\"input-field col s12 \">\n          <input v-model=\"password\" id=\"\
  password\" type=\"text\" >\n          <label for=\"password\">密码</label>\n     \
  \   </div>\n        <a class=\"waves-effect waves-light btn form-btn teal\">登录</a>\n\
  \      </form>\n    </div>\n  </div>\n</template>\n```\n\n并添加以下内容来样式化表单按钮：\n\n```css\n\
  .form-btn {\n  float: right;\n}\n.clearfix::after {\n  content: \"\";\n  clear:\
  \ both;\n  display: table;\n}\n```\n\n我们不会为身份验证组件实现后端，所以按钮什么都不做是合理的。尽管如此，让我们在组件上定义\
  \ `email` 和 `password` 数据属性，因为我们在登录表单中的输入已经通过 [v-model 指令](https://vuejs.org/v2/guide/forms.html)指向了它们。这对于实现表单验证很有用。我们不会在教程中实现这一点，但你可以在此\
  \ Vue 系列中的教程 *Vue 表单操作初学者指南* 中阅读更多相关内容：\n\n```\nVue.component(\"modal\", {\n  template:\
  \ \"#modal-template\",\n  props: [\"show_modal\"],\n  data() {\n    return {\n \
  \     email: \"\",\n      password: \"\"\n    };\n  },\n  methods: { ... }\n});\n\
  ```\n\n打开你的 `modal.html`，然后……砰！我们自己创建了一个登录模态框。\n\n由于一切运行得非常顺畅，我们有机会思考更优雅的处理方法。\n\
  \n## 使用插槽（Slots）让我们的模态框可复用\n\n尽管我们的模态框现在很好且可用，但仍然存在一个小问题：登录表单与模态组件紧密耦合在一起。因此，目前，如果我们想在应用程序中使用不同的模态框——例如一个用于用户注册，另一个用于其他功能——我们就必须通过从头创建一个另一个模态组件来重复我们的代码。\n\
  \n是否有一种方法可以在保持模态组件骨架分离的同时，插入我们想要的内容？肯定的。\n\n根据我们已有的内容，很容易将登录表单从模态组件中分离，以便我们在需要时将后者用于其他内容。这从创建一个独立的登录组件开始，该组件将包含登录表单所需的数据和方法：\n\
  \n```\nVue.component(\"login\", {\n  template: \"#login-template\",\n  data() {\n\
  \    return {\n      email: \"\",\n      password: \"\"\n    };\n  }\n});\n```\n\
  \n这是定义登录模板的代码：\n\n```html\n<template id=\"login-template\">\n  <div class=\"clearfix\"\
  >\n    <h4 class=\"blue-text\">Login</h4>\n    <form class=\"col s12\">\n      <div\
  \ class=\"input-field col s12\">\n        <input v-model=\"email\" id=\"email_address\"\
  \ type=\"text\">\n        <label for=\"email_address\">邮箱地址</label>\n      </div>\n\
  \      <div class=\"input-field col s12 \">\n        <input v-model=\"password\"\
  \ id=\"password\" type=\"text\" >\n        <label for=\"password\">密码</label>\n\
  \      </div>\n      <a class=\"waves-effect waves-light btn form-btn teal\">登录</a>\n\
  \    </form>\n  </div>\n</template>\n```\n\n等等，为了实现插槽的逻辑：\n\n```html\n<template\
  \ id=\"modal-template\">\n  <div class=\"modal-mask\" v-if=\"show_modal\" @click=\"\
  closeModal\">\n    <div class=\"modal-container\" @click.stop>\n      <slot></slot>\n\
  \    </div>\n  </div>\n</template>\n```\n\n\n\n我们希望做的是将登录或注册组件分别渲染到模态组件中。假设网页上有两个按钮，点击其中一个显示登录模态框，另一个显示注册模态框。我们的代码应该这样写：\n\
  \n```\n<modal :show_modal=\"showModal\" @close_modal=\"actCloseModal\" choice=\"\
  choice\">\n  <login v-if=\"choice === 'login'\"></login>\n  <register v-else-if=\"\
  choice === 'register'\"></register>\n</modal>\n```\n\n如代码所示，我们的根实例上有一个名为 `choice`\
  \ 的数据属性，它的值可以是“login”或“register”。然后它作为 prop 使用在我们的模态组件中，如下代码所示：\n\n```javascript\n\
  Vue.component(\"modal\", {\n  template: \"#modal-template\",\n  props: [\"show_modal\"\
  , \"choice\"],\n  methods: { ... }\n});\n\nVue.component(\"login\", { ... });\n\
  Vue.component(\"register\", { ... });\n\nnew Vue({\n  el: \".container\",\n  data()\
  \ {\n    return {\n      showModal: false,\n      choice: \"\"\n    };\n  },\n \
  \ methods: { ... }\n});\n```\n\n接下来，让我们创建上述两个按钮——一个用于显示登录模态框，另一个用于显示注册模态框。现在我们有了这些：\n\
  \n```html\n<div class=\"container\">\n  <button v-on:click=\"actShowModal('login')\"\
  > Login </button>\n  <button v-on:click=\"actShowModal('register')\"> Register </button>\n\
  \n  <modal :show_modal=\"showModal\" @close_modal=\"actCloseModal\" choice=\"choice\"\
  >\n    <login v-if=\"choice === 'login'\"> </login>\n    <register v-else-if=\"\
  choice === 'register'\"></register>\n  </modal>\n</div>\n```\n\n定义在根实例上的 `actShowModal`\
  \ 方法将变为变为接受一个选择作为参数：\n\n```javascript\nnew Vue({\n  el: \".container\",\n  data()\
  \ { ... },\n  methods: {\n    actShowModal(choice) {\n      this.choice = choice;\n\
  \      this.showModal = true;\n    },\n    actCloseModal() {\n      this.showModal\
  \ = false;\n    }\n  }\n});\n```\n\n### 一些无障碍改进\n\n我们不应该忽略的一点是，人们可能在使用键盘导航我们的模态框。让我们他们的生活更方便一点：\n\
  \n```html\n<div class=\"container\" @keyup.escape.stop=\"actCloseModal()\">\n  ...\n\
  </div>\n```\n\n这将允许通过按下 `Esc` 键关闭模态框。\n\n当模态框打开时，你可能还想让表单中的第一个元素聚焦。可以通过创建一个如下[自定义指令](https://vuejs.org/v2/guide/custom-directive.html)来实现：\n\
  \n```javascript\nVue.directive(\"focus\", {\n  inserted: el => {\n    el.focus();\n\
  \  }\n});\n```\n\n你可以将其应用到任何需要聚焦的元素上。在我们的情况下，这将是表单中的第一个输入元素：\n\n```html\n<input\
  \ v-model=\"email\" id=\"email_address\" type=\"text\" v-focus>\n<input v-model=\"\
  firstName\" placeholder=\"\" id=\"first_name\" type=\"text\" v-focus>\n```\n\n现在，我们全部完成了！我们的模态组件会根据我们点击的按钮，很好地渲染注册和登录组件。打开你的\
  \ `modal.html` 查看结果。\n\n### 实时代码\n\n![代码演示图](img/modals.png)\n\n[这里是 CodePen 上运行的代码演示](https://codepen.io/SitePoint/pen/ZVLaBN)。\n\
  \n我们所做的事情非常有价值，因为它防止了不必要的代码重复。我们最终创建了一个某种程度上“通用”的模态组件。然而，为了使其完全可复用，我们需要将它以及其他组件转换为\
  \ SFC（单文件组件），并使用 `webpack` 对我们的代码进行打包以及进行转译，以便它在所有主流浏览器上运行。我们将在教程的下部分完成这些。\n\n##\
  \ 单文件组件\n\n单文件组件（Single-file components）是在使用 Vue.js 时实现模块化的一种整洁方式。它们允许我们创建包含组件的\
  \ `.vue` 文件，而且在处理复杂的应用程序并希望避免在 HTML 文件中编写 Vue 代码所带来的混乱时，它们会非常有用。在我们的情况下，将我们的 `Modal`、`Registration`\
  \ 和 `Login` 组件转换为 SFC 有助于防止极其笨拙的复制粘贴代码来复用的行为。\n\n由于你的浏览器无法读取 `.vue` 文件，我们将使用 [Vue\
  \ CLI](https://cli.vuejs.org/) 来脚手项目。在底层，它使用了 `webpack` 以及其他几个依赖项来打包我们的代码。\n\n让我们开始吧。\n\
  \n### 基础设置\n\n要使用 CLI，你需要在系统中安装较新版本的 Node.js。你可以通过[官方网站](https://nodejs.org/) 下载二进制文件，或者使用[版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。这可能是最简单的方法，因为它允许你在同一台机器上管理多个版本的\
  \ Node。\n\n接下来，使用以下命令在你的机器上全局安装 Vue CLI：\n\n```bash\nnpm install -g @vue/cli\n```\n\
  \n使用以下命令脚手创建一个项目：\n\n```bash\nvue create my-modal\n```\n\n选择默认预设，当 CLI 完成后，进入目录：\n\
  \n```bash\ncd my-modal\n```\n\n接下来，安装 Materialize 依赖：\n\n```bash\nnpm install materialize\n\
  ```\n\n打开 `src/main.js` 以便包含它并全局化：\n\n```javascript\nimport Vue from \"vue\";\n\
  import App from \"./App.vue\";\nimport \"materialize-css/dist/materialize.css\"\
  ;\nimport \"materialize-css/dist/materialize.min.js\";\n\nVue.directive(\"focus\"\
  , {\n  inserted: el => {\n    el.focus();\n  }\n});\n\nnew Vue({\n  render: h =>\
  \ h(App)\n}).$mount(\"#app\");\n```\n\n### 创建单文件组件\n\n功能上没有变化，但注意代码变得整洁多了。\n\n接下来，在\
  \ `src/components` 文件夹中创建需要的组件：\n\n```bash\ntouch src/components/{modal.vue,register.vue,login.vue}\n\
  ```\n\n当你完成后，`src` 文件夹看起来应该是这样的：\n\n```\n.\n├── App.vue\n├── assets\n│   └── logo.png\n\
  ├── components\n│   ├── login.vue\n│   ├── modal.vue\n│   └── register.vue\n└──\
  \ main.js\n```\n\n剩下的工作是向组件添加代码。\n\n在 `modal.vue` 中：\n\n```html\n<template id=\"\
  modal-template\">\n  <div class=\"modal-mask\" v-if=\"show_modal\" @click=\"closeModal\"\
  >\n    <div class=\"modal-container\" @click.stop>\n      <slot></slot>\n    </div>\n\
  \  </div>\n</template>\n\n<script>\nexport default {\n  name: \"modal\",\n  props:\
  \ [\"show_modal\", \"choice\"],\n  methods: {\n    closeModal() {\n      this.$emit(\"\
  close_modal\", false);\n    }\n  }\n};\n</script>\n\n<style>\n.modal-mask{\n  position:\
  \ fixed;\n  z-index: 100;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n\
  \  background-color: rgba(0, 0, 0, .3);\n  overflow-y:auto;\n}\n.modal-container\
  \ {\n  width: 80%;\n  height: auto;\n  margin: 50px auto 0;\n  position: relative;\n\
  \  padding: 16px;\n  background-color: #fff;\n  border-radius: 2px;\n  box-shadow:\
  \ 0 2px 8px rgba(0, 0, 0, .33);\n  box-sizing: border-box;\n}\n.form-btn {\n  float:\
  \ right;\n}\n.clearfix::after {\n  content: \"\";\n  clear: both;\n  display: table;\n\
  }\n</style>\n```\n\n\n\n在这里我们声明 CSS，因为它与模态框相比，与其他组件更为相关。如果我们添加 `scoped` 属性，这些定义将仅对此文件的模板有效。\n\
  \n在 `login.vue` 中：\n\n```\n<template id=\"login-template\">\n  <div class=\"clearfix\"\
  >\n    <h4 class=\"blue-text\">登录</h4>\n    <form class=\"col s12\">\n      <div\
  \ class=\"input-field col s12\">\n        <input v-model=\"email\" id=\"email_address\"\
  \ type=\"text\" v-focus>\n        <label for=\"email_address\">邮箱地址</label>\n  \
  \    </div>\n      <div class=\"input-field col s12 \">\n        <input v-model=\"\
  password\" id=\"password\" type=\"text\" >\n        <label for=\"password\">密码</label>\n\
  \      </div>\n      <a class=\"waves-effect waves-light btn form-btn teal\">登录</a>\n\
  \    </form>\n  </div>\n</template>\n\n<script>\nexport default {\n  name: \"login\"\
  ,\n  data() {\n    return {\n      email: \"\",\n      password: \"\"\n    };\n\
  \  }\n};\n</script>\n```\n\n在 `register.vue` 中：\n\n```\n<template id=\"registration-template\"\
  >\n  <div class=\"clearfix\">\n    <h4 class=\"blue-text\">注册</h4>\n    <form class=\"\
  col s12\">\n      <div class=\"input-field col s6\">\n        <input v-model=\"\
  firstName\" placeholder=\"\" id=\"first_name\" type=\"text\" v-focus>\n        <label\
  \ for=\"first_name\">姓</label>\n      </div>\n\n      <div class=\"input-field col\
  \ s6\">\n        <input v-model=\"lastName\" id=\"last_name\" type=\"text\">\n \
  \       <label for=\"last_name\">名</label>\n      </div>\n\n      <div class=\"\
  input-field col s12\">\n        <input v-model=\"username\" id=\"username\" type=\"\
  text\" class=\"\">\n        <label for=\"username\">用户名</label>\n      </div>\n\n\
  \      <div class=\"input-field col s12\">\n        <input v-model=\"email\" id=\"\
  email_address\" type=\"text\">\n        <label for=\"email_address\">邮箱地址</label>\n\
  \      </div>\n\n      <div class=\"input-field col s12\">\n        <input v-model=\"\
  password\" id=\"password\" type=\"password\">\n        <label for=\"password\">密码</label>\n\
  \      </div>\n\n      <a class=\"waves-effect waves-light btn teal form-btn\">继续</a>\n\
  \    </form>\n  </div>\n</template>\n\n<script>\nexport default {\n  name: \"register\"\
  ,\n  data() {\n    return {\n      firstName: \"\",\n      lastName: \"\",\n   \
  \   username: \"\",\n      email: \"\",\n      password: \"\"\n    };\n  }\n};\n\
  </script>\n```\n\n以上就是全部了。如果你现在使用命令 `npm run serve` 启动开发服务器，你就能在 [`localhost:8080`](http://localhost:8080)\
  \ 看到你的应用程序正在运行。\n\n## 结论\n\n在本次教程中，我演示了如何构建一个简单的模态框组件。我们查看了基本的无障碍访问特性、如何设计模态框以实现可重用性，以及最后如何使用\
  \ Vue CLI 将我们的应用结构化为单文件组件。\n\n我希望我向你展示了开始构建你自己的组件是多么简单，以及 Vue 的组件化方法如何让以这种声明的方式构建界面变得一种乐事。\n\
  \n# 第 9 章：如何使用 Vue.js 构建游戏\n\n## 作者：Ivaylo Gerchev\n\n我如此喜欢 [Vue.js](https://vuejs.org)\
  \ 的原因之一是它可以用于各种场景，并可以集成到许多不同类型的项目中。因此对我来说，Vue 是一个通用的、多功能的框架。在这方面，让我想起了 Python 编程语言，它也容易学习和使用，并适用于许多领域。\n\
  \n在本次教程中，我们将探索 Vue 的一个不那么显眼的用途——游戏开发。\n\n## 本教程的代码仓库\n\n本教程的代码[可以在 GitHub 上找到](https://github.com/sitepoint-editors/match-pairs)。你也可以在此处查看[完成游戏的演示](https://sitepoint-editors.github.io/match-pairs/)。\n\
  \n## 为什么选择 Vue 而不是真正的游戏开发框架\n\n显然，Vue 并不是为游戏开发定制的。那么，我们为什么想要选择它而不是真正的游戏开发框架/引擎呢？嗯，让我们探索两个充分的理由：\n\
  \n1.  如果你熟悉 Vue 和/或每天用它工作，你已经拥有了必要的技能和知识。使用 Vue 创建游戏，你只需要应用你已知的知识，同时将思维转移到不同的上下文中——而不是需要学习整个全新的游戏框架。\n\
  2.  Vue 提供了让游戏开发变得简单的特性：\n\n    *   [Vue 的响应式系统](https://vuejs.org/v2/guide/reactivity.html)\
  \ 允许以最少的精力构建高度交互的界面。\n    *   过渡和动画是大多数游戏的重要部分。Vue 对此有[内置支持](https://vuejs.org/v2/guide/transitions)。\n\
  \    *   [Vue 的生态系统](https://github.com/vuejs/awesome) 足够提供你所需的功能。\n\n## 规划游戏\n\n\
  我们今天要构建的是一个流行的[配对游戏](https://en.wikipedia.org/Concentration)。UI 将由以下组件组成：\n\n* \
  \  卡牌面板，持有卡牌。\n*   倒计时器组件，显示剩余时间。\n*   状态栏组件，显示剩余次数。\n*   启动屏组件，当游戏结束时显示“你输了！”或“你赢了！”当时间剩余\
  \ 10 秒或更少时，计时器的颜色将变为红色。\n\n## 开始\n\n现在是时候行动了。为了遵循本文，你需要安装 Node](https://nodejs.org/)、npm\
  \ 以及 [Vue CLI](https://cli.vuejs.org/)。使用[版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-nvm/)\
  \ 是最简单的方法：\n\n```bash\nnpm i -g @vue/cli\n```\n\n完成后，创建一个 `match-pairs` 项目，在提示时选择“default”预设：\n\
  \n```bash\nvue create match-pairs\ncd match-pairs\n```\n\n接下来，我们添加 [Vuetify 插件](https://vuetify.com/en/)：\n\
  \n```bash\nvue add vuetify\n```\n\n再次选择“default”预设。为了启用它，我们需要在根目录下创建一个 `webpack.config.js`\
  \ 文件，内容如下：\n\n```javascript\nconst VuetifyPlugin = require('vuetify-loader/lib/plugin')\n\
  module.exports = {\n  plugins: [\n    new VuetifyPlugin()\n  ]\n}\n```\n\n现在让我们添加另外两个需要的包——Lodash](https://lodash.com/)\
  \ 和 [MomentJS](http://momentjs.com/)：\n\n```bash\nnpm i lodash moment\n```\n\n最后，我们可以此命令运行应用程序：\n\
  \n```bash\nnpm run serve\n```\n\n## 准备项目文件和组件\n\n现在我们需要做一些准备。\n\n首先，我们需要修改 `src/main.js`\
  \ 文件。将其内容替换为以下：\n\n```javascript\nimport Vue from 'vue'\nimport './plugins/vuetify'\n\
  import App from './App.vue'\nimport _ from 'lodash'\n\nVue.config.productionTip\
  \ = false\n\nnew Vue({\n  render: h => h(App),\n}).$mount('#app')\n```\n\n现在，在 `src/components`\
  \ 目录中，删除 `HelloWorld.vue` 示例文件，并创建游戏所需的组件：`CardsBoard.vue`、`Timer.vue`、`StatusBar.vue`\
  \ 和 `Splash.vue`。\n\n接下来，打开 `src/App.vue`，删除内容并插入以下内容：\n\n\n\n\n\n```html\n<template>\n\
  \  <v-app dark>\n    <v-container>\n      <v-layout class=\"font-weight-bold display-3\
  \ purple--text\" justify-center mb-4>匹配对子</v-layout>\n      <v-layout mb-4>\n  \
  \      <timer></timer>\n        <status-bar></status-bar>\n      </v-layout>\n \
  \     <cards-board></cards-board>\n    </v-container>\n    <splash></splash>\n \
  \ </v-app>\n</template>\n```\n\n在这里，我们使用刚刚创建的组件来构建游戏布局。\n\n接下来，我们在脚本中填充以下内容：\n\n\
  ```javascript\n<script>\nconst cardsSet = [\n  {\n    name: \"php\",\n    img: \"\
  https://s3-us-west-2.amazonaws.com/s.cdpn.io/74196/php-logo_1.png\"\n  },\n  {\n\
  \    name: \"css3\",\n    img: \"https://s3-us-west-2.amazonaws.com/s.cdpn.io/74196/css3-logo.png\"\
  \n  },\n  ...\n];\n\nlet shuffleCards = () => {\n  let cards = [].concat(_.cloneDeep(cardsSet),\
  \ _.cloneDeep(cardsSet));\n  return _.shuffle(cards);\n};\n\nimport CardsBoard from\
  \ \"./components/CardsBoard\";\nimport StatusBar from \"./components/StatusBar\"\
  ;\nimport Timer from \"./components/Timer\";\nimport Splash from \"./components/Splash\"\
  ;\nimport _ from \"lodash\";\nimport moment from \"moment\";\n\nexport default {\n\
  \  name: \"App\",\n  components: {\n    CardsBoard,\n    StatusBar,\n    Timer,\n\
  \    Splash\n  },\n  data() {\n    return {\n      cards: [],\n      started: false,\n\
  \      duration: 120000,\n      progress: 0,\n      time: null,\n      timer: null,\n\
  \      flipBackTimer: null,\n      turns: 0,\n      matches: 0,\n      showSplash:\
  \ false,\n      result: \"\",\n      score: 0\n    };\n  },\n  created() {\n   \
  \ this.resetGame();\n  },\n  methods: {\n    resetGame() {\n      this.started =\
  \ false;\n      this.progress = 0;\n      this.time = null;\n      this.turns =\
  \ 0;\n      this.matches = 0;\n      this.showSplash = false;\n      this.score\
  \ = 0;\n\n      let cards = shuffleCards();\n\n      _.each(cards, card => {\n \
  \       card.flipped = false;\n        card.found = false;\n      });\n\n      this.cards\
  \ = cards;\n    },\n  }\n};\n</script>\n```\n\n首先，我们为卡片添加必要的图片。为了简洁起见，我省略了许多图片。你可以从\
  \ [GitHub 仓库中获取完整列表](https://github.com/sitepoint-editors/match-pairs/blob/master/src/App.vue)。\n\
  \n`shuffleCards()` 函数将图片翻倍以形成配对，并对它们进行全部洗牌。\n\n接下来，我们导入了组件并在 `components` 对象中注册了它们。我们还导入了\
  \ Lodash 和 Moment。\n\n之后，我们定义了游戏所需的所有数据属性。我们添加了 `created()` 钩子，它会在应用创建时调用 `resetGame()`\
  \ 方法。`resetGame()` 将所有数据属性恢复到初始状态。\n\n现在，我们可以添加一些辅助方法，用于管理卡片的 `flipped`（翻牌）和 `found`（已找到）状态：\n\
  \n```javascript\nmethods: {\n  ...\n\n  flippedCards() {\n    return _.filter(this.cards,\
  \ card => card.flipped);\n  },\n\n  sameFlippedCard() {\n    let flippedCards =\
  \ this.flippedCards();\n    if (flippedCards.length == 2) {\n      if (flippedCards[0].name\
  \ == flippedCards[1].name) return true;\n    }\n  },\n\n  setCardFounds() {\n  \
  \  _.each(this.cards, card => {\n      if (card.flipped) card.found = true;\n  \
  \  });\n  },\n\n  checkAllFound() {\n    let foundCards = _.filter(this.cards, card\
  \ => card.found);\n    if (foundCards.length == cards.length) return true;\n  },\n\
  \n  clearFlips() {\n    _.map(this.cards, card => (card.flipped = false));\n  },\n\
  \n  clearFlipTimer() {\n    clearTimeout(this.flipBackTimer);\n    this.flipBackTimer\
  \ = null;\n  },\n}\n```\n\n以下是这些辅助方法的作用：\n\n- `flippedCards()` 返回所有翻牌的卡片——即 `flipped`\
  \ 属性为 true 的卡片\n- `sameFlippedCard` 使用上述辅助方法检查两个翻牌的卡片是否相同\n- `setCardFounds()` 将翻牌的卡片标记为已找到\n\
  - `checkAllFound` 检查是否所有卡片都已找到\n- `clearFlips()` 清除所有翻牌的卡片\n- `clearFlipTimer` 在我们翻牌卡片时重置计时器\n\
  \n最后，我们添加了开始和结束游戏的方法：\n\n```javascript\nmethods: {\n  ...\n\n  startGame() {\n \
  \   this.started = true;\n    let duration = this.duration;\n    this.timer = setInterval(()\
  \ => {\n      if (duration == 1000) {\n        this.finishGame();\n      }\n   \
  \   duration -= 1000;\n      this.time = moment(duration).format(\"mm:ss\");\n \
  \     this.progress = (duration / this.duration) * 100;\n    }, 1000);\n  },\n\n\
  \  finishGame() {\n    this.started = false;\n    clearInterval(this.timer);\n \
  \   if (this.matches == cards.length) {\n      this.result = \"Win\";\n    } else\
  \ {\n      this.result = \"Lose\";\n    }\n\n    this.showSplash = true;\n  }\n\
  }\n```\n\n# 构建组件\n\n好的，是时候构建组件了。\n\n## CardsBoard 组件\n\n打开 `CardsBoard.vue` 并放入以下内容：\n\
  \n```html\n<template>\n  <v-layout>\n    <v-card \n      v-for=\"(card, i) in cards\"\
  \n      :key=\"i\"\n      class=\"card\"\n      @click=\"$emit('flipcard', card)\"\
  \n    >\n      <div class=\"flex-container\">\n        <div class=\"back\" :style=\"\
  background-image: 'url(' + card.img + ')'\"></div>\n        <div class=\"front\"\
  ></div>\n      </div>\n    </v-card>\n  </v-layout>\n</template>\n\n<script>\nexport\
  \ default {\n  props: [\"cards\"],\n  emits: [\"flipcard\"],\n  methods: {\n   \
  \ flipCard(card) {\n      this.$emit(\"flipcard\", card);\n    }\n  }\n};\n</script>\n\
  ```\n\n为了让上面的代码工作，我们需要一些 CSS。所以我们在 style 部分放入以下内容：\n\n```css\n<style>\n.flex-container\
  \ {\n  display: flex;\n  flex-flow: row;\n  justify-content: space-around;\n}\n\
  .card {\n  position: relative;\n  width: 100px;\n  height: 150px;\n  margin: 1px;\n\
  \  transition: transform 0.3s;\n}\n@media only screen and (max-width: 768px) {\n\
  \  .card {\n    width: 50px;\n    height: 75px;\n  }\n}\n.card .front,\n.card .back\
  \ {\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 0;\n  bottom: 0;\n \
  \ width: 100%;\n  height: 100%;\n  border-radius: 5px;\n  backface-visibility: hidden;\n\
  \  transform-style: preserve-3d;\n}\n.card .back {\n  background-image: url(\"https://s3-us-west-2.amazonaws.com/s.cdpn.io/102308/card_backside.jpg\"\
  );\n  background-size: 100%;\n  background-repeat: no-repeat;\n}\n.card .front {\n\
  \  transform: rotateY(-180deg);\n  background-size: 100%;\n  background-repeat:\
  \ no-repeat;\n  background-position: center;\n  background-color: white;\n}\n.card.flipped\
  \ .back,\n.card.found .back {\n  transform: rotateY(180deg);\n}\n.card.flipped .front,\n\
  .card.found .front {\n  transform: rotateY(0deg);\n}\n.card.found {\n  opacity:\
  \ 0.3;\n}\n</style>\n```\n\n在这里我不深入讨论细节。基本上，这些样式创建了正确的卡片布局并添加了翻转效果。\n\n现在，让我们回到\
  \ `App.vue` 并添加内容：\n\n```html\n<cards-board :cards=\"cards\" @flipcard=\"flipCard\"\
  ></cards-board>\n```\n\n在这里，我们绑定了 `cards` 属性并注册了 `flipcard` 事件监听器。现在，我们在脚本部分的 `methods`\
  \ 中添加 `flipCard()` 方法：\n\n\n\n\n\n```javascript\nmethods: {\n  ...\n\n  flipCard(card)\
  \ {\n    if (card.found || card.flipped) return;\n\n    if (!this.started) {\n \
  \     this.startGame();\n    }\n\n    let flipCount = this.flippedCards().length;\n\
  \    if (flipCount == 0) {\n      card.flipped = !card.flipped;\n    } else if (flipCount\
  \ == 1) {\n      card.flipped = !card.flipped;\n      this.turns += 1;\n\n     \
  \ if (this.sameFlippedCard()) {\n        this.matches += 1;\n        this.flipBackTimer\
  \ = setTimeout(() => {\n          this.clearFlipBackTimer();\n          this.setCardFounds();\n\
  \          this.clearFlips();\n\n          if (this.checkAllFound()) {\n       \
  \     this.finishGame();\n          }\n        }, 1000);\n      } else {\n     \
  \   this.flipBackTimer = setTimeout(() => {\n          this.clearFlipBackTimer();\n\
  \          this.clearFlips();\n        }, 1000);\n      }\n    }\n  }\n}\n```\n\n\
  首先，如果我们点击了一个已经翻转或找到的卡片，该函数将终止。如果 `started` 为 `false`，它将启动游戏。接下来，当我们打开第一张卡片时，它会将\
  \ `flipped` 属性更改为 `true`。当我们打开第二张卡片时，它会将 `flipped` 属性更改为 `true` 并增加 `turns` 属性。接下来，如果卡片相同，它将增加\
  \ `matches` 属性并设置一个 `flipBackTimer`。它将等待一秒钟并将卡片的 `found` 属性设置为 `true`，同时清除翻转的卡片。如果所有卡片都被找到，游戏将结束。如果打开的两张卡片不同，它将仅仅清除翻转的卡片。\n\
  \n### 定时器组件\n\n打开 `Timer.vue` 并添加以下内容：\n\n```html\n<template>\n  <v-layout justify-end>\n\
  \    <v-progress-circular\n      :rotate=\"-90\"\n      :value=\"progress\"\n  \
  \    :size=\"70\"\n      :width=\"9\"\n      :color=\"color\"\n    >{{time}}</v-progress-circular>\n\
  \  </v-layout>\n</template>\n\n<script>\nexport default {\n  props: [\"progress\"\
  , \"time\"],\n  data() {\n    return {\n      color: \"success\"\n    };\n  },\n\
  \  watch: {\n    progress() {\n      if (this.progress <= 10) {\n        this.color\
  \ = \"red\";\n      } else {\n        this.color = \"success\";\n      }\n    }\n\
  \  }\n};\n</script>\n```\n\n在这里，我们使用了 [Vuetify 进度组件](https://vuetifyjs.com/en/components/progress)。我们需要根据\
  \ `progress` 的值动态地更改计时器的颜色。为了不断更新 `progress` 属性，我们需要为它添加一个[监听器](https://vuejs.org/v2/guide/computed.html#Watchers)。\n\
  \n现在我们移动到 `App.vue` 并绑定传入的属性：\n\n```html\n<timer :progress=\"progress\" :time=\"\
  time\"></timer>\n```\n\n### 状态栏\n\n打开 `StatusBar.vue` 并添加以下内容：\n\n```html\n<template>\n\
  \  <v-layout align-center class=\"headline\">\n    <span class=\"mx-3\">Turns: {{\
  \ turns }}</span>\n    <v-divider vertical></v-divider>\n    <span class=\"mx-3\"\
  >Matches: {{ matches }}</span>\n  </v-layout>\n</template>\n\n<script>\nexport default\
  \ {\n  props: [\"turns\", \"matches\"]\n};\n</script>\n```\n\n在这里，我们只是传递了 `turns`\
  \ 和 `matches` 属性，并在模板中使用它们。\n\n在 `App.vue` 中，我们绑定传入的属性：\n\n```html\n<status-bar\
  \ :turns=\"turns\" :matches=\"matches\"></status-bar>\n```\n\n### 启动页\n\n最后，打开 `Splash.vue`\
  \ 并添加以下内容：\n\n```html\n<template>\n  <v-layout row>\n    <v-dialog v-model=\"showSplash\"\
  \ persistent max-width=\"300\">\n      <v-card class=\"text-xs-center\">\n     \
  \   <v-card-text>\n          <div class=\"headline mb-4\">You {{result}}!</div>\n\
  \          <div>Score: {{score}}/</div>\n        </v-card-text>\n        <v-card-actions>\n\
  \          <v-spacer></v-spacer>\n          <v-btn color=\"green darken-1\" flat\
  \ @click=\"resetGame\">Start New Game</v-btn>\n          <v-spacer></v-spacer>\n\
  \        </v-card-actions>\n      </v-card>\n    </v-dialog>\n  </v-layout>\n</template>\n\
  \n<script>\nexport default {\n  props: [\"showSplash\", \"result\", \"score\"],\n\
  \  methods: {\n    resetGame() {\n      this.$emit(\"resetgame\");\n    }\n  }\n\
  };\n</script>\n```\n\n我们使用了 [Vuetify 对话框组件](https://vuetifyjs.com/en/components/dialogs)\
  \ 来制作启动页。当 `showSplash` 为 `true` 时，启动页将显示。\n\n在 `App.vue` 中，我们绑定传入的属性并注册触发的事件：\n\
  \n```html\n<splash :showSplash=\"showSplash\" :result=\"result\" :score=\"score\"\
  ></splash>\n```\n\n到此，我们的游戏之旅就结束了。现在，只需运行 `npm run` 并享受吧！\n\n\n\n\n\n*   [VeeValidate](https://baianat.github.io/vee-validate/)\
  \ 一个用于 Vue.js 项目的单验证框架\n\n让我们进入项目目录并安装它们：\n\n```\ncd vuex-todo\nnpm install bootstrap-vue\
  \ vee-validate\n```\n\n为了测试一切是否运行正常，使用 `npm run serve` 启动应用并访问 [`localhost:8080`](http://localhost:8080)。你应该能看到欢迎界面。\n\
  \n## 基础项目设置\n\n现在我们已经安装了所有的依赖，可以开始构建我们的主应用程序结构。在 `src/components` 文件夹下，删除 `HelloWorld.vue`\
  \ 文件，然后创建两个新文件——`TodoList.vue` 和 `TodoItem.vue`：\n\n```\nrm src/components/HelloWorld.vue\n\
  touch src/components/{TodoList.vue,TodoItem.vue}\n```\n\n接下来，通过向 `main.js` 添加以下代码来注入\
  \ `Bootstrap Vue` 和 `VeeValidate`：\n\n```\n...\nimport BootstrapVue from 'bootstrap-vue'\n\
  import VeeValidate from 'vee-validate';\nimport 'bootstrap/dist/css/bootstrap.css'\n\
  import 'bootstrap-vue/dist/bootstrap-vue.css'\n...\nVue.config.productionTip = false\n\
  Vue.use(BootstrapVue)\nVue.use(VeeValidate);\n```\n\n现在打开 `src/App.vue` 并用以下代码替换现有代码：\n\
  \n```vue\n<template>\n  <div id=\"app\">\n   <b-jumbotron  bg-variant=\"info\" text-variant=\"\
  white\">\n      <template slot=\"header\">\n        <b-container>Vuex 待应用</b-container>\n\
  \      </template>\n      <template slot=\"lead\">\n        <b-container>使用 Bootstrap-Vue.js\
  \ 构建</b-container>\n      </template>\n    </b-jumbotron>\n\n    <b-container>\n\
  \      <div class=\"todo-page\">\n        <h2>购物列表</h2>\n        <hr>\n        <TodoList\
  \ />\n      </div>\n    </b-container>\n  </div>\n</template>\n\n<script>\n  import\
  \ TodoList from '@/components/TodoList.vue'\n\n  export default {\n    name: 'TodoView',\n\
  \    components: {\n      TodoList\n    }\n  }\n</script>\n```\n\n在这里我们使用 Bootstrap\
  \ 组件来布局我们的应用程序页面。这种方法比为每个 HTML 元素定义 Bootstrap 类要简单得多。你可以在 [Bootstrap Vue.js](https://bootstrap-vue.js.org/docs/components/jumbotron)\
  \ 网站找到所用组件的文档。\n\n对于组件，我们将插入一些占位代码。将以下代码插入到 `components/TodoList.vue`：\n\n```vue\n\
  <template>\n    <p>待办列表组件正在构建中</p>\n</template>\n```\n\n为 `components/TodoItem.vue`\
  \ 插入以下代码：\n\n```vue\n<template>\n  <p>待办事项组件正在构建中</p>\n</template>\n```\n\n最后，回到\
  \ [`localhost:8080`](http://localhost:8080)，你应该在那里看到以下页面视图：\n\n![Vuex 应用骨架](img/vuex-todo-01.jpg)\n\
  \n## 构建待办列表\n\n为了构建我们的待办列表，我们将采用自自而上的方法。也就是说，我们将从构建 Vuex store 开始，最后通过创建组件来完成。我们将为\
  \ `TodoList` 集合使用一个非常简单的 `TodoItem` 模型，它仅包含两个属性：\n\n```json\n{\n  name: \"Butter\"\
  ,\n  done: false\n}\n```\n\n### 创建 Store\n\n打开 `src/store.js` 并将默认替换替换以下代码：\n\n\
  ```javascript\nexport default new Vuex.Store({\n  state: {\n    items: [\n     \
  \ {\n        name: \"Milk\",\n        done: false\n      },\n      {\n        name:\
  \ \"Bread\",\n        done: true\n      },\n      {\n        name: \"Cake\",\n \
  \       done: false\n      }\n    ]\n  },\n  mutations: {\n    addItem(state, item)\
  \ {\n      state.items.push(item)\n    },\n    editItem(state, { item, name = item.name,\
  \ done = item.done }) {\n      item.name = name;\n      item.done = done;\n    },\n\
  \    removeItem(state, item) {\n      state.items.splice(state.items.indexOf(item),\
  \ 1);\n    }\n  },\n  actions: {\n    addItem({ commit }, item) {\n      commit(\"\
  addItem\", {\n        name: item,\n        done: false\n      })\n    },\n    editItem({\
  \ commit }, { item, name }) {\n      commit(\"editItem\", { item, name });\n   \
  \ },\n    toggleItem({ commit }, item) {\n      commit(\"editItem\", { item, done:\
  \ !item.done });\n    },\n  }\n});\n```\n\n如你所见，我们首先在 `state` 对象中声明我们的项目。\n\n然后我们有三个\
  \ mutations 来操作状态——`addItem`、`editItem` 和 `removeItem`。`addItem` mutation 处理器接收一个项目并将其推入\
  \ `state`，而 `removeItem` mutation 处理器接收一个项目并使用 [Array 的 splice 方法](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Array/splice)\
  \ 移除。\n\n### 构建 TodoList 组件\n\n现在让我们构建 `TodoList` 组件。它基本上由一个用于显示列表的表单组成。有一些 CSS\
  \ 和 Bootstrap 样式类来使布局看起来正确。如果你对这里的任何内容不确定，请查阅 [Bootstrap Vue](https://bootstrap-vue.js.org/docs)\
  \ 文档。\n\n```vue\n<template>\n  <div class=\"todo-list\">\n    <!-- start of to-form\
  \ -->\n    <b-form class=\"row\">\n      <b-col cols=\"10\">\n        <b-form-input\n\
  \          id=\"item\"\n          name=\"item\"\n          class=\"w-100\"\n   \
  \       placeholder=\"你想买什么？\"\n        ></b-form-input>\n      </b-col>\n     \
  \ <b-col cols=\"2\">\n        <b-button type=\"submit\" variant=\"primary\">添加</b-button>\n\
  \      </b-col>\n    </b-form>\n    <!-- end of to-form -->\n\n### start of to-list\
  \ -->\n    <b-row>\n      <b-col md=\"10\">\n        <b-list-group>\n          <b-list-group-item\
  \ v-for=\"(item, index) in items\" :key=\"index\">\n            {{ item.name }}\n\
  \          </b-list-group-item>\n        </b-list-group>\n      </b-col>\n    </b-row>\n\
  \    <!-- end of to-list -->\n  </div>\n</template>\n\n<script>\nimport { mapState\
  \ } from 'vuex';\n\nexport default {\n  name: 'TodoList',\n  computed: {\n    ...mapState([\n\
  \      'items'\n    ])\n  },\n};\n</script>\n\n<style>\nform {\n  margin-bottom:\
  \ 25px;\n}\n.list-group-item {\n  display: flex;\n}\n.list-group-item:hover{\n \
  \ background-color: aliceblue;\n}\n.checked {\n  font-style: italic;\n  text-decoration:\
  \ line-through !important;\n  color: gray;\n  background-color: #eeeeee;\n}\n</style>\n\
  ```\n\n### 添加项目\n\n现在让我们让购物列表具有交互性。在这里我们需要做以下几件事：\n\n*   允许用户添加项目、将其标记为 `done` 并删除它们。\n\
  \n\n\n\n\n- 使用 [VeeValidate](https://baianat.github.io/vee-validate/) 插件为输入表单添加验证。我们使用的唯一规则是\
  \ `v-validate=\"'required'\"`，它可以防止提交空白表单。\n- 如果存在验证错误信息，使用 VeeValidate 的 `errors`\
  \ 对象显示。\n- 创建一个名为 `item` 的本地状态变量，将其绑定到输入表单。\n- 创建一个 `onSubmit()` 函数，使用 Vue.js 的\
  \ `@submit.prevent` 修饰符处理表单的 `POST` 事件。\n\n让我们开始启用“添加项目”功能。如下所示更新 `src/components/TodoList.vue`\
  \ 中的模板部分：\n\n```\n<!-- 待事项表单开始 -->\n<b-row>\n  <b-col>\n    <!-- 显示验证错误 -->\n  \
  \    <b-alert v-if=\"errors.has('item')\" show dismissible variant=\"danger\">\n\
  \      {{ errors.first('item') }}\n    </b-alert>\n  </b-col>\n</b-row>\n<!-- 提交到\
  \ onSubmit 函数 -->\n<b-form class=\"row\" @submit.prevent=\"onSubmit\">\n  <b-col\
  \ cols=\"10\">\n  <!-- 绑定到本地 `item` 状态 -->\n    <b-form-input\n      id=\"item\"\
  \n      class=\"w-100\"\n      name=\"item\"\n      type=\"text\"\n      placeholder=\"\
  你想买什么?\"\n      v-model=\"item\"\n      v-validate=\"'required'\"\n      autocomplete=\"\
  off\"\n    ></b-form-input>\n  </b-col>\n  <b-col cols=\"2\">\n    <b-button type=\"\
  submit\" variant=\"primary\">添加任务</b-button>\n  </b-col>\n</b-form>\n<!-- 待事项表单结束\
  \ -->\n```\n\n现在，让我们如下所示在 `<script>` 部分定义本地状态 `item` 和 `onSubmit()` 函数：\n\n```\n\
  import { mapState, mapActions } from 'vuex';\n\nexport default {\n  name: 'TodoList',\n\
  \  data() {\n    return {\n      item:''\n    }\n  },\n  computed: {\n    ...mapState([\n\
  \      'items'\n    ])\n  },\n   methods: {\n    ...mapActions([\n      'addItem',\n\
  \    ]),\n    async onSubmit() {\n      const isvalid = await this.$validator.validateAll();\n\
  \      if(isvalid) {\n        await this.addItem(this.item);\n        this.item='';\
  \ // 保存成功后清除表单\n        this.$validator.reset();\n      }\n    },\n  }\n};\n```\n\
  \n在 `onSubmit` 方法中，我们首先执行验证方法以确保表单输入值有效。如果无效，则会显示错误消息。如果有效，则将项目传递给 `addItem` action。清空本地状态\
  \ `item` 并重置验证器，以防止显示错误的错误消息。在实现更改并测试表单后，你应该得到类似的结果：\n\n![项目字段是必填的](img/vuex-todo-04.jpg)\
  \ \n\n记得检查 Vue DevTools 以查看 store 如何响应你的输入事件。\n\n### 待事项项目组件\n\n现在我们来处理 `src/components/TodoItem`\
  \ 组件。复制以下代码：\n\n```\n<template>\n  <div class=\"todo-item\">\n    <b-list-group-item\
  \ class=\"row\">\n      {{ item.name }}\n    </b-list-group-item>\n  </div>\n</template>\n\
  \n<script>\n  export default {\n    name: 'TodoItem',\n    props: ['item']\n  }\n\
  </script>\n```\n\n接下来，回到 `src/components/TodoList`。我们需要将 `<b-list-group-item>` 代码段替换为新组件\
  \ `TodoItem`。进入模板部分，将 `<b-list-group>` 代码段替换为如下：\n\n```\n<b-list-group>\n  <TodoItem\
  \ v-for=\"(item, index) in items\" :key=\"index\" :item=\"item\" />\n</b-list-group>\n\
  ```\n\n为了在 `TodoList` 中使用 `TodoItem` 组件，你需要在如下所示的 `<script>` 部分导入它：\n\n```\nimport\
  \ TodoItem from './TodoItem.vue'\n//..\n\nexport default {\n  name: 'TodoList',\n\
  \  components: {\n    TodoItem\n  },\n  //..\n}\n```\n\n搞定了。保存更改后，待事项购物列表应该像以前一样运行。既然我们现在有了专门的\
  \ `TodoItem` 组件，我们现在可以轻松添加更多功能：\n\n- 切换项目状态（`done` 字段）\n- 编辑项目名称\n- 删除项目\n\n###\
  \ 切换项目状态\n\n让我们从切换项目状态开始。在 `todo` store 中，我们已经有一个可以为我们完成此操作的 action：\n\n```\ntoggleItem({\
  \ commit }, item) {\n  commit(\"editItem\", { item, done: !item.done })\n}\n```\n\
  \n通过使用 `mapAction` 助手在本地映射 action，我们可以如下从 `TodoItem` 组件中直接访问此函数：\n\n```\nthis.toggleItem(item)\n\
  ```\n\n通过如下所示更新 `<template>` 代码来添加复选框输入：\n\n```\n<template>\n  ...\n<b-row>\n  \
  \  <b-col>\n      <b-checkbox v-model=\"item.done\" @change=\"toggleItem(item)\"\
  >\n        完成\n      </b-checkbox>\n    </b-col>\n  </b-row>\n  ...\n</template>\n\
  ```\n（注：此处原文文本破碎，已根据上下文进行了清理）。\n\n### 删除项目\n\n接下来，让我们添加删除功能。对于此，我们不 dispatch action，而是直接\
  \ commit `removeItem`。\n\n```\n<template>\n  ...\n<b-col cols=\"1\">\n    <b-button\
  \ variant=\"link\" variant=\"danger\" size=\"sm\" @click=\"removeItem(item)\">X</b-button>\n\
  </b-col>\n...\n</template>\n\n<script>\n  ...\n  methods: {\n    ...mapActions([\n\
  \      'toggleItem'\n    ]),\n    removeItem(item) {\n      this.$store.commit(\"\
  removeItem\", item)\n    }\n  }\n...\n</script>\n```\n\n### 更新项目\n\n最后，让我们添加 `edit`\
  \ 功能。这将有点复杂。我们将这样做：\n\n- 我们创建一个名为 `editing` 的本地状态，默认设置为 `false`。\n- 当它为 `false`\
  \ 时，通过 span 元素显示项目名称。\n- 当为 `true` 时，通过输入文本框显示项目名称。\n- 我们创建一个自定义 Vue 指令，在文本框可见时对其设置焦点。\n\
  - 使用 `@keyup.enter` 和 `@blur` 触发的事件调用自定义函数 `doneEdit` 来处理编辑更改。\n- 使用 `@keyup.esc`\
  \ 触发的事件调用自定义函数 `cancelEdit`。该函数还将 `item.name` 状态恢复为原始值并将 `editing` 值设置为 `false`。\n\
  \n现在让我们开始实现更改。我们将如下所示替换 `src/components/TodoItem.vue` 模板的相关代码来添加文本框：\n\n```\n<template>\n\
  \  ...\n<b-col cols=\"10\">\n  <span v-if=\"!editing\" @dblclick=\"editing = true\"\
  >{{ item.name }}</span>\n  <input class=\"edit\"\n    v-show=\"editing\"\n    v-focus=\"\
  editing\"\n    :value=\"item.name\"\n    @keyup.enter=\"doneEdit\"\n    @keyup.esc=\"\
  cancelEdit\"\n    @blur=\"doneEdit\"\n  >\n</b-col>\n...\n</template>\n```\n\n接下来，我们将在脚本部分添加\
  \ `editing` 布尔值状态变量、`focus` 指令，以及 `doneEdit` 和 `cancelEdit` 函数。\n\n如下所示更新代码：\n\n\
  \n\n\n\n```javascript\nexport default {\n  //...\n  data () {\n    return {\n  \
  \    editing: false\n    }\n  },\n  directives: {\n    focus (el, { value }, { context\
  \ }) {\n      if (value) {\n        context.$nextTick(() => {\n          el.focus()\n\
  \        })\n      }\n    }\n  },\n  methods: {\n    ...mapActions([\n      'toggleItem',\n\
  \      'editItem'\n    ]),\n    //..\n     doneEdit(event) {\n        const value\
  \ = event.target.value.trim();\n        const { item } = this;\n        if (!value)\
  \ {\n          this.removeItem(item)\n        } else if (this.editing) {\n     \
  \     this.editItem({ item, name:value });\n          this.editing = false\n   \
  \     }\n      },\n      cancelEdit(event){\n        event.target.value = this.item.name;\n\
  \        this.editing = false;\n      }\n  }\n}\n```\n\n保存更改并测试新的编辑功能。要修改项目，只需双击项目即可。你可以按\
  \ `Return` 或点击其他地方来保存更改。如果你不想保存更改，也可以按 `ESC`。你应该会看到类似下面的视图：\n\n![编辑待办事项](img/vuex-todo-06.jpg)\n\
  \n## 进一步进\n\n如果你已经看到这里，那太棒了！你已经掌握了构建 Vuex 项目所需的大部分技能。我将给你出一个挑战。我们刚刚构建的项目使用的是硬编码的待办事项列表。句话说，每当我们执行浏览器全刷新时，`todo`\
  \ store 都会重置为硬编码的值：\n\n```javascript\nstate: {\n    items: [\n      {\n        name:\
  \ \"Milk\",\n        done: false\n      },\n      {\n        name: \"Bread\",\n\
  \        done: true\n      },\n      {\n        name: \"Cake\",\n        done: false\n\
  \      }\n    ]\n  },\n```\n\n我想让你将 `items` 的初始状态设置为为空数组，如下：\n\n```javascript\n\
  state: {\n  items: []\n}\n```\n\n然后，我想让你使用一个真实的数据库来持久化 `items` 集合。你可以使用任何你熟悉的数据库系统，例如\
  \ MongoDB、现成的 API 接口如 [JSON server](https://github.com/typicode/json-server)，或者云托管数据库如\
  \ [mLab](https://mlab.com/)。然后你可以使用像 [axios](https://github.com/axios/axios)这样的库从你的远程\
  \ API 获取数据到应用的 store 中。\n\n这里有一些关于如何设置它的线索。你需要在你的 `todo` store 中为此任务创建一个新的 mutation，看起来如下：\n\
  \n```javascript\nexport default {\n  state: {\n    items: []\n  },\n  mutations:\
  \ {\n    fetchTodos(state, items) {\n      state.items = items\n    }\n  },\n  actions:\
  \ {\n    async fetchTodos({commit}) {\n      const response = await axios.get('http://localhost:4000/api/todos');\n\
  \      commit(\"fetchItems\", response.data)\n    }\n  }\n}\n```\n\n接着在你的 `TodoList`\
  \ 组件中，你可以使用 Vue 的 `created` 生命周期钩子来获取数据：\n\n```html\n<script>\nimport { mapActions\
  \ } from 'vuex'\n\nexport default {\n  computed: {\n    ...mapActions([\n      'fetchTodos'\n\
  \    ])\n  }\n  created: function() {\n    this.fetchTodos()\n  }\n}\n</script>\n\
  ```\n\n注意，我没有做任何错误处理。我留给你你来思考在 `fetchTodos` 函数失败时如何显示适当错误消息。\n\n## 总结\n\n从个人角度来看，作为一个有\
  \ Redux 和 MobX 状态管理库背景的人来说，我非常喜欢 Vuex。我觉得 Vuex 比它们更简洁、更干净。它为你做了很多繁重的工作，使得实现代码变得容易。Vue\
  \ DevTools 是一个巨大的加分项，允许你在出现问题时轻松地调试你的 Vuex store。\n\nVuex 与 Vue.js 紧密集成，并由 Vue.js\
  \ 团队维护。我认为这是在商业项目依赖 Vuex 的一个很好的理由。作为一个开源项目，你可以轻松地确认该项目正在 [GitHub](https://github.com/vuejs/vuex)\
  \ 上活跃维护。你也可以确认它没有太多未解决的问题。\n\n尽管如此，你应该注意我还没有涵盖 Vuex 库中提供的 100% 的功能。我强烈建议你查看他们的[当前文档](https://vuex.vuejs.org/)\
  \ 来了解更多关于其高级功能。\n\n# 第 11 章：如何使用 Storybook 开发和测试 Vue 组件\n\n#### 作者 Ivaylo Gerchev\n\
  \n在当今 Web 应用开发中，组件起着核心作用。现代应用的复杂性要求我们将代码库拆分为微小且易管理的片段——组件，然后我们可以像使用乐高积木一样构建整个应用。为了方便构建并使其更加自动化和交互化，一些聪明的开发者创建了用于组件开发的专用工具。其中一个工具就是\
  \ [Storybook](https://storybook.js.org/)。\n\n## 什么是 Storybook？\n\nStorybook 是一个用于开发和测试\
  \ UI 组件的交互环境。它允许开发者在脱离实际应用的情况下构建组件。它易于配置和使用，并且可以通过许多官方和社区制作的插件进行扩展。\n\n## 开始上手\n\
  \n在本教程中，我们将学习如何使用 Storybook 开发 Vue 组件。\n\n### 完成的结果\n\n如果你想直接查看完成的代码，可以查看部署在 [GitHub\
  \ Pages](https://sitepoint.github.io/vue-pomodoro/) 上的 Storybook。\n\n要跟随本教程，你需要在机器上安装\
  \ Git 和 Node。[在这里查看如何安装 Git](https://git-scm.com/downloads)。安装 Node，你可以从[官方网站](https://nodejs.org/)\
  \ 下载二进制，或者使用[版本管理器](https://github.com/nvm-sh/nvm)。\n\n作为起点，我们将使用我已经写好的 [vue-pomodoro\
  \ 应用](https://github.com/sitepoint-editors/vue-pomodoro)。番茄工作法](https://en.wikipedia.org/wiki/Pomodoro_Technique)\
  \ 是 Francesco Cirillo 在 20 世纪 80 年代提出的时间管理方法，通过使用计时器将工作分为间隔。\n\n将应用克隆到本地机器，安装依赖并确保它可以运行正常：\n\
  \n```bash\ngit clone\n```\n\n### 安装 Storybook\n\n接下来我们需要安装 Storybook 以及一些额外的依赖。\n\
  \n运行以下命令安装 Storybook：\n\n```bash\nnpm i --save-dev @storybook/vue\n```\n\n接下来，我们需要添加一些依赖：\n\
  \n```bash\nnpm i --save-dev vue-loader\nnpm i --save-dev babel-preset-vue\n```\n\
  \n下一步是在我们项目的 `package.json` 文件中添加 `storybook` 脚本：\n\n```json\n{\n  \"scripts\":\
  \ {\n   ...\n    \"storybook\": \"start-storybook -p 9001 -c .storybook\"\n  }\n\
  }\n```\n\n\n\n\n\n脚本将在端口 `9001` 启动 Storybook 开发服务器，并将 `.storybook` 定义为配置目录。我们还可以在\
  \ `.storybook` 目录中创建一个 `config.js` 文件，在其中导入并注册我们的组件，并加载我们的故事（stories）。我们将在下一节中学习什么是故事以及如何创建它们。\n\
  \n```\nmkdir .storybook\ntouch .storybook/config.js\n```\n\n将以下内容添加到 `config.js`\
  \ 中：\n\n```javascript\nimport { configure } from '@storybook/vue';\n\nimport Vue\
  \ from 'vue';\n\n// 导入你的自定义组件。\nimport State from '../src/components/State.vue';\n\
  import Countdown from '../src/components/Countdown.vue';\nimport Controls from '../src/components/Controls.vue';\n\
  \n// 注册你的自定义组件。\nVue.component('state', State);\nVue.component('countdown', Countdown);\n\
  Vue.component('controls', Controls);\n\nfunction loadStories() {\n  // 你可以根据需要引入故事。\n\
  \  require('../src/stories');\n}\n\nconfigure(loadStories, module);\n```\n\n# 编写故事\n\
  \n[故事](https://storybook.js.org/basics/writing-stories/) 是 Storybook 的核心。一个故事代表单个组件的特定状态，或者一组在一起的组件的状态。我们可以为需要的组件创建任意数量的故事。棒的一点是，当我们编辑故事时，更改会立即应用并显示。这为我们提供了流畅且交互的体验。\n\
  \n故事存储在它们自己的目录，这使得它们更接近应用程序的组件。在这种情况下，我们导航到 `src` 目录，并在内部创建一个新的 `stories` 文件夹。然后添加\
  \ `index.js` 文件：\n\n```\nmkdir src/stories\ntouch src/stories/index.js\n```\n\n\
  编写故事非常简单。现在在 `index.js` 中创建我们的第一个故事：\n\n```javascript\nimport Vue from \"vue\";\n\
  import { storiesOf } from \"@storybook/vue\";\n\nstoriesOf(\"State\", module).add(\"\
  state toggle\", () => ({\n  template: `<state :isworking=\"false\"></state>`\n}));\n\
  ```\n\n`storiesOf` 方法封装了关于特定组件或组件组的一个或一组故事。第一个参数定义了包装器的名称。单个故事只是不同的状态，我们通过使用 `add`\
  \ 方法来创建它们。第一个参数定义了状态的名称，第二个参数是创建实际状态的函数。渲染状态有许多方法。要查看所有方法，请查看 [Vue 真实示例](https://storybooks-vue.netlify.com/?selectedKind=Custom%7CMethod%20for%20rendering%20Vue&selectedStory=render&full=0&addons=1&stories=0&panelRight=0&addonPanel=storybook%2Fstories%2Fstories-panel)。\n\
  \n现在让我们通过运行项目来看看我们的故事运行情况：\n\n```\nnpm run storybook\n```\n\n你应该在浏览器中看到以下内容：\n\n\
  ![state component](img/state_toggle.png)\n\n## 安装和使用插件 (Add-ons)\n\n正如我们所见，Storybook\
  \ 的核心功能有限。为了添加更多实用的功能，我们需要安装一些插件。插件有两种类型：\n\n*   `装饰器 (Decorators)` 封装一个故事或多个故事，并以某种方式对其进行转换。例如，我们可以创建一个居中文本装饰器，它将我们故事中的文本居中。我们稍后会看到它的实际示例。\n\
  *   `原生插件 (Native Add-ons)` 允许与 Storybook 平台进行低级交互。我们也会看到这些示例。\n\n### 安装 Storysource\
  \ 插件\n\n我们要安装的第一个插件是 [Storysource](https://github.com/storybooks/storybook/tree/master/addons/storysource)。它为\
  \ storybook 添加了一个“STORY”面板，显示并高亮所选故事的源代码。它非常有用，因为我们可以看到故事是如何写的，而无需打开故事文件并手动搜索故事。要安装该插件，我们运行：\n\
  \n```\nnpm install -D @storybook/addon-storysource\n```\n\n在使用插件之前，我们需要在一个特殊的 `addons.js`\
  \ 文件中注册它，我们必须在 `.storybook` 目录中创建该文件：\n\n```\ntouch .storybook/addons.js\n```\n\n\
  然后添加：\n\n```javascript\nimport '@storybook/addon-storysource/register';\n```\n\n\
  还有一点。插件需要一些自定义的 webpack 配置。因此，我们在相同的 `.storybook` 目录中创建一个 `webpack.config.js` 文件：\n\
  \n```\ntouch .storybook/webpack.config.js\n```\n\n并向添加以下内容：\n\n```javascript\nconst\
  \ path = require('path');\n\nmodule.exports = (storybookBaseConfig, configType,\
  \ defaultConfig) => {\n  defaultConfig.module.rules.push({\n    test: [/\\.stories\\\
  .js$/, /index\\.js$/],\n    loaders: [require.resolve('@storybook/addon-storysource/loader')],\n\
  \    include: [path.resolve(__dirname, '../src')],\n    enforce: 'pre',\n  });\n\
  \n  return defaultConfig;\n};\n```\n\n### 重启 Storybook\n\n在我们安装新插件后，我们需要重启 storybook\
  \ 以便更改生效。\n\n最后，我们可以看到插件的运行情况：\n\n![Storysource in action](img/storysource_preview.png)\n\
  \n### 安装 Options 插件\n\n我们要安装的下一个插件是 [Options](https://github.com/storybooks/storybook/tree/master/addons/options)。它允许我们使用一些\
  \ Storybook 选项。\n\n使用以下命令安装它：\n\n```\nnpm install -D @storybook/addon-options\n\
  ```\n\n在 `addons.js` 中注册它：\n\n```javascript\nimport '@storybook/addon-options/register';\n\
  ```\n\n然后我们可以像这样在 `config.js` 中使用它：\n\n```javascript\nimport { configure, addDecorator\
  \ } from '@storybook/vue';\nimport { withOptions } from 'addon-options';\n\naddDecorator(\n\
  \  withOptions({\n    name: 'Vue Pomodoro',\n  })\n);\n```\n\n现在，storybook 左角的名称将是“VUE\
  \ POMORO”，而不是“STORY”。你可以根据需要使用其他选项。\n\n### 安装 Actions、Links 和 Knobs 插件\n\n在本节中，我们将安装三个插件：[Actions](https://github.com/storybooks/storybook/tree/master/addons/actions)、[Links](https://github.com/storybooks/storybook/tree/master/addons/links)\
  \ 和 [Knobs](https://github.com/storybooks/storybook/tree/master/addons/knobs)。\n\
  \n你可以这样安装它们：\n\n```\nnpm install -D @storybook/addon-actions @storybook/addon-links\
  \ @storybook/addon-knobs\n```\n\n并在 `addons.js` 中注册它们：\n\n```javascript\nimport\
  \ '@storybook/addon-knobs/register';\nimport '@storybook/addon-links/register';\n\
  import '@storybook/addon-actions/register';\n```\n\n### 注册顺序\n\n这里的注册顺序很重要，因为插件会在\
  \ Storybook 的面板中按相同的顺序显示。\n\n### 使用 Knobs 插件\n\nKnobs 允许我们动态编辑 Vue 属性。让我们来看看实际效果。在\
  \ `index.js` 文件中添加以下内容：\n\n```javascript\nimport { withKnobs, boolean } from '@storybook/addon-knobs';\n\
  \n...\n\nstoriesOf(\"State\", module)\n  .addDecorator(withKnobs)\n  .add(\"state\
  \ toggle\", () => ({\n    props: {\n      isworking: {\n        type: Boolean,\n\
  \        default: boolean(\"isworking\", true)\n      }\n    },\n    template: `<state\
  \ :isworking=\"isworking\"></state>`\n  }));\n```\n\n### 创建和使用自定义装饰器\n\n现在让我们如何创建一个自定义装饰器。在同一个\
  \ `index.js` 文件中，添加以下内容：\n\n```javascript\nconst CenterDecorator = () => ({\n  template:\
  \ '<div style=\"textAlign: center;\"><story/></div>',\n});\n\n...\n\nstoriesOf(\"\
  Countdown\", module)\n  .addDecorator(CenterDecorator)\n  .add(\"work state\", ()\
  \ => ({\n    template: `<countdown :minute=\"1\" :second=\"0\" :isworking=\"true\"\
  ></countdown>`\n  }))\n  .add(\"rest state\", () => ({\n    template: `<countdown\
  \ :minute=\"5\" :second=\"0\" :isworking=\"false\"></countdown>`\n  }));\n```\n\n\
  \n\n\n我们在这里做的目的是定义一个 `CenterDecorator` 装饰器。我们用自定义功能封装了 `<story/>` 组件。然后，我们将将其添加到为\
  \ `Countdown` 组件创建的两个新状态中。\n\n![状态工作](img/work_state.png)\n\n![状态休息](img/rest_state.png)\n\
  \n## 使用 Links 和 Actions 插件\n\n在本节中，我们将创建关于番茄钟控制按钮的 story（故事），并使用链接来模拟点击这些按钮时的真实世界行为。\n\
  \n在 `index.js` 文件中，添加以下内容：\n\n```\nimport { linkTo } from '@storybook/addon-links';\n\
  import { action } from '@storybook/addon-actions';\n\n...\n\nstoriesOf(\"Controls\"\
  , module)\n  .add(\"started state\", () => ({\n    template: `<controls state=\"\
  started\" @paused=\"linkToPaused()\" @stopped=\"linkToStopped()\"></controls>`,\n\
  \    methods: {\n      linkToPaused: linkTo(\"Controls\", \"paused state\"),\n \
  \     linkToStopped: linkTo(\"Controls\", \"stopped state\")\n    }\n  }))\n  .add(\"\
  paused state\", () => ({\n    template: `<controls state=\"paused\" @started=\"\
  linkToStarted()\" @stopped=\"linkToStopped()\"></controls>`,\n    methods: {\n \
  \     linkToStarted: linkTo(\"Controls\", \"started state\"),\n      linkToStopped:\
  \ linkTo(\"Controls\", \"stopped state\")\n    }\n  }))\n  .add(\"stopped state\"\
  , () => ({\n    template: `<controls state=\"stopped\" @started=\"linkToStarted(),\
  \ action()\"></controls>`,\n    methods: {\n      linkToStarted: linkTo(\"Controls\"\
  , \"started state\"),\n      action: action(\"Starting\")\n    }\n  }));\n```\n\n\
  在这里，我们导入了 `linkTo` 和 `action` 方法。然后我们创建了关于按钮三种可能状态的 story。接下来，我们创建了链接以便根据点击的按钮在状态之间导航。在停止状态下，我们还使用了一个\
  \ action。因此，当我们按下 *Start* 按钮时，它会在“ACTION LOGGER”面板中记录启动动作。\n\n![动作演示](img/actions_preview.png)\n\
  \n## 多个组件\n\n在 Storybook 中，我们不仅可以为单个组件创建 story，还可以将多个组件组合到一个 Story 屏幕中。所以，当我们完成单个组件后，就可以将它们组合起来来代表应用的不同界面。让我们尝试一下。在\
  \ `index.js` 中，添加以下内容：\n\n```\nstoriesOf(\"App Screen\", module)\n  .addDecorator(CenterDecorator)\n\
  \  .add(\"all components\", () => ({\n    template: `\n      <div>\n        <state\
  \ :isworking=\"true\"></state>\n        <countdown minute=\"1\" second=\"0\" :isworking=\"\
  true\"></countdown>\n        <controls state=\"stopped\"></controls>\n      </div>`\n\
  \  }));\n```\n\n在这里，我们使用 `CenterDecorator` 让所有组件居中。大搞定。\n\n![所有组件](img/all_components_preview.png)\n\
  \n## 测试组件\n\n现在我们所有的组件都准备好了。现在是时候测试它们了。测试是一个非常广泛的话题，无法在这里完全讨论。测试组件有许多方法。在这里，我们将探索范围缩小到三种：\n\
  \n- **手动测试**依赖于开发者手动探索组件，并确保它们工作正常且行为符合预期。\n- **结构化/快照测试**捕获组件渲染后的标记。在下次运行时，新的快照将与旧快照进行比较以确保它们匹配。如果不匹配，我们有两个选择：如果差异是有意更改的结果，我们可以接受这些差异并更新快照；或者，如果它们是代码错误的结果，我们可以修复它们。\n\
  - **单元测试**验证在给定输入的情况下，我们是否会得到预期的输出。\n\n如果你是 JavaScript 测试的新手，你可能喜欢快速阅读“[使用 Jest\
  \ 测试 React 组件](https://www.sitepoint.com/test-react-components-jest/)来掌握通用概念。\n\n\
  ### 使用 Storyshots 插件实现结构化测试\n\n[Storyshots](https://github.com/storybooks/storybook/tree/master/addons/storyshots)\
  \ 插件为我们的 story 添加了自动化快照测试。让我们看看是如何操作的。\n\n首先，安装插件：\n\n```\nnpm install --save-dev\
  \ @storybook/addon-storyshots\n```\n\n现在，我们在 `tests/unit` 目录下创建一个 `storyshots.spec.js`\
  \ 文件：\n\n```\ntouch tests/unit/storyshots.spec.js\n```\n\n然后在该文件中放入以下内容：\n\n```\n\
  import initStoryshots from '@storybook/addon-storyshots';\n\ninitStoryshots();\n\
  ```\n\n搞定。现在我们运行测试：\n\n```\nnpm run test:unit\n```\n\n这就是我们会在终端中看到的：\n\n![测试输出](img/snapshots_test_passed.png)\n\
  \n所有快照将被放置在 `__snapshots__` 目录下，该目录会在 `tests/unit` 中自动创建。\n\n现在，为了演示快照的对比，我们将第一个\
  \ story 中的 `isworking` 属性更改为 `false`，然后重新运行测试。正如下面的截图所示，插件捕到了更改，并告诉我们我们可以通过 `-u`\
  \ 标志来更新快照。\n\n![测试输出](img/snapshots_test_failed.png)\n\n\n\n\n别忘了，你可以在[这里找到部署好的\
  \ Storybook](https://sitepoint-editors.github.io/vue-pomodoro/)。\n\n## 结论\n\n希望你喜欢学习\
  \ Storybook。正如你所见，它是一个强大的工具，我们可以用它交互式地开发和测试自包含的 UI 组件。它也非常适合制作实时组件展示或文档。我鼓励你去尝试一下。\n\
  \n"
