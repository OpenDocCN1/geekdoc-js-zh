  \n# 第 1 章：使用 Vue.js、Node 和 MongoDB 构建基础 CRUD 应用\n\n## 作者：James Hibbard\n\n大多数 Web\
  \ 都需要以某种形式持久化数据。在处理服务器端语言工作时，这通常是一项简单的任务。然而，当你其中加入一个前端 JavaScript 框架时，事情开始变得有些复杂了。\n\
  \n在本教程中，我将向你展示如何构建一个简单的 [CRUD 应用](https://en.wikipedia.org/wiki/Create,_read,_update_and_delete)（创建、读取、更新和删除）。\n\
  \n## 安装工具\n\n在本节中，我们将安装创建应用所需的工具。这些工具是 Node、npm、MongoDB、MongoDB Compass（可选）和 Postman。我不会深入介绍各种安装说明，但如果你在安装过程中遇到任何问题，请[访问我们的论坛](https://www.sitepoint.com/)。\n\
  \n### Node.js\n\n许多网站会建议你前往[官方下载页面](https://nodejs.org/en/download/) 获取适用于你系统的 Node\
  \ 二进制文件。虽然这种方法可行，但我建议使用版本管理器（如 [nvm](https://github.com/creationix/nvm)）。这是一个允许你安装多个版本的\
  \ Node 并随意在它们切换的程序。如果你想了解更多信息，请参阅我们的快速贴士：[使用 nvm 安装多个版本的 Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。\n\
  \n### npm\n\nnpm 是一个 JavaScript 包管理器，与 Node 一起绑定，因此不需要额外安装。在整个教程中，我们将频繁使用 npm，所以如果你需要复习，请参阅[npm\
  \ 入门学者指南](https://www.sitepoint.com/beginners-guide-node-package-manager/)。\n\n\
  ### MongoDB\n\nMongoDB 是一个文档数据库，以灵活的类 JSON 文档存储数据。\n\n启动 MongoDB 最快的方法是使用如 mLabs\
  \ 的服务。他们提供免费的沙盒计划，提供运行在共享虚拟机上的具有 496MB 存储空间的单个数据库。这对于只有少数用户的简单应用程序来说绰有余。如果这听起来是你的最佳选择，请参阅他们的[快速入门指南](http://docs.mlab.com/)。\n\
  \n你也可以在本地安装 Mongo。要这样做，请访问[官方下载页面](https://www.mongodb.com/download-center#community)\
  \ 并为你的操作系统下载正确版本的社区版服务器。下载链接旁边有指向详细的、特定操作系统安装说明的链接。\n\n### MongoDB GUI\n\n\n\n\n\
  虽然跟随本教程操作并非严格必要，但你可能也会喜欢安装 [Compass，MongoDB 的官方 GUI 界面](https://www.mongodb.com/download-center#compass)。此工具可以帮助你可视化并操作你的数据，允许你通过全功能\
  \ CRUD 功能与文档进行交互。\n\n在编写本文时，你需要填写详细信息来下载 Compass，但不需要创建账户。\n\n### Postman\n\n这是一个用于处理和测试\
  \ API 的极其实用的工具。你可以从[项目主页](https://www.getpostman.com/) 下载适用于你操作系统的正确版本。你可以在[此处找到针对特定操作系统的安装说明](https://learning.getpostman.com/docs/postman/launching_postman/installation_and_updates/)。\n\
  \n### 检查所有内容是否安装正确\n\n要检查 `node` 和 `npm` 是否安装正确，请打开终端并输入以下命令：\n\n```\nnode -v\n\
  ```\n\n接着输入此命令：\n\n```\nnpm -v\n```\n\n这将输出每个程序的版本号（在编写本文时分别为 `11.1.0` 和 `6.4.1`）。\n\
  \n如果你在本地安装了 `Mongo`，可以使用此命令检查版本号：\n\n```\nmongo --version\n```\n\n这应该会输出大量信息，包括版本号（在编写本文时为\
  \ `4.0.4`）。\n\n### 使用 Compass 检查数据库连接\n\n如果你在本地安装了 `Mongo`，可以通过在终端中输入以下命令启动服务器：\n\
  \n```\nmongod\n```\n\n接下来，打开 Compass。你应该能够接受默认设置（主机名：`localhost`，端口：`27017`），点击\
  \ `CONNECT` 按钮并与数据库服务器建立连接。\n\n![MongoDB Compass 连接到 localhost:27107](img/compass-local.jpg)\
  \ \n\n请注意 `admin`、`config` 和 `local` 数据库会自动创建的。\n\n### 使用云托管解决方案\n\n如果你正在使用 mLabs，请创建一个数据库订阅（如其[快速启动指南](http://docs.mlab.com/)\
  \ 中描述所示），然后将连接详情复制到剪贴板。它的格式应该如下：\n\n```\nmongodb://<dbuser>:<dbpassword>@<instance>.mlab.com:<port>/<dbname>\n\
  ```\n\n当你打开 Compass 时，它会通知你已检测到 MongoDB 连接字符串，并询问你是否想使用它来填充表单。点击 `Yes`，然后点击 `CONNECT`，就可以开始工作了。\n\
  \n![MongoDB Compass 连接到 mLabs](img/compass-mlabs.jpg) \n\n注意我给我的数据库命名为 `node-vue-crud-app`。你可以随心为你命名。\n\
  \n## 创建 Node 后端\n\n在本节中，我们将为 Vue 前端创建一个 RESTful API，供其调用并使用 Postman 对其进行测试。我不想详细介绍\
  \ RESTful API 的工作原理，因为本指南的重点应该是 Vue 前端。如果你想看更深入的教程，互联网上有的是。我发现 [10 分钟内构建 Node.js\
  \ RESTful APIs](https://www.codementor.io/olatundegaruba/nodejs-restful-apis-in-10-minutes-q0sgsfhbd)\
  \ 非常易于理解，并为本节的代码提供了灵感。\n\n### 基础设置\n\n首先，让我们创建所需的文件和目录并初始化项目：\n\n```\nmkdir -p vocab-builder/server/api/{controllers,models,routes}\n\
  cd vocab-builder/server\ntouch server.js\ntouch api/controllers/vocabController.js\n\
  touch api/models/vocabModel.js\ntouch api/routes/vocabRoutes.js\nnpm init -y\n```\n\
  \n这应该带给我们如下目录结构：\n\n```\n.\n└── server\n    ├── api\n    │   ├── controllers\n \
  \   │   │   └── vocabController.js\n    │   ├── models\n    │   │   └── vocabModel.js\n\
  \    │   └── routes\n    │       └── vocabRoutes.js\n    ├── package.json\n    └──\
  \ server.js\n```\n\n### 安装依赖项\n\n对于我们的 API，我们将使用以下库：\n\n*   [express](https://www.npmjs.com/package/express)—一个\
  \ Node 轻量级框架，提供了许多有用功能，如路由和中间件。\n*   [cors](https://www.npmjs.com/package/cors)—Express\
  \ 中间件，可用于项目中启用 [CORS](http://en.wikipedia.org/wiki/Cross-origin_resource_sharing)。\n\
  *   [body-parser](https://www.npmjs.com/package/body-parser)—用于解析传入请求体的 Express\
  \ 中间件。\n*   [mongoose](https://www.npmjs.com/package/mongoose)—用于 Node 的 MongoDB\
  \ ODM（NoSQL 版本的 ORM）。它提供了简单的验证和查询 API，帮助你与 MongoDB 数据库交互。\n*   [nodemon](https://www.npmjs.com/package/nodemon)—一个简单的监控脚本，当检测到文件更改时会自动重启\
  \ Node 应用。\n\n让我们安装它们吧：\n\n```\nnpm i express cors body-parser mongoose\nnpm i nodemon\
  \ --save-dev\n```\n\n接下来，打开 `package.json` 并修改 `scripts` 部分如下：\n\n```\n\"scripts\"\
  : {\n  \"start\": \"nodemon server.js\"\n},\n```\n\n设置就绪。\n\n### 创建服务器\n\n打开 `server.js`\
  \ 并添加以下代码：\n\n```javascript\nconst express = require('express');\nconst port = process.env.PORT\
  \ || 3000;\nconst app = express();\n\napp.listen(port);\n\napp.get('/', (req, res)\
  \ => {\n  res.send('Hello, World!');\n});\n\nconsole.log(`Server started on port\
  \ ${port}`);\n```\n\n然后进入终端并运行 `npm start`。如果你访问 `http://localhost:3000/`，你应该看到“Hello,\
  \ World!”\n\n### 定义 Schema\n\n接下来我们需要定义数据的结构。基本上，我希望每个文档有两个字段：`english` 和 `german`，用于存储单词的英文和中文翻译。我还想应用一些验证，确保这两个字段都不为空。\n\
  \n打开 `api/models/vocabModel.js` 并添加以下代码：\n\n```javascript\nconst mongoose = require('mongoose');\n\
  \nconst { Schema } = mongoose;\n\nconst VocabSchema = new Schema(\n  {\n    english:\
  \ {\n      type: String,\n      required: 'English word cannot be blank'\n    },\n\
  \    german: {\n      type: String,\n      required: 'German word cannot be blank'\n\
  \    }\n  },\n  { collection: 'vocab' }\n);\n\nmodule.exports = mongoose.model('Vocab',\
  \ VocabSchema);\n```\n\n注意我指定了集合名称，否则 Mongoose 会将其命名为“vocabs”，这太蠢了。\n\n### 设置路由\n\
  \n接下来我们需要指定 API 如何响应外部请求。我们将创建以下端点：\n\n*   GET `/words`—返回所有单词的列表\n*   POST `/words`—创建一个新单词\n\
  *   GET `/words/:wordId`—获取单个单词\n*   PUT `/words/:wordId`—更新单个单词\n*   DELETE `/words/:wordId`—删除单个单词\n\
  \n为了实现这一点，打开 `api/routes/vocabRoutes.js` 并添加以下内容：\n\n```javascript\nconst vocabBuilder\
  \ = require('../controllers/vocabController');\n\nmodule.exports = app => {\n  app\n\
  \    .route('/words')\n    .get(vocabBuilder.list_all_words)\n    .post(vocabBuilder.create_a_word);\n\
  \n  app\n    .route('/words/:wordId')\n    .get(vocabBuilder.read_a_word)\n    .put(vocabBuilder.update_a_word)\n\
  \    .delete(vocabBuilder.delete_a_word);\n};\n```\n\n你会注意到我们在顶部引入了 `vocabController`。它包含处理请求的实际逻辑。\n\
  \n### 创建控制器\n\n打开 `api/controllers/vocabController.js` 并添加以下代码：\n\n\n\n\n```javascript\n\
  const mongoose = require('mongoose');\nconst Vocab = mongoose.model('Vocab');\n\n\
  exports.list_all_words = (req, res) => {\n  Vocab.find({}, (err, words) => {\n \
  \   if (err) res.send(err);\n    res.json(words);\n  });\n};\n\nexports.create_a_word\
  \ = (req, res) => {\n  const newWord = new Vocab(req.body);\n  newWord.save((err,\
  \ word) => {\n    if (err) res.send(err);\n    res.json(word);\n  });\n};\n\nexports.read_a_word\
  \ = (req, res) => {\n  Vocab.findById(req.params.wordId, (err, word) => {\n    if\
  \ (err) res.send(err);\n    res.json(word);\n  });\n};\n\nexports.update_a_word\
  \ = (req, res) => {\n  Vocab.findOneAndUpdate(\n    { _id: req.params.wordId },\n\
  \    req.body,\n    { new: true },\n    (err, word) => {\n      if (err) res.send(err);\n\
  \      res.json(word);\n    }\n  );\n};\n\nexports.delete_a_word = (req, res) =>\
  \ {\n  Vocab.deleteOne({ _id: req.params.wordId }, err => {\n    if (err) res.send(err);\n\
  \    res.json({\n      message: 'Word successfully deleted',\n     _id: req.params.wordId\n\
  \    });\n  });\n};\n```\n\n在这里，我们导入了模型，然后定义了五个与所需的 CRUD 功能对应的函数。如果你不确定其中任何一个函数的作用或其工作原理，请查阅\
  \ [Mongoose 文档](https://mongoosejs.com/docs/api.html)。\n\n## 将所有部分连接在一起\n\n现在所有组件已就绪，是时候将它们连接在一起了。回到\
  \ `server.js` 将现有代码替换为以下内容：\n\n```javascript\nconst express = require('express');\n\
  const cors = require('cors');\nconst mongoose = require('mongoose');\nconst bodyParser\
  \ = require('body-parser');\n\nglobal.Vocab = require('./api/models/vocabModel');\n\
  const routes = require('./api/routes/vocabRoutes');\n\nmongoose.Promise = global.Promise;\n\
  mongoose.set('useFindAndModify', false);\nmongoose.connect(\n  'mongodb://localhost/vocab-builder',\n\
  \  { useNewUrlParser: true }\n);\n\nconst port = process.env.PORT || 3000;\nconst\
  \ app = express();\n\napp.use(cors());\napp.use(bodyParser.urlencoded({ extended:\
  \ true }));\napp.use(bodyParser.json());\n\nroutes(app);\napp.listen(port);\n\n\
  app.use((req, res) => {\n  res.status(404).send({ url: `${req.originalUrl} not found`\
  \ });\n});\n\nconsole.log(`Server started on port ${port}`);\n```\n\n在这里，我们首先引入必要的库，以及我们的模型和路由文件。然后，我们使用\
  \ Mongoose 的 `connect` 方法连接到数据库（如果你在本地安装了 MongoDB，请确保它正在运行），在此创建一个 Express 应用程序并告诉它使用\
  \ `bodyParser` 和 `cors` 中间件。接着，我们告诉它使用我们在 `api/routes/vocabRoutes.js` 中定义的路由，并监听端口\
  \ 3000 上的连接。最后，我们定义了一个函数来处理不存在的路由。\n\n你可以通过在浏览器中访问 [`localhost:3000/`](http://localhost:3000/)\
  \ 来测试其运行正常。你不应该再看到“Hello, World!”消息，而是 `{\"url\":\"/ not found\"}`。\n\n此外，请注意，如果你使用的是\
  \ mLabs，则需要将：\n\n```javascript\nmongoose.connect(\n  'mongodb://localhost/vocab-builder',\n\
  \  { useNewUrlParser: true }\n);\n```\n\n替换为创建数据库时收到的详情：\n\n```javascript\nmongoose.connect(\n\
  \  'mongodb://<dbuser>:<dbpassword>@<instance>.mlab.com:<port>/<dbname>',\n  { useNewUrlParser:\
  \ true }\n);\n```\n\n## 使用 Postman 测试 API\n\n要测试 API，请启动 Postman。操作方法取决于你是如何安装它的。\n\
  \n### 创建 (Create)\n\n我们将从创建一个新的词对开始。选择 `POST` 为方法，并将 `http://localhost:3000/words`\
  \ 输入 URL。选择 `Body` 选项卡和 `x-www-form-urlencoded` 单选按钮，然后在下方的字段中输入两个键/值对。按下 `Send`，你应该能通过响应接收来自服务器的新创建的对象。\n\
  \n![Postman—一次成功的 POST 请求](img/postman-01.jpg) \n\n此时，你也可以使用 Compass 查看数据库，以确保集合已使用正确的条目进行创建。\n\
  \n### 读取 (Read)\n\n为了测试我们 API 的读取功能，我们将首先尝试获取集合中的所有单词，然后是单个单词。\n\n要获取所有单词，将方法更改为\
  \ `GET` 并将 `Body` 更改为 `none`。然后点击 `Send`。响应应该如下：\n\n```json\n[\n  {\n    \"_id\"\
  : \"5bed3d46d311354a6ae6d1\"\n  }\n]\n```\n\n要获取所有单词，将方法更改为 `GET` 并将 `Body` 更改为\
  \ `none`。然后点击 `Send`。响应应该如下：\n\n```json\n[\n  {\n    \"_id\": \"5bed3d46d311354a6ae6d1\"\
  \n  }\n]\n```\n（注：原文包含一些截断/重复的 JSON 示例，我保持了提供指令的逻辑流）\n\n要获取所有单词，将方法更改为 `GET` 并将\
  \ `Body` 更改为 `none`。然后点击 `Send`。响应应该如下：\n\n```json\n[\n  {\n    \"_id\": \"5bed3d46d311354a6ae6d1\"\
  \n  }\n]\n```\n\n要获取所有单词，将方法更改为 `GET` 并将 `Body` 更改为 `none`。然后点击 `Send`。响应应该如下：\n\
  \n```json\n[\n  {\n    \"_id\": \"5bed3d46d311354a6ae6d1\"\n  }\n]\n```\n\n### 更新\
  \ (Update)\n\n最后，让我们更新单词。选择 `PUT` 为方法，并将 `http://localhost:3000/words` 输入 URL。选择\
  \ `Body` 选项卡和 `x-www-form-urlencoded` 单选按钮，然后在下方的字段中输入两个键/值对。按下 `Send`，你应该能通过响应接收来自服务器的新创建的对象。\n\
  \n### 删除 (Destroy)\n\n要删除单词，选择 `DELETE` 并点击 `Send`。砰！集合现在应该是空的。\n\n\n\n\n\n```\n\
  .\n├── App.vue\n├── assets\n├── components\n│   ├── VocabTest.vue\n│   └── WordForm.vue\n\
  ├── helpers\n│   └── helpers.js\n├── main.js\n├── router.js\n└── views\n    ├──\
  \ Edit.vue\n    ├── New.vue\n    ├── Show.vue\n    ├── Test.vue\n    └── Words.vue\n\
  ```\n\n### 安装依赖\n\n对于前端，我们将使用以下库：\n\n- [axios](https://www.npmjs.com/package/axios)—一个基于\
  \ Promise 的 HTTP 客户端，它允许我们从前端向后端发送 Ajax 请求。\n- [semantic-ui-css](https://www.npmjs.com/package/semantic-ui-css)—Semantic\
  \ UI 的轻量级纯 CSS 版本。\n- [vue-flash-message](https://www.npmjs.com/package/vue-flash-message)—一个\
  \ Vue 闪消息组件，我们将用它来向用户显示信息。\n\n让我们安装它们吧：\n\n```\nnpm i axios semantic-ui-css vue-flash-message\n\
  ```\n\n现在，我们就可以开始编写代码了。\n\n### 创建路由\n\n首先，我们需要考虑应用程序将拥有哪些路由。我们需要执行之前讨论的所有 CRUD（增删改查）操作，如果用户能够针对数据库中添加的任何单词进行自测，那就更好了。\n\
  \n为此此，我们将创建以下路由：\n\n- `/words`—显示数据库中所有的单词\n- `/words/new`—创建一个新单词\n- `/words/:id`—显示单词\n\
  - `/words/:id/edit`—编辑单词\n- `/test`—测试你的知识\n\n删除单词不需要单独的路由。我们只需要发送相应的请求并重定向到 `/words`\
  \ 即可。\n\n要实现这一步，打开 `src/router.js` 并现有代码替换为以下内容：\n\n```javascript\nimport Vue from\
  \ 'vue';\nimport Router from 'vue-router';\nimport Words from './views/Words.vue';\n\
  import New from './views/New.vue';\nimport Show from './views/Show.vue';\nimport\
  \ Edit from './views/Edit.vue';\nimport Test from './views/Test.vue';\n\nVue.use(Router);\n\
  \nexport default new Router({\n  mode: 'history',\n  base: process.env.BASE_URL,\n\
  \  linkActiveClass: 'active',\n  routes: [\n    {\n      path: '/',\n      redirect:\
  \ '/words'\n    },\n    {\n      path: '/words',\n      name: 'words',\n      component:\
  \ Words\n    },\n    {\n      path: '/words/new',\n      name: 'new-word',\n   \
  \   component: New\n    },\n    {\n      path: '/words/:id',\n      name: 'show',\n\
  \      component: Show\n    },\n    {\n      path: '/words/:id/edit',\n      name:\
  \ 'edit',\n      component: Edit\n    },\n    {\n      path: '/test',\n      name:\
  \ 'test',\n      component: Test\n    }\n  ]\n});\n```\n\n这创建了我们上面讨论的路由。它还将根 URL\
  \ `/` 重定向到 `/words`，并告诉路由器为当前激活的导航链接应用 `active` 类（默认值是 `router-link-active`，它与 `semantic-ui-css`\
  \ 的兼容性不佳）。\n\n提到这里，接下来我们需要打开 `src/main.js` 并告诉 Vue 使用 `semantic-ui-css`：\n\n```javascript\n\
  import Vue from 'vue';\nimport App from './App.vue';\nimport router from './router';\n\
  \nimport 'semantic-ui-css/semantic.css';\n\nVue.config.productionTip = false;\n\n\
  new Vue({\n  router,\n  render: h => h(App)\n}).$mount('#app');\n```\n\n最后，我们需要将\
  \ `src/App.vue` 中的代码替换为以下内容：\n\n```html\n<template>\n  <div id=\"app\">\n    <div\
  \ class=\"ui inverted segment navbar\">\n      <div class=\"ui center aligned container\"\
  >\n        <div class=\"ui large secondary inverted pointing menu compact\">\n \
  \         <router-link to=\"/words\" exact class=\"item\">\n            <i class=\"\
  comment outline icon\"></i 单词\n          </router-link>\n          <router-link\
  \ to=\"/words/new\" class=\"item\">\n            <i class=\"plus circle icon\"></i>\
  \ 新\n          </router-link>\n          <router-link to=\"/test\" class=\"item\"\
  >\n            <i class=\"graduation cap icon\"></i> 测试\n          </router-link>\n\
  \        </div>\n      </div>\n    </div>\n\n    <div class=\"ui text container\"\
  >\n      <div class=\"ui one column grid\">\n        <div class=\"column\">\n  \
  \        <router-view />\n        </div>\n      </div>\n    </div>\n  </div>\n</template>\n\
  \n<script>\nexport default {\n  name: 'app'\n};\n</script>\n\n<style>\n#app > div.navbar\
  \ {\n  margin-bottom: 1.5em;\n}\n.myFlash {\n  width: 250px;\n  margin: 10px;\n\
  \  position: absolute;\n  top: 50;\n  right: 0;\n}\ninput {\n  width: 300px;\n}\n\
  div.label {\n  width: 250px;\n}\ndiv.input {\n  width: 300px;\n}\ndiv.button {\n\
  \  margin: 10px;\n}\n</style>\n```\n\n这创建了我们上面讨论的路由。它还将根 URL `/` 重定向到 `/words`，并让\
  \ `router-link` 为当前激活的导航链接应用 `active` 类（默认是 `router-link-active`，它与 `semantic-ui-css`\
  \ 的兼容性不佳）。\n\n提到这里，接下来我们需要打开 `src/main.js` 并告诉 Vue 使用 `semantic-ui-css`：\n\n```javascript\n\
  import Vue from 'vue';\nimport App from './App.vue';\nimport router from './router';\n\
  \nimport 'semantic-ui-css/semantic.css';\n\nVue.config.productionTip = false;\n\n\
  new Vue({\n  router,\n  render: h => h(App)\n}).$mount('#app');\n```\n\n最后，我们需要将\
  \ `src/App.vue` 中的代码替换为以下内容：\n\n```html\n<template>\n  <div id=\"app\">\n    <div\
  \ class=\"ui inverted segment navbar\">\n      <div class=\"ui center aligned container\"\
  >\n        <div class=\"ui large secondary inverted pointing menu compact\">\n \
  \         <router-link to=\"/words\" exact class=\"item\">\n            <i class=\"\
  comment outline icon\"></i> 单词\n          </router-link>\n          <router-link\
  \ to=\"/words/new\" class=\"item\">\n            <i class=\"plus circle icon\"></i>\
  \ 新\n          </router-link>\n          <router-link to=\"/test\" class=\"item\"\
  >\n            <i class=\"graduation cap icon\"></i> 测试\n          </router-link>\n\
  \        </div>\n      </div>\n    </div>\n\n    <div class=\"ui text container\"\
  >\n      <div class=\"ui one column grid\">\n        <div class=\"column\">\n  \
  \        <router-view />\n        </div>\n      </div>\n    </div>\n  </div>\n</template>\n\
  \n<script>\nexport default {\n  name: 'app'\n};\n</script>\n\n<style>\n#app > div.navbar\
  \ {\n  margin-bottom: 1.5em;\n}\n.myFlash {\n  width: 250px;\n  margin: 10px;\n\
  \  position: absolute;\n  top: 50;\n  right: 0;\n}\ninput {\n  width: 300px;\n}\n\
  div.label {\n  width: 250px;\n}\ndiv.input {\n  width: 300px;\n}\ndiv.button {\n\
  \  margin: 10px;\n}\n</style>\n```\n\n### 与后端通信\n\n接下来我们需要做的事情是建立与后端通信的方法。这就是我们之前安装的\
  \ `axios` 库大显身场的地方。为了让应用更加灵活，打开 `src/helpers.js` 并添加以下内容：\n\n```javascript\nimport\
  \ axios from 'axios';\n\nconst baseURL = '/words';\n\nconst handleError = fn =>\
  \ (...params) =>\n  fn(...params).catch(error => {\n    console.log(error);\n  });\n\
  \nexport const api = {\n  getWord: handleError(async id => {\n    const res = await\
  \ axios.get(baseURL + id);\n    return res.data;\n  }),\n  getWords: handleError(async\
  \ () => {\n    const res = await axios.get(baseURL);\n    return res.data;\n  }),\n\
  \  deleteWord: handleError(async id => {\n    const res = await axios.delete(baseURL\
  \ + id);\n    return res.data;\n  }),\n  createWord: handleError(async payload =>\
  \ {\n    const res = await axios.post(baseURL, payload);\n    return res.data;\n\
  \  }),\n  updateWord: handleError(async (id, payload) => {\n    const res = await\
  \ axios.put(baseURL + id, payload);\n    return res.data;\n  })\n};\n```\n\n这里有几点需要注意。首先，我们导出了\
  \ `api` 对象，它暴露了我们创建的方法。这些方法将对后端执行 Ajax 调用。\n\n其次，由于 Ajax 的异步性质，我们使用了 [async/await](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Statements/async_function)，它允许我们在继续执行代码之前等待异步操作（如写入数据库）的结果。但是，这里有一个小的注意事项。在\
  \ `async/await` 中处理错误的标准方法是将内容包裹在 `try/catch` 块中：\n\n```javascript\nexport const\
  \ api = {\n  getWord: async id => {\n    try {\n      const res = await axios.get(baseURL\
  \ + id);\n      return res.data;\n    } catch(error) {\n      console.log(error);\n\
  \    }\n  }\n  ...\n}\n```\n\n然而，这样做非常冗长，并且会导致代码臃肿，因为我们需要对每个 Ajax 调用都进行这样做。另一种方法是使用[高阶函数](https://www.sitepoint.com/higher-order-functions-javascript/)来为我们处理错误。\n\
  \n这种高阶函数接收一个函数作为参数（函数 `a`），并返回另一个函数（函数 `b`），当函数 `b` 被调用时，它会调用函数 `a` 并传递它收到的任何参数。函数\
  \ `b` 还会在函数 `a` 的末尾链一个 `catch` 块，这意味着如果函数 `a` 发生错误，将被捕获并处理。\n\n\n\n\n\n如果你想深入探讨这些内容，请查看我们的文章\
  \ [现代 JS 中的流程控制：从回调到 Promise 再到 Async/Await](https://www.sitepoint.com/flow-control-callbacks-promises-async-await/)。\n\
  \n## 从数据库获取单词\n\n现在让我们获取一些单词来显示给用户。打开 `/src/views/Words.vue` 组件并添加以下代码：\n\n```vue\n\
  <template>\n  <div>\n    <h1>Words</h1>\n    <table id=\"words\" class=\"ui celled\
  \ compact table\">\n      <thead>\n        <tr>\n          <th>English</th>\n  \
  \        <th>German</th>\n          <th colspan=\"3\"></th>\n        </tr>\n   \
  \   </thead>\n      <tr v-for=\"(word, i) in words\" :key=\"i\">\n        <td>{{\
  \ word.english }}</td>\n        <td>{{ word.german }}</td>\n        <td width=\"\
  75\" class=\"center aligned\">Show</td>\n        <td width=\"75\" class=\"center\
  \ aligned\">Edit</td>\n        <td width=\"75\" class=\"center aligned\">Destroy</td>\n\
  \      </tr>\n    </table>\n  </div>\n</template>\n\n<script>\nimport { api } from\
  \ '../helpers/helpers';\n\nexport default {\n  name: 'words',\n  data() {\n    return\
  \ {\n      words: []\n    };\n  },\n  async mounted() {\n    this.words = await\
  \ api.getWords();\n  }\n};\n</script>\n```\n\n如你所见，我们导入了 `api` 来执行针对后端的操作，然后在组件的\
  \ `mounted` 生命周期钩子中，我们调用了它的 `getWords` 方法从数据库中获取所有单词。由于组件的 `data` 对象上有一个 `words`\
  \ 属性，我们可以等待后端的响应，然后将响应插入到 `this.words` 中，组件就会更新。\n\n尝试一下。使用 `Compass` 或 `Postman`\
  \ 向数据库插入一个单词，然后观察它是否显示在 `/words` 页面上。\n\n## 显示单个单词\n\n现在让我们添加从单词列表中显示单个单词的功能。在 `/src/views/Words.vue`\
  \ 中，将：\n\n```html\n<td width=\"75\" class=\"center aligned\">Show</td>\n```\n\n\
  替换为：\n\n```html\n<td width=\"75\" class=\"center aligned\">\n  <router-link :to=\"\
  { name: 'show', params: { id: word._id }}\">Show</router-link>\n</td>\n```\n\n这创建了一个指向我们在\
  \ `/src/router.js` 文件定义的 `show` 路由的链接。它使用当前单词的 `_id` 属性来构建 URL，结果类似于 `http://localhost:8081/words/5bed4462bbd0ff553fb008d4`。\n\
  \n现在打开 `/src/views/Show.vue` 并添加以下代码：\n\n```vue\n<template>\n  <div>\n    <h1>Show\
  \ Word</h1>\n\n    <div class=\"ui labeled input fluid\">\n      <div class=\"ui\
  \ label\">\n        <i class=\"germany flag\">i> German\n      </div>\n      <input\
  \ type=\"text\" readonly  :value=\"word.german\"/>\n    </div>\n    <div class=\"\
  ui labeled input fluid\">\n      <div class=\"ui label\">\n        <i class=\"united\
  \ kingdom flag\">i> English\n      </div>\n      <input type=\"text\" readonly \
  \ :value=\"word.english\"/>\n    </div>\n    <div class=\"actions\">\n      <router-link\
  \ :to=\"{ name: 'edit', params: { id: this.$route.params.id }}\">\n        Edit\
  \ word\n      </router-link>\n    </div>\n  </div>\n</template>\n\n<script>\nimport\
  \ { api } from '../helpers/helpers';\n\nexport default {\n  name: 'show',\n  data()\
  \ {\n    return {\n      word: ''\n    };\n  },\n  async mounted() {\n    this.word\
  \ = await api.getWord(this.$route.params.id);\n  }\n};\n</script>\n\n<style scoped>\n\
  .actions a {\n  display: block;\n  text-decoration: underline;\n  margin: 20px 10px;\n\
  }\n</style>\n```\n\n当组件挂载时，它将使用与之前相同的技术从数据库中获取单个单词。它通过使用 `this.$route.params.id`\
  \ 从 URL 中提取 ID 来识别目标单词。之所以可行，是因为我们在 `/src/router.js` 中声明路由的方式。在这里我们 `path: \"/words/:id\"\
  `，这意味着 `/words/` 之后的任何内容都可以作为 `$route.params.id` 可用。\n\n还要注意 `<style>` 标签上的 `scoped`\
  \ 属性。这意味着在此处声明的任何样式仅应用于此组件。\n\n如果你此时运行程序，你应该能够在 `/words` 下看到数据库中包含的单词列表，并通过点击 *Show*\
  \ 查看单个单词。\n\n![显示 \"Person\" \"Mensch\" 的 Show Word 屏幕](img/chrome-1.jpg) \n\n你会注意到上面的截图中有一个\
  \ *Edit word* 链接。让我们现在实现它。\n\n## 编辑单词\n\n打开 `src/views/Edit.vue` 并添加以下：\n\n```vue\n\
  <template>\n  <div>\n    <h1>Edit Word</h1>\n    <word-form>\n  </div>\n</template>\n\
  \n<script>\nimport { api } from '../helpers/helpers';\n\nexport default {\n  name:\
  \ 'edit',\n  components: {\n    WordForm: './components/WordForm.vue'\n  },\n  data()\
  \ {\n    return {\n      word: {}\n    };\n  },\n  async mounted() {\n    this.word\
  \ = await api.getWord(this.$route.params.id);\n  }\n};\n</script>\n```\n\n这里有一些不同之处。注意到我们使用了一个\
  \ `word-form` 组件。让我们查看 `components/WordForm.vue` 并添加以下：\n\n```vue\n<template>\n\
  \  <form @submit.prevent=\"onSubmit\">\n    <p v-if=\"errorsPresent\" class=\"error\"\
  >Please fill out fields!</p>\n\n    <div class=\"ui labeled input fluid\">\n   \
  \   <div class=\"ui label\">\n        <i class=\"germany flag\">i> German\n    \
  \  </div>\n      <input type=\"text\" placeholder=\"Enter word...\" v-model=\"word.german\"\
  \n    </div>\n\n    <div class=\"ui labeled input fluid\">\n      <div class=\"\
  ui label\">\n        <i class=\"united kingdom flag\">i> English\n      </div>\n\
  \      <input type=\"text\" placeholder=\"Enter word...\" v-model=\"word.english\"\
  \n    </div>\n\n    <button class=\"positive ui button\">Submit</button>\n  </form>\n\
  </template>\n\n<script>\nexport default {\n  name: 'word-form',\n  props: {\n  \
  \  word: {\n      type: Object,\n      required: false\n    }\n  },\n  data() {\n\
  \    return {\n      errorsPresent: false\n    };\n  },\n  methods: {\n    onSubmit()\
  \ {\n      console.log(`English: ${this.word.english}`);\n      console.log(`German:\
  \ ${this.word.german}`);\n    }\n  }\n};\n</script>\n\n<style scoped>\n.error {\n\
  \  color: red;\n}\n</style>\n```\n\n这里有相当多的内容。首先，我们有一个 `<form>` 标签，并且并将 `submit`\
  \ 事件绑定到 `onSubmit` 方法。我们还使用了 `.prevent` 修饰符来阻止浏览的默认行为——在这种情况下是提交表单。\n\n接下来是一个段落标签\
  \ `<p>`，用于在任何一个输入字段为空时显示错误消息。我们使用 `v-if` 只在 `errorsPresent` 属性计算为真时才显示它。\n\n然后是我们的表单，有两个输入字段，一个用于英语单词，另一个用于对应的德语单词。我们使用\
  \ `v-model` 在传递的 prop 的 `english` 和 `german` 属性与输入字段之间建立双向数据绑定。\n\n\n\n\n\n此时，如果你访问\
  \ `Edit word` 视图，应该应该在字段中看到显示的正确单词。当你点击 `Submit` 时，你应该能看到控制台记录了两个输入字段的值。\n\n![显示\
  \ \"Eagle\" 和 \"Adler\" 的 Edit Word 屏幕](img/chrome-2.jpg)\n\n最后，我们需要扩展 `onSubmit`\
  \ 方法，执行除了向控制台打印输入值以外的操作。将其修改为如下：\n\n```javascript\nonSubmit: function() {\n  if\
  \ (this.word.english === '' || this.word.german === '') {\n    this.errorsPresent\
  \ = true;\n  } else {\n    this.$emit('createOrUpdate', this.word);\n  }\n}\n```\n\
  \n这会检查两个字段是否都有值。如果没有，它会标记错误；否则，它会派发一个 `createOrUpdate` 事件，我们可以在父组件（在此例中为 `Edit`）中监听该事件。我将其命名为\
  \ `createOrUpdate`，因为父组件中相应的功能将执行这两种操作之一。\n\n回到 `src/views/Edit.vue`，我们需要监听并响应 `createOrUpdate`\
  \ 事件。将：\n\n```html\n<word-form :word=this.word></word-form>\n```\n\n改为：\n\n```html\n\
  <word-form @createOrUpdate=\"createOrUpdate\" :word=this.word></word-form>\n```\n\
  \n并在 `methods` 对象中实现更新功能：\n\n```javascript\nmethods: {\n  createOrUpdate: async\
  \ function(word) {\n    await api.updateWord(word);\n    alert('Word updated sucessfully!');\n\
  \    this.$router.push(`/words/${word._id}`);\n  }\n}\n```\n\n现在，当你尝试更新单词时，它会检查两个字段是否为空，如果不是，则会更新单词，并在弹出成功消息之前将你重定向到新更新的单词。\n\
  \n作为本部分的最后的收尾，回到 `src/views/Words.vue` 并修改：\n\n```html\n<td width=\"75\" class=\"\
  center aligned\">Edit</td>\n```\n\n改为：\n\n```html\n<td width=\"75\" class=\"center\
  \ aligned\">\n  <router-link :to=\"{ name: 'edit', params: { id: word._id }}\">Edit</router-link>\n\
  </td>\n```\n\n### 添加闪动消息\n\n好了，我们的应用看起来很不错了，但使用 alert 来告知用户发生了某些事情是一种很生兀的体验。让我们改用闪动消息（flash\
  \ messages）。这些是样式美观、可配置的消息，不会阻塞浏览器中 JavaScript 的执行。\n\n我们需要做的第一件事是告诉我们的应用使用它们。为此，回到\
  \ `src/helpers/helpers.js`，确保文件顶部内容如下：\n\n```javascript\nimport axios from 'axios';\n\
  import Vue from 'vue';\nimport VueFlashMessage from 'vue-flash-message';\nimport\
  \ 'vue-flash-message/dist/vue-flash-message.min.css';\n\nVue.use(VueFlashMessage,\
  \ {\n  messageOptions: {\n    timeout: 3000,\n    pauseOnInteract: true\n  }\n});\n\
  \nconst vm = new Vue();\nconst baseURL = 'http://localhost:3000/words/';\n\nconst\
  \ handleError = fn => (...params) =>\n  fn(...params).catch(error => {\n    vm.flash(`${error.response.status}:\
  \ ${error.response.statusText}`, 'error');\n  });\n\nexport const api = { ... };\n\
  ```\n\n这里发生了几件事。首先，我们导入了 Vue 和 VueFlashMessages。然后我们告诉 Vue 使用 VueFlashMessages 插件并传递了几个选项。最后，我们创建了一个\
  \ Vue 新实例，因为我们还想在辅助文件中使用闪动消息。你可以在 `handleError` 函数调用 `vm.flash()` 的地方看到这一操作。\n\n\
  为了我们能够实际显示这些消息，让我们在 `src/App.vue` 中添加一个 `FlashMessage` 组件：\n\n```html\n<div class=\"\
  ui text container\">\n  <flash-message class=\"myFlash\"></flash-message>\n\n  <div\
  \ class=\"ui one column grid\">\n    <div class=\"column\">\n      <router-view\
  \ />\n    </div>\n  </div>\n</div>\n```\n\n为了测试它是否工作正常，尝试将 `src/helpers/helpers.js`\
  \ 中的 `baseURL` 变量的值更改为不存在的内容。如果一切都按计划进行，那么当我们访问任何路由时，你应该在屏幕右侧看到一个格式化良好的错误消息。\n\n\
  最后，为了在成功编辑单词时显示闪动消息，回到 `src/views/Edit.vue` 并修改：\n\n```javascript\nalert(\"Word\
  \ updated sucessfully!\");\n```\n\n改为：\n\n```javascript\nthis.flash('Word updated\
  \ sucessfully!', 'success');\n```\n\n### 创建新单词\n\n我们几乎已经实现了所有的 CRUD 功能。下一步是给用户机会向我们的数据库添加自己的单词。打开\
  \ `src/views/New.vue` 并添加以下内容：\n\n```html\n<template>\n  <div>\n    <h1>New Word</h1>\n\
  \    <word-form @createOrUpdate=\"createOrUpdate\"></word-form>\n  </div>\n</template>\n\
  \n<script>\nimport WordForm from '../components/WordForm.vue';\nimport { api } from\
  \ '../helpers/helpers';\n\nexport default {\n  name: 'new',\n  components: {\n \
  \   'word-form': WordForm\n  },\n  methods: {\n    createOrUpdate: async function(word)\
  \ {\n      const res = await api.createWord(word);\n      this.flash('Word created',\
  \ 'success');\n      this.$router.push(`/words/${res._id}`);\n    }\n  }\n};\n</script>\n\
  ```\n（注：此处提供的源代码存在碎片化或冲突，我根据上下文进行了重构。）\n\n### 删除单词\n\n我们不需要单独的组件来删除单词，因为没有视图。操作发生在\
  \ `src/views/Words.vue` 中：\n\n首先将：\n\n```html\n<td width=\"75\" class=\"center aligned\"\
  >Edit</td>\n```\n\n改为：\n\n```html\n<td width=\"75\" class=\"center aligned\" @click.prevent=\"\
  onDestroy(word._id)\">\n  <a href=\"/words/${word._id}\">Delete</a>\n</td>\n```\n\
  \n这将拦截表格单元格的点击，阻止浏览器的默认操作，然后调用 `onDestroy` 方法。来实现它：\n\n```javascript\nmethods: {\n\
  \  async onDestroy(id) {\n    const sure = window.confirm('Are you sure?');\n  \
  \  if (!sure) return;\n\n    await api.deleteWord(id);\n    this.flash('Word deleted\
  \ successfully!', 'success');\n    const newWords = this.words.filter(word => word._id\
  \ !== id);\n    this.words = newWords;\n  }\n},\n```\n\n为了确保用户确实想要删除单词，我们使用对话框让他们确认。如果用户点击确定，将向\
  \ API 发送请求以删除单词。然后我们弹出闪动消息告诉他们删除成功，之后从 `data` 对象中的单词列表中移除该单词。这将确保 UI 的更新。\n\n##\
  \ 进一步尝试\n\n作为最后的收尾，让我们用户有机会对存储在数据库中的单词进行自测。\n\n打开 `src/views/Test.vue` 并添加以下代码：\n\
  \n```html\n<template>\n  <div>\n    <h1>Test</h1>\n\n    <div v-if=\"words.length\
  \ < 5\">\n      <p>您至少输入五个单词才能开始测试</p>\n    </div>\n    <div v-else>\n      <vocab-test\
  \ :words=\"words\"></vocab-test>\n    </div>\n  </div>\n</template>\n\n<script>\n\
  import { api } from '../helpers/helpers';\nimport VocabTest from '../components/VocabTest.vue';\n\
  \nexport default {\n  name: 'test',\n  components: {\n    'vocab-test': VocabTest\n\
  \  },\n  data() {\n    return {\n      words: []\n    };\n  },\n  async mounted()\
  \ {\n    this.words = await api.getWords();\n  }\n};\n</script>\n```\n\n\n\n\n在这里，我们正在等待组件挂载，然后从数据库中获取所有的单词。如果单词少于五个，我们将显示一条消息，说明单词不足无法开始测试。否则，我们将加载\
  \ `VocabTest` 组件并将单词列表作为 prop 传递给它。\n\n现在剩下的就是编写测试本身了。打开 `src/components/VocabTest.vue`\
  \ 并添加以下内容：\n\n```vue\n<template>\n  <div>\n    <h2>Score: {{ score }} out of {{\
  \ this.words.length }}</h2>\n\n    <form action=\"#\" @submit.prevent=\"onSubmit\"\
  >\n      <div class=\"ui labeled input fluid\">\n        <div class=\"ui label\"\
  >\n          <i class=\"germany flag\">i> German\n        </div>\n        <input\
  \ type=\"text\" readonly :disabled=\"testOver\" :value=\"currWord.german\"/>\n \
  \     </div>\n      <div class=\"ui labeled input fluid\">\n        <div class=\"\
  ui label\">\n          <i class=\"united kingdom flag\"></i> English\n        </div>\n\
  \        <input type=\"text\" placeholder=\"Enter word...\" v-model=\"english\"\
  \ :disabled=\"testOver\" autocomplete=\"off\" />\n      </div>\n\n      <button\
  \ class=\"positive ui button\" :disabled=\"testOver\">Submit</button>\n    </form>\n\
  \n    <p :class=\"['results', resultClass]\">\n      <span v-html=\"result\"></span>\n\
  \    </p>\n  </div>\n</template>\n\n<script>\nexport default {\n  name: 'vocab-test',\n\
  \  props: {\n    words: {\n      type: Array,\n      required: true\n    }\n  },\n\
  \  data() {\n    return {\n      randWords: [...this.words.sort(() => 0.5 - Math.random())],\n\
  \      incorrectGuesses: [],\n      result: '',\n      resultClass: '',\n      english:\
  \ '',\n      score: 0,\n      testOver: false\n    };\n  },\n  computed: {\n   \
  \ currWord: function() {\n      return this.randWords.length ? this.randWords[0]\
  \ : '';\n    }\n  },\n  methods: {\n    onSubmit: function() {\n      if (this.english\
  \ === this.currWord.english) {\n        this.flash('Correct!', 'success', { timeout:\
  \ 1000 });\n        this.score += 1;\n      } else {\n        this.flash('Wrong!',\
  \ 'error', { timeout: 1000 });\n        this.incorrectGuesses.push(this.currWord.german);\n\
  \      }\n\n      this.english = '';\n      this.randWords.shift();\n\n      if\
  \ (this.randWords.length === 0) {\n        this.testOver = true;\n        this.displayResults();\n\
  \      }\n    },\n    displayResults: function() {\n      if (this.incorrectGuesses.length\
  \ === 0) {\n        this.result = 'You got everything correct. Well done!';\n  \
  \      this.resultClass = 'success';\n      } else {\n        const incorrect =\
  \ this.incorrectGuesses.join(', ');\n        this.result = `<<strong>You got the\
  \ following words wrong:</strong> ${incorrect}`;\n        this.resultClass = 'error';\n\
  \      }\n    }\n  }\n};\n</script>\n\n<style scoped>\n.results {\n  margin: 25px\
  \ auto;\n  padding: 15px;\n  border-radius: 5px;\n}\n\n.error {\n  border: 1px solid\
  \ #ebccd1;\n  color: #a94442;\n  background-color: #f2dede;\n}\n\n.success {\n \
  \ border: 1px solid #d6e9c6;\n  color: #3c763d;\n  background-color: #dff0d8;\n\
  }\n</style>\n```\n\n本指南已经很长了，因此我不会解释每一行代码的作用。简而言之，我们通过 prop 的形式接收单词列表 `words`（这是一个对象数组）。然后我们声明了一些数据属性，大部分与测试显示有关。`randWords`\
  \ 属性利用扩展运算符和箭头函数来将单词排序为随机顺序。\n\n我们将 `currWord` 声明为[计算属性](https://vuejs.org/v2/guide/computed.html)，它将返回随机单词列表中的下一个单词。我使用计算属性是因为在\
  \ `onSubmit` 方法中，每当用户做出猜测时，我都会 `shift()` 移除 `randWords` 数组的第一个项。这样变异数组会导致 `currWord`\
  \ 重新计算，测试也会更新。\n\n最后，`onSubmit` 方法和 `displayResults` 方法处理表单提交（当用户做出猜测时）以及正如你可能猜到的，即结果的显示。\n\
  \n## 结论\n\n这是一个很长的教程，恭喜你坚持到了这里。我希望你现在更好地了如何设置一个 Vue.js 前端来消费 Node API，该 API 可以将数据持久化到数据库中。\n\
  \n请不要忘记，[完整代码可以在 GitHub 上找到](https://github.com/sitepoint-editors/vocab-builder)。\n\
  \n# 第 2 章：使用 Vue.js 封装的 Chart.js 创建精美图表\n\n## 作者：Yomi Eluwande\n\n图表是现代网站和应用程序的重要部分。在本指南中，我将展示如何使用\
  \ [Chart.js](https://www.chartjs.org/) 创建精美的图表。Vue.js 是一个渐进式框架，我们将配合 `canvas` 元素使用。如果你是\
  \ [Vue.js](https://vuejs.org/) 的新手，我们将使用 [Vue CLI](https://cli.vuejs.org/) 脚手架。\n\
  \n## 图表\n\n这是一个非常强大的 Vue 图表封装库。我们将使用：\n\n* `vue-charts`\n* `vue-chartjs`\n* `vue-chartkick`\n\
  \n剩下的就是编写测试本身。打开 `src/components/VocabTest.vue` 并添加以下内容：\n\n（此处代码已在上文展示...）\n\n\n\
  \n\n```\ntouch src/components/{LineChart.vue,BarChart.vue,BubbleChart.vue,Reactive.vue}\n\
  ```\n\n这些对应于我们将要使用的图表类型。\n\n最后，你可以删除 `src/views` 中的 `About.vue` 文件、`src/components`\
  \ 中的 `HelloWorld.vue` 文件，以及 `src` 下的 `assets` 文件夹。我们不需要这些。\n\n你的 `src` 目录的内容应该如下：\n\
  \n```\n.\n├── App.vue\n├── components\n│   ├── BarChart.vue\n│   ├── BubbleChart.vue\n\
  │   ├── LineChart.vue\n│   └── Reactive.vue\n├── main.js\n├── router.js\n└── views\n\
  \    ├── Home.vue\n    ├── VueChartJS.vue\n    ├── VueChartKick.vue\n    └── VueCharts.vue\n\
  ```\n\n## 添加路由\n\n我们接下来想要做的是创建不同的路由，以便查看上面创建的每个包装器的图表。我们希望有一个 `/charts` 路由来显示使用\
  \ `vue-charts` 包装器制作的图表，`/chartjs` 用于显示使用 `vue-chartjs` 包装器制作的图表，最后是 `/chartkick`\
  \ 用于显示使用 `vue-chartkick` 包装器制作的图表。我们还将保留 `/` 路由来显示 `Home` 视图。\n\n导航到应用的 `src` 文件夹并打开\
  \ `router.js` 文件。将该文件的内容替换为内容：\n\n```javascript\nimport Vue from 'vue'\nimport Router\
  \ from 'vue-router'\nimport Home from '@/views/Home'\nimport VueChartJS from '@/views/VueChartJS'\n\
  import VueChartKick from '@/views/VueChartKick'\nimport VueCharts from '@/views/VueCharts'\n\
  \nVue.use(Router)\n\nexport default new Router({\n  routes: [\n    {\n      path:\
  \ '/',\n      name: 'Home',\n      component: Home\n    },\n    {\n      path: '/chartjs',\n\
  \      name: 'VueChartJS',\n      component: VueChartJS\n    },\n    {\n      path:\
  \ '/chartkick',\n      name: 'VueChartKick',\n      component: VueChartKick\n  \
  \  },\n    {\n      path: '/charts',\n      name: 'VueCharts',\n      component:\
  \ VueCharts\n    }\n  ]\n})\n```\n\n在这里我们导入了上面创建的 Vue 组件。[组件](https://vuejs.org/v2/guide/components.html)\
  \ 是 Vue 最强大的功能之一。它们帮助我们扩展基础 HTML 元素以封装可重用的代码。从高层面上说，组件是 Vue 编译器附加行为的自定义元素。\n\n最后，我们定义了路由和组件，它们将为我们显示不同图表所需的不同页面提供服务。\n\
  \n## 添加导航\n\n我们可以在 `src/App.vue` 中定义跨组件使用的导航。我们还将添加一些基础样式：\n\n```html\n<template>\n\
  \  <div id=\"app\">\n    <div id=\"nav\">\n      <ul>\n        <li><router-link\
  \ to=\"/\">Home</router-link></li>\n        <li><router-link to=\"/chartjs\">vue-chartjs</router-link></li>\n\
  \        <li><router-link to=\"/charts\">vue-charts</router-link></li>\n       \
  \ <li><router-link to=\"/chartkick\">vue-chartkick</router-link></li>\n      </ul>\n\
  \    </div>\n    <router-view />\n  </div>\n</template>\n\n<style>\n#app {\n  font-family:\
  \ 'Avenir', Helvetica, Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n\
  \  -moz-osx-font-smoothing: grayscale;\n  text-align: center;\n  color: #2c3e50;\n\
  }\n\n#nav {\n  padding: 30px;\n  height: 90px;\n}\n\n#nav a {\n  font-weight: bold;\n\
  \  color: #2c3e50;\n  text-decoration: underline;\n}\n\n#nav a.router-link-exact-active\
  \ {\n  color: #42b983;\n  text-decoration: none;\n}\n\n#nav ul {\n  list-style-type:\
  \ none;\n  padding: 0;\n}\n\n#nav ul li {\n  display: inline-block;\n  margin: 0\
  \ 10px;\n}\n\nh1 {\n  font-size: 1.75em;\n}\n\nh2 {\n  line-height: 2.5em;\n  font-size:\
  \ 1.25em;\n}\n</style>\n```\n\n这里没有什么特别革命性的东西。注意 `<router-view />` 组件的使用，我们将在这里显示我们的视图。\n\
  \n## Home 组件\n\n如上所述，`Home` 组件充当默认（`/`）路由。打开它并将内容替换为下面的代码块：\n\n```html\n<template>\n\
  \  <section class=\"hero\">\n    <div class=\"hero-body\">\n      <div class=\"\
  container\">\n        <h1>Creating Beautiful Charts Using Vue.js Wrappers For Chart.js</h1>\n\
  \        <h2>\n          Read the article on SitePoint:\n          <a href=\"https://www.sitepoint.com/creating-beautiful-charts-vue-chart-js/\"\
  >\n            https://www.sitepoint.com/creating-beautiful-charts-vue-chart-js/\n\
  \          </a>\n        </h2>\n        <h3>\n          Download the repo from GitHub:\n\
  \          <a href=\"https://github.com/sitepoint/vue-charts\">\n            https://github.com/sitepoint/vue-charts\n\
  \          </a>\n        </h3>\n      </div>\n    </div>\n  </section>\n</template>\n\
  \n<script>\nexport default {\n  name: 'home'\n}\n</script>\n```\n\n## Bulma\n\n\
  在开始之前，还有一件事。我们将 [Bulma](https://bulma.io/) 框架添加到应用。\n\n在 `public/index.html` 文件中添加：\n\
  \n```html\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css\"\
  >\n```\n\n现在，访问 `http://localhost:8080`，你应该能看到\n\n## 使用 chartjs 制作图表\n\n我们接下来想要做的是使用\
  \ `vue-chartjs` 包装器制作路由来制作折线图、柱状图、气泡图和响应式布局。\n\n你的 `src` 目录的内容如下：\n\n```\n.\n├──\
  \ App.vue\n├── components\n│   ├── BarChart.vue\n│   ├── BubbleChart.vue\n│   ├──\
  \ LineChart.vue\n│   └── Reactive.vue\n├── main.js\n├── router.js\n└── views\n \
  \   ├── Home.vue\n    ├── VueChartJS.vue\n    ├── VueChartKick.vue\n    └── VueCharts.vue\n\
  ```\n\n## 使用 vue-charts 制作图表\n\n使用 `vue-charts` 包装器制作图表可以让我们轻松创建折线图、柱状图、气泡图和响应式布局。\n\
  \n### 使用 vue-chartjs 制作图表\n\n为了制作折线图，我们将在 `src/components` 文件夹中创建 `LineChart.vue`\
  \ 组件并添加以下代码：\n\n```javascript\n<script>\n  // 从 vue-chartjs 导入 Line 类\n  import\
  \ { Line } from 'vue-chartjs'\n\n  // 导出以便在组件中使用\n  export default {\n    extends:\
  \ Line,\n    data () {\n      return {\n        datacollection: {\n          //\
  \ 代表 x 轴的数据\n          labels: ['January', 'February', 'March', 'April', 'May',\
  \ 'June', 'July', 'August', 'September', 'October', 'November', 'December'],\n \
  \         datasets: [\n            {\n              label: 'Data One',\n       \
  \       backgroundColor: '#f87979',\n              pointBackgroundColor: 'white',\n\
  \              borderWidth: 1,\n              pointBorderColor: '#249EBF',\n   \
  \           // 代表 y 轴的数据\n              data: [40, 20, 30, 50, 90, 10, 20, 40, 50,\
  \ 70, 90, 100]\n            }\n          ]\n        },\n        // 控制图表外观的 Chart.js\
  \ 配置\n        options: {\n          scales: {\n            yAxes: [{\n         \
  \     ticks: {\n                beginAtZero: true\n              },\n          \
  \    gridLines: {\n                display: true\n              }\n            }],\n\
  \            xAxes: [ {\n              gridLines: {\n                display: false\n\
  \              }\n            }]\n          },\n          legend: {\n          \
  \  display: true\n          },\n          responsive: true,\n          maintainAspectRatio:\
  \ false\n        }\n      }\n    },\n    mounted () {\n      // renderChart 函数通过\
  \ datacollection 和 options 对象渲染图表\n      this.renderChart(this.datacollection, this.options)\n\
  \    }\n  }\n</script>\n```\n\n让我们讨论一下上面的代码的作用。我们首先做的是从 `vue-chartjs` 导入所需的图表类（在本例中为\
  \ `Line`）并将其导出。\n\n`data` 属性包含一个 `datacollection` 对象，包含了构建折线图所需的所有信息。这包括 Chart.js\
  \ 配置，例如代表 x 轴的 `labels`，代表 y 轴的 `datasets`，以及一个控制图表外观的 `options` 对象。\n\n`mounted`\
  \ 函数调用 `renderChart()`，通过传入 `datacollection` 和 `options` 对象来渲染图表。\n\n\n\n\n现在，让我们打开\
  \ `views/VueChartJS.vue` 文件并添加以下代码：\n\n```vue\n<template>\n  <section class=\"container\"\
  >\n    <h1>vue-chartjs 示例示例</h1>\n    <div class=\"columns\">\n      <div class=\"\
  column\">\n        <h3>折线图</h3>\n        <line-chart></line-chart>\n      </div>\n\
  \      <div class=\"column\">\n        <h3>柱状图</h3>\n        <!--Bar Chart example-->\n\
  \      </div>\n    </div>\n    <div class=\"columns\">\n      <div class=\"column\"\
  >\n        <h3>气泡图</h3>\n        <!--Bubble Chart example-->\n      </div>\n   \
  \   <div class=\"column\">\n        <h3>响应式 - 当数据集变化时实时更新</h3>\n        <!--Reactivity\
  \ Line Chart example-->\n      </div>\n    </div>\n  </section>\n</template>\n\n\
  <script>\n  import LineChart from '@/components/LineChart'\n  import BarChart from\
  \ '@/components/BarChart'\n  import BubbleChart from '@/components/BubbleChart'\n\
  \  import Reactive from '@/components/Reactive'\n\n  export default {\n    name:\
  \ 'VueChartJS',\n    components: {\n      LineChart,\n      BarChart,\n      BubbleChart,\n\
  \      Reactive\n    }\n  }\n</script>\n```\n\n`VueChartJS.vue` 文件包含了持有 HTML 代码的\
  \ `template` 部分、持有 JavaScript 代码的 `script` 部分，以及持有 CSS 代码的 `style` 部分。\n\n在 `template`\
  \ 部分中，我们使用了 Bulma 的 `columns` 类来创建一个具有两列和两行的布局。我们还添加了 `line-chart` 组件，该组件将在 `script`\
  \ 部分中创建。\n\n在 `script` 部分中，我们导入了之前创建的 `.vue` 文件，并在 `components` 对象中引用了它们。这意味着我们之后可以像这样在\
  \ HTML 代码中使用运行它们：`line-chart`、`bar-chart`、`bubble-chart` 和 `reactive`。\n\n现在，如果你导航到\
  \ `/chartjs`，折线图应该显示在该页面上。\n\n### 实时代码\n\n![折线图](img/charts1.png)\n\n查看 Pen [vue-chart.js\
  \ - line chart](https://codepen.io/SitePoint/pen/zdGNNz/)\n\n### 柱状图\n\n对于下一个图表，我们将创建一个专门用于渲染柱状图的自定义组件。打开\
  \ `src/components` 文件夹内的 `BarChart.vue` 组件文件并添加以下代码：\n\n```vue\n<script>\n  // 从\
  \ vue-chartjs 包装器导入 Bar 类\n  import { Bar } from 'vue-chartjs'\n  // 导出此以便在其他组件中使用\n\
  \  export default {\n    extends: Bar,\n    data () {\n      return {\n        datacollection:\
  \ {\n          // 显示在 x 轴上的数据标签\n          labels: ['January', 'February', 'March',\
  \ 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November',\
  \ 'December'],\n          datasets: [\n            {\n              label: 'Data\
  \ One',\n              backgroundColor: '#f87979',\n              pointBackgroundColor:\
  \ 'white',\n              borderWidth: 1,\n              pointBorderColor: '#249EBF',\n\
  \              // 显示在 y 轴上的数据\n              data: [40, 20, 30, 50, 90, 10, 20,\
  \ 40, 50, 70, 90, 100]\n            }\n          ]\n        },\n        // 控制图表外观的\
  \ Chart.js 选项\n        options: {\n          scales: {\n            yAxes: [{\n\
  \              ticks: {\n                beginAtZero: true\n              },\n \
  \             gridLines: {\n                display: true\n              }\n   \
  \         }],\n            xAxes: [ {\n              gridLines: {\n            \
  \    display: false\n              }\n            }]\n          },\n          legend:\
  \ {\n            display: true\n          },\n          responsive: true,\n    \
  \      maintainAspectRatio: false\n        }\n      }\n    },\n    mounted () {\n\
  \      // renderChart 函数使用 datacollection 和 options 对象渲染图表\n      this.renderChart(this.datacollection,\
  \ this.options)\n    }\n  }\n</script>\n```\n\n上面的代码原理与 `LineChart.vue` 文件中的代码类似。唯一的区别是这里导入并扩展了\
  \ `Bar` 类，而不是 `Line` 类。\n\n还有一点：在我们看到柱状图之前，我们需要编辑 `VueChartJS.vue` 文件，并将 `<!--Bar\
  \ Chart example-->` 替换为 `<bar-chart></bar-chart>`。我们只是在 HTML 模板中使用了我们在内部创建的 Bar\
  \ 组件。\n\n### 实时代码\n\n![柱状图](img/charts2.png)\n\n查看 Pen [vuechart-js - bar chart](https://codepen.io/SitePoint/pen/LjVxym)。\n\
  \n### 气泡图\n\n对于气泡图，我们将创建一个专门用于渲染气泡图的组件。\n\n### 气泡图\n\n气泡图使用气泡/圆形以三维方法 (x, y, r)\
  \ 显示数据。`x` 用于显示水平轴数据，`y` 用于显示垂直数据，而 `r` 用于显示大小。\n\n打开 `src/components` 文件夹内的 `BubbleChart.vue`\
  \ 组件并输入以下代码：\n\n```vue\n<script>\n  // 从 vue-chartjs 包装器导入 Bubble 类\n  import {\
  \ Bubble } from 'vue-chartjs'\n  // 导出此以便在其他组件中使用\n  export default {\n    extends:\
  \ Bubble,\n    data () {\n      return {\n        datacollection: {\n          //\
  \ 显示在 x 轴上的数据\n          labels: ['January', 'February', 'March', 'April', 'May',\
  \ 'June', 'July', 'August', 'September', 'October', 'November', 'December'],\n \
  \         datasets: [\n            {\n              label: 'Data One',\n       \
  \       backgroundColor: '#f87979',\n              pointBackgroundColor: 'white',\n\
  \              borderWidth: 1,\n              pointBorderColor: '#249EBF',\n   \
  \           // 显示在 y 轴上的数据\n              data: [40, 20, 30, 50, 90, 10, 20, 40,\
  \ 50, 70, 90, 100]\n            }\n          ]\n        },\n        // 控制图表外观的 Chart.js\
  \ 选项\n        options: {\n          scales: {\n            yAxes: [{\n         \
  \     ticks: {\n                beginAtZero: true\n              },\n          \
  \    gridLines: {\n                display: true\n              }\n            }],\n\
  \            xAxes: [ {\n              gridLines: {\n                display: false\n\
  \              }\n            }]\n          },\n          legend: {\n          \
  \  display: true\n          },\n          responsive: true,\n          maintainAspectRatio:\
  \ false\n        }\n      }\n    },\n    mounted () {\n      // renderChart 函数使用\
  \ datacollection 和 options 对象渲染图表\n      this.renderChart(this.datacollection, this.options)\n\
  \    }\n  }\n</script>\n```\n\n在我们看到气泡图之前，我们还需要做一件事——和对其他图表的操作一样：编辑 `VueChartJS.vue`\
  \ 文件并将 `<!--Bubble Chart example-->` 替换为 `<bubble-chart></bubble-chart>`。\n\n###\
  \ 实时代码\n\n![气泡图](img/charts3.png)\n\n查看 Pen [vue-chartjs - bubble chart](https://codepen.io/SitePoint/pen/mMJRxg)。\n\
  \n### 展示响应式的柱状图\n\n我们将用 `vue-chartjs` 演示的最后一个示例是如何使用它来创建一个当数据集发生变化时自动更新的图表。需要注意的是，Chart.js\
  \ 通常不提供此功能，但 `vue-chartjs` 提供了——借助这两个混入（mixins）之一：\n\n*   `reactiveProp`\n\n*  \
  \ `reactiveData`\n\n打开 `src/components` 文件夹内的 `Reactive.vue` 组件文件并输入以下代码：\n\n\n\n\
  \n```javascript\n<script>\n  // 从 vue-chartjs 封装导入 Bar 和 mixins 类\n  import { Bar,\
  \ mixins } from 'vue-chartjs'\n  // 从 mixins 模块获取 reactiveProp mixin。\n  const {\
  \ reactiveProp } = mixins\n  export default Bar.extend({\n    mixins: [ reactiveProp\
  \ ],\n    data () {\n      return {\n        // 控制图表外观的 Chart.js 选项\n        options:\
  \ {\n          scales: {\n            yAxes: [{\n              ticks: {\n      \
  \          beginAtZero: true\n              },\n              gridLines: {\n   \
  \             display: true\n              }\n            }],\n            xAxes:\
  \ [ {\n              gridLines: {\n                display: false\n            \
  \  }\n            }]\n          },\n          legend: {\n            display: true\n\
  \          },\n          responsive: true,\n          maintainAspectRatio: false\n\
  \        }\n      }\n    },\n    mounted () {\n      // this.chartData 在 mixin 中创建，包含了构建图表所需的所有数据。\n\
  \      this.renderChart(this.chartData, this.options)\n    }\n  })\n</script>\n\
  ```\n\n我们在上面的代码中做的第一件事是从 `vue-chartjs` 封装中导入 `Bar` 和 `mixins` 类并扩展 `Bar`。我们还从 `mixins`\
  \ 模块提取了 `reactiveProp` mixin 以用于响应式。\n\n`reactiveProp` mixin 扩展了你的图表组件的逻辑，自动创建一个名为\
  \ `chartData` 的 prop，并为此 prop 添加了一个 Vue 监听器（watcher）。这次我们没有创建 `dataset` 对象，因为所有需要的数据将在\
  \ `chartData` prop 中。\n\n为了让其生效，我们需要进一步编辑 `VueChartJS.vue`。打开 `VueChartJS.vue`，在\
  \ `components` 属性之后添加以下代码：\n\n```javascript\ndata () {\n  return {\n    // 使用 null\
  \ 实例化 datacollection\n    datacollection: null\n  }\n},\ncreated () {\n  // 每当 vue\
  \ 实例被创建时，调用 fillData() 函数。\n  this.fillData()\n},\nmethods: {\n  fillData () {\n\
  \    this.datacollection = {\n      // 图表 y 轴的数据\n      labels: ['January', 'February',\
  \ 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November',\
  \ 'December'],\n      datasets: [\n        {\n          label: 'Data One',\n   \
  \       backgroundColor: '#f87979',\n          // 图表 x 轴的数据\n          data: [this.getRandomInt(),\
  \ this.getRandomInt(), this.getRandomInt(), this.getRandomInt(), this.getRandomInt(),\
  \ this.getRandomInt(), this.getRandomInt(), this.getRandomInt(), this.getRandomInt(),\
  \ this.getRandomInt(), this.getRandomInt(), this.getRandomInt()]\n        }\n  \
  \    ]\n    }\n  },\n  getRandomInt () {\n    // 用于图表的数字生成 JS 函数\n    return Math.floor(Math.random()\
  \ * (50 - 5 + 1)) + 5\n  }\n}\n```\n\n让我们过一遍上面的代码。在 `data` 对象中，我们返回 `datacollection`，它被设置为\
  \ `null`；在 `created` 方法中，每当组件实例被创建时，我们都会调用 `fillData()`。`fillData` 函数将在 `methods`\
  \ 对象中创建。\n\n在 `methods` 对象中，我们创建了一个名为 `fillData` 的函数。该函数创建了一个 `datacollection` 对象，其中包含一个\
  \ `label` 数组（x 轴数据）和一个 `datasets` 数组，后者持有 y 轴所需的 `data` 数组。\n\n### getRandomInt\n\
  \n`data` 数组的内容是一个 `getRandomInt` 函数，它为我们生成随机数。\n\n最后，为了显示图表并检查响应式是否工作，将 `<!--Reactivity\
  \ Line Chart example-->` 替换为内容：\n\n```html\n<reactive :chart-data=\"datacollection\"\
  ></reactive>\n<button class=\"button is-primary\" @click=\"fillData()\">Randomize</button>\n\
  ```\n\n我们使用了创建的 `reactive` 组件，并将 `datacollection` 的内容传递给 `chart-data` prop 以显示图表。我们\
  \ true true 按钮，每次点击时都会调用 `fillData()` 方法。\n\n导航到应用中的 `/chartjs` 路由查看新图表，点击 `Randomize`\
  \ 按钮查看图表如何根据新数据实时自动重新渲染。\n\n### Live Code\n\n![reactive bar chart](img/charts4.png)\n\
  \n查看 Pen [vue-chartjs - reactive bar chart](https://codepen.io/SitePoint/pen/dzoNxr/)。\n\
  \n## 使用 vue-charts 制作图表\n\n`vue-charts` 构建图表的方法与 `vue-chartjs` 非常不同。它不需要你创建单独的组件来处理数据和渲染图表。图表所需的数据可以这样在\
  \ Vue 实例中实例化：\n\n```javascript\ndata () {\n  return {\n    labels: ['January', 'February',\
  \ 'March', 'April', 'May', 'June', 'July'],\n    dataset: [65, 59, 80, 81, 56, 55,\
  \ 40]\n  }\n}\n```\n\n我们可以轻松地显示图表。\n\n\n\n\n\n`addData` 方法将数据表单输入和标签表单输入（我们很快就会添加）的当前值推送到当前数据集中。现在让我们也添加组件以及用于添加新数据和标签的表单。\n\
  \n将以下代码段替换掉注释 `<!--Data Binding Line Chart Example-->`：\n\n```\n<form @submit.prevent=\"\
  addData\">\n  <input placeholder=\"Add a Data\" v-model=\"dataentry\">\n  <input\
  \ placeholder=\"Add a Label\" v-model=\"datalabel\">\n  <button type=\"submit\"\
  >Submit</button>\n</form>\n<chartjs-line :labels=\"labels\" :data=\"dataset\" :bind=\"\
  true\"></chartjs-line>\n```\n\n上面的代码是一个表单，允许你输入数据和标签的值并提交表单。图表将根据最新输入自动渲染。\n\n###\
  \ 实时代码\n\n![vue charts data binding](img/charts6.png)\n\n查看 Pen [vue-charts data\
  \ binding](https://codepen.io/SitePoint/pen/eENvmV/)。\n\n## 使用 vue-chartkick 图表\n\
  \n[`vue-chartkick](https://github.com/ankane/vue-chartkick) 是一个 Vue 封装器，允许你通过一行代码创建精美的图表。我们将通过四个示例演示此库的使用。我们将创建一个折线图、柱状图、散点图，并使用下载功能（可下载图表）。\n\
  \n在处理图表数据集的数据方面，`vue-chartkick` 为我们提供了两个选项。我们可以像 `<bar-chart :data=\"['Work', 1322],\
  \ ['Play', 1492]]\"></bar-chart>` 这样的操作，内联添加数据；或者使用 `<line-chart :data=\"chartData\"\
  ></line-chart>`，并在 Vue 数据对象中声明 `chartData` 数组：\n\n```\ndata () {\n  return {\n \
  \   chartData: [['Jan', 44], ['Feb', 27], ['Mar', 60], ['Apr', 55], ['May', 37],\
  \ ['Jun', 40], ['Jul', 69], ['Aug', 33], ['Sept', 76], ['Oct', 90], ['Nov', 34],\
  \ ['Dec', 22]]\n  }\n}\n```\n\n让我们开始使用 vue-chartkick。在继续之前，打开 `src` 文件夹内的 `main.js`\
  \ 文件并添加以下代码：\n\n```\nimport Chartkick from 'chartkick'\nimport VueChartkick from\
  \ 'vue-chartkick'\n\nVue.use(VueChartkick, { Chartkick })\n```\n\n我们从 `node_modules`\
  \ 导入 `Chartkick` 库和 `vue-chartkick` 封装器，并通过 `Vue.use(VueChartkick, { Chartkick })`\
  \ 将其全局注册。\n\n要开始使用 vue-chartkick 创建图表，打开我们之前创建的 `VueChartKick.vue` 文件并添加以下代码：\n\n\
  ```\n<template>\n  <section class=\"container\">\n    <h1>Demo examples of vue-chartkick</h1>\n\
  \    <div class=\"columns\">\n      <div class=\"column\">\n        <h3>Line Chart</h3>\n\
  \        <!--Line Chart example-->\n      </div>\n      <div class=\"column\">\n\
  \        <h3>Bar Chart</h3>\n        <!--Bar Chart example-->\n      </div>\n  \
  \  </div>\n    <div class=\"columns\">\n      <div class=\"column\">\n        <h3>Scatter\
  \ Chart</h3>\n        <!--Scatter chart example-->\n      </div>\n      <div class=\"\
  column\">\n        <h3>Downloadable Line Chart</h3>\n        <!--Downloadable line\
  \ chart-->\n      </div>\n    </div>\n  </section>\n</template>\n\n<script>\n  export\
  \ default {\n    name: 'VueChartKick',\n    data () {\n      return {\n        chartData:\
  \ [['Jan', 44], ['Feb', 27], ['Mar', 60], ['Apr', 55], ['May', 37], ['Jun', 40],\
  \ ['Jul', 69], ['Aug', 33], ['Sept', 76], ['Oct', 90], ['Nov', 34], ['Dec', 22]]\n\
  \      }\n    }\n  }\n</script>\n```\n\n在上面的代码块中，我们再次为要创建的不同类型的图表创建了占位符，我们要做的只是开始将它们填充进去。\n\
  \n我们在 `script` 部分的 `data` 对象中创建了 `chartData` 数组，包含了用于各种图表的数据。现在开始创建图表吧。\n\n### 折线图\n\
  \n使用 `vue-chartkick` 创建折线图非常简单且直接。你所做的就是引入 `vue-chartkick` 的 `line-chart` 组件，并确定你想使用的数据集——类似于这样：`<line-chart\
  \ :data=\"chartData\"></line-chart>`。在这种情况下，`data` 属性被设置为 Vue `data` 对象中的 `chartData`\
  \ 数组。\n\n因此，将 `VueChartKick.vue` 文件中的注释 `<!--Line Chart example-->` 替换为 `<line-chart\
  \ :data=\"chartData\"></line-chart>`，折线图现在就能正常显示了。\n\n### 柱状图\n\n我们可以用与上面创建折线图相同的方法创建柱状图。但情况下，我们将尝试不同的方法。我们不再使用\
  \ `chartData` 数组作为数据集，而是在属性内部添加数据集，例如：`<bar-chart :data=\"['Work', 1322], ['Play',\
  \ 1492]]\"></bar-chart>`。\n\n将 `VueChartKick.vue` 文件中的注释 `<!--Bar Chart example-->`\
  \ 替换为 `<bar-chart :data=\"['Work', 1322], ['Play', 1492]]\"></bar-chart>`，你的柱状图现在就能正常显示了。\n\
  \n### 散点图\n\n散点图也与上面的折线图和柱状图一样。将 `VueChartKick.vue` 文件中的注释 `<!--Scatter Chart example-->`\
  \ 替换为 `<scatter-chart :data=\"[[174.0, 80.0], [176.5, 82.3], [180.3, 73.6]]\"></scatter-chart>`，你的散点图现在就能正常显示了。\n\
  \n### 下载图表\n\n`vue-chartkick` 有一个 `vue-chartjs` 和 `vue-charts` 所缺乏的酷功能：创建可下载图表。一旦图表设置为可下载，用户就可以将图保存为图像。它是如何工作的？让我们通过折线图来检查一下：\n\
  \n```\n<line-chart :data=\"chartData\" :download=\"true\"></line-chart>\n```\n\n\
  将 `VueChartKick.vue` 文件中的注释 `<!--Downloadable line chart-->` 替换为 `<line-chart :data=\"\
  chartData\" :download=\"true\"></line-chart>` 以查看下载按钮。\n\n\n\n\n本教程的源代码可以在 [GitHub\
  \ 上获取](https://github.com/sitepoint-editors/vue-charts)，如果你想查看此教程的在线演示，也可以点击[此处](https://vue-charts.herokuapp.com/)查看。\n\
  \n# 第 3 章：使用 Pusher 和 Vue.js 构建一个实时聊天应用\n\n## 作者：Michael Wanyoike\n\n实时通信应用如今变得越来越流行，因为它们提供了更流畅、更自然的用户体验。\n\
  \n在本教程中，我们将使用由 [Pusher](https://pusher.com) 提供的 [ChatKit](https://pusher.com/chatkit)\
  \ 构建的 Vue.js 实时聊天应用。ChatKit 服务将为我们提供在任何设备上构建聊天应用所需的完整后端，我们只需要专注于构建通过 [ChatKit 客户端包](https://www.npmjs.com/package/@pusher/chatkit-client)\
  \ 连接到 ChatKit 服务的前端用户界面。\n\n## 前提条件\n\n这是一个中高级别水平教程。你需要熟悉以下概念才能进行学习：\n\n*   Vue.js\
  \ 基础\n*   Vuex 基础\n*   使用 CSS 框架\n\n你还需要在电脑上安装 Node。你可以从[官网](https://nodejs.org/)\
  \ 下载二进制文件，或者使用[版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。这可能是最简单的方法，因为它允许你在同一台机器上管理多个版本的\
  \ Node。\n\n最后，你需要运行以下命令全局安装 Vue CLI：\n\n```\nnpm install -g @vue/cli\n```\n\n在编写此文档时，Node\
  \ 10.14.1 和 Vue CLI 3.2.1 是最新版本。\n\n## 关于项目\n\n我们将构建一个类似于 Slack 或 Discord 的基础聊天应用。该应用将具备以下功能：\n\
  \n*   拥有多个频道（channels）和房间（rooms）\n*   列出房间成员并检测在线状态\n*   检测其他用户正在输入\n\n正如前面提到的，我们只构建前端。ChatKit\
  \ 服务有一个后端接口，允许我们管理用户、权限和房间。\n\n你可以在 [GitHub](https://github.com/sitepoint-editors/vue-chatkit)\
  \ 上找到该项目的完整代码。\n\n## 设置 ChatKit 实例\n\n让我们创建一个 ChatKit 实例，如果你熟悉 Discord，这类似于服务器实例。\n\
  \n前往 Pusher 网站上的 [ChatKit](https://pusher.com/chatkit) 页面并点击 `Sign Up` 按钮。系统会提示电子邮件和密码，以及使用\
  \ GitHub 或 Google 登录的选项。\n\n选择最适合你的选项，然后在下一个屏幕填写一些详情，如 `Name`（名称）、`Account type`（账户类型）、`User\
  \ role`（用户角色）等。\n\n点击 `Complete Onboarding` 将进入 Pusher 主仪表板。在这里，你应该点击 ChatKit 产品。\n\
  \n![The ChatKit dashboard](img/chatkit-dashboard.png)\n\n点击 Create 按钮创建一个新的 ChatKit\
  \ 实例。我将我的命名为 `VueChatTut`。\n\n![Creating a new ChatKit instance](img/create-chatkit-instance.png)\n\
  \n本教程将使用免费计划。它支持多达 1,000 个独立用户，对于我们的需求来说绰绰有余。进入 `Console` 标签页。你需要创建一个用户来开始。点击 `Create\
  \ User` 按钮。\n\n![Creating a ChatKit user](img/chatkit-create-user.png)\n\n我将用户命名为“john”（`User\
  \ Identifier`）和“John Wick”（`Display Name`），但你可以随心所欲命名。部分很简单：创建两个或多个用户。例如：\n\n* \
  \  salt, Evelyn Salt\n*   hunt, Ethan Hunt\n\n创建三个或多个房间并分配用户。例如：\n\n*   General\
  \ (john, salt, hunt)\n*   Weapons (john, salt)\n*   Combat (john, hunt)\n\n这里是你的\
  \ `Console` 界面应该的样子。\n\n![A snapshot of the console](img/create-users-and-rooms.png)\n\
  \n接下来，你可以进入 `Rooms` 标签页，并为每个房间使用选定的用户创建消息。这是为了测试。然后进入 `Credentials` 标签页并记录 `Instance\
  \ Locator`（实例定位符）。我们需要激活用于生成 HTTP 端点的 `Test Token Provider`，并将其记录下来。\n\n![Test token](img/test-token.png)\n\
  \n我们的 ChatKit 后端现在已就绪。让我们开始构建 Vue.js 前端。\n\n## 搭建 Vue.js 项目\n\n打开终端并按照如下命令创建项目：\n\
  \n```\nvue create vue-chatkit\n```\n\n选择 `Manually select features` 并按如下所示回答问题。\n\
  \n![Questions to be answered](img/create-project.png)\n\n务确保你已选择了 Babel、Vuex 和 Vue\
  \ Router 作为附加功能。接下来，按照以下结构创建相应的文件夹和文件：\n\n![Files and folders to create](img/project-structure.png)\n\
  \n确保按照演示创建所有文件夹和文件。删除上述插图中未出现的任何不需要的文件。\n\n\n\n\n```javascript\nimport Vue from\
  \ 'vue'\nimport Router from 'vue-router'\nimport Login from './views/Login.vue'\n\
  import ChatDashboard from './views/ChatDashboard.vue'\n\nVue.use(Router)\n\nexport\
  \ default new Router({\n  mode: 'history',\n  base: process.env.BASE_URL,\n  routes:\
  \ [\n    {\n      path: '/',\n      name: 'login',\n      component: Login\n   \
  \ },\n    {\n      path: '/chat',\n      name: 'chat',\n      component: ChatDashboard,\n\
  \    }\n  ]\n})\n```\n\n更新 `src/store/index.js`:\n\n```javascript\nimport Vue from\
  \ 'vue'\nimport Vuex from 'vuex'\nimport VuexPersistence from 'vuex-persist'\nimport\
  \ mutations from './mutations'\nimport actions from './actions'\n\nVue.use(Vuex)\n\
  \nconst debug = process.env.NODE_ENV !== 'production'\n\nconst vuexLocal = new VuexPersistence({\n\
  \  storage: window.localStorage\n})\n\nexport default new Vuex.Store({\n  state:\
  \ {\n  },\n  mutations,\n  actions,\n  getters: {\n  },\n  plugins: [vuexLocal.plugin],\n\
  \  strict: debug\n})\n```\n\n`vuex-persist` 包确保了我们的 Vuex 状态在页面重载或刷新之间被保存。\n\n我们的项目现在应该能够无错误地编译了。不过，先不要运行它，因为我们需要构建用户界面。\n\
  \n## 构建 UI 界面\n\n让我们先按照以下方式更新 `src/App.vue`：\n\n```html\n<template>\n  <div id=\"\
