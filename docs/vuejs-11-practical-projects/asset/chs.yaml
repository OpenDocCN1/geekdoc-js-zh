  \ Alex Walker\n* **项目编辑：** James Hibbard\n\n\n\n\n![SitePoint logo](img/sitepoint-logo-2012.png)\n\
  \n\n\n# 前言\n\n自 2014 年发布以来，Vue.js 的人气经历了如飞升般的增长，现在被认为是主要的 own 框架之一，这并非没有理由。它基于组件的架构设计得非常灵活且易于采用，使其能够轻松地集成到项目中并与非\
  \ Vue 代码一起使用，同时也构建复杂的客户端应用程序同样简单。\n\n本书包含了精选的 11 个实用项目，涵盖了使用 Vue 开发的各个方面。它包含：\n\n\
  1. *使用 Vue.js、Node 和 MongoDB 构建基础 CRUD 应用*，作者：James Hibbard\n2. *使用 Chart.js 的 Vue\
  \ 封装创建精美图表*，作者：Yomi Eluwande\n3. *使用 Pusher 和 Vue.js 构建实时应用*，作者：Michael Wanyoike\n\
  4. *为无头 CMS 构建 Vue 前端*，作者：Michael Wanyoike\n5. *使用 Vue 构建 Chrome 扩展*，作者：James Hibbard\n\
  6. *使用 Nuxt.js 和 vue-kindergarten 构建自己的链接分享网站*，作者：Nilson Jacques\n7. *Vue 和 D3.js\
  \ 数据可视化简介*，作者：Christopher Vundi\n8. *使用 Vue 构建可复组件*，作者：Deji Atoyebi\n9. *使用 Vue.js\
  \ 开发游戏*，作者：Ivaylo Gerchev\n10. *使用 Vue、Vuex 和 Bootstrap Vue 构建购物列表应用*，作者：Michael\
  \ Wanyoike\n11. *使用 Storybook 开发和测试 Vue 组件*，作者：Ivaylo Gerchev\n\n## 谁应该读这本书？\n\n\
  本书适合具有 JavaScript 经验的开发者。\n\n## 使用规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n```\n <h1>一个完美的夏日</h1>\n\
  <p>这是一个在公园散步的美好日子。\n鸟儿在歌唱，孩子们都已回学校了。</p> \n```\n\n当需要现有代码作为上下文，而不是重复全部内容时，将显示 ⋮：\n\
  \n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\n某些代码行应该在一行内输入，但由于页面限制，我们对它们进行了换行。➥\
  \ 表示仅为了格式化而存在的换行符，应该被忽略：\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
  ➥design-real-user-testing/?responsive1\");\n```\n\n你会注意到，我们在本书中使用了一些特定的布局样式来表示不同类型的信息。请关注以下项目。\n\
