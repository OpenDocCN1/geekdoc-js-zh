    # Cinematic Effects


    In addition to Ajax and drag-and-drop tools, Rico also makes available a host
    of user interface gadgets known collectively as cinematic effects.


    By the Way


    > Rico''s cinematic effects are extensions to the Effect class found in prototype.js.


    These effects include animation of page elements (changing their sizes and/or
    shapes), fading effects (altering the opacity of page elements), applying rounded
    corners to objects, and manipulating object colors.


    Used alongside the interface techniques previously discussed, these effects can
    help you to build sophisticated, eye-catching, and user-friendly interfaces much
    more reminiscent of desktop applications than web pages.


    # Summary


    Following our examination of the prototype.js library in Chapter 25, this chapter
    moved on to experiment with Rico. Rico is an open source framework based on prototype.js
    that offers a simple way to integrate Ajax, along with drag-and-drop and other
    visual effects, into user interface designs.


    In Chapter 27, we''ll have a brief look at another toolkit based on prototype.js,
    namely Script.aculo.us.'
