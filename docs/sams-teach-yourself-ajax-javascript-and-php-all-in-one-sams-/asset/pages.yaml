  md: '# CHAPTER 6: Using Variables, Strings, and Arrays


    If you try to calculate this result, there are two ways to do it. You could multiply
    5 * 3 first and then add 4 (result: 19) or add 4 + 5 first and then multiply by
    3 (result: 27). JavaScript solves this dilemma by following the precedence rules:
    Because multiplication has a higher precedence than addition, it multiplies 5
    * 3 and then adds 4, producing a result of 19.


    > If you''re familiar with any other programming languages, you''ll find the operators
    and precedence in JavaScript work, for the most part, the same way as those in
    C, C++, and Java.


    Sometimes operator precedence doesn''t produce the result you want. For example,
    this statement:


    ```

    result = a + b + c + d / 4;

    ```


    This is an attempt to average four numbers by adding them all together and then
    dividing by four. However, because JavaScript gives division a higher precedence
    than addition, it will divide the d variable by 4 before adding the other numbers,
    producing an incorrect result.


    You can control precedence by using parentheses. Here''s the working statement
    to calculate an average:


    ```

    result = (a + b + c + d) / 4;

    ```


    The parentheses ensure that the variables are added first, and then the sum is
    divided by four.


    > If you''re unsure about operator precedence, you can use parentheses to make
    sure things work the way you expect and to make your script more readable.


