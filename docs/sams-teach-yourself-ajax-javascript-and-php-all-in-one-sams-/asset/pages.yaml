    # Understanding Variables


    In PHP, a variable name is always prefixed with a dollar sign. For instance, you
    could have a variable called number that holds the value 5 or a variable called
    name that holds the value Chris. The following PHP code declares variables with
    those names and values:


    ```

    $number = 5;

    $name = "Chris";

