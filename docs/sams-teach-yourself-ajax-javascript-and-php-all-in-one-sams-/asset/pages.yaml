    ```


    The complementary function to gettype is settype, which allows you to override
    the data type of a variable. If the stored value is not suitable to be stored
    in the new type, it will be modified to the closest value possible.


    # Working with Numbers


    As you would expect, PHP includes all the basic arithmetic operators.


    # Arithmetic Operators


    Addition is performed with the plus symbol (+). This example adds 6 and 12 together
    and displays the result:


    ```

    echo 6 + 12;

    ```


    Subtraction is performed with the minus symbol:


    ```

    echo 24 - 5;

    ```


    The minus symbol can also be used to negate a number (for example, -20).


    Multiplication is performed with the asterisk symbol:


    ```

    echo 4 * 9;

    ```'
