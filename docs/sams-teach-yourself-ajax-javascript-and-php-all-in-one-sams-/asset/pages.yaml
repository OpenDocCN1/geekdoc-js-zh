  md: '# Using String Objects


    You''ve already used several strings during the first few chapters of this book.
    Strings store a group of text characters, and are named similarly to other variables.
    As a simple example, this statement assigns the string This is a test to a string
    variable called test.


    test = "This is a test";


    # Creating a String Object


    JavaScript stores strings as String objects. You usually don''t need to worry
    about this, but it will explain some of the techniques for working with strings,
    which use methods (built-in functions) of the String object.


    There are two ways to create a new String object. The first is the one you''ve
    already, whereas the second uses object-oriented syntax. The following two statements
    create the same string:


    test = "This is a test";

    test = new String("This is a test");


    The second statement uses the new keyword, which you use to create objects. This
    tells the browser to create a new String object containing the text This is a
    test, and assigns it to the variable test.


    > Although you can create a string using object-oriented syntax, the JavaScript
    syntax is simpler, and there is no difference in the strings created by these
    two methods.


    By the Way


    # Assigning a Value


    You can assign a value to a string in the same way as any other variable. Both
    of the examples in the previous section assign an initial value to the string.
    You can also assign a value after the string has already been created. For example,
    the following statement replaces the contents of the test variable with a new
    string:


    test = "This is only a test";


    You can also use the concatenation operator (+) to combine the values of two strings.
    Listing 6.1 shows a simple example of assigning and combining the values of strings.'
