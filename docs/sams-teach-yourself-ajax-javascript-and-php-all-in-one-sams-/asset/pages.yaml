    # Event Handlers


    As already mentioned, not all scripts are located within <script> tags. You can
    also use scripts as event handlers. Although this might sound like a complex programming
    term, it actually means exactly what it says: Event handlers are scripts that
    handle events.


    In real life, an event is something that happens to us. For example, the things
    you write on your calendar are events: "Dentist appointment" or "Fred''s birthday."
    You also encounter unscheduled events in your life: for example, a traffic ticket,
    an IRS audit, or an unexpected visit from relatives.'
