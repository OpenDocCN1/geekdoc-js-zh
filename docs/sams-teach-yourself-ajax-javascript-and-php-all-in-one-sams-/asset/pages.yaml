  md: '# Arguments and Return Values


    The function keyword defines a function called add_tax that will execute the code
    block that follows. The code that makes up a function is always contained in braces.
    Putting $amount in parentheses after the name stipulates that add_tax takes a
    single argument that will be stored in a variable $amount inside the function.


    The first line of the function code is a simple calculation that multiplies $amount
    by 1.09—which is equivalent to adding 9% to that value—and assigns the result
    to $total. The return keyword is followed by the value that is to be returned
    when the function is called from within the script.


    Running this example produces the following output:

    Price before tax: 16

    Price after tax: 17.44


    This is an example of a function that you might use in many places in a web page;
    for instance, on a page that lists all the products available in an online store,
    you would call this function once for each item that is displayed to show the
    after-tax price. If the rate of tax changes, you only need to change the formula
    in add_tax to alter every price displayed on that page.


    # Arguments and Return Values


    Every function consists of the function name followed by a list of arguments in
    parentheses. If there is more than one argument, the list items are separated
    by commas. Some functions do not require any arguments at all, but a pair of parentheses
    is still required—even if there are no arguments contained in them.


    The built-in function phpinfo generates a web page that contains a lot of information
    about the PHP module. This function does not require any arguments, so it can
    be called from a script that is as simple as


    ```

    <php phpinfo();?>

    ```


    If you create this script and point it to a web browser at it, you will see a
    web page that contains system information and configuration settings.


    # Returning Success or Failure


    Because phpinfo generates its own output, you do not need to prefix it with echo,
    but, for the same reason, you cannot assign the web page it produces to a variable.
    In fact, the return value from phpinfo is the integer value 1.'
  merge: -1
  pgno: 240
- img_proc: true
  md: "# CHAPTER 17: Functions\n\nFunctions that do not have an explicit return value\
