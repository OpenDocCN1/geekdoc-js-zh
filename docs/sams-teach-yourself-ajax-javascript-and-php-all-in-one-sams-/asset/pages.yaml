  md: '# Working with Web Documents


    If multiple windows or frames are in use, there might be several window objects,
    each with its own document object. To use one of these document objects, you use
    the name of the window and the name of the document.


    In the following sections, you will look at some of the properties and methods
    of the document object that will be useful in your scripting.


    # Getting Information About the Document


    Several properties of the document object include information about the current
    document in general:


    +   - document.URL specifies the document''s URL. This is a simple text field.
    You can''t change this property. If you need to send the user to a different location,
    use the window.location object, described later in this chapter.

    - document.title lists the title of the current page, defined by the HTML <title>
    tag.

    - document.referrer is the URL of the page the user was viewing prior to the current
    page—usually, the page with the current page.

    - document.lastModified is the date the document was last modified. Date is sent
    from the server along with the page.

    - document.bgColor and document.fgColor are the background and foreground (text)
    colors for the document, corresponding to the BGCOLOR and TEXT attributes of the
    <body> tag.

    - document.linkColor, document.linkColor, and document.vlinkColor are the colors
    for links within the document. These correspond to the LINK, VLINK attributes
    of the <body> tag.

    - document.cookie enables you to read or set a cookie for the document.


    As an example of a document property, Listing 5.1 shows a short HTML document
    that displays its last modified date using JavaScript.


    # LISTING 5.1 Displaying the Last Modified Date


    ```

    <head><title>Test Document</title></n<body>

    <p>This page was last modified on:

    <script language="JavaScript" type="text/javascript">

    document.write(document.lastModified);

    </script>

    </p>

    </body>

    </html>

    ```'
