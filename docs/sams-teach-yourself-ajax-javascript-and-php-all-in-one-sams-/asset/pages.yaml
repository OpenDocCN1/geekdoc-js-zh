  md: '# CHAPTER 21


    # Returning Data as XML


    What You’ll Learn in This Chapter:


    +   - Adding the “x” to Ajax

    - The responseXML Property

    - Project—An RSS Headline Reader


    In this chapter you will learn to use XML data returned from the server via the
    responseXML property of the XMLHttpRequest object.


    # Adding the “x” to Ajax


    Chapter 19, “Returning Data as Text,” and Chapter 20, “AAAH—Asynchronous HTML
    and HTTP,” dealt at some length with the string value contained in response and
    looked at several techniques for using this information in applications. These
    examples ranged from simple updates of page element text to applications using
    more sophisticated data structures encoded into string values that can be stored
    and transferred in the responseText property.


    The x in Ajax does, of course, stand for XML, and there are good reasons for using
    the power of XML in your applications. This is particularly true when you need
    to use highly structured information and/or perform complex translations between
    different types of data representation.


    As discussed previously, the XMLHttpRequest object has a further property called
    responseXML, which can be used to transfer information from the server via XML,
    rather than in text strings.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# CHAPTER 21: Returning Data as XML


    You saw in Chapter 13, "Our First Ajax Application," how JavaScript document object
    model (DOM) methods can help you process this XML information. This chapter looks
    at these techniques in a little more detail and hopefully gives you a taste of
    what Ajax applications can achieve when leveraging the XML.


    # The responseXML Property


    Whereas the responseText property of the XMLHttpRequest object contains a string,
    responseXML can be treated as if it were a document object.


    > You need to make sure that your server presents valid and well-formed XML via
    the responseXML property. In situations where XML cannot be correctly parsed by
    the XMLHttpRequest object, perhaps due to well-formedness errors or problems with
    unsupported character encoding, the content of the responseXML is unpredictable
    and also likely to be different in different browsers.


    Like the responseText property, the value stored in responseXML is read-only,
    you cannot write directly to this property; to manipulate it you must copy the
    value to another variable:


    ```

    var myobject = http.responseXML;

    ```


    The complete structure and data contained in the XML document can now be made
    available using JavaScript''s DOM methods. Later in the chapter we''ll demonstrate
    this with another Ajax application, but first let''s revisit the JavaScript DOM
    methods and introduce a few new ones.


    # More JavaScript DOM Methods


    You met some of the JavaScript DOM methods, such as getElementById and getElementsByTagName,
    in previous chapters. In those cases, we were mostly concerned with reading the
    values of the nodes to write those values into HTML page elements.


    This chapter looks at the DOM methods that can be used to actually create elements,
    changing the structure of the page.


    The Document Object Model can be thought of as a treelike structure of nodes.
    As well as reading the values associated with those nodes, you can create and
    modify the nodes themselves, thereby changing the structure and content of your
    document.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# The responseXML Property 259


    To add new elements to a page, you need to create the elements and then attach
    them to the appropriate point in your DOM tree. Let''s look at a simple example
    using the following HTML document:


    ```

    <html>

    <head>

    <title>Test Document</title>

    </head>

    <body>

    We want to place some text here:<br />

    <div id="displaydiv"></div>

    </body>

    </html>

    ```


    In this example, we want to add the text "Hello World!" to the `<div>` container
    in the document body. We''ll put our JavaScript routine into a function that we''ll
    call from the body''s onload event handler.


    First, we''ll use the JavaScript DOM method createTextNode() to, well, create
    a text node:


    ```

    var textnode = createTextNode(''Hello World!'');

    ```


    We now need to attach textnode to the DOM tree of the document at the appropriate
    point.


    You first learned about child nodes in Chapter 5, "Working with the Document Object
    Model"; hopefully, you recall that nodes in a document are have children when
    they contain other document elements. JavaScript has an appendChild() method,
    which allows us to attach our new node to the DOM tree by making a child node
    of an existing document node.


    In this case, we want our text to be inside the `<div>` container having the id
    displaydiv:


    ```

    var textnode = document.createTextNode(''Hello World!'');

    document.getElementById(''displaydiv'').appendChild(textnode);

    ```


    > Compare this DOM-based method of writing content to the page with the innerHTML
    method used in the project in Chapter 13.


    Let''s look at the complete source of the page, after wrapping this JavaScript
    into a function and adding the onload event handler to execute it:


    ```

    <html>

    <head>

    <title>Test Document</title>

    <script Language="JavaScript">

    ```


