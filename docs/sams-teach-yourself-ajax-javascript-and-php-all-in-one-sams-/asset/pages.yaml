  md: '# # Sams Teach Yourself

    # Ajax, JavaScript and PHP All One


    In just a short time, you can learn how to use Ajax, JavaScript,

    and PHP to create interactive interfaces to your web applications

    by combining these powerful technologies.


    # Learn how to...


    +   - Build better, more interactive interfaces for your web applications

    - Make JavaScript, HTML, XML, and PHP work together to create Ajax effects

    - Compile an Ajax application

    - Create and consume web services with SOAP and REST

    - Avoid common errors and troubleshoot problems

    - Use popular Ajax libraries to speed up and improve common programming tasks


    No previous Ajax programming experience is required. Using a

    straightforward, step-by-step approach, each lesson in this book

    builds on the previous ones, enabling you to learn the essentials

    of Ajax programming with JavaScript, PHP, and related technologies\from the ground
    up.


    Regardless of whether you run Linux, Windows, or Mac OS X,

    enclosed CD includes a complete Ajax programming starter kit

    that gives you all the programming tools, reference information

    JavaScript libraries, and server software to set up a

    stable environment for learning, testing, and production.


