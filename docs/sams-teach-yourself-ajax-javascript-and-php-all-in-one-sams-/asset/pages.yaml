  md: '# CHAPTER 20


    # AHAH—Asynchronous HTML and HTTP


    # What You''ll Learn in This Chapter:


    +   - Introducing AHAH

    - Creating a Small Library for AHAH

    - Using myAHAHlib.js


    In this chapter you will learn how to use AHAH (Asynchronous HTML and HTTP) to
    build Ajax-style applications without using XML.


    # Introducing AHAH


    You saw in Chapter 19, “Returning Data as Text,” just how much can be achieved
    with an Ajax application without using any XML at all. Many tasks, from simply
    updating the text on a page to dealing with complicated data structures, can be
    carried out using only the text string whose value is returned in the XMLHTTPRequest
    object''s responseText property.


    It is possible to build complete and useful applications without any XML at all.
    In fact, the term AHAH (Asynchronous HTML and HTTP) has been coined for just such
    applications.


    This chapter takes the concepts of Chapter 19 a little further, examining in more
    detail where—and how—AHAH can be applied.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'This technique, a kind of subset of Ajax, has been given various acronyms.
    These include AHAH (asynchronous HTML and HTTP), JAH (Just Asynchronous HTML),
    and HAJ (HTML And JavaScript). In this book we''ll refer to it as AHAH.


    There is no doubt that XML is an important technology with diverse and powerful
    capabilities. For complex XML applications with sophisticated data structures
    it may well be the best—or perhaps the only—option. However, using XML can sometimes
    complicate the design of an application, including:


    +   - Work involved in the design of custom schemas for XML data.

    - Cross-browser compatibility issues when using JavaScript''s DOM methods.

    - Performance may suffer from having to carry out processor-intensive XML parsing.


    AHAH can help you avoid these headaches, while offering a few more advantages,
    too:


    +   - Easy reworking of some preexisting web pages.

    - HTML can be easier to fault-find than XML.

    - Use of CSS to style the returned information, rather than having to use XSLT.


    XSLT is a transformation language used to convert XML documents into other formats—for
    example, into HTML suitable for a browser to display.


    In the following sections we''ll package our AHAH scripts into a neat external
    JavaScript file that we can call from our applications.


    # Creating a Small Library for AHAH


    The Ajax applications examined in the last couple of chapters, although complete
    and functional, involved embedding a lot of JavaScript code into our pages. As
    you have seen, each application tends to contain similar functions:'
  merge: -1
  pgno: 263
- img_proc: true
  md: "# Creating a Small Library for AHAH\n\n+   - A method to create an instance\
    \ of the XMLHttpRequest object, configure it,\nand send it\n\n+   - A callback\
    \ function to deal with the returned text contained in the\nresponseText property\n\
    \nYou can abstract these functions into simple JavaScript function calls, especially\
    \ in cases where you simply want to update a single page element with a new value\
    \ returned from the server.\n\n# Introducing myAHAHlib.js\n\nConsider Listing\
    \ 20.1; most of this code will be recognizable to you.\n\n```\nLISTING 20.1 myAHAHlib.jsnfunction\
    \ callAHAH(url, pageElement, callMessage) {\n  document.getElementById(pageElement);\n\
    \  innerHTML = callMessage;\n  try {\n    req = new XMLHttpRequest(); /* e.g.\
    \ Firefox */\n  } catch (e) {\n    req = new ActiveXObject('Msxml12.XMLHttpRequest');\n\
    \    /* some versions IE */\n  } catch (e) {\n    req = new ActiveXObject('Microsoft.XMLHttpRequest');\n\
    \    /* some versions IE */\n  } catch (E) {\n    req = false;\n  }\n  }\n  req.onreadystatechange\
    \ = function() {responseAHAH(pageElement));\n  req.open('GET',url,true);\n  req.send(null);\n\
    }\n\nfunction responseAHAH(pageElement) {\n  var output = '';\n  if(req.readyState\
    \ == 4) {\n    if(req.status == 200) {\n      output = req.responseText;\n   \
    \   document.getElementById(pageElement);\n      innerHTML = output;\n    }\n\
    \  }\n}\n```"
  merge: -1
  pgno: 264
- img_proc: true
  md: '# CHAPTER 20: AHAH—Asynchronous HTML and HTTP


    The function callAHA() encapsulates the tasks of creating an instance of the XMLHttpRequest
    object, declaring the callback function, and sending the request.


    Note that instead of simply declaring

    req.onreadystate = responseAHAH;


    we instead used the JavaScript construct

    req.onreadystatechange = function() {responseAHAH(pageElement)};


    This type of declaration allows us to pass an argument to the declared function,
    in this identifying the page element to be updated.


    callAH() also accepts an additional argument, callMessage. This argument contains
    a string defining the content that should be displayed in the target element while
    we await the outcome of the request. This provides a degree of feedback for the
    user, indicating that something is happening on the page. In practice this may
    be a line of text, such as


    > ''Updating page; please wait a moment ...''


    Once again, however, you may choose to embed some HTML code into this string.
    Using an animated GIF image within an <img> element provides an effective way
    of warning a user that a process is underway.


    The callback function responseAHAH() carries the specific task of applying the
    string returned in the responseText property to the innerHTML property of the
    selected page element pageElement:


    ```

    output = req.responseText;

    document.getElementById(pageElement).innerHTML = output;

    ```


    This code has been packed into a file named AHAHlib.js, which you can call from
    an HTML page, thus making the functions available to your AHAH application. The
    next section shows some examples of its use.


    # Using myAHAlib.js


    In Part II we encountered the concept of JavaScript functions being located in
    an external file that is referred to within our page.


    That''s how we use our new file myAHAlib.js, using a statement in this form:

    <script language="JavaScript" SRC="myAHAlib.js"></script>'
