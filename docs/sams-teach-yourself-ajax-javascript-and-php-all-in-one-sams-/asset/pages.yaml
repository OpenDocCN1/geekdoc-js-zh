  md: '# Tables


    Often you want to display information in tabular format, and HTML has a set of
    elements designed specifically for this purpose:


    ```

    <table>

    <tr><th>Column Header 1</th><th>Column Header 2</th></tr>

    <tr><td>Data Cell 1</td><td>Data Cell 2</td></tr>

    <tr><td>Data Cell 3</td><td>Data Cell 4</td></tr>

    </table>

    ```


    The <table> and </table> tags contain a nested hierarchy of other tags, including
    <tr> and </tr>,, which define individual table rows; <th> and </th>, which indicate
    cells in the table''s header; and <td> and </td>, which contain individual cells
    of table data.


    Look ahead to Figure 2.3 to see an example of how a table looks when displayed
    in a browser window.


    # Hyperlinks


    Hypertext links (hyperlinks) are fundamental to the operation of HTML. By clicking
    on a hyperlink, you can navigate to a new location, to that another point on the
    current page or to some point on a different page on another website entirely.


    Links are contained within an <a>, or anchor tag, a container tag that encompasses
    the content that will be the link. The destination of the link is passed to this
    tag as a parameter href:


    ```

    Here is <a href="newpage.html">my hyperlink</a>

    ```


    Clicking on the words my hyperlink in the preceding example results in the browser
    requesting page newpage.html.


    > A hyperlink can contain images as well, or instead of text. Look at this example:
    <a href="newpage.html"><img src="picfile.gif" /></a>


    Here, a user can click on the image picfile.gif to navigate to newpage.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_42_0.png)


    # A More Advanced HTML Page


    Let''s revisit testpage.html and add some extra elements. Listing 2.2 shows seville.html,
    developed from our original HTML page but with different content in the <body>
    section of the document. Figure 2.3 shows how the page looks when displayed, this
    time in Mozilla Firefox.'
