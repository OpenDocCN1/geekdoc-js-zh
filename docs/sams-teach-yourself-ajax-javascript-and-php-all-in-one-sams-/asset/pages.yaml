  md: '# Introducing Objects


    You can also use the function call directly in an expression. For example, you
    could use the alert statement to display the result of the function alert(Average(1,2,3,4)).


    Did you Know?


    In the previous chapter, you learned how to use variables to represent different
    kinds of data in JavaScript. JavaScript also supports objects, a more complex
    kind of variables that can store multiple data items and functions.


    Although a variable can have only one value at a time, an object can contain multiple
    values, as well as functions for working with the values. This allows you to group
    related data items and the functions that deal with them into a single object.


    In this chapter, you''ll learn how to define and use your objects. You''ve already
    worked with some of them, including


    +   - DOM objects—Allow your scripts to interact with web pages. You learned about
    these in Chapter 5, "Working with the Document Object Model (DOM)."

    - Built-in objects—Include strings and arrays, which you learned about in Chapter
    6, "Using Variables, Strings, and Arrays."


    The syntax for working with all three types of objects—DOM objects, built-in,
    and custom objects—is the same, even if you don''t create your own objects, you
    should have a good understanding of JavaScript''s object terminology and syntax.


    # Creating Objects


    When you created an array in the previous chapter, you used the following JavaScript
    statement:

    scores = new Array(4);


