  md: '# CHAPTER 11: Talking with the Server


    # Dealing with the Browser Cache


    All browsers maintain a so-called cache of visited web pages, a local record of
    page contents stored on the hard disk of the browser''s computer. When you request
    a particular web page, the browser first tries to load the page from its cache,
    rather than submitting a new HTTP request.


    +   This appears to be more of a problem with IE than the non-Microsoft browsers.
    Only GET requests are affected; POST requests are not cached.


    Although this can sometimes be advantageous in terms of page load times, it creates
    a difficulty when trying to write Ajax applications. Ajax is all about talking
    to the server, not reloading information from cache; so when you make an asynchronous
    request to the server, a new HTTP request must be generated every time.


    It is possible to add HTTP headers to the data returned by server-side routines,
    intended to tell the browser not to cache a particular page. Examples include
    `Pragma: no-cache`


    and

    `Cache-Control: must-revalidate`


    among others.


    Unfortunately these strategies vary widely in their effectiveness. Different browsers
    have different cache handling strategies and support different header declarations,
    making it difficult to ensure that pages are not cached.


    A commonly used trick to work around this problem involves the adding of a parameter
    with a random and meaningless value to the data request. This necessitates adding
    a further parameter and value pair to the end of the URL.


    If the random part of the URL is different each time, this effectively "fools"
    the browser into believing that it is the asynchronous request to an address not
    previously visited. This results in a new HTTP request being sent on every occasion.


    Let''s see how to achieve this. As you learned in Chapter 9, in JavaScript you
    can generate random numbers using the Math.random() method of the native Math()
    object. Listing 11.2 contains a couple of changes to the callAjax() function.'
