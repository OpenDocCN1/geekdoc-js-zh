    \ Interface Tools\n\nRico's capabilities aren't limited to aiding the development\
    \ of Ajax applications. Let's now look at some other capabilities you can add\
    \ to your user interfaces using the Rico toolkit. Although these techniques do\
    \ not themselves use Ajax, it takes little imagination to realize what they might\
    \ achieve when combined with Rico's Ajax tools.\n\n# Drag-and-Drop\n\nBoth desktop\
    \ applications and the operating systems on which they run wide-spread use of\
    \ drag-and-drop to simplify the user interface. The JavaScript techniques required\
    \ to implement drag-and-drop can be tricky to master, not least because of the\
    \ many cross-browser issues that arise.\n\nDrag-and-drop using Rico, however,\
    \ is simple.\n\nIncluding the rico.js in your application automatically causes\
    \ the creation of an object called dndMgr, Rico's Drag and Drop Manager. Using\
    \ the dndMgr object is like using AjaxEngine; this time, though, we need to register\
    \ Ajax requests and responses, but draggable items and drop zones (page elements\
    \ that can be dragged items).\n\nThese tasks are carried out via the registerDraggable\
    \ and registerDropZone methods:\n\n```\ndndMgr.registerDraggable(new Rico.Draggable('test',\n\
    \  'dragElementID'));\ndndMgr.registerDropZone(new Rico.Dropzone(\n  'dropElementID'));\n\
    ```\n\nThese two commands declare, respectively, a page element with ID dragElementID\
    \ as being draggable, another element with ID drop zone. The argument 'test' of\
    \ the registerDraggable() method defines a type for the draggable item, which\
    \ can be tested and used by subsequent code, if required."
