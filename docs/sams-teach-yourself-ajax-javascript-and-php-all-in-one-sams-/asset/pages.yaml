  md: '# Using for Loops


    The switch statement has several components:


    +   - The initial switch statement. This statement includes the value to test
    (in this case, button) in parentheses.


    +   - Braces ({ and )) enclose the contents of the switch statement, similar to
    a function or an if statement.


    +   - One or more case statements. Each of these statements specifies a value
    to compare with the value specified in the switch statement. If the values match,
    the statements after the case statement are executed. Otherwise, the next case
    is tried.


    +   - The break statement is used to end each case. This skips to the end of the
    switch. If break is not included, statements in multiple cases might be executed
    when they match


    +   - Optionally, the default case can be included and followed by one or more
    statements that are executed if none of the other cases were matched.


    > You can use multiple statements after each case statement within the JavaScript
    structure. You don''t need to enclose them in braces. If the case matches, the
    JavaScript interpreter executes statements until it encounters a break or the
    next case.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_140_0.png)


    # Using for Loops


    The for keyword is the first tool to consider for creating loops. A loop typically
    uses a variable (called a counter or an index) to keep track of how many times
    the loop has executed, and it stops when the counter reaches a certain number.
    A for statement looks like this:


    ```

    for (var = 1; var < 10; var++) {

    ```


    There are three parameters for the for loop, separated by semicolons:


    +   - The first parameter (var = 1 in the example) specifies a variable and assigns
    an initial value to it. This is called the initial expression because it sets
    up the initial state of the loop.


    +   - The second parameter (var < 10 in the example) is a condition that must
    remain true to keep the loop running. This is called the condition of the loop.'
