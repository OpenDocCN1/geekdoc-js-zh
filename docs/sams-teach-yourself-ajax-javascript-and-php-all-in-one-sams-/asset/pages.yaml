    # Working with Arrays


    An array is a variable type that can store and index a set of values. An array
    is useful when the data you want to store something in common or is logically
    grouped into a set.


    # Creating and Accessing Arrays


    The following PHP statement declares an array called $temps and assigns it 12
    values that represent the temperatures for January through December:


    ```

    $temps = array(38, 40, 49, 68, 70, 79, 84, 83, 76, 65, 54, 42);

    ```


    The array $temps that is created contains 12 values that are indexed with numeric
    key values from 0 to 11. To reference an indexed value from an array, you suffix
    the variable name with the index key. To display March''s temperature, for example,
    you would use the following:


    ```

    echo $temps[2];

    ```'
