  md: '# CHAPTER 8: Controlling Flow with Conditions and Loops


    The structure of the for loop in JavaScript is based on Java, which in turn is
    based on C. Although it is traditionally used to count from one number to another,
    you can use just any statement for the initialization, condition, and increment.
    However, there''s usually a better way to do other types of loops with the while-word,
    described in the next section.


    # Using while Loops


    Another keyword for loops in JavaScript is while. Unlike for loops, while loops
    don''t necessarily use a variable to count. Instead, they execute as long as a
    condition is true. In fact, if the condition starts out as false, the statements
    will not execute at all.


    The while statement includes the condition in parentheses, and it is followed
    by a block of statements within braces, just like a for loop. Here is a simple
    while loop:


    ```

    while (total < 10) {

    n++;

    total += values[n];

    }

    ```


    This loop uses a counter, n, to iterate through the values array. Rather than
    stopping at a certain point, however, it stops when the total of the values reaches
    10.


    You might have noticed that you could have done the same thing with a for loop:


    ```

    for (n=0;total < 10; n++) {

    total += values[n];

    }

    ```


    As a matter of fact, the for loop is nothing more than a special kind of while
    loop that handles an initialization and an increment for loop. You can generally
    use while for any loop. However, it''s best to choose whichever type of loop makes
    the most sense for the job, or that takes the least amount of typing.


    # Using do...while Loops


    JavaScript 1.2 introduced a third type of loop: the do...while loop. This type
    of loop is similar to an ordinary while loop, with one difference: The condition
    is tested at the end of the loop rather than the beginning. Here is a typical
    do...while loop:


    ```

    do {

    n++;

    total += values[n];

    } while (total < 10);

    ```'
