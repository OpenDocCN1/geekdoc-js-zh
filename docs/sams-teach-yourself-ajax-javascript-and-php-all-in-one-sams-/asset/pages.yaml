  md: '# CHAPTER 19


    # Returning Data as Text


    # What You''ll Learn in This Chapter:


    +   - Getting More from the responseText Property


    In this chapter you will learn some more techniques for using the responseText
    property to add functionality to Ajax applications.


    # Getting More from the responseText Property


    The chapters of Part III, “Introducing Ajax,” discussed the individual components
    that make Ajax work, culminating in a complete Ajax application. In Part V, “More
    Complex Ajax Technologies,” each chapter examines how you can extend what you
    know to develop sophisticated Ajax applications.


    For this chapter, we''ll look a little more closely at the responseText property
    of the XMLHttpRequest object and see how we can give our application some functionality
    via its use.


    As you have seen in previous chapters, the XMLHttpRequest object provides two
    properties that contain information received from the server, namely responseText
    and responseXML. The former presents the calling application with the server data
    in string format, whereas the latter provides DOM-compatible XML that can be parsed
    using JavaScript methods.


    Although the responseXML property allows you to carry out some programming tasks,
    much can be achieved just by manipulating the value stored in the responseText
    property.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Returning Text


    The term text is perhaps a little misleading. The responseText property contains
    a character string, the value of which you can assign to a JavaScript variable
    via a simple assignment statement:


    ```

    var mytext = http.responseText;

    ```


    There is no rule saying that the value contained in such string must be legible
    text; in fact, the value can contain complete gibberish provided that the string
    contains only characters that JavaScript accepts in a string variable.


    This fact allows a degree of flexibility in what sorts of information you can
    transfer using this property.


    # Using Returned Text Directly in Page Elements


    Perhaps the simplest example is to consider the value of used here responseText
    in updating the textual part of a page element, say a <div>container. In this
    case you may simply take the returned string and apply it to the page element
    in question.


    Here''s a simple example. The following is the HTML code for an HTML page that
    forms the basis for an Ajax application:


    ```

    <html>

    <head>

    <title>My Ajax Application</title>

    </head>

    <body>

    Here is the text returned by the server:<br />n<div id="myPageElement"></div>

    </body>

    </html>

    ```


    Clearly this is a simple page that, as stands, would merely output the line “Here
    is the text returned by the server.” and nothing else.


    Now suppose that we add to the page new JavaScript routines to generate an instance
    of an XMLHttpRequest object (in this case called http) and make a server request
    in response to the onload() event handler of the page''s <body> element. Listing
    19.1 shows the source code for the revised page.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "# LISTING 19.1 A Basic Ajax Application Using the responseText Property\n\n\
    ```\n<html>\n<head>\n<title>My Ajax Application</title>\n<script Language=\"JavaScript\"\
    >\nfunction getXMLHttpRequest() {\n  try {\n    req = new XMLHttpRequest();\n\
    \  } catch (err1) {\n    req = new ActiveX(\"Msxml2.XMLHttpRequest\");\n  } catch\
    \ (err2) {\n    try {\n      req = new ActiveX(\"Microsoft.XML\");\n    } catch\
    \ (err3) {\n      req = false;\n    }\n  }\n  return req;\n}\n\nvar http = getServerText();\n\
    var url = 'textserver.php';\nvar myRand = parseInt(Math.random()*9999999999999);\n\
    var modul = url+'rand='+myRand;\nhttp.open('GET', modul, true);\nhttp.onreadystatechange\
    \ = useHttpResponse;\nhttp.send(null);\n}\n\nfunction useHttpResponse() {\n  if\
    \ (http.readyState == 4) {\n    if (http.status == 200) {\n      var mytext =\
    \ http.responseText;\n      document.getElementById('pageElement').innerHTML =\
    \ mytext;\n    } else {\n      document.getElementById('pageElement').innerHTML\
    \ = \"\";\n    }\n  }\n}\n</script>\n</head>\n<body onload=\"getServerText()\"\
    >\nHere is the text returned by the server:<br>\n<div id=\"pageElement\">*</div>\n\
    </body>\n</html>\n```"
  merge: -1
  pgno: 256
- img_proc: true
  md: '# CHAPTER 19: Returning Data as Text


    Most, and probably all, of this code will be familiar from previous chapters.
    The part that interests us here is the callback function useHttpResponse(), which
    contains- these lines:


    ```

    var myText = http.responseText;

    document.getElementById(''myPageElement'').innerHTML = myText;

    ```


    Here we have simply assigned the value received in responseText to become the
    content of our chosen <div> container.


    Running the preceding code with the simple server-side script


    ```

    <php

    echo "This is the text from the server";

    ?

    ```


    produces the screen display of Figure 19.1.


    FIGURE 19.1 Displaying text in a page element via responseText.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_257_0.png)


    # Including HTML in responseText


    Now let''s modify the code from the preceding example.


    As you know from previous chapters, HTML markup is entirely composed of tags written
    using text characters. If the value contained in the responseText property is
    to be used for modifying the display of the page from which the server request
    is being sent, there is nothing to stop us having our server script include HTML
    markup in the information it returns.'
