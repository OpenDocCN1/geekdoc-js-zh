  md: '# Working with Dates


    You can choose any of these formats, depending on which values you wish to set.
    If you use no parameters, as in the first example, the current date is stored
    in the object. You can then set the values using the set methods, described in
    the next section.


    # Setting Date Values


    A variety of set methods enable you to set components of a Date object to values:


    +   * getDate() sets the day of the month.

    * setMonth() sets the month. JavaScript sets the numbers from 0 to 11, starting
    with January (0).

    * setFullYear() sets the year.

    * setTimeout() sets the time (and the date) by specifying the number of milliseconds
    since January 1, 1970.

    * setHours(), setMinutes(), and setSeconds() set the time.


    As an example, the following statement sets the year of a Date object called holiday
    to 2003:

    holiday.setFullYear(2003);


    # Reading Date Values


    You can use the get methods to get values from a Date object. This is the only
    way to obtain these values, because they are not available as properties. Here
    are the available get methods for dates:


    +   * getDate() gets the day of the month.

    * getMonth() gets the month.

    * getFullYear() gets the year.

    * getTime() gets the time (and the date) as the number of milliseconds since January
    1, 1970.

    * getHours(), getMinutes(), getSeconds(), and getMilliseconds() get the components
    of the time.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# By the Way


    Along with setFullYear and getYear, which require four-digit years, JavaScript
    includes setYear and getYear methods, which use two-digit values. You should always
    use the four-digit version to avoid Year 2000 issues.


    # Working with Time Zones


    Finally, a few functions are available to help your Date objects work with local
    time values and time zones:


    +   - getTimeOffset() gives you the local time zone''s offset from UTC (Coordinated
    Universal Time, based on the old Greenwich Mean Standard). In this case, local
    refers to the location of the browser. (Of course, this only works if the user
    has his or her system clock accurately.)


    +   - toString() converts the date object''s time value to text, using UTC. This
    method was introduced in JavaScript 1.2 to replace the toGMTString method, which
    still works but should be avoided.


    +   - toLocalString() converts the date object''s time value to text, using local
    time.


    Along with these basic functions, JavaScript 1.2 and later include UTC versions
    of several of the functions described previously. These are identical to the regular
    commands, but work with UTC instead of local time:


    +   - getUTCDate() gets the day of the month in UTC.


    +   - getUTDay() gets the day of the week in UTC.


    +   - getCFullYear() gets the four-digit year in UTC.


    +   - getUTMonth() returns the month of the year in UTC.


    +   - getUTCHours(), getUTMinutes(), getUTSeconds(), and getUTCMilliseconds()
    return the components of the time in UTC.


    +   - setUTCDate(), setUTCFullYear(), setUTMonth(), setUTCHours(), setUTMinutes(),
    setUTSeconds(), and setUTCMilliseconds() set the time in UTC.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Converting Between Date Formats


    Two special methods of the Date object allow to convert between date formats.

    Instead of using these methods with a Date object you created, you use them with

    t built-in object Date itself. These include the following:


    +   - Date.parse() converts a date string, such as June 20, 1996, to the Date

    object (number of milliseconds since 1/1/1970).

    - Date.UTC() does the opposite. It converts a Date object value (number of milliseconds)
    to a UTC (GMT) time.


    # Using Third-Party Libraries


    When you use JavaScript''s built-in Math and Date functions, JavaScript does most
    of

    t work—you don''t have to figure out how to convert dates between formats or calculate
    cosine. Third-party libraries are not included with JavaScript, but they serve

    a similar purpose—enabling you to duplicate complicated things with a small

    amount of code.


    Using one of these libraries is as usual as copying one or more files to your

    site and including a <script> tag in your document to load the library. Several

    popular JavaScript libraries are discussed in the following sections. More detailed

    descriptions, including the use of these libraries for Ajax applications, are
    given

    tow the end of this book.


    # Prototype


    Prototype, created by Sam Stephenson, is a JavaScript library that simplifies
    tasks

    such as working with DOM objects, dealing with data in formats, and remote scripting

    (AJAX). By including a single prototype.js file in your document, you have access

    to many improvements to basic JavaScript.


    Adding Prototype to your pages requires only one file, prototype.js, and one

    <script> tag:


    ```

    <script type="text/javascript" src="prototype.js"></script>

    ```


    See Chapter 25 for a discussion on Prototype.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# CHAPTER 9: Using Built-In Functions and Libraries


    # Script.aculo.us


    The code for a task like on-page animation can be complex, but you can also include
    effects in your pages using a prebuilt library. This enables you to use impressive
    effects with only a few lines of code.


    Script.aculo.us by Thomas Fuchs is such one library. It includes functions to
    simplify drag-and-drop tasks, such as rearranging lists of items. It also includes
    a number of Combination Effects, which enable you to use highlighting and animated
    transitions within your pages. For example, a new section of the page can be briefly
    highlighted in yellow to get the user''s attention, or a portion of the page can
    fade out or slide off the screen.


    After you''ve included the appropriate files, using effects is as easy as any
    of JavaScript''s built-in methods. For example, the following statements use Script.aculo.us
    to fade out an element of the page with the id test value:


    ```

    obj = document.getElementById("test");

    new Fade.Fade(obj);

    ```


    Script.aculo.us is built on the Prototype framework described in the previous
    section, and includes all of the functions of Prototype, so you could also simplify
    this by using the $ function:


    ```

    new Fade.Fade("*test");

    ```


    See Chapter 27 for more on using the Script.aculo.us library.


    # Other Libraries


    There are many JavaScript libraries out there, and more are appearing all of the
    time as JavaScript is taken more seriously as an application language. Here are
    some more libraries you might want to explore:


    +   Dojo (http://www.dojotoolkit.org/) is an open-source toolkit that powers to
    JavaScript to simplify building applications and user interfaces. It features
    ranging from extra string and math functions to animation and Ajax.


    +   The Yahoo! UI Library (http://developer.yahoo.net/yui/) was developed by Yahoo!
    and made available to everyone under an open-source license. It includes features
    for animation, DOM features, event management, and easy-to-use user interface
    elements such as calendars and sliders.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'MochiKit (http://mochikit.com/) is a lightweight library that adds features
    for working with the DOM, CSS colors, string formatting, and Ajax. It also supports
    a nice logging mechanism for debugging your scripts.


    > > "Prototype, Script.aculo.us, Dojo, and MochiKit are among the selection of
    frameworks supplied on the CD that accompanies this book.


    # # Summary


    In this chapter, you learned some specifics about the Math and Date objects built
    into JavaScript, and learned more than you ever wanted to know about random numbers.
    You also learned about third-party libraries that can simplify your scripting.


    This concludes Part II of the book. In Part III, “Introducing Ajax,” you’ll begin
    to use your JavaScript knowledge to build a working Ajax application.'
