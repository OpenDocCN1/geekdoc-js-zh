  md: "# CHAPTER 22: Web Services and the REST and SOAP Protocols\n\n# Query Information\
    \ Using GET\n\nAn important issue concerning the use of the HTTP request in a\
    \ RESTful application is that it should never change the server state. To put\
    \ it another way: We only use GET requests to ask for information from the server,\
    \ never to add or alter information already there.\n\nPOST, PUT, and DELETE calls\
    \ can all change the server status in some way.\n\n# Stateless Operation\n\nAll\
    \ server exchanges within a RESTful application should be stateless. By stateless\
    \ we mean that the client itself must contain all the information required by\
    \ the server to carry out the required task, rather than depending on some state\
    \ or context-current. We cannot, for example, require the server to refer to information\
    \ sent in previous requests.\n\n# Using REST in Practice\n\nLet's expand on the\
    \ example quoted earlier involving our articles web service.\n\n# Reading a List\
    \ of Available Articles\n\nThe list of available articles is a resource. Because\
    \ the web service conforms to REST principles, we expect the service to provide\
    \ a URL by which we can access this resource, for instance:\n\nhttp://somedomain.com/articles/list.php\n\
    \nBecause we are querying information, rather than attempting to change it, we\
    \ use an HTTP GET request to the preceding URL. The server may return, for example,\
    \ the following XML:\n\n```\n<articles>\n  <article>\n    <id>173</id>\n    <title>New\
    \ Concepts in Ajax</title>\n    <author>P.D. Johnstone</author>\n  </article>\n\
    \  <article>\n    <id>218</id>\n    <title>More Ajax Ideas</title>\n    <author>S.N.\
    \ Braithwaite</author>\n  </article>\n</article>\n```"
