  md: 'Anchors are named places in an HTML document that can be jumped to directly.
    You define them with a tag like this: <a name="part2">. You can then link to them:
    <a href="#part2">.


    # Did you Know?


    You can access link objects with the links array. Each member of the array is
    one of the link objects in the current page. A property of the array, document.links,
    indicates the number of links in the page.


    Each link object (or member of the links array) has a list of properties defining
    the URL. The href property contains the entire URL, and other properties define
    portions of it. These are the same properties as the location object, defined
    later in this chapter.


    You can refer to a property by indicating the link number and property name. For
    example, the following statement assigns the URL of the first link to the variable
    link1:

    link1 = links[0].href;


    The anchor objects are also children of the document object. Each anchor object
    represents an anchor in the current document—a particular location that can be
    jumped to directly.


    Like links, you can access them with an array: anchors. Each element of this array
    is an anchor object. The document.anchors.length property gives you the number
    of elements in the anchors array.


    # Accessing Browser History


    The history object is another child (property) of the window object. This object
    holds information about the URLs that have been visited before and after the current
    one, and it includes methods to go to previous or next locations.


    The history object has one property you can access:


    +   - history.length keeps track of the length of the history list—in other words,
    the number of different locations that the user has visited.


    The history object has current, previous, and next properties that store URLs
    of documents in the history list. However, for security and privacy reasons, objects
    are not normally accessible in today''s browsers.


    # By the Way'
  merge: -1
