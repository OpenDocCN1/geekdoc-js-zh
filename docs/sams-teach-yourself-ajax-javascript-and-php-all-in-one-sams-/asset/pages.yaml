  md: "# Sorting a String Array\n\nJavaScript also includes a sort method for arrays,\
    \ which returns an alphabetically sorted version of the array. For example, the\
    \ following statements initialize an array of four names and sort it:\n\n```\n\
    names[0] = \"Public, John Q.\";\names[1] = \"Tillman, Henry J.\";\names[2] = \"\
    Bush, George W.\";\names[3] = \"Mouse, Mickey\";\nsortednames = names.sort();\n\
    ```\n\nThe last statement sorts the names array and stores the result in a new\
    \ array, sortednames.\n\n# Sorting a Numeric Array\n\nBecause the sort method\
    \ sorts alphabetically, it won't work with a numeric array—at least the way you'd\
    \ expect. If an array contains the numbers 4, 10, 30, and 200, for example, it\
    \ would sort them as 10, 200, 30, 4—not even close. Fortunately, there's a solution:\
    \ You can specify a function in the sort method's parameters, and that function\
    \ will be used to compare the numbers. The following code sorts a numeric array\
    \ correctly:\n\n```\nfunction numcompare(a,b) {\n  return a-b;\n}\nnums = new\
    \ Array(3, 10, 200, 4);\nsortednums = nums.sort(numcompare);\n```\n\nThis example\
    \ defines a simple function, numcompare, which subtracts the two numbers. If you\
    \ specify this function in the sort method, the array is sorted in the correct\
    \ numeric order: 4, 10, 30, 200.\n\nJavaScript expects the comparison function\
    \ to return a negative number if a belongs before b, 0 if they are the same, or\
    \ a positive number if a belongs after b. This is why a-b is all you need for\
    \ the function to sort numerically."
