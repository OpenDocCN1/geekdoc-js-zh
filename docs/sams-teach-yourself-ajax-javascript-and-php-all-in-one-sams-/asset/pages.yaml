  md: "# CHAPTER 8: Controlling Flow with Conditions and Loops\n\nAn additional logical\
    \ operator is the And operator, &&. Consider this statement:\nif (phone == \"\
    *\\* && email == \"*\") alert(\"Both are Missing!\");\",\n\nThis statement uses\
    \ && (And) instead of || (Or), so the error message will only be\ndisayed if both\
    \ the email address and phone number variables are blank. (In this\nparticular\
    \ case, Or is a better choice).\n\n# Did you Know?\n\nThe JavaScript interpreter\
    \ discovers the answer to a conditional expression\nbefore reaching the end, it\
    \ does not evaluate the rest of the condition. For exam-\\ple, if the first of\
    \ two conditions separated by the && operator is false, the second\nis not evaluated.\
    \ You can take advantage of this to improve the speed of your\\scripts.\n\nThe\
    \ third logical operator is the exclamation mark (!), which means Not. It can\
    \ be\nused to insert an expression—in other words, a true expression would become\
    \ false,\nand a false one would become true. For example, here's a statement that\
    \ uses the\nNot operator:\n\n```\nif (!phone == \"*\") alert(\"phone is OK\");\n\
    ```\n\nIn this statement, the ! (Not) operator inverts the condition, so the action\
    \ of the if\nstatement is executed only if the phone number variable is not blank.\
    \ The extra\nparentheses are necessary because all JavaScript conditions must\
    \ be in parentheses.\nYou could also use the != (Not equal) operator to simplify\
