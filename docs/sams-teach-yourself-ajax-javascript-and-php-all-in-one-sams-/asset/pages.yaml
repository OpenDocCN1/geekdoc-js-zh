- img_proc: true
  md: 'The history object has three methods you can use to move through the history
    list:


    +   - history.go() opens a URL from the history list. To use this method, specify
    a positive or negative number in parentheses. For example, history.go(-2) is equivalent
    to clicking the Back button twice.


    +   - history.back() loads the previous URL in the history list—equivalent to
    clicking the Back button.


    +   - history.forward() loads the next URL in the history list, if available.
    This is equivalent to clicking the Forward button.


    You''ll use these methods in the Try It Yourself section at the end of this chapter.


    # Working with the location Object


    A third child of the window object is the location object. This object stores
    information about the current URL stored in the window. For example, the following
    statement loads a URL into the current window:

    window.location.href=''http://www.starlingtech.com'';


    The href property used in this statement contains the entire URL of the window''s
    current location. You can also access portions of the URL with various properties
    of the location object. To explain these properties, consider the following:

    http://www.jsworkshop.com/80/test.cgi?lines=1#anchor


    The following properties represent parts of the URL:


    +   - location.protocol is the protocol part of the URL (http: in the example).


    +   - location.hostname is the host name of the URL (www.jsworkshop.com in the
    example).


    +   - location.port is the port number of the URL (80 in the example).


    +   - location.pathname is the filename part of the URL (test.cgi in the example).


    +   - location.search is the query portion of the URL, if any (lines=1 in the
    example). Queries are used mostly by CGI scripts.


    +   - location.hash is the anchor name used in the URL, if any (#anchor in the
    example).'
