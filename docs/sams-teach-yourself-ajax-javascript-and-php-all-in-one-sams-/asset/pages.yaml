  md: '# CHAPTER 2: Writing and Styling Pages in HTML and CSS


    Next, note that the remainder of the document is enclosed by the elements `&lt;html&gt;`
    at the start of the page and `&lt;/html&gt;` at the end. These tags notify the
    browser that what lies between should be interpreted and displayed as an HTML
    document.


    # Watch Out!


    Many modern browsers correctly display HTML without these tags, it is bad practice
    to omit them. Even if the page is shown correctly on your own PC, you have no
    idea what operating system and browser a visitor may be using—he or she may not
    be so lucky.


    The document within these outer tags is split into two sections. The first is
    enclosed in `&lt;head&gt;` and `&lt;/head&gt;` tags, and the second is contained
    between `&lt;body&gt;` and `&lt;/body&gt;`. Essentially, the document''s head
    section is used to store information about the document that is not to be displayed
    in the browser window, whereas the body of the document contains text to be interpreted
    and displayed to the user via the browser window.


    # The `&lt;head&gt;` of the Document


    From Listing 2.1 we can see that the head section of our simple HTML document
    contains only one line—the words Simple HTML Document enclosed in `&lt;title&gt;`
    and `&lt;/title&gt;` tags.


    Remember that the head section contains information that is not to be displayed
    in the browser window. This is not, then, the title displayed at the top of your
    page text, as you can confirm by looking at Figure 2.1. Neither does the document
    title refer to the filename of the document, which in this case is testpage.html.


    In fact, the document title fulfills a number of functions, among as:


    +   - Search engines use the page title (among other factors) to help decide what
    a page is about.


    +   - When you bookmark a page, it is generally saved by default as the document
    title.


    +   - Most browsers, when minimized, display the title of the current document
    on their icon or taskbar button.


    It''s important, therefore, to choose a meaningful and descriptive title for each
    page that you create.


    Many other element types are used in the head section of a document, including
    link, meta, and script elements. Although we don''t give an account of them, they
    are described throughout the book as they occur.'
