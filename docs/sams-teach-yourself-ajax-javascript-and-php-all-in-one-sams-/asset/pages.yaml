  md: '# Example Project—Stock Price Reader


    Let''s use the prototype.js library to build a simple reader that updates periodically
    to show the latest value returned from the server. we''ll use a simple server-side
    script rand.php to simulate a changing stock price:


    ```

    <?php

    rand ((double) microtime( )*1000000);

    $price = 50 + rand(0,5000)/100;

    echo "$price";

    ?>

    ```


    This script first initializes PHP''s random number routine by calling the srand()
    function and passing an argument from the current time. rand(0,5000) is then used
    to generate a random number that is manipulated arithmetically to produce phony
    "stock prices" in the range 50.00 to 100.00.


    Now let''s build a simple HTML page to display the current stock price. This page
    forms the basis for our Ajax application:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01 Transitional//EN"

    "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <script src="prototype.js" Language="JavaScript">

    <type type="text/javascript"></script>

    <title>Stock Reader powered by Prototype.js</title>

    </head>

    <body>

    <h2>Stock Reader</h2>

    <h4>Powered by Prototype.js</h4>

    <p>Current Stock Price:</p>

    <div id="price"></div>

    </body>

    </html>

    ```


    Note that we included the prototype.js library by means of a <script> tag in the
    document head. We also defined a <div> id set to "price", which will be used to
    display the current stock price.


    We now need to implement the Ajax.PeriodicalUpdater class, which we''ll attach
    to the document body element''s onLoad event handler. Listing 25.1 shows the complete
    script.'
  merge: -1
