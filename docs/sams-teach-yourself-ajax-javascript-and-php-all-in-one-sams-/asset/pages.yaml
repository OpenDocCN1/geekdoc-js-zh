  md: '# CHAPTER 7


    # Using Functions and Objects


    # What You''ll Learn in This Chapter:


    +   - Using Functions

    - Introducing Objects

    - Using Objects to Simplify Scripting

    - Extending Built-in Objects


    In this chapter, you''ll learn about two or more key JavaScript concepts that
    you''ll use throughout the rest of this book. First, you''ll learn the details
    of using functions, which enable you to group any number of statements into a
    block. This is useful for repeating sections of code, and you can also create
    functions that accept parameters and return values for later use.


    Whereas functions enable you to group sections of code, objects enable you to
    group data—you can use them to combine related data items and functions for working
    with the data.


    # Using Functions


    The scripts you''ve seen so far are quite simple lists of instructions. The browser
    begins with the first statement after the <script> tag and follows each instruction
    in order until it reaches the closing </script> tag (or encounters an error).


    Although this is a straightforward approach for short scripts, it can be confusing
    to read a longer script written in this fashion. To make it easier for you to
    organize your scripts, JavaScript supports functions, which you learned about
    in Chapter 4, "Creating Simple Scripts in JavaScript." In this section, you will
    learn how to define and use functions.'
