  md: '# CHAPTER 15: Variables


    # Working with Strings


    A string is a collection of characters that is treated as a single entity. In
    PHP, strings are enclosed in quotation marks, and you can declare a string type
    variable by assigning it a string that is contained in either single or double
    quotes.


    The following examples are identical; both create a variable called $phrase that
    contains the phrase shown:


    ```

    $phrase = "The sky is falling";

    $phrase = ''The sky is falling'';",

    ```


    # Escaping Characters with Backslash


    Double quotes can be used within single-quoted strings and vice versa. For instance,
    these string assignments are both valid:


    ```

    $phrase = "It''s time to party!";

    $phrase = ''So I said, "OK";''

    ```


    If, you want to use the same character within a quoted string, you must escape
    that quote by using a backslash. The following examples demonstrate this:


    ```

    $phrase = ''\It\''s time to party!'';

    $phrase = ''So I said, "OK";''

    ```


    In the previous examples, if the backslash were not used, PHP would mismatch the
    quotes, and an error would result.


    You can send the common nonprintable ASCII characters using standard escape characters.
    A newline is \n, tab is \t, and so on. Refer to man ascii on your system or www.ascii.com
    for a comprehensive list.


    # Concatenation


    You have already seen how strings can be joined using the period symbol as a concatenation
    operator. A compound version of this operator, .=, can be used to append a string
    to an existing variable.


    The following example builds up a string and then displays the result:


    ```

    $phrase = "I want ";

    $phrase .= "to teach ";

    $phrase .= "the world ";

    $phrase .= "to sing ";

    echo $phrase;

    ```


    The phrase appears as expected. Note the use of spaces after teach and world to
    ensure that the final string is correctly spaced.'
