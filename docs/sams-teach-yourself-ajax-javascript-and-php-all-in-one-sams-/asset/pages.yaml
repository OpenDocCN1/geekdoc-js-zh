    \ example of a Date object in a previous chapter. The Date object has no properties.\
    \ To set or obtain values from a Date object, you must use the methods described\
    \ in the next section.\n\n> JavaScript dates are stored as the number of milliseconds\
    \ since midnight, January 1, 1970. This date is called the epoch. Dates before\
    \ 1970 weren't allowed in early versions, but are now represented by negative\
