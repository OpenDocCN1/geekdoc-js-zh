  md: 'One option we haven''t yet considered the idea of passing back JavaScript code
    within responseText. Because JavaScript source code (like everything else in an
    HTML page) is made up of statements in plain text, you can return JavaScript source
    from the server in the responseText property.

    You can then execute this JavaScript code using JavaScript''s eval() method:

    eval(object.responseText);

    Consider the situation where your server returns the string:

    "alert(''Hello World!'');";

    In this case the eval() method would execute the content as a JavaScript statement,
    creating a dialog saying ''Hello World!'' with an OK button.


    > Did you Know?


    # Try It Yourself


    # Extending the Library


    As stands, myAHAHlib.js is a simple implementation of AHAH. There are many ways
    it could be improved and extended, depending on how it is to be used. Rather than
    cover these in this chapter, we''ll leave these for your own experimentation.
    Here''s a few suggestions to get started:


    +   - Currently only GET requests are supported. How might the functions be modified
    to allow POST requests too?

    - Much of the user feedback discussed in Chapter 13, "Our Ajax Application," is
    not yet implemented in responseAAH().

    - Is it possible for callAAH() to be modified to accept an array of elements for
    updating and (with the aid of a suitable server-side script) process them all
    at once?


    # Summary


    It will hopefully have become clear, in the course of this chapter and Chapter
    19, that Ajax can achieve a lot of functionality without any XML at all.

    By carefully using combinations of client-side coding in JavaScript and server-side
    scripting in your chosen language, you can create data schemes of high complexity.'
