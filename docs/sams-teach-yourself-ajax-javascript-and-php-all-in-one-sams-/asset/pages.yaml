  md: "# The else Keyword\n\nAn additional feature of the if statement is the else\
    \ keyword. Much like its English equivalent, else tells the JavaScript interpreter\
    \ what to do if the condition isn't true. \nThe following is a simple example\
    \ of the else keyword in action:\n\n```\nif (a == 1) {\n  alert(\"Found a !\"\
    );\n  a = 0;\n}\nelse {\n  alert(\"Incorrect value: \" + a);\n}\n```\n\nThis is\
    \ a modified version of the previous example. This displays a message and resets\
    \ the variable a if the condition is met. If the condition is not met (if a is\
    \ not 1!), a different message is displayed.\n\n> Like the if statement, else\
    \ can be followed either by a single statement or by a number of statements enclosed\
    \ in braces.\n\n![](img/5a65c4ec3b3e08b6ff226ca847fae85a_136_0.png)\n\n# Using\
    \ Shorthand Conditional Expressions\n\nIn addition to the if statement, JavaScript\
    \ provides a shorthand type of conditional expression that you can use to make\
    \ quick decisions. This uses a peculiar syntax that is also found in other languages,\
    \ such as C. A conditional expression looks like this:\n\n```\nvariable = (condition)\
    \ ? (true action) : (false action);\n```\n\nThis assigns one of two values to\
    \ the variable: one if the condition is true, and another if it is false. Here\
    \ is an example of a conditional expression:\n\n```\nvalue = (a == 1) ? 1 : 0;\n\
    ```\n\nThis statement might look confusing, but it is equivalent to the following\
    \ if statement:\n\n```\nif (a == 1) {\n  value = 1;\n}else\n  value = 0;\n```"
  merge: -1
