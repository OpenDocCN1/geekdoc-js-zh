  md: 'Imagine that you have created an embedded style for the <h1> tag, but want
    to change that style for one occurrence of the <h1> tag in that document. You
    would create an inline style for that new <p> tag. The browsers recognize that
    fact and change the style for that to reflect the inline style.


    > Style sheet precedence is supposed to place more importance on embedded styles
    than linked style sheets. In actual practice, you''ll find that both Internet
    Explorer and Netscape treat linked sheets as more important than embedded sheets
    (but they treat inline styles as more important than either of the other two).
    You''ll find that you have better luck if you use linked or embedded styles, but
    not more.


    Watch Out!


    # Formatting Text with Styles


    Text is the most important element of any Web page. Without text, there is nothing
    on the page to help people decide whether it''s worth coming.


    Text on an HTML page is structured by the <body>, <p>, <td>, <tr>, <th>, <h1>
    <h6>, <li> tags (among others). You can add your own style preferences to each
    of these tags using the style properties shown in Table 2.2.


    In the following example, we added some embedded style elements that set the font,
    font size, and color for the body of a basic HTML page. In Figure 2.6, you can
    see how those change the appearance of the document in the browser.


    ```

    <!DOCTYPE html>

    PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html1/DTD/xhtml1-transitional.dtd">

    <html xml lang="en">

    <head>

    <title>My First Web Page</title>

    <style type="text/css">

    body {font-family: Arial;

    font-size:12pt;

    color:red}

    </style>

    </head>

    <body>

    <p>This is my <b><i><i>first</i></b> Web page.</p>

    </body>

    </html>

    ```


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_50_0.png)'
