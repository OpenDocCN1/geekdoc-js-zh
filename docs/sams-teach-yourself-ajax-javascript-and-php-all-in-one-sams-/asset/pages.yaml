  md: '# The responseXML Property 261


    In general, you simply pass the type of the required page element as an argument
    to createElement() to generate the required type of element.


    # An Overview of DOM Methods


    This book is not just about JavaScript DOM techniques, so we''re not going to
    reproduce here a comprehensive guide to all the available methods and properties.
    However, Table 21.1 itemizes some of the most useful ones.


    > **Did you Know?**


    > [image]

    > If you need a more comprehensive account of the JavaScript DOM methods and properties,
    Andrew Watt gives a useful list in his excellent book Sams Teach Yourself in 10
    Minutes (Sams Publishing, ISBN 0673242717).


    TABLE 21.1 Some JavaScript DOM Properties and Methods

    | Node Properties | |

    |---|---|

    | childNodes | Array of child nodes |

    | firstChild | The first child node |

    | lastChild | The last child node |

    | nodeName | Name of the node |

    | nodeType | Type of node |

    | nodeValue | Value contained in the node |

    | nextSibling | Next node sharing the same parent |

    | previousSibling | Previous node sharing the same parent |

    | parentNode | Previous of this node |

    | Node Methods | |

    | AppendChild | Add a new child node |

    | HasChildNodes | True if this node has children |

    | RemoveChild | Deletes a child node |

    | Document Methods | |

    | CreateAttribute | Make a new attribute for an element |

    | CreateElement | Make a new document element |

    | CreateTextNode | Make a text item |

    | GetElementsByTagName | Create an array of tagnames |

    | GetElementsByById | Find an element by its ID |'
