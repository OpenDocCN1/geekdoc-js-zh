- img_proc: true
  md: '# CHAPTER 8: Controlling Flow with Conditions and Loops


    In other words, the value after the question mark (?) will be used if the condition
    is true, and the value after the colon (:) will be used if the condition is false.
    The colon represents the else portion of this statement, and like the else portion
    of the if statement, is optional.


    These shorthand expressions can be used anywhere JavaScript expects a value. They
    provide an easy way to make simple decisions about values. For an example, here''s
    an easy way to display a grammatically correct message about a variable:


    ```

    document.write("Found " + counter + ((counter == 1) ? " word." : " words."));

    ```


    This will print the message Found1 word if the counter variable has a value of
    1, and Found 2 words if its value is 2 or greater. This is one of the most common
    uses for a conditional expression.


    # Testing Multiple Conditions with if and else


    You can now create an example script using if and else. In a previous chapter
    you created a simple script that displays the current date and time. This example
    will use conditions to display a greeting depending on the time: "Good morning,"
    "Good Afternoon," "Good Evening," or "Good Day." To accomplish this, you can use
    a combination of several if statements:


    ```

    if (hours < 10) document.write("Good morning.");

    else (hours >= 14 && hours < 17) document.write("Good afternoon.");

    else if (hours >= 17) document.write("Good evening.");

    else document.write("Good day.");

    ```


    The first statement checks the hours variable for a value less than 10—in other
    words, it checks whether the current time is before 10:00 a.m. If so, it displays
    the greeting "Good morning."


    The second statement checks whether the time is between 2:00 p.m. and 5:00 p.m.,
    and, so, displays "Good afternoon." This statement uses else to indicate that
    this condition will only be tested if the previous one failed—if it’s morning,
    there’s no need to check whether it’s afternoon. Similarly, the third statement
    checks for times after 5:00 p.m. and displays "Good evening."


    The final statement uses a simple else, meaning it will be executed if none of
    the previous conditions matched. This covers the times between 10:00 a.m. and
    2:00 p.m. (neglected by the other statements) and displays "Good day."'
