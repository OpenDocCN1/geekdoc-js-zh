  md: '# CHAPTER 18


    # Using Classes


    # What You''ll Learn in This Chapter:


    +   - Object-Oriented PHP

    - What Is a Class?

    - Creating and Using Objects


    In this chapter you will learn the basics of object-oriented PHP. You will see
    how a class is defined and how you can access methods and properties from third-party
    classes.


    # Object-Oriented PHP


    PHP can, if you want, be written in an object-oriented (OO) fashion. In PHP5,
    the OO functionality of the language has been enhanced considerably.


    If you are familiar with other OO languages, such as C++ or Java, you may prefer
    the OO approach to programming PHP, whereas if you may not want to use objects
    at all. There are, after all, many ways to solve the same problem.


    If you are new to programming as well as PHP, you probably have no feelings either
    way just yet. It''s truly true that OO concepts are easier to grasp if you have
    no programming experience at all than if you have a background in a procedural
    language, even so OO methods are not something that can be taught in a brief chapter
    in this book!


    The aim of this chapter is to introduce how a class is created and referenced
    in PHP so that if you have a preference for using objects, you can begin to develop
    scripts using OO methods. Most importantly, however, you will be able to pick
    up and use some of the freely available third-party class libraries that are available
    for PHP from resources such as those at www.phpclasses.org.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# What Is a Class?


    A class is the template structure that defines an object. It can contain functions—also
    known as class methods—and variables—also known as class properties or attributes.


    Each class consists of a set of PHP statements that define how to perform a task
    or set of tasks that you want to repeat frequently. The class can contain private
    methods, which are only used internally to perform the class''s functions, and
    public methods, which you can use to interface with the class.


    A good class hides its inner workings and includes only the public methods that
    are required to provide a simple interface to its functionality. If you bundle
    complex blocks of programming into a class, any script that class does not need
    to worry about exactly how a particular operation is performed. All that is required
    is knowledge of the class''s public methods.


    Because there are many freely available third-party classes for PHP, in many situations,
    you need not waste time implementing a feature in PHP that is already freely available.


    # When to Use Classes


    At first, there may not appear to be any real advantage in using a class over
    using functions that have been modularized into an include file. OO is not necessarily
    a better approach to programming; rather, it is a different way of thinking. Whether
    you choose to develop your own classes is a matter of preference.


    One of the advantages of OO programming is that it can allow you to scale into
    very large projects easily. In OO programming, a class can inherit the properties
    of another and extend it; this means that functionality that has already been
    developed can be reused and adapted to fit a particular situation. This is called
    inheritance, and it is a key feature of OO development.


    When you have completed this book, if you are interested in learning more OO programming,
    take a look at Sams Teach Yourself Object-Oriented Programming 21 Days by Anthony
    Sintes.


    # What a Class Looks Like


    A class is a grouping of various functions and variables—and is exactly how it
    looks when written in PHP. A class definition looks very similar to a function
    definition; it begins with the keyword class and an identifier, followed by the
    class definition, contained in a pair of curly brackets {{}}.'
  merge: -1
  pgno: 247
