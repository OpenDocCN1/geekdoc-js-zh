  md: '# XOAD Events


    The XOAD framework also has support for *events*. An XOAD event instigated on
    one client''s computer can be stored on the server and subsequently detected by
    other clients, making it possible to build complex applications in which users
    can interact. Such applications might, for instance, include chat, groupware,
    or similar collaborative tools.


    # Cache Handling with XOAD


    XOAD allows for the caching on the server using the XOAD_Cache class. Caching
    results gives significant performance improvements, especially when server-side
    routines are time-intensive (such as sorting a large data set or performing queries
    on a sizeable database table).


    # XOAD Controls


    You can define custom client controls in XOAD using the XOAD_Controls class.


    > At the time of writing, the current version of XOAD is 0.6.0.0. If the version
    download is different, consult the documentation included in the download.


    # Summary


    This chapter examined a server-side implementation of an Ajax toolkit, in the
    form of XOAD.


    XOAD allows the methods contained within PHP classes stored on the server to be
    made available to client programs using JavaScript. This forms an interesting
    contrast in approach to the client-side techniques discussed in Chapters 25 and
    26.


    This concludes Part VI of the book and, in fact, the book itself. You should now
    have a good understanding of JavaScript programming, PHP programming and Ajax
    application architecture.'
