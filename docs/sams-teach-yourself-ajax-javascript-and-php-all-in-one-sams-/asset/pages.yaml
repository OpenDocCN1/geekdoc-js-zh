  md: '# CHAPTER 8


    # Controlling Flow with

    Conditions and Loops


    What You''ll Learn in This Chapter:


    +   - The if Statement

    - Using Shorthand Conditional Expressions

    - Testing Multiple Conditions with if and else

    - Using Multiple Conditions with switch

    - Using for Loops

    - Using while Loops

    - Working with Loops

    - Looping Through Object Properties


    Statements in a JavaScript program generally execute in the order in which they
    appear, one after the other. Because this isn''t practical, most programming languages
    provide flow control statements that let you control the order in which code is
    executed. Functions, which you learned about in the previous chapter, are one
    type of flow control—although a function might be defined first thing in your
    code, its statements can be executed anywhere in the script.


    In this chapter, you''ll look at two other types of flow control in JavaScript:
    conditions, which allow a choice of different options depending on a value, and
    loops, which allow repetitive statements.'
