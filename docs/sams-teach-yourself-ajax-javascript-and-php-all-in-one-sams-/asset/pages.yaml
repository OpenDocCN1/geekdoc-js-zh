  md: '# Arguments and Return Values


    However, the following two calls to mail are both valid:

    mail("chris@lightwood.net", "Hello", "This is a test email");

    mail("chris@lightwood.net", "Hello", "This is a test email",

    "Cc: editor@sampublishing.com");


    To have more than one argument in your own function, you simply use a comma-separated
    list of variable names in the function definition. One of these arguments optional,
    you assign it a default value in the argument list, the same way you assign a
    value to a variable.


    The first example is a variation of add_tax that takes two arguments—the amount
    and the tax rate to add on. $rate has a default value of 10, so it is an optional
    argument:


    ```

    function add_tax_rate($amount, $rate=10) {

    $total = $amount * (1 + ($rate / 100));

    return($total);

    }

    ```


    Using this function, the two calls are both valid:

    add_tax_rate(16);

    add_tax_rate(16, 9);


    The first example uses the default rate of 10%, whereas the second example specifies
    a rate of 9% to be used—producing the same behavior as the original add_tax function
    example.


    > All the optional arguments to a function must appear at the end of the argument
    list, with the required values passed in first. Otherwise, PHP will not know which
    arguments you are passing to the function.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_242_0.png)


    # Variable Scope


    The reason values have to be passed in functions as arguments has to do with variable
    scope—the rules that determine what sections of script are able to access which
    variables.


    The basic rule is that any variables defined in the main body of the script cannot
    be used inside a function. Likewise, any variables used inside a function cannot
    be seen by the main script.'
