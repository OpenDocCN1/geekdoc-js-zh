  md: '# Understanding the Document Object Model (DOM)


    The DOM is not part of the JavaScript language—rather, it''s an API (application
    programming interface) built into the browser. While the DOM is most used with
    JavaScript, it can also be used by other languages, such as VBScript and Java.


    By the Way


    The objects in the DOM have properties—variables that describe the web page and
    and methods—functions that enable you to work with parts of the web page.


    When you refer to an object, you use the parent object name followed by the child
    object name or names, separated by periods. JavaScript stores objects to represent
    images in a document as children of the document object. The following refers
    to the image9 a child of the document object, which is a child of the window object:


    window.document.image9


    The window object is the parent object for all the objects we will be looking
    at in this chapter. Figure 5.1 shows this section of the DOM object hierarchy
    and a variety of its objects.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_88_0.png)


    FIGURE 5.1

    The DOM object hierarchy.


    This diagram only includes the basic browser objects that will be covered in this
    chapter. These are actually a part of the DOM, but a full discussion of all DOM
    objects is beyond the scope of this book.


    By the Way


    # History of the DOM


    Starting with the introduction of JavaScript 1.0 in Netscape 2.0, browsers have
    included objects that represent parts of a web document and other browser features.
    However, there was never a true standard. While both Netscape and Microsoft'
  merge: -1
  pgno: 88
