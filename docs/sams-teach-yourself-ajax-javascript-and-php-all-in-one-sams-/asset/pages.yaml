- img_proc: true
  md: '+   You can specify the two indexes in either order. The smaller one will be
    assumed to be the first index. In the previous example, (6,3) would have produced
    the same result. Of course, there is rarely a reason to use the reverse order.


    As another example, suppose you defined a string called alpha to hold the alphabet:

    alalpha = "ABCQRSTUVWXYZ";


    The following are examples of the substring() method using this string:


    +   alpha.substring(0,4) returns ABCD.


    +   alpha.substring(10,12) returns KL.


    +   alpha.substring(12,10) also returns KL. Because it''s smaller, 10 is used
    as the first index.


    +   alpha.substring(6,7) returns G.


    +   alpha.substring(24,26) returns YZ.


    +   alpha.substring(0,26) returns the entire alphabet.


    +   alpha.substring(6,6) returns the null value, an empty string. This is true
    whenever the two index values are the same.


    # Getting a Single Character


    The charAt method is a simple way to grab a single character from a string. You
    specify the character''s index, or position, in parentheses. The indexes begin
    at 0 for the first character. Here are a few examples using the alpha string:


    +   alpha.charAt(0) returns A.


    +   alpha.charAt(12) returns M.


    +   alpha.charAt(25) returns Z.


    +   alpha.charAt(27) returns an empty string because there is no character at
    that position.'
