  md: '# PHP Basics


    The CD accompanying this book includes the powerful and convenient XAMPP package.
    If you would like your own server environment for your PHP experiments, rather
    than using hosted web page, you can use this package to install the Apache server,
    fully configured with PHP interpreter and other tools, on your own PC or on another
    PC on your network.


    # On the CD


    # PHP Tags


    Consider the following extract from a PHP-driven web page that displays the current
    date:

    Today is <?php date(''j F Y'');\?>


    The <?php tag tells PHP that everything that follows is program code rather than
    HTML, until the closing ?>. In this example, the echo command tells PHP to display
    the next item to screen; the date command produces a formatted version of the
    current date, containing the day, month, and year.


    > The semicolon character is used to indicate the end of a PHP command. The previous
    examples, there is only one command, the semicolon is not actually required, but
    it is good practice to always include it to show that a command is complete.


    # By the Way


    In this book PHP code appears inside tags that look like <?php ... ?>. Other tag
    styles can be used, so you may come across other people''s PHP code beginning
    tags that look like < (the short tag), <% (the ASP tag style) or <SCRIPT LANGUAGE="php">
    (the script tag).


    Of the different tag styles that can be used, only the <<?php tag and the script
    tag are always available. The others are turned off or by using a PHP configuration
    setting.


    > It is good practice to use the <?php tag style so your code will run on any
    system that has PHP installed, with no additional configuration needed. If you
    are tempted to use <?? as a shortcut, know that any time you move your code to
    another web server, you need to be sure it will understand this tag style.


    # Did you Know?'
