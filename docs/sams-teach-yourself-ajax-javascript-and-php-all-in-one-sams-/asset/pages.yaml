- img_proc: true
  md: "# TABLE 16.1 Conditional Operators in PHP\n\n| Operator | Description |\n|\
    \ --- | --- |\n| == | Is equal to |\n| === | Is identical to (is equal and is\
    \ the same data type) |\n| != | Is not equal to |\n| !== | Is not identical to\
    \ |\n| < | Is less than |\n| <= | Is less than or equal to |\n| > | Is greater\
    \ than |\n >= | Is greater than or equal to |\n\n> Be careful when comparing for\
    \ equality to a double equals symbol (==). A single = is always an assignment\
    \ operator, unless the value assigned is zero, your condition will always return\
    \ true—and remember TRUE is any nonzero value. Always use == when comparing two\
    \ values to avoid headaches.\n\n![](img/5a65c4ec3b3e08b6ff226ca847fae85a_232_0.png)\n\
    \n# Logical Operators\n\nYou can combine multiple expressions to check two or\
    \ more criteria in a single conditional statement. For example, the following\
    \ conditional statement checks whether the value of $number is between 5 and 10:\n\
    \n```\n$number = 8;\nif ($number >= 5 and $number <= 10) {\n  echo \"$number is\
    \ between five and ten\";\n}\n```\n\nThe keyword is a logical operator, which\
    \ signifies that the overall condition will be true only if the expressions on\
    \ either side are true. That is, $number has to be both greater than or equal\
    \ to 5 and less than or equal to 10.\n\nTable 16.2 shows the logical operators\
    \ that can be used in PHP."
