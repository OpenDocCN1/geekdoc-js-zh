  md: '# CHAPTER 22: Web Services and the REST and SOAP Protocols


    Clearly we can now process this XML document in any way we want. For example,
    Chapter 21, “Returning Data as XML,” discussed how to use JavaScript DOM methods
    to select information from the XML document and place it in page elements added
    to the DOM of our document.


    # REST and Ajax


    You already know that the XMLHttpRequest object has methods that allow you to
    deal directly with HTTP request types and URLs.


    Accessing RESTful web services is therefore simplified to a great extent. Because
    you know that each resource exposed by the web service API has a unique URL, and
    that the methods available by the service are standard HTTP methods, it becomes
    a simple matter to construct the required XMLHttpRequest calls.


    The prospect of being able to access a wide variety of web services from Ajax
    applications, and use the returned information within those applications, is attractive—even
    more if you use a consistent and simple interface protocol.


    # Web Services Using SOAP


    In the last section, we discussed web services and in particular how the REST
    (Representational State Transfer) protocol can be used to provide a consistent
    application programming interface (API) to such services.


    REST is a good example of a protocol designed to operate with resource-oriented
    services, that provide a simple mechanism to locate a resource and a set of basic
    methods that can manipulate that resource. In a resource-oriented service, these
    methods normally revolve around creating, retrieving, modifying, and deleting
    pieces of information.


    In the case of REST, the methods are those specified in the HTTP specifications—GET,
    POST, PUT, and DELETE.


    In certain cases, however, we are more interested in the actions a web service
    can carry out in the resources it can control. We might call such services action-oriented.
    In these situations the resources themselves may have importance, but the key
    issues concern the details of the activities undertaken by the service.


    Perhaps the most popular and widely used protocol for designing action-oriented
    web services is SOAP, the Simple Object Access Protocol.'
  merge: -1
