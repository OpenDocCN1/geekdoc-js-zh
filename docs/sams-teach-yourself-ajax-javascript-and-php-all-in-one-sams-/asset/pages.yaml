  md: '# Sending the Server Request


    First, we need to create an instance of an XMLHttpRequest object and call it myRequest.
    You''ll no doubt recognize the code for this from Chapter 10.


    Next we''ll look at the function callAjax().


    The first line simply declares a variable and assigns a value to it:


    ```

    var lastname = ''Smith'';",

    ```


    This is the piece of data that our function intend to send to the server, as the
    value of a variable surname that is required by our server-side script. In reality,
    of course, the value of such data would be obtained dynamically by handling a
    page event such as a mouse click or a keyboard entry, but for now this will serve
    as a simple example.


    The server request we intend to make is a GET request, we must construct a suitable-target
    URL having our parameter and value pairs suitably coded on the end; the next line
    carries this out:


    ```

    var url = "myservicecript.php?surname=" + lastname;

    ```


    We deal briefly with the open() method in Chapter 10. We use it in the next line
    to prepare our server request:


    ```

    myRequest.open("GET", url, true);

    ```


    This line specifies that we are preparing a GET request, url, and passes it to
    the destination-URL complete with the appended content of the GET request.


    The third parameter, true, true, indicates that we want our request to be handled
    asynchronously. In this case it could have been omitted because the default value
    of true is assumed in such cases. However it does no harm to include it for clarity.


    Next, we need to tell our XMLHttpRequest object myRequest what it should do when
    the “progress reports” it will receive from the server. The XMLHttpRequest object
    has a property onreadystatechange that contains information about what JavaScript
    function should be called whenever the server status changes, and in the next
    line


    ```

    myRequest.onreadystatechange = responseAjax;

    ```


    We assign the function responseAjax() to do this job. We will write this function
    later in the chapter.'
