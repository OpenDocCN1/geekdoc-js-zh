  md: "Occasionally, you might want to create an infinite loop deliberately. This\
    \ might include situations when you want your program to execute until the user\
    \ stops, or if you are providing an escape route with the break statement, which\
    \ is introduced in the next section. Here's an easy way to create an infinite\
    \ loop:\n\n```\nwhile (true) {\n```\n\nBecause the true value is the conditional,\
    \ this loop will always find its condition to be true.\n\n# Escaping from a Loop\n\
    \nThere is one way out of an infinite loop. You can use the break statement during\
    \ a loop to exit it immediately and continue with the first statement after the\
    \ loop. Here is a simple example of the use of break:\n\n```\nwhile (true) {\n\
    ++;\nif (values[n] == 1) break;\n}\n```\n\nAlthough the while statement is set\
    \ up as an infinite loop, the if statement checks the corresponding value of an\
    \ array. If it finds a value of 1, it exits the loop.\n\nWhen the JavaScript interpreter\
    \ encounters a break statement, it skips the rest of the loop and continues with\
    \ the first statement after the right brace at the loop's end. You can use the\
    \ break statement in any type of loop, whether infinite or not. This provides\
    \ an easy way to exit if an error occurs, or if another condition is met.\n\n\
    # Continuing a Loop\n\nOne statement is available to help you control the execution\
    \ of statements in a loop. The continue statement skips the rest of the loop but,\
    \ unlike break, it continues with the next iteration of the loop. Here is a simple\
    \ example:\n\n```\nfor (i=1; i<21; i++) {\n  if (score[i]==0) continue;\n  document.write(\"\
    Student number \",i,\" Score: \", score[i], \"\\n\");\n}\n```\n\nThis script uses\
    \ a for loop to print out scores for 20 students, stored in the score array. If\
    \ the if statement is used to check for scores with a value of 0, the script assumes\
    \ that a score of 0 means that the student didn't take the test, so it continues\
    \ the loop without printing that score."
