- img_proc: true
  md: '# On the CD


    You will find a copy of Script.aculo.us on the CD accompanying this book. Alternatively,
    you can download the latest version of the library from the Script.aculo.us website
    at http://script.aculo.us/downloads.


    The download is available as a Zip file. Inside the Zip file you will find a folder
    called scriptaculous-js-x.x.x. You will need the following files from the folders
    under this:


    +   * prototype.js (The Prototype library) from the lib folder

    * effects.js (the effects functions) from the src folder


    Copy both of these files to a folder on your computer, and be sure to create your
    demonstration script in the same folder.


    # By the Way


    The Script.aculo.us download includes many other files, and you can include the
    entire library if you intend to use all of its features. For this example, you
    only need the two files described here.


    # Including the Files


    To add the library to your HTML document, simply use <script> tags to include
    the two JavaScript files you copied from the:


    ```

    <script type="text/javascript" src="prototype.js"></script>

    <script type="text/javascript" src="effects.js"></script>

    ```


    If you include these statements as the first things in the <head> section of your
    document, the library functions will be available to other scripts or event handlers
    anywhere in the page.


    # Using Effects


    After you have included the library, simply need to include a bit of JavaScript
    to trigger the effects. We will use a section of the page wrapped in a <div> tag
    with the id value test to demonstrate the effects. Each effect is triggered by
    a simple event handler on a button. For example, this code defines the Fade Out
    button:


    ```

    <input type="button" value="Fade Out"

    OnClick="new Effect.Fade(''test'')">

    ```'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Building the Script


    The us $ function built into Prototype to obtain the object for the element with
    the id value test, and then passes it to the Effect.Fade function built into Script.aculo.


    This example will demonstrate six effects: Fade, Appear, SlideUp, SlideDown, Highlight,
    and shake. There are more than 16 effects in the library, plus methods for supporting
    Drag and Drop and other features. See http://script.aculo.us for details.


    > Did you Know?


    # Building the Script


    After you have included the libraries, you can combine them with event handlers
    and some example text to create a complete demonstration of Script.aculo.us effects.
    The complete HTML document for this example is shown in 27.1.


    # LISTING 27.1 The Complete Library Effects Example


    ```

    <html>

    <head>

    <title>Testing script.aculo.us effects</title>

    <script type="javascript" src="prototype.js"></script>

    <script type="javascript" src="effects.js"></script>

    </head>

    <body>

    <h1>Testing script.aculo.us effects</h1>

    <form name="format">

    <input type="button" value="Fade Out"

    onclick="new Effect.Fade(''$test'')")

    <input type="button" value="Fade In"

    onclick="new Effect.Appear(''$test'')")

    <input type="button" value="Slide Up"

    onclick="new Effect.SlideUp(''$test'')")

    <input type="button" value="Slide Down"

    onclick="new Effect.SlideDown(''$test'')")

    <input type="button" value="Highlight"

    onclick="new Effect.Highlight(''$test'')")

    <input type="button" value="Shake"

    onclick="new Effect.Shake(''$test'')")

    </form>

    <div id="test"

    style="background-color:#CCC; margin:20px; padding:10px;">

    <h2>Testing Effects:</h2>

    <hr>

    <p>This section of the document is written within the &lt;div&gt; element with
    the &lt;id&gt=test &lt;b&gt; the event handlers on the buttons above send this
    object to

    a &lt;a href="http://script.aculo.us/"&gt;script.aculo.us&lt;/a&gt; library to
    perform effects. Click the buttons to see the effects.</p>

    </div>

    </body>

    </html>

    ```'
