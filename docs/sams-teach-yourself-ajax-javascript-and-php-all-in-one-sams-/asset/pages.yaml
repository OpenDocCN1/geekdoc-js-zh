  md: '# Creating Timestamps


    Don''t worry; you don''t have to count from January 1, 1970, each time you want
    to calculate a timestamp. The PHP function mtime returns a timestamp based on
    given date and time values.


    The arguments, in order, are the hour, minute, second, month, day, and year. The
    following example would assign $timestamp timestamp value for 8 a.m. on December
    25, 2001:


    ```

    $timestamp = mtime(8, 0, 0, 12, 25, 2001);

    ```


    The UNIX timestamp format counts from January 1, 1970, at midnight GMT. The mtime
    function returns a timestamp relative to the time zone in which your system operates.
    For instance, mtime would return a timestamp value 3600 higher running on a web
    server in Texas than on a machine in New York with the same arguments.


    The mtime function is forgiving if you supply it with nonsense arguments, such
    as a day of the month that does not exist. For instance, if you try to calculate
    a time-stamp for February 29 in a non-leap year, the value returned will actually
    represent March 1, as the following statement confirms:


    ```

    echo(''d/m/Y'', mtime(12, 0, 0, 2, 29, 2003));

    ```


    You can exploit this behavior as a way of performing date and time arithmetic.
    Consider the following example, which calculates and displays the date and time
    37 hours after midday on December 30, 2001:


    ```

    $time = mtime(12 + 37, 0, 0, 12, 30, 2001);

    echo date(''d/m/Y H:i:s'', $time);

    ```


    By adding a constant to one of the arguments in mtime, you can shift the timestamp
    returned by that amount. The date and time display as follows:

    01/01/2002 01:00:00


    The value returned in this example has correctly shifted the day, year, month,
    and hour values, taking into account the number of days in December and that December
    is the last month of the year.'
  merge: -1
