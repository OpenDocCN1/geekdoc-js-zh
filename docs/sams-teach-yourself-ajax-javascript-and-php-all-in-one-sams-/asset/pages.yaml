  md: '# Ajax Won’t Cure a Bad Design


    All the dynamic interactivity in the world won''t correct a web application with
    a design that is fundamentally flawed.


    All the tenets of good web design still apply to Ajax applications:


    +   - Write for multiple browsers and validate your code.

    - Comment and document your code well so that you can debug it later.

    - Use small graphics wherever possible so that they load quickly.

    - Make sure that your choices of colors, backgrounds, font sizes, and styles dont
    make pages difficult to read.


    > The W3C offers a free online validator at http://validator.w3.org/.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_316_0.png)


    # Some Programming Gotchas


    Some of these have been alluded to in various chapters, but it''s worth grouping
    them here. These are probably the most common programming issues that Ajax developers
    bump up against some time or other!


    # Browser Caching of GET Requests


    Making repeated GET requests to the same URL can often lead to the response not
    from the server but the browser cache. This problem seems especially significant
    when using Internet Explorer.


    Although this theory can be cured with the use of suitable HTTP headers, in practice
    the cache can be stubborn.


    An effective way of sidestepping this problem is to add a random element to the
    URL to which the request is sent; the browser interprets this as a request to
    a different page and returns a server page rather than a cached version.


    In the text we achieved this by adding a random number. Another approach favored
    by many is to add a number derived from the time, which will of course different
    every time:


    ```

    var url = "javascript.php?rand="+new Date().getTime();";

    ```'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Permission Denied Errors


    Receiving a Permission Denied error usually means that you have fallen foul of
    the security measure preventing cross-domain requests from being made by an XMLHttpRequest
    object.


    Calls must made to server programs existing in the same domain as the calling
    script.


    Be careful that the domain is written in exactly the same way. Somedomain.com
    may be interpreted as referring to a different domain from www.somedomain.com,
    and permission will be denied.


    # Escaping Content


    When constructing queries for GET or POST requests, remember to escape variables
    that could contain spaces or other nonexistent characters. In the following code,
    the value idValue has been collected from a text input field on a form, so we
    escape it to ensure correct encoding:


    ```

    http.open("GET", url + escape(idValue) + "&rand=" + myRandom, true);

    ```


    # Summary


    Ajax undoubtedly has the potential to greatly improve web interfaces. However,
    the paradigm change from traditional page-based interfaces to highly dynamic applications
    has created a few pitfalls for developers to step into. In this chapter we''ve
    tried to round up a few of the better-known ones.


    Some of these issues have already been encountered in the other chapters in this
    book, whereas others will perhaps not become apparent until you start to develop
    real-world applications.


    This chapter concludes Part V, “More Complex Ajax Technologies.” If you have followed
    the chapters through to this point, you will have a good grip on the fundamentals
    of the XMLHttpRequest object, JavaScript, XML, and the Document Object Model,
    and be capable of creating useful Ajax applications from first principles.


    Fortunately, you don''t have to always work from first principles. Many open source
    and commercial projects on the Internet offer a wide variety of Ajax frameworks,
    tools, and resources.


    Part VI, “Ajax Tools and Resources,” of the book concludes our journey through
    Ajax development by looking at these resources and their capabilities.'
