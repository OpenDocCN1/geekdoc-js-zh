  md: 'break;

    default:

    echo "I do not know who you are, $name";

    }


    Each case statement defines a value for which the next block of PHP code will
    be executed. If you assign your first name to $name and run this script, you will
    be greeted as a friend if your name is Damon or Shelley, and you will be told
    that you are not a friend if your name is Adolf or Saddam. If you have any other
    name, the script will tell you it does not know who you.


    There can be any number of case statements preceding the PHP code to which they
    relate. If the value that is being tested by the switch statement (in this case
    $name) matches any one of them, any subsequent PHP code will be executed until
    a break command is reached.


    > The break statement is important in a switch statement. When a case statement
    has been matched, any PHP code that follows will be executed—even if there is
    another case statement checking for a different value. This behavior can sometimes
    be useful, but mostly it is not what you want—so remember to put a break after
    every case.


    Any other value for $name will cause the default code block to be executed. With
    an else clause, default is optional and supplies an action to be taken if nothing
    else is appropriate.


    # Loops


    PHP offers three types of loop constructs that all do the same thing—repeat a
    code number of times—in slightly different ways.


    # The while Loop


    The while keyword takes a condition in parentheses, and the code block that follows
    is repeated while that condition is true. If the condition is false initially,
    the code block will not be repeated at all.


    > The repeating code must perform some action that affects the condition in such
    a way that the loop condition will eventually no longer be met; otherwise, the
    loop will repeat forever.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'The following example uses a while loop to display the square numbers from
    1 to 10:


    ```

    $count = 1;

    while ($count <= 10) {

    $square = $count * $count;

    print ''$count squared is $square <br>'';

    $count++;

    }

    ```


    The counter variable $count is initialized with a value of 1. The while loop calculates
    the square of that number and displays it, then adds to the value of $count. The
    ++ operator adds one to the value that precedes it.


    The loop repeats while the condition $ <= 10 is true, so the first 10 numbers
    and their squares are displayed in turn, and then the loop ends.


    # The do Loop


    The do loop is very similar to the while loop except that the condition comes
    after the block of repeating code. Because of this variation, the loop code is
    always executed at least once—even if the condition is initially false.


    The following do loop is equivalent to the previous example, displaying the numbers
    from 1 to 10, with their squares:


    ```

    $count = 1;

    do {

    $square = $count * $count;

    print ''$count squared is $square <br>'';

    $count++;

    } while ($count <= 10);

    ```


    # The for Loop


    The for loop provides a compact way to create a loop. The following example performs
    the same loop as the previous two examples:


    ```

    for ($count = 1; $count <= 10; $count++) {

    $square = $count * $count;

    print ''$count squared is $square <br>'';

    }

    ```


    As you can see, using for allows you to use much less code to do the same thing
    as with while and do.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'A for a statement has three parts, separated by semicolons:


    +   - The first part is an expression that is evaluated once when the loop begins.
    In the preceding example, you initialized the value of $count.

    - The second part is the condition. While the condition is true, the loop continues
    repeating. As with a while loop, if the condition is false to start with, the
    following code block is not executed at all.

    - The third part is an expression that is evaluated once at the end of each pass
    of the loop. In the previous example, $count is incremented after each line of
    the output is displayed.


    # Nesting Conditions and Loops


    So far you have only seen simple examples of conditions and loops. However, you
    can nest these constructs within each other to create some complex rules to control
    the flow of a script.


    > The more complex the flow control in your script, the more important it becomes
    to indent your code to make it clear which blocks of code correspond to which
    constructs.


    # Breaking Out of a Loop


    You have already learned about using the keyword break in a switch statement.
    You can also use break in a loop construct to tell PHP to immediately exit the
    loop and continue with the rest of the script.


    The continue keyword is used to end the current pass of a loop. However, unlike
    break, the script jumps back to the top of the same loop and continues execution
    until the loop condition fails.


    # Summary


    In this chapter you have learned how to vary the flow of your PHP script using
    conditional statements and loops. In the next chapter you will see how to create
    reusable functions from blocks of PHP code.'
  merge: -1
