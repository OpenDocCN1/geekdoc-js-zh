  md: "# CHAPTER 2: Writing Styling Pages in HTML and CSS\n\n# Linked Styles\n\nLinked\
    \ sheets hold all the style properties in a separate file. You then link the file\
    \ into each HTML document where you want those properties to appear.\n\n```\n\
    <head>\n<link rel=\"stylesheet\" href=\"mystyles.css\" type=\"text/css\">\n</head>\n\
    ```\n\nWith this method, I've created a style file called mystyles.css (for cascading\
    \ style sheet) that contains all my style properties. You can see that the type=\"\
    text/css\" आयु shows up. Following are the entire contents of the mystyles.css\
    \ file. These are the same styles that showed up in the preceding embedded styles\
    \ example, but now appear in a separate text file.\n\n```\ntable.nav {background:aqua;\n\
    table.rest {background:yellow;\text-align:center;\na:link {color:red;\ntext-decoration:none}}\n\
    ```\n\n# Inline Styles\n\nWith inline styles, the style properties are added to\
    \ the HTML tag as the tag is entered. This means that if I want the same style\
    \ to appear on all the <h1> tags in my document, I would have to type those styles\
    \ in all the <h1> tags. Look at the following example. I am still using the same\
    \ style properties, as in the previous examples, but now you can see how the two\
    \ tables were created using inline styles.\n\n```\n<table style=\"background:aqua\"\
    \ width=\"100%\">\n```\n\n```\n<table style=\"background:yellow; text-align:center;\n\
    color:black\" width=\"100%\">\n```\n\nWith inline styles, the <style> tag becomes\
    \ the style attribute. Multiple styles are still separated by semicolons, but\
    \ the entire group of properties for each tag is grouped within each HTML tag.\
    \ This type of style is fine for documents in which you want to apply styles to\
    \ only one or two elements, but you wouldn't want to do all that when you have\
    \ a lot of styles to add.\n\n# Cascading Precedence\n\nWeb browsers give precedence\
    \ to the style that appears closest to the tag. So, inline styles (which appear\
    \ as attributes within the tag itself) are most important. Embedded styles (which\
    \ appear at the top of the HTML file) are applied next, and linked styles (which\
    \ appear in another file altogether) are applied last."
