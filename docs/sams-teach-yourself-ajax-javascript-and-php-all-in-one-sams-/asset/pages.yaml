    \ Here is a simple example of a function definition:\n\n```\nfunction Greet()\
    \ {\n  alert(\"Greetings.\");\n}\n```\n\nThis defines a function that displays\
    \ an alert message to the user. This begins with the function keyword. The function's\
    \ name is Greet. Notice the parentheses after the function's name. As you'll learn\
    \ next, the space between them is not always empty.\n\nThe first and last lines\
    \ of the function definition include braces {{ }}. You use these to enclose all\
    \ of the statements in the function. The browser uses the braces to determine\
    \ where the function begins and ends.\n\nBetween the braces, this particular function\
    \ contains a single line. This uses the built-in alert function, which displays\
    \ an alert message. The message will contain the text \"Greetings.\"\n\nFunction\
    \ names are case sensitive. If you define a function such as Greet with a capital\
    \ letter, be sure you use the identical name when you call the function.\n\nNow,\
    \ about those parentheses. The current Greet function always does the same thing:\
    \ Each time you use it, it displays the same message. Although this avoids a bit\
    \ of typing, it doesn't really much of an advantage.\n\nTo make your function\
    \ more flexible, you can add parameters, also known as arguments. These are variables\
    \ that are received by the function each time it is called. For example, you can\
    \ add a parameter called who that tells the function the name of the person to\
