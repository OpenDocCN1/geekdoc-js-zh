  md: '# Rico’s Other Interface Interface


    The two JavaScript libraries rico.js and prototype.js are included in the <head>
    of the document along with style definitions for various page elements.


    Note that two elements in particular, a <div> container and a <textarea> input
    field, have been given IDs of dropzone1 and dropzone2. Further down the listing,
    these two elements are defined as drop zones for their drag-and-drop operations
    by the lines


    ```

    dndMgr.registerDropZone(new Rico.Dropzone(''droponeme''));

    dndMgr.registerDropZone(new Rico.Dropzone(''droponeme2''));

    ```


    You’ll see that three small <div> containers have been defined in the page and
    given IDs of draggable1, draggable2, and draggable3. As you have no doubt guessed,
    they are become draggable page elements and are defined as such by the following
    codes:


    ```

    dndMgr.registerDraggable(new Rico.Draggable(''foo'',

    -- ''draggable1''));

    dndMgr.registerDraggable(new Rico.Draggable(''foo'',

    -- ''draggable2''));

    dndMgr.registerDraggable(new Rico.Draggable(''foo'',

    -- ''draggable3''));

    ```


    That’s all to it! Rico takes care of all the details, even changing the look of
    the available drop zones while something is being dragged, as shown in Figure
    26.3.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_338_0.png)


