    \ } else {\n    // if readyState has changed\n    // but readyState <> 4\n   \
    \ document.getElementById('waiting')\n    innerHTML = '<img src=\"anim.gif\">';\n\
    \  }\n}\n```\n\nOn each change in value of the property readyState, the callback\
    \ function checks for the condition readyState == 4. Whenever this condition fails\
    \ to be met, the else condition of the outer loop uses the innerHTML property\
    \ to ensure that"
