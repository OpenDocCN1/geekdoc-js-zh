  md: '# CHAPTER 12


    # Using the Returned Data


    # What You''ll Learn in This Chapter:


    +   - The responseText and responseXML Properties

    - Parsing responseXML

    - Providing User Feedback


    In this chapter you will learn how to process the information returned from the
    server in response to an Ajax request.


    # The responseText and responseXML Properties


    Chapter 11, “Talking with the Server,” discussed the server communications that
    allow you to send and monitor asynchronous server requests. The final piece of
    the Ajax jigsaw is the information returned by the server in response to a request.


    This chapter discusses what forms that information can take, and how you can process
    it and use it in an application. We will use two of the XMLHttpRequest object''s
    properties, namely responseText and responseXML.


    Table 10.1 listed several properties of the XMLHttpRequest object that we have
    yet to describe. Among these are the responseText and responseXML properties.


    Chapter 10 discussed how we could use the readyState of the XMLHttpRequest object
    to determine the current status of the XMLHttpRequest. By the time our server
    request has completed, as detected by the condition myRequest.readyState == 4
    for our XMLHttpRequest object myRequest, the two properties responseText and responseXML
    will respectively contain text and XML representations of the data returned by
    the server.'
