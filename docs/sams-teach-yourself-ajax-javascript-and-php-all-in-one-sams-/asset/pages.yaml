  md: '# About the Author


    **Phil Ballard**, the author of Sams Teach Yourself Ajax in 10 Minutes, graduated
    in 1980 with an honors degree in electronics from the University of Leeds, England.
    Following an early career as a research scientist with a major multinational,
    he spent a few years in commercial and managerial roles within the high technology
    sector, later working full time as a software engineering consultant.


    Operating as “The Mouse Whisperer” (http://www.mousewhisperer.co.uk), Ballard
    has spent recent years involved solely in website and intranet design and development
    for an international portfolio of clients.


    **Michael Moncur** is a freelance webmaster and author. He runs a network of websites,
    including the Web’s oldest site about famous quotations, online since 1994. He
    wrote Sams Teach Yourself JavaScript in 24 Hours and has also written several
    bestselling books about networking, certification programs, and databases. He
    lives with his wife in Salt Lake City, Utah.'
