- img_proc: true
  md: '# The Callback Function


    When a server request is first made, the value of readyState is set to zero, meaning
    uninitialized.


    As the server request progresses, data begins to be loaded by the server into
    the XMLHttpRequest object, and the value of the readyState property changes accordingly,
    moving to 1 and 2.


    An object readyState value of 3, interactive, indicates that the object is sufficiently
    progressed so that certain interactivity with it is possible, though the process
    is not yet complete.


    When the server request has completed fully the object is available for further
    processing, the value of readyState changes finally to 4.


    Not all of the possible values may exist for any given object. The object may
    ''skip'' certain states if they bear no relevance to the object''s content type.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_178_0.png)


    In most practical cases, you should look for the readyState property to achieve
    a value of 4, at which point you can be assured that the server has finished its
    task and the XMLHttpRequest object is ready for use.


    # Server Status Codes


    In addition to the readyState property, you have a further means to check that
    an asynchronous request has executed correctly: the HTTP response status code.


    HTTP responses were discussed in Chapter 1. If you refer to Table 1.1 you will
    see that a response status code of 200 corresponds to an OK message from the server.


    We''ll see how to test for this as we develop our callback function.


    # The Callback Function


    By now, you have learned how to create an instance of an XMLHttpRequest object,
    declare the identity of a callback function, and prepare and send an asynchronous
    server request. You also know which property tells you the server response is
    available for use.


    Let''s look at our callback function, responseAjax().


    First, note that this function is called every time there is a change in the onreadystatechange
    property. Usually, when this function is called, it is'
