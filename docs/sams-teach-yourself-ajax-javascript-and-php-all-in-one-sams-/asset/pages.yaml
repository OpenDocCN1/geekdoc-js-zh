  md: '# CHAPTER 14


    # Getting to Know PHP


    # What You''ll Learn in This Chapter:


    +   - PHP Basics


    +   - Your First PHP Script


    In this chapter you will find out what PHP is all about and see what it is able
    to do.


    # PHP Basics


    PHP is hugely popular, and rightly so. Even if you haven''t come across an existing
    user singing its praises, you''ve almost certainly used a website that runs on
    PHP. This chapter clarifies what PHP does, how it works, and what it is capable
    of.


    PHP is a programming language that was designed for creating dynamic websites.
    It slots into your web server and processes instructions contained in a web page
    before that page is sent through your web browser. Certain elements of the page
    can therefore be generated-on-the-fly so that the page changes each time it is
    loaded. For instance, you can use PHP to show the current date and time at the
    top of each page in your site, as you''ll see later in this chapter.


    The name PHP is a recursive acronym that stands for PHP: Hypertext Preprocessor.
    It began life called PHP/FI, the "Fi" part standing for Forms Interpreter. Though
    the name was shortened a while back, one of PHP''s most powerful features is how
    easy it becomes to process data submitted in HTML forms. PHP can also talk to
    various database systems, giving you the ability to generate a web page based
    on a SQL query.


    For example, you could enter a search keyword into a form field on a web page,
    query a database with this value, and produce a page of matching results. You
    will have seen this kind of application many times before, at virtually any online
    store as as many websites-that do not sell anything, such as search engines.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# CHAPTER 14: Getting Know PHP


    The PHP language is flexible and fairly forgiving, making it easy to learn even
    if you have not done any programming in the past. If you already know another
    language, you will almost certainly find similarities here. In fact, many of the
    JavaScript programming concepts introduced in Part II of the book—numbers, strings,
    arrays, objects, and so on—will crop up again in our discussions about PHP, with
    only minor changes of syntax.


    # Server-Side Scripting


    The most important concept to learn when starting out with PHP is where exactly
    it fits into the grand scheme of things in a web environment. When you understand
    what PHP can and cannot do.


    The PHP module attaches to your web server, telling it that files with a particular
    extension should be examined for PHP code. Any PHP code found in the page is executed—with
    any PHP code replaced by the output it produces—before the web page is sent to
    the browser.


    > The usual web server configuration is that somefile.php will be interpreted
    by PHP whereas somefile.html will be passed straight through the web browser,
    without PHP getting involved.


    The only time the PHP interpreter is called upon to do something is when a web
    page is loaded. This could be when you click a link, submit a form, or just type
    in the URL of a web page. When the web browser has finished downloading the page,
    PHP plays no further part until your browser requests another page.


    Because it is only possible to check the values entered in an HTML form when the
    submit button is clicked, PHP cannot be used to perform client-side validation—in
    other words, check that the value entered in one file meets certain criteria allowing
    you to proceed to the next field. Client-side validation can be done using JavaScript,
    a language that runs inside the web browser itself, and JavaScript can be used
    together if that is the effect you require.


    The beauty of PHP is that it does not rely on the web browser at all; your script
    will run the same way whatever browser you use. Using server-side code, you do
    not need to worry about JavaScript being enabled or about compatibility with older
    browsers beyond the ability to display HTML that your script generates or is embed-'
  merge: -1
