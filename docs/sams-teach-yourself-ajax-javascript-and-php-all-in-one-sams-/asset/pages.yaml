    Note that the statement doesn''t change the value of the text variable. Methods
    return the upper- or lowercase version of the string, but they don''t change the
    string itself. If you want to change the string''s value, you can use a statement
    like this:


    ```

    test = test.toLowerCase();

    ```


    > Note that the syntax for these methods is similar to the length property introduced
    earlier. The difference is that methods always use parentheses, whereas properties
    don''t. TheUpperCase and to methods do not take any parameters, but you still
    need to use the parentheses.


    # Working with Substrings


    So far, you''ve worked with entire strings. JavaScript also enables you to work
    with substrings, or portions of a string. You can use the substring method to
    retrieve a portion of a string, or the charAt method to get a single character.
    These are explained in the following sections.


    # Using Part of a String


    The substring method returns a string consisting of a portion of the original
    string between two index values, which you must specify in parentheses. For example,
    the following statement displays the fourth through sixth characters of the text
    string:


    ```

    document.write(text.substring(3,6));

    ```


    At this point, you''re probably wondering where the 3 and the 6 come from. There
    are three things you need to understand about the index parameters:


    +   Indexing starts with 0 for the first character of the string, the fourth character
    is actually index 3.


    +   The second index is 3 noninclusive. A second index of 6 includes up to index
    5 (the sixth character).'
