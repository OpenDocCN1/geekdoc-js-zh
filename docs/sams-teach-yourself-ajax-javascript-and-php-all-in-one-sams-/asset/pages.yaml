  md: '# CHAPTER 27


    # # Using Script.aculo.us


    # ### What You''ll Learn in This Chapter:


    +   - Downloading the Library

    - Including the Files

    - Using Effects

    - Building the Script


    We have already seen in previous chapters how powerful the prototype.js library
    is, and we have used the Rico library, built on prototype.js, to create some visual
    effects with very little code.


    In this chapter you will learn the basics of using Script.aculo.us, a powerful
    Ajax and user interface development framework, also based on prototype.js.


    To see how simple it is to use, you will now create an example script that includes
    the Script.aculo.us library and use event handlers to demonstrate several of the
    available effects.


    | This example was created using version 1.5.1 of the Script.aculo.us library.
    It should work with later versions, but the library might have changed since this
    was written. If you have trouble, you might need to use this specific version.
    | Watch Out! |


    # ## Downloading the Library


    To use the library, you will need to obtain it and copy the files you need to
    the same folder where you will store your script.'
  merge: -1
