  md: '# CHAPTER 3


    # Anatomy of an Ajax Application


    # What You''ll Learn in This Chapter:


    +   - The Need for Ajax

    - Introducing Ajax

    - The Constituent Parts of Ajax

    - Putting It All Together


    In this chapter you will learn about the individual building blocks of Ajax and
    how they fit together to form the architecture of an Ajax application. Subsequent
    chapters will examine these components in more detail, finally assembling them
    into a working Ajax application.


    # The Need for Ajax


    In the following parts of the book, we shall discuss each of the core components
    in detail.

    Before discussing the individual components, though, let''s look in more detail
    at what we want from our Ajax application.


    # Traditional Versus Ajax Client-Server Interactions


    Chapter 1 discussed the traditional page-based model of a website user interface.
    When you interact with such a website, individual pages containing text, images,
    data entry forms, and so forth are presented one at a time. Each page must be
    dealt with individually before navigating to the next.


    For instance, you may complete the data entry fields of a form, editing and re-editing
    your entries as much as you want, knowing that the data will not be sent to the
    server until the form is submitted.


    Figure 3.1 illustrates this interaction.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# CHAPTER 3: Anatomy of an Ajax Application


    FIGURE 3.1  Traditional client–server interactions.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_57_0.png)


    After you submit a form or follow a navigation link, you then must wait while
    the browser refreshes to display the new or revised page that has been delivered
    by the server.


    As your experience as an Internet user grows, using this interface becomes almost
    second nature. You learn certain rules of thumb that help keep you out of trouble,
    such as “don’t click the Submit button a second time,” and “don’t click the Back
    button after submitting a form.”


    Unfortunately, interfaces built using this model have a few drawbacks. First,
    there is a significant delay while each new or revised page is loaded. This interrupts
    what we, as users, perceive as the “flow” of the application.


    Furthermore, a whole page must be loaded on each occasion, even when most of its
    content is identical to that of the previous page. Items common to many pages
    on a website, such as header, footer, and navigation sections, can amount to a
    significant proportion of the data contained in the page.


    Figure 3.2 illustrates a website displaying pages before and after the submission
    of a form, showing how much content has been reloaded and how relatively lit of
    the display has actually changed.


    This unnecessary download of data wastes bandwidth and further exacerbates the
    delay in loading each new page.


    # By the Way


    > Bandwidth refers to the capacity of a communications channel to carry information.
    On the Internet, bandwidth is usually measured in bps (bits per second) or in
    higher multiples such as Mbps (million bits per second).'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Introducing Ajax


    # 43


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_58_0.png)


    FIGURE 3.2

    Many page items are reloaded unnecessarily.


    # The Rich User Experience


    The combined effect of the issues just described is to offer a much inferior user
    experience than provided by the vast majority of desktop applications.


    On the desktop, you expect the display contents of a program to remain visible
    and the interface elements to respond to commands while the processes occur quietly
    in the background. As I write this chapter using a word processor, for example,
    I can save the document to disk, scroll or page up and down, and alter font faces
    and sizes without having to wait on each occasion for the entire display to be
    refreshed.


    Ajax allows you to add to your web application interfaces some of this functionality
    more commonly seen in desktop applications and often referred to as a rich user
    experience.


    # Introducing Ajax


    To improve the user''s experience, you need to add some extra capabilities to
    the traditional page-based Interface design. You want your user''s page to be
    interactive, responding to the user''s actions with revised content, and be updated
    without any interruptions for page loads or screen refreshes.


    To achieve this, Ajax builds an extra layer of processing between the web page
    and the server.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# CHAPTER 3: Anatomy of an Ajax Application


    This layer, often referred to as an Ajax Engine or Ajax Framework, intercepts
    requests from the user and in the background handles communications quietly, unobusively,
    and asynchronously. By this we mean that server requests and responses no longer
    need to coincide with particular user actions but may happen at any time convenient
    to the user and to the correct operation of the application. browser does not
    freeze and await the completion by the server of the last request but lets the
    user carry on scrolling, clicking, and typing in the current page.


    The updating of page elements to reflect the revised information received from
    the server is also looked after by Ajax, happening dynamically while the page
    continues to be used.


    Figure 3.3 represents how these interactions take place.


    Figure 3.3

    Ajax client-

    server Interaction.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_59_0.png)


    # A Real Ajax Application—Google Suggest


    To see an example of an Ajax application in action, let''s have a look at Google
    Suggest. This application extends the familiar Google search engine interface
    to offer the user suggestions for suitable search terms, based on what he has
    so far.


    With each key pressed by the user, the application''s Ajax layer queries Google''s
    server for similar search phrases and presents the returned data in a drop-down
    box. Along each suggested phrase is listed the number of results that would be
    expected for a search conducted using that phrase. At any point the user has the
    option to select one of these suggestions instead of continuing to type and have
    Google process the selected search.


    Because the server is queried with every keypress, this drop-down list updates
    dynamically as the user types—with no waiting for page refreshes or similar interactions.


    Figure 3.4 shows the program in action. You can try it for yourself by following
    the links from Google''s home page at http://www.google.com/webp?complete=1&hl=en.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# The Constituent Parts of Ajax


    45


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_60_0.png)


    ### 3.4

    An example of an Ajax application—Google Suggest.


    Next''s identify the individual components of such an Ajax application and see
    how they work together.


    > Google has presented Ajax-enabled applications that you can try, including the
    gmail web service and the Google Maps street mapping program. See the Google website
    at http://www.google.com/ for details.


    By the Way


    # The Constituent Parts of Ajax


    Now''s examine the components of an Ajax application one at a time.


    # The XMLHttpRequest Object


    When you click on a hyperlink or submit an HTML form, you send an HTTP request
    to the server, which responds by serving you to a new or revised page. For your
    web application to work asynchronously, however, you must have a means to send
    requests to the server without an associated request to display a new page.


    You can so by means of the XMLHttpRequest object. This JavaScript object is capable
    of making a connection to the server and issuing a request without the necessity
    of an associated page load.


    In following chapters you will learn what objects are, see how an instance of
    this object can be created, and see how its properties and methods can be used
    by JavaScript routines included in the web page to establish asynchronous communication
    with the server.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# CHAPTER 3: Anatomy of an Ajax Application


    # Did you

    Know?


    > As a security measure, the XMLHttpRequest object can generally make calls

    to URLs within the same domain as the calling page and cannot directly call a

    remote server.


    Chapter 5, “Working with the Document Object Model" will introduce the concept
    of

    objects in general, and this subject will be expanded in Chapter 7 “Using Functions

    and Objects."


    Chapter 10, “The Heart of Ajax”—the XMLHttpRequest Object, discusses how to cre-

    ate instance of the XMLHttpRequest object and reviews the object''s properties

    and methods.


    # Talking with the Server


    In the traditional style of web page, when you issue a server request via a hyperlink

    or a form submission, the server accepts that request, carries out any request,

    server-side processing, and subsequently serves you to a new page with content

    appropriate to the action you have undertaken.


    While this processing takes place, the user interface is effectively frozen. You
    are

    made aware of this, when the server has completed its task, by the appearance

    in the browser of the new or revised page.


    With asynchronous server requests, however, such communications occur in the

    background, and the completion of a request does not necessarily coincide with

    screen refresh or a new page being loaded. You must therefore make many arrange-

    minds to find out what progress the server has made in dealing with the request.


    The XMLHttpRequest possesses a convenient property to report on the

    progress of the server request. You can examine this property using JavaScript
    rou-

    tines to determine the point at which the server has completed its task and the

    results are available for use.


    Your Ajax armory must therefore include a routine to monitor the status of a

    request and to act accordingly. We''ll look at this in more detail in Chapter
    11,

    "Talking Happens with the Server"


    # What Happens at the Server?


    So far as the server-side script is concerned, the communication from the

    XMLHttpRequest object is just another HTTP request. Ajax applications care little

    about what languages or operating environments exist at the server; provided that

    the client-side Ajax layer receives a timely and correctly formatted HTTP response

    from the server, everything will work fine.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'It is possible to build simple Ajax applications with no server-side scripting
    at all, simply by having the XMLHttpRequest object call a static server resource
    such as XML or text file.


    Ajax applications may make calls to various server-side resources such as web
    services. Later in the book we''ll look at some examples of calling web services
    using protocols such as SOAP and REST.


    In this book we''ll be using the popular PHP scripting language for our server-side
    routines, but if you are more comfortable with ASP JSP or some other server-side
    language, go right ahead and use it in your Ajax applications.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_62_0.png)


    # Dealing with the Server Response


    Once notified that an asynchronous request has been successfully completed, you
    may then utilize the information returned by the server.


    Ajax allows for this information to be returned in a number of formats, including
    ASCII text and XML data.


    Depending on the nature of the application, you may then translate, display, or
    otherwise process this information within the current page.


    We''ll look into these issues in Chapter 12, “Using the Returned Data.”


    # Other Housekeeping Tasks


    An Ajax application will be required to carry out a number of other duties, too.
    Examples include detecting error conditions and handling them appropriately, and
    keeping the user informed about the status of submitted Ajax requests.


    You will see various examples in later chapters.


    # Putting It All Together


    Suppose you want to design a new Ajax application, or update a legacy application
    to include Ajax techniques. How do you go about it?


    First we need to decide what page and user actions will be responsible for causing
    the sending of an asynchronous HTTP request. You may decide, for example, that
    the action of moving the mouse cursor over an image will result in a request sent
    to the server to retrieve further information about the subject of the picture,
    or that the clicking of a button will generate a server request for information
    with which to populate the fields on a form.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'JavaScript can be used to execute instructions on occurrences such as these,
    by employing event handlers. The details of how will be covered in detail in the
    follow-ing chapters. In your Ajax applications, such methods will be responsible
    for initiating asynchronous HTTP requests via XMLHttpRequest.


    Having made the request, you need to write routines to monitor the progress of
    that request until you hear from the server that the request has successfully
    completed.


    Finally, after receiving notification that the server has completed its task,
    you need a routine to retrieve the information returned from the server and apply
    it in the application. You may, for example, want to use the newly returned data
    to change the contents of the page''s body text, populate the fields of a form,
    or pop open an information window.


    Figure 3.5 shows the flow diagram of all this.


    # FIGURE 3.5

    How the components of an Ajax application work together.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_63_0.png)


    In Chapter 13, "Our First Application," you''ll use what you have learned to construct
    a complete Ajax application.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Ajax Frameworks


    While it is essential for a complete understanding of Ajax to understand what
    role each of the individual components plays, it is thankfully not necessary to
    rewrite all of your code for each new application. Your Ajax code can be stored
    as a reusable library of common Ajax routines, ready to be reused wherever they
    may be needed. There are also many commercial and open-source frameworks that
    you can use in your projects to do the “heavy lifting.”


    We shall look at both of these techniques later in the book, where we develop
    our own JavaScript library for Ajax, and also consider several of the more popular
    open-source libraries.


    # Summary


    This chapter discussed the shortcomings of the traditional web interface, identifying
    specific problems we want to overcome. We also introduced the various building
    blocks of an Ajax application and discussed how they work together.


    In the following chapters we shall look at these components in more detail, eventually
    using them to build a complete Ajax application.


    That concludes Part I of the book, “Web Basics Refresher.” In Part II we shall
    begin to explore client-side programming using JavaScript.'
  merge: -1
