  md: '# CHAPTER 6: Using Variables, Strings, and Arrays


    You can declare an array without a specific length, and change the length later
    by assigning values to elements or changing the length property. For example,
    the following statements create a new array and assign values to two of its elements:


    ```

    test = new Array();

    test[0]=21;

    test[5]=22;

    ```


    In this example, the largest index number assigned so far is 5, the array has
    a length property of 6—remember, elements are numbered starting at 0.


    # Accessing Array Elements


    You can read the contents of an array using the same notation you used when assigning
    values. For example, the following statements would display the values of the
    first three elements of the scores array:


    ```

    scoredisp = "Scores: " + scores[0] + "," + scores[1] + "," + scores[2];

    document.write(scoredisp);

    ```


    > Looking at this example, you might imagine it would be inconvenient to display
    all the elements of a large array. This is an ideal job for loops, which enable
    you to perform the same statements several times with different values. You''ll
    learn all about loops in Chapter 8.


    # Using String Arrays


    So far, you''ve used arrays of numbers. JavaScript also allows you to use string
    arrays, or arrays of strings. This is a powerful feature that enables you to work
    with a large number of strings at the same time.


    # Creating a String Array


    You declare a string array in the same way as a numeric array—in fact, JavaScript
    does not make a distinction between them:


    ```

    names = new Array(30);

    ```


    You can then assign string values to the array elements:


    ```

    names[0] = "Henry J. Tillman";

    names[1] = "Sherlock Holmes";

    ```'
