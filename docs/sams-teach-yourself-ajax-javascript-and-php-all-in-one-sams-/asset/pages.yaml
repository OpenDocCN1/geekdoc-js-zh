  md: '# CHAPTER 10


    # The Heart of Ajax—the XMLHttpRequest Object


    What You''ll Learn In This Chapter:


    +   - Introducing XMLHttpRequest

    - Creating the XMLHttpRequest Object


    In this chapter you will learn how to create an instance of the XMLHttpRequest
    object regardless of which browser your user may use. The object''s properties
    and methods will be introduced.


    Chapter 3, "Anatomy of an Ajax Application," introduced the building blocks of
    an Ajax application and discussed how these pieces fit together.


    This chapter examines the object at the heart of every Ajax application—the XMLHttpRequest
    object.


    > You have already met JavaScript objects in Chapter 7, "Using Functions and Objects."
    The XMLHttpRequest object, after it has been created, becomes a further such object
    within the page''s object hierarchy and has its own properties and methods.


    # Introducing XMLHttpRequest


    XMLHttpRequest is supported by virtually all modern browsers, including Microsoft
    Internet Explorer 5+ and a variety of non-Microsoft browsers, including Mozilla,
    Firefox, Konquerer, Opera, and Safari, and is supported on a wide range of platforms,
    including Microsoft Windows, UNIX/Linux, and Mac OS X.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# CHAPTER 10: The Heart of Ajax —the XMLHttpRequest Object


    # Watch Out!


    > Some browsers may require attention to their security settings to allow the
    XMLHttpRequest object to operate correctly. See your browser''s documentation
    for details.


    The purpose of the XMLHttpRequest object is to allow JavaScript to formulate HTTP
    requests and submit them to the server. Traditionally programmed web applications
    normally make such requests *synchronously*, in conjunction with a user-initiated
    event as clicking on a link or submitting a form, resulting in a new or updated
    page being served to the browser.


    Using XMLHttpRequest, however, you can have your page make calls *asynchronously*
    in the background, allowing you to continue using the page without the interruption
    of a browser refresh and the loading of a new or revised page.


    This capability underpins all Ajax applications, making the XMLHttpRequest the
    key to Ajax programming.


    # Did you Know?


    > Although the object''s name begins with XML, in fact, any type of document may
    be returned from the server; ASCII text, HTML, and XML are all popular choices,
    and we will encounter all of these in the course of the book.


    # Creating the XMLHttpRequest Object


    You cannot make use of the XMLHttpRequest until you have created an instance of
    it. Creating an instance of an object in JavaScript is just a matter of making
    a call to a method known as the object''s constructor. In the case of XMLHttpRequest,
    however, you must change this routine a little to cater to the peculiarities of
    different browsers, as you see in the following section.


    # Different Rules for Different Browsers


    Microsoft first introduced the XMLHttpRequest object, implementing it in Internet
    Explorer 5 as an *ActiveX object*.


    # Did you Know?


    > ActiveX is a proprietary Microsoft technology for enabling active objects into
    web pages. Among the available web browsers, it is currently only supported in
    Microsoft''s Internet Explorer. Internet Explorer uses its built-in XML parser,
    MSXML, to create the XMLHttpRequest object.'
  merge: -1
  pgno: 165
