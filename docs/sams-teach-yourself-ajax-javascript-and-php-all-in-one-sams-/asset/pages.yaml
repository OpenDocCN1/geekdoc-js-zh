    element using JavaScript''s getElementById() method, which we have in Chapter
    12. We''ll then use the JavaScript innerHTML property to update the element''s
    contents:


    ```

    document.getElementById(''showtime'').innerHTML

    = timeValue.childNodes[0].nodeValue;

    ```


    # Employing Event Handlers


    Finally, we must decide how the server requests will be triggered. In this case
    we can slightly adjust the HTML document to use the onClick() event handler of
    the <button> object:


    ```

    <input type="button" value="Get Server Time"

    onclick="getServerTime()">

    ```


    This will correctly deal with the occasion when the Get Server Time button is
    clicked. It does, however, leave the <div> element empty when we first load the
    page.


    To overcome this little problem, we can use the onload() event handler of the
    page''s <body> element:


    ```

    <body style="background-color:#cccccc"

    onload="getServerTime()">

    ```


    This event handler fires as soon as the <body> area of the page has finished loading.


