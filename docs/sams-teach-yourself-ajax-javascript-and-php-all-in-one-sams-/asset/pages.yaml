- img_proc: true
  md: 'Local variables have a single function as their scope. They can be used only
    within the function they are created in.


    To create a global variable, you declare it in the main script, outside any functions.
    You can use the var keyword to declare the variable, as in this example:


    ```

    var students = 25;

    ```


    This statement declares a variable called students and assigns it a value of 25.
    If this statement is used outside functions, it creates a global variable. The
    var keyword is optional in this case, so this statement is equivalent to the previous
    one: students = 25;


    Before you get in the habit of omitting the var keyword, be sure you understand
    exactly when it''s required. It''s actually a good idea to always use the var
    keyword-you''ll avoid errors and make your script easier to read, and it won''t
    usually cause any trouble.


    > For the most part, the variables you''ve used in earlier chapters of this book
    have been global.


    A local variable belongs to a particular function. Any variable you declare with
    the var keyword in a function is a local variable. Additionally, the variables
    in the function''s parameter list are all local variables.


    To create a local variable within a function, you must use the var keyword. This
    JavaScript to create a local variable, even if there is a global variable with
    the same name.


    You should now understand the difference between local and global variables. If
    you''re still a bit confused, don''t worry—if you use the var keyword every time,
    you''ll usually end up with the right type of variable.


    # Assigning Values to Variables


    You can use the equal sign to assign a value to a variable. For example, this
    statement assigns the value 40 to the variable lines:


    ```

    lines = 40;

    ```


    You can use any expression to the right of the equal sign, including other variables.
    You have used this syntax earlier to add one to a variable:


    ```

    lines = lines + 1;

    ```'
