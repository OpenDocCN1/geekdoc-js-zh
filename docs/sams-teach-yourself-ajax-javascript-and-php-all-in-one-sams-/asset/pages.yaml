- img_proc: true
  md: '# Converting Other Date Formats to Timestamps


    If you have a date stored in a format like DD-MM-YYYY, it''s a fairly simple process
    to convert this to a timestamp by breaking up the string around the hyphen character.
    The explode function takes a delimiter argument and a string and returns an array
    that contains each part of the string that was separated by the given delimiter.


    The following example breaks a date in this format into its components and builds
    a timestamp from those values:


    ```

    $date = "03-05-1974";

    $parts = explode(''/'', $date);

    $timestamp = mktime(12, 0, 0,

    $parts[1], $parts[2]);

    ```


    For many date formats, there is an even easier way to create a timestamp—using
    the function strftime. The following examples display the same valid time-timestamp
    from a string date value:


    ```

    $timestamp = strtotime("3 May 04");

    $timestamp = strtotime("3rd May 2004");

    $timestamp = strtotime("May 3, 2004");

    $timestamp = strtotime("3-may-04");

    $timestamp = strtotime("2004-05-03");

    $timestamp = strtotime("05/03/2004");

    ```


    Note that in the last examples, the date format given is MM/DD/YYYY, not DD/MM/YYYY.
    You can find the complete list of formats that are acceptable to strftime- at
    www.gnu.org/software/tar/manual/html_chapter/tar_7.html.


    # Summary


    In this chapter you have learned about variables in PHP, and about the formats
    that can be stored within them, and also how to store and manipulate date and
    time values in PHP. In the next chapter you will learn about classes in PHP, and
    you will discover how to use third-party library classes that you download.'
