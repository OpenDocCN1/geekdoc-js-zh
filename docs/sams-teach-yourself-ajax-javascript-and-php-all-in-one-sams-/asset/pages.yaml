  md: '# CHAPTER 22


    # Web Services and the REST

    and SOAP Protocols


    What You''ll Learn in This Chapter:


    +   - Introduction to Web Services

    - REST—Representational State Transfer

    - Using REST in Practice

    - Web Services Using SOAP

    - The SOAP Protocol

    - Using Ajax and SOAP

    - Reviewing SOAP and REST


    In this chapter you will learn the basics of web services and how to implement
    them using the REST (Representational State Transfer) and SOAP (Simple Object
    Access Protocol) protocols.


    # Introduction to Web Services


    For you have seen several example applications in which we have called server-side
    scripts to carry out tasks. In each case we devised data structures to transfer
    the information and written routines to handle data transfer both to and from
    the server.


    Suppose, that you wanted to make your server-side programs more generally available.
    Perhaps you can imagine that several different web applications might interface
    with such scripts for their own purposes. As well as requesting pages directly,
    perhaps other applications (for example Ajax applications operating via XMLHttpRequest
    calls) might also make data requests and expect to receive, in response, data
    that they can understand and manipulate.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# CHAPTER 22: Web Services and the REST and SOAP Protocols


    In such cases it would be beneficial to have some form of standardization in the
    interfaces that your program makes available. This principle provides the basis
    of what have come to be known as web services.


    As an example, suppose that our server application produces XML-weighted forecast
    data in response to a request requesting geographical information.


    The nature of this type of service makes it broadly applicable; such an application
    might have a wide variety of “clients” ranging from simple web pages that present
    weather forecasts in their local area to complex aviation or travel planning applications
    that require the data for more demanding uses.


    This type of service is just one small example of what a web service might be
    capable of doing. Thousands of web services are active on the Internet, providing
    a mind-boggling array of facilities including user authentication, payment processing,
    content syndication, messaging, and a host of others.


    In general, a web service makes available an application programming interface
    (API), which allows client applications to build interfaces to the service. Although
    any Internet protocol might be used to create web services, XML, and HTTP are
    popular-options.


    A number of protocols and techniques have emerged that may help you to create
    and utilize web services. This chapter looks at perhaps the simplest of those,
    called REST (Representational State Transfer), and another protocol, this time
    called SOAP (the Simple Object Access Protocol). Each section highlights in particular
    how they may be useful in Ajax applications.


    # REST—Representational State Transfer


    REST is centered on two main principles for generalized network design:


    +   Resources are represented by URLs—A resource can be thought of as a “noun”
    and refers to some entity we want to deal with in the API of a web service; this
    could be a document, a person, a meeting, a location, and so on. Each resource
    in a REST application has a unique URL.


    +   Operations are carried out via standard HTTP methods—HTTP methods as GET,
    POST, PUT, and DELETE are used to carry out operations on resources. In this way
    we can consider such operations as “verbs” acting on resources.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# REST—Representational State Transfer


    # A Hypothetical REST Example


    To understand how and why we might apply these ideas, let''s look at a hypothetical
    example.


    Suppose that we have a web service that allows writers to submit, edit, and read
    articles. Applying so-called RESTful principles to the design of this application,
    the following occurs:


    +   - Each submitted article has a unique URL, for example:

    `http://somedomain.com/articles/173`


    We only require the URL to be unique for each article; for instance

    `http://somedomain.com/articles/list.php?id=173`


    also fulfils this requirement.


    Although REST requires that URLs are unique, it does not follow that each resource
    must have a corresponding physical page. In many cases the resource is generated
    by the web service at the time of the request—example, by reference to a database.


    > Did you Know?


    +   - To retrieve an article to read or edit, our client application would simply
    use an HTTP GET request to the URL of the article in question.


    +   - To upload a new article, a POST request would be used, containing information
    about the article. The server would respond with the URL of the newly uploaded
    article.


    +   - To upload an edited article, a PUT request would be used, containing the
    revised content.


    +   - HTTP DELETE would be employed to delete a particular article.


    In this, the web service is using an interface familiar to one who has used the
    World Wide Web. We do not need to devise a library of API methods for sending
    or retrieving information; we already have them in the form of the standard HTTP
    methods.


    | The World Wide Web itself is a REST application.


    By the Way'
  merge: -1
