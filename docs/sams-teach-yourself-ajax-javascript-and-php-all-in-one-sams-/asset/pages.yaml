  md: 'However, date arithmetic with this format is nearly impossible. While you can
    add

    one to 20040501, for instance, and find the next day in that month, simply adding

    one one to 20030531 would result in a nonsense date of May 32.


    # UNIX Timestamp Format


    The UNIX timestamp format is an integer representation of a date and time. It
    is a

    value that counts the number of seconds since midnight on January 1, 1970 and

    was discussed briefly in Chapter 9.


    Right now, we have a 10-digit date and time timestamp. To find the current time-

    tamp, you use the function:


    ```

    echo time();

    ```


    The UNIX timestamp format is useful because it is very easy to perform calculations

    because you know that the value always represents a number of seconds. For

    example, you can just add 3,600 to a timestamp value to increase the time by one

    hour or add 86,400 to add one day—because there are 3,600 seconds in an hour

    and 86,400 seconds in a day.


    One drawback, however, is that the UNIX timestamp format cannot handle dates

    prior to 1970. Although some systems may be able to use a negative timestamp

    value to count backward from the Epoch, this behavior cannot be relied on.


    Timestamps are good for representing contemporary date values, but they may not

    always be suitable for handling dates of birth or dates of historical significance.
    You

    should consider what values you will be working with when deciding whether

    testamp is the correct format to use.


    # Working with Timestamps


    There are times when using your own date format is beneficial, but in most cases

    testamp is the best choice. Let''s look at how PHP interacts with the timestamp

    date format.


