    > > The World Wide Web Consortium is responsible for administering the definitions
    of HTML, HTTP.XML, and many other web technologies. Its website is at http://www.w3.org.


    # Adding Your Own Style


    As you''ve already learned, HTML was written as a markup language for deforming
    the structure of a document (paragraphs, headings, tables, and so). Although it
    was never intended to become a desktop publishing tool, it could include some
    basic formatting attributes, such as font-size, align and the aforementioned.
    In 1996, the W3C first recommended the idea of Cascading Style Sheets (CSS) to
    format HTML documents. The recommendation, which was updated in mid-1998, enables
    web developers to separate the structure and format of their documents.


    The CSS recommendation describes the three types of style sheets:


    +   - **Embedded** The style properties are included (within the <style> tags)
    at the top of the HTML document. A style assigned to a particular tag applies
    to all those tags in this type of document. In this book, you''ll see embedded
    style sheets often.


    +   - **Inline** The style properties are included throughout the HTML page. Each
    HTML tag receives its own style attributes as they occur in the page.


    +   - **Linked** The style properties are stored in a separate file. That file
    can be linked to any HTML document using a <link> tag placed within the <head>
    tags.


    In the following sections, you''ll learn how to construct these style sheets and
    how to apply them to your documents.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Even without all the formatting benefits that style sheets provide, web developers
    can rejoice in knowing that using style sheets will no doubt be the biggest savers
    they''ve ever encountered. Because you can apply style sheets to as many HTML
    documents as you like, making changes a matter of minutes rather than days. Before
    the advent of style sheets, if you wanted to change the appearance of a particular
    tag in your website, you would have to open each document, find the tag you wanted
    to change, make the change, save the document, and continue to the next document.
    With style sheets, you can change the class in a single style document and the
    changes take effect immediately in all the pages linked to it.


    # Did you Know?


    # Defining the Rules


    Style sheet rules are made up of selectors (the HTML tags that receive the style)
    and declarations (the style sheet properties and their values). In the following
    example, the selector is the body tag and the declaration is made up the style
    property (background) and its value sets the background color for the entire document
    to black.


    ```

    body (background:black)

    ```


    You can see that, in a style sheet, the HTML tag is not surrounded by brackets
    as it would be in the HTML document, and the declaration is surrounded by curly
    braces. Declarations can contain more than one property. The following example
    also sets the text color for this page to white. Notice that the two properties
    are separated by a semicolon.


    ```

    body {background:black; color:white}

    ```


    If you want to apply the same rules to several HTML tags, you could group those
    rules together, in the following example:


    ```

    body, td, h1 { background:black; color:white }

    ```


    # Add a Little class


    As the old saying goes, rules are made to be broken. If you don''t want every
    single h1 heading in your document to be white on a black background? Maybe you
    want every other h1 heading to be yellow on a white background. Let me introduce
    you to the class attribute. You can apply this attribute to almost every HTML
    tag, and it''s almost like creating your own tags.'
