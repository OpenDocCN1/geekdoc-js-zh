  md: 'As with numeric arrays, you can also specify a string array''s contents when
    you create it. Either of the following statements would create the same string
    array as the preceding example:


    ```

    names = new Array("Henry J. Tillman", "Sherlock Holmes");

    names = ["Henry J. Tillman", "Sherlock Holmes"];

    ```


    You can use string array elements anywhere you would use a string. You can even
    use the string methods introduced earlier. For example, the following statement
    prints the first five characters of the first element of the names array, resulting
    in Henry:


    ```

    document.write(names[0].substring(0,5));

    ```


    # Splitting a String


    JavaScript includes a string method split, which splits a string into its component
    parts. To use this method, specify the string to split and a character to divide
    the parts:


    ```

    test = "John Q. Public";

    parts = test.split(" ");

    ```


    In this example, the test string contains the name John Q. Public. The split method
    in the second statement splits the name string at each space, resulting in three
    strings. These are stored in a string string array called parts. After the example
    statements execute, the elements of parts contain the following:


    +   - parts[0] = "John"

    - parts[1] = "Q."

    - parts[2] = "Public"


    JavaScript also includes an array method, join, which performs the opposite function.
    This statement reassembles the parts array into a string:


    ```

    fullname = parts.join(" ");

    ```


    The value in the parentheses specifies a character to separate the parts of the
    array. In this case, a space is used, resulting in the final string John Q. Public.
    If you do not specify a character, commas are used.'
