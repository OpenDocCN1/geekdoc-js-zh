  md: '# CHAPTER 28


    # Using XOAD


    What You''ll Learn in This Chapter:


    +   - Introducing XOAD

    - XOAD HTML

    - Advanced Programming with XOAD


    In this chapter you will learn about XOAD, a server-side framework with Ajax support
    written by Stanimir Angeloff.


    # Introducing XOAD


    So far in this part of the book we have looked at the prototype.js, script.aculo.us
    and Rico libraries and how they can help you to develop Ajax applications. Unlike
    these client-side libraries, which are written in JavaScript, XOAD is a server-side
    Ajax toolkit written in PHP.


    This chapter discusses some of the concepts behind XOAD and the basics of its
    use.


    | XOAD is an acronym for XMLHttpRequest Object-oriented Application Development
    | Did you Know? |


    All our work so far has concentrated on the use of JavaScript to handle both the
    server request and the returned data in Ajax applications. XOAD is a server-based
    solution written in PHP that takes a slightly different approach.


    XOAD applications make server-based PHP functions available to the client-side
    JavaScript interpreter by passing serialized versions of them as JavaScript objects.'
  merge: -1
  pgno: 346
- img_proc: true
  md: "# CHAPTER 28: Using XOAD\n\n# By the Way\n\nUnder the hood, XOAD employs JSON\
    \ (JavaScript Object Notation) for communications. JSON was introduced in Chapter\
    \ 25, \"The prototype.js Toolkit.\"\n\n# Downloading and Installing XOAD\n\n#\
    \ On the CD\n\nA recent version of XOAD is included on the companion CD. To make\
    \ sure you have the most up-to-date version, see the following download instructions.\n\
    \nXOAD is made up of many PHP and supporting scripts and can be downloaded as\
    \ an archive file from http://sourceforge.net/projects/xoad. To install XOAD successfully,\
    \ you will need FTP access to a web server that supports PHP and (to use the more\
    \ advanced features of XOAD) the MySQL database. Detailed instructions for installing\
    \ XOAD can be found in the downloaded material, and there is a public forum at\
    \ http://forums.xoad.org.\n\n# A Simple XOAD Page\n\nLet's take a look at an example\
    \ of the simplest XOAD page. Suppose that you have a PHP class that you want to\
    \ use in your XOAD application. This class is stored in the PHP file myClass.class.php:\n\
    \n```\n<php\nclassClass {\n    function length($mystring) {\n        return strlen($mystring);\n\
    \    }\n    function xoadGetMeta() {\n        XOAD_Client::mapMethods($this, array('stLength'));\n\
    \        XOAD_Client::publicMethods($this, array('stLength'));\n    }\n}\n?\n\
    ```\n\nThis simple class has only one function, length(), which merely returns\
    \ the length of a string variable. We also added some metadata to the class in\
    \ the form of the function xoadGetMeta(). This information tells XOAD which methods\
    \ from the class are available to be exported to the main application. In this\
    \ case there is just one, length().\n\n# Watch Out!\n\nIt is absolutely necessary\
    \ to include metadata in the class, but it is recommended. Without metadata, all\
    \ methods will be public, and method names will be converted to lowercase."
