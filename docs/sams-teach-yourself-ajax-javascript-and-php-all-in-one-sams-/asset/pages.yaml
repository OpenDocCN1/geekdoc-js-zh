  md: '# CHAPTER 5: Working with the Document Object Model (DOM)


    This can tell the user when the page was last changed. If you use JavaScript,
    you don''t have to remember to update the date each time you modify the page.
    (You could also use the script to always print the current date instead of the
    last modified date, but that would be cheating.)


    # By the Way


    > You might find that the document.lastModified property doesn''t work on your
    web pages, or returns the wrong value. The date is received from the web server,
    and some servers do not maintain modification dates correctly.


    # Writing Text in a Document


    The simplest document object methods are the ones you will use most often. In
    fact, you''ve used one of them already. The document.write method prints text
    as part of the HTML page in a document window. This statement is whenever you
    need to include output in a web page.


    An alternative statement, document.writeln, also prints text, but it also includes
    a newline (

    ) character at the end. This is handy when you want your text to be the last thing
    on the line.


    # Watch Out!


    > Bear in mind that the newline character is displayed as a space by the browser,
    except inside a <pre> container. You will need to use the <br> tag if you want
    an actual line break.


    You can use these methods only within the body of the web page, so they will be
    executed when the page loads. You can''t use these methods to add to a page that
    has already loaded without reloading it. You can write new content for a document,
    however, as the next section explains.


    The document.write method can be used within a <script> tag in the body of an
    HTML document. You can also use it in a function, provided you include a call
    to the function within the body of the document.


    # Using Links and Anchors


    Another child of the document object is the link object. Actually, there can be
    multiple-link objects in a document. Each one includes information about a link
    to another location or an anchor.'
