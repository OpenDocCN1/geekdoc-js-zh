    \ condition only checks that $hour is less than 17 (5 p.m.).nIt does not need\
    \ to check that the value is between 12 and 17 because the initial\ncondition\
    \ ensures that PHP will not get as far as the elseif if $hour is less than 12.\n\
    \nThe code in the else clause is executed if all else fails. For values of $hour\
