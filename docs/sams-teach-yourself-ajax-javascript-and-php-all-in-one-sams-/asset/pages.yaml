  md: '# CHAPTER 26


    # Using Rico


    # What You''ll Learn in This Chapter:


    +   - Introducing Rico

    - Rico''s Other Interface Tools


    In this chapter you will learn the basics of using Rico, a powerful Ajax and user
    interface development framework.


    # Introducing Rico


    In Chapter 25, “The prototype.js Toolkit,” we looked at prototype.js, a powerful
    and useful JavaScript library that simplifies many of the programming tasks facing
    the Ajax developer.


    In this chapter we will take a look at Rico, a sophisticated Ajax framework employing
    the prototype.js library.


    > You''ll find Rico on the CD that accompanies this book, in the Frameworks folder.


    Rico is an open source library that extends the capabilities of prototype.js to
    provide a rich set of interface development tools. In addition to the Ajax development
    techniques discussed so far, Rico offers a whole range of tools such as drag-and-drop,
    cinematic effects, and more.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Using Rico in Your Applications


    > Rico is the Spanish word for rich, which seems appropriate for a toolkit designed
    for building rich user interfaces!


    To start using Rico to build applications with rich user interfaces, you need
    to include both Rico and prototype.js libraries in the <head>...</head> section
    of your web pages.


    ```

    <script src="scripts/prototype.js"></script>

    <script src="scripts/rico.js"></script>

    ```


    # Rico''s AjaxEngine


    The inclusion of rico.js causes an instance called ajaxEngine of an AjaxEngine
    object to be created automatically ready for you to use. The AjaxEngine is Rico''s
    mechanism for adding Ajax capabilities to your web pages.


    The AjaxEngine requires a three-step process to update page elements via Ajax:


    +   1. Register the response handler. Registering the response handler associates
    a unique name with a particular URL to be called via Ajax.


    +   2. Register the response handler. Rico can deal with the return of both HTML
    data and JavaScript code within the XML returned from the server. In the former
    case, the response handler identifies a page element that to be updated using
    the returned data; in the latter case, a JavaScript object that handles the server
    response.


    +   3. Make the Ajax call from the page by using an appropriate event handler.


    We first register our request handler by making a call to the registerRequest()
    method of ajaxEngine:\ajaxEngine.registerRequest(''getData'',''getData.php'');


    We have now associated the name getData with a request to the server routine getData.php.
    That server routine is required to return a response in well-formed XML. The following
    is an example of a typical response:'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Introducing Rico


    ```

    <ajax-response>

    <response type="element" id="showdata">

    <div class="datadisplay">

    The <q>cat</q> sat on the <b>mat</b>

    </div>

    </response>

    </ajax-response>

    ```


    Such responses always have a root element ajax-response. The <response> element
    it contains in this example has two attributes, type element and id showdata.
    These signify, respectively, that the response contains HTML, and that this HTML
    is to be used to update the page element having id showdata. This element is updated
    via innerHTML property.


    > Rico is capable of updating multiple page elements from one request. To achieve
    this, the <ajax-response> element may contain multiple <response> elements.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_332_0.png)


    The other form of response that Rico can return is a JavaScript object. Here’s
    an example:


    ```

    <ajax-response>

    <response type="object" id="myHandler">

    <sentence>The cat sat on the mat.</sentence>

    </response>

    </ajax-response>

    ```


    The here has been set to object, indicating that the content is to be dealt with
    by a JavaScript object, the identity of which is contained in the id value (here
    myHandler). The content of the response is always passed to the ajaxUpdate method
    of this object.


    How the response handler is registered depends on which type of response we are
    dealing with. For responses of type element, you can simply call ajaxEngine.registerAjaxElement(''showdata'');


    In case of responses containing a JavaScript object, you will need ajaxEngine.registerAjaxObject(''myHandler'',
    new myHandler());


    Whereas responses of type element are simply intended for the updating of HTML
    page elements, responses of type object can have handlers to process responses
    in any way they want. This allows Rico applications to be built ranging from simple
    to sophisticated.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# A Simple Example


    We can see Rico in action using the simple script of Listing 26.1. This application
    updates two HTML elements with a single call to Rico''s ajaxEngine object. The
    script for the application is in Listing 26.1.


    # LISTING 26.1 A Simple Rico Application


    ```

    <!DOCTYPE html "//W3C//DTD HTML 4.0//EN"

    \u279 SYSTEM "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <title>Testing OpenRico</title>

    <script src="prototype.js"></script>

    <script src="rico.js"></script>

    <script type="text/javascript">

    {\ajaxEngine.registerRequest(''MyRequest'', ''ricotest.php'');

    ajaxEngine.registerAjaxElement(''display'');

    ajaxEngine.registerAjaxElement(''heading'');

    }

    </script>

    </head>

    <body onload="callRico();">

    <div id="heading"><h3>Ajax-Demonstrating Rico</h3></div>

    <input type="button" value="Get Server Data"

    \u279 onclick="ajaxEngine.request(''MyRequest'');"/>

    <div id="display"><p>This text should be replaced with

    \u279 server data ...</p></div>

    </body>

    </html>

    ```


    You will see from the code that the simple function callRico() is used to register
    both the single request handler myRequest and two response handlers. The handlers
    are used to update two <div> containers; one of these contains the page''s heading,
    the other a short text message. On making Rico, the contents of both are updated,
    leaving the page with a new title and displaying some server information instead
    of the previous text message. Figure 26.1 shows before and after screenshots.


    The server routine is a simple PHP script that outputs the required XML data.
    The script uses PHP''s ''SERVER_SIGNATURE'' global variable. Note that the script
    constructs and returns two separate <response> elements, each responsible for
    updating a particular element in the HTML page.'
  merge: -1
  pgno: 333
