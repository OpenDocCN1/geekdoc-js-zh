  md: '# Numeric Functions


    You use ceil or floor to round a number up or down to the nearest integer, respectively.
    For example, ceil(1.3) returns 2, whereas floor(6.8) returns 6.


    To round a value to the nearest whole number, you use round. A fractional number
    .5 will be rounded down, whereas .5 or higher will be rounded up. For example,
    round(1.3) returns 1, whereas round(1.5) returns 2.


    The round function can also take an optional precision argument. The following
    example displays a value rounded to two decimal places:


    ```

    $score = 0.535;

    echo round($score, 2);

    ```


    The value displayed is 0.54; the third decimal place being 5 causes the final
    digit to be rounded up.


    # Random Numbers


    You use rand to generate a random integer, using your system''s built-in random
    number generator. The rand function optionally takes two arguments to specify
    the range of numbers from which the random number will be picked.


    The following statement picks a random number between 1 and 10 and displays it:

    echo rand(1, 10);


    You can put this thing in a script and run it a few times to see how the number
    changes each time it run.


    There is really no such thing as a computer-generated random number. In fact,
    numbers are actually picked from a very long sequence that has very similar properties
    to true random numbers. To make sure you always start from a different place in
    this sequence, you have to seed the random number generator by calling the seed
    function; no arguments are required.


    # Mathematical Functions


    PHP includes many mathematical functions, including trigonometry, logarithms,
    and number base conversions. As you will rarely need to use these in a web environment,
    those functions are not covered in this book.


    To find out about a function that performs a specific mathematical purpose, refer
    to the online manual at www.php.net/manual/en/ref.math.php.'
  merge: -1
