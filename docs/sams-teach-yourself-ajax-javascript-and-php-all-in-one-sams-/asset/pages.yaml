  md: '# Working with Loops


    As you''ve probably noticed, this is basically an upside-down version of the previous
    while example. There is one difference: With the do loop, the condition is tested
    at the end of the loop. This means that the statements in the loop will always
    be executed at least once, even if the condition is never true.


    ```

    As with the for and while loops, the do loop can include a single statement-without
    braces, or a number of statements enclosed in braces.

    ```


    By the Way


    # Working with Loops


    Although you can use for and while loops for straightforward tasks, there are
    some considerations you should make when using more complicated loops. In the
    next sections, we''ll look at infinite loops and the break and continue state-ments,
    which give you more control over your loops.


    # Creating an Infinite Loop


    The for and while loops give you quite a bit of control over the loop. In some
    cases, this can cause problems if you''re not careful. For example, look at the
    following code:


    ```

    while (i < 10) {

    ++;

    values[n] = 0;

    }

    ```


    There''s a mistake in this example. The condition of the while loop refers to
    the i variable, but that variable doesn''t actually change during the loop. This
    creates an infinite loop. The loop will continue executing until the user stops,
    or until it generates an error of some kind.


    Infinite loops can''t always be stopped by the user, except by quitting the browser—and
    some loops can even prevent the browser from quitting, or cause a crash.


    Obviously, infinite loops are something to avoid. They can also be difficult to
    spot because JavaScript won''t give you an error that actually tells you there
    is an infinite loop. Thus, each time you create a loop in a script, you should
    be careful to make sure there''s a way out.


    ```

    Depending on the browser version in, an infinite loop might even make the browser
    stop responding to the user. Be sure you provide an escape route from infinite
    loops, and save your script before you test it just in case.

    ```


    By the Way'
