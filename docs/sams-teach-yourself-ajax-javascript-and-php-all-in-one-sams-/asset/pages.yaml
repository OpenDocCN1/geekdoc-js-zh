  md: '# The responseText and responseXML Properties


    In this simple example, our script opens an alert dialog to display the text returned
    by the server. The line alert(*The server said: " + myRequest.responseText);


    takes the text returned by the server-side route and appends it to the string
    "The server said: " before presenting it in a JavaScript alert dialog.


    Let''s look at example using a simple PHP file on the server:


    ```

    <?php echo "Hello Ajax caller"; ?>

    ```


    We''ll be looking in detail at PHP in Part IV. For now, all you really need to
    know is that PHP''s echo () command asks the server to output whatever enclosed
    within the parentheses.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_184_0.png)


    A successful XMLHttpRequest call to this file would result in the responseText
    property containing the string Hello Ajax caller!, causing the callback function
    to produce the dialog shown in Figure 12.1.


    > Figure 12.1

    Output generated by Listing 12.1.


    The responseText property is read-only, so there''s no point in trying to manipulate
    its value until it has been copied into another variable.


    > Did you Know?


    The responseText contains a simple text string, we can manipulate any of JavaScript''s
    methods relating to strings, some of which were introduced in Chapter 6. Table
    12.1 includes some of the available methods.


    # TABLE 12.1 Some JavaScript String Manipulation Methods


    | Method | Description |

    |---|---|

    | charAt(number) | Selects the single character at the specified position within
    the string |

    | indexOf(substring) | Finds the position where the substring starts |

    | lastIndexOf(substring) | Finds the last occurrence of the substring within the
    string |

    | substring(start,end) | Gets the specified part of the string |

    | toLowerCase() | Converts the string to lowercase |

    | toUpperCase() | Converts the string to uppercase |'
