  md: '# CHAPTER 25: The prototype.js Toolkit


    # The Try.these() Function


    Previous chapters discussed the use of exceptions to enable you to catch runtime

    ers and deal with them cleanly. The Try.these() function provides a convenient

    way to encapsulate these methods to provide a cross-browser solution where

    JavaScript implementation details differ:


    ```

    return Try.these(function1(),function2(),function3(), -);

    ```


    The functions are processed in sequence, operation moving on to the next function

    when an error causes an exception to be thrown. Operation stops when

    any of the functions completes successfully, at which point the function returns

    true.


    Applying this function to the creation of an XMLHttpRequest instance shows

    simplicity of the resulting code:


    ```

    return Try.these(

    function(){{return new ActiveX(''Msxml12.XMLHttpRequest'')},

    function(){{return new ActiveX(''Microsoft.XMLHttpRequest'')},

    function(){{return new XMLHttpRequest()}}

    );

    ```


    > You may want to compare this code snippet with Listing 10.1 to see just how

    m code complexity has been reduced and readability improved.


    # Wrapping XMLHttpRequest—the Ajax Object


    prototype.js defines an Ajax object designed to simplify the development of your

    JavaScript code when building Ajax applications. This object has a number of class-

    es that encapsulate the code you need to send server requests, monitor their

    progress, and deal with the returned data.


    # Ajax.Request


    Ajax.Request deals with the details of creating an instance of the XMLHttpRequest

    and sending a correctly formatted request. Calling it is straightforward:


    ```

    var myAjax = new Ajax.Request( url, {method: ''post'',

    parameters: mydata, onComplete: responsefunction() });

    ```'
