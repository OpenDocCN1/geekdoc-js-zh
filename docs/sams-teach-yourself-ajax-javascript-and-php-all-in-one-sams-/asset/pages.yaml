  md: '# Introduction


    Over the last decade or so, the World Wide Web has grown in scope from being a
    relatively simple information repository to becoming the first stop for many people
    when seeking entertainment, education, news, or business resources.


    Websites themselves no longer be limited to a number of static pages containing
    text and perhaps simple images; the tools now available allow the development
    of highly interactive and engaging pages involving animations, visual effects,
    context-sensitive content, embedded productivity tools, and much more.


    The list of technologies available for producing such pages is broad. However,
    those based on Open Source licenses have become, and remain, highly popular to
    their typically low (often zero) entry cost, and to the huge resource of user-contributed
    scripts, tutorials, and other resources for these tools and applications available
    via the Internet and elsewhere.


    In this book, we give a detailed account of how to program fluid, interactive
    websites using server- and client-side coding techniques and tools, as well as
    how to produce a slick, desktop-application-like user experience using Ajax.


    The programming languages used in this book include the ubiquitous JavaScript
    (for client-side programming) and the immensely powerful open-source PHP language
    (for server-side scripting, and with the majority of web-hosting packages). The
    nuts and bolts of Ajax programming are described in detail, as well as the use
    of several advanced open-source frameworks that contain ready-written code for
    quickly building state-of-the-art interactive sites.


    > The CD that accompanies this book provides all the tools required on your journey
    through learning to program in PHP, JavaScript, and Ajax.


    # What Is Ajax?


    Ajax stands for Asynchronous JavaScript and XML. Although strictly speaking Ajax
    is not itself a technology, it mixes well-known programming techniques in an uncommon
    way to enable web developers to build Internet applications with much more appealing
    user interfaces than those to we have become accustomed.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Sams Teach Yourself Ajax, JavaScript, PHP All in One


    When using popular desktop applications, we expect the results of our work to
    be made available immediately, without fuss, and without our having to wait for
    the whole screen to be redrawn by the program. While using a spreadsheet such
    as Excel, for instance, we expect the changes we make in one cell to propagate
    immediately through the neighboring cells while we continue to, scroll the page,
    or use the mouse.


    Unfortunately, this sort of interaction has seldom been more common than the experience
    of web-based applications. Much more common is the experience of entering data
    into form fields, clicking on a button or a hyperlink and then sitting back while
    the page slowly reloads the results of the request. In addition, we often find
    that the majority of the reloaded page consists of elements that are identical
    to those of the previous page and have therefore been reloaded unnecessarily;
    background images, logs, and menus are frequent offenders.


    Ajax promises us a solution to this problem. By working as an extra layer between
    the user''s browser and the web server, Ajax handles server communications in
    the background, submitting server requests and processing the returned data. The
    results may then be integrated seamlessly into the page being viewed, without
    that page needing to be refreshed or a new one loaded.


    In Ajax applications, server requests are not necessarily synchronized with user
    actions such as clicking on buttons or links. A well-written Ajax application
    may already have asked of the server, and the data required by the user—perbefore
    the user even knew she wanted it. This is the meaning of the asynchronous part
    of the Ajax acronym.


    The parts of an Ajax application that happen "under the hood" of the user''s browser—such
    as sending queries and dealing with the returned data, are written in JavaScript,
    and XML is an increasingly popular method of coding and transferring formatted
    information used by Ajax to efficiently transfer data between server and client.


    We''ll look at all these techniques, and how they can be made to work together,
    through the chapters.


    # Who This Book Is For


    This volume is aimed primarily at web developers seeking to build better interfaces
    for the users of their web applications and programmers from desktop environments
    looking to transfer their applications to the Internet.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    It also proves useful to web designers eager to learn how the latest techniques
    can offer new outlets for their creativity. Although the nature of PHP, JavaScript,
    Ajax applications means that they require some programming, all the required technologies
    are explained from first principles within the book, so those with little or no
    programming experience should be able to follow the lessons without a great deal
    of difficulty.


    # How To Use This Book


    All the technologies—including a refresher of WWW basics—are explained from first
    principles, so that even non-programmers or those unfamiliar with these languages
    should be able to follow the development of the concepts with little problem.


    The book is divided into parts, each dedicated to a particular technology or discussion
    topic. Within each part, the chapters specialize in a given aspect or subtopic.
    It should therefore be easy to follow the instructional flow of the book by a
    quick look through the table of contents.


