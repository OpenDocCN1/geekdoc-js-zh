  md: '# CHAPTER 6: Using Variables, Strings, and Arrays


    # Finding a Substring


    Another use for substrings is to find a string within another string. One way
    to do this is with the indexOf method. To use this method, add indexOf to the
    string you want to search, and specify the string to search for in the parentheses.
    This example searches for "this" in the test string:


    ```

    loc = test.indexOf("this");

    ```


    As with most JavaScript methods and property names, indexOf is case sensitive.
    Make sure you type it exactly as shown here when you use it in scripts.


    The value returned in the loc variable is an index into the string, similar to
    the first index in the substring method. The first character of the index is 0.


    You can specify an optional second parameter to indicate the value to begin the
    search. For example, this statement searches for the word fish in the temp string,
    starting with the 20th character:


    ```

    location = temp.indexOf("fish",19);

    ```


    > One use for the second parameter is to search for multiple occurrences of a
    string. Finding the first occurrence, you search starting with that location for
    the second one, and so on.


    A second method, lastIndexOf(), works the same way, but finds the last occurrence
    of the string. It searches the string backwards, starting with the last character.
    For example, this statement finds the last occurrence of Fred in the names string:


    ```

    location = names.lastIndexOf("Fred");

    ```


    With indexOf(), you can specify a location to search from as the second parameter.
    In this case, the string will be searched backward starting at that location.


    # Using Numeric Arrays


    An array is a numbered group of data items that you can treat as a single unit.
    For example, you might use an array called scores to store several scores for
    a game. Arrays can contain strings, numbers, objects, or other types of data.
    Each item in an array is called an element of the array.'
