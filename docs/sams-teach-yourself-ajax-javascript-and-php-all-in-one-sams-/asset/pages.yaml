  md: "# CHAPTER 16\n\n# Flow Control\n\n# What You'll Learn on This Chapter:\n\n\
    +   - Conditional Statements\n- Loops\n\nIn this chapter you will learn about\
    \ the conditional and looping constructs that allow you to control the flow of\
    \ a PHP script.\n\nIn this chapter we will look at two types of flow control:\
    \ conditional statements, which tell your script to execute a section of code\
    \ only if certain criteria are met, and loops, which indicate a block of code\
    \ that is to be repeated a number of times.\n\n# Conditional Statements\n\nA conditional\
    \ statement in PHP begins with the keyword if, followed by a condition in parentheses.\
    \ The following example checks whether the value of the variable $number is less\
    \ than 10, and the echo statement displays its message only if this is the case:\n\
    \n```\n$number = 5;\nif ($number < 10) {\n  echo \"$number is less than ten\"\
    ;\n}\n```\n\nThe condition $number < 10 is satisfied if the value on the left\
    \ of the symbol is smaller than the value on the right. If this condition holds\
    \ true, the code in the following set of braces will be executed; otherwise, the\
    \ script jumps to the next statement after the closing brace."
  merge: -1
