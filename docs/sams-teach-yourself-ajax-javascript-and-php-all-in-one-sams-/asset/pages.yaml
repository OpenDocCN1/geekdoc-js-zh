  md: '# The if Statement


    One of the most important features of a computer language is the capability to
    test and compare values. This allows your scripts to behave differently based
    on the values of variables, or based on input from the user.


    The if statement is the main conditional statement in JavaScript. This statement
    means the same in JavaScript as it does in English—for example, here is a typical
    conditional statement in English:


    If the phone rings, answer it.


    This statement consists of two parts: a condition (If the phone rings) and an
    action (answer it). The if statement in JavaScript works the same way. Here is
    an example of a basic statement:


    ```

    if (a == 1) window.alert("Found a 1!");

    ```


    This statement includes a condition (if a equals 1) and an action (message). This
    statement checks the variable a and, if it has a value of 1, displays an alert
    message. Otherwise, it does nothing.


    If you use an if statement like the following example, you can use a single statement
    as the action. You can also use multiple statements for the action by enclosing
    them in braces ({}), as shown here:


    ```

    if (a == 1) {

    window.alert("Found a 1!");

    a = 0;

    }

    ```


    This block of statements checks the variable once again. If it finds a value of
    1, it displays a message and sets a back to 0.


    # Conditional Operators


    The action part of an if statement can include any of the JavaScript statements
    you''ve already learned (and others, for that matter), but the condition part
    of the statement uses its own syntax. This is called a conditional expression.


    A conditional expression usually includes two values to be compared (in the preceding
    example, the values were a and 1). These values can be variables, constants, or
    even expressions in themselves.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# The if Statement


    Either side of the conditional expression can be a variable, a constant, or an
    expression. You can compare a variable and a value, or compare two variables.
    (You can compare two constants, there''s usually no reason to.)


    The two values to be compared is a conditional operator. This operator tells JavaScript
    how to compare the two values. For instance, the == operator is used to test whether
    the two values are equal. A variety of conditional operators are available:


    +   * ==Is equal to

    * !=Is not equal to

    * <Is less than

    * >Is greater than

    * >=Is greater than equal to

    * <=Is less than equal to


    Be sure not to confuse the equality operator (==) with the assignment operator
    (=), even though both might be read as "equals." Remember to use = when assigning
    a value to a variable, and == when comparing values. Confusing these is one of
    the most common mistakes in JavaScript programming.


    # Combining Conditions with Logical Operators


    Often, you''ll want to check a variable for more than one possible value, or compare
    more than one value at once. JavaScript includes logical operators, also known
    as Boolean operators, for this purpose. For example, the following two check different
    conditions and use the same action:


    ```

    if (phone == "") window.alert("error!");

    if (email == "") window.alert("error!");

    ```


    Using a logical operator, you can combine them into a single statement:

    if (phone == "" || email == "") window.alert("Something''s Missing!");


    This statement uses the logical operator (||) to combine the conditions. Translated
    to English, this would be, "If the phone is blank or the email address is blank,
    display an error message."'
  merge: -1
