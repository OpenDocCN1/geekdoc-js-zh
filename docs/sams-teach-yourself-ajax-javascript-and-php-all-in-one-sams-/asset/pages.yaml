  md: '# Creating and Using Objects


    You can set a number of properties for your new class. Some are required in order
    for the class to work properly, and others allow you to change the default behavior.


    Each object instance requires you to set the properties that contain the mailbox
    and domain parts of a real email address, which is the address that will be given
    to the remote mail server when checking a mailbox. There are no default values
    for these properties; they always have to be set as follows:


    ```

    $Validator->local="chris";

    $validator->localhost="lightwood.net";

    ```


    The optional timeout property defines how many seconds wait connected to a remote
    mail server before giving up. Setting the debug property causes the text of the
    communication with the remote server to be displayed onscreen. You never need
    to do this, unless you are interested in what is going on. The following statements
    define a timeout of 10 seconds and turn debug output:


    ```

    $validator->timeout = 10;

    $validator->debug = TRUE;

    ```


    The full list of adjustable properties for a validator object is shown in Table
    18.1.


    # TABLE 18.1 Properties of an email_validation_class Object


    | Property | Description |

    |---|---|n| timeout | Indicates the number of seconds before timing out connecting
    to a destination mail server |

    | data_timeout | Indicates the number of seconds before timing out while data
    is exchanged with the mail server; if zero, takes the value of timeout |

    | localuser | Indicates the user part of the email address of the sending user
    |

    | localhost | Indicates the domain part of the email address of the sending user
    |

    | debug | Indicates whether to output the text of the communication with the mail
    server |

    | html_debug | Indicates whether the debug output should be formatted as an HTML
    page |


    The methods in email_validation_class are mostly private; you cannot call them
    directly, but the internal code is made up of a set of functions. If you examine
    email_validation.php, you will see function definitions, including Tokenize, GetLine,
    and VerifyResultLines, but none of these are useful outside the object itself.'
