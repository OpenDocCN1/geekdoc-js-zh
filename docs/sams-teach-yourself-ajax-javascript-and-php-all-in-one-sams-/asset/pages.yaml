- img_proc: true
  md: '# CHAPTER 4: Creating Simple Scripts in JavaScript


    Whether events are scheduled or unscheduled, you probably have normal ways of
    handling them. Your event handlers might include things such as When Fred''s birthday
    arrives, send him a present or When relatives visit unexpectedly, turn out the
    lights and pretend nobody is home.


    Event handlers in JavaScript are similar: They tell the browser to do when a certain
    event occurs. The JavaScript events aren''t as exciting as the ones you deal with—include
    such events as When the mouse button clicks and When this page is finished loading.
    Nevertheless, they''re a very useful part of JavaScript.


    Many JavaScript events (such as mouse clicks) are caused by the user. Rather than
    doing things in a set order, your script can respond to the user''s actions. Other
    events don''t invoke the user directly—for example, an event is triggered when
    an HTML document finishes loading.


    Each event handler is associated with a particular browser object, and you can
    specify the event handler in the tag that defines the object. For example, images
    and text links have an event, onMouseEnter, that happens when the mouse pointer
    moves over the object. Here is a typical HTML image tag with an event handler:


    ```

    <img src="button.gif" onmouseover="highlight();">

    ```


    You specify the event handler as an attribute to the HTML tag and include the
    JavaScript statement within the quotation marks. This is an ideal use for functions
    because function names are short and to the point and can refer to a whole series
    of statements.


    See the Try It Yourself section at the end of this chapter for a complete example
    of an event handler within an HTML document.


    # Which Script Runs First?


    You can actually have several scripts within a web document: one or more sets
    of <script> tags, external JavaScript files, and any number of event handlers.
    With all of these scripts, you might wonder how the browser knows which to execute
    first. Fortunately, this is done in a logical fashion:


    +   Sets of <script> tags within the <head> section of an HTML document are handled
    first, whether they include embedded code or refer to a JavaScript file. Because
    these scripts cannot create output in the web page, it''s a good place to define
    functions for use later.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Sets of <script> tags within the <body> section of the HTML document are executed
    after those in the <head> section, while the web page loads and displays. If there
    is more than one script in the body, they are executed in order.


    Event handlers are executed when their events happen. For example, the onload
    event handler is executed when the body of a web page loads. Because the <head>
    section is loaded before any events, you can define functions and use them in
    event handlers.


    # # JavaScript Syntax Rules


    JavaScript is a simple language, but you need to be careful to use its syntax—the
    rules that define how you use the language—correctly. The rest of this book covers
    many aspects of JavaScript syntax, but there are a few basic rules you should
    understand to avoid errors.


    # # Case Sensitivity


    Almost everything in JavaScript is case sensitive: you cannot use lowercase and
    capital letters interchangeably. Here are a few general rules:


    +   * JavaScript keywords, such as for and if, are always lowercase.


    +   * Built-in objects such as Math and Date are capitalized.


    +   * DOM objects are usually lowercase, but their methods are often a combination
    of capitals and lowercase. Usually capitals are used for all but the first word,
    as in toLowerCase or getElementById.


    When in doubt, follow the exact case used in this book or another JavaScript reference.
    If you use the wrong case, the browser will display an error message.


    # # Variable, Object, and Function Names


    When you define your variables, objects, or functions, you can choose their names.
    Names can include uppercase letters, lowercase letters, numbers, and the underscore
    (_) character. Names must begin with a letter or underscore.


    You can choose to use capitals or lowercase in your variable names, but remember
    that JavaScript is case sensitive: score, Score, and SCORE would be considered
    different variables. Be sure to use the same name each time you refer to a variable.'
