  merge: -1
  pgno: 258
- img_proc: true
  md: "# CHAPTER 19: Returning Data as Text\n\nFIGURE 19.3\nReturning complex HTML.\n\
    \n![](img/5a65c4ec3b3e08b6ff226ca847fae85a_259_0.png)\n\n# More Complex Formatted\
    \ Data\n\nSo far we have demonstrated ways to return text that may be directly\
    \ applied to an element on a web page. So far, so good. However, if you are willing\
    \ to do a little more work in JavaScript to manipulate the returned data, you\
    \ can achieve even more.\n\nProvided that the server returns a string value in\
    \ the responseText property of the XMLHttpRequest object, you can use any data\
    \ format you may devise to encode Information within it.\n\nConsider the following\
    \ server-side script, which uses the same data array as in the previous example:\n\
    \n```\n<php\n$days = array('Monday', 'Tuesday', 'Wednesday',\n'Thursday', 'Friday',\
    \ 'Saturday', 'Sunday');\n$numdays = sizeof($days);\nfor($i=0;$i<$numdays - 1;$i++)\
    \ {\n  echo $days[$i].\"*\\';\n}\necho $days[$numdays-1];\n?>\n```\n\nBy the\n\
    Way\n\n> The use of the PHP sizeof() function to determine the number of items\
    \ in the array. In PHP, as in JavaScript, array keys are numbered from 0 rather\
    \ than 1."
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Summary


    The string returned in the responseText property now contains the days of the
    week, separated—or delimited—by the pipe character |. If we copy this string into
    a JavaScript variable mystring,


    ```

    var mystring = http.responseText;

    ```


    we will find that the variable mystring contains the string

    Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday


    We may now conveniently divide this string into an array using JavaScript''s split()
    method:


    ```

    var results = http.responseText.split("*\");

    ```


    > The JavaScript split() method slices up a string, making each cut wherever in
    the string it locates the character that has been given as an argument. That character
    need be a pipe; popular alternatives are commas or slashes.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_260_0.png)


    We now have a JavaScript array results containing our data:


    ```

    results[0] = ''Monday''

    results[1] = ''Tuesday''

    etc...

    ```


    Rather than simply displaying the received data, we now use it in JavaScript routines
    in any way we want.


    > For complex data formats, XML may be a better way to receive and handle data
    from the server. However, it is remarkable how much can be done just using the
    responseText property.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_260_1.png)


    # Summary


    With little effort, the XMLHttpRequest object''s responseText property can be
    persuaded to do more than simply return some text to display in a web page.


    For all the most complex data formats, it may provide simpler to manipulate responseText
    than to deal with the added complexity of XML.


    In this chapter you saw several examples of this technique, ranging from the simple
    update of text content within a page element, to the manipulation of more complex
    data structures.'
  merge: -1
  pgno: 260
