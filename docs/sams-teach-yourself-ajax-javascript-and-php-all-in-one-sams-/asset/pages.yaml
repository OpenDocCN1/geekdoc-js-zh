  md: "# Introducing XOAD\n\nNow you need to start constructing the main application\
    \ script xoad.php.\n\n> The Ajax applications developed in previous chapters were\
    \ HTML files with file extensions .htm or .html. Because our XOAD application\
    \ contains PHP code, it must have a suitable file extension. Most web server and\
    \ PHP implementations will accept a file extension of .php, and will allow other\
    \ extensions such as .php4 or .phtml.\n\n# Did you Know?\n\nListing 28.1 shows\
    \ the XOAD application. This is a fairly pointless program that simply returns\
    \ the length of a string, “My XOAD Application”. Nevertheless, it demonstrates\
    \ the concept of methods from server-side PHP classes being available on the client\
    \ side as JavaScript objects.\n\n# LISTING 28.1 A Simple XOAD Application\n\n\
    ```\n<?php\nrequire_once('myClass.class.php');\nrequire_once('xoad.php');\nXOAD_Server::allowClasses('myClass');\n\
    if (XOAD_Server::runServer()) {\n    exit;\n}\n?= XOAD_Utilities::header('.',')\
    \ ?>\n<script type=\"text/javascript\">\nvar myobj = XOAD_Client::register(new\
    \ myClass());\nnvar mystring = 'My XOAD Application';\nmyobj.onStLengthError =\
    \ function(error) {\n    alert(error.message);\n    return true;\n};\nmyobj.strlen(mystring,\
    \ function(result) {\ndndocument.write('String: ' + mystring\n- + '<br />Length:\
    \ ' + result);\n});\n</script>\n```\n\nOn the preceding document into a browser,\
    \ the page simply says:\n\nString: My XOAD Application\nLength: 19\n\nI won't\
    \ go into much detail detail about how the PHP code works; we've discussed the\
    \ PHP language elsewhere. It's important, to understand the concepts that underpin\
    \ the code, so let's step through Listing 28.1 and try to understand what's happening:\n\
    \n```\n<?php\nrequire_once('myClass.class.php');\nrequire_once('xoad.php');\n\
    XOAD_Server::allowClasses('myClass');\n```"
