    \ is the name of the callback function that handles the server response.\n\nThe\
    \ second argument is constructed using a notation often called JSON (JavaScript\
    \ Object Notation). The argument is built up from a series of parameter values,\
    \ the whole contained within braces. The parameter values may be JSON objects,\
    \ arrays, or simple values.\nJSON is popular as a data interchange protocol due\
    \ to its ease of construction and, ease of parsing, and language independence.\
    \ You can find out more at http://www.json.org.\n\nDid you Know?\n\nThe complete\
    \ parameter is one of several options corresponding to the possible values of\
    \ the XMLHttpRequest readyState properties, in this case readyState value of 4\
    \ (Complete). You might intend specify that the callback function should execute\
