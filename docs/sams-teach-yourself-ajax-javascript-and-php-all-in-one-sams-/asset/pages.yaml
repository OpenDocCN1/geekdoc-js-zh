    table.rest {background:yellow;\n  text-align:center;\n  color:black}\na:link {color:red;\n\
    \  text-decoration:none}\n</style>\n</head>\n```\n\nThe <style> tag almost always\
    \ includes the type=\"text/css* attribute, so you\nshould get used to adding it.\n\
