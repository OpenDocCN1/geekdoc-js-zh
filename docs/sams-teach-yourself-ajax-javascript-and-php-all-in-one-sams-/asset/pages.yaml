  md: '# CHAPTER 12: Using the Returned Data


    We''ll be looking at how responseText may be used in real situations in Chapter
    19,

    “Returning Data as Text.”


    # The responseXML Property


    Now suppose that the PHP script we used on the server in the previous example
    had

    instead looked like Listing 12.2. Once again, we won''t worry too much about the

    nuts-and-bolts of the PHP commands, as we''ll be looking at PHP in detail in Part
    IV

    of the book.


    # LISTING 12.2 A Server-Side Sclipt to Return XML


    ```

    <php

    header(''Content-Type: text/xml'');

    echo ''<?xml version="1.0"?><greeting>\nHello Ajax caller!</greeting>'';

    ```


    Remember reading about HTTP headers, back in Chapter 1? The first line inside

    t<php ?> delimiters uses PHP''s header instruction to add an HTTP header to

    the returned data. The header returned is the parameter and value pair

    Content-Type: text/xml


    which announces to our XMLHttpRequest object to expect that the following data

    from the server will be formatted as XML.


    The next line is another PHP echo statement that outputs this simple, but complete,

    XML document:


    ```

    <?xml version="1.0" ?>

    <greeting>

    Hello Ajax caller!

    </greeting>

    ```


    When the server call is completed, we now find this XML document loaded into the

    XML property of our XMLHttpRequest object.


    > It is important to note that the responseXML property does not contain just
    a

    string that forms a text representation of the XML document, as was the case

    with the responseText property; instead, the data and hierarchical stru-\cture
    of the XML document has been stored as a DOM-compatible object.


    We can now access the content of the XML document via JavaScript''s DOM methods

    and properties.'
