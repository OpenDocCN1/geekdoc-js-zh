  md: '# Best Practices for JavaScript


    You should now be familiar with the basic rules for writing JavaScript. Along
    with the rules, it''s also a good idea to follow best practices. The following
    practices may not be required, but you''ll save yourself and others headaches
    if you follow them.


    +   * Use comments liberally—make your code easier for others to understand, and
    also easier for you to understand when you edit them later. They are also useful
    for marking the major divisions of a script.


    +   * A semicolon at the end of each statement, and only one statement per line—Will
    make your scripts easier to debug.


    +   * Separate JavaScript files when possible—This separates JavaScript from HTML
    and makes debugging easier, and also encourages you to write modular scripts that
    can be reused.


    +   * Avoid being browser-specific—As you learn more about JavaScript, you''ll
    learn features that only work in one browser. Avoid this unless absolutely necessary,
    and always test your code in more than one browser.


    +   * Keep JavaScript optional—Don''t use JavaScript to perform an essential function
    on your site—for example, the primary navigation links. Whenever possible, users
    without JavaScript should be able to use your site, although it may not be as
    attractive or convenient. This strategy is known as progressive enhancement.


