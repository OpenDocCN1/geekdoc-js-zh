  md: '# Glossary


    The following are some terms relating to web development that are used throughout
    this book. Although most of them are explained in the text of the book, this section
    can serve as a useful quick reference while reading the book, or while reading
    other sources of JavaScript, PHP, or Ajax information.


    Active A technology developed by Microsoft to allow components to be created,
    primarily for Windows computers. ActiveX components, or controls, can be embedded
    in web pages.


    argument A parameter that is passed to a function when it is called. Arguments
    are specified within parentheses in the function call.


    AHAH (Asynchronous HTML and HTTP) A simplified subset of Ajax, useful for updating
    text on a web page refresh.


    array A set of variables that can be referred to with the same name and a number,
    called an index.


    Ajax (Asynchronous JavaScript and XML) A combination of technologies that allows
    JavaScript to send requests to a server, receive responses, and update sections
    of a page without loading a new page.


    attribute A property value that can be defined within an HTML tag. Attributes
    style, alignment, and other aspects of the element defined by the tag.


    assignment The setting of a variable to a particular value.


    Boolean A type of variable that can store only two values: true and false.


    algorithm The process, method or route used to solve a problem.


    browser sensing A scripting technique that detects the specific browser in use
    by clients to provide compatibility for multi-ple browsers.


    anchor In HTML, a named location within a document, specified using the <a> tag.
    Anchors also act as links.


    cache The internal memory used by a browser to store visited pages, making them
    faster to load when next requested.


    applet A Java program that is designed to be embedded in a web page.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Cascading Style Sheets (CSS)


    **Cascading Style Sheets (CSS)** The W3C''s standard for applying styles to HTML
    documents. CSS can control fonts, colors, margins, and positioning.


    example, the <font> tag is deprecated in HTML 4.0 because style sheets can provide
    the same capability.


    **class** A construction within an object-oriented programming language that allows
    the creation of objects.


    **Domain Name Service (DNS)** The system used to associate domain names with IP
    addresses across the Internet.


    **comment** Programmer''s notes written within sections of code to clarify how
    code operates and to maintain later. Comments are ignored when code is executed.


    **Document Type Declaration (DTD)** A declaration made at the beginning of a HTML
    document that states what version of HTML the document adheres to.


    **Common Gateway Interface (CGI)** A standardized method for running server-side
    programs, irrespective of the language they are written in.


    **Document Object Model (DOM)** The set of objects that JavaScript can refer to
    the browser window and partitions of the HTML document. The W3C (World Wide Consortium)
    DOM is a standardized version supported by the latest browsers, and access to
    every object within a web page.


    **concatenate** The act of combining two strings into a single, longer string.


    **conditional** A statement that performs an action if a particular condition
    is true, typically using the if statement.


    **Dynamic HTML (HTML)** The combination of HTML, JavaScript, CSS, and the DOM,
    which allows web pages to be created. HTML is not a W3C standard or a version
    of HTML.


    **constructor** A method used to create and initialize a new object.


    **element** A single member of an array, referred to with an index. In the DOM,
    an element is a single node defined by an HTML tag.


    **debug** The act of finding errors, bugs, in a program or script.


    **error handling** The use of coding techniques to manage a script deal elegantly
    with any error situations that may arise.


    **declaration** A statement of a variable''s name and type.


    **decrement** To decrease the value of a variable by one. In JavaScript and PHP,
    this can be done with the decrement operator, ..


    **event** A condition, often the result of a user''s action, that can be detected
    by a script.


    **deprecated** A term which applies to HTML tags or other items that are no longer
    recommended for use, and not be supported in the future. For


    **event handler** A JavaScript statement or function that will be executed when
    an event occurs.'
  merge: -1
