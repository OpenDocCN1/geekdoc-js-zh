    \n# Providing User Feedback\n\nIn pages with traditional interfaces, it is clear\
    \ to the user when the server is busy processing a request; the interface is effectively\
    \ unusable while a new page is being prepared and served.\n\nThe situation is\
    \ a little different in an Ajax application. Because the interface remains usable\
    \ during an asynchronous HTTP request, it may not appear to the user that new\
    \ information is expected from the server. Fortunately there are some simple ways\
    \ to warn that a server request is in progress.\n\nRecall that our callback function\
    \ is called each time the value of readyState changes, but that we are really\
