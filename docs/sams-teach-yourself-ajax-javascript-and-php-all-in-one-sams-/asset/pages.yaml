    <?php echo date(''H:i:s'');?>

    and the date is

    <?php echo date(''j F Y'');?>

    ```


    When you enter the URL to this file in your web browser, you should see the current
    date and time, according to the system clock on your web server, displayed.


    > If you are running PHP from your local PC, PHP code in a script will be executed
    only if it is accessed over a web server that has the PHP module enabled. If you
    open a local script directly in the web browser—for instance, double-clicking
    or dropping the file into the browser—it will be treated as HTML only.


    > If you are using a default Apache installation in Windows, you would create
    time.php in the folder C:\Program Files\Apache Group\Apache\htdocs, the correct
    URL would be http://localhost/time.php. If you have loaded the XAMPP software
    from the CD accompanying this book, refer to the XAMPP docu-mentation to find
    the location of your web folder.'
