  md: '# The Back Button


    All browsers in common use a Back button on the navigation bar. The browser maintains
    a list of recently visited pages in memory and allows you to step back through
    these to revisit pages you have recently seen.


    Users have become used to the Back button as a standard part of the surfing experience,
    just as they have with the other facets of the page-based web paradigm.


    ```

    JavaScript has its own equivalent of the Back button written into the language.

    The statements

    onClicks = "history.back()"

    and

    OnClick = "history.go(-1)"

    both mimic the action of clicking the Back button once.

    ```


    Ajax, as you have learned, does much to shake off the idea of web-based information
    being delivered in separate, page-sized chunks; with an Ajax application, you
    may be able to change page content over and over again without any thought of
    reloading the browser display with a whole new page.


    What then of the Back Button?


    This issue has caused considerable debate among developers recently. There seem
    to be two main schools of thought:


    +   - Create a means of recording state programmatically, and use that to re-create
    a previous state when the Back button is pressed.


    +   - Persuade users that the Back button is no longer necessary.


    Artificially re-creating states is indeed possible but adds a great deal of complexity
    to Ajax code and is therefore the province of the braver programmer!


    Although the latter option sounds a bit like it trying to avoid the issue, it
    perhaps have some merit. If you use Ajax to re-create desktop-like user interfaces,
    it’s worthy of merit to note that desktop applications generally don’t—or need—a
    Back button because the notion of separate “pages” never enters the user’s head!'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Bookmarking and Links


    This problem is not unrelated to the Back issue.


    When you bookmark a page, you are attempting to save a shortcut to some content.
    In the page-based metaphor, this is not unreasonable; although pages can have
    some degree of dynamic content, being able subsequently to find the page itself
    usu-ally gets close enough to seeing what we saw on our previous visit.


    Ajax, however, can use the same page address for a whole application, with large
    quantities of dynamic content being returned from the server in accordance with
    a user''s actions.


    What happens when you want to bookmark a particular screen of information and/or
    pass that link to a friend or colleague? Merely using the URL of the current page
    is unlikely to produce the products you require.


    Although it may be difficult to totally eradicate this problem, it may be possible
    to alleviate it somewhat by providing permanent links to specially chosen states
    of an application.


    # Telling the User That Something Is Happening


    This is another issue somewhat related to the change of interface style away from
    separate pages.


    The user who is already familiar with browsing web pages may have become acc-ustomed
    to program activity coinciding with the loading of a new or revised page.


    Many Ajax applications therefore provide some consistent visual clue that activity
    is happening; perhaps a stationary graphic image might be replaced by an animated
    version, the cursor style might change, or a pop-up message appear. Some of these
    techniques have been mentioned in some of the chapters in this book.


    # Making Ajax Degrade Elegantly


    The chapters in this book have covered the development of Ajax applications using
    various modern browsers. It is still possible, that a user might surprise you
    by attempting to use your application with a browser that is too old to support
    the necessary technologies. Alternatively, a visitor''s browser may have JavaScript
    and/or ActiveX disabled (for security or other reasons).'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# CHAPTER 24: Ajax "Gotchas"


    It is unfortunate that an Ajax application should break down under these conditions.

    At the least, the occurrence of obvious errors (such as a failure to create an
    instance of the XMLHttpRequest object) should be reported to the user. If the
    Ajax application is so complex that it cannot be automatically reverted to a non-Ajax
    mode of operation, perhaps the user can at least be redirected to a non-Ajax version
    of the application.


    Did you Know?


    You can detect whether JavaScript is unavailable using the <script> ... </script>
    tags in your HTML page. Statements between these tags are evaluated only if JavaScript
    is NOT available:


    <script>

    JavaScript is not available in this browser. <br />

    nPlease go <a href="otherplace.html">HERE</a> for

    -the HTML -only version. <br />

    </script>


    # Dealing with Search Engine Spiders


    Search engines gather information about websites through various means, an important
    one being the use of automated programs called *spiders*.


    Spiders, as their name suggests, "crawl the web" by reading web pages and links,
    building a database of content and other relevant information about particular
    websites. This database, better known as an *index*, is queried by search engine
    visitors using their keywords and phrases returns suggestions of relevant pages
    for them to visit.


    This can create a problem for highly dynamic sites, which rely on user interaction
    (rather than passive surfing) to invoke the loading of new content delivered on
    the server. The visiting spider may not have access to the content that would
    be loaded by dynamic means and therefore never get to index it.


    The problem can be exacerbated further by the use of Ajax, with its tendency to
    deliver even more content in fewer pages.


    It would seem to ensure that spiders can index a static version of all relevant
    content somewhere on the site. Because spiders follow links embedded in pages,
    the provision of a hypertex linked site map can be a useful addition in this regard.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Don''t Use Ajax Where It''s Inappropriate


    # Pointing Out Active Page Elements


    Without careful design, it may not be apparent to users which items on the page
    they can click on or otherwise interface with to make something happen.


    It is worth trying to use a consistent style throughout an application to show
    which page elements cause server requests or some other dynamic activity. This
    is somewhat reminiscent of the way hypertext links in HTML pages tend to be styled
    differently than plain text so that it''s clear to a user that they perform an
    additional function.


    At the expense of a little more coding effort, instructions and information about
    active elements can be incorporated into ToolTip pop-ups. This is, of course,
    especially important when an active link can have a major effect on the application''s
    state. Figure 24.1 shows an example of such a pop-up box.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_314_0.png)


    **Figure 24.1** Pop-information helps users to understand interfaces.


    # Don''t Use Ajax Where It''s Inappropriate


    As Ajax is undoubtedly useful for improving web interfaces, you need to accept
    that there are many situations where the use of Ajax detracts from the user experience
    instead of adding to it.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'This is especially true when the page-based interface metaphor is perfectly
    adequate for, perhaps even of greater relevance to, the content and style of the
    site. Text-based sites with subjects split conveniently into chapter-styled pages
    can often benefit much from intelligently designed hyperlinking as they can from
    the addition of Ajax functionality.


    Small sites in particular may struggle to get sufficient benefit from an Ajax
    interface to balance the associated costs of additional code and added complexity.


    # Security


    Ajax does not itself seem to present any security issues that are not already
    present when designing web applications. It is notable, however, that Ajax-enhanced
    applications tend to contain more client-side code than they did previously.


    Because the content of client-side code can be viewed easily by any user of the
    application, it is important that sensitive information is not revealed within
    it. In this context, sensitive information is not limited to such things as usernames
    and passwords (though they are, of course, sensitive), but also includes business
    logic. Make the server-side scripts responsible for carrying out such issues as
    database connection. Validate data on the server before applying it any important
    processing.


    # Test Code Across Multiple Platforms


    It will be clear from the content of this book that the various browsers differ
    in their implementation of JavaScript. The major difference in the generation
    of XMLHttpRequest object instances between Microsoft and non-Microsoft browsers
    is a fundamental example, but there is a host of minor differences, too.


    The DOM, in particular, is handled rather differently, not only between browsers
    but also between different versions of the same browser. CSS implementation is
    another area where minor differences still proliferate.


    Although it has always been important to test new applications on various browsers,
    this is perhaps more important than ever when faced with the complexity of Ajax
    applications.


    Hopefully browsers will continue to become more standards-compliant, but until
    then test applications on as many different platforms and with as many different
    browsers as possible.'
  merge: -1
