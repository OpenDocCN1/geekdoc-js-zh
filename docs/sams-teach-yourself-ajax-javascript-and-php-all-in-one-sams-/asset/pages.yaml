  md: '# Working with the location Object


    The link object, introduced earlier this chapter, also includes this list of properties
    for accessing portions of the URL.


    > Although the location.href property usually contains the same URL as the document.URL
    property described earlier this chapter, you can''t change the document.URL property.
    Always use location.href to load a new page.


    The location object has two methods:


    +   location.reload() reloads the current document. This is the same as the Reload
    button on the browser''s toolbar. If you optionally include the true parameter,
    it will ignore the browser''s cache and force reload whether the document has
    changed or not.


    +   location.replace() replaces the current location with a new one. This is similar
    to setting the location object''s properties yourself. The difference is that
    the replace method does not affect the browser''s history. In other words, the
    Back button can''t be used to go to the previous location. This is useful for
    splash screens or temporary pages that it would be useless to return to.


    # Try It Yourself


    # Creating Back and Forward Buttons


    You can use the back and forward methods of the history object to add your own
    Back and Forward buttons to a web document. The browser already has Back and Forward
    buttons, of course, but it''s occasionally to include your own links that serve
    the same purpose.


    You will now create a script that displays Back and Forward buttons and use these
    methods to navigate the browser. Here''s the code that will create the Back button:


    ```

    <input type="button" onclick="history.back();" value="Back-">

    ```


    The <input> tag defines a button labeled Back. The onClick event handler uses
    the history.back() method to go to the previous page in history. The code for
    the Forward button is similar:


    ```

    <input type="button" onclick="history.forward();" value="Forward --">

    ```'
