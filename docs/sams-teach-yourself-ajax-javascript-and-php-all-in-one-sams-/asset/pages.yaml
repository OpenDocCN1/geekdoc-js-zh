  md: '# CHAPTER 22: Web Services and the REST and SOAP Protocols


    # By the Way


    Amazon.com often refers to the REST protocol as XML-over-HTTP or XML/HTTP.


    By creating a URL containing parameter/value pairs for the required search parameters
    (such as publisher, sort order, author, and so on) then submitting a GET request
    to this URL, the Amazon web service can be persuaded to return an XML document
    containing product details. We may then parse that XML to create DOM objects for
    display in a web page or provide data for further processing required by our application.


    # Did you Know?


    Amazon requires that you obtain a developer''s token to develop client applications
    for its web services. You will need this token in constructing REST requests to
    Amazon''s web services. You can also obtain an Amazon Associate''s ID to enable
    you to earn money by carrying Amazon services on your website. See http://www.amazon.com
    for details.


    Let''s see this in practice by developing a REST request to return a list of books.
    Many types of searches are possible, but in this example, we request a list of
    books published by Sams.


    We start to construct the GET request with the base URL:


    ```

    $url = ''http://xml.amazon.com/onca/xml33'';

    ```


    We then need to add a number of parameter/value pairs to complete the request:


    ```

    $assoc_id = "XXXXXXXXXX"; // your Amazon Associate''s ID

    $dev_token = "ZZZZZZZZZZ"; // Your Developer Token

    $manuf = "Sams";

    $url = "http://xml.amazon.com/onca/xml33";

    $url .= "?id=".$assoc_id;

    $url .= "&dev-token=".$dev_token;

    $url .= "&manufacturerSearch=".$manuf;

    $url .= "&mode=books";

    $url .= "&sort=salesrank";

    $url .= "&offer=all";

    $url .= "&type=lite";

    $url .= "&page=1";

    $url .= "&f=xml";

    ```


    Submitting this URL, we receive an XML file containing details of all matching
    books. (there are more than 5,000 titles!), I won''t reproduce the whole file
    here Listing 22.1 shows an extract from the XML file, including the first book
    in the list.'
