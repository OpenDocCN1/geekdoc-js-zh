- img_proc: true
  md: "# The SOAP Protocol\n\n279\n\nThe full name Simple Object Access Protocol has\
    \ been dropped in the later versions of the SOAP specifications, as it was felt\
    \ that the direction of the project had shifted and the name was no longer appropriate.\
    \ The protocol continues to be referred to as SOAP.\n\n# By the Way\n\n# The Background\
    \ of the SOAP Protocol\n\nSOAP began in the late 1990s when XML was itself a fledgling\
    \ technology and was offered to the W3C in 2000. SOAP and another XML-based web\
    \ service protocol, called XML-RPC, had a joint upbringing.\n\nSOAP was designed\
    \ essentially as a means of packaging remote procedure calls (requests to invoke\
    \ programs on remote machines) into XML wrappers in a standardized way.\n\nNumerous\
    \ enterprises contributed to the early development of SOAP, including IBM, Microsoft,\
    \ and Userland. The development of SOAP later passed to the XML Protocols Working\
    \ Group of the W3C.\n\n> You can get the latest information on the SOAP specification\
    \ from the W3c site at http://www.w3.org/2000/xp/Group.\n\n# Did you Know?\n\n\
    # The SOAP Protocol\n\nSOAP is an XML-based messaging protocol. A SOAP request\
    \ is an XML document with the following main constituents:\n\n+   - An envelope\
    \ that defines the document as a SOAP request\n\n+   - A body element containing\
    \ information about the call and the expected responses\n- Optional header and\
    \ fault elements that carry supplementary information\n\nLet's look at a skeleton\
    \ SOAP request:\n\n```\n<xml version=\"1.0\"?>\nSOAP-ENV:Envelope\nxmlns:SOAP-ENV=\"\
    http://schemas.xmlsoap.org/soap/envelope/\"\nSOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n<SOAP-ENV:Header>\n  ... various commands\n</SOAP-ENV:Header>\n```"
  merge: -1
  pgno: 294
- img_proc: true
  md: "# CHAPTER 22: Web Services and the REST and SOAP Protocols\n\n```\n<SOAP-ENV:Body>\n\
    ... various commands ..\n<SOAP-ENV:Fault>\n.. various commands .\n</SOAP-ENV:Fault>\n\
    </SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\nNote that the SOAP request is an\
    \ XML file, which has as its root the Envelope element.\n\nThe first line of the\
    \ Envelope is\n\n```\n<SOAP-ENV:Envelope xmlns:SOAP-EN =\n  \"http://schemas.mlsoap.org/soap/envelope/*\"\
    \nSOAP-ENV:encodingStyle=\n  \"http://schemas.mlsoap.org/soap/encoding/\"\n```\n\
    \nThis line declares the xmlns:soap namespace, which must always have the xmlns:soap=\"\
    http://schemas.mlsoap.org/soap/envelope/\".\n\n> A namespace is an identifier\
    \ used to uniquely group a set of XML elements or attributes, providing a means\
    \ to qualify their names, so that names in other schemas do not conflict with\
    \ them.\n\nThe encodingStyle attribute contains information defining the data\
    \ types used in the message.\n\nNext appears the Header element, which is optional\
    \ but must, if present, be the first element in the message. Attributes defined\
    \ in the Header element define how the message is to be processed by the receiving\
    \ application.\n\nThe body element of the SOAP message contains the message intended\
    \ for the final recipient.\n\nThe serialized method arguments are contained within\
    \ the SOAP request's body element. The call's XML element must immediately follow\
    \ the opening XML tag of the SOAP body and must have the same name as the remote\
    \ method being called.\n\nThe body may also contain a Fault element (but no than\
    \ one). This element is defined in the SOAP specification and is intended to carry\
    \ information about any errors that may have occurred. If it exists, it must be\
    \ a child element of the body element. The Fault element has various child elements\
    \ including faultcode, faultstring, and detail, which contain specific details\
    \ of the fault condition."
  merge: -1
  pgno: 295
- img_proc: true
  md: "# The SOAP Protocol\n\n281\n\n# Code Example of a SOAP Request\n\nLet's see\
    \ how a typical SOAP request might look:\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<SOAP-ENV:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/envelope/\"\
    \ xmlns:SOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/encoding/\">\n<SOAP-ENV:Body>\n\
    \  <m:GetInvoiceTotal xmlns:m=\"http://www.somedomain.com/invoices\">\n    <m:Invoice>7293</m:Invoice>\n\
    \  </m:GetInvoiceTotal>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope\n\nBody\n</SOAP-ENV:Envelope\n\
    ```\n\nIn the preceding example, the m:GetInvoiceTotal and m:Invoice elements\
    \ are specific to the particular application, and are not part of SOAP itself.\
    \ These elements constitute the message contained in the SOAP envelope.\n\nLet's\
    \ see what the SOAP response from the service might look like:\n\n```\n<xml version=\"\
    1.0\"?>\n<SOAP-ENV:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/envelope/\"\
    \ xmlns:SOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/encoding/\">\n<SOAP-ENV:Body>\n\
    \  <m:ShowInvoiceTotal xmlns:m=\"http://www.somedomain.com/invoices\">\n    <m:Invoice>3295.00</m:Invoice>\n\
    \  </m:ShowInvoiceTotal>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\n# Sending\
    \ the SOAP Request Via HTTP\n\nA SOAP message may be transmitted via HTTP GET\
    \ or HTTP POST. If sent via HTTP POST, the SOAP message requires at least one\
    \ HTTP header to be set; this defines Content-Type:\n\nContent-Type: text/xml\n\
    \nAfter a successful SOAP exchange, you would expect to receive the SOAP response\
    \ preceded by an appropriate HTTP header:\n\n```\nHTTP/1.1 200 OK\nContent-Type:\
    \ text/xml\nContent-Length: yyy\n<xml version=\"1.0\"?>\n```"
  merge: -1
  pgno: 296
- img_proc: true
  md: "# CHAPTER 22: Web Services and the REST and SOAP Protocols\n\n```\n<SOAP-ENV:Envelope\
    \ xmlns:soap-envelope=\"http://schemas.xmlsoap.org/soap/envelope/\"\nSOAP-ENV:encodingStyle=\"\
    http://schemas.xmlsoap.org/soap/encoding\">\n<SOAP-ENV:Body>\n<m:ShowInvoiceTotal\
    \ xmlns:m=\"http://www.somedain.com/invoices\">\n<m:InvoiceTotal>3295.00</m:InvoiceTotal>\n\
    </n</m:ShowInvoiceTotal>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\n# Ajax\
    \ and SOAP\n\nTo use SOAP with Ajax, you need to perform a number of separate\
    \ steps:\n\n+   1. Create the SOAP envelope.\n2. Serialize the application-specific\
    \ information into XML.\n3. Create the SOAP body containing a serialized version\
    \ of your application-specific code.\n4. Send an HTTP request via the XMLHttpRequest\
    \ object, containing the SOAP message as a payload.\n\nThe callback function needs\
    \ to be responsible for unpacking the SOAP response and parsing the XML contained\
    \ inside it.\n\n# Code Example\n\nHow might the resulting code look? Let's see\
    \ an example using the fictitious SOAP web service of the previous example:\n\n\
    ```\nvar invoiceiceno = '77293';\nhttp.open('POST', 'http://somedomain.com/invoices',true);\n\
