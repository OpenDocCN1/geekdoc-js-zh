    Obviously, with the keyword only saves a bit of typing in situations like this.\
    \ However, you might find it more useful when you're dealing with a DOM object\
    \ throughout a large procedure, or when you are using a built-in object, such\
    \ as the Math object, repeatedly.\n\n# Working with Dates\n\nThe Date object is\
