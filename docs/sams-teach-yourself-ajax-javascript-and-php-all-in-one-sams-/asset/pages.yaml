    HTTPRequest status properties other than 200 and output a suitable error-message
    to the user.


    Feel free to experiment with the code and see what you can achieve.


    # Summary


    This chapter combined many of the techniques discussed to produce a com-pact and
    reusable JavaScript library that can be called simply from an HTML page.


    The code supports both HTTP GET and HTTP POST requests and can deal with data

    returned from the server as text or XML.'
