  md: '# CHAPTER 5: Working with the Document Object Model (DOM)


    Internet Explorer included many of the same objects, there was no guarantee that
    the same objects would work the same way in both browsers, let alone in less common
    browsers.


    The bad news is that there are still differences between the browsers—but here''s
    the good news. Since the release of Netscape 3.0 and Internet Explorer 4.0, all
    of the basic objects (those covered in this chapter) are supported in the same
    way in both browsers. With more recent browser releases, a much more advanced
    DOM is supported.


    # DOM Levels


    The W3C (World Wide Web Consortium) developed the DOM level 1 recommendation.
    This is a standard that defines not only basic objects, but an entire set of objects
    that encompass all parts of an HTML document. A level 2 DOM standard has also
    been released, and level 3 under development.


    Netscape 4 and Internet Explorer 4 supported their own DOMs that allowed more
    control over documents, but weren''t standardized. Fortunately, starting with
    Internet Explorer 5 and Netscape 6, both support the W3C DOM, so you can support
    both browsers with simple, standards-compliant code. All of today''s current browsers
    support the W3C DOM.


    The basic object hierarchy described in this chapter is informally referred to
    as DOM level 0, and the objects are included in the DOM level 1 standard.


    # Working with Web Documents


    The document object represents a web document, or page. Web documents are displayed
    within browser windows, so it shouldn''t surprise you to learn that the document
    is a child of the window object.


    Because the window object always represents the current window (the one containing
    the script), you can use window.document to refer to the current document. You
    can also refer to document, which automatically refers to the current window.


    > You''ve already used the document.write method to display text within a web
    document. The examples in earlier chapters only used a single window and document,
    so it was unnecessary to use window.document.write—but this longer syntax would
    have worked equally well.'
