    # Did you Know?


    # Incrementing and Decrementing


    In PHP you can increment or decrement a number by using a double plus (++) or
    double minus (--)symbol. The following statements both add one to $number:


    ```

    $number++;

    ```


    ```

    $++number;

    ```


    The operator can be placed on either side of a variable, and its position determines
    at what point the increment takes place.


    This statement subtracts from $count before displaying the result:


    ```

    echo --$count;

    ```


    However, the following statement displays the current value of $count decrementing
    it:


    ```

