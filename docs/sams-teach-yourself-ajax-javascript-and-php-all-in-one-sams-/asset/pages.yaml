  md: '# Data Types in JavaScript


    These are the basic JavaScript data types:


    +   * Numbers, such as 3, 25, or 1.4142138. JavaScript supports both integers
    and floating-point numbers.


    +   * Boolean, or logical values. These can have one of two values: true or false.
    These are useful for indicating whether a certain condition is true.


    You''ll learn more about Boolean values, and about using conditions in JavaScript,
    in Chapter 8.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_102_0.png)


    +   * Strings, such as "I am a jelly doughnut". These consist of one or more characters
    of text. (Strictly speaking, these are String objects, which you''ll learn about
    later in this chapter.)


    +   * The null value, represented by the keyword null. This is the value of an
    undefined variable. For example, the statement document.write(fig) will result
    in this value (and an error message) if the variable fig has not been previously
    declared or defined.


    Although JavaScript keeps track of the data type currently stored in each variable,
    it doesn''t restrict you from changing types midstream. For example, suppose you
    declared a variable by assigning it a value:


    ```

    total = 31;

    ```


    This statement declares a variable called total and assigns it the value of 31.
    This is a numeric variable. Now suppose you changed the value of total:


    ```

    total = "batross";

    ```


    This assigns a string value to total, replacing the numeric value. JavaScript
    will display an error when this statement executes; it''s perfectly valid, although
    it''s probably not very useful total.


    > Although this feature of JavaScript is convenient and powerful, it can also
    make it easy to make a mistake. For example, if the total variable was used later
    in a mathematical calculation, the result would be invalid—JavaScript does not
    warn you that you''ve made this mistake.


    ![](img/5a65c4ec3b3e08b6ff226ca847fae85a_102_1.png)'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Converting Between Data Types


    JavaScript handles conversions between data types for you whenever it can. For
    example, you''ve already used statements like this:

    document.write("The total is * + total");


    This statement prints a message as "The total is 40". Because the document.write
    function works with strings, the JavaScript interpreter automatically converts
    any nonstrings in the expression (in this case, the value of total) to strings
    before performing the function.


    This works equally well with floating-point and Boolean values. However, there
    are some situations where it won''t work. For example, the following statement
    will work if the value of total is 40:


    ```

    average = total / 3;

    ```


    The total variable could also contain a string; in this case, the preceding statement
    would result in an error.


    In some situations, you might end up with a string containing a number, and need
    to convert it to a regular numeric variable. JavaScript includes two functions
    for this purpose:


    +   * parseInt()—Converts a string to an integer number.

    * parseFloat()—Converts a string to a floating-point number.


    Both of these functions will read a number from the beginning and return a numeric
    version. For example, these statements convert the string "30 angry polar bears"
    to a number:

    stringvar = "30 angry polar bears";

    numvar = parseInt(stringvar);


    After these statements execute, the numeric variable contains the number 30. The
    nonnumeric portion of the string is ignored.


    > These functions look for a number of the appropriate type at the beginning of
    the string. If a valid number is not found, the function will return the special
    value NaN, meaning not a number.'
