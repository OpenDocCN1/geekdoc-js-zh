    # Methods and Properties


    Now that we have created an instance of the XMLHttpRequest object, let''s look
    at some of the object''s properties and methods, listed in Table 10.1.


    TABLE 10.1 XMLHttpRequest Objects and Methods

    | Properties | Description |

    |---|---|n| onreadystatechange | Determines which event handler will be called
    when the object''s readyState property changes |

    | readyState | Integer reporting the status of the request:

    0 = uninitialized

    1 = loading

    2 = loaded

    3 = interactive

    4 = completed |

    | responseText | Data returned by the server in text string form |

    | responseXML | Data returned by the server expressed as a document object |

    | status | HTTP status code returned by server |

    | statusText | HTTP reason phrase returned by server |

    | Methods | Description |

    | abort() | Stops the current request |

    | getAllResponseHeaders() | Returns all headers as a string |

    | getResponse(x) | Returns the value of x as a string |

    | open(''method'', ''URL'', ''a'') | Specifies the HTTP method (for example, GET
    or POST), the target URL, and whether the request should be handled asynchronously
    (If yes, a=''true''—if no, a=''false'').'
