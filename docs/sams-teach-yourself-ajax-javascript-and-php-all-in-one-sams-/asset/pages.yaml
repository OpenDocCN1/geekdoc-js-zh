    # Did you Know?


    Color values in HTML are coded using a hexadecimal system. Each color value is
    made up of three component values, corresponding to red, green, and blue. Each
    of the color values can range from 00 to ff (zero to 255 in decimal notation).
    The three hex numbers are concatenated into a string prefixed with a hash character
    (#). The color value #000000 therefore corresponds to black, and #ffffff to pure
    white.


    # Images


    Images can be inserted in our page by means of the <img> tag. In this case we
    specify the source file of the image as a parameter using the src attribute. Aspects
    of the image display that we can alter this the border, width, and height of the
    image:


    ```

    <img src="myfile.jpg" border="2" width="250" height="175" />

    ```


    Border width, image width, and image height are in numbers of pixels (the "dots")
    formed by individual elements on the screen.


    # Did you Know?


    A useful attribute for images is alt, which is an abbreviation of alternative
    text. This specifies a short description of the image that will be offered to
    users whose browsers cannot view, or are configured not to, display images. Alternative
    text can also be important in making your website accessible to those with visual
    impairment and other disabilities:


    ```

    <img src="myfile.jpg" alt="Description of Image" />

    ```'
