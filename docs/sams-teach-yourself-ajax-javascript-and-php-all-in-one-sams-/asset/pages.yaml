    # Using Functions


    A *function* is used to make a task that might consist of many lines of code into
    a routine that can be called using a single instruction.


    PHP contains many functions that perform a wide range of useful tasks. Some are
    built into the PHP language; others are more specialized and are available only
    if certain extensions are activated when PHP is installed.


    The online PHP manual (www.php.net) is an invaluable reference. As well documentation
    for every function in the language, the manual pages are also annotated with user-submitted
    tips and examples, and you can even submit your own comments if you want.


    > To quickly pull up the PHP manual page for any function, use this shortcut:
    www.php.net/function_name.*


    Did you Know?'
