  md: '# CHAPTER 6: Using Variables, Strings, and Arrays


    Because incrementing or decrementing variables is quite common, JavaScript includes
    two types of shorthand for this syntax. The first is the += operator, which enables
    you to create the following shorter version of the preceding example:


    ```

    lines += 1;

    ```


    Similarly, you can subtract a number from a variable using the -= operator:


    ```

    lines -= 1;

    ```


    If you still think that''s too much to type, JavaScript also includes the increment
    and decrement operators, ++ and --. This statement adds one to the value of lines:


    ```

    lines++;

    ```


    Similarly, this statement subtracts one from the value of lines:


    ```

    lines--;

    ```


    You can alternately use the ++ or -- operators before a variable name, as in ++lines.
    However, these are not identical. The difference is when the increment or decrement
    happens:


    +   - If the operator is after the variable name, the increment or decrement happens
    after the current expression is evaluated.

    - If the operator is before the variable name, the increment or decrement happens
    before the current expression is evaluated.


    This difference is only an issue when you use the variable in an expression or
    increment or decrement it in the same statement. As an example, suppose you have
    assigned the lines variable the value 40. The following two statements have different
    effects:


    ```

    alert(lines++);

    alert(++lines);

    ```


    The first statement displays an alert with the value 40, and then increments lines
    to 41. The second statement first increments lines to 41, then displays an alert
    with the value 41.


    > These operators are strictly for your convenience. If it makes more sense to
    you to stick to lines = lines + 1, do it—your script won''t suffer.'
