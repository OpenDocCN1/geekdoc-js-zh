    nav\" width=\"100%\">\n<table class=\"rest\" width=\"50%\">\n```\n\n# Applying\
    \ Styles\n\nBefore moving on, we'll quickly cover how to apply style properties\
    \ to your doc-\\uments. Remember, you have three methods to add style sheets:\
    \ embedded, linked,\nand inline. We'll discuss each one in turn.\n\n# Embedded\
    \ Styles\n\nAll the styles are defined at the top of the HTML document within\
    \ the <head> tags\nbecause they contain information about the entire document.\
