  md: '# CHAPTER 4: Creating Simple Scripts in JavaScript


    # Text Editors


    The first tool you''ll need to work with JavaScript is a text editor. JavaScript
    scripts are stored in simple text files, usually as part of HTML documents. Any
    editor that can store ASCII text files will work. Our discussion of programmers’
    editors in Chapter 2, “Writing and Styling Pages in HTML and CSS” is equally relevant
    to our work here in JavaScript (and, in fact, to the code we carry out in PHP,
    later in the book).


    +   The CD that accompanies the book contains versions of the jEdit programmer’s
    editor for use on Java, Macintosh, and Windows platforms. This editor will work
    just fine for coding JavaScript programs.


    # Browsers


    You''ll need two things to work with JavaScript: a web browser and a computer
    to run it in. I recommend that you use the latest version of Mozilla Firefox or
    Microsoft Internet Explorer. See the Mozilla (http://www.mozilla.com) or Microsoft
    (http://www.microsoft.com) website to download a copy.


    At a minimum, you should have Firefox 1.0, Netscape 7.0, or Internet Explorer
    6.0 or later. You can choose whichever browser you like for your web browsing,
    but for developing JavaScript you should have more than one browser—at a minimum,
    Firefox and Internet Explorer. This will allow you to test your scripts in the
    common browsers users will employ on your site.


    > If you plan on making your scripts available over the Internet, you''ll need
    a web server, or access to one. However, you can use most of the JavaScript examples
    in this book directly from your computer''s hard disk.


    # Displaying Time with JavaScript


    One common and easy use for JavaScript is to display dates and times. Because
    JavaScript runs on the browser, the times it displays will be in the user''s current
    time zone. However, you can also use JavaScript to calculate “universal” (UTC)
    time.


    > UTC stands for Universal Time (Coordinated), and is the atomic time standard
    based on the old GMT (Greenwich Mean Time) standard. This is the time at the Prime
    Meridian, which runs through Greenwich, London, England.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'As a basic introduction to JavaScript, you will now create a simple script
    that displays the current time and the UTC time within a web page, starting with
    the next section.


    # Beginning the Script


    Your script, like most JavaScript programs, begins with the HTML <script> tag.
    You use the <script> and </script> tags to enclose a script within the HTML document.


    > Remember to include only valid JavaScript statements between the starting and
    ending <script> tags. if the browser finds anything but valid JavaScript statements
    within the <script> tags, it will display a JavaScript error message.


    To begin creating the script, open your favorite text editor and type the beginning
    and ending <script> tags as shown.

    <script LANGUAGE="JavaScript" type="text/javascript"></script>


    Because this script does not use any of the new features of JavaScript 1.1 or
    later, you won''t need to specify a version number in the <script> tag. This script
    should work with all browsers going by Netscape 2.0 or Internet Explorer 3.0.


    # Adding JavaScript Statements


    Your script now needs to determine the local and UTC times, and then display them
    to the browser. Fortunately, all of the hard parts, such as converting date formats,
    are built in to the JavaScript interpreter.


    # Storing Data in Variables


    To begin the script, you will use a variable to store the current date. You will
    learn more about variables in Chapter 6, "Using Variables, Strings, and Arrays,"
    A variable is a container that can hold a value—number, some text, or in this
    case, a date.


    To start writing the script, add the following line after the first <script> tag.
    Be sure to use the same combination of capital and lowercase letters in your version
    JavaScript commands and variable names are case sensitive.


    ```

    now = new Date();

    ```'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# CHAPTER 4: Creating Simple Scripts in JavaScript


    This statement creates a variable called now and stores the current date and time
    in it. This statement and the others you will use in this script JavaScript''s
    built-in Date object, which enables you to conveniently handle dates and times.
    You''ll learn more about working with dates in Chapter 9, “Using Built-In Functions
    and Libraries.”


    > Notice the semicolon at the end of the previous statement. This tells the browser
    that it has reached the end of a statement. Semicolons are optional, but using
    them helps you avoid some common errors. We''ll use them throughout this book
    for clarity.


    # Calculating the Results


    Internally, JavaScript stores dates as the number of milliseconds since January
    1, 1970. Fortunately, JavaScript includes a number of functions to convert dates
    and times in various ways, so you don''t have to figure out how to convert milliseconds
    to day, date, and time.


    To continue your script, add the following two statements before the final </script>
    tag:


    ```

    localtime = now.toString();

    utctime = now.toUTCString();

    ```


    These statements create two new variables: localtime, containing the current time
    and in a nice readable format, and utctime, containing the UTC equivalent.


    > The localtime and utctime variables store a piece of text, as January 1, 2001
    12:00 PM. In programming parlance, a piece of text is called a string. You will
    learn more about strings in Chapter 6.


    # Creating Output


    You now have two variables—localtime and utctime—which contain the results we
    want from our script. Of course, these variables don''t do us much good unless
    we can see them. JavaScript includes a number of ways to display information,
    and one of the simplest is the document.write statement.


    The document.write statement displays a text string, a number, or anything else
    you throw at it. Because your JavaScript program will be used within a web page
    as part of the page. To display the result, add these statements before the final
    </script> tag:


    ```

    document.write(\<local time:" + localtime + "<br>");

    document.write(\<UTC time:" + utctime + "");

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Adding the Script to a Web Page


    These statements tell the browser to add some text to the web page containing
    your script. The output will include some brief strings introducing the results,
    and the contents of the localtime and utctime variables.


    Notice the HTML tags, such as &lt;, within the quotation marks—because JavaScript’s
    output appears within line a web page, it needs to be formatted with HTML. The
    &lt;br&gt; tag in the first line ensures that the two values will be displayed
    on separate lines.


    > Notice the plus signs (+) used between the text and variables in the previous
    statements. In this case, it tells the browser to combine the values into one
    string of text. If you use the plus sign between two numbers, they are added together.


    # Adding the Script to a Web Page


    You should now a complete script that calculates a result and displays it. Your
    listing should match Listing 4.1.


