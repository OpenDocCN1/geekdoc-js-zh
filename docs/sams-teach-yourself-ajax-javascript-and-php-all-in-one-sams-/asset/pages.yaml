- img_proc: true
  md: '# By the Way


    Every conditional expression evaluates to a Boolean value, and an if statement
    simply acts on a TRUE or FALSE value to determine whether the next block of code
    should be executed. Any zero value in PHP is considered FALSE, and any nonzero
    value is considered TRUE.


    As it stands, the previous example will be TRUE because 5 is less than 10, so
    the statement in braces is executed, and the corresponding output is displayed.
    Now, if you change the initial value of $number to 10 or higher and rerun the
    script, the condition fails, and no output is produced.


    Braces are used in PHP to group blocks of code together. In a conditional statement,
    they surround the section of code that is be executed if the preceding condition
    is true.


    # Did you Know?


    You will come across three types of brackets when writing PHP scripts. The most
    commonly used terminology for each type is parentheses (()), braces ({}), and
    square brackets ([{}).


    Braces are not required after an if statement. If they are omitted, the following
    statement is executed if the condition is true. Any subsequent statements are
    executed, regardless of the status of the conditional.


    # Did you Know?


    Although how your code is indented makes no difference to PHP it is customary
    to indent blocks of code inside braces with a few space characters to visually
    separate that from other statements.


    Even if you only want a condition or loop to apply to one statement, it is still
    useful to use braces for clarity. It is particularly important in order to keep
    things readable when you''re nesting multiple constructs.


    # Conditional Operators


    PHP allows you to perform a number of different comparisons, to check for the
    equality or relative size of two values. PHP''s conditional operators are shown
    in Table 16.1.'
  merge: -1
