  md: '# CHAPTER 5


    # Working with the Document Object Model (DOM)


    What You''ll Learn in This Chapter:


    +   - Understanding Objects

    - Understanding the Document Object Model (DOM)

    - Working with Web Documents

    - Accessing Browser History

    - Working with the location Object


    In this chapter, you''ll be introduced to one of the most important tools you''ll
    use with JavaScript: the Document Object Model (DOM), which lets your scripts
    manipulate web pages, windows, and documents.


    Without the DOM, JavaScript would be just another scripting language—with the
    DOM, it becomes a powerful tool for making pages dynamic. This chapter will first
    discuss objects, then the idea of the DOM and some of the objects you''ll use
    most.


    # Understanding Objects


    JavaScript supports objects. Like variables, objects can store data—but they can
    store two or more pieces of data at once.


    The items of data stored in an object are called the properties of the object.
    For example, you could use objects to store information about people such as in
    an address book. The properties of each person object might include a name, an
    address, and a telephone number.


    JavaScript uses periods to separate object names and property names. For example,
    for a person object called Bob, the properties might include Bob.address and Bob.phone.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# CHAPTER 5: Working with the Document Object Model (DOM)


    Objects can also include methods. These are functions that work with the object''s
    data. For example, our person object for the address book might include a dis-play()
    method to display the person''s information. In JavaScript terminology, the statement
    Bob.display() would display Bob''s details.


    # By the Way


    The document.write function we discussed in the previous chapter is actually the
    write method of the document object. You will learn more about this object later
    in this chapter.


    Don''t worry if this sounds confusing—you''ll be exploring objects in much more
    detail in this book. For now, you just need to know the basics. JavaScript supports
    three kinds of objects:


    +   - Built-in objects are built in the JavaScript language. You''ve already encountered
    one of these, Date. Other built-in objects include Array and String, which you''ll
    explore in Chapter 6, "Using Variables, Strings, and Arrays" and Math, which is
    explained in Chapter 9, "Using Built-In Functions and Libraries."


    +   - DOM (Document Object Model) objects represent various components of the
    browser and the current HTML document. For example, the alert( ) function you
    used earlier in this chapter is actually a method of the window object. You''ll
    explore these in more detail in the course of this chapter.


    +   - Custom objects are objects you create yourself. You''ll learn to use custom
    objects in Chapter 7 "Using Functions and Objects."


    # Understanding the Document Object Model (DOM)


    One advantage JavaScript has over basic HTML is that scripts can manipulate the
    web document and its contents. Your script can load a new page into the browser,
    work with parts of the browser window and document, open new windows, and even
    modify text within the page dynamically.


    To work with the browser and documents, JavaScript uses a hierarchy of parent
    and child objects called the Document Object Model (DOM). These objects are organized
    into a tree-like structure, and represent all of the content and components of
    a web document.'
  merge: -1
