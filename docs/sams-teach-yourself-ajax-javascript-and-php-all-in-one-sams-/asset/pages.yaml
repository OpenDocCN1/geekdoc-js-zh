  md: '# Reserved Words


    One rule for variable names—they must not be *reserved* words. These include the
    words that make up the JavaScript language, such as if and for, DOM object names
    such as window and document, and built-in object names such as Math and Date.


    # Spacing


    Blank space (known as *whitespace* by programmers) is ignored by JavaScript. You
    can include spaces and tabs within a line, or blank lines, without causing an
    error. Blank space often makes the script more readable.


    # Using Comments


    JavaScript *comments* enable you to include documentation within your script.
    This will be useful if someone else tries to understand the script, or if you
    try to understand it after a long break. To include comments in a JavaScript program,
    begin a line with two slashes, as in this example:


    ```

    //this is a comment.

    ```


    You can also begin a comment with two slashes in the middle of a line, which is
    useful for documenting a script. In this case, everything on the line after the
    slashes is treated as a comment and ignored by the browser. For example,


    ```

    a = a + 1; // add one to the value of a

    ```


    JavaScript also supports C-style comments, which begin with /* and end with */.
    These comments can extend more than one line, as the following example demonstrates:


    ```

    /*This includes a variety of features, including this comment. */

    ```


    JavaScript statements with a comment are ignored, C-style comments are often used
    for *commenting out* sections of code. If you have some lines of JavaScript that
    you want to temporarily take out of the picture while you debug a script, you
    can add /* at the beginning of the section and */ at the end.


    > Because these comments are part of JavaScript syntax, they are only valid inside
    <script> tags or within an external JavaScript file.'
