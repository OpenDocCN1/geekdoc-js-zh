- img_proc: true
  md: "# CHAPTER 16: Flow Control\n\n| TABLE 16.2 Logical Operators in PHP |\n| Operator\
    \ | Name | Description |\n| --- | --- | --- |\n| ! a | NOT | True if a is not\
    \ true |\n| a && b | AND | True if both a and b are true |\n| a || b | OR | True\
    \ if either a or b is true |\n| a and b | AND | True if both a and b are true\
    \ |\n| a xor b | XOR | True if a or b is true, but not both |\n| a or b | OR |\
    \ True if either a or b is true |\n\nYou have noticed that there are two different\
    \ ways of performing a logical AND or OR in PHP. The difference between and and\
    \ && (between and or and ||) is the precedence used to evaluate expressions.\n\
    \nTable 16.2 lists the highest-precedence operators first. The following conditions,\
    \ which appear to do the same thing, are subtly significantly different:\n\n+\
    \   - or b and c\n- || b and c\n\nIn the former condition, the and takes precedence\
    \ and is evaluated first. The overall condition is true if a is true or if both\
    \ b and c are true.\n\nIn the latter condition, || takes precedence, so c must\
    \ be true, as either a or b, to satisfy the condition.\n\n# Multiple Condition\
    \ Branches\n\nBy using an else clause with an if statement, you can specify an\
    \ alternate action to be taken if the condition is not met. The following example\
    \ tests the value of $number and displays a message that says it is greater than\
    \ or less than 10:\n\n```\n$number = 16;\nif ($number < 10) {\n  echo \"$number\
    \ is less than ten\";\n}\nelse {\n  echo \"$number is more than ten\";\n}\n```\n\
    \nThe else clause provides an either/or mechanism for conditional statements.\
    \ To add more branches to a conditional statement, the elseif keyword can be used\
    \ to add a further condition that is checked only if the previous condition in\
    \ the statement fails."
