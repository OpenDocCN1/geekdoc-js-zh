  md: "# Providing User Feedback\n\nA commonly used way to do this is to modify the\
    \ contents of a page element to show something eye-catching, such as a flashing\
    \ or animated graphic, while a request is being processed and then remove when\
    \ processing is complete.\n\n# The getElementById() Method\n\nJavaScript's getElementById()\
    \ method allows you to locate an individual document element by its value. You\
    \ can use this method in your user feedback to temporarily change the contents\
    \ of a particular page element to provide the visual that a server request is\
    \ in progress.\n\nElements within a page that have id values declared are expected\
    \ to each have a unique id. This allows you to identify a unique element. Contrast\
    \ with the class attribute, which can be applied to any number of separate elements\
    \ in a page and is more commonly used to set the display characteristics of a\
    \ group of objects.\n\n> Did you Know?\n\nSuppose that we have, say, a small animated\
    \ file anim.gif that we want to display while awaiting information from the server.\
    \ We want to display this graphic inside a <div> element within the HTML page.\
    \ We begin with this <div> element empty:\n\n```\n<div id=\"waiting\"></div>\n\
    ```\n\nNow consider the code of the callback function:\n\n```\nfunction responseAjax()\
