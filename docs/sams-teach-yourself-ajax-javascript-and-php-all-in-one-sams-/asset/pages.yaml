  md: 'Over the next few chapters we''ll examine how these methods and properties
    are used to create the functions that form the building blocks of Ajax applications.


    For now, let''s examine a few of these methods.


    # open() Method


    The open() method prepares the XMLHttpRequest object to communicate with the server.
    You need to supply at least the two mandatory arguments to this method:


    +   * First, specify which HTTP method you intend to use, usually GET or POST.


    +   * Next, the destination URL of the request is included as the second argument.
    making a GET request, the URL needs to be suitably encoded with any parameters
    and their values as part of the URL.


    For security reasons, the XMLHttpRequest object is allowed to communicate only
    with URLs within its own domain. An attempt to connect to a remote domain in a
    “permission denied” error message.


    > A common mistake is to reference your domain as mydomain.com in a call made
    from www.mydomain.com. The two will be regarded as different by the JavaScript
    interpreter, and connection will not be allowed.


    Watch Out!


    get you may include a third argument to the request, a Boolean value to declare
    whether the request is being sent in asynchronous mode. If false, the request
    will not be sent in asynchronous mode, and the page will be effectively locked
    until the request is completed. The default value of true will be assumed if the
    parameter is omitted, and requests will then be sent asynchronously.


    > A Boolean data type has only two possible values, 1 (true) and 0 (false).


    By the Way


    # send() Method


    Having prepared the XMLHttpRequest using the open() method, you can send the request
    using the send() method. One argument is accepted by the send() function.'
