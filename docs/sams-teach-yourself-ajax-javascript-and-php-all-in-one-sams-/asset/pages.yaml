    As with the previous statement, this alerts you if the phone number field is not\n\
    blank.\n\n# Did you Know?\n\nThe logical operators are powerful, but it's easy\
    \ to accidentally create an impossi-\ble condition with them. For example, the\
    \ condition (a < 10 && a > 20) might\nlook correct at first glance. However, if\
    \ you read it out loud, you get \"If a is less\nthan 10 and a is greater than\
    \ 20\"—an impossibility in our universe. In this case,\nOr (||) should have been\
