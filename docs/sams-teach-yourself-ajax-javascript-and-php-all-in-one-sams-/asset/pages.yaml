    - Best Practices for JavaScript


    As has already been discussed earlier in the book, JavaScript is a client-side
    scripting language for web pages. You can include JavaScript commands directly
    in the HTML document, and the script will be executed when the page is viewed
    in a browser.


    During this chapter, you will create a simple script, edit it, and test it using
    a web browser. Along the way you''ll learn the basic tasks involved in creating
    and using scripts.


    # Tools for Scripting


    Unlike many programming languages, you won''t need any special software to create
    JavaScript scripts. In fact, you probably already have everything you need.'
