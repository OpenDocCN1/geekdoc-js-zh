- img_proc: true
  md: '# CHAPTER 15: Variables


    Unlike in some programming languages, PHP variables do not need to be declared
    before they can be used. You can assign a value to a new variable name any time
    you want to start using it.


    # Did you Know?


    Variables can be used in place of fixed values throughout the PHP language. The
    following example uses echo to display the value stored in a variable in the same
    way that you would display a piece of fixed text:


    ```

    $name = "Chris";necho "Hello, ";necho $name;

    ```


    The output produced is

    Hello, Chris


    # Naming Variables


    Variable names can contain only letters, numbers, and the underscore character,
    and each must begin with a letter or underscore.


    > Variable names in PHP are case-sensitive. For example, $name is a different
    variable than $Sname, and the two could store different values in the same script.


    # Watch Out!


    > Using the underscore character is a handy way to give a variable name that is
    made up of two or more words. For example $first_name and $date_of_birth are more
    readable for having underscores in place.

    Another popular convention for combining words is to capitalize the first letter
    of each word—for example, $FirstName and $DateOfBirth. If you prefer this style,
    feel free to use it in your scripts but remember that the capitalization does
    matter.


    # Did you Know?


    # Expressions


    When a variable assignment takes place, the value given does not have to be a
    fixed value. It can be an expression—two or more values combined using an operator
