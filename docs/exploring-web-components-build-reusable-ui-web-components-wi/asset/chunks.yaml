  trans: '


    在本章中，我们将探讨几种最常用的工具，它们可以改善你的开发体验并提升工作效率。你将获得关于如何使用 Polymer 项目中的 `LitElement`、Hybrids、Slim
    和 Stencil 的通用但实用的概述。


    # 结构


    *   简化 Web Components 构建

    *   Polymer 与 LitElement

    *   Hybrids

    *   Slim

    *   Stencil


    # 目标


    本章将为你概述那些能够帮助你更轻松地构建 Web Component 的库和工具。它们让你专注于想要实现的结果，而将内部细节交给工具处理。


    你将学习如何使用每种工具的基本功能，从而选择最适合你需求和期望的工具。


    # 简化 Web Components 构建


    关于 Web Components 最常见的批评之一是认为它们过于底层。要正确使用 Web Components 所依赖的技术，你需要熟练掌握 DOM 及其行为。实际上，我们已经看到构建
    Web Components 需要应对一些挑战。例如，以下是创建健壮且与 DOM 集成的 Web Component 时必须执行的一些底层任务：


    *   属性与特性的映射

    *   事件处理与触发

    *   事件监听器的创建与移除

    *   Shadow DOM 的创建与操作

    *   模板定义


    这些只是你需要掌握的少数特性。其中一些活动需要深入了解 DOM；另一些则只是需要更多代码。


    你可能会考虑自行简化组件定义。例如，你可以通过扩展标准的 `HTMLElement` 类来定义自己的基类。这个类将处理 Shadow DOM 操作、属性与特性映射以及其他常见任务。这样，你的组件将扩展你的基类而非
    `HTMLElement`，从而免费获得一些常见任务。


    这正是许多旨在简化 Web Components 构建过程的库所采用的方法。在本章的剩余部分，我们将探讨一些最知名的库：`LitElement`、Hybrids、Slim
    和 Stencil。我们不会深入探讨这些库，而是提供一个轻量级的概述，以便从高层次了解它们所提出的方法。我们将使用每个库重新定义你在之前章节中用原生技术构建的
    cookie 提醒组件。这样，你将有机会比较每个库所提出的开发模型。


    我们将采用标准方法使用每个库，以便逐步介绍它们的特性。对于每个库，我们将首先介绍创建 Web Component 的基本基础设施。然后，我们将看到如何为 UI
    创建模板。之后，我们将探讨如何管理属性和特性，以及如何处理和触发事件。最后，我们将了解组件的生命周期。


    # Polymer 与 LitElement


    **Polymer** 是一个项目和一个库的名称，由 Google 推广，旨在将 Web Components 变为现实。该项目始于 2013 年，在 Web
    Components 宣布后不久，但浏览器当时尚未支持它们。该项目旨在让开发者能够支持 Web Components 的原则。同名的库分多个版本发布，并提供了许多
    polyfill 来支持核心技术和视觉设计。当大多数主流浏览器对 Web Components 支持不佳时，Polymer 提供了一种开发 Web Components
    的方式。


    2018 年 5 月，Polymer 团队宣布了该库开发中的一些重要变化。特别是，他们宣布项目的重点将转向 `LitElement` 库。该库是 Polymer
    的一部分，并提供对定义 Web Component 的支持。换句话说，Polymer 项目认识到原生 Web Components 支持的时机已经成熟。


    在本节中，我们将了解如何利用 `LitElement` 库来简化定义 Web Component 的方式。


    ## lit-html 库


    LitElement 的诞生与 `lit-html` 库密切相关。这是一个轻量级且可扩展的 HTML 模板库，基于浏览器内置的 HTML 解析器和标准模板元素。如果你了解
    React，可以将其视为 Web Components 的 JSX 解析器。


    你可以独立于 `LitElement` 使用 `lit-html` 库。它提倡一种函数式方法来创建 HTML 模板，允许你使用紧凑的语法创建模板，如下例所示：


    ```

    html`<h1>欢迎 ${name}</h1>`

    ```


    如你所见，这个表达式不过是一个使用 `lit-html` 库定义的 `html` 标签的标签模板字面量。因此，它使用了一种基于字符串插值的标准方法来定义模板。


    它的优势在于可以定义返回 `lit-html` 模板的函数，如下例所示：


    ```

    const helloTemplate = (name) => html`<h1>欢迎 ${name}</h1>`;

    ```


    `helloTemplate()` 函数会计算模板字面量，但当然，它不会渲染到 DOM 中。要生成模板的元素，你必须使用 `render()` 函数，如下所示：


    ```

    render(helloTemplate("John"), document.body);

    ```


    `render()` 函数接收由 `helloTemplate()` 函数实例化的模板，创建相应的 HTML 元素，并将它们附加到当前 HTML 文档的 body
    中。


    这一切都以非常高效的方式发生。


    当然，这只是对 `lit-html` 库的快速概述。它还有许多其他有趣的特性，比如对指令和高级渲染选项的支持。


    ## 使用 LitElement


    `LitElement` 库严重依赖于 `lit-html` 库。如果你计划使用 `LitElement` 构建 Web Components，则无需显式使用
    `lit-html`。它已经包含在 `LitElement` 中。


    假设你有一个基于 Node.js 开发环境的 Web Component 项目，使用 `LitElement` 的第一步是在终端窗口中输入以下命令来安装它：


    ```

    npm install lit-element

    ```


    ### 基本基础设施


    安装库后，你可以通过编写以下代码来实现我们的 cookie 提醒组件的基本基础设施：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    你从库中导入了 `LitElement` 类以及 HTML 和 CSS 标签模板字面量。顺便提一下，HTML 标签模板字面量与 `lit-html` 库中的函数相同。然后，你注意到这里我们扩展了
    `LitElement` 基类，而不是通常的 `HTMLElement` 类。这个类提供了库的支持，以简化组件定义，我们稍后会看到。


    **`LitElement` 库也支持基于装饰器的方法来定义 Web Components。然而，由于装饰器仍然不是官方支持的标准，你需要使用特定的转译器，比如经过适当配置的
    TypeScript 或 Babel。在本节中，我们不会使用这种方法，但会在过程中展示一些此类语法的示例。**


    通过使用基于装饰器的语法，之前的类定义将如下所示：


    ```

    import { LitElement, html, css, customElement } from ''lit-element'';


    @customElement("cookie-alert")

    export default class CookieAlert extends LitElement {


    }

    ```


    这种语法消除了对 `customElements.define()` 方法的需求，因为 `customElement` 装饰器完成了这个任务。


    ### 模板与 UI


