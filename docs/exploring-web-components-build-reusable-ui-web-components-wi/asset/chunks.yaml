    # [Creating custom events](#toc.xhtml_s66a)


    So far, we learned how to capture events firing on the elements that build our
    component and how to handle them. In this case, we are reacting to events generated
    by the user or the system by applying our logic, the logic that describes the
    internal behavior of our web component. Usually, an event is also a customization
    point for a component, a way to allow the user to define their reaction to something
    that happened to your component. This is why HTML elements provide us with events:
    they enable us to decide how to react when an event occurs. For example, the click
    event occurring on a button allows us to decide what to do. How can we provide
    a similar behavior when building our web components?


    From one point of view, we already have a way to allow the user to attach event
    handlers to our web component. Since our component inherits from the `HTMLElement`
    class, all standard events occur to our component, and the user can leverage the
    standard ways to handle them - the `onclick, onblur, etc.` attributes and properties,
    and the `addEventListener()` method. By the way, this is just the behavior we
    wanted to prevent in the previous section.


    So, for standard events on the whole web component, we don''t need to do anything
    special. The event management system works by default. But we could fire events
    specific to our web component. For example, we could provide different events
    when the user clicks on the cookie alert''s message or when they click on the
    **`Close`** button. Or we can have a new **`Accept`** button in the cookie alert
    component and generate a specific event informing that the user accepted our cookie
    policy.


    In the rest of this section, we will implement the accept button scenario to illustrate
    how to generate a custom event that the user can handle on their own.


    # [Managing policy acceptance](#toc.xhtml_s67a)


    Let''s start by adding the accept button to our cookie alert web component.


    The **`Close`** button simply hides the cookie alert for the current session.
    When the user accesses our web page or application again, the cookie alert will
    still show its message. The accept button, instead, will store into a cookie a
    piece of information telling that the user has accepted the cookie policy of the
    website. This cookie will be read by the cookie alert component each time it is
    added to the DOM. The presence of the cookie will prevent the cookie alert from
    being shown.


    `Let’s create the` **`Accept`** `button by adding the following code to the createComponent()
    method:`


    `createComponent() {`


    `//…`


    `const acceptButton = document.createElement("button");`


    `acceptButton.classList.add("button");`


    `acceptButton.innerText = "Accept";`


    `acceptButton.addEventListener("click", ()=>{`


    `this.style.visibility = "hidden";`


    `setCookie("cookiesAccepted", "y", 365);`


    `});`


    `div.appendChild(acceptButton);`


    `//…`


    `}`


    As you can see, we added a new button the same way we added the **`Close`** button
    earlier. This time, however, the click event handler also invokes a `setCookie()`
    function. This function is responsible for creating the cookie we need to store
    the user''s acceptance of the website policy.


    The `setCookie()` function is implemented as a private function of the module
    in the same `index.js` file containing the definition of the `CookieAlert` class.
    In other words, it is not a method of the `CookieAlert` class. This is its implementation:


    `function setCookie(cookieName, cookieValue, expirationDays) {`


    `var d = new Date();`


    `d.setTime(d.getTime() + (expirationDays*24*60*60*1000));`


    `var expires = "expires="+ d.toUTCString();`


    `document.cookie = cookieName + "=" + cookieValue + ";" + expires + ";path=/";`


    `}`


    The details of this function are out of the scope of the Web Components technologies.
    For completeness, we also report the `getCookie()` function implementation that
    allows us to retrieve a cookie given its name:


    `function getCookie(cookieName) {`


    `var name = cookieName + "=";`


    `var decodedCookie = decodeURIComponent(document.cookie);`


    `var ca = decodedCookie.split('';'');`


    `for(var i = 0; i <ca.length; i++) {`


    `var c = ca[i];`


    `while (c.charAt(0) == '' '') {`


    `c = c.substring(1);`


    `}`


    `if (c.indexOf(name) == 0) {`


    `return c.substring(name.length, c.length);`


    `}`


    `}`


    `return "";`


    `}`


    To make this cookie affecting the web component behavior, we need to analyze its
    content when the cookie alert component is appended to the DOM. So, we change
    the `connectedCallback()` method as follows:


    `connectedCallback() {`


    `const cookiesAccepted = getCookie("cookiesAccepted")`


    `if (cookiesAccepted === "y") {`


    `this.style.visibility = "hidden";`


    `} else {`


    `this.createComponent();`


    `}`


    `}`


    First, we get the `cookiesAccepted` cookie. If its value is y, we hide the component
    without even creating its UI. Otherwise, we create UI as usual.


    With these changes, when the user has not yet accepted the website cookie policy,
    the banner will appear as follows:


    ![](images/Figure_5.3.jpg)


    **Figure 5.3**


    In addition to the **`Close`** button, we now have the **`Accept`** button, too.
    If we click the **`Close`** button and reload the page, we will see the cookie
    alert again. If we click the **`Accept`** button and reload the page, we will
    no longer see the cookie alert.


    # [Creating events](#toc.xhtml_s68a)


    So far, the cookie alert component works as expected. However, currently, it doesn''t
    allow the user to add custom logic to the acceptance event. All the logic is inside
    our web component. We would like to enable the developer to use our cookie alert
    to add their logic when the user accepts the website policy. In other words, we
    need to generate a custom event.


    # [Dispatching simple events](#toc.xhtml_s69a)


    To fulfil this goal, we can leverage the standard mechanism to create custom DOM
    events. This means that we can create our event by using the `CustomEvent` class
    and trigger it by using the `dispatchEvent()` method. Let''s see how to apply
    them when creating the UI of our web component:


    `createComponent() {`


    `//…`


    `const acceptButton = document.createElement("button");`


    `acceptButton.classList.add("button");`


    `acceptButton.innerText = "Accept";`


    `acceptButton.addEventListener("click", ()=>{`


    `this.style.visibility = "hidden";`


    `setCookie("cookiesAccepted", "y", 365);`


    `this.dispatchEvent(new CustomEvent("accepted"));`


    `});`


    `div.appendChild(acceptButton);`


    `//…`


    `}`


    In the code above, we added one statement in the `click` handler of the **`Accept`**
    button. This statement simply creates and dispatches the accepted event.


    **You can use the Event class or the CustomEvent class to create events. While
    the former allows you to create a simple event, just the one we just illustrated,
    the latter allows you to pass also some data. In the example above, we used the
    CustomEvent class because we are going to pass data associated with the event
    later on.**


    So, when the user clicks the **`Accept`** button, the accepted event will be triggered.
    In this case, the developer using our web component can handle this event by adding
    an event listener just like any standard event. The following code shows how it
    can be accomplished in a page containing our `cookie-alert` component:


    `const cookieAlert = document.querySelector("cookie-alert");`


    `cookieAlert.addEventListener("accepted", () => alert("Thanks for accepting our
    cookie policy!"));`


    This event listener will display a thank message when the user accepts the cookie
    management policy.


    # [The meaning of ''this''](#toc.xhtml_s70a)


    Before going ahead, it''s worth mentioning a very important caveat about the use
    of `this` keyword.


