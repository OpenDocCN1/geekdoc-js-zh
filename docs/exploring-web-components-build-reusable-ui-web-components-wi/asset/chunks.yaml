  trans: "\n*   `onCreated()`：此方法在组件创建后执行。\n*   `onAdded()`：此方法在组件添加到 DOM 时运行。\n*\
    \   `onRender()`：此方法在 UI 渲染或更新时执行。\n*   `onRemoved()`：此方法在组件从 DOM 中移除时运行。\n\n\
    # Stencil\n\nStencil 是一种提供不同方式来构建 Web 组件的工具。我们在本章中探讨的库为你提供了一种抽象，可以简化或丰富 Web 组件的定义。然而，你构建的组件依赖于库本身：库的代码必须包含在最终生成的组件中。\n\
    \n而 Stencil 则是一个编译器。它为你提供了丰富的抽象来构建 Web 组件。它提供了一种受 Angular 和 React 启发的模型和语法。但构建组件的最终结果是纯\
    \ JavaScript。\n\n让我们通过实现我们的 cookie 警告组件来快速了解 Stencil 的主要特性。\n\n要启动一个 Stencil 项目，你可以运行以下命令：\n\
    \n`npm init stencil component cookie-alert`\n\n该命令将在 `cookie-alert` 文件夹中设置一个基本的\
    \ Stencil 项目，包含所有必需的依赖项。请注意，我们在上面的命令中指定了 `component` 关键字。实际上，你可以使用 Stencil 构建其他类型的项目，例如完整的\
    \ Web 应用程序（`app`）或 Ionic 应用程序（`ionic-pwa`）。\n\n项目结构创建完成后，你会看到几个文件夹和多个文件。我们不会分析整个结构，而是专注于类定义和\
    \ CSS 样式。请参考 Stencil 官方文档以获取更多详细信息。\n\n# 基本基础设施\n\nStencil 组件的基本定义如下所示：\n\n```\n\
    import { Component, h } from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n\
    \  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\nexport class CookieAlert\
    \ {\n  render() {\n    return <div>Hello, World!</div>;\n  }\n}\n```\n\n这几行代码突出了\
    \ Stencil 的一些关键特性：\n\n*   它使用 TypeScript 而不是纯 JavaScript\n*   它使用 JSX\n*   它使用装饰器\n\
    \n`CookieAlert` 类的定义使用了 `@Component` 装饰器进行注解。这个装饰器将该类标记为 Web 组件定义，类似于 Angular\
    \ 对其组件的处理方式。\n\n传递给装饰器的选项用于配置组件。具体来说，`tag` 选项定义了与组件关联的标签名。`styleUrl` 选项指示包含组件\
    \ CSS 规则的文件。`shadow` 选项指定是否启用 Shadow DOM（`true` 启用，`false` 不启用）。默认情况下，Shadow DOM\
    \ 是禁用的，因此在我们的 cookie 组件中，我们显式地启用了它。\n\n组件有一个 `render()` 方法，用于构建 UI。该方法返回一个 JSX\
    \ 表达式，类似于 React 基于类的组件中的做法。\n\n在模块顶部导入的 `h()` 函数是必需的，它允许 Stencil 将 JSX 转换为虚拟 DOM\
    \ 元素。\n\n# 模板和 UI\n\n至此，你已经知道如何为组件构建 UI：将标记定义为 `render()` 方法返回的 JSX 表达式，如下所示：\n\
    \n```\nimport { Component, h } from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n\
    \  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\nexport class CookieAlert\
    \ {\n  render() {\n    return <div class=\"container footer\">\n      <slot name=\"\
    message\"></slot>&nbsp;\n      <slot name=\"reference\"></slot>\n      <button\
    \ id=\"closeButton\" class=\"button\">Close</button>\n      <button id= \"acceptButton\"\
    \ class=\"button\">Accept</button>\n    </div>;\n  }\n}\n```\n\n由于组件定义引用了 `cookie-alert.css`\
    \ 文件，请创建该文件并将常规 CSS 代码放入其中：\n\n```\n.container {\n  color: rgb(255, 255, 255);\n\
    \  background-color: rgb(35, 122, 252);\n  padding: 1em 1.8em;\n  width: 100%;\n\
    \  font-family: Helvetica,Calibri,Arial,sans-serif;\n}\n\n.footer {\n  position:fixed;\n\
    \  left:0px;\n  bottom:0px;\n}\n\n.button {\n  color: rgb(255, 255, 255);\n  background-color:\
    \ transparent;\n  border-color: rgb(255, 255, 255);\n  padding: 5px 40px;\n  margin-right:\
    \ 50px;\n  cursor: pointer;\n  float:right;\n}\n```\n\n通过这些更改，你已经准备好了 cookie 警告组件的基本结构。\n\
    \n# 属性和特性\n\n要向 cookie 警告组件添加 `message` 属性，让我们修改之前的代码如下：\n\n```\nimport { Component,\
    \ Prop, h } from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n  styleUrl:\
    \ 'cookie-alert.css',\n  shadow: true\n})\nexport class CookieAlert {\n  @Prop()\n\
    \  message: string = \"This website uses cookies to ensure you get the best experience\"\
    ;\n\n  render() {\n    return <div class=\"container footer\">\n      <slot name=\"\
    message\">{this.message}</slot>&nbsp;\n      <slot name=\"reference\"></slot>\n\
    \      <button id=\"closeButton\" class=\"button\">Close</button>\n      <button\
    \ id= \"acceptButton\" class=\"button\">Accept</button>\n    </div>;\n  }\n}\n\
    ```\n\n我们为 `message` 属性使用了 `@Prop` 装饰器并对其进行了初始化。然后通过 `this.message` 表达式在 JSX 标记中使用了该属性。\n\
    \n**使用** `@Prop` **装饰器定义的属性默认情况下是不可变的。这意味着它的值无法从组件逻辑内部更新。如果你想覆盖此行为，需要为该装饰器设置 mutable\
    \ 选项** `(@Prop({mutable: true})).`\n\n到目前为止创建的 `message` 属性与同名的特性相关联。但是，对属性的更改不会映射到特性。如果你需要这种行为，需要启用反射，如下代码所示：\n\
    \n`@Prop({reflect: true}) message: string = \"This website uses cookies to ensure\
    \ you get the best experience\";`\n\n这样，对属性的更改将与相应的特性同步。\n\n# 事件\n\n让我们开始了解如何通过处理关闭按钮上的点击事件来管理和生成事件。这是所需的代码：\n\
