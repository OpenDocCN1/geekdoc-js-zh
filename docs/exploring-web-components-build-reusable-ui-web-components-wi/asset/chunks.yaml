    composition by using <slot> elements. Slots allow us to define placeholders where
    the users can add customized markup in a really easy way.


    With the feature you learned in this chapter, you will be able to build flexible,
    efficient, and maintainable UIs for your web component, almost without writing
    any JavaScript line.


    In the next chapter, we will discuss how to package the web components we build
    to be easily imported and used by other developers. You will learn the different
    ways to achieve this goal and its benefits and drawbacks.


    # [Questions](#toc.xhtml_s100a)


    1.  Where can you add an `<template>` element within the markup of an HTML page?


    2.  Can you include an element like `<li>` in the markup of a template without
    any of its parents `<ol> or <ul>?`


    3.  What is the difference between using a template and using a string to define
    the markup of the UI?


    4.  What does it mean that the DOM resulting from a template is inert?


    5.  How can you activate a template?


    6.  Why using a template is more efficient than building the UI via the DOM APIs?


    7.  What is a slot?


    8.  What is the difference between a named slot and an unnamed slot?


    9.  How many unnamed slots can you insert in a template?


    10.  What is the default slot?


    # [CHAPTER 8](#toc.xhtml_c08)


    # [Distributing and Extending Web Components](#toc.xhtml_c08)


    In the previous chapters, we learned how to build our Web Components and discovered
    which are the more appropriate approaches to apply in various development scenarios.
    The components we build, however, are meant to be used in one or more Web applications
    or websites by ourselves or by other developers. This leads us to figure out how
    we can provide our components so that they are easily added to other projects.


    To satisfy this requirement, in this chapter, we are going to explore a few ways
    to share our components so that developers can include them in their projects.
    We will discuss a script-based strategy and a package-based one. As usual, we
    will take the cookie alert component we developed throughout the previous chapters
    as a component example to share with both strategies.


    In addition, we will introduce how to create a new Web Component by extending
    an existing one. This approach allows us to leverage the power of Web Components
    technologies to get a personalized version of existing components, in a similar
    way we can do with native HTML elements.


    # [Structure](#toc.xhtml_s101a)


    *   Distribution srategies


    *   Extending components


    # [Objectives](#toc.xhtml_s102a)


    This chapter will explain to you how to create modules containing the definition
    of your Web Components and how to use these modules to distribute your components.
    You will learn how to distribute them as scripts and as packages. You also will
    learn how to use an existing component to create a new one by leveraging inheritance.


    # [Distribution strategies](#toc.xhtml_s103a)


    Throughout the book, we used the Web Components Builder project to test the Web
    Component we were building. That project is just a development environment, and
    it is useful when we are writing our component and want to see it in an HTML page
    for evaluation and test purposes.


    Once you are satisfied with your component, you would use it in your Web applications
    or distribute it to other developers. How can you make your brand new Web Component
    available to other projects and developers?


    In this section, we will discuss the various strategies you can use to distribute
    your Web Components, and for each of these strategies, we will analyze benefits
    and drawbacks. Of course, we will still use our cookie alert component as the
    component to distribute.


    # [The script-based strategy](#toc.xhtml_s104a)


    The first strategy we can use to distribute our cookie alert component is by providing
    it as a script. This means you have to provide a file with the relevant JavaScript
    code that implements the component so that the potential user can include it in
    their project via the `<script>` tag.


    Let''s take a look at the options we have in distributing our component with this
    strategy and discuss the pros and cons of this approach.


    # [Without building step](#toc.xhtml_s105a)


    The simplest way to distribute your Web Component as a script is by providing
    the source code without any building step. To apply this approach to our cookie
    alert component, you should simply distribute the `index.js` file under the `src`
    folder in the Web Components Builder project. Maybe, to make it easier to recognize,
    you should rename the `index.js` file into cookie-`alert.js,` for example. This
    way, you can distribute it by allowing users to download it or by making it available
    via a CDN.


    **A Content Delivery Network (CDN), is a distributed network of servers that provide
    content such as images, scripts, text, or other static resources. The main goal
    of a CDN is to reduce the workload of websites and application servers and possibly
    maximize the caching of shared resources.**


    Once the user gets the script or the URL to the script hosted in a CDN, they simply
    have to include that script in their HTML page. For example, the following HTML
    describes a page that includes the `cookie-alert.js` script and uses the Web Component
    in its body:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Using the Alert Cookie component</title>`


    `<script src="./alert-cookie.js"></script>`


    `</head>`


    `<body>`


    `<h1>Using the Alert Cookie component</h1>`


    `<cookie-alert message="We use cookies, but respect your privacy!">`


    `</cookie-alert>`


    `</body>`


    `</html>`


    As expected, with this approach, you can use the `<cookie-alert>` tag within your
    HTML markup.


    # [With building step](#toc.xhtml_s106a)'
