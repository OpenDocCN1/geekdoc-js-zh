  trans: "\n\n在接下来的章节中，我们将快速了解如何使用 `React`、`Angular` 和 `Vue` 创建 Web 组件。我们提供的示例非常简单，并非详尽无遗，但足以让你了解使用这些框架构建\
    \ Web 组件的基本思路。\n\n# 使用 React 构建 Web 组件\n\n使用 React 创建 Web 组件，只需将 React 组件封装在一个继承自\
    \ `HTMLElement` 的标准类中，并注册相应的标签名即可。下面我们来看如何为一个基本的 React 组件定义封装器，例如：\n\n```\nimport\
    \ React from 'react';\n\nfunction MyComponent() {\n  return (\n    <div>I am the\
    \ component!</div>\n  );\n}\n\nexport default MyComponent;\n```\n\n这段代码定义了一个简单的\
    \ React 组件——它只显示一个包含文本的 `<div>`。\n\n你可以按如下方式将该组件封装在 Web 组件定义中：\n\n```\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\nimport MyComponent from\
    \ './MyComponent';\n\nclass MyComponentWC extends HTMLElement {\n  connectedCallback()\
    \ {\n    this.mountReactComponent();\n  }\n\n  disconnectedCallback() {\n    ReactDOM.unmountComponentAtNode(this.mountPoint);\n\
    \  }\n\n  mountReactComponent() {\n    if (!this.mountPoint) {\n      this.mountPoint\
    \ = document.createElement('div');\n      this.attachShadow({ mode: 'open' }).appendChild(this.mountPoint);\n\
    \    }\n    ReactDOM.render(<MyComponent />, this.mountPoint);\n  }\n}\n\nwindow.customElements.define('my-component',\
    \ MyComponentWC);\n```\n\n如你所见，这是自定义元素 `MyComponentWC` 的标准定义。其中包含了继承 `HTMLElement`\
    \ 类的类定义，以及 `my-component` 标签名的注册。\n\n有趣的部分发生在类定义中。你可以看到 `connectedCallback()`\
    \ 反应调用了 `mountReactComponent()` 方法。该方法负责将 `MyComponent` React 组件挂载到 DOM 中。如果挂载点不存在，它会创建一个\
    \ `<div>` 作为挂载点，并将影子 DOM 附加到该 `<div>` 上。然后，它会在挂载点渲染 React 组件。\n\n`disconnectedCallback()`\
    \ 反应会将 React 组件从挂载点卸载。\n\n# 使用 Angular 构建 Web 组件\n\n要使用 Angular 创建 Web 组件，你可以利用\
    \ Angular Elements 模块，稍后你将看到这一点。假设你在 `src/app/my-component/my-component.component.ts`\
    \ 文件中实现了以下 Angular 组件：\n\n```\nimport { Component, OnInit } from '@angular/core';\n\
    \n@Component({\n  selector: 'app-my-webcomponent',\n  templateUrl: './my-webcomponent.component.html',\n\
    \  styleUrls: ['./my-webcomponent.component.css']\n})\nexport class MyWebcomponentComponent\
    \ implements OnInit {\n  constructor() { }\n\n  ngOnInit() {\n  }\n}\n```\n\n\
    你需要通过运行以下命令将 Angular Elements 包添加到项目中：\n\n```\nng add @angular/elements\n```\n\
    \n然后，将 `app.module.ts` 中的代码修改如下：\n\n```\nimport { BrowserModule } from '@angular/platform-browser';\n\
    import { NgModule, Injector } from '@angular/core';\nimport { createCustomElement\
    \ } from '@angular/elements';\nimport { MyComponentComponent } from './my-component/my-component.component';\n\
    \n@NgModule({\n  declarations: [\n    MyComponentComponent\n  ],\n  imports: [\n\
    \    BrowserModule\n  ],\n  providers: [],\n  entryComponents: [MyComponentComponent]\n\
    })\nexport class AppModule {\n  constructor(injector: Injector) {\n    const el\
    \ = createCustomElement(MyComponentComponent, { injector });\n    customElements.define('my-component',\
    \ el);\n  }\n\n  ngDoBootstrap() {}\n}\n```\n\n你从 Angular Elements 模块导入了 `createCustomElement()`\
    \ 函数，并导入了上面展示的 Angular 组件。然后，你将 `MyComponentComponent` 声明为项目的入口组件，并为 `AppModule`\
    \ 类定义了构造函数。构造函数的主体从 Angular 组件创建了一个自定义元素，并像往常一样注册了 `my-component` 标签名。\n\n最后，启动应用程序的手动引导。这一步是启动\
    \ Angular 渲染过程所必需的。\n\n# 使用 Vue 构建 Web 组件\n\n使用 Vue 创建 Web 组件的过程相当直接。与 Angular\
    \ 类似，Vue 提供了一个模块，简化了将 Vue 组件封装到自定义元素中的任务。假设你在 `src/components/MyComponent.vue`\
    \ 文件中实现了一个非常简单的 Vue 组件，如下所示：\n\n```\n<template>\n  <div>\n    I am the component\n\
    \  </div>\n</template>\n```\n\n这是一个非常简单的组件，但足以满足我们的目的。将 Vue 项目的 `main.js` 文件修改如下：\n\
    \n```\nimport Vue from 'vue'\nimport wrap from '@vue/web-component-wrapper';\n\
    import MyComponent from './components/MyComponent.vue';\n\nconst CustomElement\
    \ = wrap(Vue, MyComponent);\nwindow.customElements.define('my-component', CustomElement);\n\
    ```\n\n除了 `MyComponent` 组件外，这段代码还从 `web-component-wrapper` 模块导入了 `wrap()` 函数。它应用这个\
    \ `wrap()` 函数从 Vue 组件获取一个自定义元素，并注册相应的 `my-component` 标签名。\n\n# 结论\n\n在本章中，你了解了如何将我们在本书中构建的\
    \ Cookie 提醒组件，应用到使用 `React`、`Angular` 和 `Vue` 创建的应用中。你发现，在使用 JavaScript UI 框架构建的应用中使用\
    \ Web 组件，就像使用标准 HTML 元素一样简单。不过，你可能需要做一些调整，以便更好地将组件与框架的内部行为集成。\n\n你还探索了如何通过封装基于这些框架的组件来创建\
    \ Web 组件。你了解到，即使这是可行的，你也应该仔细评估是否值得这样做。\n\n本章展示的示例应该能为你提供足够的指导，帮助你集成 Web 组件与使用最流行的\
    \ UI 框架构建的应用。\n\n在下一章中，我们将概述最流行的库和工具，它们能帮助你开发 Web 组件。\n\n# 问题\n\n1.  Web 组件的互操作性是什么意思？\n\
    \n2.  如何在 React 应用中通过编程方式访问 Web 组件？\n\n3.  如何在 React 中处理 Web 组件的事件？\n\n4.  为什么在使用\
    \ Web 组件的 Angular 应用中需要 `CUSTOM_ELEMENTS_SCHEMA` 模块？\n\n5.  如何在 Angular 中配置 `TypeScript`\
    \ 编译器以支持基于 JavaScript 的 Web 组件？\n\n6.  如何避免 Vue 在遇到 Web 组件的标签名时抛出错误？\n\n7.  为什么你想要使用\
    \ JavaScript UI 框架创建 Web 组件？\n\n8.  使用 JavaScript UI 框架构建 Web 组件可能会带来哪些缺点？\n\n\
    # 第 10 章\n\n# Web 组件开发工具\n\n在 Web 组件构建之旅的这个阶段，你应该能够创建自己的 Web 组件，并在你的应用中使用它，无论使用哪种\
    \ UI 库。你已经掌握了 Web 组件背后的标准技术：自定义元素、影子 DOM 和模板。\n\n然而，你可能已经注意到，使用这些技术构建组件的某些步骤可能繁琐、重复或复杂。换句话说，创建\
    \ Web 组件的过程还有优化的空间。如果你想简化构建 Web 组件的过程，可以自己动手，也可以使用第三方工具。第一种情况可能具有挑战性，需要深入了解 JavaScript\
    \ 和 DOM。第二种情况可以让你以更简单的方式创建组件，但需要你学习一种基于标准技术的新抽象。\n\n"
- fmt: '

    In this chapter, we will explore a few of the most common tools that can improve
    your development experience and speed up your productivity. You will get a general
    but practical overview of using `LitElement` from the Polymer project, Hybrids,
    Slim, and Stencil.


    # [Structure](#toc.xhtml_s128a)


    *   Simplifying Web Components Building

    *   Polymer and LitElement

    *   Hybrids

    *   Slim

    *   Stencil


    # [Objectives](#toc.xhtml_s129a)


    This chapter gives you an overview of libraries and tools that help you in building
    Web Component in an easier way. They let you focus on the result you want to get
    while leaving the internal details to the tool.


    You will learn how to use the basic features of each tool so that you can choose
    which better fits your needs and your expectations.


    # [Simplifying Web Components building](#toc.xhtml_s130a)


    One of the most common criticisms of using Web Components is the one claiming
    that they are low-level. To correctly use the technologies Web Components rely
    on, you need to have a good command of the DOM and its behavior. Actually, we
    saw how building Web Components requires you to tackle a few challenges. For example,
    the following are some of the low-level tasks you have to perform in order to
    create a robust and DOM-integrated Web Component:


    *   Mapping attributes and properties

    *   Event handling and emitting

    *   Event listener creation and removal

    *   Shadow DOM creation and manipulation

    *   Template definition


    These are just a few features you need to master. Some of these activities require
    deep knowledge of the DOM; others simply require more code.


    You may think of simplifying the component definition on your own. For example,
    you can define your base class by extending the standard `HTMLElement` class.
    This class will deal with Shadow DOM manipulation, the attributes and properties
    mapping, and other common tasks. This way, your components will extend your base
    class instead of the `HTMLElement`, and some of those common tasks will be for
    free.


    This is the approach used by many libraries that aim to simplify the process of
    building Web Components. In the rest of the chapter, we will explore some of the
    most well-known: `LitElement`, Hybrids, Slim, and Stencil. We will not provide
    a deep insight into the libraries, but just a light overview to have a high-level
    outline of the proposed approach. We will use each library to redefine the cookie
    alert component you already built in previous chapters with the native technologies.
    This way, you will have the opportunity to compare the development model proposed
    by each library.


    We will follow a standard approach in using each library in order to introduce
    their features step by step. For each library, we will start introducing the basic
    infrastructure to create a Web Component. Then, we will see how to create the
    template for the UI. After that, we will explore how to manage properties and
    attributes and how to handle and emit events. Finally, we will take a look at
    the component''s lifecycle.


    # [Polymer and LitElement](#toc.xhtml_s131a)


    **Polymer** is the name of a project and a library promoted by Google to bring
    Web Components to life. The project started in 2013, shortly after Web Components
    were announced, but browsers still were not supporting them. The project aimed
    to enable developers to support the Web Components principles. The library with
    the same name was released in various steps and provided many polyfills to support
    the core technologies and visual design. Polymer offered a way to develop Web
    Components when most popular browsers did not support them well.


    In May 2018, the Polymer team announced a few important changes in the development
    of the library. In particular, they announced that the project''s focus would
    be on the `LitElement` library. This library is part of the Polymer and provides
    support to define a Web Component. In other words, the Polymer project recognized
    that the time is ripe for native Web Components support.


    In this section, we will take a look at how to leverage the `LitElement` library
    to simplify the way you can define your Web Component.


    ## [The lit-html library](#toc.xhtml_s132a)


    The birth of LitElement is closely related to the `lit-html` library. This is
    a lightweight and extensible HTML templating library based on the browser''s built-in
    HTML parser and the standard template element. If you know React, you can think
    of it like the JSX parser for Web Components.


    You can use the `lit-html` library independently from `LitElement`. It promotes
    a functional approach in creating HTML templates, allowing you to create templates
    with a compact syntax, as shown in the following example:


    ```

    html`<h1>Welcome ${name}</h1>`

    ```


    As you can see, this expression is nothing but a tagged template literal that
    uses the `html` tag defined by the `lit-html` library. So, it is using a standard
    approach in defining templates based on string interpolation.


    Its strength comes with the possibility to define functions returning `lit-html`
    templates, as in the following example:


    ```

    const helloTemplate = (name) => html`<h1>Welcome ${name}</h1>`;

    ```


    The `helloTemplate()` function evaluates the template literal, but, of course,
    it is not rendered to the DOM. To generate the elements of the template, you have
    to use the `render()` function, as shown below:


    ```

    render(helloTemplate("John"), document.body);

    ```


    The `render()` function takes the template instantiated by the `helloTemplate()`
    function, creates the corresponding HTML elements, and append them to the body
    of the current HTML document.


    All this happens in a very efficient way.


    Of course, this is just a quick overview of the `lit-html` library. It has many
    other interesting features like support of directives and advanced rendering options.


    ## [Using LitElement](#toc.xhtml_s133a)


    The `LitElement` library is heavily based on the `lit-html` library. If you are
    planning to use `LitElement` to build your Web Components, you don''t need to
    use `lit-html` explicitly. It is already included in `LitElement`.


    Assuming you have a Web Component project based on the Node.js development environment,
    the first step to use `LitElement` is to install it by typing the following command
    in a terminal window:


    ```

    npm install lit-element

    ```


    ### [Basic infrastructure](#toc.xhtml_s134a)


    Once you have installed the library, you can implement the basic infrastructure
    of our cookie alert component by writing the following code:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    You import the `LitElement` class along with the HTML and CSS tagged template
    literals from the library. By the way, the HTML tagged template literal is the
    same function of the `lit-html` library. Then, you noticed that here we are extending
    the `LitElement` base class instead of the usual `HTMLElement` class. This class
    offers the support of the library to simplify the component definition, as we
    will see in a moment.


    **The `LitElement` library also supports a decorator-based approach to define
    Web Components. However, since decorators are still not officially a supported
    standard, you need to use a specific transpiler, like TypeScript or Babel opportunely
    configured. In this section, we will not use this approach but will show some
    examples of such syntax along the way.**


    By using the decorator-based syntax, the previous class definition will look like
    the following:


    ```

    import { LitElement, html, css, customElement } from ''lit-element'';


    @customElement("cookie-alert")

    export default class CookieAlert extends LitElement {


    }

    ```


    This syntax eliminates the need for the `customElements.define()` method, since
    the `customElement` decorator accomplishes this task.


    ### [Templates and UI](#toc.xhtml_s135a)

