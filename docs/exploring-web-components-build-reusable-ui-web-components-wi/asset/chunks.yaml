  trans: '


    然而，并非你为 Web 应用或网站设想的 UI 元素总能通过简单扩展原生 HTML 元素来实现。尽管我们说过，在实现自己的 Web Component 时，扩展原生
    HTML 元素应是首选方案，但有些情况下，你需要的 UI 组件与任何原生 HTML 元素都不相似，或是原生元素的组合。这时，你需要实现自己的自主自定义元素。


    # 介绍 cookie 提醒项目


    为了更好地说明哪些情况下你可能需要将 Web Component 实现为自主自定义元素，我们将构建一个具体的自定义 Web Component——一个 cookie
    提醒 Web Component。


    这是你在浏览网页时肯定注意过的组件之一。事实上，几乎所有网站都会显示一个提醒、横幅、弹窗或类似内容，告知你其涉及个人数据的 cookie 管理政策。在某些国家，这是法律要求的，但许多网站提供这些信息只是为了透明。


    也许这些组件大多是通过使用最常见的 UI 库（如 React、Vue 或 Angular）构建的。因此，它们需要根据每个网站所基于的 UI 库重新实现。相反，我们将把这样一个组件构建为
    Web Component，这样无论用于构建其余 Web UI 的 UI 库是什么，它都可以使用。


    如前一章所述，你可以使用 *Web Component Builder* 项目作为模板项目，为 cookie 提醒 Web Component 设置开发环境。因此，在你的机器上克隆并初始化它。


    **请记住，克隆并初始化 Web Component Builder 项目意味着使用 `git clone` 和 `npm install` 命令，如前一章所述。**


    # 一个最小的自主自定义元素


    让我们开始构建我们的 cookie 提醒组件，并在此过程中学习自主自定义元素。因此，假设你已经初始化了 Web Component 项目，打开 `src`
    文件夹中的 `index.js` 文件，并将其内容替换为以下代码：


    ```

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.innerText = "This website uses cookies to ensure you get the best experience";

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    如前一章所述，自主自定义元素是从头开始构建的元素。它不扩展标准的、众所周知的 `HTML 元素`，但无论如何，它是作为一个扩展 `HTMLElement`
    的类来实现的。`HTMLElement` 类是任何 HTML 元素的基类。它赋予你的组件被添加到 DOM 的能力，以及一些我们稍后会发现的更多功能。


    如你所见，`CookieAlert` 类有一个构造函数，它调用了基类的 `super()` 方法。根据规范，这对于使你的自定义元素正常工作非常重要。因此，在实现自主自定义元素时，不要忘记调用它。


    你已经知道 `connectedCallback()` 方法。当该元素的实例被添加到 DOM 时，它会自动被调用。在这种情况下，一个文本将被赋值给元素的 `innerText`
    属性。当然，这还不是我们想要的 cookie 提醒，只是一个非常简单的 Web Component，显示文本“我是 cookie 提醒！”。


    最后一行将我们的组件添加到自定义元素注册表中。与自定义原生元素的情况不同，这里我们不需要指定第三个参数，因为我们没有扩展原生 HTML 元素。这里我们只是告诉注册表，`cookie-alert`
    Web Component 由 `CookieAlert` 类实现。


    下一步是通过更改 `index.html` 页面的内容来使用这个简单的组件。因此，打开项目根文件夹中的 `index.html` 文件，并将其内容替换为以下标记：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert></cookie-alert>

    </body>

    </html>

    ```


    如你所见，与自定义原生元素的情况不同，这里我们使用 `cookie-alert` 标签来指定我们的自主自定义元素。这是两种自定义元素之间的一个显著区别。


    **请记住，我们为自定义原生元素看到的命名规则同样适用于自主自定义元素。**


    如果你在终端窗口中输入 `npm start` 运行项目，然后将浏览器指向 `http://localhost:8080` 地址，你应该会看到类似以下截图的内容：


    ![](img/Figure_3.1.jpg)


    **图 3.1**


    你拥有了一个全新的基础自主自定义元素。


    # 添加 CSS 和标记的基本技术


    到目前为止，你创建的组件让你对如何构建自主自定义元素有了一个非常基本的了解。但当然，这不是我们计划构建的组件。由于自主自定义元素继承自 `HTMLElement`，它在
    UI 方面没有特定的内容。我们需要从头开始创建它的图形外观。在到目前为止构建的组件中，我们只是通过使用 `innerText` 属性显示了一个文本。要构建我们的
    cookie 提醒组件，我们需要更进一步。


    因此，让我们开始更改 `src` 文件夹中 `index.js` 文件的内容，如下代码所示：


    ```

    const styleMarkup = ‘

    <style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    </style>‘;

    const componentMarkup = ‘

    <div class="container footer">

    <span>This website uses cookies to ensure you get the best experience</span>

    </div>‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.innerHTML = styleMarkup + componentMarkup;

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    我们定义了两个常量——`styleMarkup` 和 `componentMarkup`。第一个是一个字符串，包含包裹在 style 元素中的一些 CSS
    规则。第二个是一个字符串，包含一个使用 `styleMarkup` 常量中定义的 CSS 类的 div 元素。这两个字符串被拼接并赋值给我们的 `CookieAlert`
    组件的 `innerHTML` 属性。简单来说，我们通过使用标准 HTML 和 CSS 构建组件的 UI，并将其附加到通用 HTML 元素的 `innerHTML`
    属性上。


    如果你在实现的这个阶段运行项目，你应该会在浏览器中看到以下内容：


    ![](img/Figure_3.2.jpg)


    **图 3.2**


    如你所见，我们的组件开始成形。


    在到目前为止展示的示例中，你使用了字符串来定义 Web Component 的 UI。当然，这只是定义它的一种技术。你几乎可以使用任何可能的技术来构建组件的
    UI。例如，你可以使用 DOM API 而不是字符串来获得相同的结果。


    以下是使用 DOM API 构建组件 UI 的示例：


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.createComponent();

    }

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

