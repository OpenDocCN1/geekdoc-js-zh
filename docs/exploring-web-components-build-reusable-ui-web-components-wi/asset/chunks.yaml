    # Preface


    In recent years, the design of Web user interfaces has evolved more and more until
    it is becoming quite similar to native graphical user interfaces. This evolution
    has been possible mainly to a few popular libraries that spread a composable approach
    to build user interfaces. Among the others, we can mention React and Angular as
    the main influencers of this new way of design Web user interfaces.


    However, despite the innovation, these libraries brought in the Web development,
    they created somewhat isolated worlds. Developers that are using React can share
    and reuse their components just with other React applications. Similarly, Angular
    developers can share and reuse their components only with Angular projects. Of
    course, the same also happens with other UI libraries.


    This sort of isolation is not what the Web is meant to. Quite the opposite, Web
    technologies are meant to be open and interoperable. How can we fix this fragmentation
    created by different approaches in implementing the same high-level design?


    Web Components answer to this question.


    The set of technologies that Web Components rely on allows developers to create
    components that can be used to build Web user interfaces independently of the
    libraries used in a specific project. These technologies are standard and supported
    by most recent browsers, so they can be considered the standard way to create
    reusable and interoperable UI components.


    This book will present to you the technologies behind Web Components and let you
    start using them step by step with a practical approach. In fact, throughout the
    book, you will carry out a full Web Component project that will lead you to understand
    in detail how to use them.


    The 10 chapters of this book will let you explore the following topics:


    **[Chapter 1](#c01.xhtml)** introduces the component-based design approach to
    build user interfaces and the basic concepts behind Web Components.


    **[Chapter 2](#c02.xhtml)** discusses how to extend existing standard HTML elements
    to customize their behavior.


    **[Chapter 3](#c03.xhtml)** describes how to create Custom Elements, that is,
    custom HTML elements built from scratch, without extending the standard ones.


    **[Chapter 4](#c04.xhtml)** explains how to manage the properties and attributes
    of Custom Elements and how to apply the best practices to keep them synced.


    **[Chapter 5](#c05.xhtml)** is focused on enriching your Web Component’s interactivity
    by listening to events and creating your own.


    **[Chapter 6](#c06.xhtml)** shows how to implement encapsulation for Web Components
    by exploiting the Shadow DOM. This feature allows you to include your component
    on any page without worrying about external CSS or JavaScript side effects.


    **[Chapter 7](#c07.xhtml)** discusses how to use HTML templates in order to simplify
    the component’s markup management.


    **[Chapter 8](#c08.xhtml)** describes different strategies on how to distribute
    and import modules containing Web Components. It also shows how to extend them
    to create new components.


    **[Chapter 9](#c09.xhtml)** discusses how Web Components integrate with other
    UI libraries and frameworks. It shows how to integrate them into React, Angular,
    and Vue applications with very little effort. It also shows how to create Web
    Components by writing them in Angular, Vue, and React.


    **[Chapter 10](#c10.xhtml)** describes a few libraries, such as LitElement, Hybrids,
    Slim, and Stencil, that may help developers to build Web Components.


