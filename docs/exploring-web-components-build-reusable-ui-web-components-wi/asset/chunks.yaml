    # 目标


    本章将让你意识到，当 Web 组件嵌入到未知网页中时可能出现的问题。你将能够通过使用影子 DOM 来预防这些问题。此外，你还会了解开放和封闭的影子 DOM，并决定你的组件应该使用哪种类型。


    # Web 组件与 DOM


    正如你目前所见，DOM 操作是创建自定义元素乃至 Web 组件的关键部分。与 DOM 完美集成的能力使得你的 Web 组件几乎与标准 HTML 元素难以区分。然而，这种
    DOM 集成能力对组件来说也带来了一些问题。与 DOM 的紧密集成导致了一些阻碍 Web 组件成为真正组件的问题——即那些拥有自身外观和行为、易于复用的 UI
    元素。


    让我们来看看这种紧密集成可能产生的问题。


    # 全局 DOM


    `DOM` 是页面上 HTML 元素的基于对象的表示。这意味着 HTML 页面中的每个元素都由 DOM 树中的一个对象表示。标准 HTML 元素和自定义元素都是如此。然而，由于自定义元素通常由
    HTML 元素和其他自定义元素构建而成，最终其所有组成项都会出现在 DOM 树中。


    考虑一个包含 cookie 提醒 Web 组件的典型 HTML 页面：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    如果你使用常用浏览器的工具（例如 Chrome 的 `开发者工具`）检查生成的 HTML，你应该会看到如下截图所示的标记：


    ![](img/Figure_6.1.jpg)


    **图 6.1**


    如你所见，我们的自定义标签 `<cookie-alert>` 包含了对应自定义元素 DOM 的标记。其中包括样式元素和包含文本及按钮的 `<div>`（这些是你通过
    JavaScript 添加的）。


    这些元素已集成到页面的 DOM 中，因此它们像页面上的任何其他元素一样工作。例如，你可以通过以下代码访问 cookie 提醒的文本：


    `document.querySelector("div.container span").innerText`


    当然，更合理的做法是使用组件的 `message` 属性来获取文本，如下所示：


    `document.querySelector("cookie-alert").message`


    然而，没有人阻止你访问 Web 组件的内部 DOM 结构。DOM 就像一个全局变量：任何代码都可以访问它并修改其值。就像全局变量一样，它带来了所有缺陷，我们将在下一节中看到。


    # DOM 的问题


    虽然前面的例子可能是使用你组件的开发者的选择，但当你的组件被插入到任意复杂度的页面中时，还可能出现其他陷阱。例如，考虑如下 HTML 页面：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    </style>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    你有一条 CSS 规则，定义了当前页面上 `button` 元素的边框样式和背景颜色。同时，页面中在标题下方有一个按钮元素。运行此页面，你将得到以下结果：


    ![](img/Figure_6.2.jpg)


    **图 6.2**


    如你所见，CSS 规则不仅应用于页面上的按钮，还应用于嵌入在 cookie 提醒组件中的按钮。这可能会令人失望。


    此外，考虑以下标记：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    .container {

    background-color: gray;

    }

    </style>

    </head>

    <body class="container">

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    你添加了一条新的 CSS 规则，定义了一个带有灰色背景的 `container` 类，并将此类应用于文档的 `body`。根据这条规则，你期望页面背景为灰色。然而，HTML
    页面将呈现为如下截图所示：


    ![](img/Figure_6.3.jpg)


    **图 6.3**


    页面背景并非如页面级 CSS 规则所声明的灰色，而是蓝色，正如组件级 CSS 规则所定义的那样。发生的情况是页面级和组件级 CSS 类之间意外的名称冲突。


    当然，用户不应该需要了解我们组件的内部细节。因此，这两个例子可能会让你质疑 Web 组件技术的真正有效性。


    更糟糕的是，假设你向这个 HTML 页面添加了几行 JavaScript，如下所示：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    .container {

    background-color: gray;

    }

    </style>

    <script>

    window.addEventListener("load", ()=>{

    let buttons = document.querySelectorAll("button");

    buttons.forEach((btn)=>{

    btn.disabled = true;

    });

    });

    </script>

    </head>

    <body class="container">

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    你添加了一段脚本，禁用了当前页面上的所有按钮。这可能是为了实现某种管理页面用户元素的特定逻辑。然而，这段代码也影响了 cookie 提醒内部的按钮。


    所有这些例子应该清楚地表明，你的 Web 组件的内部实现并不安全。外部代码可能有意或无意地影响你的组件。换句话说，你的 Web 组件缺乏封装。


    封装是对象隐藏其内部表示和行为的能力。它允许你设计一个对象或组件，使其通过公共接口与外部世界交互，同时保持内部状态的私有性。这一特性使你能够将组件的内部行为与外部世界解耦。它允许你更改内部表示或行为，而不影响公共接口和外部世界。换句话说，封装使你的组件成为一个真正的组件。


    # DOM 封装的尝试


    因此，我们刚刚发现，当前 cookie 提醒组件的实现无法免受外部干扰。由于封装是组件的一项必要特性，我们该如何解决这个恼人的问题呢？


    '
- fmt: '

    **It should be clear that the global accessibility of the DOM is not a problem
    related to Web Components technologies. This is a feature of the standard DOM
    and affects any type of component you build with browser-based technologies, including
    frameworks like Angular, React, Vue, and many more.**


    The traditional solution to get around this encapsulation problem is to embed
    the portion of DOM representing your component in a separate DOM, that is in a
    separate HTML page. This page is then appended to the main page via an `iframe`.
    For example, this is the typical approach used by *Google* to allow developers
    to embed its maps and its videos from *YouTube*.


    To apply this solution to our cookie alert component, we should rearrange the
    component’s code in order to create an `iframe`, make this `iframe` the main container
    of your component, and append any other element inside the DOM of the `iframe`''s
    page. In practice, the `createComponent()` method of your component should be
    similar to the following:


    ```

    createComponent() {

    const iframe = document.createElement("iframe");

    iframe.style.border = 0;

    iframe.style.height = "200px";

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    iframe.contentDocument.body.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    // other code

    iframe.contentDocument.body.appendChild(div);

    this.appendChild(iframe);

    this.updateMessage();

    }

    ```


    Even if this approach may give you an illusion to solve the problem, it still
    has a few `issues`. You need to programmatically control the border thickness
    and height of the `iframe` to provide the illusion that your component is integrated
    with the main page. But your component is not integrated with the page, and you
    have no real control over the height of the `iframe`. Iframes are not very responsive.
    Also, iframes are designed to embed another full document in the current page.
    This leads to more complexity when we want to pass data from the parent document
    to the child document. In other words, we need to add a code layer that passes
    data from the component to the internal document and vice versa. Also, we lose
    all the event handling features we learned in the previous chapter.


    In summary, iframes are not the solution to solve the Web Components encapsulation
    issue.


    # The shadow DOM


    When introduced Web Components, we said that they stem from the combination of
    three technologies - Custom elements, shadow DOM, and HTML templates. As you can
    see, the shadow DOM is one of these enabling technologies. And it is the technology
    that helps us to solve the encapsulation problem we pointed out in the previous
    sections.


    # What is the shadow DOM


    The shadow DOM is a set of standard APIs that allows you to attach a private DOM
    to any HTML element. This private DOM is similar to the page DOM, but its internal
    structure is not affected by the state of the global DOM.


    When you append your component to the DOM, its shadow DOM will be attached to
    global DOM but remains private. The following picture from *Mozilla developer
    network documentation shows graphically* how it happens:


    ![](images/Figure_6.4.jpg)


    **Figure 6.4**


    **[Source](https://developer.mozilla.org/en-US/docs/Web/Web_Components/Using_shadow_DOM)**


    From this picture, you can see that we have specific terminology for the shadow
    DOM. Let’s try to define the more commons terms.


    *   **Shadow DOM**: This is the object model technology and APIs that allow you
    to attach a private DOM to an HTML element.


    *   **Shadow tree**: It is the private tree of nodes associated with an HTML element;
    this tree is not directly accessible from the global DOM


    *   **Light tree**: This is a regular subtree of nodes


    *   **Shadow host**: An HTML element that has a shadow tree associated


    *   **Shadow root**: This is the root node of the shadow tree


    Perhaps these terms may appear a bit confusing, but we are going to see the shadow
    DOM in action, and hopefully, your doubts will go away.


    # Using the shadow DOM


    Let’s see how to add encapsulation to our alert cookie by using the shadow DOM.
    As a first step, you need to enable it in the constructor of the component. Here
    is how the new version of the constructor looks like:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this.attachShadow({mode: "open"});

    this._onAcceptedListener = null;

    }

    ```


    You added a new statement that attaches an instance of the shadow DOM to the current
    component. Regarding the definition given above, the component itself, identified
    by `this` keyword, is the shadow host. The `attachShadow()` method creates an
    instance of a shadow tree composed by just its root node, the shadow root. This
    shadow root is accessible through the `shadowRoot` property of the component.
    From now on, any action regarding the construction of the component’s UI will
    involve the `shadowRoot` property instead of the component itself.


    Consider this new version of the `createComponent()` method:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this.shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    As you can see, while so far, we appended HTML elements to the component directly
    through `this` key, now these elements have to be attached to the `shadowRoot`
    property.


    We also need to rearrange any reference to the elements that before were attached
    to the component. For example, we need to apply this change to the `updateMessage()`
    method:


    ```

    updateMessage() {

    this.shadowRoot.querySelector("span").innerText = this._message;

    }

    ```


    These small changes enable the encapsulation in our cookie alert component. If
    you run the project, the resulting page appears as expected, like in the following
    screenshot:


    ![](images/Figure_6.5.jpg)


    **Figure 6.5**


    Now, the internal structure of the cookie alert component is protected from external
    interferences. If you take a look at the generated markup with the inspector of
    your browser, you will find something like the following:


    ![](images/Figure_6.6.jpg)


    **Figure 6.6**


    You see that there is still the markup corresponding to the component’s UI, but
    it is encapsulated within a #`shadow-root` directive. This directive flags the
    contained markup as not directly accessible.


    # Open and closed shadow DOM


    We are saying that, with the shadow DOM, the internal structure of a web component
    is not directly accessible. This means that the internal structure of a web component
    is protected from possible external interferences caused by CSS rules or JavaScript
    code manipulating generic HTML elements.

