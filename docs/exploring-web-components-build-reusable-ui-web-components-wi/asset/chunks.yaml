    *   The area below the navigation area is meant to invite users to donate


    *   The area containing links to the latest news


    *   The area to sign up


    *   The areas to specific missions


    If you consider these areas, you may realize that they are a sort of self-contained
    unit. You could move the items on the page and rearrange the page with a new layout.
    You can also reuse each of them on another page, and maybe any of them can be
    reused on another website as well.


    This is one of the powers of components: having their own identity that allows
    you to consider them as a unit.


    # [3\. Composing components](#toc.xhtml_s6a)


    The ability to be a unit with a specific role is not the only characteristic of
    a component. A component is the building block of a more complex entity, but the
    resulting entity may be a component itself. If you think a bit of it, you may
    realize that after all, the whole web page is a component itself - it is part
    of the website or web application and has a specific role in that context.


    So, more in general, we can say that a component may contain other components
    or, equally, it may be composed of other components. Consider, for example, the
    component shown in the following screenshot:


    ![](images/Fig_1.3.jpg)


    **Figure 1.3**


    You may consider it a self-contained component with the role of gathering the
    user data and allow them to sign up. Or you may consider it as a component built
    on the aggregation of other components, as shown in the following screenshot:


    ![](images/Fig_1.4.jpg)


    **Figure 1.4**


    Each bordered item in the preceding screenshot has a specific role - one displays
    the title; one gets the user’s first name, and so on. So, each item can be considered
    a component, and altogether they build a new component.


    It’s up to you and your convenience to decompose a component accurately in subcomponents
    and build your UI as a combination of components. In the example above, you could
    reuse the textboxes in another form, so you have a concrete convenience to consider
    them as components.


    What usually happens is that a UI is a combination of multiple components, almost
    always organized in a hierarchy. This hierarchy of components is often called
    a **component tree**.


    # [4\. Mapping components to HTML](#toc.xhtml_s7a)


    The UI decomposition carried out in the previous section is quite generic. It
    applies to any kind of UI. But let’s restrict to web UI implementation:


    *   How much would you like to map each detected component to a corresponding
    HTML element directly?


    *   How much would you like to define the home page shown in the previous section
    with a much more descriptive HTML markup?


    Take a look at the following markup:


    `<!DOCTYPE html>`


    `<html lang=”en”>`


    `<head>`


    `<meta charset=”utf-8”>`


    `<!-- Style, script and other head stuff -->`


    `</head>`


    `<body>`


    `<account-management-bar></account-management-bar>`


    `<navigation-bar></navigation-bar>`


    `<front-cover></front-cover>`


    `<news-area></news-area>`


    `<sign-up-form></sign-up-form>`


    `<mission-tile mission-id=”123”></mission-tile>`


    `<mission-tile mission-id=”321”></mission-tile>`


    `</body>`


    `</html>`


    As you can see, the markup above is, actually, a direct mapping between the components
    we detected in the previous sections and a set of hypothetical HTML elements.
    This would be the concrete realization of the Semantic HTML, that is the idea
    that all your HTML markup should represent the meaning of your content, not its
    appearance.


    What usually happens to see, in the best case, is a markup similar to the following:


    `<!DOCTYPE html>`


    `<html lang=”en”>`


    `<head>`


    `<meta charset=”utf-8”>`


    `<!-- Style, script and other head stuff -->`


    `</head>`


    `<body>`


    `<div class=”account-management-bar”>`


    `<div id=”…”>…</div>`


    `</div>`


    `<div class=”navigation-bar”>…</div>`


    `<div class=”front-cover”>…</div>`


    `<div class=”news-area”>`


    `<ul>…</ul>`


    `…`


    `</div>`


    `<div class=”sign-up-form”><form>…</form></div>`


    `<div>`


    `<div class=”mission-tile”>…</div>`


    `<div class=”mission-tile”></div>`


    `</div>`


    `</body>`


    `</html>`


    Here there, the markup doesn’t express the meaning of each element. You may infer
    it from the CSS classes, but the whole markup is too verbose and not so readable.


    On the other hand, if you could use a markup so concise and clean like the one
    we imagined above, your web UI was very readable, maintainable, and reusable.
    In a word, it would be effective.


    This is something that web developers have been looking for in several ways. Year
    after year, adding new elements like `<blockquote>, <nav>, <video>`, and similar
    to the HTML standard, we have more and more possibilities to express our markup
    with a semantic approach. However, this approach is too slow and proposes generic
    elements. It cannot effectively respond to the specific needs of every single
    developer.


    As you will see in the next section, you can build your semantic elements simply
    using the web platform standard technologies.


    # [What are Web Components?](#toc.xhtml_s8a)


    Decomposing a Web UI, as shown in the previous section, seems quite natural and
    desirable. It is an effective approach that allows you to create, at the same
    time, well-structured UIs and reusable UI elements. Also, since a component is
    a generic concept, and you can create a new component by combining other components,
    you can consider a component, even your whole application.


    For years, developers have been looking for a way to autonomously extend the possibilities
    offered by HTML to create advanced UI elements. The result of their efforts has
    been libraries like *jQuery UI, React, Angular, Vue,* and similar. All these libraries
    provide ways to create UI elements following the component model.


    Many of these libraries are very popular, and each one proposes their approach
    to create UI components, and each one somehow tries to map UI elements to markup.
    Anyway, they have a few drawbacks:


    *   They are not standard


    *   They are not natively supported by the browsers


    *   They are not interoperable


    In other words, the UI component created with these libraries can be used only
    in projects supporting the same library. You cannot create a component with React
    and use it within an Angular application. If you want to create a UI element that
    can be used in a React application and an Angular application, you need to implement
    two versions of the element.


    Web Components try to overcome these drawbacks by allowing you to create UI elements
    by using standard technologies natively supported by the browsers.


    Web Components are a set of standard specifications for creating custom HTML elements
    that can be reused in web pages and applications. The first mention of the principles
    of this technology dates back to *2011*, during the session of *Alex Russell at
    the Fronteers conference in Amsterdam*. His proposal has been taken into account
    by the W3C that published the first *Working Draft in 2012*. Since then, the standardization
    process has introduced several variations to the original idea, so that we got
    two different versions of the specifications over time, identified with *v0* and
    *v1*. Currently, Web Components are no longer based on separate specifications
    but refer to the standards of HTML and **Document Object Model (DOM),** which
    they are now an integral part of.


    Web Components lay on three standard features of web technologies:


    *   **Custom elements:** They represent a set of JavaScript APIs for creating
    custom DOM elements associated with a specific HTML tag.'
