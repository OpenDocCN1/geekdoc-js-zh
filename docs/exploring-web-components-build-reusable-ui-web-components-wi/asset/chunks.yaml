    # 自定义元素


    当我们在第一章介绍 Web Components 时，提到它们依赖于三项技术：自定义元素、Shadow DOM 和 HTML 模板。自定义元素技术是我们将要探索的第一项，或许在创建自己的
    Web Component 时，它也是最显而易见的一项。


    实际上，自定义元素允许你定义自己的 HTML 元素，并使它们在你的 HTML 页面或 Web 应用程序中可用。自定义元素在 HTML 页面的标记中像任何标准
    HTML 元素一样通过标签来标识。此外，它们也可以像任何标准 HTML 元素一样通过 JavaScript 访问。


    你可以创建两种类型的自定义元素：


    *   自定义原生元素


    *   自主自定义元素


    自定义原生元素是基于现有标准元素构建的自定义元素。基本上，它们扩展了标准 HTML 元素（如 `<img>`、`<button>`、`<input>` 等）的功能。


    自主自定义元素是从头开始构建的自定义元素。它们不扩展标准 HTML 元素，因此其行为完全由你的代码决定。


    在本章中，我们将探讨自定义原生元素。这意味着我们将通过扩展现有的标准 HTML 元素来开始创建自定义元素。


    # 扩展原生元素


    像往常一样，在本书中，我们将通过实际构建来学习如何创建自定义原生元素。因此，我们将介绍创建自定义原生元素所需的概念和语法，通过构建一个新的 Web Component
    来实现。我们要创建的组件是一个安全链接；即当链接指向的 URL 不安全（即未使用 HTTPS）时，会警告用户。因此，我们的组件本质上是一个标准的 `<a>`
    HTML 元素，并增加了这一功能。


    为了实现这一目标，创建一个名为 `secureLink.js` 的文件，并将以下代码放入其中：


    ```

    class SecureLink extends HTMLAnchorElement {

    connectedCallback() {

    this.addEventListener("click", (e) => {

    if (!this.href.startsWith("https")) {

    if (!confirm("您即将导航到一个不安全的网站。是否继续？")) {

    e.preventDefault();

    }

    }

    })

    }

    }

    customElements.define("secure-link", SecureLink, {extends: "a"});

    ```


    这段简单的代码定义了我们想要的自定义元素。让我们分析一下代码，了解它是如何工作的。


    首先注意到的是，我们定义了一个名为 `SecureLink` 的 JavaScript 类，它继承自 `HTMLAnchorElement`。`HTMLAnchorElement`
    是表示 `<a>` HTML 元素的内置 DOM 类，因此我们继承了它附带的所有功能。


    该类定义了 `connectedCallback()` 方法。当该元素的实例被插入到 DOM 中时，此方法会自动调用。它是一组回调函数（也称为自定义元素反应）的一部分，这些回调会在组件生命周期的特定阶段自动调用。我们将在下一章中详细讨论它们。目前，我们只需要知道
    `connectedCallback()` 方法会在我们的 Web Component 被添加到当前 HTML 页面的 DOM 之后被调用。


    `connectedCallback()` 方法体中的代码非常简单：它为 click 事件添加了一个事件处理程序。该处理程序检查与元素关联的 URL 是否不以
    `https` 字符串开头。如果是这种情况，则会向用户显示一个警告，如果用户确认，则导航停止。


    你在 JavaScript 文件中看到的最后一条语句如下：


    `customElements.define("secure-link", SecureLink, {extends: "a"});`


    这条语句起着至关重要的作用。它将 `SecureLink` 类添加到当前浏览器窗口的自定义元素注册表中。`customElements` 集合的 `define()`
    方法执行此注册，它接受以下参数：


    *   **自定义元素的名称**：这是一个字符串，定义了在 HTML 标记中标识我们元素的名称。在我们的例子中，新元素将与 `secure-link` 名称关联。


    *   **实现自定义元素的类**：在我们的例子中，我们直接传递了 `SecureLink` 类。


    *   **选项**：一个可选对象，定义了元素的定义方式。目前仅支持 `extends` 选项：它指定要扩展的内置元素的名称。


    **请确保不要忘记注册你的 Web Component。仅定义类不足以创建你的组件。**


    如你所见，注册我们的 Web Component 非常简单。但你可能想知道为什么我们需要通过传递 `{extends: "a"}` 对象来指定我们正在扩展
    `<a>` 元素。毕竟，我们刚刚通过扩展内置的 `HTMLAnchorElement` 类定义了 `SecureLink` 类。


    这种要求的原因在于，许多 HTML 元素共享相同的基类。例如，`<h1>` 和 `<h2>` 元素都扩展了 `HTMLHeadingElement` 类，因此定义一个扩展此类的自定义元素不足以确定你实际想要扩展哪个
    HTML 元素。


    另一方面，当你想要通过扩展原生元素来创建自己的自定义元素时，你需要知道要扩展的基类是什么。以下是常见 HTML 元素及其基类的列表：


    | **元素** | **基类** |

    | --- | --- |

    | `<a>` | `HTMLAnchorElement` |

    | `<audio>` | `HTMLAudioElement` |

    | `<b>` | `HTMLElement` |

    | `<blockquote>` | `HTMLQuoteElement` |

    | `<body>` | `HTMLBodyElement` |

    | `<br>` | `HTMLBRElement` |

    | `<button>` | `HTMLButtonElement` |

    | `<canvas>` | `HTMLCanvasElement` |

    | `<div>` | `HTMLDivElement` |

    | `<em>` | `HTMLElement` |

    | `<form>` | `HTMLFormElement` |

    | `<h1>, <h2>, <h3>,…` | `HTMLHeadingElement` |

    | `<head>` | `HTMLHeadElement` |

    | `<html>` | `HTMLHtmlElement` |

    | `<i>` | `HTMLElement` |

    | `<img>` | `HTMLImageElement` |

    | `<input>` | `HTMLInputElement` |

    | `<label>` | `HTMLLabelElement` |

    | `<li>` | `HTMLLIElement` |

    | `<ol>` | `HTMLOListElement` |

    | `<p>` | `HTMLParagraphElement` |

    | `<select>` | `HTMLSelectElement` |

    | `<span>` | `HTMLSpanElement` |

    | `<table>` | `HTMLTableElement` |

    | `<td>` | `HTMLTableCellElement` |

    | `<textarea>` | `HTMLTextAreaElement` |

    | `<tr>` | `HTMLTableRowElement` |

    | `<ul>` | `HTMLUListElement` |

    | `<video>` | `HTMLVideoElement` |


    **表 2.1**


    完整列表请参考以下地址的官方文档：**[`html.spec.whatwg.org/multipage/indices.html#element-interfaces`](https://html.spec.whatwg.org/multipage/indices.html#element-interfaces)**。


    # Web Components 命名规则


    在了解如何使用我们刚刚定义的 Web Component 之前，我们先花点时间讨论一下如何命名你的元素。


    **请注意，自定义元素的名称并不是实现它的类的名称。**


    类名标识自定义元素的实现，而自定义元素的名称是你传递给 `customElements.define()` 方法的字符串。它在 HTML 标记中标识你的自定义元素。


