    \ HTMLElement;\n\n  render() {\n    return <div class=\"container footer\">\n\
    \      <slot name=\"message\">{this.message}</slot>&nbsp;\n      <slot name=\"\
    reference\"></slot>\n      <button id=\"closeButton\"\n        class=\"button\"\
    \n        onClick={()=> this.element.style.visibility = \"hidden\"}>\n       \
    \ Close\n      </button>\n      <button id= \"acceptButton\" class=\"button\"\
    >Accept</button>\n    </div>;\n  }\n}\n```\n\nYou handle the click event by adding\
    \ the `onClick` attribute to the button element and by assigning an arrow function\
    \ to it.\n\nAs you can see, the code of the click listener shows an interesting\
    \ case. To change the CSS visibility property, you need to access the component\
    \ host element. For this purpose, you use the `@Element` decorator to define the\
    \ `element` property. This property will enable you to access the component host\
    \ element from within the component class.\n\nTo handle the click event on the\
    \ acceptance button, we can change the above code as follows:\n\n```\nimport {\
    \ Component, Element, Prop, Event, EventEmitter, h } from '@stencil/core';\n\n\
    @Component({\n  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow:\
    \ true\n})\nexport class CookieAlert {\n  @Prop() message: string = \"This website\
    \ uses cookies to ensure you get the best experience\";\n  @Element() element:\
    \ HTMLElement;\n  @Event() accepted: EventEmitter;\n\n  render() {\n    return\
    \ <div class=\"container footer\">\n      <slot name=\"message\">{this.message}</slot>&nbsp;\n\
    \      <slot name=\"reference\"></slot>\n      <button id=\"closeButton\"\n```\n"
