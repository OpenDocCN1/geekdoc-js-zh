    In this chapter, we will analyze the techniques we used so far to implement the
    UI for Web Components and will explore a new alternative approach based on native
    HTML templates. We will discuss the benefits this approach brings us and will
    show how to apply it to the alert cookie component.


    Also, we will go further to discover a way to enable Web Components to combine
    the markup of its UI with an arbitrary markup provided by the user. This approach,
    based on the `<slot>` element, extends the power of native HTML templates. This
    way, we can have richer, flexible, and powerful components with a behavior pretty
    similar to standard HTML elements like `<div>`, `<p>`, `<select>`, or other that
    allows you to insert markup within their tags.


    As usual, we will apply all these new concepts to our cookie alert component to
    show how to use them in practice.


    # [Structure](#toc.xhtml_s88a)


    *   Introducing templates

    *   Composing markup with slots


    # [Objectives](#toc.xhtml_s89a)


    In this chapter, you will learn about native HTML templates and will discover
    how to use them to define declarative and efficient UIs for your web components.
    Also, you will learn how to enable your web components to combine their UI markup
    with customized markup provided by the user.


    # [Introducing templates](#toc.xhtml_s90a)


    In *[Chapter 3, Creating Custom Web Components](#c03.xhtml),* we started to build
    the user interface of our cookie alert component through strings representing
    the required markup. We recall here the two constant we defined at that time:


    ```javascript

    const styleMarkup = ''

    <style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    </style>'';


    const componentMarkup = ''

    <div class="container footer">

    <span>This website uses cookies to ensure you get the best experience</span>

    </div>'';

    ```


    These constants were concatenated and assigned to the `innerHTML` property of
    the component. This approach was simple and clear since it provided in a declarative
    way the UI structure through its markup. However, it wasn''t so easy to manage
    when the UI became more complex. So, we switched to a DOM-based approach, where
    each element of the UI is dynamically created through the DOM APIs. In practices,
    we kept the string-based approach for the `styleRules` constant and introduced
    the `createComponent()` method to build the HTML elements for the UI, as shown
    in the following code:


    ```javascript

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this.shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    This new approach offers a more flexible way to create the component''s UI, especially
    when the HTML elements you have to create depend on external parameters. However,
    with this programmatic approach, we lose the clarity of the string-based one.
    Building the UI via DOM APIs is powerful, but may not be handy in many situations.
    Also, it''s not so easy to write and maintain.


    # [What is a template?](#toc.xhtml_s91a)


    An alternative way to define the UI of your web component is by using a template.


    Creating HTML templates is a very common task in the context of web programming.
    It happens both on the server and on the client-side. As you know, an HTML template
    is a prepared HTML markup that allows you to insert custom snippets into specific
    points. To an extent, we were defining a template when using the constant strings
    containing the UI markup, but we will learn that the string-based approach has
    some pitfalls.


    The HTML standard provides you with the `<template>` element. This element allows
    you to declare a template, which is a structure of HTML elements. You can do it
    by simply adding the markup inside the `<template>` element and appending it to
    the head or the body of your HTML page, at your convenience. Take a look at the
    following example:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <template id="myTemplate">

    <div>

    <img src="images/logo.png">

    <p>This is a sample text</p>

    </div>

    </template>

    </head>

    <body>

    …

    </body>

    </html>

    ```


    In this example, we have a template definition in the head section of an HTML
    page. The template defines an `<div>` element containing an image and a paragraph.


    Notice that we assigned an identifier to the template. This id allows you to identify
    the template when we will use it at runtime. The template will be used to generate
    an instance of a DOM structure to be appended to the DOM, as we will see later
    on.


    You can declare any valid markup in your template element, including `<style>`
    and `<script>` elements. You can even include the `<template>` element itself.


    You can also define a template with partial or incomplete elements. For example,
    the following is a valid template:


    ```html

    <template id="myTemplate">

    <li>

    <span>This is just one item</span>

    </li>

    </template>

    ```


    It is not a complete element, since it doesn''t declare the `<ul> or <ol>` wrapping
    element. But you cannot insert invalid HTML, like the following:


    ```html

    <template id="myTemplate">

    <span>

    <li>

    This is just one item</span>

    </li>

    </template>

    ```


    Like any other HTML element, you can also create a template element via JavaScript,
    as shown in this example:


    ```javascript

    const template = document.createElement("template");

    template.innerHTML = ''

    <div>

    <img src="images/logo.png">

    <p>This is a sample text</p>

    </div>

    '';

    ```


    The effect of these statements is the same as the static declaration of the template
    with the `<template>` tag.


    So, you have an idea of how you can define a template. But what happens when you
    declare a template via markup or DOM APIs?


    When you declare a template, its markup is parsed, and the corresponding HTML
    elements are created. However, the entire resulting content is inert and invisible.


    This means that practically the DOM generated from the template''s markup is hidden,
    and it does not render. It is not part of the current document, so you cannot
    access its elements via DOM APIs, like `getElementById()` or `querySelector().`
    Also, any media reference (image, video, audio, and many more.) is not loaded.
    This means, for example, that the image in the template above is not loaded at
    declaration time. Not even scripts are executed.


    In other words, the content of a template is prepared but not executed. All that
    will become active only when the template will be used.


    # [Activating a template](#toc.xhtml_s92a)


    To activate the content of a template, you have to clone its content and append
    it to the DOM. The following is an example of activation of the `myTemplate` template
    defined above:


    ```javascript

    const myTemplate = document.getElementById("myTemplate").conten

    document.body.appendChild(myTemplate.cloneNode(true));

    ```

