    4.  What are the standard technologies Web Components rely on?


    5.  What benefits do they provide with respect to other popular UI JavaScript
    libraries?


    6.  How can you mitigate the lack of Web Components technologies support in older
    browsers?


    # [CHAPTER 2](#toc.xhtml_c02)


    # [Extending HTML Elements](#toc.xhtml_c02)


    In the previous chapter, we started to know Web Components and learned how to
    use them. In this chapter, you are going to learn how to build your own Web Components.
    We will start by briefly talking about the development environment you need to
    set up. Then, we will introduce the basic concepts about custom elements and will
    see how to extend native HTML elements by customizing their standard behavior.
    Throughout the chapter, we will create a custom element to illustrate these new
    concepts.


    # [Structure](#toc.xhtml_s14a)


    *   Setting up a development environment


    *   Custom elements


    *   Extending native elements


    *   Web components naming rules


    *   Using a custom element based on native elements


    *   Benefits of extending native elements


    # [Objectives](#toc.xhtml_s15a)


    This chapter will give you the basic knowledge to decide the development environment
    to use when you are creating your Web Component. You will learn what custom elements
    are and which type of them you should use. You will be able to create a new custom
    element by extending an existing standard HTML element and will use it in different
    development environments. You will also learn the rules to follow when naming
    your Web Component and will be aware of the benefits you get by extending standard
    HTML elements.


