    *   `onAdded()`: This one runs when the component is added to the DOM.\n*   `onRender()`:\
    \ This method is executed when the UI is rendered or updated.\n*   `onRemoved()`:\
    \ This method runs when the component is removed from the DOM.\n\n# [Stencil](#toc.xhtml_s150a)\n\
    \nStencil is a tool that provides a different approach to build Web Components.\
    \ The libraries we've explored in this chapter provides you with an abstraction\
    \ that simplifies and/or enriches the definition of your Web Component. However,\
    \ the component you build depends on the library itself: the library's code should\
