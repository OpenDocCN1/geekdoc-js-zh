    你可能会倾向于通过序列化对象表示的属性来接受丰富数据。或者，你也可能考虑通过序列化将特性中的丰富数据映射到对应的属性。这种方法存在一些缺陷。最明显的缺点是，为了同步特性和属性而进行序列化和反序列化，对于大型对象来说代价非常高。此外，在序列化过程中，你会丢失对象中可能存在的任何对象引用。换句话说，作为最佳实践，你应该只允许特性包含丰富数据，或者将其作为方法的参数接受。永远不要在
