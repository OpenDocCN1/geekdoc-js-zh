    Let’s take a look at how you can leverage these polyfills by using the unpacked
    version. For this purpose, we are going to consider the rating component example
    shown in a previous section and will add the unpacked polyfill. This is the new
    markup:


    `<!DOCTYPE html>`


    `<html lang=”en”>`


    `<head>`


    `<meta charset=”utf-8”>`


    `<script src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-bundle.js”></script>`


    `<script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>`


    `</head>`


    `<body>`


    `<my-rating max-value=”6” value=”3”></my-rating>`


    `</body>`


    `</html>`


    Note the script inclusion before the rating component script. It loads the `webcomponents-bundle.js`
    script that emulates the Web Components technologies for the browsers not supporting
    them. The script provides a collection of polyfills that are activated via feature
    detection; that is, their code is executed only when the corresponding feature
    is not natively supported by the current browser. Although this approach ensures
    efficient use of browser features, loading all polyfills implemented by the script
    would be unnecessary when the browser provides partial support of the Web Components
    technologies. It should load just the supported ones.


    To overcome this problem, you can resort to another script that loads only the
    necessary polyfills according to what the current browser is missing. The script
    is called `webcomponents-loader.js`, and you can use it instead of `webcomponents-bundle.js`
    as shown in the following code:


    `<!DOCTYPE html>`


    `<html lang=”en”>`


    `<head>`


    `<meta charset=”utf-8”>`


    `<script src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-loader.js”></script>`


    `<script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>`


    `</head>`


    `<body>`


    `<my-rating max-value=”6” value=”3”></my-rating>`


    `</body>`


    `</html>`


    This will load only the bare minimum of the available polyfills to support the
    features enabling Web Components also in browsers with partial support.


    Of course, these polyfills cannot guarantee the Web Components technologies for
    any browser. Their support is intended for quite recent browsers, so don’t expect
    they work, for example, on *Internet Explorer 8.*


    # [Conclusion](#toc.xhtml_s12a)


    In this chapter, we’ve seen how components are a convenient way to design your
    UI. They allow you to concentrate on small pieces of functionality and help you
    to reuse them in different parts of the same application or other applications.
    We also discussed that many JavaScript libraries and frameworks promoted this
    component-based approach in building UIs, but they are not compatible with each
    other. Then, we introduced Web Components as a standard native alternative to
    build UI components and took a look at how to include them in your web pages.
    We also discussed the browser support to the technologies underlying Web Components
    and showed how to use polyfills libraries to emulate these technologies on older
    browsers.


    By reading this chapter, you’ve learned what Web Components are and how to include
    an existing Web Component in your web pages. Also, by using polyfills, you are
    also able to guarantee that your web pages are correctly rendered in browsers
    that have partial or no support for the technologies that enable Web Components.


    In the next chapter, you will start to learn how to implement your web component
    by extending existing HTML elements.


