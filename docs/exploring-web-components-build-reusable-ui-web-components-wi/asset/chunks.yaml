    # 结论


    在本章中，我们回顾了属性与特性之间的区别，以及它们在标准 HTML 元素中的工作方式。带着这些概念，我们探讨了如何为 Web 组件复制这种标准行为。我们学习了如何向
    Web 组件添加特性，如何通过 JavaScript 使用它们，如何将特性映射到属性，以及如何保持两者同步。最后，我们讨论了可能影响 Web 组件性能的几个因素。


    通过在你的 Web 组件中添加和管理属性与特性，你可以创建几乎完全类似于标准 HTML 元素的自定义元素。你的 Web 组件的用户现在可以通过属性和特性来定制它们。


    在下一章中，我们将探讨另一种允许用户定制 Web 组件的方式。我们将讨论事件管理，并了解如何将这个常见功能包含到你的 Web 组件中。


