    # [Stencil](#toc.xhtml_s150a)


    Stencil is a tool that provides a different approach to build Web Components.
    The libraries we''ve explored in this chapter provides you with an abstraction
    that simplifies and/or enriches the definition of your Web Component. However,
    the component you build depends on the library itself: the library''s code should
    be included in the resulting component.


    Stencil instead is a compiler. It provides you with a rich abstraction to build
    your Web Component. It offers you a model and syntax that are inspired by Angular
    and React. But the final result of building your component is vanilla JavaScript.


    Let''s take a quick look at the main Stencil''s features by implementing our cookie
    alert component.


    To start a Stencil project, you can run the following command:


    `npm init stencil component cookie-alert`


    This command will set up a basic Stencil project in the `cookie-alert` folder
    with all the required dependencies. You note that we specified the `component`
    keyword in the command above. Actually, you can build other types of project with
    Stencil, like whole Web applications (`app`) or Ionic applications (ionic-pwa)


    Once the project structure is created, you have a few folders with several files
    all around. We will not analyze the entire structure but will focus on the class
    definition and the CSS style. Please, refer to the Stencil official documentation
    to get more details.


    # [Basic infrastructure](#toc.xhtml_s151a)


    The basic definition of a Stencil component looks like the following:


    `import { Component, h } from ''@stencil/core'';`


    `@Component({`


    `tag: ''cookie-alert'',`


    `styleUrl: ''cookie-alert.css'',`


    `shadow: true`


    `})`


    `export class CookieAlert {`


    `render() {`


    `return <div>Hello, World!</div>;`


    `}`


    `}`


