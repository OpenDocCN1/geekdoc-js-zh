    # 第 8 章

    # 分发与扩展 Web 组件


    在前几章中，我们学习了如何构建 Web 组件，并发现了在不同开发场景中更适用的方法。然而，我们构建的组件旨在用于一个或多个 Web 应用或网站，由我们自己或其他开发者使用。这促使我们思考如何提供我们的组件，使其能够轻松添加到其他项目中。


    为了满足这一需求，本章我们将探讨几种共享组件的方式，以便开发者能够将它们包含在自己的项目中。我们将讨论基于脚本的策略和基于包的策略。和往常一样，我们将以前几章开发的
    cookie 提醒组件作为示例组件，用这两种策略进行共享。


    此外，我们还将介绍如何通过扩展现有组件来创建新的 Web 组件。这种方法允许我们利用 Web 组件技术的力量，获得现有组件的个性化版本，类似于我们对原生 HTML
    元素所做的操作。


    # 结构


    *   分发策略


    *   扩展组件


    # 目标


    本章将向你解释如何创建包含 Web 组件定义的模块，以及如何使用这些模块来分发你的组件。你将学习如何将它们作为脚本和包进行分发。你还将学习如何利用继承，使用现有组件创建新组件。


    # 分发策略


    在整本书中，我们使用 Web Components Builder 项目来测试我们正在构建的 Web 组件。该项目只是一个开发环境，在我们编写组件并希望在
    HTML 页面中查看以进行评估和测试时非常有用。


    一旦你对组件感到满意，就可以将其用于你的 Web 应用或分发给其他开发者。如何让你全新的 Web 组件可供其他项目和开发者使用呢？


    在本节中，我们将讨论可用于分发 Web 组件的各种策略，并针对每种策略分析其优缺点。当然，我们仍将使用 cookie 提醒组件作为要分发的组件。


    # 基于脚本的策略


    我们可以用来分发 cookie 提醒组件的第一个策略是将其作为脚本提供。这意味着你需要提供一个包含实现该组件的相关 JavaScript 代码的文件，以便潜在用户可以通过
    `<script>` 标签将其包含到他们的项目中。


    让我们看看使用此策略分发组件的选项，并讨论这种方法的优缺点。


    # 无需构建步骤


    将 Web 组件作为脚本分发的最简单方法是提供源代码，无需任何构建步骤。要将此方法应用于我们的 cookie 提醒组件，你只需分发 Web Components
    Builder 项目中 `src` 文件夹下的 `index.js` 文件。也许为了更容易识别，你可以将 `index.js` 文件重命名为 `cookie-alert.js`。这样，你可以通过允许用户下载或通过
    CDN 提供来分发它。


    **内容分发网络（CDN）是一个分布式服务器网络，提供图像、脚本、文本或其他静态资源等内容。CDN 的主要目标是减轻网站和应用服务器的负载，并尽可能最大化共享资源的缓存。**


    一旦用户获取了脚本或托管在 CDN 上的脚本 URL，他们只需将该脚本包含到他们的 HTML 页面中。例如，以下 HTML 描述了一个包含 `cookie-alert.js`
    脚本并在其 body 中使用 Web 组件的页面：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Using the Alert Cookie component</title>

    <script src="./alert-cookie.js"></script>

    </head>

    <body>

    <h1>Using the Alert Cookie component</h1>

    <cookie-alert message="We use cookies, but respect your privacy!">

    </cookie-alert>

    </body>

    </html>

    ```


    正如预期的那样，通过这种方法，你可以在 HTML 标记中使用 `<cookie-alert>` 标签。


