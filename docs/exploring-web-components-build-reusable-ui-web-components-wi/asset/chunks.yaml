    control. A user could put your component on their web page, and you don’t know
    how that page works. In certain circumstances, you may experience some unwanted
    interferences with the behavior you designed for your component.


    In this chapter, you will discover a few examples of these possible interferences
    between the cookie alert component and the page **document object model (DOM).**
    We will discuss how these issues are traditionally addressed and how we will solve
    them by using the shadow DOM. We also will discuss the difference between the
    open and the closed shadow DOM with practical examples.


    Throughout the chapter, we will add the shadow DOM support to our cookie alert
    component to show how to use it in practice.


