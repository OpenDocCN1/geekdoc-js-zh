    # 使用 Web Component


    到目前为止，我们抽象地讨论了组件和 Web Components。现在是时候开始实际了解这项技术了。


    让我们从想要使用现成组件的开发者的角度来探索 Web Components。你将在本书的后续部分学习如何构建自己的 Web Component。


    为了演示如何使用第三方开发的 Web Component，我们将引用一个允许你通过一定数量的星星进行评分的组件，类似于你在许多电子商务网站上看到的 UI 元素。


    请查看 *GitHub* 上这个简单项目的文档，以了解更多关于该组件的信息 **- [`github.com/andychiare/rating-component`](https://github.com/andychiare/rating-component)**。


    让我们从创建一个空的 HTML 页面开始，并引用组件的代码，如下面的标记所示：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    </body>

    </html>

    ```


    如你所见，我们添加了一个 script 元素，指向 `myRatings.js` JavaScript 文件的公共 URL。该文件包含了组件的定义，但目前我们对实现不感兴趣。我们只想在网页上使用这个组件。


    **这是将库包含到项目中最简单的方法，但如果你的应用程序需要构建步骤，你也可以使用包管理器。我们稍后会深入讨论这一点。**


    现在，你可以像使用标准元素一样，在 HTML 的 body 中直接使用 `my-rating` 标签：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    <my-rating max-value=”6” value=”3”></my-rating>

    </body>

    </html>

    ```


    `my-rating` 元素具有 `max-value` 和 `value` 属性，分别用于设置要显示的最大星星数量和表示你评分的当前星星值。


    如你所见，`my-rating` 标签的使用方式与任何标准 HTML 标签相同，最重要的是，你无需安装任何 UI 框架即可获得此行为。


    要查看此标记的图形结果，你只需在 Web 浏览器中打开 HTML 页面。你应该会看到类似下面的页面：


    ![](img/Fig_1.5.jpg)


    **图 1.5**


    **在这个特定的简单案例中，你可以使用 Web 浏览器从文件系统打开 HTML 页面。但通常情况下，最好使用 Web 服务器来提供页面服务。你可以选择任何你喜欢的
    Web 服务器。我们建议使用 `http-server`，这是一个在 Node.js 环境中运行的零配置 Web 服务器。**


    **要在你的机器上安装 `http-server`，首先确保你已经安装了 Node.js，然后在终端窗口中输入以下命令：**


    `npm install http-server -g`


    **安装完成后，你可以通过进入包含 HTML 文件的文件夹，并在终端窗口中输入以下命令来启动服务器：**


    `http-server`


    **此命令将启动 Web 服务器，然后你可以通过将浏览器指向 http://localhost:8080 来查看你的页面。**


    现在，当你点击其中一颗星星时，你点击的星星及其左侧的星星会变为填充状态，而右侧的星星会变为空白状态。这表示你的评分。


    如你所见，使用 Web Component 就像使用任何标准 HTML 元素一样简单。你通过在其属性中设置值来配置元素，它就会相应地工作。


    你也可以通过 JavaScript 以编程方式使用该组件。例如，考虑以下代码：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    <script>

    window.onload = function() {

    const myRating = document.getElementById(“myRatingComponent”)

    myRating.maxValue = 10;

    myRating.value = 2;

    };

    </script>

    </head>

    <body>

    <my-rating id=”myRatingComponent”></my-rating>

    </body>

    </html>

    ```


    在这个例子中，我们为元素分配了标识符 `myRatingComponent`，并通过使用 `getElementById()` 方法通过 JavaScript
    访问它。我们还为属性 `maxValue` 和 `value` 分配了新值，它们分别对应于 `max-value` 和 `value` 属性。这允许你在网页上拥有不同的初始外观。


    除了设置组件属性的初始值之外，你还可以将其视为一个普通的 HTML 元素。例如，你可以为其附加一个事件处理程序，如下例所示：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    <script>

    window.onload = function() {

    const myRating = document.getElementById(“myRatingComponent”)

    myRating.maxValue = 10;

    myRating.value = 2;

    myRating.addEventListener(“click”, () => {

    alert(“Thanks for your feedback!”);

    });

    };

    </script>

    </head>

    <body>

    <my-rating id=”myRatingComponent”></my-rating>

    </body>

    </html>

    ```


    这里我们处理了 click 事件，以便当用户给出评分时，会显示一条感谢消息：


    ![](img/Fig_1.6.jpg)


    **图 1.6**


    这些简单的例子只是让你从使用者的角度了解 Web Components 是什么。从下一章开始，你还将学习如何构建自己的 Web Component。


