    ```

    document.body.appendChild(cookieAlert);

    const div = document.createElement("div");

    document.body.appendChild(div);

    div.appendChild(cookieAlert);

    ```


    这段代码创建了一个 `CookieAlert` 自定义元素的实例，并将其添加到当前文档的 body 中。然后，它创建一个 div 元素并将其追加到文档的 body
    中。最后，它将之前创建的 `CookieAlert` 元素实例追加到该 div 中。换句话说，你的元素已经从 body 移动到了 div 中。


    这最后一步会触发 `connectedCallback()` 方法的第二次调用。也许在很多情况下，这对组件的行为没有影响，但你应该意识到这一点。事实上，这取决于方法本身的具体语句。如果你的代码执行了必须只执行一次的任务，你应该考虑到代码可能被多次调用的可能性。


    有时，当你的自定义元素被移动时，可能不会出现行为问题，但可能会有性能问题。例如，如果你的 `connectedCallback()` 方法执行了繁重的操作或从网络获取数据，那么每次组件在文档中从一个位置移动到另一个位置时，这些操作都会被执行。同样，在这些情况下，你应该避免反复执行它们。


    让我们看看 `CookieAlert` 组件的 `connectedCallback()` 方法：


    ```

    connectedCallback() {

    this.createComponent();

    }

    ```


    它只是调用了 `createComponent()` 方法，该方法操作 DOM 以附加自定义元素的 UI 元素。提醒一下，以下是 `createComponent()`
    方法的代码：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = "This website uses cookies to ensure you get the best experience";

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    ```


    这段代码会在每次 `CookieAlert` 组件被移动时执行。从行为角度来看，这没有影响：你会得到具有预期行为的相同组件。也许从性能角度来看，它的影响非常小。但无论如何，它执行了不必要的工作。


    我们可以通过检查是否已经完成来避免执行这些不必要的工作，如下例所示：


    ```

    connectedCallback() {

    if (!this.initialized) {

    this.createComponent();

    this.initialized = true;

    }

    }

    ```


    这里，你为 `CookieAlert` 组件定义了 `initialized` 属性，并用它来判断组件的 UI 是否已经构建。只有当 `createComponent()`
    方法执行后，该属性才被设置为 true。这个检查保证了 UI 只会被构建一次。


    即使它不影响组件的行为或性能，你也应该意识到，当自定义元素被升级时，`connectedCallback()` 方法会被调用。这意味着当自定义元素被升级时，它的构造函数和
    `connectedCallback()` 方法会依次被调用。


    # attributeChangedCallback() 反应


    当与组件关联的属性被添加、移除、更新或替换时，会执行 `attributeChangedCallback()` 方法。我们将在下一章学习如何处理属性和特性。在那章中，我们还将更详细地探讨如何使用
    `attributeChangedCallback()` 方法。


    在这里，你只需要了解这个方法及其总体目标。此外，这个方法会接收三个参数，为你提供更多关于正在发生什么的信息：


    *   受影响的属性名称

    *   该属性的旧值

    *   该属性的新值


    因此，通常你会像下面这样实现 `attributeChangedCallback()` 方法：


    ```

    attributeChangedCallback(name, oldValue, newValue) {

    …

    }

    ```


    如前所述，我们将在下一章更详细地介绍如何使用这个反应。


    # adoptedCallback() 反应


    当你的自定义元素被采纳到新文档中时，你可能需要实现 `adoptedCallback()` 方法。元素的采纳有一个非常特定的用例。当元素通过 `document.adoptNode()`
    方法从一个文档移动到另一个文档时，就会发生这种情况。这通常发生在你处理 `iframe` 时，如下例所示：


    ```

    const iframe = document.querySelector(“iframe”);

    const iframeFirstImage = iframe.contentDocument.querySelector(“img”);

    const adoptedImage = document.adoptNode(iframeFirstImage);

    document.body.appendChild(adoptedImage);

    ```


    这段代码获取当前文档中第一个 `iframe` 的第一个图片元素，并将其追加到当前文档的 body 中。请注意，原始元素会从源文档中移除。


    当你的自定义元素以这种方式移动时，`adoptedCallback()` 方法会被调用。注意，元素的采纳不会销毁并重新创建元素，因此它的构造函数不会被调用。


    # disconnectedCallback() 反应


    当你的自定义元素从 DOM 中移除时，会调用 `disconnectedCallback()` 方法。你可以定义此方法，以便在元素从当前文档中消失之前执行操作。通常，它用于释放资源和添加清理逻辑，例如通知其他组件该元素正在从
    DOM 中移除、停止定时器、取消订阅 DOM 事件或全局应用程序服务等。


    这些清理操作有助于释放系统资源并防止可能的内存泄漏，但当然，它们取决于组件的逻辑。


    **请记住，将元素从 DOM 中断开并不意味着该元素被销毁。**


    为了澄清这个概念，请考虑以下代码：


    ```

    const cookieAlert = new CookieAlert();

    document.body.appendChild(cookieAlert);

    document.body.getElementByTagName(“cookie-alert”).remove();

    ```


    这段代码创建了一个 `cookieAlert` 自定义元素的实例，将其添加到 DOM 中，然后将其从 DOM 中移除。最后一条语句导致系统查找并执行 `disconnectedCallback()`
    方法。请注意，`cookieAlert` 实例已从 DOM 中移除，但并未被销毁。事实上，你可以通过以下语句再次将其追加到 DOM 中：


    ```

    document.body.appendChild(cookieAlert);

    ```


    由于你的自定义元素在其生命周期中可能会多次断开和重新连接到 DOM，因此你应该意识到 `disconnectedCallback()` 方法可能会被多次调用。


    另外，请考虑你在 `disconnectedCallback()` 方法中执行的操作通常取决于你在执行 `connectedCallback()` 方法时所做的事情。也许最常见的场景是事件监听器的订阅。我们将在接下来的章节中深入探讨事件，但你可能已经猜到，管理事件是
    UI 元素最常见的活动之一。事件处理程序通常在你的组件连接到 DOM 时注册。它们会消耗内存，并且即使正在监听的元素不再存在，它们也会继续消耗内存。


    当你的组件从 DOM 中移除时，一个好的做法是移除它订阅的事件监听器。以下代码展示了如何做到这一点：


    ```

    disconnectedCallback() {

    this.getElementById(“clickableItem”)

    .removeEventListener(“click”, this.handleClick);

    }

    ```


    如你所见，这里使用了 `removeEventListener()` 方法来移除已注册的事件处理程序。


    # 使用自定义 Web 组件


