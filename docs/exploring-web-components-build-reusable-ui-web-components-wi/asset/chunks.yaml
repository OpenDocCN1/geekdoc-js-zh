    # 第 5 章


    # 处理事件


    事件是 UI 开发的重要组成部分。它们允许你管理用户与应用程序的交互，并对特定的系统行为做出反应。在本章中，我们将探讨如何让 Web 组件监听事件、处理事件以及创建自定义事件。在简要回顾
    DOM 事件管理之后，你将学习如何将 Web 组件与标准事件监听集成。你还将了解如何处理事件传播，以及如何生成不带事件数据和带事件数据的自定义事件。最后，你将看到如何通过移除所有已注册的事件监听器来实现更好的系统资源管理，这是最佳实践之一。


    像往常一样，在本章中，我们将通过丰富我们的 cookie 警告组件来处理和生成事件，从而实践这些新概念。


    # 结构


    *   事件管理基础


    *   监听标准事件


    *   创建自定义事件


    *   移除事件监听器


    # 目标


    阅读本章后，你将能够创建能够监听整个组件上或组件 UI 中任何标准 HTML 元素上发生的标准事件的 Web 组件。你还将学习如何让你的组件生成尽可能类似于标准事件的自定义事件。


    # 事件管理基础


    事件管理在任何交互式应用程序中都非常重要。作为一名 JavaScript 开发者，你知道如何处理事件。不过，在进入 Web 组件的事件管理之前，让我们在本节中回顾一些关于事件的概念，以便达成共识。


    事件允许我们定义应用程序在用户与之交互时，或者当系统（基本上是 DOM）或应用程序本身内部发生某些事情时的行为。为了拦截事件，我们通常使用处理程序或监听器，这是一个与特定事件关联的函数。


    你有三种方式将处理程序与事件关联：


    *   在 JavaScript 代码中使用 `addEventListener()` 方法


    *   在 HTML 标记中使用特定的属性


    *   使用 HTML 元素的特定特性


    使用属性和特性为 HTML 元素分配事件处理程序相当直接且方便。然而，`addEventListener()` 方法提供了一种更高级的事件管理方式。例如，它允许你为同一事件添加多个处理程序。它还允许你控制处理程序在事件传播流程中的位置，我们稍后会看到。


    当事件触发时，一个包含事件本身细节的对象会被传递给处理程序。你可以在处理程序中使用这个对象，如下例所示：


    ```

    const button = document.getElementById("myButton");

    button.addEventListener("click", (event) => {

    console.log(''You clicked the button "${event.target.innerHTML}"'');

    });

    ```


    在这个例子中，我们使用了事件对象的 `target` 属性。它表示事件触发的 HTML 元素。我们使用了这个 HTML 元素的 `innerHTML` 特性来在浏览器控制台中显示被点击按钮的文本。


    当事件发生时，它会沿着特定路径穿过 DOM。这个路径被称为**事件传播**流程，分为三个阶段：


    *   **捕获阶段**：在此阶段，事件从 DOM 的根节点传播到实际的目标元素。


    *   **目标阶段**：在此阶段，事件到达目标元素。


    *   **冒泡阶段**：在此阶段，事件从目标元素开始向上遍历 DOM 树，直到再次到达根节点；因此，它会经过捕获阶段中经过的相同节点。


    下面的图片来自 W3C 规范，展示了这三个阶段中的事件传播：


    ![](img/5-1.jpg)


    **图 5.1**


    在这三个阶段中，与事件关联的事件对象会被传递给沿途遇到的任何处理程序。通常，在捕获阶段，处理程序会忽略事件，让它流向目标元素。一旦到达目标元素，其处理程序代码就会被执行。在接下来的冒泡阶段，当你向
    DOM 根节点移动时，事件处理程序会被执行。


    理解这个流程有助于防止奇怪的行为，并在管理事件时发现可能的问题。


    如果你出于某种原因希望你的处理程序在事件传播的捕获阶段执行，你可以利用 `addEventListener()` 方法的第三个参数。下面的例子展示了如何做到这一点：


    ```

    const button = document.getElementById("myButton");

    const handler = (event) => {

    console.log(''You clicked the button "${event.target.innerHTML}"'');

    };

    button.addEventListener("click", handler, true);

    ```


    `addEventListener()` 方法的第三个参数是一个 `Boolean` 值，指定处理程序是否必须在捕获阶段执行。其默认值为 `false`，阻止处理程序在捕获阶段执行。


    在处理事件时，我们有机会改变事件流。例如，我们可以通过使用事件对象的 `stopPropagation()` 方法来决定停止事件流。下面是一个如何使用该方法的示例：

    '
- fmt: '

    `const button = document.getElementById("myButton");`

    `button.addEventListener("click", (event) => {`

    `event.stopPropagation();`

    `console.log(‘The event stops at button “${event.target.innerHTML}”‘);`

    `});`


    You can get the same effect by assigning a Boolean value to the `cancelBubble`
    property of the `event` object, as shown in the following code snippet:


    `const button = document.getElementById("myButton");`

    `button.addEventListener("click", (event) => {`

    `event.cancelBubble = true;`

    `console.log(‘The event stops at button “${event.target.innerHTML}”‘);`

    `});`


    With this summary about the DOM event management, let''s explore how it fits in
    the Web Components context.


    # [Listening to standard events](#toc.xhtml_s64a)


    Let''s see how to let a web component handling a standard event, that is, a typical
    DOM event that may occur to a standard HTML element. With this goal in mind, we
    want to enrich our cookie alert component by adding a `Close` button. This button
    allows the user to hide the banner at the bottom of the current web page. When
    the user clicks the button, the cookie alert will disappear.


    Let’s see the HTML markup of the page containing the `<cookie-alert>` element:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    It is the same markup we used in the previous chapter when we introduced attributes
    and properties management.


    Now, let’s edit the `index.js` file in order to apply some changes to the code
    contained in it. As a first step, let’s add a new CSS rule to format our new button.
    The `styleRules` constant will look like the following:


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    .button {

    color: rgb(255, 255, 255);

    background-color: transparen

    border-color: rgb(255, 255, 255);

    padding: 5px 40px;

    margin-right: 50px;

    cursor: pointer;

    float:righ

    }

    ‘;

    ```


    As you can see, we simply added a `button` CSS class defining some graphic properties.


    Now, let’s add the actual button to the web component markup. So, we change the
    `createComponent()` method as follows:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    this.appendChild(div);

    this.updateMessage();

    }

    ```


    We added a few statements that create an `<button>` HTML element, assign the `button`
    class and the `close` text to it, attach an event listener, and append the `button`
    to the container `<div>`.


    For our goal, the relevant part of these statements is the event listener attachment.
    As you can see, we used the standard `addEventListener()` method of the button
    to assign a listener for the `click` event, just like you do for any standard
    HTML element. This specific listener simply hides the entire web component by
    changing the value of its `visibility` property.


    If we run our project, we will see the following page:


    ![](images/Figure_5.2.jpg)


    **Figure 5.2**


    As you can see, now we have a `Close` button on the right of the cookie alert.
    If you click it, the banner will disappear as expected.


    So, you now know how to listen to and handle standard events that may occur on
    the various elements your web component is composed of.


    Consider that your web component itself as a whole may listen to standard events.
    Remember that it inherits from `HTMLElement`. So, you can listen to any events
    that may occur on the whole surface of the component, not just on a single element
    that composes it.


    For example, you could implement a visual effect that changes the background color
    of the banner when the user’s mouse pointer is over the component’s area. In order
    to enable this effect, let’s add a few statements to the `createComponent()` method.
    The new version of the method will look like the following:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    this.appendChild(div);

    this.addEventListener("mouseover", ()=> {

    div.style.backgroundColor = "rgb(35, 122, 152)";

    });

    this.addEventListener("mouseout", ()=> {

    div.style.backgroundColor = "";

    });

    this.updateMessage();

    }

    ```


    The two new statements we added to the code of the `createComponent()` method
    use the `this` keyword to add two event listeners directly to the web component.
    The first event listener catches the `mouseover` event, while the second one handles
    the `mouseout` event. In the former case, we change the background color of the
    container `<div>`. In the latter case, we reset this background color to the default
    one defined in the container CSS class.


    # [Event propagation](#toc.xhtml_s65a)


    The event management we explained in the previous section shows us how we, as
    the web component developers, can catch a standard event and handle it. But what
    happens if the user specifies their event handler on our web component? Say, for
    example, that the user adds a handler to the `onclick` attribute like in the following
    markup:


    ```

    <cookie-alert

    message="We use cookies, but respect your privacy!"

    onclick="alert(''You clicked!'')">

    </cookie-alert>

    ```


    Of course, the user can do it. Since the cookie alert inherits from `HTMLElement`,
    it also inherits standard event hooks like `onclick`. So, when the user clicks
    on any part of the banner, the alert will be shown.


    Notice that the user''s alert will be shown even when they click the `Close` button.
    This happens because of the event propagation flow. Once the click event reaches
    the target element, that is the close button; it enters in the bubbling phase.
    In this phase, the event passes through all the button''s parents until the user''s
    `onclick` handler is reached and executed.


    Maybe you are wondering if there is a way to prevent the user from adding handlers
    to the standard events. Before trying to find a solution to it, try to ask yourself
    if you want this. Do you want to prevent users from attaching their event handlers?
    After all, any standard element allows you to attach standard event handlers.
    Why should your component work differently?


    Anyway, if you want to prevent the user from adding their event handler, or better,
    to ignore them, you should add a special event listener to your web component
    as soon as it is created. In other words, for our click event example, you should
    modify your component''s constructor as follows:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this.addEventListener("click", (e) => {

    e.stopImmediatePropagation();

    });

    }

    ```

