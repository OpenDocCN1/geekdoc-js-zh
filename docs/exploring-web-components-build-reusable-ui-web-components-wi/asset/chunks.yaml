    However, not always the UI element you imagine for your web application or for
    your website can be obtained by simply extending a native HTML element. Even if
    we said that extending a native HTML element should be the first option when implementing
    your own Web Component, there are situations where the UI component you need doesn’t
    resemble any native HTML element or is a combination of native elements. In this
    case, you need to implement your autonomous custom element.


    # Introducing the cookie alert project


    To better explain which are those cases where you may need to implement your Web
    Component as an autonomous custom element, you will build a concrete custom Web
    Component - a cookie alert Web Component.


    This is one of those components that surely you have noticed while navigating
    on the Web. In fact, almost all websites show an alert, a banner, a pop-up window,
    or similar, informing you about their cookie management policy involving personal
    data. In some countries, this is required by law, but many websites provide them
    just for transparency.


    Maybe most of those components are built by using one of the most common UI libraries,
    such as React, Vue, or Angular. So, they should be re-implemented for each website
    according to the UI library they are based on. On the contrary, we are going to
    build such a component as a Web Component, so that it can be used regardless of
    the UI library used to build the rest of the Web UI.


    As explained in the previous chapter, you can use the *Web Component Builder*
    project as a template project to set up your development environment for the cookie
    alert Web Component. So, clone and initialize it on your machine.


    **Remember that clone and initialize the Web Component Builder project means to
    use the `git clone` and `npm install` commands, as described in the previous chapter.**


    # A minimal autonomous custom element


    Let’s start building our cookie alert component and learning about autonomous
    custom elements along the way. So, assuming you have initialized your Web Component
    project, open the `index.js` file in the `src` folder and replace its content
    with the following code:


    ```

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.innerText = "This website uses cookies to ensure you get the best experience";

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    As said in the previous chapter, an autonomous custom element is an element built
    from scratch. It doesn’t extend a standard well-known `HTML element`, but anyway,
    it is implemented as a class that extends `HTMLElement`. The `HTMLElement` class
    is the base class for any HTML element. It gives your component the ability to
    be added to the DOM and a little bit more that we will discover later.


    As you can see, the `CookieAlert` class has a constructor that invokes the `super()`
    method of the base class. As per specifications, this is very important in order
    to make your custom element working properly. So, don’t forget to call it when
    implementing your autonomous custom elements.


    You already know the `connectedCallback()` method. It is automatically called
    when an instance of this element is added to the DOM. In this case, a text will
    be assigned to the `innerText` property of the element. Of course, this is not
    yet the cookie alert we want to have, but just a very simple Web Component is
    showing the text I’m the cookie alert!


    The last row adds our component in the custom elements registry. Unlikely the
    customized native element case, here we don’t need to specify the third parameter
    since we are not extending a native HTML element. Here we are simply telling the
    registry that the `cookie-alert` Web Component is implemented by the `CookieAlert`
    class.


    The next step is using this simple component by changing the content of the `index.html`
    page. So, open the `index.html` file in the root folder of the project and replace
    its content with the following markup:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert></cookie-alert>

    </body>

    </html>

    ```


    As you can see, unlike the case of the customized native elements, here we are
    using the `cookie-alert` tag to specify our autonomous custom element. This is
    one of the relevant differences between the two types of custom elements.


    **Remember that the name rules we saw for the customized native elements apply
    to autonomous custom elements as well.**


    If you run the project by typing `npm start` in a terminal window and then point
    your browser to the `http://localhost:8080` address, you should see something
    similar to the following screenshot:


    ![](images/Figure_3.1.jpg)


    **Figure 3.1**


    You have your brand new basic autonomous custom element.


    # Basic techniques to add CSS and markup


    The component you have created so far gives you a very basic idea about how to
    build an autonomous custom element. But, of course, this is not the component
    we planned to build. Since an autonomous custom element inherits from `HTMLElement`,
    it has nothing specific regarding its UI. We need to create its graphical appearance
    from scratch. In the component built so far, we simply showed a text by using
    the `innerText` property. To build our alert cookie component, we need to go further.


    So, let’s start by changing the content of the `index.js` file in the `src` folder
    as shown in the following code:


    ```

    const styleMarkup = ‘

    <style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    </style>‘;

    const componentMarkup = ‘

    <div class="container footer">

    <span>This website uses cookies to ensure you get the best experience</span>

    </div>‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.innerHTML = styleMarkup + componentMarkup;

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    We defined two constants - `styleMarkup` and `componentMarkup`. The first one
    is a string containing some CSS rules wrapped in a style element. The second one
    is a string with a div element using the CSS classes defined in the `styleMarkup`
    constant. Both strings are concatenated and assigned to the `innerHTML` property
    of our `CookieAlert` component. In simple words, we are building the UI of our
    component by using standard HTML and CSS and by attaching it to the `innerHTML`
    property of the generic HTML element.


    If you run the project at this point of the implementation, you should see the
    following in your browser:


    ![](images/Figure_3.2.jpg)


    **Figure 3.2**


    As you can see, our component begins to take shape.


    In the example shown so far, you used strings to define the UI of your Web Component.
    Of course, this is just one technique to define it. You can virtually use any
    possible technique to build the UI of your component. For example, you could use
    DOM APIs instead of strings to get the same result.


    The following is an example of using the DOM APIs to build the component’s UI:


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.createComponent();

    }

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    ```

