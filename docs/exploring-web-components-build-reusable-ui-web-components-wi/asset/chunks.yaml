    # [Syncing attributes and properties](#toc.xhtml_s55a)


    So far, we have a way to customize our cookie alert component by handling properties
    via JavaScript. Of course, we would like to customize our component using attributes
    as well, as any HTML component allows us to do. Even if in standard HTML elements,
    we have most properties and attributes mapped each other, this is not for free
    for Web Components. In this section, we will see how to enable attribute-based
    customization and how to keep in sync attributes and properties.


    # [Properties to attributes](#toc.xhtml_s56a)


    Mapping properties to the corresponding attributes is quite easy. We should just
    assign the value of a property to the attribute whenever it changes. And we can
    do it by applying a little change to the property setter’s code.


    The following code shows how to map the value of the `message` property to the
    `message` attribute:


    ```

    set message(value) {


    this._message = value;


    this.setAttribute("message", value);


    this.updateMessage();


    }

    ```


    As you can see, we used the `setAttribute()` method of the web component itself
    to apply this mapping. Remember that whatever is the type of the value variable,
    it will be converted into a string.


    # [Attributes to properties](#toc.xhtml_s57a)


    Now we know a way to map to the attributes the values you are assigning to the
    properties. This is great, but the more interesting part is the mapping from the
    attributes to the properties of a web component. This allows the user to set values
    from the markup, and sometimes it is more easy and convenient.


    Mapping an attribute to a property is a little trickier. It requires some kind
    of notification from the browser when the value of an attribute changes. Remember
    that HTML is under the direct control of the browser. It parses the markup and
    provides us with a representation of it through the DOM. So, if something happens
    at the markup level, the browser should process this change and provide us with
    some new information.


    That said, you need to be informed when a value of an attribute changes. So, as
    a first step, declare which attributes you want to monitor by adding the static
    getter `observedAttributes()` to the web component class, as shown in the following
    code snippet:


    ```

    static get observedAttributes() {


    return ["message"];


    }

    ```


    This getter returns an array with the attribute names the component wants to observe.
    In our case, just the message attribute. The `observedAttributes` property provides
    the browser with the list of attributes we are interested in receiving notifications
    when the value of any of the changes.


    After this preliminary step, you need to capture notifications sent by the browser
    when the value of any observed attribute changes. For this goal, you need to implement
    the `attributeChangedCallback()` method. As you remember from the previous chapter,
    this is one of the reactions of a web component’s lifecycle. It will be invoked
    when a change occurs to any of the observed attributes. The following is the implementation
    of this method for the cookie alert component:


    ```

    attributeChangedCallback(name, oldValue, newValue) {


    if (oldValue !== newValue) {


    if (name === "message") {


    this._message = newValue;


    this.updateMessage();


    }


    }


    }

    ```


    This code will change the `internal _message` property and will show the new value
    through the `updateMessage()` method.


    These changes allow you to set your custom `message` using the message attribute
    of the `<cookie-alert>` element, without any JavaScript code, as shown by the
    following example:


    ```

    <cookie-alert message="We use cookies, but respect your privacy!”></cookie-alert>

    ```


    The resulting visual effect will be the same as before, but now we have a web
    component that is almost indistinguishable from a standard HTML element.


    # [Caveats and suggestions](#toc.xhtml_s58a)


    In the example reported above, we implemented a synchronization between properties
    and attributes and vice versa. This is usually the most common scenario since
    the user expects that each change in an attribute and properties reflects on each
    other automatically.


    However, keep in mind that this could not always be the best practice. For example,
    if a property is intended to be frequently updated via JavaScript, for example,
    through a loop, you shouldn’t map its value to the corresponding attribute. Reflecting
    the update to the attribute is expensive, so if you have to do this frequently,
    your web component could become unresponsive. In some situations, you could even
    choose to not provide an attribute for a given property.


    As said, attributes accept only strings. You cannot pass any other data type.
    The responsibility to convert that string into the type of the corresponding property
    is on the getter and setter methods. Of course, you cannot assign rich data, such
    as objects and arrays, to an attribute as well. If you want to allow rich data
    assignment for your web component, you should accept such data through methods
    or properties.

