    In its simplicity, this example shows how the `<p>` element allows you to embed
    the text and the `<b>` and `<i>` elements. How great it would be if you could
    do this for your components as well!


    In this section, we will discover how to obtain a similar result for Web Components.


    # [Enabling formatted text](#toc.xhtml_s96a)


    Let’s start by trying to define what we want to have for our cookie alert component.
    So far, we are allowing the user to specify their custom message through the message
    property and attribute. This is awesome but doesn’t allow the user to specify
    a formatted text. We would like to allow the user to specify a formatted text
    like in the following example:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Web Components with Webpack Build System</title>`


    `<script src="./wc-polyfills/webcomponents-loader.js"></script>`


    `<script src="./bundle.js"></script>`


    `</head>`


    `<body class="container">`


    `<h1>Here is your Web Component</h1>`


    `<cookie-alert>`


    `We use <b>cookies</b>, but respect your <b>privacy</b>!`


    `</cookie-alert>`


    `</body>`


    `</html>`


    We are putting some HTML-formatted text within the `<cookie-alert>` tags. We want
    to obtain a result in some way similar to the one offered by the `<p>` element.


    Fortunately, this is not so hard to have, and it doesn’t require to write much
    code. We can get this result by simply changing the markup of our template as
    follows:


    `const template = document.createElement(''template'');`


    `template.innerHTML = ‘`


    `<style>`


    `…`


    `</style>`


    `<div class="container footer">`


    `<slot id="message"></slot>`


    `<button id="closeButton" class="button">Close</button>`


    `<button id= "acceptButton" class="button">Accept</button>`


    `</div>`


    `‘;`


    As you can see, we simply replaced the `<span id=”message”></span>` element in
    the HTML markup with the `<slot id=”message”></slot>` element.


    So, what is this new <slot> element?


    The `<slot>` element allows you to define a placeholder in your template. This
    placeholder can be filled by the user of your component with any markup fragment
    embedded inside your component’s tags. This is just what we did in the markup
    above when we specified a formatted text as the message to display


    If you run the component’s project with this small change, you will get the following
    result:


    ![](images/Figure_7.1.jpg)


    **Figure 7.1**


    As you can see, the message shown by the cookie alert component has the **`cookies`**
    and **`privacy`** words in bold.


    You can provide a default markup for a `<slot>` element by embedding it, like
    in the following example:


    `<slot id=”message”>This is the <b>default</b> message</slot>`


    The default message will be shown if no markup is provided when using the component


    You may notice that the `<slot>` element in the template of our component has
    the id attribute. It is not needed to make the placeholder working. We added it
    to keep the existing behavior, that is, to keep the possibility to specify the
    message through the message property and attribute. In other words, the `<slot>`
    element also has the role of the `<span>` element it has replaced.


    Be aware, however, that if you assign a value to the `message` property or attribute
    while an embedded markup is present, the embedded markup will be shown.


    # [Named slots](#toc.xhtml_s97a)


    The `<slot>` element opens your component to new possibilities. Of course, you
    can specify inside the component’s tag any markup, not just markup that defines
    a formatted text. You can also embed other web components, for example.


    The example we have shown above uses just one placeholder identified by the only
    `<slot>` element in the component’s template. This slot’s occurrence is what is
    technically called an **unnamed default slot.**


    You can insert multiple `<slot>` elements in a template. And you can identify
    each slot by assigning them a value to their `name` attribute. So, for example,
    you can have a template like the following:


    `const template = document.createElement(''template'');`


    `template.innerHTML = ‘`


    `<div>`


    `<slot name=”firstName”></slot>`


    `<slot name=”lastName”></slot>`


    `<slot name=”address”></slot>`


    `</div>`


    `‘;`


    Here are three slots identified by their names. The match between the markup and
    the placeholders represented by these slots is done by the slot attribute, as
    shown in the following example:


    `<my-custom-element>`


    `<span slot=”firstName”>John</span>`


    `<span slot=”lastName”>Brown</span>`


    `<div slot=”address”>1 Trafalgar Square, London, UK</div>`


    `</my-custom-element>`


    Each HTML element in this example will replace the corresponding `<slot>` element
    in the template with the same name value as the `slot` attribute. So, the resulting
    markup will be similar to the following:


    `<div>`


    `<span>John</span>`


    `<span>Brown</span>`


    `<div>1 Trafalgar Square, London, UK</div>`


    `</div>`


    You can also combine named and unnamed `<slot>` elements, as in the following
    example:


    `const template = document.createElement(''template'');`


    `template.innerHTML = ‘`


    `<div>`


    `<slot name=”firstName”></slot>`


    `<slot name=”lastName”></slot>`


    `<slot name=”address”></slot>`


    `<slot>Put here a description</slot>`


    `</div>`


    `‘;`


    The last `<slot>` element has no name attribute. This slot will be replaced by
    all the top-level elements that have no `slot` attribute. For example, consider
    we have the following web component markup:


    `<my-custom-element>`


    `<h3>User data</h3>`


    `<span slot=”firstName”>John</span>`


    `<span slot=”lastName”>Brown</span>`


    `<div slot=”address”>1 Trafalgar Square, London, UK</div>`


    `<div>`


    `<p>No more data</p>`


    `</div>`


    `</my-custom-element>`


    The resulting markup will be as follows:


    `<div>`


    `<span>John</span>`


    `<span>Brown</span>`


    `<div>1 Trafalgar Square, London, UK</div>`


    `<h3>User data</h3>`


    `<div>`


    `<p>No more data</p>`


    `</div>`


    `</div>`


    As you can see, the unnamed slot captures all the elements without a slot attribute
    regardless of their original position. This unnamed slot is said the **default
    slot.**


    **You can have only one default slot. If you have multiple unnamed slots, only
    the first one will be the default slot, and it will capture all the top-level
    elements without a slot attribute.**


    # [Using named slots](#toc.xhtml_s98a)


    Named slots allow you to define multiple placeholders in the UI of your component.
    This offers the user of your component many points of customization through markup.


    Let’s leverage this feature in our cookie alert component by slightly changing
    the markup of its template, as shown in the following code snippet:


    `const template = document.createElement(''template'');`


    `template.innerHTML = ‘`


    `<style>`


    `…`


    `</style>`


    `<div class="container footer">`'
  toc: []
  trans: '

    ```

    this.shadowRoot.getElementById("message").innerText = this._message;

    }

    ```


    我们不再将消息值赋给一个通用的 span，而是通过元素标识符访问 span 元素。


    # 使用插槽组合标记


    模板为我们提供了一种很好的方式，将声明式方法（用于定义 Web 组件的 UI）与效率结合起来。但从本质上讲，它们似乎只提供了内部好处。也就是说，它允许你（组件开发者）编写更少的代码，并以高效的方式渲染组件的
    UI。但它并没有为你提供向组件添加新功能的机会。


    当然，目前看来确实如此。你可以利用原生模板来获得 HTML 元素的组合。这意味着你可以允许组件的用户在其标签内嵌入他们自己的标记。许多标准 HTML 元素都支持元素组合。想想那些允许你拥有内部标记的元素。例如，考虑用于分组其他
    HTML 元素的 `<div>` 元素；或者允许你在其标签内添加格式化文本的 `<p>` 元素，如下面的代码片段所示：


    ```

    <p>

    这是一条<b>格式化</b>的<i>消息</i>！

    </p>

    ```


    这个例子简单展示了 `<p>` 元素如何允许你嵌入文本以及 `<b>` 和 `<i>` 元素。如果你的组件也能做到这一点，那该多好啊！


    在本节中，我们将探讨如何为 Web 组件实现类似的效果。


    # 启用格式化文本


    让我们首先尝试定义我们希望 cookie 提醒组件具备的功能。到目前为止，我们允许用户通过 `message` 属性和特性来指定自定义消息。这很棒，但无法让用户指定格式化文本。我们希望允许用户像下面的例子那样指定格式化文本：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>使用 Webpack 构建系统的 Web 组件</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body class="container">

    <h1>这是你的 Web 组件</h1>

    <cookie-alert>

    我们使用<b>cookies</b>，但尊重您的<b>隐私</b>！

    </cookie-alert>

    </body>

    </html>

    ```


    我们在 `<cookie-alert>` 标签内放置了一些 HTML 格式的文本。我们希望获得与 `<p>` 元素类似的结果。


    幸运的是，这并不难实现，而且不需要编写太多代码。我们只需按如下方式更改模板的标记即可：


    ```

    const template = document.createElement(''template'');

    template.innerHTML = ‘

    <style>

    …

    </style>

    <div class="container footer">

    <slot id="message"></slot>

    <button id="closeButton" class="button">关闭</button>

    <button id= "acceptButton" class="button">接受</button>

    </div>

    ‘;

    ```


    如你所见，我们简单地将 HTML 标记中的 `<span id=”message”></span>` 元素替换为 `<slot id=”message”></slot>`
    元素。


    那么，这个新的 `<slot>` 元素是什么呢？


    `<slot>` 元素允许你在模板中定义一个占位符。这个占位符可以由组件的用户通过嵌入在组件标签内的任何标记片段来填充。这正是我们在上面的标记中所做的，我们指定了格式化文本作为要显示的消息。


    如果你使用这个小的改动运行组件项目，你将得到以下结果：


    ![](img/Figure_7.1.jpg)


    **图 7.1**


    如你所见，cookie 提醒组件显示的消息中，“cookies”和“privacy”这两个词以粗体显示。


    你可以通过嵌入内容为 `<slot>` 元素提供默认标记，如下例所示：


    ```

    <slot id=”message”>这是<b>默认</b>消息</slot>

    ```


    如果使用组件时未提供标记，则会显示默认消息。


    你可能注意到，组件模板中的 `<slot>` 元素具有 `id` 属性。这并不是使占位符工作所必需的。我们添加它是为了保持现有行为，即保留通过 `message`
    属性和特性指定消息的可能性。换句话说，`<slot>` 元素也扮演了它所替换的 `<span>` 元素的角色。


    但请注意，如果你在存在嵌入标记的情况下为 `message` 属性或特性赋值，则会显示嵌入的标记。


    # 命名插槽


    `<slot>` 元素为你的组件打开了新的可能性。当然，你可以在组件标签内指定任何标记，而不仅仅是定义格式化文本的标记。例如，你还可以嵌入其他 Web 组件。


    我们上面展示的例子只使用了一个占位符，由组件模板中唯一的 `<slot>` 元素标识。这个插槽的出现就是技术上所谓的**未命名默认插槽**。


    你可以在模板中插入多个 `<slot>` 元素。并且你可以通过为每个插槽的 `name` 属性赋值来标识它们。例如，你可以有一个像下面这样的模板：


    ```

    const template = document.createElement(''template'');

    template.innerHTML = ‘

    <div>

    <slot name=”firstName”></slot>

    <slot name=”lastName”></slot>

    <slot name=”address”></slot>

    </div>

    ‘;

    ```


    这里有三个由名称标识的插槽。标记与这些插槽所代表的占位符之间的匹配是通过 `slot` 属性完成的，如下例所示：


    ```

    <my-custom-element>

    <span slot=”firstName”>John</span>

    <span slot=”lastName”>Brown</span>

    <div slot=”address”>1 Trafalgar Square, London, UK</div>

    </my-custom-element>

    ```


    此示例中的每个 HTML 元素将替换模板中具有相同 `name` 值（与 `slot` 属性值匹配）的对应 `<slot>` 元素。因此，生成的标记将类似于以下内容：


    ```

    <div>

    <span>John</span>

    <span>Brown</span>

    <div>1 Trafalgar Square, London, UK</div>

    </div>

    ```


    你还可以组合命名和未命名的 `<slot>` 元素，如下例所示：


    ```

    const template = document.createElement(''template'');

    template.innerHTML = ‘

    <div>

    <slot name=”firstName”></slot>

    <slot name=”lastName”></slot>

    <slot name=”address”></slot>

    <slot>在此处放置描述</slot>

    </div>

    ‘;

    ```


    最后一个 `<slot>` 元素没有 `name` 属性。这个插槽将被所有没有 `slot` 属性的顶级元素替换。例如，考虑以下 Web 组件标记：


    ```

    <my-custom-element>

    <h3>用户数据</h3>

    <span slot=”firstName”>John</span>

    <span slot=”lastName”>Brown</span>

    <div slot=”address”>1 Trafalgar Square, London, UK</div>

    <div>

    <p>没有更多数据</p>

    </div>

    </my-custom-element>

    ```


    生成的标记将如下所示：


    ```

    <div>

    <span>John</span>

    <span>Brown</span>

    <div>1 Trafalgar Square, London, UK</div>

    <h3>用户数据</h3>

    <div>

    <p>没有更多数据</p>

    </div>

    </div>

    ```


    如你所见，未命名插槽会捕获所有没有 `slot` 属性的元素，无论它们原来的位置如何。这个未命名插槽被称为**默认插槽**。


    **你只能有一个默认插槽。如果你有多个未命名插槽，只有第一个会成为默认插槽，并且它会捕获所有没有 `slot` 属性的顶级元素。**


    # 使用命名插槽


    命名插槽允许你在组件的 UI 中定义多个占位符。这为组件的用户提供了通过标记进行定制的多个切入点。


    让我们在 cookie 提醒组件中利用这一特性，稍微更改其模板的标记，如下面的代码片段所示：


    ```

    const template = document.createElement(''template'');

    template.innerHTML = ‘

    <style>

    …

    </style>

    <div class="container footer">

    ```


    '
- fmt: '

    `<slot id="message" name="message"></slot>&nbsp;`

    `<slot name="reference"></slot>`

    `<button id="closeButton" class="button">Close</button>`

    `<button id= "acceptButton" class="button">Accept</button>`

    `</div>`

    `‘;`


    We added the name attribute to the existing `<slot>` element and added a new slot
    with `reference` as its name. We want to allow users to specify a formatted markup
    for the main message of the component, as it happened so far, and to provide a
    markup intended for a detailed reference to the cookie management policy.


    The following is an example of the use of these slots:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body class="container">

    <h1>Here is your Web Component</h1>

    <cookie-alert>

    <span slot="message">We use <b>cookies</b>, but respect your <b>privacy</b>!</span>

    <span slot="reference">Read our <a href="privacy.html">privacy policy</a></span>

    </cookie-alert>

    </body>

    </html>

    ```


    You have two `<span>` elements within the `<cookie-alert>` tags. Each `<span>`
    element refers to the slots defined in the template. By running the project, you
    will see the following result:


    ![](images/Figure_7.2.jpg)


    **Figure 7.2**


    You see both messages provided by the user. Of course, the user has to provide
    any related resources, like, for example, the `privacy.html` file specified in
    the link.


    All this works thanks to the slot mechanism. No other code is needed!


    # [Conclusion](#toc.xhtml_s99a)


    This chapter was devoted to improving the user interface creation both on the
    web component developer side and on the web component user side.


    From the web component developer perspective, we introduced native templates and
    discovered that they provide us with a declarative approach to define a UI. Native
    HTML templates also offer an efficient way to render HTML elements. We used the
    native template approach to redesign the cookie alert component we developed till
    then.


    From the web component user perspective, we discovered that native templates allow
    them to compose our web components with customized markup. We can enable this
    composition by using `<slot>` elements. Slots allow us to define placeholders
    where the users can add customized markup in a really easy way.


    With the feature you learned in this chapter, you will be able to build flexible,
    efficient, and maintainable UIs for your web component, almost without writing
    any JavaScript line.


    In the next chapter, we will discuss how to package the web components we build
    to be easily imported and used by other developers. You will learn the different
    ways to achieve this goal and its benefits and drawbacks.


