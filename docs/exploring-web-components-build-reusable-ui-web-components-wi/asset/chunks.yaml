    # [Objectives](#toc.xhtml_s77a)


    This chapter will make you aware of the issues that may occur to Web Components
    when they are immersed in an unknown web page. You will be able to prevent these
    issues by using the shadow DOM. Also, you will learn about the open and closed
    shadow DOM and decide which type to use for your component.


    # [Web Components and the DOM](#toc.xhtml_s78a)


    As you’ve seen so far, DOM manipulation is an essential part of creating custom
    elements and hence web components. The ability to perfectly integrate into the
    DOM makes your web components almost indistinguishable from standard HTML elements.
    However, this same DOM integration capability is somehow a problem for components.
    Being so integrated into the DOM leads to some issues that prevent web components
    from being true components, that is, UI elements with their look and behavior
    that can be easily reused.


    Let’s take a look at the problems that this tight integration may generate.


    # [The global DOM](#toc.xhtml_s79a)


    The `DOM` is an object-based representation of the HTML elements on a page. This
    means that element in an HTML page is represented by an object in the DOM tree.
    This is true for both standard HTML elements and custom elements. However, since
    custom elements are usually built up with HTML elements and other custom elements,
    you end up having all their composing items in the DOM tree.


    Consider the usual HTML page containing our cookie alert web component:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    If you use the tool of your favorite browser to inspect the generated HTML, for
    example, the `Developer Tools` in Chrome, you should see the markup shown by the
    following screenshot:


    ![](images/Figure_6.1.jpg)


    **Figure 6.1**


    As you can see, our custom tag `<cookie-alert>` contains the markup corresponding
    to the DOM of the custom element. It includes the style element and the `<div>`
    with the text and the buttons you added via JavaScript.


    These elements are integrated into the page’s DOM, so they work like any other
    element on the page. For example, you can access the text of the cookie alert
    with the following code:


    `document.querySelector("div.container span").innerText`


    Of course, it makes more sense using the message property of the component to
    get the text, as follows:


    `document.querySelector("cookie-alert").message`


    However, nobody prevents you from accessing the internal DOM structure of your
    web component. The DOM is like a global variable: any piece of code can access
    it and change its value. And like a global variable, it brings with it all its
    flaws, as we will see in the next section.


    # [The problem with the DOM](#toc.xhtml_s80a)


    While the previous example may be a choice of the developer using your component,
    other pitfalls may occur when your component is inserted into a page with arbitrary
    complexity. Consider, for example, an HTML page like the following:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    </style>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    You have a CSS rule defining the border style and the background color for the
    `button` elements on the current page. Also, you have a button element in the
    page, just below the header. Running this page, you will get the following result:


    ![](images/Figure_6.2.jpg)


    **Figure 6.2**


    As you can see, the CSS rule has been applied not only to the button on the page
    but also to the buttons embedded into the cookie alert component. This may be
    disappointing.


    Also, consider the following markup:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    .container {

    background-color: gray;

    }

    </style>

    </head>

    <body class="container">

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    You added a new CSS rule defining a container class with a gray background, and
    applied this class to the document’s body. According to this rule, you would expect
    a gray background for the page. Instead, the HTML page will be rendered, as shown
    in the following screenshot:


    ![](images/Figure_6.3.jpg)


    **Figure 6.3**


    The page’s background is not gray, as stated by the page-level CSS rule, but blue,
    as defined by the component-level CSS rule. What happened is an accidental name
    clash between the page-level and component-level CSS classes.


    Of course, the user should not be required to know the internal details of our
    component. So, both these examples might make you question the real effectiveness
    of Web Components technologies.


    To make things worse, assume you add a few lines of JavaScript to this HTML page,
    like in the following:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    <style>

    button {

    border-style: dotted;

    background-color: red !importan

    }

    .container {

    background-color: gray;

    }

    </style>

    <script>

    window.addEventListener("load", ()=>{

    let buttons = document.querySelectorAll("button");

    buttons.forEach((btn)=>{

    btn.disabled = true;

    });

    });

    </script>

    </head>

    <body class="container">

    <h1>Here is your Web Component</h1>

    <button>Click here!</button>

    <cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>

    </body>

    </html>

    ```


    You added a script that disables all buttons in the current page. Maybe it fulfills
    some specific logic to manage the user’s elements on the page. However, this code
    also affects the buttons inside the cookie alert.


    All these examples should make it clear that the internal implementation of your
    web component is not safe. External code can affect your component, accidentally
    or intentionally. In other words, your web component lacks encapsulation.


    Encapsulation is the ability of an object to hide its internal representation
    and behavior. It allows you to design an object or component so that it can interact
    with the external world via its public interface while keeping private its internal
    state. This feature allows you to decouple the internal behavior of your component
    from the external world. It let you change the internal representation or behavior
    without affecting the public interface and the external world. In other words,
    the encapsulation makes your component be an actual component.


    # [DOM encapsulation attempts](#toc.xhtml_s81a)


    So, we just discovered that the current implementation of our cookie alert component
    is not safe from external interferences. Since encapsulation is a required feature
    for a component, how can we fix this annoying problem?

