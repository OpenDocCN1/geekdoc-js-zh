    ```

    updateMessage() {


    this.querySelector("span").innerText = this._message;


    }

    ```


    As you can see, here we added the `updateMessage()` method, which assigns the
    new value of the private `_message` property to the UI, and called it from the
    setter. Actually, we could use the `updateMessage()` method also from inside the
    `createComponent()` method, for improving our code. So, after a bit of refactoring,
    the class `CookieAlert` looks as follows:


    ```

    const styleRules = ‘


    .container {


    color: rgb(255, 255, 255);


    background-color: rgb(35, 122, 252);


    padding: 1em 1.8em;


    width: 100%;


    font-family: Helvetica,Calibri,Arial,sans-serif;


    }


    .footer {


    position:fixed;


    left:0px;


    bottom:0px;


    }


    ‘;


    class CookieAlert extends HTMLElement {


    constructor() {


    super();


    this._message = "This website uses cookies to ensure you get the best experience";


    }


    connectedCallback() {


    this.createComponent();


    }


    get message() {


    return this._message;


    }


    set message(value) {


    this._message = value;


    this.updateMessage();


    }


    createComponent() {


    const style = document.createElement("style");


    style.appendChild(document.createTextNode(styleRules));


    this.appendChild(style);


    const span = document.createElement("span");


    const div = document.createElement("div");


    div.classList.add("container", "footer");


    div.appendChild(span);


    this.appendChild(div);


    this.updateMessage();


    }


    updateMessage() {


    this.querySelector("span").innerText = this._message;


    }


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    Now, our component has a `message` property that allows the user to assign their
    custom text via JavaScript. This means that now we can put our cookie alert component
    in an HTML page as in the following example:


    ```

    <cookie-alert id="myAlert"></cookie-alert>

    ```


    And on the same page we can add a script setting a customized text via JavaScript
    like the following code shows:


    ```

    window.onload = function() {


    const myAlert = document.getElementById("myAlert");


    myAlert.message = "We use cookies, but respect your privacy!";


    };

    ```


    This text will appear instead of the default one, as shown in the following screenshot:


