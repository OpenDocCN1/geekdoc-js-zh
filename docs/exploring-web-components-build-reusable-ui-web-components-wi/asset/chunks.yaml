    color: rgb(255, 255, 255);


    background-color: transparent;


    border-color: rgb(255, 255, 255);


    padding: 5px 40px;


    margin-right: 50px;


    cursor: pointer;


    float:right;


    }


    </style>


    <div class="container footer">


    <slot id="message" name="message"></slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘


    };


    define("cookie-alert", CookieAlert);

    ```


    `render()`方法创建并更新你的 Web 组件的 DOM 结构。它与内置模板引擎协同工作。


    Hybrids 使用的 HTML 模板引擎类似于`lit-html`库的`html()`函数。然而，即使语法非常相似，其实现方式却不同。


    # 属性和特性


    要向组件添加属性和特性，你需要将其定义附加到`CookieAlert`对象上。最简单的方式是，你可以像下面这样向 cookie alert 组件添加`message`属性：


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    message: "This website uses cookies to ensure you get the best experience",


    render: ({message}) => html‘


    <style>


    //…


    </style>


    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘


    };


    define("cookie-alert", CookieAlert);

    ```


    你添加了带有默认文本的`message`属性。这是定义属性的基本方式。


    通常，Hybrids 库允许你提供一个属性描述符来定义属性。属性描述符是一个普通对象，其一般形式如下所示：


    ```

    const MyElement = {


    propertyName: {


    get: (host, lastValue) => {…},


    set: (host, value, lastValue) => {…},


    connect: (host, key, invalidate) => {


    …


    // disconnect


    return () => {…};


    },


    observe: (host, value, lastValue) => {…},


    }


    };

    ```


    `get()`和`set()`方法定义了属性的 getter 和 setter。它们有一些参数，允许你正确地管理属性的值。特别是，它们的第一个参数（示例中的`host`）代表当前组件实例。该参数被显式传递，使你无需依赖`this`关键字。getter
    和 setter 必须返回新的属性值。


    `connect()`和`observe()`方法允许你在组件被添加到 DOM 时以及属性值发生变化时执行代码。


    Hybrids 为你提供了一些内置的属性工厂，即返回预定义属性配置的函数。`property()`函数就是这些工厂之一。它允许你按以下方式定义属性：


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    message: property("This website uses cookies to ensure you get the best experience"),


    //…


    };


    define("cookie-alert", CookieAlert);

    ```


    `property()`工厂返回`message`属性的标准配置，并带有默认字符串值。它还将该属性与同名的特性（attribute）连接起来。


    **当组件被添加到 DOM 时，特性的值仅被赋值给对应的属性一次。这意味着特性应仅用于在 HTML 标记中设置静态值。对特性的更改不会自动反映到对应的属性中。**


    我们上面使用的方法，即简单地将字符串赋值给`message`属性，只是使用`property()`工厂的一种快捷方式。在 Hybrid 术语中，这种快捷方式被称为**翻译**。


    总结一下，你有多种方式来定义属性。每种方式取决于你对属性定义所需的灵活性程度。


    为了完成对属性和特性的概述，你需要知道 Web 组件配置对象中的每一项都是独立的。这意味着没有内部状态，对属性的任何引用都必须显式。这就是为什么上面 cookie
    alert 定义的`render()`方法将`{message}`对象作为参数的原因：


    ```

    render: ({message}) => html‘


    <style>


    //…


    </style>


    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘

    ```


    由于你需要在 UI 模板中使用`message`属性，你必须显式地传递它。更一般地说，你必须传递一个包含所有需要在`render()`方法中使用的属性的对象。


    # 事件


    要在 Web 组件的模板中添加事件监听器，你可以简单地使用在标准 HTML 元素上使用的`onevent`语法。例如，要处理 cookie alert 组件两个按钮的点击事件，你可以像下面这样做：


    ```

    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton"


    class="button"


    onclick="${(host)=> host.style.visibility = "hidden"}">


    Close


    </button>


    <button id= "acceptButton"


    class="button"


    onclick="${accept}">


    Accept


    </button>


    </div>

    ```


    你为第一个按钮的`onclick`属性分配了一个箭头函数，为第二个按钮分配了`accept()`函数。`accept()`函数是在当前模块中定义的一个普通函数，如下所示：


    ```

    function accept(host) {


    host.style.visibility = "hidden";


    setCookie("cookiesAccepted", "y", 365);


    host.dispatchEvent(new CustomEvent("accepted", {


    detail:{


    acceptedCookieName: "cookiesAccepted",


    acceptedCookieExpiration: 365}


    }));


    }

    ```


    这里唯一需要注意的主要事情是`host`参数。如前所述，它代表组件的当前实例。


    # 生命周期


    为了完成我们的 cookie alert 组件的实现，我们需要在组件被添加到 DOM 时检查是否设置了接受 cookie。为了实现这一点，我们需要重新安排`message`属性定义，以便在组件被添加到
    DOM 时进行拦截。实际上，Hybrids 库没有针对组件生命周期的全局事件。这些事件是基于每个属性的。


    因此我们重新定义`message`属性定义如下：


    ```

    export const CookieAlert = {


    message: {


    get: (host, lastValue = message) => lastValue,


    set: (host,value) => value,


    connect: checkCookie


    },


    render: ({message}) => html‘


    //…


    ‘


    };

    ```


    我们为属性指定了 getter 和 setter，以及`connect()`方法，该方法将在组件被添加到 DOM 时执行。请记住，这内部对应于`connectedCallback()`回调。换句话说，所有与组件属性定义关联的`connect()`方法都会在`connectedCallback()`回调运行时执行。


    `checkCookie()`函数定义如下：

    '
- fmt: '

    ```

    function checkCookie(host) {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    host.style.visibility = "hidden";

    }

    }

    ```


    Again, notice the `host` parameter passed to represent the current component instance.


    If you want to execute some code when the component is removed from the DOM, the
    `connect()` method has to return the function to execute in that case. This way,
    the `connect()` method registers a function that will be executed when the `disconnectedCallback()`
    reaction runs.


    # Slim


    The Slim library aims to simplify the definition of your Web Components by reducing
    the amount of code you need to write. It relies on the class-based approach but
    provides a slightly different model and lifecycle events.


    To start working with the Slim library, you need to install it with the following
    command:


    `npm install slim-js`


    # Basic infrastructure


    As we did with other libraries, let''s implement the cookie alert component by
    starting with the basic definition of a component:


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    "<div>Web Component</div>",

    class CookieAlert extends Slim {

    get useShadow() { return true }

    });

    ```


    The `Slim` object imported from the `slim-js` module allows you to do everything
    you need to create a Web Component. Its `tag()` method takes three parameters:


    * The name of the tag associated with the component.

    * The markup defines the UI template for the component.

    * The class that defines the logic of the component.


    As you can see, the `CookieAlert` class that defines our component extends the
    class. In that basic example, you may note that we added the `useShadow()` getter
    which returns the true value. This getter enables Slim to use the Shadow DOM for
    the component. In fact, by default, Slim-based components don''t use the Shadow
    DOM.


    The library also provides a syntax based on decorators. In this case, the equivalent
    code for the basic infrastructure of the cookie alert component will be the following:


    ```

    import {Slim} from ''slim-js'';

    import {tag, template} from ''slim-js/Decorators'';


    @tag("cookie-alert")

    @template("<div>Web Component</div>")

    @useShadow(true)

    class CookieAlert extends Slim {

    }

    ```


    Very easy and compact!


    # Templates and UI


    Creating the UI of a component with `Slim` is just a matter of specifying the
    string representing the template you want to use. For example, the following code
    shows how to add the basic UI markup for the cookie alert component:


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    .button {

    color: rgb(255, 255, 255);

    background-color: transparent;

    border-color: rgb(255, 255, 255);

    padding: 5px 40px;

    margin-right: 50px;

    cursor: pointer;

    float:right;

    }

    </style>

    <div class="container footer">

    <slot id="message" name="message"></slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button">Close</button>

    <button id= "acceptButton" class="button">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    get useShadow() { return true }

    });

    ```


    We will see in a moment that this template allows you to specify placeholders.


    # Properties and attributes


    A component property in `Slim` is nothing but property in the class definition.
    If you want to initialize it, you need to do it in the constructor. The following
    code shows how to implement the `message` property for the cookie alert component:


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    //…

    </style>

    <div class="container footer">

    <slot id="message" name="message">{{message}}</slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button">Close</button>

    <button id= "acceptButton" class="button">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    constructor() {

    super();

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    get useShadow() { return true }

    });

    ```


    You see that the property is defined and initialized in the constructor. Notice
    the call to `super()` in the constructor as well. Once you have defined the `message`
    property, you can use it in the UI template by specifying it between double curly
    brackets.


    However, in this case, the `message` property is not bound to a `message` attribute.
    To map a property to an attribute, you need to use the decorator-based syntax,
    as in the following example:


    ```

    import {Slim} from ''slim-js'';

    import {tag, template, attribute} from ''slim-js/Decorators'';


    @tag("cookie-alert")

    @template("<div>Web Component</div>")

    @useShadow(true)

    class CookieAlert extends Slim {

    @attribute

    message

    }

    ```


    In this case, you are using the `@attribute` decorator associated with the public
    `message` property.


    **Consider that, at the time of writing, the JavaScript syntax using decorators
    and property definitions are still not officially a supported standard. To use
    them, you need to use a specific transpiler like TypeScript or Babel opportunely
    configured.**


    # Events


    Dealing with events is easy. You can add the event name as an attribute to the
    HTML element in the template and associate the event listener you define as a
    method of the class. To better explain, take a look at the following code:


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    //…

    </style>

    <div class="container footer">

    <slot id="message" name="message">{{message}}</slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button" click="hide">Close</button>

    <button id= "acceptButton" class="button" click="accept">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    constructor() {

    super();

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    get useShadow() { return true }

    hide() {

    this.style.visibility = "hidden";

    }

    accept() {

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    }

    });

    ```


    Here, the close and accept buttons have the `click` attribute. Each attribute
    has a string assigned: `hide` and `accept`. These are the names of the methods
    you attached to the `CookieAlert` class. These methods are the event listeners
    for the click event.


    Note also that the mechanism to generate a custom event remains the same.


    # Lifecycle


    To complete our implementation, we need to check if the user has accepted the
    cookie policy before showing the alert. As we know, this means we need to check
    if the acceptance cookie has been set. To make sure it will we checked before
    rendering the message, we have to do this in the `BeforeCreated` lifecycle event,
    as shown below:


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘

    //…

    ‘,

    class CookieAlert extends Slim {

    onBeforeCreated() {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    this.style.visibility = "hidden";

    }

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    //…

    });

    ```


    The `onBeforeCreated()` method is called when the `BeforeCreated` event happens.
    `Slim` generates a few lifecycle events for its components. To manage them, you
    should implement the following methods:


    * `onBeforeCreated()`: This method is executed before the component is created.

