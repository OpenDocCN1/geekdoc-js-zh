    在这个例子中，我们定义了 `accept()` 方法，并在 `onClick` 监听器中使用了它。有趣的是，我们如何生成 accepted 事件。我们使用了
    `@Event` 装饰器来声明 accepted 事件发射器，并通过其 `emit()` 方法创建它。


    `Stencil` 还提供了 `@Listen` 装饰器，允许你监听组件上的事件。


    # 生命周期


    和往常一样，构建 cookie 警告组件的最后一步是检查用户是否接受了 cookie 策略。我们可以通过添加 `connectedCallback()` 方法来实现，就像我们在纯
    JavaScript 版本的组件中所做的那样。


    `connectedCallback()` 方法如下所示：


    ```

    connectedCallback() {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    this.element.style.visibility = "hidden";

    }

    }

    ```


    除了标准的 `connectedCallback()` 和 `disconnectedCallback()` 反应之外，`Stencil` 还提供了其他几个生命周期方法：


    *   `connectedCallback()`：当组件被附加到 DOM 时调用。


    *   `componentWillLoad()`：在组件第一次被附加到 DOM 后立即调用一次。


    *   `componentDidLoad()`：在组件加载完成且第一次 `render()` 运行后立即调用一次。


    *   `componentWillRender()`：在每次 `render()` 执行之前调用。


    *   `componentDidRender()`：在每次 `render()` 执行之后调用。


    *   `componentWillUpdate()`：当组件即将更新时调用。


    *   `componentDidUpdate()`：在组件更新之后调用。


    *   `disconnectedCallback()`：当组件从 DOM 中移除时调用。


    # 结论


    本章通过概述 Web Components 周围不断发展的生态系统来结束本书。你了解到 Web Component 技术的某些特性可能被视为底层特性，需要
    DOM 知识和重复代码。我们在本章中探讨的库旨在简化开发体验。


    你探索了来自 `Polymer` 项目的 `LitElement`，并使用了其依赖于 `LitElement` 基类的开发方法。你遇到了 `Hybrids`，它提出了一种基于普通对象和纯函数的函数式方法。此外，你还应用了
    `Slim` 库的极简类模型。最后，你使用了 `Stencil`，其语法介于 Angular 和 React 之间，用于生成纯 JavaScript 的 Web
    Components。


