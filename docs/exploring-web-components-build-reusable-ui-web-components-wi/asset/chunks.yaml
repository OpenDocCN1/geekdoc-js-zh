    然而，Web 组件的内部结构仍然可以通过影子宿主元素的 `shadowRoot` 属性访问。例如，你可以使用以下代码禁用 HTML 页面中 cookie 提醒组件的按钮：


    ```

    const cookieAlert = document.querySelector("cookie-alert");

    const componentDOM = cookieAlert.shadowRoo

    let buttons = componentDOM.querySelectorAll("button");

    buttons.forEach((btn)=>{

    btn.disabled = true;

    });

    ```


    你访问了组件的 `shadowRoot` 属性，并将其当作常规 DOM 使用。当然，这是你故意访问组件的内部结构。因此，你只受到保护，免受意外干扰，而任何开发者都可以更改你组件的结构。


    这取决于你选择附加到组件的影子 DOM 类型。请看将影子 DOM 附加到 cookie 提醒组件的语句：


    `this.attachShadow({mode: "open"});`


    我们向 `attachShadow()` 方法传递了一个指定选项的对象。这个对象告诉我们影子 DOM 模式应为开放。开放的影子 DOM 可以通过 `shadowRoot`
    属性在组件外部访问。因此，我们上面注意到的行为是设计使然。


    如果你不想将组件的影子 DOM 暴露给外部世界，你需要一个封闭的影子 DOM。你可以通过将 `closed` 值指定为影子 DOM 模式，将封闭的影子 DOM
    附加到你的组件。


    以下代码展示了如何更改 cookie 提醒构造函数以启用封闭的影子 DOM：


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this._shadowRoot = this.attachShadow({mode: "closed"});

    this._onAcceptedListener = null;

    }

    ```


    在创建开放影子 DOM 时，我们使用了 `attachShadow()` 方法，然后使用 `shadowRoot` 属性来追加和操作内部 DOM。我们没有将
    `attachShadow()` 方法的结果赋值给任何变量。`attachShadow()` 方法的作用是将根节点添加到影子宿主的 `shadowRoot`
    属性中。


    当你通过向 `attachShadow()` 方法传递 `{mode: "closed"}` 来附加封闭影子 DOM 时，`shadowRoot` 属性仍然返回
    `null`。这阻止了从外部访问 DOM。在这种情况下，要从组件内部访问影子 DOM，你必须将 `attachShadow()` 方法的结果赋值给一个变量。在上面的例子中，我们将封闭的影子
    DOM 赋值给了内部属性 `_shadowRoot`。


    请注意，像示例中那样使用 `this._shadowRoot` 属性，你的组件的影子 DOM 并非完全不可访问。遍历组件属性的用户会弄清楚 `_shadowRoot`
    属性的含义，并仍然使用它来访问其内部结构。要尝试锁定组件的影子 DOM，你应该将其赋值给一个局部变量、一个 `WeakMap` 或一个私有属性（当私有属性成为标准并被广泛支持时）。


    **请记住，封闭的影子 DOM 并非安全措施。用户仍然可以影响你组件的影子 DOM，甚至只需使用影子宿主元素的** `attachShadow()` **方法即可。**


    因此，我们将 cookie 提醒组件的封闭影子 DOM 赋值给了对 `_shadowRoot` 属性的引用。从现在开始，任何对内部 DOM 的操作都将通过这个属性进行。以下是
    `createComponent()` 方法的修订代码：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this._shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this._shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    此外，`updateMessage()` 方法也需要更改，以引用 `this._shadowRoot` 属性：


    ```

    updateMessage() {

    this._shadowRoot.querySelector("span").innerText = this._message;

    }

    ```


    现在，当你运行项目时，cookie 提醒组件将继续像以前一样工作。但如果你使用浏览器的检查器查看生成的标记，你会发现类似以下内容：


    ![](img/Figure_6.7.jpg)


    **图 6.7**


    影子 DOM 的标记不再可用。


    那么，此时你可能会想，应该为你的 Web 组件使用哪种类型的影子 DOM——开放还是封闭？


    当然，这是一个设计选择。你可以选择阻止访问组件的内部结构，并允许用户仅通过公共属性和方法与之交互。然而，这意味着你应该精确设计组件的公共接口，以确保其所有可能的用途。考虑到你的组件的用户不仅可以在他们的页面中添加它，还可以扩展你的组件。在这种情况下，访问影子
    DOM 可能有助于根据用户的需求调整其外观和行为。


    # 结论


    在本章中，你发现到目前为止构建的 cookie 提醒组件尚未准备好成为一个真正的组件。它缺乏封装性。你了解到这是由于 DOM 的全局性造成的，并经历了一些情况，其中这一点会以不必要的干扰影响你的组件。传统上用于克服此问题的方法基于
    iframe，但这种方法复杂且无法解决问题。我们解释了解决封装性缺失的方案是影子 DOM。我们在 cookie 提醒组件中使用了这一特性，并展示了应用它有多么容易。最后，我们讨论了开放和封闭影子
    DOM 之间的区别。


    现在，在本章结束时，你已经掌握了创建真正组件的技术，这些组件的内部结构不会受到外部干扰的影响。


    在下一章中，你将学习如何通过利用 HTML 模板来简化 Web 组件 UI 的定义。此外，你还将学习如何使你的组件更加灵活，允许用户在组件内部添加其他 HTML
    元素。


    # 问题


    1.  什么是封装？

    2.  为什么封装是组件的一个理想特性？

    3.  为什么全局 DOM 不支持封装？

    4.  提供某种封装形式的传统方法是什么？

    5.  什么是影子 DOM？

    6.  影子宿主和影子根之间的区别是什么？

    7.  为你的 Web 组件添加影子 DOM 支持的方法是什么？

    8.  如何防止用户访问影子 DOM？

    9.  开放和封闭影子 DOM 之间的区别是什么？


    # 第 7 章


    # 使用 HTML 模板


    尽管并非严格必需，但大多数 Web 组件都有一个 UI 来显示数据和图形，并允许用户与之交互。我们在前几章中学习了如何为我们的 Web 组件创建 UI，并对我们的
    cookie 提醒组件应用了几种不同的技术。


