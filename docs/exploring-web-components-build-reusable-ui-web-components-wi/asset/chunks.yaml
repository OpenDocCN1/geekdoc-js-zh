  trans: "\n即使在 React 应用中使用 Web Components 是可行的，你也不能期望它们遵循这个流行库的声明式编程模型。Web Components\
    \ 使用典型的 DOM 编程方式，通常是命令式的。因此，在 React 应用中使用 Web Components 时，你不应期望它们像 React 组件那样工作。例如，Web\
    \ Components 生成的事件可能无法在 React 组件结构中正确传播。此外，React 组件的典型响应性也无法得到保证。\n\n另外，React\
    \ 会将标准 HTML 元素包装成一个组件，以便在其生态系统中获得集成行为。如果你想获得同样的效果，你应该自己用 React 组件包装你的 Web Component，我们稍后会看到这一点。\n\
    \n# Web Components 与 Angular\n\n在 Angular 应用中使用 Web Component 需要采用与我们为 React 介绍的类似方法。不过，这里有一些具体的步骤。那么，让我们通过构建一个\
    \ Angular 示例应用并使用我们的 cookie 提醒组件来看看它是如何工作的。\n\n与 React 类似，在 Angular 中，我们也将使用一个工具来帮助我们快速搭建一个简单的应用。我们将使用\
    \ Angular CLI，所以请确保你已经安装了它，否则请使用以下命令安装：\n\n`npm install -g @angular/cli`\n\n安装好\
    \ CLI 后，运行以下命令创建一个最小的 Angular 应用：\n\n`ng new angular-app-cookie-alert --minimal\
    \ --routing=false --style=css`\n\n该命令会在 `angular-app-cookie-alert` 文件夹中创建一个非常简单的应用。尽管它很简单，但足以用于我们的演示。\n\
    \n切换到 `angular-app-cookie-alert` 文件夹，并输入以下命令来安装我们的 cookie 提醒组件：\n\n`npm install\
    \ andychiare/cookie-alert-demo`\n\n此时，你应该注意一个问题。我们的 cookie 提醒组件是用 JavaScript 编写的，而\
    \ Angular 应用的默认语言是 TypeScript。因此，为了避免错误，你需要在 `tsconfig.json` 配置文件中添加 `\"allowJs\"\
    ` 设置作为 TypeScript 编译器选项。你的 `tsconfig.json` 文件应该类似于以下内容：\n\n```\n{\n  \"compileOnSave\"\
    : false,\n  \"compilerOptions\": {\n    \"allowJs\": true,\n    \"baseUrl\": \"\
    ./\",\n    …其他选项…\n  },\n  \"angularCompilerOptions\": {\n    …其他选项…\n  }\n}\n\
    ```\n\n在 Angular 应用中使用我们的 Web Component 之前，你还需要做另一个小调整。实际上，默认情况下，Angular 会尝试将任何非标准的\
    \ HTML 元素解释为 Angular 组件。因此，当它遇到 `<cookie-alert>` 标签时，会抛出错误。为了避免这种情况，你需要启用自定义元素。\n\
    \n为此，打开 `src/app/app.module.ts` 文件，并将其内容修改如下：\n\n```\nimport { BrowserModule }\
    \ from '@angular/platform-browser';\nimport { NgModule, CUSTOM_ELEMENTS_SCHEMA\
    \ } from '@angular/core';\nimport { AppComponent } from './app.component';\n\n\
    @NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule\n\
    \  ],\n  schemas: [CUSTOM_ELEMENTS_SCHEMA],\n  providers: [],\n  bootstrap: [AppComponent]\n\
    })\nexport class AppModule { }\n```\n\n按照高亮的部分，你导入了 `CUSTOM_ELEMENTS_SCHEMA` 模块，并将其配置为应用的参考模式。\n\
    \n现在，我们准备在这个应用中使用我们的 Web Component。\n\n让我们先看看如何在 `AppComponent` 组件的模板中使用 cookie\
    \ 提醒组件。编辑 `src/app/app.component.ts` 文件，将其内容修改如下：\n\n```\nimport { Component }\
    \ from '@angular/core';\nimport 'cookie-alert-demo';\n\n@Component({\n  selector:\
    \ 'app-root',\n  template: `\n    <!--下面的内容只是一个占位符，可以替换。-->\n    <div style=\"\
    text-align:center\" class=\"content\">\n      <h1>\n        欢迎来到 {{title}}！\n\
    \      </h1>\n      …\n    </div>\n    <h2>以下是一些帮助您入门的链接：</h2>\n    <ul>\n   \
    \   …\n    </ul>\n    <cookie-alert></cookie-alert>\n  `,\n  styles: []\n})\n\
    export class AppComponent {\n  title = 'angular-app-cookie-alert';\n}\n```\n\n\
    在这个简单的第一步中，你导入了 `cookie-alert-demo` 模块，并在 Angular `Component` 的模板中使用了 `<cookie-alert>`\
    \ 标签。与 React 的情况一样，这里你也像使用标准 HTML 元素一样使用 cookie 提醒组件。\n\n要查看组件的实际效果，在终端窗口中运行 `ng\
    \ serve`，然后将浏览器指向 `http://localhost:4200` 地址。你应该会看到类似下面的页面：\n\n![](img/Figure_9.2.jpg)\n\
    \n**图 9.2**\n\n正如预期的那样，提醒出现在页面底部，并且正常工作。\n\n就像我们在 React 中所做的那样，让我们看看如何使用不同的方法自定义提醒消息。为\
    \ `message` 属性赋值是最简单的方法。以下代码展示了如何应用这种基本方法：\n\n```\nimport { Component } from '@angular/core';\n\
    import 'cookie-alert-demo';\n\n@Component({\n  selector: 'app-root',\n  template:\
    \ `\n    //…\n    <cookie-alert message=\"我们使用 cookie，但尊重您的隐私！\"></cookie-alert>\n\
    \  `,\n  styles: []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n\
    }\n```\n\n如你所见，没什么特别的。但是，如果你想将计算出的值作为提醒中显示的文本，该怎么办？考虑以下示例：\n\n```\nimport { Component\
    \ } from '@angular/core';\nimport 'cookie-alert-demo';\n\n@Component({\n  selector:\
    \ 'app-root',\n  template: `\n    //…\n    <cookie-alert [message]=\"cookieMessage\"\
    ></cookie-alert>\n  `,\n  styles: []\n})\nexport class AppComponent {\n  title\
    \ = 'angular-app-cookie-alert';\n  cookieMessage = '我们使用 cookie，但尊重您的隐私！';\n}\n\
    ```\n\n在这里，你为 `AppComponent` 组件创建了一个 `cookieMessage` 属性，并为其分配了文本。然后，在模板的标记中，将这个\
    \ `cookieMessage` 属性映射到 cookie 提醒组件的 `message` 属性。注意你是如何无缝地使用 Angular 绑定语法的。\n\
    \n要处理 Web Component 生成的事件，请看以下代码：\n\n```\nimport { Component } from '@angular/core';\n\
    import 'cookie-alert-demo';\n\n@Component({\n  selector: 'app-root',\n  template:\
    \ `\n    //…\n    <cookie-alert\n      [message]=\"cookieMessage\"\n      (accepted)=\"\
    showThanks()\">\n    </cookie-alert>\n  `,\n  styles: []\n})\nexport class AppComponent\
    \ {\n  title = 'angular-app-cookie-alert';\n  cookieMessage = '我们使用 cookie，但尊重您的隐私！';\n\
    \  showThanks() {\n    alert(\"感谢您接受我们的 cookie 政策！\");\n  }\n}\n```\n\n你为 `AppComponent`\
    \ 组件定义了 `showThanks()` 方法，并将其分配给 `accepted` 事件。注意，即使在这种情况下，你也像往常一样使用了 Angular\
    \ 绑定语法。\n\n请记住，如果你需要访问事件的详细信息，可以像普通的 Angular 方式一样，在 `showThanks()` 方法中使用 `$event`\
    \ 对象。\n\n当使用旨在用于 Angular 表单的 Web Components 时，你需要特别注意。例如，考虑这样一种情况：你有一个作为 Web Component\
    \ 创建的自定义输入元素，并且你想在表单中使用它，如下例所示：\n\n```\n<form [formGroup]=\"form\" (ngSubmit)=\"\
    send()\">\n  <custom-input\n    type=\"text\"\n    label=\"输入您的数据\">\n  </custom-input>\n\
    \  <input type=\"submit\" value=\"提交\">\n</form>\n```\n\n在这个例子中，我们在 Angular 表单中使用了虚构的\
    \ `<custom-input>` Web Component。默认情况下，Angular 会增强标准 HTML `input` 元素，使其能够与表单 API\
    \ 交互。Angular 表单会在其子元素中寻找一个 `value accessor`，即一种允许你访问控件值的特性。`value accessor` 是一个实现了\
    \ `ControlValueAccessor` 接口的指令，它允许原生 HTML 元素与 Angular 表单通信。因此，Angular 通过附加这个 `value\
    \ accessor` 来操作标准 HTML 元素。\n"
- fmt: '

    However, Angular doesn’t know anything about your web component. So, you need
    to add a `value accessor` to your component on your own. This basically means
    to add the `ngDefaultControl` directive to your component, as shown in the following
    code:


    ```

    <form [formGroup]="form" (ngSubmit)="send()">

    <custom-input

    type="text"

    label="Enter your data"

    ngDefaultControl>

    </custom-input>

    <input type="submit" value="Submit">

    </form>

    ```


    With this simple change, your web component integrates with Angular forms.


    # Web Components and Vue


    Let’s see how to use Web Components in a Vue application by using the cookie alert
    component, as we already showed with React and Angular.


    Even in this case, we are going to use a tool to set up a Vue application quickly
    - Vue CLI. Make sure you have it installed, otherwise install it with the following
    command:


    `npm install -g @vue/cli`


    To create a basic application, run the following command in a Terminal window:


    `vue create vue-app-cookie-alert --default`


    After the command executed, you will find the `vue-app-cookie-alert` folder containing
    the code of the Vue application. So, as usual, install the cookie alert package
    by typing the following command:


    `npm install andychiare/cookie-alert-demo`


    Similarly, to the Angular case, Vue would attempt to consider non-standard elements
    like Vue components. Of course, this will lead to errors, since the compiler will
    not find a Vue component implementing the `<cookie-alert>` tag. So, you need to
    tell Vue that the `<cookie-alert>` element has to be ignored. To achieve this
    result, open the `src/main.js` file and update its content as shown in the following
    code snippet:


    ```

    import Vue from ''vue''

    import App from ''./App.vue''

    Vue.config.productionTip = false

    Vue.config.ignoredElements=[

    ''cookie-alert''

    ]

    new Vue({

    render: h => h(App),

    }).$mount(''#app'')

    ```


    You added the `cookie-alert` tag name in the list of the ignored elements of Vue’s
    configuration.


    Now, open the `src/App.vue` component and change the content of the template and
    script sections as shown by the following code:


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    }

    }

    </script>

    <style>

    #app {

    font-family: Avenir, Helvetica, Arial, sans-serif;

    -webkit-font-smoothing: antialiased;

    -moz-osx-font-smoothing: grayscale;

    text-align: center;

    color: #2c3e50;

    margin-top: 60px;

    }

    </style>

    ```


    In the script section, you imported the `cookie-alert-demo` module. In the template
    section, you simply used the `<cookie-alert>` tag.


    To see the effect of these changes, run the `npm run serve` command and point
    your browser to the `http://localhost:8080` address. You will see a page similar
    to the following:


    ![](images/Figure_9.3.jpg)


    **Figure 9.3**


    Customizing the cookie alert component is as easy as in the Angular case. To assign
    a different text message, you can set the desired value to the `message` attribute
    of the component, as shown in the following snippet:


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert message= "We use cookies, but respect your privacy!"></cookie-alert>

    </div>

    </template>

    //…

    ```


    If you want to assign a value to the `message` property of the cookie alert component,
    you can do it as shown in the following example:


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert :message= "cookieMessage"></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    },

    data: function() {

    return {

    cookieMessage: ''We use cookies, but respect your privacy!''

    }

    }

    }

    </script>

    //…

    ```


    In this example, you created a `cookieMessage` property for the App component
    and assigned it to the message property using the typical Vue binding syntax.


    Similarly, to handle the accepted event of the cookie alert component, add a `showThanks()`
    method to the App component and assign it to the `accepted` event by using the
    @ prefix. The following code shows the code:


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert :message= "cookieMessage" @accepted="showThanks"></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    },

    data: function() {

    return {

    cookieMessage: ''We use cookies, but respect your privacy!''

    }

    },

    methods: {

    showThanks: function() {

    alert("Thanks for accepting our cookie policy!");

    }

    }

    }

    </script>

    //…

    ```


    As you can see, also in Vue, using a web component is pretty straightforward.


    # Building web components with UI Frameworks


    The previous section guided you in using web components within applications built
    with three popular UI frameworks - *React, Angular, and Vue*. We saw how integrating
    web components with these frameworks are, in general, pretty easy. But also we
    saw you have to take care of a few caveats to tackle some issues depending on
    the specific framework.


    You could face these issues more organically by applying a general strategy. For
    example, you could wrap your web component with a *React, Angular,* or *Vue* component.
    This way, you encapsulate the integration issues right in the framework component
    definition, offering a better integration experience. But this doesn’t change
    the general approach in integrating Web Components with other UI frameworks.


    Some UI frameworks provide a way to create web components using their syntax and
    semantics instead of directly using JavaScript and the DOM. You might ask why.
    Here are a couple of possible reasons:


    *   **Leverage the UI framework features:** If you decide to create a web component
    using a UI framework, say Angular, you can leverage your Angular knowledge and
    the features that the framework provides you. This may simplify the development
    and, to an extent, avoid you knowing the details about implementing web components.


    *   **Distributing a framework-based component**: Suppose you have a Vue component
    and want to make it available to other non-Vue applications. You can create your
    web component by using Vue and distribute it. You are wrapping your Vue component
    in a web component.


    These may be two possible reasons to use one of the most popular UI frameworks
    to create your web component. However, you should be aware of at least the following
    caveats:


    *   **Increasing complexity:** Applying a layer of abstraction above the Web Components
    technologies adds complexity. You may experience issues due to different ways
    of managing things. And you may have performance issues due to this extra layer.


    *   **Adding dependency:** The UI framework you use to implement the web component
    becomes a dependency, even if it may include just a subset of the framework itself.
    Imagine what may happen if an application has multiple web components built with
    different libraries.


    So, even if it is possible to create web components or wrap existing framework-based
    components, ask yourself if this is a good choice for your purposes.

