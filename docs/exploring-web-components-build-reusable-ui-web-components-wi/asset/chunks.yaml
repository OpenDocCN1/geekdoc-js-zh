    You may be tempted to accept rich data via attributes represented as serialized
    objects. Or also, you could think of mapping rich data from your properties to
    the corresponding attributes by serializing it. This approach has a few flaws.
    The most evident drawback is that serializing and de-serializing objects to sync
    properties and attributes can be very expensive for large objects. Also, during
    serialization, you will lose any object reference you may have in your object.
    In other words, as a best practice, you should allow rich data only for properties
    or accept them as parameters for a method. Never accept or map rich data in the
    attributes of your web component.


    # Conclusion


    In this chapter, we recalled the difference between attributes and properties
    and how they work for standard HTML elements. With these notions in mind, we explored
    how to replicate this standard behavior for Web Components. We discovered how
    to add properties to web components, how to use them via JavaScript, how to map
    properties to attributes, and how to keep both in sync. Finally, we discussed
    a few factors that may affect the performance of your web component.


    With the ability to add and manage attributes and properties in your web component,
    you can create custom elements that resemble almost completely to standard HTML
    elements. The users of your web components can now customize them both via attributes
    and properties.


    In the next chapter, we will explore another way to allow users to customize your
    web component. We will discuss event management and will see how to include this
    common feature in your web components.


