    向 DOM 对象添加新属性不会影响 HTML，但通过 JavaScript 进行自定义时可能很有用。例如，我们可以为图像分配文本或数字信息，以便稍后检索。


    **请注意，尽管技术上可行，但向 DOM 对象添加新属性可能并非好主意。新属性可能与标准 DOM 的未来演变产生冲突。**


    与 HTML 属性不同，DOM 属性是区分大小写的。这意味着 DOM 属性的名称始终相同，与对应属性的大小写无关。换句话说，如果你的标记如下所示：


    `<p ID=”myPar”>这是一个段落</p>`


    对应的 DOM 属性仍然是 `id`。


    同样，与 HTML 属性不同，DOM 属性是有类型的。例如，考虑以下标记：


    `<p ID=”myPar” hidden style=”color:red”>这是一个段落</p>`


    与 `hidden` 属性对应的 `hidden` 属性具有布尔值。而 `style` 属性则是一个对象。


    通常，当 DOM 属性的类型是字符串时，属性的值会原样赋给该属性。但也有一些例外。例如，`HTMLAnchorElement` 的 `href` 属性的值始终是绝对
    URL，即使对应属性的值是相对 URL。对于 `<img>` HTML 元素的 `src` 属性和 `HTMLImageElement` 的 `src` 属性也是如此。


    # 非标准属性管理


    我们讨论了非标准属性，以及如何通过 `getAttribute()`、`setAttribute()` 等方法或使用属性集合来管理它们。


    一般来说，创建非标准属性可能不是个好主意。或者，至少，如果你在创建它们时没有考虑引入它们对应用程序的后果，那也不是个好主意。例如，你可以向 HTML 元素添加一个非标准属性，但如果后来它变成了标准属性会发生什么？如果你随意分配属性名称，可能会得到意想不到的结果。


    尽管从技术上讲，你可以选择任意名称来添加属性，但你应该使用所谓的 data 属性。这些属性的名称以 `data-` 前缀开头。HTML 标准正是为此目的引入了它们——允许开发者添加自定义属性。


    例如，你可以更安全地向段落元素添加非标准属性，如下所示：


    `<p id=”myPar” data-type=”special”>这是一个段落</p>`


    任何 data 属性都会映射到对应 DOM 对象的 `dataset` 属性。因此，你可以检索 `data-type` 属性的值，如下面的代码片段所示：


    `const myPar = document.getElementById(“myPar”);`


    `console.log(myPar.dataset.type);`


    如你所见，在这种情况下，`data-type` 属性生成了 `dataset.type` 属性。


    # 属性与属性的同步


    在大多数情况下，当标准属性的值发生变化时，对应的 DOM 属性的值也会相应变化，反之亦然。这保证了标准属性和属性自动保持同步。


    然而，这条规则也有一些例外。考虑以下示例：


    `<input id="myName" type="text" value="John" />`


    最初，`value` 属性和 `HTMLInputElement` 对象对应的属性具有相同的值。但如果用户更改了文本框的值，属性和属性之间就会出现不同的值。具体来说，`HTMLInputElement`
    对象的 `value` 属性将获取用户输入的新值，而属性将继续保持初始值。这种行为的原因很简单——这样，当用户在表单中点击“重置”按钮时，可以恢复原始值。所以，这只是一个实际原因。


    # 管理属性


    到目前为止的概述帮助我们理解了属性和属性的标准行为。如果我们想为我们的 Web 组件提供属性和属性，我们需要清楚了解它们在标准浏览器行为中的工作方式。这使我们能够创建尽可能接近标准元素的属性和属性，以便用户能够理解它们的行为。


    # 添加属性


    让我们开始修改我们的 cookie 警告组件，添加一个允许用户指定其 `message` 的属性。我们将向自定义元素添加一个 `message` 属性，这不过就是向任何标准
    JavaScript 类添加属性。因此，让我们回顾一下到目前为止定义的 `CookieAlert` 类的代码：


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    ‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.createComponent();

    }

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = "This website uses cookies to ensure you get the best experience";

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    作为添加属性的第一步，让我们在类构造函数中为 `_message` 属性分配一个默认值，如下面的代码所示：


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    }

    ```


    现在，让我们在 `createComponent()` 方法中构建 UI 时使用 `_message` 属性来分配默认消息：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = this._message;

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    ```


    这些更改不会影响 cookie 警告组件的当前行为。`_message` 属性充当要显示的消息的存储。它并不是我们组件的实际属性，而应该是私有属性。我们使用众所周知的约定，即对于应视为私有的属性，使用
    `_` 前缀命名。


    **在撰写本文时，实际的私有属性是 ECMAScript 委员会提出的实验性功能。浏览器的支持有限，但某些转译器可以配置使用它们。**


    **在本书的其余部分，我们将继续使用基于 `_` 前缀的命名约定来表示私有属性。**


    为了定义实际属性，让我们向类中添加以下代码：


    ```

    get message() {

    return this._message;

    }

    set message(value) {

    this._message = value;

    }

    ```


    这段代码为 `message` 属性添加了 getter 和 setter。getter 返回私有属性 `_message` 的当前值，而 setter 则将参数接收到的值赋给它。


    虽然 getter 可以满足 `message` 属性的需求，但 setter 还不够。我们希望当 setter 接收到 `message` 的值时，UI
    会更新为这个新消息。因此，让我们对 `message` 属性的 setter 进行一些修改，并添加一个新方法，如下面的代码片段所示：


    ```

    get message() {

    return this._message;

    }

    ```


