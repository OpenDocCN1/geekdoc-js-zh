    然而，即使支持 Web Components 的技术正获得越来越广泛的支持，你也不能忽视某些浏览器（如 Opera 和 Safari）仍仅提供部分支持，而且用户并不总是使用最新版本的浏览器。


    # 使用 polyfills


    上一节描述的场景似乎并不那么令人鼓舞。即使现代浏览器对 Web Components 有很好的支持，但仍有一些浏览器不支持或仅提供部分支持。


    那么，我们能否认为 Web Components 技术已经足够成熟，可以用于生产环境？目前是否最好继续使用 React、Angular 和其他 UI 框架，因为它们能保证与旧浏览器的一定程度的向后兼容性？


    这些问题非常合理。你不能冒险让某些用户因浏览器支持不足而无法正常访问你的网站或应用程序。


    幸运的是，你可以使用一些 polyfill 库来模拟浏览器尚未支持的功能。


    **Polyfill 是一个模块、一段代码片段或一个库，通常用 JavaScript 编写，用于提供现代浏览器原生支持但旧浏览器不支持的功能。**


    为了解决某些浏览器缺乏支持或仅部分支持的问题，你可以通过以下 URL 引入开源社区提供的 polyfills：[`github.com/webcomponents/polyfills`](https://github.com/webcomponents/polyfills)


    你可以使用完整的 `WebComponentsJS` polyfill 套件，也可以选择单独使用它们——用于自定义元素、Shadow DOM 或 HTML
    模板的 polyfill。此外，你可以选择通过 `npm` 将它们安装到开发环境中，或者通过 unpkg.com 内容分发网络（CDN）的未打包版本将其包含在
    HTML 页面中，地址为 [`unpkg.com/browse/@webcomponents/webcomponentsjs/`](https://unpkg.com/browse/@webcomponents/webcomponentsjs/)。


    让我们看看如何通过使用未打包版本来利用这些 polyfill。为此，我们将考虑前面章节中展示的评分组件示例，并添加未打包的 polyfill。以下是新的标记：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-bundle.js”></script>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    <my-rating max-value=”6” value=”3”></my-rating>

    </body>

    </html>

    ```


    注意在评分组件脚本之前包含的脚本。它加载了 `webcomponents-bundle.js` 脚本，该脚本为不支持 Web Components 技术的浏览器模拟这些技术。该脚本提供了一组通过特性检测激活的
    polyfill；也就是说，只有当当前浏览器原生不支持相应特性时，才会执行其代码。尽管这种方法确保了浏览器特性的高效使用，但当浏览器提供部分 Web Components
    技术支持时，加载该脚本实现的所有 polyfill 是不必要的。它应该只加载那些受支持的 polyfill。


    为了解决这个问题，你可以使用另一个脚本，该脚本根据当前浏览器缺失的功能仅加载必要的 polyfill。这个脚本叫做 `webcomponents-loader.js`，你可以用它代替
    `webcomponents-bundle.js`，如下代码所示：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-loader.js”></script>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    <my-rating max-value=”6” value=”3”></my-rating>

    </body>

    </html>

    ```


    这将仅加载最少的可用 polyfill，以支持在部分支持的浏览器中启用 Web Components 的功能。


    当然，这些 polyfill 无法保证在任何浏览器中都能实现 Web Components 技术。它们的支持目标是比较新的浏览器，所以不要指望它们能在例如
    *Internet Explorer 8* 上工作。


    # 结论


    在本章中，我们了解了组件是设计 UI 的一种便捷方式。它们让你专注于小功能块，并帮助你在同一应用的不同部分或其他应用中复用它们。我们还讨论了许多 JavaScript
    库和框架推广了这种基于组件的 UI 构建方法，但它们彼此不兼容。然后，我们介绍了 Web Components 作为构建 UI 组件的标准原生替代方案，并了解了如何将它们包含在网页中。我们还讨论了浏览器对
    Web Components 底层技术的支持情况，并展示了如何使用 polyfill 库在旧浏览器上模拟这些技术。


    通过阅读本章，你已经了解了什么是 Web Components，以及如何将现有的 Web Component 包含到你的网页中。此外，通过使用 polyfill，你还能确保你的网页在部分支持或不支持
    Web Components 技术的浏览器中正确渲染。


    在下一章中，你将开始学习如何通过扩展现有 HTML 元素来实现你自己的 Web Component。


