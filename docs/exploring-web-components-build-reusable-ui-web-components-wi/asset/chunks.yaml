- fmt: "\nThe Web Component Build project allows you to build your component for production,\
    \ that is, ready to be distributed to users. Compared with the source code distribution\
    \ approach described in the previous section, the building step offers your script\
    \ a few advantages.\n\nIt transpiles your code into a widely supported version\
    \ of ECMAScript, typically ECMAScript 5. You may wonder why you should translate\
    \ your modern JavaScript code into an older version since the user should have\
    \ a recent browser to support Web Components technologies. Actually, the transpilation\
    \ step of the building process may be useful if you combine it with polyfills,\
    \ as described in [chapter 1](#c01.xhtml). This way, you can allow users of older\
    \ browsers to use your Web Component.\n\nIn addition, the building step optimizes\
    \ your component's code in order to reduce the size of the resulting bundle. This\
    \ reduces the transfer and load time of your component.\n\nYou can obtain the\
    \ built version of the cookie alert component by running the following command\
    \ from the root of the Web Component Builder project:\n\n`npm run build`\n\nAfter\
    \ some seconds, you will find in the `dist` folder of the project a `bundle.js`\
    \ file. As in the distribution without a building step, you can rename this file\
    \ into `cookie-alert.js` and provide it to your users via download or CDN.\n\n\
    Your user will be able to use your component the same way as we described in the\
    \ previous case.\n\n# [Implementing modules](#toc.xhtml_s107a)\n\nThe distribution\
    \ approaches described above seems to work perfectly at first glance. However,\
    \ they have a few drawbacks.\n\nLet's consider the distribution strategy without\
    \ a building step. Suppose you want to create an instance of the cookie alert\
    \ component via JavaScript. You should be able to use the `CookieAlert` class\
    \ as in the following example:\n\n`var myCookieAlert = new CookieAlert();`\n\n\
    And actually, it works as expected. However, you are also able to access the `template`\
    \ constant that defines the native template the cookie alert component is using.\
    \ You can try it by simply writing the following code:\n\n`console.log(template);`\n\
    \nIn this scenario, you will get an object in the console window instead of a\
    \ null value.\n\nAlso, you can access the `getCookie()` and `setCookie()` functions\
    \ defined in the `cookie-alert.js` script. This is due to the fact that all these\
    \ elements are defined as global elements inside the script file.\n\nYou might\
    \ think that this is not a big problem. After all, the component is working as\
    \ expected. In fact, it is a serious issue. Guess what happens if a user that\
    \ doesn't know the implementation details of the component defines a global template\
    \ variable. Arguably, their attempt to define the template variable will fail\
    \ because a constant with that name already exists. So, the user's code will break\
    \ due to the inclusion of our cookie alert script. Also, imagine that the user\
    \ defines their own `getCookie()` function, maybe with a different signature or\
    \ different behavior. In this case, our component will not work as expected due\
    \ to the interference with the user's function re-definition.\n\nIf you remember\
    \ the discussion about the Shadow DOM in [chapter 6](#c06.xhtml), here we have\
    \ a similar problem at the code level. The code of our component affects the user's\
    \ code, and the code of the user affects the component's code. The premise we\
    \ made above about the user's knowledge of the implementation details of our component\
    \ is very important. Not because the user should know how our component works\
    \ internally, but just because they don't have to know them. Our code does not\
    \ have to affect the user's code, nor the user's code has to affect our component.\
    \ The only way the user should have to affect the component's code is through\
    \ its public interface, which is the set of properties, attributes, events, methods,\
    \ etc. explicitly designed for this goal.\n\nIn other words, we need to encapsulate\
    \ the code of our component into a module.\n\nBefore we go and see how to turn\
    \ our script into a module, let's take a look at the drawbacks of the distribution\
    \ strategy with the building step. In this case, we are not able to access the\
    \ `template` constant nor the `getCookie()` and `setCookie()` functions. This\
    \ is good from the encapsulation point of view. Unfortunately, we also are not\
    \ able to access the `CookieAlert` class, and then we cannot create instances\
    \ of the component via JavaScript. In this case, we are experiencing the opposite\
    \ problem to the one we saw for the distribution strategy without a building step:\
    \ the script exposes nothing to public access.\n\nThis behavior depends on the\
    \ Webpack bundler. It automatically interprets a script as a module. This way,\
    \ what is not explicitly exported is not accessible outside the module. On the\
    \ other hand, from the standard ECMAScript point of view, a module is a script\
    \ that has at least one `export` or `import` statement. So, a script without any\
    \ of these statements is declaring elements in the global context.\n\nSo, in summary,\
    \ in the distribution approach without a building step, all the component's code\
    \ is global. In this case, it may have interferences with the user's code. In\
    \ the approach with a building step, all the component's code is private, so the\
    \ user is not able to leverage our component via JavaScript.\n\nLet's see how\
    \ we can fix both problems by implementing our component as a standard ECMAScript\
    \ module. The only change we should apply to the script containing the component\
    \ definition is to prefix the class definition with the `export default` statement.\
    \ The script file content for the cookie alert component will look like the following:\n\
    \n```\nconst template = document.createElement('template');\ntemplate.innerHTML\
    \ = '…';\nexport default class CookieAlert extends HTMLElement {\n  // …\n}\n\
    customElements.define(\"cookie-alert\", CookieAlert);\nfunction getCookie(cookieName)\
    \ {\n  // …\n}\nfunction setCookie(cookieName, cookieValue, expirationDays) {\n\
    \  // …\n}\n```\n\nWe defined the `CookieAlert` class as the default exported\
    \ item of the current module.\n\nHowever, if we try to include this new version\
    \ of the component script with the `<script>` tag as above, we will get an error\
    \ about the `export` statement. Actually, the `<script>` tag doesn't support modules\
    \ by default. In order to enable it to include modules in an HTML page, you have\
    \ to specify it through the `type` attribute. So, the correct way to import the\
    \ modularized version of the cookie alert component is as shown here:\n\n`<script\
    \ type=\"module\" src=\"./cookie-alert.js\"></script>`\n\nFrom now on, you can\
    \ use the `CookieAlert` class from any JavaScript module by importing it and creating\
    \ your instance, as shown in the following example:\n\n`import CookieAlert from\
    \ './cookie-alert.js'`\n\n`var myCookieAlert = new CookieAlert();`\n\nKeep in\
    \ mind that you can import the items exported by a module only from within another\
    \ module. An attempt to import items from a module when your code is within a\
    \ `<script>` tag without the `type=\"module\"` attribute will throw an error.\n\
    \n# [The package-based strategy](#toc.xhtml_s108a)\n\nThe script-based strategy\
    \ is a good approach for an HTML-centric application or website. However, modern\
    \ Web application development uses a JavaScript-first approach. Consider the Single\
    \ Page Application (SPA) architecture: it uses one HTML page whose content is\
    \ generated at runtime by JavaScript code. This is the approach supported by most\
    \ JavaScript frameworks and libraries, like React, Angular, Vue, etc. But it is\
    \ also applicable to vanilla JavaScript. With this approach, an HTML page is just\
    \ the anchor to attach the application JavaScript code to the browser. Most of\
    \ the logic, UI, and infrastructure of the application itself is provided by JavaScript\
    \ code.\n"
