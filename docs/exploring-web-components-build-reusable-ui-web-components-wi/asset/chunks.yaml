    2.  DOM 事件传播的阶段有哪些？

    3.  Web 组件可以监听哪些标准事件？

    4.  如何防止用户向您的 Web 组件附加事件监听器？

    5.  自定义事件的构造函数是什么？

    6.  如何在自定义事件中传递数据？

    7.  为什么应该移除在 Web 组件中注册的事件监听器？

    8.  移除组件事件监听器的最佳 Web 组件回调是什么？


    # 第 6 章


    # 使用影子 DOM


    Web 组件旨在用于并非总是由我们控制的 HTML 页面。用户可能会将您的组件放在他们的网页上，而您不知道该页面是如何工作的。在某些情况下，您可能会遇到一些与您为组件设计的行为产生的不必要干扰。


    在本章中，您将了解 Cookie 提示组件与页面**文档对象模型（DOM）**之间可能存在的几种干扰示例。我们将讨论传统上如何解决这些问题，以及如何通过使用影子
    DOM 来解决它们。我们还将通过实际示例讨论开放影子 DOM 和封闭影子 DOM 之间的区别。


    在本章中，我们将为 Cookie 提示组件添加影子 DOM 支持，以展示如何在实际中使用它。


    # 结构


    *   Web 组件与 DOM

    *   影子 DOM

    *   开放与封闭影子 DOM


