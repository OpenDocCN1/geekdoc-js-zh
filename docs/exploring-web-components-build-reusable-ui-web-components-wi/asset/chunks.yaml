    # 为什么要使用模板？


    现在你应该对原生模板是什么以及如何使用它有了概念。然而，你可能仍然想知道为什么要使用它。与基于字符串或基于 DOM 的方法相比，它提供了哪些优势？


    让我们比较这三种方法，并尝试理解每种方法提供的优点和缺点。


    当你使用字符串来描述 UI 的标记时，每次创建组件时，都会经历以下步骤：


    1. 解析文本，检查 HTML 标记的有效性

    2. 创建 DOM 元素

    3. 将 DOM 元素附加到 DOM


    当你使用基于 DOM 的方法时，创建组件时执行的步骤如下：


    1. 创建 DOM 元素

    2. 将 DOM 元素附加到 DOM


    实际上，在这种情况下，你没有解析步骤，因为你直接创建了所需的 HTML 元素。


    通过使用模板，你只需要一个步骤：


    1. 将 DOM 元素附加到 DOM


    解析和 DOM 元素创建步骤必须在声明模板时完成。对于组件的任何实例，这只会发生一次。


    因此，通过使用模板，你为基于字符串的方法的声明式方法增加了效率。


