    property via JavaScript. For example, the following code forces showing the Close
    button:


    `const myCookieAlert = document.querySelector("my-cookie-alert");`


    `myCookieAlert.hasCloseButton = true;`


    # [Conclusion](#toc.xhtml_s114a)


    This chapter showed you how to prepare your Web Components in order to be shared
    with other developers. We explored how to create modules that contain your code
    and how to distribute them via script-based and package-based approaches.


    These approaches can be used in different development contexts. But regardless
    of the specific approach to distribute your components, the users can create new
    components based on yours. In fact, they can extend the class that defines your
    component to create a personalized version of it.


    With the notions you learned in this chapter, you are now able to distribute your
    Web Components and to create new components by extending existing ones.


    In the next chapter, we will discuss how to use Web Components within applications
    built with well-known JavaScript libraries and frameworks like React, Angular,
    and Vue.


    # [Questions](#toc.xhtml_s115a)


    1.  What are the main drawbacks of distributing your Web Component as a traditional
    script?


    2.  What are the main benefits of applying a building step to your code before
    distributing your component?


    3.  How can you overcome the drawbacks of distributing your Web Component as a
    traditional script?


    4.  How can you convert the code of your Web Component into a module?


    5.  How can you import a module with the `<script>` tag?


    6.  Why you need a package for distributing your Web Component?


    7.  What are the minimum `package.json` fields for publishing your `npm package?`


    8.  How can you share your GitHub repository as an `npm` `package`?


    9.  How can you install an npm package from a GitHub repository?


    10.  How can you publish your `npm` package on the public npm registry?


    11.  How can you extend an existing Web Component?


    # [CHAPTER 9](#toc.xhtml_c09)


    # [Web Components and Other UI Frameworks](#toc.xhtml_c09)


    Throughout this book, you learned that the technologies that are behind Web Components
    allow you to customize standard HTML elements and create custom HTML elements.
    When we introduced them in *[Chapter 1, Getting Started with Web Components](#c01.xhtml),
    we said that one of the main advantages of Web Components* is their interoperability.
    That is the ability to work in an HTML page or web application regardless of the
    library or framework you are using to build your UI. This is a great advantage
    that allows you to create universal UI components and use them the same way you
    are using HTML elements.


    In this chapter, we are going to show a few practical examples of how this interoperability
    between Web Components and UI frameworks happens. We will see how to integrate
    them in *React, Angular*, and Vue applications with very little effort. We will
    also take a look at some directions on how to create web components by writing
    them in *Angular, Vue,* and *React*.


    # [Structure](#toc.xhtml_s116a)


    *   Web Components integration


    *   Web Components and React


    *   Web Components and Angular


    *   Web Components and Vue


    *   Building Web Components with UI Frameworks


    # [Objectives](#toc.xhtml_s117a)


    The goal of this chapter is to demonstrate how to integrate Web Components in
    websites and applications built with JavaScript UI frameworks.


    You will learn how to use your components in applications created with *React,
    Angular,* and *Vue*. You also will discover how to wrap a component built with
    these frameworks in a custom element.


    # [Web Components integration](#toc.xhtml_s118a)


    The HTML elements you build with Web Components technologies work as standard
    HTML elements. This means that wherever you can use an HTML element, you can use
    a Web Component. This possibility leads to an awesome feature - no matter the
    library you are using for your web application or website, you can use your web
    component everywhere. Interoperability is the amazing main advantage of Web Components.'
