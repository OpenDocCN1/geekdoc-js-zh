    在搭建好定义组件的基本基础设施后，让我们用以下代码实现 cookie 提示组件的 UI：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    static get styles() {


    return css`


    .container {


    color: rgb(255, 255, 255);


    background-color: rgb(35, 122, 252);


    padding: 1em 1.8em;


    width: 100%;


    font-family: Helvetica,Calibri,Arial,sans-serif;


    }


    .footer {


    position:fixed;


    left:0px;


    bottom:0px;


    }


    .button {


    color: rgb(255, 255, 255);


    background-color: transparent;


    border-color: rgb(255, 255, 255);


    padding: 5px 40px;


    margin-right: 50px;


    cursor: pointer;


    float:right;


    }


    `;


    }


    render() {


    return html`


    <div class="container footer">


    <slot id="message" name="message">${this.message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">关闭</button>


    <button id= "acceptButton" class="button">接受</button>


    </div>`;


    }


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    如你所见，我们添加了静态 getter `styles()` 和方法 `render()`。`styles()` getter 通过使用 CSS 标签模板字面量定义了应用于组件的
    CSS 样式。`render()` 方法为组件的 UI 生成了 DOM 结构，它是指定 HTML 标签模板字面量的结果。


    这里没有提到 Shadow DOM。`LitElement` 基类内部管理了它，所以你无需担心。


    # 属性和特性


    下一步是添加 message 属性，并将其与同名的特性同步。你可以通过向 `CookieAlert` 类添加以下代码轻松实现：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    constructor() {


    super();


    this.message = "本网站使用 cookie 以确保您获得最佳体验";


    }


    static get properties() {


    return {


    message: {


    attribute: true,


    type: String,


    reflect: true


    }


    }


    }


    //…


    }

    ```


    我们添加了静态 getter `properties()`。这个 getter 返回一个包含组件属性定义的对象。在我们的例子中，我们定义了 `message`
    属性。属性定义是一个带有几个选项的对象。


    赋给 `attribute` 选项的 `true` 值表示 `message` 属性必须映射到一个同名的特性。


    我们还指定了属性的类型。如果你想将特性映射到属性，这一点至关重要。事实上，请记住特性的类型始终是字符串，而属性的类型可以是任何可能的 JavaScript
    类型。你需要指定属性类型，以便在将特性映射到属性时进行正确的类型转换。


    最后，`reflect` 选项启用了属性到特性的映射。如你所见，无需观察特性并显式管理类型转换。你还注意到我们添加了类构造函数。在这种情况下，它的作用是为
    `message` 属性设置一个默认值。


    基于装饰器的语法允许你拥有紧凑的属性定义，如下面的代码片段所示：


    ```

    import { LitElement, html, css } from ''lit-element'';


    @customElement("cookie-alert")


    export default class CookieAlert extends LitElement {


    @property({


    attribute: true,


    type: String,


    reflect: true


    })


    message = "本网站使用 cookie 以确保您获得最佳体验";


    //…


    }

    ```


    `@property` 装饰器接受应用于 `message` 属性的选项。此外，`message` 属性的初始化发生在定义中。


    # 事件


    为了完成 cookie 提示组件的实现，我们需要处理并触发事件。为此，我们对 `render()` 方法中的 UI 模板做了一些小改动：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    render() {


    return html`


    <div class="container footer">


    <slot id="message" name="message">${this.message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button" @click="${() => this.style.visibility
    = "hidden"}">关闭</button>


    <button id= "acceptButton" class="button" @click="${this.accept}">接受</button>


    </div>`;


    }


    //…


    }

    ```


    你看到我们在两个按钮上都添加了 `@click` 绑定。`@event` 绑定来自 `lit-html` 库。它允许你直接在模板中将监听器绑定到事件。在我们的例子中，我们为第一个按钮附加了一个箭头函数来隐藏
    cookie 提示组件。我们还将 `accept()` 方法与第二个按钮的点击事件关联起来。


    `accept()` 方法与我们在原始组件中使用的监听器具有相同的实现：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    accept() {


    this.style.visibility = "hidden";


    setCookie("cookiesAccepted", "y", 365);


    this.dispatchEvent(new CustomEvent("accepted", {


    detail:{


    acceptedCookieName: "cookiesAccepted",


    acceptedCookieExpiration: 365}


    }));


    }


    //…


    }

    ```


    # 生命周期


    为了完成组件实现，我们必须添加管理接受 cookie 的代码：


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    connectedCallback() {


    super.connectedCallback();


    const cookiesAccepted = getCookie("cookiesAccepted")


    if (cookiesAccepted === "y") {


    this.style.visibility = "hidden";


    }


    }


    //…


    }

    ```


    你可以看到 `connectedCallback()` 方法与我们在组件标准版本中的实现几乎相同。主要区别在于调用了父类的 `connectedCallback()`
    方法。这确保了 `LitElement` 类的 `connectedCallback()` 方法中实现的所有初始化都被执行。


    `LitElement` 库还提供了其他功能来帮助你构建 Web 组件。例如，除了标准反应之外，`LitElement` 类还支持在组件生命周期的不同阶段调用的其他方法。正如本章开头所说，讨论这个主题超出了我们的范围。


    # Hybrids


    `Hybrids` 库旨在为你提供一种函数式方法来定义 Web 组件。你应该只依赖普通对象和纯函数。因此，没有类也没有继承。管理 Web 组件原生定义的所有细节都由库内部处理。


    要在基于 Node 的项目中使用 `Hybrid`，请在终端窗口中输入以下命令进行安装：


    `npm install hybrids`


    ## 基本基础设施


    让我们通过重新实现 cookie 提示组件来探索 `Hybrid` 库的基本功能。以下代码展示了定义 Web 组件的基本元素：


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    };


    define("cookie-alert", CookieAlert);

    ```


    你导入了 `html()` 和 `define()` 函数。我们稍后将看到如何使用 `html()` 函数。`define()` 函数是你定义 Web 组件所需的全部内容。该函数将组件的标签名作为第一个参数，将包含组件配置的字面量对象作为第二个参数。在示例中，`CookieAlert`
    对象是空的，但我们马上就会填充它。


    # 模板和 UI


