- fmt: '

    In previous sections, we have created the cookie alert custom element, and we
    have seen how to use it in an HTML page. Actually, using an autonomous custom
    element is quite easy. Once you have defined the class that implements it and
    have registered it with a tag name, you simply need to use that tag name inside
    the markup of an HTML page, like in the following:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Web Components with Webpack Build System</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>Here is your Web Component</h1>

    <cookie-alert></cookie-alert>

    </body>

    </html>

    ```


    The interesting thing is that your custom element becomes indistinguishable from
    any other standard HTML element. Since your component is derived from `HTMLElement`,
    you can use the features that are common to all HTML elements without the need
    to write additional code. For example, you can use the `hidden` attribute as shown
    by the following markup:


    `<cookie-alert hidden></cookie-alert>`


    Your component will not be shown on the page like any other standard element having
    the `hidden` attribute. Also, you can attach an event listener, shown as follows:


    `<cookie-alert onclick=”alert(‘You clicked!’)”></cookie-alert>`


    When you click your component, an alert window will be shown with the message
    you passed, as you can see in the following picture:


    ![](images/Figure_3.6.jpg)


    **Figure 3.6**


    All common attributes of standard HTML elements are automatically available in
    your custom element. Here is a list of the most typical ones:


    | **Attribute** | **Description** |

    | `hidden` | It indicates if the element is hidden or not |

    | `id` | The identifier of your element |

    | `innerHTML` | It is the markup that represents the content within the element
    |

    | `innerText` | It represents the text content of the element |

    | `onblur` | This is the event handler for the blur event, that is when the element
    has lost the focus |

    | `onfocus` | The event handler for the focus event, that is when the element
    has received the focus |

    | `onclick` | It is the event handler of the click event |

    | `onmousedown` | This is the event handler for the `mousedown` event, that is
    when the user depresses the mouse button |

    | `onmouseover` | It is the event handler for the mouseover event, that is when
    the user moves the mouse pointer over the element |

    | `onmouseup` | This is the event handler for the `mouseup` event, that is when
    the user releases the mouse button |

    | `onresize` | It is the event handler for the resize event, that is when the
    current browser’s window has been resized |

    | `style` | It represents the CSS declarations of an element’s inline-style |

    | `title` | This is the text usually displayed as a tooltip popup when the mouse
    is over the element |


    **Table 3.2**


    You can use these attributes in the markup of your custom element, as seen above.
    But you can also use the corresponding properties in JavaScript, as you would
    do with standard HTML elements. For example, you can hide your cookie alert component
    by manipulating its `hidden` property via JavaScript.


    **Remember that attributes and properties are not the same things. Attributes
    are part of the HTML markup, while properties are part of the object representation
    of the markup (DOM).**


    **Usually, a mapping exists between attributes and DOM properties, but not always
    this happens.**


    Let’s assume your component has assigned an identifier, like in the following
    example:


    `<cookie-alert id=”myCookieAlert”></cookie-alert>`


    You can hide this component with the following JavaScript code:


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.hidden = true;

    };

    ```


    As you can see, we just assigned the true value to the inherited `hidden` property.
    Of course, this has the same effect as assigning the `hidden` attribute in the
    HTML markup.


    Similarly, you can add the handler for the click event via JavaScript with the
    following code:


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.onclick = () => alert(“You clicked!”);

    };

    ```


    In this case, we used the `onclick` property of your custom element, which is
    mapped to the `onclick` attribute. An alternative way is to use the `addEventListener()`
    method, as shown in the following example:


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.addEventListener(“click”, () => alert(“You clicked!”));

    };

    ```


    Besides the fact that using the `addEventListener()` method has the same effect
    as using the `onclick` property and attribute, it clearly teaches you that your
    custom element also inherits methods, not just attributes and properties.


    The following are the most common methods your custom element inherits from `HTMLElement`:


    | **Method** | **Description** |

    | `addEventListener` | It registers an event handler to a specific event type
    on the element |

    | `getAttribute` | It returns the value of an attribute of the element given its
    name |

    | `getElementsByClassName` | This method returns a collection of all descendants
    of the element having the given CSS class |

    | `getElementsByTagName` | It returns a collection of all descendants of the element
    having the given tag name |

    | `querySelector` | This method returns the first element which matches the given
    selector string |

    | `querySelectorAll` | It returns the list of elements which match the given selector
    string |

    | `remove` | It removes the element from the DOM |

    | `removeAttribute` | This method removes the given attribute from the element
    |

    | `removeEventListener` | It removes an event listener from the element |

    | `setAttribute` | It sets a value for the given attribute of the element |

    | `toggleAttribute` | This method toggles a Boolean attribute, removing it if
    present and adding it if it is not present |


    **Table 3.3**


    Remember that you can use these attributes, properties, and methods just because
    your Custom element inherits from the `HTMLElement`.


    # [Conclusion](#toc.xhtml_s44a)


    This chapter gave you the basics to build `autonomous custom elements.` We built
    step by step, a simple Web Component that shows an alert message about the cookie
    policy of your website. During the building of this component, we explored the
    basic structure of an autonomous custom element and the basic techniques to add
    markup and CSS rules to it in order to define its UI. We analyzed the lifecycle
    of Web Components and discussed for each stage what you can do and what you can’t.
    Finally, we took a look at how you can use your Web Components in your web application
    both via markup and via JavaScript.


    With the information you gathered in this chapter, you are able to create a simple
    autonomous custom element with its markup and CSS. Since you learned the various
    stages of the lifecycle of Web Components, you can select the right reaction to
    manage your component’s life as best as possible. Also, you know how to use your
    Web Component in your web pages and which features are available by default.


    In the next chapter, we will continue to improve the Web Component you started
    to build in this chapter by adding support for custom properties and attributes.


    # [Questions](#toc.xhtml_s45a)


    1.  What is the difference in registering an autonomous custom element and a customized
    native element?


    2.  What is a custom element reaction?


    3.  What are the possible reactions for a Web Component?


    4.  What is the difference between the creation and the upgrade of a component?


    5.  Which is the best reaction to manipulate the DOM?


    6.  When the `adoptedCallback()` reaction is invoked?


    7.  When the `disconnectedCallback()` reaction is invoked?


    8.  Why an autonomous custom element has some attributes, properties, and methods
    available even if you didn’t implement them?

