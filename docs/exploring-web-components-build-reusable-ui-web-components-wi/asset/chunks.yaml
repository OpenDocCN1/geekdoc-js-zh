    \ you a model and syntax that are inspired by Angular and React. But the final\
    \ result of building your component is vanilla JavaScript.\n\nLet's take a quick\
    \ look at the main Stencil's features by implementing our cookie alert component.\n\
    \nTo start a Stencil project, you can run the following command:\n\n`npm init\
    \ stencil component cookie-alert`\n\nThis command will set up a basic Stencil\
    \ project in the `cookie-alert` folder with all the required dependencies. You\
    \ note that we specified the `component` keyword in the command above. Actually,\
    \ you can build other types of project with Stencil, like whole Web applications\
    \ (`app`) or Ionic applications (`ionic-pwa`).\n\nOnce the project structure is\
    \ created, you have a few folders with several files all around. We will not analyze\
    \ the entire structure but will focus on the class definition and the CSS style.\
    \ Please, refer to the Stencil official documentation to get more details.\n\n\
    # [Basic infrastructure](#toc.xhtml_s151a)\n\nThe basic definition of a Stencil\
    \ component looks like the following:\n\n```\nimport { Component, h } from '@stencil/core';\n\
    \n@Component({\n  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow:\
    \ true\n})\nexport class CookieAlert {\n  render() {\n    return <div>Hello, World!</div>;\n\
    \  }\n}\n```\n\nThese few lines of code highlight some key features of Stencil:\n\
    \n*   It uses TypeScript instead of plain JavaScript\n*   It uses JSX\n*   It\
    \ uses decorators\n\nThe definition of the `CookieAlert` class is annotated with\
    \ the `@Component` decorator. This decorator marks the class as the Web Component\
    \ definition, similar to what Angular does with its components.\n\nThe options\
    \ passed to the decorator configure the component. In particular, the `tag` option\
    \ defines the tag name associated with the component. The `styleUrl` option indicates\
    \ the file containing the CSS rules for the component. The `shadow` option states\
    \ if the Shadow DOM is enabled (`true`) or not (`false`). By default, the Shadow\
    \ DOM is not enabled, so in our cookie component, we explicitly enabled it.\n\n\
    The component has a `render()` method that is called to build the UI. This method\
    \ returns a JSX expression similarly to what happens in React class-based components.\n\
    \nThe `h()` function imported at the top of the module is needed to allow Stencil\
    \ to turn the JSX into Virtual DOM elements.\n\n# [Templates and UI](#toc.xhtml_s152a)\n\
    \nAt this point, you already figure out how to build the UI for your component:\
    \ you define your markup as a JSX expression returned by the `render()` method,\
    \ as shown below:\n\n```\nimport { Component, h } from '@stencil/core';\n\n@Component({\n\
    \  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\n\
    export class CookieAlert {\n  render() {\n    return <div class=\"container footer\"\
    >\n      <slot name=\"message\"></slot>&nbsp;\n      <slot name=\"reference\"\
    ></slot>\n      <button id=\"closeButton\" class=\"button\">Close</button>\n \
    \     <button id= \"acceptButton\" class=\"button\">Accept</button>\n    </div>;\n\
    \  }\n}\n```\n\nSince the component definition refers to the `cookie-alert.css`\
    \ file, create it and put the usual CSS code within it:\n\n```\n.container {\n\
    \  color: rgb(255, 255, 255);\n  background-color: rgb(35, 122, 252);\n  padding:\
    \ 1em 1.8em;\n  width: 100%;\n  font-family: Helvetica,Calibri,Arial,sans-serif;\n\
    }\n\n.footer {\n  position:fixed;\n  left:0px;\n  bottom:0px;\n}\n\n.button {\n\
    \  color: rgb(255, 255, 255);\n  background-color: transparent;\n  border-color:\
    \ rgb(255, 255, 255);\n  padding: 5px 40px;\n  margin-right: 50px;\n  cursor:\
    \ pointer;\n  float:right;\n}\n```\n\nWith these changes, you have the basic structure\
    \ of the cookie alert component ready.\n\n# [Properties and attributes](#toc.xhtml_s153a)\n\
    \nTo add the `message` property to the cookie alert component, let's amend the\
    \ previous code as follows:\n\n```\nimport { Component, Prop, h } from '@stencil/core';\n\
    \n@Component({\n  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow:\
    \ true\n})\nexport class CookieAlert {\n  @Prop()\n  message: string = \"This\
    \ website uses cookies to ensure you get the best experience\";\n\n  render()\
    \ {\n    return <div class=\"container footer\">\n      <slot name=\"message\"\
    >{this.message}</slot>&nbsp;\n      <slot name=\"reference\"></slot>\n      <button\
    \ id=\"closeButton\" class=\"button\">Close</button>\n      <button id= \"acceptButton\"\
    \ class=\"button\">Accept</button>\n    </div>;\n  }\n}\n```\n\nWe are using the\
    \ `@Prop` decorator for the `message` property and initialize it. Then used the\
