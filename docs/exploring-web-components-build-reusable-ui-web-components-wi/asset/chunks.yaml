    \ \"closebutton\") {\n            let isVisible = (newValue === \"true\" || newValue\
    \ === \"\");\n            this._hasCloseButton = isVisible;\n            this.toggleCloseButton(isVisible);\n\
    \        }\n    }\n}\n```\n\n注意我们如何处理 `closebutton` 属性的值。它应该是一个布尔值。但我们知道属性值总是字符串。因此我们需要将其值与字符串\
    \ `\"true\"` 进行比较。任何不同的值都被解释为 false。此外，我们希望属性没有值等同于 true 值。稍后当我们看到如何使用这个新组件时，会澄清这一点。\n\
    \n`connectedCallback()` 反应调用其基类的相同方法，并根据内部属性 `_hasCloseButton` 的值设置按钮的可见性：\n\n\
    ```\nconnectedCallback() {\n    super.connectedCallback();\n    this.toggleCloseButton(this._hasCloseButton);\n\
    }\n```\n\n调用 `super.connectedCallback()` 方法是必要的，因为它初始化了基础组件。如果不调用它，就会覆盖初始化，从而无法获得基础组件的\
    \ UI，或者获得的 UI 不完整。\n\n最后一步当然是注册 `MyCookieAlert` Web 组件：\n\n```\ncustomElements.define(\"\
    my-cookie-alert\", MyCookieAlert);\n```\n\n如你所见，我们定义了 `my-cookie-alert` 标签并将其绑定到\
    \ `MyCookieAlert` 类。现在我们已经准备好使用这个新的 Web 组件了。\n\n# 使用扩展的 Web 组件\n\n以下标记展示了 `my-cookie-alert`\
    \ 标签最基本的用法：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with\
    \ Webpack Starter Kit</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"\
    ></script>\n<script src=\"./bundle.js\"></script>\n</head>\n<body class=\"container\"\
    >\n<h1>Here is your Web Component</h1>\n<my-cookie-alert></my-cookie-alert>\n\
    </body>\n</html>\n```\n\n由于 `closeButton` 属性的默认值为 false，我们将得到不带“关闭”按钮的 cookie\
    \ 提示组件版本，如下面的截图所示：\n\n![](img/Figure_8.1.jpg)\n\n**图 8.1**\n\n如果你希望显示“关闭”按钮，只需添加值为\
    \ true 的 `closebutton` 属性，如下例所示：\n\n```\n<my-cookie-alert closebutton=\"true\"\
    ></my-cookie-alert>\n```\n\n这样，你将得到迄今为止所熟悉的常规 cookie 提示。\n\n![](img/Figure_8.2.jpg)\n\
    \n**图 8.2**\n\n在管理 `closebutton` 属性的值时，我们曾指出空字符串值与 true 值具有相同的含义。这允许我们将该属性用作开关属性，就像许多原生属性（例如\
    \ `enabled` 或 `checked`）一样。因此，你可以通过以下方式获得与将 true 值赋给 `closebutton` 属性相同的结果：\n\n\
    ```\n<my-cookie-alert closebutton></my-cookie-alert>\n```\n\n为了完整概述此组件，请记住以下标记与不使用\
    \ `closebutton` 属性具有相同的含义：\n\n```\n<my-cookie-alert closebutton=\"false\"></my-cookie-alert>\n\
    ```\n\n像往常一样，你可以通过 JavaScript 使用 `hasCloseButton` 属性获得与之前相同的结果。例如，以下代码强制显示关闭按钮：\n\
    \n```\nconst myCookieAlert = document.querySelector(\"my-cookie-alert\");\nmyCookieAlert.hasCloseButton\
    \ = true;\n```\n\n# 结论\n\n本章向你展示了如何准备你的 Web 组件以便与其他开发者共享。我们探讨了如何创建包含代码的模块，以及如何通过基于脚本和基于包的方法分发它们。\n\
    \n这些方法可以用于不同的开发环境。但无论采用哪种具体方法来分发你的组件，用户都可以基于你的组件创建新组件。事实上，他们可以扩展定义你组件的类来创建其个性化版本。\n\
    \n通过本章学到的知识，你现在能够分发你的 Web 组件，并通过扩展现有组件来创建新组件。\n\n在下一章中，我们将讨论如何在用知名 JavaScript\
    \ 库和框架（如 React、Angular 和 Vue）构建的应用程序中使用 Web 组件。\n\n# 问题\n\n1.  将 Web 组件作为传统脚本分发的主要缺点是什么？\n\
    2.  在分发组件之前对代码应用构建步骤的主要好处是什么？\n3.  如何克服将 Web 组件作为传统脚本分发的缺点？\n4.  如何将 Web 组件的代码转换为模块？\n\
    5.  如何使用 `<script>` 标签导入模块？\n6.  为什么需要包来分发你的 Web 组件？\n7.  发布 `npm` 包所需的最少 `package.json`\
    \ 字段有哪些？\n8.  如何将你的 GitHub 仓库作为 `npm` 包共享？\n9.  如何从 GitHub 仓库安装 `npm` 包？\n10.\
    \ 如何将你的 `npm` 包发布到公共 npm 注册表？\n11. 如何扩展现有的 Web 组件？\n\n# 第 9 章\n\n# Web 组件与其他 UI\
    \ 框架\n\n在本书中，你已经了解到 Web 组件背后的技术允许你自定义标准 HTML 元素并创建自定义 HTML 元素。当我们在*第 1 章“Web 组件入门”*中介绍它们时，我们说过\
    \ Web 组件的主要优势之一是它们的互操作性。即无论你使用什么库或框架来构建 UI，它们都能在 HTML 页面或 Web 应用程序中工作。这是一个巨大的优势，允许你创建通用的\
    \ UI 组件，并以与使用 HTML 元素相同的方式使用它们。\n\n在本章中，我们将展示几个实际示例，说明 Web 组件与 UI 框架之间的互操作性是如何实现的。我们将看到如何以极少的努力将它们集成到\
    \ *React、Angular* 和 Vue 应用程序中。我们还将探讨一些关于如何通过 *Angular、Vue* 和 *React* 编写 Web 组件的方向。\n\
    \n# 结构\n\n*   Web 组件集成\n*   Web 组件与 React\n*   Web 组件与 Angular\n*   Web 组件与 Vue\n\
    *   使用 UI 框架构建 Web 组件\n\n# 目标\n\n本章的目标是演示如何将 Web 组件集成到使用 JavaScript UI 框架构建的网站和应用程序中。\n\
    \n你将学习如何在用 *React、Angular* 和 *Vue* 创建的应用程序中使用你的组件。你还将发现如何将这些框架构建的组件包装到自定义元素中。\n\
    \n# Web 组件集成\n\n你用 Web 组件技术构建的 HTML 元素作为标准 HTML 元素工作。这意味着无论你在哪里可以使用 HTML 元素，你都可以使用\
    \ Web 组件。这种可能性带来一个很棒的特性——无论你为 Web 应用程序或网站使用什么库，你都可以在任何地方使用你的 Web 组件。互操作性是 Web\
    \ 组件令人惊叹的主要优势。\n"
- fmt: "\nUnlike components created with *React, Angular, Vue*, and similar, Web Components\
    \ are not tied to a specific library or framework. For example, if you create\
    \ a UI component with React, you can use this component only in a React-based\
    \ application. A web component can be easily integrated into applications based\
    \ on virtually any UI library. This frees you from re-implement the same component\
    \ for different component libraries, as we will see later on.\n\n**Libraries and\
    \ frameworks are different things. A library is a group of functions focused on\
    \ a specific programming feature that an application can invoke. A framework is\
    \ a set of functions supporting different aspects of application development.\
    \ Despite these differences, we will talk about libraries and frameworks interchangeably.**\n\
    \nBefore going into the details of Web Components integration, keep in mind that\
    \ Web Components are not another UI framework - they are the native UI framework.\
    \ Web Components are not an alternative to existing UI frameworks - they can live\
    \ together. You don’t need to switch to Web Components and drop your UI framework.\
    \ You can introduce them to your applications as you need them. Web Components\
    \ are framework agnostic - they can be integrated into any framework. Write once;\
    \ use everywhere.\n\nTo demonstrate in practice how to use a web component within\
    \ applications built with UI JavaScript frameworks, we are going to integrate\
    \ the cookie alert component we created in the previous chapters with applications\
    \ built with *React, Angular,* and *Vue.*\n\n**In the following sections, we assume\
    \ you are familiar with React, Angular, or Vue. If not, please refer to the official\
    \ documentation for more information on these frameworks.**\n\n# [Web Components\
    \ and React](#toc.xhtml_s119a)\n\nLet’s start to see how to use our cookie demo\
    \ component in a simple React application. We are going to use the `create-react-app`\
    \ tool to create a basic application. So, type the following command in a terminal\
    \ window:\n\n`npx create-react-app react-app-cookie-alert`\n\nThis command will\
    \ create a simple but working React application in the `react-app-cookie-alert`\
    \ folder. After a few seconds, the application will be ready to run. To make available\
    \ our cookie alert component to the application, you need to install it. So, move\
    \ to the `react-app-cookie-alert` folder and type the following command:\n\n`npm\
    \ install andychiare/cookie-alert-demo`\n\nAs you know from the previous chapter,\
    \ this installs the `cookie-alert-demo` package directly from the component GitHub\
    \ repository. Now, to import and use the component in the React application, edit\
    \ the `src/App.js` file and change its content as follows:\n\n```\nimport React\
    \ from 'react';\nimport logo from './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\
    \nfunction App() {\n  return (\n    <div className=\"App\">\n      <header className=\"\
    App-header\">\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n\
    \        <p>\n          Edit <code>src/App.js</code> and save to reload.\n   \
    \     </p>\n        <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
    \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n       \
    \ >\n          Learn React\n        </a>\n      </header>\n      <cookie-alert></cookie-alert>\n\
    \    </div>\n  );\n}\n\nexport default App;\n```\n\nThe new code added to the\
    \ existing one is highlighted above. You imported the cookie alert module and\
    \ added the `<cookie-alert>` tag in the JSX code returned by the `App` component.\
    \ That’s all!\n\nYou are just using the web component like any standard HTML component.\
    \ To take a look at the resulting UI, run the `npm` start command and point your\
    \ browser to the `http://localhost:3000` address. You will get a page like the\
    \ following:\n\n![](images/Figure_9.1.jpg)\n\n**Figure 9.1**\n\nAs you see, you\
    \ have the cookie alert at the bottom of the page as it happened with standard\
    \ HTML pages, and it works as expected.\n\nOf course, you may want to customize\
    \ the cookie alert within your React application. For example, you may want to\
    \ change the default message. You can achieve this by assigning the new `message`\
    \ string to the `message` attribute of the component, as you would do within any\
    \ HTML page. However, your message could be created at runtime, and you may wonder\
    \ how to assign this value to the attribute. The following code shows how you\
    \ can assign a constant value to the `message` attribute:\n\n```\nimport React\
    \ from 'react';\nimport logo from './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\
    \nfunction App() {\n  const message = \"We use cookies, but respect your privacy!\"\
    ;\n  return (\n    <div className=\"App\">\n      <header className=\"App-header\"\
    >\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n        <p>\n\
    \          Edit <code>src/App.js</code> and save to reload.\n        </p>\n  \
    \      <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
    \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n       \
    \ >\n          Learn React\n        </a>\n      </header>\n      <cookie-alert\
    \ message={message}></cookie-alert>\n    </div>\n  );\n}\n\nexport default App;\n\
    ```\n\nYou assigned the expression containing the `message` constant to the attribute\
    \ with the same name, as you would have done with any `prop` assignment in React.\
    \ Of course, you can assign any valid expression returning a string to the `message`\
    \ attribute of the cookie alert component.\n\nIf you want to customize the cookie\
    \ alert component by accessing the `message` property via JavaScript, you need\
    \ to write a bit more code. You need to access the component by using `refs`.\n\
    \n**In React, refs provide a mechanism to access DOM nodes or React elements generated\
    \ by the** `render()` **method of a component. They represent a sort of shortcoming\
    \ to use in specific situations, like the one we are discussing.**\n\nTake a look\
    \ at the following code to see how to access the `message` property via a `ref`:\n\
    \n```\nimport React, {useRef, useEffect} from 'react';\nimport logo from './logo.svg';\n\
    import './App.css';\nimport 'cookie-alert-demo';\n\nfunction App() {\n  const\
    \ cookieAlert = useRef(null);\n  useEffect(() => {\n    cookieAlert.current.message\
    \ = \"We use cookies, but respect your privacy!\";\n  });\n  return (\n    <div\
    \ className=\"App\">\n      <header className=\"App-header\">\n        <img src={logo}\
    \ className=\"App-logo\" alt=\"logo\" />\n        <p>\n          Edit <code>src/App.js</code>\
    \ and save to reload.\n        </p>\n        <a\n          className=\"App-link\"\
    \n          href=\"https://reactjs.org\"\n          target=\"_blank\"\n      \
    \    rel=\"noopener noreferrer\"\n        >\n          Learn React\n        </a>\n\
    \      </header>\n      <cookie-alert ref={cookieAlert}></cookie-alert>\n    </div>\n\
    \  );\n}\n\nexport default App;\n```\n\nYou imported the `useRef()` and `useEffect()`\
    \ hooks. Then, you created the `cookieAlert` ref by using the `useRef()` hook\
    \ and used this `ref` in effect defined with the `useEffect()` hook. In the markup,\
    \ you notice that we added the `ref` property to our cookie alert component and\
    \ assigned the `cookieAlert` ref created before.\n\nFinally, the effect created\
    \ above uses the `cookieAlert` ref to get access to the cookie alert component\
    \ through its `current` property. At this point, we can assign the string we want\
    \ to display to the `message` property.\n\nYou can apply the same approach to\
    \ handle events generated by the cookie alert component. The following code shows\
    \ how to add an event handler for the `accepted` event:\n\n```\nuseEffect(() =>\
    \ {\n  cookieAlert.current.message = \"We use cookies, but respect your privacy!\"\
    ;\n  cookieAlert.current.addEventListener(\"accepted\", () => alert(\"Thanks for\
    \ accepting our cookie policy!\"));\n});\n```\n\nAs you can see, you add the event\
    \ listener within the effect created before.\n"
  raw: 'Unlike components created with *React, Angular, Vue*, and similar, Web Components
    are not tied to a specific library or framework. For example, if you create a
    UI component with React, you can use this component only in a React-based application.
    A web component can be easily integrated into applications based on virtually
    any UI library. This frees you from re-implement the same component for different
    component libraries, as we will see later on.


    **Libraries and frameworks are different things. A library is a group of functions
    focused on a specific programming feature that an application can invoke. A framework
    is a set of functions supporting different aspects of application development.
    Despite these differences, we will talk about libraries and frameworks interchangeably.**


    Before going into the details of Web Components integration, keep in mind that
    Web Components are not another UI framework - they are the native UI framework.
    Web Components are not an alternative to existing UI frameworks - they can live
    together. You don’t need to switch to Web Components and drop your UI framework.
    You can introduce them to your applications as you need them. Web Components are
    framework agnostic - they can be integrated into any framework. Write once; use
    everywhere.


    To demonstrate in practice how to use a web component within applications built
    with UI JavaScript frameworks, we are going to integrate the cookie alert component
    we created in the previous chapters with applications built with *React, Angular,*
    and *Vue.*


    **In the following sections, we assume you are familiar with React, Angular, or
    Vue. If not, please refer to the official documentation for more information on
    these frameworks.**


    # [Web Components and React](#toc.xhtml_s119a)


    Let’s start to see how to use our cookie demo component in a simple React application.
    We are going to use the `create-react-app` tool to create a basic application.
    So, type the following command in a terminal window:


    `npx create-react-app react-app-cookie-alert`


    This command will create a simple but working React application in the `react-app-cookie-aler`t
    folder. After a few seconds, the application will be ready to run. To make available
    our cookie alert component to the application, you need to install it. So, move
    to the `react-app-cookie-alert` folder and type the following command:


    `npm install andychiare/cookie-alert-demo`


    As you know from the previous chapter, this installs the `cookie-alert-demo` package
    directly from the component `GitHub` repository. Now, to import and use the component
    in the React application, edit the `src/App.js` file and change its content as
    follows:


    `import React from ''react'';`


    `import logo from ''./logo.svg'';`


    `import ''./App.css'';`


    `import ''cookie-alert-demo'';`


    `function App() {`


    `return (`


    `<div className="App">`


    `<header className="App-header">`


    `<img src={logo} className="App-logo" alt="logo" />`


    `<p>`


    `Edit <code>src/App.js</code> and save to reload.`


    `</p>`


    `<a`


    `className="App-link"`


    `href="https://reactjs.org"`


    `target="_blank"`


    `rel="noopener noreferrer"`


    `>`


    `Learn React`


    `</a>`


    `</header>`


    `<cookie-alert></cookie-alert>`


    `</div>`


    `);`


    `}`


    `export default App;`


    The new code added to the existing one is highlighted above. You imported the
    cookie alert module and added the `<cookie-alert>` tag in the JSX code returned
    by the App component. That’s all!


    You are just using the web component like any standard HTML component. To take
    a look at the resulting UI, run the `npm` start command and point your browser
    to the `http://localhost:3000` address. You will get a page like the following:


    ![](images/Figure_9.1.jpg)


    **Figure 9.1**


    As you see, you have the cookie alert at the bottom of the page as it happened
    with standard HTML pages, and it works as expected.


    Of course, you may want to customize the cookie alert within your React application.
    For example, you may want to change the default message. You can achieve this
    by assigning the new `message` string to the message attribute of the component,
    as you would do within any HTML page. However, your message could be created at
    runtime, and you may wonder how to assign this value to the attribute. The following
    code shows how you can assign a constant value to the `message` attribute:


    `import React from ''react'';`


    `import logo from ''./logo.svg'';`


    `import ''./App.css'';`


    `import ''cookie-alert-demo'';`


    `function App() {`


    `const message = "We use cookies, but respect your privacy!";`


    `return (`


    `<div className="App">`


    `<header className="App-header">`


    `<img src={logo} className="App-logo" alt="logo" />`


    `<p>`


    `Edit <code>src/App.js</code> and save to reload.`


    `</p>`


    `<a`


    `className="App-link"`


    `href="https://reactjs.org"`


    `target="_blank"`


    `rel="noopener noreferrer"`


    `>`


    `Learn React`


    `</a>`


    `</header>`


    `<cookie-alert message={message}></cookie-alert>`


    `</div>`


    `);`


    `}`


    `export default App;`


    You assigned the expression containing the message constant to the attribute with
    the same name, as you would have done with any `prop` assignment in React. Of
    course, you can assign any valid expression returning a string to the `message`
    attribute of the cookie alert component.


    If you want to customize the cookie alert component by accessing the `message`
    property via JavaScript, you need to write a bit more code. You need to access
    the component by using `refs`.


    **In React, refs provide a mechanism to access DOM nodes or React elements generated
    by the** `render()` **method of a component. They represent a sort of shortcoming
    to use in specific situations, like the one we are discussing.**


    Take a look at the following code to see how to access the `message` property
    via a `ref`:


    `import React, {useRef, useEffect} from ''react'';`


    `import logo from ''./logo.svg'';`


    `import ''./App.css'';`


    `import ''cookie-alert-demo'';`


    `function App() {`


    `const cookieAlert = useRef(null);`


    `useEffect(() => {`


    `cookieAlert.current.message = "We use cookies, but respect your privacy!";`


    `});`


    `return (`


    `<div className="App">`


    `<header className="App-header">`


    `<img src={logo} className="App-logo" alt="logo" />`


    `<p>`


    `Edit <code>src/App.js</code> and save to reload.`


    `</p>`


    `<a`


    `className="App-link"`


    `href="https://reactjs.org"`


    `target="_blank"`


    `rel="noopener noreferrer"`


    `>`


    `Learn React`


    `</a>`


    `</header>`


    `<cookie-alert ref={cookieAlert}></cookie-alert>`


    `</div>`


    `);`


    `}`


    `export default App;`


    You imported the `useRef()` and `UseEffect()` hooks. Then, you created the `cookieAlert`
    ref by using the `useRef()` hook and used this `ref` in effect defined with the
    `useEffect()` hook. In the markup, you notice that we added the `ref` property
    to our cookie alert component and assigned the `cookieAlert` ref created before.


    Finally, the effect created above uses the `cookieAlert` ref to get access to
    the cookie alert component through its `current` property. At this point, we can
    assign the string we want to display to the `message` property.


    You can apply the same approach to handle events generated by the cookie alert
    component. The following code shows how to add an event handler for the `accepted`
    event:


    `useEffect(() => {`


    `cookieAlert.current.message = "We use cookies, but respect your privacy!";`


    `cookieAlert.current.addEventListener("accepted", () => alert("Thanks for accepting
    our cookie policy!"));`


    `});`


    As you can see, you add the event listener within the effect created before.'
