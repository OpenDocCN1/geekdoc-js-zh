    # 关于作者


    **安德烈亚·基亚雷利** 是一位软件工程师和技术作者，在软件开发行业拥有超过 20 年的经验。在他的职业生涯中，安德烈亚以不同的方式（作为独立承包商、公司所有者、员工）担任过多种角色（软件开发人员、架构师、培训师、技术作家）。


    在他参与的项目中，他使用过多种编程语言和技术：从 .NET 到 Node.js，从 C# 到 JavaScript，从 SQL Server 到 MongoDB，从
    IIS 到 nginx。


    最近，他专注于 JavaScript 生态系统，包括服务器端和客户端。


    他曾为许多在线和离线杂志撰稿，并撰写了几本书。


    目前，他在 Auth0 担任研发内容工程师。


    # 关于审校者


    **阿坎克莎·辛哈** 是一位技术经理，在软件开发的多个渐进式角色中拥有超过 12 年的经验。她的工作领域涵盖数字营销、技术和保险。她是 Cognizant
    工具与自动化团队的创始成员之一，为科技巨头运营团队服务。


    作为从零开始构建机器人和工具生态系统的贡献者，她探索了 Web 开发、UI/UX 以及机器学习、聊天机器人、云计算、自然语言处理等最新技术。她的技能包括 JavaScript、Google
    Cloud、Google App Script、AngularJS、TypeScript、Python、Chrome 扩展、GSuites、HTML & CSS
    和 Unix Shell 脚本。自然语言、聊天机器人、Big Query 和机器学习是她的兴趣领域，她已在这些领域完成了多个原型。


    她拥有 RTM Nagpur 大学的电气与电子工程学士学位，并曾任职于 Cognizant Technology Solutions。


    # 致谢


    我要感谢一些人，是他们让这本书成为现实。


    首先，我要感谢我的妻子和我的两个女儿 Sofia 和 Lorena，感谢她们在我花费许多周末写作时对我的包容。


    我还要感谢线上和线下的开发者社区，他们乐于交流经验和代码，并像朋友而非同事一样相互支持。


    最后，我要感谢 BPB 团队，感谢他们耐心等待我那些总是迟交的章节。


    # 前言


    近年来，Web 用户界面的设计不断发展，逐渐变得与原生图形用户界面非常相似。这种演变主要得益于一些流行的库，它们推广了构建用户界面的可组合方法。其中，React
    和 Angular 可以说是这种 Web 用户界面设计新方式的主要影响者。


    然而，尽管这些库为 Web 开发带来了创新，但它们也创造了一些相对孤立的世界。使用 React 的开发者只能与其他 React 应用程序共享和复用他们的组件。同样，Angular
    开发者只能与 Angular 项目共享和复用他们的组件。当然，其他 UI 库也是如此。


    这种孤立并非 Web 的本意。恰恰相反，Web 技术应该是开放和可互操作的。我们如何解决由不同方法实现相同高层设计所造成的碎片化问题？


    Web 组件回答了这个问题。


    Web 组件所依赖的技术集允许开发者创建组件，这些组件可用于构建 Web 用户界面，而无需依赖特定项目中使用的库。这些技术是标准的，并且得到大多数现代浏览器的支持，因此它们可以被视为创建可复用和可互操作
    UI 组件的标准方式。


    本书将向您介绍 Web 组件背后的技术，并通过实践方法让您逐步开始使用它们。事实上，在整本书中，您将完成一个完整的 Web 组件项目，这将使您详细了解如何使用它们。


    本书的 10 章将让您探索以下主题：


    **第 1 章** 介绍了基于组件的设计方法来构建用户界面，以及 Web 组件背后的基本概念。


    **第 2 章** 讨论了如何扩展现有的标准 HTML 元素以自定义其行为。


    **第 3 章** 描述了如何创建自定义元素，即从头开始构建的自定义 HTML 元素，而不扩展标准元素。


    **第 4 章** 解释了如何管理自定义元素的属性和特性，以及如何应用最佳实践来保持它们同步。


    **第 5 章** 重点介绍如何通过监听事件和创建自己的事件来丰富 Web 组件的交互性。


    **第 6 章** 展示了如何通过利用 Shadow DOM 为 Web 组件实现封装。此功能允许您在任何页面上包含您的组件，而无需担心外部 CSS 或 JavaScript
    的副作用。


    **第 7 章** 讨论了如何使用 HTML 模板来简化组件的标记管理。


    **第 8 章** 描述了分发和导入包含 Web 组件的模块的不同策略。它还展示了如何扩展它们以创建新组件。


    **第 9 章** 讨论了 Web 组件如何与其他 UI 库和框架集成。它展示了如何以很少的工作量将它们集成到 React、Angular 和 Vue 应用程序中。它还展示了如何通过用
    Angular、Vue 和 React 编写来创建 Web 组件。


    **第 10 章** 描述了一些库，例如 LitElement、Hybrids、Slim 和 Stencil，它们可以帮助开发者构建 Web 组件。


