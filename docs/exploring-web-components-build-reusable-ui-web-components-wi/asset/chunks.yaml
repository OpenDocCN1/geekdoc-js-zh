    # CHAPTER 5


    # Handling Events


    Events are an important part of UI development. They allow you to manage the user
    interaction with your application and to react to specific system behaviors. Let''s
    explore in this chapter how to enable a web component to listen to events, to
    handle them, and to create custom events. After a brief recap about DOM event
    management, you will learn how to integrate your web components with standard
    event listening. You will also discover how to deal with event propagation and
    how to generate custom events without and with event data. Finally, you will see
    how to implement one of the best practices by removing all registered event listeners
    to achieve better system resource management.


    As usual, throughout the chapter, we will actuate these new concepts by enriching
    our cookie alert component to handle and generate events.


    # Structure


    *   Event management basics


    *   Listening to standard events


    *   Creating custom events


    *   Removing event listeners


    # Objectives


    After reading this chapter, you will be able to create web components able to
    listening standard events occurring on it as a whole or occurring on any of the
    HTML standard elements of its UI. You will also learn how to make your components
    to generate custom events that resemble as much as possible to standard events.


    # Event management basics


    Event management is very important in any interactive application. As a JavaScript
    developer, you know how to deal with events. Anyway, before going into event management
    for web components, let''s recap in this section a few notions about events, just
    be on the same page.


    Events allow us to define the behavior of our application when the user interacts
    with it or when something happens inside the system, basically the DOM, or the
    application itself. To intercept events, we usually use a handler or listener,
    which is a function associated with a specific event.


    You have three ways to associate a handler with an event:


    *   Using the `addEventListener()` method in your JavaScript code


    *   Using specific attributes in the HTML markup


    *   Using specific properties of the HTML element


    Using attributes and properties to assign event handlers to an HTML element is
    quite straightforward and handy. However, the `addEventListener()` method provides
    you with a more advanced way to manage events. For example, it allows you to add
    multiple handlers to the same event. It also allows you to control how the handler
    fits in the event propagation flow, as we will see in a moment.


    When an event triggers, an object containing some details about the event itself
    is passed to the handler. You can use this object in your handler, as shown in
    the following example:


    ```

    const button = document.getElementById("myButton");

    button.addEventListener("click", (event) => {

    console.log(''You clicked the button "${event.target.innerHTML}"'');

    });

    ```


    In this example, we used the `target` property of the event object. It represents
    the HTML element the event fired on. We used the `innerHTML` property of this
    HTML element to show the text of the clicked button on the browser''s console.


    When an event occurs, it goes through the DOM following a specific path. This
    path is known as **event propagation** flow and takes place in three phases:


    *   **Capture phase**: In this phase, the event propagates from the root of the
    DOM to the actual target element.


    *   **Target phase:** In this phase, the event reaches the target element.


    *   **Bubbling phase:** This is the phase in which the event goes up the DOM tree
    starting from the target element until it reaches the root again; so, it passes
    through the same nodes crossed in the capture phase.


    The following picture from the W3C specifications shows the event propagation
    in these three phases:


    ![](images/5-1.jpg)


    **Figure 5.1**


    During the three phases, the event object associated with the event is passed
    on to any handlers encountered along the way. Normally, in the capturing phase,
    handlers ignore the event and let it flow to the target element. Once the target
    element is reached, its handler code is executed. In the next bubbling phase,
    the event handlers are executed as you go towards the root of the DOM.


    Understanding this flow helps to prevent strange behaviors and to detect possible
    issues while managing events.


    If you want, for some reason, your handler is executed in the capture phase of
    the event propagation, you can leverage a third parameter of the `addEventListener()`
    method. The following example shows how to do this:


    ```

    const button = document.getElementById("myButton");

    const handler = (event) => {

    console.log(''You clicked the button "${event.target.innerHTML}"'');

    };

    button.addEventListener("click", handler, true);

    ```


    The third parameter of the `addEventListener()` method is a `Boolean` that specifies
    if the handler must be executed during the capture phase. Its default value is
    `false` and prevents the handler from being executed during the capture phase.


    While handling an event, we have the opportunity to alter the event flow. For
    example, we can decide to stop the event flow by using the `stopPropagation()`
    method of the event object. It is an example of how we can use this method:

