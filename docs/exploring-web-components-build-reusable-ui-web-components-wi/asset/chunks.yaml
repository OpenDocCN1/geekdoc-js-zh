    \ as much compliant as possible to standard HTML elements, you would like to add\
    \ this kind of attributes to it. Unfortunately, this feature is not free. You\
    \ need to implement the support for these attributes on your own, and it is not\
    \ so trivial.\n\nTo have an idea of how to manage onevent attributes, let's take\
    \ a look at how we can add support for the `onaccepted` attribute to our cookie\
    \ alert web component. Keep in mind that adding such types of attributes is no\
    \ more than any typical attribute. Also, it is a best practice to add a similar\
    \ property when you are adding an attribute to your component. This mimics the\
    \ usual behavior of standard HTML elements and lets the user find what they are\
    \ used to expect.\n\n**Remember that, as per specifications, the onevent attributes\
    \ and properties allow you to assign only one event handler for a specific event.\
    \ If you need to attach multiple handlers for one event, you should use the `addEventListener()`\
    \ method.**\n\nSo, as a first step, let's add an internal property that will keep\
    \ the current handler:\n\n```\nconstructor() {\n    super();\n    this._message\
