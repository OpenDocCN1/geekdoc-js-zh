    在前面的章节中，我们创建了 cookie 提醒自定义元素，并了解了如何在 HTML 页面中使用它。实际上，使用自主自定义元素相当简单。一旦你定义了实现它的类，并用标签名注册了它，你只需在
    HTML 页面的标记中使用该标签名，如下所示：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>使用 Webpack 构建系统的 Web 组件</title>

    <script src="./wc-polyfills/webcomponents-loader.js"></script>

    <script src="./bundle.js"></script>

    </head>

    <body>

    <h1>这是你的 Web 组件</h1>

    <cookie-alert></cookie-alert>

    </body>

    </html>

    ```


    有趣的是，你的自定义元素会变得与任何其他标准 HTML 元素难以区分。由于你的组件派生自 `HTMLElement`，你可以使用所有 HTML 元素共有的特性，而无需编写额外的代码。例如，你可以使用
    `hidden` 属性，如下所示：


    `<cookie-alert hidden></cookie-alert>`


    你的组件将像任何其他具有 `hidden` 属性的标准元素一样，不会在页面上显示。此外，你还可以附加事件监听器，如下所示：


    `<cookie-alert onclick=”alert(‘你点击了！’)”></cookie-alert>`


    当你点击组件时，会弹出一个包含你传入消息的警告窗口，如下图所示：


    ![](img/Figure_3.6.jpg)


    **图 3.6**


    标准 HTML 元素的所有通用属性都会自动在你的自定义元素中可用。以下是最常见的一些属性列表：


    | **属性** | **描述** |

    | `hidden` | 指示元素是否隐藏 |

    | `id` | 元素的标识符 |

    | `innerHTML` | 表示元素内部内容的标记 |

    | `innerText` | 表示元素的文本内容 |

    | `onblur` | 失焦事件（即元素失去焦点时）的事件处理程序 |

    | `onfocus` | 聚焦事件（即元素获得焦点时）的事件处理程序 |

    | `onclick` | 点击事件的事件处理程序 |

    | `onmousedown` | `mousedown` 事件（即用户按下鼠标按钮时）的事件处理程序 |

    | `onmouseover` | mouseover 事件（即用户将鼠标指针移到元素上时）的事件处理程序 |

    | `onmouseup` | `mouseup` 事件（即用户释放鼠标按钮时）的事件处理程序 |

    | `onresize` | resize 事件（即当前浏览器窗口大小改变时）的事件处理程序 |

    | `style` | 表示元素内联样式的 CSS 声明 |

    | `title` | 通常当鼠标悬停在元素上时以工具提示弹出窗口显示的文本 |


    **表 3.2**


    你可以在自定义元素的标记中使用这些属性，如上所示。但你也可以在 JavaScript 中使用相应的属性，就像处理标准 HTML 元素一样。例如，你可以通过
    JavaScript 操作其 `hidden` 属性来隐藏你的 cookie 提醒组件。


    **请记住，属性和属性（DOM 属性）不是一回事。属性是 HTML 标记的一部分，而属性是标记的对象表示（DOM）的一部分。**


    **通常，属性和 DOM 属性之间存在映射关系，但并非总是如此。**


    假设你的组件已分配了一个标识符，如下例所示：


    `<cookie-alert id=”myCookieAlert”></cookie-alert>`


    你可以使用以下 JavaScript 代码隐藏此组件：


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.hidden = true;

    };

    ```


    如你所见，我们只是将 `true` 值赋给了继承的 `hidden` 属性。当然，这与在 HTML 标记中设置 `hidden` 属性效果相同。


    类似地，你可以通过 JavaScript 使用以下代码添加点击事件的处理程序：


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.onclick = () => alert(“你点击了！”);

    };

    ```


    在这种情况下，我们使用了自定义元素的 `onclick` 属性，该属性映射到 `onclick` 属性。另一种方法是使用 `addEventListener()`
    方法，如下例所示：


    ```

    window.onload = function() {

    const cookieAlert = document.getElementById("myCookieAlert");

    cookieAlert.addEventListener(“click”, () => alert(“你点击了！”));

    };

    ```


    除了使用 `addEventListener()` 方法与使用 `onclick` 属性和属性具有相同效果之外，它还清楚地告诉你，你的自定义元素还继承了方法，而不仅仅是属性和属性。


    以下是你的自定义元素从 `HTMLElement` 继承的最常见方法：


    | **方法** | **描述** |

    | `addEventListener` | 在元素上为特定事件类型注册事件处理程序 |

    | `getAttribute` | 根据属性名称返回元素属性的值 |

    | `getElementsByClassName` | 返回元素所有具有给定 CSS 类的后代元素的集合 |

    | `getElementsByTagName` | 返回元素所有具有给定标签名的后代元素的集合 |

    | `querySelector` | 返回与给定选择器字符串匹配的第一个元素 |

    | `querySelectorAll` | 返回与给定选择器字符串匹配的元素列表 |

    | `remove` | 从 DOM 中移除元素 |

    | `removeAttribute` | 从元素中移除给定的属性 |

    | `removeEventListener` | 从元素中移除事件监听器 |

    | `setAttribute` | 为元素的给定属性设置值 |

    | `toggleAttribute` | 切换布尔属性，如果存在则移除，如果不存在则添加 |


    **表 3.3**


    请记住，你可以使用这些属性、属性和方法，仅仅是因为你的自定义元素继承自 `HTMLElement`。


    # 结论


    本章为你提供了构建“自主自定义元素”的基础知识。我们逐步构建了一个简单的 Web 组件，用于显示关于你网站 cookie 政策的提醒消息。在构建此组件的过程中，我们探讨了自主自定义元素的基本结构，以及向其添加标记和
    CSS 规则以定义其 UI 的基本技术。我们分析了 Web 组件的生命周期，并讨论了在每个阶段你可以做什么和不能做什么。最后，我们了解了如何通过标记和 JavaScript
    在你的 Web 应用程序中使用你的 Web 组件。


    通过本章收集的信息，你能够创建一个带有标记和 CSS 的简单自主自定义元素。由于你学习了 Web 组件生命周期的各个阶段，你可以选择合适的反应来尽可能好地管理组件的生命周期。此外，你还知道如何在你的网页中使用你的
    Web 组件，以及默认情况下哪些功能可用。


    在下一章中，我们将继续改进你在本章中开始构建的 Web 组件，添加对自定义属性和属性的支持。


    # 问题


    1.  注册自主自定义元素和注册自定义原生元素有什么区别？


    2.  什么是自定义元素反应？


    3.  Web 组件可能有哪些反应？


    4.  组件的创建和升级之间有什么区别？


    5.  操作 DOM 的最佳反应是什么？


    6.  `adoptedCallback()` 反应在何时被调用？


    7.  `disconnectedCallback()` 反应在何时被调用？


    8.  为什么自主自定义元素即使你没有实现它们，也会有一些可用的属性、属性和方法？


    '
- fmt: "\n# [Chapter 4: Managing Properties and Attributes](#toc.xhtml_c04)\n\nThis\
    \ chapter will discuss making a web component configurable through properties\
    \ and attributes. You will learn the difference between a property and an attribute\
    \ and how we can manage them by using the standard DOM API. Then, we will see\
    \ how you can add properties to your web component and how to map their values\
    \ to the corresponding attributes. Vice versa, you will also learn how to map\
    \ attributes to properties and how to keep both in sync.\n\nAt the end of the\
    \ chapter, we will discuss a few factors that may affect the performance and the\
    \ effectiveness of your component.\n\n## [Structure](#toc.xhtml_s46a)\n\n*   Attributes\
    \ and properties\n*   Managing properties\n*   Syncing attributes and properties\n\
    *   Caveats and suggestions\n\n## [Objectives](#toc.xhtml_s47a)\n\nThis chapter\
    \ will provide you with a clear understanding of properties and attributes. You\
    \ will learn how to enrich your web components by adding support for properties\
    \ and attributes so that the user can customize it. You will also learn the best\
    \ practice you should adopt to make your web component similar to standard HTML\
    \ elements and avoid possible performance pitfalls.\n\n## [Attributes and properties](#toc.xhtml_s48a)\n\
    \nIn the previous chapter, we started to build up a web component that informs\
    \ the user about the cookie management policy applied by the current website -\
    \ the cookie alert. So far, the implementation simply shows a default text wired\
    \ into the JavaScript code of the web component. Of course, this is not the ideal\
    \ approach for a real-world component. We’d like to let the developer that uses\
    \ our web component specify the text they want to show. In other words, we want\
    \ the user to be able to customize our web component. Typically, an HTML element\
    \ can be customized by assigning specific values to its attributes, in the markup\
    \ of the page, or to its properties, in JavaScript code.\n\nWe are going to implement\
    \ in our cookie alert this standard way to customize HTML elements. But before\
    \ going to the actual implementation, we need to clarify what attributes and properties\
    \ are and what the difference is between them.\n\nAs a front-end developer, you\
    \ know how the browser works to interpret HTML and build up the DOM. In a few\
    \ words, when it loads a page, it parses the HTML markup and generates DOM objects\
    \ from the HTML elements found in it. Typically, each HTML element becomes a DOM\
    \ object in the DOM’s hierarchy, and each attribute of the HTML element becomes\
    \ a property of the DOM object. Even if this is the general scenario, this mapping\
    \ is not strictly one-to-one.\n\nLet’s see the main differences between HTML attributes\
    \ and DOM object properties.\n\n### [HTML attributes](#toc.xhtml_s49a)\n\nAs said,\
    \ when the browser parses an HTML element, it builds a corresponding DOM object.\
    \ It also analyzes the element’s attributes to assign their values to the corresponding\
    \ DOM object’s properties. Of course, the browser can identify standard attributes\
    \ in the HTML element, and in this case, it knows how to deal with it and how\
    \ to assign its value to the corresponding object property. So, for example, consider\
    \ the following markup:\n\n```\n<p id=”myPar”>This is a paragraph</p>\n```\n\n\
    The browser will generate an `HTMLParagraphElement` object and will assign the\
    \ value `myPar` to its `id` property. It knows that the `HTMLParagraphElement`\
    \ object has an `id` property that corresponds to the `id` HTML attribute, and\
    \ it can map the latter to the former.\n\nNote that HTML elements don’t share\
    \ the same standard attributes. For example, the `<input>` element has the `type`\
    \ attribute, while the `<div>` element don’t. So, the mapping between attributes\
    \ and properties has to be done on an element by element basis. This means that\
    \ if you add a non-standard attribute to an HTML element, this will not generate\
    \ a corresponding property on the DOM object. To better explain, you can write\
    \ the following markup:\n\n```\n<p id=”myPar” type=”special”>This is a paragraph</p>\n\
    ```\n\nBut you will not get a `type` property for the `HTMLParagraphElement` object.\
    \ Anyway, you can still access HTML attributes via the DOM APIs. In fact, each\
    \ DOM object has the following methods that allow you to work with attributes:\n\
    \n| **Method** | **Description** |\n| --- | --- |\n| `hasAttribute()` | Check\
    \ the existence of an attribute |\n| `getAttribute()` | Get the value of an attribute\
    \ |\n| `setAttribute()` | Set the value of an attribute |\n| `removeAttribute()`\
    \ | Remove the attribute from the HTML element |\n\n**Table 4.1**\n\nFor example,\
    \ you can access the non-standard attribute `type` of the paragraph described\
    \ in the markup above with the following code:\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    if (myPar.hasAttribute(“type”)) {\n  console.log(myPar.getAttribute(“type”));\n\
    }\n```\n\nThis code checks if the `type` attribute exists and displays its value\
    \ on the console.\n\nYou also have the `attributes` property containing the list\
    \ of all the attributes for the HTML element. Each element in the list is an object\
    \ representing the attribute. You can reproduce the same behavior of the previous\
    \ snippet of code by using the `attributes` property as follows:\n\n```\nconst\
    \ myPar = document.getElementById(“myPar”);\nconst typeAttribute = myPar.attributes.getNamedItem(“type”);\n\
    if (typeAttribute) {\n  console.log(typeAttribute.value);\n}\n```\n\nIn this case,\
    \ you get the object representing the attribute through the `getNamedItem()` method\
    \ of the `attributes` collection. Then, you access the attribute’s value through\
    \ its `value` property.\n\nWe will be back on non-standard attributes and some\
    \ caveats about them in a bit.\n\n**The** `attributes` **collection contains both\
    \ standard and non-standard attributes.**\n\nTo conclude this overview of HTML\
    \ element attributes, you should pay attention to two important features:\n\n\
    *   Attributes’ name are not case sensitive\n*   Attributes’ value is always strings\n\
    \nThis means, for example, that the following markups are equivalent:\n\n```\n\
    <p id=”myPar”>This is a paragraph</p>\n<p ID=”myPar”>This is a paragraph</p>\n\
    <p Id=”myPar”>This is a paragraph</p>\n```\n\nAlso, you can retrieve an attribute’s\
    \ value via JavaScript in the following equivalent ways:\n\n```\nconst typeAttribute\
    \ = myPar.attributes.getNamedItem(“type”);\nconst typeAttribute = myPar.attributes.getNamedItem(“Type”);\n\
    const typeAttribute = myPar.attributes.getNamedItem(“TYPE”);\n```\n\nIn addition,\
    \ whatever is the way you get or set a value for an attribute, it will be a string.\
    \ Consider the following example:\n\n```\nconst typeAttribute = myPar.attributes.getNamedItem(“type”);\n\
    console.log(typeAttribute.value + 1);\n```\n\nThe output you will get on the console\
    \ will be the concatenation of the attribute’s value and the string 1. If the\
    \ value of the `type` attribute is a numeric string, it is your responsibility\
    \ to convert it into a number. The same is true when you assign values to an attribute,\
    \ as in the following code:\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    myPar.setAttribute(“type”, 123);\n```\n\nEven if you are assigning a numeric value,\
    \ it will be converted into a string.\n\n### [DOM properties](#toc.xhtml_s50a)\n\
    \nAs said before, an HTML element is internally represented with a DOM object.\
    \ Typically, any standard attribute of the HTML element has a corresponding property\
    \ in this object, while non-standard attributes are available via generic methods\
    \ or the `attributes` collection, as we’ve seen before.\n\nDOM objects are regular\
    \ JavaScript objects, so we can deal with them as with any other object. So, for\
    \ example, we can assign values to its properties or add new properties and methods.\
    \ The following code shows how you can add a new property and a new method to\
    \ an `HTMLParagraphElement` object:\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    myPar.myProperty = “This is a new property!”;\nmyPar.getContent = () => myPar.innerHTML;\n\
    ```\n"
  raw: '# [CHAPTER 4](#toc.xhtml_c04)


    # [Managing Properties and Attributes](#toc.xhtml_c04)


    This chapter will discuss making a web component configurable through properties
    and attributes. You will learn the difference between a property and an attribute
    and how we can manage them by using the standard DOM API. Then, we will see how
    you can add properties to your web component and how to map their values to the
    corresponding attributes. Vice versa, you will also learn how to map attributes
    to properties and how to keep both in sync.


    At the end of the chapter, we will discuss a few factors that may affect the performance
    and the effectiveness of your component.


    # [Structure](#toc.xhtml_s46a)


    *   Attributes and properties


    *   Managing properties


    *   Syncing attributes and properties


    *   Caveats and suggestions


    # [Objectives](#toc.xhtml_s47a)


    This chapter will provide you with a clear understanding of properties and attributes.
    You will learn how to enrich your web components by adding support for properties
    and attributes so that the user can customize it. You will also learn the best
    practice you should adopt to make your web component similar to standard HTML
    elements and avoid possible performance pitfalls.


    # [Attributes and properties](#toc.xhtml_s48a)


    In the previous chapter, we started to build up a web component that informs the
    user about the cookie management policy applied by the current website - the cookie
    alert. So far, the implementation simply shows a default text wired into the JavaScript
    code of the web component. Of course, this is not the ideal approach for a real-world
    component. We’d like to let the developer that uses our web component specify
    the text they want to show. In other words, we want the user to be able to customize
    our web component. Typically, an HTML element can be customized by assigning specific
    values to its attributes, in the markup of the page, or to its properties, in
    JavaScript code.


    We are going to implement in our cookie alert this standard way to customize HTML
    elements. But before going to the actual implementation, we need to clarify what
    attributes and properties are and what the difference is between them.


    As a front-end developer, you know how the browser works to interpret HTML and
    build up the DOM. In a few words, when it loads a page, it parses the HTML markup
    and generates DOM objects from the HTML elements found in it. Typically, each
    HTML element becomes a DOM object in the DOM’s hierarchy, and each attribute of
    the HTML element becomes a property of the DOM object. Even if this is the general
    scenario, this mapping is not strictly one-to-one.


    Let’s see the main differences between HTML attributes and DOM object properties.


    # [HTML attributes](#toc.xhtml_s49a)


    As said, when the browser parses an HTML element, it builds a corresponding DOM
    object. It also analyzes the element’s attributes to assign their values to the
    corresponding DOM object’s properties. Of course, the browser can identify standard
    attributes in the HTML element, and in this case, it knows how to deal with it
    and how to assign its value to the corresponding object property. So, for example,
    consider the following markup:


    `<p id=”myPar”>This is a paragraph</p>`


    The browser will generate an `HTMLParagraphElement` object and will assign the
    value `myPar` to its id property. It knows that the `HTMLParagraphElement` object
    has an `id` property that corresponds to the id HTML attribute, and it can map
    the latter to the former.


    Note that HTML elements don’t share the same standard attributes. For example,
    the `<input>` element has the `type` attribute, while the `<div>` element don’t.
    So, the mapping between attributes and properties has to be done on an element
    by element basis. This means that if you add a non-standard attribute to an HTML
    element, this will not generate a corresponding property on the DOM object. To
    better explain, you can write the following markup:


    `<p id=”myPar” type=”special”>This is a paragraph</p>`


    But you will not get a type property for the `HTMLParagraphElement` object. Anyway,
    you can still access HTML attributes via the DOM APIs. In fact, each DOM object
    has the following methods that allow you to work with attributes:


    | **Method** | **Description** |


    | `hasAttribute()` | Check the existence of an attribute |


    | `getAttribute()` | Get the value of an attribute |


    | `setAttribute()` | Set the value of an attribute |


    | `removeAttribute()` | Remove the attribute from the HTML element |


    **Table 4.1**


    For example, you can access the non-standard attribute type of the paragraph described
    in the markup above with the following code:


    `const myPar = document.getElementById(“myPar”);`


    `if (myPar.hasAttribute(“type”)) {`


    `console.log(myPar.getAttribute(“type”));`


    `}`


    This code checks if the `type` attribute exists and displays its value on the
    console.


    You also have the `attributes` property containing the list of all the attributes
    for the HTML element. Each element in the list is an object representing the attribute.
    You can reproduce the same behavior of the previous snippet of code by using the
    attributes property as follows:


    `const myPar = document.getElementById(“myPar”);`


    `const typeAttribute = myPar.attributes.getNamedItem(“type”);`


    `if (typeAttribute) {`


    `console.log(typeAttribute.value);`


    `}`


    In this case, you get the object representing the attribute through the `getNamedItem()`
    method of the attributes collection. Then, you access the attribute’s value through
    its value property.


    We will be back on non-standard attributes and some caveats about them in a bit.


    **The** `attributes` **collection contains both standard and non-standard attributes.**


    To conclude this overview of HTML element attributes, you should pay attention
    to two important features:


    *   Attributes’ name are not case sensitive


    *   Attributes’ value is always strings


    This means, for example, that the following markups are equivalent:


    `<p id=”myPar”>This is a paragraph</p>`


    `<p ID=”myPar”>This is a paragraph</p>`


    `<p Id=”myPar”>This is a paragraph</p>`


    Also, you can retrieve an attribute’s value via JavaScript in the following equivalent
    ways:


    `const typeAttribute = myPar.attributes.getNamedItem(“type”);`


    `const typeAttribute = myPar.attributes.getNamedItem(“Type”);`


    `const typeAttribute = myPar.attributes.getNamedItem(“TYPE”);`


    In addition, whatever is the way you get or set a value for an attribute, it will
    be a string. Consider the following example:


    `const typeAttribute = myPar.attributes.getNamedItem(“type”);`


    `console.log(typeAttribute.value + 1);`


    The output you will get on the console will be the concatenation of the attribute’s
    value and the string 1\. If the value of the `type` attribute is a numeric string,
    it is your responsibility to convert it into a number. The same is true when you
    assign values to an attribute, as in the following code:


    `const myPar = document.getElementById(“myPar”);`


    `myPar.setAttribute(“type”, 123);`


    Even if you are assigning a numeric value, it will be converted into a string.


    # [DOM properties](#toc.xhtml_s50a)


    As said before, an HTML element is internally represented with a DOM object. Typically,
    any standard attribute of the HTML element has a corresponding property in this
    object, while non-standard attributes are available via generic methods or the
    attributes collection, as we’ve seen before.


    DOM objects are regular JavaScript objects, so we can deal with them as with any
    other object. So, for example, we can assign values to its properties or add new
    properties and methods. The following code shows how you can add a new property
    and a new method to an `HTMLParagraphElement` object:


    `const myPar = document.getElementById(“myPar”);`


    `myPar.myProperty = “This is a new property!”;`


    `myPar.getContent = () => myPar.innerHTML;`'
