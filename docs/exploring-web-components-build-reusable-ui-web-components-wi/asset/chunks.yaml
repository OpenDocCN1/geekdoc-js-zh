- fmt: '

    After setting up the basic infrastructure to define our component, let''s implement
    the UI of the cookie alert component with the following code:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    static get styles() {


    return css`


    .container {


    color: rgb(255, 255, 255);


    background-color: rgb(35, 122, 252);


    padding: 1em 1.8em;


    width: 100%;


    font-family: Helvetica,Calibri,Arial,sans-serif;


    }


    .footer {


    position:fixed;


    left:0px;


    bottom:0px;


    }


    .button {


    color: rgb(255, 255, 255);


    background-color: transparent;


    border-color: rgb(255, 255, 255);


    padding: 5px 40px;


    margin-right: 50px;


    cursor: pointer;


    float:right;


    }


    `;


    }


    render() {


    return html`


    <div class="container footer">


    <slot id="message" name="message">${this.message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>`;


    }


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    As you can see, we added the static getter `styles()` and the method `render().`
    The `styles()` getter defines the CSS style to apply to the component by using
    the CSS tagged template literal. The `render()` method generates the DOM structure
    for the component''s UI. It is the result of the specified HTML tagged template
    literal.


    You have no mention of the Shadow DOM. The `LitElement` base class internally
    manages it, so you don''t have to worry about it.


    # [Properties and attributes](#toc.xhtml_s136a)


    The next step is to add the message property and syncing it to the attribute with
    the same name. You can easily do this by adding the following code to the `CookieAlert`
    class:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    constructor() {


    super();


    this.message = "This website uses cookies to ensure you get the best experience";


    }


    static get properties() {


    return {


    message: {


    attribute: true,


    type: String,


    reflect: true


    }


    }


    }


    //…


    }

    ```


    We added static getter `properties().` This getter returns an object containing
    the definition of the properties for the component. In our case, we are defining
    the `message` property. The property definition is an object with a few options.


    The true value assigned to the attribute option indicates that the `message` property
    has to be mapped to an attribute with the same name.


    We also are specifying the property''s type. This is fundamental if you want to
    map the attribute to the property. In fact, remember that the type of an attribute
    is always a string, while the type of property can be any possible JavaScript
    type. You need to specify the property type to allow the correct type conversion
    when mapping the attribute to the property.


    Finally, the `reflect` option enables the mapping of the property to the attribute.
    As you can see, no need to observe attributes and explicitly manage type conversion.
    You also notice we added the class constructor. Its role, in this case, is to
    set a default value for the `message` property.


    The decorator-based syntax allows you to have a compact definition of properties,
    as the following snippet of code demonstrates:


    ```

    import { LitElement, html, css } from ''lit-element'';


    @customElement("cookie-alert")


    export default class CookieAlert extends LitElement {


    @property({


    attribute: true,


    type: String,


    reflect: true


    })


    message = "This website uses cookies to ensure you get the best experience";


    //…


    }

    ```


    The `@property` decorator takes the options to apply to the `message` property.
    Also, the `message` property initialization happens in the definition.


    # [Events](#toc.xhtml_s137a)


    To complete the implementation of our cookie alert component, we need to handle
    and emit events. For this purpose, we make a few little changes to the UI template
    in the `render()` method:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    render() {


    return html`


    <div class="container footer">


    <slot id="message" name="message">${this.message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button" @click="${() => this.style.visibility
    = "hidden"}">Close</button>


    <button id= "acceptButton" class="button" @click="${this.accept}">Accept</button>


    </div>`;


    }


    //…


    }

    ```


    You see that we added the `@click` binding in both buttons. The `@event` binding
    comes from the `lit-html` library. It allows you to bind a listener to an event
    directly in the template. In our case, we attached an arrow function to the first
    button to hide the cookie alert component. We also associated the `accept()` method
    to the click event on the second button.


    The `accept()` method has the same implementation of the listener we used in the
    original component:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    accept() {


    this.style.visibility = "hidden";


    setCookie("cookiesAccepted", "y", 365);


    this.dispatchEvent(new CustomEvent("accepted", {


    detail:{


    acceptedCookieName: "cookiesAccepted",


    acceptedCookieExpiration: 365}


    }));


    }


    //…


    }

    ```


    # [Lifecycle](#toc.xhtml_s138a)


    To complete the component implementation, we have to add the code that manages
    the acceptance cookie:


    ```

    import { LitElement, html, css } from ''lit-element'';


    export default class CookieAlert extends LitElement {


    // …


    connectedCallback() {


    super.connectedCallback();


    const cookiesAccepted = getCookie("cookiesAccepted")


    if (cookiesAccepted === "y") {


    this.style.visibility = "hidden";


    }


    }


    //…


    }

    ```


    You can see that the `connectedCallback()` method has quite the same implementation
    we did in our standard version of the component. The main difference is the call
    to the `connectedCallback()` method of the super class. This ensures that all
    the initializations implemented in the `connectedCallback()` method of the `LitElement`
    class are executed.


    The `LitElement` library provides other features that help you in building your
    Web Components. For example, in addition to the standard reactions, the `LitElement`
    class supports other methods called in various steps of the component''s lifecycle.
    As said at the beginning of the chapter, addressing this topic is beyond our scope.


    # [Hybrids](#toc.xhtml_s139a)


    The `Hybrids` library aims to provide you with a functional approach to define
    your Web Components. You should only rely on plain objects and pure functions.
    So, no classes nor inheritance. All the details of managing the native definition
    of Web Components are processed internally by the library.


    To use `Hybrid` in your Node-based project, install it by typing the following
    command in a terminal window:


    `npm install hybrids`


    Basic infrastructure


    Let''s explore the basic features of the `Hybrid` library by re-implementing our
    cookie alert component. The following code shows the basic elements to define
    a Web Component:


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    };


    define("cookie-alert", CookieAlert);

    ```


    You imported the `html()` and the `define()` functions. We will see later on how
    to use the `html()` function. The `define()` function is all you need to define
    your Web Component. The function takes the tag name for the component as the first
    argument and a literal object containing the component configuration. In the example,
    the `CookieAlert` object is empty, but we will fill it in a moment.


    # [Templates and UI](#toc.xhtml_s140a)

