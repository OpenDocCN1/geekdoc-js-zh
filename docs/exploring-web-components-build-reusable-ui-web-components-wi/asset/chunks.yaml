- fmt: "\nIn the following sections, we will take a quick look at how to create web\
    \ components by using `React`, `Angular`, and `Vue`. The examples we will provide\
    \ are very simple. They are not intended to be exhaustive, but they should just\
    \ give a basic idea of the general approach you can use to build your web components\
    \ with these frameworks.\n\n# Building Web Components with React\n\nCreating a\
    \ web component using React is a matter of wrapping a React component within a\
    \ standard class that extends `HTMLElement` and registering the associated tag\
    \ name. Let’s see how to define a wrapper around a basic React component like\
    \ the following:\n\n```\nimport React from 'react';\n\nfunction MyComponent()\
    \ {\n  return (\n    <div>I am the component!</div>\n  );\n}\n\nexport default\
    \ MyComponent;\n```\n\nThis code defines an elementary React component - it merely\
    \ shows a `<div>` with a text.\n\nYou can wrap this component in a web component\
    \ definition as follows:\n\n```\nimport React from 'react';\nimport ReactDOM from\
    \ 'react-dom';\nimport MyComponent from './MyComponent';\n\nclass MyComponentWC\
    \ extends HTMLElement {\n  connectedCallback() {\n    this.mountReactComponent();\n\
    \  }\n\n  disconnectedCallback() {\n    ReactDOM.unmountComponentAtNode(this.mountPoint);\n\
    \  }\n\n  mountReactComponent() {\n    if (!this.mountPoint) {\n      this.mountPoint\
    \ = document.createElement('div');\n      this.attachShadow({ mode: 'open' }).appendChild(this.mountPoint);\n\
    \    }\n    ReactDOM.render(<MyComponent />, this.mountPoint);\n  }\n}\n\nwindow.customElements.define('my-component',\
    \ MyComponentWC);\n```\n\nAs you can see, this is a standard definition for the\
    \ custom element `MyComponentWC`. You find the class definition that extends the\
    \ `HTMLElement` class and the registration of the `my-component` tag name.\n\n\
    The interesting thing happens in the class definition. You see that the `conncectedCallback()`\
    \ reaction invokes the `mountReactComponent()` method. This method takes care\
    \ of mounting the `MyComponent` React component into the DOM. If a mount point\
    \ doesn’t exist, it creates one as a `<div>` and attaches the shadow DOM to it.\
    \ Then, it renders the React component at the mount point.\n\nThe `disconnectedCallback()`\
    \ reaction will unmount the React component from the mount point.\n\n# Building\
    \ Web Components with Angular\n\nTo create web components with Angular, you can\
    \ leverage the Angular elements module, as you will see in a minute. Let’s say\
    \ you have the following Angular component implemented in the `src/app/my-component/my-component.component.ts`\
    \ file:\n\n```\nimport { Component, OnInit } from '@angular/core';\n\n@Component({\n\
    \  selector: 'app-my-webcomponent',\n  templateUrl: './my-webcomponent.component.html',\n\
    \  styleUrls: ['./my-webcomponent.component.css']\n})\nexport class MyWebcomponentComponent\
    \ implements OnInit {\n  constructor() { }\n\n  ngOnInit() {\n  }\n}\n```\n\n\
    You need to add the Angular Elements package to your project by running the following\
    \ command:\n\n```\nng add @angular/elements\n```\n\nThen, change the code in `app.module.ts`\
    \ as follows:\n\n```\nimport { BrowserModule } from '@angular/platform-browser';\n\
    import { NgModule, Injector } from '@angular/core';\nimport { createCustomElement\
    \ } from '@angular/elements';\nimport { MyComponentComponent } from './my-component/my-component.component';\n\
    \n@NgModule({\n  declarations: [\n    MyComponentComponent\n  ],\n  imports: [\n\
    \    BrowserModule\n  ],\n  providers: [],\n  entryComponents: [MyComponentComponent]\n\
    })\nexport class AppModule {\n  constructor(injector: Injector) {\n    const el\
    \ = createCustomElement(MyComponentComponent, { injector });\n    customElements.define('my-component',\
    \ el);\n  }\n\n  ngDoBootstrap() {}\n}\n```\n\nYou imported the `createCustomElement()`\
    \ function from the Angular elements module and the Angular component shown above.\
    \ Then, you declared `MyComponentComponent` as the entry point of the project\
    \ and defined the constructor for the `AppModule` class. The body of the constructor\
    \ creates a custom element from the Angular component and registers the `my-component`\
    \ tag name as usual.\n\nFinally, launch the manual bootstrapping of the application.\
    \ This step is needed to start the Angular rendering process.\n\n# Building Web\
    \ Components with Vue\n\nThe process of creating web components with Vue is pretty\
    \ straightforward. Similarly to the Angular approach, Vue provides you with a\
    \ module that simplifies the task of wrapping a Vue component within a custom\
    \ element. Let’s assume you have a very simple Vue component like the following\
    \ implemented in the `src/components/MyComponent.vue` file:\n\n```\n<template>\n\
    \  <div>\n    I am the component\n  </div>\n</template>\n```\n\nIt’s a very trivial\
    \ component, but it is enough for our purpose. Change the `main.js` file of your\
    \ Vue project as follows:\n\n```\nimport Vue from 'vue'\nimport wrap from '@vue/web-component-wrapper';\n\
    import MyComponent from './components/MyComponent.vue';\n\nconst CustomElement\
    \ = wrap(Vue, MyComponent);\nwindow.customElements.define('my-component', CustomElement);\n\
    ```\n\nBesides the `MyComponent` component, this code imports the `wrap()` function\
    \ from the `web-component`-wrapper module. It applies this `wrap()` function to\
    \ get a custom element from the Vue component and registers the associated `my-componen`t\
    \ tag name.\n\n# Conclusion\n\nIn this chapter, you discovered how to use the\
    \ cookie alert component we built throughout this book in applications created\
    \ with `React`, `Angular`, and `Vue`. You saw that using a web component in applications\
    \ built with JavaScript UI frameworks is easy as using standard HTML elements.\
    \ However, you may need to make some adjustments better to integrate your components\
    \ with the framework of internal behavior.\n\nYou also explored how to create\
    \ web components by wrapping components based on these frameworks. You learned\
    \ that even if this is possible, you should carefully evaluate if it's worth it.\n\
    \nThe examples shown in this chapter should give you enough directions on how\
    \ to integrate Web Components and applications built with the most popular UI\
    \ frameworks.\n\nIn the next chapter, we will take an overview of the most popular\
    \ libraries and tools that help you in developing Web Components.\n\n# Questions\n\
    \n1.  What does Web Component interoperability mean?\n\n2.  How can you programmatically\
    \ access a web component in a React application?\n\n3.  How can you handle a web\
    \ component event in React?\n\n4.  Why you need the `CUSTOM_ELEMENTS_SCHEMA` module\
    \ in an Angular application that uses web components?\n\n5.  How do you configure\
    \ the `TypeScript` compiler in Angular to support JavaScript-based web components?\n\
    \n6.  How can you avoid that Vue throws an error when it comes across a web component’s\
    \ tag name?\n\n7.  Why would you want to create web components with a UI JavaScript\
    \ framework?\n\n8.  What drawbacks may you get building web components with a\
    \ UI JavaScript framework?\n\n# CHAPTER 10\n\n# Tools for Web Components Development\n\
    \nAt this point in the journey on Web Components building, you should be able\
    \ to create your own and using it in your applications regardless of the UI library\
    \ used. You learned enough to master the standard technologies behind Web Components:\
    \ Custom Elements, Shadow DOM, and templates.\n\nHowever, you may have noticed\
    \ that some steps in using these technologies to build components are cumbersome\
    \ or repetitive or complex. In other words, there is room to optimize the process\
    \ of creating Web Components. If you want to simplify the process of building\
    \ your Web Components, you can do it yourself or use a third-party tool. The first\
    \ case can be challenging and requires a thorough knowledge of JavaScript and\
    \ the DOM. The second case lets you get a simpler way to create your components\
    \ but requires you to learn a new abstraction over the standard technologies.\n"
  raw: 'In the following sections, we will take a quick look at how to create web
    components by using *React, Angular*, and Vue. The examples we will provide are
    very simple. They are not intended to be exhaustive, but they should just give
    a basic idea of the general approach you can use to build your web components
    with these frameworks.


    # [Building Web Components with React](#toc.xhtml_s123a)


    Creating a web component using React is a matter of wrapping a React component
    within a standard class that extends `HTMLElement` and registering the associated
    tag name. Let’s see how to define a wrapper around a basic React component like
    the following:


    `import React from ''react'';`


    `function MyComponent() {`


    `return (`


    `<div>I am the component!</div>`


    `);`


    `}`


    `export default MyComponent;`


    This code defines an elementary React component - it merely shows a `<div>` with
    a text.


    You can wrap this component in a web component definition as follows:


    `import React from ''react'';`


    `import ReactDOM from ''react-dom'';`


    `import MyComponent from ''./MyComponent'';`


    `class MyComponentWC extends HTMLElement {`


    `connectedCallback() {`


    `this.mountReactComponent();`


    `}`


    `disconnectedCallback() {`


    `ReactDOM.unmountComponentAtNode(this.mountPoint);`


    `}`


    `mountReactComponent() {`


    `if (!this.mountPoint) {`


    `this.mountPoint = document.createElement(''div'');`


    `this.attachShadow({ mode: ''open'' }).appendChild(this.mountPoint);`


    `}`


    `ReactDOM.render(<MyComponent />, this.mountPoint);`


    `}`


    `}`


    `window.customElements.define(''my-component'', MyComponentWC);`


    As you can see, this is a standard definition for the custom element `MyComponentWC`.
    You find the class definition that extends the `HTMLElement` class and the registration
    of the `my-component` tag name.


    The interesting thing happens in the class definition. You see that the `conncectedCallback()`
    reaction invokes the `mountReactComponent()` method. This method takes care of
    mounting the `MyComponent` React component into the DOM. If a mount point doesn’t
    exist, it creates one as a <div> and attaches the shadow DOM to it. Then, it renders
    the React component at the mount point.


    The `disconnectedCallback()` reaction will unmount the React component from the
    mount point.


    # [Building Web Components with Angular](#toc.xhtml_s124a)


    To create web components with Angular, you can leverage the Angular elements module,
    as you will see in a minute. Let’s say you have the following Angular component
    implemented in the `src/app/my-component/my-component.component.ts` file:


    `import { Component, OnInit } from ''@angular/core'';`


    `@Component({`


    `selector: ''app-my-webcomponent'',`


    `templateUrl: ''./my-webcomponent.component.html'',`


    `styleUrls: [''./my-webcomponent.component.css'']`


    `})`


    `export class MyWebcomponentComponent implements OnInit {`


    `constructor() { }`


    `ngOnInit() {`


    `}`


    `}`


    You need to add the Angular Elements package to your project by running the following
    command:


    `ng add @angular/elements`


    Then, change the code in `app.module.ts as` follows:


    `import { BrowserModule } from ''@angular/platform-browser'';`


    `import { NgModule, Injector } from ''@angular/core'';`


    `import { createCustomElement } from ''@angular/elements'';`


    `import { MyComponentComponent } from ''./my-component/my-component.component'';`


    `@NgModule({`


    `declarations: [`


    `MyComponentComponent`


    `],`


    `imports: [`


    `BrowserModule`


    `],`


    `providers: [],`


    `entryComponents: [MyComponentComponent]`


    `})`


    `export class AppModule {`


    `constructor(injector: Injector) {`


    `const el = createCustomElement(MyComponentComponent, { injector });`


    `customElements.define(''my-component'', el);`


    `}`


    `ngDoBootstrap() {}`


    `}`


    You imported the `createCustomElement()` function from the Angular elements module
    and the Angular component shown above. Then, you declared `MyComponentComponent`
    as the entry point of the project and defined the constructor for the AppModule
    class. The body of the constructor creates a custom element from the Angular component
    and registers the `my-component` tag name as usual.


    Finally, launch the manual bootstrapping of the application. This step is needed
    to start the Angular rendering process.


    # [Building Web Components with Vue](#toc.xhtml_s125a)


    The process of creating web components with Vue is pretty straightforward. Similarly
    to the Angular approach, Vue provides you with a module that simplifies the task
    of wrapping a Vue component within a custom element. Let’s assume you have a very
    simple Vue component like the following implemented in the `src/components/MyComponent.vue`
    file:


    `<template>`


    `<div>`


    `I am the component`


    `</div>`


    `</template>`


    It’s a very trivial component, but it is enough for our purpose. Change the `main.js`
    file of your Vue project as follows:


    `import Vue from ''vue''`


    `import wrap from ''@vue/web-component-wrapper'';`


    `import MyComponent from ''./components/MyComponent.vue'';`


    `const CustomElement = wrap(Vue, MyComponent);`


    `window.customElements.define(''my-component'', CustomElement);`


    Besides the `MyComponent` component, this code imports the `wrap()` function from
    the `web-component`-wrapper module. It applies this `wrap() function` to get a
    custom element from the Vue component and registers the associated `my-componen`t
    tag name.


    # [Conclusion](#toc.xhtml_s126a)


    In this chapter, you discovered how to use the cookie alert component we built
    throughout this book in applications created with *React, Angular,* and *Vue*.
    You saw that using a web component in applications built with JavaScript UI frameworks
    is easy as using standard HTML elements. However, you may need to make some adjustments
    better to integrate your components with the framework of internal behavior.


    You also explored how to create web components by wrapping components based on
    these frameworks. You learned that even if this is possible, you should carefully
    evaluate if it''s worth it.


    The examples shown in this chapter should give you enough directions on how to
    integrate Web Components and applications built with the most popular UI frameworks.


    In the next chapter, we will take an overview of the most popular libraries and
    tools that help you in developing Web Components.


    # [Questions](#toc.xhtml_s127a)


    1.  What does Web Component interoperability mean?


    2.  How can you programmatically access a web component in a React application?


    3.  How can you handle a web component event in React?


    4.  Why you need the `CUSTOM_ELEMENTS_SCHEMA` module in an Angular application
    that uses web components?


    5.  How do you configure the `TypeScript` compiler in Angular to support JavaScript-based
    web components?


    6.  How can you avoid that Vue throws an error when it comes across a web component’s
    tag name?


    7.  Why would you want to create web components with a UI JavaScript framework?


    8.  What drawbacks may you get building web components with a UI JavaScript framework?


    # [CHAPTER 10](#toc.xhtml_c10)


    # [Tools for Web Components Development](#toc.xhtml_c10)


    At this point in the journey on Web Components building, you should be able to
    create your own and using it in your applications regardless of the UI library
    used. You learned enough to master the standard technologies behind Web Components:
    Custom Elements, Shadow DOM, and templates.


    However, you may have noticed that some steps in using these technologies to build
    components are cumbersome or repetitive or complex. In other words, there is room
    to optimize the process of creating Web Components. If you want to simplify the
    process of building your Web Components, you can do it yourself or use a third-party
    tool. The first case can be challenging and requires a thorough knowledge of JavaScript
    and the DOM. The second case lets you get a simpler way to create your components
    but requires you to learn a new abstraction over the standard technologies.'
