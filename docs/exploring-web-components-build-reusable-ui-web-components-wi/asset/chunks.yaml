  trans: '


    **需要明确的是，DOM 的全局可访问性并非 Web Components 技术本身的问题。这是标准 DOM 的特性，并且会影响你用基于浏览器的技术构建的任何类型的组件，包括
    Angular、React、Vue 等框架。**


    解决这种封装问题的传统方法是将代表组件的 DOM 部分嵌入到一个独立的 DOM 中，即一个独立的 HTML 页面中。然后通过 `iframe` 将该页面附加到主页面。例如，*Google*
    允许开发者嵌入其地图和 *YouTube* 视频时，就采用了这种典型方法。


    要将此解决方案应用于我们的 Cookie 提醒组件，我们需要重新组织组件的代码，以便创建一个 `iframe`，将该 `iframe` 作为组件的主容器，并将其他所有元素附加到
    `iframe` 页面的 DOM 中。实际上，组件的 `createComponent()` 方法应该类似于以下代码：


    ```

    createComponent() {

    const iframe = document.createElement("iframe");

    iframe.style.border = 0;

    iframe.style.height = "200px";

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    iframe.contentDocument.body.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    // other code

    iframe.contentDocument.body.appendChild(div);

    this.appendChild(iframe);

    this.updateMessage();

    }

    ```


    尽管这种方法可能让你产生问题已解决的错觉，但它仍然存在一些 `问题`。你需要通过编程方式控制 `iframe` 的边框粗细和高度，以营造组件与主页面集成的假象。但你的组件并未真正与页面集成，而且你无法真正控制
    `iframe` 的高度。Iframe 的响应性并不好。此外，iframe 的设计初衷是在当前页面中嵌入另一个完整的文档。当我们想要将数据从父文档传递到子文档时，这会增加复杂性。换句话说，我们需要添加一个代码层，将数据从组件传递到内部文档，反之亦然。同时，我们还会失去上一章学到的所有事件处理功能。


    总之，iframe 并不是解决 Web Components 封装问题的方案。


    # 影子 DOM


    在介绍 Web Components 时，我们说过它们源于三种技术的结合——自定义元素、影子 DOM 和 HTML 模板。正如你所见，影子 DOM 是这些使能技术之一。它正是帮助我们解决前面章节中指出的封装问题的技术。


    # 什么是影子 DOM


    影子 DOM 是一组标准 API，允许你将一个私有的 DOM 附加到任何 HTML 元素上。这个私有 DOM 与页面 DOM 类似，但其内部结构不受全局 DOM
    状态的影响。


    当你将组件附加到 DOM 时，它的影子 DOM 会附加到全局 DOM 上，但保持私有。下图来自 *Mozilla 开发者网络文档，直观地展示了* 这一过程：


    ![](img/Figure_6.4.jpg)


    **图 6.4**


    **[来源](https://developer.mozilla.org/en-US/docs/Web/Web_Components/Using_shadow_DOM)**


    从这张图中，你可以看到影子 DOM 有特定的术语。让我们尝试定义一些常用术语。


    *   **影子 DOM**：这是一种对象模型技术和 API，允许你将一个私有的 DOM 附加到 HTML 元素上。

    *   **影子树**：与 HTML 元素关联的私有节点树；该树无法从全局 DOM 直接访问。

    *   **光树**：这是一个常规的节点子树。

    *   **影子宿主**：拥有关联影子树的 HTML 元素。

    *   **影子根**：影子树的根节点。


    这些术语可能看起来有些令人困惑，但我们将通过实际使用影子 DOM 来理解，希望你的疑问会随之消散。


    # 使用影子 DOM


    让我们看看如何通过使用影子 DOM 为我们的 Cookie 提醒组件添加封装。第一步，你需要在组件的构造函数中启用它。以下是新版本构造函数的样子：


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this.attachShadow({mode: "open"});

    this._onAcceptedListener = null;

    }

    ```


    你添加了一条新语句，将影子 DOM 的一个实例附加到当前组件上。根据上面的定义，组件本身（由 `this` 关键字标识）就是影子宿主。`attachShadow()`
    方法创建了一个影子树的实例，该树仅由它的根节点（即影子根）组成。这个影子根可以通过组件的 `shadowRoot` 属性访问。从现在开始，任何与组件 UI
    构建相关的操作都将涉及 `shadowRoot` 属性，而不是组件本身。


    考虑 `createComponent()` 方法的新版本：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this.shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    如你所见，之前我们通过 `this` 关键字直接将 HTML 元素附加到组件上，而现在这些元素必须附加到 `shadowRoot` 属性上。


    我们还需要调整之前附加到组件上的任何元素的引用。例如，我们需要对 `updateMessage()` 方法进行如下修改：


    ```

    updateMessage() {

    this.shadowRoot.querySelector("span").innerText = this._message;

    }

    ```


    这些小小的改动为我们的 Cookie 提醒组件启用了封装。如果你运行项目，生成的页面会如预期显示，如下面的截图所示：


    ![](img/Figure_6.5.jpg)


    **图 6.5**


    现在，Cookie 提醒组件的内部结构受到了保护，免受外部干扰。如果你使用浏览器的检查器查看生成的标记，会发现类似下面的内容：


    ![](img/Figure_6.6.jpg)


    **图 6.6**


    你会看到仍然存在对应组件 UI 的标记，但它被封装在了一个 `#shadow-root` 指令中。该指令标记了包含的标记不可直接访问。


    # 开放与封闭的影子 DOM


    我们说过，使用影子 DOM 后，Web 组件的内部结构无法直接访问。这意味着 Web 组件的内部结构受到保护，免受由 CSS 规则或操作通用 HTML 元素的
    JavaScript 代码可能造成的外部干扰。


    '
- fmt: '

    However, the internal structure of a web component is still accessible through
    the `shadowRoot` property of the shadow host element. For example, you can disable
    the buttons of the cookie alert component in an HTML page with the following code:


    ```

    const cookieAlert = document.querySelector("cookie-alert");

    const componentDOM = cookieAlert.shadowRoo

    let buttons = componentDOM.querySelectorAll("button");

    buttons.forEach((btn)=>{

    btn.disabled = true;

    });

    ```


    You accessed the `shadowRoot` property of the component and used it as the usual
    DOM. Of course, you are intentionally accessing the internal structure of the
    component. So, you are protected only from accidental interferences, while any
    developer can change the structure of your component.


    This depends on the type of shadow DOM you choose to attach to your component.
    Take a look at the statement that attaches the shadow DOM to the cookie alert
    component:


    `this.attachShadow({mode: "open"});`


    We are passing an object to the `attachShadow()` method that specifies an option.
    This object is telling us that the shadow DOM mode should be open. An open shadow
    DOM is accessible outside the component itself through the `shadowRoot` property.
    So, the behavior we noticed above is by design.


    If you don’t want to expose the shadow DOM of your component to the external world,
    you need a closed shadow DOM. You can attach a closed shadow DOM to your component
    by specifying the closed value as the shadow DOM mode.


    The following code shows how you can change the cookie alert constructor to enable
    the closed shadow DOM:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this._shadowRoot = this.attachShadow({mode: "closed"});

    this._onAcceptedListener = null;

    }

    ```


    When creating an open shadow DOM, we used the `attachShadow()` method and then
    used the `shadowRoot` property to append and manipulate the internal DOM. We didn’t
    assign the result of the `attachShadow()` method to any variable. The effect of
    the `attachShadow()` method was the addition of the root node to the `shadowRoot`
    property of the shadow host.


    When you attach a closed shadow DOM by passing `{mode: “close”}` to the `attachShadow()`
    method, the `shadowRoot` property still returns `null`. This prevents the DOM
    from being accessible from the outside. In this case, to access the shadow DOM
    from within the component, you have to assign the result of the `attachShadow()`
    method to a variable. In the example above, we assigned the closed shadow DOM
    to the internal property `_shadowRoot`.


    Be aware that using the `this._shadowRoot` property as in the example, the shadow
    DOM of your component is not completely inaccessible. A user who iterates through
    your component’s properties would figure out what the `_shadowRoot` property stands
    for and use it to access its internal structure still. To try locking the shadow
    DOM of your component, you should assign it to a local variable, a `WeakMap`,
    or a private property (when private properties will become standard and largely
    supported).


    **Keep in mind that the closed shadow DOM is not a security measure. The user
    can anyway affect the shadow DOM of your component, even just by using the** `attachShadow()`
    **method of your shadow host element.**


    So, we assigned the closed shadow DOM of the cookie alert component to the References
    to the `_shadowRoot` property. From now on, any manipulation of the internal DOM
    will be done through this property. The following is the revised code of the `createComponent()`
    method:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this._shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this._shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    Also, the `updateMessage()` method needs to be changed to refer to the `this._shadowRoot`
    property:


    ```

    updateMessage() {

    this._shadowRoot.querySelector("span").innerText = this._message;

    }

    ```


    Now, when you run the project, the cookie alert component will continue to work
    as before. But if you take a look at the generated markup with the inspector of
    your browser, you will find something similar to the following:


    ![](images/Figure_6.7.jpg)


    **Figure 6.7**


    The markup of the shadow DOM is no longer available.


    So, at this point, you may wonder which type of shadow DOM you should use for
    your web components - open or closed?


    Of course, it’s a design choice. You may choose to block the access to the internal
    structure of your component and allows the user to interact with it exclusively
    through the public properties and methods. However, this means that you should
    accurately design the public interface of your component to ensure any possible
    use of it. Consider that the user of your component could not only add it in their
    pages, but they could also extend your component. In this case, accessing the
    shadow DOM could be useful to adapt its look and behavior to the user’s needs.


    # Conclusion


    In this chapter, you discovered that the cookie alert built so far was not ready
    to be a true component. It lacks encapsulation. You learned that it is due to
    the global nature of the DOM and experienced a few situations where this affects
    your component with unwanted interferences. The traditional approach used to overcome
    this problem is based on iframes, but it is complicated and doesn’t resolve the
    problem. We explained that the solution to the lack of encapsulation is the shadow
    DOM. We used this feature in the cookie alert component and showed how it is very
    easy to apply. Finally, we discussed the difference between the open and closed
    shadow DOM.


    Now, at the end of this chapter, you got the technologies to create real components
    whose internal structure is not affected by external interferences.


    In the next chapter, you will learn how to simplify the definition of your web
    component UI by leveraging the HTML templates. Also, you will learn how to make
    your component more flexible, allowing the user to add other HTML elements inside
    your component.


