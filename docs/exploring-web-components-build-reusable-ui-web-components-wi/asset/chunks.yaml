    # [The lifecycle of a Web Component](#toc.xhtml_s37a)


    While building our components, we defined the `connectedCallback()` method and
    said that this method is automatically called when our component is added to the
    DOM. This method belongs to a set of callbacks, also called **Custom element Reactions,**
    which are automatically called at certain stages of the life cycle of a component.


    The following picture shows the possible stages that occur or may occur during
    the life of a custom element:


    ![](images/Figure_3.3.jpg)


    **Figure 3.3**


    Whenever the component is in one of these stages, the browser looks for a specific
    method in your Web Component and invokes it, if defined. These reactions allow
    you to appropriately define the behavior of your custom element.


    Let’s take a look at the methods you can implement to capture each stage of the
    custom element life cycle.


    # [The constructor](#toc.xhtml_s38a)


    The constructor of the component is not properly a custom element reaction. It
    is the standard method that is defined to initialize any JavaScript object instance,
    not just HTML elements. As said before, having a constructor is mandatory for
    an autonomous custom element, and you would expect that it is called once in the
    life of the custom element. That’s actually true, but from a technical point of
    view, it may happen in two situations: when the custom element is created and
    when it is upgraded. Let’s explain both of the cases.


    A custom element is created when it is completely defined, and then an instance
    of it is implicitly or explicitly built.


    We say that a custom element is completely defined when you have defined the class
    implementing it, and you have associated a tag with it by using the `customElements.define()`
    method.


    Once your custom element is completely defined, it can be implicitly created when
    the HTML parser finds the tag associated with your custom element in the page’s
    markup. For example, your cookie alert component is implicitly created when the
    HTML parser finds the `<cookie-alert></cookie-alert>` markup in the HTML page.


    On the other side, the explicit creation happens when the component instance is
    created via JavaScript code, for example, by using the new operator, as in the
    following example:


    `const cookieAlert = new CookieAlert();`


    The explicit creation also happens when you create an instance of the custom element
    by using the `document.createElement()` method, shown as follows:


    `const cookieAlert = document.createElement(“cookie-alert”);`


    A custom element is upgraded when its registration through `customElements.define()`
    doesn’t take place just after its class definition. In other words, the order
    of the steps seen before for the creation case is not strictly observed.


    Let’s explain with an example. Suppose you have defined the `CookieAlert` class
    for your cookie alert custom element, but you haven’t registered it with `customElements.define().`


    Now, you could create an instance of your cookie alert as in the following example:


    `const cookieAlert = document.createElement(“cookie-alert”);`


    Since you haven’t yet registered the `cookie-alert tag`, an unknown HTML element
    will be created, that is an instance of the `HTMLUnknownElement` built-in class.


    Then, you register the `cookie-alert tag` with the following statement:


    `customElements.define("cookie-alert", CookieAlert);`


    At this point, you are connecting an existing cookie-alert element to your custom
    element implemented by the `CookieAlert` class. The element has already been created,
    so your constructor will not be invoked at this time. It will be invoked when
    your component will be appended to the DOM. In this case, we will say that your
    custom element has been upgraded.


    Upgrading a `custom element` is a pretty special situation, but it may happen,
    and you should be aware of what is going on in order to avoid undesired behaviors.


    Actually, you can combine in different ways the steps that let you have an instance
    of your `custom element`. The following table summarizes these possible combinations:


    | **Step 1** | **Step 2** | **Step 3** | **Step 4** | **State** |


    | Class definition | Custom element registration | Instance creation | DOM attachment
    | created |


    | Class definition | Instance creation | Custom element registration | DOM attachment
    | upgraded |


    | Class definition | Instance creation | DOM attachment | Custom element registration
    | upgraded |


    | Instance creation | Class definition | DOM attachment | Custom element registration
    | upgraded |


    | Instance creation | DOM attachment | Class definition | Custom element registration
    | upgraded |


    **Table 3.1**


    As you can see, only a class definition followed by the tag registration guarantees
    that your custom element is created. In all other cases, your custom element will
    be upgraded.


    Once established, when the constructor of your custom element will be called,
    let’s consider what you can do in this step of the life of your component. You
    can use this stage for initializing the custom element’s state, but the first
    statement of this method has to be a call to the `super()` method. Keep in mind
    that, in this stage, you cannot access the DOM, since the component is just created,
    but not appended to the model. This means that the document object is not available
    yet, and any attempt to add or manipulate DOM elements throws an error. For example,
    assume your component has the following code in its constructor:


    `constructor() {`


    `super();`


    `this.appendChild(document.createElement("div"));`


    `}`


    When this code runs, you will get an error like the following, if you are using
    Chrome:


    ![](images/Figure_3.4.jpg)


    **Figure 3.4**


    Or like this one, if you are using Firefox:


    ![](images/Figure_3.5.jpg)


    **Figure 3.5**


    In other words, the constructor of your custom element is not the right place
    to make rendering operations.


    # [The connectedCallback() reaction](#toc.xhtml_s39a)


    The `connectedCallback()` method is invoked every time a component instance is
    added to the DOM. From this moment, you are sure that the DOM is available, and
    then you can manipulate elements, set attributes, initialize the graphical appearance
    of the component, and so on.


    **Be aware that, although usually the** `connectedCallback()` **method is called
    only once in the component’s lifecycle, it may be called multiple times.**


    One of the situations where the connectedCallback() method may be called multiple
    times is when the component is moved in the DOM. Consider, for example, the following
    code:


    `const cookieAlert = new CookieAlert();`'
