  trans: '


    在本章中，我们将分析迄今为止用于实现 Web 组件 UI 的技术，并探索一种基于原生 HTML 模板的新替代方法。我们将讨论这种方法带来的好处，并展示如何将其应用于
    cookie 警告组件。


    此外，我们还将进一步探索一种方法，使 Web 组件能够将其 UI 的标记与用户提供的任意标记相结合。这种基于 `<slot>` 元素的方法扩展了原生 HTML
    模板的能力。这样，我们就可以拥有更丰富、更灵活、更强大的组件，其行为与标准 HTML 元素（如 `<div>`、`<p>`、`<select>` 或其他允许在标签内插入标记的元素）非常相似。


    像往常一样，我们将把这些新概念应用到我们的 cookie 警告组件中，以展示如何在实际中使用它们。


    # 结构


    *   介绍模板

    *   使用插槽组合标记


    # 目标


    在本章中，你将学习原生 HTML 模板，并发现如何使用它们为你的 Web 组件定义声明式且高效的 UI。此外，你还将学习如何让你的 Web 组件将其 UI
    标记与用户提供的自定义标记相结合。


    # 介绍模板


    在*第 3 章，创建自定义 Web 组件*中，我们开始通过表示所需标记的字符串来构建 cookie 警告组件的用户界面。这里我们回顾一下当时定义的两个常量：


    ```javascript

    const styleMarkup = ''

    <style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    </style>'';


    const componentMarkup = ''

    <div class="container footer">

    <span>This website uses cookies to ensure you get the best experience</span>

    </div>'';

    ```


    这些常量被拼接并赋值给组件的 `innerHTML` 属性。这种方法简单明了，因为它以声明方式通过标记提供了 UI 结构。然而，当 UI 变得更加复杂时，管理起来就不那么容易了。因此，我们转向了基于
    DOM 的方法，其中 UI 的每个元素都通过 DOM API 动态创建。实际上，我们对 `styleRules` 常量保留了基于字符串的方法，并引入了 `createComponent()`
    方法来构建 UI 的 HTML 元素，如下代码所示：


    ```javascript

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.shadowRoot.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    const acceptButton = document.createElement("button");

    acceptButton.classList.add("button");

    acceptButton.innerText = "Accept";

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    div.appendChild(acceptButton);

    this.shadowRoot.appendChild(div);

    this.updateMessage();

    }

    ```


    这种新方法提供了一种更灵活的方式来创建组件的 UI，特别是当你要创建的 HTML 元素依赖于外部参数时。然而，通过这种编程方式，我们失去了基于字符串方法的清晰性。通过
    DOM API 构建 UI 功能强大，但在许多情况下可能并不方便。此外，编写和维护也不那么容易。


    # 什么是模板？


    定义 Web 组件 UI 的另一种方法是使用模板。


    在 Web 编程的上下文中，创建 HTML 模板是一项非常常见的任务。它既发生在服务器端，也发生在客户端。如你所知，HTML 模板是一种准备好的 HTML
    标记，允许你在特定点插入自定义片段。在某种程度上，我们在使用包含 UI 标记的常量字符串时就是在定义模板，但我们将了解到基于字符串的方法存在一些缺陷。


    HTML 标准为你提供了 `<template>` 元素。这个元素允许你声明一个模板，即 HTML 元素的结构。你可以通过简单地将标记添加到 `<template>`
    元素中，并根据需要将其附加到 HTML 页面的 `<head>` 或 `<body>` 中来实现。请看以下示例：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <template id="myTemplate">

    <div>

    <img src="images/logo.png">

    <p>This is a sample text</p>

    </div>

    </template>

    </head>

    <body>

    …

    </body>

    </html>

    ```


    在这个示例中，我们在 HTML 页面的 `<head>` 部分定义了一个模板。该模板定义了一个包含图片和段落的 `<div>` 元素。


    注意，我们为模板分配了一个标识符。这个 id 允许我们在运行时使用模板时识别它。该模板将用于生成 DOM 结构的实例，以便附加到 DOM 中，我们稍后会看到。


    你可以在模板元素中声明任何有效的标记，包括 `<style>` 和 `<script>` 元素。你甚至可以包含 `<template>` 元素本身。


    你还可以定义包含部分或不完整元素的模板。例如，以下是一个有效的模板：


    ```html

    <template id="myTemplate">

    <li>

    <span>This is just one item</span>

    </li>

    </template>

    ```


    它不是一个完整的元素，因为它没有声明 `<ul>` 或 `<ol>` 包装元素。但你不能插入无效的 HTML，例如：


    ```html

    <template id="myTemplate">

    <span>

    <li>

    This is just one item</span>

    </li>

    </template>

    ```


    像任何其他 HTML 元素一样，你也可以通过 JavaScript 创建模板元素，如下例所示：


    ```javascript

    const template = document.createElement("template");

    template.innerHTML = ''

    <div>

    <img src="images/logo.png">

    <p>This is a sample text</p>

    </div>

    '';

    ```


    这些语句的效果与使用 `<template>` 标签静态声明模板相同。


    现在，你大致了解了如何定义模板。但是，当你通过标记或 DOM API 声明模板时，会发生什么呢？


    当你声明一个模板时，其标记会被解析，并创建相应的 HTML 元素。然而，整个生成的内容是惰性的且不可见的。


    这意味着实际上从模板标记生成的 DOM 是隐藏的，并且不会渲染。它不是当前文档的一部分，因此你不能通过 DOM API（如 `getElementById()`
    或 `querySelector()`）访问其元素。此外，任何媒体引用（图片、视频、音频等）都不会被加载。这意味着，例如，上面模板中的图片在声明时不会被加载。脚本也不会被执行。


    换句话说，模板的内容已准备好但未执行。所有这些只有在模板被使用时才会变为活动状态。


    # 激活模板


    要激活模板的内容，你必须克隆其内容并将其附加到 DOM 中。以下是激活上面定义的 `myTemplate` 模板的示例：


    ```javascript

    const myTemplate = document.getElementById("myTemplate").conten

    document.body.appendChild(myTemplate.cloneNode(true));

    ```


    '
- fmt: '

    We get the content of the template through the `content` property, clone it via
    the `cloneNode()` method, and append the result to the body of the current document.
    Note that the `true` value passed to the `cloneNode()` method indicates to perform
    a deep cloning operation, that is, a clone of a node, its attributes, and its
    descendants.


    You can get the same result by using the `importNode()` method, as in the following
    example:


    ```

    const myTemplate = document.getElementById("myTemplate").conten

    document.body.appendChild(document.importNode(myTemplate, true));

    ```


    You may wonder why you should clone the template''s content, why you can''t directly
    attach the template''s content to the document''s DOM. There are at least two
    reasons for this.


    1. This is the behavior by the design of the template element. The template''s
    node structure is not a live structure of the DOM. It''s just a set of frozen
    nodes to be used only as a reference to create other nodes. After all, this is
    the meaning of a template.


    2. The second reason: It relies on a practical consideration based on the fact
    that a template can (and should) be shared with multiple components or multiple
    instances of the same component. Imagine you can directly use the template''s
    structure. You take the template, customize it for your needs (for example, change
    some text or add another element), and append it to the DOM. If another component
    uses the same template, it will be affected by the changes you applied to the
    template. In most cases, this is not the desired effect.


    A final note is about nested templates. We said that a template might contain
    another template. The following is an example of such a template:


    ```

    <template id="myTemplate">

    <ul>

    <template id="nestedTemplate">

    <li>

    <span>This is just one item</span>

    </li>

    </template>

    </ul>

    </template>

    ```


    When you clone the outer template, the `myTemplate` template, you don''t automatically
    activate the inner template, the `nestedTemplate` template. You have to activate
    the inner template by manually cloning it.


    # [Why using a template?](#toc.xhtml_s93a)


    Now you should have an idea about what is a native template and how to use it.
    However, you may still be wondering why you should use it. Which advantages does
    it provide compared to the string-based or the DOM-based approaches?


    Let''s compare these three approaches and try to understand the benefits and the
    drawbacks each one provides.


    When you use a string to describe the markup of your UI, each time your component
    is created, you will go through the following steps:


    1. The text is parsed, and the validity of the HTML markup is checked

    2. The DOM elements are created

    3. The DOM elements are appended to the DOM


    When you use the DOM-based approach, the steps executed when your component is
    created are as follows:


    1. The DOM elements are created

    2. The DOM elements are appended to the DOM


    In fact, in this case, you don''t have a parsing step since you are directly creating
    the HTML elements you need.


    By using a template, you have just one step:


    1. The DOM elements are appended to the DOM


    The parsing and DOM element creation steps have to be done when you declared your
    template. It happens only once for any instance of your component.


    So, by using a template, you add efficiency to the declarative approach of the
    string-based approach.


    # [Template at work](#toc.xhtml_s94a)


    After introducing templates, let''s put them at work in our cookie alert component.
    We will replace the current approach in building the UI – the DOM-based approach
    – with the template-based approach. So, let''s modify the `index.js` file that
    defines our component.


    The first thing we do is replacing the `styleRules` constant declaration with
    the following:


    ```

    const template = document.createElement(''template'');

    template.innerHTML = `

    <style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    .button {

    color: rgb(255, 255, 255);

    background-color: transparen

    border-color: rgb(255, 255, 255);

    padding: 5px 40px;

    margin-right: 50px;

    cursor: pointer;

    float:righ

    }

    </style>

    <div class="container footer">

    <span id="message"></span>

    <button id="closeButton" class="button">Close</button>

    <button id= "acceptButton" class="button">Accept</button>

    </div>

    `;

    ```


    We are creating the template via JavaScript and assigning the basic UI markup
    to its `innerHTML` property. Note that the template includes both the style definition
    and the HTML markup.


    Remember that template definition code is outside the component class definition,
    so it is executed just once, not at each instance creation of your component.


    Then, we change the constructor as follows:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this.attachShadow({mode: "open"});

    this.shadowRoot.appendChild(template.content.cloneNode(true));

    this._onAcceptedListener = null;

    }

    ```


    Here we added the template activation statement just after attaching the shadow
    DOM. Note that we are not adding the cloned template''s content to the DOM, but
    the shadow DOM of the current component. You may wonder why we are doing this
    in the constructor. Since the template structure is static, that is to say, and
    it does not depend on external parameters, we can use it at the component''s instantiation
    time so that it will be ready when we need to customize it.


    In *[Chapter 3, Creating Custom Web Components](#c03.xhtml)*, we said that you
    could not access the DOM in the constructor of your component. However, you see
    that here we are adding nodes through the `appendChild()` method. Consider that
    here you are manipulating the shadow DOM, that is, the private DOM of the component
    you just attached. Once the shadow DOM has been attached to your component, you
    can access it. Still, you cannot access the global DOM from the constructor since,
    at this stage, your component has been created, but it has not been added to the
    global DOM.


    Since we are using the native template, we no longer need the `createComponent()`
    method. It was the method that created the UI with a DOM-based approach. Now,
    the UI is built by adding the template content to the DOM in the constructor.
    What we need at this point is just to initialize the UI by adding event listeners
    or by customizing the look and feel based on the user''s parameters.


    So, let''s replace the `createComponent()` method with this method:


    ```

    initComponent() {

    const closeButton = this.shadowRoot.getElementById("closeButton");

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    const acceptButton = this.shadowRoot.getElementById("acceptButton");

    acceptButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    });

    this.updateMessage();

    }

    ```


    The `initComponent()` method assigns the event listeners to the close and accept
    buttons and calls the `updateMessage()` to reflect the values passed through the
    message property or attribute.


    At this point, the `connectedCallback()` method becomes as follows:


    ```

    connectedCallback() {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    this.style.visibility = "hidden";

    } else {

    this.initComponent();

    }

