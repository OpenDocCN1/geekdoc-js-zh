    \n为了了解如何管理 onevent 属性，让我们看看如何为我们的 cookie 提示 Web 组件添加对 `onaccepted` 属性的支持。请记住，添加这类属性与添加任何典型属性并无不同。此外，最佳实践是在为组件添加属性时也添加一个类似的属性。这模仿了标准\
    \ HTML 元素的常见行为，并让用户找到他们习惯的东西。\n\n**请记住，根据规范，onevent 属性和属性只允许你为特定事件分配一个事件处理程序。如果你需要为一个事件附加多个处理程序，应该使用\
    \ `addEventListener()` 方法。**\n\n因此，作为第一步，让我们添加一个内部属性来保存当前的处理程序：\n\n```\nconstructor()\
    \ {\n    super();\n    this._message = \"This website uses cookies to ensure you\
