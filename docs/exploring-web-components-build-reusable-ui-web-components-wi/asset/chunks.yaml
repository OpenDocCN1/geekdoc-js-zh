    In the management of the `closebutton` attribute''s value, we stated that an empty
    string value has the same meaning of the true value. This allows us to use the
    attribute as a toggle attribute, as it happens with many native attributes like,
    for example, enabled or checked. So, you can get the same result of assigning
    the true value to the `closebutton` attribute in the following way:


    `<my-cookie-alert closebutton></my-cookie-alert>`


    To complete the overview of this component, remember that the following markup
    has the same meaning of using no `closebutton` attribute:


    `<my-cookie-alert closebutton="false"></my-cookie-alert>`


