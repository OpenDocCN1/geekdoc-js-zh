    \n下图展示了自定义元素生命周期中可能发生或可能出现的阶段：\n\n![](img/Figure_3.3.jpg)\n\n**图 3.3**\n\n每当组件处于这些阶段之一时，浏览器会在你的\
    \ Web 组件中查找特定方法，如果定义了该方法，则调用它。这些反应允许你适当地定义自定义元素的行为。\n\n让我们看看你可以实现哪些方法来捕获自定义元素生命周期的每个阶段。\n\
    \n# 构造函数\n\n组件的构造函数严格来说并不是自定义元素反应。它是用于初始化任何 JavaScript 对象实例（不仅仅是 HTML 元素）的标准方法。如前所述，对于自主自定义元素，构造函数是必需的，并且你期望它在自定义元素的生命周期中只被调用一次。这确实是事实，但从技术角度来看，它可能在两种情况下发生：当自定义元素被创建时，以及当它被升级时。让我们解释这两种情况。\n\
    \n当自定义元素被完全定义后，隐式或显式地构建其实例时，该自定义元素即被创建。\n\n我们说一个自定义元素被完全定义，是指你已经定义了实现它的类，并且通过\
    \ `customElements.define()` 方法为其关联了一个标签。\n\n一旦你的自定义元素被完全定义，当 HTML 解析器在页面标记中找到与该自定义元素关联的标签时，它就会被隐式创建。例如，当\
    \ HTML 解析器在 HTML 页面中找到 `<cookie-alert></cookie-alert>` 标记时，你的 cookie 警告组件就会被隐式创建。\n\
    \n另一方面，显式创建发生在通过 JavaScript 代码创建组件实例时，例如使用 `new` 运算符，如下例所示：\n\n```javascript\n\
    const cookieAlert = new CookieAlert();\n```\n\n显式创建也发生在使用 `document.createElement()`\
    \ 方法创建自定义元素实例时，如下所示：\n\n```javascript\nconst cookieAlert = document.createElement(\"\
    cookie-alert\");\n```\n\n当通过 `customElements.define()` 注册自定义元素的操作没有紧跟在类定义之后时，该自定义元素会被升级。换句话说，之前创建情况中步骤的顺序没有被严格遵守。\n\
    \n让我们通过一个例子来解释。假设你已经为你的 cookie 警告自定义元素定义了 `CookieAlert` 类，但尚未使用 `customElements.define()`\
    \ 注册它。\n\n现在，你可以像下面这样创建 cookie 警告的实例：\n\n```javascript\nconst cookieAlert = document.createElement(\"\
    cookie-alert\");\n```\n\n由于你尚未注册 `cookie-alert` 标签，因此将创建一个未知的 HTML 元素，即内置类 `HTMLUnknownElement`\
    \ 的实例。\n\n然后，你使用以下语句注册 `cookie-alert` 标签：\n\n```javascript\ncustomElements.define(\"\
    cookie-alert\", CookieAlert);\n```\n\n此时，你将一个现有的 `cookie-alert` 元素连接到由 `CookieAlert`\
    \ 类实现的自定义元素。该元素已经创建，因此此时不会调用你的构造函数。它将在你的组件被追加到 DOM 时被调用。在这种情况下，我们说你的自定义元素已被升级。\n\
    \n升级自定义元素是一种相当特殊的情况，但它可能发生，你应该了解发生了什么，以避免出现意外行为。\n\n实际上，你可以通过不同的方式组合这些步骤来获得自定义元素的实例。下表总结了这些可能的组合：\n\
    \n| **步骤 1** | **步骤 2** | **步骤 3** | **步骤 4** | **状态** |\n|---|---|---|---|---|\n\
    | 类定义 | 自定义元素注册 | 实例创建 | 附加到 DOM | 已创建 |\n| 类定义 | 实例创建 | 自定义元素注册 | 附加到 DOM | 已升级\
    \ |\n| 类定义 | 实例创建 | 附加到 DOM | 自定义元素注册 | 已升级 |\n| 实例创建 | 类定义 | 附加到 DOM | 自定义元素注册\
    \ | 已升级 |\n| 实例创建 | 附加到 DOM | 类定义 | 自定义元素注册 | 已升级 |\n\n**表 3.1**\n\n如你所见，只有类定义后紧跟标签注册才能保证你的自定义元素被创建。在所有其他情况下，你的自定义元素将被升级。\n\
    \n一旦确定了自定义元素的构造函数何时被调用，让我们考虑一下在组件生命周期的这个阶段你可以做什么。你可以使用这个阶段来初始化自定义元素的状态，但该方法的第一个语句必须是对\
    \ `super()` 的调用。请记住，在这个阶段，你无法访问 DOM，因为组件刚刚创建，但尚未附加到模型中。这意味着文档对象尚不可用，任何添加或操作 DOM\
    \ 元素的尝试都会抛出错误。例如，假设你的组件在其构造函数中有以下代码：\n\n```javascript\nconstructor() {\n  super();\n\
    \  this.appendChild(document.createElement(\"div\"));\n}\n```\n\n当这段代码运行时，如果你使用的是\
    \ Chrome，你会得到类似下面的错误：\n\n![](img/Figure_3.4.jpg)\n\n**图 3.4**\n\n或者如果你使用的是 Firefox，会得到类似下面的错误：\n\
    \n![](img/Figure_3.5.jpg)\n\n**图 3.5**\n\n换句话说，自定义元素的构造函数不是进行渲染操作的正确位置。\n\n# connectedCallback()\
    \ 反应\n\n每当组件实例被添加到 DOM 时，`connectedCallback()` 方法就会被调用。从这一刻起，你可以确定 DOM 是可用的，因此你可以操作元素、设置属性、初始化组件的图形外观等。\n\
    \n**请注意，虽然通常 `connectedCallback()` 方法在组件的生命周期中只被调用一次，但它可能会被多次调用。**\n\n`connectedCallback()`\
    \ 方法可能被多次调用的一种情况是组件在 DOM 中被移动时。例如，考虑以下代码：\n\n```javascript\nconst cookieAlert\
    \ = new CookieAlert();\n```\n\n"
