    # Web 组件与 Vue


    接下来，我们看看如何在 Vue 应用中使用 Web 组件，这里仍然使用 cookie 提醒组件，就像我们在 React 和 Angular 中展示的那样。


    同样，我们将使用一个工具来快速搭建 Vue 应用——Vue CLI。请确保已安装它，否则请通过以下命令安装：


    `npm install -g @vue/cli`


    要创建一个基础应用，在终端窗口中运行以下命令：


    `vue create vue-app-cookie-alert --default`


    命令执行后，你会找到 `vue-app-cookie-alert` 文件夹，其中包含 Vue 应用的代码。然后，像往常一样，通过输入以下命令安装 cookie
    提醒包：


    `npm install andychiare/cookie-alert-demo`


    与 Angular 的情况类似，Vue 会尝试将非标准元素视为 Vue 组件。当然，这会导致错误，因为编译器找不到实现 `<cookie-alert>` 标签的
    Vue 组件。因此，你需要告诉 Vue 忽略 `<cookie-alert>` 元素。为此，打开 `src/main.js` 文件，并按以下代码片段更新其内容：


    ```

    import Vue from ''vue''

    import App from ''./App.vue''

    Vue.config.productionTip = false

    Vue.config.ignoredElements=[

    ''cookie-alert''

    ]

    new Vue({

    render: h => h(App),

    }).$mount(''#app'')

    ```


    你将 `cookie-alert` 标签名称添加到了 Vue 配置的忽略元素列表中。


    现在，打开 `src/App.vue` 组件，并按以下代码修改模板和脚本部分的内容：


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    }

    }

    </script>

    <style>

    #app {

    font-family: Avenir, Helvetica, Arial, sans-serif;

    -webkit-font-smoothing: antialiased;

    -moz-osx-font-smoothing: grayscale;

    text-align: center;

    color: #2c3e50;

    margin-top: 60px;

    }

    </style>

    ```


    在脚本部分，你导入了 `cookie-alert-demo` 模块。在模板部分，你直接使用了 `<cookie-alert>` 标签。


    要查看这些更改的效果，运行 `npm run serve` 命令，并在浏览器中访问 `http://localhost:8080` 地址。你将看到类似下图的页面：


    ![](img/Figure_9.3.jpg)


    **图 9.3**


    自定义 cookie 提醒组件与 Angular 中的操作一样简单。要分配不同的文本消息，你可以为组件的 `message` 属性设置所需的值，如下代码片段所示：


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert message= "We use cookies, but respect your privacy!"></cookie-alert>

    </div>

    </template>

    //…

    ```


    如果你想为 cookie 提醒组件的 `message` 属性赋值，可以像下面这个示例那样操作：


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert :message= "cookieMessage"></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    },

    data: function() {

    return {

    cookieMessage: ''We use cookies, but respect your privacy!''

    }

    }

    }

    </script>

    //…

    ```


    在这个示例中，你为 App 组件创建了一个 `cookieMessage` 属性，并使用典型的 Vue 绑定语法将其赋值给 message 属性。


    类似地，要处理 cookie 提醒组件的 accepted 事件，请向 App 组件添加一个 `showThanks()` 方法，并使用 @ 前缀将其赋值给
    `accepted` 事件。以下代码展示了具体实现：


    ```

    <template>

    <div id="app">

    <img alt="Vue logo" src="./assets/logo.png">

    <HelloWorld msg="Welcome to Your Vue.js App"/>

    <cookie-alert :message= "cookieMessage" @accepted="showThanks"></cookie-alert>

    </div>

    </template>

    <script>

    import HelloWorld from ''./components/HelloWorld.vue''

    import ''cookie-alert-demo''

    export default {

    name: ''App'',

    components: {

    HelloWorld

    },

    data: function() {

    return {

    cookieMessage: ''We use cookies, but respect your privacy!''

    }

    },

    methods: {

    showThanks: function() {

    alert("Thanks for accepting our cookie policy!");

    }

    }

    }

    </script>

    //…

    ```


    如你所见，在 Vue 中使用 Web 组件也非常直接。


    # 使用 UI 框架构建 Web 组件


    上一节指导你在使用三种流行 UI 框架（*React、Angular 和 Vue*）构建的应用中使用了 Web 组件。我们看到了将 Web 组件与这些框架集成通常相当容易。但我们也注意到，根据具体框架的不同，你需要留意一些注意事项来解决某些问题。


    你可以通过应用通用策略更系统地处理这些问题。例如，你可以用 *React、Angular* 或 *Vue* 组件包装你的 Web 组件。这样，你将集成问题封装在框架组件定义中，从而提供更好的集成体验。但这并没有改变将
    Web 组件与其他 UI 框架集成的总体方法。


    某些 UI 框架提供了一种使用其语法和语义来创建 Web 组件的方法，而不是直接使用 JavaScript 和 DOM。你可能会问为什么。以下是两个可能的原因：


    *   **利用 UI 框架特性：** 如果你决定使用 UI 框架（比如 Angular）创建 Web 组件，你可以利用你的 Angular 知识以及框架提供的特性。这可能会简化开发，并在一定程度上避免你了解实现
    Web 组件的细节。


    *   **分发基于框架的组件：** 假设你有一个 Vue 组件，并希望将其提供给其他非 Vue 应用使用。你可以通过 Vue 创建你的 Web 组件并进行分发。这相当于将你的
    Vue 组件包装在 Web 组件中。


    以上可能是使用最流行的 UI 框架之一来创建 Web 组件的两个原因。然而，你至少应该注意以下注意事项：


    *   **增加复杂性：** 在 Web 组件技术之上应用一层抽象会增加复杂性。你可能会因为不同的管理方式而遇到问题。而且，由于这一额外层，你可能会遇到性能问题。


    *   **增加依赖：** 你用来实现 Web 组件的 UI 框架会成为依赖项，即使它可能只包含框架本身的一个子集。想象一下，如果一个应用有多个使用不同库构建的
    Web 组件，会发生什么。


    因此，即使可以创建 Web 组件或包装现有的基于框架的组件，也要问问自己，这对你的目标来说是否是一个好的选择。


