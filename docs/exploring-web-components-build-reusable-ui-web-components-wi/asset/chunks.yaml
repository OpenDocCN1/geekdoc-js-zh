    *   它们应可复用


    如果你观察上图中带边框的项目，它们标识了具有特定职责的页面区域：


    *   顶部栏允许用户管理其账户

    *   顶部栏下方的项目允许用户对网站执行全局操作，例如搜索词语或导航到不同区域

    *   导航区域下方的区域旨在邀请用户捐赠

    *   包含最新新闻链接的区域

    *   注册区域

    *   特定任务区域


    如果你考虑这些区域，可能会意识到它们是一种自包含的单元。你可以移动页面上的项目，并用新布局重新排列页面。你也可以在另一个页面上复用它们中的每一个，甚至可能在任何其他网站上复用它们。


    这就是组件的强大之处之一：拥有自己的身份，使你可以将它们视为一个单元。


    # 3. 组合组件


    作为具有特定职责的单元的能力并非组件的唯一特征。组件是更复杂实体的构建块，但生成的实体本身也可能是一个组件。如果你稍加思考，可能会意识到整个网页本身就是一个组件——它是网站或
    Web 应用程序的一部分，并在该上下文中具有特定职责。


    因此，更一般地说，我们可以说一个组件可能包含其他组件，或者同样地，它可能由其他组件组成。例如，考虑以下截图中显示的组件：


    ![](img/Fig_1.3.jpg)


    **图 1.3**


    你可以将其视为一个自包含的组件，其职责是收集用户数据并允许他们注册。或者，你也可以将其视为一个基于其他组件聚合而成的组件，如下面的截图所示：


    ![](img/Fig_1.4.jpg)


    **图 1.4**


    上图中每个带边框的项目都有特定的职责——一个显示标题；一个获取用户的名字，等等。因此，每个项目都可以被视为一个组件，它们共同构建了一个新组件。


    由你根据便利性决定如何将组件精确地分解为子组件，并将 UI 构建为组件的组合。在上面的例子中，你可以在另一个表单中复用文本框，因此你有具体的便利性将它们视为组件。


    通常发生的情况是，UI 是多个组件的组合，几乎总是以层次结构组织。这种组件层次结构通常被称为**组件树**。


    # 4. 将组件映射到 HTML


    上一节中进行的 UI 分解相当通用。它适用于任何类型的 UI。但让我们限制在 Web UI 实现上：


    *   你有多希望将每个检测到的组件直接映射到对应的 HTML 元素？

    *   你有多希望用更具描述性的 HTML 标记来定义上一节中显示的主页？


    请看以下标记：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <!-- Style, script and other head stuff -->

    </head>

    <body>

    <account-management-bar></account-management-bar>

    <navigation-bar></navigation-bar>

    <front-cover></front-cover>

    <news-area></news-area>

    <sign-up-form></sign-up-form>

    <mission-tile mission-id=”123”></mission-tile>

    <mission-tile mission-id=”321”></mission-tile>

    </body>

    </html>

    ```


    如你所见，上面的标记实际上是我们之前检测到的组件与一组假设的 HTML 元素之间的直接映射。这将是语义 HTML 的具体实现，即你的所有 HTML 标记应表示内容的意义，而非其外观。


    在最好的情况下，通常看到的标记类似于以下内容：


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <!-- Style, script and other head stuff -->

    </head>

    <body>

    <div class=”account-management-bar”>

    <div id=”…”>…</div>

    </div>

    <div class=”navigation-bar”>…</div>

    <div class=”front-cover”>…</div>

    <div class=”news-area”>

    <ul>…</ul>

    …

    </div>

    <div class=”sign-up-form”><form>…</form></div>

    <div>

    <div class=”mission-tile”>…</div>

    <div class=”mission-tile”></div>

    </div>

    </body>

    </html>

    ```


    在这里，标记并未表达每个元素的意义。你可以从 CSS 类中推断出来，但整个标记过于冗长且不易读。


    另一方面，如果你能使用像我们上面想象的那样简洁清晰的标记，你的 Web UI 将非常易读、可维护且可复用。简而言之，它将非常高效。


    这正是 Web 开发者多年来以多种方式寻求的东西。年复一年，随着`<blockquote>`、`<nav>`、`<video>`等新元素被添加到 HTML
    标准中，我们有了越来越多的可能性以语义化方式表达标记。然而，这种方法进展缓慢，且提供的元素过于通用。它无法有效满足每个开发者的特定需求。


    正如你将在下一节中看到的，你可以仅使用 Web 平台标准技术来构建自己的语义元素。


    # 什么是 Web 组件？


    如上一节所示，分解 Web UI 似乎非常自然且可取。这是一种有效的方法，可以同时创建结构良好的 UI 和可复用的 UI 元素。此外，由于组件是一个通用概念，你可以通过组合其他组件来创建新组件，甚至可以将整个应用程序视为一个组件。


    多年来，开发者一直在寻找一种自主扩展 HTML 功能的方法，以创建高级 UI 元素。他们的努力成果包括*jQuery UI、React、Angular、Vue*等库。所有这些库都提供了遵循组件模型创建
    UI 元素的方法。


    这些库中有许多非常流行，每个库都提出了自己的创建 UI 组件的方法，并且每个库都以某种方式尝试将 UI 元素映射到标记。然而，它们有一些缺点：


    *   它们不是标准

    *   它们不被浏览器原生支持

    *   它们不可互操作


    换句话说，使用这些库创建的 UI 组件只能用于支持相同库的项目。你不能用 React 创建一个组件并在 Angular 应用程序中使用它。如果你想创建一个既能在
    React 应用程序中又能在 Angular 应用程序中使用的 UI 元素，你需要实现该元素的两个版本。


    Web 组件试图通过允许你使用浏览器原生支持的标准技术创建 UI 元素来克服这些缺点。


    Web 组件是一组标准规范，用于创建可在网页和应用程序中复用的自定义 HTML 元素。这项技术原理的首次提及可追溯到*2011 年*，在阿姆斯特丹 Fronteers
    会议上*Alex Russell*的演讲中。他的提议被 W3C 采纳，并于*2012 年*发布了第一份*工作草案*。此后，标准化过程对原始想法进行了多次修改，因此我们随着时间的推移得到了两个不同版本的规范，分别标识为*v0*和*v1*。目前，Web
    组件不再基于单独的规范，而是引用 HTML 和**文档对象模型（DOM）**的标准，它们现在已成为这些标准不可分割的一部分。


    Web 组件基于 Web 技术的三个标准特性：


    *   **自定义元素：** 它们代表一组 JavaScript API，用于创建与特定 HTML 标签关联的自定义 DOM 元素。


    '
- fmt: '

    * **Shadow DOM:** A set of JavaScript APIs that allow managing a specific DOM
    for a component, independent from the web page’s DOM

    * **HTML templates**: It is an integration to the HTML specifications that allows
    you to define portions of markup that are not interpreted when the page is loading,
    but that is instantiated at runtime.


    Thanks to the Web Components technology, you can extend standard HTML elements
    to have customized look and feel and behave. You can also create your HTML tag
    and use it in an HTML page as a standard element. You can do all this independently
    from the JavaScript library or framework you are using to build your application.


    **You could have heard about a fourth technology Web Components rely on: HTML
    Imports.**


    **Although it is an official alive W3C specification, practically it is not supported
    by any browser because it is superseded by ECMAScript modules.**


    **See for example the following document that declares HTML Imports deprecated
    for Chrome: [https://www.chromestatus.com/feature/5144752345317376](https://www.chromestatus.com/feature/5144752345317376)**


    # [Using a Web Component](#toc.xhtml_s9a)


    So far, we talked about components and Web Components abstractly. Now it’s time
    to start seeing in action this technology.


    Let’s begin exploring Web Components from the viewpoint of a developer who wants
    to use a ready-to-use component. You will learn how to build your web component
    throughout the rest of the book.


    To show how to use a web component developed by a third party, we will refer to
    a component that allows you to give a rating through a certain number of stars,
    similar to the UI elements you find in many e-commerce websites.


    Check the documentation of this simple project on *GitHub* to know more about
    the component **- [https://github.com/andychiare/rating-component](https://github.com/andychiare/rating-component)**.


    Let’s start by creating an empty HTML page and with reference to the code of the
    component, as shown by the following markup:


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    </body>

    </html>

    ```


    As you can see, we added a script element pointing to the public URL of `myRatings.js`
    JavaScript file. This file contains the definition of the component, but currently,
    we are not interested in the implementation. We just want to use the component
    on a web page.


    **This is the simplest way to include the library in your project, but you can
    use a package manager if your application requires a building step. We’ll go into
    this later.**


    Now, you can simply use the `my-rating` tag in the body of the HTML as if it were
    a standard element:


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    </head>

    <body>

    <my-rating max-value=”6” value=”3”></my-rating>

    </body>

    </html>

    ```


    The `my-rating` element has the `max-value` and `value` attributes that allow
    you to set, respectively, the maximum number of stars to be displayed and the
    current value of stars expressing your rating.


    As you can see, the `my-rating` tag is used like any standard HTML tag, and what
    is most important is the fact that you do not need to install any UI framework
    to get this behavior.


    To see the graphical result of this markup, you just need to open the HTML page
    in a web browser. You should see a page like the following:


    ![](images/Fig_1.5.jpg)


    **Figure 1.5**


    **In this specific simple case, you can use a web browser to open the HTML page
    from the file system. However, in general, it should be better to serve the pages
    with a web server. You can choose any web server you prefer. We suggest using
    `http-server`, a zero-configuration web server running in Node.js environment.**


    **To install `http-server` on your machine, first ensure you have Node.js already
    installed, then type the following command in a terminal window:**


    `npm install http-server -g`


    **Once the installation terminates, you can start the server by moving in the
    folder containing the HTML stuff and typing the following command in a terminal
    window:**


    `http-server`


    **This command will start the web server, and you will be able to see your page
    by pointing your browser to http://localhost:8080.**


    Now, when you click one of the stars, the star you clicked and the stars on its
    left become filled, while the stars on its right become empty. This expresses
    your rating.


    As you can see, using a web component is as simple as using any standard HTML
    element. You configure the element by setting values in its attributes, and it
    works accordingly.


    You can also use the component programmatically via JavaScript. Consider, for
    example, the following code:


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    <script>

    window.onload = function() {

    const myRating = document.getElementById(“myRatingComponent”)

    myRating.maxValue = 10;

    myRating.value = 2;

    };

    </script>

    </head>

    <body>

    <my-rating id=”myRatingComponent”></my-rating>

    </body>

    </html>

    ```


    In this example, we assigned the identifier `myRatingComponent` to the element
    and used it to get access via JavaScript by using the `getElementById()` method.
    We also assigned new values to the properties `maxValue` and `value` corresponding
    respectively to the `max-value` and `value` attributes. This allows you to have
    a different initial appearance on the web page.


    In addition to setting the initial values for the component properties, you can
    treat it as a common HTML element. For example, you can attach an event handler
    to it, as shown in the following example:


    ```

    <!DOCTYPE html>

    <html lang=”en”>

    <head>

    <meta charset=”utf-8”>

    <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>

    <script>

    window.onload = function() {

    const myRating = document.getElementById(“myRatingComponent”)

    myRating.maxValue = 10;

    myRating.value = 2;

    myRating.addEventListener(“click”, () => {

    alert(“Thanks for your feedback!”);

    });

    };

    </script>

    </head>

    <body>

    <my-rating id=”myRatingComponent”></my-rating>

    </body>

    </html>

    ```


    Here you are handling the click event so that when the user gives their rate,
    a thank-you message appears:


    ![](images/Fig_1.6.jpg)


    **Figure 1.6**


    These simple examples just give you an idea of what Web Components are from the
    viewpoint of a developer that uses them. Starting from the next chapter, you will
    also learn how to build your web component.


    # [Browser support](#toc.xhtml_s10a)


    The technologies which Web Components are built on are standard that is they are
    intended to be natively supported by web browsers. Unfortunately, despite the
    availability of specifications for some time now, only recently, they are going
    to be largely adopted by most web browsers.


    To have an idea of the recent and current state of the support of these technologies
    by the most popular browsers, let’s take a look at some data from caniuse.com
    **([https://caniuse.com/](https://caniuse.com/))**, a website monitoring the web
    technology adoption.


    The first data are related to **Custom Elements** support. At the writing time
    they are summarized by the following picture:


    ![](images/Fig_1.7.jpg)


    **Figure 1.7**


    These data show that **Custom Elements** are supported by **88.93%** of tracked
    browsers, but only **73.69%** of the browser provides full support. The remaining
    **15.24%** provide partial support. If you look at the picture, you realize that
    only the latest versions of browsers support this technology. Also, some still
    popular browsers have no or partial support.


    On the other hand, **HTML Templates** have wider support, as the following picture
    shows:


    ![](images/Fig_1.8.jpg)

