    \ = listener;\n        this.addEventListener(\"accepted\", this._onAcceptedListener);\n\
    \    }\n}\n```\n\ngetter 简单地返回内部 `_onAcceptedListener` 属性的值，而 setter 则稍微复杂一些。它检查内部\
    \ `_onAcceptedListener` 属性是否已经有一个赋值。如果是，则移除之前分配的监听器。这一步避免了为该事件添加另一个监听器。下一步检查传入值的类型是否为函数。这确保了\
