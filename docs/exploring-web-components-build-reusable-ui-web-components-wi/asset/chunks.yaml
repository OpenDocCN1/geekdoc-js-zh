    如你所见，这里我们添加了 `updateMessage()` 方法，它将私有属性 `_message` 的新值赋给 UI，并在 setter 中调用了它。实际上，我们也可以在
    `createComponent()` 方法内部使用 `updateMessage()` 方法来改进代码。因此，经过一些重构后，`CookieAlert`
    类如下所示：


    ```

    const styleRules = ‘


    .container {


    color: rgb(255, 255, 255);


    background-color: rgb(35, 122, 252);


    padding: 1em 1.8em;


    width: 100%;


    font-family: Helvetica,Calibri,Arial,sans-serif;


    }


    .footer {


    position:fixed;


    left:0px;


    bottom:0px;


    }


    ‘;


    class CookieAlert extends HTMLElement {


    constructor() {


    super();


    this._message = "This website uses cookies to ensure you get the best experience";


    }


    connectedCallback() {


    this.createComponent();


    }


    get message() {


    return this._message;


    }


    set message(value) {


    this._message = value;


    this.updateMessage();


    }


    createComponent() {


    const style = document.createElement("style");


    style.appendChild(document.createTextNode(styleRules));


    this.appendChild(style);


    const span = document.createElement("span");


    const div = document.createElement("div");


    div.classList.add("container", "footer");


    div.appendChild(span);


    this.appendChild(div);


    this.updateMessage();


    }


    updateMessage() {


    this.querySelector("span").innerText = this._message;


    }


    }


    customElements.define("cookie-alert", CookieAlert);

    ```


    现在，我们的组件拥有一个 `message` 属性，允许用户通过 JavaScript 设置自定义文本。这意味着我们现在可以将 cookie 提醒组件放入
