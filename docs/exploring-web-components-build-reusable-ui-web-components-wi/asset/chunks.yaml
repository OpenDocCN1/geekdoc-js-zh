    # [Custom elements](#toc.xhtml_s21a)


    When we introduced Web Components in the first chapter, we said that they rely
    on three technologies: Custom Elements, Shadow DOM, and HTML Templates. The Custom
    Elements technology is the first one we are going to explore, and maybe it may
    appear as the most evident when it comes to creating your own Web Component.


    In fact, Custom Elements enable you to define your own HTML elements and to make
    them available in your HTML pages or Web applications. Custom Elements are identified
    in the markup of an HTML page with tags like any standard HTML element. In addition,
    they can be accessed via JavaScript, just like any standard HTML element.


    You can create two types of Custom Elements:


    *   Customized Native Elements


    *   Autonomous Custom Elements


    The Customized Native Elements are Custom Elements built, starting from an existing
    standard element. Basically, they extend the features of a standard HTML element
    like `<img>, <button>, <input>,` and so on.


    The Autonomous Custom Elements are Custom Elements built from scratch. They don''t
    extend standard HTML elements, so their behavior is up to your code.


    In this chapter, we are going to explore Custom Native Elements. This means that
    we start to create Custom Elements by extending existing standard HTML elements.


    # [Extending native elements](#toc.xhtml_s22a)


    As usual, throughout the book, we are going to learn how to create Custom Native
    Elements by building things. So, we are going to introduce the concepts and the
    syntax to create Custom Native Elements by building a new Web Component. The component
    we are going to create is a secure link; that is a link that warns the user when
    the URL it refers to is not secure; that is, it is not using HTTPS. So, basically,
    our component is a standard `<a>` HTML element with the addition of this feature.


    In order to put in practice this goal, create a file named `secureLink.js` and
    put the following code inside it:


    ```

    class SecureLink extends HTMLAnchorElement {

    connectedCallback() {

    this.addEventListener("click", (e) => {

    if (!this.href.startsWith("https")) {

    if (!confirm("You are about to navigate to an unsafe site. Do you want to continue?"))
    {

    e.preventDefault();

    }

    }

    })

    }

    }

    customElements.define("secure-link", SecureLink, {extends: "a"});

    ```


    This simple snippet of code defines the Custom Element we were looking for. Let''s
    analyze the code to understand how it works.


    This first thing you notice is that we are defining a JavaScript class named `SecureLink`
    inheriting from `HTMLAnchorElement`. The `HTMLAnchorElement` is the built-in DOM
    class representing the `<a>` HTML element, so we are inheriting all the features
    that come with it.


    The class defines the `connectedCallback()` method. This method is automatically
    called when an instance of this element is inserted into the DOM. It is part of
    a set of callbacks, also called custom element reactions, which are automatically
    called at certain stages of a component''s lifecycle. We will head back to them
    in the next chapter. For now, we just need to know that the `connectedCallback()`
    method will be called after that our Web Component is added to the DOM of the
    current HTML page.


    The code in the body of the `connectedCallback()` method is quite simple: it adds
    an event handler to the click event. This event handler checks if the URL associated
    with the element doesn''t start with the `https` string. In this case, an alert
    will be shown to the user, and, if confirmed, the navigation stops.


    The last statement you see in the JavaScript file is the following:


    `customElements.define("secure-link", SecureLink, {extends: "a"});`


    This statement has a fundamental role. It adds the `SecureLink` class in the Custom
    Elements registry of the current browser''s window. The `define()` method of the
    `customElements` collection performs this registration, and it takes the following
    parameters:


    *   **The name of the Custom Element**: This is a string defining the name that
    identifies our element in the HTML markup. In our case, the new element will be
    associated with the `secure-link` name.


    *   **The class implementing the Custom Element**: In our case we are simply passing
    the `SecureLink` class.


    *   **The options:** An optional object defining how the element is defined. Currently,
    only the `extends` option is supported: it specifies the name of the built-in
    element to extend.


    **Make sure you don''t forget to register your Web Component. The class definition
    is not enough to create your component.**


    As you can see, the registration of our Web Component is quite simple. But maybe
    you are wondering why we need to specify we are extending the `<a>` element by
    passing the `{extends: "a"}` object. After all, we just defined our `SecureLink`
    class by extending the built-in `HTMLAnchorElement` class.


    The reason for such a requirement lies in the fact that many HTML elements share
    the same base class. For example, the `<h1>` and `<h2>` elements both extend the
    `HTMLHeadingElement` class, so defining a Custom Element that extends this class
    is not enough to determine which HTML element you actually want to extend.


    On the other hand, when you want to create your own Custom Element by extending
    a native one, you need to know what is the base class to extend. The following
    is a list of the most common HTML elements with their base classes:


    | **Element** | **Base class** |

    | --- | --- |

    | `<a>` | `HTMLAnchorElement` |

    | `<audio>` | `HTMLAudioElement` |

    | `<b>` | `HTMLElement` |

    | `<blockquote>` | `HTMLQuoteElement` |

    | `<body>` | `HTMLBodyElement` |

    | `<br>` | `HTMLBRElement` |

    | `<button>` | `HTMLButtonElement` |

    | `<canvas>` | `HTMLCanvasElement` |

    | `<div>` | `HTMLDivElement` |

    | `<em>` | `HTMLElement` |

    | `<form>` | `HTMLFormElement` |

    | `<h1>, <h2>, <h3>,…` | `HTMLHeadingElement` |

    | `<head>` | `HTMLHeadElement` |

    | `<html>` | `HTMLHtmlElement` |

    | `<i>` | `HTMLElement` |

    | `<img>` | `HTMLImageElement` |

    | `<input>` | `HTMLInputElement` |

    | `<label>` | `HTMLLabelElement` |

    | `<li>` | `HTMLLIElement` |

    | `<ol>` | `HTMLOListElement` |

    | `<p>` | `HTMLParagraphElement` |

    | `<select>` | `HTMLSelectElement` |

    | `<span>` | `HTMLSpanElement` |

    | `<table>` | `HTMLTableElement` |

    | `<td>` | `HTMLTableCellElement` |

    | `<textarea>` | `HTMLTextAreaElement` |

    | `<tr>` | `HTMLTableRowElement` |

    | `<ul>` | `HTMLUListElement` |

    | `<video>` | `HTMLVideoElement` |


    **Table 2.1**


    For the complete list, please refer to the official documentation at the following
    address: **[https://html.spec.whatwg.org/multipage/indices.html#element-interfaces](https://html.spec.whatwg.org/multipage/indices.html#element-interfaces)**.


    # [Web Components naming rules](#toc.xhtml_s23a)


    Before going to see how to use the Web Component we have just defined, let''s
    spend a few words about how to name your elements.


    **Be aware that the name of your Custom Element is not the name of the class that
    implements it.**


    The class name identifies the implementation of your Custom Element, while the
    name of your Custom Element is the string you pass to the `customElements.define()`
    method. It identifies your Custom Element in the HTML markup.

