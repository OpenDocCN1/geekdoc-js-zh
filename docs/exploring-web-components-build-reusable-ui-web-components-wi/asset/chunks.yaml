    \ 属性添加 setter 和 getter，如下面的代码片段所示：\n\n```\nget onaccepted() {\n    return this._onAcceptedListener;\n\
    }\n\nset onaccepted(listener) {\n    if (this._onAcceptedListener) {\n       \
    \ this.removeEventListener(\"accepted\", this._onAcceptedListener);\n    }\n \
