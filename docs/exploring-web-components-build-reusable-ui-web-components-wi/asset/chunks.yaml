- fmt: '

    To define the component''s UI, you have to add a `render()` method to the `CookieAlert`
    configuration object. This method returns a tagged template literal obtained by
    tagging a template literal with the `html()` function, as shown in the following
    example:


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    render: () => html‘


    <style>


    .container {


    color: rgb(255, 255, 255);


    background-color: rgb(35, 122, 252);


    padding: 1em 1.8em;


    width: 100%;


    font-family: Helvetica,Calibri,Arial,sans-serif;


    }


    .footer {


    position:fixed;


    left:0px;


    bottom:0px;


    }


    .button {


    color: rgb(255, 255, 255);


    background-color: transparent;


    border-color: rgb(255, 255, 255);


    padding: 5px 40px;


    margin-right: 50px;


    cursor: pointer;


    float:right;


    }


    </style>


    <div class="container footer">


    <slot id="message" name="message"></slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘


    };


    define("cookie-alert", CookieAlert);

    ```


    The `render()` method creates and updates the DOM structure of your Web Component.
    It works in combination with the built-in template engine.


    The HTML template engine used by Hybrids is similar to the `html()` function of
    the `lit-html` library. However, even if the syntax is quite similar, its implementation
    is different.


    # Properties and attributes


    To add properties and attributes to your component, you need to attach their definition
    to the `CookieAlert` object. In its simplest way, you can add the `message` property
    to the cookie alert component as follows:


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    message: "This website uses cookies to ensure you get the best experience",


    render: ({message}) => html‘


    <style>


    //…


    </style>


    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘


    };


    define("cookie-alert", CookieAlert);

    ```


    You added the `message` property with its default text. This is the basic way
    to define a property.


    As a general approach, the Hybrids library allows you to provide a property descriptor
    to define a property. A property descriptor is a plain object with the general
    form shown below:


    ```

    const MyElement = {


    propertyName: {


    get: (host, lastValue) => {…},


    set: (host, value, lastValue) => {…},


    connect: (host, key, invalidate) => {


    …


    // disconnect


    return () => {…};


    },


    observe: (host, value, lastValue) => {…},


    }


    };

    ```


    The `get()` and `set()` methods define a getter and a setter for the property.
    They have some parameters which allow you to manage the property''s value properly.
    In particular, their first parameter, `host` in the example, represents the current
    component instance. This parameter is explicitly passed and frees you from relying
    on the `this` keyword. The getter and the setter have to return the new property''s
    value.


    The `connect()` and `observe()` methods allow you to execute code when the component
    is added to the DOM and when the property''s value changes.


    Hybrids provide you with some built-in property factories, that is, functions
    that return a pre-defined configuration for properties. The `property()` function
    is one of these factories. It allows you to define a property in the following
    way:


    ```

    import { html, define } from ''hybrids'';


    export const CookieAlert = {


    message: property("This website uses cookies to ensure you get the best experience"),


    //…


    };


    define("cookie-alert", CookieAlert);

    ```


    The `property()` factory returns a standard configuration for the `message` property,
    with a default string value. It also connects the property with an attribute with
    the same name.


    **The value of an attribute is assigned to the corresponding property only once
    when the component is added to the DOM. This means that attributes should be used
    only to set static values in the HTML markup. Changes to attributes are not automatically
    reflected in the corresponding properties.**


    The approach we used above, based on simply assigning the string to the `message`
    property, is just a shortcut for using the `property()` factory. In the Hybrid
    jargon, this sort of shortcut is called **translation**.


    Summarizing, you have many ways to define your property. Each way depends on how
    much flexibility you need for your property definition.


    To complete this overview on properties and attributes, you need to know that
    each item in the configuration object of a Web Component is independent. This
    means that there is no internal state, and any reference to the properties must
    be explicit. This is the reason why the `render()` method of the cookie alert
    definition above has the `{message}` object as a parameter:


    ```

    render: ({message}) => html‘


    <style>


    //…


    </style>


    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton" class="button">Close</button>


    <button id= "acceptButton" class="button">Accept</button>


    </div>


    ‘

    ```


    Since you need to use the `message` property within the template for the UI, you
    have to pass it explicitly. More in general, you have to pass an object with all
    the properties you need to use within the `render()` method.


    # Events


    To add an event listener in the template of a Web Component, you can simply use
    the `onevent` syntax you use on standard HTML elements. For example, to handle
    the click event on both buttons of the cookie alert component, you can do as shown
    below:


    ```

    <div class="container footer">


    <slot id="message" name="message">${message}</slot>&nbsp;


    <slot name="reference"></slot>


    <button id="closeButton"


    class="button"


    onclick="${(host)=> host.style.visibility = "hidden"}">


    Close


    </button>


    <button id= "acceptButton"


    class="button"


    onclick="${accept}">


    Accept


    </button>


    </div>

    ```


    You assigned an arrow function to the `onclick` attribute for the first button,
    and the `accept()` function to the second button. The `accept()` function is a
    normal function defined in the current module as follows:


    ```

    function accept(host) {


    host.style.visibility = "hidden";


    setCookie("cookiesAccepted", "y", 365);


    host.dispatchEvent(new CustomEvent("accepted", {


    detail:{


    acceptedCookieName: "cookiesAccepted",


    acceptedCookieExpiration: 365}


    }));


    }

    ```


    The only main thing to notice here is the `host` parameter. As said, this represents
    the current instance of your component.


    # Lifecycle


    To complete the implementation of our cookie alert component, we need to check
    if the acceptance cookie is set when the component is appended to the DOM. To
    make this possible, we need to rearrange the `message` property definition in
    order to intercept when the component is added to the DOM. In fact, the Hybrids
    library has not global events for the lifecycle of the component. These events
    are on a per property basis.


    So we redefine the `message` property definition as follows:


    ```

    export const CookieAlert = {


    message: {


    get: (host, lastValue = message) => lastValue,


    set: (host,value) => value,


    connect: checkCookie


    },


    render: ({message}) => html‘


    //…


    ‘


    };

    ```


    We specified a getter and a setter for the property, and `connect()` method that
    will be executed when the component will be appended to the DOM. Remember that
    this internally corresponds to the `connectedCallback()` reaction. In other words,
    all the `connect()` methods associated with the component''s property definitions
    are executed when the `connectedCallback()` reaction runs.


    The `checkCookie()` function is defined as follows:

