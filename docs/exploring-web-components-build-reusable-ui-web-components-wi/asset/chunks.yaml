    specify a handler in the HTML markup via special attributes like `onclick, onblur,`
    `onmouseover`, and so on. As you know, these onevent attributes let you attach
    a string representing the code to execute when the specific event occurs. Likely,
    to make your web component as much compliant as possible to standard HTML elements,
    you would like to add this kind of attributes to it. Unfortunately, this feature
    is not free. You need to implement the support for these attributes on your own,
    and it is not so trivial.


