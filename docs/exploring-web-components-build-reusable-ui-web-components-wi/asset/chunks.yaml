    We defined the `handleAccepted()` event handler and assigned it to the `onaccepted`
    attribute in the markup. Of course, the resulting behavior will be the same we
    had before with the `addEventListener()` method.


    Although the management of the attribute is quite satisfactory, you should be
    aware of an important issue in this implementation. Consider the way we assign
    the event handler to the `onaccepted` property:


    ```

    this.onaccepted = new Function("event", ''${newValue}'');

    handleAccepted(event)

    function(event) {

    handleAccepted(event)

    }

    ```


    However, with this approach, we are imposing a constraint - the user must specify
    the event name as the parameter in their event handler. Let''s assume the user
    specifies a different name as in the following example:


    ```

    handleAccepted(e)

    function(event) {

    handleAccepted(e)

    }

    ```


    To get a standard-like solution that allows the user to choose the name of the
    event parameter freely, you should implement a more sophisticated algorithm that
    takes this into account.


    # [Removing event listeners](#toc.xhtml_s73a)


    Event listeners are a practical way to get involved when something happens to
    your component. As you have seen throughout this chapter, you can create them
    for any HTML element that builds the UI of your component. However, you need to
    take care of them also when you don''t need them anymore.


    Event listeners consume system resources. Removing them when you no longer need
    helps to optimize resources management.


    As said in *[Chapter 3, Creating Custom Web Components](#c03.xhtml),* you should
    use the `disconnectedCallback()` reaction to free the resources allocated for
    your web component. As you remember, this reaction is called when your component
    is removed from the DOM. This means that the event listeners of your web component
    have no more reason to exist so that you can remove them. However, to remove your
    event listeners, you need to have a reference to them. So, let''s see which strategy
    you can use to be able to manage the event listener''s lifecycle of your web component
    correctly.


    As a first thing, we need a place where storing the event listener registrations.
    We can define an internal property for this purpose:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this._onAcceptedListener = null;

    this._eventListeners = [];

    }

    ```


    As you can see in the code above, we changed the cookie alert constructor to add
    the `_eventListeners` internal property. This property is an array that will contain
    the objects describing the event listener registrations. Whenever we add an event
    listener, we need to add an object to the `_eventListeners` property. The following
    example shows how to change the code of the `CreateComponent()` method in order
    to add the `Close` button:


    ```

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    const clickHandler = ()=>{

    this.style.visibility = "hidden";

    };

    closeButton.addEventListener("click", clickHandler);

    this._eventListeners.push({object: closeButton, event: "click", handler: clickHandler});

    div.appendChild(closeButton);

    ```


    We assigned the arrow function that hides the cookie alert to the `clickHandler`
    constant. Then, we used it to create the event listener. Finally, we added to
    the `_eventListeners` array an object containing a pointer to the close button
    element, the name of the event, and the reference to the listener. This operation
    represents the internal registration of the event listener.


    **The internal registration operation should be performed any time you add an
    event listener in your web component. For a more readable and maintainable code,
    it would be better if you created a generic function for this purpose.**


    The removal of the registered listeners happens in the `connectedCallback()` method,
    as shown in the following code snippet:


    ```

    disconnectedCallback() {

    this._eventListeners.forEach((registration) => {

    registration.object

    .removeEventListener(registration.event, registration.listener);

    });

    ```


    When your component is removed from the DOM, the information contained in each
    element of the `_eventListeners` property will help you to remove the associated
    listener via the `removeListener()` method.


    # [Conclusion](#toc.xhtml_s74a)


    Throughout this chapter, you discovered how to let your web component dealing
    with events. After a recap about standard DOM event management, we explored the
    ways you can listen to standard events. Then, we dealt with custom events creation
    and discussed how to pass data to the event listener. We also tried to replicate
    the behavior of an onevent-`style` attribute of the standard HTML elements. We
    showed how to manage the registration and deregistration of event listeners to
    prevent unnecessary consumption of system resources.


    Learning how to manage events, let you create web components able to interact
    with the user. This is an essential feature for components to be used in a web
    UI. The events you can create in your components are indistinguishable from the
    standard events. So, the developer using your components can use the standard
    approach to handle them.


    In the next chapter, you will learn how to implement encapsulation for your web
    components by leveraging the shadow DOM. You will see how this standard feature
    protects the internal structure of your component from external interferences.


