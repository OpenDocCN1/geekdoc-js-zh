    In the previous chapter, we included an existing Web Component in an HTML page
    by putting a simple reference to the file that implements it via the `<script>`
    element. We didn''t care about the development environment to be used in that
    case.


    Now, we are going to implement our first Web Component and reasoning about the
    development environment could be appropriate. In general, since creating a Web
    Component doesn''t require more than HTML, JavaScript, and CSS, we would suggest
    using any development environment you feel comfortable with. But you know that
    recently JavaScript development has grown its complexity, mostly due to the needs
    of a few requirements like keeping the language compatibility with older browsers,
    supporting some language extension like JSX, providing a bundling step for the
    production code, and so on. In the light of these possibilities, you may wonder
    what is the better approach to get a development environment for Web Components.


    The good news is that developing Web Components is quite flexible, so you can
    integrate it into the approach you prefer. In this section, we will take a look
    at some approaches, but consider them as suggestions, not constraints.


    # [The editor](#toc.xhtml_s17a)


    Choosing an editor is always a matter of preference. In order to develop your
    Web Component, you can use any editor. You can be very minimal and use a common
    text editor, the one coming with your operating system, for example. However,
    it might not be the most comfortable choice.


    Maybe you could use more advanced editors or **Integrated Development Environments
    (IDE)** that offer you more than simply writing code. Usually, those tools provide
    you with syntax highlighting, code completion, snippets of code, support for debugging,
    and so on. Of course, these and other features help you in being more productive.


    You can choose among many advanced editors or IDEs: Atom, Sublime Text, Visual
    Studio Code, just to mention a few. Use the one you already know, or you are comfortable
    with.


    # [Development without building](#toc.xhtml_s18a)


    As mentioned before, in recent years, JavaScript developers are used to building
    a step of their code. This may be required for a few reasons that range from browser
    compatibility to the use of extension libraries to code optimization, bundling,
    and so on.


    From the Web Component perspective, you could not use any building step. You can
    simply write your code and include it in an HTML page by using the `<script>`
    element or import it in another JavaScript module.


    This approach provides you with a few benefits. You have a simple development
    environment without needing external tools and specific configurations. You just
    need your code and a simple web server.


    However, it has some drawbacks. For example, you need a recent browser that supports
    recent JavaScript features. This might not be a problem during the development
    process, but in production, you have no control over the user''s browser. So,
    even if it could become the standard way of developing Web Components in the future,
    nowadays, it may be a bit risky if your component is meant for a larger audience
    of users.


    # [Development with building](#toc.xhtml_s19a)


    Usually, developers choose to build their JavaScript applications for a few reasons.
    These are some of the most common motivations:


    *   Transpiling: This process is performed by a tool (transpiler) that transforms
    the original JavaScript code into another form, but still JavaScript. There may
    be multiple reasons for this transformation. The most important reason is to transform
    modern JavaScript code into old-style JavaScript so that it can also run in old
    browsers. In addition, transpiling allows you to use recent JavaScript features
    in your code even if they are not yet supported by your browser. But also it allows
    you to run non-standard code such as JavaScript language extension or similar.


    *   Reducing the application size: This process performs some optimizations like
    removing unused or unreachable code (tree shaking) and transforming the original
    code with a more compact version (minification). The goal is to reduce the size
    of the resulting application so that it can be transferred faster on the network.


    *   Bundling: The bundling process combines multiple files into one or, in any
    case, a smaller number of files. This makes the browser to perform a smaller number
    of HTTP requests in order to load your application.


    *   Code splitting: This is the opposite of the bundling process. It allows you
    to split the code of your application into multiple files (bundles) so that they
    can be loaded on demand. This optimizes the use of the network bandwidth and the
    starting time of your application.


    These are the main reasons for applying the building step to your application
    development process. Other reasons may exist depending on the needs of your specific
    application. For example, you may apply a pre-processing step for styling transformations,
    like the one that transforms Sass stylesheets to CSS, or for image processing,
    and so on.


    If you decide to build the code for your Web Component, you can choose the transpiler
    and the bundler you prefer. Maybe Webpack and Rollup are among the more popular
    ones, but definitively the choice is up to you.


    # [The Web Components builder project](#toc.xhtml_s20a)


    For the purposes of this book, but also for any of your own development purposes,
    you can download a pre-configured building project based on Webpack from the following
    GitHub repository: **[https://github.com/andychiare/web-components-builder](https://github.com/andychiare/web-components-builder).**


    The project, named Web Components Builder, acts as a project template for a development
    environment for Web Components. Be sure to have Node.js installed on your computer
    since it depends on this runtime.


    You can get a copy of the Web Components Builder project by using git. Just type
    the following command in a terminal window:


    `git clone` [`https://github.com/andychiare/web-components-builder.git`](https://github.com/andychiare/web-components-builder.git)


    You will get the content of the project in a folder named `web-components-builder`.
    Now, move into this folder and install the required dependencies by typing the
    following command:


    `npm install`


    This command will download and install Webpack and all the required libraries
    at the project level.


    **In the rest of the book, when we will talk about cloning and initializing a
    copy of the Web Components Builder project, we will refer to the** `git clone,`
    **and** `npm install` **commands described above.**


    The project comes with a sample Web Component, the rating component we used in
    the first chapter. The following picture shows the file and folder structure after
    the project initialization:


    ![](images/Figure_2.1.jpg)


    **Figure 2.1**


    The sample Web Component is meant for having an example of how to use the project.
    When you build your own Web Component, you have to change the content of the `index.js`
    file in the `src` folder and the content of the `index.html` file in the `root`
    folder of the project. You will see an example of using this project template
    later on in this chapter.


    To see the sample Web Component in action, just type the following command:


    `npm start`


    After a few seconds, the project is built, so you can open a browser and point
    it to `http://localhost:8080.` You should see a page like the one shown in the
    following picture:


    ![](images/Figure_2.2.jpg)


    **Figure 2.2**


    When you are happy with the Web Component you''ve built, you can create a production-ready
    version of the component. As said before, it means transpiling your code for broader
    compatibility, reducing size, bundling, and so on. So, build your component by
    typing the following command:


    `npm run build`

