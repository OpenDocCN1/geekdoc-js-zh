- fmt: "\nIn the example that we described in the previous section, we named our Custom\
    \ Element as a `secure-link`. The presence of a dash in the name is not accidental.\
    \ In fact, according to the specifications, the name of a Custom Element must\
    \ have a dash in its name. So, `securelink` is not a valid name, while `secure-link`\
    \ is a valid one.\n\nThis trick allows HTML parsers to distinguish regular elements\
    \ from Custom Elements and avoids possible conflicts with the future addition\
    \ of new standard tags. However, even if a name with at least one dash is a legal\
    \ name for your Custom Elements, you cannot use any of the following names:\n\n\
    *   `annotation-xml`\n*   `color-profile`\n*   `font-face`\n*   `font-face-src`\n\
    *   `font-face-uri`\n*   `font-face-format`\n*   `font-face-name`\n*   `missing-glyph`\n\
    \nThese are reserved names from SVG and MathML.\n\nThe need to have a dash in\
    \ the name of your Custom Element gives you the opportunity to name elements with\
    \ a sort of namespace and to avoid conflicts with Custom Elements created by a\
    \ third-party. Even if it is not a requirement, you should consider prefixing\
    \ the name of your Custom Element with a hopefully unique name. For example, if\
    \ you are building your Custom Element library and want to name it foo, you could\
    \ name your elements by using the `foo`- prefix. So you could have names like\
    \ `foo-input`, `foo-link`, `foo-image`, and so on.\n\n# [Using a Custom Element\
    \ based on native elements](#toc.xhtml_s24a)\n\nNow, you have your `secure-link`\
    \ Web Component, and you want to use it in your Web application. You have a few\
    \ options for using it, and it mostly depends on the type of application or website\
    \ you are building. Let's take a look at the two commons options: including in\
    \ an HTML page or importing in a JavaScript module.\n\n# [Including in an HTML\
    \ page](#toc.xhtml_s25a)\n\nThe simplest way to use your component in your website\
    \ is to include the JavaScript script in your HTML page, as in the following:\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n\
    <script src=\"secureLink.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \nThen, to use your component, you will add the following code to the body of\
    \ your HTML page:\n\n```\n<a is=\"secure-link\" href=\"http://www.wikipedia.org\"\
    >Wikipedia</a>\n```\n\nAs you can see, here we are using the Web Component differently\
    \ to the `my-rating` component presented in the first chapter. While in the case\
    \ of the `my-rating` component, we used that name as a tag, here we are using\
    \ the component's name as a value for the is attribute of the `<a>` HTML element.\
    \ This is the macroscopic difference from the markup point of view between an\
    \ Autonomous Custom Element and Customized Native Element. What we are saying\
    \ here is that our element is an `<a>` HTML element with the additional feature\
    \ provided by the `secure-link` extension. In the next section, we will discuss\
    \ a bit more in depth the reasons behind this approach and which are the benefits\
    \ of using customized native elements. For the moment, we take note of this and\
    \ see what happen to the new page whose full code now appears as follows:\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<script\
    \ src=\"secureLink.js\"></script>\n</head>\n<body>\n<a is=\"secure-link\" href=\"\
    http://www.wikipedia.org\">Wikipedia</a>\n</body>\n</html>\n```\n\nNow, open the\
    \ page with a browser. You should see a blank page with a link to the Wikipedia\
    \ website. By clicking the link, you should get an alert window warning that you\
    \ are about to navigate to a non-safe website, similarly, as shown in the following\
    \ picture:\n\n![](images/Figure_2.3.jpg)\n\n**Figure 2.3**\n\nOnly if you consent\
    \ to navigate to that link the browser will load the Wikipedia's home page. If\
    \ you do not consent, you will stay on the current page as expected.\n\nNow you\
    \ have a customized version of the standard `<a>` HTML element.\n\nIf you take\
    \ a look back at the Custom Element implementation, you will see that it could\
    \ be improved in the way it handles the security requirement. Of course, you're\
    \ right, but this is not the focus of the implementation. Here we are simply focussing\
    \ on how to create your own Custom Element by extending native elements.\n\n#\
    \ [Importing in a JavaScript module](#toc.xhtml_s26a)\n\nSo far, we showed a very\
    \ simple way to include your code in an HTML page and use your Custom Element.\
    \ But you may find yourself in a different scenario, like when you have a building\
    \ environment or when you are building a composite Web Component, as we will see\
    \ in a future chapter. In these scenarios, probably you are using JavaScript modules,\
    \ and you'd like to import a Web Component without having to explicitly add a\
    \ script in the HTML page.\n\nTo better explain how to deal with these scenarios,\
    \ let's consider the typical **Single Page Application (SPA)** scenario where\
    \ almost all the UI is dynamically built by JavaScript code. In this context,\
    \ usually, you have a single HTML page referring to a single JavaScript file having\
    \ in charge of loading the rest of the application, possibly on demand.\n\nTo\
    \ make this scenario more concrete, start a new project by cloning and initializing\
    \ the Web Components Builder project we mentioned above. Now, replace the content\
    \ of HTML page in the root folder with the following markup:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Web Components with Webpack Starter Kit</title>\n\
    <script src=\"./bundle.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \nAs you can see, this is an empty HTML page with a single script reference to\
    \ the `bundle.js` file. This `bundle.js` file will be the result of the building\
    \ process applied to the content of the `src` folder.\n\nNow, add to the `src`\
    \ folder the `secureLink.js` file created in the previous section and containing\
    \ the native custom element implementation. Finally, replace the content of the\
    \ `index.js` file with the following code:\n\n```\nimport \"./secureLink\";\n\n\
    window.onload = function() {\n  const secureLink = document.createElement(\"a\"\
    , {is:\"secure-link\"});\n  secureLink.setAttribute(\"href\", \"http://www.wikipedia.org\"\
    );\n  secureLink.innerText = \"Wikipedia\";\n  document.body.appendChild(secureLink);\n\
    };\n```\n\nLet's take a look at what this code is doing.\n\nThe first line imports\
    \ our `secure-link` component. As you can see, it is a simple import with side\
    \ effects. This means that by importing the `secureLink.js` file the entire code\
    \ will be executed without explicitly binding any result to any variable or constant.\
    \ So, after this line, we have the `secure-link` component registered and available\
    \ without the need to add a `<script>` tag in the HTML page.\n\nThen, you bind\
    \ a listener to the onload event of the current window browser. This means that,\
    \ when the HTML page is loaded in the window browser, that function will create\
    \ an instance of our `secure-link` component, will configure it, and will append\
    \ it to the body of the HTML page.\n\nLet's focus a bit at how the `secure-link`\
    \ component instance is created. The statement used in the example is the following:\n\
    \n```\nconst secureLink = document.createElement(\"a\", {is:\"secure-link\"});\n\
    ```\n\nWe used the typical `createElement()` method of the document object by\
    \ specifying the tag name of the element we want to create. However, unlike the\
    \ usual way, we dynamically create an HTML element; in this case, we added a second\
    \ argument. This argument is an object specifying that the `<a>` element we want\
    \ to create is customized by the `secure-link` definition. This allows us to get\
    \ an instance of our Web Component.\n\n**Some browsers allow you to specify a\
    \ string as the second argument of the** `createElement()` **method. This is for\
    \ backward compatibility with an older version of Custom Elements specifications.**\n\
    \n**This approach is deprecated so, please, use the object-based approach.**\n"
  raw: 'In the example that we described in the previous section, we named our Custom
    Element as a secure-link. The presence of a dash in the name is not accidental.
    In fact, according to the specifications, the name of a Custom Element must have
    a dash in its name. So, `securelink` is not a valid name, while secure-link is
    a valid one.


    This trick allows HTML parsers to distinguish regular elements from Custom Elements
    and avoids possible conflicts with the future addition of new standard tags. However,
    even if a name with at least one dash is a legal name for your Custom Elements,
    you cannot use any of the following names:


    *   `annotation-xml`


    *   `color-profile`


    *   `font-face`


    *   `font-face-src`


    *   `font-face-uri`


    *   `font-face-format`


    *   `font-face-name`


    *   `missing-glyph`


    These are reserved names from SVG and MathML.


    The need to have a dash in the name of your Custom Element gives you the opportunity
    to name elements with a sort of namespace and to avoid conflicts with Custom Elements
    created by a third-party. Even if it is not a requirement, you should consider
    prefixing the name of your Custom Element with a hopefully unique name. For example,
    if you are building your Custom Element library and want to name it foo, you could
    name your elements by using the `foo`- prefix. So you could have names like foo-input,
    `foo-link, foo-image,` and so on.


    # [Using a Custom Element based on native elements](#toc.xhtml_s24a)


    Now, you have your secure-link Web Component, and you want to use it in your Web
    application. You have a few options for using it, and it mostly depends on the
    type of application or website you are building. Let''s take a look at the two
    commons options: including in an HTML page or importing in a JavaScript module.


    # [Including in an HTML page](#toc.xhtml_s25a)


    The simplest way to use your component in your website is to include the JavaScript
    script in your HTML page, as in the following:


    `<!DOCTYPE html>`


    `<html lang="en">`


    `<head>`


    `<meta charset="utf-8">`


    `<script src="secureLink.js"></script>`


    `</head>`


    `<body>`


    `</body>`


    `</html>`


    This is the way we used the `my-rating` component in the first chapter, so there''s
    nothing really new. Then, to use your component, you will add the following code
    to the body of your HTML page:


    `<a is="secure-link" href="http://www.wikipedia.org">Wikipedia</a>`


    As you can see, here we are using the Web Component differently to the `my-rating`
    component presented in the first chapter. While in the case of the `my-rating`
    component, we used that name as a tag, here we are using the component''s name
    as a value for the is attribute of the `<a>` HTML element. This is the macroscopic
    difference from the markup point of view between an Autonomous Custom Element
    and Customized Native Element. What we are saying here is that our element is
    an `<a>` HTML element with the additional feature provided by the `secure-link`
    extension. In the next section, we will discuss a bit more in depth the reasons
    behind this approach and which are the benefits of using customized native elements.
    For the moment, we take note of this and see what happen to the new page whose
    full code now appears as follows:


    `<!DOCTYPE html>`


    `<html lang="en">`


    `<head>`


    `<meta charset="utf-8">`


    `<script src="secureLink.js"></script>`


    `</head>`


    `<body>`


    `<a is="secure-link" href="http://www.wikipedia.org">Wikipedia</a>`


    `</body>`


    `</html>`


    Now, open the page with a browser. You should see a blank page with a link to
    the Wikipedia website. By clicking the link, you should get an alert window warning
    that you are about to navigate to a non-safe website, similarly, as shown in the
    following picture:


    ![](images/Figure_2.3.jpg)


    **Figure 2.3**


    Only if you consent to navigate to that link the browser will load the Wikipedia''s
    home page. If you do not consent, you will stay on the current page as expected.


    Now you have a customized version of the standard <a> HTML element.


    If you take a look back at the Custom Element implementation, you will see that
    it could be improved in the way it handles the security requirement. Of course,
    you''re right, but this is not the focus of the implementation. Here we are simply
    focussing on how to create your own Custom Element by extending native elements.


    # [Importing in a JavaScript module](#toc.xhtml_s26a)


    So far, we showed a very simple way to include your code in an HTML page and use
    your Custom Element. But you may find yourself in a different scenario, like when
    you have a building environment or when you are building a composite Web Component,
    as we will see in a future chapter. In these scenarios, probably you are using
    JavaScript modules, and you''d like to import a Web Component without having to
    explicitly add a script in the HTML page.


    To better explain how to deal with these scenarios, let''s consider the typical
    **Single Page Application (SPA)** scenario where almost all the UI is dynamically
    built by JavaScript code. In this context, usually, you have a single HTML page
    referring to a single JavaScript file having in charge of loading the rest of
    the application, possibly on demand.


    To make this scenario more concrete, start a new project by cloning and initializing
    the Web Components Builder project we mentioned above. Now, replace the content
    of HTML page in the root folder with the following markup:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Web Components with Webpack Starter Kit</title>`


    `<script src="./bundle.js"></script>`


    `</head>`


    `<body>`


    `</body>`


    `</html>`


    As you can see, this is an empty HTML page with a single script reference to the
    `bundle.js` file. This bundle.js file will be the result of the building process
    applied to the content of the `src` folder.


    Now, add to the `src` folder the `secureLink.js` file created in the previous
    section and containing the native custom element implementation. Finally, replace
    the content of the `index.js` file with the following code:


    `import "./secureLink";`


    `window.onload = function() {`


    `const secureLink = document.createElement("a", {is:"secure-link"});`


    `secureLink.setAttribute("href", "http://www.wikipedia.org");`


    `secureLink.innerText = "Wikipedia";`


    `document.body.appendChild(secureLink);`


    `};`


    Let''s take a look at what this code is doing.


    The first line imports our `secure-link` component. As you can see, it is a simple
    import with side effects. This means that by importing the `secureLink.js` file
    the entire code will be executed without explicitly binding any result to any
    variable or constant. So, after this line, we have the `secure-link` component
    registered and available without the need to add a `<script>` tag in the HTML
    page.


    Then, you bind a listener to the onload event of the current window browser. This
    means that, when the HTML page is loaded in the window browser, that function
    will create an instance of our secure-link component, will configure it, and will
    append it to the body of the HTML page.


    Let''s focus a bit at how the secure-link component instance is created. The statement
    used in the example is the following:


    `const secureLink = document.createElement("a", {is:"secure-link"});`


    We used the typical `createElement()` method of the document object by specifying
    the tag name of the element we want to create. However, unlike the usual way,
    we dynamically create an HTML element; in this case, we added a second argument.
    This argument is an object specifying that the `<a>` element we want to create
    is customized by the secure-link definition. This allows us to get an instance
    of our Web Component.


    **Some browsers allow you to specify a string as the second argument of the**
    `createElement()` **method. This is for backward compatibility with an older version
    of Custom Elements specifications.**


    **This approach is deprecated so, please, use the object-based approach.**'
