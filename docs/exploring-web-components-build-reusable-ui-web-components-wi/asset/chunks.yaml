    ```


    这与我们在前一章介绍属性和属性管理时使用的标记相同。


    现在，让我们编辑 `index.js` 文件，对其中的代码进行一些修改。首先，添加一条新的 CSS 规则来格式化我们的新按钮。`styleRules` 常量将如下所示：


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    .button {

    color: rgb(255, 255, 255);

    background-color: transparen

    border-color: rgb(255, 255, 255);

    padding: 5px 40px;

    margin-right: 50px;

    cursor: pointer;

    float:righ

    }

    ‘;

    ```


    如你所见，我们只是添加了一个 `button` CSS 类，定义了一些图形属性。


    现在，让我们将实际的按钮添加到 Web 组件的标记中。因此，我们将 `createComponent()` 方法修改如下：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    this.appendChild(div);

    this.updateMessage();

    }

    ```


    我们添加了几条语句，用于创建一个 `<button>` HTML 元素，为其分配 `button` 类和文本“关闭”，附加一个事件监听器，并将该按钮追加到容器
    `<div>` 中。


    就我们的目标而言，这些语句中相关的部分是事件监听器的附加。如你所见，我们使用了按钮的标准 `addEventListener()` 方法来为 `click`
    事件分配一个监听器，就像你对任何标准 HTML 元素所做的那样。这个特定的监听器通过更改其 `visibility` 属性的值来隐藏整个 Web 组件。


    如果我们运行项目，将看到以下页面：


    ![](img/Figure_5.2.jpg)


    **图 5.2**


    如你所见，现在 cookie 提醒的右侧有一个“关闭”按钮。如果你点击它，横幅将按预期消失。


    因此，你现在知道了如何监听和处理可能发生在组成 Web 组件的各个元素上的标准事件。


    请注意，你的 Web 组件本身作为一个整体也可以监听标准事件。记住它继承自 `HTMLElement`。因此，你可以监听可能发生在组件整个表面上的任何事件，而不仅仅是组成它的单个元素。


    例如，你可以实现一个视觉效果，当用户的鼠标指针悬停在组件区域时，改变横幅的背景颜色。为了实现这个效果，让我们在 `createComponent()` 方法中添加几条语句。该方法的新版本将如下所示：


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "Close";

    closeButton.addEventListener("click", ()=>{

    this.style.visibility = "hidden";

    });

    div.appendChild(closeButton);

    this.appendChild(div);

    this.addEventListener("mouseover", ()=> {

    div.style.backgroundColor = "rgb(35, 122, 152)";

    });

    this.addEventListener("mouseout", ()=> {

    div.style.backgroundColor = "";

    });

    this.updateMessage();

    }

    ```


    我们在 `createComponent()` 方法的代码中添加的两条新语句使用了 `this` 关键字，直接将两个事件监听器添加到 Web 组件上。第一个事件监听器捕获
    `mouseover` 事件，第二个处理 `mouseout` 事件。在前一种情况下，我们更改容器 `<div>` 的背景颜色。在后一种情况下，我们将此背景颜色重置为容器
    CSS 类中定义的默认颜色。


    # 事件传播


    我们在上一节中解释的事件管理向我们展示了作为 Web 组件开发者，我们如何捕获标准事件并处理它。但是，如果用户在我们的 Web 组件上指定了他们自己的事件处理程序，会发生什么？例如，假设用户像下面的标记那样向
    `onclick` 属性添加了一个处理程序：


    ```

    <cookie-alert

    message="We use cookies, but respect your privacy!"

    onclick="alert(''You clicked!'')">

    </cookie-alert>

    ```


    当然，用户可以这样做。由于 cookie 提醒继承自 `HTMLElement`，它也继承了像 `onclick` 这样的标准事件钩子。因此，当用户点击横幅的任何部分时，都会显示警告。


    请注意，即使用户点击了“关闭”按钮，用户的警告也会显示。这是因为事件传播流程。一旦点击事件到达目标元素（即关闭按钮），它就进入冒泡阶段。在此阶段，事件会经过按钮的所有父元素，直到到达并执行用户的
    `onclick` 处理程序。


    也许你想知道是否有办法阻止用户向标准事件添加处理程序。在尝试找到解决方案之前，先问问自己是否想要这样做。你想阻止用户附加他们的事件处理程序吗？毕竟，任何标准元素都允许你附加标准事件处理程序。为什么你的组件要不同呢？


    无论如何，如果你想阻止用户添加他们的事件处理程序，或者更确切地说，忽略它们，你应该在 Web 组件创建时立即添加一个特殊的事件监听器。换句话说，对于我们的点击事件示例，你应该像下面这样修改组件的构造函数：


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    this.addEventListener("click", (e) => {

    e.stopImmediatePropagation();

    });

    }

    ```


