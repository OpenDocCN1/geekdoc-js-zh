  trans: "\n\n现在，打开终端窗口，进入项目根目录，输入 `npm start` 命令来运行你的组件。如果你打开浏览器并访问 `http://localhost:8080`，应该会看到与之前相同的结果：一个指向维基百科主页的链接，点击时会警告你关于安全性的问题。\n\
    \n# 定义基于函数的自定义元素\n\n我们使用 ECMAScript 2015 规范引入的类语法定义了自定义元素。作为一名 JavaScript 开发者，你知道类本质上是构造函数和原型的语法糖。因此，你可能会想，是否可以使用函数来定义自定义元素，而不是基于类的语法。\n\
    \n答案是肯定的，但有一些注意事项。以下代码是我们之前定义的 `secure-link` 元素的等效实现：\n\n```\nfunction SecureLink()\
    \ {\n\nreturn Reflect.construct(HTMLAnchorElement, [], this.constructor);\n\n\
    }\n\nSecureLink.prototype = Object.create(HTMLAnchorElement.prototype);\n\nSecureLink.prototype.constructor\
    \ = SecureLink;\n\nObject.setPrototypeOf(SecureLink, HTMLAnchorElement);\n\nSecureLink.prototype.connectedCallback\
    \ = function() {\n\nthis.addEventListener(\"click\", (e) => {\n\nif (!this.href.startsWith(\"\
    https\")) {\n\nif (!confirm(\"You are about to navigate to an unsafe site. Do\
    \ you want to continue?\")) {\n\ne.preventDefault();\n\n}\n\n}\n\n});\n\n}\n\n\
    customElements.define(\"secure-link\", SecureLink, {extends: \"a\"});\n```\n\n\
    如你所见，我们定义了 `SecureLink()` 函数，为其原型分配了从 `HTMLAnchorElement` 继承所需的所有内容，并附加了 `connectedCallback()`\
    \ 方法。这段代码比基于类的版本略显冗长。但这并不是唯一需要注意的地方。你应该注意到 `SecureLink()` 函数是如何定义其对 `HTMLAnchorElement`\
    \ 的继承关系的：\n\n```\nfunction SecureLink() {\n\nreturn Reflect.construct(HTMLAnchorElement,\
    \ [], this.constructor);\n\n}\n```\n\n通常，你会使用父类或父对象的 `apply()` 方法。而在这里，你使用的是 `Reflect`\
    \ 对象的 `construct()` 方法。这一事实将自定义元素的定义与 ECMAScript 2015 特性绑定在一起，因为 `Reflect` 对象是在该规范中引入的。因此，如果你打算使用基于函数的方法来定义自定义元素，以便兼容旧版本的\
    \ JavaScript 引擎，那你就错了。你仍然需要一个 polyfill，至少是针对 `Reflect` 对象的。\n\n**作为一般性建议，即使你可以使用基于函数的定义来创建自定义元素，也不推荐这种做法，而应优先使用基于类的语法。**\n\
    \n# 扩展原生元素的好处\n\n在创建 Web 组件时，通过扩展原生元素来创建自定义元素应该是首选方法。事实上，这种方法为你带来了几个好处：\n\n* \
    \  **与旧版浏览器的兼容性**：不支持 Web 组件技术的浏览器仍然可以访问组件的基本功能。例如，考虑本章中创建的 `secure-link` 组件及其在\
    \ HTML 页面中的使用：\n\n    `<a is=\"secure-link\" href=\"http://www.wikipedia.org\"\
    >Wikipedia</a>`\n\n    如果浏览器无法解析 `is` 属性，它将被忽略。因此，你将失去链接上的安全检查，但组件仍然可以正常工作，只是一个普通的链接。\n\
    \n*   **在禁用 JavaScript 时的可用性**：当然，当用户在浏览器中禁用 JavaScript 时，你会得到与上一点相同的保守行为。你仍然拥有一个没有扩展功能的普通链接。\n\
    \n*   **编码简单**：扩展原生元素通常只需要几行代码。你只需要实现想要添加到原生元素中的功能，而它的标准行为是免费获得的。这与自主自定义元素的实现不同，我们将在下一章中看到。\n\
    \n鉴于这些好处，当你准备创建自己的 Web 组件时，应该始终问自己：它能否作为原生元素的扩展来实现？如果可能，这应该是首选方案。\n\n# 结论\n\n\
    在本章中，我们开始探索构建自己的 Web 组件的方法。我们讨论了设置开发环境的选项，并介绍了一个基于构建流程的模板项目。然后，我们介绍了自定义元素，并重点讨论了扩展原生\
    \ HTML 元素。我们还讨论了如何在开发环境中使用这个组件，以及自定义原生 HTML 元素的好处。\n\n阅读本章后，你将能够决定哪种开发环境更适合创建自己的\
    \ Web 组件。你还能够自定义原生 HTML 元素，并知道如何正确命名它们。此外，你学会了如何在有构建流程和无构建流程的开发环境中使用你的 Web 组件。最后，你现在了解了当你选择这种方法构建组件时，扩展原生\
    \ HTML 元素所带来的好处。\n\n在下一章中，我们将讨论何时以及如何创建自主自定义元素，同时探索一些与自定义原生元素共有的新特性。\n\n# 问题\n\
    \n1.  构建流程在开发环境中带来了哪些好处？\n\n2.  什么是自定义元素？\n\n3.  自定义原生元素和自主自定义元素有什么区别？\n\n4. \
    \ `customElements.define()` 方法的作用是什么？\n\n5.  命名自定义原生元素有哪些限制？\n\n6.  如何在 HTML 页面的标记中使用自定义原生元素？\n\
    \n7.  如何在带有构建流程的开发环境中使自定义原生元素可用？\n\n8.  将 Web 组件实现为自定义原生元素有哪些好处？\n\n# 第 3 章\n\n\
    # 创建自定义 Web 组件\n\n在上一章中，我们学习了如何自定义标准 HTML 元素。在本章中，我们将更进一步，创建不严格基于已知 HTML 元素的 Web\
    \ 组件。这种 Web 组件被称为**自主自定义元素**，它将让你构建全新的组件，其行为完全由你的想象力决定。像往常一样，你将通过构建一个具体的自主自定义元素来学习如何创建这种类型的组件。在本章中，你将搭建组件的基础，我们将在本书的其余部分中完成它。\n\
    \n# 结构\n\n*   从头开始创建 Web 组件\n\n*   添加 CSS 和标记的基本技术\n\n*   Web 组件的生命周期\n\n*   使用自定义\
    \ Web 组件\n\n# 目标\n\n本章将教你什么是**自主自定义元素**，以及它与**自定义原生元素**的区别。你将学习如何搭建一个简单的组件，以及如何使用一些基本技术通过标记和\
    \ CSS 创建其用户界面。此外，你还将学习关于 Web 组件生命周期的一些概念，以及如何利用它们来处理组件的生命周期。你将了解在组件生命周期的哪些步骤允许进行某些操作，以及何时不能。最后，你将发现你和其他开发者如何在自己的网页或\
    \ Web 应用程序中使用你的组件。\n\n# 从头开始创建 Web 组件\n\n从上一章中，你已经知道如何通过扩展原生 HTML 元素来构建自己的 Web\
    \ 组件。你学会了改变现有标准 HTML 元素的行为以适应你的需求是多么简单。\n\n"
