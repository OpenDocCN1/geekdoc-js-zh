    # 移除事件监听器


    事件监听器是一种实用的方式，可以在组件发生某些事情时参与其中。正如您在本章中所见，您可以为构建组件 UI 的任何 HTML 元素创建事件监听器。然而，当您不再需要它们时，也需要妥善处理。


    事件监听器会消耗系统资源。在不再需要时移除它们有助于优化资源管理。


    正如*第 3 章，创建自定义 Web 组件*中所述，您应该使用 `disconnectedCallback()` 回调来释放为 Web 组件分配的资源。您还记得，当组件从
    DOM 中移除时，会调用此回调。这意味着您的 Web 组件的事件监听器不再有存在的理由，因此您可以移除它们。但是，要移除事件监听器，您需要持有对它们的引用。那么，让我们看看可以采用哪种策略来正确管理
    Web 组件的事件监听器生命周期。


    首先，我们需要一个存储事件监听器注册信息的地方。我们可以为此定义一个内部属性：


    ```

    constructor() {

    super();

    this._message = "本网站使用 Cookie 以确保您获得最佳体验";

    this._onAcceptedListener = null;

    this._eventListeners = [];

    }

    ```


    如上述代码所示，我们修改了 Cookie 提示的构造函数，添加了 `_eventListeners` 内部属性。该属性是一个数组，包含描述事件监听器注册信息的对象。每当我们添加一个事件监听器时，都需要向
    `_eventListeners` 属性添加一个对象。以下示例展示了如何修改 `CreateComponent()` 方法的代码，以添加“关闭”按钮：


    ```

    const closeButton = document.createElement("button");

    closeButton.classList.add("button");

    closeButton.innerText = "关闭";

    const clickHandler = ()=>{

    this.style.visibility = "hidden";

    };

    closeButton.addEventListener("click", clickHandler);

    this._eventListeners.push({object: closeButton, event: "click", handler: clickHandler});

    div.appendChild(closeButton);

    ```


    我们将隐藏 Cookie 提示的箭头函数赋值给 `clickHandler` 常量。然后，使用它创建事件监听器。最后，向 `_eventListeners`
    数组添加一个对象，其中包含指向关闭按钮元素的指针、事件名称以及监听器的引用。此操作表示事件监听器的内部注册。


    **每当您在 Web 组件中添加事件监听器时，都应执行内部注册操作。为了提高代码的可读性和可维护性，最好为此创建一个通用函数。**


    已注册监听器的移除发生在 `connectedCallback()` 方法中，如下代码片段所示：


    ```

    disconnectedCallback() {

    this._eventListeners.forEach((registration) => {

    registration.object

    .removeEventListener(registration.event, registration.listener);

    });

    ```


    当您的组件从 DOM 中移除时，`_eventListeners` 属性中每个元素包含的信息将帮助您通过 `removeListener()` 方法移除关联的监听器。


    # 结论


    在本章中，您了解了如何让 Web 组件处理事件。在回顾了标准 DOM 事件管理之后，我们探讨了监听标准事件的方式。然后，我们处理了自定义事件的创建，并讨论了如何将数据传递给事件监听器。我们还尝试复制标准
    HTML 元素的 `onevent` 风格属性的行为。我们展示了如何管理事件监听器的注册和注销，以防止不必要的系统资源消耗。


    学习如何管理事件，让您能够创建与用户交互的 Web 组件。这是组件在 Web UI 中使用的关键特性。您在组件中创建的事件与标准事件无异。因此，使用您组件的开发者可以采用标准方法来处理它们。


    在下一章中，您将学习如何通过利用影子 DOM 为 Web 组件实现封装。您将看到这一标准特性如何保护组件的内部结构免受外部干扰。


