  trans: "\n在此上下文中，构建工具链至关重要，而且在绝大多数情况下，开发环境都基于 Node.js 运行时。如你所知，在这种环境中，添加外部组件或库的常用方法是使用包管理器（如\
    \ `npm` 或 `yarn`）安装包。那么，假设我们想以包的形式向用户提供 cookie 提醒组件。我们该如何实现呢？让我们一起来探索。\n\n# 利用\
    \ GitHub 仓库\n\n将你的组件打包并分发给其他开发者的最简单方法是通过 GitHub 仓库共享。这种方法不仅可以让你共享项目的源代码，还能让其他开发者使用\
    \ `npm` 将你的组件安装到他们的项目中。让我们看看它是如何工作的。\n\n准备好要发布到 GitHub 仓库的代码后，请确保你的 `package.json`\
    \ 文件配置正确。以下是我们 cookie 提醒组件的 `package.json` 文件示例：\n\n```\n{\n  \"name\": \"cookie-alert-demo\"\
    ,\n  \"version\": \"1.0.0\",\n  \"description\": \"一个 Web 组件，用于显示关于 cookie 政策的提示信息。\"\
    ,\n  \"main\": \"src/index.js\",\n  \"scripts\": {\n    \"start\": \"webpack-dev-server\
    \ --config ./webpack.config.js --mode development\",\n    \"build\": \" node node_modules/.bin/webpack\
    \ --mode production\",\n    \"test\": \"echo \\\"Error: no test specified\\\"\
    \ && exit 0\"\n  },\n  \"keywords\": [],\n  \"author\": \"Andrea Chiarelli (https://www.andreachiarelli.it)\"\
    ,\n  \"license\": \"MIT\",\n  \"devDependencies\": {\n    \"webpack\": \"⁴.41.2\"\
    ,\n    \"webpack-cli\": \"³.3.9\",\n    \"webpack-dev-server\": \"³.8.2\",\n \
    \   \"copy-webpack-plugin\": \"⁵.0.4\"\n  },\n  \"dependencies\": {\n    \"@webcomponents/webcomponentsjs\"\
    : \"².3.0\"\n  }\n}\n```\n\n让我们强调一下最重要的部分。为你的包取一个有意义的名称和描述。同时，分配一个版本号，并在未来对代码进行更改时保持更新。\n\
    \n`package.json` 文件中的 `name` 和 `version` 是发布包所必需的字段。\n\n名称需要遵循一些规则：\n\n- 必须唯一\n\
    - 最大长度为 214 个字符\n- 不能以点号或下划线开头\n- 不能包含大写字母\n\n然后，设置 `main` 属性，指向项目的入口文件。如果你的项目只有一个文件，则设置其路径。在示例中，我们指定了\
    \ `src` 文件夹下 `index.js` 文件的路径。其他设置则是开发所需。\n\n通过这些简单的调整，我们的用户只需输入 `npm install`\
    \ 命令即可将我们的组件作为包安装。例如，要从发布在 `https://github.com/andychiare/cookie-alert-demo` 的\
    \ GitHub 仓库安装我们的 cookie 提醒组件，用户需要输入：\n\n`npm install andychiare/cookie-alert-demo`\n\
    \n你可能已经注意到，用户只需指定 GitHub 组织和仓库名称即可。\n\n一旦代码安装到 `node_modules` 文件夹中，用户就可以像使用标准包一样导入该组件。例如，该组件可以动态附加到\
    \ HTML 页面的 body 中，如下所示：\n\n```\nimport CookieAlert from 'cookie-alert-demo';\n\
    const cookieAlert = new CookieAlert();\ndocument.body.appendChild(cookieAlert);\n\
    ```\n\n# 发布到公共 npm 注册表\n\n如果你想将组件发布到官方的 `npm registry`，你需要拥有一个账户，并在发布前登录到注册表。登录命令如下：\n\
    \n`npm login`\n\n系统会要求你提供用户名、密码和电子邮件。登录后，你可以通过从组件项目的根目录输入以下命令来发布包：\n\n`npm publish`\n\
    \n此命令会将包含你组件的包发布到 npm `registry`。发布后，你可以通过其公共 URL（格式为 `https://www.npmjs.com/package/<package-name>`，其中\
    \ `<package-name>` 是你的包名）来验证你的包。\n\n在这种情况下，你的组件的用户可以通过输入以下命令轻松安装此包：\n\n`npm install\
    \ package-name`\n\n当然，组件在目标项目中的使用方式与我们在 GitHub 仓库案例中看到的相同。\n\n# 扩展 Web 组件\n\n\
    到目前为止，我们已经了解了如何创建 Web 组件、如何使其可供其他开发者使用，以及如何在 HTML 标记或 JavaScript 应用程序中使用它。\n\n\
    如你所见，使用 Web 组件非常简单：你可以像处理原生 HTML 元素一样处理它。这个非常简单的概念有一些非常有趣的启示。事实上，就像你可以对任何原生 HTML\
    \ 元素进行操作一样，你可以通过扩展现有的 Web 组件来创建自己的 Web 组件。让我们看看它是如何工作的。\n\n# 定义扩展的 Web 组件\n\n\
    考虑我们目前实现的 cookie 提醒组件。我们想创建该组件的一个变体，它有一个属性和一个属性，允许我们显示或隐藏“关闭”按钮。\n\n我们可以通过克隆并初始化\
    \ Web 组件构建器项目来创建一个新项目。然后，通过运行以下命令将 `cookie-alert-demo` Web 组件添加到项目中：\n\n`npm install\
    \ andychiare/cookie-alert-demo`\n\n最后，我们按如下方式实现这个新组件：\n\n```\nimport CookieAlert\
    \ from 'cookie-alert-demo';\n\nclass MyCookieAlert extends CookieAlert {\n  constructor()\
    \ {\n    super();\n    this._hasCloseButton = false;\n  }\n\n  get hasCloseButton()\
    \ {\n    return this._hasCloseButton;\n  }\n\n  set hasCloseButton(value) {\n\
    \    this._hasCloseButton = value;\n    this.setAttribute(\"closebutton\", value);\n\
    \    this.toggleCloseButton(value);\n  }\n\n  toggleCloseButton(visible) {\n \
    \   const closeButton = super.shadowRoot.getElementById(\"closeButton\");\n  \
    \  closeButton.style.display = (visible? \"block\": \"none\");\n  }\n\n  static\
    \ get observedAttributes() {\n    return [\"closebutton\"];\n  }\n\n  attributeChangedCallback(name,\
    \ oldValue, newValue) {\n    if (oldValue !== newValue) {\n      if (name == \"\
    closebutton\") {\n        let isVisible = (newValue === \"true\" || newValue ===\
    \ \"\");\n        this._hasCloseButton = isVisible;\n        this.toggleCloseButton(isVisible);\n\
    \      }\n    }\n  }\n\n  connectedCallback() {\n    super.connectedCallback();\n\
    \    this.toggleCloseButton(this._hasCloseButton);\n  }\n}\n\ncustomElements.define(\"\
    my-cookie-alert\", MyCookieAlert);\n```\n\n让我们分析这段代码的每个部分。第一行从 `cookie-alert-demo`\
    \ 模块导入 `CookieAlert` 类。`MyCookieAlert` 类定义继承自 `CookieAlert` 类。这是关键点：我们没有像通常那样继承自\
    \ `HTMLElement` 类，而是从 cookie 提醒组件开始构建一个新的 Web 组件。其余代码现在应该很容易理解了。\n\n`MyCookieAlert`\
    \ 类的构造函数调用 `super()` 并将内部属性 `_hasCloseButton` 初始化为 `false`：\n\n```\nconstructor()\
    \ {\n  super();\n  this._hasCloseButton = false;\n}\n```\n\n这意味着这个 cookie 提醒组件的变体默认不应显示“关闭”按钮。然后，我们定义了\
    \ `hasCloseButton` 属性的 getter 和 setter：\n\n```\nget hasCloseButton() {\n  return\
    \ this._hasCloseButton;\n}\n\nset hasCloseButton(value) {\n  this._hasCloseButton\
    \ = value;\n  this.setAttribute(\"closebutton\", value);\n  this.toggleCloseButton(value);\n\
    }\n```\n\nsetter 调用 `toggleCloseButton()` 方法来更改按钮的可见性。该方法与基础组件的 shadow DOM 交互以管理按钮的可见性：\n\
    \n```\ntoggleCloseButton(visible) {\n  const closeButton = super.shadowRoot.getElementById(\"\
    closeButton\");\n  closeButton.style.display = (visible? \"block\": \"none\");\n\
    }\n```\n\n"
- fmt: "\nAs you can see, the visibility of the Close button changes based on the\
    \ boolean passed as a parameter. Notice the use of super to access the Shadow\
    \ DOM of the base class. Of course, this is possible because the cookie alert's\
    \ Shadow DOM has been defined as open.\n\nThen, we observe the `closebutton` attribute\
    \ and manage its value changes:\n\n```\nstatic get observedAttributes() {\n  \
    \  return [\"closebutton\"];\n}\n\nattributeChangedCallback(name, oldValue, newValue)\
    \ {\n    if (oldValue !== newValue) {\n        if (name == \"closebutton\") {\n\
    \            let isVisible = (newValue === \"true\" || newValue === \"\");\n \
    \           this._hasCloseButton = isVisible;\n            this.toggleCloseButton(isVisible);\n\
    \        }\n    }\n}\n```\n\nNotice how we deal with the value of the `closebutton`\
    \ attribute. It should be a boolean value. But we know that attribute values are\
    \ always strings. So we need to compare its value with the true string. Any different\
    \ value is interpreted as false. In addition, we want that no value for the attribute\
    \ equals to the true value. We will clarify this point in a minute when we will\
    \ see how to use this new component.\n\nThe `connectedCallback()` reaction invokes\
    \ the same method of its base class and sets the button visibility following the\
    \ value of the internal property `_hasCloseButton`:\n\n```\nconnectedCallback()\
    \ {\n    super.connectedCallback();\n    this.toggleCloseButton(this._hasCloseButton);\n\
    }\n```\n\nThe invocation of the `super.connectedCallback()` method is necessary\
    \ because this initializes the base component. If you don't invoke it, you are\
    \ overriding the initialization, so you will not get the UI of the base component\
    \ or will get it incomplete.\n\nThe last step, of course, is the registration\
    \ step of the `MyCookieAlert` Web Component:\n\n```\ncustomElements.define(\"\
    my-cookie-alert\", MyCookieAlert);\n```\n\nAs you can see, we define the `my-cookie-alert`\
    \ tag and bind it to the `MyCookieAlert` class. Now we are ready to use this new\
    \ Web Component.\n\n# [Using an extended Web Component](#toc.xhtml_s113a)\n\n\
    The following markup shows the very basic use of the `my-cookie-alert tag:`\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with Webpack Starter\
    \ Kit</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n\
    <script src=\"./bundle.js\"></script>\n</head>\n<body class=\"container\">\n<h1>Here\
    \ is your Web Component</h1>\n<my-cookie-alert></my-cookie-alert>\n</body>\n</html>\n\
    ```\n\nSince the default value of the `closeButton` attribute is false, we will\
    \ get the version of the cookie alert component without the `Close` button, as\
    \ shown by the following screenshot:\n\n![](images/Figure_8.1.jpg)\n\n**Figure\
    \ 8.1**\n\nIf you want the `Close` button to be shown, you should simply add the\
    \ `closebutton` attribute with the true value, as in the following example:\n\n\
    ```\n<my-cookie-alert closebutton=\"true\"></my-cookie-alert>\n```\n\nThis way,\
    \ you will get the usual cookie alert as you have known so far.\n\n![](images/Figure_8.2.jpg)\n\
    \n**Figure 8.2**\n\nIn the management of the `closebutton` attribute's value,\
    \ we stated that an empty string value has the same meaning of the true value.\
    \ This allows us to use the attribute as a toggle attribute, as it happens with\
    \ many native attributes like, for example, `enabled` or `checked`. So, you can\
    \ get the same result of assigning the true value to the `closebutton` attribute\
    \ in the following way:\n\n```\n<my-cookie-alert closebutton></my-cookie-alert>\n\
    ```\n\nTo complete the overview of this component, remember that the following\
    \ markup has the same meaning of using no `closebutton` attribute:\n\n```\n<my-cookie-alert\
    \ closebutton=\"false\"></my-cookie-alert>\n```\n\nAs usual, you can get the same\
    \ result seen so far by using the `hasCloseButton` property via JavaScript. For\
    \ example, the following code forces showing the Close button:\n\n```\nconst myCookieAlert\
    \ = document.querySelector(\"my-cookie-alert\");\nmyCookieAlert.hasCloseButton\
    \ = true;\n```\n\n# [Conclusion](#toc.xhtml_s114a)\n\nThis chapter showed you\
    \ how to prepare your Web Components in order to be shared with other developers.\
    \ We explored how to create modules that contain your code and how to distribute\
    \ them via script-based and package-based approaches.\n\nThese approaches can\
    \ be used in different development contexts. But regardless of the specific approach\
    \ to distribute your components, the users can create new components based on\
    \ yours. In fact, they can extend the class that defines your component to create\
    \ a personalized version of it.\n\nWith the notions you learned in this chapter,\
    \ you are now able to distribute your Web Components and to create new components\
    \ by extending existing ones.\n\nIn the next chapter, we will discuss how to use\
    \ Web Components within applications built with well-known JavaScript libraries\
    \ and frameworks like React, Angular, and Vue.\n\n# [Questions](#toc.xhtml_s115a)\n\
    \n1.  What are the main drawbacks of distributing your Web Component as a traditional\
    \ script?\n2.  What are the main benefits of applying a building step to your\
    \ code before distributing your component?\n3.  How can you overcome the drawbacks\
    \ of distributing your Web Component as a traditional script?\n4.  How can you\
    \ convert the code of your Web Component into a module?\n5.  How can you import\
    \ a module with the `<script>` tag?\n6.  Why you need a package for distributing\
    \ your Web Component?\n7.  What are the minimum `package.json` fields for publishing\
    \ your `npm package`?\n8.  How can you share your GitHub repository as an `npm`\
    \ `package`?\n9.  How can you install an `npm` package from a GitHub repository?\n\
    10.  How can you publish your `npm` package on the public npm registry?\n11. \
    \ How can you extend an existing Web Component?\n\n# [CHAPTER 9](#toc.xhtml_c09)\n\
    \n# [Web Components and Other UI Frameworks](#toc.xhtml_c09)\n\nThroughout this\
    \ book, you learned that the technologies that are behind Web Components allow\
    \ you to customize standard HTML elements and create custom HTML elements. When\
    \ we introduced them in *[Chapter 1, Getting Started with Web Components](#c01.xhtml),\
    \ we said that one of the main advantages of Web Components* is their interoperability.\
    \ That is the ability to work in an HTML page or web application regardless of\
    \ the library or framework you are using to build your UI. This is a great advantage\
    \ that allows you to create universal UI components and use them the same way\
    \ you are using HTML elements.\n\nIn this chapter, we are going to show a few\
    \ practical examples of how this interoperability between Web Components and UI\
    \ frameworks happens. We will see how to integrate them in *React, Angular*, and\
    \ Vue applications with very little effort. We will also take a look at some directions\
    \ on how to create web components by writing them in *Angular, Vue,* and *React*.\n\
    \n# [Structure](#toc.xhtml_s116a)\n\n*   Web Components integration\n*   Web Components\
    \ and React\n*   Web Components and Angular\n*   Web Components and Vue\n*   Building\
    \ Web Components with UI Frameworks\n\n# [Objectives](#toc.xhtml_s117a)\n\nThe\
    \ goal of this chapter is to demonstrate how to integrate Web Components in websites\
    \ and applications built with JavaScript UI frameworks.\n\nYou will learn how\
    \ to use your components in applications created with *React, Angular,* and *Vue*.\
    \ You also will discover how to wrap a component built with these frameworks in\
    \ a custom element.\n\n# [Web Components integration](#toc.xhtml_s118a)\n\nThe\
    \ HTML elements you build with Web Components technologies work as standard HTML\
    \ elements. This means that wherever you can use an HTML element, you can use\
    \ a Web Component. This possibility leads to an awesome feature - no matter the\
    \ library you are using for your web application or website, you can use your\
    \ web component everywhere. Interoperability is the amazing main advantage of\
    \ Web Components.\n"
