    # Slim 库


    Slim 库旨在通过减少你需要编写的代码量来简化 Web Components 的定义。它基于类的方式，但提供了略有不同的模型和生命周期事件。


    要开始使用 Slim 库，你需要使用以下命令进行安装：


    `npm install slim-js`


    # 基本架构


    与其他库一样，让我们从组件的基本定义开始实现 cookie 提醒组件：


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    "<div>Web Component</div>",

    class CookieAlert extends Slim {

    get useShadow() { return true }

    });

    ```


    从 `slim-js` 模块导入的 `Slim` 对象允许你完成创建 Web Component 所需的一切。它的 `tag()` 方法接受三个参数：


    * 与组件关联的标签名称。

    * 定义组件 UI 模板的标记。

    * 定义组件逻辑的类。


    如你所见，定义我们组件的 `CookieAlert` 类继承了该类。在这个基本示例中，你可能注意到我们添加了 `useShadow()` 获取器，它返回 true
    值。这个获取器使 Slim 能够为组件使用 Shadow DOM。实际上，默认情况下，基于 Slim 的组件不使用 Shadow DOM。


    该库还提供了一种基于装饰器的语法。在这种情况下，cookie 提醒组件基本架构的等效代码如下：


    ```

    import {Slim} from ''slim-js'';

    import {tag, template} from ''slim-js/Decorators'';


    @tag("cookie-alert")

    @template("<div>Web Component</div>")

    @useShadow(true)

    class CookieAlert extends Slim {

    }

    ```


    非常简单且紧凑！


    # 模板与 UI


    使用 `Slim` 创建组件的 UI 只需指定表示你想要使用的模板的字符串。例如，以下代码展示了如何为 cookie 提醒组件添加基本的 UI 标记：


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    .button {

    color: rgb(255, 255, 255);

    background-color: transparent;

    border-color: rgb(255, 255, 255);

    padding: 5px 40px;

    margin-right: 50px;

    cursor: pointer;

    float:right;

    }

    </style>

    <div class="container footer">

    <slot id="message" name="message"></slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button">Close</button>

    <button id= "acceptButton" class="button">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    get useShadow() { return true }

    });

    ```


    稍后我们会看到，这个模板允许你指定占位符。


    # 属性与特性


    在 `Slim` 中，组件属性就是类定义中的属性。如果你想初始化它，需要在构造函数中进行。以下代码展示了如何为 cookie 提醒组件实现 `message`
    属性：


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    //…

    </style>

    <div class="container footer">

    <slot id="message" name="message">{{message}}</slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button">Close</button>

    <button id= "acceptButton" class="button">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    constructor() {

    super();

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    get useShadow() { return true }

    });

    ```


    你可以看到，属性在构造函数中定义并初始化。注意构造函数中也调用了 `super()`。一旦定义了 `message` 属性，你就可以在 UI 模板中通过双花括号来使用它。


    然而，在这种情况下，`message` 属性并未绑定到 `message` 特性。要将属性映射到特性，你需要使用基于装饰器的语法，如下例所示：


    ```

    import {Slim} from ''slim-js'';

    import {tag, template, attribute} from ''slim-js/Decorators'';


    @tag("cookie-alert")

    @template("<div>Web Component</div>")

    @useShadow(true)

    class CookieAlert extends Slim {

    @attribute

    message

    }

    ```


    在这种情况下，你使用了与公共 `message` 属性关联的 `@attribute` 装饰器。


    **请注意，在撰写本文时，使用装饰器和属性定义的 JavaScript 语法尚未正式成为受支持的标准。要使用它们，你需要使用特定的转译器，如 TypeScript
    或经过适当配置的 Babel。**


    # 事件


    处理事件很容易。你可以将事件名称作为属性添加到模板中的 HTML 元素，并将你定义为类方法的事件监听器与之关联。为了更好地解释，请看以下代码：


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘<style>

    //…

    </style>

    <div class="container footer">

    <slot id="message" name="message">{{message}}</slot>&nbsp;

    <slot name="reference"></slot>

    <button id="closeButton" class="button" click="hide">Close</button>

    <button id= "acceptButton" class="button" click="accept">Accept</button>

    </div>‘,

    class CookieAlert extends Slim {

    constructor() {

    super();

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    get useShadow() { return true }

    hide() {

    this.style.visibility = "hidden";

    }

    accept() {

    this.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.dispatchEvent(new CustomEvent("accepted", {

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    }));

    }

    });

    ```


    这里，关闭和接受按钮具有 `click` 属性。每个属性都分配了一个字符串：`hide` 和 `accept`。这些是你附加到 `CookieAlert`
    类的方法名称。这些方法是 click 事件的事件监听器。


    还要注意，生成自定义事件的机制保持不变。


    # 生命周期


    为了完成我们的实现，我们需要在显示提醒之前检查用户是否已接受 cookie 政策。我们知道，这意味着我们需要检查接受 cookie 是否已设置。为了确保在渲染消息之前进行检查，我们必须在
    `BeforeCreated` 生命周期事件中执行此操作，如下所示：


    ```

    import {Slim} from ''slim-js'';


    Slim.tag(

    "cookie-alert",

    ‘

    //…

    ‘,

    class CookieAlert extends Slim {

    onBeforeCreated() {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    this.style.visibility = "hidden";

    }

    this.message = "This website uses cookies to ensure you get the best experience";

    }

    //…

    });

    ```


    当 `BeforeCreated` 事件发生时，会调用 `onBeforeCreated()` 方法。`Slim` 为其组件生成几个生命周期事件。要管理它们，你应该实现以下方法：


    * `onBeforeCreated()`：此方法在组件创建之前执行。


