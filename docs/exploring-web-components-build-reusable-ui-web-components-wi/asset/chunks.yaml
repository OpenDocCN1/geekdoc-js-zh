    This decorator marks the class as the Web Component definition, similar to what
    Angular does with its components.


    The options passed to the decorator configure the component. In particular, the
    tag option defines the tag name associated with the component. The `styleUrl`
    option indicates the file containing the CSS rules for the component. The shadow
    option states if the Shadow DOM is enabled (true) or not (false). By default,
    the Shadow DOM is not enabled, so in our cookie component, we explicitly enabled
    it.


