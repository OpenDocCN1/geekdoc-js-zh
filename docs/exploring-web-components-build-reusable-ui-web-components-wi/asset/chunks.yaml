  trans: "\n\n在上一节描述的示例中，我们将自定义元素命名为 `secure-link`。名称中包含连字符并非偶然。实际上，根据规范，自定义元素的名称必须包含一个连字符。因此，`securelink`\
    \ 不是有效名称，而 `secure-link` 是有效的。\n\n这种技巧让 HTML 解析器能够区分常规元素和自定义元素，并避免与未来新增的标准标签产生冲突。然而，即使包含至少一个连字符的名称对自定义元素来说是合法的，你也不能使用以下任何名称：\n\
    \n*   `annotation-xml`\n*   `color-profile`\n*   `font-face`\n*   `font-face-src`\n\
    *   `font-face-uri`\n*   `font-face-format`\n*   `font-face-name`\n*   `missing-glyph`\n\
    \n这些是 SVG 和 MathML 的保留名称。\n\n自定义元素名称中必须包含连字符的要求，让你有机会以某种命名空间的方式命名元素，并避免与第三方创建的自定义元素冲突。即使这不是强制要求，你也应该考虑为自定义元素名称添加一个希望唯一的**前缀**。例如，如果你正在构建自己的自定义元素库，并希望将其命名为\
    \ foo，你可以使用 `foo-` 前缀来命名元素。这样你就可以得到像 `foo-input`、`foo-link`、`foo-image` 等名称。\n\
    \n# 使用基于原生元素的自定义元素\n\n现在，你已经有了自己的 `secure-link` Web 组件，并希望在 Web 应用程序中使用它。你有几种使用方式，主要取决于你正在构建的应用程序或网站的类型。让我们看看两种常见的方式：在\
    \ HTML 页面中包含，或在 JavaScript 模块中导入。\n\n# 在 HTML 页面中包含\n\n在你的网站中使用组件的最简单方法是将 JavaScript\
    \ 脚本包含在 HTML 页面中，如下所示：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<script src=\"secureLink.js\"></script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n然后，要使用你的组件，你需要在 HTML 页面的 body 中添加以下代码：\n\n```\n<a is=\"\
    secure-link\" href=\"http://www.wikipedia.org\">Wikipedia</a>\n```\n\n如你所见，这里我们使用\
    \ Web 组件的方式与第一章中介绍的 `my-rating` 组件不同。在 `my-rating` 组件的情况下，我们将该名称用作标签，而这里我们将组件名称用作\
    \ `<a>` HTML 元素的 `is` 属性的值。这是从标记角度区分自主自定义元素和自定义原生元素的宏观差异。这里我们要表达的是，我们的元素是一个 `<a>`\
    \ HTML 元素，并附加了 `secure-link` 扩展提供的额外功能。在下一节中，我们将更深入地讨论这种方法背后的原因，以及使用自定义原生元素的好处。现在，我们先记下这一点，看看新页面的效果，其完整代码如下所示：\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n\
    <script src=\"secureLink.js\"></script>\n</head>\n<body>\n<a is=\"secure-link\"\
    \ href=\"http://www.wikipedia.org\">Wikipedia</a>\n</body>\n</html>\n```\n\n现在，用浏览器打开该页面。你应该会看到一个空白页面，其中包含一个指向\
    \ Wikipedia 网站的链接。点击该链接，你应该会看到一个警告窗口，提示你即将导航到一个不安全的网站，如下图所示：\n\n![](img/Figure_2.3.jpg)\n\
    \n**图 2.3**\n\n只有当你同意导航到该链接时，浏览器才会加载 Wikipedia 的主页。如果你不同意，你将按预期停留在当前页面。\n\n现在，你拥有了标准\
    \ `<a>` HTML 元素的自定义版本。\n\n如果你回顾一下自定义元素的实现，你会发现它在处理安全需求的方式上还有改进空间。当然，你说得对，但这并不是实现的重点。这里我们只是专注于如何通过扩展原生元素来创建自己的自定义元素。\n\
    \n# 在 JavaScript 模块中导入\n\n到目前为止，我们展示了一种非常简单的方法，将代码包含在 HTML 页面中并使用自定义元素。但你可能遇到不同的场景，比如当你拥有构建环境，或者正在构建一个复合\
    \ Web 组件时（我们将在后续章节中讨论）。在这些场景中，你可能正在使用 JavaScript 模块，并且希望导入一个 Web 组件，而无需在 HTML\
    \ 页面中显式添加脚本。\n\n为了更好地解释如何处理这些场景，让我们考虑典型的**单页应用程序（SPA）**场景，其中几乎所有 UI 都是由 JavaScript\
    \ 代码动态构建的。在这种上下文中，通常你只有一个 HTML 页面，引用一个负责加载应用程序其余部分（可能按需加载）的 JavaScript 文件。\n\n\
    为了使这个场景更具体，请克隆并初始化我们之前提到的 Web Components Builder 项目，然后开始一个新项目。现在，将根文件夹中 HTML 页面的内容替换为以下标记：\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with Webpack Starter\
    \ Kit</title>\n<script src=\"./bundle.js\"></script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n如你所见，这是一个空的 HTML 页面，只有一个对 `bundle.js` 文件的脚本引用。这个 `bundle.js` 文件将是对\
    \ `src` 文件夹内容进行构建过程的结果。\n\n现在，将上一节创建的 `secureLink.js` 文件（包含原生自定义元素实现）添加到 `src`\
    \ 文件夹中。最后，将 `index.js` 文件的内容替换为以下代码：\n\n```\nimport \"./secureLink\";\n\nwindow.onload\
    \ = function() {\n  const secureLink = document.createElement(\"a\", {is:\"secure-link\"\
    });\n  secureLink.setAttribute(\"href\", \"http://www.wikipedia.org\");\n  secureLink.innerText\
    \ = \"Wikipedia\";\n  document.body.appendChild(secureLink);\n};\n```\n\n让我们看看这段代码在做什么。\n\
    \n第一行导入了我们的 `secure-link` 组件。如你所见，这是一个带有副作用的简单导入。这意味着通过导入 `secureLink.js` 文件，整个代码将被执行，而无需将任何结果显式绑定到任何变量或常量。因此，在这一行之后，`secure-link`\
    \ 组件已注册并可用，无需在 HTML 页面中添加 `<script>` 标签。\n\n然后，你为当前窗口浏览器的 `onload` 事件绑定了一个监听器。这意味着当\
    \ HTML 页面在窗口浏览器中加载时，该函数将创建 `secure-link` 组件的一个实例，对其进行配置，并将其附加到 HTML 页面的 body 中。\n\
    \n让我们重点看一下 `secure-link` 组件实例是如何创建的。示例中使用的语句如下：\n\n```\nconst secureLink = document.createElement(\"\
    a\", {is:\"secure-link\"});\n```\n\n我们使用了 document 对象的典型 `createElement()` 方法，并指定了要创建元素的标签名称。然而，与通常的方式不同，我们动态创建了一个\
    \ HTML 元素；在这种情况下，我们添加了第二个参数。这个参数是一个对象，指定了我们想要创建的 `<a>` 元素是由 `secure-link` 定义自定义的。这使我们能够获得\
    \ Web 组件的一个实例。\n\n**某些浏览器允许你将字符串作为** `createElement()` **方法的第二个参数。这是为了向后兼容旧版本的自定义元素规范。**\n\
    \n**这种方法已被弃用，因此请使用基于对象的方法。**\n\n"
- fmt: "\nNow, run your component by opening a terminal window, moving in the root\
    \ of the project, and typing the `npm start` command. If you open your browser\
    \ and point it to `http://localhost:8080`, you should see again the same result\
    \ as before: a link to Wikipedia's home page that warns you about security when\
    \ you click it.\n\n# [Defining function-based Custom Elements](#toc.xhtml_s27a)\n\
    \nWe defined our Custom Element by using the class syntax introduced by the ECMAScript\
    \ 2015 specifications. As a JavaScript developer, you know that classes are syntactic\
    \ sugar for constructor functions and prototypes. So, you may be wondering if\
    \ you can use functions in order to define Custom Elements instead of the class-based\
    \ syntax.\n\nThe answer is affirmative, but with a few caveats. The following\
    \ code is the equivalent one for the `secure-link` element we defined before:\n\
    \n```\nfunction SecureLink() {\n\nreturn Reflect.construct(HTMLAnchorElement,\
    \ [], this.constructor);\n\n}\n\nSecureLink.prototype = Object.create(HTMLAnchorElement.prototype);\n\
    \nSecureLink.prototype.constructor = SecureLink;\n\nObject.setPrototypeOf(SecureLink,\
    \ HTMLAnchorElement);\n\nSecureLink.prototype.connectedCallback = function() {\n\
    \nthis.addEventListener(\"click\", (e) => {\n\nif (!this.href.startsWith(\"https\"\
    )) {\n\nif (!confirm(\"You are about to navigate to an unsafe site. Do you want\
    \ to continue?\")) {\n\ne.preventDefault();\n\n}\n\n}\n\n});\n\n}\n\ncustomElements.define(\"\
    secure-link\", SecureLink, {extends: \"a\"});\n```\n\nAs you can see, we define\
    \ the `SecureLink()` function, assign to its prototype all that is needed to inherit\
    \ from `HTMLAnchorElement` and attach the `connectedCallback()` method. The code\
    \ is a bit more verbose than the class-based one. But this is not the only attention\
    \ point. What you should notice is how the `SecureLink()` function defines its\
    \ inheritance from `HTMLAnchorElement`:\n\n```\nfunction SecureLink() {\n\nreturn\
    \ Reflect.construct(HTMLAnchorElement, [], this.constructor);\n\n}\n```\n\nUsually,\
    \ you use the `apply()` method of the super class or parent object. In this case,\
    \ you are using the `construct()` method of the `Reflect` object. This fact binds\
    \ the definition of a Custom Element to ECMAScript 2015 features since the `Reflect`\
    \ object has been introduced with that specifications. So, if you think to use\
    \ the function-based approach to define your Custom Element in order to be compatible\
    \ with older versions of JavaScript engines, you're wrong. You need a polyfill\
    \ anyway, at least for the `Reflect` object.\n\n**As a general suggestion, even\
    \ if you can define your Custom Elements by using a function-based definition,\
    \ this approach is discouraged in favor of the class-based syntax.**\n\n# [Benefits\
    \ of extending native elements](#toc.xhtml_s28a)\n\nCreating Custom Elements by\
    \ extending native elements should be the primary approach when you are creating\
    \ your Web Components. In fact, this approach provides you with a few benefits:\n\
    \n*   **Compatibility with older browsers**: Browsers that don't support Web Component\
    \ technologies can continue to access the basic features of your component. Consider,\
    \ for example, the `secure-link` component we created in this chapter and its\
    \ use in an HTML page:\n\n    `<a is=\"secure-link\" href=\"http://www.wikipedia.org\"\
    >Wikipedia</a>`\n\n    If a browser is not able to interpret the is attribute,\
    \ it will be ignored. So, you will not have the security check on the link, but\
    \ the component still continues to work, just a common link.\n\n*   **Usability\
    \ with disabled JavaScript**: Of course, you will get the same conservative behavior\
    \ as in the previous point when the user has disabled JavaScript in their browser.\
    \ You still continue to have a normal link without the extended features.\n\n\
    *   **Simple to code:** Extending a native element, usually, requires a few lines\
    \ of code. You need to implement just the functionalities you want to add to the\
    \ native element, but you will have its standard behavior for free. This is different\
    \ from the implementation of Autonomous Custom Elements, as we will see in the\
    \ following chapter.\n\nIn light of these benefits, when you are about to create\
    \ your own Web Component, you should always ask yourself if it can be implemented\
    \ as an extension of a native element. When possible, it should be the first option.\n\
    \n# [Conclusion](#toc.xhtml_s29a)\n\nIn this chapter, we started exploring the\
    \ way we can build our own Web Components. We discussed the options to set up\
    \ your development environment and presented a template project for the building-based\
    \ approach. Then, we introduced Custom Elements and focussed on extending native\
    \ HTML elements. We also discussed the ways you can use this component in your\
    \ development environments and the benefits you have in customizing native HTML\
    \ elements.\n\nAfter reading this chapter, you are able to decide what is the\
    \ development environment more suitable for creating your own Web Components.\
    \ You are also able to customize native HTML elements and know how to name them\
    \ correctly. In addition, you learned how to use your Web Component both in a\
    \ development environment with and without a building process. Finally, you are\
    \ now aware of the benefits that extending native HTML elements brings to you\
    \ when you choose this approach to build your components.\n\nIn the next chapter,\
    \ we will discuss when and how to create Autonomous Custom Elements, by also exploring\
    \ some new features that are in common with the Customized Native Elements.\n\n\
    # [Questions](#toc.xhtml_s30a)\n\n1.  What benefits the building process brings\
    \ in a development environment?\n\n2.  What are Custom Elements?\n\n3.  What is\
    \ the difference between Customized Native Elements and Autonomous Custom Elements?\n\
    \n4.  What is the role of the `customElements.define()` method?\n\n5.  What are\
    \ the restrictions on naming your Customized Native Element?\n\n6.  How can you\
    \ use your Customized Native Element in the markup of your HTML page?\n\n7.  How\
    \ can you make available your Customized Native Element in a development environment\
    \ with the building process?\n\n8.  What are the benefits of implementing your\
    \ Web Components as Customized Native Elements?\n\n# [CHAPTER 3](#toc.xhtml_c03)\n\
    \n# [Creating Custom Web Components](#toc.xhtml_c03)\n\nIn the previous chapter,\
    \ we learned how to customize standard HTML elements. In this chapter, we will\
    \ go a step further in order to create Web Components not strictly based on well-known\
    \ HTML elements. This kind of Web Component, known as **autonomous custom elements,**\
    \ will let you build completely new components whose behavior is left to your\
    \ imagination. As usual, you will learn how to create this type of component by\
    \ starting to build a specific autonomous custom element. In this chapter, you\
    \ will set up the basics of the component, and we will complete it throughout\
    \ the rest of the book.\n\n# [Structure](#toc.xhtml_s31a)\n\n*   Creating a Web\
    \ Component from scratch\n\n*   Basic techniques to add CSS and markup\n\n*  \
    \ The lifecycle of a Web Component\n\n*   Using a custom Web Component\n\n# [Objectives](#toc.xhtml_s32a)\n\
    \nThis chapter will teach you what an **autonomous custom element** is and what\
    \ is the difference with the **customized native elements.** You will learn how\
    \ to set up a simple component and how to use some basic techniques to create\
    \ its UI with markup and CSS. Also, you will learn some concepts about the lifecycle\
    \ of Web Components and how to leverage them to handle the life of your component.\
    \ You will learn at which steps of your component’s life you are allowed to make\
    \ some operations and when you can’t. Finally, you will discover how you and other\
    \ developers can use your component in their web page or in their web application.\n\
    \n# [Creating a Web Component from scratch](#toc.xhtml_s33a)\n\nFrom the previous\
    \ chapter, you already know how to build your own Web Component by extending a\
    \ native HTML element. You learned how simple it is to change the behavior of\
    \ an existing standard HTML element in order to adapt it to your needs.\n"
