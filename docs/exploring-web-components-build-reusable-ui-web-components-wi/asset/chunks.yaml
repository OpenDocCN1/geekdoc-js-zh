  trans: "\n\n与使用 *React、Angular、Vue* 等框架创建的组件不同，Web 组件并不绑定于特定的库或框架。例如，如果你用 React\
    \ 创建了一个 UI 组件，那么该组件只能在基于 React 的应用中使用。而 Web 组件可以轻松集成到几乎任何 UI 库构建的应用中。这让你无需为不同的组件库重复实现相同的组件，我们稍后会看到这一点。\n\
    \n**库和框架是不同的概念。库是一组专注于特定编程功能的函数，应用可以调用它们。框架则是一组支持应用开发不同方面的函数。尽管存在这些差异，我们在此将互换地讨论库和框架。**\n\
    \n在深入 Web 组件集成的细节之前，请记住：Web 组件并不是另一个 UI 框架——它们是原生的 UI 框架。Web 组件并非现有 UI 框架的替代品——它们可以共存。你无需切换到\
    \ Web 组件并放弃你的 UI 框架。你可以根据需要将它们引入你的应用。Web 组件与框架无关——它们可以集成到任何框架中。一次编写，随处使用。\n\n\
    为了实际演示如何在基于 UI JavaScript 框架构建的应用中使用 Web 组件，我们将把前几章创建的 cookie 提醒组件集成到基于 *React、Angular*\
    \ 和 *Vue* 的应用中。\n\n**在接下来的章节中，我们假设你熟悉 React、Angular 或 Vue。如果不熟悉，请参考官方文档以获取有关这些框架的更多信息。**\n\
    \n# Web 组件与 React\n\n让我们开始看看如何在简单的 React 应用中使用我们的 cookie 演示组件。我们将使用 `create-react-app`\
    \ 工具创建一个基础应用。因此，在终端窗口中输入以下命令：\n\n`npx create-react-app react-app-cookie-alert`\n\
    \n该命令将在 `react-app-cookie-alert` 文件夹中创建一个简单但可运行的 React 应用。几秒钟后，应用即可运行。为了让我们的 cookie\
    \ 提醒组件对应用可用，你需要安装它。因此，切换到 `react-app-cookie-alert` 文件夹并输入以下命令：\n\n`npm install\
    \ andychiare/cookie-alert-demo`\n\n如前一章所述，这会直接从组件的 GitHub 仓库安装 `cookie-alert-demo`\
    \ 包。现在，要在 React 应用中导入并使用该组件，请编辑 `src/App.js` 文件并将其内容修改如下：\n\n```\nimport React\
    \ from 'react';\nimport logo from './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\
    \nfunction App() {\n  return (\n    <div className=\"App\">\n      <header className=\"\
    App-header\">\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n\
    \        <p>\n          Edit <code>src/App.js</code> and save to reload.\n   \
    \     </p>\n        <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
    \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n       \
    \ >\n          Learn React\n        </a>\n      </header>\n      <cookie-alert></cookie-alert>\n\
    \    </div>\n  );\n}\n\nexport default App;\n```\n\n上面高亮显示了添加到现有代码中的新代码。你导入了 cookie\
    \ 提醒模块，并在 `App` 组件返回的 JSX 代码中添加了 `<cookie-alert>` 标签。仅此而已！\n\n你就像使用任何标准 HTML 组件一样使用\
    \ Web 组件。要查看生成的 UI，请运行 `npm start` 命令，并将浏览器指向 `http://localhost:3000` 地址。你将看到如下页面：\n\
    \n![](img/Figure_9.1.jpg)\n\n**图 9.1**\n\n如你所见，cookie 提醒出现在页面底部，与标准 HTML 页面中的情况相同，并且按预期工作。\n\
    \n当然，你可能希望在 React 应用中自定义 cookie 提醒。例如，你可能想更改默认消息。你可以通过将新的 `message` 字符串赋值给组件的\
    \ `message` 属性来实现，就像在任何 HTML 页面中一样。但是，你的消息可能是在运行时创建的，你可能想知道如何将此值赋给属性。以下代码展示了如何将常量值赋给\
    \ `message` 属性：\n\n```\nimport React from 'react';\nimport logo from './logo.svg';\n\
    import './App.css';\nimport 'cookie-alert-demo';\n\nfunction App() {\n  const\
    \ message = \"We use cookies, but respect your privacy!\";\n  return (\n    <div\
    \ className=\"App\">\n      <header className=\"App-header\">\n        <img src={logo}\
    \ className=\"App-logo\" alt=\"logo\" />\n        <p>\n          Edit <code>src/App.js</code>\
    \ and save to reload.\n        </p>\n        <a\n          className=\"App-link\"\
    \n          href=\"https://reactjs.org\"\n          target=\"_blank\"\n      \
    \    rel=\"noopener noreferrer\"\n        >\n          Learn React\n        </a>\n\
    \      </header>\n      <cookie-alert message={message}></cookie-alert>\n    </div>\n\
    \  );\n}\n\nexport default App;\n```\n\n你将包含 `message` 常量的表达式赋值给了同名的属性，就像在 React\
    \ 中赋值任何 `prop` 一样。当然，你可以将任何返回字符串的有效表达式赋值给 cookie 提醒组件的 `message` 属性。\n\n如果你想通过\
    \ JavaScript 访问 `message` 属性来自定义 cookie 提醒组件，则需要编写更多代码。你需要使用 `refs` 来访问该组件。\n\n\
    **在 React 中，refs 提供了一种机制来访问由组件的 `render()` 方法生成的 DOM 节点或 React 元素。它们代表了一种在特定情况下（比如我们正在讨论的情况）使用的变通方法。**\n\
    \n查看以下代码，了解如何通过 `ref` 访问 `message` 属性：\n\n```\nimport React, {useRef, useEffect}\
    \ from 'react';\nimport logo from './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\
    \nfunction App() {\n  const cookieAlert = useRef(null);\n  useEffect(() => {\n\
    \    cookieAlert.current.message = \"We use cookies, but respect your privacy!\"\
    ;\n  });\n  return (\n    <div className=\"App\">\n      <header className=\"\
    App-header\">\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n\
    \        <p>\n          Edit <code>src/App.js</code> and save to reload.\n   \
    \     </p>\n        <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
    \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n       \
    \ >\n          Learn React\n        </a>\n      </header>\n      <cookie-alert\
    \ ref={cookieAlert}></cookie-alert>\n    </div>\n  );\n}\n\nexport default App;\n\
    ```\n\n你导入了 `useRef()` 和 `useEffect()` 钩子。然后，使用 `useRef()` 钩子创建了 `cookieAlert`\
    \ ref，并在使用 `useEffect()` 钩子定义的效果中使用了这个 ref。在标记中，你注意到我们为 cookie 提醒组件添加了 `ref` 属性，并赋值为之前创建的\
    \ `cookieAlert` ref。\n\n最后，上面创建的效果通过 `cookieAlert` ref 的 `current` 属性访问 cookie\
    \ 提醒组件。此时，我们可以将要显示的字符串赋值给 `message` 属性。\n\n你可以采用相同的方法来处理 cookie 提醒组件生成的事件。以下代码展示了如何为\
    \ `accepted` 事件添加事件处理程序：\n\n```\nuseEffect(() => {\n  cookieAlert.current.message\
    \ = \"We use cookies, but respect your privacy!\";\n  cookieAlert.current.addEventListener(\"\
    accepted\", () => alert(\"Thanks for accepting our cookie policy!\"));\n});\n\
    ```\n\n如你所见，你在之前创建的效果中添加了事件监听器。\n\n"
- fmt: "\nEven if using Web Components within a React application is possible, you\
    \ cannot expect that they follow the declarative programming model of this popular\
    \ library. Web Components use the typical approach of DOM programming, which is\
    \ typically imperative. So, when using Web Components in your React application,\
    \ you shouldn’t expect that they work as React components. For example, events\
    \ generated by Web Components may not properly propagate in a React component\
    \ structure. Also, the typical reactiveness of React components is not guaranteed.\n\
    \nAlso, React wraps a standard HTML element with a component to get an integrated\
    \ behavior in its ecosystem. If you want to get the same result, you should wrap\
    \ your web component with a React component on your own, as we will see later\
    \ on.\n\n# [Web Components and Angular](#toc.xhtml_s120a)\n\nUsing a web component\
    \ in an Angular application requires an approach similar to the one we saw for\
    \ React. However, here there are a few specific steps. So, let’s see how it works\
    \ by building an Angular sample application and using our cookie alert component.\n\
    \nAs for React, also with Angular, we are going to use a tool that helps us to\
    \ set up a simple application quickly. We are going to use Angular CLI, so make\
    \ sure you have it installed, and otherwise install it with the following command:\n\
    \n`npm install -g @angular/cli`\n\nOnce you installed the CLI, create a minimal\
    \ Angular application by running the following command:\n\n`ng new angular-app-cookie-alert\
    \ --minimal --routing=false --style=css`\n\nThis command creates a very minimal\
    \ application in the `angular-app-cookie-alert` folder. Even if it is minimal,\
    \ it is enough for our demonstration.\n\nMove to the `angular-app-cookie-alert`\
    \ folder and type the following command to install our cookie alert component:\n\
    \n`npm install andychiare/cookie-alert-demo`\n\nAt this point, you should be aware\
    \ of one issue. Our cookie alert component is written in JavaScript, while the\
    \ default language of the Angular application is TypeScript. So, to avoid errors,\
    \ you should add the `\"allowJs\"` setting as a TypeScript compiler option in\
    \ the `tsconfig.json` configuration file. Your `tsconfig.json` file should be\
    \ similar to the following:\n\n```\n{\n  \"compileOnSave\": false,\n  \"compilerOptions\"\
    : {\n    \"allowJs\": true,\n    \"baseUrl\": \"./\",\n    …other options…\n \
    \ },\n  \"angularCompilerOptions\": {\n    …other options…\n  }\n}\n```\n\nBefore\
    \ using our web component in the Angular application, you need to make another\
    \ little adjustment. In fact, by default, Angular will attempt to interpret any\
    \ non-standard HTML element as an Angular component. So, it will throw an error\
    \ when it finds the `<cookie-alert>` tag. To avoid this, you need to enable custom\
    \ elements.\n\nFor this purpose, open the `src/app/app.module.ts` file and change\
    \ its content as follows:\n\n```\nimport { BrowserModule } from '@angular/platform-browser';\n\
    import { NgModule, CUSTOM_ELEMENTS_SCHEMA } from '@angular/core';\nimport { AppComponent\
    \ } from './app.component';\n\n@NgModule({\n  declarations: [\n    AppComponent\n\
    \  ],\n  imports: [\n    BrowserModule\n  ],\n  schemas: [CUSTOM_ELEMENTS_SCHEMA],\n\
    \  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n\
    ```\n\nFollowing the highlighted items, you import the `CUSTOM_ELEMENTS_SCHEMA`\
    \ module and configure it as the reference schema for the application.\n\nNow\
    \ we are ready to use our web component in this application.\n\nLet’s start to\
    \ see how to use the cookie alert component in the template of the `AppComponent`\
    \ component. Edit the `src/app/app.component.ts` file changing its content as\
    \ follows:\n\n```\nimport { Component } from '@angular/core';\nimport 'cookie-alert-demo';\n\
    \n@Component({\n  selector: 'app-root',\n  template: `\n    <!--The content below\
    \ is only a placeholder and can be replaced.-->\n    <div style=\"text-align:center\"\
    \ class=\"content\">\n      <h1>\n        Welcome to {{title}}!\n      </h1>\n\
    \      …\n    </div>\n    <h2>Here are some links to help you start: </h2>\n \
    \   <ul>\n      …\n    </ul>\n    <cookie-alert></cookie-alert>\n  `,\n  styles:\
    \ []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n\
    }\n```\n\nIn this simple first step, you imported the `cookie-alert-demo` module\
    \ and used the `<cookie-alert>` tag in the template of the Angular `Component`.\
    \ As in the React case, also here you are using the cookie alert component like\
    \ it is a standard HTML element.\n\nTo see the component in action, run `ng serve`\
    \ in a terminal window and point your browser to the `http://localhost:4200` address.\
    \ You should see a page like the following:\n\n![](images/Figure_9.2.jpg)\n\n\
    **Figure 9.2**\n\nAs expected, the alert appears at the bottom of the page and\
    \ works as usual.\n\nAs we did with React, let’s take a look at how to customize\
    \ the alert message by using different approaches. Assigning a value to the `message`\
    \ attribute is the easiest way. This code shows how to apply this basic approach:\n\
    \n```\nimport { Component } from '@angular/core';\nimport 'cookie-alert-demo';\n\
    \n@Component({\n  selector: 'app-root',\n  template: `\n    //…\n    <cookie-alert\
    \ message=\"We use cookies, but respect your privacy!\"></cookie-alert>\n  `,\n\
    \  styles: []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n\
    }\n```\n\nNothing special, as you can see. But what if you want to assign a computed\
    \ value as the text to show in the alert? Consider the following example:\n\n\
    ```\nimport { Component } from '@angular/core';\nimport 'cookie-alert-demo';\n\
    \n@Component({\n  selector: 'app-root',\n  template: `\n    //…\n    <cookie-alert\
    \ [message]=\"cookieMessage\"></cookie-alert>\n  `,\n  styles: []\n})\nexport\
    \ class AppComponent {\n  title = 'angular-app-cookie-alert';\n  cookieMessage\
    \ = 'We use cookies, but respect your privacy!';\n}\n```\n\nHere, you create a\
    \ `cookieMessage` property for the `AppComponent` component and assign your text.\
    \ Then, you map this `cookieMessage` property to the `message` property of the\
    \ cookie alert component in the template’s markup. Notice how you are seamlessly\
    \ using the Angular binding syntax.\n\nTo handle events generated by the web component,\
    \ take a look at the following code:\n\n```\nimport { Component } from '@angular/core';\n\
    import 'cookie-alert-demo';\n\n@Component({\n  selector: 'app-root',\n  template:\
    \ `\n    //…\n    <cookie-alert\n      [message]=\"cookieMessage\"\n      (accepted)=\"\
    showThanks()\">\n    </cookie-alert>\n  `,\n  styles: []\n})\nexport class AppComponent\
    \ {\n  title = 'angular-app-cookie-alert';\n  cookieMessage = 'We use cookies,\
    \ but respect your privacy!';\n  showThanks() {\n    alert(\"Thanks for accepting\
    \ our cookie policy!\");\n  }\n}\n```\n\nYou define the `showThanks()` method\
    \ for the `AppComponent` component and assign it to the `accepted` event. Notice\
    \ how even in this case, you are using the Angular binding syntax as usual.\n\n\
    Remember that, if you need to access the event’s details, you can use the `$event`\
    \ object in the `showThanks()` method as in the ordinary Angular way.\n\nYou need\
    \ to pay attention when using web components that are meant to be used in Angular\
    \ forms. Consider, for example, the case where you have a custom input element\
    \ created as a web component and you want to use it in a form, like in the following\
    \ example:\n\n```\n<form [formGroup]=\"form\" (ngSubmit)=\"send()\">\n  <custom-input\n\
    \    type=\"text\"\n    label=\"Enter your data\">\n  </custom-input>\n  <input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n```\n\nIn this example, we are using\
    \ the fictitious `<custom-input>` web component within an Angular form. By default,\
    \ Angular enriches a standard HTML `input` element to enable it to interact with\
    \ its forms API. Angular forms look for a `value accessor` in its child elements,\
    \ that is, a feature that allows you to access the control’s value. A `value accessor`\
    \ is a directive implementing the `ControlValueAccessor` interface and allows\
    \ a native HTML element to communicate with the Angular form. For this reason,\
    \ Angular manipulates the standard HTML elements by attaching this `value accessor`.\n"
  raw: 'Even if using Web Components within a React application is possible, you cannot
    expect that they follow the declarative programming model of this popular library.
    Web Components use the typical approach of DOM programming, which is typically
    imperative. So, when using Web Components in your React application, you shouldn’t
    expect that they work as React components. For example, events generated by Web
    Components may not properly propagate in a React component structure. Also, the
    typical reactiveness of React components is not guaranteed.


    Also, React wraps a standard HTML element with a component to get an integrated
    behavior in its ecosystem. If you want to get the same result, you should wrap
    your web component with a React component on your own, as we will see later on.


    # [Web Components and Angular](#toc.xhtml_s120a)


    Using a web component in an Angular application requires an approach similar to
    the one we saw for React. However, here there are a few specific steps. So, let’s
    see how it works by building an Angular sample application and using our cookie
    alert component.


    As for React, also with Angular, we are going to use a tool that helps us to set
    up a simple application quickly. We are going to use Angular CLI, so make sure
    you have it installed, and otherwise install it with the following command:


    `npm install -g @angular/cli`


    Once you installed the CLI, create a minimal Angular application by running the
    following command:


    `ng new angular-app-cookie-alert --minimal --routing=false --style=css`


    This command creates a very minimal application in the `angular-app-cookie-`alert
    folder. Even if it is minimal, it is enough for our demonstration.


    Move to the `angular-app-cookie-alert` folder and type the following command to
    install our cookie alert component:


    `npm install andychiare/cookie-alert-demo`


    At this point, you should be aware of one issue. Our cookie alert component is
    written in JavaScript, while the default language of the Angular application is
    TypeScript. So, to avoid errors, you should add the "`allowJs`": true setting
    as a TypeScript compiler option in the `tsconfig.json` configuration file. Your
    `tsconfig.json` file should be similar to the following:


    `{`


    `"compileOnSave": false,`


    `"compilerOptions": {`


    `"allowJs": true,`


    `"baseUrl": "./",`


    `…other options…`


    `},`


    `"angularCompilerOptions": {`


    `…other options…`


    `}`


    `}`


    Before using our web component in the Angular application, you need to make another
    little adjustment. In fact, by default, Angular will attempt to interpret any
    non-standard HTML element as an Angular component. So, it will throw an error
    when it finds the `<cookie-alert>` tag. To avoid this, you need to enable custom
    elements.


    For this purpose, open the `src/app/app.module.ts` file and change its content
    as follows:


    `import { BrowserModule } from ''@angular/platform-browser'';`


    `import { NgModule, CUSTOM_ELEMENTS_SCHEMA } from ''@angular/core'';`


    `import { AppComponent } from ''./app.component'';`


    `@NgModule({`


    `declarations: [`


    `AppComponent`


    `],`


    `imports: [`


    `BrowserModule`


    `],`


    `schemas: [CUSTOM_ELEMENTS_SCHEMA],`


    `providers: [],`


    `bootstrap: [AppComponent]`


    `})`


    `export class AppModule { }`


    Following the highlighted items, you import the `CUSTOM_ELEMENTS_SCHEMA` module
    and configure it as the reference schema for the application.


    Now we are ready to use our web component in this application.


    Let’s start to see how to use the cookie alert component in the template of the
    `AppComponent` component. Edit the `src/app/app.component.`ts file changing its
    content as follows:


    `import { Component } from ''@angular/core'';`


    `import ''cookie-alert-demo'';`


    `@Component({`


    `selector: ''app-root'',`


    `template: ‘`


    `<!--The content below is only a placeholder and can be replaced.-->`


    `<div style="text-align:center" class="content">`


    `<h1>`


    `Welcome to {{title}}!`


    `</h1>`


    `…`


    `</div>`


    `<h2>Here are some links to help you start: </h2>`


    `<ul>`


    `…`


    `</ul>`


    `<cookie-alert></cookie-alert>`


    `‘,`


    `styles: []`


    `})`


    `export class AppComponent {`


    `title = ''angular-app-cookie-alert'';`


    `}`


    In this simple first step, you imported the `cookie-alert-demo` module and used
    the `<cookie-alert>` tag in the template of the Angular `Component`. As in the
    React case, also here you are using the cookie alert component like it is a standard
    HTML element.


    To see the component in action, run ng serve in a terminal window and point your
    browser to the `http://localhost:4200` address. You should see a page like the
    following:


    ![](images/Figure_9.2.jpg)


    **Figure 9.2**


    As expected, the alert appears at the bottom of the page and works as usual.


    As we did with React, let’s take a look at how to customize the alert message
    by using different approaches. Assigning a value to the `message` attribute is
    the easiest way. This code shows how to apply this basic approach:


    `import { Component } from ''@angular/core'';`


    `import ''cookie-alert-demo'';`


    `@Component({`


    `selector: ''app-root'',`


    `template: ‘`


    `//…`


    `<cookie-alert message="We use cookies, but respect your privacy!"></cookie-alert>`


    `‘,`


    `styles: []`


    `})`


    `export class AppComponent {`


    `title = ''angular-app-cookie-alert'';`


    `}`


    Nothing special, as you can see. But what if you want to assign a computed value
    as the text to show in the alert? Consider the following example:


    `import { Component } from ''@angular/core'';`


    `import ''cookie-alert-demo'';`


    `@Component({`


    `selector: ''app-root'',`


    `template: ‘`


    `//…`


    `<cookie-alert [message]="cookieMessage"></cookie-alert>`


    `‘,`


    `styles: []`


    `})`


    `export class AppComponent {`


    `title = ''angular-app-cookie-alert'';`


    `cookieMessage = ''We use cookies, but respect your privacy!'';`


    `}`


    Here, you create a `cookieMessage` property for the `AppComponent` component and
    assign your text. Then, you map this `cookieMessage` property to the message property
    of the cookie alert component in the template’s markup. Notice how you are seamlessly
    using the Angular binding syntax.


    To handle events generated by the web component, take a look at the following
    code:


    `import { Component } from ''@angular/core'';`


    `import ''cookie-alert-demo'';`


    `@Component({`


    `selector: ''app-root'',`


    `template: ‘`


    `//…`


    `<cookie-alert`


    `[message]="cookieMessage"`


    `(accepted)="showThanks()">`


    `</cookie-alert>`


    `‘,`


    `styles: []`


    `})`


    `export class AppComponent {`


    `title = ''angular-app-cookie-alert'';`


    `cookieMessage = ''We use cookies, but respect your privacy!'';`


    `showThanks() {`


    `alert("Thanks for accepting our cookie policy!");`


    `}`


    `}`


    You define the `showThanks()` method for the `AppComponent` component and assign
    it to the `accepted` event. Notice how even in this case, you are using the Angular
    binding syntax as usual.


    Remember that, if you need to access the event’s details, you can use the $event
    object in the `showThanks()` method as in the ordinary Angular way.


    You need to pay attention when using web components that are meant to be used
    in Angular forms. Consider, for example, the case where you have a custom input
    element created as a web component and you want to use it in a form, like in the
    following example:


    `<form [formGroup]="form" (ngSubmit)="send()">`


    `<custom-input`


    `type="text"`


    `label="Enter your data">`


    `</custom-input>`


    `<input type="submit" value="Submit">`


    `</form>`


    In this example, we are using the fictitious `<custom-input>` web component within
    an Angular form. By default, Angular enriches a standard HTML `input` element
    to enable it to interact with its forms API. Angular forms look for a `value accessor`
    in its child elements, that is, a feature that allows you to access the control’s
    value. A va`lue accessor` is a directive implementing the `ControlValueAccessor`
    interface and allows a native HTML element to communicate with the Angular form.
    For this reason, Angular manipulates the standard HTML elements by attaching this
    `value accessor.`'
