    ```

    document.body.appendChild(cookieAlert);

    const div = document.createElement("div");

    document.body.appendChild(div);

    div.appendChild(cookieAlert);

    ```


    This code creates an instance of the `CookieAlert` custom element and adds it
    to the body of the current document. Then, it creates a div element and appends
    it to the document’s body. Finally, it appends the previously created instance
    of your `CookieAlert` element to that div. In other words, your element has been
    moved from the body into the div.


    This last step triggers a second call for the `connectedCallback()` method. Maybe
    in many situations, this has no impact on the behavior of your component, but
    you should be aware of it. In fact, it depends on the specific statements of the
    method itself. If your code performs tasks that must be executed only once, you
    should take into account the possibility that your code could be called multiple
    times.


    Sometimes you may not have behavior issues when your custom element is moved around,
    but it may have performance issues. For example, if your `connectedCallback()`
    method performs heavy operations or fetches data from the network, they will be
    executed each time your component moves from one place to another in the document.
    Also, in these cases, you should avoid to execute them again and again.


    Let’s take a look at the `connectedCallback()` method of the `CookieAlert` component:


    ```

    connectedCallback() {

    this.createComponent();

    }

    ```


    It simply calls the `createComponent()` method, which manipulates the DOM in order
    to attach the UI elements of the custom element. Just to remind, here is the code
    of the `createComponent()` method:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = "This website uses cookies to ensure you get the best experience";

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    ```


    This code will be executed each time the `CookieAlert` component will be moved.
    From a behavior point of view, it has no impact: you will get the same component
    with the expected behavior. And maybe from the performance point of view, its
    impact is very low. But, anyway, it performs unnecessary work.


    We can avoid doing this unnecessary work by checking if it has been already done,
    as shown in the following example:


    ```

    connectedCallback() {

    if (!this.initialized) {

    this.createComponent();

    this.initialized = true;

    }

    }

    ```


    Here, you define the initialized property for the `CookieAlert` component and
    use it to know if the component’s UI has been built or not. The property is set
    to true only when the `createComponent()` method has been executed. This check
    guarantees that the UI will be built only once.


    Even if it does not affect the component’s behavior nor its performance, you should
    also be aware that the `connectedCallback()` method is called when a custom element
    is upgraded. This means that when a custom element is upgraded, its constructor
    and the `connectedCallback()` method will be invoked one after the other.


    # [The attributeChangedCallback() reaction](#toc.xhtml_s40a)


    The `attributeChangedCallback()` method is executed when attributes associated
    with the component are added, removed, updated, or replaced. We will learn how
    to deal with attributes and properties in the next chapter. In that chapter, we
    also will explore in more detail how to use the `attributeChangedCallback()` method.


    Here, you just need to be aware of this method and its general goal. Also, this
    method will receive three parameters that give you more information about what
    is going on:


    *   The name of the attribute that has been affected

    *   The old value of that attribute

    *   The new value of that attribute


    So, typically you will implement the `attributeChangedCallback()` method as follows:


    ```

    attributeChangedCallback(name, oldValue, newValue) {

    …

    }

    ```


    As said, we will go in more detail about using this reaction in the next chapter.


    # [The adoptedCallback() reaction](#toc.xhtml_s41a)


    You may need to implement the `adoptedCallback()` method when your custom element
    is adopted into a new document. The adoption of an element has a very specific
    use case. It happens when an element is moved from one document to another one
    through the `document.adoptNode()` method. This usually occurs when you are dealing
    with `iframe`, like in the following example:


    ```

    const iframe = document.querySelector(“iframe”);

    const iframeFirstImage = iframe.contentDocument.querySelector(“img”);

    const adoptedImage = document.adoptNode(iframeFirstImage);

    document.body.appendChild(adoptedImage);

    ```


    This code gets the first image element of the first `iframe` in the current document
    and appends it to the body of this current document. Be aware that the original
    element is removed from the source document.


    When your custom element is moved in this way, the `adoptedCallback()` method
    is invoked. Note that the element adoption doesn’t destroy and create the element
    again, so its constructor will not be called.


    # [The disconnectedCallback() reaction](#toc.xhtml_s42a)


    The `disconnectedCallback()` method is called when your custom element is removed
    from the DOM. You can define this method to perform operations before your element
    is no longer available on the current document. Typically, it is used to free
    up resources and to add cleanup logic, such as notify other components that the
    element is being removed from the DOM, stop timers, unsubscribe from DOM events
    or global application services, and so on.


    These cleanup operations are useful to free system resources and prevent possible
    memory leaks, but, of course, they depend on the logic of your component.


    **Keep in mind that disconnecting an element from the DOM does not mean that the
    element is destroyed.**


    To clarify this concept, consider the following code:


    ```

    const cookieAlert = new CookieAlert();

    document.body.appendChild(cookieAlert);

    document.body.getElementByTagName(“cookie-alert”).remove();

    ```


    This code creates an instance of the `cookieAlert` custom element, add it to the
    DOM and then remove it from there. The last statement causes the system to search
    for and execute the `disconnectedCallback()` method. Notice that the `cookieAlert`
    instance has been removed from the DOM, but it has not been destroyed. In fact,
    you can append it again to the DOM with the following statement:


    ```

    document.body.appendChild(cookieAlert);

    ```


    Since your custom element may be disconnected and reconnected to the DOM many
    times during its life, you should be aware that the `disconnectedCallback()` method
    may be called multiple times.


    Also, consider that usually the operations you perform on the `disconnectedCallback()`
    method depend on what you did when the `connectedCallback()` method was executed.
    Maybe, the most common scenario is the event listener subscriptions. We will go
    deeper with events in one of the next chapters, but you may guess that managing
    events is one of the most common activities for a UI element. Event handlers are
    usually registered when your component is connected to the DOM. They consume memory
    and continue to consume it even when the element that was listening no longer
    exists.


    When your component is removed from the DOM, it is a good practice to remove the
    event listeners it subscribed to. The following code shows an example of how it
    can be done:


    ```

    disconnectedCallback() {

    this.getElementById(“clickableItem”)

    .removeEventListener(“click”, this.handleClick);

    }

    ```


    As you can see here, the `removeEventListener()` method has been used to remove
    the registered event handler.


    # [Using a custom Web Component](#toc.xhtml_s43a)

