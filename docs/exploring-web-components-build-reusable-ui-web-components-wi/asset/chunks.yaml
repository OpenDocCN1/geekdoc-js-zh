  trans: "\n\n# 第 4 章：管理属性和特性\n\n本章将讨论如何通过属性和特性使 Web 组件可配置。你将了解属性（property）与特性（attribute）的区别，以及如何通过标准\
    \ DOM API 管理它们。接着，我们将看到如何为 Web 组件添加属性，以及如何将其值映射到对应的特性。反之，你也会学习如何将特性映射到属性，以及如何保持两者同步。\n\
    \n在本章末尾，我们将讨论可能影响组件性能和效果的一些因素。\n\n## 结构\n\n*   特性与属性\n*   管理属性\n*   同步特性与属性\n\
    *   注意事项与建议\n\n## 目标\n\n本章将让你清晰理解属性与特性。你将学习如何通过添加对属性和特性的支持来丰富你的 Web 组件，以便用户能够自定义它。你还将学习应采纳的最佳实践，使你的\
    \ Web 组件类似于标准 HTML 元素，并避免可能的性能陷阱。\n\n## 特性与属性\n\n在上一章中，我们开始构建一个 Web 组件，用于告知用户当前网站应用的\
    \ Cookie 管理策略——即 Cookie 提醒。到目前为止，实现只是简单显示一个默认文本，该文本硬编码在 Web 组件的 JavaScript 代码中。当然，对于真实世界的组件来说，这并非理想方法。我们希望使用我们\
    \ Web 组件的开发者能够指定他们想要显示的文本。换句话说，我们希望用户能够自定义我们的 Web 组件。通常，HTML 元素可以通过在页面标记中为其特性赋值，或在\
    \ JavaScript 代码中为其属性赋值来进行自定义。\n\n我们将在 Cookie 提醒组件中实现这种自定义 HTML 元素的标准方式。但在进入实际实现之前，我们需要明确什么是特性与属性，以及它们之间的区别。\n\
    \n作为前端开发者，你知道浏览器如何解释 HTML 并构建 DOM。简而言之，当浏览器加载页面时，它会解析 HTML 标记，并根据其中找到的 HTML 元素生成\
    \ DOM 对象。通常，每个 HTML 元素都会成为 DOM 层次结构中的一个 DOM 对象，而 HTML 元素的每个特性都会成为 DOM 对象的一个属性。尽管这是常见情况，但这种映射并非严格的一一对应。\n\
    \n让我们看看 HTML 特性与 DOM 对象属性之间的主要区别。\n\n### HTML 特性\n\n如前所述，当浏览器解析一个 HTML 元素时，它会构建一个对应的\
    \ DOM 对象。它还会分析元素的特性，将其值赋给对应 DOM 对象的属性。当然，浏览器能够识别 HTML 元素中的标准特性，在这种情况下，它知道如何处理该特性并将其值赋给对应的对象属性。例如，考虑以下标记：\n\
    \n```\n<p id=”myPar”>这是一个段落</p>\n```\n\n浏览器将生成一个 `HTMLParagraphElement` 对象，并将值\
    \ `myPar` 赋给它的 `id` 属性。它知道 `HTMLParagraphElement` 对象有一个与 HTML 特性 `id` 对应的 `id`\
    \ 属性，因此可以将后者映射到前者。\n\n注意，HTML 元素并不共享相同的标准特性。例如，`<input>` 元素有 `type` 特性，而 `<div>`\
    \ 元素没有。因此，特性与属性之间的映射必须逐个元素进行。这意味着，如果你向 HTML 元素添加一个非标准特性，它不会在 DOM 对象上生成对应的属性。为了更好地说明，你可以编写以下标记：\n\
    \n```\n<p id=”myPar” type=”special”>这是一个段落</p>\n```\n\n但 `HTMLParagraphElement`\
    \ 对象不会获得 `type` 属性。不过，你仍然可以通过 DOM API 访问 HTML 特性。实际上，每个 DOM 对象都有以下方法，允许你处理特性：\n\
    \n| **方法** | **描述** |\n| --- | --- |\n| `hasAttribute()` | 检查特性是否存在 |\n| `getAttribute()`\
    \ | 获取特性的值 |\n| `setAttribute()` | 设置特性的值 |\n| `removeAttribute()` | 从 HTML 元素中移除特性\
    \ |\n\n**表 4.1**\n\n例如，你可以通过以下代码访问上述标记中段落的非标准特性 `type`：\n\n```\nconst myPar =\
    \ document.getElementById(“myPar”);\nif (myPar.hasAttribute(“type”)) {\n  console.log(myPar.getAttribute(“type”));\n\
    }\n```\n\n这段代码检查 `type` 特性是否存在，并在控制台显示其值。\n\n你还可以使用 `attributes` 属性，它包含 HTML 元素所有特性的列表。列表中的每个元素都是一个表示特性的对象。你可以通过使用\
    \ `attributes` 属性来重现前面代码片段的行为，如下所示：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    const typeAttribute = myPar.attributes.getNamedItem(“type”);\nif (typeAttribute)\
    \ {\n  console.log(typeAttribute.value);\n}\n```\n\n在这种情况下，你通过 `attributes` 集合的\
    \ `getNamedItem()` 方法获取表示特性的对象。然后，通过其 `value` 属性访问特性的值。\n\n稍后我们将回到非标准特性及其相关注意事项。\n\
    \n**`attributes` 集合包含标准特性和非标准特性。**\n\n为了结束对 HTML 元素特性的概述，你应该注意两个重要特性：\n\n*   特性名称不区分大小写\n\
    *   特性的值始终是字符串\n\n这意味着，例如，以下标记是等价的：\n\n```\n<p id=”myPar”>这是一个段落</p>\n<p ID=”myPar”>这是一个段落</p>\n\
    <p Id=”myPar”>这是一个段落</p>\n```\n\n此外，你可以通过 JavaScript 以以下等价方式检索特性的值：\n\n```\nconst\
    \ typeAttribute = myPar.attributes.getNamedItem(“type”);\nconst typeAttribute\
    \ = myPar.attributes.getNamedItem(“Type”);\nconst typeAttribute = myPar.attributes.getNamedItem(“TYPE”);\n\
    ```\n\n另外，无论你以何种方式获取或设置特性的值，它都将是一个字符串。考虑以下示例：\n\n```\nconst typeAttribute = myPar.attributes.getNamedItem(“type”);\n\
    console.log(typeAttribute.value + 1);\n```\n\n你在控制台得到的输出将是特性值与字符串 1 的拼接。如果 `type`\
    \ 特性的值是一个数字字符串，则需要由你将其转换为数字。当你为特性赋值时也是如此，如下代码所示：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    myPar.setAttribute(“type”, 123);\n```\n\n即使你赋的是一个数值，它也会被转换为字符串。\n\n### DOM 属性\n\
    \n如前所述，HTML 元素在内部由 DOM 对象表示。通常，HTML 元素的任何标准特性在该对象中都有对应的属性，而非标准特性则通过通用方法或 `attributes`\
    \ 集合访问，正如我们之前所见。\n\nDOM 对象是常规的 JavaScript 对象，因此我们可以像处理任何其他对象一样处理它们。例如，我们可以为其属性赋值，或添加新的属性和方法。以下代码展示了如何向\
    \ `HTMLParagraphElement` 对象添加新属性和新方法：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
    myPar.myProperty = “这是一个新属性！”;\nmyPar.getContent = () => myPar.innerHTML;\n```\n\
    \n"
- fmt: '

    Adding a new property to the DOM object does not affect HTML, but it can be useful
    for making customizations via JavaScript. For example, we could assign text or
    numeric information to an image to be retrieved later.


    **Consider that, even if it is technically possible, adding new properties to
    a DOM object might not be a good idea. The new property could clash with the possible
    evolution of the standard DOM.**


    Unlike HTML attributes, DOM properties are case sensitive. This means that the
    name of the DOM property will always be the same independently from the case of
    the corresponding attribute. In other words, if your markup is like the following:


    `<p ID=”myPar”>This is a paragraph</p>`


    The corresponding DOM property will still be `id`.


    Again, unlike HTML attributes, DOM properties are typed. For example, consider
    the following markup:


    `<p ID=”myPar” hidden style=”color:red”>This is a paragraph</p>`


    The `hidden` property corresponding to the `hidden` attribute has a Boolean value.
    The `style` property is an object, instead.


    Usually, when the type of a DOM property is a string, the attribute’s value is
    assigned to the property as-is. However, there are some exceptions. For example,
    the value of the `href` property of the `HTMLAnchorElement` is always an absolute
    URL, even if the corresponding attribute’s value is a relative one. This also
    happens for the `src` attribute of the `<img>` HTML element and the `src` property
    of the `HTMLImageElement`.


    # Non-standard attributes management


    We talked about non-standard attributes and how you can manage them via a few
    methods like `getAttribute()`, `setAttribute()`, and similar or by using the attributes
    collection.


    In general, creating non-standard attributes might not be a good idea. Or, at
    least, it is not a good idea if you create them without thinking of the consequences
    of their introduction in your application. For example, you could add a non-standard
    attribute to an HTML element, but what happens if later it becomes standard? You
    could get unexpected results if you freely assign attribute names.


    Even if technically, you can add attributes by choosing the name you want, you
    should use the so-called data attributes. These are attributes whose name starts
    with data-prefix. The HTML standard introduced them just for this purpose - allowing
    developers to add custom attributes.


    For example, you can add a non-standard attribute to the paragraph element in
    a more secure way as follows:


    `<p id=”myPar” data-type=”special”>This is a paragraph</p>`


    Any data attribute is mapped to the `dataset` property of the corresponding DOM
    object. So, you can retrieve the value of the `data-type` attribute, as shown
    in the following code snippet:


    `const myPar = document.getElementById(“myPar”);`


    `console.log(myPar.dataset.type);`


    As you can see, in this case, the `data-type` attribute generates the `dataset.type`
    property.


    # Attributes and properties synchronization


    In most cases, when the value of a standard attribute changes, the value of the
    corresponding DOM property changes accordingly, and vice versa. This guarantees
    that standard attributes and properties are automatically kept in sync.


    However, there are some exceptions to this rule. Consider the following example:


    `<input id="myName" type="text" value="John" />`


    Initially, the `value` attribute and the corresponding property of the `HTMLInputElement`
    object have the same value. But if the user changes the value of the text box,
    we will have different values between the property and the attribute. In particular,
    the `value` property of `HTMLInputElement` object will get the new value inserted
    by the user, while the attribute will continue to have the initial value. The
    reason for this behavior is simple - this way we allow the user to restore the
    original value when they hit the `Reset` button in a form. So, it’s just a practical
    reason.


    # Managing properties


    The overview provided so far helps us to reason about the standard behavior of
    attributes and properties. If we want to provide attributes and properties to
    our web components, we need to have a clear understanding of how they work in
    the standard browser behavior. This allows us to create attributes and properties
    that work as close as possible to the standard elements so that users can figure
    out their behavior.


    # Adding properties


    Let’s start changing our cookie alert component by adding a property that allows
    the user to specify their `message`. We are going to add a `message` property
    to our custom element, and this is no more than adding a property to any standard
    JavaScript class. So, let’s recall the code for the `CookieAlert` class we have
    defined so far:


    ```

    const styleRules = ‘

    .container {

    color: rgb(255, 255, 255);

    background-color: rgb(35, 122, 252);

    padding: 1em 1.8em;

    width: 100%;

    font-family: Helvetica,Calibri,Arial,sans-serif;

    }

    .footer {

    position:fixed;

    left:0px;

    bottom:0px;

    }

    ‘;

    class CookieAlert extends HTMLElement {

    constructor() {

    super();

    }

    connectedCallback() {

    this.createComponent();

    }

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = "This website uses cookies to ensure you get the best experience";

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    }

    customElements.define("cookie-alert", CookieAlert);

    ```


    As a first step to add a property, let’s assign a default value to the `_message`
    property in the class constructor as shown by the following code:


    ```

    constructor() {

    super();

    this._message = "This website uses cookies to ensure you get the best experience";

    }

    ```


    Now, let’s use the `_message` property to assign the default message when we are
    building the UI in the `createComponent()` method:


    ```

    createComponent() {

    const style = document.createElement("style");

    style.appendChild(document.createTextNode(styleRules));

    this.appendChild(style);

    const span = document.createElement("span");

    span.innerText = this._message;

    const div = document.createElement("div");

    div.classList.add("container", "footer");

    div.appendChild(span);

    this.appendChild(div);

    }

    ```


    These changes don’t affect the current behavior of the cookie alert component.
    The `_message` property acts as a storage for the message to be shown. It is not
    meant to be the actual property for our component, but it should be private property.
    We are using the well-known convention that relies on naming properties with the
    `_` prefix for those properties that should be considered as private.


    **At the time of writing, actual private properties are an experimental feature
    proposed at the ECMAScript committee. Support in browsers is limited, but some
    transpilers can be configured to use them.**


    **In the rest of the book, we will continue to use the naming convention based
    on the `_` prefix for private properties.**


    To define the actual property, let’s add the following code to the class:


    ```

    get message() {

    return this._message;

    }

    set message(value) {

    this._message = value;

    }

    ```


    This code adds a getter and a setter for the `message` property. The getter returns
    the current value of the private `_message` property, while the setter assigns
    to it the value received in the parameter.


    While the getter could fulfil the needs for the `message` property, the setter
    doesn’t. We would like that when the setter receives the value for the `message`,
    the UI updates with this new message. So, let’s apply some changes to the setter
    of the `message` property and add a new method, as shown in the following code
    snippet:


    ```

    get message() {

    return this._message;

    }

    ```

