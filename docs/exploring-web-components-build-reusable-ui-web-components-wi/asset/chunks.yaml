    ```

    class="button"

    onClick={()=>this.element.style.visibility = "hidden"}>

    Close

    </button>

    <button id= "acceptButton"

    class="button"

    onClick={()=>this.accept()}>

    Accept

    </button>

    </div>;

    }

    accept() {

    this.element.style.visibility = "hidden";

    setCookie("cookiesAccepted", "y", 365);

    this.accepted.emit({

    detail:{

    acceptedCookieName: "cookiesAccepted",

    acceptedCookieExpiration: 365}

    });

    }

    ```


    In this case, we defined the `accept()` method and used it in the `onClick` listener.
    The interesting thing, in this case, is how we generate the accepted event. We
    used the `@Event` decorator to declare our accepted event emitter and created
    it through its `emit()` method.


    `Stencil` also provides you with the `@Listen` decorator that allows you to listen
    to an event on the component.


    # [Lifecycle](#toc.xhtml_s155a)


    As usual, the last step for building our cookie alert component is to check if
    the user accepted the cookie policy. We can do it by adding the `connectedCallback()`
    method, as we did in the plain JavaScript version of the component.


    This is how the `connectedCallback()` method looks like:


    ```

    connectedCallback() {

    const cookiesAccepted = getCookie("cookiesAccepted")

    if (cookiesAccepted === "y") {

    this.element.style.visibility = "hidden";

    }

    }

    ```


    In addition to standard `connectedCallback()` and `disconnectedCallback()` reactions,
    `Stencil` provides you with a few other lifecycle methods:


    *   `connectedCallback():` It is called when the component is appended to the
    DOM.


    *   `componentWillLoad()`: This is called once just after the component is appended
    to the DOM the first time.


    *   `componentDidLoad():` It is called once just after the component is loaded
    and the first render() runs.


    *   `componentWillRender():` This is called before each `render()` execution.


    *   `componentDidRender():` It is called after each `render()` execution.


    *   `componentWillUpdate():` It is called when the component is about to be updated.


    *   `componentDidUpdate():` This is called after the component updates.


    *   `disconnectedCallback():` This is called when the component is removed from
    the DOM.


    # [Conclusion](#toc.xhtml_s156a)


    This chapter concludes the book by giving you an overview of the ecosystem that
    is growing around Web Components. You learned that some features of the Web Component
    technologies may be considered as low-level and require DOM knowledge and repetitive
    code. Libraries like the ones we explored in the chapter aim to simplify the development
    experience.


    You explored `LitElement`, from the `Polymer` project, and used its development
    approach that relies on the `LitElement` base class. You met `Hybrids` that proposes
    a functional approach based on plain objects and pure functions. Also, you applied
    the minimalist class-based model of the `Slim` library. Finally, you used `Stencil`
    with its syntax halfway between Angular and React to generate Web Components in
    plain JavaScript.


