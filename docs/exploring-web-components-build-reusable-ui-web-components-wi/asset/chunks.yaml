    20 years of experience in the software development industry. In his career, Andrea
    has held various roles (software developer and architect, trainer, technical writer)
    in different ways (as an independent contractor, as a company owner, as an employee).


    For the project he was involved in, he has used several programming languages
    and technologies: from .NET to Node.js, from C# to JavaScript, from SQL Server
    to MongoDB, from IIS to nginx.


    Lately, he is focusing on the JavaScript ecosystem both on the server and on the
    client-side.


    He has contributed to many online and offline magazines and authored a few books.


    Currently, he is working at Auth0 as an R&D Content Engineer.


    # About the Reviewer


    **Akanksha Sinha** is a Technical Manager having 12+ years of experience in various
    progressive roles in Software Development. Her area of work has been in domains
    like Digital Marketing, Technology, and Insurance. She was one of the founding
    members of the Tools & Automation team in Cognizant for Operation Teams working
    for Tech giants.


    As part of her contribution to building a Bot and Tools landscape from scratch,
    she has explored web development, UI/UX, and the latest technologies like ML,
    Chatbots, Cloud Computing, NLP, etc. Her skill set includes Javascript, Google
    Cloud, Google App Script, AngularJS, Typescript, Python, Chrome Extension, GSuites,
    HTML & CSS, and Unix Shell Scripting. Natural Language, Chatbots, Big Query, and
    Machine Learning are her area of interest where she has done multiple prototypes.


    She has a B.E in E&E from RTM Nagpur University and has worked with Cognizant
    Technology Solutions.


