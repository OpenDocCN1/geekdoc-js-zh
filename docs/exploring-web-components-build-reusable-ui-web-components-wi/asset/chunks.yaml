    module.


    However, if we try to include this new version of the component script with the
    `<script>` tag as above, we will get an error about the `export` statement. Actually,
    the `<script>` tag doesn''t support modules by default. In order to enable it
    to include modules in an HTML page, you have to specify it through the type attribute.
    So, the correct way to import the modularized version of the cookie alert component
    is as shown here:


    `<script type="module" src="./cookie-alert.js"></script>`


    From now on, you can use the `CookieAlert` class from any JavaScript module by
    importing it and creating your instance, as shown in the following example:


    `import CookieAlert from ''./cookie-alert.js''`


    `var myCookieAlert = new CookieAlert();`


    **Keep in mind that you can import the items exported by a module only from within
    another module. An attempt to import items from a module when your code is within
    a <script> tag without the type="module" attribute will throw an error.**


    # [The package-based strategy](#toc.xhtml_s108a)


    The script-based strategy is a good approach for an HTML-centric application or
    website. However, modern Web application development uses a JavaScript-first approach.
    Consider the **Single Page Application (SPA)** architecture: it uses one HTML
    page whose content is generated at runtime by JavaScript code. This is the approach
    supported by most JavaScript frameworks and libraries, like React, Angular, Vue,
    etc. But it is also applicable to vanilla JavaScript. With this approach, an HTML
    page is just the anchor to attach the application JavaScript code to the browser.
    Most of the logic, UI, and infrastructure of the application itself is provided
    by JavaScript code.'
  toc: []
  trans: "\n\nWeb 组件构建项目允许您为生产环境构建组件，即准备分发给用户。与上一节描述的源代码分发方式相比，构建步骤为您的脚本带来了一些优势。\n\
    \n它将您的代码转译为广泛支持的 ECMAScript 版本，通常是 ECMAScript 5。您可能会疑惑，既然用户应该拥有支持 Web 组件技术的最新浏览器，为什么还要将现代\
    \ JavaScript 代码翻译成旧版本？实际上，如果您将构建过程中的转译步骤与 polyfill 结合使用（如第 1 章所述），这可能会很有用。这样，您就可以让旧版浏览器的用户也能使用您的\
    \ Web 组件。\n\n此外，构建步骤会优化组件的代码，以减小最终打包文件的大小。这减少了组件的传输和加载时间。\n\n您可以通过在 Web 组件构建器项目的根目录下运行以下命令来获取\
    \ cookie 提醒组件的构建版本：\n\n`npm run build`\n\n几秒钟后，您会在项目的 `dist` 文件夹中找到 `bundle.js`\
    \ 文件。与没有构建步骤的分发方式一样，您可以将此文件重命名为 `cookie-alert.js`，并通过下载或 CDN 提供给用户。\n\n您的用户将能够像我们在前面案例中描述的那样使用您的组件。\n\
    \n# 实现模块\n\n上述分发方式乍看之下似乎完美无缺。然而，它们存在一些缺点。\n\n让我们考虑没有构建步骤的分发策略。假设您想通过 JavaScript\
    \ 创建一个 cookie 提醒组件的实例。您应该能够像以下示例一样使用 `CookieAlert` 类：\n\n`var myCookieAlert =\
    \ new CookieAlert();`\n\n实际上，它按预期工作。但是，您也可以访问定义 cookie 提醒组件所用原生模板的 `template`\
    \ 常量。您只需编写以下代码即可尝试：\n\n`console.log(template);`\n\n在这种情况下，您将在控制台窗口中看到一个对象，而不是\
    \ null 值。\n\n此外，您还可以访问 `cookie-alert.js` 脚本中定义的 `getCookie()` 和 `setCookie()`\
    \ 函数。这是因为所有这些元素在脚本文件中都被定义为全局元素。\n\n您可能认为这不是一个大问题。毕竟，组件按预期工作。实际上，这是一个严重的问题。试想，如果一个不了解组件实现细节的用户定义了一个全局的\
    \ `template` 变量，会发生什么？可以说，他们定义 `template` 变量的尝试会失败，因为已经存在同名的常量。因此，由于包含了我们的 cookie\
    \ 提醒脚本，用户的代码将会出错。另外，假设用户定义了自己的 `getCookie()` 函数，可能具有不同的签名或行为。在这种情况下，由于用户函数重新定义的干扰，我们的组件将无法按预期工作。\n\
    \n如果您还记得第 6 章中关于 Shadow DOM 的讨论，这里我们在代码层面遇到了类似的问题。我们组件的代码影响用户的代码，用户的代码也影响组件的代码。我们上面关于用户了解我们组件实现细节的前提非常重要。不是因为用户应该知道我们的组件内部如何工作，而是因为他们不需要知道。我们的代码不应影响用户的代码，用户的代码也不应影响我们的组件。用户影响组件代码的唯一方式是通过其公共接口，即为此目标明确设计的属性、特性、事件、方法等集合。\n\
    \n换句话说，我们需要将组件的代码封装到一个模块中。\n\n在我们探讨如何将脚本转换为模块之前，先来看看带有构建步骤的分发策略的缺点。在这种情况下，我们无法访问\
    \ `template` 常量以及 `getCookie()` 和 `setCookie()` 函数。从封装的角度来看，这很好。不幸的是，我们也无法访问 `CookieAlert`\
    \ 类，因此无法通过 JavaScript 创建组件的实例。在这种情况下，我们遇到了与没有构建步骤的分发策略相反的问题：脚本没有向公共访问暴露任何内容。\n\
    \n这种行为取决于 Webpack 打包工具。它会自动将脚本解释为模块。这样，未显式导出的内容在模块外部不可访问。另一方面，从标准 ECMAScript 的角度来看，模块是至少包含一个\
    \ `export` 或 `import` 语句的脚本。因此，没有任何此类语句的脚本会在全局上下文中声明元素。\n\n总之，在没有构建步骤的分发方式中，所有组件代码都是全局的。在这种情况下，它可能会与用户代码产生干扰。在带有构建步骤的方式中，所有组件代码都是私有的，因此用户无法通过\
    \ JavaScript 利用我们的组件。\n\n让我们看看如何通过将组件实现为标准 ECMAScript 模块来解决这两个问题。我们只需对包含组件定义的脚本进行一项更改：在类定义前加上\
    \ `export default` 语句。cookie 提醒组件的脚本文件内容如下所示：\n\n```\nconst template = document.createElement('template');\n\
    template.innerHTML = '…';\nexport default class CookieAlert extends HTMLElement\
    \ {\n  // …\n}\ncustomElements.define(\"cookie-alert\", CookieAlert);\nfunction\
    \ getCookie(cookieName) {\n  // …\n}\nfunction setCookie(cookieName, cookieValue,\
    \ expirationDays) {\n  // …\n}\n```\n\n我们将 `CookieAlert` 类定义为当前模块的默认导出项。\n\n然而，如果我们尝试像之前一样使用\
    \ `<script>` 标签包含这个新版本的组件脚本，将会出现关于 `export` 语句的错误。实际上，`<script>` 标签默认不支持模块。为了在\
    \ HTML 页面中启用模块包含，您需要通过 `type` 属性指定。因此，导入模块化版本的 cookie 提醒组件的正确方式如下所示：\n\n`<script\
    \ type=\"module\" src=\"./cookie-alert.js\"></script>`\n\n从现在开始，您可以通过导入 `CookieAlert`\
    \ 类并创建实例来在任何 JavaScript 模块中使用它，如下例所示：\n\n`import CookieAlert from './cookie-alert.js'`\n\
    \n`var myCookieAlert = new CookieAlert();`\n\n请记住，您只能从另一个模块内部导入模块导出的项。如果您的代码位于没有\
    \ `type=\"module\"` 属性的 `<script>` 标签中，尝试从模块导入项将会抛出错误。\n\n# 基于包的策略\n\n基于脚本的策略对于以\
    \ HTML 为中心的应用程序或网站来说是一种好方法。然而，现代 Web 应用程序开发采用 JavaScript 优先的方法。考虑单页应用（SPA）架构：它使用一个\
    \ HTML 页面，其内容由 JavaScript 代码在运行时生成。这是大多数 JavaScript 框架和库（如 React、Angular、Vue 等）支持的方法，但也适用于原生\
    \ JavaScript。使用这种方法，HTML 页面只是将应用程序 JavaScript 代码附加到浏览器的锚点。应用程序本身的大部分逻辑、UI 和基础设施都由\
    \ JavaScript 代码提供。\n\n"
- fmt: "\nIn this context, a building toolchain is essential, and in the vast majority\
    \ of cases, the development environment is based on the Node.js runtime. As you\
    \ know, in this environment, the usual approach to add an external component or\
    \ library is to use packages to be installed by package managers like `npm` or\
    \ `yarn`. So, imagine we want to provide our users with the cookie alert component\
    \ as a package. How can we accomplish this? Let's find out together.\n\n# Leveraging\
    \ the GitHub repository\n\nThe simplest way to package and distribute your component\
    \ with other developers is by sharing it through a GitHub repository. This approach\
    \ allows you to share the source code of your project but also to let other developers\
    \ use `npm` in order to install your component into their projects. Let's take\
    \ a look at how it works.\n\nOnce prepared, your code to be published on a GitHub\
    \ repository, ensure your `package.json` file is correctly configured. The following\
    \ is an example of `package.json` file for our alert cookie component:\n\n```\n\
    {\n  \"name\": \"cookie-alert-demo\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"A Web Component that allows you to display your message about your cookie\
    \ policy.\",\n  \"main\": \"src/index.js\",\n  \"scripts\": {\n    \"start\":\
    \ \"webpack-dev-server --config ./webpack.config.js --mode development\",\n  \
    \  \"build\": \" node node_modules/.bin/webpack --mode production\",\n    \"test\"\
    : \"echo \\\"Error: no test specified\\\" && exit 0\"\n  },\n  \"keywords\": [],\n\
    \  \"author\": \"Andrea Chiarelli (https://www.andreachiarelli.it)\",\n  \"license\"\
    : \"MIT\",\n  \"devDependencies\": {\n    \"webpack\": \"^4.41.2\",\n    \"webpack-cli\"\
    : \"^3.3.9\",\n    \"webpack-dev-server\": \"^3.8.2\",\n    \"copy-webpack-plugin\"\
    : \"^5.0.4\"\n  },\n  \"dependencies\": {\n    \"@webcomponents/webcomponentsjs\"\
    : \"^2.3.0\"\n  }\n}\n```\n\nLet's highlight the most important items. Give your\
    \ package a meaningful name and a description. Also, assign a version and keep\
    \ it updated with future changes you will apply to your code.\n\nThe name and\
    \ version are required fields in the `package.json` file in order to publish your\
    \ package.\n\nThe name needs to follow a few rules:\n\n- it must be unique\n-\
    \ its maximum length is 214 characters\n- it cannot start with a dot or an underscore\n\
    - it cannot have uppercase letters\n\nThen, set the `main` property pointing to\
    \ the entry point file of your project. If your project consists of just one file,\
    \ set the path to it. In the example, we specified the path to the `index.js`\
    \ file under the `src` folder. The other settings are the ones needed for development\
    \ purposes.\n\nWith these simple adjustments, our users will be enabled to install\
    \ our component as a package by simply typing an `npm install` command. For example,\
    \ to install our alert cookie component from the GitHub repository published at\
    \ `https://github.com/andychiare/cookie-alert-demo`, the user has to type:\n\n\
    `npm install andychiare/cookie-alert-demo`\n\nAs you may notice, the user has\
    \ just to specify the GitHub organization and the repository name.\n\nOnce the\
    \ code is installed in the `node_modules` folder, the user can import the component\
    \ as a standard package. For example, the component can be dynamically attached\
    \ to the body of the HTML page as follows:\n\n```\nimport CookieAlert from 'cookie-alert-demo';\n\
    const cookieAlert = new CookieAlert();\ndocument.body.appendChild(cookieAlert);\n\
    ```\n\n# Publishing in the public npm registry\n\nIf you want to publish your\
    \ component into the official `npm registry`, you need to have an account and\
    \ login to the registry before publishing it. The command to login is as follows:\n\
    \n`npm login`\n\nYou will be required to provide your user name, password, and\
    \ e-mail. After you logged in, you can publish the package by simply typing the\
    \ following command from the root of the component's project:\n\n`npm publish`\n\
    \nThis command will publish the package containing your component into the npm\
    \ `registry`. After publishing, you can verify your package by checking its public\
    \ URL in the form `https://www.npmjs.com/package/<package-name>`, where `<package-name>`\
    \ is the name of your package.\n\nIn this case, the user of your component will\
    \ easily install this package by typing:\n\n`npm install package-name`\n\nOf course,\
    \ the way your component will be used in the target project is the same as we\
    \ saw in the GitHub repository case.\n\n# Extending Web Components\n\nWe have\
    \ seen so far how to create our Web Component, how to make it available to other\
    \ developers, and how to use it in your HTML markup or JavaScript application.\n\
    \nAs you've seen, using a Web Component is pretty straightforward: you can deal\
    \ with it as if it were a native HTML element. This very simple concept has some\
    \ very interesting implications. In fact, as you can do with any native HTML element,\
    \ you can create your own Web Component by extending an existing Web Component.\
    \ Let's take a look at how it works.\n\n# Defining an extended Web Component\n\
    \nConsider the cookie alert component that we implemented so far. We want to create\
    \ a variant of this component that has a property and an attribute that allows\
    \ us to show or hide the `Close` button.\n\nWe can create a new project by cloning\
    \ and initializing the Web Component Builder project. Then, we can add the `cookie-alert-demo`\
    \ Web Component to the project by running the following command:\n\n`npm install\
    \ andychiare/cookie-alert-demo`\n\nFinally, we implement this new component as\
    \ follows:\n\n```\nimport CookieAlert from 'cookie-alert-demo';\n\nclass MyCookieAlert\
    \ extends CookieAlert {\n  constructor() {\n    super();\n    this._hasCloseButton\
    \ = false;\n  }\n\n  get hasCloseButton() {\n    return this._hasCloseButton;\n\
    \  }\n\n  set hasCloseButton(value) {\n    this._hasCloseButton = value;\n   \
    \ this.setAttribute(\"closebutton\", value);\n    this.toggleCloseButton(value);\n\
    \  }\n\n  toggleCloseButton(visible) {\n    const closeButton = super.shadowRoot.getElementById(\"\
    closeButton\");\n    closeButton.style.display = (visible? \"block\": \"none\"\
    );\n  }\n\n  static get observedAttributes() {\n    return [\"closebutton\"];\n\
    \  }\n\n  attributeChangedCallback(name, oldValue, newValue) {\n    if (oldValue\
    \ !== newValue) {\n      if (name == \"closebutton\") {\n        let isVisible\
    \ = (newValue === \"true\" || newValue === \"\");\n        this._hasCloseButton\
    \ = isVisible;\n        this.toggleCloseButton(isVisible);\n      }\n    }\n \
    \ }\n\n  connectedCallback() {\n    super.connectedCallback();\n    this.toggleCloseButton(this._hasCloseButton);\n\
    \  }\n}\n\ncustomElements.define(\"my-cookie-alert\", MyCookieAlert);\n```\n\n\
    Let's analyze each part of this code. The first line imports the `CookieAlert`\
    \ class from the `cookie-alert-demo` module. The `MyCookieAlert` class definition\
    \ inherits from this `CookieAlert` class. This is the main point: instead of inheriting\
    \ from the `HTMLElement` class, as usual, we are building a new Web Component\
    \ starting from the cookie alert component. The rest of the code should be easily\
    \ understandable now.\n\nThe `MyCookieAlert` class constructor calls `super()`\
    \ and initializes the internal property `_hasCloseButton` with the `false` value:\n\
    \n```\nconstructor() {\n  super();\n  this._hasCloseButton = false;\n}\n```\n\n\
    This means that this variant of the cookie alert component shouldn't show the\
    \ `Close` button, by default. Then, we have the definition of the getter and setter\
    \ of the `hasCloseButton` property:\n\n```\nget hasCloseButton() {\n  return this._hasCloseButton;\n\
    }\n\nset hasCloseButton(value) {\n  this._hasCloseButton = value;\n  this.setAttribute(\"\
    closebutton\", value);\n  this.toggleCloseButton(value);\n}\n```\n\nThe setter\
    \ calls the `toggleCloseButton()` method to change the button visibility. This\
    \ method interacts with the shadow DOM of the base component to manage the button\
    \ visibility:\n\n```\ntoggleCloseButton(visible) {\n  const closeButton = super.shadowRoot.getElementById(\"\
    closeButton\");\n  closeButton.style.display = (visible? \"block\": \"none\");\n\
    }\n```\n"
  raw: 'In this context, a building toolchain is essential, and in the vast majority
    of cases, the development environment is based on the Node.js runtime. As you
    know, in this environment, the usual approach to add an external component or
    library is to use packages to be installed by package managers like `npm` or yarn.
    So, imagine we want to provide our users with the cookie alert component as a
    package. How can we accomplish this? Let''s find out together.


    # [Leveraging the GitHub repository](#toc.xhtml_s109a)


    The simplest way to package and distribute your component with other developers
    is by sharing it through a GitHub repository. This approach allows you to share
    the source code of your project but also to let other developers use `npm` in
    order to install your component into their projects. Let''s take a look at how
    it works.


    Once prepared, your code to be published on a GitHub repository, ensure your `package.json`
    file is correctly configured. The following is an example of `package.json` file
    for our alert cookie component:


    `{`


    `"name": "cookie-alert-demo",`


    `"version": "1.0.0",`


    `"description": "A Web Component that allows you to display your message about
    your cookie policy.",`


    `"main": "src/index.js",`


    `"scripts": {`


    `"start": "webpack-dev-server --config ./webpack.config.js --mode development",`


    `"build": " node node_modules/.bin/webpack --mode production",`


    `"test": "echo \"Error: no test specified\" && exit 0"`


    `},`


    `"keywords": [],`


    `"author": "Andrea Chiarelli (https://www.andreachiarelli.it)",`


    `"license": "MIT",`


    `"devDependencies": {`


    `"webpack": "^4.41.2",`


    `"webpack-cli": "^3.3.9",`


    `"webpack-dev-server": "^3.8.2",`


    `"copy-webpack-plugin": "^5.0.4"`


    `},`


    `"dependencies": {`


    `"@webcomponents/webcomponentsjs": "^2.3.0"`


    `}`


    `}`


    Let''s highlight the most important items. Give your package a meaningful name
    and a description. Also, assign a version and keep it updated with future changes
    you will apply to your code.


    **The name and version are required fields in the** `package.json` **file in order
    to publish your package.**


    **The name needs to follow a few rules:**


    **- it must be unique**


    **- its maximum length is 214 characters**


    **- it cannot start with a dot or an underscore**


    **- it cannot have uppercase letters**


    Then, set the main property pointing to the entry point file of your project.
    If your project consists of just one file, set the path to it. In the example,
    we specified the path to the `index.js` file under the `src` folder. The other
    settings are the ones needed for development purposes.


    With these simple adjustments, our users will be enabled to install our component
    as a package by simply typing an `npm install` command. For example, to install
    our alert cookie component from the GitHub repository published at **[https://github.com/andychiare/cookie-alert-demo](https://github.com/andychiare/cookie-alert-demo)**,
    the user has to type:


    **`npm install andychiare/cookie-alert-demo`**


    As you may notice, the user has just to specify the GitHub organization and the
    repository name.


    Once the code is installed in the `node_modules` folder, the user can import the
    component as a standard package. For example, the component can be dynamically
    attached to the body of the HTML page as follows:


    `import CookieAlert from ''cookie-alert-demo'';`


    `const cookieAlert = new CookieAlert();`


    `document.body.appendChild(cookieAlert);`


    # [Publishing in the public npm registry](#toc.xhtml_s110a)


    If you want to publish your component into the official `npm registry,` you need
    to have an account and login to the registry before publishing it. The command
    to login is as follows:


    `npm login`


    You will be required to provide your user name, password, and e-mail. After you
    logged in, you can publish the package by simply typing the following command
    from the root of the component''s project:


    **`npm publish`**


    This command will publish the package containing your component into the npm `registry`.
    After publishing, you can verify your package by checking its public URL in the
    form **https://www.npmjs.com/package/<package-name>, where <package-name>** is
    the name of your package.


    In this case, the user of your component will easily install this package by typing:


    **`npm install package-name`**


    Of course, the way your component will be used in the target project is the same
    as we saw in the GitHub repository case.


    # [Extending Web Components](#toc.xhtml_s111a)


    We have seen so far how to create our Web Component, how to make it available
    to other developers, and how to use it in your HTML markup or JavaScript application.


    As you''ve seen, using a Web Component is pretty straightforward: you can deal
    with it as if it were a native HTML element. This very simple concept has some
    very interesting implications. In fact, as you can do with any native HTML element,
    you can create your own Web Component by extending an existing Web Component.
    Let''s take a look at how it works.


    # [Defining an extended Web Component](#toc.xhtml_s112a)


    Consider the cookie alert component that we implemented so far. We want to create
    a variant of this component that has a property and an attribute that allows us
    to show or hide the `Close` button.


    We can create a new project by cloning and initializing the Web Component Builder
    project. Then, we can add the `cookie-alert-demo` Web Component to the project
    by running the following command:


    **`npm install andychiare/cookie-alert-demo`**


    Finally, we implement this new component as follows:


    `import CookieAlert from ''cookie-alert-demo'';`


    `class MyCookieAlert extends CookieAlert {`


    `constructor() {`


    `super();`


    `this._hasCloseButton = false;`


    `}`


    `get hasCloseButton() {`


    `return this._hasCloseButton;`


    `}`


    `set hasCloseButton(value) {`


    `this._hasCloseButton = value;`


    `this.setAttribute("closebutton", value);`


    `this.toggleCloseButton(value);`


    `}`


    `toggleCloseButton(visible) {`


    `const closeButton = super.shadowRoot.getElementById("closeButton");`


    `closeButton.style.display = (visible?` `"block": "none");`


    `}`


    `static get observedAttributes() {`


    `return ["closebutton"];`


    `}`


    `attributeChangedCallback(name, oldValue, newValue) {`


    `if (oldValue !== newValue) {`


    `if (name == "closebutton") {`


    `let isVisible = (newValue === "true" || newValue === "");`


    `this._hasCloseButton = isVisible;`


    `this.toggleCloseButton(isVisible);`


    `}`


    `}`


    `}`


    `connectedCallback() {`


    `super.connectedCallback();`


    `this.toggleCloseButton(this._hasCloseButton);`


    `}`


    `}`


    `customElements.define("my-cookie-alert", MyCookieAlert);`


    Let''s analyze each part of this code. The first line imports the `CookieAlert`
    class from the `cookie-alert-demo` module. The `MyCookieAlert` class definition
    inherits from this `CookieAlert` class. This is the main point: instead of inheriting
    from the `HTMLElement` class, as usual, we are building a new Web Component starting
    from the cookie alert component. The rest of the code should be easily understandable
    now.


    The `MyCookieAlert` class constructor calls `super()` and initializes the internal
    property `_hasCloseButton` with the false value:


    `constructor() {`


    `super();`


    `this._hasCloseButton = false;`


    `}`


    This means that this variant of the cookie alert component shouldn''t show the
    `Close` button, by default. Then, we have the definition of the getter and setter
    of the `hasCloseButton` property:


    `get hasCloseButton() {`


    `return this._hasCloseButton;`


    `}`


    `set hasCloseButton(value) {`


    `this._hasCloseButton = value;`


    `this.setAttribute("closebutton", value);`


    `this.toggleCloseButton(value);`


    `}`


    The setter calls the `toggleCloseButton()` method to change the button visibility.
    This method interacts with the shadow DOM of the base component to manage the
    button visibility:


    `toggleCloseButton(visible) {`


    `const closeButton = super.shadowRoot.getElementById("closeButton");`


    `closeButton.style.display = (visible?` `"block": "none");`


    `}`'
