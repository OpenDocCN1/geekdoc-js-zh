    # Chapter 1: Getting Started with Web Components


    The Web as a platform to build applications is already a consolidated reality.
    In this platform, standard technologies like HTML and CSS have the main goal to
    define the **User Interface (UI),** while JavaScript supports interactivity and
    client-side business logic. These are the traditional roles for these technologies,
    but it’s not always like that. In recent years, the need for customized UI elements
    has encouraged the birth of libraries and frameworks mainly based on JavaScript
    control. Among others, React, Angular, Vue are powerful libraries that allow you
    to create UI elements by using JavaScript. But the UI elements built with one
    library can’t be used within the context of the other library. So, usually, if
    you need the same component in a different context, you need to re-implement it.


    Is this the only way to create UI elements? Is there a way to create universal
    and reusable UI elements, regardless of the framework you are using to build your
    application?


    The answer to these questions is positive. Web components allow you to create
    UI elements using standard technologies and providing universal support.


    In this chapter, we will start by understanding how to design UI by using components,
    what Web Components are, and how they evolved in the history of web development.
    The chapter will introduce the standard technologies that build up the current
    Web Components specifications and discuss the current browser support. It also
    explains how to include third parties Web Components in a web application and
    how to support older browsers by using a few polyfills.


    ## Structure


    *   UI, components, and applications

    *   What is Web Components?

    *   Using a web component

    *   Browser support

    *   Using polyfills


    ## Objectives


    After reading this chapter, you will be able to design your web UI by using a
    component-based approach. You also will have a high-level understanding of what
    Web Components are, and will be able to include any existing Web Components in
    your HTML pages.


    ## UI, components, and applications


    UI plays a key role in modern applications. It is the main medium that allows
    the user to interact with the application’s functionalities. In the web context,
    the technologies to create a UI are standardized, but the demand for increasingly
    sophisticated interactivity generated the birth and spread of many UI libraries
    that are not compatible with each other. Web Components try to bring the need
    for this high sophisticated interactivity into the boundaries of the web standards.


    Before meeting the Web Components, however, let’s start by reasoning about UIs
    and how we might like to have them to simplify our design effort in the web context.


    ### 1. Decomposing UI


    UI is an aggregate of items displayed on a screen that helps the user to interact
    with an application. This could be an informal definition of a UI, but for a better
    understanding, let’s take a look at the following screenshot:


    ![](images/Fig_1.1.jpg)


    **Figure 1.1**


    This is the home page of the *Save the Children* organization’s website (**[https://www.savethechildren.org/](https://www.savethechildren.org/))**.
    Intuitively, you can identify several items on this page, each having a specific
    role. The user can easily identify such items to interact with the functionalities
    provided by the website.


    Let’s highlight some of these items in the following screenshot:


    ![](images/Fig_1.2.jpg)


    **Figure 1.2**


    You can see a few areas of the home page with a blue border. These bordered items
    represent elements of the UI that allows the user to interact with specific functionalities.
    So you have a bar on the top that allows you to manage your account, a bar with
    the navigation menu and the search box, an image inviting you to donate, and so
    on.


    These items compose the whole page; they are components of the page, which represent
    the UI.


    ### 2. What is a component?


    As you can see from the picture, the decomposition of the UI is quite arbitrary.
    Each one of us may choose a different approach to decompose the UI and find different
    sets of components. For example, someone may consider the top and navigation bar
    as one component. In contrast, someone else may consider the navigation bar as
    a set of independent components—one for the search box, one for the donate button,
    one for each menu, and so on.


    There is not a definitive rule to identify a UI element as a component. You may
    choose any element or group of elements of the page to define it as a component.
    It is definitively up to you.


    Anyway, you should keep in mind a couple of criteria to identify a UI element
    or a group of UI elements as a component:

