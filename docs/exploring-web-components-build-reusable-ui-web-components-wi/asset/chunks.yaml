    \ the `Accept` button:\n\n![](images/Figure_5.4.jpg)\n\n**Figure 5.4**\n\n# [Adding\
    \ onevent attributes](#toc.xhtml_s72a)\n\nIn addition to the `addEventListener()`\
    \ method, standard events allow you to specify a handler in the HTML markup via\
