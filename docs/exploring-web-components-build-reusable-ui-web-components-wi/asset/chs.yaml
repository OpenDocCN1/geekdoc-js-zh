  \n# 评论\n\n请留下评论。当您阅读并使用本书后，为什么不在您购买它的网站上留下评论呢？潜在读者可以看到并利用您公正的意见做出购买决定，我们 BPB 可以了解您对我们产品的看法，我们的作者也可以看到您对他们书籍的反馈。谢谢！\n\
  \n有关 BPB 的更多信息，请访问 [**www.bpbonline.com**](http://www.bpbonline.com/)。\n\n# 第 1\
  \ 章：Web 组件入门\n\nWeb 作为构建应用程序的平台已经是一个既成事实。在这个平台上，HTML 和 CSS 等标准技术的主要目标是定义**用户界面（UI）**，而\
  \ JavaScript 则支持交互性和客户端业务逻辑。这些是这些技术的传统角色，但并非总是如此。近年来，对自定义 UI 元素的需求催生了主要基于 JavaScript\
  \ 控制的库和框架的诞生。其中，React、Angular、Vue 等强大的库允许您使用 JavaScript 创建 UI 元素。但是，用一个库构建的 UI 元素不能在另一个库的上下文中使用。因此，通常如果您需要在不同上下文中使用相同的组件，您需要重新实现它。\n\
  \n这是创建 UI 元素的唯一方法吗？有没有一种方法可以创建通用且可重用的 UI 元素，而不管您用于构建应用程序的框架是什么？\n\n这些问题的答案是肯定的。Web\
  \ 组件允许您使用标准技术创建 UI 元素，并提供通用支持。\n\n在本章中，我们将首先了解如何使用组件设计 UI，什么是 Web 组件，以及它们在 Web 开发历史中是如何演变的。本章将介绍构成当前\
  \ Web 组件规范的标准技术，并讨论当前的浏览器支持。它还将解释如何在 Web 应用程序中包含第三方 Web 组件，以及如何使用一些 polyfill 来支持旧版浏览器。\n\
  \n## 结构\n\n*   UI、组件和应用程序\n*   什么是 Web 组件？\n*   使用 Web 组件\n*   浏览器支持\n*   使用 polyfill\n\
  \n## 目标\n\n阅读本章后，您将能够使用基于组件的方法设计您的 Web UI。您还将对什么是 Web 组件有一个高层次的理解，并能够在您的 HTML 页面中包含任何现有的\
  \ Web 组件。\n\n## UI、组件和应用程序\n\nUI 在现代应用程序中扮演着关键角色。它是允许用户与应用程序功能交互的主要媒介。在 Web 环境中，创建\
  \ UI 的技术是标准化的，但对日益复杂的交互性的需求催生了许多互不兼容的 UI 库的诞生和传播。Web 组件试图将这种高度复杂的交互性需求纳入 Web 标准的范畴。\n\
  \n然而，在了解 Web 组件之前，让我们先思考一下 UI 以及我们可能希望如何设计它们，以简化我们在 Web 环境中的设计工作。\n\n### 1. 分解 UI\n\
  \nUI 是屏幕上显示的一组项目，帮助用户与应用程序交互。这可能是 UI 的非正式定义，但为了更好地理解，让我们看看下面的截图：\n\n![](img/Fig_1.1.jpg)\n\
  \n**图 1.1**\n\n这是*救助儿童会*组织网站（**[`www.savethechildren.org/`](https://www.savethechildren.org/)**）的主页。直观地，您可以在此页面上识别出多个项目，每个项目都有特定的作用。用户可以轻松识别这些项目，以便与网站提供的功能进行交互。\n\
  \n让我们在下面的截图中突出显示其中一些项目：\n\n![](img/Fig_1.2.jpg)\n\n**图 1.2**\n\n您可以看到主页的几个区域带有蓝色边框。这些带边框的项目代表\
  \ UI 元素，允许用户与特定功能进行交互。因此，顶部有一个允许您管理帐户的栏，一个带有导航菜单和搜索框的栏，一个邀请您捐款的图片，等等。\n\n这些项目组成了整个页面；它们是页面的组件，代表了\
  \ UI。\n\n### 2. 什么是组件？\n\n从图片中可以看出，UI 的分解相当随意。我们每个人可能会选择不同的方法来分解 UI，并找到不同的组件集。例如，有人可能将顶部栏和导航栏视为一个组件。相反，其他人可能将导航栏视为一组独立的组件——一个用于搜索框，一个用于捐赠按钮，一个用于每个菜单，等等。\n\
  \n没有明确的规则来将 UI 元素识别为组件。您可以选择页面上的任何元素或元素组来将其定义为组件。这完全取决于您。\n\n无论如何，您应该记住几个标准来识别一个\
  \ UI 元素或一组 UI 元素作为一个组件：\n\n\n\n\n*   它们应具有特定且一致的职责\n*   它们应可复用\n\n如果你观察上图中带边框的项目，它们标识了具有特定职责的页面区域：\n\
  \n*   顶部栏允许用户管理其账户\n*   顶部栏下方的项目允许用户对网站执行全局操作，例如搜索词语或导航到不同区域\n*   导航区域下方的区域旨在邀请用户捐赠\n\
  *   包含最新新闻链接的区域\n*   注册区域\n*   特定任务区域\n\n如果你考虑这些区域，可能会意识到它们是一种自包含的单元。你可以移动页面上的项目，并用新布局重新排列页面。你也可以在另一个页面上复用它们中的每一个，甚至可能在任何其他网站上复用它们。\n\
  \n这就是组件的强大之处之一：拥有自己的身份，使你可以将它们视为一个单元。\n\n### 3. 组合组件\n\n作为具有特定职责的单元的能力并非组件的唯一特征。组件是更复杂实体的构建块，但生成的实体本身也可能是一个组件。如果你稍加思考，可能会意识到整个网页本身就是一个组件——它是网站或\
  \ Web 应用程序的一部分，并在该上下文中具有特定职责。\n\n因此，更一般地说，我们可以说一个组件可能包含其他组件，或者同样地，它可能由其他组件组成。例如，考虑以下截图中显示的组件：\n\
  \n![](img/Fig_1.3.jpg)\n\n**图 1.3**\n\n你可以将其视为一个自包含的组件，其职责是收集用户数据并允许他们注册。或者，你也可以将其视为一个基于其他组件聚合而成的组件，如下面的截图所示：\n\
  \n![](img/Fig_1.4.jpg)\n\n**图 1.4**\n\n上图中每个带边框的项目都有特定的职责——一个显示标题；一个获取用户的名字，等等。因此，每个项目都可以被视为一个组件，它们共同构建了一个新组件。\n\
  \n由你根据便利性决定如何将组件精确地分解为子组件，并将 UI 构建为组件的组合。在上面的例子中，你可以在另一个表单中复用文本框，因此你有具体的便利性将它们视为组件。\n\
  \n通常发生的情况是，UI 是多个组件的组合，几乎总是以层次结构组织。这种组件层次结构通常被称为**组件树**。\n\n### 4. 将组件映射到 HTML\n\
  \n上一节中进行的 UI 分解相当通用。它适用于任何类型的 UI。但让我们限制在 Web UI 实现上：\n\n*   你有多希望将每个检测到的组件直接映射到对应的\
  \ HTML 元素？\n*   你有多希望用更具描述性的 HTML 标记来定义上一节中显示的主页？\n\n请看以下标记：\n\n```\n<!DOCTYPE html>\n\
  <html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<!-- Style, script and other head\
  \ stuff -->\n</head>\n<body>\n<account-management-bar></account-management-bar>\n\
  <navigation-bar></navigation-bar>\n<front-cover></front-cover>\n<news-area></news-area>\n\
  <sign-up-form></sign-up-form>\n<mission-tile mission-id=”123”></mission-tile>\n\
  <mission-tile mission-id=”321”></mission-tile>\n</body>\n</html>\n```\n\n如你所见，上面的标记实际上是我们之前检测到的组件与一组假设的\
  \ HTML 元素之间的直接映射。这将是语义 HTML 的具体实现，即你的所有 HTML 标记应表示内容的意义，而非其外观。\n\n在最好的情况下，通常看到的标记类似于以下内容：\n\
  \n```\n<!DOCTYPE html>\n<html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<!-- Style,\
  \ script and other head stuff -->\n</head>\n<body>\n<div class=”account-management-bar”>\n\
  <div id=”…”>…</div>\n</div>\n<div class=”navigation-bar”>…</div>\n<div class=”front-cover”>…</div>\n\
  <div class=”news-area”>\n<ul>…</ul>\n…\n</div>\n<div class=”sign-up-form”><form>…</form></div>\n\
  <div>\n<div class=”mission-tile”>…</div>\n<div class=”mission-tile”></div>\n</div>\n\
  </body>\n</html>\n```\n\n在这里，标记并未表达每个元素的意义。你可以从 CSS 类中推断出来，但整个标记过于冗长且不易读。\n\n另一方面，如果你能使用像我们上面想象的那样简洁清晰的标记，你的\
  \ Web UI 将非常易读、可维护且可复用。简而言之，它将非常高效。\n\n这正是 Web 开发者多年来以多种方式寻求的东西。年复一年，随着`<blockquote>`、`<nav>`、`<video>`等新元素被添加到\
  \ HTML 标准中，我们有了越来越多的可能性以语义化方式表达标记。然而，这种方法进展缓慢，且提供的元素过于通用。它无法有效满足每个开发者的特定需求。\n\n\
  正如你将在下一节中看到的，你可以仅使用 Web 平台标准技术来构建自己的语义元素。\n\n## 什么是 Web 组件？\n\n如上一节所示，分解 Web UI\
  \ 似乎非常自然且可取。这是一种有效的方法，可以同时创建结构良好的 UI 和可复用的 UI 元素。此外，由于组件是一个通用概念，你可以通过组合其他组件来创建新组件，甚至可以将整个应用程序视为一个组件。\n\
  \n多年来，开发者一直在寻找一种自主扩展 HTML 功能的方法，以创建高级 UI 元素。他们的努力成果包括*jQuery UI、React、Angular、Vue*等库。所有这些库都提供了遵循组件模型创建\
  \ UI 元素的方法。\n\n这些库中有许多非常流行，每个库都提出了自己的创建 UI 组件的方法，并且每个库都以某种方式尝试将 UI 元素映射到标记。然而，它们有一些缺点：\n\
  \n*   它们不是标准\n*   它们不被浏览器原生支持\n*   它们不可互操作\n\n换句话说，使用这些库创建的 UI 组件只能用于支持相同库的项目。你不能用\
  \ React 创建一个组件并在 Angular 应用程序中使用它。如果你想创建一个既能在 React 应用程序中又能在 Angular 应用程序中使用的 UI\
  \ 元素，你需要实现该元素的两个版本。\n\nWeb 组件试图通过允许你使用浏览器原生支持的标准技术创建 UI 元素来克服这些缺点。\n\nWeb 组件是一组标准规范，用于创建可在网页和应用程序中复用的自定义\
  \ HTML 元素。这项技术原理的首次提及可追溯到*2011 年*，在阿姆斯特丹 Fronteers 会议上*Alex Russell*的演讲中。他的提议被 W3C\
  \ 采纳，并于*2012 年*发布了第一份*工作草案*。此后，标准化过程对原始想法进行了多次修改，因此我们随着时间的推移得到了两个不同版本的规范，分别标识为*v0*和*v1*。目前，Web\
  \ 组件不再基于单独的规范，而是引用 HTML 和**文档对象模型（DOM）**的标准，它们现在已成为这些标准不可分割的一部分。\n\nWeb 组件基于 Web\
  \ 技术的三个标准特性：\n\n*   **自定义元素：** 它们代表一组 JavaScript API，用于创建与特定 HTML 标签关联的自定义 DOM 元素。\n\
  \n\n\n\n\n* **Shadow DOM（影子 DOM）：** 一组 JavaScript API，用于管理组件特定的 DOM，独立于网页的 DOM。\n\
  * **HTML 模板（HTML templates）：** 这是对 HTML 规范的一种集成，允许你定义一些标记片段，这些片段在页面加载时不会被解释，而是在运行时被实例化。\n\
  \n借助 Web Components 技术，你可以扩展标准 HTML 元素，使其拥有自定义的外观和行为。你还可以创建自己的 HTML 标签，并在 HTML 页面中像标准元素一样使用它。所有这些都可以独立于你用来构建应用程序的\
  \ JavaScript 库或框架来完成。\n\n**你可能听说过 Web Components 所依赖的第四项技术：HTML Imports（HTML 导入）。**\n\
  \n**尽管它是一项官方活跃的 W3C 规范，但实际上没有任何浏览器支持它，因为它已被 ECMAScript 模块所取代。**\n\n**例如，以下文档声明 Chrome\
  \ 已弃用 HTML Imports：[`www.chromestatus.com/feature/5144752345317376`](https://www.chromestatus.com/feature/5144752345317376)**\n\
  \n## 使用 Web Component\n\n到目前为止，我们抽象地讨论了组件和 Web Components。现在是时候开始实际了解这项技术了。\n\n\
  让我们从想要使用现成组件的开发者的角度来探索 Web Components。你将在本书的后续部分学习如何构建自己的 Web Component。\n\n为了演示如何使用第三方开发的\
  \ Web Component，我们将引用一个允许你通过一定数量的星星进行评分的组件，类似于你在许多电子商务网站上看到的 UI 元素。\n\n请查看 *GitHub*\
  \ 上这个简单项目的文档，以了解更多关于该组件的信息 **- [`github.com/andychiare/rating-component`](https://github.com/andychiare/rating-component)**。\n\
  \n让我们从创建一个空的 HTML 页面开始，并引用组件的代码，如下面的标记所示：\n\n```\n<!DOCTYPE html>\n<html lang=”en”>\n\
  <head>\n<meta charset=”utf-8”>\n<script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n如你所见，我们添加了一个 script 元素，指向 `myRatings.js`\
  \ JavaScript 文件的公共 URL。该文件包含了组件的定义，但目前我们对实现不感兴趣。我们只想在网页上使用这个组件。\n\n**这是将库包含到项目中最简单的方法，但如果你的应用程序需要构建步骤，你也可以使用包管理器。我们稍后会深入讨论这一点。**\n\
  \n现在，你可以像使用标准元素一样，在 HTML 的 body 中直接使用 `my-rating` 标签：\n\n```\n<!DOCTYPE html>\n\
  <html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  </head>\n<body>\n<my-rating max-value=”6” value=”3”></my-rating>\n</body>\n</html>\n\
  ```\n\n`my-rating` 元素具有 `max-value` 和 `value` 属性，分别用于设置要显示的最大星星数量和表示你评分的当前星星值。\n\
  \n如你所见，`my-rating` 标签的使用方式与任何标准 HTML 标签相同，最重要的是，你无需安装任何 UI 框架即可获得此行为。\n\n要查看此标记的图形结果，你只需在\
  \ Web 浏览器中打开 HTML 页面。你应该会看到类似下面的页面：\n\n![](img/Fig_1.5.jpg)\n\n**图 1.5**\n\n**在这个特定的简单案例中，你可以使用\
  \ Web 浏览器从文件系统打开 HTML 页面。但通常情况下，最好使用 Web 服务器来提供页面服务。你可以选择任何你喜欢的 Web 服务器。我们建议使用 `http-server`，这是一个在\
  \ Node.js 环境中运行的零配置 Web 服务器。**\n\n**要在你的机器上安装 `http-server`，首先确保你已经安装了 Node.js，然后在终端窗口中输入以下命令：**\n\
  \n`npm install http-server -g`\n\n**安装完成后，你可以通过进入包含 HTML 文件的文件夹，并在终端窗口中输入以下命令来启动服务器：**\n\
  \n`http-server`\n\n**此命令将启动 Web 服务器，然后你可以通过将浏览器指向 http://localhost:8080 来查看你的页面。**\n\
  \n现在，当你点击其中一颗星星时，你点击的星星及其左侧的星星会变为填充状态，而右侧的星星会变为空白状态。这表示你的评分。\n\n如你所见，使用 Web Component\
  \ 就像使用任何标准 HTML 元素一样简单。你通过在其属性中设置值来配置元素，它就会相应地工作。\n\n你也可以通过 JavaScript 以编程方式使用该组件。例如，考虑以下代码：\n\
  \n```\n<!DOCTYPE html>\n<html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<script\
  \ src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  <script>\nwindow.onload = function() {\nconst myRating = document.getElementById(“myRatingComponent”)\n\
  myRating.maxValue = 10;\nmyRating.value = 2;\n};\n</script>\n</head>\n<body>\n<my-rating\
  \ id=”myRatingComponent”></my-rating>\n</body>\n</html>\n```\n\n在这个例子中，我们为元素分配了标识符\
  \ `myRatingComponent`，并通过使用 `getElementById()` 方法通过 JavaScript 访问它。我们还为属性 `maxValue`\
  \ 和 `value` 分配了新值，它们分别对应于 `max-value` 和 `value` 属性。这允许你在网页上拥有不同的初始外观。\n\n除了设置组件属性的初始值之外，你还可以将其视为一个普通的\
  \ HTML 元素。例如，你可以为其附加一个事件处理程序，如下例所示：\n\n```\n<!DOCTYPE html>\n<html lang=”en”>\n\
  <head>\n<meta charset=”utf-8”>\n<script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  <script>\nwindow.onload = function() {\nconst myRating = document.getElementById(“myRatingComponent”)\n\
  myRating.maxValue = 10;\nmyRating.value = 2;\nmyRating.addEventListener(“click”,\
  \ () => {\nalert(“Thanks for your feedback!”);\n});\n};\n</script>\n</head>\n<body>\n\
  <my-rating id=”myRatingComponent”></my-rating>\n</body>\n</html>\n```\n\n这里我们处理了\
  \ click 事件，以便当用户给出评分时，会显示一条感谢消息：\n\n![](img/Fig_1.6.jpg)\n\n**图 1.6**\n\n这些简单的例子只是让你从使用者的角度了解\
  \ Web Components 是什么。从下一章开始，你还将学习如何构建自己的 Web Component。\n\n## 浏览器支持\n\nWeb Components\
  \ 所依赖的技术是标准化的，也就是说，它们旨在被 Web 浏览器原生支持。不幸的是，尽管这些规范已经存在了一段时间，但直到最近它们才开始被大多数 Web 浏览器广泛采用。\n\
  \n为了了解这些技术最近和当前在主流浏览器中的支持状况，让我们看看 caniuse.com **([`caniuse.com/`](https://caniuse.com/))**\
  \ 的一些数据，这是一个监控 Web 技术采用情况的网站。\n\n第一组数据与 **Custom Elements（自定义元素）** 的支持有关。在撰写本文时，它们总结如下：\n\
  \n![](img/Fig_1.7.jpg)\n\n**图 1.7**\n\n这些数据显示，**Custom Elements** 得到了 **88.93%**\
  \ 的跟踪浏览器的支持，但只有 **73.69%** 的浏览器提供了完全支持。剩下的 **15.24%** 提供了部分支持。如果你查看图片，你会发现只有最新版本的浏览器支持这项技术。此外，一些仍然流行的浏览器没有支持或只有部分支持。\n\
  \n另一方面，**HTML Templates（HTML 模板）** 的支持范围更广，如下图所示：\n\n![](img/Fig_1.8.jpg)\n\n\n\n\
  \n\n**图 1.8**\n\n如你所见，**94.44%** 的受追踪浏览器支持该技术，仅有 **0.24%** 提供部分支持。\n\n最后，我们来看一下关于\
  \ **Shadow DOM** 支持的数据：\n\n![](img/Fig_1.9.jpg)\n\n**图 1.9**\n\n该技术拥有较高的支持率 **(89.25%)**，但并非完全支持。此外，**13.16%**\
  \ 的受追踪浏览器提供部分支持。\n\n综上所述，从 caniuse.com 获取的数据中，我们意识到最新版本的 Chrome、Firefox 和 Edge 对\
  \ Web Components 技术提供了广泛且稳定的支持。同时，移动浏览器也对其有良好的支持。\n\n然而，即使支持 Web Components 的技术正获得越来越广泛的支持，你也不能忽视某些浏览器（如\
  \ Opera 和 Safari）仍仅提供部分支持，而且用户并不总是使用最新版本的浏览器。\n\n## 使用 polyfills\n\n上一节描述的场景似乎并不那么令人鼓舞。即使现代浏览器对\
  \ Web Components 有很好的支持，但仍有一些浏览器不支持或仅提供部分支持。\n\n那么，我们能否认为 Web Components 技术已经足够成熟，可以用于生产环境？目前是否最好继续使用\
  \ React、Angular 和其他 UI 框架，因为它们能保证与旧浏览器的一定程度的向后兼容性？\n\n这些问题非常合理。你不能冒险让某些用户因浏览器支持不足而无法正常访问你的网站或应用程序。\n\
  \n幸运的是，你可以使用一些 polyfill 库来模拟浏览器尚未支持的功能。\n\n**Polyfill 是一个模块、一段代码片段或一个库，通常用 JavaScript\
  \ 编写，用于提供现代浏览器原生支持但旧浏览器不支持的功能。**\n\n为了解决某些浏览器缺乏支持或仅部分支持的问题，你可以通过以下 URL 引入开源社区提供的\
  \ polyfills：[`github.com/webcomponents/polyfills`](https://github.com/webcomponents/polyfills)\n\
  \n你可以使用完整的 `WebComponentsJS` polyfill 套件，也可以选择单独使用它们——用于自定义元素、Shadow DOM 或 HTML\
  \ 模板的 polyfill。此外，你可以选择通过 `npm` 将它们安装到开发环境中，或者通过 unpkg.com 内容分发网络（CDN）的未打包版本将其包含在\
  \ HTML 页面中，地址为 [`unpkg.com/browse/@webcomponents/webcomponentsjs/`](https://unpkg.com/browse/@webcomponents/webcomponentsjs/)。\n\
  \n让我们看看如何通过使用未打包版本来利用这些 polyfill。为此，我们将考虑前面章节中展示的评分组件示例，并添加未打包的 polyfill。以下是新的标记：\n\
  \n```\n<!DOCTYPE html>\n<html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<script\
  \ src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-bundle.js”></script>\n\
  <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  </head>\n<body>\n<my-rating max-value=”6” value=”3”></my-rating>\n</body>\n</html>\n\
  ```\n\n注意在评分组件脚本之前包含的脚本。它加载了 `webcomponents-bundle.js` 脚本，该脚本为不支持 Web Components\
  \ 技术的浏览器模拟这些技术。该脚本提供了一组通过特性检测激活的 polyfill；也就是说，只有当当前浏览器原生不支持相应特性时，才会执行其代码。尽管这种方法确保了浏览器特性的高效使用，但当浏览器提供部分\
  \ Web Components 技术支持时，加载该脚本实现的所有 polyfill 是不必要的。它应该只加载那些受支持的 polyfill。\n\n为了解决这个问题，你可以使用另一个脚本，该脚本根据当前浏览器缺失的功能仅加载必要的\
  \ polyfill。这个脚本叫做 `webcomponents-loader.js`，你可以用它代替 `webcomponents-bundle.js`，如下代码所示：\n\
  \n```\n<!DOCTYPE html>\n<html lang=”en”>\n<head>\n<meta charset=”utf-8”>\n<script\
  \ src=”https://unpkg.com/@webcomponents/webcomponentsjs/webcomponents-loader.js”></script>\n\
  <script src=”https://andychiare.github.io/cdn/rating-component/myRating.js”></script>\n\
  </head>\n<body>\n<my-rating max-value=”6” value=”3”></my-rating>\n</body>\n</html>\n\
  ```\n\n这将仅加载最少的可用 polyfill，以支持在部分支持的浏览器中启用 Web Components 的功能。\n\n当然，这些 polyfill\
  \ 无法保证在任何浏览器中都能实现 Web Components 技术。它们的支持目标是比较新的浏览器，所以不要指望它们能在例如 *Internet Explorer\
  \ 8* 上工作。\n\n## 结论\n\n在本章中，我们了解了组件是设计 UI 的一种便捷方式。它们让你专注于小功能块，并帮助你在同一应用的不同部分或其他应用中复用它们。我们还讨论了许多\
  \ JavaScript 库和框架推广了这种基于组件的 UI 构建方法，但它们彼此不兼容。然后，我们介绍了 Web Components 作为构建 UI 组件的标准原生替代方案，并了解了如何将它们包含在网页中。我们还讨论了浏览器对\
  \ Web Components 底层技术的支持情况，并展示了如何使用 polyfill 库在旧浏览器上模拟这些技术。\n\n通过阅读本章，你已经了解了什么是\
  \ Web Components，以及如何将现有的 Web Component 包含到你的网页中。此外，通过使用 polyfill，你还能确保你的网页在部分支持或不支持\
  \ Web Components 技术的浏览器中正确渲染。\n\n在下一章中，你将开始学习如何通过扩展现有 HTML 元素来实现你自己的 Web Component。\n\
  \n## 问题\n\n1.  什么是组件？\n\n2.  为什么组件在设计 UI 时很有用？\n\n3.  什么是 Web Components？\n\n4.\
  \  Web Components 依赖哪些标准技术？\n\n5.  与其他流行的 UI JavaScript 库相比，它们提供了哪些优势？\n\n6.  如何缓解旧浏览器缺乏\
  \ Web Components 技术支持的问题？\n\n# 第 2 章\n\n## 扩展 HTML 元素\n\n在上一章中，我们开始了解 Web Components\
  \ 并学习了如何使用它们。在本章中，你将学习如何构建自己的 Web Components。我们将首先简要讨论你需要设置的开发环境。然后，我们将介绍关于自定义元素的基本概念，并了解如何通过自定义标准行为来扩展原生\
  \ HTML 元素。在本章中，我们将创建一个自定义元素来说明这些新概念。\n\n## 结构\n\n*   设置开发环境\n\n*   自定义元素\n\n*  \
  \ 扩展原生元素\n\n*   Web 组件命名规则\n\n*   使用基于原生元素的自定义元素\n\n*   扩展原生元素的好处\n\n## 目标\n\n本章将为你提供基础知识，以便在创建\
  \ Web Component 时决定使用哪种开发环境。你将了解什么是自定义元素以及应该使用哪种类型。你将能够通过扩展现有标准 HTML 元素来创建新的自定义元素，并在不同的开发环境中使用它。你还将学习命名\
  \ Web Component 时应遵循的规则，并了解扩展标准 HTML 元素所带来的好处。\n\n## 设置开发环境\n\n\n\n\n\n在上一章中，我们通过\
  \ `<script>` 元素简单引用实现 Web 组件的文件，将其嵌入到 HTML 页面中。当时我们并未关心所使用的开发环境。\n\n现在，我们将实现第一个\
  \ Web 组件，因此考虑开发环境是合适的。通常，由于创建 Web 组件只需要 HTML、JavaScript 和 CSS，我们建议使用任何你感到舒适的开发环境。但你知道，近年来\
  \ JavaScript 开发的复杂性有所增加，这主要是由于一些需求所致，例如保持与旧浏览器的语言兼容性、支持 JSX 等语言扩展、为生产代码提供打包步骤等。鉴于这些可能性，你可能会想，为\
  \ Web 组件搭建开发环境的最佳方法是什么。\n\n好消息是，开发 Web 组件非常灵活，因此你可以将其集成到你偏好的方法中。在本节中，我们将介绍一些方法，但请将它们视为建议，而非约束。\n\
  \n### 编辑器\n\n选择编辑器始终是个人偏好问题。为了开发你的 Web 组件，你可以使用任何编辑器。你可以非常简约，例如使用操作系统自带的普通文本编辑器。然而，这可能不是最舒适的选择。\n\
  \n也许你可以使用更高级的编辑器或**集成开发环境（IDE）**，它们提供的功能远不止编写代码。通常，这些工具提供语法高亮、代码补全、代码片段、调试支持等功能。当然，这些功能以及其他特性有助于提高你的生产力。\n\
  \n你可以在众多高级编辑器或 IDE 中进行选择：Atom、Sublime Text、Visual Studio Code 等，仅举几例。使用你已经熟悉或感到舒适的工具即可。\n\
  \n### 无需构建的开发\n\n如前所述，近年来，JavaScript 开发者习惯于对代码进行构建步骤。这可能是出于多种原因，包括浏览器兼容性、使用扩展库、代码优化、打包等。\n\
  \n从 Web 组件的角度来看，你可以不使用任何构建步骤。你可以直接编写代码，并通过 `<script>` 元素将其包含在 HTML 页面中，或将其导入到另一个\
  \ JavaScript 模块中。\n\n这种方法带来了一些好处。你拥有一个简单的开发环境，无需外部工具和特定配置。你只需要你的代码和一个简单的 Web 服务器。\n\
  \n然而，它也有一些缺点。例如，你需要一个支持最新 JavaScript 特性的现代浏览器。在开发过程中这可能不是问题，但在生产环境中，你无法控制用户的浏览器。因此，即使这未来可能成为开发\
  \ Web 组件的标准方式，但如今，如果你的组件面向更广泛的用户群体，这可能有些风险。\n\n### 需要构建的开发\n\n通常，开发者选择构建他们的 JavaScript\
  \ 应用程序是出于几个原因。以下是一些最常见的动机：\n\n*   **转译**：此过程由工具（转译器）执行，将原始 JavaScript 代码转换为另一种形式，但仍然是\
  \ JavaScript。这种转换可能有多种原因。最重要的原因是将现代 JavaScript 代码转换为旧式 JavaScript，以便它也能在旧浏览器中运行。此外，转译允许你在代码中使用最新的\
  \ JavaScript 特性，即使你的浏览器尚未支持它们。同时，它也允许你运行非标准代码，如 JavaScript 语言扩展等。\n\n*   **减小应用程序体积**：此过程执行一些优化，例如移除未使用或不可达的代码（摇树优化），并将原始代码转换为更紧凑的版本（压缩）。目标是减小最终应用程序的体积，以便在网络中更快地传输。\n\
  \n*   **打包**：打包过程将多个文件合并为一个或更少的文件。这使得浏览器在加载你的应用程序时执行更少的 HTTP 请求。\n\n*   **代码拆分**：这与打包过程相反。它允许你将应用程序的代码拆分为多个文件（包），以便按需加载。这优化了网络带宽的使用和应用程序的启动时间。\n\
  \n这些是将构建步骤应用于应用程序开发过程的主要原因。根据特定应用程序的需求，可能还有其他原因。例如，你可能对样式转换应用预处理步骤，例如将 Sass 样式表转换为\
  \ CSS，或进行图像处理等。\n\n如果你决定为你的 Web 组件构建代码，你可以选择你偏好的转译器和打包器。Webpack 和 Rollup 可能是比较流行的选择，但最终选择权在你手中。\n\
  \n### Web 组件构建器项目\n\n为了本书的目的，也为了你自己的任何开发目的，你可以从以下 GitHub 仓库下载一个基于 Webpack 的预配置构建项目：**[`github.com/andychiare/web-components-builder`](https://github.com/andychiare/web-components-builder)。**\n\
  \n该项目名为 Web Components Builder，作为 Web 组件开发环境的项目模板。请确保你的计算机上安装了 Node.js，因为它依赖于该运行时。\n\
  \n你可以使用 git 获取 Web Components Builder 项目的副本。只需在终端窗口中输入以下命令：\n\n`git clone` [`https://github.com/andychiare/web-components-builder.git`](https://github.com/andychiare/web-components-builder.git)\n\
  \n你将获得项目内容，存放在名为 `web-components-builder` 的文件夹中。现在，进入该文件夹并输入以下命令安装所需的依赖项：\n\n`npm\
  \ install`\n\n此命令将在项目级别下载并安装 Webpack 以及所有必需的库。\n\n**在本书的其余部分，当我们提到克隆并初始化 Web Components\
  \ Builder 项目的副本时，我们将引用上述的** `git clone` **和** `npm install` **命令。**\n\n该项目附带了一个示例\
  \ Web 组件，即我们在第一章中使用的评分组件。下图显示了项目初始化后的文件和文件夹结构：\n\n![](img/Figure_2.1.jpg)\n\n**图\
  \ 2.1**\n\n示例 Web 组件旨在展示如何使用该项目。当你构建自己的 Web 组件时，需要更改 `src` 文件夹中 `index.js` 文件的内容，以及项目根文件夹中\
  \ `index.html` 文件的内容。你将在本章后面看到使用此项目模板的示例。\n\n要查看示例 Web 组件的运行效果，只需输入以下命令：\n\n`npm\
  \ start`\n\n几秒钟后，项目构建完成，你可以打开浏览器并访问 `http://localhost:8080`。你应该会看到类似下图所示的页面：\n\n\
  ![](img/Figure_2.2.jpg)\n\n**图 2.2**\n\n当你对你构建的 Web 组件感到满意时，可以创建该组件的生产就绪版本。如前所述，这意味着转译代码以获得更广泛的兼容性、减小体积、打包等。因此，通过输入以下命令来构建你的组件：\n\
  \n`npm run build`\n\n\n\n\n几秒钟后，你将在 `dist` 文件夹中获得构建过程的结果。在 Web Components Builder\
  \ 项目中，这一过程的结果还包括我们在第一章中讨论过的 polyfills，因此你的 Web Component 也能被较旧的浏览器所支持。\n\n在本书的后续部分，当我们需要使用构建环境时，我们将引用此项目，当然，你也可以自由创建并使用自己的构建环境。\n\
  \n## 自定义元素\n\n当我们在第一章介绍 Web Components 时，提到它们依赖于三项技术：自定义元素、Shadow DOM 和 HTML 模板。自定义元素技术是我们将要探索的第一项，或许在创建自己的\
  \ Web Component 时，它也是最显而易见的一项。\n\n实际上，自定义元素允许你定义自己的 HTML 元素，并使它们在你的 HTML 页面或 Web\
  \ 应用程序中可用。自定义元素在 HTML 页面的标记中像任何标准 HTML 元素一样通过标签来标识。此外，它们也可以像任何标准 HTML 元素一样通过 JavaScript\
  \ 访问。\n\n你可以创建两种类型的自定义元素：\n\n*   自定义原生元素\n\n*   自主自定义元素\n\n自定义原生元素是基于现有标准元素构建的自定义元素。基本上，它们扩展了标准\
  \ HTML 元素（如 `<img>`、`<button>`、`<input>` 等）的功能。\n\n自主自定义元素是从头开始构建的自定义元素。它们不扩展标准\
  \ HTML 元素，因此其行为完全由你的代码决定。\n\n在本章中，我们将探讨自定义原生元素。这意味着我们将通过扩展现有的标准 HTML 元素来开始创建自定义元素。\n\
  \n## 扩展原生元素\n\n像往常一样，在本书中，我们将通过实际构建来学习如何创建自定义原生元素。因此，我们将介绍创建自定义原生元素所需的概念和语法，通过构建一个新的\
  \ Web Component 来实现。我们要创建的组件是一个安全链接；即当链接指向的 URL 不安全（即未使用 HTTPS）时，会警告用户。因此，我们的组件本质上是一个标准的\
  \ `<a>` HTML 元素，并增加了这一功能。\n\n为了实现这一目标，创建一个名为 `secureLink.js` 的文件，并将以下代码放入其中：\n\n\
  ```\nclass SecureLink extends HTMLAnchorElement {\nconnectedCallback() {\nthis.addEventListener(\"\
  click\", (e) => {\nif (!this.href.startsWith(\"https\")) {\nif (!confirm(\"您即将导航到一个不安全的网站。是否继续？\"\
  )) {\ne.preventDefault();\n}\n}\n})\n}\n}\ncustomElements.define(\"secure-link\"\
  , SecureLink, {extends: \"a\"});\n```\n\n这段简单的代码定义了我们想要的自定义元素。让我们分析一下代码，了解它是如何工作的。\n\
  \n首先注意到的是，我们定义了一个名为 `SecureLink` 的 JavaScript 类，它继承自 `HTMLAnchorElement`。`HTMLAnchorElement`\
  \ 是表示 `<a>` HTML 元素的内置 DOM 类，因此我们继承了它附带的所有功能。\n\n该类定义了 `connectedCallback()` 方法。当该元素的实例被插入到\
  \ DOM 中时，此方法会自动调用。它是一组回调函数（也称为自定义元素反应）的一部分，这些回调会在组件生命周期的特定阶段自动调用。我们将在下一章中详细讨论它们。目前，我们只需要知道\
  \ `connectedCallback()` 方法会在我们的 Web Component 被添加到当前 HTML 页面的 DOM 之后被调用。\n\n`connectedCallback()`\
  \ 方法体中的代码非常简单：它为 click 事件添加了一个事件处理程序。该处理程序检查与元素关联的 URL 是否不以 `https` 字符串开头。如果是这种情况，则会向用户显示一个警告，如果用户确认，则导航停止。\n\
  \n你在 JavaScript 文件中看到的最后一条语句如下：\n\n`customElements.define(\"secure-link\", SecureLink,\
  \ {extends: \"a\"});`\n\n这条语句起着至关重要的作用。它将 `SecureLink` 类添加到当前浏览器窗口的自定义元素注册表中。`customElements`\
  \ 集合的 `define()` 方法执行此注册，它接受以下参数：\n\n*   **自定义元素的名称**：这是一个字符串，定义了在 HTML 标记中标识我们元素的名称。在我们的例子中，新元素将与\
  \ `secure-link` 名称关联。\n\n*   **实现自定义元素的类**：在我们的例子中，我们直接传递了 `SecureLink` 类。\n\n*\
  \   **选项**：一个可选对象，定义了元素的定义方式。目前仅支持 `extends` 选项：它指定要扩展的内置元素的名称。\n\n**请确保不要忘记注册你的\
  \ Web Component。仅定义类不足以创建你的组件。**\n\n如你所见，注册我们的 Web Component 非常简单。但你可能想知道为什么我们需要通过传递\
  \ `{extends: \"a\"}` 对象来指定我们正在扩展 `<a>` 元素。毕竟，我们刚刚通过扩展内置的 `HTMLAnchorElement` 类定义了\
  \ `SecureLink` 类。\n\n这种要求的原因在于，许多 HTML 元素共享相同的基类。例如，`<h1>` 和 `<h2>` 元素都扩展了 `HTMLHeadingElement`\
  \ 类，因此定义一个扩展此类的自定义元素不足以确定你实际想要扩展哪个 HTML 元素。\n\n另一方面，当你想要通过扩展原生元素来创建自己的自定义元素时，你需要知道要扩展的基类是什么。以下是常见\
  \ HTML 元素及其基类的列表：\n\n| **元素** | **基类** |\n| --- | --- |\n| `<a>` | `HTMLAnchorElement`\
  \ |\n| `<audio>` | `HTMLAudioElement` |\n| `<b>` | `HTMLElement` |\n| `<blockquote>`\
  \ | `HTMLQuoteElement` |\n| `<body>` | `HTMLBodyElement` |\n| `<br>` | `HTMLBRElement`\
  \ |\n| `<button>` | `HTMLButtonElement` |\n| `<canvas>` | `HTMLCanvasElement` |\n\
  | `<div>` | `HTMLDivElement` |\n| `<em>` | `HTMLElement` |\n| `<form>` | `HTMLFormElement`\
  \ |\n| `<h1>, <h2>, <h3>,…` | `HTMLHeadingElement` |\n| `<head>` | `HTMLHeadElement`\
  \ |\n| `<html>` | `HTMLHtmlElement` |\n| `<i>` | `HTMLElement` |\n| `<img>` | `HTMLImageElement`\
  \ |\n| `<input>` | `HTMLInputElement` |\n| `<label>` | `HTMLLabelElement` |\n| `<li>`\
  \ | `HTMLLIElement` |\n| `<ol>` | `HTMLOListElement` |\n| `<p>` | `HTMLParagraphElement`\
  \ |\n| `<select>` | `HTMLSelectElement` |\n| `<span>` | `HTMLSpanElement` |\n| `<table>`\
  \ | `HTMLTableElement` |\n| `<td>` | `HTMLTableCellElement` |\n| `<textarea>` |\
  \ `HTMLTextAreaElement` |\n| `<tr>` | `HTMLTableRowElement` |\n| `<ul>` | `HTMLUListElement`\
  \ |\n| `<video>` | `HTMLVideoElement` |\n\n**表 2.1**\n\n完整列表请参考以下地址的官方文档：**[`html.spec.whatwg.org/multipage/indices.html#element-interfaces`](https://html.spec.whatwg.org/multipage/indices.html#element-interfaces)**。\n\
  \n### Web Components 命名规则\n\n在了解如何使用我们刚刚定义的 Web Component 之前，我们先花点时间讨论一下如何命名你的元素。\n\
  \n**请注意，自定义元素的名称并不是实现它的类的名称。**\n\n类名标识自定义元素的实现，而自定义元素的名称是你传递给 `customElements.define()`\
  \ 方法的字符串。它在 HTML 标记中标识你的自定义元素。\n\n\n\n\n\n在上一节描述的示例中，我们将自定义元素命名为 `secure-link`。名称中包含连字符并非偶然。实际上，根据规范，自定义元素的名称必须包含一个连字符。因此，`securelink`\
  \ 不是有效名称，而 `secure-link` 是有效的。\n\n这种技巧让 HTML 解析器能够区分常规元素和自定义元素，并避免与未来新增的标准标签产生冲突。然而，即使包含至少一个连字符的名称对自定义元素来说是合法的，你也不能使用以下任何名称：\n\
  \n*   `annotation-xml`\n*   `color-profile`\n*   `font-face`\n*   `font-face-src`\n\
  *   `font-face-uri`\n*   `font-face-format`\n*   `font-face-name`\n*   `missing-glyph`\n\
  \n这些是 SVG 和 MathML 的保留名称。\n\n自定义元素名称中必须包含连字符的要求，让你有机会以某种命名空间的方式命名元素，并避免与第三方创建的自定义元素冲突。即使这不是强制要求，你也应该考虑为自定义元素名称添加一个希望唯一的**前缀**。例如，如果你正在构建自己的自定义元素库，并希望将其命名为\
  \ foo，你可以使用 `foo-` 前缀来命名元素。这样你就可以得到像 `foo-input`、`foo-link`、`foo-image` 等名称。\n\n\
  ### 使用基于原生元素的自定义元素\n\n现在，你已经有了自己的 `secure-link` Web 组件，并希望在 Web 应用程序中使用它。你有几种使用方式，主要取决于你正在构建的应用程序或网站的类型。让我们看看两种常见的方式：在\
  \ HTML 页面中包含，或在 JavaScript 模块中导入。\n\n### 在 HTML 页面中包含\n\n在你的网站中使用组件的最简单方法是将 JavaScript\
  \ 脚本包含在 HTML 页面中，如下所示：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
  \ charset=\"utf-8\">\n<script src=\"secureLink.js\"></script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n然后，要使用你的组件，你需要在 HTML 页面的 body 中添加以下代码：\n\n```\n<a is=\"\
  secure-link\" href=\"http://www.wikipedia.org\">Wikipedia</a>\n```\n\n如你所见，这里我们使用\
  \ Web 组件的方式与第一章中介绍的 `my-rating` 组件不同。在 `my-rating` 组件的情况下，我们将该名称用作标签，而这里我们将组件名称用作\
  \ `<a>` HTML 元素的 `is` 属性的值。这是从标记角度区分自主自定义元素和自定义原生元素的宏观差异。这里我们要表达的是，我们的元素是一个 `<a>`\
  \ HTML 元素，并附加了 `secure-link` 扩展提供的额外功能。在下一节中，我们将更深入地讨论这种方法背后的原因，以及使用自定义原生元素的好处。现在，我们先记下这一点，看看新页面的效果，其完整代码如下所示：\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<script\
  \ src=\"secureLink.js\"></script>\n</head>\n<body>\n<a is=\"secure-link\" href=\"\
  http://www.wikipedia.org\">Wikipedia</a>\n</body>\n</html>\n```\n\n现在，用浏览器打开该页面。你应该会看到一个空白页面，其中包含一个指向\
  \ Wikipedia 网站的链接。点击该链接，你应该会看到一个警告窗口，提示你即将导航到一个不安全的网站，如下图所示：\n\n![](img/Figure_2.3.jpg)\n\
  \n**图 2.3**\n\n只有当你同意导航到该链接时，浏览器才会加载 Wikipedia 的主页。如果你不同意，你将按预期停留在当前页面。\n\n现在，你拥有了标准\
  \ `<a>` HTML 元素的自定义版本。\n\n如果你回顾一下自定义元素的实现，你会发现它在处理安全需求的方式上还有改进空间。当然，你说得对，但这并不是实现的重点。这里我们只是专注于如何通过扩展原生元素来创建自己的自定义元素。\n\
  \n### 在 JavaScript 模块中导入\n\n到目前为止，我们展示了一种非常简单的方法，将代码包含在 HTML 页面中并使用自定义元素。但你可能遇到不同的场景，比如当你拥有构建环境，或者正在构建一个复合\
  \ Web 组件时（我们将在后续章节中讨论）。在这些场景中，你可能正在使用 JavaScript 模块，并且希望导入一个 Web 组件，而无需在 HTML 页面中显式添加脚本。\n\
  \n为了更好地解释如何处理这些场景，让我们考虑典型的**单页应用程序（SPA）**场景，其中几乎所有 UI 都是由 JavaScript 代码动态构建的。在这种上下文中，通常你只有一个\
  \ HTML 页面，引用一个负责加载应用程序其余部分（可能按需加载）的 JavaScript 文件。\n\n为了使这个场景更具体，请克隆并初始化我们之前提到的\
  \ Web Components Builder 项目，然后开始一个新项目。现在，将根文件夹中 HTML 页面的内容替换为以下标记：\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>Web Components with Webpack Starter Kit</title>\n\
  <script src=\"./bundle.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
  如你所见，这是一个空的 HTML 页面，只有一个对 `bundle.js` 文件的脚本引用。这个 `bundle.js` 文件将是对 `src` 文件夹内容进行构建过程的结果。\n\
  \n现在，将上一节创建的 `secureLink.js` 文件（包含原生自定义元素实现）添加到 `src` 文件夹中。最后，将 `index.js` 文件的内容替换为以下代码：\n\
  \n```\nimport \"./secureLink\";\n\nwindow.onload = function() {\n  const secureLink\
  \ = document.createElement(\"a\", {is:\"secure-link\"});\n  secureLink.setAttribute(\"\
  href\", \"http://www.wikipedia.org\");\n  secureLink.innerText = \"Wikipedia\";\n\
  \  document.body.appendChild(secureLink);\n};\n```\n\n让我们看看这段代码在做什么。\n\n第一行导入了我们的\
  \ `secure-link` 组件。如你所见，这是一个带有副作用的简单导入。这意味着通过导入 `secureLink.js` 文件，整个代码将被执行，而无需将任何结果显式绑定到任何变量或常量。因此，在这一行之后，`secure-link`\
  \ 组件已注册并可用，无需在 HTML 页面中添加 `<script>` 标签。\n\n然后，你为当前窗口浏览器的 `onload` 事件绑定了一个监听器。这意味着当\
  \ HTML 页面在窗口浏览器中加载时，该函数将创建 `secure-link` 组件的一个实例，对其进行配置，并将其附加到 HTML 页面的 body 中。\n\
  \n让我们重点看一下 `secure-link` 组件实例是如何创建的。示例中使用的语句如下：\n\n```\nconst secureLink = document.createElement(\"\
  a\", {is:\"secure-link\"});\n```\n\n我们使用了 document 对象的典型 `createElement()` 方法，并指定了要创建元素的标签名称。然而，与通常的方式不同，我们动态创建了一个\
  \ HTML 元素；在这种情况下，我们添加了第二个参数。这个参数是一个对象，指定了我们想要创建的 `<a>` 元素是由 `secure-link` 定义自定义的。这使我们能够获得\
  \ Web 组件的一个实例。\n\n**某些浏览器允许你将字符串作为** `createElement()` **方法的第二个参数。这是为了向后兼容旧版本的自定义元素规范。**\n\
  \n**这种方法已被弃用，因此请使用基于对象的方法。**\n\n\n\n\n\n现在，打开终端窗口，进入项目根目录，输入 `npm start` 命令来运行你的组件。如果你打开浏览器并访问\
  \ `http://localhost:8080`，应该会看到与之前相同的结果：一个指向维基百科主页的链接，点击时会警告你关于安全性的问题。\n\n### 定义基于函数的自定义元素\n\
  \n我们使用 ECMAScript 2015 规范引入的类语法定义了自定义元素。作为一名 JavaScript 开发者，你知道类本质上是构造函数和原型的语法糖。因此，你可能会想，是否可以使用函数来定义自定义元素，而不是基于类的语法。\n\
  \n答案是肯定的，但有一些注意事项。以下代码是我们之前定义的 `secure-link` 元素的等效实现：\n\n```\nfunction SecureLink()\
  \ {\n\nreturn Reflect.construct(HTMLAnchorElement, [], this.constructor);\n\n}\n\
  \nSecureLink.prototype = Object.create(HTMLAnchorElement.prototype);\n\nSecureLink.prototype.constructor\
  \ = SecureLink;\n\nObject.setPrototypeOf(SecureLink, HTMLAnchorElement);\n\nSecureLink.prototype.connectedCallback\
  \ = function() {\n\nthis.addEventListener(\"click\", (e) => {\n\nif (!this.href.startsWith(\"\
  https\")) {\n\nif (!confirm(\"You are about to navigate to an unsafe site. Do you\
  \ want to continue?\")) {\n\ne.preventDefault();\n\n}\n\n}\n\n});\n\n}\n\ncustomElements.define(\"\
  secure-link\", SecureLink, {extends: \"a\"});\n```\n\n如你所见，我们定义了 `SecureLink()`\
  \ 函数，为其原型分配了从 `HTMLAnchorElement` 继承所需的所有内容，并附加了 `connectedCallback()` 方法。这段代码比基于类的版本略显冗长。但这并不是唯一需要注意的地方。你应该注意到\
  \ `SecureLink()` 函数是如何定义其对 `HTMLAnchorElement` 的继承关系的：\n\n```\nfunction SecureLink()\
  \ {\n\nreturn Reflect.construct(HTMLAnchorElement, [], this.constructor);\n\n}\n\
  ```\n\n通常，你会使用父类或父对象的 `apply()` 方法。而在这里，你使用的是 `Reflect` 对象的 `construct()` 方法。这一事实将自定义元素的定义与\
  \ ECMAScript 2015 特性绑定在一起，因为 `Reflect` 对象是在该规范中引入的。因此，如果你打算使用基于函数的方法来定义自定义元素，以便兼容旧版本的\
  \ JavaScript 引擎，那你就错了。你仍然需要一个 polyfill，至少是针对 `Reflect` 对象的。\n\n**作为一般性建议，即使你可以使用基于函数的定义来创建自定义元素，也不推荐这种做法，而应优先使用基于类的语法。**\n\
  \n### 扩展原生元素的好处\n\n在创建 Web 组件时，通过扩展原生元素来创建自定义元素应该是首选方法。事实上，这种方法为你带来了几个好处：\n\n* \
  \  **与旧版浏览器的兼容性**：不支持 Web 组件技术的浏览器仍然可以访问组件的基本功能。例如，考虑本章中创建的 `secure-link` 组件及其在\
  \ HTML 页面中的使用：\n\n    `<a is=\"secure-link\" href=\"http://www.wikipedia.org\">Wikipedia</a>`\n\
  \n    如果浏览器无法解析 `is` 属性，它将被忽略。因此，你将失去链接上的安全检查，但组件仍然可以正常工作，只是一个普通的链接。\n\n*   **在禁用\
  \ JavaScript 时的可用性**：当然，当用户在浏览器中禁用 JavaScript 时，你会得到与上一点相同的保守行为。你仍然拥有一个没有扩展功能的普通链接。\n\
  \n*   **编码简单**：扩展原生元素通常只需要几行代码。你只需要实现想要添加到原生元素中的功能，而它的标准行为是免费获得的。这与自主自定义元素的实现不同，我们将在下一章中看到。\n\
  \n鉴于这些好处，当你准备创建自己的 Web 组件时，应该始终问自己：它能否作为原生元素的扩展来实现？如果可能，这应该是首选方案。\n\n## 结论\n\n在本章中，我们开始探索构建自己的\
  \ Web 组件的方法。我们讨论了设置开发环境的选项，并介绍了一个基于构建流程的模板项目。然后，我们介绍了自定义元素，并重点讨论了扩展原生 HTML 元素。我们还讨论了如何在开发环境中使用这个组件，以及自定义原生\
  \ HTML 元素的好处。\n\n阅读本章后，你将能够决定哪种开发环境更适合创建自己的 Web 组件。你还能够自定义原生 HTML 元素，并知道如何正确命名它们。此外，你学会了如何在有构建流程和无构建流程的开发环境中使用你的\
  \ Web 组件。最后，你现在了解了当你选择这种方法构建组件时，扩展原生 HTML 元素所带来的好处。\n\n在下一章中，我们将讨论何时以及如何创建自主自定义元素，同时探索一些与自定义原生元素共有的新特性。\n\
  \n## 问题\n\n1.  构建流程在开发环境中带来了哪些好处？\n\n2.  什么是自定义元素？\n\n3.  自定义原生元素和自主自定义元素有什么区别？\n\
  \n4.  `customElements.define()` 方法的作用是什么？\n\n5.  命名自定义原生元素有哪些限制？\n\n6.  如何在 HTML\
  \ 页面的标记中使用自定义原生元素？\n\n7.  如何在带有构建流程的开发环境中使自定义原生元素可用？\n\n8.  将 Web 组件实现为自定义原生元素有哪些好处？\n\
  \n# 第 3 章\n\n## 创建自定义 Web 组件\n\n在上一章中，我们学习了如何自定义标准 HTML 元素。在本章中，我们将更进一步，创建不严格基于已知\
  \ HTML 元素的 Web 组件。这种 Web 组件被称为**自主自定义元素**，它将让你构建全新的组件，其行为完全由你的想象力决定。像往常一样，你将通过构建一个具体的自主自定义元素来学习如何创建这种类型的组件。在本章中，你将搭建组件的基础，我们将在本书的其余部分中完成它。\n\
  \n## 结构\n\n*   从头开始创建 Web 组件\n\n*   添加 CSS 和标记的基本技术\n\n*   Web 组件的生命周期\n\n*   使用自定义\
  \ Web 组件\n\n## 目标\n\n本章将教你什么是**自主自定义元素**，以及它与**自定义原生元素**的区别。你将学习如何搭建一个简单的组件，以及如何使用一些基本技术通过标记和\
  \ CSS 创建其用户界面。此外，你还将学习关于 Web 组件生命周期的一些概念，以及如何利用它们来处理组件的生命周期。你将了解在组件生命周期的哪些步骤允许进行某些操作，以及何时不能。最后，你将发现你和其他开发者如何在自己的网页或\
  \ Web 应用程序中使用你的组件。\n\n## 从头开始创建 Web 组件\n\n从上一章中，你已经知道如何通过扩展原生 HTML 元素来构建自己的 Web\
  \ 组件。你学会了改变现有标准 HTML 元素的行为以适应你的需求是多么简单。\n\n\n\n\n\n然而，并非你为 Web 应用或网站设想的 UI 元素总能通过简单扩展原生\
  \ HTML 元素来实现。尽管我们说过，在实现自己的 Web Component 时，扩展原生 HTML 元素应是首选方案，但有些情况下，你需要的 UI 组件与任何原生\
  \ HTML 元素都不相似，或是原生元素的组合。这时，你需要实现自己的自主自定义元素。\n\n### 介绍 cookie 提醒项目\n\n为了更好地说明哪些情况下你可能需要将\
  \ Web Component 实现为自主自定义元素，我们将构建一个具体的自定义 Web Component——一个 cookie 提醒 Web Component。\n\
  \n这是你在浏览网页时肯定注意过的组件之一。事实上，几乎所有网站都会显示一个提醒、横幅、弹窗或类似内容，告知你其涉及个人数据的 cookie 管理政策。在某些国家，这是法律要求的，但许多网站提供这些信息只是为了透明。\n\
  \n也许这些组件大多是通过使用最常见的 UI 库（如 React、Vue 或 Angular）构建的。因此，它们需要根据每个网站所基于的 UI 库重新实现。相反，我们将把这样一个组件构建为\
  \ Web Component，这样无论用于构建其余 Web UI 的 UI 库是什么，它都可以使用。\n\n如前一章所述，你可以使用 *Web Component\
  \ Builder* 项目作为模板项目，为 cookie 提醒 Web Component 设置开发环境。因此，在你的机器上克隆并初始化它。\n\n**请记住，克隆并初始化\
  \ Web Component Builder 项目意味着使用 `git clone` 和 `npm install` 命令，如前一章所述。**\n\n###\
  \ 一个最小的自主自定义元素\n\n让我们开始构建我们的 cookie 提醒组件，并在此过程中学习自主自定义元素。因此，假设你已经初始化了 Web Component\
  \ 项目，打开 `src` 文件夹中的 `index.js` 文件，并将其内容替换为以下代码：\n\n```\nclass CookieAlert extends\
  \ HTMLElement {\nconstructor() {\nsuper();\n}\nconnectedCallback() {\nthis.innerText\
  \ = \"This website uses cookies to ensure you get the best experience\";\n}\n}\n\
  customElements.define(\"cookie-alert\", CookieAlert);\n```\n\n如前一章所述，自主自定义元素是从头开始构建的元素。它不扩展标准的、众所周知的\
  \ `HTML 元素`，但无论如何，它是作为一个扩展 `HTMLElement` 的类来实现的。`HTMLElement` 类是任何 HTML 元素的基类。它赋予你的组件被添加到\
  \ DOM 的能力，以及一些我们稍后会发现的更多功能。\n\n如你所见，`CookieAlert` 类有一个构造函数，它调用了基类的 `super()` 方法。根据规范，这对于使你的自定义元素正常工作非常重要。因此，在实现自主自定义元素时，不要忘记调用它。\n\
  \n你已经知道 `connectedCallback()` 方法。当该元素的实例被添加到 DOM 时，它会自动被调用。在这种情况下，一个文本将被赋值给元素的 `innerText`\
  \ 属性。当然，这还不是我们想要的 cookie 提醒，只是一个非常简单的 Web Component，显示文本“我是 cookie 提醒！”。\n\n最后一行将我们的组件添加到自定义元素注册表中。与自定义原生元素的情况不同，这里我们不需要指定第三个参数，因为我们没有扩展原生\
  \ HTML 元素。这里我们只是告诉注册表，`cookie-alert` Web Component 由 `CookieAlert` 类实现。\n\n下一步是通过更改\
  \ `index.html` 页面的内容来使用这个简单的组件。因此，打开项目根文件夹中的 `index.html` 文件，并将其内容替换为以下标记：\n\n```\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with Webpack Build System</title>\n\
  <script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n<script src=\"\
  ./bundle.js\"></script>\n</head>\n<body>\n<h1>Here is your Web Component</h1>\n\
  <cookie-alert></cookie-alert>\n</body>\n</html>\n```\n\n如你所见，与自定义原生元素的情况不同，这里我们使用\
  \ `cookie-alert` 标签来指定我们的自主自定义元素。这是两种自定义元素之间的一个显著区别。\n\n**请记住，我们为自定义原生元素看到的命名规则同样适用于自主自定义元素。**\n\
  \n如果你在终端窗口中输入 `npm start` 运行项目，然后将浏览器指向 `http://localhost:8080` 地址，你应该会看到类似以下截图的内容：\n\
  \n![](img/Figure_3.1.jpg)\n\n**图 3.1**\n\n你拥有了一个全新的基础自主自定义元素。\n\n### 添加 CSS 和标记的基本技术\n\
  \n到目前为止，你创建的组件让你对如何构建自主自定义元素有了一个非常基本的了解。但当然，这不是我们计划构建的组件。由于自主自定义元素继承自 `HTMLElement`，它在\
  \ UI 方面没有特定的内容。我们需要从头开始创建它的图形外观。在到目前为止构建的组件中，我们只是通过使用 `innerText` 属性显示了一个文本。要构建我们的\
  \ cookie 提醒组件，我们需要更进一步。\n\n因此，让我们开始更改 `src` 文件夹中 `index.js` 文件的内容，如下代码所示：\n\n```\n\
  const styleMarkup = ‘\n<style>\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color:\
  \ rgb(35, 122, 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n</style>‘;\nconst componentMarkup\
  \ = ‘\n<div class=\"container footer\">\n<span>This website uses cookies to ensure\
  \ you get the best experience</span>\n</div>‘;\nclass CookieAlert extends HTMLElement\
  \ {\nconstructor() {\nsuper();\n}\nconnectedCallback() {\nthis.innerHTML = styleMarkup\
  \ + componentMarkup;\n}\n}\ncustomElements.define(\"cookie-alert\", CookieAlert);\n\
  ```\n\n我们定义了两个常量——`styleMarkup` 和 `componentMarkup`。第一个是一个字符串，包含包裹在 style 元素中的一些\
  \ CSS 规则。第二个是一个字符串，包含一个使用 `styleMarkup` 常量中定义的 CSS 类的 div 元素。这两个字符串被拼接并赋值给我们的 `CookieAlert`\
  \ 组件的 `innerHTML` 属性。简单来说，我们通过使用标准 HTML 和 CSS 构建组件的 UI，并将其附加到通用 HTML 元素的 `innerHTML`\
  \ 属性上。\n\n如果你在实现的这个阶段运行项目，你应该会在浏览器中看到以下内容：\n\n![](img/Figure_3.2.jpg)\n\n**图 3.2**\n\
  \n如你所见，我们的组件开始成形。\n\n在到目前为止展示的示例中，你使用了字符串来定义 Web Component 的 UI。当然，这只是定义它的一种技术。你几乎可以使用任何可能的技术来构建组件的\
  \ UI。例如，你可以使用 DOM API 而不是字符串来获得相同的结果。\n\n以下是使用 DOM API 构建组件 UI 的示例：\n\n```\nconst\
  \ styleRules = ‘\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color: rgb(35,\
  \ 122, 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}‘;\nclass CookieAlert extends\
  \ HTMLElement {\nconstructor() {\nsuper();\n}\nconnectedCallback() {\nthis.createComponent();\n\
  }\ncreateComponent() {\nconst style = document.createElement(\"style\");\nstyle.appendChild(document.createTextNode(styleRules));\n\
  ```\n\n\n\n\n\n```javascript\nthis.appendChild(style);\nconst span = document.createElement(\"\
  span\");\nspan.innerText = \"This website uses cookies to ensure you get the best\
  \ experience\";\nconst div = document.createElement(\"div\");\ndiv.classList.add(\"\
  container\", \"footer\");\ndiv.appendChild(span);\nthis.appendChild(div);\n}\n}\n\
  customElements.define(\"cookie-alert\", CookieAlert);\n```\n\n在这里，你只需将 CSS 规则定义为一个字符串，并通过\
  \ `createComponent()` 方法构建所有标记。该方法使用 `createElement()`、`appendChild()`、`createTextNode()`\
  \ 等方法动态生成所需的标记。\n\n在这个特定示例中，结果与之前相同。但请记住，在某些情况下，静态字符串不足以定义组件的标记。你可能需要根据某些参数动态生成标记。在这种情况下，使用\
  \ DOM API 可能是必要的。我们将在后续章节中看到这一点。\n\n**这里我们介绍了两种构建 Web 组件外观的方法——一种基于字符串表示的标记，另一种基于\
  \ DOM API 的使用。虽然这两种方法在我们提供的示例中都能正常工作，但它们并不是构建组件 UI 的最佳实践。**\n\n**我们将在 *第 7 章* 中讨论\
  \ HTML 模板时，看到一种更好的方法。**\n\n## Web 组件的生命周期\n\n在构建组件时，我们定义了 `connectedCallback()`\
  \ 方法，并提到当组件被添加到 DOM 时，该方法会自动调用。该方法属于一组回调函数，也称为**自定义元素反应**，它们在组件生命周期的特定阶段自动调用。\n\n\
  下图展示了自定义元素生命周期中可能发生或可能出现的阶段：\n\n![](img/Figure_3.3.jpg)\n\n**图 3.3**\n\n每当组件处于这些阶段之一时，浏览器会在你的\
  \ Web 组件中查找特定方法，如果定义了该方法，则调用它。这些反应允许你适当地定义自定义元素的行为。\n\n让我们看看你可以实现哪些方法来捕获自定义元素生命周期的每个阶段。\n\
  \n### 构造函数\n\n组件的构造函数严格来说并不是自定义元素反应。它是用于初始化任何 JavaScript 对象实例（不仅仅是 HTML 元素）的标准方法。如前所述，对于自主自定义元素，构造函数是必需的，并且你期望它在自定义元素的生命周期中只被调用一次。这确实是事实，但从技术角度来看，它可能在两种情况下发生：当自定义元素被创建时，以及当它被升级时。让我们解释这两种情况。\n\
  \n当自定义元素被完全定义后，隐式或显式地构建其实例时，该自定义元素即被创建。\n\n我们说一个自定义元素被完全定义，是指你已经定义了实现它的类，并且通过 `customElements.define()`\
  \ 方法为其关联了一个标签。\n\n一旦你的自定义元素被完全定义，当 HTML 解析器在页面标记中找到与该自定义元素关联的标签时，它就会被隐式创建。例如，当 HTML\
  \ 解析器在 HTML 页面中找到 `<cookie-alert></cookie-alert>` 标记时，你的 cookie 警告组件就会被隐式创建。\n\n\
  另一方面，显式创建发生在通过 JavaScript 代码创建组件实例时，例如使用 `new` 运算符，如下例所示：\n\n```javascript\nconst\
  \ cookieAlert = new CookieAlert();\n```\n\n显式创建也发生在使用 `document.createElement()`\
  \ 方法创建自定义元素实例时，如下所示：\n\n```javascript\nconst cookieAlert = document.createElement(\"\
  cookie-alert\");\n```\n\n当通过 `customElements.define()` 注册自定义元素的操作没有紧跟在类定义之后时，该自定义元素会被升级。换句话说，之前创建情况中步骤的顺序没有被严格遵守。\n\
  \n让我们通过一个例子来解释。假设你已经为你的 cookie 警告自定义元素定义了 `CookieAlert` 类，但尚未使用 `customElements.define()`\
  \ 注册它。\n\n现在，你可以像下面这样创建 cookie 警告的实例：\n\n```javascript\nconst cookieAlert = document.createElement(\"\
  cookie-alert\");\n```\n\n由于你尚未注册 `cookie-alert` 标签，因此将创建一个未知的 HTML 元素，即内置类 `HTMLUnknownElement`\
  \ 的实例。\n\n然后，你使用以下语句注册 `cookie-alert` 标签：\n\n```javascript\ncustomElements.define(\"\
  cookie-alert\", CookieAlert);\n```\n\n此时，你将一个现有的 `cookie-alert` 元素连接到由 `CookieAlert`\
  \ 类实现的自定义元素。该元素已经创建，因此此时不会调用你的构造函数。它将在你的组件被追加到 DOM 时被调用。在这种情况下，我们说你的自定义元素已被升级。\n\
  \n升级自定义元素是一种相当特殊的情况，但它可能发生，你应该了解发生了什么，以避免出现意外行为。\n\n实际上，你可以通过不同的方式组合这些步骤来获得自定义元素的实例。下表总结了这些可能的组合：\n\
  \n| **步骤 1** | **步骤 2** | **步骤 3** | **步骤 4** | **状态** |\n|---|---|---|---|---|\n\
  | 类定义 | 自定义元素注册 | 实例创建 | 附加到 DOM | 已创建 |\n| 类定义 | 实例创建 | 自定义元素注册 | 附加到 DOM | 已升级\
  \ |\n| 类定义 | 实例创建 | 附加到 DOM | 自定义元素注册 | 已升级 |\n| 实例创建 | 类定义 | 附加到 DOM | 自定义元素注册\
  \ | 已升级 |\n| 实例创建 | 附加到 DOM | 类定义 | 自定义元素注册 | 已升级 |\n\n**表 3.1**\n\n如你所见，只有类定义后紧跟标签注册才能保证你的自定义元素被创建。在所有其他情况下，你的自定义元素将被升级。\n\
  \n一旦确定了自定义元素的构造函数何时被调用，让我们考虑一下在组件生命周期的这个阶段你可以做什么。你可以使用这个阶段来初始化自定义元素的状态，但该方法的第一个语句必须是对\
  \ `super()` 的调用。请记住，在这个阶段，你无法访问 DOM，因为组件刚刚创建，但尚未附加到模型中。这意味着文档对象尚不可用，任何添加或操作 DOM\
  \ 元素的尝试都会抛出错误。例如，假设你的组件在其构造函数中有以下代码：\n\n```javascript\nconstructor() {\n  super();\n\
  \  this.appendChild(document.createElement(\"div\"));\n}\n```\n\n当这段代码运行时，如果你使用的是\
  \ Chrome，你会得到类似下面的错误：\n\n![](img/Figure_3.4.jpg)\n\n**图 3.4**\n\n或者如果你使用的是 Firefox，会得到类似下面的错误：\n\
  \n![](img/Figure_3.5.jpg)\n\n**图 3.5**\n\n换句话说，自定义元素的构造函数不是进行渲染操作的正确位置。\n\n### connectedCallback()\
  \ 反应\n\n每当组件实例被添加到 DOM 时，`connectedCallback()` 方法就会被调用。从这一刻起，你可以确定 DOM 是可用的，因此你可以操作元素、设置属性、初始化组件的图形外观等。\n\
  \n**请注意，虽然通常 `connectedCallback()` 方法在组件的生命周期中只被调用一次，但它可能会被多次调用。**\n\n`connectedCallback()`\
  \ 方法可能被多次调用的一种情况是组件在 DOM 中被移动时。例如，考虑以下代码：\n\n```javascript\nconst cookieAlert =\
  \ new CookieAlert();\n```\n\n\n\n\n\n```\ndocument.body.appendChild(cookieAlert);\n\
  const div = document.createElement(\"div\");\ndocument.body.appendChild(div);\n\
  div.appendChild(cookieAlert);\n```\n\n这段代码创建了一个 `CookieAlert` 自定义元素的实例，并将其添加到当前文档的\
  \ body 中。然后，它创建一个 div 元素并将其追加到文档的 body 中。最后，它将之前创建的 `CookieAlert` 元素实例追加到该 div 中。换句话说，你的元素已经从\
  \ body 移动到了 div 中。\n\n这最后一步会触发 `connectedCallback()` 方法的第二次调用。也许在很多情况下，这对组件的行为没有影响，但你应该意识到这一点。事实上，这取决于方法本身的具体语句。如果你的代码执行了必须只执行一次的任务，你应该考虑到代码可能被多次调用的可能性。\n\
  \n有时，当你的自定义元素被移动时，可能不会出现行为问题，但可能会有性能问题。例如，如果你的 `connectedCallback()` 方法执行了繁重的操作或从网络获取数据，那么每次组件在文档中从一个位置移动到另一个位置时，这些操作都会被执行。同样，在这些情况下，你应该避免反复执行它们。\n\
  \n让我们看看 `CookieAlert` 组件的 `connectedCallback()` 方法：\n\n```\nconnectedCallback()\
  \ {\nthis.createComponent();\n}\n```\n\n它只是调用了 `createComponent()` 方法，该方法操作 DOM\
  \ 以附加自定义元素的 UI 元素。提醒一下，以下是 `createComponent()` 方法的代码：\n\n```\ncreateComponent()\
  \ {\nconst style = document.createElement(\"style\");\nstyle.appendChild(document.createTextNode(styleRules));\n\
  this.appendChild(style);\nconst span = document.createElement(\"span\");\nspan.innerText\
  \ = \"This website uses cookies to ensure you get the best experience\";\nconst\
  \ div = document.createElement(\"div\");\ndiv.classList.add(\"container\", \"footer\"\
  );\ndiv.appendChild(span);\nthis.appendChild(div);\n}\n```\n\n这段代码会在每次 `CookieAlert`\
  \ 组件被移动时执行。从行为角度来看，这没有影响：你会得到具有预期行为的相同组件。也许从性能角度来看，它的影响非常小。但无论如何，它执行了不必要的工作。\n\n\
  我们可以通过检查是否已经完成来避免执行这些不必要的工作，如下例所示：\n\n```\nconnectedCallback() {\nif (!this.initialized)\
  \ {\nthis.createComponent();\nthis.initialized = true;\n}\n}\n```\n\n这里，你为 `CookieAlert`\
  \ 组件定义了 `initialized` 属性，并用它来判断组件的 UI 是否已经构建。只有当 `createComponent()` 方法执行后，该属性才被设置为\
  \ true。这个检查保证了 UI 只会被构建一次。\n\n即使它不影响组件的行为或性能，你也应该意识到，当自定义元素被升级时，`connectedCallback()`\
  \ 方法会被调用。这意味着当自定义元素被升级时，它的构造函数和 `connectedCallback()` 方法会依次被调用。\n\n### attributeChangedCallback()\
  \ 反应\n\n当与组件关联的属性被添加、移除、更新或替换时，会执行 `attributeChangedCallback()` 方法。我们将在下一章学习如何处理属性和特性。在那章中，我们还将更详细地探讨如何使用\
  \ `attributeChangedCallback()` 方法。\n\n在这里，你只需要了解这个方法及其总体目标。此外，这个方法会接收三个参数，为你提供更多关于正在发生什么的信息：\n\
  \n*   受影响的属性名称\n*   该属性的旧值\n*   该属性的新值\n\n因此，通常你会像下面这样实现 `attributeChangedCallback()`\
  \ 方法：\n\n```\nattributeChangedCallback(name, oldValue, newValue) {\n…\n}\n```\n\n\
  如前所述，我们将在下一章更详细地介绍如何使用这个反应。\n\n### adoptedCallback() 反应\n\n当你的自定义元素被采纳到新文档中时，你可能需要实现\
  \ `adoptedCallback()` 方法。元素的采纳有一个非常特定的用例。当元素通过 `document.adoptNode()` 方法从一个文档移动到另一个文档时，就会发生这种情况。这通常发生在你处理\
  \ `iframe` 时，如下例所示：\n\n```\nconst iframe = document.querySelector(“iframe”);\nconst\
  \ iframeFirstImage = iframe.contentDocument.querySelector(“img”);\nconst adoptedImage\
  \ = document.adoptNode(iframeFirstImage);\ndocument.body.appendChild(adoptedImage);\n\
  ```\n\n这段代码获取当前文档中第一个 `iframe` 的第一个图片元素，并将其追加到当前文档的 body 中。请注意，原始元素会从源文档中移除。\n\n\
  当你的自定义元素以这种方式移动时，`adoptedCallback()` 方法会被调用。注意，元素的采纳不会销毁并重新创建元素，因此它的构造函数不会被调用。\n\
  \n### disconnectedCallback() 反应\n\n当你的自定义元素从 DOM 中移除时，会调用 `disconnectedCallback()`\
  \ 方法。你可以定义此方法，以便在元素从当前文档中消失之前执行操作。通常，它用于释放资源和添加清理逻辑，例如通知其他组件该元素正在从 DOM 中移除、停止定时器、取消订阅\
  \ DOM 事件或全局应用程序服务等。\n\n这些清理操作有助于释放系统资源并防止可能的内存泄漏，但当然，它们取决于组件的逻辑。\n\n**请记住，将元素从 DOM\
  \ 中断开并不意味着该元素被销毁。**\n\n为了澄清这个概念，请考虑以下代码：\n\n```\nconst cookieAlert = new CookieAlert();\n\
  document.body.appendChild(cookieAlert);\ndocument.body.getElementByTagName(“cookie-alert”).remove();\n\
  ```\n\n这段代码创建了一个 `cookieAlert` 自定义元素的实例，将其添加到 DOM 中，然后将其从 DOM 中移除。最后一条语句导致系统查找并执行\
  \ `disconnectedCallback()` 方法。请注意，`cookieAlert` 实例已从 DOM 中移除，但并未被销毁。事实上，你可以通过以下语句再次将其追加到\
  \ DOM 中：\n\n```\ndocument.body.appendChild(cookieAlert);\n```\n\n由于你的自定义元素在其生命周期中可能会多次断开和重新连接到\
  \ DOM，因此你应该意识到 `disconnectedCallback()` 方法可能会被多次调用。\n\n另外，请考虑你在 `disconnectedCallback()`\
  \ 方法中执行的操作通常取决于你在执行 `connectedCallback()` 方法时所做的事情。也许最常见的场景是事件监听器的订阅。我们将在接下来的章节中深入探讨事件，但你可能已经猜到，管理事件是\
  \ UI 元素最常见的活动之一。事件处理程序通常在你的组件连接到 DOM 时注册。它们会消耗内存，并且即使正在监听的元素不再存在，它们也会继续消耗内存。\n\n\
  当你的组件从 DOM 中移除时，一个好的做法是移除它订阅的事件监听器。以下代码展示了如何做到这一点：\n\n```\ndisconnectedCallback()\
  \ {\nthis.getElementById(“clickableItem”)\n.removeEventListener(“click”, this.handleClick);\n\
  }\n```\n\n如你所见，这里使用了 `removeEventListener()` 方法来移除已注册的事件处理程序。\n\n## 使用自定义 Web 组件\n\
  \n\n\n\n\n在前面的章节中，我们创建了 cookie 提醒自定义元素，并了解了如何在 HTML 页面中使用它。实际上，使用自主自定义元素相当简单。一旦你定义了实现它的类，并用标签名注册了它，你只需在\
  \ HTML 页面的标记中使用该标签名，如下所示：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>使用 Webpack\
  \ 构建系统的 Web 组件</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n\
  <script src=\"./bundle.js\"></script>\n</head>\n<body>\n<h1>这是你的 Web 组件</h1>\n<cookie-alert></cookie-alert>\n\
  </body>\n</html>\n```\n\n有趣的是，你的自定义元素会变得与任何其他标准 HTML 元素难以区分。由于你的组件派生自 `HTMLElement`，你可以使用所有\
  \ HTML 元素共有的特性，而无需编写额外的代码。例如，你可以使用 `hidden` 属性，如下所示：\n\n`<cookie-alert hidden></cookie-alert>`\n\
  \n你的组件将像任何其他具有 `hidden` 属性的标准元素一样，不会在页面上显示。此外，你还可以附加事件监听器，如下所示：\n\n`<cookie-alert\
  \ onclick=”alert(‘你点击了！’)”></cookie-alert>`\n\n当你点击组件时，会弹出一个包含你传入消息的警告窗口，如下图所示：\n\
  \n![](img/Figure_3.6.jpg)\n\n**图 3.6**\n\n标准 HTML 元素的所有通用属性都会自动在你的自定义元素中可用。以下是最常见的一些属性列表：\n\
  \n| **属性** | **描述** |\n| `hidden` | 指示元素是否隐藏 |\n| `id` | 元素的标识符 |\n| `innerHTML`\
  \ | 表示元素内部内容的标记 |\n| `innerText` | 表示元素的文本内容 |\n| `onblur` | 失焦事件（即元素失去焦点时）的事件处理程序\
  \ |\n| `onfocus` | 聚焦事件（即元素获得焦点时）的事件处理程序 |\n| `onclick` | 点击事件的事件处理程序 |\n| `onmousedown`\
  \ | `mousedown` 事件（即用户按下鼠标按钮时）的事件处理程序 |\n| `onmouseover` | mouseover 事件（即用户将鼠标指针移到元素上时）的事件处理程序\
  \ |\n| `onmouseup` | `mouseup` 事件（即用户释放鼠标按钮时）的事件处理程序 |\n| `onresize` | resize 事件（即当前浏览器窗口大小改变时）的事件处理程序\
  \ |\n| `style` | 表示元素内联样式的 CSS 声明 |\n| `title` | 通常当鼠标悬停在元素上时以工具提示弹出窗口显示的文本 |\n\n\
  **表 3.2**\n\n你可以在自定义元素的标记中使用这些属性，如上所示。但你也可以在 JavaScript 中使用相应的属性，就像处理标准 HTML 元素一样。例如，你可以通过\
  \ JavaScript 操作其 `hidden` 属性来隐藏你的 cookie 提醒组件。\n\n**请记住，属性和属性（DOM 属性）不是一回事。属性是 HTML\
  \ 标记的一部分，而属性是标记的对象表示（DOM）的一部分。**\n\n**通常，属性和 DOM 属性之间存在映射关系，但并非总是如此。**\n\n假设你的组件已分配了一个标识符，如下例所示：\n\
  \n`<cookie-alert id=”myCookieAlert”></cookie-alert>`\n\n你可以使用以下 JavaScript 代码隐藏此组件：\n\
  \n```\nwindow.onload = function() {\nconst cookieAlert = document.getElementById(\"\
  myCookieAlert\");\ncookieAlert.hidden = true;\n};\n```\n\n如你所见，我们只是将 `true` 值赋给了继承的\
  \ `hidden` 属性。当然，这与在 HTML 标记中设置 `hidden` 属性效果相同。\n\n类似地，你可以通过 JavaScript 使用以下代码添加点击事件的处理程序：\n\
  \n```\nwindow.onload = function() {\nconst cookieAlert = document.getElementById(\"\
  myCookieAlert\");\ncookieAlert.onclick = () => alert(“你点击了！”);\n};\n```\n\n在这种情况下，我们使用了自定义元素的\
  \ `onclick` 属性，该属性映射到 `onclick` 属性。另一种方法是使用 `addEventListener()` 方法，如下例所示：\n\n```\n\
  window.onload = function() {\nconst cookieAlert = document.getElementById(\"myCookieAlert\"\
  );\ncookieAlert.addEventListener(“click”, () => alert(“你点击了！”));\n};\n```\n\n除了使用\
  \ `addEventListener()` 方法与使用 `onclick` 属性和属性具有相同效果之外，它还清楚地告诉你，你的自定义元素还继承了方法，而不仅仅是属性和属性。\n\
  \n以下是你的自定义元素从 `HTMLElement` 继承的最常见方法：\n\n| **方法** | **描述** |\n| `addEventListener`\
  \ | 在元素上为特定事件类型注册事件处理程序 |\n| `getAttribute` | 根据属性名称返回元素属性的值 |\n| `getElementsByClassName`\
  \ | 返回元素所有具有给定 CSS 类的后代元素的集合 |\n| `getElementsByTagName` | 返回元素所有具有给定标签名的后代元素的集合\
  \ |\n| `querySelector` | 返回与给定选择器字符串匹配的第一个元素 |\n| `querySelectorAll` | 返回与给定选择器字符串匹配的元素列表\
  \ |\n| `remove` | 从 DOM 中移除元素 |\n| `removeAttribute` | 从元素中移除给定的属性 |\n| `removeEventListener`\
  \ | 从元素中移除事件监听器 |\n| `setAttribute` | 为元素的给定属性设置值 |\n| `toggleAttribute` | 切换布尔属性，如果存在则移除，如果不存在则添加\
  \ |\n\n**表 3.3**\n\n请记住，你可以使用这些属性、属性和方法，仅仅是因为你的自定义元素继承自 `HTMLElement`。\n\n## 结论\n\
  \n本章为你提供了构建“自主自定义元素”的基础知识。我们逐步构建了一个简单的 Web 组件，用于显示关于你网站 cookie 政策的提醒消息。在构建此组件的过程中，我们探讨了自主自定义元素的基本结构，以及向其添加标记和\
  \ CSS 规则以定义其 UI 的基本技术。我们分析了 Web 组件的生命周期，并讨论了在每个阶段你可以做什么和不能做什么。最后，我们了解了如何通过标记和 JavaScript\
  \ 在你的 Web 应用程序中使用你的 Web 组件。\n\n通过本章收集的信息，你能够创建一个带有标记和 CSS 的简单自主自定义元素。由于你学习了 Web\
  \ 组件生命周期的各个阶段，你可以选择合适的反应来尽可能好地管理组件的生命周期。此外，你还知道如何在你的网页中使用你的 Web 组件，以及默认情况下哪些功能可用。\n\
  \n在下一章中，我们将继续改进你在本章中开始构建的 Web 组件，添加对自定义属性和属性的支持。\n\n## 问题\n\n1.  注册自主自定义元素和注册自定义原生元素有什么区别？\n\
  \n2.  什么是自定义元素反应？\n\n3.  Web 组件可能有哪些反应？\n\n4.  组件的创建和升级之间有什么区别？\n\n5.  操作 DOM 的最佳反应是什么？\n\
  \n6.  `adoptedCallback()` 反应在何时被调用？\n\n7.  `disconnectedCallback()` 反应在何时被调用？\n\n\
  8.  为什么自主自定义元素即使你没有实现它们，也会有一些可用的属性、属性和方法？\n\n\n\n\n\n# 第 4 章：管理属性和特性\n\n本章将讨论如何通过属性和特性使\
  \ Web 组件可配置。你将了解属性（property）与特性（attribute）的区别，以及如何通过标准 DOM API 管理它们。接着，我们将看到如何为\
  \ Web 组件添加属性，以及如何将其值映射到对应的特性。反之，你也会学习如何将特性映射到属性，以及如何保持两者同步。\n\n在本章末尾，我们将讨论可能影响组件性能和效果的一些因素。\n\
  \n## 结构\n\n*   特性与属性\n*   管理属性\n*   同步特性与属性\n*   注意事项与建议\n\n## 目标\n\n本章将让你清晰理解属性与特性。你将学习如何通过添加对属性和特性的支持来丰富你的\
  \ Web 组件，以便用户能够自定义它。你还将学习应采纳的最佳实践，使你的 Web 组件类似于标准 HTML 元素，并避免可能的性能陷阱。\n\n## 特性与属性\n\
  \n在上一章中，我们开始构建一个 Web 组件，用于告知用户当前网站应用的 Cookie 管理策略——即 Cookie 提醒。到目前为止，实现只是简单显示一个默认文本，该文本硬编码在\
  \ Web 组件的 JavaScript 代码中。当然，对于真实世界的组件来说，这并非理想方法。我们希望使用我们 Web 组件的开发者能够指定他们想要显示的文本。换句话说，我们希望用户能够自定义我们的\
  \ Web 组件。通常，HTML 元素可以通过在页面标记中为其特性赋值，或在 JavaScript 代码中为其属性赋值来进行自定义。\n\n我们将在 Cookie\
  \ 提醒组件中实现这种自定义 HTML 元素的标准方式。但在进入实际实现之前，我们需要明确什么是特性与属性，以及它们之间的区别。\n\n作为前端开发者，你知道浏览器如何解释\
  \ HTML 并构建 DOM。简而言之，当浏览器加载页面时，它会解析 HTML 标记，并根据其中找到的 HTML 元素生成 DOM 对象。通常，每个 HTML\
  \ 元素都会成为 DOM 层次结构中的一个 DOM 对象，而 HTML 元素的每个特性都会成为 DOM 对象的一个属性。尽管这是常见情况，但这种映射并非严格的一一对应。\n\
  \n让我们看看 HTML 特性与 DOM 对象属性之间的主要区别。\n\n### HTML 特性\n\n如前所述，当浏览器解析一个 HTML 元素时，它会构建一个对应的\
  \ DOM 对象。它还会分析元素的特性，将其值赋给对应 DOM 对象的属性。当然，浏览器能够识别 HTML 元素中的标准特性，在这种情况下，它知道如何处理该特性并将其值赋给对应的对象属性。例如，考虑以下标记：\n\
  \n```\n<p id=”myPar”>这是一个段落</p>\n```\n\n浏览器将生成一个 `HTMLParagraphElement` 对象，并将值 `myPar`\
  \ 赋给它的 `id` 属性。它知道 `HTMLParagraphElement` 对象有一个与 HTML 特性 `id` 对应的 `id` 属性，因此可以将后者映射到前者。\n\
  \n注意，HTML 元素并不共享相同的标准特性。例如，`<input>` 元素有 `type` 特性，而 `<div>` 元素没有。因此，特性与属性之间的映射必须逐个元素进行。这意味着，如果你向\
  \ HTML 元素添加一个非标准特性，它不会在 DOM 对象上生成对应的属性。为了更好地说明，你可以编写以下标记：\n\n```\n<p id=”myPar”\
  \ type=”special”>这是一个段落</p>\n```\n\n但 `HTMLParagraphElement` 对象不会获得 `type` 属性。不过，你仍然可以通过\
  \ DOM API 访问 HTML 特性。实际上，每个 DOM 对象都有以下方法，允许你处理特性：\n\n| **方法** | **描述** |\n| ---\
  \ | --- |\n| `hasAttribute()` | 检查特性是否存在 |\n| `getAttribute()` | 获取特性的值 |\n| `setAttribute()`\
  \ | 设置特性的值 |\n| `removeAttribute()` | 从 HTML 元素中移除特性 |\n\n**表 4.1**\n\n例如，你可以通过以下代码访问上述标记中段落的非标准特性\
  \ `type`：\n\n```\nconst myPar = document.getElementById(“myPar”);\nif (myPar.hasAttribute(“type”))\
  \ {\n  console.log(myPar.getAttribute(“type”));\n}\n```\n\n这段代码检查 `type` 特性是否存在，并在控制台显示其值。\n\
  \n你还可以使用 `attributes` 属性，它包含 HTML 元素所有特性的列表。列表中的每个元素都是一个表示特性的对象。你可以通过使用 `attributes`\
  \ 属性来重现前面代码片段的行为，如下所示：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
  const typeAttribute = myPar.attributes.getNamedItem(“type”);\nif (typeAttribute)\
  \ {\n  console.log(typeAttribute.value);\n}\n```\n\n在这种情况下，你通过 `attributes` 集合的\
  \ `getNamedItem()` 方法获取表示特性的对象。然后，通过其 `value` 属性访问特性的值。\n\n稍后我们将回到非标准特性及其相关注意事项。\n\
  \n**`attributes` 集合包含标准特性和非标准特性。**\n\n为了结束对 HTML 元素特性的概述，你应该注意两个重要特性：\n\n*   特性名称不区分大小写\n\
  *   特性的值始终是字符串\n\n这意味着，例如，以下标记是等价的：\n\n```\n<p id=”myPar”>这是一个段落</p>\n<p ID=”myPar”>这是一个段落</p>\n\
  <p Id=”myPar”>这是一个段落</p>\n```\n\n此外，你可以通过 JavaScript 以以下等价方式检索特性的值：\n\n```\nconst\
  \ typeAttribute = myPar.attributes.getNamedItem(“type”);\nconst typeAttribute =\
  \ myPar.attributes.getNamedItem(“Type”);\nconst typeAttribute = myPar.attributes.getNamedItem(“TYPE”);\n\
  ```\n\n另外，无论你以何种方式获取或设置特性的值，它都将是一个字符串。考虑以下示例：\n\n```\nconst typeAttribute = myPar.attributes.getNamedItem(“type”);\n\
  console.log(typeAttribute.value + 1);\n```\n\n你在控制台得到的输出将是特性值与字符串 1 的拼接。如果 `type`\
  \ 特性的值是一个数字字符串，则需要由你将其转换为数字。当你为特性赋值时也是如此，如下代码所示：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
  myPar.setAttribute(“type”, 123);\n```\n\n即使你赋的是一个数值，它也会被转换为字符串。\n\n### DOM 属性\n\n\
  如前所述，HTML 元素在内部由 DOM 对象表示。通常，HTML 元素的任何标准特性在该对象中都有对应的属性，而非标准特性则通过通用方法或 `attributes`\
  \ 集合访问，正如我们之前所见。\n\nDOM 对象是常规的 JavaScript 对象，因此我们可以像处理任何其他对象一样处理它们。例如，我们可以为其属性赋值，或添加新的属性和方法。以下代码展示了如何向\
  \ `HTMLParagraphElement` 对象添加新属性和新方法：\n\n```\nconst myPar = document.getElementById(“myPar”);\n\
  myPar.myProperty = “这是一个新属性！”;\nmyPar.getContent = () => myPar.innerHTML;\n```\n\
  \n\n\n\n向 DOM 对象添加新属性不会影响 HTML，但通过 JavaScript 进行自定义时可能很有用。例如，我们可以为图像分配文本或数字信息，以便稍后检索。\n\
  \n**请注意，尽管技术上可行，但向 DOM 对象添加新属性可能并非好主意。新属性可能与标准 DOM 的未来演变产生冲突。**\n\n与 HTML 属性不同，DOM\
  \ 属性是区分大小写的。这意味着 DOM 属性的名称始终相同，与对应属性的大小写无关。换句话说，如果你的标记如下所示：\n\n`<p ID=”myPar”>这是一个段落</p>`\n\
  \n对应的 DOM 属性仍然是 `id`。\n\n同样，与 HTML 属性不同，DOM 属性是有类型的。例如，考虑以下标记：\n\n`<p ID=”myPar”\
  \ hidden style=”color:red”>这是一个段落</p>`\n\n与 `hidden` 属性对应的 `hidden` 属性具有布尔值。而 `style`\
  \ 属性则是一个对象。\n\n通常，当 DOM 属性的类型是字符串时，属性的值会原样赋给该属性。但也有一些例外。例如，`HTMLAnchorElement` 的\
  \ `href` 属性的值始终是绝对 URL，即使对应属性的值是相对 URL。对于 `<img>` HTML 元素的 `src` 属性和 `HTMLImageElement`\
  \ 的 `src` 属性也是如此。\n\n## 非标准属性管理\n\n我们讨论了非标准属性，以及如何通过 `getAttribute()`、`setAttribute()`\
  \ 等方法或使用属性集合来管理它们。\n\n一般来说，创建非标准属性可能不是个好主意。或者，至少，如果你在创建它们时没有考虑引入它们对应用程序的后果，那也不是个好主意。例如，你可以向\
  \ HTML 元素添加一个非标准属性，但如果后来它变成了标准属性会发生什么？如果你随意分配属性名称，可能会得到意想不到的结果。\n\n尽管从技术上讲，你可以选择任意名称来添加属性，但你应该使用所谓的\
  \ data 属性。这些属性的名称以 `data-` 前缀开头。HTML 标准正是为此目的引入了它们——允许开发者添加自定义属性。\n\n例如，你可以更安全地向段落元素添加非标准属性，如下所示：\n\
  \n`<p id=”myPar” data-type=”special”>这是一个段落</p>`\n\n任何 data 属性都会映射到对应 DOM 对象的 `dataset`\
  \ 属性。因此，你可以检索 `data-type` 属性的值，如下面的代码片段所示：\n\n`const myPar = document.getElementById(“myPar”);`\n\
  \n`console.log(myPar.dataset.type);`\n\n如你所见，在这种情况下，`data-type` 属性生成了 `dataset.type`\
  \ 属性。\n\n## 属性与属性的同步\n\n在大多数情况下，当标准属性的值发生变化时，对应的 DOM 属性的值也会相应变化，反之亦然。这保证了标准属性和属性自动保持同步。\n\
  \n然而，这条规则也有一些例外。考虑以下示例：\n\n`<input id=\"myName\" type=\"text\" value=\"John\" />`\n\
  \n最初，`value` 属性和 `HTMLInputElement` 对象对应的属性具有相同的值。但如果用户更改了文本框的值，属性和属性之间就会出现不同的值。具体来说，`HTMLInputElement`\
  \ 对象的 `value` 属性将获取用户输入的新值，而属性将继续保持初始值。这种行为的原因很简单——这样，当用户在表单中点击“重置”按钮时，可以恢复原始值。所以，这只是一个实际原因。\n\
  \n## 管理属性\n\n到目前为止的概述帮助我们理解了属性和属性的标准行为。如果我们想为我们的 Web 组件提供属性和属性，我们需要清楚了解它们在标准浏览器行为中的工作方式。这使我们能够创建尽可能接近标准元素的属性和属性，以便用户能够理解它们的行为。\n\
  \n### 添加属性\n\n让我们开始修改我们的 cookie 警告组件，添加一个允许用户指定其 `message` 的属性。我们将向自定义元素添加一个 `message`\
  \ 属性，这不过就是向任何标准 JavaScript 类添加属性。因此，让我们回顾一下到目前为止定义的 `CookieAlert` 类的代码：\n\n```\n\
  const styleRules = ‘\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color:\
  \ rgb(35, 122, 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n‘;\nclass CookieAlert\
  \ extends HTMLElement {\nconstructor() {\nsuper();\n}\nconnectedCallback() {\nthis.createComponent();\n\
  }\ncreateComponent() {\nconst style = document.createElement(\"style\");\nstyle.appendChild(document.createTextNode(styleRules));\n\
  this.appendChild(style);\nconst span = document.createElement(\"span\");\nspan.innerText\
  \ = \"This website uses cookies to ensure you get the best experience\";\nconst\
  \ div = document.createElement(\"div\");\ndiv.classList.add(\"container\", \"footer\"\
  );\ndiv.appendChild(span);\nthis.appendChild(div);\n}\n}\ncustomElements.define(\"\
  cookie-alert\", CookieAlert);\n```\n\n作为添加属性的第一步，让我们在类构造函数中为 `_message` 属性分配一个默认值，如下面的代码所示：\n\
  \n```\nconstructor() {\nsuper();\nthis._message = \"This website uses cookies to\
  \ ensure you get the best experience\";\n}\n```\n\n现在，让我们在 `createComponent()` 方法中构建\
  \ UI 时使用 `_message` 属性来分配默认消息：\n\n```\ncreateComponent() {\nconst style = document.createElement(\"\
  style\");\nstyle.appendChild(document.createTextNode(styleRules));\nthis.appendChild(style);\n\
  const span = document.createElement(\"span\");\nspan.innerText = this._message;\n\
  const div = document.createElement(\"div\");\ndiv.classList.add(\"container\", \"\
  footer\");\ndiv.appendChild(span);\nthis.appendChild(div);\n}\n```\n\n这些更改不会影响 cookie\
  \ 警告组件的当前行为。`_message` 属性充当要显示的消息的存储。它并不是我们组件的实际属性，而应该是私有属性。我们使用众所周知的约定，即对于应视为私有的属性，使用\
  \ `_` 前缀命名。\n\n**在撰写本文时，实际的私有属性是 ECMAScript 委员会提出的实验性功能。浏览器的支持有限，但某些转译器可以配置使用它们。**\n\
  \n**在本书的其余部分，我们将继续使用基于 `_` 前缀的命名约定来表示私有属性。**\n\n为了定义实际属性，让我们向类中添加以下代码：\n\n```\n\
  get message() {\nreturn this._message;\n}\nset message(value) {\nthis._message =\
  \ value;\n}\n```\n\n这段代码为 `message` 属性添加了 getter 和 setter。getter 返回私有属性 `_message`\
  \ 的当前值，而 setter 则将参数接收到的值赋给它。\n\n虽然 getter 可以满足 `message` 属性的需求，但 setter 还不够。我们希望当\
  \ setter 接收到 `message` 的值时，UI 会更新为这个新消息。因此，让我们对 `message` 属性的 setter 进行一些修改，并添加一个新方法，如下面的代码片段所示：\n\
  \n```\nget message() {\nreturn this._message;\n}\n```\n\n\n\n\n\n```\nset message(value)\
  \ {\n\nthis._message = value;\n\nthis.updateMessage();\n\n}\n```\n\n```\nupdateMessage()\
  \ {\n\nthis.querySelector(\"span\").innerText = this._message;\n\n}\n```\n\n如你所见，这里我们添加了\
  \ `updateMessage()` 方法，它将私有属性 `_message` 的新值赋给 UI，并在 setter 中调用了它。实际上，我们也可以在 `createComponent()`\
  \ 方法内部使用 `updateMessage()` 方法来改进代码。因此，经过一些重构后，`CookieAlert` 类如下所示：\n\n```\nconst\
  \ styleRules = ‘\n\n.container {\n\ncolor: rgb(255, 255, 255);\n\nbackground-color:\
  \ rgb(35, 122, 252);\n\npadding: 1em 1.8em;\n\nwidth: 100%;\n\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  \n}\n\n.footer {\n\nposition:fixed;\n\nleft:0px;\n\nbottom:0px;\n\n}\n\n‘;\n\nclass\
  \ CookieAlert extends HTMLElement {\n\nconstructor() {\n\nsuper();\n\nthis._message\
  \ = \"This website uses cookies to ensure you get the best experience\";\n\n}\n\n\
  connectedCallback() {\n\nthis.createComponent();\n\n}\n\nget message() {\n\nreturn\
  \ this._message;\n\n}\n\nset message(value) {\n\nthis._message = value;\n\nthis.updateMessage();\n\
  \n}\n\ncreateComponent() {\n\nconst style = document.createElement(\"style\");\n\
  \nstyle.appendChild(document.createTextNode(styleRules));\n\nthis.appendChild(style);\n\
  \nconst span = document.createElement(\"span\");\n\nconst div = document.createElement(\"\
  div\");\n\ndiv.classList.add(\"container\", \"footer\");\n\ndiv.appendChild(span);\n\
  \nthis.appendChild(div);\n\nthis.updateMessage();\n\n}\n\nupdateMessage() {\n\n\
  this.querySelector(\"span\").innerText = this._message;\n\n}\n\n}\n\ncustomElements.define(\"\
  cookie-alert\", CookieAlert);\n```\n\n现在，我们的组件拥有一个 `message` 属性，允许用户通过 JavaScript\
  \ 设置自定义文本。这意味着我们现在可以将 cookie 提醒组件放入 HTML 页面中，如下例所示：\n\n```\n<cookie-alert id=\"\
  myAlert\"></cookie-alert>\n```\n\n在同一页面中，我们可以添加一个脚本，通过 JavaScript 设置自定义文本，如下代码所示：\n\
  \n```\nwindow.onload = function() {\n\nconst myAlert = document.getElementById(\"\
  myAlert\");\n\nmyAlert.message = \"We use cookies, but respect your privacy!\";\n\
  \n};\n```\n\n这段文本将替代默认文本显示，如下截图所示：\n\n![](img/Figure_4.1.jpg)\n\n**图 4.1**\n\n###\
  \ 同步属性和特性\n\n到目前为止，我们已经有了一种通过 JavaScript 处理属性来自定义 cookie 提醒组件的方法。当然，我们也希望能够像任何 HTML\
  \ 组件那样，使用特性（attributes）来自定义组件。即使在标准 HTML 元素中，大多数属性和特性是相互映射的，但对于 Web 组件来说，这并非免费提供。在本节中，我们将了解如何启用基于特性的自定义，以及如何保持特性和属性的同步。\n\
  \n### 从属性到特性\n\n将属性映射到对应的特性相当简单。我们只需在属性值发生变化时，将其值赋给特性即可。我们可以通过对属性 setter 的代码稍作修改来实现这一点。\n\
  \n以下代码展示了如何将 `message` 属性的值映射到 `message` 特性：\n\n```\nset message(value) {\n\nthis._message\
  \ = value;\n\nthis.setAttribute(\"message\", value);\n\nthis.updateMessage();\n\n\
  }\n```\n\n如你所见，我们使用了 Web 组件自身的 `setAttribute()` 方法来实现这种映射。请记住，无论值变量的类型是什么，它都会被转换为字符串。\n\
  \n### 从特性到属性\n\n现在我们知道了如何将赋给属性的值映射到特性。这很好，但更有趣的部分是将特性映射到 Web 组件的属性。这允许用户从标记中设置值，有时更加简单方便。\n\
  \n将特性映射到属性稍微复杂一些。它需要浏览器在特性值发生变化时发出某种通知。请记住，HTML 直接受浏览器控制。浏览器解析标记，并通过 DOM 为我们提供其表示。因此，如果标记层面发生了某些变化，浏览器应该处理这一变化，并向我们提供一些新信息。\n\
  \n也就是说，你需要知道特性值何时发生变化。因此，第一步是在 Web 组件类中添加静态 getter `observedAttributes()`，声明你想要监视的特性，如下代码片段所示：\n\
  \n```\nstatic get observedAttributes() {\n\nreturn [\"message\"];\n\n}\n```\n\n\
  这个 getter 返回一个数组，包含组件想要观察的特性名称。在我们的例子中，只有 message 特性。`observedAttributes` 属性向浏览器提供了我们感兴趣的特性列表，当其中任何一个特性的值发生变化时，我们会收到通知。\n\
  \n完成这个初步步骤后，你需要捕获浏览器在观察的特性值发生变化时发送的通知。为此，你需要实现 `attributeChangedCallback()` 方法。正如你在前一章中记得的，这是\
  \ Web 组件生命周期中的一种反应。当任何观察的特性发生变化时，它将被调用。以下是 cookie 提醒组件中该方法的实现：\n\n```\nattributeChangedCallback(name,\
  \ oldValue, newValue) {\n\nif (oldValue !== newValue) {\n\nif (name === \"message\"\
  ) {\n\nthis._message = newValue;\n\nthis.updateMessage();\n\n}\n\n}\n\n}\n```\n\n\
  这段代码将更改内部的 `_message` 属性，并通过 `updateMessage()` 方法显示新值。\n\n这些更改允许你使用 `<cookie-alert>`\
  \ 元素的 message 特性来设置自定义的 `message`，而无需任何 JavaScript 代码，如下例所示：\n\n```\n<cookie-alert\
  \ message=\"We use cookies, but respect your privacy!”></cookie-alert>\n```\n\n\
  最终的视觉效果与之前相同，但现在我们拥有一个几乎与标准 HTML 元素无法区分的 Web 组件。\n\n## 注意事项与建议\n\n在上面的示例中，我们实现了属性和特性之间的同步，反之亦然。这通常是最常见的场景，因为用户期望特性和属性的每次更改都能自动相互反映。\n\
  \n然而，请记住，这并不总是最佳实践。例如，如果某个属性打算通过 JavaScript 频繁更新（例如通过循环），你不应该将其值映射到对应的特性。将更新反映到特性是昂贵的，因此如果你需要频繁执行此操作，你的\
  \ Web 组件可能会变得无响应。在某些情况下，你甚至可以选择不为某个属性提供特性。\n\n如前所述，特性只接受字符串。你不能传递任何其他数据类型。将字符串转换为对应属性类型的责任在于\
  \ getter 和 setter 方法。当然，你也不能将丰富的数据（如对象和数组）赋值给特性。如果你希望允许为 Web 组件分配丰富的数据，你应该通过方法或属性来接受这些数据。\n\
  \n\n\n\n你可能会倾向于通过序列化对象表示的属性来接受丰富数据。或者，你也可能考虑通过序列化将特性中的丰富数据映射到对应的属性。这种方法存在一些缺陷。最明显的缺点是，为了同步特性和属性而进行序列化和反序列化，对于大型对象来说代价非常高。此外，在序列化过程中，你会丢失对象中可能存在的任何对象引用。换句话说，作为最佳实践，你应该只允许特性包含丰富数据，或者将其作为方法的参数接受。永远不要在\
  \ Web 组件的属性中接受或映射丰富数据。\n\n## 结论\n\n在本章中，我们回顾了属性与特性之间的区别，以及它们在标准 HTML 元素中的工作方式。带着这些概念，我们探讨了如何为\
  \ Web 组件复制这种标准行为。我们学习了如何向 Web 组件添加特性，如何通过 JavaScript 使用它们，如何将特性映射到属性，以及如何保持两者同步。最后，我们讨论了可能影响\
  \ Web 组件性能的几个因素。\n\n通过在你的 Web 组件中添加和管理属性与特性，你可以创建几乎完全类似于标准 HTML 元素的自定义元素。你的 Web\
  \ 组件的用户现在可以通过属性和特性来定制它们。\n\n在下一章中，我们将探讨另一种允许用户定制 Web 组件的方式。我们将讨论事件管理，并了解如何将这个常见功能包含到你的\
  \ Web 组件中。\n\n## 问题\n\n1.  标准 HTML 元素的特性与属性之间有什么区别？\n\n2.  属性可能的数据类型有哪些？\n\n3. \
  \ 特性可能的数据类型有哪些？\n\n4.  如果你向标准 HTML 元素添加一个未知属性，会发生什么？\n\n5.  向 HTML 元素添加非标准属性的最佳方式是什么？\n\
  \n6.  HTML 元素的属性集合是否只包含标准属性？\n\n7.  你使用哪个 DOM 方法将特性的值映射到对应的属性？\n\n8.  你可以使用哪个自定义元素反应来捕获属性的变化？\n\
  \n9.  你如何请求浏览器通知属性值的变化？\n\n10. 如果你的特性的数据类型不是 `string`，谁负责转换来自对应属性的值？\n\n11. 为什么你不应该将丰富数据分配给属性？\n\
  \n# 第 5 章\n\n## 处理事件\n\n事件是 UI 开发的重要组成部分。它们允许你管理用户与应用程序的交互，并对特定的系统行为做出反应。在本章中，我们将探讨如何让\
  \ Web 组件监听事件、处理事件以及创建自定义事件。在简要回顾 DOM 事件管理之后，你将学习如何将 Web 组件与标准事件监听集成。你还将了解如何处理事件传播，以及如何生成不带事件数据和带事件数据的自定义事件。最后，你将看到如何通过移除所有已注册的事件监听器来实现更好的系统资源管理，这是最佳实践之一。\n\
  \n像往常一样，在本章中，我们将通过丰富我们的 cookie 警告组件来处理和生成事件，从而实践这些新概念。\n\n## 结构\n\n*   事件管理基础\n\n\
  *   监听标准事件\n\n*   创建自定义事件\n\n*   移除事件监听器\n\n## 目标\n\n阅读本章后，你将能够创建能够监听整个组件上或组件 UI\
  \ 中任何标准 HTML 元素上发生的标准事件的 Web 组件。你还将学习如何让你的组件生成尽可能类似于标准事件的自定义事件。\n\n## 事件管理基础\n\n\
  事件管理在任何交互式应用程序中都非常重要。作为一名 JavaScript 开发者，你知道如何处理事件。不过，在进入 Web 组件的事件管理之前，让我们在本节中回顾一些关于事件的概念，以便达成共识。\n\
  \n事件允许我们定义应用程序在用户与之交互时，或者当系统（基本上是 DOM）或应用程序本身内部发生某些事情时的行为。为了拦截事件，我们通常使用处理程序或监听器，这是一个与特定事件关联的函数。\n\
  \n你有三种方式将处理程序与事件关联：\n\n*   在 JavaScript 代码中使用 `addEventListener()` 方法\n\n*   在 HTML\
  \ 标记中使用特定的属性\n\n*   使用 HTML 元素的特定特性\n\n使用属性和特性为 HTML 元素分配事件处理程序相当直接且方便。然而，`addEventListener()`\
  \ 方法提供了一种更高级的事件管理方式。例如，它允许你为同一事件添加多个处理程序。它还允许你控制处理程序在事件传播流程中的位置，我们稍后会看到。\n\n当事件触发时，一个包含事件本身细节的对象会被传递给处理程序。你可以在处理程序中使用这个对象，如下例所示：\n\
  \n```\nconst button = document.getElementById(\"myButton\");\nbutton.addEventListener(\"\
  click\", (event) => {\nconsole.log('You clicked the button \"${event.target.innerHTML}\"\
  ');\n});\n```\n\n在这个例子中，我们使用了事件对象的 `target` 属性。它表示事件触发的 HTML 元素。我们使用了这个 HTML 元素的\
  \ `innerHTML` 特性来在浏览器控制台中显示被点击按钮的文本。\n\n当事件发生时，它会沿着特定路径穿过 DOM。这个路径被称为**事件传播**流程，分为三个阶段：\n\
  \n*   **捕获阶段**：在此阶段，事件从 DOM 的根节点传播到实际的目标元素。\n\n*   **目标阶段**：在此阶段，事件到达目标元素。\n\n*\
  \   **冒泡阶段**：在此阶段，事件从目标元素开始向上遍历 DOM 树，直到再次到达根节点；因此，它会经过捕获阶段中经过的相同节点。\n\n下面的图片来自\
  \ W3C 规范，展示了这三个阶段中的事件传播：\n\n![](img/5-1.jpg)\n\n**图 5.1**\n\n在这三个阶段中，与事件关联的事件对象会被传递给沿途遇到的任何处理程序。通常，在捕获阶段，处理程序会忽略事件，让它流向目标元素。一旦到达目标元素，其处理程序代码就会被执行。在接下来的冒泡阶段，当你向\
  \ DOM 根节点移动时，事件处理程序会被执行。\n\n理解这个流程有助于防止奇怪的行为，并在管理事件时发现可能的问题。\n\n如果你出于某种原因希望你的处理程序在事件传播的捕获阶段执行，你可以利用\
  \ `addEventListener()` 方法的第三个参数。下面的例子展示了如何做到这一点：\n\n```\nconst button = document.getElementById(\"\
  myButton\");\nconst handler = (event) => {\nconsole.log('You clicked the button\
  \ \"${event.target.innerHTML}\"');\n};\nbutton.addEventListener(\"click\", handler,\
  \ true);\n```\n\n`addEventListener()` 方法的第三个参数是一个 `Boolean` 值，指定处理程序是否必须在捕获阶段执行。其默认值为\
  \ `false`，阻止处理程序在捕获阶段执行。\n\n在处理事件时，我们有机会改变事件流。例如，我们可以通过使用事件对象的 `stopPropagation()`\
  \ 方法来决定停止事件流。下面是一个如何使用该方法的示例：\n\n\n\n\n`const button = document.getElementById(\"\
  myButton\");`\n`button.addEventListener(\"click\", (event) => {`\n`event.stopPropagation();`\n\
  `console.log(‘The event stops at button “${event.target.innerHTML}”‘);`\n`});`\n\
  \n你也可以通过为 `event` 对象的 `cancelBubble` 属性赋一个布尔值来达到同样的效果，如下面的代码片段所示：\n\n`const button\
  \ = document.getElementById(\"myButton\");`\n`button.addEventListener(\"click\"\
  , (event) => {`\n`event.cancelBubble = true;`\n`console.log(‘The event stops at\
  \ button “${event.target.innerHTML}”‘);`\n`});`\n\n有了关于 DOM 事件管理的总结，我们来看看它如何融入 Web\
  \ Components 的上下文中。\n\n### 监听标准事件\n\n让我们看看如何让一个 Web 组件处理标准事件，即可能发生在标准 HTML 元素上的典型\
  \ DOM 事件。带着这个目标，我们想要通过添加一个“关闭”按钮来丰富我们的 cookie 提醒组件。这个按钮允许用户隐藏当前网页底部的横幅。当用户点击该按钮时，cookie\
  \ 提醒将消失。\n\n让我们看看包含 `<cookie-alert>` 元素的页面的 HTML 标记：\n\n```\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>Web Components with Webpack Build System</title>\n<script src=\"\
  ./wc-polyfills/webcomponents-loader.js\"></script>\n<script src=\"./bundle.js\"\
  ></script>\n</head>\n<body>\n<h1>Here is your Web Component</h1>\n<cookie-alert\
  \ message=\"We use cookies, but respect your privacy!\"></cookie-alert>\n</body>\n\
  </html>\n```\n\n这与我们在前一章介绍属性和属性管理时使用的标记相同。\n\n现在，让我们编辑 `index.js` 文件，对其中的代码进行一些修改。首先，添加一条新的\
  \ CSS 规则来格式化我们的新按钮。`styleRules` 常量将如下所示：\n\n```\nconst styleRules = ‘\n.container\
  \ {\ncolor: rgb(255, 255, 255);\nbackground-color: rgb(35, 122, 252);\npadding:\
  \ 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n}\n\
  .footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n.button {\ncolor: rgb(255,\
  \ 255, 255);\nbackground-color: transparen\nborder-color: rgb(255, 255, 255);\n\
  padding: 5px 40px;\nmargin-right: 50px;\ncursor: pointer;\nfloat:righ\n}\n‘;\n```\n\
  \n如你所见，我们只是添加了一个 `button` CSS 类，定义了一些图形属性。\n\n现在，让我们将实际的按钮添加到 Web 组件的标记中。因此，我们将\
  \ `createComponent()` 方法修改如下：\n\n```\ncreateComponent() {\nconst style = document.createElement(\"\
  style\");\nstyle.appendChild(document.createTextNode(styleRules));\nthis.appendChild(style);\n\
  const span = document.createElement(\"span\");\nconst div = document.createElement(\"\
  div\");\ndiv.classList.add(\"container\", \"footer\");\ndiv.appendChild(span);\n\
  const closeButton = document.createElement(\"button\");\ncloseButton.classList.add(\"\
  button\");\ncloseButton.innerText = \"Close\";\ncloseButton.addEventListener(\"\
  click\", ()=>{\nthis.style.visibility = \"hidden\";\n});\ndiv.appendChild(closeButton);\n\
  this.appendChild(div);\nthis.updateMessage();\n}\n```\n\n我们添加了几条语句，用于创建一个 `<button>`\
  \ HTML 元素，为其分配 `button` 类和文本“关闭”，附加一个事件监听器，并将该按钮追加到容器 `<div>` 中。\n\n就我们的目标而言，这些语句中相关的部分是事件监听器的附加。如你所见，我们使用了按钮的标准\
  \ `addEventListener()` 方法来为 `click` 事件分配一个监听器，就像你对任何标准 HTML 元素所做的那样。这个特定的监听器通过更改其\
  \ `visibility` 属性的值来隐藏整个 Web 组件。\n\n如果我们运行项目，将看到以下页面：\n\n![](img/Figure_5.2.jpg)\n\
  \n**图 5.2**\n\n如你所见，现在 cookie 提醒的右侧有一个“关闭”按钮。如果你点击它，横幅将按预期消失。\n\n因此，你现在知道了如何监听和处理可能发生在组成\
  \ Web 组件的各个元素上的标准事件。\n\n请注意，你的 Web 组件本身作为一个整体也可以监听标准事件。记住它继承自 `HTMLElement`。因此，你可以监听可能发生在组件整个表面上的任何事件，而不仅仅是组成它的单个元素。\n\
  \n例如，你可以实现一个视觉效果，当用户的鼠标指针悬停在组件区域时，改变横幅的背景颜色。为了实现这个效果，让我们在 `createComponent()` 方法中添加几条语句。该方法的新版本将如下所示：\n\
  \n```\ncreateComponent() {\nconst style = document.createElement(\"style\");\nstyle.appendChild(document.createTextNode(styleRules));\n\
  this.appendChild(style);\nconst span = document.createElement(\"span\");\nconst\
  \ div = document.createElement(\"div\");\ndiv.classList.add(\"container\", \"footer\"\
  );\ndiv.appendChild(span);\nconst closeButton = document.createElement(\"button\"\
  );\ncloseButton.classList.add(\"button\");\ncloseButton.innerText = \"Close\";\n\
  closeButton.addEventListener(\"click\", ()=>{\nthis.style.visibility = \"hidden\"\
  ;\n});\ndiv.appendChild(closeButton);\nthis.appendChild(div);\nthis.addEventListener(\"\
  mouseover\", ()=> {\ndiv.style.backgroundColor = \"rgb(35, 122, 152)\";\n});\nthis.addEventListener(\"\
  mouseout\", ()=> {\ndiv.style.backgroundColor = \"\";\n});\nthis.updateMessage();\n\
  }\n```\n\n我们在 `createComponent()` 方法的代码中添加的两条新语句使用了 `this` 关键字，直接将两个事件监听器添加到 Web\
  \ 组件上。第一个事件监听器捕获 `mouseover` 事件，第二个处理 `mouseout` 事件。在前一种情况下，我们更改容器 `<div>` 的背景颜色。在后一种情况下，我们将此背景颜色重置为容器\
  \ CSS 类中定义的默认颜色。\n\n### 事件传播\n\n我们在上一节中解释的事件管理向我们展示了作为 Web 组件开发者，我们如何捕获标准事件并处理它。但是，如果用户在我们的\
  \ Web 组件上指定了他们自己的事件处理程序，会发生什么？例如，假设用户像下面的标记那样向 `onclick` 属性添加了一个处理程序：\n\n```\n<cookie-alert\n\
  message=\"We use cookies, but respect your privacy!\"\nonclick=\"alert('You clicked!')\"\
  >\n</cookie-alert>\n```\n\n当然，用户可以这样做。由于 cookie 提醒继承自 `HTMLElement`，它也继承了像 `onclick`\
  \ 这样的标准事件钩子。因此，当用户点击横幅的任何部分时，都会显示警告。\n\n请注意，即使用户点击了“关闭”按钮，用户的警告也会显示。这是因为事件传播流程。一旦点击事件到达目标元素（即关闭按钮），它就进入冒泡阶段。在此阶段，事件会经过按钮的所有父元素，直到到达并执行用户的\
  \ `onclick` 处理程序。\n\n也许你想知道是否有办法阻止用户向标准事件添加处理程序。在尝试找到解决方案之前，先问问自己是否想要这样做。你想阻止用户附加他们的事件处理程序吗？毕竟，任何标准元素都允许你附加标准事件处理程序。为什么你的组件要不同呢？\n\
  \n无论如何，如果你想阻止用户添加他们的事件处理程序，或者更确切地说，忽略它们，你应该在 Web 组件创建时立即添加一个特殊的事件监听器。换句话说，对于我们的点击事件示例，你应该像下面这样修改组件的构造函数：\n\
  \n```\nconstructor() {\nsuper();\nthis._message = \"This website uses cookies to\
  \ ensure you get the best experience\";\nthis.addEventListener(\"click\", (e) =>\
  \ {\ne.stopImmediatePropagation();\n});\n}\n```\n\n\n\n\n我们添加的点击事件处理器会在事件本身冒泡阶段传递给用户处理器之前停止事件传播。因此，实际上这避免了用户的点击处理器被执行。\n\
  \n## 创建自定义事件\n\n到目前为止，我们学习了如何捕获构建组件元素上触发的事件以及如何处理它们。在这种情况下，我们通过应用自己的逻辑（描述 Web 组件内部行为的逻辑）来响应用户或系统生成的事件。通常，事件也是组件的自定义点，是一种允许用户定义他们对组件发生事件做出反应的方式。这就是\
  \ HTML 元素为我们提供事件的原因：它们使我们能够决定事件发生时如何响应。例如，按钮上发生的 click 事件允许我们决定做什么。那么，在构建 Web 组件时，我们如何提供类似的行为呢？\n\
  \n从某种角度来看，我们已经有一种方法允许用户向我们的 Web 组件附加事件处理器。由于我们的组件继承自 `HTMLElement` 类，所有标准事件都会发生在我们的组件上，用户可以利用标准方式处理它们——`onclick`、`onblur`\
  \ 等属性和特性，以及 `addEventListener()` 方法。顺便说一句，这正是我们在上一节中想要阻止的行为。\n\n因此，对于整个 Web 组件的标准事件，我们不需要做任何特殊处理。事件管理系统默认工作。但我们可以触发特定于我们\
  \ Web 组件的事件。例如，当用户点击 cookie 警告消息或点击 `Close` 按钮时，我们可以提供不同的事件。或者我们可以在 cookie 警告组件中添加一个新的\
  \ `Accept` 按钮，并生成一个特定事件，通知用户已接受我们的 cookie 政策。\n\n在本节的剩余部分，我们将实现接受按钮场景，以说明如何生成用户可自行处理的自定义事件。\n\
  \n### 管理政策接受\n\n首先，让我们在 cookie 警告 Web 组件中添加接受按钮。\n\n`Close` 按钮仅隐藏当前会话的 cookie 警告。当用户再次访问我们的网页或应用程序时，cookie\
  \ 警告仍会显示其消息。而接受按钮会将一条信息存储到 cookie 中，告知用户已接受网站的 cookie 政策。每次 cookie 警告组件被添加到 DOM\
  \ 时，都会读取此 cookie。该 cookie 的存在将阻止 cookie 警告显示。\n\n让我们通过向 `createComponent()` 方法添加以下代码来创建\
  \ `Accept` 按钮：\n\n```\ncreateComponent() {\n  //…\n  const acceptButton = document.createElement(\"\
  button\");\n  acceptButton.classList.add(\"button\");\n  acceptButton.innerText\
  \ = \"Accept\";\n  acceptButton.addEventListener(\"click\", ()=>{\n    this.style.visibility\
  \ = \"hidden\";\n    setCookie(\"cookiesAccepted\", \"y\", 365);\n  });\n  div.appendChild(acceptButton);\n\
  \  //…\n}\n```\n\n如您所见，我们以与之前添加 `Close` 按钮相同的方式添加了一个新按钮。但这次，点击事件处理器还调用了 `setCookie()`\
  \ 函数。该函数负责创建存储用户接受网站政策的 cookie。\n\n`setCookie()` 函数作为模块的私有函数实现，位于包含 `CookieAlert`\
  \ 类定义的同一 `index.js` 文件中。换句话说，它不是 `CookieAlert` 类的方法。以下是其实现：\n\n```\nfunction setCookie(cookieName,\
  \ cookieValue, expirationDays) {\n  var d = new Date();\n  d.setTime(d.getTime()\
  \ + (expirationDays*24*60*60*1000));\n  var expires = \"expires=\"+ d.toUTCString();\n\
  \  document.cookie = cookieName + \"=\" + cookieValue + \";\" + expires + \";path=/\"\
  ;\n}\n```\n\n此函数的细节超出了 Web 组件技术的范围。为完整起见，我们还提供了 `getCookie()` 函数的实现，该函数允许我们根据名称检索\
  \ cookie：\n\n```\nfunction getCookie(cookieName) {\n  var name = cookieName + \"\
  =\";\n  var decodedCookie = decodeURIComponent(document.cookie);\n  var ca = decodedCookie.split(';');\n\
  \  for(var i = 0; i <ca.length; i++) {\n    var c = ca[i];\n    while (c.charAt(0)\
  \ == ' ') {\n      c = c.substring(1);\n    }\n    if (c.indexOf(name) == 0) {\n\
  \      return c.substring(name.length, c.length);\n    }\n  }\n  return \"\";\n\
  }\n```\n\n为了使此 cookie 影响 Web 组件的行为，我们需要在 cookie 警告组件附加到 DOM 时分析其内容。因此，我们将 `connectedCallback()`\
  \ 方法修改如下：\n\n```\nconnectedCallback() {\n  const cookiesAccepted = getCookie(\"\
  cookiesAccepted\")\n  if (cookiesAccepted === \"y\") {\n    this.style.visibility\
  \ = \"hidden\";\n  } else {\n    this.createComponent();\n  }\n}\n```\n\n首先，我们获取\
  \ `cookiesAccepted` cookie。如果其值为 y，则隐藏组件，甚至不创建其 UI。否则，照常创建 UI。\n\n通过这些更改，当用户尚未接受网站\
  \ cookie 政策时，横幅将如下所示：\n\n![](img/Figure_5.3.jpg)\n\n**图 5.3**\n\n除了 `Close` 按钮，我们现在还有了\
  \ `Accept` 按钮。如果我们点击 `Close` 按钮并重新加载页面，将再次看到 cookie 警告。如果我们点击 `Accept` 按钮并重新加载页面，将不再看到\
  \ cookie 警告。\n\n### 创建事件\n\n到目前为止，cookie 警告组件按预期工作。然而，目前它不允许用户向接受事件添加自定义逻辑。所有逻辑都在我们的\
  \ Web 组件内部。我们希望使开发人员能够使用我们的 cookie 警告，在用户接受网站政策时添加他们自己的逻辑。换句话说，我们需要生成一个自定义事件。\n\n\
  ### 分发简单事件\n\n为了实现这一目标，我们可以利用标准机制来创建自定义 DOM 事件。这意味着我们可以使用 `CustomEvent` 类创建事件，并使用\
  \ `dispatchEvent()` 方法触发它。让我们看看在创建 Web 组件 UI 时如何应用它们：\n\n```\ncreateComponent()\
  \ {\n  //…\n  const acceptButton = document.createElement(\"button\");\n  acceptButton.classList.add(\"\
  button\");\n  acceptButton.innerText = \"Accept\";\n  acceptButton.addEventListener(\"\
  click\", ()=>{\n    this.style.visibility = \"hidden\";\n    setCookie(\"cookiesAccepted\"\
  , \"y\", 365);\n    this.dispatchEvent(new CustomEvent(\"accepted\"));\n  });\n\
  \  div.appendChild(acceptButton);\n  //…\n}\n```\n\n在上面的代码中，我们在 `Accept` 按钮的 `click`\
  \ 处理器中添加了一条语句。该语句简单地创建并分发 `accepted` 事件。\n\n*你可以使用 `Event` 类或 `CustomEvent` 类来创建事件。前者允许你创建一个简单的事件（就像我们刚刚演示的那样），而后者还允许你传递一些数据。在上面的例子中，我们使用了\
  \ `CustomEvent` 类，因为我们稍后将传递与事件关联的数据。*\n\n因此，当用户点击 `Accept` 按钮时，将触发 `accepted` 事件。在这种情况下，使用我们\
  \ Web 组件的开发人员可以通过添加事件监听器来处理此事件，就像处理任何标准事件一样。以下代码展示了如何在包含 `cookie-alert` 组件的页面中实现这一点：\n\
  \n```\nconst cookieAlert = document.querySelector(\"cookie-alert\");\ncookieAlert.addEventListener(\"\
  accepted\", () => alert(\"感谢您接受我们的 cookie 政策！\"));\n```\n\n当用户接受 cookie 管理政策时，此事件监听器将显示一条感谢消息。\n\
  \n### 'this' 的含义\n\n在继续之前，有必要提一下关于 `this` 关键字使用的一个非常重要的注意事项。\n\n为了生成 `accepted`\
  \ 事件，我们编写了以下代码：\n\n\n\n\n\n`acceptButton.addEventListener(\"click\", ()=>{\n   \
  \ this.style.visibility = \"hidden\";\n    setCookie(\"cookiesAccepted\", \"y\"\
  , 365);\n    this.dispatchEvent(new CustomEvent(\"accepted\"));\n});`\n\n在 `click`\
  \ 事件处理器的函数体内，我们使用了 `this` 关键字来设置 `visibility` 值并派发 `accepted` 事件。请注意，这里我们使用的是箭头函数，因此\
  \ `this` 关键字静态地指向当前的 cookie 提示组件。如果你像下面的例子那样使用标准函数，将会得到意想不到的行为：\n\n```\nacceptButton.addEventListener(\"\
  click\", function(){\n    this.style.visibility = \"hidden\";\n    setCookie(\"\
  cookiesAccepted\", \"y\", 365);\n    this.dispatchEvent(new CustomEvent(\"accepted\"\
  ));\n});\n```\n\n实际上，在这种情况下，`this` 关键字动态地指向监听器所附加的对象，即“接受”按钮。因此，使用这段代码，你会看到“接受”按钮消失，而\
  \ `accepted` 事件的监听器不会执行。\n\n### 传递数据\n\n现在，让我们继续看看如何改进事件管理。默认情况下，事件对象会被传递给事件监听器。这允许开发者检查它并根据其内容做出决策。到目前为止，我们触发的\
  \ `accepted` 事件并没有向监听器提供任何特殊信息。我们可以通过向生成的事件添加细节来提供一些信息。下面的代码展示了如何实现这种增强：\n\n```\n\
  createComponent() {\n    //…\n    const acceptButton = document.createElement(\"\
  button\");\n    acceptButton.classList.add(\"button\");\n    acceptButton.innerText\
  \ = \"Accept\";\n    acceptButton.addEventListener(\"click\", ()=>{\n        this.style.visibility\
  \ = \"hidden\";\n        setCookie(\"cookiesAccepted\", \"y\", 365);\n        this.dispatchEvent(new\
  \ CustomEvent(\"accepted\", {\n            detail:{\n                acceptedCookieName:\
  \ \"cookiesAccepted\",\n                acceptedCookieExpiration: 365}\n       \
  \ }));\n    });\n    div.appendChild(acceptButton);\n    //…\n}\n```\n\n如你所见，这里我们向\
  \ `CustomEvent` 构造函数添加了第二个参数。这个参数是一个对象，其 `detail` 属性包含了我们想要传递给监听器的数据。在这个例子中，我们传递了已创建的\
  \ cookie 的名称（`acceptedCookieName` 属性）以及 cookie 的有效期天数（`acceptedCookieExpiration`\
  \ 属性）。\n\n让我们看看作为使用 cookie 提示组件的开发者，如何利用这些数据：\n\n```\nconst cookieAlert = document.querySelector(\"\
  cookie-alert\");\ncookieAlert.addEventListener(\"accepted\", (event) =>\n    alert('Thanks\
  \ for accepting our cookie policy.\\nYou need to confirm again in ${event.detail.acceptedCookieExpiration}\
  \ days.'));\n```\n\n在上面的例子中，`accepted` 事件监听器有一个 `event` 参数。当然，这个参数代表我们用 `CustomEvent`\
  \ 构造函数创建的事件。因此，通过使用 `event.detail` 属性，感谢消息可以显示 cookie 有效期的天数引用。下图展示了当用户点击“接受”按钮时你应该看到的内容：\n\
  \n![](img/Figure_5.4.jpg)\n\n**图 5.4**\n\n### 添加 onevent 属性\n\n除了 `addEventListener()`\
  \ 方法之外，标准事件还允许你通过特殊的属性（如 `onclick`、`onblur`、`onmouseover` 等）在 HTML 标记中指定处理程序。如你所知，这些\
  \ onevent 属性允许你附加一个字符串，表示在特定事件发生时执行的代码。为了让你的 Web 组件尽可能符合标准 HTML 元素，你可能希望为其添加这类属性。不幸的是，这个功能并非免费。你需要自己实现对这些属性的支持，而且这并不简单。\n\
  \n为了了解如何管理 onevent 属性，让我们看看如何为我们的 cookie 提示 Web 组件添加对 `onaccepted` 属性的支持。请记住，添加这类属性与添加任何典型属性并无不同。此外，最佳实践是在为组件添加属性时也添加一个类似的属性。这模仿了标准\
  \ HTML 元素的常见行为，并让用户找到他们习惯的东西。\n\n**请记住，根据规范，onevent 属性和属性只允许你为特定事件分配一个事件处理程序。如果你需要为一个事件附加多个处理程序，应该使用\
  \ `addEventListener()` 方法。**\n\n因此，作为第一步，让我们添加一个内部属性来保存当前的处理程序：\n\n```\nconstructor()\
  \ {\n    super();\n    this._message = \"This website uses cookies to ensure you\
  \ get the best experience\";\n    this._onAcceptedListener = null;\n}\n```\n\n我们在组件的构造函数中添加了一条语句，将\
  \ `null` 值赋给 `_onAcceptedListener` 内部属性。\n\n现在，我们可以为 `onaccepted` 属性添加 setter 和\
  \ getter，如下面的代码片段所示：\n\n```\nget onaccepted() {\n    return this._onAcceptedListener;\n\
  }\n\nset onaccepted(listener) {\n    if (this._onAcceptedListener) {\n        this.removeEventListener(\"\
  accepted\", this._onAcceptedListener);\n    }\n    if (typeof listener === \"function\"\
  ) {\n        this._onAcceptedListener = listener;\n        this.addEventListener(\"\
  accepted\", this._onAcceptedListener);\n    }\n}\n```\n\ngetter 简单地返回内部 `_onAcceptedListener`\
  \ 属性的值，而 setter 则稍微复杂一些。它检查内部 `_onAcceptedListener` 属性是否已经有一个赋值。如果是，则移除之前分配的监听器。这一步避免了为该事件添加另一个监听器。下一步检查传入值的类型是否为函数。这确保了\
  \ setter 只接受函数。一旦我们确定传入的值是函数，就将其赋给内部 `_onAcceptedListener` 属性。同时，通过 `addEventListener()`\
  \ 方法为其创建一个 `accepted` 事件的监听器。\n\n此时，我们将 `onaccepted` 属性添加到被观察的属性中，如下面的代码所示：\n\n\
  ```\nstatic get observedAttributes() {\n    return [\"message\", \"onaccepted\"\
  ];\n}\n```\n\n**尽管你可以为 onevent 属性使用任何名称，但应遵循基于 `on` 前缀与事件名称拼接的标准约定。**\n\n最后，我们需要通过修改\
  \ `attributeChangedCallback()` 方法来管理 `onaccepted` 属性的变化：\n\n```\nattributeChangedCallback(name,\
  \ oldValue, newValue) {\n    if (oldValue !== newValue) {\n        if (name ===\
  \ \"message\") {\n            this._message = newValue;\n            this.updateMessage();\n\
  \        }\n        if (name === \"onaccepted\") {\n            if (newValue) {\n\
  \                this.onaccepted = new Function(\"event\", '${newValue}');\n   \
  \         } else {\n                this.onaccepted = null;\n            }\n   \
  \     }\n    }\n}\n```\n\n当变化的属性是 `onaccepted` 时，我们将从属性值生成的函数赋给 `onaccepted` 属性。\n\
  \n请记住，与 `onaccepted` 属性不同，`onaccepted` 属性的值类型始终是字符串。此外，用户可以为 `onaccepted` 属性分配任何语句，而不仅仅是函数。因此，为了正确地将属性值赋给\
  \ `onaccepted` 属性，我们需要使用 `Function()` 构造函数创建一个函数。如果向 `onaccepted` 属性传递了一个假值，则将 `null`\
  \ 值赋给 `onaccepted` 属性，从而移除任何之前的处理程序。\n\n现在，我们的 cookie 提示组件支持 `onaccepted` 属性。因此，我们可以像下面的例子那样将事件处理程序附加到它上面：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Web Components with Webpack Build\
  \ System</title>\n    <script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n\
  \    <script src=\"./bundle.js\"></script>\n    <script>\n        function handleAccepted(event)\
  \ {\n```\n\n\n\n\n\n```\nalert('感谢您接受我们的 Cookie 政策。\\n 您需要在${event.detail.acceptedCookieExpiration}天后再次确认。');\n\
  }\n</script>\n</head>\n<body>\n<h1>这是您的 Web 组件</h1>\n<cookie-alert\nmessage=\"我们使用\
  \ Cookie，但尊重您的隐私！\"\nonaccepted=\"handleAccepted(event)\">\n</cookie-alert>\n</body>\n\
  </html>\n```\n\n我们定义了 `handleAccepted()` 事件处理程序，并将其赋值给标记中的 `onaccepted` 属性。当然，最终的行为与之前使用\
  \ `addEventListener()` 方法时相同。\n\n尽管属性的管理方式相当令人满意，但您应该注意此实现中的一个重要问题。考虑我们如何将事件处理程序赋值给\
  \ `onaccepted` 属性：\n\n```\nthis.onaccepted = new Function(\"event\", '${newValue}');\n\
  handleAccepted(event)\nfunction(event) {\nhandleAccepted(event)\n}\n```\n\n然而，这种方法施加了一个限制——用户必须在其事件处理程序中将事件名称指定为参数。假设用户指定了不同的名称，如下例所示：\n\
  \n```\nhandleAccepted(e)\nfunction(event) {\nhandleAccepted(e)\n}\n```\n\n为了获得一个标准化的解决方案，允许用户自由选择事件参数的名称，您应该实现一个更复杂的算法来考虑这一点。\n\
  \n### 移除事件监听器\n\n事件监听器是一种实用的方式，可以在组件发生某些事情时参与其中。正如您在本章中所见，您可以为构建组件 UI 的任何 HTML 元素创建事件监听器。然而，当您不再需要它们时，也需要妥善处理。\n\
  \n事件监听器会消耗系统资源。在不再需要时移除它们有助于优化资源管理。\n\n正如*第 3 章，创建自定义 Web 组件*中所述，您应该使用 `disconnectedCallback()`\
  \ 回调来释放为 Web 组件分配的资源。您还记得，当组件从 DOM 中移除时，会调用此回调。这意味着您的 Web 组件的事件监听器不再有存在的理由，因此您可以移除它们。但是，要移除事件监听器，您需要持有对它们的引用。那么，让我们看看可以采用哪种策略来正确管理\
  \ Web 组件的事件监听器生命周期。\n\n首先，我们需要一个存储事件监听器注册信息的地方。我们可以为此定义一个内部属性：\n\n```\nconstructor()\
  \ {\nsuper();\nthis._message = \"本网站使用 Cookie 以确保您获得最佳体验\";\nthis._onAcceptedListener\
  \ = null;\nthis._eventListeners = [];\n}\n```\n\n如上述代码所示，我们修改了 Cookie 提示的构造函数，添加了\
  \ `_eventListeners` 内部属性。该属性是一个数组，包含描述事件监听器注册信息的对象。每当我们添加一个事件监听器时，都需要向 `_eventListeners`\
  \ 属性添加一个对象。以下示例展示了如何修改 `CreateComponent()` 方法的代码，以添加“关闭”按钮：\n\n```\nconst closeButton\
  \ = document.createElement(\"button\");\ncloseButton.classList.add(\"button\");\n\
  closeButton.innerText = \"关闭\";\nconst clickHandler = ()=>{\nthis.style.visibility\
  \ = \"hidden\";\n};\ncloseButton.addEventListener(\"click\", clickHandler);\nthis._eventListeners.push({object:\
  \ closeButton, event: \"click\", handler: clickHandler});\ndiv.appendChild(closeButton);\n\
  ```\n\n我们将隐藏 Cookie 提示的箭头函数赋值给 `clickHandler` 常量。然后，使用它创建事件监听器。最后，向 `_eventListeners`\
  \ 数组添加一个对象，其中包含指向关闭按钮元素的指针、事件名称以及监听器的引用。此操作表示事件监听器的内部注册。\n\n**每当您在 Web 组件中添加事件监听器时，都应执行内部注册操作。为了提高代码的可读性和可维护性，最好为此创建一个通用函数。**\n\
  \n已注册监听器的移除发生在 `connectedCallback()` 方法中，如下代码片段所示：\n\n```\ndisconnectedCallback()\
  \ {\nthis._eventListeners.forEach((registration) => {\nregistration.object\n.removeEventListener(registration.event,\
  \ registration.listener);\n});\n```\n\n当您的组件从 DOM 中移除时，`_eventListeners` 属性中每个元素包含的信息将帮助您通过\
  \ `removeListener()` 方法移除关联的监听器。\n\n## 结论\n\n在本章中，您了解了如何让 Web 组件处理事件。在回顾了标准 DOM\
  \ 事件管理之后，我们探讨了监听标准事件的方式。然后，我们处理了自定义事件的创建，并讨论了如何将数据传递给事件监听器。我们还尝试复制标准 HTML 元素的 `onevent`\
  \ 风格属性的行为。我们展示了如何管理事件监听器的注册和注销，以防止不必要的系统资源消耗。\n\n学习如何管理事件，让您能够创建与用户交互的 Web 组件。这是组件在\
  \ Web UI 中使用的关键特性。您在组件中创建的事件与标准事件无异。因此，使用您组件的开发者可以采用标准方法来处理它们。\n\n在下一章中，您将学习如何通过利用影子\
  \ DOM 为 Web 组件实现封装。您将看到这一标准特性如何保护组件的内部结构免受外部干扰。\n\n## 问题\n\n1.  处理事件的三种标准方法是什么？\n\
  2.  DOM 事件传播的阶段有哪些？\n3.  Web 组件可以监听哪些标准事件？\n4.  如何防止用户向您的 Web 组件附加事件监听器？\n5.  自定义事件的构造函数是什么？\n\
  6.  如何在自定义事件中传递数据？\n7.  为什么应该移除在 Web 组件中注册的事件监听器？\n8.  移除组件事件监听器的最佳 Web 组件回调是什么？\n\
  \n# 第 6 章\n\n### 使用影子 DOM\n\nWeb 组件旨在用于并非总是由我们控制的 HTML 页面。用户可能会将您的组件放在他们的网页上，而您不知道该页面是如何工作的。在某些情况下，您可能会遇到一些与您为组件设计的行为产生的不必要干扰。\n\
  \n在本章中，您将了解 Cookie 提示组件与页面**文档对象模型（DOM）**之间可能存在的几种干扰示例。我们将讨论传统上如何解决这些问题，以及如何通过使用影子\
  \ DOM 来解决它们。我们还将通过实际示例讨论开放影子 DOM 和封闭影子 DOM 之间的区别。\n\n在本章中，我们将为 Cookie 提示组件添加影子 DOM\
  \ 支持，以展示如何在实际中使用它。\n\n## 结构\n\n*   Web 组件与 DOM\n*   影子 DOM\n*   开放与封闭影子 DOM\n\n\n\
  \n\n\n## 目标\n\n本章将让你意识到，当 Web 组件嵌入到未知网页中时可能出现的问题。你将能够通过使用影子 DOM 来预防这些问题。此外，你还会了解开放和封闭的影子\
  \ DOM，并决定你的组件应该使用哪种类型。\n\n## Web 组件与 DOM\n\n正如你目前所见，DOM 操作是创建自定义元素乃至 Web 组件的关键部分。与\
  \ DOM 完美集成的能力使得你的 Web 组件几乎与标准 HTML 元素难以区分。然而，这种 DOM 集成能力对组件来说也带来了一些问题。与 DOM 的紧密集成导致了一些阻碍\
  \ Web 组件成为真正组件的问题——即那些拥有自身外观和行为、易于复用的 UI 元素。\n\n让我们来看看这种紧密集成可能产生的问题。\n\n### 全局 DOM\n\
  \n`DOM` 是页面上 HTML 元素的基于对象的表示。这意味着 HTML 页面中的每个元素都由 DOM 树中的一个对象表示。标准 HTML 元素和自定义元素都是如此。然而，由于自定义元素通常由\
  \ HTML 元素和其他自定义元素构建而成，最终其所有组成项都会出现在 DOM 树中。\n\n考虑一个包含 cookie 提醒 Web 组件的典型 HTML 页面：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with Webpack Build\
  \ System</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n\
  <script src=\"./bundle.js\"></script>\n</head>\n<body>\n<h1>Here is your Web Component</h1>\n\
  <cookie-alert message=\"We use cookies, but respect your privacy!\"></cookie-alert>\n\
  </body>\n</html>\n```\n\n如果你使用常用浏览器的工具（例如 Chrome 的 `开发者工具`）检查生成的 HTML，你应该会看到如下截图所示的标记：\n\
  \n![](img/Figure_6.1.jpg)\n\n**图 6.1**\n\n如你所见，我们的自定义标签 `<cookie-alert>` 包含了对应自定义元素\
  \ DOM 的标记。其中包括样式元素和包含文本及按钮的 `<div>`（这些是你通过 JavaScript 添加的）。\n\n这些元素已集成到页面的 DOM 中，因此它们像页面上的任何其他元素一样工作。例如，你可以通过以下代码访问\
  \ cookie 提醒的文本：\n\n`document.querySelector(\"div.container span\").innerText`\n\n\
  当然，更合理的做法是使用组件的 `message` 属性来获取文本，如下所示：\n\n`document.querySelector(\"cookie-alert\"\
  ).message`\n\n然而，没有人阻止你访问 Web 组件的内部 DOM 结构。DOM 就像一个全局变量：任何代码都可以访问它并修改其值。就像全局变量一样，它带来了所有缺陷，我们将在下一节中看到。\n\
  \n### DOM 的问题\n\n虽然前面的例子可能是使用你组件的开发者的选择，但当你的组件被插入到任意复杂度的页面中时，还可能出现其他陷阱。例如，考虑如下 HTML\
  \ 页面：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with Webpack\
  \ Build System</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"></script>\n\
  <script src=\"./bundle.js\"></script>\n<style>\nbutton {\nborder-style: dotted;\n\
  background-color: red !importan\n}\n</style>\n</head>\n<body>\n<h1>Here is your\
  \ Web Component</h1>\n<button>Click here!</button>\n<cookie-alert message=\"We use\
  \ cookies, but respect your privacy!\"></cookie-alert>\n</body>\n</html>\n```\n\n\
  你有一条 CSS 规则，定义了当前页面上 `button` 元素的边框样式和背景颜色。同时，页面中在标题下方有一个按钮元素。运行此页面，你将得到以下结果：\n\n\
  ![](img/Figure_6.2.jpg)\n\n**图 6.2**\n\n如你所见，CSS 规则不仅应用于页面上的按钮，还应用于嵌入在 cookie 提醒组件中的按钮。这可能会令人失望。\n\
  \n此外，考虑以下标记：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with\
  \ Webpack Build System</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"\
  ></script>\n<script src=\"./bundle.js\"></script>\n<style>\nbutton {\nborder-style:\
  \ dotted;\nbackground-color: red !importan\n}\n.container {\nbackground-color: gray;\n\
  }\n</style>\n</head>\n<body class=\"container\">\n<h1>Here is your Web Component</h1>\n\
  <button>Click here!</button>\n<cookie-alert message=\"We use cookies, but respect\
  \ your privacy!\"></cookie-alert>\n</body>\n</html>\n```\n\n你添加了一条新的 CSS 规则，定义了一个带有灰色背景的\
  \ `container` 类，并将此类应用于文档的 `body`。根据这条规则，你期望页面背景为灰色。然而，HTML 页面将呈现为如下截图所示：\n\n![](img/Figure_6.3.jpg)\n\
  \n**图 6.3**\n\n页面背景并非如页面级 CSS 规则所声明的灰色，而是蓝色，正如组件级 CSS 规则所定义的那样。发生的情况是页面级和组件级 CSS\
  \ 类之间意外的名称冲突。\n\n当然，用户不应该需要了解我们组件的内部细节。因此，这两个例子可能会让你质疑 Web 组件技术的真正有效性。\n\n更糟糕的是，假设你向这个\
  \ HTML 页面添加了几行 JavaScript，如下所示：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web\
  \ Components with Webpack Build System</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"\
  ></script>\n<script src=\"./bundle.js\"></script>\n<style>\nbutton {\nborder-style:\
  \ dotted;\nbackground-color: red !importan\n}\n.container {\nbackground-color: gray;\n\
  }\n</style>\n<script>\nwindow.addEventListener(\"load\", ()=>{\nlet buttons = document.querySelectorAll(\"\
  button\");\nbuttons.forEach((btn)=>{\nbtn.disabled = true;\n});\n});\n</script>\n\
  </head>\n<body class=\"container\">\n<h1>Here is your Web Component</h1>\n<button>Click\
  \ here!</button>\n<cookie-alert message=\"We use cookies, but respect your privacy!\"\
  ></cookie-alert>\n</body>\n</html>\n```\n\n你添加了一段脚本，禁用了当前页面上的所有按钮。这可能是为了实现某种管理页面用户元素的特定逻辑。然而，这段代码也影响了\
  \ cookie 提醒内部的按钮。\n\n所有这些例子应该清楚地表明，你的 Web 组件的内部实现并不安全。外部代码可能有意或无意地影响你的组件。换句话说，你的\
  \ Web 组件缺乏封装。\n\n封装是对象隐藏其内部表示和行为的能力。它允许你设计一个对象或组件，使其通过公共接口与外部世界交互，同时保持内部状态的私有性。这一特性使你能够将组件的内部行为与外部世界解耦。它允许你更改内部表示或行为，而不影响公共接口和外部世界。换句话说，封装使你的组件成为一个真正的组件。\n\
  \n### DOM 封装的尝试\n\n因此，我们刚刚发现，当前 cookie 提醒组件的实现无法免受外部干扰。由于封装是组件的一项必要特性，我们该如何解决这个恼人的问题呢？\n\
  \n\n\n\n\n**需要明确的是，DOM 的全局可访问性并非 Web Components 技术本身的问题。这是标准 DOM 的特性，并且会影响你用基于浏览器的技术构建的任何类型的组件，包括\
  \ Angular、React、Vue 等框架。**\n\n解决这种封装问题的传统方法是将代表组件的 DOM 部分嵌入到一个独立的 DOM 中，即一个独立的 HTML\
  \ 页面中。然后通过 `iframe` 将该页面附加到主页面。例如，*Google* 允许开发者嵌入其地图和 *YouTube* 视频时，就采用了这种典型方法。\n\
  \n要将此解决方案应用于我们的 Cookie 提醒组件，我们需要重新组织组件的代码，以便创建一个 `iframe`，将该 `iframe` 作为组件的主容器，并将其他所有元素附加到\
  \ `iframe` 页面的 DOM 中。实际上，组件的 `createComponent()` 方法应该类似于以下代码：\n\n```\ncreateComponent()\
  \ {\nconst iframe = document.createElement(\"iframe\");\niframe.style.border = 0;\n\
  iframe.style.height = \"200px\";\nconst style = document.createElement(\"style\"\
  );\nstyle.appendChild(document.createTextNode(styleRules));\niframe.contentDocument.body.appendChild(style);\n\
  const span = document.createElement(\"span\");\nconst div = document.createElement(\"\
  div\");\ndiv.classList.add(\"container\", \"footer\");\ndiv.appendChild(span);\n\
  // other code\niframe.contentDocument.body.appendChild(div);\nthis.appendChild(iframe);\n\
  this.updateMessage();\n}\n```\n\n尽管这种方法可能让你产生问题已解决的错觉，但它仍然存在一些 `问题`。你需要通过编程方式控制\
  \ `iframe` 的边框粗细和高度，以营造组件与主页面集成的假象。但你的组件并未真正与页面集成，而且你无法真正控制 `iframe` 的高度。Iframe\
  \ 的响应性并不好。此外，iframe 的设计初衷是在当前页面中嵌入另一个完整的文档。当我们想要将数据从父文档传递到子文档时，这会增加复杂性。换句话说，我们需要添加一个代码层，将数据从组件传递到内部文档，反之亦然。同时，我们还会失去上一章学到的所有事件处理功能。\n\
  \n总之，iframe 并不是解决 Web Components 封装问题的方案。\n\n## 影子 DOM\n\n在介绍 Web Components 时，我们说过它们源于三种技术的结合——自定义元素、影子\
  \ DOM 和 HTML 模板。正如你所见，影子 DOM 是这些使能技术之一。它正是帮助我们解决前面章节中指出的封装问题的技术。\n\n### 什么是影子 DOM\n\
  \n影子 DOM 是一组标准 API，允许你将一个私有的 DOM 附加到任何 HTML 元素上。这个私有 DOM 与页面 DOM 类似，但其内部结构不受全局 DOM\
  \ 状态的影响。\n\n当你将组件附加到 DOM 时，它的影子 DOM 会附加到全局 DOM 上，但保持私有。下图来自 *Mozilla 开发者网络文档，直观地展示了*\
  \ 这一过程：\n\n![](img/Figure_6.4.jpg)\n\n**图 6.4**\n\n**[来源](https://developer.mozilla.org/en-US/docs/Web/Web_Components/Using_shadow_DOM)**\n\
  \n从这张图中，你可以看到影子 DOM 有特定的术语。让我们尝试定义一些常用术语。\n\n*   **影子 DOM**：这是一种对象模型技术和 API，允许你将一个私有的\
  \ DOM 附加到 HTML 元素上。\n*   **影子树**：与 HTML 元素关联的私有节点树；该树无法从全局 DOM 直接访问。\n*   **光树**：这是一个常规的节点子树。\n\
  *   **影子宿主**：拥有关联影子树的 HTML 元素。\n*   **影子根**：影子树的根节点。\n\n这些术语可能看起来有些令人困惑，但我们将通过实际使用影子\
  \ DOM 来理解，希望你的疑问会随之消散。\n\n### 使用影子 DOM\n\n让我们看看如何通过使用影子 DOM 为我们的 Cookie 提醒组件添加封装。第一步，你需要在组件的构造函数中启用它。以下是新版本构造函数的样子：\n\
  \n```\nconstructor() {\nsuper();\nthis._message = \"This website uses cookies to\
  \ ensure you get the best experience\";\nthis.attachShadow({mode: \"open\"});\n\
  this._onAcceptedListener = null;\n}\n```\n\n你添加了一条新语句，将影子 DOM 的一个实例附加到当前组件上。根据上面的定义，组件本身（由\
  \ `this` 关键字标识）就是影子宿主。`attachShadow()` 方法创建了一个影子树的实例，该树仅由它的根节点（即影子根）组成。这个影子根可以通过组件的\
  \ `shadowRoot` 属性访问。从现在开始，任何与组件 UI 构建相关的操作都将涉及 `shadowRoot` 属性，而不是组件本身。\n\n考虑 `createComponent()`\
  \ 方法的新版本：\n\n```\ncreateComponent() {\nconst style = document.createElement(\"style\"\
  );\nstyle.appendChild(document.createTextNode(styleRules));\nthis.shadowRoot.appendChild(style);\n\
  const span = document.createElement(\"span\");\nconst div = document.createElement(\"\
  div\");\ndiv.classList.add(\"container\", \"footer\");\ndiv.appendChild(span);\n\
  const closeButton = document.createElement(\"button\");\ncloseButton.classList.add(\"\
  button\");\ncloseButton.innerText = \"Close\";\ncloseButton.addEventListener(\"\
  click\", ()=>{\nthis.style.visibility = \"hidden\";\n});\ndiv.appendChild(closeButton);\n\
  const acceptButton = document.createElement(\"button\");\nacceptButton.classList.add(\"\
  button\");\nacceptButton.innerText = \"Accept\";\nacceptButton.addEventListener(\"\
  click\", ()=>{\nthis.style.visibility = \"hidden\";\nsetCookie(\"cookiesAccepted\"\
  , \"y\", 365);\nthis.dispatchEvent(new CustomEvent(\"accepted\", {\ndetail:{\nacceptedCookieName:\
  \ \"cookiesAccepted\",\nacceptedCookieExpiration: 365}\n}));\n});\ndiv.appendChild(acceptButton);\n\
  this.shadowRoot.appendChild(div);\nthis.updateMessage();\n}\n```\n\n如你所见，之前我们通过\
  \ `this` 关键字直接将 HTML 元素附加到组件上，而现在这些元素必须附加到 `shadowRoot` 属性上。\n\n我们还需要调整之前附加到组件上的任何元素的引用。例如，我们需要对\
  \ `updateMessage()` 方法进行如下修改：\n\n```\nupdateMessage() {\nthis.shadowRoot.querySelector(\"\
  span\").innerText = this._message;\n}\n```\n\n这些小小的改动为我们的 Cookie 提醒组件启用了封装。如果你运行项目，生成的页面会如预期显示，如下面的截图所示：\n\
  \n![](img/Figure_6.5.jpg)\n\n**图 6.5**\n\n现在，Cookie 提醒组件的内部结构受到了保护，免受外部干扰。如果你使用浏览器的检查器查看生成的标记，会发现类似下面的内容：\n\
  \n![](img/Figure_6.6.jpg)\n\n**图 6.6**\n\n你会看到仍然存在对应组件 UI 的标记，但它被封装在了一个 `#shadow-root`\
  \ 指令中。该指令标记了包含的标记不可直接访问。\n\n### 开放与封闭的影子 DOM\n\n我们说过，使用影子 DOM 后，Web 组件的内部结构无法直接访问。这意味着\
  \ Web 组件的内部结构受到保护，免受由 CSS 规则或操作通用 HTML 元素的 JavaScript 代码可能造成的外部干扰。\n\n\n\n\n\n然而，Web\
  \ 组件的内部结构仍然可以通过影子宿主元素的 `shadowRoot` 属性访问。例如，你可以使用以下代码禁用 HTML 页面中 cookie 提醒组件的按钮：\n\
  \n```\nconst cookieAlert = document.querySelector(\"cookie-alert\");\nconst componentDOM\
  \ = cookieAlert.shadowRoo\nlet buttons = componentDOM.querySelectorAll(\"button\"\
  );\nbuttons.forEach((btn)=>{\nbtn.disabled = true;\n});\n```\n\n你访问了组件的 `shadowRoot`\
  \ 属性，并将其当作常规 DOM 使用。当然，这是你故意访问组件的内部结构。因此，你只受到保护，免受意外干扰，而任何开发者都可以更改你组件的结构。\n\n这取决于你选择附加到组件的影子\
  \ DOM 类型。请看将影子 DOM 附加到 cookie 提醒组件的语句：\n\n`this.attachShadow({mode: \"open\"});`\n\
  \n我们向 `attachShadow()` 方法传递了一个指定选项的对象。这个对象告诉我们影子 DOM 模式应为开放。开放的影子 DOM 可以通过 `shadowRoot`\
  \ 属性在组件外部访问。因此，我们上面注意到的行为是设计使然。\n\n如果你不想将组件的影子 DOM 暴露给外部世界，你需要一个封闭的影子 DOM。你可以通过将\
  \ `closed` 值指定为影子 DOM 模式，将封闭的影子 DOM 附加到你的组件。\n\n以下代码展示了如何更改 cookie 提醒构造函数以启用封闭的影子\
  \ DOM：\n\n```\nconstructor() {\nsuper();\nthis._message = \"This website uses cookies\
  \ to ensure you get the best experience\";\nthis._shadowRoot = this.attachShadow({mode:\
  \ \"closed\"});\nthis._onAcceptedListener = null;\n}\n```\n\n在创建开放影子 DOM 时，我们使用了\
  \ `attachShadow()` 方法，然后使用 `shadowRoot` 属性来追加和操作内部 DOM。我们没有将 `attachShadow()` 方法的结果赋值给任何变量。`attachShadow()`\
  \ 方法的作用是将根节点添加到影子宿主的 `shadowRoot` 属性中。\n\n当你通过向 `attachShadow()` 方法传递 `{mode: \"\
  closed\"}` 来附加封闭影子 DOM 时，`shadowRoot` 属性仍然返回 `null`。这阻止了从外部访问 DOM。在这种情况下，要从组件内部访问影子\
  \ DOM，你必须将 `attachShadow()` 方法的结果赋值给一个变量。在上面的例子中，我们将封闭的影子 DOM 赋值给了内部属性 `_shadowRoot`。\n\
  \n请注意，像示例中那样使用 `this._shadowRoot` 属性，你的组件的影子 DOM 并非完全不可访问。遍历组件属性的用户会弄清楚 `_shadowRoot`\
  \ 属性的含义，并仍然使用它来访问其内部结构。要尝试锁定组件的影子 DOM，你应该将其赋值给一个局部变量、一个 `WeakMap` 或一个私有属性（当私有属性成为标准并被广泛支持时）。\n\
  \n**请记住，封闭的影子 DOM 并非安全措施。用户仍然可以影响你组件的影子 DOM，甚至只需使用影子宿主元素的** `attachShadow()` **方法即可。**\n\
  \n因此，我们将 cookie 提醒组件的封闭影子 DOM 赋值给了对 `_shadowRoot` 属性的引用。从现在开始，任何对内部 DOM 的操作都将通过这个属性进行。以下是\
  \ `createComponent()` 方法的修订代码：\n\n```\ncreateComponent() {\nconst style = document.createElement(\"\
  style\");\nstyle.appendChild(document.createTextNode(styleRules));\nthis._shadowRoot.appendChild(style);\n\
  const span = document.createElement(\"span\");\nconst div = document.createElement(\"\
  div\");\ndiv.classList.add(\"container\", \"footer\");\ndiv.appendChild(span);\n\
  const closeButton = document.createElement(\"button\");\ncloseButton.classList.add(\"\
  button\");\ncloseButton.innerText = \"Close\";\ncloseButton.addEventListener(\"\
  click\", ()=>{\nthis.style.visibility = \"hidden\";\n});\ndiv.appendChild(closeButton);\n\
  const acceptButton = document.createElement(\"button\");\nacceptButton.classList.add(\"\
  button\");\nacceptButton.innerText = \"Accept\";\nacceptButton.addEventListener(\"\
  click\", ()=>{\nthis.style.visibility = \"hidden\";\nsetCookie(\"cookiesAccepted\"\
  , \"y\", 365);\nthis.dispatchEvent(new CustomEvent(\"accepted\", {\ndetail:{\nacceptedCookieName:\
  \ \"cookiesAccepted\",\nacceptedCookieExpiration: 365}\n}));\n});\ndiv.appendChild(acceptButton);\n\
  this._shadowRoot.appendChild(div);\nthis.updateMessage();\n}\n```\n\n此外，`updateMessage()`\
  \ 方法也需要更改，以引用 `this._shadowRoot` 属性：\n\n```\nupdateMessage() {\nthis._shadowRoot.querySelector(\"\
  span\").innerText = this._message;\n}\n```\n\n现在，当你运行项目时，cookie 提醒组件将继续像以前一样工作。但如果你使用浏览器的检查器查看生成的标记，你会发现类似以下内容：\n\
  \n![](img/Figure_6.7.jpg)\n\n**图 6.7**\n\n影子 DOM 的标记不再可用。\n\n那么，此时你可能会想，应该为你的 Web\
  \ 组件使用哪种类型的影子 DOM——开放还是封闭？\n\n当然，这是一个设计选择。你可以选择阻止访问组件的内部结构，并允许用户仅通过公共属性和方法与之交互。然而，这意味着你应该精确设计组件的公共接口，以确保其所有可能的用途。考虑到你的组件的用户不仅可以在他们的页面中添加它，还可以扩展你的组件。在这种情况下，访问影子\
  \ DOM 可能有助于根据用户的需求调整其外观和行为。\n\n## 结论\n\n在本章中，你发现到目前为止构建的 cookie 提醒组件尚未准备好成为一个真正的组件。它缺乏封装性。你了解到这是由于\
  \ DOM 的全局性造成的，并经历了一些情况，其中这一点会以不必要的干扰影响你的组件。传统上用于克服此问题的方法基于 iframe，但这种方法复杂且无法解决问题。我们解释了解决封装性缺失的方案是影子\
  \ DOM。我们在 cookie 提醒组件中使用了这一特性，并展示了应用它有多么容易。最后，我们讨论了开放和封闭影子 DOM 之间的区别。\n\n现在，在本章结束时，你已经掌握了创建真正组件的技术，这些组件的内部结构不会受到外部干扰的影响。\n\
  \n在下一章中，你将学习如何通过利用 HTML 模板来简化 Web 组件 UI 的定义。此外，你还将学习如何使你的组件更加灵活，允许用户在组件内部添加其他 HTML\
  \ 元素。\n\n## 问题\n\n1.  什么是封装？\n2.  为什么封装是组件的一个理想特性？\n3.  为什么全局 DOM 不支持封装？\n4.  提供某种封装形式的传统方法是什么？\n\
  5.  什么是影子 DOM？\n6.  影子宿主和影子根之间的区别是什么？\n7.  为你的 Web 组件添加影子 DOM 支持的方法是什么？\n8.  如何防止用户访问影子\
  \ DOM？\n9.  开放和封闭影子 DOM 之间的区别是什么？\n\n# 第 7 章\n\n## 使用 HTML 模板\n\n尽管并非严格必需，但大多数 Web\
  \ 组件都有一个 UI 来显示数据和图形，并允许用户与之交互。我们在前几章中学习了如何为我们的 Web 组件创建 UI，并对我们的 cookie 提醒组件应用了几种不同的技术。\n\
  \n\n\n\n\n在本章中，我们将分析迄今为止用于实现 Web 组件 UI 的技术，并探索一种基于原生 HTML 模板的新替代方法。我们将讨论这种方法带来的好处，并展示如何将其应用于\
  \ cookie 警告组件。\n\n此外，我们还将进一步探索一种方法，使 Web 组件能够将其 UI 的标记与用户提供的任意标记相结合。这种基于 `<slot>`\
  \ 元素的方法扩展了原生 HTML 模板的能力。这样，我们就可以拥有更丰富、更灵活、更强大的组件，其行为与标准 HTML 元素（如 `<div>`、`<p>`、`<select>`\
  \ 或其他允许在标签内插入标记的元素）非常相似。\n\n像往常一样，我们将把这些新概念应用到我们的 cookie 警告组件中，以展示如何在实际中使用它们。\n\n\
  ## 结构\n\n*   介绍模板\n*   使用插槽组合标记\n\n## 目标\n\n在本章中，你将学习原生 HTML 模板，并发现如何使用它们为你的 Web\
  \ 组件定义声明式且高效的 UI。此外，你还将学习如何让你的 Web 组件将其 UI 标记与用户提供的自定义标记相结合。\n\n## 介绍模板\n\n在*第 3\
  \ 章，创建自定义 Web 组件*中，我们开始通过表示所需标记的字符串来构建 cookie 警告组件的用户界面。这里我们回顾一下当时定义的两个常量：\n\n```javascript\n\
  const styleMarkup = '\n<style>\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color:\
  \ rgb(35, 122, 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n</style>';\n\nconst componentMarkup\
  \ = '\n<div class=\"container footer\">\n<span>This website uses cookies to ensure\
  \ you get the best experience</span>\n</div>';\n```\n\n这些常量被拼接并赋值给组件的 `innerHTML`\
  \ 属性。这种方法简单明了，因为它以声明方式通过标记提供了 UI 结构。然而，当 UI 变得更加复杂时，管理起来就不那么容易了。因此，我们转向了基于 DOM 的方法，其中\
  \ UI 的每个元素都通过 DOM API 动态创建。实际上，我们对 `styleRules` 常量保留了基于字符串的方法，并引入了 `createComponent()`\
  \ 方法来构建 UI 的 HTML 元素，如下代码所示：\n\n```javascript\ncreateComponent() {\nconst style\
  \ = document.createElement(\"style\");\nstyle.appendChild(document.createTextNode(styleRules));\n\
  this.shadowRoot.appendChild(style);\nconst span = document.createElement(\"span\"\
  );\nconst div = document.createElement(\"div\");\ndiv.classList.add(\"container\"\
  , \"footer\");\ndiv.appendChild(span);\nconst closeButton = document.createElement(\"\
  button\");\ncloseButton.classList.add(\"button\");\ncloseButton.innerText = \"Close\"\
  ;\ncloseButton.addEventListener(\"click\", ()=>{\nthis.style.visibility = \"hidden\"\
  ;\n});\ndiv.appendChild(closeButton);\nconst acceptButton = document.createElement(\"\
  button\");\nacceptButton.classList.add(\"button\");\nacceptButton.innerText = \"\
  Accept\";\nacceptButton.addEventListener(\"click\", ()=>{\nthis.style.visibility\
  \ = \"hidden\";\nsetCookie(\"cookiesAccepted\", \"y\", 365);\nthis.dispatchEvent(new\
  \ CustomEvent(\"accepted\", {\ndetail:{\nacceptedCookieName: \"cookiesAccepted\"\
  ,\nacceptedCookieExpiration: 365}\n}));\n});\ndiv.appendChild(acceptButton);\nthis.shadowRoot.appendChild(div);\n\
  this.updateMessage();\n}\n```\n\n这种新方法提供了一种更灵活的方式来创建组件的 UI，特别是当你要创建的 HTML 元素依赖于外部参数时。然而，通过这种编程方式，我们失去了基于字符串方法的清晰性。通过\
  \ DOM API 构建 UI 功能强大，但在许多情况下可能并不方便。此外，编写和维护也不那么容易。\n\n### 什么是模板？\n\n定义 Web 组件 UI\
  \ 的另一种方法是使用模板。\n\n在 Web 编程的上下文中，创建 HTML 模板是一项非常常见的任务。它既发生在服务器端，也发生在客户端。如你所知，HTML\
  \ 模板是一种准备好的 HTML 标记，允许你在特定点插入自定义片段。在某种程度上，我们在使用包含 UI 标记的常量字符串时就是在定义模板，但我们将了解到基于字符串的方法存在一些缺陷。\n\
  \nHTML 标准为你提供了 `<template>` 元素。这个元素允许你声明一个模板，即 HTML 元素的结构。你可以通过简单地将标记添加到 `<template>`\
  \ 元素中，并根据需要将其附加到 HTML 页面的 `<head>` 或 `<body>` 中来实现。请看以下示例：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<template id=\"myTemplate\">\n<div>\n<img src=\"images/logo.png\"\
  >\n<p>This is a sample text</p>\n</div>\n</template>\n</head>\n<body>\n…\n</body>\n\
  </html>\n```\n\n在这个示例中，我们在 HTML 页面的 `<head>` 部分定义了一个模板。该模板定义了一个包含图片和段落的 `<div>`\
  \ 元素。\n\n注意，我们为模板分配了一个标识符。这个 id 允许我们在运行时使用模板时识别它。该模板将用于生成 DOM 结构的实例，以便附加到 DOM 中，我们稍后会看到。\n\
  \n你可以在模板元素中声明任何有效的标记，包括 `<style>` 和 `<script>` 元素。你甚至可以包含 `<template>` 元素本身。\n\n\
  你还可以定义包含部分或不完整元素的模板。例如，以下是一个有效的模板：\n\n```html\n<template id=\"myTemplate\">\n<li>\n\
  <span>This is just one item</span>\n</li>\n</template>\n```\n\n它不是一个完整的元素，因为它没有声明\
  \ `<ul>` 或 `<ol>` 包装元素。但你不能插入无效的 HTML，例如：\n\n```html\n<template id=\"myTemplate\"\
  >\n<span>\n<li>\nThis is just one item</span>\n</li>\n</template>\n```\n\n像任何其他\
  \ HTML 元素一样，你也可以通过 JavaScript 创建模板元素，如下例所示：\n\n```javascript\nconst template = document.createElement(\"\
  template\");\ntemplate.innerHTML = '\n<div>\n<img src=\"images/logo.png\">\n<p>This\
  \ is a sample text</p>\n</div>\n';\n```\n\n这些语句的效果与使用 `<template>` 标签静态声明模板相同。\n\
  \n现在，你大致了解了如何定义模板。但是，当你通过标记或 DOM API 声明模板时，会发生什么呢？\n\n当你声明一个模板时，其标记会被解析，并创建相应的 HTML\
  \ 元素。然而，整个生成的内容是惰性的且不可见的。\n\n这意味着实际上从模板标记生成的 DOM 是隐藏的，并且不会渲染。它不是当前文档的一部分，因此你不能通过\
  \ DOM API（如 `getElementById()` 或 `querySelector()`）访问其元素。此外，任何媒体引用（图片、视频、音频等）都不会被加载。这意味着，例如，上面模板中的图片在声明时不会被加载。脚本也不会被执行。\n\
  \n换句话说，模板的内容已准备好但未执行。所有这些只有在模板被使用时才会变为活动状态。\n\n### 激活模板\n\n要激活模板的内容，你必须克隆其内容并将其附加到\
  \ DOM 中。以下是激活上面定义的 `myTemplate` 模板的示例：\n\n```javascript\nconst myTemplate = document.getElementById(\"\
  myTemplate\").conten\ndocument.body.appendChild(myTemplate.cloneNode(true));\n```\n\
  \n\n\n\n\n我们通过 `content` 属性获取模板的内容，使用 `cloneNode()` 方法克隆它，并将结果追加到当前文档的 body 中。注意，传递给\
  \ `cloneNode()` 方法的 `true` 值表示执行深度克隆操作，即克隆节点及其属性和所有后代节点。\n\n你也可以使用 `importNode()`\
  \ 方法获得相同的结果，如下例所示：\n\n```\nconst myTemplate = document.getElementById(\"myTemplate\"\
  ).conten\ndocument.body.appendChild(document.importNode(myTemplate, true));\n```\n\
  \n你可能会疑惑为什么要克隆模板的内容，为什么不能直接将模板的内容附加到文档的 DOM 中。这至少有两个原因。\n\n1. 这是模板元素设计上的行为。模板的节点结构并不是\
  \ DOM 的活动结构。它只是一组冻结的节点，仅用作创建其他节点的参考。毕竟，这就是模板的意义所在。\n\n2. 第二个原因：它基于一个实际考虑，即模板可以（并且应该）被多个组件或同一组件的多个实例共享。想象一下，如果你可以直接使用模板的结构。你拿到模板，根据你的需求进行定制（例如，更改一些文本或添加另一个元素），然后将其附加到\
  \ DOM 中。如果另一个组件使用了同一个模板，它就会受到你对模板所做的更改的影响。在大多数情况下，这不是期望的效果。\n\n最后一点是关于嵌套模板。我们说过，一个模板可能包含另一个模板。以下是这样一个模板的示例：\n\
  \n```\n<template id=\"myTemplate\">\n<ul>\n<template id=\"nestedTemplate\">\n<li>\n\
  <span>This is just one item</span>\n</li>\n</template>\n</ul>\n</template>\n```\n\
  \n当你克隆外部模板 `myTemplate` 时，你不会自动激活内部模板 `nestedTemplate`。你必须通过手动克隆来激活内部模板。\n\n###\
  \ 为什么要使用模板？\n\n现在你应该对原生模板是什么以及如何使用它有了概念。然而，你可能仍然想知道为什么要使用它。与基于字符串或基于 DOM 的方法相比，它提供了哪些优势？\n\
  \n让我们比较这三种方法，并尝试理解每种方法提供的优点和缺点。\n\n当你使用字符串来描述 UI 的标记时，每次创建组件时，都会经历以下步骤：\n\n1. 解析文本，检查\
  \ HTML 标记的有效性\n2. 创建 DOM 元素\n3. 将 DOM 元素附加到 DOM\n\n当你使用基于 DOM 的方法时，创建组件时执行的步骤如下：\n\
  \n1. 创建 DOM 元素\n2. 将 DOM 元素附加到 DOM\n\n实际上，在这种情况下，你没有解析步骤，因为你直接创建了所需的 HTML 元素。\n\n\
  通过使用模板，你只需要一个步骤：\n\n1. 将 DOM 元素附加到 DOM\n\n解析和 DOM 元素创建步骤必须在声明模板时完成。对于组件的任何实例，这只会发生一次。\n\
  \n因此，通过使用模板，你为基于字符串的方法的声明式方法增加了效率。\n\n## 模板的实际应用\n\n在介绍模板之后，让我们将它们应用到我们的 cookie\
  \ 提醒组件中。我们将用基于模板的方法替换当前构建 UI 的方法——基于 DOM 的方法。那么，让我们修改定义我们组件的 `index.js` 文件。\n\n\
  我们做的第一件事是将 `styleRules` 常量声明替换为以下内容：\n\n```\nconst template = document.createElement('template');\n\
  template.innerHTML = `\n<style>\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color:\
  \ rgb(35, 122, 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n.button {\ncolor: rgb(255,\
  \ 255, 255);\nbackground-color: transparen\nborder-color: rgb(255, 255, 255);\n\
  padding: 5px 40px;\nmargin-right: 50px;\ncursor: pointer;\nfloat:righ\n}\n</style>\n\
  <div class=\"container footer\">\n<span id=\"message\"></span>\n<button id=\"closeButton\"\
  \ class=\"button\">Close</button>\n<button id= \"acceptButton\" class=\"button\"\
  >Accept</button>\n</div>\n`;\n```\n\n我们通过 JavaScript 创建模板，并将基本 UI 标记赋值给它的 `innerHTML`\
  \ 属性。注意，模板同时包含了样式定义和 HTML 标记。\n\n请记住，模板定义代码位于组件类定义之外，因此它只执行一次，而不是在每次创建组件实例时执行。\n\
  \n然后，我们将构造函数修改如下：\n\n```\nconstructor() {\nsuper();\nthis._message = \"This website\
  \ uses cookies to ensure you get the best experience\";\nthis.attachShadow({mode:\
  \ \"open\"});\nthis.shadowRoot.appendChild(template.content.cloneNode(true));\n\
  this._onAcceptedListener = null;\n}\n```\n\n这里我们在附加影子 DOM 之后立即添加了模板激活语句。注意，我们不是将克隆的模板内容添加到\
  \ DOM，而是添加到当前组件的影子 DOM。你可能会疑惑为什么我们在构造函数中这样做。由于模板结构是静态的，也就是说，它不依赖于外部参数，我们可以在组件实例化时使用它，这样当我们需要自定义它时，它就已经准备好了。\n\
  \n在*第 3 章，创建自定义 Web 组件*中，我们说过不能在组件的构造函数中访问 DOM。然而，你看到这里我们通过 `appendChild()` 方法添加节点。请注意，这里你操作的是影子\
  \ DOM，即你刚刚附加的组件的私有 DOM。一旦影子 DOM 附加到你的组件，你就可以访问它。但是，你仍然不能从构造函数访问全局 DOM，因为在这个阶段，你的组件已经创建，但尚未添加到全局\
  \ DOM 中。\n\n由于我们使用了原生模板，我们不再需要 `createComponent()` 方法。该方法之前是用基于 DOM 的方法创建 UI 的。现在，UI\
  \ 是通过在构造函数中将模板内容添加到 DOM 来构建的。此时我们需要做的只是通过添加事件监听器或根据用户参数自定义外观来初始化 UI。\n\n那么，让我们用这个方法替换\
  \ `createComponent()` 方法：\n\n```\ninitComponent() {\nconst closeButton = this.shadowRoot.getElementById(\"\
  closeButton\");\ncloseButton.addEventListener(\"click\", ()=>{\nthis.style.visibility\
  \ = \"hidden\";\n});\nconst acceptButton = this.shadowRoot.getElementById(\"acceptButton\"\
  );\nacceptButton.addEventListener(\"click\", ()=>{\nthis.style.visibility = \"hidden\"\
  ;\nsetCookie(\"cookiesAccepted\", \"y\", 365);\nthis.dispatchEvent(new CustomEvent(\"\
  accepted\", {\ndetail:{\nacceptedCookieName: \"cookiesAccepted\",\nacceptedCookieExpiration:\
  \ 365}\n}));\n});\nthis.updateMessage();\n}\n```\n\n`initComponent()` 方法为关闭和接受按钮分配事件监听器，并调用\
  \ `updateMessage()` 来反映通过 message 属性或属性传递的值。\n\n此时，`connectedCallback()` 方法变为如下形式：\n\
  \n```\nconnectedCallback() {\nconst cookiesAccepted = getCookie(\"cookiesAccepted\"\
  )\nif (cookiesAccepted === \"y\") {\nthis.style.visibility = \"hidden\";\n} else\
  \ {\nthis.initComponent();\n}\n}\n```\n\n如你所见，我们调用的是 `initComponent()` 方法而不是 `createComponent()`\
  \ 方法。\n\n最后，为了适应新的模板标记，我们需要用这个新版本替换旧的 `updateMessage()` 方法：\n\n```\nupdateMessage()\
  \ {\n```\n\n\n\n\n```\nthis.shadowRoot.getElementById(\"message\").innerText = this._message;\n\
  }\n```\n\n我们不再将消息值赋给一个通用的 span，而是通过元素标识符访问 span 元素。\n\n### 使用插槽组合标记\n\n模板为我们提供了一种很好的方式，将声明式方法（用于定义\
  \ Web 组件的 UI）与效率结合起来。但从本质上讲，它们似乎只提供了内部好处。也就是说，它允许你（组件开发者）编写更少的代码，并以高效的方式渲染组件的 UI。但它并没有为你提供向组件添加新功能的机会。\n\
  \n当然，目前看来确实如此。你可以利用原生模板来获得 HTML 元素的组合。这意味着你可以允许组件的用户在其标签内嵌入他们自己的标记。许多标准 HTML 元素都支持元素组合。想想那些允许你拥有内部标记的元素。例如，考虑用于分组其他\
  \ HTML 元素的 `<div>` 元素；或者允许你在其标签内添加格式化文本的 `<p>` 元素，如下面的代码片段所示：\n\n```\n<p>\n这是一条<b>格式化</b>的<i>消息</i>！\n\
  </p>\n```\n\n这个例子简单展示了 `<p>` 元素如何允许你嵌入文本以及 `<b>` 和 `<i>` 元素。如果你的组件也能做到这一点，那该多好啊！\n\
  \n在本节中，我们将探讨如何为 Web 组件实现类似的效果。\n\n### 启用格式化文本\n\n让我们首先尝试定义我们希望 cookie 提醒组件具备的功能。到目前为止，我们允许用户通过\
  \ `message` 属性和特性来指定自定义消息。这很棒，但无法让用户指定格式化文本。我们希望允许用户像下面的例子那样指定格式化文本：\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>使用 Webpack 构建系统的 Web 组件</title>\n<script src=\"\
  ./wc-polyfills/webcomponents-loader.js\"></script>\n<script src=\"./bundle.js\"\
  ></script>\n</head>\n<body class=\"container\">\n<h1>这是你的 Web 组件</h1>\n<cookie-alert>\n\
  我们使用<b>cookies</b>，但尊重您的<b>隐私</b>！\n</cookie-alert>\n</body>\n</html>\n```\n\n我们在\
  \ `<cookie-alert>` 标签内放置了一些 HTML 格式的文本。我们希望获得与 `<p>` 元素类似的结果。\n\n幸运的是，这并不难实现，而且不需要编写太多代码。我们只需按如下方式更改模板的标记即可：\n\
  \n```\nconst template = document.createElement('template');\ntemplate.innerHTML\
  \ = ‘\n<style>\n…\n</style>\n<div class=\"container footer\">\n<slot id=\"message\"\
  ></slot>\n<button id=\"closeButton\" class=\"button\">关闭</button>\n<button id= \"\
  acceptButton\" class=\"button\">接受</button>\n</div>\n‘;\n```\n\n如你所见，我们简单地将 HTML\
  \ 标记中的 `<span id=”message”></span>` 元素替换为 `<slot id=”message”></slot>` 元素。\n\n那么，这个新的\
  \ `<slot>` 元素是什么呢？\n\n`<slot>` 元素允许你在模板中定义一个占位符。这个占位符可以由组件的用户通过嵌入在组件标签内的任何标记片段来填充。这正是我们在上面的标记中所做的，我们指定了格式化文本作为要显示的消息。\n\
  \n如果你使用这个小的改动运行组件项目，你将得到以下结果：\n\n![](img/Figure_7.1.jpg)\n\n**图 7.1**\n\n如你所见，cookie\
  \ 提醒组件显示的消息中，“cookies”和“privacy”这两个词以粗体显示。\n\n你可以通过嵌入内容为 `<slot>` 元素提供默认标记，如下例所示：\n\
  \n```\n<slot id=”message”>这是<b>默认</b>消息</slot>\n```\n\n如果使用组件时未提供标记，则会显示默认消息。\n\n\
  你可能注意到，组件模板中的 `<slot>` 元素具有 `id` 属性。这并不是使占位符工作所必需的。我们添加它是为了保持现有行为，即保留通过 `message`\
  \ 属性和特性指定消息的可能性。换句话说，`<slot>` 元素也扮演了它所替换的 `<span>` 元素的角色。\n\n但请注意，如果你在存在嵌入标记的情况下为\
  \ `message` 属性或特性赋值，则会显示嵌入的标记。\n\n### 命名插槽\n\n`<slot>` 元素为你的组件打开了新的可能性。当然，你可以在组件标签内指定任何标记，而不仅仅是定义格式化文本的标记。例如，你还可以嵌入其他\
  \ Web 组件。\n\n我们上面展示的例子只使用了一个占位符，由组件模板中唯一的 `<slot>` 元素标识。这个插槽的出现就是技术上所谓的**未命名默认插槽**。\n\
  \n你可以在模板中插入多个 `<slot>` 元素。并且你可以通过为每个插槽的 `name` 属性赋值来标识它们。例如，你可以有一个像下面这样的模板：\n\n\
  ```\nconst template = document.createElement('template');\ntemplate.innerHTML =\
  \ ‘\n<div>\n<slot name=”firstName”></slot>\n<slot name=”lastName”></slot>\n<slot\
  \ name=”address”></slot>\n</div>\n‘;\n```\n\n这里有三个由名称标识的插槽。标记与这些插槽所代表的占位符之间的匹配是通过\
  \ `slot` 属性完成的，如下例所示：\n\n```\n<my-custom-element>\n<span slot=”firstName”>John</span>\n\
  <span slot=”lastName”>Brown</span>\n<div slot=”address”>1 Trafalgar Square, London,\
  \ UK</div>\n</my-custom-element>\n```\n\n此示例中的每个 HTML 元素将替换模板中具有相同 `name` 值（与 `slot`\
  \ 属性值匹配）的对应 `<slot>` 元素。因此，生成的标记将类似于以下内容：\n\n```\n<div>\n<span>John</span>\n<span>Brown</span>\n\
  <div>1 Trafalgar Square, London, UK</div>\n</div>\n```\n\n你还可以组合命名和未命名的 `<slot>`\
  \ 元素，如下例所示：\n\n```\nconst template = document.createElement('template');\ntemplate.innerHTML\
  \ = ‘\n<div>\n<slot name=”firstName”></slot>\n<slot name=”lastName”></slot>\n<slot\
  \ name=”address”></slot>\n<slot>在此处放置描述</slot>\n</div>\n‘;\n```\n\n最后一个 `<slot>`\
  \ 元素没有 `name` 属性。这个插槽将被所有没有 `slot` 属性的顶级元素替换。例如，考虑以下 Web 组件标记：\n\n```\n<my-custom-element>\n\
  <h3>用户数据</h3>\n<span slot=”firstName”>John</span>\n<span slot=”lastName”>Brown</span>\n\
  <div slot=”address”>1 Trafalgar Square, London, UK</div>\n<div>\n<p>没有更多数据</p>\n\
  </div>\n</my-custom-element>\n```\n\n生成的标记将如下所示：\n\n```\n<div>\n<span>John</span>\n\
  <span>Brown</span>\n<div>1 Trafalgar Square, London, UK</div>\n<h3>用户数据</h3>\n<div>\n\
  <p>没有更多数据</p>\n</div>\n</div>\n```\n\n如你所见，未命名插槽会捕获所有没有 `slot` 属性的元素，无论它们原来的位置如何。这个未命名插槽被称为**默认插槽**。\n\
  \n**你只能有一个默认插槽。如果你有多个未命名插槽，只有第一个会成为默认插槽，并且它会捕获所有没有 `slot` 属性的顶级元素。**\n\n### 使用命名插槽\n\
  \n命名插槽允许你在组件的 UI 中定义多个占位符。这为组件的用户提供了通过标记进行定制的多个切入点。\n\n让我们在 cookie 提醒组件中利用这一特性，稍微更改其模板的标记，如下面的代码片段所示：\n\
  \n```\nconst template = document.createElement('template');\ntemplate.innerHTML\
  \ = ‘\n<style>\n…\n</style>\n<div class=\"container footer\">\n```\n\n\n\n\n`<slot\
  \ id=\"message\" name=\"message\"></slot>&nbsp;`\n`<slot name=\"reference\"></slot>`\n\
  `<button id=\"closeButton\" class=\"button\">Close</button>`\n`<button id= \"acceptButton\"\
  \ class=\"button\">Accept</button>`\n`</div>`\n`‘;`\n\n我们为现有的 `<slot>` 元素添加了 `name`\
  \ 属性，并新增了一个名为 `reference` 的插槽。我们希望用户能够像之前一样，为组件的主消息指定格式化的标记，同时也能为 cookie 管理策略的详细参考提供标记。\n\
  \n以下是使用这些插槽的示例：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with\
  \ Webpack Build System</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"\
  ></script>\n<script src=\"./bundle.js\"></script>\n</head>\n<body class=\"container\"\
  >\n<h1>Here is your Web Component</h1>\n<cookie-alert>\n<span slot=\"message\">We\
  \ use <b>cookies</b>, but respect your <b>privacy</b>!</span>\n<span slot=\"reference\"\
  >Read our <a href=\"privacy.html\">privacy policy</a></span>\n</cookie-alert>\n\
  </body>\n</html>\n```\n\n在 `<cookie-alert>` 标签内有两个 `<span>` 元素。每个 `<span>` 元素都引用了模板中定义的插槽。运行项目后，你将看到以下结果：\n\
  \n![](img/Figure_7.2.jpg)\n\n**图 7.2**\n\n你会看到用户提供的两条消息。当然，用户需要提供所有相关资源，例如链接中指定的\
  \ `privacy.html` 文件。\n\n这一切都归功于插槽机制。无需其他代码！\n\n## 结论\n\n本章致力于从 Web 组件开发者和 Web 组件使用者两个角度改进用户界面的创建。\n\
  \n从 Web 组件开发者的角度来看，我们介绍了原生模板，并发现它们为我们提供了一种声明式的方法来定义 UI。原生 HTML 模板还提供了一种高效的方式来渲染\
  \ HTML 元素。我们使用原生模板方法重新设计了之前开发的 cookie 提醒组件。\n\n从 Web 组件使用者的角度来看，我们发现原生模板允许他们用自定义标记来组合我们的\
  \ Web 组件。我们可以通过使用 `<slot>` 元素来实现这种组合。插槽允许我们定义占位符，用户可以在其中以非常简单的方式添加自定义标记。\n\n通过本章学到的功能，你将能够为你的\
  \ Web 组件构建灵活、高效且可维护的 UI，几乎无需编写任何 JavaScript 代码。\n\n在下一章中，我们将讨论如何打包我们构建的 Web 组件，以便其他开发者轻松导入和使用。你将学习实现这一目标的不同方法及其优缺点。\n\
  \n## 问题\n\n1.  在 HTML 页面的标记中，可以在哪里添加 `<template>` 元素？\n\n2.  能否在模板的标记中包含像 `<li>`\
  \ 这样的元素，而不包含其父元素 `<ol>` 或 `<ul>`？\n\n3.  使用模板与使用字符串定义 UI 标记有什么区别？\n\n4.  模板生成的 DOM\
  \ 是“惰性的”是什么意思？\n\n5.  如何激活模板？\n\n6.  为什么使用模板比通过 DOM API 构建 UI 更高效？\n\n7.  什么是插槽？\n\
  \n8.  命名插槽与未命名插槽有什么区别？\n\n9.  一个模板中可以插入多少个未命名插槽？\n\n10. 什么是默认插槽？\n\n# 第 8 章\n##\
  \ 分发与扩展 Web 组件\n\n在前几章中，我们学习了如何构建 Web 组件，并发现了在不同开发场景中更适用的方法。然而，我们构建的组件旨在用于一个或多个\
  \ Web 应用或网站，由我们自己或其他开发者使用。这促使我们思考如何提供我们的组件，使其能够轻松添加到其他项目中。\n\n为了满足这一需求，本章我们将探讨几种共享组件的方式，以便开发者能够将它们包含在自己的项目中。我们将讨论基于脚本的策略和基于包的策略。和往常一样，我们将以前几章开发的\
  \ cookie 提醒组件作为示例组件，用这两种策略进行共享。\n\n此外，我们还将介绍如何通过扩展现有组件来创建新的 Web 组件。这种方法允许我们利用 Web\
  \ 组件技术的力量，获得现有组件的个性化版本，类似于我们对原生 HTML 元素所做的操作。\n\n## 结构\n\n*   分发策略\n\n*   扩展组件\n\
  \n## 目标\n\n本章将向你解释如何创建包含 Web 组件定义的模块，以及如何使用这些模块来分发你的组件。你将学习如何将它们作为脚本和包进行分发。你还将学习如何利用继承，使用现有组件创建新组件。\n\
  \n## 分发策略\n\n在整本书中，我们使用 Web Components Builder 项目来测试我们正在构建的 Web 组件。该项目只是一个开发环境，在我们编写组件并希望在\
  \ HTML 页面中查看以进行评估和测试时非常有用。\n\n一旦你对组件感到满意，就可以将其用于你的 Web 应用或分发给其他开发者。如何让你全新的 Web 组件可供其他项目和开发者使用呢？\n\
  \n在本节中，我们将讨论可用于分发 Web 组件的各种策略，并针对每种策略分析其优缺点。当然，我们仍将使用 cookie 提醒组件作为要分发的组件。\n\n###\
  \ 基于脚本的策略\n\n我们可以用来分发 cookie 提醒组件的第一个策略是将其作为脚本提供。这意味着你需要提供一个包含实现该组件的相关 JavaScript\
  \ 代码的文件，以便潜在用户可以通过 `<script>` 标签将其包含到他们的项目中。\n\n让我们看看使用此策略分发组件的选项，并讨论这种方法的优缺点。\n\
  \n### 无需构建步骤\n\n将 Web 组件作为脚本分发的最简单方法是提供源代码，无需任何构建步骤。要将此方法应用于我们的 cookie 提醒组件，你只需分发\
  \ Web Components Builder 项目中 `src` 文件夹下的 `index.js` 文件。也许为了更容易识别，你可以将 `index.js`\
  \ 文件重命名为 `cookie-alert.js`。这样，你可以通过允许用户下载或通过 CDN 提供来分发它。\n\n**内容分发网络（CDN）是一个分布式服务器网络，提供图像、脚本、文本或其他静态资源等内容。CDN\
  \ 的主要目标是减轻网站和应用服务器的负载，并尽可能最大化共享资源的缓存。**\n\n一旦用户获取了脚本或托管在 CDN 上的脚本 URL，他们只需将该脚本包含到他们的\
  \ HTML 页面中。例如，以下 HTML 描述了一个包含 `cookie-alert.js` 脚本并在其 body 中使用 Web 组件的页面：\n\n```\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Using the Alert Cookie component</title>\n\
  <script src=\"./alert-cookie.js\"></script>\n</head>\n<body>\n<h1>Using the Alert\
  \ Cookie component</h1>\n<cookie-alert message=\"We use cookies, but respect your\
  \ privacy!\">\n</cookie-alert>\n</body>\n</html>\n```\n\n正如预期的那样，通过这种方法，你可以在 HTML\
  \ 标记中使用 `<cookie-alert>` 标签。\n\n### 需要构建步骤\n\n\n\n\n\nWeb 组件构建项目允许您为生产环境构建组件，即准备分发给用户。与上一节描述的源代码分发方式相比，构建步骤为您的脚本带来了一些优势。\n\
  \n它将您的代码转译为广泛支持的 ECMAScript 版本，通常是 ECMAScript 5。您可能会疑惑，既然用户应该拥有支持 Web 组件技术的最新浏览器，为什么还要将现代\
  \ JavaScript 代码翻译成旧版本？实际上，如果您将构建过程中的转译步骤与 polyfill 结合使用（如第 1 章所述），这可能会很有用。这样，您就可以让旧版浏览器的用户也能使用您的\
  \ Web 组件。\n\n此外，构建步骤会优化组件的代码，以减小最终打包文件的大小。这减少了组件的传输和加载时间。\n\n您可以通过在 Web 组件构建器项目的根目录下运行以下命令来获取\
  \ cookie 提醒组件的构建版本：\n\n`npm run build`\n\n几秒钟后，您会在项目的 `dist` 文件夹中找到 `bundle.js`\
  \ 文件。与没有构建步骤的分发方式一样，您可以将此文件重命名为 `cookie-alert.js`，并通过下载或 CDN 提供给用户。\n\n您的用户将能够像我们在前面案例中描述的那样使用您的组件。\n\
  \n### 实现模块\n\n上述分发方式乍看之下似乎完美无缺。然而，它们存在一些缺点。\n\n让我们考虑没有构建步骤的分发策略。假设您想通过 JavaScript\
  \ 创建一个 cookie 提醒组件的实例。您应该能够像以下示例一样使用 `CookieAlert` 类：\n\n`var myCookieAlert = new\
  \ CookieAlert();`\n\n实际上，它按预期工作。但是，您也可以访问定义 cookie 提醒组件所用原生模板的 `template` 常量。您只需编写以下代码即可尝试：\n\
  \n`console.log(template);`\n\n在这种情况下，您将在控制台窗口中看到一个对象，而不是 null 值。\n\n此外，您还可以访问 `cookie-alert.js`\
  \ 脚本中定义的 `getCookie()` 和 `setCookie()` 函数。这是因为所有这些元素在脚本文件中都被定义为全局元素。\n\n您可能认为这不是一个大问题。毕竟，组件按预期工作。实际上，这是一个严重的问题。试想，如果一个不了解组件实现细节的用户定义了一个全局的\
  \ `template` 变量，会发生什么？可以说，他们定义 `template` 变量的尝试会失败，因为已经存在同名的常量。因此，由于包含了我们的 cookie\
  \ 提醒脚本，用户的代码将会出错。另外，假设用户定义了自己的 `getCookie()` 函数，可能具有不同的签名或行为。在这种情况下，由于用户函数重新定义的干扰，我们的组件将无法按预期工作。\n\
  \n如果您还记得第 6 章中关于 Shadow DOM 的讨论，这里我们在代码层面遇到了类似的问题。我们组件的代码影响用户的代码，用户的代码也影响组件的代码。我们上面关于用户了解我们组件实现细节的前提非常重要。不是因为用户应该知道我们的组件内部如何工作，而是因为他们不需要知道。我们的代码不应影响用户的代码，用户的代码也不应影响我们的组件。用户影响组件代码的唯一方式是通过其公共接口，即为此目标明确设计的属性、特性、事件、方法等集合。\n\
  \n换句话说，我们需要将组件的代码封装到一个模块中。\n\n在我们探讨如何将脚本转换为模块之前，先来看看带有构建步骤的分发策略的缺点。在这种情况下，我们无法访问\
  \ `template` 常量以及 `getCookie()` 和 `setCookie()` 函数。从封装的角度来看，这很好。不幸的是，我们也无法访问 `CookieAlert`\
  \ 类，因此无法通过 JavaScript 创建组件的实例。在这种情况下，我们遇到了与没有构建步骤的分发策略相反的问题：脚本没有向公共访问暴露任何内容。\n\n\
  这种行为取决于 Webpack 打包工具。它会自动将脚本解释为模块。这样，未显式导出的内容在模块外部不可访问。另一方面，从标准 ECMAScript 的角度来看，模块是至少包含一个\
  \ `export` 或 `import` 语句的脚本。因此，没有任何此类语句的脚本会在全局上下文中声明元素。\n\n总之，在没有构建步骤的分发方式中，所有组件代码都是全局的。在这种情况下，它可能会与用户代码产生干扰。在带有构建步骤的方式中，所有组件代码都是私有的，因此用户无法通过\
  \ JavaScript 利用我们的组件。\n\n让我们看看如何通过将组件实现为标准 ECMAScript 模块来解决这两个问题。我们只需对包含组件定义的脚本进行一项更改：在类定义前加上\
  \ `export default` 语句。cookie 提醒组件的脚本文件内容如下所示：\n\n```\nconst template = document.createElement('template');\n\
  template.innerHTML = '…';\nexport default class CookieAlert extends HTMLElement\
  \ {\n  // …\n}\ncustomElements.define(\"cookie-alert\", CookieAlert);\nfunction\
  \ getCookie(cookieName) {\n  // …\n}\nfunction setCookie(cookieName, cookieValue,\
  \ expirationDays) {\n  // …\n}\n```\n\n我们将 `CookieAlert` 类定义为当前模块的默认导出项。\n\n然而，如果我们尝试像之前一样使用\
  \ `<script>` 标签包含这个新版本的组件脚本，将会出现关于 `export` 语句的错误。实际上，`<script>` 标签默认不支持模块。为了在 HTML\
  \ 页面中启用模块包含，您需要通过 `type` 属性指定。因此，导入模块化版本的 cookie 提醒组件的正确方式如下所示：\n\n`<script type=\"\
  module\" src=\"./cookie-alert.js\"></script>`\n\n从现在开始，您可以通过导入 `CookieAlert` 类并创建实例来在任何\
  \ JavaScript 模块中使用它，如下例所示：\n\n`import CookieAlert from './cookie-alert.js'`\n\n\
  `var myCookieAlert = new CookieAlert();`\n\n请记住，您只能从另一个模块内部导入模块导出的项。如果您的代码位于没有 `type=\"\
  module\"` 属性的 `<script>` 标签中，尝试从模块导入项将会抛出错误。\n\n### 基于包的策略\n\n基于脚本的策略对于以 HTML 为中心的应用程序或网站来说是一种好方法。然而，现代\
  \ Web 应用程序开发采用 JavaScript 优先的方法。考虑单页应用（SPA）架构：它使用一个 HTML 页面，其内容由 JavaScript 代码在运行时生成。这是大多数\
  \ JavaScript 框架和库（如 React、Angular、Vue 等）支持的方法，但也适用于原生 JavaScript。使用这种方法，HTML 页面只是将应用程序\
  \ JavaScript 代码附加到浏览器的锚点。应用程序本身的大部分逻辑、UI 和基础设施都由 JavaScript 代码提供。\n\n\n\n\n在此上下文中，构建工具链至关重要，而且在绝大多数情况下，开发环境都基于\
  \ Node.js 运行时。如你所知，在这种环境中，添加外部组件或库的常用方法是使用包管理器（如 `npm` 或 `yarn`）安装包。那么，假设我们想以包的形式向用户提供\
  \ cookie 提醒组件。我们该如何实现呢？让我们一起来探索。\n\n#### 利用 GitHub 仓库\n\n将你的组件打包并分发给其他开发者的最简单方法是通过\
  \ GitHub 仓库共享。这种方法不仅可以让你共享项目的源代码，还能让其他开发者使用 `npm` 将你的组件安装到他们的项目中。让我们看看它是如何工作的。\n\
  \n准备好要发布到 GitHub 仓库的代码后，请确保你的 `package.json` 文件配置正确。以下是我们 cookie 提醒组件的 `package.json`\
  \ 文件示例：\n\n```\n{\n  \"name\": \"cookie-alert-demo\",\n  \"version\": \"1.0.0\"\
  ,\n  \"description\": \"一个 Web 组件，用于显示关于 cookie 政策的提示信息。\",\n  \"main\": \"src/index.js\"\
  ,\n  \"scripts\": {\n    \"start\": \"webpack-dev-server --config ./webpack.config.js\
  \ --mode development\",\n    \"build\": \" node node_modules/.bin/webpack --mode\
  \ production\",\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 0\"\
  \n  },\n  \"keywords\": [],\n  \"author\": \"Andrea Chiarelli (https://www.andreachiarelli.it)\"\
  ,\n  \"license\": \"MIT\",\n  \"devDependencies\": {\n    \"webpack\": \"⁴.41.2\"\
  ,\n    \"webpack-cli\": \"³.3.9\",\n    \"webpack-dev-server\": \"³.8.2\",\n   \
  \ \"copy-webpack-plugin\": \"⁵.0.4\"\n  },\n  \"dependencies\": {\n    \"@webcomponents/webcomponentsjs\"\
  : \"².3.0\"\n  }\n}\n```\n\n让我们强调一下最重要的部分。为你的包取一个有意义的名称和描述。同时，分配一个版本号，并在未来对代码进行更改时保持更新。\n\
  \n`package.json` 文件中的 `name` 和 `version` 是发布包所必需的字段。\n\n名称需要遵循一些规则：\n\n- 必须唯一\n\
  - 最大长度为 214 个字符\n- 不能以点号或下划线开头\n- 不能包含大写字母\n\n然后，设置 `main` 属性，指向项目的入口文件。如果你的项目只有一个文件，则设置其路径。在示例中，我们指定了\
  \ `src` 文件夹下 `index.js` 文件的路径。其他设置则是开发所需。\n\n通过这些简单的调整，我们的用户只需输入 `npm install` 命令即可将我们的组件作为包安装。例如，要从发布在\
  \ `https://github.com/andychiare/cookie-alert-demo` 的 GitHub 仓库安装我们的 cookie 提醒组件，用户需要输入：\n\
  \n`npm install andychiare/cookie-alert-demo`\n\n你可能已经注意到，用户只需指定 GitHub 组织和仓库名称即可。\n\
  \n一旦代码安装到 `node_modules` 文件夹中，用户就可以像使用标准包一样导入该组件。例如，该组件可以动态附加到 HTML 页面的 body 中，如下所示：\n\
  \n```\nimport CookieAlert from 'cookie-alert-demo';\nconst cookieAlert = new CookieAlert();\n\
  document.body.appendChild(cookieAlert);\n```\n\n#### 发布到公共 npm 注册表\n\n如果你想将组件发布到官方的\
  \ `npm registry`，你需要拥有一个账户，并在发布前登录到注册表。登录命令如下：\n\n`npm login`\n\n系统会要求你提供用户名、密码和电子邮件。登录后，你可以通过从组件项目的根目录输入以下命令来发布包：\n\
  \n`npm publish`\n\n此命令会将包含你组件的包发布到 npm `registry`。发布后，你可以通过其公共 URL（格式为 `https://www.npmjs.com/package/<package-name>`，其中\
  \ `<package-name>` 是你的包名）来验证你的包。\n\n在这种情况下，你的组件的用户可以通过输入以下命令轻松安装此包：\n\n`npm install\
  \ package-name`\n\n当然，组件在目标项目中的使用方式与我们在 GitHub 仓库案例中看到的相同。\n\n## 扩展 Web 组件\n\n到目前为止，我们已经了解了如何创建\
  \ Web 组件、如何使其可供其他开发者使用，以及如何在 HTML 标记或 JavaScript 应用程序中使用它。\n\n如你所见，使用 Web 组件非常简单：你可以像处理原生\
  \ HTML 元素一样处理它。这个非常简单的概念有一些非常有趣的启示。事实上，就像你可以对任何原生 HTML 元素进行操作一样，你可以通过扩展现有的 Web 组件来创建自己的\
  \ Web 组件。让我们看看它是如何工作的。\n\n### 定义扩展的 Web 组件\n\n考虑我们目前实现的 cookie 提醒组件。我们想创建该组件的一个变体，它有一个属性和一个属性，允许我们显示或隐藏“关闭”按钮。\n\
  \n我们可以通过克隆并初始化 Web 组件构建器项目来创建一个新项目。然后，通过运行以下命令将 `cookie-alert-demo` Web 组件添加到项目中：\n\
  \n`npm install andychiare/cookie-alert-demo`\n\n最后，我们按如下方式实现这个新组件：\n\n```\nimport\
  \ CookieAlert from 'cookie-alert-demo';\n\nclass MyCookieAlert extends CookieAlert\
  \ {\n  constructor() {\n    super();\n    this._hasCloseButton = false;\n  }\n\n\
  \  get hasCloseButton() {\n    return this._hasCloseButton;\n  }\n\n  set hasCloseButton(value)\
  \ {\n    this._hasCloseButton = value;\n    this.setAttribute(\"closebutton\", value);\n\
  \    this.toggleCloseButton(value);\n  }\n\n  toggleCloseButton(visible) {\n   \
  \ const closeButton = super.shadowRoot.getElementById(\"closeButton\");\n    closeButton.style.display\
  \ = (visible? \"block\": \"none\");\n  }\n\n  static get observedAttributes() {\n\
  \    return [\"closebutton\"];\n  }\n\n  attributeChangedCallback(name, oldValue,\
  \ newValue) {\n    if (oldValue !== newValue) {\n      if (name == \"closebutton\"\
  ) {\n        let isVisible = (newValue === \"true\" || newValue === \"\");\n   \
  \     this._hasCloseButton = isVisible;\n        this.toggleCloseButton(isVisible);\n\
  \      }\n    }\n  }\n\n  connectedCallback() {\n    super.connectedCallback();\n\
  \    this.toggleCloseButton(this._hasCloseButton);\n  }\n}\n\ncustomElements.define(\"\
  my-cookie-alert\", MyCookieAlert);\n```\n\n让我们分析这段代码的每个部分。第一行从 `cookie-alert-demo`\
  \ 模块导入 `CookieAlert` 类。`MyCookieAlert` 类定义继承自 `CookieAlert` 类。这是关键点：我们没有像通常那样继承自\
  \ `HTMLElement` 类，而是从 cookie 提醒组件开始构建一个新的 Web 组件。其余代码现在应该很容易理解了。\n\n`MyCookieAlert`\
  \ 类的构造函数调用 `super()` 并将内部属性 `_hasCloseButton` 初始化为 `false`：\n\n```\nconstructor()\
  \ {\n  super();\n  this._hasCloseButton = false;\n}\n```\n\n这意味着这个 cookie 提醒组件的变体默认不应显示“关闭”按钮。然后，我们定义了\
  \ `hasCloseButton` 属性的 getter 和 setter：\n\n```\nget hasCloseButton() {\n  return\
  \ this._hasCloseButton;\n}\n\nset hasCloseButton(value) {\n  this._hasCloseButton\
  \ = value;\n  this.setAttribute(\"closebutton\", value);\n  this.toggleCloseButton(value);\n\
  }\n```\n\nsetter 调用 `toggleCloseButton()` 方法来更改按钮的可见性。该方法与基础组件的 shadow DOM 交互以管理按钮的可见性：\n\
  \n```\ntoggleCloseButton(visible) {\n  const closeButton = super.shadowRoot.getElementById(\"\
  closeButton\");\n  closeButton.style.display = (visible? \"block\": \"none\");\n\
  }\n```\n\n\n\n\n如你所见，关闭按钮的可见性会根据作为参数传入的布尔值而变化。注意使用 `super` 来访问基类的 Shadow DOM。当然，这是可行的，因为\
  \ cookie 提示的 Shadow DOM 被定义为 open。\n\n然后，我们观察 `closebutton` 属性并管理其值的变化：\n\n```\n\
  static get observedAttributes() {\n    return [\"closebutton\"];\n}\n\nattributeChangedCallback(name,\
  \ oldValue, newValue) {\n    if (oldValue !== newValue) {\n        if (name == \"\
  closebutton\") {\n            let isVisible = (newValue === \"true\" || newValue\
  \ === \"\");\n            this._hasCloseButton = isVisible;\n            this.toggleCloseButton(isVisible);\n\
  \        }\n    }\n}\n```\n\n注意我们如何处理 `closebutton` 属性的值。它应该是一个布尔值。但我们知道属性值总是字符串。因此我们需要将其值与字符串\
  \ `\"true\"` 进行比较。任何不同的值都被解释为 false。此外，我们希望属性没有值等同于 true 值。稍后当我们看到如何使用这个新组件时，会澄清这一点。\n\
  \n`connectedCallback()` 反应调用其基类的相同方法，并根据内部属性 `_hasCloseButton` 的值设置按钮的可见性：\n\n```\n\
  connectedCallback() {\n    super.connectedCallback();\n    this.toggleCloseButton(this._hasCloseButton);\n\
  }\n```\n\n调用 `super.connectedCallback()` 方法是必要的，因为它初始化了基础组件。如果不调用它，就会覆盖初始化，从而无法获得基础组件的\
  \ UI，或者获得的 UI 不完整。\n\n最后一步当然是注册 `MyCookieAlert` Web 组件：\n\n```\ncustomElements.define(\"\
  my-cookie-alert\", MyCookieAlert);\n```\n\n如你所见，我们定义了 `my-cookie-alert` 标签并将其绑定到\
  \ `MyCookieAlert` 类。现在我们已经准备好使用这个新的 Web 组件了。\n\n### 使用扩展的 Web 组件\n\n以下标记展示了 `my-cookie-alert`\
  \ 标签最基本的用法：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Web Components with\
  \ Webpack Starter Kit</title>\n<script src=\"./wc-polyfills/webcomponents-loader.js\"\
  ></script>\n<script src=\"./bundle.js\"></script>\n</head>\n<body class=\"container\"\
  >\n<h1>Here is your Web Component</h1>\n<my-cookie-alert></my-cookie-alert>\n</body>\n\
  </html>\n```\n\n由于 `closeButton` 属性的默认值为 false，我们将得到不带“关闭”按钮的 cookie 提示组件版本，如下面的截图所示：\n\
  \n![](img/Figure_8.1.jpg)\n\n**图 8.1**\n\n如果你希望显示“关闭”按钮，只需添加值为 true 的 `closebutton`\
  \ 属性，如下例所示：\n\n```\n<my-cookie-alert closebutton=\"true\"></my-cookie-alert>\n```\n\
  \n这样，你将得到迄今为止所熟悉的常规 cookie 提示。\n\n![](img/Figure_8.2.jpg)\n\n**图 8.2**\n\n在管理 `closebutton`\
  \ 属性的值时，我们曾指出空字符串值与 true 值具有相同的含义。这允许我们将该属性用作开关属性，就像许多原生属性（例如 `enabled` 或 `checked`）一样。因此，你可以通过以下方式获得与将\
  \ true 值赋给 `closebutton` 属性相同的结果：\n\n```\n<my-cookie-alert closebutton></my-cookie-alert>\n\
  ```\n\n为了完整概述此组件，请记住以下标记与不使用 `closebutton` 属性具有相同的含义：\n\n```\n<my-cookie-alert closebutton=\"\
  false\"></my-cookie-alert>\n```\n\n像往常一样，你可以通过 JavaScript 使用 `hasCloseButton` 属性获得与之前相同的结果。例如，以下代码强制显示关闭按钮：\n\
  \n```\nconst myCookieAlert = document.querySelector(\"my-cookie-alert\");\nmyCookieAlert.hasCloseButton\
  \ = true;\n```\n\n## 结论\n\n本章向你展示了如何准备你的 Web 组件以便与其他开发者共享。我们探讨了如何创建包含代码的模块，以及如何通过基于脚本和基于包的方法分发它们。\n\
  \n这些方法可以用于不同的开发环境。但无论采用哪种具体方法来分发你的组件，用户都可以基于你的组件创建新组件。事实上，他们可以扩展定义你组件的类来创建其个性化版本。\n\
  \n通过本章学到的知识，你现在能够分发你的 Web 组件，并通过扩展现有组件来创建新组件。\n\n在下一章中，我们将讨论如何在用知名 JavaScript 库和框架（如\
  \ React、Angular 和 Vue）构建的应用程序中使用 Web 组件。\n\n## 问题\n\n1.  将 Web 组件作为传统脚本分发的主要缺点是什么？\n\
  2.  在分发组件之前对代码应用构建步骤的主要好处是什么？\n3.  如何克服将 Web 组件作为传统脚本分发的缺点？\n4.  如何将 Web 组件的代码转换为模块？\n\
  5.  如何使用 `<script>` 标签导入模块？\n6.  为什么需要包来分发你的 Web 组件？\n7.  发布 `npm` 包所需的最少 `package.json`\
  \ 字段有哪些？\n8.  如何将你的 GitHub 仓库作为 `npm` 包共享？\n9.  如何从 GitHub 仓库安装 `npm` 包？\n10. 如何将你的\
  \ `npm` 包发布到公共 npm 注册表？\n11. 如何扩展现有的 Web 组件？\n\n# 第 9 章\n\n## Web 组件与其他 UI 框架\n\n\
  在本书中，你已经了解到 Web 组件背后的技术允许你自定义标准 HTML 元素并创建自定义 HTML 元素。当我们在*第 1 章“Web 组件入门”*中介绍它们时，我们说过\
  \ Web 组件的主要优势之一是它们的互操作性。即无论你使用什么库或框架来构建 UI，它们都能在 HTML 页面或 Web 应用程序中工作。这是一个巨大的优势，允许你创建通用的\
  \ UI 组件，并以与使用 HTML 元素相同的方式使用它们。\n\n在本章中，我们将展示几个实际示例，说明 Web 组件与 UI 框架之间的互操作性是如何实现的。我们将看到如何以极少的努力将它们集成到\
  \ *React、Angular* 和 Vue 应用程序中。我们还将探讨一些关于如何通过 *Angular、Vue* 和 *React* 编写 Web 组件的方向。\n\
  \n## 结构\n\n*   Web 组件集成\n*   Web 组件与 React\n*   Web 组件与 Angular\n*   Web 组件与 Vue\n\
  *   使用 UI 框架构建 Web 组件\n\n## 目标\n\n本章的目标是演示如何将 Web 组件集成到使用 JavaScript UI 框架构建的网站和应用程序中。\n\
  \n你将学习如何在用 *React、Angular* 和 *Vue* 创建的应用程序中使用你的组件。你还将发现如何将这些框架构建的组件包装到自定义元素中。\n\n\
  ## Web 组件集成\n\n你用 Web 组件技术构建的 HTML 元素作为标准 HTML 元素工作。这意味着无论你在哪里可以使用 HTML 元素，你都可以使用\
  \ Web 组件。这种可能性带来一个很棒的特性——无论你为 Web 应用程序或网站使用什么库，你都可以在任何地方使用你的 Web 组件。互操作性是 Web 组件令人惊叹的主要优势。\n\
  \n\n\n\n与使用 *React、Angular、Vue* 等框架创建的组件不同，Web 组件并不绑定于特定的库或框架。例如，如果你用 React 创建了一个\
  \ UI 组件，那么该组件只能在基于 React 的应用中使用。而 Web 组件可以轻松集成到几乎任何 UI 库构建的应用中。这让你无需为不同的组件库重复实现相同的组件，我们稍后会看到这一点。\n\
  \n**库和框架是不同的概念。库是一组专注于特定编程功能的函数，应用可以调用它们。框架则是一组支持应用开发不同方面的函数。尽管存在这些差异，我们在此将互换地讨论库和框架。**\n\
  \n在深入 Web 组件集成的细节之前，请记住：Web 组件并不是另一个 UI 框架——它们是原生的 UI 框架。Web 组件并非现有 UI 框架的替代品——它们可以共存。你无需切换到\
  \ Web 组件并放弃你的 UI 框架。你可以根据需要将它们引入你的应用。Web 组件与框架无关——它们可以集成到任何框架中。一次编写，随处使用。\n\n为了实际演示如何在基于\
  \ UI JavaScript 框架构建的应用中使用 Web 组件，我们将把前几章创建的 cookie 提醒组件集成到基于 *React、Angular* 和\
  \ *Vue* 的应用中。\n\n**在接下来的章节中，我们假设你熟悉 React、Angular 或 Vue。如果不熟悉，请参考官方文档以获取有关这些框架的更多信息。**\n\
  \n### Web 组件与 React\n\n让我们开始看看如何在简单的 React 应用中使用我们的 cookie 演示组件。我们将使用 `create-react-app`\
  \ 工具创建一个基础应用。因此，在终端窗口中输入以下命令：\n\n`npx create-react-app react-app-cookie-alert`\n\
  \n该命令将在 `react-app-cookie-alert` 文件夹中创建一个简单但可运行的 React 应用。几秒钟后，应用即可运行。为了让我们的 cookie\
  \ 提醒组件对应用可用，你需要安装它。因此，切换到 `react-app-cookie-alert` 文件夹并输入以下命令：\n\n`npm install andychiare/cookie-alert-demo`\n\
  \n如前一章所述，这会直接从组件的 GitHub 仓库安装 `cookie-alert-demo` 包。现在，要在 React 应用中导入并使用该组件，请编辑\
  \ `src/App.js` 文件并将其内容修改如下：\n\n```\nimport React from 'react';\nimport logo from\
  \ './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\nfunction App()\
  \ {\n  return (\n    <div className=\"App\">\n      <header className=\"App-header\"\
  >\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n        <p>\n\
  \          Edit <code>src/App.js</code> and save to reload.\n        </p>\n    \
  \    <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
  \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n        >\n\
  \          Learn React\n        </a>\n      </header>\n      <cookie-alert></cookie-alert>\n\
  \    </div>\n  );\n}\n\nexport default App;\n```\n\n上面高亮显示了添加到现有代码中的新代码。你导入了 cookie\
  \ 提醒模块，并在 `App` 组件返回的 JSX 代码中添加了 `<cookie-alert>` 标签。仅此而已！\n\n你就像使用任何标准 HTML 组件一样使用\
  \ Web 组件。要查看生成的 UI，请运行 `npm start` 命令，并将浏览器指向 `http://localhost:3000` 地址。你将看到如下页面：\n\
  \n![](img/Figure_9.1.jpg)\n\n**图 9.1**\n\n如你所见，cookie 提醒出现在页面底部，与标准 HTML 页面中的情况相同，并且按预期工作。\n\
  \n当然，你可能希望在 React 应用中自定义 cookie 提醒。例如，你可能想更改默认消息。你可以通过将新的 `message` 字符串赋值给组件的 `message`\
  \ 属性来实现，就像在任何 HTML 页面中一样。但是，你的消息可能是在运行时创建的，你可能想知道如何将此值赋给属性。以下代码展示了如何将常量值赋给 `message`\
  \ 属性：\n\n```\nimport React from 'react';\nimport logo from './logo.svg';\nimport\
  \ './App.css';\nimport 'cookie-alert-demo';\n\nfunction App() {\n  const message\
  \ = \"We use cookies, but respect your privacy!\";\n  return (\n    <div className=\"\
  App\">\n      <header className=\"App-header\">\n        <img src={logo} className=\"\
  App-logo\" alt=\"logo\" />\n        <p>\n          Edit <code>src/App.js</code>\
  \ and save to reload.\n        </p>\n        <a\n          className=\"App-link\"\
  \n          href=\"https://reactjs.org\"\n          target=\"_blank\"\n        \
  \  rel=\"noopener noreferrer\"\n        >\n          Learn React\n        </a>\n\
  \      </header>\n      <cookie-alert message={message}></cookie-alert>\n    </div>\n\
  \  );\n}\n\nexport default App;\n```\n\n你将包含 `message` 常量的表达式赋值给了同名的属性，就像在 React\
  \ 中赋值任何 `prop` 一样。当然，你可以将任何返回字符串的有效表达式赋值给 cookie 提醒组件的 `message` 属性。\n\n如果你想通过 JavaScript\
  \ 访问 `message` 属性来自定义 cookie 提醒组件，则需要编写更多代码。你需要使用 `refs` 来访问该组件。\n\n**在 React 中，refs\
  \ 提供了一种机制来访问由组件的 `render()` 方法生成的 DOM 节点或 React 元素。它们代表了一种在特定情况下（比如我们正在讨论的情况）使用的变通方法。**\n\
  \n查看以下代码，了解如何通过 `ref` 访问 `message` 属性：\n\n```\nimport React, {useRef, useEffect}\
  \ from 'react';\nimport logo from './logo.svg';\nimport './App.css';\nimport 'cookie-alert-demo';\n\
  \nfunction App() {\n  const cookieAlert = useRef(null);\n  useEffect(() => {\n \
  \   cookieAlert.current.message = \"We use cookies, but respect your privacy!\"\
  ;\n  });\n  return (\n    <div className=\"App\">\n      <header className=\"App-header\"\
  >\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n        <p>\n\
  \          Edit <code>src/App.js</code> and save to reload.\n        </p>\n    \
  \    <a\n          className=\"App-link\"\n          href=\"https://reactjs.org\"\
  \n          target=\"_blank\"\n          rel=\"noopener noreferrer\"\n        >\n\
  \          Learn React\n        </a>\n      </header>\n      <cookie-alert ref={cookieAlert}></cookie-alert>\n\
  \    </div>\n  );\n}\n\nexport default App;\n```\n\n你导入了 `useRef()` 和 `useEffect()`\
  \ 钩子。然后，使用 `useRef()` 钩子创建了 `cookieAlert` ref，并在使用 `useEffect()` 钩子定义的效果中使用了这个 ref。在标记中，你注意到我们为\
  \ cookie 提醒组件添加了 `ref` 属性，并赋值为之前创建的 `cookieAlert` ref。\n\n最后，上面创建的效果通过 `cookieAlert`\
  \ ref 的 `current` 属性访问 cookie 提醒组件。此时，我们可以将要显示的字符串赋值给 `message` 属性。\n\n你可以采用相同的方法来处理\
  \ cookie 提醒组件生成的事件。以下代码展示了如何为 `accepted` 事件添加事件处理程序：\n\n```\nuseEffect(() => {\n\
  \  cookieAlert.current.message = \"We use cookies, but respect your privacy!\";\n\
  \  cookieAlert.current.addEventListener(\"accepted\", () => alert(\"Thanks for accepting\
  \ our cookie policy!\"));\n});\n```\n\n如你所见，你在之前创建的效果中添加了事件监听器。\n\n\n\n\n即使在 React\
  \ 应用中使用 Web Components 是可行的，你也不能期望它们遵循这个流行库的声明式编程模型。Web Components 使用典型的 DOM 编程方式，通常是命令式的。因此，在\
  \ React 应用中使用 Web Components 时，你不应期望它们像 React 组件那样工作。例如，Web Components 生成的事件可能无法在\
  \ React 组件结构中正确传播。此外，React 组件的典型响应性也无法得到保证。\n\n另外，React 会将标准 HTML 元素包装成一个组件，以便在其生态系统中获得集成行为。如果你想获得同样的效果，你应该自己用\
  \ React 组件包装你的 Web Component，我们稍后会看到这一点。\n\n### Web Components 与 Angular\n\n在 Angular\
  \ 应用中使用 Web Component 需要采用与我们为 React 介绍的类似方法。不过，这里有一些具体的步骤。那么，让我们通过构建一个 Angular\
  \ 示例应用并使用我们的 cookie 提醒组件来看看它是如何工作的。\n\n与 React 类似，在 Angular 中，我们也将使用一个工具来帮助我们快速搭建一个简单的应用。我们将使用\
  \ Angular CLI，所以请确保你已经安装了它，否则请使用以下命令安装：\n\n`npm install -g @angular/cli`\n\n安装好\
  \ CLI 后，运行以下命令创建一个最小的 Angular 应用：\n\n`ng new angular-app-cookie-alert --minimal\
  \ --routing=false --style=css`\n\n该命令会在 `angular-app-cookie-alert` 文件夹中创建一个非常简单的应用。尽管它很简单，但足以用于我们的演示。\n\
  \n切换到 `angular-app-cookie-alert` 文件夹，并输入以下命令来安装我们的 cookie 提醒组件：\n\n`npm install\
  \ andychiare/cookie-alert-demo`\n\n此时，你应该注意一个问题。我们的 cookie 提醒组件是用 JavaScript 编写的，而\
  \ Angular 应用的默认语言是 TypeScript。因此，为了避免错误，你需要在 `tsconfig.json` 配置文件中添加 `\"allowJs\"\
  ` 设置作为 TypeScript 编译器选项。你的 `tsconfig.json` 文件应该类似于以下内容：\n\n```\n{\n  \"compileOnSave\"\
  : false,\n  \"compilerOptions\": {\n    \"allowJs\": true,\n    \"baseUrl\": \"\
  ./\",\n    …其他选项…\n  },\n  \"angularCompilerOptions\": {\n    …其他选项…\n  }\n}\n```\n\
  \n在 Angular 应用中使用我们的 Web Component 之前，你还需要做另一个小调整。实际上，默认情况下，Angular 会尝试将任何非标准的 HTML\
  \ 元素解释为 Angular 组件。因此，当它遇到 `<cookie-alert>` 标签时，会抛出错误。为了避免这种情况，你需要启用自定义元素。\n\n为此，打开\
  \ `src/app/app.module.ts` 文件，并将其内容修改如下：\n\n```\nimport { BrowserModule } from '@angular/platform-browser';\n\
  import { NgModule, CUSTOM_ELEMENTS_SCHEMA } from '@angular/core';\nimport { AppComponent\
  \ } from './app.component';\n\n@NgModule({\n  declarations: [\n    AppComponent\n\
  \  ],\n  imports: [\n    BrowserModule\n  ],\n  schemas: [CUSTOM_ELEMENTS_SCHEMA],\n\
  \  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n\
  ```\n\n按照高亮的部分，你导入了 `CUSTOM_ELEMENTS_SCHEMA` 模块，并将其配置为应用的参考模式。\n\n现在，我们准备在这个应用中使用我们的\
  \ Web Component。\n\n让我们先看看如何在 `AppComponent` 组件的模板中使用 cookie 提醒组件。编辑 `src/app/app.component.ts`\
  \ 文件，将其内容修改如下：\n\n```\nimport { Component } from '@angular/core';\nimport 'cookie-alert-demo';\n\
  \n@Component({\n  selector: 'app-root',\n  template: `\n    <!--下面的内容只是一个占位符，可以替换。-->\n\
  \    <div style=\"text-align:center\" class=\"content\">\n      <h1>\n        欢迎来到\
  \ {{title}}！\n      </h1>\n      …\n    </div>\n    <h2>以下是一些帮助您入门的链接：</h2>\n  \
  \  <ul>\n      …\n    </ul>\n    <cookie-alert></cookie-alert>\n  `,\n  styles:\
  \ []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n}\n\
  ```\n\n在这个简单的第一步中，你导入了 `cookie-alert-demo` 模块，并在 Angular `Component` 的模板中使用了 `<cookie-alert>`\
  \ 标签。与 React 的情况一样，这里你也像使用标准 HTML 元素一样使用 cookie 提醒组件。\n\n要查看组件的实际效果，在终端窗口中运行 `ng\
  \ serve`，然后将浏览器指向 `http://localhost:4200` 地址。你应该会看到类似下面的页面：\n\n![](img/Figure_9.2.jpg)\n\
  \n**图 9.2**\n\n正如预期的那样，提醒出现在页面底部，并且正常工作。\n\n就像我们在 React 中所做的那样，让我们看看如何使用不同的方法自定义提醒消息。为\
  \ `message` 属性赋值是最简单的方法。以下代码展示了如何应用这种基本方法：\n\n```\nimport { Component } from '@angular/core';\n\
  import 'cookie-alert-demo';\n\n@Component({\n  selector: 'app-root',\n  template:\
  \ `\n    //…\n    <cookie-alert message=\"我们使用 cookie，但尊重您的隐私！\"></cookie-alert>\n\
  \  `,\n  styles: []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n\
  }\n```\n\n如你所见，没什么特别的。但是，如果你想将计算出的值作为提醒中显示的文本，该怎么办？考虑以下示例：\n\n```\nimport { Component\
  \ } from '@angular/core';\nimport 'cookie-alert-demo';\n\n@Component({\n  selector:\
  \ 'app-root',\n  template: `\n    //…\n    <cookie-alert [message]=\"cookieMessage\"\
  ></cookie-alert>\n  `,\n  styles: []\n})\nexport class AppComponent {\n  title =\
  \ 'angular-app-cookie-alert';\n  cookieMessage = '我们使用 cookie，但尊重您的隐私！';\n}\n```\n\
  \n在这里，你为 `AppComponent` 组件创建了一个 `cookieMessage` 属性，并为其分配了文本。然后，在模板的标记中，将这个 `cookieMessage`\
  \ 属性映射到 cookie 提醒组件的 `message` 属性。注意你是如何无缝地使用 Angular 绑定语法的。\n\n要处理 Web Component\
  \ 生成的事件，请看以下代码：\n\n```\nimport { Component } from '@angular/core';\nimport 'cookie-alert-demo';\n\
  \n@Component({\n  selector: 'app-root',\n  template: `\n    //…\n    <cookie-alert\n\
  \      [message]=\"cookieMessage\"\n      (accepted)=\"showThanks()\">\n    </cookie-alert>\n\
  \  `,\n  styles: []\n})\nexport class AppComponent {\n  title = 'angular-app-cookie-alert';\n\
  \  cookieMessage = '我们使用 cookie，但尊重您的隐私！';\n  showThanks() {\n    alert(\"感谢您接受我们的\
  \ cookie 政策！\");\n  }\n}\n```\n\n你为 `AppComponent` 组件定义了 `showThanks()` 方法，并将其分配给\
  \ `accepted` 事件。注意，即使在这种情况下，你也像往常一样使用了 Angular 绑定语法。\n\n请记住，如果你需要访问事件的详细信息，可以像普通的\
  \ Angular 方式一样，在 `showThanks()` 方法中使用 `$event` 对象。\n\n当使用旨在用于 Angular 表单的 Web Components\
  \ 时，你需要特别注意。例如，考虑这样一种情况：你有一个作为 Web Component 创建的自定义输入元素，并且你想在表单中使用它，如下例所示：\n\n```\n\
  <form [formGroup]=\"form\" (ngSubmit)=\"send()\">\n  <custom-input\n    type=\"\
  text\"\n    label=\"输入您的数据\">\n  </custom-input>\n  <input type=\"submit\" value=\"\
  提交\">\n</form>\n```\n\n在这个例子中，我们在 Angular 表单中使用了虚构的 `<custom-input>` Web Component。默认情况下，Angular\
  \ 会增强标准 HTML `input` 元素，使其能够与表单 API 交互。Angular 表单会在其子元素中寻找一个 `value accessor`，即一种允许你访问控件值的特性。`value\
  \ accessor` 是一个实现了 `ControlValueAccessor` 接口的指令，它允许原生 HTML 元素与 Angular 表单通信。因此，Angular\
  \ 通过附加这个 `value accessor` 来操作标准 HTML 元素。\n\n\n\n\n然而，Angular 对你的 Web 组件一无所知。因此，你需要自行向组件添加一个\
  \ `value accessor`。这基本上意味着要向组件添加 `ngDefaultControl` 指令，如下代码所示：\n\n```\n<form [formGroup]=\"\
  form\" (ngSubmit)=\"send()\">\n<custom-input\ntype=\"text\"\nlabel=\"Enter your\
  \ data\"\nngDefaultControl>\n</custom-input>\n<input type=\"submit\" value=\"Submit\"\
  >\n</form>\n```\n\n通过这一简单的修改，你的 Web 组件就能与 Angular 表单集成。\n\n### Web 组件与 Vue\n\n接下来，我们看看如何在\
  \ Vue 应用中使用 Web 组件，这里仍然使用 cookie 提醒组件，就像我们在 React 和 Angular 中展示的那样。\n\n同样，我们将使用一个工具来快速搭建\
  \ Vue 应用——Vue CLI。请确保已安装它，否则请通过以下命令安装：\n\n`npm install -g @vue/cli`\n\n要创建一个基础应用，在终端窗口中运行以下命令：\n\
  \n`vue create vue-app-cookie-alert --default`\n\n命令执行后，你会找到 `vue-app-cookie-alert`\
  \ 文件夹，其中包含 Vue 应用的代码。然后，像往常一样，通过输入以下命令安装 cookie 提醒包：\n\n`npm install andychiare/cookie-alert-demo`\n\
  \n与 Angular 的情况类似，Vue 会尝试将非标准元素视为 Vue 组件。当然，这会导致错误，因为编译器找不到实现 `<cookie-alert>` 标签的\
  \ Vue 组件。因此，你需要告诉 Vue 忽略 `<cookie-alert>` 元素。为此，打开 `src/main.js` 文件，并按以下代码片段更新其内容：\n\
  \n```\nimport Vue from 'vue'\nimport App from './App.vue'\nVue.config.productionTip\
  \ = false\nVue.config.ignoredElements=[\n'cookie-alert'\n]\nnew Vue({\nrender: h\
  \ => h(App),\n}).$mount('#app')\n```\n\n你将 `cookie-alert` 标签名称添加到了 Vue 配置的忽略元素列表中。\n\
  \n现在，打开 `src/App.vue` 组件，并按以下代码修改模板和脚本部分的内容：\n\n```\n<template>\n<div id=\"app\"\
  >\n<img alt=\"Vue logo\" src=\"./assets/logo.png\">\n<HelloWorld msg=\"Welcome to\
  \ Your Vue.js App\"/>\n<cookie-alert></cookie-alert>\n</div>\n</template>\n<script>\n\
  import HelloWorld from './components/HelloWorld.vue'\nimport 'cookie-alert-demo'\n\
  export default {\nname: 'App',\ncomponents: {\nHelloWorld\n}\n}\n</script>\n<style>\n\
  #app {\nfont-family: Avenir, Helvetica, Arial, sans-serif;\n-webkit-font-smoothing:\
  \ antialiased;\n-moz-osx-font-smoothing: grayscale;\ntext-align: center;\ncolor:\
  \ #2c3e50;\nmargin-top: 60px;\n}\n</style>\n```\n\n在脚本部分，你导入了 `cookie-alert-demo`\
  \ 模块。在模板部分，你直接使用了 `<cookie-alert>` 标签。\n\n要查看这些更改的效果，运行 `npm run serve` 命令，并在浏览器中访问\
  \ `http://localhost:8080` 地址。你将看到类似下图的页面：\n\n![](img/Figure_9.3.jpg)\n\n**图 9.3**\n\
  \n自定义 cookie 提醒组件与 Angular 中的操作一样简单。要分配不同的文本消息，你可以为组件的 `message` 属性设置所需的值，如下代码片段所示：\n\
  \n```\n<template>\n<div id=\"app\">\n<img alt=\"Vue logo\" src=\"./assets/logo.png\"\
  >\n<HelloWorld msg=\"Welcome to Your Vue.js App\"/>\n<cookie-alert message= \"We\
  \ use cookies, but respect your privacy!\"></cookie-alert>\n</div>\n</template>\n\
  //…\n```\n\n如果你想为 cookie 提醒组件的 `message` 属性赋值，可以像下面这个示例那样操作：\n\n```\n<template>\n\
  <div id=\"app\">\n<img alt=\"Vue logo\" src=\"./assets/logo.png\">\n<HelloWorld\
  \ msg=\"Welcome to Your Vue.js App\"/>\n<cookie-alert :message= \"cookieMessage\"\
  ></cookie-alert>\n</div>\n</template>\n<script>\nimport HelloWorld from './components/HelloWorld.vue'\n\
  import 'cookie-alert-demo'\nexport default {\nname: 'App',\ncomponents: {\nHelloWorld\n\
  },\ndata: function() {\nreturn {\ncookieMessage: 'We use cookies, but respect your\
  \ privacy!'\n}\n}\n}\n</script>\n//…\n```\n\n在这个示例中，你为 App 组件创建了一个 `cookieMessage`\
  \ 属性，并使用典型的 Vue 绑定语法将其赋值给 message 属性。\n\n类似地，要处理 cookie 提醒组件的 accepted 事件，请向 App\
  \ 组件添加一个 `showThanks()` 方法，并使用 @ 前缀将其赋值给 `accepted` 事件。以下代码展示了具体实现：\n\n```\n<template>\n\
  <div id=\"app\">\n<img alt=\"Vue logo\" src=\"./assets/logo.png\">\n<HelloWorld\
  \ msg=\"Welcome to Your Vue.js App\"/>\n<cookie-alert :message= \"cookieMessage\"\
  \ @accepted=\"showThanks\"></cookie-alert>\n</div>\n</template>\n<script>\nimport\
  \ HelloWorld from './components/HelloWorld.vue'\nimport 'cookie-alert-demo'\nexport\
  \ default {\nname: 'App',\ncomponents: {\nHelloWorld\n},\ndata: function() {\nreturn\
  \ {\ncookieMessage: 'We use cookies, but respect your privacy!'\n}\n},\nmethods:\
  \ {\nshowThanks: function() {\nalert(\"Thanks for accepting our cookie policy!\"\
  );\n}\n}\n}\n</script>\n//…\n```\n\n如你所见，在 Vue 中使用 Web 组件也非常直接。\n\n## 使用 UI 框架构建\
  \ Web 组件\n\n上一节指导你在使用三种流行 UI 框架（*React、Angular 和 Vue*）构建的应用中使用了 Web 组件。我们看到了将 Web\
  \ 组件与这些框架集成通常相当容易。但我们也注意到，根据具体框架的不同，你需要留意一些注意事项来解决某些问题。\n\n你可以通过应用通用策略更系统地处理这些问题。例如，你可以用\
  \ *React、Angular* 或 *Vue* 组件包装你的 Web 组件。这样，你将集成问题封装在框架组件定义中，从而提供更好的集成体验。但这并没有改变将\
  \ Web 组件与其他 UI 框架集成的总体方法。\n\n某些 UI 框架提供了一种使用其语法和语义来创建 Web 组件的方法，而不是直接使用 JavaScript\
  \ 和 DOM。你可能会问为什么。以下是两个可能的原因：\n\n*   **利用 UI 框架特性：** 如果你决定使用 UI 框架（比如 Angular）创建\
  \ Web 组件，你可以利用你的 Angular 知识以及框架提供的特性。这可能会简化开发，并在一定程度上避免你了解实现 Web 组件的细节。\n\n*   **分发基于框架的组件：**\
  \ 假设你有一个 Vue 组件，并希望将其提供给其他非 Vue 应用使用。你可以通过 Vue 创建你的 Web 组件并进行分发。这相当于将你的 Vue 组件包装在\
  \ Web 组件中。\n\n以上可能是使用最流行的 UI 框架之一来创建 Web 组件的两个原因。然而，你至少应该注意以下注意事项：\n\n*   **增加复杂性：**\
  \ 在 Web 组件技术之上应用一层抽象会增加复杂性。你可能会因为不同的管理方式而遇到问题。而且，由于这一额外层，你可能会遇到性能问题。\n\n*   **增加依赖：**\
  \ 你用来实现 Web 组件的 UI 框架会成为依赖项，即使它可能只包含框架本身的一个子集。想象一下，如果一个应用有多个使用不同库构建的 Web 组件，会发生什么。\n\
  \n因此，即使可以创建 Web 组件或包装现有的基于框架的组件，也要问问自己，这对你的目标来说是否是一个好的选择。\n\n\n\n\n\n在接下来的章节中，我们将快速了解如何使用\
  \ `React`、`Angular` 和 `Vue` 创建 Web 组件。我们提供的示例非常简单，并非详尽无遗，但足以让你了解使用这些框架构建 Web 组件的基本思路。\n\
  \n### 使用 React 构建 Web 组件\n\n使用 React 创建 Web 组件，只需将 React 组件封装在一个继承自 `HTMLElement`\
  \ 的标准类中，并注册相应的标签名即可。下面我们来看如何为一个基本的 React 组件定义封装器，例如：\n\n```\nimport React from 'react';\n\
  \nfunction MyComponent() {\n  return (\n    <div>I am the component!</div>\n  );\n\
  }\n\nexport default MyComponent;\n```\n\n这段代码定义了一个简单的 React 组件——它只显示一个包含文本的 `<div>`。\n\
  \n你可以按如下方式将该组件封装在 Web 组件定义中：\n\n```\nimport React from 'react';\nimport ReactDOM\
  \ from 'react-dom';\nimport MyComponent from './MyComponent';\n\nclass MyComponentWC\
  \ extends HTMLElement {\n  connectedCallback() {\n    this.mountReactComponent();\n\
  \  }\n\n  disconnectedCallback() {\n    ReactDOM.unmountComponentAtNode(this.mountPoint);\n\
  \  }\n\n  mountReactComponent() {\n    if (!this.mountPoint) {\n      this.mountPoint\
  \ = document.createElement('div');\n      this.attachShadow({ mode: 'open' }).appendChild(this.mountPoint);\n\
  \    }\n    ReactDOM.render(<MyComponent />, this.mountPoint);\n  }\n}\n\nwindow.customElements.define('my-component',\
  \ MyComponentWC);\n```\n\n如你所见，这是自定义元素 `MyComponentWC` 的标准定义。其中包含了继承 `HTMLElement`\
  \ 类的类定义，以及 `my-component` 标签名的注册。\n\n有趣的部分发生在类定义中。你可以看到 `connectedCallback()` 反应调用了\
  \ `mountReactComponent()` 方法。该方法负责将 `MyComponent` React 组件挂载到 DOM 中。如果挂载点不存在，它会创建一个\
  \ `<div>` 作为挂载点，并将影子 DOM 附加到该 `<div>` 上。然后，它会在挂载点渲染 React 组件。\n\n`disconnectedCallback()`\
  \ 反应会将 React 组件从挂载点卸载。\n\n### 使用 Angular 构建 Web 组件\n\n要使用 Angular 创建 Web 组件，你可以利用\
  \ Angular Elements 模块，稍后你将看到这一点。假设你在 `src/app/my-component/my-component.component.ts`\
  \ 文件中实现了以下 Angular 组件：\n\n```\nimport { Component, OnInit } from '@angular/core';\n\
  \n@Component({\n  selector: 'app-my-webcomponent',\n  templateUrl: './my-webcomponent.component.html',\n\
  \  styleUrls: ['./my-webcomponent.component.css']\n})\nexport class MyWebcomponentComponent\
  \ implements OnInit {\n  constructor() { }\n\n  ngOnInit() {\n  }\n}\n```\n\n你需要通过运行以下命令将\
  \ Angular Elements 包添加到项目中：\n\n```\nng add @angular/elements\n```\n\n然后，将 `app.module.ts`\
  \ 中的代码修改如下：\n\n```\nimport { BrowserModule } from '@angular/platform-browser';\n\
  import { NgModule, Injector } from '@angular/core';\nimport { createCustomElement\
  \ } from '@angular/elements';\nimport { MyComponentComponent } from './my-component/my-component.component';\n\
  \n@NgModule({\n  declarations: [\n    MyComponentComponent\n  ],\n  imports: [\n\
  \    BrowserModule\n  ],\n  providers: [],\n  entryComponents: [MyComponentComponent]\n\
  })\nexport class AppModule {\n  constructor(injector: Injector) {\n    const el\
  \ = createCustomElement(MyComponentComponent, { injector });\n    customElements.define('my-component',\
  \ el);\n  }\n\n  ngDoBootstrap() {}\n}\n```\n\n你从 Angular Elements 模块导入了 `createCustomElement()`\
  \ 函数，并导入了上面展示的 Angular 组件。然后，你将 `MyComponentComponent` 声明为项目的入口组件，并为 `AppModule`\
  \ 类定义了构造函数。构造函数的主体从 Angular 组件创建了一个自定义元素，并像往常一样注册了 `my-component` 标签名。\n\n最后，启动应用程序的手动引导。这一步是启动\
  \ Angular 渲染过程所必需的。\n\n### 使用 Vue 构建 Web 组件\n\n使用 Vue 创建 Web 组件的过程相当直接。与 Angular\
  \ 类似，Vue 提供了一个模块，简化了将 Vue 组件封装到自定义元素中的任务。假设你在 `src/components/MyComponent.vue` 文件中实现了一个非常简单的\
  \ Vue 组件，如下所示：\n\n```\n<template>\n  <div>\n    I am the component\n  </div>\n</template>\n\
  ```\n\n这是一个非常简单的组件，但足以满足我们的目的。将 Vue 项目的 `main.js` 文件修改如下：\n\n```\nimport Vue from\
  \ 'vue'\nimport wrap from '@vue/web-component-wrapper';\nimport MyComponent from\
  \ './components/MyComponent.vue';\n\nconst CustomElement = wrap(Vue, MyComponent);\n\
  window.customElements.define('my-component', CustomElement);\n```\n\n除了 `MyComponent`\
  \ 组件外，这段代码还从 `web-component-wrapper` 模块导入了 `wrap()` 函数。它应用这个 `wrap()` 函数从 Vue 组件获取一个自定义元素，并注册相应的\
  \ `my-component` 标签名。\n\n## 结论\n\n在本章中，你了解了如何将我们在本书中构建的 Cookie 提醒组件，应用到使用 `React`、`Angular`\
  \ 和 `Vue` 创建的应用中。你发现，在使用 JavaScript UI 框架构建的应用中使用 Web 组件，就像使用标准 HTML 元素一样简单。不过，你可能需要做一些调整，以便更好地将组件与框架的内部行为集成。\n\
  \n你还探索了如何通过封装基于这些框架的组件来创建 Web 组件。你了解到，即使这是可行的，你也应该仔细评估是否值得这样做。\n\n本章展示的示例应该能为你提供足够的指导，帮助你集成\
  \ Web 组件与使用最流行的 UI 框架构建的应用。\n\n在下一章中，我们将概述最流行的库和工具，它们能帮助你开发 Web 组件。\n\n## 问题\n\n\
  1.  Web 组件的互操作性是什么意思？\n\n2.  如何在 React 应用中通过编程方式访问 Web 组件？\n\n3.  如何在 React 中处理\
  \ Web 组件的事件？\n\n4.  为什么在使用 Web 组件的 Angular 应用中需要 `CUSTOM_ELEMENTS_SCHEMA` 模块？\n\n\
  5.  如何在 Angular 中配置 `TypeScript` 编译器以支持基于 JavaScript 的 Web 组件？\n\n6.  如何避免 Vue 在遇到\
  \ Web 组件的标签名时抛出错误？\n\n7.  为什么你想要使用 JavaScript UI 框架创建 Web 组件？\n\n8.  使用 JavaScript\
  \ UI 框架构建 Web 组件可能会带来哪些缺点？\n\n# 第 10 章\n\n## Web 组件开发工具\n\n在 Web 组件构建之旅的这个阶段，你应该能够创建自己的\
  \ Web 组件，并在你的应用中使用它，无论使用哪种 UI 库。你已经掌握了 Web 组件背后的标准技术：自定义元素、影子 DOM 和模板。\n\n然而，你可能已经注意到，使用这些技术构建组件的某些步骤可能繁琐、重复或复杂。换句话说，创建\
  \ Web 组件的过程还有优化的空间。如果你想简化构建 Web 组件的过程，可以自己动手，也可以使用第三方工具。第一种情况可能具有挑战性，需要深入了解 JavaScript\
  \ 和 DOM。第二种情况可以让你以更简单的方式创建组件，但需要你学习一种基于标准技术的新抽象。\n\n\n\n\n\n在本章中，我们将探讨几种最常用的工具，它们可以改善你的开发体验并提升工作效率。你将获得关于如何使用\
  \ Polymer 项目中的 `LitElement`、Hybrids、Slim 和 Stencil 的通用但实用的概述。\n\n## 结构\n\n*   简化\
  \ Web Components 构建\n*   Polymer 与 LitElement\n*   Hybrids\n*   Slim\n*   Stencil\n\
  \n## 目标\n\n本章将为你概述那些能够帮助你更轻松地构建 Web Component 的库和工具。它们让你专注于想要实现的结果，而将内部细节交给工具处理。\n\
  \n你将学习如何使用每种工具的基本功能，从而选择最适合你需求和期望的工具。\n\n## 简化 Web Components 构建\n\n关于 Web Components\
  \ 最常见的批评之一是认为它们过于底层。要正确使用 Web Components 所依赖的技术，你需要熟练掌握 DOM 及其行为。实际上，我们已经看到构建 Web\
  \ Components 需要应对一些挑战。例如，以下是创建健壮且与 DOM 集成的 Web Component 时必须执行的一些底层任务：\n\n*   属性与特性的映射\n\
  *   事件处理与触发\n*   事件监听器的创建与移除\n*   Shadow DOM 的创建与操作\n*   模板定义\n\n这些只是你需要掌握的少数特性。其中一些活动需要深入了解\
  \ DOM；另一些则只是需要更多代码。\n\n你可能会考虑自行简化组件定义。例如，你可以通过扩展标准的 `HTMLElement` 类来定义自己的基类。这个类将处理\
  \ Shadow DOM 操作、属性与特性映射以及其他常见任务。这样，你的组件将扩展你的基类而非 `HTMLElement`，从而免费获得一些常见任务。\n\n\
  这正是许多旨在简化 Web Components 构建过程的库所采用的方法。在本章的剩余部分，我们将探讨一些最知名的库：`LitElement`、Hybrids、Slim\
  \ 和 Stencil。我们不会深入探讨这些库，而是提供一个轻量级的概述，以便从高层次了解它们所提出的方法。我们将使用每个库重新定义你在之前章节中用原生技术构建的\
  \ cookie 提醒组件。这样，你将有机会比较每个库所提出的开发模型。\n\n我们将采用标准方法使用每个库，以便逐步介绍它们的特性。对于每个库，我们将首先介绍创建\
  \ Web Component 的基本基础设施。然后，我们将看到如何为 UI 创建模板。之后，我们将探讨如何管理属性和特性，以及如何处理和触发事件。最后，我们将了解组件的生命周期。\n\
  \n### Polymer 与 LitElement\n\n**Polymer** 是一个项目和一个库的名称，由 Google 推广，旨在将 Web Components\
  \ 变为现实。该项目始于 2013 年，在 Web Components 宣布后不久，但浏览器当时尚未支持它们。该项目旨在让开发者能够支持 Web Components\
  \ 的原则。同名的库分多个版本发布，并提供了许多 polyfill 来支持核心技术和视觉设计。当大多数主流浏览器对 Web Components 支持不佳时，Polymer\
  \ 提供了一种开发 Web Components 的方式。\n\n2018 年 5 月，Polymer 团队宣布了该库开发中的一些重要变化。特别是，他们宣布项目的重点将转向\
  \ `LitElement` 库。该库是 Polymer 的一部分，并提供对定义 Web Component 的支持。换句话说，Polymer 项目认识到原生\
  \ Web Components 支持的时机已经成熟。\n\n在本节中，我们将了解如何利用 `LitElement` 库来简化定义 Web Component\
  \ 的方式。\n\n#### lit-html 库\n\nLitElement 的诞生与 `lit-html` 库密切相关。这是一个轻量级且可扩展的 HTML\
  \ 模板库，基于浏览器内置的 HTML 解析器和标准模板元素。如果你了解 React，可以将其视为 Web Components 的 JSX 解析器。\n\n\
  你可以独立于 `LitElement` 使用 `lit-html` 库。它提倡一种函数式方法来创建 HTML 模板，允许你使用紧凑的语法创建模板，如下例所示：\n\
  \n```\nhtml`<h1>欢迎 ${name}</h1>`\n```\n\n如你所见，这个表达式不过是一个使用 `lit-html` 库定义的 `html`\
  \ 标签的标签模板字面量。因此，它使用了一种基于字符串插值的标准方法来定义模板。\n\n它的优势在于可以定义返回 `lit-html` 模板的函数，如下例所示：\n\
  \n```\nconst helloTemplate = (name) => html`<h1>欢迎 ${name}</h1>`;\n```\n\n`helloTemplate()`\
  \ 函数会计算模板字面量，但当然，它不会渲染到 DOM 中。要生成模板的元素，你必须使用 `render()` 函数，如下所示：\n\n```\nrender(helloTemplate(\"\
  John\"), document.body);\n```\n\n`render()` 函数接收由 `helloTemplate()` 函数实例化的模板，创建相应的\
  \ HTML 元素，并将它们附加到当前 HTML 文档的 body 中。\n\n这一切都以非常高效的方式发生。\n\n当然，这只是对 `lit-html` 库的快速概述。它还有许多其他有趣的特性，比如对指令和高级渲染选项的支持。\n\
  \n#### 使用 LitElement\n\n`LitElement` 库严重依赖于 `lit-html` 库。如果你计划使用 `LitElement` 构建\
  \ Web Components，则无需显式使用 `lit-html`。它已经包含在 `LitElement` 中。\n\n假设你有一个基于 Node.js 开发环境的\
  \ Web Component 项目，使用 `LitElement` 的第一步是在终端窗口中输入以下命令来安装它：\n\n```\nnpm install lit-element\n\
  ```\n\n#### 基本基础设施\n\n安装库后，你可以通过编写以下代码来实现我们的 cookie 提醒组件的基本基础设施：\n\n```\nimport\
  \ { LitElement, html, css } from 'lit-element';\n\nexport default class CookieAlert\
  \ extends LitElement {\n\n}\n\ncustomElements.define(\"cookie-alert\", CookieAlert);\n\
  ```\n\n你从库中导入了 `LitElement` 类以及 HTML 和 CSS 标签模板字面量。顺便提一下，HTML 标签模板字面量与 `lit-html`\
  \ 库中的函数相同。然后，你注意到这里我们扩展了 `LitElement` 基类，而不是通常的 `HTMLElement` 类。这个类提供了库的支持，以简化组件定义，我们稍后会看到。\n\
  \n**`LitElement` 库也支持基于装饰器的方法来定义 Web Components。然而，由于装饰器仍然不是官方支持的标准，你需要使用特定的转译器，比如经过适当配置的\
  \ TypeScript 或 Babel。在本节中，我们不会使用这种方法，但会在过程中展示一些此类语法的示例。**\n\n通过使用基于装饰器的语法，之前的类定义将如下所示：\n\
  \n```\nimport { LitElement, html, css, customElement } from 'lit-element';\n\n@customElement(\"\
  cookie-alert\")\nexport default class CookieAlert extends LitElement {\n\n}\n```\n\
  \n这种语法消除了对 `customElements.define()` 方法的需求，因为 `customElement` 装饰器完成了这个任务。\n\n####\
  \ 模板与 UI\n\n\n\n\n\n在搭建好定义组件的基本基础设施后，让我们用以下代码实现 cookie 提示组件的 UI：\n\n```\nimport\
  \ { LitElement, html, css } from 'lit-element';\n\nexport default class CookieAlert\
  \ extends LitElement {\n\nstatic get styles() {\n\nreturn css`\n\n.container {\n\
  \ncolor: rgb(255, 255, 255);\n\nbackground-color: rgb(35, 122, 252);\n\npadding:\
  \ 1em 1.8em;\n\nwidth: 100%;\n\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  \n}\n\n.footer {\n\nposition:fixed;\n\nleft:0px;\n\nbottom:0px;\n\n}\n\n.button\
  \ {\n\ncolor: rgb(255, 255, 255);\n\nbackground-color: transparent;\n\nborder-color:\
  \ rgb(255, 255, 255);\n\npadding: 5px 40px;\n\nmargin-right: 50px;\n\ncursor: pointer;\n\
  \nfloat:right;\n\n}\n\n`;\n\n}\n\nrender() {\n\nreturn html`\n\n<div class=\"container\
  \ footer\">\n\n<slot id=\"message\" name=\"message\">${this.message}</slot>&nbsp;\n\
  \n<slot name=\"reference\"></slot>\n\n<button id=\"closeButton\" class=\"button\"\
  >关闭</button>\n\n<button id= \"acceptButton\" class=\"button\">接受</button>\n\n</div>`;\n\
  \n}\n\n}\n\ncustomElements.define(\"cookie-alert\", CookieAlert);\n```\n\n如你所见，我们添加了静态\
  \ getter `styles()` 和方法 `render()`。`styles()` getter 通过使用 CSS 标签模板字面量定义了应用于组件的 CSS\
  \ 样式。`render()` 方法为组件的 UI 生成了 DOM 结构，它是指定 HTML 标签模板字面量的结果。\n\n这里没有提到 Shadow DOM。`LitElement`\
  \ 基类内部管理了它，所以你无需担心。\n\n#### 属性和特性\n\n下一步是添加 message 属性，并将其与同名的特性同步。你可以通过向 `CookieAlert`\
  \ 类添加以下代码轻松实现：\n\n```\nimport { LitElement, html, css } from 'lit-element';\n\n\
  export default class CookieAlert extends LitElement {\n\nconstructor() {\n\nsuper();\n\
  \nthis.message = \"本网站使用 cookie 以确保您获得最佳体验\";\n\n}\n\nstatic get properties() {\n\
  \nreturn {\n\nmessage: {\n\nattribute: true,\n\ntype: String,\n\nreflect: true\n\
  \n}\n\n}\n\n}\n\n//…\n\n}\n```\n\n我们添加了静态 getter `properties()`。这个 getter 返回一个包含组件属性定义的对象。在我们的例子中，我们定义了\
  \ `message` 属性。属性定义是一个带有几个选项的对象。\n\n赋给 `attribute` 选项的 `true` 值表示 `message` 属性必须映射到一个同名的特性。\n\
  \n我们还指定了属性的类型。如果你想将特性映射到属性，这一点至关重要。事实上，请记住特性的类型始终是字符串，而属性的类型可以是任何可能的 JavaScript\
  \ 类型。你需要指定属性类型，以便在将特性映射到属性时进行正确的类型转换。\n\n最后，`reflect` 选项启用了属性到特性的映射。如你所见，无需观察特性并显式管理类型转换。你还注意到我们添加了类构造函数。在这种情况下，它的作用是为\
  \ `message` 属性设置一个默认值。\n\n基于装饰器的语法允许你拥有紧凑的属性定义，如下面的代码片段所示：\n\n```\nimport { LitElement,\
  \ html, css } from 'lit-element';\n\n@customElement(\"cookie-alert\")\n\nexport\
  \ default class CookieAlert extends LitElement {\n\n@property({\n\nattribute: true,\n\
  \ntype: String,\n\nreflect: true\n\n})\n\nmessage = \"本网站使用 cookie 以确保您获得最佳体验\"\
  ;\n\n//…\n\n}\n```\n\n`@property` 装饰器接受应用于 `message` 属性的选项。此外，`message` 属性的初始化发生在定义中。\n\
  \n#### 事件\n\n为了完成 cookie 提示组件的实现，我们需要处理并触发事件。为此，我们对 `render()` 方法中的 UI 模板做了一些小改动：\n\
  \n```\nimport { LitElement, html, css } from 'lit-element';\n\nexport default class\
  \ CookieAlert extends LitElement {\n\n// …\n\nrender() {\n\nreturn html`\n\n<div\
  \ class=\"container footer\">\n\n<slot id=\"message\" name=\"message\">${this.message}</slot>&nbsp;\n\
  \n<slot name=\"reference\"></slot>\n\n<button id=\"closeButton\" class=\"button\"\
  \ @click=\"${() => this.style.visibility = \"hidden\"}\">关闭</button>\n\n<button\
  \ id= \"acceptButton\" class=\"button\" @click=\"${this.accept}\">接受</button>\n\n\
  </div>`;\n\n}\n\n//…\n\n}\n```\n\n你看到我们在两个按钮上都添加了 `@click` 绑定。`@event` 绑定来自 `lit-html`\
  \ 库。它允许你直接在模板中将监听器绑定到事件。在我们的例子中，我们为第一个按钮附加了一个箭头函数来隐藏 cookie 提示组件。我们还将 `accept()`\
  \ 方法与第二个按钮的点击事件关联起来。\n\n`accept()` 方法与我们在原始组件中使用的监听器具有相同的实现：\n\n```\nimport { LitElement,\
  \ html, css } from 'lit-element';\n\nexport default class CookieAlert extends LitElement\
  \ {\n\n// …\n\naccept() {\n\nthis.style.visibility = \"hidden\";\n\nsetCookie(\"\
  cookiesAccepted\", \"y\", 365);\n\nthis.dispatchEvent(new CustomEvent(\"accepted\"\
  , {\n\ndetail:{\n\nacceptedCookieName: \"cookiesAccepted\",\n\nacceptedCookieExpiration:\
  \ 365}\n\n}));\n\n}\n\n//…\n\n}\n```\n\n#### 生命周期\n\n为了完成组件实现，我们必须添加管理接受 cookie\
  \ 的代码：\n\n```\nimport { LitElement, html, css } from 'lit-element';\n\nexport default\
  \ class CookieAlert extends LitElement {\n\n// …\n\nconnectedCallback() {\n\nsuper.connectedCallback();\n\
  \nconst cookiesAccepted = getCookie(\"cookiesAccepted\")\n\nif (cookiesAccepted\
  \ === \"y\") {\n\nthis.style.visibility = \"hidden\";\n\n}\n\n}\n\n//…\n\n}\n```\n\
  \n你可以看到 `connectedCallback()` 方法与我们在组件标准版本中的实现几乎相同。主要区别在于调用了父类的 `connectedCallback()`\
  \ 方法。这确保了 `LitElement` 类的 `connectedCallback()` 方法中实现的所有初始化都被执行。\n\n`LitElement`\
  \ 库还提供了其他功能来帮助你构建 Web 组件。例如，除了标准反应之外，`LitElement` 类还支持在组件生命周期的不同阶段调用的其他方法。正如本章开头所说，讨论这个主题超出了我们的范围。\n\
  \n### Hybrids\n\n`Hybrids` 库旨在为你提供一种函数式方法来定义 Web 组件。你应该只依赖普通对象和纯函数。因此，没有类也没有继承。管理\
  \ Web 组件原生定义的所有细节都由库内部处理。\n\n要在基于 Node 的项目中使用 `Hybrid`，请在终端窗口中输入以下命令进行安装：\n\n`npm\
  \ install hybrids`\n\n#### 基本基础设施\n\n让我们通过重新实现 cookie 提示组件来探索 `Hybrid` 库的基本功能。以下代码展示了定义\
  \ Web 组件的基本元素：\n\n```\nimport { html, define } from 'hybrids';\n\nexport const CookieAlert\
  \ = {\n\n};\n\ndefine(\"cookie-alert\", CookieAlert);\n```\n\n你导入了 `html()` 和 `define()`\
  \ 函数。我们稍后将看到如何使用 `html()` 函数。`define()` 函数是你定义 Web 组件所需的全部内容。该函数将组件的标签名作为第一个参数，将包含组件配置的字面量对象作为第二个参数。在示例中，`CookieAlert`\
  \ 对象是空的，但我们马上就会填充它。\n\n#### 模板和 UI\n\n\n\n\n要定义组件的用户界面，你需要在`CookieAlert`配置对象中添加一个`render()`方法。该方法返回一个通过使用`html()`函数标记模板字面量而获得的带标签的模板字面量，如下例所示：\n\
  \n```\nimport { html, define } from 'hybrids';\n\nexport const CookieAlert = {\n\
  \nrender: () => html‘\n\n<style>\n\n.container {\n\ncolor: rgb(255, 255, 255);\n\
  \nbackground-color: rgb(35, 122, 252);\n\npadding: 1em 1.8em;\n\nwidth: 100%;\n\n\
  font-family: Helvetica,Calibri,Arial,sans-serif;\n\n}\n\n.footer {\n\nposition:fixed;\n\
  \nleft:0px;\n\nbottom:0px;\n\n}\n\n.button {\n\ncolor: rgb(255, 255, 255);\n\nbackground-color:\
  \ transparent;\n\nborder-color: rgb(255, 255, 255);\n\npadding: 5px 40px;\n\nmargin-right:\
  \ 50px;\n\ncursor: pointer;\n\nfloat:right;\n\n}\n\n</style>\n\n<div class=\"container\
  \ footer\">\n\n<slot id=\"message\" name=\"message\"></slot>&nbsp;\n\n<slot name=\"\
  reference\"></slot>\n\n<button id=\"closeButton\" class=\"button\">Close</button>\n\
  \n<button id= \"acceptButton\" class=\"button\">Accept</button>\n\n</div>\n\n‘\n\
  \n};\n\ndefine(\"cookie-alert\", CookieAlert);\n```\n\n`render()`方法创建并更新你的 Web 组件的\
  \ DOM 结构。它与内置模板引擎协同工作。\n\nHybrids 使用的 HTML 模板引擎类似于`lit-html`库的`html()`函数。然而，即使语法非常相似，其实现方式却不同。\n\
  \n#### 属性和特性\n\n要向组件添加属性和特性，你需要将其定义附加到`CookieAlert`对象上。最简单的方式是，你可以像下面这样向 cookie\
  \ alert 组件添加`message`属性：\n\n```\nimport { html, define } from 'hybrids';\n\nexport\
  \ const CookieAlert = {\n\nmessage: \"This website uses cookies to ensure you get\
  \ the best experience\",\n\nrender: ({message}) => html‘\n\n<style>\n\n//…\n\n</style>\n\
  \n<div class=\"container footer\">\n\n<slot id=\"message\" name=\"message\">${message}</slot>&nbsp;\n\
  \n<slot name=\"reference\"></slot>\n\n<button id=\"closeButton\" class=\"button\"\
  >Close</button>\n\n<button id= \"acceptButton\" class=\"button\">Accept</button>\n\
  \n</div>\n\n‘\n\n};\n\ndefine(\"cookie-alert\", CookieAlert);\n```\n\n你添加了带有默认文本的`message`属性。这是定义属性的基本方式。\n\
  \n通常，Hybrids 库允许你提供一个属性描述符来定义属性。属性描述符是一个普通对象，其一般形式如下所示：\n\n```\nconst MyElement\
  \ = {\n\npropertyName: {\n\nget: (host, lastValue) => {…},\n\nset: (host, value,\
  \ lastValue) => {…},\n\nconnect: (host, key, invalidate) => {\n\n…\n\n// disconnect\n\
  \nreturn () => {…};\n\n},\n\nobserve: (host, value, lastValue) => {…},\n\n}\n\n\
  };\n```\n\n`get()`和`set()`方法定义了属性的 getter 和 setter。它们有一些参数，允许你正确地管理属性的值。特别是，它们的第一个参数（示例中的`host`）代表当前组件实例。该参数被显式传递，使你无需依赖`this`关键字。getter\
  \ 和 setter 必须返回新的属性值。\n\n`connect()`和`observe()`方法允许你在组件被添加到 DOM 时以及属性值发生变化时执行代码。\n\
  \nHybrids 为你提供了一些内置的属性工厂，即返回预定义属性配置的函数。`property()`函数就是这些工厂之一。它允许你按以下方式定义属性：\n\n\
  ```\nimport { html, define } from 'hybrids';\n\nexport const CookieAlert = {\n\n\
  message: property(\"This website uses cookies to ensure you get the best experience\"\
  ),\n\n//…\n\n};\n\ndefine(\"cookie-alert\", CookieAlert);\n```\n\n`property()`工厂返回`message`属性的标准配置，并带有默认字符串值。它还将该属性与同名的特性（attribute）连接起来。\n\
  \n**当组件被添加到 DOM 时，特性的值仅被赋值给对应的属性一次。这意味着特性应仅用于在 HTML 标记中设置静态值。对特性的更改不会自动反映到对应的属性中。**\n\
  \n我们上面使用的方法，即简单地将字符串赋值给`message`属性，只是使用`property()`工厂的一种快捷方式。在 Hybrid 术语中，这种快捷方式被称为**翻译**。\n\
  \n总结一下，你有多种方式来定义属性。每种方式取决于你对属性定义所需的灵活性程度。\n\n为了完成对属性和特性的概述，你需要知道 Web 组件配置对象中的每一项都是独立的。这意味着没有内部状态，对属性的任何引用都必须显式。这就是为什么上面\
  \ cookie alert 定义的`render()`方法将`{message}`对象作为参数的原因：\n\n```\nrender: ({message})\
  \ => html‘\n\n<style>\n\n//…\n\n</style>\n\n<div class=\"container footer\">\n\n\
  <slot id=\"message\" name=\"message\">${message}</slot>&nbsp;\n\n<slot name=\"reference\"\
  ></slot>\n\n<button id=\"closeButton\" class=\"button\">Close</button>\n\n<button\
  \ id= \"acceptButton\" class=\"button\">Accept</button>\n\n</div>\n\n‘\n```\n\n\
  由于你需要在 UI 模板中使用`message`属性，你必须显式地传递它。更一般地说，你必须传递一个包含所有需要在`render()`方法中使用的属性的对象。\n\
  \n#### 事件\n\n要在 Web 组件的模板中添加事件监听器，你可以简单地使用在标准 HTML 元素上使用的`onevent`语法。例如，要处理 cookie\
  \ alert 组件两个按钮的点击事件，你可以像下面这样做：\n\n```\n<div class=\"container footer\">\n\n<slot\
  \ id=\"message\" name=\"message\">${message}</slot>&nbsp;\n\n<slot name=\"reference\"\
  ></slot>\n\n<button id=\"closeButton\"\n\nclass=\"button\"\n\nonclick=\"${(host)=>\
  \ host.style.visibility = \"hidden\"}\">\n\nClose\n\n</button>\n\n<button id= \"\
  acceptButton\"\n\nclass=\"button\"\n\nonclick=\"${accept}\">\n\nAccept\n\n</button>\n\
  \n</div>\n```\n\n你为第一个按钮的`onclick`属性分配了一个箭头函数，为第二个按钮分配了`accept()`函数。`accept()`函数是在当前模块中定义的一个普通函数，如下所示：\n\
  \n```\nfunction accept(host) {\n\nhost.style.visibility = \"hidden\";\n\nsetCookie(\"\
  cookiesAccepted\", \"y\", 365);\n\nhost.dispatchEvent(new CustomEvent(\"accepted\"\
  , {\n\ndetail:{\n\nacceptedCookieName: \"cookiesAccepted\",\n\nacceptedCookieExpiration:\
  \ 365}\n\n}));\n\n}\n```\n\n这里唯一需要注意的主要事情是`host`参数。如前所述，它代表组件的当前实例。\n\n#### 生命周期\n\
  \n为了完成我们的 cookie alert 组件的实现，我们需要在组件被添加到 DOM 时检查是否设置了接受 cookie。为了实现这一点，我们需要重新安排`message`属性定义，以便在组件被添加到\
  \ DOM 时进行拦截。实际上，Hybrids 库没有针对组件生命周期的全局事件。这些事件是基于每个属性的。\n\n因此我们重新定义`message`属性定义如下：\n\
  \n```\nexport const CookieAlert = {\n\nmessage: {\n\nget: (host, lastValue = message)\
  \ => lastValue,\n\nset: (host,value) => value,\n\nconnect: checkCookie\n\n},\n\n\
  render: ({message}) => html‘\n\n//…\n\n‘\n\n};\n```\n\n我们为属性指定了 getter 和 setter，以及`connect()`方法，该方法将在组件被添加到\
  \ DOM 时执行。请记住，这内部对应于`connectedCallback()`回调。换句话说，所有与组件属性定义关联的`connect()`方法都会在`connectedCallback()`回调运行时执行。\n\
  \n`checkCookie()`函数定义如下：\n\n\n\n```\nfunction checkCookie(host) {\nconst cookiesAccepted\
  \ = getCookie(\"cookiesAccepted\")\nif (cookiesAccepted === \"y\") {\nhost.style.visibility\
  \ = \"hidden\";\n}\n}\n```\n\n再次注意，传入的 `host` 参数代表当前组件实例。\n\n如果你想在组件从 DOM 中移除时执行某些代码，`connect()`\
  \ 方法必须返回要执行的函数。这样，`connect()` 方法注册了一个函数，该函数将在 `disconnectedCallback()` 反应运行时执行。\n\
  \n### Slim 库\n\nSlim 库旨在通过减少你需要编写的代码量来简化 Web Components 的定义。它基于类的方式，但提供了略有不同的模型和生命周期事件。\n\
  \n要开始使用 Slim 库，你需要使用以下命令进行安装：\n\n`npm install slim-js`\n\n#### 基本架构\n\n与其他库一样，让我们从组件的基本定义开始实现\
  \ cookie 提醒组件：\n\n```\nimport {Slim} from 'slim-js';\n\nSlim.tag(\n\"cookie-alert\"\
  ,\n\"<div>Web Component</div>\",\nclass CookieAlert extends Slim {\nget useShadow()\
  \ { return true }\n});\n```\n\n从 `slim-js` 模块导入的 `Slim` 对象允许你完成创建 Web Component\
  \ 所需的一切。它的 `tag()` 方法接受三个参数：\n\n* 与组件关联的标签名称。\n* 定义组件 UI 模板的标记。\n* 定义组件逻辑的类。\n\n\
  如你所见，定义我们组件的 `CookieAlert` 类继承了该类。在这个基本示例中，你可能注意到我们添加了 `useShadow()` 获取器，它返回 true\
  \ 值。这个获取器使 Slim 能够为组件使用 Shadow DOM。实际上，默认情况下，基于 Slim 的组件不使用 Shadow DOM。\n\n该库还提供了一种基于装饰器的语法。在这种情况下，cookie\
  \ 提醒组件基本架构的等效代码如下：\n\n```\nimport {Slim} from 'slim-js';\nimport {tag, template}\
  \ from 'slim-js/Decorators';\n\n@tag(\"cookie-alert\")\n@template(\"<div>Web Component</div>\"\
  )\n@useShadow(true)\nclass CookieAlert extends Slim {\n}\n```\n\n非常简单且紧凑！\n\n####\
  \ 模板与 UI\n\n使用 `Slim` 创建组件的 UI 只需指定表示你想要使用的模板的字符串。例如，以下代码展示了如何为 cookie 提醒组件添加基本的\
  \ UI 标记：\n\n```\nimport {Slim} from 'slim-js';\n\nSlim.tag(\n\"cookie-alert\",\n\
  ‘<style>\n.container {\ncolor: rgb(255, 255, 255);\nbackground-color: rgb(35, 122,\
  \ 252);\npadding: 1em 1.8em;\nwidth: 100%;\nfont-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n.footer {\nposition:fixed;\nleft:0px;\nbottom:0px;\n}\n.button {\ncolor: rgb(255,\
  \ 255, 255);\nbackground-color: transparent;\nborder-color: rgb(255, 255, 255);\n\
  padding: 5px 40px;\nmargin-right: 50px;\ncursor: pointer;\nfloat:right;\n}\n</style>\n\
  <div class=\"container footer\">\n<slot id=\"message\" name=\"message\"></slot>&nbsp;\n\
  <slot name=\"reference\"></slot>\n<button id=\"closeButton\" class=\"button\">Close</button>\n\
  <button id= \"acceptButton\" class=\"button\">Accept</button>\n</div>‘,\nclass CookieAlert\
  \ extends Slim {\nget useShadow() { return true }\n});\n```\n\n稍后我们会看到，这个模板允许你指定占位符。\n\
  \n#### 属性与特性\n\n在 `Slim` 中，组件属性就是类定义中的属性。如果你想初始化它，需要在构造函数中进行。以下代码展示了如何为 cookie 提醒组件实现\
  \ `message` 属性：\n\n```\nimport {Slim} from 'slim-js';\n\nSlim.tag(\n\"cookie-alert\"\
  ,\n‘<style>\n//…\n</style>\n<div class=\"container footer\">\n<slot id=\"message\"\
  \ name=\"message\">{{message}}</slot>&nbsp;\n<slot name=\"reference\"></slot>\n\
  <button id=\"closeButton\" class=\"button\">Close</button>\n<button id= \"acceptButton\"\
  \ class=\"button\">Accept</button>\n</div>‘,\nclass CookieAlert extends Slim {\n\
  constructor() {\nsuper();\nthis.message = \"This website uses cookies to ensure\
  \ you get the best experience\";\n}\nget useShadow() { return true }\n});\n```\n\
  \n你可以看到，属性在构造函数中定义并初始化。注意构造函数中也调用了 `super()`。一旦定义了 `message` 属性，你就可以在 UI 模板中通过双花括号来使用它。\n\
  \n然而，在这种情况下，`message` 属性并未绑定到 `message` 特性。要将属性映射到特性，你需要使用基于装饰器的语法，如下例所示：\n\n```\n\
  import {Slim} from 'slim-js';\nimport {tag, template, attribute} from 'slim-js/Decorators';\n\
  \n@tag(\"cookie-alert\")\n@template(\"<div>Web Component</div>\")\n@useShadow(true)\n\
  class CookieAlert extends Slim {\n@attribute\nmessage\n}\n```\n\n在这种情况下，你使用了与公共\
  \ `message` 属性关联的 `@attribute` 装饰器。\n\n**请注意，在撰写本文时，使用装饰器和属性定义的 JavaScript 语法尚未正式成为受支持的标准。要使用它们，你需要使用特定的转译器，如\
  \ TypeScript 或经过适当配置的 Babel。**\n\n#### 事件\n\n处理事件很容易。你可以将事件名称作为属性添加到模板中的 HTML 元素，并将你定义为类方法的事件监听器与之关联。为了更好地解释，请看以下代码：\n\
  \n```\nimport {Slim} from 'slim-js';\n\nSlim.tag(\n\"cookie-alert\",\n‘<style>\n\
  //…\n</style>\n<div class=\"container footer\">\n<slot id=\"message\" name=\"message\"\
  >{{message}}</slot>&nbsp;\n<slot name=\"reference\"></slot>\n<button id=\"closeButton\"\
  \ class=\"button\" click=\"hide\">Close</button>\n<button id= \"acceptButton\" class=\"\
  button\" click=\"accept\">Accept</button>\n</div>‘,\nclass CookieAlert extends Slim\
  \ {\nconstructor() {\nsuper();\nthis.message = \"This website uses cookies to ensure\
  \ you get the best experience\";\n}\nget useShadow() { return true }\nhide() {\n\
  this.style.visibility = \"hidden\";\n}\naccept() {\nthis.style.visibility = \"hidden\"\
  ;\nsetCookie(\"cookiesAccepted\", \"y\", 365);\nthis.dispatchEvent(new CustomEvent(\"\
  accepted\", {\ndetail:{\nacceptedCookieName: \"cookiesAccepted\",\nacceptedCookieExpiration:\
  \ 365}\n}));\n}\n});\n```\n\n这里，关闭和接受按钮具有 `click` 属性。每个属性都分配了一个字符串：`hide` 和 `accept`。这些是你附加到\
  \ `CookieAlert` 类的方法名称。这些方法是 click 事件的事件监听器。\n\n还要注意，生成自定义事件的机制保持不变。\n\n#### 生命周期\n\
  \n为了完成我们的实现，我们需要在显示提醒之前检查用户是否已接受 cookie 政策。我们知道，这意味着我们需要检查接受 cookie 是否已设置。为了确保在渲染消息之前进行检查，我们必须在\
  \ `BeforeCreated` 生命周期事件中执行此操作，如下所示：\n\n```\nimport {Slim} from 'slim-js';\n\nSlim.tag(\n\
  \"cookie-alert\",\n‘\n//…\n‘,\nclass CookieAlert extends Slim {\nonBeforeCreated()\
  \ {\nconst cookiesAccepted = getCookie(\"cookiesAccepted\")\nif (cookiesAccepted\
  \ === \"y\") {\nthis.style.visibility = \"hidden\";\n}\nthis.message = \"This website\
  \ uses cookies to ensure you get the best experience\";\n}\n//…\n});\n```\n\n当 `BeforeCreated`\
  \ 事件发生时，会调用 `onBeforeCreated()` 方法。`Slim` 为其组件生成几个生命周期事件。要管理它们，你应该实现以下方法：\n\n* `onBeforeCreated()`：此方法在组件创建之前执行。\n\
  \n\n\n\n*   `onCreated()`：此方法在组件创建后执行。\n*   `onAdded()`：此方法在组件添加到 DOM 时运行。\n*  \
  \ `onRender()`：此方法在 UI 渲染或更新时执行。\n*   `onRemoved()`：此方法在组件从 DOM 中移除时运行。\n\n### Stencil\n\
  \nStencil 是一种提供不同方式来构建 Web 组件的工具。我们在本章中探讨的库为你提供了一种抽象，可以简化或丰富 Web 组件的定义。然而，你构建的组件依赖于库本身：库的代码必须包含在最终生成的组件中。\n\
  \n而 Stencil 则是一个编译器。它为你提供了丰富的抽象来构建 Web 组件。它提供了一种受 Angular 和 React 启发的模型和语法。但构建组件的最终结果是纯\
  \ JavaScript。\n\n让我们通过实现我们的 cookie 警告组件来快速了解 Stencil 的主要特性。\n\n要启动一个 Stencil 项目，你可以运行以下命令：\n\
  \n`npm init stencil component cookie-alert`\n\n该命令将在 `cookie-alert` 文件夹中设置一个基本的\
  \ Stencil 项目，包含所有必需的依赖项。请注意，我们在上面的命令中指定了 `component` 关键字。实际上，你可以使用 Stencil 构建其他类型的项目，例如完整的\
  \ Web 应用程序（`app`）或 Ionic 应用程序（`ionic-pwa`）。\n\n项目结构创建完成后，你会看到几个文件夹和多个文件。我们不会分析整个结构，而是专注于类定义和\
  \ CSS 样式。请参考 Stencil 官方文档以获取更多详细信息。\n\n#### 基本基础设施\n\nStencil 组件的基本定义如下所示：\n\n```\n\
  import { Component, h } from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n\
  \  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\nexport class CookieAlert {\n\
  \  render() {\n    return <div>Hello, World!</div>;\n  }\n}\n```\n\n这几行代码突出了 Stencil\
  \ 的一些关键特性：\n\n*   它使用 TypeScript 而不是纯 JavaScript\n*   它使用 JSX\n*   它使用装饰器\n\n`CookieAlert`\
  \ 类的定义使用了 `@Component` 装饰器进行注解。这个装饰器将该类标记为 Web 组件定义，类似于 Angular 对其组件的处理方式。\n\n传递给装饰器的选项用于配置组件。具体来说，`tag`\
  \ 选项定义了与组件关联的标签名。`styleUrl` 选项指示包含组件 CSS 规则的文件。`shadow` 选项指定是否启用 Shadow DOM（`true`\
  \ 启用，`false` 不启用）。默认情况下，Shadow DOM 是禁用的，因此在我们的 cookie 组件中，我们显式地启用了它。\n\n组件有一个 `render()`\
  \ 方法，用于构建 UI。该方法返回一个 JSX 表达式，类似于 React 基于类的组件中的做法。\n\n在模块顶部导入的 `h()` 函数是必需的，它允许\
  \ Stencil 将 JSX 转换为虚拟 DOM 元素。\n\n#### 模板和 UI\n\n至此，你已经知道如何为组件构建 UI：将标记定义为 `render()`\
  \ 方法返回的 JSX 表达式，如下所示：\n\n```\nimport { Component, h } from '@stencil/core';\n\n\
  @Component({\n  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow:\
  \ true\n})\nexport class CookieAlert {\n  render() {\n    return <div class=\"container\
  \ footer\">\n      <slot name=\"message\"></slot>&nbsp;\n      <slot name=\"reference\"\
  ></slot>\n      <button id=\"closeButton\" class=\"button\">Close</button>\n   \
  \   <button id= \"acceptButton\" class=\"button\">Accept</button>\n    </div>;\n\
  \  }\n}\n```\n\n由于组件定义引用了 `cookie-alert.css` 文件，请创建该文件并将常规 CSS 代码放入其中：\n\n```\n\
  .container {\n  color: rgb(255, 255, 255);\n  background-color: rgb(35, 122, 252);\n\
  \  padding: 1em 1.8em;\n  width: 100%;\n  font-family: Helvetica,Calibri,Arial,sans-serif;\n\
  }\n\n.footer {\n  position:fixed;\n  left:0px;\n  bottom:0px;\n}\n\n.button {\n\
  \  color: rgb(255, 255, 255);\n  background-color: transparent;\n  border-color:\
  \ rgb(255, 255, 255);\n  padding: 5px 40px;\n  margin-right: 50px;\n  cursor: pointer;\n\
  \  float:right;\n}\n```\n\n通过这些更改，你已经准备好了 cookie 警告组件的基本结构。\n\n#### 属性和特性\n\n要向\
  \ cookie 警告组件添加 `message` 属性，让我们修改之前的代码如下：\n\n```\nimport { Component, Prop, h }\
  \ from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n\
  \  shadow: true\n})\nexport class CookieAlert {\n  @Prop()\n  message: string =\
  \ \"This website uses cookies to ensure you get the best experience\";\n\n  render()\
  \ {\n    return <div class=\"container footer\">\n      <slot name=\"message\">{this.message}</slot>&nbsp;\n\
  \      <slot name=\"reference\"></slot>\n      <button id=\"closeButton\" class=\"\
  button\">Close</button>\n      <button id= \"acceptButton\" class=\"button\">Accept</button>\n\
  \    </div>;\n  }\n}\n```\n\n我们为 `message` 属性使用了 `@Prop` 装饰器并对其进行了初始化。然后通过 `this.message`\
  \ 表达式在 JSX 标记中使用了该属性。\n\n**使用** `@Prop` **装饰器定义的属性默认情况下是不可变的。这意味着它的值无法从组件逻辑内部更新。如果你想覆盖此行为，需要为该装饰器设置\
  \ mutable 选项** `(@Prop({mutable: true})).`\n\n到目前为止创建的 `message` 属性与同名的特性相关联。但是，对属性的更改不会映射到特性。如果你需要这种行为，需要启用反射，如下代码所示：\n\
  \n`@Prop({reflect: true}) message: string = \"This website uses cookies to ensure\
  \ you get the best experience\";`\n\n这样，对属性的更改将与相应的特性同步。\n\n#### 事件\n\n让我们开始了解如何通过处理关闭按钮上的点击事件来管理和生成事件。这是所需的代码：\n\
  \n```\nimport { Component, Element, Prop, h } from '@stencil/core';\n\n@Component({\n\
  \  tag: 'cookie-alert',\n  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\nexport\
  \ class CookieAlert {\n  @Prop() message: string = \"This website uses cookies to\
  \ ensure you get the best experience\";\n  @Element() element: HTMLElement;\n\n\
  \  render() {\n    return <div class=\"container footer\">\n      <slot name=\"\
  message\">{this.message}</slot>&nbsp;\n      <slot name=\"reference\"></slot>\n\
  \      <button id=\"closeButton\"\n        class=\"button\"\n        onClick={()=>\
  \ this.element.style.visibility = \"hidden\"}>\n        Close\n      </button>\n\
  \      <button id= \"acceptButton\" class=\"button\">Accept</button>\n    </div>;\n\
  \  }\n}\n```\n\n你通过向按钮元素添加 `onClick` 属性并为其分配一个箭头函数来处理点击事件。\n\n如你所见，点击监听器的代码展示了一个有趣的案例。要更改\
  \ CSS 可见性属性，你需要访问组件宿主元素。为此，你使用 `@Element` 装饰器来定义 `element` 属性。该属性将允许你从组件类内部访问组件宿主元素。\n\
  \n要处理接受按钮上的点击事件，我们可以将上述代码更改如下：\n\n```\nimport { Component, Element, Prop, Event,\
  \ EventEmitter, h } from '@stencil/core';\n\n@Component({\n  tag: 'cookie-alert',\n\
  \  styleUrl: 'cookie-alert.css',\n  shadow: true\n})\nexport class CookieAlert {\n\
  \  @Prop() message: string = \"This website uses cookies to ensure you get the best\
  \ experience\";\n  @Element() element: HTMLElement;\n  @Event() accepted: EventEmitter;\n\
  \n  render() {\n    return <div class=\"container footer\">\n      <slot name=\"\
  message\">{this.message}</slot>&nbsp;\n      <slot name=\"reference\"></slot>\n\
  \      <button id=\"closeButton\"\n```\n\n\n\n\n\n```\nclass=\"button\"\nonClick={()=>this.element.style.visibility\
  \ = \"hidden\"}>\nClose\n</button>\n<button id= \"acceptButton\"\nclass=\"button\"\
  \nonClick={()=>this.accept()}>\nAccept\n</button>\n</div>;\n}\naccept() {\nthis.element.style.visibility\
  \ = \"hidden\";\nsetCookie(\"cookiesAccepted\", \"y\", 365);\nthis.accepted.emit({\n\
  detail:{\nacceptedCookieName: \"cookiesAccepted\",\nacceptedCookieExpiration: 365}\n\
  });\n}\n```\n\n在这个例子中，我们定义了 `accept()` 方法，并在 `onClick` 监听器中使用了它。有趣的是，我们如何生成 accepted\
  \ 事件。我们使用了 `@Event` 装饰器来声明 accepted 事件发射器，并通过其 `emit()` 方法创建它。\n\n`Stencil` 还提供了\
  \ `@Listen` 装饰器，允许你监听组件上的事件。\n\n#### 生命周期\n\n和往常一样，构建 cookie 警告组件的最后一步是检查用户是否接受了\
  \ cookie 策略。我们可以通过添加 `connectedCallback()` 方法来实现，就像我们在纯 JavaScript 版本的组件中所做的那样。\n\
  \n`connectedCallback()` 方法如下所示：\n\n```\nconnectedCallback() {\nconst cookiesAccepted\
  \ = getCookie(\"cookiesAccepted\")\nif (cookiesAccepted === \"y\") {\nthis.element.style.visibility\
  \ = \"hidden\";\n}\n}\n```\n\n除了标准的 `connectedCallback()` 和 `disconnectedCallback()`\
  \ 反应之外，`Stencil` 还提供了其他几个生命周期方法：\n\n*   `connectedCallback()`：当组件被附加到 DOM 时调用。\n\
  \n*   `componentWillLoad()`：在组件第一次被附加到 DOM 后立即调用一次。\n\n*   `componentDidLoad()`：在组件加载完成且第一次\
  \ `render()` 运行后立即调用一次。\n\n*   `componentWillRender()`：在每次 `render()` 执行之前调用。\n\n\
  *   `componentDidRender()`：在每次 `render()` 执行之后调用。\n\n*   `componentWillUpdate()`：当组件即将更新时调用。\n\
  \n*   `componentDidUpdate()`：在组件更新之后调用。\n\n*   `disconnectedCallback()`：当组件从 DOM\
  \ 中移除时调用。\n\n## 结论\n\n本章通过概述 Web Components 周围不断发展的生态系统来结束本书。你了解到 Web Component\
  \ 技术的某些特性可能被视为底层特性，需要 DOM 知识和重复代码。我们在本章中探讨的库旨在简化开发体验。\n\n你探索了来自 `Polymer` 项目的 `LitElement`，并使用了其依赖于\
  \ `LitElement` 基类的开发方法。你遇到了 `Hybrids`，它提出了一种基于普通对象和纯函数的函数式方法。此外，你还应用了 `Slim` 库的极简类模型。最后，你使用了\
  \ `Stencil`，其语法介于 Angular 和 React 之间，用于生成纯 JavaScript 的 Web Components。\n\n## 问题\n\
  \n1.  为什么应该使用库来创建 Web Components？\n\n2.  `Polymer` 项目与 `LitElement` 库之间有什么关系？\n\n\
  3.  `lit-html` 库的目的是什么？\n\n4.  `LitElement` 库提供的构建 Web Components 的通用方法是什么？\n\n\
  5.  `Hybrids` 库的总体理念是什么？\n\n6.  `Stencil` 与本章分析的其他库之间的主要区别是什么？\n\n7.  `Stencil`\
  \ 提出的语法受什么启发？\n\n"
