  \n##### 示例 11.17. OzLDAP.pm\n```perl\npackage OzLDAP;\nuse strict;\nuse warnings;\n\
  use Net::LDAP;\nuse Net::LDAP::Filter;\n\nsub new {\n    my ($class, %opts) = @_;\n\
  \    my $self = {\n        server => $opts{server},\n        options => $opts{options},\n\
  \        user_error => $opts{user_error},\n    };\n    $self->{ldap} = Net::LDAP->new($self->{server},\
  \ @{$self->{options}});\n    return bless $self, $class;\n}\n\nsub bind {\n    my\
  \ ($self) = @_;\n    return $self->{ldap}->bind;\n}\n\nsub search {\n    my ($self,\
  \ $opts, %filter) = @_;\n    return $self->{ldap}->search(%opts, %filter);\n}\n\n\
  sub shift_entry {\n    my ($self, $res) = @_;\n    return $res->shift_entry;\n}\n\
  \nsub attrs {\n    my ($self, $entry, $attr) = @_;\n    my @vals = $entry->get_value($attr);\n\
  \    return $vals[0] || '';\n}\n\n1;\n```\n\n\n\n\n\n```perl\npackage OzLDAP;\n\n\
  use strict;\nuse warnings;\n\nuse Carp;\nuse Net::LDAP;\nuse Net::LDAP::Filter;\n\
  \nmy @OUTPUT_ATTRS = qw(username location haircolor\n                      telephone\
  \ email fax name);\nmy %SEARCH_ATTR = map { ($_ => 1) } qw(username location haircolor);\n\
  my %ERROR = (\n  TOOMANY => \"Cannot lookup by >1 attribute... pick one only\",\n\
  \  TOOFEW  => \"Need an attribute to search on\",\n  LDAPERR => \"LDAP error: %s\"\
  ,\n  LDAPCON => \"Can't connect to %s: %s\"\n);\nmy $LDAP_SERVER = \"whitepages\"\
  ;\nmy @LDAP_OPTS = ($LDAP_SERVER, onerror => 'die',\n                  timeout =>\
  \ 10);\nmy %SEARCH_OPTS = (base  => \"ou=People, dc=wp, dc=emerald, dc=city, dc=oz\"\
  ,\n                    scope => \"sub\", attrs => \\@OUTPUT_ATTRS);\n\nsub connect\n\
  {\n  my ($class, %opt) = @_;\n  my $error_handler = delete $opt{user_error};\n \
  \ my $self = bless { error_handler => $error_handler }, $class;\n  my $ldap = Net::LDAP->new(@LDAP_OPTS,\
  \ %opt)\n    or croak _error_message(LDAPCON => $LDAP_SERVER, $@);\n  $self->{ldap}\
  \ = $ldap;\n  $ldap->bind;\n  $self;\n}\n\nsub query\n{\n  my ($self, %query) =\
  \ @_;\n  $SEARCH_ATTR{$_} or delete $query{$_} for keys %query;\n\n  keys %query\
  \ > 1 and $self->_error('TOOMANY');\n  keys %query      or $self->_error('TOOFEW');\n\
  \  my ($filter) = map \"$_=$query{$_}\" => keys %query;\n  $self->{filter} = $filter;\n\
  \  $self->{ldap}->search(%SEARCH_OPTS,\n         filter => Net::LDAP::Filter->new(\"\
  ($filter)\"));\n}\n\nsub _error\n{\n  my $self = shift;\n  return unless my $error_handler\
  \ = $self->{error_handler};\n  $error_handler->(_error_message(@_));\n}\n\nsub attrs\n\
  {\n  my ($self, $entry) = @_;\n  $entry or return @OUTPUT_ATTRS;\n  map defined($entry->get_value($_))\n\
  \        ? $entry->get_value($_) : ''\n      => @OUTPUT_ATTRS;\n}\n\nsub _error_message\n\
  {\n  my $fmt = $ERROR{+shift};\n  sprintf $fmt, @_;\n}\n\nsub filter\n{\n  my $self\
  \ = shift;\n  $self->{filter};\n}\n\nsub AUTOLOAD\n{\n  my $self = shift;\n  our\
  \ $AUTOLOAD =~ s/.*://;\n  return if $AUTOLOAD eq 'DESTROY';\n  $self->{ldap}->$AUTOLOAD;\
  \ (@_);\n}\n\n1;\n```\n\n该模块的一些显著特征包括：\n\n- 私有子程序 `_error_message()`，用于格式化错误消息；它被我们的私有方法\
  \ `_error()` 调用，并在 `connect()` 发生问题时使用。\n- `filter()` 方法，用于获取我们喜欢的格式的过滤器文本版本（不带外部圆括号）。\n\
  - `query()` 方法接受一个名称和值对的哈希表，并仅使用有效的搜索参数；如果以后我们有理由使用多个搜索术的布尔组合，只需要修改此例程即可。\n- `AUTOLOAD()`\
  \ 例程拦截任何未定义的方法调用，并将它们委托给封装在 `OzLDAP` 对象中的 `Net::LDAP` 对象。\n\n## 11.10.1 接下来做什么？\n\
  \n在此时此刻，你可能会想到许多其他可能的更改；例如，我们确实可以向 `OzLDAP` 中添加更多方法。然而，在没有需求的情况下，并不清楚这种投入是否值得。\n\
  \n你有权在这一阶段指出，该程序的当前版本不仅比原版长，而且更复杂。这完全可以。但可读性取决于长度之外的其他因素，而且我们对 Perl 的熟悉程度超过原程序的作者。此外，在清理不清晰和有\
  \ Bug 的代码之外，我们增加了许多功能。我们制作了一个完整的模块，为代码重用提供了基础（如果需要一个 LDAP 目录来跟踪奥兹国的居民，那么它是存在的）。\n\
  \n## 12.1.1 邮件列表\n\n托管在 `perl.org` 上的每个邮件列表也双向网关到 `nntp.perl.org` 上的新闻组，这是我访问列表列表的方式。\n\
  \n## 12.1.2 新闻组\n\n主要的 Usenet 新闻组如下：\n\n- `comp.lang.perl.misc`: 用于提问的主要新闻组。\n-\
  \ `comp.lang.perl.moderated`: 一个低流量、信噪比很高的组。\n- `comp.lang.perl.modules`: 用于讨论使用和编写模块问题的低流量组。\n\
  - `comp.lang.perl.announce`: 用于新版本发布和其他重大事件的极低流量组。\n- `comp.lang.perl.tk`: 仅供 Perl\
  \ 图形界面用户使用。\n- `alt.perl`: 每天发帖不到十条，但与 `comp.lang.perl.misc` 相比专家较少。\n\n## 12.1.3\
  \ 允许用户内容的门户\n\n- `use.perl.org`: 该站点基于 Slashdot，托管了大量最新的新闻和反应。也提供免费的邮件列表。\n- `www.perlmonks.org`:\
  \ 该站点有大量访问者，并提供问答讨论和实时聊天。它是快速获取帮助和磨练帮助他人技能的绝佳场所。\n- `www.perlguru.com`: Jasmine\
  \ Merced 的网站为各种 Perl 问题提供了许多有论坛，包括职位搜索。\n\n## 12.1.4 其他网站\n\n- `www.perl.com`: O'Reilly\
  \ 的网关，包含大量关于 Perl 的当前和存档文章以及他们丰富的书籍目录。\n- `www.perl.org`: 社区的各种 Perl 事务门户。\n- `www.perldoc.com`:\
  \ 轻松访问从 5.004 以来 Perl 核心当前版本及以前版本的每份文档。\n\n\n\n\n\n*   [jobs.perl.org](http://jobs.perl.org):\
  \ 在众多 [perl.org](http://perl.org) 专门网站中值得特别提到，这个网站是寻找工作的人和寻找员工的人提供的。\n*   [learn.perl.org](http://learn.perl.org):\
  \ 同样值得关注，该网站旨在帮助人们学习 Perl。\n*   [www.stonehenge.com/merlyn/columns.html](http://www.stonehenge.com/merlyn/columns.html):\
  \ Randal Schwartz 为杂志专栏写了数百篇文章并将它们发布在网上；这个网站是宝贵且有趣示例的宝库。\n*   [perl.plover.com](http://perl.plover.com):\
  \ Mark-Jason Dominus 产出极其惊人，他在网路上发布了数百篇信息丰富的文章。其中一些（例如“处理作用域问题”）已成为回答某些常见问题的事实上标准引用。\n\
  *   [www.perlmedic.com](http://www.perlmedic.com): 本书的网站。\n\n由于 Brian Ingerson 使用\
  \ `CGI::Kwiki` 让创建 Wiki 站点变得如此简单，现在可以寻找正在涌出的 Wiki 站点。Kwiki 列表维护在 [`www.kwiki.org/index.cgi?KwikiSites`](http://www.kwiki.org/index.cgi?KwikiSites)。\n\
  \n### 12.1.5 聊天频道\n\n在几乎任何互联网中继聊天（IRC）网络上，`#perl` 都会有很多 Perl 人士，通常还有 `purl`，这是一个“机器人”或程序（适当的术语是代理），它能够回答各种问题、从对话中学习，并插进即时的评论。如果你在好奇它是用什么语言写的，那说明你没留神。\n\
  \n### 12.1.6 用户组\n\n有一个名为 Perl Mongers 的全球 Perl 用户团体，总部位于 [`www.pm.org`](http://www.pm.org)。在你离你合理距离范围内很可能有一个小组，如果没有，你可以轻松地启动一个，就像我做的那样。出版商和其他供应商为\
  \ Perl Mongers 提供特殊优惠，而且还有一套时尚的服装。`pm.org` 根据需求为小组提供 Web 服务器和邮件列表。\n\n### 12.1.7\
  \ 期刊\n\n两本专门致力于 Perl 的期刊都可以在线获取：\n\n*   The Perl Journal，[`www.tpj.com/`](http://www.tpj.com/)。每月\
  \ PDF 下载；一年订阅需 12 美元。\n*   The Perl Review，[`www.theperlreview.com/`](http://www.theperlreview.com/)。免费\
  \ PDF 下载；接受捐赠。\n\n### 12.1.8 会\n\n*   1997 年，第一届 Perl 会由 O'Reilly and Associates\
  \ 在加利福尼亚州的圣何塞举办。1999 年，开源世界的其他部分追了上来，会议扩大到包含了他们。现在，每年的开源大会包含了 Perl 会（作为其最大的组成部分），并每年夏天在北美西岸举行。详见\
  \ [`conferences.oreillynet.com/oscon/`](http://conferences.oreillynet.com/oscon/)。\n\
  \n    > ^([1]) 当时它被称为“第零次” Perl 会，因为计算机领域的人喜欢从零开始计数。后来人们认为这太困惑了，于是会议追溯性地重新编号为 1\
  \ 号。\n\n*   1999 年，一些 Perl Mongers 决定他们想要低成本的替代方案，并在卡内基·梅隆大学举办了第一届 Yet Another Perl\
  \ Conference (YAPC; [`www.yapc.org`](http://www.yapc.org))。从那以后，YAPC 扩展到了欧洲会议 ([`www.yapc.org/Europe/`](http://www.yapc.org/Europe/))，2003\
  \ 年见证了以色列的首届 YAPC ([`www.perl.org.il/YAPC/`](http://www.perl.org.il/YAPC/)) 和首届真正的加拿大\
  \ YAPC ([`www.yapc.ca/`](http://www.yapc.ca/))。原始北美 YAPC 的主页是 [`www.yapc.org/America/`](http://www.yapc.org/America/)。\n\
  \n### 12.1.9 Perl 基金会\n\n名为 Yet Another Society (YAS; [`www.yetanother.org/`](http://www.yetanother.org/))\
  \ 的非营利组织在其他项目中还推广 YAPC 活动。YAS 的附属机构是 Perl 基金会 ([`www.perl-foundation.org/`](http://www.perl-foundation.org/))，它的目的是收集捐款并资助值得的项目。当前和过去的资助者包括\
  \ Larry Wall 和 Damian Conway。如果你想捐款来促进 Perl 的进步，这里就是汇款的地方。\n\n### 12.2 Perl 人士\n\
  \nPerl 人士的关键特质之一是他们在使用语言时是多么快乐。我认为这是语言与这些人之间一种协同和共生的关系；他们创造了一种使用起来有趣的语言，吸引了喜欢乐趣的人，然后他们又向语言注入了更多乐趣。（不要认为这意味着这种语言不适用于严肃、重要的工作。Perl\
  \ 人士相信，在享受乐趣的同时可以完成更多工作。希望更多的经理能理解这一点。）参加 Perl 会议是了解 Perl 人士是什么样人的直接方式。\n\n### 12.2.1\
  \ 如何提问以获得回答\n\nPerl 人士像任何计算机专家一样，依靠准确且完整的信息生存（他们必须能够像计算机工作的方式那样思考）。他们也喜欢帮助他人。你确保他们回答你问题的最好方法是让他们能够且容易地这样做。那些对于需求模糊、或未提供足够信息来得出答案的问题会让阅读这些问题的人感到沮丧，因为他们无法提供帮助。他们还将帮助看作自己与提问者之间的协作；在免费回答问题时，他们希望推广一种“回馈”模式，使提问者自己也能被赋能去帮助他人。如果提问者似乎不愿意付出同等的努力来学习，这个目标就会破灭。\n\
  \n了解这些关于 Perl 人士思考方式的知识，允许我们设计出能得到回答的问题。（在这里我只讨论在之前列出的各种在线资源上发帖寻求免费帮助；如果你正在付费请 Perl\
  \ 顾问寻求帮助，那么你有权获得它。）遵循以下原则：\n\n*   听起来连贯。这并不意味着那些不精通发帖语言的人发布的帖子就会被轻视；我见过许多英语不流利但意图非常清晰的帖子。你需要听起来像有足够的智慧理解答案，而你的词汇是读者做出这种评估的唯一指南。你必须让自己与互联网上发布的那些听起来完全像发现了父母键盘的婴儿的人区分开来。\n\
  *   明确你想要什么。你是想要某人为你写一段代码，告诉你在你写的代码哪里错了，还是想让他们为你解释一个概念？\n*   保持谦逊。或者至少看起来那样。表现出理解任何帮助你的人都是出于慈善；不要给人你认为自己理应得到答案的印象。\n\
  *   清楚说明发生了什么。如果你遇到了一个问题，请报告你做了什么，计算机的响应是什么，以及你期望它应该是什么。除非你真的知道，否则不要对原因做假设，如果是真的，你就不是在假设。\n\
  *   提供解决问题所需的所有信息。如果 Perl 执行了你认为是错误的操作，至少你应该报告 Perl 版本以及你运行它的平台（`perl -V` 的输出就是为此目的设计的）。\n\
  *   简洁明了。如果你有一个产生错误的 1000 行程序，可能没人会为你免费阅读整个程序。将问题压缩到能够展示你问题的最小代码段。通常这个过程会让你自己发现答案。少于\
  \ 50 行的代码有很好的机会被阅读。\n\n\n\n\n\n*   表现出你想学习的意愿。说明你已经在文档的哪里查找过帮助。你尝试过 Google 搜索吗？特别要查看\
  \ [`groups.google.com/`](http://groups.google.com/)，看看是否已经有人问过相同的问题。\n\n*   如果你发现别人的代码有错误，并且认为你知道如何修复，请将修复方案发送给他们（最好采用\
  \ `diff -u` 格式）。这种行为会让你离开“提问者”类别，进入“开发者”阵营，在那里你会受到热欢迎（尤其是如果你的补丁有效的话）。\n\n在我写这一章时，我收到了一个非常棒的提问示例，我把它包含在这里，是因为其中有一个转折。首先，看这个问题：\n\
  \n> 我正在做两个幻灯片——一个是在我的个人页面上，上面有我大学聚会的照片。这个运行良好。请看这里：[URL 已删除]\n\n> 我正在使用来自 [URL]\
  \ 的一个免费 perl 软件包。\n\n> 当我尝试在 [其他网站] 上运行相同的代码时，它就挂起了，没有任何错误信息。[托管服务] 是这两个页面的提供商，但他们对个人页面和商业网站有不同的安全保护措施，而且他们真的不鼓励人们编写自己的\
  \ perl 代码，所以我先向你们请教这个问题。\n\n> 这里是挂起的那个子程序的代码和输出。\n\n> 首先，这是输出：\n\n> [调试输出大部分已删除。它提到了名为\
  \ 'this' 和 'that' 的变量] this is ..........., that is <--无法粘贴到这条消息中。\"this\" 是 4 个那样的方框，然后是一个上面带有\
  \ ~ 符号的 N，旁边是一个倒置的 ?，后面跟着另外 9 个方框。\"that\" 类似的情况，在那个奇怪的 N 之前有一个 P，在下一个方框之后有一个 s。你可以自己查看：[URL]\n\
  \n> 这里是该子程序：注意，我在里面穿插了许多 `print` 语句。\n\n> ```\n [代码已删除]\n ```\n\n注意看，这位提问者提供了完整的信息，说明她在做什么、她的代码从哪里来、运行和不运行示例的\
  \ URL、输出内容（特别注意了她无法理解的非常规字符，这些字符在读者处的显示方式可能不同），以及出现问题代码片段（未显示）。\n\n转折在于，这位提问者 Mary\
  \ Byrne 是我一个朋友的 71 岁母亲。显然，年龄并不是学习如何正确提问题的障碍，也不是学习 Perl 的障碍。\n\n## 12.3 结语\n\n总有一天，你的代码也会被别人继承。无论我们走到哪里，都会留下我们存在的痕迹：有些令人愉快，有些则不然。代码就是这样一种提醒，诚然，在宏观蓝图中，它是微不足道的。然而，可以认为没有任何行动是微小的，对你代码的判断程度可以像你创造的任何东西一样准确。我告诉我的学生，一个成功的编程项目有三个心理前提（除了他们必须具备的知识之外）：\n\
  \n*   你必须相信你能够做到。\n*   你必须尽可能做得完美。\n*   你必须在其中乐此。\n\n祝愿你的事业成功。\n\n## 附录：源代码\n\n\
  *   Tie::Array::Bounded\n*   Benchmark::TimeTick\n*   smallprofpp\n\n### Tie::Array::Bounded\n\
  \n```\npackage Tie::Array::Bounded;\n\nuse strict;\n\nuse warnings;\n\nuse Carp;\n\
  \nuse base qw(Tie::Array);\n\nour $VERSION = '0.01';\n\nsub TIEARRAY\n{\n  my ($class,\
  \ %arg) = @_;\n  my ($upper, $lower) = delete @arg{qw(upper lower)};\n  croak \"\
  Illegal arguments in tie\" if %arg;\n  $lower ||= 0;\n  croak \"No upper bound for\
  \ array\" unless $upper;\n  /\\D/ and croak \"Array bound must be integer\"\n  \
  \  for ($upper, $lower);\n  croak \"Upper bound < lower bound\" if $upper < $lower;\n\
  \  return bless { upper => $upper,\n                 lower => $lower,\n        \
  \         array => []\n               }, $class;\n}\n\nsub _bound_check\n{\n  my\
  \ ($self, $index) = @_;\n  my ($upper, $lower) = @{$self}{qw(upper lower)};\n  croak\
  \ \"Index $index out of range [$lower, $upper]\"\n    if $index < $lower || $index\
  \ > $upper;\n}\n\nsub STORE\n{\n  my ($self, $index, $value) = @_;\n  $self->_bound_check($index);\n\
  \  $self->{array}[$index] = $value;\n}\n\nsub FETCH\n{\n  my ($self, $index) = @_;\n\
  \  $self->_bound_check($index);\n  $self->{array}[$index];\n}\n\nsub FETCHSIZE\n\
  {\n  my $self = shift;\n  scalar @{$self->{array}};\n}\n\nsub STORESIZE\n{\n  my\
  \ ($self, $size) = @_;\n  $self->_bound_check($size-1);\n  $#{$self->{array}} =\
  \ $size - 1;\n}\n\n1;\n\n__END__\n```\n\n\n\n\n\n```perl\n package Benchmark::TimeTick;\n\
  \nuse 5.006;\n\nuse strict;\n\nuse warnings;\n\nuse Exporter;\n\nuse File::Basename;\n\
  \nour @ISA       = qw(Exporter);\n\nour @EXPORT_OK = qw(timetick);\n\nour $VERSION\
  \   = '0.01';\n\nmy @Tix;           # 我们存储时间刻点的地方\n\nour %Opt;          # 全局选项设置接口\n\
  \nmy $Epoch = $^T;   # 测量时间的起始点\n\nsub import\n{\n  my $class = $_[0];\n  eval {\
  \ require Time::HiRes };\n  $Epoch = _current_time() if $Opt{reset_start};\n  unless\
  \ ($Opt{suppress_initial})\n  {\n    my $prog = basename($0);\n    timetick(\"Timeticker\
  \ for $prog starting\");\n  }\n  $class->export_to_level(1, @_);\n}\n\nsub timetick\n\
  {\n  my $tag = pop;\n  $Opt{format_tick_tag} and $tag = $Opt{format_tick_tag}->($tag);\n\
  \  push @Tix, [ _current_time() - $Epoch, $tag ];\n}\n\nsub _current_time\n{\n \
  \ exists &Time::HiRes::time ? Time::HiRes::time() : time;\n}\n\nsub report\n{\n\
  \  unless ($Opt{suppress_report})\n  {\n    &{ $Opt{format_report} || \\&_format_report\
  \ }(@Tix);\n  }\n  @Tix = ();\n}\n\nsub _format_report\n{\n  printf(\"%7.4f %s\\\
  n\", @$_) for @_;\n}\n\nsub end\n{\n  unless ($Opt{suppress_final})\n  {\n    my\
  \ $prog = basename($0);\n    timetick(\"Timeticker for $prog finishing\");\n  }\n\
  \  report();\n}\n\nEND { end() }\n\n1;\n\n__END__\n```\n\n# 名称\n`Benchmark::TimeTick`\
  \ - 在程序中不同位置记录时间计数\n\n# 示例\n```perl\nuse Benchmark::TimeTick qw(timetick);\n\n#\
  \ 你的代码...\n\ntimetick(\"Starting phase three\");\n\n# 更多你的代码...\n```\n\n# 描述\n`Benchmark::TimeTick`\
  \ 提供了一种快速方便的方法来对程序进行插桩，以找出到达各个点所需的时间。只需使用该模块，并在你想标记程序中某点的时间时调用 `timetick()` 方法。当程序结束时，将输出一个报告，列出到达每个点的时间。\n\
  \n如果可用 `Time::HiRes`，则将使用 `Time::HiRes::time()` 记录，否则将使用 `time()`。（由于 `time()` 的粒度为秒，这可能没有用处。）\n\
  \n# 配置\n你可以通过包哈希 `%Benchmark::TimeTick::Opt` 自定义 `Benchmark::TimeTick` 的行为。识别的键包括：\n\
  \n- `suppress_initial`: 如果为真，则在加载模块时，不在报告中包含初始条目。\n- `suppress_final`: 如果为真，则在程序终止时，不在报告中包含结束条目。\n\
  - `reset_start`: 如果为真，则报告的所有时间相对于 `Benchmark::TimeTick` 加载的时间，而不是程序的实际开始时间。\n- `format_tick_tag`:\
  \ 如果设置，应为指向子程序的引用，该程序将接收传递给 `timetick()` 的 `$tag` 输入并返回实际的标签。\n- `format_report`:\
  \ 如果设置，应为指向子程序的引用，该程序将接收时间刻点列表作为输入进行报告。列表中的每个元素将包含时间和标签的数组引用。默认的 `format_report`\
  \ 回调为：`sub { printf(\"%7.4f %s\\n\", @_) }`\n- `suppress_report`: 如果为真，调用 `report()`时不输出报告；仅重置时间刻点列表。要使\
  \ `suppress_initial` 或 `reset_start` 生效，必须在 `use` 该模块之前设置它们。\n\n# 方法\n- `Benchmark::TimeTick::timetick($tag)`:\
  \ 记录程序此处的时间，并用字符串 `$tag` 进行标记。\n- `Benchmark::TimeTick::report()`: 输出报告（除非设置了 `suppress_report`）并重置时间刻点列表。\n\
  - `Benchmark::TimeTick::end()`: 添加一个结束刻点（除非设置了 `suppress_final`），并输出报告。在程序结束时默认调用。\n\
  \n## 可选导出\n`Benchmark::TimeTick::timetick()` 按需导出。为了简洁，建议这样做。\n\n# 示例\n```perl\n\
  \  BEGIN { $Benchmark::TimeTick::Opt{suppress_initial} = 1 }\n  use Benchmark::TimeTick\
  \ qw(timetick);\n\n  # ... 时间流\n\n  timetick(\"Phase 2\");\n\n  # ... 更多时间流，程序结束\n\
  来自 Benchmark::TimeTick 的输出:\n  0.7524 Phase 2\n  8328 Tim finishing\n\n# 作者\nPeter\
  \ Scott\n\n# 参见\n`Timer`, `Time::HiRes`。\n\n# 版权\nCopyright (c) 2004 Peter Scott.\
  \ 本库免费的；你可以按照 Perl 相同的条款重新分发或修改它。\n\n### smallprof\n```perl\n#!/usr/bin/perl\nuse\
  \ strict;\nuse warnings;\nuse Getopt::Std;\nmy $USAGE = \"Usage: $0 [-c|-w] [profile]\"\
  ;\nmy $MAXLEN = 80;\ngetopts('cw', \\%opt) or die $USAGE;\nmy $profile = shift ||\
  \ 'smallprof.out';\nopen my $fh, '<', $profile or die \"Can't open profile: $!\"\
  ;\nmy ($header, $filename, @to_sort);\nwhile (<$fh>) {\n  $header = $_ if /^\\s+count/;\n\
  \  $filename = $1 if /^\\s+Profile (.*)\\s+Page/;\n  /^\\s+(\\d+)\\s+([\\d.]+)\\\
  s+([\\d.]+:/\n    and push @to_sort, [ $2, $3, $filename ];\n}\nmy $which = $opt{c}\
  \ ? 2 : 1; # 默认时间\nmy $other = $which == 1 ? 2 : 1; # 其他时间\nprint $header,\n   \
  \   map { (my $line = $_[0]) =~ s/\\b\\s+(\\d+):.*/s;\n             my $fileline\
  \ = $_[3]:$1\";\n             if (length($fileline) + length($line) > $MAXLEN) {\n\
  \               substr($fileline, 0, length($fileline)+length($line)-$MAXLEN+3,\
  \ '...');\n             }\n             \"$line$fileline\\n\";\n      }\n      sort\
  \ { $b[$which] <=> $a[$which] || $b[$other] <=> $a[$other] } @to_sort;\n```\n\n\
  # 名称\n`smallprof` - 对 `Devel::SmallProf` 的分析数据排序\n\n# 用法\n`smallprof [-c|-w] [profile]`\n\
  \n# 描述\n`smallprof` 命令排序并输出 `Devel::SmallProf` 生成的命名文件（默认 `smallprof.out`）。页面标题将被移除且仅打印一行标题；对于从未调过的源代码行将进行输出（你可以通过在\
  \ `.smallprof` 文件中放置 `$DB::drop_zeros = 1` 语句来防止 `Devel::SmallProf` 输出它们；参见 `Devel::SmallProf`）。行将按\
  \ CPU 时间或墙钟时间的降序排序；相同项按其他时间排序。\n\n# 选项\n- `-c`: 先按 CPU 时间排序，后按墙钟时间排序。\n- `-w`: 先按墙钟时间排序，后按\
  \ CPU 时间排序。这是默认值。\n\n# 参见\n`Devel::SmallProf`.\n\n### 参考文献\n- AHO74: Aho, Alfred\
