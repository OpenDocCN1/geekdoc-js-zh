  my @lines;\n\nwhile (<>)\n{\n  push @lines, $_;\n}\n\nfor (@lines)\n{\n  # 处理 $_\n\
  } \n```\n\n这种方法有两个错误。首先，在整个流被读取之前，处理并没有开始。其次，内存被浪费了。\n\n### 6.2.9 重新造轮子 File::Find\n\
  \n这听起来像是一条公共公告。想象查尔顿·赫斯顿——或者如果你喜欢，阿拉娜——庄严地宣告道：“每年都有数百名初级程序员陷入一种陷阱。被尝试递归和文件系统遍历表面简单性的诱惑，他们编写了遍历目录树的程序甚至模块。但在过程中，发生了糟糕的事情……”\n\
  \n编写目录遍历看起来既简单又有趣。在五分钟内，人们就可以写出一个 `find()` 函数，它接受一个回调程序并对找到的每个文件进行调用。事实上，为了证明这一点，我会花五分钟写一个：\n\
  \n```\nsub find                # 不要真的用这个！\n{\n  my ($callback, @tops) = @_;\n  for\
  \ my $top (@tops)\n  {\n    _dofile($top, $callback);\n  }\n}\n\nsub _dofile\n{\n\
  \  my ($file, $callback) = @_;\n  -d $file and _dirfind($file, $callback);\n  $callback->($file);\n\
  }\n\nsub _dirfind\n{\n  my ($dir, $callback) = @_;\n  opendir my $dh, $dir or warn\
  \ \"Can't open $dir: $!\" and return;\n  while (defined(my $file = readdir $dh))\n\
  \  {\n    next if $file =~ /^\\.\\.?$/;\n    _dofile(\"$dir/$file\", $callback);\n\
  \  }\n}\n```\n\n如此快速、简单、如此错误。这种兽的阴险之处在于它起看起来有效，并且可能在你用它的每一个测试用例中都是有效的。不幸的是，除了接口缺陷（不保证遍历顺序，且某些程序员可能希望在遍历目录本身之前遍历所有子目录，反之亦然），还有可能致命的问题。之一就是对循环符号链接的处理；上述代码将一直循环，直到文件系统厌倦了生成越来越长的路径。另一个是跨文件系统的移植性。\n\
  \n\n\n\n`File::Find` 执行了其他优化并解决的问题，我在这里特意省略了；重点在于你不需要知道它们是什么，因为 `File::Find` 的作者已经为你承担了这些工作。你不需要输入之前所有的代码，只需要输入这个：\n\
  \n```\n use File::Find; \n```\n\n这对于效率、可维护性、可读性和移植性来说是一个巨大的胜利。如果你不介意去 CPAN 查看，Richard\
  \ Clamp 写了 `File::Find::Rule` ([`search.cpan.org/dist/File-Find-Rule/`](http://search.cpan.org/dist/File-Find-Rule/))这个模块使得构建文件系统遍历代码变得更容易。\n\
  \n### 6.2.10 多余的括号\n\n这非常吹牛毛，但在像这样的语句中：\n\n```\n my ($cheese) = shift;\n\nmy ($wine);\
  \ \n```\n\n括号是不必要的。只有当你声明多一个变量，或者当你需要将右侧部分放在列表上下文（list context）时，才需要它们。这种用法表明程序员可能认为\
  \ `my` 是一个函数而不是变量修饰符，因此没有意识到 `my` 某些微妙的方面，例如它独立的编译时和运行时效应。\n\n> [3] 是，我知道 `my` 被列在\
  \ `perlfunc` 中。但那里是否是合适的地方是有争议的。\n\n如果你确实有多个变量要声明，请确保你使用了括号；我曾花很长时间调试一个由以下引起引起：\n\
  \n```\n my $words, $lines = (0, 0); \n```\n\n但那是在我还没有到处使用 `strict` 之前的黑暗时代。如果我使用了\
  \ `strict`，Perl 会告诉我 `$lines` 是未定义的。\n\n### 6.2.11 多余的初始化\n\n只要我还在挑刺，哈希表（hashes）和数组会自动从空开始运行；对于聚合类型（aggregate），没有等于\
  \ `undef` 的东西。因此：\n\n```\n my @foo = ();\n\nmy %bar = (); \n```\n\n等同于：\n\n```\n\
  \ my (@foo, %bar); \n```\n\n这可能是一个小点，但当我压缩遗留代码以便看到足够的内容并更好地理解它时，节省每一行代码都有帮助。\n\n\
  ### 6.2.12 误以为 `tr` 和 `s///` 的右侧使用正则表达式\n\n这是另一个属于“完全错误”营的例子。出于某种原因，`tr`（字符转换）是一个通过\
  \ `=~` 绑定到变量的运算符，就像 `m//` 和 `s///` 运算符一样。在 Perl 发明时，字符转换在语言及其应用中的重要性比现在大得多，因此最小化它的语法是有意义的；例如，如果你在转换\
  \ `$_`，你甚至完全不需要使用 `=~`：\n\n```\n tr/a-zA-Z/n-za-mN-ZA-M/;         # rot-13 \n```\n\
  \n遗憾的是，经常看到 `tr` 与 `=~` 出一起导致一些人认为它是一个接受正则表达式的运算符，因此他们写了像这样的代码：\n\n```\n tr/[a-z]/[A-Z]/;\
  \                 # 不要使用这种\n```\n\n他们认为自己正在使用字符类来将文本转换为大写。碰巧的是，他们得到了想要的结果，却没有意识到这段代码的意思是：“将左方括号转为左方括号，将小写字母转换为大写字母，将右方括号转为右方括号。”他们做出了一个错误的假设，当他们尝试对\
  \ `tr` 进行不同的操作时就会陷入麻烦。\n\n要了解 `tr` 真正的用法，请参见 `perlop`。\n\n同样，由于替换运算符 `s///` 的第二个参数与第一个非常接近，人们有时会在那里放置正则表达式语法。这可能是无害的：\n\
  \n```\n s/\\.txt\\b/\\.doc/g     # 多余的反斜杠 \n```\n\n或者是有害的：\n\n```\n s/\\.txt\\b/\\\
  .doc\\b/g   # 多余的反斜杠和退格 \n```\n\n`s///` 的第二个参数——或者如果你愿意，称为右侧——被视为双引号字符串，它遵循与正则表达式不同的语法规则。\n\
  \n### 6.2.13 使用符号引用\n\n我在第 5.3.3 节中承诺过详细说明如何避免符号引用。第一个避免符号引用的工具是哈希表。当你看到这样的代码时：\n\
  \n```\n $bob = 42;  # Bob 的年龄\n\n$jim = 71;  # Jim 的年龄\n\n$art = 57;  # 你懂的...\n\
  \n$name = 'bob';  # 或者用其他方式设置 $name\n\n$age = $$name;  # 使用符号引用获取他们的年龄 \n```\n\n\
  这意味着程序员不知道哈希表。这很遗憾，因为很少有 Perl 程序是不能很好地利用哈希表的。在这种情况下，代码应该转换为：\n\n```\n my %age =\
  \ (bob => 42, jim => 71, art => 57);\n\nmy $name = 'bob';       # 或者用其他方式设置 $name\n\
  \nmy $age = $age{$name};\n```\n\n\n\n\n\n第 8 章 详细介绍了这一错误，但它在新手和中级用户中太普遍了，我必须在这里也提一下。如果说重新发明\
  \ `File::Find` 值得发布一次公益公告，那么重新发明 `CGI.pm` 就值得让疾病控制与中心派遣一个化学品处理小组。无数的人浪费了无法数的时间编写代码来解析向\
  \ `CGI` 脚本的表单提交。用于解码十六进制编码的代码在互联网上蔓延，就像黑死病摧毁欧洲一样。除了偶尔被那些假装知道自己在说什么的误导性旁观者推波助澜外，传播这种瘟疫毫无逻辑。\n\
  \n要正确地进行 CGI 解并非易事；Lincoln Stein 在他的 `CGI.pm` 中处理所有问题方面做得非常出色。在第 8.3.1 节 中，我将向你如何使用它。\n\
  \n## 6.2.15 返回 `undef`\n\n所有子程序都会返回某些内容，无论你是否使用它。你甚至不需要在子程序中使用 `return` 语句来实现这一点；如果\
  \ Perl 在子程序结束之前没有遇到 `return` 语句，那么子程序的值就是子程序中最后一个评估的表达式的值。\n\n我们通常会写一个子程序，其任务是从某个数据项中提取某些特征，而我们必须决定在这些特征不存在时子程序应该做什么。例如，假设我们要返回一个人的工作电话，但他们失业了。这是\
  \ Perl 的 `undef` 值的自然用法，所以你有时会看到人们这样写：\n\n```\n sub work_phone\n{\n  # ...\n  #\
  \ 没有工作电话！甚至不是自雇的...\n  return undef;\n} \n```\n\n但这是一个错误。诚然然，在像这样使用时它是有效的：\n\n```\n\
  \ $bus_fone = work_phone(...); \n```\n\n或者：\n\n```\n if (defined(work_phone(...))\
  \ \n```\n\n但如果它在列表上下文中被调用会怎样？例如：\n\n```\n push @biz_fonez, work_phone(...); \n```\n\
  \n那么该数组中将包含一个未定义的元素。更合理的做法是根本就不要向数组中推送任何东西；也就是说，`work_phone()` 在列表上下文中调用时应该返回一个空列表。“啊！”你这样说，“我知道\
  \ `wantarray()` 会告诉我在什么上下文中被调用的。”于是你写道：\n\n```\n sub work_phone\n{\n  # ...\n  #\
  \ 没有工作电话！甚至不是自雇的...\n  return wantarray ? () : undef;\n} \n```\n\n好，猜猜怎么着？那正是 `return`\
  \ 的默认参数。所以你从一开始就可以直接说：\n\n```\n return; \n```\n\n## 6.2.16 使用 `for` 代替 `foreach`\n\
  \n使用 C 语言风格的 `for` 循环遍历数组：\n\n```\n for (my $i = 0; $i <= $#array; $i++)\n{\n  #\
  \ 对 $array[$i] 执行一些事情\n} \n```\n\n这表明程序员没有意识到 `foreach` 是一个更清晰的选项：\n\n```\n foreach\
  \ my $item (@array) \n{\n  # 对 $item 执行一些事情\n} \n```\n\n也许他们知道 `foreach`，但想更改数组的每个元素，并认为\
  \ `foreach` 循环变量只是每个元素的拷贝。事实并非如此；它实际上是 `foreach` 列表中任何可写成员的别名：\n\n```\n foreach\
  \ my $item (@numbers)\n{\n  $item **= 2;     # 将其平方\n} \n```\n\n不仅如此，`foreach` 使用\
  \ `$_` 作为默认循环变量，还可以以后后缀形式使用。Perl 甚至允许你将 `for` 作为 `foreach` 的同义词（因为它可以根据看到的是列表还是用分号分隔的语句来区分）。将所有这些特征结合起来，得到了一个非常简洁的结构：\n\
  \n```\n $_ ** = 2 for @numbers;   # 数组中每个元素的平方 \n```\n\n通常情况下，`#array` 被滥用的次数比被正确使用的次数多，所以对你看到的它的每次使用都要加怀疑。\n\
  \n### 6.2.17 无用的正则表达式\n\n使用 Perl 的正则表达式引擎就像召唤精灵：你并不想为了要一瓶无糖汽水就调用那种力量。因此，使用正则表达式来测试直接的字符串相等性：\n\
  \n```\n if ($tree = ~ /^larch$/) \n```\n\n是完全必要的混淆的。如果你想测试相等性，直说就好：\n\n```\n if\
  \ ($tree eq \"larch\") \n```\n\n相反，即使有其他方案，如果使用正则表达式更清晰，也不要害怕使用它：\n\n```\n if ($tree\
  \ =~ /larch/)            # 使用正则检查子字符串...\nif (index($tree, \"larch\") >= 0)  # ...这比这个更清晰\
  \ \n```\n\n如果你需要知道子字符串匹配的位置，如果你需要从特定的偏移量开始搜索，或者性能至关重要，请使用 `index()`。([[4]](#ch06lev1sec2.html_ch06fn04))\n\
  \n> ^([4]) 好的，也许你已经注意到匹配的效果与 `eq` 的效果之间存在细微差异：正则表达式可以匹配\"带了换行符的字符串\"\n\n### 6.3\
  \ 逃离全局陷阱\n\n我读到的许多程序以几十个变量声明开头：\n\n```\n my @e1badges;\n\nmy @e2badges;\n\nmy $optemp;\n\
  \nmy $found_match = 0;\n\nmy $total1;\n\nmy $total2;\n\nmy %linecount;\n\nmy $lines_per_page;\n\
  \n# 等等\n```\n\n这只是那些足够聪明使用 `my` 的部分。这种代码难以维护，因为需要跟踪的内容太多了。`optemp` 在哪里使用了？代码的哪些部分可以使用它？你必须进行搜索才能找到这些信息。有时一个变量完全不再使用了。\n\
  \n一些形式生命周期方法的学生认为注释是解决问题的良药，越多越好。他们版本的之前的开头如下：\n\n```\n #################################\n\
  \n# 全局变量：@e1badges                             \n\n# 类型：Array                  \
  \             \n\n# 目的：从文件读取的第一组徽章               \n\n# 索引范围：0 到最后一个徽章          \
  \     #\n\n# 哨值：无                               #\n\n# 异常指示：无                  \
  \          #\n\n##########################################\n\nmy @e1badges;\n\n\
  这读起来和写起来一样痛苦。只有按行计费的人才会喜欢这种代码。\n\n\n\n\n接下来，看看是否可以通过将变量放入块（blocks）中来缩小它们的作用范围。依次查找每个变量的使用处；如果它们聚集在一个较小的区域内，说明你可能可以将该区域转换为一个子程序。然后，识别出纯粹的临时变量。如果一个变量只在几行代码中使用，且既不是输入也不是输出，那么它可能是一个合成变量。你可以根据第\
  \ 4.8.2 节中的指南将其消除，或者通过在其使用的区域周围包围一个裸块（naked block）来将其隔离。\n\n## 6.4 调试策略\n\n假设你继承了一个程序，当你尝试运行它时，它却无法工作。（我明白——这概率有多大，不是吗？但让我们假装一下。）你需要一些策略来发现并修复问题。\n\
  \n### 6.4.1 分治法\n\n最简单但最有效的技术之一是选择性地移除尽可能多的代码，直到隔离出错误消息的原因。如果你能将代码精简到一个屏幕的范围内，那么即使你找不到问题，向别人展示代码的人也有机会帮助你。\n\
  \n如果你想临时隐藏代码（也许因为你不确定它们是否被使用），你可以在程序中插入一行完全如下的内容：\n\n```perl\n __END__ \n```\n\n\
  （每边有两个下划线，且没有前导或尾随空格），其后的所有内容都将被忽略（实际上，它们可以通过 `DATA` 文件句柄进行读取——确保文件中没有已经存在 `__END__`\
  \ 或 `__DATA__` 行）。你可以将代码块在那个部分进进出出。\n\n通常，语法错误很容易定位，因为 Perl 会告诉你是哪一行发生的，或者是随后的某一行。然而，有时真正的罪魁祸首可能在很多行之前。如果你试图定位一个看起来由错误语法引起的、非常奇异的错误源头，你可以通过**二分查找（binary\
  \ chop）**的方法在文件中上下移动 `__END__` 行，并使用 perl 的 `-c` 运行时标志仅进行语法检查（见 perlrun）。\n\n要在文件的中间注释掉一个代码块，请使用第\
  \ 4.4.2 节中描述的 POD 指令。\n\n当你修改程序的工作方式时，要记住的黄金法是：\n\n一次只改一个地方！\n\n如果你在再次尝试程序之前进行了一大堆更改，你会在试图弄清楚是什么导致了新的奇怪行为时疯掉。在这里，自动化测试的重要性再次凸显出来。\n\
  \n关于如何使用 Perl 的运行时调试器的详细信息，请参阅第 9.4 节。\n\n## 第 7 章 升级（整形手术）\n\n> “当我们继承财产时，我们并不会考虑要把它扔掉，即使我们并不想要。”\n\
  \n> —马克·吐温，《来自亚瑟王宫的康涅狄格人》\n\n![graphics/ch07.gif](img/ch07.gif)\n\nPerl 一直保持着极强的向后兼容性。大多数为\
  \ Perl 4.018 编写的程序在 5.8.3 上运行情况完全相同。得益于一群被亲切地（或其他称呼）称为“向后兼容性警察”的人的狂热努力，在那十年里只进行了极少数可能改变现有代码行为的变化[¹]](#ch07.html_ch07fn01)。\n\
  \n> ^([1]) 然而，在 Perl 6 中情况将不再如此。开发者们认为，向后兼容性已经达到了极限，如果他们想在语法能力、一致性和可学习性方面实现重大突破，是时候硬着头皮做决定了。\n\
  \n这种舒适的局面（今天有多少应用程序会接受一个由它们自己 15 年前的版本编写的文件呢？）意味着，你继承的程序可能是为了一个非常古老的 Perl 版本编写的。或者，它可能是由一个只熟悉非常古老的\
  \ Perl 版本的程序员编写的，这在本质上是一样的。只要你正在迁移该程序——特别是如果你正在重写它——你就应该利用机会使用现代 Perl 中提供的省力工具。该语言已经增加了这么多功能，以至于你可能从根本上简化代码。\n\
  \n在本章中，我将向你如何判断程序的创建者是针对哪个版本的 Perl 进行编程，以及你如何通过使用更现代版本的 Perl 特来改进它。\n\n### 7.1 策略\n\
  \n该程序是针对哪个版本的 Perl 编写的？我告诉过你如何判断特定环境下特定程序在哪个版本的 Perl 下运行，但该程序可能是由某人仅使用早期版本 Perl\
  \ 提供的功能编写的。（现在仍有许多人在编写 Perl 4 代码，尽管他们的程序运行在更现代的 Perl 上。）\n\n你可以使用带有 Richard Clamp\
  \ 的 `Module::CoreList` ([`search.cpan.org/dist/Module-CoreList/`](http://search.cpan.org/dist/Module-CoreList/))\
  \ 附带的 `corelist` 程序，查询任何 Perl 版本安装了哪些模块（以及这些模块的版本）。\n\n一旦你审视了继承的程序源码并对它是针对哪个版本的\
  \ Perl 编写的有了思路，下一步是将代码升级到你正在使用的版本。在接下来的每个节中，我将告诉你如何识别针对该版本 Perl 编写的代码，以及如何将其升级。\n\
  \n### 7.2 Perl 4\n\n最容易识别的方法是缺少以下内容：\n\n*   `use`\n*   `my`\n*   `=>`\n*   引用（References）\n\
  *   对象（Objects）\n*   作为包分隔符的 `::`\n*   POD\n\n虽然 Perl 5 增加了许多许多其他东西（例如 `BEGIN` 和\
  \ `END` 块、正则表达式的 `/x` 修饰符），但上述内容将是你的标记。\n\n这种代码包含的 `eval()`、`do()`、`local()` 和类型全局变量\
  \ (`*`) 使用可能比 Perl 5 程序多得多。\n\n#### 7.2.1 升级到 Perl 4\n\n由于没有想要为此目的考虑的早期 Perl 版本，本节特留留。\n\
  \n### 7.3 Perl 5.000\n\n在这个阶段，指出每个版本的 Perl 缺少什么已经不再有用，因此从现在起，我将说明它们增加了什么。是的，这些每个主要版本都有几个子版本，但我将只考虑每个版本的最后一个版本。虽然每个\
  \ Perl 发布版本都引入了许多更改，但我只会提到在代码编写层面可见的主要特征。对于嵌入式应用程序的程序员来说，可见的内容更多。在背后还进行了许多更改；例如，Perl\
  \ 5.8.1 在每次运行之间随机化哈希元素的顺序，以防御潜在的拒绝服务攻击。\n\nPerl 5.000 显然增加了对象系统、模块、编译指令（pragmas）、词域变量和引用，仅列举几个功能。\n\
  \n#### 7.3.1 升级到 5.000\n\n添加 `use strict` 并确保所有隐式字符串的裸字都加上引号。将所有用户变量声明为词域变量（使用 `my`）。使用\
  \ `map()` 进行列表转换而不是临时数组。将符号引用转换为硬引用。\n\n\n\n\n如果程序需要一个从 Perl 源码编译的自定义 Perl 以及额外代码，请寻找执行相同任务的\
  \ CPAN 模块，或将额外代码转换为 XS 并编写一个动态加载的模块。或者，可以使用 `Inline::` 系列模块（`Inline::C`、`Inline::Java`、`Inline::Python`\
  \ 等）在 Perl 程序中直接透明地包含少量外部代码。\n\n### 7.4 Perl 5.001\n增加了 `$SIG{__DIE__}` 和 `$SIG{__WARN__}`\
  \ 处理器、闭包以及 `Exporter` 标签。\n\n#### 7.4.1 升级到 Perl 5.001\n如果应用程序花费了费常精力来确定它是否输出了警告或异常，那么使用\
  \ `$SIG{__WARN__}` 或 `$SIG{__DIE__}` 处理器可能会受益。参见 `perlvar`。如果它使用全局变量向匿名子程序传递数据，考虑将其重写为使用闭包。\n\
  \n### 7.5 Perl 5.002\n添加了子程序原型（subroutine prototypes）以及预定义变量 `$^E` 和 `$^O`。\n\n\
  #### 7.5.1 升级到 Perl 5.002\n如果应用程序运行在 VMS、`OS/2`、`Win32` 或 `MacPerl` 上，并且需要更详细的系统错误报告，除了\
  \ `$!` 外输出 `$^E`。如果程序包含纯用于检查子程序参数数量和类型的代码，使用子程序原型可能会更好（参见 `perlsub`）。然而，由于动态检查是在运行时进行的，而原型是在编译时检查的，因此如果不进行其他修改，原型可能无法作为动态检查代码的直接替换。可以考虑使用\
  \ `Params::Validate`（参见第 10.1.1 节）。\n\n### 7.6 Perl 5.003\n增加了 `IO::` 模块和 `FindBin`\
  \ 模块。这是第一个可以使用 `use <version>` 来要求运行的 perl 至少达到 `<version>` 版本的 Perl。否则，该版本的主要目的是修复\
  \ `suidperl` 程序中的一个安全漏洞。第二版《编程 Perl》（Programming Perl）[WALL96] 编写时使用的 Perl 版本。\n\
  \n#### 7.6.1 升级到 Perl 5.003\n如果程序诉诸于非常规的手段来查找自己的位置，请改用 `FindBin.pm`。\n\n### 7.7\
  \ Perl 5.004\n允许 `my` 出现在控制结构内部，例如 `while (my $x = pop)` 会创建一个作用域仅限于 `while` 循环的新词法变量。增加了使用箭头运算符来解引用子程序引用、绑定文件句柄以及\
  \ `UNIVERSAL` 方法 `can()` 和 `isa()` 的支持。正则表达式锚点 `constant` 编译指令和 `CGI.pm` 被添加到核心模块中。\n\
  \n#### 7.7.1 升级到 Perl 5.004\n当 `for`、`foreach`、`while` 或 `until` 循环使用一个在程序其他地方未使用或不应使用的词法循环变量时，你可以通过将其嵌入到循环语句中来确保其是隔离的：\n\
  \n```\n for (my $i = 0; $i < 10; $i++) { ... }\n\nforeach my $rocker (@Beatles,\
  \ @Stones) { ... }\n\nwhile (my $soda = pop) { ... } \n```\n\n如果程序使用无参数的子程序原型定义了事实上的常量，例如：\n\
  \n```\n sub avogadro () { 6.023E23 } \n```\n\n那么它们可以替换为调用 `constant` 编译指令：\n\n```\n\
  \ use constant avogadro => 6.023E23; \n```\n\n如果你觉得这种方式更有吸引力。\n\n你不太可能快速识别出一个从 `\\\
  G` 中受益的正则表达式。\n\n### 7.8 Perl 5.005\n增加了线程（Threads），但 perl 必须使用特殊选项编译才能使用它们；尽管如此，`lock`\
  \ 变成了关键字。正则表达式增加了后回顾（look-behind）、代码评估和非回溯匹配。增加了伪哈希（Pseudo-hashes，后来被遗憾了），并且 `<>`\
  \ 可以读取固定长度记录（查找 `$/` 被设置为整数的引用）。现在可以使用 `qr//` 创建编译的正则表达式对象，并且允许将 `foreach` 作为语句的后缀（例如\
  \ `$_++ for @stocks`）。增加了变量 `$^S`（在 `eval()` 块内部为真）。\n\n核心中的新模块包括 `attrs` 编译指令、用于绑定数组和哈希的基类以及\
  \ `Data::Dumper`。新的 `fields` 编译指令加上一些内部魔法，使得如果对象是“类型”，就可以捕获对无效对象属性的引用；例如，`my Kangaroo\
  \ $skippy`。\n\n#### 7.8.1 升级到 Perl 5.005\n同样，你不太可能快速发现可以使用后回顾或其他正则表达式新特性来改进的代码。如果代码中包含一个名为\
  \ `lock` 的子程序，应该将其重命名。\n\n当 `foreach` 循环包含单个语句，且循环变量是 `$_` 或仅作用于该循环的变量时，可以将其转换为后置形式：\n\
  \n```\n foreach ($text =~ /((?:\\d+\\.){3}\\d+)/g)\n\n{\n  $ip{$1}++;\n}\n```\n\n\
  ### 7.9 Perl 5.6.0\n这个版本的制备时间比大多数其他版本都长，但因为添加了太多内容。由于某些错误，一些人并不推荐这个版本。另一些人则不受影响，并好奇在吵些什么。\n\
  \n增加了词法警告（`use warnings`），以及对 Unicode 的初步支持（`use bytes`/`use utf8`）。`our` 首次出现。用户自定义属性出现，并取代了有限的\
  \ `attrs` 编译指令。增加了版本字符串，并引发了一些争议：以 `v` 开头或包含多个句点的数字会自动转换为紧凑形式。\n\n`open()` 引入了一些增强：如果文件句柄是一个未定义的变量，`open()`\
  \ 将文件句柄存储在其中，因此你可以说 `open my $fh,...`，并获得一个词法作用域的文件句柄，它在被回收时会自动关闭。`open()` 的三参数形式出现了，二进制字面量和左值子程序（lvalue\
  \ subroutines）。现在可以对子程序和数组元素调用 `exists()`，并对数组元素调用 `delete()`。\n\n#### 7.9.1 升级到\
  \ Perl 5.6.0\n移除命令行标记 `-w` 并在每个文件中添加 `use warnings` 编译指令；查找特殊变量 `$^W` 被设置为 0 的地方，并将其更改为相应警告类的\
  \ `no warnings` 编译指令。\n\n将 `use vars` 替换为 `our` 并查看它是否可以放在较小的词法作用域内。使用标量变量文件句柄（例如\
  \ `open($fh, ...)`）并在所需的最小作用范围内声明它们；如果你不需要检查其返回状态，可以移除该作用域末尾的 `close()` 语句。将 `open()`\
  \ 语句转换为三参数形式，特别是当它们之前有尝试检查文件名参数是否可能包含 shell 元字符的代码时。\n\n> 某些相当聪明的代码可能依赖于 `open()`\
  \ 的魔法行为，假设它是由熟悉其特殊能力的专家使用的。如果代码是由专家编写的，有很小的可能发生这种情况。\n\n左值子程序仍处于实验阶段。寻找机会将它们插入遗留代码中是不明智的。\n\
  \n### 7.10 Perl 5.6.1\n\n\n\n\n\nUnicode 集成方面进行了许多改进，后台修复了许多错误并让许多工作变得简单，但除了用于设置\
  \ I/O 规范的 `open` pragma 之外，核心语言没有任何新增。在 `suidperl` 和 `sperl` 程序中发现的一个重要安全漏洞已修复；详见\
  \ [`www.cpan.org/src/5.0/sperl-2000-08-05/sperl-2000-08-05.txt`](http://www.cpan.org/src/5.0/sperl-2000-08-05/sperl-2000-08-05.txt)。\n\
  \n## 7.10.1 升级到 Perl 5.6.1\n\n如果你在许多文件句柄上调用了 `binmode()`，你可能想利用 `open` pragma 在词法作用域内将其设置为默认值。更有趣的行规范是在\
  \ Perl 5.8.0 中引入的。\n\n### 7.11 Perl 5.8.0\n\n随着更深层次的 Unicode 集成，`Hash::Util` 增加了受限哈希（restricted\
  \ hashes），允许你禁止插入新键甚至更改现有键的值。`-t` 命令行标志允许污染（taint）问题从异常降级为警告。\n\n来自 CPAN 的 `Filter::Util::Call`\
  \ 和 `Filter::Simple` 模块被添加到核心中，以便你可以进行源码过滤，即在 Perl 解析器看到程序之前修改程序源码。（你可能认为这些模块会被那些将你的程序转换为空格或标点字符的新奇模块使用，但显然那样太简单了。）\n\
  \n许多其他模块被并入核心，包括 `Attribute::Handlers`、`Digest::MD5`、`libnet` 软件包、`List::Util`、`Memoize.pm`、`MIME::Base64`、`Scalar::Util`、`Storable.pm`、`Switch.pm`、`Test::More`、`Test::Simple`、`Text::Balanced`、`Tie::File`\
  \ 以及 `Time::HiRes`。\n\n引入了 `sort` pragma，允许对 `sort()` 函数的内部行为有更多控制。在达成其安全性无法完全保证的共识后，`suidperl`\
  \ 程序最终被弃用了。\n\n## 7.11.1 升级到 Perl 5.8.0\n\n如果你有一个从未通过 `-T` 命令行标志学习过处理污染问题的 CGI 程序，你可以从\
  \ `-t` 标志开始，并在所有使用污染数据的地方获得警告，这样就可以一次性修复它们。\n\n### 7.12 Perl 5.8.1\n\n使用伪哈希（pseudo-hashes）会触发警告，提示它们已废弃（并将在\
  \ Perl 5.10.0 中完全删除）。`$*` 变量（一种开启多行正则表达式匹配的古代方法）也被弃用了。\n\n## 7.12.1 升级到 Perl 5.8.1\n\
  \n如果你正在使用伪哈希，请使用其他方法，或者用以下代码包裹其使用：\n\n```\nno warnings 'deprecated'; \n```\n\n伪哈希除了在\
  \ `fields` pragma 内部使用外，几乎没有其他用途，该 pragma 将继续按照预期工作，它在后台会使用除伪哈希以外的东西。它们的主要用途是限制哈希的键，以防止意外创建新键。你可以通过核心模块\
  \ `Hash::Util` 中的 `lock_keys()` 函数利用这一功能（这正是 `fields` pragma 现在所做的）。\n\n在正则表达式上使用\
  \ `/m` 修饰符代替设置 `$*`。\n\n### 7.13 Perl 5.8.2\n\n此时，Perl 开发者的策略转变为每三个月发布一个新版本，以便错误修复能更快出现在稳定版本中。因此，尽管修复了许多错误，内部操作得到了改进，文档得到了更新，但语言本身没有显著变化。\n\
  \n### 7.14 Perl 5.8.3\n\n现在我们来到 Perl 的当前版本。引入了 `SCALAR()` 方法用于标量上下文的绑定哈希（tied hashes），并添加了一个名为\
  \ `prove` 的程序，允许在多个粒度级别上运行特定测试。\n\n## 7.14.1 升级到 Perl 5.8.3\n\n如果你确实有将绑定哈希放在标量上下文中的需求，现在可以以有意义的方式这样做了。\n\
  \n特别是在 5.8.0 和 5.8.1 版本中通过从 CPAN 集成的所有模块所能实现的范围太大，无法在此详述。为此，我需要下一章。\n\n## 第 8 章\
  \ 使用模块（基因增强）\n\n> “在申请所谓的永动装置专利的案例中，可能会要求提供一个可行的模型。”\n> —美国专利和商标局网站\n\n![graphics/ch08.jpg](img/ch08.jpg)\n\
  \n西方社会重视独立和自力更生。我最喜欢的活动之一是在野外徒足直到迷路，然后用地图和指南针找到出口。使用全球定位卫星（GPS）设备、手机或直升机并不在我的选项列表中，尽管它们可能非常高效。\n\
  \n> ^([1]) 我的妻子在这份手稿的草稿中插入了一条注释，大意是我“结婚后就不再做这种愚蠢的事情了”。走着吧……\n\n然而，在编程方面完全是另一回事。如果没有别的事可做，我可能会喜欢重新发明别人已经写过的代码。因为我已经\
  \ 20 多年没闲事了，我需要保持谨慎。\n\n### 8.1 使用 CPAN 的理由\n\n令我惊讶和失望的是人们经常浪费时间重新发明已经存在的模块。以下是他们可能的一些原因：\n\
  \n- 他们不知道有 Perl 模块，或者不知道去何处寻找。\n- 他们不信任非核心模块。\n- 寻找模块花费了太长时间。\n- 他们的管理层有禁止非核心模块的政策。\n\
  - 他们认为编写代码比学会使用它更快。\n\n让我逐一解决这些问题。\n\n### 8.1.1 是的，有代码仓库\n\n第一个问题很容易解决。确实有一个代码仓库；它被称为\
  \ Comprehensive Perl Archive，简称 CPAN；而且它像你想象的那样容易访问。为了方便，它在世界上数百台计算机上进行了复制（这种镜像结构建立于网络可靠性较低、带宽较小、机器性能较弱的时代）。结果是在任何发生第三世界大战的情况下，只要你能连接到互联网的一部分，就能访问部分的\
  \ CPAN。Elaine 的全面 FAQ 也很有读性（[`www.cpan.org/misc/cpan-faq.html`](http://www.cpan.org/misc/cpan-faq.html)）。找出如何使用\
  \ CPAN。\n\n### 8.1.2 信任 CPAN\n\n你对 CPAN 的代码有多大信任？坏消息是，CPAN 上确实几乎没有质量控制：任何人都可以上传他们想要的任何代码；唯一的中央控制是对模块命名空间的分配。有一个测试小组（参见\
  \ [`testers.cpan.org/`](http://testers.cpan.org/)），但他们只是测试模块是否能在许多不同的平台和配置下通过自身的测试。从技术上讲，有人可能会\
  \ CPAN 上放置恶意代码。\n\n> ^([2]) 你也可以通过 [search.cpan.org](http://search.cpan.org) 获取任何模块的测试结果，只需导航到模块发布的根目录，然后点击“CPAN\
  \ Testers”链接即可。参见图 8.4。\n\n\n\n\n\n`CPAN` 上代码的可靠性是一个独立的问题，但仍不是迫切的担忧。我发现我测试过的模块质量都非常高，但这并不意味着没有糟糕的\
  \ `CPAN` 模块。我建议你应用这些启发式方法来估计一个模块的谱系：\n\n* 查看在新的网站 [`cpanratings.perl.org/`](http://cpanratings.perl.org/)\
  \ 上是否有对该模块的评论。\n\n* 该模块是否由 Perl 社区的知名人物编写？如果你不认识这个名字，他们是否写过任何你熟悉的模块？（使用 [search.cpan.org](http://search.cpan.org)，点击页面顶部的作者\
  \ ID 以获取其模块列表。）在 Google 上搜索他们的姓名以及在网页页和 Usenet 文章中搜索“Perl”，看看你是否喜欢你所读到的内容。在写本文时，`CPAN`\
  \ 上列出的作者超过 2,800 名，而且有许多我未研究过的专业领域，因此在评估模块可靠性的背景下，现在提供任何形式的信誉作者列表都是极不公平的。\n\n* 该模块通过测试了吗？如果没有测试，或者无法正常与\
  \ `CPAN.pm`（或 `Module::Build`）配合工作，这些都是红旗。\n\n* 检查模块最后更新的日期；如果它在三个月内被修改过，说明作者正在对其进行定期维护，如果你有问题，比模块非常老旧时更有可能引起他们的关注。\n\
  \n* 如果该模块已经两年没有变动过，它可能已经僵死了；调查一下它是否被另一个模块取代。然而，如果它是一个简单的模块，它可能不需要频繁更改。例如，`Geography::States`\
  \ 模块包含了多个国家州名和缩写之间的映射，而这些内容并不经常改变^([[3]](#ch08lev1sec1.html_ch08fn03))\n\n    >\
  \ ^([3]) 碰巧的是，我看了 `Geography::States`，发现它还没有根据（最近！）分配的加拿大纳纳武特（Nunavut）缩写进行更新。（在该模块中对“州”的定义有点宽泛。）我通知了作者。\n\
  \n* 复杂模块通常有 `SourceForge` 项目^([[4]](#ch08lev1sec1.html_ch08fn04)，以便多人可以并发且干净地工作。该网站将是关于模块当前状态的重要信息源。\n\
  \n    > ^([4]) [`sourceforge.net/`](http://sourceforge.net/)\n\n* 在 Google 上搜索该模块的\
  \ Usenet 文章并按日期排序，查看是否有任何近期发布表示批准或其他。\n\n### 8.1.3 如何寻找 CPAN 模块\n\n像很多事情一样，如果你知道如何操作，寻找\
  \ `CPAN` 模块是非常简单的。访问 `CPAN` 最简单的方法是通过 [`search.cpan.org/`](http://search.cpan.org/)（参见图\
  \ 8.1](#ch08lev1sec1.html_ch08fig01)）。\n\n##### 图 8.1. [search.cpan.org](http://search.cpan.org)\
  \ 的首页。\n\n![graphics/08fig01.jpg](img/08fig01.jpg)\n\n如果你想了解更多关于 `CPAN` 的信息并获取数据的不同视图，可以去\
  \ [`www.cpan.org`](http://www.cpan.org) 浏览。你通过 [www.cpan.org](http://www.cpan.org)\
  \ 可以找到但通过 [search.cpan.org](http://search.cpan.org) 找不到的一种类型数据是脚本（预先编写的程序）。`search.cpan.org`\
  \ 只有模块（函数和方法的重用库）。\n\n在 [search.cpan.org](http://search.cpan.org) 上输入查询后，点击所需的命中项（图\
  \ 8.2](#ch08lev1sec1.html_ch08fig02)）将为你提供模块的文档：其 `POD` 自动渲染为 HTML（图 8.3](#ch08lev1sec1.html_ch08fig03））。点击页头中的发行链接将带你进入组成发行的文件列表（图\
  \ 8.4](#ch08lev1sec1.html_ch08fig04））；这是查找模块附带的 `README` 文件的方便方法，同时也显示了 [cpanratings.perl.org](http://cpanratings.perl.org)\
  \ 的评分。如果模块随带了任何示例，这是一种无需下载整个分发包即可检查它们的方法。该页面上的 `Download` 链接提供了指向包含该版本模块的 tar 包的直接链接；但仅在\
  \ `CPAN.pm` 对你不起作用时才使用它，因为那将是更容易安装模块的方法（参见第 8.2.1 节](#ch08lev1sec2.html_ch08lev2sec6)）。\n\
  \n##### 图 8.2. 在 [search.cpan.org](http://search.cpan.org) 上搜索的结果。\n\n![graphics/08fig02.jpg](img/08fig02.jpg)\n\
  \n##### 图 8.3. 通过 [search.cpan.org](http://search.cpan.org) 查看的模块文档。\n\n![graphics/08fig03.jpg](img/08fig03.jpg)\n\
  \n##### 图 8.4. 通过 [search.cpan.org](http://search.cpan.org) 的发行。\n\n![graphics/08fig04.jpg](img/08fig04.jpg)\n\
  \n点击页头下的 `Source` 链接将带你进入模块源代码，让你能够回答关于它如何运行的任何剩余问题。\n\n### 8.1.4 处理反 CPAN 政策\n\n\
  任何说“禁止 CPAN”的政策源于恐惧或无知。每天都有公司和政府由于 `CPAN` 损失数百万美元。如果他们担心质量控制，请指出像 `PerlTk` 和 `DBI`\
  \ 这样的模块几乎和 Perl 核心一样复杂（它们可能就不会读了）。\n\n### 8.1.5 自制还是购买？\n\n我们的最后一个担忧以一种经典问题的形式出现，这在应用于模块时带有一种特殊的色彩。我们有一种著名的低估创建代码所需时间的倾向。如果我们第一次在接口和设计决策上是正确的，没有遇到任何问题，因为代码一开始就能运行而不需要编写测试，并且可以省略文档，那么我们的进度估计可能只是过于乐观了二倍。\n\
  \n否则，除了 `CMM-SW`（软件能力成熟度模型） 5 级的少数人或个人软件生产力流程的虔诚追随者外，我们可能离目标非常远。“创建一个解析表单输入的模块——没问题！最多三四小时，”我们是认为的。这不仅是滥用自信的美德，这是在小巷里抢劫它。\n\
  \n在你决定在不从 `CPAN` 寻找等效方案的情况下自己编写模块之前，请考虑你早晚在你的模块中必须做的事情：\n\n* 为其编写文档（当然是在 `POD` 中）。\n\
  * 为维护程序员编写注释。\n* 将其移植到任何用户可能需要的平台或 Perl 版本。\n* 为用户编写回归测试。\n* 响应用户反馈和请求。\n\n只有在一种情况下，不使用已经实现你所需的\
  \ `CPAN` 模块是合理的：如果它在其他方面非常糟糕，以至于你学习其文档或绕过不必要的接口所花费的时间，比创建一个只做你想要的事情模块还要长。当然，虚假的自信让我们认为这在\
  \ 90% 的情况下都是真实的。但如果你在阅读完本章后真的认为某个特定的 `CPAN` 模块不值得投入精力，那么在决定自己动手之前的最后，请考虑是否可以通过子类化模块来消除接口问题。\n\
  \n### 8.2 使用 CPAN\n\n\n\n\n当然，你可以从 CPAN 下载模块的 tarballs（使用 `tar` 程序创建的文件树压缩存档）并手动构建它们。稍后我会向你展示如何操作。在此之前，我会先向你展示简单的方法。\n\
  \n### 8.2.1 使用 CPAN.pm\n\nPerl 通过在核心中提供一个实用的自动化层来与 CPAN 通信，使得安装大多数模块变得异常简单。这一层是由——你猜得没错——一个模块实现的，令人惊讶的是，它叫做\
  \ `CPAN.pm`。\n\n> ^([5]) 在 Perl 5.10 中，`CPAN.pm` 将被一个名为 `CPANPLUS.pm` 的模块取代，你可以在\
  \ CPAN 上找到它。`CPANPLUS.pm` 将为使用 CPAN 提供更整洁的接口。截至本文写作，它仍然处于前沿阶段，因此我在这里不再对其进行进一步介绍，但欢迎尽管尝试它。\n\
  \n使用 `CPAN.pm` 安装新模块非常简单，特别是如果你是系统管理员，或者对 perl 的 `@INC` 中想要安装新模块的目录具有写入权限。要安装一个名为\
  \ `Mac::iTunes` 的模块，只需输入：\n\n```\n % perl -MCPAN -e 'install Mac::iTunes' \n```\n\
  \n让 `CPAN.pm` 进入超级巨星行列的原因是，它可以检测并安装依赖项；当你正在安装的模块需要其他模块才能工作（`Mac::iTunes` 需要很多这样的模块），而你又还没有它们。只要模块作者正确地列出了这些先决模块（`Mac::iTunes`\
  \ 的作者确实列出了），那么 `CPAN.pm` 就会安装这些模块；如果其中任何一个模块还有未满足的先决条件，CPAN 将安装它们，依此类推。如果该依赖链中的某个模块没有正确指定其先决条件，你通常可以在第一次尝试失败后重新执行原始的\
  \ `install` 命令来绕过。\n\n如果你想使用 `CPAN.pm` 将模块安装到私有目录（可能是因为你没有管理员权限安装到编译进 perl 的 `@INC`\
  \ 中的 `site_perl` 目标中），你必须多花一点精力。`CPAN.pm` 使用一个配置文件，其中包含许多设置，例如在哪里构建下载的内容以及在哪里安装完成的模块。你需要创建一个专属于你的版本、带有特殊设置的文件。该文件需要命名为\
  \ `MyConfig.pm`，并存放在家目录下的 `.cpan/CPAN` 目录下。你可以输入以下命令让 `CPAN.pm` 为你构建此文件：\n\n```\n\
  \ % perl -MCPAN -e shell \n```\n\n并回答问题。然而，如果超级用户已经这样做，你可能会收到关于拒绝访问其 `.cpan` 目录的消息。在这种情况下，首先复制已安装\
  \ perl 部分的 `CPAN::Config` 模块以便你可以编辑它：\n\n```\n % mkdir ~/.cpan\n\n% mkdir ~/.cpan/CPAN\n\
  \n% cp `perl -MCPAN::Config -e 'print $INC{\"CPAN/Config.pm\"}'` \\\n\n     ~/.cpan/CPAN/MyConfig.pm\
  \ \n```\n\n然后编辑 `~/.cpan/CPAN/MyConfig.pm`，更改 `build_dir`、`cpan_home` 和 `keep_source_where`\
  \ 参数的路径，指向你有写入权限的目录。\n\n现在你可以在交互模式下运行 `CPAN.pm` 了：\n\n```\n % perl -MCPAN -e shell\n\
  \ncpan shell -- CPAN exploration and modules installation (v1.76)\n\nReadLine support\
  \ available \n```\n\n现在，给 CPAN shell 发一个配置命令：\n\n```\n cpan> o conf makepl_arg PREFIX=/home/peter/myperl\
  \ \n```\n\n在这种情况下，`/home/peter/myperl` 是你想要安装新模块的私有目录。（不要尝试在此路径中使用 `~`。）最后，提交配置更改（使\
  \ `makepl_arg` 的更改变为永久）并退出 CPAN shell：\n\n```\n cpan> o conf commit\n\ncommit: wrote\
  \ /home/peter/.cpan/CPAN/MyConfig.pm\n\ncpan> q\n\nLockfile removed. \n```\n\n现在你可以使用\
  \ `CPAN.pm` 构建模块了，且 `install` 命令将把安装的模块放在 `/home/peter/myperl` 下。你需要将目录 `/home/peter/myperl/lib/perl5/site_perl`\
  \ 添加到 perl 的 `@INC` 中，以便找到安装在在那里的模块。因此，一个想要使用这些模块的 Perl 程序应该应该这样开头：\n\n> ^([6])\
  \ 完整的情况要稍微复杂一些。模块不仅可以安装在 `/home/peter/myperl/lib/perl5/site_perl` 下，还可以安装在其中特定版本和架构的子目录下。那么为什么我不需要将这些目录也添加到\
  \ `@INC` 中呢？因为 Perl 的 `use lib` 语法和 `-I` 命令行选项会为我完成工作：如果通过这些操作添加到 `@INC` 的任何目录都存在特定版本或架构的子目录，它们将自动被添加到\
  \ `@INC` 中。这是避免直接修改 `@INC` 的另一个好理由。\n\n```\n use lib qw(/home/peter/myperl/lib/perl5/site_perl);\
  \ \n```\n\n因为该目录不在默认的 `@INC` 中。\n\n### 8.2.2 手动安装模块\n\n在少数情况下，`CPAN.pm` 会因为某些原因无法工作。你可能处于特殊的环境，或者该模块可能需要某些配置。`look`\
  \ 命令的手动对应操作是从 CPAN 下载模块的 tarball（`http://search.cpan.org` 上的 Download 链接），然后执行：\n\
  \n```\n % gunzip Foo-Bar.44.tar.gz\n\n% tar xf Foo-Bar.44\n\n% rm Foo-Bar.44.tar\n\
  \n% cd Foo-Bar.44\n```\n\n如果你的 tar 程序接受 `-z` ，前两个步骤可以合并。\n\n现在寻找 README 文件并仔细阅读。通常，构建模块的步骤是：\n\
  \n```\n % perl Makefile.PL\n\n% make install \n```\n\n在这种情况下，`make install` 将展开为\
  \ `make; make test; make install`，在上一步成功时才会执行下一步。\n\n既然你手动构建这个模块是因为 `CPAN.pm` 的\
  \ `install` 命令不够用，而不是出于某种让生活复杂的虐癖，你需要在这一阶段进行干预。你可能需要在运行第一个命令之前编辑 `Makefile.PL`。考虑到你可以通过第一个命令的参数设置\
  \ Makefile 中几乎所有重要的参数，很难想象在运行 make 之前会有这种情况。要了解更多这些参数，请阅读 `ExtUtils::MakeMaker`\
  \ 模块的文档。（这就是 `Makefile.PL` 用来创建 Makefile 的。）如果你是用 `CPAN.pm` 的 `look` 命令开始这个构建过程的，请记住你处于子\
  \ shell 中，你需要退出它：\n\n```\n % exit\n\ncpan> q\n\n% \n```\n\n我有时会忘记这一点，只有在一天结束注销时才发现自己仍在\
  \ CPAN.pm shell 中。\n\n### 8.2.3 PPM\n\n\n在 Windows 平台上，由于缺少 `make` 程序，`CPAN.pm`\
  \ 将无用武场。你可以获取适用于 Windows 的版本（如 `nmake` 或 `dmake`），或者在 UNIX 仿真环境（如 `Cygwin`）中获取，又你可以采取更简单的方法，使用\
  \ ActiveState 的 Windows Perl 发行版中包含的 `ppm`（Perl 软件包管理器）程序。`PPM` 只包含那些已移植到 `PPM`\
  \ 仓库的模块，因此它总是落后于 `CPAN`；但另一方面，所有的编译工作都已为你完成，因此，安装带有二进制组件的模块比在 UNIX 机器上要容易得多。这方面的一个极端极端例子是\
  \ `PerlTk`，它在 UNIX 上需要你先获取并构建底层的 `Tk` 和 `Tcl` 库，而在 Windows 上，通过一个 `PPM` `install`\
  \ 命令即可为你完成所有安装。\n\n> [7] ftp://ftp.microsoft.com/Softlib/MSLFILES/nmake15.exe\n\
  > [8] [`www.cygwin.com/`](http://www.cygwin.com/)\n> [9] 最近版本 Active Perl 中的 PPM3。\n\
  \n### 8.2.4 模块分发\n\n当你想要打包自己的模块进行分发时，如今而可能的选择是 `ExtUtils::MakeMaker`。这是一个核心模块，在你首次创建新模块时，由\
  \ `h2xs` 调用它来创建 `Makefile.PL`。\n\n然而，如果你想做比默认 `Makefile.PL` 更多的事情，你需要编辑它并插入提取自 `ExtUtils::MakeMaker`\
  \ 文档的指令。最近有些人指出，这个界面并不像他们希望的那样易用，他们已经开始开发替代方案：\n\n* Ken Williams 的 `Module::Build`\
  \ 生成一个 `Build.PL` 文件，该文件可用于在没有 `make` 工具的情况下构建分发。随着时间的推移，更多的 `CPAN` 模块将整合 `Module::Build`，而\
  \ `CPAN.pm` 和 `CPANPLUS.pm` 将升级以识别 `Build.PL` 文件（[`search.cpan.org/dist/Module-Build/`](http://search.cpan.org/dist/Module-Build/)）。\n\
  \n* 然而，`Module::Build` 解决的是用户如何安装模块，而不是开发者如何创建模块。Geoffrey Avery 在 `Extutils::ModuleMaker`\
  \ 中创建了 `h2xs` 的替代方案（[`search.cpan.org/dist/ExtUtils-ModuleMaker/`](http://search.cpan.org/dist/ExtUtils-ModuleMaker/)）。它甚至知道如何生成\
  \ `Build.PL` 文件。\n\n* Autrijus Tang 的 `PAR`（Perl 存档）可以创建封装了所有依赖的自包含可执行文件。它采用了非常复杂的代码来寻找这些依赖项，并在各种平台上运行（[`search.cpan.org/dist/PAR/`](http://search.cpan.org/dist/PAR/)）。\n\
  \n预见在未来几年里，这些模块将获得更多的关注和更广泛的使用。\n\n### 8.3 使用模块改进代码\n\n大量的遗留代码花费了许多现在存在于模块中的重复功能。当你发现可以剔除代码并转而使用一个执行相同工作的模块时，你可以大幅精简程序。这里是一些需要留意的的常见机会：\n\
  \n### 8.3.1 CGI.pm\n\n出于某种原因，大批程序员从未听说有一个模块可以实现他们需要执行的常用函数。如果你遇到一个没有使用 `CGI.pm`\
  \ 的 CGI 程序，除非它有某些特殊要求，否则请帮个忙将其转换它。`CGI.pm` 最基本且最重要的功能是返回用户为表单输入提供的值。当你看到这样的代码时：\n\
  \n```\nforeach (split /, $ENV{QUERY_STRING}) {\n  ($key, $val) = split /, 2;\n \
  \ s/%([A-Za-z0-9]{2})/pack(\"c\", $1)/ge;\n  $data{$key} = $val;\n}\n```\n你正在看的是用于解码表单输入的缺陷代码。（它可能完全一模一样。）`CGI.pm`\
  \ 让读取表单输入变得荒谬地简单。无论输入字段是什么类型，只要它的名字是例如 `myforminput`，那么你的程序可以通过以下方式检索它的值：\n\n```\n\
  use CGI qw(param);\nmy $myforminput = param('myforminput');\n```\n即使在处理名为例如 `myfileupload`\
  \ 的输入文件上传时，`CGI.pm` 也让这一切变得简单：\n\n```\nuse CGI qw(param);\nmy $upload = param('myfileupload');\n\
  \n# 使用 $upload 作为字符串，获取文件名：\nuse File::Basename;\nmy $saveto = basename($upload);\n\
  \n# 使用 $upload 作为文件句柄，获取内容：\nopen(OUT, '>', $saveto) or die $!;\nprint OUT <$upload>;\n\
  close OUT;\n```\n你可以使用 `Vars()` 方法一次获取所有参数：\n\n```\nuse CGI qw(Vars);\nmy %param\
  \ = Vars();\n```\n`CGI.pm` 也包含可以生成 HTML 的方法，但不要去使用它们；我更倾向于使用如 `HTML::Template` 这样的模板系统，这样我可以让\
  \ HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如 `HTML::Template`\
  \ 这样的模板系统，这样我可以让 HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如\
  \ `HTML::Template` 这样的模板系统，这样我可以让 HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如\
  \ `HTML::Template` 这样的模板系统，这样我可以让 HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如\
  \ `HTML::Template` 这样的模板系统，这样我可以让 HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如\
  \ `HTML::Template` 这样的模板系统，这样我可以让 HTML 处理网站的外观，而不需要任何协助。其他 `CGI.pm` 方法可以生成 HTML，但不要去使用它们；我更倾向于使用如\
