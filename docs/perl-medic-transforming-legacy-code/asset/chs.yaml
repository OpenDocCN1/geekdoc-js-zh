  \ 11.4 第 15 行中的 `$dn` 和 `$pwd` 从未被赋予过任何值，因此它们是未定义的，所以几乎可以从子程序调用中省略它们，因为未指定的值与未定义值几乎是一样的。代码现在如下：\n\
  \n##### 示例 11.5\\. dirsearch.cgi, 版本 4\n\n\n\n\n\n```perl\n1/bin/perl\n#!/usr/bin/perl\
  \ -w\n\nuse strict;\nuse Dua;\nprint \"Content-type: text/html\\n\\n\";\n\nmy @values\
  \ = split(/&/, $ENV{'QUERY_STRING'});\nmy $filter;\nforeach my $input (@values)\n\
  {\n  my ($one, $two) = split(/=/,$input);\n  $filter && do_error(\"Cannot lookup\
  \ by >1 attribute... pick one only\");\n  $filter = \"($one=$two)\";\n}\n$filter\
  \ || do_error(\"Need an attribute to search on\");\nmy $dua = Dua->new;\n$dua->settmout(10,\
  \ 0);\nunless ($dua->open(\"whitepages\", 389, $dn, $pwd))\n{\n  my $msg = \"Can't\
  \ connect to whitepages: \" . $dua->error;\n  do_email_error($msg);\n}\nmy ($scope,\
  \ $all) = (1, 0);\nmy $rdn = '@dc=oz@dc=city@dc=emerald@dc=wp@ou=People';\nmy %list\
  \ = $dua->find($rdn, $filter, $scope, $all);\nif ($dua->error)\n{\n  do_email_error($dua->error);\n\
  }\nunless (%list)\n{\n  do_error(\"No match for $filter\");\n}\nprint \"<HTML><HEAD><TITLE>Search\
  \ Results</TITLE></HEAD>\\n\";\nprint \"<BODY><H1>Results of search for $filter</H1>\\\
  n\";\nprint \"<TABLE BORDER=\\\"1\\\"><TR>\\n\";\nmy @attrs = qw(username location\
  \ haircolor\n               telephone email fax name);\nprint map \"<TH>$_</TH>\"\
  , @attrs;\nprint \"</TR>\\n\";\nforeach my $i (sort { $a <=> $b } keys %list)\n\
  {\n  my $dn = \"\\@\". join(\"\\@\", reverse(split(/,\\s*/, $list{$i})));\n  my\
  \ %attr = $dua->show($dn);\n  print \"<TR>\", map \"<TD>$attr{$_}</TD>\", @attrs;\n\
  }\nprint \"</TR></TABLE></BODY></HTML>\\n\";\n\n$dua->close;\n\nsub do_email_error\n\
  {\n  my $mess = shift;\n  do_email($mess);\n  do_error($mess);\n}\n\nsub do_error\n\
  {\n  my $mess = shift;\n  return unless $mess;\n  print \"<HTML><HEAD><TITLE>Error</TITLE></HEAD><BODY>\\\
  n\";\n  print \"<H1>Error</H1><P>$mess</P>\\n\";\n  print \"</BODY></HTML>\\n\"\
  ;\n  exit;\n}\n\nsub do_email\n{\n  my $mess = shift;\n  open MAIL, \"|/usr/lib/sendmail\
  \ -oi -t\";\n  print MAIL \"To: me\\@here\\n\";\n  print MAIL \"Subject: $0: LDAP\
  \ lookup problem\\n\";\n  print MAIL \"\\n\";\n  print MAIL \"Error in LDAP processing\
  \ in $0:\\n\\n\";\n  print MAIL \"$mess\\n\";\n  close MAIL;\n}\n```\n\n### 11.4\
  \ 迈向 21 世纪\n\n现在我们无法再忽视这样一个事实：我们正在使用一个古旧且不支持的模块（`Dua.pm`）进行 LDAP 操作，于是查询了 `Net::LDAP`\
  \ 的文档。我们逐行地将 `Dua.pm` 的调用替换为 `Net::LDAP` 的调用。这要求我们在不熟悉 `Net::LDAP` 的情况下去学习它，但这样做将带来丰厚的回报。以下是我们必须做的更改：\n\
  \n*   超时时间现在在 `new()`构造函数中指定。\n*   如果构造函数失败，它将返回 `undef`并将错误存放在 `$@` 中。\n*   登录服务器（在\
  \ LDAP 术语中称为 `binding`）是一个独立的方法调用，尽管我们建立的是匿名连接。\n*   搜索通过 `search()` 方法完成，该方法返回一个位于\
  \ `Net::LDAP::Search` 类中的结果对象。\n*   `bind()` 和 `search()` 方法返回的对象具有 `code()` 方法（该方法在发生错误时返回真）以及一个返回错误文本的\
  \ `error()` 方法。\n*   `Net::LDAP::Search` 类有一个方法 `count()`，返回找到的结果数量，以及另一个方法 `entries()`，它将所有结果作为\
  \ `Net::LDAP::Entry` 对象的列表返回。\n*   每个 `Net::LDAP::Entry` 对象都有一个 `get_value()` 方法，用于返回具命名属性的值。\n\
  *   搜索的基区分名称（DN）现在可以按照自然顺序指定，而不再像 `duaperl` 恶意要求的那样使用 `@` 分隔符的反转顺序。我们将其移动到程序开头以获得程序上的优势。\n\
  \n在此过程中，我们发现 `Dua::open()` 方法中的魔数 389 实际上是 LDAP 连接的默认端口，因此我们可以省略它。这些更改引导我们得到了：\n\
  \n##### 示例 11.6. dirsearch.cgi, Version 5\n```perl\n#!/usr/bin/perl -w\nuse strict;\n\
  use warnings;\nuse Dua;\n\nprint \"Content-type: text/html\\n\\n\";\n\nmy @values\
  \ = split(/&/, $ENV{'QUERY_STRING'});\nmy $filter;\nforeach my $input (@values)\n\
  {\n  my ($one, $two) = split(/=/,$input);\n  ... (后续代码保持不变)\n}\n```\n\n\n\n```perl\n\
  !/usr/bin/perl\n\nuse strict;\nuse warnings;\n\nuse CGI qw(param header);\nuse Net::LDAP;\n\
  \nprint header;\nmy %SEARCH_OPTS =\n    (base  => 'ou=People, dc=wp, dc=emerald,\
  \ dc=city, dc=oz',\n     scope => 'sub');\nmy $LDAP_SERVER = \"whitepages\";\nmy\
  \ @LDAP_OPTS = ($LDAP_SERVER, timeout => 10);\nmy @ATTRS = qw(username location\
  \ haircolor\n               telephone email fax name);\n\nmy $filter;\nforeach my\
  \ $input (param)\n{\n  my $value = param($input);\n  $filter and do_error(\"Cannot\
  \ lookup by >1 attribute... pick one only\");\n  $filter = \"($input=$value)\";\n\
  }\n$filter or do_error(\"Need an attribute to search on\");\n\nmy $ldap = Net::LDAP->new(@LDAP_OPTS)\n\
  \  or do_email_error(\"Can't connect to $LDAP_SERVER: $@\");\nmy $mesg = $ldap->bind;\n\
  $mesg->code and do_email_error(\"Bind error: \"\n                              \
  \  . $mesg->error);\nmy $res = $ldap->search(%SEARCH_OPTS, filter => $filter);\n\
  $res->code and do_email_error(\"Search failure: \"\n                           \
  \    . $res->error);\n\n$res->count or do_error(\"No match for $filter\");\n\nprint\
  \ \"<HTML><HEAD><TITLE>Search Results</TITLE></HEAD>\\n\";\nprint \"<BODY><H1>Results\
  \ of search for $filter</H1>\\n\";\nprint \"<TABLE BORDER=\\\"1\\\"><TR>\\n\";\n\
  print map \"<TH>$_</TH>\", @ATTRS;\nprint \"</TR>\\n\";\nforeach my $ent ($res->entries)\n\
  {\n  print \"<TR>\", map \"<TD>\" . $ent->get_value($_)\n                      \
  \      . \"</TD>\", @ATTRS;\n}\nprint \"</TR></TABLE></BODY></HTML>\\n\";\n\n$ldap->unbind;\n\
  \nsub do_email_error\n{\n  my $mess = shift;\n  do_email($mess);\n  do_error($mess);\n\
  }\n\nsub do_error\n{\n  my $mess = shift;\n  return unless $mess;\n  print \"<HTML><HEAD><TITLE>Error</TITLE></HEAD><BODY>\\\
  n\";\n  print \"<H1>Error</H1><P>$mess</P>\\n\";\n  print \"</BODY></HTML>\\n\"\
  ;\n  exit;\n}\n\nsub do_email\n{\n  my $mess = shift;\n  open MAIL, \"|/usr/lib/sendmail\
  \ -oi -t\";\n  print MAIL \"To: me\\@here\\n\";\n  print MAIL \"Subject: $0: LDAP\
  \ lookup problem\\n\";\n  print MAIL \"\\n\";\n  print MAIL \"Error in LDAP processing\
  \ in $0:\\n\\n\";\n  print MAIL \"$mess\\n\";\n  close MAIL;\n}\n```\n\n### 11.6\
  \ 有效地结合模块，第 2\n\n然而，这个版本感觉令人不满意地不足。所有的 HTML 文本看起来也像几个巨大的常量值；我们能对它们做同样的操作吗？\n\n可以的，使用\
  \ `HTML::Template`。我们可以将 HTML 拆分到单独的文件（一个用于正常输出，一个用于错误输出），这些文件现在将只包含 HTML。这将实现代码与数据的分离——这本身通常是一件好事——而且允许我们将编辑\
  \ HTML 的工作——呃，不，委派——交给别人。让我们把正常结果的 HTML 输出转移到一个名为 `output.tmpl` 的文件中：\n\n##### 示例\
  \ 11.9. output.tmpl，版本 1\n\n```html\n <HTML><HEAD><TITLE></TITLE></HEAD>\n\n <BODY>\n\
  \  <H1>Results of search for <TMPL_VAR NAME=filter></H1>\n  <TABLE BORDER=\"1\"\
  >\n   <TR>\n    <TH>username</TH>\n    <TH>location</TH>\n    <TH>haircolor</TH>\n\
  \    <TH>telephone</TH>\n    <TH>email</TH>\n    <TH>fax</TH>\n    <TH>name</TH>\n\
  \   </TR>\n   <TMPL_LOOP NAME=\"results\">\n    <TR>\n     <TD><TMPL_VAR NAME=\"\
  username\"></TD>\n     <TD><TMPL_VAR NAME=\"location\"></TD>\n     <TD><TMPL_VAR\
  \ NAME=\"haircolor\"></TD>\n     <TD><TMPL_VAR NAME=\"telephone\"></TD>\n     <TD><TMPL_VAR\
  \ NAME=\"email\"></TD>\n     <TD><TMPL_VAR NAME=\"fax\"></TD>\n     <TD><TMPL_VAR\
  \ NAME=\"name\"></TD>\n    </TR>\n   </TMPL_LOOP>\n  </TABLE>\n </BODY>\n</HTML>\n\
  ```\n\n错误文本放在名为 `error.tmpl` 的模板中：\n\n##### 示例 11.10. error.tmpl，版本 1\n\n```html\n\
  \ <HTML><HEAD><TITLE>Error</TITLE></HEAD>\n <BODY>\n  <H1>Error</H1>\n  <P><TMPL_VAR\
  \ NAME=\"reason\"></P>\n </BODY>\n</HTML>\n```\n\n为了使用这些模板，我们必须通过 `HTML::Template`\
  \ 的 `param()` 方法将所有数据打包在一起，并使用 `output()` 方法一次性输出。完整的程序（`do_error` 函数除外）如下：\n\n\
  ```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n\nuse CGI qw(param header);\n\
  use Net::LDAP;\nuse HTML::Template;\n\nprint header;\nmy %SEARCH_OPTS =\n    (base\
  \  => 'ou=People, dc=wp, dc=emerald, dc=city, dc=oz',\n     scope => 'sub');\nmy\
  \ $LDAP_SERVER = \"whitepages\";\nmy @LDAP_OPTS = ($LDAP_SERVER, timeout => 10);\n\
  my @ATTRS = qw(username location haircolor\n               telephone email fax name);\n\
  \nmy $filter;\nforeach my $input (param)\n{\n  my $value = param($input);\n  $filter\
  \ and do_error(\"Cannot lookup by >1 attribute... pick one only\");\n  $filter =\
  \ \"($input=$value)\";\n}\n$filter or do_error(\"Need an attribute to search on\"\
  );\n\nmy $ldap = Net::LDAP->new(@LDAP_OPTS)\n  or do_email_error(\"Can't connect\
  \ to $LDAP_SERVER: $@\");\nmy $mesg = $ldap->bind;\n$mesg->code and do_email_error(\"\
  Bind error: \"\n                                . $mesg->error);\nmy $res = $ldap->search(%SEARCH_OPTS,\
  \ filter => $filter);\n$res->code and do_email_error(\"Search failure: \"\n    \
  \                           . $res->error);\n\n$res->count or do_error(\"No match\
  \ for $filter\");\n\nmy $tmpl = HTML::Template->new(filename => 'output.tmpl');\n\
  my @results;\nforeach my $ent ($res->entries)\n{\n  push @results, {\n    map {\
  \ $_ => $ent->get_value($_) } @ATTRS\n  };\n}\n$tmpl->param(filter => $filter, results\
  \ => \\@results);\nprint $tmpl->output();\n\n$ldap->unbind;\n\nsub do_email_error\n\
  {\n  my $mess = shift;\n  do_email($mess);\n  do_error($mess);\n}\n\nsub do_error\n\
  {\n  my $mess = shift;\n  return unless $mess;\n  my $tmpl = HTML::Template->new(filename\
  \ => 'error.tmpl');\n  $tmpl->param(reason => $mess);\n  print $tmpl->output();\n\
  }\n\nsub do_email\n{\n  my $mess = shift;\n  open MAIL, \"|/usr/lib/sendmail -oi\
  \ -t\";\n  print MAIL \"To: me\\@here\\n\";\n  print MAIL \"Subject: $0: LDAP lookup\
  \ problem\\n\";\n  print MAIL \"\\n\";\n  print MAIL \"Error in LDAP processing\
  \ in $0:\\n\\n\";\n  print MAIL \"$mess\\n\";\n  close MAIL;\n}\n```\n\n### 11.6\
