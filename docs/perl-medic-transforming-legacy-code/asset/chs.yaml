  > [8] [`www.cygwin.com/`](http://www.cygwin.com/)\n> [9] 最近版本 Active Perl 中的 PPM3。\n\
  \n### 8.3.2 日期解析与处理\n\n许多人似乎痴迷于调用外部程序来查找日期。固，这是 shell 脚本中的做法，但我们可以在 Perl 中做得更好：\n\
  \n* 从 `localtime()` 获取秒、月份等值。\n* 使用核心 `POSIX` 模块导出的 `strftime()` 以你想要的方式格式化日期。\n\
  * 将任何格式的日期字符串转换为 UNIX 时间（自 epoch 以来的秒），使用 (CPAN) `Date::Parse` 模块。例如：\n\n```\n%\
  \ perl -MDate::Parse -le\n'print str2time(\"Thursday\")'\n1057215600\n```\n\n* 解析更多格式的日期字符串（尽管以明显的编译时间为代价），使用\
  \ (CPAN) `Date::Manip` 模块。例如：\n\n```\n% perl -MDate::Manip -le\n'print ParseDateString(\"\
  Next Wednesday\")'\n2003070900:00:00\n\n% perl -MDate::Manip -le\n'print ParseDateString(\"\
  Last Wednesday\")'\n2003070200:00:00\n```\n\n还可以使用 `Date::Manip` 执行大量操作，例如处理循环事件和查找节日日期。\n\
  * 使用 (CPAN) 模块 `Date::Calc` 对日期和时间进行计算。人生太短，不要再编写更多处理进制计算的代码。例如，计算 2003 年愚人节到加拿大日之间的天数：\n\
  \n```\n% perl -MDate::Calc=:all -le\n'print Delta_Days(2003, 4, 1, 2003, 7, 1)'\n\
  91\n```\n\n### 8.3.3 Socket.pm 和 IO::Socket\n\n自 1995 年 Graham Barr 的 `Socket.pm`\
  \ 模块进入存档以来，Perl 中的接字编程一直变得简单，自 1996 年他的 `IO::Socket` 模块出现以来更加简单。与其使用 `.ph` 文件中的常量并使用\
  \ `pack()` 和 `unpack()`，使用 `Socket.pm` 你可以轻松地从名称获取机器的 IP 地址：\n\n```\n % perl -Mstrict\
  \ -Mwarnings -MSocket -l\n\nmy $addr = gethostbyname(\"www.perlmedic.com\")\n  or\
  \ die \"Lookup failed\";\n\nprint inet_ntoa($addr);\n\n^D\n\n204.95.83.7 \n```\n\
  \n\n\n\n`IO::Socket`——特别是 `IO::Socket::INET`——为 socket 提供了面向对象的封装，使客户端/服务器编程变得轻而易举。\n\
  \n关于使用 `IO::Socket` 具体能做什么的全面介绍，请参阅 [STEIN00]。\n\n### 8.3.4 HTML 解析\n\n成千上万的人想要解析\
  \ HTML，因为他们认为这是获取他们想要执行的某种操作结果唯一方法。遗憾的是，他们通常是对的。面对现实吧，如果你想知道的是，比如你的银行余额，那么你能想到的找到它最令人恼恼的方法可能就是从连续的\
  \ HTML 表单中收集几组输入，最后从一个布局每隔几周就改变一次的标签丛中解析出那个数字。如果银行能为你提供一个像这样的这样的应用程序接口（API），那就好得了：\n\
  \n```\n$balance = get_balance($account, $PIN); \n```\n\n虽然，是的，它更有可能像这样工作：\n\n```\n\
  $acct = BankAccount->new($username, $PIN) or die ...;\n\n$balance = $acct->balance($account);\
  \ \n```\n\n但我们仍然在做梦；银行并不这样做。总有一天，银行可能会变得足够明智而提供 SOAP 接口，或者至少某种 XML API，但在那，像我这样想要自动化此任务的人必须面对某种形式的\
  \ HTML 解析。\n\n你可能没有在访问网银服务，但这对解析 HTML 任务的难易程度没有任何影响。因此，首先要找出你认为需要解析的页面创建者是否能以更易读的格式提供它们。例如，对于类似于新闻报道的内容，可能提供\
  \ RSS。^([[10]](#ch08lev1sec3.html_ch08fn10)) 如果你是 HTML 页面的创建者，当你可以通过其他方式提供该内容的接口时，就不要强迫自己解析\
  \ HTML 来提取内容。\n\n> 10 RSS 代表 RDF Site Summary；RDF 代表 Resource Description Framework（资源描述框架）。\n\
  \n如果你陷入了除了解析 HTML 外别无选择的地地，你并不孤单。所以，既然在你之前已经有很多人构建了整整队的铰接式卡车，就不要再发明轮子了。\n\n从有多少人这么做来看，用正则表达式解析\
  \ HTML 的诱惑似乎是不可抗拒的。引用 Seinfeld 的话，这并不是说这样做有问题。如果你能接受这种解析风格的风险和局限性，它确实比替代方案更简洁、易读。然而，你需要知道这些风险和局限性是什么，才能接受它们。\n\
  \n风险在于你会误标记内容的某些部分；例如，你可能正在寻找锚点标签，却意外发现了一些嵌入在注释或 JavaScript 中的标签，而这些标签与你寻找的内容无关。如果你对内容的来源足够熟悉，足以知道这种情况没有发生的可能，那么就尽管吧：\n\
  \n```\n@links = $content =~ /<A\\s+HREF\\s*=\\s*\"(.*?)\"/ig; \n```\n\n或者假设你正在扫描表单输入标签，并且你对来源足够熟悉，知道\
  \ `TYPE` 属性始终在 `NAME` 属性之前。那么你可以使用：\n\n```\n@inputs = $content =~ /<INPUT\\s+TYPE=\"\
  text\"\\s+NAME=\"(.*?)\"/ig; \n```\n\n但这些示例的注意事项列表会迅速增加——例如，我们能确定总会有闭合引号吗？浏览器可以在没有引号的情况下运行。当你感到太紧张时，就是时候调用真正的\
  \ HTML 解析器那务实的力量了，例如 `HTML::Parser`、`HTML::TreeBuilder`，或者——如果你只需要超链接——`HTML::LinkExtor`。欲了解更多，请参阅\
  \ [BURKE02]。Randal Schwartz 也在 [SCHWARTZ03b] 中指出了 `XML::Parser` 解析 HTML 的优势。\n\n\
  ### 8.3.5 URI 解析\n\n统一资源标识符（URI）是现在 99% 的世界仍然称为统一资源定位符（URL）的内容的正式技术术语。你可能需要在 URI\
  \ 上执行的常用操作包括：\n\n*   提取其中一个组件（方案、路径、服务器等）。\n*   更改这些组件中的一个。\n*   将相对 URI 转换为绝对 URI。\n\
  \n与其尝试通过正则表达式来解决这些问题，不如使用 `URI.pm` 模块，它拥有所有这些操作的方法。\n\n### 8.3.6 数据库交互\n\n真正应该使用适当数据库的模块实在太少了。每当可能存在并发访问时，特别是数据库可能是合适的，因为一个适当的关系型数据库会自动为你处理锁定并提供事务语义。使用\
  \ `DBI.pm` 以及无数 `DBD::` 家族模块中与你选择的数据库通信的那一个。MySQL 和 PostgreSQL 是两个极好的免费关系型数据库，因此采购成本不是障碍。你将不得不学习\
  \ `SQL`（除非你使用 CPAN 模块中的任何一个尝试让你免于这项任务），但它并不困难，如果你打算大量使用数据库，那么收益是完全值得的。\n\n如果并发不是问题，且你不想费力搭建数据库服务器，那么\
  \ DBM 文件比纯文本文件具有显著优势。你可以使用如 `DB_File` 等核心模块。如果你想通过自己的锁定来处理并发，可以这样做，但这很难（参见 `DB_File`\
  \ 模块文档中的“Locking: The Trouble with”）。\n\nCPAN 上有很多位于 `DBI` 之上的抽象层模块。其中值得检查的是 Michael\
  \ Schwern 的 `Class::DBI`，现在由 Tony Bowden 维护。\n\n更多参见 [DESCARTES00]。\n\n### 8.3.7\
  \ 邮件处理\n\n大量的模块可以让发送和读取邮件变得简单。对于发送邮件，Mark Overmeer 的 `Mail::Send` 非常易用（[`search.cpan.org/dist/MailTools/`](http://search.cpan.org/dist/MailTools/)）。同一个发行包还包含\
  \ `Mail::Internet`，这是一个将邮件解析为对象的模块。Mark 的 `Mail::Box` 是一个新模块，该概念扩展到了邮件文件夹。对于创建和解析带附件的消息，使用\
  \ Eryq 的 `MIME::Lite`（[`search.cpan.org/dist/MIME-Lite/`](http://search.cpan.org/dist/MIME-Lite/)），由\
  \ Yves Orton 维护。\n\n要从服务器读取邮件，使用核心模块 `Net::POP3`，或者使用 David Kernen 的 `Mail::IMAPClient`（[`search.cpan.org/dist/Mail-IMAPClient/`](http://search.cpan.org/dist/Mail-IMAPClient/)）。\n\
  \n我结合 Simon Cozens 的 `Mail::Audit`（[`search.cpan.org/dist/Mail-Audit/`](http://search.cpan.org/dist/Mail-Audit/)）和\
  \ Justin Mason 广受欢迎的 `Mail::SpAssassin`（[`www.spamassassin.org/`](http://www.spamassassin.org/)\
  \ 和 CPAN）来管理充斥在 Perl 变更日志发布了地址的人的邮箱中的垃圾邮件。\n\n\n\n\nXML 和 Perl 之间有着深厚的关联历史。在我拥有的空间内，无法详述这种关系。XML\
  \ 是一项复杂的技术，催生了许多更为复杂的技术，如 `XSL`、`SOAP`、`WSDL` 等。有许多模块可以让 XML 变得简单；特别是 `XML::Simple`、`XML::Parser`、`XML::TreeBuilder`、`XML::Writer`、`XML::SAX`、`XML::DOM`\
  \ 和 `XML::Grove`。`HTML::Parser` 具有一种 XML 解析模式，不依赖于你拥有 `XML::Parser` 所需的 `expat`\
  \ 程序。参考 Matt Sergeant 的 `AxKit` ([`axkit.org/`](http://axkit.org/))，这是一个精彩的示例，展示了在\
  \ Web 服务器上使用 XML 和 Perl 可以做多少事情。\n\n要真正探索用 Perl 和 XML 能做什么，需要一整书；请参见 [RAY02]。\n\n\
  ### 8.4 自定义 Perl\n\n在 Perl 4 那个荒蛮且无序的年代，将自定义的 C 代码集成到 Perl 中需要汗水、智慧和勇气。而在 Perl 5\
  \ 中，自定义二进制代码的动态加载速度比你说出“perldoc perlxs”还要快；在 Perl 4 中，你必须构建一个包含特的 `perl` 版本，其中包含了你想要的新代码。你需要编辑一些模板文件来加载放置在正确子目录中的新源文件，并再次从源码编译\
  \ `perl`。\n\n为了将这些以及其他自定义 perl 与未修改的、常见的或普通的 perl 隔离开，习惯上的做法是根据添加的功能给它们起不同的名称。因此，一个嵌入了\
  \ Oracle 数据库智能的 perl 将被称为 `oraperl`。一个知道如何向 X.500 目录用户代理通过轻量目录访问协议 (LDAP) 说话的 perl\
  \ 将被称为 `duaperl`。（理论上，一个同时具备这两种能力的 perl 应该被称为 `raduaperl` 或 `duaoraperl`，但我从未听说过这种情况发生。）\n\
  \n一旦 Perl 5 出现并引入了共享库（或 DLL）的动态加载，这些自定义 perl 就被扔进了历史的废料堆。遗憾的是，遗留代码可能在使用这些旧时代的遗迹；这就是为什么他们称之为“legacy（遗留）”。以下是常见自定义\
  \ perl 类型及其处理方法的指南。\n\n### 8.4.1 Btreeperl\n\n`btreeperl` 由 John Conover 编写，用于与\
  \ BSD NDBM 数据库文件进行交互。没有编写兼容模式模块，但从 Perl 5.8.0 起封装在核心中的 `NDBM_File` 模块提供了一个更整洁的 NDBM\
  \ 文件绑定接口。\n\n### 8.4.2 Cisamperl / rocisperl\n\n`Cisamperl` 由 Mathias Koerber 编写，用于访问\
  \ Informix C-ISAM 文件。不存在 DBD 模块，因为该接口未使用 SQL。最接近的兼容模式是 Philippe Chane You Kaye 的\
  \ `Isam` 模块 ([`search.cpan.org/dist/Isam/`](http://search.cpan.org/dist/Isam/))。\n\
  \n### 8.4.3 Ctreeperl\n\n`Cperl` 由 John Conover 编写，用于访问 Faircom c-tree 数据库。Robert\
  \ Eden 的 `Db::Ctree` 模块 ([`search.cpan.org/dist/Db-Ctree/`](http://search.cpan.org/dist/Db-Ctree/))\
  \ 是一个接近的面向对象的翻译。然而，没有 DBD 模块。\n\n### 8.4.4 Duaperl\n\n`Duaperl` 由 Eric Douglas 编写，通过\
  \ LDAP 访问 X.500 目录服务器（DUA 是 X.500 术语中的目录用户代理）。Stephen Pillinger 了一个 Perl 5 模块 ([`search.cpan.org/dist/Dua/`](http://search.cpan.org/dist/Dua/))，虽然没有提供精确的模拟模式（它是面向对象的），但它的方法与\
  \ `duaperl` 函数之间确实有一一的对应关系。然而，它非常老旧，不受支持，且在没有专家关注的情况下无法编译。你可以通过将程序改为使用 Graham Barr\
  \ 的 `Net::LDAP` ([`search.cpan.org/dist/perl-ldap/`](http://search.cpan.org/dist/perl-ldap/))\
  \ 来迁移到更具维护性的代码。\n\n### 8.4.5 Ingperl / sqlperl\n\n`Ingperl`（也称为 `sqlperl`）由 Ted\
  \ Lemon 编写，用于访问 Ingres 数据库。Henrik Tougaard 在 `DBD-Ingres` 分发中维护了一个模拟模块 `Ingperl`\
  \ ([`search.cpan.org/dist/DBD-Ingres/`](http://search.cpan.org/dist/DBD-Ingres/))。你可以通过将程序改为使用同一分发中的\
  \ `DBD::Ingres` 模块来迁移到更具维护性的代码。\n\n### 8.4.6 Interperl\n\n`Interperl` 由 Buzz Moschetti\
  \ 编写，用于访问 Interbase 数据库。Edwin Pratomo 的 `DBD::Interbase` ([`search.cpan.org/dist/DBD-InterBase/`](http://search.cpan.org/dist/DBD-InterBase/))\
  \ 实现了相同。没有兼容模块。\n\n### 8.4.7 Isqlperl\n\n这个由 Bill Hails 编写的模块有时被不准确地称为 `infoperl`，用于访问\
  \ Informix 数据库。从未编写过兼容模块。由 Jonathan Leffler 编写的 `DBD::Informix` 处理 Perl 5 的功能。\n\
  \n### 8.4.8 Oraperl\n\n`Oraperl` 由 Kevin Stock 编写，用于访问 Oracle 数据库。你可以使用 Tim Bunce\
  \ 的 `DBD-Oracle` 中的 `Oraperl` 模块。\n\n\n\n如果你正在为 Perl 寻找交互式开发环境（IDE），那么坏消息是这类工具并不多；不像\
  \ Java 或 C++ 等语言有那么多。这其中一个非常重要的原因是，对于 IDE 开发者来说，Perl 的静态分析相当令人难以满意，因为 Perl 程序的大部分环境在运行时是不确定的（晚绑定）。考虑到\
  \ Perl 程序不仅可以在运行时创建子程序，还可以在运行时导入新类，甚至在运行过程中修改继承层次结构，IDE 开发者发现 Perl 没有吸引力也并不意外。类浏览器为了保证可靠的准确性，必须能够在运行时更新自身，这意味着\
  \ IDE 与 Perl 运行时系统之间存在一种极其紧密的关系。大多数 Perl IDE 都由一个语法高亮编辑器、一个 Perl 调试器接口以及可能还有一个 Perl\
  \ 文档浏览器组成。你会发现，大多数顶尖开发者都会精通诸如 `vi` 或 `emacs` 这样的编辑器，这些编辑器让你可以在多个缓冲区和 shell 命令模式之间快速切换。\n\
  \n好消息是，大型项目可以使用 Perl 开发而不需要 IDE，只要程序员们同意使用相同的布局风格，并将代码复杂度达到特定的复杂程度（参见第 4.2.2 节）。如果你想要\
  \ IDE，有很多免费的工具，还有一个由 ActiveState 公司开发的、名为 `Visual Perl` 的非常强大的商业工具（参见图 9.1）。\n\n\
  ### 图 9.1. ActiveState 的 Visual Perl IDE。\n\n![graphics/09fig01.jpg](img/09fig01.jpg)\n\
  \n现在我将列出一些可以帮助你了解正尝试分析的程序的模块。\n\n### 9.1.1 YAPE::Regex::Explain\n\nJeff Pinyan 编写了这个模块，它为正则表达式提供了纯英语的解释。如果你有一些使用了超出你目前理解范围的正则表达式遗留代码，可以通过将它们传递给\
  \ `explain()` 方法，让 `YAPE::Regex::Explain` 在你理解它们时提供有用的帮助。这是一个示例：\n\n```\n % perl\
  \ -Mstrict -Mwarnings\n\nuse YAPE::Regex::Explain;\n\nmy $regex = qr/\\G([\\w-]+).+?\\\
  b/;\n\nmy $xplnr = YAPE::Regex::Explain->new($regex);\n\nprint $xplnr->explain;\n\
  \n^D\n\n正则表达式：\n\n(?-imsx:\\G([\\w-]+).+?\\b)\n\n匹配如下：\n\nNODE                 \
  \    EXPLANATION\n\n----------------------------------------------------------------------\n\
  \n(?-imsx:                 分组，但不捕获（区分大小写）\n\n                         （正常匹配 ^ 和\
  \ $）（. 不匹配\n\n                         \\n）（正常匹配空格符和 #\n\n                     \
  \    通常）：\n----------------------------------------------------------------------\n\
  \  \\G                       从上一次 m//g 停止的地方开始\n\n----------------------------------------------------------------------\n\
  \  (                        分组并捕获到 \\1:\n----------------------------------------------------------------------\n\
  \    [\\w-]+                   任何以下字符：单词字符 (a-z,\n\n                           \
  \  A-Z, 0-9, _), '-' (1 次或多次\n                             （匹配尽可能多的字符））\n----------------------------------------------------------------------\n\
  \  )                        \\1 的结束\n----------------------------------------------------------------------\n\
  \  .+?                      除 \\n 之外的任何字符（1 次或多次\n\n                           （匹配尽可能少的字符））\n\
  ----------------------------------------------------------------------\n  \\b  \
  \                     单词字符 (\\w) 与非单词字符\n                           之间的边界\n----------------------------------------------------------------------\n\
  )                        分组的结束\n----------------------------------------------------------------------\n\
  ```\n\n注意，我们需要向 `new()` 方法传递正则表达式对象或字符串，但无论哪种方式，我们需要指定正则表达式修饰符，它们必须使用 `(?:xxx-xxx)`\
  \ 标记嵌入到正则表达式中。这导致了一个有些晦涩的讨论（7 级），你在你真的对如何解释修饰符感兴趣时才需要注意。假设原始代码中的正则表达式如下所示：\n\n```\n\
  \ while ($line =~ /\\G([\\w-]+).+?\\b/csig) \n```\n\n那么为了让 `YAPE::Regex::Explain`\
  \ 解释这些修饰符，必须这样嵌入：\n\n```\n my $regex = qr/(?si:\\G([\\w-]+).+?\\b)/; \n```\n\n为什么我漏掉了\
  \ `c` 和 `g` 修饰符？因为它们只影响 `m///` 操作符的操作，而不是正则表达式本身的一部分。关于 `(?:xxx-xxx)` 的更多信息请参见 `perlre`，关于\
  \ `m///` 的更多信息请参见 `perlop`，特别是关于正则表达式的权威处理，请参见 [FRIEDL02]。\n\n### 9.1.2 Benchmark::Timer\n\
  \n这个由 Andrew Ho 编写的模块就像是你程序的秒表。你可以为代码的特定部分计时，并获得关于程序在这些部分花费了多少时间以及执行了多少次的报告。你在调用\
  \ `start()` 方法时为每个部分标记一个唯一的标签，然后在被测量的代码完成后调用 `stop()` 方法。多个代码段（或多次执行的同一代码段）可以接收相同的标签，因此合并在一起。这是一个执行了一些相对耗时操作的示例程序（向网页发送\
  \ GET 和 HEAD 请求）：\n\n#### 示例 9.1. Benchmark::Timer 演示\n\n```\n #!/usr/bin/perl\n\
  \nuse strict;\n\nuse warnings;\n\nuse Benchmark::Timer;\n\nuse LWP::Simple;\n\n\
  my $timer = Benchmark::Timer->new;\n\nmy $url = \"http://www.perlmedic.com/\";\n\
  \n$timer->start('head');\n\nhead($url);\n\n$timer->stop();\n\n$timer->start('get');\n\
  \nget($url);\n\n$timer->stop();\n\n$timer->start('head');\n\nhead($url);\n\n$timer->stop();\n\
  \n$timer->report;\n```\n\n当我们运行这个程序时，我们看到：\n\n##### 示例 . Benchmark::Time\n\n```\n\
  \ % ./timertest\n\n2 trials of head (1.192s total), 596.092ms/trial\n\n1 trial of\
  \ get (177.013ms total)\n```\n\n这表明由于某种原因，LWP::Simple 的 `head()` 函数耗时比其 `get()`\
  \ 函数长。\n\n### 9.1.3 Benchmark::TimeTick\n\n这是我为这本书编写的一个原理类似的简单小模块。它的目的是输出一个列表，显示你的程序到达你通过调用\
  \ `timetick()` 方法标记的每个点所花费的确切时间。源代码位于附录中，这里是它的文档：\n\nNAME\n\nBenchmark::TimeTick—记录程序不同位置的时间\n\
  \nSYNOPSIS\n\n```\n use Benchmark::TimeTick qw(timetick);\n\n# 你的代码...\n\ntimetick(\"\
  开始第三阶段\");\n\n# 更多你的代码... \n```\n\nDESCRIPTION\n\nBenchmark::TimeTick 提供了一种快速方便的方法来对程序进行插桩，使用模块并在你想标记点时调用\
  \ `timetick()` 方法即可。当程序结束时，将输出一份报告，给出到达每个点的时间。\n\n时间将使用 `Time::HiRes::time()` 记录（如果\
  \ `Time::HiRes`可用），否则使用 `time()`。（由于 `time()` 有秒级，这可能没用。）\n\nCONFIGURATION\n\n你可以通过包哈\
  \ `%Benchmark::TimeTick::Opt` 来自定义 Benchmark::TimeTick 的行为。识别键有：\n\nsuppress_initial\
  \ 为真，则在加载模块时不在报告中输出初始项。\n\nsuppress_final 为真，则在程序终止时不在报告中输出最终项。\n\nreset_start 为真，则报告所有时间相对于\
  \ Benchmark::TimeTick 加载的时间，而不是程序的实际开始时间。\n\n\n\n\n\n`format_tick_tag` 如果设置，则应指向一个子程序的引用，该子程序将接收\
  \ `timetick()` 的 `$tag` 作为输入，并返回实际使用的标签。这对于在每个标签上应用复杂的转换而同时保持调用代码简短非常有帮助。\n\n`format_report`\
  \ 如果设置，则应指向一个子程序的引用，该子程序将接收用于报告的时间点列表作为输入。列表的每个元素将是对包含时间和标签的数组的引用。默认的 `format_report`\
  \ 回调函数为：\n\n```\n sub { printf(\"%7.4f %s\\n\", @$_) for @_ } \n```\n\n`suppress_report`\
  \ 如果为真，则在调用 `report()` 时不输出报告；只需重置时间点列表。\n\n要使 `suppress_initial` 或 `reset_start`\
  \ 生效，必须在使用此模块之前在 `BEGIN` 块中设置它们。\n\n## METHODS\n\n`Benchmark::TimeTick::timetick($tag)`\
  \ 记录程序在此处的时间，并用字符串 `$tag` 对其进行标记。\n\n`Benchmark::TimeTick::report()` 输出报告（除非设置了\
  \ `suppress_report`）并重置时间点列表。\n\n`Benchmark::TimeTick::end()` 添加最后一个时间点（除非设置了 `suppress_final`）并输出报告。在程序结束时默认调用。\n\
  \n## OPTIONAL EXPORTS\n\n`Benchmark::TimeTick::timetick()` 将按需导出。为了简洁起见，建议这样做。\n\
  \n## EXAMPLE\n\n```\n BEGIN { $Benchmark::TimeTick::Opt{suppress_initial} = 1 }\n\
  \nuse Benchmark::TimeTick qw(timetick);\n\n# ... 时间流逝\n\ntimetick(\"Phase 2\");\n\
  \n# ... 更多流逝，程序结束 \n```\n\n来自 `Benchmark::TimeTick` 的输出：\n\n```\n 0.7524 Phase 2\n\
  \n0.8328 Timeticker for testprog finishing \n```\n\n### 9.1.4 Debug::FaultAutoBT\n\
  \nStas Bekman 编写了此模块，它会拦截原本会导致核心转储（core dump）的信号，并尝试提取并转储 gdb 回溯。如果你正在尝试调试某些 XS\
  \ 代码，请使用此模块。\n\n### 9.1.5 Devel::LeakTrace\n\n此模块由 Richard Clamp 编写，需要 Perl 5.6.0\
  \ 或更高版本，它将报告程序启动后分配但在程序通过 `END` 块时未释放的任何内存。如果它发现任何内存，可能是由于循环引用导致的，在这种情况下，解决方法是使用\
  \ Tuomas J. Lukka 的 `WeakRef` 模块 ([`search.cpan.org/dist/WeakRef/`](http://search.cpan.org/dist/WeakRef/))。\n\
  \n### 9.1.6 Module::Info\n\nMattia Barbon 维护由 Michael Schwern 创建的模块；它通过扫描模块源码来提供相关信息。某些信息可能并不完全可靠，仅仅因为解析\
  \ Perl 是极其困难的。它可以告诉你此类信息，例如模块中的 `package` 声明列表、在其中定义的子程序以及它调用的子程序。\n\n### 9.1.7\
  \ Class::Inspector\n\nAdam Kennedy 编写了此模块，它为已加载模块的反射函数提供了便利方法：源文件名、子程序和方法。\n\n###\
  \ 9.1.8 B::Xref\n\n这个由 Malcolm Beattie 编写的模块已  5.005 版本添加到 Perl 核心中。它将生成一份报告，帮助你跟踪变量和子程序的定义和引用位置。由于它像\
  \ `B::Deparse` 一样属于编译器后端，它不会实际运行你的代码。通过 `O` 前端调用它：\n\n```\n % perl -MO=Xref program\
  \ arguments... \n```\n\n随后出现的是报告，显示变量、子程序以及它们出现的行，并按文件进行分类。\n\n## 9.2 消除多余代码\n\n\
  当你面对如山般溢满编辑器的代码时，你可能需要任何帮助来判断这些代码是否都已使用。人们编写起初可能有用、但最终变得多余的代码并不罕见。因此，这里有大批量发现未使用代码的一些方法。\n\
  \n### 9.2.1 Devel::Coverage\n\nRandy J. Ray 的 `Devel::Coverage` 是一个用于代码覆盖率分析的模块；它报告程序执行期间被访问的代码行。该模块已有一段时间未更改，但截至本文写作时，它仍与\
  \ Perl 5.9.0 的开发版本兼容。\n\n`Devel::Coverage` 是一个调试器插件，这意味着它通过启用 Perl 的运行时调试器钩子来调用，这些钩子会在每个即将执行的语句上触发等。Perl\
  \ 自带的交互式命令行调试器本身就是一个调试器插件。然而，`Devel::Coverage` 响应这些钩子调用并生成数据文件。该数据文件并非供人类读取；你应该通过\
  \ `Devel::Coverage` 带的 `coverperl` 程序运行它。\n\n你可以通过在命令行中使用 `-d` 标志来调用 `Devel::Coverage`：\n\
  \n```\n % perl -d:Coverage program arguments... \n```\n\n程序将运行，并创建覆盖文件 `program.cvp`。以下是名为\
  \ `Solution.pm` 模块的 `coverperl` 输出片段：\n\n```\n 12  Solution::print\n\n        12\
  \   line 37\n\n        12   line 38\n\n        96   line 39\n\n        768  line\
  \ 40\n\n        96   line 40\n```\n\n### 9.2.2 Devel::Cover\n\nPaul Johnson 的 `Devel::Cover`\
  \ ([`search.cpan.org/dist/Devel-Cover/`](http://search.cpan.org/dist/Devel-Cover/))\
  \ 是一个更现代的模块，比 `Devel::Coverage` 多许多选项，但根据其文档，它仍处于婴儿阶段。\n\n`Devel::Cover` 附有一个名为\
  \ `cover` 的程序，可以生成数据库。选项范围太大到无法详述，但你可以运行以下命令以行行为粒度生成覆盖率报告：\n\n```\n % perl -d:Cover=-coverage,statement\
  \ program... \n```\n\n然后从创建的数据库生成可读报告。\n\n## 9.3 寻找低效代码\n\n当应用程序运行时间过长时，一种治疗方法是从寻找每个部分花费的时间开始。知道在哪里投入优化精力是关键；如果你恰好选择了一段仅消耗总时间\
  \ 1% 的代码，那么无论你如何提高它的效率，速度提升也无法超过 1%（对于严谨的人来说是 1.01%）。优化消耗运行时间 90% 的代码可以使速度提升多达 10\
  \ 倍。然而，你不应该仅凭检查来判断是哪段代码。人们在这类评估方面臭名昭著，而专家与学者之间的唯一区别在于专家知道自己不应该相信直觉。他们使用的是性能分析工具，Perl\
  \ 有两个工具：`Devel::DProf` 和 `Devel::SmallProf`。请注意，这两个模块都会不可避免地为报告的时间引入不准确性。由于它们会在\
  \ Perl 执行的每个子程序或语句运行额外的代码（并且都会调用 Perl 的内部调试钩子），经过分析的程序执行时间会比未修改的版本长。\n\n### 9.3.1\
  \ Devel::DProf\n\n`Devel::DProf` 包含在 Perl 核心中；其目的是在子程序级别显示执行分析。这意味着它将显示子程序被调用的次数以及执行它们花费的时间。类似于\
  \ `Devel::Coverage` 和 `Devel::Cover`，它作为调试器插件被调用：\n\n```\n % perl -d:DProf program\
  \ arguments... \n```\n\n\n\n\n它会将计时信息记录到文件 `tmon.out` 中，即使是对于中等复杂度的运行，该文件也可能迅速变得巨大；请从另一个窗口监控该文件的大小，并在你不喜欢它变得过大时终止运行。可以通过设置环境变量\
  \ `PERL_DPROF_OUT_FILE_NAME` 来更改文件名。\n\n`tmon.out` 文件不是供人类阅读的，你需要运行程序 `dprofpp`\
  \ 来生成报告。一如任何其他通过 `perl` 安装的 Perl 程序一样，你可以使用 `perldoc` 来查看其文档。\n\n`dprofpp` 在不带任何参数的情况下就能提供良好的输出；你可以给它几个选项来更改其默认行为。默认情况下，它只显示在每个子程序词法作用域内花费的时间，而不是在该子程序及其调用的所有子程序中花费的累计时间；但这恰恰是你需要的。\n\
  \n遗憾的是，没有办法可以将 DProf 的输出管道到 `dprofpp` 并避免创建 `tmon.out`，因为 DProf 会定期通过 `seek()` 跳转到文件开头附近。\n\
  \n### 9.3.2 Devel::SmallProf\n\nTed Ashton 的 `Devel::SmallProf` 由 Salvador Fandi–o\
  \ 维护，可以在 CPAN 获取 ([http://search.cpan.org/dist/Devel-SmallProf])。它的目的与 `Devel::DProf`\
  \ 类似，但它可以在执行行的更细粒度度上显示结果（因此称为“small”）。确保每行最多有一个语句将最大化使用该模块的收益，因此请确保先对代码进行了反混淆和美化。\n\
  \n`Devel::SmallProf` 生成一个名为 `smallprof.out` 的文件。无法让输出到其他地方，但与 `Devel::DProf` 不同，该文件的大小不取决于运行时间的长度，而是取决于源代码量，因为它包含了所有的源代码，并标注了每行被调用的次数以及执行它时消耗的墙钟时间（wall\
  \ clock time）和 CPU 时间。\n\n`smallprof.out` 文件按源代码行号排序，这并没有什么帮助；性能分析的目的是找出哪些代码运行时间最长。`Devel::SmallProf`\
  \ 文档中提供的排序命令并不如预期那样有用，因为 `smallprof.out` 包含了会干扰输出的页眉，而且在排序时文件名会与源代码行隔离开。\n\n因此，我写了一个程序，可以按\
  \ CPU 或墙钟时间进行排序，并输出源的文件名。（必须移除每行 `smallprof.out` 行末尾的原始源代码截断行，以便为文件名留出空间。）它被称为 `smallprofpp`，你可以在附录中找到它。以下是该程序按墙钟时间排序的输出前几行的示例：\n\
  \n```\n % ./smallprofpp | head -5\n\n    count tm  cpu line\n     1140 0.999952\
  \ 0.150000 /usr/lib/perl5/5.6.1/Exporter.pm:57\n      545 0.999952 0.050000 substr2:36\n\
  \        1 0.999952 0.000000 /usr/lib/perl5/site_perl/5.6.1/LWP/Simple.pm:319\n\
  \        1 0.238549 0.000000 substr2:9\n```\n\n以及按 CPU 时间排序的：\n\n```\n % ./smallprofpp\
  \ -c | head -5\n\n    count tm  cpu line\n      727 0.000000 0.360000 substr2:33\n\
  \     1140 0.999952 0.150000 /usr/lib/perl5/5.6.1/Exporter.pm:57\n      247 0.000000\
  \ 0.110000 substr2:43\n      397 0.000000 0.090000 /usr/lib/perl5/5.6.1/Exporter.pm:55\n\
  ```\n\n注意，花费墙钟时间最长的行与花费 CPU 时间最长的行之间存在显著差异。通常在寻求提高性能时，你应该先调查 CPU 消耗者；墙钟时间的过多可能是由于\
  \ I/O 或其他进程占用了关注。改进执行 I/O 花的时间是一项非常微妙的活动，即使是判断 I/O 是否是延迟的原因都有问题。\n\n### 9.3.3 优化技巧\n\
  \n如果你提高 Perl 程序速度的努力没有接近目标，有几种策略可以让你摆脱困境：\n\n- 用另一种语言重写其部分内容。在识别出某部分代码占用执行时间很大后，如果足够小，可以考虑用\
  \ C 等语言重写它。注意，如果代码只是执行文本处理，这可能会提高运行速度，因为 Perl 的工作方式类似于复杂指令集（CISC）；其操作符是由高度优化的编译代码实现的。你可以使用\
  \ `Inline` ([search.cpan.org/Inline/]) 轻松包含你的 C 代码。\n\n- 用另一种语言重写整个程序。有些应用程序这样做会更好。例如，我不会用\
  \ Perl 写窗口系统，也不会写巡航制制引导系统。如果它必须尽可能快地运行，C 是一个更好的选择。但要注意的是，许多人会说“它必须尽可能快地运行”，尽管事实并非如此。他们通常心里有一个标准，如果你能用\
  \ Perl 满足这个标准，那么如果你使用另一种语言节省了一些时间，他们会很高兴的。\n\n- 改进算法。算法通常被忽视，但它是任何程序员手中至关重要的组件。正确的算法可以决定程序是在不到一秒内完成，还是超过宇宙的寿命。\n\
  \n## 9.4 调试\n\n调试只是动态分析的一种极端情况。第三方代码可能极其复杂（你自己的代码也是如此，但你通常不会那样想，因为你熟悉它）；有时你无法判断代码某部分是如何结合的，或者它是否被调用过。代码以某种毫无意义的安排排列；如果你能看到程序在运行时实际上会去向哪里就好了了。\n\
  \n嗯，你可以做到，使用 Perl 内置的调试器。即使你并不是真的在寻找 bug，调试器的代码追踪能力也非常适合这项工作。这里不是详细介绍调试器的地方，但幸运的是你不需要详细介绍；部分命令子集就足够你完成工作了。使用调试器就像打架；它通常很快就会结束，不需要使用你训练过的许多华丽招式。\n\
  \n你通过 `-d` 命令行标志调用调试器；要么编辑程序在 shebang 行中添加 `-d`，要么通过显式调用 Perl 来运行程序：\n\n```\n %\
  \ perl -d program argument argument...\n```\n\n确保你路径中的 `perl` 与程序 shebang 行中的 `perl`\
  \ 是同一个，否则如果两者之间存在差异，你会疯的。\n\n表 9-1 中的命令将涵盖你几乎所有的调试器使用：\n\n##### 表 9-1. 基础调试命令\n\n\
  | 命令 | 说明 |\n| --- | --- |\n| `h` / `h h` | 简要 / 详细帮助（5.8.0 之前为详细 / 简要帮助） |\n| `b`\
  \ `subroutine` | 在子程序的第一个可执行语句处设置断点 |\n| `b` `line` | 为行 line 设置断点 |\n| `b` `place\
  \ condition` | 为位置（可以是行或子程序）设置断点，但仅当 Perl 表达式条件为真时触发 |\n| `C` | 继续运行直到程序结束或遇到断点\
  \ |\n| `c` `line` | 继续运行直到行 line、程序结束或更早的断点 |\n| `x` `expression` | 检查变量或表达式的值 |\n\
  | `N` | 执行当前语句，跳过从其调用的任何子程序 |\n| `S` | 执行下一个 Perl 语句，必要时将进入从当前语句调用的子程序 |\n\n\n\n\
  \n| `L` | 列出从当前行开始的代码 |\n| `R` | 执行语句直到当前子程序返回、程序结束或更早的断点 |\n| `T` | 显示堆栈跟踪 |\n\
  | `Q` | 退出 |\n\n掌握了这些命令，我们可以进行代码探险。假设你正在调试一个包含以下代码片段的程序：\n\n```\n 77 for my $url\
  \ (@url_queue)\n\n78 {\n\n79   my $res = $ua->request($url);\n\n80   summarize($res->content);\n\
  81 } \n```\n\n并且你知道每当程序访问 URL [`www.perlmedic.com/fnord.html`](http://www.perlmedic.com/fnord.html)\
  \ 时，`summarize()` 子程序中就会发生奇怪的事情。你想检查 `HTTP::Response` 对象，看看是否有任何你未察知的重定向。你在调试器下启动程序并输入：\n\
  \n```\n DB<1> b 80 $url =~ /fnord/\n\nDB<2> c \n```\n\n程序将运行，直到它获取了你感兴趣的 URL，此时你可以检查响应对象——这里是它可能性的示例：\n\
  \n```\n DB<3> x $res\n\n0  HTTP::Response=HASH(0x70f340)\n\n   '_content' => '\\\
  cF\\cN\\cO\\cR\\cD'\n\n   '_headers' => HTTP::Headers=HASH(0x70f790)\n\n      'cache-control'\
  \ => 'private,max-age=60'\n      'client-date' => 'Tue, 01 Jul 2003 01:21:55 GMT'\n\
  \      'client-peer' => '204.95.83.7:80'\n      'client-response-num' => 1\n   \
  \   'connection' => 'close'\n      'content-type' => ARRAY(0x23f470)\n         0\
  \  'text/html'\n         1  'text/html; charset=iso-8859-1'\n      'date' => 'Tue,\
  \ 01 Jul 2003 01:21:54 GMT'\n      'expires' => 'Tue, 01 Jul 2003 01:22:54 GMT'\n\
  \      'last-modified' => 'Tue, 01 Jul 2003 01:21:54 GMT'\n      'refresh' => 1800\n\
  \      'server' => 'Apache/1.3.27 (UNIX)'\n      'title' => 'This page intentionally\
  \ left blank'\n   '_msg' => 'OK... sort of...'\n   '_previous' => HTTP::Response=HASH(0x6af660)\n\
  \      '_content' => ''\n      '_headers' => HTTP::Headers=HASH(0x6af66c)\n    \
  \     'client-date' => 'Tue, 01 Jul 2003 01:21:49 GMT'\n         'client-peer' =>\
  \ '204.95.83.7:80'\n         'client-response-num' => 1\n         'connection' =>\
  \ 'close'\n         'content-length' => 0\n         'content-type' => 'text/html'\n\
  \         'date' => 'Tue, 01 Jul 2003 01:21:48 GMT'\n         'location' => 'http://www.perlmedic.com/fnord/'\n\
  \         'server' => 'Apache/1.3.27 (UNIX)'\n      '_msg' => 'Moved Temporarily'\n\
  \      '_protocol' => 'HTTP/1.1'\n      '_rc' => 302\n      '_request' => HTTP::Request=HASH(0x4a60d0)\n\
  \         '_content' => ''\n         '_headers' => HTTP::Headers=HASH(0x4a60a0)\n\
  \            'user-agent' => 'libwww-perl/5.69'\n         '_method' => 'GET'\n \
  \        '_uri' => URI::http=SCALAR(0x27e668)\n            -> 'http://www.perlmedic.com/fnord.html'\n\
  \   '_protocol' => 'HTTP/1.1'\n   '_rc' => 299\n   '_request' => HTTP::Request=HASH(0x623e40)\n\
  \      '_content' => ''\n      '_headers' => HTTP::Headers=HASH(0x68e6f4)\n    \
  \     'user-agent' => 'libwww-perl/5.69'\n      '_method' => 'GET'\n      '_uri'\
  \ => URI::http=SCALAR(0x6e55e8)\n         -> 'http://www.perlmedic.com/fnord/' \n\
  ```\n\n你可以从这里看出确实存在重定向，并发现确切返回了什么。（你可以通过 `LWP::Debug` 模块对该网页获取过程进行精细控制，但我所插图的方法适用于任何类型的对象。）然后你可以通过单步进入子程序来查看\
  \ `summarize()` 中的内容发生了什么：\n\n```\n DB<4> s\n\nmain::summarize(/home/peter/bin/url_summarizer):177:\n\
  \n    my $res = $url\n```\n\n\n\n```perl\n % perl -Mstrict -Mwarnings\n\nuse re\
