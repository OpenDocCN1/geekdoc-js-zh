  ### 关于作者\n\n![peter.gif](img/peter.gif)\n\nPETER J. SCOTT 主 Pacific Design Technologies，提供\
  \ Perl 培训、应用程序开发和企业级系统分析。他曾在 2002 年 Perl 游轮和 YAPC::Canada 上担任演讲者，并创立了当地的 Monger\
  \ 小组。他自 1981 年起担任软件开发人员，自 1992 年起担任 Perl 开发者，还为 NASA 喷气实验室开发过程序。Scott 毕业于英国剑桥大学获得计算机科学硕士学位，现住在西北地区与他的妻子\
  \ Grace、一只猫和一只鹦鹉住在一起，其中至少一个也会使用 Perl。他是《Perl 调试》的主作者。\n\n\n\n\n\n# ActiveState 第二次\n\
