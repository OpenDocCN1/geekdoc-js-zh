  \ 使程序成熟，第 1\n\n我们满意了吗？不！这个程序仍然由于信息的重复而显得脆弱：模板中包含了包含了属性列表，两次，我们的程序也是如此，而且它们必须保持相同的顺序。如果属性列表发生变化，我们将不得不更新三个地方。此外，我们的\
  \ CGI 参数解析循环盲目接受它看到的第一个参数，并假设它是搜索术语。未来的输入变化可能会传入其他类型的参数，然后我们就会抓到错误的参数。这种变化可能是意外发生的：有人可能使用某种\
  \ HTML 编辑器为提交按钮赋予了 `NAME` 属性，然后我们就会接收到按钮点击的输入参数。\n\n让模板使用程序中的属性列表，同时指定哪些属性是搜索参数。结果模板现在在任何有属性列表的地方都需要一个循环，并变为：\n\
  \n##### 示例 11.12. output.tmpl，版本 2\n\n\n\n\n\n```html\n <HTML><HEAD><TITLE>Search\
  \ Results</TITLE></HEAD>\n\n <BODY>\n\n  <H1>Results of search for <TMPL_VAR NAME=filter></H1>\n\
  \n  <TABLE BORDER=\"1\">\n\n   <TR>\n\n    <TMPL_LOOP NAME=\"attributes\">\n   \
  \  <TH><TMPL_VAR NAME=\"attribute\"></TH>\n    </TMPL_LOOP>\n   </TR>\n\n   <TMPL_LOOP\
  \ NAME=\"results\">\n    <TR>\n     <TMPL_LOOP NAME=\"attributes\">\n     <TD><TMPL_VAR\
  \ NAME=\"attribute\"></TD>\n     </TMPL_LOOP>\n    </TR>\n   </TMPL_LOOP>\n\n  </TABLE>\n\
  \n </BODY>\n\n</HTML> \n```\n\n既然话说到这，这个程序已经很久没有进行污染检查（taint checking）了，因此我们在 shebang\
  \ 行中添加了 `-T` 命令行标记。这要求我们对可能用于打开文件等潜在危险操作的输入进行去污（untain）。然而，这些输入仅将用于 LDAP 搜索，因此为了程序运行它们不需要去污；但这一系列思考让我们处于审慎的状态；是否可能存在某种恶意或无意的输入会导致\
  \ LDAP 搜索失败？\n\n从过滤器（LDAP 术语，指“搜索查询”）的构建方式可以明显看出，包含右括号的值会导致问题，因为过滤器看起来在那个点就结束了，并且包含了多余的字符。这足以让我们思考还有哪些字符可能会导致问题，于是我们查阅\
  \ `Net::LDAP` 文档来寻找答案。在列表中找到 `Net::LDAP::Filter` 模块后，我们看到文档引用了该主题的权威参考资料——意见请求（RFC）：[`www.ietf.org/rfc/rfc2254.txt`](http://www.ietf.org/rfc/rfc2254.txt)。它告诉我们，这些字符必须通过十六进制编码在过滤器值中转义：`(`、`))`、`*`、`\\\
  `、`NUL`。\n\n然而，在使用替换运算符之前，我们应该偷懒看看是否已经有人为我们完成了这项工作……确实如此（“他们”指的是 Graham Barr），已经完成了。在\
  \ `Net::LDAP::Filter` 中，该模块的文档说明：“. . .让你可以直接操作 LDAP 过滤器，而不必担心字符串表示以及所有相关的转义机制。”而\
  \ `Net::LDAP` 的 `search()` 方法的文档——在我们在使用之前应该会仔细研读的，对吧？——显示过滤器参数可以是文本，也可以是一个 `Net::LDAP::Filter`\
  \ 对象。因此，我们所做的是将过滤器文本封装在 `Net::LDAP::Filter` 构造函数内部，生成的对象就可以代替过滤器文本，而无需担心转义那些顽的字符。\n\
  \n这些文档阅读还向我们揭示了其他事情：`Net::LDAP` 类支持一个名为 `onerror` 的选项，它会影响 `Net::LDAP` 函数出现问题时的处理结果。目前的代码费力地检查每次方法调用后，`Net::LDAP`\
  \ 对象的 `code()` 方法是否返回了非零值（表示错误）。或者真的如此吗？考虑到 `entries()` 方法涉及到与服务器的往返，它难道不是一个潜在的故障点吗？\n\
  \n既然既然我们可以直接使用 `onerror` 来确保任何问题都能报告给“警察”，何必费劲检查呢；在这种情况下，“警察”将是一个异常处理器：\n\n#####\
  \ 示例 11.13. dirsearch.cgi, 版本 8\n\n```\n 1  #!/usr/bin/perl -T\n\n2  use strict;\n\
  3  use warnings;\n4\n\n5  use CGI qw(param header);\n6  use Net::LDAP;\n7  use Net::LDAP::Filter;\n\
  8  use HTML::Template;\n\n9\n10 my %SEARCH_OPTS =\n11    (base  => 'ou=People, dc=wp,\
  \ dc=emerald, dc=city, dc=oz',\n12     scope => 'sub');\n13 my $LDAP_SERVER = \"\
  whitepages\";\n14 my @LDAP_OPTS = ($LDAP_SERVER, timeout => 10, onerror => 'die');\n\
  15 my @OUTPUT_ATTRS = qw(username location haircolor\n16                       telephone\
  \ email fax name);\n17 my %SEARCH_ATTR = map { ($_ => 1) }\n18                 \
  \      qw(username location haircolor);\n19\n20 my $filter;\n21 foreach my $input\
  \ (param)\n22 {\n23   next unless $SEARCH_ATTR{$input};\n24   my ($value) = param($input);\n\
  25   $filter and do_error(\"Cannot lookup by >1 attribute... pick one only\");\n\
  26   $filter = \"($input=$value)\";\n27 }\n28 $filter or do_error(\"Need an attribute\
  \ to search on\");\n29\n30 my $ldap = Net::LDAP->new(@LDAP_OPTS)\n31   or do_email_error(\"\
  Can't connect to $LDAP_SERVER: $@\");\n32 eval\n33 {\n34   $ldap->bind;\n35   my\
  \ $res = $ldap->search(%SEARCH_OPTS,\n36              filter => Net::LDAP::Filter->new($filter));\n\
  37\n38   $res->count or do_error(\"No match for $filter\");\n39\n40   my $tem =\
  \ HTML::Template->new(filename => \"results.tmpl\");\n41   my @results;\n42   foreach\
  \ my $ent ($res->entries)\n43   {\n44     foreach my $attr (@OUTPUT_ATTRS) {\n45\
  \       my $val = $ent->get($attr);\n46       push @results, $val // '';\n47   \
  \  }\n48   }\n49\n50   print $tem->output(results => @results);\n51 }\n52 or do_email_error(\"\
  LDAP error: $@\");\n```\n\n### 11.8 让程序成熟，部分 2\n\n现在我们顺得水了！为什么要直接通过 sendmail 发送邮件呢，CPAN\
  \ 给了我们 `Mail::Send`（由 Tim Bunce 和 Graham Barr 开发，由 Mark Overmeer 维护）。同时，我们将地址信息移动到程序的开头以便于配置：\n\
  \n```\n %ERR_ARGS = (Subject => \"$0: LDAP problem\",\n                     To \
  \     => 'me@here');\n\n.\n\nsub send_email\n{\n  require Mail::Send;\n  my $sender\
  \ = Mail::Send->new(%ERR_ARGS);\n  my $fh = $sender->open;\n  print $fh <<\"EOM\"\
  ;\nError in LDAP processing in $0:\n@_\nEOM\n  $fh->close();\n}\n```\n\n我们 `require`\
  \ `Mail::Send` 是为了在运行时加载它，因为只有在特殊情况下才需要，没必要每次都用 `use` 加载。我们也给这个子程序起了一个比 `do_email()`\
  \ 更合适的名字。\n\n### 11.9 程序健壮性\n\n既然我们在提高程序的可维护性，何不考虑未来可能需要处理带有逻辑运算符的多个搜索项呢？因此，我们可以读取所有的输入项，目前强制要求哈希仅包含一个键值对。（我们还应该为这些错误添加测试；目前我将这些留给读者作为练习题。）\n\
  \n我们需要考虑目录中某个属性值可能未设置的情况，因此我们希望避免出现使用未初始化值的警告。最后，由于我们很谨慎，让我们通过 `shift_entry()` 逐获取\
  \ `NET::LDAP::Entry` 对象，这样就不用一次性在内存中形成所有对象的列表了。这不会占用更多的代码。\n\n\n\n\n\n```\n 1  #!/usr/bin/perl\
  \ -T\n\n2  use strict;\n\n3  use warnings;\n\n4\n\n5  use CGI qw(header param);\n\
  \n6  use HTML::Template;\n7  use Net::LDAP;\n8  use Net::LDAP::Filter;\n\n9\n\n\
  10 my @OUTPUT_ATTRS = qw(username location haircolor\n\n11                     \
  \  telephone email fax name);\n12 my %SEARCH_ATTRS = map { ($_ => 1) }\n13     \
  \                   qw(username location haircolor);\n14 my $OUTPUT_TEMPLATE = \"\
  output.tmpl\";\n15 my $ERROR_TEMPLATE  = \"error.tmpl\";\n\n16\n\n17 my $LDAP_SERVER\
  \ = \"whitepages\";\n18 my @LDAP_OPTS = ($LDAP_SERVER, onerror => 'die', timeout\
  \ => 10);\n\n19\n\n20 my %ERROR = (\n\n21  TOOMANY => \"Cannot lookup by >1 attribute...\
  \ pick one only\",\n22  TOOFEW  => \"Need an attribute to search on\",\n23  LDAPCON\
  \ => \"Can't connect to %s: %s\",\n24  LDAPERR => \"LDAP error: %s\",\n25  NOMATCH\
  \ => \"No match for %s\",\n26             );\n27 my %ERR_MAIL_ARGS = (Subject =>\
  \ \"$0: LDAP lookup problem\",\n28                      To      => 'me@here');\n\
  29 my %SEARCH_OPTS =\n30    (base  => \"ou=People, dc=wp, dc=emerald, dc=city, dc=oz\"\
  ,\n31     scope => \"sub\", attrs => \\@OUTPUT_ATTRS);\n\n32\n\n33 my $query = map\
  \  { ($_ => param($_)  }\n34             grep { defined(param($_) } keys %SEARCH_ATTRS;\n\
  35 keys %query > 1 and error('TOOMANY');\n36 keys %query      or error('TOOFEW');\n\
  \n37\n\n38 my $ldap = Net::LDAP->new(@LDAP_OPTIONS)\n39   or do_email_error(LDAPCON\
  \ => $LDAP_SERVER, $@);\n\n40\n\n41 eval\n42 {\n43   $ldap->bind;\n44   my ($filter)\
  \ = map \"$_=$query{$_}\" => keys %query;\n45   my $res = $ldap->search(%SEARCH_OPTS,\
  \ filter =>\n46                    Net::LDAP::Filter->new(\"($filter)\"));\n47 \
  \  $res->count or error(NOMATCH => $filter);\n\n48\n\n49   my $tem = HTML::Template->new(filename\
  \ =>\n50                                 $OUTPUT_TEMPLATE);\n51   my @results;\n\
  52   while (my $entry = $res->shift_entry)\n53   {\n54     my @data;\n55     for\
  \ my $attr (@OUTPUT_ATTRS)\n56     {\n57       my $val = $entry->get_value($attr);\n\
  58       push @data, { attribute => defined($val) ? $val : '' };\n59     }\n60 \
  \    push @results, { attributes => \\@data };\n61   }\n62   $tem->param(results\
  \    => \\@results,\n63               filter     => $filter,\n64               attributes\
  \ => [ map +{ (attribute => $_) } => @OUTPUT_ATTRS ]\n65      );\n66   print header,\
  \ $tem->output;\n67 };\n68 do_email_error(LDAPERR => $@) if $@;\n\n69\n\n70 sub\
