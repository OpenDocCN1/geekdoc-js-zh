  \ 1 and error('TOOMANY');\n36 keys %query      or error('TOOFEW');\n\n37\n\n38 my\
  \ $ldap = OzLDAP->new(@LDAP_OPTIONS)\n39   or do_email_error(LDAPCON => $LDAP_SERVER,\
