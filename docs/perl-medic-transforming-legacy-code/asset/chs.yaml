  \ 行。为什么？因为它们处理用户错误，而我们希望这些错误消息由输出模板的人控制。通过使用 `<TMPL_IF>` 标签在循环中至少有一个项目时才为真，我们可以在\
  \ `output.tmpl` 中处理相同的情况：\n\n##### 示例 11.15. output.tmpl，版本 3\n\n```\n <HTML><HEAD>\n\
  \n <TITLE>\n  <TMPL_IF NAME=\"results\">\n   搜索结果\n  <TMPL_ELSE>\n   错误\n  </TMPL_IF>\n\
  \ </TITLE>\n</HEAD>\n\n <BODY>\n  <TMPL_IF NAME=\"results\">\n   <H1>针对 <TMPL_VAR\
  \ NAME=\"filter\"> 的搜索结果</H1>\n   <TABLE BORDER=\"1\">\n    <TR>\n     <TMPL_LOOP\
  \ NAME=\"attributes\">\n      <TH><TMPL_VAR NAME=\"attribute\"></TH>\n      </TMPL_LOOP>\n\
  \     </TR>\n     <TMPL_LOOP NAME=\"data\">\n      <TD><TMPL_VAR NAME=\"value\"\
  ></TD>\n      </TMPL_LOOP>\n    </TABLE>\n  </TMPL_IF>\n </BODY>\n</HTML>\n```\n\
  \n### 1.10 修改\n\n我们完成了吗？然而，注意我们在第 18 行中将回调函数作为 `error` 参数传递给新对象的构造函数。此举目的是处理错误；我们希望用户犯的任何错误由我们的\
  \ `error()` 程序处理，而不是 OzLDAP。说到这里，这就是模块：\n\n### 1.11 高级功能\n\n我们将尽可能进行抽象。为了避免与 `Net::LDAP`\
  \ 方法混淆，我们将创建一个对象。该对象将处理连接到服务器、绑定以及查询。它还将提供一个获取条目属性的方法。这将使主程序更容易理解。程序现在所示：\n\n#####\
  \ 示例 11.16. dir.cgi，版本 10\n\n```\n 1  #!/usr/bin/perl -T\n\n2  use strict;\n\n3\
