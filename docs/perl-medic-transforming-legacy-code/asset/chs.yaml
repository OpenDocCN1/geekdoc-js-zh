  \n# 第 10 章 增加可维护性（预防）\n\n> Tara King 看到 Steed 玩一架玩具飞机时说：“你玩这种东西不是不太大了吗？” Steed 回道：“这是送给我外甥的十岁生日的礼物。”\
  \ Tara 问：“那是时候的事？” Steed 说：“三年前了。那些说明书很难读懂。”\n> —Patrick Macnee 和 Linda Thorson\
  \ 选《复仇者》\n\n![graphics/ch10.gif](img/ch10.gif)\n\n在接手了一个程序并使其成为你自己的之后，你最不希望的就是它变成你最初所承担的那种“信天翁（负担）”。因此，你的任务就是尽可能地提高它的可维护性。\n\
  \n## 10.1 使其变得健壮\n\n程序越健壮，就越不容易引起人的关注并引发维护需求。以下是一些可以帮助完成这项任务的模块。\n\n### 10.1.1 Params::Validate\n\
  \n那些在 C、Java 和 Pascal 等其他过程化语言中编程过的人，经常会好奇 Perl 中真正的子程序原型（prototypes）在哪里。他们心里一直有一种挥之不去的感觉：除非对所有参数都像其他这些语言那样严格地进行验证，否则子程序是不安全的。`Params::Validate`\
  \ 正好实现了他们想要的，而且做得更多。\n\n> [1] 尽管是在运行时，而不是编译时。抱歉。Perl 6 将具有完全的编译时参数检查。\n\n如果你打算对参数进行严格限制，你会发现自己有这种挥之不去的感觉：除非对所有参数都像其他语言那样严格地进行验证，否则子程序是不安全的。`Params::Validate`\
  \ 正好实现了他们想要的，而且做得更多。\n\n\n\n如果给定的条件为假，断言将导致一个异常。如果你写过类似下面的代码：\n\n```\n die \"This\
  \ shouldn't happen!!!\" if ... \n```\n\n那么它读起来会更像是一个断言。`Carp::Assert` 为你提供了几种方法来实现这一点：\n\
  \n```\n use Carp::Assert;\n\nsub yes_we_have_no_bananas\n\n{\n\n  my $bananas =\
  \ shift;\n\n  assert($bananas == 0) if DEBUG;\n\n  print \"Yes, we have no bananas\\\
  n\";\n\n} \n```\n\n不过，`Carp::Assert` 并不会打印“This shouldn't happen!!!”。（断言的语言太正式了，不会这样表达）。相反，它会打印“Assertion\
  \ failed!”和堆栈跟踪。如果你想让它打印自定义的消息，可以提供第二个参数：\n\n```\n assert($bananas == 0, \"We DO\
  \ have bananas!\") if DEBUG; \n```\n\n那么异常的第一行就是“Assertion (We DO have bananas!)\
  \ failed!”。\n\n`if DEBUG` 是什么用的？它是为了在你想要轻松禁用该断言以及代码中其他所有断言时提高性能。`Carp::Assert` 导出一个常量\
  \ `DEBUG`，其值为真。如果你确定已经从代码中消除了可能触发断言的 Bug，并且希望它在生产环境中尽可能高效，那么你就不希望 Perl 花费时间去编译和执行断言。\n\
  \n你可以通过改变一个单词来防止 Perl 执行断言：与其用 `use Carp::Assert`，不如用 `no Carp::Assert`。现在，`assert()`\
  \ 函数变成了一个立即返回且不执行任何操作的函数。但这仍然是一个子程序调用；如果你非常在意性能，你连这种调用都不想要。使用 `if DEBUG` 的目的是 Perl\
  \ 不会编译那些它在编译时就能判断为永远不会执行的代码，因为像 `DEBUG` 这样的常量是在编译时定义的，如果 `DEBUG` 为假，那么 Perl 就不会编译\
  \ `assert()` 语句。显然，`assert()` 只是当某些条件为假时抛出异常的语法糖。你可以通过以下方式获得相同的效果：\n\n```\n use\
  \ Carp;\n\nuse constant DEBUG => 1;\n\n# ...\n\nif (DEBUG)\n{\n\n  confess \"We\
  \ DO have bananas!\" unless $bananas == 0;\n}\n```\n\n但这种构造的冗余性要干扰得多，而你希望断言尽可能轻量。\n\
  \n### 10.1.3 Class::Contract\n\nDamian Conway 的 `Class::Contract`（http://search.cpan.org/dist/Class-Contract/）现在由\
  \ Garrett Goebel 维护，它实现了源自 Eiffel 世界的契约设计（Design by Contract）方法。成功使用这种方法要求在实现类时具有高度的专业知识和纪律；而回报是一个稳固的安全网。契约设计就像是注入了对象导类固醇的断言。它规定：\n\
  \n* 类中的每个方法应至少定义一个 `pre`（前置条件），这是对方法执行工作所需必须满足的条件进行的测试。`Class::Contract` 会在每次调用方法时、实际执行任何操作之前运行前置条件，如果测试失败，则会抛出异常。\n\
  * 类中的每个方法应至少定义一个 `post`（后置条件），这是对方法本应向调用者保证的内容的测试。`Class::Contract` 会在每次调用方法并在返回给调用者之前运行后置测试，如果测试失败，则会抛出异常。\n\
  * 类应当指定一个全局 `inv`（不变性），这是在每个方法调用结束时运行的另一个测试，用于测试方法是否违反类的完整性。\n\n正如你可能观察出的，提出合适的条件可能需要大量的专业知识。`Class::Contract`\
  \ 提供了这些功能以及更多功能（例如与属性相关的条件）；为了实现这一点，它几乎重新实现了 Perl 对象系统的部分部分（例如继承）。在 `Class::Contract`\
  \ 中，你指定方法、属性和继承的方式与 Perl 原生方式不同；你使用 `Class::Contract` 自己的语言来这样做。这里有一个可以运行的、尽管极其原始的示例，向你展示那种语言看起来什么样：`Class::Contract`\
  \ 最适合无法放入本书的大型应用程序。\n\n#### 示例 10.1 用于 Class::Contract 的 BankAccount.pm\n\n```\n\
  \ package BankAccount;\n\nuse strict;\n\nuse warnings;\n\nuse Class::Contract qw(old);\n\
  \nmy $INIT_RESERVES = 10_000;  # Bailey & Loan\n\ncontract\n\n{\n\n  class attr\
  \ 'reserves' => 'SCALAR';\n\n  class ctor;\n    impl { $self->reserves} = $INIT_RESERVES\
  \ };\n\n  class method 'adjust_reserves';\n    pre  { defined $_[0] };\n      failmsg\
  \ \"No amount to adjust reserves by\";\n    impl { $self->reserves} += $_[0] };\n\
  \n  invar { $self->reserves} >= 0 };\n    failmsg \"We gone bankrupt, Maw!\";\n\n\
  \  ctor 'new';\n    impl { $self->balance} = $_[0] };\n\n  attr balance => 'SCALAR';\n\
  \n  method 'get_balance';\n    impl { $self->balance };\n\n  method 'loan';\n  \
  \  pre  { defined $_[0] };\n    impl { $self->balance} += $_[0];\n           self->adjust_reserves(-$_[0])\n\
  \         };\n    post { $self->balance} == $old->balance + $_[0] };\n\n  method\
  \ 'invest';\n    pre  { defined $_[0] };\n    impl { $self->balance} -= $_[0];\n\
  \           self->adjust_reserves($_[0])\n         };\n    post { $self->balance}\
  \ == $old->balance - $_[0] };\n\n};\n\n1;\n```\n\n#### 示例 10.2 用于 Class::Contract\
  \ 的 BankAccount.pm 测试套件\n\n```\n #!/usr/bin/perl\n\nuse strict;\n\nuse warnings;\n\
  \nuse BankAccount;\n\nuse Test::More tests => 7;\n\nuse Test::Exception;\n\nBEGIN\
  \ { use_ok('BankAccount') }\n\nmy $acct = BankAccount->new(1000);\n\nis($acct->get_balance,\
  \ 1000);\n\nlives_ok { $acct->loan(5000) };\n\nis($acct->get_balance, 6000);\n\n\
  dies_ok { $acct->loan };\n\ndies_ok { $acct->invest };\n\nthrows_ok { $acct->loan(1E8)\
  \ } qr/bankrupt/; \n```\n\n`Class::Contract` 产生的冗余可能并不适合所有人，但如果你正在用 Perl 编写传奇的空中管制应用程序，你需要这种工业级的帮助。\n\
  \n#### 10.1.4 Log::Logperl\n\nMichael Schilli 的 `Log::Logperl`（http://search.cpan.org/dist/Log-Log4perl/）提供了从类层次结构的多个地方向多个目的地记录日志的功能。当你有一个高度面向对象的应用程序时可以使用它。例如，你可能有一个基础的数据库类，你对其连接启用日志，而当你创建了解\
  \ SQL 或事务的子类时，你希望分别记录 SQL 或事务错误。想象一个使用图 10.1 所示复杂的类层次结构的应用程序。\n\n现在假设叶子类中的一个对象生成了日志消息。`Log::4perl`\
  \ 允许为每个类附加零或多个附加器（appenders）；附加器是被指示将日志消息发送到特定目的地（例如文件或电子邮件接收者）的对象。每个附加器还被配置为在特定的级别触发，一系列如：DEBUG\
  \ , INFO, WARNING , ERROR, FATAL。因此，如果我们在叶子类及其祖类中都附加了附加器，消息将通过 `Log::4perl` 附加器的类层次结构向上传播，但只会激活那些注册了该消息级别（或更低级别）的附加器。\n\
  \n被激活的附加器在图 10.2 中用粗体表示。\n\n\n\n对于 CGI 程序或其他处理可能存在的恶意用户输入的程序，污点检查（Taint checking）的作用是有限的。有时候，你无法找到一个有效的正则表达式既能捕获你从用户输入中想要的内容，又能保证不会产生不安全的代码。\n\
  \n为了终极的代码保护，由 Malcolm Beattie 和 Tim Bunce 开发的 `Safe.pm`（自 Perl 5.004 版本起包含在核心库中）提供了一个环境，你可以在私有沙箱中执行\
  \ Perl 代码。该代码只能读取你明确允许其访问的数据，只能执行你明确列出的操作，并且无法影响沙箱之外的任何东西，除非返回一个结果供你使用。`Safe.pm`\
  \ 并不是一个易用的模块，但在安全至关重要的情况下，它可能是你的最佳选择。\n\n### 10.2 高级简洁性\n\nPerl 提供了一些复杂的语法糖（syntactic\
  \ sugaring，即让某些编码构造更简洁、更直观的方法）。其中两种技术是绑定（tieing）和重载（overloading）。\n\n### 10.2.1\
  \ 绑定 (Tieing)\n\n我们在第 3.3 节中见过绑定的示例。绑定允许你接管变量的正常功能。在外部，它看起来是一个普通的标量、数组、哈希或任何类型。但在内部，每当变量被使用时，执行的是你写的代码，而不是你预期的行为。\n\
  \n这在表面上看主要用于恶作作剧（它确实有这种潜力）。然而，它也可以用于使代码更加简洁并获得透明度。\n\n当你意识到正在实现一种行为上像变量的功能时，简洁性就体现了。例如，如果你有一个电子温度计以及读取该温度计数值的代码，你完全可以用传统的过程化代码来实现：\n\
  \n```\n use Thermometer;\n\n$temp = Thermometer->read; \n```\n\n但温度计的行为就像一个标量变量一样（尽管是一个只读标量变量；改变温度计上的读数不会改变它测得的温度，除非你知道如何打破热力学定律）。那么，（俗说）这样写要酷炫得多：\n\
  \n```\n tie $current_temp, 'Thermometer'; \n```\n\n然后每当你读取 `$current_temp` 时，它都会神奇地更新为当前温度。\n\
  \n`Themometer.pm` 模块可以通过根据 `perltie` 文档实现 `TIESCALAR` 和 `FETCH` 方法来轻松完成这一点。\n\n\
  你正在实现的功能语义需要映射到 Perl 变量类型之一的自然行为，这种功能才能生效。我们的温度计类与标量并不完美匹配（因为尝试写入它是没有意义的，因此我们必须决定是将任何此类尝试记录为抛出异常还是没有任何影响），但它确实足够接近，值得去费精力。我们可以在第一次绑定时为每个绑定的变量关联属性，因此我们可能选择声明：\n\
  \n```\n tie $current_temp, 'Thermometer', 'Celsius'; \n```\n\n以确保我们在读取时知道温度的单位是什么。这个接口现在看起来比过程化的等价实现要好得多：\n\
  \n```\n $current_temp = Thermometer->read_celsius; \n```\n\n或者甚至是面向对象的等价实现：\n\n\
  ```\n $current_temp = Thermometer->new(scale => 'Celsius');\n\nprint \"Temperature:\
  \ \", $current_temp->read; \n```\n\n这只是针对一个简单的标量。当你发现某个可以映射到哈希的功能时（例如），你可以写出极其简洁的代码。哈希最常见的绑定接口是存储哈希内容并使其持久化的数据库。我曾实现过一个程序，必须在哈希中存储大量条目；最终它耗尽了当时我使用的机器的虚拟内存资源。在以内存换速度的经典权中，我本可以追踪对哈希的每一次访问，并将其替换为对数据库库的\
  \ `fetch()` 或 `store()` 方法的调用。但那比我愿意做的要得多，幸运的是，之前的人和我一样懒，并将他们懒惰的成果封装了一系列将哈希绑定到数据库的模块中。我只需要添加一行：\n\
  \n```\n use DB_File; \n```\n\n并将哈希的声明从：\n\n```\n my %data; \n```\n\n改为：\n\n```\n\
  \ tie my %data, 'DB_File', $database, ... \n```\n\n（其中 `...` 参数指定了用作数据库的文件和相关信息），我不需要更改任何其他代码。此后，对哈希的每次访问行为都和以前一样，只是耗时长了一点，但不再占用内存。此外，我获得了持久化能力，这意味着我可以从之前的运行中恢复值，从而实现检查点/重启等功能。使用绑定到哈希的数据库时需要记住的例外是：如果哈希很大，不要使用任何返回整个哈希列表的哈希操作，因为这会将列表从数据库读取到内存，从而违背了绑定哈希的初衷。归结起来，在列表上下文中不要使用\
  \ `keys()` 或 `values()` 函数，也不要使用哈希本身；请使用 `each()` 函数。通过如此小的改变获得这种持久性，证明了绑定带来的透明性。\n\
  \n在一次极度懒惰的展示中，Damian Conway 将相当晦涩的 Perl 特性——属性（在 Perl 5.6.0 中引入），通过编写一个 `Attribute::Handlers`\
  \ 模块（在 Perl 5.8 中合并到核心库）简化了该功能的使用，使得接口变得简单：\n\n```\n my $current_temp : Thermometer;\
  \ \n```\n\n或者：\n\n```\n my $current_temp : Thermometer('Celsius');\n```\n\n### 10.2.2\
  \ 重载 (Overloading)\n\n当你创建一个类，并且该类的实例进行基本操作（如算术运算、字符串或其他类型）时，如果你可以合理推断出应该发生的行为，那么你可以选择以这种方式实现。这就是\
  \ C++ 有而 Java 没有的那种运算符重载。\n\n当然，对象类必须具有适用于这种干预的语义。如果你有一个 `Date` 类，两个类成员的相加没有意义；但相反，从一个中减去另一个可以合理解释为产生一个封装持续时间的类成员；而\
  \ `Duration` 对象与 `Date` 对象的重载相加可以合理解释为产生另一个 `Date` 对象。\n\n重载通常用于提供透明的字符串化；这允许你为自己的对象实现“奇淫淫”（dwummery）。人们刻意或无意在字符串上下文中使用对象是非常常见的，他们看到的打印结果通常类似于\
  \ \"Foo=HASH(0x80fbb0c)\"。如果你定义了一个对于某种文本表示很自然的对象类，并且发现自己实现了一个名为 `as_text()` 或 `as_string()`\
  \ 的实例方法，那么你可以给你的用户帮个忙，重载字符串化以调用该方法。这只需要通过将：\n\n```\n use overload '\"\" => \\&as_text;\
  \ \n```\n\n插入你的模块中即可。一个有效利用这一点的模块示例是 `URI.pm`（参见第 6.2.1 节），因为对 `URI` 对象最常见的操作就是其所代表的\
  \ URI 的文本形式。更多信息请参阅 `overload` 编译指令文档。\n\n是的，你可以拥有既被绑定又被重载的变量。\n\n\n\n\n\n在第 3 章中，我展示了如何为模块编写测试，包括它的文档。现在我将向你展示如何编写文档本身。\n\
  \n后排那边的同学，醒醒！是的，我知道我说了“文档”。这可能会让你脑海中浮现出微软 PowerPoint 演示文稿，用“功能性需求”和“规范引用”之类的冗肿标题填充各个章节，并格式化签名块。我说的不是那种文档。我说的是能告诉另一个程序员他们对你所做的工作需要了解什么的文档；即当你接手他人的代码时想要阅读的那种文档。或者当你一年后回到自己的代码前，无论如何想不起如何使用那个你曾认为接口“直观易见”的\
  \ `object class` 时，想要阅读的文档。\n\n#### 10.3.1 POD 人的入侵\n\n意识到编写文档对程序员来说是(a) 痛苦且/或无聊的，且\
  \ (b) 对程序员阅读是必不可少的，Larry Wall 创建了一套系统，让创建文档变得尽可能简单。这个系统平实地被称为纯旧文档（Plain Old Documentation，简称\
  \ POD）。\n\nPOD 的第一个便利之处是，你可以将其直接嵌入到它描述的代码中；它只是一段由特殊行标记的文本块。你可以选择将 POD 放在你想要的任何地方；表\
  \ 10-1 中所示的任何样式都是可以接受的且通用的。\n\n##### 表 10-1. POD 插入样式\n\n| POD 之前的代码 | 代码之前的 POD\
  \ | 代码中的 POD |\n| --- | --- | --- |\n| 代码 | POD | 代码 |\n| 代码 | POD | POD |\n| 代码\
  \ | POD | 代码 |\n| 代码或 `__END__` | POD | POD |\n| POD | 代码 | 代码 |\n| POD | 代码 | POD\
  \ |\n| POD | 代码 | 代码 |\n| POD | 代码 | POD |\n\n因此，你可以将 POD 全部放在开头（如果你认为那是程序员应该看到的第一样东西），或者全部放在末尾（如果你认为代码更重要）。在后一种情况下，你有一个小的优化可用：你可以将\
  \ POD 放在一行恰好由 `__END__` 文本组成的行之后，当 perl 运行你的程序时，它看到该行就会停止编译；因此即使是识别和忽略 POD 所需的短暂时间也不会占用。\n\
  \n最后一种样式是“内联”，这适用于你想让每个函数的文档直接嵌入在该函数旁的情况。显然，你甚至可以进一步，在更小的粒度上穿插 POD，但请记住，任何增加函数在编辑器中查看所需的空间的内容都会让代码变得难读。\n\
  \n第二个便利之处是 POD 非常简单。Larry 推理认为，为了让人们编写文档，创建和编辑它必须尽可能简单，因此只需要记住少数几个 POD 格式指令。你永远不需要担心代码中的任何内容被误判为\
  \ POD——POD 仅在以左边距对齐的等号开头并跟一个单词的特殊行之间被识别。在 POD 内部，你只需通过缩进即可让任何文本原样输出（其中的任何内容都不会被解释为格式指令）。例如，将\
  \ POD 与代码包含在一起看起来这么简单：\n\n```\n sub quad_roots\n\n{\n  my ($a, $b, $c) = @_;\n\n\
  \  my $disc = sqrt($b*$b - 4*$a*$c);\n\n  return((-$b + $disc) / 2 / $a, (-$b -\
  \ $disc) / 2 / $a);\n\n}\n\n=head2 ($root1, $root2) = quad_roots($a, $b, $c);\n\n\
  返回具有给定系数的二次方程的两个根，但如果它有虚根则抛出错误（在这种情况下，请使用 L<Math::Complex>）。\n\n根据经典公式计算：\n    -b\
  \ +/- sqrt(b**2 - 4ac)\n    -----------------------\n               2a\n\n=cut \n\
  ```\n\nPOD 指令行需要位于空行之间才能被识别。在非原样的 POD 文本内部，可以识别一些原始的标记标签。我在这里使用的 `L<>` 用于将其内容格式化为链接；当输出到支持超链接概念的格式时，该文本将链接到\
  \ `Math::Complex` 的 POD 页面（假设格式化程序找到它；见下文）。请注意，除非我用类似下面的内容覆盖链接默认文本，否则会将输出渲染为“the\
  \ Math::Complex manpage”：\n\n```\n use L<Math::Complex|the Math::Complex module>.\
  \ \n```\n\n记住，POD 是给你的用户看的；旨在帮助维护程序员理解实现细微差别的注释属于内联注释。在量尺的另一端，你可能有纯文档要创建（也许体现了设计、需求、用例或客户故事）。尽管也使用\
  \ POD 来处理这些内容吧；没有法律规定它必须位于包含 Perl 代码的文件中。\n\n#### 10.3.2 POD 格式化器\n\nPOD 的主要优势在于将其提取为仅包含文档的形式。正如我们习惯了阅读许多格式的文档一样，POD\
  \ 也可以转换为许多格式。Perl 核心自带将 POD 转换为文本、LaTeX、HTML 和 UNIX troff 手页标记的程序：它们分别称为 `pod2text`、`pod2latex`、`pod2html`\
  \ 和 `pod2man`。\n\n### 10.4 自定义警告\n\n假设你写了此模块：\n\n```\nuse warnings;\nuse Time::Local;\n\
  \n# 期望格式为 MM/DD/YYYY 的日期\nsub set_date\n{\n  my ($self, $date) = @_;\n  my ($mon,\
  \ $day, $year) = split m/#/, $date;\n\n  if (length($year) == 2)\n  {\n    warnings::warnif(\"\
  y2k\", \"Y2K bug, year interpreted in rolling window\");\n  }\n  $self->{date} =\
  \ timocal(0, 0, 0, $day, $mon-1, $year);\n}\n```\n\n在第 1 行中，我们使用了词法警告指令（那里本就应该在那里）。这使得我们在第\
  \ 9 行调用了 `warnings::warnif()` 函数，如果第一个参数中的警告类别已启用，它会在第二个参数中发出警告。\n\n`perlexwarn`\
  \ 页面告诉我们警告类别有一个层级结构，其中一个被称为 `y2k`，看起来合适，所以我们重用了它。如果此方法的调用者不想看到该警告，他们只需要排除它：\n\n\
  ```\n {\n  no warnings 'y2k';\n  $object->set_date('4/1/99');\n}\n```\n\n如果你愿意，可以定义自己的警告类别，而不是限于标准类别；参见\
  \ `perlexwarn`。\n\n如果每个模块作者都使用这种方法来发布警告，那么再也不需要使用 `-w` 了。\n\n### 10.5 版本控制系统集成\n\
  \n如果你正在使用版本控制系统（RCS），你可能希望将 RCS 版本号自动用作代码的版本。包变量 `$VERSION` 应该在模块中设置，因为各种工具都会查找它。但是，你不能直接说：\n\
  \n```\n our $VERSION = '$Revision$'; \n```\n\n\n\n\n因为版本号需要是数字。你需要的是一个包含 RCS `Revision`\
  \ 关键字并返回其数值部分的表达式。这里有一种可能的方法：\n\n```\n our $VERSION = (qw$Revision: 3.42 $)[-1];\
  \ \n```\n\n它巧妙地利用 RCS 的 `$` 关键字分隔符作为 `qw` 算符的分隔符，从第二个空格分隔的组件中提取出数字 `3.42`。\n\n如果你希望版本号包含两个以上的组件，`ExtUtils::MakeMaker`\
  \ 的文档显示了另一种方法：\n\n```\n our $VERSION = do { my @r = (q$Revision: 1.2.3 $ =~ /\\\
  d+/g); \\ \n\nsprintf \"%d.\".\"%03d\" x $#r, @r }; \n```\n\n为了让 MakeMaker 此为 `$VERSION`\
  \ 赋值，所有代码必须写在同一行。\n\n并发版本系统（`CVS`）使用相同的关键字。源码控制系统（`SCCS`）比 RCS 或 CVS 少得多，但用它进行版本编号也是轻而易举的：\n\
  \n```\n our $VERSION = \"%I%\"; \n```\n\n注意引号：Perl 在多个版本中允许使用 v-strings（包含多个句点的数字；它们会被转换为二进制形式），但在\
  \ `5.8.1` 之后的版本中它们已被弃用，因此我保守起见将版本转换为了字符串。\n\n由于 Subversion 的版本关键字是 `$Rev: $`，你可以对该产品复用\
  \ RCS 的建议。\n\n## 第 11 章 案例研究\n\n> “这种可爱的温和咖喱使用了 100% 的日本苹果和快乐的仓鼠。”\n\n> —日本 Ham\
  \ Monde 咖喱包装上的标签，来自 enrish.com。\n\n![graphics/ch11.jpg](img/ch11.jpg)\n\n让我们通过一个例子将书中的课程付诸实践。我将介绍接管一个刚进入我们收件箱的程序的各个阶段。考虑到空间限制——为了不让读者感到无聊——我无法涵盖一个大型程序，因此这个示例会相当小，而且本身也算不上糟糕。虽然它使用了一项功能——`LDAP`\
  \ 目录查询——你可能用得很少，但理解 `LDAP` 对于理解这段代码是如何变化的并不重要，而且此外，`LDAP` 本身就值得学习。\n\n> ^([1]) `LDAP`\
  \ 代表“轻量级目录访问协议”，它的使用率日益增加。\n\n## 11.1 设置\n\n我们的程序以名为 `dirsearch.cgi` 的 CGI 程序形式出现，它是表单的目标，该表单接受名为\
  \ `username`、`location` 和 `haircolor` 的输入。查看该程序的输入表单及其响应，可能有助于理解该程序在做什么（参见图 11.1\
