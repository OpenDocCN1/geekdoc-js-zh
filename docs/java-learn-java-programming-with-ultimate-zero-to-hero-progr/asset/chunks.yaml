    # 对象引用


    `object` 需要指向特定对象的引用，这与处理实例字段时类似。可以使用变量名。也可以使用表达式，只要它返回对象的引用即可。例如，`new` 运算符返回一个
    `object reference`。`new` 返回的值可以用于调用新对象的方法。


    ```

    new Rectangle(80, 30).getArea()

    ```


    `new Rectangle(80, 30)` 表达式返回一个 `Rectangle` 对象的引用。点符号法 `.getArea` 调用计算新 `Rectangle`
    的面积。简单来说，这个表达式将根据新的数字或图形（值）但基于原始方程，计算出第 `2^(nd)` 个矩形的面积。


    调用或触发对象引用就像向该特定对象发送消息。它告诉该方法开始执行并给出所需的结果。


    ## 垃圾回收


    其他面向对象的语言需要对已创建的对象进行定期跟踪。用户必须逐个检查对象，并费尽心力地删除每个不再使用的对象。这花费了太多的时间和精力。这种方法也存在巨大的风险，可能会意外删除未来可能需要的对象或当前程序仍在使用的对象。在
    Java 中，删除对象变得简单得多，并且不易发生删除错误。Java 允许用户创建大量对象，只要系统能够处理所有数据并为所有内容提供足够的内存空间。好处是，无需担心通过删除未使用的对象来清理各种程序。不需要翻阅长长的对象列表来寻找本应该被删除的对象。Java
    提供了一种名为 `garbage collector`（垃圾回收器）的简洁机制。Java 编程语言实现的运行时环境检测并自动删除任何不再使用的对象。


    `garbage collector` 只删除不再没有任何引用的对象。当变量超出范围时，该特定变量所持有的引用将丢失。一旦引用丢失，`garbage collector`
    就会自动删除它。


    要诱导 `garbage collector` 删除对象，用户需要显式地释放对该对象的引用。这样做的方法是访问变量并将其赋值为 `null`，这是一个特殊值。一旦赋值为
    `null` 值，引用就会丢失，`garbage collector` 就会删除该对象。此外，需要注意的是，为了让一个对象被成功删除，它的所有现有引用都必须被释放。否则，程序将继续持有该对象并保持可用。


    # 第 4 章 – Java 语言：变量


    Java 编程使用变量。这些是程序可以操作的命名存储器。这些变量由以下参数决定特定类型：


    - 变量占据的内存大小

    - 变量占据的的布局

    - 变量内存空间可以容纳的值范围

    - 变量允许的操作 set


    ## 变量类型


    ### 实例变量

    也被称为“非静态字段”。对象的个体状态存储在非静态字段中。这些是未用 `static` 关键字定义的字段。它们也被称为实例变量，因为每个实例或每个对象的值都是唯一的。


    `Instance variables` 用于存储对象的状态。从类中创建的每个对象都有该变量的副本。只要相应的对象保留在内存中，该副本就是有效的并占据所分配的存储空间。


    ### 参数（Arguments or Parameters）

    这种类型的变量是传递到方法签名中的变量，例如 `parameter`。另一个例子是之前示例中使用的 `args`。它们与修饰符（如 `static`、`protected`
    或 `public`）没有关联。然而，它们可以在方法的其他任何地方使用。它们在方法执行期间保留在内存中。当方法再次被使用时，这些变量就不能再使用了。


    ### 局部变量

    局部变量是在特定方法中定义和使用的变量。函数位于方法级作用域内，但对方法签名没有太大影响。`Local variables` 不包含任何修饰符。此外，这些变量在方法返回时就会消失。


    ### 类变量

    也被称为 `static fields`，`class variables` 指任何由 `static` 修饰符声明的字段。它告诉编译器，这个特定变量只有
    1 个可用副本，无论该类被引用或表示多少次。


    `Class variables` 是在类级通过 `static` 修饰符明确定义的变量。这种特定的 `static` 修饰符不应与其他任何变量一起使用。附加的
    `static` 修饰符将为每个变量产生一个副本。


    ## 变量声明


    在使用任何变量之前，必须先对其进行声明。基本变量声明的形式如下：


    `data type variable [ = value][, variable [=value] …];`


    `data type` 部分指 Java 中任何不同的数据类型，例如 `int`。`variable` 部分指给该特定变量的名字。在声明属于相同数据类型的多个变量时，可以使用逗号分隔。


    有效的变量声明形式如下：


    ```java

    int d, e, f; // 当声明 3 个变量 d、e 和 f 时，它们都是相同的数据类型 int

    int g = 10, h = 10; // 初始化的一种示例形式

    byte E = 76; // 初始化变量 E，它是一个字节类型

    double pi = 3.14159; // 声明并赋值 pi 的值

    char j = ‘j’; // char 类型变量 j 以 ‘j’ 作为值初始化

    ```


    ### 局部变量

    `Local variables` 作为方法临时状态的存储，就像字段存储对象状态一样。声明局部变量与声明字段相同。看这个示例：


    ```java

    Int count = 5;

    ```


    不需要特殊的关键字来将任何变量声明为局部。这完全取决于变量定义的位置。它位于特定方法的左右大括号之间，存储其临时状态。由于这个，`local variables`
    只对声明它们的方法可见。然而，它们与类的其余部分相比是不可见的。


    声明局部变量时使用了块、构造函数和方法。这些没有默认值，因此必须声明。在使用之前必须分配一个初始值。创建局部变量需要进入特定的块、构造函数或方法。一旦变量离开块、构造函数或方法，它将被销毁。


    对于局部变量，不能使用访问修饰符。它们在声明它们的块、构造函数或方法内可见。为了实现这些声明的局部变量，它们在栈级别实现。


    看这个示例：


    局部变量是 `age`，定义在 `catAge()` 方法内部。该声明变量的使用范围仅在该特定方法内。


    ```java

    public class Test{


    public void catAge(){


    int age = 0; // 假设的初始化

    age = age + 9;


    System.out.printIn(“Cat age is : ” + age);


    }


    public static void main(String args[]){


    Test test = new Test();


    Test.catAge();


    }


    }

    ```


    结果是：

    `Cat age is: 9`


    在下面的示例中，如果没有初始化就使用局部变量 `age`。在编译时将会出现错误。


    ```java

    public class Test {


    public void catAge(){


    int age;


    age = age + 9;


    System.out.printIn(“Cat age is “ + age);


    }


    public static void main(String args[]){


    Test test = new Test();


    Test.catAge();


    }


    }

    ```


    当编译时，结果将是一个错误：


    ```

    Test.java:4:variable age might not have been initialized

    age = age + 9;

    ^

    ```

