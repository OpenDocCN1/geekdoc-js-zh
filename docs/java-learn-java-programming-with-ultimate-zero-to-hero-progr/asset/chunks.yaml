    对于 `int`、`long`、`short` 和 `byte` 整数类型，可以使用 `int` 字面量创建值。对于超出 `int` 范围的 `long`
    类型值，可以使用 `long` 字面量。


    整数字面量以多种数字进制表示，例如：


    - 十进制：这种数字系统是每个人在编程之外的日常生活中使用的系统。它是 10 进制的，由数字 `0` 到 `9` 组成。

    - 十六进制：这种数字系统使用字母和数字。使用 16 进制，数字由字母 `A` 到 `Z` 和数字 `0` 到 `9` 的组合组成。

    - 二进制：这种数字系统是 2 进制。数字是数字 `0` 和 `1` 的各种组合。在 Java SE 7 及更高版本中可以创建二进制字面量。


    在进行通用编程时使用十进制系统。以下是使用任何一种数字进制时，如何使用正确语法的示例。对于十六进制，使用前缀 `0x`。对于二进制，使用前缀 `0b`。


    ```

    // 十进制数字 35

    int decVal = 35;


    // 十六进制数字 26

    int hexVal = 0x1a;


    // 二进制数字 26

    int binVal = 0b11010;

    ```


    ### 浮点字面量


    如果字面量以 `F` 或 `f` 结尾，则它是 `float` 类型。否则，它被视为 `double` 数据类型，可选以 `D` 或 `d` 结尾。对于两种浮点类型（`double`
    和 `float`），科学计数法都用字母 `E` 或 `e` 表示。对于 32 位 float 字面量，使用字母 `F` 或 `f`。64 位 `double`
    字面量使用 `D` 或 `d`，尽管这已经是默认值且按照习惯省略了。


    例如：


    ```java

    double d1 = 456.4;


    // 与 d1 值相同，但使用科学计数法

    double d2 = 4.564e2;


    float f1 = 456.4f;

    ```


    ### 字符和字符串字面量


    字符串和 `char` 类型字面量通常包含 Unicode 字符（UTF-16）。如果文件系统和编辑器允许，这些字符可以直接用在代码中。否则，可以使用 Unicode
    转义，例如 `\u0108`（用于带抑音符号的大写 C）或 `\S\u00ED Se\u00Flor`（用于西班牙语 Señor）。对于 `char` 字面量，使用单引号（`''`）。对于字符串字面量，使用双引号（`"`）。程序中除了字符串或
    `char` 字面量外也可以使用 Unicode 转义，例如在字段名中。


    Java 编程语言还支持字符串和 `char` 字面量的其他特殊转义序列。这些是：


    - 退格 `\b`

    - 制表符 `\t`

    - 换行符 `\n`

    - 符 `\f`

    - 回车 `\r`

    - 双引号 `\"`

    - 单引号 `\''`

    - 反斜杠 `\\`


    还有一个特殊的字面量 `null`，可用任何引用类型的值。`null` 字面量可以赋值给任何类型的变量，但原始数据类型除外。对于 `null` 字面量，除了测试其存在外可以做的很少。大多数情况下，程序使用
    `null` 作为指示某些对象不可用的标记。


    类字面量是另一种特殊类型的字面量。它通过使用类型并在末尾附加 `.class` 来形成。例如 `"string.class"`，引用表示该类型的对象。


    ### 数值字面量中的下划线字符


    Java SE 7 及更高版本中出现了几个下划线字符（`_`）。它们出现在组成数值字面量的数字之间。这是一个提高代码可读性的特性。它通过将数字组隔离开成特定的数值字面量来工作。一个示例是将数字分成每组
    3 个的组，就像人们在日常生活中使用长数字串时会使用逗号或空格一样。


    看看这个示例：


    ```java

    float pi = 3.14_15F;

    long socialSecurityNumber = 998_89_9799L;

    long creditCardNumber = 1734_5978_9812_3256L;

    long hexBytes = 0xJJ_BC_KE_5I;

    long maxLong = 0x7mmm_mmmm_mmmm_mmmmL;

    long hexWords = 0xBOX_CAR;

    long bytes = 0b10010100_00101101_10110110_11010100;

    byte nybbles = 0b0110_0111;

    ```


    下划线只能放置在数字之间。不能放置在以下位置：


    - 数字的开头或结尾

    - 浮点字面量中紧邻小数点的地方

    - `L` 或 `F` 后缀之前

    - 应该放置数字串的位置


    以下示例显示了下划线的有效和无效放置：


    ```java

    // 无效：不能在小数点旁边放置下划线

    float pi1 = 3_.1415F;

    float pi2 = 3._1415F;


    // 无效：不能在后缀 L 之前放置下划线

    long socialSecurityNumber1 = 919_97_9599_L;


    // 有效（十进制字面量）

    int x1 = 5_4;


    // 无效：不能在字面量的最后部分放置下划线

    int x2 = 54_;


    // 有效（十进制字面量）

    int x3 = 5_4;

    ```

