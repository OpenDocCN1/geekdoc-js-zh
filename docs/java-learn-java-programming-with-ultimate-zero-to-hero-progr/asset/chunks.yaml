    这种类型的运算符使用单个操作数。它用于各种功能，例如表达式取反、布尔值反反或值加/减 1。\n\n- `+` 一元加运算符：用于表示正值。\n- `-` 一元减运算符：用于表达式取反。\n\
    - `++` 递增运算符：产生值加 1 的结果。\n- `--` 递减运算符：产生值减 1 的结果。\n- `!` 逻辑取反运算符：用于反转布尔值。\n\n\
    考虑以下测试元运算符的示例：\n\n```java\nclass UnaryDemo {\n    public static void main(String[]\
