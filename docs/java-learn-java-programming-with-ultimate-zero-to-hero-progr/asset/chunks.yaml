    `&` 二进制与运算符：如果一个位在两个操作数中都存在，则该位被复制到结果中。

    `(m & p)` 产生 12，二进制为 `1100`


    `|` 二进制或运算符：如果一个位出现在任意一个操作数中，则该位被复制。

    `(m | p)` 产生 61，二进制为 `0011 1101`


    `^` 二进制异异运算符：如果一个位在其中一个操作数中被设置为 1 而不在两个中设置，则该位被复制。

    `(m ^ p)` 产生 49，二进制为 `0011 0001`


    `~` 二进制取反运算符：这是一个一元运算符。它的作用是“翻转”位。

    `(~m)` 产生 -61，二进制形式在二进补码形式下为 `1100 0011`。这是因为该一元数是有符号的。


    `<<` 二进制左移运算符：根据右操作数指定的位数向左移动左操作数的值。

    `m << 2` 产生 240，二进制形式为 `1111 0000`


    `>>` 二进制右移运算符：根据右操作数指定的位数向右移动左操作数的值。

    `m >> 2` 产生 15，二进制形式为 `1111`


    `>>>` 右移零填充运算符：根据右操作数的位数向右移动左操作数的值。移出的空位将用零填充。

    `m >>> 2` 产生 15，二进制形式为 `000 1111`


    # 逻辑运算符


    为了说明逻辑运算符的功能以及如何工作，请考虑以下示例：


    布尔变量 `x` 持有 true 值，布尔变量 `Y` 持有 false 值。


    `&&` 逻辑与运算符：通过测试两侧的操作数是否为非零来工作。如果是，条件变为 true。

    `(x && y)` 为 false


    `||` 逻辑或运算符：检查两个操作数中任意一个是否非零。如果是，条件为 true。

    `(x || y)` 为 true


    `!` 逻辑非运算符：该运算符用于反转其操作数的逻辑状态。也就是说，如果条件为 true，逻辑非运算符会使其变为 false。

    `!(x && y)` 为 true


    # 赋值运算符


    这些与代数中使用的非常相似。它们也是最常用的运算符。


    `=` 简单赋值运算符：该运算符将右侧操作数的值赋值给左侧。

    `Z = X + Y`，其中 `X + Y` 的值被赋值为 `Z` 的值。


    `+=` 加赋值运算符：该运算符将左右操作数相加，然后将结果赋值给左操作数。

    `Z += X` 变为 `Z = Z + X`


    `-=` 减赋值运算符：应用时，从运算符左侧的操作数减去右操作数。然后将结果赋值给左操作数。

    `Z -= X` 变为 `Z = Z - X`


    `*=` 乘赋值运算符：应用时，左侧的操作数乘以右操作数。然后将结果赋值给左操作数。


    `/=` 除赋值运算符：应用时，左侧的操作数除以右操作数。然后将结果赋值给左操作数。


    `%=` 取模赋值运算符：应用时，左侧的操作数对右操作数取模。然后将结果赋值给左操作数。


    `<<=` 左移赋值运算符：应用时，根据右操作数指定的位数将左操作数左移。然后将结果赋值给左操作数。


    `>>=` 右移赋值运算符：应用时，根据右操作数指定的位数将左操作数右移。然后将结果赋值给左操作数。


    `>>>=` 右移零填充赋值运算符：应用时，根据右操作数的位数将左操作数右移并补零。然后将结果赋值给左操作数。


    `&=` 按位与赋值运算符：应用时，左操作数与右操作数进行按位与运算，并将结果赋值给左操作数。


    `|=` 按位或赋值运算符：应用时，左操作数与右操作数进行按位或运算，并将结果赋值给左操作数。


    `^=` 按位异异赋值运算符：应用时，左操作数与右操作数进行按位异异运算，并将结果赋值给左操作数。


