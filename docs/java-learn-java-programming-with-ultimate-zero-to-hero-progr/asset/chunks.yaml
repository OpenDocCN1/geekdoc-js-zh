    \ an instance of a class from which the object is created. In this part of creating\
    \ an object, the keyword `new` is used. It instantiates a class by allotting memory\
    \ space for the new object and returns a reference for that specific memory. The\
    \ operator `new` also calls upon an object constructor and puts it to work.\n\n\
