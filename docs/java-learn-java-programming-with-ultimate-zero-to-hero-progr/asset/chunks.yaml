    # 引言


    我想感谢你的下载，并祝贺你下载了《Java：初学者终极从零到英雄编程速成课程》这本书。


    本书包含了关于如何使用 `Java` 并短时间内成为编程专家的经过验证的步骤和策略。本书将帮助初学者了解并理解 `Java` 是什么，它能做什么，以及如何最大限地利用该程序。


    理解 `Java` 将为你开启辟一个全新的世界，因为 Java 处于当今编程的核心，从笔记本电脑到超级计算机，从手机到游戏机机。甚至互联网也使用 Java，因为应用程序和网站需要
    Java 才能运行。因此，即使你对计算机编程感兴趣，在在线活动中仍然会需要它。对于初学者来说，编程语言可能会让人有些无从从。面对所有的术语和字符字符串，人们很容易迷失。幸运的是，这本书就是你入门并轻松导航此编程软件所需的所有内容。


    再次感谢下载本书，希望你喜欢它！


    ## 目录


    - 引言

    - 第一章 - Java 基础

    - 第二章 - Java 语言基础

    - 第三章 - Java 语言：对象

    - 第四章 - Java 语言：变量

    - 第五章 - Java 语言：运算符

    - 结论

    - “ZERO to HERO”的其他书籍

    - 赠送：免费 JavaScript 课程！


    # 第一章 – Java 基础


    Java 是一种有很多应用的计算平台和编程语言。这种编程和计算软件无处不在。它存在于各种计算机和数据中心中，包括简单的笔记本电脑。平板电脑和手机等移动设备都使用
    Java。互联网也使用 Java 进行其操作。事实上，Java 是几乎每种网络应用程序的核心。


    在设备上安装 Java 使用户可以在互联网上聊天、玩在线游戏并查看 3D 图像。它是允许计算（如抵押贷款计算和简单算术）的程序中不可或缺的。它还是各种企业计算需求的基础，例如电子商务解决方案和内网应用程序。


    ### Java 的起源是什么？


    由詹姆斯·高林（James Gosling）领导的太阳系统公司（Sun Microsystems）团队在 20 世纪 90 年代初开发了这种计算机编程语言。最初的设计旨在用于手机、机顶盒和其他数字移动设备。该编程语言最初命名为
    OAK。第一个版本未能吸引到大量的赞助，这促使公司进行了一些修改。该语言经过了修改以适应互联网，名称也更改为今天所使用的 Java。1996 年，Java
    1.0 向公众发布。这次公开发将其主要用途从移动设备使用转移到了蓬勃发展的互联网上。


    ### 谁在使用 Java？


    Java 也是嵌入式和移动应用开发与交付的全球标准。它也是基于网络的内容、企业和游戏的标准。约 97% 运行在桌面电脑上的企业都在使用 Java。仅在美国，就有约
    89% 的计算机或桌面电脑也使用 Java 程序运行。


    有超过 900 万开发者正在使用 Java 来完成所有所需的应用程序和服务。在全球范围内，还有惊人的 30 亿部手机也使用 Java 进行其核心操作和应用程序。所有的蓝光播放机都配备了
    Java 程序。约 1.25 亿台电视设备在其基础操作中使用 Java。目前正在使用的 Java 卡数量高达 50 亿张。所有各种电气设备前 5 名原制造商都出货
    Java ME。这些数字显示了 Java 的使用是广泛。


    Java 为用户提供了更多的交互性。这允许开发者制作带有动画的网页，增加了网站对在线用户的吸引力。随着岁月的流逝，Java 演变成了一项全球性的成功。它的使用扩展到包括互联网用途之外的应用程序和服务。在向公众发布十多年后，Java
    仍然很受欢迎。截至今天，全球有约 65 亿开发者在使用它，从简单的桌面应用程序到复杂的、敏感的科学超级计算机。


    修改包括对 C++ 编程语言的简化。消除了一些语言特征，这减少了许多常见的编程错误。


    Java 使用源代码文件，即使用 `.java` 扩展名的文件。这些源代码文件由编译器汇装并组合在一起，然后格式化为字节码。字节码是一个具有 `.class`
    扩展名的文件，由 Java 解释器执行。所有经过编译的 Java 代码都能由于 `VMs`（或 `Java 虚拟机`）而运行在任何计算机上。这些是存在于大多数操作系统（如
    Windows、Macintosh OS 和 UNIX）中的运行时环境和 Java 解释器。字节码可能直接由 `JIT`（即时编译器）转换为机器语言指令。


    ## 使用 Java 的核心原则


    Java 的设计包含了 4 个核心原则，即易用性、可靠性、安全性和平台无关。


    #### 易用性

    Java 的基础源于 C++，C++ 是一种强大的编程语言。然而，它的语法被认为非常复杂。Java 基于 C++ 语言并对其进行了改进。结果是一个强大而简单的编程平台。


    #### 可靠性

    Java 开发的主要原则之一是减少产生常见编程错误的可能性，这些错误可能会严重阻碍程序的有效功能。为了消除常见的编程错误，Java 引入了一种面向对象的编程方法。数据及其操作方法被很方便地封装在一个地方。这种技术使
    Java 编程更加健壮和可靠。


    #### 安全性

    如前所述，Java 最初是为预计在各种网络上交换数据的移动设备开发的。这一功能需要高水平的安全措施，而 Java 能够提供这些措施。迄为止，Java 被认为认为所有可用编程语言中最安全的。


    #### 平台无关

    Java 是一种可移植语言。它不不对不同平台进行歧视。这意味着无论存在什么类型的硬件或什么操作系统，它都能完美、一致地运行。


    ## 使用 Java 开发软件的优势


    Java 是一种经过多年磨练、改进、提炼、测试、扩展和证明的计算机编程语言。由爱好者、开发者和架构师组成的致力于社区共同工作，帮助该语言满足软件开发者和用户不断变化的需求。


    对于软件开发者来说，Java 提供了以下主要优势：


    - 可以在一种平台上编写软件并在几乎任何其他不同平台上运行相同、一致的功能。

    - 使用 Java 创建的程序可以在任何网络浏览器中运行，并访问任何可用的网络服务。

    - Java 可用于服务器端应用程序，用于在线投票、商店、论坛、HTML 表单处理等许多领域。


