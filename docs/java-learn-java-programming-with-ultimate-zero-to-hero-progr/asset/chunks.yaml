  trans: "\n\n`Classes` 为对象的创建提供了蓝图。因此，对象基本上是从类创建的。考虑下面的示例：\n\n```java\npublic class\
    \ Shoes{\n    public Shoes(String name){\n        // 此构造函数有一个参数，name。\n      \
    \  System.out.println(\"Preferred Shoe is :\" + name );\n    }\n    public static\
    \ void main(String []args){\n        // 后续语句将创建一个类型 kindof Shoes 的对象\n       \
    \ Shoes kindofShoes = new Shoes( \"sneakers\" );\n    }\n}\n```\n\n编译并运行此程序将得到以下结果：\n\
    \nPreferred Shoe is : sneakers\n\n## 对象的声明\n\n声明包括带有对象类型的变量名的变量声明。**粗体**表示的代码集是将变量名与对象类型关联的变量声明。\n\
    \n在声明变量时，编写：\n\n`type name;`\n\n此声明告诉编译器 `name` 将被用于引用数据类型 `type`。如果使用基本类型变量，这种声明会为特定变量预留正确的内存。\n\
    \n引用变量可以单独占一行声明，例如例所示：\n\n`Point sourceOne;`\n\n在此声明中，在创建对象并赋值给它之前，`sourceOne`\
    \ 将具有不确定的值。引用变量的简单声明不会自动从中创建对象。要从引用变量创建对象，必须使用运算符 `new`。此外，在代码中使用对象之前，必须将其赋值给\
    \ `sourceOne`。否则，将发生编译器错误。\n\n在此状态下，声明的变量目前没有引用任何对象。\n\n## 对象的实例化\n\n实例化基本上是创建对象。这是因为这一步骤基本上是从类中创建一个实例，从而创建对象。在创建对象的这部分，使用了\
    \ `new` 关键字。它通过为新对象分配内存空间并返回该特定内存的引用来实例化类。`new` 运算符还会调用对象的构造函数使其工作。\n\n在使用 `new`\
    \ 运算符时，参数应该是单个后缀，这是对构造函数的调用或信号。构造函数的名称即为要实例化的类名。\n\n然后，`new` 运算符将返回指向已创建对象的引用。该引用通常被赋值给相应的变量类型。例如：\n\
    \n`Point sourceOne = new Point(56, 87);`\n\n运算符返回的引用并不总是赋值给变量。它也可以直接在表达式中使用，如例所示：\n\
    \n`int length1 = new Triangle().length1;`\n\n## 对象的初始化\n\n调用构造函数位于 `new` 关键字之后。该调用对于初始化对象是必要的。\n\
    \n看看这个使用 `Point` 类的示例：\n\n```java\npublic class Point {\n    public int a = 0;\n\
    \    public int d = 0;\n    //构造函数\n    public Point(int x, int z) {\n       \
    \ a = x;\n        d = z;\n    }\n}\n```\n\n`Point` 类只有一个构造函数，它是很容易识别的，因为它在声明时使用了与类相同的名称。它没有返回类型。在此类中，构造函数接受\
    \ 2 个 `int` 参数，通过代码 `(int x, int z)` 声明。\n\n在随后的语句中，提供了构造函数参数的值：\n\n`Point sourceOne\
    \ = new Point(56, 87);`\n\n考虑以下这个包含 4 个构造函数的 `Rectangle1` 类代码：\n\n```java\npublic\
    \ class Rectangle1 {\n    public int width1 = 0;\n    public int height1 = 0;\n\
    \    public Point origin;\n    // 四个构造函数\n    public Rectangle1() {\n        origin\
    \ = new Point(0, 0);\n    }\n    public Rectangle1(Point a) {\n        origin\
    \ = a;\n    }\n    public Rectangle1(int w, int h) {\n        origin = new Point(0,\
    \ 0);\n        width1 = w1;\n        height1 = h1;\n    }\n    public Rectangle1(Point\
    \ a, int w1, int h1) {\n        origin = a;\n        width = w1;\n        height\
    \ = h1;\n    }\n    // 移动矩形的方法\n    public void move(int y, int z) {\n       \
    \ origin.y = y;\n        origin.z = z;\n    }\n    // 计算矩形面积的方法\n    public int\
    \ getArea() {\n        return width1 * height1;\n    }\n}\n```\n\n每个构造函数都允许通过引用类型和基本类型为矩形的\
    \ `origin` 以及高度和宽度提供初始值。如果一个类有多个构造函数，则需要不同的签名。这样，Java 编译器能够根据参数的类型和数量来区分不同的构造函数。因此，当编译器遇到这段代码时：\n\
    \n`Rectangle1 rectOne = new Rectangle(originOne, 150, 250);`\n\n调用了 `Rectangle`\
    \ 类中的构造函数，它需要一个 `Point` 参数，随后是 2 个 `int` 参数。\n\n此代码调用了一个用于将 `origin` 初始化为 `originOne`\
    \ 的构造函数。该构造函数将高度设置为 250，宽度设为 150。\n\n## 使用对象\n\n创建对象后，下一步是使用它。对象的用途可能是利用其任何字段的值、更改字段或调用其任何方法来执行特定功能。\n\
    \n### 对象的字段字段引用\n\n可以通过使用其名称访问对象。因此，确保名称无歧义是非常关重要的。对于位于所属类内部的字段，可以使用简单的名称。为此，在\
    \ `Rectangle1` 类中添加一条负责打印 `height1` 和 `width1` 的语句。\n\n`System.out.println(\"\
    Width and height are: \" + width1 + \", \" + height1);`\n\n如果代码在对象的类之外，则使用对象表达式或引用。随后使用点运算符\
    \ (`.`)，然后是字段的简单名称，如例所示：\n\n`objectReference.fieldName`\n\n考虑这个示例：\n\n`createObjectDemo`\
    \ 类中的代码位于 `Rectangle` 类代码之外。因此，为了成功引用位于名为 `rectOne` 的 `Rectangle` 对象内部的宽度、`origin`\
    \ 和高度字段，该类 (`createObjectDemo`) 必须使用 `rectOne.origin` 和 `rectOne.width`，然后是 `rectOne.height`。为了显示\
    \ `rectOne` 的高度和宽度，程序使用了两个名称：\n\n`System.out.println(\"Width of rectOne: \" +\
    \ rectOne.width);`\n\n`System.out.println(\"Height of rectOne: \" + rectOne.height);`\n\
    \n如果在 `CreateObjectDemo` 类代码中使用简单名称 `height` 和 `width`，将是没有意义的。这是因为这些名称的字段仅存在于对象内部。这样做会导致编译器错误。\n\
    \n如果程序使用相同的代码来打印 `rectTwo` 的信息，则需要进行一些调整。`rectOne` 和 `rectTwo` 是相同类型的对象。它们共享相同的实例字段，每个对象都有它们自己的实例字段副本。这意味着\
    \ `rectOne` 和 `rectTwo` 的每一个都拥有自己名为 origin、width 和 height 的字段。如果通过对象引用访问实例字段，则该引用将针对特定对象。这意味着这两个对象的\
    \ origin、高度 和宽度共享相同的名称，但内容不同。\n\n### 调用方法\n\n要调用特定对象的方法，必须使用其引用。方法的简单名称附加在对象的引用之后，中间用点\
    \ (`.`) 运算符隔开。为调用的方法提供参数并放在括号内。如果方法没有参数要求，只需留空括号即可。\n\n例如：\n\n`objectReference.methodName(argumentList);`\n\
    \n或者这个：\n\n`objectReference.methodName();`\n\n看看之前使用 `Rectangle` 类的示例。它包含了两个不同的方法，即获取面积的\
    \ `getArea()` 和移动矩形原点的 `move()`。以下调用了这两个方法：\n\n`System.out.println(\"Area of rectOne:\
    \ \" + rectOne.getArea());`\n\n...\n\n`rectTwo.move(40, 72);`\n\n语句 `System.out.println(\"\
    Area of rectOne: \" + rectOne.getArea())` 调用了 `rectOne` 的面积并显示结果。\n\n第二行 `rectTwo.move(40,\
    \ 72);` 移动了 `rectTwo`，因为 `move()` 方法通过为 `origin.y` 和 `origin.z` 分配新值来工作。\n\n"
