    -   可以为远程处理器、手机手机、无线模块、网关、传感器、微控制器以及几乎任何电子设备编写高效且强大的应用程序。


    # 第 2 章 – Java 语言基础


    在开始使用 Java 之前，你应该先学习这门语言。这项基础技能将极大地帮助你充分利用软件的功能。它也能让通信变得简单得多。作为一种编程语言，Java 语言主要关于字符串。它包含变量、对象、参数、表达式、控制流语句和块。理解这些元素就像学习一种外语，以便更好地与当地人进行交流。


    这种语言允许程序员和开发者编写基于英语的命令作为计算机指令。Java 不要求他们像其他计算机编程语言那样使用数字代码。这被认为是一种“高级”语言，因为它允许人类轻松地阅读和编写这种语言。程序指令是根据称为
    `syntax`（语法）的规则编写的，就像适用于人类语言的语法规则一样基本上，人类开发者或程序员使用英语输入指令，一旦完成，计算机会将这些翻译成计算机容易理解和执行的代码。在大多数其他计算机语言中，开发者或程序员必须在计算机理解指令之前自己完成翻译。


    学习 Java 语言将对以后创建程序大有帮助。


    Java 使用静态类型编程语言。变量在使用之前必须先进行声明。为了这样做，必须说明变量名和类型，例如此例：


    ```

    int gear – 1;

    ```


    该语句通知程序存在名为 `gear` 的字段，其功能是存储数值类型的数据，初始值为 1。


    变量中声明的数据类型非常重要，因为它决定了该字段可以包含什么值，以及可以对其执行哪些操作。


    ## 关键字


    关键字具有特定的含义，用于告知编译器程序应该做什么。这些特殊单词不能用类名、变量或方法名。这些单词对大小写敏感，并且应该使用小写。


    Java 关键字如下：


    `abstract`, `default`, `if`, `private`, `this`, `boolean`, `do`, `implements`,
    `protected`, `throw`, `break`, `double`, `import`, `public`, `throws`, `byte`,
    `else`, `instanceof`, `return`, `transient`, `case`, `extends`, `int`, `short`,
    `try`, `catch`, `final`, `interface`, `static`, `void`, `char`, `finally`, `long`,
    `strictfp`, `volatile`, `class`, `float`, `native`, `super`, `while`, `const`,
    `for`, `new`, `switch`, `continue`, `goto`, `package`, `synchronized`。


    ## 注释


    这些是添加到程序中的描述，以便理解代码。编译器会自动忽略这些注释。它们不会准确影响程序的结果。注释主要用作程序文档的一部分，让想要阅读程序的人更容易阅读。


    在 Java 中，有 3 种支持的注释样式。这些是块注释、行注释和文档型注释。


    块注释以 `/*` 开始，以 `*/` 结束。这些注释跨多行。


    行注释以 `//` 开始，并在行结束处自然结束。


    文档型注释以 `/**` 开始，以 `*/` 结束。这些注释也跨多行。文档型注释通常使用自动文档生成工具创建的。这种工具的一个示例是 `javadoc`。


    ## 原生数据


    原始数据是程序语言预定义的类型类型。这种数据类型有一个由关键字保留的名称。这些值不与其他值共享状态。


    Java 支持 8 种不同的原始数据类型：


    ### `byte`

    字节是一个 8 位的符号位补码整数。最小值为 -128，最大值为 127。这种数据类型在保存大数组中的内存时非常有用，在这些情况下节省内存空间非常重要。`byte`
    数据类型也可以替代 `int`。`byte` 提供的限制有助于进一步澄清代码。取值范围也作为文档的一种手段。


    ### `short`

    这种数据是 16 位的符号位补码整数。最小值为 -32, 768，最大值为 32, 767。`short` 数据类型可以与大数组一起使用以节省更多内存。


    ### `int`

    `int` 是 32 位的符号位补码整数。最小值为 -2³¹，最大值为 2³¹-1。这种数据类型在 Java SE 8 及更高版本中用于表示从 0 到 2³¹-1
    的无符号 32 位整数的手段。


    `int` 数据类型可以作为无符号整数使用。为了做到，必须使用变量的 `Integer` 类。整数类包含了如 `compareUnsigned` 和 `divideUnsigned`
    等方法，以支持涉及无符号整数的算术运算。


    ### `long`

    这种数据类型是 64 位的补码整数。符号 `long` 数据的最小值为 -2⁶³，最大值为 2⁶³-1。对于 Java SE 8 及以后的版本，`long`
    数据类型可以用于表示无符号 64 位长型。它们的最小值为 0，最大值为 2⁶⁴-1。当需要比 `int` 数据类型提供的更广泛的值范围时将使用这些。`Long`
    类数据包含了如 `divideUnsigned` 和 `compareUnsigned` 等方法。这些方法支持数学运算。


    ### `float`

    这种数据类型是单精度、32 位 IEEE 754 浮点数。`float` 可用于替代 `double` 以节省内存，在处理浮点数时使用。


    ### `double`

    这种数据类型是 64 位双精度 IEEE 754 浮点数。`double` 数据类型通常是默认选择，尽管在处理精确数值时绝不建议使用。


    ### `boolean`

    `boolean` 数据类型只有 2 个可能的值：`true` 和 `false`。`boolean` 有助于创建简单的真/假标志。这种数据类型对应 1 位信息。然而，大小并没有精确定义。


    ### `char`

    `char` 是单个 16 位的 Unicode 字符。最小值为 0 或 `\u0000`，最大值为 65535 或 `\uffff`。


    ## 默认值


    声明字段并不总是需要赋值。编译器会自动为声明但未初始化的字段设置合理的默认值。通常，默认值为 0 或 `null`，这取决于数据的类型。虽然可以这样做，但依赖默认值被认为是一种糟糕的编程风格。


    原始数据类型字段的默认值为：


    - `byte`: 0

    - `int`: 0

    - `short`: 0

    - `long`: 0l

    - `double`: 0.0d

    - `float`: 0.0f

    - `string`: null

    - `char`: `\u0000`

    - `boolean`: false


    尽管局部变量略有不同。对于未初始化的局部变量，编译器永远不会分配默认值。如果局部变量在声明时无法初始化，请确保在使用之前对其赋值。否则，在访问未初始化的局部变量时会导致编译错误。


    ## 字面量


    字面量是代表固定值的源代码。它们直接表示在代码中，不需要任何计算。将字面量分配给原始值是可能的，如下所示：


    ```

    char capitalC = ''C'';

    boolean result = true;

    byte b = 100;

    int i = 100000;

    short s = 10000;

    ```


    ### 整数字面量


    整数字面量如果以 `l` 或 `L` 结尾则是长数据类型。如果不是，这些字面量就是 `int` 类型。最建议使用字母 `L` 的大写，因为很难区分小写的 `l`
    和数字 1。


