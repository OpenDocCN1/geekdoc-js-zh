    # Chapter 2 – Basic Java Language


    Before you start using Java, you should learn the language first. This basic skill
    will immensely help in getting the most out of the software. It makes communicating
    much easier, too. As a programming language, Java language is mainly about strings
    of characters. There are variables and objects, parameters, expressions, control
    flow statements and blocks. Understanding these elements is like learning a foreign
    language in order to better communicate with the locals.


    This language allows programmers and developers to write English-based commands
    as computer instructions. Java does not require them to use numeric codes like
    other computer programming languages do. This is considered as “high level” language
    because it allows humans to easily read and write the language. The program instructions
    are written based on rules called syntax, much like Grammar rules applying to
    human languages. Basically, the human developer or programmer input instructions
    using the English language and once done, the computer translates these into a
    code that the computer can easily understand and execute. In most other computer
    languages, the developer or programmer would have to do the translation himself
    before the computer understands the instructions.


    Learn the Java language will immensely help when creating programs later.


    Java uses a statically-typed programming language. Variables must be declared
    first before these can be used. To do so, the variable name and type must be stated,
    such as in this example:


    int gear – 1;


    This statement informs the program that there exists a field called “gear”, which
    functions to hold numerical type of data and the initial value is 1.


    The data type stated in the variable is very important because it determines what
    values the field can contain and what operations can be done on it.


    KEYWORDS


    Keywords have specific meanings that inform the compiler about what the program
    should do. These special words cannot be used as class names, variables, or method
    names. These words are case sensitive and should be written in the lower case.


    Java keywords are the following:


    abstract default


    if private this


    boolean


    do implements protected throw


    break double import public throws


    byte


    else instanceof return transient


    case extends


    int short


    try


    catch final interface static void


    char finally


    long strictfp volatile


    class float native super while


    const


    for


    new switch


    continue


    goto package synchronized


    COMMENTS


    These are descriptions added to programs, for easy understanding of the codes.
    Compilers automatically ignore these comments. They do not exactly affect the
    outcome of the program. Comments are mainly used as part of program documentation,
    making it easier for those who want to read the program.


    In Java, there are 3 supported comment styles. These are block style, line style
    and documentation style.


    Block style starts with /* and end with */. These comments span multiple lines.


    Line style starts with // and ends naturally where the line ends.


    Documentation style start with /** and ends with */. These comments also span
    multiple lines. Document style comments are often created with the use of an automatic
    documentation generation tool. An example of this kind of tool is javadoc.


    PRIMITIVE DATA


    Primitive data is a type of data that comes predefined by the program language.
    This data type has a name reserved by a keyword. The values do not share states
    with other values.


    Java supports 8 different types of primitive data:


    byte


    A byte is 8-bit signed two’s complement integer. The minimum value is -128 and
    the maximum value is 127\. This type of data is useful when saving memory that
    comes in large arrays, where saving memory space matters a lot. byte data type
    may also be used to replace int. Limits provided by byte help in further clarifying
    the code. The value range also serves as a means of documentation.


    short


    This data is a 16-bit signed two’s complement integer. The minimum value is -32,
    768 and the maximum value is 32, 767\. The short data type can be used with large
    arrays in order to save more memory space.


    int


    The int is 32-bit signed two’s complement integer. The minimum value is -2^(31)
    and the maximum value is 2^(31)-1\. This data type is used in Java SE 8 and later
    versions as a means to represent unsigned 32-bit integers from 0 to 2^(31)-1.


    The int data type can be used as an unsigned integer. To do this, the Integer
    Class of variables has to be used. The integer class incorporates methods such
    as compareUnsigned and divideUnsigned in order to support arithmetic operations
    that involve unsigned integers.


    long


    This type of data is 64-bit two’s complement integer. The minimum value of a signed
    long data is -2^(63) and with a maximum value of 2^(63)-1\. For Java versions
    SE 8 and later, long data types can be used for representing unsigned 64-bit long.
    These have minimum value of 0 and maximum value of 2^(64)-1\. These are used when
    there is a need for wider range of values than those offered by the data type
    int. Long class data incorporates methods such as divideUnsigned and compareUnsigned.
    These methods support mathematical (arithmetic) operations that can be used for
    unsigned long.


    Float


    This type of data is single-precision, 32-bit IEEE 754 floating point. float is
    used instead of using double to save some memory when working with large arrays
    that involve floating point numbers. However, this data type is not recommended
    for use with precise values, such as currency.


    double


    This data type is 64-bit double-precision IEEE 754 floating point. The double
    data type is most often the default choice when working with decimal values. However,
    this must never be used when working with precise values like currencies.


    boolean


    There are only 2 possible values for the boolean data type: true and false. boolean
    is useful in creating simple flags for tracking true/false conditions. This type
    of data corresponds to 1 bit of information. However, the size isn’t precisely
    defined.


    char


    The char is a single 16-it Unicode character. The minimum value is 0 or ‘\u0000’
    and the maximum value is 65, 535 inclusive or ‘\uffff’.


    DEFAULT VALUES


    Declaring fields does not always require assignment of values. The compiler would
    automatically set declared but uninitialized fields within reasonable default
    values. In general, the default is 0 or null, which often depends on the type
    of data. While this may be done, relying on default values is widely considered
    as bad programming style.


    Default vales for fields for the primitive data types are:


    byte 0


    int 0


    short 0


    long 0l


    double 0.0d


    float 0.0f


    string null


    char ‘\u0000’


    boolean false


    There is a slight difference with local variables, though. For uninitialized local
    variables, the compiler will never assign a default value. If the local variable
    cannot be initialized where it was declared, then ensure to assign a value before
    using it. Otherwise, compile-time error would occur when accessing uninitialized
    local variables.


    LITERALS


    Literals are source codes that represent a fixed value. These are directly represented
    into the code without requiring any computation. Assigning literals to primitive
    values is possible, as see in the following examples:


    char capitalC = ''C'';


    boolean result = true;


    byte b = 100;


    int i = 100000;


    short s = 10000;


    Integer Literals


    Integer literals are long data types if these end with l or L. If not, then these
    literals are of type int. The upper case form of the letter L is most recommended
    to use because it is difficult to distinguish the lower case l from the numeral
    1.'
