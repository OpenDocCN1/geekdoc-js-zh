    a.push(0);\na;\n```\n\nThe final value of `a` should be `[30, 20, 10, 0]`.\n\n\
    The first expression just outputs the length of `a`. The second reverses `a` so\
    \ `a` is now `[30, 20, 10]`. The third statement adds `0` on to the end of `a`.\
    \ The final expression `a` evaluates to `[30, 20, 10, 0]`.\n\n## 6.4 JavaScript\
    \ objects\n\nJavaScript objects are **(unordered) lists** of **name-value pairs**.\
    \ For example:\n\n```\nlet carrot = {\n  foodGroup: \"vegetable\",\n  color: \"\
    orange\"\n}\n```\n\nEach name-value pair is known as a **property**. Each property\
    \ has a **name** (e.g. `foodGroup`, `color`, `id`, `height`, `data`) and a **value**.\
    \ The value can be any type (including array or object). You can access properties\
    \ using a dot followed by the property name:\n\n```\ncarrot.foodGroup;  // \"\
    vegetable\"\n```\n\nAn object’s property may also be accessed using the property\
    \ name (expressed as a string) enclosed in square brackets:\n\n```\ncarrot[\"\
    foodGroup\"];  // \"vegetable\"\n```\n\nThe advantage of the square bracket notation\
    \ is that a variable can be used as the property name:\n\n```\nlet day = \"Tuesday\"\
    ;\n\nlet data = {\n  Monday: 20,\n  Tuesday: 30,\n  Wednesday: 10,\n  Thursday:\
    \ 50,\n  Friday: 70\n};\n\ndata[day];  // 30\n```\n\nProperty values can be any\
    \ type. Here’s an object containing arrays:\n\n```\nlet data = {\n  Monday: [10,\
    \ 30, 20],\n  Tuesday: [50, 20, 30],\n  Wednesday: [40, 10, 20],\n  Thursday:\
    \ [30, 10, 20],\n  Friday: [60, 30, 40]\n};\n\ndata.Tuesday;    // [50, 20, 30]\n\
    data.Tuesday[1]  // 20\n```\n\nYou can also have arrays of objects. This is a\
    \ **very** common structure in data visualisation:\n\n```\nlet data = [\n  {\n\
    \    name: \"Spain\",\n    capital: \"Madrid\",\n    population: 46.66\n  },\n\
    \  {\n    name: \"China\",\n    capital: \"Beijing\",\n    population: 1386\n\
    \  }\n];\n\ndata[0].name;     // \"Spain\"\ndata[1].capital;  // \"Beijing\"\n\
    ```\n\nGiven an object such as:\n\n```\nlet vegetable = {\n  name: \"carrot\"\
    ,\n  color: \"orange\"\n};\n```\n\nYou can set properties using the following\
    \ notation:\n\n```\nvegetable.name = \"broccoli\";\nvegetable.color = \"green\"\
    ;\nvegetable.name;  // \"broccoli\"\n```\n\nYou can use the above notation even\
    \ if the property doesn’t exist:\n\n```\nvegetable.family = \"Brassica\";\n```\n\
    \nTo get a list of an object’s property names use:\n\n```\nObject.keys(vegetable);\
    \  // [\"name\", \"color\", \"family\"]\n```\n\nThis returns the array `[\"name\"\
    , \"color\", \"family\"]`.\n\n### 6.4.1 Exercises\n\nOpen [jsconsole](https://jsconsole.com/)\
    \ and create the following object:\n\n```\nlet carrot = {\n  foodGroup: \"vegetable\"\
    ,\n  color: \"orange\"\n}\n```\n\nUse `shift` + `return` instead of just `return`\
    \ to insert new lines within a single statement. Or click [here](https://jsconsole.com/?let%20carrot%20%3D%20%7B%0A%20%20foodGroup%3A%20%22vegetable%22%2C%0A%20%20color%3A%20%22orange%22%0A%7D)\
    \ for a pre-populated console.\n\nType the following:\n\n```\ncarrot.color;\n\
    ```\n\nCheck that this returns the string `\"orange\"`. Now change the colour\
    \ to `purple` by typing:\n\n```\ncarrot.color = \"purple\";\n```\n\nCheck the\
    \ colour has changed by typing:\n\n```\ncarrot.color;\n```\n\nThis should output\
    \ `\"purple\"`. You can also view the object by typing:\n\n```\ncarrot\n```\n\n\
    Now add a new property named `price` with value `15` to the object and check that\
    \ it’s been added.\n\n## 6.5 JavaScript operators\n\nJavaScript operators take\
    \ one or two values and compute a new value.\n\nFor example the `+` operator takes\
    \ two numbers and computes the sum of the numbers.\n\nIn the following table these\
    \ variables are defined:\n\n```\nlet a = 1;\nlet b = 2;\n```\n\nThe most common\
    \ operators are:\n\n| **Operator** | **Description** | **Examples** | **Evaluates\
    \ to** |\n\n| --- | --- | --- | --- |\n\n| `+` | Adds two numbers or joins two\
    \ strings | `1 + 2`, `\"abc\" + \"def\"`, `a + b` | `3`, `\"abcdef\"`, `3` |\n\
    \n| `-` | Subtracts two numbers | `3 - 2` | `1` |\n\n| `*` | Multiplies two numbers\
    \ | `2 * 8` | `16` |\n\n| `/` | Divides two numbers | `10 / 5` | `2` |\n\n| `%`\
    \ | Computes the remainder of a division | `11 / 5` | `1` |\n\n| `!` | Inverts\
    \ a boolean | `!true` | `false` |\n\n| `>`, `>=`, `<`, `<=` | Greater than, greater\
    \ or equal to, less than and less than or equal. | `5 < 6`, `5 < 5`, `5 <= 5`,\
    \ `\"a\" > \"b\"`, `\"abc\" < \"def\"`, `a > b` | `true`, `false`, `true`, `false`,\
    \ `true`, `false` |\n\n| `===` | Is equal to | `10 === 10`, `\"dogs\" === \"cats\"\
    `, `a === b` | `true`, `false`, `false` |\n\n| `!==` | Is not equal to | `10 !==\
    \ 10`, `\"dogs\" !== \"cats\"` | `false`, `true` |\n\n| `&&` | Logical and (`true`\
    \ if both expressions are `true`) | `2 > 1 && 3 > 2` | `true` |\n\n| `\\&#124;`\
    \ | Logical or (`true` if either expression is `true`) | `1 > 2 \\&#124; 2 > 3`\
    \ | `false` |\n\nNote that the equality operator is three equal signs `===`. This\
    \ operator checks that two expressions are exactly equal. There’s a similar operator\
    \ `==` which is less strict. In general I recommend using `===`.\n\n### 6.5.1\
    \ Ternary operator\n\nThere’s an operator known as the ternary operator which\
    \ deserves a special mention. The ternary operator evaluates one of two expressions\
    \ depending on the value of a third expression:\n\n```\nlet a = 10;\nlet b = 20;\n\
    let result = a > b ? \"a is bigger than b\" : \"a is not bigger than b\";\nresult;\
    \     // outputs \"a is not bigger than b\"\n```\n\nIn this example the expression\
    \ `a > b` is evaluated. If `true` the first expression after the question mark\
    \ is evaluated. If `false` the expression after the colon `:` is evaluated.\n\n\
    ### 6.5.2 Increment and decrement\n\nThe increment `++` operator takes a numeric\
    \ variable and increments it:\n\n```\nlet a = 10;\na++;\na;  // 11\n```\n\nIt’s\
    \ basically shorthand for:\n\n```\na = a + 1;\n```\n\nThere’s also a decrement\
    \ operator `--` that decrements a variable.\n\n### 6.5.3 Exercises"
