  trans: "\n\n从**文件**菜单中选择**新建**，并将以下 CSS 代码添加到新文件中：\n\n```\nh1 {\n  color: orange;\n\
    }\n```\n\n`style.css`\n\n从**文件**菜单中选择**保存**，当对话框出现时，在你的项目目录中创建一个名为 `css` 的新目录。进入\
    \ `css` 目录，然后将新文件保存为 `style.css`。你的目标目录结构如下：\n\n```\nmy_website\n  css\n    style.css\n\
    \  index.html\n```\n\n现在你需要在 `index.html` 中链接你的 CSS 文件。点击左侧边栏中的 `index.html` 开始编辑你的\
    \ HTML 文件。添加包含 `<link>` 标签的行（如下高亮所示）：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n  <head>\n    <meta charset=\"utf-8\">\n    <title>我的网页</title>\n    <link\
    \ rel=\"stylesheet\" href=\"css/style.css\">\n  </head>\n\n  <body>\n    <h1>你好！</h1>\n\
    \  </body>\n</html>\n```\n\n`index.html`\n\n保存 `index.html` 并检查你的浏览器（你可能需要刷新页面）。标题现在应该是**橙色**。\n\
    \n#### 7.2.6.2 添加一个 JavaScript 文件\n\n从**文件**菜单中选择**新建**，并将以下 JavaScript 代码添加到新文件中：\n\
    \n```\n alert(\"Hello!\");\n```\n\n`main.js`\n\n从**文件**菜单中选择**保存**，当对话框出现时，在你的项目目录中创建一个名为\
    \ `src` 的新目录。进入 `src` 目录，然后将新文件保存为 `main.js`。你的目标目录结构如下：\n\n```\nmy_website\n\
    \  css\n    style.css\n  src\n    main.js\n  index.html\n```\n\n现在你需要在 `index.html`\
    \ 中添加一个指向 JavaScript 文件的链接。点击左侧边栏中的 `index.html` 开始编辑你的 HTML 文件。添加包含 `<script>`\
    \ 标签的行（如下高亮所示）：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta\
    \ charset=\"utf-8\">\n    <title>我的网页</title>\n    <link rel=\"stylesheet\" href=\"\
    css/style.css\">\n  </head>\n\n  <body>\n    <h1>你好！</h1>\n    <script src=\"\
    src/main.js\"></script>\n  </body>\n</html>\n```\n\n`index.html`\n\n保存 `index.html`\
    \ 并检查你的浏览器（你可能需要刷新页面）。应该会弹出一个显示“Hello!”的提示框。\n\n### 7.2.7 总结\n\n本节展示了如何设置一个包含以下组件的\
    \ Web 开发环境：\n\n*   一个代码编辑器\n\n*   一个 Web 浏览器\n\n*   一个本地 Web 服务器\n\n你学习了如何创建一个由\
    \ HTML 文件、CSS 文件和 JavaScript 文件组成的简单网站。这是大多数 Web 应用程序和基于 Web 的数据可视化的基础。\n\n"
