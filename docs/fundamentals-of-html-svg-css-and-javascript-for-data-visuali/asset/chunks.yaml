  trans: "\n\n请注意，该函数没有名称。这是一个 `匿名函数` 的示例。这些函数是“即时”定义的，通常不会在代码的其他地方被调用。它们将在 JavaScript\
    \ 函数（进阶）章节中介绍。\n\n你可以使用命名函数重写上述代码：\n\n```\nlet data = [10, 50, 40, 30, 20];\n\n\
    function output(message) {\n  console.log(message);\n}\n\ndata.forEach(output);\n\
    ```\n\n这样写更冗长，但确实允许函数在其他地方被复用。\n\n在遍历数组时，你也可以使用 `for` 循环：\n\n```\nvar data = [10,\
    \ 50, 40, 30, 20];\n\nfor (let i = 0; i < data.length; i++) {\n  console.log(data[i]);\n\
    }\n```\n\n不过，如果可能的话，我建议使用 `forEach`，因为它更具表现力。（“表现力”指的是代码的意图对其他开发者来说更清晰。）\n\n###\
    \ 6.8.3 map\n\n`map` 语句接收一个数组，并返回一个长度相同的新数组。新数组的每个元素都由原始数组中对应的元素计算得出。一个函数决定了新值如何计算。\n\
    \n下面是一个示例，其中 `map` 用于遍历 `data`，并输出一个新数组，其中每个元素都翻倍：\n\n```\nlet data = [10, 50,\
    \ 40, 30, 20];\n\nlet doubled = data.map(function(d) {\n  return d * 2;\n});\n\
    \ndoubled;  // [20, 100, 80, 60, 40]\n```\n\n对于 `data` 中的每个元素，都会调用该函数。第一个元素 `10`\
    \ 被传入函数，函数返回 `10 * 2`，这个值会被赋给新数组的第一个元素。第二次调用时传入 `50`，返回 `50 * 2` 并添加到新数组，以此类推。\n\
    \n`map` 在处理数据时非常常见。例如，给定以下数据：\n\n```\nlet data = [\n  {\n    name: \"Anna\",\n\
    \    value: \"20.1\"\n  },\n  {\n    name: \"Brian\",\n    value: \"15.3\"\n \
    \ }\n];\n```\n\n我们可能希望将 `name` 属性转换为大写，并将 `value` 属性从字符串转换为数字。\n\n首先编写一个函数，该函数接收一个对象（包含\
    \ `name` 和 `value` 属性），并返回一个包含两个转换后属性的新对象：\n\n```\nfunction convert(d) {\n  let\
    \ newObject = {\n    name: d.name.toUpperCase(),\n    value: parseFloat(d.value)\n\
    \  };\n\n  return newObject;\n}\n```\n\n现在使用 `map` 创建一个新数组：\n\n```\nlet converted\
    \ = data.map(convert);\n```\n\n`converted` 将如下所示：\n\n```\n[\n  {\n    name: \"\
    ANNA\",\n    value: 20.1\n  },\n  {\n    name: \"BRIAN\",\n    value: 15.3\n \
    \ }\n]\n```\n\n上面的示例可以使用匿名函数重写：\n\n```\nlet converted = data.map(function(d) {\n\
    \  let newObject = {\n    name: d.name.toUpperCase(),\n    value: parseFloat(d.value)\n\
    \  };\n\n  return newObject;\n});\n```\n\n### 6.8.4 练习\n\n打开 [jsconsole](https://jsconsole.com/)\
    \ 并创建一个数字数组：\n\n```\nlet a = [10, 20, 30, 40, 50];\n```\n\n尝试以下操作：\n\n1.  使用 `forEach`\
    \ 遍历数组，输出每个数字的平方。（使用 `console.log` 输出数字。）\n\n2.  使用 `map` 创建一个数组，其中包含 `a` 中每个元素的平方。\n\
    \n请记住，在 jsconsole 中，使用 `shift` + `return` 可以在单个语句中创建新行。\n\n#### 6.8.4.1 答案\n\n\
    使用 `forEach` 输出每个数字的平方：\n\n```\na.forEach(function(d) {\n  console.log(d * d);\n\
    });\n```\n\n使用 `map` 创建一个包含 `a` 中每个元素平方的数组：\n\n```\nlet squared = a.map(function(d)\
    \ {\n  return d * d;\n});\n\nsquared;     // [100, 400, 900, 1600, 2500]\n```\n\
    \n## 6.9 JavaScript 函数（进阶）\n\n### 6.9.1 命名函数与匿名函数\n\n函数通常有一个名称：\n\n```\nfunction\
    \ addTen(x) {\n  return x + 10;\n}\n```\n\n这使得它们可以在程序的任何地方被调用。然而，在使用 `forEach`\
    \ 或 `map`（参见迭代章节）时，使用 `匿名函数` 通常更方便。这是一个没有名称的函数，作为 `forEach` 或 `map` 的第一个参数定义。因此，与其这样写：\n\
    \n```\nlet data = [10, 50, 40, 30, 20];\n\nfunction output(message) {\n  console.log(message);\n\
    }\n\ndata.forEach(output);\n```\n\n你可以这样写：\n\n```\nlet data = [10, 50, 40, 30,\
    \ 20];\n\ndata.forEach(function(message) {\n  console.log(message);\n});\n```\n\
    \n这样代码更简洁，并且是 JavaScript 中一种**非常**常见的模式。（D3 经常使用这种模式。）我强烈建议正确理解这种模式。研究上面的两个代码示例，并尝试理解两者之间的区别和相似之处。\n\
    \n### 6.9.2 纯函数\n\n纯函数是没有 `副作用` 的函数。副作用是指函数外部发生的变化。例如：\n\n```\nlet outside = 10;\n\
    \nfunction doSomething() {\n  outside = 20;\n}\n```\n\n调用 `doSomething` 会导致变量\
    \ `outside` 发生变化。这被认为是一种副作用。纯函数（没有副作用）的示例如下：\n\n```\nlet outside = 10;\n\nfunction\
    \ doSomething() {\n  return 20;\n}\n\noutside = doSomething();\n```\n\n该函数只返回一个值，不会影响函数外部的任何内容。纯函数的优点是它们具有更可预测的行为。它们有输入值（通过参数列表）和一个输出。你知道，如果调用一个纯函数，它不会导致该函数外部的任何东西发生变化。\n\
    \n### 6.9.3 函数是对象\n\nJavaScript 函数的行为类似于对象。这意味着你可以对函数执行任何可以对对象执行的操作。例如，你可以将函数赋值给一个变量：\n\
    \n```\nlet getANumber = function() {\n  return 10;\n}\n\ngetANumber();\n```\n\n\
    上面的代码等同于：\n\n```\nfunction getANumber() {\n  return 10;\n}\n\ngetANumber();\n\
    ```\n\n你可以将函数添加到对象中：\n\n```\nlet myFunctions = {\n  add: function(a, b) {\n  \
    \  return a + b;\n  },\n  subtract: function(a, b) {\n    return a - b;\n  }\n\
    };\n\nmyFunctions.add(10, 20);       // 30\nmyFunctions.subtract(20, 10);  //\
    \ 10\n```\n\n#### 6.9.3.1 将函数传入函数\n\n你也可以将函数作为参数传入其他函数：\n\n```\nfunction add(a,\
    \ b) {\n  return a + b;\n}\n\nfunction multiply(a, b) {\n  return a * b;\n}\n\n\
    function getValue(a, b, operation) {\n  return operation(a, b);\n}\n\ngetValue(10,\
    \ 20, add);          // 30\ngetValue(10, 20, multiply);     // 200\n```\n\n这里我们定义了三个函数：\n\
    \n*   `add` 接收两个数字并返回它们的和\n\n*   `multiply` 接收两个数字并返回它们的乘积\n\n*   `getValue` 接收两个数字和一个函数\n\
    \n当第一次调用 `getValue` 时，`add` 函数被传入并赋值给 `operation` 参数。因此，当 `operation` 被调用时（在 `getValue`\
    \ 内部），`add` 被执行。\n\n在第二次调用 `getValue` 时，`multiply` 函数被传入，这意味着 `operation` 的值是\
    \ `multiply`。因此，当 `operation` 被调用时，`multiply` 被执行。\n\n导航到 [`codepen.io/createwithdata/pen/abvJmPY`](https://codepen.io/createwithdata/pen/abvJmPY)\
    \ 在 CodePen 中查看此示例\n\n花点时间理解这个示例。这是相当高级的 JavaScript，但在使用 D3 时，函数经常被传入其他函数。\n\n\
    # 7 工具与设置\n\n本书在代码示例中使用了 CodePen。CodePen 是构建小型应用程序的不错工具，但较大的应用程序通常是在本地开发的。这意味着使用**你计算机上**的工具和文件（而不是在网络上）。本章概述了在本地开发\
    \ Web 应用程序的典型设置。这与大多数 Web 开发人员使用的设置类似。\n\n第一部分概述了必要的工具，第二部分将引导你完成这些工具的设置。\n\n\
    ## 7.1 Web 开发工具\n\nWeb 开发所需的工具包括：\n\n*   **代码编辑器**\n\n*   **Web 浏览器**\n\n*   **Web\
    \ 服务器**（如果你不加载数据，则不是那么重要）\n\n"
- fmt: "\nYou could also add a **terminal emulator** to this list. A terminal emulator\
    \ allows you to interact with your operating system via text commands. For example\
    \ Terminal (on MacOS) and the Command shell (on Windows). You can work through\
    \ all the material in this book without a terminal emulator so I won’t cover them\
    \ in this book. If you’d like to learn more I suggest a web search for ‘command\
    \ line tutorial’.\n\n### 7.1.1 Code editor\n\nA code editor is a desktop application\
    \ that allows you to edit HTML, CSS and JavaScript files. You can use simple applications\
    \ such as Notepad (on Windows) and TextEdit (on Mac). It’s important that these\
    \ editors work in plain text mode so that they don’t insert extra characters.\
    \ However I recommend using a dedicated code editor such as [Brackets](http://brackets.io/)\
    \ or [Visual Studio Code](https://code.visualstudio.com/). Both of these are free\
    \ and multi-platform. Advantages of using a dedicated code editor include:\n\n\
    *   you can treat your application as a project making it easier to open and navigate\n\
    *   syntax highlighting (code is coloured according to whether its a keyword,\
    \ a variable etc.)\n*   numerous plug-ins (including web servers!) that make your\
    \ life as a coder easier\n\n### 7.1.2 Web browser\n\nA modern web browser such\
    \ as Chrome, Firefox, Safari or Edge is recommended for web development. Create\
    \ With Data books assume that **Chrome** is being used. The majority of material\
    \ will apply regardless of your browser choice but there may be differences if\
    \ the debugging tools are used, as these differ from browser to browser.\n\n###\
    \ 7.1.3 Web server\n\nA web server typically returns (or ‘serves’) HTML, CSS and\
    \ JavaScript files in response to requests from a web browser. For example if\
    \ you type `createwithdata.com` into a web browser the browser connects with a\
    \ web server and requests files that make up that website. The web server responds\
    \ by sending the requested files back to the browser.\n\nWhen you create a web\
    \ site on your own computer you don’t necessarily need your own web server running.\
    \ (You can open an HTML file directly in most web browsers.) However if you need\
    \ to make requests from within your web application (as is usually the case with\
    \ web based data visualisations) you will need your own local web server. (This\
    \ is due to security restrictions in web browsers.) If you’re an experienced developer\
    \ and are comfortable setting up a local web server, feel free to skip ahead.\n\
    \nThe options for running a local web server (starting at the easiest) include:\n\
    \n*   Brackets editor built-in web server\n*   Visual Studio Code plug-ins\n*\
    \   Python, Ruby, PHP or Node servers\n\nAnother option which I’ve not personally\
    \ explored is [Servez](https://greggman.github.io/servez/) which is a simple GUI\
    \ based web server.\n\n#### 7.1.3.1 Brackets web server\n\n[Brackets](http://brackets.io/)\
    \ has a built in web server so this is by far the easiest option. This [video](https://youtu.be/KJXdvaY9lTA?t=122)\
    \ gives a good demonstration. If you’re new to code editors I recommend using\
    \ Brackets.\n\n#### 7.1.3.2 VS Code Live Server\n\nVisual Studio Code has a web\
    \ server plug-in called [Live Server](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer).\n\
    \nTo install Live Server:\n\n*   select ‘View’ and then ‘Command Palette…’ from\
    \ the menu bar\n\n![](resources/d717b39536c6d8db2b2de77247886680.png)\n\nOpen\
    \ Command Palette in VS Code\n\n*   type ‘extension’ and select ‘Extensions: Install\
    \ Extensions’\n\n![](resources/758fc48409e013f521b425ce750d31e1.png)\n\nSelect\
    \ Extensions: Install Extensions\n\n*   search for ‘live server’ (by Ritwick Dey)\
    \ in the extensions search box and click Install\n\n![](resources/a1d14e404fc8f56eec28c40e0dfd2567.png)\n\
    \nSearch for ‘live server’\n\n*   open a directory containing your code\n\n![](resources/a4466b2227af9203170369748abdee9f.png)\n\
    \nOpen a directory cotaining your code\n\n*   click the **Go Live** button in\
    \ the bottom bar\n\n![](resources/7639d9be85c152e9a18293484e41967d.png)\n\nClick\
    \ the Go Live button\n\nYour web browser should then open your web application.\
    \ If it doesn’t, open a web browser and go to `localhost:5500`. (If a different\
    \ port number to 5500 is shown in the ‘Server is Started’ message, use that number\
    \ instead.) More detailed instructions are [here](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer).\n\
    \n![](resources/e7600c7555f3ff521f83a1b460d49485.png)\n\nServer has started\n\n\
    #### 7.1.3.3 Python, Ruby, PHP, Node\n\nIf you’re a Python, Ruby or PHP developer\
    \ you can use the language’s built in webserver. There are some useful instructions\
    \ [here](https://gist.github.com/willurd/5720255). MacOS includes Python and Ruby\
    \ so you can use one of these if you’re a Mac user. If you’re a JavaScript developer\
    \ using Node you can use [http-server](https://www.npmjs.com/package/http-server).\n\
    \n## 7.2 Example set-up\n\nThis section takes you through setting up a web development\
    \ environment and the creation of a simple website (using HTML, CSS and JavaScript).\n\
    \nThe steps are:\n\n*   **create a directory** for your project\n*   choose and\
    \ install a **code editor**\n*   create a simple **HTML** file\n*   get a local\
    \ **web server** up and running\n*   add **CSS** and **JavaScript** files\n\n\
    We’ll use VS Code and its Live Server extension. If you’re comfortable using a\
    \ different editor and web server then please feel free to do so.\n\n### 7.2.1\
    \ Create a project directory\n\nUsing File Explorer (Windows) or Finder (Mac)\
    \ create a directory (or folder) that’ll contain your project. Name it `my_website`\
    \ (or something similar). You might want to place it in another directory named\
    \ `coding_projects` (or similar) if you plan on having more than one project.\n\
    \n### 7.2.2 Install a code editor\n\n1. Download VS Code from [here](https://code.visualstudio.com/)\
    \ and install\n2. Run VS Code\n\n### 7.2.3 Create a minimal HTML file\n\nIn this\
    \ section you’ll create a simple HTML file. In VS Code select **New** from the\
    \ **File** menu. VS Code creates a new (unsaved and untitled) file.\n\nThe following\
    \ code is just about the shortest and valid HTML document possible. It serves\
    \ as a good starting point to a new web page. Copy it and paste into your new\
    \ document.\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    utf-8\">\n    <title>My webpage</title>\n  </head>\n\n  <body>\n    <h1>Hello!</h1>\n\
    \  </body>\n</html>\n```\n\n`index.html`\n\nUsually the only code you’ll need\
    \ to change is the title (between the `<title>` tags and the content (between\
    \ the `<body>`) tags.\n\nSelect **Save** from the **File** menu, navigate to your\
    \ project directory, name your file `index.html` and click Save. (It’s important\
    \ to name your file `index.html`.) Once your file is saved you should see `index.html`\
    \ appear in the sidebar.\n\n### 7.2.4 Install Live Server extension\n\nFollow\
    \ the instructions earlier in this chapter to install the Live Server extension.\n\
    \n### 7.2.5 Start Server\n\nIf you haven’t already, select **Open Folder…** from\
    \ the **File** menu and select your `my_website` directory. You should see your\
    \ new directory appear in the sidebar. Now click on the **Go Live** button that\
    \ appears in the bottom bar.\n\n![](resources/8dc438bb3ddde54df5c5ca1458b88a29.png)\n\
    \nClick the Go Live button in VS Code\n\nMake sure your browser is pointing at\
    \ `localhost:5500` (use whichever port number is displayed in the bottom bar).\n\
    \n![](resources/dee9aa4bc88e5e8d643c872b93f92954.png)\n\nServer has started message\
    \ (with active port number displayed)\n\nYour page should now be visible in the\
    \ web browser (it should say ‘Hello!’). Try editing your HTML file, saving it,\
    \ then refreshing your browser. The changes you’ve made should be visible.\n\n\
    ### 7.2.6 Add CSS and JavaScript files\n\nIn this section you’ll add a CSS file\
    \ and a JavaScript file to your web page. There are usually two steps to adding\
    \ a file to a web page:\n\n*   create the file and save it (with extension `.css`\
    \ for CSS files or `.js` for JavaScript files)\n*   include the file in your `index.html`\
    \ file\n\n#### 7.2.6.1 Add a CSS file\n"
