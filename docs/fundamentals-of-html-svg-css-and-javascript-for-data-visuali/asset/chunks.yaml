  trans: "\n\n```svg\n<svg width=\"800\" height=\"600\">\n  <line x1=\"20\" y1=\"\
    50\" x2=\"220\" y2=\"50\"></line>\n  <rect x=\"20\" y=\"100\" width=\"200\" height=\"\
    50\"></rect>\n  <circle cx=\"300\" cy=\"50\" r=\"50\"></circle>\n  <text x=\"\
    300\" y=\"150\">SVG Text</text>\n  <path d=\"M20,180 l200,0 l0,50 z\"></path>\n\
    </svg>\n```\n\n你可以在 CodePen 上打开这个示例，地址为 [`codepen.io/createwithdata/pen/poJqELb`](https://codepen.io/createwithdata/pen/poJqELb)。\n\
    \n![](img/d3e97ea9e32a9b7452cbdac3052eb599.png)\n\nSVG 形状\n\n尝试以下操作：\n\n1. 让线条变短。\n\
    2. 让圆的半径变小。\n3. 将矩形向上或向下移动。\n4. 更改 `<text>` 元素的内容。\n\nSVG 是基于网页的数据可视化的基石。你在网页上看到的大多数数据可视化（尤其是交互式的）都是基于\
    \ SVG 的。它们通常由你在本节中介绍的元素组成。下次你在网页上看到数据可视化时，试着识别其中可能使用的一些形状。\n\n## 4.3 SVG 变换\n\n\
    SVG 变换可以通过多种方式改变 SVG 元素的位置、大小和形状，包括**平移**、**缩放**和**旋转**。平移变换将元素沿给定的 `x` 和 `y`\
    \ 值移动。缩放变换使元素变大或变小。旋转变换旋转元素。\n\n可以使用 `transform` 属性将变换添加到 SVG 元素。例如：\n\n```svg\n\
    <circle transform=\"translate(100,100)\"></circle>\n```\n\nSVG 变换包括 `translate`、`rotate`、`scale`、`skewX`\
    \ 和 `skewY`。在本节中，我们将介绍 `translate` 和 `rotate`，因为它们在数据可视化中很常见。\n\n### 4.3.1 平移\n\
    \n假设你有一个圆心在 `(0,0)`、半径为 50 的圆：\n\n```svg\n<circle r=\"50\"></circle>\n```\n\n\
    圆的默认位置是 `(0,0)`，对应于 SVG 容器（如下面的灰色框所示）左上角的原点。效果如下：\n\n![](img/e5c8ead4b7c5cf0c5670588f102d282d.png)\n\
    \n默认位置的 SVG 圆\n\n你可以使用 `translate(x,y)` 对圆应用平移变换，其中 `x` 和 `y` 是在 `x` 和 `y` 方向上移动的量：\n\
    \n```svg\n<circle r=\"50\" transform=\"translate(200,75)\"></circle>\n```\n\n\
    上述变换将圆沿 `x` 方向移动 200，沿 `y` 方向移动 75。结果得到一个圆心在 `(200,75)` 的圆：\n\n![](img/002e129474ba0a5783ce3cb97ad4d761.png)\n\
    \n平移 `(200,75)` 后的 SVG 圆\n\n你可以对任何类型的 SVG 元素应用变换，包括 `g` 元素。假设你有一个包含圆和文本标签的 `<g>`\
    \ 元素：\n\n```svg\n<g>\n  <circle r=\"50\"></circle>\n  <text y=\"6\">标签</text>\n\
    </g>\n```\n\n![](img/f38617a9892ff1e7b6fda451f710e968.png)\n\n变换前的 SVG 圆和标签\n\n\
    你可以对组应用平移变换：\n\n```svg\n<g transform=\"translate(100,75)\">\n  <circle r=\"50\"\
    ></circle>\n  <text y=\"6\">标签</text>\n</g>\n```\n\n这会将圆和文本元素移动相同的量：\n\n![](img/99945862c2198d1e33baf852f0965d84.png)\n\
    \n平移后的 SVG 圆和标签\n\n### 4.3.2 旋转\n\n假设你有一个矩形：\n\n```svg\n<rect x=\"50\" y=\"50\"\
    \ width=\"200\" height=\"20\"></rect>\n```\n\n![](img/1cb3b8bfc2f9008e7b44baec21313329.png)\n\
    \n未旋转的 SVG 矩形\n\n你可以使用 `rotate(a)` 应用旋转变换，该变换将元素绕原点 `(0,0)` 顺时针旋转 `a` 度：\n\n```svg\n\
    <rect x=\"50\" y=\"50\" width=\"200\" height=\"20\" transform=\"rotate(20)\"></rect>\n\
    ```\n\n结果如下：\n\n![](img/d422173863d118d3c3dea47ad89afdb8.png)\n\n旋转后的 SVG 矩形（虚线矩形表示未变换的\
    \ `<rect>`）\n\n矩形绕原点 `(0,0)` 旋转了 20 度。（原点是 SVG 容器的左上角。）\n\n你可以在角度后添加坐标来指定新的旋转中心。以下将矩形绕其中心\
    \ `(150,60)` 旋转：\n\n```svg\n<rect x=\"50\" y=\"50\" width=\"200\" height=\"20\"\
    \ transform=\"rotate(20 150 60)\"></rect>\n```\n\n结果如下：\n\n![](img/c1c67c58ad5fa846a7916943e265db3d.png)\n\
    \n绕矩形中心旋转后的 SVG 矩形\n\n### 4.3.3 组合变换\n\n可以通过依次书写变换来组合它们：\n\n```svg\n<rect transform=\"\
    rotate(45) translate(100,0)\"></rect>\n```\n\n重要的是要理解，变换指定的是**坐标系的变换**。例如，在上面的代码片段中，坐标系先旋转\
    \ 45 度，然后平移 `(100,0)`。\n\n让我们更仔细地看看变换是如何组合的。这是一个没有变换的矩形：\n\n```svg\n<rect width=\"\
    50\" height=\"10\"></rect>\n```\n\n效果如下：\n\n![](img/72283a634fcb8c1ea0db9402d89de5c5.png)\n\
    \n未变换的矩形（带坐标系）\n\n现在让我们添加一个旋转变换：\n\n```svg\n<rect width=\"50\" height=\"10\" transform=\"\
    rotate(45)\"></rect>\n```\n\n结果如下：\n\n![](img/64904faff152306e9d8751f828080054.png)\n\
    \n旋转后的坐标系\n\n坐标系旋转了 45 度，矩形绘制在**变换后的坐标系**中。\n\n现在让我们添加一个沿 `x` 方向平移 100 像素的变换：\n\
    \n```svg\n<rect width=\"50\" height=\"10\" transform=\"rotate(45) translate(100,0)\"\
    ></rect>\n```\n\n效果如下：\n\n![](img/5c9ad1fa03bf3749d87a6565eca78545.png)\n\n旋转并平移后的坐标系\n\
    \n坐标系先 1) 绕原点旋转 45 度，然后 2) 沿旋转后的 x 轴方向平移 100 像素。（仅应用旋转变换的坐标系以浅色显示。）\n\n## 4.4\
    \ 练习\n\n以下是带标签的圆 SVG：\n\n```svg\n<svg width=\"800\" height=\"600\">\n  <g transform=\"\
    translate(100,75)\">\n    <circle r=\"50\"></circle>\n    <text y=\"6\">标签</text>\n\
    \  </g>\n</svg>\n```\n\n导航至 [`codepen.io/createwithdata/pen/MWwZjPp`](https://codepen.io/createwithdata/pen/MWwZjPp)\
    \ 在 CodePen 中查看此示例。\n\n![](img/99945862c2198d1e33baf852f0965d84.png)\n\n平移后的 SVG\
    \ 圆和标签\n\n尝试以下操作（在更改代码前试着猜测效果）：\n\n1. 更改 `translate` 变换，观察对带标签的圆组的影响。\n2. 在 `translate`\
    \ 之后添加一个 `rotate` 变换，观察对组的影响。\n\n# 5 CSS\n\nCSS（层叠样式表）是一种用于**样式化**和**定位** HTML\
    \ 和 SVG 元素的语言。样式化意味着改变 HTML 和 SVG 元素的外观（例如**大小**、**颜色**和**字体**）。\n\n在下一节中，我们将了解\
    \ CSS 的结构。然后我们将介绍 CSS 度量单位，接着是常见的 CSS 属性。\n\n## 5.1 CSS 的结构\n\nCSS 样式表是一个**规则**列表。以下是一个单独的\
    \ CSS 规则：\n\n```css\nh1 {\n  color: green;\n  font-size: 20px;\n}\n```\n\n每条规则包含一个**选择器**和一个**声明**列表。在上面的例子中，选择器是\
    \ `h1`，声明是 `color: green;` 和 `font-size: 20px;`。\n\n选择器定义了**哪些** HTML 或 SVG 元素将被样式化。声明定义了元素**如何**被样式化。每个声明由一个**属性**和一个**值**组成。在声明\
    \ `color: green;` 中，属性是 `color`，值是 `green`。\n\n上面例子中的规则意味着所有 `h1` 元素的颜色设置为绿色，字体大小设置为\
    \ 20 像素（高度）。例如，假设你有一个 `<h1>` 元素：\n\n```html\n<h1>标题</h1>\n```\n\n未应用 CSS 规则时，效果如下：\n\
    \n![](img/c915d4d3d5dd1bf7acb228db6b3c3d29.png)\n\n未应用 CSS 的 `h1` 元素\n\n如果你应用\
    \ CSS 规则：\n\n```css\nh1 {\n  color: green;\n  font-size: 20px;\n}\n```\n\n你会得到：\n\
    \n![](img/2091f1019ff68f45518eaabd457affa0.png)\n\n使用 CSS 样式化的 `<h1>` 元素\n\n##\
    \ 5.2 CSS 单位\n\n### 5.2.1 尺寸单位\n\n尺寸可以使用以下单位表示：\n\n| **单位** | **描述** | **示例**\
    \ |\n| --- | --- | --- |\n| `px` | 像素 | `12px` |\n| `rem` | 相对于网页的默认字体大小 | `1.5rem`\
    \ |\n\n"
- fmt: "\n| `%` | Percentage of the value of the element’s parent | `50%` |\n| `vw`\
    \ | Percentage of the viewport’s width | `25vw` |\n| `vh` | Percentage of the\
    \ viewport’s height | `100vh` |\n\nTypically the web page’s default font size\
    \ is `16px` so `1.5rem` means `24px`.\n\nThese units are usually sufficient when\
    \ building data visualisations.\n\n### 5.2.2 Colour units\n\nColours may be expressed\
    \ in the following manner:\n\n| **Type** | **Description** | **Example** |\n|\
    \ --- | --- | --- |\n| Colour name | A colour name. The full list of possible\
    \ colours is [here](https://developer.mozilla.org/en-US/docs/Web/CSS/color_value).\
    \ | `red`, `green`, `steelblue` |\n| RGB | `rgb` followed by red, green and blue\
    \ values in brackets, expressed as numbers `0` to `255`. | `rgb(255, 100, 255)`\
    \ |\n| Hex code | A `#` symbol followed by red, green & blue values in hexadecimal\
    \ (`00` to `FF`). If all three values have duplicate digits e.g. `#FFDD33` you\
    \ can shorten it to `#FD3`. | `#FF595E, #FD3` |\n\nIn my experience the above\
    \ colour units are sufficient when building data visualisations. If you wish to\
    \ dive deeper take a look at MDN’s guide to [HTML colour](https://developer.mozilla.org/en-US/docs/Web/HTML/Applying_color).\n\
    \n## 5.3 CSS Properties\n\nSome CSS properties apply to HTML elements, some apply\
    \ to SVG elements and others apply to both HTML and SVG elements. Let’s start\
    \ by looking at CSS properties for HTML elements.\n\n### 5.3.1 CSS properties\
    \ for HTML\n\nSome of the most common properties for HTML elements are:\n\n| **Property**\
    \ | **Description** | **Example values** | **More info** |\n| --- | --- | ---\
    \ | --- |\n| `color` | Text colour | `red`, `#FF595E`, `rgb(255, 100, 255)` |\
    \ [More](https://developer.mozilla.org/en-US/docs/Web/CSS/color) |\n| `background-color`\
    \ | Background colour | `black`, `#CCC`, `rgb(0, 0, 10)` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/background-color)\
    \ |\n| `border` | Border (around the content of the element) | `solid` (solid\
    \ line), `1px dashed red` (red dashed line) | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/border)\
    \ |\n| `padding` | Width of the space between the content and the border | `10px`,\
    \ `2rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/padding) |\n\
    | `margin` | Width of the space around the border | `10px`, `2rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/margin)\
    \ |\n| `opacity` | Opacity (or transparency) | `0` (transparent), `0.5` (semi-opaque),\
    \ `1` (opaque) | [More](https://developer.mozilla.org/docs/Web/CSS/opacity) |\n\
    | `font-size` | Text size | `12px`, `1.5rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n| `font-family` | Font family | `Helvetica`, `Verdana`, `sans-serif`, `serif`\
    \ | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family) |\n|\
    \ `font-weight` | Font weight | `lighter`, `normal`, `bold` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n| `width` | Width | `200px`, `10rem`, `50%` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/width)\
    \ |\n| `height` | Height | `100px`, `5rem`, `25%` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/height)\
    \ |\n\n### 5.3.2 Exercises\n\nHere’s some HTML:\n\n```\n<p>This is a paragraph\
    \ element.</p>\n```\n\nand some CSS:\n\n```\np {\n  font-size: 1rem;\n  color:\
    \ #335C67;\n  background-color: #FFF3B0;\n  border: 1px solid #aaa;\n  padding:\
    \ 2rem;\n  margin: 1rem;\n  width: 12rem; \n}\n```\n\nThis looks like:\n\n![](resources/a69cdd547614d1363d039cd2b48c6159.png)\n\
    \nA `<p>` element styled with CSS\n\nNavigate to [https://codepen.io/createwithdata/pen/OJQXzKo](https://codepen.io/createwithdata/pen/OJQXzKo)\
    \ to view this example in CodePen.\n\nTry the following:\n\n1.  Edit some of the\
    \ property values (for example you could change some of the colours).\n\n2.  Add\
    \ a rule for changing the opacity of `<p>` elements.\n\n3.  Increase/decrease\
    \ the margin and/or padding to see how they relate.\n\n4.  Increase the border\
    \ width.\n\n5.  Reduce the element width.\n\n6.  Add another `<p>` element to\
    \ the HTML and observe how it looks in the result pane.\n\n### 5.3.3 CSS properties\
    \ for SVG\n\nFor SVG elements the most common properties are:\n\n| **Property**\
    \ | **Description** | **Example values** | **More info** |\n| --- | --- | ---\
    \ | --- |\n| `fill` | The shape’s internal colour | `red`, `#FF595E`, `rgb(255,\
    \ 100, 255)`, `none` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `stroke` | The colour of the shape’s outline | `red`, `#FF595E`, `rgb(255,\
    \ 100, 255)`, `none` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `stroke-width` | The width of the shape’s outline | `1px`, `0.5px` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `opacity` | The opacity of the shape | `0` (transparent), `0.5` (semi-opaque),\
    \ `1` (opaque) | [More](https://developer.mozilla.org/docs/Web/CSS/opacity) |\n\
    | `font-size` | Text size | `12px`, `1.5rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n| `font-family` | Font family | `Helvetica`, `Verdana`, `sans-serif`, `serif`\
    \ | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family) |\n|\
    \ `font-weight` | Font weight | `lighter`, `normal`, `bold` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n| `text-anchor` | Horizontal alignment of text element | `start`, `middle`,\
    \ `end` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/text-anchor)\
    \ |\n\nFor example here’s some SVG:\n\n```\n<svg width=\"400\" height=\"200\"\
    >\n  <g transform=\"translate(100, 75)\">\n    <circle r=\"50\"></circle>\n  \
    \  <text y=\"6\">Label</text>\n  </g>\n</svg>\n```\n\nand some CSS:\n\n```\ncircle\
    \ {\n  fill: #9E2A2B;\n}\n\ntext {\n  font-family: sans-serif;\n  fill: white;\n\
    \  text-anchor: middle;\n}\n```\n\nThis looks like:\n\n![](resources/32d8541e6b176eee9ec5da421c8257b7.png)\n\
    \nAn SVG circle and text styled with CSS\n\nThe first rule sets the colour of\
    \ the circle and the second rule styles the text element. The font family, colour\
    \ and horizontal alignment of the text element are set.\n\nNavigate to [https://codepen.io/createwithdata/pen/YzeWeyY](https://codepen.io/createwithdata/pen/YzeWeyY)\
    \ to view this example in CodePen.\n\n### 5.3.4 Exercise\n\nTry the following:\n\
    \n1.  Set the opacity of the circle to `0.5`.\n\n2.  Increase the font-size of\
    \ the label.\n\n### 5.3.5 Overriding rules\n\nIf more than one CSS declaration\
    \ applies to the same element the lower one takes precedence. For example the\
    \ following two rules:\n\n```\np {\n  font-size: 10px;\n}\n\np {\n  font-size:\
    \ 1.5rem;\n}\n```\n\nresults in `p` elements having a font size of `1.5rem`. (The\
    \ first rule is overriden by the second.)\n\n### 5.3.6 Example\n\nLet’s look at\
    \ a more advanced example. Suppose you’ve the following HTML:\n\n```\n<h1>Main\
    \ title</h1>\n<h2>Subtitle</h2>\n\n<div>\n  <p>Some description text</p>\n</div>\n\
    \n<div>\n  <svg width=\"600\" height=\"300\">\n    <circle cx=\"150\" cy=\"150\"\
    \ r=\"100\"></circle>\n    <rect x=\"300\" y=\"50\" width=\"100\" height=\"200\"\
    ></rect>\n  </svg>\n</div>\n```\n\nand the following CSS:\n\n```\nbody {\n  font-family:\
    \ serif;\n}\n\nh2 {\n  color: #aaa;\n  font-family: sans-serif;\n}\n\np {\n  color:\
    \ #333;\n}\n\ncircle {\n  fill: orange;\n}\n\nrect {\n  fill: none;\n  stroke:\
    \ #aaa;\n  stroke-width: 1px;\n}\n```\n\n(You can view this example on CodePen\
    \ at [https://codepen.io/createwithdata/pen/LYVvBEg](https://codepen.io/createwithdata/pen/LYVvBEg).)\n\
    \nThe first rule’s selector is `body`. The `body` element represents all of the\
    \ content so this rule sets the font family to `serif` on all elements. The next\
    \ rule sets the colour and font family of `h2` elements. This `font-family` declaration\
    \ overrides the `font-family` declaration of the previous rule.\n\nNext is a rule\
    \ to set the colour of `p` elements. We then set the `fill` of `circle` elements\
    \ and the `fill`, `stroke` and `stroke-width` of `rect` elements. The result looks\
    \ like:\n\n![](resources/ccedb05dfcea48b8fef2ee529b81c29e.png)\n\nCSS applied\
    \ to multiple HTML and SVG elements\n\n## 5.4 More CSS selectors\n"
  raw: "| `%` | Percentage of the value of the element’s parent | `50%` |\n\n| `vw`\
    \ | Percentage of the viewport’s width | `25vw` |\n\n| `vh` | Percentage of the\
    \ viewport’s height | `100vh` |\n\nTypically the web page’s default font size\
    \ is 16px so `1.5rem` means `24px`.\n\nThese units are usually sufficient when\
    \ building data visualisations.\n\n### 5.2.2 Colour units\n\nColours may be expressed\
    \ in the following manner:\n\n| **Type** | **Description** | **Example** |\n\n\
    | --- | --- | --- |\n\n| Colour name | A colour name. The full list of possible\
    \ colours is [here](https://developer.mozilla.org/en-US/docs/Web/CSS/color_value).\
    \ | `red`, `green`, `steelblue` |\n\n| RGB | `rgb` followed by red, green and\
    \ blue values in brackets, expressed as numbers `0` to `255`. | `rgb(255, 100,\
    \ 255)` |\n\n| Hex code | A `#` symbol followed by red, green & blue values in\
    \ hexadecimal (`00` to `FF`). If all three values have duplicate digits e.g. `#FFDD33`\
    \ you can shorten it to `#FD3`. | `#FF595E, #FD3` |\n\nIn my experience the above\
    \ colour units are sufficient when building data visualisations. If you wish to\
    \ dive deeper take a look at MDN’s guide to [HTML colour](https://developer.mozilla.org/en-US/docs/Web/HTML/Applying_color).\n\
    \n## 5.3 CSS Properties\n\nSome CSS properties apply to HTML elements, some apply\
    \ to SVG elements and others apply to both HTML and SVG elements. Let’s start\
    \ by looking at CSS properties for HTML elements.\n\n### 5.3.1 CSS properties\
    \ for HTML\n\nSome of the most common properties for HTML elements are:\n\n| **Property**\
    \ | **Description** | **Example values** | **More info** |\n\n| --- | --- | ---\
    \ | --- |\n\n| `color` | Text colour | `red`, `#FF595E`, `rgb(255, 100, 255)`\
    \ | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/color) |\n\n| `background-color`\
    \ | Background colour | `black`, `#CCC`, `rgb(0, 0, 10)` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/background-color)\
    \ |\n\n| `border` | Border (around the content of the element) | `solid` (solid\
    \ line), `1px dashed red` (red dashed line) | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/border)\
    \ |\n\n| `padding` | Width of the space between the content and the border | `10px`,\
    \ `2rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/padding) |\n\
    \n| `margin` | Width of the space around the border | `10px`, `2rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/margin)\
    \ |\n\n| `opacity` | Opacity (or transparency) | `0` (transparent), `0.5` (semi-opaque),\
    \ `1` (opaque) | [More](https://developer.mozilla.org/docs/Web/CSS/opacity) |\n\
    \n| `font-size` | Text size | `12px`, `1.5rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n\n| `font-family` | Font family | `Helvetica`, `Verdana`, `sans-serif`, `serif`\
    \ | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family) |\n\n\
    | `font-weight` | Font weight | `lighter`, `normal`, `bold` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n\n| `width` | Width | `200px`, `10rem`, `50%` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/width)\
    \ |\n\n| `height` | Height | `100px`, `5rem`, `25%` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/height)\
    \ |\n\n### 5.3.2 Exercises\n\nHere’s some HTML:\n\n```\n<p>This is a paragraph\
    \ element.</p>\n```\n\nand some CSS:\n\n```\np {\n  font-size: 1rem;\n  color:\
    \ #335C67;\n  background-color: #FFF3B0;\n  border: 1px solid #aaa;\n  padding:\
    \ 2rem;\n  margin: 1rem;\n  width: 12rem; \n}\n```\n\nThis looks like:\n\n![](resources/a69cdd547614d1363d039cd2b48c6159.png)\n\
    \nA `<p>` element styled with CSS\n\nNavigate to [https://codepen.io/createwithdata/pen/OJQXzKo](https://codepen.io/createwithdata/pen/OJQXzKo)\
    \ to view this example in CodePen.\n\nTry the following:\n\n1.  Edit some of the\
    \ property values (for example you could change some of the colours).\n\n2.  Add\
    \ a rule for changing the opacity of `<p>` elements.\n\n3.  Increase/decrease\
    \ the margin and/or padding to see how they relate.\n\n4.  Increase the border\
    \ width.\n\n5.  Reduce the element width.\n\n6.  Add another `<p>` element to\
    \ the HTML and observe how it looks in the result pane.\n\n### 5.3.3 CSS properties\
    \ for SVG\n\nFor SVG elements the most common properties are:\n\n| **Property**\
    \ | **Description** | **Example values** | **More info** |\n\n| --- | --- | ---\
    \ | --- |\n\n| `fill` | The shape’s internal colour | `red`, `#FF595E`, `rgb(255,\
    \ 100, 255)`, `none` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n\n| `stroke` | The colour of the shape’s outline | `red`, `#FF595E`, `rgb(255,\
    \ 100, 255)`, `none` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n\n| `stroke-width` | The width of the shape’s outline | `1px`, `0.5px` |\
    \ [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n\n| `opacity` | The opacity of the shape | `0` (transparent), `0.5` (semi-opaque),\
    \ `1` (opaque) | [More](https://developer.mozilla.org/docs/Web/CSS/opacity) |\n\
    \n| `font-size` | Text size | `12px`, `1.5rem` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n\n| `font-family` | Font family | `Helvetica`, `Verdana`, `sans-serif`, `serif`\
    \ | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family) |\n\n\
    | `font-weight` | Font weight | `lighter`, `normal`, `bold` | [More](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n\n| `text-anchor` | Horizontal alignment of text element | `start`, `middle`,\
    \ `end` | [More](https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/text-anchor)\
    \ |\n\nFor example here’s some SVG:\n\n```\n<svg width=\"400\" height=\"200\"\
    >\n  <g transform=\"translate(100, 75)\">\n    <circle r=\"50\"></circle>\n  \
    \  <text y=\"6\">Label</text>\n  </g>\n</svg>\n```\n\nand some CSS:\n\n```\ncircle\
    \ {\n  fill: #9E2A2B;\n}\n\ntext {\n  font-family: sans-serif;\n  fill: white;\n\
    \  text-anchor: middle;\n}\n```\n\nThis looks like:\n\n![](resources/32d8541e6b176eee9ec5da421c8257b7.png)\n\
    \nAn SVG circle and text styled with CSS\n\nThe first rule sets the colour of\
    \ the circle and the second rule styles the text element. The font family, colour\
    \ and horizontal alignment of the text element are set.\n\nNavigate to [https://codepen.io/createwithdata/pen/YzeWeyY](https://codepen.io/createwithdata/pen/YzeWeyY)\
    \ to view this example in CodePen.\n\n### 5.3.4 Exercise\n\nTry the following:\n\
    \n1.  Set the opacity of the circle to `0.5`.\n\n2.  Increase the font-size of\
    \ the label.\n\n### 5.3.5 Overriding rules\n\nIf more than one CSS declaration\
    \ applies to the same element the lower one takes precedence. For example the\
    \ following two rules:\n\n```\np {\n  font-size: 10px;\n}\n\np {\n  font-size:\
    \ 1.5rem;\n}\n```\n\nresults in `p` elements having a font size of `1.5rem`. (The\
    \ first rule is overriden by the second.)\n\n### 5.3.6 Example\n\nLet’s look at\
    \ a more advanced example. Suppose you’ve the following HTML:\n\n```\n<h1>Main\
    \ title</h1>\n<h2>Subtitle</h2>\n\n<div>\n  <p>Some description text</p>\n</div>\n\
    \n<div>\n  <svg width=\"600\" height=\"300\">\n    <circle cx=\"150\" cy=\"150\"\
    \ r=\"100\"></circle>\n    <rect x=\"300\" y=\"50\" width=\"100\" height=\"200\"\
    ></rect>\n  </svg>\n</div>\n```\n\nand the following CSS:\n\n```\nbody {\n  font-family:\
    \ serif;\n}\n\nh2 {\n  color: #aaa;\n  font-family: sans-serif;\n}\n\np {\n  color:\
    \ #333;\n}\n\ncircle {\n  fill: orange;\n}\n\nrect {\n  fill: none;\n  stroke:\
    \ #aaa;\n  stroke-width: 1px;\n}\n```\n\n(You can view this example on CodePen\
    \ at [https://codepen.io/createwithdata/pen/LYVvBEg](https://codepen.io/createwithdata/pen/LYVvBEg).)\n\
    \nThe first rule’s selector is `body`. The `body` element represents all of the\
    \ content so this rule sets the font family to `serif` on all elements. The next\
    \ rule sets the colour and font family of `h2` elements. This `font-family` declaration\
    \ overrides the `font-family` declaration of the previous rule.\n\nNext is a rule\
    \ to set the colour of `p` elements. We then set the `fill` of `circle` elements\
    \ and the `fill`, `stroke` and `stroke-width` of `rect` elements. The result looks\
    \ like:\n\n![](resources/ccedb05dfcea48b8fef2ee529b81c29e.png)\n\nCSS applied\
    \ to multiple HTML and SVG elements\n\n## 5.4 More CSS selectors"
