- fmt: "\n![](resources/title_page.png)\n\n![Fundamentals of HTML, SVG, CSS and JavaScript\
    \ for Data Visualisation](resources/title_page.png)\n\n## Fundamentals of HTML,\
    \ SVG, CSS and JavaScript for Data Visualisation\n\n#### Peter Cook\n\nThis book\
    \ is for sale at [http://leanpub.com/html-svg-css-js-for-data-visualisation](http://leanpub.com/html-svg-css-js-for-data-visualisation)\n\
    \nThis version was published on 2022-10-17\n\n![publisher's logo](resources/leanpub-logo.png)\n\
    \n*   *   *   *   *\n\nThis is a [Leanpub](https://leanpub.com) book. Leanpub\
    \ empowers authors and publishers with the Lean Publishing process. [Lean Publishing](https://leanpub.com/manifesto)\
    \ is the act of publishing an in-progress ebook using lightweight tools and many\
    \ iterations to get reader feedback, pivot until you have the right book and build\
    \ traction once you do.\n\n*   *   *   *   *\n\n© 2022 Peter Cook\n\n## Table\
    \ of Contents\n\n## Guide\n\n1.  [Begin Reading](#chap00.xhtml)\n\n# 1 Introduction\n\
    \nWelcome! This book covers the fundamentals of HTML, SVG, CSS and JavaScript\
    \ for those who are interested in visualising data. If you work with data you\
    \ might spend most of your time using Excel, R or Python. You might be tasked\
    \ with creating charts in a Python Jupyter notebook or creating a dashboard using\
    \ R’s Shiny or Python’s Dash. Often these charts are built with HTML, SVG, CSS\
    \ and JavaScript and a good understanding of these languages is useful when you\
    \ need to dive deeper.\n\nOr you might be interested in learning D3 or other JavaScript\
    \ charting libraries. In which case this book can help you get up to speed with\
    \ HTML, SVG, CSS and JavaScript.\n\nThis book doesn’t assume prior knowledge of\
    \ these languages, but it’ll be helpful if you’ve some coding experience. Being\
    \ familiar with a text editor (or IDE) will also be helpful.\n\nIt’s by no means\
    \ a comprehensive tutorial on HTML, SVG, CSS and JavaScript. You’d need a much\
    \ bigger book for that. Think of this book as presenting the minimum of what you\
    \ ought to know if you’re wanting to work with web based data visualisations.\
    \ If you’d like to understand my other data visualisation books (such as D3 Start\
    \ to Finish) you definitely need to understand the content in this book.\n\n##\
    \ 1.1 Setting up\n\nIn order to get started quickly I recommend using [CodePen](https://codepen.io/)\
    \ to look at and experiment with code examples (see next section). At the end\
    \ of this book, in the ‘Tools and Set-up’ chapter I show you how to set up tools\
    \ so that you can write code locally (where the files are stored on your computer\
    \ instead of on CodePen). This takes a bit of time to set up but I recommend this\
    \ approach if you become more serious about web development.\n\n## 1.2 CodePen\n\
    \n[CodePen](https://codepen.io/) is a web site that lets you experiment with HTML,\
    \ SVG, CSS and JavaScript without having to set up any tools.\n\n![](resources/16bd52866cd98207c7c894c118bbd54e.png)\n\
    \nThis is CodePen. You can visit this example at https://codepen.io/createwithdata/pen/VwvpzOg\n\
    \nAt key points in the book there’ll be a link to a CodePen ‘pen’ that contains\
    \ a code example. If you visit the link you’ll be able to view and experiment\
    \ with the code. I encourage you to play around with the CodePen examples - there’s\
    \ very little you can break and learning through experimentation is very effective.\n\
    \nYou can freely edit the CodePen examples from this book and your changes don’t\
    \ affect the original example. If you want to keep your changes, click Fork (at\
    \ the bottom of the page) and create a CodePen account (or log in). Save your\
    \ work by clicking the Save button at the top of the page.\n\n## 1.3 Stay in touch\n\
    \nI love to stay in touch with my readers. One of the best ways to do this is\
    \ via my mailing list. I send occasional messages containing useful information\
    \ related to implementing data visualisations (e.g. using JavaScript or other\
    \ tools). There’ll also be discount codes for my other books. You can sign up\
    \ [here](https://mailchi.mp/085e79e8fd7c/create-with-data-newsletter).\n\n## 1.4\
    \ Translators\n\nIf you’re interested in translating Fundamentals of HTML, SVG,\
    \ CSS and JavaScript for Data Visualisation to another language contact me at\
    \ info@createwithdata.com and I’ll be happy to discuss further.\n\n# 2 Web languages:\
    \ HTML, SVG, CSS & JavaScript\n\nMost websites and web applications (including\
    \ data visualisations) are built from 4 languages: **HTML**, **SVG**, **CSS**\
    \ and **JavaScript**.\n\nHTML stands for Hyper Text Markup Language and describes\
    \ the **content** of a webpage.\n\nSVG stands for Scalable Vector Graphics and\
    \ describes **shapes** such as circles, lines and rectangles. It’s often used\
    \ when visualising data (to describe bars, lines, circles, axes, legends etc.).\n\
    \nCSS stands for Cascading Style Sheets and describes the **style** (such as font\
    \ weight, colour or size) and **position** of HTML and SVG elements.\n\nJavaScript\
    \ is a programming language that can **manipulate** HTML and SVG, do general **computation**\
    \ (such as data manipulation) and handle **interaction**.\n\nWe’ll look at each\
    \ of these in the upcoming chapters.\n\n# 3 HTML\n\nHTML is a language that defines\
    \ the **content** of a webpage. It defines a webpage using elements to define\
    \ headings, paragraphs, images, links etc. For example a paragraph element looks\
    \ like:\n\n```\n<p>This is a paragraph of text.</p>\n```\n\nThe paragraph element\
    \ consists of an **opening tag** `<p>`, some **content** and a **closing tag**\
    \ `</p>`. Tags usually come in pairs. An opening tag looks like `<p>` and a closing\
    \ tag looks like `</p>`.\n\nWhen a web browser loads an HTML document it draws\
    \ each element according to the type of element (paragraph, heading, image etc.).\
    \ For example, the paragraph element above looks like the following when rendered\
    \ in a web browser:\n\n![](resources/bd2b66aaf5793ed7fb6769887aeb954c.png)\n\n\
    A paragraph `<p>` element as rendered in a web browser\n\nThere’s a large number\
    \ of HTML elements but you can achieve a lot with just a few of them. This chapter\
    \ looks at five common elements: headings, lists, images, `div` elements and `svg`\
    \ elements. (These five elements are usually sufficient when visualising data.)\n\
    \n## 3.1 Headings\n\nHeading elements are used for titles. There are six levels\
    \ ranging from large (`<h1>`) to small (`<h6>`).\n\n```\n<h1>Main heading</h1>\n\
    <h2>Sub heading</h2>\n<h3>Level 3 heading</h3>\n<h4>Level 4 heading</h4>\n<h5>Level\
    \ 5 heading</h5>\n<h6>Level 6 heading</h6>\n```\n\nThese elements look like this\
    \ when rendered in a web browser:\n\n![](resources/842934fa7c3b7a8c7ff897a7d13bb3a1.png)\n\
    \nHeading elements `<h1>` to `<h6>` rendered in a web browser\n\n## 3.2 Lists\n\
    \nThe list element `<ul>` is used to represent lists of items. Each item is represented\
    \ by a list item element `<li>` and nested within the `<ul>` element:\n\n```\n\
    <ul>\n  <li>List item one</li>\n  <li>List item two</li>\n</ul>\n```\n\nNotice\
    \ that we’ve indented the `<li>` elements. This is optional but is the usual way\
    \ to indicate nested elements. When displayed in a browser the list looks like:\n\
    \n![](resources/c98f89915d42064563c9f2ccf1eb1b8a.png)\n\nList elements `<ul>`\
    \ and `<li>` rendered in a web browser\n\n## 3.3 Images\n\nImages can be added\
    \ to an HTML document using the `<img>` element. `<img>` elements require an **attribute**\
    \ named `src` that specifies the URL of the image.\n\nImage elements don’t have\
    \ a closing tag. Here’s an image element that displays an image located at `https://picsum.photos/id/127/300/200.jpg`:\n\
    \n```\n<img src=\"https://picsum.photos/id/127/300/200.jpg\">\n```\n\nThis example\
    \ looks like:\n\n![](resources/bd967b4e4ad159da03d87bd9e9dc23fd.png)\n\nImage\
    \ element `<img>` rendered in a web browser\n\nTypically your image files will\
    \ live alongside your source code. For example, you might have an image file `my-image.jpg`\
    \ within a directory named `images`. In this case you’d write:\n\n```\n<img src=\"\
    images/my-image.jpg\">\n```\n"
