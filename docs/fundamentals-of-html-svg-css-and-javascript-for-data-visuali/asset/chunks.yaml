    \nSVG is a cornerstone of web-based data visualisation. Most data visualisation\
    \ you see on the web (particularly if it’s interactive) is SVG based. Typically\
    \ they’ll be made up of the elements you’ve covered in this section. Next time\
    \ you see a data visualisation on the web see if you can identify some of the\
    \ shapes that might be in use.\n\n## 4.3 SVG Transforms\n\nSVG transforms change\
    \ the position, size and shape of an SVG element in a number of ways including\
    \ **translation**, **scaling** and **rotation**. A translation transformation\
    \ moves an element by a given `x` and `y` value. A scaling transformation makes\
    \ an element larger or smaller. A rotation transformation rotates an element.\n\
    \nA transform can be added to a SVG element using the `transform` attribute. For\
    \ example:\n\n```svg\n<circle transform=\"translate(100,100)\"></circle>\n```\n\
    \nSVG transforms include `translate`, `rotate`, `scale`, `skewX` and `skewY`.\
    \ In this section we’ll cover `translate` and `rotate` as these are common in\
    \ data visualisation.\n\n### 4.3.1 Translate\n\nSuppose you have a circle centered\
    \ at `(0,0)` with radius 50:\n\n```svg\n<circle r=\"50\"></circle>\n```\n\nThe\
    \ default position of a circle is `(0,0)` which corresponds to the origin at the\
    \ top left of the SVG container (represented by the grey box below). This looks\
    \ like:\n\n![](resources/e5c8ead4b7c5cf0c5670588f102d282d.png)\n\nSVG circle in\
    \ default position\n\nYou can apply a translate transform to the circle using\
    \ `translate(x,y)` where `x` and `y` are the amounts to move by in the `x` and\
    \ `y` directions:\n\n```svg\n<circle r=\"50\" transform=\"translate(200,75)\"\
    ></circle>\n```\n\nThe above transform moves the circle by 200 in the `x` direction\
    \ and 75 in the `y` direction. This results in a circle centered at `(200,75)`:\n\
    \n![](resources/002e129474ba0a5783ce3cb97ad4d761.png)\n\nSVG circle translated\
    \ by `(200,75)`\n\nYou can apply transforms to any type of SVG element including\
    \ `g` elements. Suppose you have a `<g>` element containing a circle and a text\
    \ label:\n\n```svg\n<g>\n  <circle r=\"50\"></circle>\n  <text y=\"6\">Label</text>\n\
    </g>\n```\n\n![](resources/f38617a9892ff1e7b6fda451f710e968.png)\n\nSVG circle\
    \ and label before transforming\n\nYou can apply a translate transform to the\
    \ group:\n\n```svg\n<g transform=\"translate(100,75)\">\n  <circle r=\"50\"></circle>\n\
    \  <text y=\"6\">Label</text>\n</g>\n```\n\nThis has the effect of moving the\
    \ circle and text element by the same amount:\n\n![](resources/99945862c2198d1e33baf852f0965d84.png)\n\
    \nSVG circle and label after translation\n\n### 4.3.2 Rotate\n\nSuppose you have\
    \ a rectangle:\n\n```svg\n<rect x=\"50\" y=\"50\" width=\"200\" height=\"20\"\
    ></rect>\n```\n\n![](resources/1cb3b8bfc2f9008e7b44baec21313329.png)\n\nSVG rectangle\
    \ without rotation\n\nYou can apply a rotate transform using `rotate(a)` which\
    \ rotates an element by `a` degrees in the clockwise direction about the origin\
    \ `(0,0)`:\n\n```svg\n<rect x=\"50\" y=\"50\" width=\"200\" height=\"20\" transform=\"\
    rotate(20)\"></rect>\n```\n\nThis results in:\n\n![](resources/d422173863d118d3c3dea47ad89afdb8.png)\n\
    \nSVG rectangle with rotation (dotted rectangle represents untransformed `<rect>`)\n\
    \nThe rectangle has rotated 20 degrees about the origin `(0,0)`. (The origin is\
    \ the top left corner of the SVG container.)\n\nYou can specify a new center of\
    \ rotation by adding coordinates after the angle. The following rotates the rectangle\
    \ about its center `(150,60)`:\n\n```svg\n<rect x=\"50\" y=\"50\" width=\"200\"\
    \ height=\"20\" transform=\"rotate(20 150 60)\"></rect>\n```\n\nThis results in:\n\
    \n![](resources/c1c67c58ad5fa846a7916943e265db3d.png)\n\nSVG rectangle with rotation\
    \ about the rectangle’s center\n\n### 4.3.3 Combining transforms\n\nTransforms\
    \ can be combined by writing them one after the other:\n\n```svg\n<rect transform=\"\
    rotate(45) translate(100,0)\"></rect>\n```\n\nIt’s important to understand that\
    \ the transforms specify **transformations of the coordinate system**. For example,\
    \ in the above code snippet, the coordinate system is rotated by 45 degrees then\
    \ translated by `(100,0)`.\n\nLet’s have a closer look how transforms combine.\
    \ Here’s a rectangle without a transform:\n\n```svg\n<rect width=\"50\" height=\"\
    10\"></rect>\n```\n\nThis looks like:\n\n![](resources/72283a634fcb8c1ea0db9402d89de5c5.png)\n\
    \nUntransformed rectangle (with coordinate system)\n\nNow let’s add a rotate transform:\n\
    \n```svg\n<rect width=\"50\" height=\"10\" transform=\"rotate(45)\"></rect>\n\
    ```\n\nThis results in:\n\n![](resources/64904faff152306e9d8751f828080054.png)\n\
    \nRotated coordinate system\n\nThe coordinate system has rotated by 45 degrees\
    \ and the rectangle is drawn in the **transformed coordinate system**.\n\nNow\
    \ let’s add a translation of 100 pixels in the `x` direction:\n\n```svg\n<rect\
    \ width=\"50\" height=\"10\" transform=\"rotate(45) translate(100,0)\"></rect>\n\
    ```\n\nThis looks like:\n\n![](resources/5c9ad1fa03bf3749d87a6565eca78545.png)\n\
    \nRotated and translated coordinate system\n\nThe coordinate system is 1) rotated\
    \ about the origin by 45 degrees then 2) transformed by 100 pixels in the direction\
    \ of the rotated x-axis. (The coordinate system with just the rotate transform\
    \ is shown faintly.)\n\n## 4.4 Exercises\n\nHere’s the labelled circle SVG:\n\n\
    ```svg\n<svg width=\"800\" height=\"600\">\n  <g transform=\"translate(100,75)\"\
    >\n    <circle r=\"50\"></circle>\n    <text y=\"6\">Label</text>\n  </g>\n</svg>\n\
    ```\n\nNavigate to [https://codepen.io/createwithdata/pen/MWwZjPp](https://codepen.io/createwithdata/pen/MWwZjPp)\
    \ to view this example in CodePen.\n\n![](resources/99945862c2198d1e33baf852f0965d84.png)\n\
    \nSVG circle and label after translation\n\nTry the following (see if you can\
    \ guess the effect before changing the code):\n\n1. Change the `translate` transform\
    \ and observe the effect on the labelled circle group.\n2. Add a `rotate` transform\
    \ after the `translate` and see the effect on the group.\n\n# 5 CSS\n\nCSS (Cascading\
    \ Style Sheets) is a language for **styling** and **positioning** HTML and SVG\
    \ elements. Styling means changing the appearance (such as **size**, **colour**\
    \ and **font**) of HTML and SVG elements.\n\nIn the next section we look at the\
    \ structure of CSS. We then look at CSS measurement units followed by common CSS\
    \ properties.\n\n## 5.1 The Structure of CSS\n\nA CSS stylesheet is list of **rules**.\
    \ Here’s a single CSS rule:\n\n```css\nh1 {\n  color: green;\n  font-size: 20px;\n\
    }\n```\n\nEach rule comprises a **selector** and a list of **declarations**. In\
    \ the above example the selector is `h1` and the declarations are `color: green;`\
    \ and `font-size: 20px;`.\n\nThe selector defines **which** HTML or SVG elements\
    \ are to be styled. The declaration defines **how** the elements are to be styled.\
    \ Each declaration consists of a **property** and a **value**. In the declaration\
    \ `color: green;` the property is `color` and the value is `green`.\n\nThe rule\
    \ in the above example means that on all `h1` elements the colour is set to green\
    \ and the font size to 20 pixels (in height). As an example, suppose you have\
    \ an `<h1>` element:\n\n```html\n<h1>The title</h1>\n```\n\nWithout the CSS rule\
    \ applied, this looks like:\n\n![](resources/c915d4d3d5dd1bf7acb228db6b3c3d29.png)\n\
    \n`h1` element without CSS\n\nIf you apply the CSS rule:\n\n```css\nh1 {\n  color:\
    \ green;\n  font-size: 20px;\n}\n```\n\nyou get:\n\n![](resources/2091f1019ff68f45518eaabd457affa0.png)\n\
    \n`<h1>` element styled using CSS\n\n## 5.2 CSS Units\n\n### 5.2.1 Size units\n\
    \nSizes may be expressed using the following units:\n\n| **Unit** | **Description**\
    \ | **Example** |\n| --- | --- | --- |\n| `px` | Pixels | `12px` |\n| `rem` |\
    \ Relative to the web page’s default font size | `1.5rem` |\n"
