  trans: "\n你也可以在这个列表中添加一个**终端模拟器**。终端模拟器允许你通过文本命令与操作系统交互，例如 MacOS 上的“终端”和 Windows\
    \ 上的“命令提示符”。即使没有终端模拟器，你也可以完成本书中的所有内容，因此本书不会涉及它们。如果你想了解更多，建议在网上搜索“命令行教程”。\n\n###\
    \ 7.1.1 代码编辑器\n\n代码编辑器是一种桌面应用程序，允许你编辑 HTML、CSS 和 JavaScript 文件。你可以使用简单的应用程序，如\
    \ Windows 上的“记事本”和 Mac 上的“文本编辑”。重要的是这些编辑器要以纯文本模式工作，以免插入额外字符。不过，我推荐使用专门的代码编辑器，例如\
    \ [Brackets](http://brackets.io/) 或 [Visual Studio Code](https://code.visualstudio.com/)。这两款都是免费且跨平台的。使用专用代码编辑器的优势包括：\n\
    \n*   你可以将应用程序视为一个项目，从而更轻松地打开和导航\n*   语法高亮（代码根据其是关键字、变量等而显示不同颜色）\n*   众多插件（包括\
    \ Web 服务器！）让你的编码生活更轻松\n\n### 7.1.2 网页浏览器\n\n建议使用现代网页浏览器进行 Web 开发，例如 Chrome、Firefox、Safari\
    \ 或 Edge。《用数据创造》系列书籍假定你使用的是 **Chrome**。无论你选择哪种浏览器，大部分内容都适用，但如果使用调试工具，可能会存在差异，因为这些工具因浏览器而异。\n\
    \n### 7.1.3 网页服务器\n\n网页服务器通常根据网页浏览器的请求返回（或“提供”）HTML、CSS 和 JavaScript 文件。例如，如果你在浏览器中输入\
    \ `createwithdata.com`，浏览器会连接到一个网页服务器，并请求构成该网站的文件。网页服务器通过将请求的文件发送回浏览器来响应。\n\n\
    当你在自己的计算机上创建网站时，不一定需要运行自己的网页服务器。（你可以在大多数网页浏览器中直接打开 HTML 文件。）但是，如果你需要从 Web 应用程序内部发出请求（这在基于\
    \ Web 的数据可视化中很常见），你将需要自己的本地网页服务器。（这是由于网页浏览器的安全限制。）如果你是一位经验丰富的开发者，并且能够轻松设置本地网页服务器，请随意跳过。\n\
    \n运行本地网页服务器的选项（从最简单的开始）包括：\n\n*   Brackets 编辑器的内置网页服务器\n*   Visual Studio Code\
    \ 插件\n*   Python、Ruby、PHP 或 Node 服务器\n\n另一个我尚未亲自探索的选项是 [Servez](https://greggman.github.io/servez/)，它是一个基于\
    \ GUI 的简单网页服务器。\n\n#### 7.1.3.1 Brackets 网页服务器\n\n[Brackets](http://brackets.io/)\
    \ 内置了网页服务器，因此这是目前最简单的选项。这个[视频](https://youtu.be/KJXdvaY9lTA?t=122)给出了很好的演示。如果你是代码编辑器新手，我推荐使用\
    \ Brackets。\n\n#### 7.1.3.2 VS Code Live Server\n\nVisual Studio Code 有一个名为 [Live\
    \ Server](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer)\
    \ 的网页服务器插件。\n\n安装 Live Server：\n\n*   从菜单栏中选择“查看”，然后选择“命令面板...”\n\n![](img/d717b39536c6d8db2b2de77247886680.png)\n\
    \n在 VS Code 中打开命令面板\n\n*   输入“extension”并选择“扩展：安装扩展”\n\n![](img/758fc48409e013f521b425ce750d31e1.png)\n\
    \n选择“扩展：安装扩展”\n\n*   在扩展搜索框中搜索“live server”（作者为 Ritwick Dey），然后点击“安装”\n\n![](img/a1d14e404fc8f56eec28c40e0dfd2567.png)\n\
    \n搜索“live server”\n\n*   打开包含你代码的目录\n\n![](img/a4466b2227af9203170369748abdee9f.png)\n\
    \n打开包含你代码的目录\n\n*   点击底部栏中的 **Go Live** 按钮\n\n![](img/7639d9be85c152e9a18293484e41967d.png)\n\
    \n点击 Go Live 按钮\n\n你的网页浏览器应该会打开你的 Web 应用程序。如果没有，请打开网页浏览器并访问 `localhost:5500`。（如果“服务器已启动”消息中显示的不是\
    \ 5500 而是其他端口号，请使用该端口号。）更详细的说明请参见[此处](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer)。\n\
    \n![](img/e7600c7555f3ff521f83a1b460d49485.png)\n\n服务器已启动\n\n#### 7.1.3.3 Python、Ruby、PHP、Node\n\
    \n如果你是 Python、Ruby 或 PHP 开发者，可以使用该语言内置的网页服务器。这里有一些有用的说明[在此](https://gist.github.com/willurd/5720255)。MacOS\
    \ 包含 Python 和 Ruby，因此如果你是 Mac 用户，可以使用其中之一。如果你是使用 Node 的 JavaScript 开发者，可以使用 [http-server](https://www.npmjs.com/package/http-server)。\n\
    \n## 7.2 示例设置\n\n本节将引导你设置 Web 开发环境，并创建一个简单的网站（使用 HTML、CSS 和 JavaScript）。\n\n步骤如下：\n\
    \n*   **为你的项目创建一个目录**\n*   选择并安装一个**代码编辑器**\n*   创建一个简单的 **HTML** 文件\n*   启动并运行一个本地\
    \ **网页服务器**\n*   添加 **CSS** 和 **JavaScript** 文件\n\n我们将使用 VS Code 及其 Live Server\
    \ 扩展。如果你习惯使用其他编辑器和网页服务器，请随意使用。\n\n### 7.2.1 创建项目目录\n\n使用文件资源管理器（Windows）或访达（Mac）创建一个将包含你项目的目录（或文件夹）。将其命名为\
    \ `my_website`（或类似名称）。如果你计划有多个项目，你可能希望将其放在另一个名为 `coding_projects`（或类似名称）的目录中。\n\
    \n### 7.2.2 安装代码编辑器\n\n1. 从[此处](https://code.visualstudio.com/)下载 VS Code 并安装\n\
    2. 运行 VS Code\n\n### 7.2.3 创建一个最小的 HTML 文件\n\n在本节中，你将创建一个简单的 HTML 文件。在 VS Code\
    \ 中，从“文件”菜单中选择“新建”。VS Code 会创建一个新的（未保存且无标题）文件。\n\n以下代码是尽可能短且有效的 HTML 文档。它作为新网页的良好起点。将其复制并粘贴到你的新文档中。\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
    >\n    <title>我的网页</title>\n  </head>\n\n  <body>\n    <h1>你好！</h1>\n  </body>\n\
    </html>\n```\n\n`index.html`\n\n通常你只需要更改标题（在 `<title>` 标签之间）和内容（在 `<body>` 标签之间）。\n\
    \n从“文件”菜单中选择“保存”，导航到你的项目目录，将文件命名为 `index.html`，然后点击“保存”。（将文件命名为 `index.html` 很重要。）文件保存后，你应该会在侧边栏中看到\
    \ `index.html` 出现。\n\n### 7.2.4 安装 Live Server 扩展\n\n按照本章前面的说明安装 Live Server 扩展。\n\
    \n### 7.2.5 启动服务器\n\n如果尚未操作，请从“文件”菜单中选择“打开文件夹...”，然后选择你的 `my_website` 目录。你应该会看到新目录出现在侧边栏中。现在点击底部栏中出现的\
    \ **Go Live** 按钮。\n\n![](img/8dc438bb3ddde54df5c5ca1458b88a29.png)\n\n在 VS Code\
    \ 中点击 Go Live 按钮\n\n确保你的浏览器指向 `localhost:5500`（使用底部栏中显示的端口号）。\n\n![](img/dee9aa4bc88e5e8d643c872b93f92954.png)\n\
    \n服务器已启动消息（显示活动端口号）\n\n现在你的页面应该在网页浏览器中可见（它应该显示“你好！”）。尝试编辑你的 HTML 文件，保存它，然后刷新浏览器。你所做的更改应该可见。\n\
    \n### 7.2.6 添加 CSS 和 JavaScript 文件\n\n在本节中，你将向网页添加一个 CSS 文件和一个 JavaScript 文件。向网页添加文件通常有两个步骤：\n\
    \n*   创建文件并保存（CSS 文件扩展名为 `.css`，JavaScript 文件扩展名为 `.js`）\n*   在 `index.html` 文件中包含该文件\n\
    \n#### 7.2.6.1 添加 CSS 文件\n\n"
- fmt: "\nSelect **New** from the **File** menu and add the following CSS code to\
    \ the new file:\n\n```\nh1 {\n  color: orange;\n}\n```\n\n`style.css`\n\nSelect\
    \ **Save** from the **File** menu and when the dialog appears create a new directory\
    \ called `css` within your project directory. Go into the `css` directory then\
    \ save your new file as `style.css`. You’re aiming for the following directory\
    \ structure:\n\n```\nmy_website\n  css\n    style.css\n  index.html\n```\n\nYou\
    \ now need link to your CSS file in `index.html`. Start editing your HTML file\
    \ by clicking `index.html` in the left sidebar. Add the line with the `<link>`\
    \ tags (highlighted below):\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \    <meta charset=\"utf-8\">\n    <title>My webpage</title>\n    <link rel=\"\
    stylesheet\" href=\"css/style.css\">\n  </head>\n\n  <body>\n    <h1>Hello there!</h1>\n\
    \  </body>\n</html>\n```\n\n`index.html`\n\nSave `index.html` and check your browser\
    \ (you might need to refresh the page). The title should now be **orange**.\n\n\
    #### 7.2.6.2 Add a JavaScript file\n\nSelect **New** from the **File** menu and\
    \ add the following JavaScript code to the new file:\n\n```\n alert(\"Hello!\"\
    );\n```\n\n`main.js`\n\nSelect **Save** from the **File** menu and when the dialog\
    \ appears create a new directory within your project directory called `src`. Go\
    \ into the `src` directory then save your new file as `main.js`. You’re aiming\
    \ for the following directory structure:\n\n```\nmy_website\n  css\n    style.css\n\
    \  src\n    main.js\n  index.html\n```\n\nYou now need to add a link to your JavaScript\
    \ file in `index.html`. Start editing your HTML file by clicking `index.html`\
    \ in the left sidebar. Add the line containing the `<script>` tag (highlighted\
    \ below):\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    utf-8\">\n    <title>My webpage</title>\n    <link rel=\"stylesheet\" href=\"\
    css/style.css\">\n  </head>\n\n  <body>\n    <h1>Hello there!</h1>\n    <script\
    \ src=\"src/main.js\"></script>\n  </body>\n</html>\n```\n\n`index.html`\n\nSave\
    \ `index.html` and check your browser (you might need to refresh the page). An\
    \ alert should appear saying ‘Hello!’.\n\n### 7.2.7 Summary\n\nThis section has\
    \ shown how to set up a web development environment consisting of:\n\n*   a code\
    \ editor\n\n*   a web browser\n\n*   a local web server\n\nYou saw how to create\
    \ a simple web site consisting of an HTML file, a CSS file and a JavaScript file.\
    \ This is the basis for most web applications and web-based data visualisations.\n"
