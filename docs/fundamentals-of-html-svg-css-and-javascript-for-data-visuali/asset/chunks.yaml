  trans: "\n\n上一节展示了如何使用 CSS 为 HTML 和 SVG 元素设置样式。你看到了 CSS 规则如何应用于特定类型的元素。例如：\n\n```\n\
    p {\n  color: #333;\n}\n```\n\n设置了所有 `<p>` 元素的颜色。但是，如果你的网页包含大量 `<p>` 元素，而你只想为**其中一部分**设置样式，该怎么办？\n\
    \n你可以通过以下方法让 CSS 选择器更具体：\n\n*   在 HTML 和 SVG 元素上添加类（class）和 ID\n*   后代选择器\n* \
    \  伪类\n\n这些方法涵盖了大多数需要定位特定元素的情况。让我们逐一了解。\n\n### 5.4.1 类与 ID\n\nHTML 和 SVG 中有两个属性\
    \ `id` 和 `class`，可以让你标记页面中的特定元素。这样你就可以添加针对这些元素的 CSS 规则。`id` 属性用于需要定位单个元素的情况，而\
    \ `class` 属性用于需要定位多个元素的情况。\n\n#### 5.4.1.1 id\n\n`id` 属性允许你标记单个元素，以便在其他地方（通常是\
    \ CSS 或 JavaScript）引用它。例如，你可能有一个需要应用某些 CSS 的主菜单。\n\n让我们创建一个简单的菜单，并添加一个值为 `main-menu`\
    \ 的 `id` 属性：\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n  <div>About</div>\n\
    \  <div>Blog</div>\n  <div>Contact</div>\n</div>\n```\n\n你可以为多个元素添加 id，但每个 id\
    \ 值必须是唯一的。换句话说：两个元素不应具有相同的 id。\n\n在 CSS 中，要选择带有 id 的元素，请使用 `#` 后跟 id 值：\n\n```\n\
    #main-menu {\n  margin: 1rem;\n}\n```\n\n这为菜单添加了外边距。\n\n#### 5.4.1.2 class\n\n\
    `class` 属性用于标记**多个** HTML 和 SVG 元素。例如：\n\n```\n<div id=\"main-menu\">\n  <div\
    \ class=\"item\">Home</div>\n  <div class=\"item\">About</div>\n  <div class=\"\
    item selected\">Blog</div>\n  <div class=\"item\">Contact</div>\n</div>\n```\n\
    \n每个菜单项都被赋予了一个值为 `item` 的 class 属性。class 属性可以有多个值（用空格分隔）。例如，第三个菜单项的 class 属性有两个值：`item`\
    \ 和 `selected`。这表明这个特定的 `div` 元素是列表中的一个项，并且已被选中。\n\n在 CSS 中，可以通过在元素类型后添加一个**点**后跟**类名**来选择具有给定类值的元素：\n\
    \n```\ndiv.item {\n  border: 1px solid #aaa;\n  padding: 1rem;\n}\n\ndiv.selected\
    \ {\n  background-color: #ccc;\n}\n```\n\n这意味着：\n\n*   为每个类值为 `item` 的 `div` 元素添加内边距和边框\n\
    *   设置类值为 `selected` 的 `div` 元素的背景颜色\n\n你也可以省略元素名称，选择所有具有给定类值的元素，无论其类型如何。例如，`.item`\
    \ 选择所有类值为 `item` 的元素。\n\n### 5.4.2 练习\n\n这是一个使用 HTML 和 CSS 构建的简单菜单。HTML 如下：\n\n\
    ```\n<div id=\"main-menu\">\n  <div class=\"item\">Home</div>\n  <div class=\"\
    item\">About</div>\n  <div class=\"item selected\">Blog</div>\n  <div class=\"\
    item\">Contact</div>\n</div>\n```\n\nCSS 如下：\n\n```\n#main-menu {\n  margin: 1rem;\n\
    \  width: 15rem;\n}\n\ndiv.item {\n  border: 1px solid #aaa;\n  padding: 1rem;\n\
    }\n\ndiv.selected {\n  background-color: #ccc;\n}\n```\n\n菜单效果如下：\n\n![](img/f1e163462cce27eed259f3e4a9536b80.png)\n\
    \n一个用 HTML 和 CSS 构建的菜单，第二个项被选中。\n\n你可以在 CodePen 上查看此示例：[`codepen.io/createwithdata/pen/VwQjQpX`](https://codepen.io/createwithdata/pen/VwQjQpX)\n\
    \n探索代码并尝试以下操作：\n\n1.  更改选中项的背景颜色。\n2.  更改选中项的字体颜色。\n3.  更改选中的菜单项。\n\n### 5.4.3\
    \ 后代选择器\n\n另一种使用 CSS 选择特定元素的方法是使用后代选择器。它由两个或多个选择器组成，用空格分隔，允许你选择作为其他元素后代的元素。例如，如果你有以下\
    \ HTML：\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n  <div>Posts</div>\n\
    </div>\n<div id=\"content\">\n  <div>Some content</div>\n</div>\n```\n\n你可以使用选择器\
    \ `#main-menu div` 为 `#main-menu` 元素内的 `div` 元素设置样式。例如：\n\n```\n#main-menu div\
    \ {\n  padding: 1rem;\n}\n```\n\n这意味着选择所有作为 `#main-menu` 元素后代的 `div` 元素。菜单外部的\
    \ `div` 元素不会被选中。\n\n后代选择器是一种非常常见的工具，与数据可视化相关的示例包括：\n\n```\n.bar-chart .bar {\n\
    \  fill: blue;\n}\n.chart .legend .label {\n  font-family: sans-serif;\n  font-size:\
    \ 0.75rem;\n}\n```\n\n第一个选择器 `.bar-chart .bar` 选择嵌套在类为 `.bar-chart` 的元素内部、类为 `bar`\
    \ 的元素（即条形图的条形）。\n\n第二个选择器 `.chart .legend .label` 选择嵌套在类为 `legend` 的元素内部、而该类又嵌套在类为\
    \ `chart` 的元素内部、类为 `label` 的元素（即图表图例标签）。\n\n后代选择器很方便，因为它们允许你根据元素的嵌套结构来选择元素。例如，你可以使用后代选择器重新创建之前的菜单示例。HTML\
    \ 如下：\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n  <div>About</div>\n\
    \  <div class=\"selected\">Blog</div>\n  <div>Contact</div>\n</div>\n\n<div>(This\
    \ div doesn't get styled)</div>\n```\n\nCSS 如下：\n\n```\n#main-menu {\n  margin:\
    \ 1rem;\n  width: 15rem;\n}\n\n#main-menu div {\n  border: 1px solid #aaa;\n \
    \ padding: 1rem;\n}\n\n#main-menu div.selected {\n  background-color: #ccc;\n\
    }\n```\n\n注意，我们可以从每个菜单项中移除 `class=\"item\"` 属性。我们不再使用 `div.item` 来设置菜单项样式，而是使用\
    \ `#main-menu div`。这简化了 HTML，使其更易于阅读和维护。\n\n导航至 [`codepen.io/createwithdata/pen/BaYzYZb`](https://codepen.io/createwithdata/pen/BaYzYZb)\
    \ 在 CodePen 中查看此示例。\n\n### 5.4.4 伪类\n\n伪类修改选择器的行为。它们由冒号（`:`）后跟伪类名称组成：\n\n```\n\
    p:hover {\n  background-color: yellow;\n}\n```\n\n上述代码在鼠标悬停时将 `<p>` 元素的背景颜色更改为黄色。\n\
    \n构建数据可视化时常用的伪类包括：\n\n| **伪类** | **描述** |\n| --- | --- |\n| `:hover` | 当元素被悬停时选择该元素\
    \ |\n| `:first-child` | 选择一组兄弟元素中的第一个兄弟元素。（兄弟元素是嵌套在同一父元素下的相邻元素。） |\n| `:last-child`\
    \ | 选择一组兄弟元素中的最后一个兄弟元素 |\n\n以下是使用伪类为第一个项（现在代表菜单标题）和悬停项设置样式的菜单示例。HTML 如下：\n\n```\n\
    <div id=\"main-menu\">\n  <div>Main</div>\n  <div>About</div>\n  <div class=\"\
    selected\">Blog</div>\n  <div>Contact</div>\n</div>\n```\n\nCSS 如下：\n\n```\n#main-menu\
    \ {\n  margin: 1rem;\n  width: 15rem;\n}\n\n#main-menu div {\n  border: 1px solid\
    \ #aaa;\n  padding: 1rem;\n}\n\n#main-menu div:first-child {\n  font-weight: bold;\n\
    }\n\n#main-menu div.selected {\n  background-color: #aaa;\n}\n\n#main-menu div:hover\
    \ {\n  background-color: #ccc;\n}\n```\n\n![](img/99e8358a21354627044669ace3c6c46e.png)\n\
    \n使用伪类为第一个项设置样式\n\n通过使用 `:first-child` 伪类，`#main-menu` 中的第一个 `div` 被加粗。当任何项被悬停时，由于\
    \ `:hover` 伪类，背景颜色会发生变化。（实际上你不会这样实现菜单，所以这个示例仅作为教学工具。）\n\n导航至 [`codepen.io/createwithdata/pen/MWQeQvy`](https://codepen.io/createwithdata/pen/MWQeQvy)\
    \ 在 CodePen 中查看此示例。\n\n### 5.4.5 分组选择器\n\n你可以通过用逗号分隔选择器，将同一组声明应用于多个选择器。例如，给定以下\
    \ HTML：\n\n"
- fmt: "\n```\n<h1>Main heading</h1>\n<h2>Sub heading</h2>\n<h6>Small heading</h6>\n\
    ```\n\nThe following CSS sets the font weight of all heading elements to `lighter`:\n\
    \n```\nh1, h2, h3, h4, h5, h6 {\n  font-weight: lighter;\n}\n```\n\nNavigate to\
    \ [https://codepen.io/createwithdata/pen/jOPoMBK](https://codepen.io/createwithdata/pen/jOPoMBK)\
    \ to view this example in CodePen.\n\nAs an exercise, try removing `h1` selector\
    \ from the CSS rule and observing the effect.\n\n## 5.5 CSS for HTML layout\n\n\
    CSS is also used to arrange HTML elements. For example you might want a header\
    \ at the top of the page containing a title and menu. You might also want your\
    \ main content to be in boxes arranged as a grid:\n\n![](resources/06e1a4202b2bcf843e51bcf7848d20c3.png)\n\
    \nDashboard layout\n\nIt takes some skill to position HTML elements using CSS.\
    \ On one level it can be straightforward, but it can also be tricky. One of the\
    \ challenges is that you’re rarely working with a fixed size page. (It would be\
    \ much easier if you were!) People might be reading your page on a mobile, tablet,\
    \ laptop or large desktop monitor. You usually need to take into account all these\
    \ different screen widths.\n\nHaving said this, there’s a couple of recent CSS\
    \ developments that make arranging your elements much easier: Flexbox and Grid.\
    \ We’ll give an overview of Flexbox in this book. CSS Grid is a newer development\
    \ and isn’t covered. It could take a whole book to cover HTML layout in detail\
    \ and hopefully this section is able to give you a flavour of what’s possible.\n\
    \n### 5.5.1 Block and inline elements\n\nFrom a layout perspective HTML elements\
    \ can be divided into two categories: **block** elements and **inline** elements.\n\
    \nBlock elements are positioned below each other and inline elements are positioned\
    \ side by side. For example if you have several `<div>` elements:\n\n```\n<div>1</div>\n\
    <div>2</div>\n<div>3</div>\n<div>4</div>\n```\n\nthey’ll appear as a vertical\
    \ stack:\n\n![](resources/aac4c7e8735bbb78071e284a61329934.png)\n\nBlock elements\n\
    \nIf these elements are inline elements they’ll be positioned side by side:\n\n\
    ![](resources/ce1f11866dead51a2fe9da5982ff88ed.png)\n\nInline elements\n\nOf the\
    \ elements covered in this book, heading (`<h1>` - `<h6>`), list `<ul>` and `<div>`\
    \ elements are block elements (by default) and `<img>` and `<svg>` elements are\
    \ inline elements (by default). You can also set whether an element is block or\
    \ inline using the `display` CSS property. To set an element to block display\
    \ use:\n\n```\ndisplay: block;\n```\n\nand to set an element to inline display\
    \ use:\n\n```\ndisplay: inline;\n```\n\nAnother value for `display` is `inline-block`\
    \ which positions elements side by side **and** allows their width and height\
    \ to be set using `width` and `height` properties. (I very rarely use `display:\
    \ inline;` but occasionally use `display: inline-block;` when positioning `<div>`\
    \ elements side by side.)\n\n### 5.5.2 Flexbox\n\nThe CSS Flexbox model lets you\
    \ specify how items are **arranged within their parent element**. For example,\
    \ let’s start with this HTML:\n\n```\n<div id=\"container\">\n  <div class=\"\
    item\">ONE</div>\n  <div class=\"item\">TWO</div>\n  <div class=\"item\">THREE</div>\n\
    \  <div class=\"item\">FOUR</div>\n</div>\n```\n\nand this CSS:\n\n```\n.item\
    \ {\n  padding: 1rem;\n  margin: 0.25rem;\n  border: 1px solid #aaa;\n}\n```\n\
    \nBy default this’ll render like:\n\n![](resources/866cbdcfc43cf7838e3322c6c59ee120.png)\n\
    \nDefault layout of `<div>` elements\n\nFlexbox lets you specify properties on\
    \ the container and its child elements (or ‘items’) to specify how the items are\
    \ arranged.\n\nTo make an element a flex container set the `display` property\
    \ of the element to `flex`:\n\n```\n#container {\n  display: flex;\n}\n```\n\n\
    This results in the items being arranged in a row:\n\n![](resources/8d20342c81156bb9e5eaa7aca69f455b.png)\n\
    \nContainer element (shown in grey) with flex enabled\n\nYou can now set properties\
    \ on the container and/or the items to determine how the items should be arranged.\
    \ These are the most common properties and values for the container:\n\n| Property\
    \ | Description | Values |\n| --- | --- | --- |\n| `flex-direction` | Determines\
    \ the direction in which items will be positioned. This also determines the direction\
    \ of the ‘main axis’. | `row` (items arranged in a row, main axis runs left to\
    \ right), `column` (items arranged in a column, main axis runs top to bottom)\
    \ |\n| `flex-wrap` | Determines whether elements should wrap onto another row/column\
    \ | `nowrap` (don’t wrap items), `wrap` (wrap items) |\n| `justify-content` |\
    \ Specifies how flex items are distributed along the main axis | `flex-start`\
    \ (items placed at the start of the main axis), `flex-end` (items placed at the\
    \ end of the main axis), `center` (items placed in the middle of the main axis),\
    \ `space-around` (items spread along the main axis), `space-between` (items spread\
    \ along the main axis with no space at the ends) |\n| `align-items` | Specifies\
    \ how items are aligned about the main axis | `stretch` (items stretched about\
    \ the main axis to fill the container), `center` (items centered about the main\
    \ axis), `flex-start` (items placed at start of cross-axis), `flex-end` (items\
    \ placed at end of cross-axis) |\n\nThe main axis is determined by `flex-direction`\
    \ and runs left to right if `flex-direction` is `row` and runs top to bottom if\
    \ `flex-direction` is `column`. The cross axis is perpendicular to the main axis.\
    \ See [https://css-tricks.com/snippets/css/a-guide-to-flexbox](https://css-tricks.com/snippets/css/a-guide-to-flexbox)\
    \ for more detail.\n\nAs an example, if we set `justify-content` to `space-between`:\n\
    \n```\n#container {\n  display: flex;\n  justify-content: space-between;\n}\n\
    ```\n\nwe get:\n\n![](resources/330ef8881d86d52cb914e7b2f7e5472f.png)\n\nLayout\
    \ with `justify-content` set to `space-between`\n\nIf we set `justify-content`\
    \ to `flex-end` we get:\n\n![](resources/515e7595e412f984d1c5e0c8b90634fc.png)\n\
    \nLayout with `justify-content` set to `flex-end`\n\nYou can also nest flex containers\
    \ inside one another. For example you can build a rudimentary header bar using\
    \ this approach. Here’s the HTML:\n\n```\n<div id=\"header\">\n  <div id=\"title\"\
    >My Website</div>\n  <div id=\"menu\">\n    <div>Home</div>\n    <div>About</div>\n\
    \    <div>Contact</div>\n  </div>\n</div>\n```\n\nAnd the CSS is:\n\n```\nbody\
    \ {\n  margin: 0;\n  font-family: sans-serif;\n}\n\n#header {\n  height: 4rem;\n\
    \  background-color: #222;\n  color: white;\n  padding: 0 1rem;\n  display: flex;\n\
    \  justify-content: space-between;\n  align-items: center;\n}\n\n#menu {\n  display:\
    \ flex;\n}\n\n#menu div {\n  padding-left: 1rem;\n}\n```\n\nThe outermost `<div>`\
    \ element represents the header. It has two children: a title and a menu. The\
    \ header element acts as a flex container (`display` is set to `flex` on `#header`).\
    \ The title and menu are arranged at opposing ends of the header by setting `justify-content`\
    \ to `space-between`. The items are vertically centered within the container by\
    \ setting `align-items` to `center`.\n\nIn order to arrange the menu items in\
    \ a row, the menu element (`#menu`) is also made a flex container (its `display`\
    \ property is set to `flex`). Thus the menu is both a flex container and a flex\
    \ item.\n\nThe finished header looks like:\n\n![](resources/28bbe7658cb5dd68c42e3048e1b20926.png)\n\
    \nWebsite header arranged using nested flex containers\n\nHopefully this gives\
    \ you a flavour of what Flexbox can achieve. If you’d like to learn more about\
    \ Flexbox one of the best tutorials is [https://css-tricks.com/snippets/css/a-guide-to-flexbox](https://css-tricks.com/snippets/css/a-guide-to-flexbox).\
    \ I’ve also built a Flexbox explorer ([https://app.peterrcook.com/flexplorer/](https://app.peterrcook.com/flexplorer/))\
    \ which lets you quickly explore each property interactively.\n\n# 6 JavaScript\n\
    \nJavaScript is the programming language of the web. It’s built into the majority\
    \ of web browsers and can:\n\n*   **add**, **modify** and **remove** HTML and\
    \ SVG elements\n*   handle **interactivity** (for example, mouse clicks)\n*  \
    \ **fetch** data and other resources\n"
