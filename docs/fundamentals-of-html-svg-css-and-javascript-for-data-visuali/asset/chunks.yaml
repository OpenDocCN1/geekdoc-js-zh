    \ `#FFDD33`，可以简写为 `#FD3`。 | `#FF595E, #FD3` |\n\n根据我的经验，上述颜色单位在构建数据可视化时已经足够。如果你想深入了解，可以查看\
    \ MDN 关于 [HTML 颜色](https://developer.mozilla.org/en-US/docs/Web/HTML/Applying_color)\
    \ 的指南。\n\n## 5.3 CSS 属性\n\n某些 CSS 属性适用于 HTML 元素，某些适用于 SVG 元素，另一些则同时适用于 HTML 和\
    \ SVG 元素。我们先来看 HTML 元素的 CSS 属性。\n\n### 5.3.1 HTML 的 CSS 属性\n\nHTML 元素的一些最常见属性如下：\n\
    \n| **属性** | **描述** | **示例值** | **更多信息** |\n| --- | --- | --- | --- |\n| `color`\
    \ | 文本颜色 | `red`, `#FF595E`, `rgb(255, 100, 255)` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/color)\
    \ |\n| `background-color` | 背景颜色 | `black`, `#CCC`, `rgb(0, 0, 10)` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/background-color)\
    \ |\n| `border` | 边框（围绕元素内容） | `solid`（实线）, `1px dashed red`（红色虚线） | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/border)\
    \ |\n| `padding` | 内容与边框之间的空间宽度 | `10px`, `2rem` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/padding)\
    \ |\n| `margin` | 边框周围的空间宽度 | `10px`, `2rem` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/margin)\
    \ |\n| `opacity` | 不透明度（或透明度） | `0`（透明）, `0.5`（半透明）, `1`（不透明） | [更多](https://developer.mozilla.org/docs/Web/CSS/opacity)\
    \ |\n| `font-size` | 文本大小 | `12px`, `1.5rem` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n| `font-family` | 字体族 | `Helvetica`, `Verdana`, `sans-serif`, `serif` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family)\
    \ |\n| `font-weight` | 字体粗细 | `lighter`, `normal`, `bold` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n| `width` | 宽度 | `200px`, `10rem`, `50%` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/width)\
    \ |\n| `height` | 高度 | `100px`, `5rem`, `25%` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/height)\
    \ |\n\n### 5.3.2 练习\n\n以下是 HTML：\n\n```\n<p>这是一个段落元素。</p>\n```\n\n以及 CSS：\n\n\
    ```\np {\n  font-size: 1rem;\n  color: #335C67;\n  background-color: #FFF3B0;\n\
    \  border: 1px solid #aaa;\n  padding: 2rem;\n  margin: 1rem;\n  width: 12rem;\
    \ \n}\n```\n\n效果如下：\n\n![](img/a69cdd547614d1363d039cd2b48c6159.png)\n\n一个使用 CSS\
    \ 样式化的 `<p>` 元素\n\n导航至 [`codepen.io/createwithdata/pen/OJQXzKo`](https://codepen.io/createwithdata/pen/OJQXzKo)\
    \ 在 CodePen 中查看此示例。\n\n尝试以下操作：\n\n1.  编辑某些属性值（例如，你可以更改一些颜色）。\n\n2.  添加一条规则来更改\
    \ `<p>` 元素的不透明度。\n\n3.  增加/减少 margin 和/或 padding，观察它们之间的关系。\n\n4.  增加边框宽度。\n\n\
    5.  减小元素宽度。\n\n6.  在 HTML 中添加另一个 `<p>` 元素，并在结果面板中观察其显示效果。\n\n### 5.3.3 SVG 的 CSS\
    \ 属性\n\n对于 SVG 元素，最常见的属性如下：\n\n| **属性** | **描述** | **示例值** | **更多信息** |\n| ---\
    \ | --- | --- | --- |\n| `fill` | 形状的内部颜色 | `red`, `#FF595E`, `rgb(255, 100, 255)`,\
    \ `none` | [更多](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `stroke` | 形状轮廓的颜色 | `red`, `#FF595E`, `rgb(255, 100, 255)`, `none` | [更多](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `stroke-width` | 形状轮廓的宽度 | `1px`, `0.5px` | [更多](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Fills_and_Strokes)\
    \ |\n| `opacity` | 形状的不透明度 | `0`（透明）, `0.5`（半透明）, `1`（不透明） | [更多](https://developer.mozilla.org/docs/Web/CSS/opacity)\
    \ |\n| `font-size` | 文本大小 | `12px`, `1.5rem` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-size)\
    \ |\n| `font-family` | 字体族 | `Helvetica`, `Verdana`, `sans-serif`, `serif` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-family)\
    \ |\n| `font-weight` | 字体粗细 | `lighter`, `normal`, `bold` | [更多](https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight)\
    \ |\n| `text-anchor` | 文本元素的水平对齐方式 | `start`, `middle`, `end` | [更多](https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/text-anchor)\
    \ |\n\n例如，以下是 SVG：\n\n```\n<svg width=\"400\" height=\"200\">\n  <g transform=\"\
    translate(100, 75)\">\n    <circle r=\"50\"></circle>\n    <text y=\"6\">标签</text>\n\
    \  </g>\n</svg>\n```\n\n以及 CSS：\n\n```\ncircle {\n  fill: #9E2A2B;\n}\n\ntext\
    \ {\n  font-family: sans-serif;\n  fill: white;\n  text-anchor: middle;\n}\n```\n\
    \n效果如下：\n\n![](img/32d8541e6b176eee9ec5da421c8257b7.png)\n\n一个使用 CSS 样式化的 SVG\
    \ 圆形和文本\n\n第一条规则设置了圆形的颜色，第二条规则样式化了文本元素。文本元素的字体族、颜色和水平对齐方式均已设置。\n\n导航至 [`codepen.io/createwithdata/pen/YzeWeyY`](https://codepen.io/createwithdata/pen/YzeWeyY)\
    \ 在 CodePen 中查看此示例。\n\n### 5.3.4 练习\n\n尝试以下操作：\n\n1.  将圆形的透明度设置为 `0.5`。\n\n2.\
    \  增大标签的字体大小。\n\n### 5.3.5 规则覆盖\n\n如果多个 CSS 声明应用于同一元素，则后面的声明优先级更高。例如以下两条规则：\n\n\
    ```\np {\n  font-size: 10px;\n}\n\np {\n  font-size: 1.5rem;\n}\n```\n\n结果 `p`\
    \ 元素的字体大小为 `1.5rem`。（第一条规则被第二条覆盖。）\n\n### 5.3.6 示例\n\n让我们看一个更高级的示例。假设你有以下 HTML：\n\
    \n```\n<h1>主标题</h1>\n<h2>副标题</h2>\n\n<div>\n  <p>一些描述文本</p>\n</div>\n\n<div>\n\
    \  <svg width=\"600\" height=\"300\">\n    <circle cx=\"150\" cy=\"150\" r=\"\
    100\"></circle>\n    <rect x=\"300\" y=\"50\" width=\"100\" height=\"200\"></rect>\n\
    \  </svg>\n</div>\n```\n\n以及以下 CSS：\n\n```\nbody {\n  font-family: serif;\n}\n\
    \nh2 {\n  color: #aaa;\n  font-family: sans-serif;\n}\n\np {\n  color: #333;\n\
    }\n\ncircle {\n  fill: orange;\n}\n\nrect {\n  fill: none;\n  stroke: #aaa;\n\
    \  stroke-width: 1px;\n}\n```\n\n（你可以在 CodePen 上查看此示例，地址为 [`codepen.io/createwithdata/pen/LYVvBEg`](https://codepen.io/createwithdata/pen/LYVvBEg)。）\n\
    \n第一条规则的选择器是 `body`。`body` 元素代表所有内容，因此该规则将所有元素的字体族设置为 `serif`。下一条规则设置了 `h2` 元素的颜色和字体族。此\
    \ `font-family` 声明覆盖了前一条规则的 `font-family` 声明。\n\n接下来是一条设置 `p` 元素颜色的规则。然后我们设置了\
    \ `circle` 元素的 `fill`，以及 `rect` 元素的 `fill`、`stroke` 和 `stroke-width`。结果如下：\n\n\
    ![](img/ccedb05dfcea48b8fef2ee529b81c29e.png)\n\nCSS 应用于多个 HTML 和 SVG 元素\n\n##\
    \ 5.4 更多 CSS 选择器\n\n"
- fmt: "\nThe previous section showed how to style HTML and SVG elements using CSS.\
    \ You saw how a CSS rule applies to elements of a particular type. For example:\n\
    \n```\np {\n  color: #333;\n}\n```\n\nsets the colour of all `<p>` elements. However\
    \ what if your web page contains lots of `<p>` elements and you only want to style\
    \ **some** of them?\n\nYou can do this by making CSS selectors more specific using\
    \ these approaches:\n\n*   add classes and ids on HTML and SVG elements\n*   nested\
    \ selectors\n*   pseudo classes\n\nThese approaches cover most cases where you\
    \ need to target specific elements. Let’s look at them one by one.\n\n### 5.4.1\
    \ Classes and ids\n\nThere are two HTML and SVG attributes `id` and `classs` that\
    \ let you label particular elements in your page. This allows you to add a CSS\
    \ rule that targets those elements. The `id` attribute is used where you need\
    \ to target a single element and the `class` attribute is used where you need\
    \ to target a number of elements.\n\n#### 5.4.1.1 id\n\nThe `id` attribute lets\
    \ you label a single element so that you can reference it elsewhere (typically\
    \ with CSS or JavaScript). For example, you might have a main menu that needs\
    \ some CSS applied to it.\n\nLet’s create a simple menu and add an `id` attribute\
    \ with value `main-menu`:\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n\
    \  <div>About</div>\n  <div>Blog</div>\n  <div>Contact</div>\n</div>\n```\n\n\
    You can add ids to more than one element but each id value must be unique. In\
    \ other words: two elements should not have the same id.\n\nIn CSS, to select\
    \ an element with an id use a `#` followed by the id value:\n\n```\n#main-menu\
    \ {\n  margin: 1rem;\n}\n```\n\nThis adds a margin to the menu.\n\n#### 5.4.1.2\
    \ class\n\nThe `class` attribute is used to label **multiple** HTML and SVG elements.\
    \ For example:\n\n```\n<div id=\"main-menu\">\n  <div class=\"item\">Home</div>\n\
    \  <div class=\"item\">About</div>\n  <div class=\"item selected\">Blog</div>\n\
    \  <div class=\"item\">Contact</div>\n</div>\n```\n\nEach menu item is given a\
    \ class attribute with value `item`. Class attributes can have more than one value\
    \ (separated by a space). For example the third item’s class attribute has two\
    \ values: `item` and `selected`. This indicates that this particular `div` element\
    \ is an item in a list and has been selected.\n\nIn CSS, an element with a given\
    \ class value may be selected adding a **dot** followed by the **class name**\
    \ to the element type:\n\n```\ndiv.item {\n  border: 1px solid #aaa;\n  padding:\
    \ 1rem;\n}\n\ndiv.selected {\n  background-color: #ccc;\n}\n```\n\nThis means:\n\
    \n*   add padding and a border to each `div` element with class value `item`\n\
    *   set the background colour of `div` elements with class value `selected`\n\n\
    You can also select all elements, regardless of type, with a given class value\
    \ by omitting the element name. For example `.item` selects all elements with\
    \ class value `item`.\n\n### 5.4.2 Exercises\n\nHere’s a simple menu built using\
    \ HTML and CSS. The HTML is:\n\n```\n<div id=\"main-menu\">\n  <div class=\"item\"\
    >Home</div>\n  <div class=\"item\">About</div>\n  <div class=\"item selected\"\
    >Blog</div>\n  <div class=\"item\">Contact</div>\n</div>\n```\n\nand the CSS is:\n\
    \n```\n#main-menu {\n  margin: 1rem;\n  width: 15rem;\n}\n\ndiv.item {\n  border:\
    \ 1px solid #aaa;\n  padding: 1rem;\n}\n\ndiv.selected {\n  background-color:\
    \ #ccc;\n}\n```\n\nThe menu looks like:\n\n![](resources/f1e163462cce27eed259f3e4a9536b80.png)\n\
    \nA menu built with HTML and CSS with the second item selected.\n\nYou can view\
    \ this example on CodePen at [https://codepen.io/createwithdata/pen/VwQjQpX](https://codepen.io/createwithdata/pen/VwQjQpX).\n\
    \nExplore the code and try the following:\n\n1.  Change the background colour\
    \ of the selected item.\n2.  Change the font colour of the selected item.\n3.\
    \  Change which menu item is selected.\n\n### 5.4.3 Descendant selectors\n\nAnother\
    \ way to select specific elements using CSS is to use a descendant selector. This\
    \ consists of two or more selectors separated by a space and it lets you select\
    \ elements that are descendants of other elements. For example if you have the\
    \ HTML:\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n  <div>Posts</div>\n\
    </div>\n<div id=\"content\">\n  <div>Some content</div>\n</div>\n```\n\nYou can\
    \ style the `div` elements within the `#main-menu` element using the selector\
    \ `#main-menu div`. For example:\n\n```\n#main-menu div {\n  padding: 1rem;\n\
    }\n```\n\nThis means select all `div` elements that are descendants of the `#main-menu`\
    \ element. The `div` elements outside of the menu are not selected.\n\nDescendant\
    \ selectors are a very common device and examples related to data visualisation\
    \ include:\n\n```\n.bar-chart .bar {\n  fill: blue;\n}\n.chart .legend .label\
    \ {\n  font-family: sans-serif;\n  font-size: 0.75rem;\n}\n```\n\nThe first selector\
    \ `.bar-chart .bar` selects elements with class `bar` that are nested within elements\
    \ with class `.bar-chart`. (In other words, bar chart bars.)\n\nThe second selector\
    \ `.chart .legend .label` selects elements with class `label` that are nested\
    \ within elements with class `legend` that are nested within elements with class\
    \ `chart`. (In other words, chart legend labels.)\n\nDescendant selectors are\
    \ handy because they let you select elements based on the nested structure of\
    \ your elements. For example you can recreate the previous menu example using\
    \ descendant selectors. Here’s the HTML:\n\n```\n<div id=\"main-menu\">\n  <div>Home</div>\n\
    \  <div>About</div>\n  <div class=\"selected\">Blog</div>\n  <div>Contact</div>\n\
    </div>\n\n<div>(This div doesn't get styled)</div>\n```\n\nAnd here’s the CSS:\n\
    \n```\n#main-menu {\n  margin: 1rem;\n  width: 15rem;\n}\n\n#main-menu div {\n\
    \  border: 1px solid #aaa;\n  padding: 1rem;\n}\n\n#main-menu div.selected {\n\
    \  background-color: #ccc;\n}\n```\n\nNotice that we’re able to remove the `class=\"\
    item\"` attributes from each item. Instead of using `div.item` to style menu items,\
    \ we use `#main-menu div`. This has simplified the HTML, making it easier to read\
    \ and maintain.\n\nNavigate to [https://codepen.io/createwithdata/pen/BaYzYZb](https://codepen.io/createwithdata/pen/BaYzYZb)\
    \ to view this example in CodePen\n\n### 5.4.4 Pseudo classes\n\nPseudo classes\
    \ modify the behavior of a selector. They consist of a colon (`:`) followed by\
    \ the pseudo class name:\n\n```\np:hover {\n  background-color: yellow;\n}\n```\n\
    \nThe above changes the background colour of `<p>` elements to yellow when hovered\
    \ over.\n\nPseudo classes commonly used when building data visualisations include:\n\
    \n| **Pseudo class** | **Description** |\n| --- | --- |\n| `:hover` | Selects\
    \ the element when it’s being hovered over |\n| `:first-child` | Selects the first\
    \ sibling within a group of sibling elements. (Siblings are neighbouring elements\
    \ that are nested under the same parent element.) |\n| `:last-child` | Selects\
    \ the last sibling within a group of sibling elements |\n\nHere’s the menu example\
    \ using pseudo classes to style the first item (which now represents the menu\
    \ title) and the hovered item. The HTML is:\n\n```\n<div id=\"main-menu\">\n \
    \ <div>Main</div>\n  <div>About</div>\n  <div class=\"selected\">Blog</div>\n\
    \  <div>Contact</div>\n</div>\n```\n\nand the CSS is:\n\n```\n#main-menu {\n \
    \ margin: 1rem;\n  width: 15rem;\n}\n\n#main-menu div {\n  border: 1px solid #aaa;\n\
    \  padding: 1rem;\n}\n\n#main-menu div:first-child {\n  font-weight: bold;\n}\n\
    \n#main-menu div.selected {\n  background-color: #aaa;\n}\n\n#main-menu div:hover\
    \ {\n  background-color: #ccc;\n}\n```\n\n![](resources/99e8358a21354627044669ace3c6c46e.png)\n\
    \nStyling the first item using pseudo classes\n\nThe first `div` within `#main-menu`\
    \ has been made bold by using the `:first-child` pseudo class. When any item is\
    \ hovered over the background colour changes because of the `:hover` pseudo-class.\
