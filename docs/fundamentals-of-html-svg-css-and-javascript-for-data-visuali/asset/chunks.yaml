  trans: "\n\n打开 [jsconsole](https://jsconsole.com/) 并定义两个变量：\n\n```\nlet a = 10;\n\
    let b = 20;\n```\n\n编写表达式以完成以下操作：\n\n1.  将 `a` 和 `b` 相加。\n\n2.  将 `a` 和 `b` 相乘。\n\
    \n3.  检查 `a` 是否大于 `b`。\n\n4.  检查 `a` 是否等于 `b`。\n\n5.  检查 `a` 是否等于 `10`。\n\n####\
    \ 6.5.3.1 答案\n\n你的表达式应类似于：\n\n```\na + b;     // 30\na * b;     // 200\na > b;\
    \     // false\na === b;   // false\na === 10;  // true\n```\n\n## 6.6 JavaScript\
    \ 条件语句\n\n条件语句用于根据给定的值执行不同的代码分支。本节介绍两种条件语句：`if` 和 `switch`。\n\n### 6.6.1 if\n\n\
    最广为人知的条件语句是 `if`。其形式如下：\n\n```\nlet answer;\n\nif (a > b) {\n  answer = \"a is\
    \ greater than b\";\n}\n```\n\n`if` 关键字后跟一对括号，括号内包含一个表达式。该表达式会被求值，如果结果为 `true`，则执行后续代码块中的代码；如果为\
    \ `false`，则什么也不发生。（代码块可以包含多条语句，并由花括号界定。）\n\n你可以添加一个 `else` 块，当 `if` 表达式为 `false`\
    \ 时执行：\n\n```\nlet answer;\n\nif (a > b) {\n  answer = \"a is greater than b\"\
    ;\n} else {\n  answer = \"a is not greater than b\";\n}\n```\n\n你还可以将多个 `else`\
    \ 和 `if` 语句串联起来：\n\n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\n\
    };\n\nlet answer;\n\nif (food.type === \"fruit\") {\n  answer = \"It's a fruit!\"\
    ;\n} else if (food.type === \"vegetable\") {\n  answer = \"It's a vegetable!\"\
    ;\n} else {\n  answer = \"Unknown food\";\n}\n```\n\n### 6.6.2 switch\n\n`switch`\
    \ 语句根据表达式的值执行不同的代码块：\n\n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\
    \n};\n\nlet answer;\n\nswitch(food.type) {\n  case \"fruit\":\n    answer = \"\
    It's a fruit!\";\n    break;\n  case \"vegetable\":\n    answer = \"It's a vegetable!\"\
    ;\n    break;\n  default:\n    answer = \"Unknown food\";\n    break;\n}\n```\n\
    \n`switch` 语句后跟一个用括号包裹的表达式（示例中表达式为 `food.type`）。其后有多个 `case` 语句，每个 `case` 后跟表达式的可能值（例如\
    \ `\"fruit\"` 和 `\"vegetable\"`）。如果匹配，则执行该 `case` 语句后的代码。`case` 语句后的代码会一直执行到遇到\
    \ `break` 语句为止。\n\n你也可以将多个 `case` 语句组合在一起：\n\n```\nvar food = {\n  name: \"banana\"\
    ,\n  type: \"fruit\"\n};\n\nswitch(food.type) {\n  case \"fruit\":\n  case \"\
    vegetable\":\n    alert(\"It's a fruit or a vegetable!\");\n    break;\n  default:\n\
    \    alert(\"Unknown food\");\n    break;\n}\n```\n\n## 6.7 JavaScript 函数\n\n\
    函数允许你将代码封装起来，以便在代码中的任何位置多次调用。例如，假设你需要将一些数字加倍。你可以这样做：\n\n```\nlet a = 10;\nlet\
    \ b = 20;\nlet doubleA = a * 2;\nlet doubleB = b * 2;\n```\n\n如果操作比将数字加倍更复杂，这种方法会变得难以管理。另一种方法是定义一个函数，该函数接收一个数字并返回该数字的两倍：\n\
    \n```\nfunction double(x) {\n  return 2 * x;\n}\n```\n\n现在我们可以这样做：\n\n```\nlet\
    \ a = 10;\nlet b = 20;\nlet doubleA = double(a);\nlet doubleB = double(b);\n```\n\
    \n这种方法有几个优点：\n\n*   代码的意图更清晰（即更具表现力）\n\n*   如果重复的操作发生变化，你只需更新一处代码\n\n*   该函数可以在其他地方重用\n\
    \n### 6.7.1 定义函数\n\n函数允许代码被重用。它们使用 `function` 关键字定义：\n\n```\nfunction sayHello()\
    \ {\n  console.log('Hello');  // console.log 允许你将值打印到控制台\n}\n```\n\n函数通常有一个名称。在上面的例子中，函数名是\
    \ `sayHello`。你在函数名后面放置一对括号。函数体（调用函数时执行的代码）放在花括号之间。要调用函数，你写出函数名后跟括号：\n\n```\nsayHello();\n\
    ```\n\n### 6.7.2 返回值\n\n函数可以返回一个值。下面是一个返回字符串的函数：\n\n```\nfunction getName() {\n\
    \  return \"Paris\";\n}\n```\n\n如果你调用 `getName`，它会运行函数的代码并返回 `return` 关键字后的表达式：\n\
    \n```\ngetName();  // \"Paris\"\n```\n\n函数的返回值是一个表达式，因此你可以将其赋值给一个变量：\n\n```\n\
    var name = getName();\nname;  // \"Paris\"\n```\n\n并在 `if` 语句中使用它：\n\n```\nlet\
    \ message;\n\nif(getName() === \"Paris\") {\n  message = \"You're in France!\"\
    ;\n}\n\nmessage;  // \"You're in France!\"\n```\n\n### 6.7.3 函数参数\n\n你可以定义传递给函数的参数列表。例如，让我们定义一个将名字和姓氏连接起来的函数（中间加空格）：\n\
    \n```\nfunction joinNames(firstName, lastName) {\n  var joinedName = firstName\
    \ + \" \" + lastName;\n\n  return joinedName;\n}\n```\n\n这个函数在其圆括号内有一个**参数**列表（`firstName`\
    \ 和 `lastName`）。它们在函数体内充当变量。当函数被调用时，一个**实参**列表被放在圆括号内：\n\n```\nvar fullName =\
    \ joinNames(\"Ana\", \"Matronic\");\nfullName;  // \"Ana Matronic\"\n```\n\n当\
    \ `joinNames` 函数执行时，每个实参被赋值给函数的参数。在上面的例子中，当函数执行时，`firstName` 是 `Ana`，`lastName`\
    \ 是 `Matronic`。\n\n### 6.7.4 练习\n\n创建一个名为 `add10` 的函数，该函数将一个数字加上 `10`。通过传入实参 `50`\
    \ 调用该函数来测试：\n\n```\nadd10(50);\n```\n\n## 6.8 JavaScript 迭代\n\n迭代是重复执行一段代码。一个常见的用例（尤其是在可视化数据时）是对数组的每个元素执行相同的代码。\n\
    \n本节涵盖以下迭代类型：\n\n*   `for` 循环\n\n*   `forEach`\n\n*   `map`\n\n这三种迭代类型涵盖了可视化数据时的大多数情况。\n\
    \n### 6.8.1 `for` 循环\n\n`for` 循环允许你多次执行一段代码：\n\n```\nfor (let i = 0; i < 3; i++)\
    \ {\n  console.log(i);\n}\n```\n\n`for` 语句包含三个表达式：\n\n*   第一个是初始化表达式，通常将计数器变量初始化为零。\n\
    \n*   第二个是在每次迭代前求值的表达式。如果求值为 `true`，则循环继续；如果为 `false`，则循环停止。\n\n*   第三个表达式在每次迭代后求值。通常计数器会递增。\n\
    \n在上面的代码中，`for` 循环体（`console.log(i)`）在 `i` 小于 3 时执行。输出将是三个数字：0、1 和 2。\n\n当你明确知道要迭代多少次时，`for`\
    \ 循环非常有用。例如，如果你想创建一个包含 5 个元素的数组，可以这样做：\n\n```\nlet numItems = 5;\nlet data = [];\n\
    \nfor (let i = 0; i < numItems; i++) {\n  data[i] = 'Item-' + i;\n}\n```\n\n循环结束后，`data`\
    \ 为：\n\n```\n[\"Item-0\", \"Item-1\", \"Item-2\", \"Item-3\", \"Item-4\"]\n```\n\
    \n### 6.8.2 forEach\n\n给定一个数组，`forEach` 会遍历数组的每个元素。你向 `forEach` 提供一个函数，该函数会为每个数组元素调用一次。每次调用函数时，数组元素会被传入函数：\n\
    \n```\nlet data = [10, 50, 40, 30, 20];\n\ndata.forEach(function(d) {\n  console.log(d);\n\
    });\n```\n\n在这个例子中，函数为每个数组元素调用一次。第一次调用时，数组的第一个元素 `10` 被传入函数。第二次调用时，数组的第二个元素 `20`\
    \ 被传入，依此类推。在这个实例中，函数总共被调用了五次。\n\n"
- fmt: "\nNotice that the function doesn’t have a name. This is an example of an `anonymous\
    \ function`. These are functions that are defined ‘on the fly’ and typically aren’t\
    \ called from anywhere else in the code. They’re covered in the JavaScript functions\
    \ (advanced) chapter.\n\nYou can rewrite the above using a named function:\n\n\
    ```\nlet data = [10, 50, 40, 30, 20];\n\nfunction output(message) {\n  console.log(message);\n\
    }\n\ndata.forEach(output);\n```\n\nThis is more verbose, but does allow the function\
    \ to be reused elsewhere.\n\nWhen iterating over an array you can also use a `for`\
    \ loop:\n\n```\nvar data = [10, 50, 40, 30, 20];\n\nfor (let i = 0; i < data.length;\
    \ i++) {\n  console.log(data[i]);\n}\n```\n\nHowever I recommend using `forEach`\
    \ if possible because it’s more expressive. (‘Expressive’ means that the intent\
    \ of the code is clearer to another developer.)\n\n### 6.8.3 map\n\nThe `map`\
    \ statement takes an array and returns a new array with the same length. Each\
    \ element of the new array is computed from the corresponding element in the original\
    \ array. A function determines how the new values are computed.\n\nHere’s an example\
    \ where `map` is used to iterate over `data` and outputs a new array where each\
    \ element is doubled:\n\n```\nlet data = [10, 50, 40, 30, 20];\n\nlet doubled\
    \ = data.map(function(d) {\n  return d * 2;\n});\n\ndoubled;  // [20, 100, 80,\
    \ 60, 40]\n```\n\nFor each element in `data` the function is called. For the first\
    \ element `10` is passed into the function. The function returns `10 * 2` and\
    \ this’ll get assigned to the first element of the new array. The second time\
    \ it’s called `50` is passed in and `50 * 2` is returned and added to the new\
    \ array. And so on.\n\n`map` is very common when working with data. For example\
    \ given the data:\n\n```\nlet data = [\n  {\n    name: \"Anna\",\n    value: \"\
    20.1\"\n  },\n  {\n    name: \"Brian\",\n    value: \"15.3\"\n  }\n];\n```\n\n\
    we might want to convert the `name` property to upper case and the `value` property\
    \ from a string into a number.\n\nFirst write a function that takes an object\
    \ (with properties `name` and `value`) and returns a new object with the two properties\
    \ converted:\n\n```\nfunction convert(d) {\n  let newObject = {\n    name: d.name.toUpperCase(),\n\
    \    value: parseFloat(d.value)\n  };\n\n  return newObject;\n}\n```\n\nNow use\
    \ `map` to create a new array:\n\n```\nlet converted = data.map(convert);\n```\n\
    \n`converted` will look like:\n\n```\n[\n  {\n    name: \"ANNA\",\n    value:\
    \ 20.1\n  },\n  {\n    name: \"BRIAN\",\n    value: 15.3\n  }\n]\n```\n\nThe above\
    \ example can be rewritten using an anonymous function:\n\n```\nlet converted\
    \ = data.map(function(d) {\n  let newObject = {\n    name: d.name.toUpperCase(),\n\
    \    value: parseFloat(d.value)\n  };\n\n  return newObject;\n});\n```\n\n###\
    \ 6.8.4 Exercises\n\nOpen [jsconsole](https://jsconsole.com/) and create an array\
    \ of numbers:\n\n```\nlet a = [10, 20, 30, 40, 50];\n```\n\nTry the following:\n\
    \n1.  Use `forEach` to iterate over the array, outputing the square of each number.\
    \ (Use `console.log` to output a number.)\n\n2.  Use `map` to create an array\
    \ containing the square of each element of `a`.\n\nRemember to use `shift` + `return`\
    \ to create new lines within a single statement in jsconsole.\n\n#### 6.8.4.1\
    \ Answers\n\nUsing `forEach` to output the square of each number:\n\n```\na.forEach(function(d)\
    \ {\n  console.log(d * d);\n});\n```\n\nUsing `map` to create an array containing\
    \ the square of each element of `a`:\n\n```\nlet squared = a.map(function(d) {\n\
    \  return d * d;\n});\n\nsquared;     // [100, 400, 900, 1600, 2500]\n```\n\n\
    ## 6.9 JavaScript functions (advanced)\n\n### 6.9.1 Named functions and anonymous\
    \ functions\n\nFunctions usually have a name:\n\n```\nfunction addTen(x) {\n \
    \ return x + 10;\n}\n```\n\nThis allows them to be called anywhere in your program.\
    \ However when using `forEach` or `map` (see the iteration chapter) it’s often\
    \ convenient to use an `anonymous function`. This is a function without a name\
    \ and is defined as the first argument of `forEach` or `map`. So instead of writing:\n\
    \n```\nlet data = [10, 50, 40, 30, 20];\n\nfunction output(message) {\n  console.log(message);\n\
    }\n\ndata.forEach(output);\n```\n\nyou can write:\n\n```\nlet data = [10, 50,\
    \ 40, 30, 20];\n\ndata.forEach(function(message) {\n  console.log(message);\n\
    });\n```\n\nThis results in more concise code and is a **very** common pattern\
    \ in JavaScript. (D3 uses this pattern very often.) I highly recommend understanding\
    \ this pattern properly. Study the two code examples above and try to understand\
    \ the difference and similarity between the two.\n\n### 6.9.2 Pure functions\n\
    \nA pure function is a function that doesn’t have `side effects`. A side effect\
    \ is when something outside of the function changes. For example:\n\n```\nlet\
    \ outside = 10;\n\nfunction doSomething() {\n  outside = 20;\n}\n```\n\nCalling\
    \ `doSomething` results in the variable `outside` changing. This is considered\
    \ a side effect. An example of a pure function (where there are no side effects)\
    \ is:\n\n```\nlet outside = 10;\n\nfunction doSomething() {\n  return 20;\n}\n\
    \noutside = doSomething();\n```\n\nThe function just returns a value and does\
    \ not affect anything outside of the function. The advantage of pure functions\
    \ is that they have more predictable behaviour. They have input values (via the\
    \ argument list) and a single output. You know that if you call a pure function\
    \ it’s not going to cause anything to change outside of that function.\n\n###\
    \ 6.9.3 Functions are objects\n\nJavaScript functions behave like objects. This\
    \ means you can do anything to a function that you can do to an object. For example\
    \ you can assign a function to a variable:\n\n```\nlet getANumber = function()\
    \ {\n  return 10;\n}\n\ngetANumber();\n```\n\nThe above is equivalent to:\n\n\
    ```\nfunction getANumber() {\n  return 10;\n}\n\ngetANumber();\n```\n\nYou can\
    \ add functions to objects:\n\n```\nlet myFunctions = {\n  add: function(a, b)\
    \ {\n    return a + b;\n  },\n  subtract: function(a, b) {\n    return a - b;\n\
    \  }\n};\n\nmyFunctions.add(10, 20);       // 30\nmyFunctions.subtract(20, 10);\
    \  // 10\n```\n\n#### 6.9.3.1 Passing functions into functions\n\nYou can also\
    \ pass functions into functions:\n\n```\nfunction add(a, b) {\n  return a + b;\n\
    }\n\nfunction multiply(a, b) {\n  return a * b;\n}\n\nfunction getValue(a, b,\
    \ operation) {\n  return operation(a, b);\n}\n\ngetValue(10, 20, add);       \
    \   // 30\ngetValue(10, 20, multiply);     // 200\n```\n\nHere we’ve defined three\
    \ functions:\n\n*   `add` takes two numbers and returns the sum\n\n*   `multiply`\
    \ takes two numbers and returns them multiplied\n\n*   `getValue` takes two numbers\
    \ and a function\n\nWhen `getValue` is first called, the `add` function is passed\
    \ in and assigned to the `operation` parameter. Thus when `operation` is called\
    \ (inside `getValue`) `add` is executed.\n\nIn the second call to `getValue`,\
    \ the `multiply` function is passed in meaning that `operation`‘s value is `multiply`.\
    \ Thus when `operation` is called, `multiply` is executed.\n\nNavigate to [https://codepen.io/createwithdata/pen/abvJmPY](https://codepen.io/createwithdata/pen/abvJmPY)\
    \ to view this example in CodePen\n\nTake your time in understanding this example.\
    \ This is fairly advanced JavaScript but functions are often passed into functions\
    \ when using D3.\n\n# 7 Tools and Set-up\n\nThis book has used CodePen for code\
    \ examples. CodePen’s a reasonable tool for building small applications but larger\
    \ applications are typically developed locally. This means using tools and files\
    \ **on your computer** (rather than on the web). This chapter outlines a typical\
    \ set up for developing web applications locally. This is similar to the set-up\
    \ most web developers use.\n\nThe first section gives an overview of the necessary\
    \ tools and the second section walks you through setting up these tools.\n\n##\
    \ 7.1 Web development tools\n\nThe tools necessary for web development are:\n\n\
    *   a **code editor**\n\n*   a **web browser**\n\n*   a **web server** (not so\
    \ important if you’re not loading data)\n"
