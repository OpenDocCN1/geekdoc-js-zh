  trans: "\n\n![](img/title_page.png)\n\n![用于数据可视化的 HTML、SVG、CSS 和 JavaScript 基础](img/title_page.png)\n\
    \n## 用于数据可视化的 HTML、SVG、CSS 和 JavaScript 基础\n\n#### 彼得·库克\n\n本书在 [`leanpub.com/html-svg-css-js-for-data-visualisation`](http://leanpub.com/html-svg-css-js-for-data-visualisation)\
    \ 有售\n\n此版本发布于 2022-10-17\n\n![出版商标志](img/leanpub-logo.png)\n\n*   *   *   * \
    \  *\n\n这是一本 [Leanpub](https://leanpub.com) 书籍。Leanpub 通过精益出版流程赋能作者和出版商。[精益出版](https://leanpub.com/manifesto)\
    \ 是一种使用轻量级工具和多次迭代来获取读者反馈、不断调整直到写出合适的书籍，并在完成后建立影响力的出版方式。\n\n*   *   *   *   *\n\
    \n© 2022 彼得·库克\n\n## 目录\n\n## 指南\n\n1.  开始阅读\n\n# 1 引言\n\n欢迎！本书面向对数据可视化感兴趣的读者，涵盖\
    \ HTML、SVG、CSS 和 JavaScript 的基础知识。如果你处理数据，可能大部分时间都在使用 Excel、R 或 Python。你可能会被要求在\
    \ Python Jupyter notebook 中创建图表，或使用 R 的 Shiny 或 Python 的 Dash 创建仪表板。这些图表通常是用 HTML、SVG、CSS\
    \ 和 JavaScript 构建的，当你需要深入探索时，对这些语言的良好理解会很有帮助。\n\n或者，你可能对学习 D3 或其他 JavaScript 图表库感兴趣。在这种情况下，本书可以帮助你快速掌握\
    \ HTML、SVG、CSS 和 JavaScript。\n\n本书不假设你具备这些语言的先验知识，但如果你有一些编程经验会更有帮助。熟悉文本编辑器（或 IDE）也会有所帮助。\n\
    \n本书绝不是 HTML、SVG、CSS 和 JavaScript 的全面教程。要做到这一点，你需要一本更厚的书。请将本书视为一份最低限度的知识清单，适用于希望处理基于\
    \ Web 的数据可视化的人。如果你想理解我的其他数据可视化书籍（例如《D3 从入门到精通》），你绝对需要理解本书的内容。\n\n## 1.1 环境搭建\n\
    \n为了快速上手，我建议使用 [CodePen](https://codepen.io/) 来查看和试验代码示例（见下一节）。在本书末尾的“工具与设置”章节中，我将展示如何设置工具，以便你可以在本地编写代码（文件存储在你的计算机上，而不是\
    \ CodePen 上）。这需要一些时间来设置，但如果你对 Web 开发变得更加认真，我推荐这种方法。\n\n## 1.2 CodePen\n\n[CodePen](https://codepen.io/)\
    \ 是一个网站，让你无需设置任何工具即可试验 HTML、SVG、CSS 和 JavaScript。\n\n![](img/16bd52866cd98207c7c894c118bbd54e.png)\n\
    \n这就是 CodePen。你可以在 https://codepen.io/createwithdata/pen/VwvpzOg 访问此示例。\n\n在书中的关键位置，会有一个指向\
    \ CodePen “笔”的链接，其中包含代码示例。如果你访问该链接，就可以查看并试验代码。我鼓励你多玩玩 CodePen 示例——你几乎不会破坏任何东西，通过实验学习非常有效。\n\
    \n你可以自由编辑本书中的 CodePen 示例，你的更改不会影响原始示例。如果你想保留更改，请点击 Fork（在页面底部）并创建一个 CodePen 账户（或登录）。通过点击页面顶部的\
    \ Save 按钮保存你的工作。\n\n## 1.3 保持联系\n\n我喜欢与读者保持联系。最好的方式之一是通过我的邮件列表。我会偶尔发送包含与实现数据可视化相关的有用信息（例如使用\
    \ JavaScript 或其他工具）的消息。还会有我其他书籍的折扣码。你可以[在此处](https://mailchi.mp/085e79e8fd7c/create-with-data-newsletter)注册。\n\
    \n## 1.4 翻译者\n\n如果你有兴趣将《用于数据可视化的 HTML、SVG、CSS 和 JavaScript 基础》翻译成其他语言，请通过 info@createwithdata.com\
    \ 联系我，我很乐意进一步讨论。\n\n# 2 Web 语言：HTML、SVG、CSS 和 JavaScript\n\n大多数网站和 Web 应用程序（包括数据可视化）都由\
    \ 4 种语言构建：**HTML**、**SVG**、**CSS** 和 **JavaScript**。\n\nHTML 代表超文本标记语言，描述网页的**内容**。\n\
    \nSVG 代表可缩放矢量图形，描述**形状**，例如圆形、线条和矩形。它常用于数据可视化（描述条形、线条、圆形、坐标轴、图例等）。\n\nCSS 代表层叠样式表，描述\
    \ HTML 和 SVG 元素的**样式**（例如字体粗细、颜色或大小）和**位置**。\n\nJavaScript 是一种编程语言，可以**操作** HTML\
    \ 和 SVG，进行通用**计算**（例如数据处理）并处理**交互**。\n\n我们将在接下来的章节中逐一介绍这些内容。\n\n# 3 HTML\n\nHTML\
    \ 是一种定义网页**内容**的语言。它使用元素来定义标题、段落、图像、链接等。例如，一个段落元素看起来像这样：\n\n```\n<p>这是一个段落文本。</p>\n\
    ```\n\n段落元素由一个**开始标签** `<p>`、一些**内容**和一个**结束标签** `</p>` 组成。标签通常成对出现。开始标签看起来像 `<p>`，结束标签看起来像\
    \ `</p>`。\n\n当 Web 浏览器加载 HTML 文档时，它会根据元素类型（段落、标题、图像等）绘制每个元素。例如，上面的段落元素在 Web 浏览器中渲染时看起来像这样：\n\
    \n![](img/bd2b66aaf5793ed7fb6769887aeb954c.png)\n\n在 Web 浏览器中渲染的段落 `<p>` 元素\n\n\
    HTML 元素有很多，但只需少数几个就能完成很多工作。本章介绍五个常见元素：标题、列表、图像、`div` 元素和 `svg` 元素。（在可视化数据时，这五个元素通常就足够了。）\n\
    \n## 3.1 标题\n\n标题元素用于标题。有六个级别，从大（`<h1>`）到小（`<h6>`）。\n\n```\n<h1>主标题</h1>\n<h2>副标题</h2>\n\
    <h3>三级标题</h3>\n<h4>四级标题</h4>\n<h5>五级标题</h5>\n<h6>六级标题</h6>\n```\n\n这些元素在 Web 浏览器中渲染时看起来像这样：\n\
    \n![](img/842934fa7c3b7a8c7ff897a7d13bb3a1.png)\n\n在 Web 浏览器中渲染的标题元素 `<h1>` 到\
    \ `<h6>`\n\n## 3.2 列表\n\n列表元素 `<ul>` 用于表示项目列表。每个项目由列表项元素 `<li>` 表示，并嵌套在 `<ul>`\
    \ 元素内：\n\n```\n<ul>\n  <li>列表项一</li>\n  <li>列表项二</li>\n</ul>\n```\n\n注意，我们对 `<li>`\
    \ 元素进行了缩进。这是可选的，但通常是表示嵌套元素的方式。在浏览器中显示时，列表看起来像：\n\n![](img/c98f89915d42064563c9f2ccf1eb1b8a.png)\n\
    \n在 Web 浏览器中渲染的列表元素 `<ul>` 和 `<li>`\n\n## 3.3 图像\n\n可以使用 `<img>` 元素将图像添加到 HTML\
    \ 文档中。`<img>` 元素需要一个名为 `src` 的**属性**，用于指定图像的 URL。\n\n图像元素没有结束标签。下面是一个图像元素，显示位于\
    \ `https://picsum.photos/id/127/300/200.jpg` 的图像：\n\n```\n<img src=\"https://picsum.photos/id/127/300/200.jpg\"\
    >\n```\n\n此示例看起来像：\n\n![](img/bd967b4e4ad159da03d87bd9e9dc23fd.png)\n\n在 Web 浏览器中渲染的图像元素\
    \ `<img>`\n\n通常，你的图像文件会与源代码放在一起。例如，你可能有一个名为 `images` 的目录，其中包含图像文件 `my-image.jpg`。在这种情况下，你应该这样写：\n\
    \n```\n<img src=\"images/my-image.jpg\">\n```\n\n"
- fmt: "\nBy default images are displayed at their original size. You can set the\
    \ display width (or height) of an image using the `width` (or `height`) attribute.\
    \ Let’s set the width of the previous image to 200 pixels:\n\n```\n<img width=\"\
    200px\" src=\"images/my-image.jpg\">\n```\n\nWe’ll cover measurement units (such\
    \ as `px`) in the CSS chapter.\n\n## 3.4 `<div>` element\n\nThe `<div>` element\
    \ is a general purpose element that is often used for grouping and organising\
    \ content. It’s also a good fallback element when none of the other elements are\
    \ suitable. Here’s an example where `<div>` elements are used to structure a web\
    \ page:\n\n```\n<div>\n  <h1>Main title</h1>\n  <h2>Secondary title</h2>\n</div>\n\
    <div>\n  <h3>Article title</h3>\n  <div>\n    <p>First paragraph</p>\n    <p>Second\
    \ paragraph</p>\n  </div>\n</div>\n```\n\nNotice how the elements have been indented.\
    \ This is optional and doesn’t affect how the elements appear in the browser but\
    \ it’s useful when reading and working with the code.\n\nThe above example looks\
    \ like the following when rendered in a web browser:\n\n![](resources/8d76a2ccf46fd6f7ea23fce904abfb73.png)\n\
    \nThe general purpose `<div>` element rendered in a web browser\n\nSee if you\
    \ can relate each HTML element to each line of output.\n\n## 3.5 `<svg>` element\n\
    \nThe `<svg>` element is used when you want to include SVG in your page. SVG stands\
    \ for Scalable Vector Graphics and is a language for describing shapes such as\
    \ lines, circles and rectangles (see the SVG chapter). The `<svg>` element acts\
    \ as a container for your SVG shapes. For example, to add a circle to your web\
    \ page you can use:\n\n```\n<svg width=\"800\" height=\"600\">\n  <circle r=\"\
    100\"></circle>\n</svg>\n```\n\nInside the `<svg>` element are two **attributes**:\
    \ `width` and `height`. These are similar to the `width` and `height` attributes\
    \ in `<img>` elements.\n\nIt’s quite important to specify the SVG element’s size\
    \ (using `width` and `height` attributes) because its default size is quite small\
    \ and shapes are cropped to the SVG’s boundary.\n\nSVG will be covered in greater\
    \ depth in the SVG chapter.\n\n## 3.6 Wrapping up\n\nThere are many other HTML\
    \ elements but when visualising data the ones covered in this section are the\
    \ most common.\n\nYou can see a comprehensive list of HTML elements at [https://developer.mozilla.org/en-US/docs/Web/HTML/Element](https://developer.mozilla.org/en-US/docs/Web/HTML/Element).\n\
    \n## 3.7 Exercises\n\nHere’s some HTML that includes most of the elements covered\
    \ in this chapter:\n\n```\n<div>\n  <h1>Main header</h1>\n  <h2>Sub header</h2>\n\
    </div>\n<div>\n  <h4>Article title</h4>\n  <div>\n    <p>First paragraph</p>\n\
    \    <img src=\"https://picsum.photos/id/127/300/200.jpg\">\n    <p>Second paragraph</p>\n\
    \    <ul>\n      <li>List item one</li>\n      <li>List item two</li>\n    </ul>\n\
    \    <p>Third paragraph</p>\n  </div>\n</div>\n```\n\nYou can open this example\
    \ on CodePen at [https://codepen.io/createwithdata/pen/ExQGeeY](https://codepen.io/createwithdata/pen/ExQGeeY).\n\
    \nTry the following:\n\n1.  Change the text inside the headings.\n\n2.  Change\
    \ the `<h4>` & `</h4>` tags to `<h4>` and `</h4>`.\n\n3.  Add a new paragraph\
    \ containing some text.\n\n4.  Change the image URL to `https://picsum.photos/id/104/384/216`\n\
    \n5.  Change the image’s width to 150 pixels.\n\n6.  Add another list item.\n\n\
    # 4 SVG\n\nSVG (Scalable Vector Graphics) is a language for describing shapes.\
    \ It has a similar structure to HTML but it describes shapes rather than text.\
    \ The most common SVG elements when visualising data are:\n\n| Element | Description\
    \ |\n| --- | --- |\n| `<line>` | Line |\n| `<rect>` | Rectangle |\n| `<circle>`\
    \ | Circle |\n| `<text>` | Text |\n| `<g>` | Group (for grouping elements) |\n\
    | `<path>` | Path (a general purpose, free-form shape) |\n\nEach element requires\
    \ a number of attributes to define its position and size. We saw in the HTML chapter\
    \ that an attribute looks like `name=\"value\"` and is inserted inside an opening\
    \ tag. For example:\n\n```\n<svg width=\"800\" height=\"600\">\n  <circle r=\"\
    100\"></circle>\n</svg>\n```\n\nIn the above snippet the `<svg>` element has two\
    \ attributes `width` and `height` and the `<circle>` element has an attribute\
    \ `r` with value `100`. We’ll see later that the `r` attribute specifies the circle\
    \ radius.\n\n## 4.1 Adding SVG to a web page\n\nSVG shape elements may be added\
    \ to an HTML document by enclosing them within an `<svg>` element. For example:\n\
    \n```\n<h3>Here's some shapes:</h3>\n\n<svg width=\"800\" height=\"600\">\n  <circle\
    \ r=\"100\"></circle>\n  <line x1=\"10\" y1=\"10\" x2=\"100\" y2=\"10\"></line>\
    \ \n</svg>\n\n<p>Above is a circle and a line.</p>\n```\n\n## 4.2 SVG elements\n\
    \n### 4.2.1 Line\n\n`<line>` elements represent straight lines. They have 4 attributes:\n\
    \n*   `x1` and `y1` which define the start of the line\n\n*   `x2` and `y2` which\
    \ define the end of the line\n\nFor example:\n\n```\n<svg width=\"800\" height=\"\
    100\">\n  <line x1=\"50\" y1=\"50\" x2=\"200\" y2=\"50\"></line>\n</svg>\n```\n\
    \ndefines a line whose start coordinate is (50,50) and end coordinate is (200,50).\
    \ Each attribute is measured in pixels. The above example looks like the following:\n\
    \n![](resources/0f7e66f6a0c9e74d4c39d63e32080531.png)\n\nA `<line>` element (with\
    \ the `<svg>` element represented by grey outline)\n\n### 4.2.2 Rectangle\n\n\
    `<rect>` elements define rectangles and have 4 attributes:\n\n*   `x` and `y`\
    \ which define the top left position\n\n*   `width` and `height`\n\nFor example:\n\
    \n```\n<svg width=\"800\" height=\"150\">\n  <rect x=\"50\" y=\"50\" width=\"\
    200\" height=\"50\"></rect>\n</svg>\n```\n\ndefines a rectangle whose top-left\
    \ corner is at (50,50) and has a width of 200 pixels and height of 50 pixels.\
    \ This example looks like:\n\n![](resources/0b00275bef9811eba831ded2f38a2e71.png)\n\
    \nA `<rect>` element\n\n### 4.2.3 Circle\n\n`<circle>` elements have 3 attributes:\n\
    \n*   `cx` and `cy` which define the circle center\n\n*   `r` which defines the\
    \ radius\n\nFor example:\n\n```\n<svg width=\"800\" height=\"150\">\n  <circle\
    \ cx=\"100\" cy=\"75\" r=\"50\"></circle>\n</svg>\n```\n\nThis looks like:\n\n\
    ![](resources/a903dac8725a3e3e595983ca2ee24003.png)\n\nA `<circle>` element centered\
    \ at (100,75) with radius 50\n\n### 4.2.4 Text\n\n`<text>` elements have 2 attributes\
    \ `x` and `y` which define the bottom-left corner of the text.\n\nUnlike most\
    \ SVG elements, `<text>` elements have content between the opening and closing\
    \ tags:\n\n```\n<svg width=\"800\" height=\"100\">\n  <text x=\"50\" y=\"50\"\
    >Some SVG text</text>\n</svg>\n```\n\nThis example renders as:\n\n![](resources/0cbee3579876266ec846058c0407e3a5.png)\n\
    \nA `<text>` element whose bottom-left is at (100,50)\n\n### 4.2.5 Group\n\n`<g>`\
    \ elements are used to group SVG elements and are particularly useful when an\
    \ object is made up of a few elements. They’re a bit like HTML’s `<div>` elements.\
    \ For example a circle with text label could be represented as:\n\n```\n<svg width=\"\
    800\" height=\"600\">\n  <g>\n    <circle cx=\"50\" cy=\"50\" r=\"20\"></circle>\n\
    \    <text x=\"75\" y=\"55\">My label</text>\n  </g>\n</svg>\n```\n\nThis example\
    \ renders as:\n\n![](resources/21f9c866b1124600f3c3266a253d3e29.png)\n\nA `<g>`\
    \ element containing two elements\n\n### 4.2.6 Path\n\n`<path>` elements have\
    \ a single attribute `d` which contains a list of drawing commands:\n\n```\n<svg\
    \ width=\"800\" height=\"100\">\n  <path d=\"M20,20 l200,0 l0,50 z\"></path>\n\
    </svg>\n```\n\nIn this example, three commands are used:\n\n*   `M` which means\
    \ move to a given coordinate\n\n*   `l` which means draw a line relative to the\
    \ current position\n\n*   `z` which means close the shape\n\nTherefore:\n\n* \
    \  `M20,20` means move to the coordinates `20,20`\n\n*   `l200,0` means draw a\
    \ line `200` pixels to the right\n\n*   `l0,50` means draw a line `50` pixels\
    \ down\n\n*   `z` means close the shape\n\nThis renders as:\n\n![](resources/71929891d09771adec546a417e46434d.png)\n\
    \nA `<path>` element\n\nIf you’d like more information on the path commands visit\
    \ [https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Paths](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Paths).\n\
    \n### 4.2.7 Exercises\n\nHere’s some SVG that includes most of the elements covered\
    \ in this chapter:\n"
