  trans: "\n默认情况下，图像以其原始尺寸显示。你可以使用 `width`（或 `height`）属性设置图像的显示宽度（或高度）。让我们将上一张图像的宽度设置为\
    \ 200 像素：\n\n```\n<img width=\"200px\" src=\"images/my-image.jpg\">\n```\n\n我们将在\
    \ CSS 章节中介绍测量单位（例如 `px`）。\n\n## 3.4 `<div>` 元素\n\n`<div>` 元素是一个通用元素，常用于分组和组织内容。当其他元素都不合适时，它也是一个很好的后备元素。下面是一个使用\
    \ `<div>` 元素构建网页结构的示例：\n\n```\n<div>\n  <h1>主标题</h1>\n  <h2>副标题</h2>\n</div>\n\
    <div>\n  <h3>文章标题</h3>\n  <div>\n    <p>第一段</p>\n    <p>第二段</p>\n  </div>\n</div>\n\
    ```\n\n注意元素是如何缩进的。这是可选的，不会影响元素在浏览器中的显示，但在阅读和处理代码时很有用。\n\n上述示例在网页浏览器中渲染时如下所示：\n\
    \n![](img/8d76a2ccf46fd6f7ea23fce904abfb73.png)\n\n通用 `<div>` 元素在网页浏览器中的渲染效果\n\
    \n试着将每个 HTML 元素与输出的每一行对应起来。\n\n## 3.5 `<svg>` 元素\n\n当你想在页面中包含 SVG 时，使用 `<svg>`\
    \ 元素。SVG 代表可缩放矢量图形（Scalable Vector Graphics），是一种描述形状（如线条、圆形和矩形）的语言（参见 SVG 章节）。`<svg>`\
    \ 元素充当 SVG 形状的容器。例如，要在网页中添加一个圆形，你可以使用：\n\n```\n<svg width=\"800\" height=\"600\"\
    >\n  <circle r=\"100\"></circle>\n</svg>\n```\n\n在 `<svg>` 元素内部有两个**属性**：`width`\
    \ 和 `height`。它们与 `<img>` 元素中的 `width` 和 `height` 属性类似。\n\n指定 SVG 元素的大小（使用 `width`\
    \ 和 `height` 属性）非常重要，因为其默认尺寸非常小，并且形状会被裁剪到 SVG 的边界内。\n\nSVG 将在 SVG 章节中更深入地介绍。\n\
    \n## 3.6 总结\n\n还有许多其他 HTML 元素，但在可视化数据时，本节介绍的元素是最常见的。\n\n你可以在 [`developer.mozilla.org/en-US/docs/Web/HTML/Element`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element)\
    \ 查看 HTML 元素的完整列表。\n\n## 3.7 练习\n\n下面是一些包含本章大部分元素的 HTML：\n\n```\n<div>\n  <h1>主标题</h1>\n\
    \  <h2>副标题</h2>\n</div>\n<div>\n  <h4>文章标题</h4>\n  <div>\n    <p>第一段</p>\n   \
    \ <img src=\"https://picsum.photos/id/127/300/200.jpg\">\n    <p>第二段</p>\n   \
    \ <ul>\n      <li>列表项一</li>\n      <li>列表项二</li>\n    </ul>\n    <p>第三段</p>\n\
    \  </div>\n</div>\n```\n\n你可以在 CodePen 上打开此示例：[`codepen.io/createwithdata/pen/ExQGeeY`](https://codepen.io/createwithdata/pen/ExQGeeY)。\n\
    \n尝试以下操作：\n\n1.  更改标题内的文本。\n\n2.  将 `<h4>` 和 `</h4>` 标签改为 `<h4>` 和 `</h4>`。\n\n\
    3.  添加一个包含一些文本的新段落。\n\n4.  将图像 URL 改为 `https://picsum.photos/id/104/384/216`\n\
    \n5.  将图像的宽度改为 150 像素。\n\n6.  添加另一个列表项。\n\n# 4 SVG\n\nSVG（可缩放矢量图形）是一种描述形状的语言。它的结构与\
    \ HTML 类似，但描述的是形状而非文本。在可视化数据时，最常见的 SVG 元素有：\n\n| 元素 | 描述 |\n| --- | --- |\n| `<line>`\
    \ | 线条 |\n| `<rect>` | 矩形 |\n| `<circle>` | 圆形 |\n| `<text>` | 文本 |\n| `<g>` |\
    \ 组（用于分组元素） |\n| `<path>` | 路径（通用的自由形状） |\n\n每个元素需要多个属性来定义其位置和大小。我们在 HTML 章节中看到，属性看起来像\
    \ `name=\"value\"`，并插入到开始标签内。例如：\n\n```\n<svg width=\"800\" height=\"600\">\n\
    \  <circle r=\"100\"></circle>\n</svg>\n```\n\n在上面的代码片段中，`<svg>` 元素有两个属性 `width`\
    \ 和 `height`，`<circle>` 元素有一个属性 `r`，其值为 `100`。稍后我们会看到 `r` 属性指定了圆的半径。\n\n## 4.1\
    \ 将 SVG 添加到网页\n\nSVG 形状元素可以通过将它们包含在 `<svg>` 元素内来添加到 HTML 文档中。例如：\n\n```\n<h3>这里有一些形状：</h3>\n\
    \n<svg width=\"800\" height=\"600\">\n  <circle r=\"100\"></circle>\n  <line x1=\"\
    10\" y1=\"10\" x2=\"100\" y2=\"10\"></line> \n</svg>\n\n<p>上面是一个圆形和一条线条。</p>\n\
    ```\n\n## 4.2 SVG 元素\n\n### 4.2.1 线条\n\n`<line>` 元素表示直线。它有 4 个属性：\n\n*   `x1`\
    \ 和 `y1` 定义线条的起点\n*   `x2` 和 `y2` 定义线条的终点\n\n例如：\n\n```\n<svg width=\"800\" height=\"\
    100\">\n  <line x1=\"50\" y1=\"50\" x2=\"200\" y2=\"50\"></line>\n</svg>\n```\n\
    \n定义了一条起点坐标为 (50,50)、终点坐标为 (200,50) 的线条。每个属性以像素为单位。上述示例看起来如下：\n\n![](img/0f7e66f6a0c9e74d4c39d63e32080531.png)\n\
    \n一个 `<line>` 元素（`<svg>` 元素以灰色轮廓表示）\n\n### 4.2.2 矩形\n\n`<rect>` 元素定义矩形，有 4 个属性：\n\
    \n*   `x` 和 `y` 定义左上角位置\n*   `width` 和 `height`\n\n例如：\n\n```\n<svg width=\"800\"\
    \ height=\"150\">\n  <rect x=\"50\" y=\"50\" width=\"200\" height=\"50\"></rect>\n\
    </svg>\n```\n\n定义了一个左上角在 (50,50)、宽度为 200 像素、高度为 50 像素的矩形。此示例看起来像：\n\n![](img/0b00275bef9811eba831ded2f38a2e71.png)\n\
    \n一个 `<rect>` 元素\n\n### 4.2.3 圆形\n\n`<circle>` 元素有 3 个属性：\n\n*   `cx` 和 `cy` 定义圆心\n\
    *   `r` 定义半径\n\n例如：\n\n```\n<svg width=\"800\" height=\"150\">\n  <circle cx=\"\
    100\" cy=\"75\" r=\"50\"></circle>\n</svg>\n```\n\n看起来像：\n\n![](img/a903dac8725a3e3e595983ca2ee24003.png)\n\
    \n一个圆心在 (100,75)、半径为 50 的 `<circle>` 元素\n\n### 4.2.4 文本\n\n`<text>` 元素有 2 个属性\
    \ `x` 和 `y`，定义文本的左下角。\n\n与大多数 SVG 元素不同，`<text>` 元素在开始和结束标签之间有内容：\n\n```\n<svg\
    \ width=\"800\" height=\"100\">\n  <text x=\"50\" y=\"50\">一些 SVG 文本</text>\n\
    </svg>\n```\n\n此示例渲染为：\n\n![](img/0cbee3579876266ec846058c0407e3a5.png)\n\n一个左下角在\
    \ (100,50) 的 `<text>` 元素\n\n### 4.2.5 组\n\n`<g>` 元素用于分组 SVG 元素，当对象由多个元素组成时特别有用。它们有点像\
    \ HTML 的 `<div>` 元素。例如，一个带有文本标签的圆形可以表示为：\n\n```\n<svg width=\"800\" height=\"\
    600\">\n  <g>\n    <circle cx=\"50\" cy=\"50\" r=\"20\"></circle>\n    <text x=\"\
    75\" y=\"55\">我的标签</text>\n  </g>\n</svg>\n```\n\n此示例渲染为：\n\n![](img/21f9c866b1124600f3c3266a253d3e29.png)\n\
    \n一个包含两个元素的 `<g>` 元素\n\n### 4.2.6 路径\n\n`<path>` 元素有一个单独的属性 `d`，其中包含一系列绘图命令：\n\
    \n```\n<svg width=\"800\" height=\"100\">\n  <path d=\"M20,20 l200,0 l0,50 z\"\
    ></path>\n</svg>\n```\n\n在此示例中，使用了三个命令：\n\n*   `M` 表示移动到指定坐标\n*   `l` 表示从当前位置绘制相对线条\n\
    *   `z` 表示闭合形状\n\n因此：\n\n*   `M20,20` 表示移动到坐标 `20,20`\n*   `l200,0` 表示向右绘制一条 `200`\
    \ 像素的线条\n*   `l0,50` 表示向下绘制一条 `50` 像素的线条\n*   `z` 表示闭合形状\n\n渲染效果如下：\n\n![](img/71929891d09771adec546a417e46434d.png)\n\
    \n一个 `<path>` 元素\n\n如果你想了解更多关于路径命令的信息，请访问 [`developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Paths`](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial/Paths)。\n\
    \n### 4.2.7 练习\n\n下面是一些包含本章大部分元素的 SVG：\n\n"
