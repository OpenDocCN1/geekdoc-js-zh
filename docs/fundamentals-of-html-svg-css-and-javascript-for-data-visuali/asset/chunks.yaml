  trans: "\n\n数组的索引从 `0` 开始。因此，数组中的第一个元素通过 `[0]` 引用。对于嵌套数组，例如：\n\n```\nlet a = [ [\
    \ 10, 20 ], [ 30, 40 ] ];\n```\n\n你可以通过串联方括号来访问这些值：\n\n```\na[0];     // [10,\
    \ 20]\na[0][1];  // 20\n```\n\n`a[0]` 是 `a` 的第一个元素，计算结果为 `[10, 20]`。\n\n`a[0][1]`\
    \ 表示 `a[0]` 的索引 `1`，计算结果为 `20`。\n\n### 6.3.2 数组操作\n\n在下表中，使用了以下变量：\n\n```\nlet\
    \ a = [ 10, 20, 30 ];\nlet b = [ 40, 50, 60 ];\nlet c = [ \"An\", \"array\", \"\
    with\", \"text\" ];\n```\n\n有用的数组操作包括：\n\n| **操作** | **示例** | **结果** |\n| ---\
    \ | --- | --- |\n| 获取数组长度 | `a.length` | `3` |\n| 对数组排序 | `c.sort()` | `c` 现在为\
    \ `[\"An\", \"array\", \"text\", \"with\"]` |\n| 反转数组 | `a.reverse()` | `a` 现在为\
    \ `[30, 20, 10]` |\n| 获取数组的一部分（或“切片”）。第一个数字表示切片的起始索引。第二个数字表示切片的结束索引（包含）。 | `c.slice(1,\
    \ 2)` | `[\"array\", \"with\"]` |\n| 用给定字符串连接数组的每个元素 | `a.join(' and ')` | `\"\
    10 and 20 and 30\"` |\n| 连接两个数组 | `a.concat(b)` | `[10, 20, 30, 40, 50, 60]` |\n\
    | 向数组末尾添加一个元素 | `b.push(70)` | `b` 现在为 `[40, 50, 60, 70]` |\n| 移除（并返回）数组的最后一个元素\
    \ | `a.pop()` | 计算结果为 `30`。`a` 现在为 `[10, 20]` |\n\n#### 6.3.2.1 排序时需谨慎\n\n对数字数组进行排序时要小心。以下示例：\n\
    \n```\nlet d = [11, 10, 9];\nd.sort();\n```\n\n结果 `d` 变为 `[10, 11, 9]`，这相当令人惊讶。\n\
    \n这是因为 JavaScript 会按字符串排序，即使它是一个数字数组！这真的很奇怪。请阅读 [`stackoverflow.com/questions/48201502/strange-javascript-sorting-bug`](https://stackoverflow.com/questions/48201502/strange-javascript-sorting-bug)\
    \ 以了解更多信息。\n\nJavaScript 的另一个怪癖是，上述某些操作会改变原始数组，而另一些则不会。`sort` 和 `reverse` 会用新顺序覆盖数组。同样，`push`\
    \ 和 `pop` 会改变原始数组的长度。\n\n其余操作只是计算出一个值，对数组没有任何影响。\n\n### 6.3.3 练习\n\n打开 [jsconsole](https://jsconsole.com/)\
    \ 并输入以下内容：\n\n```\nlet a = [10, 20, 30];\na.length;\na.reverse();\na.push(0);\n\
    a;\n```\n\n`a` 的最终值应为 `[30, 20, 10, 0]`。\n\n第一个表达式只是输出 `a` 的长度。第二个表达式反转 `a`，因此\
    \ `a` 现在为 `[30, 20, 10]`。第三个语句将 `0` 添加到 `a` 的末尾。最后一个表达式 `a` 计算结果为 `[30, 20, 10,\
    \ 0]`。\n\n## 6.4 JavaScript 对象\n\nJavaScript 对象是**名称-值对**的**（无序）列表**。例如：\n\n```\n\
    let carrot = {\n  foodGroup: \"vegetable\",\n  color: \"orange\"\n}\n```\n\n每个名称-值对称为一个**属性**。每个属性都有一个**名称**（例如\
    \ `foodGroup`、`color`、`id`、`height`、`data`）和一个**值**。值可以是任何类型（包括数组或对象）。你可以使用点号后跟属性名来访问属性：\n\
    \n```\ncarrot.foodGroup;  // \"vegetable\"\n```\n\n对象的属性也可以通过用方括号括起来的属性名（表示为字符串）来访问：\n\
    \n```\ncarrot[\"foodGroup\"];  // \"vegetable\"\n```\n\n方括号表示法的优点是可以使用变量作为属性名：\n\
    \n```\nlet day = \"Tuesday\";\n\nlet data = {\n  Monday: 20,\n  Tuesday: 30,\n\
    \  Wednesday: 10,\n  Thursday: 50,\n  Friday: 70\n};\n\ndata[day];  // 30\n```\n\
    \n属性值可以是任何类型。这是一个包含数组的对象：\n\n```\nlet data = {\n  Monday: [10, 30, 20],\n  Tuesday:\
    \ [50, 20, 30],\n  Wednesday: [40, 10, 20],\n  Thursday: [30, 10, 20],\n  Friday:\
    \ [60, 30, 40]\n};\n\ndata.Tuesday;    // [50, 20, 30]\ndata.Tuesday[1]  // 20\n\
    ```\n\n你也可以有对象数组。这是数据可视化中**非常**常见的结构：\n\n```\nlet data = [\n  {\n    name: \"\
    Spain\",\n    capital: \"Madrid\",\n    population: 46.66\n  },\n  {\n    name:\
    \ \"China\",\n    capital: \"Beijing\",\n    population: 1386\n  }\n];\n\ndata[0].name;\
    \     // \"Spain\"\ndata[1].capital;  // \"Beijing\"\n```\n\n给定一个对象，例如：\n\n```\n\
    let vegetable = {\n  name: \"carrot\",\n  color: \"orange\"\n};\n```\n\n你可以使用以下表示法设置属性：\n\
    \n```\nvegetable.name = \"broccoli\";\nvegetable.color = \"green\";\nvegetable.name;\
    \  // \"broccoli\"\n```\n\n即使属性不存在，你也可以使用上述表示法：\n\n```\nvegetable.family = \"\
    Brassica\";\n```\n\n要获取对象属性名称的列表，请使用：\n\n```\nObject.keys(vegetable);  // [\"\
    name\", \"color\", \"family\"]\n```\n\n这将返回数组 `[\"name\", \"color\", \"family\"\
    ]`。\n\n### 6.4.1 练习\n\n打开 [jsconsole](https://jsconsole.com/) 并创建以下对象：\n\n```\n\
    let carrot = {\n  foodGroup: \"vegetable\",\n  color: \"orange\"\n}\n```\n\n使用\
    \ `shift` + `return` 而不是仅按 `return` 来在单个语句中插入新行。或者点击 [此处](https://jsconsole.com/?let%20carrot%20%3D%20%7B%0A%20%20foodGroup%3A%20%22vegetable%22%2C%0A%20%20color%3A%20%22orange%22%0A%7D)\
    \ 打开预填充的控制台。\n\n输入以下内容：\n\n```\ncarrot.color;\n```\n\n检查是否返回字符串 `\"orange\"`。现在通过输入以下内容将颜色更改为\
    \ `purple`：\n\n```\ncarrot.color = \"purple\";\n```\n\n通过输入以下内容检查颜色是否已更改：\n\n\
    ```\ncarrot.color;\n```\n\n这应该输出 `\"purple\"`。你也可以通过输入以下内容查看对象：\n\n```\ncarrot\n\
    ```\n\n现在向对象添加一个名为 `price` 的新属性，值为 `15`，并检查它是否已添加。\n\n## 6.5 JavaScript 运算符\n\n\
    JavaScript 运算符接受一个或两个值，并计算出一个新值。\n\n例如，`+` 运算符接受两个数字并计算它们的和。\n\n在下表中，定义了以下变量：\n\
    \n```\nlet a = 1;\nlet b = 2;\n```\n\n最常见的运算符有：\n\n| **运算符** | **描述** | **示例**\
    \ | **计算结果** |\n| --- | --- | --- | --- |\n| `+` | 将两个数字相加或连接两个字符串 | `1 + 2`,\
    \ `\"abc\" + \"def\"`, `a + b` | `3`, `\"abcdef\"`, `3` |\n| `-` | 两个数字相减 | `3\
    \ - 2` | `1` |\n| `*` | 两个数字相乘 | `2 * 8` | `16` |\n| `/` | 两个数字相除 | `10 / 5` |\
    \ `2` |\n| `%` | 计算除法的余数 | `11 / 5` | `1` |\n| `!` | 反转布尔值 | `!true` | `false`\
    \ |\n| `>`, `>=`, `<`, `<=` | 大于、大于等于、小于、小于等于 | `5 < 6`, `5 < 5`, `5 <= 5`, `\"\
    a\" > \"b\"`, `\"abc\" < \"def\"`, `a > b` | `true`, `false`, `true`, `false`,\
    \ `true`, `false` |\n| `===` | 等于 | `10 === 10`, `\"dogs\" === \"cats\"`, `a ===\
    \ b` | `true`, `false`, `false` |\n| `!==` | 不等于 | `10 !== 10`, `\"dogs\" !==\
    \ \"cats\"` | `false`, `true` |\n| `&&` | 逻辑与（如果两个表达式都为 `true`，则结果为 `true`） |\
    \ `2 > 1 && 3 > 2` | `true` |\n| `\\&#124;` | 逻辑或（如果任一表达式为 `true`，则结果为 `true`）\
    \ | `1 > 2 \\&#124; 2 > 3` | `false` |\n\n注意，相等运算符是三个等号 `===`。此运算符检查两个表达式是否完全相等。还有一个类似的运算符\
    \ `==`，它不那么严格。通常我建议使用 `===`。\n\n### 6.5.1 三元运算符\n\n有一个称为三元运算符的运算符值得特别提及。三元运算符根据第三个表达式的值来计算两个表达式之一：\n\
    \n```\nlet a = 10;\nlet b = 20;\nlet result = a > b ? \"a is bigger than b\" :\
    \ \"a is not bigger than b\";\nresult;     // 输出 \"a is not bigger than b\"\n\
    ```\n\n在此示例中，表达式 `a > b` 被求值。如果为 `true`，则计算问号后的第一个表达式。如果为 `false`，则计算冒号 `:` 后的表达式。\n\
    \n### 6.5.2 递增和递减\n\n递增 `++` 运算符接受一个数值变量并将其递增：\n\n```\nlet a = 10;\na++;\na; \
    \ // 11\n```\n\n它基本上是以下内容的简写：\n\n```\na = a + 1;\n```\n\n还有一个递减运算符 `--`，用于递减变量。\n\
    \n### 6.5.3 练习\n\n"
- fmt: "\nOpen [jsconsole](https://jsconsole.com/) and define two variables:\n\n```\n\
    let a = 10;\nlet b = 20;\n```\n\nWrite expressions to:\n\n1.  Add `a` and `b`.\n\
    \n2.  Multiply `a` and `b`.\n\n3.  Check whether `a` is greater than `b`.\n\n\
    4.  Check whether `a` is equal to `b`.\n\n5.  Check whether `a` is equal to `10`.\n\
    \n#### 6.5.3.1 Answers\n\nYour expressions should look something like:\n\n```\n\
    a + b;     // 30\na * b;     // 200\na > b;     // false\na === b;   // false\n\
    a === 10;  // true\n```\n\n## 6.6 JavaScript conditionals\n\nConditionals are\
    \ used to execute different branches of code depending on a given value. This\
    \ section covers two types of conditional `if` and `switch`.\n\n### 6.6.1 if\n\
    \nThe most well known conditional is `if`. It looks like:\n\n```\nlet answer;\n\
    \nif (a > b) {\n  answer = \"a is greater than b\";\n}\n```\n\nThe `if` keyword\
    \ is followed by a pair of brackets containing an expression. The expression is\
    \ evaluated and if it’s `true` the code in the following block is executed. If\
    \ it’s `false` nothing happens. (A block of code can contain multiple statements\
    \ and is delimited by curly brackets.)\n\nYou can add an `else` block that’ll\
    \ get executed if the `if` expression is `false`:\n\n```\nlet answer;\n\nif (a\
    \ > b) {\n  answer = \"a is greater than b\";\n} else {\n  answer = \"a is not\
    \ greater than b\";\n}\n```\n\nYou can also string a series of `else` and `if`\
    \ statements together:\n\n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\
    \n};\n\nlet answer;\n\nif (food.type === \"fruit\") {\n  answer = \"It's a fruit!\"\
    ;\n} else if (food.type === \"vegetable\") {\n  answer = \"It's a vegetable!\"\
    ;\n} else {\n  answer = \"Unknown food\";\n}\n```\n\n### 6.6.2 switch\n\nThe `switch`\
    \ statement executes different blocks of code depending on the value of an expression:\n\
    \n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\n};\n\nlet answer;\n\
    \nswitch(food.type) {\n  case \"fruit\":\n    answer = \"It's a fruit!\";\n  \
    \  break;\n  case \"vegetable\":\n    answer = \"It's a vegetable!\";\n    break;\n\
    \  default:\n    answer = \"Unknown food\";\n    break;\n}\n```\n\nThe `switch`\
    \ statement is followed by an expression wrapped in brackets (in the example the\
    \ expression is `food.type`). There are a number of `case` statements followed\
    \ by possible values of the expression (such as `\"fruit\"` and `\"vegetable\"\
    `). If there’s a match, the code following the `case` statement is executed. The\
    \ code following a `case` statement is executed up until the `break` statement.\n\
    \nYou can also use multiple `case` statements together:\n\n```\nvar food = {\n\
    \  name: \"banana\",\n  type: \"fruit\"\n};\n\nswitch(food.type) {\n  case \"\
    fruit\":\n  case \"vegetable\":\n    alert(\"It's a fruit or a vegetable!\");\n\
    \    break;\n  default:\n    alert(\"Unknown food\");\n    break;\n}\n```\n\n\
    ## 6.7 JavaScript functions\n\nFunctions let you wrap up code that can be called\
    \ multiple times from anywhere in your code. For example suppose you need to double\
    \ some numbers. You could do it this way:\n\n```\nlet a = 10;\nlet b = 20;\nlet\
    \ doubleA = a * 2;\nlet doubleB = b * 2;\n```\n\nIf the operation is more complicated\
    \ than doubling a number this approach becomes harder to manage. An alternative\
    \ approach is to define a function that takes a number and returns the double\
    \ of the number:\n\n```\nfunction double(x) {\n  return 2 * x;\n}\n```\n\nNow\
    \ we can do:\n\n```\nlet a = 10;\nlet b = 20;\nlet doubleA = double(a);\nlet doubleB\
    \ = double(b);\n```\n\nThere’s a number of advantages of this approach:\n\n* \
    \  the intent of the code is clearer (i.e. it’s more expressive)\n\n*   if the\
    \ repeated operation changed, you’d only need to update one piece of code\n\n\
    *   the function can be reused elsewhere\n\n### 6.7.1 Defining functions\n\nFunctions\
    \ allow a piece of code to be reused. They are defined using the `function` keyword:\n\
    \n```\nfunction sayHello() {\n  console.log('Hello');  // console.log lets you\
    \ print a value to the console\n}\n```\n\nA function is (usually) given a name.\
    \ In the above example the function name is `sayHello`. You place a pair of brackets\
    \ after the function name. The function’s body (the code that gets executed when\
    \ the function is called) is placed between curly braces. To call a function you\
    \ write the name of the function followed by brackets:\n\n```\nsayHello();\n```\n\
    \n### 6.7.2 Return value\n\nFunctions can return a value. Here’s a function that\
    \ returns a string:\n\n```\nfunction getName() {\n  return \"Paris\";\n}\n```\n\
    \nIf you call `getName` it runs the function’s code and returns the expression\
    \ after the `return` keyword:\n\n```\ngetName();  // \"Paris\"\n```\n\nThe return\
    \ value of a function is an expression so you can assign it to a variable:\n\n\
    ```\nvar name = getName();\nname;  // \"Paris\"\n```\n\nand use it in an `if`\
    \ statement:\n\n```\nlet message;\n\nif(getName() === \"Paris\") {\n  message\
    \ = \"You're in France!\";\n}\n\nmessage;  // \"You're in France!\"\n```\n\n###\
    \ 6.7.3 Function arguments and parameters\n\nYou can define a list of values that\
    \ are passed into your function. For example let’s define a function that joins\
    \ a first name and last name (with a space between):\n\n```\nfunction joinNames(firstName,\
    \ lastName) {\n  var joinedName = firstName + \" \" + lastName;\n\n  return joinedName;\n\
    }\n```\n\nThis function has a list of **parameters** (`firstName` and `lastName`)\
    \ inside its round brackets. These behave as variables within the function body.\
    \ When the function is called a list of **arguments** is placed inside the round\
    \ brackets:\n\n```\nvar fullName = joinNames(\"Ana\", \"Matronic\");\nfullName;\
    \  // \"Ana Matronic\"\n```\n\nWhen the `joinNames` function executes each argument\
    \ is assigned to the function parameters. In the above example, when the function\
    \ executes `firstName` is `Ana` and `lastName` is `Matronic`.\n\n### 6.7.4 Exercise\n\
    \nCreate a function called `add10` that adds `10` to a number. Test your function\
    \ by calling it with an argument `50`:\n\n```\nadd10(50);\n```\n\n## 6.8 JavaScript\
    \ iteration\n\nIteration is the repeated execution of a piece of code. A common\
    \ use case (especially when visualising data) is to execute the same piece of\
    \ code on each element of an array.\n\nThis section covers the following iteration\
    \ types:\n\n*   `for` loops\n\n*   `forEach`\n\n*   `map`\n\nThese three iteration\
    \ types cover most cases when visualising data.\n\n### 6.8.1 `for` loops\n\n`for`\
    \ loops allow you to execute a block of code a number of times:\n\n```\nfor (let\
    \ i = 0; i < 3; i++) {\n  console.log(i);\n}\n```\n\nThe `for` statement is given\
    \ three expressions:\n\n*   the first is an initialisation expression which usually\
    \ initializes a counter variable to zero.\n\n*   the second is an expression that\
    \ is evaluated before each iteration. If it evaluates to `true` the loop iterates\
    \ again. If `false` the loop stops.\n\n*   the third expression is evaluated after\
    \ each iteration. Typically the counter is incremented.\n\nIn the above code the\
    \ body of the `for` loop (`console.log(i)`) is executed while `i` is less than\
    \ 3. The output will be three numbers: 0, 1 and 2.\n\n`for` loops are useful when\
    \ you know how many times you want to iterate. For example if you wanted to create\
    \ an array containing 5 items you could do something like:\n\n```\nlet numItems\
    \ = 5;\nlet data = [];\n\nfor (let i = 0; i < numItems; i++) {\n  data[i] = 'Item-'\
    \ + i;\n}\n```\n\nOnce the loop has finished `data` is:\n\n```\n[\"Item-0\", \"\
    Item-1\", \"Item-2\", \"Item-3\", \"Item-4\"]\n```\n\n### 6.8.2 forEach\n\nGiven\
    \ an array, `forEach` iterates over each element of the array. You provide `forEach`\
    \ with a function that gets called for each array element. Each time the function\
    \ is called the array element is passed into the function:\n\n```\nlet data =\
    \ [10, 50, 40, 30, 20];\n\ndata.forEach(function(d) {\n  console.log(d);\n});\n\
    ```\n\nIn this example the function is called once for each array element. The\
    \ first time it’s called, the first element of the array `10` is passed into the\
    \ function. The second time it’s called, the second element of the array `20`\
    \ is passed in, and so on. In this instance the function gets called a total of\
    \ five times.\n"
  raw: "Open [jsconsole](https://jsconsole.com/) and define two variables:\n\n```\n\
    let a = 10;\nlet b = 20;\n```\n\nWrite expressions to:\n\n1.  Add `a` and `b`.\n\
    \n2.  Multiply `a` and `b`.\n\n3.  Check whether `a` is greater than `b`.\n\n\
    4.  Check whether `a` is equal to `b`.\n\n5.  Check whether `a` is equal to `10`.\n\
    \n#### 6.5.3.1 Answers\n\nYour expressions should look something like:\n\n```\n\
    a + b;     // 30\na * b;     // 200\na > b;     // false\na === b;   // false\n\
    a === 10;  // true\n```\n\n## 6.6 JavaScript conditionals\n\nConditionals are\
    \ used to execute different branches of code depending on a given value. This\
    \ section covers two types of conditional `if` and `switch`.\n\n### 6.6.1 if\n\
    \nThe most well known conditional is `if`. It looks like:\n\n```\nlet answer;\n\
    \nif (a > b) {\n  answer = \"a is greater than b\";\n}\n```\n\nThe `if` keyword\
    \ is followed by a pair of brackets containing an expression. The expression is\
    \ evaluated and if it’s `true` the code in the following block is executed. If\
    \ it’s `false` nothing happens. (A block of code can contain multiple statements\
    \ and is delimited by curly brackets.)\n\nYou can add an `else` block that’ll\
    \ get executed if the `if` expression is `false`:\n\n```\nlet answer;\n\nif (a\
    \ > b) {\n  answer = \"a is greater than b\";\n} else {\n  answer = \"a is not\
    \ greater than b\";\n}\n```\n\nYou can also string a series of `else` and `if`\
    \ statements together:\n\n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\
    \n};\n\nlet answer;\n\nif (food.type === \"fruit\") {\n  answer = \"It's a fruit!\"\
    ;\n} else if (food.type === \"vegetable\") {\n  answer = \"It's a vegetable!\"\
    ;\n} else {\n  answer = \"Unknown food\";\n}\n```\n\n### 6.6.2 switch\n\nThe `switch`\
    \ statement executes different blocks of code depending on the value of an expression:\n\
    \n```\nlet food = {\n  name: \"banana\",\n  type: \"fruit\"\n};\n\nlet answer;\n\
    \nswitch(food.type) {\n  case \"fruit\":\n    answer = \"It's a fruit!\";\n  \
    \  break;\n  case \"vegetable\":\n    answer = \"It's a vegetable!\";\n    break;\n\
    \  default:\n    answer = \"Unknown food\";\n    break;\n}\n```\n\nThe `switch`\
    \ statement is followed by an expression wrapped in brackets (in the example the\
    \ expression is `food.type`). There are a number of `case` statements followed\
    \ by possible values of the expression (such as `\"fruit\"` and `\"vegetable\"\
    `). If there’s a match, the code following the `case` statement is executed. The\
    \ code following a `case` statement is executed up until the `break` statement.\n\
    \nYou can also use multiple `case` statements together:\n\n```\nvar food = {\n\
    \  name: \"banana\",\n  type: \"fruit\"\n};\n\nswitch(food.type) {\n  case \"\
    fruit\":\n  case \"vegetable\":\n    alert(\"It's a fruit or a vegetable!\");\n\
    \    break;\n  default:\n    alert(\"Unknown food\");\n    break;\n}\n```\n\n\
    ## 6.7 JavaScript functions\n\nFunctions let you wrap up code that can be called\
    \ multiple times from anywhere in your code. For example suppose you need to double\
    \ some numbers. You could do it this way:\n\n```\nlet a = 10;\nlet b = 20;\nlet\
    \ doubleA = a * 2;\nlet doubleB = b * 2;\n```\n\nIf the operation is more complicated\
    \ than doubling a number this approach becomes harder to manage. An alternative\
    \ approach is to define a function that takes a number and returns the double\
    \ of the number:\n\n```\nfunction double(x) {\n  return 2 * x;\n}\n```\n\nNow\
    \ we can do:\n\n```\nlet a = 10;\nlet b = 20;\nlet doubleA = double(a);\nlet doubleB\
    \ = double(b);\n```\n\nThere’s a number of advantages of this approach:\n\n* \
    \  the intent of the code is clearer (i.e. it’s more expressive)\n\n*   if the\
    \ repeated operation changed, you’d only need to update one piece of code\n\n\
    *   the function can be reused elsewhere\n\n### 6.7.1 Defining functions\n\nFunctions\
    \ allow a piece of code to be reused. They are defined using the `function` keyword:\n\
    \n```\nfunction sayHello() {\n  console.log('Hello');  // console.log lets you\
    \ print a value to the console\n}\n```\n\nA function is (usually) given a name.\
    \ In the above example the function name is `sayHello`. You place a pair of brackets\
    \ after the function name. The function’s body (the code that gets executed when\
    \ the function is called) is placed between curly braces. To call a function you\
    \ write the name of the function followed by brackets:\n\n```\nsayHello();\n```\n\
    \n### 6.7.2 Return value\n\nFunctions can return a value. Here’s a function that\
    \ returns a string:\n\n```\nfunction getName() {\n  return \"Paris\";\n}\n```\n\
    \nIf you call `getName` it runs the function’s code and returns the expression\
    \ after the `return` keyword:\n\n```\ngetName();  // \"Paris\"\n```\n\nThe return\
    \ value of a function is an expression so you can assign it to a variable:\n\n\
    ```\nvar name = getName();\nname;  // \"Paris\"\n```\n\nand use it in an `if`\
    \ statement:\n\n```\nlet message;\n\nif(getName() === \"Paris\") {\n  message\
    \ = \"You're in France!\";\n}\n\nmessage;  // \"You're in France!\"\n```\n\n###\
    \ 6.7.3 Function arguments and parameters\n\nYou can define a list of values that\
    \ are passed into your function. For example let’s define a function that joins\
    \ a first name and last name (with a space between):\n\n```\nfunction joinNames(firstName,\
    \ lastName) {\n  var joinedName = firstName + \" \" + lastName;\n\n  return joinedName;\n\
    }\n```\n\nThis function has a list of **parameters** (`firstName` and `lastName`)\
    \ inside its round brackets. These behave as variables within the function body.\
    \ When the function is called a list of **arguments** is placed inside the round\
    \ brackets:\n\n```\nvar fullName = joinNames(\"Ana\", \"Matronic\");\nfullName;\
    \  // \"Ana Matronic\"\n```\n\nWhen the `joinNames` function executes each argument\
    \ is assigned to the function parameters. In the above example, when the function\
    \ executes `firstName` is `Ana` and `lastName` is `Matronic`.\n\n### 6.7.4 Exercise\n\
    \nCreate a function called `add10` that adds `10` to a number. Test your function\
    \ by calling it with an argument `50`:\n\n```\nadd10(50);\n```\n\n## 6.8 JavaScript\
    \ iteration\n\nIteration is the repeated execution of a piece of code. A common\
    \ use case (especially when visualising data) is to execute the same piece of\
    \ code on each element of an array.\n\nThis section covers the following iteration\
    \ types:\n\n*   `for` loops\n\n*   `forEach`\n\n*   `map`\n\nThese three iteration\
    \ types cover most cases when visualising data.\n\n### 6.8.1 `for` loops\n\n`for`\
    \ loops allow you to execute a block of code a number of times:\n\n```\nfor (let\
    \ i = 0; i < 3; i++) {\n  console.log(i);\n}\n```\n\nThe `for` statement is given\
    \ three expressions:\n\n*   the first is an initialisation expression which usually\
    \ initializes a counter variable to zero.\n\n*   the second is an expression that\
    \ is evaluated before each iteration. If it evaluates to `true` the loop iterates\
    \ again. If `false` the loop stops.\n\n*   the third expression is evaluated after\
    \ each iteration. Typically the counter is incremented.\n\nIn the above code the\
    \ body of the `for` loop (`console.log(i)`) is executed while `i` is less than\
    \ 3\\. The output will be three numbers: 0, 1 and 2.\n\n`for` loops are useful\
    \ when you know how many times you want to iterate. For example if you wanted\
    \ to create an array containing 5 items you could do something like:\n\n```\n\
    let numItems = 5;\nlet data = [];\n\nfor (let i = 0; i < numItems; i++) {\n  data[i]\
    \ = 'Item-' + i;\n}\n```\n\nOnce the loop has finished `data` is:\n\n```\n[\"\
    Item-0\", \"Item-1\", \"Item-2\", \"Item-3\", \"Item-4\"]\n```\n\n### 6.8.2 forEach\n\
    \nGiven an array, `forEach` iterates over each element of the array. You provide\
    \ `forEach` with a function that gets called for each array element. Each time\
    \ the function is called the array element is passed into the function:\n\n```\n\
    let data = [10, 50, 40, 30, 20];\n\ndata.forEach(function(d) {\n  console.log(d);\n\
    });\n```\n\nIn this example the function is called once for each array element.\
    \ The first time it’s called, the first element of the array `10` is passed into\
    \ the function. The second time it’s called, the second element of the array `20`\
    \ is passed in, and so on. In this instance the function gets called a total of\
    \ five times."
