    Web-based data visualisations, particularly if they’re interactive, probably use
    JavaScript.


    JavaScript started out as a little used language for websites (it was typically
    used to handle a few user interactions) but is now a widespread language with
    hundreds of tools and libraries in its ecosystem.


    Libraries such as [D3](https://d3js.org/), [Leaflet](https://leafletjs.com/) and
    [Chart.js](https://www.chartjs.org/) are written in JavaScript and provide useful
    features for building data visualisations.


    The next two sections will cover the basics of JavaScript namely **variables**
    and **types**. Subsequent sections will look at **operators**, **conditionals**,
    **iteration** and **functions**.


    In order to experiment and practise JavaScript I recommend using the [jsconsole](https://jsconsole.com/)
    website. This allows you to enter JavaScript code and it evaluates it immediately.
    (If you’re more experienced you can use your browser’s [debug console](https://developers.google.com/web/tools/chrome-devtools/console#javascript)
    or Node.)


    When you see example code in this section you’ll occasionally see `//` followed
    by a value:


    ```

    10 + 5;  // 15

    ```


    The value indicates the value that the code returns. (If you type `10 + 5` into
    jsconsole and press return it’ll show the result `15` on the next line.)


    ## 6.1 JavaScript variables


    If you have a value (such as some text or a number) you can use a **variable**
    to point to that data. In effect you’re giving the data a label so that you can
    refer to it elsewhere in your code. In JavaScript, a variable must be **declared**
    before it’s used. Typically this is done using the `let` keyword:


    ```

    let myMessage;

    ```


    You can assign a value (such as a number or string) to a variable. Here’s how
    to assign a string (a piece of text enclosed between quotation marks) to the variable
    `myMessage`:


    ```

    myMessage = "Hello world!";

    ```


    You can also assign numbers to variables:


    ```

    let a = 10;

    let b = 20;

    ```


    (The above code uses a shorthand where the variable is declared and assigned in
    a single statement.)


    Any expression can be assigned to a variable.


    Let’s assign the expression `a + b` to a new variable `c`:


    ```

    let c = a + b;

    c;  // 30

    ```


    The `a + b` expression is evaluated and the result `30` is assigned to `c`.


    #### 6.1.0.1 Exercises


    Open [jsconsole](https://jsconsole.com/) and type the following:


    ```

    let a = 10;

    let b = 20;

    ```


    Now type `a` followed by the return key. What do you see?


    jsconsole evaluates `a` and outputs the result `10`. Now type:


    ```

    let c = a + b;

    ```


    Now type `c` followed by the return key. The `c` variable will be evaluated and
    its value `30` is ouput.


    ## 6.2 JavaScript data types


    The most common data types in JavaScript are:


    *   strings (e.g. `"Hello world"`)

    *   numbers (e.g. `1234`, `10.567`, `1.23e2`)

    *   booleans (`true` and `false`)

    *   arrays (lists of values)

    *   objects (lists of key-value pairs)


    The above are sufficient to build data visualisations. We’ll look at strings,
    numbers and booleans in this section. There are separate chapters for arrays and
    objects.


    ### 6.2.1 Strings


    Strings represent text. The text is enclosed by single quotes (`''`) or double
    quotes (`"`):


    ```

    ''A JavaScript string''

    "A string enclosed in double quotes"

    ```


    If your text contains a single quote you use double quotes to enclose it (and
    vice versa):


    ```

    "Bob''s learning to code in JavaScript"

    ```


    You can add strings together using the `+` operator:


    ```

    let firstName = "Jolene";

    let lastName = "Smith";

    let fullName = firstName + " " + lastName;

    fullName;  // "Jolene Smith"

    ```


    In the following examples we’ve a variable `a` with value `"This is a string"`:


    ```

    let a = "This is a string";

    ```


    You can get the length of a string using `.length`:


    ```

    a.length;  // 16

    ```


    You can get the `n`th character in the string using square brackets:


    ```

    a[0];  // "T"

    a[2];  // "i"

    ```


    #### 6.2.1.1 String manipulation


    A string can be split wherever a string `s` occurs using `split(s)`. For example
    let’s split the string by a single space character:


    ```

    a.split('' '');  // ["This", "is", "a", "string"]

    ```


    (The square brackets represent an array which we’ll cover in a subsequent section.)


    You can compute the upper case version of a string using `toUpperCase()`:


    ```

    a.toUpperCase();  // "THIS IS A STRING"

    ```


    Note that this doesn’t change (or mutate) the string. It just returns a new string
    and `a`’s value is still `"This is a string"`. To make variable `a` upper case
    you can assign the output of `a.toUpperCase()` to `a`:


    ```

    a = a.toUpperCase();

    a;  // "THIS IS A STRING"

    ```


    There’s a lower case counterpart called `toLowerCase()`.


    #### 6.2.1.2 String conversion


    You can convert a string containing a number into a number using `parseFloat`.
    For example:


    ```

    parseFloat(''123.456'');  // 123.456

    parseFloat(''5432'');     // 5432

    parseFloat(''abc'');      // NaN (not a number)

    parseFloat(''1234abc'');  // 1234

    parseFloat(''0'');        // 0

    parseFloat('''');         // NaN

    ```


    Note that passing an empty string into `parseFloat` returns `NaN` which means
    ‘not a number’.


    #### 6.2.1.3 Exercises


    Open [jsconsole](https://jsconsole.com/) and type the following:


    ```

    a = "This is a string";

    a.length;

    a[2];

    a.split('' '');

    a.toUpperCase();

    ```


    Check that your output is similar to:


    ```

    16

    "i"

    ["This", "is", "a", "string"]

    "THIS IS A STRING"

    ```


    ### 6.2.2 Numbers


    JavaScript has a number type for representing numbers. Integers (whole numbers)
    and decimals may be represented:


    ```

    let a = 123;

    let b = 123.456;

    ```


    The mathematical operators `+` (addition), `-` (subtraction), `*` (multiplication)
    and `/` division may be applied to numbers:


    ```

    let c = 123 + 456;

    let d = 3 * 123;

    ```


    Brackets can be used to enforce precedence:


    ```

    (10 + 20) * 2;  // 60

    10 + (20 * 2);  // 50

    ```


    The first expression evaluates as `60` and the second one `50`. (An expression
    is a piece of code that evaluates to a single value.)


    The following examples use a variable `n` with value `123.456`:


    ```

    let n = 123.456;

    ```


    You can round numbers using `round`, `floor` and `ceil`.


    `round` returns the closest integer, `floor` rounds the number down and `ceil`
    rounds the number up:


    ```

    Math.round(n);  // 123

    Math.floor(n);  // 123

    Math.ceil(n);   // 124

    ```


    You can get the string representation of a number using `toString()`:


    ```

    n.toString();  // "123.456"

    ```


    You can get the square root of a number using `Math.sqrt()`:


    ```

    Math.sqrt(100);  // 10

    ```


    #### 6.2.2.1 Exercises


    Open [jsconsole](https://jsconsole.com/) and type the following:


    ```

    let n = 123.456;

    Math.round(n);

    n.toString();

    Math.sqrt(100);

    ```


    Your output values should be:


    ```

    123

    "123.456"

    10

    ```


    ### 6.2.3 Booleans


    Boolean types can have two values `true` and `false`:


    ```

    var learningCSS = true;

    var learningJavaScript = true;

    var learningPython = false;

    ```


    You’ll see later on (in the operators section) that booleans are returned by operators
    such as `===` (is equal to) and `>` (is greater than).


    ## 6.3 JavaScript arrays


    Arrays represent **lists of values**. Each value can be of any type, even arrays!
    Arrays are one of the fundamental data structures used when working with data.
    (You’ll see in the section on objects that it’s common to represent a table of
    data using an array.) An array is represented by **square brackets** and each
    value is separated by a **comma**. Here are 4 different arrays:


    ```

    [ 10, 20, 30 ]                      // an array of numbers

    [ "An", "array", "of", "strings" ]  // an array of strings

    [ [ 10, 20 ], [ 30, 40 ] ]          // an array of arrays

    [ true, true, false ]               // an array of booleans

    ```


    ### 6.3.1 Accessing array elements


    You can access the `i`th item in an array by writing `[i]` after the array:


    ```

    let a = [ "An", "array", "of", "strings" ];

    a[0];  // "An"

    a[2];  // "of"

    ```

