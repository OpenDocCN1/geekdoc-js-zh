    ## 高级对象技术


    1. **对象解构**：与数组解构类似，对象解构允许你从对象中解包属性到不同的变量。


    ![](img/image_rsrc171.jpg)


    2. **计算属性名**：计算属性名允许使用括号 `[ ]` 内的表达式动态创建属性名。


    ![](img/image_rsrc172.jpg)


    3. **对象的 `Object.assign()` 和扩展运算符**：`Object.assign()` 和扩展运算符可用于合并或克隆对象。


    4. **`Object.entries()` 和 `Object.values()`**：`Object.entries()` 将对象转换为键值对数组，而
    `Object.values()` 返回对象值的数组。


