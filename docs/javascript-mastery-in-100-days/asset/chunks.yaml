    # ES6+ 特性简介


    ES6（称为 ECMAScript 2015）及随后的 JavaScript 版本引入了多项强大的新特性，使得编码更简单、更高效且富有表现力。这些更新通过添加语法糖、新功能和改进对常见编程任务的处理方式，使
    JavaScript 与现代编程语言保持一致。


    ### Let 和 Const


    在 ES6 之前，JavaScript 只有一种声明变量的方法：`var`。但 `var` 存在一些问题，例如函数作用域变量和提升问题。ES6 引入了两种声明变量的新方法：`let`
    和 `const`。

