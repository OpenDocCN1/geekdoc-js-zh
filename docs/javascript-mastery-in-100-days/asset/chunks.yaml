    tag has been available since HTML 2.0. So, you can include JS in your HTML if
    you''re working on personal projects. However, it''s not preferred to use this
    method in the production level projects. Instead, linking a separate JavaScript
    file is recommended. Additionally, if you’re doing a personal project and have
    script code in HTML, it''s very advisable to keep the `<script>` tag in the `body`.


    ### Operators and Expressions


    Symbols that are used to perform operations on operands in JavaScript, these are
    known as operators and they allow you to manipulate data within your code. There
    are several types of operators in JavaScript and each type serves a different
    purpose.


    - **Arithmetic Operators**: Used to perform mathematical calculations, such as
    addition, subtraction, multiplication, and division.


    ![](image_rsrc15E.jpg)

    - **Comparison Operators**: Used to Compare values and return true or false based
    on the comparison result.


    ![](image_rsrc15F.jpg)

    - **Logical Operators**: Used to Combine multiple conditions and return true or
    false.


    ![](image_rsrc15G.jpg)


    `Expressions` in JavaScript are combinations of values, variables, and operators
    that yield a result. Whether you''re performing simple calculations or implementing
    complex logic, expressions enable you to express your intentions effectively.


    ![](image_rsrc15H.jpg)


    To write efficient and concise JavaScript codes, it is important to know the operators
    and expressions. It allows the programmer to manipulate data more precisely and
    control program flow more clearly.


    ### Control Flow and Conditional Statements


    There are control flow statements in JavaScript that allow one to manipulate the
    execution of a program based on certain conditions. In JavaScript, there are various
    conditional statements meant for different purposes:


    - **if...else Statement**: It executes a block of code if a specified condition
    is true; otherwise, it executes another block of code.


    ![](image_rsrc15J.jpg)

    - **switch Statement**: It evaluates an expression and executes a block of code
    based on a matching case label.


    Understanding how to use conditional statements effectively allows you to create
    dynamic and responsive JavaScript applications that adapt to different scenarios
    and user interactions. 6


    ### Loops and Iterations


    Loops in JavaScript let you run a piece of code again and again, provided that
    a certain condition remains true. A number of different loops are offered in JavaScript
    that vary by the conditions under which they are used.


    - **For Loop**: A block of code is executed a specified number of times.


    ![](image_rsrc15K.jpg)

    - **while Loop**: A loop that is executed while a condition is true.


    ![](image_rsrc15M.jpg)

    - **do…while Loop**: Loop like while loop , but the block of code will always
    run at least once even if the condition is false.


    ![](image_rsrc15N.jpg)


