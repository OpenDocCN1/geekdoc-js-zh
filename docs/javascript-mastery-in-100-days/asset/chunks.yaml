    在这个示例中，`draw()` 方法在子类 `Circle` 和 `Square` 中被重写了，为由超父类 `Shape` 提供的方法提供了不同的实现。


    总之，多态是 OOP 中的一个基本概念，指的是不同对象以不同方式响应相同方法调的能力。


    ### 继承

    继承是面向对象编程 (OOP) 中的一个基本概念，允许开发者创建一个继承自现有类属性和方法的新类。在 JavaScript 中，继承通过使用 `prototype`
    属性和 `Object.create()` 方法来实现。


    JavaScript 使用基于原型的继承模型，这意味着对象可以从其他对象继承属性和方法。每个对象都有一个指向另一个对象的原型属性，属性和方法通过遍历原型链来继承。例如，考虑以下代码：

