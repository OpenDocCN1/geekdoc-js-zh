    Asynchronous programming is a technique that enables your program to start a potentially
    long-running task and still be able to be responsive to other events while that
    task runs, rather than having to wait until that task has finished. Once that
    task has finished, your program is presented with the result.


    JavaScript is synchronous by default: every line of code is executed one after
    the other, and each task must wait for the previous one to be completed before
    moving to the next.


    JavaScript uses an event loop to handle asynchronous operations. The event loop
    continuously checks the call stack and the message queue. When the call stack
    is empty, it takes the first task from the message queue and pushes it onto the
    call stack to be executed


    ## The Event Loop


    Here''s a simplified view of how the event loop works:


    1. **Call Stack**: Where JavaScript keeps track of the function calls.

    2. **Web APIs**: Browser-provided APIs that handle asynchronous tasks (e.g., `setTimeout`,
    `fetch`).

    3. **Callback Queue (Message Queue)**: Where callbacks from asynchronous operations
    are queued.

    4. **Event Loop**: Monitors the call stack and callback queue, executing queued
    tasks when the stack is empty.


    ## Asynchronous Functions in JavaScript


    There are several ways to handle asynchronous operations in JavaScript:


    ### 1. Callbacks

    Callbacks are functions passed as arguments to other functions and are executed
    after the completion of asynchronous operations.


    ![](image_rsrc177.jpg)


    ### 2. Promises

    Promises provide a more powerful way to handle asynchronous operations. a promise
    represents a value that may be available now, in the future, or never. Promises
    have three states: pending, fulfilled, and rejected.


    ![](image_rsrc178.jpg)


    ### 3. Async/Await

    `async` and `await` are syntactic sugar built on top of promises, allowing you
    to write asynchronous code that looks synchronous. An `async` function returns
    a promise, and `await` pauses the function execution until the promise is resolved.


    ![](image_rsrc179.jpg)


    ## Importance of Asynchronous Programming


    Asynchronous programming is very crucial for building performance giving and responsive
    web applications. It enables you to handle tasks like network requests, file reading
    and timers without blocking the main thread, ensuring that your application remains
    smooth and user-friendly. By mastering these asynchronous programming techniques,
    you can create more efficient and robust JavaScript applications that provide
    better experience for your users.


    ## Callbacks and Promises


    ### Callbacks


    #### What Are Callbacks?

    Any function that is passed as an argument to another function so that it can
    be executed in that other function is called as a callback function. Callbacks
    are one of the oldest and most common ways to handle asynchronous operations in
    JavaScript.


    #### How it works?

    When you pass callback to a function, it is executed after the main function has
    finished its task. It allows you to handle tasks like fetching data or performing
    I/O operations without blocking the execution of your other code.


    ![](image_rsrc17A.jpg)


    #### Callback Hell

    One of the main issues with callbacks is that they can lead to deeply nested code
    so often referred to as "callback hell," making the code difficult to read and
    maintain ![](image_rsrc17B.jpg)


    ### Promises

    #### What Are Promises?

    Promises are an improved way to handle asynchronous operations in JavaScript.
    a promise represents a value that may be available now, in the future, or never.
    Promises have three states: pending, fulfilled, and rejected.


    #### Creating a Promises

    To create a promise, you use the `Promise` constructor, passing it a function
    with two arguments: `resolve` and `reject`. The `resolve` function is called when
    the operation completes successfully, and the `reject` function is called when
    the operation fails.


    ![](image_rsrc17C.jpg)


    #### Chaining Promises

    Promises can be chained to handle multiple asynchronous operations in sequence.
    Each `then` call returns a new promise, allowing you to chain additional `then`
    calls![](image_rsrc17D.jpg)


    #### Error Handling with Promises

    One of the advantages of promises which every developer like is its built-in error
    handling. If any promise in a chain is not executed well then it will reject and
    the control jumps to the nearest `catch` block.


    ![](image_rsrc17E.jpg)


    ### Conclusion

    Callbacks and promises are essential tools for handling asynchronous operations
    in JavaScript. While callbacks are simple and effective, they can lead to "callback
    hell" with deeply nested code. Promises provide a more powerful and flexible way
    to manage asynchronous tasks, with built-in support for chaining and error handling.
    By mastering these techniques, you can write cleaner, more maintainable code and
    effectively manage asynchronous operations in your JavaScript applications.


    ## Async/Await and Fetch API


    ### Understanding Async/Await

    Async/await is a modern way to handle asynchronous operations in JavaScript. It
    was Introduced in ES2017 and async/await is built on top of promises that allows
    you to write asynchronous code that looks and behaves more like synchronous code
    and also making it easier to read and maintain.


    #### Async Functions

    An `async` function is a function that returns a promise. You can define an async
    function using the `async` keyword before the function declaration.


    ![](image_rsrc17F.jpg)


    #### Await Keyboard

    The `await` keyword can be only used inside an `async` function. It pauses execution
    of the function until the promise is resolved or rejected. It makes your code
    look synchronous.


    ![](image_rsrc17G.jpg)


    ### Using Async/Await with Fetch API

    The Fetch API provides a modern and easy-to-use interface for making HTTP requests
    to fetch resources from the network. It returns a promise that resolves to the
    response of the request.


    #### API Application Programming Interface


    ##### Basic Fetch Request

    Here''s a basic example of using the Fetch API to make a GET request: We are using
    free fake and reliable API for learning purposes - Search JSONPlaceholder on internet,
    click first link and there you go, you’ll see full documentation of this API.


    ![](image_rsrc17H.jpg)


    Using `async/await`, the same code becomes more readable:


    ![](image_rsrc17J.jpg)


    ##### Handling Errors with Async/Await

    We can handle errors in async/await using a `try` or catch block which allows
    you to manage exceptions in a cleaner and more readable way.


    ![](image_rsrc17K.jpg)


    ##### POST Request with Fetch API

    We can also use the Fetch API to make POST requests. POST Requests is used in
    sending data to the server.


    ![](image_rsrc17M.jpg)


    ### Benefits of Async/Await

    - **Simplicity**: async/await syntax is more straightforward and easier to understand,
    especially for those who are familiar with synchronous code.

    - **Readability**: The code reads more like synchronous code which make it more
    readable and maintainable.

    - **Error Handling**: Using `try` and `catch` with async/await provides a more
    intuitive way to handle errors compared to promise chains.

