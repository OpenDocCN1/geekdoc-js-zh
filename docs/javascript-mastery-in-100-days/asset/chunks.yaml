    ## 函数的构建模块


    让我们开始学习吧！


    ### 函数简介


    JavaScript 函数在编程中至关重要，因为它们允许你封装可重用的代码块，将代码组织成逻辑单元，从而使其更加模块化和易于管理。在本章中，我们将讨论函数的基础及其在
    JavaScript 编程中的重要性。


    #### 函数参数和返回值


    函数参数是每次调用函数时传递给函数的值的占位符。它允许函数接收输入数据，这些数据可以在函数体内部用于计算、做出选择或执行其他操作。函数参数具有多功能性，它们可以处理各种类型的数据和数量，使函数在不同情况下更具响应性。


    在定义函数时，参数在函数名后的括号内声明。这些参数充当函数内部局部变量，允许你在函数实现中引用它们。例如：


    ![](img/image_rsrc15R.jpg)在此示例中，`name` 是 `greet` 函数的参数，允许函数根据传递给它的值进行个性化问候。


    JavaScript 函数可以接受多个参数，并用逗号隔开，允许你传递多条数据进行处理：


    在这里，`add` 函数接收两个参数 `a` 和 `b`，并返回它们的和。通过在调用函数时为两个参数提供值，你可以对不同的输入值执行加法。


    #### 利用返回值


    在 JS 中，函数的返回值被认为是最基础的概念之一，它允许函数产生输出或结果。函数在返回结果之前可以计算一个值或执行某些操作。这使得函数能够将复杂的逻辑组合在一起，并为程序中的其他部分提供合理的输出。


    要在函数中指定返回值，你使用 `return` 关键字，后紧跟你想返回的值或表达式。例如：


    ![](img/image_rsrc15S.jpg)


    ### 11


    在此示例中，`square` 函数接收一个参数 `x`，然后返回该值的平方。返回的结果可以存储在变量中或用于进一步计算。


    返回值不仅限于简单的数据类型；函数可以返回更复杂的数据结构，例如数组或对象，让你的代码具有更强的灵活性和多功能性。此外，函数可以使用 `return` 语句提前返回，允许在满足某些条件时提前终止执行。


    理解如何有效利用函数参数和返回值，能够让你使函数具有适应性、可重用性，并能够产生有意义的结果。通过掌握这些概念，你可以增强 JavaScript 代码的功能和灵活性，从而构建更高效、更易维护的应用。


    t


    ![](img/image_rsrc15T.jpg) 你知道吗？JavaScript 中的变量：`var` vs. `const` vs. `let`


    JavaScript 的 `var` 缺乏块级作用域，往往会导致不可预测的行为。`const` 声明不可重新赋值的常量，促进了不可变性。`let` 具有块级作用域，允许变量重新赋值，使其非常多功能。


    专业提示：对于不可变变量优先使用 `const`，对于可变变量使用 `let`。这种做法可以提高代码清晰度并防止意外的变量修改，促进健壮且易于维护的 JavaScript
    代码。


    ### 作用域与提升


    变量作用域——指的是变量在代码中可以访问的上下文。在 JavaScript 中，变量可以具有全局作用域或局部作用域，取决于它们声明的位置。


    全局作用域：在任何函数之外声明的变量具有全局作用域，意味着可以从代码的任何地方访问。


    局部作用域：在函数内部声明的变量具有局部作用域，意味着它们只能在该函数内部访问。


    ![](img/image_rsrc15U.jpg)


    理解变量作用域对于编写整洁、模块化的代码非常重要。它有助于防止命名冲突，并确保变量只在需要的地方访问。


    #### 提升（Hoisting）的概念


    在 JavaScript 中，提升是指语言的一种内置行为，通过这种行为，函数、变量和类的声明会被移动到它们作用域的顶部——全在代码执行之前。反之，这允许我们在声明之前使用函数、变量和类。


    使用 `var` 声明的变量会被提升，但它们的赋值不会。如果不正确理解，这可能会导致意想不到的行为。


    ![](img/image_rsrc15V.jpg)


    在此示例中，`myVariable` 被提升到其所在作用域的顶部，导致在赋值之前访问时结果为 `undefined`。


    然而，使用 `let` 或 `const` 声明的变量以相同的方式提升。它们被提升到块作用域的顶部，但在代码到达声明处之前一直处于“暂时性死区”中。在声明之前访问它们会导致引用错误（reference
    error）。


    ![](img/image_rsrc15W.jpg)


    了解提升的工作原理可以让你编写出更具可预测性的代码，减少产生意外后果的可能性。一旦完全理解了作用域和提升的概念，开发者就可以更好地判断在 JavaScript
    程序中何时何地声明变量或使变量可见。


    ### 匿名函数与闭包


    理解匿名函数——匿名函数也称为函数表达式，是指没有名称的函数。它们通常作为其他函数的参数或赋值给变量。


    ![](img/image_rsrc15X.jpg)


    ### 14


    匿名函数提供了灵活性，通常用于需要临时函数或函数标识并不重要的场合。


    #### 探索闭包


    闭包是函数与其周围环境状态（词法环境）引用的结合。换句话说，闭包就像小内存胶囊：它让你从内部函数访问外部函数的作用域。在 JavaScript 中，每次创建函数时都会创建闭包。


    ![](img/image_rsrc15Y.jpg)


    在此示例中，内部函数对 `count` 变量形成了一个闭包，允许它在 `createCounter` 执行完毕后仍访问并修改 `count` 变量。


