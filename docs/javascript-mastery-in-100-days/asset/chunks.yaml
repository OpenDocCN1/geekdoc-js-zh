    ## 使用 Babel 和 Webpack 的优势


    - **跨浏览器兼容性**：通过使用 `Babel`，你的现代 JavaScript 将在所有浏览器中运行，即使是那些不支持最新性的浏览器。

    - **代码优化**：Webpack 提供了性能改进，如代码分割、压缩和树摇，这些有助于提高应用程序的加载速度。

    - **组织良好的代码库**：通过 Webpack 将代码模块化，允许你保持项目整洁有序。

