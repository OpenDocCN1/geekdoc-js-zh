  trans: '


    异步编程是一种技术，它允许你的程序启动一个可能耗时很的任务，并在任务运行期间仍然能够对其他事件做出响应，而无需等待该任务完成。一旦该任务完成，你的程序就会获得结果。


    JavaScript 默认是同步的：每行代码都按顺序执行，每个任务都必须等待上一个任务完成后才能移动到下一个任务。


    JavaScript 使用事件循环来处理异步操作。事件循环持续检查调用栈（call stack）和消息队列（message queue）。当调用栈为空时，它会从消息队列取出第一个任务并将其推入调用栈中执行。


    ## 事件循环


    以下是事件循环工作原理的简化：


    1. **调用栈 (Call Stack)**：JavaScript 跟踪函数调用的地方。

    2. **Web APIs**：浏览器提供的处理异步任务的 API（例如：`setTimeout`、`fetch`）。

    3. **回调队列 (Callback Queue) (Message Queue)**：异步操作的回调函数存放的地方。

    4. **事件循环 (Event Loop)**：监控调用栈和回调队列，当堆栈为空时执行队列中的任务。


    ## JavaScript 中的异步函数


    在 JavaScript 中有多种方法处理异步操作：


    ### 1. 回调 (Callbacks)

    回调是作为参数传递给其他函数，并在异步操作完成后执行的函数。


    ![](img/image_rsrc177.jpg)


    ### 2. Promise

    Promise 提供了一种更强大的处理异步操作的方法。一个 promise 代表一个现在可能可用、未来可能才用、或永远不存在的值。Promise 有三种状态：等待（pending）、已完成（fulfilled）和拒绝（rejected）。


    ![](img/image_rsrc178.jpg)


    ### 3. Async/Await

    `async` 和 `await` 是构建在 promise 之上的语法糖，允许你编写看起来像同步代码的异步代码。`async` 函数返回一个 promise，而
    `await` 会暂停函数执行，直到 promise 解决（resolved）。


    ![](img/image_rsrc179.jpg)


    ## 异步编程的重要性


    异步编程对于构建高性能且响应良好的 Web 应用程序至关重要。它允许你处理网络请求、文件读取和定时器等任务，而不阻塞主线程，确保你的应用程序保持流畅且友好。通过掌握这些异步编程技术，你可以创建更高效、更健壮的
    JavaScript 应用程序，为用户提供更好的体验。


    ## 回调与 Promise


    ### 回调


    #### 什么是回调？

    任何作为参数传递给另一个函数以便其在该另一个函数中执行的函数都称为回调函数。回调是 JavaScript 中处理异步操作的最老且最常见的方式之一。


    #### 它是如何工作的？

    当你将回调传递给函数时，它会在主函数完成任务后执行。它允许你处理如获取数据或执行 I/O 操作等任务，而不阻塞其他代码的执行。


    ![](img/image_rsrc17A.jpg)


    #### 回调地狱 (Callback Hell)

    回调的主要问题之一是它们会导致深度嵌套的代码，通常被称为“回调地狱”，使得代码难以阅读和维护 ![](img/image_rsrc17B.jpg)


    ### Promise

    #### 什么是 Promise？

    Promise 是 JavaScript 中处理异步操作的改进方法。一个 promise 代表一个现在可能可用、未来可能才用、或永远不存在的值。Promise
    有三种状态：等待（pending）、已完成（fulfilled）和拒绝（rejected）。


    #### 创建 Promise

    要创建一个 promise，你使用 `Promise` 构造函数，并传递一个带有两个参数的函数：`resolve` 和 `reject`。当操作成功完成时调用
    `resolve` 函数，当操作失败时调用 `reject` 函数。


    ![](img/image_rsrc17C.jpg)


    #### Promise 链式

    Promise 可以链式调用以顺序处理多个异步操作。每个 `then` 调用都会返回一个新的 promise，允许你链式额外的 `then` 调用![](img/image_rsrc17D.jpg)


    #### 使用 Promise 进行错误处理

    Promise 的每个开发者都喜欢的优点之一是其内置的错误处理。如果链中的任何 promise 执行不当，它将被拒绝，控制权跳转到最近的 `catch` 块。


    ![](img/image_rsrc17E.jpg)


    ### 结论

    回调和 promise 是处理 JavaScript 异步操作的重要工具。虽然回调简单且有效，但它们可能会导致深度嵌套代码的“回调地狱”。Promise 提供了一种更强大、更灵活的方法来管理异步任务，并内置支持链式调用和错误处理。通过掌握这些技术，你可以写出更整洁、更易维护的代码，并有效地管理
    JavaScript 应用程序中的异步操作。


    ## Async/Await 和 Fetch API


    ### 理解 Async/Await

    Async/await 是处理 JavaScript 异步操作的现代方式。它引入于 ES2017，且 async/await 构建在 promise 之上，允许你编写看起来和行为更像同步代码的异步代码，并且更容易阅读和维护。


    #### Async 函数

    `async` 函数是一个返回 promise 的函数。你可以在函数声明之前使用 `async` 关键字定义一个 async 函数。


    ![](img/image_rsrc17F.jpg)


    #### Await 关键字

    `await` 关键字只能在 `async` 函数内部使用。它会暂停函数的执行，直到 promise 被解决或拒绝。它让你的代码看起来是同步的。


    ![](img/image_rsrc17G.jpg)


    #### 使用 Fetch API 使用 Async/Await

    Fetch API 提供了一个现代且易用的接口，用于发送 HTTP 请求从网络获取资源。它返回一个解析为请求响应的 promise。


    #### API 应用程序接口


    ##### 基础 Fetch 请求

    这是一个使用 Fetch API 发送 GET 请求的简单示例：我们出于学习目的使用了免费、可靠的虚拟 API - 在互联网上搜索 JSONPlaceholder，点击第一个链接，你就会看到此
    API 的完整文档。


    ![](img/image_rsrc17H.jpg)


    使用 `async/await`，相同的代码变得更具可读性：


    ![](img/image_rsrc17J.jpg)


    ##### 使用 Async/Await 处理错误

    我们可以使用 `try` 或 `catch` 块在 async/await 中处理错误，这允许你以更简洁、更易读的方式管理异常。


    ![](img/image_rsrc17K.jpg)


    ##### 使用 Fetch API 的 POST 请求

    我们也可以使用 Fetch API 发送 POST 请求。POST 请求用于向服务器发送数据。


    ![](img/image_rsrc17M.jpg)


    ### Async/Await 的优势

    - **简单性**：async/await 语法更直观、更容易理解，特别是对于那些熟悉同步代码的人来说。

    - **可读性**：代码读起来更像同步代码，使其更具可读性和维护性。

    - **错误处理**：与 promise 链相比，在 async/await 中使用 `try` 和 `catch` 提供了一种更直观的错误处理方式。


