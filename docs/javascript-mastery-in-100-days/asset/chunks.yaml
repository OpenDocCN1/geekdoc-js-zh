    # 描述

    构建一个待办事项应用，带有额外的过滤选项（例如按日期或状态过滤），并将任务存储在本地存储（local storage）中。练习数组、DOM 操作以及使用函数处理任务操作。


    ## 6. 分页电影搜索应用

    **主题**：`Fetch API`、`Async/Await`、`Error Handling`、`DOM Manipulation`

    **复杂度**：中

    **描述**：使用公共 API 创建电影搜索应用。用户可以搜索电影、查看海报，并通过分页功能查看信息以方便浏览。处理多个 API 调用是这里的关键方面。


    ## 7. 带有购物车的电子商务产品页

    **主题**：`Functions`、`Objects`、`DOM Manipulation`、`Event Handling`、`Local Storage`

    **复杂度**：高级

    **描述**：构建带有购物车功能的商品页，用户可以添加商品、调整数量并查看总价。集成本地存储以跨会话维护购物车，并练习 DOM 操作。


    ## 8. 集成 API 的菜谱书籍

    **主题**：`Fetch API`、`Async/Await`、`DOM Manipulation`、`Event Handling`

    **复杂度**：中

    **描述**：创建一个菜谱书籍，用户可以从外部 API 搜索菜谱并查看详情。引入异步编程处理请求，并重点通过 DOM 操作来有效地显示结果。


    ## 9. 带有计分板的问答游戏

    **主题**：`Functions`、`Conditional Statements`、`Arrays`、`Event Handling`

    **复杂度**：初级

    **描述**：构建一个带有多选题和计分板的简单问答游戏。该项目提供了数组处理问题、事件处理以及使用条件语句进行评分的练习。


    ## 10. 带有播放列表管理的音乐播放器

    **主题**：`Arrays`、`Functions`、`DOM Manipulation`、`Event Handling`、`Local Storage`

    **复杂度**：高级

    **描述**：创建一个音乐播放器，用户可以播放、暂停和跳过歌曲并具备播放列表功能。将播放列表存储在本地存储中，使用数组管理歌曲数据，并利用 DOM 操作进行控制。


