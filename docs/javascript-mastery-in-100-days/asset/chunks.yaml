    # 第 5 章：DOM 操作


    让我们开始学习吧！


    ### 文档对象模型 (DOM) 简介

    当你思考网页时，你通常会想象那里会有文本、图像和你可以与之交互的按钮。但在背后，有更复杂的东西在运行，组织页面上的所有内容正是 `文档对象模型 (DOM)`
    发挥作用的地方。DOM 充当了网页内容与可以修改它的内容的编程语言（如 `JavaScript`）之间的连接器。


    ### 什么是 DOM？

    `文档对象模型 (DOM)` 是 Web 文档的编程接口。它表示页面，以便程序更改文档的结构、样式和内容。`DOM` 将文档表示为节点和对象；这样，编程语言就可以与页面进行交互。


    例如，当网页加载时，浏览器会自动将 `HTML` 转换为 `DOM`，然后 `JavaScript` 就可以访问它。将 `DOM` 视为 `HTML` 结构的实时版本，其中
    `JavaScript` 登场表演并进行更改，这些更改将立即显示在页面上，而无需重新加载。


    ### DOM 树结构

    为了更好地理解 `DOM`，让我们将其拆解。`HTML` 文件：


    ![](img/image_rsrc17U.jpg)


    61

    浏览器将其转换为树形结构：


    ![](img/image_rsrc17V.jpg)


    在这里，`<html>`、`<head>` 和 `<body>` 标签是树枝，而里面的内容是树叶。由于 `DOM` 是网页的树结构，我们可以操作它。


    ### 使用 JavaScript 访问 DOM

    好了，现在你知道 `DOM` 是网页的树结构，那么如何使用 `JavaScript` 来操作它呢？很简单，`JavaScript` 可以通过内置方法进入树。


    #### 选择元素

    想要获取页面上的特定元素？你可以使用这些方法：

    - `document.getElementById()` - 通过其唯一 ID 获取元素。


    ![](img/image_rsrc17W.jpg)

    - `document.getElementsByClassName()` - 通过类名选择所有元素。


    ![](img/image_rsrc17X.jpg)

    - `document.querySelector()` - 想要更具体的选择，比如选择第一个段落或标题？可以使用这种方法。


    ![](img/image_rsrc17Y.jpg)

    - `document.querySelectorAll()` - 如果你想选择多个匹配 CSS 选择器的元素，这是你的方法。


    ![](img/image_rsrc17Z.jpg)


    #### 修改元素

    现在你获取了元素，你还可以更改它的内容或样式。

    更改元素的内容：


    ![](img/image_rsrc180.jpg)

    更改元素的属性（例如链接的 URL）：

    63

    ![](img/image_rsrc181.jpg)

    更改元素的样式：


    ![](img/image_rsrc182.jpg)


    #### 实时交互

    `DOM` 的强大功能之一是它允许你创建实时交互。`JavaScript` 可以随时修改 `DOM`，这意味着你可以根据用户操作、API 响应或时间事件更改内容和样式。


    例如，你可以动态添加新元素、删除现有元素，或者在点击按钮时更新内容：


    ![](img/image_rsrc183.jpg)

    在示例中，每当点击按钮，页面上就会添加一个新的段落。


    ### 为什么 DOM 重要？

    `DOM` 是制作网页动态化和交互的基础。没有它，网页将是静态的，在页面最初加载后没有方法更改或更新内容。通过理解和使用 `DOM`，你可以通过创建 Web
    应用内容和布局的响应式实时变化来增强用户体验。


    掌握 `DOM` 操作对于成为一名有效的 JavaScript 开发者至关重要，因为它开启了创建丰富交互式体验的大门。


    简而言之，`DOM` 赋予你控制网站的行为，使其不仅仅是信息的简单展示，而且为你的用户提供了动态、交互的体验。


