    ## 异步编程简介


    ### 理解异步编程


    异步编程是一种技术，允许你的程序启动一个可能耗时较长的任务，并在任务运行期间能够响应其他事件，而不是必须等待该任务完成。一旦任务完成，你的程序将获得结果。


    JavaScript 默认是同步的：每行代码都按顺序执行，每个任务都必须等待上一个任务完成后才能开始下一个。


    ### 同步与异步


    在同步编程中，任务按顺序一个一个执行。每个任务在开始下一个任务之前都必须完成。如果某个任务执行需要很长时间，就会导致问题，因为它会阻塞后续任务。


