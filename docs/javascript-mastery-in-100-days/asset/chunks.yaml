    ## Introduction to Asynchronous Programming


    ### Understanding Asynchronous Programming


    Asynchronous programming is a technique that enables your program to start a potentially
    long-running task and still be able to be responsive to other events while that
    task runs, rather than having to wait until that task has finished. Once that
    task has finished, your program is presented with the result.


    JavaScript is synchronous by default: every line of code is executed one after
    the other, and each task must wait for the previous one to be completed before
    moving to the next.


    ### Synchronous vs. Asynchronous


    In synchronous programming, tasks are executed one after the other. Each task
    must complete before the next one begins. This can lead to problems if a task
    takes a long time to finish, as it can block subsequent tasks.


    ![](image_rsrc175.jpg)


    # 42


    In asynchronous programming, tasks can be initiated and continue running in the
    background while other tasks execute. This allows your application to remain responsive.


