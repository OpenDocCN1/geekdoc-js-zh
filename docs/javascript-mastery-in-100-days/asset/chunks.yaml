    # 第一章：JavaScript 基础


    让我们学习！


    ## JavaScript 基础


    JavaScript 是一种非常著名的编程语言，它可以增强网站的交互性，影响游戏、按钮响应、表单数据输入、动态样式、动画等。本书将作为你学习 JavaScript
    的起点，扩展你对其可能性的理解。让我们深入了解它吧。


    ### JavaScript 简介


    让我们从基础知识开始。JavaScript 诞生于 20 世纪 90 年代中期，是一种用于制作交互网页简单脚本语言。这种编程语言由 Brendan Eich
    在 Netscape Communications 工作期间仅用短短十天时间创造。他万没想到，他的创造将彻底改变互联网，并成为全球最广泛使用的编程语言之一。


    通过动态 Web 应用程序，异步操作网页元素。现在，JavaScript 无处不在，从服务器后端到动态单页应用，这证明了它在技术行业中的适应性和无不在。


    ### 变量与数据类型


    在 JavaScript 中，`Variables` 用于存储数据值。它可以包含不同类型的信息，如数字、字符串、布尔值、数组、对象等。与其他编程语言不同，JavaScript
    是动态类型的，不需要显式声明变量类型。这背后的原因是它使得代码编写更加灵活且富有表现力。


    ### 运算符与表达式


    在 JavaScript 中，运算符是在操作数上执行某些操作的符号。例如，数学符号看起来很基础，但在这种语言中，它们可以用于执行广泛的计算，而逻辑符号则组合了做出决策的条件。编写健壮且高效的
    JavaScript 代码需要理解运算符的功能。


    JavaScript 之所以流行是因为它可以管理用户交互并与服务器通信。


    ### 控制流与条件语句


    控制流语句用于通过某些条件确定代码的执行方式。例如 `if...else` 语句、`switch` 语句和三元运算符； JavaScript 提供了实现这些目标的方法。这些功能让开发者能够创建适应不同情况的代码，使他们的应用程序更加灵活强大。


    ### 循环与迭代


    在更高效地执行重复任务时，循环非常重要。JavaScript 提供了许多循环结构，包括 `while`、`for` 和 `do…while` 循环，每个循环都有特定的角色和用途。无论是涉及遍历数组、处理用户输入还是计算顺序，它都能让编码变得更容易并提高生产力效率。


    这些主题是掌握 JavaScript 的关键，也是通向掌握高级概念的基石。通过牢固掌握这些基础，你将建立克服 JavaScript 学习路径中复杂挑战所需的信心和能力。继续探索、实验和创造，迈向精通
    JavaScript。


    ## 变量与数据类型


    ### 理解 JavaScript 变量


    在 JavaScript 中，`Variables` 被数据存储容器。与其他某些编程语言不同，JavaScript 是动态类型的，这意味着你不需要显式声明变量的数据类型。这提供了灵活性，允许你在整个代码中为同一个变量分配不同类型。


    ![](img/image_rsrc15B.jpg)


    ### JavaScript 中的 3 种运算符


    JavaScript 中的运算符在操作数上执行操作，允许你处理代码中的数据。JavaScript 支持多种类型的运算符，包括：

    - **算术运算符**：用于比较数学计算。

    - **比较运算符**：用于比较值并返回真或假。

    - **逻辑运算符**：用于组合多个条件。


    ![](img/image_rsrc15C.jpg)


    JavaScript `Expressions` 是值、变量和运算符的组合，会产生结果。无论是执行简单计算还是复杂逻辑，表达式在 JavaScript 编程中起着至关重要的作用。


    学习如何使用运算符和表达式使你能够编写高效准确执行所需任务的代码。一旦你理解了这些基础，你就能 JavaScript 中创建更高级的程序。


    ![](img/image_rsrc15D.jpg) 你知道吗？


    你可以在 HTML 中编写 JavaScript 代码。HTML 的 `<script>` 标签对 JavaScript 的支持自 HTML 2.0 就有了。因此，如果你在进行个人项目，可以在
    HTML 中包含 JS。然而，在生产级项目中不建议使用这种方法。相反，建议链接单独的 JavaScript 文件。此外，如果你在做个人项目并在 HTML 中编写脚本，非常建议将
    `<script>` 标签保留在 `body` 中。


    ### 运算符与表达式


    JavaScript 中用于对操作数执行操作的符号被称为运算符，它们允许你处理代码中的数据。JavaScript 中有几种类型的运算符，每种类型都有其不同的用途。


    - **算术运算符**：用于执行数学计算，如加法、减法、乘法和除法。


    ![](img/image_rsrc15E.jpg)

    - **比较运算符**：用于比较值并根据比较结果返回真或假。


    ![](img/image_rsrc15F.jpg)

    - **逻辑运算符**：用于组合多个条件并返回真或假。


    ![](img/image_rsrc15G.jpg)


    JavaScript 中的 `Expressions` 是值、变量和运算符的组合，产生结果。无论你是执行简单计算还是实现复杂逻辑，表达式都能让你有效地表达你的意图。


    ![](img/image_rsrc15H.jpg)


    为了编写高效简洁的 JavaScript 代码，了解运算符和表达式非常重要。它允许程序员更精确地处理数据并更清晰地控制程序流。


    ### 控制流与条件语句


    JavaScript 中有控制流语句，允许根据某些条件操控程序的执行。在 JavaScript 中，有用于不同用途的条件语句：


    - **if...else 语句**：如果指定条件为真，则执行代码块；否则执行另一个代码块。


    ![](img/image_rsrc15J.jpg)

    - **switch 语句**：评估表达式并根据匹配的 case 标签执行代码块。


    理解如何有效使用条件语句允许你创建动态且响应的 JavaScript 应用程序，以适应不同的场景和用户交互。6


    ### 循环与迭代


    JavaScript 中的循环让你反复运行某段代码，只要特定条件保持为真。JavaScript 提供了许多不同的循环，根据它们使用的条件而异。


    - **For 循环**：执行指定次数的代码块。


    ![](img/image_rsrc15K.jpg)

    - **while 循环**：只要条件为真就执行的循环。


    ![](img/image_rsrc15M.jpg)

    - **do…while 循环**：类似于 while 循环，但即使条件为假，代码块也会至少运行一次。


    ![](img/image_rsrc15N.jpg)


