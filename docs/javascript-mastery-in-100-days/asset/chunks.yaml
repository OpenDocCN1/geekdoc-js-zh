    ## JSON 的操作


    ### JSON 简介


    `JSON`（JavaScript 对象表示）是一种基于文本的格式，用于以既人类可读又机器可解析的方式存储和交换数据。因此，`JSON` 相对容易学习和排错。尽管
    `JSON` 植根于 JavaScript，但它已经发展成为一种非常强大的数据格式，简化了跨平台和跨编程语言的数据交换。如果你涉及 Web 开发、数据分析或软件工程，`JSON`
    是一个需要理解的重要数据格式。


    `JSON` 数据以键值对的形式表示，类似于 JavaScript 对象。键是字符串，值可以是字符串、数字、数组、对象、布尔值或 `null`。


    ![](img/image_rsrc16T.jpg)


    ### 解析 JSON


    在 JavaScript 中，我们可以使用 `JSON.parse()` 方法将 JSON 字符串解析为 JavaScript 对象。该方法允许你像处理普通
    JavaScript 对象一样处理数据。


    # 34


    ![](img/image_rsrc16U.jpg)


    ### 序列化 JavaScript 对象


    `JSON.stringify()` 静态方法将 JavaScript 值转换为 JSON 字符串，如果指定了替换函数（replacer function），可以选择替换值；或者如果指定了替换数组（replacer
    array），则可以选择仅包含指定的属性。


    ![](img/image_rsrc16V.jpg)


    ### 操作 JSON 数据


    为了在 JavaScript 中操作 JSON 数据，我们可以使用 `JSON.parse()` 方法将 JSON 字符串解析为 JavaScript 对象。一旦解析，我们可以根据需要访问并修改
    JavaScript 对象的属性。


    ![](img/image_rsrc16W.jpg)


    # 35


    ## JSON 的实际应用


    开发者在 Web 开发中使用 `JSON` 有于不同的目的，包括：


    - **API 数据交换**：许多 Web API（应用程序编程接口）使用 `JSON` 作为服务器与客户端应用程序之间发送和接收的数据交换格式。使用 `JSON`
    的 API 称为 `JSON API`。

    - **配置文件**：`JSON` 通常用于在文件中存储设置和数据，例如 `Node.js` 项目中的 `package.json` 或 `ASP.NET
    Core` 中的 `appsettings.json`。示例——每当我们创建一个 react 应用时，你都会看到 `package.json`，它会配置你的应用程序，每当你安装新包时，它都会以
    `JSON` 的形式更新在 `package.json` 中。

    - **数据存储与交换**：`JSON` 常用于数据库、Web 服务和其他系统中存储和传输结构化数据。


    理解 `JSON` 的工作原理以及如何与 JSON 数据交互对 Web 开发者非常有用，因为它是现代 Web 开发的基础部分，并广泛用于构建 Web 应用程序和服务。通过掌握
    `JSON`，你可以有效地在 Web 项目中交换、存储和操作数据。


