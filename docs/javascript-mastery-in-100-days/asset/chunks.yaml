    - `filter()` 该方法创建一个新数组，其中包含所有通过提供的函数所实现的测试的元素。

    ![](img/image_rsrc16H.jpg)

    - `reduce()` 该方法对累加器和数组中的每个元素应用函数，以将其还原为单个值。

    ![](img/image_rsrc16J.jpg)


    - `find()` 和 `findIndex` 这方法分别返回第一个匹配所提供的测试函数的元素及其索引。


    通过学习这些数组方法，你可以快速地处理 JavaScript 应用程序中的数据。数组在 JavaScript 中是关键且实用的。知道如何良好使用它们是精通该语言的关键。


    ## 对象与面向对象编程


    ### 理解对象

    对象是属性的集合，而属性是名称（或键）与值之间的关联。属性的值可以是一个函数，在这种情况下，该属性被称为方法。JavaScript 中的对象就像许多其他编程语言中的一样，可以与现实生活中的对象进行比较。


    ### 创建对象的某些方法

    **对象字面量** 创建对象简单的方法是使用对象字面量，它是封装在花括号 `{ }` 中的逗号分隔的键值对列表。

    ![](img/image_rsrc16K.jpg)


    **构造函数** 创建对象的另一种方法是使用构造函数，它定义了创建对象的模板。

    ![](img/image_rsrc16M.jpg)

    **`Object.create` 方法** 该方法创建一个具有指定原型对象和属性的新对象。


    ## JavaScript 中的面向对象编程 (OOP)

    面向对象编程 (OOP) 是一种编程范式，使用对象将软件应用程序结构为可重用的代码段和蓝图。OOP 日用于大型、复杂且活跃维护的项目。


    OOP 使得能够隔离创建和管理应用程序的许多部分，并在连接它们时而不会让它们相互依赖。JavaScript 是一种基于原型的语言，支持抽象、封装、多态和继承等
    OOP 原则。


    ### 抽象

    抽象是面向对象编程 (OOP) 中的一个基本概念，指的是隐藏对象的实现细节并仅向用户暴露基本特征的做法。在 JavaScript 中，抽象通过使用抽象类和接口来实现。


    抽象类是一种无法实例化的类，旨在作为其他类的基类。抽象类通常包含一个或多个抽象方法，这些方法具有签名但没有实现。这些方法必须由派生类实现。


    JavaScript 原生并不支持抽象类，但你可以通过结合函数构造函数和原型来实现类似的功能。

    ![](img/image_rsrc16N.jpg)


    在这个示例中，`Shape` 类是一个抽象类，它无法实例化，并包含一个抽象方法 `draw()`，该方法在调用时会抛出错误。`Circle` 类继承自 `Shape`
    类并实现了 `draw()` 方法，提供了特定的实现。


    接口是在 JavaScript 中实现抽象的另一种方式，尽管它不是 JavaScript 的原生功能。像 `TypeScript` 这样的库提供了接口。接口定义了类必须实现的方法集，但没有为这些方法提供实现。这允许开发者确保一个类具有所需的方法，而无需指定这些方法应如何实现。


    ### 封装

    封装是面向对象编程 (OOP) 中的一个基本概念，指的是向其他对象和代码隐藏对象内部细节的做法。在 JavaScript 中，封装通过使用闭包和访问修饰符（例如
    `private` 和 `public` 关键字）来实现。


    JavaScript 使用闭包来实现封装，这允许开发者创建从对象外部访问的私有变量和方法。例如，考虑以下代码：

    ![](img/image_rsrc16P.jpg)


    在这个示例中，`privateAge` 变量定义在构造函数内部，只能通过 `getAge` 方法访问。这意味着对象的内部状态对其他对象和代码隐藏了，提供了某种保护和安全性。


    `private`、`public` 和 `protected` 等访问修饰符在 JavaScript 中并不原生支持，但也可以闭包来实现。此外，像 `TypeScript`
    等其他库和框架提供了使用访问修饰符的方法。


    总之，封装是 OOP 中的一个基本概念，允许开发者向其他对象和代码隐藏对象的内部细节。在 JavaScript 中，封装通过使用闭包和访问修饰符（如 `private`
    和 `public` 关键字）来实现。这允许开发者保护对象的内部状态并创建更健壮、更易维护的代码。JavaScript 原生不支持，但可以使用闭包和像 `TypeScript`
    这样的库来实现。


    ### 多态

    多态是面向对象编程 (OOP) 中的一个基本概念，指的是不同对象以不同方式响应相同方法调的能力。在 JavaScript 中，多态通过使用函数重载和函数重写来实现。


    函数重载是指函数根据传递给它的参数的数量和/或类型具有多个实现的能力。JavaScript 原生并不支持函数重载，但你可以通过使用 `arguments`
    对象并检查传递给函数的参数数量和/或类型来实现类似的功能。


    函数重写是指子类对其超父类已提供的方法提供不同实现的能力。在 JavaScript 中，这可以通过重新分配子类的原型来实现。例如，考虑以下代码：

