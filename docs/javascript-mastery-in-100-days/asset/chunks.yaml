    性能（Performance）选项卡允许你捕获并分析代码不同部分的运行情况。它显示了每个函数或组件消耗的时间，突出了可以通过优化来提高速度的区域。


    通过运行性能分析，你可以直观地跟踪渲染、脚本执行和布局时间，从而轻松发现并减少卡顿操作。


    ## 使用 Lighthouse 审计性能和最佳实践


    Lighthouse 集成在开发者工具（DevTools）中，是一个强大的工具，用于审计你的应用的性能、可访问性、SEO 等。运行 Lighthouse 报告可以获得可操作的建议，帮助你符合行业标准。


    ## 结论


    浏览器开发者工具是调试和性能调优的“瑞士军刀”。从 `Console` 日志到 `Performance` 选项卡，每项功能都赋予了你诊断、修复和优化代码的能力。通过经常使用，DevTools
    将调试从一项苦差的任务转变为构建响应式、用户友好应用程序的重要部分。


    ![](img/image_rsrc15A.jpg)第 10 章


    ## 增强性能与安全


    让我们开始并学习吧！


    ### 在 JavaScript 世界中保持更新


    JavaScript 正在不断进化，保持与时同步是在该领域脱颖出的关键。从新的语言特性到新兴的库和工具，总有新东西需要学习。以下是如何跟上 JavaScript
    最新动态的方法。


    #### 如何保持在圈内？


    1. 关注信赖的博客和网站：像 `MDN Web Docs`、`JavaScript Weekly` 和 `Smashing Magazine` 这样可靠的来源提供了新进展的及时更新。你也可以订阅
    `JavaScript Weekly` 等邮件，直接在收件箱中接收精选新闻和文章。

    2. 参与开发者社区：像 `Stack Overflow`、`Dev.to` 甚至 Reddit 的 `r/javascript` 等平台可以让你与全球的开发者联系起来。此外，通过关注开发者和技术影响人物，你可以获得实用的技巧和见解。（欢迎在
    `X` 上关注我 `@anshulsoni2010` 以保持更新并参与对话！）

    3. 尝试新功能：在新功能或 `APIs` 发布后立即对其进行测试。侧边项目或代码片段是探索和亲手实践使用最新更新的绝佳方式。

    4. 参加在线课程并加入研讨会网站：`Coursera`、`Udemy` 和 `freeCodeCamp` 等网站提供最新的 JavaScript 课程。参加研讨会或会议也能让你接触到最新的趋势和最佳实践。


    #### 结论


    通过这些策略，你将保持领先并充分利用 JavaScript 的增长。跟上这种语言，尝试它的新功能，你的技能将始终保持敏锐。拥抱这段旅程，继续探索，并记住 JavaScript
    有无限的！


    ### 探索新兴趋势


    随着 JavaScript 的增长，新的趋势和技术正在塑造我们构建 Web 应用的方式。关注这些趋势有助于你预测变化，使技能面向未来，并构建更强大、更用户友好的应用程序。让我们深入探讨几个正在引起浪潮的关键趋势。


    #### 值得关注的关键 JavaScript 趋势


    1. 服务端渲染 (SSR) 和静态站点生成 (SSG)：随着 `Next.js` 和 `Nuxt.js` 等框架的兴起，服务端渲染和静态站点生成正成为快速且符合
    SEO 的网站至关重要。`SSR` 通过在内容到达客户端之前在服务器上进行渲染，可以显著提高加载时间和用户体验。

    2. JAMstack 架构：`JAMstack`（JavaScript、`APIs` 和标记）因创建快速、可扩展的 Web 应用程序而迅速流行。通过将前端与后端解耦，`JAMstack`
    提供了灵活性和性能优势，是现代 Web 应用的理想选择。

    3. 渐进式 Web 应用 (PWAs)：`PWAs` 让 Web 应用能够像原生移动应用一样运行，具备离线访问、推送通知和设备集成。使用 `Service
    Workers` 和 `Cache API`，`PWAs` 允许开发者创建更有吸引力、更可靠的用户体验。

    4. 用于机器学习的 JavaScript：`TensorFlow.js` 和 `Brain.js` 等库使得在 JavaScript 中直接实现机器学习成为。这一趋势将
    JavaScript 的角色扩展到 Web 开发之外，为实时数据处理、用户个性化和预测功能打开了大门。

    5. WebAssembly (Wasm)：`WebAssembly` 允许开发者在浏览器中运行用 `C`、`C++` 和 `Rust` 等语言编写的代码。通过
    `Wasm`，你可以优化性能密集型任务，让复杂的应用程序运行更快更流畅。


    #### 拥抱未来


    通过关注这些趋势，你可以处于 Web 开发的前沿并不断改进应用程序。技术发展很快，但关注这些进步让你为 JavaScript 的未来做好准备。


    ### 探索新兴趋势（社交）


    精通 JavaScript 不仅仅关于代码；还关乎连接、分享见解以及与志同道合的开发者共同成长。代码社区不仅提供知识，还提供了引导你并提供持续灵感的支持系统。


    #### 加入这些网络如何提升你的旅程。 112


    #### 值得关注的关键 JavaScript 趋势


    1. 寻找导师和同伴：社区聚集了各个阶段的开发者，让你有机会从导师那里学习，并与同伴联系获取指导和反馈。

    2. 保持更新和动力：通过加入 `GitHub`、`Stack Overflow` 和实时社区，你可以获得持续不断的技巧、更新和鼓励。其中一个不断增长的社区是
    `CodeINBlogs`，这是一个基于 `WhatsApp` 的拥有超过 2000 名开发者的网络，由我 `Anshul Soni` 创建并运行。它专为快速方便的访问而设计，成员可以在此学习、讨论并与志同道合的开发者建立联系。

    3. 扩展你的网络：论坛、在线聚会和 `X` 等社交媒体可以让你与全球行业人士联系起来。（你也可以在 `X` 上关注我 `@anshulsoni2010`
    获取定期的 JavaScript 技巧和更新。）

    4. 为开源做贡献：在 `GitHub` 上贡献可以让你参与真实项目，提高技能并向潜在雇主展示你的工作。


    加入社区可以提供作为 JavaScript 开发者所需的支持、共享知识和灵感。拥抱这些网络，建立连接并与充满热情的人一起学习。


    ### 精通 JavaScript 并构建作品集的 10 个项目！


    1. 个人预算追踪

    主题：`Arrays`、`Objects`、`Functions`、`Local Storage`、`DOM Manipulation`复杂度：中等

    描述：创建一个可以添加、分类和追踪开支。该项目是练习使用数组和对象处理数据、操作 DOM 以及使用本地存储持久化的绝佳方式。


    2. 天气仪表板

    主题：`Fetch API`、`Async/Await`、`Error Handling`、`DOM Manipulation`复杂度：中等

    描述：使用外部 API 获取实时数据构建天气应用。用户可以通过城市或位置查看天气，错误处理对于无效输入或 API 问题至关重要。


    3. 实时聊天应用

    主题：`Functions`、`Event Handling`、`Async Programming (WebSocket or Fetch)`、`DOM
    Manipulation`复杂度：高级

    描述：开发一个用户可以即时交换信息的实时聊天应用。涉及事件处理、异步编程以及集成 WebSocket 或 Fetch API 实现实时通信。


    4. Markdown 编辑器

    主题：`DOM Manipulation`、`Event Handling`、`Functions`、`Arrays`复杂度：中等

    描述：创建一个 Markdown 编辑器，用户使用 markdown 语法编写文本，实时转换为 HTML。练习 DOM 操作、函数和事件处理以实现预览。


    5. 带有任务过滤和本地存储的待事项列表

    主题：`Arrays`、`Local Storage`、`Functions`、`DOM Manipulation`、`Event Handling`复杂度：入门


