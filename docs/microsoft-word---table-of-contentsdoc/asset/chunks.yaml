    }

    ```


    但你错了。如果我们通过 `perl -l` 运行这个 `for (1..3) { print ordinal($_) }`，我们得到如下结果：


    ```

    first

    second

    second

    ```


    诶？最后一行不应该应该是关于未定义值的警告吗？遗憾的是，你触碰了 Perl[4] 的一个内部优化，该优化在词法变量消失后仍保留分配的存储，前提是它们很快可能再次被需要。


    `my` 语句既有编译时影响（声明变量），又有运行时影响（将其设置为 `undef`，除非该语句被失败的条件修饰）。


    [4] 这在未来的版本中可能会改变。


    **永远不要用条件修饰 my 语句。**


    注意，这里说的的不是在条件*内部*放置 `my` 语句：


    ```

    if ((my $tag = $element->tag) ne ''p'')

    {


    # 使用 $tag 的代码

    }

    ```


    ```

    while (my ($key, $value) = each %hash) { ... }

    ```


    这是一个非常好的惯用法，因为它简洁地将新变量的作用范围精确限制在需要它的块中。


    ### 10.6 引入一些闭包


    理解词法变量如何工作是值得的。假设你已经进步到了理解闭包的阶段——给自己拍拍掌吧——你决定编写几个使用这种私有变量的子程序：


    ```

    {

    my $protocol = "ftp"; # 默认

    sub get_proto

    {


    return $protocol;

    }


    sub set_proto

    {


    $protocol = shift;

    }

    }

    ```


    ### 11 资源失效


    “他死了，吉姆。”


    ![图像 66](img/index-119_1.jpg)


    — *星际迷航中的 McCoy 医生* 计算机科学家专业地谈论“图完备”编程语言，据此指的是一种被证明等同于图灵机的语言。图灵机是由艾兰·图灵发明的假设设备，由通过读写头的磁带组成，该头根据规则表读取并打印字符。遗憾的是，任何编程语言的实现都没有或永远达到“图完备”的严格定义，因为图灵规定他的机器配备了无限长的带。他还规定机器被允许任意的时间来解决问题，这对于学术界以外的人来说是一种奢侈。


    本章关于当你的有限资源变得过于有限时该怎么办。我们将讨论当耗尽时间、内存或磁盘空间时如何应对。


    ### 11.1 先优化人，后优化资源


    注意，我们没有说“如何*避免*耗尽……”。这有一个很好的理由：如果你从一开始就开始担心这个，你优化的对象错了。虽然你会在 Usenet 上看到许多资深人士抱怨某些代码没有他们最新的变体那样高效，但请理解他们处于一种处境：在这种语境下，他们刚刚写出的复杂代码对他们来说就像其他任何代码一样清晰。通常，他们提出这些性能增强是为了让问题更有趣。

    '
- fmt: "\nBy far the most dominant resource cost in software today is not CPU speed,\
    \ RAM, or disk space; it's people. The time spent by people developing, documenting,\
    \ maintaining, inheriting, reading, porting, modifying, enhancing, understanding,\
    \ or debugging an application is the most precious and scarce resource in information\
    \ technology. Therefore our advice up to this point has focused on how to develop\
    \ applications to make the best use of that time.\n\nAlso, don't underestimate\
    \ the ability of Moore's Law to help you. In other words, if you're developing\
    \ an application that will not be operational for another year and a half, by\
    \ that time processors will be twice as fast, RAM will be half the price, and\
    \ disk drives will be twice as big. If you're able to trade developer time for\
    \ procurement dollars (and it's strange how many companies devalue their employees'\
    \ time in comparison to their hardware even though their bank account doesn't\
    \ know the difference) and the problem can be solved more cheaply by better hardware,\
    \ get it.\n\nThere will be plenty of other opportunities to practice writing efficient\
    \ programs because sometimes you really won't have enough resources to run them,\
    \ and then you will have to make them do better. Whatever you are developing,\
    \ though, don't assume you know in advance what resource you may run out of. The\
    \ aforementioned seasoned professionals know that the ability of even the best\
    \ of them to predict such things is notoriously unreliable.[1]\n\n[1] This is\
    \ not to say that there aren't occasions when resource limitations are fairly\
    \ obvious. If you're archiving the entire World Wide Web, you should probably\
    \ be concerned about disk space before you start. (If you *are* archiving the\
    \ entire World Wide Web using `Perl`, please drop us a line; we have a few questions\
    \ to ask you.)\n\nWe will show how you can optimize your programs for speed, memory,\
    \ or disk space.\n\nHowever, these are not independent variables; frequently there\
    \ are trade-offs (e.g., gaining memory at the expense of disk space). Equally\
    \ common are parallel gains: For instance, as you improve your code style, memory\
    \ usage may go down and execution speed may go up due to fewer memory accesses.\n\
    \n## 11.2 Benchmark It!\n\nBecause it's generally so hard to tell by looking at\
    \ the code where the bottlenecks are (especially since they may move depending\
    \ on your hardware configuration), you have to be able to measure them objectively.\
    \ You may have no recourse but to use the native tools of your operating system\
    \ to measure virtual memory usage in particular. (See `Perl of Wisdom #29`). In\
    \ this respect we confess we are far more experienced on the various Unix platforms\
    \ than on the Macintosh or Windows.[2]\n\n[2] We tried measuring process size\
    \ on Windows 98 using a freeware tool called `prcview` and were baffled by the\
    \ results. It appeared that every process out of a couple of dozen was using at\
    \ least 20 MB.\n\n### 11.2.1 Measuring Memory Usage\n\nThe `top` program available\
    \ on most Unix variants is very good for determining how much processor time and\
    \ virtual memory are being used by current processes. To gather the same information\
    \ from inside a script, or if your `top` is restricted for root's use only, use\
    \ the `ps` program to get information about the process numbered `pid`. On `SYSV`\
    \ systems, use `ps -lp pid`; on `BSDish` systems, use `ps u pid`. (You can usually\
    \ use a repeated `-w` flag on `SYSV` or a `w` flag on `BSD` to see more of the\
    \ command column if it is truncated.) In each case, there are two columns labeled\
    \ `SZ` (or `VSZ`) and `RSS`. Roughly speaking, these are, respectively, the total\
    \ virtual memory in use by the process and the amount of physical memory in use,\
    \ both in kilobytes. Note that the amount of memory allocated by a Unix process\
    \ never decreases before it terminates; whenever it frees memory it makes it available\
    \ only for the same process to reuse again later. (It is not returned to the free\
    \ pool for other processes to use.)\n\nA very large and lengthy program of mine\
    \ that reports its girth hourly has just displayed\n\n```\nUSER PID %CPU %MEM\
    \ SZ RSS TT S START TIME COMMAND\npeter 28679 51.9 48.5 35248 30072 ? S 08:42:02\n\
    279:33 [truncated]\n```\n\nwhich shows that its total memory usage is 35 MB, 30\
    \ of which are in physical memory. (The output was doctored slightly since the\
    \ columns output by `ps` had actually run together.) Because it has had problems\
    \ with running out of memory, this provides periodic statistics that tell me what\
    \ it really uses.\n\nIf you want to monitor the progress of your own Perl script,\
    \ use `$$` in place of `pid`: `printf \"Current virtual memory: %sk\\n\", unpack('@24A5',\
    \ (`ps u $$`)[1];`\n\n(The actual unpack template you have to use may be different\
    \ for your `ps`. By using a subscript on the backticks in list context, we can\
    \ ignore the header line output by `ps$.) You can use `ps` like this to see the\
    \ actual amount of memory used by your program as it executes. (And remember that\
    \ on Unix, process sizes never decrease, no matter how much memory you free in\
    \ your program. Your process will never get smaller than its largest memory allocation.)\n\
    \nUnder MacOS, access \"About This Computer\" from the Apple menu. A graphic displays\
    \ the allocated memory per process and the fraction used (see Figure 11-1).\n\n\
    **Figure 11-1. Memory usage under MacOS**\n\n### 11.2.2 Measuring CPU usage\n\n\
    The same `ps` or `top` commands will also tell you how much cpu and elapsed time\
    \ a process has used, of course. You can also use the `time` command to tell you:\n\
    \n```\ntime myprog\n0.050u 0.180s 3.68\n```\n\nThis tells you that `myprog` took\
    \ 3.68 seconds of realtime but spent only 0.23 using the CPU. But what if you\
    \ want to find the fastest strategy among several choices? Fortunately, Perl can\
    \ do it for you with the `Benchmark` module. Let's say you're initializing a large\
    \ hash inside a loop:\n\n```perl\nuse Benchmark;\n\ntimethese(400, {\n  undef\
    \   => '@h{10000} = ()',\n  set     => '@h{10000} = (1)x10000',\n  loop   => '$h{$}\
    \ = undef for 10000',\n  loopset => '$h{$} = 1 for 10000',\n});\n```\n\nThe results\
    \ from this are:\n\n[3] We're leaving out some redundant parts of the output that\
    \ would make it harder to read. Benchmark: timing 400 iterations of loop, loopset,\
    \ set, undef...\n\nloop: 21 wallclock secs (21.07 usr + 0.01 sys = 21.08 CPU)\n\
    loopset: 21 wallclock secs (21.03 usr + 0.00 sys = 21.03 CPU)\nset: 17 wallclock\
    \ secs (16.44 usr + 0.01 sys = 16.45 CPU)\nundef: 8 wallclock secs (7.58 usr +\
    \ 0.00 sys = 7.58 CPU)\n\nNote that the tests are run in alphabetical order by\
    \ name, not necessarily in the order they were specified; that's because they're\
    \ hash keys, and hashes have no innate ordering. If the code you're testing does\
    \ little or no I/O, the figures you should compare are the CPU times; the wall\
    \ clock figures can be skewed if the machine is busy servicing other processes.\
    \ If you're testing different code snippets that do lots of I/O, and do that I/O\
    \ differently, then you have more of a problem. You have no choice except to compare\
    \ wall clock figures, but you must make sure that the system isn't interrupted\
    \ by some other large process while you are benchmarking. So keep an eye on it\
    \ with top or the equivalent to see what else is running during your benchmark.\n"
  raw: 'By far the most dominant resource cost in software today is not CPU speed,
    RAM, or disk space; it''s people. The time spent by people developing, documenting,
    maintaining, inheriting, reading, porting, modifying, enhancing, understanding,
    or debugging an application is the most precious and scarce resource in information
    technology. Therefore our advice up to this point has focused on how to develop
    applications to make the best use of that time.


    Also, don''t underestimate the ability of Moore''s Law to help you. In other words,
    if you''re developing an application that will not be operational for another
    year and a half, by that time processors will be twice as fast, RAM will be half
    the price, and disk drives will be twice as big. If you''re able to trade developer
    time for procurement dollars (and it''s strange how many companies devalue their
    employees'' time in comparison to their hardware even though their bank account
    doesn''t know the difference) and the problem can be solved more cheaply by better
    hardware, get it.


    There will be plenty of other opportunities to practice writing efficient programs
    because sometimes you really won''t have enough resources to run them, and then
    you will have to make them do better. Whatever you are developing, though, don''t
    assume you know in advance what resource you may run out of. The aforementioned
    seasoned professionals know that the ability of even the best of them to predict
    such things is notoriously unreliable.[1]


    [1] This is not to say that there aren''t occasions when resource limitations
    are fairly obvious. If you''re archiving the entire World Wide Web, you should
    probably be concerned about disk space before you start.


    (If you *are* archiving the entire World Wide Web using Perl, please drop us a
    line; we have a few questions to ask you.)


    We will show how you can optimize your programs for speed, memory, or disk space.


    However, these are not independent variables; frequently there are trade-offs
    (e.g., gaining memory at the expense of disk space). Equally common are parallel
    gains: For instance, as you improve your code style, memory usage may go down
    and execution speed may go up due to fewer memory accesses.


    **11.2 Benchmark It!**


    Because it''s generally so hard to tell by looking at the code where the bottlenecks
    are (especially since they may move depending on your hardware configuration),
    you have to be able to measure them objectively. You may have no recourse but
    to use the native tools of your operating system to measure virtual memory usage
    in particular. (See Perl of Wisdom


    #29.) In this respect we confess we are far more experienced on the various Unix
    platforms than on the Macintosh or Windows.[2]


    [2] We tried measuring process size on Windows 98 using a freeware tool called
    prcview and were baffled by the results. It appeared that every process out of
    a couple of dozen was using at least 20 MB.


    **11.2.1 Measuring Memory Usage**


    The top program available on most Unix variants is very good for determining how
    much processor time and virtual memory are being used by current processes. To
    gather the same


    ![Image 68](index-121_1.jpg)


    information from inside a script, or if your top is restricted for root''s use
    only, use the ps program to get information about the process numbered pid. On
    SYSVish systems, use ps


    -lp pid; on BSDish systems, use ps u pid. (You can usually use a repeated -w flag
    on SYSV or a w flag on BSD to see more of the command column if it is truncated.)
    In each case, there are two columns labeled SZ (or VSZ) and RSS. Roughly speaking,
    these are, respectively, the total virtual memory in use by the process and the
    amount of physical memory in use, both in kilobytes. Note that the amount of memory
    allocated by a Unix process never decreases before it terminates; whenever it
    frees memory it makes it available only for the same process to reuse again later.
    (It is not returned to the free pool for other processes to use.)


    A very large and lengthy program of mine that reports its girth hourly has just
    displayed


    USER PID %CPU %MEM SZ RSS TT S START


    TIME COMMAND


    peter 28679 51.9 48.5 35248 30072 ? S 08:42:02


    279:33 [truncated]


    which shows that its total memory usage is 35 MB, 30 of which are in physical
    memory. (The output was doctored slightly since the columns output by ps had actually
    run together.) Because it has had problems with running out of memory, this provides
    periodic statistics that tell me what it really uses.


    If you want to monitor the progress of your own Perl script, use $$ in place of
    pid: printf "Current virtual memory: %sk\n", unpack ''@24A5'', (`ps u $$`)[1];


    (The actual unpack template you have to use may be different for your ps. By using
    a subscript on the backticks in list context, we can ignore the header line output
    by ps.) You can use ps like this to see the actual amount of memory used by your
    program as it executes. (And remember that on Unix, process sizes never decrease,
    no matter how much memory you free in your program. Your process will never get
    smaller than its largest memory allocation.)


    Under MacOS, access "About This Computer" from the Apple menu. A graphic displays
    the allocated memory per process and the fraction used (see Figure 11-1).


    **Figure 11-1\. Memory usage under MacOS**


    ![Image 69](index-122_1.jpg)


    **11.2.2 Measuring CPU usage**


    The same ps or top commands will also tell you how much cpu and elapsed time a
    process has used, of course. You can also use the Unix time command to tell you
    the same thing: $ **time myprog**


    0.050u 0.180s 0:03.68 6.2% 0+0k 0+0io 98pf+0w


    This tells you that myprog took 3.68 seconds of realtime to run, but spent only
    0.05 + 0.18 =


    0.23 seconds using the CPU (it must have been doing a lot of I/O).


    But what if you want to find the fastest strategy among several choices? You could
    run each one separately and time them, of course. Fortunately, Perl can do it
    for you with the Benchmark module, by Jarkko Hietaniemi and Tim Bunce. Let''s
    say that you''re initializing a large hash inside a loop that gets executed many
    times and you want to know whether it''s faster to use a hash slice or a foreach
    loop:


    use Benchmark;


    timethese (400,


    { undef => ''@h{1..10000} = ()'',


    set => ''@h{1..10000} = (1)x10000'',


    loop => ''$h{$_} = undef for 1..10000'',


    loopset => ''$h{$_} = 1 for 1..10000'',


    });


    The results from this are:[3]


    [3] We''re leaving out some redundant parts of the output that would make it harder
    to read here.


    Benchmark: timing 400 iterations of loop, loopset, set,


    undef...


    loop: 21 wallclock secs (21.07 usr + 0.01 sys =


    21.08 CPU)


    loopset: 21 wallclock secs (21.03 usr + 0.00 sys =


    21.03 CPU)


    set: 17 wallclock secs (16.44 usr + 0.01 sys =


    16.45 CPU)


    undef: 8 wallclock secs ( 7.58 usr + 0.00 sys =


    7.58 CPU)


    Note that the tests are run in alphabetical order by name, not necessarily in
    the order they were specified; that''s because they''re hash keys, and hashes
    have no innate ordering.


    If the code you''re testing does little or no I/O, the figures you should compare
    are the CPU


    times; the wall clock figures can be skewed if the machine is busy servicing other
    processes.


    If you''re testing different code snippets that do lots of I/O, and do that I/O
    differently, then you have more of a problem. You have no choice except to compare
    wall clock figures, but you must make sure that the system isn''t interrupted
    by some other large process while you are benchmarking. So keep an eye on it with
    top or the equivalent to see what else is running during your benchmark.'
