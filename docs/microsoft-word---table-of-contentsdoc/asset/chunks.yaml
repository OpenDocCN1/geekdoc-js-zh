    “发布供重用的代码在多大程度上应该是面向对象的”这个问题在 Perl 社区引发了激烈的派系争论，光谱两端都有充满激情的支持者。结果是，你可以采取任何立场，并通过诉诸权威来证明其合理性。[4]
    我们的经验法是：如果你编写的是仅供自己使用且不太可能有重大重用性的代码，那么将其面向对象的开销可能不值得。如果你编写的是供他人使用的代码，那么一个 O-O
    接口可能是值得投入的，考虑到它可以整洁地将接口与实现分离，并让你免于除了确保接口符合其承诺之外提供任何额外支持的需要。


    [4] 利用一切对你有利的 ...


    Perl 中的垃圾回收不是异步发生的，而是完全确定的（程序结束时进行全局析构期间释放对象的顺序除外）。当对象的引用计数降为零时，它会被立即销毁。


    尽管 Java 允许只继承一个具体的基类和多个抽象类，但 Perl 对这两种类没有区别，并称你可以随心所欲进行多重继承。然而，你可能会发现你对同源继承关系的担忧并不会发生。


    Perl 中的反射通过几种方法实现。如果对象 `$obj` 实现为哈希结构，你可以通过键 `%$obj` 发现它的属性集。你可以通过 `$obj->can(''meth'')`
    检查它是否支持给定的方法 `meth`，并且通过遍历包的符号表查找子程序来获取它支持的所有方法列表。最后，你可以通过跟踪 `@ISA` 数组包变量或使用 CPAN
    模块 `Class::ISA` 来构建继承层次结构


    `[(http://search.cpan.org/search?dist=Class-ISA](http://search.cpan.org/search?dist=Class-ISA))`
    它为这提供了一个友好的接口。


    析构函数链在 Perl 中也不会自动发生——Perl 中析化的术语是 `DESTROY`——原因与 Java 中的许多情况相似。


    与 Perl 的宽容哲学一致，没有等于 final 的机制来防止方法在派生类中被重写。


    ## 12.5.2 给 C++ 程序员的特定建议


    缺乏强类型可能对 C 程序员来说似乎是种解放，但对你来说可能可能是被冒犯的。（在掌握 Perl 精神之前，Perl 看起来可能是烦人的自由格式。）Perl
    确实有运算符重载，尽管它的使用频率没有你想象的那么高。`perldoc overload` 会告诉你关于它的所有信息。


    由于 Perl 没有强类型，你将不需要为泛型操作构建模板类，因为它们本身就是泛型的。


    我们个人认为在 C++ 中使用引用是很烦人的，因为函数原型的改变会改变函数调用时传递的实际值。如果你真的喜欢这个功能，你可以用 Perl 称为*子程序*（subroutine）*原型*（prototypes）的东西来以某种方式复制它——它们对你来说看起来不像原型——它们更像是指定可以传递的参数顺序和类型的模式——但结果之一是，你可以构造一个原型，允许子程序用数组被调用，并接收该数组的引用，而在通常情况下它接收的是数组中所有元素的列表。


    我们建议你不要急于使用这一特性，主要因为与 C++ 不同，Perl 并不要求声明原型才能运行程序，而且如果你的原型由于某种原因未能被声明——或者声明得太晚——那么你程序的语义将以极妙不可预测的方式发生变化。


    ## 第 13 章 调试 CGI 程序


    ![Image 82](img/index-142_1.jpg)


    “请告诉我，从这里我该往哪个方向走？”


    “这在很大程度上取决于你想去哪里，”猫说。


    —— *刘易斯·卡罗尔《爱丽丝仙仙境游记》* 谢奇猫以含蓄的评论和倾向于在不方便的时候部分或完全消失而闻名。通过 Web 服务器运行通用网关接口（CGI）程序可能会让人感觉很像爱丽丝（包括被拉伸和压扁）。


    ## 13.1 CGI


    一眼 `comp.lang.perl.misc` 可以发现许多人并不理解 CGI 协议与使用它的 Perl 脚本之间的区别。因此，我们认为花时间在这里解释它是我们的公民义务，尽管我们谈论的是某种不是
    Perl 的东西。（这就是 Perl 的联系——它与 Perl 毫无关系。这非常具有哥德尔风格。）


    通用网关接口（CGI）是一个关于 Web 服务器如何交付动态内容的规范。它说你可以有一个 URL，指向的不是静态文件，而是一个程序，该程序的输出将发送到浏览器。浏览器用户通过查看服务器返回的内容无法区分
    CGI 程序和静态文件；唯一的线索是 URL 通常看起来不同。（不是以 `.html` 结尾，它可能以 `.cgi` 结尾或包含 `/cgi-bin/`。不过这个规则并没有硬性规定。配置
    Web 服务器返回 URL 看起来像 CGI 程序的静态页面很容易，反之亦然。）但重点是，他们不应该关心是什么产生了输出。


    CGI 规范详细说明了通过这种方式调用的程序如何接收浏览器的输入（作为使用 `HTTP GET` 命令的 URL 的一部分，或者在带有 `POST` 命令的
    HTTP 内容中），程序如何看到这些输入（分别在 `QUERY_STRING` 环境变量和标准输入中），输入是如何编码的（一种将许多字符转换为十六进制表示的格式），以及程序除了浏览器可见内容之外还要发送什么（指定该内容的
    HTTP 头）。


    *CGI 规范并没有规定 CGI 程序的特定语言。* 这就是为什么在 Perl 组提 CGI 问题的人会被攻击。攻击者希望这些问题去的小组是 comp.infosystems.www.authoring.cgi。


    那么如何判断你的问题是 Perl 相关还是 CGI 相关？


    - 如果你的程序在命令行运行时产生明显正确的输出，但 Web 浏览器显示 500 - Server Error，那就是 CGI 问题。如果你无法在 Web
    服务器的命令行运行程序，请查看我们后面的提示。

    - 如果你的程序无法获取表单输入且你使用了 `CGI.pm`，那么 Web 服务器有问题。请使用我们后面的 `cgi-test` 程序进行测试。如果你没有使用
    `CGI.pm`，很少有人会帮助你，因为你让任务变得异常困难。

    - 如果你的程序花费太长时间产生任何输出，浏览器将放弃并显示“文档不包含数据”。如果你的 Web 服务器否则会缓冲你的输出，你可能需要使用非解析头（nph）脚本，否则设如何在浏览器超时之前产生输出。


    有关 CGI 的参考信息请参见 [`hoohoo.ncsa.uiuc.edu/cgi/interface.html`](http://hoohoo.ncsa.uiuc.edu/cgi/interface.html)。


    ## 13.2 Web 服务器


    世界上有许多类型和版本的 Web 服务器、平台和操作系统。它们的行为差异不在本书的范围内。我们的目标是使建议适用于尽可能广泛的组合，但在失败时（除非另有说明），我们所说的内容是在
    Linux 上的最新版本 Apache 上经过测试的。


