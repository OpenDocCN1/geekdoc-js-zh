- fmt: "\n3. Isolate the bug's location—where do things go south? (This is the reason\
    \ for the invention of debuggers.)\n\n4. Determine the conditions that cause the\
    \ bug. What activates it? Why haven't you found it before?\n\n5. Correct the bug—and\
    \ always retest altered code.\n\n6. How did the bug get in there in the first\
    \ place? If you made a typo and caught it 5 minutes later on a unit test, that's\
    \ one thing. If the bug was caused by a logic error and survived to release, you\
    \ have another problem. Find out how to improve your development process so that\
    \ any similar bugs are found much sooner.\n\n## 1.2 Why Perl?\n\nChances are,\
    \ if you use Perl you know why you picked it and don't need further proselytizing.\n\
    \nBut additional ammunition never hurts—if you have to defend Perl up your management\
    \ chain, well, Perl doesn't have a megamultinational conglomerate to pour zillions\
    \ of dollars into a marketing campaign[2]— so it falls to users like us to sing\
    \ its praises in practical ways.\n\n[2] If you think we have a specific example\
    \ in mind, you're probably right.\n\nWhenever we have a problem we need to solve\
    \ with a program, the solution first shows up in our mind, in thought pictures\
    \ and words, which most development methodologies then have us enunciate as an\
    \ English (or whatever our native language is) description of an algorithm before\
    \ ever translating it into code. If the algorithm description were complete and\
    \ unambiguous, it could be executed by a computer if the computer could understand\
    \ our phraseology.[3] But no parser yet exists for free-form English algorithm\
    \ descriptions, so we translate the description into some language a machine *can*\
    \ comprehend.\n\n[3] Of course, in practice, we always discover ambiguities and\
    \ insufficiencies in the natural language description when we later code it, but\
    \ this can be viewed as just not writing the description adequately. We suspect\
    \ this is so common because most of us are impatient to get on with the coding\
    \ anyway.\n\nTherein lies the rub: an ideal computer language imposes zero overhead\
    \ on the programmer during implemention of the description. Such a thing doesn't\
    \ exist, so we want the language that minimizes the overhead. This can vary from\
    \ task to task—if you're writing a device driver, your best choice is quite likely\
    \ to remain assembler. If you're writing a graphical user interface, at least\
    \ part of the problem is probably best attacked with a WYSIWYG editor that creates\
    \ a layout specification.\n\nWhen writing a program, you're conscious of its overhead\
    \ every time you create a requirement on code solely to satisfy the demands of\
    \ the language but not the problem. For example, in writing C and C++ programs,\
    \ a frequent example of this is how to allocate memory for dynamic data structures\
    \ and where and when to give it up.\n\nPerl imposes on the programmer the smallest\
    \ overhead of any language we have used for the vast majority of problems we have\
    \ had to solve. At the expense of little learning, we are able to create very\
    \ short programs in an incredibly brief time to solve complex problems.\n\nBecause\
    \ the language overhead is small, changes in requirements don't force changes\
    \ in large unrelated sections of the code since a much more natural mapping from\
    \ the English description of the solution to the Perl version exists. And because\
    \ the Perl expression of the solution is so succinct, a reader can encompass more\
    \ of it at a glance.\n\nIn fact, in many respects, Perl resembles English in its\
    \ ability to resolve ambiguities favorably, its intuitive and orthogonal interfaces,\
    \ and even how it sounds when read out loud.[4] Larry Wall, Perl's creator, often\
    \ states how his background in linguistics led him to consciously draw such parallels.[5]\
    \ Perl cognoscenti refer to this collective phenomenon as Perl's DWIM (Do What\
    \ I Mean) behavior.\n\n[4] We don't know whether this makes Perl easier or harder\
    \ to learn for nonnative English speakers. A research topic if ever there was\
    \ one.\n\n[5] You can find Larry's exposition on his guiding principle[s at: http://www.wall.org/~larry/natural.html](http://www.wall.org/~larry/natural.html).\n\
    \nIf you're in need of arguments of the kind that sway managers in favor of Perl,\
    \ see the Perl Success Stories pag[e] at [http://perl.oreilly.com/news/success_stories.html](http://perl.oreilly.com/news/success_stories.html).\
    \ If you're in need of arguments of the kind that sway scientists, see the language\
    \ comparison paper by Lutz Prechelt to be foun[d] at http://wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf](http://wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf).\n\
    \n## 1.3 Know the Environment\n\nKnowledge of a language includes experience with\
    \ the practical meanings of errors in different environments. If a Unix program\
    \ returns the error segmentation fault (those of you on other systems may experience\
    \ this variously as ABEND, %SYSTEM-F-ACCVIO, or your machine freezing), an experienced\
    \ programmer will first suspect a memory problem, often the result of a read or\
    \ write to an array beyond the array bounds. Another Unix error response, bus\
    \ error, often occurs when a subroutine or function call has an improper argument\
    \ list. Efficient error identification accompanies experience. This book tries\
    \ to encapsulate experience with errors made writing Perl programs.\n\n## 1.4\
    \ Know the Language\n\n![Image 8](index-10_1.jpg)\n\nJust as every country has\
    \ its customs, so does every computer language. We use a language best when we\
    \ adopt its customs rather than pretend we know better and try to force this new\
    \ language to fit our old prejudices.\n\nYears ago, after I had been working on\
    \ my first mainframe (an ICL 1903 running George III), I was introduced to my\
    \ second (a minicomputer: a VAX 11/780 running VAX/VMS). I spent some time defining\
    \ symbols in the new operating system so that I could type the same commands for\
    \ listing files, etc., I used in the old one. A wiser programmer nearby inquired,\
    \ \"Why would you want to make VMS like George III?\" Anyone who knows the relative\
    \ power of their respective line interfaces will appreciate the irony in this.\n\
    \nFind out the common Perl idioms and practice their use. There are generally\
    \ good reasons why they're common. If nothing else, adopting them will make your\
    \ code more maintainable.\n\nThese idioms can range from the simple two-element\
    \ \"open or die\": `open FH, $file or die \"Can't open $file: $!\"; to the mind-boggling\
    \ (at first sight) Schwartzian Transform:\n\n```perl\n@sorted = map $_->[0],\n\
    sort { $a->[1] <=> $b->[1] }\nmap $_, sortable_func($_) ]\n@unsorted;\n```\n\n\
    The first idiom soon becomes second nature (our fingers now type it by themselves),\
    \ although on first learning the language one might come up instead with:\n\n\
    ```perl\nif (open FH, $file)\n{\n    ...\n}\nelse\n{\n    die \"Unable to open\
    \ $file: $!\"\n}\n```\n\nIt's not hard to see why the idiom caught on. (Briefly,\
    \ here's why it works: open returns false if it fails, and the or logical operator\
    \ is short-circuiting, which means it doesn't evaluate its second argument if\
    \ the first one is true.)\n\nThe second idiom provides an efficient way of sorting\
    \ items that need manipulation before they can be sorted in an \"ASCIIbetical\"\
    \ or numeric collating sequence. When you learn this,\n\n![Image 9](index-11_1.jpg)\n\
    \n![Image 10](index-11_2.jpg)\n\nand realize there are only two tokens in it that\
    \ can change from one invocation to the next,[6] your eye naturally spots the\
    \ map-sort-map pattern and translates it to \"Schwartzian Transform\" whenever\
    \ appropriate.\n\n[6] The comparison function can be either <=> or cmp, and the\
    \ name of the function you provide to turn an unsortable quantity into a sortable\
    \ one will vary.\n"
  raw: '3\. Isolate the bug''s location—where do things go south? (This is the reason
    for the invention of debuggers.)


    4\. Determine the conditions that cause the bug. What activates it? Why haven''t
    you found it before?


    5\. Correct the bug—and always retest altered code.


    6\. How did the bug get in there in the first place? If you made a typo and caught
    it 5


    minutes later on a unit test, that''s one thing. If the bug was caused by a logic
    error and survived to release, you have another problem. Find out how to improve
    your development process so that any similar bugs are found much sooner.


    **1.2 Why Perl?**


    Chances are, if you use Perl you know why you picked it and don''t need further
    proselytizing.


    But additional ammunition never hurts—if you have to defend Perl up your management
    chain, well, Perl doesn''t have a megamultinational conglomerate to pour zillions
    of dollars into a marketing campaign[2]— so it falls to users like us to sing
    its praises in practical ways.


    [2] If you think we have a specific example in mind, you''re probably right.


    Whenever we have a problem we need to solve with a program, the solution first
    shows up in our mind, in thought pictures and words, which most development methodologies
    then have us enunciate as an English (or whatever our native language is) description
    of an algorithm before ever translating it into code. If the algorithm description
    were complete and unambiguous, it could be executed by a computer if the computer
    could understand our phraseology.[3] But no parser yet exists for free-form English
    algorithm descriptions, so we translate the description into some language a machine
    *can* comprehend.


    [3] Of course, in practice, we always discover ambiguities and insufficiencies
    in the natural language description when we later code it, but this can be viewed
    as just not writing the description adequately. We suspect this is so common because
    most of us are impatient to get on with the coding anyway.


    Therein lies the rub: an ideal computer language imposes zero overhead on the
    programmer during implemention of the description. Such a thing doesn''t exist,
    so we want the language that minimizes the overhead. This can vary from task to
    task—if you''re writing a device driver, your best choice is quite likely to remain
    assembler. If you''re writing a graphical user interface, at least part of the
    problem is probably best attacked with a WYSIWYG editor that creates a layout
    specification.


    When writing a program, you''re conscious of its overhead every time you create
    a requirement on code solely to satisfy the demands of the language but not the
    problem. For example, in writing C and C++ programs, a frequent example of this
    is how to allocate memory for dynamic data structures and where and when to give
    it up.


    Perl imposes on the programmer the smallest overhead of any language we have used
    for the vast majority of problems we have had to solve. At the expense of little
    learning, we are able to create very short programs in an incredibly brief time
    to solve complex problems.


    Because the language overhead is small, changes in requirements don''t force changes
    in large unrelated sections of the code since a much more natural mapping from
    the English description of the solution to the Perl version exists. And because
    the Perl expression of the solution is so succinct, a reader can encompass more
    of it at a glance.


    In fact, in many respects, Perl resembles English in its ability to resolve ambiguities
    favorably, its intuitive and orthogonal interfaces, and even how it sounds when
    read out loud.[4] Larry Wall, Perl''s creator, often states how his background
    in linguistics led him to consciously draw such parallels.[5] Perl cognoscenti
    refer to this collective phenomenon as Perl''s DWIM (Do What I Mean) behavior.


    [4] We don''t know whether this makes Perl easier or harder to learn for nonnative
    English speakers. A research topic if ever there was one.


    [5] You can find Larry''s exposition on his guiding principle[s at: http://www.wall.org/~larry/natural.html](http://www.wall.org/~larry/natural.html).


    If you''re in need of arguments of the kind that sway managers in favor of Perl,
    see the *Perl* *Success Stories* pag[e at http://perl.oreilly.com/news/success_stories.html](http://perl.oreilly.com/news/success_stories.html).
    If you''re in need of arguments of the kind that sway scientists, see the language
    comparison paper by Lutz Prechelt to be foun[d at http://wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf](http://wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf).


    **1.3 Know the Environment**


    Knowledge of a language includes experience with the practical meanings of errors
    in different environments. If a Unix program returns the error segmentation fault
    (those of you on other systems may experience this variously as ABEND, %SYSTEM-F-ACCVIO,
    or your machine freezing), an experienced programmer will first suspect a memory
    problem, often the result of a read or write to an array beyond the array bounds.
    Another Unix error response, bus error, often occurs when a subroutine or function
    call has an improper argument list. Efficient error identification accompanies
    experience. This book tries to encapsulate experience with errors made writing
    Perl programs.


    **1.4 Know the Language**


    ![Image 8](index-10_1.jpg)


    Just as every country has its customs, so does every computer language. We use
    a language best when we adopt its customs rather than pretend we know better and
    try to force this new language to fit our old prejudices.


    Years ago, after I had been working on my first mainframe (an ICL 1903T


    running George III), I was introduced to my second (technically, a minicomputer:
    a VAX 11/780 running VAX/VMS). I spent some time defining symbols in the new operating
    system so that I could type the same commands for listing files, etc., I used
    in the old one. A wiser programmer nearby inquired, "Why would you want to make
    VMS look like George III?" Anyone who knows the relative power of their respective
    command line interfaces will appreciate the irony in this.


    Find out the common Perl idioms and practice their use. There are generally good
    reasons why they''re common. If nothing else, adopting them will make your code
    more maintainable since more people will know what it means.


    These idioms can range from the simple two-element "open or die": open FH, $file
    or die "Can''t open $file: $!\n";


    to the mind-boggling (at first sight) Schwartzian Transform:


    @sorted = map $_->[0],


    sort { $a->[1] <=> $b->[1] }


    map [ $_, sortable_func($_) ]


    @unsorted;


    The first idiom soon becomes second nature (our fingers now type it by themselves),
    although on first learning the language one might come up instead with: if (open
    FH, $file)


    {


    ...


    }


    else


    {


    die "Unable to open $file: $!\n"


    }


    It''s not hard to see why the idiom caught on. (Briefly, here''s why it works:
    open returns false if it fails, and the or logical operator is *short-circuiting,*
    which means it doesn''t evaluate its second argument if the first one is true,
    because the value of A or B is fixed as soon as we know A is true.)


    The second idiom provides an efficient way of sorting items that need manipulation
    before they can be sorted in an "ASCIIbetical" or numeric collating sequence.
    When you learn this,


    ![Image 9](index-11_1.jpg)


    ![Image 10](index-11_2.jpg)


    and realize there are only two tokens in it that can change from one invocation
    to the next,[6]


    your eye naturally spots the map-sort-map pattern and translates it to "Schwartzian
    Transform" whenever appropriate.


    [6] The comparison function can be either <=> or cmp, and the name of the function
    you provide to turn an unsortable quantity into a sortable one will vary.


    **1.5 Online Documentation**'
  toc: []
  trans: "\n\n3. 隔离 bug 所在的位置——问题出在哪里？（这就是调试器的发明原因。）\n\n4. 确定导致 bug 的条件。是什么触发了它？为什么你之前没有发现它？\n\
    \n5. 修复 bug——并始终重新测试修改过的代码。\n\n6. 这个 bug 最初是怎么进去的？如果你只是写了一个拼写错误并在 5 分钟后通过单元测试发现，那是一回事。如果\
    \ bug 是由逻辑错误引起并一直到了发布，那么你有另一个问题了。找出如何改进你的开发流程，以便任何类似的 bug 能更早被发现。\n\n## 1.2 为什么选择\
    \ Perl？\n\n很有可能，如果你使用 Perl，你知道为什么选择它，不需要进一步的传教了。\n\n但额外的论据总没有坏处——如果你必须向你的管理层为\
    \ Perl 辩护，好吧，Perl 并没有一个跨国巨型集团来投入数以亿计的资金进行营销活动[2]——所以我们需要像我们这样的用户用实际的方式来歌颂它的美德。\n\
    \n[2] 如果你认为我们心中有一个具体的例子，你可能是正确的。\n\n每当我们需要用程序解决问题时，解决方案首先出现在我们的脑海中，以思维图像和文字的形式，大多数开发方法论会在将其翻译成代码之前，让我们将其阐述为英语（或我们的母语）的算法描述。如果算法描述是完整且无歧义的，那么只要计算机能理解我们的术语，它就可以由计算机执行。[3]\
    \ 但目前不存在可以解析自由格式英语算法描述的解析器，因此我们将描述翻译成某种机器*可以*理解的语言。\n\n[3] 当然，在实践中，当我们稍后编写代码时，总是会发现自然语言描述中的歧义和不足，但这可以被视为仅仅是描述写得不够充分。我们怀疑这很常见，因为我们大多数人无论都急于尽快开始编码。\n\
    \n问题就在于：一种理想的计算机语言在实现描述时对程序员不产生任何额外开销。这样的语言并不存在，所以我们想要一种能将开销降至的语言。这因任务而异——如果你正在编写设备驱动程序，你的最佳选择很可能是汇编语言。如果你正在编写图形用户界面，至少有一部分问题可能最好用用\
    \ WYSIWYG（所见即所得）编辑器来创建一个布局规范。\n\n在编写程序时，每当你为了满足语言要求而非问题需求而对代码创建一个需求时，你都会意识到它的开销。例如，在编写\
    \ C 和 C++ 程序时，一个频繁的例子就是为动态数据结构分配内存，以及在何处何时释放内存。\n\n对于我们必须解决的大多数问题，Perl 为程序员施加了我们使用的任何语言中最小的额外开销。在付出极小学习成本的情况下，我们能够在极短的时间内创建非常短的程序来解决复杂问题。\n\
    \n因为语言开销很小，需求的变化不会迫使代码中大量无关部分发生改变，因为从解决方案的英语描述到 Perl 版本存在一种更自然的映射。而且由于 Perl 对解决方案的表达如此简洁，读者一眼过去就能涵盖更多内容。\n\
    \n事实上，在许多方面，Perl 在良好解决歧义的能力、其直观且正交的接口，甚至在读起来的听感上，都与英语相似。[4] Perl 的创始人 Larry Wall\
    \ 经常阐述，他的语言学背景如何引导他有意识地构筑这种类比。[5] Perl 的资深行家将这种集体现象称为 Perl 的 DWIM（按我意执行）行为。\n\n\
    [4] 我们不知道这是否让非英语母语者学习 Perl 变得更容易或更难。这是一个真正的研究课题。\n\n[5] 你可以在这里找到 Larry 对其指导原则的阐述：[`www.wall.org/~larry/natural.html`](http://www.wall.org/~larry/natural.html)。\n\
    \n如果你需要那些能说服经理倾向于 Perl 的论据，请查看 [`perl.oreilly.com/news/success_stories.html`](http://perl.oreilly.com/news/success_stories.html)\
    \ 上的 Perl 成功故事。如果你需要那些能说服科学家的论据，请查看 Lutz Prechelt 写的语言对比论文，地址位于 [`wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf`](http://wwwipd.ira.uka.de/~prechelt/Biblio/jccpprtTR.pdf)。\n\
    \n## 1.3 了解环境\n\n对语言的知识包括在不同环境中对错误实际含义的经验。如果一个 Unix 程序返回错误 segmentation fault（段错误，其他系统上的用户可能会将其地体验为\
    \ ABEND、%SYSTEM-F-ACCVIO 或你的机器死机），经验丰富的程序员首先会怀疑内存问题，通常是由于越界对数组进行读取或写入导致的。另一个 Unix\
    \ 错误响应 bus error（总错误）通常发生在子程序或函数调用具有不参数列表时。高效的错误识别伴随着经验。这本书试图总结编写 Perl 程序时所犯错误的经验。\n\
    \n## 1.4 了解语言\n\n![Image 8](img/index-10_1.jpg)\n\n正如每个国家都有自己的习俗，每种计算机语言也是如此。当我们采纳它的习俗而不是假装自己更懂并试图强迫这种新语言适应我们旧的偏见时，我们才能最好使用使用。\n\
    \n年前，在我于第一台大型主机（运行 George III 的 ICL 1903）工作后，我接触到了第二台（运行 VMS 的 VAX 11/780）。我花了一些时间在新系统中定义符号，以便能像在旧系统中那样列出文件等命令。一位明智的程序员问道：“你为什么想让\
    \ VMS 像 George III 一？”任何了解各自界面威力的人都会欣赏这种讽刺。\n\n找出常见的 Perl 习语并练习使用它们。它们流行通常有很好的理由。至少，采用它们会让你的代码更具可维护性。\n\
    \n这些习语的范围从简单的双元素“open or die”：`open FH, $file or die \"Can't open $file: $!\"\
    ` 到令人目眼缭乱（乍看时）的 Schwartzian Transform：\n\n```perl\n@sorted = map $_->[0],\nsort\
    \ { $a->[1] <=> $b->[1] }\nmap ...;\n```\n\n第一个习语很快就变成了本能（我们的手指现在会自动输入它），尽管初次学习语言时可能会写成：\n\
    \n```perl\nif (open FH, $file)\n{\n    ...\n}\nelse\n{\n    die \"Unable to open\
    \ $file: $!\"\n}\n```\n\n并不难理解为什么这个习语流行。（简之，这是它的工作原理：open 在失败时返回假，而 or 逻辑运算符是短路的，这意味着如果第一个参数为真，则不会求值第二个参数。）\n\
    \n第二个习语为那些在排序之前需要处理的项提供了一种高效的方法。当你学习这个时，\n\n![Image 9](img/index-11_1.jpg)\n\n\
    ![Image 10](img/index-11_2.jpg)\n\n并意识到其中只有两个标记可以在每次调用之间发生变化时，6]，你的眼睛自然会发现 map-sort-map\
    \ 模式，并在适当的情况下将其翻译为“Schwartzian Transform”。\n\n[6] 比较函数可以是 <=> 或 cmp，而且你提供的用于将不可排序数量转换为可排序数量的函数名称也会所异。\n\
    \n"
- fmt: '

    Fortunately, the documentation included with perl covers practically everything
    you could want to know about Perl. Unfortunately, practically everything you could
    want to know about Perl is an awful lot. Yet with a little guidance, you can very
    quickly learn how to navigate around it and save yourself gobs of time compared
    to the alternatives. The documentation is in the POD (Plain Old Documentation)
    format, a very simple markup language that''s part of Perl.


    Knowing your way around the documentation is an essential debugging tool. Because
    this is such an important point, we call attention to it with a device we use
    throughout this book for highlighting such tips, pompously called *Perls of Wisdom:*
    *Know the documentation. Be able to find anything in it.*


    (We have collected all these tips into a list in Appendix B for quick reference.)
    The most flagrant example of the consequences of ignoring this advice in recent
    years was the furor over the behavior of the `localtime` function after 1999.
    Many people looked at the value returned for the year and incorrectly assumed
    it was formed from the last two digits of the actual year, so they wrote windowing
    code or just tacked "19" in front of it to get the real year. Unfortunately, according
    to the Perl documentation,


    … `$year` is the number of years since 1900, that is, `$year` is 123 in year 2023,
    and *not* simply the last two digits of the year. If you assume it is, then you
    create non-Y2K-compliant programs—and you wouldn''t want to do that, would you?


    As you can tell, some text was added by documenters who were becoming frustrated
    with the lack of attention this explanation was receiving.


    In 1998 I was called to fix a program I had written over 10 years earlier on a
    VMS machine that was failing Y2K testing. I was surprised to see I had written
    windowing code assuming the year returned in a C `tm` struct contained only the
    last two digits, and as a result the program was printing dates in the year "19100".
    After I fixed the program, I found the original VMS C manual I had used when writing
    it, and looked up `localtime`. Lo and behold, it announced that the year field
    contained the last two digits! (Such a bug would not survive long in Perl''s documentation
    thanks to the open source process controlling it.)


    ### 1.5.1 Perl Documentation on Windows


    If you''re using the ActiveState port of perl for Microsoft Windows, the `perldoc`
    pages have been converted into pleasantly formatted hyperlinked HTML.[7]. You
    can reach it either through the Start button:


    [7] See the Getting Perl section in the Preface for information on how to obtain
    ActivePerl.


    Programs -> ActivePerl -> Online Documentation


    or by going to the html directory under the root of the installed ActivePerl,
    and opening the `index.htm` file there. Everything under `Core Perl FAQ`, `Core
    Perl Docs`, and most of the listings under `Module Docs` are also contained in
    the standard perl distribution you''ll find on any other platform. If you click
    on `Perl Documentation` in the main frame, you''ll be taken to the root of the
    core documentation for Perl itself rather than the pages created by ActiveState.


    This is a good way to browse the documentation, and we quite like this interface.
    However, browsing isn''t enough; you frequently need to pinpoint a particular
    section within one of the voluminous sections of documentation. Say you want to
    find out how to use `split`; you must go to the giant `perlfunc` page and scroll
    down to just the right point. To get around this problem, you can use the command
    line version, so let''s jump into a tour of `perldoc`.


    ### 1.5.2 The perldoc Command


    Every system with an installed perl distribution includes `perldoc` and the files
    it references.


    If it doesn''t, ask the person who performed the installation to do it again properly.
    To provide a tool without the documentation to use it properly isn''t technically
    one of the seven deadly sins, but we''re lobbying to get it added in their next
    release.


    Just typing `perldoc` by itself produces little output, but a tantalizing clue:


    ```

    % perldoc

    ```


    Usage: `perldoc [-h] [-r] [-i] [-v] [-t] [-u] [-m] [-l] [-F] [-X] PageName|ModuleName|ProgramName


    perldoc -f PerlFunc


    perldoc -q FAQKeywords

    ```


    The `-h` option prints more help. Also try "perldoc perldoc" to get aquainted
    with the system.


    This is information on how `perldoc` itself works, useful if you''re trying to
    find out more about the `perldoc` program, but not if you''re looking for the
    Perl manuals. If you try either of the suggestions mentioned (`perldoc -h` or
    `perldoc perldoc`), you''ll end up only with more verbose information about all
    the options `perldoc` can take.


    ![Image 11](index-13_1.jpg)


    The magic key to unlocking the door to the documents on the Perl language itself
    is `perldoc perl`:


    ```

    % perldoc perl

    ```


    [...]


    For ease of access, the Perl manual has been split up into a number of sections:


    - `perl`: Perl overview (this section)

    - `perldelta`: Perl changes since previous version

    - `perl5005delta`: Perl changes in version 5.005

    - `perl5004delta`: Perl changes in version 5.004

    - `perlfaq`: Perl frequently asked questions


    [...]


    Bingo! All the different sections you can peruse with `perldoc` are laid out before
    you, which leads us to our second Perl of Wisdom:


    To get started with the perl documentation, type perldoc perl.


    The reason it''s this way is that a behind-the-scenes equivalence exists between
    the `perldoc` sections and Unix manual pages. On Unix systems, the same sections
    can be read with the `man` command, and the master document is the one from `man
    perl`, which any Unix user would automatically use first to learn about Perl.


    Now you can browse each of the different listed sections simply by typing `perldoc`
    followed by the section name:


    ```

    % perldoc perldelta

    ```


    NAME


    perldelta - what''s new for perl5.005


    DESCRIPTION


    This document describes differences between the 5.004


    release and this one.


    [...]

    ```


    The list of sections you see under `perldoc perl` has thoughtfully been arranged
    in a logical order for browsing. Here are our quick tips that tell you which section
    to use for a particular purpose:


    - **perlsyn:** Perl programs are made up largely of variables being manipulated
    by function calls or operators. What''s in between the variables, functions, and
    operators is syntax. Here you''ll find all the information on, for instance, how
    looping statements work, and how to put an if modifier after a statement.

    - **perldata:** This section tells you about all the different kinds of variables
    you can create in your programs. Don''t look here for multidimensional arrays
    (lists of lists, in Perlance) though; we''ll get to them.

    - **perlop:** Here you''ll learn all about Perl''s vast panoply of operators,
    ranging from the mundane `+` `-` `*` `/` to the magical powers of applying postincrement
    (`++`) to strings. There are some entries you might not expect to find here: the
    use of commas to separate list members, the different ways of quoting strings
    and how interpolation works inside them, how the `m//` (match) and `s///` (substitute)
    operators work (but the regular expressions they take as an argument are documented
    under `perlre`), the use of backticks to capture program output, reading lines
    from filehandles, and the mysteries of floating point numbers.

    - **perlre:** This is where you can find out how to write regular expressions.
    Perl has easily the most powerful, "featureful" implementation of regular expressions
    anywhere. This section covers all the details from the most basic to the most
    advanced; read as far as you can without your head actually exploding and leave
    the rest for when you recover your strength.

    - **perllol:** When you want to know how to implement multidimensional arrays,
    or complex data structures, this is the place to come. "lol" stands for "lists
    of lists,"

