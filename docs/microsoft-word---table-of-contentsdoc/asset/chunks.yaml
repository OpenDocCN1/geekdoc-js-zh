    Yuck! What can we do about this? Is the solution to say that you shouldn''t nest
    one loop that uses `$_` as the loop variable inside another? Consider the following:
    sub proc


    ```perl

    sub proc


    {


    while (<STDIN>)

    {


    # do something

    }

    }

    ```


    Now do we have to check every place that calls `proc()` and its ancestors to see
    if it''s inside a `foreach` loop? Hardly.


    What we can do is remember that `while` is the only loop statement that doesn''t
    localize `$_`, so we just need to do it ourselves whenever we construct a `while`
    statement that might end up in a context where `$_` is already in use:


    ```perl

    sub proc


    {


    local $_;

    while (<STDIN>)

    {


    # do something

    }

    }

    ```


    Now you can safely call `proc()` from within a `foreach` loop to your heart''s
    content.


    **When using a `while` loop that sets `$_`, localize `$_` first if it might be
    called from elsewhere.**


    Note that when we say *localize,* this really does call for the local operator,
    which we otherwise prefer to avoid. Reason: you can''t make a lexical `$_` with
    `my`, because it''s a special pseudo-global variable that just won''t stand for
    possessiveness.


    ### 4.1.2 The Case of the Vanishing Parentheses


    Unlike practically every other procedural language in existence, when you call
    a function or procedure in Perl (both of which are just "subroutines" in Perl
    parlance), it is not always necessary to put its arguments inside parentheses.
    If Perl can tell what the arguments are without the parentheses, you don''t have
    to put them in. This makes for more readable code, not to mention less typing;
    for instance


    ```perl

    print join '' '', reverse split /:/;

    ```


    is arguably more aesthetic than


    ```perl

    print(join('' '', reverse(split(/:/))));

    ```


    and stops you from feeling like you''re typing LISP.


    On the other hand, be careful not to leave them out when they''re necessary:


    ```perl

    my %userdb = (pjscott => "Peter Scott",


    ewright => "Ed Wright");

    print "Usernames: ", join " ", sort keys %userdb, "\n";

    ```


    results in


    ```

    Usernames:

    ewright pjscott

    ```


    with no newline on the end. This happens because the prototype for `sort` is `sort
    optional_subroutine_or_block *LIST` and so how is Perl to know where the `LIST`
    ends? As long as there are terms that look like list elements, they''ll get included,
    and that means the `"\n"` is sorted along with the hash keys. So you''ll actually
    have to bend your fingers over to the parenthesis keys in this case and type


    ```perl

    print "Usernames: ", join " ", sort (keys %userdb), "\n";

    ```


    In fact, there''s more than one way to do this, and it''s instructive to look
    at some of the other possibilities:


    ```perl

    print "Usernames: ", join " ", (sort keys %userdb), "\n";

    print "Usernames: ", join (" ", sort keys %userdb), "\n";

    print "Usernames: ", (join " ", sort keys %userdb), "\n";

    ```


    We''re using two different ways of limiting the scope of the `sort` arguments
    here. One is to put the arguments to a function in parentheses; the other is to
    put the function name along with its arguments in parentheses. We get the same
    result by two different means: When the function arguments are contained in parentheses,
    Perl exercises a parsing rule called "if-it-looks-like-a-function-then-it-is-a-function,"
    and the parentheses delineate the function argument list. When the function and
    its arguments are contained within parentheses, the parentheses create a term,
    keeping the `sort` from consuming any arguments outside the term (see Table 4-1
    in section 4.2).


    What about this:


    ```perl

    print ("Usernames: ", join " ", sort keys %userdb), "\n";

    ```


    If you try this without the `-w` flag, you''ll see that the newline isn''t printed.
    If you put the `-w` flag in, you find out why:


    ```

    print (...) interpreted as function at line 1.

    Useless use of a constant in void context at line 1.

    ```


    The reason for this is apparent from the rules we''ve already stated: Perl is
    exercising the `if-it-looks-like-a-function-then-it-is-a-function` rule, which
    means that the arguments to the `print` function are contained within the parentheses,
    and what follows is a comma operator and a constant. Since that constant isn''t
    being assigned or passed to anything, it serves no purpose, and Perl warns us
    that we''re putting a constant in a place where it does nothing.[2]


    [2] If you''re wondering why Perl doesn''t raise a similar objection to the "1"
    that you should put at the end of a module that gets used or required, the answer
    is that it is at the end of a notional block—the file itself—and therefore gets
    parsed as a return value.


    If you find yourself confronting that warning but you really did mean what you
    said and you want the warning to go away, you can put a `+` in front of the parentheses:
    `print +("Usernames: ", join " ", sort keys %userdb), "\n";` which doesn''t change
    what gets printed but does create the interpretation you want. Usually, however,
    nothing so unintuitive is called for. If you want to execute multiple statements
    without having to put them in a block, the low-precedence logical and is perfect:


    ```perl

    warn "We''re out of $food\n" and return

    unless exists $menu{$food};

    ```


    This doesn''t need any parentheses at all. (But make sure the statement before
    the `and` is bound to evaluate as true.)


    Here''s another example of the same problem: trying to populate an array with
    this code:


    ```perl

    my @nums = 1..100;

    my %square = map ($_, $_), @nums;

    ```


    Perl thinks that what follows may be an argument, causing the complaint `Use of
    array in void context`. This can be cured by placing + in front of parentheses.


    ### 4.1.3 The Many Faces of {}


    When you think about the myriad uses of braces,[4] it''s amazing that Perl can
    keep them all straight. They''re used for delineating code blocks, hash keys,
    anonymous hash references, and regular expression quantifiers, and can also be
    used as delimiters for the `q`, `qq`, `qr`, `qw`, `qx`, `m//`, `s///`, and `tr//`
    operators. Those code blocks are used in many places, like subroutine declarations,
    sort or map routines, or even part of a variable identifier:


    ```perl

    print "Three largest cities: @{$state_info{NY}{Megalopoles}}[0..2]";

    ```


    [4] In Perl. We don''t want to know what else you use something for holding your
    pants or your teeth together.


    The amazing thing is that Perl has so many uses for braces yet hardly needs help
    telling which one you mean. Because there are so many ways in which braces are
    valid in Perl, though, incorrect use may generate no message or something cryptic.
    The most common brace mistake for newcomers is hash initializations:


    ```perl

    my %queen = { Britain => ''Elizabeth'',


    Netherlands => ''Beatrix'' }; # Wrong!

    ```


    This is so common that it is specifically checked for by `-w`, which gives the
    warning `Reference found where even-sized list expected`.

