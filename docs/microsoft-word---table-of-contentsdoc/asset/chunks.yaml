    only if the user put it on the command line. If it was, then we logically ORed
    together the values in the hash whose keys are each string between commas in the
    option value and, of course, provided feedback if the user specified an incorrect
    one.


    **5.5 Taking the Long Way Around**


    There''s an alternative way of option parsing using the core module Getopt::Long:
    use Getopt::Long;


    use constant WEB => 1;


    use constant SQL => 2;


    use constant REG => 4;


    my %dbg_flag = (


    WEB => WEB,


