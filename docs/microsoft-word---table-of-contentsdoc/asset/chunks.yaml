    **13.5 Security**


    Not long ago, security was still considered optional by many people. Today that
    attitude is widely recognized as dangerous to others as well as oneself. The issue
    of security on the Internet has garnered universal attention, and one of the ways
    a host can be broken into is through a poorly written CGI program.


